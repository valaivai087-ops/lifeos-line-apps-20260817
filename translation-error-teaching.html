<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>中譯英｜錯誤診斷教學</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#22252a;--sub:#6a7078;--line:#dedbd3;--acc:#2f6f5e;--accbg:#e6f1ed;--bad:#b0442c;--badbg:#f9e9e4}
@media(prefers-color-scheme:dark){:root{--bg:#17191c;--card:#22252a;--ink:#e8e6e1;--sub:#9aa0a8;--line:#383c43;--acc:#7cc4ae;--accbg:#24372f;--bad:#eb9a85;--badbg:#3d2822}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:22px;margin:0}h2{font-size:19px;margin:20px 0 6px}h3{font-size:16px;margin:16px 0 6px}
.sub{color:var(--sub);font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
input,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
#q{flex:1;min-width:160px}
button{cursor:pointer;text-align:left}button:hover:not(:disabled){border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.msg{background:var(--accbg);border-radius:12px;padding:12px 14px;margin:10px 0}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;margin:6px 0}
.tag{display:inline-block;border-radius:6px;padding:0 8px;font-size:13px;white-space:nowrap;background:var(--accbg);color:var(--acc)}
.tag.b{background:var(--badbg);color:var(--bad)}
.zh{font-weight:600}
.no{color:var(--bad)}.ok{color:var(--acc);font-weight:600}
.en{font-family:Georgia,"Times New Roman",serif}
.opt{display:block;width:100%;margin:6px 0}
.opt.right{background:var(--accbg);border-color:var(--acc)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.why{margin-top:8px;padding:8px 12px;border-left:3px solid var(--acc);background:var(--accbg);border-radius:0 8px 8px 0;font-size:15px}
ol{padding-left:22px;margin:6px 0}
</style>
</head>

'翻譯秘訣':`「近年來」|in recent years，動詞常用現在完成式|近年來物價上漲。→ In recent years, prices have risen.
「越來越受歡迎」|become more and more popular|Online shopping is becoming more and more popular.
「受…歡迎」|be popular with / among|這首歌很受年輕人歡迎。→ The song is popular among young people.
「隨著…的普及」|with the popularity of|With the popularity of smartphones, people read less.
「使…成為可能」|make it possible to V|科技使在家工作成為可能。→ Technology makes it possible to work from home.
「…的數量」|the number of + 複數名詞（單數動詞）|觀光客的數量增加了。→ The number of tourists has increased.
「在…方面」|in terms of；in|在價格方面 → in terms of price
「是否」|whether|我不知道他是否會來。→ I don't know whether he will come.
「所謂的」|so-called|所謂的專家 → the so-called experts
「養成習慣」|develop / form a habit of + Ving|養成閱讀的習慣 → develop a habit of reading
「造成傷害」|do harm to；cause damage to|Plastic does harm to the ocean.
「面臨」|face；be faced with|我們面臨很多挑戰。→ We face many challenges.
「採取措施」|take measures / take action|The government should take action.
「提高意識」|raise awareness of|提高環保意識 → raise awareness of environmental protection
「適應」|adapt to；get used to|適應新環境 → adapt to a new environment
「有助於」|help (to) V；be helpful to|閱讀有助於學習。→ Reading helps us learn.
「與…有關」|be related to；have something to do with|這和天氣有關。→ It is related to the weather.
「越來越少」|可數 fewer and fewer；不可數 less and less|越來越少人寫信。→ Fewer and fewer people write letters.
「大幅」「逐漸」|greatly / significantly；gradually|價格大幅上漲。→ Prices have risen greatly.
「佔」|account for；make up|女性佔一半。→ Women make up half.
「平均」|on average；the average + 名詞|平均每人 → on average, each person
「根據統計／研究」|according to statistics / a study|According to a study, sleep helps memory.
「扮演重要角色」|play an important role in|Parents play an important role in education.
「對…有好處／壞處」|be good / bad for|蔬菜對健康有好處。→ Vegetables are good for your health.
「代替」|instead of + 名詞／Ving|走路代替開車 → walk instead of driving
「而不是」|rather than；instead of|選擇品質而不是價格 → choose quality rather than price
「以…聞名」|be famous for|台灣以美食聞名。→ Taiwan is famous for its food.
「位於」|be located in / on / at|這家店位於市中心。→ The shop is located in the city center.
「舉辦」「舉行」|hold；take place|比賽在週六舉行。→ The game will take place on Saturday.
「感到」＋情緒|feel + 形容詞（人用 -ed）|我感到失望。→ I feel disappointed.
「令人…的」|用 -ing 形容詞|令人興奮的消息 → exciting news
主詞太長時|用 It 當虛主詞，把長的放後面|每天運動很重要。→ It is important to exercise every day.
中文一串動詞|分清主要動詞，其餘用 to V、Ving 或 and|他走過去打開門。→ He walked over and opened the door.
「例如…等等」|such as A, B, and C（不再加 etc.）|水果，例如蘋果和香蕉 → fruit, such as apples and bananas
「們」和複數|中文沒有「們」，英文名詞也要看是不是複數|很多學生 → many students
「一個」不要漏|單數可數名詞前要有 a / an / the|他是老師。→ He is a teacher.
時間地點的位置|可放句首加逗號，或放句尾|在台灣，夏天很熱。→ In Taiwan, summer is hot.
「去年／下週／每天」|前面不加 in / on / at|我去年去了日本。→ I went to Japan last year.
「在…歲時」|at the age of；when + 主詞 + was|在十歲時 → at the age of ten
「…年前」「…年後」|… ago（從現在算）；… later（從過去某時算）|三年前 → three years ago
「直到…才」|not … until|我直到昨天才知道。→ I didn't know until yesterday.
「連…都」|even|連小孩都知道。→ Even children know it.
「只有…才」|only|只有努力才能成功。→ Only hard work leads to success.
「再也不」|not … anymore；no longer|我再也不怕了。→ I am not afraid anymore.
「差一點」|almost / nearly|我差一點遲到。→ I was almost late.`

  <div class="card"><h3 style="margin-top:0">第一步：找出卡在哪裡</h3>
   <div class="sub">12 題選擇題，每種錯誤類型一題，做完會告訴你建議先學哪幾課。</div>
   <div class="bar"><button class="pri" id="start">開始診斷</button>${st.weak.length?`<span class="sub">上次診斷：建議先學 ${st.weak.length} 課</span>`:''}</div></div>
  <h2>第二步：一課一課學</h2>
  ${A.map(a=>`<h3>${a.n}</h3><div class="sub">${a.d}</div>${a.s.map(s=>`<button class="item" data-sub="${s.id}"><b>${s.n}</b>${badge(s)}</button>`).join('')}`).join('')}`;
}
function search(t){
  quiz=null;t=t.toLowerCase();
  const hit=SUBS.filter(s=>JSON.stringify([s.n,s.c,s.st,s.ex,s.q,A[s.a].n]).toLowerCase().includes(t));
  const lh=[];Object.keys(LIB).forEach(k=>libAll(k).forEach(x=>{if(x.e.join(' ').toLowerCase().includes(t))lh.push(libCard(x.e,undefined,k))}));
  app.innerHTML=`<h2>課程（${hit.length}）</h2>`+(hit.map(subBtn).join('')||'<p class="sub">沒有相關課程。</p>')+
   `<h2>秘笈庫（${lh.length}）</h2>`+(lh.join('')||'<p class="sub">秘笈庫裡沒有相關內容。</p>');
}
function lesson(id){
  quiz=null;const s=SUBS.find(x=>x.id===id);
  app.innerHTML=`<div class="sub" style="margin-top:14px">${A[s.a].n}</div><h2 style="margin-top:0">${s.n}</h2>
  <div class="card"><b>這是什麼錯？</b><br>${s.c}</div>
  <div class="card"><b>可以這樣做</b><ol>${s.st.map(x=>`<li>${x}</li>`).join('')}</ol></div>
  <h3>看例子</h3>
  ${s.ex.map(e=>`<div class="card"><div class="zh">${esc(e[0])}</div><div class="en no">✗ ${esc(e[1])}</div><div class="en ok">✓ ${esc(e[2])}</div><div class="sub">${esc(e[3])}</div></div>`).join('')}
  <h3>換你練習</h3>
  ${s.q.map((q,i)=>qHtml(s,q,'練習 '+(i+1)+' / '+s.q.length)).join('')}
  <div id="fin"></div>`;
  scrollTo(0,0);
}
function startQuiz(){
  quiz={list:shuf(SUBS.map(s=>({s,q:s.q[Math.floor(Math.random()*s.q.length)]}))),i:0,miss:[]};showQuiz();
}
function showQuiz(){
  const x=quiz.list[quiz.i];
  app.innerHTML=`<h2>診斷測驗</h2>${qHtml(x.s,x.q,'第 '+(quiz.i+1)+' 題 / 共 '+quiz.list.length+' 題')}<div id="fin"></div>`;
  scrollTo(0,0);
}
function result(){
  const miss=quiz.miss;st.weak=miss.slice();save();
  app.innerHTML=`<h2>診斷結果</h2>
  <div class="msg">答對 <b>${quiz.list.length-miss.length}</b> / ${quiz.list.length} 題。${miss.length?'下面是這次沒通過的類型，建議從第一個開始學。':'這次全部通過，可以挑有興趣的課再練習。'}</div>
  ${A.map((a,i)=>{const m=a.s.filter(s=>miss.includes(s.id)).length;return `<div class="item"><span>${a.n}</span><span class="tag${m?' b':''}">${a.s.length-m} / ${a.s.length}</span></div>`}).join('')}
  ${miss.length?'<h3>建議先學</h3>'+miss.map(id=>subBtn(SUBS.find(s=>s.id===id))).join(''):''}
  <p class="sub">每種類型只考一題，答錯一次只是一個訊號，不代表你這方面一定不好。學完課程後換題再測，結果會更可靠；不同的合理寫法可以請老師一起看。</p>
  <div class="bar"><button class="pri" id="start">再測一次</button></div>`;
  quiz=null;scrollTo(0,0);
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='home'){$('#q').value='';return home()}
  if(t.id==='start')return startQuiz();
  if(t.id==='lib'){$('#q').value='';return lib()}
  if(t.dataset.tab){tab=t.dataset.tab;return lib()}
  if(t.dataset.rm){if(confirm('確定刪除這一筆？')){st.mine.splice(+t.dataset.rm,1);save();lib()}return}
  if(t.id==='next'){quiz.i++;return quiz.i<quiz.list.length?showQuiz():result()}
  if(t.dataset.sub)return lesson(t.dataset.sub);
  if(t.classList.contains('opt')){
    const box=t.closest('.q'),ok=t.dataset.ok==='1',id=box.dataset.sub;
    box.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.ok==='1')b.classList.add('right')});
    if(!ok)t.classList.add('wrong');
    box.dataset.r=ok?1:0;
    const w=box.querySelector('.why');w.hidden=false;w.innerHTML=(ok?'<b>答對了。</b>':'<b>這題先記下來。</b>')+w.innerHTML;
    if(quiz){
      if(!ok)quiz.miss.push(id);
      $('#fin').innerHTML=`<div class="bar"><button class="pri" id="next">${quiz.i+1<quiz.list.length?'下一題':'看診斷結果'}</button></div>`;
    }else{
      const all=[...document.querySelectorAll('.q')];
      if(all.every(b=>b.dataset.r)){
        const good=all.every(b=>b.dataset.r==='1');
        if(!st.done.includes(id))st.done.push(id);
        if(good)st.weak=st.weak.filter(x=>x!==id);
        save();
        $('#fin').innerHTML=`<div class="msg">${good?'三題都答對，這一課完成了。':'有幾題沒過沒關係，回頭再看一次例子，下次再練。'}</div><div class="bar"><button data-sub="${id}">再練一次</button></div>`;
      }
    }
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  st.mine.push({t:tab,a:f.a.value.trim(),b:f.b.value.trim(),c:f.c.value.trim()});save();lib();
});
$('#q').oninput=e=>{const t=e.target.value.trim();t?search(t):home()};
home();
</script>
</body>
</html>
