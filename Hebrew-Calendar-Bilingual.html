    init();
});

function init() {
    renderMonths();
    renderTabs();
    renderData(0);
    document.getElementById('lang-zh').addEventListener('click', function() { setLang('zh'); });
    document.getElementById('lang-en').addEventListener('click', function() { setLang('en'); });
    document.getElementById('speakBtn').addEventListener('click', function() { speakCurrent(); });
}

function renderMonths() {
    let html = '';
    data.forEach((m, i) => {
        html += '<button class="btn-month' + (i === 0 ? ' active' : '') + '" onclick="selectMonth(' + i + ')">' + m.id + '. ' + m.name.split(' ')[0] + '</button>';
    });
    document.getElementById('sidebar').innerHTML = html;
}

function renderTabs() {
    const tabs = ['基本 Basic', '聖經 Bible', '功課 Practice', '模型 Models', '品格 Character', '恩典 Grace'];
    let html = '';
    tabs.forEach((t, i) => {
        html += '<button class="tab-btn' + (i === 0 ? ' active' : '') + '" onclick="switchTab(' + i + ')">' + t + '</button>';
    });
    document.getElementById('tabs').innerHTML = html;
}

function setLang(l) {
    lang = l;
    document.getElementById('lang-zh').classList.remove('active');
    document.getElementById('lang-en').classList.remove('active');
    if(l === 'zh') document.getElementById('lang-zh').classList.add('active');
    else document.getElementById('lang-en').classList.add('active');
    
    document.querySelectorAll('.zh').forEach(e => e.style.display = 'block');
    document.querySelectorAll('.en').forEach(e => e.style.display = 'none');
    if(l === 'en') {
        document.querySelectorAll('.zh').forEach(e => e.style.display = 'none');
        document.querySelectorAll('.en').forEach(e => e.style.display = 'block');
    }
}

function selectMonth(i) {
    document.querySelectorAll('.btn-month').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.btn-month')[i].classList.add('active');
    renderData(i);
}

function renderData(idx) {
    const m = data[idx];
    const keys = ['date', 'season', 'climate', 'events', 'periods', 'figure', 'bible', 'god', 'human', 'wisdom', 'body', 'heart', 'spirit', 'relation', 'family', 'work', 'modelOld', 'modelNew', 'char', 'fruit', 'blessing', 'action', 'course'];
    const labels = {date:'國曆/Calendar', season:'季節/Season', climate:'氣候/Climate', events:'事件/Events', periods:'節期/Periods', figure:'人物/Figures', bible:'聖經/Scripture', god:'神的作為/Gods Works', human:'人的反應/Human Response', wisdom:'智慧/Wisdom', body:'身體/Body', heart:'心理/Heart', spirit:'靈性/Spirit', relation:'關係/Relations', family:'家庭/Family', work:'工作/Work', modelOld:'舊模型/Old Model', modelNew:'新模型/New Model', char:'品格/Character', fruit:'果子/Fruit', blessing:'恩典/Blessing', action:'行動/Action', course:'36課/36 Courses'};
    
    let html = '';
    keys.forEach(k => {
        if(m[k]) {
            const parts = m[k].split(' / ');
            const zh_text = parts[0] || '';
            const en_text = parts.slice(1).join(' / ') || parts[0];
            html += '<div class="section"><h4>' + labels[k] + ' <span class="speaker" onclick="speak(\'' + en_text.replace(/'/g, "&#39;") + '\')">🔊</span></h4>';
            html += '<div class="box"><span class="zh">' + zh_text + '</span><span class="en">' + en_text + '</span></div></div>';
        }
    });
    document.getElementById('data').innerHTML = html;
}

function switchTab(i) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-btn')[i].classList.add('active');
}

function speak(text) {
    if('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = 0.9;
        window.speechSynthesis.speak(u);
    }
}

function speakCurrent() {
    const active = document.querySelector('.btn-month.active');
    if(active) {
        const idx = Array.from(document.querySelectorAll('.btn-month')).indexOf(active);
        const texts = document.querySelectorAll('.data .en');
        let fullText = '';
        texts.forEach(t => {
            if(t.style.display !== 'none') fullText += t.innerText + '. ';
        });
        if(fullText) speak(fullText);
    }
}
    </script>
