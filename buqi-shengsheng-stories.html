<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>不器生生｜臉書金句圖文</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#2b2622;--mute:#8a8178;--line:#e6dfd5;--acc:#b0532f;--acc2:#2f6f6a;--soft:#fbf1ea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;line-height:1.7}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.05em}
header input{flex:1;min-width:180px;padding:8px 12px;border-radius:8px;border:0;font-size:15px}
.tabs button{background:transparent;color:#ddd;border:1px solid #555;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:14px}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.wrap{display:flex;max-width:1400px;margin:0 auto}
nav{width:300px;flex-shrink:0;height:calc(100vh - 56px);overflow:auto;position:sticky;top:56px;border-right:1px solid var(--line);background:#fffdf9}
nav a{display:block;padding:9px 14px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px;cursor:pointer}
nav a:hover,nav a.on{background:var(--soft);color:var(--acc)}
nav a small{color:var(--mute);margin-right:6px}
main{flex:1;padding:20px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
h2{margin:0 0 6px;font-size:22px}
h3{margin:0 0 10px;font-size:16px;color:var(--acc2)}
.prop{background:linear-gradient(135deg,#2b2622,#5a3a2b);color:#fff;border-radius:12px;padding:22px;font-size:20px;font-weight:700;text-align:center;margin-bottom:16px}
.prop small{display:block;font-size:12px;font-weight:400;opacity:.7;margin-bottom:6px;letter-spacing:.2em}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.node{flex:1;min-width:110px;background:var(--soft);border:2px solid var(--acc);border-radius:10px;padding:10px;text-align:center;font-weight:700;font-size:14px;position:relative}
.node i{display:block;font-style:normal;font-size:11px;color:var(--acc);font-weight:400}
.arr{align-self:center;color:var(--acc);font-size:20px}
.mech{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.mech div{border-left:4px solid var(--acc2);background:#f2f7f6;padding:8px 10px;border-radius:6px;font-size:14px}
.mech b{display:block;color:var(--acc2);font-size:12px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.qbox{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fffdf9}
.qbox h4{margin:0 0 6px;font-size:13px;color:#fff;background:var(--acc);display:inline-block;padding:1px 10px;border-radius:20px}
.qbox p{margin:6px 0;font-size:15px;padding-left:10px;border-left:2px solid var(--line)}
.btn{background:var(--acc2);color:#fff;border:0;border-radius:6px;padding:7px 14px;cursor:pointer;font-size:14px}
.raw{white-space:pre-wrap;font-size:15px;color:#3d3631}
details summary{cursor:pointer;font-weight:700;color:var(--acc2)}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
th,td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
th{background:var(--ink);color:#fff;position:sticky;top:56px}
tr:nth-child(even) td{background:#fbf8f4}
td.n{white-space:nowrap;color:var(--mute)}
td a{color:var(--acc);cursor:pointer}
mark{background:#ffe28a}
.cardwrap{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.cardwrap img{width:360px;max-width:100%;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.cardtxt p{margin:4px 0;font-size:16px}
.cardbtns{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.hide{display:none}
#sel{display:none;max-width:100%;padding:7px;border-radius:8px;font-size:14px}
@media(max-width:820px){nav{display:none}#sel{display:block;width:100%}.mech{grid-template-columns:1fr}main{padding:12px 16px}.qgrid{grid-template-columns:1fr}.node{min-width:40%}table{font-size:12px}.tblwrap{overflow-x:auto}}
@media print{header,nav{display:none}main{padding:0}th{position:static}}
</style>
</head>
<body>
<header>
<h1>不器生生</h1>
<input id="q" placeholder="搜尋標題、原文、金句…">
<select id="sel"></select>
<div class="tabs"><button id="t1" class="on">逐篇圖文</button> <button id="t2">機制總表</button></div>
</header>
<div class="wrap">
<nav id="nav"></nav>
<main id="main"></main>
</div>
<script>
const D=[{"t": "6道題測出你的邏輯思維卡在哪？", "b": "市面上大部分\"邏輯測試\"要麼是腦筋急轉彎（有趣但不測邏輯），要麼是編造的偽心理測試（看起來專業實則瞎編分數）。\n\n這次的6道題不一樣，全部來自認知科學和行為經濟學裡被反覆引用、有明確出處的經典研究正規化——認知反射測試、選擇任務、合取謬誤、信念偏差，每一道都有真實來源。它能做的，是幫你大致照見——你的思維容易在哪一類問題上卡殼。\n\n憑第一反應答題，別搜答案，看看你能踩中幾個陷阱\n#邏輯思維 #認知科學 #思維訓練 #決策認知 #自我提升 #底層邏輯 #邏輯測試\n7月14日", "q": {"哲": ["最危險的錯誤，是你從未察覺自己會犯的那一種。", "直覺是捷徑，也是陷阱。", "照見盲點，是理性的第一步。", "真正的聰明，不是不犯錯，而是知道自己會在哪裡犯錯。"], "排": ["認知反射、選擇任務、合取謬誤、信念偏差。", "不是急轉彎，不是偽測驗，不是瞎編分數。", "憑第一反應，別搜答案，看看踩中幾個陷阱。", "看見卡點，理解卡點，跨過卡點。"], "對": ["腦筋急轉彎很有趣，卻不測邏輯。", "看起來專業的測驗，可能只是瞎編的分數。", "第一反應很快，第二思考才準。", "相信直覺很輕鬆，檢驗直覺才清醒。"], "反": ["你確定自己的直覺，真的可靠嗎？", "你是在思考，還是在順著第一反應走？", "如果經典實驗裡大多數人都錯了，你憑什麼例外？", "你知道自己的思維最容易卡在哪裡嗎？"], "衝": ["一道看似簡單的題，你秒答，結果卻錯了。", "你很有把握地選了答案，看到解析時愣住了。", "同事說你邏輯很好，你卻在三道題上連續中招。"], "翻": ["答錯不是笨，是人類大腦的普遍規律。", "測驗不是為了打分，是為了照見。", "越自信的直覺，越值得被檢驗。", "邏輯能力不是天生，是覺察後的練習。"], "遞": ["先作答，再對照，再覺察，最後修正。", "從第一反應，到慢思考，到清晰判斷。", "看見陷阱，避開陷阱，識破陷阱。"], "詩": ["看看你能踩中幾個陷阱，也看看你能跨過幾個。", "願你的思考，經得起自己的追問。", "鏡子照見的不是缺點，是成長的方向。", "清醒，從知道自己會錯開始。"]}, "p": "邏輯不是聰明的炫技，而是照見自己思維容易卡殼之處的鏡子。", "f": ["市面邏輯測試多是急轉彎或偽測驗", "改用認知科學經典研究", "認知反射、選擇任務、合取謬誤、信念偏差", "憑第一反應作答", "照見思維卡點"], "pain": "以為自己很理性，卻不知道思維在哪類問題上會出錯", "m": "經典實驗題型→觸發直覺系統→暴露系統性偏誤→覺察後可修正", "a": "憑第一反應做完 6 題，記下自己錯在哪一類", "c": ["直覺是捷徑，也是陷阱。", "第一反應很快，第二思考才準。", "越自信的直覺，越值得被檢驗。", "清醒，從知道自己會錯開始。"]}, {"t": "12個頂級思維模型|從看清到做到，一次講透", "b": "網上講思維模型的內容很多，\n但 大多數問題是：\n要麼羅列一堆概念，看完更亂；\n要麼只講名字，不講怎麼用；\n要麼東拼西湊，缺少篩選和結構。\n\n所以這次我沒有做“模型大雜燴”，\n而是認真整理了一套：\n12個精選思維模型\n並且按 輸入 → 認知 → 決策 → 輸出\n做成一套更容易理解、也更容易落地的閉環框架。\n\n這套內容的特別之處在於：\n① 精選，不雜亂\n不是模型大拼盤，而是高頻核心模型篩選。\n② 有結構，不零散\n不是東一個西一個，而是從輸入到輸出完整串起來。\n③ 能落地，不空談\n不只講“是什麼”，還會講“怎麼用”。\n④ 更嚴謹，更省篩選成本\n儘量按經典定義核查，幫你少走彎路。\n\n如果你最近也在經歷：\n知道很多，但想不清；\n學了很多，但用不上；\n這組建議收藏，慢慢看。\n\n#思維模型 #認知提升 #決策思維 #邏輯思維 #成長乾貨   #高效學習 #認知升級 #職場成長 #AI時代\n編輯時間：6月24日", "q": {"哲": ["模型不是越多越好，而是越用越好。", "沒有結構的知識，只是一堆碎片。", "從看清到做到，中間隔著一套閉環。", "真正的認知升級，是把知道變成用得上。"], "排": ["精選不雜亂，有結構不零散，能落地不空談，更嚴謹更省成本。", "輸入、認知、決策、輸出。", "知道很多，想不清；學了很多，用不上。", "篩選、串聯、落地。"], "對": ["模型大雜燴讓你更亂，精選閉環讓你更清。", "只講名字是知識，講怎麼用才是能力。", "東拼西湊是收藏，完整串聯是體系。", "看完更亂，不如看完就用。"], "反": ["你收藏的模型，真正用過幾個？", "你的思考，有從輸入走到輸出嗎？", "知道一百個概念，能解決一個問題嗎？", "你缺的是更多模型，還是一套結構？"], "衝": ["你收藏了五十個思維模型，遇到問題時卻一個都想不起來。", "開會時你說了一堆概念，主管問「所以怎麼做」，你答不出來。", "你學了第一性原理，卻還是用老方法解決新問題。"], "翻": ["學得多不等於想得清。", "少而精，勝過多而雜。", "模型的價值不在知道，而在使用。", "結構，才是思維的骨架。"], "遞": ["先輸入資訊，再形成認知，再做出決策，最後輸出行動。", "從看清，到想透，到做到。", "篩選、結構、落地、閉環。"], "詩": ["從看清到做到，一次講透。", "願你的知識，都能長成解決問題的能力。", "一套閉環，勝過千條碎片。", "慢慢看，慢慢用，慢慢變清晰。"]}, "p": "思維模型不在多，而在有結構、能落地，串成輸入到輸出的閉環。", "f": ["思維模型內容雜亂", "精選 12 個高頻核心模型", "按輸入、認知、決策、輸出串成閉環", "講是什麼也講怎麼用", "知道很多變成想得清、用得上"], "pain": "知道很多卻想不清，學了很多卻用不上", "m": "篩選＋結構化＋場景化→模型從概念變成可用工具→形成完整思考閉環", "a": "挑一個正在面對的問題，依「輸入→認知→決策→輸出」走一遍", "c": ["沒有結構的知識，只是一堆碎片。", "篩選、串聯、落地。", "看完更亂，不如看完就用。", "慢慢看，慢慢用，慢慢變清晰。"]}, {"t": "有的人讓你走的更遠，有的人讓你墜入深淵", "b": "人不是一座孤島。你的世界裡，有你，也有與你相遇、同行的人🌊\n\n有的人陪你走過一段低谷，有的人與你把一個想法慢慢做成。也有的人，最初靠近時很溫暖，相處久了，卻讓你越來越疲憊💔\n\n我們都希望遇到自己的“良人”——可以放心說話的朋友，能夠並肩做事的搭檔。那麼，在交出信任之前，怎樣多瞭解眼前的人🤔\n\n這組卡片整理了三個觀察角度。從日常細節，到待人做事，幫你慢慢判斷：誰值得與你繼續同行💡#人間觀察 #職場經驗howto #識人 #判斷 #選擇 #關係哲思 #職場乾貨\n昨天 20:55 北京", "q": {"哲": ["你與誰同行，決定你能走多遠。", "人品藏在細節裡，不在言語裡。", "信任是珍貴的，不該輕易交出。", "溫暖的開始不代表溫暖的結局。"], "排": ["有人陪你走過低谷，有人與你把想法做成，有人讓你墜入深淵。", "看日常細節，看待人方式，看做事態度。", "可以放心說話的朋友，能夠並肩做事的搭檔。", "慢慢觀察，慢慢判斷，慢慢信任。"], "對": ["有的人讓你走得更遠，有的人讓你墜入深淵。", "最初靠近很溫暖，相處久了很疲憊。", "言語可以修飾，細節無法偽裝。", "快速的親近，往往需要慢慢的驗證。"], "反": ["你交出信任之前，真的瞭解眼前的人嗎？", "和他相處後，你是更有力量還是更疲憊？", "他對待無關緊要的人，是什麼態度？", "誰值得與你繼續同行？"], "衝": ["一位新朋友對你熱情無比，卻對餐廳服務生冷言冷語。", "合夥人起初承諾滿滿，專案一出問題就把責任推給你。", "你把心事都告訴了他，後來發現整個辦公室都知道了。"], "翻": ["識人不靠直覺，靠觀察。", "疲憊感是關係最誠實的訊號。", "不是所有溫暖都值得靠近。", "慢一點信任，是對自己的保護。"], "遞": ["先看細節，再看待人，再看做事，最後決定同行。", "從相遇，到觀察，到信任，到同行。", "靠近、驗證、珍惜。"], "詩": ["人不是一座孤島，但你可以選擇與誰相連。", "願你遇到良人，也成為別人的良人。", "與對的人同行，路會越走越亮。", "慢慢判斷，誰值得與你繼續同行。"]}, "p": "交出信任之前，先從日常細節與待人做事中，看清誰值得同行。", "f": ["人不是孤島", "有人陪你走更遠，有人讓你越來越疲憊", "希望遇到良人", "三個觀察角度：日常細節、待人、做事", "慢慢判斷誰值得繼續同行"], "pain": "最初很溫暖的人，相處久了卻讓你越來越疲憊", "m": "細節與行為比言語更真實；長期觀察→降低信任錯付的風險", "a": "觀察一個新認識的人如何對待服務人員與如何兌現小承諾", "c": ["你與誰同行，決定你能走多遠。", "誰值得與你繼續同行？", "不是所有溫暖都值得靠近。", "與對的人同行，路會越走越亮。"]}, {"t": "三把尺子，幫你搞定工作選擇！", "b": "面臨工作選擇：\n有時候卡住我們的是恐懼；\n有時候卡住我們的是方法。\n\n上面這組卡片是我個人日常用的方法，希望在你糾結困惑時，幫你帶去一絲光✨\n\n在我做的諮詢陪伴中，很多人卡住其實是因為恐懼，恐懼自己做不好，恐懼自己能力不足。所以，拼命想找一個更好的選擇，去逃避掉對自己能力層做不好的恐懼，也就是想用“選對”解決“做不好”。\n\n這裡分享一句我的心法，當你面對一個新的機會的時候，把“我能不能做成”這個問題從腦子裡去掉，它無解，只會餵養恐懼，換成兩個有解的問題，“我要怎麼做才能做成？”如果沒做成我怎麼調整或止損？\n\n朋友，祝福你前行的路🌈#職場經驗howto #面試經驗howto #認知升級 #選擇#職場乾貨 #職場成長\n3 天前 北京", "q": {"哲": ["「我能不能做成」無解，只會餵養恐懼。", "選擇不能替你承擔做不好的恐懼。", "好問題，是行動的起點。", "卡住你的，有時是恐懼，有時是方法。"], "排": ["我要怎麼做才能做成？沒做成我怎麼調整？我怎麼止損？", "恐懼做不好，恐懼能力不足，恐懼選錯。", "三把尺子，一句心法，一絲光。", "刪掉無解問題，換上有解問題，開始行動。"], "對": ["想用選對解決做不好，是在逃避。", "無解的問題讓你停滯，有解的問題讓你前進。", "完美的選擇不存在，可調整的行動存在。", "恐懼問「能不能」，行動問「怎麼做」。"], "反": ["你是在選擇，還是在逃避對自己能力的恐懼？", "你一直問「我能不能做成」，得到答案了嗎？", "如果沒做成，你有止損計畫嗎？", "卡住你的，是恐懼還是方法？"], "衝": ["你拿到兩個 offer，糾結了一個月，最後兩個都錯過了。", "一個新機會擺在面前，你腦中不斷重播「萬一我做不好怎麼辦」。", "你換了三次工作，每次都覺得下一份一定更適合。"], "翻": ["沒有完美的選擇，只有被做好的選擇。", "恐懼不會因為選對而消失，只會因為行動而變小。", "換個問題，就換了一條路。", "止損計畫，是勇氣的安全網。"], "遞": ["先辨識恐懼，再換掉問題，再擬定方法，最後設好止損。", "從能不能，到怎麼做，到怎麼調整。", "看清、換題、行動、修正。"], "詩": ["朋友，祝福你前行的路。", "願你在糾結困惑時，找到一絲光。", "換一個問題，恐懼就讓出了路。", "做著做著，答案就來了。"]}, "p": "別用「選對」解決「做不好」；把無解的問題換成兩個有解的問題。", "f": ["面對工作選擇卡住", "卡住的是恐懼或方法", "恐懼做不好而拚命找更好的選擇", "刪掉「我能不能做成」", "換成「怎麼做才能成」與「沒成怎麼止損」"], "pain": "害怕自己能力不足，在選擇前反覆糾結", "m": "無解問題餵養恐懼；有解問題引導行動；以行動與止損計畫降低焦慮", "a": "面對新機會時寫下：我要怎麼做才能做成？沒做成我怎麼調整？", "c": ["好問題，是行動的起點。", "三把尺子，一句心法，一絲光。", "如果沒做成，你有止損計畫嗎？", "朋友，祝福你前行的路。"]}, {"t": "✨不想人云亦云，練好這6種追問", "b": "有沒有過這種時候：\n討論時覺得對方說得很有道理，點頭同意了。回去一想，卻發現好幾個地方沒說清楚。\n\n“增加人手就能提速。”\n“同行都在做，我們也該做。”\n\n結論很順，依據和前提卻未必經得起推敲。\n這組卡片整理了6種蘇格拉底式追問：把概念說清、把前提找出、檢查依據、轉換視角、推演後果，再看看問題本身有沒有問對。\n\n不必一次全部用上。下次想點頭時，先挑一個問題，多問一步。\n\n👉 翻到第6張，試試你會怎樣回應“同行都做短影片，我們也該組建團隊”。\n#獨立思考 #提問能力 #蘇格拉底式提問 #批判性思維 #職場溝通 #howto修煉提問力 #職場乾貨 #職場成長 #工作成長記\n8d ago 北京", "q": {"哲": ["結論很順，不代表前提經得起推敲。", "獨立思考，始於多問一步。", "追問不是挑釁，是對真相的尊重。", "問題問對了，答案就對了一半。"], "排": ["把概念說清，把前提找出，檢查依據，轉換視角，推演後果，再問問題本身。", "增加人手就能提速，同行都在做我們也該做。", "不急著點頭，不急著反駁，先多問一步。", "說清、找出、檢查、轉換、推演、反問。"], "對": ["點頭很容易，追問才清醒。", "人云亦云是省力，獨立思考是負責。", "結論是表面，前提是地基。", "別人說得有道理，不等於說得對。"], "反": ["你點頭同意的那些話，回去想過嗎？", "這個結論的前提，真的成立嗎？", "換個角度看，還會得出同樣的結論嗎？", "我們問的問題，本身問對了嗎？"], "衝": ["會上大家都同意要組建短影片團隊，只有你心裡隱隱覺得不對。", "主管說增加人手就能提速，三個月後專案更慢了。", "你被對方說服簽了合約，回家才發現好幾個地方沒說清楚。"], "翻": ["同行都在做，不是我們也該做的理由。", "追問不是不配合，是更好的配合。", "不必一次全用，先挑一個問題就夠了。", "真正的共識，是經過追問的共識。"], "遞": ["先釐清概念，再找出前提，再檢查依據，最後推演後果。", "從點頭，到追問，到獨立判斷。", "問一步，看一層，清一分。"], "詩": ["下次想點頭時，先挑一個問題，多問一步。", "願你在眾聲喧嘩中，保有自己的思考。", "好的問題，是黑暗中的燈。", "不人云亦云，是成年人的清醒。"]}, "p": "不想人云亦云，就在想點頭時多問一步。", "f": ["討論時點頭同意回去才發現沒說清", "結論順暢但前提未必經得起推敲", "六種蘇格拉底式追問：概念、前提、依據、視角、後果、問題本身", "不必全用，先挑一個", "練習回應「同行都做我們也該做」"], "pain": "被看似有道理的話說服，事後才發現漏洞", "m": "系統化追問→拆出隱藏前提與薄弱依據→獨立判斷", "a": "下次想點頭前，先問一句：「這個結論的前提是什麼？」", "c": ["獨立思考，始於多問一步。", "點頭很容易，追問才清醒。", "這個結論的前提，真的成立嗎？", "好的問題，是黑暗中的燈。"]}, {"t": "提問的9大誤區及補救方法！", "b": "問同事進展，得到一句“還在做”；\n問對方意見，聽到一句“都可以”；\n想了解原因，最後卻變成了爭辯。\n\n如果你有上面情況，不妨先留意一下自己的問法：\n是不是一次問得太多？\n是不是問題裡已經藏好了答案？\n是不是忙著想下一個好問題，漏聽了對方的回答？\n\n我整理了9個常見提問誤區，每個都配了補救方法和問法對照。\n👉 先看封面，找找自己常用的問法，再往後翻，看同一件事還能怎麼問。\n\n你最常遇到哪一種？也可以把那句難問出口的話留在評論區，一起拆一拆。\n#溝通技巧 #提問的藝術 #職場溝通 #有效溝通 #職場成長 #不器生生 #AI進化生活howto #howto修煉提問力 #開放性問題 #問答\nOct 20 北京", "q": {"哲": ["你得到什麼答案，取決於你問了什麼問題。", "好的提問，是傾聽的開始，不是說服的開始。", "問題裡藏著答案時，你只會聽到你想聽的。", "提問是一門藝術，也是一種尊重。"], "排": ["一次問太多，問題藏答案，漏聽回答。", "還在做，都可以，最後變爭辯。", "看封面，找問法，再往後翻，換一種問。", "具體一點，開放一點，專注一點。"], "對": ["封閉的問題換來敷衍，開放的問題換來真話。", "忙著想下一個問題，就漏聽了這一個回答。", "帶著答案提問，是在找認同不是在找真相。", "問得巧，勝過問得多。"], "反": ["你上一次問同事進展，得到的是什麼回答？", "你的問題裡，是不是已經藏好了答案？", "你在提問時，真的在聽嗎？", "同一件事，還能怎麼問？"], "衝": ["你問「你覺得這方案好嗎」，對方只說「都可以」。", "你想瞭解原因，問著問著卻和對方吵了起來。", "你一口氣問了五個問題，對方只回答了最後一個。"], "翻": ["得不到好答案，不一定是對方的問題。", "問得少，有時得到更多。", "傾聽，是提問最重要的一半。", "換一種問法，世界就換一種回應。"], "遞": ["先拆小問題，再去掉預設，再專心傾聽，最後追問細節。", "從敷衍，到回應，到真話。", "問清、聽清、想清。"], "詩": ["把那句難問出口的話，換一種方式問出來。", "願你的每一個問題，都打開一扇門。", "好的提問，讓對話開花。", "問得好，是溝通最溫柔的力量。"]}, "p": "問不到好答案，往往是因為問法本身出了問題。", "f": ["問進展得到「還在做」、問意見得到「都可以」", "留意自己的問法", "一次問太多、問題藏答案、漏聽回答", "九大誤區與補救方法", "同一件事換一種問法"], "pain": "提問得不到有效回應，甚至變成爭辯", "m": "問題結構決定回答品質；具體、開放、單一、傾聽的提問→有效資訊", "a": "把下一個要問的問題，改成一次只問一件事的開放式問法", "c": ["提問是一門藝術，也是一種尊重。", "還在做，都可以，最後變爭辯。", "問得巧，勝過問得多。", "好的提問，讓對話開花。"]}, {"t": "12個職場溝通難題，一次搞定！", "b": "同事遲遲不回覆，你催得越多，就一定越有效嗎？\n有人只是太忙，有人確實遇到了困難，也有人根本做不了決定。\n原因不同，溝通方式也應該不同。\n\n爭取資源、提出異議、明確責任，也是一樣的道理。\n整理了12個職場常見難題，不講漂亮話，只講遇到這些情況，可以怎麼開口。\n\n挑一個你正在經歷的場景，試著換一種說法。期待上面的方法能助力您的溝通[種草R]！\n#職場溝通 #溝通技巧 #職場乾貨 #跨部門協作 #職場成長 #工作方法\nOct 15 北京", "q": {"哲": ["溝通的關鍵，不是說得多，而是說得對。", "原因不同，方法就該不同。", "不講漂亮話，只講能開口的話。", "好的溝通，是先理解，再表達。"], "排": ["爭取資源，提出異議，明確責任。", "有人太忙，有人有困難，有人做不了決定。", "挑一個場景，換一種說法，看見不同結果。", "診斷、選擇、開口。"], "對": ["催得越多，不一定越有效。", "漂亮話好聽，具體話好用。", "同一招打天下的人，處處碰壁。", "猜測對方心思會內耗，問清對方處境會解決。"], "反": ["你催同事的時候，想過他為什麼沒回嗎？", "你提出異議時，是在表達觀點還是在發洩情緒？", "責任不清的事，你敢開口釐清嗎？", "你正在經歷哪一個溝通難題？"], "衝": ["你連發三封郵件催進度，對方終於回了一句「我也在等上面決定」。", "你想爭取更多預算，卻不知道該怎麼開口才不顯得貪心。", "專案出了問題，大家互相推諉，沒人說得清誰該負責。"], "翻": ["溝通不暢，常常是因為沒先診斷原因。", "開口不難，難的是找到對的開口方式。", "提出異議，可以不傷和氣。", "明確責任，是對每個人的保護。"], "遞": ["先判斷原因，再選擇方法，最後開口溝通。", "從催促，到理解，到協作。", "看清處境，換種說法，推動結果。"], "詩": ["挑一個你正在經歷的場景，試著換一種說法。", "願每一次開口，都讓事情往前走一步。", "好的溝通，是讓人願意與你並肩。", "換一種說法，換一種結果。"]}, "p": "原因不同，溝通方式也應該不同；不講漂亮話，只講怎麼開口。", "f": ["同事遲遲不回覆", "催得多不一定有效", "有人太忙、有人有困難、有人做不了決定", "爭取資源、提出異議、明確責任同理", "12 個職場難題的開口方式"], "pain": "用同一種方式應對所有溝通難題，越催越無效", "m": "先診斷原因→對症選擇溝通策略→提升協作效率與關係品質", "a": "下次催進度前，先判斷對方是太忙、有困難還是無權決定", "c": ["原因不同，方法就該不同。", "催得越多，不一定越有效。", "明確責任，是對每個人的保護。", "換一種說法，換一種結果。"]}, {"t": "判斷總出錯？先分清3層資訊", "b": "高質量的判斷，從分清資訊開始。這張卡片幫你理清哪些是事實、哪些是推斷、哪些是觀點，讓後面的判斷更紮實的依據。\n建議收藏，下次判斷一個人、一件事或一個機會時，拿出來對照一下。\n#判斷力 #獨立思考 #資訊辨別 #決策能力 #自我成長#職場進階#職場乾貨✅ #認知升級 #底層邏輯\nOct 4 北京", "q": {"哲": ["判斷出錯，往往始於把觀點當事實。", "事實是地基，推斷是梁柱，觀點是裝潢。", "分清資訊，是獨立思考的起點。", "你看到的，不一定是發生的；你聽到的，不一定是真的。"], "排": ["哪些是事實，哪些是推斷，哪些是觀點。", "判斷一個人，判斷一件事，判斷一個機會。", "先分層，再加權，再判斷。", "看事實，驗推斷，審觀點。"], "對": ["事實可以驗證，觀點只能參考。", "推斷越多，越需要小心。", "混在一起是迷霧，分開來是地圖。", "聽起來很確定的話，可能只是一個觀點。"], "反": ["你相信的那件事，是事實還是別人的推斷？", "你的判斷，建立在什麼樣的依據上？", "如果把觀點都拿掉，還剩下多少事實？", "你是在判斷，還是在接受別人的判斷？"], "衝": ["同事說「主管很不滿意你」，你焦慮了一週，後來發現只是他的猜測。", "一篇文章說某產業必然崛起，你一衝動就轉行了。", "面試官說「我們很重視人才」，你就以為公司一定很好。"], "翻": ["判斷力不是天生，是分層的習慣。", "事實很少，推斷很多，觀點最多。", "不被帶偏，從分清資訊開始。", "最確定的語氣，不一定是最可靠的資訊。"], "遞": ["先找事實，再檢驗推斷，最後參考觀點。", "從混雜，到分層，到清晰判斷。", "分清、加權、決斷。"], "詩": ["下次判斷前，拿出來對照一下。", "願你的判斷，都站在事實的地基上。", "分清三層資訊，世界就清晰一層。", "清醒的人，先問：這是事實嗎？"]}, "p": "高品質的判斷，從分清事實、推斷與觀點開始。", "f": ["判斷總出錯", "資訊混雜", "分三層：事實、推斷、觀點", "各層可信度不同", "判斷人、事、機會時對照使用"], "pain": "把推斷與觀點當成事實，判斷屢屢出錯", "m": "資訊分層→給予不同權重→判斷建立在紮實依據上", "a": "下次判斷一件事時，把資訊分成「事實／推斷／觀點」三欄寫下", "c": ["分清資訊，是獨立思考的起點。", "不被帶偏，從分清資訊開始。", "分清、加權、決斷。", "下次判斷前，拿出來對照一下。"]}, {"t": "6道題測出你的判斷卡在哪？", "b": "前一篇我們講了：邏輯是判斷力的基石，但真正的判斷，還要面對資訊不足、不確定性和新資訊更新等複雜情況。\n這次不繼續講概念，直接來做一組判斷力自測。\n\n市面上很多“邏輯測試”要麼只是腦筋急轉彎，要麼看起來很專業，實際題目來源並不清楚。\n這組題儘量換一種做法：基於經典判斷與決策研究做情境化改編，不追求題多，而是想看看——你最容易在哪一類判斷裡被帶偏。\n先憑第一反應答，別急著搜答案。\n\n做完以後，看看哪一道最讓你猶豫，歡迎把題號留在評論區。\n#判斷力 #邏輯思維 #職場乾貨 #職場成長 #職場能力提升 #工作能力提升 #管理能力 #決策思維 #批判性思維 #AI時代工作能力\nSep 29 北京", "q": {"哲": ["判斷力，是在不完美的資訊裡做出好決定的能力。", "邏輯是基石，但判斷是整座建築。", "新資訊來了，敢於更新判斷，才是真清醒。", "讓你猶豫的那一題，正是你成長的地方。"], "排": ["資訊不足，不確定性，新資訊更新。", "不追求題多，不製造焦慮，只照見偏差。", "先作答，再覆盤，再修正。", "憑第一反應，看帶偏處，練判斷力。"], "對": ["邏輯讓你推得對，判斷讓你選得對。", "腦筋急轉彎看機智，判斷測驗看偏差。", "固守舊判斷是頑固，更新判斷是智慧。", "確定時誰都會判斷，不確定時才見真功。"], "反": ["資訊不足時，你是怎麼做判斷的？", "新證據出現時，你願意改變想法嗎？", "哪一道題最讓你猶豫？為什麼？", "你最容易在哪一類判斷裡被帶偏？"], "衝": ["你看到一則新聞就下結論，第二天出現反轉報導。", "客戶一句話讓你判斷專案穩了，結果下週就被取消。", "你堅持最初的判斷，即使數據已經顯示不對。"], "翻": ["判斷錯了不可怕，不更新才可怕。", "猶豫不是軟弱，是思考的痕跡。", "面對不確定，最好的策略是保持可修正。", "判斷力可以被練習，就像肌肉一樣。"], "遞": ["先作答，再找偏差，再理解原因，最後練習修正。", "從邏輯，到判斷，到決策。", "覺察、修正、更新、精進。"], "詩": ["看看哪一道最讓你猶豫，那就是你的功課。", "願你在不確定中，依然能做出清醒的選擇。", "判斷力，是在迷霧中看清方向的眼睛。", "每一次更新，都是一次成長。"]}, "p": "真正的判斷，要面對資訊不足、不確定性與新資訊更新。", "f": ["邏輯是判斷力的基石", "真實判斷更複雜", "基於經典決策研究情境化改編", "憑第一反應作答", "看你最容易在哪一類判斷被帶偏"], "pain": "在資訊不足或不確定時容易被帶偏", "m": "情境題→觸發常見判斷偏誤（基率忽略、錨定、更新不足等）→覺察偏誤類型", "a": "做完測驗，找出最讓你猶豫的一題並思考原因", "c": ["先作答，再覆盤，再修正。", "哪一道題最讓你猶豫？為什麼？", "從邏輯，到判斷，到決策。", "每一次更新，都是一次成長。"]}, {"t": "為什麼你的判斷會出錯？", "b": "前面我們連續分享了認知偏差、邏輯謬誤，以及“什麼是邏輯”。\n這些內容解決的是一個很重要的問題：怎麼讓我們的思考和表達更清晰。\n\n但工作裡的真實問題，往往更復雜，更模糊,比如資訊不完整、情況在變化、每個人站的位置也不同......\n所以今天繼續往前一步，聊聊另一個更重要的能力：判斷力。\n判斷力決定我們在複雜資訊裡，怎麼看問題、怎麼下結論。\n邏輯是其重要的一個支撐，但不是全部。\n\n如果你對之前分享的邏輯感興趣，可以點下方合集，從認知偏差、邏輯謬誤到邏輯入門和測試，一次看完。\n#判斷力 #邏輯思維 #職場乾貨 #職場成長 #職場能力提升 #工作能力提升 #管理能力 #決策思維 #批判性思維 #AI時代工作能力\nSep 28", "q": {"哲": ["邏輯是判斷力的骨架，但判斷力還需要血肉。", "真實世界不是考卷，沒有完整的題目。", "判斷力，決定你怎麼看問題、怎麼下結論。", "站的位置不同，看見的真相也不同。"], "排": ["資訊不完整，情況在變化，立場不相同。", "認知偏差、邏輯謬誤、什麼是邏輯。", "看問題，下結論，做決定。", "清晰思考，清晰表達，清晰判斷。"], "對": ["邏輯解決對不對，判斷解決該不該。", "考卷有標準答案，人生只有更好的選擇。", "懂邏輯的人很多，有判斷力的人很少。", "推理正確不等於結論正確。"], "反": ["你的推理沒錯，結論為什麼還是錯了？", "你考慮過別人站的位置嗎？", "資訊不完整時，你敢下結論嗎？", "邏輯能解決所有問題嗎？"], "衝": ["你的報告邏輯嚴密，主管卻說「你沒考慮到市場變了」。", "你用完美的推理說服了自己，卻忽略了對方的處境。", "同一件事，業務和財務各說各話，誰都有道理。"], "翻": ["邏輯是必要的，但不是充分的。", "判斷力不是推理，是在複雜中做取捨。", "真正的聰明，是知道邏輯的邊界。", "看清立場，才能看清問題。"], "遞": ["先學邏輯，再懂情境，再看立場，最後形成判斷。", "從思考清晰，到表達清晰，到判斷清晰。", "推理、理解、取捨、決斷。"], "詩": ["判斷力，是在模糊中找到清晰的能力。", "願你懂邏輯，更懂世界。", "往前一步，就是更寬廣的思考。", "清醒的判斷，是複雜世界裡的指南針。"]}, "p": "邏輯讓思考清晰，判斷力決定我們在複雜資訊裡怎麼下結論。", "f": ["認知偏差、邏輯謬誤、邏輯入門", "解決思考與表達清晰", "真實問題更複雜：資訊不全、情況變化、立場不同", "判斷力是更重要的能力", "邏輯是支撐但不是全部"], "pain": "懂邏輯卻在真實複雜情境中依然判斷失誤", "m": "邏輯（推理正確性）＋情境理解＋立場覺察＋資訊更新→判斷力", "a": "面對一個複雜問題時，列出：缺什麼資訊？什麼在變？各方立場為何？", "c": ["站的位置不同，看見的真相也不同。", "看問題，下結論，做決定。", "邏輯能解決所有問題嗎？", "願你懂邏輯，更懂世界。"]}, {"t": "怎麼批評人，既有效又不傷人？", "b": "在工作中，看到團隊成員犯錯，我們是不是覺得：不說，就是不負責？\n但很多時候，問題恰恰出在這裡。\n有些錯誤影響很小，也很難改變；\n有些問題看起來是“態度”，其實背後是流程、資源或能力；\n有些話你對熟悉的人可以直接說，對另一個人卻可能立刻觸發防禦。\n所以，批評不是“敢不敢說”的問題，而是判斷該不該說、怎麼說。\n\n我把自己實用最有效的整理成了4張卡：\n什麼問題值得批，什麼可以放過；\n不同的人，應該怎麼調整批評方式；\n哪5種表達最容易把人推遠；\n真正開口前，先問自己的5個問題；\n\n我越來越覺得，AI時代工作效率的差距，不會只來自“誰更會用AI”。\nAI可以幫我們找資料、寫初稿、做分析。\n但你什麼時候該說、該說多重、怎麼在結果和關係之間做判斷——這些依然是人的工作。\n會用工具的人越來越多，真正稀缺的是會判斷、會溝通的人。\n\n#職場乾貨 #溝通能力 #批評與反饋 #判斷力 #職場進階 #AI工作流 #工作方法 #高效職場#職場經驗howto\nSep 14", "q": {"哲": ["批評的目的是改善，不是發洩。", "看起來是態度的問題，背後常是流程、資源或能力。", "會用工具的人越來越多，會判斷、會溝通的人才稀缺。", "什麼時候該說、說多重，依然是人的工作。"], "排": ["什麼值得批，不同人怎麼說，哪些話會推遠，開口前問什麼。", "找資料、寫初稿、做分析，交給 AI；判斷與溝通，留給自己。", "看問題，看人，看時機。", "該不該說，說多重，怎麼說。"], "對": ["對熟人直接說是坦誠，對另一個人可能是攻擊。", "不說不是不負責，亂說才是。", "有效的批評讓人成長，傷人的批評讓人防禦。", "放過小錯是智慧，追究小錯是內耗。"], "反": ["這個錯誤，真的值得批評嗎？", "你批評的是態度，還是背後的流程問題？", "你的說法，會讓對方想改還是想反擊？", "開口之前，你問過自己這五個問題嗎？"], "衝": ["你當眾指出下屬的錯誤，他從此在會議上一言不發。", "你以為同事態度不好，後來才知道他根本沒拿到需要的資源。", "同樣一句話，對 A 說沒事，對 B 說他卻當場紅了眼。"], "翻": ["批評不是勇氣問題，是判斷問題。", "放過一些錯，是為了改正更重要的錯。", "AI 時代的差距，不只在誰更會用 AI。", "好的批評，結果與關係都能保住。"], "遞": ["先判斷該不該說，再判斷怎麼說，最後開口。", "從看見錯誤，到理解根因，到有效反饋。", "篩選問題、調整方式、守住關係。"], "詩": ["在結果與關係之間，找到那條剛剛好的路。", "願你的每一句批評，都帶著改善的善意。", "會說話的人，讓批評也有溫度。", "判斷與溝通，是人永遠的工作。"]}, "p": "批評不是敢不敢說，而是判斷該不該說、怎麼說。", "f": ["不說就是不負責？", "有些錯小且難改、有些「態度」問題背後是流程資源能力", "批評要看問題與對象", "避開五種推遠人的表達", "開口前問自己五個問題"], "pain": "批評不是無效就是傷人，關係與結果兩頭落空", "m": "篩選值得批評的問題→因人調整方式→避免防禦觸發→結果與關係兼顧", "a": "開口批評前先問：這問題值得說嗎？根因是態度還是流程？", "c": ["批評的目的是改善，不是發洩。", "看問題，看人，看時機。", "不說不是不負責，亂說才是。", "這個錯誤，真的值得批評嗎？"]}, {"t": "專案踩坑後才懂：大多數合作崩盤，無關人品", "b": "三套誤區詳細拆解，一套完整方法論，幫你省掉“百萬”學費\nSep 10", "q": {"哲": ["合作崩盤，往往不是壞人太多，而是規則太少。", "把問題歸咎人品，就永遠學不會方法。", "好的合作，是寫在紙上的共識。", "每一次踩坑，都是一筆學費；覆盤了，才不白交。"], "排": ["期望對齊，規則明確，責任清楚。", "三套誤區，一套方法，百萬學費。", "先談清楚，再寫清楚，再做清楚。", "目標、分工、利益、退出。"], "對": ["怪人品很容易，找方法才有用。", "口頭承諾很溫暖，書面規則很可靠。", "開始時不好意思談，結束時不好意思見。", "好人也會合作失敗，壞規則讓好人變對手。"], "反": ["你上一次合作失敗，真的只是對方人品的問題嗎？", "合作前，你們把期望說清楚了嗎？", "出問題時，責任歸屬清楚嗎？", "你有沒有一套自己的合作方法論？"], "衝": ["兩個好朋友合夥創業，一年後因分錢鬧翻再也不聯絡。", "專案中途出問題，雙方都覺得對方沒盡力。", "你以為大家目標一致，結案時才發現彼此要的完全不同。"], "翻": ["合作崩盤，大多無關人品。", "先小人後君子，才能長久做君子。", "規則不是不信任，是保護信任。", "踩坑的價值，在於覆盤。"], "遞": ["先識別誤區，再建立方法，再執行合作，最後覆盤迭代。", "從怪人，到找因，到建法。", "對齊、明確、執行、覆盤。"], "詩": ["省掉百萬學費，從一套好方法開始。", "願你的每一次合作，都成就彼此。", "好的規則，是友誼最好的守護。", "踩過的坑，都成了腳下的路。"]}, "p": "大多數合作崩盤，無關人品，而是誤區與方法的問題。", "f": ["專案踩坑後覆盤", "合作崩盤常被歸咎人品", "實際源於三套誤區", "建立一套完整的合作方法論", "省掉百萬學費"], "pain": "合作失敗後只怪對方人品，重複踩坑", "m": "合作失敗多源於期望未對齊、規則未明、責任未清；方法論化→可預防", "a": "下一次合作前，把目標、分工、利益與退出機制寫成文字", "c": ["好的合作，是寫在紙上的共識。", "目標、分工、利益、退出。", "踩坑的價值，在於覆盤。", "踩過的坑，都成了腳下的路。"]}, {"t": "12個不起眼的小決定，後來改寫了他們的職業", "b": "真正改寫職業方向的，往往不是某個驚天動地的時刻。\n而是你在某幾個不起眼節點的某個小選擇。\n\nReddit為全球最有影響力討論社群，無數普通人在這裡分享自己真實人生經歷。本文整理了 社群裡12 個高贊高熱度的真實職場故事：\n有人因為一次誤會換了賽道；\n有人因為拒絕加班拿到了真正的成長；\n有人只是“順手”做了一件事，就開啟了新世界的大門。\n希望這 12 個發生在普通人身上的小轉變，能給你帶來一點點破局的啟發。✨\n\n回看你的職業歷程，有沒有哪一個“當時看似不起眼的小決定”，後來深深影響了現在的你？在評論區聊聊吧～\n#工作選擇  #職場乾貨 #判斷 #Reddit熱議 #成長思維 #職場選擇 #破局 #個人成長 #自我提升 #選擇\n編輯於 09-09", "q": {"哲": ["命運的轉彎，常藏在不起眼的小路口。", "你今天順手做的事，可能是明天的新世界。", "大改變，是小選擇的複利。", "不起眼，不代表不重要。"], "排": ["一次誤會，一次拒絕，一次順手。", "換了賽道，拿到成長，打開新門。", "小選擇、小轉變、大不同。", "回看、覺察、珍惜每一個節點。"], "對": ["驚天動地的時刻很少，不起眼的選擇很多。", "有人等待轉機，有人在小事中創造轉機。", "當時看似無關緊要，後來改寫了一生。", "拒絕加班看似吃虧，卻換來真正的成長。"], "反": ["你的職業歷程裡，哪個小決定影響了現在的你？", "你是在等待大機會，還是在把握小選擇？", "今天你順手做的事，會不會改變明天？", "如果當時沒做那個決定，你會在哪裡？"], "衝": ["一次被誤會調到別的部門，卻讓他找到了真正熱愛的工作。", "她拒絕了無止盡的加班，用晚上時間學新技能，兩年後轉行成功。", "他只是順手幫同事寫了一段程式，從此打開了程式設計的大門。"], "翻": ["改變人生的，不一定是大事。", "誤會也可能是禮物。", "說不，有時是最好的投資。", "順手之勞，可能是命運之門。"], "遞": ["從一個小選擇，到一個新方向，到一段新人生。", "先覺察，再選擇，再累積，最後轉變。", "一個節點，一條路徑，一片新世界。"], "詩": ["願這些普通人的小轉變，給你一點破局的啟發。", "人生的岔路口，常常靜悄悄。", "把握每一個看似不起眼的選擇。", "小小的決定，終會長成大大的風景。"]}, "p": "真正改寫職業方向的，往往不是驚天動地的時刻，而是不起眼節點的小選擇。", "f": ["以為職業轉折靠大事件", "Reddit 12 個真實故事", "一次誤會換賽道、拒絕加班得成長、順手一件事開新門", "小決定累積成大改變", "回看自己的關鍵小選擇"], "pain": "等待人生大轉折，忽略了眼前的小選擇", "m": "小選擇→新機會與新能力→路徑依賴放大→職業轉向", "a": "回想一個「當時不起眼」卻影響深遠的小決定，寫下它教你的事", "c": ["大改變，是小選擇的複利。", "小選擇、小轉變、大不同。", "改變人生的，不一定是大事。", "人生的岔路口，常常靜悄悄。"]}, {"t": "想靠自媒體賺錢的人，醒醒吧！【真實覆盤】", "b": "刷到一位博主的覆盤：做號一年半，2000多粉絲，總共變現700多元。\n我沒有覺得她在做反差。相反，這才是普通人做自媒體的真實處境。\n\n我自己做了幾個月，一開始我抱著三個目的：鍛鍊邏輯、學習做IP、探索變現路徑。\n一路試下來，現實比想象中骨感得多：\n認真輸出自己認為有價值的內容，資料可能非常冷淡；\n去找平臺熱度高、討論多的選題，哪怕不是自己最感興趣的，流量反而會好一些；\n研究爆款、模仿結構、套用公式，有時有效，有時依然毫無水花。\n後來我逐漸明白：\n平臺流量，本質上是一個很難被個人穩定預測的黑盒。\n所謂“爆款公式”，最多隻能提高機率，無法保證結果。同一套選題、標題和結構，換個賬號、換個時間釋出，效果可能天差地別。\n\n更重要的是，流量和賺錢根本不是一回事。\n自媒體首先是流量和信任的渠道。它可以放大你的產品、能力和影響力，但它本身不是一套完整的賺錢系統。\n如果還沒想清楚：\n你要為誰解決什麼問題？\n別人為什麼願意相信你？\n最終用什麼產品或服務承接？\n就一頭扎進做號、追熱點、學爆款，期待“先把粉絲做起來，以後自然會賺錢”，很可能只是投入了大量時間，卻始終沒有形成商業閉環，這就是低效的勤奮。\n\n同時，不要輕信那些教你“快速起號、輕鬆變現”的人。有些人真正跑通的，並不是自媒體變現，而是靠販賣做自媒體的焦慮賺錢。\n\n如果你也是普通人，建議先想清楚：\n▪️ 為了表達和鍛鍊：就放下短期變現的期待，安心輸出，也允許資料不好看。\n▪️ 為了賺錢：就把它當成一門嚴肅的生意。先想清楚客戶是誰、用什麼產品承接，再透過內容持續建立信任、獲得流量。\n流量是入口，不是生意本身。\n手裡沒有能讓人願意付費的東西，再大的流量槓桿，也很難撬動持續收入。\n\n這是我踩過坑、對自己說了無數次“醒醒吧”之後，換來的認知，真誠分享大家，期待大家少走彎路吧！\n\n你做自媒體多久了？賺到錢了嗎？\n評論區聊聊真實答案。\n#普通人做自媒體 #自媒體避坑 #自媒體變現 #商業認知 #個人IP #新媒體運營\nSep 4", "q": {"哲": ["流量是入口，不是生意本身。", "平台流量，是個人難以穩定預測的黑盒。", "沒有商業閉環的勤奮，是低效的勤奮。", "有些人跑通的不是自媒體變現，而是販賣焦慮。"], "排": ["為誰解決什麼問題，為什麼相信你，用什麼承接。", "研究爆款，模仿結構，套用公式。", "為了表達就放下變現期待，為了賺錢就當成嚴肅生意。", "鍛鍊邏輯，學習 IP，探索變現。"], "對": ["認真輸出可能資料冷淡，追熱點流量反而好。", "爆款公式只能提高機率，無法保證結果。", "流量和賺錢，根本不是一回事。", "先把粉絲做起來再說，往往說不出結果。"], "反": ["你做自媒體多久了？賺到錢了嗎？", "你手裡有讓人願意付費的東西嗎？", "教你快速起號的人，真正賺的是什麼錢？", "你是為了表達，還是為了賺錢？"], "衝": ["做號一年半，兩千粉絲，總共變現七百多元。", "你花一週打磨的深度文章只有幾十個讚，隨手發的熱點卻爆了。", "你買了起號課程，老師賺到了錢，你還在原地。"], "翻": ["醒醒吧，流量不等於收入。", "先想清楚生意，再做內容。", "真正的槓桿，需要一個支點：產品。", "允許資料不好看，是對表達初心的尊重。"], "遞": ["先定客戶，再設計產品，再用內容建立信任，最後獲得流量。", "從做號，到做信任，到做生意。", "想清楚、做產品、建信任、接流量。"], "詩": ["流量是入口，不是生意本身。", "願你少走彎路，把時間花在真正的閉環上。", "踩過的坑，換來清醒的認知。", "醒醒吧，然後好好開始。"]}, "p": "流量是入口，不是生意本身；沒有能讓人付費的東西，再大的流量也撬不動收入。", "f": ["一年半 2000 粉只變現 700 元", "普通人自媒體的真實處境", "流量是難以預測的黑盒", "流量≠賺錢", "先想清楚為誰解決什麼、為何信你、用什麼承接"], "pain": "一頭扎進做號追熱點，投入大量時間卻沒有商業閉環", "m": "自媒體＝流量與信任渠道；需要產品或服務承接才能形成收入閉環", "a": "寫下三個問題的答案：我為誰解決什麼問題？他們為何信我？用什麼產品承接？", "c": ["流量是入口，不是生意本身。", "流量和賺錢，根本不是一回事。", "醒醒吧，流量不等於收入。", "醒醒吧，然後好好開始。"]}, {"t": "學得越多越慢？你可能中了這5個坑！", "b": "我以前很相信：學得越多，人就會進步越快。\n後來才發現，真正重要的不是腦子裡裝了多少，而是有多少真的被用進了工作和生活。\n所以現在我更願意：需要什麼就學什麼，學到什麼就儘量用起來。\n\n#成長不為清單 #學習方法 #個人成長 #知行合一 #少即是多 #認知升級 #終身學習 #自我提升\n9月3日", "q": {"哲": ["學而不用，等於沒學。", "少即是多，用即是學。", "知識的價值，在於被用進生活。", "你吸收了多少，不如你轉化了多少。"], "排": ["需要什麼學什麼，學到什麼用什麼。", "知行合一，少即是多，終身學習。", "不囤積，不焦慮，不貪多。", "學一點，用一點，長一點。"], "對": ["學得多不等於進步快。", "裝得滿的腦袋，不一定是好用的腦袋。", "收藏是囤積，使用是成長。", "貪多嚼不爛，精學用得上。"], "反": ["你學的東西，有多少用進了生活？", "你是在學習，還是在用學習安慰自己？", "如果只能學一樣，你會學什麼？", "學得越多，你真的越快了嗎？"], "衝": ["你一年讀了五十本書，生活卻沒有任何改變。", "你報了五門課，每一門都只上了一半。", "同事只學了一個工具就天天用，效率已經超過你。"], "翻": ["學得越多越慢，可能是學法錯了。", "成長不需要清單，需要行動。", "少學一點，反而走得更遠。", "真正的終身學習，是終身使用。"], "遞": ["先找需要，再學習，再使用，最後內化。", "從輸入，到輸出，到能力。", "學、用、改、精。"], "詩": ["需要什麼就學什麼，學到什麼就儘量用起來。", "願你的每一份學習，都變成生活的力量。", "少即是多，用即是得。", "知識落地的那一刻，才真正屬於你。"]}, "p": "重要的不是腦子裡裝了多少，而是有多少真的被用進了工作和生活。", "f": ["相信學得越多進步越快", "後來發現學多反而慢", "五個學習坑", "需要什麼學什麼、學到什麼用什麼", "少即是多、知行合一"], "pain": "學得越多越慢，囤積知識卻沒有改變", "m": "過量輸入→消化不良與焦慮；按需學習＋即學即用→知識轉為能力", "a": "這週只學一個與當下問題相關的主題，並立刻用一次", "c": ["知識的價值，在於被用進生活。", "不囤積，不焦慮，不貪多。", "如果只能學一樣，你會學什麼？", "少即是多，用即是得。"]}, {"t": "這5種能力，千萬不要外包給AI", "b": "AI越來越強之後，我覺察到自己越來越依賴AI，所以現在越來越在意一件事：\n如何讓AI放大自己，而不是替代自己。\n\n近年多項來自 MIT、斯坦福、微軟的前沿研究都在指向同一個事實：\nAI 最擅長的是擴充套件、檢索、生成和比較；\n而人最不能交出去的，是方向、思考、求證、判斷和標準。\n整理了一份我的 《AI 使用 NOT TO DO LIST》\n🚫 每一張卡片對應一種核心能力的保留：\n01 不把「定義問題」交給 AI\n02 不把「第一輪思考」交給 AI\n03 不把「尋找答案」變成等答案\n04 不把「最終選擇」交給 AI\n05 不把「什麼是好」交給 AI\n總原則： 把生成、檢索、比較、重複勞動交給 AI；\n把問題、思考、求證、判斷和標準留給自己。\n\n建議收藏，一一對照！\n你在用 AI 時最常犯哪一條？評論區聊聊👇\n#AI工具 #高效工作 #獨立思考 #思維提升 #認知升級 #職場乾貨 #小紅書爆款文案\nAI #獨立思考 #思維方式 #認知提升 #決策 #AI時代#howto用好AI #AI人工智慧\n編輯時間：9月1日", "q": {"哲": ["AI 最擅長生成，人最不能交出的是判斷。", "把問題交給 AI 之前，先把問題想清楚。", "等答案的人，正在失去找答案的能力。", "什麼是好，應該由你來定義。"], "排": ["不交出定義問題，不交出第一輪思考，不交出尋找答案，不交出最終選擇，不交出好的標準。", "生成、檢索、比較、重複勞動交給 AI。", "問題、思考、求證、判斷、標準留給自己。", "擴展、檢索、生成、比較。"], "對": ["AI 放大你，還是替代你，取決於你怎麼用。", "尋找答案是能力，等待答案是依賴。", "工具可以給你選項，選擇必須由你來做。", "讓 AI 幫你想，不是讓 AI 替你想。"], "反": ["你在用 AI 時最常犯哪一條？", "你上一次自己先思考再問 AI，是什麼時候？", "如果 AI 給了錯的標準，你分辨得出來嗎？", "你是在用 AI，還是被 AI 用？"], "衝": ["你連寫一封郵件都要先問 AI，自己已經不知道從何下筆。", "AI 給了三個方案，你直接選了第一個，結果完全不適合。", "同事先自己寫大綱再讓 AI 擴寫，品質遠勝你的直接生成。"], "翻": ["AI 越強，人的判斷越值錢。", "依賴不是效率，是退化。", "不外包思考，才能讓 AI 成為槓桿。", "最好的 AI 使用者，是最會思考的人。"], "遞": ["先定義問題，再自己思考，再用 AI 擴展，最後自己判斷。", "從依賴，到協作，到放大。", "思考在前，生成在後，判斷在終。"], "詩": ["如何讓 AI 放大自己，而不是替代自己。", "願你在 AI 時代，依然保有自己的方向。", "工具會更新，判斷永遠是你的。", "思考的火種，請握在自己手裡。"]}, "p": "讓 AI 放大自己，而不是替代自己；方向、思考、求證、判斷、標準不能外包。", "f": ["越來越依賴 AI", "研究指向：AI 擅長擴展、檢索、生成、比較", "人不能交出方向、思考、求證、判斷、標準", "AI 使用 NOT TO DO LIST", "生成交給 AI，判斷留給自己"], "pain": "過度依賴 AI，逐漸失去獨立思考與判斷能力", "m": "分工原則：重複性、生成性工作給 AI；定義問題、首輪思考、求證、選擇、標準留給人", "a": "下一次用 AI 前，先自己寫下問題定義與初步想法", "c": ["什麼是好，應該由你來定義。", "擴展、檢索、生成、比較。", "依賴不是效率，是退化。", "工具會更新，判斷永遠是你的。"]}, {"t": "高手不是更會抓機會，而是更會拒絕機會！", "b": "我們會花很多時間思考一個問題：接下來應該做什麼？\n但真正高手更重視另一個問題：什麼根本不值得開始，什麼應該及時停止。\n段永平、巴菲特、喬布斯和德魯克的表達不同，背後都有一個共同點：時間、注意力和信任都很有限，學會拒絕，才能把資源留給真正重要的事。\n這次整理了4種機會篩選邏輯，最後還附了一張可以直接套用的“機會不為清單”。\n評論區聊聊你現在最該停止做的一件事是什麼？\n#段永平 #巴菲特 #喬布斯 #德魯克 #不為清單 #長期主義 #決策思維 #認知提升 #個人成長\nAug 24", "q": {"哲": ["拒絕，是把資源留給真正重要的事。", "不做什麼，比做什麼更重要。", "時間、注意力和信任，都是有限的。", "專注，就是對一千件好事說不。"], "排": ["什麼不值得開始，什麼應該停止，什麼必須堅持。", "段永平的不為清單，巴菲特的能力圈，喬布斯的專注，德魯克的放棄。", "篩選、拒絕、聚焦。", "少做、做精、做久。"], "對": ["普通人想做什麼，高手想不做什麼。", "抓住所有機會，等於抓不住任何機會。", "開始一件事很容易，停止一件事很難。", "機會很多，資源很少。"], "反": ["你現在最該停止做的一件事是什麼？", "你手上的機會，有多少真正值得投入？", "如果只能做一件事，你會選哪一件？", "你的不為清單上，寫了什麼？"], "衝": ["你同時經營三個副業，每一個都半死不活。", "你答應了所有合作邀約，結果本業考績下滑。", "朋友只專注一件事五年，已經成為業界專家。"], "翻": ["拒絕機會不是保守，是聚焦。", "停止，也是一種前進。", "高手的清單，是不做的清單。", "少即是多，在機會面前尤其如此。"], "遞": ["先列機會，再篩選，再拒絕，最後聚焦。", "從什麼都想要，到懂得放下，到專注一件。", "不為、少為、精為。"], "詩": ["學會拒絕，才能把資源留給真正重要的事。", "願你有勇氣，對不重要的事說不。", "放下的那些，成全了你堅持的這一件。", "長期主義，從一張不為清單開始。"]}, "p": "高手不是更會抓機會，而是更會拒絕機會。", "f": ["一直思考接下來做什麼", "高手更重視什麼不值得開始、什麼該停止", "時間、注意力、信任有限", "段永平、巴菲特、喬布斯、德魯克的篩選邏輯", "機會不為清單"], "pain": "什麼機會都想抓，資源被分散，重要的事反而做不好", "m": "有限資源→聚焦；不為清單→排除干擾→把資源留給真正重要的事", "a": "寫下你現在最該停止做的一件事，本週就停止", "c": ["不做什麼，比做什麼更重要。", "篩選、拒絕、聚焦。", "你的不為清單上，寫了什麼？", "願你有勇氣，對不重要的事說不。"]}, {"t": "【邏輯訓練】別把思考外包給AI", "b": "你在小紅書看內容時，是不是無意識養成先看一眼 “AI 劃重點”？\n\n在享受 AI 帶來極致便利的同時，我們也在不知不覺間把腦力活兒全都交了出去。文案讓 AI 抓、方案讓 AI 構思、連分析問題都直接看 AI 總結。這種“思考外包”看似高效，實際上正在默默侵蝕我們獨立思考和深度推理的能力——腦子越不用，鈍得越快。\n\n為了不讓自己的大腦退化成 AI 的“無腦搬運工”，我們需要像健身一樣，每天給思維做一點“抗阻訓練”，保持大腦的韌性與清晰度。\n不用特意去刷枯燥的邏輯題，也不用佔用大塊時間。把下面這 5 個邏輯訓練動作存下來，拿你今天真實遇到的工作和生活煩惱練一遍。\n\n真正的思維肌肉，只有自己練出來的才算數。今日開始！今日練！ 👇\n#邏輯思維 #思維提升 #獨立思考 #拒絕思考外包 #工作效率 #自我成長 #認知提升#邏輯訓練#提升邏輯\n編輯時間：8月19日", "q": {"哲": ["腦子越不用，鈍得越快。", "思考外包看似高效，實則在侵蝕你的能力。", "思維也需要抗阻訓練。", "自己練出來的肌肉，才是自己的。"], "排": ["文案讓 AI 抓，方案讓 AI 想，分析讓 AI 總結。", "不刷枯燥題，不佔大塊時間，用真實煩惱練。", "今日開始，今日練，日日練。", "韌性、清晰、深度。"], "對": ["AI 劃重點很方便，自己劃重點才會記住。", "搬運工省力，思考者有力。", "享受便利的同時，也在交出能力。", "外包的是時間，失去的是思維。"], "反": ["你是不是一打開文章就先看 AI 劃重點？", "你上一次自己完整分析一個問題，是什麼時候？", "如果明天沒有 AI，你還會思考嗎？", "你的大腦，是在鍛鍊還是在退化？"], "衝": ["你讓 AI 寫了一年文案，某天自己動筆時卻一句都寫不出來。", "會議上主管突然問你的看法，你腦中一片空白。", "你看完一篇長文的 AI 摘要，卻說不出作者真正的論點。"], "翻": ["高效不等於有效。", "不想讓大腦退化，就給它一點阻力。", "思考的苦，是成長的甜。", "拒絕思考外包，是對自己的投資。"], "遞": ["先自己想，再用 AI 驗證，最後形成自己的判斷。", "從搬運工，到思考者，到判斷者。", "每天一點，一月一變，一年一新。"], "詩": ["真正的思維肌肉，只有自己練出來的才算數。", "願你的大腦，在 AI 時代依然鋒利。", "今日開始，今日練。", "清晰的頭腦，是最好的防身術。"]}, "p": "真正的思維肌肉，只有自己練出來的才算數。", "f": ["習慣先看 AI 劃重點", "思考外包看似高效", "侵蝕獨立思考與深度推理", "像健身一樣每天做思維抗阻訓練", "用真實煩惱練五個邏輯動作"], "pain": "文案、方案、分析都交給 AI，腦子越來越鈍", "m": "用進廢退；每日小量思維訓練→維持推理能力與思維韌性", "a": "挑一個今天遇到的煩惱，用五個邏輯動作親自拆解一遍", "c": ["腦子越不用，鈍得越快。", "今日開始，今日練，日日練。", "搬運工省力，思考者有力。", "清晰的頭腦，是最好的防身術。"]}, {"t": "8道題測試你賺錢卡在那？（挑戰一下）", "b": "別再做那些“測你能賺幾百萬”的網感心理測試了。那些除了製造焦慮或虛假滿足，對賺到真金白銀毫無幫助。\n\n這 8 道情景自測，改編自行為決策科學的經典課題。它不測你能賺多少錢，也測不到你的資源、人脈、執行力和運氣；它只想幫你發現：面對賺錢機會時，你最容易在哪一環犯錯，咱們有所覺察後，持續練習、提升、規避。\n#賺錢思維 #商業思維 #認知偏差 #思維訓練 #副業避坑 #決策力 #個人成長\n編輯時間：Aug 13", "q": {"哲": ["賺錢卡住，常常不是缺機會，而是決策出了偏差。", "覺察偏差，是避坑的第一步。", "虛假的滿足，比真實的焦慮更危險。", "錢包的漏洞，常常藏在腦袋裡。"], "排": ["不測能賺多少，不測資源人脈，不測運氣，只測決策盲點。", "覺察、練習、提升、規避。", "損失規避、沉沒成本、過度自信。", "看見錯誤，理解錯誤，避開錯誤。"], "對": ["心理測驗製造焦慮，決策測驗照見盲點。", "賺錢靠機會，守錢靠判斷。", "知道自己會在哪裡犯錯，比知道自己能賺多少更有用。", "網感測驗讓你爽，科學測驗讓你醒。"], "反": ["面對賺錢機會時，你最容易在哪一環犯錯？", "你做過的那些「測你能賺幾百萬」，帶給你什麼？", "你的財務決策，有被情緒帶偏過嗎？", "你知道自己的賺錢盲點嗎？"], "衝": ["你明知副業不賺錢，卻因為已經投入太多而不肯停。", "一次小賺讓你信心大增，下一次就重倉虧光。", "明明是好機會，你卻因為怕虧而錯過。"], "翻": ["賺錢卡住，不一定是能力不夠。", "測驗的意義不是分數，是覺察。", "避坑，也是一種賺錢。", "看清偏差，才能看清機會。"], "遞": ["先作答，再覺察，再練習，最後規避。", "從盲點，到看見，到修正。", "測一次，覺一次，改一次。"], "詩": ["有所覺察後，持續練習、提升、規避。", "願你看清自己的賺錢卡點。", "清醒的頭腦，是最好的理財工具。", "挑戰一下，看見更好的自己。"]}, "p": "賺錢測驗不該測你能賺多少，而該照見你在哪一環最容易犯錯。", "f": ["網感心理測驗製造焦慮或虛假滿足", "改編行為決策科學經典課題", "不測資源與運氣", "只測面對機會時的決策盲點", "覺察、練習、規避"], "pain": "面對賺錢機會時，不知道自己容易在哪個環節判斷失誤", "m": "情境題觸發常見財務決策偏誤（損失規避、沉沒成本、過度自信等）→覺察後修正", "a": "做完八題，找出你最常犯的偏誤類型並寫下規避方法", "c": ["覺察偏差，是避坑的第一步。", "覺察、練習、提升、規避。", "賺錢靠機會，守錢靠判斷。", "挑戰一下，看見更好的自己。"]}, {"t": "關注了100個博主，真正有用不到10個", "b": "我們關注誰，其實是在選擇與誰同行，會深刻影響個人的工作和生活。\n在這個人人都能表達的新媒體時代，我們關注了越來越多博主。但哪些內容真正有價值，哪些只是看起來很厲害的雞湯和包裝？其實並不容易判斷。\n我自己也曾被“矽谷經歷”“名校背景”“精英履歷”吸引，也會被一些情緒化表達帶著走，甚至糊里糊塗買過課。\n後來我才意識到，篩選博主不僅需要保持警覺，更需要一套具體的方法。\n這篇整理了我現在常用的5個參考標準。它們當然不是萬能答案，但至少能幫助我們過濾一部分低價值博主，少被光環和情緒影響，把有限的注意力留給真正有營養、能幫助自己行動的內容。\n你平時會用什麼標準篩選博主？歡迎在評論區分享，也讓我學習一下。\n資訊篩選 #獨立思考 #認知提升 #知識管理 #個人成長 #邏輯思維 #優質內容 #博主選擇 #資訊過載 #批判性思維\n編輯於 08-13", "q": {"哲": ["你關注的人，正在悄悄塑造你。", "注意力是你最珍貴的資產。", "光環不等於價值，情緒不等於真相。", "對進入頭腦的資訊，也要審視來源。"], "排": ["矽谷經歷、名校背景、精英履歷。", "保持警覺，建立標準，過濾低價值。", "有營養，能行動，經得起檢驗。", "少被光環影響，少被情緒帶走，多留給真正有用的內容。"], "對": ["關注一百個，有用不到十個。", "看起來很厲害的，不一定真的有用。", "雞湯讓你一時感動，乾貨讓你持續成長。", "被情緒帶走很容易，留住判斷很難。"], "反": ["你關注的博主，有多少真正幫助了你？", "你是被內容吸引，還是被光環吸引？", "你買過的課，真的值得嗎？", "你用什麼標準篩選資訊？"], "衝": ["你因為一個博主的名校背景買了課，上完發現全是常識。", "你每天刷兩小時，卻說不出學到了什麼。", "你取消關注五十個帳號後，發現心情和效率都變好了。"], "翻": ["關注不是收藏，是選擇同行者。", "少關注，反而學得更多。", "篩選資訊，是獨立思考的第一步。", "光環越耀眼，越需要警覺。"], "遞": ["先建立標準，再篩選，再取捨，最後專注。", "從被動接收，到主動篩選，到深度吸收。", "關注、檢驗、取捨。"], "詩": ["把有限的注意力，留給真正有營養的內容。", "願你關注的每一個人，都讓你更好。", "選擇同行者，就是選擇未來的自己。", "清理資訊源，就是清理心靈的花園。"]}, "p": "我們關注誰，其實是在選擇與誰同行。", "f": ["關注了 100 個博主真正有用不到 10 個", "難以分辨價值與包裝", "曾被光環與情緒帶著走", "五個篩選標準", "把注意力留給有營養、能幫助行動的內容"], "pain": "被名校背景與情緒化表達吸引，糊里糊塗買課", "m": "注意力有限→篩選資訊源→過濾低價值內容→提升認知品質", "a": "用五個標準檢查你的關注列表，取消關注至少十個帳號", "c": ["注意力是你最珍貴的資產。", "關注一百個，有用不到十個。", "關注、檢驗、取捨。", "願你關注的每一個人，都讓你更好。"]}, {"t": "麥肯錫9個高頻思維工具【必藏】", "b": "我們學習各類思維模型和工具，本來是想節省時間、提高效率，也希望藉助正確的思維框架，少走一些彎路。\n但很多時候，我們東看一點、西收集一點，收藏了一大堆模型和方法，真正遇到問題時，反而不知道該用哪個，甚至越用越亂。\n所以這次，我圍繞“解決問題”這個主題，專門梳理了麥肯錫9個高頻思維工具，並按照：\n看清問題—做出取捨—推動結果\n重新進行了歸類。\n模型不是越多越好，真正重要的，是經典的，是在具體問題和場景中實用的！\n\n希望這9個工具不只是被收藏，而是能在你下一次遇到問題時，真正幫你理清思路、找到下一步。\n如果你也有“收藏了很多工具，卻不知道如何使用”的困惑，或者正被某個具體問題卡住，歡迎按照卡片中的方法，在評論區拆一拆：\n你真正要解決的問題是什麼？\n應該捨棄什麼、優先做什麼？\n下一步準備如何推動？\n\n也歡迎關注我，多交流、互相啟發，一起把認知真正變成解決問題的能力。\n#麥肯錫思維 #思維模型 #解決問題 #管理思維 #職場成長 #認知提升 #個人成長\n08-06", "q": {"哲": ["工具的價值，在於被用在對的地方。", "看清問題，是解決問題的一半。", "取捨，是決策的本質。", "把認知變成解決問題的能力，才算真正學會。"], "排": ["看清問題，做出取捨，推動結果。", "你真正要解決的問題是什麼？應該捨棄什麼？下一步如何推動？", "經典的，實用的，場景化的。", "東看一點，西收一點，收藏一大堆。"], "對": ["工具越多越亂，結構越清越用。", "收藏是開始，使用才是學會。", "模型是地圖，問題才是目的地。", "節省時間的工具，用錯了反而浪費時間。"], "反": ["你真正要解決的問題是什麼？", "你應該捨棄什麼、優先做什麼？", "你收藏的工具，在下一次問題時能派上用場嗎？", "你的下一步，準備如何推動？"], "衝": ["你學了 MECE 和金字塔原理，寫報告時卻還是一團亂。", "遇到問題時你翻遍收藏夾，卻不知道該用哪個模型。", "同事只會三個工具，卻用得比你學十個還好。"], "翻": ["不是工具不夠，是不會用。", "少而精，勝過多而亂。", "收藏不等於擁有。", "真正的高手，用最少的工具解決最多的問題。"], "遞": ["先看清問題，再做取捨，最後推動結果。", "從收藏，到理解，到使用，到內化。", "定義、取捨、推動、覆盤。"], "詩": ["希望這些工具，在你下一次遇到問題時真正派上用場。", "願你的認知，都能變成解決問題的能力。", "一把好用的鑰匙，勝過一串用不上的鑰匙。", "理清思路，找到下一步。"]}, "p": "模型不是越多越好，真正重要的是經典、實用，能在具體場景解決問題。", "f": ["收藏一堆模型遇事不知用哪個", "圍繞解決問題梳理麥肯錫 9 個工具", "看清問題、做出取捨、推動結果", "不只被收藏，而是真正被用", "把認知變成解決問題的能力"], "pain": "收藏了很多工具，卻不知道如何使用，甚至越用越亂", "m": "依解決問題流程分類工具→在對應階段選用→提升效率與清晰度", "a": "用卡片方法拆解一個正在卡住你的問題：真正要解決什麼？捨棄什麼？下一步？", "c": ["看清問題，是解決問題的一半。", "經典的，實用的，場景化的。", "不是工具不夠，是不會用。", "理清思路，找到下一步。"]}, {"t": "從此我不再迷信權威反饋！", "b": "有一天，看小紅書後臺，一篇筆記各項資料都不錯，唯獨“封面點選率低於同類”。系統反饋建議大致是：“刪除九宮格，減少文字，突出視覺重心”。\n我當時沒多想，覺得“官方反饋權威，一定有效”，就以無比的熱情照做了。結果上一篇點選率還有 13% ，改完直接腰斬到6% 左右，直接讓我蒙了！\n一開始，我覺得：原來“官方建議”也不可信，感覺被騙了。\n後來我才意識到，真正的問題不是官方有沒有錯，而是我一直把三樣東西混在了一起：\n[種草R]資料，告訴我發生了什麼；\n[種草R]解釋，試圖說明為什麼會發生；\n[種草R]建議，告訴我下一步應該怎麼做。\n只有第一層是已經發生的事實。\n越往後，推測越多，越需要自己驗證。\n以這個例子來說，平臺和AI提供的，往往是根據大量同類內容總結出的“平均有效建議”或者說“正確的廢話”，並不適合每一篇文章。如果反饋總是有效，那且不人人都可以做高點選封面了，so easy。\n\n痛定思痛，我決定改正這個問題！\n查閱了大量資訊後，我發現全球跟我有相識問題的人不在少數，還有一些科學家或研究機構做過類似研究。基於這些研究，結合自己的實踐，我總結了一套親測有效的方法論。下一次面對反饋，你可以拿這 3 個標準試試：\n[看R]一分清：這是事實，還是觀點？\n資料是事實，但別人怎麼解讀資料、給你什麼建議，都只是他的個人觀點。先把事實和觀點分開，你就能少上 80% 的當。\n[清單R]二算賬：改了這裡，會不會毀了全域性？\n別人給的建議往往只盯著一個區域性，但你得為整體負責。比如為了點選率把有價值的資訊全刪了，採用高情緒表達，結果吸引來一堆湊熱鬧的人，把真正想看深度內容的粉絲趕跑了。\n[火R]三做最小測試：分清“單向門”和“雙向門”\n面對反饋，要不要花精力去測試，就看退路有多大：\n雙向門（隨時能改回來）： 比如改個封面，這種低成本小事，試錯代價極小，壓根不用糾結，想試就試。\n單向門（損失大、不可逆）：比如聽了專家建議砸重金切入新賽道、或者做重大業務調整。這種腳踩進去就很難退出來的重大決定，必須先搞個小測試驗證一下。\n\n反饋當然重要！但更重要的是知道那些反饋有效，那些是偽反饋，並逐步建立自己判斷標準，提升自己判斷能力!\n不要因為建議來自權威，就直接把自己的判斷權交出去。\n評論區聊聊，面對反饋，你怎麼甄別和行動？\n#反饋 #權威 #認知升級 #判斷 #有效反饋 #偽反饋 #決策思維 #底層邏輯#反權威\nAug 4", "q": {"哲": ["只有數據是已經發生的事實，越往後推測越多。", "權威給的，往往是平均有效的建議。", "你得為整體負責，別人只盯一個局部。", "建立自己的判斷標準，才能分辨真反饋與偽反饋。"], "排": ["數據告訴你發生了什麼，解釋說明為什麼，建議告訴你怎麼做。", "一分清，二算帳，三做最小測試。", "單向門要慎重，雙向門要大膽。", "事實、觀點、局部、全局、可逆、不可逆。"], "對": ["官方建議很權威，卻未必適合你。", "改封面是雙向門，轉賽道是單向門。", "為了點擊率刪掉價值，是撿了芝麻丟了西瓜。", "反饋總是有效的話，人人都能做爆款了。"], "反": ["這是事實，還是觀點？", "改了這裡，會不會毀了全局？", "這個決定，退路有多大？", "你是在聽建議，還是在交出判斷權？"], "衝": ["系統建議刪掉九宮格、減少文字，照做後點擊率從 13% 腰斬到 6%。", "專家建議你砸重金切入新賽道，你沒做小測試就全押了。", "為了流量你改用高情緒表達，結果吸來一堆湊熱鬧的人，老讀者卻走了。"], "翻": ["問題不是權威有沒有錯，而是你有沒有分層。", "反饋重要，分辨反饋更重要。", "正確的廢話，最容易讓人放下戒心。", "低成本的事，想試就試；高成本的事，先小測。"], "遞": ["先分清事實與觀點，再算全局帳，最後依可逆性決定測試。", "從盲信，到懷疑，到建立標準。", "分清、算帳、測試、判斷。"], "詩": ["不要因為建議來自權威，就交出自己的判斷權。", "願你在每一個反饋面前，都保有清醒。", "數據是事實，判斷是你的。", "從此不再迷信，而是學會驗證。"]}, "p": "不要因為建議來自權威，就把自己的判斷權交出去。", "f": ["照官方建議改封面點擊率腰斬", "問題不在官方對錯", "把數據、解釋、建議混為一談", "三個標準：分清事實觀點、算全局帳、做最小測試", "分清單向門與雙向門"], "pain": "盲信權威反饋，照做後結果更差", "m": "數據是事實，解釋與建議是推測；區分層次→評估整體影響→依可逆性決定測試成本", "a": "面對下一個反饋，先問：這是事實還是觀點？改了會不會毀了全局？", "c": ["權威給的，往往是平均有效的建議。", "這是事實，還是觀點？", "分清、算帳、測試、判斷。", "數據是事實，判斷是你的。"]}, {"t": "【7天挑戰】一萬個想法，抵不過一次行動！", "b": "不要再繼續痴迷認知研究，從一個小行動開始，讓生活真正變化！\n#認知升級 #邏輯思維 #行動就現在 #認知提升 #財富 #芒格 #變富 #搞錢 #底層認知\nAug 3", "q": {"哲": ["認知的終點，是行動。", "想一萬次，不如做一次。", "改變不在腦中，在腳下。", "知道而不做，等於不知道。"], "排": ["一個想法，一個行動，一次改變。", "第一天開始，第三天堅持，第七天看見。", "少一點研究，多一點行動，再多一點堅持。", "想清楚、做出來、看結果。"], "對": ["痴迷認知是精神按摩，開始行動才是真實改變。", "想法是種子，行動是陽光。", "聰明的人很多，行動的人很少。", "研究一百天，不如行動七天。"], "反": ["你學了那麼多認知，生活改變了嗎？", "你是在思考，還是在用思考逃避行動？", "如果今天只做一件小事，你會做什麼？", "七天後，你想看到什麼改變？"], "衝": ["你讀了十本關於致富的書，存款還是零。", "你寫了一頁頁的計畫，卻從沒執行過第一步。", "朋友什麼都不懂就先做了，三個月後已經有了成果。"], "翻": ["不是知道得不夠，是做得太少。", "行動才是最好的認知升級。", "開始不需要完美，只需要開始。", "改變，從一個小行動發生。"], "遞": ["從一個想法，到一個行動，到一個習慣，到一段新生活。", "第一天、第三天、第七天。", "做一次、做三次、做成習慣。"], "詩": ["從一個小行動開始，讓生活真正變化。", "願你少一點空想，多一點行動。", "行動，是最溫柔也最堅定的改變。", "七天，足夠讓你看見不一樣的自己。"]}, "p": "一萬個想法，抵不過一次行動。", "f": ["痴迷認知研究", "想法很多改變很少", "七天挑戰", "從一個小行動開始", "讓生活真正變化"], "pain": "看了很多認知內容，生活卻沒有任何改變", "m": "認知若不轉化為行動就不產生價值；小行動→回饋→持續→改變", "a": "從今天起七天，每天完成一個與目標相關的小行動並打卡", "c": ["認知的終點，是行動。", "想清楚、做出來、看結果。", "聰明的人很多，行動的人很少。", "願你少一點空想，多一點行動。"]}, {"t": "芒格的9個財富認知【建議收藏】", "b": "我們容易被各種網課、“暴富專案”和創業機會等吸引，甚至帶偏，做著變富的美夢！其實不只是因為缺少資訊，而是沒有想清楚：財富到底從哪裡來，又靠什麼守住、放大。\n\n我們對吃進身體的東西尚且會關注，對進入頭腦的觀念，更應該審視來源。\n與其被碎片化或者錯誤的“賺錢術”牽著走，不如學習那些經得起時間檢驗的偉大思想！\n\n芒格的9個財富認知，整理在卡片裡，往後滑👉\n#查理芒格 #財富認知 #認知升級 #賺錢邏輯 #底層邏輯 #投資思維 #個人成長#搞錢 #搞錢思維\nJul 30", "q": {"哲": ["對吃進身體的東西要關注，對進入頭腦的觀念更要審視。", "財富從哪裡來，又靠什麼守住與放大，是一生的課題。", "經得起時間檢驗的思想，才值得學習。", "暴富是美夢，認知才是現實。"], "排": ["從哪裡來，靠什麼守住，如何放大。", "網課、暴富專案、創業機會。", "審視來源，學習經典，建立框架。", "九個認知，一生受用。"], "對": ["碎片化的賺錢術讓你迷茫，經典思想讓你清醒。", "缺的不是資訊，是想清楚。", "被帶偏很容易，回到正道很難。", "美夢是短暫的，認知是長久的。"], "反": ["你進入頭腦的觀念，來源可靠嗎？", "你想清楚財富到底從哪裡來了嗎？", "你在學偉大的思想，還是在追熱門的專案？", "你的財富認知，經得起時間檢驗嗎？"], "衝": ["你花了三萬買暴富課程，最後只學會了焦慮。", "一個創業機會讓你熱血沸騰，卻沒想過它靠什麼賺錢。", "讀完芒格的一句話，你突然明白自己這些年錯在哪裡。"], "翻": ["變富靠的不是資訊，是認知。", "不被帶偏，從審視來源開始。", "偉大的思想，比熱門的專案更值錢。", "慢慢變富，比一夜暴富更可靠。"], "遞": ["先審視來源，再學習經典，再對照實踐，最後形成框架。", "從美夢，到清醒，到財富。", "想清楚、守得住、放得大。"], "詩": ["與其被碎片牽著走，不如向偉大的思想學習。", "願你的財富認知，經得起時間。", "智慧是最好的資產，越用越增值。", "往後滑，看見財富的本質。"]}, "p": "財富從哪裡來、靠什麼守住與放大，要向經得起時間檢驗的思想學習。", "f": ["被網課與暴富專案帶偏", "不只是缺資訊，是沒想清財富本質", "對進入頭腦的觀念也要審視來源", "向經得起時間檢驗的偉大思想學習", "芒格的九個財富認知"], "pain": "被碎片化或錯誤的賺錢術牽著走，做著變富美夢", "m": "審視觀念來源→吸收經典財富思想→建立正確的財富認知框架", "a": "挑芒格的一條財富認知，對照自己目前的一個財務決策", "c": ["暴富是美夢，認知才是現實。", "網課、暴富專案、創業機會。", "缺的不是資訊，是想清楚。", "往後滑，看見財富的本質。"]}, {"t": "別被帶節奏， 3步拆穿套路！", "b": "刷到廣告衝動下單、網上爭論被帶偏、聽人說話總覺得哪裡不對……這些瞬間，往往不是因為不夠聰明，而是缺了點邏輯思維。\n本次不分享晦澀理論，用5分鐘帶你掌握邏輯核心。\n學會這三步，你會成為一個聽得懂、問得清、說得明白的人。\n#邏輯思維 #批判性思維 #決策認知 #底層邏輯 #自我提升 #思維訓練\n編輯時間：Jul 28", "q": {"哲": ["被帶節奏，往往不是因為不聰明，而是缺了邏輯。", "聽得懂、問得清、說得明白，是清醒的三種能力。", "邏輯是防身術，也是溝通術。", "套路之所以有效，是因為我們沒看見它。"], "排": ["聽得懂，問得清，說得明白。", "衝動下單，被帶偏，覺得哪裡不對。", "識別論點，檢查依據，找出漏洞。", "不講理論，只講方法，五分鐘學會。"], "對": ["情緒推著你走，邏輯讓你停下。", "套路很聰明，拆穿套路更聰明。", "覺得哪裡不對，說不出為什麼，就是缺邏輯。", "晦澀理論讓人卻步，實用方法讓人上手。"], "反": ["你上一次衝動下單，是被什麼說服的？", "網上爭論時，你是在思考還是在被帶偏？", "聽人說話覺得不對時，你說得出哪裡不對嗎？", "你能拆穿身邊的套路嗎？"], "衝": ["廣告說「限時最後一天」，你立刻下單，第二天它還在賣。", "網上一場爭論，你跟著大家罵了半天，才發現自己根本沒看懂。", "朋友說了一番道理，你明明覺得不對卻無法反駁。"], "翻": ["不是你笨，是沒學過邏輯。", "邏輯不晦澀，可以五分鐘入門。", "拆穿套路，從三步開始。", "清醒，是可以練習的。"], "遞": ["先聽懂，再問清，最後說明白。", "從被帶偏，到看穿，到反制。", "識別、檢查、拆穿。"], "詩": ["學會這三步，成為聽得懂、問得清、說得明白的人。", "願你不再被帶節奏。", "邏輯，是喧囂世界裡的定海神針。", "清醒的人，自帶防護罩。"]}, "p": "衝動下單、爭論被帶偏，不是不夠聰明，而是缺了點邏輯思維。", "f": ["廣告衝動下單、爭論被帶偏、聽話覺得不對", "缺的是邏輯", "不講晦澀理論", "五分鐘掌握邏輯核心三步", "成為聽得懂、問得清、說得明白的人"], "pain": "容易被廣告、輿論與話術帶節奏", "m": "三步邏輯：識別論點、檢查依據、找出漏洞→抵抗操控", "a": "下一次看到廣告想下單時，先找出它的論點與依據", "c": ["邏輯是防身術，也是溝通術。", "聽得懂，問得清，說得明白。", "從被帶偏，到看穿，到反制。", "清醒的人，自帶防護罩。"]}, {"t": "7道題，測出你容易被什麼帶偏？", "b": "這組測試，不是把人分成\"理性組\"和\"衝動組\"兩類人，是看看你在哪類判斷上，第一反應和理性計算容易打架——幾乎所有人都會在某幾道題上中招，這是人類認知的普遍規律，不是誰比誰更聰明。\n\n你最容易在哪一類判斷上被帶偏，現在就測測吧？\n\n如果你也關注系統思維、決策認知、底層邏輯，歡迎關注我，一起把複雜問題看清楚。\n#判斷偏差 #行為經濟學 #認知偏差 #決策認知 #邏輯思維 #系統思維 #底層邏輯 #自我提升 #認知升級 #思維測試\nJul 23", "q": {"哲": ["被帶偏不是缺陷，是人性。", "第一反應與理性計算，常常在打架。", "認識偏差的規律，才能駕馭它。", "沒有人永遠理性，只有人更常覺察。"], "排": ["不分理性組，不分衝動組，只看你在哪裡打架。", "第一反應、理性計算、判斷偏差。", "系統思維、決策認知、底層邏輯。", "測一測，看一看，想一想。"], "對": ["不是誰比誰聰明，而是誰更能覺察。", "直覺很快，理性很慢，衝突時誰贏？", "中招是正常，不覺察才危險。", "貼標籤很簡單，看見規律很深刻。"], "反": ["你最容易在哪一類判斷上被帶偏？", "你的第一反應，和你的理性計算一致嗎？", "你相信自己是理性的人嗎？", "如果所有人都會中招，你準備怎麼辦？"], "衝": ["你以為自己很理性，卻在一道機率題上被直覺騙了。", "明明算過划不來，你還是被「免費」兩個字吸引。", "朋友說你很衝動，測完才發現你只在特定情境下衝動。"], "翻": ["中招不丟臉，不學才丟臉。", "理性不是一種人，而是一種練習。", "知道自己會被帶偏，就已經少被帶偏一次。", "偏差是規律，不是性格。"], "遞": ["先測驗，再覺察，再理解規律，最後修正。", "從直覺，到衝突，到覺察。", "測、看、想、改。"], "詩": ["把複雜問題看清楚，從看清自己開始。", "願你在直覺與理性之間，找到平衡。", "每一次中招，都是一次認識自己。", "覺察，是理性最好的朋友。"]}, "p": "幾乎所有人都會在某幾道題上中招，這是人類認知的普遍規律，不是誰比誰聰明。", "f": ["不把人分成理性與衝動兩組", "看哪類判斷中第一反應與理性打架", "七道情境題", "找出最容易被帶偏的類型", "系統思維看清複雜問題"], "pain": "不知道自己在哪類判斷中容易被直覺帶偏", "m": "直覺系統與理性系統衝突→特定題型觸發偏誤→識別個人偏誤類型", "a": "做完七題，記下讓你直覺與理性衝突最大的那一題", "c": ["認識偏差的規律，才能駕馭它。", "測一測，看一看，想一想。", "你相信自己是理性的人嗎？", "覺察，是理性最好的朋友。"]}, {"t": "為什麼巨星堆不出冠軍？從世界盃看凝聚力", "b": "為什麼一群最優秀的人，放在一起，反而做不成事？世界盃就是最殘酷的組織管理現場。\n有些球隊巨星雲集，卻在關鍵時刻崩盤；\n有些團隊看起來沒有那麼豪華，卻能一路走到最後。\n\n背後的關鍵，不只是戰術，也不只是能力，\n而是：**目標、利益、角色、規則和信任，有沒有真正對齊。**\n\n團隊凝聚力不是“關係好”，\n而是每個人都知道自己為什麼而戰，\n也相信別人不會在關鍵時刻背刺自己。\n\n這組圖，從世界盃切入，聊聊一個團隊為什麼會內耗，以及組織破局真正要做的五件事。\n如果你也關注系統思維、組織管理、決策認知，歡迎關注我，一起把複雜問題看清楚。\n#世界盃 #組織管理 #團隊凝聚力 #領導力 #系統思維 #底層邏輯 #世界盃裡看世界  #認知升級 #世界盃球迷說 #世界盃你問我答\n編輯時間：7月15日", "q": {"哲": ["巨星堆不出冠軍，對齊才能。", "凝聚力，是每個人都知道自己為什麼而戰。", "信任，是相信別人不會在關鍵時刻背刺自己。", "一群優秀的人，也可能做不成一件事。"], "排": ["目標、利益、角色、規則、信任。", "知道為何而戰，知道自己的位置，相信隊友。", "有些球隊巨星雲集卻崩盤，有些團隊不豪華卻走到最後。", "對齊目標，對齊利益，對齊角色。"], "對": ["關係好不等於凝聚力強。", "個人能力是加法，團隊對齊是乘法。", "巨星各自為戰，普通人並肩作戰。", "豪華陣容不一定贏，對齊的陣容才會贏。"], "反": ["你的團隊，每個人都知道為什麼而戰嗎？", "利益分配，讓每個人都願意全力以赴嗎？", "在關鍵時刻，你相信隊友嗎？", "為什麼一群最優秀的人，放在一起反而做不成事？"], "衝": ["一支巨星雲集的球隊，在淘汰賽中因內訌崩盤。", "你的團隊每個人都很強，但開會時總是各說各話。", "一個普通的團隊，因為目標一致，一路打進了決賽。"], "翻": ["團隊內耗，不是因為人不好，而是沒對齊。", "凝聚力不是感情，是結構。", "最強的團隊，不一定有最強的個人。", "信任，是最好的戰術。"], "遞": ["先對齊目標，再對齊利益，再明確角色，最後建立信任。", "從個人能力，到團隊協作，到組織勝利。", "對齊、協作、信任、勝利。"], "詩": ["世界盃，是最殘酷也最美麗的組織管理現場。", "願你的團隊，每個人都知道自己為什麼而戰。", "並肩的人，比耀眼的人更珍貴。", "對齊了，平凡也能創造奇蹟。"]}, "p": "團隊凝聚力不是關係好，而是目標、利益、角色、規則與信任真正對齊。", "f": ["巨星雲集卻關鍵崩盤", "不只戰術與能力", "目標、利益、角色、規則、信任是否對齊", "每人知道為何而戰、相信不被背刺", "組織破局五件事"], "pain": "一群優秀的人放在一起，反而做不成事", "m": "五維對齊→降低內耗→形成信任與協作→團隊整體大於個體之和", "a": "檢查你的團隊：五個維度中哪一個沒有對齊？", "c": ["巨星堆不出冠軍，對齊才能。", "關係好不等於凝聚力強。", "在關鍵時刻，你相信隊友嗎？", "對齊了，平凡也能創造奇蹟。"]}, {"t": "12個思維陷阱【建議收藏】", "b": "很多時候，我們不是不會思考，\n而是大腦無知無覺中劃入了“思維陷阱”。\n\n你以為自己很理性，\n可能只是只看見了想看的證據；\n你以為自己想清楚了，\n可能只是被情緒、慣性和群體帶偏了。\n\n這組卡片整理了 “12個常見思維陷阱”，分成4類：\n資訊陷阱｜情緒陷阱｜自我陷阱｜判斷陷阱\n\n建議從第2張“陷阱導航圖”開始看，\n先判斷自己卡在哪個場景，\n再對照後面的定義、現場和破局方法。\n收藏起來，\n下次做判斷、做選擇、覆盤問題前，拿出來看一遍。\n#邏輯思維 #認知升級 #思維陷阱 #認知偏差 #決策能力 #底層邏輯 #個人成長 #理性思考 #思維模型 #自我提升\nJul 13", "q": {"哲": ["你以為很理性，可能只是只看見了想看的證據。", "陷阱之所以是陷阱，因為你看不見它。", "情緒、慣性與群體，是思維的三股暗流。", "覺察陷阱，就已經跳出一半。"], "排": ["資訊陷阱，情緒陷阱，自我陷阱，判斷陷阱。", "先判斷場景，再對照定義，再找破局方法。", "做判斷前，做選擇前，覆盤前，都拿出來看一遍。", "看見、定位、破局。"], "對": ["以為想清楚了，其實被帶偏了。", "看見想看的，忽略不想看的。", "理性是自以為，偏差是無意識。", "知道陷阱的人，比聰明的人更不容易掉進去。"], "反": ["你確定你看見的是全部證據嗎？", "你的判斷，是理性還是情緒？", "你是在獨立思考，還是在跟隨群體？", "你現在卡在哪一類陷阱裡？"], "衝": ["你堅信一支股票會漲，只看利多新聞，結果大跌。", "團隊一致通過的決定，事後證明大家都只是不想唱反調。", "你因為一次成功就認定自己判斷很準，下一次就栽了。"], "翻": ["不是不會思考，是掉進了陷阱。", "理性需要工具，不只需要意願。", "群體的共識，不一定是正確的結論。", "收藏陷阱清單，就是收藏一份清醒。"], "遞": ["先辨識陷阱類型，再定位場景，最後對照破局。", "從無意識，到覺察，到修正。", "看資訊、看情緒、看自己、看判斷。"], "詩": ["下次做判斷前，拿出來看一遍。", "願你看見陷阱，也跨過陷阱。", "清醒的思考，是避開暗礁的航行。", "知道自己會錯，才會更少犯錯。"]}, "p": "很多時候我們不是不會思考，而是無知無覺中掉入了思維陷阱。", "f": ["以為很理性", "可能只看見想看的證據", "被情緒、慣性、群體帶偏", "12 個思維陷阱分四類：資訊、情緒、自我、判斷", "依導航圖定位卡點再破局"], "pain": "自以為想清楚了，其實被情緒、慣性與群體帶偏", "m": "分類辨識陷阱→場景定位→對照破局方法→提升判斷品質", "a": "做重要選擇前，對照陷阱導航圖，檢查自己卡在哪一類", "c": ["覺察陷阱，就已經跳出一半。", "看見、定位、破局。", "以為想清楚了，其實被帶偏了。", "下次做判斷前，拿出來看一遍。"]}, {"t": "❄️18個讓大腦恢復清醒科學方法", "b": "腦子越用越亂的時候，\n很多人第一反應是：再努力一點、再熬一下、再逼自己專注。\n但大腦不是靠硬扛變清醒的。\n它需要一個系統：睡眠節律、身體供能、注意力管理、情緒恢復、認知訓練、決策覆盤。\n\n這18個方法，不是雞血口號，\n而是從睡眠、運動、飲食、光照、壓力管理和認知偏差修正裡，整理出的可執行動作。\n核心不是讓你一天變聰明，\n而是先把大腦狀態調穩，讓注意力、判斷力和情緒慢慢恢復。\n腦子亂的時候，不要只怪自己不夠努力。\n先從一個最小動作開始：\n睡夠、曬光、少刷、走路、寫下來、覆盤一次。\n清醒，是可以被訓練出來的。\n#大腦清醒 #認知升級  #專注力提升 #決策能力 #思維訓練 #情緒管理 #睡眠管理 #腦力提升 #個人成長#底層邏輯\n#高效學習 #底層邏輯\nJul 9", "q": {"哲": ["大腦不是靠硬扛變清醒的。", "清醒，是可以被訓練出來的。", "腦子亂的時候，不要只怪自己不夠努力。", "先把大腦狀態調穩，判斷力才會回來。"], "排": ["睡眠節律，身體供能，注意力管理，情緒恢復，認知訓練，決策覆盤。", "睡夠、曬光、少刷、走路、寫下來、覆盤一次。", "不是雞血口號，而是可執行的動作。", "睡眠、運動、飲食、光照、壓力、偏差修正。"], "對": ["硬撐讓大腦更亂，系統讓大腦更清。", "熬夜換來的不是效率，是混亂。", "雞血是一時的，系統是長期的。", "努力不能代替睡眠。"], "反": ["你上一次睡夠是什麼時候？", "腦子亂的時候，你是繼續熬還是先停下來？", "你今天曬過太陽了嗎？", "你的大腦，是在被照顧還是被透支？"], "衝": ["你連熬三晚趕專案，第四天做出了一個致命的錯誤判斷。", "你一整天盯著螢幕，晚上腦袋像一團漿糊。", "你出門走了二十分鐘，回來後卡了一天的問題突然想通了。"], "翻": ["清醒不靠意志力，靠系統。", "休息不是偷懶，是給大腦整理的時間。", "最小的動作，帶來最大的改變。", "照顧身體，就是照顧判斷力。"], "遞": ["先睡夠，再供能，再管注意力，最後覆盤決策。", "從身體，到情緒，到認知，到判斷。", "一個動作，一個習慣，一套系統。"], "詩": ["清醒，是可以被訓練出來的。", "願你的大腦，如晨光般清澈。", "先從一個最小動作開始。", "照顧好大腦，它會照顧好你的人生。"]}, "p": "大腦不是靠硬扛變清醒的，清醒是可以被訓練出來的系統。", "f": ["腦子越用越亂", "第一反應是再努力再熬", "大腦需要系統：睡眠、供能、注意力、情緒、認知、覆盤", "18 個科學可執行動作", "先從最小動作開始"], "pain": "腦子混亂時只會怪自己不夠努力，越熬越亂", "m": "睡眠節律＋運動飲食＋光照＋壓力管理＋認知修正→大腦狀態穩定→注意力與判斷恢復", "a": "今天從一個最小動作開始：睡夠、曬光、少刷、走路或寫下來", "c": ["大腦不是靠硬扛變清醒的。", "你上一次睡夠是什麼時候？", "照顧身體，就是照顧判斷力。", "清醒，是可以被訓練出來的。"]}, {"t": "你的決策，被6種認知偏差控制了", "b": "很多時候，我們不是輸給能力，\n而是輸給了自己腦子裡的預設模式。\n你以為自己在理性判斷，\n其實可能只是：\n看到什麼，就相信什麼；\n投入太多，就不敢退出；\n害怕失去，就放棄更好的選擇；\n剛成功幾次，就覺得自己判斷很準。\n\n這不是你不聰明，\n而是認知偏差正在悄悄帶偏你的決策。\n真正清醒的人，不是永遠判斷正確，\n而是會在關鍵選擇前，多問自己一句：\n我有沒有可能正在被偏差控制？\n\n這篇整理了6種最常見的決策偏差，\n以及對應的修正問題。\n收藏起來，下次做重要決定前，先看一遍。\n#認知偏差 #認知升級 #決策能力 #思維模型 #底層邏輯 #個人成長 #職場思維  #理性思考#反內耗\n7月7日", "q": {"哲": ["真正清醒的人，不是永遠正確，而是會在關鍵時多問一句。", "你以為在理性判斷，其實是預設模式在替你做決定。", "偏差不是愚蠢，是大腦的省力機制。", "認識偏差，才能駕馭決策。"], "排": ["看到什麼就相信什麼，投入太多就不敢退出，害怕失去就放棄更好，成功幾次就覺得很準。", "可得性、沉沒成本、損失規避、過度自信。", "收藏起來，重要決定前，先看一遍。", "覺察、追問、修正。"], "對": ["不是你不聰明，是偏差在悄悄帶偏你。", "沉沒成本讓你堅持錯誤，及時止損讓你重新開始。", "怕失去的人，常常失去更多。", "成功讓人自信，也讓人盲目。"], "反": ["我有沒有可能正在被偏差控制？", "你堅持的，是因為正確還是因為已經投入太多？", "你放棄的，是因為不好還是因為怕失去？", "你的自信，有數據支持嗎？"], "衝": ["你明知專案沒希望，卻因為已經投入兩年而不肯放手。", "一個更好的工作機會，你因為怕失去現有福利而拒絕了。", "你連續三次投資都賺了，第四次重倉卻虧光了。"], "翻": ["輸的不是能力，是預設模式。", "止損不是失敗，是清醒。", "偏差無法消除，但可以被覺察。", "最危險的決策，是你以為最理性的那一個。"], "遞": ["先辨識偏差，再提出修正問題，最後做出決策。", "從預設模式，到覺察，到清醒決策。", "看見、追問、修正、決斷。"], "詩": ["在關鍵選擇前，多問自己一句。", "願你的每個重要決定，都經過清醒的檢驗。", "認識偏差，是送給自己最好的禮物。", "清醒，不是不犯錯，而是少犯錯。"]}, "p": "我們不是輸給能力，而是輸給了自己腦子裡的預設模式。", "f": ["以為理性判斷", "其實被預設模式帶偏", "看見就相信、投入多不敢退、怕失去放棄更好、成功幾次自以為準", "六種決策偏差與修正問題", "關鍵選擇前多問一句"], "pain": "重要決策被認知偏差悄悄控制，卻以為自己很理性", "m": "六種常見偏差（可得性、沉沒成本、損失規避、過度自信等）→對應修正問題→降低決策失誤", "a": "做重要決定前問：「我有沒有可能正在被偏差控制？」", "c": ["認識偏差，才能駕馭決策。", "怕失去的人，常常失去更多。", "止損不是失敗，是清醒。", "在關鍵選擇前，多問自己一句。"]}, {"t": "人生向上的9條底層邏輯", "b": "人生真正的變化是：\n開始用一套更底層的方式看世界。\n\n良藥苦口，有點扎心，但本質是為了看清真相，少走彎路！願我們的生活一路向上向光！\n\n上滑卡片，看詳細拆解！\n#認知升級 #思維模型 #底層邏輯 #決策能力 #系統思維 #個人成長 #財富認知#人際 #CEO覆盤 #職場成長\nJul 6", "q": {"哲": ["看世界的方式變了，世界就變了。", "底層邏輯，是人生的作業系統。", "良藥苦口，真相扎心，卻讓人少走彎路。", "向上的人生，始於向下扎根的認知。"], "排": ["看清真相，少走彎路，一路向上。", "認知、財富、人際、決策、系統。", "扎心一點，清醒一點，向光一點。", "換視角，換決策，換人生。"], "對": ["表層努力很累，底層改變很輕。", "雞湯讓人舒服，真相讓人成長。", "看熱鬧的人只看表象，看門道的人看底層。", "扎心的話，往往最有用。"], "反": ["你是在表面用力，還是在底層改變？", "哪一條底層邏輯最讓你扎心？", "你願意為了看清真相，忍受一點不舒服嗎？", "你的人生作業系統，多久沒更新了？"], "衝": ["你努力了十年，卻在讀到一條底層邏輯時恍然大悟自己一直走錯方向。", "朋友一句扎心的話讓你難過了一晚，卻改變了你接下來的人生。", "你換了一個看人際關係的角度，突然不再內耗了。"], "翻": ["真正的改變，不是更努力，而是看得更深。", "扎心不是傷害，是喚醒。", "底層邏輯一通，表層問題自解。", "向上，從看清真相開始。"], "遞": ["先看清真相，再理解底層，再改變決策，最後人生向上。", "從表象，到本質，到行動。", "一條邏輯，一個視角，一段新生活。"], "詩": ["願我們的生活一路向上向光。", "換一套看世界的方式，人生就開始轉彎。", "扎心的真相，是最溫柔的提醒。", "底層清醒，表層從容。"]}, "p": "人生真正的變化，是開始用一套更底層的方式看世界。", "f": ["表面努力難改變", "換一套底層視角", "九條底層邏輯：認知、財富、人際、決策", "良藥苦口看清真相", "一路向上向光"], "pain": "只在表層用力，人生卻遲遲沒有變化", "m": "底層邏輯改變看世界的方式→決策與行為隨之改變→人生軌跡向上", "a": "挑一條最扎心的底層邏輯，寫下它在你生活中的一個例子", "c": ["底層邏輯，是人生的作業系統。", "換視角，換決策，換人生。", "表層努力很累，底層改變很輕。", "底層清醒，表層從容。"]}, {"t": "身處逆境，看這5句！", "b": "逆境、撐住、繼續走！把你拉出深淵、讓你在黑夜裡繼續前行的，從來不是安慰，而是極其冷酷、卻堅不可摧的底層智識\n#認知提升 #獨立思考 #斯多葛主義 #尼采 #加繆 #逆境成長 #精神內耗  #底層邏輯 #終身成長\n07-02", "q": {"哲": ["殺不死你的，會讓你更強大。", "我們應該想像，西西弗斯是幸福的。", "能控制的去改變，不能控制的去接受。", "安慰會過期，智識不會。"], "排": ["逆境、撐住、繼續走。", "斯多葛教你接受，尼采教你超越，加繆教你反抗。", "接受不可控，掌握可控，超越苦難。", "冷酷、清醒、堅不可摧。"], "對": ["安慰讓你暫時好受，智識讓你長久站穩。", "逃避讓深淵更深，直面讓深淵變淺。", "脆弱的人等待救援，堅強的人自我建構。", "苦難不會因為抱怨而減少，但會因為理解而轉化。"], "反": ["你在逆境中，是在等安慰還是在找力量？", "你能控制的，有哪些？", "如果苦難無法避免，你選擇如何面對？", "是什麼讓你在黑夜裡繼續前行？"], "衝": ["失業、失戀、生病同時來臨，朋友的安慰讓你更難受。", "你讀到斯多葛的一句話，突然明白自己一直在為不可控的事痛苦。", "在最黑的夜裡，你想起加繆說的西西弗斯，竟然笑了。"], "翻": ["逆境不是終點，是鍛造的熔爐。", "冷酷的真理，比溫暖的謊言更有力量。", "不是要擺脫痛苦，而是在痛苦中找到意義。", "堅強不是不痛，是痛了依然前行。"], "遞": ["先接受現實，再分辨可控，最後超越苦難。", "從崩潰，到接受，到超越。", "撐住、看清、繼續走。"], "詩": ["逆境、撐住、繼續走。", "願你在深淵中，找到向上的繩索。", "黑夜再長，智識是你手中的燈。", "每一次撐住，都是一次重生。"]}, "p": "把你拉出深淵的，從來不是安慰，而是冷酷卻堅不可摧的底層智識。", "f": ["身處逆境", "安慰無法撐住", "斯多葛、尼采、加繆的智識", "接受、超越、反抗", "撐住，繼續走"], "pain": "在逆境中被安慰也無法真正站起來", "m": "哲學智識提供意義框架：區分可控不可控、在苦難中鍛造、在荒謬中反抗→內在力量", "a": "寫下逆境中你能控制的三件事，只專注這三件", "c": ["殺不死你的，會讓你更強大。", "逆境、撐住、繼續走。", "是什麼讓你在黑夜裡繼續前行？", "每一次撐住，都是一次重生。"]}, {"t": "如何系統提升行動力【必藏】", "b": "提升行動力，不是單點問題，而是系統問題！\n網上講拖延、講行動力的內容很多，但大多數問題是：\n要麼只講\"要自律\"\"要堅持\"，說了等於沒說；\n要麼東拼西湊幾個方法，頭疼醫頭、腳疼醫腳；\n要麼講得很熱血，看完打了雞血，第二天該拖還是拖。\n\n本篇迴歸本質和底層邏輯，先想清楚：\n行動力不足，到底卡在哪一層？\n拆開看，其實不是一個問題，是四道關卡：\n不敢選 → 不會選 → 不肯動 → 拿不到結果。\n每一層的卡點不一樣，能解決它的方法也完全不一樣。\n\n這次把這四層從根源到落地，一次講透。\n這套內容的特別之處在於：\n① 不頭疼醫頭，找真正的卡點\n拖延往往只是表面症狀，真正卡住你的，可能是更前面一層的恐懼或糾結沒解開。\n② 有科學依據，不是毒雞湯\n每一個方法都能查到出處——蔡格尼克效應、帕金森定律來自經典心理學與管理學研究；5秒法則、兩分鐘原則出自公開的方法論著作；雙向門法則、後悔最小化是貝索斯公開談過的決策框架。不靠喊口號，靠可複用的底層邏輯。\n③ 能落地，不空談\n每個方法都配了具體怎麼用，不是隻甩一個名詞讓你自己悟。\n如果你最近也在經歷：\n道理都懂，但遲遲不敢開始；\n好不容易選完，卻還是拖著不動；\n或者開了頭，中途又爛尾——\n這組建議收藏，對照著看你卡在第幾關。\n#行動力 #拖延症 #決策思維 #自我提升 #認知升級 #執行力 #職場成長 #邏輯思維  #提升行動力\n編輯時間：Jul 6", "q": {"哲": ["拖延往往只是表面症狀，真正卡住你的在更前面一層。", "行動力，是系統問題，不是意志問題。", "不靠口號，靠可複用的底層邏輯。", "找到真正的卡點，方法才會有效。"], "排": ["不敢選、不會選、不肯動、拿不到結果。", "蔡格尼克效應、帕金森定律、5 秒法則、兩分鐘原則、雙向門、後悔最小化。", "不頭疼醫頭，有科學依據，能落地執行。", "開始、選擇、行動、完成。"], "對": ["說「要自律」等於沒說，說「卡在哪一層」才有用。", "打雞血讓你衝一天，系統讓你走一年。", "頭疼醫頭是治標，找到卡點是治本。", "道理都懂，卻遲遲不敢開始。"], "反": ["你的行動力，卡在第幾關？", "你是不敢選，還是選了不肯動？", "開了頭的事，為什麼總是爛尾？", "你在用口號激勵自己，還是用方法驅動自己？"], "衝": ["你想換工作一年，卻連履歷都沒更新。", "你終於選好了副業方向，卻每天都說明天開始。", "你開始寫書，寫到第三章就再也沒打開過檔案。"], "翻": ["拖延不是懶，是卡在某一層。", "行動力不靠熱血，靠系統。", "選對方法，比更努力更重要。", "每一層的卡點，都有對應的解法。"], "遞": ["先解決不敢選，再解決不會選，再解決不肯動，最後拿到結果。", "從恐懼，到選擇，到行動，到完成。", "診斷、對症、執行、完成。"], "詩": ["對照著看你卡在第幾關，然後一關一關過。", "願你從此不再只是道理都懂。", "系統的行動力，是最穩的前進。", "從根源到落地，一次講透。"]}, "p": "行動力不是單點問題，而是系統問題：不敢選、不會選、不肯動、拿不到結果。", "f": ["講自律講堅持說了等於沒說", "行動力不足卡在哪一層", "四道關卡：不敢選、不會選、不肯動、拿不到結果", "每層用不同方法", "有科學依據、能落地"], "pain": "道理都懂卻不敢開始，選完還拖，開頭後又爛尾", "m": "分層診斷卡點→對應方法（雙向門、後悔最小化、5 秒法則、兩分鐘原則、蔡格尼克效應、帕金森定律）→系統提升行動力", "a": "對照四道關卡，找出你卡在第幾關並使用對應的方法", "c": ["開始、選擇、行動、完成。", "道理都懂，卻遲遲不敢開始。", "你的行動力，卡在第幾關？", "願你從此不再只是道理都懂。"]}, {"t": "把人生搭成一個，會自動向上的系統", "b": "穩健向上的人生，從來不是單點努力，而是需要系統託底！\n\n這篇用全球公認的系統思維方法(Donella Meadows《Thinking in Systems》、Peter Senge《第五項修煉》),講清三件事:系統思維到底是什麼、為什麼系統能力強的人這輩子走得更穩、以及怎麼從\"點狀/線性思維\"升級到\"系統。\n\n試著用它,搭建你自己的「人生系統」:既能複利,又能防崩盤。你現在卡在哪一級?👇\n標籤:\n#系統思維 #思維方式 #認知升級 #個人成長 #自我提升 #思維模型 #深度思考 #人生系統 #反脆弱\nJun 25", "q": {"哲": ["穩健向上的人生，從來不是單點努力。", "系統，是讓努力自動複利的結構。", "看見迴路，就看見了命運的走向。", "反脆弱，是系統的最高境界。"], "排": ["要素、連結、目的、回饋。", "既能複利，又能防崩盤。", "點狀思維、線性思維、系統思維。", "搭建系統，設計迴路，持續迭代。"], "對": ["點狀思維看局部，系統思維看全局。", "線性思維以為改一點只影響一點，系統思維知道牽一髮動全身。", "單點努力會累，系統運轉會自動。", "沒有系統，努力會流失；有了系統，努力會累積。"], "反": ["你的人生，有系統託底嗎？", "如果一個環節崩了，其他部分還能運轉嗎？", "你現在卡在哪一級？", "你的努力，是在累積還是在流失？"], "衝": ["你健身一個月瘦了五公斤，一次出差就全部胖回來。", "工作是你唯一的收入來源，一次裁員讓你全盤崩潰。", "朋友有健康、收入、關係三條迴路互相支撐，低谷時依然穩健。"], "翻": ["不是努力不夠，是缺少系統。", "系統不是束縛，是自由的基礎。", "設計好迴路，人生會自動向上。", "防崩盤，比追求極致更重要。"], "遞": ["先看見要素，再理解連結，再設計迴路，最後持續迭代。", "從點狀，到線性，到系統。", "搭建、運轉、複利、反脆弱。"], "詩": ["把人生搭成一個會自動向上的系統。", "願你的人生，有穩固的系統託底。", "系統對了，時間會成為你的盟友。", "既能複利，又能防崩盤。"]}, "p": "穩健向上的人生，從來不是單點努力，而是需要系統託底。", "f": ["單點努力難以持久", "系統思維（Meadows、Senge）", "系統能力強的人走得更穩", "從點狀線性升級到系統思維", "搭建既能複利又能防崩盤的人生系統"], "pain": "靠單點努力，一處崩就全盤崩", "m": "系統思維：要素、連結、目的、回饋迴路→設計正向增強迴路與防崩盤調節迴路→人生自動向上", "a": "畫出你的人生系統圖：哪些是增強迴路？哪些是風險點？", "c": ["反脆弱，是系統的最高境界。", "不是努力不夠，是缺少系統。", "搭建、運轉、複利、反脆弱。", "既能複利，又能防崩盤。"]}, {"t": "能力強的人，都有結構化思維", "b": "職場或事業想要進一步，結構化思維就是必須要掌握的能力！ 一團亂麻的難題，這樣拆解： 拆解 → 分類 → 組織 → 解決，4 步走完，再複雜的問題也能理清、找到關鍵。 方法和實戰案例全在圖裡，往左滑 👈 記得收藏。 評論區留了道拆解題，歡迎來練手～ #結構化思維 #思維方式 #認知升級 #職場乾貨 #個人成長 #邏輯思維 #拆解 #底層邏輯 #職場成長\n編輯時間：Jun 23", "q": {"哲": ["能力強的人，都有結構化思維。", "混亂不是問題太難，是沒有結構。", "拆開來，再大的問題也只是一堆小問題。", "結構，是思考的骨架。"], "排": ["拆解、分類、組織、解決。", "理清問題，找到關鍵，推動解決。", "方法、案例、練習。", "一團亂麻，四步理清。"], "對": ["沒結構是一團亂麻，有結構是一張地圖。", "能力強的人不是懂得多，而是理得清。", "混亂中瞎忙，結構中聚焦。", "大問題讓人恐懼，小問題讓人行動。"], "反": ["你面對複雜問題時，第一步做什麼？", "你的報告，讓人一看就懂嗎？", "你能把一個難題拆成幾個小問題嗎？", "你知道問題的關鍵在哪裡嗎？"], "衝": ["主管丟給你一個大專案，你盯著螢幕發呆一小時。", "你說了十分鐘，聽的人還是不知道你的重點。", "同事把同樣的問題拆成四塊，半天就理清了方向。"], "翻": ["複雜問題，簡單方法。", "結構化不是死板，是清晰。", "拆解，是解決的開始。", "職場進階的祕密，是結構。"], "遞": ["先拆解，再分類，再組織，最後解決。", "從亂麻，到要素，到結構，到答案。", "理清、聚焦、推動。"], "詩": ["再複雜的問題，也能理清、找到關鍵。", "願你的思考，有清晰的骨架。", "拆開來看，世界就沒那麼可怕。", "結構化思維，是職場最好的武器。"]}, "p": "再複雜的問題，用拆解、分類、組織、解決四步，都能理清並找到關鍵。", "f": ["職場進階需要結構化思維", "一團亂麻的難題", "拆解", "分類", "組織", "解決"], "pain": "面對複雜問題一團亂麻，不知從何下手", "m": "結構化四步：拆解成要素、依邏輯分類、組織成結構、找到關鍵解法→清晰高效", "a": "挑一個目前最亂的問題，用四步法拆一次", "c": ["能力強的人，都有結構化思維。", "一團亂麻，四步理清。", "混亂中瞎忙，結構中聚焦。", "拆開來看，世界就沒那麼可怕。"]}, {"t": "【AI帶不走】7個不可替代的底層元能力", "b": "7種回報率最高的底層能力，有跨學科研究支撐，分享給你。\n\n不管AI怎麼變、時代怎麼卷，這7種能力都是一個人最硬的底牌、真正的終極護城河。別的會過時，它們只會越練越值錢。\n值得從今天起，每天練一點。\n\n每種能力是什麼、為什麼重要、怎麼練，上面圖裡都講透了，往左滑，記得收藏。👆\n#底層能力 #認知升級 #思維方式 #個人成長 #自我提升 #思維模型 #終身成長\n編輯時間：Jul 10", "q": {"哲": ["別的會過時，元能力只會越練越值錢。", "最硬的底牌，是 AI 帶不走的能力。", "回報率最高的投資，是投資自己的底層能力。", "技能是枝葉，元能力是根。"], "排": ["是什麼，為什麼重要，怎麼練。", "學習力、思考力、判斷力、溝通力、情緒力、適應力、創造力。", "每天練一點，每月進一點，每年強一點。", "跨學科、可遷移、可複利。"], "對": ["工具技能會過時，底層能力會增值。", "AI 能做的越來越多，人不可替代的越來越珍貴。", "追新技能很累，練元能力很穩。", "時代越卷，底牌越重要。"], "反": ["你的能力，有幾項是 AI 帶不走的？", "你在投資會過時的技能，還是不會過時的能力？", "你的終極護城河是什麼？", "從今天起，你願意每天練一點嗎？"], "衝": ["你花一年學會的軟體技能，AI 一個月就能做到。", "同事技術不如你，卻因為溝通與判斷力升得比你快。", "換了三次產業，你發現唯一帶得走的是學習能力。"], "翻": ["AI 帶不走的，才是真正的資產。", "不是學更多，而是練更深。", "元能力不是天賦，是可以練出來的。", "真正的護城河，在你自己身上。"], "遞": ["先認識元能力，再選擇一項，再每天練習，最後形成底牌。", "從技能，到能力，到元能力。", "每天一點，終身受用。"], "詩": ["值得從今天起，每天練一點。", "願你的能力，在時代變化中越來越值錢。", "根扎得深，風再大也不怕。", "AI 帶不走的，是你一生的底牌。"]}, "p": "不管 AI 怎麼變、時代怎麼卷，底層元能力只會越練越值錢。", "f": ["AI 與時代快速變化", "會過時的技能 vs 不會過時的元能力", "七種跨學科支撐的底層能力", "是什麼、為何重要、怎麼練", "每天練一點"], "pain": "擔心技能被 AI 取代，不知道該投資什麼能力", "m": "元能力（學習、思考、判斷、溝通、情緒、適應、創造）→可遷移、可複利→終極護城河", "a": "選一種元能力，每天花十五分鐘刻意練習", "c": ["技能是枝葉，元能力是根。", "跨學科、可遷移、可複利。", "從技能，到能力，到元能力。", "值得從今天起，每天練一點。"]}, {"t": "【必藏】9個科學方法殺死拖延症", "b": "這篇筆記沒有情緒雞湯，只有硬核理性和底層邏輯。\n這9個方法之所以有效，是因為它們背靠心理學、行為學、哲學、腦科學等交叉學科。\n\n卡殼時直接對照正文，重置系統：\n階段一：看透內耗根源\n01 蔡格尼克效應 Zeigarnik Effect｜心理學\n未完結事項會持續佔用潛意識腦力，遇事來不及做完就記入備忘錄，大腦確認任務落地，自動停止精神內耗。\n例：棘手郵件寫明次日 9 點處理，不再胡思亂想。（布魯瑪・蔡格尼克）\n02 布里丹之驢 Buridan's Ass｜哲學 & 決策學\n選項優劣相近時反覆糾結易決策癱瘓，不必追求完美，可隨機選定方案落地。\n例：糾結專案 AB 二選一，50 分落地遠勝於無限等待最優解。（讓・布里丹）\n03 帕金森定律 Parkinson's Law｜管理學\n工時充裕則工作無限膨脹，人為設定短微型截止日。\n例：原定全天寫週報，壓縮至 30 分鐘，倒逼專注。（西里爾・帕金森）\n04 瓦倫達效應 Wallenda Effect｜競技心理學\n過度擔憂成敗容易發揮失常，剝離結果執念，專注當下動作。\n例：大客戶提案焦慮失眠，不去糾結輸贏，只專注落地演練。（卡爾・瓦倫達）\n\n階段二：破除拖延啟動障礙\n05 兩分鐘原則 The 2-Minute Rule｜時間 & 行為心理學\n兩分鐘內可做完的瑣事立刻落地。\n例：隨手回訊息，杜絕小事堆積內耗。\n雛形出自戴維・艾倫《搞定》，完善於《原子習慣》詹姆斯・克利爾。\n06 最小可行行動 Mini Action｜精益管理\n源自《精益創業》MVP 理論（名詞為原創整合），大目標拆解成極低門檻起步。\n例：3000 字覆盤難動筆，開啟文件先敲 500 字，靠慣性帶動後續寫作。（埃裡克・萊斯）\n07 5 秒強力法則 The 5-Second Rule｜行為心理學\n萌生怠惰念頭立刻倒數 54321 起身行動。\n例：賴床時倒數打斷偷懶想法，瞬間起床。\n理論來自梅爾・羅賓斯實踐著作。\n\n階段三：聚焦高效落地\n08 認知單執行緒 Monotasking｜認知科學\n人腦無法高效多工，固定時段只專注一件事。\n例：重要工作時隔絕訊息，專心深耕 45 分鐘。\n09 艾森豪威爾矩陣 Eisenhower Matrix｜戰略時間管理\n以重要、緊急雙維度劃分事項，主攻重要不緊急事項。\n例：晨間 5 分鐘梳理日程，對任務分類，聚焦重要事項。（艾森豪威爾）\n\n身心疲憊時理智極易過載，建議截圖儲存。拖延內耗時，拿出來對照重置狀態。\n\n關注我，持續精進認知，告別無效內耗。\n#邏輯思維 #認知升級 #自我提升 #精神內耗 #治癒拖延症 #心理學模型 #提升行動力 #精力管理\nJun 8", "q": {"哲": ["拖延不是懶，是系統卡住了。", "五十分落地，遠勝無限等待最優解。", "未完結的事，會持續佔用你的腦力。", "過度擔憂成敗，反而容易失常。"], "排": ["蔡格尼克效應、布里丹之驢、帕金森定律、瓦倫達效應。", "兩分鐘原則、最小可行行動、5 秒法則。", "單執行緒專注、艾森豪威爾矩陣。", "看透根源，破除障礙，聚焦落地。"], "對": ["雞湯讓你感動，方法讓你行動。", "工時充裕則工作無限膨脹，截止日短則效率倍增。", "多工看似高效，單工才是真高效。", "糾結完美方案，不如隨機選定落地。"], "反": ["你的拖延，是因為不知道怎麼開始，還是怕做不好？", "你腦中有多少未完成的事在偷偷消耗你？", "你是不是在兩個差不多的選項之間糾結了太久？", "你今天主攻的，是重要的事還是緊急的事？"], "衝": ["一封棘手郵件讓你焦慮一整晚，寫下「明早 9 點處理」後立刻睡著了。", "三千字覆盤一直不敢動筆，先敲五百字後竟一口氣寫完。", "你賴床時倒數 54321，竟然真的起來了。"], "翻": ["拖延的根源，常常是內耗。", "降低門檻，比提高意志力更有效。", "剝離結果執念，表現反而更好。", "重要不緊急的事，才是人生的關鍵。"], "遞": ["先看透內耗，再破除啟動障礙，最後聚焦高效落地。", "從焦慮，到啟動，到專注，到完成。", "卸載、啟動、聚焦。"], "詩": ["拖延內耗時，拿出來對照，重置狀態。", "願你告別無效內耗。", "一個好方法，勝過一百句加油。", "行動起來，拖延就不攻自破。"]}, "p": "殺死拖延不靠雞湯，而靠背靠心理學、行為學與腦科學的硬核方法。", "f": ["看透內耗根源：蔡格尼克效應、布里丹之驢、帕金森定律、瓦倫達效應", "破除啟動障礙：兩分鐘原則、最小可行行動、5 秒法則", "聚焦高效落地：單執行緒、艾森豪威爾矩陣"], "pain": "拖延內耗、決策癱瘓、啟動困難、多工低效", "m": "三階段九方法：卸載未完成事項、隨機決策、壓縮時限、剝離結果執念、降低啟動門檻、倒數打斷、單工專注、優先排序", "a": "拖延時，挑一個方法立刻執行：寫備忘錄、倒數 54321 或先做兩分鐘", "c": ["拖延不是懶，是系統卡住了。", "雞湯讓你感動，方法讓你行動。", "剝離結果執念，表現反而更好。", "願你告別無效內耗。"]}, {"t": "總糾結內耗？你缺一套決策框架", "b": "你是不是也有卡在「要不要換工作」「怎麼選副業」「這筆錢該不該花」，內耗到精疲力竭的情況？\n\n頂級高手和普通人的核心區別，不在智商高低，而在於他們大腦裡有一套清晰的決策框架。\n\n今天把傑夫·貝佐斯、蘇西·威爾許最核心的 3個頂級決策模型徹底拆透了。拒絕雞湯和套話，只有硬核定義與高頻場景對照，全部擰乾水分，做成了清爽的【卡片】。\n\n👇 直接往左滑看圖（建議全篇看完）：\nP2｜單/雙向門模型：重新定義你的試錯成本，徹底斬斷行動癱瘓。\nP3｜10-10-10法則模型 & 後悔最小化模型：強行剝離即時情緒，用終局思維破開長遠迷茫。\nP4｜5大場景對號入座：職場嫌棄、副業拖延、成長投資……看看你踩了哪條致命誤區。\nP5｜終極自救看板：專為你智商歸零時準備的「理智安全網」，建議直接截圖儲存。\n記住一句話：你最大的內耗，就是用「單向門」的焦慮，去糾結「雙向門」的小事。\n———\n持續更新邏輯、認知、思維乾貨，歡迎關注，陪你把腦子越用越清醒。\n#決策思維 #認知升級 #思維模型 #貝佐斯 #內耗自救 #成長 #自我提升\n編輯於 09-18", "q": {"哲": ["頂級高手與普通人的區別，在於大腦裡有一套決策框架。", "可以回頭的事，就大膽去試。", "用終局思維，破開眼前的迷茫。", "剝離即時情緒，才能看清長遠價值。"], "排": ["單向門、雙向門、10-10-10、後悔最小化。", "十分鐘後、十個月後、十年後。", "換工作、選副業、花錢、成長投資。", "定義試錯成本，剝離情緒，終局思考。"], "對": ["單向門要慎重，雙向門要快速。", "十分鐘的情緒，不該決定十年的人生。", "不做會後悔，做了可修正。", "糾結是內耗，框架是解藥。"], "反": ["你正在糾結的事，是單向門還是雙向門？", "十年後的你，會怎麼看今天這個決定？", "你最怕的是失敗，還是後悔？", "你是不是用大事的焦慮，在糾結小事？"], "衝": ["你為了要不要報一門課糾結了一個月，課都快截止了。", "你想換工作，一想到可能後悔就一直不敢動。", "朋友用後悔最小化框架做決定，三分鐘就辭職創業了。"], "翻": ["大多數決定，都是可以回頭的。", "內耗不是因為選擇難，而是缺框架。", "不後悔的人生，不是沒選錯，而是選了。", "智商歸零時，框架是你的安全網。"], "遞": ["先判斷門的類型，再用時間尺度審視，最後用終局思維決定。", "從糾結，到框架，到果斷。", "分門、拉長、終局、行動。"], "詩": ["你最大的內耗，就是用單向門的焦慮，去糾結雙向門的小事。", "願你的每一個決定，都清醒而果斷。", "框架是腦中的燈塔。", "陪你把腦子越用越清醒。"]}, "p": "你最大的內耗，是用「單向門」的焦慮，去糾結「雙向門」的小事。", "f": ["卡在換工作、選副業、花錢的糾結", "高手有清晰決策框架", "單雙向門模型", "10-10-10 法則與後悔最小化", "五大場景對照與理智安全網"], "pain": "在各種選擇前內耗到精疲力竭", "m": "依可逆性區分決策重量；以時間尺度剝離即時情緒；以終局思維破除迷茫", "a": "糾結時問：這是可以回頭的雙向門嗎？十分鐘、十個月、十年後我怎麼看？", "c": ["可以回頭的事，就大膽去試。", "十分鐘後、十個月後、十年後。", "單向門要慎重，雙向門要快速。", "框架是腦中的燈塔。"]}, {"t": "CEO覆盤|看穿洗腦，反套路進階指南", "b": "本期帶來硬核思維防身術，不用大道理，只拿理性的手術刀，幫你剝離情感綁架，還原清澈的清醒與沉著。\n\n👉 完整5大邏輯謬誤深度拆解、破局公式，全在上方卡片！直接往左滑，一分鐘給大腦完成“思維排毒”。\n\n轉發給你那個經常被帶節奏的閨蜜/同事，帶她一起清醒。\n你被哪句鬼話綁架過最久？評論區寫下來，我幫你拆解它。\n\n持續分享親身實踐過的邏輯與認知乾貨，想活得更清醒，點關注！一起進階\n#邏輯思維 #邏輯謬誤 #反洗腦 #反套路 #情緒綁架 #精神內耗 #認知提升 #成年人思維 #CEO覆盤 #職場成長\n編輯時間：Jun 1", "q": {"哲": ["情感綁架，是最溫柔的操控。", "理性是手術刀，切開話術的外衣。", "被洗腦的人，往往不知道自己被洗腦。", "清醒，是成年人最好的防身術。"], "排": ["剝離情感綁架，拆解話術套路，還原清醒沉著。", "五大謬誤，破局公式，思維排毒。", "看穿、拆解、反制。", "不講大道理，只用手術刀。"], "對": ["溫情包裝的話術，比惡意攻擊更危險。", "被帶節奏很快，回過神來很慢。", "大道理讓人聽了就忘，破局公式讓人立刻能用。", "情緒在說話時，理性要先停一下。"], "反": ["你被哪句話綁架過最久？", "那句「我是為你好」，真的是為你好嗎？", "你能分辨情緒與邏輯嗎？", "你身邊有沒有經常被帶節奏的人？"], "衝": ["一句「你這樣對得起我嗎」，讓你放棄了自己的決定。", "同事說「大家都這樣做」，你就跟著做了不該做的事。", "你被「不買就落後了」的話術說服，花了不該花的錢。"], "翻": ["反套路，不是冷漠，是清醒。", "看穿洗腦，從辨識謬誤開始。", "情感不是錯，用情感綁架才是。", "一分鐘排毒，換來一生清醒。"], "遞": ["先辨識謬誤，再拆解結構，最後用公式回應。", "從被綁架，到看穿，到反制。", "停、看、拆、答。"], "詩": ["一分鐘給大腦完成思維排毒。", "願你活得清醒，不被任何話術綁架。", "理性的手術刀，切開所有迷霧。", "帶著身邊的人，一起清醒。"]}, "p": "看穿洗腦，靠的不是大道理，而是理性的手術刀。", "f": ["情感綁架與話術套路", "拿理性手術刀剝離", "五大邏輯謬誤深度拆解", "破局公式", "完成思維排毒"], "pain": "被情緒綁架、被話術洗腦卻難以察覺", "m": "辨識謬誤類型→拆解話術結構→以破局公式回應→恢復清醒與沉著", "a": "回想一句曾綁架你最久的話，用謬誤清單拆解它", "c": ["情感綁架，是最溫柔的操控。", "不講大道理，只用手術刀。", "反套路，不是冷漠，是清醒。", "帶著身邊的人，一起清醒。"]}, {"t": "CEO覆盤：懂不懂邏輯，差的是整個人生", "b": "掌握邏輯，看穿世界！\n但網上關於「邏輯」的內容太多了。\n有些是概念混亂，有些是雞湯包裝。\n\n所以這篇我想認真做一次溯源：\n從亞里士多德《詭辯篇》到現代批判性思維，把邏輯的底層框架重新梳理一遍。\n如果你想系統入門邏輯，看這一篇基本就夠了！\n\n這組卡片裡整理了：\n什麼是邏輯，為什麼很多人一開始就理解錯了\n形式邏輯和非形式邏輯到底有什麼區別\n真實世界裡常見的推理方式\n5 個訓練邏輯能力的方法\n適合入門的閱讀路徑\n最後一張還有互動測試\n\n上滑卡片閱讀↑\n看到最後，試試你能答對幾題。\n#邏輯思維 #批判性思維 #邏輯謬誤 #非形式邏輯 #形式邏輯  #反PUA #思維框架 #決策思維 #認知提升 #CEO覆盤\n編輯於 05-26", "q": {"哲": ["掌握邏輯，看穿世界。", "很多人一開始就把邏輯理解錯了。", "邏輯不只是推理，是看清世界的方式。", "懂邏輯的人，活得更清楚。"], "排": ["什麼是邏輯，形式與非形式，常見推理，訓練方法，閱讀路徑。", "演繹、歸納、類比。", "亞里士多德、詭辯篇、批判性思維。", "溯源、理解、訓練、應用。"], "對": ["概念混亂讓人越學越糊塗，溯源梳理讓人一次看懂。", "形式邏輯管結構，非形式邏輯管日常。", "雞湯包裝的邏輯，不是邏輯。", "懂邏輯的人和不懂的人，看到的是兩個世界。"], "反": ["你真的知道什麼是邏輯嗎？", "你分得清形式邏輯與非形式邏輯嗎？", "你每天用的推理方式，可靠嗎？", "看到最後，你能答對幾題？"], "衝": ["你以為邏輯就是會吵架，學了之後才發現完全不是。", "你讀了一篇講邏輯的雞湯文，反而更困惑了。", "同事用一個類比說服了所有人，你卻覺得哪裡不對。"], "翻": ["邏輯不是辯論技巧，是思考的基本功。", "溯源，才能理解本質。", "系統入門，看這一篇就夠了。", "邏輯不枯燥，它是看穿世界的眼鏡。"], "遞": ["先理解定義，再區分類型，再學推理，最後刻意訓練。", "從混亂，到系統，到應用。", "溯源、梳理、練習、測試。"], "詩": ["懂不懂邏輯，差的是整個人生。", "願你戴上邏輯的眼鏡，看穿世界。", "清晰的思考，是一生的禮物。", "試試你能答對幾題。"]}, "p": "懂不懂邏輯，差的是整個人生；掌握邏輯，看穿世界。", "f": ["網上邏輯內容概念混亂", "溯源亞里士多德《詭辯篇》到現代批判性思維", "什麼是邏輯、形式與非形式邏輯、常見推理", "五個訓練方法", "入門閱讀路徑與互動測試"], "pain": "對邏輯理解錯誤或混亂，難以系統入門", "m": "溯源建立正確框架→區分形式與非形式邏輯→掌握推理方式→刻意訓練", "a": "依閱讀路徑選一本入門書，並做完最後的互動測試", "c": ["懂邏輯的人，活得更清楚。", "溯源、理解、訓練、應用。", "雞湯包裝的邏輯，不是邏輯。", "清晰的思考，是一生的禮物。"]}, {"t": "CEO覆盤|識別邏輯謬誤，看穿話術謊言洗腦", "b": "網上的邏輯迷惑發言太多——概念混亂、套路百出，甚至套錯邏輯。\n我特深度研究和整理了亞里士多德《詭辯篇》+ 現代批判性思維經典的精華，\n做成16種主流邏輯謬誤 + 識別5步法卡片，幫你輕鬆識破套路。\n\n卡片都在上滑 ↑ 試試卡片末尾，你能發現幾個邏輯漏洞？\n#邏輯謬誤 #批判性思維 #邏輯思維 #反PUA #反洗腦 #思維框架 #決策思維 #認知提升 #成年人思維 #CEO覆盤\n編輯時間：5月20日", "q": {"哲": ["識破套路，是成年人的必修課。", "謬誤藏在話術裡，話術藏在情緒裡。", "外看穿他人，內自查自己。", "認識謬誤，就是給思維裝上防毒軟體。"], "排": ["偷換概念、強加因果、訴諸情感、從眾、人身攻擊。", "識別五步法，十六種謬誤，一張卡片。", "看穿話術，識破謊言，拒絕洗腦。", "聽、辨、拆、問、答。"], "對": ["話術很動聽，邏輯很誠實。", "看懂謬誤的人，很難被洗腦。", "識破別人是能力，自查自己是修養。", "套路之所以有效，是因為我們不認識它。"], "反": ["你能發現幾個邏輯漏洞？", "那些說服你的話，經得起邏輯檢驗嗎？", "你自己說話時，有沒有犯過謬誤？", "你被哪一種謬誤騙得最多？"], "衝": ["推銷員說「這是最後一件」，你立刻刷卡。", "網上有人用人身攻擊回應你的觀點，你氣到忘了自己原本要說什麼。", "你發現自己也常說「大家都這麼做」，才意識到自己也在用謬誤。"], "翻": ["不是對方太會說，是你不懂謬誤。", "反 PUA，從識別謬誤開始。", "自查自己的謬誤，比識破別人更重要。", "清醒的頭腦，是最好的防護罩。"], "遞": ["先認識謬誤，再學識別步驟，最後即時應用。", "從被騙，到看穿，到自查。", "認識、識別、拆解、免疫。"], "詩": ["試試你能發現幾個邏輯漏洞。", "願你從此不再被話術洗腦。", "看穿套路，世界就清明了。", "邏輯，是你思想的盾牌。"]}, "p": "識破套路靠的不是聰明，而是看懂 16 種主流邏輯謬誤與識別五步法。", "f": ["網上話術套路百出", "整理亞里士多德《詭辯篇》與現代批判性思維精華", "16 種主流邏輯謬誤", "識別五步法", "外看穿話術、內自查漏洞"], "pain": "被話術謊言洗腦，看不出邏輯漏洞", "m": "熟悉謬誤類型→套用五步識別法→在對話中即時辨識→守住判斷", "a": "用卡片末尾的練習題，找出其中的邏輯漏洞", "c": ["外看穿他人，內自查自己。", "看懂謬誤的人，很難被洗腦。", "你被哪一種謬誤騙得最多？", "試試你能發現幾個邏輯漏洞。"]}, {"t": "CEO覆盤|9種認識偏差，正在偷偷操控你", "b": "網上關於「認知偏差」類文章太亂，概念混淆、錯誤百出。\n看多了反而越糊塗，越難理清思路，在錯誤路上越走越遠。\n\n對照卡尼曼《思考快與慢》 + 行為經濟學原典，我花大量時間整理打磨，並結合自己的使用體感，挑出 9 個最核心的認知偏差。\n每條都告訴你是什麼、代表案例、怎麼修正\n滑動卡片就能看到逐條拆解！\n\n後續會繼續分享邏輯思維、思維框架、認知升級等乾貨。\n感興趣的歡迎關注，也歡迎留言聊聊。\n\n#認知偏差 #決策思維 #思維框架 #批判性思維 #邏輯思維 #認知提升 #CEO覆盤 #職場提升 #乾貨分享 #成長\n05-18", "q": {"哲": ["偏差不是你的錯，但看不見它是你的責任。", "越學越糊塗，往往是因為學錯了源頭。", "認知偏差，是大腦裡看不見的手。", "知道偏差，是修正的開始。"], "排": ["是什麼，代表案例，怎麼修正。", "錨定效應、確認偏誤、可得性捷思、損失規避。", "原典對照，精心打磨，逐條拆解。", "看見、理解、修正。"], "對": ["概念混淆讓人越走越遠，原典溯源讓人回到正軌。", "偏差在暗處操控，覺察讓它見光。", "知道一百個偏差名字，不如真正修正一個。", "你以為你在選擇，其實是偏差在選擇。"], "反": ["你的決定，有多少是偏差替你做的？", "你讀的認知偏差內容，來源可靠嗎？", "你能說出一個你常犯的偏差嗎？", "知道偏差之後，你修正了嗎？"], "衝": ["商品標價從三千降到一千，你覺得很划算，其實它只值五百。", "你相信一個觀點後，只看支持它的文章。", "看到一則空難新聞，你開始害怕坐飛機，卻天天騎快車。"], "翻": ["偏差不是缺陷，是人類的出廠設定。", "學錯了偏差，比不學更危險。", "修正偏差，不需要消滅它，只需要覺察它。", "回到原典，才能學到真東西。"], "遞": ["先準確理解，再觀察案例，最後實踐修正。", "從被操控，到覺察，到掌控。", "溯源、辨識、修正。"], "詩": ["九種認知偏差，正在偷偷操控你。", "願你看見那雙看不見的手。", "覺察的光，照亮偏差的暗處。", "清醒，是一次次修正的累積。"]}, "p": "九種認知偏差正在偷偷操控你；看懂它，才能修正它。", "f": ["網上認知偏差文章混亂錯誤", "對照卡尼曼《思考快與慢》與行為經濟學原典", "挑出九個最核心偏差", "每條：是什麼、案例、怎麼修正", "持續分享邏輯與認知"], "pain": "被錯誤或混亂的認知偏差內容誤導，越學越糊塗", "m": "原典溯源→準確定義→案例理解→修正方法→減少決策失誤", "a": "從九個偏差中挑一個，觀察自己本週何時被它影響", "c": ["知道偏差，是修正的開始。", "知道偏差之後，你修正了嗎？", "學錯了偏差，比不學更危險。", "願你看見那雙看不見的手。"]}, {"t": "CEO覆盤|一張圖識別16種主流邏輯謬誤", "b": "可儲存自用!\n個人深度打磨：邏輯謬誤識別心法\n外能一眼看穿他人話術套路\n內可自查自身思維漏洞\n\n你有沒有意識到，我們常常容易被騙、被帶節奏、溝通總吃虧，\n並不是智商不夠，\n而是看不懂生活裡藏著的各種邏輯陷阱。\n分不清偷換概念，容易被轉移焦點偏離核心；\n分不清強加因果，容易把先後發生當必然因果；\n分不清從眾跟風，容易隨大流喪失獨立思考；\n分不清訴諸情感，容易被道德綁架裹挾判斷；\n你以為是識人不準、情商不夠，\n其實是——沒弄懂底層邏輯謬誤。\n一張圖整理16個日常高頻邏輯謬誤，\n遇事糾結、看人辨事、真假資訊識別、溝通談判都能用，\n對照一眼就能拆穿套路，守住自己的判斷，做清醒成年人。\n#邏輯謬誤 #CEO覆盤 #決策思維 #邏輯思維 #思維框架  #認知提升 #職場提升 #自我提升 #乾貨分享 #反內耗\n5月14日", "q": {"哲": ["你以為是情商不夠，其實是沒弄懂邏輯謬誤。", "一眼看穿套路，才能守住自己的判斷。", "謬誤不只在別人嘴裡，也在自己腦中。", "清醒的成年人，懂得對照與自查。"], "排": ["分不清偷換概念，分不清強加因果，分不清從眾跟風，分不清訴諸情感。", "看人辨事，識別真假，溝通談判。", "外能看穿話術，內可自查漏洞。", "一張圖，十六種謬誤，一生受用。"], "對": ["被轉移焦點的人偏離核心，看穿的人回到核心。", "先後發生不等於因果必然。", "隨大流的人失去思考，獨立的人保有判斷。", "道德綁架很有力，看穿它更有力。"], "反": ["你常常被騙，真的是因為不夠聰明嗎？", "你分得清先後與因果嗎？", "你被道德綁架過嗎？", "你有沒有一張屬於自己的謬誤清單？"], "衝": ["爭論時對方一句「你也好不到哪去」，你就忘了原本的論點。", "同事說「上次改了流程業績就下滑」，大家就決定改回去。", "一句「你不幫忙就是冷血」，讓你答應了不該答應的事。"], "翻": ["不是情商問題，是邏輯問題。", "看懂謬誤，溝通不再吃虧。", "一張圖，勝過十本書。", "最好的防騙術，是邏輯。"], "遞": ["先認識謬誤，再對照場景，最後即時識別。", "從被騙，到看穿，到清醒。", "存圖、對照、識別、守住。"], "詩": ["對照一眼就能拆穿套路，做清醒的成年人。", "願你在每一場對話中，守住自己的判斷。", "一張圖，照亮所有話術的陰影。", "清醒，是最好的情商。"]}, "p": "容易被騙、被帶節奏，不是智商不夠，而是看不懂藏在生活裡的邏輯陷阱。", "f": ["容易被騙被帶節奏", "不是智商問題", "分不清偷換概念、強加因果、從眾跟風、訴諸情感", "一張圖 16 種高頻謬誤", "外看穿話術、內自查漏洞"], "pain": "溝通總吃虧，以為是識人不準或情商不夠", "m": "辨識謬誤→看穿話術→守住判斷；自查謬誤→修正自身思維", "a": "把一張圖存下來，遇事糾結時對照一次", "c": ["清醒的成年人，懂得對照與自查。", "外能看穿話術，內可自查漏洞。", "你分得清先後與因果嗎？", "清醒，是最好的情商。"]}, {"t": "CEO覆盤|卡尼曼：你以為在深思？", "b": "你有沒有這樣的經歷—\n\n你以為自己慎重考慮了好幾天做的決定，\n但回頭一想：決策其實是\"那一瞬間\"拍板的，\n後面幾天只是在給自己找合理化的理由。\n\n諾獎得主 Kahneman 把這件事拆得清清楚楚\n\n系統 1（快思考）：自動、瞬間、幾乎不耗能\n系統 2（慢思考）：主動、緩慢、需要專注\n\n但問題在：系統 2 天性懶惰，幾乎從不主動啟動。\n所以你絕大部分\"深思熟慮\"，\n其實是系統 1 在 0.3 秒內做完決定，\n系統 2 只是在後面給你找合理化理由。\n\n人生很多追悔莫及的選擇，\n都是沒意識到自己在“快思考”。\n收好卡尼曼5個預警訊號，\n關鍵時刻立刻切換慢思考。\n\n🙋‍♀️ 評論區聊聊： 你最近哪個決策，事後想想其實是系統 1 替你做的？\n#CEO覆盤 #決策思維 #思維框架 #卡尼曼 #慢思考 #反內耗 #職場成長  #成長乾貨 #諾獎得主 #認知提升\n編輯時間：May 12", "q": {"哲": ["系統 2 天性懶惰，幾乎從不主動啟動。", "很多追悔莫及的選擇，都是沒意識到自己在快思考。", "深思熟慮，可能只是事後的合理化。", "知道何時該慢下來，是決策的智慧。"], "排": ["自動、瞬間、不耗能；主動、緩慢、需專注。", "系統 1 拍板，系統 2 找理由，你以為在深思。", "五個預警訊號，關鍵時刻切換。", "覺察快思考，啟動慢思考，做出好決定。"], "對": ["你以為想了好幾天，其實在第一秒就決定了。", "快思考省力，慢思考省錯。", "直覺在大多數時候可靠，在關鍵時刻危險。", "合理化是大腦的公關部門。"], "反": ["你最近哪個決策，事後想想是系統 1 替你做的？", "你的深思熟慮，是在思考還是在找理由？", "你知道什麼時候該切換到慢思考嗎？", "如果決定在 0.3 秒就做了，你還在想什麼？"], "衝": ["你糾結三天要不要買一台車，其實第一眼看到時就已經決定了。", "面試五分鐘你就決定錄取他，之後所有問題都在確認你的直覺。", "你憑感覺投資，賠錢後才發現當時完全沒做功課。"], "翻": ["深思不等於慢思考。", "直覺不是敵人，不覺察才是。", "大腦很懶，你得主動叫醒它。", "好的決策，是知道自己在用哪個系統。"], "遞": ["先覺察系統 1，再辨識預警訊號，最後啟動系統 2。", "從瞬間拍板，到覺察，到慢思考。", "停、察、慢、決。"], "詩": ["收好五個預警訊號，關鍵時刻立刻切換慢思考。", "願你在重要時刻，喚醒那個懶惰的系統 2。", "慢一點，答案會更清楚。", "真正的深思，是知道自己在想什麼。"]}, "p": "你以為的深思熟慮，常常是系統 1 在 0.3 秒內做完決定，系統 2 只負責找理由。", "f": ["以為慎重考慮了好幾天", "決策其實是瞬間拍板", "卡尼曼：系統 1 快、系統 2 慢", "系統 2 天性懶惰", "五個預警訊號，關鍵時刻切換慢思考"], "pain": "事後才發現所謂深思熟慮只是在合理化瞬間決定", "m": "系統 1 自動快速做決定→系統 2 懶惰地合理化→預警訊號觸發主動切換", "a": "重要決定前，對照五個預警訊號，強制切換到慢思考", "c": ["深思熟慮，可能只是事後的合理化。", "五個預警訊號，關鍵時刻切換。", "深思不等於慢思考。", "慢一點，答案會更清楚。"]}, {"t": "CEO覆盤|貝索斯雙門：成年人決策分水嶺", "b": "人的一生，其實就是由無數次選擇與決策堆疊而成。\n\n可我們大多數人，都在犯同一個致命錯誤：\n做決策永遠一刀切。\n該慎重的大事，草率拍板、倉促入局，最後導致無法挽回的後果；\n可試錯的小事，卻反覆內耗、猶豫不前，白白耗光了心力與時機。\n\n真正的頂級清醒，從來不是事事謹慎，也不是事事魯莽。\n分清人生裡的單向門與雙向門，才是成年人決策能力的真正分水嶺。\n\n“雙門”理論是2016年貝索斯在股東信中提出的元認知級別的決策方法！\n什麼是？怎麼落地執行？對普通人價值？看上方卡片就夠了。\n\n評論區聊聊：\n你最近卡在哪扇門前？\n#CEO覆盤 #決策思維 #思維框架 #反內耗 #貝索斯 #決策力 #職場成長 #自我提升 #邏輯思維 #理性\nMay 10", "q": {"哲": ["頂級清醒，不是事事謹慎，也不是事事魯莽。", "人生，是由無數次選擇堆疊而成的。", "分清可逆與不可逆，是元認知級的決策力。", "心力有限，要用在真正的單向門上。"], "排": ["單向門慎重，雙向門快速。", "該慎重的大事草率，可試錯的小事內耗。", "分類、分配、決斷。", "是什麼，怎麼落地，對普通人的價值。"], "對": ["大事草率是魯莽，小事內耗是浪費。", "一刀切的決策，是最常見的致命錯誤。", "進了單向門回不來，進了雙向門隨時可退。", "謹慎用錯地方，就成了猶豫。"], "反": ["你最近卡在哪扇門前？", "你是不是在小事上猶豫太久，在大事上決定太快？", "這個決定，回得了頭嗎？", "你的心力，花在了對的門上嗎？"], "衝": ["你為了選一家餐廳糾結半小時，卻在一次飯局上就答應了合夥創業。", "換個髮型你想了三個月，簽房貸卻只看了一次房。", "同事快速試錯了十個小專案，你還在第一個專案的規劃階段。"], "翻": ["決策能力，不是更謹慎，而是更會分類。", "大多數事情，都是雙向門。", "快速試錯，是對雙向門的尊重。", "真正的慎重，只留給單向門。"], "遞": ["先分類門，再分配心力，最後果斷行動。", "從一刀切，到分門別類，到清醒決策。", "辨門、配力、決斷。"], "詩": ["分清單向門與雙向門，是成年人決策的分水嶺。", "願你在每一扇門前，都知道該快還是該慢。", "雙向門前大膽走，單向門前多想一步。", "清醒的決策，讓人生少走彎路。"]}, "p": "分清人生裡的單向門與雙向門，才是成年人決策能力的真正分水嶺。", "f": ["人生由無數決策堆疊", "致命錯誤：決策一刀切", "大事草率、小事內耗", "貝索斯雙門理論", "單向門慎重、雙向門快速"], "pain": "該慎重的大事草率拍板，可試錯的小事卻反覆內耗", "m": "依可逆性分類決策→分配不同的慎重程度與速度→節省心力、避免重大失誤", "a": "列出你目前卡住的決定，標註是單向門還是雙向門", "c": ["人生，是由無數次選擇堆疊而成的。", "分類、分配、決斷。", "這個決定，回得了頭嗎？", "清醒的決策，讓人生少走彎路。"]}, {"t": "CEO覆盤|內耗自救：我用這4步把自己拉回來", "b": "有段時間,\n我陷入了一種反覆消耗的狀態:\n一邊做事,一邊懷疑值不值得;\n開始前反覆推演,開始後擔心落空。\n總想等邏輯100%完整,\n等未來100%清晰。\n\n結果:\n事情顆粒無收,\n人卻已經疲憊不堪。\n後來我才意識到,\n這本質上是一種\"心智的熵增\"——\n你在用大腦空轉,\n而不是解決問題。\n\n現在,\n只要我察覺到自己在反覆糾結、遲遲不動,\n我就強制自己按這4條底層邏輯執行,\n把生命力重新拉回行動裡:\n——\n① 先分清:\n這是事實,還是我的\"腦補\"?\n停下來問自己:\n現在讓我焦慮的,\n是已經發生的客觀事實,\n還是我對未來的負面推演?\n把\"事實\"寫下來,\n其他推演全部標註為\"待驗證\"。\n很多內耗,\n本質上是在為還沒發生的事買單。\n——\n② 問自己:\n什麼是當下我能控制的?\n把問題強行拆解:\n不能改變的(比如大環境、別人的偏見),\n直接接受或止損;\n能改變的,\n才是值得投入精力的\"黃金區域\"。\n在不可控的領域反覆掙扎,\n是最高昂的資源浪費。\n——\n③ 給思考設一個\"熔斷點\"\n告訴自己:\n我再想10分鐘,然後必須進入下一步。\n沒有邊界的思考,\n本質上是一種\"看起來很努力的逃避\"。\n與其在真空裡求最優解,\n不如先執行,再最佳化。\n——\n④ 先做一個\"最小行動\"去驗證\n不要再問最優解是什麼。\n只問:\n我現在能做的、不費力的\n最小一步是什麼?\n哪怕只是打一個電話、\n寫一個提綱、做一個極小的測試。\n很多清晰,\n不是想出來的,\n而是在行動中\"長\"出來的。\n\n真正讓人恢復力量的,\n往往不是瞬間想通,\n而是重新拿回掌控權。\n尤其是那些\"認真、對自己有要求\"的人,\n最容易掉進思維的深坑。\n但請記得:\n邏輯是硬的,\n但活法可以是鬆弛的。\n你不需要一次性解決所有問題。\n先把自已從反覆消耗裡拉出來,\n事情就會開始重新流動。\n\n這套方法,\n是我自己反覆打磨的邏輯底牌,\n在過去幾年 創業經歷裡,反覆使用。\n如果你最近也總是想太多,\n建議先收藏,\n下次拿出來強制執行一遍。\n如果你正卡在某個決策裡,\n在評論區留下你的\"糾結場景\",\n我試著幫你拆解一下。\n\n一起在這個時代,\n重新 Come Alive。\n#CEO覆盤 #反內耗 #行動力\n#職場成長 #思維邏輯#內耗自救#想太多#深度思考 #認知提升\nMay 7", "q": {"哲": ["很多內耗，本質上是在為還沒發生的事買單。", "沒有邊界的思考，是一種看起來很努力的逃避。", "邏輯是硬的，但活法可以是鬆弛的。", "真正讓人恢復力量的，是重新拿回掌控權。"], "排": ["分清事實，找出可控，設熔斷點，做最小行動。", "打一個電話，寫一個提綱，做一個極小的測試。", "不可控的接受或止損，可控的才投入精力。", "覺察、拆解、熔斷、行動。"], "對": ["大腦空轉是熵增，行動驗證是熵減。", "在真空裡求最優解，不如先執行再優化。", "在不可控的領域掙扎，是最昂貴的浪費。", "想清楚再做很難，做著做著就清楚了。"], "反": ["讓你焦慮的，是事實還是腦補？", "什麼是你當下能控制的？", "你準備再想多久才行動？", "你能做的最小一步是什麼？"], "衝": ["你為一個提案推演了一週，最後一個字都沒寫。", "你擔心大環境不好，卻忘了自己能控制的只有今天的行動。", "你打了一通原本害怕的電話，所有的焦慮在三分鐘內消散了。"], "翻": ["認真的人，最容易掉進思維的深坑。", "你不需要一次解決所有問題。", "行動不是思考的結束，而是思考的延續。", "清晰，是行動的副產品。"], "遞": ["先分清事實，再聚焦可控，再設熔斷，最後最小行動。", "從空轉，到聚焦，到行動，到流動。", "停、拆、限、動。"], "詩": ["先把自己從反覆消耗裡拉出來，事情就會重新流動。", "願你在這個時代，重新 Come Alive。", "很多清晰，是在行動中長出來的。", "邏輯是硬的，活法可以是鬆弛的。"]}, "p": "很多清晰不是想出來的，而是在行動中長出來的。", "f": ["陷入反覆消耗：做事懷疑、開始前推演、開始後擔心", "心智熵增，大腦空轉", "四步：分清事實與腦補、找出可控、給思考設熔斷點、先做最小行動", "重新拿回掌控權"], "pain": "總想等邏輯完整、未來清晰才行動，結果顆粒無收人卻疲憊", "m": "事實與推演分離→聚焦可控區→思考設限→最小行動驗證→恢復掌控感與生命力", "a": "糾結時告訴自己：再想十分鐘，然後做一個最小的行動", "c": ["邏輯是硬的，但活法可以是鬆弛的。", "什麼是你當下能控制的？", "停、拆、限、動。", "很多清晰，是在行動中長出來的。"]}, {"t": "CEO覆盤| 為什麼你越分析，越不敢行動", "b": "我是一個容易“過度分析”的人！\n特別累！\n\n一件事還沒開始，\n就先想邏輯、想方案、想風險、想確定性。\n結果不是更清醒，更堅定，而是更容易猶豫、拖延、糾結，甚至一邊做一邊懷疑自己。\n\n後來我才意識到：\n很多時候，這不是理性，\n而是在用分析換安全感和確定性。\n但真正重要的事，\n不可能等你100%想清楚再開始。\n很多答案，\n都是在行動裡一點點出現的。\n\n這張卡片，\n我整理了3個常見訊號，\n也給了一個簡單的破局思路：\n覺察—停止—行動。\n\n希望對你有啟發！\n我會持續分享實用內容，下次見！\n#CEO覆盤\n#認知提升\n#結構化思維\n#過度分析\n#內耗\n#個人成長\n#高認知#行動力\n#思維模型\n4月29日", "q": {"哲": ["過度分析，是在用思考逃避行動。", "重要的事，不可能等你 100% 想清楚再開始。", "很多答案，都是在行動裡一點點出現的。", "確定性是幻覺，行動才是真實。"], "排": ["想邏輯、想方案、想風險、想確定性。", "猶豫、拖延、糾結、懷疑。", "覺察、停止、行動。", "三個訊號，一個思路，一次突破。"], "對": ["你以為更理性，其實更焦慮。", "分析給你安全感，行動給你答案。", "想得越多，做得越少。", "完美的計畫，比不上不完美的開始。"], "反": ["你的分析，是讓你更清醒，還是更猶豫？", "你在用分析換安全感嗎？", "你能接受不完全確定就開始嗎？", "你要分析到什麼時候，才願意行動？"], "衝": ["你為一個新項目做了二十頁風險分析，最後決定先不做。", "一邊做一邊懷疑自己，結果做得又累又差。", "同事什麼都沒想清楚就開始了，三個月後已經跑通。"], "翻": ["過度分析不是理性，是恐懼。", "停止思考，有時是最理性的決定。", "答案不在腦中，在路上。", "行動，是治療過度分析的良藥。"], "遞": ["先覺察訊號，再停止分析，最後立刻行動。", "從分析，到覺察，到行動。", "察、停、動。"], "詩": ["很多答案，都是在行動裡一點點出現的。", "願你放下對確定性的執著，勇敢出發。", "覺察—停止—行動。", "走著走著，路就清楚了。"]}, "p": "過度分析常常不是理性，而是在用分析換安全感與確定性。", "f": ["一件事還沒開始就先想邏輯、方案、風險", "結果更猶豫拖延", "其實是用分析換安全感", "重要的事不可能 100% 想清楚", "覺察、停止、行動"], "pain": "過度分析讓人更累、更猶豫，甚至邊做邊懷疑自己", "m": "分析→短暫安全感→更多不確定→更多分析的循環；覺察訊號→停止→行動中獲得答案", "a": "察覺自己在過度分析時，說「停」，然後做一件具體的事", "c": ["確定性是幻覺，行動才是真實。", "猶豫、拖延、糾結、懷疑。", "你以為更理性，其實更焦慮。", "走著走著，路就清楚了。"]}, {"t": "CEO覆盤|被低估溝通工具，解決80%問題", "b": "你是不是總是為領導、同事、 夥伴、朋友等的溝通苦惱不已？常常覺得不被理解，被孤立？憤怒？無助？\n這一套卡片給你解決方法。\n\n這是對我和團隊，影響最深遠的工具之一。\n建議收藏自用，反覆練習！\n歡迎評論區分享，這個工具給你的啟發[微笑R]\n\n我會持續分享底層邏輯、認知框架、頂級工具等不過時的內容，歡迎您的關注和交流！我們一起持續進化！#職場溝通  #AI時代 #CEO視角 #避免內耗 #溝通 #覆盤\n#溝通的力量 #職場成長\nApr 27", "q": {"哲": ["好的溝通，從說清自己的需要開始。", "不被理解，常常是因為沒說清楚。", "把評判換成觀察，衝突就少了一半。", "一個好工具，能改變一個團隊。"], "排": ["觀察、感受、需要、請求。", "不被理解、被孤立、憤怒、無助。", "收藏、練習、反覆練習。", "領導、同事、夥伴、朋友。"], "對": ["指責讓人防禦，表達需要讓人靠近。", "評判是攻擊，觀察是描述。", "情緒化的話製造距離，結構化的話建立橋樑。", "你說了什麼不重要，對方聽到了什麼才重要。"], "反": ["你常覺得不被理解，是不是因為沒說清自己的需要？", "你的話，是在描述事實還是在評判對方？", "你提出的請求，具體嗎？", "你上一次被真正理解，是怎麼說的？"], "衝": ["你說「你總是不尊重我」，同事立刻反擊，會議不歡而散。", "你覺得被團隊孤立，卻從沒說出自己需要什麼。", "換成「我看到這週三次會議都延遲了，我有點焦慮，我需要準時開始」，對方立刻答應了。"], "翻": ["溝通問題，常常是表達結構的問題。", "說出需要，不是軟弱，是清晰。", "最簡單的工具，往往最有效。", "被理解，是可以練習的。"], "遞": ["先觀察，再表達感受，再說出需要，最後提出請求。", "從憤怒，到表達，到理解，到合作。", "看、感、需、請。"], "詩": ["建議收藏自用，反覆練習。", "願你的每一句話，都被溫柔地聽見。", "好的溝通，讓心與心之間有了橋。", "一起持續進化。"]}, "p": "一個被低估的溝通工具，能解決 80% 的溝通問題。", "f": ["為溝通苦惱：不被理解、被孤立、憤怒、無助", "一套影響深遠的溝通工具", "觀察、感受、需要、請求的結構化表達", "反覆練習", "改善關係與協作"], "pain": "常覺得不被理解，溝通中充滿憤怒與無助", "m": "結構化表達（區分事實、感受、需求、具體請求）→降低防禦→提高被理解與合作的機率", "a": "下一次溝通衝突時，用「我看到…我感覺…我需要…你願意…嗎」說一次", "c": ["一個好工具，能改變一個團隊。", "觀察、感受、需要、請求。", "評判是攻擊，觀察是描述。", "建議收藏自用，反覆練習。"]}, {"t": "AI觀察| AI越學越焦慮?你大機率踩了這3個坑", "b": "說一個反共識的觀察:\n越來越多人學AI,但學的越多，反而越焦慮。\n不是因為AI太強，我們追不上，而是大多數朋友用\"錯誤方式拼命學AI\"。\n\n我觀察過一些每天忙著學AI的人:\n❶ 學工具 ≠ 解決問題\n今天學Claude,下週學Cursor,\n工具學了一堆,\n但說不出幫自己真正解決過什麼。\n❷ 提高效率 ≠ 增長能力\n熟練用AI生成方案、寫郵件、做PPT,\n一旦AI不在,自己就不會了。\n❸ 讓AI替你想 ≠ 讓AI幫你想\n遇到決策直接問AI\"做不做\",\n自己再也不願意先思考——\n這不是在用AI,\n是把判斷權交出去了。\n\n我自己也在這3個坑裡\n反覆摔過。\n後來才慢慢看清:\n不是所有\"學AI\"都叫在學AI。\n不是學了AI就在成長,\n是用對了AI才能成長。\n\n寫在最後:\nAI不會取代會思考的人,\n但AI會放大每一種人的本質——\n放大思考者的思考,\n也放大依賴者的依賴。\n獻給每天都在學AI、\n期待成長的人。\n你最近,\n在讓AI放大你的什麼?\n\n我在小紅書,\n是想認真做\"5年、10年還有用\"的內容。\n專注用 AI + 認知 + 思維 + 案例,\n陪你搞定每一次進階和重啟。\n如果這些對你有用,\n歡迎關注交流。\n#AI觀察 #AI時代 #學AI\n#AI學習方法 #深度思考\n#成長 #CEO視角#假學習\nApr 25", "q": {"哲": ["不是學了 AI 就在成長，是用對了 AI 才能成長。", "AI 不會取代會思考的人。", "把判斷權交出去，不叫用 AI。", "你讓 AI 放大的，是你的思考還是你的依賴？"], "排": ["學工具不等於解決問題，提效率不等於長能力，讓 AI 替你想不等於讓 AI 幫你想。", "今天學 Claude，下週學 Cursor，工具學了一堆。", "放大思考者的思考，放大依賴者的依賴。", "問題導向、保留判斷、持續成長。"], "對": ["學得越多越焦慮，用得越對越從容。", "工具收集者焦慮，問題解決者成長。", "AI 在時你很強，AI 不在時你不會，這不是能力。", "讓 AI 幫你想是協作，讓 AI 替你想是放棄。"], "反": ["你最近，在讓 AI 放大你的什麼？", "你學的 AI 工具，幫你解決過什麼真正的問題？", "AI 不在的時候，你還會嗎？", "你是在用 AI，還是把判斷權交出去了？"], "衝": ["你每週學一個新 AI 工具，半年後卻說不出任何成果。", "你用 AI 做了一份精美的簡報，主管問一個細節你卻答不出來。", "遇到決策你直接問 AI 做不做，自己再也不願意先想。"], "翻": ["焦慮不是因為 AI 太強，是因為學錯了。", "不是所有學 AI 都叫在學 AI。", "真正的 AI 能力，是思考能力。", "AI 是放大鏡，照出的是你的本質。"], "遞": ["先找真實問題，再用 AI 協助，最後保留判斷。", "從學工具，到解問題，到長能力。", "問題、協作、判斷、成長。"], "詩": ["獻給每天都在學 AI、期待成長的人。", "願 AI 放大的，是你最好的那一面。", "做 5 年、10 年還有用的事。", "思考的人，永遠不會被取代。"]}, "p": "AI 會放大每一種人的本質：放大思考者的思考，也放大依賴者的依賴。", "f": ["越學 AI 越焦慮", "不是 AI 太強，是學錯方式", "三個坑：學工具≠解決問題、提效率≠長能力、讓 AI 替你想≠幫你想", "用對 AI 才能成長", "問自己讓 AI 放大了什麼"], "pain": "每天學 AI 工具，卻說不出解決過什麼問題，反而更焦慮", "m": "錯誤學習方式→依賴與焦慮；以問題為導向、保留判斷權→AI 成為放大器", "a": "寫下一個你真正用 AI 解決過的問題；若沒有，從一個真實問題開始", "c": ["AI 不會取代會思考的人。", "AI 不在的時候，你還會嗎？", "問題、協作、判斷、成長。", "思考的人，永遠不會被取代。"]}, {"t": "CEO覆盤| 一個機會值不值得做，先問這3句", "b": "你有沒有這種感覺：\n機會很多，\n但越選越焦慮，\n甚至越努力，結果反而越差？\n\n大多數人，不是沒機會，\n是被“看起來不錯的機會”拖死的。\n\n我自己這些年，從職場到創業，\n覆盤下來發現：\n一個機會值不值得做，\n其實只要問這3句。\n✔ 有沒有真實需求\n→ 有沒有人真的痛，並願意付錢\n✔ 你有沒有做成的條件\n→ 做成需要的條件有那些？而你的獨特優勢是什麼？\n✔ 能不能留下長期價值\n→ 做完之後，你有沒有留下點什麼\n\n很多人卡住，本質是不能識別適合自己的機會！\n我現在基本每次遇到新機會，\n都會先用這3條過一遍。\n👉 真正好的機會，\n是會“積累你”，而不是消耗你。\n那張卡片可以先收藏著，\n以後遇到選擇，拿出來對一遍。\n\n評論區說一個你最近在考慮的機會\n（跳槽 / 副業 / 專案都可以）\n我幫你用這3條拆一下。\n#機會判斷 #職場思考 #副業選擇 #AI時代 #認知升級 #結構化思維 @不器 COME ALIVE\nApr 23", "q": {"哲": ["大多數人不是沒機會，是被看起來不錯的機會拖死的。", "好機會會積累你，壞機會會消耗你。", "識別適合自己的機會，是最重要的能力。", "做完之後留下了什麼，決定了機會的價值。"], "排": ["有沒有真實需求，你有沒有做成的條件，能不能留下長期價值。", "有人真的痛，願意付錢，你有獨特優勢。", "跳槽、副業、專案，都用三句話過一遍。", "篩選、判斷、聚焦。"], "對": ["看起來不錯的機會，常常最危險。", "機會多不是好事，選對才是。", "消耗你的機會讓你越忙越窮，積累你的機會讓你越做越強。", "熱門的機會很多人搶，適合的機會才屬於你。"], "反": ["這個機會，有人真的痛並願意付錢嗎？", "你有做成的條件與獨特優勢嗎？", "做完之後，你能留下什麼？", "你最近在考慮的機會，經得起這三問嗎？"], "衝": ["你接了三個副業機會，每個都只做到一半，本業也受影響。", "一個看起來很賺的項目，做完後你什麼能力都沒留下。", "朋友只選了一個能累積作品的機會，三年後已經建立了個人品牌。"], "翻": ["不是機會不夠，是篩選不夠。", "拒絕看起來不錯的機會，才能抓住真正好的機會。", "長期價值，是機會的試金石。", "三句話，省下三年。"], "遞": ["先驗證需求，再評估條件，最後看長期價值。", "從機會很多，到篩選，到聚焦。", "問需求、問條件、問積累。"], "詩": ["真正好的機會，是會積累你，而不是消耗你。", "願你遇到的每一個選擇，都經得起三問。", "選對了機會，時間會替你加分。", "以後遇到選擇，拿出來對一遍。"]}, "p": "真正好的機會，是會積累你，而不是消耗你。", "f": ["機會很多卻越選越焦慮", "被看起來不錯的機會拖死", "三句話過濾：有沒有真實需求、你有沒有做成的條件、能不能留下長期價值", "每次遇到新機會都過一遍"], "pain": "被看起來不錯的機會分散精力，越努力結果越差", "m": "需求真實性×自身條件×長期積累→篩出值得投入的機會", "a": "把你正在考慮的機會，用三句話過濾一次", "c": ["識別適合自己的機會，是最重要的能力。", "篩選、判斷、聚焦。", "三句話，省下三年。", "選對了機會，時間會替你加分。"]}, {"t": "AI觀察| AI越強，這3種人反而越稀缺", "b": "這幾年我一直在觀察:\nAI越強,\n有些人就越沒價值,\n但另一些人,\n反而越來越稀缺。\n我觀察下來,\n真正在AI時代越來越值錢的,\n都不是技術派——\n是這3種人:\n❶ 真在思考的人\n❷ 有溫度的人\n❸ 有品味的人\n這3種能力,\nAI模仿不了,\n也替代不了。\n你屬於哪一種?\n還是,正在成為哪一種?\nP.S. 這是我觀察3年AI落地的判斷,\n不是套用誰的理論,\n也歡迎你在評論區補充你的觀察。\n#AI觀察 #AI時代 #思考\n#職場成長 #認知升級#底層邏輯\nApr 22", "q": {"哲": ["AI 越強，人的稀缺性越珍貴。", "思考、溫度、品味，是 AI 模仿不了的三種光。", "真正值錢的，不一定是技術派。", "成為稀缺的人，比成為會用工具的人更重要。"], "排": ["真在思考的人，有溫度的人，有品味的人。", "AI 模仿不了，也替代不了。", "觀察三年，三種人，一個判斷。", "思考深一點，溫度多一點，品味高一點。"], "對": ["有些人越來越沒價值，有些人越來越稀缺。", "AI 能生成內容，卻生成不了溫度。", "技術可以學，品味要養。", "假思考的人被替代，真思考的人被放大。"], "反": ["你屬於哪一種？", "你正在成為哪一種？", "你的價值，是 AI 可以複製的嗎？", "在 AI 時代，你的稀缺性在哪裡？"], "衝": ["你做了十年的文書工作，AI 一夜之間就能取代。", "一位同事不懂技術，卻因為對人的溫度成為團隊核心。", "AI 生成了一百張設計，最終被選中的是那位有品味的設計師挑的那張。"], "翻": ["AI 時代最值錢的，不是技術。", "溫度與品味，是人類最後的護城河。", "被取代的，是沒有思考的工作。", "稀缺，是在人人都會用 AI 時依然與眾不同。"], "遞": ["先學會思考，再保有溫度，再培養品味。", "從會用工具，到會思考，到不可替代。", "思考、溫度、品味。"], "詩": ["AI 越強，這三種人反而越稀缺。", "願你成為那個無法被複製的人。", "溫度與品味，是人類永恆的光。", "思考的人，在任何時代都閃耀。"]}, "p": "AI 越強，真在思考、有溫度、有品味的人反而越稀缺。", "f": ["AI 越強", "有些人越沒價值", "另一些人越稀缺", "三種人：真在思考的人、有溫度的人、有品味的人", "AI 模仿不了也替代不了"], "pain": "擔心在 AI 時代失去價值", "m": "AI 擅長資訊處理與生成；思考深度、人際溫度、審美品味是人類獨有的稀缺性", "a": "問自己：你屬於哪一種？正在成為哪一種？選一種刻意培養", "c": ["AI 越強，人的稀缺性越珍貴。", "AI 模仿不了，也替代不了。", "你屬於哪一種？", "願你成為那個無法被複製的人。"]}, {"t": "CEO覆盤｜一套卡片幫你識別假思考，必藏", "b": "這兩年我有一個觀察:\n真正能成的人,\n不一定最聰明,\n但一定是真在思考的人。\n而很多看起來很聰明的人,\n其實只是在\"假裝思考\"。\n最可怕的是——\n假思考的人,自己往往意識不到。\n我自己也在這3個特徵裡反覆中過招。\n分享給你,一起警惕。\n最戳我的兩句:\n✦ 收藏從未停止,學習從未開始 ✦\n✦ 努力不是答案,方向才是 ✦\n你最近,是哪一種?\nP.S. 三個理論錨點:\n①\"數字倉鼠症\"——心理學\"數字囤積\"(Digital Hoarding)現象\n②\"認知吝嗇鬼\"——Susan Fiske & Shelley Taylor (1984)\n③\"行動偏差\"——Patt & Zeckhauser (2000), Bar-Eli (2007)\n#CEO覆盤 #假思考 #深度思考\n#認知 #數字倉鼠症\n#思維方式 #職場成長#AI時代 #底層邏輯\n4月21日", "q": {"哲": ["收藏從未停止，學習從未開始。", "努力不是答案，方向才是。", "假思考最可怕的是，自己往往意識不到。", "真思考，是願意為一個問題付出腦力。"], "排": ["數字倉鼠症、認知吝嗇鬼、行動偏差。", "收藏、囤積、假裝學會。", "忙碌、行動、假裝思考。", "覺察、警惕、真正思考。"], "對": ["看起來很聰明，其實只是在假裝思考。", "收藏是囤積，思考是消化。", "忙碌是表演，思考是功夫。", "聰明的人很多，真在思考的人很少。"], "反": ["你最近，是哪一種假思考？", "你收藏的內容，看過幾篇？", "你的忙碌，是在思考還是在逃避思考？", "你為一個問題，真正深入想過多久？"], "衝": ["你的收藏夾有三千篇乾貨，卻說不出其中一篇的重點。", "你每天忙到深夜，覆盤時卻發現沒做一件重要的事。", "遇到難題你立刻上網找答案，從不自己先想十分鐘。"], "翻": ["聰明不等於思考。", "收藏不是學習，是心理安慰。", "行動不一定是進步，可能是逃避。", "真思考很累，但很值。"], "遞": ["先識別假思考，再停止囤積，再深入一個問題，最後真正思考。", "從囤積，到消化，到思考，到洞見。", "覺察、停止、深入。"], "詩": ["真正能成的人，一定是真在思考的人。", "願你從假思考中醒來。", "少收藏一篇，多想透一篇。", "方向，比努力更重要。"]}, "p": "真正能成的人，不一定最聰明，但一定是真在思考的人。", "f": ["很多看起來聰明的人只是假裝思考", "假思考的人自己意識不到", "三個特徵：數字倉鼠症、認知吝嗇鬼、行動偏差", "收藏從未停止，學習從未開始", "努力不是答案，方向才是"], "pain": "看似在學習與努力，實則只是在假裝思考", "m": "數字囤積→假性學習；認知吝嗇→逃避深思；行動偏差→用忙碌代替思考", "a": "清理收藏夾，只留下三篇並徹底讀懂", "c": ["收藏從未停止，學習從未開始。", "收藏、囤積、假裝學會。", "收藏不是學習，是心理安慰。", "少收藏一篇，多想透一篇。"]}, {"t": "CEO覆盤：AI時代，普通人該站在哪", "b": "很多人問我:\nAI時代普通人到底該怎麼辦?\n我從傳統行業轉到AI、現在做AI創業,\n給你一個更實在的視角——\n別急著問\"我該做什麼\",\n先搞清楚\"我現在站在哪\"。\nChatGPT是2022年底才引爆的,\n在那之前,大多數人對AI其實不太在意,\n覺得那是科學家和極客的事。\n我到現在還記得\n第一次用ChatGPT的那個瞬間——\n像被一道光擊中。\n腦子裡有個特別清晰的聲音:\n\"這就是我想要的,我必須進去。\"\n2023年初,\n我下決心從做了很多年的電商跨進AI。\n到現在,走到第4個年頭。\n這3年多我見過太多人在AI面前的姿態:\n有人焦慮、有人牴觸、\n有人興奮地衝進來又很快退出去、\n也有人默默地把AI變成了自己的一部分。\n我把這些人畫成了一張圖,\n按兩個維度分成4種位置👇\n【橫軸】會不會用AI\n【縱軸】有沒有不可替代的判斷力\n你對號入座一下,\n自己大概在哪個象限?\n━━━━━━━━\n⚠️ 有個關鍵提醒:\n位置不是固定的,是可以移動的。\n2023年初剛入行時,\n我也在\"左上\"——\n有十幾年的行業判斷力,\n但對AI完全外行。\n我挪到\"右上\"靠的不是某個神級工具,\n而是三件特別笨的事:\n▫️ 遇到每一個不懂的問題,都自己先啃一遍\n▫️ 把AI當加速器,讓它幫我快速摸清陌生領域\n▫️ 關鍵節點,死磕著向真正的高手請教\nAI能給你資訊,\n但判斷力,是你自己一點點攢出來的。\n真正決定你5年後位置的,\n不是你今天在哪個格子,\n而是你有沒有在往右上走。\n━━━━━━━━\n這張圖你可以收藏起來,\n明年這個時候再翻出來看看——\n看看一年過去,\n你有沒有往右上角,\n挪了一格。\n#CEO覆盤 #AI時代 #職場成長 #普通人逆襲 #AI工具#學習分享 #焦慮\nApr 19", "q": {"哲": ["決定五年後位置的，不是今天在哪格，而是有沒有往右上走。", "AI 能給你資訊，判斷力要自己攢。", "位置不是固定的，是可以移動的。", "先搞清楚站在哪，才知道往哪走。"], "排": ["會不會用 AI，有沒有不可替代的判斷力。", "焦慮、牴觸、興奮衝入又退出、默默變成自己的一部分。", "自己先啃一遍，把 AI 當加速器，向真正的高手請教。", "定位、移動、累積、向上。"], "對": ["有人焦慮，有人牴觸，有人把 AI 變成自己的一部分。", "有判斷力不會 AI，是左上；會 AI 有判斷力，是右上。", "神級工具救不了你，笨方法才可以。", "今天的位置是起點，不是終點。"], "反": ["你自己大概在哪個象限？", "一年後，你有沒有往右上挪一格？", "你的判斷力，是自己攢的還是 AI 給的？", "你是在焦慮，還是在移動？"], "衝": ["第一次用 ChatGPT 那一刻，像被一道光擊中。", "十幾年的電商經驗，對 AI 卻完全外行，他在左上象限重新出發。", "身邊有人興奮地衝進 AI，三個月後又默默退了出去。"], "翻": ["AI 時代，判斷力比工具更重要。", "位置可以移動，焦慮不能幫你移動。", "笨方法，往往最有效。", "真正的轉型，是一格一格挪出來的。"], "遞": ["先定位自己，再補短板，再持續累積，最後抵達右上。", "從牴觸，到嘗試，到熟練，到不可替代。", "自己啃、AI 加速、高手請教。"], "詩": ["明年這個時候，看看你有沒有往右上角挪了一格。", "願你在 AI 時代，找到自己的位置，並向上移動。", "判斷力，是一點一點攢出來的光。", "站在哪不重要，往哪走才重要。"]}, "p": "AI 時代別急著問「我該做什麼」，先搞清楚「我現在站在哪」。", "f": ["AI 時代普通人怎麼辦", "先定位", "兩個維度：會不會用 AI × 有沒有不可替代的判斷力", "四個象限", "位置可移動：自己啃、AI 加速、向高手請教", "往右上走"], "pain": "面對 AI 焦慮、牴觸或盲目衝入，不知道自己的位置", "m": "雙維度定位→看清現況→以笨方法累積判斷力與 AI 能力→向右上象限移動", "a": "在四象限中定位自己，寫下一年內往右上移動一格的計畫", "c": ["位置不是固定的，是可以移動的。", "你自己大概在哪個象限？", "笨方法，往往最有效。", "站在哪不重要，往哪走才重要。"]}, {"t": "CEO覆盤：諾獎得主最推薦決策工具—事前驗", "b": "可儲存自用，我自己也在用的決策清單。\n我創業踩過最大的坑：全票透過的方案，半年後徹底黃了。\n不是方向錯了，是當時沒有一個人認真想過它會怎麼失敗——包括我自己。\n後來我學到一個方法，叫「事前驗屍」（Pre-mortem），是認知心理學家 Gary Klein 提出的，連諾貝爾經濟學獎得主 Kahneman 都說這是他最推薦的決策工具。\n方法很簡單，三步：\n❶ 假設這個決定已經失敗了\n❷ 列出最可能導致失敗的3個原因\n❸ 回頭檢查：你的方案裡有沒有應對\n這不是讓你不敢做決定，是讓你做一個想清楚了的決定。\n每次拍板前，過一遍這3步。\n有用的話，留個腳印或點個關注。\n你做過最後悔的一個決定是什麼？評論區聊聊\n#認知提升 #決策力 #CEO視角 #思維框架 #職場成長 #邏輯思維 #避免內耗 #事前驗屍\nApr 17", "q": {"哲": ["全票通過的方案，最需要事前驗屍。", "不是讓你不敢做決定，是讓你做一個想清楚的決定。", "想像失敗，是為了避免失敗。", "沒人想過它會怎麼失敗，才是最大的風險。"], "排": ["假設已經失敗，列出三個原因，檢查應對方
