案。", "拍板前、執行前、投入前，都過一遍。", "預想、找因、補強。", "Gary Klein 提出，Kahneman 推薦。"], "對": ["事後驗屍是覆盤，事前驗屍是預防。", "全票通過不代表正確，可能代表沒人敢唱反調。", "樂觀讓人出發，驗屍讓人走得穩。", "方向沒錯，是細節殺死了方案。"], "反": ["如果這個決定已經失敗了，最可能的原因是什麼？", "你的方案裡，有應對這些失敗原因嗎？", "你做過最後悔的一個決定是什麼？", "團隊裡，有人敢說這個方案會怎麼失敗嗎？"], "衝": ["全票通過的方案，半年後徹底黃了，包括你自己都沒想過它會失敗。", "開會時大家都說好，只有一個人小聲說「萬一…」，被大家忽略了。", "你做了一次事前驗屍，發現三個致命漏洞，及時補救避免了大損失。"], "翻": ["想像失敗，不是悲觀，是負責。", "最好的決策工具，往往最簡單。", "方向對了，也要防細節。", "事前驗屍，讓團隊敢說真話。"], "遞": ["先假設失敗，再找出原因，最後補強方案。", "從樂觀，到預想，到穩健。", "想敗、找因、補強、出發。"], "詩": ["每次拍板前，過一遍這三步。", "願你的每一個決定，都想清楚了再出發。", "預見失敗的人，更接近成功。", "想清楚，再勇敢。"]}, "p": "做決定前，先假設它已經失敗，才能做一個想清楚了的決定。", "f": ["全票通過的方案半年後黃了", "沒人認真想過它會怎麼失敗", "Gary Klein 事前驗屍法", "三步：假設已失敗、列出三個原因、檢查應對", "每次拍板前過一遍"], "pain": "群體共識下的決策缺乏風險思考，事後才後悔", "m": "預設失敗→釋放對方案的批判性思考→提前發現盲點→強化方案", "a": "下次拍板前，帶團隊做一次十分鐘的事前驗屍", "c": ["想像失敗，是為了避免失敗。", "預想、找因、補強。", "樂觀讓人出發，驗屍讓人走得穩。", "每次拍板前，過一遍這三步。"]}, {"t": "CEO覆盤：20年職場，我踩過的7種思考陷阱", "b": "可儲存自用|20年職場+AI創業，本人總結自用的一張圖。\n\n我發現大多數人不是輸在不努力，是輸在思考方式——\n同樣的事情，有人做了10次還在原地打轉，有人做一次就想清楚了。\n區別就在這7個陷阱，我自己踩過每一個。\n❶ 先後陷阱：把\"時間先後\"當成了\"因果關係\"\n❷ 手段陷阱：把\"做了什麼\"當成了\"達成了什麼\"\n❸ 充要陷阱：把\"有它能成\"當成了\"沒它不行\"\n❹ 倖存者偏差：只看到活下來的，沒看到死掉的\n❺ 確認偏誤：定了立場就只找支援的證據\n❻ 沉沒成本：捨不得過去投入，繼續往錯的方向走\n❼ 線性陷阱：以為改一個點，其他不受影響\n收藏備用。每次卡住的時候，拿出來對一遍，80%的困局能找到根源。\n\n你最常踩的坑是第幾個？評論區告訴我，回覆率100%。\n#AI時代 認知提升 #思維框架 #CEO視角 #職場成長 #邏輯思維 #避免內耗 #思考陷阱 #決策力\nApr 16", "q": {"哲": ["輸在思考方式，比輸在努力更可惜。", "同樣的事，有人做十次還在原地，有人做一次就想清楚。", "陷阱踩過一次是經驗，踩兩次是方法錯了。", "80% 的困局，都能在思考陷阱裡找到根源。"], "排": ["先後陷阱、手段陷阱、充要陷阱。", "倖存者偏差、確認偏誤、沉沒成本、線性陷阱。", "時間先後當因果，做了什麼當達成什麼，有它能成當沒它不行。", "只看活下來的，只找支持的，捨不得投入的，以為改一點不影響其他。"], "對": ["努力讓你走，思考決定你往哪走。", "只看倖存者，就看不見失敗的大多數。", "捨不得過去，就走不向未來。", "改一個點，整個系統都會動。"], "反": ["你最常踩的坑是第幾個？", "你把「做了什麼」當成「達成了什麼」嗎？", "你是不是只看到成功的案例？", "你堅持的，是因為正確還是因為捨不得？"], "衝": ["你看了十個創業成功的故事就辭職，卻沒看到一千個失敗的。", "你覺得開了很多會就是推進了專案，結果什麼都沒達成。", "你改了產品定價，沒想到客服量、退貨率全都跟著變了。"], "翻": ["不是不努力，是思考方式出了問題。", "對照陷阱，就是給思考做體檢。", "踩過的坑，都能變成地圖。", "改變思考方式，比改變努力程度更有效。"], "遞": ["先對照陷阱，再找到根源，最後修正思考。", "從原地打轉，到看見陷阱，到一次想清。", "檢查、定位、修正。"], "詩": ["每次卡住的時候，拿出來對一遍。", "願你的努力，都走在對的思考路徑上。", "二十年踩過的坑，濃縮成一張地圖。", "想對了，路就順了。"]}, "p": "大多數人不是輸在不努力，而是輸在思考方式。", "f": ["同樣的事有人十次原地打轉、有人一次想清", "區別在七個思考陷阱", "先後、手段、充要、倖存者、確認偏誤、沉沒成本、線性陷阱", "卡住時對照", "80% 困局找到根源"], "pain": "重複犯同樣的錯，努力卻原地打轉", "m": "辨識七種常見思考陷阱→定位困局根源→修正思考方式", "a": "回想最近一次卡住的事，對照七個陷阱找出你踩了哪一個", "c": ["輸在思考方式，比輸在努力更可惜。", "捨不得過去，就走不向未來。", "踩過的坑，都能變成地圖。", "想對了，路就順了。"]}, {"t": "CEO覆盤：做決策前，先問自己這3個問題", "b": "90%的人跳過了，然後越努力越內耗！\n上週一個朋友跟我說，她努力加班3個月，還是沒升職，問我為什麼。\n我說：你有沒有想過，「努力加班」和「升職」之間，可能根本沒有因果關係？\n這是我每次做決策前必過的3個追問：\n❶ 這是原因，還是隻是時間上更早？\n先後不等於因果。政策出臺後經濟好轉，不代表政策導致了好轉，可能只是時機巧合。\n多問一句：有沒有其他變數？\n❷ 這個手段，真的能到達那個目的嗎？\n做了不代表達成了。努力加班是手段，升職是目的，中間還有能力、機會、領導認知一堆變數。\n別用「我已經很努力了」感動自己。\n❸ 這是「有它才行」，還是「沒它不行」？\n勤奮可以成功，不代表不勤奮就不行。條件是單向的，別拿它綁架自己。\n\n這3個追問，每次決策過一遍，幫你少踩80%坑！\n#認知提升 #邏輯思維 #職場成長 #CEO視角 #思維框架 #避免內耗 #決策力 #AI時代\n4月15日", "q": {"哲": ["先後不等於因果。", "做了，不代表達成了。", "別用「我已經很努力了」感動自己。", "條件是單向的，別拿它綁架自己。"], "排": ["是原因還是更早？手段能到達目的嗎？有它才行還是沒它不行？", "能力、機會、領導認知，一堆變數。", "先後、手段、充要。", "每次決策，過一遍三追問。"], "對": ["努力加班是手段，升職是目的，中間隔著很多變數。", "勤奮可以成功，不代表不勤奮就不行。", "時間巧合，常被誤認為因果。", "感動自己很容易，達成目標很難。"], "反": ["你的努力，和你想要的結果之間有因果關係嗎？", "有沒有其他變數，你忽略了？", "你是在達成目標，還是在完成手段？", "你把哪些條件當成了必要條件？"], "衝": ["朋友加班三個月沒升職，問你為什麼，你說可能根本沒因果。", "政策出台後經濟好轉，大家都說是政策的功勞，其實只是時機巧合。", "你以為不熬夜就不能成功，結果把身體搞垮了。"], "翻": ["越努力越內耗，可能是因果搞錯了。", "找對關鍵變數，比更努力更重要。", "追問，是決策的保險。", "別讓錯的因果，綁架你的人生。"], "遞": ["先辨先後，再辨手段，最後辨充要。", "從感動自己，到追問因果，到找對方法。", "問一、問二、問三，再決定。"], "詩": ["每次決策過一遍，幫你少踩 80% 的坑。", "願你的努力，都連向真正的結果。", "看清因果，人生就少了很多冤枉路。", "三個追問，換一份清醒。"]}, "p": "努力加班和升職之間，可能根本沒有因果關係。", "f": ["加班三個月沒升職", "努力與結果的因果被誤判", "三個追問：是原因還是更早、手段能否到達目的、有它才行還是沒它不行", "每次決策前過一遍", "少踩 80% 坑"], "pain": "用「我已經很努力了」感動自己，卻得不到想要的結果", "m": "辨別先後與因果、手段與目的、充分與必要→找到真正的關鍵變數", "a": "寫下你最近的努力與目標，問：兩者之間真的有因果嗎？", "c": ["先後不等於因果。", "每次決策，過一遍三追問。", "感動自己很容易，達成目標很難。", "願你的努力，都連向真正的結果。"]}, {"t": "CEO 覆盤：一張圖搞定所有邏輯", "b": "可儲存自用|個人梳理，日常高頻使用框架\n\n很多人覺得人生很亂，\n不是不努力，\n是沒搞清這些“關係”。\n分不清因果，所以焦慮；\n分不清優先順序，所以瞎忙；\n分不清結構，所以反覆內耗。\n你以為是能力問題，\n其實是——邏輯結構出了問題。\n這張圖我自己反覆用，\n每次卡住，就拿出來對一遍，基本都能找到原因。\n\n有用的話，留個腳印或點個關注。\n#AI時代 #認知提升 #自我成長 #職場成長 #AI思維 #避免內耗 #思維框架 #CEO視角\nApr 14", "q": {"哲": ["你以為是能力問題，其實是邏輯結構出了問題。", "看清關係，人生就不亂了。", "因果、優先、結構，是理清人生的三把鑰匙。", "一張圖，就能照見混亂的根源。"], "排": ["分不清因果所以焦慮，分不清優先所以瞎忙，分不清結構所以內耗。", "因果、優先、結構。", "卡住、對照、找到原因。", "看清、理順、行動。"], "對": ["不是不努力，是沒搞清關係。", "瞎忙是因為沒排優先，焦慮是因為沒看因果。", "混亂是表象，結構是本質。", "能力很好，邏輯很亂，結果還是亂。"], "反": ["你的焦慮，是因為分不清因果嗎？", "你的忙碌，有優先順序嗎？", "你反覆內耗的事，結構清楚嗎？", "你有一張自己的邏輯地圖嗎？"], "衝": ["你每天忙到深夜，卻說不出今天最重要的事是什麼。", "一件小事讓你焦慮一週，因為你把它和所有壞結果連在一起。", "你反覆糾結同一個問題，因為從沒把它拆開來看。"], "翻": ["人生亂，不是你的錯，是邏輯沒理清。", "一張圖，勝過一百次內耗。", "理清關係，就理清了人生。", "邏輯不是學問，是生活的工具。"], "遞": ["先看因果，再排優先，最後理結構。", "從混亂，到釐清，到有序。", "看清、排序、拆解、行動。"], "詩": ["每次卡住，就拿出來對一遍。", "願你的人生，因看清關係而清晰。", "邏輯理順了，日子就順了。", "一張圖，搞定所有邏輯。"]}, "p": "很多人覺得人生很亂，不是不努力，而是沒搞清「關係」。", "f": ["人生很亂", "分不清因果所以焦慮", "分不清優先順序所以瞎忙", "分不清結構所以反覆內耗", "一張邏輯關係圖，卡住時對照"], "pain": "焦慮、瞎忙、反覆內耗，以為是能力問題", "m": "因果、優先、結構等邏輯關係釐清→找到問題根源→有序行動", "a": "卡住時拿出邏輯關係圖，找出是哪一種關係沒搞清", "c": ["看清關係，人生就不亂了。", "不是不努力，是沒搞清關係。", "你的忙碌，有優先順序嗎？", "每次卡住，就拿出來對一遍。"]}, {"t": "AI時代的生存真相：把“人味兒”練回來", "b": "大家都在聊AI工具和技術，我反而更想聊聊人本身！AI時代，人味兒更值錢。連結人、做判斷、獨立思考是關鍵。AI能處理資訊，但無法替代真誠連線、深度判斷和獨立思考。普通人應專注自身能力提升，而非焦慮被替代。#AI人工智慧 #深度思考 #職場思維 #認知升級 #成長 #科技與人性  #人工智慧會取代人類嗎 #人工智慧替代人工\nApr 13", "q": {"哲": ["AI 能處理資訊，卻無法替代真誠的連結。", "人味兒，是 AI 時代最稀缺的資產。", "越是智能的時代，越需要人性的溫度。", "把人味兒練回來，就是把未來練回來。"], "排": ["連結人、做判斷、獨立思考。", "真誠連結、深度判斷、獨立思考。", "少聊工具，多聊人；少焦慮，多提升。", "溫度、判斷、思考。"], "對": ["大家都在聊 AI，我更想聊人。", "工具會更新，人味兒不會過時。", "AI 給你答案，人給你溫度。", "焦慮被替代，不如專注不可替代。"], "反": ["你的工作中，有多少是 AI 無法替代的人味兒？", "你上一次真誠地和人連結，是什麼時候？", "你是在焦慮被替代，還是在練習不可替代？", "在 AI 時代，你的人味兒還在嗎？"], "衝": ["你用 AI 寫了一封完美的道歉信，對方卻說「感覺不到你的真心」。", "團隊裡最被需要的，不是最會用 AI 的人，而是最懂人的那位。", "你和客戶喝了一杯咖啡，談成了 AI 幫你寫十份提案都沒談成的合作。"], "翻": ["AI 時代的生存真相，是回到人。", "技術再強，人心依然是終點。", "不必焦慮被替代，專注成為更好的人。", "人味兒不是軟實力，是硬通貨。"], "遞": ["先找回連結，再練判斷，最後保有獨立思考。", "從工具，到人，到價值。", "連結、判斷、思考、溫度。"], "詩": ["AI 時代，人味兒更值錢。", "願你在演算法的世界裡，依然溫暖。", "把人味兒練回來。", "人心的溫度，是機器永遠學不會的語言。"]}, "p": "AI 時代，人味兒更值錢：連結人、做判斷、獨立思考是關鍵。", "f": ["大家都在聊 AI 工具與技術", "反而更想聊人本身", "AI 能處理資訊", "無法替代真誠連結、深度判斷、獨立思考", "專注提升自身能力而非焦慮"], "pain": "過度關注工具技術，焦慮被替代", "m": "AI 處理資訊；人的不可替代性在於真誠連結、判斷與思考→投資「人味」即投資未來", "a": "本週和一個人進行一次不談工作、真誠的深度對話", "c": ["越是智能的時代，越需要人性的溫度。", "溫度、判斷、思考。", "AI 時代的生存真相，是回到人。", "把人味兒練回來。"]}, {"t": "你不是被AI淘汰，是舊工作方式", "b": "被AI淘汰，很多時候不是因為你不夠努力，\n而是你還在用舊時代的工作方式硬扛。\n還在靠苦勞感動自己、靠經驗拒絕變化、靠執行證明價值，\n這些習慣，正在慢慢變得不值錢。\nAI真正替代的，\n不是努力的人，\n而是低效、重複、可標準化的工作。\n未來更值錢的，\n是會用AI、會學習、會判斷、會對結果負責的人。\n你工作裡最該交給AI的一件事，是什麼？\n評論區說說。\n#AI時代轉型 #職場 #效率 #工作方式 #AI工具 #認知升級 #個人成長提升 #人工智慧替代人工 #未來工作方式\nApr 12", "q": {"哲": ["AI 真正替代的，不是努力的人，而是低效重複的工作。", "靠苦勞感動自己的時代，正在結束。", "經驗是財富，拒絕變化的經驗是負債。", "未來值錢的，是會為結果負責的人。"], "排": ["靠苦勞感動自己，靠經驗拒絕變化，靠執行證明價值。", "會用 AI，會學習，會判斷，會對結果負責。", "低效、重複、可標準化。", "更新方式、擁抱工具、提升判斷。"], "對": ["不是你不夠努力，是方式太舊。", "苦勞換不來價值，結果才是。", "拒絕變化的人被淘汰，擁抱變化的人被放大。", "執行是基本，判斷是價值。"], "反": ["你工作裡最該交給 AI 的一件事是什麼？", "你還在用苦勞證明自己嗎？", "你的經驗，是幫你前進還是讓你停滯？", "你會為結果負責，還是只負責執行？"], "衝": ["你每天花三小時整理報表，同事用 AI 十分鐘就做完了。", "你說「我做這行二十年了，不需要學新東西」，三個月後被調離崗位。", "加班到深夜的你沒升職，懂得用 AI 提效又敢做決策的同事升了。"], "翻": ["淘汰你的不是 AI，是舊的工作方式。", "努力很重要，方式更重要。", "把重複交給 AI，把判斷留給自己。", "擁抱 AI，是保護自己最好的方式。"], "遞": ["先交出重複工作，再學會用 AI，最後提升判斷與責任。", "從苦勞，到效率，到價值。", "更新、學習、判斷、負責。"], "詩": ["未來更值錢的，是會用 AI、會學習、會判斷、會負責的人。", "願你在變化中，找到新的工作方式。", "舊的方式退場，新的你登場。", "不是被淘汰，是被邀請升級。"]}, "p": "你不是被 AI 淘汰，而是被舊的工作方式淘汰。", "f": ["被 AI 淘汰不是不夠努力", "還在用舊方式硬扛：靠苦勞感動、靠經驗拒絕變化、靠執行證明價值", "AI 替代的是低效重複可標準化的工作", "未來值錢的是會用 AI、會學習、會判斷、能負責的人"], "pain": "用苦勞與舊經驗硬扛，害怕被 AI 淘汰", "m": "AI 取代可標準化任務；人的價值轉向學習、判斷與為結果負責→更新工作方式", "a": "找出你工作中最重複的一件事，本週交給 AI 處理", "c": ["苦勞換不來價值，結果才是。", "你還在用苦勞證明自己嗎？", "努力很重要，方式更重要。", "舊的方式退場，新的你登場。"]}];
const QN={哲:'哲學命題',排:'排比句',對:'對比句',反:'反問句',衝:'情境衝突',翻:'認知翻轉',遞:'層層遞進',詩:'詩性收束'};
const FL=['痛點','洞察','翻轉','方法','收束'];
let cur=0,view='a',kw='';
const $=s=>document.querySelector(s);
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const hl=s=>{s=esc(s);if(!kw)return s;return s.split(esc(kw)).join('<mark>'+esc(kw)+'</mark>')};
const allText=d=>d.t+d.b+(d.p||'')+Object.values(d.q).flat().join('');
function list(){const ids=D.map((d,i)=>i).filter(i=>!kw||allText(D[i]).includes(kw));
$('#nav').innerHTML=ids.map(i=>`<a data-i="${i}" class="${i===cur?'on':''}"><small>${i+1}</small>${hl(D[i].t)}</a>`).join('')||'<a>查無結果</a>';
$('#sel').innerHTML=ids.map(i=>`<option value="${i}" ${i===cur?'selected':''}>${i+1}．${esc(D[i].t)}</option>`).join('');return ids}
function post(d){let s=d.t+'\n\n';if(d.p)s+='「'+d.p+'」\n\n';for(const k in QN){if(d.q[k].length)s+=d.q[k].join('\n')+'\n\n'}return s.trim()}
function art(){const d=D[cur];const f=d.f||[];
$('#main').innerHTML=`<div class="card"><h2>${cur+1}．${hl(d.t)}</h2></div>
${d.p?`<div class="prop"><small>核心命題</small>${hl(d.p)}</div>`:''}
<div class="card"><h3>臉書金句圖卡（${d.c.length} 句・${d.c.join('').length} 字）</h3>
<div class="cardwrap"><img id="cimg" alt="金句圖卡"><div class="cardtxt">${d.c.map(x=>`<p>${hl(x)}</p>`).join('')}
<div class="cardbtns"><button class="btn" id="cdl">下載圖卡 PNG</button><button class="btn" id="ccp">複製圖卡文字</button></div></div></div></div>
<div class="card"><h3>框架圖</h3><div class="flow">${f.map((x,j)=>(j?'<span class="arr">➜</span>':'')+`<div class="node"><i>${FL[j]||'步驟'+(j+1)}</i>${esc(x)}</div>`).join('')}</div>
<div class="mech"><div><b>觸發痛點</b>${esc(d.pain)}</div><div><b>運作機制</b>${esc(d.m)}</div><div><b>落地行動</b>${esc(d.a)}</div></div></div>
<div class="card"><h3>臉書圖文金句（${Object.values(d.q).flat().length} 句） <button class="btn" id="cp">複製整篇貼文</button></h3>
<div class="qbox">${Object.values(d.q).flat().map(x=>`<p>${hl(x)}</p>`).join('')}</div></div>
<div class="card"><details ${kw&&(d.t+d.b).includes(kw)?'open':''}><summary>原文（繁體）</summary><div class="raw">${hl(d.b)}</div></details></div>`;
$('#cp').onclick=()=>{navigator.clipboard.writeText(post(d)).then(()=>{$('#cp').textContent='已複製 ✓'})};
const url=drawCard(d);$('#cimg').src=url;
$('#cdl').onclick=()=>{const a=document.createElement('a');a.href=url;a.download=`${NAME}_${cur+1}_${d.t.slice(0,12).replace(/[\\/:*?"<>|｜]/g,'')}.png`;a.click()};
$('#ccp').onclick=()=>{navigator.clipboard.writeText(d.c.join('\n')).then(()=>{$('#ccp').textContent='已複製 ✓'})};scrollTo(0,0)}
const NAME=document.querySelector('h1').textContent;
function wrap(x,s,w){const out=[];let line='';for(const ch of s){if(x.measureText(line+ch).width>w&&line){out.push(line);line=ch}else line+=ch}if(line)out.push(line);return out}
function drawCard(d){const S=1080,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');
const g=x.createLinearGradient(0,0,S,S);g.addColorStop(0,'#2b2622');g.addColorStop(1,'#6b4430');x.fillStyle=g;x.fillRect(0,0,S,S);
x.strokeStyle='rgba(232,196,150,.55)';x.lineWidth=3;x.strokeRect(50,50,S-100,S-100);
const F='"Noto Serif TC","PMingLiU","Microsoft JhengHei",serif';
x.fillStyle='#e8c496';x.font=`600 34px ${F}`;x.textAlign='center';x.fillText('「 '+(d.t.length>22?d.t.slice(0,22)+'…':d.t)+' 」',S/2,150);
x.font=`600 62px ${F}`;let lines=[];d.c.forEach((s,i)=>{if(i)lines.push('');lines.push(...wrap(x,s,S-220))});
let fs=62;while(lines.length*fs*1.5>680&&fs>40){fs-=4;x.font=`600 ${fs}px ${F}`;lines=[];d.c.forEach((s,i)=>{if(i)lines.push('');lines.push(...wrap(x,s,S-220))})}
const lh=fs*1.5;let y=S/2-(lines.length*lh)/2+fs*0.9;x.fillStyle='#fff8ee';
for(const l of lines){if(l)x.fillText(l,S/2,y);y+=l?lh:lh*0.45}
x.fillStyle='#e8c496';x.font=`400 30px ${F}`;x.fillText('— '+NAME+' —',S/2,S-110);return c.toDataURL('image/png')}
function table(ids){$('#main').innerHTML=`<div class="card"><h3>每篇機制一頁總表（${ids.length} 篇）</h3><div class="tblwrap"><table><tr><th>#</th><th>標題</th><th>核心命題</th><th>觸發痛點</th><th>運作機制</th><th>落地行動</th><th>框架</th></tr>
${ids.map(i=>{const d=D[i];return `<tr><td class="n">${i+1}</td><td><a data-go="${i}">${hl(d.t)}</a></td><td>${hl(d.p)}</td><td>${esc(d.pain)}</td><td>${esc(d.m)}</td><td>${esc(d.a)}</td><td>${esc((d.f||[]).join(' → '))}</td></tr>`}).join('')}</table></div></div>`}
function render(){const ids=list();if(view==='a'){if(!ids.includes(cur)&&ids.length)cur=ids[0];list();art()}else table(ids)}
$('#nav').onclick=e=>{const a=e.target.closest('a[data-i]');if(a){cur=+a.dataset.i;view='a';tab();render()}};
$('#main').onclick=e=>{const a=e.target.closest('a[data-go]');if(a){cur=+a.dataset.go;view='a';tab();render()}};
$('#sel').onchange=e=>{cur=+e.target.value;view='a';tab();render()};
$('#q').oninput=e=>{kw=e.target.value.trim();render()};
function tab(){$('#t1').classList.toggle('on',view==='a');$('#t2').classList.toggle('on',view==='t')}
$('#t1').onclick=()=>{view='a';tab();render()};$('#t2').onclick=()=>{view='t';tab();render()};
render();
</script>
