<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>開心麻瓜筆記白話解析</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#2b2a27;--sub:#77736b;--line:#e4e0d6;--acc:#2f7d6d;--acc2:#e9f3f0;--hl:#fff1a8;
--b1:#2f7d6d;--b2:#c2693b;--b3:#5a6fb5;--b4:#a3527e;--b5:#7a8a2e;--b6:#b08a1e;--b7:#4a8fa8}
@media (prefers-color-scheme:dark){:root{--bg:#1b1c1e;--card:#25272a;--ink:#ecebe7;--sub:#a29e95;--line:#383a3e;--acc:#5fbfa9;--acc2:#24362f;--hl:#6b5a12;
--b1:#5fbfa9;--b2:#e0915f;--b3:#8fa1e3;--b4:#d488b0;--b5:#b3c45a;--b6:#dcb64a;--b7:#79c0d8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;line-height:1.7}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
h1{font-size:18px;margin:0 0 8px}
h1 small{font-weight:normal;color:var(--sub);font-size:13px;margin-left:6px}
#q{width:100%;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
#cats{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{display:grid;grid-template-columns:320px 1fr;gap:16px;padding:16px;max-width:1280px;margin:0 auto}
#list{display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 150px);overflow:auto;position:sticky;top:130px}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
.item.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2)}
.item b{display:block;font-size:14px}
.item span{font-size:12px;color:var(--sub)}
.no{display:inline-block;min-width:24px;color:var(--acc);font-weight:bold}
#count{font-size:12px;color:var(--sub);margin:0 2px 4px}
mark{background:var(--hl);color:inherit;border-radius:3px}
#detail{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 10px;color:var(--acc)}
.top h2{font-size:21px;color:var(--ink);margin:0}
.meta{color:var(--sub);font-size:13px;margin-top:4px}
.key{background:var(--acc2);border-radius:10px;padding:10px 12px;margin-top:12px;font-weight:bold}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tabs a{font-size:13px;text-decoration:none;color:var(--acc);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.plain{white-space:pre-line;font-size:16px}
/* 心智圖 */
.mm{display:flex;align-items:center;gap:0;overflow-x:auto}
.mm-c{flex:none;background:var(--acc);color:#fff;font-weight:bold;border-radius:14px;padding:12px 14px;max-width:150px;text-align:center}
.mm-bs{border-left:2px solid var(--line);margin-left:18px;padding:4px 0;display:flex;flex-direction:column;gap:8px;min-width:0}
.mm-r{display:flex;align-items:center;gap:8px;position:relative;padding-left:18px}
.mm-r:before{content:"";position:absolute;left:0;top:50%;width:16px;border-top:2px solid var(--line)}
.mm-b{flex:none;color:#fff;border-radius:8px;padding:4px 10px;font-size:14px;font-weight:bold;min-width:76px;text-align:center}
.mm-ls{display:flex;flex-wrap:wrap;gap:5px}
.mm-l{border:1.5px solid;border-radius:999px;padding:1px 9px;font-size:13px;background:var(--card)}
/* 框架圖 */
.fw{margin-bottom:12px}
.fw-n{font-size:13px;font-weight:bold;color:var(--sub);margin-bottom:6px}
.fw-s{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.st{display:flex;align-items:center;gap:6px}
.box{border:1.5px solid var(--acc);background:var(--acc2);border-radius:10px;padding:6px 10px;font-size:14px;max-width:220px}
.box i{font-style:normal;display:inline-block;background:var(--acc);color:#fff;border-radius:50%;width:20px;height:20px;line-height:20px;text-align:center;font-size:12px;margin-right:5px}
.arr{color:var(--acc);font-weight:bold}
/* 產品 */
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.pd{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pd b{display:block;color:var(--b2);margin-bottom:4px}
.pd span{font-size:14px;display:block}
.pd em{font-style:normal;font-size:13px;font-weight:bold;color:var(--acc)}
.pd .guess{display:inline-block;margin-left:6px;font-size:11px;color:var(--sub);border:1px dashed var(--line);border-radius:6px;padding:0 5px}
.pd.warn{border-color:var(--b6);background:color-mix(in srgb,var(--b6) 10%,transparent)}
.pd.warn b{color:var(--b6)}
.note a{color:var(--acc)}
.note{font-size:12px;color:var(--sub);margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.orig p{margin:0 0 8px}
.tag{display:inline-block;font-size:12px;color:var(--acc);margin-right:6px}
#back{display:none}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.hd h2{margin:0}
.hd span{display:flex;gap:6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px}
@media (max-width:820px){
 main{grid-template-columns:1fr;padding:12px 16px}
 #list{position:static;max-height:none}
 body.reading #list,body.reading #count{display:none}
 body:not(.reading) #detail{display:none}
 #back{display:inline-block;margin-bottom:10px}
 .mm{flex-direction:column;align-items:flex-start}
 .mm-c{max-width:none}
 .mm-bs{margin-left:16px;margin-top:6px}
 .mm-r{flex-direction:column;align-items:flex-start}
}
@media print{header,#list,#back,.tabs,.btn{display:none!important}main{display:block}body:not(.reading) #detail{display:block}}
</style>
</head>

<header>
 <h1>開心麻瓜筆記・白話解析<small>54 篇｜國小白話・心智圖・框架圖・團購產品</small></h1>
 <input id="q" type="search" placeholder="搜尋標題、原文、解析、產品…（例：消化酶、腹脹、鎂）" autocomplete="off">
 <div id="cats"></div>
</header>
<main>
 <div><div id="count"></div><div id="list"></div></div>
 <div id="detail"></div>

<script>
const NOTES=[{"title":"功能醫學機構\u0026醫生大匯總","date":"2025/10/25","tags":["功能醫學"],"body":["北京：北京洛奇醫學檢驗、北京和潤診所","上海：鮑林學苑","杭州：浙江大學醫學院附屬邵逸夫醫院 全科醫學科","其他城市的y生\u0026機構見文檔。包含了大部分省份的主要城市（見評論）。文檔內還額外贈送一份所有人可編輯可查看的《功能y學y生評價表》，歡迎各位就讠㐱後填寫。","另外，功能y學機構的收費都很嚇人，我會在文檔裡告訴大家如何在三甲y院裡找到有功能y學背景的y生。文檔還會對部分y生的擅長領域進行簡要介紹。","另外，建議大家在找y生時優先找有y學院背景+臨床經驗+經過功能y學認證的y生。","因為整理花費了大量時間，所以會收點整理費，感謝理解！點擊左下角即可購買~"]},{"title":"我的文章閱讀指南","date":"2025/1/13","tags":[],"body":["本文適用於有以下症狀的人：腹脹、腹瀉、反酸、燒心、消化不良、排便異常","一、如果你有腸胃問題，請先對照我的帖子“消化不良自檢表”“胃酸水平評估表”判斷一下你的胃酸、膽汁和胰酶水平。","①如果胃酸過低考慮服用鹽酸甜菜堿，服用方法參見我寫的“如何治療反酸/燒心”中的最後幾張圖片。","②如果膽汁水平不足考慮服用熊膽汁/牛膽汁/其他膽汁支持補劑，可以參考我寫的“肝鬱氣滯會導致膽汁分泌不足”。","③如果胰酶不足考慮服用消化酶補劑，可以根據你的飲食習慣，對照我寫的“食物不耐受成因\u0026解決方案大匯總”判斷自己需要什麼消化酶，同時參考我寫的“怎麼選消化酶”“5款全譜消化酶成分對比分析”。","④如果胃酸、膽汁和胰酶都不足，考慮服用同時提供三者的混合補劑，比如now的super enzymes(capsules)但是這款產品裡的消化酶只有淀粉酶、脂肪酶、蛋白酶、纖維素酶，如果感覺消化功能有限的話，可以再配合一款複合消化酶一起吃（同③）。","二、如果你反酸/燒心，請搜我寫的“如何治療反酸燒心”","三、如果你腹脹，請看我寫的“腹脹成因大匯總”，依據自己的情況一一排除。一般來說，最常見的腹脹成因是消化不良（測我寫的“消化不良自檢表”“胃酸水平評估表”）、腸道菌群失調（測我寫的“小腸細菌過度生長自測表”“腸道菌群失調自測表”）。如果你不知道什麼是腸道菌群失調，可以看我寫的“什麼是腸道菌群失調”","四、如果你腸道菌群失調，考慮采用功能醫學的5R療法來進行修復（可以參考我寫的“如何修復腸粘膜”“治療腸漏症的7步驟”“如何治療腸道菌群失調”“怎麼選益生菌”“怎麼選益生元”），","5R療法涉及殺菌流程，這個環節有風險（包括加劇肝臟毒素負荷、降低腸道菌群多樣性、導致條件致病菌過度生長等），請充分了解潛在風險並結合自身情況再做決定是否殺菌。盡量在不殺菌的前提下進行修復腸道。","即使真的靠其他方法沒用，還是想殺菌，可以看我寫的“怎麼選草本殺菌劑”。但非常不建議自行殺菌，因為一旦出現副作用你不知道咋治，建議找功能醫學醫生指導，諮詢渠道見我寫的“哪裡找功能醫學機構\u0026醫生”，價位在500/h-幾千不等。","五、如果不知道自己的腸胃問題根源，想最精準地判斷自身腸道情況，或在殺菌後仍沒有收到良好效果，可以購買腸道菌群檢測16s/18S/宏基因組（了解這些檢測可以看我寫的“腸道菌群檢測有啥用”），這些檢測能告知你的腸道都有哪些有害菌/有益菌，以及具體有多少，從而做出更精準的修復方案。","加油！"]},{"title":"心臟不適解決方案","date":"2025/2/9","tags":["熬夜","心悸","心臟疼","心臟健康","疲勞","過度疲勞","心臟不舒服","心臟痛","正式確診為健康人"],"body":["我就是靠根治腸道有害菌（↓內毒素入血）+肝臟排毒（↓全身炎症）+支持粒線體（葡萄糖，複合Vb，鎂）+抗氧化（輔酶q10等）解決的長期偶發心臟痛","一、功能醫學機制：氧化應激與腸道-心臟軸","1.氧化應激與炎症級聯反應","•熬夜時，自由基（ROS）大量產生，超過抗氧化系統（穀胱甘肽、SOD）的清除能力 → 心肌細胞脂質過氧化 → 細胞膜損傷，加重心律失常風險","•慢性壓力激活NF-κB通路 → 釋放TNF-α、IL-1β等促炎因子 → 促進動脈斑塊形成，增加冠心病風險","2.腸道菌群紊亂與心臟關聯","•熬夜破壞腸道菌群節律，導致腸道通透性增加（腸漏） → 內毒素（LPS）入血，激活全身炎症反應 → 間接損傷血管內皮，誘發心肌微循環障礙","3.腎上腺疲勞（HPA軸失調）","•長期壓力導致下丘腦-垂體-腎上腺軸（HPA軸）功能紊亂 → 皮質醇晝夜節律異常 → 白天疲勞、夜間清醒，進一步加重心臟負擔","二、營養學視角：能量代謝與電解質紊亂","1.鎂、鉀、鈣離子失衡","•鎂、鉀是維持心肌電穩定的關鍵電解質","•壓力/熬夜時：","鎂消耗增加 → 鎂缺乏可導致心肌細胞興奮性增高，誘發心律失常。","鉀流失加速（壓力激素促進尿鉀排泄） → 低鉀血症引發心悸、乏力","2.能量代謝代償性亢進","•熬夜時身體處於應激狀態，葡萄糖需求激增 → 若糖原儲備不足，會分解脂肪供能，產生酮體，加重心臟代謝負擔","•粒線體功能受損：長期過勞導致粒線體DNA損傷，ATP生成減少，心肌細胞能量供應不足","三、綜合干預方案","1. 緊急緩解（急性心悸時）","•深呼吸法：用4-7-8呼吸（吸氣4秒，屏息7秒，呼氣8秒）激活副交感神經，降低心率","•補充電解質：口服含鎂、鉀的電解質飲料（如椰子水），或服用鎂劑（200-400mg甘氨酸鎂）","2. 營養支持","•鎂：甘氨酸鎂/蘇糖酸鎂 400mg/日（改善心肌電穩定性）","•輔酶Q10：100-200mg/日（增強粒線體功能，減少氧化損傷）","•Omega-3脂肪酸：EPA+DHA 1-2g/日（抗炎、穩定心律）","•維生素B族：複合B族（尤其B1、B6、B12）支持能量代謝","3. 生活方式調整","•晝夜節律修復：","固定23點前睡，保證7小時睡眠，睡前1小時禁藍光","•運動建議：選擇溫和有氧（如快走、游泳），避免夜間劇烈運動（加劇交感興奮）","4. 功能醫學檢測（可私我諮詢）","•有機酸檢測：分析粒線體功能、氧化應激水平","•腸道菌群檢測：排查腸漏及菌群失調"]},{"title":"橋本逆轉經驗貼","date":"2025/1/26","tags":["橋本","功能醫學","食物不耐受"],"body":["我的橋本是由麩質引發的。最初的症狀是一過性甲亢（極其饑餓），尤其在吃了麩質後症狀更明顯。後來演變為甲減症狀（疲勞、怕冷、抑鬱等）。","後來看來《橋本甲狀腺炎90天治療方案》《免疫功能90天復原方案》《功能醫學概論》等等，了解到我橋本的根源在於腸漏，於是按照功能醫學的療法進行治療。","注意！以下療程不可顛倒。良好的腸道才能支持肝臟排毒，良好的肝臟才能支持腎上腺，良好的腎上腺才能支持甲狀腺。","①首先修復腸道。我之前有嚴重的菌群失調，表現為腹瀉腹脹消化不良，現在已基本無礙。這一修復療程就花了7個月......具體經歷在我主頁的［修復歷程］合集有詳盡分享。","②再做肝臟排毒。腸道不好的人基本都肝臟狀況不佳，原理是腸-肝循環。很多人都有肝臟亞健康問題而不自知，可以做我發的“肝臟狀況評估表”自測。這一療程危險性較高，強烈建議在功能醫學醫生指導下進行。","③修復腎上腺疲勞。找功能醫學醫生開的激素藥。間斷吃了2個月。","④修復甲狀腺。也是找功能醫學醫生開的激素藥。不過沒吃多久，甲狀腺激素水平就基本恢復正常（見圖2，吃之前偏甲減症狀）。","最關鍵的是降抗體的補劑:全身性酶（圖3款，iherb購入，吃了兩瓶，每瓶90粒，感覺是降抗最有效的，因為我有時候吃錯東西後會覺得甲狀腺發麻，再吃全身性酶補救會感覺很快有好轉）","全身性酶的理論依據見圖4\u00265","其他補劑:鋅，補了兩個多月的Vd（每天5000IU），硒（間斷吃，總共吃了100粒左右，每粒100mg，配合Ve，因為二者相互激活），鎂，其他抗氧化補劑（Vc,Ve,姜黃素,脂質體穀胱甘肽）間斷吃。","我的整個修復過程嚴格忌口麩質，牛奶，蛋，大豆，堅果，高植酸草酸食物，高碘食物。","強烈建議戒除反應性食物，否則會加劇橋本的抗體上升，理論依據見圖6，尤其如果你有食物不耐受的相關症狀（圖7\u00268），可以找機構做食物不耐受檢測（醫院不準，這個很多xhs網友分享過，可以參考圖9\u002610），可私信我諮詢靠譜的檢測渠道。","飲食: 醬油用的豌豆醬油，油吃橄欖油，紫蘇油，椰子油，主食吃大米（消化好建議吃糙米），偶爾小米（橋本適量吃），蕎麥麵。","分享兩個橋本知識學習渠道（圖11\u002612），還是建議有精力的話盡量把《橋本甲狀腺炎90天治療方案》看完，圖678也是來自這本書。看完後你就知道營養素的用法用量啦（內容太多，這裡放不下），還有飲食，生活方式等等的諸多注意事項。","如果有需要的話大家也可以點擊下方查看功能醫學醫生的諮詢渠道"]},{"title":"什麼是功能醫學","date":"2025/1/22","tags":["功能醫學"],"body":["圖源:曾強《功能醫學概論》","1.功能醫學是治療病因的醫學。","2.功能醫學追溯患者的病史、生活史，綜合遺傳、環境、心理、飲食習慣、生活方式和生理等方面研究疾病的 產生和變化，從而給病人提供個性化的治療方案。","3.功能醫學認為人體器官功能的長期減退是人類患上慢性病的罪魁禍首。","4.功能醫學將生物化學、生理學、免疫學、營養學、遺傳學等多學科綜合起來。","5.功能醫學不是通過消除症狀來治愈疾病，而是通過糾正引起功能紊亂和疾病產生的病因來修復機體，恢復健康。","6.功能醫學以病人為中心，而非以疾病為中心。同一種疾病，不同人的病因可能不同，功能醫學做的是尋找每個病人的病因，然後進行個性化干預。","7.功能醫學擅長治療亞健康和慢性病（但醫院通常不管亞健康，也對慢性病的治療有很大的局限性）","8.功能醫學提倡的是通過補充營養、平衡代謝、排除毒素等手段來改善器官功能。","9.功能醫學認為亞健康/疾病的根源是機體功能的失衡，包括七個生理功能失衡:胃腸道功能失衡；免疫失衡和炎症；解毒和生物轉化失衡；激素和神經遞質失衡；粒線體的能量產生及氧化/還原失衡；循環失衡（血脂異常）；結構失衡。","10. 1991年，全世界第一所功能醫學研究院在美國成立，此後逐漸傳播開來。"]},{"title":"胃食管反流慎用抑酸藥","date":"2025/8/10","tags":["胃食管反流","反流","燒心","抑酸藥"],"body":["再度提示抑酸藥的副作用！！！","我自身就深受其害，胃酸不足引發的腸道菌群失調、腹脹、消化不良、VB12吸收不良引發的疲勞、食物敏感、全身炎症（手腳發麻、心臟痛）......我花了一整年的時間，按照功能醫學的思路進行治療，才基本修復好。","這期間的曲折和痛苦暫按下不提，大家可以看看圖2，也是一位深受抑酸藥折磨的網友反饋。","圖3-6是功能醫學對於抑酸藥副作用的詳細解釋。","圖7是功能醫學干預下胃食管反流的治愈案例。","圖8是病友分享的反流治療成功經驗（服用膠原蛋白）","說回我自身，我是在服用穀氨酰胺兩個月後發現基本沒有反流問題了。這次測了胃鏡顯示已經沒有膽汁反流了。（圖9）","如果你要吃穀氨酰胺請參考我寫的“穀氨酰胺服用指南”。","另外建議大家晚上睡覺都用上反流斜坡墊，能夠有效防止夜間反流。（🍑有）","我整理了一份資料，詳細解釋了功能醫學是如何分析胃食管反流的成因、檢測方法、非藥物干預方案（包括飲食、生活方式和營養素等），總結了反酸燒心的治療方案，以及減少抑酸藥副作用的方法。資料全部由有醫學+臨床背景的功能醫學醫生執筆。","如果你想知道功能醫學能怎樣幫到你，或者在猶豫要不要找功能醫學醫生，可以先購買下方這份文檔。"]},{"title":"腸道菌群檢測有啥用","date":"2025/4/13","tags":["腸胃","腸道","腸道菌群失調","腸易激","腹脹","腹瀉","腹痛","腸道菌群檢測"],"body":["我之前發過“腸道菌群失調自測表”，很多人測完發現自己失調後問我咋治，其實腸道菌群檢測就可以幫助大家有效地判斷自身菌群問題的症結，這裡分享一下我之前做過的檢測。","這份報告可以評估腸道內的有益菌和有害菌種類、數量（圖1-3），還可以評估腸道抗炎能力、腸道免疫力、腸道代謝能力等等（圖4-8）。","報告附帶有專業人士解讀。針對我的報告，他指出我的有害菌多是因為消化不良而滋長的，建議我補充消化酶，我困惑良久的腹脹問題因此得到解答。在補充消化酶之後，我的情況有所好轉（現在已經不腹脹也不用吃消化酶了，消化好了很多，我發過不少經驗貼，可以參看我主頁的［修復歷程］合集）。","這份檢測用的是16s高通量測序技術（圖9-10），對於菌群情況的測量結果比較精準。而市面上價格在1k以下的菌群檢測基本沒用16s技術，檢測結果沒太多參考價值。","該品牌用的是德國技術，我深扒了該品牌的英文官網（圖11，翻譯版），確認了這一點，並且該公司產品遍布超過140+國家，所以可靠性還是很高的。","如果除了細菌，你還想測量真菌和寄生蟲的情況（因為細菌真菌寄生蟲都可能引發腹脹問題，詳見我寫的“腹脹成因大匯總”；另:如果你長期厚白苔，強烈建議檢測真菌，因為這很可能是腸道真菌感染引發的，我之前就是），該品牌也可以提供相關檢測（圖12），這用的就是18s/宏基因技術了，會更進階。","感興趣的話歡迎留言"]},{"title":"Vd最佳指標\u0026補充劑量","date":"2025/1/5","tags":["維生素d"],"body":["圖源:歷昀主編《功能醫學》"]},{"title":"甲狀腺激素指標怎麼看（功能醫學版）","date":"2025/1/5","tags":["甲狀腺","橋本"],"body":["圖源:歷昀主編《功能醫學》"]},{"title":"食物敏感（慢性）發生機制和解決方案","date":"2025/1/3","tags":["食物過敏與食物不耐受","食物不耐受","過敏","牛奶蛋白過敏","過敏體質","濕疹","鼻炎","關節炎"],"body":["圖源:歷昀主編《功能醫學》，tb有賣"]},{"title":"5款全譜消化酶成分對比分析","date":"2024/10/18","tags":["消化酶","消化酶推薦","消化不良"],"body":["我整理了五款各方面比較優秀的全譜消化酶，對應產品可以點擊左下角，從性價比上來說，Now Food是最劃算的，成分也很優秀，也是我現階段的選擇。","✨誰需要補充消化酶:","1.消化不良人群","通常表現為腹脹，慢性便秘，便便內有未消化的食物、有惡臭或過粗或顏色較淺","（消化不良通常有三種成因：胃酸不足、胰酶不足、膽汁分泌不足；可以做我發的“消化不良\u0026腸漏症自檢表”判斷自己是哪方面的問題），如果是胰酶不足，則需要補充消化酶。","2.腸漏症、腸道菌群失調、小腸細菌過度生長患者（可以做我發的對應的自測表來判斷自己有無相關問題）","這三者會引發消化酶不足（原理可以參考我發的“為什麼會消化酶不足”）","3.隨著年齡增長，人體內消化酶活性會自然降低，消化能力自然減弱","✨消化酶選取標準：","盡量全譜，尤其注重與自身飲食的匹配。","比如水果蔬菜吃得多需要補充各種纖維消化酶，","*魚、肉吃得多需要補充脂肪酶、各種蛋白酶、肽酶，","*豆類吃得多要補充淀粉酶、α-半乳糖苷酶，","*淀粉類主食/粗糧吃得多需要補充淀粉酶、麥芽糖酶、轉化酶（又名蔗糖酶）、葡萄糖淀粉酶、β-葡聚糖酶（腸漏\u0026腸菌失調患者尤其需要需要後四者，以及乳糖酶，因為有害菌會引發小腸粘膜刷狀緣受損，從而無法分泌這些酶）","*奶制品吃得多要補充各種蛋白酶、乳糖酶，","*麩質吃得多要額外補充DPP-IV（以上複合補劑裡的DPP-IV含量較低，如果麩質吃得多需要單獨補充麩質消化酶。有腸道問題一般不建議吃含麩質食物，因為麩質是所有食物成分裡對腸道破壞性最大的，除非外食不得不攝入，這時可以考慮now food的穀蛋白消化酶，性價比也很高，平均下來是2.23RMB/粒，可以在左下角查看）。"]},{"title":"腹脹消失了②","date":"2024/12/12","tags":[],"body":["續上文","H健康先生的另一篇帖子“炎症對身體有損害，是因為？”提及：","“炎症患者經歷的是惡性循環，因為炎症會耗盡營養資源，營養資源耗盡會進一步的加劇炎症。”","我當時醍醐灌頂，於是開始盡可能多地攝取多樣化、高營養食物（主食糙米，每天至少吃兩種水果，四種蔬菜，一種魚/肉/豬蹄，一次駝奶/牛骨膠原蛋白肽粉，一次鵪鶉蛋），配合消化支持補劑（早餐半粒賽默金消化酶，午餐/晚餐前一粒now的super enzymes，即超級消化酶+膽汁+胃酸混合補劑，餐後半粒賽默金消化酶，半粒是指用腸溶空囊來裝）","在這一過程中，我繼續攝入益生菌、益生元，並在腹脹的時候服用21st century的姜黃素（個人感覺含量比較大，一粒我會用腸溶空囊分成2-3次吃），其緩解腹脹（因為能消炎）的效果明顯比我之前隨便買的要好很多。而且姜黃素能起到抑制有害菌（包括真菌）生長的作用。晚上睡前我還會服用2粒califonia gold nutrition的全身性酶（多種蛋白酶），目的是分解食物殘渣，以免在體內遺留給有害菌提供發酵原料，避免產生新的針對食物蛋白的抗體，減少炎症，同時有助於消除體內已有的過敏食物抗體。另外我患有橋本，而全身性酶有助於降解自身免疫性疾病中形成的循環免疫複合物，減少針對甲狀腺的抗體。","這樣堅持了一周後，我的腹脹就完全消失了。為了確認這不是我的階段性好轉，我還特意觀察了一周。這一周內我嘗試了不下9種水果和高纖維蔬菜，都沒有任何不良反應（之前吃這些會腹脹）。天知道我已經差不多五年沒怎麼吃水果了！！！","總結一下，我執行了5周SCD飲食，配合3天殺菌，補充益生菌，乳酸菌素片，駝奶，SCD結束後執行高密度營養飲食支持（重中之重），配合姜黃素，全身性酶。一周後困擾我兩年的腹脹終於消失了。","但是我的腸道消化功能還是比較弱，接下來，我會繼續補充消化酶、全身性酶，同時把重點放在高密度營養支持（盡量豐富食物）、補充有益菌、後生元、通過飲食（水果、纖維）促進有益菌定植、修復腸漏（穀氨酰胺、肌肽鋅）上。","另外我想分享一下，20-21年我就一直受腹脹困擾，22年因為心情好多了就基本痊愈，但是22年下半年因為壓力大+過度勞累導致腹脹的情況又回來了。所以營養支持、壓力管理、充分的休息和睡眠（以及運動、曬太陽、避免毒素），是後續腸道健康的保障。","我以上提到的補劑可以點擊左下角查看，如果沒有的話就是在淘寶/iherb上購買的。"]},{"title":"腹脹消失了①","date":"2024/12/11","tags":[],"body":["我在之前的帖子“腹脹元兇竟然是米飯”裡提到我限制碳水攝入以餓死有害菌。後來經功能醫學醫生提點，才知道這我可能執行了SCD飲食（專門為限制有害菌生長而設立的飲食方案，詳見圖2）。但是醫生建議不要執行太久的SCD飲食，因為會導致部分營養素的缺失。我也了解到低碳太久的危害（而且執行過程中我總覺得很餓），所以我也沒有執行太久，只持續了五周。大家如要執行建議根據自身情況做調整，並請一定要做好功課，否則可能導致其他問題，常見的包括熱量攝入不夠導致的體重減輕，以及腎上腺疲勞。","在此期間，我還用草本殺菌劑間隔殺了三天菌（殺菌中我的赫氏消亡反應比較嚴重，感覺是殺敵一千自損八百，所以不想再殺），並且補充了針對腹脹的菌種。針對腹脹的菌種包括：植物乳桿菌、嗜酸乳桿菌、保加利亞乳桿菌/又名乳雙歧桿菌、嗜熱鏈球菌、乾酪乳桿菌、嬰兒雙歧桿菌35624。這一階段我主要用的是江中利活益生菌（因為它以乳酸菌為主）——在和有害菌對抗的過程中，益生菌是必不可少的，但不是唯一要素，否則我吃這麼久益生菌早該好了，重點請往下看。並且我在午飯和晚飯後一小時（此時胃酸濃度低）會吃6片乳酸菌素片，因為乳酸菌會抑制酵母菌生長。但我對牛奶不耐受，所以這只是我短期的策略。","由於我上一份腸道菌群檢測顯示我體內缺乏乳酸菌乳桿菌，但是在檢測前我吃的益生菌裡都是有這些菌的，所以我懷疑這受我的飲食影響，因為我完全不攝入任何乳制品（因為不耐受）。功能醫學醫生建議我可以喝點駝奶，它不包含牛奶和羊奶的酪蛋白和乳清蛋白，比較容易耐受和被消化。但是注意不要空腹喝，容易引發不適。我在嘗試駝奶的同時也買了含低聚半乳糖的益生元，以期促進乳酸菌乳桿菌生長。","但五周SCD飲食+殺菌結束後，我還是有腹脹現象，我就納悶了，為什麼這個菌怎麼餓怎麼殺都不死，於是我又查資料，看到@H健康先生的帖子“食物敏感測試和低碳飲食都錯在哪裡？”提到了幾點：","①問題不是碳水或糖攝入不好，所以我們要避免，而是你身體處於營養和代謝較弱的狀態。我們要解決的是你的營養缺乏和代謝功能減弱的問題，而不是減少碳水攝入去避免/掩蓋問題。","②在很嚴重的情況下，避免對身體不利的食物，通過減輕損害也可以支持腸道恢復能力，但真正要解決的問題是要加強腸道對各種食物的耐受性。如果你的食物選擇很狹窄，你也無法從飲食中獲得全面的營養攝入。","③殺菌無法根治腸道問題，根治方法是全方面的營養支持。","（字數有限，詳見②）"]},{"title":"抗氧化能力自測表","date":"2024/9/20","tags":["抗氧化"],"body":["抗氧化劑的協同作用很重要。","要想清除氧化劑，需要把維生素E、維生素C、β-胡蘿卜素和穀胱甘肽、花青素、硫辛酸和輔酶Q10結合起來才行。如果只用其中一種，不但效果不理想，而且還可能有一定危險。","所以最好的抗氧化是多樣化飲食，全面補充營養。","來源:《營養圣經》"]},{"title":"維生素\u0026礦物質缺乏自測表","date":"2024/9/16","tags":["維生素","礦物質"],"body":["來源：《營養圣經》","補充營養素前先做好功課，有些營養素不能長期補，有些營養素需要以合適的形式進行補充，大部分營養素可以通過調整飲食獲取（除了Vd基本只能通過曬太陽獲得），但需要注意選擇有機、非轉基因食品。飲食多樣化是獲得全方位營養的最佳方式。具體可以閱讀《營養圣經》的第六部分和第八部分。"]},{"title":"功能醫學視角下抑鬱症的發生機制","date":"2024/9/14","tags":["功能醫學","抑鬱症"],"body":["抑鬱症的病理學目前尚未明確，致病原因一般涉及重大的情感、社會和環境因素，如親人的離世，愛情或學業上的失落，遺傳和外界造成的脆弱感都可能導致抑鬱症的發生。","通常情況下，顯著的壓力因素是第一次爆發抑鬱症的主要原因，在復發性抑鬱症中，脆弱感似乎更容易增加發病的幾率，而壓力就變得不那麼相關了，疾病發作也就更加不受控制。隨著病症的反復發作，中樞神經系統功能障礙增加，表現為皮質醇過多，睡眠慢波減少，快速眼動睡眠增加以及神經可塑性被破壞。此外，炎症也被認為是另一個重要的激發因子，在抑鬱症患者體內發現有很高含量的炎症生物標志物，症狀治療後炎症也改善了很多。"]},{"title":"小腸細菌過度生長自測表","date":"2025/1/13","tags":["小腸細菌過度生長"],"body":["搜集到兩個版本。治療方法請參考功能醫學5R療法。可以諮詢功能醫學醫生（諮詢渠道見我寫的“哪裡找功能醫學醫生”）。也可參考我寫的“如何治療腸道菌群失調”，“腸道菌群檢測有啥用”。"]},{"title":"毒素引發的症狀\u0026疾病對照表","date":"2025/1/20","tags":[],"body":["在功能醫學體系裡，毒素是引發炎症、慢性病和亞健康的重要因素之一。如果對照症狀疑似重金屬感染可以買毒性元素檢測（頭發），配合功能醫生指導進行治療（諮詢渠道見我寫的“哪裡找功能醫學醫生”）。療程很長，首先要修復腸道，後續才能做肝臟排毒和重金屬螯合。"]},{"title":"大笑能治肝鬱氣滯","date":"2024/8/24","tags":["肝鬱氣滯"],"body":["先上結論，腹部發力式的出聲大笑有助於緩解肝鬱氣滯。","今年以來我的肝鬱氣滯時常反復。我看過很多小紅書的經驗貼，敲肝經膽經、艾灸、按穴位、拍八虛、泡腳、吃逍遙丸——能試的我基本都過，但都不是很有效，而且因為這些方法都比較麻煩，長期堅持是一件磨人心志的事情。","其實肝鬱氣滯最根本的原因就是心情不好——至少不能說得上開心。那你開心起來自然就能解決了。但這說得容易，開心對很多人來說都是很難的事情。我確實也發現和好朋友待在一起，氣滯很快就好了，但這一點的要求就更苛刻了，好朋友不可能隨時有空。看喜劇和脫口秀也有一定的幫助，但是看多了也不想看了，而且好看的難挑。說到底，都是條件苛刻。","昨天半夜腹脹得睡不著（我明確知道不是腸道菌群的問題，我能感受出來兩種脹感的區別，肝鬱氣滯式的脹感是整個人的氣機不轉，消化完全停滯，而腸道菌群主要是引發下腹部局部脹氣，有時候還有麻感），拍肝經膽經、按穴位也沒用。我靈機一動，人開心的時候會笑，那我直接笑會不會也能有同樣的效果呢？然後我就練習笑，而且是腹部發力式的笑，我尋思著我既然是腹脹，那我就腹部發力，給腹部做一個按摩會不會對腹脹有直接的幫助。事實證明是有的，我笑了大概半小時，打了上百個嗝，然後就明顯感覺脹氣消下去很多了，於是乎又睡著了。","第二天早上起來我又練習笑，繼續打嗝，繼續消脹氣。我發現這確實是條件限制最少、隨時隨地都能做、最簡單、也最經濟的治氣滯的方法了。我又搜了一下相關資料，確實看到有說大笑的種種好處（見圖2,3），哪怕是假笑也能起效（見圖4），而且笑著笑著你自己心情也會明媚起來。故在此分享給大家，祝大家都能開心！！！"]},{"title":"肝臟狀況評估表","date":"2024/8/20","tags":["肝臟排毒","肝臟"],"body":["圖2,3來自《橋本...》，4-11來自《免疫...》（見下）","如自測存在問題可以參考《橋本甲狀腺炎90天治療方案》第四章裡提出的肝臟支持方案，也可以參考《免疫功能90天復原方案》的第十二章第十三章，還參考安東尼的肝臟排毒飲食法。","注意不攝入肉魚蛋的話可能需要額外補充Vb,鐵,豌豆蛋白粉等營養素。","肝臟排毒二期需要足夠的蛋白質/氨基酸支持。","另外，在開始肝臟支持之前，請先確保腸道已經修復，否則腸漏會提供源源不斷的毒素（比如過敏性食物和消化不良產生的大分子以及腸道有害菌的內毒素）來源。","建議做足功課再調整飲食，避免誘發其他問題。"]},{"title":"胃酸水平評估表","date":"2024/9/29","tags":["胃酸"],"body":["本表由張玉珠醫生提供，已獲其授權分享。","補充胃酸的方法是鹽酸甜菜堿（和胃酸成分一致，飯前服用），詳情可參考我的帖子“如何治療反流/燒心”中的圖片。"]},{"title":"腹脹元兇竟然是米飯②","date":"2024/9/3","tags":["腹脹","脹氣","腸道菌群失調","小腸細菌過度生長"],"body":["接上文。","在這之後，我又特意查了文獻，了解到:","“某些碳水化合物如單糖不需要消化就可以被人體吸收並提供營養，雙糖和多糖（即淀粉類主食，如米飯和麵）沒有刷狀緣酶的作用就不能被消化或吸收，因為刷狀緣酶會將雙糖和多糖分離成可吸收的單糖成分。","這些未經消化的碳水化合物留在腸道內，就成了細菌的“午餐”。病原細菌發酵碳水化合物，從而導致脹氣、放屁，以及腹脹和進一步的腸道損傷，形成伊萊恩·高茨查爾所描述的惡性循環。”（《橋本氏甲狀腺炎的自我療愈》）","對於小腸細菌過度生長/腸菌失調的人來說，他們的小腸黏膜刷狀緣已經被破壞了。所以無法良好地消化淀粉類主食，所以淀粉都被拿去喂養有害菌了！這樣不脹氣才怪！","對於腸菌失調不知道怎麼飲食的患者，建議看看《橋本氏甲狀腺炎的自我療愈》的第17章 橋本氏病患者的飲食，裡面總結了近十種飲食法，你可以挨個嘗試，挑選最適合自己的飲食法。也可以參考《橋本甲狀腺炎90天營養方案》。","或許你不理解為什麼有腸道問題卻要看橋本的治療方案，那是因為橋本的根源也是腸漏。所以有腸道問題的人也可以參考橋本的飲食方案。而且，如果你有腸道問題，也要警惕自己可能得橋本或類似的自身免疫問題。（我就才診斷出橋本hhh）","分享一下我現階段（腸道修復\u0026肝臟排毒）的飲食方案:戒牛奶、穀物（含麩質）、雞蛋、水果、堅果、種子、高纖維蔬菜、茄科植物、海產品、其他反應性食物。","我的蛋白質來源:豌豆蛋白粉","我的脂肪來源：牛油果、椰子油、特級初榨橄欖油","我的碳水化合物來源:甜菜根、十字花科、綠葉蔬菜、瓜類。","之後等腸道恢復了會慢慢加入更多食物。"]},{"title":"腹脹元兇竟然是米飯","date":"2024/10/14","tags":["腹脹","脹氣","腸道菌群失調","小腸細菌過度生長"],"body":["自從今年2.20開始腸道殺菌以來，我的腹脹問題還是時好時壞，一直沒法徹底擺脫。繼大量補充益生菌、補充消化酶、喝開菲爾水、戒除麩質、水果和其他反應性食物以來，我還是會有輕微的腹脹，每次吃完飯都覺得得走上幾千步才舒服。但我怎麼也沒想到是米飯導致的這一切！","為了找出腹脹的成因，我還特意翻了一堆文獻，寫了“脹氣成因大匯總”，並且清楚地看到了這一條:","“對於伴有小腸細菌過度生長者則常常是吃水果和穀物時也腹脹，畢竟碳水化合物是細菌更愛吃的食物。”（《多囊卵巢綜合症完全指南》）","但是我還是下意識地忽略了，從沒想過戒穀物，畢竟從小吃到大，潛意識已經把穀物默認為飲食中不可或缺的一部分！（我只想過把主食從麵換成大米，小米和藜麥，卻從沒想過完全戒除主食！","插播一條選擇題:","下列選項中哪個不屬於人類必需的營養素？","a. 蛋白質","b. 脂肪","c. 微量營養素","d. 碳水化合物","如果您在搖頭，認為這道題肯定出錯了，那麼您並不孤單。這是我在藥學院生物化學專業讀一年級時做的一道測試題（而且我答錯了），正確答案是“d”。除了碳水化合物，蛋白質、脂肪和微量營養素均是人體必需的營養素。我當時震驚了：碳水化合物竟然不是必需營養素，脂肪卻成了維持細胞功能正常的必需營養素！碳水化合物非但不是必需營養素，還是造成血糖波動的罪魁禍首。（《橋本甲狀腺炎90天營養方案》）","直到我準備開始肝臟排毒環節，執行《橋本甲狀腺炎90天治療方案》提出的“疾病根源綠色果蔬汁”飲食（我根據自己的情況排除了水果,椰奶和纖維），發現在只吃蔬菜、豌豆蛋白以及牛油果的情況下，我完全不會腹脹了！！！並且這之後我的舌苔淡了很多，舌頭沒那麼胖大，舌緣齒痕也幾乎沒了！（這裡我要吐槽，中醫濕氣的概念實在是太粗糙了，因為濕氣的源頭實在太多了，每個人的成因可能都不一樣。而食物過敏就是很典型的濕氣來源）","因字數限制，見下篇帖子。"]},{"title":"治療腸漏症的步驟和補劑","date":"2024/9/29","tags":["腸漏","腸道","腸粘膜"],"body":["保持腸粘膜健康的7個關鍵策略：","1. 首先預防損傷","避免非甾體抗炎藥（布洛芬或對乙酰氨基酚）、酒精、咖啡、香煙以及攝入炎症（如Ω-6）和含糖食物；","避免不耐受食物、凝集素、麩質和乳制品的攝入；","使用消化酶以充分消化食物","2. 覆蓋和修復（抗炎、舒緩）","補充蘆薈、脫甘草甜素甘草 (DGL)、 蜀葵根、榆樹、乳香樹膠、毛蕊花、秋葵和紫草提取物","3. 結合或消化毒素和刺激物","補充免疫球蛋白、活性炭（短期服用）、全身性酶（即蛋白水解酶）","4. 殺死過度生長的細菌、真菌或病毒","攝入椰子油（含月桂酸，可在人體內轉化為單月桂酸甘油酯，也含辛酸）、乳香膠、鋅肌肽、甘草提取物、服用草本殺菌劑（慎用）","5. 直接支持腸道內壁","補充L-穀氨酰胺、鋅肌肽、多酚、或其他生物類黃酮補充劑、免疫球蛋白、氨基酸（L-脯氨酸、 L-絲氨酸、 L-蘇氨酸和 L-半胱氨酸）","6. 重建健康細菌","補充有效的益生菌、孢子菌、Akk菌（適量，或攝入蔓越莓）、普拉梭菌、雙歧桿菌","7. 喂養健康細菌","補充益生元","額外策略： 支持腸道神經健康","ps.對應補劑推薦品牌見圖。本文為谷歌翻譯，有個別用詞錯漏，注意甄別。原文由亞歷山大·萊因哈特（Alexander Rinehart）醫生撰寫。圖片已刪除大量網址以符合平臺要求。如感興趣請bing/google搜原文“The 7 Core Strategies to Heal Leaky Gut and Fuel the Biome”"]},{"title":"幽門螺桿菌治療思路","date":"2024/7/14","tags":[],"body":["本帖回復網友提問。","‍🔥個人建議:","鑒於抗生素對腸道的副作用（抗生素是腸漏的重要成因）。可以先考慮服用相關益生菌靶向清除（可用多款），補充相關治療草藥，嘗試中藥方子。如果無效再考慮四聯療法（並且結合布拉氏酵母菌服用，原因見下文）。","1⃣️如果查出感染了幽門螺桿菌，請諮詢醫生如何使用抗生素。如果不想吃抗生素，可以試一下乳香膠，這是一種從乳香樹中獲取的滲出液，出自希臘的一項臨床試驗指出，乳香膠（每次1000mg，每天3次）可以在14天內根除幽門螺桿菌，有效率為38.5%。","——《多囊卵巢綜合征完全指南》","2⃣️幽門螺旋桿菌治療","四聯療法：","•質子泵抑制劑、鉍鹽、四環素和甲硝唑，服用7～14天","草藥和替代療法:","•乳香膠：每次500mg，每天2～3次（早餐、午餐、晚餐），服用60天","•解甘草甜素補劑（DGL Plus）：每次1片，每天3次（早餐、午餐、晚餐），服用60天","•布拉酵母菌：每次50億～150億菌落形成單位，每天2～4次，服用60天（請注意，多種抗生素的使用會導致菌群失調以及腸道問題加劇。在抗生素治療過程中輔以布拉酵母菌可以把腸道菌群失調的風險降至最低。）","——《橋本甲狀腺炎90天治療方案》","3⃣️AppLe問：陳老師，有沒有可以治幽門螺桿菌的方子？一家人都感染了。","允斌答：何香豬肚湯治這個效果很好。","——《陳允斌教您順時生活的智慧》","4⃣️ 對於成年人，只要你沒有吃藥的禁忌證，就應該根治幽門螺桿菌。而且，我剛剛講了要以家庭為單位來防治，你家裡的其他人也要去檢測有沒有感染幽門螺桿菌。對於家裡的兒童，我們常規不建議做幽門螺桿菌的檢測，因為藥物對小孩的副作用可能會比較大。所以對於兒童，我們要權衡利弊，除非幽門螺桿菌引起了很嚴重的問題，才考慮根治幽門螺桿菌。同理，老人的年紀太大，可能同時患有心腦血管疾病、慢性腎病等其他疾病，是否需要根治幽門螺桿菌，需要進行風險獲益評估，如無抗衡因素，可以給予根治。","科學家做的大量研究表明，根治幽門螺桿菌以後，再次感染幽門螺桿菌的概率是比較低的，一般來講三年後復發的概率低於10%。","感染了幽門螺桿菌，吃什麼藥治療？","目前主流的治療方法是四聯療法。這四種藥物要連續吃10～14天，吃一次藥的根治率可以達到80%～90%。","有些朋友吃藥以後發現幽門螺桿菌並沒有被根治，那麼就需要找原因。是沒有按時吃藥，沒有按照醫囑來吃藥，還是體內的幽門螺桿菌出現了耐藥性？找到原因，再權衡利弊，看看需不需要再次吃藥進行根治。","——《曾醫生讓你早知道》"]},{"title":"食物不耐受成因\u0026解決方案大匯總","date":"2024/9/29","tags":["食物不耐受"],"body":["0.急性不耐受表現：脹氣、腹痛、腹瀉…  慢性不耐受表現：全身性慢性炎症（具體小紅書自查）","1.短期內根據自己情況補充對應的消化酶，消化酶的選擇可以參考我寫的“怎樣補充消化酶”。長期要修復腸漏，豐富腸道菌群，補充改善過敏的益生菌（小紅書自查）","2.高壓鍋15min以上能消除食物中大部分的凝集素","3.缺乏胰蛋白酶可以補充胰蛋白酶/菠蘿蛋白酶/木瓜蛋白酶。","4.如何修復腸漏可以看我寫的“如何治療腸漏症”","5.腸漏\u0026修復腸粘膜期間請勿攝入麩質、凝集素、酪蛋白、雞蛋，以及檢測出來的其他過敏食物","6.穀蛋白、酪蛋白和大豆蛋白是最難消化的蛋白質；動物性蛋白消化率要遠高於植物性蛋白","7.在選擇食物時，不但要依據上表考慮自己能否消化、耐受，還要考慮食物的寒熱屬性，如果本身脾胃虛寒還吃寒性食物也可能引發腹脹腹痛腹瀉","8.所有未被充分消化的食物都會在大腸成為有害菌的養料，制造毒素和氣體（腹脹的成因之一）。還可能引發炎症、腹瀉，刺激針對特定食物的IgG免疫球蛋白的生成，每次識別到該食物就發生過敏反應（這也是食物不耐受的成因）","9.理論上IgG免疫球蛋白的半衰期是23天，這之後能降至5%以下。所以避免吃過敏食物23天後過敏反應就會小很多","10.食物不耐受的解決方案：在功能醫學檢測機構做食物不耐受檢測（淘寶有，需自行篩選），然後采取循環飲食法：對於輕度不耐受的食物輪換著吃，每四天只能吃一次。例如你對小麥輕度不耐受，那麼你每四天只吃一次麵食；對於中度不耐受的食物，要排除飲食三個月，之後采取循環飲食法三個月，再行正常攝食；對於重度不耐受的食物，要排除飲食六個月，之後采取循環飲食法三個月，再行正常攝食（想深度了解請小紅書自查）","11.如果有全身性慢性炎症，可以考慮補充全身性酶（主要是蛋白酶，非餐間服用）","12.對於腸易激綜合征或者小腸細菌過度生長的人來說，他們的腸黏膜容易被小麥中的麩質或富含凝集素的種子給“撕破”，進而損害各類刷狀緣酶的活力，也會加劇腸漏","13.修復小腸粘膜刷狀緣的思路可以按照修復腸粘膜\u0026腸漏的思路走，可以看我寫的“如何治療腸漏症”","14.高溫烹飪有助於降低單寧、皂苷、植酸、草酸等物質的含量","15.補充芽孢桿菌如凝結孢桿菌、枯草芽孢桿菌等有助於分解蛋白質，可以自行搜索孢子類益生菌","16.本人之前寫過和胃酸、膽汁、消化酶、腸道菌群失調、腸漏、益生菌、益生元、腹脹有關的文章，提問前先自行查閱","17.本文僅供參考，請自行判斷，自行負責"]},{"title":"中西醫是互通的","date":"2024/6/24","tags":[],"body":["文源:李辛《經典中醫啟蒙》","其實我很多時候也感覺到中西醫的互通。比如說之前有段時間在治療腸道，用了草本殺菌劑，這個時候我腸道處於益生菌很少的狀態，然後就特別畏懼風寒，一點輕微的風都能讓我腹痛腹瀉。按中醫的說法，這個叫正氣/陽氣不足，所以無法抵御邪氣。在我身上，其實就是益生菌（幫扶我的正能量）不足，所以無法對抗外界的風邪。","等到後來我的益生菌補起來了，就沒有這種情況了，也就是說我的陽氣也足了。","事實上，有營養/合適的食物，健康的作息，良好的心情……都可以理解為幫扶我們的正能量，都可以助長我們的陽氣。"]},{"title":"怎麼選益生元","date":"2024/9/29","tags":["益生元"],"body":[]},{"title":"怎麼選益生菌","date":"2024/9/1","tags":["益生菌"],"body":["1⃣️益生菌種類參考圖四，要盡量豐富","其中VSL＃3整合了八種益生菌，其聯合效果受眾多論文證實，詳情參考最後一張圖。如果你在iherb上查，會發現賣得最火的就是這一款。","2⃣️益生菌盡量選有標明菌株編號的","原因參考最後一張圖","3⃣️益生菌作用因人而異，你可能需要不斷試錯才能找到適合自己的。","4⃣️孢子類益生菌也很重要，它們是土壤源益生菌。","5⃣️選擇耐酸處理的益生菌（比如凍乾包埋技術），這樣可以提高益生菌的存活率","6⃣️根據自己的症狀（參考圖3,5-10）選擇對症的菌株","⚠️注意:","1⃣️如果腸道菌群失調嚴重（是否嚴重可以參考我寫的“腸道菌群失調自測表”），不利於益生菌的定植，這往往是你吃益生菌覺得沒用的原因。","2⃣️益生菌要配合益生元一起吃。不然益生菌吃進去也會被餓死。（參考我寫的“怎麼選益生元”）"]},{"title":"治病治到最後就是在治心","date":"2024/6/21","tags":[],"body":["羅大倫語"]},{"title":"怎麼選草本殺菌劑","date":"2024/10/19","tags":["腸道菌群失調","草本殺菌劑"],"body":["續“如何治療腸道菌群失調”一文","還是建議這一治療在專業醫生指導下進行，如果你決定自行嘗試的話，後果自負哈。","圖二是《免疫功能90天復原方案》裡面推薦的產品，但淘寶貌似只有最後一款，如果你想買其他的，可以在iherb或者亞馬遜美國站上看看。","最後一款的成分表我放在圖4了。從成分來看，這個應該是在腸道被吸收的，所以理論上不會造成胃部不適。但是他的草本成分比較少。","圖3這款是淘寶上賣的最火的草本殺菌劑，也是一位小紅書網友@Joey的無麩質食譜 在治療腸道菌群失調的時候她的功能醫生推薦的產品。成分表放在圖3，它應該是在胃裡就會被溶解的，所以如果你有胃部不適的情況要注意了，它會對胃黏膜造成刺激。解決方案是自己買一瓶腸溶膠囊空囊，把這個圖三的膠囊拆開倒進腸溶膠囊裡面吃。","另，脂質體的Biocidin殺菌劑效果要好很多，並且對人腸胃的刺激性比較小，因為它是點對點地作用於有害菌的。","圖5,6是我自己在iherb上買的。因為我發現很多草本殺菌劑都有“油”的成分，但是我對油的消化有問題（膽汁分泌不足），體現為有時候會脂肪瀉，胸口有氣頂著、呃逆。所以我挑了好久才找到這款成分裡沒有油的產品。同樣也是倒進腸溶膠囊裡以減小對胃的刺激。（因為我當時胃黏膜受損，有燒心反酸情況）","但是我在使用草本殺菌劑一個多月後感覺消化能力下降很多，後續一直在用消化酶，所以殺菌可能有副作用，請謹慎使用。","並且如果使用殺菌劑過久可能誘發條件致病菌增長的情況。還是建議在功能醫學醫生指導下進行。"]},{"title":"饅頭麵條養胃or麩質有害？","date":"2024/9/29","tags":["麩質"],"body":["老實說這個問題我困惑了好久。之前脾胃不好，看到有人說多吃麵多吃蒸饅頭多吃烤饅頭片，但我怎麼吃都覺得不太舒服，要不然就是吃了也沒覺得有養胃的作用。","直到後來了解了小麥麩質會加劇腸道通透性，加重腸漏症，這才嚇得不敢吃了。","但我還是很困惑。為什麼中醫會認為小麥養脾胃呢？","1⃣️首先，現代的小麥和古代的小麥已經很不一樣了。（大家在參考老祖宗的說法的時候，要注意，隨之時間變化，事物也會變化。馬克思學說謂之真理的條件性。）","現代農業技術涉及基因改造，即轉基因技術，也就是人為改變玉米、大豆和小麥等作物種子的基因，從而讓這些作物長得更大或者更能抵御病蟲害。但以這種方式改變作物有不良後果——它們含有非天然的蛋白質（麩質）。動物實驗證實，這些蛋白質難以被消化，會造成以下症狀：胃灼熱（燒心）、反流、排氣、腹脹。（此段來源:《免疫功能90天復原方案》）","2⃣️其次，中醫強調食物的寒熱屬性。但西方沒有這個概念。北方的小麥多接受太陽的暴曬，南方的水稻多吸收水的寒涼，所以小麥性溫，大米性涼。脾胃弱的人多寒症，脾胃虛寒這個詞也是這麼來的。針對寒症，小麥確實更好。","❓好吧，弄清楚這個問題之後，到底該不該吃小麥呢？","總之，我還是決定放棄小麥，因為它帶來的壞處比帶來的好處大得多。脾胃虛寒沒關係，我可以艾灸和曬太陽，但是麩質吃進去，沒法降解就是沒法降解（因為我是腸道菌群已經失調，腸道黏膜也已經受損而且還有自身免疫性疾病，如果你一切正常，那你吃麩質就沒有關係）。","如果你實在是喜歡小麥，有一種辦法能破壞麩質——老面發酵或者加乳酸菌發酵超過24小時（甚至48小時，時間越久越好，因為越久，麩質降解得越徹底）的全麥粉制作的麵團。但這種麵團會有酸味，需要加堿兌，而且口感偏硬實。要想口感好，我能想到的唯一辦法就是把它作為包子皮，而不是做饅頭。但市面上基本買不到這種，你有餘力的話可以自己弄。","另外一種方法是吃能消化麩質（即穀蛋白）的消化酶，可參考左下角now的這款。但是這適用於偶爾在外不得不吃到麩質的補救方案，日常還是不建議吃麩質。"]},{"title":"如何修復腸黏膜","date":"2024/6/18","tags":["修復腸黏膜"],"body":["接“如何治療腸漏症”","圖3-11的總結:","1⃣️骨頭湯","2⃣️穀氨酰胺","3⃣️鋅","4⃣️N-乙酰半胱氨酸","5⃣️w-3脂肪酸","6⃣️維生素D","7⃣️消化酶","8⃣️益生菌","9⃣️全身性酶","圖2:《功能醫學概論》","圖3-11:《橋本甲狀腺炎90天治療方案》"]},{"title":"如何治療腸漏症","date":"2024/6/18","tags":["腸漏症"],"body":["1⃣️步驟一:移除過敏/反應性食物","2⃣️步驟二:補充消化酶","3⃣️步驟三:平衡腸道菌群（補充發酵食物，益生菌）","4⃣️步驟四:修復腸道（見我的帖子“如何修復腸黏膜”）","圖片來源:《橋本甲狀腺炎90天治療方案》"]},{"title":"什麼是腸道菌群失調","date":"2025/1/13","tags":["腸道菌群失調"],"body":["1⃣️有益菌不足","2⃣️小腸細菌過度生長","3⃣️免疫抑制失調（食物敏感，疲倦）","4⃣️炎症性失調（肌肉/關節疼痛，脹氣），自身免疫性疾病","如果確認自己失調，可以做腸道菌群檢測查出元兇，參考我寫的“腸道菌群檢測有啥用”"]},{"title":"如何治療腸道菌群失調②","date":"2024/9/2","tags":["腸道菌群失調","小腸細菌過度生長","腸易激綜合症"],"body":["接上文。","我看過4位西醫判定我的問題為腸胃功能紊亂/功能性腹瀉/腸易激綜合征，我也曾對照過網上描述判斷認這是小腸細菌過度生長。好罷，起不同的名字去描述同樣的現象有什麼意義呢？根本不解釋根源和提供解決方案！","我也吃過半年中藥，吃的時候不腹瀉，一停藥就瀉。","草本殺菌劑的效果讓我很興奮，但不久後，我發現還是腹脹。那個時候我沒意識到這是消化不良引起的（之前是腸道菌群失調和消化不良共同造成的）。直到後來做腸道菌群檢測，營養師和我說要補充消化酶，我才意識到問題所在。建議各位可以多看下我寫的“為什麼會腹脹”“消化不良自檢表”。","因為沒意識到是消化不良引起的腹脹，我就繼續吃草本殺菌劑，並且我當時遇到的另一個誤區是服用的益生菌劑量不夠。","⚠️治療過程一定要服用足量的益生菌。","前文圖片裡面有寫服用的益生菌種類和劑量，益生菌我還會發一篇帖子。","最開始我服用的益生菌是足量的，所以暫時沒什麼問題，但是一個月後，我改用了醫院常開的益生菌片，但是那種益生菌片是非常低劑量的，並且菌種不夠多。（我服用的原因是在治療前西醫和我說腹瀉的情況最好服用醫院開的藥片，而不是市面上賣的益生菌粉。他的說法或許對於一般的腹瀉是有幫助的。但是我沒有意識到接受腸道殺菌治療的情況又有所不同）於是我開始出現極度畏寒的現象，一點輕微的風就能讓我腹痛腹瀉。我陷入迷茫，於是在淘寶買了腸道菌群檢測，檢測後營養師指出我益生菌太少。我在這之後服用了足量的益生菌，就不畏寒了。","另，營養師跟我說吃草本殺菌劑的時候不要吃益生菌，因為它們也會被草本殺菌劑殺死。但我問診的一位功能醫學醫生說牛至油是不會殺好菌的，而且功醫殺菌方案裡是要配合mega孢子菌（和殺菌分開吃）以及biocidin活性炭（吸附毒素）一起吃的。","每個人腸道菌群狀況不一樣，建議找功醫配合檢測針對性調理，避免治療過程出現其他副作用（比如殺菌過程中條件致病菌過度生長）","🔥目前來說，我的腸菌失調已經好多了。之前長達一年的慢性腹瀉和夜間腹脹都消失了。但我還是會不定時地出現腹脹，原因不明所以又買了腸道菌群檢測。","——8.6更新","7月初檢測報告就出來了，顯示還是有害菌過多，但是和之前的有害菌種類不太一樣了。這次的有害菌主要是由消化不良（沒補充足量消化酶）導致的。所以如果大家要殺菌的話最好補充足量消化酶。這個月我主要靠開菲爾水調菌群，感覺治腹脹效果不錯。"]},{"title":"如何治療腸道菌群失調①","date":"2024/6/18","tags":["腸道菌群失調","小腸細菌過度生長","腸易激綜合症"],"body":["請在治療前先閱讀我寫的“腸道菌群失調自測表”。","圖片來源《免疫功能90天復原方案》","1⃣️第一階段","避開敏感食物（尤其是麩質和糖），攝入有益食物（椰子油，發酵食物，膳食纖維，益生菌，益生元）","2⃣️第二階段","服用草本殺菌制劑，益生菌，益生元","3⃣️第三階段","如果前兩步後沒有好轉，再進一步檢測評估","⚠️第二階段是最危險的一步。建議在專業人員指導下進行❗❗❗","其實西醫也是有治療方案的，比如說利福昔明抗生素殺菌，但是功能醫學很不提倡服用抗生素，因為它的副作用太大了，草本殺菌劑相對來說副作用會小些。而且我很久前吃過利福昔明，腹痛，之後就不敢吃了。","這一階段我自己瞎鼓搗，翻車不少。我也聽從了一些專家的建議，但感覺也不是都對......只能說這個過程，多問，多看，多思考，多調整吧。如果你沒有把握，還是不要亂來，去找功能醫學機構的醫生指導吧，怎麼找我在置頂帖子裡寫過。","如果你的腸道有害菌過多，最開始服用草本殺菌劑會導致赫氏消亡反應，簡單來說就是有害菌大量死亡會釋放大量的細菌內毒素和有害氣體，這些物質會通過腸壁滲漏進血液，引發全身性的炎症（尤其在你腸漏症很嚴重的情況下）。我最開始服用草本殺菌劑的時候就出現了渾身顫抖，發麻的症狀。這恰恰也代表了我腸道內的有害菌特別多。因為當時情況過於嚴重，我就服用了硅膠吸附劑（原理是它能把有害毒素吸附起來，隨著糞便排出去），服用後很快好轉。這個我是在英國買的，國內沒有。但蒙脫石散應該也是一樣的，它的原理也是吸附細菌和毒素，保護腸黏膜，如果你要買的話，請先充分閱讀說明書哈！！！","但這個吸附劑的問題在於它會把細菌毒素以及服用的草本殺菌劑一起吸附力，會抑制草本殺菌劑的效果。所以如果沒啥赫氏消亡反應的話盡量別吃。","圖6裡提及的小壁堿片，其實就是治療急性腸胃炎臨床上常開的鹽酸小壁堿片/黃連素，同樣是殺菌的，但我主要吃的是一款複合的草本殺菌劑，因為我覺得成分越多可能效果越好，有更廣譜的殺菌作用。這樣我就更可能在短時間內達到更好的療效。","但是不少草本殺菌劑對胃黏膜有刺激作用，圖片裡也講了。我因為胃炎不敢吃，於是把買來的草本殺菌劑膠囊拆開，倒進我買的腸溶膠囊裡面吃。","🔥僅僅在服用草本殺菌劑三天後，困擾了我長達一年的慢性腹瀉和夜間腹脹就消失了！！！","後文見下一篇帖子。"]},{"title":"腸道菌群失調自測表","date":"2025/1/13","tags":["腸道菌群失調"],"body":["來源:《免疫功能90天復原方案》","如果測出來有失調問題，可以做腸道菌群檢測以確定菌群具體是啥問題，建議看我寫的“腸道菌群檢測有啥用”"]},{"title":"甲狀腺炎症自測表","date":"2024/6/18","tags":["甲狀腺炎症"],"body":["來源:《健康守護全書》"]},{"title":"影響消化酶活性的因素","date":"2024/7/8","tags":[],"body":["影響因素見圖2~4。","1.溫度","所以說腸道溫度合適（=人的體溫37℃）是很重要的，倪海廈老師也提過小腸溫度過低影響消化，這大概也是艾灸關元、吃柴火飯以及氣沉丹田的意義所在。","2.酸堿度（ph值）","因為我們平時都只是吃消化酶，但卻沒有吃碳酸氫鹽（但這個東西不能直接吃到胃裡哈，不然會中和胃酸，影響消化的，不過或許可以考慮腸溶膠囊+小蘇打）。所以我有點懷疑，我有時候即使吃了消化酶，熱敷腹部還是會下腹部脹氣可能和這個有關。","6.23更新:我吃了消化酶和小蘇打，還是會腹脹，現在懷疑是akk菌不足的問題，月底akk菌到了再反饋。","7.8更新:又做了一次菌群檢測，發現之前有段時間消化不良卻沒吃消化酶導致腸道一些有害菌生長。尤其沙門氏菌可能是脹氣的原因之一。另外我艾灸會覺得脹氣緩解不少。akk菌服用有些不良反應。暫時停吃。現在重點修復腸漏。"]},{"title":"怎麼補充消化酶","date":"2024/9/29","tags":["消化酶"],"body":["最好吃全譜消化酶哈（包含脂肪，蛋白質，纖維素的消化酶），隨餐服用，用量根據自己的需求調整。可以用腸溶空囊來裝，把一粒消化酶分成好幾粒，每次吃一粒。","有人問我買哪個牌子，老實說，我覺得牌子不重要，重要的是成分和劑量，我在淘寶/iherb上看了幾款賣的比較火的，我把成分表放上來，大家參考下，它們都包含脂肪酶，蛋白酶和纖維素酶。在此基礎上有其他更多的酶當然iherb因為這代表消化能力更強。當然一般來說價格也會更貴一些，大家根據自己的需求自行選擇。","最後一張圖是同時補充胃酸膽汁和胰酶的，如果你三個都缺，可以考慮這一款。","順帶提一下，國內比較常見的兩款消化酶我都吃過，達吉和千紅怡美，但就是感覺消化能力不夠強。換成後來更全譜的消化酶就好多了。","這裡推薦一下iherb這個保健品海淘網，中文的，支持微信支付，在這上面買保健品選擇會多很多，價格也相對便宜一些。但是海淘時間會比較久，一周到兩周的配送時間我都試過。"]},{"title":"為什麼會消化酶不足","date":"2024/6/17","tags":["消化酶"],"body":["總結:","1.腸漏症、小腸絨毛受損","2.小腸細菌過度生長","3.缺乏益生菌","4.麩質引發的乳糜泄","5.毒素蓄積（1⃣️有害菌過度生長產生的內毒素和有害物質2⃣️食用的食物含有的農藥抗生素激素等物質3⃣️無法充分消化的食物都會在腸道變成毒素來源，這一點之後會在之後講腸道的時候解釋）","6.壓力（通過腦-腸軸作用於腸道，精神方面對腸胃影響很大的）","7.飲酒","8.缺乏維生素b1"]},{"title":"消化不良\u0026腸漏症自檢表","date":"2024/6/18","tags":["消化不良","腸漏症"],"body":["包括膽汁酸水平，胃酸水平，胰酶水平和腸漏症問題","來源:《免疫功能90天復原方案》"]},{"title":"脹氣成因大匯總","date":"2025/1/13","tags":["腹脹","脹氣"],"body":["引發脹氣的成因可太多了，所以治療前請先判斷自己屬於哪一種。大部分人應該是前兩者。","本文主要參考《功能醫學概論》《免疫功能90天復原方案》《健康守護全書》。一共總結了9點，或許還有遺漏的，但這些應該已經囊括了大部分人的脹氣成因。","1.消化不良（還會導致便秘或腹瀉）","消化不良的主要因素：（前三者還可以參考我的帖子“消化不良自檢表”“胃酸水平評估表”）","①胃酸不足（進食高蛋白食物如魚、肉後半小時內上腹部脹氣）","②膽汁不足（進食高脂肪食物如油、肉後脹氣）","③胰酶不足或酶活性不夠（飯後2-4小時脹氣）","④食物不耐受（這個范圍可太大了，參見我寫的“食物不耐受\u0026解決方案大匯總”。每個人不耐受的食物不一樣，具體可以做食物不耐受檢測，可以私我諮詢檢測渠道）","2.小腸細菌過度生長/腸道菌群失調/有害菌過度生長（參考我寫的“腸道菌群失調自測表”，表現:進食糖以及碳水化合物如水果、穀物後下腹部脹氣；具體可以做腸道菌群檢測，參考我發的“腸道菌群檢測有啥用”）","3.腸道有益菌不足（有益菌有助於進一步分解食物殘渣，有助於抑制有害菌生長，有些還對脹氣有直接的幫助，參考我寫的“怎麼選益生菌”）","4.酵母菌感染（特別是在吃了促酵母增長食物如糖、精致穀物、奶制品後脹氣）","5.寄生蟲感染（如果排除了前四者再考慮這一項。寄生蟲經常引起腹瀉、痙攣和腹脹。有時人感染寄生蟲後不會表現出任何症狀，不會出現明顯的腸道問題，但會不明原因地起疹子，或者對以前不過敏的食物和環境過敏。診斷是否感染寄生蟲的唯一方法是做糞便化驗。）","我了解到有檢測可以測出細菌、真菌和寄生蟲的感染情況，可以私我諮詢。","6.食用高發漫食物（參考小紅書其他帖子）","7.應激","8.攝入甜味劑，如山梨醇、赤蘚糖醇、木糖醇（甜味劑還會破壞腸道）","9.乙酰膽堿缺乏（還會有肌無力、記憶力下降、思維能力減退和反應變緩等症狀）","ps.以下2點是常見的其他原因:","1.肝鬱氣滯（中醫角度，治療考慮調心情、喝中藥。如果加上脾胃不好，喝中藥可能效果不太好，可以考慮用羅大倫的“解鬱湯”泡腳。詳情小紅書自查。因為我有過長期肝鬱氣滯後來好了，我的判斷是肝鬱氣滯可能是肝功能異常+甲減，這個治起來比較複雜，可以找功能醫學醫生干預，具體可以看我發的“哪裡找功能醫學醫生”）","2.精神因素，比如焦慮抑鬱壓力生氣（神經和腸胃有非常緊密的聯繫）","3.甲狀腺功能減退"]},{"title":"因為胃病根本不止是胃的問題！","date":"2024/6/16","tags":["功能醫學","胃炎","胃病"],"body":["人的消化系統是由消化道和消化腺組成，消化道包括口腔、咽、食管、胃、小腸（十二指腸、空腸、回腸）和大腸（盲腸、升結腸、橫結腸、降結腸），消化腺由唾液腺、肝、膽囊、胰腺及散在分布於消化道壁內的腺體構成。","這麼多的部位，如果其中一個出現問題，都有可能體現為“胃病”，比如胃酸不足胃蛋白酶不足、胰酶不足、膽汁分泌不足、腸道菌群失調都有可能導致腹脹。（參見我的另一篇帖子“脹氣成因大匯總”）","更何況，器官之間還互相關聯，一個有問題會影響另一個，像我本來只是胃酸不足，後面就發展成了小腸細菌過度生長、腸漏症、肝臟毒素負荷過載、膽汁和胰酶分泌不足……一旦形成連鎖反應和複雜系統，問題就變得特別棘手。","想要解決問題，我們首先得了解我們的消化系統。（這一部分主要參考曾強《功能醫學概論》）","文字太長，詳情見圖。"]},{"title":"功能醫學入門","date":"2024/6/17","tags":["功能醫學","消化道"],"body":["首先聲明，我不是醫生，也不是醫學生！我只是分享我的治病經驗，以及閱讀過的可能有效的材料。從20年急性腸胃炎，到21年慢性膽汁反流性胃炎，到22年腸易激綜合征，到23年小腸細菌過度生長、功能性腹瀉以及全身性的慢性炎症，消化道的問題我幾乎得了個遍。中醫我看過4位，針灸看過3位，西醫看過9位（大部分都是三甲醫院主任副主任）。但結果呢，除了針灸壓制了我的反酸燒心症狀之外，其他問題都沒治好，甚至抑酸藥的服用還導致了一大堆更嚴重的問題。","走投無路的我在24年2月，機緣巧合下了解到“腸漏症”以及“功能醫學”（感謝小紅書！感謝網友分享），總算對我的病情有點眉目了，自此開始了我艱難的消化道修復之路。","文字太長，放在圖裡了。","劃重點：建議大家多方參考，以科學檢驗和實踐結果為治療導向。不要盲信醫生，也不要完全不信，當然也不要盲信我，更不要把疾病的治療權完全推給他人，這是不負責任的態度。我不提供治療建議，我只建議大家看書、依據書的描述分析自己的症狀和問題所在，然後再綜合書以及醫生的建議進行治療。（當然這是個很艱難的過程，因為很多時候你會發現很多說法互相沖突，只能說實踐出真知吧，但是實踐也一定要謹慎，要基於科學檢測、邏輯分析和充分的相關資料，千萬不要隨便吃藥/營養素啊！！！吃之前一定要查用法用量注意事項和副作用！！！","治療結果我還不能說，因為慢性病沒那麼快修復的，只能說比之前好多了。具體問題的治療方案和療效會在其他帖子裡寫。","最後，祝大家早日康復！"]},{"title":"穀氨酰胺服用指南","date":"2024/9/29","tags":["穀氨酰胺"],"body":["用量參考10,13,14","副作用和注意事項參考圖3,4,9","至於選哪一種穀氨酰胺:","我只推薦賽摩根的，這是功能醫學醫生的標準方案，品質最有保障。如果想找平替可以在iherb上找。"]},{"title":"如何判定胃酸過多還是過少","date":"2024/6/17","tags":["胃酸過多","胃酸不足","胃炎"],"body":["可以先對照最後兩張圖大致看一下自己的症狀是否匹配。（注:胃食管反流既有可能是胃酸過多，也有可能是胃酸過少）","小紅書上比較多有關小蘇打胃酸測試的帖子，這個是最方便的，但是不夠準確。","另一個方法是鹽酸甜菜堿測試，具體操作方法見我的另一篇帖子“如何治療反酸燒心”的圖4-7，但我發現在我胃黏膜受損的時候吃也會燒心，所以個人認為這個方法也是僅供參考（如果你沒有胃炎或者潰瘍症狀的話，用這個方法應該會比較準確）。","最準確的應該是胃液分析（但醫院不一定給做），胃泌素檢測，血清抗胃壁細胞抗體。至於圖3提及的24h動態胃酸檢測，有uu反饋是測是否食管反流不是測胃酸多少，我查了一下，確實都是測反流的，但是也有說可以測胃酸的（見圖5）。","具體以醫生建議為準。"]},{"title":"我是如何治療反酸燒心的","date":"2024/9/29","tags":["膽汁反流性胃炎","反酸","燒心"],"body":["首先聲明！我是膽汁反流性胃炎，但不是幽門螺桿菌感染，如果你是感染的話可能還要結合其他辦法殺滅幽門螺桿菌。（我看到有書說可以用蒲公英，蒲公英本來就是清熱解毒的，但這種苦的東西一般都對胃刺激很大，所以僅供參考哈）","自從急性腸胃炎一個月都沒治療，拖成慢性腸胃炎後，我每天都會反流燒心。中藥西藥吃遍了，最後是靠針灸+自己用點穴筆按摩穴位+益生菌壓制住這個症狀的。不吃刺激性的東西就不會再燒心。（反流性胃炎是括約肌功能失調，個人感覺針灸對於肌肉神經功能的治療是很有效的，一般面癱都只能靠針灸治好）","但是實際上我的胃粘膜還是處於受損狀態，一旦受刺激就會燒心。","看了《免疫功能90天復原方案》之後發現自己其實是胃酸不足，（可以搜我的另一篇帖子“抑酸藥副作用非常大”）","於是打算按書裡的建議來做。（見圖4-7）但是在嘗試服用鹽酸甜菜堿時發現我還是會燒心，也就是說我的胃粘膜還是受損的。這個我當時沒有治療思路，就沒管了。後來服用了三個月的穀氨酰胺（一種氨基酸），本來是為了治療腸漏症，修復腸粘膜的，結果意外地發現修復不少了胃粘膜（表現為喝粥不反酸了），於是我現在開始服用鹽酸甜菜堿，也因此可以正常吃魚了。","圖3是其他建議補劑，我沒吃過，僅供參考。","🔥總結：針灸/穴位治療，服用益生菌、穀氨酰胺（至少三個月）和鹽酸甜菜堿。（可能有效:肌肽鋅、去甘草酸、滑榆、蘆薈提取物,可以參考我在左下角選的now的這款，我個人吃了感覺有一定修復效果）","益生菌我選的是舒伯特的，它還有維生素U，也是保護胃粘膜的，可供參考，而且它包含緩解腹脹的五種菌種，能在一定程度上緩解，但是如果要根治有害菌引發的腹脹可能得按腸道修復的5R療法循序漸進。","穀氨酰胺的服用指南可以用“穀氨酰胺”搜我發的另一篇帖子，功能醫學一般推薦賽摩根這個牌子，品質最有保障。","最後的最後，提醒大家一切以自己的感受為準，不舒服就別繼續了，舒服的話說明有效，可以繼續。"]},{"title":"抑酸藥副作用非常大！！","date":"2024/11/12","tags":["膽汁反流性胃炎","奧美拉唑","艾普拉唑","艾普拉唑腸溶片","抑酸藥","反酸","燒心"],"body":["我21年胃鏡檢測出膽汁反流性胃炎，臨床症狀表現為反酸/流+燒心，且出現得非常頻繁。廣州某三甲醫院消化內科主任前後給我開了四次艾普拉唑，我吃了三個月。自此，我的消化道隱患被埋下，並在22年爆發。","事實上，反酸燒心既有可能是胃酸過多，也有可能是胃酸過少（見圖），而且事實上後者的發生概率更大。另一個原因是胃黏膜受損，胃酸刺激到黏膜下的細胞組織（這一點我也看到有很多論文提及）","如何判定自己是否胃酸不足可以參考圖6，以及我的帖子“如何判定胃酸過多/過少”。","胃酸有很多作用，服用抑酸藥會破壞平衡，帶來很多的壞處，包括：","1.不利於保持小腸菌群平衡和有益菌生長（有害菌和酵母菌相比有益菌對酸的耐受性較差，胃酸減少導致有害菌增長而有益菌減少）","2.不利於許多維生素和礦物質的吸收，包括：維生素B12（B12的缺乏會使制造紅細胞、供氧的能力受損，讓人覺得累；紅細胞缺乏又叫貧血）、鈣、鎂（此二者的缺乏會引發骨質疏鬆症）、鋅（影響免疫系統，影響腸道健康）","3.胃蛋白酶不被激活，不利於蛋白質的消化和分解。進而導致人體氨基酸匱乏，新的免疫細胞難以生成，免疫系統受損。","4.十二指腸裡的胰酶（只有在酸性環境中才能正常工作）無法正常工作，導致未被完全消化的食物顆粒進入腸道，引發腸漏症，進而導致食物敏感（原來能吃的東西現在不能吃了）和免疫問題（慢性炎症、全身性亞健康）。","事實上，上面的這些問題我在22、23年幾乎全中。首先是慢性腹瀉一年，腸道菌群失調，大量有害菌增殖，大量釋放毒素等有害物質，加劇腸漏症，腸漏導致了一系列的問題：","1.非常容易饑餓（與甲狀腺激素失調有關）。","2.阻礙了維生素B族尤其是B12的吸收，導致我極其容易疲憊。","3.阻礙胰酶工作和膽汁分泌，導致我對大量食物過敏，包括魚肉蛋奶豆通通無法消化，如果食用就會嚴重脹氣+腹瀉，我因此廋了12斤。","4.毒素通過血液循環進入全身，導致我出現全身性亞健康症狀，包括極其容易疲勞、手腳抽搐麻木、心臟痛、失眠……","5.體內有害物質過多，耗盡了我的穀胱甘肽（負責解毒的三種氨基酸結合物），負責解毒的肝臟也精疲力盡，肝臟不好影響膽汁分泌和脂肪消化，進一步加劇消瘦和疲憊。","所以！！！請千萬不要隨便吃抑酸藥！！！！會導致可怕的熵增233333","如果有反酸燒心患者看到這篇帖子，可以用“燒心”搜我的另一篇帖子。"]},{"title":"為什麼會膽汁分泌不足","date":"2024/6/17","tags":["消化不良","腹脹","膽汁"],"body":["1.心情不好/肝鬱氣滯","2.腸漏症/腸壁受損","3.腸道菌群失調（有害菌過多釋放大量內毒素，有益菌不足無法回收膽汁酸）","其他:膽囊問題等","解決方案看我的帖子“肝鬱氣滯會導致膽汁分泌不足”"]},{"title":"肝鬱氣滯會導致膽汁分泌不足","date":"2024/6/18","tags":["消化不好","腹脹","肝鬱氣滯","肝氣不疏","膽汁"],"body":["本文已修正。前者是原因後者是結果。至於為什麼會肝鬱氣滯，感覺確實沒法用西醫解釋，因為中醫“氣”的概念沒法對應到具體的物質。如果用中醫的觀點，那大概和心情以及熬夜這些有關。要治療的話，可能還得靠中藥。本文主要講膽汁分泌不足。","1.症狀: 吃完肉很快上腹部脹氣，堵在胸口，肚子脹，頭暈（吃消化酶也沒用）","2.解決方案:1⃣️拍肝經膽經促進膽汁分泌，這時候會大量打嗝，打完了肚子也沒那麼脹了。2⃣️補充膽汁（比如熊去氧膽酸，牛膽汁），補充促進膽汁分泌的成分如牛磺酸，蒲公英，姜黃素，朝鮮薊。","3.原理:脂肪需要經過膽汁乳化才能被消化酶更好地消化。","ps.文獻來源:","圖2《黃帝內經現代釋用手冊》","圖3-5《免疫功能90天復原方案》","圖6-8曾強《功能醫學概論》"]},{"title":"精力充沛的每一天都很快樂","date":"2024/3/27","tags":[],"body":["天天吃素都快樂😆","前兩天磁暴累的不行","今天有精神了，賊開心","要求真的很低","天道爸爸賜我點兒精氣神吧"]},{"title":"風起萬家福","date":"2023/12/27","tags":["廣州","福","美景","書法"],"body":["風一吹燈火一亮意境就來了🥺🥺"]}];

p:'這篇是作者文章的「地圖」。肚子脹、拉肚子、胃酸逆流、消化不好時，先檢查三個「消化幫手」：\n・胃酸：像切菜的大刀，先把肉切開。\n・膽汁：像洗碗精，把油打散。\n・胰酶：像小剪刀，把食物剪得更細。\n哪個不夠就補哪個。接著看腸道裡是不是「壞菌比好菌多」。修腸道可用5R方法，但「殺菌」有風險，最好請醫生帶著做。想知道得最準，可以做腸道菌檢測。',

f:[['處理順序','自測>判斷缺哪個幫手>補對的幫手>調整菌群(5R)>仍無效做檢測']],

{c:'心臟與能量',k:'熬夜壓力→自由基、腸漏、鎂鉀流失→心臟不適；修腸、排毒、補能量、抗氧化。',
p:'作者常熬夜、壓力大，心臟偶爾會痛。原因可以這樣想：\n1. 熬夜會產生很多「讓身體生鏽的分子」（自由基），把心臟細胞弄傷。\n2. 腸子變得有小洞（腸漏），壞菌的毒素跑進血液，全身都在發炎。\n3. 壓力讓「腎上腺」這個抗壓器官累壞了。\n4. 鎂和鉀是「讓心跳穩定」的礦物質，壓力大時會被用光。\n5. 細胞裡的「發電廠」（粒線體）沒電了。\n作者的解法：修腸道、幫肝臟排毒、補充發電廠需要的營養，再加上抗氧化。心悸時可以做4-7-8呼吸，平常要23點前睡覺。',
m:'心臟不舒服#原因:熬夜自由基|腸漏毒素入血|壓力腎上腺疲勞|鎂鉀流失|粒線體沒電#急救:4-7-8呼吸|椰子水電解質|甘胺酸鎂#營養:鎂400mg|輔酶Q10|Omega-3|B群#生活:23點前睡|睡前不看藍光|溫和運動#檢測:有機酸|腸道菌群',
f:[['問題路線','熬夜/壓力>自由基＋腸漏＋礦物質流失>心肌發炎、沒能量>心悸心痛'],['改善路線','4-7-8呼吸急救>補鎂、Q10、魚油、B群>修腸排毒>固定作息']],
g:[['甘胺酸鎂','鎂像心臟的「鎮定劑」，讓心肌細胞穩定放電，心跳比較平穩'],['輔酶Q10','細胞發電廠的燃料，幫心臟產生能量，也能抗氧化'],['Omega-3魚油','幫身體「降火」抗發炎，維持正常心律'],['B群','把食物變成能量的小幫手，熬夜族消耗特別快'],['電解質飲（鎂、鉀）','快速補回壓力和熬夜流失的礦物質']]},

{c:'甲狀腺免疫',k:'橋本要照順序修：腸道→肝臟→腎上腺→甲狀腺，並嚴格忌口。',
p:'橋本甲狀腺炎是一種「身體的保全認錯人，跑去攻擊自己的甲狀腺」的病。\n作者發現自己的源頭是吃麩質（麵粉裡的蛋白質）造成腸漏。她照順序修：先修腸道→再幫肝臟排毒→再修腎上腺→最後修甲狀腺。就像蓋房子要先打地基，順序不能顛倒。\n她覺得最有效的是「全身性酶」，像清道夫一樣清掉身體裡的過敏碎片，讓抗體下降。另外補鋅、維生素D、硒＋維生素E、鎂，並嚴格不吃麩質、牛奶、蛋、黃豆等會讓她起反應的食物。',
m:'橋本逆轉#根源:麩質→腸漏→免疫亂打#順序:腸道→肝臟→腎上腺→甲狀腺#降抗體:全身性酶|硒＋維生素E|鋅|維生素D3#抗氧化:維C|維E|薑黃素|穀胱甘肽#忌口:麩質|牛奶|蛋|大豆|堅果|高碘#飲食:豌豆醬油|橄欖油、椰子油|米飯',
f:[['修復順序','修腸道(7個月)>肝臟排毒(醫師指導)>修腎上腺>修甲狀腺'],['全程搭配','忌口反應性食物>全身性酶降抗體>補硒鋅D>抗氧化']],
g:[['全身性酶（蛋白水解酶）','像清道夫，把血液中的過敏碎片、免疫複合物分解掉'],['硒＋維生素E','兩個好朋友互相幫忙，保護甲狀腺不被氧化'],['維生素D3','讓免疫系統冷靜，不亂打自己人'],['鋅','製造甲狀腺激素和修補腸道都需要的小零件'],['豌豆蛋白粉','不含麩質、乳、蛋的蛋白質來源，忌口期也能補蛋白']]},

{c:'入門導覽',k:'功能醫學像偵探：不只止痛，而是找出「為什麼」並修復功能。',
p:'一般看病常常是「哪裡痛就止哪裡」。功能醫學比較像偵探，要找出「為什麼會痛」。\n它會看你的飲食、睡眠、壓力、基因和生活環境，把身體當成一整台機器來檢查。它認為很多慢性病是器官長期「沒有好好工作」造成的。\n身體有七大系統要平衡：腸胃、免疫發炎、排毒、荷爾蒙與神經、能量（粒線體）、血液循環、身體結構。方法是補營養、平衡代謝、排除毒素。',
m:'功能醫學#核心:治病因不只治症狀|以人為中心#看什麼:病史|飲食|壓力|基因|環境#七大失衡:腸胃|免疫發炎|排毒|荷爾蒙神經|粒線體能量|循環血脂|身體結構#方法:補營養|平衡代謝|排毒素#擅長:亞健康|慢性病',
f:[['功能醫學思路','收集生活史>找出失衡系統>找根本原因>個人化方案>恢復功能']],
g:[['綜合維生素礦物質','給七大系統的「基本零件包」'],['益生菌','照顧腸胃這個第一大系統'],['Omega-3魚油','幫全身降低發炎']]},

{c:'胃酸反流',k:'胃酸很重要，長期壓抑會引發一連串問題；作者靠麩醯胺酸改善逆流。',
p:'胃酸逆流時，很多人會吃「抑酸藥」把胃酸壓下來。但作者說胃酸其實是好幫手：它能殺壞菌、幫忙吸收維生素B12和礦物質、啟動蛋白質消化。\n長期把胃酸壓住，反而可能讓腸道細菌亂掉、肚子脹、很容易累、對食物過敏。\n作者吃了兩個月「麩醯胺酸」（修補腸胃黏膜的營養）後，逆流幾乎不見了。睡覺用「斜坡枕」墊高上半身，也能防止半夜逆流。',
m:'胃食道逆流#抑酸藥風險:菌群失調|B12吸收差→疲勞|食物敏感|全身發炎#作者解法:麩醯胺酸2個月|膠原蛋白#生活:反流斜坡枕|睡前不吃東西#延伸:功能醫學反流文件',
f:[['問題路線','逆流>長期抑酸>胃酸不足>菌群亂、吸收差>疲勞發炎'],['改善路線','修黏膜(麩醯胺酸)>斜坡枕>找出根本原因']],
g:[['麩醯胺酸 L-Glutamine','腸胃黏膜細胞最愛的食物，幫忙把破皮補起來'],['膠原蛋白胜肽','提供修補黏膜的原料'],['反流斜坡枕','讓上半身墊高，胃酸不容易往上跑']]},

{c:'腸道菌群',k:'腸道菌檢測＝幫細菌點名，要選16S技術才準。',
p:'腸道裡住著很多細菌，有好有壞。做腸道菌檢測就像「點名」，能知道好菌、壞菌各有多少，還能看腸道抗發炎、免疫和代謝能力。\n作者檢測後發現：壞菌多是因為「消化不良」，補了消化酶後，困擾很久的腹脹就改善了。\n要選用「16S技術」的檢測才比較準；想查黴菌和寄生蟲，要用18S或宏基因組。長期舌苔又厚又白，建議查黴菌。',
m:'腸道菌群檢測#能看到:好菌壞菌種類數量|抗發炎力|免疫力|代謝力#技術:16S查細菌|18S/宏基因組查黴菌寄生蟲#作者收穫:腹脹主因＝消化不良|補消化酶後改善#挑選:千元以下多非16S|看技術來源',
f:[['檢測流程','自測疑似失調>做16S檢測>專業解讀>找出原因>對症調整']],
g:[['腸道菌群檢測套組','幫肚子裡的細菌點名，找出真正原因'],['全譜消化酶','食物消化完全，壞菌就沒有剩飯可以吃'],['多菌株益生菌','補充報告上缺少的好菌']]},

{c:'營養素',k:'維生素D要先驗血，再依數值補到理想範圍。',
p:'這篇原文主要是書上的圖表，講維生素D的「最佳數值」和「該補多少」。\n維生素D是「陽光維他命」，主要靠曬太陽製造。它幫骨頭吸收鈣，也讓免疫系統不亂發脾氣。很多人抽血會發現不夠。\n建議先驗血，依照數值決定補充量，補一段時間再驗一次，不要亂補太多。',
m:'維生素D#作用:骨骼吸收鈣|調節免疫|穩定情緒#來源:曬太陽|魚類蛋黃|補充劑#怎麼補:先驗血|依數值調劑量|搭配K2#注意:脂溶性|不要過量',
f:[['補充流程','驗血>對照最佳範圍>決定劑量>補充＋曬太陽>定期複驗']],
g:[['維生素D3＋K2','D3幫忙吸收鈣，K2把鈣帶到骨頭，不亂跑到血管'],['Omega-3魚油','油脂幫助D3吸收，也一起抗發炎']]},

{c:'甲狀腺免疫',k:'看甲狀腺要看TSH、FT4、FT3和抗體，功能醫學的標準更嚴格。',
p:'甲狀腺像身體的「暖氣和油門」，管體溫、精神和代謝。\n抽血會看到幾個數字：TSH是大腦催甲狀腺工作的訊號；FT4是庫存的激素；FT3是真正上工的激素；抗體高代表免疫在攻擊甲狀腺（例如橋本）。\n功能醫學看的範圍比醫院的「正常值」更嚴格，希望在「還沒生病但已經不太好」時就發現。',
m:'甲狀腺指標#TSH:大腦催促訊號|偏高＝甲狀腺偷懶#FT4:庫存激素#FT3:真正上工的激素#抗體:TPOAb|TgAb|偏高＝自體免疫#功能醫學:範圍更嚴格|早期發現',
f:[['判讀順序','看TSH>看FT4>看FT3轉換>看抗體>對照理想值']],
g:[['硒','幫T4轉換成能用的T3，也保護甲狀腺'],['鋅','製造甲狀腺激素的必要零件'],['維生素D3','幫免疫系統穩定']]},

{c:'食物敏感',k:'慢性食物敏感來自腸漏＋IgG抗體；暫停食物、修腸、補消化。',
p:'有些人吃了某些食物不會馬上過敏，但幾小時或幾天後出現濕疹、鼻炎、關節痛、肚子不舒服，這叫「慢性食物敏感」。\n原因是腸子有小洞（腸漏），沒消化完的食物大碎片跑進血液，免疫系統以為是壞人，就做出「IgG抗體」一直攻擊。\n解法：找出讓你不舒服的食物先暫停、修補腸道、改善消化、平衡腸道細菌。',
m:'慢性食物敏感#症狀:濕疹|鼻炎|關節痛|腹脹#機制:腸漏→大分子入血→IgG抗體#解法:檢測找食物|暫停＋輪替|修腸漏|補消化酶|益生菌',
f:[['問題路線','腸漏>食物碎片進血液>免疫產生IgG>每次吃就發炎'],['改善路線','暫停食物>修補腸道>補消化酶>重新引入']],
g:[['全譜消化酶','把食物剪得夠小，免疫系統就不會誤認'],['麩醯胺酸','幫腸壁把小洞補起來'],['益生菌','訓練免疫系統冷靜、不過度反應']]},

{c:'消化酶',k:'消化酶依自己的飲食來挑，盡量選全譜。',
p:'消化酶像「剪刀」，把大塊食物剪成身體吸收得了的小塊。\n誰需要？消化不良（脹氣、便便有沒消化的食物）、腸漏或菌群失調的人、年紀大的人。\n怎麼挑？看自己吃什麼：\n・蔬果多 → 纖維酶\n・魚肉多 → 脂肪酶、蛋白酶\n・豆類多 → α-半乳糖苷酶\n・澱粉多 → 澱粉酶、麥芽糖酶\n・奶製品多 → 乳糖酶\n・麵食多 → DPP-IV\n作者覺得Now Foods最划算。',
m:'選消化酶#誰需要:消化不良|腸漏、菌群失調|年長者#依飲食:蔬果→纖維素酶|魚肉→脂肪酶、蛋白酶|豆類→α-半乳糖苷酶|澱粉→澱粉酶|奶→乳糖酶|麩質→DPP-IV#原則:盡量全譜|看成分劑量|比CP值',
f:[['挑選流程','判斷胰酶不足>看自己吃什麼>對照需要的酶>選全譜>隨餐吃']],
g:[['全譜消化酶','一顆裡有很多把剪刀，什麼食物都能剪'],['麩質消化酶（DPP-IV）','外食不小心吃到麵筋時的救急剪刀'],['乳糖酶','分解牛奶裡的乳糖，減少脹氣']]},

{c:'腹脹經驗',k:'發炎會耗光營養；改吃高密度營養＋消炎，一週腹脹消失。',
p:'作者讀到一句話：「發炎會把營養用光，營養不夠又讓發炎更嚴重」，這是一個壞循環。\n所以她不再一直少吃，而是吃得「多樣又營養」：糙米、每天兩種水果和四種蔬菜、魚肉、膠原蛋白粉、鵪鶉蛋，再用消化酶幫忙消化。\n她也繼續吃益生菌、益生元，腹脹時吃薑黃素消炎，睡前吃全身性酶清掉食物殘渣。一週後，困擾兩年的腹脹完全消失，五年不敢吃的水果也能吃了！\n她提醒：壓力管理、睡眠、運動、曬太陽，是長久健康的保障。',
m:'腹脹消失②#關鍵領悟:發炎↔營養耗盡 惡性循環#高密度營養:糙米|2水果4蔬菜|魚肉豬蹄|膠原蛋白|鵪鶉蛋#消化支持:消化酶|複方消化酶#消炎抑菌:薑黃素|全身性酶#長期:壓力管理|睡眠|運動|曬太陽',
f:[['作者歷程','SCD飲食5週＋殺菌3天>益生菌、乳酸菌素>高密度營養(最重要)>薑黃素＋全身性酶>一週腹脹消失']],
g:[['薑黃素','天然的「滅火器」，降低發炎，也能抑制壞菌'],['全身性酶','睡前清掃腸道剩菜，不讓壞菌拿去發酵'],['膠原蛋白胜肽','好吸收的蛋白質，提供修補腸道的原料'],['全譜消化酶','讓吃進去的營養真的被吸收']]},

{c:'腹脹經驗',k:'少吃和殺菌只能短期；真正要解決的是營養不足與代謝變弱。',
p:'作者以前少吃米飯想「餓死壞菌」，醫生說這叫SCD飲食，但不能做太久，否則營養不夠、體重下降、腎上腺會累。\n她也用草本殺菌劑殺了三天菌，出現很難受的「好轉反應」（壞菌死掉時放出毒素）。同時補充對腹脹有幫助的乳酸菌，喝駝奶、吃益生元，讓乳酸菌長大。\n但腹脹還是沒好。後來她才明白：問題不是碳水，而是身體「營養不夠、代謝變弱」，要加強腸道對各種食物的耐受力，殺菌無法根治。',
m:'腹脹消失①#SCD飲食:限碳水餓壞菌|只能短期#殺菌:草本殺菌3天|赫氏消亡反應#補好菌:植物乳桿菌|嗜酸乳桿菌|比菲德氏菌35624#餵好菌:駝奶|低聚半乳糖#領悟:營養支持才是根本|殺菌無法根治',
f:[['作者歷程','限碳水(SCD)>草本殺菌>補乳酸菌>仍腹脹>轉向全面營養支持']],
g:[['乳酸菌益生菌','和壞菌搶地盤，減少脹氣'],['低聚半乳糖（GOS）益生元','好菌的專屬便當，讓乳酸菌長大'],['駝奶粉','比牛奶好消化的營養來源']]},

{c:'自測表',k:'抗氧化要團隊合作，最好的抗氧化是多樣化飲食。',
p:'身體裡會產生「讓身體生鏽的分子」（自由基），抗氧化劑就像防鏽劑。\n重點是：防鏽劑要「團隊合作」——維生素C、E、β-胡蘿蔔素、穀胱甘肽、花青素、硫辛酸、輔酶Q10一起才厲害。只吃一種效果不好，甚至可能有風險。\n所以最好的抗氧化方法是吃得多樣化、全面補營養。',

f:[['使用方式','做自測表>了解氧化壓力>多吃彩色蔬果>需要時補複方抗氧化']],

{c:'情緒身心',k:'憂鬱和壓力荷爾蒙、睡眠、慢性發炎都有關。',
p:'憂鬱症常常是壓力、失去重要的人、課業或感情挫折引起的。第一次通常是壓力很大造成；反覆發作後，大腦會越來越敏感，壓力不大也容易發作。\n身體上會看到壓力荷爾蒙（皮質醇）太多、深度睡眠變少。\n功能醫學還發現「發炎」是重要推手：憂鬱的人身體發炎指數常偏高，症狀改善後發炎也會下降。\n※ 有憂鬱情況請一定尋求專業醫師協助。',
m:'憂鬱症(功能醫學)#誘因:重大壓力|失落|遺傳脆弱#身體變化:皮質醇過多|深睡變少|神經可塑性受損#關鍵:慢性發炎#方向:降發炎|顧睡眠|顧腸腦軸|專業協助',
f:[['形成路線','壓力事件>皮質醇失衡＋發炎>大腦功能受影響>憂鬱>反覆後更敏感']],
g:[['Omega-3魚油（高EPA）','幫大腦降低發炎，維持情緒穩定'],['甘胺酸鎂','幫神經放鬆、比較好入睡'],['益生菌','腸道好菌透過「腸腦軸」影響大腦的快樂物質']]},

{c:'自測表',k:'SIBO＝細菌跑錯地方住進小腸；自測後可參考5R療法。',

m:'SIBO#是什麼:細菌跑錯地方住小腸#症狀:飯後脹氣|打嗝放屁|腹瀉或便秘#怎麼辦:自測表|5R療法|找醫生|菌群檢測',
f:[['5R療法','移除(Remove)>補充(Replace)>再植入(Reinoculate)>修復(Repair)>平衡(Rebalance)']],

{c:'肝臟排毒',k:'毒素會讓身體發炎；順序是修腸道→肝排毒→重金屬螯合。',
p:'功能醫學認為毒素（像重金屬、農藥）會讓身體發炎、生慢性病。這篇是一張對照表：哪些症狀可能和毒素有關。\n懷疑有重金屬可以做頭髮檢測，在醫生指導下治療。順序很重要：先修腸道，再做肝臟排毒，最後才是重金屬螯合。療程很長，要有耐心。',
m:'毒素#來源:重金屬|農藥|環境污染#影響:發炎|慢性病|亞健康#檢測:頭髮毒性元素#順序:修腸道→肝臟排毒→重金屬螯合',
f:[['處理順序','對照症狀>頭髮檢測>修腸道>肝臟排毒>重金屬螯合(醫師指導)']],
g:[['NAC（N-乙醯半胱胺酸）','幫身體製造穀胱甘肽這個排毒大將'],['十字花科萃取（蘿蔔硫素）','幫忙打開肝臟的排毒開關'],['水溶性膳食纖維','像垃圾袋，把毒素帶著跟便便一起排出']]},

{c:'情緒身心',k:'用肚子出力大笑，打嗝排氣、心情變好，是最簡單的消氣法。',
p:'「肝鬱氣滯」是中醫說法，簡單說就是：心情悶、肚子脹、氣卡住不動。\n作者試過敲經絡、艾灸、泡腳都不太有用。有一天半夜脹到睡不著，她試著「用肚子出力大笑」半小時，結果打了上百個嗝，肚子就消下去了！\n大笑像在幫肚子按摩，又能讓心情變好，就算假笑也有效，而且隨時隨地、完全免費。',
m:'大笑治氣滯#肝鬱氣滯:心情悶|氣不轉|消化停住#試過:敲肝膽經|艾灸|按穴位|逍遙丸#新方法:腹部出力大笑|假笑也有效#效果:打嗝排氣|心情變好|免費隨時',
f:[['作者方法','心情不好>氣滯腹脹>腹部出力大笑30分鐘>打嗝排氣>消脹＋心情變好']],
g:[['洋甘菊／薄荷花草茶','幫助放鬆，舒緩飯後脹氣感'],['甘胺酸鎂','讓緊繃的神經和肌肉放鬆']]},

{c:'肝臟排毒',k:'照顧肝臟前先修好腸道；肝排毒需要足夠的蛋白質。',
p:'肝臟是身體的「垃圾處理廠」。這篇是檢查肝臟好不好的表。\n作者提醒：開始照顧肝臟前，一定要先修好腸道，不然腸漏會一直送垃圾進來，肝臟永遠清不完。\n肝臟排毒的第二階段需要很多蛋白質（胺基酸）；不吃肉魚蛋的人，要注意補B群、鐵和豌豆蛋白。',
m:'肝臟評估#肝臟角色:垃圾處理廠#前提:先修腸道|堵住腸漏毒素#排毒二期:需要蛋白質、胺基酸#素食注意:B群|鐵|豌豆蛋白#參考:橋本90天|免疫90天|肝臟排毒飲食',
f:[['照顧順序','做自測>先修腸道>補足蛋白質>肝臟支持飲食>做足功課再調整']],
g:[['豌豆蛋白粉','提供肝臟排毒第二階段需要的胺基酸'],['B群','肝臟排毒流程中不可少的小幫手'],['朝鮮薊／水飛薊萃取','傳統上用來保養肝臟、幫助膽汁分泌']]},

{c:'胃酸反流',k:'用評估表判斷胃酸夠不夠；不足可飯前補甜菜鹼鹽酸鹽。',

m:'胃酸評估#自測表:張玉珠醫師提供#胃酸低徵兆:吃肉脹|消化慢#補充:甜菜鹼鹽酸鹽|飯前吃#注意:胃炎潰瘍者慎用',

g:[['甜菜鹼鹽酸鹽（Betaine HCl）','補回胃裡的「酸性大刀」，幫忙消化蛋白質'],['胃蛋白酶','搭配胃酸一起分解肉類']]},

{c:'腹脹經驗',k:'小腸刷狀緣受損，澱粉剪不開就變成壞菌的午餐。',
p:'作者查資料發現：米飯、麵這些澱粉，需要小腸表面的「刷狀緣酶」剪成小糖才能吸收。\n可是SIBO或菌群失調的人，小腸表面已經被弄壞了，澱粉剪不開，就變成壞菌的午餐，所以一直脹氣。\n她現在的飲食：暫停牛奶、含麩質穀物、蛋、水果、堅果、高纖蔬菜等；蛋白質用豌豆蛋白，油用牛油果、椰子油和橄欖油，碳水用甜菜根和蔬菜。腸道好了再慢慢加回食物。',
m:'米飯致脹②#原理:澱粉需刷狀緣酶|SIBO破壞刷狀緣|澱粉變壞菌午餐#暫停:牛奶|麩質穀物|蛋|水果|堅果|高纖蔬菜|茄科#替代:豌豆蛋白|牛油果、椰子油、橄欖油|甜菜根、十字花科、瓜類#延伸:參考橋本飲食法',
f:[['問題路線','吃澱粉>刷狀緣受損剪不開>壞菌發酵>脹氣、腸道更傷'],['改善路線','暫停澱粉>修腸道>慢慢加回']],
g:[['強化澱粉酶的消化酶','代替受傷的刷狀緣，把澱粉剪開'],['豌豆蛋白粉','低過敏、好消化的蛋白質'],['特級初榨橄欖油','優質油脂來源，幫助抗發炎']]},

{c:'腹脹經驗',k:'只吃蔬菜＋豌豆蛋白＋牛油果就不脹，元兇竟是米飯。',
p:'作者補了益生菌、消化酶、戒了麩質和水果，還是飯後脹氣，要走幾千步才舒服。\n後來做肝臟排毒的「蔬菜汁飲食」，只吃蔬菜、豌豆蛋白和牛油果，竟然完全不脹，舌苔變淡、舌頭邊的齒痕也幾乎不見了！原來元兇是米飯（澱粉）。\n她也提到：碳水化合物其實不是人體「必需」的營養素，蛋白質和脂肪才是。',
m:'米飯致脹①#已做:益生菌|消化酶|克菲爾水|戒麩質水果#仍脹:飯後要走路才舒服#發現:只吃蔬菜＋豌豆蛋白＋牛油果不脹#額外收穫:舌苔變淡|齒痕消失#觀念:碳水非必需營養素|食物過敏也是濕氣來源',
f:[['發現過程','各種方法仍脹>嘗試蔬菜汁飲食>不脹了>鎖定澱粉>深入查原理(見②)']],
g:[['綠色蔬菜粉','方便補充蔬菜營養，不增加澱粉負擔'],['豌豆蛋白粉','不脹氣的蛋白質來源'],['克菲爾水菌種','自製發酵飲，補充多種好菌']]},

{c:'腸漏修復',k:'修腸漏7招：防傷、舒緩、吸毒、除壞菌、補腸壁、種好菌、餵好菌。',
p:'腸壁像一面「篩網」，只讓小分子營養通過。腸漏就是篩網破洞了。修補有7招：\n1. 先停止傷害：少吃止痛藥、酒、咖啡、糖、麩質。\n2. 塗上「藥膏」舒緩：蘆薈、DGL甘草、榆樹皮。\n3. 吸走毒素：免疫球蛋白、短期活性炭、全身性酶。\n4. 清掉太多的壞菌：椰子油、乳香膠（殺菌劑要小心）。\n5. 直接補腸壁：麩醯胺酸、鋅肌肽。\n6. 種回好菌：益生菌、孢子菌。\n7. 餵好菌：益生元。\n另外也要照顧腸道神經。',
m:'腸漏7策略#1防傷:少止痛藥酒咖啡糖|避麩質乳製品|用消化酶#2舒緩:蘆薈|DGL甘草|榆樹皮|秋葵#3吸毒:免疫球蛋白|活性炭短期|全身性酶#4除壞菌:椰子油|乳香膠|鋅肌肽#5補腸壁:麩醯胺酸|鋅肌肽|多酚#6種好菌:益生菌|孢子菌|Akk菌#7餵好菌:益生元',
f:[['7步驟','防傷>舒緩>吸毒>除壞菌>補腸壁>種好菌>餵好菌']],
g:[['麩醯胺酸','腸壁細胞的主食，把篩網補起來'],['鋅肌肽','黏在破皮的地方，幫胃腸黏膜修復'],['DGL甘草咀嚼錠','在黏膜表面形成一層保護膜'],['益生菌＋益生元','種好菌又餵好菌，讓腸道生態恢復']]},

{c:'胃酸反流',k:'幽門桿菌主流用四聯療法；用抗生素時可搭配布拉氏酵母菌。',
p:'幽門螺旋桿菌是住在胃裡的壞菌，會讓胃發炎。\n主流治療是「四聯療法」，連續吃10～14天，成功率約80～90%，一家人最好一起檢查。\n作者擔心抗生素傷腸道，認為可以先試益生菌、乳香膠、DGL甘草等，沒效再用四聯療法；用抗生素時搭配「布拉氏酵母菌」，能減少腸道細菌被打亂。小孩和老人要和醫生評估。',
m:'幽門桿菌#主流:四聯療法10-14天|根除率80-90%|全家檢測#自然輔助:乳香膠|DGL甘草|布拉氏酵母菌|食療湯品#注意:抗生素傷腸道|小孩老人要評估|根除後復發率低#失敗時:找原因再治療',
f:[['處理流程','檢測陽性>和醫師討論>四聯療法＋布拉氏酵母菌>複檢確認']],
g:[['布拉氏酵母菌','不怕抗生素的「好酵母」，吃抗生素時保護腸道'],['乳香膠','傳統上用來照顧胃部'],['DGL甘草','幫胃黏膜形成保護層']]},

{c:'食物敏感',k:'短期補消化酶、長期修腸漏；用輪替飲食讓IgG抗體降下來。',
p:'吃完脹氣、拉肚子是「急性」不耐受；全身慢慢發炎是「慢性」不耐受。\n原因是食物沒消化完全，到大腸被壞菌吃掉，產生氣體和毒素，還讓身體做出IgG抗體。\n解法：短期補消化酶，長期修腸漏、補好菌。豆類用壓力鍋煮15分鐘，可以去掉大部分凝集素。\nIgG抗體大約23天會降很多，所以暫停過敏食物一段時間會改善。也可以做檢測，用「輪替飲食法」：輕度每四天吃一次，中度停三個月，重度停六個月。',
m:'食物不耐受#表現:急性脹痛腹瀉|慢性全身發炎#原因:消化不完全|腸漏|刷狀緣受損|IgG抗體#短期:消化酶|鳳梨酵素、木瓜酵素#長期:修腸漏|補好菌|孢子菌#烹調:壓力鍋15分去凝集素|高溫降植酸草酸#輪替:輕度4天1次|中度停3月|重度停6月',
f:[['解決流程','做檢測>分輕中重>排除或輪替>修腸漏>約23天抗體下降>慢慢加回']],
g:[['全譜消化酶','把食物剪小，減少過敏碎片'],['鳳梨酵素／木瓜酵素','天然的蛋白質剪刀'],['孢子型益生菌（凝結芽孢桿菌）','幫忙分解蛋白質，強化腸道'],['全身性酶','空腹吃，清除身體裡的發炎碎片']]},

{c:'情緒身心',k:'中醫的「正氣不足」，在作者身上就是「好菌不夠」。',
p:'作者發現中醫和西醫說的常常是同一件事。\n她殺菌後好菌變少，一點點風就肚子痛、拉肚子。中醫說這是「正氣不足」，在她身上其實就是「好菌不夠」。後來好菌補足，就不怕風了。\n營養的食物、規律作息、好心情，都是幫我們增加「正氣」的正能量。',
m:'中西醫互通#中醫:正氣、陽氣不足→怕風寒#西醫:好菌不足→抵抗力弱#作者經驗:殺菌後怕風|補菌後改善#正能量:營養食物|健康作息|好心情',
f:[['對照路線','殺菌>好菌變少>怕風腹瀉(正氣不足)>補足益生菌>不怕風(陽氣足)']],
g:[['多菌株益生菌','補回身體的「正氣部隊」'],['薑黃／薑茶飲','溫暖腸胃，幫助抗發炎']]},

{c:'腸道菌群',k:'益生元是好菌的食物，要搭配益生菌，從少量開始。',
p:'這篇原文主要是圖片，這裡用白話補充重點。\n益生元就是「好菌的食物」，例如菊糖、低聚果糖、低聚半乳糖、抗性澱粉。益生菌吃進去如果沒有食物，很快就會餓死，所以要搭配益生元一起吃。\n腸道很敏感或SIBO嚴重的人，剛開始吃益生元可能會脹氣，要從少量開始。',
m:'選益生元#是什麼:好菌的食物#種類:菊糖|低聚果糖FOS|低聚半乳糖GOS|抗性澱粉|PHGG水溶纖維#怎麼吃:搭配益生菌|從少量開始#注意:SIBO嚴重者易脹',
f:[['挑選流程','了解種類>選溫和型(GOS／PHGG)>少量開始>搭配益生菌>慢慢加量']],
g:[['低聚半乳糖（GOS）益生元','特別餵養比菲德氏菌和乳酸菌'],['PHGG水溶性纖維','溫和不易脹氣，幫助排便順暢']]},

{c:'腸道菌群',k:'選益生菌：多菌種、有菌株編號、耐胃酸，並搭配益生元。',
p:'選益生菌有6個重點：\n1. 種類越多越好（VSL#3有8種菌，研究很多）。\n2. 選有「菌株編號」的，代表有研究根據。\n3. 每個人適合的不同，要試試看。\n4. 孢子型益生菌（來自土壤）也很重要。\n5. 選耐胃酸的包埋技術，讓好菌活著到腸道。\n6. 依自己的症狀選菌株。\n注意：腸道很亂時，好菌不容易住下來；一定要搭配益生元，不然好菌會餓死。',
m:'選益生菌#6原則:多菌種|有菌株編號|因人而異|加孢子菌|耐酸包埋|依症狀選#注意:失調嚴重難定植|要配益生元#參考:VSL＃3',
f:[['挑選流程','看症狀>選有編號的多菌種>確認耐酸技術>搭配益生元>觀察2-4週']],
g:[['多菌株益生菌（有菌株編號）','好菌部隊越多樣，越能守住腸道'],['孢子型益生菌','有「盔甲」不怕胃酸'],['益生元','好菌的便當，讓好菌住得下來']]},

{c:'情緒身心',k:'很多病到最後，關鍵是「心」。',
p:'這是中醫羅大倫的一句話：治病治到最後，就是在治「心」。\n心情、壓力和想法都會影響身體。像緊張會肚子痛、生氣會吃不下、壓力大會失眠。照顧好心情，身體也會跟著變好。',
m:'治心#意思:心情影響身體#例子:緊張→胃痛|生氣→脹氣|壓力→失眠#做法:好好休息|和朋友聊天|運動曬太陽|大笑',
f:[['身心路線','壓力、情緒>腦腸軸影響>身體症狀>照顧心情>身體改善']],
g:[['甘胺酸鎂','幫神經放鬆，睡得比較好'],['GABA／茶胺酸','幫助放鬆、穩定情緒'],['洋甘菊茶','睡前一杯，讓心情慢下來']]},

{c:'腸道菌群',k:'草本殺菌劑要在醫師指導下用；挑劑型、護胃、別用太久。',
p:'草本殺菌劑是用植物成分（例如牛至油、小檗鹼）清掉壞菌的產品，最好在醫生指導下使用。\n挑選時注意：有些在胃裡就溶解，會刺激胃，可以倒進「腸溶空膠囊」再吃；脂質體的Biocidin比較溫和精準；消化油脂差的人可以選不含油的配方。\n作者吃一個多月後覺得消化變差，用太久也可能讓其他壞菌趁機長大，所以要小心。',
m:'草本殺菌劑#建議:醫師指導#挑選:胃溶還是腸溶|成分多寡|有無油脂|脂質體較溫和#小技巧:倒進腸溶空膠囊#風險:消化力下降|條件致病菌增長|好轉反應',
f:[['使用流程','確認需要>選劑型>腸溶膠囊護胃>短期使用>搭配消化酶與益生菌']],
g:[['腸溶空膠囊','讓粉末到腸子才打開，不刺激胃'],['孢子型益生菌','殺菌期間也能存活的好菌'],['全譜消化酶','殺菌後消化變弱時的好幫手']]},

{c:'食物敏感',k:'小麥性溫適合胃寒，但腸道受損的人麩質弊大於利。',
p:'中醫說小麥養胃，但作者吃了不舒服。原因有兩個：\n1. 現代小麥和古代很不一樣，麩質比較難消化，會讓腸漏更嚴重。\n2. 中醫看食物的「寒熱」：小麥性溫，適合胃寒的人。\n作者因為腸道已經受傷、又有自體免疫問題，所以決定不吃小麥。如果很愛吃，可以用老麵發酵24～48小時降解麩質，或外食時吃「麩質消化酶」救急。腸道健康的人吃麩質沒關係。',
m:'小麥養胃?#中醫:小麥性溫|適合胃寒#現代:品種改變|麩質難消化|加重腸漏#作者選擇:腸傷＋自體免疫→不吃小麥#替代:老麵長時間發酵|麩質消化酶救急|艾灸曬太陽暖胃#健康的人:可以吃',
f:[['判斷流程','胃寒想吃麵>評估腸道是否受損>受損就避開麩質>不得已時用麩質消化酶']],
g:[['麩質消化酶（DPP-IV）','偶爾吃到麵食時，幫忙剪開難消化的麩質'],['無麩質米麵','不吃小麥的人也有主食可以選']]},

{c:'腸漏修復',k:'修腸黏膜9幫手：骨頭湯、麩醯胺酸、鋅、NAC、魚油、D、消化酶、益生菌、全身性酶。',
p:'修補腸黏膜有9個好幫手：骨頭湯、麩醯胺酸、鋅、NAC、Omega-3、維生素D、消化酶、益生菌、全身性酶。\n可以想像在修牆壁：\n・骨頭湯和麩醯胺酸是「水泥」\n・鋅、維生素D、NAC是「工人」\n・Omega-3和全身性酶負責「滅火」\n・消化酶和益生菌是「守衛」',
m:'修腸黏膜#水泥:骨頭湯|麩醯胺酸#工人:鋅|維生素D|NAC#滅火:Omega-3|全身性酶#守衛:消化酶|益生菌',
f:[['修補流程','移除刺激>提供修補原料>降低發炎>補好菌>持續維持']],
g:[['麩醯胺酸','修補腸壁的主要原料'],['鋅','幫腸壁細胞長回來、把縫隙關緊'],['膠原蛋白／骨頭湯粉','提供修補黏膜的胺基酸'],['NAC','製造穀胱甘肽，保護腸道細胞']]},

{c:'腸漏修復',k:'修腸漏4步：移除→補消化酶→平衡菌群→修復腸壁。',
p:'修腸漏有4個步驟：\n1. 不吃會讓你過敏、起反應的食物。\n2. 補消化酶，把食物剪小。\n3. 平衡細菌：吃發酵食物和益生菌。\n4. 修補腸道（見「如何修復腸黏膜」）。\n就像整理房間：先不要再弄髒、再整理乾淨、請好鄰居住進來、最後把牆修好。',
m:'腸漏4步#1移除:過敏、反應性食物#2補充:消化酶#3平衡:發酵食物|益生菌#4修復:麩醯胺酸|鋅|骨頭湯',
f:[['4步驟','移除>補消化酶>平衡菌群>修復腸壁']],
g:[['全譜消化酶','把食物剪小，減輕腸道負擔'],['多菌株益生菌','請好鄰居住進腸道'],['麩醯胺酸','把腸壁的牆修好']]},

{c:'腸道菌群',k:'菌群失調4種樣子：好菌少、SIBO、免疫抑制型、發炎型。',
p:'腸道菌群失調有4種樣子：\n1. 好菌太少。\n2. 細菌跑到小腸太多（SIBO）。\n3. 免疫被壓制型：食物敏感、很容易累。\n4. 發炎型：肌肉關節痛、脹氣、自體免疫疾病。\n如果確認失調，可以做腸道菌檢測找出元兇。',
m:'菌群失調4型#好菌不足#SIBO:小腸細菌過度生長#免疫抑制型:食物敏感|疲倦#發炎型:肌肉關節痛|脹氣|自體免疫#下一步:菌群檢測',
f:[['處理流程','對照症狀>判斷類型>檢測找元兇>對症修復']],
g:[['多菌株益生菌','補足不夠的好菌'],['益生元','讓好菌吃飽、住得久'],['腸道菌群檢測','找出到底是哪種失調']]},

{c:'腸道菌群',k:'殺菌時要補足益生菌和消化酶，不然會怕冷、還是脹。',
p:'作者看過4位西醫，得到不同名字（腸躁症、功能性腹瀉…），但沒人說原因。\n吃草本殺菌劑後有好轉，但後來還是脹，因為還有「消化不良」沒解決。\n另一個錯誤是益生菌吃太少：改吃低劑量的益生菌片後，變得非常怕冷，一吹風就拉肚子；補足益生菌後就好了。\n殺菌時要和孢子菌分開吃、用吸附劑吸毒素，並補足消化酶。之後她用克菲爾水調菌，脹氣改善不少。',
m:'菌群失調治療②#誤區1:忽略消化不良#誤區2:益生菌劑量不足→極度怕冷#殺菌搭配:孢子菌分開吃|活性炭吸毒|補足消化酶#成果:慢性腹瀉、夜間腹脹消失#後續:克菲爾水調菌',
f:[['正確搭配','殺菌(專業指導)>足量益生菌>補足消化酶>檢測追蹤>克菲爾水維持']],
g:[['高劑量多菌株益生菌','殺菌期間補足好菌部隊，不讓身體變虛'],['孢子型益生菌','和殺菌劑錯開吃，幫忙重建菌群'],['全譜消化酶','避免消化不良再養出新壞菌'],['克菲爾菌種','自製發酵飲，溫和調整菌群']]},

{c:'腸道菌群',k:'菌群失調分三階段處理；殺菌最危險，要專業指導。',
p:'治療分三個階段：\n1. 避開敏感食物（尤其麩質和糖），多吃椰子油、發酵食物、纖維、益生菌、益生元。\n2. 吃草本殺菌劑＋益生菌＋益生元（最危險，要專業指導）。\n3. 還沒好就再檢查。\n殺菌時壞菌大量死掉會放出毒素，造成發抖、發麻（赫氏反應），作者用吸附劑緩解。她吃三天殺菌劑後，困擾一年的腹瀉和夜間腹脹就消失了。',
m:'菌群失調治療①#階段1:避麩質和糖|椰子油|發酵食物|纖維#階段2:草本殺菌＋益生菌＋益生元|最危險#階段3:再檢測評估#赫氏反應:壞菌死亡放毒|發抖發麻|吸附劑緩解#小技巧:腸溶膠囊護胃',
f:[['三階段','飲食調整>草本殺菌(專業指導)>處理好轉反應>評估檢測']],
g:[['椰子油（中鏈脂肪酸）','含月桂酸、辛酸，幫忙抑制壞菌'],['益生菌＋益生元','重建好菌並餵飽它們'],['腸溶空膠囊','保護胃不被刺激']]},

p:'這是判斷自己腸道細菌有沒有亂掉的檢查表。\n測出有問題，可以做腸道菌檢測，看清楚到底是哪些細菌出問題，再對症處理。',

m:'甲狀腺炎自測#常見:怕冷|疲倦|體重變化|脖子不適|情緒低落#下一步:抽血TSH、FT3、FT4|抗體#延伸:橋本逆轉經驗',

{c:'消化酶',k:'消化酶需要剛好的溫度（37°C）和酸鹼值才能好好工作。',
p:'消化酶工作需要「剛好的溫度」和「剛好的酸鹼」。\n溫度要像體溫37°C，所以肚子冷可能消化差，艾灸、熱敷有幫助。小腸需要偏鹼性，作者試過用腸溶膠囊裝小蘇打。\n後來檢測發現：有一段時間消化不良卻沒吃消化酶，讓沙門氏菌等壞菌長大，可能是脹氣原因之一。現在重點是修腸漏。',
m:'消化酶活性#溫度:37°C最佳|艾灸熱敷暖腹#酸鹼:小腸需偏鹼|碳酸氫鹽#作者實驗:小蘇打腸溶|Akk菌不適暫停#發現:沒吃消化酶→壞菌增生#重點:修腸漏',
f:[['發揮條件','保持溫暖>酸鹼合適>消化酶發揮>減少壞菌的食物']],
g:[['全譜消化酶','在對的環境下把食物剪小'],['熱敷墊／暖暖包','讓肚子保持溫暖，酶比較好工作']]},

{c:'消化酶',k:'選全譜、隨餐吃、看成分不看牌子；三種都缺選複方。',
p:'最好選「全譜」消化酶（能分解油、蛋白質、纖維），隨餐吃，可以用腸溶空膠囊分成小份。\n牌子不是重點，重點是成分和劑量。如果胃酸、膽汁、胰酶三個都缺，可以選複方的。\n作者吃過國內兩款覺得不夠強，換成更全譜的才改善。',
m:'補消化酶#選擇:全譜(脂肪、蛋白、纖維)|看成分劑量#吃法:隨餐|腸溶空膠囊分裝#三缺:胃酸＋膽汁＋胰酶複方#購買:選擇多、比價格',
f:[['補充流程','判斷缺什麼>選全譜或複方>隨餐吃>依感受調量']],
g:[['全譜消化酶','多種剪刀一次到位'],['含膽汁＋甜菜鹼的複方消化酶','胃酸、膽汁、胰酶三個幫手一起補']]},

{c:'消化酶',k:'消化酶不足8原因：腸道受損、SIBO、缺好菌、乳糜瀉、毒素、壓力、酒、缺B1。',
p:'消化酶不夠有8個原因：\n1. 腸漏、小腸絨毛受傷\n2. 小腸細菌過度生長（SIBO）\n3. 好菌不夠\n4. 麩質引起的乳糜瀉\n5. 毒素累積\n6. 壓力（大腦和腸子是連線的）\n7. 喝酒\n8. 缺維生素B1',
m:'消化酶不足#腸道受損:腸漏|絨毛受傷|SIBO|乳糜瀉#菌群:好菌不足#毒素:內毒素|農藥抗生素|未消化食物#生活:壓力|喝酒#營養:缺B1',
f:[['惡性循環','原因>酶不夠>消化不良>壞菌增加>腸道更受傷']],
g:[['全譜消化酶','先補上不夠的剪刀，打破惡性循環'],['B群（含B1）','身體製造消化酶需要的輔助零件'],['多菌株益生菌','好菌也會幫忙分解食物']]},

{c:'自測表',k:'一張表檢查膽汁、胃酸、胰酶和腸漏，找出哪個幫手出問題。',
p:'這張表一次檢查四件事：膽汁夠不夠、胃酸夠不夠、胰酶夠不夠、有沒有腸漏。\n找出是哪一個「消化幫手」出問題，就能補對東西，不用亂補。',

{c:'腹脹經驗',k:'脹氣有9大原因，看「什麼時候脹」就能猜出是誰。',

m:'脹氣9因#消化不良:胃酸|膽汁|胰酶|食物不耐受#細菌:SIBO|好菌不足|酵母菌|寄生蟲#飲食:高FODMAP|代糖#其他:壓力|乙醯膽鹼缺乏|肝鬱氣滯|甲狀腺低下',
f:[['看時間猜原因','吃肉後30分脹→胃酸>吃油後脹→膽汁>飯後2-4小時脹→胰酶>吃水果穀物下腹脹→細菌']],
g:[['全譜消化酶','針對消化不良型脹氣'],['多菌株益生菌','針對好菌不足型脹氣'],['薄荷油腸溶膠囊','放鬆腸道肌肉，幫氣體排出']]},

{c:'入門導覽',k:'消化系統是一條生產線，任何一站壞掉都會像「胃病」。',

m:'功能醫學入門#作者病史:急性腸胃炎|膽汁逆流胃炎|腸躁症|SIBO#轉機:認識腸漏|功能醫學#原則:多方參考|以檢測為準|不盲信|自己負責#提醒:查用量和副作用',

{c:'胃酸反流',k:'先修胃黏膜（麩醯胺酸），再補胃酸（甜菜鹼），燒心才真正改善。',
p:'作者是膽汁逆流性胃炎（不是幽門桿菌）。一開始靠針灸、按穴位和益生菌壓住症狀，但胃黏膜還是傷著。\n後來發現自己其實是胃酸不足，可是一吃甜菜鹼就燒心——因為黏膜還沒好。\n她吃了三個月麩醯胺酸，胃黏膜修好了，喝粥不反酸，才開始補甜菜鹼，也能吃魚了。\n總結：針灸穴位＋益生菌＋麩醯胺酸（至少3個月）＋甜菜鹼鹽酸鹽。不舒服就停。',

f:[['作者歷程','針灸壓症狀>發現胃酸不足>先修黏膜(麩醯胺酸)>再補胃酸(甜菜鹼)>恢復吃魚']],
g:[['麩醯胺酸','修補胃黏膜，讓胃不再一刺激就痛'],['鋅肌肽','黏附在胃壁上幫助修復'],['含維生素U的益生菌','維生素U幫忙保護胃黏膜'],['甜菜鹼鹽酸鹽','黏膜修好後補回胃酸，消化肉類']]},

{c:'胃酸反流',k:'抑酸藥壓住胃酸，會引發菌群失調、吸收差、腸漏等連鎖問題。',
p:'作者吃了三個月抑酸藥後，消化問題大爆發。\n胃酸的工作有：讓好菌壞菌平衡、幫忙吸收B12和鈣鎂鋅、啟動蛋白質消化、讓胰酶能工作。\n胃酸被壓住，就可能：菌群失調、容易累（B12不夠）、骨頭變差、食物過敏、全身發炎。\n她出現容易餓、很疲倦、對魚肉蛋奶豆都不耐受、瘦了12斤、手腳麻、心臟痛、失眠。所以不要隨便長期吃抑酸藥，要和醫生討論。',

function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function drawMM(d){
  const {c,bs}=parseMM(d.m),W=760,S=2,F='"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif';
  const cv=document.createElement('canvas'),ctx=cv.getContext('2d');ctx.font=`15px ${F}`;
  const lay=bs.map(b=>wrapChips(ctx,b.l,W-24,160));
  const H=110+lay.reduce((s,r)=>s+Math.max(1,r.length)*38+14,0)+20;
  cv.width=W*S;cv.height=H*S;ctx.scale(S,S);
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#2f7d6d';rr(ctx,24,20,W-48,56,14);ctx.fill();
  ctx.fillStyle='#fff';ctx.font=`bold 22px ${F}`;ctx.textBaseline='middle';ctx.fillText('🧠 '+c,42,48);
  ctx.fillStyle='#888';ctx.font=`13px ${F}`;ctx.fillText(`${d.i+1}. ${d.title}`,26,94);
  let y=112;
  bs.forEach((b,j)=>{const col=PAL[j%7],rows=lay[j];
    ctx.font=`bold 15px ${F}`;ctx.fillStyle=col;rr(ctx,24,y,124,30,8);ctx.fill();
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(b.n,86,y+15,116);ctx.textAlign='left';
    ctx.font=`15px ${F}`;
    rows.forEach((r,ri)=>r.forEach(ch=>{const yy=y+ri*38;ctx.strokeStyle=col;ctx.lineWidth=1.5;rr(ctx,ch.x,yy,ch.w,30,15);ctx.stroke();ctx.fillStyle='#2b2a27';ctx.fillText(ch.t,ch.x+12,yy+15)}));
    y+=Math.max(1,rows.length)*38+14});
  return cv;
}
function drawFW(d){
  const W=560,S=2,F='"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif';
  const routes=d.f.map(([n,s])=>[n,s.split('>')]);
  const H=90+routes.reduce((s,[,st])=>s+40+st.length*48+(st.length-1)*22,0)+10;
  const cv=document.createElement('canvas'),ctx=cv.getContext('2d');cv.width=W*S;cv.height=H*S;ctx.scale(S,S);
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.textBaseline='middle';
  ctx.fillStyle='#2b2a27';ctx.font=`bold 20px ${F}`;ctx.fillText('🧩 '+d.title,24,40,W-48);
  let y=78;
  routes.forEach(([n,st])=>{
    ctx.fillStyle='#777';ctx.font=`bold 15px ${F}`;ctx.fillText('▍'+n,24,y+12);y+=40;
    st.forEach((x,j)=>{
      ctx.fillStyle='#e9f3f0';ctx.strokeStyle='#2f7d6d';ctx.lineWidth=1.5;rr(ctx,40,y,W-80,48,10);ctx.fill();ctx.stroke();
      ctx.fillStyle='#2f7d6d';ctx.beginPath();ctx.arc(64,y+24,12,0,7);ctx.fill();
      ctx.fillStyle='#fff';ctx.font=`bold 13px ${F}`;ctx.textAlign='center';ctx.fillText(j+1,64,y+25);ctx.textAlign='left';
      ctx.fillStyle='#2b2a27';ctx.font=`16px ${F}`;ctx.fillText(x,86,y+24,W-140);
      y+=48;if(j<st.length-1){ctx.fillStyle='#2f7d6d';ctx.font=`bold 16px ${F}`;ctx.textAlign='center';ctx.fillText('↓',W/2,y+11);ctx.textAlign='left';y+=22}
    });y+=10});
  return cv;
}
async function copyImg(cv,name){
  const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
  try{await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);toast('✅ 圖片已複製，到 LINE 按 Ctrl+V 貼上');return}catch(e){}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'.png';a.click();
  toast('📥 這個瀏覽器不能直接複製圖片，已改存成圖片檔，可在 LINE 傳送');
}
$('#detail').addEventListener('click',async e=>{
  const b=e.target.closest('[data-copy]');if(!b)return;const d=D[cur],k=b.dataset.copy;
  if(k==='mt'||k==='ft'){const ok=await copyText(k==='mt'?mmText(d):fwText(d));toast(ok?'✅ 文字已複製，到 LINE 貼上即可':'❌ 複製失敗，請再試一次')}
  else copyImg(k==='mi'?drawMM(d):drawFW(d),`${d.i+1}_${d.title}_${k==='mi'?'心智圖':'框架圖'}`);
});
function open(i){cur=i;document.body.classList.add('reading');renderList();renderDetail();if(innerWidth<=820)scrollTo(0,0);else $('#detail').scrollIntoView({block:'start'})}
$('#list').onclick=e=>{const it=e.target.closest('.item[data-i]');if(it)open(+it.dataset.i)};
$('#cats').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.c;renderCats();renderList()};
$('#q').oninput=()=>{renderList();const r=filtered();if(r.length&&!r.some(d=>d.i===cur)){cur=r[0].i}renderDetail()};
renderCats();renderList();renderDetail();
</script>
