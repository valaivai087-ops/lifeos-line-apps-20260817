'凌晨一點，她還在改孩子的作業。同一題錯了三次，她的聲音從溫柔變成嚴厲：「你是不是根本沒在聽？」孩子低頭不說話。她轉身關燈的那一刻，心裡也有另一個聲音在問：是孩子不夠努力，還是我一直用同一種方法，期待不同的結果？',
'我們有多少次，把「我以為」當成「事實」？有多少次，用昨天的答案，回答今天的問題？又有多少次，明明結果在提醒我們，我們卻選擇責怪結果？',
'人無法直接看見世界，只能看見自己對世界的模型。我們所相信的，不等於世界本身；我們所感覺的，也不等於真相的全部。',

1:{t:'你最相信的那句話，可能正在替你做所有決定',h:'信念如果不能更新，就會從導航變成牢籠。',p:[

'信念看來源——它來自研究，還是來自一次受傷？判斷看證據——它有事實支持，還是只有情緒撐腰？遇到反例要更新——它能被推翻，還是早已拒絕被檢查？',
'我們以為改變信念是軟弱，其實拒絕檢查信念才是。真正脆弱的人，必須永遠正確；真正強大的人，可以平靜地說：「我原本想錯了。」',
'先寫下你相信什麼，你就從被信念推著走，變成看著信念走；再寫下它從哪裡來，你就從理所當然，變成有跡可循；再列出反例，你就從單一答案，變成多種可能；最後設定可推翻條件，你就從固執，走向自由。',
'口訣「信、源、證、反、改」。今天寫一句：「我一直相信＿＿，目前證據是＿＿，可能的反例是＿＿。」只要一句，就是一次鬆綁。',
'有些話陪了我們很多年，像一件舊外套，穿久了就以為那是皮膚。今天，試著把它脫下來，對著光看一看——如果還合身，就再穿上；如果已經太緊，就溫柔地放下。你不是你相信的每一句話，你是那個有能力重新選擇相信什麼的人。']},
2:{t:'一次考差，不代表你不行；一次成功，也不代表你永遠會贏',h:'讓證據決定信念的重量，不讓情緒決定真相的方向。',p:[
'小安這次英文考了四十二分。媽媽看到成績單，第一句話是：「你是不是又退步了？」可是過去五次，他有四次都在六十分以上；這次的考卷，全班平均也掉了十五分。同一個四十二分，放在不同的背景裡，說的是完全不同的故事。',
'一個新消息，到底應該讓你改變多少？是全盤推翻，還是完全無視？如果一個檢測的準確率是九成，結果是陽性，你真的有九成機率生病嗎？',
'世界不會直接把答案交給我們，它只給線索。智慧不是擁有確定，而是知道在每一條線索之後，該把相信調整多少。',
'直覺說：「看到了，就是真的。」貝葉斯說：「看到了，要先問它本來有多常見。」直覺讓我們快，機率讓我們準。',
'先有估計，不讓自己從零開始；再看證據，不讓自己閉門造車；計算更新，不讓情緒代替推理；持續驗證，不讓一次結論變成永久判決。',
'先驗百分之四十，看到答對的證據，後驗變成約百分之六十六點七。學生的能力並沒有突然增加二十六點七分，改變的是我們對他的估計。原來，我們每天在更新的，從來不是世界，而是自己的理解。',
'第一步，你學會說「可能」，而不是「一定」；第二步，你學會問「基準率是多少」；第三步，你學會比較「如果不是這樣，這個證據還會出現嗎」；第四步，你發現自己吵架變少了，因為你不再急著證明，而是開始好奇。',
'口訣「先、證、似、後、驗」。今天練一題：先驗四成、正確辨識九成、假陽性三成，算算看後驗。算完你會發現，數學其實是一種溫柔——它讓你不輕易定罪任何人，包括自己。',
'相信，不是一扇只能開或關的門，而是一盞可以調亮調暗的燈。新的證據來了，就轉一點；反例出現了，再轉一點。願你不再在全黑與全亮之間掙扎，而是學會在剛剛好的光裡，看清眼前的路。']},
3:{t:'你看到的是一件事，真正發生的是一整張網',h:'成長不是把舊地圖畫得更漂亮，而是願意重新測量地形。',p:[
'老師在聯絡簿上寫：「孩子最近上課不專心。」爸爸回家就沒收了手機。一週後，孩子還是不專心。後來才知道，孩子每天十二點才睡，因為晚上要幫忙照顧生病的奶奶。手機只是被看見的那個點，睡眠、家庭與壓力，才是看不見的那張網。',
'你解決問題時，是在拔一棵草，還是在看整片土壤？為什麼同樣的問題，總是一再回來？會不會，我們一直在處理結果，卻從來沒有碰到原因？',
'事件是浮在水面上的冰山一角，結構才是水面下的整座冰山。看不見結構的人，只能一次又一次撞上同一座冰山。',
'單線思考問：「是誰造成的？」系統思考問：「是什麼關係讓它持續發生？」單線思考給你一個代罪羔羊，系統思考給你一個改變的槓桿。',
'找節點，看見誰在場；連關係，看見誰影響誰；估權重，看見什麼最重要；定邊界，看見模型在哪裡失效；看變化，看見今天的答案明天可能不再成立。',
'我們以為「一起出現」就是「造成」。吃早餐的孩子成績比較好，不一定是早餐的功勞，也許是規律作息、家庭陪伴，或者睡得更早。真正的洞察，常常藏在那個我們沒有畫出來的節點裡。',
'畫出一個點，你看見問題；畫出五個點，你看見可能；連起四條線，你看見關係；找到一條回饋迴路，你看見問題為什麼會自我增強；寫下失效條件，你看見自己的謙卑。',
'口訣「點、線、權、界、變」。今天拿出一張紙，為一個困擾你的問題畫五個節點，至少連四條線。你會驚訝地發現：原來讓你焦慮的，不是問題太大，而是它一直沒有形狀。',
'世界不一定變得更混亂，也可能只是舊模型已經無法解釋新現實。當你願意蹲下來，重新看見每一個節點、每一條連線，混亂就會慢慢露出秩序。不是世界變簡單了，是你的眼睛，終於學會了看網。']},
4:{t:'越覺得自己絕對正確的時候，越該停下來',h:'成熟不是沒有偏見，而是建立能辨認偏見的機制。',p:[
'她轉傳了一篇文章：「某種水果可以逆轉疾病。」朋友在底下留言：「研究來源在哪裡？」她覺得被冒犯，回了一句：「我親戚吃了就有效啊！」那一刻，她捍衛的已經不是那篇文章，而是自己不能錯的感覺。',
'你上一次主動搜尋「反對自己看法」的資料，是什麼時候？你看的新聞、追蹤的人、滑到的影片，有多少是在挑戰你，又有多少只是在附和你？',
'大腦不是為了真相而生，而是為了生存而生。它擅長走捷徑，卻不保證捷徑通往正確的地方。',
'偏誤不是笨，而是聰明的大腦，在錯的情境裡用了對的捷徑。承認偏誤不是自卑，而是比偏誤多走了一步。',
'只看支持自己的，叫確認偏誤；只看成功的人，叫倖存者偏差；只因投入太多而不肯停，叫沉沒成本；只記得最近發生的，叫可得性捷思。它們不是別人的病，它們是每個人的日常。',
'我們總以為偏誤藏在「別人」身上。其實最危險的偏誤，往往戴著「我很理性」的面具。當你說「我是看事實的人」時，正是最該問自己：哪些事實，我選擇了沒看？',
'停，讓衝動先退半步；查，讓證據重新上桌；反，讓反例有發言權；比，讓替代解釋一起競爭；修，讓判斷回到比較接近真實的位置。五個字，就是一趟從反射走到反思的旅程。',
'口訣「停、查、反、比、修」。今天找一個你很有把握的判斷，強迫自己寫出三個替代解釋。不是要你放棄立場，而是讓你的立場，經得起風吹。',
'我們都戴著看不見的眼鏡，有的偏藍，有的偏灰，有的蒙著舊日的霧。真正的清醒，不是假裝自己沒戴眼鏡，而是偶爾把它摘下來，擦一擦，再重新看一次這個世界——然後溫柔地承認：原來剛才，我看到的只是我想看到的。']},
5:{t:'人生最大的浪費，是用高效率追求不再重要的目標',h:'當價值沒有排序，所有事情都會假裝自己最重要。',p:[
'他升上主管那年，年薪多了三成，陪孩子吃晚餐的次數卻少了九成。某天孩子畫了一張全家福，畫裡沒有爸爸。老師問為什麼，孩子說：「爸爸在公司。」他一直說家人最重要，可是他的行事曆，誠實地寫著另一個答案。',
'你說你最重視的東西，真的出現在你的時間表裡嗎？如果有人只看你上週的時間與金錢花在哪裡，他會猜你最重視什麼？',
'價值不是你說出口的話，而是你在代價面前做出的選擇。沒有代價的重視，只是一種願望。',
'世界模型告訴你「可以去哪裡」，價值系統決定你「想去哪裡」。前者給你地圖，後者給你方向；有地圖沒方向，走得越遠，越是迷茫。',
'選，是承認不是所有東西都重要；排，是承認重要的東西也有先後；衡，是承認價值之間會打架；捨，是承認得到總伴隨失去；行，是讓價值從嘴巴走到腳下。',
'我們以為自由是「什麼都能要」。其實真正的自由，是清楚知道自己願意為什麼付出代價，也清楚知道自己願意放下什麼。能放下，才騰得出手去擁抱。',
'第一次排序，你會發現自己什麼都想要；第二次排序，你開始看見衝突；第三次排序，你開始願意取捨；當排序和行事曆終於對得上，你會感到一種很安靜的力量——那叫做「一致」。',
'口訣「選、排、衡、捨、行」。今天從十個價值裡選出前三名，再打開你的行事曆，看看上週有幾小時真的給了它們。那個落差，不是罪惡感的來源，而是下一步的方向。',
'人生不是一張可以全部打勾的清單，而是一條有限的河。你無法讓河流流向每一個地方，但你可以決定它灌溉哪一片土地。願你的時間，最後流向你真正愛的地方；願你回頭時，看見的是一片自己選擇的綠。']},
6:{t:'「我要變好」不是目標，是一聲嘆息',h:'模糊的願望無法管理，清楚的目標才會回應你。',p:[
'每年一月，他都寫下：「今年要變健康。」每年十二月，他都發現自己什麼也沒改變。不是他不想，而是「健康」太大、太遠、太模糊——大到不知道從哪裡開始，遠到看不見今天的努力有沒有用。',
'你怎麼知道自己進步了？用感覺嗎？用心情嗎？如果目標沒有數字、沒有期限、沒有成功標準，那失敗的時候，你又怎麼知道是哪裡出了問題？',
'目標不是一個終點，而是一個讓現實能回答你的問題。問得模糊，現實就只能沉默。',
'願望說：「我想英文變好。」目標說：「十四天後，同難度字彙測驗從六成提升到七成五。」願望讓你感動一晚，目標讓你行動兩週。',
'標，讓你知道要去哪裡；量，讓你知道走了多遠；權，讓你知道什麼優先；期，讓你知道何時檢查；驗，讓你知道是否抵達。',
'很多人以為目標越單純越好，只追一個數字。可是只追分數的學生，可能犧牲睡眠；只追業績的公司，可能犧牲信任。好的目標，不只告訴你要得到什麼，也提醒你不能失去什麼。',
'先設基準，你才知道起點；再設成果指標，你才知道終點；加上過程指標，你才知道每天有沒有在路上；加上安全指標，你才不會在抵達時，發現自己早已遍體鱗傷。',
'口訣「標、量、權、期、驗」。今天把一個模糊的願望，改寫成一句有基準、有指標、有期限的話。只要一句，夢想就從天空降落到地面。',
'星星很美，但星星不會告訴你下一步踩在哪裡。把願望寫成目標，就像把星光翻譯成腳下的石階。一階一階，你不會立刻抵達天空，但你會越來越清楚：自己正在往上走。']},
7:{t:'最賺錢的選擇，不一定是最值得的選擇',h:'真正的選擇能力，是知道什麼值得得到，也知道什麼值得放棄。',p:[
'兩份工作擺在面前。一份月薪多一萬五，每天加班到十點；一份薪水普通，但六點下班，可以陪孩子寫功課。所有人都說：「當然選錢多的！」她卻遲遲無法回覆。因為她知道，表格上沒有寫出來的那一欄，可能才是最重要的。',
'一萬元對每個人的意義都一樣嗎？升遷的機會有多大？過勞的機率又有多少？當你只比較「最好的結果」時，你是不是忘了問：最壞的結果，我承受得起嗎？',
'價值不在事物本身，而在事物與你之間的關係。同樣一杯水，在沙漠裡是生命，在湖邊只是一杯水。',
'表面收益只看「得到多少」，預期效用看的是「可能得到什麼、機會多大、對我值多少」。前者讓人衝動，後者讓人清醒。',
'列出方案，不讓選擇只剩一條路；預測結果，不讓想像只剩最好的一面；評估價值，不讓別人的標準代替你的心；估計機率，不讓希望冒充事實；比較之後，才做選擇。',
'我們以為理性就是只看錢。其實真正的理性，是承認時間、健康、自由與關係也有重量。把它們放進計算裡，不是感性，而是誠實。',
'當你只看薪水，你在比數字；當你加入機率，你在比可能；當你加入自己的效用，你在比人生；當你發現排序會因為一個權重而翻轉，你終於明白——決定答案的不是公式，而是你是誰。',
'口訣「案、果、值、率、選」。今天替一個猶豫中的選擇，各列三種可能結果，寫上機率與它對你的價值。算完之後，聽聽心裡的聲音，看它和數字是否一致。',
'天平的兩端，不只放著金錢，還放著清晨的陽光、孩子的笑聲、夜裡安穩的睡眠。願你在每一次選擇時，都記得把這些看不見的東西也放上去——因為人生的帳本，最後結算的從來不是存款，而是你活過的樣子。']},
8:{t:'真正的勇敢，不是不怕輸，而是知道自己最多能輸多少',h:'成熟的決策者，會為未知保留空間，也會為錯誤保留出口。',p:[
'朋友說有個穩賺的機會，「半年翻倍」。他把存款全部投進去，連孩子的學費也挪了一部分。三個月後，平台消失了。他後來說：「我不是不知道有風險，我只是從來沒想過，最壞會壞到什麼程度。」',
'做決定之前，你想過最好的結果幾次？想過最壞的結果又有幾次？如果真的發生了，你承受得住嗎？你有退路嗎？還是你連退路長什麼樣子，都從來沒有畫過？',
'未來不是一個點，而是一片展開的扇形。只盯著扇形最亮的那一角，就會被最暗的那一角吞沒。',
'魯莽的人說：「不會那麼倒楣吧！」謹慎的人說：「如果真的倒楣，我還站得住嗎？」魯莽賭的是運氣，謹慎守的是未來。',
'辨，讓風險從暗處走到明處；估，讓恐懼變成可以討論的數字；限，讓損失有一條不能越過的線；防，讓意外來臨時有東西可以接住；退，讓錯誤不會變成毀滅。',
'我們以為想最壞的情況是悲觀。其實正好相反：先想好最壞，你才敢放心去追最好。底線不是限制你的牆，底線是讓你敢往前跳的那張網。',
'列出三個風險，你不再盲目；估計最壞情境，你不再天真；設定可承受損失，你不再孤注一擲；寫下停止條件，你不再越陷越深；最後你會發現，風險沒有消失，但你已經不再害怕它。',
'口訣「辨、估、限、防、退」。在下一個重要決定之前，寫下三行字：最壞會怎樣？我最多能輸多少？什麼情況下我會停？健康、財務與法律的大事，也請記得找專業的人一起看。',
'航海的人不會因為有暴風雨就不出海，但他們一定會帶上救生艇。願你的人生也是如此：心裡有遠方，船上有退路。不是因為你不相信晴天，而是因為你愛這條船，也愛船上的每一個人。']},
9:{t:'你不是時間不夠，而是把時間給了不重要的事',h:'有限，不是困住你的牆，而是逼你看清重點的鏡子。',p:[
'她把一週排得滿滿的：上班、加班、兩個讀書會、三堂線上課程、每天運動一小時。週三孩子發燒，整張表瞬間崩潰。她哭著說：「我已經這麼努力了，為什麼還是做不完？」問題不是她不努力，而是那張表，從來沒有留一點點縫隙給生活。',
'如果一個方法需要你每天十小時，而你只有兩小時，它還算是「最好的方法」嗎？你的行事曆裡，有沒有一格叫做「意外」？',
'所有的選擇都有影子，那個影子叫做機會成本。你對每一件事說「好」，都在對另一件事說「不」。',
'理想的計畫假設一切順利，現實的計畫假設一定會有變化。前者寫在紙上很漂亮，後者走在路上才走得完。',
'盤點，讓你知道自己擁有什麼；排序，讓你知道什麼該先；配置，讓資源去它最該去的地方；留白，讓意外有地方落腳；調整，讓計畫跟著現實一起呼吸。',
'我們以為排滿才叫有效率。其實沒有緩衝的計畫，就像沒有煞車的車，跑得越快，摔得越重。留白不是浪費，留白是讓你在風雨來時，還能站穩的地方。',
'先數清楚時間，你停止幻想；再排出優先，你停止內耗；再找出瓶頸，你停止在不重要的地方用力；再刪掉一件低價值的事，你第一次感覺到——原來減法，也是一種前進。',
'口訣「盤、排、配、留、調」。今天列出本週真正可用的時間，寫下前三個最重要的任務，再刪掉一件可有可無的事。刪掉的那一刻，你會聽見心裡鬆了一口氣。',
'一天只有二十四小時，一生只有一次。我們無法讓時間變長，但可以讓它變得更像自己。願你的日子不是被塞滿的箱子，而是被好好安放的抽屜——重要的放在最順手的地方，空著的那一格，留給春天突然來敲門。']},
10:{t:'好的決定，不保證好的結果；但壞的過程，常常保證後悔',h:'決策品質不等於結果好壞，而是你是否合理運用了當時能得到的資訊。',p:[
'兩個人都決定創業。一個人花了三個月研究市場、做小規模測試、設好停損點，結果遇上大環境轉壞，失敗了。另一個人一時衝動、借錢開店，剛好碰上熱潮，賺了。旁人說：「你看，想太多沒用。」可是如果再來十次，你會把人生交給哪一種方法？',
'你是用結果判斷決策，還是用過程判斷決策？如果一次運氣好，就證明方法對嗎？如果一次運氣差，就證明你錯了嗎？',
'我們無法選擇結果，只能選擇行動。決策是在迷霧中選一條路，而不是在陽光下看清終點。',
'賭徒問：「哪條路會贏？」決策者問：「每條路在好、普通、壞的情況下，各會怎樣？」賭徒追求一次猜對，決策者追求長期不後悔。',
'列出方案，看見「做」與「不做」之外的第三條路；推演情境，看見樂觀、基準、悲觀三種天氣；估算代價，看見每條路的價格標籤；比較方案，看見誰在壞天氣裡依然站得住；最後，才做決定。',
'很多人以為最難的是「選哪一個」。其實最常被忽略的選項，是「先蒐集資訊」或「先做小實驗」。有時候，最好的決定，就是先不急著做重大的決定。',
'一個方案，是衝動；兩個方案，是猶豫；三個方案，是選擇；三個方案乘以三種情境，是策略；再加上一個「何時改變主意」的觸發條件，那就是智慧。',
'口訣「列、推、算、比、定」。今天為一個正在猶豫的決定，列出三個方案、三種情境，再寫下一句：「如果＿＿發生，我就改變決定。」',
'人生沒有彩排，但心裡可以有預演。願你在每一個岔路口，都先在腦海裡走過幾遍：晴天怎麼走，雨天怎麼走，起霧時又該怎麼回頭。這樣，無論最後抵達哪裡，你都能平靜地說——我盡力看清了，我認真選擇了，我不後悔。']},
11:{t:'不要用一輩子去證明一個想法，先用七天',h:'把不可逆的衝動，變成可驗證的小行動。',p:[
'他看了一部影片，決定「從明天開始徹底改變人生」：五點起床、每天運動兩小時、戒糖、讀書三小時、冥想一小時。第三天，他累倒了，接著整整一個月什麼都沒做。不是他沒有決心，而是他一次想改變太多，結果什麼也沒改變。',
'為什麼我們總想一口氣改變全部？如果同時改了五件事，進步了，你知道是哪一件有效嗎？退步了，你又知道該修哪一件嗎？',
'想法在腦中永遠完美，只有碰到現實，才知道它是真是假。行動，是讓想像接受現實審問的唯一方式。',
'大計畫給你激情，小實驗給你答案。大計畫常常死在第三天，小實驗卻能活到第七天，然後告訴你下一步。',
'假，先把想法寫成可以被推翻的假設；小，把行動縮小到幾乎不會失敗；做，讓它真的在生活裡發生；測，讓數字替你說話；改，讓結果決定下一輪的方向。',
'我們以為小行動不夠勇敢。其實能把夢想拆成五分鐘的人，才是真正懂得堅持的人。不是因為五分鐘很厲害，而是因為五分鐘，你每天都做得到。',
'第一天，你只是在試；第三天，你開始有紀錄；第七天，你有了資料；第十四天，你有了判斷；一個月後，你不只改變了一個習慣，還學會了一種改變的方法。',
'口訣「假、小、做、測、改」。今天設計一個每天五分鐘、連續七天的小實驗，先記下今天的基準值。記住：不是做越多越好，而是做得剛好能看見結果。',
'一顆種子不會因為你的期待而立刻長成大樹，但它會因為你每天一點點的澆灌而破土。別急著要森林，先種下今天這一顆。七天後回來看，也許只冒出一點綠——但那一點綠，是你親手驗證過的真實。']},
12:{t:'感覺會騙人，紀錄不會',h:'沒有基準難比較，沒有紀錄難更新。',p:[
'她說：「這個方法根本沒用，我都沒變瘦。」朋友請她翻翻紀錄，她才發現：腰圍其實少了四公分，只是體重沒有明顯變化。她差一點，就因為只看了一個指標，放棄了一條對的路。',
'你怎麼知道自己有沒有進步？靠心情嗎？靠鏡子嗎？如果今天很累，你是不是就覺得一切都沒用？如果沒有開始時的那個數字，你要拿什麼來比較？',
'記憶是會說故事的人，它會刪掉不合劇情的片段；紀錄是沉默的證人，它只說發生過什麼。',
'感覺告訴你「好像」，紀錄告訴你「確實」。感覺適合提醒你注意，紀錄適合幫你判斷。兩者都需要，但不能互相取代。',
'基，讓起點被看見；記，讓每一天被留下；比，讓變化被量出；勢，讓趨勢從波動裡浮現；報，讓資料變成下一次的智慧。',
'我們以為紀錄是為了證明自己做得很好。其實紀錄最大的價值，是讓你看見自己做得不好的地方——而且是用不羞辱人的方式。數字不會罵你，它只會安靜地告訴你：這裡，還可以再試試。',
'一筆紀錄，是一個點；七筆紀錄，是一條線；一個月的紀錄，是一個趨勢；當你學會分辨哪些是真實變化、哪些只是測量誤差，你就從「記錄的人」，變成「讀懂生活的人」。',
'口訣「基、記、比、勢、報」。今天選一個你在意的指標，寫下第一個數字，作為基準。明天再寫一個。不用完美，只要誠實。',
'生命像一條河，流過就看不見了。紀錄，是在河邊放下一顆顆小石頭，讓你回頭時知道自己走了多遠。願你不再只憑那一刻的心情判斷人生，而是低頭看看那一路的石頭——原來，你已經比自己以為的，走得更遠。']},
13:{t:'錯誤不是羞辱，而是現實寄給你的校正信',h:'當結果不如預期，先診斷模型，不急著否定自己。',p:[
'他預估這個月業績會成長兩成，結果只有半成。主管在會議上問：「你是不是不夠努力？」他低頭說對不起。可是後來他發現：那個月有兩個大客戶因為預算延後下單，產品也剛調整了價格。他不是不努力，他只是從來沒被教過，怎麼拆解一個誤差。',
'當事情不如預期，你第一個念頭是「我好爛」，還是「哪裡跟我想的不一樣」？那一段差距裡，有多少是你的問題，有多少是環境，又有多少只是運氣？',
'預測是我們對未來的提問，誤差是未來的回答。聽不懂回答的人，會一直問同樣的問題。',
'低維反應說：「我失敗了。」高維分析說：「我的預測在哪一個節點偏了？」前者讓你縮小，後者讓你升級。',
'預，寫下你原本以為的；實，記下真正發生的；差，算出兩者的距離；因，找出距離從哪裡來；修，決定下一次怎麼走得更近。',
'我們以為誤差是失敗的證據。其實沒有誤差的人，往往不是做得最好的人，而是從不寫下預測的人。敢寫下預測，才有資格被現實修正；被修正得越多，就越接近真實。',
'先看是不是資料錯了，再看是不是描述錯了，再看是不是漏了重要因素，再看是不是關係或權重估錯了，最後看是執行沒到位，還是目標本身不合理。一層一層剝開，你會發現：誤差不是一團黑，而是一張可以讀的地圖。',
'口訣「預、實、差、因、修」。今天找一件「結果跟你想的不一樣」的事，算出差距，列出三個可能原因，標記哪些已確認、哪些還待驗證。',
'箭射偏了，弓箭手不會折斷自己的手，他會看看風、看看姿勢、看看弓弦，再射下一箭。願你對待自己的錯誤，也能這樣溫柔而專注。每一次偏離靶心，都是風在告訴你它的方向；聽懂了，下一箭就會更近一點。']},
14:{t:'改一個答案很容易，改掉產生錯誤答案的方式才難',h:'真正的升級，不只是改變答案，而是改變產生答案的系統。',p:[
'一位老師帶了二十年的班，一直相信「成績差的孩子就是不努力」。直到某天，他讓全班做了一次閱讀速度測驗，發現那些「不努力」的孩子，閱讀速度只有同學的一半。他們不是不讀，是讀不完。那天晚上，他在筆記本上寫：「我教錯了二十年的一句話。」',
'你上一次真正改變想法，是什麼時候？是因為證據，還是因為吵輸了？改了之後，你有回頭檢查新的想法，是不是真的比較好嗎？',
'模型是現實的近似，不是現實的替身。它像一件衣服，人會長大，衣服就該修改。',
'頑固的人拒絕更新，浮躁的人每天推翻；前者被過去綁架，後者被雜訊牽著走。真正的更新，是保留有效的，修正失效的，而且每一次都留下紀錄。',
'收，讓新的證據進門；查，讓舊的模型接受檢驗；改，讓失效的部分被替換；測，讓新版本證明自己；存，讓每一次更新都有跡可循，必要時還能回到過去。',
'我們以為更新就是推翻過去的自己。其實不是。可靠的舊知識不需要丟掉，它是新模型的地基。更新不是背叛昨天，而是讓昨天的努力，在今天繼續長出果實。',
'第一次，你修正了一個答案；第二次，你修正了一個假設；第三次，你開始修正自己「形成假設的方式」；有一天你會發現，自己不再那麼害怕犯錯，因為你知道，每一個錯誤，都會被這套系統接住、消化、轉化。',
'口訣「收、查、改、測、存」。今天找一個你已經知道不太準的想法，寫下舊版本、新版本、修改理由，以及你打算怎麼驗證它。',
'蛇會蛻皮，樹會換葉，星辰也會在漫長的歲月裡慢慢移動位置。萬物都在更新，只有人，常常害怕自己變得和過去不一樣。願你允許自己蛻變——不是丟掉從前的你，而是讓從前的你，成為現在的你最溫柔的養分。']},
15:{t:'你說「我很確定」的時候，到底有多確定？',h:'真正的準確，不是永遠說自己會對，而是知道自己有多大機率會對。',p:[
'他總是說：「我百分之百確定這個案子會過。」後來回頭數，十件案子裡只過了五件。每一次沒過，他都說：「這次是例外。」直到他開始把每一次預測寫下來，才發現自己口中的「百分之百」，其實只有五成。',
'你說「一定」的事情，真的一定發生了嗎？你說「不可能」的事情，有沒有偷偷發生過？如果沒有人記錄，你會不會一直以為自己很準？',
'確定感是一種感覺，準確度是一種事實。感覺可以很強烈，事實卻只在長期紀錄裡現身。',
'不校準的人只記得猜對的那幾次，校準的人連猜錯的也一起保存。前者活在自信裡，後者活在真實裡。',
'估，用機率代替「一定」；鎖，在知道結果前把預測封存；等，讓時間替你作答；算，用分數誠實地計算差距；校，讓下一次的信心更接近現實。',
'我們以為預測準的人，是很少說錯的人。其實真正準的人，是說「七成把握」時，大約十次中真的有七次發生的人。準確不是不犯錯，而是錯得剛好和自己說的一樣多。',
'一筆預測，只是一個猜測；二十筆預測，開始出現模式；一百筆預測，你看見自己哪裡過度自信、哪裡過度保守；當你的「八成」真的接近八成，你的話語就有了重量，別人也開始信任你的判斷。',
'口訣「估、鎖、等、算、校」。今天寫下一件兩週內就能知道結果的事，給它一個機率，然後鎖起來，不准偷改。兩週後，讓現實替你批改。',
'氣象預報說「降雨機率七成」而那天沒有下雨，預報員不必羞愧，因為那三成本來就屬於晴天。願你也能這樣對待自己的判斷：不誇大，不否認，只是一次次寫下、對照、微調。總有一天，你說出口的每個數字，都會像星星一樣，可以被信任。']},
16:{t:'不敢嘗試的人停在原地，不懂堅持的人永遠在起點',h:'有效的方法先保留，新的可能小量試，證據足夠再轉換。',p:[
'她用同一套讀書方法十年，從國中用到研究所，一直很有效。直到考證照那年，題型完全改變，她的成績卡住了。朋友建議她試試間隔複習，她說：「我的方法一直都很好啊。」另一位同學則相反，看到新方法就換，三個月換了七種，最後什麼都沒學扎實。',
'你是那個永遠只點同一道菜的人，還是每次都點沒吃過的菜？前者錯過了什麼？後者又失去了什麼？有沒有一種方式，既不放棄熟悉的好，又不錯過未知的更好？',
'已知給人安全，未知給人可能。生命的智慧，不在選邊，而在分配。',
'只利用的人，會停在局部最佳，以為山腰就是山頂；只探索的人，會一直在路上，卻從不在任何地方紮根。前者太早滿足，後者永不滿足。',
'守，把有效的方法留在身邊；探，用好奇心看看另一扇門；試，只用一小部分資源去碰；比，讓結果而不是感覺來說話；換，在證據足夠時才勇敢轉身。',
'我們以為探索是冒險。其實最大的冒險，往往是「永遠不探索」。環境一變，那些從不嘗試的人，會發現自己唯一會的方法，已經不再適用。',
'用大部分的力氣守住現在，你有了安全感；用一小部分的力氣探索未來，你有了可能性；為探索設下停止條件，你有了底線；當新方法被證明更好，你有了升級的勇氣——那不是放棄過去，而是讓過去帶著你，走向更遠的地方。',
'口訣「守、探、試、比、換」。今天保留一個你最有效的習慣，同時挑一個新方法，只用十五分鐘試試看。記下結果，一週後再決定：保留、擴大，還是停止。',
'老樹的根扎得很深，但它每年春天，依然會伸出幾根新的枝枒，向著從未到過的天空。願你也像那棵樹：根，守著讓你站穩的東西；枝，探向讓你長大的地方。穩定與好奇從來不是敵人，它們是同一棵生命的上下兩端。']},
17:{t:'記下當時怎麼想，才知道後來哪裡需要改',h:'記錄不是為了證明過去的自己正確，而是讓未來的自己更有判斷力。',p:[
'三年前，他辭掉穩定的工作去創業。後來失敗了，他告訴所有人：「我早就知道會這樣，只是想試試看。」可是他其實不記得了——不記得當初有多篤定、為什麼那樣選、曾經忽略了哪個提醒。因為他沒有寫下來，所以記憶替他重寫了一個比較體面的版本。',
'你還記得人生中最重要的幾個決定，當時是怎麼想的嗎？是真的記得，還是後來慢慢「整理」出來的？如果記憶會說謊，你要拿什麼回顧自己？',
'過去的自己是一位老師，但如果沒有留下教材，我們只能聽記憶的轉述，而記憶，總是偏愛對自己有利的版本。',
'沒有紀錄的人，用結果反推當初的理由；有紀錄的人，用當初的理由檢查結果。前者學到的是故事，後者學到的是規律。',
'境，記下當時你站在什麼地方；信，記下當時你相信什麼；選，記下你選了什麼、放棄了什麼；做，記下你真正做了什麼；悟，記下結果教會你什麼。',
'我們以為寫決策日誌，是為了證明自己做對了。其實它最珍貴的時刻，是讓你看見自己錯在哪裡——而且不必羞愧，就像翻一位老朋友的日記，帶著理解，也帶著清醒。',
'寫一筆，你多了一份誠實；寫十筆，你看見重複的模式；寫五十筆，你萃取出幾條屬於自己的原則；寫到某一天，你會發現自己不再重複同樣的錯，因為過去的你，早已把路標留給了現在的你。',
'口訣「境、信、選、做、悟」。下一次面對重要決定時，花五分鐘寫下：情境、你的預測、選擇的理由、退出條件。寫完封存，等結果出來再回來看。',
'人生像一本沒有草稿的書，每一頁都是正式出版。我們無法回去修改，但可以在頁邊寫下註解。願你多年後翻開這本書時，看到的不只是發生過什麼，還有當時那個認真思考、勇敢選擇的自己——並對他輕輕說一聲：謝謝你，我懂了。']},
18:{t:'你忙了一整年，但你真的變好了嗎？',h:'真正的進步，是逐步提升獨立解決問題的能力。',p:[
'年底，他打開手機，看見年度回顧：讀了三十二本書、上了十八堂課、運動一百四十次。他滿意地截圖分享。可是那天晚上，面對一個工作上的難題，他發現自己的處理方式，和三年前一模一樣。做了很多，卻沒有真的變。',
'你衡量自己的方式，是看做了多少，還是看變得多好？完成任務的數量，真的等於能力的成長嗎？如果把所有數字加起來變成一個總分，那個分數，真的代表你嗎？',
'生命不是一張成績單，而是一個不斷自我校正的系統。成長不是累積更多，而是讓每一次累積，都改變下一次的判斷。',
'忙碌是動作，進步是方向；數量是表面，品質是本質。看得到的努力不一定有效，看不到的更新卻可能改變一生。',
'知，看你是否看得更準；判，看你是否選得更好；行，看你是否做得更穩；改，看你是否修得更快；長，看你是否在漫長的歲月裡，一點一點變成更自由的人。',
'我們以為儀表板是用來給自己打分數的。其實不是。好的儀表板不評判你，它像一面誠實的鏡子，只告訴你最該改善的地方在哪裡。它不把不同的東西硬加成一個總分，因為人生本來就不是一道可以加總的算術題。',
'第一週，你看見數字；第一個月，你看見趨勢；第一季，你看見瓶頸；第一年，你看見自己真正的模樣——不是更完美，而是更清楚。清楚自己在哪裡強、在哪裡弱，以及下一步，要往哪裡長。',
'口訣「知、判、行、改、長」。這週選三個指標：一個看預測，一個看執行，一個看更新。寫下目前最需要改善的一項，和下一輪你要試的行動。',
'樹不會數自己長了幾片葉子，它只是一年一年，讓年輪更深一圈。願你不再只追求看起來很忙的日子，而是珍惜那些悄悄改變你的時刻。總有一天你會發現：最好的成長沒有掌聲，它只是讓你在下一次風雨來臨時，站得比從前更穩。']}};
/* 情境回扣：回到開頭的衝突，讓故事落地（插入在「層層遞進」之後） */
const FBCB=[
'後來，那位媽媽換了一個問題。她不再問「你為什麼又錯」，而是陪孩子把錯的三題攤開來看：一題是看錯單位，一題是公式記反，一題是根本還沒學過。原來那不是「不聽話」，而是三個不同的原因，需要三種不同的幫忙。那天晚上，孩子第一次主動說：「媽媽，我再試一次。」她忽然明白，真正改變的不是孩子，而是她看問題的那雙眼睛。當我們願意把「你怎麼又這樣」換成「我們來看看哪裡卡住」，責備就變成了理解，焦慮就變成了方法，一個家的夜晚，也就多了一點光。',
'如果那位主管願意多翻幾頁，或者願意問自己一句：「我說他一向粗心，證據有幾筆？反例又有幾筆？」也許他會想起，這位同事上個月才抓出一個連他都沒看到的錯誤。信念最可怕的地方，不是它錯了，而是它讓我們只看見符合它的東西。一個錯字被放大，十份用心被忽略。於是被誤解的人越來越沉默，下判斷的人越來越篤定，兩個人都困在同一句沒被檢查過的話裡。打破它的方法其實很簡單：在說出「一向」、「總是」、「永遠」之前，先數一數證據。',
'後來，小安的媽媽沒有再急著下結論。她把五次成績排成一排，再看看這次全班的平均，發現兒子的落後幅度，其實和大家差不多。她只問了一句：「這次哪一大題最難？」小安說是閱讀測驗，文章比以前長很多。母子倆一起決定，接下來兩週每天練一篇限時閱讀，再用同難度的題目檢查一次。沒有責罵，沒有眼淚，只有一個被證據慢慢調整的判斷。原來，愛一個人不只是相信他，而是願意用更公平的方式，去理解他的每一次跌倒。',
'那位爸爸後來把手機還給了孩子，換成一張紙，和孩子一起畫：睡眠、奶奶的病、作業量、上課專注、心情。他們發現，最粗的那條線，從「晚睡」連到「不專心」，而晚睡又連到「家裡人手不夠」。最後真正的解法，不是更嚴的規定，而是請姑姑每週來幫忙兩個晚上。孩子的專注慢慢回來了。如果當初只盯著手機那個點，他們可能會沒收更多東西，卻永遠解不開那張網。系統思考不是讓問題變複雜，而是讓我們終於找到那條真正值得拉動的線。',
'後來，那位朋友沒有和她爭吵，只是陪她一起查。她們找到原始資料，發現那只是一個小規模的觀察，對象和條件都很有限，也沒有證明能「逆轉疾病」。她沉默了很久，然後說：「我只是太希望它是真的。」那一刻她終於看見，推動她轉傳的不是證據，而是盼望與恐懼。偏誤從來不只是邏輯錯誤，它常常是情感的影子。辨認偏誤，不是要我們變得冷漠，而是讓我們的關心，不被錯誤的資訊帶往錯誤的方向——健康的大事，更值得交給可靠的證據與專業的人。',
'那天晚上，他把孩子的畫貼在書桌前，重新排了一次價值：家庭、健康、成就、收入。然後他做了一件以前覺得不可能的事——和主管談好，每週有兩天準時下班。工作沒有因此崩壞，只是某些不重要的會議被他婉拒了。三個月後，孩子又畫了一張全家福，這次爸爸站在中間，手裡拿著一顆籃球。他忽然懂了：價值排序不是寫在日記裡的漂亮句子，而是每一次面對代價時，你選擇站在哪一邊。原來一致，就是最安靜的幸福。',
'後來，他不再寫「今年要變健康」。他寫的是：「接下來三十天，每週走路四次，每次三十分鐘；三十天後，以爬五樓不喘作為成果指標；以睡眠不少於七小時作為安全指標。」第一週他只完成了兩次，但他知道差在哪裡——下雨天沒有替代方案。第二週，他加上了室內踏步。一個月後，他第一次在十二月之前，看見自己真的改變了。原來他從來不缺意志力，他缺的是一個能回答他的目標。當目標清楚到可以被驗證，失敗也就清楚到可以被修正。',
'最後，她把兩份工作都寫成表格：各自可能發生的三種情況、每種情況的機率，以及每種結果對她的意義。她發現，高薪工作在「升遷」時很誘人，但「過勞」那一格的分數低到讓她心驚；普通薪水的工作，最壞的情況也不過是存錢慢一點。她選了後者。有人說她不夠有企圖心，她只是微笑。因為她知道，這不是放棄野心，而是把野心放在她真正想要的人生上。效用評估不是冷冰冰的計算，而是讓你在眾聲喧嘩中，聽見自己心裡最真實的那個數字。',
'後來，他重新開始記帳，也學會了一件事：任何重大決定之前，先寫下最壞情境和停損點。第二年，又有人找他，同樣說「穩賺」。這一次，他先問了三個問題：最壞會怎樣？我能承受多少？什麼情況我會退出？答案讓他決定婉拒，或者頂多只放一筆就算全部失去也不影響生活的小錢。後來那個機會果然出了問題，但這次，他的家沒有被拖垮。他說：「我沒有變得比較不敢，我只是終於知道，勇氣也需要邊界。」',
'那個週末，她把行事曆攤開，用三支不同顏色的筆重畫：紅色是非做不可的，藍色是重要但可以延後的，灰色是「別人覺得我該做」的。她刪掉了一個讀書會、兩堂線上課，每天留下一小時空白。剛開始她很焦慮，覺得自己變懶了。可是下一次孩子生病時，她發現自己沒有崩潰，只是把那段空白拿來陪孩子看醫生。那一刻她明白：效率不是把每一分鐘塞滿，而是讓最重要的事，在任何意外中都能被保護。',
'那位失敗的創業者後來說，他並不後悔。因為他當初設好了停損點，所以失敗時，他沒有賠上房子，也沒有拖垮家人。他翻開當時的決策紀錄，發現大部分判斷都合理，真正沒料到的是大環境的變化。於是他只修正一件事：下一次，要把「外部衝擊」列為獨立的情境。兩年後他再次出發，這一次走得更穩。而那位靠運氣賺錢的朋友，後來用同樣衝動的方式開了第二家店，卻沒有那麼幸運了。好的決策方法，不保證每一次都贏，但它讓你輸得起，也讓你學得到。',
'一個月後，他換了一種方式：只做一件事，每天睡前讀十頁書。他把起始的閱讀量記下來，在牆上貼一張小小的打勾表。七天後，他完成了六天，比自己預期的還好；第十四天，他發現十頁有點少，於是加到十五頁。三個月後，他讀完了好幾本書，而且沒有一次覺得自己在硬撐。原來，改變不是一場爆發，而是一連串可以被驗證的小勝利。每一次打勾，都是現實在對他說：你可以的，而且你有證據。',
'從那天起，她開始固定在同一時間、用同一把皮尺、量同一個位置，也記下睡眠和飲食。兩個月後，她看著那條緩緩變化的折線，終於明白自己不是沒有進步，而是之前看錯了地方。有一週數字突然上升，她沒有慌張，因為紀錄裡寫著那幾天睡得很少、外食偏鹹，短期波動是正常的。她說：「以前我被數字嚇到，現在我被數字保護。」紀錄真正的力量，不是讓你看起來很自律，而是讓你在迷惘的時候，有一個可以相信的依據。',
'後來，他把那次的預測拆開來看：客戶延後下單，屬於時間誤差；價格調整沒有算進去，屬於節點誤差；而他原本對新客戶轉換率的估計太樂觀，屬於權重誤差。他把三個原因分成「已確認」與「待驗證」，帶著這份分析去找主管。主管沉默了一會兒，說：「下個月的預測，你來主導。」那一刻他明白：同一個失誤，可以讓人低頭道歉，也可以讓人抬頭學習。差別不在誤差有多大，而在你是否願意，把它當成一份可以讀懂的報告。',
'那位老師後來沒有把過去全部推翻。他保留了自己最擅長的鼓勵方式，只是在模型裡加上一個新節點：閱讀速度。他設計了一個月的閱讀訓練，記錄前後差異，並把舊想法和新想法都寫在筆記本裡，標上日期。一個月後，那些孩子的閱讀速度提高了，成績也慢慢跟上。他在筆記本最後寫下：「我不是一個錯了二十年的老師，我是一個在第二十年，終於學會更新的老師。」原來承認錯誤，不會讓人變小，它讓人變得更完整。',
'他開始用一本小冊子記錄每一次預測：寫下機率，寫下判斷理由，封起來，等結果。半年後，他發現自己說「九成」的事，實際上只發生了六成左右；但說「五成」的事，倒是相當接近。他終於知道，自己的問題不是判斷差，而是在有把握時太過自信。他把高信心的預測都往下調了一點，主管開始發現，他的報告變得可以信任了。原來，誠實面對自己的準確度，不會讓人顯得軟弱，反而讓每一句承諾，都變得有分量。',
'後來，她決定保留原本的方法作為主軸，每天另外撥出十五分鐘試間隔複習，並設下規則：兩週後用同一份模擬題比較。結果新方法在延遲記憶上表現更好，她才逐步把比例調高。那位不停換方法的同學，也被她邀請用同樣的規則測試，不再看到新東西就全部換掉。考試那天，兩個人都過了。她說：「我不是放棄了舊方法，我是讓它和新方法比賽，讓證據當裁判。」探索與堅持，從來不是二選一，而是用對的比例，讓兩者都發揮力量。',
'後來，他開始寫決策日誌。第一次寫的是要不要換工作：他寫下自己的擔心、期待、各種可能，以及一個「如果半年內沒有成長就重新評估」的退出條件。半年後他翻開來看，發現自己擔心的事有一半沒有發生，而真正的困難，是他完全沒想到的團隊溝通問題。他把這個發現寫成一條原則：「重大轉職前，先和未來的同事聊一次。」那是他第一次覺得，過去的自己不是一個需要被辯護的人，而是一位值得被請教的老師。',
'那天之後，他換了一種方式回顧：不再只數完成了多少，而是每週問三個問題——我的預測準了嗎？我說要做的事做到了嗎？我有沒有根據新的證據改變做法？三個月後，他的完成數量反而變少了，因為他刪掉了很多不重要的事；但他的預測越來越準，計畫越來越穩，遇到問題時，也開始知道先拆解、再實驗、後更新。年底，他沒有再截圖分享數字，只在筆記本裡寫了一句：「今年，我比去年更會想了。」'];

function addCards(id){const n=cardsFor(APPS[id-1]).length;let k=0;for(let i=0;i<n;i++){const key=id+'-'+i;if(!S.cards[key]){S.cards[key]={box:0,due:today(),last:null,n:0,lapse:0};k++}}return k}

const checks=(l,b)=>`<div class="chk">${l.map((x,i)=>`<span class="${b[i]?'y':'n'}">${b[i]?'✔':'○'} ${x}</span>`).join('')}</div>`;

function lineSVG(pts,base){if(pts.length<2)return '<p class="mut sm">至少兩筆數值才會畫出趨勢圖。</p>';const W=320,H=150,P=28;const vs=pts.map(p=>p.v).concat(base!=null?[base]:[]);let mn=Math.min(...vs),mx=Math.max(...vs);if(mn==mx){mn-=1;mx+=1}
 const x=i=>P+i*(W-2*P)/(pts.length-1),y=v=>H-P-(v-mn)/(mx-mn)*(H-2*P);
 const ma=pts.map((p,i)=>{const s=pts.slice(Math.max(0,i-2),i+1);return s.reduce((a,b)=>a+b.v,0)/s.length});
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:520px">${base!=null?`<line x1="${P}" x2="${W-P}" y1="${y(base)}" y2="${y(base)}" stroke="var(--warn)" stroke-dasharray="4 3"/><text x="${W-P}" y="${y(base)-3}" text-anchor="end">基準</text>`:''}
 <polyline fill="none" stroke="var(--mut)" stroke-dasharray="3 3" points="${ma.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>
 <polyline fill="none" stroke="var(--acc)" stroke-width="2" points="${pts.map((p,i)=>x(i)+','+y(p.v)).join(' ')}"/>
 ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="3" fill="var(--acc)"/>`).join('')}
 <text x="2" y="${y(mx)+4}">${r1(mx)}</text><text x="2" y="${y(mn)+4}">${r1(mn)}</text>
 <text x="${P}" y="${H-6}">${esc(pts[0].d||'')}</text><text x="${W-P}" y="${H-6}" text-anchor="end">${esc(pts[pts.length-1].d||'')}</text></svg><div class="mut sm">實線：數值｜虛線：三筆移動平均｜橘色虛線：基準</div>`}
function netSVG(nodes,edges){const n=nodes.length;if(!n)return '';const W=340,H=270,cx=170,cy=132,R=100,pos={};
 nodes.forEach((nd,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;pos[nd.name]=[cx+R*Math.cos(a),cy+R*Math.sin(a)]});
 const L=edges.filter(e=>pos[e.a]&&pos[e.b]&&e.a!=e.b).map(e=>{const [x1,y1]=pos[e.a],[x2,y2]=pos[e.b];const dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy)||1;const col=(e.s||'').startsWith('－')?'var(--bad)':(e.s||'').startsWith('↔')?'var(--g3)':'var(--ok)';
  return `<line x1="${x1+dx/d*14}" y1="${y1+dy/d*14}" x2="${x2-dx/d*18}" y2="${y2-dy/d*18}" stroke="${col}" stroke-width="${num(e.w)||1}" ${e.c=='相關'?'stroke-dasharray="4 3"':''} marker-end="url(#ar)"/>`}).join('');
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:460px"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--mut)"/></marker></defs>${L}
 ${nodes.map(nd=>{const [x,y]=pos[nd.name];return `<circle cx="${x}" cy="${y}" r="13" fill="var(--acc-s)" stroke="var(--acc)"/><text x="${x}" y="${y<cy?y-17:y+25}" text-anchor="middle" style="font-size:11px;fill:var(--ink)">${esc(String(nd.name).slice(0,8))}</text>`}).join('')}</svg>
 <div class="mut sm">綠：促進｜紅：抑制｜藍：雙向｜虛線：只是相關｜粗細：強度</div>`}

const ROWDEF={};
function field(f,v,lock){if(v==null||v==='')v=f.def==='today'?today():(f.def!=null?f.def:'');const dis=lock?' disabled':'';
 const L=`<label>${f.l}${f.lock?' <span class="tag">事前鎖定</span>':''}${f.req?' *':''}</label>`;
 switch(f.t){
 case 'area':return `<div class="fld">${L}<textarea data-f="${f.k}" placeholder="${esc(f.ph||'')}"${dis}>${esc(v)}</textarea></div>`;
 case 'sel':return `<div class="fld">${L}<select data-f="${f.k}"${dis}>${f.o.map(o=>`<option${o==v?' selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
 case 'range':return `<div class="fld">${L}<div class="rng"><input type="range" data-f="${f.k}" min="${f.min}" max="${f.max}" value="${esc(v)}"${dis} oninput="this.nextElementSibling.textContent=this.value"><b>${esc(v)}</b></div></div>`;
 case 'num':return `<div class="fld">${L}<input type="number" step="any" data-f="${f.k}" value="${esc(v)}" placeholder="${esc(f.ph||'')}"${dis}></div>`;
 case 'date':return `<div class="fld">${L}<input type="date" data-f="${f.k}" value="${esc(v)}"${dis}></div>`;
 case 'rows':return `<div class="fld">${L}${rowsHtml(f,v&&v.length?v:(f.init||[{}]),lock)}</div>`;
 default:return `<div class="fld">${L}<input type="text" data-f="${f.k}" value="${esc(v)}" placeholder="${esc(f.ph||'')}"${dis}></div>`}}
function rowHtml(f,r,lock){const dis=lock?' disabled':'';return `<tr>${f.cols.map(c=>{const v=r[c.k]==null?'':r[c.k];
 if(c.t=='sel')return `<td><select data-c="${c.k}"${dis}>${c.o.map(o=>`<option${o==v?' selected':''}>${esc(o)}</option>`).join('')}</select></td>`;
 return `<td><input data-c="${c.k}" type="${c.t=='num'?'number':c.t=='date'?'date':'text'}" step="any" value="${esc(v)}"${dis}></td>`}).join('')}<td>${lock?'':'<button class="x" data-act="delrow" title="刪除此列">✕</button>'}</td></tr>`}
function rowsHtml(f,rows,lock){ROWDEF[f.k]=f;return `<div class="rows" data-f="${f.k}"><div class="tw"><table><thead><tr>${f.cols.map(c=>`<th>${c.l}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map(r=>rowHtml(f,r,lock)).join('')}</tbody></table></div>${lock?'':`<button class="btn sm ghost" data-act="addrow" data-k="${f.k}">＋ 新增一列</button>`}</div>`}
function readForm(fields,root){const d={};for(const f of fields){const el=root.querySelector(`[data-f="${f.k}"]`);if(!el)continue;
 if(f.t=='rows')d[f.k]=[...el.querySelectorAll('tbody tr')].map(tr=>{const o={};tr.querySelectorAll('[data-c]').forEach(i=>o[i.dataset.c]=i.value.trim());return o}).filter(o=>f.cols.some(c=>c.t!='sel'&&o[c.k]!==''));
 else d[f.k]=el.value.trim()}return d}
function validate(fs,d){for(const f of fs){const v=d[f.k];
 if(f.req&&(v===''||v==null))return `請填寫：${f.l}`;
 if((f.t=='num'||f.t=='range')&&v!==''&&v!=null){const n=+v;if(isNaN(n))return `${f.l} 需為數字`;if((f.min!=null&&n<f.min)||(f.max!=null&&n>f.max))return `${f.l} 需介於 ${f.min}–${f.max}`}
 if(f.t=='rows')for(const r of v||[])for(const c of f.cols)if(c.t=='num'&&r[c.k]!==''&&r[c.k]!=null){const n=+r[c.k];if(isNaN(n))return `「${c.l}」需為數字`;if((c.min!=null&&n<c.min)||(c.max!=null&&n>c.max))return `「${c.l}」需介於 ${c.min}–${c.max}`}}
 return ''}
