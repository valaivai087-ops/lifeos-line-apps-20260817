<script>
const $=s=>document.querySelector(s), main=$('#main'), side=$('#side');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plain=s=>s.replace(/\*\*/g,'');
const pad=n=>String(n).padStart(2,'0');
function inl(s){
  const h=esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*\*/g,'');
  return h.replace(/^([^｜<]{1,14})｜/,'<span class="lb">$1</span>');
}

// ---- 解析資料 ----
const docs=[];let cur=null;
$('#data').textContent.split(/\r?\n/).forEach(raw=>{
  const l=raw.trim();
  const m=l.match(/^@@DOC (\w+)\|(.+)$/);
  if(m){cur={id:m[1],title:m[2],blocks:[]};docs.push(cur);return}
  if(!cur||!l)return;
  const B=cur.blocks,last=B[B.length-1];
  if(l[0]==='|'){
    if(/^\|[\s:\-|]+$/.test(l))return;
    const cells=l.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
    if(last&&last.t==='tb')last.rows.push(cells);else B.push({t:'tb',rows:[cells]});
    return;
  }
  const qa=l.match(/^>>\s*(\S+?)｜(.+?)\s*⟹\s*(.+)$/);
  if(qa){B.push({t:'qa',src:qa[1],q:qa[2],a:qa[3]});return}
  const h=l.match(/^(#{1,4})\s+(.+)$/);
  B.push(h?{t:'h',lv:h[1].length,text:h[2]}:{t:'p',text:l});
});
docs.forEach(d=>{let sec=d.title;d.blocks.forEach((b,i)=>{
  b.i=i;if(b.t==='h')sec=plain(b.text);b.sec=sec;
  b.plain=b.t==='tb'?b.rows.map(r=>r.filter(Boolean).join('　')).join(' / '):b.t==='qa'?`${b.src} ${plain(b.q)} → 小行動：${b.a}`:plain(b.text);
})});
const docOf=id=>docs.find(d=>d.id===id);

// ---- 100節點整合 ----
const nodes=[];
const NN=n=>nodes[n]||(nodes[n]={n,name:'',layer:'',desc:'',app:'',appWhy:'',q:[],info:[],src:[]});
function walk(id,fn){const d=docOf(id);if(!d)return;let h=null;d.blocks.forEach(b=>{if(b.t==='h')h=b;fn(b,h,d)})}
const isLayer=h=>h&&/^第.層/.test(plain(h.text));
walk('d1',(b,h,d)=>{if(b.t!=='p'||!isLayer(h))return;const m=plain(b.text).match(/^(\d{2,3})｜(.+?)：(.+)$/);
  if(m){const o=NN(+m[1]);o.name=m[2];o.desc=m[3];o.layer=plain(h.text);o.src.push([d.id,b.i])}});
walk('d2',(b,h,d)=>{if(b.t!=='p'||!isLayer(h))return;const m=plain(b.text).match(/^(\d{2,3})｜(.+?)→(.+)｜([^｜]+)$/);
  if(m){const o=NN(+m[1]);o.app=m[3];o.appWhy=m[4];o.src.push([d.id,b.i])}});
let cn=null;
['d4','d3'].forEach(id=>walk(id,(b,h,d)=>{
  if(b.t==='h'){const m=plain(b.text).match(/^(\d{2,3})｜(.+)$/);cn=m&&b.lv===3?NN(+m[1]):null;if(cn)cn.src.push([d.id,b.i]);return}
  if(!cn||b.t!=='p')return;const t=plain(b.text);
  let m=t.match(/^金句\d｜(.+)$/);if(m){cn.q.push(m[1]);return}
  m=t.match(/^([^｜]{1,6})｜(.+)$/);if(m)cn.info.push([m[1],m[2]]);
}));
const nodeList=nodes.filter(Boolean);
const layers=[...new Set(nodeList.map(o=>o.layer))];

// ---- 狀態與畫面 ----
let view='doc',docId=docs[0].id,nodeN=1,layer='';
function hl(root,terms){
  if(!terms.length)return;
  const re=new RegExp('('+terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];
  while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(n=>{re.lastIndex=0;if(!re.test(n.data))return;re.lastIndex=0;
    const s=document.createElement('span');s.innerHTML=esc(n.data).replace(re,'<mark>$1</mark>');n.replaceWith(...s.childNodes)});
}
function blockHTML(d,b){
  const id=`b-${d.id}-${b.i}`;
  if(b.t==='h')return `<h${b.lv+1} id="${id}">${inl(b.text)}</h${b.lv+1}>`;
  if(b.t==='p')return `<p id="${id}">${inl(b.text)}</p>`;
  if(b.t==='qa')return `<div class="qa" id="${id}"><div class="qq"><span class="src">${esc(b.src)}</span>${esc(plain(b.q))}</div><div class="qact"><span class="lb">小行動</span>${esc(b.a)}</div></div>`;
  const n=Math.max(...b.rows.map(r=>r.length));
  return `<div class="tw" id="${id}"><table>`+b.rows.map((r,ri)=>{
    const only=ri>0&&r.slice(1).every(c=>!c);
    const tag=ri===0?'th':'td';
    return '<tr>'+(only?`<td colspan="${n}">${inl(r[0])}</td>`:r.map(c=>`<${tag}>${inl(c)}</${tag}>`).join(''))+'</tr>';
  }).join('')+'</table></div>';
}
function renderSide(){
  if(view==='doc'){
    const d=docOf(docId);
    side.innerHTML=`<div class="sh">文件（${docs.length}）</div>`+docs.map(x=>`<button class="it${x.id===docId?' on':''}" data-doc="${x.id}">${esc(x.title)}</button>`).join('')+
      `<div class="sh">本文目錄</div><div class="toc">`+d.blocks.filter(b=>b.t==='h'&&b.lv<=3).map(b=>`<button class="it l${b.lv+1}" data-go="${b.i}">${esc(plain(b.text))}</button>`).join('')+'</div>';
  }else{
    const list=nodeList.filter(o=>!layer||o.layer===layer);
    side.innerHTML=`<div class="sh">依層篩選</div><select id="ly"><option value="">全部 10 層（${nodeList.length} 節點）</option>`+
      layers.map(l=>`<option${l===layer?' selected':''}>${esc(l)}</option>`).join('')+`</select><div class="sh">節點</div>`+
      list.map(o=>`<button class="it${o.n===nodeN?' on':''}" data-node="${o.n}">${pad(o.n)}　${esc(o.name)}</button>`).join('');
    $('#ly').onchange=e=>{layer=e.target.value;renderSide()};
  }
}
function nodeHTML(o){
  const i=nodeList.indexOf(o),pv=nodeList[i-1],nx=nodeList[i+1];
  return `<div class="card"><div class="mute">${esc(o.layer)}</div><h2>${pad(o.n)}｜${esc(o.name)}</h2><p class="lead">${esc(o.desc)}</p>`+
   (o.app?`<div class="app"><span class="lb">LifeOS APP</span><b>${esc(o.app)}</b><div class="mute">${esc(o.appWhy)}</div></div>`:'')+
   `<h3>六句金句</h3><ol class="quotes">${o.q.map(x=>`<li>${esc(x)}</li>`).join('')||'<li>（無）</li>'}</ol>`+
   `<h3>產品・機制・證據</h3>${o.info.map(([k,v])=>`<p><span class="lb">${esc(k)}</span>${esc(v)}</p>`).join('')}`+
   `<h3>原始出處</h3>${o.src.map(([id,bi])=>`<button class="link" data-d="${id}" data-i="${bi}">${esc(docOf(id).title)}</button>`).join('')}`+
   `<div class="nav">${pv?`<button class="btn" data-node="${pv.n}">← ${pad(pv.n)} ${esc(pv.name)}</button>`:'<span></span>'}${nx?`<button class="btn" data-node="${nx.n}">${pad(nx.n)} ${esc(nx.name)} →</button>`:''}</div>`+
   `<p class="note">醫療邊界：心理與人格重建不得替代標準癌症治療；產品僅在安全與證據允許範圍內支持具體生理需求，使用前請由醫療團隊確認。</p></div>`;
}
function snip(t,terms){
  if(t.length<=160)return t;
  const p=Math.max(0,t.toLowerCase().indexOf(terms[0])-60);
  return (p>0?'…':'')+t.slice(p,p+160)+(p+160<t.length?'…':'');
}
let results=[];
function renderSearch(q){
  const terms=q.split(/\s+/).filter(Boolean);
  results=[];
  docs.forEach(d=>d.blocks.forEach(b=>{const t=b.plain.toLowerCase();if(terms.every(x=>t.includes(x)))results.push([d,b])}));
  main.innerHTML=`<p class="mute">「${esc(q)}」共 ${results.length} 筆${results.length>400?'（顯示前 400 筆）':''}</p>`+
    results.slice(0,400).map(([d,b],k)=>`<div class="res" data-k="${k}"><div class="ctx">${esc(d.title)} › ${esc(b.sec)}</div><div>${esc(snip(b.plain,terms))}</div></div>`).join('');
  hl(main,terms);
}
function render(){
  const q=$('#q').value.trim().toLowerCase();
  document.querySelectorAll('.tabs button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  renderSide();
  if(q){renderSearch(q);return}
  if(view==='doc'){const d=docOf(docId);main.innerHTML=`<article>${d.blocks.map(b=>blockHTML(d,b)).join('')}</article>`;if(d.id==='d10')addCopy()}
  else main.innerHTML=nodeHTML(nodes[nodeN]);
}
// 臉書貼文：每篇標題旁的「複製本篇」
function copyText(t){
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t);
  const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
  const ok=document.execCommand('copy');ta.remove();return ok?Promise.resolve():Promise.reject();
}
function addCopy(){
  main.querySelectorAll('article h3').forEach(h=>{
    const title=[...h.childNodes].filter(n=>!(n.classList&&n.classList.contains('lb'))).map(n=>n.textContent).join('').trim();
    const b=document.createElement('button');b.className='btn cp';b.textContent='複製本篇';
    b.onclick=()=>{
      const parts=[title];let el=h.nextElementSibling;
      while(el&&!/^H[23]$/.test(el.tagName)){parts.push(el.innerText.trim());el=el.nextElementSibling}
      copyText(parts.join('\n\n')).then(()=>b.textContent='已複製 ✓',()=>b.textContent='複製失敗');
      setTimeout(()=>b.textContent='複製本篇',1600);
    };
    h.appendChild(b);
  });
}
function goBlock(id,bi,terms){
  const el=document.getElementById(`b-${id}-${bi}`);if(!el)return;
  el.scrollIntoView({block:'center'});if(terms)hl(el,terms);
  el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),2000);
}
function showDoc(id,bi,terms){view='doc';docId=id;$('#q').value='';render();if(bi!=null)goBlock(id,bi,terms);else scrollTo(0,0)}
function showNode(n){view='node';nodeN=n;$('#q').value='';render();scrollTo(0,0)}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-doc],[data-go],[data-node],[data-d],[data-k],[data-v]');if(!t)return;
  if(t.dataset.v){view=t.dataset.v;$('#q').value='';render();scrollTo(0,0)}
  else if(t.dataset.doc)showDoc(t.dataset.doc);
  else if(t.dataset.go!=null)goBlock(docId,+t.dataset.go);
  else if(t.dataset.node)showNode(+t.dataset.node);
  else if(t.dataset.d)showDoc(t.dataset.d,+t.dataset.i);
  else if(t.dataset.k!=null){const terms=$('#q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);const [d,b]=results[+t.dataset.k];showDoc(d.id,b.i,terms)}
});
$('#rnd').onclick=()=>{const o=nodeList[Math.floor(Math.random()*nodeList.length)];showNode(o.n)};
let tm;$('#q').addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(()=>{render();scrollTo(0,0)},160)});
const setH=()=>document.documentElement.style.setProperty('--hh',$('header').offsetHeight+'px');
addEventListener('resize',setH);setH();
render();
</script>
