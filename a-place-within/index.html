function render(){document.documentElement.lang=lang==='en'?'en':'zh-Hant';document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('active',x.dataset.lang===lang));$('#heroTitle').innerHTML=b('把心安放回生活裡','Make room for your own life.');$('#heroText').innerHTML=b('從語言、關係與存在出發，閱讀自己的處境。讓一個小小的行動，成為今天的開始。','Read your situation through language, relationships, and existence. Let one small action become a beginning.');$('#stats').innerHTML=`<span><b>20</b>${t('雙語主題','bilingual themes')}</span><span><b>1,306</b>${t('原文段落','source paragraphs')}</span><span><b>${done.length}/20</b>${t('已完成行動','steps completed')}</span>`;$('#nav').innerHTML=tabs.map(([id,z,e])=>`<button class="${view===id?'active':''}" data-view="${id}">${t(z,e)}</button>`).join('');$('#footer').innerHTML=b('來源：心病.docx。主題內容為新編哲學導讀，並非原對話回覆或哲學家逐字引言。完整原文保留中文，尚未逐段英譯。','Source: 心病.docx. The thematic material is a newly written philosophical reading guide, not recovered chat replies or verbatim quotations from philosophers. The full source remains in Chinese and has not been translated paragraph by paragraph.');renderMain()}
function filtered(){return TOPICS.map((x,i)=>({x,i})).filter(({x,i})=>(!onlyFav||favs.includes(i))&&(!query||x.join(' ').toLowerCase().includes(query.toLowerCase())))}
function toolbar(){return `<div class="toolbar"><input type="search" id="search" aria-label="${t('搜尋','Search')}" placeholder="${t('搜尋主題、關鍵字或行動…','Search topics, keywords, or actions…')}" value="${esc(query)}"><button id="favFilter" class="${onlyFav?'active':''}">♡ ${t('我的收藏','Favorites')}</button></div>`}
function cards(){const a=filtered();return a.length?`<div class="grid">${a.map(({x,i})=>`<article class="card"><div class="tag">${t(x[2],x[3]).toUpperCase()}</div><span class="number">${String(i+1).padStart(2,'0')}</span><h2>${b(x[0],x[1])}</h2><p>${b(x[6],x[7])}</p><div class="actions"><button data-open="${i}">${t('開始閱讀 ↗','Read ↗')}</button><button data-fav="${i}" aria-label="${t('收藏','Favorite')}">${favs.includes(i)?'♥':'♡'}</button></div></article>`).join('')}</div>`:`<p>${t('沒有符合的主題，請試試其他關鍵字。','No matching topics. Try another keyword.')}</p>`}
function renderMain(){let html='';if(view==='explore'){html=toolbar()+'<div id="results">'+cards()+'</div>'}
if(view==='map'){html=`<div class="eyebrow">CONNECTIONS</div><h2>${b('從心出發，向生活展開','From inner life to everyday living')}</h2><p>${b('點選一個入口，探索相關主題。這是新編導覽，並非原文件的既有章節。','Choose an entry point to explore related themes. This is a newly organized guide, not the document’s original chapter structure.')}</p><div class="root">${t('在生活中，重新理解自己','Understanding yourself in everyday life')}</div><div class="tree">${[['語言與理解','Language & understanding','語言'],['自我與邊界','Self & boundaries','自我'],['關係與連結','Relationships & connection','關係'],['存在與選擇','Existence & choice','存在'],['信仰與寬恕','Faith & forgiveness','信仰'],['身體與原文','Body & source material','原文資料']].map(([z,e,k])=>`<button data-topic="${k}">${b(z,e)}<span class="en">↗</span></button>`).join('')}</div>`}
if(view==='framework'){html=`<div class="eyebrow">PHILOSOPHICAL LENSES</div><h2>${b('從一句話，走向一個行動','From a sentence to an action')}</h2><div class="notice">${b('以下是應用性的哲學詮釋，不是疾病解釋，也不是引用哲學家的原話。','The following is an applied philosophical interpretation, not an explanation of disease or a direct quotation from a philosopher.')}</div><div class="grid"><article class="card"><div class="tag">WITTGENSTEIN</div><h2>${b('詞語在生活中做了什麼？','What do words do in life?')}</h2><p>${b('借用語言遊戲與生活形式的視角，將「失敗」「應該」「值得」放回實際使用的情境，看看它們如何影響我們與他人的互動。','Drawing on language-games and forms of life, return words such as “failure,” “should,” and “worthy” to their contexts of use, and examine their roles in interactions.')}</p></article><article class="card"><div class="tag">HEIDEGGER</div><h2>${b('我正在如何生活？','How am I living?')}</h2><p>${b('借用在世存在、常人與有限性的視角，思考自己已經身處的關係、承接的期待，以及願意投入的可能性。','Drawing on being-in-the-world, “the they,” and finitude, consider your existing relationships, inherited expectations, and the possibilities you are willing to take up.')}</p></article><article class="card"><div class="tag">EVERYDAY PRACTICE</div><h2>${b('讓理解回到日常','Return understanding to daily life')}</h2><p>${b('不必把一個詞當作永久判決。描述處境，辨認自己的選擇，讓小行動改變下一次互動。','A word need not become a permanent verdict. Describe the situation, recognize a choice, and let a small action change the next interaction.')}</p></article></div><div class="flow">${[['01','描述情境','Describe the situation'],['02','辨認語言','Notice the language'],['03','看見選擇','Recognize a choice'],['04','採取小行動','Take a small step']].map(([n,z,e])=>`<div><b>${n}</b>${b(z,e)}</div>`).join('')}</div>`}
if(view==='table'){html=`<div class="toolbar"><h2>${t('二十個主題，一頁回看','Twenty themes at a glance')}</h2><button id="download">${t('下載雙語表格','Download bilingual table')}</button></div><div class="tablewrap"><table><thead><tr><th>#</th><th>${t('主題','Theme')}</th><th>${t('理解的起點','Starting point')}</th><th>${t('最小行動','Small step')}</th></tr></thead><tbody>${TOPICS.map((x,i)=>`<tr><td>${i+1}</td><td>${b(x[0],x[1])}</td><td>${b(x[6],x[7])}</td><td>${b(x[8],x[9])}</td></tr>`).join('')}</tbody></table></div>`}
if(view==='source'){html=`<h2>${b('完整原文閱讀庫','Complete source library')}</h2><div class="notice">${b('保留文件的 1,306 個非空段落及其順序。原文尚未逐段英譯；其中疾病因果、療法、藥物與補充品劑量等主張未經核實，不構成本 App 的建議。原對話回覆及其附件圖片尚未取得。','All 1,306 nonempty document paragraphs are preserved in order. A paragraph-by-paragraph English translation is not yet available. Claims about disease causation, treatments, drugs, and supplement dosages are unverified and are not recommendations from this app. The original chat replies and attachment images have not been recovered.')}</div><input type="search" id="sourceSearch" aria-label="${t('搜尋中文原文','Search Chinese source')}" placeholder="${t('搜尋中文原文…','Search the Chinese source…')}" value="${esc(query)}"><div id="sourceResults"></div>`}
if(view==='journal'){html=`<div class="journal"><div class="eyebrow">ONE SMALL STEP</div><h2>${b('今天，從一件小事開始','Today, begin with one small thing')}</h2><p>${b('記錄只儲存在目前瀏覽器。你可以匯出備份；清除瀏覽資料會刪除這些紀錄。','Entries are saved only in this browser. Export a backup; clearing browser data removes these entries.')}</p><div class="progress"><span style="width:${done.length*5}%"></span></div>${TOPICS.map((x,i)=>`<p><label><input type="checkbox" data-done="${i}" ${done.includes(i)?'checked':''}> ${b(x[8],x[9])}</label></p>`).join('')}<h2>${t('留給自己的筆記','A note to yourself')}</h2><textarea id="note" aria-label="${t('私人筆記','Private note')}" placeholder="${t('今天，我注意到……','Today, I noticed…')}">${esc(read('heart-note',''))}</textarea><p id="saveStatus"></p><button id="exportNote">${t('匯出筆記與進度','Export notes and progress')}</button></div>`}
if(view==='about'){html=`<h2>${b('資料與完成範圍','Sources and coverage')}</h2><div class="notice">${b('本 App 已收錄文件全部可擷取文字；它不是原 ChatGPT 對話的完整重製，也不是完整雙語逐字版本。','This app includes all extractable document text. It is not a complete reproduction of the original ChatGPT conversation or a fully translated bilingual edition.')}</div><div class="grid"><article class="card"><h2>${b('已收錄','Included')}</h2><p>${b('心病.docx 的全部非空段落、20 個新編雙語主題摘要與行動、哲學框架、心智圖導覽、搜尋、收藏與私人筆記。','All nonempty paragraphs from 心病.docx; 20 newly authored bilingual topic summaries and actions; philosophical framework; mind-map navigation; search; favorites; and private notes.')}</p></article><article class="card"><h2>${b('尚未取得或完成','Not yet recovered or completed')}</h2><p>${b('原 ChatGPT 回覆、原對話中的二十篇貼文與金句、文件圖片、全文逐段英譯。新增導讀不能視為那些內容的還原。','The original ChatGPT replies, the conversation’s twenty posts and quotations, document images, and a paragraph-by-paragraph English translation. The new guide does not reconstruct those materials.')}</p><a href="https://chatgpt.com/c/6ad29613-c7b8-83ee-8217-8ca5fe2c9c1e" target="_blank" rel="noopener">${t('開啟原對話 ↗','Open original conversation ↗')}</a></article><article class="card"><h2>${b('閱讀的立場','Reading approach')}</h2><p>${b('以維根斯坦的語言使用與海德格的存在分析作為導讀視角。原文中的傳統科學說法只作來源保存，不用來建立導讀理論；未引入無法核實的前沿科學說法。','The reading guide draws on Wittgenstein’s attention to language use and Heidegger’s analysis of existence. Traditional scientific claims are retained as source material, not used as the guide’s theoretical basis; unverified frontier-science claims have not been introduced.')}</p></article></div>`}
$('#main').innerHTML=html;if(view==='source')renderSource();}
function renderSource(){const el=$('#sourceResults');if(!source){el.innerHTML='<p>'+t(sourceError?'原文載入失敗，請重新整理。':'載入原文中…',sourceError?'Source failed to load. Please refresh.':'Loading source…')+'</p>';return}const a=source.paragraphs.map((s,i)=>({s,i})).filter(x=>!query||x.s.toLowerCase().includes(query.toLowerCase()));const count=Math.max(1,Math.ceil(a.length/35));page=Math.min(page,count-1);el.innerHTML=`<p>${a.length} ${t('段符合','paragraphs found')} · ${t('中文原文','Chinese original')}</p><div class="source">${a.slice(page*35,(page+1)*35).map(({s,i})=>`<p id="p${i+1}"><small>${i+1}</small>${esc(s)}</p>`).join('')}</div><div class="pagination"><button data-page="${page-1}" ${page===0?'disabled':''}>←</button><span>${page+1} / ${count}</span><button data-page="${page+1}" ${page>=count-1?'disabled':''}>→</button></div>`}
function openTopic(i){const x=TOPICS[i];$('#detail').innerHTML=`<h2>${b(x[0],x[1])}</h2><div class="tag">${t('新編哲學導讀 · 不是逐字引用','NEW PHILOSOPHICAL GUIDE · NOT A DIRECT QUOTATION')}</div><p class="detail">${b(x[6],x[7])}</p><h3>${t('一個值得問的問題','A question to sit with')}</h3><p class="quote">${b('在這個處境中，我用什麼詞語描述自己？這個描述為我打開或關閉了哪些可能？','What words do I use to describe myself in this situation? Which possibilities does that description open or close?')}</p><h3>${t('最小行動','A small step')}</h3><p>${b(x[8],x[9])}</p><button data-copy="${i}">${t('複製雙語摘要','Copy bilingual summary')}</button> <button data-jump="${x[4]}">${t('閱讀相關原文區段','Read related source range')}</button><p class="en">${t('原文區段依文件順序提供，並非原作者的主題分類。','Source ranges follow document order and are not the original author’s topic categories.')}</p>`;$('#dialog').showModal()}
function download(name,content,type){const u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.addEventListener('click',async e=>{const q=e.target.closest('button');if(!q)return;if(q.dataset.lang){lang=q.dataset.lang;save('heart-lang',lang);render()}if(q.dataset.view){view=q.dataset.view;query='';page=0;render()}if(q.id==='favFilter'){onlyFav=!onlyFav;renderMain()}if(q.dataset.open!==undefined)openTopic(+q.dataset.open);if(q.dataset.fav!==undefined){let i=+q.dataset.fav;favs=favs.includes(i)?favs.filter(x=>x!==i):[...favs,i];save('heart-favs',favs);renderMain()}if(q.dataset.topic){view='explore';query=q.dataset.topic;onlyFav=false;render()}if(q.dataset.page!==undefined){page=+q.dataset.page;renderSource();$('#sourceSearch').scrollIntoView({block:'start'})}if(q.id==='closeDialog')$('#dialog').close();if(q.dataset.jump!==undefined){$('#dialog').close();view='source';query='';page=Math.floor(+q.dataset.jump/35);render();setTimeout(()=>$('#p'+(+q.dataset.jump+1))?.scrollIntoView({block:'center'}),50)}if(q.dataset.copy!==undefined){const x=TOPICS[+q.dataset.copy],v=[x[0],x[1],x[6],x[7],x[8],x[9]].join('\n\n');try{await navigator.clipboard.writeText(v);toast('已複製','Copied')}catch{toast('無法自動複製，請選取文字複製。','Please select and copy the text manually.')}}if(q.id==='download'){let rows=[['編號 / No.','主題 / Theme','說明 / Guide','行動 / Action'],...TOPICS.map((x,i)=>[i+1,x[0]+' / '+x[1],x[6]+' / '+x[7],x[8]+' / '+x[9]])];download('heart-bilingual.csv','\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}if(q.id==='exportNote')download('heart-notes.json',JSON.stringify({note:read('heart-note',''),completed:done.map(i=>({id:i+1,title:TOPICS[i][0],en:TOPICS[i][1]})),favorites:favs.map(i=>i+1)},null,2),'application/json')});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;$('#results').innerHTML=cards()}if(e.target.id==='sourceSearch'){query=e.target.value;page=0;renderSource()}if(e.target.id==='note')$('#saveStatus').textContent=save('heart-note',e.target.value)?t('已儲存在此瀏覽器','Saved in this browser'):t('儲存失敗，請匯出備份。','Save failed. Please export a backup.')});
document.addEventListener('change',e=>{if(e.target.dataset.done!==undefined){const i=+e.target.dataset.done;done=e.target.checked?[...new Set([...done,i])]:done.filter(x=>x!==i);save('heart-done',done);$('#stats').lastElementChild.innerHTML=`<b>${done.length}/20</b>${t('已完成行動','steps completed')}`;$('.progress span').style.width=done.length*5+'%'}});
source={"paragraphs": ["9 種基本的自我防衛機制", "當你談論好事，你就會引出好事。當你談論負面的事時，你就會引發壞事。", "要試著把心思從自我轉移，別再抱著「你能為我做什麼」的心態而活。要用「我能做什麼來幫助別人、我要怎樣讓你過得更好、我要如何鼓勵你」的心態來取代。要確保你是投資在人身上，而不是一直提領他們情感的積蓄。我喜歡把我的人際關係想成是「情感的銀行帳戶」。你和每個有關係的人之間，都有個戶頭，這些人包括家人、事業夥伴、朋友，甚至是你巧遇的人，你與他們每個人都有一個情感帳戶。每次你與他們互動，你若不是在儲蓄，就是在提領。當你讚美人，就是在儲蓄。還有一種隱約但奇妙的儲蓄方法，就是", "為什麼你的生活不必完美才能實踐感恩", "感恩不僅是最偉大的美德，而且是所有其他美德的根源——西塞羅（106-43BC）", "我們對感恩如此漠不關心的最大原因之一是因為我們是一個快節奏且壓力很大的社會。放慢腳步並欣賞生活中已經存在的美好事物似乎是異想天開、不切實際，有時簡直是歇斯底里。我的意思是，你有沒有嘗試過在分手、葬禮或混亂的家庭中表達感激之情？當你感到沮喪、感覺世界末日來臨的時候，你是否嘗試過表達感激之情？", "一切都有一個時間和地點，感恩可以很容易地被用來作為一種在情感上或精神上繞過經歷當下出現的痛苦的方式。因此，本文絕對不是建議您濫用感恩作為逃避問題或不切實際的方式。當您感到壓力、憤怒或沮喪時，首先要正視這些情緒，這一點很重要。不要試圖給他們貼上感恩創可貼——這只是不合適的地點和時間。相反，深呼吸，保持正念，照顧好自己。感恩可以稍後到來。", "話雖這麼說，你的生活不一定要完美才能實踐感恩。到底什麼是完美？這是一個由頭腦創造的概念，而頭腦是非常不可預測的，永遠追求更多。如果你等待你的生活變得完美來練習感恩，你會等待非常非常長的時間。", "感恩的美妙之處在於，它可以幫助我們感受到快樂和滿足，無論我們的生活看起來多麼混亂、有缺陷或忙碌。事實上，當我們設法感謝我們所擁有的一切時，我們實際上會感到最強烈的感激之情，儘管我們的生活感覺多麼不完美。感恩幫助我們體認到一切本來就很好，幫助我們停止爭鬥、奮鬥和追逐幸福──這只會讓我們更加不快樂。", "感恩將我們錨定在當下。正如您可能已經或可能沒有了解的那樣，當下是我們必須找到平靜和滿足的唯一時刻。這聽起來似乎是顯而易見的，但我們許多人忘記了過去和未來不能為我們帶來幸福，因為它們根本不存在於當下。感恩是幫助我們體驗不斷渴望的快樂的強大工具之一。", "贊助商連結", "科學證明感恩的 7 個好處", "科學家、神經學家和心理學家都對感恩領域越來越感興趣。以下是關於感恩的研究揭示：", "1. 多一些內容，少一些物質主義", "物質主義（購買東西讓我們快樂）實際上讓我們不快樂，這並不奇怪。雖然購物時多巴胺的暫時爆發讓我們產生一種錯覺，認為這些東西讓我們“快樂”，但這種感覺很快就會消失。很快，我們在精神上和情感上就迷上了物質財富創造幸福的信念。就像癮君子一樣，我們不斷購買越來越多的東西，這耗盡了我們的口袋，讓我們在一天結束時感到空虛。", "研究表明，感恩可以讓我們減少物質主義和對其他人的嫉妒。這種滿足的能力其實可以提高幸福感和長期幸福感。", "2. 更有同理心和寬容", "事實證明，感恩可以增強同理心和我們關心他人的能力。當面對攻擊者時，感恩的人會表現出較少的反應，並且更關心和理解對方。", "3.保護你免受壓力", "感恩其實有助於減輕身心的生理和心理壓力。壓力也是心身症（或源自心理困擾的疾病）的一個主要原因，這意味著感恩有助於平靜整個身體。研究人員還發現，感恩可以幫助我們在經歷壓力和逆境時成功應對。", "4.幫助你睡得更深", "有趣的是，感恩其實可以幫助你睡得更好。 2009 年的一項研究發現，感恩有助於增加睡眠深度和時間。用研究人員的話說，“感恩預示著更高的主觀睡眠品質和睡眠持續時間，以及更少的睡眠潛伏期和白天功能障礙。”", "5. 增強靈性", "表達感激之情也可以幫助我們感受到更多的愛、關心和心靈上的連結。一項研究得出的結論是，感恩可以建立並加強我們的靈性意識，這當然會大大增加我們內心的幸福感。", "6.更充實的關係", "事實證明，對周遭的人心存感激不僅可以增強歸屬感和連結感，還可以增加我們的關係幸福感。用一項研究的話來說：“感恩可以幫助客戶享受從他人那裡得到的好處，從而擴大人們從與他人積極的社交互動中獲得的情感益處。”這項發現具有驚人的意義……這意味著，只要找到值得感恩的事情，我們就可以克服社會關係中的憤怒和怨恨等問題，並在與他人相處時感到更快樂。", "7.長期的幸福", "研究人員發現，從長遠來看，感恩實際上可以增加你的幸福感和幸福感。當定期透過寫日記練習感恩時，研究參與者第一週的幸福感增加了2%，第一個月後增加了5%，六個月後增加了9%——而這只是透過每週練習一次感恩日記！想像一下，透過每天寫日記，你的幸福感會增加多少？ （下面有更多相關內容。）", "身份薄弱的症狀包括：", "在戀愛關係中失去自我意識", "相互依賴傾向（你的幸福依賴別人的幸福）", "與父母糾纏不清（很難將你的想法和感受與父母的想法和感受分開）", "無法建立牢固的邊界（導致大量能量損失）", "優先事項分散（例如不知道如何管理時間和精力）", "漫無目的且難以設定目標", "不知道自己想做什麼", "群體心態（即根據一群人所持有的理想創造身份的傾向）", "更容易受到同儕壓力的影響（也就是受到他人的壓力，去做一些讓你感到不舒服或不真實的事情）", "同理心超載（過度同情他人而迷失了自己）", "社交焦慮（因為沒有明確的身份而感到被他人壓倒）", "自尊心低（身份薄弱+不太了解自己=對自己感到懷疑和懷疑的傾向）", "慢性低度至強烈焦慮（由於自我意識薄弱，感覺不到「家」）", "對生活感到迷失", "被他人利用的傾向", "遵循別人對「快樂」或「成功」的定義", "與你的真實需求、慾望和夢想脫節", "內心空虛的感覺", "自我所扮演的四種破壞自我成長的角色", "自我防衛機制的四種角色是：", "1. 無辜的旁觀者", "任何人自我成長旅程中最大的障礙之一就是欺騙自己，認為自己沒有做錯任何事。這可能就是為什麼成癮者康復中的第一步就是承認他們有問題。大多數人活在否認或迴避之中，否認需要好好審視自己，因為這使他們無法正確認識自己更令人討厭的特質和能力。", "「世界亂了，我卻無罪」是他們的基本人生觀。他們拒絕看到自己的行為和生活方式與周圍的外在世界之間的相互連結。", "2. 無辜的批評家", "這種防禦機制與無辜旁觀者非常相似，只不過這種防禦機制透過主動批評世界和周圍的人來避免內疚。批評是我們反抗社會、尋求出路的一種方式，是一種想要脫離「群體」的方式，同時仍感到一種虛假的參與感。", "不要誤會我的意思：批判性思考是任何人自我成長的必要工具。但這些「批評者」常常使用批判性思考來增強自我，並感覺自己比那些沒有意識到批評者擁有什麼的「群體」更聰明。不幸的是，僅僅注意到世界事態的問題是不夠的，除非你積極地解決問題。", "3. 無罪的受害者", "我確信我們都曾經遇過生活中憤怒的受害者，他們將自己100%的困難歸咎於他人或世界。但每個人都在某種程度上將責備作為一種防衛機制。事實上，我們為自己辯護的是我們自己應對所經歷的不愉快經驗的責任。", "沉迷於責備就是放棄個人責任，並在精神上將其委託給別人，說服自己對自己的生活狀況不負有責任，而是將其歸咎於某種「外在力量」。無可指責的受害者自我防衛機制使我們無法清楚地看到我們是如何加劇自己的痛苦的。", "從本質上講，無可指責的受害者是我們自我最激烈的保護者之一。它讓我們覺得我們永遠不會讓自己失望，或者我們缺乏成熟度或力量來接受我們所面臨的現實情況。相反，無論發生什麼，都不是我們自己不足的證據，而是別人的不足的證據。", "4.全能控制器", "最後，我們來到了全能的控制者——自我角色，它以無敵為幌子，試圖誤導性地保護我們。讓我們花點時間停下來欣賞我們善意的部分：畢竟，它只是希望我們安全。然而，困難在於這種自我防衛機制佔據了萬能的地位。它假設，如果我們嘗試控制一切，我們最終就會「安全」。事實上事實恰恰相反。我們越是試圖控制自己、別人和生活，就越痛苦。我們最終會壓迫自己，排斥我們所愛的人，抵制生活的洪流。事實上，真正的力量並不在於基於恐懼的控制，而是以愛為中心的正念。我們將在下面對此進行更多探討。", "如何將自己從有害的自我防衛機制中解放出來", "在你學習如何從上述自我防禦機制中撤消、重寫和解除你的思維之前，我想強調一些重要的事情：", "並非所有的心理模式都是壞的。", "有時候，面對令人心碎的困難時，需要有一定的信念才能激勵自己。有時我們需要急於下結論並做出假設，以保護自己免受危險（例如，假設潛伏在街角的穿著深色連帽衫的傢伙可能會試圖搶劫你。）如果沒有慾望，就不可能取得進展生活。", "但是，當心理模式開始乾擾我們的心理、情緒和精神健康時，它們就會成為心理 陷阱 ，而我們很難擺脫它們。", "下面，我將分享如何將自己從這些自我防衛機制的破壞性影響中解放出來：", "1. 練習自我探究", "當你內心出現負面情緒時，探究它。把自己想像成精神分析師、教師、科學家、觀察者——無論什麼詞對你有吸引力——並檢視它的本質。", "提出以下問題：", "我感覺如何？", "這種感覺的根源是什麼？", "我可以找到什麼證據來反對這種想法/感覺？", "其他解釋可能是什麼？", "我還有什麼其他選擇？", "盡可能保持開放和好奇。如果有幫助的話，你甚至可能想透過自我探究來記錄你的經驗。了解更多關於如何寫日記的資訊。", "2. 以慈愛對待生活", "當我們檢視有毒的假設、信念、比較、慾望等所固有的能量時，我們發現這一切都源自於恐懼。這種恐懼可能是我們還不夠，我們可能會錯過，我們可能會受到傷害，我們可能會被拋棄——無論如何，這都是基於恐懼的。", "如果這篇文章對您有任何啟發或幫助，如果您考慮捐款以維持我們的生存和運轉，我們將不勝感激。迄今為止，LonerWolf 是兩人的愛情結晶了 12 年。任何金額，無論大小，對我們來說都意味著整個世界。", "3 美元5 美元7 美元10 美元25 美元", "表單的頂端", "$捐", "表單的底部", "恐懼的反面是什麼？", "答：愛。", "恐懼會收縮和關閉，而愛會打開和擴展。", "真正的喜樂發自內心，在愛與平安之間。", "培養喜樂來滋養你的靈魂", "傾聽身體發出的警訊，並採取行動非常重要。", "醫學、直覺力和肯定句。", "如果一個人的血液、免疫系統、骨骼、關節或皮膚出問題，很可能是因為有以下這些負面想法：", "無法獨活，沒人支持，沮喪不快樂絕望和無助。", "沒愛又孤單。", "容易出現關節炎、骨折、骨質疏鬆症、背痛、", "關節痛或椎間盤突出的骨骼和關節問題的人，", "很可能總是將他人的需求放在自己的需求之前，", "導致自己被照顧家人或朋友的責任壓垮。", "療癒骨骼和關節問題的肯定句：", "我滿懷愛，釋放過去。別人是自由的，我也是自由的，", "我是自己的主人。我愛自己、肯定自己。生命很美好。", "現在我的心一切都很好。", "解決影響健康的兩大要素：身體和情緒，", "就能開始用新的眼光看世界。", "健康新思維模式：", "我在生活的各領域都很平安、自在。", "我很堅強、很有能力。", "我愛自己、肯定自己。", "我以充滿愛的眼光看待我自己和我的所作所為。", "我是安全的。", "我放鬆自己進入生命之流，", "讓身體輕鬆自在提供我所需的一切。", "生命是支持我的。", "我帶著愛與喜悅看待一切。", "我與生命和平共處。", "我靈活輕鬆地看見問題的每一面。", "我在我的創造之流中保持平衡。", "我決定創造喜悅而富足的人生。", "我走向更大的美好。", "我處處可以擁有美好的事物。", "我正在學著信任生命並接受它的豐富。", "我決定讓自己所有的體驗都充滿愛與喜悅。", "#一切安好：", "凡事往簡單處想，往認真處行", "安寧治療的電影。", "～有限的生命要浪費在美好的事物上。", "可以分享生命中的美好與遺憾；", "可以回憶往日情懷，甜蜜記憶；", "可以體驗大自然的遼闊與美景", "可以感受自由、感受人世間的美好", "而內在資源不足的人，\n可能無法處理生活中的困難。\n他們常常會逃避問題，\n並感到焦慮、無助、對未來失去希望，\n即使遇到很小的挫折，\n也會容易情緒失控，感到焦慮不安。\n💫\n你可能會覺得，聽起來好難啊，\n我真有那麼大的能量嗎？ ！\n就像圖中漫畫展現的那樣，\n內在資源的能量常常被我們忽略。\n我們其實，遠比想像中的自己更強大！\n需要做的，只是打開這個內在資源的開關。\n💫\n可以嘗試做以下這些事：\n1⃣️正念冥想，與當下的自己在一起\n未來擔心也沒有用，\n過去糾結也沒法改變。\n我們能專注的，只有當下。\n觀察自己「當下」的想法和情緒，\n不要批判自己，與自己待一會兒，\n幫助你調取應對困擾的信心和資源。\n🧘‍♀️ \n2⃣️提醒自己擁有選擇權，為自己負責\n人類是唯.一可以選擇\n賦予我們的經歷何種意義的生物。\n提醒自己自主地決策每一個選擇，\n同時做自己人生的設計師，為自己負責。\n我們也可以為過去的經歷發掘正面的意義，\n堅定地豐富我們的人生敘事。\n🧘‍♀️ \n3⃣️靠近那些「足夠好的」客體\n可以是理解你、傾聽你的朋友，\n也可以是撫慰你、給你力量的音樂，\n還可以尋找專業的心理諮.詢師尋求療愈，\n幫助我們逐漸發展出更強大的內在資源。\n🎨\n你的幸福，並不取決於他人。\n請充分調取你的內在資源，相信自己，\n從今天起，\n主宰自己的人生，大膽地為它上色吧！", "自我批評是精神內耗的起源。\n適度的自省促進成長，\n過度責怪自己只會變成對自己的打擊。\n如果沒有人告訴你，那麼我來說──\n親愛的，其實你已經做得很好了。\n「自我關懷每日指南」，\n你的心靈療癒日曆，\n把你忘記如何對自己好的方式，\n一天一天地告知你。", "內在資源充裕的人，有以下共同特徵：\n1. 能夠自我主宰（Self-mastery）\n2. 能夠為自己負責\n3. 較高的修復力（Resilience）\n4. 內心有更多的平靜（Equanimity）\n5.有自我超越的能力（Be able to Transcend）\n擁有充裕的內在資源，會讓我們更有能力應付複雜的世事變遷。就像電影《氣象預報員》裡那句著名的台詞說的：「成年人的生活裡沒有容易二​​字」。經歷越多，我們越會明白，生活是起落不定的，關係是複雜的，世間的一切都隨時可能改變。\n而足夠的內在資源會讓我們在其中得以自處。在覺察到變化發生後，充裕的內在資源讓我們明白，自我仍是完好的、有功能的，外界變化並不代表自己必然也會陷入混亂。\n所謂的內在資源，歸根結底來說，就是當一些自己無法理解的痛苦的情緒發生了，一個人有信心、有能力，透過一定時間的摸索和努力，最終理解這些情緒，並處理好這些情緒，從而得到因應情境的具體策略。\n在成長過程中，我們仍有機會透過其他途徑發展出一定的內在資源。我們有可能在其它關係中遇到一些人，他們自身的內在資源是比較豐富的，能夠涵容我們內心的痛苦和破碎，並使用語言或其它方式表達出來，從而幫助我們發展出自己的內在資源。這個人可能是心理治療師、前輩、導師或其它能夠提供支持的人", "本自具足，你真的懂嗎？", "😇 本自具足：\n自己就具備⭕️滿的結果。\n我們的內在，什麼都不缺。\n我們的內在，有🈚️限的資源。\n不需要藉由外界證明。\n我們內在，\n本就有神性、人性、動物性。\n當我們允許一切如其所是，\n當我們接納一切源自於我，\n就能擁抱，完整的自我。\n\n❤️就是我們的內在，真的有無限的資源。\n只是大多數普通人不能很好地連結到自己內在的創造性潛意識，日復一日中，被生活瑣事雜事及其情緒牽著走。\n\n😇而天才，就是能夠常常連結到自己內在的創造性潛意識，善用那裡的資源，並用他最大的熱情和專注去「念起就做」。他就在不斷嘗試、驗證的過程中，把內在資源發揮到極致。", "你生命中所發生的一切，都是你\n吸引的。它們是被你心中所保持的「心\n像」吸引而來，它是客觀的，沒有好、\n壞的分別。它只是接收你的思想，然後\n以生命經驗的形式，把這些思想回應給\n你。\n\n2.你之所以無法擁有你想要的，理由\n只有一個，就是你對「不想要的」想\n得比「想要的」多。 \n\n3.我們中的大多數人，從不讓自己去\n嚮往自己真正想要的事物，因為我們不\n明白這到底是如何實現的。\n\n4.有信心地踏出第一步，你不需要\n看到整個樓梯，只要踏出第一步就好\n\n5、你現在所想的，就在創造你的未來。\n你用思想創造你的生命。因為你一直在\n思考，你就一直在創作。你最常想的、\n或最常把焦點放在上頭的，將會出現在\n你的生命中，成為你的人生。\n\n6.當你真正了解到，生命的首要目的\n就是去感覺、體驗吸引之後，你就只做\n那些會帶給你喜悅的事。然後每日感恩，\n這是財富降臨在你身上的途徑之一。\n\n7.只要稍微研究下周圍成功的人，你\n會明顯地發現，那些成功做成某件事的\n人，在做之前都並不知道該如何下手，\n他們只知道自己要去做那件事。\n\n8.學著靜下來，把注意力從你不要的\n事物，以及所有縈繞其中的情緒上移開，\n把注意力放在你期望去體驗的事物上，\n能量會流向注意力之所在。\n\n9.當內在的聲音與觀點變得比外在的\n意見更深刻、清晰、響亮時，你就主宰\n了你自己的生命\n\n10、當你開始專注於你想要的事物，你\n不想要的部分就會退去。你想要的會\n擴張。 \n\n11、獲得對自己思想的控制，就是你\n一切力量之所在。 \n\n12、你的人生目的，你說了算，生命的\n任務，由你自己來賦予。你的人生是由你\n自己創造，你的存在就是完美的象徵，\n而不需要其他人來評判，永遠\n不需要。 \n\n13、做一次對自己的要求，並相信你\n已經得到，然後在接受的部分，你只要去\n感受喜悅就好。\n\n14.每天結束時，在你睡覺之前，去\n想想一整天所發生的事。如果有任何的\n時刻或事件不是你想要的樣子，那就改用\n能使你滿意的方式在心中回放一次。當\n你完全按照你所要的樣子，在心中重新\n創造這些事件時，不好的部分會逐漸\n遺忘，好的部分會讓你充滿能量\n\n15、當你要吸引某種關係到生命中，\n千萬記得不要讓你的思想、語言、行為，\n以及周圍環境，與你所渴望的相違背。", "不要承擔任何不屬於你的責任", "✨ 當你在為他人負責的時候\n✨ 你既無法活出坦然自在的自己\n✨ 也限制了他人內在力量的生髮\n✨ 你在限制自己無限潛能的同時\n✨ 也限制了他人活出真正的自己\n✨ 當當你承擔不屬於自己的責任時\n✨ 你就是在限制所有人活出自由\n✨ 你真正意義上需要承擔的責任\n✨ 是活出一個本自具足的你自己", "愛，從來沒有離開過我們", "這世間的萬物，都在以某種方式在愛著我們，只是我們不知道而已。\n-\n就好像，我們每個人都是一條魚，我們一直生活在水里，水充滿了我們的周圍，也充滿了我們的全身，我們從來沒有離開過水。\n-\n但是，我們非得定義什麼是“水”，什麼不是“水”，然後我們終其一生都在很努力地追求我們所認為的“水”。\n-\n不是我們的生活裡沒有愛，其實，愛是無時無刻，無所不在的。\n-\n生命，宇宙，一直在以各種各樣的方式，在愛著我們，只是不一定是我們頭腦所認知的那樣，不一定是我們以為的那樣。\n-\n當我們對愛有了種種的定義，種種的要求，種種的執著時－我們的認知，就會限制我們對愛的感受力。\n-\n當我們願意停下追逐的腳步，沒有所求，僅僅只是停留，停留在這個瞬間，直到下一個瞬間。\n-\n拋開種種的「愛」相，而只是用心地去感受，你就會發現－愛一直在你之內，祂從來沒有離開過你。", "🌈 愛自己，是最好的修行", "我們每個人的佛性，是一刻都沒有離開過我們的。\n-\n當我們覺得自己做了什麼傷害他人的事情，或是做了什麼違背良知的事情時，我們就會心生愧疚，生出種種自責。\n-\n這種愧疚感可能不會明確地表達出來，但是它隨時隨地都在影響著你。\n-\n萬法唯心造。\n-\n到底什麼是業障？\n-\n業障就是所有你不喜歡自己的部分，你認為自己做得不夠好，你有種種的愧疚自責心理，你認為自己做錯了，你認為自己偏離了本心的部分。\n-\n你越是不喜歡自己，那你的業障就越是多。\n-\n到底什麼是善業？\n-\n善業就是所有你喜歡自己的部分，你做了什麼利他利己的事情，你做了什麼符合慈悲、大愛、平等，符合你的本心的事情。\n-\n你越是喜歡你自己，那你的善業就越是多。\n-\n真正地愛自己，不光是尊重自己的感受，聽從自己的內心，接納自己的一切，更是把你心內的慈悲、善意與愛活出來，帶給自己，也帶給這個世界。\n-\n當你不懂得如何正確地愛自己時，你也給了很多人有機可乘的機會。\n-\n當你不懂得愛自己時，當你厭惡自己時，當你詛咒和懲罰自己時，也會相應地有很多「演員」來共同陪你上演這齣戲。\n-\n這不光是對你自己的傷害，也是對所有這些「演員」的傷害。\n-\n因為他們在配合你演戲的時候，他們的內在也是會對自己進行譴責的，他們其實也是很痛苦的。\n-\n如果沒有覺醒的話，那麼，大家就會在這裡互相傷害，報復來報復去，一直輪迴，沒完沒了。\n-\n所有的一切，都是一體的，沒有任何的人與事是單獨存在的。所有的一切，都是因應「眾生」各種各樣的需求而存在。\n-\n當你不懂得如何正確地愛自己，當你認為自己做錯了什麼時，當你想要虐待和折磨自己時，那麼，「妖魔鬼怪」也會很多——他們也是因應你的需要而存在的。\n-\n這就是眾生皆苦的真相，很多人都不懂得如何地去愛自己－我們總是習慣性在種種傷害自己和他人的行為裡，不停地懲罰自己和他人。\n-\n然後，我們就在這裡不斷地互相傷害彼此，互相懲罰彼此，而不斷輪迴。\n-\n懲罰自己，無異於懲罰他人；而他人，也是另一個自己。\n-\n你所有發出去的，最終還是會回到你自己的身上，這本身符合最基本的宇宙法則。\n-\n起點，即是終點；終點，亦是起點。\n-\n每個人都渴望活出真善美，都渴望活出我們的本性，活出我們本性的平安，活出我們本性的喜樂和圓滿。\n-\n所以，好好地愛自己，正確地愛自己，就是最好的修行。", "真正重要的是，你是怎麼看待自己的？", "✨ 我們過去往往太過在意外界的看法\n\n✨ 真正重要的是，你怎麼看待你自己\n\n✨ 別人怎麼看待你，對你有什麼看法\n\n✨ 那是別人的事情，與你並沒有關係\n\n✨ 既然是別人的事情，那就交還回去\n\n✨ 所有你在意的東西，都會限制住你\n\n✨ 所有你執著的東西，都會給你痛苦\n\n✨ 放生他人的同時，也是在放生自己\n\n✨ 這個世界唯有一種真正金貴的關係\n\n✨ 那就是，你自己與自己之間的關係\n\n✨ 你如果處理好了與自己之間的關係\n\n✨ 那就是處理好了與所有外界的關係\n\n✨ 真正的重點不在外界，而在你自己\n\n✨ 真正要做的，是把著力點放回自己\n\n✨ 回到自己，面對自己的感受和想法\n\n✨ 尊重自己的感受和情緒，愛上自己\n\n✨ 你之所以一直以來都有缺愛的感覺\n\n✨ 是因為，你從來都沒有愛上過自己", "🌈 探究“我是誰”", "在返內探究「我是誰」時，所檢視的「我」是自我。這是自我在行使探究，真我無所謂探究。那個探究之行使，是自我。在行使探究的那個“我”，也是自我。探究的結果是，自我泯然無存，唯真我獨在。\n-\n滅絕自我最佳的方法是什麼？對修行者而言，最為簡單而樂意採行者，即是最佳的方法。所有的方法都是好的，均朝向自我融入於真我的同一目標。所謂虔愛法門的臣服方法，或真知法門的探究方法，兩者都是引領自我歸返至其源頭而融入之。\n-\n要求心思摧毀其自身，無異於使竊賊成為警察，他跟隨你，假裝尋捕竊賊，而一無所獲。所以，你必須返內而觀心思之所萌起，然後心思才能止息。\n-\n呼吸與心思，皆從同一源頭而萌起。若控制其中之一，則另一亦可控制。事實上，在探究的道路上——較正確的方法是探究：“我自何處萌起”，而非僅是“我是誰”——我們並非僅是試圖以摒除之意而說“我們不是身體，也非感知等及其他”，俾能駐止於真實，而毋寧是要設法找到“我之思維”或自我的萌起處。這種方法，包含著隱而不彰的觀呼吸。當我們觀「我之思維」萌起時，仍須觀呼吸的源頭，因為「我之思維」之萌起與呼吸之起動，皆來自同一源頭。\n-\n呼吸法或有其輔助功能，但無法觸及目標。行呼吸法時，應儆醒在心，注意“我之思維”，以尋釋其源頭，然後你會發現，呼吸氣息淺沉時，“我之思維”升揚，二者互為起伏；而更進一步，「我之思維」也將與呼吸氣息同時消沉，此際，另一輝照而無邊際的「我-我」朗現而出，持續不間斷，這就是目標所在，可賦與各種不同的稱呼－神、真我、昆達里尼、至上大力、意識等。\n- \n「我是誰」之雲，不是咒語，意謂你必須在你的內在找到「我之思維」的萌起，那是一切思維的起源處。若探究之路，​​對你難以採行，你也可持誦「我-我「，以臻同一目標。以「我」為咒語持用，並無不妥。 「我」乃神的最初稱呼。\n", "財運不好，其實是與自己的關係不好", "文｜曉輕鬆\n-\n金錢是一種純的能量，它也是你我的一部分，處理好和自己的關係，其實你與金錢的關係也會得到改善。\n-\n一個人如果很辛苦，很努力，但是一直都賺不到足夠的錢，那麼，說明這個人內在有著許許多多看不見的卡點。\n-\n當一個人無法接納自己，肯定自己，相信自己時，那麼也就是把財運擋在外面了。\n-\n當一個人對自己有著很多的負面評判，不配得心理，低價值感，那麼，也是把自己的財運給擋在外面了。\n-\n當一個人對自己有著許多的不滿，那麼，其實也無法處理好與父母的關係。\n-\n家和萬事興，當家庭不和諧的時候，一個人會有很多的防備心，無法放心地去做事情。\n-\n最重要的是，當一個人不愛自己的時候，其實，TA的財運也就被卡住了。\n-\n一個人不愛自己的時候，也無法做自己。那麼，很有可能，就找不准自己的人生賽道，找不準自己的路。找不準自己的路，就無法付出足夠的熱情和愛，無法長期堅持做一件事，無法做到踏實地累積。\n-\n金錢其實是愛與信任的能量，當一個人對自己沒有愛，做事情並非出於愛，那麼他人也難以感受到這份愛。當一個人對自己缺乏信任，那麼他人也難以對其升起信任，也就限制了TA的財運。\n-\n對自己的愛與信任，才是打開事業運和財運的關鍵。一個人越是愛自己，TA的財運就會越是好。\n-\n身弱無法擔財，其實，身弱的人有一個共通的點－不懂得如何愛自己，內心感覺不到愛，心寒，陽氣不足，那麼體內的氣血無法運作通暢，那麼就會表現為各種各樣的脾胃虛弱。\n-\n脾胃為先天之本，一個人如果脾胃虛弱，那麼，就會各種體力不足，容易困乏，容易疲累，容易鬥志不夠，心力不足。\n-\n然後，表現在事業上，就是缺乏行動力，內耗嚴重，缺乏果決的心，過於謹慎，思慮過度，想得太多，做的太少。\n-\n所以，內在的清理與重建，讓自己的心情好起來，其實才是事業運和財運改觀的重要條件。", "視覺：透過眼睛觀察色彩和形態。\n聽覺：透過耳朵辨識聲響。\n嗅覺：透過鼻子辨別氣味。\n味覺：透過口腔感受味道。\n觸覺：透過身體接觸感受物體的質地和狀態。\n靜，不是耳邊無聲，而是內心無爭。\n淨，不是身上無塵，而是內心無染。\n清，不是人生無念，而是內心無貪心", "自我關懷從來不是逃避事情或找藉口。自我關懷是主動選擇做對自己最好、愛自己的事。\n🌿那麼，該怎麼做呢？\n1⃣️不要責備自己。\n2⃣️不要過度沉湎於愧疚/後悔情緒。\n3⃣️提醒自己真正的自我關懷目標。\n🌿如何做\n1⃣️意識與覺察。偽自我關懷發生時，停下來，深呼吸。問自己「這對我來說是最好的嗎？」\n2⃣️ 慈悲心態。告訴自己，「沒關係」\n3⃣️設定界線\n4⃣️尋求支持\n🌿\n讓我們向內探尋，用真正的愛與照顧對待自己。\n因為，你值得更好的照顧，你值得真正的幸福。", "\n-\n我們真正要做的，也只是，讓自己放鬆下來，停下來，放過頭腦的種種妄想和分別，而只是讓祂浮上來。\n-\n愛無愛相。我們並不是真的缺愛，我們只是著了「愛」的相。", "我憑什麼不能做主自己的人生？", "就算最無助、最可憐的病人，也有權決定自己該過什么生活，一定要真實地面對人生，了解人生的本質，\n當你終於了解人生，就能真正地熱愛生命", "每", "個人都有 間花在對你所做的某事覺得不開心，感覺自己不夠有力量，或沒說對話，或如果你集中註意力於你所不是的事上，你就增加了它們左右你的力量。反之，認識你所擁有的素質。想想你要變成的樣子，並想起你曾經表現出那些特質的時候，你越在內心看到你想成為的，就越會成為那樣。 ……如果你對自己說正面的事，你也會變成它們。\n\n你也看過那些真正進化的人，他們面帶微笑，認知別人的偉大，他們的焦點是在協助人。那才是真正的力量，它來自你對自己所持有的內在形象。你不需要告訴別人你是否事寧靜或專注的，他們知道。溝通是心電感應式的。\n\n你送出到世界關於你自己的形象，決定人們如何看你。\n\n如果你到處告訴別人，有關自己的一些事情，其實你內心並不是真的覺得人們會感覺到。另一方面，如果你知道你有一種特殊素質或個性，不管你到哪裡，人們會在你身上認出它，因而支持你，即使你沒告訴他們。\n\n競爭源自於缺乏自信，當你真正有安全感，當你知道且體驗到富足是可獲得到，就沒有競爭的必要。\n\n真正有力量的人不在乎他們給人的印象。他們對跟他們在一起的人比對自己更有興趣。他們發現內心平安的感覺正在增長。\n\n如果你想要周圍的人體驗你的力量，認識你是誰，那就以你的心傾聽他們，而不要擔心你對他們造成什麼印象。關心他們，注意他們的需要。 （直視。專注。傾聽。）以你的心去注意，傾聽那未說的話，因為所有這些都是發展你的力量的方法。\n\n\"溫良的人將繼承大地\"。真正有力量的人擁有極大的謙虛，他們並不試圖造成印象，他們並不試圖有影響力，他們只做自己。人們像被磁石吸引似的趨向他們。\n\n--------------------\n\n\n", "\n\n感謝別人或感謝自己，", "是另一種體驗愛的方法。", "花點時間欣賞你看見的每一個人，", "並送給他們一種愛的感覺，", "將改變你的生活。\n\n愛是宇宙間最強的力量之一。", "愛比憤怒、忿恨或恐懼強上幾千倍。\n\n", "對自己要有信心，釋放那些失敗的記憶，", "就想想你充滿力量和創造力的時刻。\n\n你越感激送給你的東西，就能在生活中得到更多。\n\n每天早晨你醒來時，如果能花兩分鐘去感謝", "你會發現自己有一個較好的日子。\n\n你欣賞並感謝的任何東西，會在你生活中增多。\n\n為你擁有的富足向上蒼致謝時", "上蒼將給你更多。\n\n感恩對情緒而言具有治癒性\n\n如果你想在心裡和別人相連，就讚賞他或她。\n\n讚賞是進入心的門，它打開你的心，容許你在生活中體驗更多的愛。\n\n無論何時，你發現自己心煩意亂，經驗到一些非治癒性的感覺時，停下來，向你擁有的美好的東西致謝。\n\n你越欣賞自己，感激你在生活中的每件事，你就越將你的心和你的意志連結在一起。這允許你創造那些你的心一直想得到的東西。\n\n--------------------\n\n第十二章：感覺內心的平靜\n成長的一部分", "就是學著去創造那感覺（平靜）", "無需依賴事情變成某種樣子", "或人們以特定方式對你反應", "你要創造內心平靜成為你的本來面", "並且有能力將這份感覺給人及分享", "你變成了中心，把你的靈魂的光向外反射", "你選擇感覺平靜。當你周圍的人都有愛心", "你是很容易又愛心而開放的", "你的挑戰是當那些在你周圍的人是封閉", "、恐懼或負面的時候，你仍保有愛心。\n\n內心的平靜來自內在而非外在\n\n任何你執著的事，任何你必須保持某種方式的事，任何沒有彈性的信仰和觀念，都是能影響你內心平靜的一個地帶。\n\n當你既寧靜又安詳，當你放慢下來而覺得放鬆\\", "你就能在你的更高層面創造和思考\\", "你由這空間創造和帶到世界上的\\", "就是你的更高善。\n\n內心平靜是與你更深的自己連結", "它會幫你釋放恐懼\n\n內在平靜是你與心的連結", "是你放棄恐懼的意願", "藉著放掉對任何事的防衛，願意成為可感受傷害的而達到內心平靜。那不是為別人做戲，是願意暴露本來面目，而明白你是沒問題的。\n\n享有內心平靜是指肯放掉自我批評和自我懷疑，別人跟你說的關於你的每件事，都反映出你內在的一個聲音。別人跟你說什麼，也反映出他們如何對自己說話。如果你發現人們非議你，先要問，你內在是否有一個部分在批評自己？當你放掉了那個自我批評時，你將較少經驗到別人的批評。也要記住，別人跟你說什麼，反映了他們是誰及他們如何看這世界。\n\n要有內心平靜，你必須願意敞開你的心。當某些通常會讓你感覺需要自衛或封閉起來的事發生，當你平常會躲開而選擇感到受傷的時候，你其實有另一個選擇。如果那些時刻你願意把你的心再敞開一些，體驗多一點對人的同情和了解，你將發現你能給他們愛，而為你自己創造一種平靜之感。\n\n內心平靜是指放掉對任何事的執著，例如要一個人照你想的去做或這世界照你的期望去發展。當你放掉那些執著，你將發現你的生活運作得比你所曾期盼或計劃的更好，這並不是指對你的生活放棄控制，而是指在任何時候都出自你自己平靜的中心。\n\n--------------------------------\n\n第十三章：獲得平衡、穩定和安全感\n在你們度過一天的時候，當一件一件的事閃過你腦際或抓住你的目光時，許多人就馬不停蹄地從一件事忙到下一件事。如果你希望感覺穩定和平衡，在一天之中常常停下來，並且專注於你正在做的事情。\n\n當你的身體，除了你的思想外，沒有別的動作時，你便能以一種不同的方式思考。\n\n你的態度決定你如何體驗這世界\n\n態度就是你對某些事的反應。能創造喜悅的態度，就是透過喜悅的濾色鏡，來詮釋發生在你身上的事的那種態度。\n\n你的態度即對自己說話時所用的字眼。態度是有吸引力的，你花在喜悅的每一刻，都吸引來自另一刻的喜悅。喜悅而輕快的情緒所擁有的創造力，永遠比負面情緒要有力量的多。\n\n穩定來自一種平衡的態度。好好觀察，你的平衡被別人的缺乏平衡所干擾的那些情況。\n\n人們需要不同的東西來維持其平衡，有人需要穩定的工作，有人需要更多的時間，有些人則需要更多的活動和經常的變化。進入你的內心一會兒，想像你一生中，當你感覺穩定和平衡的某個時候。如果你想不起這樣一個時刻，想出一個象徵，來代表你想要在生活中獲得的平衡。象徵相較於文字，能作用於更深層的意識，而跳過了信念體系。\n\n當你所有的需要，能夠靠自己滿足時，才會有真正的安全感。\n\n你們大多數人以為，要擁有安全感，你必須在外在世界找到某物，或找到某個會給你些東西使你有安全感的人。在你給自己之前，沒人能給你任何東西。如果你不能給自己，那麼也沒人能給你。\n\n要有安全感，你需要感覺你在成長、擴展，並且正擴大你的世界的範圍。\n\n你可能以為，藉著將事情保持不變，維持現狀，你會更有安全感。然而，安全感卻只來自冒險、開放胸襟、對你是誰有更多發現。有的人發現，當他們藉著不冒險來維持他們個人世界的安全時，結果卻更害怕、更不安全。當你面對恐懼時，恐懼永遠只會減低。你可能注意到，當你做了一些新的事，你在別的方面也感覺更勇敢、更堅強。\n\n\n--------------------\n\n第十四章：明晰－活在更多的光中\n\n達到明晰狀態牽涉到看到更大的畫面、更長遠的時間架構及更廣闊的視角。你的視野越廣，你就能看的越清晰。\n\n你對自己是誰所持的看法，這個畫面越大，你就越清楚。如果你進入未來而回頭看今天的你，你對自己是誰就能獲得一個新的角度，因為明晰是由變換視角而來的。每一回你掙脫開而找到一個新的思考方式時，你便增加了明晰。\n\n明晰來自心神集中，思想集中及專注的狀態。\n\n明晰是指你專注且生活在一個別人無法幹擾的能量層面上，你的能量越清晰，你就越少受人影響。你越少被別人的期望或慾望所觸及，你在生命中的路途就越清晰。\n\n審慎的溝通帶來明晰。\n\n弄清楚你的目的、意圖和動機。\n\n--------------------\n\n\n第十五章：自由是你與生俱來的權利\n自由是種內在的感覺，它是選擇你想要什麼的能力。\n\n小孩有自由──尤其是在早年去形成他的觀念，不是靠過去的概念，卻是靠自然的反應。\n\n你是自由的──你相信自己有多少自由，你就有那麼多的自由。\n\n要在你的人生中創造更多自由，不要去看那些你沒有自由的區域，反而去看那些你已經創造了自由的地方。\n\n別人就像一面鏡子，讓你照見你在對自己做的一些事。\n\n自由是你為自己創造的，它不是人家給你的，人家也拿不走它。\n\n自由最大的障礙，就是你看世界的方式。欠缺自由並非他人造成，而是由於你自己的思想過程。\n\n大多數人寧可以習慣的方式反應，而不去審視他們的內在反應。要領悟到你能選擇如何對宇宙間的每件事作出反應。\n\n力量來自於知道你擁有選擇。你不需要改變別人，但你能改變你對他們的反應。\n\n你支持和欣賞自己的程度，也將是你受人支持的程度。\n\n常常，痛苦的感覺來自於被細節絆住，以致看不到更大的畫面。 【例如戀人之間，不一定要送花才代表愛。但如果你心裡想著，必須如何才是愛，這是被自己的期望所囚。要看清事實和更大的畫面。 】\n\n想擁有自由，要願意給人自由。\n\n嫉妒暗示著稀少、不足，自由暗示著豐富、足夠。\n\n--------------------------------\n\n第十六章：擁抱新事物\n開放心胸接受新的事物、新觀念和新人進到你的生活裡，會創造一個對喜悅不斷擴大的容量。\n\n對新事物開放，需要一個以慈悲來看舊事的意願，而放掉憎恨、憤怒或不齒。\n\n要對驚喜和新事物開放。保持你的心開放。你們有的人想到要將新的人或事物帶入你的生活時，就有一種脆弱或恐懼之感……在嘗試新事物之前，每個人都有某種程度的內在緊張感。那是段聚集能量的時間，以便轉進到更高的振動。\n\n向新事物開放是讓你的身體年輕，擴張你如孩童般的驚奇和敬畏感的一種方法。當年事漸長，許多人都緊縮在他們的生活範圍裡，他們開始尋求舒適、熟悉和安全的東西。他們的世界變得狹窄而局促。生活變得集中焦點於瑣事，而非貫注於偉大的事物。\n\n每一天都生出一個新的你。\n\n當你嘗試新事物時，你開始重新檢視你視為理所當然的所有習慣和例行事務。當你擁抱新事物時，你開始將那些可能曾經是例行事務的事帶入了意識。你開始經驗這片刻的覺知力，而活在當下。\n\n--------------------\n\n第十七章：向前躍一大步\n靈魂總是告訴你正確的路，但你必須充滿信心和做信任的一躍，並依內在的指引行事。\n\n不論你要求什麼，你可能必須放掉一些東西才能得到它。如果你要求財富，也許必須放棄你缺錢的心像，所有反映那心像的生活方式，以及你消費的方式。你的靈魂將會給你許多挑戰和成長的機會，幫助你放棄那些匱乏的心像。最初錢可能只是小筆的進來，以使你能表現自己的意願，將錢花在那些創造興旺的事情上。\n\n在靈魂的層次，成長永遠是件喜悅的事，而靈魂關切的永遠是你在繼續成長。不論你是由痛苦或喜悅而成長，成長本身才是最終目的，也就是，要有你當初決定想要的東西，所必須有的成長。\n\n你能以心智瞄準的目標越高，你就越能參與靈魂的成長。 ……靈性透過你的情緒，最常是透過你的感覺回話給你，藉著給你要你做什麼事的一種感覺或衝動。當這些感覺和衝動來到時，在那一刻，你有時需要忽略你的心智（並不是說它不對），因為心智在採取行動之前常要尋找理由或解釋。如果你有很強的迫切感想做某件事，順從那衝動是很重要的。\n\n你越能精確地說明，在生活的任何領域你想要什麼——連同準確的指示和步驟——你便能越快地得到它。你也許有不會分毫不差地以你要求的精確形式得到它，但你的靈魂將為你創造出你所要的東西的本質。\n\n比如說，如果你希望有個摯愛的關係，你也許只是想你感受到被愛。如果你想創造一個更健美的身體，你想要的本質也許是更多自愛。如果你願意在你靈性的大躍進裡追求那本質，你將能更快地創造它們。\n\n靈魂在詮釋你的請求時，是相當有創意的。靈魂必須有創意，因為心智在它要求的能力上是相當狹窄的。靈魂接到任何成長的要求，盡其所能地向每個方向擴展它。\n\n你必須為那些你想要做的事找到「慾望和動機」。你需要極大的動機和真正的內在驅力來向前大躍進。\n\n例如，厭惡貧窮不足以使你脫離它。如果你想要有錢，你必須真正地渴望、喜愛賺錢。你無法借恨你缺乏的東西而得到它。\n\n對於你想做的事，你總是能找到足夠的錢去做。對於令你興奮的事，你總是能找到時間去做。\n\n在某些方面，心智就像個小孩。小孩在兩歲時，不會想要上高中，他們喜歡行到食物，或他們的朋友。心智也是一樣。心智喜歡有記分標示，並感覺到一種成就感。\n\n心智喜歡有完成了一些事情的感覺；你必須令它保持滿足。當情緒能看到進步時，也將快樂得多。\n\n往往你有個偉大的畫面或憧憬，但拼圖遊戲的每一小片都是在當下發生，而可能不切實際。\n\n自問你有沒有得到下個月你可以做什麼事的內在衝動，它甚至不需要和你的目的有關。下決心你會去做它。\n\n--------------------\n\n第十八章：活在更高的目的裡\n更高的目的是，當你創造有益於人類或你自己靈性進化的事物時，你加入的一股能量之流。\n\n你越早有一個目的，就越少浪費能量，而你越快能達到更高處。最終，更高的目的就是靈性的進化。\n\n靈性的成長意指增長你對美的感受，打開你的心扉，而經驗更多的愛和慈悲。\n\n生活不必是艱難的。你可以藉由使你的能量柔軟而創造喜悅。\n\n許多人以為，你們需要對自己的能量有極大的意志力和控制力。如果你依目的而生活，你將發現你也與自己的能量和諧共存，並沒有必要控制它。\n\n更高的目的總是你熱愛的某件事。\n\n你從你創造的每一件事中學習和成長。\n\n如果你想像要一個平和寧靜的生活，想當個好父母，想在你的人生中有個愛你、重視你、珍惜你的男人或女人，將那憧憬呈現出來。下定決心，而你將會得到它。\n\n你常常受上蒼的試探，看你到底有多信任你的遠見。每一個目的都是可達到的，如果你繼續對它努力的話。\n\n--------------------\n\n第十九章：確認你此生的目的\n很多人是處在一個過渡狀況中，過渡狀況總能創造出很多的能量。\n\n滿腦子想的都是你想創造的事物，你就會擁有它。\n\n尊重你自己作為一個獨特的個體，當你和別人在一起，不要將你的路與他們比較。反之，向內在探索，看看你最高的道路是什麼，而將你的生活與之相比。\n\n如果人生太輕易太簡單，大多數人都會抱怨無聊。尊敬你的挑戰，因為被你標明為黑暗的那些空間，實際上是為了帶給你更多的光，以加強你的力量，堅定你的決心，助你帶出內在最好的自己。", "有用 2 沒用 0", "減少情緒內耗最實質的回饋就是擁有內在的平靜，當自己過得不爽快時，放眼看去都是糟心麻煩事，我沒遇過身體生病的人內心會感到快樂的，如果有，那真是病得不輕。當自己心境平和時，看待世界的態度也是溫和柔軟的，即使當下身體有疾，也容易痊癒不留病根。「正氣存內，邪不可干，邪之所湊，其氣必虛」，養生首要在於不生病，安度了春分的調頻動盪，到了清明則是保持心境的清澈明朗，情緒內耗是自己無數個念頭互相對抗的過程，例如想吃某些食物又擔心變胖、渴望被人肯定但又對自己信心不足、計畫十件待辦清單但沒有動力執行、害怕被拒絕總是討好別人等等。內耗在於我們對於很多人事物不以為然卻也無力改變，只好愈來愈自我封閉變得憤世嫉俗，內耗也是對於無力改變的自己的自我否定。", "－", "清明是停止情緒內耗的提醒，它來自於打開心眼的能量狀態，讓原本晦暗不明、找不到方向的狀態撥雲見日，如果我們渴望向別人證明自己，首先是讓自己成為自己想成為的樣子，能夠收穫他人讚美固然值得開心，但內心強大的狀態是沒有任何讚美也一樣能感到心情愉悅，不因被外在讚美以及害怕讓別人失望而束縛住自己，在世間做人只願不卑不亢；為了表象的人際和協而委屈自己，女性忍一時乳腺增生，退一步子宮病變；男性忍一時胃食道逆流，退一步肝膽疾病；損失的不僅是身心健康還有醫藥費以及流逝的光陰。", "－", "清明正是時候看清楚自己過去、現在以及對未來的自我期許，如果內心仍有一股邪火，無法自控的想要開嘲諷戰南北，或是忍不住想去矯正別人，可以多吃冷食，如壽司、生菜沙拉、優格、潤餅、芽菜、泡菜等，或酸甜、酸辣口味的料理，潤燥生津消火；濕疹的體質到了清明應會漸漸改善，如果仍會發作，可持續喝四神湯或綠豆薏仁湯除濕退火，並減少麻油類料理，安度清明時節。", "正的富有要以感謝去吸引", "所以通常，人一直在要的東西，就會愈要不到。比如有的人覺得自己很貧窮，他就一直去賺錢，他是在「要富有」。可是他雖然有很多錢了，你會看到他內在還是很貧窮，因為他還在更狠、更用力的去試圖賺更多錢，甚至犧牲健康、良知也在所不惜。這證明無論他要了多少錢，他就是要不到「富有」。", "如果誠實去看自己一天24小時所作所為底下的真正動機，可能會發現我們幾乎都是在「要」——因為「要」什麼所以才去「做」什麼。可是那個「要」的後面就是基於「我沒有」；是根據「我沒有」而去做的。那麼出於「我沒有」而吸引來的「有」，就會一直讓你感覺到「我還是沒有」。所以人類的匱乏感數千年不變，到現在還在受貪婪之苦。", "那麼，如果你真的想要「富有」，正確的方式是什麼呢？其實是要逆向操作，從感謝開始。如果你能真的開啟感謝意識，由衷地對生活感到感謝，這就是有了「富有的感覺」；接下來你再透過感謝去反省，調整你做人做事、做生意的方式（就是感謝之後一定要有相應的具體行動），你就會逐漸堆疊出一個「以富有感聚集出來的生活架構」。當它愈大、愈持續，重力場就愈強，它就會變成一個「富貴的加速器」，把會讓你愈來愈富貴的人事物與智慧（是真的讓你能感到享受的那種），都愈快地吸引過來。於是你的日子真的愈過愈豐盛了，這就是人生能夠倒吃甘蔗的原理。", "＃騙得了別人騙不了因果", "最後舉個例，來讓大家更清楚。現在有很多網紅，知道要持續受關注的方式，就是要追著時事發表評論。可是很顯然，哪有一個人可以對任何議題都有清楚的研究呢？如果遇到自己不熟悉的領域，這時候他們就面臨抉擇了：對於不清楚的部分是要忽略過去？還是先花時間弄清楚再評論？但也許等你弄清楚，那個大家最關切的發表時機點就過去了。", "好，我們假設有個人，他總是在第一時間發文發影片，搏得流量。可是那個內在的「念」，其實都是基於「想發展自己」——也就是「我還不夠、我需要趕快抓住機會」的焦慮感。那麼實際上這樣的念滾出來的人生風景，即便你從外在看，覺得他好像很風光、受矚目、名利雙收，可是其實他的焦慮感不但沒有減少，還會一年比一年更為加重（因為擁有愈多心愈貪）。所以那個他吸引來的成功架構，竟是讓他受苦的（所以這樣算成功嗎？）。", "可是如果他知覺到這個抉擇的狀態，然後回到「感謝、反省、奉獻」的模式去思考，他就會感覺到：「不行，我做這些的目的，本來是希望真的讓社會更好、更清醒，那我就要提供給別人公允的觀點、寫出扎實的東西，要穩扎穩打的去做才是對的。」於是他會再多徵詢一下事件各造的想法，再多做一些功課，晚一點兒下筆；寫出更成熟、對大家更有提升幫助的東西。那麼他發表以後就會睡得安穩、心裡感覺踏實、喜悅，情緒就不太會被點閱率所牽動。而他多花時間所做的功課也會在未來，累積成他更能舉一反三的能力與視野。這樣經營下去，他言之有物的作品也會慢慢會累積出群眾，就會以一種倒吃甘蔗的方式去成功。他就不會愈做愈患得患失，愈患得患失就得用愈扭曲（或鋌而走險）的方式去維持假象了。", "相反的，那些常常意圖在第一時間蹭熱度、蹭流量的網紅，「夜路走多」之後，終於遇到一次「說錯話」或「酸錯事情」的表現剛好被炎上，好不容易建立的ＩＰ就整個崩毀了。這就是印證了如來說的「DNA反轉法則」——你愈要，反而愈要不到。", "可是這種抉擇，是存在於很私密的一念之間，如果要用頭腦來告訴自己或別人：「我是對的、我說這些是出於社會公益…」這也許暫時可以掩飾過去。可是你的「心念」在「意念重力場」裡吸引來的因果，不會從別處堆疊起來，只會跟隨你的念之所起。這就是俗語說的「種瓜得瓜，種豆得豆」。", "所以「因果」，真是最能給人「震撼教育」、最能「直指人心」的！", "註1：有關「時間」、「空間」以及「重力」的本質，請參考「都可以，就是大覺醒」一書（商周出版）的第二章「超越時空的自由」", "受苦的藝術", "當我們願意", "面對自己的苦", "深入觀察苦", "就開始瞭解苦的根源", "這時候", "轉換與療癒便有了可能", "對他人痛苦的理解能力隨之提升", "關係中的衝突也得以解決", "培養微笑與幸福的能力", "能讓我們轉換自身的苦", "也深度聆聽他人的苦", "唯有心裡有你的人，才會願意去照顧你的情緒", "也唯有把你看得很重的人，才能和你站在一起", "和你同悲傷、共歡喜", "滿眼都是你的人，才配得上你全部的愛", "兩口子過日子，", "不求吃香的喝辣的，", "不求買好的穿貴的，", "但求不吵不鬧、和和睦睦", "人不怕受累，就怕心流淚", "不怕疲倦，就怕心憔悴", "非暴力溝通", "非暴力溝通則是一種“愛的語言”，包含表達與聆聽，與自己和他人建立連結，並充分展現天性中的善意。", "非暴力溝通將注意力聚焦在觀察、感受、需求和請求四個要素，指引我們重新建構表達和聆聽的方式。", "觀察:觀察實際上發生了什麼，且在表達中不應夾雜任何評判。", "感受:表達自己的主觀感受，要注意不是表達想法，而是表達情緒。", "需要:表達自己的需要。我們越是將自己的感受和需求相連，他人就越能對我們做出善意的回應。", "請求:我們可以使用正向、具體的語言提出對他人的期許，希望祂怎麼做來滿足我們的需要。要注意的是，請求不等於要求，請求要建立在傾聽和理解的基礎上。", "「非暴力溝通」可以簡單地總結為一個公式：", "非暴力溝通= 我的觀察+ 我的感受+ 我的需要+ 我的請求。", "同時，我們也要以同理心去傾聽他人的觀察、感受、需求和請求，以尊重的態度傾聽、了解他人的經驗。", "能讓一個女人上癮的永遠不是多有錢", "而是在伴侶上的真誠、踏實、責任擔當和細節", "消除那些會激怒人的爭吵用語:", "有些詞彙會塑造出有敵意的語氣,無意中強化了無禮感.", "請感受一下下面的差別.", "A.爭吵語句:不能..因為.. (你不能跟朋友玩,因為沒有寫完作業)", "友善語句:完成..就可以..(你寫作業就可以出去玩了)", "B.爭吵語句:你必須... (你必須打電話給你媽,告訴她我們不能去)", "友善語句:可以麻煩你嗎? (能麻煩你打給你媽,讓他知道我們不能去嗎?)", "C.爭吵語句:我什麼事都做不了,我沒辦法改變這一切 (我們發現的太晚,無能為力了)", "友善語句:有些事情是你可以做的 (就算無法改變結果,但你也可以這樣做讓你好過一點)", "D.爭吵語句:總是,大家,從不,沒有人.這類全有全無的表達 ", "(你總是遲到,大家都不開心,你從不聽我說,沒有人在乎我)", "友善語句:具體而非籠統的詞語", "(你遲到兩次了,是發生什麼事了嗎?你能放下手機,給我五分鐘的時間嗎?)", "E:爭吵語句:可惜/遺憾的是 (可惜我們不能去你的比賽) ", "這類句型會讓遺憾成為唯一被關注的事情", "友善語句:幸運的是... (這禮拜我不能去,幸運的是下周六我可以過去)", "比較可以激勵人去關注順利的事情.稍微緩解遺憾的事情.", "所謂的強大，並非發現自己有多了不起，而是更有承擔的能力，不會輕易被命運擊倒。正因為經歷許多坎坷，才能練就對痛苦食髓知味的能耐，以苦中作樂的行動，換來苦盡甘來的體會。進而明白：只要在第一時間就接納臣服，所有的遭遇如同一杯上等的精品咖啡，含有苦中回甘的美好滋味。", "　　承擔長達將近三十年的照護任務，雖然困住我走向外面世界的行旅，卻讓我及早展開往自己內在的朝聖。於是對人生的痛苦有特別的感觸：渴求離苦得樂，是一種妄念；只要不再相信自己頭腦的念頭，就可以在當下解脫。", "　　恐懼，只是一時的幻相，是「小我」的詭計 太極拳等，可以幫助疏洩肝氣，同時也有助於消耗多餘的能量，減少煩躁不安的情緒。\n\n❸放下完.美情節，請允許自己出錯，對待每一件事情的態度：只做體驗，不糾結對錯。世上根本沒有完.美的事，任何事物都有缺陷。\n\n❹多給點時間給自己，放慢自己那根緊繃的弦，給自己放鬆的時間和機會，可以漫無目的的逛逛公園，吸收天地靈氣；可以不帶目的看書、聽音樂，沉浸片刻的安寧。\n\n❺注重養肝：選擇讓身體舒服、放鬆的食物，三餐要定時。多吃對胃口的食物，少吃油膩、辛辣食物，這些食物容易生熱助火，加重肝火。吃的乾淨，肝氣疏通，自然運化有常。\n\n⭕️認清自己肝氣鬱結，放緩腳步，調整心態\n情緒就會越來越好，也就變強的路上了～", "焦慮症和脾胃的關係", "焦慮本質上還是脾虛，脾不給力，生化氣血的能力不足。\n·\n土虛則木旺，土虛則氣血虛，沒氣沒血了整個人就會害怕，擔憂，沒有安全感，心生恐懼。\n·\n脾虛則生濕，脾虛則生痰，濕和痰都會吞噬你的陽氣，你的氣血。\n", "—胃部", "胃是容納食物的地方，象徵加工、消化和吸收某些思想或情況的能力。當胃出問題的時候，意味著我們不知道如何認同生活，開始害怕某種新的東西，無法應付某些事件。\n\n恐懼、憂慮、不安、不快樂、憤怒等情緒會立刻反映在胃部。\n\n胃潰瘍，十二指腸潰瘍，胃炎\n這常是對生活中的某種新事物的恐懼。長期的不確定性，失敗的預感，害怕接受某種新東西或不會消化吸收它們，這些都會反映在胃部。有胃病的人心中充滿著各種恐懼，恐懼引起痙攣，痙攣引起疼痛和潰瘍。\n\n個體認為自己不夠好或不夠有價值，認為自己很差，害怕辜負父母、上司或親友的期望。完全不能坦然地接受自己。努力迎合別人，同時卻忘了自己。患十二指腸潰瘍的人總是習慣性自責。這種病以男人為多，因為他們的勇氣和自尊經常受到沉重打擊。這樣的人自尊心是“受傷的”，他們身材消瘦，脾氣不好。他們經常需要向某人證明什麼，經常需要監督自己和他人。熱衷於獲得權力，總是想超越別人，害怕來不及按時完成某件事。\n\n對這個世界上某種東西的反感和厭惡也會引起潰瘍。因為在否定這世界上的某些東西時，個體就是在否定自己的某一部分。另外，憤怒、怨恨、絕望也會導致潰瘍。\n這種情況下最好的藥是愛和內心的寧靜。如果一個人愛自己和周圍的世界，尊敬自己和周圍世界，就不會有潰瘍。要學會接受自己原本的樣子。要學會接受周遭世界。\n\n噁心，嘔吐\n這是在用潛意識的語言表明：不能接受、吃不消，想要擺脫生活中的某種東西（或某人）。\n為什麼很多懷孕的婦女會嘔吐？因為她們無法從心底接受自己懷孕和即將生子的狀況。\n嘔吐的另一個原因是各種各樣的恐懼。要從內心找出這些恐懼並擺脫它們。\n要學習輕鬆地應對生活，接受自己生活中的所有情況，將它們當作正面的經驗。要學會習慣和認同所有新的思想。胃的狀態就會很好。\n\n暈船，暈車，暈機\n有些人搭飛機、汽車或搭船伴隨著噁心、嘔吐和疲倦。原因首先是潛意識的恐懼。當不得不離開熟悉、安全的地方，出現了對未知事物的恐懼。需要對新的感受進行加工和消化。\n\n其次，旅行中必須信任開車和開船的人。要學會信任，首先要信任自己，放鬆，順其自然。", "低的概念：\n脾胃功能好，能量轉換率高，氣血充盈，🔋\n脾胃功能差，能量轉換率低，氣血虧虛，🪫 \n\n✨重點：能量x脾胃%= 氣血。\n想要氣血充盈，除了管控攝取能量的數量和質量，「開源」還在脾胃。\n\n2️⃣ 如何維持氣血？\n上面主要圍繞著“開源”，變數在脾胃。作用力與反作用力是宇宙定律：一切你消耗掉的，同時消耗你；你在吃東西的時候，這東西也在吃你。既然人體氣血的總量受制於脾胃，那麼在脾胃不好的情況下一味進補只會適得其反就很好理解了。這裡不展開，需要的可以回首頁查看。\n\n在脾胃暫未恢復的情況下，還有另一頭可以乾預，即“節流”，減少氣血的損耗。人活著，氣血就沒有可能不損耗，只有損耗快慢的差別；一如衰老，不存在長生不老，只有衰老的快還是慢的差別。人類社會，包括人體就是熵增的過程：\n人的限制在於無法熵減；\n人的創造力在於可以讓熵變慢一點。", "真正的氣血sha手，是心念。起心動念，驚動十方shen煞，說的也是一樣道理。養脾胃的根本在養「心」，養的是心念，守的是心神，護的是心氣，心血：\n回歸少思少慮，空心無念。\n3️⃣ 如何少思少慮？\n血為氣之母，氣為血之帥—— 此為氣與血之間的製衡關係。氣足，則將血有力地帶動至身體各部，滋養器官；血足，則氣源充裕，勢能強勁噴湧而出－ 無一不在透露一個點：「動」。\n\n人體是一個完整的生態：氣、血分別對應空氣和水。那還需要什麼呢？就是陽光。陽光何來？動則生「陽」，這也是為什麼運動健身、出去走走、與人交流都讓人開心，因為生命此刻的「流動」，順勢了氣血的「動」。\n\n生命在於靜止，指的是「心」如止水；\n生命在於運動，指的是「動」如脫兔；\n切不要剝離開來看。\n\n所謂運動，說的是「運」用你的「動」能。誰來運？是你的主觀能動性去召喚你的身體：心指導身，去行動。脾胃恢復的過程，蓄養氣血的過程，就是穩定自心的過程，就是掙脫情緒惡見對大腦的束縛，將大腦訓練有素的過程；就是用人性駕馭動物性的過程。\n\n這個過程，也叫「開竅」。\n\n💡寫在最後：少思，多睡，是平復幾乎所有身心困擾的良藥。只是越樸素的道理越無人問津，越看似簡單的道理就越難做到。我也一樣。但請不要苛責自己，誰不是在兜兜轉轉中，漸次明白，漸次沉澱，漸次穩健。\n\n我們終將明白，我們終將成長。\n我們終將帶著自己的散兵游勇，披荊斬棘。", "關於財富自由，99%的人理解錯了", "自由，這個曾經只在詩裡歌裡出現的特別抽象的詞，這兩年被密集得和一些特別具體的小事連在一起。\nㅤ\n奶茶自由，車厘子自由，包包自由，外賣自由…還有這一切最上面的那個，嗯，財富自由。\nㅤ\n這些新造詞裡，暗埋了一個定義：即「當可以不限量擁有xxx時」，就「xx自由」了。\nㅤ\n套用一下，\n當可以不限量擁有奶茶時，是為奶茶自由；\n當可以不限量擁有車厘子時，是為車厘子自由；\n當可以不限量擁有xx包時，包包自由… \nㅤ\n發現沒，我們試著用一個具象的前綴，描述一個抽象的自由；結果只有具像被「不限量」疊加，自由還是那個沒被解釋，獨立存在的自由。\nㅤ\n而這僅是從拆文解字上play了一個晦澀的小遊戲，看不懂也罷。我想說的是，重點在自由上，跟前面的xx，關係不大。\nㅤ\n自由永遠不是你能對多少東西說「是」，而是能對多少東西說「不」。自由是，你能夠相對於多少東西，獨立存在。\nㅤ\n能對奶茶說不，獨立於奶茶存在，有就喝，沒有也不想，就奶茶自由。\n能對車厘子說不，獨立於車厘子存在，有就吃，沒有拉到，就車厘子自由。且不說這裡還有個人製造概念車厘子，如果只是未經包裝的村口樹上的小櫻桃，估計也沒人在意自由不自由。\nㅤ\n同樣的，能對財富說「不」，獨立於錢財存在，也就自由了。這個「不」，可以是多得花「不」完的不，也可以是要求「不」多的不，兩種都可以幫助你達到財富自由。\nㅤ\n只是對大多數人而言，都在財富上，掉進了「不限量」的陷阱。\nㅤ\n特別特別正常。\nㅤ\n這也是為何只有那誰才會對錢沒興趣，那誰才會說臉盲分不清美女，因為他們都觸達過「閾值」。我想說無欲則剛，只要能保持少欲，我們每個人都分分鐘各種自由，可是啊，對於沒見過的閾值，沒觸到過的極限，我們遠沒有祛魅。\nㅤ\n所以啊，放手去觸碰那個閾值，去擴大，因為這能讓你感覺活著。\nㅤ\n但是啊記得，只要你不要了，自由，就在你手裡了。\n\n利他｜ 活的鬆一點ㅤ \n", "所以真正的上醫，只可能是病人自己。\n\n我更願意用「病人」這個詞，因為所有病因，都始於不安的心。真正高超的醫學，不僅關注人身，也應關注人心。一個真正關心自己生命、關心自己身體健康的人，不應把自己的身體完全交給醫者，而應該讓自心發揮其應有的管理身體的功能。\n\n精氣神，精和氣，俯首於神；\n心為神，統領五臟五藏。\n\n管好這顆不安分的心，做自己的上醫。", "\n“不開竅”的另一種說法就是愚癡，而愚癡的一個很重要的因就是「貪」。人的脾胃，基本上都是貪吃、亂吃給撐壞的，一旦學會把內心的這個貪欲控制住，飲食有節，脾胃恢復過來，就有足夠的氣血供給到大腦思考\n\n人有“三座大山”，分別是男女飲食再加上睡眠，其中貪著飲食的這個味覺，對人的這道氣的影響是最直接的\n\n我們說一個人有靈氣、有氣質、腦子靈活，其實都是這道氣的作用，這道氣運轉流暢，把精神貫穿起來，人就活活潑、充滿生機。 “氣傷於味”，吃喝過分，這道氣就鬱滯住了。 《道德經》講“餘食贅行”，這裡的“行”，指的就是氣的運轉\n\n在我們老家，罵一個人不開竅、愚癡，還會說他“墨黑”，吃得太多、太飽，整個身體都堵住了，裡面烏漆嘛黑一片，這就是「墨黑」的狀態\n\n當年賈伯斯身體和事業都跌到了谷底，跑去印度訪道，瑜珈大師給他的開示就是「stay hungry ，stay foolish”，要保持身體的飢餓感，不能過多進食\n\n佛家有句話叫“偷心死盡，則道成矣”\n\n本來定了早上六點的鬧鐘，響了，還是不捨得起來，要再躺一會；點了一例燒鵝，本來已經吃飽了，看著好吃，又往嘴裡塞了兩塊，這個「偷心」就是人的貪念\n\n那天把內心的貪欲徹底克制、消化掉了，那人就到達了一種平衡態，這個平衡態，就是「道」的別稱，也是開竅的別稱", "脾胃不好，是因為你太會內耗自己了！", "脾臟主運化，不只是運化食物，更是運化情緒。很多脾胃虛弱的人大多是脾氣躁、愛鑽牛角尖、性子急，明明身體弱，精力不足，卻常常想得多做得少！\n\n總想做自己精力能力範圍外的事。各種折騰，給自己累壞了，結果沒有變強，反而變得更焦慮了。想要養好脾胃很簡單，給自己的情緒做減法，飲食做減法，減輕脾胃負擔。\n\n情緒做減法\n憂思傷脾\n不要想太多太雜，不要什麼都想，不要什麼都學。你寶貴的精力集中在眼前的幾件事就好了，別想著自己能幹無數事情，你又不是超人。\n必要事事追求完美\n放下完美情節，請允許自己出錯，這世界上沒有完美的人，也沒有完美的事，月有陰晴圓缺，才有它獨特的美。\n遠離焦慮，適當放鬆\n面對工作和生活中的困擾，不要急於解決，有時候，放下焦慮，好好休息，問題自然會找到解決的方法。不如好好睡一覺，養好精神，問題自有解決的方法。\n放下內心的糾結，不做無謂的內耗\n活在當下，感受現在的力量，接受自己的一切。同時，我們也要注重養護脾胃，選擇適合自己的食物，保持規律的飲食，多吃溫和易消化的食物，讓脾胃得到休息和滋養。\n給自己一些放鬆的時間\n可以去公園散步，吸收自然的靈氣，或隨意閱讀、聆聽音樂，享受片刻的寧靜。也可以在早晨或是晚上進行5分鐘的冥想，更有利於放鬆。輕鬆且有效的方法是愛自己，是脾虛者走向強大的關鍵。\n多愛自己，不做內耗\n不要考慮那麼多，當下就是永恆。用心去感受現在的力量，接受自己的－切。", "養脾胃⁰⁰²✨ 「沒關係」療法", "新的一年，試試這個療法，我親身嘗試了一、兩年。\n“沒關係”，不是對別的任何人說，是要和自己說。\n是放下對自己的要求，對事態的控制，對過去的自責，對明天的擔憂。\n\n脾胃不好的人，往往從小到大被自己忽略了內心真實感受，\n自小按需長大，逃避內在積累的傷痛，對自己的怠惰橫加指責，\n不滿意自己的真實樣子，缺乏對於自己的溫柔教導。\n這種「溫柔」是一種全然的鬆弛，把自己託付給生命自然的進程，\n放下對其走向的控制，像流水一樣順勢而下。\n也許路遇回溯而上的魚群和攔路的礁石，\n平時脾胃虛弱的我們格外害怕失敗，總是緊繃地敵對、迎頭撞擊，\n掀起巨浪水花。\n因為脾胃虛弱的人很想向前，想要快點獲得自己想要的。\n\n但當有一天，你改用一種溫柔的策略對待自我，\n遇上回溯的遊魚和礁石，我們放棄迎頭痛擊式的努力，不再執著向前，\n改用一種鬆弛的「自然法」。\n\n我們降速，我們迂迴，迴遊繞了一個大彎；\n我們順從，暫停爭奪，\n不再執著向前。\n後繼發現，僅僅是倚靠風的力量，我們便從敵對中逃亡，\n放下掙扎後，風將我們輕鬆推至前方，沒有一朵水花被濺起。\n以一種放鬆的方式前進，源自於你出發前對自己說了一句「沒關係」。\n“沒關係”，我們慢一點也沒關係。失敗了也沒關係。\n“沒關係”，這次不去爭取不代表我很差。\n“沒關係”，這次讓別人失望了，但我做了我自己。\n“沒關係”，我發現相較於龜速地漫遊和探索，成功的樂趣不值一提。\n“沒關係”，這次沒做到也沒關係，下次再努力努力\n向前遊一點點就好了，生命還那麼長。\n脾胃問題多爆發於內在思想的敵意、不合時宜的爭取和向外抓取，\n對自己溫柔地說「沒關係」。\n我的脾胃長嘆一聲，\n“沒關係”，它說，\n“之前用盡一切辦法治愈我，中醫、西醫、飲食、藥物，\n但從未停止過用最傷害我的情緒折磨我也'沒關係'，\n只要下次記得彎下腰來聽我說說話。」", "你怎麼還是那麼瘦呀？你媽是不是虐待你了。” \n“你太瘦了，長點肉才好看。”\n這麼多年，大概率你還是會難過。確實很容易當真。\n如果大家這樣說你，你還是很滿意這樣的自己，你的脾胃一定很健康。\n\n這是脾胃不好的人遭遇最多的一種場景，而你對待這種評價所浮現的情緒，\n卻也恰好是你被囚禁在瘦削軀殼的原因所在———\n你在此情景下的起心動念是一面鏡子，\n映射出這幾十年來未曾被你覺察的內耗慣性。\n就是這樣內耗的造早就了你的脾胃難以自癒。\n\n是啊，脾胃不好永遠和內耗互為因果，我們永遠都在評斷自己。\n對自身和他人的是非好壞的判斷，\n就是我們眼裡投射出的整個世界，\n我們將自身價值和外在對我們的評價相捆綁。\n造成這現象的主要原因，是自身內在力量的欠缺，\n不能看到你自己是獨特、唯一、有價值的個體，\n容易被外界的主流標準推動，缺乏看到非主流片段獨特性的能力。\n\n然而，脾胃健康的人即使是瘦弱，也具備承認自我價值感的能力（自信）。\n他們承認自己的內在價值不以外在形象而做轉移。\n他們會說：\n「是呀，每種形態都有各自的美。周圍人說我太瘦了，\n雖然我不否認身形勻稱是健康的美，但瘦弱的身形往往相處起來沒有壓力，精神煥發並且容易讓別人產生保護欲。我喜歡這樣的自己，也喜歡每個版本的自己。」\n脾胃虛弱的人就相反：\n“我也很想長胖，我希望你分點肉給我。” \n“我一直在增肥，我也覺得胖點好看。」\n對自己消極的評判是脾虛患者很明顯的共同點。\n看不到自己的好，不接受真實的自我。\n突破的核心在於二元思想的溶解，避免非黑即白看待事情。\n而是去看到，自然界的每個存在形式都有其存在的獨特性，主流標準只是主觀眼光，每個人都有不同的判斷標準，也會因角度、時代發生變化，與真實不一定有關聯。\n多多看到自己獨特的美，培養自己自信的能力，看到在沙土中閃爍著光芒的自己。", "脾虛－ 懷疑自我/自我力量薄弱/假想困境－\n半途而廢/著手別的事－ 自我批判一事無成－脾虛更甚。\n世界是個永恆的銜尾蛇閉環。因即是果，果皆為因。\n\n要走出脾虛，你必須設法走這個閉環。\n燃燒自己的內在動力。\n\n你首先要觀察自己在經歷怎樣的過程。\n投身實踐三分鐘後，就開始對自我的懷疑，\n開始對非穩定因素的考慮，對未知障礙的幻想，\n熱情開始慢慢衰減，半途而廢。\n接著我們自覺自己總是一事無成，\n對自我的批判又給予脾胃重擊。\n我們可稱之為“半途的恐懼”“道路中的假想敵”，\n身體、內心沒有力量、沒有勇氣將我們持續推出，\n面對還未發生的將來，\n過多的思慮再一次傷害脾胃。\n\n要如何走出這個惡性循環呢？\n答案是，\n去做。\n不假思索去做。\n奮不顧身去做。\n毫不猶豫去做。\n關閉眼耳鼻舌身意，\n停下頭腦遊離的鐘擺，\n讓你的道路跟隨你的內在動力而展開和鋪陳，\n嘗試讓生活僅存“當下”這個概念，\n甚至把“未來”也驅逐出境。\n不去考慮未知給你的不可控因素，\n唯有「當下」把力量賦予你。\n\n如果你覺得活在當下對你太難，\n我建議你只記住兩個字：\n「去做」。\n\n在任何時候只記住這兩個字。\n去做，去體驗，去冒險，\n去深入受傷與破碎，\n去感受失敗帶來的獨特而凜冽的美感，\n這是走出“永遠三分鐘熱度”\n和持續衰減動力的循環體系唯一的出口。\n\n在這個過程中，\n也將滋生脾胃從初始以來的第一團火，\n它更有機會生生不息地燃燒下去。\n\n脾胃屬於太陽神經叢輪，\n元素是火，\n你一定要提醒自己，心存火焰", "我們急於向外界和自我證明：\n“我值得被肯定、我值得被愛、我不是什麼事都做不好”，\n來掩蓋內心缺乏愛、缺乏自我力量的恐懼。\n彌補那個只能依靠不斷向外求才能圓滿的空洞。\n\n內核不穩，缺失感很重，急於求成。\n而當你時時刻刻處於戰備狀態，你的脾胃最先感知。\n當我們只著眼於結果好不好，\n就不能在當下的過程中尋到快樂，\n每一個「當下」被焦慮連成了黑暗的通道，\n我們唯一內在渴望是以最快的速度到達黑暗的盡頭。\n而在通道內行走的日子都變成了消耗與蠶食信心和動力的過程，絲毫找不到樂趣所在。\n對結果和外界肯定的極度渴望，\n讓原本獨特的旅程荒草叢生，\n向外的抓取就好像爭奪母乳，\n覺得唯有這樣才能活下來。\n\n「急」是一種持續不斷的緊繃感，\n由於脾胃力量不足而導致，緊繃若不能卸下便會再一次傷及脾胃。\n你必須走出這個閉環。\n\n✨你要成為一隻黑暗中的龜，\n在緩慢的節奏中讓故事自然展開，\n一旦感到緊張，你要提醒自己慢下來。\n尋找讓生活肆意流淌的當下感。\n\n你做每一件事，提醒自己去發現它好玩的地方，\n珍惜過程，放鬆下來去玩，\n去冒險，去漫遊，\n去感受自己的主角光環，\n去欣賞自己的劇本，\n而當你不再執著於道路盡頭的光和別人給的熱量，\n你便成為了你自己的火焰。\n\n養脾胃的過程，\n是不再為了別人評斷你的好壞而緊張、爭論和證明，\n是愛自己，找到自己的力量，是自證圓滿，\n就不再為即將失去愛、失去某個外在人事物而戰戰兢兢，\n你只鬆弛地做自己。\n\n你的脾胃放鬆下來，情緒容器得以舒展，氣血無阻礙地流淌全身。\n享受道路，即使是悲傷，\n烏龜比兔子更能多說一些道路的情況。", "脾胃虛弱人的共同點：一根緊繃的弦。\n中焦力量不足的人，尤其害怕做不好事，\n不能放鬆下來做事，緊繃感埋在我們潛意識中。\n這是一種控制的慾望。在脾虛患者的世界中，對與不對、好與壞被劃分得黑白分明，\n無法忍受自己像失控列車駛離自己預想的軌道。\n\n我脾胃虛弱了30年，兩歲就得了胃潰瘍，甚至睡夢中也在控制事態，以維護安全感。\n害怕，擔憂，悲觀，不安全感。\n夢中我用黑筆勾出一間小房子，用紅筆填滿這個黑色外殼。\n夢境沿襲了清醒時的潛意識，我在夢中用盡渾身力氣控制自己的筆觸，\n害怕把顏色畫出了界線。但這在睡夢中非常困難。\n如果失控，潛意識裡會發生什麼事？\n整個房子會燃燒，會在火光中崩塌，我驚叫地跑出來，\n感覺晚一秒就會在火海中燒成灰燼。\n餘燼在風中跳動，慢慢與我融為一體。\n這是脾虛者前半生精神狀態的寫照。\n\n🐟在這裡，我很想將「流水療法」分享給你。\n\n想像一下，如果你是流水，不知何處流淌著。\n沒有顏色形狀，遵循著生命本真的樣態。\n你不會覺得自己在大海裡比在湖泊中更美，\n被路人舀起來也無妨，任由被路邊動物飲用\n你沒有目標，不會想著奔向大海，\n僅僅是感受自己的萬千種存在方式，\n也許會因蒸發而流淌於消逝中，\n也許會因一場大雨傾盆又全都回來了。\n核心是去體會當下的鬆弛狀態，將過去未來剔除。\n脾虛者覺得問題很大，瞻前顧後。\n不安全感導致控制欲旺盛。\n在我最嚴重的時候伴侶像被我圈養，做什麼都像是不忠。\n\n🐟假如像流水一樣生活一段時間，\n你不會想著去控制。\n「好與壞並不存在，沒有失敗失控只有獨特的經歷，\n尊重生命本真的樣子。」\n你胃裡那片爆裂的餘燼在行將消逝之前輕輕說著。", "養脾胃⁰¹²✨「我不要了」的力量", "「失去不外是改變。」\n脾虛的人無法理解這句話。\n\n脾胃不好的人能量很低，\n無法從自我的內在找到補給，\n所以渴望被他人給予，渴望事情有好的結果，\n渴望愛人的懷抱。\n如果喪失了這些，我害怕會碎掉、si掉。\n我是水倒進盆子，變成盆子的形狀。\n我是水灌進瓶子，變成瓶子的形狀。\n我是水流入池子，變成池子的形狀。\n我不斷尋找各種各樣的器皿。\n我害怕失去了塑造我的外殼，\n水不再是水，\n我會是誰？\n沒有了盆子、瓶子、池子，\n我會汽化、會蒸發、會崩塌嗎？\n好可怕。我很焦慮未來的不確定性，\n所以特別害怕失去別人的給予和肯定，\n擔心一件事做得不夠好，\n恐懼失去愛人的懷抱。\n\n終有一天，向內的消耗到達承載的邊境，\n做回自己的願望像沖天的亮光，\n響亮大地的驚雷：\n「我不要了！」我說。\n「如果我會消失，我就勇敢地去體驗我消失的過程。我不要了。沒有了我像救命稻草一樣抓住的東西，我想知道我會變成誰。」\n\n瓶子被撞到地上，\n水從玻璃碎片溢出，\n我驚訝地發現，\n我可以是任何形狀。\n沒有汽化、蒸發、崩塌，我以各種姿態流向大地。\n\n我曾緊張、感到不安全，\n害怕被拋棄，\n追尋大海、惶惶終日。\n脾胃時刻承受我的焦慮。\n當我勇敢地面對自己，勇敢地面對恐懼，\n擺脫執念的藩籬，\n當水流向大地的一刻\n才發現我追逐的大海竟是每一刻的自己。\n\n向前走，別回頭，\n勇敢一點。\n脾胃需要的力量就是：Be brave！\n唯勇氣能讓脾胃煥然一新。", "只要當下在享受，那你的人生就是有意義的", "今天就簡簡單單跟大家分享三段我很有感受的點：\n\n", "\n✨療癒的奧義，在於擺爛式前進，迂迴式生長，\n有擺爛也有前進，有迂迴也有生長。\n是做自己，不被別人的價值觀打亂陣腳，找到自己的流速。\n同時也在這個過程中，向沼澤外一點點螺旋式向上，慢慢拔出自我保護的泥淖，褪去自己陳舊的外殼，不斷在愛的力量下卸下恐懼，向外付以信任，傾注熱忱，保持前進。\n自我感受永遠至上，但自我不凌駕於任何人，任何事。始終有一扇敞開的門，對外歡迎光臨。\n緊緊握住自我，並信任自己能在外界湧動的浪潮中始終保持自我，全然敞開，內外交融。\n\n擺爛式前進中蘊涵了脾胃所需的一切複盤之力。\n\n宇宙萬物永恆都處於平衡到不平衡，又從不平衡到新平衡的螺旋式循環過程。需要外界新事物的湧入，才能幫助探索不斷深入的內在。\n需在緊握自我並保持敞開中尋找平衡。\n萬物生靈若處平衡，一切自然流淌", "➊ 搜尋自己外表/身材上的一個優點，每天觀察它。\n✨（指向：累積自信）\n熟悉自己的優點能建立起對自我的正確認知，認識自己並不需要透過do臉來改變，每天照鏡子仔細觀察你身上很美的點！仔細觀察它們也是建立自信的第一步。\n皮膚好、身材苗條、面相無攻擊性，眼睛有神…每天路過鏡子時都特意看向這些地方，在心裡複述你的優點，深化印象。\n\n➋ 搜尋自己外表/身材上的一個不足，從完全相反的角度解讀。\n✨（指向：接納自己的一切）\n每個人都是獨特的，我們被外界的單一美感洗腦，看不見自己與眾不同之處，而愛自己始於開始真正欣賞自己。\n去找1個你覺得很討厭自己的地方，想想它們的另一種解讀。\n例如：身材胖— 給人穩重、有親和力的直覺\n皮膚有雀斑— 原生的野性美\n面中凹陷— 清冷感\n個子矮— 無攻擊性、容易接近\n嘗試用相反的角度解釋它們，能對自己進行反洗腦，從自我評判的自卑中解放出來。\n\n➌ 本週在公眾場合訓練：他人與你對視時不要把目光移開，直到對方移開目光，你再將目光移開。\n✨（指向：培養內在力量，建立自信）\n眼是藏神之處，眼神交會是心神交匯，訓練與人對視能增強你的自信心和氣場，會潛移默化增加自己的力量感。每次把對視進行到最後一刻，不把眼神快速移開，自我力量就在慢慢成長。特別是社恐，內心不夠堅定的人，特別有用。\n\n➍ 上下班路上去認識路上遇到的三種植物，用掃一掃的識圖功能了解它們的名字、花期和習性。\n✨（指向：培養對生活的熱情）\n去年我在家附近認識了二十多種植物！海桐藍花楹白花蛇舌銀合歡八角金盤羊蹄甲海棠花！春天的植物真是太美了，觀察這些小生靈也能將你的焦點從打工的疲勞和繁瑣的人際中移開，更加關注自己流露出的對萬物的欣喜之情，是關注自我的很棒的方式。\n\n➎ 把擔心和憂慮寫在紙上。 （長期）\n✨（指向：建立自信和勇氣）\n建議準備一個本子，堅持記錄下自己的擔憂。\n一方面，情緒控制我們往往是因為我們未能察覺，\n記下來（覺察）的時候，情緒往往平復了一大半。\n也因為當你記完整整一個本子，倒頭回去看這些內容，可能90%都已經妥善解決，\n你會感嘆當時覺得難以度過的關口\n如今看已成雲煙。\n未來你會更有勇氣，明白生命中所有的問題都是暫時的。\n你會更有自信，不懼怕困難。", "\n\n放下對鬆弛感的強烈渴望、對脾胃治癒的急於求成、對內耗的厭惡，\n允許一切的發生，清晰察覺你的執著念頭，\n並始終保持奔向大海的力量，\n向上生長的力量，\n寬容自己的力量，\n就是最清醒的鬆弛感。", "多去做事吧！氣血不足也要敦促自己保持行動。\n堅持完成一件件以為很困難的事，暫時做不到也沒關係，慢一點也沒事，保持前進就好，在不斷攻破它的實踐中創生自信。\n我可以的！去親歷我體內絢麗的煙火盛會。", "脾虛患者從未停止用他人的眼睛讀取世界", "在出發前往這個世界之前，脾虛患者就打包好這一世的劇本，說這個可千萬不能忘記了。\n否則我會在一個找不到出路的生命迷宮裡深陷囹圄。\n我清點好我的所有個人物品，帶了最重要的劇本和地圖。卻唯獨忘帶眼鏡，它被我遺落在沙發的夾縫裡。\n當我在這個新世界睜開雙眼，發覺我怎麼也看不清，手上的劇本像是被蒙上幾十層濾鏡，已經辨認不出上面的字跡。\n我不得不從這個巨大而陌生的囹圄爬起，重新去探索我生命的地圖。\n我發現我很聰明，很快就找到一個捷徑：\n只要藉用別人的雙眼，\n也能慢慢摸索出世界的形狀。\n\n於是每到一個地方，我就習慣透過他人的雙眼來讀取一部分地圖，我慢慢地將這些碎片拼湊到了一起，形成了我所知的世界。\n在成長過程中，我問自己：\n「今天我把花瓶打碎了，我的媽媽眼裡的我會不會是個壞孩子呢？\n我在媽媽眼裡是個壞孩子，\n我在世界上一定也是個壞孩子吧。 」\n\n工作之後身邊被一群既近又遠的人圍繞，\n我問自己：\n「今天我拒絕了一個同事的求助，\n同事眼裡會不會認為我很自私冷漠呢？\n我在他眼裡是個自私冷漠的人，\n那我對這個世界應該也沒什麼幫助吧。」\n我也從未停止用戀人的雙眼讀取這個世界。\n我和他在街上看到一個漂亮的女孩，我會下意識想他是不是也認為她很美麗呢？他會愛上一個比我更美麗的人嗎？\n總是情不自禁地變成他，去凝望世界。\n我多希望變成他眼裡美麗世界的全部。\n\n我用別人的雙眼看清了世界，\n自我卻在我腦海裡那樣模糊，\n從我失去主體性之眼的那一刻起，\n我就開始活在透過別人雙眼呈現的世界中。\n我甚至不太記得我的模樣，我發現我只能透過別人的描述來認識我自己。\n\n脾虛絕非是一種表面症狀，\n脾虛始於我失去自己的那一刻，\n只有自我存在的地方，脾土才能成長。\n只有主體視角的世界，才能給我堅實的力量，安撫我在外界施壓下受驚的自我。\n我開始理解，安全感始於我微笑直視所有人的一刻，我的世界誕生於我自己的雙眼中。我的自我主體才是我世界的創造者和審判者。\n\n脾虛者回到過去的世界，找到了沙發夾縫裡的眼鏡，戴上它打開了之前從未看清的劇本，\n第一行寫著：\n“臨走前，我偏偏將眼鏡遺落在了沙發的夾縫裡。」\n-\n\n始終是我自己選擇體驗這樣的劇情，\n脾虛者的遊戲任務就是在這個巨大的世界裡，找到他自己。", "養脾胃⁰¹⁸ ✨感激之心破萬難", "脾虛胃弱的人往往在兩條路面前無法順利做出選擇，\n脾虛者易糾結，糾結觸發憂思再次傷脾。\n擔心選擇的這條路荊棘密布路不好走，\n又害怕選了另一條路行人太多，\n景色平庸不夠獨特。\n\n剛踏上路途又開始後悔：\n「如果我過去踏上的是另一條路會怎樣呢？會不會比現在更好？」\n不斷地陷入憂思，\n又擔心前方又會再次遇到岔路：\n「未來我要怎麼選擇岔路，能保證我最大利益？」\n但我們從未認認真真走過腳下的路、\n看過當下路旁的風景。\n\n每一條路其實都沒有本質區別，\n荊棘叢生的道路多風景獨特，\n景色平庸的路途大多平坦而輕鬆，\n不存在完美的選擇。\n\n只做當下的體驗，\n不糾結對錯，\n不找出意義。\n\n脾虛之人多完美主義內質，\n害怕犯錯和失敗，\n戰戰兢兢草木皆兵。\n但完美只是你慾望建構的幻想，\n每一條路都有各自的景色，無從比較。\n你在每條路上都可以燃燒自己的熱情，\n時時刻刻去體驗生命，去了解自己。\n\n✨第一​​感覺療法是什麼呢？\n是時時刻刻提醒自己去回想面對抉擇最初的那一瞬間的感受，\n你在選項A或選項B中糾結，\n哪一個讓我觸發瞬間的怦然心動呢？\n那麼就堅定不移地選擇它。\n只是依靠第一直覺，堅定不移。\n在後來每個階段經常去回憶這個“第一感覺”，\n堅定地回憶它。因為，當初選擇它一定是有某種非常正當的理由。\n\n不糾結對錯，也不再後悔過去、恐懼未來\n只是抓住當下的瞬間感覺。\n它會帶領你體驗毫無能量浪費的全能專注狀態。\n你只要時時刻刻記得你最初的這個感受與選擇，不做猶豫地把事情完成，\n你的脾胃會獲得百分之百的能量供給。\n你因搖擺、恐懼、後悔、糾結而產生的憂思內耗也能至此終結", "養脾胃✨戀愛腦的通關遊戲", "對於我，一個很棒的方法：\n\n「去累積一些只有你自己才有訪問權限的經驗」。\n\n和伴侶無關，和朋友無關，\n但每當我回憶起這些經歷，\n會開心地掉下眼淚，\n我有無數的照片記錄下陪伴自己的每分每秒\n我可以說出每一次經歷背後的感受。\n當有人問我為了什麼而激動流淚，\n我會告訴他，這跟你無關。\n\n願我們都能勇敢，面對人生的不確定性，能保持內心的堅定，成為不期待回應而為他人放射光芒的火炬。", "養脾胃⁰¹⁶ ✨心靈磁鐵練習", "卸下脾虛之人的內在癥結—緊繃感的一個思考練習，將在這篇文章中與你分享。 🍃\n\n生命中註定屬於你的東西，其實會毫不費力地屬於你。也許有時看似遠離你，卻是繞個圈最終歸向你。\n你僅僅做你該做的事，專注於「你自己」。\n順其自然，你自是會無意識地向前一步去引導它流向你，無需去費力爭取。\n或與之相反的，\n追求不該屬於你的東西，特徵就是擁有它感覺無比費力且痛苦，內耗且緊繃。這種不捨，不是這件事物多美好，而是你的執念在拉扯，內在空洞在發癢。\n既然屬於你的東西和你有強大引力，那一切的費力，都是試圖在搶奪別的軌道上運行的星星。\n會讓真正屬於你的星星進入你的軌道的節點變得遙遠而漫長。\n因恐懼失去而逃離，其實是抄了近道去見它。\n因恐懼失去而搶奪，其實是讓同性磁鐵相斥的你們更快失去彼此。\n\n這些過度用的力，\n或不敢用力而內向的壓抑，\n最終流入你的脾胃，\n在幽深的地方累計超過負荷的重量。\n而生命本真的樣子，多會以最輕鬆的樣態呈現。\n\n道家講無為而治，\n僅僅順從內心深處的感受，\n一種強烈的感受。\n強烈的想愛一個人的感受。\n強烈的劇烈的痛苦並想離開他的感覺。\n強烈的想拒絕的感受。\n強烈的想辭職去做一件事的感受。\n順從它，順流而下。\n專注於「我」內在的感受。\n它在引導你找到你的宿命，\n你的真。\n\n✨觀想自己是一枚磁鐵。\n無需關心此刻圍繞在你身邊的為何物，\n是對或錯、好亦不好\n它們都與你無關。\n你只引來你生命藍圖注定要擁有的東西。\n想像自己散發著強磁的巨大的力量，在宇宙中心。感受自己的呼吸。\n呼氣時，不屬於你的能量遠離你，\n吸氣時，輕鬆和快樂流向你。\n此過程中渾身彌散著光芒和巨大力量。\n\n生命各自有其軌道。\n去牢牢控制別人，羨慕別人，去追求人人口中的「好」的生活、劇情、外表和戀人，不如放開手腳去活著。\n當你思想清明、狀態放鬆，\n你的道路會明朗，\n你的河流會清澈，\n你既定軌道上事物會來與你相逢", "別人：大家都做，你也應該這樣做。\n自我：他人認為我該做，我覺得我應該做。\n本我：我不想做。\n於是體內開始一場思想敵對。", "人類圖理論認為，脾中心面對處理所有恐懼的方式非常簡單有效，就是保持警醒，在當下的每一個片刻，對發生的事情做作出應對（wake up. pay attention to every situation in the now ）。", "所以從人類圖這個角度來講，動物是非常當下的。", "脾臟中心發出的警覺，在萬分之一秒中產生。這種警訊毫無來由，也無法用邏輯來判斷。它是來自你深層的動物本能。這時候，如果你的大腦的邏輯參與思考，去判斷這個警告到底有沒有意義，你會完全無從決定。在現實世界中，很多人又會用大腦去判斷並否定脾臟中心給你的警告。失去很多迴避危險或不利處境的機會。如果你是脾臟中心定義的人，要學習嘗試信任你的脾臟中心。", "開放的根部中心：通常代表一個容易感覺到生存壓力感的人。生存壓力感和生存壓力是兩回事。有這種能量配置的人通常會在生活中忙碌，無法放鬆，總覺得要把所有的事情都做完才能夠休息。", "開放的頭中心：從自己身上吸收放大很多他人的問題，會把它們當作自己的問題。腦中總是要有很多問題需要處理，甚至是不關事的問題。", "這兩個中心都是壓力中心。所以有這種能量配置的人，通常是壓力感比較大的。", "開放的情緒中心：通常代表一個人通常對衝突有本能的迴避，有可能在情感關係中缺乏真實的表達。這一定程度上會影響到一個人的親密關係的品質。", "關於恐懼，近來有些同學問我，老師，怎樣戰勝內在的恐懼？也有不少同學說，「開悟」就是消除恐懼。事實上，恐懼，不是我們的敵人，它也是我們自己的一部分。沒有了恐懼，那不是沒有了完整的自己了嗎？ 「開悟」的其中一個表現，並不是消滅了恐懼，而是顯現出一種沒有被恐懼控制的人生狀態。不再需要跟自己的黑暗面或恐懼戰鬥，相反，我們需要的是看見它，接納它，並且擁抱它。", "我們最深的恐懼和黑暗面，其實也是我們最深的力量所在！恐懼不一定是我們的敵人，它讓我們警醒、讓我們磨練更高的智慧。與恐懼為敵、明知山有虎，偏向虎山行，這是一種勇氣，但是如果還沒有打虎的本領，還要向虎山行，對自己則是種折磨。人類圖說，真正回歸自我的道路，不是去跟恐懼硬磕，是去堅持你的人生策略，內在權威。因為你去堅持這些原則的時候，你的頭腦、你的恐懼會告訴你、引導你，你其實應該做那個而不是這個，當這些發生的時候，你要看見你的恐懼，對他們說，謝謝你，但是我要堅持自己的選擇！這個回到自己的過程才是真正的戰鬥。", "真正的開悟，就是有能力，有勇氣做自己，當恐懼發生的時候，我們只是拍拍他的肩膀，讓他站在我們旁邊，跟我們一起體驗生命。", "(265)", "承認自己有時就是個膽小鬼", "承認自己就是無敵的貪癡瞋愚疑", "承認自己就是失敗者", "承認……", "沒什麼不好", "幽默就是", "取笑自己", "連要死的那一刻", "要離別的那一刻", "要痛到死的那一刻", "不用罪疚 懺悔", "只要取笑自己", "承認 好好體驗這所有的不完美", "面對癌症，多了幾分淡定", "面對自己，多了一些愛", "面對生活，多了一些篤定", "清明節完 聽Jazz 很矛盾卻出奇必須", "那是一種面對生離死別", "出奇的 放鬆 放下 ", "純粹的體驗", "即興的JAZZ，對應生命中的不確定", "像生活中的每一天都是一段未知的旅程", "情感豐富 喜怒哀樂", "每個樂手都有「自己的聲音」", "就像每個人都有自己的生命故事", "不管死去的 或正在死去的我們", "希望每個人 可以找到自己的方法", "從悲傷到喜悅", "從焦躁到平靜", "從渴望到滿足", "https://youtu.be/tT9Eh8wNMkw?si=i_I2Cyb4WCf8FqAc", "Dave Brubeck - Take Five (youtube.com)", "的藝術形式，它可以表達從愉悅到悲傷的各種情感，就像生命中的各種情感和體驗一樣。Jazz通過音樂表達出生活的，讓人感受到情感的共鳴。", "多樣性：Jazz音樂極其多樣化，包括了各種風格和表現形式，從慢板的抒情曲到快節奏的搖擺樂都有。這反映了生命中的多樣性，每個人都有自己獨特的人生故事和體驗。", "\n爵士樂手很擅長用音色的變換來改變想要傳遞的情感，例如印象中應該嘹亮高昂的小號，雖然在拉丁音樂裡可以表現的很激昂，卻也常常在爵士樂中演奏的鬱鬱寡歡扣人心弦，有趣的是，每個樂手都有「自己的聲音」，這就好像是每個人說話的聲音都不同，我們可以很容易的找到「相似」的音色，但要完全一樣，幾乎是不可能，這就是這音樂迷人的所在", "癌症不應該只被視為身體的疾病，它是透過身體而反映出來的人生狀況——許添盛\n\n不知不覺，已經辦了兩期網絡讀書會了，在讀書會中，我與那些身患癌症的病友一起探索致癌的心靈因素，一起尋找生命中那些如意與不如意的故事，一起探索她們的成長背景以及性格成因…\n\n在一次又一次的訴說中，她們開始覺察、成長、然後開始重新定義自己和看待癌症。\n\n正如我的老師許添盛醫師所說：癌症應該被視為人生的轉機，這個轉機不是教你如何去吃更多的健康食品，或是教你如何去找更多的抗癌方式。這個轉機是教你如何改變人生，引導你去重新檢視對生命的態度", "我曾治療過太多癌症病友，每個人內心都積壓著許多說不出的痛苦，有太深的矛盾和掙扎，完全找不到生命的出路。\n\n如果內心這部分的痛苦沒有解決，該如何抗癌呢？\n\n我們應該傾聽內心的聲音：「是的，我內心積壓太深的痛苦，太多的壓力，已陷入兩難的困境，不知該何去何從，也看不到未來的希望。」\n\n一旦我們找到內在的這個部分，便可打通意識和潛意識，能夠與潛意識和無意識重新對話。\n\n那時候，你可能感到很深的痛苦絕望，甚至內心湧起無限悲傷，但我們大家可以彼此扶持，一起來面對這個調整。\n\n……\n\n我的目標是幫助大家，在面對內心如此巨大的痛苦時，轉化你的生命。\n\n當你在面對內心絕望而能找到希望與光時，你是不會放棄生命的。\n\n以往的你，可能只是在意識層面上不願放棄生命，但現在的你，可以在痛苦中看到希望。\n\n這時候的你，是打通了意識與潛意識和無意識隔閡的你，是癌症的主人。", "你有多久沒有大笑了？\n\n你是否早已感覺不到快樂了？\n\n長期的負面情緒累積、集結會導致：\n\n1：肉體的疾病\n\n2：情緒問題（如失眠、焦慮、憂鬱）\n\n3：意外事件（如崴腳、車禍）\n\n長期的負面情緒如同身體的寒毒，不處理，不理會，就會形成疾病，所以，我們要常常去覺察、釋放自己的情緒。\n\n感到情緒來了，就去宣洩。\n\n去哭也好、喊也罷、只要不妨礙別人，怎麼都可以。\n\n或是找親人、朋友、心理諮商師訴說。\n\n如果我們把積壓的情緒訴說、讓另一個人看見、聽見，且能同理，其實就是一種療癒。\n\n很多負面情緒，包括心靈的瘀青也能慢慢癒合。", "從我多年研究癌症的經驗發現到，癌症發生的重要因素之一，即是一個人內心蘊藏、蓄積許多悲觀和痛苦的念頭，伴隨著它們的，往往是強烈的壓力、恐懼、無奈與絕望感。\n\n人體細胞病變就是這兩者的結合催化之下而產生的，因而，學習釋放內在負面能量是非常重要的一件事。\n\n癌症本身並不具傳染性，它的出現是要告訴大家：「一個人是否能繼續活下去，必須由自己來承擔。修行這件事完全在於個人。這條生死路上，唯有你自己踽踽獨行，所以必須學會放下。」\n\n其實，癌友們都是命中註定的修行者，他們因為生命巨變，不得不誠實面對自己，並且腳踏實地去走人生的每一步路。\n\n目前大多數人都是以化療和放療來抗癌，若我們整天心境處於緊張或恐懼的狀態，癌細胞反而因負面情緒而得到滋養。\n\n如今，已有大力提倡與癌細胞和平共處的觀念──面對癌細胞，一味對抗可能只會兩敗俱傷，不如談判和解，採取不得已的妥協作法。\n\n這是透過接受癌症存在的方式，以降低內在的焦慮和恐懼，達到「與癌細胞和平共存」得目的。\n\n不過，我希望傳授大家的方法既非對抗，也不是與之和平共處，而是要讓癌細胞「浪子回頭」──讓癌細胞不想再當癌細胞，使它被感化、降服後，願意再回來當正常細胞。\n\n如果了解到癌細胞如何形成，它的本質及其存在的意義，甚至其衍變方式，那我們就可以有辦法使其回頭，變成正常細胞。\n\n假如你心中對於癌細胞或自我有任何形式的憎恨，這種負面情緒會成為癌細胞滋長的動力。\n\n有人得知自己罹患癌症後，內心怨天尤人，不斷向外尋找可能致癌的肇因，但這種心態反而讓癌細胞抓到擴張勢力的機會。\n\n其實，包括我自己在內，每個人身上都有癌細胞，它們可以隨時感應你的情緒波動；因此，若內心懷著憎恨和恐懼的情緒，根本無助於改善病情，而只會使病情更加惡化。", "📍一，只要你當下在享受，那你的人生就是有意義的\n\n大部分人忽略了一個真相：\n🌿那就是很多事情它不需要有意義；\n\n吃喝玩樂不等於虛度光陰，吃苦耐勞也不等於意義非凡。\n\n當你焦慮、精神內耗的時候，請一定要記得，人生是各種體驗的疊加。\n\n🌿只要你想，你就可以去做那些看似毫無意義的事情，比如說發呆、看日出、數星星、或是在這種古村的小路漫步，..你的體驗就是意義。\n\n人生不一定要去做大家世俗認為有意義的事情才對，也不是非得按照社會主流價值觀去生活，如20多歲要娶妻生子、30而立有車有房，這些都是別人給的意義，是否執行就看我們自己。\n\n🌿誰都是第一次來人世間，意義是我們自己賦予的，人生是曠野不是軌道，只要當下你是享受的就是有意義的。希望我們活到生命的最後一刻時，都能坦然的說出那句話，歲月不饒人，我也未曾饒過歲月，我來過，我有過酸甜苦辣的體驗和回憶，我很幸福。\n\n📍二，請不要去優化你沒有走過的路\n有很多人會說，早知道當初該怎麼辦。\n總覺得自己當初如果選了沒有選擇的那條路也許現在會更好。\n\n🌿曾經看過一句話，你想要的生活不總是在別處，就在當下。\n\n畢竟每條路都有困難，你不能一遇到困難就想當初做了一個錯誤的決定才讓你遇到了現在的困難。你要想的是如何把眼前的這個困難解決掉。\n\n🌿只有擁有了解決問題的能力才能夠步步生花。\n\n📍三，只要你夠堅定，全世界都會為你鋪路\n大部分人大部分時候都不能堅定做自己。\n\n你記住，無論你現在是什麼人，也無論你現在是什麼樣的狀態，家庭條件，學歷，外形條件如何，這些其實都不是太重要。\n🌿\n重要的是你要堅定，你要有超強的決心。你要有超越你身邊99%的人的堅定，你要有超越你身邊99%的人的決心。你要比你身邊99%的人都要勇敢。它比任何東西都珍貴。\n🌿\n說白了一個人在什麼情況下，可以把他生命底層的熱忱全部開發出來？其實就是你那個不顧一切豁出去的決心，就是你那個無論如何、不惜一切代價都要成為自己想要成為的人的決心。\n\n🌿\n當你真的具備這樣的堅定與決心的時候，當你從想要到非常要，到一定要的時候，其實你最終一定會實現。\n🌿\n因為宇宙的真相就是，你相信什麼，什麼就會顯現出來。你相信什麼，你就會有什麼等級的能量。\n\n只要你夠堅定，宇宙裡所有同頻的因子 挑上而勝負欲作祟？\n\n別把寶貴的時間用在哄抬豬價上。\n\n去掉濾鏡和幻想，其實你心裡清楚他啥也不是。\n\n只是你自己太焦慮，失去他，你沒有了方向，你的未來規劃都只有跟他一起做的事，失去他，好像失去了未來。\n\n這種恐懼，才是讓你不敢對他祛魅的元兇。\n\n找回只屬於自己的節奏。\n", "下面是三種可能情況：", "若我們患上高血壓，可能顯示我們對某些人有未解決的苦毒－因此，批判、譴責，和不肯饒恕他們。", "若我們已確診為可能患有心臟病的人，我們可能對別人所做的有未解決的憤怒和悲傷－因此，不饒恕他們。", "若我們發覺自己的腸胃持續有問題，我們可能是堅持著許多恐懼和焦慮－因此，才産生一種無能對神全心全意的信靠，是因為一些過去的創傷，及我們沒有饒恕的人。", "不饒恕、苦毒、怨恨和批判，通通都對我們與神的關係有不利的影響。", "走生命之樹", "的信 望 愛", "祛魅後，真的治好了我的精神內耗！", "我現在對祛魅的理解：你的好，與我無關。\n\n😢\n\n可是，當我對高學歷的人很魅時，接觸到了以後，發現也有很多人人品堪憂。\n\n當我對光鮮職業很魅時，真的去交涉後，發現也不是只有偉光正，狹隘，算計，和刁鑽也摻雜其中。\n\n📖慢慢的發現，我們往往是對自己沒有接觸到的事情，有一種嚮往，會不自覺的美化，並且不斷矮化自己和自己擅長的事情。\n\n都說世界是一個巨大的草台班子，每個人在演繹著自己的故事，都有自己的課題，他可能見過名山大川，但是你也能分清韭菜和野草，你們只是見到了世界的不同面，平等的看待就好。\n\n✔️請記住：對方再厲害，也不管你的事，不神化對方，也不矮化自己。\n\n📝祛魅後，不再內耗自己，反而生活的更自在，更容易保持對未知的好奇、熱愛、以及期待。\n對真誠熱情，向上的生命力充滿了嚮往，整個人反而更加氣血充盈啦～\n\n我是堅持養氣血的33歲的小滿呀，分享養生，成長，變美，變健康的日常，歡迎關注，一起變更好", "建議：不要慕強，要祛魅。", "祛魅就是：\n你優不優秀、過得好不好，都跟我無關。\n.\n曾經，我很不自信。總覺得別人很厲害，什麼都比自己強。我個子矮、臉上還長痘痘，所以我羨慕那些長得漂亮的女生。我大學只考了一個獨立院校，也會覺得自己很差勁，不如別人。畢業了，同儕都考上了事業編，今天教師節，好多人都在分享。如果是以前的自己，一定會很羨慕她們。但如今，我學會了祛魅，接受了自己。只覺每個人都有自己的活法，勇敢做自己挺好的。\n.\n學會對美貌祛魅\n別人最大的優勢來自於你對他的濾鏡。\n才上大學時，我室友是外省的妹子，張得很漂亮，穿搭也很時髦。反觀自己，從小山村出來，衣著還停留在高中時期。不會化妝，只會塗點防曬。看著室友的美貌，說實話，我是羨慕的。隨著時間的推移，也越發了解室友。有時候，外貌並不是一個人的全部。她會抽煙，作息不固定，對她的美貌的羨慕感也慢慢褪去。我選擇做自己，不喜歡緊身衣服，就穿舒適寬鬆的就好。不喜歡濃妝，畫個淡妝，清清秀秀的就好。對美貌祛魅，勇敢做自己。\n.\n學會對能力祛魅\n其實，很多人很水的。\n過去，我看到別人的侃侃而談，總會先入為主的認為他很厲害，也總是相信他所說的。發生一些事後，讓我慢慢打破總認為別人很優秀的濾鏡。我們每個人都是普通人，別人不會比你高貴到哪裡。大學加入文學社，當時的社長很會吹，顯得自己多厲害。身為學妹，我們很多人對他很仰慕，覺得他能力強，有文采。可前不久瀏覽朋友圈，發現他過得也不好。別人一時的榮光不代表一切，學會對能力祛魅，不去慕強。\n.\n學會對學歷祛魅\n學歷並不代表你的全部。\n說實話，我是獨立院校畢業，上學時別人問我在哪裡上學。我都不好意思說學校名字，而是選擇說城市。但現在畢業，別人問我，就大大方方說出來。學歷並不是一個人的全部。除去學歷，你還可以擁有無限的可能性。雖然是獨立院校，但大學我積極參與活動，拿獎學金，做自媒體。這些都為我提供了更多的機會。即使是三本生，就讀獨立院校，我也可以活出自己啊。\n.\n不去慕強，學會祛魅。\n不要矮化自己，也不必神話別人。\n.\n我是粒粒，一個正在成長的01年畢業生。\n「說最溫柔的話，做最勇敢的事」\n歡迎點擊我的頭像，查看更多筆記，我們一起變得更好。", "祛魅的最好方式", "祛魅的本質就是消除對方的神秘感\n認識到對方的本質並無特別\n所以能夠放下對對方的執念\n從而可以重新專注自身\n不再為他人或事物所累\n祛魅的最好辦法就是擁有\n但擁有可以有很多定義\n擁有實體擁有知識擁有優良的品質\n都是擁有\n隻要一個人的關注點始終在自己身上\n始終聚焦於如何提升自己\n那她就不容易對外物產生執念\n也不容易對一個人產生過分的佔有和控制欲\n擁有的本質就是聚焦自身放下執念\n沒有絕對特別的人\n你自己也是獨一無二的閃光存在\n認識到這一點之後\n就完成了對外物和別人的祛魅\n從而能夠與一切正常相處", "養氣血，其實就是一個「不斷祛魅」的過程。", "曾經，甜甜總是羨慕別人，總會因為別人的某些閃光點而變得卑微，覺得自己不夠出色，總在貶低自己，甚至嚴重懷疑自我。\n\n🔺可是，當我對能力強的人很魅的時候，總會先入為主，接觸了以後，發現也有很多人人品堪憂。\n\n🔻當我對985高學歷的人很魅時，卻發現沉迷遊戲、素質低下、被勸退學的大有人在……\n\n", "祛魅後，整個人能量都提升了！", "\n\n祛魅就是退掉光環，看到本質的過程，無需過度推崇別人的外表、能力、學歷。見人如人，放下濾鏡，你我都只是普通人\n\n看到自己的價值。當你羨慕別人時，也就忽略了那個潛力無限的自己\n\n接受自己，挖掘自己，不去矮化、內耗自己，珍惜自己的特點，做自己擅長的\n\n更多看到自己的成長，而不是迷戀別人的成功或優點。積極學習、提升自己，積極進取，獨自豐盈\n\n多運動，走出門，釋放能量，就像小孩子那樣；多行動，少幻想，很多事不怕做錯，怕的是甚至無法開始\n\n與其羨慕、美化、甚至神化他人，為別人歡呼造勢，不如自己下場實踐，去做、去成為、去感受、去思考…… ", "學會祛魅，我再也不精神內耗了！", "什麼是祛魅？ ——我覺得是「你很厲害，但與我無關」\n\n以前總會因為別人的閃光點而變得卑微。\n因為別人高高在上的職位不敢發表自己的觀點。\n當別人侵犯到自己利益時會想「他這麼厲害，我有什麼資格跟他理論」\n\n是不是所有身弱、氣血不足的姊妹都會跟我有一樣的想法？\n\n身弱的人本就喜歡內耗，敏感、不諳人情世故，同時又倔顰要強、高冷不夠圓滑。\n在人生經歷上，容易遇到很多違緣障礙，會經歷大大小小的挫折坎坷。\n在人際交往上，很容易被強勢和精明的人利用、壓制、甚至傷害。\n\n當我學會祛魅後，整個人能量都提升了！\n請記住，對方再厲害，也不管你的事，不要神化對方，也不要矮化自己。\n再也不要去神話任何人，敬自己偉大而孤獨一份的生命\n多運動，走出門，釋放能量，就像小時候那樣\n多行動，少幻想，很多事不怕做錯，怕的是甚至無法開始。\n\n心神安定，身心統一，你就會找到與自然萬物同頻的節奏~\n\n我是在養身養心的時小仙，關注我，知行合一，一起變更好！", "不要慕強，要祛魅", "慕強的本質，只是神化了別人：\n遇到所謂大佬，就覺得別人怎麼那麼厲害，什麼都好，\n學歷高的人肯定什麼都厲害；\n交際能力強的同事簡直太牛了；\n大佬做的決策一定更對、一定更好...... \n.\n對「強者」投入崇拜，鍍上光環，無限放大對方身上的閃耀，感覺對方什麼都好\n而自己呢？你把光芒都投射給了“強者”，自己在陰暗處一點點矮化。\n.\n人的眼裡總是只是能看到自己的缺點，而拼命放大別人的優點。\n羨慕別人那些自己沒有的特質。\n但拿自己的短板和別人的長板去比，越比越貶低自己。\n.\n一個方面比你強，不一定代表他所有方面都比你好。\n與其盯著別人的閃光點，不如把注意力轉回自己身上，\n祛魅，慕自己的「強」。\n專注自身長版，自己天生比別人更擅長的，優勢、天份。\n.", "人要變強，從學會祛魅開始", "1️⃣對權力裊魅\n我比較幸運，三任前男友都是Director以上的職位，所以比較早就能近距離地接觸和觀察這些「高階主管」\n👋你以為他們一定更聰明？很多時候只是他們有更多信息，所以看起來更高明；看起來更有經驗？因為他們撲過的街更多，所以現在更有技巧了；看起來更穩重可靠？因為他混職場更久，更擅長捉摸老闆的喜好而已\n👋也會被老闆PUA和罵老闆、也會上班時間摸魚划水談情說愛、也會WFH的時候一邊摳腳一邊開會\n作為下屬，要把心態擺在“現在是你請我來幫你解決問題”，而不是“我求你給我一份工作”，大家都是互相成就的苦逼打工人而已\n· \n2️⃣對異性裊魅\n曾因為「我男友是第二代/海龜/主管/月入10w」這些Title讓自己變得患得患失、自卑懦弱。在幾段感情裡分分合合、拉扯一年分手之後，我才徹底明白，一段親密關係能成立的前提是：它讓你感到安全、自信、充滿力量，而不是讓你花光力氣去維持對方「人設」帶給你的虛榮\n不是所有的得到都是幸運，與其讓他的光芒把你灼傷，不如自成山海\n· \n3️⃣對光環袪魅\n人際關係的本質是價值交換\n🟡客觀的價值交換：從來不會對喜歡自吹自擂的「大佬」高看一眼，原因很簡單：① 我始終認為，非同類人的緣分都很淺，沒必要勉強逢迎；② 再厲害也不能給我實際價值、那我又何必提供情緒價值\n價值平等的人自會互相吸引，不對等的關係遲早崩盤，攀附的最後大概率是竹籃打水一場空，既然本就各不相干，何必妄自菲薄\n🟡主觀的自我價值：我曾經很迷戀海歸、二代、名校這些光環。但慢慢發現，我也成為了海歸、我有能力富養自己、我的工作也不差、身邊的朋友都很優秀\n當投射在他人身上的理想自我成為自我，你自然會擁有所謂的「穩定內核”，不再迷信標籤、不再覺得低人一等\n你很好，與我何關，我也不差", "成長是對所有的客體體驗裊魅」讓我深思。\n🚏小時候，我們總被那些閃閃發光的特質所吸引，像是高學歷、才華洋溢。但長大後，我漸漸明白，這些慕強心理其實源自於我們對自己的潛意識期待。我們渴望透過外在的特質來填補自己內心的空缺，期待別人能幫助我們實現人生的期望。\n💔但這樣的期待是短暫的，因為真正的幸福和成長來自於我們自己。靠別人幫忙的人生不是長久之計，真正的成長是看清自己，接納自己，然後努力成為更好的自己。\n\n🌈如今我深刻意識到袪魅的重要性。只有去掉那些精英角色的光環，我們才能真正看到人性的多元面貌，包括冷漠、自私和貪婪。\n🚏菁英的光環並不能代表他們的全部，他們的愛與尊重才是與我們息息相關的。因此，我們不必盲目追捧，而是應該明確自己的需求，努力成為那個能滿足自己的人。\n🌍同樣，職業濾鏡也需要裊魅。無論是大廠打工人、老師、醫生、外送員或快遞小哥，每個職業背後都有其獨特的辛酸和挑戰。\n💪最重要的是，每個職業都在考驗人性。因此，我們不應該美化或貶低任何職業，而是應該尊重並理解每個職業背後的努力和付出。\n🌟袪魅讓我們更真實地看待人和職業，擁抱生活的多元性。當我們去除那些外在的標籤和濾鏡，我們就能更深入地了解自己和他人，找到真正的幸福和滿足。\n💪所以，看清那些外在的標籤和濾鏡，看到每個人的真實面貌。不再盲目追求外在的特質，而是專注於自己的內在需求和成長。\n🌟成長是一場漫長的旅程，但只要我們願意袪魅，看清自己，我們就能找到真正的幸福和滿足。", "祛魅，祛的是潛意識裡的不配得感", "對學歷、title、大廠這些「虛榮指標」祛魅zui簡單，因為這些人本來就很弱，你越靠近就愈失望。但如果你從此以後看任何事情，都帶著「這有什麼大不了的，我也能做」的眼光，你就可能真的什麼事情都不做了！\n。\n而隨著你慢慢成長，你終究會遇到比你想像的還要厲害，甚至活在你想像之外的人；愈是深入交往，愈是被對方的閱歷、認知和思維方式折服。\n\n但你依然要對這樣的人祛魅。\n\n你要意識到，對方也是一個「人」，飯是一口一口吃的，路也是一步一步走的。而你之所以盲目崇拜對方，是因為你想要萬丈高樓平地起，五年內做成別人十年、二十年做成的事情；\n\n又或者只是享受成功帶來的虛榮表徵，所以能量從來沒有聚焦在思考“如何做成這件事”，而是耗散在妄想“如果成功的人是我該有多爽啊”。\n.\n所以，祛魅就是看到本質、提升自己的配得感，從先識別出【本就不值得追求】的東西，再到養成【這真的很厲害，而我也能做到】的信念感。\n.\n祛魅的第三重意義就是，你是和那些厲害的人一起創造商業價值，而不是去追星和交朋友的。\n\n記得大學實習的時候，上司要我直接去邀請一位在某領域非常有名的專家來出席我們的活動。那時候我還帶著非常稚嫩的學生氣，第yi反應belike：我？除掉唐僧師徒？\n\n但沒想到的是，當我直接私訊對方，將我們這場活動能帶給他的曝光數據和垂直用戶畫像呈現給他時，對方立刻回復了我，並在詳細了解活動詳情之後接受了我的邀請。\n\n事實上，只要你能在網路上看到一個人，而此人有極強的個人IP意識，那麼都是在釋放一個訊號：快來連結我，和我交換利益、創造價值。不管TA把自己包裝的多麼光鮮亮麗，都是一種商業上的「孔雀開屏」行為。\n.\n作為一個曾經被成功學荼毒多年的做題家，我從初中開始就被老師用“不要自我設限”這樣的語錄洗腦。\n\n在一次一次失敗打擊之後，我開始意識到，人是無法透過一遍遍告訴自己「不要自我設限」來消除潛意識裡的自卑感的。而你越是失敗，就越是會給自己設立很多遠超出自身能力的目標來試圖緩解自卑，然後再次失敗……直到認命為止。\n\n同樣，你也無法透過告訴自己「你要祛魅」來消除對崇拜之物的濾鏡。\n\n你祛魅了，只因為你見過、經歷過、擁有過。所以，還是要去多多經歷和事上磨練！", "最近看到一個觀點特別讓我有共鳴，你崇拜什麼，你就會對什麼自卑。\n我以前有個毛病，我看見某一方面厲害的很突出的人，比如他學歷比我高、賺錢比我多、閱歷比我豐富，我就會緊張放不開，有壓迫感，感覺自己很渺小很自卑，然後莫名其妙的在和他的對話和相處模式中自動給了自己下位者的位置，在他面前容易表現的畏縮縮縮、唯唯諾諾的。\n雖然不想承認，但是這種面對“比我們厲害”的人的就不淡定了，就是“魅”，而今天想和大家聊的，是“祛魅”，學會去除對學歷、權威、地位、金錢的“魅”，未來不管你遇到多麼厲害的人，依舊可以不卑不亢，自信從容自洽", "您可以透過食用大量生的、發芽的和發酵的水果 以幫助維持適當的皮質醇水平。", "皮質醇對健康和身體組成的影響：", "• 肌肉代謝：長期高皮質醇水平可能導致肌肉組織分解，對肌肉質量和力量產生不利影響。", "• 脂肪沉積：過高的皮質醇水平與脂肪的累積和分佈模式有關，尤其是腹部脂肪。", "• 免疫功能：長期高皮質醇水平可能抑制免疫系統的功能，增加感染和發炎風險。", "🍓其他與皮質醇相關的荷爾蒙", "• 腎上腺素：腎上腺素是一種荷爾蒙和神經傳導物質，它與皮質醇一起被腎上腺分泌。在壓力狀態下，腎上腺素的釋放增加，與皮質醇一起協同作用，幫助調節壓力反應和應對壓力。", "• 血清皮質醇結合球蛋白（CBG）：CBG是一種結合蛋白，它與皮質醇結合，有助於運送皮質醇到身體的各個組織。CBG的水平可以影響皮質醇的生物活性和可用性。", "• 睪固酮與雌激素：性荷爾蒙如睪固酮（男性荷爾蒙）和雌激素（女性荷爾蒙）與皮質醇之間存在交互作用。研究發現，睪固酮水平下降和雌激素水平升高可能與皮質醇的增加有關。", "• 生長激素：生長激素在身體生長和修復方面扮演重要角色。它與皮質醇的關係複雜，高水平的皮質醇可能抑制生長激素的分泌，進而影響肌肉生長和恢復。", "皮質醇作用", "一、好處", "皮質醇有抗發炎效果，它不會引發炎症，但是炎症發生後，它會增多分泌。這對於訓練後肌肉修復非常有用。所以要慎用皮質醇阻斷劑，在肌肉修復時，皮質醇還是重要的。皮質醇也有分解脂肪的作用，就是說它會加速脂肪細胞釋放儲存的脂肪。", "二、壞處", "①看起來浮腫。", "皮質醇長期升高，會出現水分滯留現象。水瀦留會讓你感覺健身沒有結果，減脂停止了。這是因為多餘的水分佔據了你消耗的脂肪，所以你的體重一直沒什麼變化。", "就單次訓練來說，一開始身體會分泌更多去甲腎上腺素、多巴胺和睪固酮，少量皮質醇。但進入疲勞期後，如果還不停止，就會釋放大量皮質醇，以應對當前疲勞（荷爾蒙的使命是自我保護）。此外，短時間極限運動和長時間劇烈運動都會升高皮質醇水平。此時，由於水瀦留的原因，身體會看起來浮腫。", "②脂肪難減，皮質醇屬於糖皮質激素，有些人吃激素類的藥會變胖，就是指的糖皮質激素。皮質醇水平增高會使內臟脂肪細胞分化，細胞數量增加，導致向心性肥胖（蘋果型身材）。", "③變胖，皮質醇引起增重是因為它使你胃口大開。皮質醇使得腦部對於瘦蛋白的敏感度降低，阻礙了飽足感訊號，可能讓你比平常更飢餓。皮質醇也會刺激你的胃口，尤其是那些高糖高脂肪的食物對你特別有吸引力。這對那些因為焦慮而分泌大量皮質醇的人來說更糟糕，他們通常會吃大量的食物來緩解焦慮。通常，這時候他們選的食物都是那種高糖高脂肪的食品，主要是因為這些食品能幫助緩解人體的慢性焦慮反應。", "皮質醇 - 一種壓力荷爾蒙，來自壓力，會導致焦慮", "高皮質醇症狀：", "1. 腹部脂肪", "2. 過敏氣喘", "3. 糖尿病", "4. 一直想事情", "5. 高血壓", "6. 高膽固醇", "7. 低維生素 D", "8. 圓臉(酒渣)", "9. 難以承受壓力", "10. 青春痘", "11.焦慮", "12抗壓性低 (不耐壓力)", "13 發炎", "14血糖問題", "15渴望吃碳水", "16性慾減退", "17鉀減少", "18鹼中毒(Alkalosis)", "19不寧腿症候群(restless legs syndrome).", "20無法入睡", "21食慾增強，胃口變好體內脂肪增加", "22肌肉量減少", "23骨密度減小", "24焦慮加重", "25憂鬱加重", "26情緒波動大（易怒）", "27性慾減退", "28免疫系統受損", "29記憶力及學習能力下降1經前症候群症狀加重，如液體滯留，易怒", "30月經週期改變", "31更年期症狀加重，如潮熱，盜汗", "32 每晚凌晨 2:00 - 2:30 左右會醒來，腦中很多想法一直轉，醒著直到早上 8:00 左右。", "33暴食肥胖", "34身體透過分泌皮質醇來對抗壓力，於是開啟了節流♻️模式。當皮質醇水平過高時，會限制身體分泌胰島素來消耗醣類物質，形成胰島素阻抗，醣類消耗減少⤵️，體內堆積⤴️脂肪，引起肥胖。", "35荷爾蒙分泌異常", "睪固酮、甲狀腺素、胰島素、雌激素、生長激素、褪黑素的分泌異常。荷爾蒙分泌異常會帶動身體內分泌失調，引發睡眠不佳、消化異常、焦慮、高血壓、免疫系統、生殖系統等問題。", "36抑制免疫系統", "皮質醇屬於壓力荷爾蒙的一種，當皮質醇分泌過高時，它會調動身體的能量資源去應對壓力，相對的就會降低T細胞的免疫功能，〽️削弱免疫系統功能。", "消化不良和情緒問題", "37高水平的皮質醇對腸道有一定破壞作用，會改變腸道健康微環境，帶來消化不良的問題。當腸道 function lines(s,max){let out=[],line='',n=0;const tokens=s.match(/[A-Za-z0-9]+(?:[’'-][A-Za-z0-9]+)*|\s+|[^\x00-\x7F]|./g)||[];for(const token of tokens){const w=Array.from(token).reduce((sum,c)=>sum+(/[\u0000-\u00ff]/.test(c)?.55:1),0);if(n+w>max&&line.trim()){out.push(line.trim());line='';n=0}if(!line&&/^\s+$/.test(token))continue;line+=token;n+=w}if(line.trim())out.push(line.trim());return out}
function svgText(s,x,y,size,max,color,font='sans-serif',lineHeight=1.5){return `<text x="${x}" y="${y}" fill="${color}" font-family="${font}" font-size="${size}">${lines(s,max).map((l,i)=>`<tspan x="${x}" dy="${i?size*lineHeight:0}">${esc(l)}</tspan>`).join('')}</text>`}
function graphicSvg(p,mode){const idx=POSTS.indexOf(p),palette=[['#244d43','#f5f2e9','#cfad7b'],['#59493d','#fbf4e7','#d1af77'],['#374b60','#f1f3ef','#c8b28b']][idx%3];const [bg,fg,gold]=palette;const z=mode!=='en',title=z?p.title:p.en,quote=z?p.quote:p.quoteEn;return `<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="${bg}"/><circle cx="1010" cy="165" r="300" fill="none" stroke="${gold}" stroke-opacity=".2"/><circle cx="1020" cy="180" r="260" fill="none" stroke="${gold}" stroke-opacity=".12"/><path d="M780 0C560 220 1070 320 875 690" fill="none" stroke="${gold}" stroke-opacity=".22" stroke-width="2"/><path d="M0 1100Q530 900 1080 1170L1080 1350H0Z" fill="${fg}" fill-opacity=".035"/><text x="90" y="115" fill="${gold}" font-size="22" font-family="sans-serif" letter-spacing="4">A PLACE WITHIN · ${String(idx+1).padStart(2,'0')} / 27</text><line x1="90" y1="165" x2="990" y2="165" stroke="${gold}" stroke-opacity=".5"/>${svgText(title,90,290,z?61:64,z?14:14,fg,'serif',1.55)}${mode==='bi'?svgText(p.en,94,600,28,28,gold,'sans-serif',1.55):''}<text x="80" y="${mode==='bi'?785:735}" fill="${gold}" font-size="125" font-family="serif">“</text>${svgText(quote,105,mode==='bi'?850:800,43,19,fg,'serif',1.6)}<line x1="90" y1="1140" x2="990" y2="1140" stroke="${gold}" stroke-opacity=".5"/><text x="90" y="1210" fill="${fg}" font-size="32" font-family="serif">${z?'心之所居':'A Place Within'}</text><text x="90" y="1260" fill="${gold}" font-size="20" font-family="sans-serif">${z?'生活中的哲學 · 原創文字':'Everyday philosophy · Original writing'}</text><text x="990" y="1260" text-anchor="end" fill="${gold}" font-size="18" font-family="sans-serif">1080 × 1350</text></svg>`}
function graphicUrl(p,mode){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(graphicSvg(p,mode))}
function postShelf(id){const p=getPost(id);if(!p)return '';return `<section class="page-post-shelf"><div><span class="eyebrow">FACEBOOK STORIES · ${POSTS.indexOf(p)+1} / 27</span><h2>${b(p.title,p.en)}</h2><p>${b(p.quote,p.quoteEn)}</p><span class="post-meta">${postCount(p)} ${t('中文字 · 英文改寫版 · 8 種寫法','Chinese characters · English adaptation · 8 writing elements')}</span></div>${postButton(id,t('閱讀本頁完整圖文 ↗','Read this page’s full post ↗'))}</section>`}
function libraryItems(){return POSTS.filter(p=>(postGroup==='all'||(postGroup==='page'&&p.id.startsWith('page-'))||(postGroup==='topic'&&p.id.startsWith('topic-')))&&(!postSearch||[p.title,p.en,p.quote,p.quoteEn,...p.parts.flat()].join(' ').toLowerCase().includes(postSearch.toLowerCase())))}
function libraryCards(){const a=libraryItems();return a.length?`<div class="grid post-library">${a.map(p=>`<article class="card"><img loading="lazy" src="${graphicUrl(p,lang)}" alt="${esc(t(p.quote,p.quoteEn))}"><span class="tag">${p.id.startsWith('page-')?t('頁面專文','PAGE ESSAY'):t('主題專文','TOPIC ESSAY')} · ${postCount(p)} ${t('字','characters')}</span><h2>${b(p.title,p.en)}</h2><div class="actions">${postButton(p.id,t('閱讀與下載 ↗','Read & download ↗'))}</div></article>`).join('')}</div>`:`<p>${t('沒有符合的圖文。','No matching posts.')}</p>`}
const oldRenderMain=renderMain;
renderMain=function(){if(view==='posts'){$('#main').innerHTML=`<div class="eyebrow">27 ORIGINAL STORIES</div><h2>${b('讓一句話，觸動一段真實生活','Let a sentence touch an actual life')}</h2><p>${b('7 個頁面、20 個主題，每篇中文約 1,000 字，另附較精簡的英文改寫版。原創文字，不是哲學家原句，也不會自動發布到臉書。','Seven page essays and twenty topic essays, each approximately 1,000 Chinese characters with a shorter English adaptation. Original writing, not verbatim philosopher quotations. Nothing is posted to Facebook automatically.')}</p><div class="toolbar"><input type="search" id="postSearch" aria-label="${t('搜尋圖文','Search posts')}" placeholder="${t('搜尋標題、金句或全文…','Search titles, quotes, or body text…')}" value="${esc(postSearch)}"><select id="postGroup" aria-label="${t('圖文分類','Post group')}">${[['all','全部 27 篇','All 27'],['page','頁面專文 7 篇','7 page essays'],['topic','主題專文 20 篇','20 topic essays']].map(([v,z,e])=>`<option value="${v}" ${postGroup===v?'selected':''}>${t(z,e)}</option>`).join('')}</select><button id="exportPosts">${t('下載全部文案','Export all copy')}</button></div><div id="postResults">${libraryCards()}</div>`;return}oldRenderMain();$('#main').insertAdjacentHTML('afterbegin',postShelf('page-'+view));enhanceFields()};
function enhanceFields(){if(view==='explore')document.querySelectorAll('[data-open]').forEach(q=>{if(!q.parentElement.querySelector('[data-post]'))q.insertAdjacentHTML('afterend',postButton('topic-'+q.dataset.open))});if(view==='table'){const tr=document.querySelector('thead tr');tr?.insertAdjacentHTML('beforeend',`<th>${t('臉書圖文','Facebook story')}</th>`);document.querySelectorAll('tbody tr').forEach((r,i)=>r.insertAdjacentHTML('beforeend',`<td>${postButton('topic-'+i)}</td>`))}if(view==='journal')document.querySelectorAll('[data-done]').forEach(q=>q.closest('p').insertAdjacentHTML('beforeend',' '+postButton('topic-'+q.dataset.done,t('延伸圖文','Related post'))));if(view==='about')$('#main').insertAdjacentHTML('beforeend',`<section class="post-references"><h3>${t('哲學閱讀參考','Philosophy reading references')}</h3><p>${b('文中的故事為原創情境，哲學應用為編者詮釋；不以哲學命題證明健康療效。','The stories are original scenarios and the philosophical applications are editorial interpretations, not claims of health efficacy.')}</p><a href="https://www.wittgensteinproject.org/w/index.php/Blog:Introduction_to_Wittgenstein%E2%80%99s_Philosophical_Investigations" target="_blank" rel="noopener">The Ludwig Wittgenstein Project ↗</a> · <a href="https://plato.stanford.edu/entries/authenticity/" target="_blank" rel="noopener">Stanford Encyclopedia of Philosophy: Authenticity ↗</a></section>`)}
const oldOpenTopic=openTopic;openTopic=function(i){oldOpenTopic(i);$('#detail').insertAdjacentHTML('beforeend',`<div class="topic-post-link">${postButton('topic-'+i,t('閱讀約 1,000 字臉書圖文與圖卡 ↗','Read the long-form story & graphic ↗'))}</div>`)};
tabs.push(['posts','臉書圖文庫','Post studio']);
function openPost(id,keepMode=false){const p=getPost(id);if(!p)return;currentPost=p;if(!keepMode)postMode=lang;$('#dialog').classList.add('post-dialog');const indices=postMode==='bi'?[0,1]:[postMode==='en'?1:0];$('#detail').innerHTML=`<div class="post-dialog-heading"><span class="eyebrow">FACEBOOK STORY · ${POSTS.indexOf(p)+1} / 27</span><h2>${postMode==='en'?esc(p.en):esc(p.title)+(postMode==='bi'?'<span class="en">'+esc(p.en)+'</span>':'')}</h2><div class="post-meta">${postCount(p)} ${t('中文字 · 英文為精簡改寫版','Chinese characters · English is a shorter adaptation')}</div></div><div class="post-tools"><div class="language">${[['zh','繁中'],['en','EN'],['bi','中 / EN']].map(([v,n])=>`<button data-post-mode="${v}" class="${postMode===v?'active':''}">${n}</button>`).join('')}</div><button id="copyPost">${t('複製全文','Copy full post')}</button><button id="pngPost">${t('下載 PNG 圖卡','Download PNG graphic')}</button><button id="svgPost">${t('下載 SVG','Download SVG')}</button><button id="txtPost">${t('下載文案','Download text')}</button></div><div class="post-layout"><aside><img class="post-graphic" src="${graphicUrl(p,postMode)}" alt="${esc(postMode==='en'?p.quoteEn:p.quote)}"><p class="post-meta">1080 × 1350 · ${t('原創圖卡','Original graphic')}</p><p class="post-interpretation">${t('哲學應用為編者詮釋。圖卡上的句子為原創，不是哲學家引言。','The philosophy is an editorial application. Graphic text is original, not a quotation from a philosopher.')}</p></aside><article><label class="structure-toggle"><input type="checkbox" id="showStructure" ${showStructure?'checked':''}> ${t('顯示八種寫法標記','Show eight writing elements')}</label><div class="post-body">${p.parts.map((a,i)=>`<section>${showStructure?`<span class="writing-marker">${i+1}. ${t(...postLabels[i])}</span>`:''}${indices.map(j=>`<p class="${j===1&&postMode==='bi'?'english-paragraph':''}">${esc(a[j])}</p>`).join('')}</section>`).join('')}<section class="post-step"><h3>${t('最小行動','A small step')}</h3><p>${indices.map(j=>esc(actionFor(p)[j])).join('<br>')}</p></section><p class="post-hashtags">#心之所居 #生活中的哲學 #APlaceWithin</p></div></article></div><div class="post-next">${POSTS.indexOf(p)>0?`<button data-post="${POSTS[POSTS.indexOf(p)-1].id}">← ${t('上一篇','Previous')}</button>`:''}${POSTS.indexOf(p)<26?`<button data-post="${POSTS[POSTS.indexOf(p)+1].id}">${t('下一篇','Next')} →</button>`:''}</div>`;if(!$('#dialog').open)$('#dialog').showModal();$('#dialog').scrollTop=0;}
document.addEventListener('click',async e=>{const q=e.target.closest('button');if(!q)return;if(q.dataset.post)openPost(q.dataset.post);if(q.dataset.postMode){postMode=q.dataset.postMode;openPost(currentPost.id,true)}if(q.id==='copyPost'){const text=postText(currentPost,postMode);try{await navigator.clipboard.writeText(text);toast('已複製完整圖文文案','Full post copied')}catch{download(currentPost.id+'.txt',text,'text/plain;charset=utf-8');toast('已改以下載文案供複製','Downloaded the text for copying')}}if(q.id==='txtPost')download(currentPost.id+'-'+postMode+'.txt',postText(currentPost,postMode),'text/plain;charset=utf-8');if(q.id==='svgPost')download(currentPost.id+'-'+postMode+'.svg',graphicSvg(currentPost,postMode),'image/svg+xml;charset=utf-8');if(q.id==='pngPost'){q.disabled=true;try{const img=new Image();img.src=graphicUrl(currentPost,postMode);await img.decode();const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1350;canvas.getContext('2d').drawImage(img,0,0);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('No image');const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=currentPost.id+'-'+postMode+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('圖卡已下載','Graphic downloaded')}catch{toast('圖卡轉換失敗，請使用 SVG 下載。','Image conversion failed; please download SVG.')}finally{q.disabled=false}}if(q.id==='exportPosts')download('心之所居-27篇雙語臉書圖文.txt',POSTS.map(p=>postText(p,'bi')).join('\n\n'+'═'.repeat(40)+'\n\n'),'text/plain;charset=utf-8')});
document.addEventListener('input',e=>{if(e.target.id==='postSearch'){postSearch=e.target.value;$('#postResults').innerHTML=libraryCards()}if(e.target.id==='search'&&view==='explore')enhanceFields()});
document.addEventListener('click',e=>{const q=e.target.closest('[data-view]');if(q)history.replaceState(null,'','#'+q.dataset.view)});
document.addEventListener('change',e=>{if(e.target.id==='postGroup'){postGroup=e.target.value;$('#postResults').innerHTML=libraryCards()}if(e.target.id==='showStructure'){showStructure=e.target.checked;const scroll=$('#dialog').scrollTop;openPost(currentPost.id,true);$('#dialog').scrollTop=scroll}});
$('#dialog').addEventListener('close',()=>{$('#dialog').classList.remove('post-dialog');currentPost=null});
const initialSection=location.hash.slice(1);if(tabs.some(a=>a[0]===initialSection))view=initialSection;
render();
</script></body></html>
