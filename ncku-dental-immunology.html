<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>成大牙醫免疫學MAX</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--sub:#5b6676;--line:#e2e6ec;--pri:#0f6e84;--pri2:#e3f3f6;--ok:#1a8f55;--okbg:#e5f6ec;--bad:#c23b3b;--badbg:#fbe9e9;--warn:#a86a00;--warnbg:#fff4dc;--hl:#ffe680}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b212a;--ink:#e8ecf1;--sub:#9aa6b6;--line:#2c3440;--pri:#5cc4d8;--pri2:#16323a;--ok:#5fd396;--okbg:#153324;--bad:#f08080;--badbg:#3a1c1c;--warn:#f0c060;--warnbg:#3a2e12;--hl:#806a00}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px 0}
.top{display:flex;gap:12px;align-items:center;max-width:980px;margin:0 auto}
h1{font-size:18px;margin:0;white-space:nowrap}
#q{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
#q:focus{outline:2px solid var(--pri)}
nav{display:flex;gap:4px;max-width:980px;margin:8px auto 0;overflow-x:auto}
nav button{border:0;background:none;color:var(--sub);font:inherit;padding:8px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--pri);border-color:var(--pri);font-weight:700}
main{max-width:980px;margin:0 auto;padding:16px}
h2{font-size:17px;margin:22px 0 8px}
h2:first-child{margin-top:0}
h3{font-size:15px;margin:14px 0 6px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 12px}
.sub{color:var(--sub);font-size:14px}
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:4px 0}
.chain b{font-weight:600;background:var(--pri2);color:var(--ink);padding:3px 8px;border-radius:6px;font-size:14px}
.chain i{font-style:normal;color:var(--pri)}
.lab{font-size:13px;color:var(--sub);margin-top:8px}
.mn{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 10px;font-weight:700;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--sub);font-weight:600;font-size:13px}
tr:last-child td{border-bottom:0}
td.t{font-weight:700;white-space:nowrap}
.scroll{overflow-x:auto}
details.card>summary{cursor:pointer;font-weight:700;font-size:16px;list-style:none;display:flex;gap:8px;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"＋";margin-left:auto;color:var(--sub)}
details.card[open]>summary::after{content:"－"}
.tag{display:inline-block;background:var(--pri);color:#fff;border-radius:5px;padding:1px 7px;font-size:12px;font-weight:700}
@media (prefers-color-scheme:dark){.tag{color:#0c1418}}
.trap{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0;font-size:14.5px}
.trap div{padding:6px 9px;border-radius:7px}
.trap .x{background:var(--badbg)}.trap .o{background:var(--okbg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:4px 12px;font:inherit;font-size:14px;cursor:pointer}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){.chips button.on{color:#0c1418}}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;font-size:14.5px}
.vs div{background:var(--bg);border-radius:7px;padding:7px 9px}
.vs b{display:block}
.key{margin-top:6px;font-weight:700;color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mod{cursor:pointer}.mod:hover{border-color:var(--pri)}
.qbox{font-size:19px;font-weight:700;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:11px 13px;margin:0 0 8px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt.sel{border-color:var(--pri);background:var(--pri2);font-weight:700}
.nums{display:flex;flex-wrap:wrap;gap:4px}.nums button{width:36px;height:30px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer;font:inherit;font-size:13px}.nums .a{background:var(--pri2)}.nums .c{outline:2px solid var(--pri)}
.opt.r{background:var(--okbg);border-color:var(--ok)}.opt.w{background:var(--badbg);border-color:var(--bad)}
.btn{border:0;background:var(--pri);color:#fff;border-radius:8px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
@media (prefers-color-scheme:dark){.btn{color:#0c1418}}
.btn.ghost{background:none;color:var(--sub);border:1px solid var(--line);font-weight:400}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar span{display:block;height:100%;background:var(--ok)}
.stat{display:grid;grid-template-columns:92px 1fr 86px;gap:8px;align-items:center;font-size:13.5px;margin:5px 0}
mark{background:var(--hl);color:inherit;border-radius:3px}
.big{font-size:17px;font-weight:700;line-height:1.9}
ol,ul{margin:6px 0;padding-left:22px}
@media (max-width:560px){.trap,.vs{grid-template-columns:1fr}h1{font-size:16px}}
</style>
</head>

<header>
  <div class="top"><h1>🦷 免疫學MAX</h1><input id="q" type="search" placeholder="搜尋：IL-12、RANKL、牙周、Type III、口水…" autocomplete="off"></div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<script>
const MODS=[
{id:'M1',name:'辨識',en:'Threat Recognition',q:'誰發現敵人？',mn:'外敵PAMP｜內傷DAMP｜PRR警報｜BCR直接看｜TCR看Peptide-MHC',
nodes:['PAMP|病原相關分子模式|微生物共同模式＝外敵警報（如 LPS）','DAMP|損傷相關分子模式|受傷／壓力細胞的危險訊號＝內部火警','PRR|模式辨識受體|先天免疫的警報器「大類」','TLR|類鐸受體|PRR 的重要家族之一','Antigen|抗原|可被特異性免疫（BCR／TCR）辨識的標的＝敵人特徵','BCR|B細胞受體|可直接辨識抗原','TCR|T細胞受體|只辨識 Peptide-MHC 複合體'],
chains:['核心|PAMP/DAMP→PRR/TLR→Innate Activation','無菌性發炎|Cell Damage→DAMP→PRR→Inflammation'],
traps:['PAMP 和 Antigen 完全相同|PAMP＝先天辨識的共同模式；Antigen＝特異性免疫辨識的標的','PRR 和 TLR 是同義詞|TLR 是 PRR 其中一個家族','看到「辨識」就選 TCR|先問辨識的是 PAMP（PRR）、完整抗原（BCR）還是 Peptide-MHC（TCR）','DAMP 是病原訊號|DAMP 來自自己受傷的細胞，所以發炎≠一定感染']},
{id:'M2',name:'先天',en:'Innate Immunity',q:'誰先上場？',mn:'N先打｜M吃叫｜D送情報｜NK先天殺｜Eosinophil蟲敏',
nodes:['Barrier|皮膚／黏膜|城牆；Saliva 唾液＝護城河','Neutrophil|嗜中性球|第一線士兵，急性細菌／黴菌、吞噬','Macrophage|巨噬細胞|吞噬＋放 IL-1／IL-6／TNF-α 發炎訊號＝吃＋叫','Dendritic Cell|樹突細胞|情報員：攝取抗原→呈現→啟動 Naive T；連接先天與後天','NK Cell|自然殺手細胞|先天殺手，快速殺病毒感染／異常細胞，不靠 TCR','Eosinophil|嗜酸性球|寄生蟲／過敏（受 IL-5 調控）','Complement|補體|血液中的援軍：貼＋叫＋打'],
chains:['核心|Threat→PRR→Neutrophil先打→Macrophage吃＋叫→Dendritic送情報','兩大系統|Innate＝快・粗・PRR｜Adaptive＝準・T/B・Memory'],
traps:['看到吞噬就選 Macrophage|急性第一線是 Neutrophil；Macrophage 偏吞噬＋發炎訊號','看到 APC 就選 Macrophage|「最有效啟動 Naive T」優先 Dendritic','只有 Dendritic 能呈現抗原|Dendritic／Macrophage／B Cell 都是 Professional APC','病毒感染一律選 CD8|早期先天殺傷→NK；抗原特異性殺傷→CD8','先天免疫絕對沒有任何記憶|經典抗原特異性記憶屬 Adaptive；另有 Trained Immunity 概念（不等同）']},
{id:'M3',name:'呈現',en:'Antigen Processing & Presentation',q:'情報怎麼交給 T 細胞？',mn:'先切→再裝→再秀→TCR看→共同刺激→啟動｜I×8＝8｜II×4＝8',
nodes:['Processing|抗原處理|把抗原切成 Peptide＝先「切」','Presentation|抗原呈現|Peptide 裝上 MHC 展示＝再「秀」','MHC I|第一型MHC|主要展示細胞內來源胜肽→CD8；幾乎所有有核細胞都有','MHC II|第二型MHC|主要展示攝取的外源抗原胜肽→CD4；主要在 Professional APC','TCR Recognition|TCR辨識|TCR 讀 Peptide-MHC（MHC 是展示板，不是受體）','Co-stimulation|共同刺激|Signal 2（CD28-B7）；Signal 1＝TCR、Signal 3＝Cytokine 決定分化方向','Cross-presentation|交叉呈現|Dendritic 把某些外源抗原放上 MHC I→啟動 Naive CD8','Professional APC|專業抗原呈現細胞|Dendritic（啟動Naive T最強）、Macrophage、B Cell'],
chains:['完整鏈|Antigen→Processing→Peptide→MHC Loading→Peptide-MHC→TCR＋Co-stimulation→Clonal Expansion→Effector＋Memory','MHC I|Intracellular Protein→Peptide-MHC I→CD8→殺感染細胞','MHC II|Extracellular Uptake→Processing→Peptide-MHC II→CD4→指揮'],
traps:['MHC 辨識抗原|MHC 負責展示；TCR 辨識 Peptide-MHC','MHC I＝病毒專用|本質是「細胞內來源胜肽」，病毒只是典型考題（還有自身、腫瘤蛋白）','MHC II＝細菌專用|本質是「被 APC 攝取處理的外源抗原」','看到 Peptide-MHC，T 細胞就一定活化|Naive T 還需要 Co-stimulation 等訊號','外源抗原絕不能進 MHC I|Dendritic 可 Cross-presentation','Processing＝Presentation|先切（處理）再秀（展示）']},
{id:'M4',name:'T細胞',en:'T Cell & Cytokines',q:'怎麼決定打法？',mn:'CD4指揮｜CD8殺｜Th1裡｜Th2蟲敏｜Th17菌炎｜Treg停',
nodes:['CD4 T Cell|輔助T細胞|指揮官／協調，配 MHC II','CD8 T Cell|細胞毒殺T細胞|殺手，配 MHC I，殺感染／異常細胞','Th1|第一型輔助T|細胞內病原＋活化 Macrophage（IFN-γ）','Th2|第二型輔助T|寄生蟲＋過敏＋IgE（IL-4）＋Eosinophil（IL-5）','Th17|第17型輔助T|細菌／黴菌＋黏膜＋招募 Neutrophil（IL-17）','Treg|調節型T細胞|Tolerance＋煞車（IL-10、TGF-β）','Tfh|濾泡輔助T|IL-21→幫助 B Cell 抗體反應','Memory T|記憶T細胞|保留未來快速反應能力（≠正在作戰的 Effector T）'],
chains:['Th1軸|IL-12→Th1→IFN-γ→Macrophage活化','Th2軸|IL-4→Th2→IL-4/IL-5→IgE＋Eosinophil','Th17軸|Th17→IL-17→Neutrophil招募','Treg軸|Treg→IL-10/TGF-β→Regulation','CD8|Intracellular Protein→Peptide-MHC I→CD8活化→Clonal Expansion→殺感染細胞→Memory CD8'],
traps:['CD4 主要直接殺感染細胞|CD4 偏 Helper；CD8 才是 Cytotoxic','看到細菌都選 Th1|細菌／黴菌＋Neutrophil＋黏膜→Th17；細胞內病原→Th1','IL-12 是 T 細胞增殖|IL-2＝T增殖；IL-12＝推 Th1／NK','IL-12 和 IFN-γ 都是活化 Macrophage|IL-12 是上游推 Th1；IFN-γ 是下游強化 Macrophage','只背 Cytokine 名稱|背「來源→Cytokine→Target→Outcome」']},
{id:'M5',name:'B細胞・記憶',en:'B Cell, Antibody & Memory',q:'抗體怎麼產生、升級、留下記憶？',mn:'B辨識｜Plasma工廠｜Memory存檔｜GC升級｜M初・G主・A口・E敏・D-B',
nodes:['B Cell|B細胞|BCR 直接辨識抗原→活化／分化＝準備','Plasma Cell|漿細胞|大量分泌抗體＝工廠','Memory B|記憶B細胞|再次遇抗原快速啟動＝存檔','Long-lived Plasma Cell|長壽命漿細胞|長期持續分泌抗體（血中長期抗體的來源）','IgM|免疫球蛋白M|初次反應較早出現','IgG|免疫球蛋白G|血液主力、長期保護、再次反應重要','IgA|免疫球蛋白A|黏膜／口水（Secretory IgA）★牙醫必考','IgE|免疫球蛋白E|過敏／寄生蟲，接 Mast Cell','IgD|免疫球蛋白D|B 細胞表面相關','Class Switching|類別轉換|IgM→IgG／IgA／IgE，換恆定區＝換武器種類','Affinity Maturation|親和力成熟|SHM＋選擇→結合更準＝把瞄準變準','Germinal Center|生發中心|SHM＋Affinity Maturation＋Class Switching 的場所','Clonal Selection|克隆選擇|抗原選中特異 Clone→擴增→Effector＋Memory'],
chains:['B細胞母鏈|Antigen→BCR→B Activation（T幫忙）→Clonal Expansion→Germinal Center→SHM＋Class Switching→Plasma＋Memory B＋LLPC','Primary|第一次・Naive為主・較慢較弱・IgM較突出','Secondary|再次・Memory為主・更快更強・親和力更高','Active vs Passive|主動＝自己做・慢・久・有記憶（感染／疫苗）｜被動＝拿現成・快・短・無記憶（母體抗體）','Humoral vs Cell-mediated|體液＝B＋Antibody→細胞外病原／毒素｜細胞＝T Cell→細胞內病原／感染細胞','抗體效應|Antibody→Neutralization中和／Opsonization調理／Complement Activation'],
traps:['Memory B 一直分泌抗體|長期分泌是 Long-lived Plasma Cell；Memory B 負責再次啟動','第一次反應只有 IgM|Primary 也能 Class Switching，IgM 只是較早突出','第二次反應＝只是 IgG|重點是 Memory→更快、更強、親和力更高','Class Switching 是換一個敵人|只換 Isotype（恆定區），抗原特異性不變','看到抗體都選 IgG|口水／黏膜→IgA；過敏→IgE','B Cell 本身大量分泌抗體|Plasma Cell 才是抗體工廠']},
{id:'M6',name:'效應',en:'Effector System',q:'最後怎麼真正打？',mn:'3b貼｜5a叫｜5b-9打｜抗體抓｜吞噬吃｜CD8/NK殺',
nodes:['C3b|補體C3b|Opsonization 調理作用＝貼標籤→吞噬↑','C3a / C5a|補體C3a/C5a|發炎；C5a 強力 Chemotaxis＝叫援軍','C5b-9|膜攻擊複合體 MAC|在敵人膜上打洞','Neutralization|中和|抗體封住病原／毒素，阻止其作用','Opsonization|調理作用|標記後讓吞噬細胞更容易吃','Phagocytosis|吞噬|Neutrophil／Macrophage 吞進去處理','Cytotoxicity|細胞毒殺|CD8／NK 殺死整個標的細胞','Cytokine|細胞激素|細胞間的 LINE 訊息','Chemokine|趨化因子|傳定位、引導細胞移動（導航）'],
chains:['補體|Complement Activation→C3→C3b貼＋C3a炎→C5→C5a叫＋C5b→C5b-9打洞','發炎群|Macrophage→IL-1＋IL-6＋TNF-α→Inflammation'],
traps:['C5a 形成 MAC|MAC 是 C5b-9；C5a 是趨化／發炎','C3b 負責 Chemotaxis|C3b＝貼標籤；C5a＝叫援軍','中和＝把敵人吃掉|Neutralization＝封鎖；Opsonization＝貼標促吞噬','Cytokine＝Chemokine|Cytokine 傳訊息；Chemokine 專門導航叫細胞過來']},
{id:'M7',name:'失控',en:'Immune Dysregulation',q:'免疫怎麼變疾病？',mn:'I-E｜II打｜III沉｜IV-T｜弱・錯・大・久',
nodes:['Type I|第一型超敏|IgE→Mast Cell→Histamine；立即型（數分鐘）','Type II|第二型超敏|IgG／IgM 抗體針對細胞／組織標的＝直接打','Type III|第三型超敏|Immune Complex 免疫複合體沉積→發炎','Type IV|第四型超敏|T Cell 媒介；延遲型（48–72 小時）','Immunodeficiency|免疫缺陷|太弱＝防禦不足→感染風險↑','Autoimmunity|自體免疫|打錯＝失去 Self-Tolerance，攻擊自己','Hypersensitivity|超敏／過敏|打太大＝對相對無害抗原過度反應','Chronic Inflammation|慢性發炎|打太久＝停不下來→組織破壞','Tolerance|免疫耐受|對特定標的不產生破壞性反應（不是免疫弱）','Immunosuppression|免疫抑制|整體或部分免疫功能被壓低'],
chains:['正常|Threat→Recognition→Activation→Inflammation→Elimination→Regulation→Repair→Homeostasis','失控|發炎該停沒停→Chronic Inflammation→Tissue Damage→Disease','過敏鏈|Th2→IgE→Mast Cell→Histamine→Immediate Allergy'],

const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let Q='';

const chain=s=>{const rev=s.includes('←'),p=s.split(rev?'←':'→');return '<div class="chain">'+p.map(x=>'<b>'+hl(x)+'</b>').join('<i>'+(rev?'←':'→')+'</i>')+'</div>'};
const lchain=s=>{const i=s.indexOf('|'),l=s.slice(0,i),c=s.slice(i+1);return '<div class="lab">'+hl(l)+'</div>'+(c.includes('→')?chain(c):'<div>'+hl(c)+'</div>')};
const trap=s=>{const[a,b]=s.split('|');return '<div class="trap"><div class="x">❌ '+hl(a)+'</div><div class="o">✅ '+hl(b)+'</div></div>'};
const conf=s=>{const[m,a,b,da,db,k]=s.split('|');return '<div class="card"><span class="tag">'+m+'</span> <b>'+hl(a)+' vs '+hl(b)+'</b><div class="vs"><div><b>'+hl(a)+'</b>'+hl(da)+'</div><div><b>'+hl(b)+'</b>'+hl(db)+'</div></div><div class="key">⚡ '+hl(k)+'</div></div>'};
const nodeRows=a=>a.map(n=>{const[t,z,d]=n.split('|');return '<tr><td class="t">'+hl(t)+'<div class="sub">'+hl(z)+'</div></td><td>'+hl(d)+'</td></tr>'}).join('');
const refRows=a=>a.map(r=>{const[m,k,v]=r.split('|');return '<tr><td><span class="tag">'+m+'</span></td><td>'+hl(k)+'</td><td class="t">→ '+hl(v)+'</td></tr>'}).join('');
const cytoRows=a=>a.map(c=>{const[n,s,f,k]=c.split('|');return '<tr><td class="t">'+hl(n)+'</td><td>'+hl(s)+'</td><td>'+hl(f)+'</td><td class="t">'+hl(k)+'</td></tr>'}).join('');

// 14 術語全名
{const TM=['M1','M1','M1','M1','M2','M3','M3','M4','M4','M4','M4','M5','M6','M4','M4','M4','M8','M8','M8'];let j=0;
for(const l of STUDY.find(s=>s[0].startsWith('術語全名'))[1]){const p=l.split('｜');if(p.length!==3)continue;const m=TM[j++]||'M1',[ab,en,zh]=p,tip=l;if(en.startsWith(ab.split('／')[0]))continue;addX(14,m,ab+' 的英文全名？',en,{tip});addX(14,m,ab+' 的中文？',zh,{tip});addX(14,m,'「'+zh+'」的縮寫？',ab,{tip})}}
let lv=1;
const passed=n=>{const s=stats['L'+n];return s&&s.n>=10&&s.r/s.n>=.8};
function makeOpts(it){if(it.opts)return it.opts;
const same=ITEMS.filter(x=>x.lv===it.lv),bad=new Set(same.filter(x=>x.q===it.q).map(x=>x.a)),uniq=a=>[...new Set(a.map(x=>x.a))].filter(x=>!bad.has(x));
let d=it.dp?shuffle([...new Set(it.dp)].filter(x=>x!==it.a)):[];
if(d.length<3)d=d.concat(shuffle(uniq(same.filter(x=>x.m===it.m)).filter(x=>!d.includes(x)&&x!==it.cur)));
if(d.length<3)d=d.concat(shuffle(uniq(same).filter(x=>!d.includes(x)&&x!==it.cur)));
return shuffle([it.a,...d.slice(0,3)])}
// 模擬考：限時、交卷後才對答案
let exam=null,tmr=null,hist=store.get('immMaxExam',[]);
const fmt=s=>(s/60|0)+':'+String(s%60).padStart(2,'0');
function startExam(n,only){const W=only?[[only,1]]:[[15,.3],[8,.25],[6,.1],[5,.05],[7,.1],[11,.05],[10,.05],[9,.05],[3,.025],[4,.025]];let ch=[];
for(const[l,f]of W)ch=ch.concat(shuffle(ITEMS.filter(x=>x.lv===l)).slice(0,Math.round(n*f)));
if(ch.length<n)ch=ch.concat(shuffle(ITEMS.filter(x=>![1,2,14].includes(x.lv)&&!ch.includes(x))).slice(0,n-ch.length));
exam={qs:shuffle(ch).slice(0,n).map(it=>({it,opts:makeOpts(it),sel:-1})),i:0,start:Date.now(),end:Date.now()+n*60000,done:false};
clearInterval(tmr);tmr=setInterval(tick,1000);render();scrollTo(0,0)}
function tick(){if(!exam||exam.done){clearInterval(tmr);return}const s=Math.max(0,Math.round((exam.end-Date.now())/1000)),e=$('#tm');if(e)e.textContent=fmt(s);if(s<=0)finishExam()}
function finishExam(){clearInterval(tmr);exam.done=true;exam.used=Math.round((Date.now()-exam.start)/1000);let r=0;
for(const q of exam.qs){const ok=q.opts[q.sel]===q.it.a;if(ok)r++;const s=stats[q.it.m]||(stats[q.it.m]={r:0,n:0});s.n++;if(ok)s.r++;if(!ok&&!wrong.includes(q.it.key))wrong.push(q.it.key)}
exam.score=r;hist.unshift({d:new Date().toLocaleDateString('zh-TW'),n:exam.qs.length,r});hist=hist.slice(0,8);
store.set('immMaxStats',stats);store.set('immMaxWrong',wrong);store.set('immMaxExam',hist);render();scrollTo(0,0)}
// 解析：箭頭＋秒判＋題目裡出現的相關名詞定義＋模組口訣
const NIDX=[];MODS.forEach(m=>m.nodes.forEach(n=>{const[t,z,d]=n.split('|');NIDX.push([t,z,d])}));CYTO.forEach(c=>{const[n,s,f]=c.split('|');NIDX.push([n,'細胞因子',f])});
NIDX.forEach(n=>{let b=n[0].replace(/ (T Cell|Cell)$/,'');if(b.length<2)b=n[0];n[3]=new RegExp('(^|[^A-Za-z0-9-])'+b.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&')+'($|[^A-Za-z0-9-])')});
function explLines(it){const mo=MODS.find(x=>x.id===it.m),L=[];if(it.ex)L.push('箭頭：'+it.ex);if(it.tip)L.push(...String(it.tip).split('\n'));
const inA=NIDX.filter(n=>n[3].test(it.a)),inQ=NIDX.filter(n=>!inA.includes(n)&&n[3].test(it.q));
for(const n of[...inA,...inQ].slice(0,4))L.push('▸ '+n[0]+'（'+n[1]+'）：'+n[2]);
L.push(mo.id+' '+mo.name+' 口訣：'+mo.mn);return L}
function expl(it){return explLines(it).join('　')}
function fbHtml(it,opts,sel){const right=opts[sel]===it.a;return '<div class="mn">'+(right?'✅ 答對了':'❌ 答錯了')+'｜正確答案：'+esc(it.a)+'</div><div style="margin-top:8px;font-size:14.5px;background:var(--bg);border-radius:8px;padding:10px 12px"><b>解析</b>'+explLines(it).map(l=>'<div>'+esc(l)+'</div>').join('')+(it.why?'<div style="margin-top:6px"><b>逐選項</b></div>'+it.why.map((w,j)=>'<div>'+(opts[j]===it.a?'✅':'❌')+' '+(j+1)+'. '+esc(opts[j])+'：'+esc(w)+'</div>').join(''):'')+'</div>'}
function examView(){const N=exam.qs.length;
if(!exam.done){const q=exam.qs[exam.i],ans=exam.qs.filter(x=>x.sel>=0).length;
return '<div class="card"><div class="sub">📝 模擬考　第 '+(exam.i+1)+' / '+N+' 題　已答 '+ans+'　答對 '+exam.qs.filter(x=>x.sel>=0&&x.opts[x.sel]===x.it.a).length+'　剩餘 <b id="tm"></b></div><div class="qbox">'+esc(q.it.q)+'</div>'+q.opts.map((o,j)=>'<button class="opt'+(q.sel<0?'':o===q.it.a?' r':q.sel===j?' w':'')+'" data-es="'+j+'"'+(q.sel<0?'':' disabled')+'>'+(j+1)+'. '+esc(o)+'</button>').join('')+(q.sel<0?'':fbHtml(q.it,q.opts,q.sel))+
'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><button class="btn ghost" id="exprev">← 上一題</button><button class="btn ghost" id="exnext">下一題 →</button><span style="flex:1"></span><button class="btn" id="exsub">交卷</button></div></div>'+
'<div class="card"><div class="sub" style="margin-bottom:6px">題號（有底色＝已作答，點了可跳題；答案選了就鎖定）</div><div class="nums">'+exam.qs.map((x,j)=>'<button class="'+(x.sel>=0?'a ':'')+(j===exam.i?'c':'')+'" data-ej="'+j+'">'+(j+1)+'</button>').join('')+'</div><div style="margin-top:12px"><button class="btn ghost" id="exquit">放棄這次模擬考</button></div></div>'}
const pct=Math.round(exam.score/N*100),bm={};for(const q of exam.qs){const b=bm[q.it.m]||(bm[q.it.m]={r:0,n:0});b.n++;if(q.opts[q.sel]===q.it.a)b.r++}
return '<div class="card"><div class="sub">📝 模擬考成績</div><div class="qbox" style="font-size:30px;margin-bottom:4px">'+exam.score+' / '+N+'（'+pct+' 分）'+(pct>=60?' ✅':' ❌')+'</div><div class="sub">用時 '+fmt(exam.used)+'｜答錯的題目已加入錯題本</div><div class="lab">各模組表現</div>'+MODS.filter(m=>bm[m.id]).map(m=>{const b=bm[m.id],p=Math.round(b.r/b.n*100);return '<div class="stat"><b>'+m.id+' '+m.name+'</b><div class="bar"><span style="width:'+p+'%"></span></div><span>'+b.r+'/'+b.n+'</span></div>'}).join('')+
'<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-ex="'+N+'">再考一次</button><button class="btn ghost" id="exquit">回到練習</button></div></div><h2>逐題檢討</h2>'+
exam.qs.map((q,j)=>{const ok=q.opts[q.sel]===q.it.a;return '<div class="card"><div class="sub">'+(ok?'✅':'❌')+' 第 '+(j+1)+' 題　<span class="tag">'+q.it.m+'</span></div><div style="font-weight:700;margin:4px 0">'+esc(q.it.q)+'</div>'+(ok?'':'<div class="trap" style="grid-template-columns:1fr"><div class="x">你的答案：'+(q.sel<0?'未作答':esc(q.opts[q.sel]))+'</div></div>')+'<div class="trap" style="grid-template-columns:1fr"><div class="o">正確答案：'+esc(q.it.a)+'</div></div><div class="sub">'+esc(expl(q.it))+'</div>'+(q.it.why?'<div style="font-size:14px;margin-top:4px">'+q.it.why.map((w,k)=>'<div>'+(q.opts[k]===q.it.a?'✅':'❌')+' '+esc(q.opts[k])+'：'+esc(w)+'</div>').join('')+'</div>':'')+'</div>'}).join('')}
function pool(){return ITEMS.filter(x=>(lv===99||(lv?x.lv===lv:wrong.includes(x.key)))&&(fm==='全部'||x.m===fm))}
function nextQ(){const p=pool(),el=$('#qz');if(!el)return;
if(!p.length){el.innerHTML='<div class="sub">'+(lv?'這一級在此模組沒有題目，換個模組或選「全部」。':'錯題本是空的，太好了。回各級繼續刷題吧。')+'</div>';cur=null;return}
let it;do{it=p[Math.random()*p.length|0]}while(p.length>1&&cur&&it===cur.it);
cur={it,m:it.m,v:it.a,done:false,opts:makeOpts(it)};
el.innerHTML='<div class="sub"><span class="tag">'+(it.lv<8?'L'+it.lv:LVN[it.lv])+'</span> <span class="tag">'+it.m+'</span> 本次 '+sess.r+' / '+sess.n+'</div><div class="qbox">'+esc(it.q)+'</div>'+cur.opts.map((o,i)=>'<button class="opt" data-o="'+i+'">'+(i+1)+'. '+esc(o)+'</button>').join('')+'<div id="fb"></div>'}
function answer(i){if(!cur||cur.done||i>=cur.opts.length)return;cur.done=true;const right=cur.opts[i]===cur.v,it=cur.it;sess.n++;if(right)sess.r++;
for(const k of['L'+it.lv,it.m]){const s=stats[k]||(stats[k]={r:0,n:0});s.n++;if(right)s.r++}
if(right){if(!lv)wrong=wrong.filter(x=>x!==it.key)}else if(!wrong.includes(it.key))wrong.push(it.key);
store.set('immMaxStats',stats);store.set('immMaxWrong',wrong);
document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(cur.opts[j]===cur.v)b.classList.add('r');else if(j===i)b.classList.add('w')});
const mo=MODS.find(x=>x.id===it.m);
$('#fb').innerHTML=fbHtml(it,cur.opts,i)+'<div style="margin-top:10px"><button class="btn" id="nx">下一題（Enter）</button></div>';drawStats()}
function drawStats(){const el=$('#st');if(!el)return;const row=(id,lab)=>{const s=stats[id]||{r:0,n:0},p=s.n?Math.round(s.r/s.n*100):0;return '<div class="stat"><b>'+lab+'</b><div class="bar"><span style="width:'+p+'%"></span></div><span>'+(s.n?p+'%（'+s.r+'/'+s.n+'）':'未作答')+'</span></div>'};
el.innerHTML='<div class="lab">七級（答 10 題以上且 80% 以上＝過關 ✓）</div>'+ORDER.filter(n=>n&&n<99).map(n=>row('L'+n,(n<8?'L'+n:LVN[n])+(passed(n)?'✓':''))).join('')+'<div class="lab">各模組（看弱在哪一層）</div>'+MODS.map(m=>row(m.id,m.id)).join('')}

function render(){$('#nav').innerHTML=TABS.map(([k,n])=>'<button class="'+(k===tab&&!Q?'on':'')+'" data-tab="'+k+'">'+n+'</button>').join('');
$('#main').innerHTML=Q?search():V[tab]();if(!Q&&tab==='quiz'){nextQ();drawStats();tick()}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-ex],[data-es],[data-ej],#exprev,#exnext,#exsub,#exquit,[data-tab],[data-fm],[data-lv],[data-go],[data-o],#nx,#rs');if(!t)return;
if(t.dataset.lv){lv=+t.dataset.lv;render();return}
if(t.dataset.ex){tab='quiz';Q='';$('#q').value='';startExam(+t.dataset.ex,+t.dataset.src||0);return}
if(exam&&(t.dataset.es||t.dataset.ej||/^ex/.test(t.id))){const e=exam;
if(t.dataset.es){if(e.qs[e.i].sel<0)e.qs[e.i].sel=+t.dataset.es}else if(t.dataset.ej)e.i=+t.dataset.ej;
else if(t.id==='exprev')e.i=Math.max(0,e.i-1);else if(t.id==='exnext')e.i=Math.min(e.qs.length-1,e.i+1);
else if(t.id==='exsub'){const u=e.qs.filter(x=>x.sel<0).length;if(confirm(u?'還有 '+u+' 題沒作答，確定交卷？':'確定交卷？'))finishExam();return}
else if(t.id==='exquit'){if(e.done||confirm('放棄這次模擬考？作答不會保留。')){clearInterval(tmr);exam=null}}
render();return}
if(t.dataset.tab){tab=t.dataset.tab;fm='全部';Q='';$('#q').value='';render();scrollTo(0,0)}
else if(t.dataset.fm){fm=t.dataset.fm;render()}
else if(t.dataset.go){tab='mod';openMod=t.dataset.go;render();const d=$('[data-mod="'+openMod+'"]');d&&d.scrollIntoView()}
else if(t.dataset.o)answer(+t.dataset.o);
else if(t.id==='nx')nextQ();
else if(t.id==='rs'&&confirm('清除答題紀錄與錯題本？')){stats={};wrong=[];sess={r:0,n:0};store.set('immMaxStats',stats);store.set('immMaxWrong',wrong);render()}});
document.addEventListener('keydown',e=>{if(tab!=='quiz'||Q||e.target.id==='q')return;
if(exam){if(exam.done)return;const q=exam.qs[exam.i];if(e.key>='1'&&e.key<='4'&&+e.key<=q.opts.length){if(q.sel<0)q.sel=+e.key-1}else if(e.key==='ArrowRight'||e.key==='Enter')exam.i=Math.min(exam.qs.length-1,exam.i+1);else if(e.key==='ArrowLeft')exam.i=Math.max(0,exam.i-1);else return;render();return}if(e.key>='1'&&e.key<='4')answer(+e.key-1);else if(e.key==='Enter'&&cur&&cur.done)nextQ()});
$('#q').addEventListener('input',e=>{Q=e.target.value.trim();render()});
render();
</script>
</body>
</html>
