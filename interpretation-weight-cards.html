【能力】

第一，寫下事實。只寫看得見、聽得到、可以被核對的部分。

當你能叫出錯誤的名字，它就不再是一團壓在胸口的烏雲，而是一個可以處理的問題。這就是更新的開始。更新不是把自己整個打掉重練，而是找到那個出錯的環節，只修那裡。保留有效的，修正失效的。成長不必推翻全部的過去。錯誤不是智慧的敵人，拒絕修正才是。

【智慧】
智慧是對自己誠實，也對自己公平。誠實，是願意承認「這次我看錯了」；公平，是不把一次看錯，放大成「我這個人不行」。真正堅定的人，不害怕真相靠近。同時也要記得：有些責任本來就不是你的。分清楚什麼是我能改變的、什麼不是，是很深的智慧，也是對自己很大的慈悲。找到真正的瓶頸，比反覆責怪自己更有力量。

【能力】
把這套方法變成能力，只需要六個步驟，反覆練習：
一、說出舊解讀：我腦中第一個冒出來的解釋是什麼？
二、建立新解讀：有沒有更有根據的說法？
三、辨認錯誤：我剛才掉進哪一種陷阱？
四、做最小行動：今天做得到的一小步是什麼？
五、看真實回饋：結果和我預想的一樣嗎？
六、隔幾天再測：隔天、七天、十四天後，我還能自己用出來嗎？

看懂是相遇，掌握需要一次次重逢。今天學會不代表永遠會，真正屬於你的智慧，經得起時間的考驗。

想像一位學生，數學考卷上錯了十題。如果他只對自己說「我數學很爛」，下次還是會錯十題。但如果他坐下來看：三題是公式沒背熟，五題是漏看了題目裡的「不」字，兩題是時間不夠。忽然之間，「很爛」變成了三件可以處理的小事：補公式、圈關鍵字、練速度。問題沒有變小，卻變得可以下手了。人生也是這樣。你不是整個人有問題，你只是有幾個地方，還沒被好好看見。當困難被拆開，你就不必被整個困難嚇倒。

所以，下次事情搞砸的時候，請不要急著說「我真沒用」。換一個問題問自己：「這一次，我是錯在哪一種？」

從責怪到診斷，只差一個問題。而這一個問題，會讓你一次比一次更懂自己。

成熟不是不再跌倒，而是更懂得重新站穩。`,'#LifeOS #錯誤診斷 #心靈雞湯 #更新 #智慧 #能力'],
Q:['你以為懂了，和你真的會了，中間差一次考驗',`你一定有過這種經驗：書上的道理看了很感動，劃了重點、存了金句，心想「這次我真的懂了」。結果隔天遇到事情，還是用老方法反應——一樣生氣，一樣鑽牛角尖，一樣整晚睡不著。然後你開始懷疑：是不是我學不會？

不是的。你只是把「看懂」當成了「會了」。

看懂，是答案擺在眼前時，你點頭說「對」。會了，是沒有人提醒、沒有答案可看的時候，你自己想得起來、用得出來。這兩件事之間，隔著一樣東西，叫做測驗。

很多人怕測驗，因為小時候的考試總是連著分數、排名和責備。但人生真正有用的測驗，不是為了證明你好不好，而是為了讓你看見自己走到哪裡。它是一面鏡子，不是一張判決書。

【更新】
每一次答錯，都是一次更新的機會。你預估自己有九成把握，結果只對了六成，這不丟臉，這是珍貴的資訊——它告訴你，自信和實力之間還有一段距離需要校準。猜錯不代表你笨，只代表你的地圖有一塊需要重畫。同樣地，答對了也別急著翻頁，問問自己：我是真的懂，還是剛好猜中？驚喜值得慶祝，也值得學習。

【智慧】
真正的聰明，是知道自己還有哪些不懂。再明亮的眼睛，也需要另一面鏡子。願意被檢驗的人，不是因為特別有自信，而是因為他們把「變得更準」看得比「看起來很對」更重要。最穩定的自信，不是來自別人的稱讚，也不是來自心裡的感覺，而是來自一次又一次的真實驗證。真正的成長，不怕被現實看見。

【能力】
能力是在「提取」中長出來的，不是在「重讀」中。所以請這樣練習：
一、遮住答案，自己先說一次。說不出來的地方，就是下一步要補的地方。
二、今天會了，七天後再測一次。忘記是正常的，重新想起來的那一刻，記憶才真正變深。
三、換個場景用用看。在課堂上學會的「分清事實與解讀」，回家和家人說話時用得上嗎？知識走出書本，才開始成為生活的智慧。
四、記下預測與結果。作答前先猜自己會對幾題，作答後比一比。久了，你會越來越了解自己。

也許你會說：我已經不是學生了，還要測驗什麼？其實生活每天都在出題。孩子頂嘴的時候，是一題；同事誤會你的時候，是一題；計畫被打亂、心裡冒出「我完了」的時候，也是一題。這些題目不會事先通知，也不會附上標準答案。平常有沒有練習，就在那一刻看得出來。所以平靜的日子裡做的小小複測，並不是多餘的功課，而是替風雨來臨的那一天，先把路走熟。忘記了也沒關係，中斷了也沒關係。真正的自律，不是從不中斷，而是願意重新開始。今天比上個月的自己多想起一點、多做對一次，那就是進步。

環境會改變，但累積下來的能力不必歸零。一次全對值得開心，持續做得到才值得信任。

所以，別再問「我看了這麼多，為什麼沒有改變」。請改問：「我今天，有沒有不看答案，自己做一次？」
