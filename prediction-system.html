.mod-card.picked{border:1.5px solid #D4A017;background:rgba(212,160,23,0.06);}
.mod-card.picked::after{content:'✓';position:absolute;top:8px;right:10px;font-size:11px;color:#D4A017;font-weight:700;}
.mod-icon{font-size:26px;margin-bottom:6px;display:block;}
.mod-name{font-size:13px;font-weight:700;color:#fff;margin-bottom:2px;}
.mod-tagline{font-size:11px;color:#D4A017;margin-bottom:4px;}
.mod-desc{font-size:10px;color:rgba(255,255,255,0.35);line-height:1.4;}

const FILTERS=['全部','基礎','模型','更新','實戰'];
let picked=[],answers={},phase=1;

function initFilters(){
  const ct=document.getElementById('filter-tabs');
  FILTERS.forEach((f,i)=>{
    const btn=document.createElement('button');
    btn.className='filter-tab'+(i===0?' active':'');
    btn.textContent=f; btn.dataset.f=f;
    btn.onclick=()=>{
      document.querySelectorAll('.filter-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderGrid(f);
    };
    ct.appendChild(btn);
  });
}

function renderGrid(filter){
  const g=document.getElementById('mod-grid'); g.innerHTML='';
  const list=filter==='全部'?MODULES:MODULES.filter(m=>m.cat===filter);
  list.forEach(m=>{
    const card=document.createElement('div');
    card.className='mod-card'+(picked.includes(m.id)?' picked':'');
    card.dataset.id=m.id;
    card.innerHTML=`<span class="mod-icon">${m.icon}</span><div class="mod-name">${m.name}</div><div class="mod-tagline">${m.tagline}</div><div class="mod-desc">${m.desc}</div>`;
    card.onclick=()=>toggleMod(m.id,card);
    g.appendChild(card);
  });
}

function toggleMod(id,card){
  const idx=picked.indexOf(id);
  if(idx===-1){picked.push(id);card.classList.add('picked');}
  else{picked.splice(idx,1);card.classList.remove('picked');}
  document.getElementById('pcount').textContent=picked.length+' 已選';
  document.getElementById('btn-next').disabled=picked.length===0;
  updateProg();
}

function go(n){
  document.querySelectorAll('.phase').forEach(p=>p.classList.remove('active'));
  document.getElementById('p'+n).classList.add('active');
  phase=n; updateProg();
  window.scrollTo({top:0,behavior:'smooth'});
}
function updateProg(){
  const p=phase===1?8:phase===2?48:100;
  document.getElementById('prog').style.width=p+'%';
}

document.getElementById('btn-next').onclick=()=>{buildDiag();go(2);};

function buildDiag(){
  const body=document.getElementById('q-body'); body.innerHTML='';
  picked.forEach(id=>{
    const m=MODULES.find(x=>x.id===id);
    const blk=document.createElement('div'); blk.className='q-block';
    blk.innerHTML=`<div class="q-mod-header"><span class="q-mod-icon">${m.icon}</span><span class="q-mod-name">${m.name}</span><span class="q-mod-tag">${m.tagline}</span></div>`;
    const ql=document.createElement('div'); ql.className='q-list';
    m.qs.forEach((q,qi)=>{
      const key=id+'_'+qi;
      const item=document.createElement('div'); item.className='q-item';
      const opts=q.opts.map((o,oi)=>`<button class="q-opt" onclick="pickOpt(this,'${key}',${oi})">${o}</button>`).join('');
      item.innerHTML=`<div class="q-text">${q.q}</div><div class="q-opts">${opts}</div>`;
      ql.appendChild(item);
    });
    blk.appendChild(ql); body.appendChild(blk);
  });
}

function pickOpt(btn,key,val){
  btn.closest('.q-opts').querySelectorAll('.q-opt').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel'); answers[key]=val;
}

function calcScore(id){
  const m=MODULES.find(x=>x.id===id);
  let t=0,c=0;
  m.qs.forEach((_,qi)=>{const k=id+'_'+qi;if(answers[k]!==undefined){t+=answers[k];c++;}});
  if(!c)return 70;
  return Math.round(100-(t/c/3)*78);
}

function showResult(){
  const body=document.getElementById('result-body'); body.innerHTML='';
  const scores=picked.map(id=>({id,score:calcScore(id)}));
  const avg=Math.round(scores.reduce((s,x)=>s+x.score,0)/scores.length);
  const doff=Math.round(251*(1-avg/100));
  const sc=avg>=72?'#1a7a2a':avg>=45?'#B8860B':'#A32D2D';
  const lbl=avg>=72?'預測力基礎良好':avg>=45?'預測力需要升級':'預測力需要重建';
  const desc=avg>=72?'你的預測系統有一定基礎，以下方案幫你持續升級':avg>=45?'部分預測模組需要修正，及早介入效果最好':'多個預測模組需要系統性重建，從底層開始';

  body.innerHTML=`
    <div class="result-hero">
      <div class="rh-ring">
        <svg viewBox="0 0 90 90"><circle cx="45" cy="45" r="40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="5"/><circle cx="45" cy="45" r="40" fill="none" stroke="${sc}" stroke-width="5" stroke-dasharray="251" stroke-dashoffset="${doff}" stroke-linecap="round" transform="rotate(-90 45 45)"/></svg>
        <div class="rh-num">${avg}</div>
      </div>
      <div class="rh-title">${lbl}</div>
      <div class="rh-desc">${desc}</div>
    </div>
    <div class="slabel">人生終極公式</div>
    <div class="formula-chain" id="formula-chain"></div>
    <div class="slabel">你的預測力診斷結果</div>
    <div id="mod-results"></div>
  `;

  const fc=document.getElementById('formula-chain');
  ['觀察','建模','預測','行動','誤差','修正','更新','智慧'].forEach((s,i,a)=>{
    const span=document.createElement('span');
    span.className='fc-step '+(i===0?'first':i===a.length-1?'last':'mid');
    span.textContent=s; fc.appendChild(span);
    if(i<a.length-1){const arr=document.createElement('span');arr.className='fc-arr';arr.textContent='→';fc.appendChild(arr);}
  });

  const container=document.getElementById('mod-results');
  const sorted=[...scores].sort((a,b)=>a.score-b.score);
  sorted.forEach(({id,score})=>{
    const m=MODULES.find(x=>x.id===id);
    const bc=score>=72?'s-hi':score>=45?'s-md':'s-lo';
    const nc=score>=72?'#1a7a2a':score>=45?'#B8860B':'#A32D2D';
    const urg=score<45?'需要重建':score<72?'需要升級':'持續優化';

    const card=document.createElement('div'); card.className='mrc';
    card.innerHTML=`
      <div class="mrc-header">
        <span class="mrc-icon">${m.icon}</span>
        <div class="mrc-info">
          <div class="mrc-name">${m.name}</div>
          <div class="mrc-tagline">${m.tagline}</div>
        </div>
        <div class="mrc-score-area">
          <div style="font-size:10px;background:rgba(${score<45?'163,45,45':score<72?'184,134,11':'26,122,42'},0.12);padding:2px 8px;border-radius:100px;color:${nc};font-weight:700;margin-bottom:3px;text-align:right">${urg}</div>
          <div class="mrc-score-num" style="color:${nc}">${score}<span style="font-size:12px;opacity:0.4">/100</span></div>
          <div class="mrc-bar-wrap"><div class="mrc-bar ${bc}" style="width:0%" data-w="${score}%"></div></div>
        </div>
      </div>
      <div style="padding:0 16px 4px">
        <div class="rtabs" id="tabs_${id}">
          <button class="rtab active" onclick="sw('${id}','edu',this)">📖 教育</button>
          <button class="rtab" onclick="sw('${id}','meth',this)">🛠 方法</button>
          <button class="rtab" onclick="sw('${id}','nut',this)">⚗️ 修復</button>
        </div>
      </div>
      <div class="tab-panel active" id="edu_${id}"></div>
      <div class="tab-panel" id="meth_${id}"></div>
      <div class="tab-panel" id="nut_${id}"></div>
    `;
    container.appendChild(card);

    // EDU
    const edu=card.querySelector('#edu_'+id);
    const fcHtml=m.formula.map((s,i)=>`<div style="font-size:12px;color:${i===0?'#D4A017':i===m.formula.length-1?'#B8860B':'rgba(255,255,255,0.6)'};display:flex;align-items:center;gap:8px;padding:3px 0">${i>0?'<span style="font-size:10px;color:rgba(212,160,23,0.3)">↓</span>':''}<span>${s}</span></div>`).join('');
    edu.innerHTML=`
      <div class="core-box"><div class="core-label">核心洞見</div><div class="core-text">${m.core}</div></div>
      <div class="sci-box"><div class="sci-title">🔬 神經科學基礎</div><div class="sci-text">${m.science}</div></div>
      <div class="edu-box"><div class="edu-title">功能失調路徑</div>${m.disease_chain.map((s,i)=>`<div style="font-size:12px;color:${i===0?'#D4A017':i===m.disease_chain.length-1?'#E87070':'rgba(255,255,255,0.6)'};display:flex;align-items:center;gap:8px;padding:3px 0">${i>0?'<span style="font-size:10px;color:rgba(255,255,255,0.2)">↓</span>':''}<span>${s}</span></div>`).join('')}</div>
      <div class="update-box"><div class="ub-title">信念更新程式碼</div><div class="ub-text">${m.update}</div></div>
      <div class="edu-box"><div class="edu-title">運作公式</div>${fcHtml}</div>
    `;

    // METHOD
    const meth=card.querySelector('#meth_'+id);
    const stepsHtml=m.methods.map((s,i)=>`<div class="ms-card"><div class="ms-num">${i+1}</div><div class="ms-body"><div class="ms-title">${s.t}</div><div class="ms-desc">${s.d}</div></div></div>`).join('');
    const dailyHtml=m.daily.map(d=>`<div class="daily-item">✓ ${d}</div>`).join('');
    meth.innerHTML=`<div class="method-steps">${stepsHtml}</div><div class="daily-box"><div class="daily-title">每日練習清單</div>${dailyHtml}</div>`;

    // NUT
    const nutContainer=card.querySelector('#nut_'+id);
    nutContainer.innerHTML='<div class="nut-list" id="nuts_'+id+'"></div>';
    const nl=nutContainer.querySelector('#nuts_'+id);
    m.nutrients.forEach((n,ni)=>{
      const nid=id+'_n'+ni;
      const nc2=document.createElement('div'); nc2.className='nut-card';
      nc2.innerHTML=`
        <div class="nut-top" onclick="toggleNut('${nid}')">
          <div class="nut-ico" style="background:${n.bg}">${n.ico}</div>
          <div class="nut-info">
            <div class="nut-name">${n.n}</div>
            <div class="nut-mech">${n.mech}</div>
            <div class="nut-price">${n.price} · ${n.spec}</div>
          </div>
          <span class="nut-exp" id="exp_${nid}">▾</span>
          <a class="nut-cta" href="${SHOP}" target="_blank" rel="noopener" onclick="event.stopPropagation()">購買</a>
        </div>
        <div class="nut-detail" id="${nid}">
          <div class="nut-mbox"><div class="nut-mt">作用機制</div><div class="nut-mb">${n.det}</div></div>
          <div class="nut-why"><div class="nut-wt">為什麼你的預測力系統現在需要它</div><div class="nut-wb">${n.why}</div></div>
          <div class="buy-block">
            <div class="bb-info">
              <div class="bb-name">${n.n}</div>
              <div class="bb-price">${n.price}</div>
              <div class="bb-spec">${n.spec}</div>
              <div class="bb-store">📦 7-11 賣貨便取貨付款</div>
            </div>
            <a class="btn-buy-full" href="${SHOP}" target="_blank" rel="noopener">立即購買 →</a>
          </div>
        </div>
      `;
      nl.appendChild(nc2);
    });
  });

  go(3);
  setTimeout(()=>{
    document.querySelectorAll('.mrc-bar').forEach(b=>{
      b.style.transition='width 1s ease';
      b.style.width=b.dataset.w;
    });
  },300);
}

function sw(id,tab,btn){
  ['edu','meth','nut'].forEach(t=>document.getElementById(t+'_'+id).classList.toggle('active',t===tab));
  document.querySelectorAll('#tabs_'+id+' .rtab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function toggleNut(id){
  const el=document.getElementById(id);
  el.classList.toggle('open');
  const exp=document.getElementById('exp_'+id);
  if(exp)exp.textContent=el.classList.contains('open')?'▴':'▾';
}
function restart(){
  picked=[];answers={};
  document.querySelectorAll('.mod-card').forEach(c=>c.classList.remove('picked'));
  document.getElementById('pcount').textContent='0 已選';
  document.getElementById('btn-next').disabled=true;
  go(1);
}

initFilters();
renderGrid('全部');
</script>
