<body><aside><a class="brand" href="#home"><span class="brand-icon">✳</span><span>感恩之間<small>BETWEEN GRATITUDE</small></span></a><div class="nav-label" data-zh="你的日常練習" data-en="YOUR DAILY PRACTICE"></div><nav id="nav"></nav><div class="aside-bottom"><span class="tiny-sun">◌</span><p data-zh="把一句感恩，帶回生活。" data-en="Bring one grateful thought into life."></p><small data-zh="進度與筆記儲存在此瀏覽器" data-en="Progress & notes stay in this browser"></small></div></aside>
<div class="shell"><header><span id="breadcrumb"></span><div class="header-right"><span class="status-dot"></span><span class="quiet" data-zh="一個留給自己的空間" data-en="A space for yourself"></span><label class="sr-only" for="lang">Language / 語言</label><select id="lang"><option value="both">中 / EN</option><option value="zh">繁體中文</option><option value="en">English</option></select></div></header><main id="main"></main><footer><span>感恩之間 · Between Gratitude</span><span data-zh="閱讀 · 覺察 · 行動" data-en="READ · NOTICE · ACT"></span></footer></div><div id="toast" role="status" aria-live="polite"></div><script>const SOURCE = [{"id": 0, "zh": "1️⃣ 我感恩我的身體，它讓我能體驗生命的每一刻。", "en": "1. I am grateful for my body; it lets me experience every moment of life."}, {"id": 1, "zh": "脈輪：根輪（Muladhara）", "en": "Chakra: Root (Muladhara)"}, {"id": 2, "zh": "情緒：安全感、踏實感", "en": "Emotions: security, groundedness"}, {"id": 3, "zh": "平衡營養/草藥：紅景天、薑、鐵、黑芝麻", "en": "Balancing nutrients/herbs: rhodiola, ginger, iron, black sesame"}, {"id": 4, "zh": "2️⃣ 我感恩我的情緒，它讓我知道自己的內在需求。", "en": "2. I am grateful for my emotions; they reveal my inner needs."}, {"id": 5, "zh": "脈輪：腹輪/生殖輪（Svadhisthana）", "en": "Chakra: Sacral (Svadhisthana)"}, {"id": 6, "zh": "情緒：情感流動、創造力", "en": "Emotions: emotional flow, creativity"}, {"id": 7, "zh": "平衡營養/草藥：甜菜、紅棗、月見草油", "en": "Balancing nutrients/herbs: beetroot, red dates, evening primrose oil"}, {"id": 8, "zh": "3️⃣ 我感恩我的思想，它讓我學會分辨與選擇。", "en": "3. I am grateful for my thoughts; they teach me discernment and choice."}, {"id": 9, "zh": "脈輪：太陽神經叢輪（Manipura）", "en": "Chakra: Solar plexus (Manipura)"}, {"id": 10, "zh": "情緒：自信、意志力、掌控感", "en": "Emotions: confidence, willpower, a sense of control"}, {"id": 11, "zh": "平衡營養/草藥：黃耆、薑黃、維生素B群", "en": "Balancing nutrients/herbs: astragalus, turmeric, B vitamins"}, {"id": 12, "zh": "4️⃣ 我感恩我的溝通，它讓我能表達自我。", "en": "4. I am grateful for communication; it lets me express myself."}, {"id": 13, "zh": "脈輪：喉輪（Vishuddha）", "en": "Chakra: Throat (Vishuddha)"}, {"id": 14, "zh": "情緒：表達力、誠實、流暢", "en": "Emotions: expression, honesty, fluency"}, {"id": 15, "zh": "平衡營養/草藥：藍莓、薄荷、蜂蜜、海藻", "en": "Balancing nutrients/herbs: blueberries, mint, honey, seaweed"}, {"id": 16, "zh": "5️⃣ 我感恩我的直覺，它指引我向正確的方向。", "en": "5. I am grateful for my intuition; it guides me in the right direction."}, {"id": 17, "zh": "脈輪：眉心輪/第三眼（Ajna）", "en": "Chakra: Brow / third eye (Ajna)"}, {"id": 18, "zh": "情緒：直覺力、洞察力", "en": "Emotions: intuition, insight"}, {"id": 19, "zh": "平衡營養/草藥：紫羅蘭茶、葡萄、迷迭香", "en": "Balancing nutrients/herbs: violet tea, grapes, rosemary"}, {"id": 20, "zh": "🌈【Day 1｜感恩是療癒的開關】感恩讓身體記得「我已經足夠」。（匱乏→豐盛＝副交感啟動→心包能量流動）🌿推薦營養素：鎂＋玫瑰花萃取物👉 鎂放鬆神經、玫瑰提升心輪振動，共振愛與安定頻率。", "en": "Day 1 | Gratitude is the switch for healing. Gratitude reminds the body, “I am already enough.” (Scarcity → abundance = parasympathetic activation → pericardial energy flow.) Suggested nutrients: magnesium + rose extract. Magnesium relaxes nerves; rose raises heart-chakra vibration, resonating with frequencies of love and stability."}, {"id": 21, "zh": "🌈【Day 2｜信任，是身體的安全訊號】信任不是盲目，而是細胞在說：「我安全」。（焦慮→平靜＝交感放鬆→呼吸加深）🌿推薦營養素：南非醉茄＋維生素B群👉 幫助穩定壓力荷爾蒙，支持副交感回歸。", "en": "Day 2 | Trust is the body's signal of safety. Trust is not blindness; it is cells saying, “I am safe.” (Anxiety → calm = sympathetic relaxation → deeper breathing.) Suggested nutrients: ashwagandha + B vitamins. They help stabilize stress hormones and support the return of parasympathetic activity."}, {"id": 22, "zh": "🌈【Day 3｜放下控制，才有流動】放下，不是放棄，而是讓能量重新流通。（緊繃→放鬆＝肌肉釋壓→肝氣順暢）🌿推薦營養素：薑黃素＋聖羅勒👉 薑黃抗發炎舒筋，聖羅勒幫助情緒調頻。", "en": "Day 3 | Let go of control and allow flow. Letting go is not giving up; it allows energy to circulate again. (Tension → relaxation = muscular release → smooth liver qi.) Suggested nutrients: curcumin + holy basil. Turmeric reduces inflammation and loosens muscles; holy basil helps retune emotions."}, {"id": 23, "zh": "🌈【Day 4｜身體會記得你選擇的頻率】每一個你願意微笑的瞬間，細胞都會回應。（低落→欣喜＝多巴胺上升→能量代謝活化）🌿推薦營養素：Omega-3＋左旋酪胺酸👉 幫助神經元傳導順暢、提升思維與情緒清明。", "en": "Day 4 | The body remembers the frequency you choose. Each moment you choose to smile, your cells respond. (Low mood → delight = increased dopamine → activated energy metabolism.) Suggested nutrients: Omega-3 + L-tyrosine. They support smooth neuronal transmission and clearer thinking and emotions."}, {"id": 24, "zh": "🌈【Day 5｜寬恕是最深的細胞修復】怨恨讓細胞緊縮，寬恕讓它再次呼吸。（怨恨→寬容＝心率變異提升→免疫啟動）🌿推薦營養素：玫瑰花＋鎂＋B群👉 促進血流與神經平衡，支援情緒釋放與修復。", "en": "Day 5 | Forgiveness is the deepest cellular repair. Resentment tightens cells; forgiveness lets them breathe again. (Resentment → tolerance = increased heart-rate variability → immune activation.) Suggested nutrients: rose + magnesium + B vitamins. They promote blood flow and neural balance, supporting emotional release and repair."}, {"id": 25, "zh": "🌈【Day 6｜身體是你的能量天線】你的情緒，就是能量訊號。（分心→覺察＝額葉穩定→神經同步）🌿推薦營養素：左旋色胺酸＋Omega-3👉 平衡血清素，穩定思緒與睡眠節律。", "en": "Day 6 | The body is your energy antenna. Your emotions are energy signals. (Distraction → awareness = frontal-lobe stability → neural synchrony.) Suggested nutrients: L-tryptophan + Omega-3. They balance serotonin, steady thoughts, and stabilize sleep rhythms."}, {"id": 26, "zh": "🌈【Day 7｜感恩，是細胞的光語】當你感恩，身體會亮起。（抱怨→感恩＝催產素提升→免疫協調）🌿推薦營養素：玫瑰精油＋聖羅勒＋南非醉茄👉 讓心安定、讓能量柔軟，啟動「修復頻率」。", "en": "Day 7 | Gratitude is the light-language of cells. When you feel grateful, the body lights up. (Complaint → gratitude = increased oxytocin → immune coordination.) Suggested nutrients: rose essential oil + holy basil + ashwagandha. They calm the heart, soften energy, and activate a “repair frequency.”"}, {"id": 27, "zh": "🌈【Day 8｜愛自己，就是能量回家】愛不是口號，是一種神經系統的狀態。（自責→接納＝副腎釋壓→心包鬆開）🌿推薦營養素：B群＋Ashwagandha＋鎂👉 幫助神經恢復、降低皮質醇，回歸溫柔的力量。", "en": "Day 8 | Loving yourself is energy returning home. Love is not a slogan; it is a state of the nervous system. (Self-blame → acceptance = adrenal stress release → pericardial opening.) Suggested nutrients: B vitamins + ashwagandha + magnesium. They aid neural recovery and lower cortisol, restoring gentle strength."}, {"id": 28, "zh": "🌈【Day 9｜你不是去努力顯化，而是對頻】顯化不是「做」，而是「對準」。（混亂→清明＝腦波同步→松果體調頻）🌿推薦營養素：薑黃素＋聖羅勒👉 幫助思緒穩定，提升內在靜定力。", "en": "Day 9 | Manifestation is about attunement rather than effort. Manifestation is not “doing” but “aligning.” (Confusion → clarity = brainwave synchrony → pineal attunement.) Suggested nutrients: curcumin + holy basil. They steady thoughts and deepen inner stillness."}, {"id": 29, "zh": "🌈【Day 10｜感恩是療癒的語言】每一次感恩，都是一次細胞的重啟。（疲憊→活力＝ATP生成提升→線粒體活化）🌿推薦營養素：B群＋Omega-3＋薑黃素👉 增強能量代謝，支援身心一體的修復節奏。", "en": "Day 10 | Gratitude is the language of healing. Every act of gratitude is a cellular restart. (Fatigue → vitality = increased ATP production → mitochondrial activation.) Suggested nutrients: B vitamins + Omega-3 + curcumin. They enhance energy metabolism and support an integrated rhythm of mind-body repair."}, {"id": 30, "zh": "💎小提醒：每天早晨可練習「3分鐘感恩呼吸」👉 吸氣時：想著你擁有的美好👉 呼氣時：釋放恐懼與壓力💠此時服用「鎂＋玫瑰＋B群」，是調頻最好的時刻", "en": "Reminder: Each morning, practice “three minutes of gratitude breathing.” Inhale while thinking of the good things you have; exhale fear and stress. The source calls this the best time to take “magnesium + rose + B vitamins” for attunement."}, {"id": 31, "zh": "🌈《30天感恩×身心療癒能量挑戰》", "en": "30-Day Gratitude × Mind-Body Healing Energy Challenge"}, {"id": 32, "zh": "主題：讓細胞聽見你的愛，讓能量回歸平衡。（每句約20字，LINE緊湊格式，每日對應情緒＋營養素推薦）", "en": "Theme: Let your cells hear your love and let energy return to balance. (About 20 Chinese characters per sentence; compact LINE format, with daily emotions and nutrient suggestions.)"}, {"id": 33, "zh": "🌅Day 1：感恩是療癒的開關", "en": "Day 1: Gratitude is the switch for healing"}, {"id": 34, "zh": "感恩讓心開、氣順、血流動。（匱乏→豐盛＝副交感啟動→細胞放鬆）🌿鎂＋玫瑰花：鎮靜神經，開啟愛與豐盛頻率。", "en": "Gratitude opens the heart and supports qi and blood flow. (Scarcity → abundance = parasympathetic activation → relaxed cells.) Magnesium + rose: calm nerves and open frequencies of love and abundance."}, {"id": 35, "zh": "🌿Day 2：放下焦慮，身體才能修復", "en": "Day 2: Release anxiety so the body can repair"}, {"id": 36, "zh": "焦慮讓神經打結，平靜讓細胞修補。（焦慮→安定＝交感→副交感轉換）🌿南非醉茄＋B群：穩定壓力荷爾蒙，回歸安全感。", "en": "Anxiety knots the nerves; calm lets cells mend. (Anxiety → stability = sympathetic → parasympathetic shift.) Ashwagandha + B vitamins: stabilize stress hormones and restore a sense of safety."}, {"id": 37, "zh": "💧Day 3：感恩的呼吸，就是能量重啟", "en": "Day 3: Gratitude breathing is an energy restart"}, {"id": 38, "zh": "每一次深呼吸，都是療癒的信號。（緊繃→放鬆＝胸腔擴張→氣血回流）🌿鎂＋玫瑰：放鬆神經，調節自律系統。", "en": "Every deep breath is a signal for healing. (Tension → relaxation = chest expansion → returning qi and blood flow.) Magnesium + rose: relax nerves and regulate the autonomic system."}, {"id": 39, "zh": "🔥Day 4：釋放怒氣，讓肝能微笑", "en": "Day 4: Release anger and let the liver smile"}, {"id": 40, "zh": "生氣傷肝，感恩養肝。（怒→柔＝肝氣鬆開→代謝順暢）🌿薑黃素＋聖羅勒：抗發炎、疏肝解鬱。", "en": "Anger harms the liver; gratitude nourishes it. (Anger → gentleness = released liver qi → smoother metabolism.) Curcumin + holy basil: reduce inflammation and soothe liver qi and low mood."}, {"id": 41, "zh": "🌺Day 5：信任生命，一切都在為你運作", "en": "Day 5: Trust life; everything is working for you"}, {"id": 42, "zh": "信任是細胞最熟悉的安定感。（懷疑→信任＝皮質醇下降→免疫提升）🌿南非醉茄＋維他命C：抗壓、穩情緒、強免疫。", "en": "Trust is the stability most familiar to cells. (Doubt → trust = lower cortisol → stronger immunity.) Ashwagandha + vitamin C: resist stress, steady emotions, and strengthen immunity."}, {"id": 43, "zh": "🌙Day 6：睡眠，是感恩的禮物", "en": "Day 6: Sleep is a gift of gratitude"}, {"id": 44, "zh": "深睡能修復神經、平衡荷爾蒙。（疲倦→滋養＝褪黑激素↑→腦修復）🌿鎂＋色胺酸：助眠、鎮靜、修復腦部連結。", "en": "Deep sleep repairs nerves and balances hormones. (Fatigue → nourishment = increased melatonin → brain repair.) Magnesium + tryptophan: support sleep, calm, and repair of brain connections."}, {"id": 45, "zh": "🌸Day 7：愛自己，是最深的感恩", "en": "Day 7: Loving yourself is the deepest gratitude"}, {"id": 46, "zh": "接納自己，就啟動療癒。（自責→自愛＝心包打開→血液流通）🌿玫瑰＋B群：舒壓解鬱，活化心能量。", "en": "Self-acceptance activates healing. (Self-blame → self-love = pericardial opening → blood flow.) Rose + B vitamins: ease stress and low mood, activating heart energy."}, {"id": 47, "zh": "💎Day 8：身體聽得懂你的語言", "en": "Day 8: The body understands your language"}, {"id": 48, "zh": "每一句「謝謝」，都在改變基因表達。（抱怨→感恩＝表觀基因翻轉→修復機制啟動）🌿Omega-3＋維他命D：細胞修復、抗發炎。", "en": "Every “thank you” changes gene expression. (Complaint → gratitude = epigenetic shift → activated repair mechanisms.) Omega-3 + vitamin D: cellular repair and reduced inflammation."}, {"id": 49, "zh": "☀️Day 9：靜下來，力量自然出現", "en": "Day 9: Be still and strength naturally appears"}, {"id": 50, "zh": "安靜不是空白，是內在再生的開始。（混亂→清明＝腦波α化→專注提升）🌿薑黃＋聖羅勒：清腦、穩定思緒。", "en": "Quiet is not emptiness; it begins inner renewal. (Confusion → clarity = alpha brainwaves → improved focus.) Turmeric + holy basil: clear the mind and steady thoughts."}, {"id": 51, "zh": "🌕Day 10：笑，是身體最簡單的藥", "en": "Day 10: A smile is the body's simplest medicine"}, {"id": 52, "zh": "微笑時，大腦釋放幸福荷爾蒙。（低落→喜悅＝多巴胺↑→免疫強化）🌿維生素B6＋酪胺酸：提升多巴胺生成。", "en": "Smiling releases happiness hormones in the brain. (Low mood → joy = increased dopamine → stronger immunity.) Vitamin B6 + tyrosine: increase dopamine production."}, {"id": 53, "zh": "💫Day 11：讓愛流動，讓氣流通", "en": "Day 11: Let love and qi flow"}, {"id": 54, "zh": "當你感恩別人，你的氣場變亮。（閉塞→流動＝經絡暢通→能量補足）🌿玫瑰＋人參：強化心氣，提升生命力。", "en": "When you thank others, your aura brightens. (Blockage → flow = open meridians → replenished energy.) Rose + ginseng: strengthen heart qi and vitality."}, {"id": 55, "zh": "🌼Day 12：身體不會背叛你", "en": "Day 12: Your body will not betray you"}, {"id": 56, "zh": "它只是提醒你要回家。（恐懼→信任＝下丘腦平衡→內分泌協調）🌿南非醉茄＋鎂：安撫神經系統，回歸穩定。", "en": "It is simply reminding you to come home. (Fear → trust = hypothalamic balance → endocrine coordination.) Ashwagandha + magnesium: soothe the nervous system and restore stability."}, {"id": 57, "zh": "🔮Day 13：放下比較，擁抱當下", "en": "Day 13: Release comparison and embrace the present"}, {"id": 58, "zh": "比較讓能量外漏，感恩讓能量回來。（嫉妒→欣賞＝前額葉啟動→智慧提升）🌿薑黃素＋維生素E：抗氧化、養腦氣。", "en": "Comparison lets energy leak; gratitude brings it back. (Envy → appreciation = prefrontal activation → greater wisdom.) Curcumin + vitamin E: antioxidant support and nourishment for brain qi."}, {"id": 59, "zh": "🌳Day 14：動起來，流動才會發生", "en": "Day 14: Move so that flow can happen"}, {"id": 60, "zh": "感恩讓行動更有方向。（倦怠→動力＝ATP↑→代謝提升）🌿左旋肉鹼＋B群：促能量生成、提升活力。", "en": "Gratitude gives action direction. (Burnout → motivation = increased ATP → enhanced metabolism.) L-carnitine + B vitamins: promote energy production and vitality."}, {"id": 61, "zh": "Day 15：免疫系統也能聽懂你的感恩", "en": "Day 15: Your immune system understands gratitude too"}, {"id": 62, "zh": "感恩激活免疫細胞，提升自我防禦力。（恐懼→安全＝NK細胞活化→免疫力提升）🌿維生素C＋B群＋鋅：提升白血球活性，抗氧化修復。", "en": "Gratitude activates immune cells and improves self-defense. (Fear → safety = NK-cell activation → stronger immunity.) Vitamin C + B vitamins + zinc: increase white-blood-cell activity and support antioxidant repair."}, {"id": 63, "zh": "🌼Day 16：壓力下的感恩", "en": "Day 16: Gratitude under pressure"}, {"id": 64, "zh": "感恩降低壓力荷爾蒙，保護腦細胞。（焦慮→平靜＝皮質醇下降→副交感啟動）🌿南非醉茄＋鎂：穩定神經，降低焦慮。", "en": "Gratitude lowers stress hormones and protects brain cells. (Anxiety → calm = lower cortisol → parasympathetic activation.) Ashwagandha + magnesium: steady nerves and reduce anxiety."}, {"id": 65, "zh": "🌊Day 17：釋放情緒，細胞重生", "en": "Day 17: Release emotions and renew cells"}, {"id": 66, "zh": "每次感恩，都讓細胞放鬆、修復。（憤怒→寬容＝肝臟代謝順暢→排毒改善）🌿薑黃＋奶薊：肝臟排毒，抗發炎。", "en": "Each act of gratitude relaxes and repairs cells. (Anger → tolerance = smooth liver metabolism → improved detoxification.) Turmeric + milk thistle: liver detoxification and reduced inflammation."}, {"id": 67, "zh": "💧Day 18：水分與感恩共振", "en": "Day 18: Water and gratitude resonate"}, {"id": 68, "zh": "感恩讓身體水分循環更順暢。（煩躁→平和＝腎上腺平衡→利尿順暢）🌿蔓越莓＋維他命B群：腎臟保護，水分代謝。", "en": "Gratitude improves the body's water circulation. (Irritability → peace = adrenal balance → smoother urination.) Cranberry + B vitamins: kidney protection and water metabolism."}, {"id": 69, "zh": "🌟Day 19：愛自己，重建自信", "en": "Day 19: Love yourself and rebuild confidence"}, {"id": 70, "zh": "感恩自己讓內分泌回到平衡。（自卑→自愛＝多巴胺↑→性激素穩定）🌿Omega-3＋酪胺酸：情緒穩定，促進荷爾蒙合成。", "en": "Gratitude toward yourself restores endocrine balance. (Inferiority → self-love = increased dopamine → stable sex hormones.) Omega-3 + tyrosine: emotional stability and hormone synthesis."}, {"id": 71, "zh": "🌸Day 20：腦波與感恩", "en": "Day 20: Brainwaves and gratitude"}, {"id": 72, "zh": "每天想像幸福場景，腦波進入α波。（緊張→放鬆＝腦波α化→專注提升）🌿鎂＋薰衣草精油：安定神經，增強專注。", "en": "Imagine happy scenes daily to enter alpha brainwaves. (Tension → relaxation = alpha brainwaves → improved focus.) Magnesium + lavender essential oil: calm nerves and enhance focus."}, {"id": 73, "zh": "🔥Day 21：代謝與感恩", "en": "Day 21: Metabolism and gratitude"}, {"id": 74, "zh": "感恩加速代謝，幫助荷爾蒙循環。（疲倦→活力＝胰島素穩定→代謝提升）🌿左旋肉鹼＋B群＋鋅：促能量生成，血糖穩定。", "en": "Gratitude accelerates metabolism and supports hormone circulation. (Fatigue → vitality = stable insulin → increased metabolism.) L-carnitine + B vitamins + zinc: energy production and stable blood sugar."}, {"id": 75, "zh": "🌳Day 22：情緒與腸道共振", "en": "Day 22: Emotions and the gut resonate"}, {"id": 76, "zh": "感恩提升腸道菌叢平衡，增強免疫。（焦慮→平靜＝腸腦軸→免疫細胞活化）🌿益生菌＋膳食纖維：維持腸道健康，提高免疫力。", "en": "Gratitude improves gut-microbiome balance and immunity. (Anxiety → calm = gut-brain axis → immune-cell activation.) Probiotics + dietary fiber: maintain gut health and improve immunity."}, {"id": 77, "zh": "🌞Day 23：愛與人際連結", "en": "Day 23: Love and human connection"}, {"id": 78, "zh": "感恩拉近關係，降低社交壓力。（孤單→連結＝催產素↑→副交感啟動）🌿玫瑰＋人參：安定心神，提升親密互動。", "en": "Gratitude brings people closer and lowers social stress. (Loneliness → connection = increased oxytocin → parasympathetic activation.) Rose + ginseng: calm the mind and support intimate interaction."}, {"id": 79, "zh": "🌕Day 24：快樂細胞", "en": "Day 24: Happy cells"}, {"id": 80, "zh": "感恩讓神經內分泌分泌多巴胺。（低落→喜悅＝多巴胺↑→免疫力提升）🌿維生素B6＋Omega-3：提升幸福感，抗憂鬱。", "en": "Gratitude prompts dopamine release through neuroendocrine activity. (Low mood → joy = increased dopamine → stronger immunity.) Vitamin B6 + Omega-3: increase happiness and counter depression."}, {"id": 81, "zh": "💫Day 25：修復夜間能量", "en": "Day 25: Restore nighttime energy"}, {"id": 82, "zh": "夜晚感恩，褪黑激素釋放增加。（失眠→安眠＝褪黑素↑→荷爾蒙修復）🌿鎂＋色胺酸：促進睡眠品質，腦部修復。", "en": "Evening gratitude increases melatonin release. (Insomnia → restful sleep = increased melatonin → hormonal repair.) Magnesium + tryptophan: improve sleep quality and brain repair."}, {"id": 83, "zh": "🌼Day 26：心臟與感恩", "en": "Day 26: The heart and gratitude"}, {"id": 84, "zh": "感恩降低心率，心血管穩定。（緊張→平和＝心率變異性提高→副交感啟動）🌿CoQ10＋Omega-3：心臟保護，增強能量生成。", "en": "Gratitude lowers heart rate and stabilizes cardiovascular function. (Tension → peace = increased heart-rate variability → parasympathetic activation.) CoQ10 + Omega-3: heart protection and enhanced energy production."}, {"id": 85, "zh": "🌊Day 27：肝腎排毒感恩", "en": "Day 27: Gratitude for liver and kidney detoxification"}, {"id": 86, "zh": "感恩讓肝腎協同運作，促進解毒。（壓力→寬容＝肝腎排毒順暢→能量循環）🌿奶薊＋薑黃：肝臟修復，抗發炎。", "en": "Gratitude coordinates the liver and kidneys and supports detoxification. (Stress → tolerance = smooth liver-kidney detoxification → energy circulation.) Milk thistle + turmeric: liver repair and reduced inflammation."}, {"id": 87, "zh": "🔮Day 28：身心靈同步", "en": "Day 28: Synchronize body, mind, and spirit"}, {"id": 88, "zh": "感恩讓身體、情緒、意識同步。（混亂→和諧＝自主神經平衡→全身能量流通）🌿南非醉茄＋鎂＋玫瑰：神經安定，全身舒暢。", "en": "Gratitude synchronizes body, emotions, and consciousness. (Confusion → harmony = autonomic balance → whole-body energy flow.) Ashwagandha + magnesium + rose: calm nerves and ease the whole body."}, {"id": 89, "zh": "🌟Day 29：創造力與感恩", "en": "Day 29: Creativity and gratitude"}, {"id": 90, "zh": "感恩激活前額葉，提升決策與創意。（焦慮→專注＝前額葉活化→思維清晰）🌿B群＋Omega-3：腦細胞修復，創造力增強。", "en": "Gratitude activates the prefrontal cortex and improves decisions and creativity. (Anxiety → focus = prefrontal activation → clear thinking.) B vitamins + Omega-3: brain-cell repair and enhanced creativity."}, {"id": 91, "zh": "🌱Day 30：感恩成為生活習慣", "en": "Day 30: Make gratitude a daily habit"}, {"id": 92, "zh": "每天一點感恩，細胞與情緒長期受益。（負面→正面＝神經迴路重建→健康持續）🌿綜合維生素＋益生菌＋鎂：全方位支援身心健康。", "en": "A little gratitude every day benefits cells and emotions over time. (Negative → positive = rebuilt neural circuits → lasting health.) Multivitamins + probiotics + magnesium: all-round mind-body support."}, {"id": 93, "zh": "1️⃣ 我感恩我的身體，它讓我能體驗生命的每一刻。根輪 → 安全感、踏實感 → 紅景天、薑、鐵", "en": "1. I am grateful for my body; it lets me experience every moment of life. Root → security, groundedness → rhodiola, ginger, iron"}, {"id": 94, "zh": "2️⃣ 我感恩我的家，它給我歸屬與支持。根輪 → 安全感 → 紅景天、黑芝麻、鐵", "en": "2. I am grateful for my home; it offers belonging and support. Root → security → rhodiola, black sesame, iron"}, {"id": 95, "zh": "3️⃣ 我感恩我的努力，它讓我穩定前行。根輪 → 穩定感 → 黃耆、薑、紅棗", "en": "3. I am grateful for my effort; it keeps me moving steadily. Root → stability → astragalus, ginger, red dates"}, {"id": 96, "zh": "4️⃣ 我感恩我的情緒，它讓我了解自己。腹輪 → 情感流動、創造力 → 甜菜、月見草油、紅棗", "en": "4. I am grateful for my emotions; they help me understand myself. Sacral → emotional flow, creativity → beetroot, evening primrose oil, red dates"}, {"id": 97, "zh": "5️⃣ 我感恩我的愛，它讓我與人連結。腹輪 → 親密感 → 蓮子、玫瑰花茶、核桃", "en": "5. I am grateful for my love; it connects me with others. Sacral → intimacy → lotus seeds, rose tea, walnuts"}, {"id": 98, "zh": "6️⃣ 我感恩我的感官，它讓我享受生活。腹輪 → 感受力 → 橙皮、南瓜子、胡蘿蔔", "en": "6. I am grateful for my senses; they let me enjoy life. Sacral → sensitivity → orange peel, pumpkin seeds, carrots"}, {"id": 99, "zh": "7️⃣ 我感恩我的思想，它讓我學會選擇。太陽神經叢輪 → 自信、意志力 → 黃耆、薑黃、維生素B群", "en": "7. I am grateful for my thoughts; they teach me to choose. Solar plexus → confidence, willpower → astragalus, turmeric, B vitamins"}, {"id": 100, "zh": "8️⃣ 我感恩我的決策，它讓我承擔人生。太陽神經叢輪 → 自我掌控 → 黃耆、南瓜子、綠茶", "en": "8. I am grateful for my decisions; they let me take responsibility for my life. Solar plexus → self-direction → astragalus, pumpkin seeds, green tea"}, {"id": 101, "zh": "9️⃣ 我感恩我的自律，它讓我持續成長。太陽神經叢輪 → 意志力 → 薑黃、紅棗、螺旋藻", "en": "9. I am grateful for my discipline; it helps me keep growing. Solar plexus → willpower → turmeric, red dates, spirulina"}, {"id": 102, "zh": "10️⃣ 我感恩我的溝通，它讓我表達自我。喉輪 → 誠實、表達力 → 藍莓、薄荷、海藻", "en": "10. I am grateful for communication; it lets me express myself. Throat → honesty, expression → blueberries, mint, seaweed"}, {"id": 103, "zh": "11️⃣ 我感恩我的聲音，它讓我被聽見。喉輪 → 說服力 → 蜂蜜、薄荷、藍莓", "en": "11. I am grateful for my voice; it lets me be heard. Throat → persuasion → honey, mint, blueberries"}, {"id": 104, "zh": "12️⃣ 我感恩我的創意，它讓我啟發他人。喉輪 → 表達力 → 桑葚、迷迭香、薰衣草茶", "en": "12. I am grateful for my ideas; they let me inspire others. Throat → expression → mulberries, rosemary, lavender tea"}, {"id": 105, "zh": "13️⃣ 我感恩我的直覺，它指引我方向。眉心輪 → 洞察力 → 紫羅蘭茶、葡萄、迷迭香", "en": "13. I am grateful for my intuition; it guides my direction. Brow → insight → violet tea, grapes, rosemary"}, {"id": 106, "zh": "14️⃣ 我感恩我的智慧，它讓我看清本質。眉心輪 → 洞察力、思維清晰 → 黑枸杞、迷迭香、藍莓", "en": "14. I am grateful for my wisdom; it lets me see what matters. Brow → insight, clear thinking → black goji berries, rosemary, blueberries"}, {"id": 107, "zh": "15️⃣ 我感恩我的想像，它讓我創造未來。眉心輪 → 想像力 → 紫羅蘭茶、茉莉花茶、葡萄", "en": "15. I am grateful for my imagination; it lets me create the future. Brow → imagination → violet tea, jasmine tea, grapes"}, {"id": 108, "zh": "16️⃣ 我感恩我的心，它讓我愛與被愛。心輪 → 愛、同理 → 玫瑰花茶、綠茶、紅豆", "en": "16. I am grateful for my heart; it lets me love and be loved. Heart → love, empathy → rose tea, green tea, red beans"}, {"id": 109, "zh": "17️⃣ 我感恩我的寬容，它讓我和平相處。心輪 → 同理心 → 玫瑰花、薄荷、紅豆", "en": "17. I am grateful for my tolerance; it lets me live peacefully with others. Heart → empathy → rose, mint, red beans"}, {"id": 110, "zh": "18️⃣ 我感恩我的善意，它帶來和諧關係。心輪 → 愛與連結 → 綠茶、玫瑰花、蓮子", "en": "18. I am grateful for my kindness; it brings harmony to relationships. Heart → love and connection → green tea, rose, lotus seeds"}, {"id": 111, "zh": "19️⃣ 我感恩我的平靜，它讓我內心安定。冠輪 → 靈性覺察、內在平衡 → 紫草茶、靈芝、接骨木", "en": "19. I am grateful for my calm; it steadies my inner life. Crown → spiritual awareness, inner balance → zicao tea, reishi, elder"}, {"id": 112, "zh": "20️⃣ 我感恩我的覺知，它讓我看見自己。冠輪 → 靈性覺察 → 靈芝、接骨木、紫草", "en": "20. I am grateful for my awareness; it lets me see myself. Crown → spiritual awareness → reishi, elder, zicao"}, {"id": 113, "zh": "21️⃣ 我感恩我的信念，它讓我不迷失方向。冠輪 → 靈性力量 → 紫草、靈芝、迷迭香", "en": "21. I am grateful for my beliefs; they keep me from losing my way. Crown → spiritual strength → zicao, reishi, rosemary"}, {"id": 114, "zh": "22️⃣ 我感恩我的豁達，它讓我接受生命。冠輪 → 心靈開放 → 紫草茶、玫瑰、靈芝", "en": "22. I am grateful for my openness; it lets me accept life. Crown → openness of spirit → zicao tea, rose, reishi"}, {"id": 115, "zh": "23️⃣ 我感恩我的學習，它讓我成長不息。眉心輪 → 洞察與智慧 → 黑枸杞、迷迭香、藍莓", "en": "23. I am grateful for learning; it keeps me growing. Brow → insight and wisdom → black goji berries, rosemary, blueberries"}, {"id": 116, "zh": "24️⃣ 我感恩我的耐心，它讓我穩定前進。太陽神經叢輪 → 意志力 → 黃耆、薑黃、南瓜子", "en": "24. I am grateful for my patience; it lets me move forward steadily. Solar plexus → willpower → astragalus, turmeric, pumpkin seeds"}, {"id": 117, "zh": "25️⃣ 我感恩我的勇氣，它讓我面對挑戰。根輪 → 安全感、勇氣 → 紅景天、黑芝麻、鐵", "en": "25. I am grateful for my courage; it lets me face challenges. Root → security, courage → rhodiola, black sesame, iron"}, {"id": 118, "zh": "26️⃣ 我感恩我的善行，它讓世界回應善意。心輪 → 同理心、愛 → 玫瑰、綠茶、蓮子", "en": "26. I am grateful for my good deeds; they invite kindness from the world. Heart → empathy, love → rose, green tea, lotus seeds"}, {"id": 119, "zh": "27️⃣ 我感恩我的專注，它讓我效率提升。喉輪 → 清晰表達 → 薄荷、藍莓、海藻", "en": "27. I am grateful for my focus; it helps me work effectively. Throat → clear expression → mint, blueberries, seaweed"}, {"id": 120, "zh": "28️⃣ 我感恩我的喜悅，它讓我生活有光。腹輪 → 情感流動 → 甜菜、南瓜子、胡蘿蔔", "en": "28. I am grateful for my joy; it brings light to life. Sacral → emotional flow → beetroot, pumpkin seeds, carrots"}, {"id": 121, "zh": "29️⃣ 我感恩我的創造，它讓我改變世界。眉心輪 → 直覺與想像 → 紫羅蘭茶、迷迭香、葡萄", "en": "29. I am grateful for my creativity; it lets me change the world. Brow → intuition and imagination → violet tea, rosemary, grapes"}, {"id": 122, "zh": "30️⃣ 我感恩我的存在，它讓宇宙完整。冠輪 → 靈性覺察 → 靈芝、接骨木、紫草", "en": "30. I am grateful for my existence; it makes the universe complete. Crown → spiritual awareness → reishi, elder, zicao"}, {"id": 123, "zh": "用「我可以」代替「我不行」", "en": "Say “I can” instead of “I can't.”"}, {"id": 124, "zh": "用「我願意嘗試」代替「我怕失敗」", "en": "Say “I am willing to try” instead of “I fear failure.”"}, {"id": 125, "zh": "用「我學到什麼」代替「我做錯了」", "en": "Say “What did I learn?” instead of “I made a mistake.”"}, {"id": 126, "zh": "用「下一步是什麼」代替「我不知道」", "en": "Say “What is the next step?” instead of “I don't know.”"}, {"id": 127, "zh": "用「這是挑戰」代替「這很難」", "en": "Say “This is a challenge” instead of “This is hard.”"}, {"id": 128, "zh": "用「我選擇努力」代替「我被迫」", "en": "Say “I choose to make an effort” instead of “I am forced to.”"}, {"id": 129, "zh": "用「我有資源」代替「我沒有」", "en": "Say “I have resources” instead of “I have nothing.”"}, {"id": 130, "zh": "用「我負責」代替「不是我的問題」", "en": "Say “I take responsibility” instead of “It is not my problem.”"}, {"id": 131, "zh": "用「我能改善」代替「沒辦法」", "en": "Say “I can improve” instead of “Nothing can be done.”"}, {"id": 132, "zh": "用「我感謝」代替「我抱怨」", "en": "Say “I give thanks” instead of “I complain.”"}, {"id": 133, "zh": "用「這很有趣」代替「這無聊」", "en": "Say “This is interesting” instead of “This is boring.”"}, {"id": 134, "zh": "用「我可以學會」代替「我不懂」", "en": "Say “I can learn” instead of “I don't understand.”"}, {"id": 135, "zh": "用「我值得擁有」代替「我不配」", "en": "Say “I deserve this” instead of “I am unworthy.”"}, {"id": 136, "zh": "用「我選擇信任」代替「我懷疑一切」", "en": "Say “I choose to trust” instead of “I doubt everything.”"}, {"id": 137, "zh": "用「我看到機會」代替「我只看到困難」", "en": "Say “I see opportunities” instead of “I only see difficulties.”"}, {"id": 138, "zh": "用「我會找到方法」代替「我找不到路」", "en": "Say “I will find a way” instead of “I cannot find a path.”"}, {"id": 139, "zh": "用「我有價值」代替「我不重要」", "en": "Say “I have value” instead of “I do not matter.”"}, {"id": 140, "zh": "用「我會持續努力」代替「我放棄吧」", "en": "Say “I will keep trying” instead of “I should give up.”"}, {"id": 141, "zh": "用「我能掌控」代替「我沒辦法控制」", "en": "Say “I can take charge” instead of “I have no control.”"}, {"id": 142, "zh": "用「我能解決」代替「這無解」", "en": "Say “I can solve this” instead of “There is no solution.”"}, {"id": 143, "zh": "用「我感到喜悅」代替「我好煩」", "en": "Say “I feel joy” instead of “I am so annoyed.”"}, {"id": 144, "zh": "用「我選擇平靜」代替「我好焦慮」", "en": "Say “I choose calm” instead of “I am so anxious.”"}, {"id": 145, "zh": "用「我勇敢嘗試」代替「我怕犯錯」", "en": "Say “I try courageously” instead of “I fear mistakes.”"}, {"id": 146, "zh": "用「我樂於分享」代替「這不關我事」", "en": "Say “I am happy to share” instead of “It is none of my business.”"}, {"id": 147, "zh": "用「我重視學習」代替「我只是完成任務」", "en": "Say “I value learning” instead of “I am just finishing the task.”"}, {"id": 148, "zh": "用「我相信自己」代替「我做不到」", "en": "Say “I believe in myself” instead of “I cannot do it.”"}, {"id": 149, "zh": "用「我能調整」代替「我改不了」", "en": "Say “I can adjust” instead of “I cannot change.”"}, {"id": 150, "zh": "用「我專注當下」代替「我擔心未來」", "en": "Say “I focus on the present” instead of “I worry about the future.”"}, {"id": 151, "zh": "用「我欣賞別人」代替「我嫉妒」", "en": "Say “I appreciate others” instead of “I am jealous.”"}, {"id": 152, "zh": "用「我承認錯誤」代替「我推卸責任」", "en": "Say “I admit mistakes” instead of “I shift the blame.”"}, {"id": 153, "zh": "用「我看到價值」代替「這沒用」", "en": "Say “I see value” instead of “This is useless.”"}, {"id": 154, "zh": "用「我尊重他人」代替「我批評抱怨」", "en": "Say “I respect others” instead of “I criticize and complain.”"}, {"id": 155, "zh": "用「我肯定自己」代替「我不自信」", "en": "Say “I affirm myself” instead of “I lack confidence.”"}, {"id": 156, "zh": "用「我選擇行動」代替「我只是想想」", "en": "Say “I choose action” instead of “I only think about it.”"}, {"id": 157, "zh": "用「我心懷感恩」代替「我不滿」", "en": "Say “I am grateful” instead of “I am dissatisfied.”"}, {"id": 158, "zh": "用「我專注改善」代替「我抱怨不斷」", "en": "Say “I focus on improvement” instead of “I keep complaining.”"}, {"id": 159, "zh": "用「我能承受」代替「我撐不下去」", "en": "Say “I can bear this” instead of “I cannot go on.”"}, {"id": 160, "zh": "用「我享受挑戰」代替「我受夠了」", "en": "Say “I enjoy challenges” instead of “I have had enough.”"}, {"id": 161, "zh": "用「我用心聆聽」代替「我不在乎」", "en": "Say “I listen attentively” instead of “I do not care.”"}, {"id": 162, "zh": "用「我以正面語言表達」代替「我消極抱怨」", "en": "Say “I express myself positively” instead of “I complain negatively.”"}, {"id": 163, "zh": "✅【第一脈輪：根基能量＋團購營養素／草藥果效機制解析】（繁體白話＋LINE行與行緊湊格式）", "en": "First Chakra: Foundational Energy + Group-Buy Nutrients / Herbs and Their Claimed Mechanisms (plain Traditional Chinese, compact LINE formatting)"}, {"id": 164, "zh": "🌍一、脈輪主題：生存與根基（Root Chakra）象徵「安全感、穩定、信任、身體存在」。當能量暢通 → 感覺安全、有力量、行動穩定。當能量阻塞 → 容易焦慮、害怕未來、缺乏歸屬感。", "en": "1. Chakra theme: survival and roots. The Root Chakra symbolizes security, stability, trust, and bodily existence. When energy flows freely → feeling safe and strong, acting steadily. When blocked → anxiety, fear of the future, and lack of belonging."}, {"id": 165, "zh": "❤️二、意識層面：自我維護與健康根基核心信念：「我有權活在這個世界，我被支持。」⚖️ 平衡時 → 能照顧身體、維持生活節奏、有紀律。❌ 失衡時 → 容易懶散、逃避現實、經濟焦慮或過度控制。", "en": "2. Consciousness: self-care and the foundations of health. Core belief: “I have a right to live in this world; I am supported.” Balanced → bodily care, a steady rhythm of life, discipline. Unbalanced → sluggishness, avoidance of reality, financial anxiety, or excessive control."}, {"id": 166, "zh": "🧬機制解析：腎上腺是根輪對應腺體，負責「壓力反應」與「能量調節」。若長期恐懼或緊張，腎上腺分泌過多皮質醇 → 導致疲勞、免疫下降、情緒波動。👉 所以第一脈輪的穩定，能幫助降低皮質醇、促進副交感神經啟動。", "en": "Mechanism explanation: The source associates the root chakra with the adrenal glands, describing their roles in stress responses and energy regulation. It says prolonged fear or tension causes excess cortisol → fatigue, reduced immunity, and emotional fluctuations. It therefore claims that stabilizing the first chakra lowers cortisol and activates parasympathetic activity."}, {"id": 167, "zh": "💢三、情緒層面：恐懼是根輪的陰影面恐懼提醒「你的安全系統需要被修復」。若幼年缺乏穩定照顧，長大後易在壓力中過度反應。🌱練習：✓ 深呼吸連接腳底 → 感受地面支撐✓ 培養日常規律 → 睡眠固定、飲食穩定✓ 給自己具體的安全空間 → 穩定身心能量", "en": "3. Emotions: fear as the root chakra's shadow. Fear signals that “your safety system needs repair.” The source links unstable childhood care with excessive stress responses in adulthood. Practices: breathe deeply and connect with the soles of your feet → feel support from the ground; build daily routines → regular sleep and meals; create a concrete safe space → stabilize mind-body energy."}, {"id": 168, "zh": "🧠四、議題層面：穩定與歸屬感根輪穩定者，能感受到：✔️ 對世界的信任感✔️ 對身體的敏感覺察✔️ 對生活的節奏掌控若阻塞則：❌ 容易焦慮、金錢不安、無法長期定居或專注。", "en": "4. Issues: stability and belonging. A stable root chakra is described as bringing trust in the world, sensitive bodily awareness, and a sense of rhythm in life. Blockage is described as anxiety, financial insecurity, and difficulty settling down or concentrating over time."}, {"id": 169, "zh": "🩻五、身體層面：與身體連結的根本📍位置：脊椎基底、骨盆底、雙腿📍腺體：腎上腺📍器官：膀胱、腎臟、骨骼、腿部肌肉📍疾病傾向：腰痛、下肢冰冷、坐骨神經痛、腎上腺疲勞、免疫低下、貧血、焦慮失眠。", "en": "5. Body: the basis of bodily connection. Location: base of spine, pelvic floor, legs. Glands: adrenals. Organs: bladder, kidneys, bones, leg muscles. Listed disease tendencies: lower-back pain, cold lower limbs, sciatica, “adrenal fatigue,” low immunity, anemia, anxiety, and insomnia."}, {"id": 170, "zh": "🍀六、團購營養素／草藥果效機制解析（第一脈輪強化組合）", "en": "6. Group-buy nutrients / herbs and claimed mechanisms (first-chakra strengthening combination)"}, {"id": 171, "zh": "功能", "en": "Function"}, {"id": 172, "zh": "營養素／草藥", "en": "Nutrient / herb"}, {"id": 173, "zh": "果效機制解析", "en": "Claimed mechanism"}, {"id": 174, "zh": "⚡ 提升穩定能量", "en": "Increase stable energy"}, {"id": 175, "zh": "人參皂苷（高麗蔘萃取）", "en": "Ginsenosides (Korean ginseng extract)"}, {"id": 176, "zh": "調節腎上腺功能、提升抗壓力、促進交感與副交感平衡。", "en": "Regulate adrenal function, increase stress resilience, and promote sympathetic-parasympathetic balance."}, {"id": 177, "zh": "❤️ 穩定心神、減少焦慮", "en": "Steady the mind and reduce anxiety"}, {"id": 178, "zh": "冬蟲夏草", "en": "Cordyceps"}, {"id": 179, "zh": "增強氧氣利用率、改善腎上腺疲勞、穩定血糖與能量代謝。", "en": "Improve oxygen utilization, improve “adrenal fatigue,” and stabilize blood sugar and energy metabolism."}, {"id": 180, "zh": "💧 增強腎氣與根基能量", "en": "Strengthen kidney qi and foundational energy"}, {"id": 181, "zh": "熟地黃＋枸杞子", "en": "Prepared rehmannia + goji berries"}, {"id": 182, "zh": "滋陰補腎、強化血液循環與下焦能量流動，助安眠與修復。", "en": "Nourish yin and the kidneys, strengthen blood circulation and lower-burner energy flow, and aid sleep and repair."}, {"id": 183, "zh": "💪 強化地氣接地感", "en": "Strengthen a sense of grounding"}, {"id": 184, "zh": "瑪卡（Maca）", "en": "Maca"}, {"id": 185, "zh": "提升生命力、調整荷爾蒙軸（HPA軸），恢復穩定的行動動力。", "en": "Boost vitality, adjust the hormonal axis (HPA axis), and restore steady motivation for action."}, {"id": 186, "zh": "🧘‍♀️ 鎮定神經系統", "en": "Calm the nervous system"}, {"id": 187, "zh": "鎂＋維生素B群", "en": "Magnesium + B vitamins"}, {"id": 188, "zh": "支援能量代謝、鎮靜中樞神經、減少焦慮與肌肉緊繃。", "en": "Support energy metabolism, calm the central nervous system, and reduce anxiety and muscle tension."}, {"id": 189, "zh": "🌿 安撫恐懼情緒", "en": "Soothe fear"}, {"id": 190, "zh": "纈草根（Valerian root）", "en": "Valerian root"}, {"id": 191, "zh": "增加GABA神經傳導物質，幫助放鬆與入睡，安定情緒波動。", "en": "Increase the neurotransmitter GABA, support relaxation and sleep, and steady emotional fluctuations."}, {"id": 192, "zh": "🔥 增強血流與氣循環", "en": "Improve blood and qi circulation"}, {"id": 193, "zh": "薑黃素＋黑胡椒萃取", "en": "Curcumin + black pepper extract"}, {"id": 194, "zh": "抗發炎、促進血液循環，使根輪區域氣血流動更順暢。", "en": "Reduce inflammation and promote blood circulation, allowing qi and blood to flow more smoothly in the root-chakra region."}, {"id": 195, "zh": "🌳七、日常強化策略1️⃣ 每天赤腳走在草地或地板上 → 接地氣場，穩定神經。2️⃣ 多攝取根莖類食物（紅蘿蔔、甜菜、馬鈴薯）→ 支援地氣能量。3️⃣ 用「紅色」冥想、服飾或石頭（如紅碧玉、赤鐵礦）增強根輪頻率。4️⃣ 睡前泡腳加薑粉或玫瑰鹽 → 促循環與放鬆下焦能量。5️⃣ 練習「安全呼吸」：吸氣4秒、停2秒、吐氣6秒、停2秒，幫助副交感神經回歸平衡。", "en": "7. Daily strengthening strategies. 1) Walk barefoot on grass or the floor daily → ground the aura and steady nerves. 2) Eat more root vegetables (carrots, beetroot, potatoes) → support grounding energy. 3) Use red in meditation, clothing, or stones (such as red jasper and hematite) to strengthen the root-chakra frequency. 4) Soak feet before bed with ginger powder or rose salt → promote circulation and relax lower-burner energy. 5) Practice “safe breathing”: inhale 4 seconds, hold 2, exhale 6, hold 2, to help parasympathetic activity regain balance."}, {"id": 196, "zh": "💫八、總結能量核心第一脈輪是「我存在的根」：當你願意信任生命、穩定節奏、照顧身體，能量自然會向上流動，你的心會安、思緒會清、財富與機會會穩定累積。", "en": "8. Core energy summary. The first chakra is “the root of my existence”: when you trust life, steady your rhythm, and care for your body, energy naturally rises, the heart settles, thoughts clear, and wealth and opportunities steadily accumulate."}];</script><script>const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

e class="progress-card"><h3>${ui('慢慢來，也是在前進。','Slowly is still forward.')}</h3><div class="progress-number">${String(progress).padStart(2,'0')} <small>/ 30</small></div><p>${ui('已完成的日常練習','Daily practices completed')}</p><div class="progress-bar" role="progressbar" aria-label="30-day progress" aria-valuenow="${progress}" aria-valuemin="0" aria-valuemax="30"><div style="width:${progress/30*100}%"></div></div><div class="day-dots">${Array.from({length:30},(_,i)=>`<button class="day-dot ${done.includes('30-'+(i+1))?'done':''}" data-open-day="${i+1}" aria-label="${ui('閱讀第','Read day ')}${i+1}${ui('天','')}">${i+1}</button>`).join('')}</div></article></div><div class="section-top"><h2>${ui('讓感恩，走進生活','Make gratitude part of life')}</h2><small>EXPLORE YOUR LIBRARY</small></div><div class="collections">${[['quotes','❧','一句話，重新看見自己','See yourself in a new sentence','35 則原文感恩句','35 original gratitude entries'],['language','⇄','換一句話，打開可能','A new phrase, a new possibility','40 組語言轉換','40 language shifts'],['root','♧','從安定，開始扎根','Begin with a sense of grounding','根輪原文專章與表格','Root chapter & source table']].map(([route,icon,z,e,dz,de])=>`<a class="collection" href="#${route}"><span class="icon">${icon}</span><span class="arrow">↗</span><h3>${ui(z,e)}</h3><p>${ui(dz,de)}</p></a>`).join('')}</div><div class="source-note">${ui('依《感恩.docx》編排 · 新增哲學導讀與行動提示 · 原文主張與編輯內容分別標示','Based on Gratitude.docx · Added philosophical readings and action prompts · Source claims and editorial additions are labeled')}</div>`}

function journal(){return title('我的筆記','My journal','為感恩留下具體的時間、人物與情境。筆記僅儲存在目前裝置的此瀏覽器。','Give gratitude a time, a person, and a situation. Notes are stored only in this browser on this device.')+`<div class="notice">${ui('今日提問：這句感恩用在什麼情境？它讓我願意做哪一件小事？','Today’s prompts: In what situation does this gratitude belong? What small action does it invite?')}</div><label for="journal" class="eyebrow">${ui('我的日常紀錄','MY EVERYDAY NOTES')}</label><textarea id="journal" class="journal" placeholder="${ui('今天，我想感謝…','Today, I am grateful for…')}">${esc(read('gratitude-journal',''))}</textarea><div class="note-meta"><span class="archive-count" id="note-status">${ui('輸入時自動儲存','Saves as you type')}</span><button class="outline" id="export-notes">${ui('匯出筆記','Export notes')}</button></div><p class="page-intro">${ui('不需要把每個情緒改成正面。先描述自己正在經歷的事，再選擇下一步。','You do not have to turn every emotion positive. Describe what you are experiencing, then choose a next step.')}</p>`}
function about(){return title('哲學與來源','Philosophy & sources','讓原文、翻譯與新增導讀各有清楚的位置。','A clear place for source text, translation, and editorial interpretation.')+intro()+`<div class="coverage">${[['5','入門感恩句','Introductory entries'],['10','日系列','Day series'],['30','日挑戰','Day challenge'],['30','則感恩句','Gratitude entries'],['40','組語言轉換','Language shifts'],['8','節根輪專章','Root chapter sections']].map(([n,z,e])=>`<div><b>${n}</b>${ui(z,e)}</div>`).join('')}</div><div class="philosophy"><article><span class="eyebrow">01 / LANGUAGE IN LIFE</span><h2>${ui('維根斯坦：觀察語言的使用','Wittgenstein: language in use')}</h2>${dual('導讀將「感恩」放回具體生活：在什麼時候、對誰說、接著做什麼？這是受到語言遊戲與語詞使用觀點啟發的編輯應用，不是哲學家的感恩處方。','This reading places gratitude in a concrete situation: when do you say it, to whom, and what do you do next? It is an editorial application inspired by language-games and word use, not a gratitude prescription by the philosopher.')}<a href="https://www.wittgensteinproject.org/w/index.php?title=Blog:Introduction_to_Wittgenstein%E2%80%99s_Philosophical_Investigations" target="_blank" rel="noopener">The Ludwig Wittgenstein Project ↗</a></article><article><span class="eyebrow">02 / BEING IN THE WORLD</span><h2>${ui('海德格：回到在世的日常','Heidegger: everyday being-in-the-world')}</h2>${dual('導讀邀請你描述已身處的關係、物件與情境，並留意自己所關切的事。這是受到在世存在與關懷概念啟發的練習設計，不等同於海德格對感恩的直接主張。','This reading invites you to describe the relationships, objects, and situations you already inhabit and notice what matters to you. The exercise is inspired by being-in-the-world and care, not a direct claim by Heidegger about gratitude.')}<a href="https://plato.stanford.edu/entries/heidegger/index.html" target="_blank" rel="noopener">Stanford Encyclopedia of Philosophy ↗</a></article></div><section class="root-section"><h2 class="page-title">${ui('如何閱讀這份資料','How to read this material')}</h2>${dual('中文原文：來自使用者提供的《感恩.docx》，依文字順序完整保存。英文：逐段翻譯，保留來源的象徵表達與主張；草藥原文未指明物種者不推定物種，例如紫草譯為 zicao。最小行動、首頁與哲學導讀：為本 App 新增，並非原對話後續內容。','Chinese source: the user-supplied Gratitude.docx, preserved in text order. English: paragraph-by-paragraph translations retaining the source’s symbolic expressions and claims. Where botanical species are unspecified, no species is inferred; for example, 紫草 is rendered as zicao. Small actions, the home page, and philosophical readings are additions for this app, not the later content of the original conversation.')}${claim()}${dual('脈輪、能量與頻率以來源中的象徵語言呈現。本 App 不將這些敘述、營養素表格或哲學視角當作已驗證的生理機制；也未以「前沿科學」名義添加未經支持的療效。','Chakra, energy, and frequency expressions are presented as the source’s symbolic language. This app does not treat those descriptions, nutrient tables, or philosophical lenses as verified physiological mechanisms, and adds no unsupported therapeutic claims under the label of frontier science.')}<a href="https://chatgpt.com/c/6ad294b2-27fc-83ec-a586-f46fd67bb15a" target="_blank" rel="noopener">${ui('開啟原始對話（需相應存取權）','Open original conversation (access required)')} ↗</a></section><section class="root-section"><h2 class="page-title">${ui('備份我的紀錄','Back up my records')}</h2><p>${ui('收藏、進度與筆記保存在此瀏覽器；清除網站資料會移除紀錄。你可以下載備份。','Saved entries, progress, and notes live in this browser. Clearing site data removes them. You can download a backup.')}</p><button class="outline" id="export-all">${ui('下載完整備份','Download full backup')}</button></section>`}
let route='home', openDay=null;
function render(){route=location.hash.slice(1)||'home';if(!names[route])route='home';document.body.className='view-'+lang;document.documentElement.lang=lang==='en'?'en':'zh-Hant';$('#lang').value=lang;$('#nav').innerHTML=Object.entries(names).map(([k,v],i)=>`<a href="#${k}" class="${route===k?'active':''}" ${route===k?'aria-current="page"':''}><span class="nav-icon">${icons[i]}</span>${ui(...v)}</a>`).join('');$('#breadcrumb').textContent=ui(...names[route]);$('#main').innerHTML=({home,practice,quotes,language:languagePage,root,journal,archive,about}[route])();document.querySelectorAll('[data-zh]').forEach(el=>el.textContent=ui(el.dataset.zh,el.dataset.en));updateCount();if(openDay&&route==='practice'){document.getElementById('day-'+openDay)?.scrollIntoView({block:'start'});openDay=null}}
function updateCount(){let el=$('#result-count');if(el){let count=route==='archive'?$('#results').querySelectorAll('details').length:$('#results').querySelectorAll('.content-card').length;el.textContent=count+' '+ui('筆結果','results')}}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('visible');setTimeout(()=>$('#toast').classList.remove('visible'),2400)}
function persist(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{toast(ui('無法儲存；請檢查瀏覽器儲存空間。','Could not save. Check browser storage.'));return false}}
function download(name,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
document.addEventListener('click',async e=>{let el=e.target.closest('button,[data-root]');if(!el)return;let d=el.dataset;if(d.done){let next=done.includes(d.done)?done.filter(x=>x!==d.done):[...done,d.done];if(persist('gratitude-done',next)){done=next;let y=scrollY;render();scrollTo(0,y);toast(ui('練習進度已更新','Practice progress updated'))}}if(d.save){let k=Number(d.save),next=saved.includes(k)?saved.filter(x=>x!==k):[...saved,k];if(persist('gratitude-saved',next)){saved=next;let y=scrollY;render();scrollTo(0,y)}}if(d.copy){try{await navigator.clipboard.writeText(d.copy.split(',').map(i=>SOURCE[i].zh+'\n\n'+SOURCE[i].en).join('\n\n'));toast(ui('已複製中英對照','Bilingual text copied'))}catch{toast(ui('無法自動複製，請選取文字複製。','Copy unavailable. Select the text to copy.'))}}if(d.course){course=d.course;filter='all';render()}if(d.filter){filter=d.filter;render()}if(d.quote){filter=d.quote;render()}if(d.archive){filter=d.archive;render()}if(d.openDay){course='30';filter='all';query='';openDay=Number(d.openDay);if(location.hash==='#practice')render();else location.hash='practice'}if(d.root){e.preventDefault();document.getElementById(d.root).scrollIntoView({behavior:'smooth',block:'start'})}if(el.id==='export-notes')download('gratitude-notes.txt',read('gratitude-journal',''),'text/plain;charset=utf-8');if(el.id==='export-all')download('gratitude-backup.json',JSON.stringify({version:1,exportedAt:new Date().toISOString(),done,saved,journal:read('gratitude-journal','')},null,2),'application/json')});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;$('#results').innerHTML=({practice:practiceResults,quotes:quoteResults,language:languageResults,archive:archiveResults}[route])();updateCount()}if(e.target.id==='journal'){let ok=persist('gratitude-journal',e.target.value);$('#note-status').textContent=ok?ui('✓ 已儲存在此瀏覽器','✓ Saved in this browser'):ui('尚未儲存','Not saved')}});
$('#lang').addEventListener('change',e=>{lang=e.target.value;persist('gratitude-lang',lang);render()});
window.addEventListener('hashchange',()=>{filter='all';query='';scrollTo(0,0);render()});
render();
</script></body></html>
