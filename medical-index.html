<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字根字首字尾學習系統｜醫學英文200核心</title>
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@3.10.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e1117;color:#e8edf5;font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;min-height:100vh;padding:1rem}
.container{max-width:820px;margin:0 auto}
header{text-align:center;padding:1.5rem 0 1rem;border-bottom:1px solid #2A3A4A;margin-bottom:1.5rem}
header h1{font-size:22px;color:#D4A017;font-weight:700}
header p{font-size:13px;color:#7A8A9A;margin-top:4px}
.tabs{display:flex;gap:6px;margin-bottom:1.5rem;flex-wrap:wrap}
.tab-btn{padding:8px 16px;border:1px solid #2A3A4A;border-radius:8px;background:transparent;color:#7A8A9A;cursor:pointer;font-size:13px;transition:all .15s}
.tab-btn.active{background:#534AB7;color:#EEEDFE;border-color:#534AB7}
.tab-btn:hover:not(.active){border-color:#D4A017;color:#D4A017}
.filter-row{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.filter-chip{padding:5px 12px;border-radius:20px;border:1px solid #2A3A4A;background:transparent;cursor:pointer;font-size:12px;color:#7A8A9A;transition:all .15s}
.filter-chip.on{background:#D4A017;color:#0e1117;border-color:#D4A017;font-weight:600}
.search-box{flex:1;min-width:160px;padding:8px 12px;border:1px solid #2A3A4A;border-radius:8px;background:#111827;color:#e8edf5;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.root-card{background:#111827;border:1px solid #2A3A4A;border-radius:12px;padding:14px;cursor:pointer;transition:all .15s;position:relative}
.root-card:hover{border-color:#D4A017;background:#1E2A3A}
.root-card.known{border-left:3px solid #1D9E75}
.root-card.learning{border-left:3px solid #EF9F27}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;margin-bottom:6px}
.badge.organ{background:#0D2A3E;color:#60A5FA}
.badge.immune{background:#1E1040;color:#A78BFA}
.badge.biochem{background:#0D2A14;color:#6EE7B7}
.badge.clinical{background:#2A1A00;color:#FCD34D}
.badge.prefix{background:#2A0A14;color:#F9A8D4}
.badge.suffix{background:#003A28;color:#6EE7B7}
.root-title{font-size:18px;font-weight:700;color:#D4A017;letter-spacing:1px}
.root-meaning{font-size:13px;color:#7A8A9A;margin-top:2px}
.root-example{font-size:11px;color:#3B82F6;margin-top:6px}
.stars{font-size:10px;color:#EF9F27;margin-top:4px}
.status-dot{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;background:#2A3A4A}
.status-dot.known{background:#1D9E75}
.status-dot.learning{background:#EF9F27}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#111827;border-radius:16px;width:min(580px,95vw);max-height:85vh;overflow-y:auto;padding:1.5rem;border:1px solid #2A3A4A}
.modal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem}
.modal-root{font-size:30px;font-weight:700;color:#D4A017;letter-spacing:2px}
.modal-meaning{font-size:16px;color:#7A8A9A}
.memory-box{background:rgba(212,160,23,.08);border:1px solid rgba(212,160,23,.25);border-radius:10px;padding:12px 16px;margin:12px 0;font-size:14px;color:#D4B870;line-height:1.7}
.deriv-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.deriv-table th{text-align:left;padding:6px 8px;color:#7A8A9A;font-weight:500;border-bottom:1px solid #2A3A4A}
.deriv-table td{padding:8px;border-bottom:1px solid #1E2A3A;vertical-align:top}
.deriv-word{font-weight:600;color:#e8edf5}
.deriv-ipa{color:#3B82F6;font-size:11px}
.deriv-zh{color:#7A8A9A}
.deriv-mem{color:#906030;font-size:11px;line-height:1.5}
.modal-actions{display:flex;gap:8px;margin-top:1.2rem;flex-wrap:wrap}
.btn-known{padding:8px 18px;background:#0F6E56;color:#E1F5EE;border:none;border-radius:8px;cursor:pointer;font-size:13px}
.btn-learning{padding:8px 18px;background:#BA7517;color:#FAEEDA;border:none;border-radius:8px;cursor:pointer;font-size:13px}
.btn-close{padding:8px 18px;background:#1E2A3A;color:#e8edf5;border:1px solid #2A3A4A;border-radius:8px;cursor:pointer;font-size:13px}
.quiz-area{max-width:560px;margin:0 auto}
.quiz-card{background:#111827;border:1px solid #2A3A4A;border-radius:16px;padding:2rem;text-align:center;margin-bottom:1rem}
.quiz-q{font-size:34px;font-weight:700;color:#D4A017;letter-spacing:3px;margin-bottom:.5rem}
.quiz-sub{font-size:14px;color:#7A8A9A;margin-bottom:1.5rem}
.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.2rem}
.quiz-opt{padding:12px;border:1px solid #2A3A4A;border-radius:8px;background:#111827;color:#e8edf5;cursor:pointer;font-size:14px;transition:all .15s}
.quiz-opt:hover:not(:disabled){background:#1E2A3A}
.quiz-opt.correct{background:#0F6E56;color:#E1F5EE;border-color:#1D9E75}
.quiz-opt.wrong{background:#7A1515;color:#FCEBEB;border-color:#E24B4A}
.quiz-opt:disabled{cursor:default}
.quiz-stats{display:flex;gap:20px;justify-content:center;margin-bottom:1rem;font-size:13px;color:#7A8A9A}
.quiz-stat-val{font-size:22px;font-weight:700;color:#e8edf5}
.progress-bar{height:5px;background:#1E2A3A;border-radius:3px;margin-bottom:1.5rem;overflow:hidden}
.progress-fill{height:100%;background:#534AB7;border-radius:3px;transition:width .3s}
.next-btn{padding:10px 28px;background:#534AB7;color:#EEEDFE;border:none;border-radius:8px;cursor:pointer;font-size:14px;display:none}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:1.5rem}
.stat-card{background:#111827;border-radius:8px;padding:14px;text-align:center}
.stat-val{font-size:24px;font-weight:700;color:#e8edf5}
.stat-label{font-size:12px;color:#7A8A9A;margin-top:4px}
.prog-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px}
.prog-label{min-width:80px;color:#7A8A9A}
.prog-track{flex:1;height:8px;background:#1E2A3A;border-radius:4px;overflow:hidden}
.prog-bar{height:100%;border-radius:4px;transition:width .5s}
.empty{text-align:center;padding:3rem 1rem;color:#7A8A9A;font-size:14px}
.ipa-text{color:#3B82F6;font-size:12px;margin-top:4px}
.sec-hdr{font-size:13px;color:#7A8A9A;margin-bottom:.8rem;border-bottom:1px solid #2A3A4A;padding-bottom:.5rem}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>📚 醫學字根字首字尾學習系統</h1>
  <p>醫學英文200核心結構大全・第1~6冊｜40+ 字根・25字首・25字尾</p>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('browse')"><i class="ti ti-cards"></i> 字根瀏覽</button>
  <button class="tab-btn" onclick="showTab('quiz')"><i class="ti ti-brain"></i> 測驗練習</button>
  <button class="tab-btn" onclick="showTab('progress')"><i class="ti ti-chart-bar"></i> 學習進度</button>
</div>

<div id="tab-browse">
  <div class="filter-row">
    <input class="search-box" placeholder="搜尋字根..." oninput="filterCards()" id="searchInput">
    <span class="filter-chip on" onclick="toggleFilter(this,'all')">全部</span>
    <span class="filter-chip" onclick="toggleFilter(this,'organ')">器官字根</span>
    <span class="filter-chip" onclick="toggleFilter(this,'immune')">免疫/腫瘤</span>
    <span class="filter-chip" onclick="toggleFilter(this,'biochem')">生化代謝</span>
    <span class="filter-chip" onclick="toggleFilter(this,'clinical')">臨床字根</span>
    <span class="filter-chip" onclick="toggleFilter(this,'prefix')">字首</span>
    <span class="filter-chip" onclick="toggleFilter(this,'suffix')">字尾</span>
  </div>
  <div class="grid" id="cardsGrid"></div>
</div>

<div id="tab-quiz" style="display:none">
  <div class="quiz-area">
    <div class="filter-row" style="justify-content:center;margin-bottom:1.5rem">
      <span class="filter-chip on" onclick="setQuizMode(this,'all')">全部</span>
      <span class="filter-chip" onclick="setQuizMode(this,'organ')">器官</span>
      <span class="filter-chip" onclick="setQuizMode(this,'prefix')">字首</span>
      <span class="filter-chip" onclick="setQuizMode(this,'suffix')">字尾</span>
      <span class="filter-chip" onclick="setQuizMode(this,'5star')">★★★★★</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="qProgress" style="width:0%"></div></div>
    <div class="quiz-stats">
      <div style="text-align:center"><div class="quiz-stat-val" id="qCorrect">0</div><div>答對</div></div>
      <div style="text-align:center"><div class="quiz-stat-val" id="qWrong">0</div><div>答錯</div></div>
      <div style="text-align:center"><div class="quiz-stat-val" id="qTotal">0</div><div>已答</div></div>
    </div>
    <div class="quiz-card" id="quizCard">
      <div class="quiz-q" id="quizQ">-</div>
      <div class="quiz-sub">這個字根/字首/字尾是什麼意思？</div>
      <div class="quiz-options" id="quizOpts"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQuestion()">下一題 →</button>
    </div>
    <div style="text-align:center"><button class="btn-close" onclick="startQuiz()">重新開始</button></div>
  </div>
</div>

<div id="tab-progress" style="display:none">
  <div class="sec-hdr">📊 學習統計</div>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-val" id="statTotal">0</div><div class="stat-label">字根總數</div></div>
    <div class="stat-card"><div class="stat-val" id="statKnown" style="color:#1D9E75">0</div><div class="stat-label">已掌握</div></div>
    <div class="stat-card"><div class="stat-val" id="statLearning" style="color:#EF9F27">0</div><div class="stat-label">學習中</div></div>
    <div class="stat-card"><div class="stat-val" id="statPct">0%</div><div class="stat-label">掌握率</div></div>
  </div>
  <div class="sec-hdr">各分類進度</div>
  <div class="prog-row"><span class="prog-label">器官字根</span><div class="prog-track"><div class="prog-bar" id="pb-organ" style="background:#3B82F6;width:0%"></div></div><span id="pt-organ">0%</span></div>
  <div class="prog-row"><span class="prog-label">免疫/腫瘤</span><div class="prog-track"><div class="prog-bar" id="pb-immune" style="background:#8B5CF6;width:0%"></div></div><span id="pt-immune">0%</span></div>
  <div class="prog-row"><span class="prog-label">生化代謝</span><div class="prog-track"><div class="prog-bar" id="pb-biochem" style="background:#22C55E;width:0%"></div></div><span id="pt-biochem">0%</span></div>
  <div class="prog-row"><span class="prog-label">臨床字根</span><div class="prog-track"><div class="prog-bar" id="pb-clinical" style="background:#F59E0B;width:0%"></div></div><span id="pt-clinical">0%</span></div>
  <div class="prog-row"><span class="prog-label">字首</span><div class="prog-track"><div class="prog-bar" id="pb-prefix" style="background:#EC4899;width:0%"></div></div><span id="pt-prefix">0%</span></div>
  <div class="prog-row"><span class="prog-label">字尾</span><div class="prog-track"><div class="prog-bar" id="pb-suffix" style="background:#14B8A6;width:0%"></div></div><span id="pt-suffix">0%</span></div>
</div>
</div>

<div class="modal-overlay" id="modal" onclick="closeModal(event)">
<div class="modal" id="modalBox">
  <div class="modal-header">
    <div>
      <div class="modal-root" id="mRoot">-</div>
      <div class="modal-meaning" id="mMeaning">-</div>
      <div class="ipa-text" id="mIpa"></div>
    </div>
    <button class="btn-close" onclick="closeModalDirect()">✕</button>
  </div>
  <div class="memory-box" id="mMemory"></div>
  <table class="deriv-table">
    <thead><tr><th>單字</th><th>音標</th><th>中文</th><th>連鎖記憶</th></tr></thead>
    <tbody id="mDerivs"></tbody>
  </table>
  <div class="modal-actions">
    <button class="btn-known" onclick="markStatus('known')">✅ 已掌握</button>
    <button class="btn-learning" onclick="markStatus('learning')">⏳ 學習中</button>
    <button class="btn-close" onclick="closeModalDirect()">關閉</button>
  </div>
</div>
</div>

let userStatus={};
try{const s=localStorage.getItem('med_root_status');if(s)userStatus=JSON.parse(s);}catch(e){}
function saveStatus(){try{localStorage.setItem('med_root_status',JSON.stringify(userStatus));}catch(e){}}

let currentFilter='all';
let quizMode='all';
let quizPool=[];
let quizIdx=0;
let qCorrect=0,qWrong=0;
let currentCard=null;

function getStatus(id){return userStatus[id]||''}
function renderGrid(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  const grid=document.getElementById('cardsGrid');
  const filtered=DATA.filter(d=>{
    const catOk=currentFilter==='all'||d.cat===currentFilter;
    const qOk=!q||d.root.toLowerCase().includes(q)||d.zh.includes(q)||d.example.toLowerCase().includes(q);
    return catOk&&qOk;
  });
  if(!filtered.length){grid.innerHTML='<div class="empty">找不到符合的字根</div>';return;}
  grid.innerHTML=filtered.map(d=>{
    const s=getStatus(d.id);
    const stars='★'.repeat(d.stars)+'☆'.repeat(5-d.stars);
    return`<div class="root-card${s?' '+s:''}" onclick="openCard('${d.id}')">
      <div class="status-dot${s?' '+s:''}"></div>
      <div class="badge ${d.cat}">${catName(d.cat)}</div>
      <div class="root-title">${d.root}</div>
      <div class="root-meaning">${d.zh}</div>
      <div class="root-example">${d.example}</div>
      <div class="stars">${stars}</div>
    </div>`;
  }).join('');
}
function catName(c){return{organ:'器官字根',immune:'免疫/腫瘤',biochem:'生化代謝',clinical:'臨床字根',prefix:'字首',suffix:'字尾'}[c]||c}
function toggleFilter(el,cat){
  document.querySelectorAll('#tab-browse .filter-chip').forEach(e=>e.classList.remove('on'));
  el.classList.add('on');currentFilter=cat;renderGrid();
}
function filterCards(){renderGrid();}
function openCard(id){
  const d=DATA.find(x=>x.id===id);if(!d)return;
  currentCard=id;
  document.getElementById('mRoot').textContent=d.root;
  document.getElementById('mMeaning').textContent=d.zh;
  document.getElementById('mIpa').textContent=d.ipa;
  document.getElementById('mMemory').innerHTML='💡 '+d.memory;
  document.getElementById('mDerivs').innerHTML=d.derivs.map(([w,zh,ipa,mem])=>`<tr><td><div class="deriv-word">${w}</div><div class="deriv-ipa">${ipa}</div></td><td class="deriv-zh">${zh}</td><td colspan="2" class="deriv-mem">${mem}</td></tr>`).join('');
  document.getElementById('modal').classList.add('open');
}
function closeModal(e){if(e.target===document.getElementById('modal'))closeModalDirect();}
function closeModalDirect(){document.getElementById('modal').classList.remove('open');currentCard=null;}
function markStatus(s){
  if(!currentCard)return;
  userStatus[currentCard]=s;saveStatus();renderGrid();updateProgress();closeModalDirect();
}
function showTab(t){
  ['browse','quiz','progress'].forEach(x=>document.getElementById('tab-'+x).style.display=x===t?'':'none');
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',['browse','quiz','progress'][i]===t));
  if(t==='quiz')startQuiz();if(t==='progress')updateProgress();
}
function setQuizMode(el,mode){
  document.querySelectorAll('#tab-quiz .filter-chip').forEach(e=>e.classList.remove('on'));
  el.classList.add('on');quizMode=mode;startQuiz();
}
function startQuiz(){
  quizPool=[...DATA.filter(d=>quizMode==='all'||(quizMode==='5star'&&d.stars===5)||d.cat===quizMode)].sort(()=>Math.random()-.5);
  quizIdx=0;qCorrect=0;qWrong=0;updateQuizStats();
  if(!quizPool.length){document.getElementById('quizCard').innerHTML='<div class="empty">此分類沒有資料</div>';return;}
  showQuestion();
}
function showQuestion(){
  if(quizIdx>=quizPool.length){
    const pct=Math.round(qCorrect/(qCorrect+qWrong)*100)||0;
    document.getElementById('quizCard').innerHTML=`<div style="font-size:40px;margin-bottom:.5rem">🎉</div><div style="font-size:20px;font-weight:700;color:#D4A017;margin-bottom:.5rem">本輪結束！</div><div style="font-size:14px;color:#7A8A9A">答對率 ${pct}% (${qCorrect}/${qCorrect+qWrong})</div>`;
    document.getElementById('qProgress').style.width='100%';return;
  }
  const d=quizPool[quizIdx];
  document.getElementById('quizQ').textContent=d.root;
  document.getElementById('qProgress').style.width=Math.round(quizIdx/quizPool.length*100)+'%';
  const wrongs=DATA.filter(x=>x.id!==d.id).sort(()=>Math.random()-.5).slice(0,3);
  const opts=[d,...wrongs].sort(()=>Math.random()-.5);
  document.getElementById('quizOpts').innerHTML=opts.map((o,i)=>`<button class="quiz-opt" onclick="checkAnswer('${o.id}','${d.id}',${i})">${o.zh}</button>`).join('');
  document.getElementById('nextBtn').style.display='none';
}
function checkAnswer(chosen,correct,idx){
  document.querySelectorAll('.quiz-opt').forEach(b=>b.disabled=true);
  const btns=document.querySelectorAll('.quiz-opt');
  if(chosen===correct){qCorrect++;btns[idx].classList.add('correct');}
  else{qWrong++;btns[idx].classList.add('wrong');
    btns.forEach(b=>{if(b.textContent===DATA.find(x=>x.id===correct).zh)b.classList.add('correct');});
  }
  updateQuizStats();document.getElementById('nextBtn').style.display='inline-block';
}
function nextQuestion(){quizIdx++;showQuestion();}
function updateQuizStats(){
  document.getElementById('qCorrect').textContent=qCorrect;
  document.getElementById('qWrong').textContent=qWrong;
  document.getElementById('qTotal').textContent=qCorrect+qWrong;
}
function updateProgress(){
  const total=DATA.length;
  const known=Object.values(userStatus).filter(v=>v==='known').length;
  const learning=Object.values(userStatus).filter(v=>v==='learning').length;
  document.getElementById('statTotal').textContent=total;
  document.getElementById('statKnown').textContent=known;
  document.getElementById('statLearning').textContent=learning;
  document.getElementById('statPct').textContent=Math.round(known/total*100)+'%';
  const cats=['organ','immune','biochem','clinical','prefix','suffix'];
  cats.forEach(c=>{
    const items=DATA.filter(d=>d.cat===c);
    const k=items.filter(d=>userStatus[d.id]==='known').length;
    const pct=Math.round(k/items.length*100);
    document.getElementById('pb-'+c).style.width=pct+'%';
    document.getElementById('pt-'+c).textContent=pct+'%';
  });
}
renderGrid();
</script>
</body>
