    else line = test;
  });
  if(line.trim()) out.push(line.replace(/\s+$/, ''));
  return out;
}
function wrap(c, text, maxW){
  var out = [];
  text.split('\n').forEach(function(par){
    if(!par.trim()){ out.push(''); return; }
    var ls = wrapPar(c, par, maxW);
    if(ls.length > 1 && ls.length <= 6)                 // 短段落：縮窄行寬讓各行長度平均，避免最後一行只剩一兩個字
      for(var w = maxW * .5; w < maxW; w += maxW * .04){ var t = wrapPar(c, par, w); if(t.length === ls.length){ ls = t; break; } }
    out = out.concat(ls);
  });
  return out;
}
function blockH(lines, lh){ return lines.reduce(function(a, l){ return a + (l ? lh : lh * .5); }, 0); }

var cst = load('reader.card'); if(!(cst.theme >= 0 && cst.theme < THEMES.length)) cst.theme = 0; cst.ratio = cst.ratio || 'p'; cst.lang = cst.lang || 'both';
var cardBtn = null, ZF = '"Noto Serif TC","Source Han Serif TC","Microsoft JhengHei","PingFang TC",sans-serif', EF = 'Georgia,"Times New Roman",serif';

function drawCard(){
  var cv = $('cv'), W = 1080, H = cst.ratio === 's' ? 1080 : 1350; cv.width = W; cv.height = H;
  var c = cv.getContext('2d'), th = THEMES[cst.theme]; c.save(); th.draw(c, W, H); c.restore();
  var zh = cst.lang === 'en' ? '' : $('czh').value.trim(), en = cst.lang === 'zh' ? '' : $('cen').value.trim();
  if(!zh && !en) zh = $('czh').value.trim() || $('cen').value.trim();
  var px = 84, top = cst.ratio === 's' ? 96 : 130, bottom = H - (cst.ratio === 's' ? 150 : 200), boxW = W - px * 2, innerW = boxW - 110, head = 104, availH = bottom - top - head - 56;
  var base = zh.length <= 24 ? 78 : zh.length <= 70 ? 62 : 54, eb = zh ? 33 : 50, zs, es, zl, el, gap, total;
  for(var s = 1; s > .28; s -= .04){
    zs = Math.max(22, Math.round(base * s)); es = Math.max(17, Math.round(eb * s));
    c.font = '700 ' + zs + 'px ' + ZF; zl = zh ? wrap(c, zh, innerW) : [];
    c.font = 'italic ' + es + 'px ' + EF; el = en ? wrap(c, en, innerW) : [];
    gap = zl.length && el.length ? Math.max(44, zs * 1.1) : 0;
    total = blockH(zl, zs * 1.55) + gap + blockH(el, es * 1.45);
    if(total <= availH) break;
  }
  if(th.panel){ c.fillStyle = th.panel; rrect(c, px, top, boxW, bottom - top, 30); c.fill(); }
  c.textBaseline = 'middle'; c.textAlign = 'center'; c.fillStyle = th.acc;
  c.font = '700 25px "Microsoft JhengHei","PingFang TC",sans-serif'; c.fillText('心 靈 雞 湯　·　D A I L Y   W I S D O M', W / 2, top + 58);
  c.globalAlpha = .5; c.fillRect(W / 2 - 150, top + 88, 300, 2); c.globalAlpha = 1;
  if(th.shadow){ c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = 8; c.shadowOffsetY = 2; }
  var y = top + head + (availH - total) / 2 + 20;
  function lines(arr, size, lh, font, alpha){
    var left = arr.length > 8; c.font = font; c.fillStyle = th.ink; c.globalAlpha = alpha; c.textAlign = left ? 'left' : 'center';
    arr.forEach(function(l){ var h = l ? lh : lh * .5; if(l) c.fillText(l, left ? px + 55 : W / 2, y + h / 2); y += h; });
    c.globalAlpha = 1;
  }
  lines(zl, zs, zs * 1.55, '700 ' + zs + 'px ' + ZF, 1);
  if(gap){ c.save(); c.shadowColor = 'transparent'; c.fillStyle = th.acc; c.fillRect(W / 2 - 40, y + gap / 2 - 2, 80, 4); c.restore(); y += gap; }
  lines(el, es, es * 1.45, 'italic ' + es + 'px ' + EF, .92);
  var sig = $('csig').value.trim();
  if(sig){
    c.textAlign = 'center'; c.fillStyle = th.foot; c.font = '700 30px ' + ZF;
    if(th.foot === '#fff'){ c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = 10; }
    c.fillText('— ' + sig + ' —', W / 2, bottom + (H - bottom) / 2 - 6);
  }
  c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0;
}

function syncCardUi(){
  var sw = $('cth').children; for(var i = 0; i < sw.length; i++) sw[i].classList.toggle('on', i === cst.theme);
  var bs = $('copt').querySelectorAll('button'); for(var j = 0; j < bs.length; j++) bs[j].classList.toggle('on', cst[bs[j].dataset.k] === bs[j].dataset.v);
  store('reader.card', JSON.stringify(cst));
}
function openCard(btn){
  cardBtn = btn;
  var t = cardText(books[cur].by[btn.dataset.c], +btn.dataset.r || 0);
  $('czh').value = t.zh; $('cen').value = t.en;
  $('csig').value = store('reader.sig') || '《' + books[cur].title + '》';
  $('cmsg').textContent = t.en ? '' : '此則沒有內建英文，可自行輸入'; $('cpost').style.display = 'none';
  $('card').classList.add('open'); syncCardUi(); drawCard();
}
function closeCard(){ $('card').classList.remove('open'); $('cpost').style.display = 'none'; }
function stepCard(d){
  var list = Array.prototype.filter.call($('content').querySelectorAll('.cd'), function(e){ return e.offsetParent; });
  var n = list[list.indexOf(cardBtn) + d]; if(!n) return;
  openCard(n); n.scrollIntoView({block: 'center'});
}
function postText(){
  var zh = $('czh').value.trim(), en = $('cen').value.trim(), sig = $('csig').value.trim();
  return '🌿 ' + zh + (en ? '\n\n' + en : '') + (sig ? '\n\n— ' + sig : '') + '\n\n#心靈雞湯 #每日一句 #人生智慧 #自我成長 #DailyWisdom #LifeQuotes #SelfGrowth';
}
function flashMsg(m){ $('cmsg').textContent = m; setTimeout(function(){ if($('cmsg').textContent === m) $('cmsg').textContent = ''; }, 2500); }

THEMES.forEach(function(t, i){ var b = document.createElement('button'); b.className = 'sw'; b.title = t.n; b.style.background = t.sw; b.dataset.t = i; $('cth').appendChild(b); });
$('cth').addEventListener('click', function(e){ var b = e.target.closest('.sw'); if(!b) return; cst.theme = +b.dataset.t; syncCardUi(); drawCard(); });
$('copt').addEventListener('click', function(e){ var b = e.target.closest('button'); if(!b) return; cst[b.dataset.k] = b.dataset.v; syncCardUi(); drawCard(); });
$('czh').addEventListener('input', drawCard); $('cen').addEventListener('input', drawCard);
$('csig').addEventListener('input', function(){ store('reader.sig', this.value.trim() === '《' + books[cur].title + '》' ? '' : this.value.trim()); drawCard(); });
$('cx').addEventListener('click', closeCard);
$('card').addEventListener('click', function(e){ if(e.target === this) closeCard(); });
$('cprev').addEventListener('click', function(){ stepCard(-1); }); $('cnext').addEventListener('click', function(){ stepCard(1); });
$('cdl').addEventListener('click', function(){
  var name = '心靈雞湯_' + books[cur].title + '_' + cardBtn.dataset.c + (cardBtn.dataset.r ? '-' + cardBtn.dataset.r : '') + '.png';
  $('cv').toBlob(function(blob){
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000); flashMsg('已下載 ' + name);
  }, 'image/png');
});
$('ccp').addEventListener('click', function(){
  var text = postText();
  function fallback(){                                  // 瀏覽器不給自動複製時：顯示貼文並全選，按 Ctrl+C 即可
    var t = $('cpost'); t.style.display = 'block'; t.value = text; t.focus(); t.select(); var ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){}
    if(ok){ t.style.display = 'none'; flashMsg('貼文已複製'); } else flashMsg('已全選貼文，請按 Ctrl+C 複製');
  }
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){ flashMsg('貼文已複製'); }, fallback); else fallback();
});

/* ---------- 每頁的臉書心靈雞湯文 ---------- */
var curPost = -1;
function countPost(){ $('pmsg').textContent = '約 ' + $('ptx').value.replace(/\s/g, '').length + ' 字'; }
function openPost(si){
  var p = postOf(cur, si); if(!p) return;
  curPost = si;
  $('ptitle').textContent = '臉書雞湯文・' + books[cur].secs[si].label;
  $('ptx').value = p.t + '\n\n' + p.x + '\n\n— 《' + books[cur].title + '》\n\n#心靈雞湯 #更新 #智慧 #能力 #人生智慧 #自我成長';
  $('post').classList.add('open'); $('ptx').scrollTop = 0; countPost();
}
function closePost(){ $('post').classList.remove('open'); }
function stepPost(d){ var n = curPost + d; if(!postOf(cur, n)) return; openPost(n); var el = $('s-' + n); if(el) el.scrollIntoView(); }
$('ptx').addEventListener('input', countPost);
$('px').addEventListener('click', closePost);
$('post').addEventListener('click', function(e){ if(e.target === this) closePost(); });
$('pprev').addEventListener('click', function(){ stepPost(-1); }); $('pnext').addEventListener('click', function(){ stepPost(1); });
$('pcp').addEventListener('click', function(){
  var t = $('ptx');
  function done(ok){ $('pmsg').textContent = ok ? '貼文已複製' : '已全選，請按 Ctrl+C 複製'; setTimeout(countPost, 2500); }
  function fallback(){ t.focus(); t.select(); var ok = false; try{ ok = document.execCommand('copy'); }catch(e){} done(ok); }
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(function(){ done(true); }, fallback); else fallback();
});
$('pdl').addEventListener('click', function(){
  var a = document.createElement('a'), name = '雞湯文_' + books[cur].title + '_' + books[cur].secs[curPost].label.replace(/[\\/:*?"<>|]/g, '') + '.txt';
  a.href = URL.createObjectURL(new Blob(['\ufeff' + $('ptx').value.replace(/\n/g, '\r\n')], {type: 'text/plain;charset=utf-8'}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  $('pmsg').textContent = '已下載 ' + name; setTimeout(countPost, 2500);
});

/* ---------- 外觀設定 ---------- */
var fs = +store('reader.fs') || 17;
function applyFs(){ document.documentElement.style.setProperty('--fs', fs + 'px'); store('reader.fs', fs); }
$('fm').addEventListener('click', function(){ fs = Math.max(13, fs - 1); applyFs(); });
$('fp').addEventListener('click', function(){ fs = Math.min(26, fs + 1); applyFs(); });
var theme = store('reader.theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
function applyTheme(){ document.documentElement.setAttribute('data-theme', theme); store('reader.theme', theme); }
$('th').addEventListener('click', function(){ theme = theme === 'dark' ? 'light' : 'dark'; applyTheme(); });
applyFs(); applyTheme();

var last = store('reader.book'), start = 0;
books.forEach(function(b, i){ if(b.id === last) start = i; });
if(books.length) openBook(start); else renderNav();
})();
</script>
