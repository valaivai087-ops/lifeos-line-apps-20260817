<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>五臟經絡與情緒</title>
<style>
:root{--bg:#f6f3ec;--card:#fffdf8;--ink:#2b2a26;--sub:#6d6a61;--line:#e2dccd;--acc:#3f7a5c;--acc2:#e8f1ea;--warn:#8a5a14;--warnbg:#fbf1dc}
@media(prefers-color-scheme:dark){:root{--bg:#1b1c1a;--card:#252724;--ink:#ecebe5;--sub:#a5a39a;--line:#3a3d38;--acc:#7fc29f;--acc2:#2c3a32;--warn:#f0c674;--warnbg:#3a3220}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 8px}
.top{display:flex;gap:12px;align-items:center;max-width:1100px;margin:0 auto}
h1{font-size:18px;margin:0;white-space:nowrap}
#q{flex:1;min-width:0;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:inherit}
#q:focus{outline:2px solid var(--acc);border-color:transparent}
nav{display:flex;gap:6px;overflow-x:auto;max-width:1100px;margin:8px auto 0;padding-bottom:4px}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--sub);padding:5px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
@media(prefers-color-scheme:dark){nav button.on{color:#12201a}}
main{max-width:1100px;margin:0 auto;padding:16px 16px 60px}
section{display:none}section.show{display:block}
h2{font-size:22px;margin:8px 0 4px}
h3{font-size:16px;margin:26px 0 10px;color:var(--acc);border-left:4px solid var(--acc);padding-left:10px}
.lead{color:var(--sub);margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h4{margin:0 0 6px;font-size:16px}
.card p{margin:4px 0;font-size:15px}
.card b.k{color:var(--acc);font-weight:600;margin-right:4px}
.tag{display:inline-block;font-size:12px;background:var(--acc2);color:var(--acc);border-radius:6px;padding:0 7px;margin-right:6px;vertical-align:1px}
.note{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 14px;margin:12px 0;font-size:15px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.flow span{background:var(--acc2);color:var(--acc);border-radius:8px;padding:4px 10px;font-size:14px}
.flow i{color:var(--sub);font-style:normal}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:560px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--acc2);color:var(--acc);white-space:nowrap}
tr:last-child td{border-bottom:0}
ol,ul{margin:6px 0;padding-left:22px}
.hide{display:none!important}
#none{display:none;text-align:center;color:var(--sub);padding:40px 0}
.q{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.q small{color:var(--sub);grid-column:1/-1}
.q input{grid-column:1/-1;width:100%;accent-color:var(--acc)}
.btn{margin-top:14px;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;cursor:pointer}
@media(prefers-color-scheme:dark){.btn{color:#12201a}}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:2px 0 8px}
.bar div{height:100%;background:var(--acc)}
.row{display:flex;gap:12px;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:5px}
.d{flex:none;width:70px;color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums}
.t{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere}
.tags{display:block;font-size:12px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font:inherit;font-size:13px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
</style>
</head>
<body>
<header>
  <div class="top"><h1>五臟經絡與情緒</h1><input id="q" type="search" placeholder="搜尋：耳鳴、肝經、焦慮、脾虛…" autocomplete="off"></div>
  <nav id="nav"></nav>
</header>
<main id="main"><div id="none">找不到符合的內容</div></main>
<script>
// ---------- 小工具 ----------
const T=(h,rows)=>'<div class="tw"><table><tr>'+h.split('|').map(x=>'<th>'+x+'</th>').join('')+'</tr>'+rows.map(r=>'<tr class="it">'+r.split('|').map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</table></div>';
const C=(t,b,tag)=>'<div class="card it"><h4>'+(tag?'<span class="tag">'+tag+'</span>':'')+t+'</h4>'+b+'</div>';
const P=(k,v)=>'<p><b class="k">'+k+'</b>'+v+'</p>';
const G=a=>'<div class="grid">'+a.join('')+'</div>';
const F=s=>'<div class="flow it">'+s.split('→').map(x=>'<span>'+x+'</span>').join('<i>→</i>')+'</div>';
const N=s=>'<div class="note it">'+s+'</div>';
const L=(a,o)=>'<'+(o?'ol':'ul')+'>'+a.map(x=>'<li class="it">'+x+'</li>').join('')+'</'+(o?'ol':'ul')+'>';

// ---------- 40 種病症 ----------
const D40=[
['一｜睡眠與神經系統',[
'01|入睡困難|躺下很久仍睡不著。|心經主神明、肝經主疏泄、心包經與情志調節相關。|壓力↑→警覺系統活躍→難以放鬆→入睡延遲。|固定起床時間、睡前降低刺激；慢性失眠可接受失眠認知行為治療。',
'02|多夢易醒|夜間反覆醒來，醒後常記得夢。|心經、肝經、脾經；傳統辨證可考慮心神不寧等型態。|壓力、酒精、呼吸障礙→睡眠中斷→更容易記得夢境。|睡前減少酒精與刺激、記錄夜醒、留意打鼾。',
'03|偏頭痛|反覆頭痛，可能伴隨噁心、怕光。|膽經、三焦經、肝經；傳統循行與頭側區域相關。|三叉神經血管系統活化→疼痛訊號增加→偏頭痛。|固定作息、記錄誘因、必要時接受預防及急性期治療。',
'04|肩頸緊繃|肩膀與脖子緊、痠、活動不舒服。|膀胱經、膽經、小腸經；傳統循行經過頸肩。|久坐＋肌肉持續用力＋壓力→肌肉疲勞→疼痛。|每30～60分鐘活動、調整姿勢、循序漸進肌力訓練。',
'05|手腳麻木|刺刺麻麻、感覺遲鈍或像觸電。|依麻木部位參考心包經、三焦經、脾經、胃經等。|神經壓迫、周邊神經病變或營養缺乏→神經訊號異常。|檢查血糖、B12與神經問題；突然單側麻木無力應立即119。']],
['二｜情緒與認知系統',[
'06|焦慮緊張|反覆擔心、坐立難安、身體緊繃。|心經、心包經、肝經；傳統重視心神與氣機。|威脅預測增加→交感神經活化→心跳加快、肌肉緊繃。|規律運動、慢呼吸、減少咖啡因，必要時心理治療。',
'07|容易發怒|容易被刺激、衝動說話或做決定。|肝經、膽經；傳統與疏泄及決斷相關。|壓力↑＋睡眠不足→情緒控制下降→反應過度。|情緒激動時延後決定、改善睡眠、每天規律活動。',
'08|腦霧注意力差|思考變慢、容易忘記、難以專心。|心經、脾經、腎經；傳統與神明、思慮及精氣相關。|睡眠不足、藥物、內分泌或疾病→認知效率下降。|排查睡眠、貧血、甲狀腺問題；一次處理一項工作。',
'09|情緒低落|心情低落、失去興趣、活動意願下降。|心經、肝經、肺經；傳統與情志、悲憂及氣機相關。|心理社會壓力＋睡眠及生理因素→情緒與動機改變。|維持日常活動與支持關係；持續兩週以上影響生活時就醫。',
'10|心悸|明顯感覺心跳快、亂跳或漏拍。|心經、心包經；傳統與心神、氣血相關。|咖啡因、壓力、甲狀腺異常或心律不整→心跳感增加。|記錄心跳與誘因，反覆發作應評估心電圖；合併胸痛昏厥立即就醫。']],
['三｜消化與腸道系統',[
'11|胃脹氣|吃完飯腹部鼓脹、不舒服。|胃經、脾經、肝經；傳統重視運化與氣機。|吞入空氣、食物發酵或胃腸動力改變→脹氣。|細嚼慢嚥、飯後散步、辨識不耐受食物。',
'12|胃食道逆流|火燒心、酸水逆流、胸口灼熱。|胃經、脾經、肝經；傳統可從胃氣上逆理解。|胃內容物逆流→刺激食道→灼熱、反酸。|睡前2～3小時避免大量進食，必要時接受醫療治療。',
'13|便秘|排便困難、糞便硬或次數減少。|大腸經、脾經、胃經；傳統重視腸道傳導與津液。|腸道蠕動慢、糞便水分少或排便協調異常→便秘。|逐步增加膳食纖維、適量飲水、規律活動。',
'14|腹瀉|排便變稀、水便或次數增加。|脾經、胃經、大腸經；傳統可考慮脾虛、濕熱等不同證型。|感染、食物不耐受或腸道功能異常→水分吸收不足。|補水與電解質；血便、脫水或持續惡化應就醫。',
'15|腸躁症|反覆腹痛，伴隨便秘、腹瀉或兩者交替。|肝經、脾經、大腸經；傳統常討論肝脾不調。|腸腦互動異常＋內臟敏感度提高→腹痛與排便改變。|記錄食物、壓力與排便；必要時接受專業飲食指導。']],
['四｜呼吸與免疫系統',[
'16|過敏性鼻炎|打噴嚏、流鼻水、鼻塞、鼻癢。|肺經、大腸經、膀胱經；傳統與肺衛及鼻竅相關。|過敏原接觸→免疫反應→鼻黏膜發炎。|減少過敏原暴露、適當鼻腔清潔及醫療治療。',
'17|氣喘|反覆喘鳴、咳嗽、胸悶或呼吸困難。|肺經、腎經、膀胱經；傳統有肺失宣降、腎不納氣等辨證。|氣道發炎＋支氣管過度反應→氣道變窄→呼吸不順。|遵照吸入藥物治療計畫、避開誘因；嚴重喘立即急救。',
'18|慢性咳嗽|成人咳嗽持續超過8週。|肺經、胃經、脾經；傳統可從肺氣失宣及痰濕等辨證。|鼻涕倒流、氣喘、胃食道逆流等→咳嗽反射受刺激。|查明原因，不只依靠止咳產品。',
'19|反覆口腔潰瘍|嘴巴反覆破洞、疼痛。|心經、胃經、脾經；傳統可能辨為實熱或虛火等。|局部免疫反應、摩擦或營養缺乏→黏膜受損。|避免刺激、檢查營養及其他病因；久不癒合需就醫。',
'20|容易疲勞|休息後仍容易累，活動耐受下降。|脾經、腎經、肺經；傳統可能涉及氣虛等證型。|睡眠問題、貧血、甲狀腺疾病或其他病因→體能下降。|先排查原因，再安排適當營養與活動。']],
['五｜皮膚與代謝系統',[
'21|青春痘|粉刺、丘疹、膿皰等毛囊皮脂腺發炎。|肺經、胃經、大腸經；傳統可從肺胃熱等辨證。|皮脂↑＋毛囊阻塞＋發炎→痘痘形成。|溫和清潔、避免擠壓、使用適當治療。',
'22|異位性皮膚炎|反覆乾燥、搔癢、皮膚發炎。|肺經、脾經、膀胱經；傳統重視皮毛、濕與皮膚表現。|皮膚屏障受損→水分流失→免疫發炎→搔抓→更受損。|每日保濕、避免刺激、依醫囑使用抗發炎藥物。',
'23|掉髮|頭髮變稀、掉髮增加或局部禿髮。|腎經、肝經、脾經；傳統與精血、營養運化相關。|遺傳、荷爾蒙、營養或疾病→毛囊週期改變。|確認掉髮類型，依原因治療，不盲目補鐵或補鋅。',
'24|水腫|腳踝、腿部或其他部位異常腫脹。|腎經、脾經、膀胱經；傳統與水液代謝相關。|靜脈回流、藥物或心腎肝疾病→組織液累積。|評估原因，不自行利尿；合併喘或胸痛立即就醫。',
'25|血糖波動|血糖偏高、偏低或起伏過大。|脾經、胃經、腎經；傳統消渴辨證涉及多種證型。|食物吸收＋胰島素作用＋活動與藥物→血糖變化。|規律飲食、運動、依醫囑監測血糖。']],
['六｜女性荷爾蒙與泌尿系統',[
'26|經前症候群|月經前出現情緒、乳脹、疲勞等不適。|肝經、脾經、腎經；傳統與沖任、氣血調節相關。|週期性荷爾蒙變化＋個體敏感性→經前症狀。|規律睡眠運動、記錄至少兩個月經週期。',
'27|經痛|月經期間下腹疼痛。|肝經、脾經、腎經；傳統可從氣滯血瘀等不同證型分析。|前列腺素增加→子宮收縮增加→疼痛。|熱敷、適當止痛；疼痛嚴重應排查婦科疾病。',
'28|更年期熱潮紅|突然發熱、流汗，可能影響睡眠。|腎經、肝經、三焦經；傳統常從腎陰陽變化辨證。|雌激素變化→體溫調節敏感→熱潮紅、夜汗。|調整睡眠環境、運動，症狀嚴重時討論醫療治療。',
'29|頻尿夜尿|白天頻繁排尿或夜間反覆起床上廁所。|腎經、膀胱經、三焦經；傳統與氣化及水液運行相關。|膀胱功能、夜間尿量、血糖或睡眠問題→頻尿。|記錄飲水、排尿時間及次數，評估病因。',
'30|反覆泌尿道感染|尿痛、尿急、頻尿，感染反覆發作。|膀胱經、腎經；傳統常從淋證、濕熱等辨證。|細菌進入泌尿道→繁殖→局部發炎。|尿液檢查、依醫囑治療；發燒合併腰痛需儘速就醫。']],
['七｜肌肉骨骼與循環系統',[
'31|下背痛|腰部痠痛、僵硬或活動受限。|膀胱經、腎經、膽經；傳統循行與腰背區域相關。|肌肉、關節、椎間盤或神經因素→疼痛。|避免長期臥床、適度活動、漸進肌力訓練。',
'32|膝蓋疼痛|膝關節活動疼痛、僵硬或腫脹。|胃經、脾經、膽經、膀胱經；依疼痛位置參考經絡循行。|關節負荷、肌力不足或發炎→膝痛。|強化腿部肌力、調整負荷、評估關節疾病。',
'33|足底筋膜疼痛|腳跟或足底疼痛，早晨第一步特別明顯。|腎經、膀胱經；傳統循行涉及足底與足跟。|足底筋膜承受反覆負荷→組織疼痛。|適當鞋具、足底與小腿伸展、漸進負重。',
'34|手腳冰冷|四肢末端容易感覺冰冷。|腎經、脾經、心經；傳統可考慮陽虛等不同證型。|環境低溫、血管收縮、貧血或循環問題→末梢溫度下降。|保暖、規律活動；若變白變紫或疼痛，需評估血管問題。',
'35|肌肉抽筋|肌肉突然不自主收縮，伴隨疼痛。|肝經、脾經、膀胱經；傳統與筋脈失養等辨證相關。|肌肉疲勞、神經興奮性變化、部分藥物或電解質異常→抽筋。|溫和伸展、檢查活動負荷、用藥與可能缺乏。']],
['八｜五官與感覺系統',[

'<h3>最重要的七條整合智慧</h3>'+L(['情緒不是敵人，而是值得理解的訊號；但情緒本身不能直接診斷器官疾病。','同一事件會因認知解讀不同而產生不同情緒，卻不表示所有疾病都源自想法。','身體狀態也會反過來影響情緒，因果經常是雙向的。','經絡可以作為傳統身心觀察的分類工具，但不能取代生理檢查。','「神、魂、魄、意、志」適合轉化成五種心理能力訓練，而不是當作五個可測量的器官。','改善健康不只靠知道更多理論，而要找到可改變的機制，並追蹤真實結果。','真正成熟的模型，必須允許醫學證據與生活經驗修正原本的解釋。'],1)+
'<h3>整套母體的最終公式</h3>'+F('外界事件→感覺與觀察→認知解讀→情緒生成→神經與生理反應→行為選擇→長期適應→症狀與生活結果→回饋→模型更新')+
'<p class="lead it">這條主線可以統一十二經絡、四十種病症、五臟情緒、五神能力與 LifeOS 行為改變系統。</p>'],

['EP01 三層模型',
'<h2>EP01｜物質、資訊、能量的三層模型</h2><p class="lead">可保留為傳統哲學框架，但要避免直接等同於現代物理學的能量或生理學的訊號。</p>'+
'<h3>講座原始框架</h3>'+T('層次|是什麼|對應|調理方式',['物質（陰）|看得見、摸得到的臟腑器官、食物、營養素|視覺、觸覺；西醫與營養學的強項|手術、物理治療、推拿、骨傷科','信息（陽）|看不見但感受得到的五味（酸苦甘辛鹹）、氣味、外在資訊|味覺、嗅覺；作用在<b>經絡</b>|抒發、精油、針灸','能量（陽）|四氣（寒熱溫涼），以體溫為指標|作用在<b>臟腑</b>|食物與溫度的選擇、用藥'])+
'<h3>與現代概念對照</h3>'+T('層次|講座觀點|現代可對照概念|重要界線',['物質層|器官、組織、食物|細胞、蛋白質、組織結構|可透過影像、血液、病理等檢查','資訊層|五味、氣味、情緒、經絡|感覺訊號、神經傳導、認知表徵|經絡尚未證實是獨立的資訊傳輸網路','能量層|寒熱溫涼、氣血運行|ATP代謝、熱調節、內分泌、自主神經|中醫的「氣」不能直接等同ATP或體溫'])+
'<h3>新增八個重要機制</h3>'+T('Node|現代機制|國小白話',['N01｜Sensory Input 感覺輸入|視覺、聽覺、觸覺等接收訊息|身體的接收器','N02｜Appraisal 認知評估|大腦判斷事情是否危險|替事情貼標籤','N03｜Prediction 預測|根據經驗預測下一步|大腦先猜答案','N04｜Autonomic Regulation 自主神經調節|調整心跳、呼吸、消化|身體自動控制器','N05｜HPA Axis 壓力荷爾蒙軸|下視丘—腦下垂體—腎上腺系統|壓力警報總部','N06｜Interoception 內感受|感知心跳、飢餓、胸悶等|聽見身體訊號','N07｜Allostasis 動態適應|身體因應需求調整運作|身體自動換檔','N08｜Allostatic Load 長期適應負荷|長期壓力調節可能累積代價|警報開太久，系統變累'])+
'<h3>情緒如何影響身體？</h3>'+G([C('外界事件',P('','被批評、工作壓力、家庭衝突'),'1'),C('認知解讀',P('','「他不尊重我」或「他正在提出不同意見」'),'2'),C('情緒與生理反應',P('','生氣、害怕 → 心跳、肌肉張力、壓力系統變化'),'3'),C('行為與長期回饋',P('','睡眠、飲食、活動、人際互動改變。反覆經驗可能強化原本的認知模式，也可以透過新經驗重新學習。'),'4')])+
N('<b>因果邊界：</b>壓力可能影響睡眠、消化、疼痛感受與部分疾病風險，但沒有證據支持所有瘜肉、肌瘤、腫瘤都必然依照「資訊失調→能量失調→器質病變」的順序生成。體溫低於36°C也不能單獨證明代謝不足，還需看測量位置、時間與其他症狀。')],

['EP02 十二經絡',
'<h2>EP02｜十二經絡 × 十二種情緒 × 現代機制</h2><p class="lead">依講座擴展的傳統詮釋索引，並非一種情緒只能對應一條經絡。</p>'+
T('經絡|講座情緒主題|可對照的現代心理機制|調養與能力訓練',['肺經|悲傷、悲觀|失落處理、哀傷調適|表達感受、維持連結','大腸經|固執、僵化|認知僵化、確認偏誤|練習第二種解釋','胃經|擔憂、焦慮|威脅預測、反覆擔心|限定擔憂時間','脾經|缺乏動力、軟弱|自我效能低、逃避|完成最小任務','心經|受傷、否認現實|自我防衛、情緒逃避|區分事實與評價','小腸經|敏感、多疑|威脅線索過度解讀|查核證據','膀胱經|意志不足|行為啟動困難|建立固定提示與習慣','腎經|恐懼、恐慌|威脅反應、不確定性焦慮|漸進面對安全的挑戰','心包經|壓抑、委屈|情緒抑制、需求未表達|練習清楚表達需求','三焦經|自我懷疑、批判|負向自我對話|自我同理、檢驗想法','膽經|過度反應|情緒反芻、過度警覺|中斷反芻、注意力轉移','肝經|憤怒|受阻目標、威脅評估|情緒命名、界線溝通'])+
'<h3>不是「情緒傷經絡」，而是找出六個可驗證的環節</h3>'+L(['<b>觸發：</b>發生了什麼事？','<b>表徵：</b>我把它解讀成什麼？','<b>預測：</b>我認為接下來會發生什麼？','<b>情緒：</b>我感受到什麼？','<b>行為：</b>我採取了什麼反應？','<b>回饋：</b>結果是否強化原來的想法？'],1)+
N('例如，反覆擔心並不代表胃經必然失調；但焦慮可能透過腸腦互動影響胃腸感受，也可能因為胃部不舒服反過來加重焦慮。')],

['EP03 五神',
'<h2>EP03｜五臟所藏的五神，轉成五種高階能力</h2><p class="lead">這一集最適合延伸成能力訓練母體。</p>'+
T('五神|傳統意義|現代功能類比|可訓練能力|每日練習',['心藏神|意識、精神活動|自我覺察、整合|看清事實|寫下事實與感受','肝藏魂|生命方向、精神活動|想像、未來模擬|創造可能性|想三種未來方案','肺藏魄|身體本能、感官反應|身體感知、防衛反應|覺察身體|身體掃描3分鐘','脾藏意|思考、意念|規劃、執行功能|把想法落地|完成一個小任務','腎藏志|意志、持續性|目標維持、自我調節|持續行動|執行一項固定習慣'])+
N('這是教育與心理能力的功能類比，不是「魂就是某個腦區」「魄就是免疫系統」的生物學結論。')+
'<h3>五神如何合作？</h3>'+G([C('神｜看見真實',P('','我現在知道什麼？')),C('魂｜生成可能',P('','還有哪些選擇？')),C('魄｜感受身體',P('','身體正在提醒什麼？')),C('意｜設計方法',P('','下一步怎麼做？')),C('志｜持續實踐',P('','我願意持續做什麼？')),C('回饋與更新',P('','真實結果與預測不同時，調整計畫'))])+
'<div class="card it" style="margin-top:12px"><p><b>直覺與分析不是敵人。</b>直覺能快速提供判斷線索，分析能幫助查核；重大決策需要兩者互相校正，而不是只憑感覺或只憑邏輯。</p></div>'],

['EP04 人格模式',
'<h2>EP04｜四種人格模式的正用、誤用與轉化</h2>'+
T('組合|正向能力|過度使用時的風險|新模式與槓桿',['心＋肝|謀略、創意、洞察|過度依靠他人實現目標|自己承擔可控制的行動','肝＋脾|思考、規劃、組織|控制他人、過度規劃|尊重自主、共同決策','脾＋肺|原則、理想、辨別|完美主義、批判|保留原則，也理解處境','心＋腎|勇氣、探索、決心|過度求穩或冒險|設定安全邊界後嘗試'])+
'<h3>四種誤用的生成機制</h3>'+G([
C('① 代償模式',P('生成','自己有未完成的願望→寄託於別人→別人不配合→失望或控制→關係緊張。')+P('轉化','分清楚「我的願望」與「別人的人生」。')),
C('② 控制模式',P('生成','害怕不確定→試圖控制每個細節→短暫安心→他人反抗→更加焦慮。')+P('轉化','從控制結果改為建立合作規則。')),
C('③ 批判模式',P('生成','理想標準過高→現實無法符合→反覆批評→行動減少→失望增加。')+P('轉化','從指出錯誤改為提出一個可執行的改善方案。')),
C('④ 安全依賴模式',P('生成','害怕失敗→避免嘗試→缺少成功經驗→自信不足→更加害怕。')+P('轉化','透過低風險的小實驗累積能力。'))])+
N('這些是可用於反思的行為模型，不能僅憑四種組合診斷人格。')],

['EP05 生活情境',
'<h2>EP05｜五大生活情境</h2>'+
T('情境|可能的深層機制|新行動',['父母控制孩子|父母焦慮→限制自主→衝突增加|提供選項、協商界線','工作成癮|工作成就可能被用來逃避其他壓力|設定休息、探索其他需求','節氣與飲食|氣候、日照、活動與飲食季節性改變|依實際氣溫、營養與健康需求調整','晚期癌症照護|症狀、心理、社會與生命意義交互影響|腫瘤治療＋緩和醫療＋心理支持','面對真實情緒|長期逃避可能使問題持續|安全表達、建立界線、尋求支持'])+
'<h3>需要修正講座中的三個過度確定說法</h3>'+L(['12歲以後人格仍具有可塑性。','不能宣稱九成內分泌失調由情緒造成。','出生節氣不能作為已驗證的疾病或性格預測工具。'],1)],

['八大生成鏈',
'<h2>八大身心生成鏈</h2><p class="lead">每一條都採用「本體→中醫結構→現代生成機制→調養行動」。</p>'+G([
'01|凌晨易醒|睡眠維持困難|肝經、肺經；傳統子午流注作為觀察參考|壓力、夜汗、呼吸中止或夜尿→睡眠中斷|記錄睡眠14天，評估打鼾、夜汗與用藥',
'02|單側耳鳴|一側耳朵出現無外部聲源的聲音|膽經、三焦經與耳周循行相關|內耳或聽覺系統異常→耳鳴感|耳鼻喉科及聽力檢查；突發聽損當天就醫',
'03|更年期症狀|熱潮紅、夜汗、睡眠與情緒變化|腎、肝、三焦、膀胱等傳統辨證方向|雌激素變化→體溫調節敏感→夜汗及睡眠中斷|規律活動、追蹤症狀、討論醫療治療',
'04|濕疹|皮膚反覆發炎、乾癢|肺、脾、膀胱；皮毛與濕的傳統概念|屏障受損→發炎→搔抓→更受損|保濕、避免刺激、適當外用治療',
'05|胃食道逆流|胃酸逆流造成火燒心|胃、脾、肝；胃氣上逆的傳統辨證|胃內容物逆流→食道刺激|避免睡前大量進食，持續症狀就醫',
'06|焦慮與心悸|擔心伴隨心跳感明顯|心、心包、肝；心神與氣機|威脅感增加→自主神經活化；也需排查心律不整|記錄心跳與誘因，反覆心悸接受評估',
'07|腦霧與疲勞|思考變慢、體力下降|心、脾、腎；神、意、志的傳統概念|睡眠、貧血、甲狀腺、藥物等因素→認知或體能下降|排查原因、調整睡眠與活動量',
'08|便秘與腹脹|排便困難或腹部脹滿|脾、胃、大腸；運化與傳導|腸道動力、飲食與水分變化→排便異常|纖維、水分、活動與症狀紀錄'].map(four))],

['40種病症',
'<h2>40種病症 × 十二經絡 × 四層生成模型</h2><p class="lead">①本體＝這個症狀到底是什麼？②中醫結構＝傳統經絡如何理解？③現代生成機制＝身體可能怎樣一步步產生症狀？④調養行動＝具體怎麼做？</p>'+
N('重要界線：中醫經絡對應是傳統辨證參考，不等於現代醫學已證實的因果關係，也不能單靠症狀判斷器官疾病。')+
D40.map(g=>'<h3>'+g[0]+'</h3>'+G(g[1].map(four))).join('')+
'<h3>九｜四層結構的因果生成總公式</h3>'+T('步驟|做什麼',['本體|先描述真正發生的症狀。','中醫結構|提出經絡與證型的傳統解釋。','現代生成機制|建立可驗證的生理因果假說。','調養行動|選擇適合的生活調整與必要醫療。','回饋|追蹤症狀是否改善。','模型更新|改善不如預期，就重新檢查原因。'])+
'<h3>十｜重要觀念</h3>'+L(['經絡是傳統中醫的辨證地圖，不是所有疾病都能用疏通經絡解決。','例如氣喘需要適當吸入藥物、泌尿道感染可能需要抗生素、突發聽力下降需要緊急評估。','中醫調養可作為部分人的輔助照護，但不能延誤必要治療。','最重要的不是把病症配到最多條經絡，而是找出最有證據、最能改善症狀的關鍵機制。'])],

['四大症狀深解',
'<h2>四大症狀 × 十二經絡｜機制・因果・生成解析</h2><p class="lead">中醫經絡提供一套觀察身體的傳統模型；現代醫學則從神經、荷爾蒙、免疫、皮膚屏障與睡眠機制尋找原因。兩套模型可以互相對照，但不能把經絡對應當成已證實的疾病因果。</p>'+
DEEP.map(d=>'<h3>'+d[0]+'</h3>'+G(d[1].map(x=>C(x[0],'<p>'+x[1]+'</p>',d[0].slice(2,d[0].indexOf('→')).trim())))).join('')+
'<h3>一頁總表</h3>'+T('症狀|中醫對應|現代核心機制|優先行動',['凌晨易醒|肝、肺|睡眠警覺、呼吸、荷爾蒙|睡眠紀錄＋找原因','單側耳鳴|膽、三焦|內耳、聽神經、聲音傳導|耳鼻喉科＋聽力檢查','更年期|腎、肝、三焦、膀胱|雌激素變化、體溫與睡眠調節|症狀追蹤＋醫療評估','濕疹|肺、脾、膀胱|皮膚屏障受損、免疫發炎|保濕＋避免刺激＋適當治療'])+
'<h3>整合成 LifeOS 生成模型</h3>'+T('階段|內容',['Reality|真實症狀','Observation|觀察時間、頻率、嚴重度','Representation|建立中醫與現代醫學兩種解釋','Mechanism|尋找可能生理機制','Evidence|透過病史、檢查與紀錄驗證','Action|選擇安全有效的介入','Feedback|追蹤症狀變化','Prediction Error|找出原先解釋與實際結果的差異','Model Update|更新判斷'])+
'<h3>最重要的因果智慧</h3>'+L(['凌晨醒來，不代表肝經一定失調。','單側耳鳴，不代表膽經一定堵塞。','更年期，不代表腎經一定虛弱。','濕疹，不代表肺經一定有問題。','真正的機制分析，不是看到症狀就指定經絡，而是提出可能原因，再用觀察與證據逐一驗證。','經絡可以是傳統調養的參考地圖；疾病診斷與治療，仍需要可靠的醫學證據。'])],

let fcat='';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const frow=p=>'<div class="row it"><span class="d">'+p.date.slice(2).replace(/-/g,'/')+'</span><span class="t">'+esc(p.title)+'<span class="tags">'+p.tags.join('　')+'</span></span></div>';

function drawFB(){
  fbchips.innerHTML='<button class="chip'+(fcat?'':' on')+'" data-c="">全部 '+posts.length+'</button>'+CAT_NAMES.map(c=>[c,posts.filter(p=>p.tags.includes(c)).length]).filter(x=>x[1]).map(x=>'<button class="chip'+(fcat===x[0]?' on':'')+'" data-c="'+x[0]+'">'+x[0]+' '+x[1]+'</button>').join('');
  fblist.innerHTML=(fcat?[fcat]:CAT_NAMES).map(c=>{const g=posts.filter(p=>fcat?p.tags.includes(c):p.tags[0]===c);return g.length?'<h3>'+c+'（'+g.length+'）</h3>'+g.map(frow).join(''):''}).join('');
  render();
}
fbchips.onclick=e=>{if(e.target.dataset.c!==undefined){fcat=e.target.dataset.c;drawFB()}};
