const RS={
1:`想法像衣服，可以換。今天穿這件，明天覺得不合適，就換一件。說一句「我現在是這樣想的」，心就多了一扇窗。¦Thoughts are like clothes — you can change them. Wear one today, and if it doesn't fit tomorrow, change. Say "This is what I think for now," and your heart gains a window.`,
2:`心情像天氣，有晴天也有雨天。下雨不是你的錯，雨也不會一直下。撐一把傘，等一等，太陽會再出來。¦Feelings are like weather — sunny days and rainy days. Rain isn't your fault, and it won't rain forever. Hold an umbrella, wait a little, and the sun comes back.`,
3:`你不是「笨」，你是「還沒學會」。差兩個字，差很多。「還沒」的後面，藏著一個會越來越厲害的你。¦You're not "stupid" — you "haven't learned it yet." Two small words, a big difference. Behind "yet" hides a you who keeps getting better.`,
4:`自信不是大聲說「我最棒」，是小聲說「我試試看」。試了一次，就多一點相信自己。一點一點，就夠了。¦Confidence isn't shouting "I'm the best." It's quietly saying "I'll give it a try." Each try adds a little trust in yourself. Little by little is enough.`,
5:`擔心像影子，燈越近，影子越大。把燈拿遠一點看，影子就變小了。很多可怕的事，其實沒有那麼大。¦Worry is like a shadow: the closer the lamp, the bigger it looks. Move the lamp back and the shadow shrinks. Many scary things aren't as big as they seem.`,
6:`蛋糕不用很完美才好吃。歪歪的蛋糕，一樣很甜。先做出來，請大家吃一口，下次會更好。¦A cake doesn't have to be perfect to taste good. A lopsided cake is just as sweet. Make it first, share a bite, and the next one will be better.`,
7:`山很高，可是每次只要走一步。不用看山頂，看腳前面的那一步就好。走一步，山就矮一點。¦The mountain is high, but you only take one step at a time. Don't look at the peak; look at the step in front of you. Each step makes the mountain a little shorter.`,
8:`在跑步機上跑得再快，也到不了公園。很累卻沒有前進時，停下來看一看，也許只是要走下跑步機。¦However fast you run on a treadmill, you never reach the park. When you're tired but not moving forward, stop and look — maybe you just need to step off.`,
9:`風箏飛錯方向，可以收線再放一次。目標也可以改。改目標不是放棄，是讓自己飛向更想去的天空。¦If a kite flies the wrong way, reel it in and launch again. Goals can change too. Changing a goal isn't giving up; it's flying toward the sky you really want.`,
10:`昨天釣到魚的地方，今天不一定有魚。成功很棒，可是河水會流。記得每天再看一次河。¦The spot where you caught fish yesterday may have none today. Success is great, but the river keeps flowing. Remember to look at the river again each day.`,
11:`學走路的小寶寶，跌倒了不會說「我不行」，他只是再站起來。你小時候就是這樣學會走路的。你一直都會。¦A baby learning to walk doesn't say "I can't" after falling. They just stand up again. That's how you learned to walk. You've always known how.`,
12:`水桶有洞，倒再多水也裝不滿。先找到洞，補起來。讀書也是，先找到不會的地方，比讀很久更有用。¦A bucket with a hole never fills, however much you pour. Find the hole and patch it. Studying is the same: finding what you don't know helps more than long hours.`,
13:`考卷上的分數，是今天的天氣預報，不是你一輩子的天氣。看看哪裡下雨，帶把傘，下次就不怕了。¦A test score is today's weather report, not your lifelong climate. See where it rained, bring an umbrella, and next time you won't be afraid.`,
14:`玩具太多，反而找不到最愛的那一個。知識也是。把真正用得到的放在手邊，心就不會亂。¦With too many toys, you can't find your favorite. Knowledge is the same. Keep what you really use close by, and your mind stays clear.`,
15:`AI 像一本會說話的書，很厲害，可是書也會寫錯。聽完了，自己再想一想。會自己想的你，比任何機器都珍貴。¦AI is like a talking book — amazing, but books can be wrong too. After listening, think for yourself. You who can think are more precious than any machine.`,
16:`肚子飽了，再好吃的也吃不下。腦袋也會飽。看夠了就停下來，讓它消化一下，才會變成你的力氣。¦When your tummy is full, you can't eat even the tastiest food. Your mind gets full too. Stop when you've seen enough and let it digest; then it becomes your strength.`,
17:`別人貼出來的，是他們最漂亮的那一頁。你看到的自己，是整本書。不要拿別人的一頁，來比你的整本書。¦What others post is their prettiest page. What you see of yourself is the whole book. Don't compare someone's one page with your whole book.`,
18:`手機很好玩，可是窗外的雲也在等你看。把手機放下五分鐘，抬頭看看天空。世界一直在這裡。¦Phones are fun, but the clouds outside are waiting to be seen too. Put the phone down for five minutes and look up. The world has been here all along.`,
19:`時間像一個杯子，先放大石頭，再放小石頭，才放得下。先做最重要的事，其他的自然有位置。¦Time is like a cup: put the big stones in first, then the small ones, and everything fits. Do the most important thing first and the rest finds its place.`,
20:`蜜蜂很忙，可是牠知道自己在採哪一朵花。忙不可怕，不知道為什麼忙才累。停一下，問問自己：我在採哪朵花？¦Bees are busy, but they know which flower they're visiting. Being busy isn't the problem; not knowing why is what tires you. Pause and ask: which flower am I working on?`,
21:`走過的路不會白走。做了十年的事，是你背包裡的寶物。換一條路，寶物還是跟著你。¦No road you've walked is wasted. Ten years of work are treasures in your backpack. Take a new road and the treasures still come with you.`,
22:`存錢筒裡的每一個硬幣，都是送給未來的自己的小禮物。今天少買一樣不需要的，明天的你會笑著說謝謝。¦Every coin in the piggy bank is a small gift to your future self. Skip one thing you don't need today, and tomorrow's you will smile and say thanks.`,
23:`雞蛋不要全放在同一個籃子裡。籃子掉了，才不會全部破掉。慢慢來、分開放，才睡得安穩。¦Don't put all your eggs in one basket, so a dropped basket doesn't break them all. Go slowly and spread them out, and you'll sleep peacefully.`,
24:`心裡空空的時候，買再多東西也填不滿。先抱抱自己，問一聲：「你怎麼了？」被聽見的心，就不那麼餓了。¦When your heart feels empty, no amount of shopping fills it. Hug yourself first and ask, "What's wrong?" A heart that is heard isn't so hungry.`,
25:`好吃的東西，吃剛剛好最好吃。吃太多，肚子會痛。什麼事都是這樣，剛剛好，就是最好。¦Tasty food is best when you eat just enough. Too much and your tummy hurts. Everything is like this — just enough is best.`,
26:`身體會說話，只是很小聲。累了、痛了，都是它在說：「請照顧我。」停下來聽一聽，它是你最老的朋友。¦Your body speaks, but softly. Tiredness and pain are its way of saying, "Please take care of me." Stop and listen — it's your oldest friend.`,
27:`幫花澆水，一次澆太多，花會淹死。一樣一樣來，才知道花喜歡什麼。照顧自己，也要慢慢來。¦Water a flower too much at once and it drowns. One thing at a time shows you what the flower likes. Caring for yourself also goes slowly.`,
28:`橡皮筋拉太緊會斷，放鬆一下才能再彈。運動完要休息，休息不是偷懶，是讓身體變強的秘密。¦A rubber band pulled too tight snaps; it needs to relax to spring again. Rest after exercise isn't laziness — it's the secret to getting stronger.`,
29:`睡覺像小貓，你越追牠越跑。把房間弄暗、弄安靜，坐下來等，牠就會自己走過來。¦Sleep is like a kitten: the more you chase, the more it runs. Make the room dark and quiet, sit and wait, and it will walk over on its own.`,
30:`每一朵花長得都不一樣，沒有人說玫瑰比雛菊漂亮。你的樣子，就是你這朵花的樣子。這樣就很好看了。¦Every flower looks different, and no one says a rose is prettier than a daisy. Your look is your flower's look. That's already beautiful.`,
31:`好朋友像兩隻手，可以牽在一起，也可以各自做事。牽著的時候很溫暖，放開的時候也不害怕。¦Good friends are like two hands: they can hold each other or do their own things. Warm when holding, unafraid when letting go.`,
32:`煙火很漂亮，可是一下就沒了。小夜燈不亮，卻陪你整個晚上。喜歡一個人，看看誰是那盞小夜燈。¦Fireworks are beautiful but gone in a moment. A night light isn't bright, yet it stays with you all night. When you like someone, see who is that night light.`,
33:`兩個人划一艘船，要常常問：「我們要去哪裡？」不說話一直划，船會原地轉圈。停下來聊一聊，船才會往前。¦Two people rowing one boat need to keep asking, "Where are we going?" Rowing in silence makes the boat spin. Stop and talk, and the boat moves forward.`,
34:`教孩子騎腳踏車，總有一天要放手。放手的時候心會跳很快，可是他會騎得很遠。放手，也是愛。¦When teaching a child to ride a bike, one day you must let go. Your heart races, but they ride far. Letting go is love too.`,
35:`種小樹要綁支架，可是綁太緊，樹就長不粗。鬆一點、緊一點，看著樹來調整。孩子也是這樣長大的。¦A young tree needs a stake, but tied too tightly its trunk can't thicken. Loosen a bit, tighten a bit, watching the tree. Children grow the same way.`,
36:`有些朋友陪你走一小段，有些陪你走很久。走一小段的，也是真的朋友。謝謝他陪你走過那一段。¦Some friends walk with you a short way, some a long way. The short-way ones are real friends too. Thank them for that stretch of road.`,
37:`給人一條魚，他吃一餐。教他釣魚，他吃一輩子。最好的幫忙，是讓他自己也做得到。¦Give someone a fish and they eat one meal. Teach them to fish and they eat for life. The best help lets them do it themselves.`,
38:`蠟燭照亮別人，可是不能把自己燒光。對別人好，也要對自己好。留一點光給自己，才能一直亮下去。¦A candle lights others, but it mustn't burn itself out. Be kind to others and to yourself. Save some light for yourself so you can keep shining.`,
39:`吵架像拔河，兩邊都用力，繩子就斷了。有一個人先放鬆，兩個人就都不會跌倒。先放鬆的人，最勇敢。¦A fight is like tug-of-war: both pull hard and the rope breaks. If one person eases up first, nobody falls. The one who eases up first is the bravest.`,
40:`老師和醫生知道很多，可是他們也喜歡會問問題的人。舉手問「為什麼」，不是沒禮貌，是認真。¦Teachers and doctors know a lot, and they like people who ask questions. Raising your hand to ask "why" isn't rude — it's being serious.`,
41:`阿嬤的食譜很好吃，可是現在的鍋子不一樣了。留下好味道，換個新鍋子煮。舊的好和新的好，可以一起。¦Grandma's recipe is delicious, but today's pots are different. Keep the good flavor and cook it in a new pot. Old goodness and new goodness can go together.`,
42:`每個人心裡都有一盞燈，照亮自己的路。別人的燈顏色不一樣，也一樣在發光。看看別人的燈，自己的路會更亮。¦Everyone has a lamp inside that lights their own path. Other people's lamps are different colors but shine just the same. Look at theirs and your path gets brighter.`,
43:`科學家最常說的一句話是：「我們再試一次看看。」願意再試、願意改，就是最聰明的事。¦The sentence scientists say most is: "Let's try it again and see." Being willing to try again and to change is the smartest thing.`,
44:`許願很好，可是許完願，還是要自己走過去。星星聽到了你的願望，你的腳要幫星星一點忙。¦Making a wish is good, but afterwards you still have to walk there. The star heard your wish; your feet need to help the star a little.`,
45:`不用每天都笑。想哭的時候哭，哭完了再笑，那個笑才是真的。所有的心情，都是你的好朋友。¦You don't have to smile every day. Cry when you need to; the smile after is the real one. Every feeling is a good friend of yours.`,
46:`受過傷的地方會結痂，結痂的地方比較強壯。以前很痛的事，是真的。現在的你比較有力量，也是真的。¦A wound forms a scab, and that spot grows stronger. What hurt before was real. That you're stronger now is real too.`,
47:`爸媽也是第一次當爸媽，他們也在學。你可以愛他們，也可以走自己的路。這兩件事不會打架。¦Parents are parents for the first time, and they're learning too. You can love them and still walk your own road. These two things don't fight.`,
48:`你不是因為拿了獎狀才可愛。沒有獎狀的那一天，你也一樣可愛。你這個人，本來就是一張獎狀。¦You aren't lovable because of a certificate. On days without one, you're just as lovable. You yourself are already an award.`,
49:`開一家店，要先問路過的人：「你想買什麼？」聽懂了再賣，店才會有人來。會聽的人，生意最好。¦When opening a shop, first ask passersby, "What would you like?" Sell after you understand, and people will come. Those who listen do the best business.`,
50:`說實話的小店，客人會一直回來。騙人的大店，只能賣一次。誠實，是最厲害的招牌。¦A small shop that tells the truth keeps its customers coming back. A big shop that lies sells only once. Honesty is the best sign.`,
51:`一百個人按讚，不如一個人說：「謝謝你，這幫到我了。」不要數讚，數數你幫到了誰。¦A hundred likes are worth less than one person saying, "Thank you, this helped me." Don't count likes; count who you've helped.`,
52:`好用的工具，是用完就可以放下的。把人留住的不是工具，是他變厲害了。做東西的人，要記得這件事。¦A good tool is one you can put down when you're done. What matters isn't keeping people but making them stronger. Makers should remember this.`,
53:`老師像園丁，不是把花拉高，是給它水和陽光。每朵花開的時間不一樣，慢慢開的花，也會開。¦A teacher is like a gardener: not pulling flowers taller, but giving water and sunlight. Each flower blooms at its own time, and slow bloomers still bloom.`,
54:`最好的老師，是讓學生有一天說：「老師，我自己會了。」那一天，就是老師最開心的一天。¦The best teacher is one whose student says one day, "Teacher, I can do it myself." That is the teacher's happiest day.`,
55:`小鳥學飛，會從樹枝上掉下來幾次。鳥媽媽在旁邊看，沒有去接，因為牠知道，翅膀要自己拍才會硬。¦A baby bird learning to fly falls from the branch a few times. The mother watches without catching, because she knows wings grow strong only by flapping.`,
56:`一個人說你不好，像一滴雨。一滴雨不會讓海變鹹。聽一聽，有用的留下來，沒用的讓它流走。¦One person saying you're not good is like one raindrop. One drop won't change the sea. Listen, keep what's useful, and let the rest flow away.`,
57:`冰淇淋有一百種口味，選太久就融化了。選一個「夠好」的，開心地吃。下次還可以選別的。¦With a hundred ice cream flavors, choosing too long lets it melt. Pick one that's "good enough" and enjoy it. Next time you can choose another.`,
58:`很生氣的時候寫的信，先放進抽屜，明天再看。明天的你，會謝謝今天沒有寄出去的你。¦Put a letter written in anger in the drawer and read it tomorrow. Tomorrow's you will thank today's you for not sending it.`,
59:`學游泳，先在淺的地方練習。不是膽小，是聰明。會了再往深的地方去，水就不可怕了。¦When learning to swim, practice in the shallow end first. That isn't timid — it's smart. Go deeper once you can, and the water isn't scary.`,
60:`安全感不是住在不會下雨的地方，是知道自己有一把傘。你一路走到今天，就是你有傘的證明。¦Feeling safe isn't living where it never rains; it's knowing you have an umbrella. That you've made it to today is proof you have one.`,
61:`種花的人管不了花什麼時候開，可是他可以澆水、鬆土、曬太陽。把能做的做好，然後等一等。¦A gardener can't control when the flower blooms, but can water, loosen the soil and give it sun. Do what you can well, and then wait.`,
62:`自由不是什麼都可以做，是可以說：「以前我這樣想，現在我想換一換。」能換，就是自由。¦Freedom isn't doing anything you like. It's being able to say, "I used to think this way; now I'd like to change." Being able to change is freedom.`,
63:`不用急著找到「人生的大答案」。今天幫了一個人、學了一件事、笑了一次，這一天就很有意義了。¦No need to rush to find life's big answer. If today you helped someone, learned something or laughed once, the day was already meaningful.`,
64:`種樹最好的時間是十年前，第二好的時間是現在。不管幾歲，今天種下去的，都會長大。¦The best time to plant a tree was ten years ago; the second-best is now. At any age, what you plant today will grow.`,
65:`後照鏡是用來看一下的，不是用來一直盯著的。看一眼以前，記住學到的，然後看前面的路。¦A rear-view mirror is for a glance, not for staring. Take one look at the past, remember what you learned, then watch the road ahead.`,
66:`明天會怎樣，沒有人知道。可是你可以帶一件外套、一把傘、一瓶水。準備好了，哪一種天氣都可以出門。¦No one knows what tomorrow brings. But you can pack a jacket, an umbrella and water. Once you're ready, you can go out in any weather.`,
67:`有智慧的人，不是什麼都知道，是知道「這個方法，今天適不適合用」。會看情況，就是智慧。¦A wise person doesn't know everything; they know whether this method fits today. Reading the situation is wisdom.`,
68:`最強壯的人，也會說：「可以幫我一下嗎？」會開口請人幫忙，不是軟弱，是很大的勇氣。¦Even the strongest people say, "Could you help me?" Asking for help isn't weakness; it takes great courage.`,
69:`樹在冬天不長葉子，可是根一直在長。看不到進步的日子，你也在長大，只是長在看不見的地方。¦In winter a tree grows no leaves, but its roots keep growing. On days when you see no progress, you're still growing — just where it can't be seen.`,
70:`走平衡木的時候，身體歪左邊，就往右邊一點；歪右邊，就往左邊一點。不用站得直直的，會調整，就不會掉下來。¦On a balance beam, lean left and you shift right; lean right and you shift left. You don't have to stand perfectly straight. If you can adjust, you won't fall.`};

 return l=='en'?`【${g(e.sub)}】\n\n${g(e.soup)}\n\nDoes this sound like you?\n${m}\n\nOne small step today: ${g(e.fa)}\n${g(e.al)}\n\nHave you run into this lately? Tell me in the comments.\n\n#LifeErrorMap #SoupForTheHeart #${e.en.replace(/[ -]/g,'')}Error #LifeOS`
 :`【${g(e.sub)}】\n\n${g(e.soup)}\n\n你是不是也這樣？\n${m}\n\n今天的一小步：${g(e.fa)}\n${g(e.al)}\n\n你最近有沒有遇到這樣的事呢？留言跟我說說吧。\n\n#生活生命錯誤地圖 #心靈雞湯 #${g(e.zh)} #LifeOS`}
function postR(x,p,l){const g=s=>zz(s,l),ls=x.b.split('\n').map(s=>s.replace(/^[-+#]/,'')),last=g(ls[ls.length-1]);
 const mid=p.length?p.slice(0,3).map(([a,b])=>l=='en'?`・"${g(a)}"\n　→ Try: ${g(b)}`:`・「${g(a)}」\n　→ 換個想法：${g(b)}`).join('\n'):ls.slice(0,4).map(s=>'・'+g(s)).join('\n');
 return l=='en'?`【${g(x.t)}】\n\n${g(x.soup)}\n\nWhen we're stuck, we often think:\n${mid}\n\n${last}\n\nHave you had a moment like this lately? Tell me in the comments.\n\n#PullingLifeBack #SoupForTheHeart #LifeOS`

function wrapLines(c,t,w){const out=[],latin=/^[\x00-\x7f‘’“”—–…]+$/.test(t);let cur='';
 (latin?t.split(' '):[...t]).forEach(x=>{const nx=cur+(latin&&cur?' ':'')+x;if(c.measureText(nx).width>w&&cur){out.push(cur);cur=x}else cur=nx});if(cur)out.push(cur);return out}
async function drawCard(it,l){l=l||cl();const en=l=='en',col=it.col,F='"LXGW WenKai TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
 const title=it.title(l),soupT=it.soup(l),step=it.foot(l),label=it.label(l);
 try{await Promise.all([document.fonts.load('700 64px "LXGW WenKai TC"',title+step+it.top(l)+label),document.fonts.load('400 40px "LXGW WenKai TC"',soupT)])}catch(x){}
 const cv=document.createElement('canvas');cv.width=cv.height=1080;const c=cv.getContext('2d');
 c.fillStyle='#fff4d9';c.fillRect(0,0,1080,1080);c.fillStyle=col;c.fillRect(0,0,1080,160);
 c.fillStyle='#fff';c.textBaseline='middle';c.font='700 44px '+F;c.fillText(it.top(l),60,82);c.textAlign='right';c.fillText(it.num,1020,82);c.textAlign='left';c.textBaseline='top';
 let y=215;if(label){c.fillStyle=col;c.font='700 36px '+F;c.fillText(label,60,y);y=290}
 if(title){let ts=en?56:66;c.font='700 '+ts+'px '+F;let tl=wrapLines(c,title,960);if(tl.length>2){ts-=10;c.font='700 '+ts+'px '+F;tl=wrapLines(c,title,960)}
  c.fillStyle='#1c2333';tl.forEach(s=>{c.fillText(s,60,y);y+=ts*1.38});y+=34}
 c.font='700 34px '+F;const sl=wrapLines(c,step,880),bh=sl.length*50+56,by=1080-64-bh,avail=by-36-y;
 let fs=title?42:68,ls;for(;fs>=24;fs-=2){c.font='400 '+fs+'px '+F;ls=wrapLines(c,soupT,960);if(ls.length*fs*1.6<=avail)break}
 if(!title)y+=Math.max(0,(avail-ls.length*fs*1.6)/2);
 c.fillStyle='#5a4310';ls.forEach(s=>{c.fillText(s,60,y);y+=fs*1.6});
 c.fillStyle='#fff';c.beginPath();c.roundRect(40,by,1000,bh,28);c.fill();c.fillStyle=col;c.font='700 34px '+F;sl.forEach((s,i)=>c.fillText(s,90,by+28+i*50));
 c.fillStyle='#8a7440';c.font='400 26px '+F;c.textAlign='right';c.fillText('LifeOS',1020,1080-48);return cv.toDataURL('image/png')}

 if(!top.length){h+=`<p class="muted">${u('還沒有答案。開始作答以後，這裡會告訴你最需要照顧的地方，還有今天可以做的一小步。','No signals yet. As you answer, the errors most worth caring for and today\'s small prescription will appear here.')}</p></div>`;$('#result').innerHTML=h;return}
 h+=`<h3>${U('最需要照顧的地方','Top errors')}</h3>`+top.slice(0,8).map(x=>`<div class="score"><span style="cursor:pointer;color:var(--acc)" onclick="go('cards',${x.e.n})">${pad(x.e.n)} ${esc(P(x.e.zh))}</span><div class="bar"><i style="width:${x.s/6*100}%"></i></div><span>${x.s}/6 ${lab(x.s)}</span></div>`).join('');
 [0,1].forEach(i=>{const x=top[i];if(!x)return;h+=`<div class="card bl${lvOf(x.e.n).n}" style="margin-top:10px"><b>TOP ${i+1}｜${pad(x.e.n)} ${x.e.en} ERROR｜${esc(P(x.e.zh))}</b>（${x.s}）<div class="kv"><b>${u('是哪幾題','Evidence')}｜</b></div>${list(x.ev.join('|'))}${kv('怎麼拉回來','Regularization',x.e.core)}${kv('第一步','First action',x.e.fa)}</div>`});
 h+=`<p class="muted" style="margin-top:10px">${U('分數最高的，不一定是最開始的原因。慢慢往前找：是從哪裡開始的？現在卡在哪裡？改哪裡最有用？','The highest score isn\'t always the root cause. Trace upstream gently: where does the chain start, where is it stuck now, and which change would loosen it most?')}</p>`;
 const p=store('lifeos_rx')||{},t=top[0].e,F=[['root','最開始的原因','Root error',P(t.zh)],['neck','卡住的地方','Bottleneck',''],['lev','改哪裡最有用','Leverage point',''],['reg','今天要怎麼拉回來','Today\'s regularization',P(t.core)],['act','今天只做一小步','Today\'s one minimum action',P(t.fa)],['pred','如果做了，我猜會……','If I do it, I predict…',''],['re','哪一天再試','Retest date',''],['evi','看到什麼，就知道有用？','What will show it worked?',''],['cap','這次我多了什麼本領？','What capability or wisdom grew?','']];
 h+=`<h3>${U('【今天只改一件事】','【Change just one variable today】')}</h3>`+F.map(([k,z,en,d])=>`<label class="field" for="rx_${k}">${u(z,en)}<input id="rx_${k}" ${k=='re'?'type="date"':''} value="${esc(p[k]??d)}" oninput="rx('${k}',this.value)"></label>`).join('');
 h+=`<div class="kv"><b>${u('結果','Result')}｜</b></div><div class="opts">${[['改善','Improved'],['沒變','No change'],['更差','Worse']].map(([k,en])=>`<label class="${p.out==k?'sel':''}" onclick="rx('out','${k}');result()">${u(k,en)}</label>`).join('')}</div>`;
 const O={改善:['留下來：多相信新想法一點。','KEEP｜Give the new model more weight.'],沒變:['再調一下：再找卡在哪、換方法。','MODIFY｜Find the bottleneck or strategy again.'],更差:['先停下來：看看是怎麼發生的、是不是別種錯。','STOP / ROLLBACK｜Check the mechanism, side effects and error type.']};
 if(p.out)h+=`<div class="quote">${U(O[p.out][0]+' → 換新地圖 → 本領 → 智慧',O[p.out][1]+' → MODEL UPDATE → CAPABILITY → WISDOM')}</div>`;
 h+=`</div>`;$('#result').innerHTML=h}
function rx(k,v){const p=store('lifeos_rx')||{};p[k]=v;store('lifeos_rx',p)}

/* ---------- 正則化70 ---------- */
function reg(){const gs=[...new Set(R.map(x=>x.g))],f=typeof sub==='string'?gs[+sub.slice(1)]:null;
 let h=`<h2>${U('把日子拉回來的 70 件事','The Life Regularization OS')}</h2>`;
 if(!f)A.filter(x=>x.g=='總母體').slice(0,3).forEach(x=>h+=`<div class="card" style="margin-bottom:12px"><h3 style="margin-top:0">${T(x.t)}</h3><div class="body">${body(x.b)}</div></div>`);
 h+=`<div class="legend"><span class="bad">${u('讓人卡住的想法','A thought that keeps you stuck')}</span><span class="good">${u('換個想法','A gentler view')}</span></div>`;
 h+=`<div class="chips" style="margin-top:12px"><span class="chip ${!f?'on':''}" onclick="go('reg')">${u('全部 70 類','All 70')}</span>${gs.map((g,i)=>`<span class="chip ${f==g?'on':''}" onclick="go('reg','g${i}')">${esc(P(g))}</span>`).join('')}</div>`;
 h+=`<div class="grid">${R.filter(x=>!f||x.g==f).map(x=>`<div class="card" id="r${x.n}"><div class="num">${pad(x.n)} <span class="tag">${esc(P(x.g))}</span></div><b class="rt">${T(x.t)}</b>${x.soup?soupCard({s:x.soup}):''}<div class="body" style="margin-top:6px">${body(x.b)}</div></div>`).join('')}</div>`;
 if(!f)A.filter(x=>x.g=='總母體').slice(3).forEach(x=>h+=`<div class="card" style="margin-top:12px"><h3 style="margin-top:0">${T(x.t)}</h3><div class="body">${body(x.b)}</div></div>`);
 M.innerHTML=h}

/* ---------- 對照表 ---------- */
function table(){M.innerHTML=`<h2>${U('40 類總表','40 Types at a Glance')}</h2><p class="muted">${U('五層→40 種錯→一看就知道→拉回來的重點→方法代號→第一步。點一列就能打開那張卡。','Level → 40 errors → at a glance → core regularization → protocol → first action. Tap a row to open that card.')}</p><div class="tbl"><table><tr><th>${u('層','Level')}</th><th>#</th><th>${u('錯誤類型','Error type')}</th><th>${u('一看就知道','At a glance')}</th><th>${u('拉回來的重點','Core regularization')}</th><th>Protocol</th><th>${u('第一步','First action')}</th></tr>${E.map(e=>{const l=lvOf(e.n);return`<tr style="cursor:pointer" onclick="go('cards',${e.n})"><td><span class="lv lv${l.n}">${l.ic}L${l.n}</span></td><td>${pad(e.n)}</td><td><b>${e.en}</b><br>${T(e.zh)}</td><td>${T(e.lk)}</td><td>${T(e.core)}</td><td>${e.pr}</td><td>${T(e.fa)}</td></tr>`}).join('')}</table></div>
<h3>${U('五個大絕招','Five Super Strategies')}</h3><div class="grid">${L.map(l=>`<div class="card bl${l.n}"><b>${l.ic} LEVEL ${l.n}｜${l.sup}</b><div class="muted">${pad(l.a)}–${pad(l.b)}</div><p>${T(l.supd)}</p>${kv('會得到','Output',l.prod)}</div>`).join('')}</div>`}

/* ---------- 流程 ---------- */
function flow(){const gs=[['基礎','先知道這些','Basics'],['路由','問自己和找方向','Diagnosis & Routing'],['正則化','正則化','Regularization'],['公式','一圈一圈的公式','Loops & Formulas'],['例子','生活例子','Life Examples']],f=sub;
 let h=`<h2>${U('說明・公式・例子','Flows · Formulas · Examples')}</h2><div class="chips"><span class="chip ${!f?'on':''}" onclick="go('flow')">${u('全部','All')}</span>${gs.map(([g,z,en])=>`<span class="chip ${f==g?'on':''}" onclick="go('flow','${g}')">${u(z,en)}</span>`).join('')}</div>`;
 A.filter(x=>x.g!='總母體'&&(!f||x.g==f)).forEach(x=>{const g=gs.find(g=>g[0]==x.g)||['','',''];h+=`<div class="card" style="margin-bottom:12px"><div class="num">${u(g[1],g[2])}</div><h3 style="margin-top:2px">${T(x.t)}</h3><div class="body">${body(x.b)}</div></div>`});M.innerHTML=h}

/* ---------- 搜尋 ---------- */
const FN={soup:['雞湯','Soup'],sub:['標題','Title'],def:['定義','Definition'],pl:['簡單說','Plain'],mi:['常犯的錯','Mistake'],co:['會帶來','Causes'],up:['怎麼改','Update'],iq:['辨識','Spotting'],ic:['帶來','Causes'],rp:['簡單說','Plain'],ri:['辨識','Spotting'],rc:['帶來','Causes'],rm:['拉回來','Regularization'],rk:['口訣','Mantra'],cs:['案例','Case'],cc:['帶來','Result'],cr:['拉回來','Regularization'],cl:['一句話','One line'],dx:['診斷','Diagnosis'],dr:['怎麼看','Reading'],q:['自測','Check'],qy:['「是」多','Many YES'],ac:['實作','Practice'],da:['每天','Daily'],sy:['長期','System'],kp:['成功','Success'],al:['一句話','One line'],lk:['一看就知道','At a glance'],core:['拉回來的重點','Core'],fa:['第一步','First action'],zh:['名稱','Name'],en:['名稱','Name'],pr:['Protocol','Protocol']};
const lines=b=>b.split('\n').map(s=>s.trim().replace(/^[-+#]/,'')).filter(Boolean);
function search(q){hi=q;const k=q.toLowerCase(),out=[];
 E.forEach(e=>{const hits=[];for(const f in FN){const v=e[f];if(typeof v!=='string')continue;sp(v).forEach(s=>{if(s.toLowerCase().includes(k))hits.push([u(...FN[f]),s])})}if(hits.length)out.push(`<div class="res" onclick="go('cards',${e.n})"><span class="tag">Error ${pad(e.n)}</span><b>${e.en} ERROR｜${T(e.zh)}</b><div class="muted">${hits.slice(0,4).map(([f,s])=>`<div>${f}｜${T(s)}</div>`).join('')}${hits.length>4?`<div>…${u('共','total')} ${hits.length}</div>`:''}</div></div>`)});
 L.forEach(l=>{const t=[l.nm,l.q,l.door,l.lang,l.reg,l.out,l.supd].join('｜');if(t.toLowerCase().includes(k))out.push(`<div class="res" onclick="go('home')"><span class="tag">${u('五層','Levels')}</span><b>${l.ic} LEVEL ${l.n}｜${T(l.nm)}</b></div>`)});
 R.forEach((x,i)=>{if((x.t+x.b).toLowerCase().includes(k)){const ln=lines(x.b).filter(s=>s.toLowerCase().includes(k)).slice(0,3);out.push(`<div class="res" onclick="go('reg');setTimeout(()=>document.getElementById('r${x.n}').scrollIntoView(),50)"><span class="tag">${u('拉回來','Regularization')} ${pad(x.n)}</span><b>${T(x.t)}</b><div class="muted">${ln.map(s=>`<div>${T(s)}</div>`).join('')}</div></div>`)}});
 A.forEach(x=>{if((x.t+x.b).toLowerCase().includes(k)){const ln=lines(x.b).filter(s=>s.toLowerCase().includes(k)).slice(0,3);out.push(`<div class="res" onclick="go('${x.g=='總母體'?'reg':'flow'}')"><span class="tag">${x.g=='總母體'?u('總母體','Mother OS'):u('流程','Flow')}</span><b>${T(x.t)}</b><div class="muted">${ln.map(s=>`<div>${T(s)}</div>`).join('')}</div></div>`)}});
 SOUP.forEach(s=>{if(s.toLowerCase().includes(k))out.push(`<div class="res" onclick="go('soup')"><span class="tag">${u('雞湯','Soup')}</span><div>${T(s)}</div></div>`)});
 M.innerHTML=`<h2>${u('搜尋','Search')}「${esc(q)}」<span class="muted">　${out.length}</span></h2>`+(out.join('')||`<p class="muted">${u('找不到，換個關鍵字試試。','No results. Try another keyword.')}</p>`)}
$('#q').addEventListener('input',e=>{const v=e.target.value.trim();if(v)search(v);else{hi='';render()}});
function render(){({home,soup,posts,cards,quiz,reg,table,flow})[tab]()}
{const s=store('lifeos_tab');if(s&&TABS.some(t=>t[0]==s[0])){tab=s[0];sub=s[1]}}
document.documentElement.lang=LANG=='en'?'en':'zh-Hant';nav();render();
</script>
