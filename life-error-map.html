cs:`朋友已讀不回→「他一定討厭我。」|老師皺眉→「老師一定對我不滿。」|學生上課低頭→「他就是不尊重老師。」|伴侶今天話少→「他是不是不愛我了？」|社群文章沒人回→「大家一定不喜歡我的內容。」|主管沒稱讚→「我的工作一定做得很差。」`,
cc:`感受被誤認成Reality，產生不必要的焦慮與衝突。`,cr:`FACT與STORY分開＋找替代解釋。`,cl:`你看到的是大腦版本，不一定是世界原稿。`,
dx:`我現在描述的是攝影機可以拍到的Fact嗎？|還是裡面已經混入「他故意、他討厭、我很差」之類的解讀？|另一個人看到同一件事，可能得到不同結論嗎？|如果我現在心情很好，我還會這樣看嗎？|我是不是把「我的感覺」直接當成「外在事實」？`,dr:`YES多→先做FACT／STORY分離。`,
q:`我常把「我的感覺」直接當成「事情就是如此」。|別人的一個表情、語氣或動作，很容易讓我推測他的想法。|情緒不好時，我看到的事情通常也會變得比較負面。`,qy:`先分FACT與STORY。`,
ac:`畫兩欄：FACT｜STORY。|FACT只能寫攝影機能拍到的內容。|刪除「他故意／他討厭我／我一定不行」等推論。|問一位第三者可能怎麼看。|情緒高時延遲Interpretation。`,
da:`每天選一個情緒事件練FACT／STORY。`,sy:`建立「感知≠Reality」習慣。`,kp:`誤會與過度反應下降。`,al:`先看發生什麼，再決定它代表什麼。`,
lk:`把感覺當事實`,core:`FACT／STORY分離`,pr:`RP03 Fact–Story Separation`,fa:`畫「事實／解讀」兩欄`});

e({n:4,lv:1,en:`INTERPRETATION`,zh:`詮釋錯誤`,sub:`事情沒那麼嚴重，是故事越講越嚴重`,def:`Interpretation＝詮釋＝你替事情加上的意思。`,
pl:`事情只發生一次，大腦卻開始寫小說。`,
mi:`他拒絕我＝我沒有價值|考試失敗＝我沒有能力|婚姻出問題＝我的人生失敗|孩子不聽話＝我不是好媽媽|產品賣不好＝產品一定不好|別人批評我＝大家都不喜歡我|一次失敗＝以後一定也會失敗`,
co:`事件本來只造成一次傷害|錯誤Interpretation可能讓傷害每天重新播放|最後形成自責、焦慮、羞恥、逃避甚至身份固化`,
up:`問：除了現在這個故事，還有哪三種可能解釋？`,
iq:`真正發生的事情是什麼？|我後來替它加了什麼故事？|我是不是從一次事件推論「永遠都會如此」？|除了我的版本，還有哪三種可能解釋？|如果換成朋友遇到，我也會做這麼嚴重的解讀嗎？`,
ic:`一次事件可能變成長期痛苦。`,
rp:`事件只有一件，大腦卻寫出整部連續劇。`,ri:`哪些是真的發生，哪些是我後來加上的故事？`,rc:`一次事件被延長成長期痛苦。`,
rm:`事件與意義分開|禁止使用「永遠、一定、全部、從來」|同一事件至少產生3個解釋|詢問：還缺哪些資料？|把人格解釋改成情境解釋|24小時後重新解讀重大事件`,rk:`先保留多種解釋，不急著塌縮成唯一故事。`,
cs:`一次考差→「我根本不是讀書的料。」|被拒絕一次→「沒有人會喜歡我。」|產品一次團購不好→「市場根本不需要。」|夫妻吵一次架→「我們的婚姻完了。」|孩子頂嘴→「我教育完全失敗。」|今天工作效率差→「我最近整個人都廢掉了。」`,
cc:`一次Event被擴張成永久人生故事。`,cr:`禁止「永遠／全部／一定」＋至少找3種解釋。`,cl:`事件傷你一次，故事可能每天再傷一次。`,
dx:`我是不是從一件事情推論出整個人生？|我腦中是否出現「永遠、一定、大家、從來、完全」？|我是不是替別人的行為加入了自己無法證明的動機？|除了現在這個解釋，我能不能提出另外三種解釋？|真正讓我痛苦的是Event，還是我對Event講的Story？`,dr:`YES多→不要急著改Reality，先檢查Interpretation。`,
q:`一次不好的事情，我容易想到「以後都會這樣」。|我常使用「一定、永遠、全部、從來」解釋事件。|我常替別人的行為加入自己其實無法證明的動機。`,qy:`重新打開Alternative Explanations。`,
ac:`寫下目前腦中的故事。|至少再寫3個Alternative Explanations。|刪掉「永遠、一定、全部、從來」。|把人格解釋改成情境解釋。|問：「還缺什麼Evidence？」`,
da:`每天練一次「同一事件三種解釋」。`,sy:`重大事件24小時後再做第二次Interpretation。`,kp:`單一事件不再快速升級成人生結論。`,al:`保留多個解釋，就是保留自由度。`,
lk:`一件事被解讀成巨大故事`,core:`增加替代解釋`,pr:`RP04 Alternative Explanation`,fa:`列3種其他可能`});

e({n:5,lv:1,en:`BELIEF`,zh:`信念錯誤`,sub:`以前相信的規則已經過期`,def:`Belief＝信念＝你長期相信「世界就是這樣」的內在規則。`,
pl:`以前可能有用，但現在環境變了，你還照舊操作。`,
mi:`努力就一定成功|老師一定要知道所有答案|父母說的就一定對|年紀大就不能改變|我天生數學不好|有錢才代表成功|忍耐就是好人|拒絕別人就是自私|以前成功的方法現在一定有效`,
co:`新機會看不到|新資訊進不來|一直重複舊人生|環境已經變了，自己的作業系統卻沒有更新`,
up:`問：這個信念現在還有多少證據支持？`,
iq:`我為什麼相信這件事？|這是我驗證過的，還是別人告訴我的？|這個信念以前有效，現在還有效嗎？|有哪些Evidence其實與我的信念相反？|如果放掉這個信念，我會看到哪些新選項？`,
ic:`環境已經改變，人生仍按照舊規則運作。`,
rp:`以前的規則可能已經過期。`,ri:`我為什麼相信它？現在還有證據嗎？`,rc:`新Reality出現，人生仍使用舊作業系統。`,
rm:`每個重要Belief寫出來源|找支持Evidence|再找反對Evidence|設定信念有效條件|允許「部分正確」|定期問：什麼證據會讓我改變想法？`,rk:`信念是暫時模型，不是永久真理。`,
cs:`「女生數學本來就比較差。」|「我年紀大了，不可能學AI。」|「老師就應該什麼都會。」|「父母說的不能拒絕。」|「吃苦越多代表越努力。」|「以前這樣賣得很好，現在一定也可以。」`,
cc:`Reality已經變了，內在Operating System還停在以前。`,cr:`問：這個Belief的Evidence是什麼？反例是什麼？適用條件是什麼？`,cl:`過去救過你的信念，也可能成為今天限制你的框架。`,
dx:`這個想法是我驗證過的，還是從家庭、學校、文化或別人那裡學來的？|我是否已經很多年沒有重新檢查它？|Reality是否已經出現與它衝突的Evidence？|我是否會自動忽略與自己Belief不同的資料？|如果這個Belief不是真的，我的人生會多出哪些Options？`,dr:`YES多→可能是Old Belief正在限制New Reality。`,
q:`有些人生規則我相信很多年，卻從沒重新驗證。|遇到與自己信念不同的資料，我第一反應常是排斥。|我常因為「以前都是這樣」而認為現在也應該如此。`,qy:`檢查Old Belief是否已經過期。`,
ac:`寫出限制自己的那句Belief。|問「我是從哪裡學來的？」|列3個支持Evidence。|列3個反例。|改寫成有條件的版本。|例如｜「我英文不好」→「我目前長句解析能力不足。」`,
da:`抓一句「我就是／一定／不可能」重新檢查。`,sy:`每月做Belief Audit。`,kp:`固定信念變成可測試假說。`,al:`不要把Belief當Truth，把它當Model。`,
lk:`舊規則一直沒重新驗證`,core:`支持證據＋反證＋條件化`,pr:`RP05 Belief Stress Test`,fa:`寫出限制自己的Belief`});

e({n:6,lv:1,en:`MODEL`,zh:`模型錯誤`,sub:`腦中的人生地圖畫錯了`,def:`Model＝模型＝你用來理解世界、預測結果的內在地圖。`,
pl:`不是你不努力，而是你拿錯地圖。`,
mi:`以為健康只看體重|以為成績只靠努力時間|以為孩子不聽話只是態度不好|以為員工表現差只是懶惰|以為婚姻問題只要忍耐就會改善|以為產品好自然有人買|以為知道很多就等於有智慧|以為一次原因造成一次結果`,
co:`越努力可能離目標越遠|因為Action沒有錯，真正錯的是背後Model`,
up:`不要先問「我要更努力嗎？」先問「我的地圖是不是畫錯？」`,
iq:`我現在用什麼模型解釋這件事情？|這個模型能解釋Reality嗎？|它能預測下一次嗎？|有沒有重要變數被我的模型漏掉？|如果我已經很努力但Outcome仍沒改善，是不是模型本身有問題？`,
ic:`拿錯地圖，越努力可能離目的地越遠。`,
rp:`人生地圖畫錯。`,ri:`如果一直努力卻沒改善，是不是地圖本身錯了？`,rc:`越努力可能離目標越遠。`,
rm:`畫出Input→Mechanism→Outcome|列出被忽略的Variable|至少建立兩個競爭模型|比較哪個模型預測Reality更準|模型越複雜不代表越好|定期刪除沒有預測價值的Node`,rk:`不要保護模型，要讓Reality淘汰模型。`,
cs:`以為英文不好只是單字背太少，其實問題是長句解析|以為體重增加只是吃太多，忽略睡眠、活動與其他因素|以為孩子懶，其實他根本不知道怎麼開始|以為商品賣不好是價格太高，其實客戶根本不知道為什麼需要|以為夫妻一直吵是溝通技巧差，其實真正問題可能是Boundary|以為自己需要更努力，其實真正問題是工作系統設計`,
cc:`努力增加，Outcome卻沒有改善。`,cr:`至少建立兩個競爭模型，再看哪個更能解釋Reality。`,cl:`努力沒有錯，錯的可能是地圖。`,
dx:`我現在到底用什麼邏輯解釋這個問題？|這套解釋真的能說明目前所有重要Evidence嗎？|是不是有重要Variable被我漏掉？|我已經增加很多Effort，Outcome卻沒有明顯改善嗎？|有沒有另一個Model能更簡單、更完整地解釋Reality？`,dr:`YES多→不要繼續只加努力，先重畫Map。`,
q:`我已經很努力，但同一問題仍長期沒有改善。|我通常只有一種方式解釋問題。|當結果不如預期，我第一反應是更努力，而不是檢查原本Model。`,qy:`可能不是努力不足，而是Map需要更新。`,
ac:`畫出「我認為A為什麼造成B」。|至少建立Model A／Model B。|列出每個Model預測什麼。|找可以區分兩個Model的Evidence。|Reality支持誰，就提高誰的權重。`,
da:`遇到卡關問：「還有另一個模型嗎？」`,sy:`建立Model Version Control。`,kp:`模型能更準確Explain＋Predict。`,al:`不要保護自己的地圖，要讓Reality修改地圖。`,
lk:`越努力，Outcome仍不改善`,core:`建立競爭模型`,pr:`RP06 Competing Model`,fa:`建立Model A／B`});

e({n:7,lv:1,en:`PREDICTION`,zh:`預測錯誤`,sub:`我以為，結果不是`,def:`Prediction＝預測＝事情發生以前，你認為接下來會怎樣。`,
pl:`人生每天其實都在預測。`,
mi:`以為一小時做得完，結果三小時|以為學生會自己讀，結果沒有|以為對方一定會理解|以為買了課程自己就會改變|以為這個產品大家一定喜歡|以為自己明天一定有時間|以為事情一定很糟，結果根本沒事|以為一定成功，所以沒有Plan B`,
co:`時間失控|承諾跳票|錯失機會|成本增加|失望增加|如果長期不校準Prediction，人會一直高估或低估Reality`,
up:`Prediction Error不是失敗，而是免費的校準資料。`,
iq:`事情發生以前，我原本以為會怎樣？|實際發生什麼？|兩者最大的Gap在哪裡？|我高估了什麼？|我低估了什麼？|下一次我要怎麼調整Prediction？`,
ic:`時間、成本、期待與Reality長期錯位。`,
rp:`我以為，結果不是。`,ri:`預測與Reality到底差多少？`,rc:`期待、成本、時間長期錯位。`,
rm:`重要事情先寫Prediction|盡量寫成數字或範圍|事後記錄Actual Result|比較Prediction vs Reality|找自己長期高估／低估Pattern|下一輪調整Prediction`,rk:`不要怕猜錯，要讓每次猜錯都校準下一次。`,
cs:`以為作業一小時完成，結果三小時|以為學生一定會自己預習，結果大部分沒有|以為商品一上架大家就會買|以為孩子上大學後一定適應得很好|以為這次旅行花兩萬元，最後花四萬元|以為自己明天一定有時間，結果行程又塞滿`,
cc:`時間、金錢、期待與Reality反覆錯位。`,cr:`Prediction先寫下來→Actual記錄→比較Gap→校準下一次。`,cl:`猜錯不可怕，永遠不校準才昂貴。`,
dx:`事情發生以前，我原本預測什麼？|Actual Result與Prediction差多少？|我是不是經常低估時間、成本或難度？|我是不是經常高估自己或別人的執行程度？|同類Prediction Error是不是已經發生很多次？`,dr:`YES多→需要Calibration校準，而不是責怪自己。`,
q:`我常低估事情需要的時間或成本。|我常高估自己或別人會完成事情的程度。|類似事情發生時，我的預測常出現相似落差。`,qy:`建立Prediction→Actual校準。`,
ac:`事情開始前先寫Prediction。|盡量數字化：時間、金額、成功率、完成量。|結束後記Actual。|計算Gap。|標記高估／低估Pattern。`,
da:`每天至少做一個小Prediction。`,sy:`建立Prediction Log。`,kp:`同類Prediction Error逐漸縮小。`,al:`成長就是下一次猜得比這一次更準。`,
lk:`「我以為」與Reality不同`,core:`Prediction Calibration`,pr:`RP07 Prediction Calibration`,fa:`寫Prediction vs Actual`});

e({n:8,lv:1,en:`CAUSAL`,zh:`因果錯誤`,sub:`把一起發生誤認成誰造成誰`,def:`Causal＝因果＝A到底是不是造成B的原因。`,
pl:`兩件事情一起發生，不代表其中一件造成另一件。`,
mi:`吃某營養素後舒服＝一定完全是它造成|學生手機多＝成績差一定全部因為手機|夫妻吵架＝一定是其中一個人的個性|業績下降＝一定是價格問題|睡不好＝一定是缺某一種營養素|成功人士做某件事＝我照做也一定成功`,
co:`找錯原因就會治錯地方|花很多錢、時間、力氣，真正Bottleneck完全沒動`,
up:`問：還有哪些變數可能同時造成這個結果？`,
iq:`A真的造成B，還是只是一起發生？|有沒有第三個因素同時影響A與B？|因果方向有沒有可能相反？|我是不是因為事情先後發生，就認為前者造成後者？|如果拿掉這個因素，結果真的會改變嗎？`,
ic:`原因找錯→解法跟著錯。`,
rp:`可能把一起發生誤認成誰造成誰。`,ri:`A真的造成B嗎？`,rc:`原因找錯，所有解法跟著錯。`,
rm:`至少提出3個可能原因|檢查第三變項|檢查反向因果|一次只改一個主要Variable|觀察Before／After|能做小實驗就先做小實驗`,rk:`相關先保留，因果慢一點下結論。`,
cs:`吃了某補充品後睡好→立刻認定100%是它造成|換老師後孩子成績下降→全部怪老師|換工作後身體不舒服→認定工作就是唯一原因|某成功人士每天五點起床→認為五點起床會讓人成功|業績下降後剛好漲價→認定一定都是價格造成|學生開始用手機後成績下降→把所有原因歸給手機`,
cc:`原因找錯→Intervention也錯。`,cr:`多原因假設＋第三變項＋反向因果＋小型Experiment。`,cl:`同時發生，不代表誰造成誰。`,
dx:`我有證據證明A造成B嗎？|還是A與B只是剛好一起發生？|有沒有第三個Variable可能同時影響兩者？|因果方向有沒有可能完全相反？|如果移除A，我真的有理由預期B會跟著改變嗎？`,dr:`答不出來→暫時使用「可能相關」，不要升級成「一定因果」。`,
q:`兩件事情接連發生時，我容易認為前者造成後者。|看到某方法有效，我容易直接認定它就是主要原因。|我很少主動尋找其他可能原因或第三變項。`,qy:`先說「可能相關」，不要太快升級成「一定因果」。`,
ac:`不要寫「A造成B」，先寫「A可能與B有關」。|至少列3個Alternative Causes。|找第三變項。|檢查反向因果。|能控制時，一次改少量主要Variable。`,
da:`看到「因為」時，多問一次「真的嗎？」`,sy:`建立Small Experiment思維。`,kp:`錯誤歸因下降。`,al:`相關可以快速發現，因果要慢慢確認。`,
lk:`把相關當因果`,core:`替代原因＋第三變項＋實驗`,pr:`RP08 Causal Check`,fa:`列3個可能原因`});

e({n:9,lv:2,en:`STATE`,zh:`狀態錯誤`,sub:`在錯的身心狀態做重要決定`,def:`State＝狀態＝此刻身體＋情緒＋神經系統＋注意力的整體情況。`,
pl:`同一個你，在不同State下其實像不同版本的人。`,
mi:`很累時談離婚|很氣時傳重要訊息|焦慮時做投資決策|孤單時做關係決策|失眠後認定人生沒有希望|興奮時大量購物|壓力大時亂吃|身體不舒服時否定自己`,
co:`短期State變成永久Decision|幾小時的情緒可能造成幾年的後果`,
up:`重大Decision之前先問：現在這個State適合決策嗎？`,
iq:`我現在累嗎？|我現在生氣、焦慮、孤單或過度興奮嗎？|睡一晚之後，我還會做同樣決定嗎？|這是長期判斷，還是暫時State產生的反應？|這件事情真的需要現在決定嗎？`,
ic:`幾小時的State可能造成幾年的Decision。`,
rp:`用暫時狀態做永久決定。`,ri:`睡一晚後，我還會這樣決定嗎？`,rc:`幾小時State造成幾年後果。`,
rm:`HALT檢查：餓、怒、孤單、累|重大Decision延遲|先睡眠／補水／吃飯／活動|情緒高峰不發永久訊息|恢復Baseline再重新評估|建立自己的Decision State標準`,rk:`先調State，再談Strategy。`,
cs:`半夜失眠時覺得人生完了|夫妻大吵時立刻傳很重的訊息|工作累爆時決定辭職|考試前焦慮就認定自己一定不會|很孤單時重新聯絡明知不適合的人|投資大漲時過度興奮繼續加碼`,
cc:`Temporary State→Permanent Consequence。`,cr:`先睡、吃、休息、調節→回Baseline後再決策。`,cl:`不要讓今晚的你，替未來五年的你做所有決定。`,
dx:`我現在是不是很累、很餓、很痛、失眠或身體不舒服？|我現在是不是非常生氣、焦慮、孤單或興奮？|這個Decision一定要現在做嗎？|如果睡一晚、休息一天，我還會做同樣Decision嗎？|我是不是正在把Temporary State解讀成Permanent Reality？`,dr:`YES多→先Regulate State，再Decision。`,
q:`很累、失眠、餓或身體不舒服時，我仍會做重要Decision。|我常在情緒最高點決定重要事情。|休息後，我常發現自己昨天其實想得太嚴重。`,qy:`先Regulate State，再Decision。`,
ac:`做HALT：餓？怒？孤單？累？|State 0～10打分。|高壓State不做不可逆Decision。|先睡、吃、喝水、走動、休息。|回Baseline再重新評估。`,
da:`早／午／晚各記一次State。`,sy:`建立自己的Decision Ready標準。`,kp:`衝動後悔Decision下降。`,al:`先調State，再調人生。`,
lk:`累、餓、焦慮時做重大決定`,core:`先回Baseline`,pr:`RP09 State Reset`,fa:`HALT檢查`});

e({n:10,lv:2,en:`EMOTION`,zh:`情緒錯誤`,sub:`把情緒當命令或真相`,def:`Emotion＝情緒＝身心系統提供的一種訊號，不是絕對命令。`,
pl:`害怕不代表不能做。生氣不代表對方一定錯。難過也不代表人生失敗。`,
mi:`焦慮→逃避|生氣→攻擊|內疚→答應不想答應的事|害怕→永遠不開始|孤單→回到不適合的關係|羞恥→隱藏問題`,
co:`情緒從Signal變成Driver|最後不是「我有情緒」，而是「情緒開我的車」`,
up:`Emotion→它想告訴我什麼Need／Threat／Loss／Boundary？`,
iq:`我現在真正感受到什麼？|這個Emotion想提醒我什麼？|它代表Threat、Loss、Need還是Boundary？|我是在讀取情緒，還是在服從情緒？|情緒降低後，我還會做同樣行動嗎？`,
ic:`情緒從Signal變成Driver。`,
rp:`情緒從訊號變成司機。`,ri:`我是感受到情緒，還是正在服從情緒？`,rc:`衝動、逃避、攻擊、討好。`,
rm:`先命名Emotion|0～10評估強度|找出Need／Threat／Loss／Boundary|高於7分先不做重大Action|用身體調節降低Arousal|情緒下降後重新決策`,rk:`Emotion可以報警，但不能單獨掌方向盤。`,
cs:`焦慮→不敢打開成績|生氣→立刻回嗆|內疚→答應自己根本不想做的事情|害怕失敗→一直不開始|孤單→接受不健康的關係|羞恥→不敢求助`,
cc:`Emotion從Signal變成Driver。`,cr:`命名Emotion→判斷Need／Threat／Loss／Boundary→降強度→再Action。`,cl:`情緒可以提醒你，但不要讓它獨自握方向盤。`,
dx:`我現在能清楚說出自己的Emotion嗎？|我的Action是在回應Reality，還是在逃離Emotion？|我是不是因為害怕就不做、因為生氣就攻擊、因為內疚就答應？|Emotion強度如果從8降到3，我還會做同樣選擇嗎？|這個Emotion真正提示的是Need、Threat、Loss還是Boundary？`,dr:`Emotion直接決定Action→先把Signal與Command分開。`,
q:`害怕時，我容易直接逃避。|生氣、內疚或焦慮時，我容易立刻採取行動。|我很少先問「這個Emotion到底想提醒我什麼？」`,qy:`Emotion先當Signal，不直接當Command。`,
ac:`說出：「我現在感到＿＿。」|Emotion強度0～10。|辨識Threat／Loss／Need／Boundary。|7分以上不做重大回應。|降到4分以下再選Action。`,
da:`Emotion→Signal→Need三步紀錄。`,sy:`建立Emotion Vocabulary＋Regulation Toolkit。`,kp:`Emotion仍存在，但不再直接控制Action。`,al:`感受它，不等於服從它。`,
lk:`情緒直接變Action`,core:`Emotion當Signal，不當Command`,pr:`RP10 Emotion Signal`,fa:`命名情緒＋0～10分`});

e({n:11,lv:2,en:`IDENTITY`,zh:`身份錯誤`,sub:`把一個結果變成「我是什麼人」`,def:`Identity＝身份認同＝「我是誰」的內在故事。`,
pl:`你做錯一件事，不代表你就是錯的人。`,
mi:`考差＝我是笨學生|離婚＝我是失敗者|生病＝我是病人|被拒絕＝我沒有價值|收入低＝我能力差|以前失敗＝我就是不適合`,
co:`最危險的不是失敗|而是Error被寫進Identity|一旦Identity固定，行為會開始配合它`,
up:`把「我是＿＿的人」改成「我目前在＿＿這件事上還缺＿＿能力」。`,
iq:`我是不是因為一件事情就定義自己？|我是在說「我做不好」，還是「我就是不好」？|這是能力不足，還是人格判決？|如果能力可以訓練，這個Identity還成立嗎？|我現在需要改Identity，還是補Capability？`,
ic:`Error被寫進Identity後，人會開始活成那個標籤。`,
rp:`把「做不好」變成「我不好」。`,ri:`這是能力問題，還是我正在做人格判決？`,rc:`錯誤被寫進Identity。`,
rm:`「我是」改成「我目前」|人格標籤改成Skill Gap|找反例|建立成長證據庫|Identity使用可更新語言|以Behavior而不是Label描述自己`,rk:`Identity保持流動，Capability持續增加。`,
cs:`英文考40分→「我是英文白痴。」|生意失敗→「我沒有商業能力。」|離婚→「我是失敗的女人。」|被拒絕→「我沒有魅力。」|孩子出問題→「我是失敗的媽媽。」|工作犯錯→「我就是很粗心。」`,
cc:`Label開始控制未來Behavior。`,cr:`「我是」改成「我目前在＿＿能力不足」。`,cl:`錯的是一次Output，不要把它寫進Identity。`,
dx:`我是不是因為一次Outcome就說「我就是＿＿的人」？|我把Skill Gap變成人格評價了嗎？|我是否使用笨、懶、失敗、沒用等固定Label描述自己？|如果這個能力經過訓練可以改善，那個Identity還成立嗎？|我需要改變的是「我是誰」，還是某個Specific Skill？`,dr:`YES多→Identity先解綁，轉成Capability問題。`,
q:`失敗後，我容易說「我就是不行」。|我常用笨、懶、沒用、失敗等Label描述自己。|我容易把目前能力不足解釋成自己天生就是如此。`,qy:`Identity→Skill Gap。`,
ac:`抓出「我就是＿＿」。|改成「我目前在＿＿有Skill Gap」。|找3個反例。|指定一個可訓練Capability。|安排一次小成功。`,
da:`記錄一個能力進步Evidence。`,sy:`建立Capability Portfolio能力資產表。`,kp:`固定Label↓、可訓練Skill↑。`,al:`不要修理Identity，訓練Capability。`,
lk:`「做不好」變成「我不好」`,core:`Identity→Skill Gap`,pr:`RP11 Identity Decoupling`,fa:`「我是」改成「我目前」`});

e({n:12,lv:2,en:`NEED`,zh:`需求錯誤`,sub:`不知道自己真正缺什麼`,def:`Need＝需求＝系統真正需要補足的東西。`,
pl:`你以為自己要的是A，其實真正缺的是B。`,
mi:`一直購物，其實需要安慰|一直吃，其實需要休息|一直找伴侶，其實需要安全感|一直滑手機，其實想逃避壓力|一直工作，其實需要被肯定|一直控制孩子，其實自己害怕失控`,
co:`真正需求永遠沒被滿足|所以同一行為會一直重複`,
up:`問：我真正想從這件事情得到什麼？`,
iq:`我真正想從這件事得到什麼？|我要的是物品，還是物品帶來的感受？|我要的是對方，還是安全感／認同／陪伴？|目前這個Strategy真的能滿足Need嗎？|有沒有成本更低、更健康的方法滿足同一Need？`,
ic:`真正需求沒被滿足，同樣行為就會一直重複。`,
rp:`想要的東西不一定是真正需要的東西。`,ri:`我真正想從這件事情得到什麼？`,rc:`一直追A，真正缺的B始終沒有補到。`,
rm:`區分Need與Strategy|連續問3次「我為什麼想要？」|找最底層Need|同一Need列出3種滿足方式|優先低成本、低傷害方案`,rk:`不要執著某個方法，回到真正需求。`,
cs:`壓力大一直吃，其實真正需要休息|一直購物，其實需要安慰與新鮮感|一直要求伴侶陪，其實需要安全感|不停工作，其實想得到肯定|一直滑手機，其實在逃避難題|一直控制孩子，其實自己害怕失去控制`,
cc:`表面Strategy重複，底層Need永遠沒有滿足。`,cr:`連問三次「我真正想得到什麼？」`,cl:`別只追想要的東西，要找它背後真正的需要。`,
dx:`我真正想從這件事情得到什麼？|如果得到它，我真正想獲得的是哪種感受？|我現在追的是Need，還是滿足Need的一種Strategy？|有沒有另外三種方式可以滿足同一Need？|我是不是反覆得到想要的東西，卻仍然不滿足？`,dr:`最後一題YES→很可能真正Need沒有被找到。`,
q:`我常很想得到某個東西，得到後卻沒有真正滿足。|壓力大時，我容易用吃、買、滑手機、工作或找人陪來處理。|我很少問自己「我真正需要的是什麼？」`,qy:`從Want往下找Need。`,
ac:`問：「我想要這個，是因為什麼？」|連續問3次Why。|找到最底層Need。|同一Need列3種Strategy。|選成本最低、傷害最小的方法。`,
da:`衝動出現時先問Need。`,sy:`建立Personal Needs Map。`,kp:`重複補償行為下降。`,al:`Strategy可以換，Need要先看見。`,
lk:`一直追Want卻仍不滿足`,core:`Want→Core Need`,pr:`RP12 Need Discovery`,fa:`連問3次Why`});

e({n:13,lv:2,en:`VALUE`,zh:`價值排序錯誤`,sub:`嘴巴說重要，資源卻投到別處`,def:`Value＝價值＝真正值得你投入生命資源的東西。`,
pl:`時間、金錢、注意力放在哪裡，才比較接近你真正的Priority。`,
mi:`說健康重要，卻長期不睡覺|說家人重要，卻沒有相處時間|說學習重要，每天滑手機三小時|說自由重要，卻持續增加負債|什麼都重要，所以什麼都做不好`,
co:`人生資源被低價值事情吃掉|最後不是沒有時間，而是沒有Priority`,
up:`看Calendar＋Money＋Attention，而不只看自己嘴巴說什麼。`,
iq:`我說什麼最重要？|我的時間實際花在哪裡？|我的錢實際花在哪裡？|我的Attention實際放在哪裡？|這三者與我宣稱的Value一致嗎？`,
ic:`生命資源被低價值事情慢慢吃掉。`,
rp:`嘴巴說重要，資源卻沒有給它。`,ri:`Calendar、Money、Attention與我的Value一致嗎？`,rc:`生命資源慢慢流向不重要的地方。`,
rm:`列Top 5 Values|強迫排序|檢查時間配置|檢查金錢配置|檢查注意力配置|刪除與核心Value衝突的承諾`,rk:`真正的Value，看資源流向就知道。`,
cs:`說健康第一，卻每天凌晨兩點睡|說家庭重要，週末永遠工作|說學習重要，每天短影音三小時|說財務自由重要，每月卻全部花光|說學生重要，課堂時間卻全拿來趕進度|說自己最重要，卻永遠最後才照顧自己`,
cc:`生命資源被非核心事項吸走。`,cr:`檢查Calendar＋Money＋Attention。`,cl:`真正的Value不在嘴巴，在資源流向。`,
dx:`我嘴巴說最重要的是什麼？|過去一週最多Time花在哪裡？|Money主要流去哪裡？|Attention主要被什麼占據？|Time／Money／Attention與我宣稱的Value一致嗎？`,dr:`不一致→不是時間問題，而可能是Value Allocation問題。`,
q:`我說很重要的事情，實際投入時間卻很少。|我的Money與Attention常流向自己嘴巴說「沒那麼重要」的事情。|我常因為所有事情都重要，而不知道該放棄什麼。`,qy:`重新排序Value與資源。`,
ac:`列Top 5 Values。|強迫1～5排序。|比較過去一週Time。|比較Money。|比較Attention。`,
da:`今天至少一件事服務Top Value。`,sy:`每月做Value→Resource Audit。`,kp:`說重要的事情真的獲得資源。`,al:`價值不是口號，是資源配置規則。`,
lk:`嘴巴重要，資源沒投入`,core:`Value與資源重新對齊`,pr:`RP13 Value Alignment`,fa:`查Time／Money／Attention`});

e({n:14,lv:3,en:`DECISION`,zh:`決策錯誤`,sub:`選擇方法出了問題`,def:`Decision＝決策＝在不同Options之間配置資源。`,
pl:`不是每個決定都要想很久，而是重要決定要用對方法。`,
mi:`沒有比較方案|因為已經花很多錢所以繼續|害怕損失所以不敢改|第一個想到的方案直接做|小事想半年，大事五分鐘決定|沒有退出條件|只看眼前舒服|沒想最壞情況`,
co:`錯誤決策×時間＝負複利|越晚修正，退出成本通常越高`,
up:`Options→Cost→Risk→Reversibility→Decision。`,
iq:`我真的比較過Options嗎？|我是不是只想到一個方案？|最壞結果我承受得起嗎？|這個Decision可逆嗎？|我是不是因為已經投入很多，所以不敢退出？|Opportunity Cost是什麼？`,
ic:`錯誤Decision×時間＝負複利。`,
rp:`選擇機制出了問題。`,ri:`我真的比較過不同Options嗎？`,rc:`錯誤決策隨時間產生負複利。`,
rm:`至少列3個Options|比較收益／成本／風險|標示可逆／不可逆|可逆決策快速小試|不可逆決策降低速度|事先設定Stop Rule|問Opportunity Cost`,rk:`小事快試，大事慢決。`,
cs:`朋友推薦就買昂貴產品|股票虧很多，因為捨不得認賠一直加碼|工作不適合，因為做十年了不敢離開|第一個想到的解法直接執行|可逆的小決定想三個月|不可逆的大決定五分鐘就做`,
cc:`錯Decision經過時間產生負複利。`,cr:`Options→Cost→Risk→Reversibility→Stop Rule。`,cl:`不要因為走很久，就忘了問方向對不對。`,
dx:`做Decision前我列過其他Options嗎？|我有比較Cost／Benefit／Risk嗎？|我知道這個Decision可逆還是不可逆嗎？|我是不是因為已經投入很多而不願退出？|我有事先設定Stop Rule嗎？`,dr:`YES不足→Decision Process需要正則化。`,
q:`重要Decision前，我通常沒有列出其他Options。|已經投入很多時間或Money時，我很難停止。|我很少事先設定「什麼情況下我要退出」。`,qy:`建立Options＋Risk＋Stop Rule。`,
ac:`至少列3個Options。|每個Option列Benefit／Cost／Risk。|標記可逆／不可逆。|可逆Decision快速小試。|不可逆Decision增加Evidence。|事先寫Stop Rule。`,
da:`重要Decision留下Decision Log。`,sy:`建立Decision Review。`,kp:`後悔Decision與沉沒成本追投下降。`,al:`決策不是猜答案，而是管理Options與Downside。`,
lk:`沒有比較Options就決定`,core:`Options＋Risk＋Reversibility`,pr:`RP14 Decision Quality`,fa:`至少列3個Options`});

e({n:15,lv:3,en:`STRATEGY`,zh:`策略錯誤`,sub:`方向可能對，但方法不對`,def:`Strategy＝策略＝你準備用什麼路徑達成目標。`,
pl:`努力不是唯一變數。`,
mi:`學生不會→叫他再讀十遍|賣不動→一直降價|關係不好→一直忍耐|工作太多→每天加班|減肥失敗→更極端節食|APP沒人用→繼續增加功能`,
co:`努力越多，成本越高|但Outcome沒有改善`,
up:`Outcome沒變時，不要只增加Effort，要換Strategy。`,
iq:`我的Goal是什麼？|目前Strategy真的讓我靠近Goal嗎？|Outcome沒有改善，我是不是只是不斷增加Effort？|有沒有成本更低的路？|真正Leverage Point在哪裡？`,
ic:`努力很多，成果卻沒有同比增加。`,
rp:`方向可能對，走法不對。`,ri:`努力增加後，Outcome真的增加嗎？`,rc:`投入越來越多，成果停滯。`,
rm:`明確定義Outcome|追蹤Strategy→Outcome|設定失效門檻|失效就換策略，不只加努力|尋找Leverage Point|一次做小規模A/B Test`,rk:`成果不動，先換方法，不要只加力氣。`,
cs:`英文不好→每天多背100個單字，但問題其實是閱讀|商品賣不好→一直降價|孩子不讀書→一直罵|工作做不完→一直加班|體重沒變→越吃越少|APP使用率低→一直增加功能`,
cc:`Effort↑，Outcome卻沒有同步↑。`,cr:`設定失效門檻→Outcome不動就換Strategy。`,cl:`卡住時不要只踩油門，也要檢查路線。`,
dx:`我的Goal清楚嗎？|目前Strategy真的改善Outcome嗎？|沒有改善時，我是不是只會投入更多Effort？|我有沒有試過完全不同的Strategy？|真正Leverage Point可能在哪裡？`,dr:`Effort↑但Outcome不動→高度懷疑Strategy Error。`,
q:`方法沒效時，我通常只是更加努力。|我很少設定「做到什麼程度還沒效就換Strategy」。|我經常投入很多，Outcome卻長期沒有同比改善。`,qy:`Effort先停一下，檢查Strategy。`,
ac:`先定義真正Outcome。|列目前Strategy。|檢查投入增加後Outcome有沒有增加。|列3個Alternative Strategies。|找Leverage Point。|設定Strategy Stop Rule。`,
da:`問：「我是在加努力，還是在提高槓桿？」`,sy:`建立Strategy Experiment Bank。`,kp:`單位Effort產生更多Outcome。`,al:`不是更用力，是更有效。`,
lk:`沒效只會更加努力`,core:`換Strategy＋找Leverage`,pr:`RP15 Strategy Switching`,fa:`列3種替代Strategy`});

e({n:16,lv:3,en:`ACTION`,zh:`行動錯誤`,sub:`知道很多，但沒有變成行為`,def:`Action＝行動＝真正改變Reality的操作。`,
pl:`懂了不等於做了。`,
mi:`收藏很多文章|買很多課沒完成|知道要運動但沒開始|計畫寫得很漂亮卻沒有第一步|等有空再做|要求一次做到完美`,
co:`Knowledge增加，Reality不變|容易產生「我懂很多，所以我應該有進步」的錯覺`,
up:`每個Insight後面一定接一個24小時Minimum Action。`,
iq:`我知道之後實際做了什麼？|下一個Action清楚嗎？|是不是太大所以一直拖？|24小時內最小可以做什麼？|我是在準備，還是在真正行動？`,
ic:`Knowledge增加，Reality不變。`,
rp:`知道很多但沒有做。`,ri:`24小時內，我到底會做什麼？`,rc:`Knowledge增加，Reality不變。`,
rm:`每個Insight接一個Action|Action縮到15分鐘可開始|寫清楚When／Where|降低開始摩擦|先完成再優化|完成後立即Feedback`,rk:`沒有Action的Insight只是資訊。`,
cs:`收藏50篇運動文章，沒有運動一次|買線上課程卻一直沒打開|列了完整減重計畫，明天再開始|想做APP半年，一直研究架構|知道該和孩子談，卻一直等完美時機|每天研究時間管理，行程還是沒改`,
cc:`Knowledge↑，Reality＝原地。`,cr:`所有Insight後面接一個15分鐘Minimum Action。`,cl:`第一步小到不能失敗，比完美計畫重要。`,
dx:`我已經知道很多，但Reality真的改變了嗎？|我現在能說出下一個具體Action嗎？|這個Action是否小到今天就能開始？|我是不是一直準備、規劃、研究，卻沒有真正開始？|24小時內可以完成的Minimum Action是什麼？`,dr:`知道很多＋行為沒變→Action Bottleneck。`,
q:`我知道很多方法，但真正執行的不多。|我常花很多時間規劃，卻遲遲沒有開始。|現在問我24小時內要做什麼，我常說不出具體Action。`,qy:`把Insight縮成Minimum Action。`,
ac:`把Goal切成15分鐘Action。|明確寫When／Where／What。|五分鐘內能開始就立刻開始。|先做Minimum Viable Action。|完成後立即記Feedback。`,
da:`每天至少完成一個關鍵Minimum Action。`,sy:`Insight後強制連Action欄。`,kp:`知道→做到的轉換率提高。`,al:`不能轉成Action的知識，暫時改不了Reality。`,
lk:`知道很多卻沒做`,core:`Minimum Action`,pr:`RP16 Minimum Action`,fa:`切成15分鐘行動`});

e({n:17,lv:3,en:`HABIT`,zh:`習慣錯誤`,sub:`一直靠意志力硬撐`,def:`Habit＝習慣＝在固定Cue下自動出現的行為。`,
pl:`真正穩定的行為不是每天逼自己。`,
mi:`手機放枕頭旁卻要求自己不要滑|零食放桌上卻要求不要吃|運動器材收很遠|一次想改十個習慣|中斷一天就全部放棄`,
co:`每天都在消耗Willpower|久了系統一定回到低阻力路徑`,
up:`不要只改人，要改Environment＋Cue＋Friction。`,
iq:`什麼Cue會觸發舊習慣？|壞習慣是不是太容易做？|好習慣是不是太麻煩？|環境能不能直接重新設計？|我是不是一次要求自己改太多？`,
ic:`Willpower耗盡後，系統回到原本路徑。`,
rp:`一直靠意志力。`,ri:`環境是不是每天都在觸發舊行為？`,rc:`Willpower耗盡後回到原路。`,
rm:`找Cue|移除壞Cue|提高壞行為Friction|降低好行為Friction|建立替代行為|一次只改1～2個Habit|中斷後立即Restart，不做全有全無`,rk:`改Environment，比罵自己有效。`,
cs:`手機放床邊要求自己不要滑|桌上全是零食要求自己節制|跑鞋收在櫃子最深處卻想天天跑步|一次決定戒糖、運動、早睡、讀書全部一起來|一天沒做到就整個放棄|每次都說「明天我一定更有自制力」`,
cc:`Willpower耗盡→回到最低阻力路徑。`,cr:`Cue＋Environment＋Friction＋Replacement Behavior。`,cl:`不要每天跟自己打仗，重新設計戰場。`,
dx:`什麼Cue最容易觸發這個行為？|錯誤行為是不是非常容易做？|正確行為是不是步驟太多？|我是不是一直依靠Willpower？|如果重新設計Environment，這個Habit會不會容易很多？`,dr:`YES多→不要再罵自己，先改Environment。`,
q:`我改習慣主要靠「這次一定要有自制力」。|誘惑通常就在手邊，而正確行為反而很麻煩。|中斷一天後，我很容易整個放棄。`,qy:`不要只改Willpower，要改Cue與Environment。`,
ac:`找出Cue。|移除壞Cue。|增加壞習慣Friction。|降低好習慣Friction。|設計Replacement Behavior。|Never Miss Twice。`,
da:`記錄Cue→Behavior→Reward。`,sy:`Environment Default Design。`,kp:`不靠意志力也能維持。`,al:`讓正確行為成為最容易的行為。`,
lk:`完全靠意志力`,core:`Cue＋Friction＋Environment`,pr:`RP17 Habit Environment`,fa:`移除一個壞Cue`});

e({n:18,lv:3,en:`TIME`,zh:`時間錯誤`,sub:`不是沒時間，是估錯時間與優先級`,def:`Time Error＝時間配置錯誤。`,
pl:`時間估錯、排錯、塞太滿。`,
mi:`事情永遠排太滿|沒有Buffer|所有事情都說緊急|最清醒的時間拿去回訊息|重要事情一直延後|低估完成任務所需時間`,
co:`每天趕|長期焦慮|品質下降|重要但不緊急的事情永遠沒有開始`,
up:`Priority＋Time Block＋Buffer。`,
iq:`這件事真的重要嗎？|還是只是Urgent？|我估的時間符合過去Reality嗎？|有Buffer嗎？|今天最好的時間是不是花在最重要的事情？`,
ic:`每天很趕，真正重要的事情卻一直沒有完成。`,
rp:`時間估錯、排錯、塞太滿。`,ri:`重要的事情真的拿到時間了嗎？`,rc:`永遠很趕，核心任務永遠延後。`,
rm:`過去實際時間×1.2～1.5估算|每天保留Buffer|先排Important再排Urgent|設定Time Block|限制每日核心任務數量|週末比較預估時間與實際時間`,rk:`不要把一天排滿，要讓系統有Buffer。`,
cs:`排10件事給今天的自己|每次都以為30分鐘能完成，實際90分鐘|行程完全沒有Buffer|早上最清醒的一小時拿去回LINE|重要計畫一直被小事情打斷|所有邀約都答應`,
cc:`忙碌、遲到、焦慮、重要事情延後。`,cr:`歷史時間校準＋Time Block＋20～30% Buffer。`,cl:`排滿不是效率，是系統沒有容錯。`,
dx:`我是不是經常低估事情需要的時間？|Calendar是不是長期排滿？|我有保留Buffer嗎？|最清醒的時間有沒有給最重要的事情？|我每天完成很多事情，卻沒完成真正重要的事情嗎？`,dr:`YES多→重新做Priority＋Time Calibration。`,
q:`我經常把一天排得很滿。|事情實際需要的時間通常比我估計更久。|重要但不緊急的事情常被我一直延後。`,qy:`Time Calibration＋Buffer。`,
ac:`今天只保留Top 3。|實際工時以過去紀錄估算。|預留20～30% Buffer。|先排Deep Work。|相似Task Batch處理。`,
da:`晚上比較Estimate vs Actual。`,sy:`建立Personal Time Calibration資料庫。`,kp:`延誤↓、重要任務完成率↑。`,al:`時間管理的核心不是塞更多，是估得更準。`,
lk:`低估時間／沒有Buffer`,core:`時間校準＋Buffer`,pr:`RP18 Time Calibration`,fa:`Estimate vs Actual`});

e({n:19,lv:3,en:`ENERGY`,zh:`能量錯誤`,sub:`只管理時間，沒有管理自己`,def:`Energy＝可用身心資源。`,
pl:`有兩小時不代表那兩小時都有同樣品質。`,
mi:`睡眠不足還要求高效率|一直工作沒有Recovery|最累時處理最難問題|休息時充滿罪惡感|用咖啡硬撐身體訊號`,
co:`注意力下降|判斷力下降|情緒調節下降|錯誤率上升`,
up:`Task要配合Energy State。`,
iq:`現在Energy是高、中還是低？|這個Task需要多少認知能量？|我是不是長期透支？|最近有真正Recovery嗎？|是不是應該先恢復，再處理問題？`,
ic:`判斷力、注意力與情緒調節一起下降。`,
rp:`有時間，卻沒有可用狀態。`,ri:`這個Task與現在Energy匹配嗎？`,rc:`效率、判斷、情緒控制一起下降。`,
rm:`建立Energy Baseline|高能量時做高認知任務|低能量時做例行工作|Recovery正式排入行程|不要長期借未來能量|連續低能量要找底層原因`,rk:`管理Energy，才能真正管理Time。`,
cs:`熬夜後硬做重大決策|最累的晚上寫最難的文章|連續工作七天沒有Recovery|休息時一直覺得自己浪費時間|疲勞只靠咖啡繼續壓|下午低能量還硬排高認知工作`,
cc:`效率、創造力、判斷力與情緒調節同步下降。`,cr:`Energy Baseline＋Task-State Matching＋Recovery。`,cl:`不是每一個小時都有相同價值。`,
dx:`我的Energy現在是高、中還是低？|這個Task需要多少Energy？|Task與State匹配嗎？|我是不是長期靠意志力、咖啡或壓力撐住？|最近有真正Recovery嗎？`,dr:`低Energy＋高Demand→先修Energy，不要只修效率。`,
q:`我常在最累的時候處理最重要的事情。|我很少依照自己的Energy安排不同Task。|休息時我容易有罪惡感，所以長期沒有真正Recovery。`,qy:`Task要與State Matching。`,
ac:`Energy 0～10評分。|高Energy做高認知Task。|低Energy做低認知Task。|低於自己的警戒值先Recovery。|避免長期透支。`,
da:`記錄睡眠／Energy／Task Performance。`,sy:`建立Personal Energy Map。`,kp:`高價值工作與高Energy時段重疊↑。`,al:`時間相同，State不同，產值完全不同。`,
lk:`低Energy硬做高Demand工作`,core:`Task-State Matching`,pr:`RP19 Energy Matching`,fa:`Energy 0～10分`});

e({n:20,lv:3,en:`LEARNING`,zh:`學習錯誤`,sub:`以為看懂就是學會`,def:`Learning＝學習＝未來遇到問題時能真正提取並使用。`,
pl:`把看過當學會。`,
mi:`一直重讀|一直畫重點|看答案覺得「我會」|錯題沒有分類|沒有重新測驗|沒有把知識教給別人`,
co:`考試時「明明看過卻想不起來」|知識很多，Transfer很弱`,
up:`Input→Retrieval→Error→Targeted Practice→Retest。`,
iq:`不看答案，我能自己說出來嗎？|我能自己做題嗎？|我能教別人嗎？|我知道自己錯在哪一類嗎？|三天後Retest還會嗎？`,
ic:`「我明明看過」卻無法真正使用。`,
rp:`把看過當學會。`,ri:`不看答案，我能做出來嗎？`,rc:`熟悉感很高，真正能力很低。`,
rm:`Retrieval Practice主動提取|Spaced Repetition間隔複習|錯題分類|找到Knowledge Gap|Targeted Practice|Retest|教給別人`,rk:`不要問看過幾遍，要問能不能自己叫出來。`,
cs:`課本看五遍卻沒有測自己|答案一看就懂，以為自己會|單字一直重讀，從不遮起來回想|錯題只抄正確答案|考完就把教材丟掉|背得出定義卻不會實際應用`,
cc:`Familiarity熟悉感被誤認成Mastery真正掌握。`,cr:`Retrieval→Error Analysis→Targeted Practice→Retest。`,cl:`真正的會，是答案不在眼前時你仍然叫得出來。`,
dx:`不看資料，我能自己說出來嗎？|換一題我還會嗎？|隔三天我還記得嗎？|我知道自己錯在哪一類嗎？|我能教到別人聽懂嗎？`,dr:`看懂但無法Retrieve／Transfer→尚未Mastery。`,
q:`看答案覺得懂，我就容易認為自己會了。|我的學習以重讀、畫重點為主，很少自己回想或測驗。|錯題做完後，我很少隔幾天Retest。`,qy:`Retrieval→Error Analysis→Practice→Retest。`,
ac:`關掉教材，自我回想。|立即測驗。|錯題做Error Classification。|找到Knowledge Gap。|Targeted Practice。|1天／3天／7天Retest。`,
da:`至少一次Retrieval Practice。`,sy:`建立Error Taxonomy＋Skill Graph。`,kp:`Delayed Retest正確率↑。`,al:`學習不是輸入更多，而是能成功提取與遷移。`,
lk:`看懂＝以為學會`,core:`Retrieval＋Retest`,pr:`RP20 Retrieval Learning`,fa:`關掉教材自己測`});

e({n:21,lv:4,en:`COMMUNICATION`,zh:`溝通錯誤`,sub:`以為我說了，你就應該懂`,def:`Communication＝溝通＝讓雙方內在Model盡量對齊。`,pl:``,
mi:`期待別人讀心|說得模糊卻期待精準結果|只說不確認|只想證明自己對|批評人格而不是行為|情緒最高點談重要問題`,
co:`誤會|衝突|關係磨損|雙方都覺得「我明明已經講了」`,
up:`說明→確認→回述→校準。`,
iq:`我真正想讓對方知道什麼？|我說清楚了嗎？|對方理解的版本是什麼？|我有確認嗎？|現在是在解決問題，還是在證明誰對？`,
ic:`雙方都認為自己講得很清楚，卻活在不同Reality。`,
rp:`我說出去的，不一定是對方收到的。`,ri:`對方理解的版本跟我的版本一樣嗎？`,rc:`誤會、衝突、重工。`,
rm:`先說目的|描述Fact|說Need|提出具體Request|請對方回述理解|發現不同立即校準`,rk:`Communication不是輸出，而是Model Alignment模型對齊。`,
cs:`「你應該知道我要什麼。」|老師說「好好準備」，學生不知道到底準備什麼|夫妻都說「我講過了」，但理解完全不同|主管說「快一點」，員工不知道Deadline|生氣時只批評「你就是很自私」|LINE文字被對方讀成完全不同語氣`,
cc:`雙方Model沒有Alignment。`,cr:`Purpose→Fact→Need→Request→對方回述。`,cl:`說出去不叫溝通，對方收到接近的版本才叫溝通。`,
dx:`我的目的到底是什麼？|我有說Fact還是只說評價？|我的Need與Request清楚嗎？|我知道對方實際理解成什麼嗎？|現在是在Alignment，還是在爭輸贏？`,dr:`雙方版本不同→Communication Error。`,
q:`我常覺得「我明明講過了，他怎麼還是不懂？」|我很少請對方說回他理解到什麼。|衝突時，我容易評論人格而不是描述Fact與Need。`,qy:`做Model Alignment。`,
ac:`先說Purpose。|只描述Fact。|說明自己的Need。|提出Specific Request。|請對方回述理解。`,
da:`重要對話做一次Understanding Check。`,sy:`建立溝通模板。`,kp:`「我以為你知道」型衝突下降。`,al:`Communication＝Model Alignment。`,
lk:`我說的≠對方收到的`,core:`Model Alignment`,pr:`RP21 Model Alignment`,fa:`請對方回述理解`});

e({n:22,lv:4,en:`RELATIONSHIP`,zh:`關係錯誤`,sub:`把愛變成控制、犧牲或索取`,def:`Relationship＝關係＝兩個自主系統長期互動形成的Feedback Loop。`,pl:``,
mi:`討好換愛|控制換安全|犧牲換認同|替別人負責|要求別人改變自己才快樂|沒有Repair`,
co:`累積怨氣|依賴|權力失衡|反覆衝突|最後雙方都失去Agency`,
up:`Connection＋Boundary＋Reciprocity＋Repair。`,
iq:`這段關係有Reciprocity嗎？|我是在愛，還是在討好？|我是在支持，還是在救援？|我是不是希望控制對方來換取安全感？|衝突後有Repair嗎？`,
ic:`愛逐漸變成耗損、控制、依賴與怨恨。`,
rp:`愛可能慢慢變成控制、討好或犧牲。`,ri:`這段關係讓雙方Agency增加還是下降？`,rc:`依賴、怨恨、耗損。`,
rm:`維持Boundary|檢查Reciprocity互惠|停止過度救援|允許Difference|衝突後建立Repair|支持對方Agency而不是接管人生`,rk:`好的關係增加雙方自由度，不是降低自由度。`,
cs:`怕對方離開所以什麼都答應|以愛為理由要求對方照自己的方式生活|替成年孩子處理所有問題|一直付出，心裡卻累積期待|每次衝突都冷戰，從不Repair|只有一方可以有需求`,
cc:`Agency下降、怨氣增加、關係僵化。`,cr:`Boundary＋Reciprocity＋Difference＋Repair。`,cl:`好的關係不是兩個人黏成一個人，而是兩個完整系統能合作。`,
dx:`雙方都能說No嗎？|雙方的Need都有位置嗎？|付出與責任長期是否大致互惠？|我是在支持對方，還是在控制／討好／救援？|衝突後有Repair Mechanism嗎？`,dr:`Agency長期下降→關係結構需要Update。`,
q:`為了維持關係，我常做自己其實不願意做的事情。|我會希望對方改變，自己才有辦法安心。|關係衝突後，我們很少真正Repair。`,qy:`檢查Boundary＋Reciprocity＋Agency。`,
ac:`問：現在是Love、Support、Control、Rescue還是People-Pleasing？|恢復自己的Boundary。|把對方責任還給對方。|允許Difference。|衝突後安排Repair。`,
da:`至少一次直接表達真實Need。`,sy:`建立Relationship Review。`,kp:`雙方Agency↑、控制與討好↓。`,al:`好的關係讓兩個人都更能做自己。`,
lk:`愛變成控制／討好／救援`,core:`Boundary＋Reciprocity＋Repair`,pr:`RP22 Relationship Agency`,fa:`辨識Support還是Control`});

e({n:23,lv:4,en:`BOUNDARY`,zh:`界線錯誤`,sub:`分不清誰的事情誰負責`,def:`Boundary＝界線＝我負責什麼，你負責什麼。`,pl:``,
mi:`不敢說不|別人生氣就妥協|替孩子承擔所有後果|控制別人的選擇|把拒絕當無情`,
co:`過度耗損|關係怨恨|他人失去成長機會|自己也失去自由`,
up:`我負責我的Choice，你負責你的Choice。`,
iq:`這是誰的責任？|我是不是替別人承擔後果？|我是不是要求別人替我的情緒負責？|如果說No，我為什麼害怕？|Boundary是在保護自己，還是在控制對方？`,
ic:`自己耗盡，對方也失去成長機會。`,
rp:`不知道誰該負責什麼。`,ri:`這到底是誰的Choice與Consequence？`,rc:`自己耗盡，別人也無法長大。`,
rm:`畫責任圈|我的選擇我負責|你的選擇你負責|拒絕時不用過度解釋|Boundary說一次後用Action維持|Boundary不能變成控制別人`,rk:`界線不是把人推開，是把責任放回正確位置。`,
cs:`不想參加聚會仍然答應|孩子忘記作業，父母比孩子更焦慮|同事工作沒完成，自己默默全部接走|別人生氣就立刻改變自己的決定|要求伴侶不能跟某些人來往|為家人承擔明明不是自己的債務或責任`,
cc:`一方耗盡，另一方失去Responsibility。`,cr:`責任圈＋Choice歸Choice＋Consequence歸Consequence。`,cl:`界線不是拒絕愛，而是停止責任錯置。`,
dx:`這到底是誰的責任？|誰做Choice？|誰應承擔Consequence？|我是不是因為害怕對方不高興就接手？|我的Boundary是在規範自己的Action，還是在控制對方？`,dr:`責任錯置→Boundary Error。`,
q:`別人不高興時，我很容易撤回自己的決定。|我常替別人承擔原本應由他負責的後果。|我有時會把「我的Boundary」變成「要求你必須怎麼做」。`,qy:`重新分配Choice與Responsibility。`,
ac:`畫Mine／Yours兩欄。|Choice歸誰？|Consequence歸誰？|練習一句清楚的No。|不過度解釋。`,
da:`發現責任錯置就立即歸位。`,sy:`建立Personal Boundary Rules。`,kp:`怨氣↓、過度承擔↓。`,al:`把責任放回正確位置，就是界線。`,
lk:`替別人承擔Choice與後果`,core:`責任歸位`,pr:`RP23 Responsibility Reset`,fa:`畫Mine／Yours`});

e({n:24,lv:4,en:`HEALTH`,zh:`健康錯誤`,sub:`只看症狀，不看整個系統`,def:`Health＝健康＝多系統長期調節能力，不是一個單一數字。`,pl:``,
mi:`沒症狀就認為沒風險|一次檢驗代表永久狀態|只買補充品，不改生活|別人有效就直接照搬|一次改十樣東西|改善後完全不Retest`,
co:`不知道真正有效的是什麼|可能延誤需要專業評估的問題|錢花很多，Baseline與Trend卻完全不知道`,
up:`Baseline→Intervention→Retest→Trend→專業判斷。`,
iq:`我有Baseline嗎？|這是一次數字還是Trend？|我一次是不是改了太多變項？|改善後有Retest嗎？|哪些問題需要醫療專業評估，而不是自己推測？`,
ic:`不知道什麼真正有效，也可能延誤必要處理。`,
rp:`只看單一症狀、單一數字或單一方法。`,ri:`我有Baseline、Trend與Retest嗎？`,rc:`不知道真正有效因素，也可能延誤專業評估。`,
rm:`建立Baseline|一次盡量只改少量主要變數|記錄Intervention|追蹤Trend|設定Retest|紅旗症狀優先尋求醫療評估|補充品不能取代基本生活型態與必要醫療`,rk:`Measure→Change→Retest，不靠感覺猜。`,
cs:`今天血壓高一次就非常恐慌|體重正常就認為一定健康|一次開始六種補充品，改善後不知道哪個有效|朋友有效的方法完全照搬|症狀改善就自行忽略原本需要追蹤的問題|只看補充品，睡眠、活動、飲食完全沒處理`,
cc:`沒有Baseline、沒有因果辨識、沒有Trend。`,cr:`Baseline→少量變項→Track→Retest→必要時專業評估。`,cl:`健康不是猜答案，是持續量測與校準。`,
dx:`我知道自己的Baseline嗎？|現在看到的是單次數字還是Trend？|最近是不是同時改了很多Variable？|我有記錄Before／After嗎？|這個情況是否需要專業醫療評估或檢查？`,dr:`無Baseline＋多變項＋無Retest→很難知道真正Mechanism。`,
q:`我容易因為單次數值或單一症狀就下很大的健康結論。|我曾同時改很多健康方法，最後不知道哪一個有效。|我較少做Baseline→Intervention→Retest的追蹤。`,qy:`健康管理改成Trend＋Retest；需要時加入專業醫療評估。`,
ac:`先建立Baseline。|確認需要追蹤的核心指標。|避免同時亂改太多Variable。|記錄Intervention。|設定Retest日期。|出現警訊或持續異常時尋求合格醫療專業評估。`,
da:`只記真正有Decision Value的健康資料。`,sy:`Baseline→Trend→Intervention→Retest→Model Update。`,kp:`更能辨識什麼有效、什麼無效。`,al:`健康不是追單一漂亮數字，而是提升整體調節與風險管理。`,
lk:`看單一症狀／單一數字`,core:`Baseline→Trend→Retest`,pr:`RP24 Health Baseline`,fa:`先建立Baseline`});

e({n:25,lv:4,en:`MONEY`,zh:`金錢錯誤`,sub:`今天舒服，未來買單`,def:`Money＝金錢＝把現在資源搬到不同時間與用途的配置工具。`,pl:``,
mi:`收入多少就花多少|情緒不好就購物|投資只看報酬|虧損後一直加碼想翻本|沒有預備金|生活水準跟收入同步膨脹`,
co:`自由度下降|風險承受能力下降|未來選擇越來越少`,
up:`Cash Flow→Safety Margin→Long-term Compounding。`,
iq:`我的Cash Flow清楚嗎？|這是Need還是Impulse？|最壞財務結果承受得起嗎？|有Safety Margin嗎？|這筆錢的Opportunity Cost是什麼？`,
ic:`未來的選擇權越來越少。`,
rp:`今天的舒服正在吃掉明天的自由。`,ri:`這個選擇會增加還是降低未來Option？`,rc:`財務自由度下降。`,
rm:`建立Cash Flow|固定Safety Buffer|大額消費延遲24～72小時|投資先問Downside|設定資產集中上限|沉沒成本不列入未來收益判斷`,rk:`金錢的高階功能，是保存未來選擇權。`,
cs:`發薪水後立刻把可用額度當可花額度|心情差就網購|股票跌很多因為不甘心繼續加碼|只看投資報酬，不看最大可能損失|收入增加，支出同步增加|沒有預備金卻做高風險投資`,
cc:`未來Option逐漸減少。`,cr:`Cash Flow＋Safety Margin＋Delay＋Downside Check。`,cl:`金錢最大的價值之一，是保存未來選擇權。`,
dx:`我知道每月Money Flow去哪裡嗎？|這次消費是Need還是Emotion／Impulse？|最壞財務結果我承受得起嗎？|有Emergency／Safety Buffer嗎？|花這筆錢代表放棄什麼其他Option？`,dr:`不知道Opportunity Cost→Decision可能失真。`,
q:`我不太清楚自己每月的Money Flow。|情緒不好或興奮時，我比較容易花錢。|做財務Decision時，我較少想最壞結果與Opportunity Cost。`,qy:`Cash Flow＋Delay＋Safety Margin。`,
ac:`列收入／固定支出／變動支出／負債／儲蓄。|非必要大額消費延遲24～72小時。|先建立Safety Buffer。|投資先看Downside。|計算Opportunity Cost。`,
da:`記錄非必要消費Trigger。`,sy:`建立Cash Flow Dashboard。`,kp:`財務選擇權與緩衝增加。`,al:`先保留選擇權，再追求報酬。`,
lk:`短期舒服犧牲未來自由`,core:`Cash Flow＋Downside＋Buffer`,pr:`RP25 Financial Safety`,fa:`列本月Money Flow`});

e({n:26,lv:4,en:`WORK`,zh:`工作錯誤`,sub:`一直做事，卻沒有建立系統`,def:`Work＝工作＝把時間與能力轉換成Outcome。`,pl:``,
mi:`所有事情自己做|重複工作不做SOP|工時當績效|沒有自動化|沒有累積可重用資產`,
co:`人一停，系統就停|越成功反而越忙`,
up:`Do→Document→Systemize→Automate→Delegate。`,
iq:`這件事情為什麼一直重複做？|可以SOP嗎？|可以Automate嗎？|可以Delegate嗎？|如果我離開一星期，系統還能運作嗎？`,
ic:`人變成系統唯一的零件，越成功反而越忙。`,
rp:`一直做，沒有把工作變成資產。`,ri:`這件事下次還需要從零開始嗎？`,rc:`越成功越忙。`,
rm:`第一次Do|第二次Document|第三次SOP|能Automate就Automate|能Delegate就Delegate|留下Template與Knowledge Asset`,rk:`不要只完成工作，要讓下一次不用重新開始。`,
cs:`同一份資料每個月重新做|只有自己知道流程|每天回答完全相同的問題|所有事情都不敢交給別人|忙到沒有時間改善工作方式|請假一天整個工作流程停擺`,
cc:`自己成為System Bottleneck。`,cr:`Do→Document→Template→SOP→Automate→Delegate。`,cl:`真正高槓桿的工作，是今天做完讓明天少做一次。`,
dx:`這件事情是不是一直重複做？|有沒有SOP？|有沒有Template？|能不能Automate或Delegate？|如果我不在，流程還能運作嗎？`,dr:`只有你能做→你可能已經成為Bottleneck。`,
q:`同樣的工作我經常從頭重新做。|很多事情只有我知道怎麼做。|如果我突然休息一週，很多流程可能停掉。`,qy:`Document→SOP→Automate→Delegate。`,
ac:`找本週最常重複的Task。|第一次Do。|第二次Document。|第三次Template／SOP。|能Automate就Automate。|能Delegate就Delegate。`,
da:`每天把一個工作轉成Reusable Asset。`,sy:`建立Knowledge Base。`,kp:`相同Outcome需要的人力時間下降。`,al:`工作不是一直做，是把做過的事情變成系統。`,
lk:`重複工作永遠自己做`,core:`Document→SOP→Automate`,pr:`RP26 Work Systemization`,fa:`找一件重複Task`});

e({n:27,lv:4,en:`BUSINESS`,zh:`商業錯誤`,sub:`自己覺得好，不等於市場需要`,def:`Business＝商業＝持續替特定人解決願意付費的問題。`,pl:``,
mi:`產品好就認為一定有人買|只看流量|只看營收|不問客戶真正問題|一直新增產品|沒有回購機制`,
co:`庫存增加|行銷成本增加|客戶卻沒有留下來`,
up:`Problem→Demand→Solution→Outcome→Retention→Feedback。`,
iq:`Customer真正的Problem是什麼？|他真的願意付費解決嗎？|購買後真的產生Outcome嗎？|為什麼有人不買？|為什麼有人不回購？`,
ic:`產品越做越多，庫存與成本也越來越高。`,
rp:`自己喜歡，不代表客戶需要。`,ri:`Customer願意用行動與金錢證明需求嗎？`,rc:`產品增加，庫存也增加。`,
rm:`先Problem再Product|先小規模Demand Test|追蹤Conversion|追蹤Outcome|追蹤Retention|追蹤Referral|低需求產品停止追加資源`,rk:`市場Feedback的權重大於自己的喜歡。`,
cs:`自己覺得產品很好就大量進貨|文章很多人按讚，就以為一定會買|只看營收，不計成本|一直開發新品，舊客卻不回購|客戶一直問同樣問題，卻沒有改善說明|賣不動就認為客戶不懂`,
cc:`Inventory↑、Complexity↑、Profit不一定↑。`,cr:`Problem→Demand Test→Conversion→Outcome→Retention。`,cl:`市場不是來證明你對，而是提供Feedback。`,
dx:`Customer真正想解決什麼Problem？|他願意用Money／Time／Action證明Demand嗎？|買完後真的得到Outcome嗎？|不買的人為什麼不買？|買過的人為什麼回購或不回購？`,dr:`回答不了→先不要急著增加Product。`,
q:`我容易因為自己覺得產品很好，就認為Customer也會需要。|我關注曝光與銷售，但很少追蹤Outcome與Retention。|產品賣不好時，我第一反應常是增加產品、宣傳或降價。`,qy:`回到Problem→Demand→Outcome。`,
ac:`先寫Customer Problem。|訪談真實Customer。|先做小規模Demand Test。|追Conversion。|追Outcome。|追Retention／Referral。`,
da:`收集一條真實Customer Feedback。`,sy:`Problem→Demand→Solution→Outcome→Retention Loop。`,kp:`回購與真實Outcome改善，而非只看曝光。`,al:`市場不是聽你說產品多好，而是用行為回答你。`,
lk:`自己喜歡＝以為市場需要`,core:`Problem→Demand→Outcome`,pr:`RP27 Market Reality`,fa:`寫Customer Problem`});

e({n:28,lv:4,en:`AI`,zh:`AI錯誤`,sub:`AI講得像真的，不代表就是真的`,def:`AI＝人工智慧＝高效率的資訊生成、整理、比較與推演工具。`,pl:``,
mi:`AI說什麼就相信|不查來源|把AI當權威|大量生成卻不整理|沒有去重|沒有版本管理|沒有Reality Retest`,
co:`錯誤被快速複製|資訊越多，Entropy反而越高|最後看似擁有巨大知識庫，其實只是巨大資料堆`,
up:`AI Output→Evidence→Reality→Error→Model Update。`,
iq:`這個AI Output有Evidence嗎？|我驗證過嗎？|AI是在幫我思考，還是在替我決定？|新內容有沒有與舊內容去重？|這次生成降低Entropy，還是增加Entropy？|Reality可以怎麼Retest它？`,
ic:`建立巨大資料庫，卻沒有建立智慧系統。`,
rp:`AI可以把錯誤講得非常完整。`,ri:`這是Evidence，還是漂亮的生成文字？`,rc:`錯誤快速放大，資訊熵增加。`,
rm:`Fact Check|重要內容要求Source|區分Fact／Inference／Speculation|AI答案與Reality交叉驗證|建立Node去重|建立Version Control|建立Error→Update機制|重大決策保留Human Judgment`,rk:`AI負責加速推演，人負責Reality校準。`,
cs:`AI說某研究存在，沒有確認就引用|一次叫AI生成300條，裡面大量重複|AI整理哲學後直接當成原作者觀點|讓AI替自己做重要人生決定|APP一直新增AI內容，舊Node沒有去重|AI寫得越完整，自己反而越少Reality Check`,
cc:`資訊量暴增，智慧密度反而下降。`,cr:`Source→Evidence→Deduplicate→Version→Reality Test。`,cl:`AI是認知加速器，不是Reality本身。`,
dx:`這是AI生成的說法，還是有Evidence支持的Fact？|重要內容我有查Source嗎？|AI是否把Inference講得像Fact？|AI正在幫我增加思考，還是替代我的Judgment？|這次AI輸出讓結構更清楚，還是只是內容更多？`,dr:`Volume↑但Clarity↓→AI正在增加Entropy。`,
q:`AI回答很完整時，我容易降低查證意願。|我生成很多AI內容，但很少做去重、版本管理與Evidence Check。|有些問題我已經開始讓AI替代自己的Judgment。`,qy:`AI Output→Evidence→Human Judgment→Reality Test。`,
ac:`把AI內容標成Fact／Inference／Hypothesis。|重要Fact找Source。|要求AI提出反例。|與Reality／原始資料交叉驗證。|大量生成前先Deduplicate。|重大Decision保留Human Judgment。`,
da:`至少驗證一個AI重要結論。`,sy:`建立AI→Evidence→Retest→Version Control。`,kp:`內容量不一定增加，但可信度與可用性提高。`,al:`不要讓AI污染Model，要讓AI幫你壓力測試Model。`,
lk:`AI說得完整＝以為是真的`,core:`Evidence＋Source＋Human Review`,pr:`RP28 AI Reality Check`,fa:`標Fact／Inference`});

e({n:29,lv:4,en:`SYSTEM`,zh:`系統錯誤`,sub:`不是某個人不好，是遊戲規則讓問題一直重生`,def:`System＝系統＝很多人、規則、資源與Feedback共同形成的結果生成器。`,pl:``,
mi:`問題一來就找人怪|每次都靠救火|沒有SOP|沒有Feedback|獎勵制度鼓勵錯誤行為|只有單一關鍵人物能運作`,
co:`同樣問題一直換人重演|解決一百次事件，結構仍然沒變`,
up:`不要只Fix People，要Redesign System。`,
iq:`這個問題是不是重複發生？|換一個人還會發生嗎？|哪個規則正在鼓勵這種行為？|Feedback Loop在哪裡？|應該改人，還是改System？`,
ic:`每天救火，但火源從來沒有消失。`,
rp:`同樣問題一直換人重演。`,ri:`如果換一個人，問題還會發生嗎？`,rc:`天天救火。`,
rm:`找Repeated Pattern|畫Feedback Loop|找Incentive|找Bottleneck|改Default|建立SOP|增加自動Feedback`,rk:`反覆發生的問題，優先修Structure。`,
cs:`班上每天有人忘記交作業，每天個別提醒|公司一直有人填錯表格，只是不斷責備新人|家裡每月都超支，每次只怪某個人亂花|團購一直有人問同樣物流問題，每次人工回答|每次出錯都靠某個能幹的人救火|員工換三個，問題仍一模一樣`,
cc:`People換了，Pattern還在。`,cr:`Pattern→Structure→Incentive→SOP→Feedback Loop。`,cl:`同一問題反覆發生，就不要只修人。`,
dx:`這個問題是不是重複發生？|是不是不同人也會犯同樣問題？|哪個Rule／Process／Incentive正在製造它？|我們是不是每次只處理Event？|改哪個Structure能讓問題以後更少發生？`,dr:`換人仍發生→優先修System。`,
q:`同一類問題已經換不同人重複發生。|每次問題出現，我們主要都是提醒、責備或救火。|很少有人重新檢查Rule、Process、Incentive與Feedback Loop。`,qy:`不要再只Fix People，開始Redesign System。`,
ac:`找Repeated Event。|不要先問「誰錯？」|問「什麼Structure讓它一直發生？」|畫Process與Feedback Loop。|改一個最高Leverage Rule。`,
da:`重複第二次的問題就記錄。`,sy:`第三次出現強制System Review。`,kp:`同類事件發生頻率下降。`,al:`第一次救火，第二次記錄，第三次改系統。`,
lk:`換人後問題還是重複`,core:`Structure＋Rule＋Feedback Loop`,pr:`RP29 System Redesign`,fa:`找Repeated Pattern`});

e({n:30,lv:4,en:`COMPLEXITY`,zh:`複雜系統錯誤`,sub:`以為世界會照直線走`,def:`Complexity＝複雜性＝很多因素互相影響，結果不一定與投入成比例。`,pl:``,
mi:`努力兩倍就期待成果兩倍|改一個政策就期待只有一個結果|忽略副作用|忽略臨界點|忽略人會適應新規則`,
co:`政策失靈|策略反效果|好心可能產生壞結果`,
up:`小步Probe→觀察Feedback→再調整。`,
iq:`是不是有很多因素同時作用？|改A會不會讓B、C也跟著變？|有沒有Delay？|有沒有Threshold？|有沒有二階副作用？|能不能先做小型Probe？`,
ic:`好意介入可能產生意外結果。`,
rp:`世界不會永遠照直線走。`,ri:`我的介入會不會產生第二、第三層反應？`,rc:`好意可能造成反效果。`,
rm:`避免一次大改|先做Small Probe|保持Reversibility可逆性|觀察Delay|追蹤Second-order Effect二階效應|保留多條路徑`,rk:`複雜系統不要一次押答案，用迭代換資訊。`,
cs:`禁止學生手機，以為學習一定改善，結果出現其他逃避行為|大幅降價想提高營收，卻降低品牌感受|一次改五種健康習慣，最後不知道什麼有效|父母加強控制孩子，孩子反而更會隱瞞|增加員工KPI，結果大家只做被計分的事情|增加APP功能，使用者反而不知道從哪開始`,
cc:`介入產生Second-order Effect。`,cr:`Small Probe＋Reversible＋Feedback＋Iterate。`,cl:`複雜系統不是一次設計完成，而是邊走邊校準。`,
dx:`這個問題是不是同時受很多因素影響？|我的介入會不會改變其他人的行為？|結果是不是可能延遲出現？|有沒有Second-order Effect？|能不能先做一個Small Reversible Probe？`,dr:`高不確定＋多互動→不要一次大改。`,
q:`我容易期待「改A就一定得到B」。|做改變時，我較少考慮副作用、Delay與他人的適應行為。|遇到大問題，我容易一次做很多大改變。`,qy:`Small Probe＋Reversible＋Observe。`,
ac:`先縮小介入規模。|一次改少量主要Variable。|優先可逆Experiment。|觀察Delay。|記錄Second-order Effect。|根據Feedback逐步Scale。`,
da:`問：「還可能影響誰？」`,sy:`建立Probe→Sense→Respond迴圈。`,kp:`大型意外副作用下降。`,al:`不確定越高，第一次行動越應該小。`,
lk:`以為改A一定只產生B`,core:`Small＋Reversible Probe`,pr:`RP30 Small Probe`,fa:`縮小第一次介入`});

e({n:31,lv:4,en:`CONTROL`,zh:`控制錯誤`,sub:`一直想控制其實控制不了的東西`,def:`Control＝控制＝透過Feedback調整可操作變數。`,pl:``,
mi:`控制孩子想什麼|控制伴侶怎麼反應|控制市場|控制別人喜不喜歡自己|真正能控制的自己反而沒有處理`,
co:`焦慮增加|衝突增加|能量大量浪費|Agency下降`,
up:`Uncontrollable放掉，Controllable重新設計。`,
iq:`這件事真的由我控制嗎？|哪些是Controllable？|哪些是Uncontrollable？|我是不是一直試圖控制別人的選擇？|我真正可以調整的Variable是什麼？`,
ic:`大量能量花在不可能完成的控制上。`,
rp:`一直控制控制不了的東西。`,ri:`這個Variable真的在我的控制範圍嗎？`,rc:`焦慮、衝突、能量浪費。`,
rm:`畫Control Circle|分成Control／Influence／Accept|把資源移回Control區|影響別人用Condition Design，不用強迫|接受剩餘Uncertainty`,rk:`控制變數，不控制世界。`,
cs:`希望所有學生都喜歡自己|要求成年孩子照自己的方式生活|一直想改變伴侶個性|焦慮市場怎麼反應|希望文章發出去所有人都認同|努力控制別人的情緒`,
cc:`大量Energy流向Uncontrollable Variables。`,cr:`Control／Influence／Accept三圈分類。`,cl:`不要控制別人，設計條件；不要控制世界，控制自己的變數。`,
dx:`這件事情真的由我決定嗎？|哪些Variable我能Control？|哪些只能Influence？|哪些必須Accept？|我是不是把大部分Energy放在Control不了的東西？`,dr:`YES→把資源移回Control Circle。`,
q:`我常為別人的想法、選擇或反應焦慮。|我花很多Energy希望別人照我的方式做。|我很少把事情分成Control／Influence／Accept。`,qy:`把Energy移回Controllable Variables。`,
ac:`畫三圈：Control／Influence／Accept。|把問題全部放入三圈。|80% Energy投入Control。|Influence使用溝通與Condition Design。|Accept區停止反覆內耗。`,
da:`焦慮時重新畫三圈。`,sy:`建立Control Variable思考。`,kp:`無效焦慮↓、有效Action↑。`,al:`控制Variable，不控制People。`,
lk:`一直控制控制不了的人事物`,core:`Control／Influence／Accept`,pr:`RP31 Control Circle`,fa:`畫控制三圈`});

e({n:32,lv:4,en:`ENVIRONMENT`,zh:`環境錯誤`,sub:`一直怪自己沒自制力，其實環境天天誘惑你`,def:`Environment＝環境＝持續影響行為的外部條件。`,pl:``,
mi:`手機永遠在手邊|家裡到處都是誘惑|讀書桌同時是娛樂桌|身邊的人一直強化舊習慣|重要工具很難取得`,
co:`每一天都要靠意志力打仗|長期容易回到舊模式`,
up:`Design Conditions，不要只Control People。`,
iq:`目前Environment鼓勵什麼行為？|誘惑是不是太容易取得？|正確行動是不是太麻煩？|可以增加壞習慣的Friction嗎？|可以降低好習慣的Friction嗎？`,
ic:`每天都靠意志力與環境對抗。`,
rp:`環境一直把你推回舊模式。`,ri:`如果換個環境，這個問題還會這麼嚴重嗎？`,rc:`每天靠Willpower打仗。`,
rm:`移除誘惑|好行為放在視線內|設定Default Option|增加錯誤行為步驟|降低正確行為步驟|選擇支持目標的人際環境`,rk:`Design Conditions > Control People。`,
cs:`讀書時手機就放課本旁|想早睡，床上卻裝滿娛樂設備|想少吃甜食，家裡桌上永遠有甜點|想運動，運動用品全部收起來|想專心工作，電腦通知全部開著|想改變習慣，身邊環境卻持續強化舊行為`,
cc:`每天消耗Willpower。`,cr:`讓好行為更容易，壞行為更麻煩。`,cl:`Design Conditions > Control People。`,
dx:`Environment現在正在鼓勵什麼Behavior？|壞行為是不是伸手就能做？|好行為是不是很麻煩？|如果不靠Willpower，我可以改哪個Condition？|什麼Default可以重新設定？`,dr:`環境與Goal相反→先Design Conditions。`,
q:`誘惑通常比正確行為更容易取得。|我常要求自己靠自制力抵抗環境。|如果只改Environment，不改我的意志力，問題其實可能改善很多。`,qy:`Design Conditions。`,
ac:`移除一個壞Cue。|增加一個好Cue。|讓壞行為多三個步驟。|讓好行為少三個步驟。|修改Default。`,
da:`每天改善一個微小Condition。`,sy:`每月Environment Audit。`,kp:`正確行為需要的Willpower下降。`,al:`Design Conditions > Control People。`,
lk:`環境一直誘發舊行為`,core:`Condition Design＋Friction`,pr:`RP32 Condition Design`,fa:`移除一個壞Cue`});

e({n:33,lv:4,en:`RISK`,zh:`風險錯誤`,sub:`只想最好結果，沒有想承受不承受得起最壞結果`,def:`Risk＝風險＝不確定性×可能損失。`,pl:``,
mi:`所有錢押一個地方|沒有備援|沒有Safety Margin|「以前沒發生」＝「以後不會發生」|只看平均報酬`,
co:`一次意外就可能讓整個系統崩掉`,
up:`不是避免所有Risk，而是避免不能承受的Ruin。`,
iq:`最壞情況是什麼？|我承受得起嗎？|即使機率很低，損失是不是巨大？|有Backup嗎？|有Safety Margin嗎？`,
ic:`一次低機率事件就可能造成不可逆傷害。`,
rp:`只想最好結果，忘了自己能不能活過最壞結果。`,ri:`如果最壞情況真的發生，我承受得起嗎？`,rc:`一次事件可能摧毀整個系統。`,
rm:`先避免Ruin|建立Safety Margin|建立Backup|分散不可承受風險|高損失事件即使低機率也要管理|不要讓單一失敗摧毀整個系統`,rk:`先活下來，才有下一輪迭代。`,
cs:`全部存款投入單一投資|開車從不想備援路線或時間|公司只有一個人知道核心密碼與流程|所有收入只有單一來源|重要資料只有一份|因為十年沒出事就認為永遠不會出事`,
cc:`一個低機率Event可能摧毀整個System。`,cr:`Avoid Ruin＋Backup＋Diversification＋Safety Margin。`,cl:`先確保還有下一局，才談這一局賺多少。`,
dx:`最壞情況是什麼？|如果真的發生，我承受得起嗎？|有沒有單一Failure可以摧毀整個System？|有Backup／Safety Margin嗎？|我是不是因為以前沒出事，就認為以後也不會？`,dr:`存在Ruin Risk→優先處理，不必等高機率。`,
q:`我做Decision時常想最好結果，較少想最壞結果。|我的某些重要系統沒有Backup。|如果某一件低機率事情發生，可能造成我無法承受的損失。`,qy:`先消除Ruin Risk，再追求Upside。`,
ac:`寫Worst Case。|判斷是否承受得起。|找Single Point of Failure。|建立Backup。|增加Safety Margin。|不可承受的Risk優先移除。`,
da:`重大Decision先問「會不會出局？」`,sy:`建立Pre-mortem＋Contingency Plan。`,kp:`單一事件無法摧毀整個System。`,al:`先避免出局，再追求贏更多。`,
lk:`只想最好，沒想最壞`,core:`Avoid Ruin＋Backup＋Margin`,pr:`RP33 Ruin Prevention`,fa:`寫Worst Case`});

e({n:34,lv:4,en:`GOAL`,zh:`目標錯誤`,sub:`爬得很快，最後發現梯子靠錯牆`,def:`Goal＝目標＝系統想移動到的未來State。`,pl:``,
mi:`目標是別人給的|一次十個目標|只有結果，沒有過程|達成一項目標卻犧牲健康|把工具當目的`,
co:`非常努力卻越來越空|達標後甚至不知道下一步是什麼`,
up:`Value→Goal→Process→Feedback。`,
iq:`這真的是我的Goal嗎？|它服務哪個Value？|達成它的代價是什麼？|會不會犧牲更重要的東西？|如果沒有人知道我做到，我還想做嗎？`,
ic:`可能非常成功，卻不是自己真正想要的人生。`,
rp:`很努力，但梯子可能靠錯牆。`,ri:`如果沒有人知道，我還想完成它嗎？`,rc:`成功後仍然空虛。`,
rm:`Goal回連Value|限制同時Goal數量|設定Process Metric|檢查Goal副作用|每季重新校準|允許Goal被更新或刪除`,rk:`目標服務生命，不讓生命服務目標。`,
cs:`為了第一名犧牲睡眠與健康|為了賺更多錢完全沒有生活|孩子選科系只是因為父母希望|追求瘦到某數字，身體狀態反而變差|社群只追粉絲數，忘記真正想服務誰|完成很多目標後仍不知道自己為什麼做`,
cc:`局部成功、整體失敗。`,cr:`Value→Goal→Cost→Process→Quarterly Review。`,cl:`不要只問能不能達標，也要問這個標值不值得達。`,
dx:`這個Goal真的是我想要的嗎？|它服務哪個Value？|達成它需要犧牲什麼？|達標後整體Life會更好嗎？|如果沒有人知道我達標，我還想要嗎？`,dr:`Goal與Value脫鉤→重新校準Goal。`,
q:`我的某些Goal其實主要來自別人的期待。|為了達標，我正在犧牲更重要的健康、關係或自由。|如果沒有人知道我達標，我可能就不太想追這個Goal。`,qy:`Goal重新連回Value。`,
ac:`寫Goal。|下面寫「WHY？」|連回Value。|列達標Cost。|檢查是否傷害其他重要領域。|必要時刪除Goal。`,
da:`今日Action至少服務一個真正Goal。`,sy:`Quarterly Goal Review。`,kp:`局部成功不再破壞整體Life。`,al:`Goal是工具，不是主人。`,
lk:`努力爬錯梯子`,core:`Goal→Value→Cost校準`,pr:`RP34 Goal Alignment`,fa:`問「我為什麼要它？」`});

e({n:35,lv:5,en:`FEEDBACK`,zh:`回饋錯誤`,sub:`結果已經告訴你答案，你卻沒讀`,def:`Feedback＝回饋＝Reality回傳給系統的修正訊號。`,pl:``,
mi:`產品一直賣不好仍不調整|考試一直錯同類題仍只是訂正答案|身體一直不舒服卻沒有重新評估|別人重複反映同一問題卻不處理|從來沒有Before／After`,
co:`同一Error一直付學費|Experience增加，Wisdom卻沒有增加`,
up:`Outcome→Error Signal→Diagnosis。`,
iq:`結果跟預期一樣嗎？|Reality正在告訴我什麼？|同樣Feedback出現幾次了？|我有記錄Before／After嗎？|什麼證據會讓我願意改變？`,
ic:`同一堂課一直付學費。`,
rp:`Reality已經說話，但沒有讀。`,ri:`結果正在告訴我什麼？`,rc:`同一堂課重複付學費。`,
rm:`事前寫Expected|事後寫Actual|計算Gap|分類Error|固定Review|把Feedback直接連到下一個Action`,rk:`沒有Feedback，就沒有真正Learning。`,
cs:`同類英文題連錯十次，仍只抄答案|客戶重複反映同一問題卻不修改流程|每次旅行都超預算，下一次仍照原本估|每次熬夜隔天效率都很差，仍然認為自己可以撐|每次與某人用同樣方式談都吵架，仍照舊|APP數據顯示某功能沒人用，仍不調整`,
cc:`Reality已經給答案，System卻沒有學習。`,cr:`Expected→Actual→Gap→Error Type→Next Action。`,cl:`Feedback不是批評，是Reality送來的更新資料。`,
dx:`我事前Expected什麼？|Actual是什麼？|Gap在哪裡？|這個Gap是不是已經重複很多次？|我根據Feedback改了什麼？`,dr:`Feedback存在但Action不變→Feedback Loop斷裂。`,
q:`結果不如預期後，我常直接進入下一件事，很少Review。|同樣Feedback已經出現很多次，但我的Action沒有明顯改變。|我很少比較Expected與Actual。`,qy:`把Reality重新接回Learning Loop。`,
ac:`寫Expected。|寫Actual。|寫Gap。|標Error Type。|決定下一個Action。`,
da:`每天Review一個Prediction Error。`,sy:`建立Feedback Dashboard。`,kp:`相同Error重複率下降。`,al:`Reality每天都在教，只看你有沒有讀。`,
lk:`Reality回答了卻沒讀`,core:`Expected→Actual→Gap`,pr:`RP35 Feedback Recovery`,fa:`寫Expected vs Actual`});

e({n:36,lv:5,en:`UPDATE`,zh:`更新錯誤`,sub:`明明知道錯了，還是繼續用舊方法`,def:`Update＝更新＝根據新Evidence修改原有Model。`,pl:``,
mi:`知道方法無效仍繼續|因為面子不改|因為投入很多不改|一次失敗又更新過頭|更新後沒有再測`,
co:`這是整套生命系統最關鍵的Error之一|因為其他Error只錯一次|Update Error會讓同一個Error無限重播`,
up:`Evidence→Update→Retest。`,
iq:`Reality已經證明哪個Old Model不準？|我為什麼還抓著它？|是面子、恐懼、習慣還是沉沒成本？|New Model應該改成什麼？|更新後要如何Retest？`,
ic:`其他錯誤可能只錯一次，Update Error會讓錯誤無限重播。`,
rp:`知道錯了，卻還是不改。`,ri:`什麼Evidence已經證明Old Model需要修正？`,rc:`同樣錯誤無限循環。`,
rm:`明確寫Old Model|寫Contradictory Evidence反證|建立New Model|不要一次全部推翻，只修改必要部分|設定Retest|保留Version History`,rk:`更新不是否定過去，而是提高模型解析度。`,
cs:`明知熬夜會讓隔天崩掉，還是每天重複|明知某讀書方法沒效，還是因為習慣繼續|市場已經改變，還堅持十年前銷售方式|孩子已經長大，父母仍用國中方式控制|關係模式已經反覆失敗，仍期待下一次突然不同|新Evidence出現，卻因為面子拒絕改變`,
cc:`同一Error無限Loop。`,cr:`Old Model→Contradictory Evidence→New Model→Retest。`,cl:`真正昂貴的不是犯錯，是知道錯了還不更新。`,
dx:`哪些Evidence已經證明Old Model不夠準？|我是否仍然繼續使用它？|我不更新是因為Evidence不足，還是面子／恐懼／習慣／沉沒成本？|New Model應該修改哪一部分？|我要怎麼Retest新模型？`,dr:`Reality已變＋Model不變→Update Error。`,
q:`我知道某方法沒效，卻因為習慣仍繼續使用。|新Evidence出現時，我有時會因為面子、恐懼或投入太多而不願改。|類似問題反覆出現，但我的核心做法多年沒有改變。`,qy:`Old Model→Evidence→New Model→Retest。`,
ac:`寫Old Model。|列出反證Evidence。|寫New Model。|只修改需要修改的部分。|設計Retest。|保留Version History。`,
da:`問：「今天哪個想法被Reality修正？」`,sy:`建立Model Update Log。`,kp:`Evidence改變後Behavior也跟著改變。`,al:`更新不是推翻自己，是提高解析度。`,
lk:`知道不準仍使用舊方法`,core:`Old Model→Evidence→New Model`,pr:`RP36 Model Update`,fa:`寫Old／New Model`});

e({n:37,lv:5,en:`META-LEARNING`,zh:`後設學習錯誤`,sub:`一直學答案，沒有學自己為什麼會錯`,def:`Meta-Learning＝學習「自己如何學習、犯錯與更新」。`,pl:``,
mi:`錯題只訂正答案|失敗後只怪運氣|不知道自己常犯哪種錯|同樣錯誤換場景繼續出現|沒有建立自己的Error Pattern`,
co:`活了很多年，經驗很多，模型卻可能沒有明顯升級`,
up:`不要只問「這次答案是什麼？」要問「我為什麼會產生這個錯誤答案？」`,
iq:`我最近最常犯哪三種Error？|它們有共同Trigger嗎？|是不是同一個Pattern換不同場景出現？|我的思考流程哪一步最容易出錯？|我要建立什麼新Rule避免重複？`,
ic:`經驗越來越多，智慧卻沒有同步增加。`,
rp:`一直學答案，沒有研究自己怎麼犯錯。`,ri:`我最常在哪一步出錯？`,rc:`經驗增加，智慧沒有同步增加。`,
rm:`建立Personal Error Taxonomy|每週統計Top 3 Errors|尋找共同Trigger|找跨領域Pattern|建立If→Then Decision Rule|下週刻意Retest`,rk:`不要只修這次錯誤，要修「產生錯誤的機器」。`,
cs:`每次考試粗心，卻從沒分析粗心是哪一種|每段關係都遇到相似衝突，卻只認為每次都是對方問題|每個月都超支，卻只說下個月節省|每次專案都拖到最後，沒有分析共同Trigger|每次焦慮都用滑手機逃避，卻沒有看到Pattern|犯很多錯，卻沒有建立自己的Error Taxonomy`,
cc:`Experience增加，Model沒有升級。`,cr:`每週Top 3 Error→共同Pattern→Trigger→Decision Rule。`,cl:`不要只修錯題，要修會一直產生錯題的系統。`,
dx:`我最近最常犯哪三種Error？|它們有沒有共同Trigger？|同一Pattern是否跨健康、工作、關係重複出現？|我的Error通常發生在Input、Model、Decision、Action還是Update？|可以建立什麼If→Then Rule阻止下一次重演？`,dr:`同型錯誤跨場景重複→需要更新Error Generator。`,
q:`我知道自己犯過很多錯，卻說不出最常犯哪三類。|同一種問題常換不同場景再次出現。|解決問題後，我通常沒有整理成下一次可使用的Decision Rule。`,qy:`開始建立Personal Error Taxonomy。`,
ac:`列最近10個Error。|分類Error Type。|找Top 3。|找共同Trigger。|建立If→Then Rule。|下週Retest。`,
da:`每天只記一個最高價值Error。`,sy:`Weekly Error Review。`,kp:`不是只少犯一次，而是整類Error下降。`,al:`最高階學習，是學會自己為什麼會學錯。`,
lk:`一直犯同類錯卻沒發現Pattern`,core:`Error Pattern Mining`,pr:`RP37 Error Pattern Mining`,fa:`列最近10個Error`});

e({n:38,lv:5,en:`WISDOM`,zh:`智慧錯誤`,sub:`知道很多道理，人生還是一直重複同樣問題`,def:`Wisdom＝智慧＝能跨情境改善預測、決策與行動的可遷移模型。`,pl:``,
mi:`收藏金句＝智慧|年紀大＝智慧|讀很多書＝智慧|懂哲學＝智慧|講得漂亮但不能行動|理論從未接受Reality測試`,
co:`Knowledge非常多|Reality卻沒有改善`,
up:`真正Wisdom必須能Explain→Predict→Guide Action→Retest→Transfer。`,
iq:`這個道理能Explain嗎？|能Predict嗎？|能轉成Action嗎？|能被Reality反證嗎？|換一個情境還能使用嗎？|它真的降低Prediction Error了嗎？`,
ic:`Know很多，Life卻沒有真正Update。`,
rp:`會講很多大道理，但Reality沒改善。`,ri:`這個智慧能不能讓下一次Prediction更準？`,rc:`Knowledge膨脹，能力停滯。`,
rm:`每個Insight必須能Explain|必須提出Prediction|必須能轉成Action|必須接受Retest|必須允許被反證|跨情境Transfer後才能升級為Wisdom`,rk:`沒有Reality Test的智慧，只是漂亮假說。`,
cs:`收藏一千句金句，遇到問題還是不知道怎麼做|讀很多心理學，關係模式卻完全沒改|懂很多健康知識，生活習慣沒有變|會講投資大道理，自己卻沒有風險管理|懂系統論，遇到問題仍然只怪某個人|每天產生很多AI洞察，卻沒有任何Retest`,
cc:`Knowledge↑，Prediction Accuracy沒有↑。`,cr:`Insight必須通過Explain→Predict→Action→Retest→Transfer。`,cl:`不能改善下一次Prediction的智慧，暫時只能叫假說。`,
dx:`這個Insight能解釋Reality嗎？|它能提出下一次Prediction嗎？|能轉成具體Action嗎？|什麼Evidence可以證明它錯？|經過Retest後Prediction Error真的下降嗎？`,dr:`不能Predict／Test／Update→目前只能稱為想法或假說。`,
q:`我懂很多道理，但類似生活問題仍反覆出現。|我的Insight通常沒有轉成可測試的Prediction與Action。|我很少檢查一個「智慧」是否真的讓下一次結果變好。`,qy:`Wisdom必須經過Reality Test。`,
ac:`選一句自己相信的「智慧」。|問它能Explain什麼？|問它Predict什麼？|轉成Action。|設定Falsification Condition。|Reality Retest。`,
da:`一個Insight最多配一個實驗。`,sy:`只有跨情境Retest成功才升級Wisdom Node。`,kp:`Wisdom使Prediction Error下降。`,al:`智慧不是聽起來深，而是經得起Reality。`,
lk:`懂很多道理，Reality沒改善`,core:`Explain→Predict→Act→Retest`,pr:`RP38 Wisdom Validation`,fa:`把Insight變Prediction`});

e({n:39,lv:5,en:`LIFE DESIGN`,zh:`生命設計錯誤`,sub:`人生一直使用預設模式`,def:`Life Design＝生命設計＝主動配置時間、健康、關係、能力、金錢與選擇權。`,pl:``,
mi:`大家做什麼我就做什麼|一直滿足別人的期待|從沒問自己想建構什麼人生|不喜歡現在的生活卻沒有退出路徑|過去投入很多，所以不敢重選`,
co:`人生不是自己選出來的|而是一連串Default累積出來的`,
up:`定期問：如果今天重新設計，我還會選同一條路嗎？`,
iq:`現在的人生是我主動選的嗎？|還是一路「就這樣」形成的？|如果今天重新選，我還會選同樣生活嗎？|哪些只是因為「已經投入很多」所以不敢離開？|哪個部分最需要重新Design？`,
ic:`人生最後可能只是很多沒有重新檢查的Default累積。`,
rp:`人生一直使用Default設定。`,ri:`如果今天重新選，我還會選現在這個版本嗎？`,rc:`很多年後才發現自己一直活別人的腳本。`,
rm:`每季Life Review|健康／關係／學習／工作／金錢／自由分別評估|找最大Constraint|找最大Leverage|刪除過期Commitment|重新配置Time／Money／Attention|保留Exit Option`,rk:`人生不是一次選對，而是保留重新設計的能力。`,
cs:`讀某科系只是因為大家說穩定|工作20年從未重新問自己還想不想做|所有時間都被工作與家人預約，自己沒有空間|明明不喜歡目前生活，卻因為「都這樣過了」繼續|生活成本越來越高，退出工作的自由越來越低|每天解決別人的需求，卻從未設計自己的下一階段`,
cc:`Default累積成命運。`,cr:`Quarterly Life Review→Constraint→Leverage→Resource Reallocation→Exit Option。`,cl:`自由不是一次選對，而是永遠保留重新選擇的能力。`,
dx:`現在生活有多少是我主動選的？|多少只是習慣、責任或Default延續？|如果今天重新開始，我還會選一樣的配置嗎？|Time／Money／Attention是否流向我真正想建構的人生？|我目前還保有Exit Option與重新選擇的能力嗎？`,dr:`Default比例過高→需要Life Redesign。`,
q:`目前很多生活安排只是因為「一直以來都這樣」。|我很少重新檢查時間、工作、關係與金錢是否仍符合現在的自己。|即使現在不滿意，我也常因為投入太久而不敢重新選擇。`,qy:`啟動Life Review與Resource Reallocation。`,
ac:`把生命分成健康／自己／家庭／關係／學習／工作／金錢／自由。|每區0～10評分。|找最大Constraint。|找最高Leverage Point。|重新配置Time／Money／Attention。|保留Exit Option。`,
da:`至少做一件增加未來Option的事情。`,sy:`每季Life Review。`,kp:`人生Default比例下降，主動選擇比例上升。`,al:`不要等人生壞掉才重新設計。`,
lk:`人生一直使用Default Mode`,core:`Life Review＋資源重配`,pr:`RP39 Life Redesign`,fa:`8領域0～10評分`});

e({n:40,lv:5,en:`MEANING`,zh:`意義錯誤`,sub:`以為人生一定要由外面告訴我值得不值得`,def:`Meaning＝意義＝你如何把經驗放進更大的生命脈絡。`,pl:``,
mi:`成功才有價值|有人愛才有價值|工作沒了人生就沒意義|孩子離家自己就沒有角色|痛苦＝人生沒有意義`,
co:`外部角色一改變，整個自我系統就容易失去方向`,
up:`Meaning不是一次找到的答案，而是可以持續重構的Model。`,
iq:`如果失去現在的Role，我還知道自己是誰嗎？|如果沒有人稱讚，我還覺得這件事值得嗎？|我是不是把Success直接等於Meaning？|痛苦一定代表這段經驗沒有價值嗎？|現在的Meaning Model是不是已經需要更新？`,
ic:`工作、關係、身份一改變，整個生命方向跟著崩掉。`,
rp:`把生命價值完全交給角色、成功或別人的認同。`,ri:`如果這個角色消失，我還剩下什麼？`,rc:`外部結構一變，自我系統一起崩掉。`,
rm:`Meaning不要綁單一角色|建立多來源價值感|把痛苦視為Data，而不是自動判成沒有意義|允許舊Meaning過期|重新問：現在的我願意服務什麼？|把Meaning連回Action，而不只停留在哲學`,rk:`意義不是找到一次就固定，而是可以持續生成。`,
cs:`退休後覺得自己沒有用了|孩子離家後不知道自己還剩什麼|失去工作就認為人生沒有價值|沒有人稱讚就覺得事情不值得做|一段關係結束，就認為過去全部沒有意義|遇到痛苦就認定生命走錯路`,
cc:`單一Role崩掉，整個Identity與Meaning一起崩掉。`,cr:`多來源Meaning＋Role與Self分離＋重新生成Value與Action。`,cl:`意義不是固定答案，而是生命可以持續重構的模型。`,
dx:`我的價值是不是過度綁在某一個Role？|如果工作、關係、成績或身份消失，我還知道自己重視什麼嗎？|我是不是把「現在痛苦」直接等於「人生沒有意義」？|舊Meaning是不是已經不適合現在的生命階段？|現在的我願意把生命資源投入什麼值得的事情？`,dr:`Meaning只有單一支柱→增加多來源Meaning與可更新性。`,
q:`我的自我價值高度依賴某個角色、成績、工作、關係或他人認同。|失去重要角色時，我容易覺得自己整個人沒有價值。|我很少重新思考「現在這個生命階段，什麼值得我投入？」`,qy:`重新建立多來源Meaning。`,
ac:`寫下目前最重要的3個Role。|問：「如果Role消失，我仍重視什麼？」|建立多來源Meaning。|把Meaning轉成今天可以做的Action。|允許不同生命階段重新定義Meaning。`,
da:`記錄一件「今天值得」的小事。`,sy:`每年重新寫一次Life Meaning Statement。`,kp:`單一角色改變，不再摧毀整體Self。`,al:`Meaning不是固定答案，而是可以持續生成的方向。`,
lk:`價值綁死單一Role／成就`,core:`多來源Meaning＋重新生成`,pr:`RP40 Meaning Reconstruction`,fa:`問「Role之外我重視什麼？」`});

而是Structure錯。

真正昂貴的是：
犯錯→沒有發現。
發現→沒有診斷。
診斷→找錯原因。
找到原因→沒有行動。
有行動→沒有Retest。
Retest失敗→沒有Update。
Update成功→沒有把它保存成Capability。
【真正完整的生命智慧生成閉環】
生活事件→我原本怎麼想→Reality怎麼回答→哪裡出現Prediction Error→屬於哪種Error Type→背後Pattern是什麼→真正Bottleneck在哪裡→Mechanism怎麼形成→哪個Leverage Point最值得改→Old Model是什麼→New Model是什麼→下一個Minimum Action→Reality Retest→Evidence→Model Update→New Capability→Wisdom→下一次更好的Prediction。
真正的成長，不是「我再也不犯錯」。
而是「同一種錯誤，不再需要用十年才能看懂」。
真正的自由，也不是永遠做對。
而是Reality證明舊模型失效時，我有能力更新，而不是繼續被昨天的自己綁架。`);
a(`公式`,`最終智慧生成公式`,`

事件→問題→Error→Pattern→Mechanism→Bottleneck→Leverage→Action→Feedback→Model Update→Retest→Evidence→Capability→Wisdom。
Wisdom再回到下一次Prediction。
這才叫真正的「生活→智慧生成→生活」閉環。
生活會變成Data。Error會變成Signal。Signal會觸發Regularization。Regularization會產生Experiment。Experiment會產生Evidence。Evidence會更新Model。Model Update最後沉澱成Capability與Wisdom。
這才是真正可以一直自我迭代的Life OS。`);

a(`總母體`,`核心定義｜Life Regularization OS`,`
正則化＝當一個人的想法、情緒、習慣、關係、工作、健康或AI開始「越走越偏、越做越僵、越投入越難回頭」時，加入限制、反例、回饋與現實檢驗，避免系統過度擬合舊經驗。
它不是把人生控制得更死。
它反而是防止某一個Model、慾望、恐懼、身份、關係或策略取得過大的控制權。
最簡單的白話就是：
【太多了→降權。】
【太少了→補足。】
【太死了→鬆動。】
【太亂了→加結構。】
【太快了→增加摩擦。】
【太慢了→降低啟動成本。】
【太相信了→找反例。】
【太懷疑了→找證據。】
【太投入了→看機會成本。】
【太執著了→重新看目標。】
【太複雜了→刪除。】
【太單一了→增加可能性。】
【離Reality太遠了→重新接回Reality。】`);
a(`總母體`,`一｜正則化的本體`,`
生命本來就是動態系統。
沒有任何State需要永遠維持。
真正危險的通常不是某個狀態本身。而是：
狀態不能切換。
模型不能更新。
資源不能重新配置。
關係不能重新談判。
身份不能重新定義。
策略不能退出。
錯誤不能被承認。
所以真正要正則化的不是「人生」。
而是人生中的【過度固定】。`);
a(`總母體`,`二｜正則化的控制論結構`,`
目標→行動→Reality→Feedback→Prediction Error
如果誤差很小→繼續。
如果誤差持續增加→警報。

↓ Retest→新的Reality→Model Update。`);
a(`總母體`,`七十三｜生活生命正則化總檢查表（24問）`,`
遇到任何問題，先問：
①【Reality】真正發生什麼？
②【Fact】哪些是可以確認的事實？
③【Interpretation】哪些只是我的解釋？
④【Assumption】我偷偷加入什麼前提？
⑤【Emotion】現在的情緒是否正在放大某個訊號？
⑥【Identity】我是否把一次事件變成「我就是……」？
⑦【Causality】我是否把相關當成因果？
⑧【Alternative】還有哪三種可能？
⑨【Counterexample】有什麼反例？
⑩【Boundary】這套說法在哪些條件下不成立？
⑪【Weight】哪個因素被我放得太大？
⑫【Missing Variable】哪個因素被我忽略？
⑬【Feedback Loop】是不是存在自我強化循環？
⑭【Constraint】真正限制系統的是什麼？
⑮【Leverage】改哪一點最省力？
⑯【Opportunity Cost】我為此犧牲什麼？
⑰【Prediction】如果我真的對，接下來應該看到什麼？
⑱【Action】最小可測試行動是什麼？
⑲【Feedback】Reality怎麼回答？
⑳【Prediction Error】哪裡和預測不同？
㉑【Regularization】什麼東西需要降權、限縮、平衡或重新加入？
㉒【Model Update】哪個模型需要修改？
㉓【Retest】怎麼重新測？
㉔【Capability】這次錯誤最後生成什麼能力？`);
a(`總母體`,`七十四｜正則化路由器`,`
學員輸入任何問題

a(`總母體`,`七十五｜再接回《易經》：窮・變・通・久`,`
【窮】舊模型吸收不了新的Prediction Error。
【變】重新調整Weight、Relation、Boundary、Strategy、Goal。

a(`總母體`,`最終公式｜防止任何單一Node壟斷整個人生系統`,`
生命失控往往不是因為完全沒有Model。
反而可能是某一個Model權重太高。
某一種情緒權重太高。某一個人權重太高。某一個目標權重太高。某一段過去權重太高。某一個身份權重太高。某一套權威權重太高。某一種成功方法權重太高。某一個AI答案權重太高。
正則化就是：【防止任何單一Node壟斷整個人生系統。】
所以生命正則化最後不是追求「永遠平衡」。而是建立：
Detect。Pause。Compare。Reweight。Experiment。Feedback。Update。Retest。
真正的智慧不是永遠保持同一個答案。而是：
該穩定時能穩定。
該懷疑時能懷疑。
該行動時能行動。
該停止時能停止。
該保留時能保留。
該放掉時能放掉。
該更新時能更新。
【真正的自由＝沒有任何舊Model擁有永久否決你更新的權力。】`);

 h+=sec('rm','正則化方法 Regularization',list(e.rm,1)+`<div class="quote">正則化口訣｜${H(e.rk)}</div><div class="kv"><b>Protocol｜</b>${H(e.pr)}</div>`);
 h+=sec('ac','實作策略｜NOW・DAILY・SYSTEM',`<div class="kv"><b>NOW 現在立刻做</b></div>`+list(e.ac,1)+`<div class="kv"><b>DAILY｜</b>${H(e.da)}</div><div class="kv"><b>SYSTEM｜</b>${H(e.sy)}</div><div class="kv"><b>成功指標｜</b>${H(e.kp)}</div><div class="quote">一句話｜${H(e.al)}</div>`);
 h+=sec('up','更新方法',`<p>${H(e.up)}</p>`);M.innerHTML=h}

/* ---------- 120題 ---------- */
const OPT=[['是',2],['有時',1],['否',0],['不知道','?']];
function quiz(){const ans=store('lifeos_quiz')||{};
 let h=`<h2>五層導航 × 120題快速判斷</h2><p class="muted">是＝2｜有時＝1｜否＝0｜不知道＝待確認。單一Error：0分暫無明顯訊號｜1～2值得留意｜3～4建議進入Diagnosis｜5～6優先檢查。這是LifeOS自我反思工具，不是醫療或心理診斷量表。作答自動存在本機瀏覽器。</p>
<div class="row" style="margin-bottom:10px"><button class="btn" onclick="document.getElementById('result').scrollIntoView()">看結果 ↓</button><button class="btn warn" onclick="clearQuiz(this)">清除作答</button></div>`;
 L.forEach(l=>{h+=`<div class="card bl${l.n}" style="margin-bottom:12px"><h3 style="margin-top:0">${l.ic} LEVEL ${l.n}｜${l.nm}</h3><div class="muted">核心｜${l.q}</div>`;
  E.filter(e=>e.n>=l.a&&e.n<=l.b).forEach(e=>{h+=`<div style="margin-top:10px"><b>${pad(e.n)}｜${e.en} ERROR｜${e.zh}</b>`;
   sp(e.q).forEach((t,i)=>{const id=e.n+'-'+(i+1);h+=`<div class="qitem">${id}｜${esc(t)}<div class="opts">${OPT.map(([k,v])=>`<label class="${ans[id]==k?'sel':''}" onclick="pick('${id}','${k}',this)"><input type="radio">${k}</label>`).join('')}</div></div>`});
   h+=`<div class="muted">YES多｜${e.qy}</div></div>`});h+=`</div>`});
 h+=`<div id="result"></div>`;M.innerHTML=h;result()}
function pick(id,k,el){const a=store('lifeos_quiz')||{};a[id]=k;store('lifeos_quiz',a);el.parentNode.querySelectorAll('label').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');result()}
function scores(){const a=store('lifeos_quiz')||{};return E.map(e=>{let s=0,u=0,ev=[];sp(e.q).forEach((t,i)=>{const v=a[e.n+'-'+(i+1)];if(v==='是'){s+=2;ev.push(t)}else if(v==='有時'){s+=1;ev.push(t)}else if(v==='不知道')u++});return{e,s,u,ev}})}
function lab(s){return s>=5?'優先檢查':s>=3?'建議進入Diagnosis':s>=1?'值得留意':'暫無明顯訊號'}
function result(){const r=scores(),done=Object.keys(store('lifeos_quiz')||{}).length,top=[...r].sort((a,b)=>b.s-a.s).filter(x=>x.s>0);
 let h=`<div class="card" style="margin-top:16px"><h3 style="margin-top:0">📊 結果（已答 ${done}/120）</h3>`;
 h+=L.map(l=>{const t=r.filter(x=>x.e.n>=l.a&&x.e.n<=l.b),s=t.reduce((a,b)=>a+b.s,0),m=t.length*6;return`<div class="score"><span>${l.ic} L${l.n} ${l.nm.split('｜')[0]}</span><div class="bar"><i style="width:${m?s/m*100:0}%"></i></div><span>${s}/${m}</span></div>`}).join('');
 if(!top.length){h+=`<p class="muted">尚無訊號。開始作答後，這裡會顯示TOP Error與處方。</p></div>`;$('#result').innerHTML=h;return}
 h+=`<h3>TOP Error</h3>`+top.slice(0,8).map(x=>`<div class="score"><span style="cursor:pointer;color:var(--acc)" onclick="go('cards',${x.e.n})">${pad(x.e.n)} ${x.e.zh}</span><div class="bar"><i style="width:${x.s/6*100}%"></i></div><span>${x.s}/6 ${lab(x.s)}</span></div>`).join('');
 [0,1].forEach(i=>{const x=top[i];if(!x)return;h+=`<div class="card bl${lvOf(x.e.n).n}" style="margin-top:10px"><b>TOP ${i+1} ERROR｜${pad(x.e.n)} ${x.e.en} ERROR｜${x.e.zh}</b>（${x.s}分）<div class="kv"><b>Evidence｜</b>${x.ev.map(esc).join('；')}</div><div class="kv"><b>正則化｜</b>${x.e.core}（${x.e.pr}）</div><div class="kv"><b>第一個Action｜</b>${x.e.fa}</div></div>`});
 h+=`<p class="muted" style="margin-top:10px">⚠️ 最高分Error不一定等於Root Cause。請往上追：這條Error Chain最上游從哪裡開始？現在卡住結果的是哪裡？改哪一點最可能讓整條鏈鬆動？</p>`;
 const p=store('lifeos_rx')||{},t=top[0].e,F=[['root','你的Root Error',t.zh],['neck','你的Bottleneck',''],['lev','你的最高Leverage Point',''],['reg','今天的Regularization',t.core],['act','今天唯一Minimum Action',t.fa],['pred','預測｜如果執行，我預測',''],['re','Retest日期',''],['evi','Evidence｜看到什麼代表有效',''],['cap','Capability／Wisdom｜這次生成什麼能力','']];
 h+=`<h3>【今天只改一個Variable】</h3>`+F.map(([k,n,d])=>`<label class="field">${n}<input ${k=='re'?'type="date"':''} value="${esc(p[k]??d)}" oninput="rx('${k}',this.value)"></label>`).join('');
 h+=`<div class="kv"><b>結果｜</b></div><div class="opts">${['改善','沒變','更差'].map(k=>`<label class="${p.out==k?'sel':''}" onclick="rx('out','${k}');result()">${k}</label>`).join('')}</div>`;
 const O={改善:'KEEP｜提高New Model權重。',沒變:'MODIFY｜重新找Bottleneck／Strategy。',更差:'STOP／ROLLBACK｜檢查Mechanism／副作用／Error Type。'};if(p.out)h+=`<div class="quote">${O[p.out]} → MODEL UPDATE → CAPABILITY → WISDOM</div>`;
 h+=`</div>`;$('#result').innerHTML=h}
function rx(k,v){const p=store('lifeos_rx')||{};p[k]=v;store('lifeos_rx',p)}

/* ---------- 正則化70 ---------- */
function reg(){const gs=[...new Set(R.map(x=>x.g))],f=sub;
 let h=`<h2>生活生命正則化總母體｜Life Regularization OS</h2>`;
 if(!f){A.filter(x=>x.g=='總母體').slice(0,3).forEach(x=>h+=`<div class="card" style="margin-bottom:12px"><h3 style="margin-top:0">${x.t}</h3><div class="body">${body(x.b)}</div></div>`)}
 h+=`<div class="chips" style="margin-top:12px"><span class="chip ${!f?'on':''}" onclick="go('reg')">全部70類</span>${gs.map(g=>`<span class="chip ${f==g?'on':''}" onclick="go('reg','${g}')">${g}</span>`).join('')}</div>`;
 h+=`<div class="grid">${R.filter(x=>!f||x.g==f).map(x=>`<div class="card" id="r${x.n}"><div class="num">${pad(x.n)} <span class="tag">${x.g}</span></div><b>${H(x.t)}</b><div class="body" style="margin-top:6px">${body(x.b)}</div></div>`).join('')}</div>`;
 if(!f)A.filter(x=>x.g=='總母體').slice(3).forEach(x=>h+=`<div class="card" style="margin-top:12px"><h3 style="margin-top:0">${x.t}</h3><div class="body">${body(x.b)}</div></div>`);
 M.innerHTML=h}

/* ---------- 對照表 ---------- */
function table(){M.innerHTML=`<h2>LifeOS｜40類一頁對照表</h2><p class="muted">五層→40 Error→白話辨識→核心正則化→Protocol→第一個Action。點列可開啟該卡。</p><div class="tbl"><table><tr><th>層級</th><th>#</th><th>Error Type｜中文</th><th>一眼辨識</th><th>核心正則化</th><th>Protocol</th><th>第一個Action</th></tr>${E.map(e=>{const l=lvOf(e.n);return`<tr style="cursor:pointer" onclick="go('cards',${e.n})"><td><span class="lv lv${l.n}">${l.ic}L${l.n}</span></td><td>${pad(e.n)}</td><td><b>${e.en}</b>｜${e.zh}</td><td>${e.lk}</td><td>${e.core}</td><td>${e.pr}</td><td>${e.fa}</td></tr>`}).join('')}</table></div>
<h3>五層實作策略｜5個超級策略</h3><div class="grid">${L.map(l=>`<div class="card bl${l.n}"><b>${l.ic} LEVEL ${l.n}｜${l.sup}</b><div class="muted">${pad(l.a)}–${pad(l.b)}</div><p>${l.supd}</p><div class="kv"><b>產出｜</b>${l.prod}</div></div>`).join('')}</div>`}

/* ---------- 流程 ---------- */
function flow(){const gs=[['基礎','基礎概念'],['路由','診斷與路由'],['正則化','正則化'],['公式','閉環與公式'],['例子','生活例子']],f=sub;
 let h=`<h2>流程・公式・例子</h2><div class="chips"><span class="chip ${!f?'on':''}" onclick="go('flow')">全部</span>${gs.map(([g,n])=>`<span class="chip ${f==g?'on':''}" onclick="go('flow','${g}')">${n}</span>`).join('')}</div>`;
 A.filter(x=>x.g!='總母體'&&(!f||x.g==f)).forEach(x=>h+=`<div class="card" style="margin-bottom:12px"><div class="num">${(gs.find(g=>g[0]==x.g)||[,''])[1]}</div><h3 style="margin-top:2px">${H(x.t)}</h3><div class="body">${body(x.b)}</div></div>`);M.innerHTML=h}

/* ---------- 搜尋 ---------- */
const FN={pl:'白話',mi:'常見錯誤',co:'導致問題',up:'更新方法',iq:'辨識問題',ic:'導致',rp:'白話',ri:'辨識',rc:'導致',rm:'正則化方法',rk:'正則化口訣',cs:'生活案例',cc:'導致',cr:'正則化',cl:'一句話',dx:'Diagnosis',dr:'判讀',q:'120題',qy:'YES多',ac:'實作策略',da:'DAILY',sy:'SYSTEM',kp:'成功指標',al:'一句話',lk:'一眼辨識',core:'核心正則化',pr:'Protocol',fa:'第一個Action',def:'定義',sub:'標題',en:'名稱',zh:'名稱'};
function search(q){hi=q;const k=q.toLowerCase(),out=[];
 E.forEach(e=>{const hits=[];for(const f in FN){const v=e[f];if(typeof v!=='string')continue;sp(v).forEach(s=>{if(s.toLowerCase().includes(k))hits.push([FN[f],s])})}if(hits.length)out.push(`<div class="res" onclick="go('cards',${e.n})"><span class="tag">Error ${pad(e.n)}</span><b>${H(e.en)} ERROR｜${H(e.zh)}</b><div class="muted">${hits.slice(0,4).map(([f,s])=>f+'｜'+H(s)).join('<br>')}${hits.length>4?`<br>…共 ${hits.length} 處`:''}</div></div>`)});
 L.forEach(l=>{const t=[l.nm,l.q,l.door,l.lang,l.reg,l.out,l.supd].join('｜');if(t.toLowerCase().includes(k))out.push(`<div class="res" onclick="go('home')"><span class="tag">五層</span><b>${l.ic} LEVEL ${l.n}｜${H(l.nm)}</b></div>`)});
 R.forEach(x=>{if((x.t+x.b).toLowerCase().includes(k)){const ln=x.b.split('\n').filter(s=>s.toLowerCase().includes(k)).slice(0,3);out.push(`<div class="res" onclick="go('reg');setTimeout(()=>document.getElementById('r${x.n}').scrollIntoView(),50)"><span class="tag">正則化 ${pad(x.n)}</span><b>${H(x.t)}</b><div class="muted">${ln.map(H).join('<br>')}</div></div>`)}});
 A.forEach(x=>{if((x.t+x.b).toLowerCase().includes(k)){const ln=x.b.split('\n').filter(s=>s.toLowerCase().includes(k)).slice(0,3);out.push(`<div class="res" onclick="go('${x.g=='總母體'?'reg':'flow'}')"><span class="tag">${x.g=='總母體'?'總母體':'流程'}</span><b>${H(x.t)}</b><div class="muted">${ln.map(H).join('<br>')}</div></div>`)}});
 M.innerHTML=`<h2>搜尋「${esc(q)}」<span class="muted">　${out.length} 筆</span></h2>`+(out.join('')||'<p class="muted">找不到，換個關鍵字試試。</p>')}
$('#q').addEventListener('input',e=>{const v=e.target.value.trim();if(v)search(v);else{hi='';render()}});
function render(){({home,cards,quiz,reg,table,flow})[tab]()}
{const s=store('lifeos_tab');if(s&&TABS.some(t=>t[0]==s[0])){tab=s[0];sub=s[1]}}nav();render();
</script>
