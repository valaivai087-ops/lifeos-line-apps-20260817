a(`基礎`,`這張地圖怎麼用¦How to Use This Map`,`
這張地圖不是拿來證明「你哪裡不好」。¦This map isn't for proving what's wrong with you.
它是陪你找出「事情是從哪一個環節開始走偏的」。¦It helps you find where things started to drift.
錯誤，是你原本以為會這樣，但現實沒有照著走。¦An error is when reality didn't follow what you expected.
預測落差，是「我以為」和「實際上」之間的距離。¦Prediction error is the distance between "I thought" and "actually."
真正重要的，不是永遠不犯錯。¦What matters isn't never making mistakes.
而是錯誤出現之後，你能看懂→找到原因→換方法→再試一次→讓它變成能力。¦It's whether, after an error, you can understand → find the cause → change the method → try again → turn it into capability.
使用方式：別問「我是不是有問題？」，問「這次的結果，是從哪裡開始偏的？」¦How to use: don't ask "Is something wrong with me?" Ask "Where did this outcome start to drift?"
辨識流程：事件→辨識問題→錯誤類型→卡點→更新地圖→行動→再測。¦Process: event → diagnostic questions → error type → bottleneck → model update → action → retest.`);
a(`基礎`,`八個最重要的生活提問¦The Eight Most Important Life Questions`,`
①我拿到的資訊對嗎？¦① INPUT｜Is my information right?
②我看到的是事實，還是自己的解讀？¦② PERCEPTION｜Am I seeing facts or my interpretation?
③我用哪一張舊地圖在理解這件事？¦③ MODEL｜Which old model am I using?
④我原本預測的是什麼？¦④ PREDICTION｜What did I predict?
⑤我為什麼做了這個選擇？¦⑤ DECISION｜Why did I make this choice?
⑥我實際做了什麼？¦⑥ ACTION｜What did I actually do?
⑦生活現在告訴我什麼？¦⑦ FEEDBACK｜What is reality telling me now?
⑧知道結果之後，我到底改了什麼？¦⑧ UPDATE｜After the result, what did I actually change?`);
a(`例子`,`一個生活例子｜英文段考 52 分¦A Life Example｜52 on an English Test`,`
學生第一次段考，英文 52 分。¦A student scores 52 on their first English test.
心裡的第一個聲音：「我英文就是很爛。」這是身份錯誤。¦First inner voice: "I'm just bad at English." That's an identity error.
#【溫柔地拆開來看】¦【Breaking it down gently】
事實：英文 52 分。¦FACT｜52 in English.
預測：原本以為看過課本就會考好。¦PREDICTION｜I thought reading the textbook would be enough.
真實：52 分。¦REALITY｜52.
落差：看過，不等於想得起來。¦ERROR｜Having read it isn't being able to recall it.
地圖錯誤：把「熟悉」當成了「學會」。¦MODEL ERROR｜Mistaking familiarity for learning.
學習錯誤：沒有自己回想，也沒有再測。¦LEARNING ERROR｜No retrieval, no retest.
策略錯誤：一直重讀，沒有針對錯題練習。¦STRATEGY ERROR｜Rereading instead of practicing mistakes.
回饋：文意選填和長句錯得最多。¦FEEDBACK｜Most errors in cloze and long sentences.
更新地圖：英文能力不是「看了幾遍」，而是「能不能自己想起來、用得出來」。¦MODEL UPDATE｜English ability isn't how many times you read, but whether you can retrieve and use it.
行動：替錯題分類→找出卡點→針對弱點練 10 題→三天後再測。¦ACTION｜Classify errors → find the bottleneck → 10 targeted problems → retest in three days.
能力：學會診斷自己的錯誤。¦CAPABILITY｜Error-diagnosis ability grows.
智慧：「分數不是對你的判決，而是目前學習方式留下的回饋。」¦WISDOM｜"A score isn't a verdict on who you are; it's feedback from your current way of learning."`);
a(`例子`,`女兒考得比同學差｜一張錯誤卡的例子¦Daughter Scored Lower Than Classmates｜An Error Card Example`,`
事件：女兒考得比同學差。¦Event｜My daughter scored lower than her classmates.
→可能的錯誤：身份錯誤。¦→ Possible error｜Identity error.
→舊地圖：「別人比我高，就是我不夠聰明。」¦→ Old model｜"Others scored higher, so I'm not smart enough."
→問題：一次的表現，被寫成永遠的身份。¦→ Problem｜One output written into a permanent identity.
→正則化：把身份改寫成「還在練的能力」。¦→ Regularization｜Rewrite identity as a skill gap.
→新地圖：「現在的分數，只是目前知識＋技能＋方法的結果。」¦→ New model｜"This score is just the output of my current knowledge + skill + strategy."
→行動：分析錯題的類型。¦→ Action｜Analyze the types of mistakes.
→再測：兩週後，測同類型的題目。¦→ Retest｜Test the same question types in two weeks.
→證據：錯誤率下降了。¦→ Evidence｜The error rate drops.
→能力：診斷錯誤的能力增加了。¦→ Capability｜Error-diagnosis ability grows.
→智慧：「成績是回饋，不是身份。」¦→ Wisdom｜"Grades are feedback, not identity."`);
a(`例子`,`五層不是互斥的｜學生英文一直考不好¦The Five Levels Overlap｜A Student Keeps Doing Poorly in English`,`
同一件事，可以跨越好幾層。¦One event can span several levels.
第一層｜地圖錯誤→老師以為他只是不用功。¦LEVEL 1｜Model error → the teacher assumes he's just lazy.
第二層｜身份錯誤→學生覺得「我就是英文不好」。¦LEVEL 2｜Identity error → the student believes "I'm just bad at English."
第三層｜學習錯誤→一直重讀，沒有自己回想。¦LEVEL 3｜Learning error → rereading without retrieval.
第四層｜環境錯誤→手機一直放在旁邊。¦LEVEL 4｜Environment error → the phone always beside him.
第五層｜更新錯誤→考了三次，還是用同樣的方法。¦LEVEL 5｜Update error → three tests, same method.
所以真正的診斷不是：「你是哪一種錯？」¦So real diagnosis isn't "Which error type are you?"
而是：「這件事的錯誤鏈是什麼？」¦It's "What is this event's error chain?"`);
a(`例子`,`自我強化的錯誤迴路｜學生一直拖延¦The Self-Reinforcing Error Loop｜A Student Keeps Procrastinating`,`
分數最高的錯誤，不一定是最根本的原因。¦The highest-scoring error isn't necessarily the root cause.
學生一直拖延：行動錯誤 6 分、時間錯誤 5 分、學習錯誤 4 分。¦A procrastinating student: action 6, time 5, learning 4.
但往上追，可能會發現：¦But tracing upstream, you may find:
身份錯誤：「反正我就是英文不好。」¦IDENTITY ERROR｜"I'm just bad at English anyway."
↓ 情緒錯誤：一看到英文就焦慮。¦↓ EMOTION ERROR｜Anxiety at the sight of English.
↓ 行動錯誤：開始逃避。¦↓ ACTION ERROR｜Avoidance begins.
↓ 時間錯誤：拖到最後一天。¦↓ TIME ERROR｜Delayed until the last day.
↓ 學習錯誤：只能臨時死背。¦↓ LEARNING ERROR｜Last-minute cramming.
↓ 考差了。¦↓ A poor score.
↓ 身份錯誤，又被強化了一次。¦↓ The identity error is reinforced again.
#【自我強化的錯誤迴路】¦【SELF-REINFORCING ERROR LOOP】
身份→情緒→逃避→拖延→不好的策略→不好的結果→負面回饋→更負面的身份。¦Identity → emotion → avoidance → delay → poor strategy → poor outcome → negative feedback → stronger negative identity.
所以真正要找的，不是「哪一類分數最高」，而是三件事：¦So the real search isn't "which score is highest" but three things:
①最上游的根源錯誤，從哪裡開始？¦① ROOT ERROR｜Where does it start upstream?
②現在卡住結果的，是哪一個點？¦② BOTTLENECK｜What is blocking the outcome now?
③改哪一點，最可能讓整條錯誤鏈鬆開？¦③ LEVERAGE POINT｜Which change would most loosen the whole chain?
最後才啟動：辨識→診斷→根源→卡點→正則化→最小行動→再測→證據→更新地圖→能力→智慧。¦Then start: detection → diagnosis → root error → bottleneck → regularization → minimum action → retest → evidence → model update → capability → wisdom.
這樣，120 題就不是人格測驗，而是一個把「生活問題→找到錯誤→長出智慧」串起來的診斷引擎。¦So the 120 questions aren't a personality test but a diagnostic engine linking life problems → error location → wisdom.`);
a(`路由`,`第一層｜8 題快速導航¦Level One｜8-Question Quick Routing`,`
Q1 我掌握的資訊，真的足夠又可靠嗎？→不是→輸入錯誤¦Q1｜Is my information sufficient and reliable? → NO → INPUT ERROR
Q2 我看到的是事實，還是自己的解讀？→混在一起→感知／詮釋錯誤¦Q2｜Fact or interpretation? → Mixed → PERCEPTION / INTERPRETATION ERROR
Q3 背後是不是有一個可能過期的信念或地圖？→是→信念／地圖錯誤¦Q3｜Is an outdated belief or model behind this? → YES → BELIEF / MODEL ERROR
Q4 我原本預測什麼？真實一樣嗎？→不一樣→預測錯誤¦Q4｜What did I predict, and did reality match? → NO → PREDICTION ERROR
Q5 我是不是在不對的狀態下做決定？→是→狀態／情緒錯誤¦Q5｜Am I deciding in the wrong state? → YES → STATE / EMOTION ERROR
Q6 我的策略和行動，真的改善了結果嗎？→沒有→策略／行動錯誤¦Q6｜Did strategy and action improve the outcome? → NO → STRATEGY / ACTION ERROR
Q7 生活已經給了回饋，我讀懂了嗎？→沒有→回饋錯誤¦Q7｜Reality gave feedback — did I read it? → NO → FEEDBACK ERROR
Q8 知道不準之後，我真的修改地圖並再測了嗎？→沒有→更新錯誤¦Q8｜After seeing it was wrong, did I revise and retest? → NO → UPDATE ERROR`);
a(`路由`,`快速診斷｜第一層只問 10 題¦Quick Diagnosis｜Only 10 Questions First`,`
①資訊夠嗎？→不夠｜輸入¦① Enough data? → NO｜INPUT
②分得開事實與故事嗎？→分不開｜感知／詮釋¦② Can I separate fact and story? → NO｜PERCEPTION / INTERPRETATION
③舊的信念與地圖還適用嗎？→不適用｜信念／地圖¦③ Do old beliefs and models still fit? → NO｜BELIEF / MODEL
④預測和真實一致嗎？→不一致｜預測¦④ Do prediction and reality match? → NO｜PREDICTION
⑤原因真的找對了嗎？→不確定｜因果¦⑤ Did I find the right cause? → UNSURE｜CAUSAL
⑥現在的狀態適合做決定嗎？→不適合｜狀態／情緒¦⑥ Is my state fit for deciding? → NO｜STATE / EMOTION
⑦策略真的改善了結果嗎？→沒有｜策略¦⑦ Did strategy improve the outcome? → NO｜STRATEGY
⑧知道之後，真的行動了嗎？→沒有｜行動¦⑧ Did I act after knowing? → NO｜ACTION
⑨生活的回饋，有被讀懂嗎？→沒有｜回饋¦⑨ Did I read reality's feedback? → NO｜FEEDBACK
⑩證據改變後，地圖有更新嗎？→沒有｜更新¦⑩ Did the model update after evidence changed? → NO｜UPDATE
#【第二層】¦【Level Two】
不要讓人一次填 200 題。第一層的 10 題只負責導航，第二層才進入那一類錯誤的 5 題診斷。¦Don't make anyone answer 200 questions. The first 10 only route; the second level goes into that error type's 5 diagnosis questions.
#【第三層】¦【Level Three】
產出：可能的錯誤→判斷的依據→可能重複的模式→繼續下去的代價→正則化方法→最小行動→再測→更新地圖。¦Output: detected error → evidence → pattern → cost → regularization → minimum action → retest → model update.`);
a(`路由`,`診斷的用意與設計原則¦The Purpose and Principles of Diagnosis`,`
診斷，不是判斷「你這個人有沒有問題」，而是找出「生活系統是從哪一個環節開始偏的」。¦Diagnosis isn't judging whether you have a problem; it locates where your life system began to drift.
使用方式：每題回答「是／有一點／不是／不知道」。¦How to use: answer each with Yes / A little / No / Don't know.
判讀方式：同一類的「是」越多，越值得優先看看，但不能只靠問卷就斷定原因。¦Reading it: more YESes in one category means it's worth checking first, but a questionnaire alone can't prove causation.
#【最重要的設計原則】¦【The Most Important Design Principles】
診斷不能說：「你就是這種人。」¦Diagnosis must never say "You are this kind of person."
而是說：「這次的事件，目前比較像這一類錯誤。」¦It says: "This event currently looks most like this type of error."
因為錯誤是一種狀態，不是你的身份。¦Because an error is a state, not an identity.
診斷不是貼標籤，而是縮小尋找的範圍。¦Diagnosis isn't labeling; it narrows the search space.
正則化不是懲罰，而是把偏掉的系統，溫柔地拉回可以更新的地方。¦Regularization isn't punishment; it gently pulls a drifting system back to where it can update.`);
a(`路由`,`自動導航｜五個問題¦Automatic Navigation｜Five Questions`,`
你只需要說：「今天發生了什麼？」¦You only need to say: "What happened today?"
第一問：你掌握的事實可靠嗎？→不可靠→第一層｜可靠↓¦Q1｜Are your facts reliable? → NO → LEVEL 1｜YES ↓
第二問：你現在的狀態穩定嗎？→不穩定→第二層｜穩定↓¦Q2｜Is your state stable? → NO → LEVEL 2｜YES ↓
第三問：你知道該做什麼，而且真的有效執行了嗎？→沒有→第三層｜有↓¦Q3｜Do you know what to do, and did you do it effectively? → NO → LEVEL 3｜YES ↓

a(`路由`,`第二層｜一路追問下去¦Level Two｜The Follow-Up Path`,`

a(`路由`,`最適合的自動處方結構¦The Best Automatic Prescription Structure`,`
你不需要自己讀完 40 類，只要說：「我今天遇到了＿＿。」¦You don't need to read all 40 types. Just say: "Today I ran into ___."
①判斷在哪一層→②判斷最主要的錯誤→③3 題快速判斷→④5 題診斷→⑤找到根源→⑥找到卡點→⑦找到槓桿→⑧呼叫正則化程序→⑨推薦 3 個策略→⑩只請你選 1 個最小行動。¦① Determine the level → ② top error → ③ 3 quick questions → ④ 5 diagnosis questions → ⑤ root error → ⑥ bottleneck → ⑦ leverage point → ⑧ call the regularization protocol → ⑨ recommend 3 strategies → ⑩ ask you to choose just 1 minimum action.
#【為什麼最後只選一個行動？】¦【Why choose only one action?】
因為一次給十個建議，很容易又產生新的：行動錯誤＋注意力錯誤＋能量錯誤。¦Because ten suggestions at once easily create new ACTION + ATTENTION + ENERGY errors.
所以最後不說：「你應該做以下十件事。」而是說：【今天只改一個變數】。¦So the end isn't "You should do these ten things," but 【Change just one variable today】.
如果改善了：提高新地圖的份量。¦If it improved: give the new model more weight.
如果沒有變：重新找卡點。¦If nothing changed: find the bottleneck again.
如果變差了：檢查運作的機制、副作用與錯誤類型。¦If it got worse: check the mechanism, side effects and error type.
↓ 更新地圖 ↓ 能力 ↓ 智慧。¦↓ MODEL UPDATE ↓ CAPABILITY ↓ WISDOM.`);

⑦再測｜下一次怎麼知道自己真的更新了？¦⑦ RETEST｜How will I know next time that I've truly updated?`);
a(`正則化`,`什麼是正則化？¦What Is Regularization?`,`
正則化，原本是機器學習的語言。¦Regularization comes from machine learning.
白話就是：別讓自己因為少數的經驗、強烈的情緒、單一的資訊或舊的習慣，越學越偏。¦In plain words: don't let a few experiences, strong emotions, one source or old habits pull your learning further and further off course.
生命的正則化，不是把自己「改正」。¦Life regularization isn't "correcting" yourself.
而是在想法、情緒、決定與行動快要偏向某一邊時，溫柔地加入一個校準。¦It's gently adding calibration when thoughts, emotions, decisions and actions start leaning too far one way.
辨識錯誤只是診斷；正則化，才是防止再次偏回舊模式的修正。¦Detecting errors is diagnosis; regularization is the correction that keeps you from drifting back to old patterns.
正則化＝把偏掉的系統拉回來；實作策略＝接下來具體要做什麼。¦Regularization pulls the system back; implementation strategy is what you actually do next.
核心公式：錯誤→辨識→暫停→校準→新行動→再測→更新。¦Core formula: error → detect → pause → regularize → new action → retest → update.`);
a(`正則化`,`正則化的 12 個步驟¦The 12 Steps of the Regularization OS`,`
任何生活的錯誤出現時，不必立刻問「我要怎麼解決？」，先走這 12 步。¦When any life error appears, don't rush to "How do I fix it?" — walk these 12 steps first.
①暫停｜先停一下。¦① PAUSE｜Stop for a moment.
②事實｜真正發生了什麼？¦② FACT｜What really happened?
③狀態｜我現在是什麼狀態？¦③ STATE｜What state am I in?
④錯誤｜是哪一類錯誤？¦④ ERROR｜Which type of error?
⑤偏差｜哪裡可能偏得太過？¦⑤ BIAS｜Where might I be leaning too far?
⑥限制｜真正的限制是什麼？¦⑥ CONSTRAINT｜What's the real constraint?
⑦校準｜加入什麼校準的方法？¦⑦ REGULARIZE｜What calibration will I add?
⑧選項｜重新打開其他的可能。¦⑧ OPTIONS｜Reopen the possibilities.
⑨最小行動｜做一個最小、可以回頭的行動。¦⑨ MINIMUM ACTION｜Take the smallest reversible action.
⑩回饋｜生活怎麼回答？¦⑩ FEEDBACK｜How does reality answer?
⑪再測｜再試一次。¦⑪ RETEST｜Test again.
⑫更新｜更新你的地圖。¦⑫ MODEL UPDATE｜Update your model.`);
a(`正則化`,`正則化的本質¦The Essence of Regularization`,`
正則化，不是把人生變得「正確」。¦Regularization doesn't make life "correct."
而是當系統開始太執著於過去的經驗時，把它拉回可以更新的狀態。¦It pulls the system back to an updatable state when it starts overfitting to the past.
一次失敗，不必推論成「我永遠會失敗」。¦One failure doesn't mean "I'll always fail."
一個人傷了我，不必推論成「所有人都不可信」。¦One person hurting you doesn't mean "no one can be trusted."
一次成功，不必推論成「這個方法永遠有效」。¦One success doesn't mean "this method always works."
身體好轉一次，不必立刻認定「一定是某個原因」。¦One improvement in health doesn't prove "it must be this one cause."
AI 回答一次，不必把它升格成真理。¦One AI answer shouldn't be promoted to truth.
某位老師說的，不必自動變成權威。¦What one teacher says needn't become authority.
某本書說的，不必自動變成人生定律。¦What one book says needn't become a law of life.
某個傳統說的，保留歷史的智慧，也保留重新驗證的權利。¦What a tradition says keeps historical wisdom and the right to retest it.
某個科學模型說的，看看證據、適用範圍與更新的條件。¦What a scientific model says: check evidence, scope and update conditions.
正則化真正保護的，不是「正確答案」。¦What regularization protects isn't "the right answer."
而是生命的流動性。¦It's the fluidity of the system.
因為最危險的，不是暫時錯了的系統。¦Because the most dangerous system isn't one that's temporarily wrong.
而是「錯了以後，不能更新」的系統。¦It's one that can't update after being wrong.
每發現一種錯誤，就呼叫對應的正則化程序。¦Each detected error type triggers its matching regularization protocol.
再比較正則化前後的預測落差：如果縮小了，就留下這次的更新；如果沒有，就再調整一次。¦Then compare prediction error before and after: if it shrinks, keep the update; if not, adjust again.
這樣，智慧就不再只是文章，而會成為一個能持續自我修正的生命系統。¦So wisdom stops being an essay and becomes a life system that keeps correcting itself.`);
a(`公式`,`正則化前後的比較｜判斷有沒有效¦PE Before / After｜Did the Regularization Work?`,`
錯誤不是終點。¦Error isn't the end.
錯誤→程序→正則化→行動→預測→真實→預測落差→再測→更新地圖。¦ERROR → PROTOCOL → REGULARIZATION → ACTION → PREDICTION → REALITY → PREDICTION ERROR → RETEST → MODEL UPDATE.
正則化前的落差 ↓ 執行正則化程序 ↓ 正則化後的落差¦PE BEFORE ↓ run the regularization protocol ↓ PE AFTER
之後＜之前→保留：留下這次的更新。¦AFTER < BEFORE → KEEP｜Keep the update.
之後≈之前→調整：重新找卡點或策略。¦AFTER ≈ BEFORE → MODIFY｜Find the bottleneck or strategy again.
之後＞之前→停止或退回：檢查錯誤類型、機制與副作用。¦AFTER > BEFORE → STOP / ROLLBACK｜Check error type, mechanism and side effects.
多次成功之後：策略→決策規則→能力→跨情境再測→智慧。¦After repeated success: strategy → decision rule → capability → cross-context retest → wisdom node.`);
a(`公式`,`錯誤鏈 ⇄ 智慧生成鏈¦Error Chain ⇄ Wisdom Chain`,`
#【錯誤鏈】¦【ERROR CHAIN】
錯的資訊→錯的感知→強化錯的信念→建立錯的地圖→產生錯的預測→進入錯的狀態→做出錯的決定→選錯策略→錯的行動→錯的結果→生活給出回饋→如果沒有更新→同樣的模式再次發生。¦Wrong input → wrong perception → reinforced wrong belief → wrong model → wrong prediction → wrong state → wrong decision → wrong strategy → wrong action → wrong outcome → feedback → if no update → the same pattern happens again.
#【反過來，就是智慧生成鏈】¦【Reversed, it becomes the wisdom chain】
更好的資訊→更好的感知→更好的地圖→更好的預測→更好的自我照顧→更好的決定→更好的策略→更好的行動→更好的條件→更好的回饋→更好的更新→新的能力→智慧。¦Better input → better perception → better model → better prediction → better self-regulation → better decision → better strategy → better action → better conditions → better feedback → better model update → new capability → wisdom.`);
a(`公式`,`生命錯誤真正的母體¦The True Mother of Life's Errors`,`
我們最需要避開的，不是「犯錯」。¦What we most need to avoid isn't making mistakes.
完全不犯錯，可能代表你從沒探索過新的可能。¦Never making mistakes may mean you've never explored anything new.
真正昂貴的是：¦What's truly costly is:
犯了錯→沒有發現。¦Making a mistake → not noticing.
發現了→沒有診斷。¦Noticing → not diagnosing.
診斷了→找錯原因。¦Diagnosing → finding the wrong cause.
找到原因→沒有行動。¦Finding the cause → not acting.
行動了→沒有再測。¦Acting → not retesting.
再測失敗→沒有更新。¦Retest fails → no update.
更新成功→沒有保存成能力。¦Update succeeds → not saved as capability.
#【完整的生命智慧生成閉環】¦【The Complete Loop of Life Wisdom】
生活事件→我原本怎麼想→生活怎麼回答→哪裡出現落差→屬於哪種錯誤→背後的模式→真正的卡點→怎麼形成的→最值得改的槓桿→舊地圖→新地圖→下一個最小行動→回到真實再測→證據→更新地圖→新的能力→智慧→下一次更好的預測。¦Life event → what I thought → how reality answered → where the prediction error is → error type → pattern → bottleneck → mechanism → leverage point → old model → new model → next minimum action → reality retest → evidence → model update → new capability → wisdom → a better next prediction.
真正的成長，不是「我再也不犯錯」。¦True growth isn't "I never make mistakes anymore."
而是「同一種錯誤，不再需要十年才看懂」。¦It's "the same kind of mistake no longer takes ten years to understand."
真正的自由，也不是永遠做對。¦True freedom isn't always being right.
而是當生活證明舊地圖失效時，你有能力更新，而不是繼續被昨天的自己綁住。¦It's being able to update when reality proves the old model wrong, instead of staying bound by yesterday's self.`);
a(`公式`,`最終的智慧生成公式¦The Final Wisdom Formula`,`
事件不是終點。¦An event isn't the end.
事件→問題→錯誤→模式→機制→卡點→槓桿→行動→回饋→更新地圖→再測→證據→能力→智慧。¦Event → problem → error → pattern → mechanism → bottleneck → leverage → action → feedback → model update → retest → evidence → capability → wisdom.
智慧，再回到下一次的預測。¦Wisdom returns to the next prediction.
這才是真正的「生活→長出智慧→回到生活」。¦This is the true loop of life → wisdom → life.
生活變成資料，錯誤變成訊號，訊號喚起正則化，正則化帶來實驗，實驗產生證據，證據更新地圖，最後沉澱成能力與智慧。¦Life becomes data; errors become signals; signals trigger regularization; regularization creates experiments; experiments produce evidence; evidence updates the model; and it settles into capability and wisdom.
這才是一個可以一直自我成長的人生系統。¦This is a Life OS that can keep iterating itself.`);
a(`公式`,`完整的人生閉環¦The Complete LifeOS Loops`,`
#【正則化的閉環】¦【Regularization loop】
生活→事件→預測→真實→錯誤→錯誤類型→正則化→新的選項→行動→回饋→再測→更新地圖→能力→智慧→新的預測→下一次生活。¦Life → event → prediction → reality → error → error type → regularization → new option → action → feedback → retest → model update → capability → wisdom → new prediction → the next life event.
#【生命智慧生成母體】¦【Life wisdom mother loop】
生活事件→錯誤辨識→錯誤分類→案例比對→模式辨識→不更新的代價→正則化→新地圖→最小行動→再測→證據→更新地圖→能力→智慧→寫回母體→下一個新的事件。¦Event → error detection → error type → life case → pattern → cost of not updating → regularization → new model → minimum action → retest → evidence → model update → capability → wisdom → write back to the mother node → the next event.
#【診斷的閉環】¦【Diagnosis loop】
事件→診斷→錯誤類型→證據→模式→卡點→正則化→新地圖→最小行動→再測→新的證據→更新地圖→能力→智慧→下一次更準的預測。¦Event → diagnosis → error type → evidence → pattern → bottleneck → regularization → new model → minimum action → retest → new evidence → model update → capability → wisdom → a more accurate next prediction.
#【真正完整的人生閉環】¦【The full LifeOS loop】
生活→事件→錯誤辨識→五層導航→判斷題→診斷→根源錯誤→錯誤鏈→卡點→槓桿→正則化→策略→最小行動→預測→真實→回饋→再測→證據→更新地圖→能力→智慧→寫回母體→下一次生活。¦Life → event → error detection → 5-level routing → judgment questions → diagnosis → root error → error chain → bottleneck → leverage point → regularization → strategy → minimum action → prediction → reality → feedback → retest → evidence → model update → capability → wisdom → mother node → the next life.
#【自動導航】¦【Automatic navigation】
生活事件→①五層導航→②40 類錯誤候選→③3 題快速判斷→④5 題診斷→⑤信心程度→⑥錯誤鏈→⑦根源→⑧卡點→⑨槓桿→⑩呼叫對應的 RP01～RP40→⑪只給一個最小行動→⑫留下預測→⑬回到真實再測→⑭計算預測落差→⑮保留／調整／放下→⑯更新地圖→⑰能力→⑱智慧。¦Event → ① 5-level routing → ② 40 error candidates → ③ 3 quick questions → ④ 5 diagnosis questions → ⑤ confidence → ⑥ error chain → ⑦ root error → ⑧ bottleneck → ⑨ leverage → ⑩ call RP01–RP40 → ⑪ one minimum action → ⑫ record a prediction → ⑬ reality retest → ⑭ calculate prediction error → ⑮ keep / modify / reject → ⑯ model update → ⑰ capability → ⑱ wisdom.
最終的目的，不是成為一個「不犯錯的人」。¦The final goal isn't becoming someone who never makes mistakes.
而是成為一個：看得見錯誤→找得到根源→知道怎麼校準→能快快行動→願意接受真實→能依照回饋更新→最後把錯誤轉成能力與智慧的人。¦It's becoming someone who sees errors → finds the root → knows how to regularize → acts quickly → accepts reality → updates from feedback → and turns errors into capability and wisdom.`);
a(`公式`,`五層口訣｜看・穩・做・設・更¦The Five-Level Mantra｜See, Steady, Do, Design, Update`,`
第一層｜看清楚。¦Level 1｜See clearly.
第二層｜穩住自己。¦Level 2｜Steady yourself.
第三層｜選對行動。¦Level 3｜Choose the right action.
第四層｜設計條件。¦Level 4｜Design the conditions.
第五層｜持續更新。¦Level 5｜Keep updating.
#【一句話總結整個人生系統】¦【The whole LifeOS in a sentence】
看錯了→校準認知。¦Saw it wrong → calibrate cognition.
亂掉了→照顧狀態。¦Thrown off → tend your state.
卡住了→換個策略。¦Stuck → change strategy.
重複了→重設系統。¦Repeating → reset the system.

而是任何錯誤走進這五層之後，都能被轉化成：錯誤→診斷→正則化→行動→回饋→更新→能力→智慧。¦It's that any error, entering these five levels, can be turned into: error → diagnosis → regularization → action → feedback → update → capability → wisdom.`);
a(`總母體`,`核心定義｜生活生命正則化總母體¦Core Definition｜The Life Regularization OS`,`
正則化，是當你的想法、情緒、習慣、關係、工作、健康或 AI，開始「越走越偏、越做越僵、越投入越難回頭」時，溫柔地加入限制、反例、回饋與真實的檢驗，別讓自己過度執著於舊的經驗。¦Regularization means that when your thoughts, emotions, habits, relationships, work, health or AI start drifting further, stiffening more and becoming harder to turn back from, you gently add limits, counterexamples, feedback and reality checks so you don't overfit to old experience.
它不是把人生控制得更緊。¦It isn't controlling life more tightly.
反而是不讓任何一張地圖、一種慾望、一份恐懼、一個身份、一段關係或一個策略，拿走太多的主導權。¦It keeps any single model, desire, fear, identity, relationship or strategy from taking too much control.
最簡單的白話是：¦In the simplest words:
#【太多了→減一點份量。】¦【Too much → reduce the weight.】
#【太少了→補一點。】¦【Too little → add some.】
#【太僵了→鬆一鬆。】¦【Too rigid → loosen up.】
#【太亂了→加一點結構。】¦【Too messy → add structure.】
#【太快了→加一點摩擦。】¦【Too fast → add friction.】
#【太慢了→降低開始的門檻。】¦【Too slow → lower the cost of starting.】
#【太相信了→找找反例。】¦【Too trusting → look for counterexamples.】
#【太懷疑了→找找證據。】¦【Too doubtful → look for evidence.】
#【太投入了→看看機會成本。】¦【Too invested → check the opportunity cost.】
#【太執著了→重新看看目標。】¦【Too attached → look at the goal again.】
#【太複雜了→刪一些。】¦【Too complex → delete some.】
#【太單一了→多一些可能。】¦【Too narrow → add possibilities.】
#【離真實太遠了→重新接回真實。】¦【Too far from reality → reconnect to reality.】`);
a(`總母體`,`一｜正則化的本體¦One｜What Regularization Really Is`,`
生命本來就是流動的。¦Life is a dynamic system.
沒有任何狀態，需要永遠維持。¦No state needs to last forever.
真正危險的，通常不是某個狀態本身，而是：¦What's truly dangerous usually isn't a state itself, but:
狀態不能切換。¦States that can't switch.
地圖不能更新。¦Models that can't update.
資源不能重新分配。¦Resources that can't be reallocated.
關係不能重新對話。¦Relationships that can't be renegotiated.
身份不能重新定義。¦Identities that can't be redefined.
策略不能退場。¦Strategies that can't be exited.
錯誤不能被承認。¦Errors that can't be admitted.
所以，真正需要正則化的不是「人生」。¦So what needs regularizing isn't "life" itself.
而是人生裡那些【過度固定】的地方。¦It's the 【over-fixed】 places in life.`);
a(`總母體`,`二｜正則化的控制結構¦Two｜The Control Structure of Regularization`,`
目標→行動→真實→回饋→預測落差¦Goal → action → reality → feedback → prediction error
落差很小→繼續。¦Small error → continue.
落差持續變大→提醒。¦Growing error → alert.
↓ 檢查：過度？不足？僵化？失衡？錯配？過時？¦↓ Check: excessive? insufficient? rigid? imbalanced? mismatched? outdated?
↓ 正則化：減少錯的份量＋補上缺少的訊號＋加入反例＋重新分配資源＋恢復界線＋重新設定目標¦↓ Regularization: reduce wrong weights + add missing signals + add counterexamples + reallocate resources + restore boundaries + reset goals
↓ 再測→新的真實→更新地圖。¦↓ Retest → new reality → model update.`);
a(`總母體`,`七十三｜正則化總檢查表（24 問）¦Seventy-Three｜The Regularization Checklist (24 Questions)`,`
遇到任何問題，先溫柔地問問自己：¦Whatever the problem, first gently ask:
①【真實】真正發生了什麼？¦①【Reality】What really happened?
②【事實】哪些是可以確認的？¦②【Fact】What can be confirmed?
③【詮釋】哪些只是我的解釋？¦③【Interpretation】What is only my explanation?
④【前提】我偷偷加了什麼前提？¦④【Assumption】What assumption did I quietly add?
⑤【情緒】現在的情緒，是不是放大了某個訊號？¦⑤【Emotion】Is my emotion amplifying a signal?
⑥【身份】我是不是把一件事，變成了「我就是……」？¦⑥【Identity】Did I turn one event into "I'm just…"?
⑦【因果】我是不是把相關當成了因果？¦⑦【Causality】Am I mistaking correlation for causation?
⑧【其他可能】還有哪三種可能？¦⑧【Alternative】What are three other possibilities?
⑨【反例】有什麼反例？¦⑨【Counterexample】What contradicts it?
⑩【邊界】這個說法在什麼條件下不成立？¦⑩【Boundary】Under what conditions does it fail?
⑪【份量】哪個因素被我放得太重？¦⑪【Weight】Which factor did I weigh too heavily?
⑫【遺漏】哪個因素被我忽略了？¦⑫【Missing variable】What did I overlook?
⑬【循環】是不是有一個自我強化的循環？¦⑬【Feedback loop】Is there a self-reinforcing loop?
⑭【限制】真正限制系統的是什麼？¦⑭【Constraint】What really limits the system?
⑮【槓桿】改哪一點最省力？¦⑮【Leverage】Which change takes least effort?
⑯【機會成本】我為此放棄了什麼？¦⑯【Opportunity cost】What am I giving up?
⑰【預測】如果我是對的，接下來應該看到什麼？¦⑰【Prediction】If I'm right, what should I see next?
⑱【行動】最小、可以測試的行動是什麼？¦⑱【Action】What's the smallest testable action?
⑲【回饋】生活怎麼回答？¦⑲【Feedback】How does reality answer?
⑳【落差】哪裡和預測不同？¦⑳【Prediction error】Where does it differ from the prediction?
㉑【正則化】什麼需要減少份量、收斂、平衡或重新加入？¦㉑【Regularization】What needs less weight, narrowing, balancing or re-adding?
㉒【更新】哪一張地圖需要修改？¦㉒【Model update】Which model needs revising?
㉓【再測】怎麼重新測試？¦㉓【Retest】How will I test again?
㉔【能力】這次的錯誤，最後長出了什麼能力？¦㉔【Capability】What capability did this error finally grow?`);
a(`總母體`,`七十四｜正則化導航器¦Seventy-Four｜The Regularization Router`,`
說出任何問題¦Bring any problem
↓ 先辨認它屬於哪個領域：學習？健康？情緒？關係？家庭？工作？金錢？AI？信念？身份？人生？¦↓ First identify the domain: learning? health? emotion? relationship? family? work? money? AI? belief? identity? life?
↓ 看看有沒有哪裡份量太重：絕對化？身份化？只看單一原因？災難化？權威化？只看支持的證據？捨不得沉沒成本？過度控制？過度簡化？過度複雜？目標錯配？缺少回饋？¦↓ Detect excessive weight: absolutizing? identity-izing? single cause? catastrophizing? authority worship? confirmation bias? sunk cost? over-control? oversimplifying? overcomplicating? goal mismatch? missing feedback?
↓ 有¦↓ YES
↓【啟動正則化】¦↓【REGULARIZATION TRIGGER】
↓ 減少過重的份量→補上遺漏的變數→加入其他的地圖→加入反證→檢查邊界→重新接回真實→設計最小實驗→預測→行動→回饋→預測落差→更新地圖。¦↓ Reduce excess weight → add missing variables → add alternative models → add counter-evidence → check boundaries → reconnect to reality → design a minimum experiment → prediction → action → feedback → prediction error → model update.`);
a(`總母體`,`七十五｜回到《易經》：窮・變・通・久¦Seventy-Five｜Back to the I Ching: Exhaust, Change, Flow, Endure`,`
【窮】舊的地圖，已經接不住新的落差。¦【Exhaust】The old model can no longer absorb new prediction errors.
【變】重新調整份量、關係、界線、策略與目標。¦【Change】Readjust weights, relationships, boundaries, strategies and goals.
【通】資訊、資源與行動，重新流動起來。¦【Flow】Information, resources and action flow again.
【久】生命擁有持續修正自己的能力。¦【Endure】The system can keep correcting itself.
所以「久」真正的條件，不是永遠維持原狀。¦So the real condition for "enduring" isn't staying the same forever.
而是永遠不要失去更新的能力。¦It's never losing the ability to update.`);
a(`總母體`,`最終公式｜別讓任何一個節點，獨佔整個人生¦Final Formula｜Don't Let Any Single Node Monopolize Your Life`,`
生命失控，往往不是因為完全沒有地圖。¦Life spinning out of control usually isn't from having no model at all.
而可能是某一張地圖的份量太重。¦It may be one model weighing too much.
某一種情緒太重。某一個人太重。某一個目標太重。某一段過去太重。某一個身份太重。某一套權威太重。某一種成功的方法太重。某一個 AI 的答案太重。¦One emotion too heavy. One person. One goal. One past. One identity. One authority. One success formula. One AI answer.
正則化就是：【別讓任何一個節點，獨佔整個人生。】¦Regularization means: 【don't let any single node monopolize your whole life.】
所以生命的正則化，不是追求「永遠平衡」。而是建立：¦So life regularization isn't pursuing "permanent balance." It's building:
察覺。暫停。比較。重新分配份量。實驗。回饋。更新。再測。¦Detect. Pause. Compare. Reweight. Experiment. Feedback. Update. Retest.
真正的智慧，不是永遠保持同一個答案。而是：¦True wisdom isn't keeping the same answer forever. It's:
該穩定時，能穩定。¦Steady when it's time to be steady.
該懷疑時，能懷疑。¦Doubting when it's time to doubt.
該行動時，能行動。¦Acting when it's time to act.
該停下時，能停下。¦Stopping when it's time to stop.
該保留時，能保留。¦Keeping when it's time to keep.
該放手時，能放手。¦Letting go when it's time to let go.
該更新時，能更新。¦Updating when it's time to update.
#【真正的自由，是沒有任何一張舊地圖，擁有永遠否決你更新的權力。】¦【True freedom = no old model holds a permanent veto over your updating.】`);

lk:`把感覺當成真的`,core:`把真的事和故事分開`,fa:`畫「真的事／我想的」兩格`,
soup:`戴上藍色眼鏡，世界都變藍；戴上灰色眼鏡，世界都變灰。可是世界沒有變，變的是眼鏡。難過的時候，先把眼鏡拿下來擦一擦，再看一次。也許，事情沒有那麼糟。¦With blue glasses the world looks blue; with grey glasses it looks grey. The world didn't change — the glasses did. When you feel sad, take them off, wipe them and look again. Maybe things aren't so bad.`});

k(4,{sub:`事情沒那麼嚴重，是故事越想越可怕`,def:`詮釋，就是你幫一件事加上的意思。`,
pl:`事情只發生一次，腦袋卻編出一整本故事。`,
mi:`他說不要，就覺得自己沒人要|考不好，就覺得自己很笨|家裡吵架，就覺得一切都完了|孩子不聽話，就覺得自己不是好媽媽|東西賣不好，就覺得東西很爛|被念一次，就覺得大家都討厭我|失敗一次，就覺得以後都會失敗`,
co:`事情本來只讓你痛一次|可怕的故事，卻讓你每天再痛一次|慢慢變成怪自己、擔心、害羞、躲起來`,
up:`問自己：除了這個故事，還有哪三種可能？`,
iq:`真的發生了什麼事？|我後來自己加了什麼故事？|我是不是覺得「以後都會這樣」？|還有哪三種別的可能？|如果是好朋友遇到，我也會想得這麼嚴重嗎？`,
ic:`一件事，變成痛很久很久。`,
rp:`事情只有一件，腦袋卻演了一整齣戲。`,ri:`哪些是真的，哪些是我自己加的？`,rc:`一件事，痛了好久。`,
rm:`把「發生的事」和「我想的意思」分開|不說「永遠、一定、全部、從來」|同一件事，想出三種意思|問：我還有什麼不知道？|不說「他就是壞」，改說「那時候發生了什麼」|大事情，過一天再想一次`,rk:`先留著好幾種想法，不要太快只選一個。`,
cs:`考差一次：「我不是讀書的料。」|被拒絕一次：「沒有人會喜歡我。」|一次賣不好：「沒有人需要。」|吵一次架：「我們完了。」|孩子頂嘴：「我教得好失敗。」|今天做得慢：「我整個人都沒用了。」`,
cc:`一件事，被想成一輩子的事。`,cr:`不說「永遠、全部、一定」，再想三種可能。`,cl:`事情只讓你痛一次，故事卻會讓你每天痛。`,
dx:`我是不是用一件事，就決定了全部？|我有沒有說「永遠、一定、大家、從來」？|我是不是在猜別人的心，卻沒辦法證明？|我能不能再想出三種可能？|讓我難過的，是事情，還是我編的故事？`,dr:`「是」很多，先不要急，回頭看看那個故事。`,
q:`一件不好的事，我就想到「以後都會這樣」。|我常說「一定、永遠、全部、從來」。|我常猜別人是故意的，可是我沒辦法證明。`,qy:`再想想別的可能。`,
ac:`寫下腦袋裡的故事。|再寫三種別的可能。|把「永遠、一定、全部、從來」劃掉。|不說他是什麼人，改說那時候怎麼了。|問：「我還缺什麼證明？」`,
da:`每天練習：一件事，三種想法。`,sy:`大事情，隔一天再想一次。`,kp:`一件小事，不會再變成天大的事。`,al:`多留幾種想法，心就比較自由。`,
lk:`一件小事，被想成很大的故事`,core:`多想幾種可能`,fa:`寫出三種別的可能`,
soup:`跌倒一次，膝蓋會痛，可是擦擦藥就好了。如果一直想「我永遠都會跌倒」，那才會一直痛。跌倒只是跌倒，不是你的全部。拍拍灰塵，站起來，你還是很棒的你。¦When you fall, your knee hurts, but a little medicine helps. If you keep thinking "I will always fall," that's what keeps hurting. A fall is just a fall — it isn't all of you. Dust yourself off and stand up. You're still wonderful.`});

k(5,{sub:`以前相信的規則，可能已經過期了`,def:`信念，就是你心裡一直相信的規則。`,
pl:`它以前也許有用，可是現在不一樣了，你還照舊做。`,
mi:`努力就一定會成功|老師什麼都要會|爸媽說的一定對|長大了就不能改|我天生數學不好|有錢才算成功|忍耐才是好人|說「不要」就是自私|以前有用的方法，現在一定也有用`,
co:`看不到新的機會|聽不進新的事|一直過一樣的日子|世界變了，心裡的規則還沒換`,
up:`問自己：這條規則，現在還是真的嗎？`,
iq:`我為什麼相信這件事？|是我自己試過的，還是別人說的？|以前有用，現在還有用嗎？|有沒有事情跟我想的不一樣？|如果放下它，我會多出哪些選擇？`,
ic:`世界變了，我還用舊的規則過日子。`,
rp:`以前的規則，可能過期了。`,ri:`我為什麼相信它？現在還是真的嗎？`,rc:`世界是新的，我的規則還是舊的。`,
rm:`寫下這條規則是從哪裡學來的|找找看支持它的事|也找找看不支持它的事|想想它在什麼時候才對|可以「有一點對」就好|常常問：看到什麼，我會改變想法？`,rk:`規則是暫時的地圖，不是永遠的真理。`,
cs:`「女生數學本來就比較差。」|「我年紀大了，學不會 AI。」|「老師就應該什麼都會。」|「爸媽說的不能說不。」|「吃越多苦，才是越努力。」|「以前這樣賣很好，現在一定也可以。」`,
cc:`世界已經變了，心裡的規則還停在以前。`,cr:`問：有什麼證明？有沒有反例？什麼時候才對？`,cl:`以前幫過你的規則，今天也可能把你關住。`,
dx:`這是我自己試過的，還是從家裡、學校、別人那裡聽來的？|我是不是好幾年沒有再想過它？|有沒有事情已經跟它不一樣了？|我會不會不想聽跟它不同的話？|如果它不是真的，我會多出哪些選擇？`,dr:`「是」很多，可能是舊規則擋住了新的路。`,
q:`有些規則我相信很久了，卻沒有再檢查過。|聽到跟我想的不一樣的話，我常常不想聽。|我常覺得「以前都這樣，現在也要這樣」。`,qy:`看看舊規則是不是過期了。`,
ac:`寫下那句綁住你的話。|問：「我是從哪裡學來的？」|寫三件支持它的事。|寫三個反例。|改成「有時候」的說法。|像是：「我英文不好」→「我的長句子還在練習。」`,
da:`抓一句「我就是／一定／不可能」，再想一次。`,sy:`每個月檢查一次心裡的規則。`,kp:`死死的規則，變成可以試試看的想法。`,al:`不要把規則當成真理，把它當成可以改的地圖。`,
lk:`舊規則一直沒有再檢查`,core:`找支持、找反例、加上「什麼時候」`,fa:`寫下綁住自己的那句話`,
soup:`小時候的鞋子很合腳，可是腳長大了，鞋子就會擠。心裡的規則也一樣。以前合用，不代表現在還合用。換一雙新鞋不是背叛舊鞋，是因為你長大了。¦Your childhood shoes once fit well, but your feet grew and now they pinch. Inner rules are the same. What fit before may not fit now. Getting new shoes isn't betraying the old ones — it's because you've grown.`});

k(6,{sub:`不是你不努力，是手上的地圖畫錯了`,def:`模型，就是你心裡用來認路的地圖。`,
pl:`你很認真在走，只是拿到一張畫錯的地圖。`,
mi:`以為健康只要看體重|以為成績只看讀多久|以為孩子不聽話就是態度不好|以為做不好就是懶惰|以為一直忍耐就會變好|以為東西好就會有人買|以為知道很多就是有智慧|以為一個原因只會有一個結果`,
co:`越努力，可能走得越遠|因為你沒有做錯，是地圖畫錯了`,
up:`先不要問「我要更努力嗎？」，先問「我的地圖對嗎？」`,
iq:`我是怎麼想這件事的？|這樣想，能說明現在的情況嗎？|它能猜對下一次嗎？|有沒有重要的事被我漏掉？|我已經很努力了卻沒變好，會不會是地圖錯了？`,
ic:`拿錯地圖，越努力越走不到。`,
rp:`心裡的地圖，可能畫錯了。`,ri:`一直努力卻沒變好，會不會是地圖錯了？`,rc:`越努力，離目標越遠。`,
rm:`畫出「我做了什麼→怎麼發生→結果」|寫下被忘記的原因|至少畫兩張不同的地圖|看看哪一張比較準|地圖不是越複雜越好|把沒有用的部分擦掉`,rk:`不要保護舊地圖，讓真的事情幫你改地圖。`,
cs:`以為英文不好是單字背太少，其實是看不懂長句子|以為變胖只是吃太多，忘了睡覺和運動|以為孩子懶，其實他不知道怎麼開始|以為賣不好是太貴，其實客人不知道為什麼要買|以為常吵架是不會說話，其實是沒有分清楚誰的事|以為要更努力，其實是做事的方法要改`,
cc:`更努力了，結果卻沒有變好。`,cr:`畫兩張地圖，看哪一張比較準。`,cl:`努力沒有錯，錯的可能是地圖。`,
dx:`我到底是怎麼想這個問題的？|這樣想，能說明全部的事嗎？|有沒有重要的原因被我漏掉？|我已經很努力了，卻沒有變好？|有沒有另一種更簡單的想法？`,dr:`「是」很多，先不要更用力，重新畫地圖。`,
q:`我已經很努力了，同一個問題卻一直沒變好。|我通常只有一種想法。|結果不好時，我只想更努力，沒有回頭看地圖。`,qy:`也許不是不夠努力，是地圖要換了。`,
ac:`畫出「我覺得甲為什麼會變成乙」。|畫出地圖一和地圖二。|寫下每張地圖猜會發生什麼。|找出能分出哪張對的事。|哪張比較準，就多相信它。`,
da:`卡住時問：「還有別的想法嗎？」`,sy:`把每次改過的地圖記下來。`,kp:`地圖越來越準。`,al:`不要守著舊地圖，讓真的事情幫你重畫。`,
lk:`越努力，結果還是沒變好`,core:`畫兩張地圖來比一比`,fa:`畫地圖一和地圖二`,
soup:`如果地圖畫錯了，跑得再快也到不了。這不是你的腳不好，是地圖要換一張。停下來，看一看，問一問，換一張新的。走對了路，慢慢走也會到。¦If the map is wrong, running faster won't get you there. It's not your legs — the map needs changing. Stop, look, ask, and get a new one. On the right road, even slow steps arrive.`});

k(7,{sub:`我以為會這樣，結果不是`,def:`預測，就是事情還沒發生，你先猜會怎樣。`,
pl:`其實我們每天都在猜接下來會怎樣。`,
mi:`以為一小時寫得完，結果寫了三小時|以為同學會自己讀，結果沒有|以為別人一定懂|以為買了課，自己就會變厲害|以為大家一定喜歡|以為明天一定有空|以為會很糟，結果沒事|以為一定成功，所以沒有準備別的辦法`,
co:`時間不夠用|答應的事做不到|錯過機會|花更多錢和力氣|更常失望|一直不調整，就會一直猜太多或猜太少`,
up:`猜錯不是失敗，是免費的練習。`,
iq:`事情發生前，我猜會怎樣？|後來真的怎樣？|差最多的是哪裡？|我把什麼想得太多？|我把什麼想得太少？|下次我要怎麼猜？`,
ic:`時間、花費、期待，常常跟真的不一樣。`,
rp:`我以為，結果不是。`,ri:`我猜的和真的，差多少？`,rc:`期待、花費、時間，一直對不上。`,
rm:`重要的事，先寫下我猜會怎樣|最好寫成數字|做完再寫真的結果|把猜的和真的放一起比|找出我常常猜太多還是太少|下次改一改`,rk:`不要怕猜錯，每次猜錯都讓下次更準。`,
cs:`以為功課一小時寫完，結果寫了三小時|以為大家會先預習，結果很多人沒有|以為東西一擺出來就有人買|以為孩子上大學一定很習慣|以為出去玩花兩萬，結果花了四萬|以為明天有空，結果又排滿了`,
cc:`時間、錢、期待，一次一次跟真的對不上。`,cr:`先寫猜的，再寫真的，比一比，下次改。`,cl:`猜錯不可怕，都不改才可惜。`,
dx:`事情發生前，我猜的是什麼？|真的結果差了多少？|我是不是常把時間、花費、難度想得太少？|我是不是常把自己或別人想得太厲害？|一樣的猜錯，是不是發生好幾次了？`,dr:`「是」很多，要做的是調整，不是罵自己。`,
q:`我常把要花的時間或錢想得太少。|我常以為自己或別人會做完，結果沒有。|同樣的事，我常常猜錯一樣的地方。`,qy:`養成「先猜、再對答案」的習慣。`,
ac:`開始前，先寫下我猜會怎樣。|寫成數字：多久、多少錢、做多少。|做完寫下真的結果。|算算差多少。|圈出我常猜太多或太少的地方。`,
da:`每天猜一件小事，再對答案。`,sy:`準備一本「我猜的」小本子。`,kp:`猜錯的差距越來越小。`,al:`長大，就是下次猜得比這次準一點。`,
lk:`「我以為」和真的不一樣`,core:`先猜、再對答案`,fa:`寫下「我猜的」和「真的」`,
soup:`丟球進籃子，第一次常常丟不進。沒關係，看看是太用力還是太輕，再丟一次。每丟一次，手就更準一點。猜錯不丟臉，那是在告訴你下一球要怎麼丟。¦The first time you toss a ball at a basket, you often miss. That's okay. See if it was too hard or too soft, then try again. Each throw makes your aim better. A wrong guess isn't shameful — it tells you how to throw the next one.`});

k(8,{sub:`一起發生的事，不一定是誰害誰`,def:`因果，就是「是不是這個造成那個」。`,
pl:`兩件事剛好一起發生，不代表是其中一件害的。`,
mi:`吃了某樣東西覺得舒服，就說全是它的功勞|常用手機，就說成績差都是手機害的|吵架了，就說都是某個人的個性|賣得少，就說一定是太貴|睡不好，就說一定是少吃了什麼|厲害的人做某件事，就以為照做也會厲害`,
co:`原因找錯，就會修錯地方|花了好多錢和力氣，真正卡住的地方都沒動`,
up:`問：還有哪些原因，也可能讓它變這樣？`,
iq:`真的是甲害乙，還是剛好一起發生？|有沒有第三件事，同時影響它們？|會不會其實是反過來？|我是不是因為一前一後，就說是前面害的？|如果拿掉它，結果真的會變嗎？`,
ic:`原因找錯，辦法也會錯。`,
rp:`可能把「一起發生」當成「誰害誰」。`,ri:`真的是甲造成乙嗎？`,rc:`原因找錯，辦法全都錯。`,
rm:`至少想三個可能的原因|看看有沒有第三件事|想想會不會是反過來|一次只改一樣|看看改之前和改之後|可以先做小小的試驗`,rk:`有關係先記著，是不是原因慢慢再說。`,
cs:`吃了某樣東西後睡得好，就說全是它的功勞|換老師後成績變差，就全怪老師|換工作後不舒服，就說都是工作害的|厲害的人五點起床，就以為五點起床會變厲害|漲價後賣得少，就說都是價錢害的|有手機後成績變差，就全怪手機`,
cc:`原因找錯，做的事也會錯。`,cr:`多想幾個原因、找第三件事、想反過來、做小試驗。`,cl:`一起發生，不代表誰害了誰。`,
dx:`我能證明是甲造成乙嗎？|還是它們只是剛好一起出現？|有沒有第三件事同時影響它們？|會不會剛好相反？|如果沒有甲，乙真的會不一樣嗎？`,dr:`回答不出來，就先說「可能有關係」，不要說「一定是」。`,
q:`兩件事一前一後，我就覺得是前面害的。|一個方法好像有用，我就說一定是它的功勞。|我很少去想還有沒有別的原因。`,qy:`先說「可能有關係」，不要太快說「一定是」。`,
ac:`不要寫「甲害了乙」，先寫「甲和乙可能有關係」。|至少寫三個別的原因。|找找第三件事。|想想會不會反過來。|一次只改一點點。`,
da:`聽到「因為」，多問一次「真的嗎？」`,sy:`養成做小試驗的習慣。`,kp:`怪錯原因的次數變少了。`,al:`有關係很快就看得到，是不是原因要慢慢查。`,
lk:`把「有關係」當成「原因」`,core:`多想原因、找第三件事、做小試驗`,fa:`寫出三個可能的原因`,
soup:`公雞叫了，太陽就出來了。可是，太陽不是被公雞叫起來的。兩件事一起發生，不一定是誰造成誰。不要急著怪誰，也不要急著謝誰。多看幾次，你就會知道真的原因。¦The rooster crows and the sun rises. But the sun isn't called up by the rooster. Two things happening together doesn't mean one caused the other. Don't rush to blame or thank. Watch a few more times and you'll find the real reason.`});

k(9,{sub:`不要在很累的時候，做很大的決定`,def:`狀態，就是你現在身體和心情的樣子。`,
pl:`同一個你，累的時候和有精神的時候，像兩個不同的人。`,
mi:`很累的時候說要分開|很生氣的時候傳重要訊息|很擔心的時候決定錢的事|很孤單的時候決定跟誰在一起|睡不著時覺得沒有希望|很興奮時買一大堆|壓力大時亂吃|身體不舒服時覺得自己很差`,
co:`一下子的心情，變成很久的決定|幾個小時的情緒，可能影響好幾年`,
up:`做大決定前先問：現在的我，適合做決定嗎？`,
iq:`我現在累嗎？|我是不是在生氣、擔心、孤單或太興奮？|睡一覺以後，我還會這樣決定嗎？|這是想很久的，還是一時的反應？|一定要現在決定嗎？`,
ic:`幾個小時的心情，可能決定了好幾年。`,
rp:`用一下子的心情，做了很久的決定。`,ri:`睡一覺以後，我還會這樣決定嗎？`,rc:`幾小時的心情，換來幾年的後果。`,
rm:`問自己：餓了嗎？生氣嗎？孤單嗎？累了嗎？|大決定晚一點再做|先睡覺、喝水、吃東西、走一走|最生氣的時候，不要傳收不回來的話|心情平靜了再想一次|找到自己「可以做決定」的時候`,rk:`先把自己照顧好，再想辦法。`,
cs:`半夜睡不著，覺得一切都完了|大吵的時候，傳出很重的話|累到不行時，決定不做了|考試前很緊張，就覺得自己一定不會|很孤單時，又去找不適合的人|賺錢時太興奮，又放更多錢進去`,
cc:`一下子的心情，換來很久的後果。`,cr:`先睡、先吃、先休息，平靜了再決定。`,cl:`不要讓今晚的你，幫以後五年的你做決定。`,
dx:`我現在是不是很累、很餓、很痛、沒睡好？|我現在是不是很生氣、很擔心、很孤單或很興奮？|一定要現在決定嗎？|睡一覺、休息一天後，我還會這樣決定嗎？|我是不是把一下子的心情，當成永遠的事？`,dr:`「是」很多，先照顧自己，再決定。`,
q:`很累、沒睡好、很餓或不舒服時，我還是會做重要決定。|我常在情緒最大的時候決定事情。|休息以後，我常發現昨天想得太嚴重。`,qy:`先讓自己平靜，再決定。`,
ac:`問自己：餓嗎？氣嗎？孤單嗎？累嗎？|幫現在的自己打 0 到 10 分。|壓力很大時，不做收不回來的決定。|先睡、先吃、喝水、走一走、休息。|平靜下來再想一次。`,
da:`早上、中午、晚上，各記一次自己的樣子。`,sy:`寫下自己「可以做決定」的條件。`,kp:`衝動後才後悔的事變少了。`,al:`先把自己照顧好，日子也會慢慢變好。`,
lk:`很累、很餓、很擔心時做大決定`,core:`先讓自己平靜下來`,fa:`問自己：餓、氣、孤單、累？`,
soup:`下大雨的時候，路看不清楚，就先躲一下雨吧。等雨停了，路還在那裡。很累、很氣、很難過的時候，先不要決定大事。喝口水，睡一覺。明天的你，會看得比較清楚。¦In heavy rain you can't see the road, so wait under shelter. When the rain stops, the road is still there. When you're tired, angry or sad, don't decide big things. Drink some water, sleep. Tomorrow's you will see more clearly.`});

k(10,{sub:`情緒是來送信的，不是來開車的`,def:`情緒，是身體和心送給你的訊息，不是命令。`,
pl:`害怕不代表不能做；生氣不代表別人一定錯；難過也不代表你失敗了。`,
mi:`一擔心，就躲起來|一生氣，就罵人|一覺得對不起，就答應不想做的事|一害怕，就不開始|一孤單，就回去找不適合的人|一覺得丟臉，就把問題藏起來`,
co:`情緒從送信的人，變成開車的人|不是「我有情緒」，是「情緒在開我的車」`,
up:`問問情緒：你想告訴我什麼？我需要什麼？我怕什麼？`,
iq:`我現在是什麼感覺？|這個感覺想提醒我什麼？|它在說：有危險、失去了、需要什麼，還是有人越線了？|我是在聽它，還是被它拉著走？|平靜以後，我還會這樣做嗎？`,
ic:`情緒從訊息，變成了司機。`,
rp:`情緒從送信的，變成開車的。`,ri:`我是有這個感覺，還是被感覺拉著走？`,rc:`衝動、躲開、罵人、討好。`,
rm:`先幫情緒取名字|幫它打 0 到 10 分|找找它背後要的是什麼|超過 7 分，先不要做大事|深呼吸、動一動，讓自己慢下來|平靜以後再決定`,rk:`情緒可以按鈴，可是不能自己開車。`,
cs:`很擔心，所以不敢看成績|很生氣，所以馬上頂嘴|覺得對不起，所以答應不想做的事|怕失敗，所以一直不開始|很孤單，所以接受對自己不好的人|覺得丟臉，所以不敢找人幫忙`,
cc:`情緒從訊息，變成了司機。`,cr:`取名字、找它要什麼、慢下來，再行動。`,cl:`情緒可以提醒你，可是不要讓它一個人開車。`,
dx:`我說得出現在的感覺嗎？|我是在面對事情，還是在逃開感覺？|我是不是怕就不做、氣就罵人、不好意思就答應？|如果感覺從 8 分變成 3 分，我還會這樣選嗎？|這個感覺是在說：需要、危險、失去，還是越線？`,dr:`感覺一來就馬上做，先把「訊息」和「命令」分開。`,
q:`害怕的時候，我常常直接躲開。|生氣、覺得對不起或擔心時，我會馬上去做。|我很少先問「這個感覺想告訴我什麼？」`,qy:`把情緒當訊息，不要當命令。`,
ac:`說出來：「我現在覺得＿＿。」|幫它打 0 到 10 分。|想想它是在說：危險、失去、需要，還是越線。|7 分以上，先不要回話或做大事。|降到 4 分以下，再選怎麼做。`,
da:`記下：感覺→它想說什麼→我需要什麼。`,sy:`多學一些形容感覺的詞，也準備幾個讓自己平靜的方法。`,kp:`感覺還在，可是不會拉著我亂跑了。`,al:`感覺到它，不代表要聽它的話。`,
lk:`一有情緒就馬上去做`,core:`把情緒當訊息，不當命令`,fa:`幫情緒取名字，打 0 到 10 分`,
soup:`生氣、害怕、難過，都像郵差叔叔，是來送信的。信收下來，看看上面寫什麼就好。不用讓郵差開你的車。跟情緒說一聲：「謝謝你告訴我，接下來我自己來。」¦Anger, fear and sadness are like mail carriers bringing letters. Take the letter and read it. You don't have to let the mail carrier drive your car. Tell the feeling: "Thank you for telling me. I'll take it from here."`});

k(11,{sub:`做錯一件事，不代表你是不好的人`,def:`身份，就是心裡那個「我是誰」的故事。`,
pl:`你只是這次沒做好，不是你不好。`,
mi:`考不好，就說自己是笨學生|分開了，就說自己很失敗|生病了，就覺得自己只是病人|被拒絕，就覺得自己沒人要|賺得少，就覺得自己沒用|以前失敗過，就說自己不適合`,
co:`最可怕的不是失敗|是把失敗寫成「我就是這種人」|一旦這樣想，就會真的照著做`,
up:`把「我是＿＿的人」改成「我在＿＿這件事，還要練習＿＿」。`,
iq:`我是不是用一件事，就說自己是什麼人？|我是說「這次沒做好」，還是「我就是不好」？|這是還沒學會，還是我在罵自己？|如果可以練，那句話還對嗎？|我要改的是「我是誰」，還是多學一樣本領？`,
ic:`把錯寫在自己身上，就會慢慢活成那個樣子。`,
rp:`把「沒做好」變成「我不好」。`,ri:`這是還沒學會，還是我在罵自己？`,rc:`錯誤被貼在自己身上。`,
rm:`把「我是」改成「我現在」|把罵自己的話，改成「還在練的本領」|找找看不一樣的例子|把自己進步的事記下來|用可以改的話來說自己|說「我做了什麼」，不要貼標籤`,rk:`你是會長大的，本領是會變多的。`,
cs:`英文考 40 分：「我是英文白痴。」|生意沒做好：「我不會做生意。」|分開了：「我很失敗。」|被拒絕：「我沒有人喜歡。」|孩子出狀況：「我是很差的媽媽。」|工作出錯：「我就是很粗心。」`,
cc:`標籤開始管你以後怎麼做。`,cr:`把「我是」改成「我現在在＿＿還要練習」。`,cl:`錯的是這一次，不是你這個人。`,
dx:`我是不是因為一次結果，就說「我就是＿＿的人」？|我是不是把還沒學會，說成自己很差？|我有沒有用笨、懶、失敗、沒用來說自己？|如果練習會進步，那句話還對嗎？|我要改的是「我是誰」，還是某一樣本領？`,dr:`「是」很多，先把標籤撕下來，想成要練的本領。`,
q:`失敗以後，我常說「我就是不行」。|我常用笨、懶、沒用來說自己。|我常覺得現在不會，就是天生不會。`,qy:`把標籤換成「還在練的本領」。`,
ac:`找出那句「我就是＿＿」。|改成「我現在在＿＿還要練習」。|找三個不一樣的例子。|選一樣可以練的本領。|幫自己安排一次小小的成功。`,
da:`每天記一件自己進步的事。`,sy:`做一張「我的本領表」。`,kp:`罵自己的話變少，會的事變多。`,al:`不用修理自己，只要練習本領。`,
lk:`「沒做好」變成「我不好」`,core:`把標籤換成要練的本領`,fa:`把「我是」改成「我現在」`,
soup:`畫圖畫歪了一筆，不代表你是壞畫家。只是這一筆歪了。擦掉，再畫一次就好。你不是「不會的人」，你是「還在學的人」。還在學的人，最了不起。¦One crooked line doesn't make you a bad artist. Only that line was crooked. Erase it and draw again. You're not "someone who can't" — you're "someone still learning." And people who are still learning are the most amazing.`});

k(12,{sub:`你一直追的，也許不是你真正要的`,def:`需求，就是心裡真正缺的那一樣。`,
pl:`你以為想要這個，其實心裡缺的是那個。`,
mi:`一直買東西，其實是想被安慰|一直吃，其實是想休息|一直找人陪，其實是想安心|一直滑手機，其實是想躲開壓力|一直工作，其實是想被稱讚|一直管孩子，其實是自己會怕`,
co:`真正缺的，一直沒有補到|所以同樣的事，一直重來`,
up:`問自己：我真正想要的是什麼？`,
iq:`我真正想從這件事得到什麼？|我要的是東西，還是它給我的感覺？|我要的是那個人，還是安心、被喜歡、有人陪？|現在的方法，真的有給我想要的嗎？|有沒有更簡單、更好的方法？`,
ic:`真正缺的沒補到，同樣的事就一直重來。`,
rp:`想要的，不一定是真正需要的。`,ri:`我真正想得到的是什麼？`,rc:`一直追這個，真正缺的那個都沒補到。`,
rm:`把「我需要的」和「我用的方法」分開|連問三次「我為什麼想要？」|找到最裡面的那個需要|想出三種可以滿足它的方法|選最不傷自己的那一種`,rk:`不要只抓著一個方法，回頭看看真正要的是什麼。`,
cs:`壓力大就一直吃，其實是想休息|一直買東西，其實是想被安慰|一直要人陪，其實是想安心|一直工作，其實是想被稱讚|一直滑手機，其實在躲難題|一直管孩子，其實是自己害怕`,
cc:`外面的方法一直重來，裡面缺的都沒補到。`,cr:`連問三次「我真正想要什麼？」`,cl:`不要只追想要的，找找它後面真正需要的。`,
dx:`我真正想得到什麼？|得到以後，我想要的是哪一種感覺？|我追的是真正需要的，還是其中一種方法？|還有別的三種方法嗎？|我是不是一直得到想要的，卻還是不滿足？`,dr:`最後一題如果是「是」，真正需要的可能還沒找到。`,
q:`我常很想要一樣東西，拿到了卻沒有很開心。|壓力大時，我會用吃、買、滑手機、工作或找人陪來撐。|我很少問自己「我真正需要什麼？」`,qy:`從「想要」往下找「需要」。`,
ac:`問：「我為什麼想要這個？」|連問三次為什麼。|找到最裡面的需要。|寫三種可以滿足它的方法。|選最簡單、最不傷自己的。`,
da:`很想要什麼的時候，先問「我需要什麼」。`,sy:`畫一張「我需要什麼」的地圖。`,kp:`用來填補的壞習慣變少了。`,al:`方法可以換，心裡要的要先看見。`,
lk:`一直追想要的，卻還是不滿足`,core:`從想要找到真正的需要`,fa:`連問三次為什麼`,
soup:`口渴的時候，吃再多餅乾也不會好。因為你要的是水，不是餅乾。心也是一樣。停下來問一問：「我真正想要的是什麼？」找到了，心就會安靜下來。¦When you're thirsty, no number of cookies will help. You need water, not cookies. The heart is the same. Pause and ask: "What do I really want?" When you find it, your heart grows quiet.`});

k(13,{sub:`嘴巴說重要的，要真的給它時間`,def:`價值，就是你覺得最重要、最值得的事。`,
pl:`你的時間、錢、注意力放在哪裡，那才是你真正在乎的。`,
mi:`說健康重要，卻一直晚睡|說家人重要，卻沒有時間陪|說學習重要，卻每天滑三小時手機|說自由重要，卻一直借錢|什麼都重要，所以什麼都做不好`,
co:`時間和力氣被不重要的事吃掉|不是沒時間，是沒有排順序`,
up:`看看行事曆、錢包和注意力，不要只聽嘴巴說。`,
iq:`我說什麼最重要？|我的時間都去哪裡了？|我的錢都去哪裡了？|我的心都放在哪裡？|這三樣，跟我說的一樣嗎？`,
ic:`時間和力氣，慢慢被不重要的事吃掉。`,
rp:`嘴巴說重要，卻沒有給它時間。`,ri:`我的時間、錢、注意力，跟我說的一樣嗎？`,rc:`時間和力氣流到不重要的地方。`,
rm:`寫下最重要的五件事|幫它們排第一到第五|看看時間怎麼用|看看錢怎麼用|看看心放在哪裡|把跟它們打架的事拿掉`,rk:`真正在乎什麼，看時間去哪裡就知道。`,
cs:`說健康第一，卻每天半夜兩點睡|說家人重要，週末卻都在工作|說學習重要，卻每天看三小時影片|說要存錢，每個月卻都花光|說學生最重要，上課卻一直趕進度|說自己最重要，卻總是最後才照顧自己`,
cc:`時間和力氣被不重要的事拿走了。`,cr:`看看行事曆、錢包和注意力。`,cl:`真正在乎的，不在嘴巴，在你把時間給了誰。`,
dx:`我說最重要的是什麼？|上星期時間都花在哪裡？|錢都花在哪裡？|心都被什麼占住？|這些跟我說的一樣嗎？`,dr:`不一樣的話，不是時間不夠，是順序要重排。`,
q:`我說很重要的事，卻很少花時間在上面。|我的錢和心，常跑到我說「沒那麼重要」的事。|我覺得什麼都重要，所以不知道要放下什麼。`,qy:`重新排一次順序。`,
ac:`寫下最重要的五件事。|排出第一到第五。|比一比上星期的時間。|比一比錢。|比一比注意力。`,
da:`今天至少做一件事，是為了最重要的那一樣。`,sy:`每個月檢查一次時間和錢的去向。`,kp:`說重要的事，真的有時間做了。`,al:`重要不是用說的，是用時間給的。`,
lk:`嘴巴說重要，卻沒花時間`,core:`讓時間跟著重要的事走`,fa:`看看時間、錢、注意力去哪裡`,
soup:`你說最愛那盆花，卻常常忘記澆水，花會枯掉的。愛不是用說的，是用時間澆的。今天，給最重要的人、最重要的事，一點點時間吧。一點點就好，花就會笑。¦You say you love that flower, but if you keep forgetting to water it, it will wilt. Love isn't said — it's watered with time. Today, give a little time to the people and things that matter most. Just a little, and the flower will smile.`});

k(14,{sub:`重要的選擇，多想一下再決定`,def:`決定，就是在幾條路裡面選一條。`,
pl:`不是每件事都要想很久，可是重要的事要用對方法想。`,
mi:`沒有比較別的辦法|因為已經花很多錢，就繼續下去|怕失去，所以不敢改|想到第一個辦法就去做|小事想半年，大事五分鐘就決定|沒想過什麼時候要停|只看現在舒不舒服|沒想過最糟會怎樣`,
co:`選錯了又一直走，會越錯越多|越晚回頭，越辛苦`,
up:`有哪些路→要付出什麼→會不會危險→能不能回頭→再決定。`,
iq:`我有比較過別的路嗎？|我是不是只想到一個辦法？|最糟的結果，我受得了嗎？|選了還能回頭嗎？|我是不是捨不得已經花掉的，才不敢停？|選了這個，我就少了什麼？`,
ic:`選錯了又一直走，會越錯越多。`,
rp:`選的方法出了問題。`,ri:`我有比較過不同的路嗎？`,rc:`選錯了，時間越久錯越大。`,
rm:`至少寫出三條路|比一比好處、要付出的和危險|分清楚能回頭和不能回頭的|能回頭的，先小小試一下|不能回頭的，慢慢來|先想好什麼時候要停|問：選了這個，就少了什麼？`,rk:`小事快快試，大事慢慢想。`,
cs:`朋友說好，就買了很貴的東西|賠了錢不甘心，又放更多錢進去|工作不適合，卻因為做了十年不敢走|想到第一個辦法就去做|可以回頭的小事，想了三個月|不能回頭的大事，五分鐘就決定`,
cc:`選錯了，時間越久錯越大。`,cr:`幾條路、要付出什麼、危險、能不能回頭、什麼時候停。`,cl:`不要因為走了很久，就忘了問方向對不對。`,
dx:`決定前，我有寫出別的路嗎？|我有比較好處、要付出的和危險嗎？|我知道選了能不能回頭嗎？|我是不是捨不得已經花掉的，才不想停？|我有先想好什麼時候要停嗎？`,dr:`「有」很少，做決定的方法要調整了。`,
q:`做重要決定前，我通常沒有寫出別的路。|已經花了很多時間或錢，我就很難停。|我很少先想好「什麼時候我要停」。`,qy:`寫出幾條路、想想危險、訂好停下來的時候。`,
ac:`至少寫三條路。|每條路寫好處、要付出的、危險。|標出能回頭或不能回頭。|能回頭的，快快試一下。|不能回頭的，多查一查。|先寫好什麼時候要停。`,
da:`重要的決定，寫下來留著。`,sy:`過一陣子，回頭看看自己的決定。`,kp:`後悔的決定變少了。`,al:`做決定不是猜答案，是把路和最糟的情況都想過。`,
lk:`沒有比較就決定`,core:`幾條路、危險、能不能回頭`,fa:`至少寫三條路`,
soup:`走到岔路口，不用急著跑。站一下，看看有幾條路，想想哪條可以回頭。小路可以先走幾步試試看，大路就多問問人。慢一點選，後面才能走得穩。¦At a fork in the road, you don't have to rush. Stand a moment, see how many paths there are, and which ones let you turn back. Try a few steps on a small path; ask around before a big one. Choose slowly, and you'll walk steadily after.`});

k(15,{sub:`方向對了，可是這條路走不通`,def:`策略，就是你打算用什麼方法到達目標。`,
pl:`努力很棒，可是不是只有努力就夠。`,
mi:`學不會，就叫他再讀十遍|賣不好，就一直降價|處不好，就一直忍|事情太多，就每天加班|瘦不下來，就吃得更少|APP 沒人用，就一直加功能`,
co:`越努力，越累|可是結果沒有變好`,
up:`結果沒變時，不要只更用力，換個方法吧。`,
iq:`我的目標是什麼？|現在的方法，有讓我更靠近嗎？|沒有變好時，我是不是只會更用力？|有沒有比較輕鬆的路？|最有用的地方在哪裡？`,
ic:`很努力，結果卻沒有跟著變好。`,
rp:`方向可能對，走法不對。`,ri:`更努力以後，結果真的更好了嗎？`,rc:`越做越多，結果卻停在原地。`,
rm:`先說清楚要什麼結果|看看方法和結果有沒有關係|想好「做到哪裡還沒用就換」|沒用就換方法，不要只更用力|找最有用的地方|先用小小的方式比較看看`,rk:`結果不動，先換方法，不要只加力氣。`,
cs:`英文不好就多背一百個單字，可是卡住的是閱讀|賣不好，就一直降價|孩子不讀書，就一直罵|做不完，就一直加班|體重沒變，就越吃越少|APP 沒人用，就一直加功能`,
cc:`更努力了，結果卻沒有變好。`,cr:`訂好界線，結果不動就換方法。`,cl:`卡住時不要只踩油門，也看看路。`,
dx:`我的目標清楚嗎？|現在的方法有讓結果變好嗎？|沒變好時，我是不是只會更用力？|我有試過完全不一樣的方法嗎？|最有用的地方可能在哪裡？`,dr:`更努力了結果卻不動，很可能是方法要換。`,
q:`方法沒用時，我常常只是更努力。|我很少訂好「做到哪裡還沒用就換」。|我花了很多力氣，結果卻一直沒變好。`,qy:`先停一下，看看方法。`,
ac:`先說清楚要什麼結果。|寫下現在的方法。|看看更努力以後，結果有沒有變好。|寫三個別的方法。|找最有用的地方。|訂好什麼時候換方法。`,
da:`問自己：「我是更用力，還是更聰明？」`,sy:`把試過的方法都記下來。`,kp:`一樣的力氣，換到更多的結果。`,al:`不是更用力，是更有用。`,
lk:`沒用還是一直更用力`,core:`換方法，找最有用的地方`,fa:`寫三個別的方法`,
soup:`門推不開，再用力推也沒用，因為它是用拉的。不是你力氣小，是方法不對。試試看別的方法吧。換個方法，門就開了。聰明不是不會卡住，是卡住了願意換方法。¦If a door won't push open, pushing harder won't help — it opens by pulling. It's not that you're weak; the method is wrong. Try another way and the door opens. Being smart isn't never getting stuck — it's being willing to try a new way.`});

k(16,{sub:`知道很多了，只差一個小小的開始`,def:`行動，就是真的去做的那一步。`,
pl:`知道了，不等於做了。`,
mi:`收藏很多文章|買很多課卻沒上完|知道要運動卻沒開始|計畫寫得很漂亮，卻沒有第一步|總是說有空再做|一開始就要做到最好`,
co:`知道的變多，日子卻沒變|以為「我懂很多，所以我有進步」`,
up:`每學到一件事，就在一天內做一個小小的動作。`,
iq:`知道以後，我真的做了什麼？|下一步清楚嗎？|是不是太大了，所以一直拖？|一天之內，最小可以做什麼？|我是在準備，還是真的在做？`,
ic:`知道的變多，日子卻沒變。`,
rp:`知道很多，卻還沒做。`,ri:`一天之內，我到底要做什麼？`,rc:`知道的變多，日子沒變。`,
rm:`每學到一件事，就配一個動作|把動作變小，十五分鐘就能開始|寫清楚什麼時候、在哪裡做|讓開始變得很容易|先做完，再做好|做完馬上看看結果`,rk:`沒有去做的想法，只是想法。`,
cs:`收藏五十篇運動文章，一次都沒動|買了線上課，一直沒打開|寫好減重計畫，說明天再開始|想做 APP 半年，還在研究|知道該跟孩子聊聊，卻一直等好時機|每天研究怎麼管時間，行程卻都沒變`,
cc:`知道的變多，日子還在原地。`,cr:`每個想法後面，配一個十五分鐘的小動作。`,cl:`小到不會失敗的第一步，比完美的計畫重要。`,
dx:`我知道很多了，可是日子有變嗎？|我說得出下一步要做什麼嗎？|這一步小到今天就能開始嗎？|我是不是一直準備、一直研究，卻沒開始？|一天之內能做完的最小動作是什麼？`,dr:`知道很多、做得很少，卡住的地方就是「開始」。`,
q:`我知道很多方法，可是真的去做的很少。|我常花很多時間計畫，卻一直沒開始。|問我一天內要做什麼，我常說不出來。`,qy:`把想法變成一個最小的動作。`,
ac:`把目標切成十五分鐘的小動作。|寫清楚什麼時候、在哪裡、做什麼。|五分鐘內能開始，就馬上開始。|先做最小的那一步。|做完馬上記下結果。`,
da:`每天至少做一個重要的小動作。`,sy:`每個想法後面，都寫一格「我要做什麼」。`,kp:`知道的事，越來越多真的做到。`,al:`不去做的知識，改變不了日子。`,
lk:`知道很多卻沒去做`,core:`最小的動作`,fa:`切成十五分鐘的動作`,
soup:`種子放在口袋裡，永遠不會發芽。要放進土裡，澆一點水，它才會長大。想法也是一樣。今天就做一件小小的事吧，小到五分鐘就能做完。小小的一步，就是發芽。¦A seed in your pocket will never sprout. Put it in soil, give it a little water, and it grows. Ideas are the same. Do one tiny thing today — small enough to finish in five minutes. A tiny step is a sprout.`});

k(17,{sub:`不要每天跟自己打架，換個環境就好`,def:`習慣，就是一看到某樣東西，就自動去做的事。`,
pl:`真正能一直做下去的事，不是每天逼自己做的。`,
mi:`手機放枕頭旁，卻叫自己不要滑|零食放桌上，卻叫自己不要吃|運動的東西收得很遠|一次想改十個習慣|一天沒做到，就全部放棄`,
co:`每天都在用力忍|久了，還是會回到最輕鬆的老路`,
up:`不要只改自己，也要改環境。`,
iq:`看到什麼，就會讓我做舊習慣？|壞習慣是不是太容易做了？|好習慣是不是太麻煩了？|可以把環境改一改嗎？|我是不是一次要自己改太多？`,
ic:`忍不住了，就回到老路。`,
rp:`一直靠忍耐。`,ri:`環境是不是每天都在引我做舊的事？`,rc:`忍不住了，就回到老路。`,
rm:`找出是什麼引起的|把它拿走|讓壞習慣變麻煩|讓好習慣變簡單|找一件別的事來代替|一次只改一兩個習慣|斷了就馬上再開始，不用全部重來`,rk:`改環境，比罵自己有用。`,
cs:`手機放床邊，叫自己不要滑|桌上都是零食，叫自己少吃|跑鞋收在櫃子最裡面，卻想天天跑步|一次決定不吃糖、運動、早睡、讀書全部一起來|一天沒做到，就全部放棄|每次都說「明天我會更能忍」`,
cc:`忍不住了，就回到最輕鬆的老路。`,cr:`找出引起的東西、改環境、讓它變難或變簡單、找事情代替。`,cl:`不要每天跟自己打架，把戰場換掉。`,
dx:`什麼最容易引我做這件事？|壞的事是不是很容易做？|好的事是不是步驟太多？|我是不是一直靠忍？|如果把環境改一改，會不會容易很多？`,dr:`「是」很多，不要再罵自己，先改環境。`,
q:`我改習慣，都是靠「這次一定要忍住」。|誘惑就在手邊，好的事反而很麻煩。|一天沒做到，我就很容易全部放棄。`,qy:`不要只靠忍，也改改環境。`,
ac:`找出是什麼引起的。|把它拿走。|讓壞習慣變麻煩。|讓好習慣變簡單。|找一件事來代替。|不要連續兩次沒做到。`,
da:`記下：看到什麼→做了什麼→得到什麼。`,sy:`把環境擺成「好的事最容易做」。`,kp:`不用硬忍，也能一直做下去。`,al:`讓對的事，變成最容易做的事。`,
lk:`全靠忍耐`,core:`找出引起的東西、改環境`,fa:`拿走一個會引起壞習慣的東西`,
soup:`糖果放在桌上，誰都會想吃，這不是你不乖。把糖果收到高高的櫃子裡，把水果放在桌上，你就會自然去拿水果。不用跟自己打架，換一下東西的位置就好。¦Candy on the table tempts anyone — it doesn't mean you're bad. Put the candy on a high shelf and fruit on the table, and you'll naturally reach for fruit. No need to fight yourself. Just move things around.`});

k(18,{sub:`不是沒時間，是時間排錯了`,def:`時間錯誤，就是把時間猜錯、排錯了。`,
pl:`時間猜錯了、排錯了，也塞太滿了。`,
mi:`事情排太滿|沒有留空檔|每件事都說很急|最有精神的時候拿去回訊息|重要的事一直往後拖|把要花的時間想得太少`,
co:`每天都在趕|一直很緊張|事情做得不好|重要但不急的事，一直沒開始`,
up:`排順序、留一段專心的時間、留空檔。`,
iq:`這件事真的重要嗎？|還是只是很急？|我猜的時間，跟以前真的花的一樣嗎？|我有留空檔嗎？|今天最好的時間，有給最重要的事嗎？`,
ic:`每天都很趕，重要的事卻一直沒做完。`,
rp:`時間猜錯、排錯、塞太滿。`,ri:`重要的事，有拿到時間嗎？`,rc:`一直很趕，重要的事一直往後拖。`,
rm:`用以前真的花的時間，再多加一點來猜|每天留一點空檔|先排重要的，再排很急的|留一段專心做事的時間|每天只排幾件大事|週末比一比猜的和真的`,rk:`不要把一天排滿，留一點喘氣的地方。`,
cs:`今天幫自己排了十件事|每次都以為三十分鐘做完，結果九十分鐘|行程一點空檔都沒有|早上最有精神的時候，拿去回訊息|重要的事一直被小事打斷|什麼約都答應`,
cc:`很忙、遲到、緊張，重要的事一直拖。`,cr:`照以前的經驗猜時間、留專心時間、多留兩三成空檔。`,cl:`排滿不是厲害，是沒有留犯錯的空間。`,
dx:`我是不是常把時間想得太少？|行事曆是不是一直滿滿的？|我有留空檔嗎？|最有精神的時候，有給最重要的事嗎？|我做了很多事，卻沒做最重要的那件？`,dr:`「是」很多，重新排順序，重新猜時間。`,
q:`我常把一天排得很滿。|事情花的時間，常比我想的久。|重要但不急的事，我常常一直拖。`,qy:`重新猜時間，也留空檔。`,
ac:`今天只留三件事。|用以前的經驗來猜時間。|多留兩三成的空檔。|先排要專心的事。|像的事放在一起做。`,
da:`晚上比一比猜的時間和真的時間。`,sy:`記下自己做每種事要多久。`,kp:`比較不會遲到，重要的事做完更多。`,al:`管時間不是塞更多，是猜得更準。`,
lk:`時間想太少，沒有留空檔`,core:`重新猜時間，留空檔`,fa:`比一比猜的和真的`,
soup:`書包塞得太滿，拉鍊會壞掉。一天也是一樣，塞太滿，心就會喘不過氣。留一點空空的時間，不是偷懶，是讓自己可以呼吸。有空位的一天，才裝得下驚喜。¦An overstuffed backpack breaks its zipper. A day is the same — too full, and your heart can't breathe. Leaving empty time isn't lazy; it lets you breathe. A day with space has room for surprises.`});

k(19,{sub:`先照顧好自己，才有力氣做事`,def:`能量，就是你現在有多少力氣和精神。`,
pl:`有兩個小時，不代表兩個小時都一樣有精神。`,
mi:`沒睡飽，還要自己做很快|一直做事，都不休息|最累的時候做最難的事|休息時覺得自己很壞|用咖啡硬撐`,
co:`不專心|容易想錯|容易發脾氣|容易出錯`,
up:`看自己有多少精神，再決定做什麼事。`,
iq:`我現在精神好、普通，還是很累？|這件事要花多少腦力？|我是不是一直在硬撐？|最近有好好休息嗎？|是不是該先休息，再來做？`,
ic:`想事情、專心、管脾氣，都一起變差。`,
rp:`有時間，可是沒有精神。`,ri:`這件事，適合我現在的精神嗎？`,rc:`做得慢、想得不清楚、容易生氣。`,
rm:`知道自己平常精神怎麼樣|精神好時，做最花腦力的事|精神差時，做簡單的事|把休息排進行程|不要一直跟明天借力氣|一直很累，要找找原因`,rk:`照顧好精神，才管得好時間。`,
cs:`熬夜以後，硬要做大決定|最累的晚上，寫最難的東西|連做七天，都沒休息|休息時一直覺得在浪費時間|累了只靠咖啡撐|下午很沒精神，還排最難的事`,
cc:`做得慢、想不出點子、容易想錯、容易生氣。`,cr:`知道自己的精神、難的事配好精神、要休息。`,cl:`不是每一個小時，都一樣好用。`,
dx:`我現在精神好、普通還是很累？|這件事要多少精神？|事情和精神配得上嗎？|我是不是一直靠硬撐、咖啡或壓力？|最近有好好休息嗎？`,dr:`很累又要做很難的事，先休息，不要只想做快一點。`,
q:`我常在最累的時候，做最重要的事。|我很少看自己的精神來排事情。|休息時我會覺得自己很壞，所以一直沒好好休息。`,qy:`讓事情配合自己的精神。`,
ac:`幫精神打 0 到 10 分。|精神好時做難的事。|精神差時做簡單的事。|太累了就先休息。|不要一直硬撐。`,
da:`記下睡得怎樣、精神怎樣、做得怎樣。`,sy:`畫一張「我一天的精神地圖」。`,kp:`重要的事，都排在精神最好的時候。`,al:`一樣的時間，精神不同，做出來差很多。`,
lk:`很累還硬做很難的事`,core:`讓事情配合精神`,fa:`幫精神打 0 到 10 分`,
soup:`手機沒電了要充電，沒有人會罵手機懶惰。你也一樣。累了就休息，不是偷懶，是在充電。充飽了電的你，才有力氣去做喜歡的事、愛想愛的人。¦When a phone runs out of battery, we charge it — no one calls it lazy. You're the same. Resting when tired isn't laziness; it's recharging. A fully charged you has the energy to do what you love and love who you love.`});

k(20,{sub:`看懂了，還不算學會`,def:`學習，就是以後遇到問題時，你想得起來、也用得出來。`,
pl:`把「看過」當成「學會」了。`,
mi:`一直重讀|一直畫重點|看了答案就覺得「我會了」|錯的題目沒有分類|沒有再考自己一次|沒有教給別人`,
co:`考試時「明明看過，卻想不起來」|知道很多，卻用不出來`,
up:`讀進去→自己想出來→找出錯的→練不會的→再考一次。`,
iq:`不看答案，我說得出來嗎？|我能自己寫出來嗎？|我能教別人嗎？|我知道自己錯在哪一種嗎？|三天後再考，我還會嗎？`,
ic:`「我明明看過」，卻用不出來。`,
rp:`把看過當成學會。`,ri:`不看答案，我寫得出來嗎？`,rc:`覺得很熟，其實還不會。`,
rm:`蓋起來，自己想一遍|隔幾天再複習|把錯的題目分類|找出還不會的地方|專門練不會的|再考一次|教給別人聽`,rk:`不要問看了幾遍，要問自己想不想得起來。`,
cs:`課本看了五遍，卻沒有考考自己|一看答案就懂，以為自己會了|單字一直看，從不蓋起來想|錯的題目只抄答案|考完就把東西丟了|定義會背，卻不會用`,
cc:`把「很熟」當成「真的會」。`,cr:`自己想→看錯在哪→練不會的→再考。`,cl:`真的會，是答案不在眼前，你還想得起來。`,
dx:`不看書，我說得出來嗎？|換一題，我還會嗎？|隔三天，我還記得嗎？|我知道自己錯在哪一種嗎？|我能教到別人聽懂嗎？`,dr:`看得懂卻想不起來、用不出來，就還沒真的學會。`,
q:`看答案覺得懂，我就以為自己會了。|我都是重讀、畫重點，很少自己想或考自己。|錯的題目，我很少隔幾天再考一次。`,qy:`自己想→看錯在哪→練習→再考。`,
ac:`把書蓋起來，自己想一遍。|馬上考考自己。|把錯的分類。|找出還不會的地方。|專門練那裡。|隔 1 天、3 天、7 天再考。`,
da:`每天至少一次，蓋起來自己想。`,sy:`做一張「我常錯的種類」和「我的本領」表。`,kp:`隔幾天再考，答對更多了。`,al:`學習不是放更多進去，是想得起來、用得出來。`,
lk:`看懂就以為學會`,core:`自己想出來，再考一次`,fa:`蓋起書考考自己`,
soup:`看別人騎腳踏車，看一百次也不會騎。要自己坐上去，搖搖晃晃，跌幾次，才會騎。學東西也一樣。蓋起書本，自己試一次。想不起來沒關係，那就是你正在變強的地方。¦You can watch someone ride a bike a hundred times and still not ride. You have to get on, wobble, fall a few times, and then you can. Learning is the same. Close the book and try. If you can't recall it, that's okay — that's exactly where you're getting stronger.`});

k(21,{sub:`你說的，不一定是對方聽到的`,def:`溝通，就是讓兩個人心裡想的，盡量一樣。`,
pl:`以為我說了，你就應該懂。`,
mi:`希望別人猜到自己的心|說得不清楚，卻希望別人做得剛剛好|只說，沒有問對方懂不懂|只想證明自己是對的|罵人，而不是說那件事|在最生氣的時候談重要的事`,
co:`誤會|吵架|感情變差|兩個人都覺得「我明明說了」`,
up:`說清楚→問懂不懂→請對方說一次→再調整。`,
iq:`我真正想讓對方知道什麼？|我說清楚了嗎？|對方聽到的是什麼？|我有問過嗎？|我是在解決問題，還是在比誰對？`,
ic:`兩個人都覺得說清楚了，心裡想的卻不一樣。`,
rp:`我說出去的，不一定是對方聽到的。`,ri:`對方聽到的，跟我想說的一樣嗎？`,rc:`誤會、吵架、重做。`,
rm:`先說為什麼要講這件事|說真的發生了什麼|說我需要什麼|說清楚希望對方做什麼|請對方說說他聽到什麼|不一樣就馬上再說清楚`,rk:`溝通不是把話說出去，是讓兩顆心想的一樣。`,
cs:`「你應該知道我要什麼。」|老師說「好好準備」，學生不知道要準備什麼|兩個人都說「我講過了」，聽到的卻不一樣|主管說「快一點」，卻沒說什麼時候要|生氣時只說「你就是很自私」|訊息的字，被讀成不一樣的語氣`,
cc:`兩個人心裡想的不一樣。`,cr:`為什麼講→發生什麼→我需要什麼→請你做什麼→請對方說一次。`,cl:`說出口不算溝通，對方聽懂了才算。`,
dx:`我到底想說什麼？|我說的是發生的事，還是只有罵人？|我需要什麼、希望對方做什麼，說清楚了嗎？|我知道對方聽成什麼嗎？|我們是在弄清楚，還是在比輸贏？`,dr:`兩個人聽到的不一樣，就是溝通出了問題。`,
q:`我常覺得「我明明講過了，他怎麼還不懂？」|我很少請對方說說他聽到什麼。|吵架時，我常說對方是什麼人，而不是說那件事。`,qy:`讓兩個人想的一樣。`,
ac:`先說為什麼要講。|只說真的發生的事。|說我需要什麼。|說清楚希望對方做什麼。|請對方說說他聽到什麼。`,
da:`重要的話，問一次「你聽到的是什麼？」`,sy:`寫下自己常用的好說法。`,kp:`「我以為你知道」的吵架變少了。`,al:`溝通，就是讓兩個人想的一樣。`,
lk:`我說的，跟對方聽到的不一樣`,core:`讓兩個人想的一樣`,fa:`請對方說說他聽到什麼`,
soup:`玩傳話遊戲，傳到最後常常變得很好笑。因為每個人聽到的都有一點不一樣。所以，說完話再問一句：「你聽到的是什麼呢？」多問這一句，誤會就少很多。¦In the telephone game, the message at the end is often funny, because everyone hears it a little differently. So after you speak, ask: "What did you hear?" That one extra question removes many misunderstandings.`});

k(22,{sub:`愛，不是管、不是討好、不是一直犧牲`,def:`關係，就是兩個人長時間相處出來的樣子。`,
pl:`愛著愛著，不小心變成討好、管人或一直犧牲。`,
mi:`用討好來換愛|用管人來換安心|用犧牲來換稱讚|幫別人扛他的事|要別人改變，自己才會快樂|吵架後沒有和好`,
co:`心裡越來越委屈|離不開對方|一個人說了算|一直吵架|最後兩個人都不能做自己`,
up:`在一起、有界線、互相、會和好。`,
iq:`我們有互相嗎？|我是在愛，還是在討好？|我是在幫忙，還是在替他做？|我是不是想管對方，自己才安心？|吵架後，我們有和好嗎？`,
ic:`愛慢慢變成累、管、離不開和生氣。`,
rp:`愛，可能慢慢變成管人、討好或犧牲。`,ri:`在一起以後，我們兩個更自由，還是更不自由？`,rc:`離不開、生氣、很累。`,
rm:`有自己的界線|看看有沒有互相|不要什麼都替對方做|可以不一樣|吵架後要和好|幫對方自己站起來，不是替他過日子`,rk:`好的關係，讓兩個人都更自由。`,
cs:`怕對方走掉，所以什麼都說好|說是為你好，卻要你照他的方式過|幫長大的孩子處理所有事|一直付出，心裡卻一直在等回報|每次吵架都不說話，從不和好|只有一個人可以說「我需要」`,
cc:`不能做自己、委屈變多、關係卡住。`,cr:`界線、互相、可以不一樣、會和好。`,cl:`好的關係不是黏成一個人，是兩個完整的人一起走。`,
dx:`兩個人都可以說「不要」嗎？|兩個人的需要都被看見嗎？|付出是不是差不多互相？|我是在幫忙，還是在管、討好、替他做？|吵架後有和好的方法嗎？`,dr:`兩個人越來越不能做自己，關係就要調整了。`,
q:`為了不吵架，我常做自己不想做的事。|我要對方改變，自己才會安心。|吵架以後，我們很少真的和好。`,qy:`看看界線、有沒有互相、能不能做自己。`,
ac:`問：我現在是在愛、幫忙、管、替他做，還是討好？|找回自己的界線。|把對方的事還給對方。|讓彼此可以不一樣。|吵架後找時間和好。`,
da:`每天一次，直接說出自己真的需要什麼。`,sy:`過一陣子，一起聊聊我們好不好。`,kp:`兩個人更能做自己，管和討好變少。`,al:`好的關係，讓兩個人都更能做自己。`,
lk:`愛變成管人、討好、替他做`,core:`界線、互相、會和好`,fa:`分清楚是幫忙還是管`,
soup:`兩棵樹種得太近，會搶陽光；種得太遠，又會孤單。最好是有一點距離，根在土裡牽著手。愛也是這樣。不用黏在一起，也不用一直讓。你做你，我做我，我們還是在一起。¦Two trees planted too close fight for sunlight; too far apart and they're lonely. Best is a little distance, with roots holding hands underground. Love is like that. No need to cling or always give in. You be you, I'll be me, and we're still together.`});

k(23,{sub:`分清楚誰的事，是一種溫柔`,def:`界線，就是知道哪些是我的事，哪些是你的事。`,
pl:`分不清楚誰的事，該誰來做。`,
mi:`不敢說「不要」|別人一生氣就讓步|幫孩子扛所有的後果|想管別人怎麼選|覺得說「不要」很沒良心`,
co:`自己很累|心裡生氣|別人沒有機會長大|自己也不自由`,
up:`我的選擇我負責，你的選擇你負責。`,
iq:`這是誰的事？|我是不是在替別人收拾？|我是不是要別人為我的心情負責？|說「不要」，我在怕什麼？|我的界線是保護自己，還是在管對方？`,
ic:`自己累壞了，對方也沒機會長大。`,
rp:`不知道誰該負責什麼。`,ri:`這是誰選的？該誰負責？`,rc:`自己累壞，別人也長不大。`,
rm:`畫一個「誰的事」的圈|我選的，我負責|你選的，你負責|說「不要」不用一直解釋|說一次，然後照著做|界線不是用來管別人的`,rk:`界線不是把人推開，是把事情還給它的主人。`,
cs:`不想去聚會，還是答應了|孩子忘了帶作業，爸媽比孩子還急|同事沒做完，自己默默全做了|別人一生氣，就馬上改變決定|不准對方跟某些人來往|替家人還不是自己欠的錢`,
cc:`一個人累壞，另一個人學不會負責。`,cr:`誰的事誰做、誰選的誰負責。`,cl:`界線不是不愛，是不再幫別人扛他的事。`,
dx:`這到底是誰的事？|是誰選的？|該誰負責後果？|我是不是怕對方不高興，就接過來做？|我的界線是管自己，還是管別人？`,dr:`事情放錯人身上，就是界線出了問題。`,
q:`別人不高興，我就很容易改變決定。|我常替別人收拾他該負責的事。|我有時會把「我的界線」變成「你一定要怎樣」。`,qy:`把事情還給它的主人。`,
ac:`畫兩格：我的事／你的事。|這是誰選的？|後果是誰的？|練習說一句清楚的「不要」。|不用一直解釋。`,
da:`發現扛了別人的事，就輕輕還回去。`,sy:`寫下自己的界線規則。`,kp:`委屈變少，不再替別人扛那麼多。`,al:`把事情還給它的主人，就是界線。`,
lk:`替別人扛他的事和後果`,core:`把事情還給它的主人`,fa:`畫「我的事／你的事」`,
soup:`每個人都有自己的書包。幫同學背書包，他的肩膀就不會變強壯。說「這是你的書包喔」，不是不愛他，是相信他背得動。把書包還給他，你的肩膀也輕鬆了。¦Everyone has their own backpack. If you carry a classmate's bag, their shoulders never grow strong. Saying "This one is yours" isn't unkind — it means you believe they can carry it. Hand it back, and your shoulders feel lighter too.`});

k(24,{sub:`身體是一整個世界，不要只看一個數字`,def:`健康，是身體很多部分一起好好工作，不是一個數字。`,
pl:`只看一個不舒服、一個數字，忘了整個身體。`,
mi:`沒有不舒服，就以為沒事|檢查一次，就當成永遠這樣|只買補充品，不改生活|別人有用，就照著做|一次改十樣|變好以後，就不再檢查`,
co:`不知道到底什麼有用|可能太晚去看醫生|花很多錢，卻不知道自己平常怎樣、有沒有變好`,
up:`先知道平常的樣子→試著改→再檢查→看一段時間→需要時問醫生。`,
iq:`我知道自己平常的樣子嗎？|這是一次的數字，還是一段時間的變化？|我是不是一次改太多？|變好以後有再檢查嗎？|哪些事要問醫生，不是自己猜？`,
ic:`不知道什麼真的有用，也可能太晚處理。`,
rp:`只看一個不舒服、一個數字或一個方法。`,ri:`我知道平常的樣子、一段時間的變化、有再檢查嗎？`,rc:`不知道什麼有用，也可能太晚看醫生。`,
rm:`先知道自己平常的樣子|一次只改一點點|把做了什麼記下來|看一段時間的變化|訂好什麼時候再檢查|有危險的訊號，先去看醫生|補充品不能代替好好生活和看醫生`,rk:`量一量→改一改→再量一次，不要用猜的。`,
cs:`血壓高一次，就非常害怕|體重正常，就以為一定健康|一次吃六種補充品，變好了卻不知道是哪一種|朋友有用的方法，整個照做|舒服一點，就不管原本要追蹤的事|只靠補充品，睡覺、運動、吃飯都沒顧`,
cc:`不知道平常怎樣、不知道原因、也不知道有沒有變好。`,cr:`知道平常的樣子→一次改一點→記下來→再檢查→需要時問醫生。`,cl:`健康不是用猜的，是一直量、一直調。`,
dx:`我知道自己平常的樣子嗎？|我看到的是一次的數字，還是一段時間？|最近是不是一次改了很多？|我有記下改之前和改之後嗎？|這需要找醫生檢查嗎？`,dr:`不知道平常怎樣、改太多、又沒再檢查，就很難知道原因。`,
q:`我會因為一次數字或一個不舒服，就想得很嚴重。|我曾一次改很多，最後不知道哪個有用。|我很少「先量、再改、再量一次」。`,qy:`看一段時間的變化，再檢查；需要時去看醫生。`,
ac:`先知道平常的樣子。|決定要看哪幾個重點。|不要一次亂改太多。|把做了什麼記下來。|訂好再檢查的日子。|有危險訊號或一直不舒服，要去看醫生。`,
da:`只記真的有幫助的健康資料。`,sy:`平常的樣子→一段時間→改一改→再檢查→換新地圖。`,kp:`越來越知道什麼有用、什麼沒用。`,al:`健康不是追一個漂亮的數字，是把整個身體照顧好。`,
lk:`只看一個不舒服或一個數字`,core:`平常的樣子→一段時間→再檢查`,fa:`先知道自己平常的樣子`,
soup:`照顧身體，像照顧一座小花園。不是只看一朵花，要看土、看水、看陽光。一天沒開花不用怕，多看幾天。真的不對勁，就請園丁（醫生）來看看。你的身體，值得慢慢、溫柔地照顧。¦Caring for your body is like caring for a small garden. Don't look at one flower only — look at the soil, water and sunshine. One day without blooms is no reason to fear; watch for a few days. If something is truly wrong, ask the gardener (a doctor) to look. Your body deserves slow, gentle care.`});

k(25,{sub:`今天的舒服，不要讓明天的自己付錢`,def:`錢，是把現在的東西，留到以後或換成別的東西的工具。`,
pl:`今天的舒服，正在一點一點吃掉明天的自由。`,
mi:`賺多少就花多少|心情不好就買東西|只看會賺多少|賠了還一直加錢想賺回來|沒有存救急的錢|賺多了，花得也跟著多`,
co:`越來越不自由|遇到事情撐不住|以後能選的越來越少`,
up:`知道錢去哪→留救急的錢→慢慢存、慢慢長大。`,
iq:`我知道錢都去哪裡了嗎？|這是需要，還是一時想買？|最糟的情況，我受得了嗎？|我有留救急的錢嗎？|花了這筆錢，我就少了什麼？`,
ic:`以後能選的，越來越少。`,
rp:`今天的舒服，在吃掉明天的自由。`,ri:`這樣選，以後能選的會變多還是變少？`,rc:`越來越不自由。`,
rm:`記下錢進來和出去|固定留一筆救急的錢|買貴的東西，等一到三天再買|放錢進去前，先想最糟會怎樣|不要全部放在同一個地方|已經花掉的，不要再算進去`,rk:`錢最棒的地方，是幫你留住以後的選擇。`,
cs:`領到錢，就把能刷的都當成能花的|心情不好就上網買|賠了不甘心，又放更多錢|只看會賺多少，不看最多會賠多少|賺多了，花得也變多|沒有救急的錢，卻去做很危險的投資`,
cc:`以後能選的，慢慢變少。`,cr:`記錢、留救急的錢、等一等、想最糟的情況。`,cl:`錢最大的好處，是讓你以後還有得選。`,
dx:`我知道每個月的錢去哪裡嗎？|這次買東西是需要，還是一時衝動？|最糟的情況我受得了嗎？|我有救急的錢嗎？|花了這筆，我就不能做什麼？`,dr:`不知道自己少了什麼，就容易選錯。`,
q:`我不太知道每個月的錢去了哪裡。|心情不好或太開心時，我比較會亂花錢。|用錢時，我很少想最糟的情況。`,qy:`記錢、等一等、留救急的錢。`,
ac:`寫下賺的、固定花的、其他花的、欠的、存的。|不是一定要買的貴東西，等一到三天。|先存救急的錢。|放錢進去前，先看最糟的情況。|想想買了這個，就少了什麼。`,
da:`記下「為什麼會想亂買」。`,sy:`做一張看得到錢進出的表。`,kp:`能選的變多，也比較不怕突然的事。`,al:`先留住選擇，再想賺更多。`,
lk:`現在舒服，以後不自由`,core:`記錢、想最糟、留救急的錢`,fa:`寫下這個月的錢去哪裡`,
soup:`松鼠在秋天存下果子，冬天就不用害怕。今天少花一點點，不是對自己小氣，是送給明天的自己一份禮物。存下來的每一塊錢，都在說：「以後的我，還有得選。」¦A squirrel saves nuts in autumn and has nothing to fear in winter. Spending a little less today isn't being stingy with yourself; it's a gift to tomorrow's you. Every coin saved says: "The future me still has choices."`});

k(26,{sub:`不要只是一直做，把做過的留下來`,def:`工作，就是把時間和本領變成成果。`,
pl:`一直在做，卻沒有留下可以再用的東西。`,
mi:`什麼事都自己做|一樣的事，每次都重新來|以為做越久越厲害|沒有讓機器幫忙|沒有留下可以再用的東西`,
co:`人一停，事情就停|越厲害，反而越忙`,
up:`做一次→寫下來→變成固定做法→讓機器做→交給別人。`,
iq:`這件事為什麼一直重做？|可以寫成固定做法嗎？|可以讓機器幫忙嗎？|可以交給別人嗎？|我一個星期不在，事情還能進行嗎？`,
ic:`只有你會做，所以越厲害越忙。`,
rp:`一直做，卻沒有留下可以再用的。`,ri:`下次還要從頭開始嗎？`,rc:`越厲害，越忙。`,
rm:`第一次，做|第二次，寫下來|第三次，變成固定做法|能讓機器做，就讓機器做|能交給別人，就交給別人|留下範本和筆記`,rk:`不要只做完，要讓下次不用重來。`,
cs:`一樣的資料，每個月都重做|做法只有自己知道|每天回答一樣的問題|什麼都不敢交給別人|忙到沒時間想更好的做法|請一天假，事情就全部停了`,
cc:`自己變成事情卡住的地方。`,cr:`做→寫下來→範本→固定做法→讓機器做→交給別人。`,cl:`最棒的工作，是今天做完，明天就少做一次。`,
dx:`這件事是不是一直重做？|有固定做法嗎？|有範本嗎？|能讓機器做，或交給別人嗎？|我不在，事情還能進行嗎？`,dr:`只有你會做，你就變成卡住的地方了。`,
q:`一樣的工作，我常常從頭再做一次。|很多事只有我知道怎麼做。|如果我休息一星期，很多事會停下來。`,qy:`寫下來→固定做法→讓機器做→交給別人。`,
ac:`找出這星期最常重做的一件事。|第一次，做。|第二次，寫下來。|第三次，做成範本。|能讓機器做，就讓機器做。|能交給別人，就交給別人。`,
da:`每天把一件事，變成以後可以再用的。`,sy:`做一本自己的做法筆記。`,kp:`一樣的成果，花的時間變少了。`,al:`工作不是一直做，是把做過的變成可以再用的。`,
lk:`一樣的事，每次都自己重做`,core:`寫下來→固定做法→讓機器做`,fa:`找一件常常重做的事`,
soup:`每天去河邊提水很辛苦。有一天，你挖了一條小水溝，水就自己流過來了。把做過的事寫下來，就像挖水溝。今天多花一點力氣，以後每一天都輕鬆一點。¦Carrying water from the river every day is hard. One day you dig a small channel, and the water flows to you on its own. Writing down what you've done is like digging that channel. A little more effort today makes every day after a little easier.`});

k(27,{sub:`你喜歡的，也要別人真的需要`,def:`做生意，就是一直幫某些人解決他願意付錢的問題。`,
pl:`自己覺得好，不代表別人需要。`,
mi:`東西好，就以為一定有人買|只看有多少人看|只看賺進多少|不問客人真正的煩惱|一直出新東西|沒有讓客人再回來的方法`,
co:`東西越堆越多|花更多錢打廣告|客人卻沒有留下來`,
up:`煩惱→真的需要→解決的方法→真的有幫到→再回來買→聽聽他怎麼說。`,
iq:`客人真正的煩惱是什麼？|他真的願意付錢解決嗎？|買了以後，真的有幫到他嗎？|為什麼有人不買？|為什麼有人不再買？`,
ic:`東西越做越多，堆的貨和花的錢也越多。`,
rp:`自己喜歡，不代表客人需要。`,ri:`客人願意用行動和錢來證明他需要嗎？`,rc:`東西變多，堆的貨也變多。`,
rm:`先有煩惱，再有東西|先小小地試賣|看有多少人真的買|看買了有沒有用|看會不會再來買|看會不會介紹朋友|沒人要的東西，不要再花錢|`,rk:`客人的反應，比自己的喜歡更重要。`,
cs:`自己覺得很棒，就進很多貨|很多人按讚，就以為一定會買|只看賺進多少，沒算花掉多少|一直出新東西，老客人卻不回來|客人一直問一樣的問題，說明卻沒改|賣不動，就覺得是客人不懂`,
cc:`貨變多、事情變複雜，賺的不一定變多。`,cr:`煩惱→試賣→有人買→有幫到→再回來。`,cl:`市場不是來說你對，是來告訴你真的情況。`,
dx:`客人真正想解決什麼？|他願意花錢、花時間、動手來證明嗎？|買了以後真的有幫到嗎？|不買的人為什麼不買？|買過的人為什麼再買或不再買？`,dr:`回答不出來，先不要急著出新東西。`,
q:`我覺得東西很棒，就以為客人也需要。|我看有多少人看和買，很少看有沒有幫到、會不會再來。|賣不好時，我第一個想到的是出新東西、多廣告或降價。`,qy:`回到：煩惱→真的需要→有沒有幫到。`,
ac:`先寫下客人的煩惱。|去問問真的客人。|先小小地試賣。|看有多少人買。|看有沒有幫到。|看會不會再來、會不會介紹。`,
da:`每天收集一句客人真的說的話。`,sy:`煩惱→需要→方法→有幫到→再回來，一直轉。`,kp:`回來買的人變多，也真的幫到人。`,al:`市場不聽你說東西多好，它用行動回答你。`,
lk:`自己喜歡，就以為別人需要`,core:`煩惱→真的需要→有幫到`,fa:`寫下客人的煩惱`,
soup:`你很愛吃辣，就煮了一大鍋辣湯，可是客人怕辣。不是湯不好，是沒有先問一句：「你想喝什麼？」先聽聽別人需要什麼，再煮湯。被需要的湯，才會被喝光光。¦You love spicy food, so you cook a big pot of spicy soup — but your guests can't eat spicy. The soup isn't bad; you just didn't ask, "What would you like?" Listen to what people need first, then cook. Soup that is needed gets finished.`});

k(28,{sub:`AI 說得像真的，不代表就是真的`,def:`AI，是很快幫你寫、整理、比較和想事情的工具。`,
pl:`AI 可以把錯的事，說得很完整、很好聽。`,
mi:`AI 說什麼就信什麼|不查是從哪裡來的|把 AI 當成最厲害的老師|做出一大堆卻不整理|沒有把重複的拿掉|沒有記下哪個是新的|沒有回到真的世界試試看`,
co:`錯的事很快被複製|東西越多，越亂|看起來知道很多，其實只是一大堆資料`,
up:`AI 的答案→找證明→去試試看→找出錯的→換新地圖。`,
iq:`AI 說的有證明嗎？|我查過了嗎？|AI 是在幫我想，還是替我決定？|新的有沒有跟舊的重複？|這次是變清楚，還是變更亂？|可以怎麼試試看是不是真的？`,
ic:`存了一大堆資料，卻沒有變聰明。`,
rp:`AI 可以把錯的事說得很完整。`,ri:`這是有證明的，還是只是說得漂亮？`,rc:`錯的事很快變多，越來越亂。`,
rm:`查一查是不是真的|重要的事，要問是哪裡來的|分清楚：真的、推想的、亂猜的|把 AI 說的跟真的比一比|把重複的拿掉|記下哪一版是新的|錯了就改|大事情，自己做決定`,rk:`AI 幫你想得快，你要負責看是不是真的。`,
cs:`AI 說有一篇研究，沒查就拿來用|一次請 AI 寫三百條，裡面很多重複|把 AI 整理的話，當成原作者說的|讓 AI 幫自己做人生的大決定|APP 一直加 AI 寫的東西，舊的都沒整理|AI 寫得越完整，自己越少去查`,
cc:`資料變很多，真正有用的反而變少。`,cr:`哪裡來的→證明→拿掉重複→記版本→去試試看。`,cl:`AI 是幫你想得更快的幫手，不是真的世界。`,
dx:`這是 AI 說的，還是有證明的事？|重要的事，我有查是哪裡來的嗎？|AI 是不是把猜的說得像真的？|AI 是在幫我想，還是代替我想？|這次的東西，是變清楚，還是只是變多？`,dr:`東西變多卻更不清楚，AI 就是在幫倒忙。`,
q:`AI 說得很完整時，我就不太想再查。|我用 AI 做了很多東西，卻很少整理和查證。|有些事，我已經讓 AI 代替我決定。`,qy:`AI 的答案→找證明→自己想→去試試看。`,
ac:`把 AI 說的標成：真的、推想的、猜的。|重要的事，找出是哪裡來的。|請 AI 說說相反的例子。|跟真的事情比一比。|做很多之前，先把重複的拿掉。|大事情，自己決定。`,
da:`每天至少查一件 AI 說的重要的事。`,sy:`AI→找證明→再試→記版本。`,kp:`東西不一定變多，可是更可以相信、更好用。`,al:`不要讓 AI 弄亂你的地圖，讓 AI 幫你考考地圖。`,
lk:`AI 說得完整，就以為是真的`,core:`找證明、看來源、自己再看一次`,fa:`標出「真的／推想的」`,
soup:`AI 像一個說話很快、很會講故事的朋友。朋友說的話，我們會聽，可是也會自己想一想、查一查。AI 可以陪你想，可是不能替你想。你的腦袋，才是最珍貴的。¦AI is like a friend who talks fast and tells great stories. We listen to friends, but we also think and check for ourselves. AI can think with you, but not for you. Your own mind is the most precious thing.`});

k(29,{sub:`不是誰不好，是規則讓問題一直回來`,def:`系統，就是很多人、規則和東西一起運作的方式。`,
pl:`一樣的問題，換了人還是一直發生。`,
mi:`一出事就找人怪|每次都靠救火|沒有固定做法|沒有人告訴你做得怎樣|獎勵的方法反而讓人做錯|只有一個人撐著`,
co:`一樣的問題，換人再來一次|解決了一百次，原因卻沒有變`,
up:`不要只修理人，要改做事的方法。`,
iq:`這個問題是不是一直發生？|換一個人還會發生嗎？|是哪一條規則讓人這樣做？|有沒有人會告訴我們做得怎樣？|該改的是人，還是做事的方法？`,
ic:`每天救火，火的源頭卻一直在。`,
rp:`一樣的問題，換了人還是再來。`,ri:`換一個人，問題還會發生嗎？`,rc:`每天都在救火。`,
rm:`找出一直重複的事|畫出事情是怎麼繞一圈的|看看規則在鼓勵什麼|找出卡住的地方|改掉原本的設定|寫下固定做法|讓結果自己會回報`,rk:`一直發生的問題，先改做事的方法。`,
cs:`每天都有人忘了交作業，每天一個一個提醒|一直有人填錯表格，只是一直罵新人|每個月都超支，每次都怪同一個人|一直有人問一樣的問題，每次都重新回答|每次出錯，都靠同一個厲害的人來救|換了三個人，問題還是一模一樣`,
cc:`人換了，問題還在。`,cr:`重複的事→做事的方法→規則鼓勵什麼→固定做法→結果會回報。`,cl:`一樣的問題一直來，就不要只修理人。`,
dx:`這個問題是不是一直發生？|不同的人是不是也會犯一樣的錯？|是哪一條規則或做法造成的？|我們是不是每次都只處理眼前的事？|改哪裡，以後才會少發生？`,dr:`換人還是發生，就先改做事的方法。`,
q:`一樣的問題，換了不同的人還是發生。|每次出事，我們都是提醒、罵人或救火。|很少有人回頭看規則和做法。`,qy:`不要再只修理人，開始改做事的方法。`,
ac:`找出一直重複的事。|先不要問「誰錯了？」|問「是什麼做法讓它一直發生？」|畫出事情怎麼進行的。|改一條最有用的規則。`,
da:`問題發生第二次，就記下來。`,sy:`發生第三次，一定坐下來檢查做法。`,kp:`一樣的事越來越少發生。`,al:`第一次救火，第二次記下來，第三次改做法。`,
lk:`換了人，問題還是一樣`,core:`改做法、改規則、讓結果會回報`,fa:`找出一直重複的事`,
soup:`屋頂有一個洞，下雨就漏水。拿水桶來接，接了一百次，洞還是在。不是接水的人不好，是洞要補。同樣的事一直發生，就不要再怪人，去把那個洞找出來補好吧。¦There's a hole in the roof, and rain leaks in. You catch it with a bucket a hundred times, but the hole is still there. It's not the bucket-holder's fault — the hole needs fixing. When the same thing keeps happening, stop blaming people and go find the hole.`});

k(30,{sub:`世界不是一條直線，一小步一小步試`,def:`複雜，就是很多事互相影響，做兩倍不一定得到兩倍。`,
pl:`以為世界會照著直線走。`,
mi:`做兩倍，就以為會有兩倍的結果|改一條規定，就以為只會有一個結果|沒想到會有別的影響|沒想到過了某個點會突然變|沒想到大家會想辦法適應`,
co:`規定沒有用|方法反而讓事情更糟|好心也可能變成壞結果`,
up:`先試一小步→看看結果→再調整。`,
iq:`是不是有很多事同時在影響？|改了這個，別的會不會也跟著變？|會不會過一陣子才看得到？|會不會過了某個點突然變？|會不會有想不到的影響？|可以先試一小步嗎？`,
ic:`好心去改，卻可能有想不到的結果。`,
rp:`世界不會永遠照直線走。`,ri:`我這樣做，會不會引起第二個、第三個變化？`,rc:`好心可能變成壞結果。`,
rm:`不要一次改很大|先試一小步|留一條可以回頭的路|等一等，看後來怎樣|注意想不到的影響|多留幾條路`,rk:`事情很複雜時，不要一次賭一個答案，多試幾次就會知道。`,
cs:`不准用手機，以為會更用功，結果用別的方法偷懶|大降價想賺更多，卻讓人覺得東西不好|一次改五個習慣，最後不知道哪個有用|爸媽管得更嚴，孩子反而更會隱瞞|多加考核，大家只做有算分的事|APP 功能變多，大家反而不知道怎麼用`,
cc:`一個改變，帶來想不到的第二個影響。`,cr:`試一小步、可以回頭、看結果、再調整。`,cl:`複雜的事不是一次做好，是邊走邊調整。`,
dx:`這個問題是不是有很多原因？|我這樣做，別人會不會跟著改變？|結果會不會晚一點才出現？|會不會有想不到的影響？|可以先做一個小小的、能回頭的試驗嗎？`,dr:`很不確定、又互相影響，就不要一次改很大。`,
q:`我常以為「改了這個，就一定會那樣」。|改變時，我很少想到別的影響。|遇到大問題，我常一次改很多。`,qy:`試一小步、可以回頭、多觀察。`,
ac:`先把要改的變小。|一次只改一點點。|先選可以回頭的。|等一等，看後來怎樣。|記下想不到的影響。|看結果再慢慢做大。`,
da:`問：「這樣還會影響到誰？」`,sy:`養成「試一下→看一下→再調整」。`,kp:`想不到的大麻煩變少了。`,al:`越不確定，第一步就要越小。`,
lk:`以為改了這個，只會有一個結果`,core:`試一小步，可以回頭`,fa:`把第一步變小`,
soup:`過小溪的時候，不用一步跳到對岸。先踩一顆石頭，穩了，再踩下一顆。世界很複雜，沒有人能一次看清楚。一小步一小步地試，你就會安全地走到對面。¦Crossing a stream, you don't have to leap to the other side. Step on one stone, steady yourself, then the next. The world is complex; no one sees it all at once. Try one small step at a time and you'll reach the other side safely.`});

k(31,{sub:`放下管不了的，照顧好管得了的`,def:`控制，就是去調整你真的能改的事。`,
pl:`一直想管，其實管不了的事。`,
mi:`想管孩子怎麼想|想管另一半怎麼反應|想管市場|想管別人喜不喜歡自己|真正管得了的自己，反而沒管`,
co:`更擔心|更常吵架|力氣都白花了|越來越覺得自己沒辦法`,
up:`管不了的放下，管得了的好好做。`,
iq:`這件事真的是我能決定的嗎？|哪些是我管得了的？|哪些是我管不了的？|我是不是一直想管別人怎麼選？|我真的可以改的是什麼？`,
ic:`很多力氣，花在管不了的事。`,
rp:`一直管著管不了的事。`,ri:`這件事，真的是我管得了的嗎？`,rc:`擔心、吵架、白花力氣。`,
rm:`畫一個「我管得了」的圈|分成：管得了、可以影響、只能接受|把力氣放回管得了的|想影響別人，就把環境安排好，不要用逼的|剩下不確定的，就接受它`,rk:`照顧自己能改的，不用管全世界。`,
cs:`希望每個學生都喜歡自己|要長大的孩子照自己的方式過|一直想改另一半的個性|一直擔心市場會怎樣|希望寫的東西每個人都說好|一直想管別人的心情`,
cc:`很多力氣，流到管不了的地方。`,cr:`分成三個圈：管得了、可以影響、只能接受。`,cl:`不要管別人，把環境安排好；不要管世界，把自己照顧好。`,
dx:`這件事真的是我能決定的嗎？|哪些我管得了？|哪些只能影響？|哪些只能接受？|我是不是把大部分的力氣，放在管不了的事？`,dr:`如果「是」，把力氣放回管得了的圈。`,
q:`我常為別人怎麼想、怎麼選而擔心。|我花很多力氣，希望別人照我的方式做。|我很少把事情分成：管得了、可以影響、只能接受。`,qy:`把力氣放回自己管得了的事。`,
ac:`畫三個圈：管得了、可以影響、只能接受。|把煩惱都放進三個圈。|把大部分力氣放在管得了的。|可以影響的，用好好說和安排環境。|只能接受的，就不要一直想。`,
da:`擔心的時候，再畫一次三個圈。`,sy:`養成先問「我能改的是什麼？」的習慣。`,kp:`沒用的擔心變少，有用的行動變多。`,al:`管自己能改的，不要管人。`,
lk:`一直管著管不了的人和事`,core:`管得了、可以影響、只能接受`,fa:`畫三個圈`,
soup:`風要往哪裡吹，我們管不了。可是，我們可以調整帆。別人的心、明天的天氣，都不是你的錯，也不是你的工作。把手放回自己的帆上，你會發現，船還是可以往前走。¦We can't control which way the wind blows, but we can adjust the sail. Other people's hearts and tomorrow's weather are not your fault, and not your job. Put your hands back on your own sail and you'll find the boat still moves forward.`});

k(32,{sub:`不是你不乖，是環境每天都在拉你`,def:`環境，就是你身邊一直影響你的東西。`,
pl:`一直怪自己忍不住，其實是環境每天都在引誘你。`,
mi:`手機一直在手邊|家裡到處都是引誘|書桌也是玩的桌子|身邊的人一直在做舊習慣|要用的東西很難拿`,
co:`每天都要用力忍|久了就回到老樣子`,
up:`把環境安排好，不要只叫自己忍。`,
iq:`現在的環境，會讓我做什麼？|引誘是不是太容易拿到？|對的事是不是太麻煩？|可以讓壞習慣變麻煩嗎？|可以讓好習慣變簡單嗎？`,
ic:`每天都用忍的，跟環境打架。`,
rp:`環境一直把你拉回老樣子。`,ri:`換一個環境，問題還會這麼大嗎？`,rc:`每天都靠忍。`,
rm:`把引誘拿走|把好的東西放在看得到的地方|讓好的選擇變成「本來就這樣」|讓壞的事多幾個步驟|讓好的事少幾個步驟|多跟支持你的人在一起`,rk:`安排環境，比管人有用。`,
cs:`讀書時，手機放在課本旁邊|想早睡，床上卻都是好玩的東西|想少吃甜的，桌上卻一直有甜點|想運動，運動的東西卻都收起來|想專心，通知卻全開著|想改習慣，身邊卻都是舊樣子`,
cc:`每天都在用力忍。`,cr:`讓好的事更容易，壞的事更麻煩。`,cl:`安排環境，比管人有用。`,
dx:`環境現在在讓我做什麼？|壞的事是不是伸手就能做？|好的事是不是很麻煩？|不靠忍的話，我可以改哪裡？|哪個「本來就這樣」可以換掉？`,dr:`環境跟目標相反，就先安排環境。`,
q:`引誘常常比對的事更容易拿到。|我常叫自己用忍的。|只要改環境，問題可能就會好很多。`,qy:`安排環境。`,
ac:`拿走一個會引誘你的東西。|放一個會提醒你的好東西。|讓壞的事多三個步驟。|讓好的事少三個步驟。|把「本來就這樣」換掉。`,
da:`每天把身邊改好一點點。`,sy:`每個月檢查一次身邊的環境。`,kp:`做對的事，越來越不用忍。`,al:`安排環境，比管人有用。`,
lk:`環境一直引你做舊習慣`,core:`安排環境，讓好事容易`,fa:`拿走一個引誘的東西`,
soup:`魚在乾淨的水裡，自然游得好。把一條魚放在髒水裡，再怎麼罵牠也沒用。你不是不夠好，可能只是需要換一缸水。把身邊整理一下，你會發現，自己本來就游得很好。¦A fish in clean water swims well naturally. Put it in dirty water and scolding won't help. You're not "not good enough" — you may just need fresh water. Tidy up what's around you and you'll find you've always been a good swimmer.`});

k(33,{sub:`先確定還能走下去，再想走多遠`,def:`風險，就是事情可能出錯，出錯時會失去多少。`,
pl:`只想最好的結果，忘了問自己受不受得了最糟的結果。`,
mi:`把錢全放在同一個地方|沒有備用的|沒有留空間|以為「以前沒發生，以後也不會」|只看平常會賺多少`,
co:`一次意外，就可能全部垮掉`,
up:`不用躲開所有危險，只要躲開受不了的大災難。`,
iq:`最糟會怎樣？|我受得了嗎？|就算很少發生，會不會損失很大？|我有備用的嗎？|我有留空間嗎？`,
ic:`一次很少發生的事，就可能回不來。`,
rp:`只想最好的，忘了自己撐不撐得過最糟的。`,ri:`如果最糟的事真的發生，我受得了嗎？`,rc:`一件事就可能讓全部垮掉。`,
rm:`先不要讓自己全部垮掉|多留一點空間|準備備用的|受不了的危險，分開放|損失很大的事，再少發生也要準備|不要讓一次失敗毀掉全部`,rk:`先活下來，才有下一次。`,
cs:`把存款全放在一個地方|出門從不想別的路、不多留時間|只有一個人知道重要的密碼|賺錢的方法只有一種|重要的資料只有一份|十年都沒事，就以為永遠沒事`,
cc:`一次很少發生的事，可能毀掉全部。`,cr:`不要全垮、有備用、分開放、留空間。`,cl:`先確定還有下一局，再想這一局贏多少。`,
dx:`最糟會怎樣？|真的發生，我受得了嗎？|有沒有一個地方壞了，全部就壞了？|我有備用的、有留空間嗎？|我是不是因為以前沒事，就以為以後也沒事？`,dr:`有可能全部垮掉的事，要先處理，不用等它變得常發生。`,
q:`做決定時，我常想最好的，很少想最糟的。|我有些重要的東西沒有備用的。|如果一件很少發生的事發生了，我可能受不了。`,qy:`先把會全垮的危險拿掉，再想賺更多。`,
ac:`寫下最糟會怎樣。|想想受不受得了。|找出「這裡壞了就全壞」的地方。|準備備用的。|多留一點空間。|受不了的危險，先拿掉。`,
da:`做大決定前，先問「我會不會因此出局？」`,sy:`先想好「如果失敗了，怎麼辦」。`,kp:`一件事，再也毀不掉全部。`,al:`先不要出局，再想贏更多。`,
lk:`只想最好的，沒想最糟的`,core:`不要全垮、有備用、留空間`,fa:`寫下最糟會怎樣`,
soup:`出門帶把傘，不是因為一定會下雨，是因為淋濕了會感冒。準備好備用的，不是膽小，是愛自己。先讓自己安全，才能安心地去冒險、去玩、去試試看。¦Taking an umbrella isn't because it will surely rain; it's because getting soaked can make you sick. Having a backup isn't cowardly — it's caring for yourself. Keep yourself safe first, and then you can explore, play and try things with a calm heart.`});

k(34,{sub:`爬得再快，也要看梯子靠對牆了沒`,def:`目標，就是你想去的地方。`,
pl:`很努力地爬，最後才發現梯子靠錯牆了。`,
mi:`目標是別人給的|一次訂十個目標|只有結果，沒有怎麼做|做到了目標，卻賠掉健康|把工具當成目的`,
co:`很努力，心卻越來越空|做到了，卻不知道接下來要幹嘛`,
up:`重要的事→目標→怎麼做→看結果。`,
iq:`這真的是我想要的嗎？|它是為了哪一件重要的事？|做到它，要付出什麼？|會不會賠掉更重要的東西？|如果沒有人知道我做到了，我還想做嗎？`,
ic:`可能很成功，卻不是自己真正想要的日子。`,
rp:`很努力，可是梯子可能靠錯牆。`,ri:`如果沒有人知道，我還想做嗎？`,rc:`成功了，心裡還是空空的。`,
rm:`想想目標是為了哪一件重要的事|同時不要有太多目標|也看看每天做了什麼|看看目標會不會傷到別的地方|每三個月再看一次|目標可以改，也可以拿掉`,rk:`目標是來幫你的，不是你去幫目標。`,
cs:`為了第一名，不睡覺、不顧身體|為了賺更多錢，完全沒有生活|選科系只因為爸媽希望|為了瘦到某個數字，身體反而變差|只追有多少粉絲，忘了想幫誰|做到很多目標，卻不知道為什麼要做`,
cc:`一小塊成功，整個卻輸了。`,cr:`重要的事→目標→要付出什麼→怎麼做→每三個月看一次。`,cl:`不要只問做不做得到，也問值不值得。`,
dx:`這真的是我想要的嗎？|它是為了哪一件重要的事？|要付出什麼才做得到？|做到以後，日子會更好嗎？|如果沒有人知道，我還想要嗎？`,dr:`目標跟重要的事沒有關係了，就要重新想目標。`,
q:`我有些目標，其實是別人希望的。|為了目標，我正在賠掉更重要的健康、家人或自由。|如果沒有人知道我做到，我可能就不想做了。`,qy:`讓目標回到重要的事。`,
ac:`寫下目標。|下面寫「為什麼？」|連到一件重要的事。|寫下要付出什麼。|看看會不會傷到別的地方。|需要的話，把目標拿掉。`,
da:`今天做的事，至少有一件是為了真正的目標。`,sy:`每三個月檢查一次目標。`,kp:`做到一件事，不會再賠掉整個生活。`,al:`目標是工具，不是主人。`,
lk:`很努力地爬錯梯子`,core:`目標要連到重要的事`,fa:`問「我為什麼要它？」`,
soup:`爬山的時候，偶爾要停下來，抬頭看看：這是我想去的那座山嗎？如果不是，沒關係，轉個彎就好。走得慢不可怕，走錯山才可惜。你想去的山，才是最美的山。¦When climbing a mountain, stop now and then and look up: is this the mountain I wanted? If not, that's fine — just turn. Walking slowly isn't scary; climbing the wrong mountain is the real pity. The mountain you want is the most beautiful one.`});

k(35,{sub:`生活已經回答你了，只是你還沒看`,def:`回饋，就是結果告訴你的事。`,
pl:`結果已經把答案告訴你了，你卻還沒看。`,
mi:`一直賣不好，還是不改|一直錯同一種題目，還是只抄答案|身體一直不舒服，卻沒有再檢查|別人一直說同一件事，卻沒有處理|從來沒有比一比改之前和改之後`,
co:`同一個錯，一直付學費|經驗變多，卻沒有變聰明`,
up:`結果→哪裡不對→找出原因。`,
iq:`結果跟我想的一樣嗎？|結果在告訴我什麼？|一樣的事出現幾次了？|我有記下改之前和改之後嗎？|看到什麼，我才願意改？`,
ic:`同一堂課，一直付學費。`,
rp:`結果已經說話了，卻沒有人聽。`,ri:`結果在告訴我什麼？`,rc:`同一堂課，一直付學費。`,
rm:`先寫下「我以為會怎樣」|後來寫下「真的怎樣」|算算差多少|分一分是哪種錯|固定回頭看一看|看完就決定下一步要做什麼`,rk:`不看結果，就學不到東西。`,
cs:`同一種題目錯了十次，還是只抄答案|客人一直說同一件事，做法卻沒改|每次出去玩都花太多，下次還是照舊猜|每次熬夜隔天都很累，還是覺得自己可以|每次這樣講都吵架，還是這樣講|數字說沒人用，還是不改`,
cc:`結果已經給答案了，卻沒有學到。`,cr:`我以為→真的→差多少→哪種錯→下一步。`,cl:`結果不是在罵你，是在告訴你怎麼改。`,
dx:`我本來以為會怎樣？|真的怎樣？|差在哪裡？|這個差別是不是發生很多次了？|我看了結果以後，改了什麼？`,dr:`結果一直在說，做法卻沒變，就是沒有在聽結果。`,
q:`結果不好時，我常直接做下一件事，很少回頭看。|一樣的結果出現很多次，我的做法卻沒變。|我很少比一比「我以為的」和「真的」。`,qy:`回頭聽聽結果在說什麼。`,
ac:`寫下「我以為」。|寫下「真的」。|寫下差多少。|標出是哪種錯。|決定下一步。`,
da:`每天回頭看一件猜錯的事。`,sy:`做一張看得到結果的表。`,kp:`一樣的錯越來越少。`,al:`生活每天都在教，就看你有沒有在聽。`,
lk:`結果說話了，卻沒有聽`,core:`我以為→真的→差多少`,fa:`寫下「我以為」和「真的」`,
soup:`考卷發回來，紅筆圈的地方不是在笑你，是在告訴你：「這裡可以再練習喔。」生活也是老師，每一個結果都是它寫給你的小紙條。打開來看一看吧，裡面都是要幫你的話。¦When a test comes back, the red circles aren't laughing at you. They're saying, "Here's where you can practice more." Life is a teacher too, and every result is a little note it wrote for you. Open it and read — it's full of words meant to help.`});

k(36,{sub:`知道舊方法沒用了，就讓它休息吧`,def:`更新，就是有了新的證明，就改掉舊的想法。`,
pl:`明明知道錯了，還是用舊的方法。`,
mi:`知道沒用，還是繼續|怕丟臉，所以不改|已經花很多，所以不改|失敗一次，又一下子改太多|改了以後，沒有再試一次`,
co:`這是最要緊的錯之一|別的錯只錯一次|這個錯，會讓同一個錯一直重來`,
up:`看到證明→改→再試一次。`,
iq:`哪一個舊想法，已經被證明不準了？|我為什麼還抓著它？|是怕丟臉、害怕、習慣，還是捨不得？|新的想法要改成什麼？|改了以後，要怎麼再試？`,
ic:`別的錯只錯一次，不改的錯會一直重來。`,
rp:`知道錯了，卻還是不改。`,ri:`有什麼證明說，舊想法該改了？`,rc:`一樣的錯，一直繞圈圈。`,
rm:`寫下舊的想法|寫下跟它不一樣的事|寫下新的想法|不用全部丟掉，只改要改的|訂好什麼時候再試|把每次改的記下來`,rk:`改不是說以前都錯，是讓自己看得更清楚。`,
cs:`知道熬夜隔天會很累，還是每天熬夜|知道這樣讀沒用，還是照舊|世界變了，還用十年前的方法賣|孩子長大了，還用小時候的方式管|一樣的相處一直失敗，還希望下次會不同|看到新的證明，卻因為怕丟臉不改`,
cc:`一樣的錯，一直繞圈圈。`,cr:`舊想法→不一樣的事→新想法→再試。`,cl:`犯錯不貴，知道錯了還不改才貴。`,
dx:`有什麼證明說，舊想法不準了？|我是不是還在用它？|我不改，是證明不夠，還是怕丟臉、害怕、習慣、捨不得？|新想法要改哪裡？|我要怎麼再試一次？`,dr:`事情變了，想法卻沒變，就是該更新了。`,
q:`我知道一個方法沒用，卻因為習慣還在用。|看到新的證明，我有時會因為怕丟臉或捨不得而不改。|一樣的問題一直來，我的做法卻好多年沒變。`,qy:`舊想法→證明→新想法→再試。`,
ac:`寫下舊想法。|寫下跟它不一樣的事。|寫下新想法。|只改要改的地方。|想好怎麼再試。|把每次改的記下來。`,
da:`問：「今天哪個想法被生活改正了？」`,sy:`準備一本「我改過的想法」筆記。`,kp:`看到新的證明，做法也會跟著改。`,al:`改不是否定自己，是讓自己看得更清楚。`,
lk:`知道不準，還是用舊方法`,core:`舊想法→證明→新想法`,fa:`寫下舊想法和新想法`,
soup:`蝴蝶要長大，就要離開毛毛蟲的殼。殼沒有錯，它保護過你。只是現在，你需要翅膀了。跟舊方法說一聲：「謝謝你陪我走到這裡。」然後，張開新的翅膀吧。¦To grow, a butterfly must leave the caterpillar's shell. The shell wasn't wrong — it protected you. But now you need wings. Say to the old way, "Thank you for bringing me this far." Then open your new wings.`});

k(37,{sub:`不要只學答案，也學學自己為什麼會錯`,def:`後設學習，就是學會「我是怎麼學、怎麼錯、怎麼改的」。`,
pl:`一直學答案，卻沒有學自己為什麼會錯。`,
mi:`錯的題目只改答案|失敗了只說運氣不好|不知道自己常錯哪一種|一樣的錯，換個地方又出現|沒有整理自己常錯的樣子`,
co:`過了很多年、經歷很多事，心裡的地圖卻沒有變好`,
up:`不要只問「答案是什麼？」，也問「我為什麼會想錯？」`,
iq:`我最近最常犯哪三種錯？|它們是不是都被同一件事引起？|是不是同一種錯，只是換了地方？|我想事情時，哪一步最容易錯？|我要訂什麼新規則，才不會再犯？`,
ic:`經歷越來越多，卻沒有跟著變聰明。`,
rp:`一直學答案，沒有看自己怎麼錯的。`,ri:`我最常在哪一步錯？`,rc:`經歷變多，卻沒有變聰明。`,
rm:`做一張「我常犯的錯」表|每星期數一數最常犯的三種|找出是什麼引起的|看看在不同地方是不是一樣|訂一條「如果…我就…」的規則|下星期故意再試一次`,rk:`不要只修這一次的錯，要修那台一直做出錯誤的機器。`,
cs:`每次考試都粗心，卻沒看是哪一種粗心|每次跟人相處都吵一樣的架，卻都說是對方的錯|每個月都花太多，卻只說下個月會省|每次都拖到最後，卻沒找原因|每次擔心就滑手機，卻沒發現|犯了很多錯，卻沒有整理`,
cc:`經歷變多，地圖卻沒有變好。`,cr:`每星期三種錯→一樣的地方→什麼引起的→訂規則。`,cl:`不要只修錯的題目，要修一直做出錯題的地方。`,
dx:`我最近最常犯哪三種錯？|它們是不是被同一件事引起？|一樣的錯，是不是在健康、工作、相處都出現？|我常錯在：聽到的、想的、選的、做的，還是沒改？|可以訂什麼「如果…我就…」的規則？`,dr:`一樣的錯在不同地方出現，就要修源頭。`,
q:`我知道自己犯過很多錯，卻說不出最常犯哪三種。|一樣的問題，常換個地方又出現。|解決問題後，我很少整理成下次可以用的規則。`,qy:`開始做一張「我常犯的錯」表。`,
ac:`寫下最近十個錯。|分一分是哪種。|找出前三名。|找出是什麼引起的。|訂一條「如果…我就…」的規則。|下星期再試。`,
da:`每天只記一個最值得記的錯。`,sy:`每星期回頭看一次自己的錯。`,kp:`不是少錯一次，是一整種錯都變少。`,al:`最厲害的學習，是知道自己為什麼會學錯。`,
lk:`一直犯同一種錯，卻沒發現`,core:`找出自己常錯的樣子`,fa:`寫下最近十個錯`,
soup:`走路常常被同一顆石頭絆倒，不是你笨，是還沒看到那顆石頭在哪裡。把跌倒的地方畫下來，你就會發現：「啊，原來都是這裡！」看見了，下次就會繞過去。看見，就是最大的進步。¦If you keep tripping on the same stone, you're not foolish — you just haven't spotted the stone yet. Draw where you fell and you'll see: "Oh, it's always here!" Once you see it, you'll step around it next time. Seeing it is the biggest progress.`});

k(38,{sub:`懂很多道理，也要讓道理走進生活`,def:`智慧，就是在不同的事情上，都能讓你想得更好、選得更好、做得更好的本領。`,
pl:`知道很多道理，日子卻一直出現一樣的問題。`,
mi:`收藏很多好句子，就以為有智慧|年紀大，就以為有智慧|讀很多書，就以為有智慧|懂很多大道理，就以為有智慧|說得很漂亮，卻做不到|想法從來沒有拿去試試看`,
co:`知道的非常多|日子卻沒有變好`,
up:`真的智慧，要能說得清楚→猜得到→做得出來→再試一次→用在別的地方。`,
iq:`這個道理說得清楚嗎？|它能猜到接下來會怎樣嗎？|能變成我會做的事嗎？|有可能被證明是錯的嗎？|換一個情況還能用嗎？|它真的讓我猜得更準了嗎？`,
ic:`懂很多，日子卻沒有真的變。`,

k(39,{sub:`日子不用一直照舊，你可以重新安排`,def:`生命設計，就是自己安排時間、健康、家人朋友、本領、錢和選擇。`,

rm:`每三個月看一次自己的日子|健康、家人朋友、學習、工作、錢、自由，一樣一樣看|找出最卡的地方|找出最有用的地方|放下已經不適合的約定|重新安排時間、錢和注意力|留一條可以離開的路`,rk:`日子不是選對一次就好，是一直可以重新安排。`,

k(40,{sub:`你很重要，不用等別人來說`,def:`意義，就是你覺得這件事為什麼值得。`,
pl:`以為自己值不值得，要等別人來告訴我。`,
mi:`成功了才有價值|有人愛才有價值|沒有工作，日子就沒意思|孩子離家，自己就沒有用了|很痛苦，就覺得活著沒有意思`,

up:`意義不是找到一次就好，是可以一直重新找的。`,

ic:`工作、家人朋友、角色一變，整個方向就跟著垮。`,
rp:`把自己值不值得，全交給角色、成功或別人。`,ri:`如果這個角色不見了，我還剩下什麼？`,rc:`外面一變，自己也跟著垮。`,
rm:`不要把意義只放在一個角色上|讓自己有好幾個覺得值得的地方|把痛苦當成訊息，不要馬上說沒意義|讓舊的意義可以過期|再問：現在的我，想為什麼付出？|把意義變成今天做得到的事`,rk:`意義不是找到一次就固定，是會一直長出來的。`,
cs:`退休以後，覺得自己沒用了|孩子離家後，不知道自己還有什麼|沒有工作，就覺得自己沒價值|沒人稱讚，就覺得不值得做|分開了，就覺得以前都白費|遇到痛苦，就覺得走錯路了`,

dx:`我覺得自己值不值得，是不是只靠一個角色？|如果工作、朋友、成績或角色不見了，我還知道自己在乎什麼嗎？|我是不是把「現在很痛」當成「活著沒意思」？|以前的意義，是不是不適合現在了？|現在的我，願意把時間給什麼？`,dr:`意義只靠一根柱子，就多立幾根。`,
q:`我覺得自己好不好，很靠某個角色、成績、工作或別人的稱讚。|失去重要的角色時，我會覺得自己沒有價值。|我很少再想「現在的我，什麼值得我去做？」`,qy:`多找幾個覺得值得的地方。`,

da:`記下一件「今天很值得」的小事。`,sy:`每年重新寫一次「我為什麼而活」。`,kp:`一個角色變了，不會再讓整個人垮掉。`,al:`意義不是固定的答案，是可以一直走出來的方向。`,
lk:`把自己的價值，只綁在一個角色上`,core:`多找幾個值得的地方`,fa:`問「角色以外，我在乎什麼？」`,
soup:`星星不用別人說「你好亮」，它才會發光。你也是。不用等到考一百分、不用等到有人稱讚，你本來就很重要。就算今天什麼都沒做好，你還是值得被好好愛著。¦A star doesn't wait for someone to say "You're so bright" before it shines. Neither do you. You don't need a perfect score or anyone's praise — you already matter. Even if nothing went well today, you still deserve to be loved.`});

az(0,`這張地圖怎麼用`,`
這張地圖不是要說「你哪裡不好」。
它是陪你找出「事情是從哪裡開始走歪的」。
錯誤，就是你以為會這樣，結果不是。
猜錯的差距，就是「我以為」和「真的」差多少。
重要的不是永遠不犯錯。
是錯了以後，你能看懂→找到原因→換方法→再試一次→變成自己的本領。
怎麼用：不要問「我是不是有問題？」，問「這次是從哪裡開始歪的？」
步驟：發生的事→問問自己→是哪種錯→卡在哪→換新地圖→去做→再試。`);

az(2,`一個例子｜英文考 52 分`,`
小明第一次考試，英文 52 分。
他心裡的第一句話：「我英文就是很爛。」這是在貼標籤。
【慢慢拆開來看】
真的事：英文 52 分。
我猜的：以為看過課本就會考好。
真的結果：52 分。
差在哪：看過，不等於想得起來。
地圖錯了：把「很熟」當成「學會」。
學習錯了：沒有自己想、沒有再考一次。
方法錯了：一直重讀，沒有練錯的題目。
結果說：填空和長句子錯最多。
換新地圖：英文好不好，不是看了幾遍，是自己想不想得起來、用不用得出來。
去做：把錯的分類→找出卡住的→練十題→三天後再考。
本領：學會找出自己錯在哪。
智慧：「分數不是在說你這個人，是在告訴你現在的讀法要改。」`);
az(3,`女兒考得比同學差｜一張錯誤卡的例子`,`
發生的事：女兒考得比同學差。
→可能的錯：貼標籤。
→舊想法：「別人比我高分，就是我不夠聰明。」
→問題：一次的分數，被當成永遠的自己。
→拉回來：把標籤換成「還在練的本領」。
→新想法：「現在的分數，只是現在會的東西和方法的結果。」
→去做：看看錯的是哪幾種題目。
→再試：兩個星期後，考一樣的題型。
→證明：錯的變少了。
→本領：更會找出自己錯在哪。
→智慧：「成績是在告訴我事情，不是在說我是誰。」`);
az(4,`一件事可以有好幾層｜英文一直考不好`,`
同一件事，可以同時有好幾層的錯。
第一層｜地圖錯了→老師以為他只是不用功。
第二層｜貼標籤→學生覺得「我就是英文不好」。
第三層｜學習錯了→一直重讀，沒有自己想。
第四層｜環境錯了→手機一直放旁邊。
第五層｜沒有改→考了三次，還是用一樣的方法。
所以不是問：「你是哪一種錯？」
是問：「這件事的錯，是怎麼一個接一個的？」`);
az(5,`會越滾越大的錯｜一直拖的學生`,`
分數最高的錯，不一定是最開始的原因。
一直拖的學生：沒有去做 6 分、時間 5 分、學習 4 分。
可是往前找，可能會發現：
貼標籤：「反正我就是英文不好。」
↓ 被心情拉著走：一看到英文就緊張。
↓ 沒有去做：開始躲。
↓ 時間錯了：拖到最後一天。
↓ 學習錯了：只能硬背。
↓ 考差了。
↓ 標籤又貼得更緊。
【會越滾越大的錯】
貼標籤→心情→躲開→拖→方法不好→結果不好→更難過→標籤更緊。
所以要找的不是「哪一種分數最高」，是三件事：
①最開始是從哪裡來的？
②現在卡在哪裡？
③改哪裡，整串錯最容易鬆開？
然後才開始：發現→問自己→找源頭→找卡住的→拉回來→最小的一步→再試→證明→換新地圖→本領→智慧。
這樣，120 題就不是在說你是哪種人，是陪你從「遇到的事」找到「哪裡可以改」。`);

az(11,`最好的小處方`,`
你不用讀完 40 類，只要說：「我今天遇到了＿＿。」
①看是哪一層→②看最主要的錯→③問 3 題→④再問 5 題→⑤找源頭→⑥找卡住的→⑦找最有用的地方→⑧用拉回來的方法→⑨給 3 個方法→⑩只請你選 1 個最小的一步。
【為什麼最後只選一件？】
因為一次給十個建議，很容易又多出：沒去做＋心放錯地方＋太累。
所以最後不說：「你要做這十件事。」而是說：【今天只改一件事】。
如果變好了：多相信新想法一點。
如果沒變：再找一次卡在哪裡。
如果變差了：看看是怎麼發生的、有沒有別的影響、是不是別種錯。
↓ 換新地圖 ↓ 本領 ↓ 智慧。`);

az(14,`什麼是「正則化」？就是把歪掉的拉回來`,`
「正則化」本來是教電腦學習時用的話。
白話就是：不要因為幾次經驗、很大的心情、一個消息或舊習慣，就越學越歪。
不是把自己「改正」。
是在想法、心情、決定和做的事快要歪向一邊時，輕輕把它拉回來。
發現錯只是第一步；拉回來，才不會又回到老樣子。
拉回來＝把歪掉的拉回來；做法＝接下來真的要做什麼。
步驟：錯了→發現→停一下→拉回來→做新的事→再試→改。`);

⑫換新地圖。`);
az(16,`「拉回來」真正的意思`,`
拉回來，不是把日子變成「全對」。
是當我們太抓著以前的經驗時，把自己拉回可以改的地方。
失敗一次，不用想成「我永遠會失敗」。
一個人傷了我，不用想成「所有人都不能信」。
成功一次，不用想成「這個方法永遠有用」。
身體好一次，不用馬上說「一定是因為這個」。
AI 說一次，不用把它當成真理。
一位老師說的，不用當成全部都對。
一本書說的，不用當成人生的規定。
老規矩說的，留下它的好，也可以再試試看。
科學說的，看看證明、看看用在哪裡、看看會不會再改。
拉回來要保護的，不是「對的答案」。
是讓自己一直可以動、可以改。
最危險的，不是一時錯了。
是「錯了以後，不能改」。
每發現一種錯，就用它的方法拉回來。
再比一比拉回來以前和以後：如果猜得更準了，就留下來；如果沒有，就再調一次。
這樣，智慧就不是寫在紙上的字，是會一直自己變好的生活。`);

差得更多→先停下來，看看是不是別種錯、有沒有別的影響。
成功很多次以後：方法→自己的規則→本領→在別的地方也試成功→智慧。`);
az(18,`錯的一串 ⇄ 智慧的一串`,`

az(19,`錯誤真正可惜的地方`,`
我們最要小心的，不是「犯錯」。
完全不犯錯，可能是你從來沒試過新的事。
真正可惜的是：
錯了→沒有發現。
發現了→沒有問自己。
問了→找錯原因。
找到原因→沒有去做。
做了→沒有再試。
再試不行→沒有改。
改好了→沒有變成自己的本領。
【完整的一圈】
發生的事→我本來怎麼想→結果怎麼說→哪裡猜錯了→是哪種錯→一直重複的樣子→卡在哪裡→怎麼發生的→改哪裡最有用→舊想法→新想法→下一個最小的一步→再試→證明→換新地圖→新的本領→智慧→下一次猜得更準。
真正的長大，不是「我再也不犯錯」。
是「一樣的錯，不用再花十年才看懂」。
真正的自由，也不是永遠做對。
是舊想法不能用時，我可以換，不用一直被昨天的自己綁住。`);
az(20,`最後的智慧公式`,`
發生的事不是結束。
事情→問題→錯→一直重複的樣子→怎麼發生的→卡在哪→最有用的地方→去做→看結果→換新地圖→再試→證明→本領→智慧。
智慧，再回到下一次的猜想。
這才是「生活→長出智慧→回到生活」。
生活變成資料，錯變成提醒，提醒叫我們拉回來，拉回來就去試，試了就有證明，有證明就換新地圖，最後變成本領和智慧。
這樣的人生，會一直自己變好。`);
az(21,`完整的一大圈`,`
【拉回來的一圈】
生活→事情→我猜→真的→錯了→哪種錯→拉回來→新的選擇→去做→看結果→再試→換新地圖→本領→智慧→再猜→下一次。
【長出智慧的一圈】
事情→發現錯→分種類→對照例子→看出重複的樣子→不改會怎樣→拉回來→新想法→最小的一步→再試→證明→換新地圖→本領→智慧→記下來→下一件事。
【問自己的一圈】
事情→問自己→哪種錯→為什麼這樣想→重複的樣子→卡在哪→拉回來→新想法→最小的一步→再試→新的證明→換新地圖→本領→智慧→下次猜得更準。
【最完整的一圈】
生活→事情→發現錯→看是哪一層→判斷題→問自己→源頭→錯的一串→卡在哪→最有用的地方→拉回來→方法→最小的一步→猜→真的→看結果→再試→證明→換新地圖→本領→智慧→記下來→下一次。
【自動帶路】
事情→①看是哪一層→②可能是哪幾種錯→③3 題→④5 題→⑤有多確定→⑥錯的一串→⑦源頭→⑧卡在哪→⑨最有用的地方→⑩用對應的方法→⑪只給一個最小的一步→⑫寫下我猜→⑬再試→⑭算差多少→⑮留下、調整或放下→⑯換新地圖→⑰本領→⑱智慧。
最後要的，不是變成「不會犯錯的人」。
是變成：看得到錯→找得到源頭→知道怎麼拉回來→很快去做→願意聽結果→會跟著改→把錯變成本領和智慧的人。`);
az(22,`五層口訣｜看・穩・做・設・更`,`
第一層｜看清楚。
第二層｜穩住自己。
第三層｜選對做法。
第四層｜安排環境。
第五層｜一直改。
【一句話說完】
看錯了→再看清楚。
心亂了→照顧自己。
卡住了→換個方法。
一直重來→改做法。
結果來了→換新地圖。
真正的智慧，不是永遠沒有錯。
是不管什麼錯，走過這五層以後，都能變成：錯→問自己→拉回來→去做→看結果→改→本領→智慧。`);
az(23,`最重要的意思｜把日子拉回來`,`
當你的想法、心情、習慣、相處、工作、身體或 AI，開始「越走越歪、越做越硬、越放越多、越難回頭」時，輕輕加上一點界線、反例、結果和真的事情，不要太抓著以前的經驗。
它不是把日子管得更緊。
是不讓任何一個想法、想要的東西、害怕、標籤、一個人或一個方法，拿走太多的力量。
最簡單的說法是：
【太多了→少一點。】
【太少了→補一點。】
【太硬了→鬆一鬆。】
【太亂了→整理一下。】
【太快了→慢一點。】
【太慢了→讓開始變容易。】
【太相信了→找找反例。】
【太懷疑了→找找證明。】
【放太多了→想想少了什麼。】
【抓太緊了→再看看目標。】
【太複雜了→拿掉一些。】
【只有一種→多想幾種。】
【離真的太遠了→回到真的事情。】`);
az(24,`一｜要拉回來的是什麼`,`
生命本來就是會動的。
沒有什麼樣子，要永遠不變。
真正危險的，不是某一種樣子，是：
心情不能換。
地圖不能改。
時間和錢不能重新分。
相處的方式不能再談。
「我是誰」不能再想。
方法不能停。
錯不能承認。
所以，要拉回來的不是「人生」。
是人生裡那些【卡得太死】的地方。`);
az(25,`二｜拉回來是怎麼運作的`,`
目標→去做→真的結果→結果說的話→差多少
差很少→繼續。
差越來越多→提醒。
↓ 看看：太多？太少？太硬？歪一邊？配不上？過期了？
↓ 拉回來：錯的放輕一點＋補上少的＋加入反例＋重新分時間和力氣＋找回界線＋重新訂目標
↓ 再試→新的結果→換新地圖。`);
az(26,`七十三｜拉回來的 24 個問題`,`
遇到任何事，先輕輕問自己：
①真的發生了什麼？
②哪些是可以確定的？
③哪些只是我自己想的？
④我偷偷加了什麼「一定是」？
⑤現在的心情，有沒有把事情放大？
⑥我是不是把一件事，變成「我就是……」？
⑦我是不是把「有關係」當成「原因」？
⑧還有哪三種可能？
⑨有沒有不一樣的例子？
⑩這個想法，在什麼時候不對？
⑪哪一樣被我看得太重？
⑫哪一樣被我忘了？
⑬是不是一直在繞圈圈、越繞越大？
⑭真正卡住的是什麼？
⑮改哪裡最省力？
⑯為了它，我少了什麼？
⑰如果我是對的，接下來應該會看到什麼？
⑱最小、可以試的一步是什麼？
⑲結果怎麼說？
⑳哪裡跟我猜的不一樣？
㉑什麼要少一點、收一點、平衡一下，或加回來？
㉒哪一張地圖要改？
㉓怎麼再試一次？
㉔這次的錯，最後讓我多了什麼本領？`);
az(27,`七十四｜拉回來的帶路機`,`
說出任何煩惱
↓ 先看它是哪一類：學習？身體？心情？相處？家裡？工作？錢？AI？相信的事？我是誰？人生？
↓ 看看哪裡太重了：說得太死？貼標籤？只怪一個原因？想得太可怕？只聽大人物的？只看自己想看的？捨不得已經花掉的？管太多？想得太簡單？想得太複雜？目標配不上？沒有聽結果？
↓ 有
↓【開始拉回來】
↓ 太重的放輕→補上忘記的→加入別的想法→加入反例→看看在什麼時候不對→回到真的事情→做一個小試驗→猜→去做→看結果→差多少→換新地圖。`);
az(28,`七十五｜《易經》的四個字：窮・變・通・久`,`
【窮】舊的地圖，已經不夠用了。
【變】重新調整輕重、相處、界線、方法和目標。
【通】消息、力氣和行動，又可以流動了。
【久】生命可以一直修正自己。
所以要長久，不是永遠不變。
是永遠不要失去「可以改」的本領。`);
az(29,`最後的公式｜不要讓任何一件事，占滿你整個人生`,`
日子亂掉，常常不是因為沒有想法。
是某一個想法太重了。
某一種心情太重。某一個人太重。某一個目標太重。某一段以前的事太重。某一個標籤太重。某一位大人物的話太重。某一種成功的方法太重。某一個 AI 的答案太重。
拉回來就是：【不要讓任何一件事，占滿你整個人生。】
所以不是要「永遠剛剛好」。是要學會：
發現。停一下。比一比。重新分輕重。試試看。看結果。改。再試。
真正的智慧，不是永遠同一個答案。是：
該穩的時候，穩得住。
該問的時候，敢問。
該做的時候，去做。
該停的時候，停得下來。
該留的時候，留下來。
該放的時候，放得下。
該改的時候，改得了。
【真正的自由，就是沒有任何一個舊想法，可以永遠不讓你改。】`);
