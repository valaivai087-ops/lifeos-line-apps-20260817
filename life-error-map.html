rm:`先說出你的目的¦State the purpose first|描述事實¦Describe the facts|說出你的需要¦Say your need|提出具體的請求¦Make a specific request|請對方說說他理解到什麼¦Ask them to reflect back|發現不同，就溫柔地立刻校準¦Calibrate as soon as you notice a difference`,rk:`溝通不是說出去，而是讓兩顆心對齊。¦Communication isn't output; it's aligning two minds.`,
cs:`「你應該知道我要什麼。」¦"You should know what I want."|老師說「好好準備」，學生不知道要準備什麼¦The teacher says "prepare well," and students don't know what to prepare|夫妻都說「我講過了」，理解卻完全不同¦Both spouses say "I told you," with completely different understandings|主管說「快一點」，同事不知道期限在哪¦The boss says "hurry," and staff don't know the deadline|生氣時只說「你就是很自私」¦In anger, only saying "You're so selfish"|LINE 的文字，被讀成完全不同的語氣¦A LINE message read in a completely different tone`,
cc:`兩顆心的地圖沒有對齊。¦The two inner models aren't aligned.`,cr:`目的→事實→需要→請求→請對方說回來。¦Purpose → Fact → Need → Request → reflect back.`,cl:`說出口不叫溝通，對方收到相近的版本，才叫溝通。¦Speaking isn't communicating; it's communication when they receive a close version.`,
dx:`我的目的到底是什麼？¦What is my purpose?|我說的是事實，還是只有評價？¦Did I state facts, or only judgments?|我的需要和請求清楚嗎？¦Are my need and request clear?|我知道對方實際理解成什麼嗎？¦Do I know what they actually understood?|現在是在對齊，還是在爭輸贏？¦Are we aligning, or fighting to win?`,dr:`兩人的版本不同時，就是溝通需要被照顧了。¦Different versions → a communication error.`,
q:`我常覺得「我明明講過了，他怎麼還是不懂？」¦I often think "I told him — why doesn't he get it?"|我很少請對方說說他理解到什麼。¦I rarely ask the other person what they understood.|衝突時，我容易評論人格，而不是描述事實與需要。¦In conflict, I criticize character instead of describing facts and needs.`,qy:`讓兩顆心的地圖對齊。¦Do model alignment.`,
ac:`先說出目的。¦State the purpose.|只描述事實。¦Describe only facts.|說出自己的需要。¦Say your need.|提出具體的請求。¦Make a specific request.|請對方說說他的理解。¦Ask them to reflect back.`,
da:`重要的對話，做一次理解確認。¦Do one understanding check in important conversations.`,sy:`建立屬於你的溝通模板。¦Build communication templates.`,kp:`「我以為你知道」的衝突越來越少。¦Fewer "I thought you knew" conflicts.`,al:`溝通，就是讓兩張地圖對齊。¦Communication = model alignment.`,
lk:`我說的≠對方收到的¦What I said ≠ what they received`,core:`讓地圖對齊¦Model alignment`,pr:`RP21 Model Alignment`,fa:`請對方說說他的理解¦Ask them to reflect back`});

e({n:22,lv:4,en:`RELATIONSHIP`,zh:`關係錯誤¦Relationship Error`,sub:`愛，不該慢慢變成控制、犧牲或索取¦Love shouldn't slowly turn into control, sacrifice or taking`,def:`關係，是兩個獨立的生命，長期互動所形成的循環。¦A relationship is the long-term feedback loop of two autonomous people.`,pl:`愛著愛著，不小心就變成了討好、控制或犧牲。¦Along the way, love can quietly turn into pleasing, controlling or sacrificing.`,
mi:`用討好換愛¦Pleasing to earn love|用控制換安全¦Controlling to feel safe|用犧牲換認同¦Sacrificing to earn approval|替別人的人生負責¦Taking responsibility for others' lives|要求對方改變，自己才能快樂¦Needing the other to change before you can be happy|衝突之後沒有修復¦No repair after conflict`,
co:`累積委屈¦Resentment builds|依賴¦Dependence|權力失衡¦Power imbalance|反覆衝突¦Repeated conflict|最後兩個人都失去了自主¦In the end both lose agency`,
up:`連結＋界線＋互惠＋修復。¦Connection + boundary + reciprocity + repair.`,
iq:`這段關係，有互相給予嗎？¦Is there reciprocity?|我是在愛，還是在討好？¦Am I loving, or pleasing?|我是在支持，還是在拯救？¦Am I supporting, or rescuing?|我是不是想控制對方，來換取安全感？¦Am I trying to control them to feel safe?|衝突之後，我們有修復嗎？¦Do we repair after conflict?`,
ic:`愛慢慢變成消耗、控制、依賴與怨懟。¦Love gradually becomes drain, control, dependence and resentment.`,
rp:`愛，可能慢慢變成了控制、討好或犧牲。¦Love may slowly become control, pleasing or sacrifice.`,ri:`這段關係，讓兩個人更自由，還是更不自由？¦Does this relationship increase or decrease both people's agency?`,rc:`依賴、怨懟、消耗。¦Dependence, resentment, drain.`,
rm:`守住界線¦Keep boundaries|檢查是否互相給予¦Check reciprocity|停止過度拯救¦Stop over-rescuing|允許彼此的不同¦Allow differences|衝突之後，建立修復¦Build repair after conflict|支持對方做自己的主人，而不是接管他的人生¦Support their agency instead of taking over their life`,rk:`好的關係，讓兩個人都更自由。¦A good relationship increases both people's freedom.`,
cs:`怕對方離開，所以什麼都答應¦Agreeing to everything for fear they'll leave|以愛為名，要求對方照你的方式生活¦In the name of love, demanding they live your way|替成年的孩子處理所有問題¦Solving every problem for an adult child|一直付出，心裡卻累積著期待¦Giving constantly while expectations quietly pile up|每次衝突都冷戰，從不修復¦Cold war after every conflict, never repair|只有一方可以有需要¦Only one person is allowed to have needs`,
cc:`自主下降、委屈增加、關係僵化。¦Agency drops, resentment grows, the relationship stiffens.`,cr:`界線＋互惠＋允許不同＋修復。¦Boundary + reciprocity + difference + repair.`,cl:`好的關係不是兩個人黏成一個人，而是兩個完整的人願意合作。¦A good relationship isn't two people fused into one; it's two whole people cooperating.`,
dx:`兩個人都可以說「不」嗎？¦Can both people say no?|兩個人的需要都有位置嗎？¦Do both people's needs have a place?|付出和責任，長期大致互惠嗎？¦Are giving and responsibility roughly reciprocal over time?|我是在支持，還是在控制、討好、拯救？¦Am I supporting, or controlling, pleasing, rescuing?|衝突之後有修復的方式嗎？¦Is there a way to repair after conflict?`,dr:`兩人的自主長期下降時，關係的結構需要更新了。¦Long-term drop in agency → the relationship structure needs updating.`,
q:`為了維持關係，我常做自己其實不願意做的事。¦To keep a relationship, I often do things I don't want to do.|我會希望對方改變，自己才能安心。¦I need the other person to change before I can feel at ease.|衝突之後，我們很少真正修復。¦We rarely truly repair after conflict.`,qy:`看看界線、互惠與彼此的自主。¦Check boundary + reciprocity + agency.`,
ac:`問問：現在是愛、支持、控制、拯救，還是討好？¦Ask: is this love, support, control, rescue or people-pleasing?|找回自己的界線。¦Restore your boundary.|把對方的責任還給對方。¦Return their responsibilities to them.|允許彼此不同。¦Allow difference.|衝突之後安排修復。¦Arrange repair after conflict.`,
da:`每天至少一次，直接說出真實的需要。¦Express a real need directly at least once a day.`,sy:`定期回顧這段關係。¦Hold relationship reviews.`,kp:`兩人的自主上升，控制與討好下降。¦Both people's agency ↑, control and pleasing ↓.`,al:`好的關係，讓兩個人都更能做自己。¦A good relationship lets both people be more themselves.`,
lk:`愛變成控制、討好、拯救¦Love turns into control, pleasing, rescuing`,core:`界線＋互惠＋修復¦Boundary + reciprocity + repair`,pr:`RP22 Relationship Agency`,fa:`分辨是支持還是控制¦Tell support from control`});

e({n:23,lv:4,en:`BOUNDARY`,zh:`界線錯誤¦Boundary Error`,sub:`把責任放回它該在的地方，是一種溫柔¦Returning responsibility to where it belongs is a kind of gentleness`,def:`界線，是分清楚我負責什麼、你負責什麼。¦A boundary is knowing what I'm responsible for and what you are.`,pl:`分不清楚誰的事，該由誰來扛。¦Not knowing whose responsibility is whose.`,
mi:`不敢說「不」¦Afraid to say no|別人一生氣就妥協¦Giving in when others get angry|替孩子承擔所有後果¦Taking on all your child's consequences|想控制別人的選擇¦Controlling other people's choices|把拒絕當成無情¦Treating refusal as heartless`,
co:`過度消耗¦Burnout|關係裡的怨懟¦Resentment in relationships|對方失去成長的機會¦Others lose chances to grow|自己也失去了自由¦You lose your freedom too`,
up:`我為我的選擇負責，你為你的選擇負責。¦I'm responsible for my choices; you're responsible for yours.`,
iq:`這是誰的責任？¦Whose responsibility is this?|我是不是替別人承擔了後果？¦Am I bearing someone else's consequences?|我是不是要求別人為我的情緒負責？¦Am I making others responsible for my emotions?|如果說「不」，我在害怕什麼？¦If I say no, what am I afraid of?|這條界線是在保護自己，還是在控制對方？¦Is this boundary protecting me or controlling them?`,
ic:`自己耗盡了，對方也失去了成長的機會。¦You burn out, and they lose their chance to grow.`,
rp:`不知道誰該負責什麼。¦Not knowing who's responsible for what.`,ri:`這到底是誰的選擇、誰的後果？¦Whose choice and whose consequence is this?`,rc:`自己耗盡，別人也長不大。¦You're drained, and others can't grow up.`,
rm:`畫一個責任圈¦Draw a responsibility circle|我的選擇，我來負責¦My choice, my responsibility|你的選擇，你來負責¦Your choice, your responsibility|拒絕的時候，不必過度解釋¦No need to over-explain when refusing|界線說一次，然後用行動守住¦State a boundary once, then hold it with action|界線不能變成控制別人¦A boundary must not become control`,rk:`界線不是把人推開，而是把責任放回對的位置。¦A boundary doesn't push people away; it puts responsibility back in place.`,
cs:`不想參加聚會，還是答應了¦Agreeing to a gathering you don't want to attend|孩子忘了作業，父母比孩子還焦慮¦A child forgets homework and the parents are more anxious than the child|同事沒做完的工作，自己默默全接走¦Silently taking over a colleague's unfinished work|別人一生氣，就立刻改變自己的決定¦Changing your decision the moment someone gets angry|要求伴侶不能和某些人來往¦Forbidding your partner from seeing certain people|替家人扛起明明不是自己的債務或責任¦Carrying debts or duties for family that aren't yours`,
cc:`一方耗盡，另一方失去了責任感。¦One side is drained; the other loses responsibility.`,cr:`責任圈＋選擇歸選擇＋後果歸後果。¦Responsibility circle + choices and consequences returned to their owner.`,cl:`界線不是拒絕愛，而是停止把責任放錯地方。¦A boundary isn't refusing love; it's ending misplaced responsibility.`,
dx:`這到底是誰的責任？¦Whose responsibility is it?|是誰做了選擇？¦Who made the choice?|誰該承擔後果？¦Who should bear the consequence?|我是不是因為怕對方不高興，就接手了？¦Did I take over because I feared their displeasure?|我的界線是在規範自己的行動，還是在控制對方？¦Does my boundary govern my actions, or control theirs?`,dr:`責任被放錯地方，就是界線需要被照顧了。¦Misplaced responsibility → a boundary error.`,
q:`別人不高興時，我很容易收回自己的決定。¦When others are unhappy, I easily take back my decision.|我常替別人承擔原本該由他負責的後果。¦I often bear consequences that belong to someone else.|我有時會把「我的界線」變成「你必須怎麼做」。¦I sometimes turn "my boundary" into "what you must do."`,qy:`把選擇與責任重新分回去。¦Redistribute choice and responsibility.`,
ac:`畫出「我的／你的」兩欄。¦Draw Mine / Yours columns.|這個選擇歸誰？¦Whose choice is it?|這個後果歸誰？¦Whose consequence is it?|練習說一句清楚的「不」。¦Practice one clear no.|不過度解釋。¦Don't over-explain.`,
da:`發現責任放錯了，就立刻溫柔地歸位。¦Return misplaced responsibility as soon as you notice it.`,sy:`寫下你的個人界線守則。¦Write your personal boundary rules.`,kp:`委屈變少，過度承擔變少。¦Resentment ↓, over-responsibility ↓.`,al:`把責任放回正確的位置，就是界線。¦Putting responsibility back where it belongs is a boundary.`,
lk:`替別人承擔選擇與後果¦Carrying others' choices and consequences`,core:`責任歸位¦Put responsibility back`,pr:`RP23 Responsibility Reset`,fa:`畫出「我的／你的」¦Draw Mine / Yours`});

e({n:24,lv:4,en:`HEALTH`,zh:`健康錯誤¦Health Error`,sub:`身體是一整個世界，別只看一個數字¦Your body is a whole world; don't look at just one number`,def:`健康，是身體許多系統長期調節的能力，不是單一的數字。¦Health is the long-term regulating ability of many systems, not one number.`,pl:`只看了一個症狀、一個數字，卻忘了整個身體。¦Looking at one symptom or number and forgetting the whole body.`,
mi:`沒有症狀，就以為沒有風險¦No symptoms = no risk|一次檢驗，就當成永遠的狀態¦One test = a permanent state|只買補充品，不改生活¦Buying supplements without changing lifestyle|別人有效，就直接照做¦Copying what worked for someone else|一次改十樣東西¦Changing ten things at once|好轉之後，完全沒有再追蹤¦No retest after improving`,
co:`不知道真正有效的是什麼¦Not knowing what actually works|可能延誤了需要專業評估的問題¦Possibly delaying problems that need professional evaluation|花了很多錢，卻不知道自己的基準與趨勢¦Spending a lot without knowing your baseline or trend`,
up:`建立基準→嘗試改變→再測→看趨勢→必要時請專業判斷。¦Baseline → intervention → retest → trend → professional judgment.`,
iq:`我知道自己的基準嗎？¦Do I have a baseline?|這是一次的數字，還是一段趨勢？¦Is this one number or a trend?|我是不是一次改了太多變數？¦Did I change too many variables at once?|好轉之後有再測嗎？¦Did I retest after improving?|哪些問題需要醫療專業評估，而不是自己猜？¦Which issues need medical evaluation rather than my own guessing?`,
ic:`不知道什麼真的有效，也可能延誤了必要的處理。¦Not knowing what really works, and possibly delaying necessary care.`,
rp:`只看單一症狀、單一數字，或單一方法。¦Looking only at one symptom, number or method.`,ri:`我有基準、趨勢和再測嗎？¦Do I have a baseline, trend and retest?`,rc:`不知道真正有效的因素，也可能延誤專業評估。¦Not knowing what works, and possibly delaying professional evaluation.`,
rm:`建立基準¦Establish a baseline|一次只改少量主要的變數¦Change only a few main variables at a time|記錄你做了哪些改變¦Record interventions|追蹤趨勢¦Track the trend|設定再測的時間¦Set a retest date|出現警訊時，優先尋求醫療評估¦Seek medical evaluation first for red-flag symptoms|補充品不能取代基本生活與必要的醫療¦Supplements can't replace basic lifestyle and necessary medical care`,rk:`量測→改變→再測，不靠感覺猜。¦Measure → change → retest; don't guess by feel.`,
cs:`血壓高了一次，就非常恐慌¦Panicking over one high blood pressure reading|體重正常，就以為一定健康¦Normal weight = must be healthy|一次開始六種補充品，好轉了卻不知道是哪一個¦Starting six supplements at once and not knowing which helped|朋友有效的方法，完全照搬¦Copying a friend's method exactly|症狀好轉，就自己忽略原本需要追蹤的問題¦Ignoring something that needed follow-up once symptoms eased|只靠補充品，睡眠、活動、飲食都沒照顧¦Relying on supplements while neglecting sleep, activity and diet`,
cc:`沒有基準、沒有辨識因果、也沒有趨勢。¦No baseline, no causal clarity, no trend.`,cr:`基準→少量變數→追蹤→再測→必要時專業評估。¦Baseline → few variables → track → retest → professional evaluation when needed.`,cl:`健康不是猜答案，而是持續量測與溫柔校準。¦Health isn't guessing; it's ongoing measurement and calibration.`,
dx:`我知道自己的基準嗎？¦Do I know my baseline?|現在看到的是一次數字還是趨勢？¦Is this a single number or a trend?|最近是不是同時改了很多變數？¦Did I recently change many variables at once?|我有記錄改變前後嗎？¦Did I record before and after?|這個情況需要專業的醫療評估或檢查嗎？¦Does this need professional medical evaluation?`,dr:`沒有基準、變數太多、也沒有再測時，很難知道真正的原因。¦No baseline + many variables + no retest → the real mechanism is hard to know.`,
q:`我容易因為一次數值或一個症狀，就下很大的健康結論。¦I tend to draw big health conclusions from one reading or symptom.|我曾同時改了很多健康方法，最後不知道哪一個有效。¦I've changed many health habits at once and couldn't tell which worked.|我比較少做「基準→改變→再測」的追蹤。¦I rarely track baseline → intervention → retest.`,qy:`改成看趨勢與再測；需要時請專業醫療評估。¦Track trend + retest; add professional medical evaluation when needed.`,
ac:`先建立基準。¦Establish a baseline.|確認需要追蹤的核心指標。¦Decide which core indicators to track.|避免一次亂改太多變數。¦Avoid changing too many variables.|記錄你做了哪些改變。¦Record interventions.|設定再測的日期。¦Set a retest date.|出現警訊或持續異常時，請合格的醫療專業評估。¦Seek qualified medical evaluation for warning signs or persistent abnormalities.`,
da:`只記錄真正對決定有幫助的健康資料。¦Record only health data that helps decisions.`,sy:`基準→趨勢→改變→再測→更新地圖。¦Baseline → trend → intervention → retest → model update.`,kp:`越來越能分辨什麼有效、什麼沒效。¦Better at telling what works from what doesn't.`,al:`健康不是追一個漂亮的數字，而是提升整體的調節與照顧風險。¦Health isn't chasing one nice number; it's overall regulation and risk care.`,
lk:`只看單一症狀或數字¦Looking at one symptom or number`,core:`基準→趨勢→再測¦Baseline → trend → retest`,pr:`RP24 Health Baseline`,fa:`先建立基準¦Establish a baseline first`});

e({n:25,lv:4,en:`MONEY`,zh:`金錢錯誤¦Money Error`,sub:`今天的舒服，別讓明天的自己買單¦Don't let tomorrow's you pay for today's comfort`,def:`金錢，是把現在的資源，搬到不同時間與用途的工具。¦Money is a tool that moves present resources across time and uses.`,pl:`今天的舒服，正在一點一點吃掉明天的自由。¦Today's comfort is quietly eating tomorrow's freedom.`,
mi:`賺多少就花多少¦Spending everything you earn|心情不好就購物¦Shopping when upset|投資只看報酬¦Investing only for returns|虧損後一直加碼想翻本¦Adding more after losses to win it back|沒有預備金¦No emergency fund|收入一增加，生活開銷也跟著膨脹¦Lifestyle inflates with income`,
co:`自由度下降¦Less freedom|承受風險的能力下降¦Less ability to bear risk|未來的選擇越來越少¦Fewer and fewer future choices`,
up:`看清現金流→留安全墊→長期複利。¦Cash flow → safety margin → long-term compounding.`,
iq:`我清楚自己的現金流嗎？¦Is my cash flow clear?|這是需要，還是一時衝動？¦Is this a need or an impulse?|最壞的財務結果，我承受得起嗎？¦Can I bear the worst financial outcome?|我有安全墊嗎？¦Do I have a safety margin?|這筆錢，讓我放棄了什麼？¦What is this money's opportunity cost?`,
ic:`未來的選擇權，越來越少。¦Future options keep shrinking.`,
rp:`今天的舒服，正在吃掉明天的自由。¦Today's comfort is eating tomorrow's freedom.`,ri:`這個選擇，會增加還是減少未來的選擇？¦Does this choice increase or reduce future options?`,rc:`財務自由度下降。¦Financial freedom declines.`,
rm:`看清楚現金流¦Build a cash flow picture|固定留下安全墊¦Keep a fixed safety buffer|大額消費，延遲 24～72 小時¦Delay large purchases 24–72 hours|投資先問最壞的情況¦Ask about the downside before investing|設定資產集中的上限¦Set a concentration limit|已經花掉的，不列入未來的判斷¦Leave sunk costs out of future decisions`,rk:`金錢更深的意義，是保留未來的選擇權。¦Money's higher function is preserving future options.`,
cs:`發薪水後，把可用額度當成可花額度¦Treating available credit as spendable money after payday|心情差就網購¦Online shopping when feeling down|股票跌很多，不甘心，繼續加碼¦Adding to a falling stock out of unwillingness to lose|只看報酬，不看最大的可能損失¦Looking only at returns, never at the maximum loss|收入增加，支出也同步增加¦Spending rises as income rises|沒有預備金，卻做高風險投資¦High-risk investing with no emergency fund`,
cc:`未來的選擇，漸漸變少。¦Future options gradually shrink.`,cr:`現金流＋安全墊＋延遲＋檢查最壞情況。¦Cash flow + safety margin + delay + downside check.`,cl:`金錢最大的價值之一，是保留未來的選擇權。¦One of money's greatest values is preserving future choice.`,
dx:`我知道每個月的錢流去哪裡嗎？¦Do I know where my money goes each month?|這次消費是需要，還是情緒與衝動？¦Is this purchase a need or an emotional impulse?|最壞的財務結果我承受得起嗎？¦Can I bear the worst financial outcome?|我有緊急預備金嗎？¦Do I have an emergency buffer?|花這筆錢，代表放棄了什麼其他選擇？¦What other option does this spending give up?`,dr:`不知道機會成本時，決定可能已經失真。¦Without knowing opportunity cost, the decision may be distorted.`,
q:`我不太清楚自己每個月的錢流去了哪裡。¦I'm not sure where my money goes each month.|情緒不好或興奮時，我比較容易花錢。¦I spend more when I'm upset or excited.|做財務決定時，我比較少想最壞的結果與機會成本。¦I rarely consider worst cases and opportunity costs in financial decisions.`,qy:`現金流＋延遲＋安全墊。¦Cash flow + delay + safety margin.`,
ac:`列出收入、固定支出、變動支出、負債與儲蓄。¦List income, fixed costs, variable costs, debts and savings.|非必要的大額消費，延遲 24～72 小時。¦Delay non-essential large purchases 24–72 hours.|先建立安全墊。¦Build a safety buffer first.|投資先看最壞的情況。¦Check the downside first.|算一算機會成本。¦Calculate the opportunity cost.`,
da:`記下非必要消費的觸發點。¦Log triggers for non-essential spending.`,sy:`建立一個現金流儀表板。¦Build a cash flow dashboard.`,kp:`財務的選擇權與緩衝增加了。¦Financial options and buffer grow.`,al:`先保留選擇權，再追求報酬。¦Preserve options first, then pursue returns.`,
lk:`短期舒服，犧牲未來自由¦Short-term comfort costing future freedom`,core:`現金流＋最壞情況＋緩衝¦Cash flow + downside + buffer`,pr:`RP25 Financial Safety`,fa:`列出本月的錢流¦List this month's money flow`});

e({n:26,lv:4,en:`WORK`,zh:`工作錯誤¦Work Error`,sub:`別只是一直做，讓做過的事變成你的資產¦Don't just keep doing — turn what you've done into assets`,def:`工作，是把時間與能力轉換成成果。¦Work converts time and ability into outcomes.`,pl:`一直在做，卻沒有把工作變成可以累積的東西。¦Always doing, never turning the work into something that accumulates.`,
mi:`所有事都自己做¦Doing everything yourself|重複的工作沒有流程¦No SOP for repeated work|把工時當成績效¦Treating hours as performance|沒有自動化¦No automation|沒有累積可以重複使用的資產¦No reusable assets`,
co:`人一停，一切就停¦When you stop, everything stops|越成功，反而越忙¦The more successful, the busier`,
up:`做一次→記下來→系統化→自動化→交給別人。¦Do → Document → Systemize → Automate → Delegate.`,
iq:`這件事為什麼一直重複在做？¦Why do I keep repeating this?|可以寫成流程嗎？¦Can it become an SOP?|可以自動化嗎？¦Can it be automated?|可以交給別人嗎？¦Can it be delegated?|如果我離開一星期，一切還能運作嗎？¦If I left for a week, would things still run?`,
ic:`人變成系統唯一的零件，越成功反而越忙。¦You become the system's only part; success makes you busier.`,
rp:`一直做，卻沒把工作變成資產。¦Always working, never turning work into assets.`,ri:`這件事，下次還需要從零開始嗎？¦Will this need to start from zero next time?`,rc:`越成功，越忙。¦More success, more busyness.`,
rm:`第一次，做¦First time, do it|第二次，記下來¦Second time, document it|第三次，寫成流程¦Third time, make an SOP|能自動化就自動化¦Automate what you can|能交給別人就交給別人¦Delegate what you can|留下範本與知識資產¦Leave templates and knowledge assets`,rk:`別只完成工作，讓下一次不必重新開始。¦Don't just finish the work; make sure next time doesn't start from scratch.`,
cs:`同一份資料，每個月都重新做¦Recreating the same report every month|流程只有自己知道¦Only you know the process|每天回答完全相同的問題¦Answering identical questions every day|什麼事都不敢交給別人¦Afraid to hand anything over|忙到沒有時間改善工作方式¦Too busy to improve how you work|請假一天，整個流程就停擺¦One day off and the whole workflow stops`,
cc:`自己成了系統的瓶頸。¦You become the system bottleneck.`,cr:`做→記錄→範本→流程→自動化→交付。¦Do → document → template → SOP → automate → delegate.`,cl:`真正有槓桿的工作，是今天做完，讓明天少做一次。¦High-leverage work is doing it today so tomorrow needs one less round.`,
dx:`這件事是不是一直重複在做？¦Is this repeated over and over?|有流程嗎？¦Is there an SOP?|有範本嗎？¦Is there a template?|能不能自動化或交給別人？¦Can it be automated or delegated?|如果我不在，流程還能運作嗎？¦Would the process run without me?`,dr:`只有你能做時，你可能已經成為瓶頸了。¦If only you can do it, you may already be the bottleneck.`,
q:`同樣的工作，我常常從頭再做一次。¦I often redo the same work from scratch.|很多事情只有我知道怎麼做。¦Many things only I know how to do.|如果我突然休息一週，很多流程可能會停。¦If I suddenly took a week off, many processes would stop.`,qy:`記錄→流程→自動化→交付。¦Document → SOP → automate → delegate.`,
ac:`找出本週最常重複的一件事。¦Find this week's most repeated task.|第一次，做。¦First time: do it.|第二次，記下來。¦Second time: document it.|第三次，做成範本或流程。¦Third time: template or SOP.|能自動化就自動化。¦Automate what you can.|能交給別人就交給別人。¦Delegate what you can.`,
da:`每天把一件工作，變成可以重複使用的資產。¦Turn one piece of work into a reusable asset each day.`,sy:`建立自己的知識庫。¦Build a knowledge base.`,kp:`同樣的成果，需要的人力和時間變少了。¦The same outcome takes less people-time.`,al:`工作不是一直做，而是把做過的事變成系統。¦Work isn't endless doing; it's turning what's done into a system.`,
lk:`重複的工作永遠自己做¦Always doing repeated work yourself`,core:`記錄→流程→自動化¦Document → SOP → automate`,pr:`RP26 Work Systemization`,fa:`找一件重複的事¦Find one repeated task`});

e({n:27,lv:4,en:`BUSINESS`,zh:`商業錯誤¦Business Error`,sub:`你喜歡的，也需要被世界真正需要¦What you love also needs to be what the world truly needs`,def:`商業，是持續替特定的人，解決他願意付費的問題。¦Business keeps solving problems specific people are willing to pay for.`,pl:`自己覺得好，不等於市場需要。¦Thinking it's good doesn't mean the market needs it.`,
mi:`產品好，就以為一定有人買¦A good product will surely sell|只看流量¦Watching only traffic|只看營收¦Watching only revenue|不問客人真正的問題¦Not asking customers' real problems|一直新增產品¦Constantly adding products|沒有回購的機制¦No repeat-purchase mechanism`,
co:`庫存增加¦Inventory grows|行銷成本增加¦Marketing costs rise|客人卻沒有留下來¦Customers don't stay`,
up:`問題→需求→解方→成果→回購→回饋。¦Problem → Demand → Solution → Outcome → Retention → Feedback.`,
iq:`客人真正的問題是什麼？¦What is the customer's real problem?|他真的願意付費解決嗎？¦Will they really pay to solve it?|買了之後，真的帶來成果嗎？¦Does buying really produce an outcome?|為什麼有人不買？¦Why do some people not buy?|為什麼有人不回購？¦Why don't some people buy again?`,
ic:`產品越做越多，庫存與成本也越來越高。¦More products, and higher inventory and costs.`,
rp:`自己喜歡，不代表客人需要。¦Liking it yourself doesn't mean customers need it.`,ri:`客人願意用行動和金錢證明需求嗎？¦Will customers prove demand with action and money?`,rc:`產品增加，庫存也增加。¦More products, more inventory.`,
rm:`先有問題，再有產品¦Problem before product|先做小規模的需求測試¦Run a small demand test first|追蹤轉換¦Track conversion|追蹤成果¦Track outcome|追蹤回購¦Track retention|追蹤推薦¦Track referrals|需求低的產品，停止追加資源¦Stop adding resources to low-demand products`,rk:`市場的回饋，比自己的喜歡更值得信任。¦Market feedback outweighs your own preference.`,
cs:`自己覺得產品很好，就大量進貨¦Stocking up because you personally love the product|文章很多人按讚，就以為一定會買¦Many likes on a post = surely people will buy|只看營收，不算成本¦Watching revenue without counting costs|一直開發新品，舊客人卻不回購¦Launching new products while old customers don't return|客人一直問同樣的問題，說明卻沒有改善¦Customers keep asking the same thing and the explanation never improves|賣不動，就覺得是客人不懂¦Not selling, so customers must not understand`,
cc:`庫存變多、複雜度變高，獲利卻不一定增加。¦Inventory ↑, complexity ↑, profit not necessarily ↑.`,cr:`問題→需求測試→轉換→成果→回購。¦Problem → demand test → conversion → outcome → retention.`,cl:`市場不是來證明你對，而是溫柔地給你回饋。¦The market isn't there to prove you right; it gives you feedback.`,
dx:`客人真正想解決的問題是什麼？¦What problem do customers really want solved?|他願意用錢、時間、行動證明需求嗎？¦Will they prove demand with money, time and action?|買完之後，真的得到成果了嗎？¦Did they really get an outcome after buying?|不買的人，為什麼不買？¦Why do non-buyers not buy?|買過的人，為什麼回購或不回購？¦Why do buyers return or not?`,dr:`答不出來時，先別急著增加產品。¦If you can't answer, don't rush to add products.`,
q:`我容易因為自己覺得產品很好，就認為客人也會需要。¦I tend to assume customers need what I think is a great product.|我關注曝光與銷售，卻很少追蹤成果與回購。¦I watch exposure and sales, rarely outcomes and retention.|產品賣不好時，我第一個反應常是加產品、加宣傳或降價。¦When sales are poor, my first reaction is more products, more promotion or lower prices.`,qy:`回到問題→需求→成果。¦Return to Problem → Demand → Outcome.`,
ac:`先寫下客人的問題。¦Write down the customer's problem.|訪談真實的客人。¦Interview real customers.|先做小規模的需求測試。¦Run a small demand test.|追蹤轉換。¦Track conversion.|追蹤成果。¦Track outcomes.|追蹤回購與推薦。¦Track retention and referrals.`,
da:`每天收集一則真實客人的回饋。¦Collect one piece of real customer feedback daily.`,sy:`問題→需求→解方→成果→回購的循環。¦Problem → Demand → Solution → Outcome → Retention loop.`,kp:`回購與真實的成果改善，而不只是曝光。¦Retention and real outcomes improve, not just exposure.`,al:`市場不聽你說產品多好，它用行為回答你。¦The market doesn't listen to your pitch; it answers with behavior.`,
lk:`自己喜歡＝以為市場需要¦Liking it = assuming the market needs it`,core:`問題→需求→成果¦Problem → demand → outcome`,pr:`RP27 Market Reality`,fa:`寫下客人的問題¦Write the customer's problem`});

e({n:28,lv:4,en:`AI`,zh:`AI 錯誤¦AI Error`,sub:`AI 說得像真的，不代表它就是真的¦AI sounding true doesn't make it true`,def:`AI，是高效率產生、整理、比較與推演資訊的工具。¦AI is a high-efficiency tool for generating, organizing, comparing and reasoning over information.`,pl:`AI 可以把錯誤說得非常完整、非常動聽。¦AI can make an error sound complete and convincing.`,
mi:`AI 說什麼就信什麼¦Believing whatever AI says|不查來源¦Not checking sources|把 AI 當成權威¦Treating AI as an authority|大量產生卻不整理¦Generating in bulk without organizing|沒有去除重複¦No deduplication|沒有版本管理¦No version control|沒有回到真實重新驗證¦No reality retest`,
co:`錯誤被快速複製¦Errors copied rapidly|資訊越多，反而越混亂¦More information, more entropy|看似擁有巨大的知識庫，其實只是一大堆資料¦It looks like a huge knowledge base but is just a huge pile of data`,
up:`AI 的答案→證據→真實→錯誤→更新地圖。¦AI output → evidence → reality → error → model update.`,
iq:`這個 AI 回答有證據嗎？¦Does this AI output have evidence?|我驗證過了嗎？¦Have I verified it?|AI 是在幫我思考，還是在替我決定？¦Is AI helping me think, or deciding for me?|新的內容，有沒有和舊的去除重複？¦Is new content deduplicated against old?|這次產生讓事情更清楚，還是更混亂？¦Does this generation reduce or increase entropy?|可以怎麼回到真實重新驗證？¦How can reality retest it?`,
ic:`建立了巨大的資料庫，卻沒有建立智慧。¦A huge database, but no wisdom system.`,
rp:`AI 可以把錯誤說得非常完整。¦AI can state errors very completely.`,ri:`這是證據，還是漂亮的生成文字？¦Is this evidence, or beautiful generated text?`,rc:`錯誤快速放大，資訊越來越亂。¦Errors amplify quickly; information grows chaotic.`,
rm:`查證事實¦Fact-check|重要的內容，要求來源¦Require sources for important content|分清楚事實、推論與猜測¦Separate fact, inference and speculation|讓 AI 的答案和真實交叉驗證¦Cross-check AI answers with reality|替內容去除重複¦Deduplicate nodes|建立版本管理¦Build version control|建立「錯誤→更新」的機制¦Build an error → update mechanism|重大的決定，留給人自己的判斷¦Keep human judgment for major decisions`,rk:`AI 負責加速推演，人負責回到真實校準。¦AI accelerates reasoning; people calibrate against reality.`,
cs:`AI 說某篇研究存在，沒有確認就引用¦Citing a study AI mentioned without checking it exists|一次請 AI 產生 300 條，裡面大量重複¦Generating 300 items at once, full of duplicates|把 AI 整理的哲學，直接當成原作者的觀點¦Taking AI's summary of a philosophy as the author's own view|讓 AI 替自己做重要的人生決定¦Letting AI make important life decisions|APP 一直新增 AI 內容，舊的卻沒有整理¦An app keeps adding AI content while old nodes are never deduplicated|AI 寫得越完整，自己越少回到真實檢查¦The more complete AI's writing, the less you check reality`,
cc:`資訊量暴增，智慧的密度反而下降。¦Information volume soars; wisdom density drops.`,cr:`來源→證據→去重→版本→真實驗證。¦Source → evidence → deduplicate → version → reality test.`,cl:`AI 是幫你加速思考的夥伴，不是真實本身。¦AI is a cognitive accelerator, not reality itself.`,
dx:`這是 AI 產生的說法，還是有證據支持的事實？¦Is this an AI claim or an evidence-backed fact?|重要的內容我有查來源嗎？¦Did I check sources for important content?|AI 是不是把推論說得像事實？¦Is AI presenting inference as fact?|AI 是在增加我的思考，還是取代我的判斷？¦Is AI adding to my thinking or replacing my judgment?|這次的產出，讓結構更清楚，還是只是更多？¦Did this output make the structure clearer, or just bigger?`,dr:`內容變多、清晰度卻下降時，AI 正在增加混亂。¦Volume ↑ but clarity ↓ → AI is increasing entropy.`,
q:`AI 回答得很完整時，我比較不想再查證。¦When AI answers completely, I'm less inclined to verify.|我產生了很多 AI 內容，卻很少去重、做版本管理和查證。¦I generate a lot of AI content but rarely deduplicate, version or verify it.|有些問題，我已經開始讓 AI 取代自己的判斷。¦For some questions, I've started letting AI replace my judgment.`,qy:`AI 答案→證據→人的判斷→真實驗證。¦AI output → evidence → human judgment → reality test.`,
ac:`把 AI 內容標成事實、推論或假說。¦Label AI content as fact, inference or hypothesis.|重要的事實，找出來源。¦Find sources for important facts.|請 AI 提出反例。¦Ask AI for counterexamples.|和真實、原始資料交叉驗證。¦Cross-check with reality and original sources.|大量產生之前，先去除重複。¦Deduplicate before generating in bulk.|重大的決定，保留人的判斷。¦Keep human judgment for major decisions.`,
da:`每天至少驗證一個 AI 的重要結論。¦Verify at least one important AI conclusion daily.`,sy:`建立 AI→證據→再測→版本管理。¦Build AI → evidence → retest → version control.`,kp:`內容不一定變多，但更可信、也更好用。¦Content may not grow, but credibility and usefulness rise.`,al:`別讓 AI 污染你的地圖，讓 AI 幫你測試地圖。¦Don't let AI pollute your model; let it stress-test your model.`,
lk:`AI 說得完整＝以為是真的¦Complete-sounding AI = assumed true`,core:`證據＋來源＋人的檢查¦Evidence + source + human review`,pr:`RP28 AI Reality Check`,fa:`標出事實／推論¦Label fact / inference`});

e({n:29,lv:4,en:`SYSTEM`,zh:`系統錯誤¦System Error`,sub:`不是誰不好，是規則讓問題一再重生¦It's not that someone is bad; the rules keep regenerating the problem`,def:`系統，是許多人、規則、資源與回饋共同形成的結果產生器。¦A system is a result generator made of people, rules, resources and feedback.`,pl:`同樣的問題，換了人還是一再重演。¦The same problem replays even when the people change.`,
mi:`問題一來，就急著找人怪¦Blaming someone as soon as a problem appears|每次都靠救火¦Always firefighting|沒有流程¦No SOP|沒有回饋¦No feedback|獎勵制度反而鼓勵錯的行為¦Incentives reward the wrong behavior|只有某一個關鍵人物撐得起¦Only one key person can make it work`,
co:`同樣的問題，換人重演¦The same problem replays with new people|解決了一百次事件，結構卻沒有改變¦You fix a hundred incidents and the structure stays the same`,
up:`不只修人，更要重新設計系統。¦Don't just fix people — redesign the system.`,
iq:`這個問題是不是一再發生？¦Does this problem keep recurring?|換一個人還會發生嗎？¦Would it happen with someone else?|哪一條規則正在鼓勵這個行為？¦Which rule encourages this behavior?|回饋的循環在哪裡？¦Where is the feedback loop?|該改的是人，還是系統？¦Should I change the person or the system?`,
ic:`每天都在救火，火源卻從沒熄滅。¦Firefighting every day while the source never goes out.`,
rp:`同樣的問題，換人一再上演。¦The same problem replays with different people.`,ri:`如果換一個人，問題還會發生嗎？¦If someone else were here, would the problem still happen?`,rc:`天天救火。¦Firefighting every day.`,
rm:`找出重複的模式¦Find the repeated pattern|畫出回饋的循環¦Draw the feedback loop|找出背後的誘因¦Find the incentive|找出瓶頸¦Find the bottleneck|改變預設¦Change the default|建立流程¦Build an SOP|增加自動的回饋¦Add automatic feedback`,rk:`反覆發生的問題，先修結構。¦For recurring problems, fix the structure first.`,
cs:`班上每天有人忘了交作業，每天個別提醒¦Someone forgets homework every day and you remind each one individually|公司一直有人填錯表格，只是不斷責備新人¦Forms keep being filled wrong and the new hire keeps getting blamed|家裡每月都超支，每次只怪某個人亂花¦Monthly overspending blamed each time on one family member|團購一直有人問同樣的物流問題，每次人工回答¦The same shipping questions answered by hand every time|每次出錯都靠某個能幹的人救火¦Every mistake rescued by one capable person|換了三個同事，問題還是一模一樣¦Three staff changes and the problem is identical`,
cc:`人換了，模式還在。¦The people changed; the pattern stayed.`,cr:`模式→結構→誘因→流程→回饋循環。¦Pattern → structure → incentive → SOP → feedback loop.`,cl:`同一個問題反覆發生，就別只修人。¦When the same problem keeps happening, don't just fix people.`,
dx:`這個問題是不是一再發生？¦Does this problem recur?|是不是不同的人也會犯一樣的錯？¦Do different people make the same mistake?|哪一條規則、流程或誘因正在製造它？¦Which rule, process or incentive produces it?|我們是不是每次都只處理事件？¦Do we only ever handle the incident?|改哪個結構，能讓問題以後更少發生？¦Which structural change would make it rarer?`,dr:`換人仍然發生時，優先修系統。¦It still happens after changing people → fix the system first.`,
q:`同一類問題，已經換了不同的人一再發生。¦The same kind of problem has recurred with different people.|每次問題出現，我們主要都是提醒、責備或救火。¦When problems arise, we mostly remind, blame or firefight.|很少有人重新檢查規則、流程、誘因和回饋循環。¦Rarely does anyone re-examine rules, processes, incentives and feedback loops.`,qy:`別再只修人，開始重新設計系統。¦Stop only fixing people; start redesigning the system.`,
ac:`找出重複發生的事件。¦Find the repeated event.|先別問「誰錯了？」¦Don't ask "Who's wrong?" first.|問「是什麼結構讓它一直發生？」¦Ask "What structure keeps producing it?"|畫出流程與回饋循環。¦Map the process and feedback loop.|改一條最有槓桿的規則。¦Change the one highest-leverage rule.`,
da:`問題重複第二次時，就記下來。¦Record a problem the second time it happens.`,sy:`第三次出現，一定做一次系統檢討。¦A third occurrence triggers a mandatory system review.`,kp:`同類事件發生得越來越少。¦Similar incidents become less frequent.`,al:`第一次救火，第二次記錄，第三次改系統。¦First time firefight, second time record, third time change the system.`,
lk:`換了人問題還是重複¦Problem repeats after changing people`,core:`結構＋規則＋回饋循環¦Structure + rules + feedback loop`,pr:`RP29 System Redesign`,fa:`找出重複的模式¦Find the repeated pattern`});

e({n:30,lv:4,en:`COMPLEXITY`,zh:`複雜系統錯誤¦Complexity Error`,sub:`世界不是一條直線，溫柔地一步一步試¦The world isn't a straight line; test gently, one step at a time`,def:`複雜，是很多因素互相影響，結果不一定和投入成正比。¦Complexity means many factors interact, and results aren't proportional to input.`,pl:`以為世界會照著直線前進。¦Assuming the world moves in straight lines.`,
mi:`努力兩倍，就期待成果兩倍¦Double effort, expecting double results|改一個規定，就期待只有一個結果¦One policy change, expecting one result|忽略了副作用¦Ignoring side effects|忽略了臨界點¦Ignoring tipping points|忽略了人會適應新的規則¦Ignoring that people adapt to new rules`,
co:`規定失靈¦Policies fail|策略產生反效果¦Strategies backfire|好心也可能帶來壞結果¦Good intentions can produce bad outcomes`,
up:`小步試探→觀察回饋→再調整。¦Small probe → observe feedback → adjust.`,
iq:`是不是有很多因素同時在作用？¦Are many factors acting at once?|改了 A，B 和 C 會不會也跟著變？¦Will changing A also change B and C?|有沒有延遲？¦Is there a delay?|有沒有臨界點？¦Is there a threshold?|有沒有第二層的副作用？¦Are there second-order effects?|能不能先做一個小小的試探？¦Can I run a small probe first?`,
ic:`好意的介入，可能帶來意想不到的結果。¦Well-meant interventions can have unexpected results.`,
rp:`世界不會永遠照直線走。¦The world doesn't always move in straight lines.`,ri:`我的介入，會不會引起第二、第三層的反應？¦Will my intervention trigger second- and third-order reactions?`,rc:`好意可能造成反效果。¦Good intentions may backfire.`,
rm:`避免一次大改¦Avoid big changes all at once|先做小小的試探¦Start with a small probe|保留可以回頭的空間¦Keep it reversible|觀察延遲¦Watch for delays|追蹤第二層的效應¦Track second-order effects|保留多條路¦Keep multiple paths open`,rk:`面對複雜，不必一次押上答案，用一次次嘗試換來資訊。¦In complex systems, don't bet on one answer; trade iterations for information.`,
cs:`禁止學生用手機，以為學習一定會變好，結果出現其他逃避方式¦Banning phones expecting better learning, and other avoidance appears|大幅降價想提高營收，卻讓品牌感受變差¦Deep price cuts to boost revenue, weakening the brand|一次改五種健康習慣，最後不知道什麼有效¦Changing five health habits at once and not knowing what worked|父母加強控制孩子，孩子反而更會隱瞞¦Parents tighten control and the child hides more|增加 KPI，大家只做被計分的事¦More KPIs and people only do what's scored|增加 APP 功能，使用者反而不知道從哪開始¦More app features and users don't know where to start`,
cc:`介入帶來了第二層的效應。¦The intervention creates second-order effects.`,cr:`小試探＋可回頭＋看回饋＋反覆調整。¦Small probe + reversible + feedback + iterate.`,cl:`複雜的系統不是一次設計完成，而是一邊走、一邊溫柔校準。¦Complex systems aren't designed in one go; they're calibrated as you walk.`,
dx:`這個問題是不是同時受很多因素影響？¦Is this problem shaped by many factors at once?|我的介入會不會改變別人的行為？¦Will my intervention change others' behavior?|結果會不會延遲才出現？¦Might results appear with a delay?|有沒有第二層的效應？¦Are there second-order effects?|能不能先做一個小小的、可回頭的試探？¦Can I run a small, reversible probe first?`,dr:`不確定性高、互動又多時，別一次大改。¦High uncertainty + many interactions → don't make one big change.`,
q:`我容易期待「改了 A 就一定得到 B」。¦I tend to expect "change A and I'll surely get B."|做改變時，我比較少考慮副作用、延遲和別人的適應。¦When making changes, I rarely consider side effects, delays and how others adapt.|遇到大問題，我容易一次做很多大改變。¦Facing a big problem, I tend to make many big changes at once.`,qy:`小試探＋可回頭＋觀察。¦Small probe + reversible + observe.`,
ac:`先縮小介入的規模。¦Shrink the intervention first.|一次只改少量主要的變數。¦Change only a few main variables at a time.|優先選可以回頭的實驗。¦Prefer reversible experiments.|觀察延遲。¦Watch for delays.|記錄第二層的效應。¦Record second-order effects.|依照回饋逐步擴大。¦Scale step by step based on feedback.`,
da:`問問：「這還可能影響到誰？」¦Ask: "Who else might this affect?"`,sy:`建立「試探→感受→回應」的循環。¦Build a probe → sense → respond loop.`,kp:`大型意外的副作用越來越少。¦Fewer large unexpected side effects.`,al:`越不確定，第一步就越應該小。¦The higher the uncertainty, the smaller the first step.`,
lk:`以為改 A 只會產生 B¦Assuming changing A only produces B`,core:`小而可回頭的試探¦Small, reversible probe`,pr:`RP30 Small Probe`,fa:`縮小第一次的介入¦Shrink the first intervention`});

e({n:31,lv:4,en:`CONTROL`,zh:`控制錯誤¦Control Error`,sub:`放下握不住的，照顧好你真正能改變的¦Let go of what you can't hold; care for what you can truly change`,def:`控制，是透過回饋，調整你真正能操作的變數。¦Control means adjusting the variables you can operate, through feedback.`,pl:`一直想控制，其實控制不了的東西。¦Trying to control what you can't.`,
mi:`想控制孩子怎麼想¦Controlling what your child thinks|想控制伴侶怎麼反應¦Controlling how your partner reacts|想控制市場¦Controlling the market|想控制別人喜不喜歡自己¦Controlling whether people like you|真正能照顧的自己，反而沒照顧¦Neglecting what you can actually control: yourself`,
co:`焦慮增加¦More anxiety|衝突增加¦More conflict|能量大量流失¦Huge energy waste|掌握人生的感覺越來越弱¦Less agency`,
up:`放下不能控制的，重新設計可以控制的。¦Let go of the uncontrollable; redesign the controllable.`,
iq:`這件事真的由我決定嗎？¦Is this really up to me?|哪些是我能控制的？¦What can I control?|哪些是我不能控制的？¦What can't I control?|我是不是一直想控制別人的選擇？¦Am I trying to control others' choices?|我真正可以調整的是什麼？¦What variable can I really adjust?`,
ic:`大量的能量，花在不可能完成的控制上。¦Huge energy spent on impossible control.`,
rp:`一直控制著控制不了的東西。¦Constantly controlling what can't be controlled.`,ri:`這件事真的在我能控制的範圍裡嗎？¦Is this variable really within my control?`,rc:`焦慮、衝突、能量浪費。¦Anxiety, conflict, wasted energy.`,
rm:`畫一個控制圈¦Draw a control circle|分成可控制／可影響／需接受¦Sort into control / influence / accept|把資源移回可控制的範圍¦Move resources back into the control zone|影響別人用條件設計，而不是強迫¦Influence through designing conditions, not force|接受剩下的不確定¦Accept the remaining uncertainty`,rk:`照顧好變數，不必掌控世界。¦Control variables, not the world.`,
cs:`希望所有學生都喜歡自己¦Wanting every student to like you|要求成年的孩子照你的方式生活¦Demanding an adult child live your way|一直想改變伴侶的個性¦Trying to change your partner's personality|焦慮市場會怎麼反應¦Anxious about how the market will react|希望文章發出去，所有人都認同¦Wanting everyone to agree with your post|努力想控制別人的情緒¦Trying hard to control others' emotions`,
cc:`大量的能量流向控制不了的地方。¦Energy flows into uncontrollable variables.`,cr:`可控制／可影響／需接受，分成三個圈。¦Sort into three circles: control / influence / accept.`,cl:`不去控制別人，而是設計條件；不去控制世界，而是照顧自己的變數。¦Don't control people; design conditions. Don't control the world; tend your own variables.`,
dx:`這件事真的由我決定嗎？¦Is this really my decision?|哪些變數我能控制？¦Which variables can I control?|哪些只能影響？¦Which can I only influence?|哪些必須接受？¦Which must I accept?|我是不是把大部分的能量，放在控制不了的東西上？¦Am I putting most of my energy into what I can't control?`,dr:`「是」的時候，把資源移回你的控制圈。¦YES → move resources back into your control circle.`,
q:`我常為別人的想法、選擇或反應而焦慮。¦I'm often anxious about others' thoughts, choices or reactions.|我花很多能量，希望別人照我的方式做。¦I spend a lot of energy wanting others to do things my way.|我很少把事情分成可控制／可影響／需接受。¦I rarely sort things into control / influence / accept.`,qy:`把能量移回你真正能控制的地方。¦Move energy back to controllable variables.`,
ac:`畫三個圈：可控制／可影響／需接受。¦Draw three circles: control / influence / accept.|把問題全部放進三個圈裡。¦Place every issue into the three circles.|把八成的能量放在可控制的圈。¦Put 80% of energy into control.|可影響的，用溝通與條件設計。¦Use communication and condition design for influence.|需接受的，停止反覆內耗。¦Stop the repeated inner drain for what must be accepted.`,
da:`焦慮的時候，重新畫一次三個圈。¦Redraw the three circles when anxious.`,sy:`養成「照顧可控變數」的思考。¦Build controllable-variable thinking.`,kp:`無效的焦慮變少，有效的行動變多。¦Useless anxiety ↓, effective action ↑.`,al:`照顧變數，不控制人。¦Control variables, not people.`,
lk:`一直控制控制不了的人事物¦Controlling uncontrollable people and things`,core:`可控制／可影響／需接受¦Control / influence / accept`,pr:`RP31 Control Circle`,fa:`畫三個控制圈¦Draw the three control circles`});

e({n:32,lv:4,en:`ENVIRONMENT`,zh:`環境錯誤¦Environment Error`,sub:`不是你不夠堅強，是環境每天都在推你回頭¦It's not that you're weak; your environment pushes you back every day`,def:`環境，是持續影響你行為的外在條件。¦Environment is the external conditions that keep shaping behavior.`,pl:`一直怪自己沒有自制力，其實是環境天天在誘惑你。¦Blaming your lack of self-control when your environment tempts you every day.`,
mi:`手機永遠在手邊¦Phone always within reach|家裡到處都是誘惑¦Temptations everywhere at home|書桌同時也是娛樂桌¦Study desk doubles as entertainment desk|身邊的人一直強化舊習慣¦People around you reinforce old habits|重要的工具很難拿到¦Important tools are hard to reach`,
co:`每一天都要靠意志力打仗¦Every day is a willpower battle|久了，容易回到舊模式¦Over time you slip back into old patterns`,
up:`設計環境，而不只是要求自己。¦Design conditions, don't just control people.`,
iq:`現在的環境，在鼓勵什麼行為？¦What behavior does my environment encourage?|誘惑是不是太容易拿到了？¦Is temptation too easy to reach?|對的行動是不是太麻煩了？¦Is the right action too much trouble?|可以增加壞習慣的阻力嗎？¦Can I add friction to bad habits?|可以減少好習慣的阻力嗎？¦Can I reduce friction for good habits?`,
ic:`每天都靠意志力，和環境對抗。¦Fighting the environment with willpower every day.`,
rp:`環境一直把你推回舊的模式。¦The environment keeps pushing you back to old patterns.`,ri:`如果換一個環境，這個問題還會這麼嚴重嗎？¦In a different environment, would this problem be as severe?`,rc:`每天靠意志力打仗。¦Fighting with willpower every day.`,
rm:`移開誘惑¦Remove temptations|讓好的行為出現在視線裡¦Keep good behavior in sight|設定好的預設選項¦Set a default option|讓錯的行為多幾個步驟¦Add steps to wrong behavior|讓對的行為少幾個步驟¦Remove steps from right behavior|選擇支持你目標的人際環境¦Choose people who support your goals`,rk:`設計條件，勝過控制人。¦Design conditions > control people.`,
cs:`讀書時，手機就放在課本旁¦Phone right next to the textbook while studying|想早睡，床上卻滿是娛樂設備¦Wanting to sleep early with entertainment all over the bed|想少吃甜食，桌上卻永遠有甜點¦Wanting less sugar with desserts always on the table|想運動，運動用品卻全收起來¦Wanting to exercise with all the gear put away|想專心工作，電腦通知全開著¦Wanting focus with every notification on|想改變習慣，身邊卻一直強化舊的行為¦Wanting change while your surroundings reinforce old behavior`,
cc:`每天都在消耗意志力。¦Willpower drains every day.`,cr:`讓好的行為更容易，壞的行為更麻煩。¦Make good behavior easier and bad behavior harder.`,cl:`設計條件，勝過控制人。¦Design conditions > control people.`,
dx:`環境現在在鼓勵什麼行為？¦What behavior is the environment encouraging now?|壞的行為是不是伸手就能做？¦Is the bad behavior within arm's reach?|好的行為是不是很麻煩？¦Is the good behavior a hassle?|如果不靠意志力，我可以改哪個條件？¦Without willpower, which condition could I change?|哪一個預設可以重新設定？¦Which default can be reset?`,dr:`環境和目標相反時，先設計條件。¦Environment opposes the goal → design conditions first.`,
q:`誘惑通常比對的行為更容易拿到。¦Temptation is usually easier to reach than the right behavior.|我常要求自己靠自制力對抗環境。¦I often demand self-control to resist my environment.|如果只改環境、不靠意志力，問題可能會改善很多。¦Changing only the environment, not willpower, could improve things a lot.`,qy:`設計條件。¦Design conditions.`,
ac:`移開一個壞的提示。¦Remove one bad cue.|增加一個好的提示。¦Add one good cue.|讓壞的行為多三個步驟。¦Add three steps to bad behavior.|讓好的行為少三個步驟。¦Remove three steps from good behavior.|修改預設。¦Change the default.`,
da:`每天改善一個小小的條件。¦Improve one small condition each day.`,sy:`每個月檢查一次環境。¦Do a monthly environment audit.`,kp:`對的行為需要的意志力越來越少。¦Right behavior needs less willpower.`,al:`設計條件，勝過控制人。¦Design conditions > control people.`,
lk:`環境一直引發舊行為¦Environment keeps triggering old behavior`,core:`設計條件＋調整阻力¦Condition design + friction`,pr:`RP32 Condition Design`,fa:`移開一個壞提示¦Remove one bad cue`});

e({n:33,lv:4,en:`RISK`,zh:`風險錯誤¦Risk Error`,sub:`先確保還能走下去，再談走得多遠¦Make sure you can keep going before asking how far you'll go`,def:`風險，是不確定性乘上可能的損失。¦Risk is uncertainty × potential loss.`,pl:`只想著最好的結果，忘了問自己承不承受得起最壞的結果。¦Thinking only of the best outcome and forgetting whether you can survive the worst.`,
mi:`把所有的錢押在同一個地方¦Putting all your money in one place|沒有備援¦No backup|沒有安全墊¦No safety margin|以為「以前沒發生」就等於「以後不會發生」¦"It never happened" = "it never will"|只看平均報酬¦Looking only at average returns`,
co:`一次意外，就可能讓整個系統崩塌¦One accident can collapse the whole system`,
up:`不是避開所有風險，而是避開承受不起的毀滅。¦Not avoiding all risk — avoiding ruin you can't survive.`,
iq:`最壞的情況是什麼？¦What's the worst case?|我承受得起嗎？¦Can I bear it?|即使機率很低，損失是不是巨大？¦Even if unlikely, is the loss enormous?|我有備援嗎？¦Is there a backup?|我有安全墊嗎？¦Is there a safety margin?`,
ic:`一次低機率的事件，就可能造成無法回頭的傷害。¦One low-probability event can cause irreversible harm.`,
rp:`只想最好的結果，忘了自己能不能撐過最壞的結果。¦Thinking of the best case, forgetting whether you'd survive the worst.`,ri:`如果最壞的情況真的發生，我承受得起嗎？¦If the worst really happened, could I bear it?`,rc:`一次事件就可能摧毀整個系統。¦One event can destroy the whole system.`,
rm:`先避免毀滅¦Avoid ruin first|建立安全墊¦Build a safety margin|建立備援¦Build backups|分散承受不起的風險¦Diversify risks you can't bear|損失巨大的事，即使機率低也要照顧¦Manage high-loss events even if unlikely|別讓一次失敗摧毀整個系統¦Don't let one failure destroy the system`,rk:`先活下來，才有下一輪。¦Survive first; then there's a next round.`,
cs:`把全部存款投入單一投資¦Putting all savings into a single investment|開車從不想備用路線或時間¦Never planning alternate routes or time when driving|公司只有一個人知道核心密碼與流程¦Only one person knows the key passwords and processes|所有收入只有單一來源¦All income from a single source|重要的資料只有一份¦Only one copy of important data|因為十年沒出事，就以為永遠不會出事¦Ten years without trouble, so it will never happen`,
cc:`一個低機率的事件，可能摧毀整個系統。¦One low-probability event may destroy the whole system.`,cr:`避免毀滅＋備援＋分散＋安全墊。¦Avoid ruin + backup + diversification + safety margin.`,cl:`先確保還有下一局，再談這一局贏多少。¦Make sure there's a next round before asking how much this one wins.`,
dx:`最壞的情況是什麼？¦What's the worst case?|如果真的發生，我承受得起嗎？¦If it happened, could I bear it?|有沒有單一的失敗，會摧毀整個系統？¦Is there a single failure that could destroy the system?|我有備援和安全墊嗎？¦Do I have backups and a safety margin?|我是不是因為以前沒出事，就以為以後也不會？¦Am I assuming it won't happen because it hasn't yet?`,dr:`存在毀滅性風險時，優先處理，不必等它變得很可能。¦Ruin risk exists → deal with it first; don't wait for it to become likely.`,
q:`做決定時，我常想最好的結果，比較少想最壞的結果。¦When deciding, I think of the best case more than the worst.|我的某些重要系統沒有備援。¦Some of my important systems have no backup.|如果某件低機率的事發生，可能會造成我承受不起的損失。¦A low-probability event could cause me unbearable loss.`,qy:`先消除毀滅的風險，再追求好處。¦Remove ruin risk first, then pursue upside.`,
ac:`寫下最壞的情況。¦Write the worst case.|判斷自己承不承受得起。¦Judge whether you can bear it.|找出單一的失敗點。¦Find single points of failure.|建立備援。¦Build a backup.|增加安全墊。¦Add safety margin.|承受不起的風險，優先移除。¦Remove unbearable risks first.`,
da:`重大決定前，先問「我會不會因此出局？」¦Before major decisions, ask "Could this knock me out?"`,sy:`建立事前檢討與應變計畫。¦Build a pre-mortem and contingency plan.`,kp:`單一事件，無法摧毀整個系統。¦No single event can destroy the whole system.`,al:`先避免出局，再追求贏更多。¦Avoid being knocked out first; then aim to win more.`,
lk:`只想最好，沒想最壞¦Thinking best case, ignoring worst case`,core:`避免毀滅＋備援＋安全墊¦Avoid ruin + backup + margin`,pr:`RP33 Ruin Prevention`,fa:`寫下最壞的情況¦Write the worst case`});

e({n:34,lv:4,en:`GOAL`,zh:`目標錯誤¦Goal Error`,sub:`爬得再快，也要確定梯子靠對了牆¦However fast you climb, make sure the ladder is against the right wall`,def:`目標，是你想走向的未來樣子。¦A goal is the future state you want to move toward.`,pl:`很努力地爬，最後才發現梯子靠錯了牆。¦Climbing hard only to find the ladder was on the wrong wall.`,
mi:`目標是別人給的¦Goals given by others|一次設了十個目標¦Ten goals at once|只有結果，沒有過程¦Results but no process|達成了目標，卻犧牲了健康¦Reaching a goal while sacrificing health|把工具當成了目的¦Mistaking the tool for the purpose`,
co:`非常努力，心卻越來越空¦Working hard but feeling emptier|達標之後，甚至不知道下一步在哪¦After reaching it, not knowing what's next`,
up:`價值→目標→過程→回饋。¦Value → Goal → Process → Feedback.`,
iq:`這真的是我的目標嗎？¦Is this really my goal?|它在服務哪一個價值？¦Which value does it serve?|達成它的代價是什麼？¦What does achieving it cost?|會不會犧牲了更重要的東西？¦Will it sacrifice something more important?|如果沒有人知道我做到了，我還想做嗎？¦If no one knew I'd done it, would I still want to?`,
ic:`可能非常成功，卻不是自己真正想要的人生。¦Very successful, yet not the life you truly wanted.`,
rp:`很努力，但梯子可能靠錯了牆。¦Working hard, but the ladder may be on the wrong wall.`,ri:`如果沒有人知道，我還想完成它嗎？¦If no one knew, would I still want to finish it?`,rc:`成功之後，仍然覺得空。¦Still empty after success.`,
rm:`讓目標連回價值¦Link goals back to values|限制同時進行的目標數量¦Limit the number of simultaneous goals|設定過程的指標¦Set process metrics|檢查目標的副作用¦Check the goal's side effects|每一季重新校準¦Recalibrate every quarter|允許目標被更新或刪除¦Allow goals to be updated or deleted`,rk:`目標為生命服務，不要讓生命為目標服務。¦Goals serve life; don't let life serve goals.`,
cs:`為了第一名，犧牲了睡眠與健康¦Sacrificing sleep and health to be number one|為了賺更多錢，完全沒有生活¦Having no life in order to earn more|孩子選科系，只因為父母希望¦A child picks a major only because the parents want it|追求瘦到某個數字，身體反而變差¦Chasing a target weight while your body gets worse|經營社群只追粉絲數，忘了真正想服務誰¦Chasing follower counts and forgetting who you want to serve|完成了很多目標，卻不知道自己為什麼做¦Achieving many goals without knowing why`,
cc:`局部成功，整體失敗。¦Local success, overall failure.`,cr:`價值→目標→代價→過程→每季回顧。¦Value → goal → cost → process → quarterly review.`,cl:`別只問能不能達標，也問問這個標值不值得達。¦Don't just ask if you can reach the target; ask if it's worth reaching.`,
dx:`這個目標真的是我想要的嗎？¦Is this goal what I truly want?|它在服務哪個價值？¦Which value does it serve?|達成它需要犧牲什麼？¦What must be sacrificed to reach it?|達標之後，整體的生活會更好嗎？¦Will life overall be better afterwards?|如果沒有人知道我達標，我還想要嗎？¦If no one knew I'd reached it, would I still want it?`,dr:`目標和價值脫節時，重新校準目標。¦Goal disconnected from value → recalibrate the goal.`,
q:`我的某些目標，其實主要來自別人的期待。¦Some of my goals mainly come from others' expectations.|為了達標，我正在犧牲更重要的健康、關係或自由。¦To reach a goal, I'm sacrificing more important health, relationships or freedom.|如果沒有人知道我達標，我可能就不太想追這個目標。¦If no one knew I'd achieved it, I might not want this goal.`,qy:`讓目標重新連回價值。¦Reconnect the goal to your values.`,
ac:`寫下目標。¦Write the goal.|在下面寫「為什麼？」¦Write "Why?" beneath it.|連回你的價值。¦Link it to a value.|列出達標的代價。¦List the cost of reaching it.|檢查會不會傷害其他重要的領域。¦Check whether it harms other important areas.|必要時，刪掉這個目標。¦Delete the goal if necessary.`,
da:`今天的行動，至少服務一個真正的目標。¦Today's actions serve at least one real goal.`,sy:`每季回顧一次目標。¦Hold a quarterly goal review.`,kp:`局部的成功，不再破壞整體的生活。¦Local success no longer damages the whole of life.`,al:`目標是工具，不是主人。¦A goal is a tool, not a master.`,
lk:`努力爬錯了梯子¦Climbing the wrong ladder`,core:`目標→價值→代價校準¦Goal → value → cost calibration`,pr:`RP34 Goal Alignment`,fa:`問「我為什麼要它？」¦Ask "Why do I want it?"`});

e({n:35,lv:5,en:`FEEDBACK`,zh:`回饋錯誤¦Feedback Error`,sub:`生活早已回答了你，只是還沒被讀懂¦Life has already answered you; the answer just hasn't been read`,def:`回饋，是真實回傳給你的修正訊號。¦Feedback is the correction signal reality sends back.`,pl:`結果已經告訴你答案，你卻還沒讀。¦The result already told you the answer, but you haven't read it.`,
mi:`產品一直賣不好，仍然不調整¦Products keep not selling and nothing is adjusted|考試一直錯同一類題，仍只是訂正答案¦Missing the same question type and only correcting answers|身體一直不舒服，卻沒有重新評估¦Feeling unwell for a long time without reassessment|別人反覆提醒同一個問題，卻沒有處理¦Others repeat the same concern and nothing is done|從來沒有比較過改變前後¦Never comparing before and after`,
co:`同一個錯誤，一直在繳學費¦Paying tuition for the same error again and again|經驗增加了，智慧卻沒有增加¦Experience grows but wisdom doesn't`,
up:`結果→錯誤訊號→診斷。¦Outcome → error signal → diagnosis.`,
iq:`結果和預期一樣嗎？¦Did the result match expectations?|真實正在告訴我什麼？¦What is reality telling me?|同樣的回饋出現幾次了？¦How many times has the same feedback appeared?|我有記錄改變前後嗎？¦Have I recorded before and after?|什麼證據，會讓我願意改變？¦What evidence would make me willing to change?`,
ic:`同一堂課，一直在繳學費。¦Paying tuition for the same lesson again and again.`,
rp:`真實已經開口了，卻還沒被讀懂。¦Reality has spoken but hasn't been read.`,ri:`結果正在告訴我什麼？¦What is the result telling me?`,rc:`同一堂課，一再繳學費。¦Paying for the same lesson repeatedly.`,
rm:`事前寫下預期¦Write the expected result beforehand|事後寫下實際¦Write the actual result afterwards|算出差距¦Calculate the gap|替錯誤分類¦Classify the error|固定回顧¦Review regularly|讓回饋直接連到下一個行動¦Connect feedback directly to the next action`,rk:`沒有回饋，就沒有真正的學習。¦Without feedback, there's no real learning.`,
cs:`同一類英文題連錯十次，仍然只抄答案¦Missing the same English question type ten times and still only copying answers|客人一再反映同一個問題，流程卻沒改¦Customers keep raising the same issue and the process never changes|每次旅行都超支，下一次還是照原本估¦Every trip goes over budget and the next estimate stays the same|每次熬夜隔天都很沒效率，仍覺得自己撐得住¦Every late night ruins the next day, yet you still think you can handle it|每次用同樣的方式和某人談都吵架，仍然照舊¦Every talk in the same style with someone ends in a fight, and nothing changes|APP 數據顯示某功能沒人用，仍不調整¦App data shows nobody uses a feature, and it isn't adjusted`,
cc:`真實已經給了答案，系統卻沒有學習。¦Reality gave the answer, but the system didn't learn.`,cr:`預期→實際→差距→錯誤類型→下一個行動。¦Expected → actual → gap → error type → next action.`,cl:`回饋不是批評，而是真實送來的更新資料。¦Feedback isn't criticism; it's update data sent by reality.`,
dx:`我事前預期的是什麼？¦What did I expect beforehand?|實際的結果是什麼？¦What actually happened?|差距在哪裡？¦Where is the gap?|這個差距是不是已經重複很多次？¦Has this gap repeated many times?|我根據回饋改了什麼？¦What did I change based on feedback?`,dr:`有回饋，行動卻沒變時，回饋的循環斷了。¦Feedback exists but action doesn't change → the feedback loop is broken.`,
q:`結果不如預期時，我常直接進入下一件事，很少回顧。¦When results disappoint, I usually move on without reviewing.|同樣的回饋出現了很多次，我的行動卻沒有明顯改變。¦The same feedback has appeared many times, but my actions haven't clearly changed.|我很少比較預期和實際的差別。¦I rarely compare expected and actual.`,qy:`把真實重新接回學習的循環。¦Reconnect reality to the learning loop.`,
ac:`寫下預期。¦Write the expected.|寫下實際。¦Write the actual.|寫下差距。¦Write the gap.|標出錯誤類型。¦Label the error type.|決定下一個行動。¦Decide the next action.`,
da:`每天回顧一個預測落差。¦Review one prediction error each day.`,sy:`建立屬於你的回饋儀表板。¦Build a feedback dashboard.`,kp:`同樣的錯誤，重複得越來越少。¦The same errors repeat less.`,al:`真實每天都在教，只看你有沒有在讀。¦Reality teaches every day; the question is whether you read it.`,
lk:`真實回答了卻沒讀¦Reality answered but it wasn't read`,core:`預期→實際→差距¦Expected → actual → gap`,pr:`RP35 Feedback Recovery`,fa:`寫下預期 vs 實際¦Write expected vs actual`});

e({n:36,lv:5,en:`UPDATE`,zh:`更新錯誤¦Update Error`,sub:`知道舊方法不再合適，就溫柔地讓它退場¦When you know an old way no longer fits, gently let it retire`,def:`更新，是根據新的證據，修改原本的地圖。¦Updating means revising your model based on new evidence.`,pl:`明明知道錯了，還是繼續用舊的方法。¦Knowing it's wrong and still using the old method.`,
mi:`知道方法沒效，仍然繼續¦Continuing a method you know doesn't work|因為面子不改¦Not changing to save face|因為投入很多不改¦Not changing because you've invested so much|失敗一次，又一口氣改過頭¦Overcorrecting after one failure|更新之後，沒有再測¦Not retesting after updating`,
co:`這是整個生命系統最關鍵的錯誤之一¦This is one of the most critical errors in the whole life system|因為其他錯誤只會錯一次¦Other errors happen once|更新錯誤，卻會讓同一個錯誤無限重播¦An update error replays the same error endlessly`,
up:`證據→更新→再測。¦Evidence → update → retest.`,
iq:`真實已經證明哪一張舊地圖不準？¦Which old model has reality proven inaccurate?|我為什麼還抓著它？¦Why am I still holding on to it?|是面子、害怕、習慣，還是捨不得已經投入的？¦Is it face, fear, habit or sunk cost?|新的地圖應該改成什麼？¦What should the new model be?|更新之後，要怎麼再測？¦How will I retest after updating?`,
ic:`其他錯誤可能只錯一次，更新錯誤會讓錯誤無限重播。¦Other errors may happen once; update errors replay endlessly.`,
rp:`知道錯了，卻還是不改。¦Knowing it's wrong but still not changing.`,ri:`什麼證據已經說明，舊地圖需要修正？¦What evidence shows the old model needs revising?`,rc:`同樣的錯誤，無限循環。¦The same error loops forever.`,
rm:`清楚寫下舊地圖¦Write the old model clearly|寫下和它矛盾的證據¦Write the contradicting evidence|建立新的地圖¦Build the new model|不必全部推翻，只修改需要修改的部分¦Don't overturn everything; change only what's needed|設定再測¦Set a retest|保留版本紀錄¦Keep version history`,rk:`更新不是否定過去，而是讓地圖更清晰。¦Updating doesn't deny the past; it raises the model's resolution.`,
cs:`明知熬夜會讓隔天崩潰，還是每天重複¦Knowing late nights wreck the next day and repeating them anyway|明知某種讀書方法沒效，還是因為習慣繼續¦Knowing a study method doesn't work and continuing out of habit|市場已經改變，仍堅持十年前的賣法¦The market has changed and you stick to ten-year-old sales methods|孩子已經長大，父母仍用國中時的方式管¦The child has grown up, yet parents still control them like a middle schooler|關係模式一再失敗，仍期待下一次突然不同¦A relationship pattern keeps failing, yet you expect next time to be different|新的證據出現，卻因為面子拒絕改變¦New evidence appears, and you refuse to change to save face`,
cc:`同一個錯誤，無限循環。¦The same error in an endless loop.`,cr:`舊地圖→矛盾的證據→新地圖→再測。¦Old model → contradicting evidence → new model → retest.`,cl:`真正昂貴的不是犯錯，而是知道錯了還不更新。¦What's truly costly isn't making mistakes; it's knowing and not updating.`,
dx:`哪些證據已經說明舊地圖不夠準？¦What evidence shows the old model isn't accurate?|我是不是仍然在用它？¦Am I still using it?|我不更新，是證據不夠，還是面子、害怕、習慣、捨不得？¦Is it lack of evidence, or face, fear, habit, sunk cost?|新的地圖應該修改哪一部分？¦Which part of the new model should change?|我要怎麼再測新的地圖？¦How will I retest the new model?`,dr:`真實已經改變、地圖卻沒改變，就是更新錯誤。¦Reality changed + model unchanged → update error.`,
q:`我知道某個方法沒效，卻因為習慣仍繼續用。¦I know a method doesn't work but keep using it out of habit.|新的證據出現時，我有時會因為面子、害怕或投入太多而不願改。¦When new evidence appears, I sometimes won't change because of face, fear or investment.|類似的問題一再出現，我的核心做法卻多年沒變。¦Similar problems keep recurring, yet my core approach hasn't changed in years.`,qy:`舊地圖→證據→新地圖→再測。¦Old model → evidence → new model → retest.`,
ac:`寫下舊的地圖。¦Write the old model.|列出矛盾的證據。¦List the contradicting evidence.|寫下新的地圖。¦Write the new model.|只修改需要修改的部分。¦Change only what needs changing.|設計再測。¦Design a retest.|保留版本紀錄。¦Keep version history.`,
da:`問問：「今天哪個想法被真實修正了？」¦Ask: "Which of my ideas did reality correct today?"`,sy:`建立地圖更新日誌。¦Keep a model update log.`,kp:`證據改變後，行為也跟著改變。¦Behavior changes when evidence changes.`,al:`更新不是推翻自己，而是讓自己看得更清楚。¦Updating isn't overturning yourself; it's raising your resolution.`,
lk:`知道不準，仍用舊方法¦Knowing it's inaccurate, still using the old way`,core:`舊地圖→證據→新地圖¦Old model → evidence → new model`,pr:`RP36 Model Update`,fa:`寫下舊地圖／新地圖¦Write old / new model`});

e({n:37,lv:5,en:`META-LEARNING`,zh:`後設學習錯誤¦Meta-Learning Error`,sub:`別只學答案，也學學自己為什麼會錯¦Don't just learn the answer; learn why you got it wrong`,def:`後設學習，是學習「自己如何學習、犯錯與更新」。¦Meta-learning is learning how you learn, make mistakes and update.`,pl:`一直學答案，卻沒有學自己為什麼會錯。¦Always learning answers, never learning why you get them wrong.`,
mi:`錯題只訂正答案¦Only correcting answers|失敗了只怪運氣¦Blaming luck after failure|不知道自己常犯哪一種錯¦Not knowing which errors you commonly make|同樣的錯，換個場景繼續出現¦The same error reappearing in new settings|沒有整理出自己的錯誤模式¦No personal error pattern`,
co:`活了很多年，經驗很多，心裡的地圖卻沒有明顯升級¦Many years and much experience, yet the model hasn't clearly upgraded`,
up:`別只問「這次的答案是什麼？」，也問「我為什麼會想出這個錯的答案？」¦Don't only ask "What's the answer?"; ask "Why did I produce this wrong answer?"`,
iq:`我最近最常犯哪三種錯？¦What three errors have I made most recently?|它們有共同的觸發點嗎？¦Do they share a trigger?|是不是同一個模式，換了不同的場景出現？¦Is it the same pattern in different settings?|我的思考流程，哪一步最容易出錯？¦Which step of my thinking is most error-prone?|我要建立什麼新規則，避免它再重複？¦What new rule will prevent repetition?`,
ic:`經驗越來越多，智慧卻沒有同步增加。¦Experience grows; wisdom doesn't keep pace.`,
rp:`一直學答案，沒有研究自己怎麼犯錯。¦Learning answers without studying how you make mistakes.`,ri:`我最常在哪一步出錯？¦At which step do I most often go wrong?`,rc:`經驗增加，智慧沒有同步增加。¦Experience up, wisdom not in step.`,
rm:`建立個人的錯誤分類¦Build a personal error taxonomy|每週統計最常犯的三種錯¦Count your Top 3 errors weekly|找出共同的觸發點¦Find common triggers|找出跨領域的模式¦Find cross-domain patterns|建立「如果…就…」的決策規則¦Create If → Then decision rules|下週刻意再測¦Deliberately retest next week`,rk:`別只修這一次的錯，要修「製造錯誤的那台機器」。¦Don't just fix this error; fix the machine that produces errors.`,
cs:`每次考試都粗心，卻從沒分析是哪一種粗心¦Careless on every exam without ever analyzing which kind|每段關係都遇到類似的衝突，卻只覺得每次都是對方的問題¦Similar conflicts in every relationship, always blamed on the other person|每個月都超支，卻只說下個月會省¦Overspending monthly, always promising to save next month|每個專案都拖到最後，卻沒分析共同的觸發點¦Every project left to the last minute with no look at common triggers|每次焦慮都用滑手機逃開，卻沒看見模式¦Escaping every anxiety by scrolling without seeing the pattern|犯了很多錯，卻沒有建立自己的錯誤分類¦Many mistakes, no personal error taxonomy`,
cc:`經驗增加，地圖沒有升級。¦Experience grows; the model doesn't upgrade.`,cr:`每週三種錯→共同模式→觸發點→決策規則。¦Weekly Top 3 errors → common pattern → trigger → decision rule.`,cl:`別只修錯題，要修那個一直產生錯題的系統。¦Don't just fix wrong answers; fix the system that keeps producing them.`,
dx:`我最近最常犯哪三種錯？¦What three errors do I make most often?|它們有沒有共同的觸發點？¦Do they share a trigger?|同一個模式，是否在健康、工作、關係裡重複出現？¦Does the same pattern recur across health, work and relationships?|我的錯通常發生在資訊、地圖、決定、行動，還是更新？¦Do my errors happen at input, model, decision, action or update?|可以建立什麼「如果…就…」規則，阻止下一次重演？¦What If → Then rule would prevent a repeat?`,dr:`同樣的錯在不同場景重複時，要更新製造錯誤的源頭。¦Same-type errors across settings → update the error generator.`,
q:`我知道自己犯過很多錯，卻說不出最常犯哪三類。¦I know I've made many mistakes but can't name my top three types.|同一種問題，常換個場景再次出現。¦The same problem keeps reappearing in different settings.|解決問題之後，我通常沒有整理成下次可用的決策規則。¦After solving a problem, I rarely turn it into a reusable decision rule.`,qy:`開始建立個人的錯誤分類。¦Start building a personal error taxonomy.`,
ac:`列出最近十個錯誤。¦List your last 10 errors.|替它們分類。¦Classify them.|找出前三名。¦Find the top 3.|找出共同的觸發點。¦Find common triggers.|建立「如果…就…」規則。¦Create an If → Then rule.|下週再測。¦Retest next week.`,
da:`每天只記一個最有價值的錯誤。¦Record just one highest-value error daily.`,sy:`每週做一次錯誤回顧。¦Hold a weekly error review.`,kp:`不只少犯一次，而是整類的錯誤都減少。¦Not one fewer mistake, but a whole class of errors declines.`,al:`最深的學習，是明白自己為什麼會學錯。¦The highest learning is understanding why you learned wrong.`,
lk:`一直犯同類錯卻沒發現模式¦Repeating a class of errors without seeing the pattern`,core:`挖掘錯誤模式¦Error pattern mining`,pr:`RP37 Error Pattern Mining`,fa:`列出最近十個錯誤¦List your last 10 errors`});

e({n:38,lv:5,en:`WISDOM`,zh:`智慧錯誤¦Wisdom Error`,sub:`懂得很多道理，也要讓道理走進生活¦Knowing many truths, let them walk into your life`,def:`智慧，是能跨越情境，讓預測、決定與行動變得更好的地圖。¦Wisdom is a transferable model that improves prediction, decision and action across situations.`,pl:`知道很多道理，人生卻一直重複同樣的問題。¦Knowing many truths while life keeps repeating the same problems.`,
mi:`收藏金句，就以為是智慧¦Collecting quotes = wisdom|年紀大，就以為是智慧¦Being older = wisdom|讀很多書，就以為是智慧¦Reading many books = wisdom|懂哲學，就以為是智慧¦Understanding philosophy = wisdom|說得很漂亮，卻不能行動¦Speaking beautifully but unable to act|理論從來沒有接受真實的考驗¦Theories never tested by reality`,
co:`知識非常多¦Enormous knowledge|生活卻沒有改善¦Yet reality hasn't improved`,
up:`真正的智慧，要能解釋→預測→引導行動→再測→遷移到別處。¦True wisdom must explain → predict → guide action → retest → transfer.`,
iq:`這個道理能解釋真實嗎？¦Can this principle explain?|它能預測嗎？¦Can it predict?|能變成行動嗎？¦Can it become action?|能被真實反證嗎？¦Can reality falsify it?|換一個情境還能用嗎？¦Does it work in another context?|它真的讓預測更準了嗎？¦Has it really reduced prediction error?`,
ic:`懂得很多，生活卻沒有真正更新。¦Knowing a lot while life hasn't truly updated.`,
rp:`會講很多道理，生活卻沒有改善。¦Speaking many truths while reality doesn't improve.`,ri:`這份智慧，能不能讓下一次的預測更準？¦Can this wisdom make the next prediction more accurate?`,rc:`知識膨脹，能力停滯。¦Knowledge swells; ability stalls.`,
rm:`每個領悟都必須能解釋¦Every insight must explain|必須能提出預測¦Must make a prediction|必須能變成行動¦Must become action|必須接受再測¦Must accept retesting|必須允許被反證¦Must allow falsification|能跨情境遷移，才升級為智慧¦Only transfer across contexts earns the name wisdom`,rk:`沒有經過真實考驗的智慧，只是漂亮的假說。¦Wisdom untested by reality is just a beautiful hypothesis.`,
cs:`收藏了一千句金句，遇到問題還是不知道怎麼做¦A thousand saved quotes and still no idea what to do|讀了很多心理學，關係模式卻完全沒變¦Much psychology read, relationship patterns unchanged|懂很多健康知識，生活習慣沒有改變¦Much health knowledge, habits unchanged|會講投資的大道理，自己卻沒有風險管理¦Big investing talk with no risk management|懂系統思考，遇到問題仍然只怪某個人¦Understanding systems thinking yet still blaming one person|每天產生很多 AI 洞察，卻沒有任何再測¦Many AI insights every day and no retest at all`,
cc:`知識上升，預測的準確度卻沒有上升。¦Knowledge ↑, prediction accuracy not ↑.`,cr:`領悟必須通過解釋→預測→行動→再測→遷移。¦Insight must pass explain → predict → act → retest → transfer.`,cl:`不能讓下一次預測更好的智慧，暫時只能叫假說。¦Wisdom that can't improve the next prediction is still just a hypothesis.`,
dx:`這個領悟能解釋真實嗎？¦Can this insight explain reality?|它能提出下一次的預測嗎？¦Can it make a next prediction?|能變成具體的行動嗎？¦Can it become concrete action?|什麼證據可以證明它錯了？¦What evidence would prove it wrong?|再測之後，預測的誤差真的下降了嗎？¦After retesting, did prediction error really drop?`,dr:`不能預測、不能測試、不能更新時，它目前只是想法或假說。¦Can't predict, test or update → it's currently an idea or hypothesis.`,
q:`我懂很多道理，類似的生活問題卻仍一再出現。¦I know many principles, yet similar life problems keep recurring.|我的領悟，通常沒有變成可以測試的預測與行動。¦My insights rarely become testable predictions and actions.|我很少檢查一份「智慧」是否真的讓下一次結果更好。¦I rarely check whether a piece of "wisdom" actually improved the next result.`,qy:`智慧必須經過真實的考驗。¦Wisdom must pass a reality test.`,
ac:`選一句你相信的「智慧」。¦Choose one piece of "wisdom" you believe.|問問它能解釋什麼。¦Ask what it explains.|問問它預測什麼。¦Ask what it predicts.|把它變成行動。¦Turn it into action.|設定它可以被證明錯的條件。¦Set a falsification condition.|回到真實再測。¦Retest in reality.`,
da:`一個領悟，最多配一個實驗。¦Pair each insight with at most one experiment.`,sy:`只有跨情境再測成功，才升級成智慧。¦Only cross-context retest success upgrades it to a wisdom node.`,kp:`智慧讓預測的誤差下降。¦Wisdom reduces prediction error.`,al:`智慧不是聽起來很深，而是經得起真實。¦Wisdom isn't sounding deep; it's standing up to reality.`,
lk:`懂很多道理，生活沒改善¦Many principles, no real improvement`,core:`解釋→預測→行動→再測¦Explain → predict → act → retest`,pr:`RP38 Wisdom Validation`,fa:`把領悟變成預測¦Turn the insight into a prediction`});

e({n:39,lv:5,en:`LIFE DESIGN`,zh:`生命設計錯誤¦Life Design Error`,sub:`人生不必一直用預設值，你可以重新設計¦Life doesn't have to run on defaults; you can redesign it`,def:`生命設計，是主動安排你的時間、健康、關係、能力、金錢與選擇權。¦Life design is actively arranging your time, health, relationships, abilities, money and options.`,pl:`人生一直使用預設模式。¦Life keeps running in default mode.`,
mi:`大家做什麼，我就做什麼¦Doing whatever everyone else does|一直滿足別人的期待¦Always meeting others' expectations|從來沒問過自己想建造什麼人生¦Never asking what life you want to build|不喜歡現在的生活，卻沒有離開的路¦Disliking your life with no exit path|過去投入很多，所以不敢重新選擇¦Afraid to choose again because you've invested so much`,
co:`人生不是自己選出來的¦Life isn't chosen by you|而是一連串預設累積出來的¦It's accumulated from a series of defaults`,
up:`定期問問：如果今天重新設計，我還會選同一條路嗎？¦Ask regularly: if I redesigned today, would I choose the same path?`,
iq:`現在的人生，是我主動選的嗎？¦Did I actively choose this life?|還是一路「就這樣」長成的？¦Or did it just happen along the way?|如果今天重新選，我還會選一樣的生活嗎？¦If I chose again today, would I choose the same life?|哪些只是因為「已經投入很多」，所以不敢離開？¦What am I staying in only because I've invested so much?|哪一部分最需要重新設計？¦Which part most needs redesign?`,
ic:`人生最後，可能只是許多沒被重新檢查的預設累積起來。¦Life may end up as an accumulation of unexamined defaults.`,
rp:`人生一直用著預設的設定。¦Life keeps using default settings.`,ri:`如果今天重新選，我還會選現在這個版本嗎？¦If I chose again today, would I pick this version?`,rc:`很多年後才發現，自己一直在演別人的劇本。¦Years later you realize you've been living someone else's script.`,
rm:`每一季做一次生命回顧¦Do a quarterly life review|健康、關係、學習、工作、金錢、自由，分別評估¦Assess health, relationships, learning, work, money and freedom separately|找出最大的限制¦Find the biggest constraint|找出最大的槓桿¦Find the biggest leverage|放下已經過期的承諾¦Drop expired commitments|重新分配時間、金錢與注意力¦Reallocate time, money and attention|保留離開的選項¦Keep an exit option`,rk:`人生不是一次選對，而是一直保有重新設計的能力。¦Life isn't choosing right once; it's keeping the ability to redesign.`,
cs:`讀某個科系，只因為大家說很穩定¦Studying a major only because everyone says it's stable|工作二十年，從沒重新問自己還想不想做¦Twenty years in a job without asking if you still want it|所有時間都被工作和家人預約，沒有自己的空間¦Every hour booked by work and family, none for yourself|明明不喜歡現在的生活，卻因為「都這樣過了」繼續¦Disliking your life but continuing because "that's how it's been"|生活成本越來越高，離開工作的自由越來越少¦Rising living costs shrinking your freedom to leave work|每天解決別人的需要，卻從沒設計自己的下一階段¦Meeting others' needs daily without ever designing your own next chapter`,
cc:`預設累積成了命運。¦Defaults accumulate into destiny.`,cr:`每季回顧→限制→槓桿→重新分配資源→保留離開的選項。¦Quarterly review → constraint → leverage → reallocation → exit option.`,cl:`自由不是一次選對，而是永遠保有重新選擇的能力。¦Freedom isn't choosing right once; it's always keeping the ability to choose again.`,
dx:`現在的生活，有多少是我主動選的？¦How much of my life did I actively choose?|有多少只是習慣、責任或預設的延續？¦How much is habit, duty or default?|如果今天重新開始，我還會選一樣的安排嗎？¦Starting over today, would I choose the same setup?|時間、金錢、注意力，是否流向我真正想建造的人生？¦Do time, money and attention flow toward the life I want to build?|我目前還保有離開與重新選擇的能力嗎？¦Do I still have an exit option and the ability to choose again?`,dr:`預設的比例太高時，需要重新設計人生。¦Too much default → a life redesign is needed.`,
q:`目前很多生活安排，只是因為「一直以來都這樣」。¦Much of my life is arranged the way it is only because "it's always been this way."|我很少重新檢查時間、工作、關係與金錢，是否仍適合現在的自己。¦I rarely re-check whether my time, work, relationships and money still fit who I am now.|即使現在不滿意，我也常因為投入太久而不敢重新選擇。¦Even when unsatisfied, I'm afraid to choose again because I've invested so long.`,qy:`啟動生命回顧與資源重新分配。¦Start a life review and resource reallocation.`,
ac:`把生命分成健康／自己／家庭／關係／學習／工作／金錢／自由。¦Divide life into health / self / family / relationships / learning / work / money / freedom.|每個領域打 0～10 分。¦Score each area 0–10.|找出最大的限制。¦Find the biggest constraint.|找出最有槓桿的一點。¦Find the highest leverage point.|重新分配時間、金錢與注意力。¦Reallocate time, money and attention.|保留離開的選項。¦Keep an exit option.`,
da:`每天至少做一件增加未來選擇的事。¦Do at least one thing daily that adds future options.`,sy:`每季做一次生命回顧。¦Hold a quarterly life review.`,kp:`人生的預設比例下降，主動選擇的比例上升。¦Default share of life ↓, active choice ↑.`,al:`別等人生壞掉了，才重新設計。¦Don't wait for life to break before redesigning it.`,
lk:`人生一直用預設模式¦Life on default mode`,core:`生命回顧＋重新分配資源¦Life review + reallocation`,pr:`RP39 Life Redesign`,fa:`八個領域打 0～10 分¦Score 8 areas 0–10`});

e({n:40,lv:5,en:`MEANING`,zh:`意義錯誤¦Meaning Error`,sub:`你的價值，不必等外面的世界來批准¦Your worth doesn't need the outside world's approval`,def:`意義，是你如何把經驗放進更大的生命脈絡裡。¦Meaning is how you place experience within a larger life context.`,pl:`以為人生值不值得，一定要由外面來告訴我。¦Believing that whether life is worthwhile must be decided from outside.`,
mi:`成功了才有價值¦Only success gives worth|有人愛才有價值¦Only being loved gives worth|工作沒了，人生就沒有意義¦No job = no meaning|孩子離家，自己就沒有角色了¦Children leave home = no role left|痛苦，就等於人生沒有意義¦Pain = life is meaningless`,
co:`外在的角色一改變，整個自我就容易失去方向¦When an outer role changes, the whole self easily loses direction`,
up:`意義不是一次找到的答案，而是可以一直重新建構的地圖。¦Meaning isn't found once; it's a model you can keep rebuilding.`,
iq:`如果失去現在的角色，我還知道自己是誰嗎？¦If I lost my current role, would I still know who I am?|如果沒有人稱讚，我還覺得這件事值得嗎？¦Without praise, would this still feel worthwhile?|我是不是把成功直接等於意義？¦Am I equating success with meaning?|痛苦一定代表這段經驗沒有價值嗎？¦Does pain necessarily mean this experience has no value?|現在的意義地圖，是不是需要更新了？¦Does my current meaning model need updating?`,
ic:`工作、關係、身份一改變，整個生命方向也跟著崩塌。¦When work, relationships or identity change, life's direction collapses too.`,
rp:`把生命的價值，完全交給角色、成功或別人的認同。¦Handing your life's worth entirely to roles, success or others' approval.`,ri:`如果這個角色消失了，我還剩下什麼？¦If this role disappeared, what would remain?`,rc:`外在的結構一變，自我也跟著崩塌。¦When outer structures change, the self collapses with them.`,
rm:`意義不要綁在單一的角色上¦Don't tie meaning to a single role|建立多個來源的價值感¦Build multiple sources of worth|把痛苦當成資料，而不是自動判定沒有意義¦Treat pain as data, not automatic proof of meaninglessness|允許舊的意義過期¦Allow old meanings to expire|重新問：現在的我，願意為什麼付出？¦Ask again: what am I willing to serve now?|讓意義連回行動，而不只停在哲學¦Connect meaning to action, not just philosophy`,rk:`意義不是找到一次就固定，而是可以一直生長。¦Meaning isn't fixed once found; it can keep growing.`,
cs:`退休之後，覺得自己沒有用了¦Feeling useless after retiring|孩子離家後，不知道自己還剩下什麼¦Not knowing what's left after the children leave|失去工作，就覺得人生沒有價值¦Losing a job and feeling life has no worth|沒有人稱讚，就覺得事情不值得做¦Feeling nothing is worth doing without praise|一段關係結束，就覺得過去全都沒有意義¦Deciding the past was meaningless when a relationship ends|遇到痛苦，就認定生命走錯了路¦Concluding life went wrong when pain arrives`,
cc:`單一的角色崩塌，整個身份與意義也一起崩塌。¦One role collapses, and identity and meaning collapse with it.`,cr:`多來源的意義＋把角色和自己分開＋重新長出價值與行動。¦Multi-source meaning + separate role from self + regenerate values and action.`,cl:`意義不是固定的答案，而是生命可以一直重新建構的地圖。¦Meaning isn't a fixed answer; it's a model life can keep rebuilding.`,
dx:`我的價值感，是不是過度綁在某一個角色上？¦Is my sense of worth overly tied to one role?|如果工作、關係、成績或身份消失，我還知道自己重視什麼嗎？¦If work, relationships, grades or identity vanished, would I still know what I value?|我是不是把「現在很痛」直接等於「人生沒有意義」？¦Am I equating "it hurts now" with "life is meaningless"?|舊的意義，是不是已經不適合現在的生命階段？¦Does the old meaning no longer fit this stage of life?|現在的我，願意把生命投入在什麼值得的事上？¦What worthwhile thing am I willing to invest my life in now?`,dr:`意義只有單一支柱時，增加更多來源，也保留更新的彈性。¦Meaning on a single pillar → add more sources and keep it updatable.`,
q:`我的自我價值，高度依賴某個角色、成績、工作、關係或別人的認同。¦My self-worth depends heavily on a role, grades, work, a relationship or others' approval.|失去重要的角色時，我容易覺得自己整個人沒有價值。¦When I lose an important role, I tend to feel entirely worthless.|我很少重新想想「在現在這個生命階段，什麼值得我投入？」¦I rarely reconsider "What is worth my investment at this stage of life?"`,qy:`重新建立多個來源的意義。¦Rebuild meaning from multiple sources.`,
ac:`寫下目前最重要的三個角色。¦Write your three most important current roles.|問問：「如果角色消失，我仍然重視什麼？」¦Ask: "If the role disappeared, what would I still value?"|建立多個來源的意義。¦Build multi-source meaning.|把意義變成今天可以做的行動。¦Turn meaning into an action you can take today.|允許不同的生命階段，重新定義意義。¦Allow different life stages to redefine meaning.`,
da:`記下一件「今天很值得」的小事。¦Record one small thing that made today worthwhile.`,sy:`每年重新寫一次你的生命意義宣言。¦Rewrite your life meaning statement once a year.`,kp:`一個角色改變，不再摧毀整個自己。¦One role changing no longer destroys the whole self.`,al:`意義不是固定的答案，而是可以一直生成的方向。¦Meaning isn't a fixed answer; it's a direction you can keep generating.`,
lk:`價值綁死在單一角色或成就上¦Worth tied to one role or achievement`,core:`多來源的意義＋重新生成¦Multi-source meaning + regeneration`,pr:`RP40 Meaning Reconstruction`,fa:`問「角色之外，我重視什麼？」¦Ask "Beyond my roles, what do I value?"`});

const R=[];function r(n,g,t,b){R.push({n,g,t,b:b.trim()})}
const G={心智:`心智¦Mind`,行動:`行動¦Action`,學習:`學習¦Learning`,資訊:`資訊¦Information`,工作金錢:`工作金錢¦Work & Money`,身體:`身體¦Body`,關係:`關係¦Relationships`,信念:`信念¦Beliefs`,過去:`過去¦The Past`,商業教育:`商業教育¦Business & Education`,決策:`決策¦Decisions`,生命:`生命¦Life`};
r(1,G.心智,`思考正則化¦Regularizing Thought`,`
-我一定是對的。¦I must be right.
+我目前是這樣認為的。¦This is what I currently think.
-事情就是這樣。¦That's just how it is.
+這是我此刻的解釋。¦This is my current explanation.
-只有一個原因。¦There is only one cause.
+至少再想出三個可能的原因。¦Come up with at least three possible causes.
-我已經想通了。¦I've figured it all out.
+什麼證據會讓我願意改變想法？¦What evidence would change my mind?
-大家都知道。¦Everyone knows that.
+證據在哪裡呢？¦Where's the evidence?
-以前是這樣，以後也會這樣。¦It was this way before, so it always will be.
+環境的條件，是不是已經改變了？¦Have the conditions changed?
目標：別讓一張地圖把你鎖住。¦Goal: prevent model lock-in.`);
r(2,G.心智,`情緒正則化¦Regularizing Emotion`,`
-我現在很難過，所以人生很糟。¦I'm sad right now, so life is terrible.
+情緒是一種狀態，不是真實的全部。¦Emotion is a state, not the whole of reality.
-焦慮出現了，就代表有危險。¦Anxiety means danger.
+焦慮先是一個提醒，這個訊號還需要被讀懂。¦Anxiety is first a threat signal that still needs reading.
-生氣了，就是對方錯。¦If I'm angry, they're wrong.
+憤怒也許在提醒界線，但因果仍要慢慢檢查。¦Anger may signal a boundary, but causality still needs checking.
-我不能有負面情緒。¦I'm not allowed negative emotions.
+情緒不必全部消滅，它需要的是被溫柔地調節。¦Emotions needn't be eliminated; they need gentle regulation.
目標：讓情緒提供資訊，但不獨佔做決定的權力。¦Goal: emotion informs, but doesn't monopolize decisions.`);
r(3,G.心智,`自我認同正則化¦Regularizing Identity`,`
-我就是笨。¦I'm just stupid.
+我目前還有某個技能在練習中。¦One of my skills is still developing.
-我就是沒自信。¦I just have no confidence.
+我在某些情境裡，容易失去自信。¦In certain contexts I tend to lose confidence.
-我就是拖延的人。¦I'm a procrastinator.
+有些任務，會讓我比較難開始。¦Some tasks raise my starting resistance.
-我天生不會英文。¦I was born bad at English.
+先看看是單字、句法、閱讀，還是提取，哪一塊比較弱。¦First find which node is weak: vocabulary, syntax, reading or retrieval.
+核心：把身份拆成「狀態 × 技能 × 情境」。¦Core: break identity into state × skill × context.
別讓一次的結果，變成對你人格的判決。¦Don't let one outcome become a verdict on who you are.`);
r(4,G.心智,`自信正則化¦Regularizing Confidence`,`
-太低：我一定不行。¦Too low: I definitely can't.
+先做一個小實驗，替自己拿到一點證據。¦Run a small experiment to get some evidence.
-太高：我一定會成功。¦Too high: I'll definitely succeed.
+事先想想：如果失敗了，最可能是怎麼失敗的？¦Pre-mortem: if it failed, how would it most likely fail?
+健康的自信：我不保證成功，但我相信自己能面對回饋。¦Healthy confidence: I can't guarantee success, but I trust myself to handle feedback.
真正穩定的自信，不是「我永遠是對的」。¦Truly stable confidence isn't "I'm always right."
而是「即使錯了，我也能更新」。¦It's "even when I'm wrong, I can update."`);
r(5,G.心智,`焦慮正則化¦Regularizing Anxiety`,`
-不停地想著最壞的結果。¦Constantly imagining the worst.
+把「機率」和「影響」分開來看。¦Separate probability from impact.
輕輕問自己：這件事發生的機率有多高？¦Ask gently: how likely is this?
真的發生了，會有多嚴重？¦How serious would it be if it happened?
哪些是我可以掌握的？¦What can I control?
下一個最小的行動是什麼？¦What's the next smallest action?
焦慮容易把「可能」放大成「一定」。¦Anxiety turns "possible" into "probable."
正則化，就是把「可能」溫柔地放回機率的世界。¦Regularization gently returns "possible" to the world of probability.`);
r(6,G.心智,`完美主義正則化¦Regularizing Perfectionism`,`
-要 100 分才能發表。¦It must be 100% before I publish.
結果：永遠得不到回饋。¦Result: never getting any feedback.
+80 分的初版→交給真實→再更新。¦An 80% prototype → reality → update.
-我不能犯錯。¦I can't make mistakes.
+給自己一點「允許犯錯的額度」。¦Give yourself an error budget.
-第一次就要做到最好。¦It has to be perfect the first time.
+第一版的任務，只是替第二版收集需要的資訊。¦Version 1's job is only to gather what Version 2 needs.
+公式：反覆嘗試＞追求完美。¦Formula: iteration > perfection.`);
r(7,G.行動,`拖延正則化¦Regularizing Procrastination`,`
-任務太大了。¦The task is too big.
+把它拆成 5 分鐘就能做的一小步。¦Break it into a 5-minute step.
-一定要有動力才能開始。¦I need motivation to start.
+先開始，動力會隨後而來。¦Start first; motivation follows.
-一想就想到「完成」。¦I only think about finishing.
+只問：「下一個行動是什麼？」¦Only ask: "What's the next action?"
降低開始的門檻。¦Lower the activation energy.
讓行動重新流動起來。¦Let action flow again.`);
r(8,G.行動,`努力正則化¦Regularizing Effort`,`
-越努力越好。¦The harder the better.
