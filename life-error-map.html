e({n:1,lv:1,en:`INPUT`,zh:`輸入錯誤¦Input Error`,sub:`起點的資訊歪了，路就會跟著歪¦When the information at the start is off, the whole road bends with it`,def:``,
pl:`不是你想錯了，而是一開始放進心裡的資訊，本來就缺了一角。¦You didn't think wrong — what you took in at the very beginning was already incomplete or untrue.`,
mi:`只聽了一個人的故事，就以為看見了全部¦Listening to only one person's side|讀了一篇文章，就把它當成真理¦Believing a single article|把短影音的片刻，當成完整的知識¦Treating short videos as real knowledge|捧著過期的資料，走今天的路¦Still using outdated information|只讓自己喜歡的聲音進來¦Only taking in information you like|沒有回到源頭看一看¦Never checking the original source|把別人的人生經驗，直接穿在自己身上¦Applying other people's experience directly to yourself|把少數的例子，當成世界的規律¦Treating a few cases as a universal rule|因為大家都在說，就以為是真的¦Believing something because it's trending|AI 說得完整又好聽，就放下了查證¦Trusting AI just because it sounds complete`,
co:`資訊一歪，判斷就跟著歪¦Wrong data → wrong judgment|放進去的是雜訊，長出來的也很難是智慧¦Garbage in, garbage out|在健康上，可能選錯了照顧自己的方法¦In health, you may choose the wrong method|在投資上，可能看錯了風險¦In investing, you may misjudge the risk|在關係裡，可能誤會了一個人¦In relationships, you may misunderstand someone|在學習上，可能朝錯的方向用力¦In learning, you may work hard in the wrong direction|在 AI 上，一個錯誤可能被放大成千百個¦With AI, one wrong answer can be amplified many times`,
up:`先溫柔地問自己：我的資料從哪裡來？還少了哪一塊？¦Ask first: where did my information come from, and what is still missing?`,
iq:`在下判斷之前，我真的看夠了嗎？¦Do I really have enough information before judging?|這些資訊的來處，值得我信任嗎？¦Is my source reliable?|它會不會已經過期了？¦Could the information be outdated?|我是不是只挑了讓自己安心的那一邊？¦Am I only reading what supports my view?|我是不是把別人的故事，直接當成自己的答案？¦Am I applying someone else's case directly to myself?|如果起點就錯了，後面的一切會不會都跟著偏？¦If the original information is wrong, will every judgment after it be wrong too?`,
ic:`資訊偏了，想法就偏；想法偏了，選擇和行動也一起偏。¦Wrong data → wrong model → wrong decision → wrong action.`,
rp:`一開始放進來的資訊，還不夠好。¦The information you started with wasn't good enough.`,ri:`我手上的資訊，足夠、可靠、又是最新的嗎？¦Is my information sufficient, reliable and up to date?`,rc:`雜訊進來，雜訊出去，後面的判斷都會悄悄偏掉。¦Garbage in, garbage out — every later judgment quietly drifts.`,
rm:`重要的決定，至少聽聽 2～3 個彼此獨立的聲音¦For major decisions, find at least 2–3 independent sources|分清楚哪些是事實、哪些是推測、哪些只是意見¦Separate facts, guesses and opinions|願意多走幾步，回到最原始的資料¦Go back to the original source|重要的資訊，記得看一眼日期¦Check the date on important information|刻意找找看，和自己想法相反的證據¦Deliberately look for opposing evidence|一個人的故事很珍貴，但它不是所有人的規律¦One person's case is not a general rule|AI 給的答案，也需要被交叉驗證¦Cross-check anything AI tells you`,rk:`先把入口擦乾淨，心才看得清楚。¦Correct the input first, then start thinking.`,
cs:`朋友傳來「這個超有效」，沒查來源就買了¦A friend says "this works great" and you buy it without checking|看了一支健康短影音，隔天就改了整個飲食¦One health short video and you change your whole diet|只聽同學說考試範圍，沒有確認老師的公告¦A student trusts classmates about the exam scope instead of the teacher's notice|看到幾則負評，就認定那家店一定很糟¦A few bad reviews and you decide the shop must be terrible|AI 回答得很完整，就直接拿去教學生¦AI's answer looks complete, so you teach it without verifying|只聽伴侶的一句話，就以為知道了整件事¦One sentence from your partner and you assume you know the whole story`,
cc:`起點一偏，預測、決定、行動會一起走偏。¦Wrong input skews prediction, decision and action together.`,cr:`多聽幾個聲音、回到源頭、看看日期、找找反例、重要的事交叉確認。¦Multiple sources + originals + date check + opposing evidence + cross-verification.`,cl:`入口錯了，後面再聰明，也可能只是白忙一場。¦If the entrance is wrong, all the cleverness after it may be wasted.`,
dx:`做這個判斷時，我手上的資訊其實很少嗎？¦Do I actually have very little information for this judgment?|我的資訊是不是只來自一個人、一篇文章、一支影片或一次 AI 回答？¦Does my information come from just one person, article, video or AI answer?|我有確認過來源、日期和適用的對象嗎？¦Have I checked the source, date and who it applies to?|我有沒有刻意找過和自己不同的看法？¦Have I deliberately looked for views different from mine?|如果現在的資訊有一半是錯的，我的結論會不會完全不同？¦If half of my information were wrong, would my conclusion change completely?`,dr:`「是」越多，越值得先慢下來，把資訊補齊再決定。¦Many YESes → hold the decision and fill in the input first.`,
q:`我常常在還沒看清全貌時，就急著下結論。¦I often draw conclusions before the information is complete.|我常只聽一個來源，沒有再多問幾個地方。¦I often rely on a single source without cross-checking.|我很少停下來確認資訊的來源、日期與適用情境。¦I rarely check the source, date and context of information.`,qy:`先把資訊補齊，決定可以晚一點再做。¦Fill in the data first; the decision can wait.`,
ac:`先別急著下結論，寫下「我確定知道的／我還不知道的」。¦Stop concluding; write down "what I know / what I don't know".|重要的資訊，找 2～3 個獨立的來源。¦Find 2–3 independent sources for important information.|多走一步，去看原始資料，而不只是別人的轉述。¦Read the original, not just someone's retelling.|看看日期、對象、情境，確認它適不適合你。¦Check the date, audience, context and scope.|刻意找找和自己結論相反的證據。¦Deliberately search for evidence against your conclusion.`,
da:`每天挑一則重要資訊，溫柔地查一查它的來處。¦Each day, source-check one important piece of information.`,sy:`慢慢建立一份「我信任的來源清單」和查證的小習慣。¦Build a trusted-source list and a verification routine.`,kp:`走進你決定裡的錯誤資訊，越來越少。¦Fewer wrong facts make it into your decisions.`,al:`先把入口洗乾淨，再讓心去思考。¦Clean the input first, then let the mind do the work.`,
lk:`資訊還不夠、來源不可靠，就急著下結論¦Concluding with too little or unreliable data`,core:`多方來源＋回到源頭＋尋找反證¦Multiple sources + originals + counter-evidence`,pr:`RP01 Source Verification`,fa:`先列出「我知道的／我不知道的」¦List "known / unknown" first`});

e({n:2,lv:1,en:`ATTENTION`,zh:`注意力錯誤¦Attention Error`,sub:`你的目光，一直停在不重要的地方¦Your eyes keep resting on what doesn't matter`,def:`注意力，是你把有限的心力放在哪裡。¦Attention is where your brain places its limited resources right now.`,
pl:`日子很滿，可是你一直凝視著那些不重要的小事。¦So much is happening, yet you keep staring at the things that matter least.`,
mi:`一直被手機通知牽著走¦Constantly checking phone notifications|只在意別人怎麼看自己¦Only caring how others see you|孩子只看分數，沒看見錯題裡的禮物¦Students watching scores, not the mistakes|減重只盯著體重，忘了整個生活¦Watching weight instead of long-term lifestyle|做生意只看按讚，沒看成交與回購¦Watching likes, not sales and repeat buyers|關係裡只記得一句難聽的話，忘了整段溫柔¦Remembering one harsh sentence and forgetting the whole relationship|每天忙著緊急的小事，重要的事一直沒開始¦Handling urgent small things while the important thing waits|一直盯著自己的缺點，看不見已經擁有的能力¦Focusing on your flaws and missing the strengths you already have`,
co:`你看向哪裡，生活就被哪裡填滿¦Wherever attention goes, your reality fills up with it|最後很忙，卻沒有真的長大¦Busy, but not really progressing|小小的問題被放得很大¦Small problems get magnified|真正重要的事，反而被錯過了¦The real big problem goes unseen`,
up:`每天輕輕問自己：現在，最值得我注視的是什麼？¦Ask every day: what signal deserves my attention most right now?`,
iq:`我此刻在意的，真的是最重要的嗎？¦Is what I'm focused on really the most important thing?|我是不是被手機、訊息、情緒或別人的反應帶走了？¦Am I being pulled away by my phone, messages, emotions or other people's reactions?|有沒有更重要、卻很安靜的訊號，被我忽略了？¦Is a more important but quieter signal being ignored?|我是不是一直盯著問題，卻忘了看資源與出路？¦Am I staring at the problem and forgetting resources and solutions?|如果不再注意這件事，真正重要的會不會浮現出來？¦If I stopped watching this, would what truly matters surface?`,
ic:`很忙、很累，核心的問題卻還在原地。¦Busy and tired, yet the core problem hasn't improved.`,
rp:`你的心，一直看向錯的方向。¦The mind keeps looking in the wrong place.`,ri:`此刻佔據我心思的，真的是最重要的嗎？¦Is what occupies my attention right now really the most important?`,rc:`很忙、很累，真正的問題一步也沒動。¦Busy and tired, while the real issue hasn't moved.`,
rm:`每天只選三件最重要的事¦Set only a Top 3 each day|關掉不必要的通知，還自己一點安靜¦Turn off non-essential notifications|先做最有槓桿、最能改變局面的事¦Do the highest-leverage task first|留一段沒有手機的時光¦Keep a fixed phone-free time|把「緊急」和「重要」分開來看¦Separate urgent from important|每天問一次：我是不是正在解錯題？¦Ask daily: am I solving the wrong problem?|把注意力當成珍貴的資產來分配¦Allocate attention as a scarce asset`,rk:`不是看得更多，而是看向對的地方。¦Not seeing more, but seeing the right place.`,
cs:`孩子考了 80 分，眼裡只剩被扣掉的 20 分¦A child scores 80 and all you see is the missing 20|一天回了一百則 LINE，重要的工作一件也沒做¦A hundred LINE replies and the important work untouched|減重時一天量五次體重，卻不照顧睡眠與飲食¦Weighing yourself five times a day while ignoring sleep and food|經營社群只看按讚，忘了成交與回購¦Watching likes, not sales or repeat customers|伴侶做了好多事，你只記住一句不好聽的話¦Your partner did many things; you only remember one unkind remark|學生一直整理漂亮筆記，卻從沒真正測驗自己¦A student perfects pretty notes but never self-tests`,
cc:`心力被小小的雜訊吃掉，真正的卡點看不見。¦Attention is eaten by low-value signals and the real bottleneck stays hidden.`,cr:`每天三件事＋找出最有力量的那個訊號＋減少低價值的刺激。¦Daily Top 3 + find the highest-leverage signal + limit low-value stimuli.`,cl:`你一直凝視的地方，會慢慢長成你的世界。¦What you keep looking at slowly becomes your world.`,
dx:`我最近一直想的，真的是現在最重要的事嗎？¦Is what I keep thinking about really the most important thing now?|手機、訊息、別人的反應或小事，是不是佔去了我大半的心？¦Are phones, messages, reactions or small issues taking most of my attention?|真正影響結果的事，我反而很少碰？¦Do I rarely touch what affects the outcome most?|我是不是一直在處理緊急，卻沒有照顧重要？¦Do I keep handling the urgent but not the important?|每天都很忙，回頭卻說不出最重要的成果？¦Busy every day, yet unable to name the most important result?`,dr:`「是」越多，問題可能不是能力，而是心力放錯了地方。¦Many YESes → it may not be ability; attention is misallocated.`,
q:`我常把很多時間，花在其實不重要的事情上。¦I often spend a lot of time on things that aren't important.|手機、訊息和別人的反應，很容易把我拉走。¦Phones, messages and other people's reactions pull me away easily.|一天很忙，到了晚上卻說不出今天完成了什麼重要的事。¦Busy all day, yet by night I can't name one important thing I finished.`,qy:`把注意力重新溫柔地放回重要的地方。¦Reallocate your attention.`,
ac:`寫下今天唯一最重要的一件事。¦Write down the single most important thing today.|讓手機離開視線 25～50 分鐘。¦Keep the phone out of sight for 25–50 minutes.|關掉通知，只留下真正必要的。¦Turn off all but truly necessary notifications.|先完成最有槓桿的事，再回訊息。¦Finish the high-leverage task before messages.|每次被打斷就問：「這比我原本在做的更重要嗎？」¦When interrupted, ask: "Is this more important than what I was doing?"`,
da:`每天三件最重要的事。¦Daily Top 3.`,sy:`為自己建立一份「注意力預算」。¦Build an attention budget.`,kp:`重要的事完成得更多，被牽著走的時間更少。¦Important tasks completed ↑, reactive time ↓.`,al:`注意力流向哪裡，生命就長成什麼模樣。¦Where attention flows, life grows.`,
lk:`一直忙小事，重要的事沒動¦Busy with small things, important things untouched`,core:`重新分配注意力¦Reallocate attention`,pr:`RP02 Attention Reset`,fa:`寫下今天的三件事¦Write today's Top 3`});

e({n:3,lv:1,en:`PERCEPTION`,zh:`感知錯誤¦Perception Error`,sub:`你看見的，不一定就是真相¦What you see is not always the truth`,def:`感知，是大腦替眼前的事情翻譯出來的版本。¦Perception is how the brain interprets what happens in front of you.`,
pl:`你看到的不是整個世界，而是被心情與過去經驗濾過的那一版。¦You don't see the whole world — you see the version your brain has already processed.`,
mi:`他沒回訊息，就覺得他討厭我¦He didn't reply = he hates me|老師皺了一下眉，就覺得老師不喜歡我¦The teacher frowned = the teacher is unhappy with me|一次考差，就覺得自己英文很爛¦One bad test = my English is terrible|對方語氣重了，就覺得不被尊重¦A harsh tone = no respect|今天好累，就覺得人生出了問題¦I'm tired today = my life is going wrong|看見別人成功，就覺得自己很失敗¦Someone else succeeded = I'm a failure|第一印象不好，之後什麼都往壞處想¦A bad first impression colors everything after|只看得見和自己想法相符的部分¦Only noticing what fits what you already believe`,
co:`容易誤會¦Misunderstandings|容易焦慮¦Anxiety|容易看輕自己¦Low self-esteem|容易錯怪別人¦Blaming others wrongly|容易把一時的事，當成一輩子的結論¦Turning a temporary event into a life verdict`,
up:`把它分開寫：真正發生的事實是什麼？我替它加上的解讀又是什麼？¦Write separately: what is the FACT, and what is my INTERPRETATION?`,
iq:`這是事實，還是我的感覺？¦Is this a fact or my feeling?|換一個人來看，也會看見同樣的版本嗎？¦Would someone else see the same version?|我的情緒，是不是正在改變我看事情的角度？¦Is my emotion changing how I see things?|我是不是只看見符合原本想法的部分？¦Am I only seeing what matches what I already believe?|如果今天心情很好，我還會這樣解讀嗎？¦Would I read it the same way on a good day?`,
ic:`容易誤會、焦慮、自責，也容易錯怪別人。¦Misunderstanding, anxiety, self-blame and blaming others.`,
rp:`我看見的版本，不一定就是真實。¦The version I see isn't necessarily reality.`,ri:`這是事實，還是我的感受與解讀？¦Is this a fact, or my feeling and interpretation?`,rc:`誤會、焦慮、自責、錯怪別人。¦Misunderstanding, anxiety, self-blame, wrongly blaming others.`,
rm:`把「事實」和「心裡的故事」分開放¦Strictly separate FACT and STORY|只寫下攝影機拍得到的畫面¦Write only what a camera could record|問問看：旁觀的人可能怎麼看？¦Ask how a third person might see it|情緒很滿的時候，先不急著下結論¦Pause conclusions when emotions run high|至少想出三種不同的可能¦Come up with at least 3 alternative explanations|找找看有沒有反例¦Look for counterexamples`,rk:`我的版本，只是真實的其中一個版本。¦My version is only one version of reality.`,
cs:`朋友已讀不回，心想「他一定討厭我」¦A friend leaves you on read: "He must hate me."|老師皺眉，心想「老師一定對我不滿」¦The teacher frowns: "She must be unhappy with me."|學生上課低著頭，心想「他就是不尊重我」¦A student looks down in class: "He doesn't respect me."|伴侶今天話很少，心想「他是不是不愛我了？」¦Your partner is quiet today: "Doesn't he love me anymore?"|文章發出去沒人回，心想「大家都不喜歡我的內容」¦No replies to your post: "Nobody likes my content."|主管沒有稱讚，心想「我一定做得很差」¦Your boss didn't praise you: "My work must be bad."`,
cc:`把感受當成真相，多了很多不必要的擔心與衝突。¦Feelings mistaken for reality create needless anxiety and conflict.`,cr:`把事實和故事分開，再替它多找幾個解釋。¦Separate FACT and STORY, then find alternative explanations.`,cl:`你看見的是大腦的譯本，不一定是世界的原稿。¦You see the brain's version, not necessarily the world's original.`,
dx:`我現在描述的，是攝影機拍得到的事實嗎？¦Am I describing a fact a camera could capture?|裡面是不是已經混進「他故意」「他討厭我」「我很差」這樣的解讀？¦Have interpretations like "he did it on purpose," "he hates me," "I'm bad" slipped in?|另一個人看到同一件事，會不會有不同的結論？¦Could someone else reach a different conclusion from the same event?|如果我現在心情很好，還會這樣看嗎？¦Would I see it this way in a good mood?|我是不是把「我的感覺」當成了「外面的事實」？¦Am I treating my feeling as an external fact?`,dr:`「是」越多，越需要先把事實和故事分開。¦Many YESes → separate FACT and STORY first.`,
q:`我常把「我的感覺」直接當成「事情就是這樣」。¦I often treat my feeling as "that's just how it is."|別人一個表情、一個語氣，就讓我開始猜他的心。¦One expression or tone makes me guess what someone thinks.|心情不好的時候，我看到的一切也跟著變灰。¦When I feel low, everything I see turns negative too.`,qy:`先把事實和故事分開。¦Separate FACT from STORY first.`,
ac:`畫兩欄：事實｜故事。¦Draw two columns: FACT / STORY.|事實那欄，只寫攝影機拍得到的。¦FACT holds only what a camera could record.|劃掉「他故意」「他討厭我」「我一定不行」這些推論。¦Cross out inferences like "on purpose," "hates me," "I can't."|問問看，一個旁觀的人會怎麼看。¦Ask how a third person might see it.|情緒高的時候，把解讀放慢一點。¦Delay interpretation while emotions are high.`,
da:`每天挑一個讓你起伏的事件，練習分開事實與故事。¦Each day, practice FACT/STORY on one emotional event.`,sy:`養成「感覺不等於真相」的溫柔習慣。¦Build the habit that perception ≠ reality.`,kp:`誤會和過度反應，慢慢變少。¦Fewer misunderstandings and overreactions.`,al:`先看見發生了什麼，再決定它代表什麼。¦See what happened first, then decide what it means.`,
lk:`把感覺當成事實¦Treating feelings as facts`,core:`事實與故事分開¦Separate fact and story`,pr:`RP03 Fact–Story Separation`,fa:`畫「事實／解讀」兩欄¦Draw "fact / interpretation" columns`});

e({n:4,lv:1,en:`INTERPRETATION`,zh:`詮釋錯誤¦Interpretation Error`,sub:`事情沒有那麼重，是心裡的故事越說越沉¦The event wasn't that heavy — the story grew heavier each time you told it`,def:`詮釋，是你替一件事加上的意義。¦Interpretation is the meaning you add to an event.`,
pl:`事情只發生了一次，心卻開始寫一整部小說。¦It happened once, but the mind started writing a whole novel.`,
mi:`他拒絕我，就覺得自己沒有價值¦Rejected = I'm worthless|考試失敗，就覺得自己沒有能力¦Failed an exam = I'm incapable|婚姻出了問題，就覺得整個人生都失敗了¦Marriage trouble = my life has failed|孩子不聽話，就覺得自己不是好媽媽¦Child won't listen = I'm not a good mother|產品賣不好，就覺得產品一定不好¦Product didn't sell = the product must be bad|被批評一次，就覺得大家都不喜歡我¦Criticized once = everyone dislikes me|失敗一次，就覺得以後也一定會失敗¦Failed once = I'll always fail`,
co:`事件原本只傷你一次¦The event itself hurts only once|錯的詮釋，卻讓那份痛每天重播¦A wrong interpretation replays the hurt every day|慢慢長成自責、焦慮、羞愧、逃避，甚至把自己定型¦It grows into self-blame, anxiety, shame, avoidance and even a fixed identity`,
up:`問問自己：除了現在這個故事，還有哪三種可能？¦Ask: besides this story, what are three other possible explanations?`,
iq:`真正發生的，到底是什麼？¦What actually happened?|後來我替它加上了什麼故事？¦What story did I add afterwards?|我是不是從一件事，就推論出「永遠都會這樣」？¦Did I conclude "it will always be like this" from one event?|除了我的版本，還有哪三種可能？¦Besides my version, what are three other possibilities?|如果是好朋友遇到，我也會解讀得這麼重嗎？¦If a friend faced this, would I interpret it this harshly?`,
ic:`一件事，可能變成很長很長的痛。¦One event can turn into long-term pain.`,
rp:`事情只有一件，心卻寫出一整部連續劇。¦One event, yet the mind writes a whole drama series.`,ri:`哪些是真的發生了，哪些是我後來加上的故事？¦What really happened, and what did I add later?`,rc:`一件事，被延長成很久的痛。¦A single event stretched into long-term pain.`,
rm:`把「發生的事」和「它的意義」分開¦Separate event and meaning|輕輕放下「永遠、一定、全部、從來」這些字¦Drop the words "always, definitely, all, never"|同一件事，至少想出三種解釋¦Generate at least 3 explanations for one event|問問看：還少了哪些資訊？¦Ask what information is missing|把「他就是這種人」換成「那時的情境是這樣」¦Replace personality explanations with situational ones|重大的事，過 24 小時再重新解讀一次¦Reinterpret major events after 24 hours`,rk:`先讓幾種解釋並存，不急著收斂成唯一的故事。¦Keep several explanations open; don't collapse into one story too soon.`,
cs:`一次考差：「我根本不是讀書的料。」¦One bad test: "I'm just not cut out for studying."|被拒絕一次：「沒有人會喜歡我。」¦Rejected once: "No one will ever like me."|一次團購不好：「市場根本不需要。」¦One group-buy flops: "The market doesn't need this."|吵了一次架：「我們的婚姻完了。」¦One fight: "Our marriage is over."|孩子頂嘴：「我的教育徹底失敗。」¦Child talks back: "I've completely failed as a parent."|今天效率很差：「我整個人都廢掉了。」¦A slow workday: "I'm totally useless lately."`,
cc:`一件事，被放大成永遠的人生故事。¦One event is expanded into a permanent life story.`,cr:`放下「永遠／全部／一定」，至少再找三種解釋。¦Ban "always / all / definitely" and find at least 3 explanations.`,cl:`事件只傷你一次，故事卻可能每天再傷一次。¦The event hurts you once; the story may hurt you every day.`,
dx:`我是不是從一件事，推論出了整個人生？¦Am I inferring my whole life from one event?|我心裡有沒有冒出「永遠、一定、大家、從來、完全」？¦Are words like "always, definitely, everyone, never, completely" showing up?|我是不是替別人的行為，加上了自己無法證明的動機？¦Am I adding motives to others' behavior that I can't prove?|除了現在這個解釋，我能不能再想出三種？¦Can I come up with three other explanations?|真正讓我痛的，是事件，還是我對事件說的故事？¦Is it the event that hurts, or the story I tell about it?`,dr:`「是」越多，先別急著改變現實，先溫柔地檢查故事。¦Many YESes → don't rush to change reality; check the interpretation first.`,
q:`一件不好的事發生，我很容易想到「以後都會這樣」。¦When something bad happens, I quickly think "it'll always be like this."|我常用「一定、永遠、全部、從來」來解釋事情。¦I often explain things with "definitely, always, all, never."|我常替別人的行為，加上自己其實無法證明的動機。¦I often assign motives to others that I can't actually prove.`,qy:`重新打開其他可能的解釋。¦Reopen alternative explanations.`,
ac:`寫下此刻心裡的故事。¦Write down the story in your head right now.|再寫出至少三種其他的可能。¦Write at least 3 alternative explanations.|劃掉「永遠、一定、全部、從來」。¦Delete "always, definitely, all, never."|把人格的解釋，換成情境的解釋。¦Swap personality explanations for situational ones.|問問：「我還少了什麼證據？」¦Ask: "What evidence am I still missing?"`,
da:`每天練習一次「同一件事，三種解釋」。¦Practice "one event, three explanations" daily.`,sy:`重大的事，24 小時後再詮釋第二次。¦Reinterpret major events a second time after 24 hours.`,kp:`一件事，不再那麼快變成人生的結論。¦Single events no longer escalate into life conclusions.`,al:`留住幾種解釋，就是替自己留住自由。¦Keeping several explanations open keeps you free.`,
lk:`一件事被解讀成巨大的故事¦One event becomes a huge story`,core:`多找幾種解釋¦Add alternative explanations`,pr:`RP04 Alternative Explanation`,fa:`列出三種其他可能¦List 3 other possibilities`});

e({n:5,lv:1,en:`BELIEF`,zh:`信念錯誤¦Belief Error`,sub:`曾經保護你的規則，也許已經過期了¦The rule that once protected you may have expired`,def:`信念，是你長久相信「世界就是這樣」的內在規則。¦A belief is an inner rule that says "this is how the world works."`,
pl:`它以前也許真的有用，只是季節已經換了，你還穿著舊衣服。¦It may have worked before, but the season has changed and you're still wearing the old clothes.`,
mi:`以為努力就一定成功¦Hard work always brings success|以為老師一定要什麼都懂¦A teacher must know every answer|以為父母說的一定對¦Parents are always right|以為年紀大了就不能改變¦You can't change when you're older|以為自己天生數學不好¦I was born bad at math|以為有錢才代表成功¦Only money means success|以為忍耐才是好人¦Enduring makes you a good person|以為拒絕別人就是自私¦Saying no is selfish|以為以前成功的方法，現在一定也有效¦What worked before must still work`,
co:`新的機會看不見¦New opportunities go unseen|新的資訊進不來¦New information can't get in|一直重複著舊的人生¦The old life keeps repeating|世界已經換了樣子，心裡的作業系統卻還沒更新¦The environment has changed but your inner operating system hasn't`,
up:`問問自己：這個信念，現在還有多少證據支持？¦Ask: how much evidence still supports this belief now?`,
iq:`我為什麼會相信這件事？¦Why do I believe this?|這是我親自驗證過的，還是別人告訴我的？¦Did I verify it, or was I told?|它以前有效，現在還有效嗎？¦It worked before — does it still work now?|有哪些證據，其實和我的信念相反？¦What evidence actually contradicts my belief?|如果放下它，我會看見哪些新的可能？¦If I let it go, what new options would I see?`,
ic:`世界已經改變，人生卻還照著舊規則走。¦The world has changed, but life still runs on old rules.`,
rp:`以前的規則，也許已經到期了。¦Old rules may have expired.`,ri:`我為什麼相信它？現在還有證據嗎？¦Why do I believe it? Is there still evidence?`,rc:`新的現實來了，人生還在用舊的作業系統。¦New reality arrives while life runs on an old operating system.`,
rm:`替每個重要的信念，寫下它從哪裡來¦Write down where each important belief came from|找找支持它的證據¦Find supporting evidence|也找找反對它的證據¦Then find opposing evidence|替信念加上「在什麼情況下成立」¦Define when the belief holds|允許它「部分正確」¦Allow it to be partly true|定期問：什麼證據會讓我改變想法？¦Regularly ask what evidence would change your mind`,rk:`信念是暫時的地圖，不是永遠的真理。¦A belief is a temporary model, not a permanent truth.`,
cs:`「女生數學本來就比較差。」¦"Girls are just worse at math."|「我年紀大了，不可能學會 AI。」¦"I'm too old to learn AI."|「老師就應該什麼都會。」¦"A teacher should know everything."|「父母說的不能拒絕。」¦"You can't say no to your parents."|「吃越多苦，才代表越努力。」¦"The more you suffer, the harder you're working."|「以前這樣賣得很好，現在一定也可以。」¦"It sold well this way before, so it will now."`,
cc:`現實已經變了，心裡的作業系統還停在過去。¦Reality has changed while your inner operating system stays in the past.`,cr:`問問：這個信念的證據是什麼？反例是什麼？在什麼條件下才成立？¦Ask: what's the evidence, what's the counterexample, when does it apply?`,cl:`曾經救過你的信念，也可能是今天困住你的框。¦A belief that once saved you can become the frame that limits you today.`,
dx:`這個想法是我驗證過的，還是從家庭、學校、文化或別人那裡學來的？¦Did I verify this, or learn it from family, school, culture or others?|我是不是已經很多年沒有重新看看它？¦Have I gone years without re-examining it?|現實是不是已經出現和它衝突的證據？¦Has reality produced evidence that conflicts with it?|我會不會自動忽略和信念不同的資料？¦Do I automatically ignore information that disagrees?|如果這個信念不是真的，我的人生會多出哪些選擇？¦If this belief weren't true, what options would open up?`,dr:`「是」越多，可能是舊信念正在擋住新的現實。¦Many YESes → an old belief may be limiting a new reality.`,
q:`有些人生規則我相信了好多年，卻從沒重新驗證過。¦I've held some life rules for years without re-verifying them.|遇到和我信念不同的資料，我的第一反應常是排斥。¦My first reaction to information that contradicts my beliefs is often to reject it.|我常因為「以前都是這樣」，就覺得現在也應該如此。¦I often assume it should be this way now because "it always was."`,qy:`看看舊信念是不是已經過期。¦Check whether the old belief has expired.`,
ac:`寫下那句限制你的信念。¦Write down the belief that limits you.|問問「我是從哪裡學來的？」¦Ask "Where did I learn this?"|列出三個支持它的證據。¦List 3 supporting pieces of evidence.|再列出三個反例。¦List 3 counterexamples.|把它改寫成有條件的版本。¦Rewrite it in a conditional form.|例如：「我英文不好」→「我目前長句解析的能力還在練。」¦Example: "My English is bad" → "My long-sentence parsing is still developing."`,
da:`抓住一句「我就是／一定／不可能」，重新看看它。¦Catch one "I'm just / definitely / impossible" statement and re-examine it.`,sy:`每個月替信念做一次健康檢查。¦Do a monthly belief audit.`,kp:`固定的信念，變成可以被測試的假說。¦Fixed beliefs become testable hypotheses.`,al:`別把信念當真理，把它當成一張可以修改的地圖。¦Treat a belief as a model, not a truth.`,
lk:`舊規則一直沒重新驗證¦Old rules never re-verified`,core:`支持證據＋反證＋加上條件¦Support + counter-evidence + conditions`,pr:`RP05 Belief Stress Test`,fa:`寫下限制自己的那句信念¦Write the limiting belief`});

e({n:6,lv:1,en:`MODEL`,zh:`模型錯誤¦Model Error`,sub:`不是你不夠努力，是手上的地圖畫錯了¦You're not lacking effort — the map in your hands is drawn wrong`,def:`模型，是你用來理解世界、預測結果的內在地圖。¦A model is the inner map you use to understand the world and predict outcomes.`,
pl:`你一直很認真地走，只是拿著一張畫錯的地圖。¦You walk earnestly, but you're holding the wrong map.`,
mi:`以為健康只看體重¦Health is only about weight|以為成績只靠讀書時間¦Grades depend only on study hours|以為孩子不聽話只是態度不好¦A disobedient child just has a bad attitude|以為同事表現差只是懶惰¦A poor performer is just lazy|以為婚姻只要忍耐就會變好¦Marriage improves if you just endure|以為產品好就自然有人買¦A good product sells itself|以為知道很多就等於有智慧¦Knowing a lot equals wisdom|以為一個原因只造成一個結果¦One cause produces one result`,
co:`越努力，可能離目的地越遠¦The harder you try, the further you may drift|因為行動沒有錯，錯的是背後那張地圖¦The action isn't wrong; the model behind it is`,
up:`先別問「我要更努力嗎？」，先問「我的地圖是不是畫錯了？」¦Don't ask "Should I try harder?" first; ask "Is my map wrong?"`,
iq:`我現在是用什麼方式，在理解這件事？¦What model am I using to explain this?|這個理解，能說明現在的真實嗎？¦Does it explain reality?|它能預測下一次嗎？¦Can it predict the next time?|有沒有重要的因素，被我漏掉了？¦Is an important variable missing?|如果我已經很努力、結果卻沒變，會不會是地圖本身出了問題？¦If I've worked hard and nothing changed, is the model itself wrong?`,
ic:`拿錯了地圖，越努力可能離目的地越遠。¦With the wrong map, effort takes you further away.`,
rp:`人生的地圖，也許畫錯了。¦The life map may be drawn wrong.`,ri:`如果一直努力卻沒有改善，會不會是地圖本身錯了？¦If constant effort brings no improvement, is the map itself wrong?`,rc:`越努力，可能離目標越遠。¦More effort may move you further from the goal.`,
rm:`畫出「投入→怎麼運作→結果」¦Draw Input → Mechanism → Outcome|列出那些被忽略的因素¦List the ignored variables|至少建立兩張互相競爭的地圖¦Build at least two competing models|看看哪一張更能預測真實¦Compare which predicts reality better|地圖越複雜，不代表越好¦More complex isn't better|定期刪掉沒有預測價值的部分¦Regularly delete nodes with no predictive value`,rk:`別急著保護地圖，讓真實幫你修改它。¦Don't protect the model; let reality eliminate it.`,
cs:`以為英文不好只是單字背太少，其實卡在長句¦Thinking weak English is just vocabulary, when the real issue is long sentences|以為變胖只是吃太多，忘了睡眠與活動¦Thinking weight gain is just overeating, ignoring sleep and activity|以為孩子懶，其實他只是不知道怎麼開始¦Thinking the child is lazy when he doesn't know how to start|以為賣不好是太貴，其實客人不知道為什麼需要¦Thinking it's the price, when customers don't see why they need it|以為夫妻常吵是溝通技巧差，其實是界線的問題¦Thinking fights are about communication skills when the issue is boundaries|以為自己要更努力，其實是工作系統需要重新設計¦Thinking you must try harder when the work system needs redesign`,
cc:`努力增加了，結果卻沒有跟著變好。¦Effort goes up; outcomes don't improve.`,cr:`至少畫兩張地圖，看哪一張更能解釋真實。¦Build at least two competing models and see which explains reality better.`,cl:`努力從來沒有錯，錯的可能只是地圖。¦Effort isn't wrong; the map might be.`,
dx:`我現在到底用什麼邏輯，在解釋這個問題？¦What logic am I using to explain this problem?|這套解釋，真的能說明所有重要的證據嗎？¦Does it account for all the important evidence?|有沒有重要的因素被我漏掉？¦Did I miss an important variable?|我已經很努力了，結果卻沒有明顯改善？¦Have I added a lot of effort without clear improvement?|有沒有另一張更簡單、更完整的地圖？¦Is there a simpler, more complete model?`,dr:`「是」越多，別再只加努力，先重新畫地圖。¦Many YESes → stop adding effort; redraw the map.`,
q:`我已經很努力了，同一個問題卻一直沒有改善。¦I've worked hard, yet the same problem hasn't improved for a long time.|我通常只有一種方式來解釋問題。¦I usually have only one way to explain a problem.|結果不如預期時，我第一個念頭是更努力，而不是回頭看看地圖。¦When results disappoint, my first thought is to try harder, not to check my model.`,qy:`也許不是努力不夠，而是地圖需要更新。¦It may not be lack of effort; the map needs updating.`,
ac:`畫出「我認為 A 為什麼會造成 B」。¦Draw "why I think A causes B."|至少建立地圖 A 和地圖 B。¦Build Model A and Model B.|寫下每張地圖各自預測什麼。¦List what each model predicts.|找出能分辨兩張地圖的證據。¦Find evidence that distinguishes them.|真實支持哪一張，就多信任它一點。¦Give more weight to whichever reality supports.`,
da:`卡住時問：「還有沒有另一種看法？」¦When stuck, ask: "Is there another model?"`,sy:`替自己的地圖做版本紀錄。¦Keep version control for your models.`,kp:`地圖越來越能解釋、也越來越能預測。¦Models explain and predict more accurately.`,al:`別守著舊地圖，讓真實幫你重畫。¦Don't guard your map; let reality redraw it.`,
lk:`越努力，結果仍不改善¦More effort, outcome unchanged`,core:`建立互相競爭的地圖¦Build competing models`,pr:`RP06 Competing Model`,fa:`建立地圖 A／B¦Build Model A / B`});

e({n:7,lv:1,en:`PREDICTION`,zh:`預測錯誤¦Prediction Error`,sub:`「我以為」和「後來」之間，藏著成長的禮物¦Between "I thought" and "what happened" lies the gift of growth`,def:`預測，是事情發生前，你心裡以為接下來會怎樣。¦A prediction is what you expect to happen before it does.`,
pl:`其實我們每天，都在悄悄地預測人生。¦Every day, we are quietly predicting life.`,
mi:`以為一小時做得完，結果花了三小時¦Expecting one hour; it takes three|以為學生會自己讀，結果沒有¦Expecting students to study on their own; they don't|以為對方一定會懂¦Expecting the other person to understand|以為買了課程，自己就會改變¦Expecting a course purchase to change you|以為這個產品大家一定喜歡¦Expecting everyone to love the product|以為明天一定有時間¦Expecting to have time tomorrow|以為事情一定很糟，結果根本沒事¦Expecting disaster that never comes|以為一定成功，所以沒有備案¦Expecting sure success, so no Plan B`,
co:`時間失控¦Time slips out of control|承諾跳票¦Promises get broken|錯過機會¦Opportunities are missed|成本增加¦Costs rise|失望變多¦Disappointment grows|如果一直不校準，人會長期高估或低估真實¦Without calibration, you keep over- or underestimating reality`,
up:`預測落空不是失敗，而是生命送你的免費校準。¦A prediction error isn't failure; it's free calibration data.`,
iq:`事情發生以前，我原本以為會怎樣？¦What did I expect before it happened?|實際上發生了什麼？¦What actually happened?|兩者最大的差距在哪裡？¦Where is the biggest gap?|我高估了什麼？¦What did I overestimate?|我低估了什麼？¦What did I underestimate?|下一次，我要怎麼調整自己的預測？¦How will I adjust my next prediction?`,
ic:`時間、成本、期待，和真實長期錯開。¦Time, cost and expectations stay out of step with reality.`,
rp:`我以為，結果不是。¦I thought so, but it wasn't.`,ri:`預測和真實，到底差了多少？¦How far apart were prediction and reality?`,rc:`期待、成本、時間，長期錯位。¦Expectations, costs and time stay misaligned.`,
rm:`重要的事，先寫下你的預測¦Write down predictions for important things|盡量寫成數字或範圍¦Use numbers or ranges|事後記下真正的結果¦Record the actual result afterwards|把預測和真實放在一起比較¦Compare prediction and reality|找出自己習慣高估或低估的地方¦Find your habitual over- or underestimation|下一輪，溫柔地調整¦Adjust the next round`,rk:`別怕猜錯，讓每一次猜錯都幫下一次更準。¦Don't fear guessing wrong; let every miss calibrate the next.`,
cs:`以為作業一小時寫完，結果寫了三小時¦Homework planned for an hour takes three|以為學生會自己預習，結果大多沒有¦Expecting students to preview; most don't|以為商品一上架大家就會買¦Expecting sales the moment it's listed|以為孩子上大學一定適應得很好¦Expecting your child to adapt easily to university|以為旅行花兩萬，最後花了四萬¦Budgeting NT$20,000 for a trip and spending 40,000|以為明天一定有空，結果行程又滿了¦Sure you'll be free tomorrow; the schedule fills up again`,
cc:`時間、金錢、期待，一次又一次和真實錯開。¦Time, money and expectations repeatedly miss reality.`,cr:`先寫預測，事後記真實，比一比差距，下次校準。¦Write the prediction → record the actual → compare the gap → calibrate.`,cl:`猜錯不可怕，一直不校準才昂貴。¦Guessing wrong isn't scary; never calibrating is costly.`,
dx:`事情發生以前，我原本預測什麼？¦What did I predict beforehand?|真正的結果和預測差了多少？¦How far was the actual result from the prediction?|我是不是常常低估時間、成本或難度？¦Do I often underestimate time, cost or difficulty?|我是不是常常高估自己或別人會做到的程度？¦Do I often overestimate how much I or others will do?|同樣的落差，是不是已經發生很多次了？¦Has the same kind of gap happened many times?`,dr:`「是」越多，需要的是校準，而不是責怪自己。¦Many YESes → you need calibration, not self-blame.`,
q:`我常低估一件事需要的時間或成本。¦I often underestimate the time or cost something takes.|我常高估自己或別人會完成的程度。¦I often overestimate how much I or others will complete.|類似的事情發生時，我的預測常出現相似的落差。¦My predictions show similar gaps in similar situations.`,qy:`建立「預測→真實」的校準習慣。¦Build a prediction → actual calibration habit.`,
ac:`事情開始前，先寫下預測。¦Write the prediction before starting.|盡量寫成數字：時間、金額、成功率、完成量。¦Use numbers: time, money, success rate, output.|結束後記下真正的結果。¦Record the actual result afterwards.|算一算差距。¦Calculate the gap.|標記出高估或低估的習慣。¦Mark your over/underestimation pattern.`,
da:`每天至少做一個小小的預測。¦Make at least one small prediction a day.`,sy:`為自己建立一本預測日誌。¦Keep a prediction log.`,kp:`同一種落差，越來越小。¦The same kind of prediction error shrinks.`,al:`成長，就是下一次比這一次猜得更準。¦Growth means guessing a little more accurately next time.`,
lk:`「我以為」和真實不同¦"I thought" differs from reality`,core:`校準預測¦Prediction calibration`,pr:`RP07 Prediction Calibration`,fa:`寫下預測 vs 真實¦Write prediction vs actual`});

e({n:8,lv:1,en:`CAUSAL`,zh:`因果錯誤¦Causal Error`,sub:`一起發生的事，不一定是彼此造成的¦Things that happen together don't necessarily cause each other`,def:`因果，是 A 到底是不是 B 的原因。¦Causality asks whether A really causes B.`,
pl:`兩件事剛好同時來到，不代表其中一件帶來了另一件。¦Two things arriving together doesn't mean one brought the other.`,
mi:`吃了某個營養素覺得舒服，就認定完全是它的功勞¦Feeling better after a supplement = it must be the sole reason|孩子常用手機，就認定成績差全是手機害的¦Lots of phone use = poor grades are all the phone's fault|夫妻吵架，就認定是某一個人的個性¦Couples fighting = one person's personality|業績下滑，就認定一定是價格問題¦Sales dropped = it must be the price|睡不好，就認定一定缺了某種營養素¦Poor sleep = lacking a certain nutrient|成功人士做某件事，就認定照做也會成功¦Successful people do X = doing X will make me successful`,
co:`找錯了原因，就會醫錯了地方¦Wrong cause, wrong treatment|花了好多錢、時間與力氣，真正的卡點卻一動也沒動¦Lots of money, time and energy spent while the real bottleneck never moves`,
up:`問問：還有哪些因素，可能同時造成了這個結果？¦Ask: what other variables might have caused this result?`,
iq:`A 真的造成了 B，還是只是剛好一起發生？¦Did A really cause B, or did they just happen together?|有沒有第三個因素，同時影響了 A 和 B？¦Is a third factor influencing both?|因果的方向，會不會其實相反？¦Could the direction be reversed?|我是不是因為先後發生，就以為前者造成後者？¦Am I assuming causation just because one came first?|如果拿掉這個因素，結果真的會改變嗎？¦If this factor were removed, would the result really change?`,
ic:`原因找錯，解法也跟著錯。¦Wrong cause → wrong solution.`,
rp:`也許，把一起發生誤認成了誰造成誰。¦You may be mistaking co-occurrence for causation.`,ri:`A 真的造成了 B 嗎？¦Does A really cause B?`,rc:`原因找錯，所有的解法都跟著偏。¦Wrong cause, and every solution follows it astray.`,
rm:`至少想出三個可能的原因¦Propose at least 3 possible causes|檢查有沒有第三個因素¦Check for a third variable|想想因果會不會反過來¦Check for reverse causation|一次只改變一個主要因素¦Change only one main variable at a time|觀察改變前後的差別¦Observe before and after|能做小實驗，就先做小實驗¦Run small experiments when you can`,rk:`相關先放著，因果慢一點再下結論。¦Keep correlation in mind; conclude causation slowly.`,
cs:`吃了某補充品後睡得好，立刻認定百分之百是它¦Sleeping well after a supplement and crediting it 100%|換了老師後成績下降，全怪老師¦Grades drop after a teacher change and it's all the teacher's fault|換工作後身體不舒服，認定工作是唯一原因¦Feeling unwell after a job change and blaming only the job|成功人士五點起床，就以為五點起床會讓人成功¦Believing waking at 5 a.m. makes people successful|業績下降剛好漲價，認定都是價格造成¦Sales fell right after a price rise, so it must be the price|孩子用手機後成績下降，把原因全歸給手機¦Grades fell after getting a phone, so the phone takes all the blame`,
cc:`原因找錯，介入也跟著錯。¦Wrong cause → wrong intervention.`,cr:`多種原因並列＋第三因素＋反向因果＋小小的實驗。¦Multiple hypotheses + third variable + reverse causation + small experiments.`,cl:`同時發生，不代表誰造成了誰。¦Happening together doesn't mean one caused the other.`,
dx:`我有證據證明 A 造成 B 嗎？¦Do I have evidence that A causes B?|還是 A 和 B 只是剛好一起出現？¦Or did they just occur together?|有沒有第三個因素同時影響兩者？¦Could a third variable affect both?|因果方向有沒有可能完全相反？¦Could the direction be completely reversed?|如果拿掉 A，我真的有理由相信 B 會跟著改變嗎？¦If A were removed, do I have reason to expect B to change?`,dr:`答不出來時，就先說「可能有關」，別急著說「一定是因為」。¦If you can't answer, say "possibly related," not "definitely caused."`,
q:`兩件事接連發生時，我很容易覺得是前者造成後者。¦When two things happen in sequence, I easily assume the first caused the second.|看到某個方法有效，我容易直接認定它就是主要原因。¦When a method seems to work, I assume it's the main cause.|我很少主動去找其他可能的原因或第三個因素。¦I rarely look for other causes or a third variable.`,qy:`先說「可能相關」，別太快升級成「一定是因為」。¦Say "possibly related" before upgrading to "definitely caused."`,
ac:`別寫「A 造成 B」，先寫「A 可能和 B 有關」。¦Write "A may relate to B," not "A causes B."|至少列出三個其他可能的原因。¦List at least 3 alternative causes.|找找看第三個因素。¦Look for a third variable.|想想因果會不會反過來。¦Check reverse causation.|能掌控時，一次只改少量的主要因素。¦When you can, change only a few main variables at once.`,
da:`看到「因為」時，多問一次「真的嗎？」¦When you see "because," ask once more: "Really?"`,sy:`養成小實驗的思考方式。¦Build small-experiment thinking.`,kp:`錯誤的歸因，越來越少。¦Fewer misattributions.`,al:`相關可以很快發現，因果要慢慢確認。¦Correlation can be spotted fast; causation takes time to confirm.`,
lk:`把相關當成因果¦Treating correlation as causation`,core:`其他原因＋第三因素＋小實驗¦Alternative causes + third variable + experiment`,pr:`RP08 Causal Check`,fa:`列出三個可能原因¦List 3 possible causes`});

e({n:9,lv:2,en:`STATE`,zh:`狀態錯誤¦State Error`,sub:`別在最疲憊的時刻，替人生做最重的決定¦Don't make life's heaviest decisions in your most exhausted moments`,def:`狀態，是此刻身體、情緒、神經與注意力的整體樣子。¦State is your body, emotions, nervous system and attention right now.`,
pl:`同一個你，在不同的狀態裡，就像不同的人。¦The same you, in different states, is almost a different person.`,
mi:`很累的時候談離婚¦Discussing divorce when exhausted|很氣的時候傳重要訊息¦Sending important messages when furious|焦慮的時候做投資決定¦Making investment decisions when anxious|孤單的時候做關係決定¦Making relationship decisions when lonely|失眠之後，覺得人生沒有希望¦Deciding life is hopeless after a sleepless night|興奮的時候大量購物¦Shopping heavily when excited|壓力大的時候亂吃¦Eating chaotically under stress|身體不舒服時，否定整個自己¦Rejecting yourself when your body feels unwell`,
co:`短暫的狀態，變成了永久的決定¦A temporary state becomes a permanent decision|幾個小時的情緒，可能留下好幾年的後果¦A few hours of emotion can leave years of consequences`,
up:`重大決定之前，先問：現在的我，適合做決定嗎？¦Before a major decision, ask: is this state fit for deciding?`,
iq:`我現在累嗎？¦Am I tired right now?|我是不是正在生氣、焦慮、孤單，或太興奮？¦Am I angry, anxious, lonely or overexcited?|睡一晚之後，我還會做同樣的決定嗎？¦After a night's sleep, would I decide the same?|這是長期的判斷，還是一時狀態的反應？¦Is this long-term judgment or a reaction of a temporary state?|這件事，真的非得現在決定嗎？¦Does this really have to be decided now?`,
ic:`幾個小時的狀態，可能決定了好幾年。¦A few hours of state can shape years of decisions.`,
rp:`用一時的狀態，做了永久的決定。¦Making permanent decisions from a temporary state.`,ri:`睡一晚後，我還會這樣決定嗎？¦After sleeping on it, would I decide this way?`,rc:`幾小時的狀態，留下幾年的後果。¦Hours of state, years of consequences.`,
rm:`做個 HALT 檢查：餓了嗎？生氣嗎？孤單嗎？累了嗎？¦HALT check: hungry, angry, lonely, tired?|重大的決定，晚一點再做¦Delay major decisions|先睡一覺、喝點水、吃點東西、走一走¦Sleep, drink water, eat, move first|情緒的高峰，不送出永久的訊息¦Send no permanent messages at an emotional peak|回到平穩之後，再重新評估¦Reassess after returning to baseline|找出適合自己做決定的狀態標準¦Define your own decision-ready state`,rk:`先照顧好狀態，再談策略。¦Regulate the state first, then talk strategy.`,
cs:`半夜失眠時，覺得人生完了¦Awake at midnight, feeling life is over|大吵的時候，立刻傳出很重的訊息¦Sending a harsh message mid-fight|工作累到極限時，決定辭職¦Deciding to quit when completely burned out|考前焦慮，就認定自己一定不會¦Pre-exam anxiety convinces you you'll fail|很孤單時，又聯絡了明知不適合的人¦Contacting someone you know isn't right because you feel lonely|投資大漲時，興奮地繼續加碼¦Adding more to an investment while overexcited by a rally`,
cc:`一時的狀態，換來長久的後果。¦Temporary state → permanent consequence.`,cr:`先睡、先吃、先休息、先安頓，回到平穩再決定。¦Sleep, eat, rest, regulate → decide after returning to baseline.`,cl:`別讓今晚的你，替未來五年的你做完所有決定。¦Don't let tonight's you make every decision for the next five years.`,
dx:`我現在是不是很累、很餓、很痛、失眠，或身體不舒服？¦Am I tired, hungry, in pain, sleepless or unwell?|我現在是不是非常生氣、焦慮、孤單或興奮？¦Am I very angry, anxious, lonely or excited?|這個決定，一定要現在做嗎？¦Must this decision be made now?|如果睡一晚、休息一天，我還會這樣決定嗎？¦After a night's sleep or a day's rest, would I decide the same?|我是不是把一時的狀態，看成了永久的真實？¦Am I reading a temporary state as permanent reality?`,dr:`「是」越多，先照顧狀態，再做決定。¦Many YESes → regulate the state first, then decide.`,
q:`很累、失眠、餓或身體不舒服時，我仍然會做重要決定。¦I still make important decisions when tired, sleepless, hungry or unwell.|我常在情緒最高的時候，決定重要的事情。¦I often decide important things at emotional peaks.|休息過後，我常發現昨天其實想得太嚴重了。¦After resting, I often find I made things too serious yesterday.`,qy:`先安頓狀態，再做決定。¦Regulate the state first, then decide.`,
ac:`做一次 HALT：餓嗎？氣嗎？孤單嗎？累嗎？¦Do HALT: hungry? angry? lonely? tired?|替此刻的狀態打 0～10 分。¦Rate your state 0–10.|在高壓的狀態裡，不做不可逆的決定。¦Make no irreversible decisions under high stress.|先睡、先吃、喝水、走動、休息。¦Sleep, eat, drink water, move, rest first.|回到平穩之後，再重新評估。¦Reassess after returning to baseline.`,
da:`早、午、晚各記一次自己的狀態。¦Record your state morning, noon and night.`,sy:`建立屬於你的「可以做決定」標準。¦Define your own decision-ready standard.`,kp:`衝動之後後悔的決定，越來越少。¦Fewer impulsive, regretted decisions.`,al:`先把狀態調好，人生也會慢慢調好。¦Tune your state first, and life follows.`,
lk:`累、餓、焦慮時做重大決定¦Big decisions while tired, hungry or anxious`,core:`先回到平穩¦Return to baseline first`,pr:`RP09 State Reset`,fa:`做一次 HALT 檢查¦HALT check`});

e({n:10,lv:2,en:`EMOTION`,zh:`情緒錯誤¦Emotion Error`,sub:`情緒是來送信的，不是來開車的¦Emotions come to deliver a message, not to drive the car`,def:`情緒，是身心送給你的訊號，不是必須服從的命令。¦An emotion is a signal from body and mind, not an absolute command.`,
pl:`害怕，不代表不能做；生氣，不代表對方一定錯；難過，也不代表人生失敗了。¦Fear doesn't mean you can't. Anger doesn't mean they're wrong. Sadness doesn't mean life has failed.`,
mi:`焦慮了，就逃走¦Anxiety → avoidance|生氣了，就攻擊¦Anger → attack|內疚了，就答應了不想答應的事¦Guilt → agreeing to what you don't want|害怕了，就永遠不開始¦Fear → never starting|孤單了，就回到不適合的關係¦Loneliness → returning to the wrong relationship|羞恥了，就把問題藏起來¦Shame → hiding the problem`,
co:`情緒從送信的人，變成了開車的人¦Emotion shifts from signal to driver|最後不是「我有情緒」，而是「情緒在開我的車」¦It's no longer "I have emotions" but "emotion is driving my car"`,
up:`問問情緒：你想告訴我什麼需要、威脅、失去，或界線？¦Ask the emotion: what need, threat, loss or boundary are you pointing to?`,
iq:`我現在真正感受到的是什麼？¦What am I truly feeling right now?|這份情緒想提醒我什麼？¦What is this emotion trying to tell me?|它代表威脅、失去、需要，還是界線？¦Does it signal threat, loss, need or boundary?|我是在讀懂情緒，還是在服從情緒？¦Am I reading the emotion, or obeying it?|情緒平靜下來後，我還會這樣做嗎？¦Once it calms, would I still act this way?`,
ic:`情緒從訊號，變成了駕駛。¦Emotion turns from signal into driver.`,
rp:`情緒從送信的人，變成了司機。¦Emotion has gone from messenger to driver.`,ri:`我是感受到情緒，還是正在服從情緒？¦Am I feeling the emotion, or obeying it?`,rc:`衝動、逃避、攻擊、討好。¦Impulsiveness, avoidance, attack, people-pleasing.`,
rm:`先替情緒取個名字¦Name the emotion first|用 0～10 分量一量它的強度¦Rate its intensity 0–10|找出它背後的需要、威脅、失去或界線¦Identify the need, threat, loss or boundary|超過 7 分，先不做重大行動¦Above 7, take no major action|用身體的方式，讓自己慢慢降溫¦Use the body to lower arousal|情緒退下來之後，再重新決定¦Re-decide after the emotion settles`,rk:`情緒可以按鈴報警，但不能獨自握住方向盤。¦Emotion may sound the alarm, but it can't hold the wheel alone.`,
cs:`焦慮，所以不敢打開成績¦Anxious, so you can't bring yourself to open the grades|生氣，所以立刻回嗆¦Angry, so you snap back instantly|內疚，所以答應了根本不想做的事¦Guilty, so you agree to something you don't want to do|害怕失敗，所以一直沒有開始¦Afraid of failing, so you never begin|孤單，所以接受了不健康的關係¦Lonely, so you accept an unhealthy relationship|羞恥，所以不敢求助¦Ashamed, so you don't ask for help`,
cc:`情緒從訊號，變成了駕駛。¦Emotion becomes the driver instead of the signal.`,cr:`替情緒命名，找出需要／威脅／失去／界線，讓強度降下來，再行動。¦Name it → find need/threat/loss/boundary → lower intensity → then act.`,cl:`情緒可以提醒你，但別讓它獨自握著方向盤。¦Emotion can remind you, but don't let it steer alone.`,
dx:`我能清楚說出自己現在的情緒嗎？¦Can I clearly name my emotion?|我的行動是在回應真實，還是在逃離情緒？¦Is my action responding to reality or escaping emotion?|我是不是害怕就不做、生氣就攻擊、內疚就答應？¦Do I avoid when afraid, attack when angry, agree when guilty?|如果情緒從 8 分降到 3 分，我還會這樣選嗎？¦If intensity dropped from 8 to 3, would I choose the same?|這份情緒真正提醒的，是需要、威脅、失去，還是界線？¦Is it really signaling need, threat, loss or boundary?`,dr:`情緒直接決定了行動時，先把「訊號」和「命令」分開。¦When emotion directly decides action, separate signal from command.`,
q:`害怕的時候，我很容易直接逃開。¦When afraid, I tend to avoid.|生氣、內疚或焦慮時，我容易立刻行動。¦When angry, guilty or anxious, I act immediately.|我很少先問「這份情緒到底想提醒我什麼？」¦I rarely ask "What is this emotion trying to tell me?"`,qy:`把情緒當成訊號，而不是命令。¦Treat emotion as a signal, not a command.`,
ac:`說出來：「我現在感到＿＿。」¦Say: "I'm feeling ___ right now."|替情緒強度打 0～10 分。¦Rate the intensity 0–10.|辨認它是威脅、失去、需要，還是界線。¦Identify threat / loss / need / boundary.|7 分以上，不做重大的回應。¦Above 7, make no major response.|降到 4 分以下，再選擇行動。¦Choose action once it's below 4.`,
da:`記下「情緒→訊號→需要」三個小步驟。¦Log emotion → signal → need.`,sy:`慢慢累積你的情緒詞彙和安頓工具箱。¦Build an emotion vocabulary and a regulation toolkit.`,kp:`情緒還在，但不再直接主導行動。¦Emotions remain, but no longer control action directly.`,al:`感受它，不等於要服從它。¦Feeling it doesn't mean obeying it.`,
lk:`情緒直接變成行動¦Emotion turns straight into action`,core:`把情緒當訊號，不當命令¦Emotion as signal, not command`,pr:`RP10 Emotion Signal`,fa:`替情緒命名＋打 0～10 分¦Name it + rate 0–10`});

e({n:11,lv:2,en:`IDENTITY`,zh:`身份錯誤¦Identity Error`,sub:`做錯一件事，不等於你是一個錯的人¦Getting one thing wrong doesn't make you a wrong person`,def:`身份認同，是心裡那個「我是誰」的故事。¦Identity is the inner story of "who I am."`,
pl:`你只是這一次沒做好，不代表你就是不好。¦You didn't do well this time; that doesn't mean you are bad.`,
mi:`考差了，就說自己是笨學生¦Bad score = I'm a stupid student|離婚了，就說自己是失敗者¦Divorced = I'm a failure|生病了，就只剩下「病人」這個身份¦Ill = I'm just a patient|被拒絕，就覺得自己沒有價值¦Rejected = I'm worthless|收入不高，就覺得自己能力差¦Low income = I'm incapable|以前失敗過，就說自己不適合¦Failed before = I'm just not suited`,
co:`最可怕的不是失敗¦Failure isn't the most dangerous thing|而是把錯誤寫進了「我是誰」¦Writing the error into your identity is|身份一旦被定住，行為就會開始配合它¦Once identity is fixed, behavior starts to match it`,
up:`把「我是＿＿的人」，換成「我在＿＿這件事上，目前還缺＿＿的能力」。¦Change "I am a ___ person" to "I'm currently missing ___ skill in ___."`,
iq:`我是不是因為一件事，就定義了整個自己？¦Am I defining myself by one event?|我是在說「我這次沒做好」，還是「我就是不好」？¦Am I saying "I did badly" or "I am bad"?|這是能力還沒到，還是我在判自己的人格？¦Is this a skill gap or a verdict on my character?|如果能力可以練，這個標籤還成立嗎？¦If the skill can be trained, does the label still hold?|我需要改變「我是誰」，還是補上一個能力？¦Do I need to change who I am, or build a capability?`,
ic:`錯誤被寫進身份，人就會開始活成那個標籤。¦Once an error is written into identity, you start living as that label.`,
rp:`把「做不好」變成了「我不好」。¦"I did badly" turned into "I am bad."`,ri:`這是能力的問題，還是我正在判自己的人格？¦Is this a skill issue, or am I passing judgment on my character?`,rc:`錯誤被寫進了身份。¦The error gets written into identity.`,
rm:`把「我是」換成「我目前」¦Change "I am" to "I currently"|把人格標籤換成「還在練的技能」¦Turn character labels into skill gaps|找找看反例¦Find counterexamples|收集自己成長的證據¦Build an evidence bank of growth|用可以更新的語言描述自己¦Use updatable language about yourself|用行為描述自己，而不是用標籤¦Describe yourself by behavior, not labels`,rk:`讓身份保持流動，讓能力持續長大。¦Keep identity fluid; keep capability growing.`,
cs:`英文考 40 分：「我是英文白痴。」¦40 in English: "I'm hopeless at English."|生意失敗：「我沒有做生意的能力。」¦Business failed: "I have no business ability."|離婚：「我是失敗的女人。」¦Divorced: "I'm a failed woman."|被拒絕：「我沒有魅力。」¦Rejected: "I'm not attractive."|孩子出狀況：「我是失敗的媽媽。」¦Child in trouble: "I'm a failed mother."|工作出錯：「我就是很粗心。」¦A mistake at work: "I'm just careless."`,
cc:`標籤開始控制未來的行為。¦The label starts controlling future behavior.`,cr:`把「我是」換成「我目前在＿＿還在練習」。¦Change "I am" to "I'm currently still practicing ___."`,cl:`錯的是一次的表現，別把它寫進你是誰。¦What went wrong was one output; don't write it into who you are.`,
dx:`我是不是因為一次結果，就說「我就是＿＿的人」？¦Did one outcome make me say "I'm just a ___ person"?|我把還在練的技能，變成了對人格的評價嗎？¦Did I turn a skill gap into a character judgment?|我是不是用笨、懶、失敗、沒用這些字形容自己？¦Do I use labels like stupid, lazy, failure, useless?|如果這個能力練了會進步，那個標籤還成立嗎？¦If training improves this skill, does the label still stand?|我需要改變的是「我是誰」，還是某一個具體的能力？¦Do I need to change "who I am," or one specific skill?`,dr:`「是」越多，先把身份鬆開，轉成能力的問題。¦Many YESes → untie identity first and turn it into a capability question.`,
q:`失敗之後，我容易說「我就是不行」。¦After failing, I tend to say "I just can't."|我常用笨、懶、沒用、失敗這些字形容自己。¦I often describe myself as stupid, lazy, useless or a failure.|我容易把目前能力不足，解釋成天生就是這樣。¦I tend to explain a current skill gap as something I was born with.`,qy:`把身份換成「還在練的能力」。¦Identity → skill gap.`,
ac:`抓出那句「我就是＿＿」。¦Catch the "I'm just ___" sentence.|改成「我目前在＿＿還有一段路要走」。¦Change it to "I currently have a skill gap in ___."|找出三個反例。¦Find 3 counterexamples.|指定一個可以練的能力。¦Name one trainable capability.|替自己安排一次小小的成功。¦Arrange one small win.`,
da:`每天記下一個能力進步的證據。¦Record one piece of evidence of progress each day.`,sy:`建立一份屬於你的「能力資產表」。¦Build a capability portfolio.`,kp:`固定的標籤變少，可以練的能力變多。¦Fixed labels ↓, trainable skills ↑.`,al:`不必修理你是誰，只要溫柔地練習能力。¦Don't repair your identity; train your capability.`,
lk:`「做不好」變成「我不好」¦"I did badly" becomes "I am bad"`,core:`身份→還在練的能力¦Identity → skill gap`,pr:`RP11 Identity Decoupling`,fa:`把「我是」改成「我目前」¦Change "I am" to "I currently"`});

e({n:12,lv:2,en:`NEED`,zh:`需求錯誤¦Need Error`,sub:`你追著的，也許不是你真正渴望的¦What you're chasing may not be what you truly long for`,def:`需求，是生命真正需要被補上的那一塊。¦A need is what your system truly needs to replenish.`,
pl:`你以為自己想要 A，其實心底缺的是 B。¦You think you want A, but deep down what's missing is B.`,
mi:`一直買東西，其實是想被安慰¦Constant shopping when you need comfort|一直吃，其實是需要休息¦Constant eating when you need rest|一直找伴，其實是需要安全感¦Constantly seeking a partner when you need security|一直滑手機，其實是想逃開壓力¦Endless scrolling to escape stress|一直工作，其實是想被肯定¦Nonstop work when you need recognition|一直控制孩子，其實是自己害怕失控¦Controlling your child because you fear losing control`,
co:`真正的需要，一直沒有被滿足¦The real need is never met|所以同樣的行為，一再重複¦So the same behavior keeps repeating`,
up:`問問自己：我真正想從這件事裡得到的是什麼？¦Ask: what do I really want from this?`,
iq:`我真正想從這件事裡得到什麼？¦What do I really want from this?|我要的是這樣東西，還是它帶來的感受？¦Do I want the thing, or the feeling it brings?|我要的是那個人，還是安全感、認同、陪伴？¦Do I want that person, or security, recognition, companionship?|現在這個方法，真的能滿足我的需要嗎？¦Does this strategy really meet the need?|有沒有代價更小、更溫柔的方式，也能滿足同一個需要？¦Is there a cheaper, healthier way to meet the same need?`,
ic:`真正的需要沒被照顧，同樣的行為就會一再上演。¦When the real need isn't met, the same behavior repeats.`,
rp:`想要的，不一定是真正需要的。¦What you want isn't always what you need.`,ri:`我真正想從這件事得到什麼？¦What do I really want to get from this?`,rc:`一直追著 A，真正缺的 B 卻始終沒補上。¦Chasing A while the missing B is never filled.`,
rm:`把「需要」和「方法」分開¦Separate need from strategy|連續問自己三次「我為什麼想要？」¦Ask "Why do I want this?" three times|找到最底層的那個需要¦Find the deepest need|同一個需要，列出三種滿足方式¦List 3 ways to meet the same need|優先選擇代價小、傷害小的方法¦Prefer low-cost, low-harm options`,rk:`別執著於某個方法，回到真正的需要。¦Don't cling to one method; return to the real need.`,
cs:`壓力大就一直吃，其實需要的是休息¦Eating under stress when you really need rest|一直購物，其實需要安慰與新鮮感¦Shopping when you really need comfort and novelty|一直要求伴侶陪，其實需要的是安全感¦Demanding your partner's company when you need security|停不下來地工作，其實想被肯定¦Nonstop work to be recognized|一直滑手機，其實在逃避難題¦Scrolling to avoid a hard problem|一直控制孩子，其實是害怕失去控制¦Controlling your child out of fear of losing control`,
cc:`表面的方法一再重複，心底的需要始終沒被滿足。¦Surface strategies repeat while the deep need stays unmet.`,cr:`連問三次「我真正想得到什麼？」¦Ask three times: "What do I really want?"`,cl:`別只追逐想要的東西，找找它背後真正的需要。¦Don't chase only what you want; find the need behind it.`,
dx:`我真正想從這件事得到什麼？¦What do I really want from this?|如果得到了，我真正想擁有的是哪一種感受？¦If I got it, which feeling would I truly gain?|我追的是需要，還是滿足需要的某一種方法？¦Am I chasing the need, or one strategy for meeting it?|有沒有另外三種方式能滿足同一個需要？¦Are there three other ways to meet the same need?|我是不是一再得到想要的，卻仍然不滿足？¦Do I keep getting what I want yet still feel unsatisfied?`,dr:`最後一題若是「是」，很可能真正的需要還沒被找到。¦YES on the last question → the real need likely hasn't been found.`,
q:`我常很想得到某樣東西，得到之後卻沒有真正滿足。¦I often badly want something, yet feel unsatisfied once I get it.|壓力大時，我容易用吃、買、滑手機、工作或找人陪來撐過去。¦Under stress, I cope by eating, shopping, scrolling, working or seeking company.|我很少問自己「我真正需要的是什麼？」¦I rarely ask myself "What do I really need?"`,qy:`從「想要」往下，找到「需要」。¦Look beneath the want for the need.`,
ac:`問問：「我想要這個，是因為什麼？」¦Ask: "Why do I want this?"|連續問三次為什麼。¦Ask why three times.|找到最底層的需要。¦Find the deepest need.|同一個需要，列出三種方法。¦List 3 strategies for the same need.|選代價最小、傷害最小的那一個。¦Choose the lowest-cost, least-harmful one.`,
da:`衝動來的時候，先問自己的需要。¦When an urge comes, ask about the need first.`,sy:`畫一張屬於你的需要地圖。¦Build a personal needs map.`,kp:`用來補償的重複行為，越來越少。¦Fewer repeated compensatory behaviors.`,al:`方法可以換，需要要先被看見。¦Strategies can change; the need must be seen first.`,
lk:`一直追想要的，卻仍不滿足¦Chasing wants yet never satisfied`,core:`從想要找到核心需要¦Want → core need`,pr:`RP12 Need Discovery`,fa:`連問三次為什麼¦Ask why 3 times`});

e({n:13,lv:2,en:`VALUE`,zh:`價值排序錯誤¦Value Error`,sub:`嘴上說重要的，值得真的被你放進生活裡¦What you call important deserves a real place in your life`,def:`價值，是真正值得你投入生命的東西。¦Values are what truly deserve your life's resources.`,
pl:`你的時間、金錢、注意力流向哪裡，才最接近你真正的優先順序。¦Where your time, money and attention go is closest to your real priority.`,
mi:`說健康最重要，卻長期熬夜¦Saying health matters while never sleeping enough|說家人最重要，卻沒有陪伴的時間¦Saying family matters with no time together|說學習很重要，每天卻滑三小時手機¦Saying learning matters while scrolling 3 hours a day|說自由很重要，卻一直增加負債¦Saying freedom matters while debt keeps growing|什麼都重要，所以什麼都做不好¦Everything is important, so nothing is done well`,
co:`生命的資源，被不重要的事一點一點吃掉¦Life's resources are eaten by low-value things|最後不是沒有時間，而是沒有排序¦In the end it's not lack of time but lack of priority`,
up:`看看行事曆、錢包和注意力，而不只聽自己嘴上說什麼。¦Look at your calendar, money and attention, not just your words.`,
iq:`我說什麼最重要？¦What do I say matters most?|我的時間實際花在哪裡？¦Where does my time actually go?|我的錢實際花在哪裡？¦Where does my money actually go?|我的注意力實際放在哪裡？¦Where does my attention actually go?|這三者，和我說的價值一致嗎？¦Do these match the values I claim?`,
ic:`生命的資源，被低價值的事慢慢吞掉。¦Life's resources are slowly eaten by low-value things.`,
rp:`嘴上說重要，資源卻沒有給它。¦You call it important but give it no resources.`,ri:`行事曆、金錢、注意力，和我的價值一致嗎？¦Do my calendar, money and attention match my values?`,rc:`生命的資源，慢慢流向不重要的地方。¦Life's resources quietly flow to unimportant places.`,
rm:`寫下你心中最重要的五個價值¦List your Top 5 values|溫柔但堅定地替它們排序¦Force-rank them|看看時間怎麼分配¦Check time allocation|看看金錢怎麼分配¦Check money allocation|看看注意力怎麼分配¦Check attention allocation|放下和核心價值衝突的承諾¦Drop commitments that conflict with core values`,rk:`真正的價值，看資源流向就知道。¦Your true values show in where resources flow.`,
cs:`說健康第一，卻每天凌晨兩點才睡¦Health first, yet asleep at 2 a.m. every night|說家庭重要，週末卻永遠在工作¦Family matters, yet every weekend is work|說學習重要，每天卻看三小時短影音¦Learning matters, yet 3 hours of short videos daily|說財務自由重要，每個月卻全部花光¦Financial freedom matters, yet every month is spent out|說學生最重要，上課卻都在趕進度¦Students matter most, yet class is all rushing through material|說自己最重要，卻永遠最後才照顧自己¦You matter most, yet you always care for yourself last`,
cc:`生命資源被不是核心的事情吸走。¦Life's resources are drained by non-core things.`,cr:`看看行事曆、錢包和注意力。¦Check calendar + money + attention.`,cl:`真正的價值不在嘴上，在資源流向的地方。¦Real values live not in words but where resources flow.`,
dx:`我嘴上說最重要的是什麼？¦What do I say matters most?|過去一週，大部分時間花在哪裡？¦Where did most of my time go last week?|錢主要流去了哪裡？¦Where did most of my money go?|注意力主要被什麼佔據？¦What occupied most of my attention?|時間、金錢、注意力，和我說的價值一致嗎？¦Do time, money and attention match my stated values?`,dr:`不一致時，也許不是時間不夠，而是價值的分配需要調整。¦If they don't match, it's not a time problem; it may be value allocation.`,
q:`我說很重要的事，實際投入的時間卻很少。¦I spend little time on what I say is important.|我的錢和注意力，常流向我自己說「沒那麼重要」的事。¦My money and attention often go to things I call unimportant.|因為什麼都重要，我常常不知道該放下什麼。¦Because everything feels important, I often don't know what to let go.`,qy:`重新替價值與資源排序。¦Re-rank values and resources.`,
ac:`寫下最重要的五個價值。¦List your Top 5 values.|替它們排出 1～5。¦Force-rank them 1–5.|比對過去一週的時間。¦Compare last week's time.|比對金錢。¦Compare money.|比對注意力。¦Compare attention.`,
da:`今天至少做一件事，照顧你最重要的價值。¦Do at least one thing today that serves your top value.`,sy:`每個月做一次「價值→資源」的檢查。¦Do a monthly value → resource audit.`,kp:`你說重要的事，真的得到了資源。¦What you call important actually gets resources.`,al:`價值不是口號，而是你分配生命的方式。¦Values aren't slogans; they're how you allocate life.`,
lk:`嘴上重要，資源沒投入¦Called important, not resourced`,core:`讓價值與資源重新對齊¦Realign values and resources`,pr:`RP13 Value Alignment`,fa:`看看時間／金錢／注意力¦Check time / money / attention`});

e({n:14,lv:3,en:`DECISION`,zh:`決策錯誤¦Decision Error`,sub:`重要的選擇，值得多一點溫柔的思量¦Important choices deserve a little more careful thought`,def:`決策，是在不同選項之間分配你的資源。¦A decision allocates resources among options.`,
pl:`不是每個決定都要想很久，而是重要的決定，值得用對的方法。¦Not every decision needs long thought, but important ones need the right method.`,
mi:`沒有比較其他方案¦Not comparing options|因為已經花了很多錢，所以繼續¦Continuing because you've already spent a lot|害怕損失，所以不敢改變¦Afraid of loss, so afraid to change|第一個想到的方法，就直接做¦Acting on the first idea|小事想半年，大事五分鐘決定¦Months on small things, five minutes on big ones|沒有替自己留退出的條件¦No exit conditions|只看眼前的舒服¦Only looking at short-term comfort|沒想過最壞的情況¦Never considering the worst case`,
co:`錯的決定乘上時間，會變成負的複利¦Wrong decision × time = negative compounding|越晚修正，離開的代價通常越高¦The later you correct, the higher the exit cost`,
up:`選項→代價→風險→可不可以回頭→再決定。¦Options → Cost → Risk → Reversibility → Decision.`,
iq:`我真的比較過其他選項嗎？¦Did I really compare options?|我是不是只想到一個方案？¦Did I think of only one plan?|最壞的結果，我承受得起嗎？¦Can I bear the worst case?|這個決定可以回頭嗎？¦Is this decision reversible?|我是不是因為投入很多，所以不敢離開？¦Am I afraid to exit because I've invested so much?|選了它，我放棄的是什麼？¦What is the opportunity cost?`,
ic:`錯的決定乘上時間，會變成負的複利。¦Wrong decision × time = negative compounding.`,
rp:`做選擇的方法，出了問題。¦The way you choose has gone wrong.`,ri:`我真的比較過不同的選項嗎？¦Have I really compared different options?`,rc:`錯的決定，隨著時間累積成負的複利。¦A wrong decision compounds negatively over time.`,
rm:`至少列出三個選項¦List at least 3 options|比較收穫、代價與風險¦Compare benefit, cost and risk|標出可以回頭與不能回頭的決定¦Mark reversible vs irreversible|可以回頭的，就小小試一試¦Try reversible ones quickly and small|不能回頭的，就放慢腳步¦Slow down for irreversible ones|事先寫好停損的規則¦Set a stop rule in advance|問問自己：選了它，放棄了什麼？¦Ask about opportunity cost`,rk:`小事快快試，大事慢慢決。¦Small things, test fast; big things, decide slowly.`,
cs:`朋友推薦，就買了很貴的產品¦Buying an expensive product on a friend's recommendation|股票虧很多，捨不得認賠，一直加碼¦Adding to a losing stock because you can't accept the loss|工作不適合，卻因為做了十年不敢離開¦Staying in the wrong job because you've been there ten years|第一個想到的解法，就直接執行¦Executing the first solution that comes to mind|可以回頭的小決定，想了三個月¦Three months on a small reversible decision|不能回頭的大決定，五分鐘就做了¦Five minutes on a big irreversible one`,
cc:`錯的決定，經過時間累積成負的複利。¦A wrong decision compounds negatively over time.`,cr:`選項→代價→風險→可否回頭→停損規則。¦Options → Cost → Risk → Reversibility → Stop rule.`,cl:`別因為走了很久，就忘了問方向對不對。¦Don't forget to check the direction just because you've walked a long way.`,
dx:`做決定前，我列過其他選項嗎？¦Did I list other options before deciding?|我有比較代價、收穫與風險嗎？¦Did I compare cost, benefit and risk?|我知道這個決定可不可以回頭嗎？¦Do I know if it's reversible?|我是不是因為投入很多，就不願意離開？¦Am I unwilling to exit because I've invested a lot?|我有事先設好停損的規則嗎？¦Did I set a stop rule in advance?`,dr:`「有」的答案不多時，做決定的方式需要溫柔地校正。¦Few YESes → the decision process needs regularization.`,
q:`做重要決定前，我通常沒有列出其他選項。¦Before important decisions, I usually don't list other options.|已經投入很多時間或錢時，我很難停下來。¦Once I've invested a lot of time or money, I find it hard to stop.|我很少事先設定「什麼情況下我要離開」。¦I rarely set in advance when I will exit.`,qy:`建立選項＋風險＋停損規則。¦Build options + risk + stop rules.`,
ac:`至少列出三個選項。¦List at least 3 options.|每個選項寫下收穫、代價與風險。¦Write benefit, cost and risk for each.|標記可以回頭或不能回頭。¦Mark reversible or irreversible.|可以回頭的決定，快快小試。¦Test reversible decisions quickly.|不能回頭的決定，多找一些證據。¦Gather more evidence for irreversible ones.|事先寫好停損規則。¦Write a stop rule in advance.`,
da:`重要的決定，留下一份決策紀錄。¦Keep a decision log for important decisions.`,sy:`定期回顧自己的決定。¦Hold regular decision reviews.`,kp:`後悔的決定和沉沒成本的追投，越來越少。¦Fewer regretted decisions and sunk-cost chasing.`,al:`做決定不是猜答案，而是照顧好選項與最壞的情況。¦Deciding isn't guessing; it's managing options and downside.`,
lk:`沒比較選項就決定¦Deciding without comparing options`,core:`選項＋風險＋可否回頭¦Options + risk + reversibility`,pr:`RP14 Decision Quality`,fa:`至少列三個選項¦List at least 3 options`});

e({n:15,lv:3,en:`STRATEGY`,zh:`策略錯誤¦Strategy Error`,sub:`方向也許是對的，只是這條路走不通¦The direction may be right; this path just doesn't lead there`,def:`策略，是你打算用什麼路徑抵達目標。¦Strategy is the path you plan to take to reach a goal.`,
pl:`努力很珍貴，但它不是唯一的答案。¦Effort is precious, but it isn't the only variable.`,
mi:`學生不會，就叫他再讀十遍¦A student doesn't get it → read it ten more times|賣不動，就一直降價¦Not selling → keep cutting prices|關係不好，就一直忍耐¦A bad relationship → keep enduring|工作太多，就每天加班¦Too much work → overtime every day|減重失敗，就更極端地節食¦Diet failed → diet more extremely|APP 沒人用，就一直加功能¦App unused → keep adding features`,
co:`越努力，代價越高¦More effort, higher cost|結果卻沒有變好¦But the outcome doesn't improve`,
up:`結果沒有變時，別只加力氣，換一條路吧。¦When the outcome doesn't change, don't just add effort — change strategy.`,
iq:`我的目標是什麼？¦What is my goal?|現在的方法，真的讓我更靠近目標嗎？¦Is my current strategy bringing me closer?|結果沒變時，我是不是只是一直加努力？¦When nothing changes, am I just adding effort?|有沒有代價更小的路？¦Is there a cheaper path?|真正的關鍵點在哪裡？¦Where is the real leverage point?`,
ic:`努力很多，成果卻沒有跟著增加。¦Much effort, results not growing in proportion.`,
rp:`方向也許對，走法不對。¦The direction may be right; the way of walking isn't.`,ri:`努力增加後，結果真的也增加了嗎？¦After adding effort, did the outcome really increase?`,rc:`投入越來越多，成果卻停在原地。¦More and more input while results stall.`,
rm:`清楚定義你要的結果¦Define the outcome clearly|追蹤方法和結果之間的關係¦Track strategy → outcome|設定「沒效就換」的門檻¦Set a failure threshold|沒效就換方法，而不只是加努力¦Switch strategies when they fail, not just add effort|尋找最有槓桿的那一點¦Look for the leverage point|一次做小規模的比較測試¦Run small A/B tests`,rk:`成果不動，先換方法，不要只加力氣。¦If results don't move, change the method before adding force.`,
cs:`英文不好就每天多背一百個單字，但卡的其實是閱讀¦Weak English → 100 more words a day, when the real issue is reading|商品賣不好，就一直降價¦Products don't sell → keep cutting prices|孩子不讀書，就一直罵¦Child won't study → keep scolding|工作做不完，就一直加班¦Work never ends → keep working overtime|體重沒變，就越吃越少¦Weight won't budge → eat less and less|APP 使用率低，就一直加功能¦Low app usage → keep adding features`,
cc:`努力往上，結果卻沒有同步往上。¦Effort ↑, outcome not ↑.`,cr:`設好沒效的門檻，結果不動就換策略。¦Set a failure threshold; change strategy when the outcome doesn't move.`,cl:`卡住時別只踩油門，也看看路線。¦When stuck, don't just press the gas; check the route.`,
dx:`我的目標清楚嗎？¦Is my goal clear?|現在的方法，真的改善了結果嗎？¦Is my strategy really improving the outcome?|沒改善時，我是不是只會投入更多努力？¦When it doesn't, do I just add more effort?|我有試過完全不同的方法嗎？¦Have I tried a completely different strategy?|真正的關鍵點可能在哪裡？¦Where might the real leverage point be?`,dr:`努力變多、結果不動，很可能是策略需要換了。¦Effort ↑ but outcome flat → strongly suspect a strategy error.`,
q:`方法沒效時，我通常只是更加努力。¦When a method fails, I usually just try harder.|我很少設定「做到哪裡還沒效就換方法」。¦I rarely set a point at which I'll switch strategies.|我常投入很多，結果卻長期沒有跟著變好。¦I often invest a lot without proportional long-term improvement.`,qy:`先停下努力一下，看看策略。¦Pause the effort and check the strategy.`,
ac:`先定義你真正要的結果。¦Define the real outcome first.|列出現在的方法。¦List your current strategy.|檢查投入增加後，結果有沒有增加。¦Check whether more input raised the outcome.|列出三個替代的方法。¦List 3 alternative strategies.|找出最有槓桿的那一點。¦Find the leverage point.|設好策略的停損規則。¦Set a strategy stop rule.`,
da:`問自己：「我是在加努力，還是在提高槓桿？」¦Ask: "Am I adding effort, or increasing leverage?"`,sy:`建立一個策略實驗庫。¦Build a strategy experiment bank.`,kp:`同樣的努力，換來更多的成果。¦Each unit of effort produces more outcome.`,al:`不是更用力，而是更有效。¦Not harder — more effective.`,
lk:`沒效只會更加努力¦No results, just more effort`,core:`換策略＋找槓桿¦Switch strategy + find leverage`,pr:`RP15 Strategy Switching`,fa:`列出三種替代方法¦List 3 alternative strategies`});

e({n:16,lv:3,en:`ACTION`,zh:`行動錯誤¦Action Error`,sub:`懂了很多，還差一個小小的開始¦You know so much; all that's missing is a small first step`,def:`行動，是真正讓現實改變的那一步。¦Action is the operation that actually changes reality.`,
pl:`懂了，不等於做了。¦Understanding isn't the same as doing.`,
mi:`收藏了好多文章¦Saving lots of articles|買了很多課，卻沒有完成¦Buying many courses and finishing none|知道要運動，卻一直沒開始¦Knowing you should exercise but never starting|計畫寫得很漂亮，卻沒有第一步¦A beautiful plan with no first step|總說等有空再做¦Waiting until you have time|要求自己一次就做到完美¦Demanding perfection the first time`,
co:`知識變多了，生活卻沒有變¦Knowledge grows while reality stays the same|容易產生「我懂很多，應該有進步」的錯覺¦It creates the illusion "I know a lot, so I must be progressing"`,
up:`每一個領悟之後，都接上一個 24 小時內能做的小行動。¦Follow every insight with a minimum action within 24 hours.`,
iq:`知道之後，我實際做了什麼？¦What did I actually do after knowing?|下一步清楚嗎？¦Is the next action clear?|是不是太大了，所以一直拖？¦Is it too big, so I keep delaying?|24 小時內，最小能做什麼？¦What's the smallest thing I can do in 24 hours?|我是在準備，還是真的在行動？¦Am I preparing, or really acting?`,
ic:`知識增加，生活沒有改變。¦Knowledge grows; reality doesn't change.`,
rp:`知道很多，卻還沒有開始。¦Knowing a lot, but not yet doing.`,ri:`24 小時內，我到底會做什麼？¦What exactly will I do in the next 24 hours?`,rc:`知識增加，生活不變。¦Knowledge up, reality unchanged.`,
rm:`每一個領悟，都接一個行動¦Attach an action to every insight|把行動縮小到 15 分鐘就能開始¦Shrink the action to something you can start in 15 minutes|寫清楚什麼時候、在哪裡¦Write when and where|降低開始的阻力¦Lower the friction to start|先完成，再慢慢變好¦Finish first, then improve|做完就立刻看看回饋¦Get feedback right after`,rk:`沒有行動的領悟，還只是資訊。¦An insight without action is just information.`,
cs:`收藏了 50 篇運動文章，一次也沒運動¦Saved 50 exercise articles, never exercised once|買了線上課程，卻一直沒打開¦Bought an online course and never opened it|寫好完整的減重計畫，說明天再開始¦A complete diet plan — starting tomorrow|想做 APP 半年，一直在研究架構¦Six months planning an app, still researching architecture|知道該和孩子談談，卻一直等完美的時機¦Knowing you should talk to your child but waiting for the perfect moment|每天研究時間管理，行程卻一點沒變¦Studying time management daily while your schedule never changes`,
cc:`知識往上，生活卻還在原地。¦Knowledge ↑, reality stays put.`,cr:`每個領悟後面，接一個 15 分鐘的小行動。¦Follow every insight with a 15-minute minimum action.`,cl:`小到不可能失敗的第一步，比完美的計畫更重要。¦A first step too small to fail matters more than a perfect plan.`,
dx:`我已經知道很多了，但生活真的改變了嗎？¦I know a lot, but has reality changed?|我說得出下一個具體的行動嗎？¦Can I name the next concrete action?|這個行動小到今天就能開始嗎？¦Is it small enough to start today?|我是不是一直在準備、規劃、研究，卻沒真的開始？¦Am I preparing, planning and researching without starting?|24 小時內能完成的最小行動是什麼？¦What minimum action can be done within 24 hours?`,dr:`懂得很多、行為沒變，卡點就在行動。¦Knowing a lot + unchanged behavior → the bottleneck is action.`,
q:`我知道很多方法，真正做到的卻不多。¦I know many methods but actually practice few.|我常花很多時間規劃，卻遲遲沒有開始。¦I spend a lot of time planning and keep delaying the start.|如果問我 24 小時內要做什麼，我常說不出具體的行動。¦Asked what I'll do in the next 24 hours, I often can't name a concrete action.`,qy:`把領悟縮小成一個最小的行動。¦Shrink the insight into a minimum action.`,
ac:`把目標切成 15 分鐘的小行動。¦Cut the goal into a 15-minute action.|寫清楚什麼時候、在哪裡、做什麼。¦Write when, where and what.|五分鐘內能開始，就立刻開始。¦If you can start within five minutes, start now.|先做一個最小可行的行動。¦Do a minimum viable action first.|做完就立刻記下回饋。¦Record feedback right after.`,
da:`每天至少完成一個關鍵的小行動。¦Complete at least one key minimum action daily.`,sy:`每個領悟後面，都一定接一欄「行動」。¦Always attach an action field to every insight.`,kp:`從知道到做到的比例，慢慢提高。¦The know-to-do conversion rate rises.`,al:`不能變成行動的知識，暫時還改變不了生活。¦Knowledge that can't become action can't yet change reality.`,
lk:`知道很多卻沒做¦Knowing much, doing little`,core:`最小行動¦Minimum action`,pr:`RP16 Minimum Action`,fa:`切成 15 分鐘的行動¦Cut into a 15-minute action`});

e({n:17,lv:3,en:`HABIT`,zh:`習慣錯誤¦Habit Error`,sub:`別再每天和自己打仗，溫柔地改變戰場¦Stop fighting yourself every day; gently redesign the battlefield`,def:`習慣，是在固定的提示下，自動出現的行為。¦A habit is behavior that appears automatically after a fixed cue.`,
pl:`真正穩定的行為，不是每天逼自己換來的。¦Stable behavior doesn't come from forcing yourself every day.`,
mi:`手機放在枕頭旁，卻要求自己不要滑¦Phone by the pillow, telling yourself not to scroll|零食放在桌上，卻要求自己不要吃¦Snacks on the desk, telling yourself not to eat them|運動器材收得遠遠的¦Exercise gear stored far away|一次想改十個習慣¦Trying to change ten habits at once|中斷一天，就全部放棄¦Missing one day and giving up entirely`,
co:`每天都在消耗意志力¦Willpower drains every day|久了，一定會回到最省力的那條路¦Over time you slide back to the path of least resistance`,
up:`不只改變自己，也改變環境、提示和阻力。¦Don't just change yourself — change the environment, cues and friction.`,
iq:`什麼提示，會喚醒舊習慣？¦What cue triggers the old habit?|壞習慣是不是太容易做了？¦Is the bad habit too easy?|好習慣是不是太麻煩了？¦Is the good habit too much trouble?|環境能不能直接重新設計？¦Can the environment be redesigned?|我是不是一次要求自己改太多？¦Am I demanding too many changes at once?`,
ic:`意志力用完了，就回到原本的路。¦When willpower runs out, you return to the old path.`,
rp:`一直靠意志力撐著。¦Relying entirely on willpower.`,ri:`環境是不是每天都在喚醒舊行為？¦Is the environment triggering the old behavior every day?`,rc:`意志力用完，就回到老路。¦Willpower spent, back to the old road.`,
rm:`找出提示¦Find the cue|移開壞的提示¦Remove bad cues|讓壞習慣多一點阻力¦Add friction to bad behavior|讓好習慣少一點阻力¦Reduce friction for good behavior|設計一個替代的行為¦Create a replacement behavior|一次只改一兩個習慣¦Change only 1–2 habits at a time|中斷了就立刻重新開始，不必全有全無¦Restart right after a lapse; no all-or-nothing`,rk:`改變環境，比責備自己更有效。¦Changing the environment works better than scolding yourself.`,
cs:`手機放床邊，要求自己不要滑¦Phone by the bed, telling yourself not to scroll|桌上全是零食，要求自己節制¦A desk full of snacks, demanding self-control|跑鞋收在櫃子最深處，卻想天天跑步¦Running shoes in the back of the closet, hoping to run daily|一次決定戒糖、運動、早睡、讀書全部一起來¦Quitting sugar, exercising, sleeping early and studying all at once|一天沒做到，就整個放棄¦Missing one day and giving up completely|每次都說「明天我一定更有自制力」¦Always saying "Tomorrow I'll have more self-control"`,
cc:`意志力耗盡，回到最省力的路。¦Willpower exhausted → back to the path of least resistance.`,cr:`提示＋環境＋阻力＋替代行為。¦Cue + environment + friction + replacement behavior.`,cl:`不要每天和自己打仗，重新設計戰場。¦Stop fighting yourself daily; redesign the battlefield.`,
dx:`什麼提示最容易喚起這個行為？¦What cue most easily triggers this behavior?|錯的行為是不是非常容易做？¦Is the wrong behavior very easy to do?|對的行為是不是步驟太多？¦Does the right behavior take too many steps?|我是不是一直依靠意志力？¦Am I relying on willpower?|如果重新設計環境，這個習慣會不會容易很多？¦Would redesigning the environment make this habit much easier?`,dr:`「是」越多，別再責怪自己，先改環境。¦Many YESes → stop blaming yourself; change the environment first.`,
q:`我改習慣，主要靠「這次一定要有自制力」。¦I change habits mainly by telling myself "this time I'll have self-control."|誘惑通常就在手邊，對的行為反而很麻煩。¦Temptation is usually at hand, while the right behavior is a hassle.|中斷一天之後，我很容易就整個放棄。¦After missing one day, I easily give up entirely.`,qy:`不只改意志力，也改提示與環境。¦Change cues and environment, not just willpower.`,
ac:`找出提示。¦Find the cue.|移開壞的提示。¦Remove the bad cue.|增加壞習慣的阻力。¦Increase friction for the bad habit.|降低好習慣的阻力。¦Reduce friction for the good habit.|設計一個替代行為。¦Design a replacement behavior.|不要連續錯過兩次。¦Never miss twice.`,
da:`記下「提示→行為→獎賞」。¦Log cue → behavior → reward.`,sy:`設計讓好行為成為預設的環境。¦Design environment defaults.`,kp:`不靠意志力，也能持續。¦It lasts without relying on willpower.`,al:`讓對的行為，成為最容易的行為。¦Make the right behavior the easiest one.`,
lk:`完全靠意志力¦Relying only on willpower`,core:`提示＋阻力＋環境¦Cue + friction + environment`,pr:`RP17 Habit Environment`,fa:`移開一個壞提示¦Remove one bad cue`});

e({n:18,lv:3,en:`TIME`,zh:`時間錯誤¦Time Error`,sub:`不是沒有時間，是還沒把時間留給重要的事¦It's not lack of time — it's not yet saving time for what matters`,def:`時間錯誤，是時間的估算與分配出了偏差。¦A time error is misestimating and misallocating time.`,
pl:`時間估錯了、排錯了、也塞得太滿了。¦Time is misjudged, misplanned and overpacked.`,
mi:`事情永遠排得太滿¦Always overscheduling|沒有留下緩衝¦No buffer|每件事都說很急¦Calling everything urgent|最清醒的時間拿去回訊息¦Using your clearest hours for messages|重要的事一直往後延¦Postponing important things|低估完成需要的時間¦Underestimating how long tasks take`,
co:`每天都在趕¦Rushing every day|長期焦慮¦Chronic anxiety|品質下降¦Quality drops|重要但不急的事，永遠沒有開始¦Important-but-not-urgent things never begin`,
up:`排序＋時間區塊＋緩衝。¦Priority + time block + buffer.`,
iq:`這件事真的重要嗎？¦Is this really important?|還是只是很急？¦Or just urgent?|我估的時間，和過去的經驗相符嗎？¦Does my estimate match past reality?|我有留緩衝嗎？¦Is there a buffer?|今天最好的時光，有給最重要的事嗎？¦Did today's best hours go to the most important thing?`,
ic:`每天都很趕，真正重要的事卻一直沒完成。¦Rushed daily while the truly important things stay undone.`,
rp:`時間估錯、排錯、塞太滿。¦Time misestimated, misplanned and overpacked.`,ri:`重要的事，真的拿到時間了嗎？¦Did the important things actually get time?`,rc:`永遠很趕，核心的事永遠延後。¦Always rushing; core tasks always postponed.`,
rm:`用過去實際花的時間 ×1.2～1.5 來估¦Estimate with past actual time × 1.2–1.5|每天留一點緩衝¦Keep a daily buffer|先排重要的，再排緊急的¦Schedule important before urgent|用時間區塊保護重要的事¦Use time blocks|限制每天的核心任務數量¦Limit daily core tasks|週末比一比預估和實際¦Compare estimate and actual at the weekend`,rk:`別把一天排滿，讓生活有一點呼吸的空間。¦Don't fill the day; give the system a buffer.`,
cs:`替今天的自己排了十件事¦Scheduling ten things for today|每次都以為 30 分鐘能完成，實際花了 90 分鐘¦Always expecting 30 minutes; it takes 90|行程完全沒有緩衝¦No buffer in the schedule at all|早上最清醒的一小時拿去回 LINE¦Spending your clearest morning hour on LINE|重要計畫一直被小事打斷¦Important plans constantly interrupted by small things|所有邀約都答應¦Saying yes to every invitation`,
cc:`忙碌、遲到、焦慮、重要的事一直延後。¦Busyness, lateness, anxiety, important things postponed.`,cr:`用過去校準時間＋時間區塊＋20～30% 的緩衝。¦Historical calibration + time blocks + 20–30% buffer.`,cl:`排滿不是效率，是系統沒有容錯的空間。¦A full schedule isn't efficiency; it's a system with no margin for error.`,
dx:`我是不是常常低估事情需要的時間？¦Do I often underestimate time needed?|行事曆是不是長期排滿？¦Is my calendar always full?|我有留緩衝嗎？¦Do I keep a buffer?|最清醒的時間，有給最重要的事嗎？¦Do my clearest hours go to the most important things?|我每天完成很多事，卻沒完成真正重要的那件？¦Do I complete many things daily but not the truly important one?`,dr:`「是」越多，重新排序，也重新校準時間。¦Many YESes → redo priority + time calibration.`,
q:`我常把一天排得很滿。¦I often pack my day completely.|事情實際花的時間，常常比我估的更久。¦Things usually take longer than I estimate.|重要但不急的事，常被我一直延後。¦I keep postponing important-but-not-urgent things.`,qy:`校準時間＋留下緩衝。¦Time calibration + buffer.`,
ac:`今天只留下三件事。¦Keep only a Top 3 today.|用過去的紀錄估算實際工時。¦Estimate with your past records.|預留 20～30% 的緩衝。¦Reserve a 20–30% buffer.|先排深度工作。¦Schedule deep work first.|相似的事情放在一起做。¦Batch similar tasks.`,
da:`晚上比一比預估和實際。¦Compare estimate vs actual each evening.`,sy:`建立屬於你的時間校準資料庫。¦Build a personal time calibration database.`,kp:`延誤變少，重要的事完成得更多。¦Delays ↓, important task completion ↑.`,al:`時間管理的核心，不是塞更多，而是估得更準。¦Time management isn't about fitting more in; it's about estimating better.`,
lk:`低估時間、沒有緩衝¦Underestimating time, no buffer`,core:`校準時間＋緩衝¦Time calibration + buffer`,pr:`RP18 Time Calibration`,fa:`預估 vs 實際¦Estimate vs actual`});

e({n:19,lv:3,en:`ENERGY`,zh:`能量錯誤¦Energy Error`,sub:`照顧好時間之前，先照顧好你自己¦Before managing time, take care of yourself`,def:`能量，是你此刻可以使用的身心資源。¦Energy is your available physical and mental resource.`,
pl:`有兩個小時，不代表那兩個小時都一樣明亮。¦Having two hours doesn't mean both hours are equally bright.`,
mi:`睡不夠，還要求自己高效率¦Demanding high output on too little sleep|一直工作，沒有恢復¦Working nonstop without recovery|最累的時候處理最難的問題¦Tackling the hardest problems when most tired|休息的時候充滿罪惡感¦Feeling guilty while resting|用咖啡硬撐身體的訊號¦Using coffee to override your body's signals`,
co:`注意力下降¦Attention drops|判斷力下降¦Judgment drops|情緒調節下降¦Emotional regulation drops|錯誤率上升¦Error rate rises`,
up:`讓事情配合你此刻的能量。¦Match tasks to your energy state.`,
iq:`我現在的能量是高、中，還是低？¦Is my energy high, medium or low?|這件事需要多少心力？¦How much mental energy does this task need?|我是不是長期在透支？¦Am I chronically overdrawn?|最近有好好恢復嗎？¦Have I truly recovered lately?|是不是該先恢復，再處理問題？¦Should I recover before tackling the problem?`,
ic:`判斷、注意力與情緒調節，一起往下掉。¦Judgment, attention and emotional regulation all decline.`,
rp:`有時間，卻沒有可用的狀態。¦Having time, but no usable state.`,ri:`這件事和我現在的能量相配嗎？¦Does this task match my current energy?`,rc:`效率、判斷、情緒控制一起下降。¦Efficiency, judgment and emotional control drop together.`,
rm:`建立自己的能量基準¦Build an energy baseline|能量高時，做最費腦的事¦Do high-cognition tasks when energy is high|能量低時，做例行的事¦Do routine tasks when energy is low|把恢復正式排進行程¦Schedule recovery formally|不要長期向未來借能量¦Don't keep borrowing from future energy|長期低能量，要找找底層的原因¦Look for root causes of persistent low energy`,rk:`照顧好能量，才能真正照顧好時間。¦Manage energy to truly manage time.`,
cs:`熬夜之後，硬做重大決定¦Making major decisions after staying up all night|在最累的晚上寫最難的文章¦Writing the hardest article on your most tired night|連續工作七天，沒有恢復¦Working seven days straight without recovery|休息時一直覺得在浪費時間¦Feeling like you're wasting time while resting|累了只靠咖啡繼續壓¦Suppressing fatigue with coffee alone|下午能量低，還硬排高難度的工作¦Scheduling demanding work in your low-energy afternoon`,
cc:`效率、創造力、判斷與情緒調節一起往下。¦Efficiency, creativity, judgment and emotional regulation decline together.`,cr:`能量基準＋任務和狀態配對＋恢復。¦Energy baseline + task-state matching + recovery.`,cl:`不是每一個小時，都有一樣的價值。¦Not every hour has the same value.`,
dx:`我現在的能量是高、中還是低？¦Is my energy high, medium or low now?|這件事需要多少能量？¦How much energy does this task need?|事情和狀態相配嗎？¦Do task and state match?|我是不是長期靠意志力、咖啡或壓力撐著？¦Am I running on willpower, coffee or stress?|最近有好好恢復嗎？¦Have I truly recovered lately?`,dr:`能量低、要求高時，先修復能量，別只修效率。¦Low energy + high demand → fix energy first, not just efficiency.`,
q:`我常在最累的時候，處理最重要的事。¦I often handle the most important things when I'm most tired.|我很少依照自己的能量安排不同的事。¦I rarely arrange tasks by my energy.|休息時我容易有罪惡感，所以長期沒有真正恢復。¦I feel guilty resting, so I never truly recover.`,qy:`讓事情和狀態相配。¦Match tasks to your state.`,
ac:`替能量打 0～10 分。¦Rate your energy 0–10.|能量高時做費腦的事。¦Do high-cognition tasks with high energy.|能量低時做輕鬆的事。¦Do low-cognition tasks with low energy.|低於自己的警戒線，先恢復。¦Recover first when below your warning line.|避免長期透支。¦Avoid long-term overdraft.`,
da:`記下睡眠、能量與表現。¦Log sleep, energy and performance.`,sy:`畫一張屬於你的能量地圖。¦Build a personal energy map.`,kp:`高價值的工作，更常落在高能量的時段。¦High-value work overlaps more with high-energy hours.`,al:`同樣的時間，不同的狀態，產出完全不同。¦Same time, different state, completely different output.`,
lk:`低能量硬做高難度的工作¦Forcing demanding work on low energy`,core:`讓任務配合狀態¦Task-state matching`,pr:`RP19 Energy Matching`,fa:`能量 0～10 分¦Energy 0–10`});

e({n:20,lv:3,en:`LEARNING`,zh:`學習錯誤¦Learning Error`,sub:`看懂了，還不等於學會了¦Understanding it isn't the same as having learned it`,def:`學習，是未來遇到問題時，你能真正想起來並用出來。¦Learning means being able to retrieve and use it when a problem comes.`,
pl:`把「看過」當成了「學會」。¦Treating "seen it" as "learned it."`,
mi:`一直重讀¦Rereading over and over|一直畫重點¦Highlighting endlessly|看了答案就覺得「我會」¦Looking at the answer and feeling "I get it"|錯題沒有分類¦Not categorizing mistakes|沒有重新測驗¦Never retesting|沒有試著教給別人¦Never teaching it to others`,
co:`考試時「明明看過，卻想不起來」¦"I definitely read it, but can't recall it" during exams|知識很多，卻用不出來¦Lots of knowledge, weak transfer`,
up:`輸入→自己提取→找出錯誤→針對練習→再測一次。¦Input → Retrieval → Error → Targeted practice → Retest.`,
iq:`不看答案，我能自己說出來嗎？¦Can I say it without looking?|我能自己做題嗎？¦Can I do the problem myself?|我能教別人嗎？¦Can I teach it?|我知道自己錯在哪一類嗎？¦Do I know which type of mistake I make?|三天後再測，我還會嗎？¦Will I still know it on a retest three days later?`,
ic:`「我明明看過」，卻還用不出來。¦"I've read it," yet I can't use it.`,
rp:`把看過當成學會。¦Mistaking seen for learned.`,ri:`不看答案，我做得出來嗎？¦Can I do it without the answer?`,rc:`很熟悉，卻還沒有真正的能力。¦High familiarity, low real ability.`,
rm:`主動提取，自己回想¦Retrieval practice|間隔一段時間再複習¦Spaced repetition|把錯題分類¦Categorize errors|找到知識的缺口¦Find the knowledge gap|針對弱點練習¦Targeted practice|再測一次¦Retest|試著教給別人¦Teach others`,rk:`別問看過幾遍，要問能不能自己想起來。¦Don't ask how many times you've read it; ask if you can recall it yourself.`,
cs:`課本看了五遍，卻從沒測過自己¦Reading the textbook five times without testing yourself|一看答案就懂，以為自己會了¦Understanding the answer instantly and assuming you know it|單字一直重讀，從不遮起來回想¦Rereading vocabulary without covering it to recall|錯題只抄正確答案¦Copying only the correct answer for mistakes|考完就把教材丟掉¦Throwing materials away after the exam|背得出定義，卻不會應用¦Reciting definitions but unable to apply them`,
cc:`熟悉感被誤認成真正的掌握。¦Familiarity mistaken for mastery.`,cr:`提取→分析錯誤→針對練習→再測。¦Retrieval → error analysis → targeted practice → retest.`,cl:`真正的會，是答案不在眼前時，你仍然想得起來。¦Truly knowing is recalling it when the answer isn't in front of you.`,
dx:`不看資料，我能自己說出來嗎？¦Can I explain it without notes?|換一題，我還會嗎？¦Can I solve a different problem?|隔三天，我還記得嗎？¦Will I remember in three days?|我知道自己錯在哪一類嗎？¦Do I know my error type?|我能教到別人聽懂嗎？¦Can I teach it until someone understands?`,dr:`看得懂、卻想不起來也用不出來時，還不算真正學會。¦Understood but can't retrieve or transfer → not yet mastered.`,
q:`看答案覺得懂了，我就容易以為自己會了。¦When an answer makes sense, I easily assume I know it.|我的學習以重讀、畫重點為主，很少自己回想或測驗。¦I mostly reread and highlight, rarely recalling or testing myself.|錯題做完後，我很少隔幾天再測一次。¦I rarely retest my mistakes a few days later.`,qy:`提取→分析錯誤→練習→再測。¦Retrieval → error analysis → practice → retest.`,
ac:`闔上教材，自己回想。¦Close the materials and recall.|立刻測驗自己。¦Test yourself immediately.|替錯題分類。¦Classify your errors.|找出知識的缺口。¦Find the knowledge gap.|針對弱點練習。¦Practice the weak point.|隔 1 天、3 天、7 天再測。¦Retest after 1, 3 and 7 days.`,
da:`每天至少做一次主動回想。¦Do at least one retrieval practice daily.`,sy:`建立錯誤分類與技能地圖。¦Build an error taxonomy + skill graph.`,kp:`隔幾天再測的正確率上升。¦Delayed retest accuracy ↑.`,al:`學習不是放進更多，而是能順利想起、也能用在別處。¦Learning isn't more input; it's successful retrieval and transfer.`,
lk:`看懂就以為學會¦Understood = assumed learned`,core:`主動提取＋再測¦Retrieval + retest`,pr:`RP20 Retrieval Learning`,fa:`闔上教材自己測¦Close the book and test yourself`});

e({n:21,lv:4,en:`COMMUNICATION`,zh:`溝通錯誤¦Communication Error`,sub:`你說出口的，不一定是對方聽見的¦What you said isn't always what they heard`,def:`溝通，是讓兩顆心裡的地圖，盡量對齊。¦Communication aligns two people's inner models as closely as possible.`,pl:`以為我說了，你就應該懂。¦Thinking that if I said it, you should understand.`,
mi:`期待別人讀懂自己的心¦Expecting others to read your mind|說得模糊，卻期待精準的結果¦Speaking vaguely but expecting precise results|只說，不確認¦Speaking without checking understanding|只想證明自己是對的¦Only wanting to prove you're right|批評人格，而不是談行為¦Criticizing character instead of behavior|在情緒最高點談重要的事¦Discussing important things at the emotional peak`,
co:`誤會¦Misunderstanding|衝突¦Conflict|關係慢慢磨損¦Relationships wear down|雙方都覺得「我明明已經說了」¦Both feel "but I already told you"`,
up:`說明→確認→請對方說回來→再校準。¦Explain → confirm → reflect back → calibrate.`,
iq:`我真正想讓對方知道的是什麼？¦What do I really want them to know?|我說清楚了嗎？¦Did I say it clearly?|對方理解到的是哪一個版本？¦What version did they understand?|我有確認過嗎？¦Did I check?|現在是在解決問題，還是在證明誰對？¦Am I solving the problem or proving who's right?`,
ic:`兩個人都覺得說清楚了，卻活在不同的現實裡。¦Both think they spoke clearly, yet live in different realities.`,
rp:`我說出去的，不一定是對方收到的。¦What I send isn't always what they receive.`,ri:`對方理解的版本，和我的一樣嗎？¦Is their version the same as mine?`,rc:`誤會、衝突、重來。¦Misunderstanding, conflict, rework.`,
