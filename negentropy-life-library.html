<script type="text/plain" id="d-health">
# 時間增熵 × 生命力減熵｜健康修復與生活秩序行動框架
核心命題：時間不會自動讓生命變好，生命需要持續投入能量、資源與智慧，才能維持與重建秩序。
時間增熵：身體與生活系統在持續運作中，可能累積磨損、錯誤、負擔與失序。
生命力減熵：生命透過能量交換、自我調節、修復與學習，維持局部秩序。
關鍵區分：時間流逝不等於熵必然以固定速度增加，生物的局部秩序也不代表整體熱力學熵減少。
生命不是違反熵增，而是透過開放系統的能量與物質交換，持續維持自身結構。
健康不是永遠不生病，而是系統面對擾動時，仍具備調節、恢復與適應能力。
修復不是回到過去，而是讓受損功能恢復，必要時建立新的適應方式。
智慧不是控制所有變化，而是提升預測精度，及時修正失效的模型。
自由不是沒有約束，而是不再被失效的習慣與認知模式綁架。
## 一、本體層｜生命與時間的關係
01｜時間是變化發生的維度，不是直接造成所有衰退的力量。
02｜生命是持續與環境交換能量、物質與資訊的開放系統。
03｜健康是多個調節系統共同維持的動態穩定。
04｜老化涉及損傷累積、修復能力變化與調節網絡重組。
05｜疾病可能是局部功能失衡，也可能牽涉多個系統相互影響。
06｜修復需要足夠資源、適當訊號與可運作的調節機制。
07｜生命秩序不是固定不變，而是能在變動中重新組織。
08｜生命力可以作為整體功能韌性的概念，但不是單一可測量的物理量。
## 二、結構層｜健康逆熵十大模組
| 模組 | 失序表現 | 秩序重建方向 |
|---|---|---|
| 睡眠 | 節律混亂、恢復不足 | 穩定作息、改善睡眠 |
| 粒線體 | 能量利用效率下降 | 運動、營養、恢復 |
| 腸道 | 排便異常、消化不適 | 飲食多樣性、腸道照護 |
| 發炎 | 發炎調節失衡 | 找出誘因、處理根源 |
| 血糖 | 波動過大 | 飲食結構、活動 |
| 血壓 | 長期偏高或異常波動 | 監測、生活調整、必要治療 |
| 心率 | 靜息心率或節律異常 | 評估原因、改善恢復 |
| 肌肉 | 肌力流失、活動減少 | 阻力訓練、足量營養 |
| 壓力 | 長期警覺、難以放鬆 | 降低負荷、建立支持 |
| 荷爾蒙 | 節律或調節異常 | 辨識原因、適當評估 |
十大模組不是十個獨立器官，而是相互連結的調節網絡。
睡眠影響壓力調節，壓力影響飲食與活動，活動又影響睡眠及代謝。
真正的系統優化，是找到影響多個模組的關鍵瓶頸。
## 三、機制層｜五大生命秩序循環
循環01｜能量循環：營養攝取→能量轉換→活動與修復→恢復。
循環02｜節律循環：光照→清醒活動→夜間睡眠→次日功能。
循環03｜修復循環：發現損傷→啟動調節→修復或代償→功能評估。
循環04｜資訊循環：感知環境→形成預測→採取行動→接收回饋。
循環05｜更新循環：辨識誤差→調整模型→重新測試→保留有效策略。
五大循環共同形成生命自我維持與自我更新的能力。
## 四、行動層｜每天十個逆熵行動
01｜早晨接觸自然光，協助建立清醒與睡眠節律。
02｜固定睡眠與起床時間，減少不必要的節律波動。
03｜每餐重視蛋白質、蔬菜與整體營養品質。
04｜每天安排身體活動，減少長時間久坐。
05｜依個人能力進行阻力訓練，維持肌肉功能。
06｜安排短暫休息，避免長時間持續消耗注意力。
07｜減少重複性的情緒內耗，辨識真正能改變的事情。
08｜整理環境與任務，降低不必要的決策負擔。
09｜每天記錄一項健康或生活指標，建立可比較的基準。
10｜每天修正一個無效習慣，讓生活系統逐漸改善。
## 五、時間增熵行為 VS 生命秩序重建行為
| 時間中的失序行為 | 生命秩序重建行為 |
|---|---|
| 長期熬夜 | 規律睡眠 |
| 久坐不動 | 規律活動 |
| 飲食失衡 | 營養多樣化 |
| 過度工作 | 安排恢復時間 |
| 長期壓抑情緒 | 辨識與調節情緒 |
| 反覆自責 | 分析錯誤與修正 |
| 囤積無用資訊 | 整理可行動知識 |
| 重複無效習慣 | 小規模行動實驗 |
| 被動等待改變 | 主動建立回饋 |
| 只看短期感受 | 追蹤長期趨勢 |
| 忽略身體警訊 | 及早辨識與評估 |
| 過度追求完美 | 建立可持續流程 |
| 把時間填滿 | 保留恢復與思考空間 |
| 被舊身份限制 | 允許身份持續更新 |
| 只增加任務 | 刪除低價值負擔 |
## 六、生命力減熵操作系統｜LifeOS 十步閉環
STEP01｜INPUT：記錄目前的睡眠、活動、壓力、症狀與生活狀況。
STEP02｜PATTERN：辨識重複出現的失序模式。
STEP03｜BOTTLENECK：找出最值得優先處理的瓶頸。
STEP04｜PRIORITY：選擇一個高影響、低風險的改善目標。
STEP05｜MINIMUM ACTION：設計每天可以完成的最小行動。
STEP06｜PREDICTION：預測七天或十四天後可能發生的變化。
STEP07｜FEEDBACK：記錄實際結果。
STEP08｜ERROR：比較預測與實際結果的差距。
STEP09｜MODEL UPDATE：修正原本的假設與策略。
STEP10｜RETEST：再次測試，確認改善是否能持續。
## 七、生活實例｜從失序到更新
情境：每天工作到深夜，早上疲倦，下午靠咖啡提神。
舊模型：我不夠努力，所以必須更努力。
新模型：我的工作量、睡眠節律與恢復資源可能不匹配。
最小行動：連續十四天固定起床時間，減少睡前工作，記錄睡眠與精神。
預測：白天疲倦程度可能改善。
驗證：比較基準期與介入期的精神評分、睡眠時數及工作表現。
更新：如果沒有改善，重新檢查睡眠品質、健康狀況與其他干擾因素。
核心轉變：從責備自己，轉向修正系統。
## 八、生命逆熵自我檢測
每日評估十個項目，每項0～2分。
0分：未做到。
1分：部分做到。
2分：穩定做到。
01｜睡眠是否有規律？
02｜今天是否有足夠活動？
03｜飲食是否兼顧營養品質？
04｜是否保留恢復時間？
05｜是否有處理主要壓力來源？
06｜是否避免過度資訊消耗？
07｜是否完成一項重要任務？
08｜是否維持支持性的人際連結？
09｜是否辨識一個錯誤假設？
10｜是否完成一項改善行動？
總分0～20分，作為個人行為秩序追蹤指標。
此分數是自我管理工具，不是經過驗證的生命力或健康診斷量表。
重點不是與別人比較，而是觀察自己的長期變化。
（可到「自我檢測」分頁直接評分並保存紀錄。）
## 九、生命智慧｜十二句核心金句
01｜時間讓一切持續變化，智慧讓我們學會回應變化。
02｜生命不是永遠不失序，而是失序後仍有能力重新組織。
03｜真正的修復，不只是補充資源，更是改善資源如何被使用。
04｜健康不是靜止的平衡，而是持續調節的能力。
05｜生活越複雜，越需要簡單而穩定的核心習慣。
06｜能量有限，所以優先順序就是生命管理。
07｜不是所有努力都能創造秩序，有些努力只會增加負擔。
08｜真正的成長，不是累積更多答案，而是提高修正錯誤的能力。
09｜當舊方法失效，更新模型比增加意志力更重要。
10｜人生不必消除所有不確定性，而要建立面對不確定性的韌性。
11｜生命秩序不是控制每個細節，而是讓重要系統保持可調節。
12｜時間不會替你建立秩序，但你可以用每天的行動重新設計生命。
## 十、LifeOS 最終整合公式
時間流逝＋持續負荷＋修復不足→功能失序風險上升。
資源補充＋有效調節＋適當恢復＋回饋更新→功能韌性提升的機會增加。
健康管理＝辨識負荷＋改善資源配置＋促進恢復＋追蹤功能。
智慧成長＝觀察現實＋形成預測＋發現誤差＋修正模型。
LifeOS 核心閉環＝觀察→預測→行動→回饋→更新→再測試。
最終原則：不追求永遠不變的完美秩序，而是建立能持續修復、調節與更新的生命系統。

<script type="text/plain" id="d-taiji">
# 隱含金光的逆行太極圖｜生命逆熵與五重修行模型
定位：修行哲學 × 道家內丹 × 生命秩序 × 熵增與自我更新。
核心命題：順生人，逆成仙。
核心象徵：太極之中隱含金光，代表人在混亂、消耗與慣性之中，仍然存在重新建立秩序的可能。
核心區分：「逆行」不是違反自然定律，而是逆轉不利於生命整合的習慣、執著與行為模式。
【一｜本體層：順生人，逆成仙】
01｜順生人：生命順著出生、成長、欲望、消耗、衰老的自然歷程展開。
02｜逆成仙：道家內丹思想中的修行隱喻，象徵從外在追逐轉向內在整合與精神轉化。
03｜順行：注意力容易被外在刺激、欲望、恐懼與社會期待牽引。
04｜逆行：重新取得注意力、行為與價值選擇的主導權。
05｜成仙：在此模型中代表理想化的生命整合境界，不是已經證實的生物學結果。
06｜金光：象徵覺察、清明、整合與生命更新能力。
07｜太極：象徵陰陽互依、動態轉化與相反力量之間的調節。
【二｜結構層：正熵與負熵】
正熵：在熱力學中，描述熵增加的方向與條件。
負熵：可作為開放系統透過能量與物質交換維持局部有序的概念。
哲學延伸：生命中的混亂、分心與失序可以借用「熵增」作為比喻，但不能直接等同熱力學熵。
生命逆熵：透過有效輸入、減少無效消耗、建立回饋與更新模型，提升個體的調節能力。
真正的逆熵不是停止變化，而是在變化中維持可更新的秩序。
【三｜機制層：身體與心性的五重逆行】
第一重｜逆呼吸之亂：從急促、無覺察的呼吸，轉向自然、穩定、有意識的呼吸調節。
身體方向：觀察呼吸節律、姿勢與緊繃程度。
心性方向：從立即反應轉向先覺察再回應。
生活例子：被批評時先辨識情緒，不急著反擊。
第二重｜逆飲食之欲：從被即時口腹刺激牽引，轉向有節律的營養與飲食選擇。
身體方向：重視營養充足、消化舒適與規律進食。
心性方向：區分真正需求與情緒性補償。
生活例子：壓力大時先辨識疲勞與飢餓，不直接用零食解決所有不適。
第三重｜逆精力之耗：從長期過度輸出，轉向能量配置與恢復。
身體方向：安排睡眠、活動與恢復時間。
心性方向：從無限承擔轉向有邊界的責任。
生活例子：不再把替所有人解決問題當成自己的義務。
第四重｜逆情緒之執：從情緒自動化反應，轉向理解情緒背後的預測模型。
身體方向：辨識壓力下的緊繃、疲倦與身體訊號。
心性方向：區分事實、解釋、期待與恐懼。
生活例子：別人沒有回訊息，不立刻推論自己被討厭。
第五重｜逆認知之迷：從被既有身分與信念限制，轉向持續修正生命模型。
身體方向：建立可長期執行的生活系統。
心性方向：從「我就是這種人」轉向「我可以更新自己的理解與選擇」。
生活例子：考試失敗不等於能力固定，而是需要診斷策略、知識或練習方式的誤差。
【四｜五重逆行心智圖】
隱含金光的逆行太極
├第一重：呼吸逆行→由亂入定。
├第二重：飲食逆行→由欲入節。
├第三重：精力逆行→由耗入養。
├第四重：情緒逆行→由執入觀。
└第五重：認知逆行→由迷入明。
五重整合：覺察→調節→節制→整合→更新。
【五｜行動層：生命逆熵操作系統】
Step 01｜觀察：今天哪一種習慣正在消耗我的生命資源？
Step 02｜辨識：這是身體需求、情緒反應，還是舊有信念？
Step 03｜逆轉：選擇一個與舊模式不同、風險可控的行動。
Step 04｜回饋：記錄身體感受、情緒變化與實際結果。
Step 05｜更新：比較預期與現實，修正下一次的選擇。
每日練習：一次呼吸覺察、一次飲食覺察、一次精力配置、一次情緒重評、一次認知更新。
【六｜維根斯坦與海德格的哲學對應】
維根斯坦：檢查語言如何塑造我們理解世界的方式。
修行應用：當我說「我永遠失敗」，先檢查「永遠」是否超出了事實。
海德格：人容易沉入日常慣性與他人期待，也可能重新面對自身存在的選擇。
修行應用：從「大家都這樣生活」轉向「這真的是我願意承擔的生活嗎」。
道家內丹：以返本、還原與逆修表達生命轉化的方向。
系統論：以回饋、邊界、調節與適應描述秩序如何維持。
四者可以建立哲學對話，但不代表它們在歷史、概念或科學證據上完全等同。
【七｜逆行太極十句生命金句】
01｜順著慣性活，是生命的自動模式；看見慣性，才有重新選擇的可能。
02｜真正的逆行，不是逆天，而是不再盲目順從舊有模式。
03｜身體需要節律，心性需要覺察，智慧需要更新。
04｜消耗不是努力的證明，能持續恢復才是長期能力。
05｜不是所有欲望都需要壓抑，而是每個欲望都值得辨識。
06｜情緒可以被理解，不必成為行動的唯一指揮者。
07｜修行不是逃離世界，而是在世界之中建立更清明的選擇。
08｜金光不是外界賜予的神秘力量，而是此模型中生命覺察與整合的象徵。
09｜真正的自由，是舊模型出現時，我仍然有能力選擇新的回應。
10｜逆行的終點不是停止變化，而是讓生命在變化中持續生成秩序。
【八｜LifeOS母體節點建議】
節點名稱：隱含金光的逆行太極圖。
節點類型：修行與生命秩序哲學模型。
核心結構：順生人／逆成仙／正熵／負熵／五重逆行。
上位節點：生命秩序 OS。
關聯節點：道家內丹、陰陽動態、身體調節、情緒模型、預測誤差、身分更新、生命逆熵。
輸入：身體訊號、生活事件、情緒、習慣與既有信念。
處理：覺察→辨識→調節→行動→回饋。
輸出：更穩定的自我調節、更清晰的價值選擇與更可更新的生命模式。
模型邊界：哲學象徵與可測量的生理機制分開記錄，不把修行境界當作醫療效果。
終極命題：順生，是生命自然展開；逆修，是生命重新理解並調整自身；金光，是人在持續更新中所顯現的清明與秩序。

# LifeOS｜逆熵十二層生命秩序模型
**核心命題：逆熵的本質，是建立秩序；智慧的本質，是讓秩序具備自我更新能力。**
逆熵不是把人生變得僵硬，而是減少無效混亂，建立可以持續調整的生命系統。
從物理學來說，生命必須持續交換能量與物質，才能維持局部有序狀態。
從生命哲學來說，逆熵可以作為降低內耗、提高協調性與適應能力的隱喻。
真正的生命秩序，不是永遠不變，而是面對變化仍能重新組織。
## 一、逆熵十二層總表
| 層級 | 逆熵本質 | 熵增表現 | 逆熵行動 |
|---|---|---|---|
| 01 身體 | 建立生理節律 | 睡眠混亂、疲勞、活動不足 | 規律睡眠、營養、運動、恢復 |
| 02 大腦 | 建立注意力秩序 | 分心、資訊過載、反覆思考 | 專注訓練、減少切換、深度學習 |
| 03 知識 | 建立認知結構 | 知識碎片、記了就忘 | 分類、節點化、關聯、提取練習 |
| 04 語言 | 建立意義秩序 | 模糊表達、自我否定、概念混淆 | 精準命名、重新定義、更新敘事 |
| 05 情緒 | 建立調節能力 | 壓抑、爆發、反芻、情緒失控 | 辨識情緒、調節反應、建立界線 |
| 06 時間 | 建立優先順序 | 拖延、忙亂、時間碎片化 | 時間分區、重要任務優先、定期回顧 |
| 07 行動 | 建立執行閉環 | 空想、猶豫、三分鐘熱度 | 最小行動、回饋、修正、再測 |
| 08 人際 | 建立關係秩序 | 討好、衝突、責任混亂 | 明確界線、雙向溝通、責任分工 |
| 09 財務 | 建立資源秩序 | 衝動消費、現金流失控 | 預算、儲備、風險分散、定期檢視 |
| 10 環境 | 建立外部支持系統 | 雜亂、干擾、資源難找 | 空間整理、工具配置、環境設計 |
| 11 身份 | 建立自我定位 | 自我設限、依賴外界評價 | 重寫身份敘事、累積新行為證據 |
| 12 智慧 | 建立動態更新能力 | 固執、模型僵化、重複犯錯 | 預測、驗證、誤差修正、模型升級 |
## 二、十二層逆熵心智圖
逆熵生命秩序系統
├01｜身體秩序：讓身體有穩定節律。
├02｜大腦秩序：讓注意力回到重要事物。
├03｜知識秩序：讓資訊形成可以提取的結構。
├04｜語言秩序：讓概念與表達更加精準。
├05｜情緒秩序：讓感受成為訊號，而非唯一指令。
├06｜時間秩序：讓有限時間服務重要目標。
├07｜行動秩序：讓想法轉化為可驗證的結果。
├08｜人際秩序：讓關係具備界線與互惠。
├09｜財務秩序：讓資源流向真正重要的目標。
├10｜環境秩序：讓外部條件支持良好行為。
├11｜身份秩序：讓自我定義隨成長而更新。
└12｜智慧秩序：讓所有系統持續學習與重構。
## 三、十二層的四大運作機制
**本體層｜生命是持續變化的開放系統。**
人不是固定的身份，而是身體、認知、關係與環境持續互動的過程。
**結構層｜十二層相互連結。**
睡眠不足可能影響注意力，注意力下降可能干擾工作，工作失序又可能增加壓力。
因此，十二層不是十二個孤島，而是一張相互影響的生命網絡。
**機制層｜透過負回饋維持穩定，透過模型更新增加適應性。**
負回饋負責修正偏差，避免系統失控。
模型更新負責重新理解問題，避免反覆使用失效策略。
**行動層｜從最小可行改變開始。**
每次選擇一個高影響節點，觀察改變是否帶動其他層級。
## 四、十二層逆熵的生活化例子
01｜身體逆熵：從每天熬夜到固定睡眠時段。
02｜大腦逆熵：從手機訊息不斷打斷，到每天安排30分鐘專注時間。
03｜知識逆熵：從收藏100篇文章，到整理成10個可以應用的知識節點。
04｜語言逆熵：從「我什麼都做不好」，改成「我目前還沒有找到有效方法」。
05｜情緒逆熵：從一生氣就回訊息，到先辨識情緒與真正需求。
06｜時間逆熵：從每天忙十件事，到先完成最重要的一件事。
07｜行動逆熵：從等待完美計畫，到每天完成一個最小實驗。
08｜人際逆熵：從承擔所有人的責任，到分清自己與他人的責任。
09｜財務逆熵：從有錢就花，到建立預算與緊急預備金。
10｜環境逆熵：從找資料花20分鐘，到建立固定命名與分類系統。
11｜身份逆熵：從「我就是拖延的人」，改成「我是正在建立執行系統的人」。
12｜智慧逆熵：從「我一定是對的」，改成「什麼證據會讓我更新判斷」。
## 五、十二層逆熵的三個升級階段
**第一階段｜止亂。**
辨識目前最大的混亂來源，減少不必要的能量消耗。
**第二階段｜建序。**
建立規律、界線、分類、流程與可持續的行動習慣。
**第三階段｜活序。**
讓既有秩序可以根據新資訊調整，而不是被舊規則綁架。
止亂讓生活不再持續失控。
建序讓生活開始穩定運作。
活序讓生命具備面對未知的適應能力。
## 六、LifeOS 十二層逆熵操作系統
Step 01｜Observation：觀察十二層目前的狀態。
Step 02｜Diagnosis：找出最主要的混亂來源。
Step 03｜Pattern：辨識反覆出現的舊模式。
Step 04｜Bottleneck：尋找限制整體運作的瓶頸。
Step 05｜Priority：選出最值得先改變的節點。
Step 06｜Minimum Action：設計每天可以完成的最小行動。
Step 07｜Feedback：記錄實際行動與結果。
Step 08｜Prediction Error：比較預測與實際差距。
Step 09｜Model Update：修正失效的解釋與策略。
Step 10｜Retest：七天、三十天、九十天重新檢驗。
## 七、十二層逆熵自我檢測
每層評分0～5分。
0分＝高度混亂，幾乎沒有有效管理。
1分＝經常失序，主要依靠臨時補救。
2分＝偶爾有序，但無法穩定維持。
3分＝已有基本規律，仍需經常調整。
4分＝大致穩定，能主動辨識問題。
5分＝有明確系統，能持續回饋與更新。
十二層總分為60分。
總分可以追蹤個人變化，但不是經過驗證的醫學或心理診斷量表。
比總分更重要的是找出低分層級與跨層影響。
例如身體只有2分、大腦3分、時間2分，可能值得先檢查睡眠與工作安排，而不是直接增加自律要求。
（可到「自我檢測」分頁直接評分並保存紀錄。）
## 八、十二層逆熵金句
01｜身體的逆熵，是讓生命重新找回節律。
02｜大腦的逆熵，是把注意力從雜訊中解放。
03｜知識的逆熵，是把資訊變成可以使用的智慧資源。
04｜語言的逆熵，是用更精準的概念重新理解人生。
05｜情緒的逆熵，不是沒有波動，而是不被波動綁架。
06｜時間的逆熵，不是塞滿行程，而是建立優先順序。
07｜行動的逆熵，是讓每一次嘗試都產生回饋。
08｜人際的逆熵，是讓愛與責任都有清楚的界線。
09｜財務的逆熵，是讓資源流動服從長期價值。
10｜環境的逆熵，是讓好的選擇更容易發生。
11｜身份的逆熵，是不再被過去的自我定義限制。
12｜智慧的逆熵，是讓每一次錯誤都成為模型更新的材料。
## 最終命題
**最終命題：低階秩序追求穩定，高階秩序兼具穩定與可更新性。**
真正的逆熵，不是消滅所有混亂，而是讓生命擁有從混亂中重新組織的能力。
真正的成長，不只是累積更多知識，而是提升經過現實驗證的預測精度。
真正的自由，不是沒有任何限制，而是有能力辨識、修正與超越失效的舊模型。
**生命的最高秩序，不是永遠不犯錯，而是永遠保有修正錯誤的能力。**

LINE 自律模型完整版適合用於社群分享、LINE 課程、陪跑訓練與日常提醒。它把自律概念整理成容易閱讀、容易轉傳、容易執行的形式，幫使用者在每天生活中保持方向感。自律最難的不是知道該做什麼，而是持續回到行動；這個 APP 的設計能讓使用者快速看見今日重點、阻力來源與下一步做法。它很適合搭配打卡、任務管理與學習群組，形成穩定的行動氛圍。
11. 系統 Debug 180 分析
設計名字：人生系統除錯儀
系統 Debug 180 分析是一套幫助使用者檢查人生、工作、學習與關係中卡點的分析工具。它把問題視為系統錯誤，而不是單純責怪個人。使用者可以透過多項分析角度，找出流程斷點、能量漏洞、認知偏差、環境干擾與決策盲區。它適合用在自我反思、團隊檢討、學習瓶頸與生活調整。推薦它的原因，是因為它讓混亂變得可診斷，讓人可以用工程化方式修復自己的系統。
12. LINE 顯化終極完整版
設計名字：願景顯化行動系統
LINE 顯化終極完整版把願望、信念、想像、行動與回饋整合成一套可分享的工具。它適合用於個人成長、目標設定、社群陪跑與每日提醒。顯化不是單純許願，而是把內在信念、注意力方向與外在行動對齊。這個 APP 幫使用者整理想要的生活狀態，辨認阻礙自己的信念，並透過具體行動逐步靠近目標。它適合希望把夢想變成可執行計畫的人。
13. 生命 OS 決策樹
設計名字：人生選擇導航樹
生命 OS 決策樹是一套幫助使用者做選擇的工具。面對人生、工作、關係或學習抉擇時，人常被情緒與資訊淹沒，不知道該從哪裡判斷。這個 APP 透過樹狀邏輯，把決策拆成條件、風險、價值、資源與後果，讓使用者一步一步看清選項。它適合重大決策前使用，也適合教練、顧問、老師帶領討論。它的價值是讓選擇不再只是衝動，而是可推理、可比較、可回顧。
14. 能力養成系統 350 完整版
設計名字：350 能力養成地圖
能力養成系統 350 完整版是一套更大規模的能力清單與訓練地圖。它適合想全面盤點自己能力、規劃長期成長路線的人。內容涵蓋學習、表達、判斷、情緒、關係、工作、創造、領導與生活管理等多個層面。使用者可以用它檢查目前能力位置，找到最需要補強的項目，並把模糊的成長願望轉成具體訓練方向。它像是一張能力宇宙地圖，幫助人看見自己可以如何進化。
15. 整合醫學 OS 版本
設計名字：整合醫學全景探索版
整合醫學 OS 版本是一套把身體、疾病、生活方式、恢復能力與醫療選擇放在同一張地圖中理解的工具。它適合病友、家屬、健康管理者與醫療學習者使用。整合醫學重視的不只是疾病名稱，而是整個人的狀態，包括睡眠、營養、壓力、代謝、免疫與生活環境。這個 APP 幫使用者建立更完整的健康觀，學會用系統方式理解身體，而不是只看單一症狀。
16. 整合醫學 OS 完整版
設計名字：整合醫學深度作業系統
整合醫學 OS 完整版提供更完整的醫學與生活健康整理框架。它適合想深入理解慢性病、癌症照護、代謝問題、免疫狀態與身心壓力關係的人。這個 APP 的功能重點，是把醫療資訊從零散資料整合成可閱讀、可追蹤、可討論的知識系統。使用者可以用它準備看診問題、整理健康策略，也能作為健康教育教材。它幫助人用更全面、更穩定的方式面對健康議題。
17. 整合醫學 OS
設計名字：整合醫學入門導航器
整合醫學 OS 是一個適合入門使用的健康理解工具。它把醫學知識、生活習慣與身體狀態連接起來，幫使用者理解疾病不只是單一器官問題，而是整體系統失衡的結果。它適合想提升健康素養、照顧家人、或建立預防醫學觀念的人。透過這個 APP，使用者可以更清楚地理解營養、睡眠、壓力、活動與醫療照護之間的關係，建立更有方向的健康管理方式。
18. 高主動性 OS 完整版
設計名字：高主動人生啟動器
高主動性 OS 完整版是一套培養主動性、責任感與行動掌控力的工具。它適合容易被環境推著走、想提升自我驅動能力的人。高主動性不是忙碌，而是能主動定義目標、辨認機會、承擔選擇並持續調整行動。這個 APP 幫使用者看見被動模式，建立更清楚的自我領導方式。它適合職涯成長、創業準備、學生自學與個人轉型，能幫助人從等待變成創造。
19. 生命 OS 雙語 APP
設計名字：雙語生命系統學習器
生命 OS 雙語 APP 把生命管理與雙語學習結合，適合想同時提升人生理解與英文能力的人。它用中英文對照的方式整理生命系統概念，幫使用者理解健康、情緒、關係、能力與決策。雙語設計能讓學習者在吸收內容的同時累積英文詞彙與句型。這個 APP 不只是語言教材，也是一套生命整理工具。使用者可以透過它建立更清楚的人生地圖，並提升跨語言表達能力。
20. 雙語壓縮 APP
設計名字：雙語概念壓縮器
雙語壓縮 APP 幫使用者把複雜概念壓縮成清楚、短小、可記憶的表達。它適合學習英文、整理知識、做筆記、準備簡報或寫文案的人。許多知識之所以難用，是因為太長、太散、太難抓核心；這個 APP 的價值，就是把內容轉成精準句子，並用中英文形式呈現。使用者可以透過它練習摘要、翻譯、重組與概念命名，提升語言效率，也提升思考清晰度。
21. 生命壓縮公式完整版
設計名字：生命公式壓縮大全
生命壓縮公式完整版是一套把人生經驗、策略與智慧濃縮成公式的工具。它適合想快速理解複雜概念、建立行動原則與整理思考的人。公式化不是簡化人生，而是幫使用者抓住核心關係，例如投入與回報、壓力與恢復、選擇與成本、習慣與結果。這個 APP 可以作為每日反思、教學素材、社群內容與自我訓練工具。它讓抽象智慧變成更容易記住、傳達與應用的形式。
22. 代謝控制儀表板
設計名字：代謝狀態監控台
代謝控制儀表板是一個健康管理工具，幫使用者理解飲食、活動、睡眠、壓力與代謝狀態之間的關係。它適合關心體重、血糖、能量、疲勞與生活型態調整的人。代謝不是只看熱量，而是身體處理能量與恢復能力的整體系統。這個 APP 透過儀表板概念，讓使用者更容易觀察自己的狀態，找出影響代謝的關鍵因素，並逐步建立更穩定的健康節奏。
23. 身分 OS 雙語 APP
設計名字：雙語身分重塑系統
身分 OS 雙語 APP 幫使用者理解自我認同、角色定位與人生敘事。很多改變卡住，不是因為方法不足，而是舊身分仍在主導行為。這個 APP 用雙語方式整理身分建構的概念，幫使用者看見自己如何定義自己、如何被過去限制、如何建立新的行動身分。它適合自我成長、語言學習、職涯轉型與心理反思。使用者可以透過它重新命名自己，建立更有力量的自我故事。
24. 生命 OS 340 能力
設計名字：生命能力 340 全圖譜
生命 OS 340 能力是一套大型能力盤點工具，幫使用者理解人生需要哪些核心能力支撐。它涵蓋學習力、思考力、情緒力、行動力、關係力、健康力與創造力等面向。適合用於自我評估、課程設計、個人成長規劃與教練陪跑。使用者可以用它找出目前最需要提升的能力，也能規劃長期訓練順序。它的價值在於把成長從模糊願望變成具體地圖。
25. 壓縮 OS
設計名字：高效壓縮思考系統
壓縮 OS 是一套幫助使用者把資訊、經驗與知識壓縮成可用結構的工具。現代人接收太多內容，卻常缺少整理能力；這個 APP 幫助使用者抓重點、取核心、命名概念，並把複雜內容轉成短句、公式或模型。它適合學生、創作者、知識工作者、講師與管理者。透過壓縮能力，使用者能更快理解資訊，也更容易輸出清楚有力的觀點，提升學習與表達效率。
26. 醫療證據購物 OS
設計名字：醫療證據選擇導航器
醫療證據購物 OS 是一個幫助使用者面對醫療資訊、產品與療法選擇時做出更理性判斷的工具。它適合病友、家屬與健康管理者使用。面對保健品、療法、檢查與醫療建議時，人很容易被恐懼或廣告影響；這個 APP 幫使用者用證據等級、風險、成本、適用性與替代方案來思考。它不是替代醫師，而是提高提問與判斷能力，讓健康選擇更清楚、更安全。
27. 淋巴完整系統
設計名字：淋巴循環健康地圖
淋巴完整系統是一套幫助使用者理解淋巴循環、免疫、代謝廢物排除與身體恢復的健康工具。許多人只注意血液循環，卻忽略淋巴系統對水腫、免疫、發炎與身體清理的重要性。這個 APP 適合健康學習者、照護者、運動恢復與生活保健使用。它能幫助使用者理解淋巴如何運作、哪些生活習慣會影響循環，以及如何用更整體的方式照顧身體恢復能力。

【hc02184｜2026.07.23 15:12｜35 個新上架到福利會員LifeOs平台的 APP。】
35 個新上架到福利會員LifeOs平台的 APP。
1. 抗癌系統
抗癌系統是一套幫助使用者理解癌症風險、生活習慣、免疫支持與身體修復邏輯的工具。它用系統化方式整理飲食、壓力、睡眠、發炎與代謝觀念，讓健康管理不再零散。適合想提升抗癌意識、建立日常防護策略的人。
2. 信念身分系統
信念身分系統幫你看懂「我相信什麼」如何影響「我成為誰」。它把信念、身份、行為與人生結果串成一套清楚模型，適合想突破自我限制、改寫內在劇本、重建自信與行動力的人。這是一套深層自我升級工具。
3. 信念系統
信念系統是一套整理內在想法、人生選擇與行動模式的工具。很多問題不是能力不足，而是底層信念卡住。這個 APP 幫你辨識限制性信念、建立支持性信念，讓學習、關係、事業與健康都能從根本重新調整。
4. 信念系統 V2
信念系統 V2 是進階版的內在升級工具，更適合想深度整理人生模式的人。它幫你把反覆出現的焦慮、拖延、自我懷疑與關係卡點，回推到底層信念。透過系統化分析，你能更快找到真正需要改寫的內在設定。
5. 身體訊號系統
身體訊號系統幫你把疲勞、疼痛、睡眠、食慾、情緒與壓力反應，看成身體正在傳遞的訊息。它不是單純記錄症狀，而是幫你理解身體警訊背後可能的生活節奏、營養、壓力與恢復問題，適合重視健康管理的人。
6. 大腦更新系統
大腦更新系統是一套幫助你重新訓練思考模式、學習能力與行動反應的工具。它適合想擺脫舊習慣、提升專注、改善情緒反應與建立新行為的人。透過大腦更新觀念，你可以更有方法地重塑自己的日常運作。
7. 皮質醇系統
皮質醇系統幫你理解壓力荷爾蒙如何影響睡眠、體重、免疫、情緒與能量。很多疲累不是意志力不足，而是壓力系統長期失衡。這個 APP 適合想降低內耗、改善作息、穩定情緒與恢復身體節奏的人。
8. 功能健康系統
功能健康系統從整體角度看健康，不只看單一症狀，而是整合睡眠、代謝、壓力、腸道、營養與活動量。它適合想建立長期健康策略的人，幫助你看懂身體功能如何彼此影響，讓健康管理更有邏輯。
9. 健康診斷系統
健康診斷系統是一套自我觀察與健康整理工具，幫你從日常症狀、生活習慣、壓力狀態與能量變化中找到可能問題。它適合想先了解自己身體狀態、整理就醫前資訊、建立健康改善方向的人。
10. 人性系統
人性系統幫你看懂人為什麼會逃避、比較、執著、防衛、依賴或重複某些模式。它適合用在人際關係、自我覺察、溝通與決策上。當你更懂人性，就能更少被情緒牽著走，更清楚地理解自己和別人。
11. 福利會員入口 1
福利會員入口 1 是一個整合型學習與資源入口，適合把不同主題工具集中使用。它可以作為會員內容、課程資源、學習任務與系統工具的快速入口，讓使用者不用到處找檔案，一打開就能進入重點內容。
12. 字根字綴系統
字根字綴系統幫你用拆字方式記英文，不再只靠死背。它把字首、字根、字尾整理成可理解的結構，讓單字變得有邏輯、有關聯。適合學測、多益、醫學英文與長期英文能力養成。
13. 英文學測糾錯題本
英文學測糾錯題本專門幫學生整理常錯題型、文法盲點、閱讀陷阱與選項判斷。它不是只給答案，而是幫你看懂自己為什麼錯。適合考前複習、補強弱點、建立高分答題策略。
14. 憂遁草系統
憂遁草系統整理憂遁草相關知識、健康應用與日常使用觀念。它適合對草本保健、抗發炎、生活調理有興趣的人。透過系統化內容，使用者可以更清楚理解憂遁草的角色與使用方向。
15. 醫學入口
醫學入口是一個整理醫學學習內容的快速平台，適合需要查找醫學概念、學習架構或複習資料的人。它把分散內容集中起來，讓醫學學習更有路徑，也適合學生、備考者與健康知識學習者使用。
16. 字根背字
字根背字是一套幫助你快速累積英文單字的工具。它用字根、字首、字尾建立記憶邏輯，讓單字不再是孤立資訊。適合學測、多益、醫學英文與長期英文升級，尤其適合想有效率背字的人。
17. 關係工程白底版
關係工程白底版幫你用系統角度理解人際互動、親密關係、溝通衝突與情緒需求。它適合想改善伴侶、家庭、職場或朋友關係的人。透過結構化分析，你能更清楚看見關係問題的根源。
18. 醫學字根
醫學字根專為醫學英文學習設計，幫你拆解複雜醫學單字的字根、字首與字尾。它適合醫護學生、考生、醫學英文學習者使用。掌握字根後，面對陌生醫學字也能推測意思，學習效率大幅提升。
19. 精油系統
精油系統整理精油知識、用途、身心調理與生活應用。它適合對芳香療法、情緒舒緩、睡眠支持與日常保健有興趣的人。透過分類整理，你可以更安全、更有邏輯地理解精油使用方式。
20. TOEIC 系統
TOEIC 系統幫助多益學習者整理聽力、閱讀、單字、文法與題型策略。它適合想提升職場英文分數的人，不只是刷題，而是建立答題邏輯、常見陷阱辨識與時間管理能力，讓備考更有效率。
21. 人格工程
人格工程是一套自我理解與性格調整工具，幫你看懂自己的反應模式、情緒習慣、關係選擇與行動風格。它適合想改變舊人格慣性、建立新身份感、提升穩定度與主動性的人。
22. 英文字族系統
英文字族系統把英文單字依照字族、字根與語意關聯整理，讓你一次學會一整串相關詞。它適合想擴大字彙量、提升閱讀速度與寫作表達的人。比起零散背單字，字族學習更有效率。
23. 高中核心能力
高中核心能力系統幫學生整理學習、閱讀、表達、推理、寫作與考試所需能力。它適合高中生、自學生與家長使用，能把「要變強」拆成具體能力清單，幫助學習不再只靠感覺。
24. 醫學入口 2
醫學入口 2 是另一個醫學學習與整理入口，適合用來分類醫學內容、查找觀念與複習主題。它能幫助使用者把龐大的醫學資訊變得更有架構，適合備考、課程學習與健康知識整理。

醫學字根有發音結合字根拆解與發音學習，特別適合醫學英文初學者。它不只幫你看懂醫學字，也幫你唸得出來。對醫護學生、醫學考試、英文病歷與專業溝通都很實用。
26. 語言升級 OS 簡版
語言升級 OS 簡版幫你快速改善表達方式，把普通句子升級成更精準、更有層次、更有說服力的語言。適合社群寫作、簡報、英文學習、溝通表達與自我整理，是輕量但實用的語言工具。
27. 語言升級 OS
語言升級 OS 是完整的表達力升級系統，幫你從詞彙、句型、邏輯、情緒張力與高階思考全面提升語言能力。適合內容創作者、學生、講師、業務與任何想讓文字更有力量的人。
28. 語言升級系統
語言升級系統幫你把低階表達轉成高階表達，讓說話、寫作、社群貼文與簡報更清楚、更有感染力。它適合想提升中文與英文表達品質的人，尤其適合需要大量輸出內容的人。
29. 模型升級系統
模型升級系統幫你更新思考框架，把舊有判斷方式升級成更精準的模型。它適合用在學習、商業、人生規劃、決策與自我成長。當模型升級，選擇品質和行動效率也會跟著提升。
30. 預測系統
預測系統幫你理解如何觀察趨勢、判斷變化、推估結果與修正策略。它適合想提升決策能力、學習判斷力、商業敏感度與人生規劃的人。好的預測不是猜，而是建立可修正的思考系統。
31. 節律營養系統
節律營養系統把飲食、作息、生理時鐘與能量管理結合起來。它適合想改善疲勞、代謝、睡眠與飲食節奏的人。不是只看吃什麼，也看什麼時間吃、身體如何反應，讓健康更有節奏。
32. 憂遁系統
憂遁系統整理憂遁草、健康調理與身體支持的相關內容。它適合對自然保健、抗發炎、生活健康管理有興趣的人。透過系統化方式，你可以更清楚掌握使用方向與日常應用場景。

字根王學測常考字根專門針對高中英文與學測常見字根設計，幫學生用結構記憶單字。它適合想快速補字彙、提升閱讀理解與考試分數的人。學會字根，背單字會更快、更穩。

情緒導航 APP 幫你辨識情緒、理解情緒背後的需求，並找到更好的回應方式。它適合容易焦慮、內耗、壓抑或情緒混亂的人。透過導航式整理，你能更快回到穩定與清楚。

愛的覺醒之書是一套關於愛、關係、覺察與內在成長的閱讀工具。它適合想修復關係、理解愛的模式、提升自我價值與情感成熟度的人。內容溫柔但有力量，適合靜下來慢慢閱讀。

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const raw=id=>{const e=document.getElementById(id);return e?e.textContent:''};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function today(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
const SK='lifeos-entropy-db-v1';
let ST={};try{ST=JSON.parse(localStorage.getItem(SK)||'{}')||{}}catch(e){ST={}}
function save(){try{localStorage.setItem(SK,JSON.stringify(ST))}catch(e){}}
function sget(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sset(k,v){try{localStorage.setItem(k,v)}catch(e){}}

function inline(s){
  s=esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  const m=s.match(/^([^｜<]{1,16})｜([\s\S]*)$/);
  return m?'<b class="k">'+m[1]+'</b>｜'+m[2]:s;
}
// 簡易文件渲染：# / ## / 【】 為段落標題，| 表格，├└ 樹狀
function render(text){
  const out=[];let sec=null,tbl=null,pre=null;
  const push=h=>{if(!sec)sec={t:'',h:[]};sec.h.push(h)};
  const flushT=()=>{if(!tbl)return;const [hd,...rows]=tbl;tbl=null;
    push('<div class="tw"><table><thead><tr>'+hd.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>')};
  const flushP=()=>{if(!pre)return;const p=pre;pre=null;push('<pre class="tree">'+esc(p.join('\n'))+'</pre>')};
  const close=()=>{flushT();flushP();if(sec&&sec.h.length)out.push('<section class="unit" data-t="'+esc(sec.t)+'">'+sec.h.join('')+'</section>');sec=null};
  const open=t=>{close();sec={t:t,h:[]}};
  for(const line of text.split('\n')){
    const t=line.trim();let m;
    if(!t){flushT();flushP();continue}
    if(t[0]==='|'){flushP();if(/^\|[\s\-:|]+\|?$/.test(t))continue;(tbl=tbl||[]).push(t.replace(/^\||\|$/g,'').split('|').map(x=>x.trim()));continue}
    flushT();
    if(/^[├└│┌]/.test(t)){(pre=pre||[]).push(t);continue}
    flushP();
    if(t.startsWith('# ')){open(t.slice(2));push('<h2>'+esc(t.slice(2))+'</h2>')}
    else if(t.startsWith('## ')){open(t.slice(3));push('<h3>'+esc(t.slice(3))+'</h3>')}
    else if((m=t.match(/^【(.+)】$/))){open(m[1]);push('<h3>'+esc(m[1])+'</h3>')}
    else if((m=t.match(/^\*\*(.+)\*\*$/)))push('<h4>'+esc(m[1])+'</h4>');
    else if(/^━+$/.test(t))push('<hr>');
    else push('<p>'+inline(t)+'</p>');
  }
  close();return out.join('');
}
// 熵增 vs 逆熵 卡片
function renderBeh(text){
  const out=[];let layer='',card=null,notes=[],noteT='';
  const fc=()=>{if(!card)return;const c=card;card=null;
    out.push('<div class="unit bcard" data-t="'+esc(c.n+'｜'+c.t+'（'+layer+'）')+'"><div class="bh"><span class="bn">'+c.n+'</span>'+esc(c.t)+'<span class="bl">'+esc(layer)+'</span></div>'+
    (c.a?'<div class="ba"><b>熵增</b>'+esc(c.a)+'</div>':'')+(c.b?'<div class="bb"><b>逆熵</b>'+esc(c.b)+'</div>':'')+'</div>')};
  const fn=()=>{if(!notes.length)return;out.push('<div class="unit full" data-t="'+esc(noteT)+'">'+notes.map(n=>'<p>'+inline(n)+'</p>').join('')+'</div>');notes=[]};
  for(const line of text.split('\n')){
    const t=line.trim();let m;if(!t)continue;
    if((m=t.match(/^【(.+)】$/))){fc();fn();const h=m[1];layer=h.split('｜')[0];noteT=h;out.push('<h3 class="full" style="margin:14px 0 2px">'+esc(h)+'</h3>');continue}
    if((m=t.match(/^(\d{2})｜(.+?)。?$/))&&!t.includes('：')){fc();fn();card={n:m[1],t:m[2],a:'',b:''};continue}
    if(card&&t.startsWith('熵增：')){card.a=t.slice(3);continue}
    if(card&&t.startsWith('逆熵：')){card.b=t.slice(3);continue}
    fc();notes.push(t);
  }
  fc();fn();return '<div class="grid">'+out.join('')+'</div>';
}

// ===== 文章庫 =====
function parseArchive(){
  const txt=[...document.querySelectorAll('script.arch')].map(s=>s.textContent).join('\n');
  const front=[],arts=[];let cur=null;
  for(const l of txt.split('\n')){
    const m=l.trim().match(/^【(hc\d+)｜(\d{4}\.\d\d\.\d\d \d\d:\d\d)｜(.*)】$/);
    if(m){cur={id:m[1],date:m[2],title:m[3],lines:[]};arts.push(cur);continue}
    (cur?cur.lines:front).push(l);
  }
  const byId={};arts.forEach((a,i)=>{a.no=String(i+1).padStart(3,'0');byId[a.id]=a});
  arts.forEach(a=>{while(a.lines.length&&!a.lines[a.lines.length-1].trim())a.lines.pop();while(a.lines.length&&!a.lines[0].trim())a.lines.shift()});
  arts.forEach(a=>{const m=a.lines.length===1&&a.lines[0].trim().match(/^＝同(hc\d+)(?::(\d+))?$/);
    if(m&&byId[m[1]]){a.dupOf=m[1];a.lines=byId[m[1]].lines.slice(+(m[2]||0))}});
  arts.forEach(a=>{a.body=(a.dupOf?'（此篇內文與 '+a.dupOf+' 相同）\n':'')+a.lines.join('\n')});
  const apps=[],info=[];
  front.forEach(l=>{const t=l.trim();if(!t)return;const m=t.match(/^(\d{2})｜(\d{4}\.\d\d\.\d\d \d\d:\d\d)｜(.+)$/);if(m)apps.push({no:m[1],date:m[2],name:m[3]});else info.push(t)});
  return {arts,apps,info,byId};
}
const AR=parseArchive();

(function(){

  AR.apps.forEach(app=>{const n=norm(app.name);

  });
})();

function parseC40(t){const g=[];let cur=null;for(const l of t.split('\n')){const s=l.trim();let m;
  if((m=s.match(/^【(.+?層)｜(.+)】$/))){cur={name:m[1],q:m[2],items:[]};g.push(cur)}
  else if(cur&&(m=s.match(/^\d{2}｜(.+?)＿＿分$/)))cur.items.push(m[1])}return g.filter(x=>x.items.length)}

function scoreTool(box,key,groups,max,legend){
  const n=groups.reduce((a,g)=>a+g.items.length,0),total=n*max;let s=Array(n).fill(null);
  let h='<p class="legend">'+legend+'</p>',k=0;
  groups.forEach((g,gi)=>{if(groups.length>1)h+='<h4>'+esc(g.name)+(g.q?'｜'+esc(g.q):'')+' <span class="sub mute" data-g="'+gi+'"></span></h4>';
    g.items.forEach(it=>{h+='<div class="srow" data-i="'+k+'"><span class="sq">'+esc(it)+'</span><span class="sb">'+Array.from({length:max+1},(_,v)=>'<button type="button" data-v="'+v+'">'+v+'</button>').join('')+'</span></div>';k++})});
  h+='<div class="sum"><b class="tot"></b><span class="adv"></span></div><div class="act"><input type="date" class="dt"> <button type="button" class="pri sv">儲存這次評分</button> <button type="button" class="rs">重設</button></div><div class="hist"></div>';
  box.innerHTML=h;box.querySelector('.dt').value=today();
  const upd=()=>{
    box.querySelectorAll('.srow').forEach(r=>{const i=+r.dataset.i;r.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.v===s[i]))});
    const filled=s.filter(v=>v!==null).length,sum=s.reduce((a,v)=>a+(v||0),0);
    box.querySelector('.tot').textContent='總分 '+sum+' / '+total+'（已評 '+filled+'/'+n+'）';
    let adv='';
    if(groups.length>1){let k2=0;const subs=groups.map((g,gi)=>{let t=0;for(let j=0;j<g.items.length;j++)t+=s[k2+j]||0;k2+=g.items.length;box.querySelector('.sub[data-g="'+gi+'"]').textContent='小計 '+t+'/'+g.items.length*max;return t});
      if(filled===n){const mn=Math.min(...subs);adv='最低：'+groups.filter((g,i)=>subs[i]===mn).map(g=>g.name+(ADV[g.name]?'→'+ADV[g.name]:'')).join('；')}}
    else if(filled===n){const mn=Math.min(...s);adv='最低項（'+mn+' 分）：'+groups[0].items.filter((_,i)=>s[i]===mn).join('、')}
    box.querySelector('.adv').textContent=adv};
  const hist=()=>{const o=ST[key]||{};const ds=Object.keys(o).sort().reverse().slice(0,30);
    box.querySelector('.hist').innerHTML=ds.length?'<h4>紀錄（最近 30 筆，點日期載入）</h4>'+ds.map(d=>'<div class="hrow"><button type="button" class="ld" data-d="'+d+'">'+d+'</button><span class="bar"><i style="width:'+(o[d].t/total*100)+'%"></i></span><b>'+o[d].t+'</b><button type="button" class="del" data-d="'+d+'" title="刪除">×</button></div>').join(''):'<p class="mute">尚無紀錄。</p>'};
  box.addEventListener('click',e=>{const b=e.target.closest('.sb button');if(b){s[+b.closest('.srow').dataset.i]=+b.dataset.v;upd()}});
  box.querySelector('.rs').onclick=()=>{s.fill(null);upd()};
  box.querySelector('.sv').onclick=()=>{if(s.some(v=>v===null)&&!confirm('還有項目未評分，未評視為 0 分。確定儲存？'))return;
    ST[key]=ST[key]||{};ST[key][box.querySelector('.dt').value||today()]={s:s.map(v=>v||0),t:s.reduce((a,v)=>a+(v||0),0)};save();hist()};
  box.querySelector('.hist').addEventListener('click',e=>{const d=e.target.dataset.d;if(!d)return;
    if(e.target.classList.contains('ld')){s=ST[key][d].s.slice();box.querySelector('.dt').value=d;upd()}
    else if(e.target.classList.contains('del')&&confirm('刪除 '+d+' 的紀錄？')){delete ST[key][d];save();hist()}});
  upd();hist();
}
function noteTool(box,key,fields){
  ST.notes=ST.notes||{};const d=ST.notes[key]||{};
  box.innerHTML=fields.map((f,i)=>'<label class="nf"><span>'+esc(f)+'</span><textarea data-i="'+i+'" rows="2">'+esc(d[i]||'')+'</textarea></label>').join('')+'<div class="act"><button type="button" class="pri sv">存成一筆紀錄</button> <button type="button" class="rs">清空</button></div><div class="hist"></div>';
  const get=()=>{const o={};box.querySelectorAll('textarea').forEach(t=>o[t.dataset.i]=t.value);return o};
  box.addEventListener('input',()=>{ST.notes=ST.notes||{};ST.notes[key]=get();save()});
  box.querySelector('.rs').onclick=()=>{if(!confirm('清空目前填寫內容？'))return;box.querySelectorAll('textarea').forEach(t=>t.value='');ST.notes=ST.notes||{};ST.notes[key]={};save()};
  const hist=()=>{const L=(ST.log||{})[key]||[];box.querySelector('.hist').innerHTML=L.length?'<h4>已存紀錄</h4>'+L.map((r,j)=>'<details class="rec"><summary>'+r.d+'｜'+esc((r.v[0]||'').slice(0,30))+'</summary>'+fields.map((f,i)=>r.v[i]?'<p><b>'+esc(f)+'</b><br>'+esc(r.v[i])+'</p>':'').join('')+'<button type="button" class="del" data-j="'+j+'">刪除這筆</button></details>').join(''):''};
  box.querySelector('.sv').onclick=()=>{const v=get();if(!Object.values(v).some(x=>x.trim())){alert('還沒有填寫內容。');return}ST.log=ST.log||{};(ST.log[key]=ST.log[key]||[]).unshift({d:today(),v});save();hist()};
  box.querySelector('.hist').addEventListener('click',e=>{if(e.target.matches('.del')&&confirm('刪除這筆紀錄？')){ST.log[key].splice(+e.target.dataset.j,1);save();hist()}});
  hist();
}

  const apply=()=>{const m=$('#a-month').value,so=$('#a-sort').value;let arr=AR.arts.slice();
    if(so==='new')arr.sort((x,y)=>y.date.localeCompare(x.date));if(so==='old')arr.sort((x,y)=>x.date.localeCompare(y.date));
    let c=0;arr.forEach(a=>{const el=document.getElementById('art-'+a.id);const show=!m||a.date.startsWith(m);el.hidden=!show;if(show)c++;list.appendChild(el)});
    $('#a-count').textContent='顯示 '+c+' 筆'};
  $('#a-month').onchange=apply;$('#a-sort').onchange=apply;
  $('#a-close').onclick=()=>list.querySelectorAll('details[open]').forEach(d=>d.open=false);
  apply();
})();
function fillArt(d){const ab=d.querySelector('.ab');if(!ab.textContent){const a=AR.byId[d.id.slice(4)];ab.textContent=a.body}return d}

// 總覽
(function(){
  const q=[];document.querySelectorAll('.unit').forEach(u=>{if((u.dataset.t||'').includes('金句'))u.querySelectorAll('p').forEach(p=>{const t=p.textContent.replace(/^\d{2}｜/,'').trim();if(t.length>8&&!t.startsWith('註'))q.push(t)})});
  const counts={health:'健康框架',taiji:'逆行太極',five:'五重逆行',twelve:'十二層',beh:'熵增vs逆熵',t39:'39主題',apps:'福利APP',arts:'文章庫'};
  const num={health:P('health').querySelectorAll('.unit').length+' 段',taiji:P('taiji').querySelectorAll('.unit').length+' 段',five:'2 張表',twelve:P('twelve').querySelectorAll('.unit').length+' 段',beh:P('beh').querySelectorAll('.bcard').length+' 組',t39:'39 主題',apps:AR.apps.length+' 個',arts:AR.arts.length+' 篇'};
  P('home').innerHTML='<div class="hero"><div class="mute">核心命題</div><div class="big">時間不會自動讓生命變好，生命需要持續投入能量、資源與智慧，才能維持與重建秩序。</div><p>LifeOS 核心閉環＝觀察→預測→行動→回饋→更新→再測試。</p><div class="quote" id="quote"></div><button type="button" class="btn" id="q-next">換一句金句</button> <button type="button" class="btn pri" data-go="tools">開始今天的自我檢測</button></div>'+
   '<div class="stat">'+Object.keys(counts).map(k=>'<button type="button" data-go="'+k+'"><b>'+num[k]+'</b>'+counts[k]+'</button>').join('')+'</div>'+
   render(raw('d-map'))+
   '<section class="unit" data-t="最終原則"><h3>最終原則</h3><p>不追求永遠不變的完美秩序，而是建立能持續修復、調節與更新的生命系統。</p><p class="mute">「逆熵」在此是生命管理的哲學比喻，不代表可以逆轉熱力學第二定律或生物老化。</p></section>';
  const nq=()=>{$('#quote').textContent=q.length?'「'+q[Math.floor(Math.random()*q.length)]+'」':''};nq();$('#q-next').onclick=nq;
})();

function show(id,top){
  if(!P(id))id='home';
  document.querySelectorAll('.panel').forEach(p=>p.hidden=p.id!=='p-'+id);
  document.querySelectorAll('#tabs button').forEach(b=>{b.classList.toggle('on',b.dataset.tab===id);if(b.dataset.tab===id)b.scrollIntoView({block:'nearest',inline:'nearest'})});
  sset('lifeos-entropy-tab',id);if(location.hash!=='#'+id)history.replaceState(null,'','#'+id);
  if(top)window.scrollTo(0,0);
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.tab,true)});
main.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)show(b.dataset.go,true)});
show((location.hash||'').slice(1)||sget('lifeos-entropy-tab')||'home');

// ===== 搜尋 =====
const NAME=Object.fromEntries(TABS);
const IDX=[];
document.querySelectorAll('.panel').forEach(p=>{const tab=p.id.slice(2);p.querySelectorAll('.unit').forEach(u=>IDX.push({tab,title:u.dataset.t||NAME[tab],text:u.textContent,el:u}))});
AR.arts.forEach(a=>IDX.push({tab:'arts',title:a.no+'｜'+a.id+'｜'+a.date.slice(0,10)+'｜'+a.title,text:a.body,art:a}));
IDX.forEach(u=>u.low=(u.title+'\n'+u.text).toLowerCase());
const R=$('#results'),Q=$('#q');let RES=[],TERMS=[],timer=0;
function clearHl(){document.querySelectorAll('mark.hit').forEach(m=>{const p=m.parentNode;m.replaceWith(document.createTextNode(m.textContent));p.normalize()})}
function hl(el,terms){clearHl();if(!terms.length)return;const re=new RegExp(terms.map(reEsc).join('|'),'gi');
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{re.lastIndex=0;if(!re.test(n.data))return;re.lastIndex=0;const f=document.createDocumentFragment();let last=0,m;
    while((m=re.exec(n.data))){f.append(n.data.slice(last,m.index));const k=document.createElement('mark');k.className='hit';k.textContent=m[0];f.append(k);last=m.index+m[0].length}
    f.append(n.data.slice(last));n.replaceWith(f)})}
function snippet(u){const tx=u.text.replace(/\s+/g,' ');const i=tx.toLowerCase().indexOf(TERMS[0]);const st=Math.max(0,i-30);
  let s=esc((st>0?'…':'')+tx.slice(st,(i<0?0:i)+80)+'…');const re=new RegExp(TERMS.map(t=>reEsc(esc(t))).join('|'),'gi');return s.replace(re,m=>'<mark>'+m+'</mark>')}
function doSearch(){const q=Q.value.trim().toLowerCase();TERMS=q.split(/\s+/).filter(Boolean);
  if(!TERMS.length){R.hidden=true;clearHl();return}
  RES=IDX.filter(u=>TERMS.every(t=>u.low.includes(t)));
  const order=TABS.map(t=>t[0]);RES.sort((a,b)=>order.indexOf(a.tab)-order.indexOf(b.tab));
  const shown=RES.slice(0,300);
  R.innerHTML='<div class="rh">找到 '+RES.length+' 筆'+(RES.length>300?'（顯示前 300 筆）':'')+'　按 Esc 關閉</div>'+(shown.length?shown.map((u,i)=>'<button type="button" class="r" data-k="'+i+'"><span class="tg">'+NAME[u.tab]+'</span><span class="rt">'+esc(u.title)+'</span><span class="sn">'+snippet(u)+'</span></button>').join(''):'<div class="rh">沒有符合的資料，試試其他關鍵字。</div>');
  R.hidden=false}
function go(u){R.hidden=true;show(u.tab);let el=u.el;if(u.art){el=document.getElementById('art-'+u.art.id);if(el.hidden){$('#a-month').value='';$('#a-month').onchange()}fillArt(el);el.open=true}
  for(let p=el.parentElement;p;p=p.parentElement)if(p.tagName==='DETAILS')p.open=true;
  hl(el,TERMS);const m=el.querySelector('mark.hit')||el;m.scrollIntoView({block:'center'});
  el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1600)}
Q.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(doSearch,180)});
Q.addEventListener('focus',()=>{if(Q.value.trim())doSearch()});
Q.addEventListener('keydown',e=>{if(e.key==='Enter'&&RES.length){go(RES[0])}});
R.addEventListener('click',e=>{const b=e.target.closest('.r');if(b)go(RES[+b.dataset.k])});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){R.hidden=true}else if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();Q.focus()}});
document.addEventListener('click',e=>{if(!R.hidden&&!R.contains(e.target)&&e.target!==Q)R.hidden=true});
})();
</script>
