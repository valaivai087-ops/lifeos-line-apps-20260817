<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aging ACAD 白話解析</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#2b2b2b;--mute:#777;--line:#e4e0d6;--acc:#2f7d6d;--acc2:#e8f3ef;--warn:#b85c38}
@media (prefers-color-scheme:dark){:root{--bg:#1b1c1e;--card:#25272a;--ink:#e8e6e1;--mute:#a3a09a;--line:#3a3c40;--acc:#5cc2a8;--acc2:#21332e;--warn:#e08a63}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;line-height:1.7}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 8px}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:20px;margin:0 0 8px}
h1 small{font-weight:normal;color:var(--mute);font-size:13px;margin-left:6px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#q{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--card);color:var(--ink)}
button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
button:hover{border-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{padding:3px 10px;border-radius:99px;font-size:13px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#count{color:var(--mute);font-size:13px;margin-top:6px}
main{padding:12px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
.head{display:flex;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--acc2);color:var(--acc);display:grid;place-items:center;font-weight:bold;font-size:14px}
.ttl{flex:1;font-weight:600}
.meta{font-size:12px;color:var(--mute)}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;color:#fff;flex:none}
.body{display:none;border-top:1px solid var(--line);padding:0 14px 14px}
.card.open .body{display:block}
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:10px 0;position:sticky;top:0}
.tabs button{font-size:13px;padding:6px 10px}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.pane{display:none}.pane.on{display:block}
.plain{font-size:17px;background:var(--acc2);border-radius:12px;padding:14px 16px}
.plain:before{content:"🧒 國小白話版";display:block;font-size:13px;color:var(--acc);font-weight:bold;margin-bottom:4px}
/* mind map */
.mm{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;padding:8px 0}
.mm .side{display:flex;flex-direction:column;gap:12px}
.mm .center{background:var(--acc);color:#fff;border-radius:50%;width:150px;height:150px;display:grid;place-items:center;text-align:center;padding:14px;font-weight:bold;font-size:15px;box-shadow:0 0 0 6px var(--acc2)}
.br{border:2px solid var(--c);border-radius:12px;padding:8px 10px;position:relative;background:var(--card)}
.br b{display:block;color:var(--c);font-size:14px;margin-bottom:4px}
.br span{display:inline-block;font-size:13px;background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:6px;padding:1px 7px;margin:2px 3px 2px 0}
.side.l .br:after,.side.r .br:after{content:"";position:absolute;top:50%;width:14px;border-top:2px dashed var(--c)}
.side.l .br:after{right:-16px}.side.r .br:after{left:-16px}
/* framework */
.fw{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;padding:8px 0}
.st{flex:1 1 140px;border-radius:12px;padding:10px;background:var(--acc2);border-top:5px solid var(--acc);text-align:center}
.st b{display:block;font-size:13px;color:var(--acc)}
.st div{font-size:14px}
.ar{display:grid;place-items:center;color:var(--acc);font-size:22px;font-weight:bold}
/* products */
.pd{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;padding:8px 0}
.pc{border:1px solid var(--line);border-radius:12px;padding:12px;border-left:5px solid var(--warn)}
.pc b{display:block;margin-bottom:4px}
.pc div{font-size:14px}
.pc div:before{content:"✅ 正面機制：";color:var(--warn);font-weight:bold}
.pc.gb{border-left-color:var(--acc)}
.pc.gb div:before{color:var(--acc)}
.pc .code{display:inline-block;background:var(--acc);color:#fff;border-radius:6px;padding:0 6px;font-size:12px;margin-right:6px}
.pc .price{float:right;color:var(--warn);font-size:13px;font-weight:bold}
#prod{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--card);color:var(--ink);max-width:100%}
.cp{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.cp button{background:#06c755;color:#fff;border-color:#06c755;font-weight:bold}
.cp button.alt{background:var(--card);color:#06a447}
.txt{white-space:pre-wrap;font-family:inherit;font-size:14px;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin:6px 0 0;user-select:all;-webkit-user-select:all}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#06c755;color:#fff;padding:10px 18px;border-radius:99px;font-size:15px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
.note{font-size:12px;color:var(--mute);margin-top:6px}
.orig p{margin:6px 0}
.tags{margin-top:8px}.tags span{font-size:12px;color:var(--acc);margin-right:6px}
mark{background:#ffe58a;color:inherit;border-radius:3px}
@media (max-width:680px){
 .mm{grid-template-columns:1fr}.mm .center{margin:0 auto;width:130px;height:130px;order:-1}
 .side.l .br:after,.side.r .br:after{display:none}
 .fw{flex-direction:column}.ar{transform:rotate(90deg)}
}
@media print{
 header,.tabs{display:none}.body{display:block!important}.pane{display:block!important;margin-bottom:10px}
 .card{break-inside:avoid-page}
}
</style>
</head>
<body>
<header><div class="wrap">
<h1>Aging ACAD 84 篇筆記<small>白話解析・心智圖・框架圖・對應產品</small></h1>
<div class="bar">
<input id="q" type="search" placeholder="🔍 搜尋標題、內容、產品、標籤…（例：紫蘇籽油、睡眠、肌肉）">
<select id="prod"><option value="">🛒 依我的團購產品找文章</option></select>
<button id="openAll">全部展開</button><button id="closeAll">全部收合</button><button onclick="print()">列印</button>
</div>
<div class="chips" id="chips"></div>
<div id="count"></div>
</div></header>
<main class="wrap" id="list"></main>
<div id="toast"></div>
<script>
const DATA = [{"i": 1, "title": "牛津大學：肚子越大，大腦反應越笨", "date": "1月14日", "body": ["英國牛津大學等機構的研究團隊發表於JAMA Network Open的一項研究使用飲食質量和腰臀比作為評估指標，發現健康飲食和降低腰臀比能增強大腦連線性和記憶力。", "這項研究表明：中老年時期，如果能保持更健康的飲食、更低的腰臀比，晚年往往擁有更好的大腦連線性和認知表現；相反，腰臀比偏高的人，更容易在晚年出現工作記憶變差、執行功能下降。", "具體而言，內臟脂肪含量與大腦衰老呈正相關，具體表現為每增加0.27kg內臟脂肪，大腦衰老程度接近1歲；同時，腰臀比增大與記憶力下降顯著相關，而透過減重（如體重減少1%）可逆轉部分腦齡（相當於年輕8.9個月），關鍵干預方法包括改善飲食（如戒掉垃圾食品和甜食）和建立運動習慣。", "因此，中年其實是大腦健康的關鍵視窗期，個人如果在中年主動改善飲食，也能為白質爭取了寶貴的維護機會，讓神經通路更穩、更高效。而腰圍管理也不只是為了心血管或代謝健康，更是在守護大腦神經網路、延緩認知老化的前線戰場上佔據主動。", "大腦可塑性伴隨我們一生，哪怕是老年，同時大腦也是最先衰老的器官之一，因此必須透過健康飲食減少腹部肥胖，以獲得良好的大腦認知。"], "tags": ["大腦可塑性", "肥胖", "大腦認知", "大腦", "衰老", "記憶力", "腦科學", "科學抗衰"], "dup": 0, "cat": "大腦", "plain": "肚子裡的脂肪（內臟脂肪）就像在身體裡放了一包會冒煙的垃圾，會讓大腦變老、變慢。研究發現：每多 0.27 公斤內臟脂肪，大腦就像老了 1 歲；但體重只要減 1%，大腦就像年輕了快 9 個月！所以從中年開始少吃甜食和垃圾食物、多運動、把腰圍縮小，就是在保護大腦。", "mind": {"c": "肚子大→大腦慢", "b": [["研究發現", ["腰臀比高→記憶差", "內臟脂肪0.27kg≈腦老1歲"]], ["好消息", ["減重1%→腦年輕8.9個月", "大腦一輩子都能改變"]], ["關鍵時期", ["中年是黃金窗口", "保護白質神經道路"]], ["怎麼做", ["戒垃圾食物與甜食", "規律運動", "定期量腰圍"]]]}, "frame": [["問題", "內臟脂肪、腰臀比上升"], ["機制", "脂肪發炎、傷害白質連結"], ["結果", "記憶力、執行力下降"], ["行動", "改善飲食＋運動縮腰圍"]], "prod": [["膳食纖維粉（菊苣/洋車前子）", "增加飽足感、減少亂吃零食，幫助控制腰圍"], ["大豆植物蛋白粉", "取代部分精緻澱粉，讓血糖平穩、保住肌肉"], ["體脂計＋軟尺", "追蹤腰圍和內臟脂肪，讓進步看得見、更有動力"]], "gb": [["033", "亞麻仁籽渣", "高纖增加飽足感，減少零食與內臟脂肪堆積，幫助縮腰圍", "198"], ["038", "EGCG複方", "茶多酚 EGCG 幫助脂肪代謝，輔助控制腰臀比", "560"], ["002", "EPA+DHA複方粉包", "DHA 是神經細胞膜材料，支持大腦白質與記憶連結", "1350"]]}, {"i": 2, "title": "衰老並非不可逆，關鍵在於修復粒線體功能", "date": "編輯時間：1月30日", "body": ["這篇於2018年發表在 《Cell Death & Disease》 上的論文，是一項關於逆轉衰老表型的里程碑式研究。其核心內容與觀點可概括為：透過藥物干預恢復細胞能量代謝的核心——粒線體功能，可以顯著逆轉由內在衰老引起的皮膚皺紋和毛髮脫落等外在可見的衰老體徵。", "研究揭示了表型逆轉背後的生物學機制，即粒線體功能的恢復引發了一系列積極的連鎖反應：", "能量供應改善：細胞能量貨幣ATP的生成增加，為細胞修復和再生提供了動力。", "氧化損傷減輕：粒線體功能紊亂會導致大量有害的活性氧產生。治療後，皮膚中的氧化應激水平顯著降低。", "炎症緩解：慢性低度炎症是衰老的標誌。治療抑制了關鍵促炎因子，減輕了“炎性衰老”。", "基因表達譜“年輕化”：治療部分逆轉了與衰老、細胞外基質降解和炎症相關的基因表達模式，使其更接近年輕狀態。", "研究證明，由內在機制（如粒線體功能障礙）驅動的、類似自然衰老的外在結構性變化（皺紋、脫髮）並非永久和不可逆的。透過干預根本的細胞代謝過程，可以使其發生逆轉。", "粒線體是關鍵靶點：研究強有力地支援了“粒線體衰老理論”，並將恢復粒線體功能確立為抗衰老幹預的核心策略。", "NAD⁺的重要性：該研究為透過補充NAD⁺前體來對抗衰老提供了直接證據，極大地推動了後續關於NMN、NR等物質在抗衰老領域的研究和商業化應用。", "衰老的“時鐘”在某種程度上可以回撥。透過靶向細胞能量的源泉——粒線體，改善其功能，能夠從分子到組織層面逆轉明顯的衰老體徵，為“治療衰老”本身而非單一老年疾病帶來了革命性的希望。"], "tags": ["衰老的表現", "線粒體與衰老", "抗衰", "衰老", "線粒體", "NAD"], "dup": 0, "cat": "衰老機制", "plain": "粒線體是細胞裡的小發電廠。人變老時發電廠會壞掉，電（ATP）變少，還冒出有害的「廢氣」（自由基），皮膚就長皺紋、頭髮變少。研究把小鼠的發電廠修好後，皺紋和掉毛竟然恢復了！這說明有些老化是可以倒轉的，而 NAD+ 就是發電廠很重要的燃料。", "mind": {"c": "修好粒線體＝把時鐘往回撥", "b": [["發電廠壞了", ["能量ATP變少", "自由基變多", "慢性發炎"]], ["修好之後", ["ATP增加", "氧化壓力下降", "發炎減少", "基因表現變年輕"]], ["看得見的改變", ["皺紋變少", "頭髮長回來"]], ["重要啟示", ["老化可部分逆轉", "NAD+前驅物受到重視"]]]}, "frame": [["起點", "粒線體功能下降"], ["連鎖反應", "能量少＋自由基多＋發炎"], ["外觀", "皺紋、掉髮"], ["介入", "恢復粒線體功能（NAD+）"], ["結果", "老化外觀逆轉"]], "prod": [["NMN / NAD+ 前驅物", "補充細胞發電的燃料 NAD+，支持粒線體產生能量"], ["輔酶 Q10", "是粒線體發電線上的重要零件，幫忙產生 ATP 並抗氧化"], ["維生素 C", "清除自由基，並幫助膠原蛋白合成，讓皮膚有彈性"]], "gb": [["061", "NMN複方", "補充 NAD+ 前驅物——正是本研究重點，幫助恢復粒線體產能", "570"], ["060", "Q10（10:1）", "粒線體發電的關鍵零件，促進 ATP 生成並清除自由基", "580"], ["098", "粒線寶", "主打粒線體保養（成分以產品標示為準），可搭配 NMN、Q10", "550"], ["031", "防脫增髮洗髮水", "外用照顧頭皮與毛髮，和內調粒線體一起對抗掉髮", "350"]]}, {"i": 3, "title": "鎂風靡歐美，真的值得買嗎？", "date": "昨天 10:24 廣東", "body": ["今年最火的補劑不是魚油，是鎂。每 100 個美國補劑使用者裡，64 個在吃鎂，僅次於維生素 D。", "但它賣得這麼火，和它到底有多大用，是兩件事。", "2020 年一篇傘形綜述，把 55 個結局攤在一張桌上：36 個隨機對照結局，只有 12 個顯著；強證據只有兩件——偏頭痛，和孕期住院。而大家最想要的睡眠，被評為「極低確定性」。", "Veronese 等，Eur J Nutr 2020;59(1):263–272　DOI: 10.1007/s00394-019-01905-w", "16 項薈萃分析 ｜ 55 個結局 ｜ 36 個 RCT 結局中僅 12 個顯著", "強證據僅 2 項：偏頭痛（頻率／強度）、孕期住院需求", "最典型的反轉在血壓。", "2016 年說有效，收縮壓降 2 毫米汞柱，被引用了近十年。同一本期刊 2025 年更新：38 項試驗、2709 人，整體不顯著，只有本來缺鎂或本來高血壓的人有效，劑量加上去也不會更好。買不買，看三點。", "一看人：長期外賣、節食、喝酒、常年吃胃藥，或醫生說你鎂偏低，補得有依據；飲食夠雜的，補的是心理安慰。", "二看標籤寫的是「元素鎂」還是「鎂」：500 毫克氧化鎂只吃到 300 毫克，換成甘氨酸鎂只剩 70 毫克。", "三看它賣你什麼：睡眠「有一點」，偏頭痛最紮實，骨骼和抽筋沒定論。", "（文獻科普解讀，僅供健康參考，不構成任何診斷、治療或用藥建議。)"], "tags": ["大腦補劑", "大腦營養", "鎂", "鎂補劑", "鎂補劑選購指南", "補劑", "鎂與睡眠", "睡眠", "蘇糖酸鎂", "鎂片"], "dup": 0, "cat": "補充劑", "plain": "鎂是身體需要的礦物質，最近超紅。但科學家把研究整理後發現：鎂對「偏頭痛」最有用；對睡眠只有一點點；降血壓只對本來就缺鎂或有高血壓的人有效。所以買之前看三件事：①你是不是容易缺鎂（常吃外食、喝酒、節食、長期吃胃藥）②標籤上「元素鎂」到底有多少 ③它賣給你的功效有沒有證據。", "mind": {"c": "鎂值得買嗎？", "b": [["證據強", ["偏頭痛", "孕期住院需求"]], ["證據弱", ["睡眠（極低確定性）", "骨骼、抽筋沒定論"]], ["血壓大反轉", ["2016說有效", "2025只對缺鎂/高血壓者有效"]], ["買前三看", ["看自己缺不缺", "看元素鎂含量", "看宣稱功效"]]]}, "frame": [["迷思", "熱門＝有效？"], ["第一看", "自己是否容易缺鎂"], ["第二看", "元素鎂實際含量"], ["第三看", "目的對不對（偏頭痛＞睡眠）"]], "prod": [["甘胺酸鎂", "溫和好吸收、比較不會拉肚子，適合缺鎂族群補充"], ["檸檬酸鎂", "吸收率佳，也能幫助排便順暢"], ["鈣鎂鋅綜合礦物質", "外食族一次補齊常缺的礦物質"]], "gb": [["091", "甘氨酸鎂複方粉包", "甘胺酸鎂溫和好吸收、較不易腹瀉，適合外食、喝酒、吃胃藥等易缺鎂族群", "1350"], ["053", "神經營養素（B1＋B3＋B6）", "B6 與鎂協同支持神經傳導，幫助放鬆", "540"]]}, {"i": 4, "title": "8種熱門大腦補劑排名：第五名蘇糖酸鎂", "date": "編輯時間：3 天前 廣東", "body": ["第五位，L-蘇糖酸鎂。它跟普通鎂片不是一回事。", "普通鎂主要補全身的缺乏，但很難進大腦，血腦屏障卡得很嚴；L-蘇糖酸鎂是專門設計來進腦的。", "鎂在大腦裡管神經突觸的可塑性，還調節 NMDA 受體，這跟學習記憶直接相關。", "而且鎂跟睡眠關係很大——很多人是因為睡不好才記不住事，把睡眠修好了，記憶也跟著回來一點。", "但證據得潑點冷水：人體試驗只有兩項，44 人和 109 人，規模都不大，背後還都有廠商的影子。44 人那項，整體認知分確實改善了，可細看只有執行功能達標，記憶和注意力都沒達標；", "109 人那項用的是鎂加磷脂醯絲氨酸的複合配方，沒法單獨歸功於鎂。", "所以它排第五：機制有道理，證據還年輕。", "（文獻科普解讀，僅供健康參考，不構成任何診斷、治療或用藥建議。）"], "tags": ["大腦補劑", "大腦營養", "鎂", "鎂補劑", "沒補劑選購指南", "補劑", "鎂與睡眠啊", "睡眠", "蘇糖酸鎂", "鎂片"], "dup": 0, "cat": "補充劑", "plain": "一般的鎂很難進到大腦，因為大腦門口有很嚴格的警衛（血腦屏障）。L-蘇糖酸鎂是特別設計、可以進到大腦的鎂。大腦裡的鎂會幫神經細胞「接好線」，跟學習記憶有關，也能幫助睡覺。不過人體實驗只有兩個、人數也少，所以排第五：道理說得通，但證據還很年輕。", "mind": {"c": "L-蘇糖酸鎂", "b": [["特色", ["能穿過血腦屏障", "普通鎂進不去大腦"]], ["作用", ["突觸可塑性", "調節NMDA受體", "改善睡眠→記憶"]], ["證據", ["只有2個人體試驗", "44人與109人", "有廠商背景"]], ["結論", ["機制合理", "證據待加強"]]]}, "frame": [["問題", "普通鎂進不了大腦"], ["方法", "蘇糖酸鎂可入腦"], ["作用", "調節突觸、改善睡眠"], ["效果", "可能改善執行功能（證據有限）"]], "prod": [["L-蘇糖酸鎂", "可通過血腦屏障，支持神經突觸的連結與可塑性"], ["鎂＋PS 複方", "鎂穩定神經、PS 維護腦細胞膜，雙重支援專注"], ["GABA 助眠配方", "幫助放鬆入睡，睡得好記憶也跟著變好"]], "gb": [["091", "甘氨酸鎂複方粉包", "補足全身鎂，甘胺酸還能幫助放鬆入睡；睡得好，記憶也跟著好", "1350"], ["054", "GABA", "幫神經踩剎車、縮短入睡時間，支援睡眠修復記憶", "540"]]}, {"i": 5, "title": "常見護腦補劑重新排序第四名：茶氨酸", "date": "6 天前 廣東", "body": ["第四位，L-茶氨酸，茶裡特有的氨基酸，綠茶紅茶都有。", "它跟咖啡因不是一路：咖啡因是硬提神，它是放鬆但不困。你喝完茶那種又清醒又平靜的感覺，很大一部分就是它帶來的。", "機制上，它能穿過血腦屏障，提高腦子裡的 GABA 和多巴胺，增加α腦電波，同時降低興奮性氨基酸的活性——等於把神經的油門和剎車配平了。", "2026 年有篇薈萃分析，把 31 項隨機對照試驗、一千一百多人合在一起，發現單次吃 200 毫克能明顯縮短選擇反應時間，也就是注意力變好了；至於減壓，效果弱一些。", "用法上有個小技巧：需要專注之前 30 到 60 分鐘吃，跟咖啡一起用比單獨用更明顯。安全性很好，基本沒有嚴重不良反應。"], "tags": ["科學抗衰", "護腦補劑", "補劑", "大腦營養", "大腦", "茶氨酸", "衰老"], "dup": 0, "cat": "補充劑", "plain": "茶氨酸是茶葉裡特有的胺基酸。咖啡因像「踩油門」硬提神，茶氨酸則是「放鬆但不想睡」，讓人又清醒又平靜。它可以進到大腦，增加讓人放鬆的 GABA 和 α 腦波。31 個實驗發現，一次吃 200 毫克能讓反應變快、注意力變好。要專心前 30～60 分鐘吃，和咖啡一起效果更明顯。", "mind": {"c": "L-茶氨酸", "b": [["來源", ["綠茶", "紅茶"]], ["作用", ["放鬆但不睏", "提高GABA、多巴胺", "增加α腦波"]], ["證據", ["31個RCT、1100多人", "200mg反應時間變快", "減壓效果較弱"]], ["用法", ["專注前30-60分鐘", "搭配咖啡更好", "安全性高"]]]}, "frame": [["狀態", "神經太興奮、容易分心"], ["介入", "茶氨酸進入大腦"], ["機制", "油門與剎車配平"], ["結果", "注意力提升、反應變快"]], "prod": [["L-茶氨酸膠囊", "增加 α 腦波與 GABA，放鬆又能專注"], ["抹茶粉 / 綠茶", "天然茶氨酸＋少量咖啡因的黃金組合"], ["GABA＋茶氨酸助眠配方", "兩者協同放鬆，幫助入睡與提升睡眠品質"]], "gb": [["062", "酶菌醣體（含茶胺酸）", "茶胺酸增加 α 腦波與 GABA，放鬆又專注", "720"], ["054", "GABA", "與茶胺酸協同放鬆，減少緊張分心", "540"], ["038", "EGCG複方", "同樣來自茶葉的茶多酚，抗氧化保護腦細胞", "560"]]}, {"i": 6, "title": "八種熱門護腦補劑第三位，PS磷脂醯絲氨酸", "date": "10月17日 廣東", "body": ["8 種護腦補劑，按科學證據重新排序——第三位，磷脂醯絲氨酸，簡稱 PS。名字難記，你把它記成細胞膜的潤滑油。", "它是大腦皮層細胞膜裡最主要的酸性磷脂之一，佔比百分之十幾，管膜的穩定和訊號傳遞，年紀大了會慢慢流失。它還能幫忙緩衝壓力激素皮質醇的升高，所以一緊張就記不住事的人，可能會有點用。", "機制上，它摻進細胞膜後，能啟用促進神經細胞存活、長新突觸的通路。", "來源要提醒一句：現在市面上的 PS 主要從大豆提取，但早期做出好結果的研究用的是牛腦，那個因為瘋牛病風險早就停產了。", "證據到什麼程度？2022 年有篇薈萃分析，把九項研究合在一起，結論是對老年人的記憶有小幅改善。但幅度不大，而且當年的原料現在買不到，所以只能給三星。"], "tags": ["大腦營養", "護腦補劑", "補劑", "藻油", "DHA", "PS", "磷脂醯絲氨酸", "大腦", "大腦能量", "營養補劑howto"], "dup": 0, "cat": "補充劑", "plain": "PS（磷脂醯絲胺酸）就像腦細胞外殼的「潤滑油」，讓細胞膜穩定、訊號傳得順，但年紀大會慢慢流失。它還能幫忙壓住緊張時升高的壓力荷爾蒙（皮質醇），所以一緊張就忘東忘西的人可能有幫助。不過研究只看到小幅改善，加上早期好結果用的原料現在買不到，所以給三顆星。", "mind": {"c": "PS 磷脂醯絲胺酸", "b": [["是什麼", ["腦細胞膜主要磷脂", "隨年齡流失"]], ["作用", ["穩定細胞膜", "幫助訊號傳遞", "緩衝皮質醇", "促進神經存活"]], ["來源", ["現多為大豆", "早期牛腦已停產"]], ["證據", ["9項研究合併", "老人記憶小幅改善", "三顆星"]]]}, "frame": [["老化", "PS 隨年齡流失"], ["影響", "細胞膜不穩、壓力荷爾蒙高"], ["結果", "記憶變差"], ["補充", "PS 支援細胞膜"], ["效果", "記憶小幅改善"]], "prod": [["大豆 PS 膠囊", "補充腦細胞膜磷脂，支持神經訊號傳遞"], ["PS＋DHA 複方", "DHA 和 PS 一起組成神經細胞膜，互相加分"], ["卵磷脂", "提供膽鹼與磷脂，支持細胞膜和記憶相關的神經傳導物質"]], "gb": [["002", "EPA+DHA複方粉包", "DHA 和 PS 一起組成神經細胞膜，讓訊號傳遞更順", "1350"], ["042", "清思油滴（迷迭香＋EPA魚油）", "迷迭香提神醒腦，EPA 抗發炎，支援專注與記憶", "450"], ["050", "銀杏複方", "銀杏促進腦部微循環，把氧氣養分送到腦細胞", "510"]]}, {"i": 7, "title": "8種熱門大腦補劑第二名：B族維生素", "date": "編輯時間：Oct 16 廣東", "body": ["B 族維生素（B6、B12、葉酸）", "基本名稱與來源：維生素 B6（吡哆醇）、B12（鈷胺素）、葉酸（維生素 B9）。全穀物、豆類、深綠色葉菜、蛋奶和動物肝臟是主要來源。", "對大腦的功能：參與一碳代謝、神經遞質合成與髓鞘維護，並維持血漿同型半胱氨酸在正常範圍。同型半胱氨酸升高是腦萎縮、血管性認知損害與痴呆的獨立危險因素。", "作用機制：葉酸與 B12 作為輔酶參與同型半胱氨酸再甲基化，B6 參與轉硫途徑，三者協同降低血漿同型半胱氨酸，從而減輕其對腦血管和神經元的損傷。", "證據強度：★★★★（條件性有效）。", "VITACOG 隨機對照試驗顯示，對基線同型半胱氨酸 >13 μmol/L 的輕度認知障礙老人，補充 24 個月後全腦萎縮速度降低約 53%，AD 相關腦區萎縮也明顯減緩；但對同型半胱氨酸正常的人群獲益不明顯，且有研究提示同時服用阿司匹林可能削弱效果。因此更合理的做法是先檢測再補充。"], "tags": ["營養補劑howto", "大腦營養", "大腦補劑", "大腦", "B族維生素", "葉酸", "藻油", "DHA"], "dup": 0, "cat": "補充劑", "plain": "B6、B12、葉酸三兄弟會合作，把血液裡一種叫「同半胱胺酸」的壞東西降下來。這個壞東西太高會傷腦血管、讓大腦萎縮。研究發現：同半胱胺酸偏高的輕度認知障礙老人，補了兩年 B 群，大腦萎縮速度少了一半！但數值正常的人效果不明顯，所以最好先抽血檢查再補。", "mind": {"c": "B6＋B12＋葉酸", "b": [["食物來源", ["全穀、豆類", "深綠色蔬菜", "蛋奶、肝臟"]], ["作用", ["降低同半胱胺酸", "合成神經傳導物質", "維護神經髓鞘"]], ["證據", ["VITACOG試驗", "腦萎縮減慢53%", "只對Hcy>13有效"]], ["建議", ["先抽血檢測", "再補充", "注意與阿斯匹靈併用"]]]}, "frame": [["問題", "同半胱胺酸升高"], ["傷害", "損傷腦血管與神經"], ["結果", "大腦萎縮加快"], ["介入", "B 群協同降 Hcy"], ["效果", "萎縮速度減半"]], "prod": [["活性 B 群（甲基 B12＋活性葉酸）", "直接參與同半胱胺酸代謝，保護腦血管"], ["B12 口含錠", "素食者與吃胃藥者最容易缺，支持神經髓鞘"], ["健檢同半胱胺酸項目", "先知道自己需不需要補，花錢花在刀口上"]], "gb": [["087", "超級B群", "葉酸、B6、B12 協同降低同半胱胺酸，保護腦血管", "520"], ["063", "甜菜鹼TMG", "走另一條路徑把同半胱胺酸轉回甲硫胺酸，與 B 群互補", "490"], ["049", "加強B群", "支持神經傳導物質合成與髓鞘維護", "520"]]}, {"i": 8, "title": "8種護腦補劑按照科學證據重新排名：DHA", "date": "Oct 13 廣東", "body": ["很多人經常感到腦霧、健忘、注意力不集中，便想入手各類健腦補劑。市面上的護腦成分很多，但作用與證據強度各不相同，價格與效果也不對等。本文以常見的八類護腦補劑為基礎，依據現有科學研究和臨床試驗證據，逐一說明其基本名稱、針對大腦的功能、來源與作用機制，並按證據強弱重新排序，供讀者按需選擇。 第一位：DHA（魚油／海藻油） DHA（二十二碳六烯酸）是構成大腦神經細胞膜的核心長鏈多不飽和脂肪酸，有“腦黃金”之稱。大腦中大量神經突觸依賴DHA維持結構完整，幫助資訊在神經元之間傳遞，因此與記憶力、注意力的維護密切相關。主要來源是深海魚類，也可從藻油中獲得，每週吃2至3次深海魚即可滿足日常需要。在現有證據中，DHA是八類成分中證據最充分的：針對輕度認知障礙人群的系統綜述和多項隨機對照試驗提示，補充DHA有助於延緩認知衰退、改善情景記憶；但對已經明確診斷為阿爾茨海默病的人群效果有限。適合長期用腦、中老年認知保養人群；飲食攝入不足時再考慮補劑。 （本文為文獻科普解讀，個人觀點，僅供健康參考，不構成任何診斷、治療或用藥建議。)"], "tags": ["大腦", "DHA", "PS", "藻油", "魚油", "護腦", "護腦補劑", "大腦補劑", "Omega3", "腦霧"], "dup": 0, "cat": "補充劑", "plain": "DHA 被叫做「腦黃金」，是大腦神經細胞膜最重要的材料，幫助神經之間傳遞訊息。在八種護腦成分裡它的證據最多：對輕度認知障礙的人，補 DHA 有助延緩退化、改善記憶；但已經確診阿茲海默症的人效果有限。每週吃 2～3 次深海魚就夠，吃不夠再考慮補充。", "mind": {"c": "DHA 腦黃金", "b": [["是什麼", ["長鏈Omega-3", "神經細胞膜核心"]], ["來源", ["深海魚", "藻油"]], ["證據", ["八種中最強", "輕度認知障礙有幫助", "已確診效果有限"]], ["建議", ["每週2-3次深海魚", "不夠再補"]]]}, "frame": [["不足", "DHA 攝取不夠"], ["影響", "神經膜、突觸功能下降"], ["結果", "記憶、注意力變差"], ["行動", "吃魚或藻油補充"], ["效果", "延緩認知衰退"]], "prod": [["藻油 DHA", "植物來源、沒有魚腥味，補充神經細胞膜原料"], ["rTG 高濃度魚油", "同時提供 EPA/DHA，支持大腦與心血管"], ["紫蘇籽油", "植物 Omega-3（ALA），身體可部分轉換成 EPA/DHA"]], "gb": [["002", "EPA+DHA複方粉包", "直接補充腦黃金 DHA，支持記憶與注意力", "1350"], ["042", "清思油滴（迷迭香＋EPA魚油）", "EPA 抗發炎＋迷迭香醒腦，日常用腦族的好搭檔", "450"], ["097", "亞麻仁油（500cc×2瓶）", "植物 Omega-3（ALA），身體可部分轉換為 EPA/DHA，吃素者也適合", "780"]]}, {"i": 9, "title": "怎樣運動最有利於增加骨密度？", "date": "Oct 12 廣東", "body": ["這項發表於《英國醫學雜誌》(BMJ)的大型網狀Meta分析，彙總了124項隨機對照試驗、近1.8萬名40歲以上中老年人的資料，發現： 運動確實能延緩隨年齡增長而來的骨密度流失，是價效比最高的非藥物護骨手段；第二，在眾多運動中，快走或慢跑、以及“有氧+抗阻”組合練習的護骨效果最明確，身心運動(太極、瑜伽)和全身振動訓練也有一定幫助；第三，獲益不必“虐自己”——每週約600 METs-min，相當於每天快走20到30分鐘、或每週累計快走兩三個小時，就能達到臨床上有意義的骨密度改善；劑量反應呈倒U型，練得過猛收益反而不再增加。此外，混合有氧與身心運動還有助降低骨折風險。 （文獻科普解讀，僅供健康參考，不構成任何診斷、治療或用藥建議。)"], "tags": [], "dup": 0, "cat": "運動", "plain": "骨頭就像存款，40 歲以後會慢慢被「提領」。研究整理了 124 個實驗發現：運動是最划算的「存骨本」方法！快走、慢跑、有氧加重量訓練最有效，太極、瑜伽也有幫助。不用拚命，每天快走 20～30 分鐘就夠，練太猛效果反而不會更好。", "mind": {"c": "運動存骨本", "b": [["證據", ["124個RCT", "1.8萬名40歲以上"]], ["最有效", ["快走、慢跑", "有氧＋阻力訓練", "太極、瑜伽、振動也有幫助"]], ["運動量", ["每週約600 METs-min", "每天快走20-30分鐘", "倒U型：別過量"]], ["加分", ["混合運動降低骨折"]]]}, "frame": [["問題", "年齡增加、骨質流失"], ["方法", "運動給骨頭適度刺激"], ["結果", "骨密度維持"], ["行動", "每天快走 20～30 分鐘"]], "prod": [["鈣＋D3＋K2", "鈣是骨頭原料，D3 幫助吸收，K2 把鈣送進骨頭"], ["彈力帶 / 啞鈴", "在家做阻力訓練，給骨頭適度負荷刺激"], ["健走鞋", "穩定支撐、保護關節，讓每天快走更容易持續"]], "gb": [["094", "D3（2000IU＋A＋E）", "維生素 D3 幫助鈣吸收、支持肌肉力量，讓運動護骨更有效", "580"], ["043", "鹼能活（檸檬酸鉀／肌酸…）", "肌酸支援肌力與運動表現；檸檬酸鉀有助減少鈣從尿中流失", "520"], ["092", "D3（5000IU）", "維生素 D 明顯不足者快速補足（建議先驗血）", "580"]]}, {"i": 10, "title": "124項隨機試驗：快走慢跑可以抵消骨流失", "date": "Oct 12 廣東", "body": ["這項發表於《英國醫學雜誌》(BMJ)的大型網狀Meta分析，彙總了124項隨機對照試驗、近1.8萬名40歲以上中老年人的資料，第一次把“運動到底怎麼護骨”這件事說清楚了。", "核心結論有三：第一，運動確實能延緩隨年齡增長而來的骨密度流失，是價效比最高的非藥物護骨手段；第二，在眾多運動中，快走或慢跑、以及“有氧+抗阻”組合練習的護骨效果最明確，身心運動(太極、瑜伽)和全身振動訓練也有一定幫助；第三，獲益不必“虐自己”——每週約600 METs-min，相當於每天快走20到30分鐘、或每週累計快走兩三個小時，就能達到臨床上有意義的骨密度改善；劑量反應呈倒U型，練得過猛收益反而不再增加。此外，混合有氧與身心運動還有助降低骨折風險。", "一句話：人過四十，把“出門走走路”堅持下來，就是給骨頭最划算的一筆投資。", "（本文為文獻科普解讀，僅供健康參考，不構成任何診斷、治療或用藥建議。)"], "tags": [], "dup": 9, "cat": "運動", "plain": "骨頭就像存款，40 歲以後會慢慢被「提領」。研究整理了 124 個實驗發現：運動是最划算的「存骨本」方法！快走、慢跑、有氧加重量訓練最有效，太極、瑜伽也有幫助。不用拚命，每天快走 20～30 分鐘就夠，練太猛效果反而不會更好。", "mind": {"c": "運動存骨本", "b": [["證據", ["124個RCT", "1.8萬名40歲以上"]], ["最有效", ["快走、慢跑", "有氧＋阻力訓練", "太極、瑜伽、振動也有幫助"]], ["運動量", ["每週約600 METs-min", "每天快走20-30分鐘", "倒U型：別過量"]], ["加分", ["混合運動降低骨折"]]]}, "frame": [["問題", "年齡增加、骨質流失"], ["方法", "運動給骨頭適度刺激"], ["結果", "骨密度維持"], ["行動", "每天快走 20～30 分鐘"]], "prod": [["鈣＋D3＋K2", "鈣是骨頭原料，D3 幫助吸收，K2 把鈣送進骨頭"], ["彈力帶 / 啞鈴", "在家做阻力訓練，給骨頭適度負荷刺激"], ["健走鞋", "穩定支撐、保護關節，讓每天快走更容易持續"]], "gb": [["094", "D3（2000IU＋A＋E）", "維生素 D3 幫助鈣吸收、支持肌肉力量，讓運動護骨更有效", "580"], ["043", "鹼能活（檸檬酸鉀／肌酸…）", "肌酸支援肌力與運動表現；檸檬酸鉀有助減少鈣從尿中流失", "520"], ["092", "D3（5000IU）", "維生素 D 明顯不足者快速補足（建議先驗血）", "580"]]}, {"i": 11, "title": "想補蛋白，BCAA值不值得選？一篇看懂", "date": "10-10 廣東", "body": ["“特殊人群要補BCAA”，這句話你可能聽過，但為什麼補、怎麼選，很多人並不清楚。", "近日，研究團隊開展了一項BCAA隨機對照試驗", "結論很直接BCAA+運動+營養指導", "如果正在找BCAA類營養品，可以瞭解立適康支鏈氨基酸營養粉：", "1️⃣ 高濃度支鏈氨基酸，蛋白質佔比50%", "2️⃣ 天然海洋活性成分——海洋魚低聚肽粉", "3️⃣ 新增維生素A、B、D和礦物質", "📝 一些小注意事項", "1️⃣ 特殊人群挑營養補劑，別隻看名字，配方和成分更關鍵（推薦立適康）", "2️⃣ 運動也別忽略，快走、椅子起立這類居家動作，堅持做也會有變化～"], "tags": ["立適康支鏈氨基酸營養粉", "立適康", "補蛋白", "蛋白粉推薦", "力邦營養"], "dup": 0, "cat": "蛋白質", "plain": "BCAA 是三種「支鏈胺基酸」，是肌肉的重要材料。研究顯示「BCAA＋運動＋營養指導」一起做最有效，只吃不動效果有限。挑營養品要看配方和成分，不要只看名字；在家做快走、椅子坐下站起這類動作，持續做也會有變化。", "mind": {"c": "BCAA 值不值得？", "b": [["是什麼", ["白胺酸、異白胺酸、纈胺酸", "肌肉合成原料"]], ["研究", ["BCAA＋運動＋營養指導最有效"]], ["選購", ["看配方成分", "看蛋白質比例", "維生素礦物質"]], ["搭配運動", ["快走", "椅子起立"]]]}, "frame": [["問題", "肌肉流失"], ["補充", "BCAA 提供原料"], ["刺激", "運動啟動合成"], ["結果", "肌力維持"]], "prod": [["乳清蛋白 / BCAA 粉", "白胺酸能啟動肌肉合成的開關"], ["魚膠原低聚肽", "小分子好吸收，幫助補充蛋白質"], ["維生素 D3", "支持肌肉功能，搭配蛋白質一起保肌"]], "gb": [["034", "胺基酸可可粉包", "補充胺基酸原料，配合運動啟動肌肉合成", "780"], ["043", "鹼能活（含肌酸、肉鹼）", "肌酸幫助提升肌力、肉鹼幫助脂肪轉成能量", "520"], ["094", "D3（2000IU＋A＋E）", "維生素 D 支持肌肉功能，和蛋白質一起保肌", "580"]]}, {"i": 12, "title": "nutrients：紫蘇籽油與15種油脂的對比", "date": "Oct 3 廣東", "body": ["河南農業大學在頂刊發表的研究，紫蘇籽油在omega3含量、安全性和健康方面都是優等生。"], "tags": ["紫蘇籽油", "omega3", "亞麻酸", "食用油", "科學抗衰", "抗衰", "健康飲食"], "dup": 0, "cat": "好油", "plain": "河南農業大學把紫蘇籽油和 15 種油拿來比較，發現紫蘇籽油的 Omega-3（α-亞麻酸）含量最高，安全性和健康表現都很好，是油裡的「優等生」。不過它很怕熱、怕空氣，適合涼拌或直接吃，不適合高溫炒炸。", "mind": {"c": "紫蘇籽油 vs 15種油", "b": [["優點", ["Omega-3最高", "α-亞麻酸60%以上"]], ["健康", ["抗發炎", "護心血管"]], ["注意", ["容易氧化", "不耐高溫"]], ["吃法", ["涼拌", "膠囊", "冷藏避光"]]]}, "frame": [["現況", "飲食 Omega-6 太多"], ["改變", "換成紫蘇籽油補 Omega-3"], ["機制", "Omega-3/6 比例平衡"], ["結果", "減少發炎"]], "prod": [["冷壓紫蘇籽油", "富含 ALA，平衡 Omega-3/6 比例"], ["紫蘇籽油軟膠囊", "隔絕空氣防氧化、定量好吞"], ["亞麻仁籽粉", "另一種植物 Omega-3，加上膳食纖維"]], "gb": [["097", "亞麻仁油（500cc×2瓶）", "和紫蘇籽油一樣是高 ALA 的植物 Omega-3，平衡 Omega-3/6 比例", "780"], ["016", "亞麻仁油10罐", "長期食用的大容量選擇，涼拌、直接喝補 Omega-3", "3470"], ["033", "亞麻仁籽渣", "保留膳食纖維與木酚素，幫助排便並調節血脂", "198"]]}, {"i": 13, "title": "nature：什麼抗衰方式真正有效？", "date": "Oct 1 廣東", "body": [], "tags": ["抗初老howto", "健康科普howto", "科學抗衰", "衰老", "線粒體與衰老", "健康年輕態", "有效抗老化", "衰老的表現", "健康管理howto"], "dup": 0, "cat": "衰老機制", "plain": "科學家把 51 個抗老實驗放在一起比，用「表觀遺傳時鐘」量身體的真實年齡。結果：藥物（抗發炎藥、二甲雙胍）撥時鐘最明顯；地中海飲食、戒菸、運動有效但比較弱；各種補充劑效果很小。而且要用新一代的時鐘量才準。最後提醒：時鐘變年輕，不一定等於真的活更久。", "mind": {"c": "哪些抗老真的有效？", "b": [["效果排行", ["藥物＞生活方式＞補劑＞手術"]], ["生活方式", ["地中海飲食", "戒菸", "規律運動"]], ["量尺很重要", ["新時鐘 DunedinPACE/GrimAge 靈敏", "舊時鐘 Horvath 幾乎不動"]], ["提醒", ["時鐘年輕≠長壽", "需10年以上試驗"]]]}, "frame": [["想抗老", "選擇方法"], ["基礎", "生活方式打底"], ["測量", "用對量尺"], ["驗證", "長期追蹤真實健康"]], "prod": [["特級初榨橄欖油＋綜合堅果", "地中海飲食的主角，多酚與好油幫忙抗發炎"], ["運動手環", "記錄活動量，幫助養成規律運動"], ["生物年齡檢測", "用新一代時鐘了解自己的老化速度"]], "gb": [["041", "薑黃素＋胡椒鹼", "研究中抗發炎干預撥動生物時鐘最明顯，薑黃素抑制發炎總開關 NF-κB", "620"], ["084", "黃連素／小蘗鹼", "與二甲雙胍類似會活化 AMPK 代謝開關，支持血糖血脂", "560"], ["061", "NMN複方", "補充 NAD+；研究提醒補劑效果較小，宜搭配飲食運動打底", "570"]]}, {"i": 14, "title": "哪些抗衰方式 真的撥得動生物鐘？", "date": "9月30日 廣東", "body": ["這篇研究把過去散落在51項試驗裡的抗衰證據拼到了同一張圖上，得出的結論可以濃縮成三句話。", "第一，不是所有\"抗衰方式\"都能被時鐘讀出來。藥物干預，尤其是抗炎症的生物製劑和二甲雙胍，對生物年齡的撥動最明顯；生活方式干預（地中海飲食、戒菸、規律運動）有一定訊號但弱一些；各類補劑，不管是NAD+、槲皮素還是維生素，效應都很小而且結果不一致；醫療手術類干預則幾乎沒有可重複的訊號。", "第二，用哪把\"尺\"量很關鍵。新一代的表觀遺傳時鐘，比如DunedinPACE、PCGrimAge和SystemsAge，對干預有穩定響應；而早期的經典時鐘（Horvath、Hannum）幾乎紋絲不動，讓人誤以為干預無效。", "第三，時鐘變年輕不等於真的長壽。作者反覆強調，這些都是短期血液標誌物的變化，能不能轉化為真正的壽命延長，還需要長達十年以上的隨機對照試驗來驗證。", "文獻科普解讀，不構成健康建議。Sehgal R, et al. Nat Med. 2026。"], "tags": ["衰老", "抗衰", "科學抗衰", "抗衰補劑"], "dup": 0, "cat": "衰老機制", "plain": "科學家把 51 個抗老實驗放在一起比，用「表觀遺傳時鐘」量身體的真實年齡。結果：藥物（抗發炎藥、二甲雙胍）撥時鐘最明顯；地中海飲食、戒菸、運動有效但比較弱；各種補充劑效果很小。而且要用新一代的時鐘量才準。最後提醒：時鐘變年輕，不一定等於真的活更久。", "mind": {"c": "哪些抗老真的有效？", "b": [["效果排行", ["藥物＞生活方式＞補劑＞手術"]], ["生活方式", ["地中海飲食", "戒菸", "規律運動"]], ["量尺很重要", ["新時鐘 DunedinPACE/GrimAge 靈敏", "舊時鐘 Horvath 幾乎不動"]], ["提醒", ["時鐘年輕≠長壽", "需10年以上試驗"]]]}, "frame": [["想抗老", "選擇方法"], ["基礎", "生活方式打底"], ["測量", "用對量尺"], ["驗證", "長期追蹤真實健康"]], "prod": [["特級初榨橄欖油＋綜合堅果", "地中海飲食的主角，多酚與好油幫忙抗發炎"], ["運動手環", "記錄活動量，幫助養成規律運動"], ["生物年齡檢測", "用新一代時鐘了解自己的老化速度"]], "gb": [["041", "薑黃素＋胡椒鹼", "研究中抗發炎干預撥動生物時鐘最明顯，薑黃素抑制發炎總開關 NF-κB", "620"], ["084", "黃連素／小蘗鹼", "與二甲雙胍類似會活化 AMPK 代謝開關，支持血糖血脂", "560"], ["061", "NMN複方", "補充 NAD+；研究提醒補劑效果較小，宜搭配飲食運動打底", "570"]]}, {"i": 15, "title": "cell最新:少吃蛋白質，對代謝和壽命更友好", "date": "編輯時間：Sep 22", "body": ["這篇 2026 年的綜述，把幾十年關於“蛋白質與衰老”的研究攏到一起，得出一個反常識的結論：我們一直被勸“多吃蛋白質”，尤其是老年人怕肌肉流失。但證據顯示，對多數已經吃夠、甚至吃太多的人來說，適當少吃一點，反而對代謝和壽命更友好。", "它不是說“蛋白質有害”，而是“別過量、挑著吃”。在小鼠和果蠅身上，限制特定氨基酸——尤其是蛋氨酸、異亮氨酸和纈氨酸——就能復現低蛋白飲食的大部分好處：血糖更穩、血脂更低、炎症更少，衰老細胞被清得更乾淨，粒線體更有勁，壽命延長一到三成。人體短期試驗也看到類似苗頭。", "不過作者反覆提醒，這不是讓所有人立刻斷蛋白。孕婦、孩子、術後恢復者、本就營養不良的老人，以及認真健身的人，蛋白質需求更高，盲目限制反而傷身。沖繩長壽老人約 9% 的熱量來自蛋白質、且以植物為主，但他們同時也吃得少、動得多，功勞不能全算在“少吃蛋白”上。", "更穩妥的啟發是：先搞清楚自己是不是吃多了。如果日常肉、蛋、奶、蛋白粉攝入偏高，可以適當往植物蛋白、全穀物、蔬菜傾斜，同時靠運動保住肌肉。按人定製、精準營養，才是接下來要走的路。"], "tags": [], "dup": 0, "cat": "蛋白質", "plain": "大家常說要多吃蛋白質，但這篇整理發現：對已經吃夠、甚至吃太多的人，稍微少吃一點反而對血糖、血脂和壽命更好。但孕婦、小孩、開刀恢復中、營養不良的老人和健身的人一定要吃夠。重點不是「蛋白質有害」，而是「別過量、挑著吃」，多選植物蛋白，再靠運動保住肌肉。", "mind": {"c": "蛋白質別過量", "b": [["動物研究", ["限制特定胺基酸", "血糖穩、血脂低", "壽命延長1-3成"]], ["不適用的人", ["孕婦、小孩", "術後恢復", "營養不良老人", "健身者"]], ["沖繩長壽", ["蛋白約9%熱量", "以植物為主"]], ["建議", ["先評估吃太多沒", "偏向植物蛋白", "運動保肌"]]]}, "frame": [["現況", "蛋白質吃過量"], ["影響", "代謝負擔、發炎"], ["調整", "適量＋植物蛋白"], ["結果", "代謝改善，運動保肌"]], "prod": [["豌豆 / 大豆植物蛋白粉", "取代部分動物蛋白，胺基酸組成較溫和"], ["全穀雜糧米", "補充植物蛋白和膳食纖維"], ["毛豆、鷹嘴豆零食", "健康的植物蛋白小點心"]], "gb": [["070", "辣木粉", "植物性高營養密度，提供植物蛋白、礦物質與多酚", "450"], ["033", "亞麻仁籽渣", "植物來源纖維與好油，讓飲食往植物方向傾斜", "198"], ["096", "孢子益生菌（加亞麻仁渣）", "調整腸道菌，幫助植物性飲食的消化與代謝", "650"]]}, {"i": 16, "title": "平穩血壓（全網最全）", "date": "Sep 21", "body": ["最近在外網刷到一些關於高血壓的內容，還挺顛覆我認知的。以前我一直以為高血壓是年齡大了才會有，後來才明白，血壓本身會隨身體狀態變化——平時久坐不運動，飲食油膩過鹹，情緒急躁及作息不規律等，都會增添心血管負擔，干擾血壓平穩，容易忽高忽低。", "血壓升高，就容易白天頭昏發沉，情緒總緊繃煩躁，晚上又睡不踏實…… 關於怎麼幫助平穩血壓，我整理了一些方法，具體的在圖上，這裡我挑幾個好操作的說說", "1️⃣少喝咖啡濃茶", "我知道很多人離不開咖啡，但咖啡因容易刺激神經，短期提神，後續容易讓人緊張、頭昏", "完全戒掉很難，給自己定兩條硬性原則：", "①絕不空腹喝咖啡 / 濃茶，先吃雞蛋、全麥麵包墊一墊", "②下午兩點之後堅決不碰，嘴饞想喝飲品，可以換成蘋果醋兌水或者檸檬水。", "2️⃣晨起別猛起", "睡醒不要一下子坐起來、猛地站起。起床瞬間體位變化很容易造成波動。醒來先躺 30 秒，慢慢坐起靜坐半分鐘，再下床走動。", "3️⃣補充納豆激酶", "做功課瞭解到納豆激酶是呵護心血管的黃金幫手。日常飲食很難吃到足量，需要單獨補充。納豆激酶也不是那個都可以，單一納豆激酶的覆蓋面太窄，對呵護心血管的效果有限。所以後面選了亞麻籽、紅曲米、黑芝麻都有的高活性復配型納豆激酶。現在晚飯後吃兩粒，個人狀態穩定很多，頭昏發沉的情況緩解不少，心情也舒展了，慢慢形成一個舒服的良性迴圈。我吃的是 Probody 納豆激酶。", "6️⃣緩慢深呼吸", "不要急促大口喘氣，放慢呼吸節奏，幫助身體放鬆，緩解緊繃感。鼻吸 4 秒，屏息 2 秒，嘴呼 6 秒，重複幾組，不用刻意用力。", "5️⃣每天短途散步", "不用劇烈運動，飯後慢走 20 分鐘，溫和舒展身體，幫助舒緩緊繃，不要快走、快跑。", "6️⃣少熬夜，固定入睡時間", "儘量每天同一時間睡覺起床，熬夜會打亂身體狀態，儘量不超過 23 點入睡。#心血管#納豆激酶 #中老年人健康#中老年人#probody納豆激酶#好物分享#營養補劑#納豆激酶推薦"], "tags": [], "dup": 0, "cat": "心血管", "plain": "血壓不是老了才會高！久坐、吃太鹹太油、脾氣急、作息亂，都會讓血壓忽高忽低。好做的方法有：少喝咖啡濃茶，不空腹喝、下午兩點後不喝；起床先躺 30 秒再慢慢起來；慢慢深呼吸（吸 4 秒、停 2 秒、吐 6 秒）；飯後散步 20 分鐘；每天固定時間睡覺，最好 11 點前。", "mind": {"c": "平穩血壓", "b": [["原因", ["久坐", "油鹹飲食", "情緒急躁", "作息亂"]], ["飲食", ["少咖啡濃茶", "不空腹喝", "午後兩點不喝"]], ["生活", ["起床慢慢起", "深呼吸4-2-6", "飯後散步20分"]], ["作息", ["固定睡覺時間", "23點前入睡"]]]}, "frame": [["原因", "生活習慣亂"], ["影響", "血管負擔、血壓波動"], ["症狀", "頭昏、煩躁、失眠"], ["行動", "調整飲食、作息、呼吸"], ["結果", "血壓平穩"]], "prod": [["納豆激酶", "幫助維持血液循環順暢（服抗凝血藥者先問醫師）"], ["電子血壓計", "早晚量測，掌握自己的血壓變化"], ["低鈉鹽", "減少鈉攝取，減輕血管壓力"]], "gb": [["055", "地龍蛋白複方", "與納豆激酶同類的溶纖酵素，幫助血流順暢（服抗凝血藥者先問醫師）", "550"], ["091", "甘氨酸鎂複方粉包", "鎂幫助血管平滑肌放鬆，對缺鎂或高血壓者有幫助", "1350"], ["043", "鹼能活（含檸檬酸鉀）", "鉀幫助排出多餘鈉、平衡血壓（腎臟病者先問醫師）", "520"], ["054", "GABA", "緩解緊繃情緒、幫助睡眠，減少血壓波動", "540"]]}, {"i": 17, "title": "關於運動的好處，科學最新發現", "date": "9月18日", "body": ["這是第一項直接比較兩種運動方式對乳腺癌倖存者抗癌肌因子影響的隨機對照研究。結果很明確：無論力量訓練還是高強度間歇訓練，只要一次中高強度運動，身體就會立刻釋放一批“抗癌信使”——Decorin、IL-6、SPARC等肌因子，讓血液環境暫時變得不適合癌細胞生長。", "運動剛結束時，這些肌因子升高了9%到47%；把運動後的血清滴到乳腺癌細胞培養皿裡，癌細胞生長下降了19%到29%。兩種運動都有效，其中高強度間歇訓練在運動剛結束時對IL-6的提升和對癌細胞的抑制更強。", "這說明運動不只是“健身”，它本身就是一種幾乎無副作用的“治療”。肌肉收縮釋放的訊號分子隨血液到達全身，干擾腫瘤微環境、促進癌細胞凋亡。既往研究也發現，堅持運動的乳腺癌患者復發和死亡風險約低20%。", "需要提醒：這是單次運動的急性效果，體外細胞實驗不能完全代表體內真實腫瘤；長期運動能否真正降低復發，還需更長時間跟蹤。但方向已經很清楚——別管選哪種運動，先動起來，一次中高強度訓練就有可測量的抗癌收益。"], "tags": ["運動", "科學抗衰"], "dup": 0, "cat": "運動", "plain": "肌肉一用力，就會放出「抗癌小信使」（肌激素）到血液裡。研究讓乳癌康復者做一次重量訓練或高強度間歇運動，血液中的抗癌信使增加 9～47%；把運動後的血液滴到癌細胞上，癌細胞生長少了 19～29%。運動本身就是一種幾乎沒有副作用的「藥」。", "mind": {"c": "運動放出抗癌信使", "b": [["實驗", ["乳癌康復者", "重訓 vs 高強度間歇"]], ["發現", ["肌激素增加9-47%", "癌細胞生長降19-29%", "HIIT更強"]], ["意義", ["堅持運動復發死亡少約20%"]], ["限制", ["單次急性效果", "細胞實驗"]]]}, "frame": [["行動", "一次中高強度運動"], ["機制", "肌肉釋放 Decorin、IL-6、SPARC"], ["環境", "血液變得不利癌細胞"], ["長期", "降低復發風險"]], "prod": [["彈力帶 / 壺鈴", "在家做阻力訓練，刺激肌肉釋放肌激素"], ["乳清蛋白", "運動後補充，幫助肌肉修復與成長"], ["運動心率錶", "掌握中高強度區間，運動更有效率"]], "gb": [["034", "胺基酸可可粉包", "運動後補胺基酸，幫肌肉修復、持續釋放肌激素", "780"], ["043", "鹼能活（含肌酸）", "肌酸讓高強度訓練更有力，提升運動品質", "520"], ["094", "D3（2000IU＋A＋E）", "維生素 D 支持肌肉與免疫功能", "580"]]}, {"i": 18, "title": "腦霧不是想太多，是大腦在報警", "date": "9月15日", "body": ["腦霧並非\"想太多\"，而是神經炎症、腸腦軸失調與睡眠障礙共同導致的認知功能下降。2026年營養學綜述指出，膳食干預可透過調節炎症、腸道菌群和睡眠質量改善腦功能。", "PS（磷脂醯絲氨酸）是大腦皮層中含量最高的磷脂之一，構成神經細胞膜、啟用神經元訊號通路，並幫助管控皮質醇；", "PQQ被稱為粒線體最佳化劑，20mg/天連續12周的雙盲試驗證實可顯著提升綜合記憶與語言記憶，年輕人8周即見效。", "皇家橡樹 PS & PQQ 配方將 PS 100mg、PQQ 10mg 與亞精胺 3mg 合三為一，從細胞膜結構、粒線體能量到衰老細胞清除三個層面協同作用，幫助高壓人群應對腦霧、恢復專注。", "皇家橡樹健康為英國國王獎獲獎企業，該獎項自1965年由英國皇室設立以來，全英國僅180餘家企業獲得過此殊榮，並由國王親自授獎，為品牌實力背書。作為\"Made in Britain\"英國製造組織的官方成員，皇家橡樹健康還多次獲得\"英國製造獎\"，是英國本土製造與科研驅動的專業膳食補充劑公司。"], "tags": ["腦霧", "大腦健康", "皇家橡樹PQQ", "皇家橡樹PS", "PQQ", "磷脂醯絲氨酸", "亞精胺", "皇家橡樹健康"], "dup": 0, "cat": "大腦", "plain": "腦霧不是你想太多，而是大腦在「發炎、腸腦溝通失調、睡不好」時發出的警報。飲食可以幫忙：PS 是腦細胞膜的材料，還能幫忙管壓力荷爾蒙；PQQ 能讓粒線體（細胞發電廠）更有力，試驗每天 20mg、12 週記憶變好；亞精胺則幫忙清掉老舊細胞。", "mind": {"c": "腦霧是大腦警報", "b": [["原因", ["神經發炎", "腸腦軸失調", "睡眠障礙"]], ["PS", ["腦細胞膜材料", "管控皮質醇"]], ["PQQ", ["粒線體優化", "20mg、12週改善記憶"]], ["亞精胺", ["清除衰老細胞", "啟動自噬"]]]}, "frame": [["原因", "發炎＋腸腦失調＋睡不好"], ["影響", "大腦能量與訊號變差"], ["症狀", "腦霧、不專注"], ["對策", "細胞膜／粒線體／清除 三層支援"]], "prod": [["PS＋PQQ 複方", "細胞膜＋粒線體能量雙管齊下，幫助專注"], ["亞精胺（小麥胚芽萃取）", "啟動自噬，幫細胞大掃除"], ["益生菌", "調整腸道菌，改善腸腦之間的訊號"]], "gb": [["098", "粒線寶", "從粒線體能量層面支援大腦（成分以產品標示為準）", "550"], ["042", "清思油滴（迷迭香＋EPA魚油）", "迷迭香醒腦、EPA 降低神經發炎，對付腦霧", "450"], ["050", "銀杏複方", "促進腦部微循環，提升專注", "510"], ["062", "酶菌醣體（益生菌＋茶胺酸）", "益生菌調整腸腦軸、茶胺酸放鬆，改善腦霧兩大成因", "720"]]}, {"i": 19, "title": "耶魯大學：少吃一點，衰老就慢一點", "date": "09-13", "body": ["今天講一篇關於“吃”和“衰老”的論文。題目有點反直覺——少吃一點，真的能老得慢一點嗎？", "這篇研究來自耶魯大學醫學院 Dixit 團隊，2025年8月發表在預印本平臺 bioRxiv 上。", "他們跟蹤了42名健康成年人，讓人家每天少吃約14%的熱量，堅持整整2年。", "結果發現：少吃之後，體內一套叫“補體系統”的免疫巡邏隊安靜了下來，慢性炎症減輕，衰老的節奏被放慢。", "少吃為什麼能讓衰老慢下來？關鍵在補體系統。", "先用一句話解釋補體：它是身體裡一套古老的“巡邏隊”，清理病菌和衰老細胞；但長期過度活躍，會反過來點起慢性炎症的火。", "鏈條共五步：吃太飽→補體活躍、C3切出C3a→脂肪巨噬細胞被啟用（ERK/STAT3通路）→釋放IL-6、IL-1β→慢性炎症、器官老化加速。", "反過來，少吃14%，補體系統整體下調，炎症減輕，脂肪等組織的“衰老時鐘”被回撥。", "文獻圖2：按血漿蛋白推算的各器官衰老評分，藍色越多代表“年齡差”回落越多，脂肪組織回撥最顯著。"], "tags": ["衰老的表現", "衰老", "科學抗衰", "HFW", "飲食", "健康howto", "健康管理howto"], "dup": 0, "cat": "飲食", "plain": "研究讓 42 個健康大人每天少吃約 14%（大概少半碗飯的量），持續 2 年。結果身體裡的「補體巡邏隊」安靜下來，慢性發炎減少，脂肪組織的老化時鐘被撥了回去。吃太飽會讓巡邏隊太激動，反而在身體裡「放火」造成發炎。", "mind": {"c": "少吃一點，老得慢一點", "b": [["研究", ["耶魯 Dixit 團隊", "42人、2年", "少吃14%熱量"]], ["補體是什麼", ["身體巡邏隊", "過度活躍會點火"]], ["五步連鎖", ["吃太飽→C3a↑", "巨噬細胞活化", "IL-6/IL-1β", "器官老化"]], ["結果", ["補體下降", "發炎減少", "脂肪最年輕化"]]]}, "frame": [["原因", "吃太飽"], ["啟動", "補體 C3a 活躍"], ["放火", "脂肪巨噬細胞釋放發炎因子"], ["反轉", "少吃 14% → 發炎降、老化變慢"]], "prod": [["燕麥 / 高纖代餐", "高飽足、低熱量，輕鬆少吃一點"], ["小份量餐盤、分裝盒", "控制份量的實用小工具"], ["綠茶多酚", "抗氧化、抗發炎，輔助體重管理"]], "gb": [["033", "亞麻仁籽渣", "高纖增加飽足感，輕鬆少吃一點", "198"], ["083", "苦瓜皂甘複方", "幫助餐後血糖平穩，減少飢餓感波動", "540"], ["038", "EGCG複方", "茶多酚抗氧化、抗發炎，輔助體重管理", "560"]]}, {"i": 20, "title": "打麻將能顯著改善老年人記憶、增強大腦功能", "date": "Sep 11", "body": ["這是一項為期6個月的隨機對照試驗，首次結合行為與神經影像證據表明：居家數字麻將認知干預能夠顯著改善老年人的延遲迴憶能力，並伴隨右腦島葉功能連線（ReHo）增強，同時帶來舒張壓下降、總膽固醇改善等心血管獲益。", "研究將文化熟悉、趣味性強的數字麻將，與步行激勵、遊戲化機制相結合，幫助60名社群老年人保持高參與度——全程平均完成800餘次訓練，方案完成率達94%。其核心機制可能在於：高難度訓練強化以右島葉為核心的“突顯網路”，促進內外資訊的快速切換與錯誤監控；而額極體積下降與記憶改善並存，更可能反映神經效率的提升而非退行。", "研究表明：將認知訓練嵌入熟悉、可持續的文化活動中，是促進健康老齡化的可行路徑；未來仍需採用主動對照、析因設計的更大規模試驗，以精確區分認知訓練與運動各自的貢獻。"], "tags": ["大腦", "認知", "記憶", "認知衰退", "打麻將", "大腦能量", "DHA", "HFW"], "dup": 0, "cat": "大腦", "plain": "研究讓 60 位老人在家玩數位麻將 6 個月，再搭配走路，結果「延遲回憶」（過一陣子還記得）明顯進步，大腦右側島葉的連結變強，連血壓和膽固醇都改善了。因為麻將有趣又熟悉，大家很願意一直玩（完成率 94%）。把動腦練習放進喜歡的活動，最容易堅持！", "mind": {"c": "打麻將護腦", "b": [["研究", ["60位老人", "6個月", "數位麻將＋走路"]], ["效果", ["延遲回憶進步", "右島葉連結增強", "血壓、膽固醇改善"]], ["為什麼有效", ["突顯網路", "訊息快速切換", "神經效率提升"]], ["關鍵", ["熟悉又有趣", "完成率94%"]]]}, "frame": [["方法", "熟悉有趣的遊戲"], ["持續", "動腦＋步行"], ["大腦", "強化突顯網路"], ["結果", "記憶進步＋心血管獲益"]], "prod": [["麻將 / 益智桌遊", "計算、記憶、判斷同時訓練，又能社交"], ["計步器", "搭配步行激勵，動腦也動身"], ["藻油 DHA", "提供神經細胞膜原料，支援動腦訓練"]], "gb": [["002", "EPA+DHA複方粉包", "DHA 提供神經細胞膜原料，支援動腦訓練", "1350"], ["050", "銀杏複方", "促進腦部血流，搭配益智遊戲更有感", "510"], ["042", "清思油滴（迷迭香＋EPA魚油）", "迷迭香香氣提神，幫助專注與記憶", "450"]]}, {"i": 21, "title": "GlyNAC：逆轉粒線體衰老的新策略", "date": "Sep 7", "body": ["谷胱甘肽（GSH）是細胞內最豐富的內源性抗氧化三肽，負責清除粒線體呼吸產生的活性氧並維持粒線體功能。隨增齡，GSH 合成能力下降，導致 GSH 缺乏、氧化應激升高、粒線體功能障礙，形成加速衰老的\"氧化應激—粒線體損傷\"惡性迴圈。 貝勒醫學院（Baylor College of Medicine）是美國休斯敦的一所私立醫藥學校，被認為是全美最傑出的醫學院之一，獲中國教育部認證。 學校在世界範圍內的生物醫藥研究領域處於領先地位，貝勒醫學院在谷胱甘肽（GSH）與粒線體衰老領域的一系列研究走在前列：2022 年 Nutrients 小鼠研究顯示 GlyNAC 延長壽命 24% 並糾正多項衰老指標；2023 年 J Gerontol A 16 周 RCT 表明 GlyNAC 改善老年人 GSH、粒線體、炎症、肌力、步速；2021 年 Clin Transl Med 24 周初步試驗進一步證實 8 項維度獲益，並揭示停用 12 周後獲益回退，提示需持續補充。 跨物種、跨年齡段的一致結果表明，GlyNAC 透過\"甘氨酸 + NAC + GSH\"三聯效應，同步改善谷胱甘肽缺乏、氧化應激與粒線體功能障礙，有望成為簡單、安全、可推廣的延緩衰老營養干預策略，但仍需更大規模、更長期的隨機臨床試驗進一步驗證。"], "tags": ["打工人的養生好物", "Glynac", "谷胱甘肽", "nac乙醯半胱氨酸", "皇家橡樹NAC", "皇家橡樹雙甘氨酸鎂", "ROH雙甘氨酸鎂", "glynac", "N乙醯半胱氨酸"], "dup": 0, "cat": "衰老機制", "plain": "穀胱甘肽（GSH）是細胞裡最厲害的「清潔工」，專門清理粒線體發電時冒出的廢氣。年紀大了清潔工變少，廢氣越堆越多，粒線體壞得更快，變成惡性循環。甘胺酸＋NAC 是製造清潔工的原料，研究發現補充後老鼠壽命延長 24%，老人肌力、步速也進步，但停掉後會退回去，需要持續。", "mind": {"c": "GlyNAC", "b": [["問題", ["GSH隨年齡下降", "氧化壓力上升", "粒線體受損"]], ["原料", ["甘胺酸", "NAC（半胱胺酸）", "合成GSH"]], ["證據", ["小鼠壽命+24%", "16週RCT改善肌力步速", "停用12週回退"]], ["提醒", ["需要持續", "待大型試驗"]]]}, "frame": [["老化", "GSH 不足"], ["惡性循環", "氧化壓力＋粒線體受損"], ["補充", "甘胺酸＋NAC"], ["回升", "GSH 恢復"], ["結果", "多項老化指標改善"]], "prod": [["NAC（N-乙醯半胱胺酸）", "提供半胱胺酸，幫身體製造穀胱甘肽"], ["甘胺酸鎂", "同時提供甘胺酸原料與鎂，還能幫助放鬆"], ["穀胱甘肽", "直接補充抗氧化三肽清潔工"]], "gb": [["085", "NAC複方", "提供半胱胺酸，是製造穀胱甘肽（GSH）的關鍵原料", "530"], ["091", "甘氨酸鎂複方粉包", "提供甘胺酸——GlyNAC 的另一半，兩者一起補就是研究組合", "1350"]]}, {"i": 22, "title": "必須警惕GLP1減肥隱患：肌肉流失與營養補充", "date": "Sep 2", "body": ["GLP-1藥物減重20%以上，但可能導致肌肉流失和營養缺乏，包括蛋白質、維生素D、B族維生素、鐵、鈣、鎂和鋅。建議高蛋白飲食、抗阻訓練、微量元素補充和營養師介入，確保健康減重。", "(溫馨提示：本文僅為公開文獻內容科普分享，不構成個人健康指導，相關製劑屬於處方類產品，一切請遵從專業醫師的評估與囑咐。)"], "tags": ["營養補劑howto", "減肥", "健康管理howto", "健康科普howto", "存肌肉怎麼吃", "科學抗衰", "健康howto"], "dup": 0, "cat": "蛋白質", "plain": "GLP-1 減肥藥可以讓人瘦 20% 以上，但瘦掉的不只是脂肪，還可能有肌肉！而且吃得少，蛋白質、維生素 D、B 群、鐵、鈣、鎂、鋅都容易不夠。所以用這類藥時，要多吃蛋白質、做重量訓練、補足微量營養素，最好有營養師幫忙，才能「健康地瘦」。", "mind": {"c": "GLP-1 減肥隱患", "b": [["效果", ["體重減20%以上"]], ["隱患", ["肌肉流失", "營養缺乏"]], ["容易缺", ["蛋白質", "維生素D、B群", "鐵、鈣、鎂、鋅"]], ["對策", ["高蛋白飲食", "阻力訓練", "補微量元素", "營養師介入"]]]}, "frame": [["使用", "GLP-1 藥物"], ["副作用", "吃得少→肌肉與營養流失"], ["風險", "虛弱、骨質變差"], ["對策", "高蛋白＋重訓＋營養補充"]], "prod": [["乳清 / 大豆蛋白粉", "食量變小時也能補足蛋白質，保住肌肉"], ["綜合維生素礦物質", "一次補齊 D、B 群、鐵、鈣、鎂、鋅"], ["彈力帶", "居家阻力訓練，告訴身體「肌肉還要用」"]], "gb": [["034", "胺基酸可可粉包", "食量變小時也能補足胺基酸，減少肌肉流失", "780"], ["087", "超級B群", "補足減重時容易缺的 B 群，支持能量代謝", "520"], ["017", "酵母鋅＋核酸", "補鋅，支持免疫與組織修復", "550"], ["092", "D3（5000IU）", "GLP-1 使用者常缺維生素 D，支持骨骼肌肉", "580"]]}, {"i": 23, "title": "cell：肝臟在40歲時率先衰老", "date": "Aug 25", "body": ["這是發表於Cell（2026）的國內 X Age（耄耋計劃）研究，基於mCAS 中國多中心標準化衰老佇列，納入2019 名 18 91 歲中國受試者，整合臨床表型、多組學（甲基化、轉錄組、蛋白質組、代謝組、宏基因組）、影像、行為測試，搭建中國人專屬多層級衰老評估體系。", "基於該研究6 大器官特異性衰老時鐘（Organ Clock），衰老不同步、非勻速，存在分子層面的衰老拐點（分子劇變視窗），不等同於器官功能完全衰竭的年齡。", "1.肝臟：約 40 歲（最早出現衰老拐點） 肝臟是本研究中最早發生分子層面衰老轉折的器官。40 歲左右肝臟合成功能、蛋白分泌譜發生明顯改變；衰老肝臟會釋放大量凝血因子（F9、F13B 等）進入血液，作為驅動血管、全身多器官衰老的分子源頭。", "2.大腦：約 50 歲，緊隨肝臟之後 50 歲左右出現大腦分子與功能的衰老拐點，腦功能、腦區連線性開始明顯下滑，認知、處理速度下降。肝臟拐點比大腦早 10 年左右。", "3.血管、肺：成年後持續緩慢退行，在兩大全域性衰老視窗出現明顯惡化", "•血管：成年期持續緩慢老化；40 50 歲激素 / 脂質波動、60 70 歲凝血通路啟用兩個階段會進一步加劇血管內皮衰老；肝臟釋放的凝血因子主要損傷血管內皮。", "•肺：肺活量、通氣能力成年後逐步下降；60 70 歲階段衰退進一步放大。", "4.肌肉、皮膚：更多屬於全身性衰老的 “結果表現” 肌肉流失、皮膚衰老沒有出現 40 50 歲級別的早期分子拐點；隨全身衰老程序逐步顯現，在60 70 歲第二大衰老視窗衰退會變得更加突出，屬於相對偏後期的衰老表現。", "全人群兩大全域性性衰老加速視窗：", "1.40 50 歲第一視窗：激素劇烈波動、脂質蓄積；肝臟率先發生拐點，拉開系統性衰老序幕。", "2.60 70 歲第二視窗：血壓升高、骨量下降，凝血通路大規模啟用，血管、肺、肌肉、皮膚同步加速衰老，是重要干預視窗期。"], "tags": ["衰老", "科學抗衰", "延緩衰老保持年輕", "抗老要護腦", "肝臟"], "dup": 0, "cat": "衰老機制", "plain": "中國的大型研究發現，身體各器官不是一起變老的！肝臟大約 40 歲最先出現老化「轉折點」，還會放出凝血因子到血液，帶著全身一起老；大腦大約 50 歲跟上。人有兩個加速變老的時期：40～50 歲和 60～70 歲。所以 40 歲開始就要好好照顧肝臟。", "mind": {"c": "肝臟40歲率先老化", "b": [["研究", ["X Age 計畫", "2019名18-91歲中國人", "多組學＋影像"]], ["器官順序", ["肝臟約40歲", "大腦約50歲", "血管、肺持續退化", "肌肉皮膚較晚"]], ["兩大窗口", ["40-50歲：激素、脂質波動", "60-70歲：凝血活化、多器官加速"]], ["機制", ["肝臟釋放凝血因子", "傷害血管內皮"]]]}, "frame": [["40歲", "肝臟先出現轉折"], ["傳遞", "凝血因子進入血液"], ["擴散", "血管、大腦跟著老"], ["60-70歲", "多器官同步加速"], ["行動", "40 歲開始護肝護血管"]], "prod": [["薑黃素", "抗發炎、抗氧化，支持肝臟代謝"], ["番茄汁 / 番茄紅素", "研究顯示番茄有助減少肝臟脂肪"], ["紫蘇籽油", "Omega-3 幫助調節血脂、減少發炎"]], "gb": [["077", "肝寶", "主打肝臟保養（成分以產品標示為準），40 歲起提早顧肝", "550"], ["085", "NAC複方", "提升肝臟穀胱甘肽，支持解毒與抗氧化", "530"], ["041", "薑黃素＋胡椒鹼", "抗發炎、抗氧化，減緩肝臟與血管慢性發炎", "620"], ["084", "黃連素／小蘗鹼", "調節血脂與血糖，減輕肝臟代謝負擔", "560"]]}, {"i": 24, "title": "常吃番茄有助減少肝臟脂肪堆積", "date": "8月19日", "body": ["代謝功能障礙相關脂肪性肝病（MASLD）是全球高發慢性肝病，生活方式調整是主要干預手段，但單一食物對該病的作用仍缺乏充分臨床證據。POMOSANO 隨機對照試驗探索了日常食用番茄對 MASLD 成年人肝脂肪變性的改善效果。", "該研究納入 79 名 BMI≤30 kg/m² 的 MASLD 受試者，分為番茄干預組 42 人、無番茄飲食對照組 37 人，干預週期 6 周。干預組每日食用 200 g 生番茄 + 50 g 番茄醬，生番茄保留熱敏活性物質，加工番茄醬提升番茄紅素生物利用度；兩組維持原有生活習慣，透過 FibroScan 的受控衰減引數 CAP 評估肝臟脂肪含量，同時監測體成分、肝纖維化、代謝生化指標。", "6 周干預結束後，兩組 CAP 均出現下降，但干預組降幅更大：對照組 CAP 中位變化‑18.00 dB/m，干預組達‑35.00 dB/m。校正年齡、性別、BMI 後的混合效應模型顯示，時間‑處理互動作用顯著（β=-26.63，95% CI‑44.00~‑9.25，*p*=0.0030），證實番茄飲食可顯著降低肝臟脂肪，隨訪時干預組 CAP 數值也顯著低於對照組（*p*=0.0433）。", "值得注意，該肝臟脂肪改善效果**獨立於體重變化**。試驗期間受試者體重、腰圍、總體脂肪與內臟脂肪沒有出現組間顯著差異；肝硬度、FIB‑4 纖維化指數、血糖血脂、炎症標誌物等指標兩組對比也無統計學差別。研究者分析，番茄中番茄紅素、β‑胡蘿蔔素、多酚等活性物質，可透過抑制肝臟脂肪酸從頭合成、促進脂肪酸氧化、減輕炎症等通路減輕肝脂肪堆積。短期干預未能改變纖維化相關指標，推測和隨訪時間短、入組人群晚期纖維化佔比低有關。", "研究存在樣本量有限、干預週期短等侷限，不能替代藥物治療。該試驗提示，將生番茄搭配番茄醬納入日常膳食，可作為 MASLD 營養管理的可行策略，但仍需要更大樣本、更長週期臨床試驗進一步驗證臨床價值。", "本文僅用於學術交流和健康科普。"], "tags": ["科學抗衰", "衰老", "番茄", "西紅柿", "肝臟", "肝臟健康"], "dup": 0, "cat": "飲食", "plain": "脂肪肝是很常見的肝病。研究讓脂肪肝的人每天吃 200 克生番茄＋50 克番茄醬，連續 6 週。結果肝臟脂肪下降比沒吃番茄的人多了快一倍，而且不是因為變瘦！番茄裡的茄紅素、β-胡蘿蔔素和多酚，可以讓肝臟少做脂肪、多燒脂肪、減少發炎。生的加煮過的一起吃最好。", "mind": {"c": "番茄減肝脂肪", "b": [["研究", ["POMOSANO RCT", "79位脂肪肝患者", "6週"]], ["吃法", ["生番茄200g", "番茄醬50g"]], ["結果", ["肝脂肪CAP降35 vs 18", "和體重無關"]], ["機制", ["茄紅素、多酚", "少合成脂肪", "多燃燒脂肪", "減少發炎"]]]}, "frame": [["問題", "肝臟堆積脂肪"], ["介入", "每天生番茄＋番茄醬"], ["機制", "抑制脂肪合成、促進燃燒"], ["結果", "肝脂肪明顯下降"]], "prod": [["無鹽番茄汁", "每天方便補充茄紅素與多酚"], ["茄紅素膠囊", "高濃度茄紅素，抗氧化護肝"], ["特級初榨橄欖油", "搭配番茄一起吃，幫助茄紅素吸收"]], "gb": [["077", "肝寶", "肝臟保養產品（成分以產品標示為準），搭配番茄飲食", "550"], ["038", "EGCG複方", "綠茶多酚有助減少肝臟脂肪堆積", "560"], ["085", "NAC複方", "增加穀胱甘肽，保護肝細胞免於氧化傷害", "530"]]}, {"i": 25, "title": "植物蛋白更健康、更具多樣性", "date": "8月17日", "body": ["隨著全球人口增長，2050 年全球蛋白質需求預計翻倍，動物蛋白生產伴隨大量溫室氣體排放、土地資源消耗，植物蛋白成為可持續的替代方案。大豆、雜豆、穀物、假穀物是四類主流植物蛋白來源，它們在營養組成、功能特性上差異明顯，需要透過改性技術最佳化加工效能，在食品領域擁有廣闊應用前景。", "四類植物蛋白基礎營養對比", "大豆：蛋白 35‑55%，分離蛋白可達 90‑95%，屬於完全蛋白，含全部必需氨基酸。但有豆腥味、致敏風險。", "雜豆（豌豆、鷹嘴豆、扁豆）：蛋白 20‑30%，富含膳食纖維，有助降低壞膽固醇，預防心血管、2 型糖尿病。", "穀物（小麥、大米、燕麥）：蛋白 8‑15%，致敏性低，碳水含量高；大米蛋白消化表現優秀。", "假穀物（藜麥、莧菜、蕎麥）：蛋白 12‑18%，無麩質，氨基酸配比均衡，適合乳糜瀉人群，不飽和脂肪酸含量突出。", "怎麼改善植物蛋白難溶、起泡乳化差的短板？", "主流改性分物理、化學、酶解、複合改性。", "熱處理、超聲、脈衝電場這類**物理改性**不破壞蛋白一級結構，安全性高；酶解反應溫和，還能產出活性肽，但酶製劑成本偏高。", "改性也存在風險：高溫會生成晚期糖基化終產物，化學改性易產生副產物，加工工藝管控十分關鍵。", "不只是補充營養，植物蛋白還有多種生物活性", "水解得到的活性肽具備抗氧化、抑菌、抗腫瘤、調節血脂血壓作用。像大豆 7S 球蛋白，能夠降低血液總膽固醇與甘油三酯；豌豆、羽扇豆多肽可抑制食源性致病菌，有潛力做天然食品防腐劑。", "食品應用現狀", "▪植物奶：大豆製品技術最成熟；豌豆感官表現優於扁豆、鷹嘴豆；燕麥奶流行，但鈣含量低需要營養強化；假穀物奶仍處於研究階段。", "▪人造肉：大豆、豌豆、小麥麵筋為核心原料，穀物 + 雜豆復配實現氨基酸互補。", "▪還用於無麩質烘焙、3D 列印食品、可降解食品包裝。", "現存痛點", "豆腥味、風味缺陷仍是最大門檻，很難完全復刻動物蛋白的口感風味；部分改性產物安全性評估仍需完善。未來重點是最佳化加工工藝，改善感官體驗，挖掘假穀物的應用潛力。", "本文僅用於學術交流和健康科普。"], "tags": ["營養補劑howto", "科學抗衰", "健康howto", "食物與健康", "優質蛋白質來源", "素食者的蛋白質來源", "優質的蛋白質", "植物蛋白", "全穀物"], "dup": 0, "cat": "蛋白質", "plain": "除了吃肉，植物也能提供好蛋白質！主要有四類：大豆（蛋白質最高，含全部必需胺基酸）、雜豆（豌豆、鷹嘴豆，纖維多，可降壞膽固醇）、穀物（小麥、米、燕麥）、假穀物（藜麥、蕎麥，不含麩質）。植物蛋白還能分解成「活性肽」，有抗氧化、調血壓血脂的好處。", "mind": {"c": "植物蛋白四大類", "b": [["大豆", ["蛋白35-55%", "完全蛋白", "注意過敏"]], ["雜豆", ["蛋白20-30%", "纖維多", "降壞膽固醇"]], ["穀物", ["蛋白8-15%", "低致敏"]], ["假穀物", ["藜麥、蕎麥", "無麩質", "胺基酸均衡"]], ["額外好處", ["活性肽", "抗氧化、調血脂血壓"]]]}, "frame": [["需求", "蛋白質需求增加"], ["來源", "四類植物蛋白"], ["加工", "改性提升口感功能"], ["應用", "植物奶、植物肉、烘焙"]], "prod": [["大豆分離蛋白粉", "完全蛋白，含全部必需胺基酸"], ["鷹嘴豆 / 豌豆零食", "蛋白質加纖維，幫助降壞膽固醇"], ["藜麥", "無麩質、胺基酸均衡的假穀物"]], "gb": [["070", "辣木粉", "植物性蛋白與多種胺基酸、礦物質的天然來源", "450"], ["079", "憲遁草粉", "富含維生素 A、C、E 與多酚的植物營養補給", "750"], ["033", "亞麻仁籽渣", "植物纖維＋好油，幫助降低壞膽固醇", "198"]]}, {"i": 26, "title": "直接喝紫蘇籽油健康嗎？", "date": "編輯時間：8月14日", "body": [], "tags": ["omega3", "亞麻酸", "紫蘇籽油", "草本無限紫蘇籽油", "草本無限紫蘇籽油凝膠糖果", "HID草本無限"], "dup": 0, "cat": "好油", "plain": "紫蘇籽油富含植物 Omega-3（α-亞麻酸），可以直接喝，但它非常怕熱、怕光、怕空氣，開瓶後容易變質。所以最好冷藏避光、少量快用完，或選擇軟膠囊，隔絕空氣又好吞。不要拿來高溫煎炒炸。（本篇原文為圖片，此為依標題整理）", "mind": {"c": "直接喝紫蘇籽油？", "b": [["好處", ["植物Omega-3", "α-亞麻酸ALA"]], ["怕什麼", ["熱", "光", "空氣"]], ["怎麼吃", ["直接喝少量", "涼拌", "軟膠囊"]], ["保存", ["冷藏避光", "開瓶盡快用完"]]]}, "frame": [["優點", "高 ALA"], ["弱點", "容易氧化"], ["對策", "冷藏、避光、選膠囊"], ["結果", "安心補充 Omega-3"]], "prod": [["紫蘇籽油軟膠囊", "膠囊隔絕空氣，防止氧化、定量方便"], ["小瓶裝冷壓紫蘇籽油", "容量小、開瓶後能快點用完"], ["深色玻璃油瓶", "避光保存，減少油脂氧化"]], "gb": [["097", "亞麻仁油（500cc×2瓶）", "同樣高 ALA，小瓶裝容易新鮮用完，可直接喝或涼拌", "780"], ["016", "亞麻仁油10罐", "全家長期食用的植物 Omega-3 來源", "3470"], ["033", "亞麻仁籽渣", "不怕氧化的另一種吃法，補纖維與木酚素", "198"]]}, {"i": 27, "title": "晚餐早吃、少吃，體態更好", "date": "8月11日", "body": ["很多人只關心晚飯吃什麼、吃多少，卻忽略了吃飯時間這件事。這份營養學研究明確告訴我們：晚飯吃得太晚、晚上一頓吃太撐，會同時拖垮代謝和情緒，道理其實很好懂。", "我們身體自帶 24 小時生物鐘，白天胰島素、血糖調節能力更強，到晚上代謝效率會自然變低。食物是調節身體器官節律的關鍵訊號，晚飯吃得太晚，腸胃、胰腺、脂肪細胞的生物鐘會和大腦主控時鐘錯位，也就是節律紊亂，肥胖、血糖問題、煩躁抑鬱都會找上門。", "研究裡有清晰劃分：傍晚 5 點半到 7 點半吃晚飯算 “早吃”；晚上 9 點半以後，或是睡前不到兩個半小時才吃飯，都屬於 “晚吃”。熱量分配上，如果晚餐佔到全天一半以上熱量就是重油重碳的高熱量晚餐，健康吃法是晚餐只佔全天 11%~20% 的熱量。", "同樣一天吃一樣多的東西，晚飯拖到很晚吃，身體會出現三個壞變化：更容易餓、全天消耗熱量變少，身體還會主動囤積脂肪。調查顯示，晚上吃掉全天三分之一熱量的人，發胖機率直接翻一倍。除此之外，晚睡吃飯會影響助眠激素褪黑素，讓人睡不好，焦慮、低落的情緒也更容易出現，血糖、血脂、胰島素抵抗問題也會加重。", "各國吃飯習慣差距很大：西班牙人普遍晚上 10 點吃飯，瑞典 6 點左右就吃完晚飯，長期晚吃晚餐的地區，代謝相關健康問題更普遍。", "目前學界還缺少彙總所有臨床試驗的完整分析，所以研究者計劃整理 2010 年至今、18 至 65 歲普通人的對照實驗，專門對比早晚吃飯、晚餐熱量高低帶來的區別，避開熬夜工作、孕婦、飲食失調等特殊人群，重點觀察體重、血糖、焦慮抑鬱程度、睡眠質量這些指標，用資料量化晚吃晚餐的危害。", "給普通人實用建議：儘量晚上 7 點前吃完晚飯，睡前留出至少 3 小時消化；晚飯少吃主食、肥肉，控制熱量，既能穩住體重血糖，也能睡得更踏實、情緒更平穩。", "本文僅用於學術交流和健康科普。"], "tags": ["養生保健howto", "科學抗衰", "飲食與生活習慣"], "dup": 0, "cat": "飲食", "plain": "身體裡有一個 24 小時的生物時鐘，白天處理血糖的能力強，晚上變弱。晚餐太晚吃（9 點半以後或睡前不到 2.5 小時），身體時鐘就會亂掉，更容易餓、燒的熱量變少、還會囤脂肪，也睡不好、心情差。建議晚上 7 點前吃完，睡前留 3 小時，晚餐只佔全天 1～2 成熱量。", "mind": {"c": "晚餐早吃、少吃", "b": [["生物時鐘", ["白天代謝強", "晚上代謝弱"]], ["晚吃壞處", ["更容易餓", "消耗變少", "囤積脂肪", "睡不好、情緒差"]], ["定義", ["早吃：17:30-19:30", "晚吃：21:30後或睡前<2.5小時"]], ["建議", ["19點前吃完", "睡前留3小時", "晚餐佔11-20%熱量"]]]}, "frame": [["行為", "晚餐太晚太多"], ["機制", "器官時鐘與大腦錯位"], ["結果", "發胖、血糖差、睡不好"], ["行動", "7 點前吃完、晚餐少量"]], "prod": [["高纖蔬菜湯包", "晚餐吃得輕又有飽足感"], ["GABA / 茶氨酸", "幫助放鬆，晚上睡得更好"], ["定時提醒餐盒", "提醒自己早點吃晚餐、控制份量"]], "gb": [["054", "GABA", "晚上幫神經放鬆，讓早吃晚餐後也能好入睡", "540"], ["083", "苦瓜皂甘複方", "幫助餐後血糖平穩，減少晚上嘴饞", "540"], ["067", "防藍光老花眼鏡", "晚上減少藍光，保護褪黑激素與生物時鐘", "39"]]}, {"i": 28, "title": "cell發酵大蒜可以改善老年人肌肉衰退", "date": "Aug 7", "body": ["2026 年《Cell Metabolism》正式發表的這項研究，完整闡明發酵大蒜專屬活性物 S1PC 改善老年肌肉衰退、緩解衰老虛弱的完整作用通路，同時配套動物長期干預與人體隨機對照試驗，證據鏈完整。", "口服 S1PC 吸收效率很高，給藥 15 分鐘就能在血液、白色脂肪組織達到濃度峰值，作用核心位點在脂肪細胞。S1PC 透過促進 LKB1、STRAD、MO25 三者結合形成穩定功能複合物，啟用 LKB1 激酶，專一性磷酸化長壽蛋白 SIRT1 的 615 號位點；這條調控通路不會啟用 AMPK 脂解通路，細胞和人體試驗均證實，補充 S1PC 不會分解脂肪、升高血液遊離脂肪酸，不會干擾人體基礎脂代謝。", "實驗選取 15 月齡老年小鼠，持續 8 個月日常補充 S1PC，至小鼠 22 月齡檢測可見，衰老衰弱評分明顯下降，基礎體溫恢復至年輕個體水平，骨骼肌高頻收縮力量、肢體抓握能力均有實質性提升。這裡有一處關鍵發現：脂肪分泌的 eNAMPT 囊泡不會直接作用於骨骼肌，只會定向作用於下丘腦；下丘腦 NAD⁺儲備提升後，會增強支配肌肉的交感神經活性，上調肌肉細胞膜 β2 腎上腺素受體表達，啟用下游 CREB 訊號，提升肌肉氧化代謝相關蛋白水平，從訊號層面延緩肌少症。研究同時構建脂肪特異性 NAMPT 敲除小鼠，這類小鼠體內迴圈 eNAMPT 大幅減少，肌肉力量顯著衰退，反向印證這條脂肪 - 下丘腦 - 肌肉調控軸的核心作用。", "研究同步開展 40 人隨機雙盲人體試驗，受試者單次攝入 25mg S1PC。試驗結果具備明確人群差異：只有 40 歲以上、體脂水平健康、BMI≥18.5 的受試者，服藥 120 分鐘後血漿 eNAMPT 才會顯著上升，eNAMPT 提升幅度和體脂總量正相關，體脂偏低人群幾乎無明顯響應，說明足量健康脂肪是 S1PC 起效的必要條件。", "整體總結，發酵大蒜中的 S1PC 依靠脂肪組織 LKB1-SIRT1-eNAMPT 訊號軸，透過下丘腦交感神經調控改善老年衰弱與骨骼肌功能衰退，搭配 NMN 可放大抗衰效果。目前人體臨床試驗僅驗證單次短期給藥的生理變化，長期持續補充對中老年肌肉健康的實際改善作用，仍需更長週期、更大樣本的臨床研究補充資料支撐。", "本文僅用於學術交流和健康科普。"], "tags": ["科學抗衰", "衰老", "肌肉", "大蒜"], "dup": 0, "cat": "肌肉", "plain": "發酵大蒜（黑蒜）裡有一種特別成分 S1PC。它先作用在脂肪細胞，讓脂肪送出一種信號包裹（eNAMPT）到大腦的下視丘，提高大腦的 NAD+，再透過神經讓肌肉更有力。老鼠吃了 8 個月，變得不虛弱、抓力變強。人體試驗發現 40 歲以上、體脂正常的人才有反應，太瘦的人反而沒效。", "mind": {"c": "發酵大蒜 S1PC 護肌", "b": [["路徑", ["脂肪細胞", "eNAMPT 包裹", "下視丘 NAD+↑", "交感神經→肌肉"]], ["動物", ["老鼠8個月", "虛弱減少", "抓力提升"]], ["人體", ["40人單次25mg", "40歲以上、體脂正常才有反應"]], ["特點", ["不分解脂肪", "可搭配NMN"]]]}, "frame": [["吃進", "S1PC"], ["脂肪", "LKB1-SIRT1 啟動"], ["大腦", "下視丘 NAD+ 提升"], ["肌肉", "交感神經活化、代謝增強"], ["結果", "延緩肌少症"]], "prod": [["黑蒜 / 發酵大蒜萃取", "含 S1PC，啟動脂肪—大腦—肌肉的信號路徑"], ["NMN", "補充 NAD+，與 S1PC 互相加乘"], ["乳清蛋白", "提供肌肉原料，配合訓練保肌"]], "gb": [["048", "大蒜素", "大蒜的活性保健成分（研究用的是發酵大蒜 S1PC，兩者不同但同屬大蒜保健）", "450"], ["061", "NMN複方", "文中提到搭配 NMN 可放大 NAD+ 抗衰效果", "570"], ["034", "胺基酸可可粉包", "提供肌肉原料，配合訓練延緩肌少症", "780"]]}, {"i": 29, "title": "cell鼻腔用藥可逆轉大腦排汙能力衰退", "date": "Aug 1", "body": ["大腦會持續產生代謝垃圾，比如誘發老年痴呆的澱粉樣蛋白，腦脊液就是專門沖走這些廢物的 “沖洗液”。過去只知道大腦有淋巴排汙通道，這項 2026 年《Cell》的新研究，徹底摸清了大腦最主要的排汙路線，還找到了逆轉老年大腦排汙能力衰退的簡單辦法。", "大腦和鼻腔之間靠篩骨隔開，在嗅球附近的蛛網膜上，長著大量微小孔洞（2–12 微米）。腦脊液會從這些小孔流進腦膜淋巴管，順著篩骨上的小孔鑽進鼻腔淋巴，最後廢物被運送到頸部淋巴結代謝掉。對比實驗證明，這條鼻子相關的排汙通道，運走垃圾的效率是大腦背部通道的十幾倍，獼猴身上也有一模一樣的結構，說明這套通路哺乳動物通用。", "人或動物變老後，整條排汙線路都會老化萎縮：蛛網膜上的小孔變少變小、篩骨的孔洞收縮、鼻腔和大腦之間的淋巴管大幅縮水。老年小鼠的淋巴管直接少了近六成，腦脊液排汙量直接減半，垃圾排不出去堆積在腦內，就會加速記憶力衰退、老年痴呆等問題。", "研究發現一種叫 VEGF-C 的蛋白，是淋巴管的 “生長修復劑”。給老年小鼠鼻腔滴入攜帶 VEGF-C 的安全病毒，不用開刀、不用打針進腦子，僅六週就有明顯改善：大腦和鼻腔之間的淋巴管直接恢復一倍多，腦脊液運垃圾的能力回到年輕小鼠水平，頸部淋巴結收集到的腦垃圾，比沒治療的老年鼠翻了一倍。", "有意思的是，這種鼻腔給藥只修復淋巴管，沒法逆轉骨頭、蛛網膜小孔的老化，也側面說明：淋巴管萎縮才是老年大腦排不出廢物的核心阻礙。如果人為破壞鼻腔淋巴，大腦裡的痴呆相關蛋白排出量直接減少近一半，再次證實鼻腔這條通路至關重要。", "和直接往腦內注射藥物相比，鼻腔給藥無創、只靶向腦鼻淋巴，不會影響大腦其他區域。這項研究給衰老、阿爾茨海默病開闢了新思路：未來或許只需要鼻腔噴劑，就能疏通大腦排汙管道，延緩大腦老化。", "本文僅用於學術交流和健康科普。"], "tags": [], "dup": 0, "cat": "大腦", "plain": "大腦每天都會產生垃圾（像造成失智的類澱粉蛋白），靠腦脊髓液像「洗刷水」一樣沖走。研究發現大腦最主要的排水管其實經過鼻子！老了以後這條管線變細變少，垃圾排不出去。科學家在老鼠鼻子裡滴入修復淋巴管的蛋白 VEGF-C，6 週後排垃圾能力回到年輕水準。", "mind": {"c": "鼻子是大腦排水管", "b": [["路線", ["腦脊髓液", "蛛網膜小孔", "篩骨小孔", "鼻腔淋巴→頸部淋巴結"]], ["老化", ["小孔變少", "淋巴管少近六成", "排汙量減半"]], ["治療", ["鼻腔滴 VEGF-C", "6週淋巴管恢復一倍"]], ["意義", ["無創", "未來可能用鼻噴劑"]]]}, "frame": [["產生", "大腦代謝垃圾"], ["排出", "經鼻腔淋巴管"], ["老化", "管線萎縮、垃圾堆積"], ["修復", "VEGF-C 重建淋巴管"], ["結果", "排汙能力恢復"]], "prod": [["助眠枕 / 眼罩", "深睡時大腦清潔系統最活躍，睡好就是清垃圾"], ["Omega-3（紫蘇籽油/藻油）", "抗發炎，支持大腦環境"], ["生理食鹽水洗鼻器", "保持鼻腔清潔通暢（日常保養用）"]], "gb": [["019", "滋碩鼻炎舒寧鼻部護理液", "日常清潔保養鼻腔，維持通暢（非研究中的 VEGF-C 療法）", "250"], ["054", "GABA", "幫助深睡，深睡時大腦清潔系統最活躍", "540"], ["002", "EPA+DHA複方粉包", "Omega-3 抗發炎，支持大腦環境", "1350"]]}, {"i": 30, "title": "植物蛋白更利於調節血脂", "date": "Jul 31", "body": ["心血管疾病是全球首要致死疾病，血脂指標異常，尤其是低密度脂蛋白膽固醇、甘油三酯升高，會大幅提升患病風險。這篇 2026 年刊發的綜述整合大量人體隨機對照試驗與薈萃分析結果，系統闡釋膳食蛋白質對血脂的影響，為普通人以及血脂異常人群提供飲食指導。 最新美國膳食指南將成人蛋白質推薦攝入量上調至 1.2–1.6g/kg 體重，遠高於僅滿足基礎營養需求的 0.8g/kg。在總熱量保持不變時，用蛋白質替換精製碳水、新增糖與飽和脂肪，可有效降低致動脈粥樣硬化脂蛋白。OmniHeart 試驗資料顯示，高蛋白飲食相比高碳水飲食，總膽固醇降幅可達 19.9mg/dL，甘油三酯下降 16.4mg/dL，多項彙總研究也證實，提升蛋白質攝入能同步降低低密度脂蛋白、非高密度脂蛋白膽固醇與載脂蛋白 B 三類核心風險指標。 對比不同蛋白來源，植物蛋白改善血脂的效果整體優於動物蛋白。覆蓋五千餘名受試者的薈萃分析表明，等熱量替換條件下，植物蛋白可使低密度脂蛋白平均下降 6.19mg/dL。其中大豆蛋白優勢顯著，每日攝入 25g 大豆分離蛋白，總膽固醇降低 7.4%，而同劑量乳蛋白僅下降 3.6%。各類動物蛋白效果存在差異：乳清蛋白可降低總膽固醇與甘油三酯，酪蛋白無明顯調脂作用；瘦紅肉和禽肉對血脂影響相近，加工紅肉因飽和脂肪、促血管損傷代謝物含量更高，需控制食用量。 蛋白質調控血脂最核心的機制是營養素替代效應，同時高蛋白食物飽腹感更強、食物熱效應更高，可輔助減重改善血脂，植物食材自帶的膳食纖維、植物甾醇也能協同護血管。目前氨基酸、活性多肽調控肝臟脂代謝的相關結論僅停留在細胞與動物實驗，尚未在人體中充分驗證。 針對血脂偏高人群，臨床指南建議將植物蛋白佔總熱量比例提升 3%–5%，搭配可溶性膳食纖維與植物甾醇，整套飲食干預最高可降低 37% 的低密度脂蛋白。日常無需完全捨棄動物蛋白，優先選擇魚蝦、雞蛋、低脂乳製品，減少加工肉類，用豆類、堅果替換糕點、含糖飲料，長期堅持就能穩步最佳化血脂譜。 本文僅用於學術交流和健康科普。"], "tags": ["科學抗衰", "衰老", "蛋白質相互作用", "蛋白質", "植物蛋白", "草本無限", "調節血脂"], "dup": 0, "cat": "心血管", "plain": "血液裡的壞膽固醇（LDL）和三酸甘油酯太高，容易得心血管病。研究整理發現：用蛋白質取代白飯、甜食和肥肉，可以降血脂；而植物蛋白比動物蛋白更好，每天吃 25 克大豆蛋白，總膽固醇降 7.4%。再加上纖維和植物固醇，壞膽固醇最多可降 37%。", "mind": {"c": "植物蛋白調血脂", "b": [["替代效應", ["蛋白質取代精製碳水", "取代糖與飽和脂肪"]], ["植物vs動物", ["植物蛋白LDL降6.19", "大豆25g膽固醇降7.4%"]], ["動物蛋白", ["乳清有幫助", "加工紅肉要少吃"]], ["組合拳", ["植物蛋白＋纖維＋植物固醇", "LDL最多降37%"]]]}, "frame": [["問題", "LDL、三酸甘油酯高"], ["替換", "植物蛋白取代精製碳水與肥肉"], ["加乘", "纖維＋植物固醇"], ["結果", "血脂改善、護心血管"]], "prod": [["大豆蛋白粉 / 無糖豆漿", "每天 25 克大豆蛋白，幫助降總膽固醇"], ["植物固醇", "和膽固醇搶位置，減少腸道吸收"], ["燕麥 β-葡聚醣", "可溶性纖維，帶走膽固醇"]], "gb": [["084", "黃連素／小蘗鹼", "有研究支持能降低 LDL 與三酸甘油酯", "560"], ["033", "亞麻仁籽渣", "可溶性纖維幫忙帶走膽固醇", "198"], ["048", "大蒜素", "幫助調節血脂、保護血管", "450"]]}, {"i": 31, "title": "紫蘇籽油為什麼變質速度遠高於其他食用油？", "date": "Jul 29", "body": ["紫蘇籽油為什麼變質速度遠高於其他食用油？高含量α-亞麻酸是優勢也是短板 紫蘇籽油被稱為 “陸地深海魚油”，核心營養是α-亞麻酸（Omega-3），含量 60%～72%，不飽和脂肪酸總量超 90%，是人體無法自主合成的必需脂肪酸， 對健康養護意義重大。 但化學結構決定短板：α- 亞麻酸分子帶有3個不飽和雙鍵，油脂氧化速率和雙鍵數量成正比，紫蘇籽油氧化速度是橄欖油（單雙鍵）的 5~10 倍、花生油的 20 倍以上。 而家庭日常儲存方式，和頻繁開瓶暴露空氣，會進一步加速紫蘇籽油變質。 但紫蘇籽油的穩定性優於亞麻籽油(0.37h)和奇亞籽油(0.43h)，得益於紫蘇籽中較高含量的生育酚和酚類抗O2化成分； HID草本無限紫蘇籽油源自華南農業大學“廣東省功能食品活性物重點實驗室”， 在原材料、工藝、檢測等全流程都融入了學院派的嚴謹和專注。 我們精選有機原料（紫蘇籽油），Omega-3（α亞麻酸）含量60%-70%； HID草本無限紫蘇籽油採用天然凝膠包裹鋁罐密封，防止暴露空氣造成氧化變質和營養流失； 無油膩感，絲滑吞嚥，精準定量，更方便持續內調。 SGS給我們出具的專業驗證報告，確信我們是無糖配方，可放心食用。 紫蘇籽油是藥食同源健康脂肪，能平衡飲食脂肪結構，輕盈周身，找到好狀態。"], "tags": ["以油養膚", "亞麻酸", "ALA", "紫蘇籽油", "Omega3", "內調外養", "草本無限紫蘇籽油", "HID草本無限紫蘇籽油", "HID草本無限"], "dup": 0, "cat": "好油", "plain": "紫蘇籽油的 Omega-3（α-亞麻酸）高達 60～72%，是優點也是弱點：它有 3 個「雙鍵」，雙鍵越多越容易氧化，所以比橄欖油快變質 5～10 倍。不過它比亞麻籽油、奇亞籽油穩定，因為本身有維生素 E 等抗氧化物。選擇密封、避光、膠囊包裝，就能減少氧化。", "mind": {"c": "紫蘇籽油為何易變質", "b": [["優勢", ["ALA 60-72%", "不飽和脂肪酸>90%"]], ["原因", ["3個雙鍵", "氧化速度是橄欖油5-10倍"]], ["相對穩定", ["優於亞麻籽油、奇亞籽油", "含生育酚與酚類"]], ["保存", ["密封避光", "膠囊包裝", "少開瓶"]]]}, "frame": [["優點", "高 Omega-3"], ["結構", "3 個雙鍵"], ["弱點", "容易氧化"], ["對策", "膠囊、密封、避光"]], "prod": [["紫蘇籽油軟膠囊（鋁罐密封）", "隔絕空氣與光，減少氧化與營養流失"], ["維生素 E", "天然抗氧化劑，保護不飽和脂肪酸"], ["冷壓小瓶紫蘇籽油", "小容量快速用完，保持新鮮"]], "gb": [["097", "亞麻仁油（500cc×2瓶）", "同為高 ALA 植物油，小容量開瓶後冷藏、盡快用完最新鮮", "780"], ["016", "亞麻仁油10罐", "罐裝分次開，減少整瓶反覆接觸空氣", "3470"], ["094", "D3（2000IU＋A＋E）", "含維生素 E，天然抗氧化劑，保護體內不飽和脂肪酸", "580"]]}, {"i": 32, "title": "Science：斯坦福團隊發現器官衰老開關", "date": "Jul 19", "body": ["2026年7月16日，美國斯坦福大學研究團隊在國際頂尖期刊\" Science \"上發表了一篇題為\" Restored clearance of senescent neutrophils by tissue-resident macrophages limits organ aging \"的研究論文。", "研究顯示，組織駐留巨噬細胞清除衰老中性粒細胞能力衰退，是引發全身多器官衰老的重要因素。恢復組織駐留巨噬細胞清除衰老中性粒細胞的能力，可以顯著逆轉認知衰退、多器官衰老表型。", "重要的是，研究還發現，前列腺素E2受體EP2是控制TRM清除能力的開關，透過基因敲除或藥物阻斷EP2訊號，可恢復TRM清除能力，全面逆轉大腦、心臟、肌肉、代謝衰老表型，讓衰老器官\"重返青春\"，開闢了抗衰老全新治療方向。這項研究顛覆了我們對衰老的理解，將衰老重新定義為主動清除失效，而非被動的退化，靶向TRM中的EP2訊號，透過恢復主動清除功能，有望逆轉多器官衰老表型。", "研究表明，組織駐留巨噬細胞是全身衰老的核心樞紐，EP2是連線免疫、炎症、多器官衰老的分子開關，靶向抑制EP2訊號可逆轉多器官衰老，為衰老相關疾病治療提供了理論基礎和藥物靶點。"], "tags": ["衰老", "科學抗衰", "線粒體與衰老", "如何面對衰老"], "dup": 0, "cat": "衰老機制", "plain": "身體組織裡有「清道夫」細胞（巨噬細胞），負責把老掉的白血球（中性球）清走。老了以後清道夫偷懶，老舊白血球堆積，全身器官就跟著老化。史丹佛發現清道夫身上有個「開關」EP2，把它關掉，清道夫又開始認真工作，老鼠的大腦、心臟、肌肉都變年輕了。", "mind": {"c": "器官衰老開關 EP2", "b": [["主角", ["組織駐留巨噬細胞", "清除衰老中性球"]], ["老化原因", ["清除能力衰退", "老舊細胞堆積"]], ["開關", ["前列腺素E2受體EP2", "阻斷→恢復清除"]], ["效果", ["認知改善", "心臟、肌肉、代謝年輕化"]], ["新觀點", ["衰老＝主動清除失效"]]]}, "frame": [["正常", "清道夫清除老細胞"], ["老化", "EP2 讓清道夫失靈"], ["堆積", "衰老中性球累積"], ["介入", "阻斷 EP2"], ["結果", "多器官重返年輕"]], "prod": [["Omega-3（紫蘇籽油/魚油）", "幫助身體產生消炎物質，調節前列腺素平衡"], ["薑黃素", "抑制發炎訊號，支持免疫平衡"], ["亞精胺", "促進自噬，幫細胞清理老舊零件"]], "gb": [["002", "EPA+DHA複方粉包", "Omega-3 能轉成消炎介質，平衡前列腺素發炎訊號", "1350"], ["041", "薑黃素＋胡椒鹼", "抑制發炎訊號，支持免疫清除功能", "620"], ["089", "巴西蘑菇", "菇類多醣調節巨噬細胞等免疫細胞活性", "250"]]}, {"i": 33, "title": "有氧運動可高效抗衰防癌", "date": "Jul 15", "body": ["久坐帶來的慢性低度炎症，會加速免疫老化、大幅升高癌症發病與死亡風險，而上海科研團隊發表於《Cell Reports Medicine》的大型研究證實：規律有氧運動是低成本、高效的防癌手段。", "研究整合英美兩大人群佇列共 443768 名成年人資料，長期隨訪發現：隨年齡增長，體內炎症評分（INFLA）持續升高，炎症水平越高，肺癌、結直腸癌、乳腺癌等 8 類炎症相關癌症發病風險越高，所有癌症死亡風險也同步上升。相比完全不運動人群，達到充足運動量的受試者，炎症相關癌症發病風險下降 21%（HR=0.79），癌症總死亡風險降低 34%（HR=0.66），防癌效果優於不少靶向、免疫藥物。", "運動防癌存在明確劑量標準：", "每週 117–500 分鐘有氧運動，能顯著降低全身炎症、減少炎症相關腫瘤；", "每週 117–586 分鐘有氧活動，可同時降低各類癌症死亡風險；", "有氧結合力量的混合運動，每週 242 分鐘以上也能起到防護作用。", "60 歲以上炎症偏高人群，運動獲益會更明顯。", "團隊藉助小鼠、倉鼠動物實驗，揭開背後完整機制。長期有氧訓練能從根源延緩免疫衰老：下調骨髓、胸腺中衰老相關基因，減少 Mki67 陽性衰老免疫細胞（Mki67 可作為免疫衰老標誌物）；重塑免疫細胞結構，提升 B 細胞、T 細胞、NK 殺傷細胞、樹突狀細胞儲備，增強機體抗腫瘤免疫監視能力。", "同時運動重塑體內炎症平衡：血清促炎因子 IL-6、TNF-α、CRP 水平下降，抗炎因子 IL-4、IL-10 顯著升高，削弱持續慢性炎症對細胞的損傷；還會抑制腫瘤相關促癌基因表達，上調抑癌通路，改善造血、抗原呈遞等核心免疫通路。", "需要注意，單次運動後免疫細胞提升是短期波動，48 小時後會回落，只有長期堅持訓練，才能形成穩定抗炎、抗衰老的免疫穩態。", "研究最後提示，當下久坐已成普遍生活方式，堅持足量有氧運動可預防超兩成炎症相關癌症、26%–34% 癌症死亡，無需昂貴醫療手段，就能有效減輕全社會癌症負擔", "本文僅用於學術交流和健康科普。"], "tags": ["科學抗衰", "衰老", "運動與健康", "有氧運動", "抗炎"], "dup": 0, "cat": "運動", "plain": "久坐會讓身體一直有小火在燒（慢性發炎），讓免疫系統變老，容易得癌症。研究追蹤 44 萬人發現：運動量足夠的人，發炎相關癌症少 21%、癌症死亡少 34%！每週 117～500 分鐘有氧運動（大約每天 20～70 分鐘）就有效。但單次運動的好處 48 小時就消失，要持續才行。", "mind": {"c": "有氧運動抗老防癌", "b": [["研究", ["44萬人", "英美兩大世代"]], ["效果", ["發炎相關癌症-21%", "癌症死亡-34%"]], ["劑量", ["每週117-500分鐘有氧", "有氧＋重訓242分鐘以上"]], ["機制", ["免疫細胞年輕化", "IL-6/TNF-α/CRP下降", "IL-10上升"]], ["提醒", ["單次效果48小時消退", "要長期堅持"]]]}, "frame": [["久坐", "慢性發炎"], ["影響", "免疫老化"], ["運動", "每週 117～500 分鐘有氧"], ["機制", "抗炎、免疫重建"], ["結果", "癌症風險與死亡下降"]], "prod": [["運動手環", "記錄每週有氧分鐘數，確保達標"], ["健走鞋", "最簡單的有氧入門，保護腳踝膝蓋"], ["薑黃素", "輔助抗發炎，搭配運動降低慢性發炎"]], "gb": [["041", "薑黃素＋胡椒鹼", "輔助降低 IL-6、TNF-α 等慢性發炎指標", "620"], ["066", "裸藻", "β-1,3 葡聚醣支持 NK 細胞與免疫監視", "480"], ["089", "巴西蘑菇", "菇類多醣支持免疫細胞儲備", "250"]]}, {"i": 34, "title": "有氧運動可高效抗衰防癌", "date": "Jul 15", "body": ["久坐帶來的慢性低度炎症，會加速免疫老化、大幅升高癌症發病與死亡風險，而上海科研團隊發表於《Cell Reports Medicine》的大型研究證實：規律有氧運動是低成本、高效的防癌手段。", "研究整合英美兩大人群佇列共 443768 名成年人資料，長期隨訪發現：隨年齡增長，體內炎症評分（INFLA）持續升高，炎症水平越高，肺癌、結直腸癌、乳腺癌等 8 類炎症相關癌症發病風險越高，所有癌症死亡風險也同步上升。相比完全不運動人群，達到充足運動量的受試者，炎症相關癌症發病風險下降 21%（HR=0.79），癌症總死亡風險降低 34%（HR=0.66），防癌效果優於不少靶向、免疫藥物。", "運動防癌存在明確劑量標準：", "每週 117–500 分鐘有氧運動，能顯著降低全身炎症、減少炎症相關腫瘤；", "每週 117–586 分鐘有氧活動，可同時降低各類癌症死亡風險；", "有氧結合力量的混合運動，每週 242 分鐘以上也能起到防護作用。", "60 歲以上炎症偏高人群，運動獲益會更明顯。", "團隊藉助小鼠、倉鼠動物實驗，揭開背後完整機制。長期有氧訓練能從根源延緩免疫衰老：下調骨髓、胸腺中衰老相關基因，減少 Mki67 陽性衰老免疫細胞（Mki67 可作為免疫衰老標誌物）；重塑免疫細胞結構，提升 B 細胞、T 細胞、NK 殺傷細胞、樹突狀細胞儲備，增強機體抗腫瘤免疫監視能力。", "同時運動重塑體內炎症平衡：血清促炎因子 IL-6、TNF-α、CRP 水平下降，抗炎因子 IL-4、IL-10 顯著升高，削弱持續慢性炎症對細胞的損傷；還會抑制腫瘤相關促癌基因表達，上調抑癌通路，改善造血、抗原呈遞等核心免疫通路。", "需要注意，單次運動後免疫細胞提升是短期波動，48 小時後會回落，只有長期堅持訓練，才能形成穩定抗炎、抗衰老的免疫穩態。", "研究最後提示，當下久坐已成普遍生活方式，堅持足量有氧運動可預防超兩成炎症相關癌症、26%–34% 癌症死亡，無需昂貴醫療手段，就能有效減輕全社會癌症負擔", "本文僅用於學術交流和健康科普。"], "tags": ["科學抗衰", "衰老", "運動與健康", "有氧運動", "抗炎"], "dup": 33, "cat": "運動", "plain": "久坐會讓身體一直有小火在燒（慢性發炎），讓免疫系統變老，容易得癌症。研究追蹤 44 萬人發現：運動量足夠的人，發炎相關癌症少 21%、癌症死亡少 34%！每週 117～500 分鐘有氧運動（大約每天 20～70 分鐘）就有效。但單次運動的好處 48 小時就消失，要持續才行。", "mind": {"c": "有氧運動抗老防癌", "b": [["研究", ["44萬人", "英美兩大世代"]], ["效果", ["發炎相關癌症-21%", "癌症死亡-34%"]], ["劑量", ["每週117-500分鐘有氧", "有氧＋重訓242分鐘以上"]], ["機制", ["免疫細胞年輕化", "IL-6/TNF-α/CRP下降", "IL-10上升"]], ["提醒", ["單次效果48小時消退", "要長期堅持"]]]}, "frame": [["久坐", "慢性發炎"], ["影響", "免疫老化"], ["運動", "每週 117～500 分鐘有氧"], ["機制", "抗炎、免疫重建"], ["結果", "癌症風險與死亡下降"]], "prod": [["運動手環", "記錄每週有氧分鐘數，確保達標"], ["健走鞋", "最簡單的有氧入門，保護腳踝膝蓋"], ["薑黃素", "輔助抗發炎，搭配運動降低慢性發炎"]], "gb": [["041", "薑黃素＋胡椒鹼", "輔助降低 IL-6、TNF-α 等慢性發炎指標", "620"], ["066", "裸藻", "β-1,3 葡聚醣支持 NK 細胞與免疫監視", "480"], ["089", "巴西蘑菇", "菇類多醣支持免疫細胞儲備", "250"]]}, {"i": 35, "title": "頂刊最新：吃魚油補腦反而加快老人記憶衰退", "date": "Jun 30", "body": ["很多中老年朋友都會常年吃魚油，覺得裡面的 Omega-3 能保養大腦、預防老年痴呆。但2026 年一份權威長期研究，給出了完全相反的結論：老年人長期吃魚油補劑，會加速記憶力、思維能力衰退。", "研究一共跟蹤了 1800 多名 55 至 90 歲老人，有身體健康的，也有記性變差、早期阿爾茨海默病患者。為了對比公平，把年齡、性別、痴呆易感基因、大腦基礎狀況差不多的老人分成兩組，最終 819 人納入觀察，273 人長期吃魚油，546 人不吃，平均足足追蹤了 5 年。", "醫生用三套醫院通用的記憶力測試打分，分數越高代表腦子越清楚。結果差距很明顯：吃魚油的老人，認知下滑速度明顯更快。每年記憶評分多降 0.266 分，另外兩項痴呆評估分數每年分別上漲 0.823 分、0.205 分，這種差距不是偶然誤差。", "大家都以為老年痴呆是大腦裡兩種有害蛋白堆積、腦組織萎縮導致的，但腦部掃描發現，魚油並不會加重這兩類問題。真正傷害大腦的關鍵是：大腦供能變差。大腦靠葡萄糖運轉記憶，長期吃魚油會讓腦部能量代謝下降，連線記憶的神經突觸受損。這種代謝異常，能解釋三成到四成的記憶力衰退。", "研究也打消了一個誤區：不是記性變差了大家才去吃魚油。在開始補充魚油之前，兩組老人的記憶力、大腦狀態基本一樣，認知變差是長期服用魚油後慢慢出現的。", "原理很好理解：魚油的不飽和脂肪酸特別容易氧化，進入大腦後會破壞細胞的 “能量工廠” 粒線體，產生有害物質，一點點損傷負責記憶傳遞的神經突觸。", "以前不少研究說魚油護腦，主要是跟蹤時間太短，大多不到一年，看不到長期隱患；這次研究裡大家吃的都是市面上普通魚油，更容易氧化變質。同時研究說明，影響因人而異：平時很少吃魚、少量短期吃魚油基本沒太大問題，但長年不間斷、大劑量服用，傷腦風險會升高。", "給普通人實用建議：想養護大腦，優先每週吃深海魚食補；不要盲目常年不間斷吃高劑量魚油；如果確實需要補充，儘量選抗氧化工藝的魚油，不要長期連續服用。", "最新研究發現植物性omega3是更好選擇，如草本無限紫蘇籽油，具備更優K衰潛力", "本文僅用於學術交流和健康科普。"], "tags": ["科學抗衰", "記憶衰退", "魚油", "omega3", "認知衰退", "紫蘇籽油"], "dup": 0, "cat": "補充劑", "plain": "很多人以為吃魚油能護腦，但一份追蹤 5 年的研究發現：長期吃魚油補充劑的老人，記憶退化反而更快！原因可能是魚油很容易氧化，進到大腦傷害粒線體，讓大腦能量變差。建議：優先每週吃深海魚，不要長年大量吃魚油；真的要補，選抗氧化工藝的，不要一直連續吃。", "mind": {"c": "魚油可能加速記憶衰退", "b": [["研究", ["819位55-90歲", "追蹤5年"]], ["結果", ["吃魚油者認知下滑更快", "不是因為類澱粉蛋白"]], ["機制", ["魚油易氧化", "傷粒線體", "大腦能量代謝下降"]], ["建議", ["優先吃魚", "不長期大劑量", "選抗氧化工藝", "可考慮植物Omega-3"]]]}, "frame": [["行為", "長期大劑量魚油"], ["問題", "不飽和脂肪易氧化"], ["傷害", "粒線體受損、腦能量下降"], ["結果", "記憶退化加快"], ["建議", "食補為主、適量補充"]], "prod": [["紫蘇籽油（植物 Omega-3）", "ALA 來源，文中提到可作為替代選擇"], ["含抗氧化配方的魚油", "添加維生素 E 等，降低氧化風險"], ["冷凍鮭魚 / 鯖魚", "每週 2～3 次天然食補最安心"]], "gb": [["097", "亞麻仁油（500cc×2瓶）", "植物 Omega-3，文中建議可考慮植物性來源", "780"], ["072", "蝦紅素200mcg＋硒200mcg", "強效抗氧化，降低不飽和脂肪酸氧化對粒線體的傷害", "530"], ["002", "EPA+DHA複方粉包", "若要補魚油：選新鮮產品、適量、不長期大劑量，並以吃魚為主", "1350"]]}, {"i": 36, "title": "自然：動物油傷免疫，植物油護免疫", "date": "Jun 27", "body": ["很多人一直以為，只要身體發胖，免疫力就會變差，更容易長腫瘤。但這篇頂尖代謝期刊的小鼠實驗，重新整理了這個固有認知：會不會削弱身體抗癌能力，不在於你胖不胖，核心看你平時吃的是哪一類脂肪。", "實驗設計很簡單：給幾批小鼠喂熱量、脂肪總量完全相同的高脂食物，最後所有小鼠都變得肥胖，唯一區別就是油脂來源。一組餵豬油、黃油這類動物脂肪，另一組用橄欖油、椰子油等植物脂肪，再給全部小鼠植入同種腫瘤，觀察腫瘤生長快慢。", "兩組胖老鼠出現了天差地別的結果：", "長期吃動物油的小鼠，體內腫瘤瘋長；", "吃植物油長胖的小鼠，腫瘤生長速度和身材偏瘦的普通小鼠差不多，幾乎沒有加速惡化的情況。", "我們身體裡有專門 “追殺癌細胞” 的免疫細胞，也就是殺傷型 T 細胞、NK 細胞。吃大量動物飽和脂肪後，身體會產生特殊脂質廢物，堵住免疫細胞進入腫瘤的通道，就算免疫細胞抵達病灶，殺傷能力也會大幅下降，等於給癌細胞掃清生存障礙。而植物油脂不會產生這類抑制物質，免疫細胞能正常鑽進腫瘤組織，持續抑制癌細胞增殖。建議食用或補充富含omega3的紫蘇籽油、亞麻籽油等。", "這個結論對普通人特別有參考價值：不用一聽說長胖就焦慮，也不用極端戒掉所有油。真正該警惕的是長期大量吃肥肉、動物黃油、牛油火鍋這類高動物脂肪食物。哪怕體重沒有超標，長期這樣吃，體內抗癌防線也會悄悄變弱。", "這項研究最關鍵的結論打破固有誤區：肥胖不等於腫瘤易感，脂肪種類才是關鍵風險點。很多人減脂期盲目避開所有油脂，或是長期大量吃肥肉、動物黃油，反而忽視了油脂來源的差異。", "放到日常飲食裡，長期頻繁攝入動物來源飽和脂肪，即便體重、體脂數值穩定，也可能悄悄壓低自身抗癌免疫力；日常烹飪優先選用植物油，控制肥肉、動物油脂點心的攝入，草本無限紫蘇籽油，是簡單可行的免疫保護方式。研究團隊也提到，後續會開展人體臨床驗證，目前至少給肥胖、腫瘤高危人群提供了清晰的飲食調整方向：比起單純減重，選對吃進去的脂肪同樣重要。", "本文僅用於學術交流和健康科普。"], "tags": ["科學抗衰", "植物油", "紫蘇籽油", "自身免疫性", "omega3", "純植物成分", "植物性飲食", "不飽和脂肪酸", "免疫力"], "dup": 0, "cat": "好油", "plain": "科學家讓兩群老鼠都吃到一樣胖，差別只在油：一群吃豬油、奶油（動物油），一群吃橄欖油等植物油。結果吃動物油的老鼠腫瘤長很快；吃植物油的老鼠，腫瘤長得跟瘦老鼠差不多！因為動物飽和脂肪會產生廢物，擋住免疫細胞進入腫瘤。重點不是胖不胖，而是吃哪種油。", "mind": {"c": "動物油傷免疫", "b": [["實驗", ["老鼠一樣胖", "只差油的種類"]], ["結果", ["動物油：腫瘤瘋長", "植物油：和瘦鼠相近"]], ["機制", ["飽和脂肪產生脂質廢物", "擋住T細胞、NK細胞", "殺傷力下降"]], ["建議", ["少肥肉、奶油、牛油鍋", "烹調用植物油"]]]}, "frame": [["吃進", "大量動物飽和脂肪"], ["產生", "脂質廢物"], ["阻擋", "免疫細胞進不了腫瘤"], ["結果", "癌細胞增生"], ["對策", "改用植物油"]], "prod": [["紫蘇籽油 / 亞麻籽油", "富含 Omega-3，支持免疫細胞正常運作"], ["特級初榨橄欖油", "取代豬油奶油的日常烹調好油"], ["綜合堅果", "提供不飽和脂肪酸，取代油膩點心"]], "gb": [["097", "亞麻仁油（500cc×2瓶）", "用植物 Omega-3 取代豬油奶油，讓免疫細胞正常運作", "780"], ["016", "亞麻仁油10罐", "日常涼拌換好油的長期選擇", "3470"], ["089", "巴西蘑菇", "支持 NK 細胞與 T 細胞的抗癌免疫力", "250"]]}, {"i": 37, "title": "中老年人每日7~9 小時睡眠大腦最健康", "date": "6月15日", "body": ["發表於權威期刊《阿爾茨海默病與痴呆》的一項大型研究，對23377 名無重大疾病的中老年人開展了平均 8.8 年的長期隨訪，探究各類睡眠行為與腦白質高訊號的關聯。腦白質高訊號是腦小血管損傷的典型表現，也是加速腦老化、提升痴呆發病風險的重要標誌。", "研究共觀察了睡眠時長、日間午睡、夜間睡眠不佳、打鼾、日間嗜睡五類睡眠表現。第一輪分析發現，所有不良睡眠狀態，均會伴隨腦白質損傷加重。在校正高血壓、糖尿病、吸菸、肥胖、高危遺傳基因等心腦血管及生活幹擾因素後，仍有三類睡眠問題會獨立加重腦部血管損傷。", "第一，睡眠時長偏離標準範圍。成年人推薦每日睡眠 7~9 小時，睡眠過短或過長都會增加腦損傷風險，其中每日睡眠不足 6 小時的負面影響最為顯著。", "第二，頻繁日間午睡。在所有睡眠因素裡，頻繁午睡對腦白質損傷的影響最強。研究補充說明，短時適度小憩通常不會帶來危害，但高頻次、長時間午睡，會持續損害腦血管健康。", "第三，夜間睡眠質量差。即便未達到臨床失眠的診斷標準，僅存在入睡困難、夜間易醒等輕微睡眠問題，長期下來也會逐步加重腦白質病變。", "而打鼾、日間頻繁嗜睡兩種表現，對大腦的影響主要依託於心腦血管基礎疾病，並非獨立風險因素。經過分組驗證，剔除輪班人群、單獨分析 60 歲以上群體後，上述結論依然穩定可靠。", "該研究證實，睡眠是影響中老年腦血管健康與腦老化的獨立危險因素。日常保持每日 7~9 小時的規律夜間睡眠、改善夜間睡眠質量、合理控制日間午睡的頻次與時長，能夠有效延緩腦部損傷，降低痴呆發生風險。", "本文僅用於學術交流和健康科普。"], "tags": ["科學抗衰", "衰老", "老年人睡眠", "健康睡眠", "睡眠與健康", "提升睡眠質量", "大腦", "腦血管", "中老年人群"], "dup": 0, "cat": "睡眠", "plain": "研究追蹤 2 萬多位中老年人將近 9 年，發現睡不好會讓大腦的「小血管」受傷（腦白質高訊號），增加失智風險。三件事最傷腦：睡太少（少於 6 小時最糟）或太多、常常午睡太久、晚上睡不好（難入睡、容易醒）。每天晚上睡 7～9 小時最健康。", "mind": {"c": "睡7-9小時最護腦", "b": [["研究", ["23377人", "追蹤8.8年"]], ["獨立傷腦因素", ["睡太少或太多", "頻繁午睡", "夜間睡眠差"]], ["非獨立", ["打鼾", "白天嗜睡"]], ["建議", ["每晚7-9小時", "改善睡眠品質", "控制午睡"]]]}, "frame": [["睡眠問題", "太短、頻繁午睡、睡不好"], ["傷害", "腦小血管受損"], ["表現", "腦白質高訊號"], ["結果", "腦老化、失智風險"], ["行動", "規律睡 7～9 小時"]], "prod": [["GABA＋茶氨酸", "幫助放鬆，縮短入睡時間"], ["甘胺酸鎂", "放鬆神經肌肉，提升睡眠品質"], ["遮光眼罩、耳塞", "減少光線噪音干擾，讓夜間睡得更深"]], "gb": [["054", "GABA", "幫神經踩剎車，縮短入睡時間", "540"], ["091", "甘氨酸鎂複方粉包", "鎂＋甘胺酸放鬆神經肌肉，提升深睡品質", "1350"], ["050", "銀杏複方（含色氨酸）", "色胺酸是血清素與褪黑激素的原料", "510"], ["001", "防藍光護目鏡", "睡前減少藍光，幫助自然想睡", "200"]]}, {"i": 38, "title": "一萬步無必要，8500步才是科學減重標準", "date": "Jun 4", "body": ["發表於 2026 年《International Journal of Environmental Research and Public Health》的一項系統性綜述與薈萃分析，為減肥人群明確了科學步行標準。當前肥胖已成為全球性公共衛生問題，預計到 2035 年，全球肥胖率將超過 30%。走路是最普及的減重方式，但長期以來，“每天一萬步” 被奉為標準，卻缺乏權威資料支撐，既容易讓人過度疲勞，也難以長期堅持，這項研究正是為了解決這一困惑。", "研究彙總了 18 項高質量隨機對照試驗，共納入 3758 名超重或肥胖成年人，將受試者分為兩組：一組接受生活方式干預，結合飲食調整、規律步行和行為指導；另一組僅接受常規健康建議，不做強制運動安排。", "研究全程分為三個關鍵階段：初始基線期、平均 7.88 個月的減重期、平均 10.27 個月的體重維持期，持續追蹤每日步數與體重變化的關聯。研究結論如下：", "1、一開始兩組人每天步數差不多，都在 7200 步左右，體重也沒差別。", "、減肥階段（約 8 個月）：", "生活方式組把步數提到8500 步左右，體重平均減了4.39%；", "普通組只走 7500 步，體重僅減1.25%。", "3、維持階段（再堅持 10 個月）：", "生活方式組穩定保持8200 步左右，體重維持良好，仍減3.28%；", "普通組步數掉到 6700 步，體重基本反彈。", "進一步分析發現，步行的核心價值在於長期控重：", "短期減重主要依靠飲食控制，步行的輔助作用有限；", "長期來看，每多走 1000 步，就能多維持 1% 以上的減重效果。", "由此可見，盲目追求一萬步並無必要，減重期每日 8500 步、維持期每日 8200 步，才是兼顧效果與可行性的黃金標準，輕鬆易堅持，還能有效防止體重反彈，是肥胖人群長期控重的簡單有效方式。", "本文僅用於學術交流和健康科普。#科學抗衰"], "tags": ["運動與健康"], "dup": 0, "cat": "運動", "plain": "「每天一萬步」其實沒有科學根據！研究整理 18 個實驗發現：減重時每天走到約 8500 步，體重平均減 4.4%；維持期每天約 8200 步，體重就不容易復胖。短期減重主要靠飲食，但長期每多走 1000 步，就能多維持 1% 以上的減重效果。", "mind": {"c": "8500步就夠", "b": [["研究", ["18個RCT", "3758位過重者"]], ["減重期", ["8500步→減4.39%", "7500步→減1.25%"]], ["維持期", ["8200步維持良好", "6700步復胖"]], ["重點", ["短期靠飲食", "長期靠走路", "多1000步多維持1%"]]]}, "frame": [["起點", "每天約 7200 步"], ["減重期", "提高到 8500 步＋飲食"], ["維持期", "保持 8200 步"], ["結果", "不易復胖"]], "prod": [["計步手環", "每天看得到步數，輕鬆達標 8500 步"], ["緩震健走鞋", "減少膝蓋負擔，走得久又舒服"], ["高纖代餐", "短期減重靠飲食，幫助控制熱量"]], "gb": [["033", "亞麻仁籽渣", "減重期飲食控制的好幫手，高纖增飽足", "198"], ["043", "鹼能活（含肉鹼）", "肉鹼幫脂肪送進粒線體燃燒，配合走路", "520"], ["038", "EGCG複方", "茶多酚輔助脂肪代謝", "560"]]}, {"i": 39, "title": "刷A脫皮刺痛？這款修護霜搞定維A不耐受", "date": "Jun 4", "body": ["誰懂抗老的痛？維A 醇效果猛、能打細紋暗沉，但泛紅、脫皮、刺痛的刺激感，勸退無數敏感肌和護膚新手。其實 A 醇不耐受，根源多是皮膚屏障脆弱，疊加方式不當更易翻車。 2025和2026年兩屆美國皮膚學年會（AAD）權威研究給出解法：三明治護膚法——全三明治（保溼 + A 醇 +）會削弱活性， 開放三明治（A 醇→保溼 / 保溼→A 醇）既能修護屏障，又能完整保留 A 醇抗老效果，保溼修護成 A 醇護膚關鍵一步。 好的保溼修護，核心是復刻皮膚原生結構！角質層的天然保溼因子（NMF）負責鎖水，神經醯胺、膽固醇等表皮脂質構築 “磚牆屏障”，雙重守護抵禦外界刺激。2023-2024 年 AAD 研究證實：含NMF + 表皮脂質的仿生面霜，能直接補充皮膚缺失的保溼與修護成分，提升絲聚蛋白、水通道蛋白表達，強韌屏障、長效鎖水，是搭配 A醇的黃金搭檔。 露得清水活特護霜，正是為 A醇黨量身打造的科學修護王者！精準配比1% NMF 複合 9 重氨基酸 + 3 重電解質，搭配神經醯胺、膽固醇等表皮脂質，1:1 復刻皮膚原生保溼屏障。 經臨床驗證，單次保溼力拉滿 72小時，4 周改善乾燥、泛紅、粗糙，敏感肌、痘肌都能安心用。更關鍵的是，AAD 認證開放三明治搭配絕配：先 A 醇後保溼，或先保溼後A醇，既能舒緩A 醇刺激、修護受損屏障，又完全不削弱 A 醇生物活性。日常維穩、A 醇打底、突發泛紅急救都能打，溫和無香精酒精，一抹化水好吸收。 抗老不用妥協，修護與效果可以兼得！露得清水活特護霜，以科研級仿生配方，給幹敏肌、A 醇黨全方位守護，養出強韌水光肌～"], "tags": ["露得清水活特護霜", "A醇", "科學抗衰"], "dup": 0, "cat": "皮膚", "plain": "A 醇（維生素 A）抗老很有效，但很多人擦了會脫皮、泛紅、刺痛，原因多半是皮膚屏障太弱。皮膚學會研究建議「開放式三明治」：先擦 A 醇再擦保濕，或先保濕再擦 A 醇，可以修護屏障又不影響效果。好的保濕霜要像皮膚原本的結構：保濕因子＋神經醯胺＋膽固醇。", "mind": {"c": "A醇不耐受怎麼辦", "b": [["問題", ["脫皮、泛紅、刺痛", "皮膚屏障脆弱"]], ["擦法", ["全三明治會削弱活性", "開放三明治最好"]], ["好保濕", ["NMF天然保濕因子", "神經醯胺", "膽固醇"]], ["效果", ["修護屏障", "保留A醇效果"]]]}, "frame": [["想抗老", "使用 A 醇"], ["問題", "屏障弱→刺激"], ["方法", "開放式三明治擦法"], ["修護", "仿生保濕霜補屏障"], ["結果", "抗老又不刺激"]], "prod": [["神經醯胺修護霜", "補充皮膚「磚牆」間的脂質，強化屏障"], ["溫和 A 醇精華（低濃度）", "從低濃度開始，讓皮膚慢慢適應"], ["無香精保濕乳", "減少刺激，鎖住水分"]], "gb": [["088", "透明質酸鈉", "由內補水，支持皮膚保濕與屏障", "530"], ["007", "積雪草泡泡面膜", "積雪草舒緩修護，適合 A 醇後泛紅的肌膚", "69"], ["059", "AV除皺美白化妝水", "夜間抗皺保養，搭配開放式三明治擦法降低刺激", "70"]]}, {"i": 40, "title": "抗炎飲食有助於降低中老年骨質疏鬆風險", "date": "May 30", "body": ["骨質疏鬆是中老年人骨折、致殘的主要原因，本質是骨密度下降、骨質量變差。近年研究證實，慢性低度炎症會加速骨吸收、抑制骨形成，是骨質疏鬆的核心推手，而飲食直接決定體內炎症水平。 一項發表在《Frontiers in Nutrition》的美國大樣本研究明確：促炎飲食越多，骨質疏鬆風險越高。 研究分析了 2003—2010 年美國健康調查資料，納入7290 名 20 歲以上成年人，其中骨質疏鬆 243 例、健康人群 7047 例。用飲食炎症指數 DII衡量促炎程度：DII 越高，飲食越促炎。結果顯示，骨質疏鬆人群 DII 均值1.61，顯著高於健康人群1.18；校正混雜因素後，DII 最高人群骨質疏鬆風險升高 88%（OR=1.88，95% CI：1.41—2.52），風險隨促炎程度線性上升。 1、關鍵傷骨食物（促炎、加速骨流失） 精製碳水：白米、白麵、甜點、含糖飲料，升高炎症、降低鈣吸收 高脂加工食品：油炸物、肥肉、加工肉、黃油，誘發慢性炎症 高膽固醇食物：動物內臟、肥肉，加重炎症、破壞骨代謝 2、關鍵護骨食物（抗炎、減少骨流失） ω-3 多不飽和脂肪酸：深海魚（鮭魚、鱈魚）、紫蘇籽油（植物性 α-亞麻酸），植物來源的草本無限紫蘇籽油，抑制炎症因子、減少骨吸收 膳食纖維：深綠蔬菜、全穀物、豆類、堅果，抗炎、改善鈣吸收 優質蛋白 + 微量元素：雞蛋、低脂奶、瘦肉，補充鈣、鐵、鋅，維持骨健康 3、飲食注意事項 減少精製糖、油炸、加工食品，控制炎症 日常涼拌 / 低溫烹飪用紫蘇籽油 每週 2—3 次深海魚 主食粗細搭配，每天足量蔬菜、適量豆製品 少喝濃茶、咖啡，避免影響鈣吸收 長期堅持抗炎飲食，可降低體內炎症、保護骨骼、減少骨質疏鬆風險。"], "tags": ["科學抗衰", "老年人飲食", "骨質疏鬆", "抗炎飲食", "紫蘇籽油", "HID紫蘇籽油", "omega3", "炎症"], "dup": 0, "cat": "骨骼", "plain": "骨質疏鬆是老人骨折的主要原因，而身體裡的慢性發炎會讓骨頭被「拆」得比「蓋」得快。研究 7290 人發現：吃越多會發炎的食物，骨質疏鬆風險最高增加 88%！傷骨食物：白米白麵甜點、油炸加工肉、內臟肥肉；護骨食物：深海魚、紫蘇籽油、蔬菜全穀豆類、雞蛋低脂奶。", "mind": {"c": "抗炎飲食護骨頭", "b": [["研究", ["7290人", "DII越高風險越高", "最高+88%"]], ["傷骨食物", ["精製碳水甜食", "油炸加工肉", "內臟、肥肉"]], ["護骨食物", ["深海魚、紫蘇籽油", "蔬菜、全穀、豆類", "蛋、低脂奶"]], ["注意", ["少濃茶咖啡", "每週2-3次魚"]]]}, "frame": [["飲食", "促發炎食物多"], ["發炎", "慢性低度發炎"], ["骨頭", "拆骨＞蓋骨"], ["結果", "骨質疏鬆"], ["對策", "抗炎飲食"]], "prod": [["紫蘇籽油", "植物 Omega-3，抑制發炎因子、減少骨吸收"], ["鈣＋D3＋K2", "補足骨頭原料並幫助鈣沉積到骨骼"], ["高纖燕麥 / 全穀粉", "膳食纖維抗發炎、改善鈣吸收"]], "gb": [["097", "亞麻仁油（500cc×2瓶）", "植物 Omega-3 抑制發炎因子、減少骨吸收", "780"], ["094", "D3（2000IU＋A＋E）", "幫助鈣吸收，維持骨密度", "580"], ["041", "薑黃素＋胡椒鹼", "降低慢性發炎，減緩拆骨速度", "620"]]}, {"i": 41, "title": "草本無限紫蘇籽油，堅持吃真的瘦了哦", "date": "5月28日", "body": ["因為有脂肪/肝，聽說紫蘇籽油裡的omega3，主要是阿爾法亞麻酸ALA能夠幫助分解脂肪，還能促進肝臟燃燒多餘肥油的能力，所以一直想嘗試。", "但是市面上都是一瓶瓶的，我比較抗拒直接喝油，直到看見這款華南農業大學實驗室研發的HID草本無限紫蘇籽油，採用膠囊形式，嚐了一下很好吞嚥，嚼碎了裡面的油脂也是淡淡的香味，比起魚油那種噁心的魚腥味好多了，我可以堅持吃下去。", "仔細看了一下，草本無限這個產品是有機原料、無糖型的，SGS做了專業檢測；", "紫蘇籽油這種植物性產品，現在越來越多研究認為對中老年❤️🩸管和大腦、抗衰有益處；", "所以草本無限這款紫蘇籽油產品整體還是不錯的，可以作為長期營養調理堅持吃，我這段時間明顯感覺腰圍小了，腸道💩也潤滑了，身體也輕盈了。"], "tags": ["科學抗衰", "HID草本無限紫蘇籽油", "HID紫蘇籽油", "草本無限紫蘇籽油", "紫蘇籽油", "脂肪肝", "吃不胖的油"], "dup": 0, "cat": "好油", "plain": "這是一篇使用心得：作者有脂肪肝，聽說紫蘇籽油的 Omega-3（ALA）可以幫助身體代謝脂肪，就選了好吞的膠囊型，吃一段時間後覺得腰圍變小、排便更順。提醒：這是個人經驗，紫蘇籽油是好油，但要搭配飲食控制和運動，才是減脂和改善脂肪肝的關鍵。", "mind": {"c": "紫蘇籽油使用心得", "b": [["動機", ["脂肪肝", "想補Omega-3"]], ["選擇理由", ["膠囊好吞", "無魚腥味", "有機、無糖、有檢驗"]], ["個人感受", ["腰圍變小", "排便順暢"]], ["提醒", ["個人經驗", "需搭配飲食運動"]]]}, "frame": [["問題", "脂肪肝"], ["選擇", "紫蘇籽油膠囊"], ["搭配", "飲食＋運動"], ["感受", "腰圍、排便改善"]], "prod": [["紫蘇籽油軟膠囊", "ALA 支持脂肪代謝，膠囊無腥味好持續"], ["番茄汁", "研究顯示有助減少肝臟脂肪"], ["膳食纖維", "幫助排便、增加飽足感"]], "gb": [["097", "亞麻仁油（500cc×2瓶）", "同為高 ALA 植物油，支持脂肪代謝", "780"], ["033", "亞麻仁籽渣", "高纖讓排便順暢、增加飽足", "198"], ["077", "肝寶", "脂肪肝族群的肝臟保養（成分以產品標示為準）", "550"]]}, {"i": 42, "title": "米飯比小麥更利於老年人心血管健康", "date": "05-27", "body": ["很多人都愛吃麵食，饅頭、麵條、餃子，頓頓離不了。但最近一項針對中國老年人的大型研究，給出了一個很扎心的結論：長期把小麥當主食，比吃米飯更容易得心血管病。", "近期發表於國際期刊《Frontiers in Nutrition》的一項中國老年人群大型研究，系統分析了大米、小麥、粗糧與心血管疾病風險的關係，為老年人主食選擇提供了明確、可落地的科學依據。", "研究納入16498 名 65 歲及以上、基線無心血管病的中國老年人，平均年齡 87.57 歲，中位隨訪7.38 年，期間共發生1757 例新發心血管事件。研究將主食分為大米、小麥、粗糧（玉米、小米、蕎麥、燕麥等）三類，得出以下核心結論：", "1、主食型別直接影響心血管風險。 與長期以大米為主食的老年人相比，長期吃小麥製品（饅頭、麵條、烙餅等）者，心血管疾病風險顯著升高 40.8%；粗糧與心血管風險無明顯關聯，相對安全。", "2、這三類人最要少吃麵食：65–79 歲、男性、沒高血壓的人。", "研究發現，麵食的危害在這三類人身上特別明顯：", "65–79 歲：風險高 89.1%，幾乎翻倍；", "男性：風險高 61.7%；", "沒高血壓：風險高 86.6%。", "80 歲以上、女性、已經有高血壓的人，影響反而不大。", "3、麵食不是完全不能吃，關鍵看量。", "研究算出一個安全值：每天熟重 375 克左右（大約兩碗麵），風險最低，吃太少或太多都不好。米飯則是少吃一點或多吃一點都還行，中間量反而風險略高。", "研究指出，小麥風險更高，源於其精製製品升糖指數高、易誘發炎症，且常搭配紅肉；大米脂肪、鈉含量更低，多搭配豆製品，對血管更友好。", "綜上結論，中國老人主食這樣吃更健康：", "✅ 老年人優先吃米飯；", "✅ 適量吃粗糧；", "✅ 少吃饅頭、麵條、烙餅；", "⚠️ 尤其是65–79 歲男性、沒高血壓的老人，更要控制麵食。", "主食換一換，血管更健康。", "本文僅用於學術交流和健康科普。"], "tags": ["老年人飲食", "衰老", "科學抗衰", "關注老人健康", "預防心腦血管", "飲食與生活習慣", "粗糧", "主食"], "dup": 0, "cat": "心血管", "plain": "研究追蹤 1 萬 6 千多位 65 歲以上的中國老人 7 年，發現：長期以麵食（饅頭、麵條、烙餅）當主食的人，心血管病風險比吃米飯的人高約 41%；吃粗糧則沒有增加風險。特別是 65～79 歲、男性、沒有高血壓的人更要注意。麵食不是不能吃，每天熟重約 375 克（兩碗麵）最剛好。", "mind": {"c": "米飯比麵食護心", "b": [["研究", ["16498位65歲以上", "追蹤7.38年"]], ["結果", ["麵食風險+40.8%", "粗糧無關"]], ["高風險族群", ["65-79歲 +89%", "男性 +62%", "無高血壓 +87%"]], ["原因", ["精製麵升糖快", "易發炎", "常配紅肉"]], ["建議", ["優先米飯", "適量粗糧", "麵食約375g/天"]]]}, "frame": [["主食", "長期以精製麵食為主"], ["機制", "升糖快、發炎、配紅肉"], ["結果", "心血管風險上升"], ["調整", "米飯＋粗糧為主"]], "prod": [["糙米 / 五穀米", "兼顧米飯優點與粗糧纖維"], ["燕麥片", "粗糧代表，β-葡聚醣幫助調節血脂"], ["無糖豆漿", "米飯常搭豆製品，植物蛋白更護血管"]], "gb": [["033", "亞麻仁籽渣", "加在飯或粥裡增加纖維，降低升糖速度", "198"], ["083", "苦瓜皂甘複方", "幫助血糖平穩，減少精製麵食的血糖衝擊", "540"], ["084", "黃連素／小蘗鹼", "調節血糖血脂，保護心血管", "560"]]}, {"i": 43, "title": "番茄抗衰的真相", "date": "May 21", "body": ["2026年4月1日，來自美國梅奧診所的研究團隊在 EMBO Molecular Medicine 雜誌發表研究，該研究發現，番茄、茄子等植物來源的小分子番茄鹼，可在體內外減少衰老相關表型和SASP訊號傳導，改善虛弱和認知能力，同時維持正常的細胞週期阻滯特徵。", "茄鹼苷元（Tomatidine）是青番茄裡的天然成分，能溫和 “修復” 衰老細胞，不讓它們釋放炎症毒素，同時保護大腦和全身機能，安全性好、可口服吸收，是適合日常的天然抗衰物質。", "人變老時，體內會堆積大量 “殭屍細胞”（衰老細胞），它們不幹活還釋放炎症，讓人虛弱、忘事、腦子不好使。番茄鹼苷元的作用就是給殭屍細胞 “靜音”，不殺死細胞，只關掉它的毒性，不傷害健康細胞。", "實驗用 21 個月大的老年小鼠（相當於人類 70 歲左右），在飼料里加0.05% 番茄鹼苷元，連續喂 3 個月。結果很明確：小鼠身體衰弱程度明顯減輕，走路更穩、平衡更好；記憶力和學習能力大幅提升，接近年輕小鼠水平。原因是因為番茄鹼苷元能降低肝臟、皮膚、大腦裡的衰老指標，減少大腦炎症，讓過度活躍的小膠質細胞安靜下來；同時保護腦血管內壁細胞，加固血管 “緊密連線蛋白”，守住血腦屏障，讓大腦更健康、運轉更順暢。", "日常實用方案", "飲食來源：優先選擇青番茄、番茄花萼、嫩莖，紅番茄含量極低。青番茄需煮熟食用，每次 50–100g，每週 2–3 次；幹番茄萼 2–3g 可泡水代茶飲，搭配橄欖油促進吸收。", "補充劑使用：選擇純度≥90% 產品，每日 20–40mg，分 1–2 次隨餐服用，3 個月為一療程，每日劑量不超過 100mg。", "禁忌人群：番茄 / 茄科過敏者、孕婦、哺乳期女性、嚴重肝腎功能不全者禁用。", "增效搭配：配合魚油、薑黃素抗炎；每週 3 次中等強度有氧運動；保證 7–8 小時睡眠，強化腦健康效果。", "番茄鹼苷元以溫和調控方式對抗衰老，無明顯副作用，短期即可改善衰老相關功能衰退，適合中老年人群長期使用。", "本文僅用於學術交流和健康科普。"], "tags": ["科學抗衰", "衰老", "番茄的理想", "番茄", "大愛番茄", "西紅柿"], "dup": 0, "cat": "飲食", "plain": "人變老時身體會堆積「殭屍細胞」（衰老細胞），它們不工作還一直放出發炎毒素，讓人虛弱、健忘。青番茄裡的番茄鹼苷元（Tomatidine）可以讓殭屍細胞「靜音」：不殺死它，只關掉它的毒性。老鼠吃了 3 個月，走路更穩、記憶接近年輕老鼠。注意紅番茄含量很低，青番茄要煮熟吃。", "mind": {"c": "番茄鹼苷元抗衰", "b": [["殭屍細胞", ["衰老細胞", "釋放發炎毒素SASP"]], ["作用方式", ["讓殭屍細胞靜音", "不殺死細胞"]], ["動物效果", ["老鼠3個月", "走路穩、平衡好", "記憶接近年輕鼠", "保護血腦屏障"]], ["吃法", ["青番茄煮熟", "番茄花萼泡茶", "過敏/孕婦禁用"]]]}, "frame": [["老化", "衰老細胞堆積"], ["傷害", "放出發炎訊號"], ["介入", "番茄鹼苷元靜音"], ["結果", "虛弱減輕、認知改善"]], "prod": [["番茄萃取 / 茄紅素", "番茄家族的抗氧化成分，支持細胞健康"], ["薑黃素", "文中建議搭配，一起抗發炎"], ["紫蘇籽油 / 魚油", "Omega-3 抗發炎的增效搭檔"]], "gb": [["041", "薑黃素＋胡椒鹼", "文中建議的增效搭配，一起抗發炎", "620"], ["002", "EPA+DHA複方粉包", "文中建議搭配魚油，Omega-3 抗發炎", "1350"], ["072", "蝦紅素200mcg＋硒200mcg", "與番茄同屬類胡蘿蔔素家族，強效抗氧化", "530"]]}, {"i": 44, "title": "親測1年，聊聊放化後喝蛋白粉踩過的坑", "date": "May 21", "body": ["陪爺爺放化這一年多，在蛋白粉上踩了不少坑、花了不少冤枉錢，說句實在的：放化期間補蛋白確實關鍵，但一旦選錯，不光白白浪費錢，還會給身體添負擔，遭沒必要的罪，真的得不償失！", "一、放化蛋白粉，我們踩過的那些坑", "第一坑：蛋白質型別沒選對", "之前跟風買了一款乳清蛋白的，結果喝了很久，指標也沒啥變化。後來才知道，這種屬於整蛋白，是大分子的，爺爺這種腸啊胃啊弱的根本吸收不了，喝進去等於白搭，還給身體添負擔", "✅怎麼避免：優先選水解乳清蛋白、白蛋白肽這種小分子蛋白，不用身體費勁就能吸收利用，喝著沒負擔", "第二坑：只重蛋白含量，忽略營養太單一", "以前以為蛋白含量高就好，專門買純蛋白粉，可長期喝下來，也沒啥變化。後來才反應過來，放化對身體是全方位消耗，只補蛋白遠遠不夠，其他的基礎營養都要跟上", "✅怎麼避免：選營養配比全面的，五大營養素最好都有，尤其是維生素和鈣鎂鋅鐵，對升指標有很大的幫助", "第三坑：貪便宜選雜牌，配料表全是貓膩", "看便宜就入手雜牌蛋白粉，回來一看配料表，前幾位全是麥芽糊精、白砂糖，蛋白含量特別低。爺爺喝完身體不得勁，純屬瞎折騰", "✅怎麼避免：看配料表，蛋白質要排在前三位，少糖、少新增，千萬別隻圖便宜", "二、蛋白粉到底怎麼挑選", "（具體看p2）", "三、說說爺爺喝過的幾款，真實感受", "這個是爺爺一直在喝的，對他這種腸啊胃啊弱的很友好，喝著覺得對他化後那會的情況很對口，像是量身定做的一樣。它裡面是水解乳清蛋白，屬於小分子短肽蛋白，不用身體費勁拆就能用，而且營養也全，五大營養素都搭配齊全了，維生素新增了12種呢，鈣鎂鋅鐵這些微量元素也都有", "很多人都喝這個，有20多種營養。但蛋白是酪蛋白，是整蛋白還有乳糖的，不太適合爺爺，後面就不喝了", "看中了裡面的7種菌菇提取物，對於自護挺有幫助的。蛋白是白蛋白肽，也是小分子的，很好吸收還沒啥負擔。平時讓爺爺和存能搭著喝", "蛋白含量挺高的，有70%，但是營養比較單一，除了蛋白沒別的，還得自己琢磨搭配別的補，後邊也沒喝了"], "tags": ["存能營養粉", "安素", "百歲菌方賦白飲", "斯維詩", "放化", "蛋白粉"], "dup": 0, "cat": "蛋白質", "plain": "作者陪爺爺做放化療一年多，分享買蛋白粉踩過的三個坑：①蛋白質種類不對——腸胃弱的人吸收不了大分子整蛋白，要選水解乳清、小分子肽；②營養太單一——只補蛋白不夠，維生素和鈣鎂鋅鐵也要有；③貪便宜——要看成分表，蛋白質要排在前三名，少糖少添加。", "mind": {"c": "放化療蛋白粉避坑", "b": [["坑1：種類", ["整蛋白難吸收", "選水解乳清、小分子肽"]], ["坑2：太單一", ["只補蛋白不夠", "要五大營養素齊全"]], ["坑3：雜牌", ["麥芽糊精、糖排前面", "蛋白質要排前三"]], ["原則", ["好吸收", "營養全面", "看成分表"]]]}, "frame": [["需求", "放化療消耗大"], ["選類型", "小分子好吸收"], ["選配方", "營養全面"], ["看標示", "蛋白質排前三、少糖"]], "prod": [["水解乳清蛋白營養粉", "小分子肽不用費力消化，腸胃弱也好吸收"], ["完整配方營養補充品", "五大營養素＋維生素礦物質，全面補給"], ["菇類多醣", "支持免疫保護力"]], "gb": [["034", "胺基酸可可粉包", "胺基酸不需消化就能吸收，適合腸胃弱的人", "780"], ["081", "5R腸胃營養素", "依 5R 概念修護腸胃，幫助吸收營養", "750"], ["089", "巴西蘑菇", "菇類多醣支持免疫保護力（治療期間請先問醫師）", "250"]]}, {"i": 45, "title": "身體各個部位，衰老速度各不相同", "date": "05-18", "body": ["2026年5月8日，中國衰老生物標誌物研究聯合體在《Cell》刊發了一項衰老領域重磅研究。以往國際通用的衰老評估模型大多依託西方人群資料，並不貼閤中國人的身體特徵，因此研究團隊專門針對本國人群開展衰老專項研究。", "研究人員選取2019名18至91歲的健康中國人為研究物件，彙總240多項生理檢測指標以及多組學分子資料，處理的資料總量超10億條，成功建立了本土化的國人衰老參考資料庫。", "本次研究搭建了三層衰老時鐘模型，改善了傳統檢測方式片面、單一的弊端。", "研究把240項臨床指標劃分成體能、認知、代謝等八大功能模組，據此構建核心能力時鐘，用來衡量人體整體生理機能；", "第二層為多模態時鐘，整合多組學資料建模，生物年齡測算誤差低至3.87年。藉助這一高精度模型，科研人員測算出每一名受試者的老化速度，清晰解釋了同齡人衰老快慢不同的原因；", "第三層是器官特異性時鐘，透過無創血漿檢測，能夠單獨評定六大人體器官的衰老程度。", "該研究得出多項重要科研結論。", "人體各個器官衰老節奏並不一致，存在兩個關鍵衰老拐點：40至50歲主要表現為肝臟功能衰退，身體基礎機能逐步下降；60至70歲多個器官同步老化，衰老程序明顯加快。其中肝臟在40歲最先開始老化，大腦則在50歲後衰老提速。", "研究還將人群劃分為慢速、正常、快速三類老化群體，快速老化人群患上慢性病的風險更高；", "性別層面上，女性衰老速度普遍慢於男性。", "生活方式同樣影響衰老程序，熬夜、久坐、高脂飲食會損傷肝臟與血管，堅持規律運動則可以延緩老化。", "在分子機制方面，研究確認凝血因子會隨年齡增長不斷堆積，誘發慢性炎症，是推動人體全面衰老的關鍵誘因。", "這項研究構建了適配中國人的“衰老數字人體”模型，填補了國內本土衰老資料的空白。無論是普通人群自測生理年齡、防範慢性病，還是臨床開展老年病防治、研發抗衰老靶向藥物，該成果都能提供可靠的資料參考與理論支撐，兼具實用價值與科研意義。", "本文僅用於學術交流和健康科普。"], "tags": ["科學抗衰", "衰老", "這是人體衰老的正常現象", "健康年輕態", "身體的奧秘", "直擊衰老源"], "dup": 0, "cat": "衰老機制", "plain": "中國科學家建立了專屬中國人的「衰老時鐘」，分三層：整體能力、多組學分子（誤差只有 3.87 年）、六大器官各自的年齡。發現：器官老化速度不一樣，40～50 歲肝臟先老，60～70 歲多器官一起加速；女性普遍比男性老得慢；熬夜、久坐、高脂飲食會加速老化，規律運動能延緩。", "mind": {"c": "中國人衰老時鐘", "b": [["三層時鐘", ["核心能力時鐘", "多模態時鐘（誤差3.87年）", "器官特異性時鐘"]], ["兩個拐點", ["40-50歲肝臟", "60-70歲多器官"]], ["差異", ["慢速/正常/快速老化", "女性比男性慢"]], ["生活方式", ["熬夜、久坐、高脂加速", "運動延緩"]], ["機制", ["凝血因子堆積→慢性發炎"]]]}, "frame": [["測量", "三層衰老時鐘"], ["發現", "器官不同步老化"], ["加速因子", "熬夜、久坐、高脂"], ["保護因子", "規律運動"], ["應用", "自測生理年齡、預防慢病"]], "prod": [["運動手環", "記錄睡眠與活動，避免久坐熬夜"], ["紫蘇籽油", "取代高脂飲食中的壞油，護肝護血管"], ["薑黃素", "抗發炎，對抗凝血因子引起的慢性發炎"]], "gb": [["077", "肝寶", "40～50 歲第一個老化拐點在肝臟，提早保養（成分以產品標示為準）", "550"], ["041", "薑黃素＋胡椒鹼", "對抗凝血因子堆積引起的慢性發炎", "620"], ["061", "NMN複方", "補充 NAD+，支持細胞能量與修復", "570"]]}, {"i": 46, "title": "cell規律運動是慢病防治和長壽最佳策略", "date": "May 13", "body": ["現代社會人均壽命較百年前提升約 60%，但日常運動量降至原先的 1/5，心血管疾病、2 型糖尿病、認知障礙、癌症等慢性病高發，壽命延長並未帶來健康壽命的同步增長。2025年5月，《Cell Metabolism》刊發國際綜述，明確提出“運動即藥物”，證實規律運動可作為非傳染性慢性病的一線干預手段，兼具預防與治療雙重價值。 動醫學的理念源遠流長，從古希臘希波克拉底提出 “行走是人類最好的藥”，到 20 世紀運動生理學機制被逐步揭示，丹麥學者奧古斯特・克羅格因骨骼肌毛細血管調控機制獲諾貝爾獎，達拉斯臥床試驗與哈佛校友研究則證實，臥床會嚴重損害心血管功能，而規律運動可降低慢性病風險、延長壽命。目前美國心臟協會、美國運動醫學會等機構均明確推薦，成人每週完成 150 分鐘中等強度有氧運動，搭配至少 2 次力量訓練。 運動對慢性病的改善效果有明確資料支撐。高血壓與冠心病患者堅持運動，可顯著降低血壓，心臟康復能減少心血管死亡與再發心梗風險；2 型糖尿病患者經規律運動，糖化血紅蛋白可下降 0.5%–0.7%，強化運動干預能讓超半數患者脫離降糖藥物。運動還可降低 700 餘種癌症的發病風險，結腸癌患者術後堅持規範運動，死亡風險降低 37%。此外，運動能降低 45% 的痴呆發病風險，改善認知功能，緩解抑鬱焦慮，同時提升慢阻肺患者的運動能力與生活質量。每日 7000 步即可獲得顯著健康收益，並非必須達到 1 萬步。 運動發揮作用的核心機制包括調控體重、最佳化代謝與激素水平、抑制慢性低度炎症、釋放肌因子實現肌肉與全身器官的訊號通訊，以及透過細胞外囊泡傳遞保護性分子。值得注意的是，運動效果存在個體遺傳差異，少數人對運動反應較弱，但絕大多數人可從中獲益。 綜上，運動並非單純的健康習慣，而是可量化、有明確獲益的一線治療手段。完善公共運動設施、將結構化運動納入臨床診療，能有效降低慢性病負擔，顯著提升全民健康壽命。 本文僅用於學術交流和健康科普。"], "tags": ["科學抗衰", "衰老", "運動與健康", "運動與營養"], "dup": 0, "cat": "運動", "plain": "現在人比一百年前多活了 60%，但運動量只剩五分之一，慢性病變多。《Cell》綜述說：「運動就是藥！」每週 150 分鐘中等強度有氧＋2 次重量訓練，可以降血壓、讓糖尿病糖化血色素降 0.5～0.7%、失智風險降 45%、結腸癌術後死亡降 37%。每天 7000 步就有明顯好處。", "mind": {"c": "運動就是藥", "b": [["建議量", ["每週150分鐘有氧", "每週2次重訓", "每天7000步"]], ["慢病效果", ["降血壓", "糖化血色素-0.5~0.7%", "失智-45%", "結腸癌死亡-37%"]], ["機制", ["調控體重代謝", "抑制慢性發炎", "肌激素傳訊", "細胞外囊泡"]], ["提醒", ["個體有差異", "大多數人受益"]]]}, "frame": [["現代問題", "活得久但動太少"], ["處方", "150 分鐘有氧＋2 次重訓"], ["機制", "代謝、抗炎、肌激素"], ["結果", "慢性病預防與治療"]], "prod": [["計步器 / 手環", "每天 7000 步，看得見就做得到"], ["彈力帶組", "每週 2 次在家重訓"], ["乳清蛋白", "搭配重訓，幫助肌肉生長修復"]], "gb": [["034", "胺基酸可可粉包", "搭配每週 2 次重訓，幫助肌肉合成", "780"], ["043", "鹼能活（含肌酸、肉鹼）", "提升運動表現與能量代謝", "520"], ["094", "D3（2000IU＋A＋E）", "支持肌肉、骨骼與免疫功能", "580"]]}, {"i": 47, "title": "植物乳植桿菌 VB165 的7年研發之路", "date": "May 12", "body": [], "tags": ["植物乳植桿菌VB165的研發歷經7年，從全國樣本採集到篩選，歷經18個月，最終透過動物實驗和安全性評價，獲得國家發明專利，並進入臨床研究階段，驗證其DAI謝調節功能。", "益生菌研發", "植物乳植桿菌", "VB165", "本土菌株", "科研紀實", "微生物研究", "產業觀察"], "dup": 0, "cat": "腸道", "plain": "這篇介紹一株從中國本土篩選出來的益生菌「植物乳植桿菌 VB165」，研發花了 7 年：從全國採集樣本、篩選 18 個月，再做動物實驗和安全性評估，拿到發明專利並進入臨床研究，要驗證它調節代謝的功能。好的益生菌需要長時間研究與驗證。（本篇原文多為圖片，此為依標題與標籤整理）", "mind": {"c": "益生菌 VB165 研發", "b": [["菌種", ["植物乳植桿菌", "本土菌株"]], ["研發歷程", ["全國採樣", "篩選18個月", "動物實驗", "安全性評估"]], ["成果", ["發明專利", "進入臨床研究"]], ["目標", ["驗證代謝調節功能"]]]}, "frame": [["採樣", "全國蒐集菌株"], ["篩選", "18 個月挑選"], ["驗證", "動物＋安全性"], ["臨床", "人體研究代謝功能"]], "prod": [["有臨床研究的益生菌", "選有菌株編號、有人體研究的產品更有保障"], ["益生元（菊糖/寡醣）", "當好菌的食物，幫助益生菌定殖"], ["無糖優格", "天然發酵食物，補充乳酸菌"]], "gb": [["096", "孢子益生菌（加亞麻仁渣）", "孢子型菌耐胃酸、存活率高，加上亞麻仁渣當好菌食物", "650"], ["058", "腸寶", "腸道保養（成分以產品標示為準）", "485"], ["062", "酶菌醣體", "益生菌＋β 多醣＋鳳梨酵素，調整菌叢兼助消化", "720"]]}, {"i": 48, "title": "權威研究：午睡越頻繁，心腦血管風險越高", "date": "Apr 27", "body": ["《Hypertension》的一項長期隨訪研究，依託英國生物銀行358451名無基礎心腦血管疾病的歐洲中年人，經過11.16年隨訪與孟德爾隨機化因果驗證，明確了日間午睡頻次與高血壓、缺血性中風的關聯性，為大眾午睡養生與心腦血管防護提供了醫學依據。", "該研究將午睡分為從不、偶爾、經常三類，在校正多種混雜因素後發現，午睡頻次與心腦血管發病呈正相關。", "對比從不午睡人群，", "偶爾午睡者原發性高血壓、中風、缺血性中風風險分別提升7%、12%、9%；", "經常午睡者風險顯著升高，其中高血壓風險增加12%，中風風險增加24%，缺血性中風風險增加20%。", "孟德爾隨機化分析進一步證實，頻繁午睡是誘發高血壓、缺血性中風的潛在獨立危險因素。分層資料顯示午睡危害存在年齡差異，60歲以下中青年頻繁午睡，高血壓患病風險升高20%，受影響遠高於老年人群。", "該研究存在一定侷限性，僅統計午睡頻次、未考量午睡時長，且樣本以歐洲人群為主，普適性有限。結合多項權威配套研究可以補充午睡時長的參考資料，完善午睡與心腦血管健康的關聯結論。", "2024年《歐洲神經病學雜誌》針對高血壓人群的隨訪研究顯示，午睡時長是影響中風風險的關鍵指標，相較於午睡1–30分鐘的人群，午睡31–60分鐘者中風風險升高27%，午睡超60分鐘者中風風險升高37%。", "2023年《神經病學》的隨訪研究也印證，相比不午睡人群，單次午睡時長超過1小時，整體中風風險大幅提升。", "歐洲心臟病學會相關研究表明，每日午睡時長超一小時，人群心血管疾病患病風險與全因死亡風險，會分別升高35%與30%。", "綜合現有全部研究，午睡的健康風險來自“頻次+時長”的雙重影響，高頻午睡、長時間午睡，都會持續累積心腦血管發病隱患。", "日常無需完全杜絕午睡，但需要控制午睡頻次，保持適度、規律的日間小憩，以此降低高血壓和缺血性中風的發病機率。", "本文僅用於學術交流和健康科普。"], "tags": ["老年人睡眠", "健康睡眠", "預防心腦血管", "衰老", "睡好子午覺", "保護心腦血管", "老年人作息", "睡眠與健康"], "dup": 0, "cat": "睡眠", "plain": "英國研究追蹤 35 萬人 11 年發現：越常午睡的人，高血壓和中風風險越高；經常午睡者中風風險多 24%。60 歲以下的人影響更大。其他研究也發現，午睡超過 30 分鐘、尤其超過 1 小時，風險明顯上升。所以午睡可以，但要「短」又「不要太頻繁」，大約 20～30 分鐘就好。", "mind": {"c": "午睡越頻繁風險越高", "b": [["研究", ["35.8萬人", "追蹤11年", "孟德爾隨機化"]], ["經常午睡", ["高血壓+12%", "中風+24%", "缺血性中風+20%"]], ["時長", ["31-60分鐘中風+27%", "超過60分鐘+37%"]], ["建議", ["控制頻率", "控制在30分鐘內", "60歲以下更要注意"]]]}, "frame": [["習慣", "頻繁、長時間午睡"], ["可能原因", "夜間睡眠差、節律亂"], ["風險", "高血壓、中風上升"], ["行動", "短午睡 20～30 分鐘"]], "prod": [["午睡鬧鐘 / 智慧手環", "設定 20～30 分鐘提醒，避免睡太久"], ["GABA 助眠配方", "改善夜間睡眠，白天不用補眠"], ["電子血壓計", "定期量血壓，掌握心血管狀況"]], "gb": [["054", "GABA", "改善夜間睡眠，白天就不需要長時間補眠", "540"], ["091", "甘氨酸鎂複方粉包", "放鬆神經、提升睡眠品質，並幫助血管放鬆", "1350"], ["055", "地龍蛋白複方", "幫助血流順暢，照顧心腦血管（服抗凝血藥者先問醫師）", "550"]]}, {"i": 49, "title": "每頓吃八分飽可阻斷衰老和炎症", "date": "Apr 14", "body": ["熱量限制是目前公認能延長健康壽命的非藥物干預方式，但其調控免疫代謝、降低衰老相關慢性炎症的核心機制尚不明確。本研究基於 42 名健康中年人持續 2 年、每日減少 14% 熱量攝入的臨床試驗，結合老年小鼠反向轉化實驗，系統揭示了補體系統在衰老與抗炎延壽中的關鍵作用，為延緩衰老提供了可轉化的干預靶點。 研究發現，持續溫和熱量限制可顯著改變人體血漿蛋白譜，上調脂聯素、IGFBP2 等長壽相關蛋白，抑制 NF-κB 炎症通路，且僅特異性延緩脂肪組織衰老。通路分析顯示，熱量限制最突出的作用是下調補體系統，補體 C3 裂解產物 C3a 及穩定形式 C3adesArg 顯著降低，這一變化與體重指數 BMI 無關，是熱量限制獨有的抗炎效應。 動物實驗證實，衰老會使人和小鼠血清 C3a 明顯升高，且該升高僅出現在內臟脂肪組織，肝臟、皮下脂肪等器官無此變化。進一步研究確認，內臟脂肪巨噬細胞是 C3a 的主要來源，C3a 透過 ERK 通路以自分泌方式促進 IL-1β、IL-6 等炎症因子釋放，持續驅動慢性炎症。 針對這一機制，研究採用臨床階段 C3 抑制劑 AMY-101干預老年小鼠，每週 1 次、連續 6 周，結果顯示該干預安全無明顯副作用，可顯著改善老年小鼠葡萄糖耐受、提升肢體握力，降低全身炎症水平，減少內臟脂肪中促炎免疫細胞浸潤。同時，FGF21 過表達、PLA2G7 敲除等長壽小鼠模型，均存在 C3a 水平降低的特徵。 本研究最終證實，補體 C3 失活是熱量限制發揮抗衰作用的核心機制，也是多種延壽干預的共同通路。藥物靶向抑制 C3，可安全模擬熱量限制的健康效益，有效減輕炎性衰老、改善老年生理功能、降低慢性病風險，為臨床開發抗衰干預方案提供了清晰、可轉化的科學依據與實踐路徑。 本文僅用於學術交流和健康科普。"], "tags": ["科學抗衰", "衰老", "如何面對衰老", "炎症"], "dup": 0, "cat": "飲食", "plain": "讓健康中年人每天少吃 14% 熱量、持續 2 年，發現身體裡的「補體 C3a」降下來，慢性發炎減少。研究再追查：老了以後，肚子裡的內臟脂肪會製造很多 C3a，像點火器一樣讓發炎一直燒。用藥物擋住 C3，老鼠的血糖、抓力都改善。也就是說，吃八分飽就是在關掉這個點火器。", "mind": {"c": "八分飽關掉發炎點火器", "b": [["人體試驗", ["42人、2年", "少吃14%"]], ["關鍵分子", ["補體C3a", "來自內臟脂肪巨噬細胞"]], ["發炎路徑", ["C3a→ERK→IL-1β、IL-6"]], ["動物驗證", ["C3抑制劑", "血糖、握力改善"]], ["結論", ["補體失活是熱量限制的核心機制"]]]}, "frame": [["老化", "內臟脂肪 C3a 上升"], ["點火", "巨噬細胞釋放發炎因子"], ["結果", "慢性發炎、老化"], ["八分飽", "補體下降"], ["效果", "發炎減輕、功能改善"]], "prod": [["燕麥 / 全穀代餐", "飽足感高，容易做到八分飽"], ["分裝餐盒", "控制每餐份量的好幫手"], ["膳食纖維", "延長飽足感、餵養好菌"]], "gb": [["033", "亞麻仁籽渣", "高纖延長飽足感，輕鬆做到八分飽", "198"], ["083", "苦瓜皂甘複方", "穩定血糖、減少暴食衝動", "540"], ["038", "EGCG複方", "抗發炎、幫助內臟脂肪代謝", "560"]]}, {"i": 50, "title": "年紀大了記性差，根源來自於腸道菌群老化", "date": "Apr 8", "body": ["這篇發表於《Nature》的研究揭示了腸道菌群-代謝物-免疫-迷走神經-海馬體 的跨系統通路，闡明瞭年齡相關認知衰退的外周驅動機制。 文獻的結論通俗講：人老了記性變差，根源之一是腸道里一種叫戈氏副擬桿菌的細菌變多，它產生的脂肪酸會引發炎症、影響腸道和大腦的“通訊神經”（迷走神經），最終讓負責記東西的大腦區域“罷工”。 研究以8周至18月齡小鼠為模型，透過共居、糞菌移植（FMT）等實驗，證實老年小鼠的腸道菌群可直接導致年輕小鼠認知功能下降。核心發現老年小鼠腸道中 戈氏副擬桿菌（Parabacteroides goldsteinii） 丰度顯著升高，其產生的中鏈脂肪酸（MCFA，如3-羥基辛酸）是關鍵效應分子。 進一步機制探索顯示：MCFA透過啟用外周髓系細胞表面的GPR84受體，誘導TNF、IL-1β等促炎因子釋放，進而損傷迷走神經傳入功能，削弱大腦對腸道內感受訊號的接收，最終導致海馬體神經元啟用不足，記憶編碼能力下降。 透過靶向干預驗證：噬菌體抑制戈氏副擬桿菌、GPR84拮抗劑（PBI-4050）、迷走神經啟用劑（辣椒素、CCK）等手段，均可逆轉老年小鼠的認知衰退，恢復海馬體神經元功能。 核心觀點： 1. 年齡相關認知衰退並非僅由大腦自身老化導致， 腸道菌群紊亂是關鍵外周誘因 ，戈氏副擬桿菌過度增殖是核心菌群標誌物。 2. 中鏈脂肪酸-GPR84-髓系細胞炎症通路是連線腸道與大腦的核心訊號軸，其異常啟用會破壞腸道-腦內感受通路。 3. 迷走神經功能障礙是認知衰退的關鍵中間環節， 恢復腸道-腦通訊可作為干預年齡相關認知下降的新靶點 。 4. 外周炎症無需侵入大腦，僅透過損傷外周感覺神經即可影響海馬體功能，為認知障礙的非侵入性干預提供了新思路。"], "tags": ["衰老", "科學抗衰", "養腸等於養命", "腸道菌群", "認知衰退"], "dup": 0, "cat": "腸道", "plain": "《Nature》研究發現：老了記性變差，原因之一來自肚子！老年人腸道裡一種叫「戈氏副擬桿菌」的細菌變多，它產生的脂肪酸會引發發炎，傷到連接腸道和大腦的「電話線」（迷走神經），結果大腦負責記憶的海馬迴就「罷工」了。把這條路修好，老鼠的記憶就恢復了。", "mind": {"c": "腸道菌老化→記性差", "b": [["壞菌", ["戈氏副擬桿菌變多", "產生中鏈脂肪酸"]], ["發炎", ["GPR84受體", "TNF、IL-1β"]], ["傳導", ["迷走神經受損", "腸腦訊號中斷"]], ["大腦", ["海馬迴活化不足", "記憶下降"]], ["逆轉", ["抑制壞菌", "阻斷GPR84", "活化迷走神經"]]]}, "frame": [["腸道", "壞菌增加"], ["代謝物", "中鏈脂肪酸"], ["發炎", "GPR84→發炎因子"], ["神經", "迷走神經受損"], ["大腦", "海馬迴記憶下降"]], "prod": [["益生菌", "補充好菌，平衡腸道菌叢"], ["膳食纖維 / 益生元", "餵養產短鏈脂肪酸的好菌"], ["辣椒素食物 / 運動", "研究中迷走神經活化可逆轉；日常可多動、深呼吸刺激迷走神經"]], "gb"
