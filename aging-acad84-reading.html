: [["096", "孢子益生菌（加亞麻仁渣）", "補充好菌、平衡菌叢，減少壞菌過度增生", "650"], ["046", "丁酸鈉複合包", "丁酸修護腸道屏障、降低腸道發炎，守護腸腦通訊", "890"], ["081", "5R腸胃營養素", "移除、修復、再平衡，全面照顧腸道", "750"]]}, {"i": 51, "title": "吃大豆蛋白，養出好肌肉！", "date": "Apr 6", "body": ["研究時間：2020.12-2022.02開展試驗，2026年發表頂刊成果 研究團隊：復旦大學附屬華東醫院孫建琴團隊等聯合研究 家人們！別再覺得老來瘦是好事啦，肌肉悄悄流失的肌少症，可是老年人健康的大威脅！咱們常吃的豆腐、豆漿這些大豆製品，居然能幫老人守住肌肉，秘訣還藏在腸道里～ 研究找了上海養老機構84位平均84歲的老人，做了12周趣味試驗：一組每天三餐吃大豆蛋白（合計30g，混在飯菜、粥湯裡超方便），另一組照常吃飯。結果超明顯：吃大豆蛋白的老人小腿圍不僅沒減，還漲了0.56cm，對照組反而瘦了0.91cm，走路速度也變快了，炎症還少了！ 關鍵原因在腸道菌群這個“小管家”！大豆蛋白喂胖了腸道里的“有益菌”：能產短鏈脂肪酸的玫瑰桿菌、丁酸菌變多了，這些脂肪酸可是肌肉的“能量小零食”；還趕走了讓肌肉變差的“壞細菌”，讓腸道少發炎。第6周時，老人腸道里的丁酸、異丁酸這些好東西含量猛漲，直接幫肌肉“充電”！ 更有意思的是，腸道菌群還會悄悄合成維生素，幫肌肉代謝，減少肌肉分解，這就是神奇的“腸-肌軸”——腸道養得好，肌肉才會棒！ 生活小建議： 每天吃點豆腐、喝杯豆漿，或者在粥里加勺大豆蛋白粉，輕鬆補蛋白。 大豆蛋白是咱中國人的優質蛋白，乳糖不耐受也能吃，實惠又家常！ 小小大豆蛋白，守護老年肌肉，從日常吃飯開始，養腸道、強肌肉，讓爸媽腿腳更靈便～"], "tags": ["蛋白質", "大豆蛋白", "肌肉", "衰老", "科學抗衰", "腸道菌群", "腸道健康", "素食者的蛋白質來源", "優質蛋白質", "補充蛋白質"], "dup": 0, "cat": "肌肉", "plain": "老了變瘦不一定是好事，可能是肌肉在流失（肌少症）。研究讓 84 位平均 84 歲的老人每天吃 30 克大豆蛋白，12 週後小腿變粗 0.56 公分、走路變快、發炎變少；沒吃的人小腿反而瘦了。秘密在腸道：大豆蛋白養胖了產短鏈脂肪酸的好菌，替肌肉「充電」，這叫「腸—肌軸」。", "mind": {"c": "大豆蛋白養肌肉", "b": [["研究", ["84位平均84歲", "12週", "每天30g大豆蛋白"]], ["結果", ["小腿圍+0.56cm", "對照組-0.91cm", "走路變快", "發炎減少"]], ["秘密", ["好菌增加", "丁酸、異丁酸上升", "壞菌減少"]], ["建議", ["豆腐、豆漿", "粥裡加大豆蛋白粉"]]]}, "frame": [["吃進", "大豆蛋白 30g/天"], ["腸道", "好菌增加、產短鏈脂肪酸"], ["肌肉", "獲得能量、分解減少"], ["結果", "小腿變粗、走路變快"]], "prod": [["大豆分離蛋白粉", "乳糖不耐也能喝，三餐加一點就能補足"], ["無糖豆漿", "每天一杯，方便的大豆蛋白來源"], ["益生元纖維", "幫助產丁酸的好菌生長，強化腸—肌軸"]], "gb": [["027", "三丁酸甘油膠囊", "直接補充丁酸——研究中替肌肉「充電」的關鍵物質", "680"], ["034", "胺基酸可可粉包", "補足胺基酸，和大豆蛋白一起保肌", "780"], ["096", "孢子益生菌（加亞麻仁渣）", "幫助產短鏈脂肪酸的好菌生長，強化腸—肌軸", "650"]]}, {"i": 52, "title": "植物飲食可調節腸道菌群延緩衰老", "date": "4月2日", "body": ["最近，一篇發表在權威期刊《Advances in Nutrition》上的重磅綜述，為我們揭示了腸道菌群、飲食與健康衰老之間的奇妙聯絡。衰老會伴隨細胞組織功能衰退，誘發癌症、神經退行性疾病等多種老年病，而健康壽命的長短，與腸道菌群和飲食中的植物化學物密切相關，二者協同作用，是守護腸道健康、延緩衰老的關鍵。", "腸道菌群的平衡是健康衰老的基礎。隨著年齡增長，腸道菌群會出現失衡，表現為有益菌減少、致病菌增加，這會破壞腸道屏障完整性，讓細菌毒素進入血液引發全身慢性炎症，還會與粒線體功能障礙、細胞衰老等衰老特徵相互影響，加劇神經炎症，誘發各類老年病。而健康長壽人群的腸道菌群，往往保留著年輕人的特徵，能持續產生有益代謝物。", "飲食中的植物化學物，是調節腸道菌群、改善腸道健康的核心，這類物質主要存在於豆類、全穀物、堅果、新鮮果蔬和香辛料中。其雖非人體必需營養素，卻能從多方面發揮作用：", "一是直接靶向細胞訊號通路，抑制炎症因子、啟用抗氧化系統，緩解腸道慢性炎症；", "二是充當益生元，促進雙歧桿菌、乳酸菌等有益菌增殖，抑制致病菌生長，恢復腸道菌群多樣性；", "三是被腸道菌群代謝為更具活性的化合物，既保護腸黏膜，也能進入血液迴圈作用於大腦、肌肉等遠端組織。", "腸道菌群還能將植物化學物轉化為尿石素 A、雌馬酚、蘿蔔硫素、橙皮素等特有代謝物，這些物質是延緩衰老的關鍵。比如石榴、草莓中的鞣花酸會轉化為尿石素 A，改善粒線體功能、緩解肌肉衰老；大豆等豆類中的大豆苷元轉化為雌馬酚，助力保護心血管和骨骼健康；西蘭花等十字花科蔬菜中的蘿蔔硫素，能增強抗氧化能力、抑制腫瘤發生。但這類代謝物的生成完全依賴個體腸道內的特定菌群，這也是不同人食用同類植物，健康獲益存在差異的原因。", "建議多攝入上述富含植物化學物的天然食材，減少精製糖和不健康脂肪的攝入，同時可搭配益生菌、益生元形成合生元，更利於腸道菌群平衡。植物化學物還能透過腸道菌群促進短鏈脂肪酸、次級膽汁酸等有益代謝物生成，這些物質能維護腸道屏障、調節免疫和代謝，甚至透過腸腦軸影響大腦健康。", "簡單來說，想要透過飲食促進健康衰老，核心就是堅持以植物性食物為主的飲食模式，養好腸道里的有益菌群，讓二者形成良性互動，從根源上改善腸道健康，抵禦衰老相關疾病。", "本文僅用於學術交流和健康科普。"], "tags": ["衰老", "科學抗衰", "腸道菌群"], "dup": 0, "cat": "腸道", "plain": "老了以後腸道好菌變少、壞菌變多，腸壁會漏，細菌毒素跑進血液引起全身發炎。蔬果、豆類、全穀、堅果和香料裡的「植物化學物」是好菌的食物，好菌還會把它們變成更厲害的物質：石榴→尿石素 A（修粒線體）、大豆→雌馬酚（護心護骨）、花椰菜→蘿蔔硫素（抗氧化）。", "mind": {"c": "植物飲食養好菌", "b": [["老化腸道", ["好菌少壞菌多", "腸漏", "全身發炎"]], ["植物化學物", ["抗發炎抗氧化", "當益生元", "被菌轉化"]], ["神奇轉化", ["鞣花酸→尿石素A", "大豆苷元→雌馬酚", "蘿蔔硫素"]], ["建議", ["植物為主", "少精製糖", "益生菌＋益生元"]]]}, "frame": [["吃進", "植物化學物"], ["腸道", "好菌增加"], ["轉化", "尿石素A、雌馬酚等"], ["全身", "抗發炎、護粒線體"], ["結果", "延緩衰老"]], "prod": [["石榴汁 / 尿石素 A", "石榴鞣花酸轉化為尿石素 A，幫助粒線體更新"], ["花椰菜芽萃取（蘿蔔硫素）", "啟動身體抗氧化防禦系統"], ["合生元（益生菌＋益生元）", "好菌加上它的食物，腸道平衡更穩"]], "gb": [["096", "孢子益生菌（加亞麻仁渣）", "益生菌＋益生元（亞麻仁渣）＝合生元，文中推薦的組合", "650"], ["046", "丁酸鈉複合包", "補充短鏈脂肪酸丁酸，維護腸道屏障", "890"], ["070", "辣木粉", "富含植物化學物，餵養好菌", "450"]]}, {"i": 53, "title": "這些天然食物是動脈粥樣硬化的“天敵”", "date": "Mar 30", "body": ["動脈粥樣硬化是一種影響大中型動脈的慢性炎症病，也是心血管疾病（CVD）最主要的誘因。根據2015年WHO的資料，全球每3例死亡中，就有1例和CVD有關。隨著肥胖、糖尿病的人越來越多，這種病的發病率也在不斷上升。臨床上常用他汀類藥物降脂，但有些患者即便吃了藥，血脂還是達不到標準，而且長期吃還可能出現肌肉疼、肝功能異常等副作用，就算按時服藥，也依然有不小的CVD發病風險，所以天然營養保健品，就成了輔助干預這種病的一個重要方向。", "該病核心發病機制與血脂代謝失衡、炎症反應相關：LDL（低密度脂蛋白，常被稱為“壞膽固醇”）升高、HDL（高密度脂蛋白，常被稱為“好膽固醇”）降低打破膽固醇穩態，氧化後的LDL觸發內皮炎症，巨噬細胞攝取oxLDL形成泡沫細胞，最終發展為易破裂斑塊，誘發心梗、中風。", "很多營養保健品，都能在病變的不同階段發揮作用，而且有明確的研究依據：", "ω-3多不飽和脂肪酸（EPA/DHA），和他汀類藥物一起用，能讓CVD事件的風險降低19%，還能穩定血管裡的斑塊；", "橄欖油裡的羥基酪醇，能提高HDL、降低氧化後的LDL，搭配地中海飲食能降低CVD高危人群的發病風險；", "植物甾醇能和腸道里的膽固醇“搶位置”，減少人體對膽固醇的吸收，薈萃分析證實它能明顯降低血清裡的LDL；", "膳食纖維在腸道里發酵會產生短鏈脂肪酸，能抗炎、穩定斑塊，每天多吃10g膳食纖維，CVD事件的風險能降低14%。", "除此之外，大蒜素、小檗鹼、黃烷醇這些，也能透過降脂、抗炎、改善血管內壁功能保護心血管，其中小檗鹼和他汀一起用，降脂效果會更好。", "不過，營養保健品的使用也有不少爭議：", "比如有些成分的研究結果不一樣，像ω-3在西方人群中的效果，大多不太理想；", "羥基酪醇如果在低膽固醇飲食下服用，反而可能促進斑塊形成，植物甾醇濃度太高，也可能和冠心病風險有關；", "而且多數研究的樣本量比較小，缺乏和西藥直接對比的大樣本試驗，效果還需要進一步驗證。", "這裡要重點提醒，目前營養保健品只能作為動脈粥樣硬化防治的輔助手段，絕對不能代替他汀這類藥物。未來還需要透過規範的大樣本隨機對照試驗，明確它們的有效劑量、適合哪些人，探索多種保健品聯合使用的效果，這樣才能更好地發揮它們保護心血管的作用。", "本文僅用於學術交流和健康科普。"], "tags": ["科學抗衰", "動脈粥樣硬化", "omega3", "心血管"], "dup": 0, "cat": "心血管", "plain": "動脈粥狀硬化就像水管內壁慢慢長出油垢，會導致心肌梗塞、中風。壞膽固醇被氧化後會引發血管發炎、形成斑塊。有些天然營養素能在不同階段幫忙：Omega-3、橄欖油多酚、植物固醇（減少膽固醇吸收）、膳食纖維（每天多 10 克，心血管風險降 14%）、大蒜素、小檗鹼。但它們只能輔助，不能取代他汀類藥物。", "mind": {"c": "動脈硬化的天然剋星", "b": [["成因", ["LDL氧化", "血管發炎", "泡沫細胞→斑塊"]], ["有證據的營養素", ["Omega-3", "橄欖油羥基酪醇", "植物固醇", "膳食纖維"]], ["其他", ["大蒜素", "小檗鹼", "黃烷醇"]], ["提醒", ["結果不一", "只能輔助", "不能取代他汀"]]]}, "frame": [["起點", "LDL 升高、HDL 降低"], ["氧化", "oxLDL 引發發炎"], ["斑塊", "泡沫細胞堆積"], ["輔助", "Omega-3、固醇、纖維"], ["主治", "仍需遵醫囑用藥"]], "prod": [["植物固醇", "與膽固醇搶位置，降低 LDL"], ["燕麥纖維 / 洋車前子", "發酵產生短鏈脂肪酸，抗發炎穩斑塊"], ["特級初榨橄欖油", "羥基酪醇提高 HDL、減少 LDL 氧化"]], "gb": [["084", "黃連素／小蘗鹼", "文中點名：與他汀併用降脂效果更好（併用務必問醫師）", "560"], ["048", "大蒜素", "文中點名：降脂、抗發炎、改善血管內壁功能", "450"], ["002", "EPA+DHA複方粉包", "文中點名：與他汀併用降低心血管事件、穩定斑塊", "1350"]]}, {"i": 54, "title": "少吃肉，老得慢？這項超40萬人研究給出答案！", "date": "Mar 29", "body": ["2025年9月立項、2026年2月發表於《Clinical Nutrition》的這項研究（文獻Biological aging across regular meat, low meat, pescatarian and vegetarian dietary patterns: A population-based cohort study），由中山大學、四川省人民醫院團隊開展，依託英國生物銀行超40萬基線參與者、8855名隨訪參與者資料，探究了常吃肉、少吃肉、吃魚素食、純素食四種飲食模式，和人體生物衰老的關係，終於把“怎麼吃更抗老”的答案摸透了！", "研究可不是看實際年齡，而是用兩種科學方法測算生物年齡——簡單說就是身體的實際老化程度，生物年齡比實際年齡小，就是實打實的“抗老”了。", "結果超有意思！和頓頓不離肉的人比，少吃肉、只吃魚不吃紅肉、純吃素的人，身體老化速度都明顯更慢。其中吃魚的素食者抗老效果最突出，生物年齡老化減速最明顯，純素食者緊隨其後，少吃肉的朋友也有顯著效果。", "更關鍵的是，就算天生有易老化的遺傳基因，堅持少肉、吃魚或素食，依然能有效放慢老化節奏；而且長期堅持這些飲食模式的人，不僅當下身體更“年輕”，後續老化的速度也會一直比常吃肉的人慢，老得更慢更健康。", "研究還發現，這類飲食之所以能抗老，核心是能減少身體慢性炎症、改善代謝，吃魚的朋友還能從魚肉中獲取Omega-3脂肪酸，進一步幫身體抗氧化、抗炎症。", "簡單總結超實用的抗老吃訣：少碰紅肉、加工肉，適量吃點魚，多吃植物性食物，就是普通人能輕鬆做到的抗老飲食法，讓身體老化踩剎車！"], "tags": ["科學抗衰", "衰老", "延緩衰老保持年輕", "個性化飲食", "飲食與健康", "越吃越年輕", "omega3", "抗炎飲食"], "dup": 0, "cat": "飲食", "plain": "中山大學團隊用英國 40 萬人的資料，比較四種吃法：常吃肉、少吃肉、只吃魚不吃紅肉、吃素。結果：和天天吃肉的人比，其他三種人身體都老得比較慢，其中「吃魚的素食者」最慢！就算天生有容易老的基因，這樣吃也有效。原因是減少發炎、改善代謝，魚的 Omega-3 還能抗氧化。", "mind": {"c": "少吃肉老得慢", "b": [["研究", ["英國生物銀行40萬人", "四種飲食模式"]], ["排名", ["吃魚素食最慢老", "純素次之", "少吃肉也有效"]], ["基因", ["易老基因者也有效"]], ["機制", ["減少慢性發炎", "改善代謝", "魚類Omega-3"]], ["吃法", ["少紅肉加工肉", "適量吃魚", "多植物"]]]}, "frame": [["飲食", "少紅肉、多魚、多植物"], ["機制", "減少發炎、改善代謝"], ["測量", "生物年齡變慢"], ["結果", "老得更慢更健康"]], "prod": [["冷凍鯖魚 / 鮭魚", "吃魚素食模式的主角，提供 Omega-3"], ["植物蛋白粉", "減少紅肉後補足蛋白質"], ["紫蘇籽油", "植物 Omega-3，幫助抗發炎"]], "gb": [["002", "EPA+DHA複方粉包", "吃魚素食者抗老最好，Omega-3 抗氧化抗發炎", "1350"], ["097", "亞麻仁油（500cc×2瓶）", "植物 Omega-3，少肉飲食的好油來源", "780"], ["070", "辣木粉", "植物營養密度高，支持植物性飲食", "450"]]}, {"i": 55, "title": "少吃肉，老得慢？這項超40萬人研究給出答案！", "date": "3月29日", "body": ["2025年9月立項、2026年2月發表於《Clinical Nutrition》的這項研究（文獻Biological aging across regular meat, low meat, pescatarian and vegetarian dietary patterns: A population-based cohort study），由中山大學、四川省人民醫院團隊開展，依託英國生物銀行超40萬基線參與者、8855名隨訪參與者資料，探究了常吃肉、少吃肉、吃魚素食、純素食四種飲食模式，和人體生物衰老的關係，終於把“怎麼吃更抗老”的答案摸透了！", "研究可不是看實際年齡，而是用兩種科學方法測算生物年齡——簡單說就是身體的實際老化程度，生物年齡比實際年齡小，就是實打實的“抗老”了。", "結果超有意思！和頓頓不離肉的人比，少吃肉、只吃魚不吃紅肉、純吃素的人，身體老化速度都明顯更慢。其中吃魚的素食者抗老效果最突出，生物年齡老化減速最明顯，純素食者緊隨其後，少吃肉的朋友也有顯著效果。", "更關鍵的是，就算天生有易老化的遺傳基因，堅持少肉、吃魚或素食，依然能有效放慢老化節奏；而且長期堅持這些飲食模式的人，不僅當下身體更“年輕”，後續老化的速度也會一直比常吃肉的人慢，老得更慢更健康。", "研究還發現，這類飲食之所以能抗老，核心是能減少身體慢性炎症、改善代謝，吃魚的朋友還能從魚肉中獲取Omega-3脂肪酸，進一步幫身體抗氧化、抗炎症。", "簡單總結超實用的抗老吃訣：少碰紅肉、加工肉，適量吃點魚，多吃植物性食物，就是普通人能輕鬆做到的抗老飲食法，讓身體老化踩剎車！"], "tags": ["科學抗衰", "衰老", "延緩衰老保持年輕", "個性化飲食", "飲食與健康", "越吃越年輕", "omega3", "抗炎飲食"], "dup": 54, "cat": "飲食", "plain": "中山大學團隊用英國 40 萬人的資料，比較四種吃法：常吃肉、少吃肉、只吃魚不吃紅肉、吃素。結果：和天天吃肉的人比，其他三種人身體都老得比較慢，其中「吃魚的素食者」最慢！就算天生有容易老的基因，這樣吃也有效。原因是減少發炎、改善代謝，魚的 Omega-3 還能抗氧化。", "mind": {"c": "少吃肉老得慢", "b": [["研究", ["英國生物銀行40萬人", "四種飲食模式"]], ["排名", ["吃魚素食最慢老", "純素次之", "少吃肉也有效"]], ["基因", ["易老基因者也有效"]], ["機制", ["減少慢性發炎", "改善代謝", "魚類Omega-3"]], ["吃法", ["少紅肉加工肉", "適量吃魚", "多植物"]]]}, "frame": [["飲食", "少紅肉、多魚、多植物"], ["機制", "減少發炎、改善代謝"], ["測量", "生物年齡變慢"], ["結果", "老得更慢更健康"]], "prod": [["冷凍鯖魚 / 鮭魚", "吃魚素食模式的主角，提供 Omega-3"], ["植物蛋白粉", "減少紅肉後補足蛋白質"], ["紫蘇籽油", "植物 Omega-3，幫助抗發炎"]], "gb": [["002", "EPA+DHA複方粉包", "吃魚素食者抗老最好，Omega-3 抗氧化抗發炎", "1350"], ["097", "亞麻仁油（500cc×2瓶）", "植物 Omega-3，少肉飲食的好油來源", "780"], ["070", "辣木粉", "植物營養密度高，支持植物性飲食", "450"]]}, {"i": 56, "title": "哈佛：多吃植物蛋白有利心血管", "date": "Mar 23", "body": ["心血管疾病是全球首要健康威脅，膳食蛋白來源與配比一直是慢病防控研究重點。哈佛大學公共衛生學院團隊在《美國臨床營養學雜誌》發表重磅研究，基於近20.3萬名受試者、長達30年的隨訪資料，明確植物蛋白與動物蛋白（P:A）比值和心血管健康的量化關聯，為飲食護心提供科學依據。", "該研究累計記錄1.6萬餘例心血管疾病（CVD）、超1萬例冠心病（CAD）病例，經多因素校正後證實：植物蛋白佔比越高，心血管患病風險越低。核心資料顯示，與P:A比值最低組（約0.24）相比，最高組（約0.76）CVD風險降低19%、CAD風險降低27%，且該保護效應與中風無關；比值達0.5以上即顯現顯著護心效果，初期風險降幅最明顯，後續趨於平緩，搭配20.8%高蛋白密度時保護作用最優。研究還證實，用堅果、全穀物、豆類替代紅肉、加工肉類，護心獲益最突出。", "該研究確定了用植物蛋白替代紅肉、加工肉類獲益最突出，堅果、全穀物、豆類是最優替代來源。", "植物蛋白的護心優勢源於其營養特性：富含膳食纖維、不飽和脂肪酸與植物甾醇，可調節血脂、改善代謝、減輕炎症，減少血管內皮損傷，尤其對高膽固醇血癥患者、有吸菸史人群保護更顯著。過量攝入紅肉等動物蛋白，則會加重脂質沉積、增加血管硬化風險，加劇心血管負擔。", "日常優質植物蛋白來源豐富，雜豆（黃豆、鷹嘴豆等）、堅果（核桃、杏仁等）、籽類（紫蘇籽、亞麻籽、奇亞籽等）、全穀物（燕麥、藜麥等）都是優選。但無需極端素食，完全剔除動物蛋白容易導致鈣、維生素B12缺乏，建議將P:A比值控制在0.5~0.76（約1:2~1:1.3）。日常減少紅肉、加工肉類攝入，用上述植物蛋白適度替代，保證總蛋白充足，即可最佳化膳食結構、降低心血管風險。這項研究為大眾飲食防病提供了量化參考，印證了均衡膳食的核心價值。", "來源:《Dietary plant-to-animal protein ratio and risk of cardiovascular disease in 3prospective cohorts》。", "本文僅用於學術交流和健康科普。"], "tags": ["衰老", "科學抗衰", "素食者的蛋白質來源", "蛋白質", "優質蛋白質來源", "植物蛋白", "心血管健康", "心血管健康飲食"], "dup": 0, "cat": "心血管", "plain": "哈佛追蹤 20 萬人 30 年發現：吃的蛋白質裡，植物蛋白比例越高，心血管病越少！植物蛋白：動物蛋白最高組比最低組，心血管病少 19%、冠心病少 27%。比例到 1:2 就開始有效，最好在 1:2～1:1.3 之間。用堅果、全穀、豆類取代紅肉和加工肉最有效，但不需要完全吃素。", "mind": {"c": "植物蛋白護心", "b": [["研究", ["哈佛20.3萬人", "追蹤30年"]], ["結果", ["CVD -19%", "冠心病 -27%", "與中風無關"]], ["最佳比例", ["植物:動物 0.5-0.76", "約1:2到1:1.3"]], ["最佳替代", ["堅果", "全穀", "豆類", "取代紅肉加工肉"]], ["提醒", ["不必全素", "防B12、鈣缺乏"]]]}, "frame": [["調整", "提高植物蛋白比例"], ["替代", "豆、堅果、全穀取代紅肉"], ["機制", "纖維、好油、植物固醇"], ["結果", "心血管風險下降"]], "prod": [["綜合堅果", "優質植物蛋白＋不飽和脂肪，取代紅肉點心"], ["紫蘇籽 / 奇亞籽", "籽類植物蛋白與 Omega-3"], ["大豆蛋白粉", "輕鬆提高植物蛋白比例"]], "gb": [["033", "亞麻仁籽渣", "籽類植物蛋白與纖維，提高植物蛋白比例", "198"], ["097", "亞麻仁油（500cc×2瓶）", "不飽和脂肪酸調節血脂、減輕發炎", "780"], ["084", "黃連素／小蘗鹼", "幫助降低膽固醇，特別適合高膽固醇族群", "560"]]}, {"i": 57, "title": "你的脂肪組織在推動機體的衰老程序", "date": "03-17", "body": ["衰老是一種由內源性和外源性因素共同調節的保守生物學過程，會導致預期壽命發生變化。在人類中，衰老的特徵表現為心血管代謝疾病、2型糖尿病以及與免疫監視功能障礙相關疾病的患病率顯著增加。在衰老過程中，脂肪組織表現出物種保守的時序性變化，包括從外周脂肪庫向內臟脂肪庫的重新分佈、產熱能力的喪失以及骨髓內的擴張。脂肪組織不僅存在於特定的脂肪庫中，還廣泛分佈於多種器官和組織內，與各類特化細胞緊密相鄰。因此，脂肪細胞透過其強大的內分泌特性，能夠調節全身各組織和器官的功能。除了脂肪細胞，脂肪組織中的多能祖細胞/幹細胞在維持和修復終生組織方面也發揮著關鍵作用。因此，脂肪組織可能是生物體衰老以及與年齡相關疾病的一個核心驅動因素。", "文獻《Adipose tissue as a linchpin of organismal ageing》是由Tammy T. Nguyen和Silvia Corvera撰寫，於2024年發表在《Nature Metabolism》上的一篇重要綜述-1。其核心觀點是將脂肪組織從一個被動的能量儲存器官，重新定義為一個驅動全身系統性衰老的核心樞紐。", "研究提出了一個顛覆性的觀點：脂肪組織不僅僅是受衰老影響的被動器官，它本身就是一個主動的、中心性的驅動器，能夠透過其強大的內分泌功能和細胞組成變化，直接調節全身其他組織和器官的功能，從而推動整個機體的衰老程序。", "核心觀點是將脂肪組織視為全身衰老的中樞調節器。它透過整合衰老訊號、分泌大量活性因子以及影響祖細胞功能，不僅自身發生功能障礙，還主動地將衰老訊號傳遞給全身，驅動了整體衰老的程序。", "這一觀點具有重要的臨床意義：它提示，透過靶向脂肪組織（例如改善其功能、清除衰老細胞等）進行干預，可能成為緩解年齡相關疾病負擔、延長健康壽命的有效治療策略。（僅用於學術交流）"], "tags": ["科學抗衰", "衰老", "直擊衰老源", "脂肪組織"], "dup": 0, "cat": "衰老機制", "plain": "以前以為脂肪只是身體的「倉庫」，存能量而已。這篇《Nature Metabolism》綜述說：脂肪其實是推動全身老化的「司令部」！老了以後脂肪會從四肢跑到肚子（內臟脂肪），產熱能力下降，還會放出很多訊號分子，把老化的訊息傳到全身。所以照顧好脂肪組織，就能延緩全身老化。", "mind": {"c": "脂肪是老化司令部", "b": [["老化變化", ["從皮下移到內臟", "產熱能力下降", "骨髓脂肪增加"]], ["主動角色", ["強大內分泌", "分泌活性因子", "影響幹細胞"]], ["影響", ["心血管代謝病", "糖尿病", "免疫失調"]], ["意義", ["改善脂肪功能", "清除衰老細胞", "延長健康壽命"]]]}, "frame": [["老化", "脂肪重新分布"], ["失能", "產熱下降、分泌失調"], ["傳遞", "老化訊號送到全身"], ["結果", "全身老化、慢性病"], ["介入", "照顧脂肪組織"]], "prod": [["綠茶兒茶素", "幫助提升脂肪代謝與產熱"], ["膳食纖維", "減少內臟脂肪堆積、穩定血糖"], ["運動手環", "持續運動是改善脂肪功能最有效的方法"]], "gb": [["038", "EGCG複方", "茶多酚幫助脂肪代謝與產熱", "560"], ["043", "鹼能活（含肉鹼）", "肉鹼把脂肪酸送進粒線體燃燒", "520"], ["084", "黃連素／小蘗鹼", "活化 AMPK，改善脂肪組織代謝與胰島素敏感度", "560"]]}, {"i": 58, "title": "老年人護好微血管，健康長壽不費力", "date": "Mar 11", "body": ["想讓家裡長輩老得慢、少生病？2025年《Advanced Science》的研究Microvascular Health as a Key Determinant of Organismal", "Aging給出關鍵答案：老年人抗衰的核心，藏在看不見的“微血管”裡！", "微血管就像身體的“微型輸油管”，密密麻麻遍佈全身，負責給心臟、大腦、骨骼等器官送氧氣、遞營養，還能及時運走代謝廢物。可老年人隨著年齡增長，這些“小血管”容易變脆、變窄，甚至數量減少——就像老化的水管又堵又漏，器官得不到充足滋養，衰老速度自然就會加快，還容易引發心臟病、記憶力下降、骨質疏鬆等老年問題。", "研究發現，老年人的微血管老化分“健康型”和“加速型”，但不用慌！守護微血管健康沒那麼複雜：堅持規律散步、吃點新鮮蔬果的地中海飲食，或是補充NMN、抗氧化劑，都能幫微血管“保持活力”；就連二甲雙胍這類常見藥物，也能透過保護血管功能助力抗衰。", "更有意思的是，年輕血液中的特殊因子能改善老年小鼠的微血管狀態，這為老年人抗衰開啟了新思路。其實老年人抗衰不用追花哨方法，把微血管這個“營養通道”養護好，器官就能正常“工作”，衰老自然慢下來。", "2025年的科學研究已經證實，微血管健康是老年人抗衰的關鍵，從今天起重視起來，讓長輩們由內而外保持健康活力，安享幸福晚年～"], "tags": ["衰老", "科學抗衰", "預防心腦血管", "中老年人群", "保護心腦血管", "長壽", "改善血液迴圈", "心血管系統"], "dup": 0, "cat": "心血管", "plain": "微血管是身體裡密密麻麻的「迷你輸送管」，負責把氧氣和營養送到心臟、大腦、骨頭。老了以後微血管變脆、變窄、變少，像又堵又漏的舊水管，器官吃不飽就老得快。好消息是：規律散步、地中海飲食、抗氧化物和 NMN，都能幫微血管保持活力。", "mind": {"c": "護好微血管", "b": [["功能", ["送氧氣營養", "運走廢物"]], ["老化", ["變脆、變窄", "數量減少", "器官缺營養"]], ["相關問題", ["心臟病", "記憶力下降", "骨質疏鬆"]], ["保養", ["規律散步", "地中海飲食", "NMN、抗氧化劑"]]]}, "frame": [["老化", "微血管減少變脆"], ["影響", "器官缺氧缺營養"], ["結果", "加速衰老、慢性病"], ["保養", "散步＋飲食＋抗氧化"]], "prod": [["NMN", "補充 NAD+，支持血管內皮細胞健康"], ["可可黃烷醇 / 葡萄籽", "多酚幫助血管舒張、改善微循環"], ["健走鞋", "每天散步，最簡單的微血管運動"]], "gb": [["061", "NMN複方", "文中點名：NMN 幫助微血管保持活力", "570"], ["050", "銀杏複方", "促進微循環，改善末梢與腦部血流", "510"], ["055", "地龍蛋白複方", "幫助血液流動順暢（服抗凝血藥者先問醫師）", "550"]]}, {"i": 59, "title": "nature最新：少吃能長壽，但沒那麼簡單", "date": "Mar 9", "body": ["2026年3月6日，挪威學、美國學者在國際頂級期刊《Nature》子刊《Nature Aging》發表題為“Dietary restriction in aging and longevity”的最新文章。飲食限制（dietary restriction, DR）的科學研究可追溯到20世紀初，但在相當長一段時間內進展緩慢。直到20世紀80年代，多項關鍵研究明確證明，即使在動物成熟之後開始實施熱量限制（caloric restriction, CR），仍然能夠顯著延長小鼠和大鼠的壽命，這一發現從根本上改變了人們對衰老生物學的認識，並使熱量限制成為該領域公認的“金標準”干預策略。此後，大量實驗研究進一步證實，飲食限制至今仍然是延長最大壽命最有效的非遺傳干預方式。 研究指出，飲食限制之所以重要，不只是因為“吃得少”，更因為它會牽動一整套與衰老相關的生物學過程。綜述總結了多個可能的關鍵通路，包括自噬、AMPK、mTORC1、NAD+代謝、SIRT家族、FGF21以及GLP-1受體相關訊號等。與此同時，機體層面的適應也很重要，例如飢餓感、禁食視窗、體溫下降、脂肪組織功能改變、晝夜節律重塑等，都可能參與其延壽作用。 作者特別反對把所有研究簡單歸為“少吃有益”這一結論，因為同樣標註為“50%限制”的方案，若蛋白水平、進食頻率和是否存在禁食時段不同，生理結果可能完全不一樣。換言之，真正起作用的，也許不是單純熱量減少，而是“營養組成—進食節律—代謝切換”共同形成的綜合效應。 但是，長期限制可能帶來免疫脆弱、傷口癒合延遲、毛髮生長減慢等代價。尤其在病毒感染模型中，長期熱量限制常表現出更差的存活率，這說明飲食限制不是無條件“有益”，而是高度依賴具體環境和生理背景。 因此，飲食限制依然是衰老生物學中最強有力的干預模型之一，但它絕不是一句“少吃就能長壽”可以概括的簡單命題。 文章還討論了“飲食限制模擬物”，如雷帕黴素、亞精胺、NAD+前體、GLP-1受體激動劑（司美格魯肽）等，希望用藥物部分複製飲食限制的益處。但作者強調它們與真正的飲食限制並不完全等價，未來最重要的是弄清不同限制模式的核心機制，找到更適合人類長期實施的策略。 本文僅用於科普和學術交流。"], "tags": ["衰老", "科學抗衰", "飲食限制", "長壽"], "dup": 0, "cat": "飲食", "plain": "「少吃能長壽」在動物身上證據很強，但《Nature Aging》提醒：沒那麼簡單！真正有效的可能不是單純少吃，而是「吃什麼（營養組成）＋什麼時候吃（進食節律）＋身體切換燃料」一起作用。而且長期少吃也有代價：免疫變弱、傷口癒合慢。不要只記得一句「少吃就好」。", "mind": {"c": "少吃長壽沒那麼簡單", "b": [["證據", ["CR延長動物壽命", "最有效非基因干預"]], ["機制", ["自噬", "AMPK、mTOR", "NAD+、SIRT", "FGF21、GLP-1"]], ["關鍵組合", ["營養組成", "進食節律", "代謝切換"]], ["代價", ["免疫脆弱", "傷口癒合慢", "病毒感染存活差"]], ["模擬物", ["雷帕黴素", "亞精胺", "NAD+前驅物"]]]}, "frame": [["干預", "飲食限制"], ["三要素", "吃什麼＋何時吃＋代謝切換"], ["機制", "自噬、AMPK 等通路"], ["權衡", "好處 vs 免疫代價"], ["方向", "找出適合人類的方式"]], "prod": [["亞精胺", "文中提到的飲食限制模擬物，促進自噬"], ["NMN", "NAD+ 前驅物，支持代謝與 SIRT 長壽蛋白"], ["高蛋白低卡代餐", "少吃時仍維持足夠營養，降低免疫代價"]], "gb": [["061", "NMN複方", "文中點名的飲食限制模擬物之一（NAD+ 前驅物）", "570"], ["084", "黃連素／小蘗鹼", "活化 AMPK，模擬「少吃」時的代謝訊號", "560"], ["033", "亞麻仁籽渣", "高纖飽足，幫助溫和控制熱量", "198"]]}, {"i": 60, "title": "黃黑皮美白補劑怎麼選？5種熱門成分對比", "date": "Mar 5", "body": ["很多姐妹越來越願意接受內服美白 懂外用精華治標不治本 但是市面上熱門美白飲那麼多，應該怎麼選！ 其實主要還是看成分 - 🟢5款熱門成分及用量 白番茄（300-500毫克） 海岸松（50-100毫克） 煙醯胺（10-50毫克） 餘甘子（5-50毫克） 谷胱甘肽（50-100毫克） - 我自己就一直在喝歐林蘭冰白番茄飲 喝起來就是比較健康的番茄汁的味道，0糖0脂，但是自帶了番茄的酸甜喝完以後能夠感覺到自己皮膚沒有之前那麼黃了，尤其是前段時間連續熬夜加班，第二天皮膚狀態依舊很好，感覺整個人的皮膚都變光滑了很多，現在即使不用素顏霜也可以很自信的出門。 #美白內調喝什麼 #歐林蘭冰白番茄飲 #oblue白番茄 #抗氧化 #白番茄 #黃黑皮 #熬夜黨 #美白飲 #美白 #歐林蘭 #黃皮 #女性保養 #美白內調 #美白#谷胱甘肽#煙醯胺"], "tags": [], "dup": 0, "cat": "皮膚", "plain": "很多人想「從裡面美白」，市面美白飲成分很多，主要看五種：白番茄（300～500mg）、海岸松（50～100mg）、菸鹼醯胺（10～50mg）、餘甘子（5～50mg）、穀胱甘肽（50～100mg）。它們多半是抗氧化、減少黑色素生成。作者分享喝白番茄飲後覺得膚色較不黃、熬夜後狀態也不錯（個人經驗）。", "mind": {"c": "內服美白五成分", "b": [["白番茄", ["300-500mg", "八氫/六氫茄紅素"]], ["海岸松", ["50-100mg", "抗氧化多酚"]], ["菸鹼醯胺", ["10-50mg", "減少黑色素轉移"]], ["餘甘子", ["5-50mg", "維生素C豐富"]], ["穀胱甘肽", ["50-100mg", "抑制黑色素"]]]}, "frame": [["問題", "暗沉、蠟黃"], ["原因", "氧化、黑色素累積"], ["內服", "抗氧化美白成分"], ["搭配", "防曬＋睡眠"], ["結果", "膚色較透亮"]], "prod": [["白番茄萃取飲", "無色茄紅素抗氧化，幫助膚色均勻"], ["穀胱甘肽＋維生素 C", "抑制黑色素生成、對抗自由基"], ["海岸松樹皮萃取", "強效抗氧化，保護膠原蛋白"]], "gb": [["024", "酷格美白祛斑嫩膚霜", "外用淡斑提亮，內外兼顧", "390"], ["085", "NAC複方", "提升體內穀胱甘肽——美白飲常見成分", "530"], ["072", "蝦紅素200mcg＋硒200mcg", "強效抗氧化，對抗熬夜與紫外線帶來的暗沉", "530"], ["026", "薑黃亮白磨砂膏", "溫和去角質，讓膚色更透亮", "120"]]}, {"i": 61, "title": "49萬人研究實錘：碳水和植物飲食更抗衰", "date": "Mar 4", "body": ["2025年2月，中外科學家在《Communications Medicine》期刊上釋出了一項有趣的飲食與衰老研究（Multi-dimensional evidence from the UK Biobank shows the impact of diet and macronutrient intake on aging），他們靠著英國生物銀行超49萬人的飲食、身體檢測等海量資料，搞清楚了吃什麼會影響我們變老的速度，解答了之前大家對“怎麼吃更抗衰”的疑惑，填補了此前特定研究飲食對衰老之間結論不一樣的空白。 研究團隊挨個分析了大家常吃的18類食物、6種常見飲食模式，還有碳水、蛋白質、脂肪這三大營養素的攝入情況，從端粒長度、身體實際衰老年齡、大腦灰質體積這三個關鍵維度，看飲食到底咋影響衰老，還排除了性別、體重、學歷這些等混雜因素的干擾。 結果發現，吃植物性食物的人，端粒更長、身體實際衰老年齡更小，簡單說就是老得慢；但常吃加工肉、牛羊肉、豬肉這些動物性食物，會讓衰老的相關指標變糟。最有意思的是碳水，它可不是大家想的“變老元兇”，反而能讓身體衰老年齡降低，還能讓大腦灰質體積變大——每天多吃100克碳水，大腦灰質能多2.62立方厘米，差不多能抵消1.4年的大腦衰老，這效果能趕上規律運動了。 而低脂、生酮這類飲食模式，還有單純的脂肪攝入，大多會讓衰老指標變差。另外研究還發現，現在常用的飲食健康評分，沒法反映出飲食對大腦健康的影響，而且比起少吃點，其實吃的東西營養搭配好不好，對變老的影響會更大。 不過這項研究的參與者主要是白人，結論能不能適用於所有人還需要再驗證，但它也給了我們一個簡單的抗衰飲食提示：多吃植物性食物、適量攝入碳水，比盲目戒碳水、低脂飲食更靠譜。所以：不要再迷信低碳飲食啦！"], "tags": ["科學抗衰", "碳水化合物", "衰老", "健康的飲食習慣", "健康飲食", "飲食與生活習慣", "端粒"], "dup": 0, "cat": "飲食", "plain": "英國 49 萬人研究發現：吃植物性食物的人端粒（染色體的保護帽）比較長、身體比較年輕；常吃加工肉、牛羊豬肉則老得快。最意外的是：碳水不是壞人！每天多吃 100 克碳水，大腦灰質多 2.62 立方公分，等於少老 1.4 年。反而生酮、低脂飲食會讓指標變差。重點是搭配好，不是一味少吃。", "mind": {"c": "碳水和植物更抗老", "b": [["研究", ["49萬人", "18類食物、6種飲食"]], ["三把尺", ["端粒長度", "生理年齡", "大腦灰質"]], ["好的", ["植物性食物", "適量碳水"]], ["不好的", ["加工肉、紅肉", "生酮、低脂", "單純高脂"]], ["結論", ["營養搭配比少吃重要"]]]}, "frame": [["選擇", "植物為主、適量優質碳水"], ["測量", "端粒、生理年齡、灰質"], ["結果", "老得慢、大腦較年輕"], ["避免", "生酮、加工肉"]], "prod": [["全穀雜糧米", "優質碳水＋纖維，大腦需要的能量"], ["燕麥片", "低 GI 碳水，穩定血糖"], ["地瓜 / 南瓜等原型澱粉", "天然碳水與植化素"]], "gb": [["033", "亞麻仁籽渣", "搭配優質碳水增加纖維，血糖更穩", "198"], ["070", "辣木粉", "植物性營養，支持植物為主的飲食", "450"], ["079", "憲遁草粉", "富含抗氧化維生素與多酚", "750"]]}, {"i": 62, "title": "浙大哈佛聯合研究發現DASH飲食最護腦", "date": "Mar 2", "body": ["2026年2月23日，浙江大學袁長征，聯合哈佛大學學者，在\" JAMA Neurology \"期刊上發表了一篇題為\" Dietary Patterns and Indicators of Cognitive Function \"的研究論文。 這項研究對16萬人進行了長達30年的分析，結果發現，六種健康飲食模式均可延緩認知衰退，其中DASH飲食效果最顯著，長期堅持DASH飲食與認知衰退風險降低相關。 此外，研究還發現，中年期（45-54歲）堅持DASH飲食，護腦效果最佳，對晚年認知健康的保護作用最強。 DASH飲食，是Dietary Approaches to Stop Hypertension的縮寫，它雖然最初是為控制高血壓而研發，但由於其科學、均衡的營養結構，已被公認為一種有益於全身健康的科學飲食模式。強調高攝入蔬菜、水果、全穀物、低脂乳製品，限制紅肉、加工肉類、鈉、糖、飽和脂肪的攝入。 在這項研究中，研究團隊分析了美國三項大型佇列（NHS、NHSII、HPFS）中近16萬名參與者，平均年齡為44歲，評估六種健康膳食模式與主觀認知下降和客觀認知功能的關係。 六種健康飲食模式包括：替代健康飲食（AHEI-2010）、降高血壓飲食（DASH）、健康植物性飲食（hPDI）、星球健康飲食（PHDI）、抗高胰島素血癥飲食（rEDIH）、抗炎飲食（rEDIP）。 結果發現，遵循六種健康飲食模式均能延緩大腦衰老，與認知下降風險降低相關，且呈劑量依賴性。其中，DASH飲食的護腦效果最為顯著。 這項研究是首次在同一研究人群中系統比較多種健康飲食模式對認知功能的影響，為健康飲食護腦的作用提供了強有力的證據，尤其是DASH飲食，不僅能控制血壓，更能保護認知健康，且從中年開始堅持尤為重要，而非等到老年。 綜上，堅持健康的飲食模式，尤其是DASH飲食，可顯著降低認知衰退風險，45-54歲時堅持DASH飲食，護腦效果最佳，結果為透過飲食干預維護長期認知健康、延緩大腦衰老提供了關鍵證據。"], "tags": ["衰老", "科學抗衰", "DASH", "大腦可塑性", "認知衰退", "飲食與生活習慣", "健康的飲食習慣"], "dup": 0, "cat": "大腦", "plain": "浙大和哈佛分析 16 萬人 30 年，比較六種健康飲食，發現全部都能延緩大腦老化，其中 DASH 飲食最護腦！而且 45～54 歲開始吃效果最好。DASH 原本是降血壓飲食：多吃蔬菜、水果、全穀、低脂乳製品，少吃紅肉、加工肉、鹽、糖和飽和脂肪。", "mind": {"c": "DASH 飲食最護腦", "b": [["研究", ["16萬人", "30年", "JAMA Neurology"]], ["六種飲食", ["AHEI", "DASH（最佳）", "hPDI", "PHDI", "rEDIH", "rEDIP"]], ["DASH吃法", ["多蔬果全穀", "低脂乳製品", "少紅肉鹽糖"]], ["最佳時機", ["45-54歲中年"]]]}, "frame": [["中年", "45～54 歲開始"], ["飲食", "DASH：蔬果全穀低鈉"], ["機制", "血壓穩、血管好"], ["結果", "認知衰退風險降低"]], "prod": [["低鈉鹽", "DASH 核心：減鈉、補鉀"], ["低脂無糖優格", "DASH 推薦的低脂乳製品"], ["冷凍綜合莓果", "蔬果攝取好方便，富含抗氧化花青素"]], "gb": [["043", "鹼能活（含檸檬酸鉀）", "DASH 強調高鉀低鈉，鉀幫助排鈉穩血壓", "520"], ["091", "甘氨酸鎂複方粉包", "DASH 飲食富含鎂，鎂幫助血管放鬆", "1350"], ["002", "EPA+DHA複方粉包", "支持大腦與血管健康", "1350"]]}, {"i": 63, "title": "工作日人多，這是都不上班。。。", "date": "編輯時間：Mar 6", "body": ["還是週一來的呢，想著工作日錯峰一下 看來聰明的人還是多啊 不是半路出家的，是比較專攻的那種 能翻出條件相似的case 在廣深、香港還是比較少的"], "tags": ["深圳眼袋", "廣州眼袋", "眼袋", "分享"], "dup": 0, "cat": "其他", "plain": "這篇不是研究文章，是作者分享去醫美診所處理眼袋的經驗：平日去還是很多人，覺得選擇專精、有很多相似案例的醫師比較安心。提醒：眼袋手術屬醫療行為，選擇合格專科醫師、了解風險最重要；日常可以從睡眠、少鹽、防曬和眼周保濕做起。", "mind": {"c": "眼袋處理分享", "b": [["經驗", ["平日也人多", "選專精醫師"]], ["選擇重點", ["相似案例多", "專科資格"]], ["日常保養", ["睡飽", "少鹽少水腫", "防曬", "眼周保濕"]]]}, "frame": [["困擾", "眼袋"], ["日常", "睡眠、少鹽、保濕"], ["醫療", "選合格專科醫師"], ["評估", "了解風險再決定"]], "prod": [["眼周保濕霜（含胜肽/咖啡因）", "保濕緊緻、減少浮腫感"], ["遮光眼罩", "幫助睡眠品質，減少浮腫與黑眼圈"], ["防曬乳", "防止光老化讓眼周鬆弛"]], "gb": [["088", "透明質酸鈉", "由內補水，讓眼周肌膚保濕有彈性", "530"], ["059", "AV除皺美白化妝水", "夜間抗皺保養眼周以外肌膚", "70"], ["005", "高清防霧鏡＋LED燈", "看清楚眼周細節，保養上妝更精準", "69"]]}, {"i": 64, "title": "沒人覺得化療蛋白粉是場騙局嗎", "date": "Feb 28", "body": ["我大哥化療兩年多，蛋白粉買了不下七八款，今天把踩過的坑都說清楚。 - ⚠️ 容易忽略的一個坑：蛋白質難用上，喝多少都是浪費 說真的，這一點很多人容易給忽略了。 化療期間身體不比平時，什麼肝啊腎啊本來就已經很受罪了，你再給它整蛋白這種，真是無從下手啊。所以蛋白粉不要只看蛋白含量，蛋白型別也得看啊。從容易度上看從高到低是：水解乳清蛋白 > 分離乳清蛋白 > 整蛋白，這個順序得記住。 - ❓ 化療到底有沒有必要補蛋白粉？我的答案是：要 道理很簡單，這回靠正常吃飯，大機率是撐不住營養需求的。為啥呢？ 一方面是吃不下啊，即便逼自己吃點，那點量的營養也不夠； 另一方面是身體的代謝本來就在走下坡路，吃進去且真正能被利用的少之又少。 蛋白粉相當於把營養直接\"預處理\"好送進來了，省了身體自己費這一環。 - 價效比這件事，公式很簡單： 你花的錢 ÷ 身體真正能用上的營養 = 實際價值 舉個例子：同樣的錢，A產品蛋白含量80g/100g，但全是整蛋白，用上的也就2成；B產品蛋白含量30g/100g，用的是水解乳清蛋白，可以用的是A的好幾倍。這麼一算，哪個更划算，其實一目瞭然。 - ✅ 對比幾款化療期常見蛋白粉 #化倍康營養粉 勝在蛋白質夠好，不常見的雙蛋白(水解乳清蛋白+蛋黃磷脂蛋白）。打個比方，如果整蛋白是一整塊牛肉，那水解乳清蛋白就是燉爛燉化的肉湯，可以拿過來就喝，不用費啥力了； 而蛋黃磷脂蛋白是從卵磷脂提取的，它可是蛋黃營養的精華，平時怕膽固醇不敢多碰的，這個剛好把那塊營養補進來，還給肝加個護盾，邊補邊養。這倆搭著對身體沒啥大壓力，適合化療期的人用。 . #全安素 大牌、價格親民，量也足，20多種維生素綽綽有餘。就是蛋白質有點少，適合當日常基礎。 . #基能營養粉 維生素、礦物質、碳水、脂肪、蛋白質這五個是日常需要，而基能不僅這些都有，它還加了5種菌菇，人參啥的。一袋50多種營養。我們吃飯沒準都沒它全。再加上蛋白質還是分離乳清蛋白的，身體容易用上。化療期吃不下飯、想要補營養用它正正好呢。 - 說到底，買蛋白粉不是買個心理安慰，是真正在幫身體渡過難關。錢用在哪裡，要看清楚這些門道再做決定。"], "tags": ["化療", "蛋白粉", "化療吃什麼", "身體健康"], "dup": 0, "cat": "蛋白質", "plain": "作者的大哥化療兩年多，分享蛋白粉心得：化療時吃不下、身體代謝也變差，光靠吃飯撐不住，所以需要補蛋白。但重點不只看蛋白質含量，還要看「身體用得上多少」：水解乳清＞分離乳清＞整蛋白。算一算「花的錢 ÷ 真正吸收的營養」，才知道哪個划算。", "mind": {"c": "化療蛋白粉怎麼選", "b": [["為什麼要補", ["吃不下", "代謝下降", "飲食撐不住"]], ["吸收排序", ["水解乳清", "分離乳清", "整蛋白"]], ["划算公式", ["花的錢÷真正用上的營養"]], ["其他", ["營養全面", "維生素礦物質", "菇類成分"]]]}, "frame": [["需求", "化療期營養不足"], ["選擇", "好吸收的蛋白類型"], ["計算", "實際價值＝錢÷可用營養"], ["目標", "幫身體渡過難關"]], "prod": [["水解乳清蛋白營養粉", "預先分解成小分子，腸胃負擔小、吸收快"], ["完整營養配方", "維生素、礦物質、碳水、脂肪一次補齊"], ["卵磷脂", "提供磷脂與膽鹼，支持肝臟與細胞膜"]], "gb": [["034", "胺基酸可可粉包", "胺基酸免消化，化療期吃不下也好吸收", "780"], ["081", "5R腸胃營養素", "照顧化療後脆弱的腸胃，提升吸收率", "750"], ["017", "酵母鋅＋核酸", "鋅支持味覺與免疫，幫助食慾", "550"], ["089", "巴西蘑菇", "菇類多醣支持免疫（治療期間請先問醫師）", "250"]]}, {"i": 65, "title": "復旦大學：看起來越老，痴呆風險越高", "date": "Feb 22", "body": ["這篇名為《Facial aging, cognitive impairment, and dementia risk》（面部衰老、認知障礙與痴呆風險）的核心內容，是探討面部感知年齡與未來認知功能下降及痴呆風險之間關聯的一項大規模研究，研究團隊對195,329名來自英國生物銀行（UK Biobank）、年齡≥60歲的參與者進行了平均12.3年的追蹤隨訪，主要分析自我感知的面部年齡與未來患痴呆症風險的關係。 橫斷面研究：對612名來自中國營養與健康老齡化專案（NHAPC）、年齡≥56歲的參與者，透過客觀測量的皺紋引數（如魚尾紋數量）來分析其與認知障礙的關聯。 研究發現；在長達12年的隨訪期間，記錄了5,659例新發痴呆病例。資料分析顯示，在調整了年齡、性別、教育水平、APOE ε4基因型（一種已知的痴呆症風險基因）等傳統風險因素後，自我感知面部年齡較高的人，未來患痴呆症的風險顯著增加了61% （風險比HR=1.61）； 面部皺紋與認知障礙顯著相關：在對中國人群的分析中，研究使用了客觀的皮膚測量指標。結果發現，客觀的面部衰老指標與更高的認知障礙風險有關。其中，魚尾紋數量最多（最高四分位數）的人，出現認知障礙的風險是魚尾紋數量最少（最低四分位數）的人的2.48倍（比值比OR=2.48） 研究的通訊作者之一、來自復旦大學的高翔教授指出：“面部衰老可能是認知能力下降和痴呆風險的一個指標。這項研究首次在大規模人群中系統地證實了面部衰老的視覺跡象（無論是主觀感知還是客觀皺紋）與認知衰退和痴呆風險之間存在獨立於傳統風險因素的關聯。 這意味著，在未來，醫生或許可以透過觀察一個人的面部老化程度，作為一種簡單、非侵入性的初步篩查工具，來輔助評估其認知健康狀況。"], "tags": ["衰老", "如何面對衰老", "衰老的表現", "認知衰退", "痴呆", "科學抗衰", "抗衰"], "dup": 0, "cat": "大腦", "plain": "復旦大學研究發現：「看起來比較老」的人，未來失智風險比較高！英國 19 萬多位 60 歲以上的人，覺得自己看起來比實際老的人，失智風險高 61%；中國研究也發現魚尾紋最多的人，認知障礙風險是最少的人的 2.48 倍。未來醫師也許可以「看臉」幫忙初步篩檢大腦健康。", "mind": {"c": "看起來老→失智風險高", "b": [["英國研究", ["19.5萬人", "追蹤12.3年", "臉老風險+61%"]], ["中國研究", ["612人", "魚尾紋最多OR=2.48"]], ["意義", ["臉是身體老化的窗口", "非侵入初步篩檢"]], ["行動", ["防曬護膚", "照顧全身健康"]]]}, "frame": [["外表", "臉部老化、皺紋多"], ["反映", "全身老化速度"], ["關聯", "認知下降、失智風險"], ["應用", "看臉初步篩檢"]], "prod": [["防曬乳", "減少光老化，臉老得慢"], ["膠原蛋白＋維生素 C", "支持皮膚彈性、減少細紋"], ["藻油 DHA", "從內在照顧大腦健康"]], "gb": [["072", "蝦紅素200mcg＋硒200mcg", "抗光老化，減少皺紋生成", "530"], ["088", "透明質酸鈉", "補水保濕，讓臉部看起來更年輕", "530"], ["002", "EPA+DHA複方粉包", "從內在照顧大腦健康", "1350"]]}, {"i": 66, "title": "最新：心態和生活方式越積極，大腦越抗衰", "date": "02-17", "body": ["美國佛羅里達大學和阿拉巴馬大學伯明翰分校的研究團隊，進行了一項為期兩年的跟蹤研究。他們招募了近200名中老年人，年齡在45至85歲之間，大部分人正遭受著膝關節疼痛或骨關節炎的困擾。研究用名為DeepBrainNet的機器學習模型，透過分析高解析度的大腦核磁共振影像，精準地預測一個人的“大腦年齡”。 一股是“加速老化”的力量。資料分析表明，慢性疼痛程度每加重一個級別，大腦年齡差就會增加約0.67年。也就是說，疼痛越劇烈、越廣泛，大腦看起來就越蒼老。更嚴峻的是，社會經濟環境風險的影響更大。這包括低收入、低教育水平、缺乏配偶支援、居住條件等，這類風險每增加一個級別，大腦年齡差就增加整整1年。風險最高的人群，其大腦比風險最低的人群平均“老”了約4.5歲。 另一股 “延緩衰老”的力量更為強大，那就是行為與心理保護因素。研究評估了吸菸情況、腰圍、樂觀程度、積極/消極情緒、感知壓力、社會支援和睡眠質量這七大項，根據公認標準評分，總分越高，代表保護因素越強。結果令人振奮：保護因素每提升一個級別，大腦年齡差就減少0.69年。擁有高保護因素的人群，其大腦比低保護因素人群平均 “年輕”了超過8歲！即使在排除了慢性疼痛和社會經濟風險的干擾後，保護作用依然顯著。擁有高保護因素的人群，大腦仍然比低保護因素人群年輕約2.7歲。這項研究最核心的突破在於：當把行為心理保護因素納入考慮後，慢性疼痛和社會經濟風險本身對大腦年齡的負面影響，變得不再顯著。這意味著，積極的生活方式與心態，就像一層“緩衝墊”，有效抵消了其他風險因素對大腦的衝擊。 慢性壓力是導致身體和大腦損耗的元兇，而積極的心理狀態、良好的社會支援、健康的身體和優質睡眠，就像一個高效的“壓力緩衝系統”，保護大腦的神經元和連線免受慢性磨損。樂觀和社交能減輕心理壓力，健康腰圍和良好睡眠則從生理上減少炎症和代謝負擔。研究者指出，研究中包含的每一項保護因素——從戒菸、保持健康腰圍，到培養樂觀、管理壓力、維繫社交、保證睡眠——都是可以改變和培養的。 因此，投資你的生活方式和心理健康，就是對大腦健康最明智的投資，建立並積累你的“行為心理保護資產”，可為你塑造一個更年輕、更有活力的大腦。"], "tags": ["衰老", "大腦", "積極心理學踐行", "積極的心態", "心態的力量", "大腦可塑性", "科學抗衰"], "dup": 0, "cat": "大腦", "plain": "研究用 AI 看大腦影像，算出「大腦年齡」。發現兩股力量：慢性疼痛、經濟壓力會讓大腦變老；但「保護因子」更強大——不抽菸、腰圍健康、樂觀、正向情緒、壓力小、有人支持、睡得好。保護因子高的人，大腦比低的人年輕 8 歲以上！而且這些都可以靠自己培養。", "mind": {"c": "正向心態讓大腦年輕", "b": [["加速老化", ["慢性疼痛+0.67年/級", "經濟社會風險+1年/級"]], ["七大保護因子", ["不抽菸", "健康腰圍", "樂觀", "正向情緒", "低壓力", "社會支持", "好睡眠"]], ["效果", ["高保護者大腦年輕8歲", "抵消疼痛與經濟風險"]], ["關鍵", ["每一項都可培養"]]]}, "frame": [["壓力源", "疼痛、經濟壓力"], ["緩衝", "心態＋生活方式保護因子"], ["機制", "減少慢性壓力與發炎"], ["結果", "大腦年齡更年輕"]], "prod": [["GABA / 茶氨酸", "幫助放鬆、降低壓力感"], ["助眠眼罩與香氛", "提升睡眠品質這項保護因子"], ["感恩日記本", "每天寫三件好事，培養樂觀與正向情緒"]], "gb": [["054", "GABA", "降低壓力與緊繃感，培養放鬆心態", "540"], ["062", "酶菌醣體（含茶胺酸）", "茶胺酸放鬆不睏，益生菌照顧腸腦情緒", "720"], ["047", "刺五加", "傳統適應原草本，幫助身體面對壓力", "495"]]}, {"i": 67, "title": "nature最新：人類長壽的真正奧秘", "date": "Feb 15", "body": ["最新研究The pursuit of understanding human longevity顯示：超高年齡與健康狀況不佳並非天生相關。長壽源於多方面的身體復原力，包括保護性基因、高效代謝、較低的炎症水平，以及良好的生活方式。對百歲老人和 “藍色地帶” 的研究表明，健康衰老的本質，是生物因素、環境因素與上述各項因素的協同作用。 Santos‑Pujol 及其團隊開展了一項開創性研究，對一位經認證的全球最長壽老人進行了全面的多組學分析。這位老人從 2023 年 1 月 17 日至 2024 年 8 月 19 日去世，享年117 歲 168 天。 有趣的是，研究結果表明：超高齡與健康差並沒有內在聯絡；壽命最長的人，往往也是最健康的人。這種顯著的 “脫鉤” 現象說明，長壽的關鍵不是完全避免衰老，而是保持對老年相關疾病的強大抵抗力，也就是活得長久，並且一直健康到生命終點。 全球有一些被稱為“藍色地帶” 的長壽地區，包括日本沖繩、希臘伊卡里亞、義大利撒丁島、哥斯大黎加尼科亞、美國洛馬林達等地。這些地區人群的共同特點是：以植物性飲食為主、日常規律活動、緊密的家庭與社會聯結、有效的壓力管理。儘管具體飲食各不相同，但總體都強調天然、未加工、本地出產的食物。 人群流行病學研究從群體層面提供證據：保持健康體重、重視食物質量而非數量、堅持健康飲食模式，對長壽至關重要。地中海飲食、北歐飲食、沖繩飲食、DASH 飲食、健康植物性飲食等，都與降低死亡率、實現健康衰老顯著相關。這類飲食模式通常富含水果、蔬菜、全穀物、堅果、豆類和優質蛋白，同時限制紅肉、加工肉、反式脂肪、鈉和含糖飲料。生活方式方面，不吸菸、不過量飲酒，也能顯著降低慢性病風險。 研究也承認，僅從一位百歲老人得出普遍性結論存在侷限。該研究指出了延緩衰老、的多種干預靶點，包括飲食、運動、代謝調節，以及可能保護端粒或調控表觀遺傳的藥物。 與此同時，全球 “藍色地帶” 的超長壽命現象，也並非由單一因素造成，而是環境、生活方式以及可能的遺傳因素共同作用的結果。研究顯示，百歲老人並不進行高強度鍛鍊，而是將活動融入日常生活，如走路、園藝、傳統體力勞動等。這種持續、低強度的活動有助於心血管健康、維持肌肉量和代謝功能。規律運動對心血管功能和心理健康都有諸多益處。"], "tags": ["衰老", "長壽", "科學抗衰"], "dup": 0, "cat": "長壽", "plain": "科學家研究一位活到 117 歲的老奶奶，發現：活很老不一定就很病！最長壽的人往往也是最健康的。長壽的秘密是多方面的「抵抗力」：好基因、代謝好、發炎少，加上好的生活方式。「藍色寶地」（沖繩等長壽地區）的共同點：吃植物為主、天天活動、家人朋友關係好、會管理壓力。", "mind": {"c": "人類長壽的奧秘", "b": [["117歲研究", ["多組學分析", "超高齡≠不健康"]], ["身體抵抗力", ["保護性基因", "高效代謝", "低發炎"]], ["藍色寶地", ["植物為主", "日常活動", "緊密人際", "管理壓力"]], ["飲食模式", ["地中海", "沖繩", "DASH", "北歐"]], ["運動", ["低強度融入生活", "走路、園藝"]]]}, "frame": [["基礎", "基因＋代謝＋低發炎"], ["生活", "植物飲食、日常活動"], ["連結", "家庭社交、壓力管理"], ["結果", "活得久又健康"]], "prod": [["綜合堅果＋豆類", "藍色寶地飲食的植物蛋白主角"], ["園藝工具組 / 健走鞋", "把低強度活動融入生活"], ["紫蘇籽油", "植物好油，幫助維持低發炎狀態"]], "gb": [["070", "辣木粉", "藍色寶地精神：天然、植物性的營養補給", "450"], ["097", "亞麻仁油（500cc×2瓶）", "植物好油，幫助維持低發炎", "780"], ["061", "NMN複方", "支持代謝與細胞修復", "570"]]}, {"i": 68, "title": "腸道菌群與衰老緊密相關，但臨床如何突破？", "date": "Feb 1", "body": ["衰老過程中，腸道微生物組出現多樣性下降、產短鏈脂肪酸菌減少、致病菌富集等特徵。這種失調透過破壞腸道屏障、誘發系統性低度炎症（inflammaging）及擾亂代謝物穩態，廣泛參與感染、神經退行性疾病、腫瘤、心血管疾病等十餘類衰老相關疾病的病理程序。 傳統研究技術（如16S rRNA測序）解析度有限，難以精準解析微生物功能；臨床轉化成功率低，除糞菌移植外尚無獲批療法。此外，種族、飲食等混雜因素導致研究結果異質性顯著，制約精準醫學應用。 技術驅動的變革方向： 功能多組學：整合宏基因組、宏轉錄組、代謝組等多組學資料，深度解析微生物功能與宿主互作機制。 人工智慧與機器學習：透過演算法識別微生物群落模式，預測疾病風險與干預效果。 合成生物學：利用CRISPR編輯、基因迴路等工具，驗證特定菌株或代謝物的因果作用，開發工程菌療法。 自體糞菌移植（FMT）：提出在成年早期儲存個體健康微生物組，老年期回輸以“重置”腸道微生態，規避異體FMT風險。 未來研究框架（PRIME框架） 提出從微生物特徵剖析到臨床驗證的五階段閉環路徑： P（Profiling）：多組學描繪衰老微生物圖譜。 R（Review）：機制關聯與假設生成。 I（Identifying）：因果菌/代謝物識別。 M（Mapping）：臨床轉化與干預設計。 E（Evaluating）：臨床驗證與安全性評估。 該文獻系統闡述了腸道微生物組在衰老相關疾病中的核心作用，指出技術革新是突破當前研究瓶頸的關鍵，並提出了從基礎研究到臨床應用的系統性框架，為未來抗衰老研究與干預提供了方向。"], "tags": ["衰老", "腸道菌群", "益生菌", "科學抗衰", "腸道菌群與衰老的關係"], "dup": 0, "cat": "腸道", "plain": "老了以後，腸道菌變得不多樣、好菌少、壞菌多，會讓腸壁破洞、全身發炎，跟十幾種老年病有關。但現在研究遇到瓶頸：工具不夠精準、除了糞菌移植還沒有核准的療法。未來方向：多組學、AI、合成生物學，甚至年輕時把自己健康的腸道菌存起來，老了再放回去！", "mind": {"c": "腸道菌與衰老", "b": [["老化特徵", ["多樣性下降", "產短鏈脂肪酸菌減少", "壞菌增加"]], ["瓶頸", ["技術解析度低", "臨床轉化難", "個體差異大"]], ["新方向", ["功能多組學", "AI預測", "合成生物學", "自體糞菌移植"]], ["PRIME框架", ["描繪", "審視", "找因果", "轉化", "評估"]]]}, "frame": [["P 描繪", "多組學畫出菌群圖譜"], ["R 審視", "建立機制假設"], ["I 找因果", "找出關鍵菌與代謝物"], ["M 轉化", "設計干預"], ["E 評估", "臨床驗證安全性"]], "prod": [["多菌株益生菌", "增加好菌種類，提升菌群多樣性"], ["益生元纖維", "餵養產短鏈脂肪酸的好菌"], ["發酵食品（味噌、優格）", "天然的多樣菌來源"]], "gb": [["096", "孢子益生菌（加亞麻仁渣）", "提升好菌與菌群多樣性", "650"], ["046", "丁酸鈉複合包", "補回老化時減少的短鏈脂肪酸", "890"], ["058", "腸寶", "腸道保養（成分以產品標示為準）", "485"]]}, {"i": 69, "title": "臨床證實雷帕黴素可修復DNA修復延緩衰老", "date": "編輯時間：Mar 11", "body": ["2026年1月12日，英國牛津大學研究團隊在\" Aging Cell \"期刊上發表了一篇題為\" Rapamycin Exerts Its Geroprotective Effects in the Ageing Human Immune System by Enhancing Resilience Against DNA Damage \"的研究論文。 研究顯示，低劑量的雷帕黴素能直接降低免疫細胞DNA損傷負荷，提高細胞存活，並減少細胞衰老標誌物的表達，延緩人類免疫系統衰老。 透過人體臨床試驗證實，每日1毫克雷帕黴素，僅4個月，顯著降低了免疫細胞中的DNA損傷標誌物，表明其能有效延緩免疫細胞衰老。 DNA損傷是免疫衰老的關鍵驅動因素之一。隨著年齡增長，免疫細胞中的DNA損傷積累增加，導致細胞功能障礙和細胞衰老，減少DNA損傷和細胞衰老是延緩免疫衰老的重要策略。 研究發現，低劑量雷帕黴素能直接增強基因組穩定性，在暴露於急性基因毒性應激的人類T細胞中，其能顯著降低DNA損傷負荷，並增強細胞對DNA損傷的修復能力，從而提高細胞存活率，以及顯著抑制了細胞衰老標誌物的表達。 為期4個月的臨床試驗，讓老年參與者每天口服1毫克雷帕黴素，結果顯示，與安慰劑組相比，雷帕黴素組免疫細胞中DNA損傷誘導衰老的關鍵標誌物顯著降低，同時部分免疫耗竭標誌物也呈現下降趨勢，表明雷帕黴素能夠有效延緩人類免疫系統衰老。 本文僅用於科普和學術交流，不作為任何治療建議。"], "tags": ["衰老", "雷帕黴素", "DNA修復", "科學抗衰"], "dup": 0, "cat": "衰老機制", "plain": "免疫細胞的 DNA 會隨年齡累積損傷，讓免疫系統變老。牛津大學讓老人每天吃 1 毫克低劑量雷帕黴素，4 個月後免疫細胞的 DNA 損傷標記明顯下降，細胞更能修復損傷、存活更好。提醒：雷帕黴素是處方藥，必須由醫師評估，不能自己買來吃。", "mind": {"c": "雷帕黴素修護 DNA", "b": [["問題", ["DNA損傷累積", "免疫細胞老化"]], ["研究", ["每日1mg", "4個月", "人體試驗"]], ["效果", ["DNA損傷標記下降", "修復能力增強", "衰老標記減少"]], ["提醒", ["處方藥", "需醫師評估"]]]}, "frame": [["老化", "免疫細胞 DNA 損傷"], ["結果", "細胞衰老、免疫變弱"], ["介入", "低劑量雷帕黴素（醫囑）"], ["效果", "損傷降低、免疫延緩老化"]], "prod": [["亞精胺", "天然自噬促進物，和雷帕黴素同樣作用在 mTOR 相關路徑（非藥品）"], ["維生素 D3", "支持免疫細胞正常功能"], ["NMN", "NAD+ 是 DNA 修復酵素需要的燃料"]], "gb": [["061", "NMN複方", "NAD+ 是 DNA 修復酵素（PARP）需要的燃料", "570"], ["085", "NAC複方", "抗氧化，減少 DNA 氧化損傷", "530"], ["092", "D3（5000IU）", "支持免疫細胞正常功能（雷帕黴素是處方藥，不可自行使用）", "580"]]}, {"i": 70, "title": "維生素C有助卵巢抗衰老", "date": "Jan 28", "body": ["Vitamin C conveys geroprotection on primate ovaries，由人類腦保護高階創新中心，國家老年病臨床研究中心，衰老轉化醫學中心，北京市老年醫學研究中心，北京市環境與衰老重點實驗室，首都醫科大學宣武醫院聯合發表。 本研究透過為期3.3年（相當於約10個人類年）的縱向干預實驗，系統評估了口服維生素C（VC）對非人靈長類動物（食蟹猴）卵巢衰老的保護作用。研究結合組織病理學表型分析、單細胞轉錄組學技術、分子時鐘模型及體外細胞實驗，證實VC可透過啟用NRF2抗氧化通路，顯著延緩靈長類卵巢衰老程序，為開發針對人類卵巢衰老的營養干預策略提供了關鍵臨床前證據。 本研究歷時3.3年的猴類研究表明，口服維生素C具有對抗卵巢衰老的抗衰保護作用。維生素C能降低關鍵衰老生物標誌物水平，包括氧化應激和卵泡耗竭。透過單細胞轉錄組學時鐘分析，發現維生素C可使卵母細胞生物學年齡減緩1.35年，體細胞生物學年齡減緩5.66年。 該研究透過多尺度整合證據鏈，證實口服維生素C可作為一種可轉化的營養干預策略，透過啟用NRF2依賴的抗氧化程式，顯著減緩靈長類卵巢細胞衰老，為延緩女性生殖衰老及相關退行性疾病提供了重要科學依據。"], "tags": ["維生素c", "營養素", "抗氧化防衰老", "科學抗衰", "卵巢", "卵巢衰老", "卵巢早衰", "衰老", "維生素C有助卵巢抗衰"], "dup": 0, "cat": "女性", "plain": "卵巢是女性身體裡最早變老的器官之一。中國團隊讓猴子吃維生素 C 長達 3.3 年（相當於人類 10 年），發現卵巢老得比較慢：卵子的生物年齡慢了 1.35 年，周圍細胞慢了 5.66 年！原因是維生素 C 啟動了身體的抗氧化開關「NRF2」，減少氧化傷害和卵泡流失。", "mind": {"c": "維生素C護卵巢", "b": [["研究", ["食蟹猴3.3年", "約人類10年"]], ["效果", ["卵子年齡慢1.35年", "體細胞慢5.66年", "卵泡流失減少"]], ["機制", ["啟動NRF2", "抗氧化程序"]], ["意義", ["營養延緩生殖老化"]]]}, "frame": [["老化", "卵巢氧化壓力上升"], ["流失", "卵泡耗竭"], ["介入", "口服維生素 C"], ["機制", "啟動 NRF2 抗氧化"], ["結果", "卵巢老化減慢"]], "prod": [["維生素 C", "啟動 NRF2 抗氧化路徑，保護卵巢細胞"], ["芭樂 / 奇異果", "天然維生素 C 含量高的水果"], ["輔酶 Q10", "支持卵子粒線體能量，抗氧化"]], "gb": [["072", "蝦紅素200mcg＋硒200mcg", "蝦紅素抗氧化＋硒參與抗氧化酵素，保護卵巢細胞", "530"], ["060", "Q10（10:1）", "支持卵子粒線體能量，抗氧化", "580"], ["079", "憲遁草粉", "富含天然維生素 C 與 E", "750"]]}, {"i": 71, "title": "維生素C有助卵巢抗衰老", "date": "1月28日", "body": ["Vitamin C conveys geroprotection on primate ovaries，由人類腦保護高階創新中心，國家老年病臨床研究中心，衰老轉化醫學中心，北京市老年醫學研究中心，北京市環境與衰老重點實驗室，首都醫科大學宣武醫院聯合發表。", "本研究透過為期3.3年（相當於約10個人類年）的縱向干預實驗，系統評估了口服維生素C（VC）對非人靈長類動物（食蟹猴）卵巢衰老的保護作用。研究結合組織病理學表型分析、單細胞轉錄組學技術、分子時鐘模型及體外細胞實驗，證實VC可透過啟用NRF2抗氧化通路，顯著延緩靈長類卵巢衰老程序，為開發針對人類卵巢衰老的營養干預策略提供了關鍵臨床前證據。", "本研究歷時3.3年的猴類研究表明，口服維生素C具有對抗卵巢衰老的抗衰保護作用。維生素C能降低關鍵衰老生物標誌物水平，包括氧化應激和卵泡耗竭。透過單細胞轉錄組學時鐘分析，發現維生素C可使卵母細胞生物學年齡減緩1.35年，體細胞生物學年齡減緩5.66年。", "該研究透過多尺度整合證據鏈，證實口服維生素C可作為一種可轉化的營養干預策略，透過啟用NRF2依賴的抗氧化程式，顯著減緩靈長類卵巢細胞衰老，為延緩女性生殖衰老及相關退行性疾病提供了重要科學依據。"], "tags": ["維生素c", "營養素", "抗氧化防衰老", "科學抗衰", "卵巢", "卵巢衰老", "卵巢早衰", "衰老", "維生素C有助卵巢抗衰"], "dup": 70, "cat": "女性", "plain": "卵巢是女性身體裡最早變老的器官之一。中國團隊讓猴子吃維生素 C 長達 3.3 年（相當於人類 10 年），發現卵巢老得比較慢：卵子的生物年齡慢了 1.35 年，周圍細胞慢了 5.66 年！原因是維生素 C 啟動了身體的抗氧化開關「NRF2」，減少氧化傷害和卵泡流失。", "mind": {"c": "維生素C護卵巢", "b": [["研究", ["食蟹猴3.3年", "約人類10年"]], ["效果", ["卵子年齡慢1.35年", "體細胞慢5.66年", "卵泡流失減少"]], ["機制", ["啟動NRF2", "抗氧化程序"]], ["意義", ["營養延緩生殖老化"]]]}, "frame": [["老化", "卵巢氧化壓力上升"], ["流失", "卵泡耗竭"], ["介入", "口服維生素 C"], ["機制", "啟動 NRF2 抗氧化"], ["結果", "卵巢老化減慢"]], "prod": [["維生素 C", "啟動 NRF2 抗氧化路徑，保護卵巢細胞"], ["芭樂 / 奇異果", "天然維生素 C 含量高的水果"], ["輔酶 Q10", "支持卵子粒線體能量，抗氧化"]], "gb": [["072", "蝦紅素200mcg＋硒200mcg", "蝦紅素抗氧化＋硒參與抗氧化酵素，保護卵巢細胞", "530"], ["060", "Q10（10:1）", "支持卵子粒線體能量，抗氧化", "580"], ["079", "憲遁草粉", "富含天然維生素 C 與 E", "750"]]}, {"i": 72, "title": "腸道菌群失調加速皮膚細胞衰老", "date": "Jan 22", "body": ["腸道菌群不僅是消化系統的“助手”，更是皮膚健康的“幕後操盤手”。它透過一個被稱為“腸-皮軸”（Gut-Skin Axis）的複雜網路，直接調控皮膚的衰老程序和外觀.腸道和皮膚之間存在一個雙向通訊通道。 腸道菌群透過代謝產物、免疫調節和神經內分泌訊號，向皮膚髮送指令; 補充特定的益生菌（如長雙歧桿菌、羅伊氏乳桿菌）或攝入富含益生元的食物（高纖維飲食），可以恢復菌群平衡，從而改善皮膚屏障，增加皮膚水分，減少皺紋; 如果你試圖透過護膚品從外部抗衰老，但忽視了腸道內部的炎症和菌群失衡，效果往往會大打折扣。透過“以內養外”，修復腸道屏障、抑制炎症，才是延緩皮膚衰老的根本途徑之一。"], "tags": ["皮膚衰老", "腸道菌群", "益生菌", "炎症", "菌群失衡", "衰老", "腸道屏障"], "dup": 0, "cat": "皮膚", "plain": "腸道和皮膚之間有一條「腸—皮軸」，像一條電話線。腸道菌會透過代謝物、免疫和荷爾蒙訊號指揮皮膚。腸道菌失衡、發炎，皮膚就容易老、乾、長皺紋。補充特定益生菌或多吃高纖食物，可以改善皮膚屏障和水分。只擦保養品不顧腸道，效果會打折。", "mind": {"c": "腸—皮軸", "b": [["溝通方式", ["代謝產物", "免疫調節", "神經內分泌"]], ["失衡後果", ["發炎", "皮膚老化", "乾燥皺紋"]], ["改善", ["長雙歧桿菌", "羅伊氏乳桿菌", "高纖飲食"]], ["觀念", ["以內養外"]]]}, "frame": [["腸道", "菌群失衡、發炎"], ["傳遞", "腸—皮軸訊號"], ["皮膚", "屏障變差、老化"], ["介入", "益生菌＋高纖"], ["結果", "皮膚水潤、皺紋減少"]], "prod": [["皮膚專用益生菌（長雙歧桿菌等）", "調整腸道菌，透過腸皮軸改善皮膚屏障"], ["膳食纖維 / 益生元", "餵養好菌、減少發炎"], ["膠原蛋白胜肽", "提供皮膚合成膠原的原料"]], "gb": [["096", "孢子益生菌（加亞麻仁渣）", "調整腸道菌，透過腸—皮軸改善皮膚", "650"], ["088", "透明質酸鈉", "由內補水，改善皮膚乾燥", "530"], ["058", "腸寶", "腸道保養（成分以產品標示為準），以內養外", "485"]]}, {"i": 73, "title": "輔酶Q10是智商稅嗎？梅奧診所觀點", "date": "Jan 19", "body": ["輔酶Q10是一種人體自然合成的抗氧化劑，亦稱CoQ10。抗氧化劑可幫助機體抵禦細胞損傷。細胞利用CoQ10進行生長及能量生成。 隨著年齡增長，人體內的輔酶Q10（CoQ10）水平會逐漸降低。 肉類、魚類和堅果含有輔酶Q10（CoQ10）。這些食物中所含CoQ10的量通常不足以顯著提升人體CoQ10水平。 輔酶Q10特定病症及活動中的應用研究顯示： • 心臟疾病。輔酶Q10（CoQ10）可能改善充血性心力衰竭症狀。儘管研究結果不一，CoQ10或有助於降低血壓。部分研究還表明，當與其他營養素聯合使用時，CoQ10可能促進患者從冠狀動脈旁路移植術及心臟瓣膜手術中恢復。 • 糖尿病。部分研究表明，輔酶Q10（CoQ10）可能有助於降低糖尿病患者的膽固醇水平，該效應或可降低其心臟病風險。 • 帕金森病。即使服用高劑量輔酶Q10（CoQ10）似乎也無助於改善帕金森病症狀。 • 他汀類藥物誘發的肌病。部分研究表明，輔酶Q10（CoQ10）可能有助於緩解服用他汀類藥物時可能出現的肌無力和疼痛症狀。但尚無充分證據支援這一結論。 • 偏頭痛。部分研究表明，輔酶Q10（CoQ10）可能降低偏頭痛發作頻率或縮短其持續時間。偏頭痛患者通常需連續服用該補充劑三個月後方可觀察到療效。 • 生理功能表現。由於輔酶Q10（CoQ10）有助於機體能量生成，因此認為該補充劑可能改善機體運動表現。但該領域的研究尚未得出明確結論。 • 代謝功能障礙相關脂肪肝病，亦稱 MASLD 。一項小型研究發現，與未服用輔酶Q10（CoQ10）的人群相比，服用輔酶Q10的人群肝臟脂肪含量降低。仍需更多研究。 一般安全： 輔酶Q10補充劑可能有助於治療充血性心力衰竭等疾病及預防偏頭痛。多數醫療專業人員認為CoQ10安全性良好且副作用較少。但在服用該補充劑前，請諮詢您的醫療專業人員。按指示服用時，其不良反應發生率較低。 輕度不良反應可能包括胃部問題，例如： • 上腹痛 • 食慾減退 • 噁心 • 腹瀉 其他可能的不良反應包括： • 頭暈 • 睡眠障礙 • 疲勞 • 頭痛 • 魯莽的 • 易激惹 #輔酶Q10 #心臟 #Co Q10"], "tags": ["輔酶Q10是智商稅嗎", "輔酶q10推薦", "科學抗衰", "精準營養", "抗衰補劑"], "dup": 0, "cat": "補充劑", "plain": "輔酶 Q10 是身體自己會做的抗氧化物，也是細胞發電需要的零件，但年紀越大越少，食物裡的量又不太夠。梅奧診所整理：對心臟衰竭、偏頭痛可能有幫助；降血壓、他汀類藥物肌肉痠痛、脂肪肝還需要更多研究；對帕金森氏症沒幫助。整體很安全，少數人會胃不舒服。", "mind": {"c": "輔酶Q10是智商稅？", "b": [["是什麼", ["天然抗氧化", "細胞產能零件", "隨年齡下降"]], ["可能有幫助", ["心臟衰竭", "偏頭痛（需3個月）", "糖尿病膽固醇"]], ["證據不足", ["降血壓", "他汀肌肉痛", "運動表現", "脂肪肝"]], ["無效", ["帕金森氏症"]], ["安全", ["整體安全", "偶有腸胃不適"]]]}, "frame": [["老化", "CoQ10 自然下降"], ["功能", "產能＋抗氧化"], ["適合", "心衰、偏頭痛"], ["注意", "先諮詢醫療人員"]], "prod": [["還原型輔酶 Q10（Ubiquinol）", "吸收較好，支持心臟與細胞能量"], ["Q10＋魚油複方", "一起支持心血管健康"], ["Q10＋B 群", "細胞產能的全套輔酶"]], "gb": [["060", "Q10（10:1）", "支持心臟能量與抗氧化，偏頭痛者需連續約 3 個月", "580"], ["098", "粒線寶", "粒線體保養，可與 Q10 搭配（成分以產品標示為準）", "550"], ["002", "EPA+DHA複方粉包", "與 Q10 一起照顧心血管", "1350"]]}, {"i": 74, "title": "高維生素D水平，死亡風險能降低40%", "date": "Jan 18", "body": ["一項發表於《BMC Nutrition》對美國19278名20歲以上成年人進行長期追蹤後發現：維生素D及其代謝物水平與腸道微生物群飲食指數（DI-GM）均與全因死亡風險呈顯著負相關，且腸道菌群相關飲食模式在其中發揮了部分中介作用。這一發現為透過營養干預改善健康結局提供了全新科學依據。 該研究資料來源於2005-2018年美國國家健康與營養檢查調查（NHANES），並透過國家死亡指數（NDI）追蹤至2019年12月31日的死亡結局，形成了中位隨訪約7年的佇列資料。研究排除了年齡＜20歲、關鍵資料缺失及維生素D水平異常的受試者後，最終納入19278名合格參與者。 研究顯示，血清中維生素D及其代謝物（如25-羥基維生素D3、3-表-25-羥基維生素D3、總維生素D）水平越高，全因死亡風險越低。例如，25-羥基維生素D3最高四分位數人群的全因死亡風險比最低四分位數降低40%（HR=0.60，95%CI: 0.53-0.68），總維生素D最高四分位數人群風險降低43%（HR=0.57，95%CI: 0.49-0.65）。這種保護作用在調整年齡、性別、種族、吸菸、飲酒、高血壓、糖尿病、癌症病史等多種混雜因素後依然顯著，且未發現非線性關聯，表明充足的維生素D水平具有持續的健康益處。 同時，腸道微生物群飲食指數（DI-GM）與全因死亡風險負相關 DI-GM評分越高，全因死亡風險越低。每增加1分DI-GM評分，全因死亡風險降低20%（HR=0.80，95%CI: 0.71-0.91）。DI-GM評分反映飲食對腸道菌群的影響，得分越高代表腸道菌群健康狀況越優。研究顯示，DI-GM最高四分位數人群的維生素D水平顯著高於最低四分位數，且肥胖、糖尿病、高血壓患病率更低，提示健康的腸道菌群相關飲食模式與維生素D狀態存在協同作用。 中介分析表明，DI-GM在維生素D與全因死亡的關聯中發揮了部分中介作用，但中介效應占比不足10%。 該前瞻性佇列研究表明，較高的維生素D水平（尤其是生物活性形式）和更健康的、能促進有益菌群的飲食模式，各自都能降低全因死亡風險。更重要的是，當這兩個因素同時具備時，它們會產生協同增效作用，為個體提供最強的生存保護。 這倡導了一種綜合性的健康促進策略，即同時最佳化維生素D狀態和腸道菌群健康。"], "tags": ["維生素D", "營養素補充", "抗衰", "衰老"], "dup": 0, "cat": "補充劑", "plain": "美國近 2 萬人研究發現：血液中維生素 D 越高的人，死亡風險越低，最高組比最低組少 40%！另外，吃得對腸道菌好的人（高纖、發酵食物），死亡風險也比較低，飲食分數每加 1 分，風險少 20%。兩個一起做到，保護力最強。", "mind": {"c": "維生素D與長壽", "b": [["研究", ["19278人", "追蹤約7年"]], ["維生素D", ["最高組死亡-40%", "總維D最高-43%"]], ["腸道飲食指數", ["每+1分死亡-20%"]], ["協同", ["維D＋好菌飲食", "保護力最強"]]]}, "frame": [["維生素 D", "充足的血中濃度"], ["腸道", "好菌友善飲食"], ["協同", "兩者加乘"], ["結果", "全因死亡風險下降"]], "prod": [["維生素 D3", "補足血中維生素 D，支持骨骼、免疫"], ["益生菌＋益生元", "提升腸道菌友善程度"], ["高纖穀物早餐", "每天多一點纖維，餵養好菌"]], "gb": [["092", "D3（5000IU）", "快速拉高血中維生素 D（建議先驗血、依醫囑劑量）", "580"], ["094", "D3（2000IU＋A＋E）", "日常維持量，長期補充", "580"], ["096", "孢子益生菌（加亞麻仁渣）", "提升腸道菌友善程度，與維生素 D 協同", "650"]]}, {"i": 75, "title": "補充維D和Omega-3可延緩衰老", "date": "編輯時間：Jan 18", "body": ["端粒（telomere）是真核細胞線性染色體的末端結構，在細胞複製過程中發揮保護作用，避免 DNA 受到損傷，並且像帽子一樣有效防止染色體間末端降解、重組、融合及染色體退化。", "端粒長度隨細胞分裂逐漸縮短，與衰老及慢性疾病風險相關。維生素D和ω-3脂肪酸被認為可能影響細胞衰老過程。", "2025 年 5 月 21 日，奧古斯塔大學朱海東團隊在 American Journal of Clinical Nutrition 期刊發表了題為：Vitamin D3 and marine ω-3 fatty acids supplementation and leukocyte telomere length: 4-year findings from the VITamin D and OmegA-3 TriaL (VITAL) randomized controlled trial 的研究論文。", "論文介紹了一項隨機、雙盲、安慰劑對照試驗，對維生素 D3（每天 2000 UI）和 Omega-3脂肪酸（每天 1 克）的補充進行了研究，追蹤了 25871 名美國 55 歲及以上的女性和 50 歲及以上的男性長達五年時間。其中，VITAL 端粒子研究包括了 1054 名參與者，對他們的白細胞中的端粒長度在基線、第二年和第四年進行了評估。", "研究結果：", "維生素D3補充：與安慰劑組相比，補充維生素D3組在4年內LTL損耗顯著減少（減少0.14 kb，95% CI: 0.007, 0.27；P=0.039），總體趨勢分析顯示每年LTL比安慰劑組高約0.035 kb（P=0.037），相當於延緩細胞衰老約3年。", "ω-3脂肪酸補充：在第2年或第4年，ω-3脂肪酸補充組與安慰劑組相比，LTL變化無顯著差異（P>0.05）。", "研究認為：", "每日補充2000 IU維生素D3可能透過減少端粒損耗，發揮對抗細胞衰老的作用，而ω-3脂肪酸補充在本研究中未顯示對端粒長度的顯著影響。研究提示維生素D3可能透過啟用端粒酶、抗炎和抗氧化等機制保護端粒，達到抗衰老效果。"], "tags": ["維生素D", "營養素補充", "端粒", "端粒與衰老", "衰老", "科學抗衰", "omega3", "維生素"], "dup": 0, "cat": "補充劑", "plain": "端粒就像鞋帶頭的塑膠套，保護染色體不散開，細胞每分裂一次就變短一點，越短代表越老。大型 VITAL 試驗讓 1000 多人吃維生素 D3（每天 2000 IU）或 Omega-3，4 年後發現：吃維生素 D3 的人端粒縮短得比較少，大約等於細胞老化慢 3 年；Omega-3 則沒有明顯差別。", "mind": {"c": "維D3護端粒", "b": [["端粒", ["染色體保護帽", "越短越老"]], ["VITAL試驗", ["2.5萬人", "端粒子研究1054人", "4年"]], ["結果", ["維D3 2000IU端粒損耗少", "≈慢3年", "Omega-3無顯著"]], ["可能機制", ["活化端粒酶", "抗發炎", "抗氧化"]]]}, "frame": [["老化", "端粒逐漸縮短"], ["介入", "每天維生素 D3 2000 IU"], ["機制", "抗發炎、活化端粒酶"], ["結果", "端粒損耗減少≈慢 3 年"]], "prod": [["維生素 D3 2000 IU", "研究劑量，幫助減少端粒損耗"], ["D3＋K2", "D3 搭 K2，讓鈣代謝更平衡"], ["曬太陽散步", "天然維生素 D 來源，加上運動"]], "gb": [["094", "D3（2000IU＋A＋E）", "每顆 2000IU，正好是研究使用的劑量，幫助減少端粒損耗", "580"], ["092", "D3（5000IU）", "缺乏者的加強選擇", "580"], ["072", "蝦紅素200mcg＋硒200mcg", "抗氧化，保護端粒免於氧化傷害", "530"]]}, {"i": 76, "title": "輔酶Q10在心血管疾病領域意義重大", "date": "Jan 12", "body": ["輔酶Q10（CoQ10）是粒線體能量代謝的關鍵成分，參與三磷酸腺苷（ATP）生成，對心臟等高能量需求器官至關重要。同時，它具有抗氧化作用，能減少氧化應激損傷，穩定心肌細胞功能。", "這篇發表於 《美國心臟病學會雜誌》（JACC） 的權威綜述《Coenzyme Q10 for Patients With Cardiovascular Disease: JACC Focus Seminar》的核心觀點非常明確且審慎：輔酶Q10在部分心血管疾病（尤其是心力衰竭）中顯示出有前景的輔助治療價值。", "輔酶Q10不僅是粒線體能量生產的關鍵成分，還具有顯著的抗氧化作用，能夠保護細胞免受氧化損傷。文章深入討論了輔酶Q10的生理作用，特別是在心血管疾病、神經退行性疾病等領域的應用潛力。", "多項臨床研究和薈萃分析表明，補充輔酶Q10可改善心力衰竭患者的射血分數、心功能分級（如NYHA分級），降低病死率，並提高運動耐量（如6分鐘步行距離）。尤其對射血分數保留或輕中度心衰患者效果更顯著。", "多項臨床研究和薈萃分析表明，補充輔酶Q10可改善心力衰竭患者的射血分數、心功能分級（如NYHA分級），降低病死率，並提高運動耐量（如6分鐘步行距離）。尤其對射血分數保留或輕中度心衰患者效果更顯著。"], "tags": ["輔酶Q10", "生物醫學科研", "心血管系統", "保護心腦血管", "預防心腦血管", "心臟"], "dup": 0, "cat": "心血管", "plain": "心臟是全身最耗電的器官，輔酶 Q10 是細胞發電（產生 ATP）的關鍵零件，也能抗氧化。美國心臟學會期刊的綜述說：補充輔酶 Q10 可以改善心臟衰竭患者的心臟功能、運動能力（6 分鐘走路距離），甚至降低死亡率，尤其是輕中度心衰的人。但它是輔助，不能取代治療。", "mind": {"c": "Q10 與心血管", "b": [["功能", ["粒線體產生ATP", "抗氧化"]], ["心衰效果", ["射血分數改善", "NYHA分級改善", "死亡率下降", "6分鐘步行增加"]], ["最適合", ["輕中度心衰", "射血分數保留型"]], ["提醒", ["輔助治療", "遵醫囑"]]]}, "frame": [["心臟", "高耗能器官"], ["問題", "Q10 不足、能量差"], ["補充", "輔酶 Q10"], ["結果", "心功能與運動能力改善"]], "prod": [["輔酶 Q10", "提供心肌細胞產能零件，支持心臟功能"], ["Omega-3", "調節血脂，與 Q10 協同護心"], ["左旋肉鹼", "幫助脂肪酸送進粒線體燃燒產能"]], "gb": [["060", "Q10（10:1）", "支持心肌細胞 ATP 生成，研究顯示改善心衰竭心功能", "580"], ["002", "EPA+DHA複方粉包", "調節血脂，與 Q10 協同護心", "1350"], ["043", "鹼能活（含肉鹼）", "肉鹼幫助心肌燃燒脂肪酸產能", "520"]]}, {"i": 77, "title": "10萬人大型研究：抗炎飲食有助於防慢病", "date": "Jan 9", "body": ["這項研究基於英國生物銀行（UK Biobank）的大資料，分析了超過10萬名參與者，其核心觀點非常明確：飲食不僅是維持生命的基礎，更是調節身體炎症和預防慢性病的關鍵工具。", "抗炎飲食 = 延長“健康壽命”", "研究最核心的發現是，堅持低炎症飲食（Low-inflammatory diet）不僅能讓你活得更久，更重要的是能讓你活得更健康。", "降低多重慢病風險： 與吃促炎飲食的人相比，堅持抗炎飲食的人患“多重慢病”（同時患有兩種或以上慢性病）的風險顯著降低。", "減緩疾病積累： 對於60歲以上的人群，抗炎飲食能明顯減緩慢性病隨年齡增長而積累的速度。", "延長無病生存期： 研究資料顯示，堅持低炎症飲食的人，其“無慢性疾病生存時間”和“無多重慢病生存時間”分別比高炎症飲食者延長了約 0.81年 和 0.47年。", "什麼是“低炎症飲食”？（具體食物清單）", "研究透過計算“飲食炎症指數”（EDI），明確列出了一張抗炎食物清單。這些食物被認為具有減輕體內慢性低度炎症的能力。", "抗炎飲食包括深色蔬菜、新鮮水果、全麥麵包、全麥穀物、粗糧、高纖維早餐麥片 、魚類和海鮮、酸奶（注意非含糖量過高的風味酸奶） 、堅果和種子、非速溶咖啡（黑咖啡）、葡萄酒（適量）", "警惕“促炎飲食” 🚫", "與抗炎食物相反，研究指出長期攝入以下食物會增加體內炎症水平，進而推高慢性病風險：", "紅肉和加工肉類： 如培根、香腸、火腿15。", "高糖食品： 含糖飲料、新增糖過多的甜點。", "精製碳水： 過多的白米白麵（如果缺乏全穀物替代）。", "其他： 黃油、人造奶油等。", "這項研究強調了慢性低度炎症是導致多種慢性疾病（如心血管病、糖尿病、代謝綜合徵等）共同的土壤35。", "從“治病”到“防病”： 透過調整日常飲食結構，多吃植物性食物（蔬果、全穀物）和優質蛋白（魚、海鮮），可以主動降低體內的炎症水平。", "特別針對中老年： 對於60歲以上的群體，飲食干預對減緩身體機能衰退和多病共存的效果尤為明顯。"], "tags": ["抗炎", "抗炎飲食", "抗衰老", "健康飲食"], "dup": 0, "cat": "飲食", "plain": "英國 10 萬人研究發現：吃「抗發炎飲食」的人，同時得兩種以上慢性病的風險比較低，沒有慢性病的日子多了約 0.8 年。60 歲以上的人效果更明顯。抗發炎食物：深色蔬菜、水果、全穀、魚和海鮮、無糖優格、堅果種子、黑咖啡。少吃：紅肉加工肉、含糖飲料甜點、白米白麵、奶油。", "mind": {"c": "抗炎飲食防慢病", "b": [["研究", ["英國10萬人", "飲食炎症指數EDI"]], ["效果", ["多重慢病風險降低", "無病生存多0.81年", "60歲以上更明顯"]], ["抗炎食物", ["深色蔬菜水果", "全穀粗糧", "魚海鮮", "無糖優格", "堅果種子", "黑咖啡"]], ["促炎食物", ["紅肉加工肉", "含糖飲料", "精製白米白麵", "奶油"]]]}, "frame": [["飲食", "促炎食物多"], ["土壤", "慢性低度發炎"], ["結果", "多種慢性病"], ["改變", "換成抗炎飲食"], ["收穫", "延長健康壽命"]], "prod": [["綜合堅果種子", "抗炎好油與礦物質的日常點心"], ["無糖優格", "抗炎清單食物，還能補益生菌"], ["薑黃素", "抑制發炎訊號 NF-κB"]], "gb": [["041", "薑黃素＋胡椒鹼", "抑制發炎總開關 NF-κB，配合抗炎飲食", "620"], ["097", "亞麻仁油（500cc×2瓶）", "抗炎清單中的種子好油", "780"], ["070", "辣木粉", "深綠色植物營養，補充抗氧化物", "450"]]}, {"i": 78, "title": "GABA可促睡眠、改善大腦機能", "date": "Jan 8", "body": ["γ-氨基丁酸（GABA）是主要的抑制性神經遞質，已有充分證據表明 GABAA 受體的啟用有利於睡眠。L-茶氨酸是一種天然存在的氨基酸，最初在綠茶中被發現，是一種廣為人知的抗焦慮補充劑，具有已證實的放鬆功效。", "本研究探討了GABA/L-茶氨酸混合物潛在的協同睡眠增強效應。", "材料與方法：採用戊巴比妥誘導的睡眠測試，以確定ICR小鼠中具有促眠作用的適宜濃度。透過腦電圖（EEG）分析，研究正常SD大鼠和咖啡因誘導覺醒模型中的總睡眠時間及睡眠質量。實時聚合酶鏈反應（RT-PCR）用於探究GABA/L-茶氨酸混合物的促眠機制是否涉及轉錄過程。", "研究發現，與單獨使用GABA或茶氨酸相比，GABA/L-茶氨酸混合物（100/20 mg/kg）使睡眠潛伏期縮短（20.7% vs 14.9%）並延長睡眠時間（87.3% vs 26.8%）。與對照組相比，GABA/L-茶氨酸混合物使快速眼動睡眠（REM）（99.6%）和非快速眼動睡眠（NREM）（20.6%）顯著增加。", "在覺醒動物模型中，使用GABA/L-茶氨酸混合物而非單獨使用GABA或茶氨酸可使睡眠時間和質量恢復至正常水平。GABA/L-茶氨酸給藥導致GABA及穀氨酸GluN1受體亞基表達增加。", "結論：與單獨使用GABA或L-茶氨酸相比，GABA/L-茶氨酸混合物對睡眠質量和持續時間具有積極的協同效應。GABA受體和GluN1表達的增加歸因於GABA/L-茶氨酸組合的潛在神經調節特性，這影響了睡眠行為。"], "tags": ["大腦可塑性", "GABA", "茶氨酸", "睡眠", "睡眠質量改善", "睡眠質量提升"], "dup": 0, "cat": "睡眠", "plain": "GABA 是大腦裡讓神經「踩剎車」的物質，可以幫助睡覺；茶氨酸來自綠茶，能放鬆。動物實驗發現，兩個一起用比單獨用效果好很多：入睡時間更短、睡眠時間更長，深睡和做夢期都增加；就算喝了咖啡，也能把睡眠拉回正常。", "mind": {"c": "GABA＋茶氨酸助眠", "b": [["GABA", ["抑制性神經傳導物質", "幫神經踩剎車"]], ["茶氨酸", ["綠茶來源", "放鬆抗焦慮"]], ["協同效果", ["入睡更快", "睡更久", "REM與NREM增加"]], ["機制", ["GABA受體增加", "GluN1表現增加"]]]}, "frame": [["問題", "神經太興奮、睡不著"], ["組合", "GABA＋茶氨酸"], ["機制", "增加 GABA 受體"], ["結果", "入睡快、睡得深"]], "prod": [["GABA＋茶氨酸助眠配方", "協同放鬆，縮短入睡時間、提升睡眠品質"], ["發芽糙米", "天然 GABA 含量較高的食物"], ["無咖啡因花草茶", "睡前放鬆的好習慣"]], "gb": [["054", "GABA", "研究主角之一，幫助入睡與睡眠品質", "540"], ["062", "酶菌醣體（含茶胺酸）", "茶胺酸＋GABA 正是研究中的協同組合", "720"], ["091", "甘氨酸鎂複方粉包", "甘胺酸與鎂進一步幫助深睡", "1350"]]}, {"i": 79, "title": "為什麼薑黃素被稱為超級補劑？", "date": "Jan 6", "body": ["這篇題為 “薑黃素：黃金營養保健品——針對多種慢性疾病的多靶點作用” 的文獻是一篇關於薑黃素的經典綜述。", "薑黃素之所以對多種看似無關的慢性病都有效，並非因為它有一個“神奇”的單一靶點，而是因為它具有獨特的“多靶點”調節能力。它像一個“分子交響樂指揮”，能同時影響細胞內的多個關鍵訊號通路和分子，從而恢復細胞穩態。", "薑黃素強大的抗氧化與抗炎基礎：", "抗氧化：直接清除自由基，並上調體內自身的抗氧化防禦系統（如透過啟用 Nrf2 通路）。", "抗炎：是文獻強調的重中之重。薑黃素能有效抑制核心的促炎訊號樞紐，特別是 NF-κB 通路，從而減少TNF-α、IL-1β、IL-6等關鍵促炎細胞因子的產生。"], "tags": ["薑黃素", "抗炎", "抗氧化", "炎症", "微量營養素", "營養素缺乏", "抗氧化作用"], "dup": 0, "cat": "補充劑", "plain": "薑黃素是咖哩裡黃色的成分，被叫做「超級補劑」，因為它不是只打一個點，而是像「樂團指揮」一樣同時調整很多訊號。它有兩大本事：抗氧化（直接清自由基、打開 Nrf2 抗氧化開關）和抗發炎（關掉發炎總開關 NF-κB，減少 TNF-α、IL-6 等發炎物質）。", "mind": {"c": "薑黃素超級補劑", "b": [["特色", ["多靶點", "像樂團指揮"]], ["抗氧化", ["清除自由基", "啟動Nrf2"]], ["抗發炎", ["抑制NF-κB", "減少TNF-α、IL-1β、IL-6"]], ["應用", ["多種慢性病輔助"]]]}, "frame": [["問題", "氧化＋慢性發炎"], ["薑黃素", "多靶點調節"], ["機制", "Nrf2↑、NF-κB↓"], ["結果", "細胞恢復平衡"]], "prod": [["高吸收薑黃素（含胡椒鹼）", "胡椒鹼提升吸收，抗發炎抗氧化"], ["薑黃粉", "料理加一點，搭配油脂更好吸收"], ["薑黃＋Omega-3 複方", "雙重抗發炎，支持關節與心血管"]], "gb": [["041", "薑黃素＋胡椒鹼", "胡椒鹼大幅提升薑黃素吸收，發揮抗發炎、抗氧化", "620"], ["026", "薑黃亮白磨砂膏", "外用薑黃，溫和去角質提亮", "120"], ["002", "EPA+DHA複方粉包", "與薑黃素雙重抗發炎", "1350"]]}, {"i": 80, "title": "如何正確補硒？這四步搞定", "date": "Jan 5", "body": ["硒在增強人體免疫系統和預防多種疾病方面發揮著重要作用；", "對女性而言，硒是抗氧化和抵抗病毒的守護者；", "有文獻對亞硒酸鈉（無機硒）和有機生物硒（bio-Se）進行了詳細的安全性評估，實驗發現：", "生物硒能更好地保護肝臟和腎臟中的抗氧化酶活性，減少脂質過氧化產物（如MDA）的生成；", "研究支援了生物硒作為更優選擇的觀點，特別是當需要考慮較高劑量補充時；", "硒補充劑開發和應用應優先考慮生物轉化的有機硒形式，可以發揮硒的必需生理功能（如抗氧化、免疫支援）。", "4步教你選擇靠譜的硒片、科學補硒：", "第一步：看形態和來源，這是重中之重", "首選有機硒，有機硒是硒與有機物（如氨基酸）結合的形式，更接近食物中的天然硒，人體吸收利用率高，且安全性更好，毒性較低。", "第二步：看純度", "關注核心指標-純度，看看是否含有汞砷等其他金屬物質，避免無效補Se;", "第三部：看劑量和規格", "這是避免過量的關鍵。包裝上會標明每片/每粒含硒多少“微克（mcg或μg）”。中國成人每日推薦攝入量（RNI）為 60微克，可耐受最高攝入量（UL）為 400微克，切忌過量；", "第四步：看配方和成分", "確保產品不含您過敏的成分；有些產品是“硒+維生素E”或“硒+有特定營養成分”等複合配方。因為維生素E和硒在抗氧化上有協同作用，這樣的組合可能效果更好。"], "tags": ["補硒的作用", "營養素", "過量補硒的危害", "補充礦物質", "營養素補充", "調節免疫力", "硒片", "女性健康"], "dup": 0, "cat": "補充劑", "plain": "硒是一種微量礦物質，能幫助免疫系統和抗氧化。研究比較後發現，「有機硒」（和胺基酸結合的硒）比無機硒更能保護肝腎、安全性更好。選硒的四步驟：①選有機硒 ②看純度、不含重金屬 ③看劑量：成人每天建議 60 微克，最多不超過 400 微克 ④看配方，硒＋維生素 E 抗氧化更好。", "mind": {"c": "正確補硒四步驟", "b": [["功能", ["增強免疫", "抗氧化", "抗病毒"]], ["第一步", ["選有機硒", "吸收好、毒性低"]], ["第二步", ["看純度", "無汞砷"]], ["第三步", ["每天60μg", "上限400μg"]], ["第四步", ["硒＋維生素E協同"]]]}, "frame": [["需求", "免疫與抗氧化"], ["選型態", "有機硒"], ["控劑量", "60～400 微克"], ["搭配", "＋維生素 E"]], "prod": [["有機硒（酵母硒）", "吸收好、安全性高，支持免疫與抗氧化酵素"], ["硒＋維生素 E", "兩者抗氧化協同作用"], ["巴西堅果", "天然硒來源（一天 1～2 顆就夠，不要多吃）"]], "gb": [["072", "蝦紅素200mcg＋硒200mcg", "每錠硒 200mcg，在每日上限 400mcg 內；注意別和其他含硒產品重複", "530"], ["094", "D3（2000IU＋A＋E）", "含維生素 E，與硒抗氧化協同", "580"], ["017", "酵母鋅＋核酸", "同為酵母型礦物質，支持免疫", "550"]]}, {"i": 81, "title": "Nature30年研究揭示健康衰老的飲", "date": "Jan 4", "body": ["該研究追蹤了美國護士健康研究（NHS）和健康專業人員隨訪研究（HPFS）中105,015名參與者（66%為女性，基線平均年齡53歲），長達30年的隨訪後，僅有9,771人（9.3%）實現了健康衰老——即活到70歲且無慢性疾病、認知/身體/心理健康完好。關鍵結論顯示：長期堅持健康飲食模式，能顯著提升健康衰老機率。其中，替代健康飲食指數（AHEI）效果最顯著，最高五分位數人群的健康衰老機率較最低五分位數提升86%（OR=1.86，95%CI=1.71-2.01）；當健康衰老年齡閾值提高到75歲時，AHEI的關聯強度進一步增強（OR=2.24，95%CI=2.01-2.50）。", "健康衰老飲食實操指南基於研究結果，我們也為不同人群提供了可落地的飲食方案：核心原則：以植物性食物為主，適量納入健康動物源食物，減少加工食品攝入；量化參考：每日攝入500g以上蔬菜、200-350g水果，全穀物佔主食的一半以上，降低精緻碳水攝入，有助於降低全身炎症。", "模式選擇：普通人群優先選擇替代健康飲食指數（AHEI）模式（覆蓋11類健康食物）；關注認知健康可選地中海-終止高血壓神經退行性延遲飲食（MIND）模式（強化漿果和綠葉菜）；高血壓人群可選終止高血壓飲食法（DASH）模式（低鈉高鉀）；環保理念者可選行星健康飲食指數（PHDI）模式（低碳足跡食物）。禁忌清單：減少反式脂肪（油炸食品、加工糕點）、高鈉零食、含糖飲料和加工肉類的攝入，超加工食品提供的能量佔比控制在10%以下。"], "tags": ["如何面對衰老", "直擊衰老源", "健康衰老", "抗衰老"], "dup": 0, "cat": "長壽", "plain": "哈佛追蹤 10 萬人 30 年，只有 9.3% 的人做到「健康老化」（70 歲沒有慢性病、身心都好）。長期吃健康飲食的人，健康老化機會高 86%，以 AHEI 飲食最好。實際做法：每天蔬菜 500 克以上、水果 200～350 克、全穀佔主食一半；少吃油炸、高鈉零食、含糖飲料和加工肉。", "mind": {"c": "健康老化飲食", "b": [["研究", ["10.5萬人", "30年", "只有9.3%健康老化"]], ["結果", ["AHEI最佳 +86%", "75歲門檻 OR=2.24"]], ["每日份量", ["蔬菜500g+", "水果200-350g", "全穀佔主食一半"]], ["選擇模式", ["一般：AHEI", "護腦：MIND", "高血壓：DASH", "環保：PHDI"]], ["少吃", ["反式脂肪", "高鈉零食", "含糖飲料", "加工肉"]]]}, "frame": [["原則", "植物為主、少加工"], ["份量", "蔬菜 500g、水果 200～350g"], ["模式", "依需求選 AHEI/MIND/DASH"], ["結果", "健康老化機會大增"]], "prod": [["冷凍蔬菜 / 綜合莓果", "輕鬆達成每天蔬果份量"], ["全穀雜糧", "全穀佔主食一半的好幫手"], ["綜合堅果", "AHEI 推薦的健康食物之一"]], "gb": [["070", "辣木粉", "以植物為主的飲食補充", "450"], ["033", "亞麻仁籽渣", "全穀之外的纖維補給，降低發炎", "198"], ["097", "亞麻仁油（500cc×2瓶）", "AHEI 推薦的不飽和好油", "780"]]}, {"i": 82, "title": "我們都忽視了維生素K2對健康的作用", "date": "Jan 3", "body": ["維生素K2在健康與疾病中扮演著關鍵角色，其臨床意義已從傳統凝血功能擴充套件至骨骼、關節、心血管等多個系統。‌", "‌骨骼健康與關節疾病：‌ 維生素K2透過啟用‌骨鈣素‌等γ-羧化蛋白，促進骨礦化並降低骨折風險，日本指南推薦其作為骨質疏鬆症的二線治療藥物；在關節疾病方面，攝入量較低與膝骨關節炎發病風險增加相關，補充維生素K2（如45 mg/天）可減少類風溼性關節炎炎症標誌物，且體外研究顯示其能增強甲氨蝶呤的免疫抑制效果。‌", "‌心血管保護作用：‌ 維生素K2（尤其是MK-7）攝入量與心血管疾病發生風險呈負相關，其透過羧化‌基質Gla蛋白（MGP）‌ 抑制血管鈣化，腎臟疾病合併糖尿病患者補充MK-7（375 µg/天）可減緩動脈僵硬度進展。‌12", "‌代謝與神經保護：‌ 維生素K2改善胰島素敏感性（如MK-4 30 mg/天），可能降低代謝綜合徵發生率；在神經系統中，它透過抗炎和抗氧化機制發揮神經保護作用，缺乏與帕金森病進展相關，且周圍神經病變患者補充MK-7可改善症狀。‌", "‌抗腫瘤潛力：‌ 維生素K2可誘導多種癌細胞（如白血病、前列腺癌）自噬或凋亡，膳食攝入量與前列腺癌和肺癌發病率呈負相關，且可能作為輔助療法抑制肝細胞癌復發。‌"], "tags": ["營養素", "維生素K2", "維生素K", "線粒體與衰老", "維生素", "衰老"], "dup": 0, "cat": "補充劑", "plain": "維生素 K2 不只幫助凝血，還像「鈣的交通警察」：它活化骨鈣素，把鈣送進骨頭；又活化 MGP 蛋白，防止鈣跑去黏在血管壁上（血管鈣化）。研究顯示 K2 和骨質疏鬆、心血管、代謝、神經保護都有關。日本甚至把它用在骨質疏鬆治療。", "mind": {"c": "維生素K2", "b": [["骨骼", ["活化骨鈣素", "鈣進骨頭", "降骨折風險"]], ["心血管", ["活化MGP", "抑制血管鈣化", "MK-7"]], ["代謝神經", ["改善胰島素敏感", "抗炎抗氧化"]], ["其他", ["關節炎", "抗腫瘤潛力"]]]}, "frame": [["鈣", "吃進身體"], ["K2 指揮", "骨鈣素→骨頭；MGP→擋血管"], ["結果", "骨頭強、血管軟"], ["應用", "骨鬆與心血管保養"]], "prod": [["維生素 K2（MK-7）", "引導鈣進骨頭、遠離血管（服抗凝血藥者先問醫師）"], ["D3＋K2 複方", "D3 幫吸收鈣，K2 指揮鈣去對的地方"], ["納豆", "天然 K2（MK-7）最豐富的食物"]], "gb": [["094", "D3（2000IU＋A＋E）", "D3 幫助鈣吸收，和 K2 一起讓鈣去對的地方（團購暫無 K2，可搭配吃納豆）", "580"], ["092", "D3（5000IU）", "維生素 D 不足者的加強選擇", "580"], ["043", "鹼能活（含檸檬酸鉀）", "檸檬酸鉀有助減少鈣流失、保護骨質", "520"]]}, {"i": 83, "title": "補充甘氨酸和 N-乙醯半胱氨酸可以逆轉衰老", "date": "Jan 2", "body": ["文獻Glycine and N-acetylcysteine (GlyNAC) supplementation in older adults improves glutathione deficiency, oxidative stress, mitochondrial dysfunction, inflammation, insulin resistance, endothelial dysfunction, genotoxicity, muscle strength, and cognition: Results of a pilot clinical trial（《老年人補充甘氨酸和 N-乙醯半胱氨酸 (GlyNAC) 可改善谷胱甘肽缺乏症、氧化應激、粒線體功能障礙、炎症、胰島素抵抗、內皮功能障礙、遺傳毒性、肌肉強度和認知能力：一項試點臨床試驗的結果》由貝勒醫學院 Rajagopal Sekhar教授團隊 於2021年發表在《Clinical and Translational Medicine》，證實了：衰老帶來的多種缺陷（如抗氧化能力下降、代謝紊亂等）可以透過簡單的營養補充得到逆轉，但這些益處需要持續補充才能維持。", "臨床試驗選取8名70-80歲老年人和8名20-30歲年輕人作為對照。老年人組連續24周補充GlyNAC（甘氨酸劑量1.33 mmol/kg/day，NAC劑量0.81 mmol/kg/day），隨後停藥12周，期間監測多項生理指標。結果發現：", "•GSH水平顯著提升：老年人紅細胞內GSH濃度增加約200%，接近年輕人水平。", "•氧化應激與粒線體功能改善：血漿氧化應激標誌物（如硫代巴比妥酸反應物、F2-異前列腺素）顯著下降，粒線體脂肪酸氧化能力提升，功能障礙得到修復。", "•炎症與胰島素抵抗緩解：炎症標誌物（IL-6、TNF-α、CRP等）下降超50%，胰島素抵抗降低59%，空腹血糖水平恢復至年輕人狀態。", "•基因毒性與內皮功能改善：DNA損傷標誌物8-羥基脫氧鳥苷（8-OHdG）降低66%，內皮功能標誌物改善。", "•身體機能方面，肌肉力量與認知能力提升：老年人握力、步速、耐力等肌肉功能指標顯著提高，認知測試成績改善，接近年輕人水平。"], "tags": ["衰老", "NAC", "甘氨酸"], "dup": 0, "cat": "衰老機制", "plain": "貝勒醫學院讓 8 位 70～80 歲老人連續 24 週補充甘胺酸＋NAC（GlyNAC），結果清潔工穀胱甘肽增加約 200%，接近年輕人；發炎指標下降超過一半、胰島素阻抗降 59%、DNA 損傷降 66%；握力、走路速度、認知都進步。但停掉 12 週後好處又退回去，所以要持續。", "mind": {"c": "GlyNAC 逆轉衰老", "b": [["試驗", ["8位老人vs 8位年輕人", "24週補充", "停藥12週"]], ["指標改善", ["GSH +200%", "發炎 -50%以上", "胰島素阻抗 -59%", "DNA損傷 -66%"]], ["功能改善", ["握力", "步速", "耐力", "認知"]], ["提醒", ["停用後回退", "樣本小待驗證"]]]}, "frame": [["老化", "GSH 缺乏、氧化壓力"], ["補充", "甘胺酸＋NAC 24 週"], ["恢復", "GSH 回到年輕水準"], ["改善", "發炎、代謝、DNA、肌力、認知"], ["提醒", "需持續補充"]], "prod": [["NAC", "提供半胱胺酸，製造穀胱甘肽"], ["甘胺酸", "GSH 原料之一，還能幫助睡眠"], ["GlyNAC 複方", "兩種原料一次補足，協同提升 GSH"]], "gb": [["085", "NAC複方", "GlyNAC 的 NAC，提供半胱胺酸合成穀胱甘肽", "530"], ["091", "甘氨酸鎂複方粉包", "GlyNAC 的甘胺酸，兩者一起補才完整", "1350"]]}, {"i": 84, "title": "《坎貝爾生物學》生物學專業的必讀教材", "date": "編輯時間：10/22/2025", "body": ["☆ 寫給非生物學專業讀者的通識教材", "《坎貝爾生物學》（Campbell Biology）是美國生物學專業學生的必讀教材，涵蓋的知識的深度和廣度奠定了其在生物學教材方面的經典地位，是國外諸多生物學競賽的常用書。", "Helping Students Make Connections Across Biology Campbell BIOLOGY is the unsurpassed leader in introductory biology. The text’s hallmark values— accuracy, currency, and passion for teaching and learning— have made it the most successful college introductory biology book for eight consecutive editions. Building on the Key Concepts chapter framework of previous editions, Campbell BIOLOGY, Ninth Edition helps students keep sight of the “big picture” by encouraging them to: Make connections across chapters in the text, from molecules to ecosystems..."], "tags": ["生物學", "坎貝爾生物學", "英文原版書", "電子書"], "dup": 0, "cat": "其他", "plain": "《坎貝爾生物學》是美國大學生物系必讀的經典教科書，從分子、細胞、遺傳到生態系統都有，寫得清楚、重視「把知識連起來」。就算不是讀生物的人，也能拿來當通識書，幫助看懂抗老、營養這些科普文章背後的原理。", "mind": {"c"   const c = e.target.closest("[data-cp]"); if(c){
    const n = DATA[c.dataset.i-1];

  }
  const h = e.target.closest(".head"); if(h){ h.parentNode.classList.toggle("open"); return; }

    const body = t.closest(".body");
    body.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===t));
    body.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",p.dataset.p===t.dataset.t));
  }

document.getElementById("openAll").onclick = ()=>document.querySelectorAll(".card").forEach(c=>c.classList.add("open"));
