"005",cn:"行為 = 系統輸出",en:"Behavior = System Output",e:"行為由系統生成",r:"Behavior = f(Biology, Psychology, Context)。睡眠不足降低控制力。",m_cn:"神經傳導物質影響動機、專注、衝動。",m_en:"Neurotransmitters affect motivation, focus, impulse.",mi:"誤解：『只要更努力就能克服』。實際：生物約束。",p:"診斷系統：睡眠？血糖？環境？社交？運動？",ef:"不再亂責怪、找真正原因",ex:"× 學生懶｜○ 睡眠不足"},{n:"006",cn:"結果 = 模型輸出",en:"Results = Model Output",e:"模型不同，結果不同",r:"結果=努力×模型效率。只增加努力=『低效努力』。",m_cn:"『心智模型』決定問題解法。",m_en:"Mental models determine problem-solving.",mi:"誤解：『多花時間就進步』。實際：時間×方法。",p:"檢查：(1)我的模型是什麼？(2)誰用更有效模型？",ef:"開始改善模型、不迷信努力",ex:"× 作文不好｜○ 架構模型不足"},{n:"007",cn:"問題 = 限制訊號",en:"Problems = Limitation Signals",e:"問題是提醒",r:"問題出現位置就是系統邊界。『不會』表有未習得能力。",m_cn:"問題=現狀與目標落差。",m_en:"Problem = gap between current and goal.",mi:"誤解：『有問題代表不行』。實際：有清晰升級項。",p:"問題分類：(1)能力缺口(2)知識缺口(3)資源缺口",ef:"焦慮下降、更新增加、學習加速",ex:"× 我不會｜○ 哪個能力沒建立？"},{n:"008",cn:"衝突 = 結構失衡",en:"Conflict = Structural Imbalance",e:"衝突是系統不同步",r:"衝突在『預期』與『現實』不符。需要同步。",m_cn:"衝突=資訊不對稱+模型差異+意圖誤讀。",m_en:"Conflict = information asymmetry + model differences.",mi:"誤解：『衝突代表破裂』。實際：代表『失同步』。",p:"先問『你認為我想做什麼？』",ef:"合作增加、指責下降",ex:"× 學生愛頂嘴｜○ 雙方理解不同"},{n:"009",cn:"批評 = 新資料",en:"Criticism = New Data",e:"批評提供資訊",r:"批評在機器學習叫『誤差訊號』。神經網路通過看錯處改進。",m_cn:"批評觸發防衛系統。需訓練不進入防衛。",m_en:"Criticism triggers defense. Need training to not defend.",mi:"誤解：『好的人就不被批評』。實際：越優秀越主動尋求。",p:"問『這訊息裡有什麼我沒看見？』",ef:"更新加速、防衛下降",ex:"× 老師找麻煩｜○ 哪個能力需改善？"},{n:"010",cn:"現象 ≠ 答案",en:"Phenomena ≠ Answer",e:"現象只是入口",r:"『一直滑手機』現象。根因可能(1)注意力(2)避焦慮(3)習慣(4)環境(5)無目標。",m_cn:"現象是系統『輸出表現』。根因在系統內。",m_en:"Phenomena = output. Root causes inside system.",mi:"誤解：『看到就能解決』。實際：還需找原因。",p:"5層為什麼：現象→為什麼→為什麼→為什麼→為什麼→為什麼",ef:"找到根因、建立模型、預測準確",ex:"× 一直滑手機｜○ 缺乏目標、能量不足？"}]},{id:"02",cn:"診斷智慧",en:"Diagnosis Wisdom",intro:"本質｜找真正原因。原因｜每個系統都有瓶頸。果效｜責怪下降、理解增加、更新加快。",items:[{n:"011",cn:"不要急著責怪，先找限制",en:"Don't Blame, Find Constraints",e:"問題來自限制",r:"每個系統都有瓶頸，瓶頸限制整體表現。責怪是感情；找限制是理性。",m_cn:"大腦習慣『道德評價』。複雜系統中阻礙診斷。",m_en:"Brain uses moral judgment. But this blocks diagnosis.",mi:"誤解：『找限制就找藉口』。實際：找改進方向。",p:"診斷清單：(1)時間？(2)資源？(3)能力？(4)環境？(5)資訊？",ef:"責怪下降、理解增加、衝突減少",ex:"× 你就懶｜○ 哪一步做不下去？"},{n:"012",cn:"不要急著改人，先改流程",en:"Don't Change People, Change Processes",e:"流程產生行為",r:"改變個人20%成功率；改變流程80%。流程自動改變輸出。",m_cn:"習慣迴路=提示→常規→獎勵。改提示或常規自動改行為。",m_en:"Habit loop = cue → routine → reward. Change cue = automatic behavior change.",mi:"誤解：『只要教會就會做』。實際：教會不做者很多。",p:"流程設計：(1)分解目標(2)節點設提示(3)降低啟動成本(4)立即獎勵",ef:"行為改善、壓力降低、成效穩定",ex:"× 天天努力｜○ 放學後固定先完成英文"},{n:"013",cn:"不要急著努力，先找瓶頸",en:"Don't Strive, Find Bottlenecks",e:"努力不是第一步",r:"瓶頸理論：系統產能=min(最弱環節)。快到慢=瓶頸在慢。",m_cn:"系統產能=最小值。優化非瓶頸=無用功。",m_en:"System throughput = minimum. Optimize non-bottleneck = waste.",mi:"誤解：『更努力就突破』。實際：在非瓶頸努力=推木板。",p:"測量→找最低分→設計改善→重測→新瓶頸出現",ef:"效率提升、少走冤枉路、成本下降",ex:"× 一直背單字｜○ 瓶頸是閱讀理解"},{n:"014",cn:"不要急著補弱，先找槓桿點",en:"Don't Fill Weaknesses, Find Leverage",e:"找最有影響力位置",r:"80/20法則：20%投入=80%結果。改『注意力』同時改善需專注的全部。",m_cn:"系統存在『因果連鎖』。高槓桿點是源頭。",m_en:"Systems have causal chains. High-leverage at source.",mi:"誤解：『所有能力都要均衡』。實際：優先級不同。",p:"槓桿點尋找：(1)影響多少其他能力？(2)提升幅度？(3)改善成本？",ef:"投資報酬率提高、快速突破",ex:"改善閱讀｜英文整體提升"},{n:"015",cn:"不要只治症狀，要找根因",en:"Don't Treat Symptoms, Find Root",e:"症狀只是表象",r:"『不交作業』是症狀。根因可能(1)不懂(2)不知怎做(3)不知截止(4)無動機。",m_cn:"症狀是故障『燈號』。燈號亮改不了故障。",m_en:"Symptoms are warning lights. Light doesn't fix fault.",mi:"誤解：『症狀消失就解決』。實際：會反覆。",p:"根因分析(5 Whys)：逐層為什麼",ef:"問題不再重複、更新真正有效",ex:"睡覺｜真正原因：睡眠不足"},{n:"016",cn:"最大的限制不是表面問題",en:"Biggest Constraint Isn't Surface",e:"真正限制藏底層",r:"系統有『延遲性』。表面症狀往往比根因晚數月。",m_cn:"延遲效應。看到時根源已運作很久。",m_en:"Lag effect. By time most see it, root operated long.",mi:"誤解：『看到就是最大問題』。實際：往往不是。",p:"深層診斷：(1)何時開始？(2)那時發生什麼？(3)有無惡化訊號被忽視？",ef:"更早介入、預防惡化、預測準確",ex:"成績下降｜真正原因：長期睡不好"},{n:"017",cn:"很多問題來自能力缺口",en:"Many Problems = Skill Gaps",e:"不是人格不好",r:"人無法完成，99%『不會』不是『不願』。傳統教育用『道德評價』。",m_cn:"『能力可改進』→啟動學習；『人格評價』→啟動防衛。",m_en:"'Ability improvable' activates learning; character judgment activates defense.",mi:"誤解：『沒做好就是態度』。實際：常是能力問題。",p:"能力診斷：『遲到』=(1)時間感知(2)計劃(3)執行",ef:"羞恥下降、學習增加、願意修正",ex:"不會規劃時間｜不是懶，缺能力"},{n:"018",cn:"真正的敵人是失效模型",en:"Real Enemy <script>
(function(){
var TAG=['情境衝突','反問句','哲學命題','對比句','排比句','認知翻轉','層層遞進','詩性收束'];
var P=[{"page": "01 觀察智慧", "t": "你看見的不是事實，是你對事實的評價", "tags": "#觀察智慧 #事實不等於評價 #情緒不是真相 #LifeOS", "s": ["孩子放學回家，書包一丟，鞋子沒擺好，直接衝進房間關上門。你站在客廳，火一下子冒上來：「這孩子越來越沒禮貌，一點都不尊重人！」你走過去敲門，準備好好教訓一頓。門打開，他眼睛紅紅的，小聲說：「今天在學校被同學笑了。」你手裡那一整段準備好的話，瞬間卡在喉嚨裡。", "如果我們看到的就是事實，為什麼同一個畫面，不同的人會看出完全不同的故事？如果情緒告訴我們的都是真的，為什麼我們常常在事後才發現，自己誤會了別人？我們是在觀察世界，還是在用心裡早就寫好的劇本，替眼前的世界配音？", "觀察是所有智慧的第一步，沒有觀察，後面所有的判斷都建立在沙上。大腦為了節省力氣，很喜歡快速貼標籤，可是標籤一貼上，真相就被蓋住了。事實不等於評價，事件不等於人格，情緒不等於真相，一次失敗也不等於一生失敗。看清，比看快更重要。我們以為眼睛在看，其實是過去的經驗在看；能把經驗暫時放下的人，才看得見新的東西。", "評價說：「他很沒禮貌。」觀察說：「他沒擺鞋子，直接進了房間。」評價說：「我很失敗。」觀察說：「這次的結果不如預期。」評價說：「她就是針對我。」觀察說：「她今天說了兩次我的錯誤。」評價讓我們立刻有反應，觀察讓我們有機會先理解。", "先描述事實，再說出感受；先看見行為，再猜測原因；先承認自己不知道，再去問；先分開這一件事和這一個人，再決定怎麼回應；先記得情緒是一個訊號，而不是一個判決。每多一個「先」，你和真相之間，就少了一層霧。", "我們以為看得清楚，需要更銳利的眼睛；其實看得清楚，常常需要更慢一點的心。真正的翻轉是：行為是一個系統的輸出，結果是一個模型的輸出，問題是一個限制的訊號，衝突是結構失衡，批評是一份新資料。當你換上這副眼鏡，你不再急著責怪，而是開始好奇。", "從今天開始，每當你想下評語，先在心裡說一句：「我看到的事實是……」第一天，你會發現自己的評語多得驚人；第一週，你開始能把評價和事實分開；一個月後，你和孩子、伴侶、同事之間的誤會變少了；一年後，你成了身邊最能讓人安心說話的人，因為你總是先看，再說。", "清晨的湖面，霧散之前什麼都看不清，可是你不必急著拿手去撥，太陽升起，霧自己就會散。願你在每一次衝動之前，都給世界多一秒鐘；願你看見的，不再是你害怕的樣子，而是它本來的樣子；願那扇關上的房門後面，總有人願意先輕輕敲門，問一句：你還好嗎？"], "q": [["看清，比看快更重要。", "Seeing clearly matters more than seeing quickly."], ["想下評語之前，先說：「我看到的事實是……」", "Before you judge, say: \"The fact I see is…\""]]}, {"page": "02 診斷智慧", "t": "你一直在努力解決問題，卻從來沒有找到真正的問題", "tags": "#診斷智慧 #找瓶頸 #先找根因 #LifeOS", "s": ["這家店的營業額連續半年下滑。老闆先是加長營業時間，然後換了新菜單，接著砸錢打廣告，最後開始罵員工不夠積極。每一個方法都花了錢、花了力氣，業績卻還是往下掉。直到有一天，一位常客終於忍不住說：「老闆，你們的外送等太久了，我已經改叫別家了。」老闆愣在櫃台，半年的努力，原來都打在錯的地方。", "如果努力就能解決問題，為什麼有那麼多人越努力越挫折？如果改變一個人就能讓事情變好，為什麼換了人，問題還在？我們是在解決問題，還是在解決我們以為的問題？在動手之前，我們有沒有先停下來，問過真正卡住的地方在哪裡？", "每一個系統都有瓶頸。水管再粗，只要有一處被壓扁，水流就由那一處決定；隊伍再長，速度也只取決於走得最慢的那一段。診斷智慧的本質，是找到真正的原因。最大的限制，往往不是表面上最吵的問題；真正的敵人，往往不是某個人，而是一個已經失效、卻還沒被更新的做事方法。", "不要急著責怪，先找限制；不要急著改人，先改流程；不要急著努力，先找瓶頸；不要急著補弱，先找槓桿點；不要只治症狀，要找根因。責怪讓人得到一時的出口，診斷讓人得到長久的出路；症狀讓人忙碌，根因讓人自由。", "孩子成績不好，可能不是不用功，而是讀書方法卡住了；伴侶常生氣，可能不是脾氣差，而是有一個需要一直沒被聽見；團隊效率低，可能不是大家偷懶，而是流程裡有一個環節總在等；身體一直疲倦，可能不是老了，而是睡眠一直沒被照顧好。", "我們以為問題越多，要做的事就越多；其實很多問題來自同一個能力缺口，找到那一個，其他的就跟著鬆開。最深的翻轉是：真正的危機不是問題本身，而是看不見問題。找到限制，比增加努力更重要。少做十件錯的事，比多做一百件對不準的事，更接近答案。", "下一次遇到卡住的事情，先別急著動手，拿一張紙，寫下三個問題：它真正卡在哪一個環節？這個問題是第一次出現，還是一再重複？如果只能改一個地方，哪一個改變會讓其他問題一起變好？第一次，你只會寫出表面原因；第三次，你開始看到模式；一段時間後，責怪變少了，理解變多了，更新也變快了。", "醫生不會因為病人喊頭痛，就只開止痛藥；好的醫生會問：你最近睡得好嗎？吃得怎樣？壓力大嗎？願你對自己的人生，也有一位好醫生的耐心；願你不再用力敲打每一扇門，而是先找到那一把真正的鑰匙；願你打開之後發現，路，其實一直都在。"], "q": [["找到限制，比增加努力更重要。", "Finding the constraint matters more than adding effort."], ["動手之前先問：它真正卡在哪一個環節？", "Before acting, ask: where exactly is it stuck?"]]}];
var cur=0,hide=false;
function g(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var QL=[['心靈雞湯｜Soul Soup',''],['激勵｜Motivation','act']];
function qtext(p){return p.q?'\n\n'+p.q.map(function(x,k){return '【'+QL[k][0]+'】\n'+x[0]+'\n'+x[1]}).join('\n\n'):''}
function qhtml(p){return p.q?'<div class="lfb-qs">'+p.q.map(function(x,k){return '<div class="lfb-q '+QL[k][1]+'"><small>'+QL[k][0]+'</small><b>'+esc(x[0])+'</b><i lang="en">'+esc(x[1])+'</i></div>'}).join('')+'</div>':''}
function text(p){return '【'+p.t+'】\n\n'+p.s.join('\n\n')+qtext(p)+'\n\n'+p.tags}
function list(){
  var q=g('lfbQ').value.trim().toLowerCase();
  g('lfbList').innerHTML=P.map(function(p,i){
    if(q&&(p.page+' '+text(p)).toLowerCase().indexOf(q)<0)return '';
    return '<button type="button" data-i="'+i+'" class="'+(i===cur?'cur':'')+'"><small>第 '+(i+1)+' 頁｜'+esc(p.page)+'</small>'+esc(p.t)+'</button>';
  }).join('')||'<p style="padding:8px;font-size:14px">沒有符合的圖文</p>';
}
function show(i){
  cur=i;var p=P[i];
  g('lfbPost').innerHTML='<div class="lfb-eye">第 '+(i+1)+' / '+P.length+' 頁｜'+esc(p.page)+'</div><h2>'+esc(p.t)+'</h2><div class="lfb-meta">約 '+p.s.join('').replace(/\s/g,'').length+' 字 · 八種手法 · 文中情境為示例</div><div id="lfbBody" class="'+(hide?'notag':'')+'">'+p.s.map(function(x,k){return '<div class="lfb-part"><span class="lfb-tag">'+TAG[k]+'</span><p>'+esc(x)+'</p></div>'}).join('')+'</div>'+qhtml(p)+'<div class="lfb-tags">'+esc(p.tags)+'</div><div class="lfb-act"><button type="button" class="pri" id="lfbCopy">複製貼文</button><button type="button" id="lfbHide">'+(hide?'顯示':'隱藏')+'手法標籤</button><span class="lfb-st" id="lfbSt" role="status"></span></div>';
  g('lfbPost').scrollTop=0;list();
}
function copy(){
  var t=text(P[cur]),st=g('lfbSt');
  function fall(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();st.textContent=ok?'已複製，可直接貼到臉書。':'無法自動複製，請手動選取內文。'}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){st.textContent='已複製，可直接貼到臉書。'},fall)}else fall();
}
g('lfbOpen').onclick=function(){g('lfb').classList.add('on');show(cur);g('lfbQ').focus()};
g('lfbClose').onclick=function(){g('lfb').classList.remove('on');g('lfbOpen').focus()};
g('lfb').addEventListener('click',function(e){
  if(e.target===g('lfb'))g('lfbClose').onclick();
  var b=e.target.closest&&e.target.closest('[data-i]');if(b)show(+b.getAttribute('data-i'));
  if(e.target.id==='lfbCopy')copy();
  if(e.target.id==='lfbHide'){hide=!hide;show(cur)}
});
g('lfbQ').addEventListener('input',list);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&g('lfb').classList.contains('on'))g('lfbClose').onclick()});
})();
</script>
</body></html>
