"005",cn:"行為 = 系統輸出",en:"Behavior = System Output",e:"行為由系統生成",r:"Behavior = f(Biology, Psychology, Context)。睡眠不足降低控制力。",m_cn:"神經傳導物質影響動機、專注、衝動。",m_en:"Neurotransmitters affect motivation, focus, impulse.",mi:"誤解：『只要更努力就能克服』。實際：生物約束。",p:"診斷系統：睡眠？血糖？環境？社交？運動？",ef:"不再亂責怪、找真正原因",ex:"× 學生懶｜○ 睡眠不足"},{n:"006",cn:"結果 = 模型輸出",en:"Results = Model Output",e:"模型不同，結果不同",r:"結果=努力×模型效率。只增加努力=『低效努力』。",m_cn:"『心智模型』決定問題解法。",m_en:"Mental models determine problem-solving.",mi:"誤解：『多花時間就進步』。實際：時間×方法。",p:"檢查：(1)我的模型是什麼？(2)誰用更有效模型？",ef:"開始改善模型、不迷信努力",ex:"× 作文不好｜○ 架構模型不足"},{n:"007",cn:"問題 = 限制訊號",en:"Problems = Limitation Signals",e:"問題是提醒",r:"問題出現位置就是系統邊界。『不會』表有未習得能力。",m_cn:"問題=現狀與目標落差。",m_en:"Problem = gap between current and goal.",mi:"誤解：『有問題代表不行』。實際：有清晰升級項。",p:"問題分類：(1)能力缺口(2)知識缺口(3)資源缺口",ef:"焦慮下降、更新增加、學習加速",ex:"× 我不會｜○ 哪個能力沒建立？"},{n:"008",cn:"衝突 = 結構失衡",en:"Conflict = Structural Imbalance",e:"衝突是系統不同步",r:"衝突在『預期』與『現實』不符。需要同步。",m_cn:"衝突=資訊不對稱+模型差異+意圖誤讀。",m_en:"Conflict = information asymmetry + model differences.",mi:"誤解：『衝突代表破裂』。實際：代表『失同步』。",p:"先問『你認為我想做什麼？』",ef:"合作增加、指責下降",ex:"× 學生愛頂嘴｜○ 雙方理解不同"},{n:"009",cn:"批評 = 新資料",en:"Criticism = New Data",e:"批評提供資訊",r:"批評在機器學習叫『誤差訊號』。神經網路通過看錯處改進。",m_cn:"批評觸發防衛系統。需訓練不進入防衛。",m_en:"Criticism triggers defense. Need training to not defend.",mi:"誤解：『好的人就不被批評』。實際：越優秀越主動尋求。",p:"問『這訊息裡有什麼我沒看見？』",ef:"更新加速、防衛下降",ex:"× 老師找麻煩｜○ 哪個能力需改善？"},{n:"010",cn:"現象 ≠ 答案",en:"Phenomena ≠ Answer",e:"現象只是入口",r:"『一直滑手機』現象。根因可能(1)注意力(2)避焦慮(3)習慣(4)環境(5)無目標。",m_cn:"現象是系統『輸出表現』。根因在系統內。",m_en:"Phenomena = output. Root causes inside system.",mi:"誤解：『看到就能解決』。實際：還需找原因。",p:"5層為什麼：現象→為什麼→為什麼→為什麼→為什麼→為什麼",ef:"找到根因、建立模型、預測準確",ex:"× 一直滑手機｜○ 缺乏目標、能量不足？"}]},{id:"02",cn:"診斷智慧",en:"Diagnosis Wisdom",intro:"本質｜找真正原因。原因｜每個系統都有瓶頸。果效｜責怪下降、理解增加、更新加快。",items:[{n:"011",cn:"不要急著責怪，先找限制",en:"Don't Blame, Find Constraints",e:"問題來自限制",r:"每個系統都有瓶頸，瓶頸限制整體表現。責怪是感情；找限制是理性。",m_cn:"大腦習慣『道德評價』。複雜系統中阻礙診斷。",m_en:"Brain uses moral judgment. But this blocks diagnosis.",mi:"誤解：『找限制就找藉口』。實際：找改進方向。",p:"診斷清單：(1)時間？(2)資源？(3)能力？(4)環境？(5)資訊？",ef:"責怪下降、理解增加、衝突減少",ex:"× 你就懶｜○ 哪一步做不下去？"},{n:"012",cn:"不要急著改人，先改流程",en:"Don't Change People, Change Processes",e:"流程產生行為",r:"改變個人20%成功率；改變流程80%。流程自動改變輸出。",m_cn:"習慣迴路=提示→常規→獎勵。改提示或常規自動改行為。",m_en:"Habit loop = cue → routine → reward. Change cue = automatic behavior change.",mi:"誤解：『只要教會就會做』。實際：教會不做者很多。",p:"流程設計：(1)分解目標(2)節點設提示(3)降低啟動成本(4)立即獎勵",ef:"行為改善、壓力降低、成效穩定",ex:"× 天天努力｜○ 放學後固定先完成英文"},{n:"013",cn:"不要急著努力，先找瓶頸",en:"Don't Strive, Find Bottlenecks",e:"努力不是第一步",r:"瓶頸理論：系統產能=min(最弱環節)。快到慢=瓶頸在慢。",m_cn:"系統產能=最小值。優化非瓶頸=無用功。",m_en:"System throughput = minimum. Optimize non-bottleneck = waste.",mi:"誤解：『更努力就突破』。實際：在非瓶頸努力=推木板。",p:"測量→找最低分→設計改善→重測→新瓶頸出現",ef:"效率提升、少走冤枉路、成本下降",ex:"× 一直背單字｜○ 瓶頸是閱讀理解"},{n:"014",cn:"不要急著補弱，先找槓桿點",en:"Don't Fill Weaknesses, Find Leverage",e:"找最有影響力位置",r:"80/20法則：20%投入=80%結果。改『注意力』同時改善需專注的全部。",m_cn:"系統存在『因果連鎖』。高槓桿點是源頭。",m_en:"Systems have causal chains. High-leverage at source.",mi:"誤解：『所有能力都要均衡』。實際：優先級不同。",p:"槓桿點尋找：(1)影響多少其他能力？(2)提升幅度？(3)改善成本？",ef:"投資報酬率提高、快速突破",ex:"改善閱讀｜英文整體提升"},{n:"015",cn:"不要只治症狀，要找根因",en:"Don't Treat Symptoms, Find Root",e:"症狀只是表象",r:"『不交作業』是症狀。根因可能(1)不懂(2)不知怎做(3)不知截止(4)無動機。",m_cn:"症狀是故障『燈號』。燈號亮改不了故障。",m_en:"Symptoms are warning lights. Light doesn't fix fault.",mi:"誤解：『症狀消失就解決』。實際：會反覆。",p:"根因分析(5 Whys)：逐層為什麼",ef:"問題不再重複、更新真正有效",ex:"睡覺｜真正原因：睡眠不足"},{n:"016",cn:"最大的限制不是表面問題",en:"Biggest Constraint Isn't Surface",e:"真正限制藏底層",r:"系統有『延遲性』。表面症狀往往比根因晚數月。",m_cn:"延遲效應。看到時根源已運作很久。",m_en:"Lag effect. By time most see it, root operated long.",mi:"誤解：『看到就是最大問題』。實際：往往不是。",p:"深層診斷：(1)何時開始？(2)那時發生什麼？(3)有無惡化訊號被忽視？",ef:"更早介入、預防惡化、預測準確",ex:"成績下降｜真正原因：長期睡不好"},{n:"017",cn:"很多問題來自能力缺口",en:"Many Problems = Skill Gaps",e:"不是人格不好",r:"人無法完成，99%『不會』不是『不願』。傳統教育用『道德評價』。",m_cn:"『能力可改進』→啟動學習；『人格評價』→啟動防衛。",m_en:"'Ability improvable' activates learning; character judgment activates defense.",mi:"誤解：『沒做好就是態度』。實際：常是能力問題。",p:"能力診斷：『遲到』=(1)時間感知(2)計劃(3)執行",ef:"羞恥下降、學習增加、願意修正",ex:"不會規劃時間｜不是懶，缺能力"},{n:"018",cn:"真正的敵人是失效模型",en:"Real Enemy
