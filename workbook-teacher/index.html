<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>習作教師版｜英文朗讀 APP</title><link rel="stylesheet" href="style.css"><script defer src="data.js"></script><script defer src="app.js"></script></head><body>
<header><div><p>龍騰英文 · 第一、二冊</p><h1>習作教師版 <span>原版閱讀・英文朗讀</span></h1></div><span class="badge">24 單元</span></header>
<nav class="menu" aria-label="課次選單"><label>冊別<select id="book"><option>英文1</option><option>英文2</option></select></label><label class="lesson">課次<select id="lesson"></select></label><a id="pdf" target="_blank">原版 PDF ↗</a><a id="word" download>下載 Word</a><button id="text-toggle" aria-pressed="false">開啟本課文字與朗讀</button></nav>
<main><section class="paper-panel"><div class="page-tools"><button id="prev">← 上一頁</button><label>第 <select id="page"></select> 頁</label><span id="total"></span><button id="next">下一頁 →</button><label>縮放 <select id="zoom"><option value="fit">適合寬度</option><option value="125">125%</option><option value="150">150%</option><option value="200">200%</option></select></label></div><div id="paper-scroll"><img id="paper" alt="教師版原卷"></div><p class="caption">原始教師版頁面，保留圖片、表格、答案及排版。可放大查看。</p></section>
<section id="reading" hidden><div class="reading-head"><h2>本課文字與英文朗讀</h2><p>文字依原 Word 擷取，範圍為整課；圖表與版面請看左側原卷。</p><input id="search" type="search" placeholder="搜尋本課英文或中文" aria-label="搜尋本課文字"><div class="audio-tools"><label>語速 <select id="rate"><option value="0.65">慢速</option><option value="0.85" selected>適中</option><option value="1">正常</option></select></label><button id="stop">停止朗讀</button></div><p id="status" role="status" aria-live="polite"></p></div><div id="paragraphs"></div></section></main>
<footer>習作簿（教用版）· 原始教材查閱 APP</footer></body></html>
