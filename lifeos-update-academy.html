{b:'塔羅牌 15 世紀出現於義大利北部，原本是紙牌遊戲；18 世紀後期才被賦予占卜與神祕學意義。現今最通行的萊德偉特史密斯牌於 1909 年出版，由潘蜜拉・柯爾曼・史密斯繪製。全副 78 張：大阿爾克那 22 張、小阿爾克那 56 張。沒有可靠證據顯示塔羅能預測未來，本課只把它當作圖像提問工具。',
 u:'把「牌告訴我答案」更新為「圖像幫我問出問題」。',z:'答案多半早已在心裡，缺的是一個能讓它浮現的提問。',a:'設計開放式問題、辨認自己的聯想與需求、把感受轉成可檢查的行動。',
 c:[['巴納姆效應','人容易覺得籠統、適用於多數人的描述「說的就是我」。心理學家佛瑞 1949 年以實驗證明。這是牌義看起來很準的主因之一。'],['模糊刺激','圖像越開放，人越會把自己的內容放進去。這是它能用於自我探索的原因，也是它不能當證據的原因。'],['小阿爾克那','56 張，四個牌組各有 1 到 10 的數字牌與 4 張宮廷牌，多用來談日常層面的事。'],['提問的主詞','問題的主詞是「他」或「命運」時，你只能等；主詞是「我」時，才有下一步。']],
 lv:['把 3 個「會不會」的問題改寫成「我可以如何」的問題。','選 1 張圖，依序寫：我看到什麼、我想到什麼、這和我目前哪件事有關、我忽略了什麼。','把上一步得到的提問變成 1 個本週行動，一週後檢查：這個行動有沒有帶來新資訊？'],
 cs:{s:'她想離職創業，反覆抽牌問「會成功嗎」，每次結果不同，更加焦慮。',d:'她把問題改成「我最需要先確認什麼」。看著抽到的錢幣牌，她意識到自己從沒算過能撐幾個月。',r:'她列出存款與每月開銷，發現只能撐四個月，於是決定先兼職試做三個月。焦慮下降，因為問題變成可以處理的事。'},
 m:[['牌很準，所以一定有某種力量。','「覺得準」多半來自巴納姆效應與事後詮釋。準不準要用事前寫下、可判定的預測來檢查。'],['既然不能預測，塔羅就毫無用處。','圖像作為提問與敘事的工具仍有價值，前提是決定權與責任留在自己手上。']],
 q:[{q:'塔羅牌最初的用途是什麼？',a:['紙牌遊戲','古埃及祭司的占卜','心理治療工具'],i:0,y:'占卜用途是 18 世紀後期才附加上去的，古埃及起源說沒有史料支持。'},{q:'覺得一段籠統的性格描述「完全在說我」，最可能是？',a:['描述者有特殊能力','巴納姆效應','自己性格很特別'],i:1,y:'籠統且偏正面的描述幾乎適用所有人，所以要看具體、可否證的內容。'}],
 rd:['瑞秋・波拉克《78度的智慧》','莎莉・妮可斯《榮格與塔羅》','Forer (1949) 關於個人化描述接受度的經典實驗']},
{b:'共時性是榮格在 1920 年代醞釀、1952 年正式發表的概念，收錄於他與物理學家泡利合著的《自然的解釋與心靈》。著名例子是病人講述金龜子的夢時，窗外恰好飛來一隻金龜子。它描述的是有意義的巧合體驗，至今沒有被科學證實為一種自然法則。',
 u:'把「這麼巧一定有原因」更新為「意義歸意義，證據歸證據」。',z:'可以珍惜一個巧合帶來的觸動，同時不替它編造因果。',a:'分開記錄主觀意義與客觀主張，建立比較基準，主動記下未命中。',
 c:[['頻率錯覺','剛注意到某樣東西後，就覺得它到處出現。其實是注意力改變了，不是世界改變了。'],['真正大數法則','統計學家戴康尼斯與莫斯特勒指出：樣本夠大時，再離奇的事都會發生。每天有幾十億人，百萬分之一的巧合天天都有。'],['幻想性錯覺','在無關的事物之間看出關聯或圖樣的傾向，例如在雲裡看到臉。'],['事前登記','在結果出現前寫下預測與判定標準，是區分規律與巧合最簡單的方法。']],
 lv:['記下 1 個最近的巧合，分兩欄寫：它對我的意義／它的客觀發生機率與反例。','挑 1 個你相信的「感應」，連續兩週記錄每一次有感覺的時刻，不論後來有沒有應驗。','兩週後計算命中率，與「隨便猜」的機率比較，寫下你的結論與仍不確定之處。'],
 cs:{s:'他開始考慮轉行學設計後，覺得到處看到設計課廣告、遇到設計師，認為是「宇宙在指引」。',d:'他分開記：意義帳是「我真的很在意這件事」；證據帳是「我搜尋過相關字，廣告本來就會跟著來，而且我以前沒在留意」。',r:'他保留了那份在意，把它當作值得認真評估的訊號，但決定依據改成試上一門課與訪談三位從業者。'},
 m:[['共時性已被量子力學證實。','沒有。榮格與泡利的討論是哲學性的探索，量子糾纏不能傳遞意義或訊息，兩者不能互相證明。'],['理性的人應該完全無視巧合。','巧合常透露你在意什麼，這是有用的自我資訊。該檢查的是由它推出的因果主張。']],
 q:[{q:'買了某款車後，覺得滿街都是同款車，這是？',a:['共時性','頻率錯覺','該車突然大賣'],i:1,y:'車的數量沒變，是你的注意力被調到那個頻道。'},{q:'要判斷「夢會成真」是不是規律，最關鍵的做法是？',a:['多蒐集應驗的例子','事前記下每個夢與明確預測，連沒應驗的一起算','詢問有相同經驗的人'],i:1,y:'只收集命中的例子永遠會覺得有規律；要有分母才算得出命中率。'}],
 rd:['榮格《共時性：一個非因果性的聯繫原則》（1952）','Diaconis 與 Mosteller (1989)〈研究巧合的方法〉','大衛・漢德《不可能法則》']},
{b:'泡利（Wolfgang Pauli，1900–1958），生於維也納。1925 年提出不相容原理，1930 年預言微中子，1945 年獲諾貝爾物理學獎。1932 年起與榮格通信二十多年。精細結構常數 α 由索末菲於 1916 年引入，α = e²/(4πε₀ħc) ≈ 1/137.036。愛丁頓曾試圖論證它恰好是 1/137，被更精確的測量否定。泡利 1958 年在蘇黎世醫院的 137 號病房過世。',
 u:'把「聽起來有道理」更新為「定義清楚、有數據、知道邊界」。',z:'精確是一種誠實；知道自己不知道什麼，比多知道一件事更重要。',a:'澄清定義、判讀數字與單位、追溯來源、標出主張的適用範圍。',
 c:[['無因次常數','沒有單位的純數，不論用什麼單位制都是同一個值。α 之所以受重視，正因為它不是人為單位造成的。'],['不確定度','任何測量都有誤差範圍。只報數字不報誤差，等於沒說清楚有多可信。'],['操作型定義','用「怎麼測量」來定義一個概念。說不出怎麼測，就還不算定義清楚。'],['泡利效應','同事開玩笑說泡利一靠近儀器就故障。它是趣聞而非物理，正好用來練習區分軼事與證據。']],
 lv:['找 1 則含數字的宣稱（廣告或貼文），問三件事：單位是什麼、和什麼比、來源在哪。','選 1 個自己的信念，寫成含數字與期限的句子，並寫下「出現什麼我就承認錯了」。','追到 1 個宣稱的原始資料，比較原文實際說的與轉述說的，列出被誇大或省略之處。'],
 cs:{s:'長輩傳來「研究證實某食物可降低 50% 罹病風險」的貼文，準備每天大量食用。',d:'他追問三件事：50% 是相對還是絕對風險、研究對象是誰、是觀察研究還是實驗。查到原文是觀察研究，絕對風險從千分之二降到千分之一。',r:'他向長輩說明「有相關、效果小、未證明因果」，照常均衡飲食即可。家人沒有因此花大錢，也沒有吵架。'},
 m:[['137 是宇宙密碼，藏著神祕意義。','α 的值約為 1/137.036，不是整數，而且會隨能量尺度略有變化。它重要是因為測得極準，而不是因為數字本身。'],['泡利與榮格合作，代表物理學支持共時性。','泡利把那些討論視為哲學探索，並未把它寫進物理理論，也沒有提出可檢驗的物理預測。']],
 q:[{q:'精細結構常數為什麼特別受物理學家重視？',a:['它剛好等於 1/137','它是無因次的純數，不隨單位制改變','它是泡利發現的'],i:1,y:'無因次代表它反映自然本身的性質，不是人選的單位造成的。'},{q:'愛丁頓主張 α 恰為 1/137，後來測量得到 1/137.036。正確的態度是？',a:['理論優美，測量應該有誤','測量與理論不符，就修正或放棄理論','兩者各有道理，不必取捨'],i:1,y:'再漂亮的想法，也要讓位給可重複的測量。'}],
 rd:['費曼《QED：光和物質的奇妙理論》','亞瑟・米勒《137：榮格、泡利與科學痴迷的追尋》','麥爾編《原子與原型：泡利與榮格通信集》']},
{b:'海德格（Martin Heidegger，1889–1976），德國哲學家，代表作《存在與時間》（1927）。他用「此在」稱呼人這種會追問自身存在的存在者，分析人如何在世界中、與他人一起、面向有限的時間而活。他在 1933 年加入納粹黨，這段歷史至今受到嚴厲批評；學習他的概念不等於認同他的政治選擇。榮格的個體化則描述人生後半段整合自己的歷程。',
 u:'把「我應該照大家的樣子活」更新為「我選擇，並承擔」。',z:'時間有限是事實，也是讓選擇有重量的原因。',a:'辨認處境的限制與可控之處、排列自己的價值、做出願意承擔的小選擇。',
 c:[['在世存在','人不是先孤立存在再進入世界，而是一開始就在關係、工具與事務之中。所以改變自己常要從改變處境著手。'],['畏','與「怕」不同。怕有明確對象；畏沒有對象，是意識到一切都要由自己選擇時的不安。它是提醒而非疾病。'],['操心','海德格用來概括人的存在方式：人總是在乎著、牽掛著某些事。看你牽掛什麼，就知道你怎麼活。'],['決斷','不是衝動決定，而是看清處境後，不再躲進「大家都這樣」，願意對選擇負責。']],
 lv:['記錄一週的時間去向，每項標記：我選的、別人期待的、只是習慣。','寫下 3 個價值，各舉出上週 1 個符合與 1 個違背它的行為。','挑 1 個價值與時間最不一致之處，設計 1 個兩週內可逆的小改變，並告訴 1 個人你的決定。'],
 cs:{s:'他四十歲升上主管，收入最高的一年，卻覺得空。大家都說他很成功。',d:'他記錄一週時間，發現「陪孩子」排在價值第一位，實際每週不到兩小時。他分清楚：加班有一半是別人期待，另一半只是習慣。',r:'他沒有辭職，只把每週兩個晚上設為不加班並告知團隊。三個月後工作表現沒有下降，他說空的感覺少了很多。'},
 m:[['活出本真就是不管別人、做自己想做的。','海德格強調人始終與他人共在。本真是清楚自己的選擇，而不是否認責任與關係。'],['向死而在是悲觀的想法。','它是要人正視有限，因而不再無限期拖延重要的事，效果通常是更清醒而不是更消沉。']],
 q:[{q:'海德格所說的「畏」與「怕」差別在哪？',a:['畏比較強烈，怕比較輕微','怕有明確對象，畏沒有特定對象','兩者相同，只是翻譯不同'],i:1,y:'畏指向的是自己的自由與有限，所以它常在看似一切順利時出現。'},{q:'下列何者最接近「常人」狀態？',a:['仔細考慮後決定留在原公司','因為同學都買房所以覺得自己也該買','與家人討論後共同做決定'],i:1,y:'問題不在結果相同，而在理由是「大家都這樣」而非自己的衡量。'}],
 rd:['海德格《存在與時間》（1927）','莎拉・貝克威爾《我們在存在主義咖啡館》（易讀的入門）','默瑞・史坦《榮格心靈地圖》']},
{b:'這一課整合前七課，背後有幾條彼此呼應的研究線：貝氏定理（依證據更新信念）、戴明推廣的 PDCA 循環（計畫、執行、檢查、行動）、柯爾布 1984 年的經驗學習圈、阿吉里斯與熊恩的雙環學習，以及認知科學的預測處理觀點，即大腦不斷預測並用誤差修正模型。泰特洛克的預測研究則顯示，判斷力可以靠紀錄與回饋訓練。',
 u:'把「我早就知道」更新為「我當時預測的是什麼，差在哪」。',z:'錯誤不是對你的評價，而是模型還能更好的地方。',a:'寫出可檢查的預測、做小實驗、讀取回饋、修改假設並保留版本。',
 c:[['貝氏更新','新信念＝原有信念依證據強度調整。證據強就多改一點，證據弱就少改一點，而不是全盤接受或全盤否定。'],['校準','你說「七成把握」的事，長期應有約七成發生。校準比偶爾猜中更能代表判斷力。'],['後見之明偏誤','結果出來後，人會覺得自己早就料到。費施霍夫 1975 年以實驗證明。唯一的解法是事前寫下來。'],['經驗學習圈','柯爾布提出：具體經驗、反思觀察、形成概念、主動實驗，四步循環。只有經驗沒有反思，等於重複同一年。']],
 lv:['每天寫 1 個小預測並附把握程度（例如：這個會議 40 分鐘內結束，七成），當天對答案。','累積 20 筆後，把相同把握程度的預測放在一起算命中率，看自己是過度自信還是過度保守。','挑 1 個預測落差最大的領域，找出背後的假設並改寫，用新假設再跑兩週，比較誤差。'],
 cs:{s:'她每次估專案時程都說兩週，實際總是四週，每次都歸因於「這次比較特別」。',d:'她開始事前寫下預估與把握程度，結束後記錄實際天數與延誤原因。五個專案後發現：延誤都來自等待別人回覆，而她的估算只算了自己的工時。',r:'她修改的不是努力程度，而是估算模型：自己工時再加等待時間。下一個專案估四週、實際四週半，誤差從一倍降到一成多。'},
 m:[['常改變想法代表沒有主見。','依證據修正是判斷力的核心。該警惕的是沒有新證據卻改變，或有新證據卻不改。'],['失敗就代表方法錯了。','單次結果含有運氣成分。要看多次紀錄中的趨勢，並分開「決策品質」與「結果好壞」。']],
 q:[{q:'「校準良好」是什麼意思？',a:['每次預測都正確','說有七成把握的事，長期約七成發生','從不說沒把握的話'],i:1,y:'校準衡量的是你的把握程度與現實是否一致，這是可以訓練的。'},{q:'對抗後見之明偏誤最有效的做法是？',a:['事後仔細回想當時的想法','事前寫下預測與把握程度','請別人幫忙回憶'],i:1,y:'記憶會被結果改寫，只有事前的文字紀錄不會。'}],
 rd:['泰特洛克與加德納《超級預測》','柯爾布《體驗學習》（1984）','阿吉里斯〈教聰明人學會學習〉（哈佛商業評論，1991）']}

const lessonRaw=`原型是人類反覆上演的互動劇本，例如拯救者、受害者、照顧者。當你在公司、家庭、朋友之間都遇到同一種處境，共同點往往不是那些人，而是你帶進每段關係的角色。辨識原型，就是把「我又遇到壞人」改看成「我又演了同一個角色」。|榮格認為這些劇本來自集體無意識，會在適合的情境自動啟動。人靠過去經驗形成期待，期待又引導行為，於是相似的結果一再出現。|列出三段讓你困擾的關係；找出自己在其中共同的做法與沒說出口的話；替這個角色取名，問它在保護什麼|重複出現的不是命運，是我帶著走的劇本。
陰影是被自己否認的特質與需求。它不會消失，而會以對別人的強烈反感、嫉妒或過度崇拜出現。看到同事升遷而不舒服，重點不在同事，而在你也渴望被肯定卻不允許自己承認。整合陰影是認領這份需求，並不代表要忍受別人真正的傷害。|心理學稱為投射：把自己難以接受的內容看成是別人的。情緒強度遠大於事件本身，通常是投射的訊號。|把事件寫成三欄：對方做了什麼、我感覺到什麼、我其實想要什麼；確認對方行為是否真的越界；用一句話向適當的人表達那個需求|我最受不了的，常是我不准自己擁有的。
人格面具是為了適應社會而扮演的角色：老師、主管、好媽媽。角色本身有用，問題出在把角色當成全部的自己，於是休息變成失職、求助變成軟弱。這個節點教你分清「角色要求的」與「我這個人需要的」，並為角色畫出界線。|榮格指出過度認同面具會使其他部分被壓抑，最後以耗竭或情緒爆發的方式反撲。角色期待多半來自外界，卻被內化成自我要求。|寫下這個角色的三條「必須」；逐條問這是誰規定的、不做會發生什麼；選一條改成有條件的規則，例如非緊急訊息隔天回|我扮演角色，但角色不是我的全部。
自動反應是一條被重複走出來的路：某個提示出現，身體和語言就照舊反應，快到來不及選擇。它不是天性，而是練習的結果，所以也能用練習改掉。關鍵是在提示與反應之間撐出幾秒空檔，放進一個事先想好的新動作。|習慣研究把它描述為提示、慣性行為、獎賞的迴路。迴路不會被刪除，只能被新的行為覆蓋，所以需要在低壓情境反覆演練。|找出最常觸發你的提示，例如對方提高音量；事先決定一個替代動作，例如先說「我需要十秒」；在不嚴重的場合先練，記錄成功次數|刺激與回應之間有空間，那裡就是選擇。
同一句話在不同情境是不同的行動。「怎麼又在玩手機」可以是關心、提醒或指責，說的人想的是一種，聽的人收到的可能是另一種。溝通出錯多半不是誰不講理，而是雙方以為用的是同一個意思。這個節點教你先確認，再回應。|維根斯坦後期主張意義在於使用：一句話的意思由它在當下情境中的作用決定，而不是由字面決定。|聽到刺耳的話先停一下；用自己的話複述「你的意思是……嗎」；請對方說出具體希望你做什麼|先確認意思，再決定反應。
「我很失敗」「我很笨」是把一個局部結果放大成對整個人的判決。這種標籤無法處理，因為它沒有告訴你問題在哪。精確表徵是把標籤拆開：哪一科、哪種題型、哪個步驟出錯。問題越具體，能做的事越清楚。|認知治療稱為過度類化：從單一事件推出全面結論。模糊的標籤會遮住真正可調整的變數。|把標籤句改寫成「在什麼事上，發生了什麼」；把錯誤分類並數出各類的次數；先處理次數最多的那一類|拆得開的問題，才改得動。
「他三小時沒回」是事實，「他不在乎我」是推論，「這段友情完了」是評價。三者混在一起，人就會為自己編的故事難過。這個節點教你把一句話拆成三層，並且只對事實有把握，對推論保留其他可能。|組織學者阿吉里斯用「推論階梯」說明：人從觀察跳到結論只需一瞬間，而且事後會把結論當成親眼看到的事實。|寫下攝影機拍得到的部分；為同一事實列出三種解釋；選成本最低的方式查證，通常是直接問|看見的是事實，其餘都是待查的假設。
說孩子「懶」，接下來能做的只有責備；說「他寫數學十分鐘後就拿起手機」，接下來可以調整題目難度、手機位置或休息節奏。語言重構是把評價人的標籤，換成描述情境的句子，因為描述會帶出可以動手的選項。|心理學的基本歸因謬誤指出：我們習慣用性格解釋別人的行為，而低估環境與壓力的影響。換成情境語言可以修正這個偏差。|寫下你常用的一個標籤；改成何時、何地、做了什麼的描述；從描述裡找出一個可以改變的環境條件並試一週|把標籤換成描述，行動就出現了。
方法有效，是因為它適合當時的條件。條件變了，同一個方法就可能失效，而人往往最後才察覺，因為過去的成功讓人不想懷疑它。高一靠背單字拿高分，高三考的卻是長篇閱讀。這個節點教你定期檢查：任務的要求是否已經不一樣了。|易經以「變易」為前提，萬物持續變化。成功經驗會強化舊策略，使人把條件的改變誤讀為自己退步或不夠努力。|寫下這個方法當初為什麼有效；列出現在與當時不同的三個條件；針對差異最大的一項調整做法|先問條件變了沒，再問自己夠不夠努力。
別人的成功方法建立在別人的時間、資金、基礎與支持上。直接照抄，等於假設你和他站在同一個位置。位置辨識是先盤點自己有什麼、缺什麼、能承受多少損失，再決定哪一部分可以借用。適合自己的普通方法，勝過不適合的厲害方法。|易經重視「位」：同一爻在不同位置吉凶不同。我們又只看得到成功者，看不到用同樣方法失敗的人，這稱為倖存者偏差。|列出每週真正可用的時間與資源；寫下對方有而你沒有的條件；只保留在你的條件下也做得到的部分|先看自己站在哪裡，再決定學誰。
同一個決定，在情緒高峰時做和冷靜後做，品質差很多。時機判斷不是拖延，而是事先訂好條件：資訊到什麼程度就行動、等到哪一天為止、出現什麼就停手。對於難以回頭的決定，更需要把「何時決定」和「決定什麼」分開。|易經稱事情的微小徵兆為「幾」，主張見幾而作。心理學則發現人在強烈情緒下會高估這份感受持續的時間，因而做出事後後悔的選擇。|判斷這個決定能否回頭；不能回頭的，訂一個冷靜期與最晚決定日；寫下行動與停止的具體條件|可逆的快做，不可逆的定好條件再做。
堅持的對象應該是目標，不是方法。方法沒有產生預期效果時，加倍投入同一做法通常只會加倍消耗。策略切換是事先說好：試多久、看什麼指標、沒達到就換什麼。這樣換方法是照計畫執行，而不是半途而廢。|易經說「窮則變，變則通」。人不願換方法，常因為已經投入太多，這稱為沉沒成本，它讓人為了過去而犧牲未來。|寫下目標與目前的方法；訂一個檢查日期和一個可測量的指標；到期未達標就換一個變項再試，並記下結果|守住目標，放開方法。
象徵是能容納多種意思的圖像。高塔可以讓人想到崩毀，也可以讓人想到早該拆掉的舊結構。象徵素養是知道圖像的功能在於引發聯想、幫你想到平常沒想的事，而它本身不攜帶關於未來的資訊。把牌面當預告，就把工具用錯了地方。|模糊的圖像會引出觀看者自己的內容，這是它能用於反思的原因。籠統的解讀又容易讓人覺得很準，稱為巴納姆效應。|看到一個象徵先寫下三種不同解讀；把最讓你不安的那個轉成具體問題；回到現實資料去檢查這個問題|圖像負責提醒，事實負責回答。
同一張隱者牌，有人看到孤單，有人看到終於可以安靜。聯想的差異透露的是每個人此刻的需要，而不是牌的正確意思。這個節點教你把聯想當作關於自己的線索：我為什麼先想到這個？它指向我缺少什麼？同時記得，感受是真的，不代表外在事實就是如此。|聯想由個人記憶與當下情緒共同決定。心理學的投射測驗也運用這個原理，但它反映的是內在狀態，不能用來證明外在事件。|對一個圖像寫下三個詞與三種感受；問這些感受最近在生活哪裡出現過；把它整理成一句「我需要……」|我的聯想說的是我，不是世界。
「我會成功嗎」只有等待一種回應；「哪些因素會影響成功」卻可以立刻開始調查。問題的形式決定了注意力往哪裡去。提問設計是把封閉的、交給命運的問題，改成開放的、以自己為主詞的、能導向行動的問題。|康納曼與特沃斯基的框架效應研究顯示，同一件事換個問法，人的判斷就會改變。問題是思考的方向盤。|找出問句中的「會不會」「是不是」；改成「我可以如何」「哪些因素」；把新問題拆成一件本週能做的調查|問題換了，路就出現了。

夢到某人隔天就遇見，令人印象深刻。但一次應驗不能說明什麼，要問的是：我做過多少夢沒有應驗？相遇本來的機率有多高？證據判讀教你在事前寫下明確預測，之後把命中和未命中一起算。事後才發現的吻合，幾乎都找得到。|康納曼與特沃斯基稱之為小數法則的迷思：人太容易從極少的例子推出規律。事後解釋又能把模糊的內容說成準確。|事前寫下預測內容與期限；訂好怎樣算命中；累積到足夠筆數後計算命中率並與隨機猜測比較|先寫預測再看結果，連沒中的一起算。
只找支持自己的例子，任何信念都能維持下去。批判更新是反過來做：主動去找可能推翻它的資料，並且事先說好看到什麼就修改看法。這不是自我否定，而是讓信念經得起檢查。願意被證明是錯的想法，才有機會被證明是對的。|確認偏誤使人偏好支持既有信念的資訊。哲學家波普主張，好的主張必須說得出什麼情況會否定它。|寫下一個你相信的說法；寫出什麼結果會讓你改變想法；刻意找三個反例或反對意見並評估它們|找反證不是認輸，是讓信念升級。
「提高能量」「排毒」「增強免疫力」聽起來具體，其實沒有說出任何可以檢查的內容。精確定義是追問：這個詞指的是什麼？怎麼測量？改善多少算有效？說不出這三件事的宣稱，無從判斷真假，也就不值得為它付錢或改變行為。|物理學家布里奇曼提出操作型定義：一個概念的意義在於測量它的方法。模糊的詞能容納任何解讀，所以永遠不會錯，也永遠沒有內容。|圈出宣稱中的關鍵詞；問它的具體指標與測量方式是什麼；問有效與無效各長什麼樣子|說不出怎麼量，就還沒說清楚。
一個數字離開了單位、測量條件和參考範圍，就沒有意義。一次量到的血壓受姿勢、時間、情緒影響，不能代表整體健康；137 在物理學裡有明確的定義與脈絡，搬到別處就只是三個數字。參數辨識是看到數字先問：它量的是什麼、怎麼量的、和什麼比。|數值的意義來自它在模型中的角色。相同的數字在不同定義下代表不同的東西，數字相同不表示背後的機制相同。|確認單位與測量條件；找出正常範圍或比較基準；看多次測量的趨勢而不是單一數值|數字要連同單位、條件和比較對象一起讀。
「有研究證實」這句話的份量差別很大。細胞實驗、動物實驗、觀察性研究、隨機對照試驗、系統性回顧，能支持的結論強度依序提高。把細胞實驗的結果說成對人有療效，是最常見的誇大。證據分級是追到原始研究，看它實際研究了誰、比較了什麼、得出什麼。|實證醫學以證據等級區分研究設計的可靠程度。資訊每經過一次轉述，限制條件就容易被省略，結論則被放大。|找到原始來源而不是轉述；確認研究對象是細胞、動物還是人；看原文結論的措辭與作者列出的限制|先問研究了誰，再問證明了什麼。
每個理論都有它成立的範圍。量子力學描述微觀粒子，不能直接拿來解釋願望與財富；心理學的規律也不能套到電子上。跨領域借用概念可以帶來啟發，但那是比喻，不是證明。邊界辨識是對任何說法都多問一句：它在哪裡不適用？|統計學家博克斯說過，所有模型都是錯的，但有些有用。有用與否取決於使用的範圍。詞語相同不代表機制相同。|分清這個說法原本屬於哪個領域；確認它被搬到新領域時有沒有新的證據；寫出兩個它不適用的情況|知道一個說法不能解釋什麼，才算懂它。

const postRaw=`你有沒有發現，換了公司、換了朋友圈，卻總是遇到同一種人？

阿芸換過三份工作。每一份的開頭都很好，半年後她又成了那個「什麼都可以幫忙」的人：同事的報表她收尾，主管臨時的需求她接下，連聚餐訂位都是她。她常說自己運氣不好，老是遇到愛佔便宜的人。

直到有一天，新來的同事很自然地說：「這個我不方便，你找別人吧。」對方沒有生氣，事情也有人接手。阿芸愣住了。原來可以這樣說，而且天不會塌下來。

她回頭看那三份工作，發現共同點從來不是那些同事，而是她自己。每次有人開口，她心裡會先響起一句話：「拒絕的話，人家會不喜歡我。」這句話是很久以前學會的。小時候只要乖、只要幫忙，大人就會稱讚她。那時候，這個做法保護過她。

榮格把這種反覆上演的角色叫作原型。它像一齣早就寫好的劇本，場景一對上，人就自動開演。我們以為自己在面對新的人，其實是帶著舊劇本走進每一個新場景。

看見劇本，不是為了責怪自己。那個總是說好的你，曾經很努力地想被喜歡。只是現在的你，已經承受得起別人一時的失望，也值得被平等對待。

下一次，當那句「我來就好」快要脫口而出，先停一下問自己：這是我真的願意，還是劇本又開演了？

光是多出這一秒，你就已經不在原來的戲裡了。
@@
滑到朋友升遷的貼文，你按了讚，留了恭喜，然後放下手機，心裡悶悶的。

你可能會立刻罵自己：我怎麼這麼小心眼？然後更用力地告訴自己要替別人開心。可是那股悶還在，而且下次看到他，你會莫名地不想說話。

阿哲就是這樣。同期的同事升了主任，他嘴上說恭喜，回家卻對太太抱怨那個人「只會做表面」。太太問他：「你是不是也想升？」他愣了很久，才說：「我覺得想要這個很丟臉。」

原來他從小被教導要謙虛、不要爭，於是「我也想被看見」這個願望，被他收進了看不到的地方。可是它沒有消失，只是換了一張臉，變成對別人的不屑。

榮格說，這就是陰影：我們不准自己擁有的東西，會從別人身上回來找我們。你特別看不順眼的那個人，常常正好活出了你不敢要的樣子。

嫉妒沒有你想的那麼糟。它像一支箭頭，很準地指向你在乎的事。問題從來不是有這個感覺，而是我們急著把它壓下去，來不及聽它在說什麼。

所以下次心裡又悶起來的時候，先別急著批評自己。拿張紙寫三行：他做了什麼。我感覺到什麼。我其實想要什麼。

寫到第三行，你會發現那裡沒有壞人，只有一個等了很久、想被你承認的願望。

晚上十一點，手機亮了，是家長的訊息。你已經躺下了，但還是坐起來回覆，因為「好老師不會讓家長等」。

美玲老師這樣過了八年。假日回訊息，半夜回訊息，連出國都帶著筆電。大家都說她認真負責。她自己卻越來越常在開車上班的路上，莫名地想哭。

榮格說每個人都有人格面具，那是我們在社會上扮演的角色。老師、主管、好媽媽、可靠的同事。面具很有用，它讓我們知道在什麼場合該怎麼做。麻煩的是戴得太久，會以為那就是自己的臉。

孩子聽到這句話的時候，心裡出現的是：你又不相信我，我功課明明寫完了。

路還是要自己走。但有人先把地形畫出來，是一份很大的善意。

大的願望，要靠小的動作來接住。

把「我很爛」改寫成「我這次在哪一步出錯」。

在責備自己之前，先看看自己的處境。

每一個都不難，難的是在那個當下想得起來。

所以每個節點都幫你準備了幾樣東西：一段講解，告訴你這個能力是什麼。一個原理，告訴你人為什麼會卡在這裡。三個步驟，告訴你今天可以怎麼做。還有一句話，讓你在慌亂的時候抓得住。

第二步，找出你一直在用的那個舊想法。
第三步，檢查它可能錯在哪裡。
第四步，換一個新的想法，設計一個小小的行動。
第五步，先寫下你預期會怎樣，然後去做。
第六步，回來對答案，修正下一次。

進步有一個麻煩的地方：身在其中的人，感覺不到。

心的成長更是如此。你比去年更能聽完別人說話了，更少因為一句話就整晚睡不著了，更快從低潮裡回來了。可是你不記得，因為沒有人替你拍照。

所以我們需要一把尺。不是拿來和別人比的，是拿來替自己留下紀錄的。

零分，還沒有開始。
一分，我認得這個概念。
二分，有人提醒的時候，我做得到。
三分，我可以自己做到。

分數沒動，不要緊，那告訴你方法該換了。
分數退步，別慌，那常常是因為你看得更清楚了。

量得到的進步，才撐得過想放棄的那幾天。

function navigate(p){if(page==='practice'&&draft)capture();page=p;if(p!=='find'){$('gsearch').value='';gq=''}document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===(p==='course'?'courses':p==='detail'?'library':p)));$('breadcrumb').textContent=({home:'你的成長，從此刻開始',library:'8 個主題，32 個小練習',practice:'一件事，一小步，一點改變',plan:'把練習帶進生活',scores:'看見自己一點一點在進步',journal:'保留每一次模型改變',research:'概念、主張與來源分層保存',courses:'8 堂課 · 概念 → 練習 → 檢核 → 實作',course:'會員課程',find:'全站搜尋',atlas:'經典 · 結構 · 節點 · 能力 · 智慧',cards:'40 張中英雙語圖文卡',posts:'32 節點 · 24 經典 · 8 頁面主題'})[p]||'節點學習';({home,library,practice,plan,scores,detail,posts:postsPage,courses:coursesPage,course:courseDetail,find:findPage,atlas:atlasPage,cards:cardsPage}[p]||home)();if(pageRaw[p])app.insertAdjacentHTML('beforeend',postBox('p'+p,'本頁貼文｜'+pageRaw[p].title)+(tailCard[p]!==undefined?quoteCard('n',tailCard[p]):''));window.scrollTo({top:0,behavior:'instant'})}
function domainCard(d,i){const num=db.learned.filter(n=>nodes[n]?.domain===i).length;return `<article class="card"><span class="nodeid">${d.id} / ${d.tool}</span><h3>${d.title}</h3><p>${d.subtitle}。最要緊的一件事：${d.leverage}。</p><div class="row"><small>4 個節點 · 已練 ${num}/4</small><button class="linkbtn" data-course="${i}">開始學習 ↗</button></div><div class="progress"><span style="width:${num*25}%"></span></div></article>`}
function home(){app.innerHTML=`<section class="hero"><div><span class="eyebrow">看見 · 行動 · 更新</span><h1>讓理解更新你，<br>讓智慧成為能力。</h1><p class="muted">不用一次改變全部。從一件你在乎的小事開始，看清楚、試一下、再調整。你會一天比一天更懂自己。</p><div class="actions"><button class="primary" data-new="5">從一件小事開始　↗</button><button class="secondary" data-page="courses">八堂會員課程</button><button class="secondary" data-page="library">探索 32 個節點</button></div></div><div class="art" aria-hidden="true"><div class="orbit"></div><div class="orbit"></div><div class="orbit"></div><div class="seed"></div><label>每一次回饋，都讓可能性生長</label></div></section><div class="stats"><div class="stat"><strong>${db.courseDone.length} / 8</strong><small>學完的課</small></div><div class="stat"><strong>320</strong><small>個常見盲點提醒</small></div><div class="stat"><strong>${db.learned.length} / 32</strong><small>已經練過的節點</small></div><div class="stat"><strong>${db.records.filter(r=>!r.deleted&&r.feedback?.result).length}</strong><small>做完並回頭看的小實驗</small></div></div><div class="banner dark"><small>今天送你一句話</small><p style="margin:8px 0">有些事我選不了。但下一步怎麼走，我可以自己決定。</p><button class="secondary" style="color:white;border-color:#698171" data-new="24">找出我的下一步 →</button></div><div class="sectionhead"><h2>四步，把道理變成自己的</h2></div><div class="flow"><div><b>① 看見差異</b>同一件事，以前怎麼想？還可以怎麼想？兩者的差別，常常就是出口。</div><div><b>② 更新想法</b>挑一個比較幫得上忙的新想法，先試試看。</div><div><b>③ 練出能力</b>拿一件真的事，做一小步。做了才算數。</div><div><b>④ 留下智慧</b>回頭看結果，記住什麼時候該用、什麼時候不該用。</div></div>${quoteCard('n',Math.floor(Date.now()/864e5)%32)}<div class="sectionhead"><h2>八條路，陪你慢慢變好</h2><button class="linkbtn" data-page="plan">查看八週計畫 ↗</button></div><div class="grid">${domains.map(domainCard).join('')}</div>${db.draft?'<div class="banner"><div class="row"><span>你上次寫到一半，要不要接著寫？</span><button class="secondary" id="resume">接著寫 →</button></div></div>':''}`}
function library(){app.innerHTML=head('32 個節點','32 個小練習，需要時拿出來用。','每個節點都有白話講解、為什麼會這樣、今天可以怎麼做，還有生活裡的例子。')+`<div class="toolbar"><input id="search" aria-label="搜尋節點" placeholder="搜尋：語言、界線、學習、回饋…" value="${esc(search)}"><select id="domainFilter" aria-label="主題篩選"><option value="all">全部 8 個主題</option>${domains.map((d,i)=>`<option value="${i}" ${String(i)===filter?'selected':''}>${d.id} ${d.title}</option>`).join('')}</select><button class="secondary" id="viewToggle">${tableView?'切換卡片':'一頁總表'}</button></div><div id="results"></div>`;results()}
function results(){const list=nodes.map((n,i)=>({...n,index:i})).filter(n=>(filter==='all'||String(n.domain)===filter)&&JSON.stringify(n).includes(search.trim()));$('results').innerHTML=`<p class="hint">${list.length} 個節點。挑一個最像在說你的，從它開始。</p>`+(list.length?(tableView?`<div class="scrolltable"><table><thead><tr><th>節點</th><th>以前這樣想 → 現在這樣想</th><th>為什麼／最要緊的事</th><th>一句話／一小步／怎麼看有沒有用</th></tr></thead><tbody>${list.map(n=>`<tr><td><button class="linkbtn" data-node="${n.index}">${n.id} ${n.name}</button></td><td>${esc(n.old)}<br>↓<br>${esc(n.new)}</td><td>${esc(n.mechanism)}<br>最要緊：${esc(n.leverage)}</td><td>${esc(n.wisdom)}<br>${esc(n.action)}<br>觀察：${esc(n.metric)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="grid three">${list.map(n=>`<article class="card nodecard"><span class="nodeid">${n.id} · ${domains[n.domain].id}</span>${db.learned.includes(n.index)?' <span class="badge">✓ 練過了</span>':''}<h3>${n.name}</h3><p>${n.plain}</p><p class="diff"><s>${esc(n.old)}</s><br>→ ${esc(n.new)}</p><button class="linkbtn" data-node="${n.index}">看看怎麼做 <span>↗</span></button></article>`).join('')}</div>`):'<div class="empty">找不到耶，換個詞試試看。</div>')}
function detail(){const n=nodes[selected],d=domains[n.domain];app.innerHTML=`<button class="linkbtn" data-page="library">← 返回節點學院</button>`+head(`${n.id} / ${d.title}`,n.name,n.plain)+`<div class="tree"><strong>它在整張地圖的哪裡</strong><br>LifeOS → ${d.id} ${d.title} → ${n.id} ${n.name}<br>${n.tree}</div><div class="split" style="margin-top:20px"><div class="model"><small>以前這樣想</small><h3>${n.old}</h3></div><div class="model new"><small>現在可以這樣想</small><h3>${n.new}</h3></div></div><div class="flow"><div><b>差異</b>同一件事，兩種看法。差別就在「${n.leverage}」。</div><div><b>更新</b>把想法換成：${n.new}</div><div><b>能力</b>你會練到：${n.capability}</div><div><b>智慧</b>${n.wisdom}</div></div><div class="box"><span class="tag">白話講給你聽</span><h3>${n.lesson.key}</h3><p>${n.lesson.t}</p><h3>為什麼會這樣</h3><p>${n.lesson.why}</p><h3>今天可以怎麼做</h3><ol class="steplist">${n.lesson.how.map(s=>`<li>${s}</li>`).join('')}</ol></div>${quoteCard('n',selected)}${postBox('n'+selected,'本節點臉書貼文')}${n.domain===3?quoteList(selected-12):''}${wordNode(selected)}<div class="grid" style="margin-top:20px"><div class="card"><small>最要緊的一件事</small><h3>${n.leverage}</h3><p>${n.mechanism}。每個人的情況不一樣，記得回到自己的生活裡，看看合不合用。</p></div><div class="card"><small>帶得走的一句話</small><h3>${n.wisdom}</h3><p>你會練到：${n.capability}。</p></div></div><article class="box"><span class="tag">生活裡的例子</span><h3>${n.example}</h3><p>試著從「${n.old}」，慢慢換成「${n.new}」。先顧好一件事就好：${n.leverage}。</p><div class="split"><p><strong>今天就能做的一小步</strong><br>${n.action}</p><p><strong>怎麼知道有沒有用</strong><br>${n.metric}</p></div><p class="hint">${n.boundary}</p></article><div class="box"><span class="tag">換個場景也用得上</span>${n.transfer.map((s,i)=>`<p><strong>情境 ${i+1}</strong>　${esc(s)}</p>`).join('')}<p class="hint">同一招換個地方用用看，也留意它什麼時候不適合。</p></div><details class="box quiz"><summary>想試試看嗎？一題小練習</summary><h3>哪一句話，比較能讓事情往前走？</h3>${[n.old,n.new,'只要相信，就不用確認條件。'].map((s,i)=>[s,i]).sort((a,b)=>(a[1]+selected)%3-(b[1]+selected)%3).map(([s,i])=>`<button class="secondary" data-quiz="${i}">${esc(s)}</button>`).join('')}<p id="quizFeedback" role="status" class="hint">選一個看看。選完記得到生活裡真的試一次。</p></details><div class="box"><h3>十個常見的盲點，你中了哪一個？</h3><p class="hint">下面只是提醒，不是在說你錯。對照看看就好。</p>${errors.map((e,i)=>`<details><summary>${e.id} ${e.name} — ${n.diagnostics[i]}</summary><p>${e.question}</p><p>想一件真的發生過的事，問問自己：我有什麼根據？有沒有相反的例子？</p></details>`).join('')}</div><div class="banner"><strong>三步，把它變成你的</strong><p>換句話說：用你自己的話，把「${n.old}」改寫一次。<br>動手做：這個星期，找一天完成「${n.action}」。<br>再試一次：換一個場合，看看自己用不用得上。</p><button class="primary" data-new="${selected}">拿我自己的事來練習 ↗</button></div><details><summary>這些內容怎麼來的、什麼時候不適用</summary><p><a href="${SOURCE_URL}" target="_blank" rel="noopener">原始對話</a> · ${n.version}。這是把幾位思想家的想法借來生活裡用，他們並沒有一起提出這一套方法。</p><p>${n.level}。${n.boundary}</p></details>`}
function courseCard(c,i){return `<article class="card"><span class="nodeid">課程 ${c.n} · ${domains[i].id} ${domains[i].title}</span>${db.courseDone.includes(i)?' <span class="badge">✓ 已完成</span>':''}<h3>${c.t}</h3><p>${c.s}。${c.g}</p><button class="linkbtn" data-course="${i}">進入課程 <span>↗</span></button></article>`}
function nodeCard(n,i){return `<article class="card nodecard"><span class="nodeid">${n.id} · ${domains[n.domain].title}</span>${db.learned.includes(i)?' <span class="badge">✓ 練過了</span>':''}<h3>${n.name}</h3><p>${n.plain}</p><button class="linkbtn" data-node="${i}">看看怎麼做 <span>↗</span></button></article>`}
function coursesPage(){app.innerHTML=head('八堂課','八堂課，把抽象智慧練成能力。','一堂課一個主題。先讀懂，再練習，最後拿自己的事來試試看。')+`<div class="progress" style="margin:0 0 22px"><span style="width:${db.courseDone.length/8*100}%"></span></div><div class="grid">${courses.map(courseCard).join('')}</div>`}
function courseDetail(){const ex=courseExtra[course],c=courses[course],d=domains[course],done=db.courseDone.includes(course);app.innerHTML=`<button class="linkbtn" data-page="courses">← 返回八堂課程</button>`+head(`課程 ${c.n} / ${d.title}`,c.t,c.s+'。'+c.g)+`<div class="split"><div class="model"><small>以前這樣想</small><h3>${c.o}</h3></div><div class="model new"><small>現在可以這樣想</small><h3>${c.w}</h3></div></div><div class="flow"><div><b>差異</b>以前：${c.o}<br>現在：${c.w}</div><div><b>更新</b>${ex.u}</div><div><b>能力</b>${ex.a}</div><div><b>智慧</b>${ex.z}</div></div><div class="box"><h3>這個想法是誰提出的</h3><p>${ex.b}</p></div>${theoryBox(course)}${quoteCard('c',course)}${course===3?tarotSection():''}${wordCourse(course)}<div class="box"><h3>幾個重要的想法</h3>${c.c.concat(ex.c).map(x=>`<p><strong>${x[0]}</strong>　${x[1]}</p>`).join('')}</div><div class="split"><div class="box" style="margin:0"><h3>一步一步來</h3><ol class="steplist">${c.p.map(x=>`<li>${x}</li>`).join('')}</ol></div><div class="box" style="margin:0"><h3>問問自己</h3>${c.r.map(x=>`<p>${x}</p>`).join('')}<h3>小心別走偏</h3><p class="hint">${c.x}</p></div></div><div class="box"><h3>三個階段，慢慢來</h3>${['第一步 · 先看見','第二步 · 想一想','第三步 · 動手試'].map((t,i)=>`<p><span class="tag">${t}</span>　${ex.lv[i]}</p>`).join('')}</div><div class="box"><span class="tag">生活案例</span><p><strong>情境</strong>　${ex.cs.s}</p><p><strong>運用</strong>　${ex.cs.d}</p><p><strong>結果</strong>　${ex.cs.r}</p></div><div class="box"><h3>很多人以為……</h3>${ex.m.map(x=>`<div class="split" style="margin-bottom:12px"><div class="model"><small>很多人說</small><p>${x[0]}</p></div><div class="model new"><small>其實是這樣</small><p>${x[1]}</p></div></div>`).join('')}</div><div class="box quiz"><span class="eyebrow">小測驗 · ${1+ex.q.length} 題</span>${[c.k].concat(ex.q).map((k,qi)=>`<h3>${qi+1}. ${k.q}</h3>${k.a.map((a,i)=>`<button class="secondary" data-cquiz="${qi}-${i}">${a}</button>`).join('')}<p id="cq${qi}" role="status" class="hint">選一個看看。</p>`).join('')}</div><div class="box"><h3>想多讀一點</h3>${ex.rd.map(x=>`<p>${x}</p>`).join('')}</div><div class="sectionhead"><h2>三本經典的臉書貼文</h2></div>${[0,1,2].map(j=>postBox('b'+(course*3+j),bookRaw[course*3+j].title)).join('')}<div class="box"><h3>我的心得</h3><textarea id="courseNote" maxlength="6000" placeholder="想到什麼就寫，會自動存起來">${esc(db.courseNotes[course]||'')}</textarea><div class="actions"><button class="${done?'secondary':'primary'}" id="courseToggle">${done?'取消完成':'這堂課我學完了'}</button><button class="secondary" data-new="${course*4}">用「${d.tool}」實作 ↗</button></div></div><div class="sectionhead"><h2>這堂課可以練的 4 個節點</h2></div><div class="grid">${nodes.map((n,i)=>n.domain===course?nodeCard(n,i):'').join('')}</div><div class="actions">${course?`<button class="secondary" data-course="${course-1}">← 上一課</button>`:''}${course<7?`<button class="primary" data-course="${course+1}">下一課 →</button>`:''}</div><p class="hint">小提醒：${nodes[course*4].boundary}</p>`}
function findPage(){const q=gq.toLowerCase(),cs=courses.map((c,i)=>[c,i]).filter(x=>JSON.stringify([x[0],courseExtra[x[1]]]).toLowerCase().includes(q)),ns=nodes.map((n,i)=>[n,i]).filter(x=>JSON.stringify(x[0]).toLowerCase().includes(q));app.innerHTML=head('搜尋結果',`「${esc(gq)}」`,`${cs.length} 堂課程 · ${ns.length} 個節點（含案例與錯誤診斷）`)+(cs.length+ns.length?`<div class="grid">${cs.map(x=>courseCard(x[0],x[1])).join('')}</div><div class="grid three" style="margin-top:18px">${ns.map(x=>nodeCard(x[0],x[1])).join('')}</div>`:'<div class="empty">找不到耶，換個詞試試看。</div>')}
function nodePost(i){const n=nodes[i],l=n.lesson;return `【${l.key}】\n${quoteEn[i]}\n\n${postRaw[i]}\n\n▍講解\n${l.t}\n\n▍另一個例子\n${n.example}\n\n▍排比金句\n看見「${n.leverage}」，是更新。\n練習「${n.capability}」，是能力。\n記得「${n.wisdom}」，是智慧。\n\n▍更新\n從「${n.old}」，走到「${n.new}」。\n\n▍能力\n${n.plain}\n\n▍智慧\n${n.mechanism}。${l.why}\n\n▍三個常見盲點\n・${n.diagnostics[0]}\n・${n.diagnostics[1]}\n・${n.diagnostics[2]}\n\n▍這週試試\n${l.how.map((s,j)=>`${j+1}. ${s}`).join('\n')}\n最小行動：${n.action}\n觀察指標：${n.metric}\n\n▍換個場景也適用\n・${n.transfer[0]}\n・${n.transfer[1]}\n\n更新・能力・智慧，一次練一點。\nUpdate, ability, wisdom: a little at a time.\n\n小提醒：${n.boundary}\n\n#更新學院 #LifeOS #${domains[n.domain].title} #${n.name} #心理成長 #selfgrowth`}
function bookPost(j){const b=bookRaw[j],i=Math.floor(j/3),ex=courseExtra[i],pn=nodes[i*4+j%3];return `【${b.zh}】\n${b.en}\n\n${b.title}\n\n${b.core}\n\n▍它屬於哪個理論\n${ex.b}\n\n▍搭配練習的能力：${pn.name}\n${pn.lesson.t}\n${pn.lesson.how.map((s,k)=>`${k+1}. ${s}`).join('\n')}\n\n▍排比金句\n讀懂它，是更新：${ex.u}\n用上它，是能力：${ex.a}\n記住它，是智慧：${ex.z}\n\n▍讀完可以試試\n${ex.lv[j%3]}\n\n▍常見誤解\n有人說：${ex.m[j%2][0]}\n其實：${ex.m[j%2][1]}\n\n#更新學院 #LifeOS #${domains[i].title} #閱讀 #心理成長 #selfgrowth`}
function postText(k){const t=k[0],v=k.slice(1);return t==='n'?nodePost(Number(v)):t==='b'?bookPost(Number(v)):pageRaw[v].text.replace('\n\n#','\n\n更新・能力・智慧，一次練一點。\nUpdate, ability, wisdom: a little at a time.\n\n#')}
function postBox(k,title,open){const t=postText(k);return `<details class="box" ${open?'open':''}><summary><span class="tag">臉書貼文 · ${[...t].length} 字</span>　${title}</summary><p style="white-space:pre-wrap">${esc(t)}</p><div class="actions"><button class="primary" data-post="${k}">複製貼文</button>${k[0]==='n'?`<button class="secondary" data-qdl="${k}">下載配圖</button>`:''}</div></details>`}

function savedBox(){const rs=db.records.filter(r=>!r.deleted);return `<details class="box"><summary>已儲存的生活實驗（${rs.length}）與備份</summary>${rs.slice().reverse().map(r=>`<p>${nodes[r.node].id} ${nodes[r.node].name}｜${esc(r.date)}｜${esc((r.values.event||'').slice(0,40))}　<span class="badge">${r.feedback?.result?'已有回饋':'等待回饋'}</span> <button class="secondary" data-edit="${r.id}">編輯／補回饋</button></p>`).join('')||'<p class="hint">還沒有紀錄。</p>'}<div class="actions"><button class="secondary" id="exportJSON">匯出完整備份</button><button class="secondary" id="exportTXT">匯出文字紀錄</button><button class="secondary" id="importJSON">匯入備份</button><input type="file" id="importFile" accept=".json,application/json" hidden></div></details>`}

function wrapText(x,text,max,byWord){const out=[];let line='';for(const t of byWord?text.split(' '):[...text]){const test=byWord&&line?line+' '+t:line+t;if(x.measureText(test).width>max&&line){out.push(line);line=t}else line=test}if(line)out.push(line);return out}
function drawCard(q){const p=palettes[q.d],cv=document.createElement('canvas');cv.width=cv.height=1080;const x=cv.getContext('2d'),g=x.createLinearGradient(0,0,1080,1080),fz='bold 62px "Microsoft JhengHei","PingFang TC",sans-serif',fe='italic 38px Georgia,serif';g.addColorStop(0,p[0]);g.addColorStop(1,p[1]);x.fillStyle=g;x.fillRect(0,0,1080,1080);x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=3;x.strokeRect(50,50,980,980);x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.font=fz;const zl=wrapText(x,q.zh,800,false);x.font=fe;const el=wrapText(x,q.en,800,true);let y=520-(zl.length*96+60+el.length*58)/2+48;x.font=fz;for(const l of zl){x.fillText(l,540,y);y+=96}y+=41;x.font=fe;x.globalAlpha=.92;for(const l of el){x.fillText(l,540,y);y+=58}x.globalAlpha=.75;x.font='28px "Microsoft JhengHei","PingFang TC",sans-serif';x.fillText('更新學院 LifeOS · '+q.tag,540,975);return cv}

function cardsPage(){app.innerHTML=head('雙語圖文卡','一句話，帶著走。','8 個理論與 32 個節點各一張中英雙語圖文卡。可下載 1080×1080 圖片，並複製貼文文字貼到臉書。')+domains.map((d,i)=>`<h2>${d.id} ${d.title}</h2><div class="grid">${quoteCard('c',i)}${nodes.map((n,j)=>n.domain===i?quoteCard('n',j):'').join('')}</div>`).join('')}
const fields=[['event','發生了什麼事？（只寫看得到、聽得到的）'],['old','我原本是怎麼想的？'],['goal','我希望事情變成怎樣？'],['evidence','哪些是我確定的？哪些其實還不知道？'],['alternatives','這件事還可以怎麼解釋？寫三種，各有什麼根據？'],['boundary','看到什麼，我會願意改變想法？'],['new','我想試試看的新想法'],['action','我要做的一小步：做什麼、多久、在哪裡？'],['prediction','先猜猜看：什麼時候，會看到什麼不一樣？'],['metric','我要看什麼來判斷有沒有用？現在是多少？'],['retest','哪一天回來看結果？']];
function start(i){selected=i;editId=null;step=0;draft={node:i,values:{},scan:Array(10).fill('待確認'),proof:Array(10).fill(''),priority:'',version:1};db.draft=draft;persist();navigate('practice')}
function textField(k,l,v='',type='text'){return `<label class="field" for="${k}">${l}</label>${type==='date'?`<input class="full" type="date" id="${k}" value="${esc(v)}">`:`<textarea id="${k}" maxlength="6000">${esc(v)}</textarea>`}`}
function practice(){if(!draft){app.innerHTML=head('生活更新工作台','從一件真的發生的事開始。','這裡不會替你做決定，只會陪你一步一步把事情看清楚。')+`<div class="box"><label class="field" for="pickNode">今天想練哪一個？</label><select class="full" id="pickNode">${nodes.map((n,i)=>`<option value="${i}" ${i===selected?'selected':''}>${n.id} ${n.name} · ${domains[n.domain].title}</option>`).join('')}</select><div class="actions"><button class="primary" id="begin">開始寫</button>${db.draft?'<button class="secondary" id="resume">接著上次寫</button>':''}</div></div><div id="postWrap">${postBox('n'+selected,nodes[selected].id+' '+nodes[selected].name,true)}</div>${savedBox()}<div class="grid">${domains.map((d,i)=>`<div class="card"><small>${d.id}</small><h3>${d.tool}</h3><p>${toolPrompts[i].join(' → ')}</p><button class="linkbtn" data-new="${i*4}">用這個開始 ↗</button></div>`).join('')}</div>`;return}selected=draft.node;const n=nodes[selected];app.innerHTML=head(`${n.id} / ${domains[n.domain].tool}`,['先把事情看清楚','對照十個常見盲點','換個想法，試一小步','回頭看看，再調整'][step],`最要緊的一件事：${n.leverage}。你寫的會自動存起來。`)+`<div class="steps">${[0,1,2,3].map(i=>`<span class="${i<=step?'done':''}"></span>`).join('')}</div><div class="wide">${step===0?`<div class="banner"><small>給你參考的例子</small><p>${n.example}</p><p>${n.old} → ${n.new}</p></div>${fields.slice(0,4).map(([k,l])=>textField(k,l,draft.values[k])).join('')}<details class="box"><summary>${domains[n.domain].tool} · 專屬提問</summary>${toolPrompts[n.domain].map((p,i)=>textField('tool'+i,p,draft.values['tool'+i])).join('')}</details>`:step===1?`<div class="banner">一個一個對照看看。有中的就寫下根據，最後選一個最想先處理的。這只是提醒，不是在替你打分數。</div>${errors.map((e,i)=>`<div class="diagnostic"><div><strong>${e.id} ${e.name}</strong><p>${e.question}</p><small>例如：${n.diagnostics[i]}</small></div><select id="scan${i}" aria-label="${e.id} 證據狀態">${['待確認','有證據','不適用'].map(s=>`<option ${draft.scan[i]===s?'selected':''}>${s}</option>`).join('')}</select><textarea id="proof${i}" aria-label="${e.id} 支持與反對資料" placeholder="我的根據是什麼？還有什麼不確定？">${esc(draft.proof[i])}</textarea></div>`).join('')}<label class="field" for="priority">我想先處理哪一個？</label><select class="full" id="priority"><option value="">尚未選擇</option>${errors.map(e=>`<option value="${e.id}" ${draft.priority===e.id?'selected':''}>${e.id} ${e.name}</option>`).join('')}</select><p class="hint">選那個影響最大、又最有機會改得動的。</p>`:step===2?`<div class="banner"><small>給你參考，照自己的情況改</small><p>可以這樣想：${n.new}<br>可以這樣做：${n.action}<br>可以看這個：${n.metric}</p><p class="hint">這是事先寫好的提示，不是電腦替你分析的結果。</p></div>${fields.slice(4).map(([k,l])=>textField(k,l,draft.values[k],k==='retest'?'date':'text')).join('')}`:`<div class="banner">先存起來，去做做看。做完再回來寫結果，之前寫的都會留著。</div><div class="box"><h3>${n.id} ${n.name} · v${draft.version}</h3><p>${esc(draft.values.event)}</p><p>${esc(draft.values.old)} → ${esc(draft.values.new)}</p><p>行動：${esc(draft.values.action)}<br>預測：${esc(draft.values.prediction)}<br>回頭看的日子：${esc(draft.values.retest||'還沒決定')}</p></div>${textField('result','後來怎麼樣了？（之後再寫也可以）',draft.feedback?.result)}${textField('error','和我原本猜的，差在哪裡？（之後再寫也可以）',draft.feedback?.error)}${textField('update','下次我想怎麼想、怎麼做？（之後再寫也可以）',draft.feedback?.update)}`}${postBox('n'+selected,'本節點臉書貼文')}<p id="notice" role="status"></p><div class="actions"><button class="secondary" id="prev">${step?'上一步':'返回首頁'}</button>${step<3?'<button class="primary" id="next">下一步 →</button>':'<button class="primary" id="saveRecord">存起來</button>'}<button class="linkbtn" id="leaveDraft">先寫到這，下次再繼續</button></div></div>`}
function capture(){if(!draft||page!=='practice')return;for(const [k] of fields)if($(k))draft.values[k]=$(k).value;for(let i=0;i<4;i++)if($('tool'+i))draft.values['tool'+i]=$('tool'+i).value;for(let i=0;i<10;i++){if($('scan'+i))draft.scan[i]=$('scan'+i).value;if($('proof'+i))draft.proof[i]=$('proof'+i).value}if($('priority'))draft.priority=$('priority').value;for(const k of ['result','error','update'])if($(k)){draft.feedback??={};draft.feedback[k]=$(k).value}draft.editId=editId;draft.step=step;db.draft=JSON.parse(JSON.stringify(draft));persist()}
function validateStep(){if(step===0&&['event','old','goal'].some(k=>!draft.values[k]?.trim()))return '先寫下發生的事、原本的想法，還有你希望的結果喔。';if(step===1){const missing=draft.scan.findIndex((s,i)=>s==='有證據'&&!draft.proof[i]?.trim());if(missing>=0)return `E${missing+1} 你選了「有證據」，寫一點根據，或改成「待確認」吧。`;if(!draft.priority)return '選一個你最想先處理的盲點吧。';if(draft.scan[Number(draft.priority.slice(1))-1]==='不適用')return '這一項你標了「不適用」，換一個吧。'}if(step===2&&['alternatives','new','action','prediction','metric','retest'].some(k=>!draft.values[k]?.trim()))return '這一頁每一格都寫一點，再往下走喔。';return ''}
function saveRecord(){capture();const r=db.records.find(r=>r.id===editId);if(r){const {history,...snapshot}=r;const oldHistory=[...(history||[]),JSON.parse(JSON.stringify(snapshot))];Object.assign(r,{...draft,id:editId,version:r.version+1,date:today(),history:oldHistory})}else db.records.push({...draft,id:uid(),date:today(),history:[]});db.draft=null;draft=null;editId=null;persist();toast('存好了，去試試看吧！');navigate('practice')}
function plan(){app.innerHTML=head('七天與八週','每天一點點，就會不一樣。','先用七天暖身，再用八週慢慢走。每天寫一點點就好。')+`${loopBox()}<h2>七天暖身</h2>${sevenDays.map((task,i)=>{const d=db.days.find(x=>x.day===i)||{};return `<div class="box day"><strong>DAY<br>0${i+1}</strong><div><h3>${task}</h3><textarea id="day${i}" placeholder="今天我發現了什麼？" aria-label="第${i+1}天練習">${esc(d.text||'')}</textarea><div class="actions"><label><input type="checkbox" id="daydone${i}" ${d.done?'checked':''}>今天做到了</label><button class="secondary" data-day="${i}">存起來</button><small>${esc(d.date||'')}</small></div></div></div>`}).join('')}<h2>八週，一週一個主題</h2><div class="grid">${domains.map((d,i)=>`<div class="card"><small>WEEK 0${i+1}</small><h3>${d.title}</h3><p>${weeklyTasks[i]}</p><p class="hint">讀懂 → 寫下來 → 做做看 → 回頭看</p><button class="linkbtn" data-domain="${i}">本週4個節點 ↗</button></div>`).join('')}</div><div class="banner">每天 10 到 15 分鐘就夠了。第 1、4、8 週，還有結束後一個月，回來替自己打個分數。慢一點沒關係，照你的步調來。</div>`}
function scores(){const last=db.scores.at(-1);app.innerHTML=head('能力成長','看看自己走了多遠。','八個小項目，替現在的自己打個分數。分數不代表你好不好，只是幫你看見自己的進步。')+`<div class="banner">0 還沒開始 · 1 聽得懂 · 2 有人提醒就做得到 · 3 自己做得到 · 4 換個場合也做得到</div><div class="box">${capabilities.map((c,i)=>`<div class="rating"><label for="score${i}">${c}</label><select id="score${i}">${[0,1,2,3,4].map(s=>`<option value="${s}" ${last?.values[i]===s?'selected':''}>${s} 分</option>`).join('')}</select></div>`).join('')}${textField('scoreEvidence','為什麼打這個分數？寫一件真的發生的事')}<div class="actions"><button class="primary" id="saveScores">存下這次的分數</button></div></div>${last?`<div class="box"><h3>最近一次 · ${last.date} · ${last.values.reduce((a,b)=>a+b,0)} / 32</h3>${last.values.map((s,i)=>`<div class="scorebar"><label>${capabilities[i].split('：')[0]}</label><div class="progress"><span style="width:${s*25}%"></span></div><span>${s}/4</span></div>`).join('')}</div>`:''}<h2>我走過的路</h2>${db.scores.length?db.scores.slice().reverse().map(s=>`<div class="box"><div class="row"><strong>${s.date}</strong><span class="badge">${s.values.reduce((a,b)=>a+b,0)} / 32</span></div><p>${esc(s.evidence)}</p><small>${s.values.map((v,i)=>capabilities[i].split('：')[0]+' '+v).join(' · ')}</small></div>`).join(''):'<div class="empty">打下第一次分數，以後就看得到自己的進步。</div>'}`}
function recordText(r){return `${nodes[r.node].id} ${nodes[r.node].name}｜${r.date}｜v${r.version}\n`+fields.map(([k,l])=>`${l}：${r.values[k]||''}`).join('\n')+`\n優先錯誤：${r.priority}\n`+r.scan.map((s,i)=>`${errors[i].id} ${errors[i].name}：${s} ${r.proof[i]}`).join('\n')+`\n結果：${r.feedback?.result||''}\n誤差：${r.feedback?.error||''}\n更新：${r.feedback?.update||''}`}
function download(t,n,type){const url=URL.createObjectURL(new Blob([t],{type}));const a=document.createElement('a');a.href=url;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;results()}if(e.target.id==='gsearch'){const v=e.target.value.trim();if(!v)navigate('home');else{gq=v;if(page==='find')findPage();else navigate('find')}return}if(e.target.id==='courseNote'){db.courseNotes[course]=e.target.value;persist()}if(page==='practice')capture()});document.addEventListener('change',e=>{if(e.target.id==='pickNode'){selected=Number(e.target.value);$('postWrap').innerHTML=postBox('n'+selected,nodes[selected].id+' '+nodes[selected].name,true)}if(e.target.id==='importFile'&&e.target.files[0]){const f=new FileReader();f.onload=()=>{try{const s=JSON.parse(f.result);if(!s||s.schema!==2||!Array.isArray(s.records))throw 0;if(!confirm('匯入會取代目前此瀏覽器中的全部紀錄，確定嗎？'))return;for(const k of ['records','scores','learned','days','claims','courseDone'])db[k]=Array.isArray(s[k])?s[k]:[];db.courseNotes=s.courseNotes&&typeof s.courseNotes==='object'?s.courseNotes:{};db.draft=s.draft||null;persist();toast('備份已匯入。');navigate('practice')}catch{toast('這不是有效的 LifeOS 備份檔。')}};f.readAsText(e.target.files[0]);return}if(e.target.id==='domainFilter'){filter=e.target.value;results()}if(page==='practice')capture()});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.page){navigate(d.page);return}if(d.domain!==undefined){filter=d.domain;search='';navigate('library');return}if(d.node!==undefined){selected=Number(d.node);navigate('detail');return}if(d.course!==undefined){course=Number(d.course);navigate('course');return}if(d.wq){const [i,j]=d.wq.split('-').map(Number),a=document.createElement('a');a.href=drawCard({zh:wd.courses[i].quotes[j],en:'',tag:domains[i].title,d:i}).toDataURL('image/png');a.download='LifeOS金句-D'+(i+1)+'-'+String(j+1).padStart(2,'0')+'.png';a.click();toast('圖片已下載。');return}if(d.wqcopy||b.id==='copyLog'){let t;if(b.id==='copyLog')t=loopText();else{const [i,k]=d.wqcopy.split('-');t=wd.courses[Number(i)].quotes.map((q,j)=>[q,j]).filter(x=>k==='a'||x[1]%4===Number(k)).map(x=>(x[1]+1)+'. '+x[0]).join('\n')}try{await navigator.clipboard.writeText(t);toast('已複製。')}catch{download(t,'LifeOS複製內容.txt','text/plain;charset=utf-8');toast('無法複製，改為下載文字檔。')}return}if(d.tq!==undefined){const i=Number(d.tq),k=Math.floor(i/25),a=document.createElement('a');a.href=drawCard({zh:tarotQ[i],en:'',tag:nodes[12+k].id+' '+nodes[12+k].name,d:3}).toDataURL('image/png');a.download='LifeOS金句-'+String(i+1).padStart(3,'0')+'.png';a.click();toast('圖片已下載。');return}if(d.tqcopy!==undefined){const k=Number(d.tqcopy),t=tarotQ.slice(k*25,k*25+25).map((q,j)=>(k*25+j+1)+'. '+q).join('\n');try{await navigator.clipboard.writeText(t);toast('已複製 25 句。')}catch{download(t,'LifeOS金句.txt','text/plain;charset=utf-8');toast('無法複製，改為下載文字檔。')}return}if(d.post){const t=postText(d.post);try{await navigator.clipboard.writeText(t);toast('貼文已複製，可直接貼到臉書。')}catch{download(t,'LifeOS貼文.txt','text/plain;charset=utf-8');toast('無法複製，改為下載文字檔。')}return}if(d.qdl){const q=cardData(d.qdl[0],Number(d.qdl.slice(1))),a=document.createElement('a');a.href=drawCard(q).toDataURL('image/png');a.download='LifeOS圖文-'+q.tag+'.png';a.click();toast('圖片已下載。');return}if(d.qcp){const t=cardCaption(cardData(d.qcp[0],Number(d.qcp.slice(1))));try{await navigator.clipboard.writeText(t);toast('貼文已複製，可直接貼到臉書。')}catch{download(t,'LifeOS貼文.txt','text/plain;charset=utf-8');toast('無法複製，改為下載文字檔。')}return}if(d.cquiz!==undefined){const [qi,ai]=d.cquiz.split('-').map(Number),k=[courses[course].k].concat(courseExtra[course].q)[qi],ok=ai===k.i;$('cq'+qi).textContent=ok?'✓ '+k.y:'差一點點，再想想看。';return}if(b.id==='courseToggle'){const i=db.courseDone.indexOf(course);if(i<0)db.courseDone.push(course);else db.courseDone.splice(i,1);persist();courseDetail();return}if(d.new!==undefined){if(db.draft){draft=JSON.parse(JSON.stringify(db.draft));editId=draft.editId||null;step=draft.step||0;navigate('practice');toast('你上次還沒寫完，先接著寫吧。')}else start(d.new==='selected'?selected:Number(d.new));return}if(d.quiz!==undefined){const ok=Number(d.quiz)===1;$('quizFeedback').textContent=ok?`✓ 對了。這樣說沒有否認問題，卻讓你看得到下一步：${nodes[selected].leverage}。`:`這句話容易把猜測當成事實。再看看「${nodes[selected].new}」，它是不是多給了你一點空間？`;if(ok&&!db.learned.includes(selected)){db.learned.push(selected);persist()}return}if(b.id==='viewToggle'){tableView=!tableView;library()}if(b.id==='begin')start(Number($('pickNode').value));if(b.id==='resume'){draft=JSON.parse(JSON.stringify(db.draft));editId=draft.editId||null;step=draft.step||0;navigate('practice')}if(b.id==='next'){capture();const msg=validateStep();if(msg){$('notice').textContent=msg;return}step++;practice()}if(b.id==='prev'){capture();if(step){step--;practice()}else navigate('home')}if(b.id==='leaveDraft'){capture();draft=null;navigate('home');toast('幫你留著了，隨時回來。')}if(b.id==='saveRecord')saveRecord();if(d.day!==undefined){const i=Number(d.day),text=$('day'+i).value.trim(),done=$('daydone'+i).checked;if(done&&!text){toast('寫一句今天的發現，再打勾喔。');return}const r={day:i,text,done,date:today()},found=db.days.find(x=>x.day===i);if(found)Object.assign(found,r);else db.days.push(r);persist();toast('存好了，今天辛苦了。');plan()}if(b.id==='saveScores'){const evidence=$('scoreEvidence').value.trim();if(!evidence){toast('寫一件真的發生的事，分數才有意義喔。');return}db.scores.push({id:uid(),date:today(),values:capabilities.map((_,i)=>Number($('score'+i).value)),evidence});persist();scores();toast('存好了。')}if(d.edit){if(db.draft){toast('請先完成草稿，再編輯另一筆。');return}const r=db.records.find(x=>x.id===d.edit);editId=r.id;draft=JSON.parse(JSON.stringify(r));draft.version=r.version+1;step=3;navigate('practice')}if(d.trash){db.records.find(x=>x.id===d.trash).deleted=true;persist();journal();toast('已移至回收區，可復原。')}if(d.restore){db.records.find(x=>x.id===d.restore).deleted=false;persist();journal()}if(d.copy){try{await navigator.clipboard.writeText(recordText(db.records.find(r=>r.id===d.copy)));toast('已複製。')}catch{download(recordText(db.records.find(r=>r.id===d.copy)),'LifeOS-紀錄.txt','text/plain;charset=utf-8');toast('改為下載文字。')}}if(b.id==='importJSON')$('importFile').click();if(b.id==='exportJSON')download(JSON.stringify({schema:2,...db,legacy},null,2),'LifeOS-完整備份.json','application/json');if(b.id==='exportTXT')download(db.records.filter(r=>!r.deleted).map(recordText).join('\n\n────────\n\n')||'尚無紀錄','LifeOS-更新紀錄.txt','text/plain;charset=utf-8');if(b.id==='saveClaim'){const claim=$('claim').value.trim(),source=$('claimSource').value.trim();if(!claim||!source){toast('請填寫主張與來源。');return}db.claims.push({id:uid(),claim,source,level:$('claimLevel').value,limit:$('claimLimit').value,date:today()});persist();research();toast('研究卡已儲存。')}});
window.addEventListener('beforeunload',()=>{if(page==='practice')capture()});navigate('home');
</script></body></html>
