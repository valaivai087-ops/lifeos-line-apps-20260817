<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>學生資料整合查詢｜公開示範版</title>
<style>
:root{--ink:#16324f;--muted:#687b8e;--line:#dce6ee;--bg:#f4f7fa;--paper:#fff;--accent:#176b87;--accent2:#dff3f2;--warm:#fff3d9;--danger:#a33a3a;--shadow:0 12px 34px rgba(22,50,79,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}button,input,select{font:inherit}.shell{max-width:1280px;margin:auto;padding:28px 22px 60px}.hero{background:linear-gradient(135deg,#123b58,#176b87);color:#fff;border-radius:24px;padding:28px 30px;box-shadow:var(--shadow)}.hero-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.eyebrow{font-size:13px;letter-spacing:.16em;opacity:.75;margin:0 0 8px}.hero h1{font-size:clamp(26px,4vw,42px);line-height:1.18;margin:0}.hero p{max-width:720px;margin:12px 0 0;opacity:.84}.count{min-width:125px;text-align:right}.count b{font-size:34px;display:block}.privacy{margin:18px 0 0;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.1);font-size:13px}.toolbar{display:grid;grid-template-columns:minmax(240px,1fr) 220px 180px auto;gap:10px;margin:20px 0}.control{height:48px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:0 14px;outline:none}.control:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(23,107,135,.14)}.search-wrap{position:relative}.search-wrap input{width:100%;padding-left:44px}.search-wrap svg{position:absolute;left:15px;top:15px;color:var(--muted)}.clear{border:0;background:var(--accent2);color:var(--accent);padding:0 16px;font-weight:700;cursor:pointer}.meta{display:flex;justify-content:space-between;gap:16px;align-items:center;margin:14px 2px;color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}.student{border:1px solid var(--line);background:var(--paper);border-radius:17px;padding:18px;box-shadow:0 3px 12px rgba(22,50,79,.04);cursor:pointer;text-align:left;color:inherit;transition:.16s transform,.16s box-shadow}.student:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.student:focus-visible{outline:3px solid rgba(23,107,135,.28)}.student-head{display:flex;gap:12px;align-items:center}.avatar{width:46px;height:46px;border-radius:14px;background:var(--accent2);display:grid;place-items:center;color:var(--accent);font-size:19px;font-weight:800;flex:0 0 auto}.student h2{font-size:18px;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:3px}.badge{display:inline-block;margin-top:14px;padding:6px 9px;border-radius:8px;background:#edf3f7;color:#496175;font-size:12px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.fact{background:#f7f9fb;border-radius:9px;padding:8px 10px}.fact small{display:block;color:var(--muted);font-size:11px}.fact span{font-size:14px}.empty{grid-column:1/-1;background:var(--paper);border:1px dashed var(--line);border-radius:18px;padding:50px;text-align:center;color:var(--muted)}dialog{width:min(900px,calc(100% - 26px));max-height:90vh;border:0;padding:0;border-radius:20px;color:var(--ink);box-shadow:0 28px 80px rgba(9,30,48,.26)}dialog::backdrop{background:rgba(9,30,48,.62)}.modal-head{position:sticky;top:0;background:var(--paper);z-index:2;display:flex;justify-content:space-between;gap:16px;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:23px}.modal-head p{margin:4px 0 0;color:var(--muted);font-size:13px}.close{border:0;background:#edf3f7;width:42px;height:42px;border-radius:50%;cursor:pointer;color:var(--ink);font-size:22px}.modal-body{padding:18px 22px 28px;background:#f8fafc}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.detail{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}.detail.wide{grid-column:1/-1}.detail dt{font-size:12px;color:var(--muted);margin-bottom:6px}.detail dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}.blank{color:#a1aebb}.footer-note{text-align:center;color:var(--muted);font-size:12px;margin-top:24px}@media(max-width:760px){.shell{padding:16px 12px 36px}.hero{border-radius:18px;padding:22px 18px}.hero-top{display:block}.count{text-align:left;margin-top:18px}.toolbar{grid-template-columns:1fr 1fr}.search-wrap{grid-column:1/-1}.clear{height:46px}.meta{align-items:flex-start;flex-direction:column}.detail-grid{grid-template-columns:1fr}.detail.wide{grid-column:auto}}@media(max-width:430px){.toolbar{grid-template-columns:1fr}.search-wrap{grid-column:auto}.hero h1{font-size:27px}}
</style>
</head>
<body>
<main class="shell">
  <section class="hero">
    <div class="hero-top"><div><p class="eyebrow">STUDENT PROFILE ARCHIVE</p><h1>學生資料整合查詢</h1><p>整合班級生活、導師理解、英文學習與生涯規劃問卷。輸入任何關鍵字即可搜尋全部回覆內容。</p></div><div class="count"><b id="totalCount">0</b><span>筆回覆資料</span></div></div>
    <div class="privacy">🔒 公開示範版：所有真實學生資料均已移除，目前僅含虛構示範資料。</div>
  </section>
  <section class="toolbar" aria-label="資料篩選">
    <label class="search-wrap"><span hidden>搜尋全部欄位</span><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input id="search" class="control" type="search" placeholder="搜尋姓名、班級、座號或任何回答…" autocomplete="off"></label>
    <select id="sourceFilter" class="control" aria-label="問卷來源"><option value="">全部問卷來源</option></select>
    <select id="classFilter" class="control" aria-label="班級"><option value="">全部班級</option></select>
    <button id="clear" class="control clear" type="button">清除篩選</button>
  </section>
  <div class="meta"><span id="resultText" aria-live="polite"></span><span>點選學生卡片查看完整回覆</span></div>
  <section id="grid" class="grid" aria-label="學生回覆列表"></section>
  <p class="footer-note">資料依原始回覆呈現，空白欄位標示為「未填寫」。</p>
</main>
<dialog id="detailDialog"><div class="modal-head"><div><h2 id="dialogName"></h2><p id="dialogMeta"></p></div><button id="closeDialog" class="close" type="button" aria-label="關閉">×</button></div><div id="dialogBody" class="modal-body"></div></dialog>
<script id="records-data" type="application/json">[{"id":1,"source":"公開示範資料","sourceRow":1,"name":"示範學生 A","className":"示範班","seat":"01","studentId":"DEMO001","gender":"","school":"LifeOS Demo","timestamp":"","fields":[]},{"id":2,"source":"公開示範資料","sourceRow":2,"name":"示範學生 B","className":"示範班","seat":"02","studentId":"DEMO002","gender":"","school":"LifeOS Demo","timestamp":"","fields":[]},{"id":3,"source":"公開示範資料","sourceRow":3,"name":"示範學生 C","className":"示範班","seat":"03","studentId":"DEMO003","gender":"","school":"LifeOS Demo","timestamp":"","fields":[]}]</script>
<script>
const records=JSON.parse(document.getElementById('records-data').textContent);
const $=id=>document.getElementById(id); const search=$('search'),sourceFilter=$('sourceFilter'),classFilter=$('classFilter'),grid=$('grid'),dialog=$('detailDialog');
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const norm=s=>String(s??'').toLocaleLowerCase('zh-Hant').replace(/\s+/g,' ').trim();
const unique=(arr)=>[...new Set(arr.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant',{numeric:true}));
unique(records.map(r=>r.source)).forEach(v=>sourceFilter.insertAdjacentHTML('beforeend',`<option>${esc(v)}</option>`));
unique(records.map(r=>r.className)).forEach(v=>classFilter.insertAdjacentHTML('beforeend',`<option>${esc(v)}</option>`));
$('totalCount').textContent=records.length;
function haystack(r){return norm([r.source,r.name,r.className,r.seat,r.studentId,r.gender,r.school,...r.fields.flatMap(f=>[f.label,f.value])].join(' '))}
records.forEach(r=>r._haystack=haystack(r));
function render(){const q=norm(search.value),source=sourceFilter.value,cls=classFilter.value;const shown=records.filter(r=>(!q||q.split(' ').every(part=>r._haystack.includes(part)))&&(!source||r.source===source)&&(!cls||r.className===cls));$('resultText').textContent=`顯示 ${shown.length} / ${records.length} 筆資料`;if(!shown.length){grid.innerHTML='<div class="empty">找不到符合條件的資料，請更換關鍵字或清除篩選。</div>';return}grid.innerHTML=shown.map(r=>`<button class="student" type="button" data-id="${r.id}"><div class="student-head"><div class="avatar">${esc((r.name||'?').slice(-1))}</div><div><h2>${esc(r.name||'未填姓名')}</h2><div class="sub">${esc(r.className||'未填班級')} · ${esc(r.seat||'—')} 號${r.studentId?` · ${esc(r.studentId)}`:''}</div></div></div><span class="badge">${esc(r.source)}</span><div class="facts"><div class="fact"><small>性別</small><span>${esc(r.gender||'未填寫')}</span></div><div class="fact"><small>畢業國中</small><span>${esc(r.school||'未填寫')}</span></div></div></button>`).join('')}
function openRecord(id){const r=records.find(x=>x.id===Number(id));if(!r)return;$('dialogName').textContent=r.name||'未填姓名';$('dialogMeta').textContent=`${r.source} · 原始資料第 ${r.sourceRow} 列 · ${r.timestamp||'未填時間'}`;$('dialogBody').innerHTML=`<dl class="detail-grid">${r.fields.map(f=>`<div class="detail ${String(f.value).length>70?'wide':''}"><dt>${esc(f.label)}</dt><dd class="${f.value?'':'blank'}">${esc(f.value||'未填寫')}</dd></div>`).join('')}</dl>`;dialog.showModal()}
grid.addEventListener('click',e=>{const card=e.target.closest('[data-id]');if(card)openRecord(card.dataset.id)});[search,sourceFilter,classFilter].forEach(el=>el.addEventListener(el===search?'input':'change',render));$('clear').addEventListener('click',()=>{search.value='';sourceFilter.value='';classFilter.value='';render();search.focus()});$('closeDialog').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});render();
</script>
</body>
</html>
