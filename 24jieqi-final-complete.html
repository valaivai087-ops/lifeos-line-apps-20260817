"決策規則｜留下什麼可帶走的規則？\n每件事情先問四題：\n重要度？｜只有我能做嗎？｜現在一定要做嗎？｜值得多少資源？\n規則｜重要＋不可替代→自己做。\n重要＋可替代→授權。\n重複→系統化。\n低價值→刪除。", "15": "最小行動｜今天最值得做哪一步？\n拿100點分配今天的生命資源。\n工作＿＿點｜家庭＿＿點｜孩子＿＿點｜健康＿＿點｜收入＿＿點｜自己＿＿點。\n再問｜「這真的是我想要的人生比例嗎？」\n只調整其中10點。\n智慧｜人生不用今天全部改，只要先移動10%的資源。", "16": "高度主動｜我仍然能選什麼？\n不可控｜一天只有24小時、別人的需求、突發事件。\n可影響｜家庭分工、工作流程、合作方式。\n可直接行動｜刪、併、授、自動化、延期、拒絕、保留。\n智慧｜高度主動不是把所有事情完成，而是主動決定什麼值得我的生命。", "17": "關係智慧｜此時關係需要什麼？\n秋分＝互惠平衡。\n不是「我一直給，你一直拿」。\n也不是每件事都精算50：50。\n而是長期看｜彼此都能付出｜彼此都能接受｜彼此都有空間。\n智慧｜健康關係追求的是長期互惠，不是每一次完全平均。", "18": "親子智慧｜父母此時應該怎麼做？\n秋分＝平衡幫助與放手。\n孩子不會→教。\n孩子正在學→陪。\n孩子已經會→退。\n孩子自己能承擔→不要搶回來。\n智慧｜父母資源應該投在孩子「還不會但正在長」的地方，而不是代替他做已經會做的事。", "19": "學習智慧｜學生此時應長哪一種能力？\n秋分＝學習時間配置力。\n不是國英數自社全部平均讀。\n看｜重要度＋弱點＋錯誤率＋考試權重＋剩餘時間。\n例如100分鐘→弱點40｜高頻30｜錯題20｜再測10。\n智慧｜會配置學習資源，比單純增加讀書時間更重要。", "20": "工作智慧｜此時工作應該做什麼？\n秋分＝重新配置教師工時。\n能刪→不做。\n能併→批次。\n能授→學生做。\n能自動→系統做。\n能範本→不重做。\n只有我能做＋高價值→深度工作。\n智慧｜Teacher Working\nTime↓不是少負責，而是把老師留給真正需要老師的事情。", "21": "財富智慧｜現在是什麼階段？\n秋分＝資產配置。\n不是只問「哪個最會漲？」\n而是問｜生活需要多少現金？｜緊急預備多少？｜能承受多少波動？｜長期資金多少？｜是否過度集中？\n智慧｜報酬只是財富的一部分；風險、流動性與選擇權同樣重要。", "22": "自我／女性成長｜這個階段我要把什麼還給自己？\n秋分要拿回「自己的份額」。\n如果時間100分→自己有幾分？\n如果收入100分→未來的自己有幾分？\n如果愛100分→自己得到幾分？\n提問｜「我的人生資源配置表裡，有沒有我自己？」\n智慧｜照顧自己不是額外增加一件事，而是重新分配原本的100。", "23": "斷捨離＋靈性提問｜現在該放下什麼？\n放下｜每個人都要滿意｜每件事都要完美｜平均才公平｜忙就是負責。\n留下｜真正重要的人、事、能力與資產。\n提問｜「如果生命資源只剩現在的一半，我會立刻停止哪些事情？」\n智慧｜限制反而會逼出真正的Priority。", "24": "14天生命實驗｜把秋分智慧變成真實結果\n第1天｜盤點時間100點。\n第2天｜盤點體力100點。\n第3天｜盤點金錢100點。\n第4天｜盤點注意力流向。\n第5天｜找出最大資源黑洞。\n第6天｜刪除1個低價值投入。\n第7天｜把10%資源移向最高價值。\n第8天｜授權1件事。\n第9天｜批次1類工作。\n第10天｜保留1段完整深度工作。\n第11天｜保留自己的時間。\n第12天｜比較壓力與成果。\n第13天｜找最大預測錯誤。\n第14天｜模型更新。\n目的｜找到自己的「最佳資源配置」。\n公式｜盤點→排序→刪除→移動→執行→比較→再配置。", "25": "秋分 × 團購產品｜果效 × 機制\n\n秋分產品主軸｜不是平均補、全部補，而是依飲食、生活、需求與檢驗，把資源放到真正存在的營養缺口。節氣本身不會創造營養素需求。\n\n① 002｜EPA+DHA複方粉包｜NT$1350\n果效｜補充EPA與DHA→支持正常脂肪酸營養與細胞膜組成。\n機制｜EPA／DHA→吸收後可整合進細胞膜磷脂→並作為多種脂質介質的前驅原料。\n\n② 091｜甘氨酸鎂複方粉包｜NT$1350\n果效｜補充鎂→支持正常神經、肌肉與能量代謝。\n機制｜鎂→作為大量酵素反應的輔因子→參與ATP相關反應、神經傳導及肌肉正常功能；實際補充量看元素鎂含量。\n\n③ 053｜神經營養素｜B1＋B3＋B6｜NT$540\n果效｜提供B群營養→支持正常神經系統與能量代謝。\n機制｜B1、B3、B6→分別參與醣類代謝、NAD／NADP相關反應及胺基酸與神經傳導物質相關代謝。\n\n④ 063｜甜菜鹼TMG｜NT$490\n果效｜提供甜菜鹼→支持正常甲基代謝。\n機制｜TMG→提供甲基→參與同半胱胺酸重新甲基化為甲硫胺酸的代謝路徑。\n\n⑤ 084｜黃連素／小蘗鹼｜NT$560\n果效｜提供小蘗鹼植物生物鹼，屬代謝與腸道相關研究素材。\n機制｜小蘗鹼→涉及多種細胞代謝與訊號路徑研究；因具有實際藥理活性及藥物交互作用可能，不宜只因節氣或一般保養自行大量疊加。\n\n⑥ 041｜薑黃素＋胡椒鹼提取物｜NT$620\n果效｜提供薑黃素等植物多酚素材。\n機制｜薑黃素→涉及氧化還原及細胞訊號相關研究；胡椒鹼可提高薑黃素生體可用率，也可能影響部分藥物代謝。\n\n⑦ 048｜大蒜素｜NT$450\n果效｜提供大蒜來源有機硫化合物相關營養素材。\n機制｜大蒜原料→經加工形成不同有機硫化合物→吸收後進入多種代謝路徑；實際效果與製劑、劑量有關。\n\n⑧ 066｜裸藻｜NT$480\n果效｜增加飲食中微藻來源營養素材。\n機制｜裸藻可提供蛋白質、脂質、多醣等成分→經消化吸收後成為整體營養來源；實際組成依產品規格判斷。\n\n⑨ 070｜辣木粉｜NT$450\n果效｜增加植物來源營養與植化素攝取。\n機制｜辣木葉中的營養素與植物化學成分→經消化、吸收與代謝→成為整體植物性飲食的一部分。\n\n⑩ 080｜複合藻粉｜NT$550\n果效｜提供藻類來源的多元營養素材。\n機制｜不同藻種具有不同蛋白質、色素、脂質、礦物質及其他成分→實際作用應依完整藻種、含量與營養標示判斷。\n\n⑪ 073｜推黑（賜多康）｜NT$695\n果效｜依實際配方提供相關營養支持。\n機制｜商品名稱不足以判斷生理作用→需要完整成分、含量與劑量後，才能判斷其作用路徑。\n\n⑫ 095｜BCB（顏榮郎醫師產品）｜NT$800\n果效｜依實際配方提供營養支持。\n機制｜需依完整成分表與劑量逐項判斷，不能單由產品名稱推論功效。\n\n⑬ 042｜清思油滴35ml｜NT$450\n果效｜依標示提供迷迭香精油與EPA魚油相關素材。\n機制｜魚油中的EPA→參與脂肪酸相關生理路徑；迷迭香芳香成分則涉及嗅覺感官刺激。實際使用方式依產品標示。\n\n⑭ 001｜防藍光護目鏡｜NT$200\n果效｜依鏡片規格過濾部分波段光線，作為螢幕使用環境工具。\n機制｜鏡片材料／鍍膜→改變特定波段光線透射；長時間用眼仍以適當距離、眨眼、照明與休息為主。\n\n秋分產品線一條線｜脂肪酸→002｜鎂→091｜B群→053｜甲基代謝→063｜植物素材→041／048／070｜藻類→066／080｜配方需再確認→073／095｜感官環境→042／001。\n\n若正在使用多種藥物、抗凝血藥、降血糖藥或有慢性疾病，植物萃取物與高活性成分更需要先核對交互作用；秋分真正的產品智慧仍是「少而精、依缺口配置」。"}, "17": {"1": "節氣本質｜天地現在正在發生什麼？\n霜降是秋季最後一個節氣。北半球日照繼續縮短，部分地區氣溫下降更明顯；「霜」的形成需要適合的地表溫度與水氣條件，不代表到了霜降每個地方一定會結霜。\n寒露＝適應變化。\n霜降＝適應之後開始篩選。\n自然智慧｜不是所有東西都要帶進下一個季節。", "2": "節氣核心智慧｜自然正在教我什麼？\n霜降教的是「減法」。\n春天問｜我要增加什麼？\n夏天問｜我要發展什麼？\n秋天問｜我要留下什麼？\n霜降更進一步問｜什麼不值得再消耗我？\n智慧｜人生真正成熟，不只是得到更多，也包括知道什麼時候停止。", "3": "神聖語言｜這個節氣最值得對自己說什麼？\n「我允許已經完成使命的人、事、物離開。不是所有失去都叫失敗；有些放下，是為了把生命還給真正重要的地方。」", "4": "身心靈機制｜這個節氣容易怎麼呈現？如何解套？\n身｜氣溫、日照、濕度與生活環境繼續轉變→衣著、活動、皮膚與呼吸道舒適度可能需要重新調整。解套｜依真實環境與個人反應調整，不用節氣名稱替症狀下診斷。\n心｜知道事情太多→卻每件都捨不得刪→產生壓迫感。解套｜先刪最低價值的10%。\n靈｜把放棄與失敗綁在一起→不敢結束。解套｜重新理解「停止也是決策」。\n公式｜盤點→辨識消耗→刪除→回收資源→重新投入。", "5": "五臟智慧｜這個節氣在傳統養生中提醒什麼？\n傳統秋季常以「金、肺、收、燥」描述季節特色。到了霜降，文化象徵更接近「收斂、收藏、準備入冬」。\n轉成人生智慧｜該收的收、該停的停、該留的留。\n提醒｜傳統文化觀察≠現代醫學診斷。", "6": "五行智慧｜此時的木火土金水正在教什麼？\n木｜不再無限增加枝葉。\n火｜降低不必要消耗。\n土｜保存已成熟成果。\n金｜切掉低價值部分。\n水｜準備收藏核心資源。\n智慧｜真正的減法不是破壞，而是讓核心獲得更多資源。", "7": "能量智慧｜現在應該怎麼用力？\n霜降＝停止「什麼都做」。\n能刪→刪。\n能併→併。\n能授→授。\n能自動→自動。\n能停止→停止。\n只有高價值＋只有我能做→自己做。\n智慧｜提高人生效率，第一步往往不是做更快，而是少做。", "8": "情緒智慧｜最值得觀察什麼？\n霜降最值得觀察「失落」。\n結束一段關係→失落。\n孩子離開身邊→失落。\n角色改變→失落。\n計畫停止→失落。\n失落不一定代表決定錯了，也可能代表「這件事曾經很重要」。\n情緒→需要｜失落→需要承認＋告別＋重新定位。", "9": "心理需求｜此時真正缺的是什麼？\n核心需求＝允許結束。\n很多事情之所以拖著，不是還有價值，而是我們不願承認它已經結束。\n智慧｜真正的結束，不是把過去否定，而是停止讓過去繼續消耗現在。", "10": "認知偏誤｜這個階段最容易想錯什麼？\n錯誤｜「我已經投入這麼多，現在不能停。」\n投入3年→所以再投入3年。\n花很多錢→所以繼續花。\n做很多內容→所以不能砍掉。\n更正｜已經付出的成本收不回來；未來是否繼續，應看未來價值。\n智慧｜過去投入不能自動成為未來投入的理由。", "11": "預測錯誤｜原本以為A，現實告訴我B\n原本相信｜事情越多→機會越多。\n現實結果｜選項增加→注意力分散→重要事情完成率下降。\n差異｜忽略注意力也是有限資源。\n新理解｜選項增加到某個程度後，減少選項反而提高成果。", "12": "模型更新｜這個節氣該淘汰哪個舊方法？\n舊方法｜事情太多→更努力、更快做。\n新證據｜速度增加仍追不上新增速度。\n新方法｜先減少輸入→再優化流程。\n模型更新｜效率問題不一定要靠「更快」，有時要靠「更少」。", "13": "真正瓶頸｜最容易卡在哪裡？\n霜降最大瓶頸＝不敢刪。\nAPP太多→每個都想做。\n產品太多→每個都想推。\n工作太多→每個都自己處理。\n資料太多→每個都收藏。\n責任太多→每個都扛。\n智慧｜沒有刪除機制的系統，最後一定被自己的累積拖慢。", "14": "決策規則｜留下什麼可帶走的規則？\n每件事問四題：\n還有價值嗎？\n現在仍需要嗎？\n只有我能做嗎？\n停止後真正會損失什麼？\n若｜低價值＋可替代＋長期消耗→優先刪除。\n規則｜不要因為「已經開始」就自動繼續。", "15": "最小行動｜今天最值得做哪一步？\n今天只做一件減法。\n刪1個待辦｜退出1個低價值群組｜停止1個重複流程｜丟掉1批不用資料｜拒絕1件不重要的要求。\n然後問｜我多得到多少時間與注意力？\n智慧｜減法必須能看見「資源回收」。", "16": "高度主動｜我仍然能選什麼？\n不可控｜別人期待、過去投入、環境變化。\n可影響｜合作方式、責任分配、工作流程。\n可直接行動｜拒絕、停止、刪除、授權、退出、取消。\n智慧｜高度主動不只有「我要做什麼」，還包括「我決定不再做什麼」。", "17": "關係智慧｜此時關係需要什麼？\n霜降＝篩選關係。\n不是把人分成好人／壞人。\n而是問｜這段關係需要靠近？維持？調整界線？降低頻率？正式告別？\n智慧｜所有人都保持同樣距離，不叫善良，而叫沒有界線。", "18": "親子智慧｜父母此時應該怎麼做？\n霜降＝減少不必要介入。\n孩子已經會做→父母退出。\n孩子可以決定→讓他決定。\n孩子犯可承受的小錯→讓結果教他。\n父母留下｜安全底線＋需要時的支持。\n智慧｜父母少做一點，有時孩子才能多長一點能力。", "19": "學習智慧｜學生此時應長哪一種能力？\n霜降＝刪除低效學習。\n不要｜抄很多卻不提取｜一直重讀卻不測試｜狂做會的題目｜整理漂亮筆記卻不使用。\n留下｜高頻錯題＋主動提取＋間隔複習＋再測。\n智慧｜學習時間有限，先停止低效方法，才有空間給高效方法。", "20": "工作智慧｜此時工作應該做什麼？\n霜降＝工作減法。\n工作清單全部列出→刪／併／授／自動／資產化／只有我做。\n重複問題→FAQ。\n重複流程→SOP。\n重複製作→Template。\n學生能做→學生做。\n低價值→停止。\n智慧｜不是把100件事做到更快，而是讓真正需要自己做的只剩20件。", "21": "財富智慧｜現在是什麼階段？\n霜降＝減少財務漏水。\n不是只想「怎麼多賺」，也看「哪裡一直流掉」。\n盤點｜低使用訂閱｜衝動消費｜重複購買｜高成本低價值支出｜過度集中風險。\n智慧｜增加收入是加法；停止無效流失是減法，兩者都能改善財務韌性。", "22": "自我／女性成長｜這個階段我要把什麼還給自己？\n霜降要拿回「拒絕的權利」。\n我可以不回應所有人。\n我可以不承擔所有情緒。\n我可以不把每件事情做到完美。\n我可以停止已經不適合我的角色。\n提問｜「我現在最想從生命裡拿掉什麼？」\n智慧｜空間不是自然出現的，是透過選擇創造的。", "23": "斷捨離＋靈性提問｜現在該放下什麼？\n放下｜沉沒成本｜過期身份｜無效責任｜低價值承諾｜對所有人負責的幻想。\n留下｜真正重要的人＋核心能力＋健康＋時間＋選擇權。\n提問｜「如果只能把20%的東西帶進下一個人生階段，我會留下什麼？」\n智慧｜減法的目的不是失去，而是看見真正重要。", "24": "14天生命實驗｜霜降減法實驗\n第1天｜列出所有待辦。\n第2天｜刪5個低價值待辦。\n第3天｜取消1個不需要的承諾。\n第4天｜授權1件事情。\n第5天｜合併1類重複工作。\n第6天｜停止1個低效習慣。\n第7天｜清掉1個數位資料區。\n第8天｜整理1類物品。\n第9天｜降低1段低價值社交。\n第10天｜停止1種低效學習。\n第11天｜找1個財務漏水點。\n第12天｜留出1段真正空白。\n第13天｜比較減法前後的時間／精神／成果。\n第14天｜模型更新。\n目的｜找到「刪掉什麼，反而活得更好」。\n公式｜盤點→辨識低價值→刪除→回收資源→投入核心→比較。", "25": "霜降 × 團購產品｜果效 × 機制\n\n霜降產品主軸｜這一篇不做「補越多越好」，而做營養減法：先看飲食、現有補充品與真正缺口，再選少數有明確目的的項目。節氣本身不會製造營養素缺乏。\n\n① 002｜EPA+DHA複方粉包｜NT$1350\n果效｜補充EPA與DHA→支持正常脂肪酸營養與細胞膜組成。\n機制｜EPA、DHA→吸收後整合進細胞膜磷脂→並可作為多種脂質介質的原料。\n\n② 034｜胺基酸可可粉包（30包）｜NT$780\n果效｜提供胺基酸→補充蛋白質合成相關營養原料。\n機制｜胺基酸→消化吸收後進入人體胺基酸池→作為肌肉及其他組織蛋白質與含氮化合物的合成原料。\n\n③ 046｜丁酸鈉複合包｜NT$890\n果效｜提供丁酸相關營養素材→支持日常腸道營養。\n機制｜丁酸屬短鏈脂肪酸→可作為結腸細胞能量來源之一，並參與腸道局部生理訊號；實際效果依配方與劑量。\n\n④ 058｜腸寶（膠囊）｜NT$485\n果效｜依實際配方提供腸道相關營養支持。\n機制｜若包含益生菌、益生質或其他素材→可能分別影響菌相、菌群底物與腸道環境；需依完整成分與菌株判斷。\n\n⑤ 096｜孢子益生菌（加亞麻仁渣）（6g×30包）｜NT$650\n果效｜提供芽孢型益生菌與亞麻仁來源素材→支持日常腸道環境。\n機制｜芽孢型菌株具有特定環境耐受特性；亞麻仁渣若保留膳食纖維→部分可成為腸道菌群利用的底物。\n\n⑥ 017｜酵母鋅＋核酸｜NT$550\n果效｜補充鋅→支持正常免疫功能、蛋白質與DNA合成。\n機制｜鋅→作為多種酵素與蛋白質的重要輔因子→參與正常細胞生理；核酸部分需依實際配方判斷。\n\n⑦ 068｜蜂膠提取物（膠囊）｜NT$520\n果效｜提供蜂膠來源天然化合物。\n機制｜蜂膠可含多種酚類與黃酮類化合物→實際組成與作用受蜂源、萃取方式及劑量影響。\n\n⑧ 089｜巴西蘑菇（膠囊）｜NT$250\n果效｜提供菇類來源營養與多醣等相關素材。\n機制｜菇類可含蛋白質、多醣及其他天然成分→實際含量與生理作用需看菌種、萃取物及標準化規格。\n\n⑨ 070｜辣木粉｜NT$450\n果效｜增加植物來源營養與植化素攝取。\n機制｜辣木葉中的營養素與植物化學成分→經消化、吸收與代謝→成為整體飲食的一部分。\n\n⑩ 033｜亞麻仁籽渣（2包一組）｜NT$198\n果效｜若產品保留膳食纖維，可增加植物性纖維來源。\n機制｜部分膳食纖維→進入大腸後可被腸道菌群利用→形成包括短鏈脂肪酸在內的代謝物。\n\n⑪ 004｜益生菌牙膏｜NT$79\n果效｜協助日常牙齒與口腔清潔。\n機制｜刷牙機械作用＋牙膏→協助移除牙菌斑與食物殘留；益生菌相關作用需依實際菌株與產品證據判斷。\n\n⑫ 082｜牙間刷（一盒）｜NT$140\n果效｜補充一般牙刷較難完成的牙間清潔。\n機制｜細小刷毛→進入牙間空間→機械性移除部分牙菌斑與食物殘留。\n\n⑬ 069｜發熱襪｜NT$25\n果效｜作為較涼環境中的足部保暖用品。\n機制｜材質、織法與穿著形成局部隔熱層→減少熱量散失；實際保暖程度依材質與環境而異。\n\n⑭ 040｜迷迭香滾珠瓶10ml｜NT$150\n果效｜提供芳香感官刺激→作為工作、休息或整理狀態的環境提示。\n機制｜揮發性芳香分子→嗅覺受器→形成氣味感受；固定搭配某項行動，也可成為行為切換線索。\n\n霜降產品一條線｜先做減法→再找真正缺口｜脂肪酸→002｜蛋白質原料→034｜腸道→046／058／096／033｜鋅→017｜植物與菇類素材→068／089／070｜口腔→004／082｜保暖→069｜狀態切換→040。\n\n產品減法規則｜正在吃的全部列出→相同目的合併檢查→成分重複找出來→不知道為什麼吃的重新評估→一次只改少數變因→約2週看回饋→留下真正有價值的。持續、反覆或加重的不適，應找真正原因並接受適當醫療評估。"}, "18": {"1": "節氣本質｜天地現在正在發生什麼？\n立冬是冬季第一個節氣。北半球日照持續縮短，許多地區逐漸轉冷，但台灣不一定在立冬當天就明顯寒冷。\n霜降＝做減法。\n立冬＝把減法後留下的資源收藏起來。\n自然智慧｜減少消耗只是第一步，真正重要的是把省下來的資源留下。", "2": "節氣核心智慧｜自然正在教我什麼？\n立冬教的是「蓄能」。\n賺很多但全部花掉→沒有累積。\n學很多但沒有整理→沒有知識資產。\n做很多教材但每次重做→沒有工作資產。\n休息很多但一直滑手機→不一定真正恢復。\n智慧｜真正的富足＝資源進來之後，有能力留下來。", "3": "神聖語言｜這個節氣最值得對自己說什麼？\n「我不必把所有能量都交給今天。我願意保存體力、時間、金錢、知識與愛，為未來的自己留下一座水庫。」", "4": "身心靈機制｜這個節氣容易怎麼呈現？如何解套？\n身｜日照縮短、氣溫下降與生活節奏改變→活動、睡眠、衣著與環境舒適度需要重新調整。解套｜依實際氣候與個人狀態保暖、活動、規律睡眠與飲食。\n心｜外界速度仍快→害怕停下就落後。解套｜建立「輸出＋恢復」雙系統。\n靈｜把價值建立在不停付出→沒有自己的儲備。解套｜學會保留。\n公式｜減少漏損→保存資源→穩定補充→形成儲備→等待適合時機。", "5": "五臟智慧｜這個節氣在傳統養生中提醒什麼？\n傳統冬季常用「冬藏、水、腎」描述收藏與保存的季節意象。轉成人生智慧，不是把「腎」直接等同現代器官疾病，而是借用「藏」提醒自己：不要讓所有資源都向外流。\n提醒｜傳統文化觀察≠現代醫學診斷。\n智慧｜冬天真正重要的字不是「補」，而是「藏」。", "6": "五行智慧｜此時的木火土金水正在教什麼？\n木｜暫時不急著長。\n火｜降低不必要燃燒。\n土｜保存成熟成果。\n金｜完成秋季篩選。\n水｜收藏資源，等待下一輪萌發。\n智慧｜沒有「藏」，就很難有下一輪真正有力量的「生」。", "7": "能量智慧｜現在應該怎麼用力？\n立冬＝建立能量水庫。\n收入100→不要花100。\n體力100→不要每天用到0。\n時間100→不要排滿100。\n注意力100→不要全部交給訊息。\n智慧｜真正安全的系統，都有Buffer。\n中文記法｜永遠留一點餘裕。", "8": "情緒智慧｜最值得觀察什麼？\n立冬最值得觀察「空虛」。\n一直忙→突然停下→不知道自己要什麼。\n一直照顧別人→回到自己→不知道如何照顧自己。\n一直追求成果→沒有成果時→不知道自己的價值。\n情緒→需要｜空虛→需要重新連回自己，而不是立刻用更多事情塞滿。", "9": "心理需求｜此時真正缺的是什麼？\n核心需求＝安全基地。\n人需要一個地方知道｜累了可以回來｜失敗可以整理｜不知道答案可以慢慢想｜不用一直證明自己。\n安全基地可以是家、關係、習慣，也可以是自己的內在秩序。\n智慧｜真正的安全感，是我知道自己有地方可以回來。", "10": "認知偏誤｜這個階段最容易想錯什麼？\n錯誤｜沒有產出＝沒有進步。\n睡眠看不到作品。\n運動看不到報表。\n整理看不到收入。\n陪伴看不到業績。\n但它們可能正在建立未來的承載能力。\n智慧｜不是所有重要成長，都會立即變成可見成果。", "11": "預測錯誤｜原本以為A，現實告訴我B\n原本相信｜把時間排滿→一天利用率最高。\n現實結果｜突發事件一來→全部延遲→壓力升高。\n差異｜沒有預留緩衝。\n新理解｜100%的使用率，往往代表0%的應變空間。", "12": "模型更新｜這個節氣該淘汰哪個舊方法？\n舊方法｜有多少資源→全部投入。\n新證據｜沒有儲備→任何意外都會造成系統失衡。\n新方法｜收入留儲備＋時間留空白＋體力留餘裕＋工作留緩衝。\n模型更新｜最大化使用→改成保留恢復能力。", "13": "真正瓶頸｜最容易卡在哪裡？\n立冬最大瓶頸＝資源留不住。\n錢進來→花掉。\n時間空出→又塞滿。\n教材做好→找不到。\n文章寫完→沒有分類。\n經驗發生→沒有留下方法。\n智慧｜沒有儲存系統，再多資源都會重新流失。", "14": "決策規則｜留下什麼可帶走的規則？\n每得到一份資源，都問：\n我要用多少？\n我要留多少？\n能不能變成可重複資產？\n未來的我能不能再次使用？\n規則｜今天得到的，不要全部今天用完。", "15": "最小行動｜今天最值得做哪一步？\n建立一個「生命儲備庫」。\n只選一種：\n時間｜保留30分鐘空白。\n金錢｜留下一筆不動用的儲備。\n知識｜整理一份可再次使用的資料。\n工作｜把一個成果做成範本。\n體力｜今天不要把自己用到0分。\n智慧｜蓄能從「留下一點」開始。", "16": "高度主動｜我仍然能選什麼？\n不可控｜冬季變化、工作突發、別人的需求。\n可影響｜家庭分工、工作安排、生活環境。\n可直接行動｜保留時間、降低消耗、提早休息、拒絕低價值要求、保存成果。\n智慧｜高度主動不只是爭取更多，也包括保護自己已經擁有的。", "17": "關係智慧｜此時關係需要什麼？\n立冬＝回到重要的人。\n不是認識更多人，而是把時間留給真正重要的人。\n少一點表面社交。\n多一點真正陪伴。\n少一點即時回覆。\n多一點完整相處。\n智慧｜關係的深度，不由聯絡人數決定，而由真正投入決定。", "18": "親子智慧｜父母此時應該怎麼做？\n立冬＝成為孩子的安全基地。\n不是替孩子解決所有問題。\n而是讓孩子知道｜你可以自己去試→失敗可以回來→我們一起整理→下一次再試。\n公式｜安全基地→孩子敢探索→遇到錯誤→回來整理→再次出發。\n智慧｜真正安全的孩子，不是從來不跌倒，而是知道跌倒後有地方整理自己。", "19": "學習智慧｜學生此時應長哪一種能力？\n立冬＝建立知識儲備庫。\n學完就丟→下一次重新學。\n學完整理→形成長期資產。\n單字→單字庫。\n錯題→錯誤庫。\n文法→規則庫。\n閱讀→題型庫。\n智慧｜讀書不是一直輸入，而是把學過的東西留下來。", "20": "工作智慧｜此時工作應該做什麼？\n立冬＝把工作變資產。\n做一次教材→存成範本。\n回答一次問題→變成常見問答。\n處理一次事件→變成標準流程。\n寫一篇文章→變成貼文＋講義＋課程＋應用程式素材。\n智慧｜做完工作只是完成；下次不用重做，才叫累積。", "21": "財富智慧｜現在是什麼階段？\n立冬＝守成＋建立儲備。\n收入增加很重要，但「留得下來」同樣重要。\n盤點｜現金流｜緊急預備｜固定支出｜長期資產｜風險集中度。\n智慧｜財富不是賺過多少，而是最後保留下多少選擇權。", "22": "自我／女性成長｜這個階段我要把什麼還給自己？\n立冬要拿回「自己的空間」。\n不是每個空檔都工作。\n不是每份精神都給別人。\n不是每個問題都由自己處理。\n不是每段安靜都需要填滿。\n提問｜「如果我每天保留10%的生命只給自己，我會拿來做什麼？」\n智慧｜留白不是空白，而是生命的儲備區。", "23": "斷捨離＋靈性提問｜現在該放下什麼？\n放下｜把自己用到零｜行程排滿｜有錢就花｜資料只收藏不整理｜永遠向外證明自己。\n留下｜體力＋時間＋現金流＋重要關係＋真正能力＋內在安定。\n提問｜「如果明年遇到一場意外變化，現在的我最希望提前留下哪一種資源？」", "24": "14天生命實驗｜立冬蓄能實驗\n第1天｜畫出5個水庫：體力／時間／金錢／注意力／關係。\n第2天｜各打0～10分。\n第3天｜找最低的一個水庫。\n第4天｜找最大漏口。\n第5天｜停止1個漏損。\n第6天｜保留30分鐘空白。\n第7天｜整理1份知識資產。\n第8天｜把1個工作變成範本。\n第9天｜少做1件低價值工作。\n第10天｜把完整時間留給重要的人。\n第11天｜建立1個固定恢復習慣。\n第12天｜重新評估5個水庫。\n第13天｜比較前後差異。\n第14天｜模型更新。\n目的｜找出「什麼最能讓我的資源真正留下來」。\n公式｜盤點→堵漏→留白→儲存→累積→再測。", "25": "立冬 × 團購產品｜果效 × 機制\n\n立冬產品主軸｜冬藏不是「冬天就要大補」。先看飲食、睡眠、活動、既有補充品與真正缺口，再決定是否需要營養支持；節氣本身不會創造營養素缺乏。\n\n① 039｜大補王｜NT$1560\n果效｜依實際配方提供基礎營養支持。\n機制｜需依完整成分、每份含量與劑量判斷實際營養路徑；不能由「大補王」名稱直接推論補氣、補血或治療效果。\n\n② 071｜王牌粉（12g×30包）｜NT$2000\n果效｜依實際配方補充營養素材，作為日常營養配置的一部分。\n機制｜不同營養成分→經消化、吸收→分別進入能量、蛋白質或其他代謝路徑；需依完整成分表判斷。\n\n③ 076｜能量方（膠囊）｜NT$550\n果效｜依實際配方提供正常能量代謝相關營養支持。\n機制｜需依成分與劑量判斷其參與的代謝路徑；不能單由「能量方」名稱推論可以消除疲勞。\n\n④ 098｜粒線寶（膠囊）｜NT$550\n果效｜依實際配方提供能量代謝相關營養素材。\n機制｜若含參與粒線體代謝的營養成分→依各成分進入相應代謝路徑；實際作用需看完整配方。\n\n⑤ 060｜Q10（10:1）（膠囊）｜NT$580\n果效｜提供Q10→支持正常細胞能量代謝。\n機制｜Q10→參與粒線體電子傳遞鏈→協助電子傳遞與ATP生成相關過程。\n\n⑥ 034｜胺基酸可可粉包（30包）｜NT$780\n果效｜提供胺基酸→補充蛋白質合成所需營養原料。\n機制｜胺基酸→吸收後進入人體胺基酸池→作為肌肉及其他組織蛋白質與含氮化合物合成原料。\n\n⑦ 097｜亞麻仁油（500cc×2瓶）｜NT$780\n果效｜提供植物性必需脂肪酸ALA。\n機制｜ALA→參與脂肪酸代謝與細胞膜脂質組成→部分可轉換成EPA與DHA，但轉換率有限。\n\n⑧ 070｜辣木粉｜NT$450\n果效｜增加植物來源營養與植化素攝取。\n機制｜辣木葉中的營養素與植物化學成分→經消化、吸收與代謝→成為整體飲食營養的一部分。\n\n⑨ 089｜巴西蘑菇（膠囊）｜NT$250\n果效｜提供菇類來源營養與多醣等素材。\n機制｜菇類可含蛋白質、多醣及其他天然成分→實際含量與作用取決於原料、萃取與標準化規格。\n\n⑩ 091｜甘氨酸鎂複方粉包｜NT$1350\n果效｜補充鎂→支持正常神經、肌肉與能量代謝。\n機制｜鎂→作為多種酵素反應的輔因子→參與ATP相關反應、神經傳導與肌肉正常功能。\n\n⑪ 054｜GABA（膠囊）｜NT$540\n果效｜提供GABA，作為放鬆與睡眠相關營養研究素材。\n機制｜GABA是人體重要的抑制性神經傳導物質；口服後對中樞神經的實際影響仍存在個體差異，不能直接等同睡眠治療。\n\n⑫ 069｜發熱襪｜NT$25\n果效｜提供足部日常保暖。\n機制｜衣物材質與織法→形成隔熱層→降低局部熱量散失；實際效果依材質、環境與穿著方式而異。\n\n⑬ 023｜行氣精油｜NT$1200\n果效｜提供芳香感官體驗→可作為放鬆、休息或生活儀式的環境提示。\n機制｜揮發性芳香分子→嗅覺受器→形成氣味感受；其他作用需依實際精油種類、濃度與使用方式判斷。\n\n⑭ 006｜專利HEZY氫鬆袋（買空袋送氫水）｜NT$250\n果效｜氫水部分可作為日常飲水來源；分子氫相關生理作用仍屬研究領域。\n機制｜水→支持正常體液平衡；溶解分子氫涉及氧化還原相關研究，但不能直接延伸成排毒、抗癌或疾病治療效果。\n\n立冬產品一條線｜基礎營養盤點→039／071｜能量代謝→076／098／060｜蛋白質原料→034｜植物脂肪酸→097｜植物與菇類素材→070／089｜鎂→091｜放鬆素材→054｜保暖→069｜感官環境→023｜補水→006。\n\n立冬真正的「補」｜先補睡眠→再補規律飲食→再補活動與恢復→最後才依飲食缺口、檢驗、用藥與個人需求決定補充品。持續或明顯疲勞等症狀，不應只用「冬天需要補」解釋。"}, "19": {"1": "節氣本質｜天地現在正在發生什麼？\n小雪是冬季第二個節氣。「小雪」描述的是季節逐漸轉冷的氣候意象，不代表台灣或所有地區一定會下雪。此時北半球日照繼續縮短，冬季特徵逐漸加深。\n立冬＝把資源收藏起來。\n小雪＝讓收藏的資源開始慢慢累積。\n自然智慧｜真正巨大的改變，常常從很小、很慢、很不起眼的累積開始。", "2": "節氣核心智慧｜自然正在教我什麼？\n小雪教的是「微小複利」。\n一天背10個字→一年不是10個字。\n一天整理1個錯誤→一年形成錯誤資料庫。\n一天存一點錢→慢慢形成資產。\n一天少做一件低價值工作→慢慢拿回大量時間。\n智慧｜不要小看每天可以重複的1%。", "3": "神聖語言｜這個節氣最值得對自己說什麼？\n「我不急著今天就成為最好的自己。我只需要讓今天的我，比昨天多留下一點點。小小的正確，重複久了，就是我的力量。」", "4": "身心靈機制｜這個節氣容易怎麼呈現？如何解套？\n身｜天氣逐漸轉冷→活動、睡眠、飲食與保暖習慣需要穩定調整。解套｜不要靠一天突然大補，而是建立每天做得到的基本生活習慣。\n心｜短期看不到巨大成果→容易放棄。解套｜把成功指標從「結果多大」改成「今天有沒有完成」。\n靈｜總想一次改變人生→忽略每天的小選擇。解套｜相信微小累積。\n公式｜小行動→重複→穩定→累積→能力→成果。", "5": "五臟智慧｜這個節氣在傳統養生中提醒什麼？\n傳統冬季常用「藏、水、腎」描述冬季收藏意象。小雪更適合轉成「小量、持續、慢慢蓄積」的人生提醒，而不是解讀成冬天一定需要特定補品。\n智慧｜真正的養，不是一天補很多，而是每天少消耗一點、多累積一點。\n提醒｜傳統文化觀察≠現代醫學診斷。", "6": "五行智慧｜此時的木火土金水正在教什麼？\n木｜暫時不追求快速長大。\n火｜留下必要熱量，不過度燃燒。\n土｜把每天所得沉澱下來。\n金｜持續減少無效消耗。\n水｜一點一滴形成儲備。\n智慧｜小雪的「水」不是一次灌滿，而是每天多存一點。", "7": "能量智慧｜現在應該怎麼用力？\n小雪＝小量、低阻力、可持續。\n運動不是偶爾2小時→每天20分鐘。\n讀書不是考前8小時→每天固定一段。\n整理不是半年一次→每天10分鐘。\n智慧｜最好的計畫不是最厲害的計畫，而是你做得下去的計畫。", "8": "情緒智慧｜最值得觀察什麼？\n小雪最值得觀察「急」。\n才做3天→怎麼還沒變？\n才讀1週→怎麼還沒進步？\n才存1個月→怎麼還沒變有錢？\n情緒→需要｜急→需要看見累積曲線。\n智慧｜不要每天挖開種子，看它有沒有發芽。", "9": "心理需求｜此時真正缺的是什麼？\n核心需求＝進步感。\n如果成果太遠，人很容易失去動力。\n所以把大目標拆成每天看得見的小證據。\n今天背10字✓\n今天走20分鐘✓\n今天整理1題✓\n今天存一筆✓\n智慧｜讓大腦每天看見「我正在前進」。", "10": "認知偏誤｜這個階段最容易想錯什麼？\n錯誤｜小事情沒什麼用。\n結果｜因為一次做不大→乾脆不做。\n更正｜真正要問的不是「這一次有多大？」而是「它能不能重複100次？」\n智慧｜小行動 × 高重複，可能勝過大行動 × 三分鐘熱度。", "11": "預測錯誤｜原本以為A，現實告訴我B\n原本相信｜要有巨大動力才能改變。\n現實結果｜巨大動力不穩定，容易中斷。\n差異｜高強度不等於高累積。\n新理解｜降低行動門檻，反而提高長期完成率。", "12": "模型更新｜這個節氣該淘汰哪個舊方法？\n舊方法｜設定大目標→猛烈開始→太累→停止→自責。\n新證據｜真正產生改變的是長期重複。\n新方法｜縮小行動→固定時間→留下紀錄→持續→逐步增加。\n模型更新｜「我要做很多」→「我要做得久」。", "13": "真正瓶頸｜最容易卡在哪裡？\n小雪最大瓶頸＝行動門檻太高。\n運動一定1小時→沒時間就不做。\n文章一定完整寫完→最後一篇都沒有。\n教材一定做到完美→一直延後。\n讀書一定2小時→今天累就放棄。\n智慧｜降低啟動門檻，才能增加重複次數。", "14": "決策規則｜留下什麼可帶走的規則？\n如果一件重要事情常常做不到→先不要怪意志力→把它縮小一半。\n還做不到→再縮小一半。\n直到小到「再忙也做得到」。\n規則｜先建立連續性，再增加強度。", "15": "最小行動｜今天最值得做哪一步？\n選一件想累積一年的能力。\n設定「小到不能失敗」的每日版本。\n英文｜5個單字。\n運動｜10分鐘。\n整理｜5分鐘。\n閱讀｜2頁。\n存錢｜固定小額。\n智慧｜今天不要證明自己多厲害，只證明自己可以開始。", "16": "高度主動｜我仍然能選什麼？\n不可控｜結果何時出現、別人進步多快、外界變化。\n可影響｜環境、工具、提醒、難度。\n可直接行動｜今天完成一次最小行動。\n智慧｜我不能控制多久成功，但能控制今天是否投下一票。", "17": "關係智慧｜此時關係需要什麼？\n小雪＝小小累積。\n不用每天做大事。\n一句謝謝。\n一次完整傾聽。\n一頓飯。\n一個擁抱。\n一次主動聯絡。\n智慧｜關係通常不是靠一次巨大感動維持，而是靠很多微小可靠。", "18": "親子智慧｜父母此時應該怎麼做？\n小雪＝每天多讓孩子自己完成一點。\n今天自己整理書包。\n明天自己看行事曆。\n下次自己處理缺交。\n再下一次自己安排讀書。\n父母逐步退出→孩子能力逐步增加。\n智慧｜獨立不是突然放手，而是一點一點移交責任。", "19": "學習智慧｜學生此時應長哪一種能力？\n小雪＝間隔累積。\n一次背100字→很快忘。\n每天少量＋隔天提取＋一週再測→形成長期記憶。\n公式｜學習→提取→間隔→再提取→錯誤修正→長期保留。\n智慧｜真正會讀書，不是一次讀完，而是安排自己再次遇見它。", "20": "工作智慧｜此時工作應該做什麼？\n小雪＝每天累積一個工作資產。\n今天做1個範本。\n明天寫1條標準流程。\n後天整理1個常見問答。\n再下一天自動化1個重複步驟。\n一年後→不是做了365件工作，而是多了一套工作系統。\n智慧｜每天工作會消失；每天留下資產會複利。", "21": "財富智慧｜現在是什麼階段？\n小雪＝小額長期累積。\n不是每天猜高低點，而是先建立｜穩定現金流＋合理儲蓄＋緊急預備＋符合自身風險承受度的長期配置。\n智慧｜財富累積的力量，常來自時間＋紀律＋持續，而不是每次都猜對。", "22": "自我／女性成長｜這個階段我要把什麼還給自己？\n小雪要拿回「慢慢變好的權利」。\n我不需要一天改掉所有問題。\n不需要今天完成所有夢想。\n不需要跟別人的速度比較。\n提問｜「如果我每天只替自己做一件小事，我最希望是哪一件？」\n智慧｜慢，不等於沒有前進。", "23": "斷捨離＋靈性提問｜現在該放下什麼？\n放下｜一次到位｜三分鐘熱度｜完美才開始｜看不到結果就放棄。\n留下｜小步＋重複＋時間＋耐心。\n提問｜「什麼事情如果每天只做一點，三年後會完全改變我的人生？」\n智慧｜真正值得累積的，是未來會產生複利的東西。", "24": "14天生命實驗｜小雪微累積實驗\n第1天｜選1個想累積的能力。\n第2天｜把行動縮到10分鐘內。\n第3天｜固定觸發時間。\n第4天｜完成一次。\n第5天｜再完成一次。\n第6天｜記錄阻力。\n第7天｜把最大阻力降低。\n第8天｜繼續最小行動。\n第9天｜不增加難度。\n第10天｜觀察連續完成率。\n第11天｜建立簡單紀錄。\n第12天｜比較第1天與現在。\n第13天｜找最大的預測錯誤。\n第14天｜決定下一個14天版本。\n目的｜不是14天創造巨大成果，而是證明「我可以持續」。\n公式｜縮小→開始→重複→記錄→降低阻力→再重複→累積。", "25": "小雪 × 團購產品｜果效 × 機制\n\n小雪產品主軸｜營養也適合用「基礎＋持續＋依缺口」思考，不追求一次堆很多產品。先把規律飲食、睡眠、活動做好，再依實際需求選擇。\n\n① 097｜亞麻仁油（500cc×2瓶）｜NT$780\n果效｜提供植物性必需脂肪酸ALA。\n機制｜ALA→吸收後參與脂肪酸代謝與細胞膜脂質組成→部分可轉換成EPA與DHA，但轉換率有限。\n\n② 033｜亞麻仁籽渣（2包一組）｜NT$198\n果效｜若保留膳食纖維，可增加日常植物性纖維來源。\n機制｜膳食纖維→進入腸道→部分可發酵纖維被菌群利用→形成包括短鏈脂肪酸在內的代謝物。\n\n③ 070｜辣木粉｜NT$450\n果效｜增加植物來源營養與植化素攝取。\n機制｜辣木葉所含營養素與植物化學成分→經消化、吸收與代謝→成為整體飲食營養的一部分。\n\n④ 066｜裸藻｜NT$480\n果效｜增加微藻來源營養素材。\n機制｜裸藻可提供蛋白質、脂質、多醣及其他營養成分→實際組成與含量依產品規格判斷。\n\n⑤ 017｜酵母鋅＋核酸｜NT$550\n果效｜補充鋅→支持正常免疫功能、蛋白質與DNA合成。\n機制｜鋅→作為多種酵素與蛋白質的結構或催化因子→參與正常細胞功能；核酸部分需依實際規格判斷。\n\n⑥ 034｜胺基酸可可粉包（30包）｜NT$780\n果效｜提供胺基酸→補充蛋白質合成相關營養原料。\n機制｜胺基酸→吸收後進入人體胺基酸池→作為肌肉與其他組織蛋白質及含氮化合物合成原料。\n\n⑦ 096｜孢子益生菌（加亞麻仁渣）（6g×30包）｜NT$650\n果效｜提供特定菌株與亞麻仁來源素材→支持日常腸道環境。\n機制｜芽孢型菌株具有特定環境耐受特性；亞麻仁渣若含膳食纖維→部分可成為腸道菌群利用的底物。\n\n⑧ 046｜丁酸鈉複合包｜NT$890\n果效｜提供丁酸相關營養素材→支持日常腸道營養。\n機制｜丁酸屬短鏈脂肪酸→是結腸細胞能量來源之一，也參與腸道局部生理訊號；實際效果依配方與劑量。\n\n⑨ 061｜NMN複方（膠囊）｜NT$570\n果效｜依實際配方提供健康老化研究相關營養素材。\n機制｜NMN是人體菸鹼醯胺腺嘌呤二核苷酸生合成途徑的前驅物之一→與細胞能量代謝研究有關；不能因此直接推論能逆轉人體老化。\n\n⑩ 088｜透明質酸鈉（錠）｜NT$530\n果效｜提供透明質酸相關營養素材。\n機制｜透明質酸屬親水性糖胺聚醣→具有結合水分的物理化學特性；口服後仍需經消化與代謝。\n\n⑪ 089｜巴西蘑菇（膠囊）｜NT$250\n果效｜提供菇類來源營養與多醣等素材。\n機制｜菇類可含蛋白質、多醣及其他天然成分→實際含量與作用需依原料、萃取方式及標準化規格判斷。\n\n⑫ 069｜發熱襪｜NT$25\n果效｜提供較冷環境中的足部日常保暖。\n機制｜衣物形成局部隔熱層→降低熱量散失；實際保暖程度取決於材質、環境與穿著方式。\n\n⑬ 014｜健康接地枕頭套｜NT$599\n果效｜作為寢具與特定接地設備使用情境的生活用品。\n機制｜若正確連接合格接地系統，可形成電氣接地連接；目前不能把「接地」直接推論為已證實的疾病治療或特殊健康效果。\n\n⑭ 012｜接地線路檢測儀｜NT$199\n果效｜協助檢查特定插座的線路／接地狀態。\n機制｜檢測器→依插座電氣連接狀態顯示結果→可作為使用相關接地設備前的環境確認工具；應依產品操作說明使用。\n\n小雪產品一條線｜每天飲食累積→097／033／070／066｜基礎營養原料→017／034｜腸道環境→096／046｜健康老化研究素材→061｜含水相關素材→088｜菇類素材→089｜保暖→069｜環境檢查→014／012。\n\n小雪真正的營養智慧｜不是今天吃很多、明天全部停；而是先問「我真正缺什麼？」→選少數需要的→穩定執行→約2週看回饋→再決定保留、調整或停止。持續或加重的不適仍應找真正原因，而不是用節氣解釋。"}, "20": {"1": "節氣本質｜天地現在正在發生什麼？\n大雪是冬季第三個節氣。名稱代表傳統氣候觀察進一步進入寒冷階段，不代表台灣或所有地區一定下大雪。北半球接近冬至，白晝接近一年中的短點。\n小雪＝小量累積。\n大雪＝讓累積變穩定。\n自然智慧｜真正的能力不是偶爾做到，而是環境變差時仍能維持。", "2": "節氣核心智慧｜自然正在教我什麼？\n大雪教的是「穩」。\n順境做得到→不難。\n忙的時候還做得到→能力。\n累的時候還保留最低量→系統。\n遇到意外仍能回來→韌性。\n智慧｜真正可靠的系統，要通過壞日子的測試。", "3": "神聖語言｜這個節氣最值得對自己說什麼？\n「我不要求每天完美。我只需要在混亂的日子裡，仍然守住最重要的幾件事；偏離了，我也知道怎麼回來。」", "4": "身心靈機制｜這個節氣容易怎麼呈現？如何解套？\n身｜氣溫、日照與活動環境改變→作息、活動量與保暖需求可能跟著變。解套｜固定睡眠、規律飲食、適度活動、依實際環境保暖，不因天冷完全停止活動。\n心｜事情一多→原有習慣全部消失。解套｜設計「最低版本」。\n靈｜把一次中斷理解成失敗→乾脆全部放棄。解套｜把「重新回來」也算能力。\n公式｜建立基準→設定最低線→遇到波動→守住核心→偏離→快速返回。", "5": "五臟智慧｜這個節氣在傳統養生中提醒什麼？\n傳統冬季常以「水、腎、藏」描述冬季收藏意象。到了大雪，更適合轉成「穩住底盤」的生活智慧。\n不是突然大補。\n而是少漏損＋穩作息＋保留體力。\n提醒｜傳統文化觀察≠現代醫學診斷。\n智慧｜底盤穩，外界波動才不容易把你帶走。", "6": "五行智慧｜此時的木火土金水正在教什麼？\n木｜等待適合生長的時機。\n火｜保留必要動力，不過度燃燒。\n土｜維持基本供應。\n金｜持續排除低價值消耗。\n水｜穩定收藏核心資源。\n智慧｜穩定不是完全不動，而是讓核心資源不被波動掏空。", "7": "能量智慧｜現在應該怎麼用力？\n大雪＝建立「最低可行版本」。\n平常運動30分鐘→忙時10分鐘。\n平常讀書60分鐘→忙時15分鐘。\n平常整理20分鐘→忙時5分鐘。\n平常完整工作→忙時只守前三順位。\n智慧｜降低劑量，不要切斷系統。", "8": "情緒智慧｜最值得觀察什麼？\n大雪最值得觀察「無力感」。\n事情一多→覺得什麼都做不了。\n結果→乾脆全部不做。\n情緒→需要｜無力→需要把事情縮小到可以控制。\n智慧｜當人生太大，就把下一步變小。", "9": "心理需求｜此時真正缺的是什麼？\n核心需求＝穩定感。\n不是保證明天沒有意外。\n而是知道｜再忙我仍有基本作息｜再亂我仍知道前三順位｜偏離後我有返回點。\n智慧｜真正的穩定不是沒有變化，而是有一個可以回去的基準。", "10": "認知偏誤｜這個階段最容易想錯什麼？\n錯誤｜今天沒有做到100分＝今天失敗。\n結果｜100做不到→直接變0。\n更正｜100→70→30都比0更能維持系統。\n智慧｜穩定靠的不是滿分，而是不輕易歸零。", "11": "預測錯誤｜原本以為A，現實告訴我B\n原本相信｜我要靠高度自律，每天照完整計畫走。\n現實結果｜生病、工作、家庭、情緒、突發事件一定會出現。\n差異｜計畫只為「正常日」設計。\n新理解｜真正好用的系統，必須同時有正常版＋忙碌版＋低能量版。", "12": "模型更新｜這個節氣該淘汰哪個舊方法？\n舊方法｜中斷一天→自責→覺得失敗→繼續中斷。\n新證據｜真正決定長期成果的是返回速度。\n新方法｜偏離→發現→立即回到最低版本→恢復後再增加。\n模型更新｜「從不掉線」→「掉線後快速回來」。", "13": "真正瓶頸｜最容易卡在哪裡？\n大雪最大瓶頸＝系統太脆弱。\n一忙→運動沒了。\n一累→學習沒了。\n一有突發事件→工作計畫全毀。\n一次考差→讀書動力全沒。\n一次爭吵→關係全部否定。\n智慧｜不是要求人生沒有干擾，而是讓系統承受得了干擾。", "14": "決策規則｜留下什麼可帶走的規則？\n任何重要習慣，都準備三個版本：\n完整版｜狀態好時做。\n縮小版｜忙碌時做。\n最低版｜低能量時仍能做。\n規則｜可以降級，不要輕易歸零。", "15": "最小行動｜今天最值得做哪一步？\n挑一件最重要的習慣，寫出三個版本。\n例如運動｜30分鐘／15分鐘／5分鐘。\n英文｜60分鐘／20分鐘／5個單字。\n整理｜30分鐘／10分鐘／整理一個檔案。\n智慧｜先設計「最差的一天怎麼做」，系統才真正完整。", "16": "高度主動｜我仍然能選什麼？\n不可控｜突發事件、天氣、別人的需求、今天的精神狀態。\n可影響｜環境、行程、工作量與支援系統。\n可直接行動｜降低難度、守住最低線、刪除非必要、重新開始。\n智慧｜不能控制今天有多難，但可以控制自己不要完全退出。", "17": "關係智慧｜此時關係需要什麼？\n大雪＝可靠。\n不是每天轟轟烈烈。\n而是答應的事情盡量做到。\n需要時找得到。\n犯錯願意修復。\n忙碌仍保留基本關心。\n智慧｜關係的安全感，來自長期可預測的小可靠。", "18": "親子智慧｜父母此時應該怎麼做？\n大雪＝建立家庭底線，不做全天候監控。\n孩子狀態好→自己管理。\n狀態下降→啟動最低線。\n例如｜睡眠底線｜出席底線｜作業底線｜安全底線。\n父母守底線，其他空間讓孩子練習。\n智慧｜規則不是越多越穩，核心底線越清楚才越穩。", "19": "學習智慧｜學生此時應長哪一種能力？\n大雪＝建立學習基準線。\n考前不要從0突然衝到100。\n平常固定｜單字提取＋錯題整理＋閱讀＋再測。\n忙時縮小，但不完全消失。\n公式｜固定小量→反覆提取→錯誤修正→長期保留。\n智慧｜真正高分靠的是平常系統，不是最後一次爆發。", "20": "工作智慧｜此時工作應該做什麼？\n大雪＝建立「不容易垮掉的工作系統」。\n每天只守｜前三順位。\n重複工作→範本。\n固定流程→標準流程＋檢查表。\n可授權→交出去。\n可批次→集中做。\n突發事件→不要摧毀整天。\n智慧｜好的工作系統不是排得最滿，而是被打斷後仍能運作。", "21": "財富智慧｜現在是什麼階段？\n大雪＝財務穩定力。\n不是只追求最高報酬，而是問｜收入下降還撐得住嗎？｜突發支出有沒有預備？｜資產是否過度集中？｜現金流是否穩定？\n智慧｜財富的底層能力不是永遠賺最多，而是遇到波動仍有選擇。", "22": "自我／女性成長｜這個階段我要把什麼還給自己？\n大雪要拿回「不完美也可以繼續」的權利。\n今天只能做到30分→做30分。\n今天累→縮小。\n今天失敗→明天返回。\n提問｜「如果我不再要求每天滿分，我最想長期守住哪三件事？」\n智慧｜對自己真正溫柔，是讓自己可以長久，而不是逼自己短暫完美。", "23": "斷捨離＋靈性提問｜現在該放下什麼？\n放下｜全有全無｜一天失敗就全部放棄｜完美計畫｜過度排滿。\n留下｜基準＋底線＋節奏＋返回能力。\n提問｜「人生最混亂的時候，我仍想守住哪三件事？」\n智慧｜答案就是你的生命核心。", "24": "14天生命實驗｜大雪穩定實驗\n第1天｜選3件最重要的事情。\n第2天｜記錄目前基準。\n第3天｜每件設計完整版。\n第4天｜設計縮小版。\n第5天｜設計最低版。\n第6天｜正常執行。\n第7天｜故意只做縮小版。\n第8天｜觀察是否容易持續。\n第9天｜找最大中斷原因。\n第10天｜移除一個阻力。\n第11天｜遇到干擾就啟動最低版。\n第12天｜測量返回速度。\n第13天｜比較「完美率」與「持續率」。\n第14天｜模型更新。\n目的｜建立「再忙也不歸零」的系統。\n公式｜基準→三版本→遇到波動→降級→守住→恢復→升級。", "25": "大雪 × 團購產品｜果效 × 機制\n\n大雪產品主軸｜不是「天冷＝大補」，而是把營養系統穩定下來：基礎飲食→蛋白質與脂肪酸→腸道→必要營養素→睡眠與生活環境。節氣本身不會製造營養缺口。\n\n① 071｜王牌粉（12g×30包）｜NT$2000\n果效｜依實際配方提供日常營養支持。\n機制｜不同營養成分→經消化、吸收後進入各自代謝路徑；需依完整成分與每份含量判斷。\n\n② 034｜胺基酸可可粉包（30包）｜NT$780\n果效｜提供胺基酸→補充蛋白質合成相關營養原料。\n機制｜胺基酸→吸收後進入人體胺基酸池→作為肌肉與其他組織蛋白質及含氮化合物合成原料。\n\n③ 002｜EPA+DHA複方粉包｜NT$1350\n果效｜補充EPA與DHA→支持正常脂肪酸營養與細胞膜組成。\n機制｜EPA、DHA→吸收後整合進細胞膜磷脂→並可作為多種脂質介質的前驅原料。\n\n④ 097｜亞麻仁油（500cc×2瓶）｜NT$780\n果效｜提供植物性必需脂肪酸ALA。\n機制｜ALA→參與細胞膜脂質與脂肪酸代謝→只有部分能轉換成EPA與DHA。\n\n⑤ 091｜甘氨酸鎂複方粉包｜NT$1350\n果效｜補充鎂→支持正常神經、肌肉與能量代謝。\n機制｜鎂→作為多種酵素反應輔因子→參與ATP相關反應、神經傳導與肌肉正常功能。\n\n⑥ 096｜孢子益生菌（加亞麻仁渣）（6g×30包）｜NT$650\n果效｜提供特定菌株與亞麻仁來源素材→支持日常腸道環境。\n機制｜芽孢型菌株具有特定環境耐受性；亞麻仁渣若含膳食纖維→部分可成為腸道菌群利用的底物。\n\n⑦ 046｜丁酸鈉複合包｜NT$890\n果效｜提供丁酸相關營養素材→支持日常腸道營養。\n機制｜丁酸屬短鏈脂肪酸→可作為結腸細胞能量來源之一，並參與腸道局部生理訊號。\n\n⑧ 049｜加強B群（膠囊）｜NT$520\n果效｜補充B群維生素→支持正常能量代謝與神經系統功能。\n機制｜不同B群→作為輔酶或輔酶前驅物→參與醣類、脂質、胺基酸等代謝；參與能量代謝不等於額外製造無限體力。\n\n⑨ 060｜Q10（10:1）（膠囊）｜NT$580\n果效｜提供Q10→支持正常細胞能量代謝。\n機制｜Q10→參與粒線體電子傳遞鏈→協助電子傳遞與ATP生成相關過程。\n\n⑩ 098｜粒線寶（膠囊）｜NT$550\n果效｜依實際配方提供能量代謝相關營養支持。\n機制｜實際作用取決於完整成分、含量與劑量；不能只由產品名稱推論效果。\n\n⑪ 092｜D3（5000IU）（錠）｜NT$580\n果效｜補充維生素D→支持正常鈣磷調節、骨骼與相關生理功能。\n機制｜維生素D→經體內轉換成活性形式→透過維生素D受體調節鈣磷相關生理。5000IU屬較高每日劑量，不宜只因冬季自行長期使用，應依總攝取、檢驗與專業評估。\n\n⑫ 069｜發熱襪｜NT$25\n果效｜提供足部日常保暖。\n機制｜材質與織法形成隔熱層→減少局部熱量散失；實際效果依材質與環境而異。\n\n⑬ 006｜專利HEZY氫鬆袋（買空袋送氫水）｜NT$250\n果效｜氫水部分可作為日常飲水來源；分子氫相關生理作用仍屬研究領域。\n機制｜水→支持正常體液平衡；溶解分子氫涉及氧化還原相關研究，但不能直接推論排毒、抗癌或疾病治療效果。\n\n⑭ 023｜行氣精油｜NT$1200\n果效｜提供芳香感官體驗→作為休息與生活節奏切換的環境提示。\n機制｜揮發性芳香分子→嗅覺受器→產生氣味感受；其他作用需依精油種類、濃度與實際使用方式判斷。\n\n大雪產品一條線｜基礎營養→071｜蛋白質原料→034｜脂肪酸→002／097｜鎂→091｜腸道→096／046｜能量代謝→049／060／098｜維生素D→092依需求評估｜保暖→069｜補水→006｜休息環境→023。\n\n大雪真正的穩定｜不要今天吃10種、明天全部忘記。先盤點飲食與現有產品→找真正缺口→避免重複→固定少數需要的→約2週觀察→再測→留下有價值的。持續疲勞、睡眠改變或其他反覆／加重症狀，應找真正原因。"}, "21": {"1": "節氣本質｜天地現在正在發生什麼？\n冬至是北半球一年中白晝最短、夜晚最長附近的時間點；冬至之後，白晝逐漸變長。它是天文上的重要轉折點，但通常不是一年最冷的一天，氣溫仍受到海洋、地表蓄熱與天氣系統等影響。\n大雪＝波動中守住。\n冬至＝守到最低點後，辨認新的方向。\n自然智慧｜最低點不一定是終點，也可能已經接近方向改變的位置。", "2": "節氣核心智慧｜自然正在教我什麼？\n冬至教的是「低谷中的轉機」。\n最黑的時候→光沒有永遠消失。\n最低的時候→趨勢也可能正在改變。\n人生低谷最重要的問題，不是「我怎麼立刻回到最高點？」\n而是｜「我今天怎樣不要繼續往下？」\n智慧｜低谷第一任務不是衝高，而是止跌＋守住＋重新啟動。", "3": "神聖語言｜這個節氣最值得對自己說什麼？\n「我現在看不到全部的路，也不代表沒有路。我不要求自己立刻變好，只要守住今天，找到下一個可以做到的小步，光就會一點一點回來。」", "4": "身心靈機制｜這個節氣容易怎麼呈現？如何解套？\n身｜日照短、氣溫與生活節奏改變→部分人的睡眠、活動與精神感受可能跟著改變。解套｜固定作息、白天適度接觸自然光、規律活動、正常飲食；持續明顯低落或身體不適要找真正原因。\n心｜低谷→容易把「現在」推論成「永遠」。解套｜把永久問題縮成今天問題。\n靈｜看不見結果→懷疑人生方向。解套｜先守住生命，不急著證明生命。\n公式｜承認低點→停止惡化→保住核心→尋找微小轉機→重新行動。", "5": "五臟智慧｜這個節氣在傳統養生中提醒什麼？\n傳統冬季常以「水、腎、藏」描述冬藏；冬至又有「陰極陽生」的文化象徵，可轉譯成「最低處開始孕育下一輪變化」。\n人生智慧｜低谷不適合過度消耗，更適合保存核心、等待條件成熟。\n提醒｜傳統文化觀察≠現代醫學診斷。", "6": "五行智慧｜此時的木火土金水正在教什麼？\n水｜收藏到深處。\n木｜新的生長尚未明顯，卻開始準備。\n火｜不是熊熊燃燒，而是一點不能熄滅的小火。\n土｜提供穩定承載。\n金｜繼續保留真正重要的。\n智慧｜希望不是幻想，而是為下一輪生長保留條件。", "7": "能量智慧｜現在應該怎麼用力？\n冬至＝低能量策略。\n100分做不到→做30分。\n30分做不到→做10分。\n10分也困難→守住吃飯、睡眠、安全與必要求助。\n智慧｜低谷不要用高峰時期的標準懲罰自己。", "8": "情緒智慧｜最值得觀察什麼？\n冬至最值得觀察「無望感」。\n今天很難→覺得明天也會很難。\n這次失敗→覺得自己永遠失敗。\n暫時看不到答案→認為沒有答案。\n情緒→需要｜無望→需要安全＋連結＋下一小步。\n智慧｜情緒是真的，但情緒對未來的預測不一定是真的。", "9": "心理需求｜此時真正缺的是什麼？\n核心需求＝希望感。\n但希望不是一直告訴自己「一定會成功」。\n真正希望＝我仍然有下一步。\n不知道最後答案→可以。\n只要知道今天做什麼→就能重新取得一點控制感。\n智慧｜希望＝選項仍然存在。", "10": "認知偏誤｜這個階段最容易想錯什麼？\n錯誤｜現在很糟＝未來都會很糟。\n這是把短期狀態延伸成永久結論。\n更正｜狀態會變｜條件會變｜能力會變｜資源會變｜方法也能變。\n智慧｜不要用人生最低的一天，替整個人生下判決。", "11": "預測錯誤｜原本以為A，現實告訴我B\n原本相信｜只有看到大成果，我才有希望。\n現實結果｜真正把人帶離低谷的，常是非常小的改善。\n睡好一點｜完成一件事｜有人陪｜得到一個資訊｜找到一個方法。\n新理解｜希望可以從「微小改善」開始建立。", "12": "模型更新｜這個節氣該淘汰哪個舊方法？\n舊方法｜低谷→逼自己振作→做不到→更加否定自己。\n新證據｜能量越低，越需要降低行動門檻。\n新方法｜先止跌→守基本→求支持→完成最小行動→得到回饋→逐步增加。\n模型更新｜「立刻振作」→「逐步恢復」。", "13": "真正瓶頸｜最容易卡在哪裡？\n冬至最大瓶頸＝把低谷誤認為永久。\n於是停止行動。\n停止求助。\n停止測試。\n停止尋找新選項。\n智慧｜只要還能產生一個新選項，系統就沒有完全關閉。", "14": "決策規則｜留下什麼可帶走的規則？\n當自己落到低點時，不做重大自我否定。\n先問四題：\n我能不能先停止繼續惡化？\n今天最重要的基本需求是什麼？\n誰可以幫我？\n最小下一步是什麼？\n規則｜低谷先保底，再談突破。", "15": "最小行動｜今天最值得做哪一步？\n畫一條「0→10生命線」。\n現在＿＿分。\n不是問「怎麼到10？」\n只問「怎麼從現在＋0.5？」\n可能是｜睡一覺｜吃一餐｜走10分鐘｜打一通電話｜完成一件小事｜取消一件負擔。\n智慧｜低谷最重要的不是巨大跳躍，而是方向先轉正。", "16": "高度主動｜我仍然能選什麼？\n不可控｜過去、別人的決定、突發事件、結果何時出現。\n可影響｜環境、支持系統、生活節奏、資訊品質。\n可直接行動｜求助、休息、吃飯、散步、減少負擔、完成一小步。\n智慧｜即使只能控制1%，那1%仍然是重新開始的位置。", "17": "關係智慧｜此時關係需要什麼？\n冬至＝陪伴。\n低谷中的人，不一定需要更多大道理。\n有時更需要｜有人聽｜有人在｜有人陪著處理下一件事。\n智慧｜真正的陪伴不是替對方解決整個人生，而是不讓他一個人承受全部重量。", "18": "親子智慧｜父母此時應該怎麼做？\n冬至＝孩子低谷時先成為安全基地。\n考差→先理解，再分析。\n失敗→先陪，再找原因。\n不知道未來→先穩定，再規劃。\n但安全基地≠父母代做全部事情。\n公式｜接住情緒→確認安全→拆小問題→孩子做下一步。\n智慧｜先恢復力量，再訓練能力。", "19": "學習智慧｜學生此時應長哪一種能力？\n冬至＝從低分重新爬起來的能力。\n不要一次救全部。\n先找最容易拉回的一類錯誤。\n例如｜單字不會→每天10字。\n文法弱→每天1規則＋5題。\n閱讀差→每天1段＋找錯因。\n公式｜最低分項→最小補強→再測→看到進步→增加難度。\n智慧｜進步感本身就是下一輪學習的燃料。", "20": "工作智慧｜此時工作應該做什麼？\n冬至＝救核心，不救全部。\n事情爆量時先分：\n一定要完成｜可以延後｜可以授權｜可以刪除。\n先保住最重要的20%。\n智慧｜危機時最重要的能力，不是全部完成，而是讓核心系統繼續運作。", "21": "財富智慧｜現在是什麼階段？\n冬至＝低谷風險管理。\n市場下跌、收入下降或突發支出時，不要只問「怎麼立刻賺回來？」\n先問｜現金流是否安全？｜必要支出多少？｜有沒有緊急預備？｜是否因焦慮做出超過承受能力的決策？\n智慧｜低谷第一順位是提高存活時間與選擇權，而不是急著翻本。", "22": "自我／女性成長｜這個階段我要把什麼還給自己？\n冬至要拿回「重新開始的權利」。\n我可以累。\n可以改變方向。\n可以承認現在做不到。\n可以重新安排人生。\n可以從很小的地方再開始。\n提問｜「如果我不必證明自己，我現在最需要照顧的是什麼？」", "23": "斷捨離＋靈性提問｜現在該放下什麼？\n放下｜永遠不會好了｜我一定要立刻振作｜低谷就是失敗｜求助代表弱。\n留下｜生命＋關係＋基本需求＋選項＋下一步。\n提問｜「如果黑夜不是結束，而是轉折前的一段時間，我現在最需要保護哪一點光？」", "24": "14天生命實驗｜冬至微光實驗\n第1天｜生命狀態0～10打分。\n第2天｜找最大耗損。\n第3天｜停止一個繼續惡化的因素。\n第4天｜找一個可以求助的人。\n第5天｜完成一個10分鐘行動。\n第6天｜固定睡眠／起床節奏中的一個點。\n第7天｜白天安排一段戶外活動。\n第8天｜完成一件拖延的小事。\n第9天｜記錄今天比昨天好0.5分的地方。\n第10天｜刪一件負擔。\n第11天｜重新測0～10。\n第12天｜找出最有效的改善因素。\n第13天｜重複它。\n第14天｜模型更新。\n目的｜不是14天變成10分，而是證明「狀態可以移動」。\n公式｜低點→保底→微行動→微改善→證據→希望→再行動。", "25": "冬至 × 團購產品｜果效 × 機制\n\n冬至產品主軸｜冬至不是「補越多越好」。真正順位仍是睡眠、正常飲食、足夠熱量與蛋白質、活動、白天光照與必要醫療評估；再依實際營養缺口選擇產品。\n\n① 039｜大補王｜NT$1560\n果效｜依實際配方提供基礎營養支持。\n機制｜不同營養成分→經消化吸收→進入各自代謝路徑；需依完整成分表與每份劑量判斷。\n\n② 071｜王牌粉（12g×30包）｜NT$2000\n果效｜依實際配方提供日常營養支持。\n機制｜產品實際作用取決於其中營養素、植物素材及其劑量→需依完整配方判斷，不由名稱推論。\n\n③ 098｜粒線寶（膠囊）｜NT$550\n果效｜依實際配方提供能量代謝相關營養素材。\n機制｜若含參與粒線體代謝的營養成分→可進入相應能量代謝路徑；實際作用依完整配方與劑量判斷。\n\n④ 060｜Q10（10:1）（膠囊）｜NT$580\n果效｜提供Q10→支持正常細胞能量代謝。\n機制｜Q10→參與粒線體電子傳遞鏈→協助電子傳遞與能量生成相關過程。\n\n⑤ 034｜胺基酸可可粉包（30包）｜NT$780\n果效｜提供胺基酸→補充蛋白質合成相關營養原料。\n機制｜胺基酸→吸收後進入人體胺基酸池→供肌肉與其他組織蛋白質及含氮化合物合成使用。\n\n⑥ 002｜EPA+DHA複方粉包｜NT$1350\n果效｜補充EPA與DHA→支持正常脂肪酸營養與細胞膜組成。\n機制｜EPA、DHA→吸收後可整合進細胞膜磷脂→並作為多種脂質介質的前驅原料。\n\n⑦ 091｜甘氨酸鎂複方粉包｜NT$1350\n果效｜補充鎂→支持正常神經、肌肉與能量代謝。\n機制｜鎂→作為多種酵素反應的輔因子→參與能量代謝、神經傳導與肌肉正常功能。\n\n⑧ 054｜GABA（膠囊）｜NT$540\n果效｜提供GABA，作為放鬆與睡眠相關營養研究素材。\n機制｜GABA是人體重要的抑制性神經傳導物質；口服後實際作用存在個體差異，不能直接等同睡眠治療。\n\n⑨ 047｜刺五加（膠囊）｜NT$495\n果效｜提供刺五加植物萃取相關素材，常見於壓力適應研究。\n機制｜刺五加含多種植物化學成分→可能涉及壓力反應相關生理路徑；實際效果取決於萃取規格、劑量與個體狀況。\n\n⑩ 070｜辣木粉｜NT$450\n果效｜增加植物來源營養與植化素攝取。\n機制｜辣木葉中的營養素與植物化學成分→經消化、吸收與代謝→成為整體飲食的一部分。\n\n⑪ 097｜亞麻仁油（500cc×2瓶）｜NT$780\n果效｜提供植物性必需脂肪酸ALA。\n機制｜ALA→參與脂肪酸代謝與細胞膜脂質組成→部分可轉換成EPA與DHA，但轉換率有限。\n\n⑫ 094｜D3（2000IU＋A＋E）（錠）｜NT$580\n果效｜提供維生素D、A、E相關營養支持。\n機制｜維生素D參與鈣磷調節；維生素A參與視覺、上皮與正常免疫功能；維生素E具有脂溶性抗氧化作用。是否需要額外補充仍看飲食、日照、總攝取與個人狀況。\n\n⑬ 069｜發熱襪｜NT$25\n果效｜提供足部日常保暖。\n機制｜衣物材質與織法→形成隔熱層→降低局部熱量散失。\n\n⑭ 006｜專利HEZY氫鬆袋（買空袋送氫水）｜NT$250\n果效｜氫水部分可作為日常飲水來源；分子氫相關生理作用仍屬研究領域。\n機制｜水→支持正常體液平衡；分子氫則有氧化還原相關研究，但不能因此推論排毒、抗癌或疾病治療效果。\n\n冬至產品一條線｜基礎營養→039／071｜能量代謝→098／060｜蛋白質原料→034｜脂肪酸→002／097｜鎂→091｜放鬆素材→054｜植物素材→047／070｜維生素→094｜保暖→069｜補水→006。\n\n如果低落、無望、失眠或疲勞持續數週、明顯影響生活，或出現傷害自己的念頭，不要只當成「冬至狀態」，應儘快尋求專業協助；節氣可以提醒我們觀察，但不能替代診斷與治療。"}, "22": {"1": "節氣本質｜天地現在正在發生什麼？\n小寒是冬季第五個節氣，進入一年中較寒冷的時段之一；實際冷暖仍依地區與當年天氣而異。\n冬至＝低谷中重新看見轉機。\n小寒＝看見轉機之後，不急著衝，先做好準備。\n自然智慧｜真正的安全，不是相信意外不會發生，而是意外發生時我有準備。", "2": "節氣核心智慧｜自然正在教我什麼？\n小寒教的是「預備」。\n不是悲觀，而是提前想一步。\n不是一直擔心，而是把擔心變成行動。\n怕生病→建立基本健康管理。\n怕考差→提早找弱點。\n怕工作爆量→先做範本。\n怕缺錢→建立緊急預備。\n怕孩子出問題→建立求助路線。\n智慧｜焦慮只告訴我「可能有風險」；準備才真正降低風險。", "3": "神聖語言｜這個節氣最值得對自己說什麼？\n「我不需要預知所有未來。我只需要知道：如果事情沒有照預期發展，我仍然有第二條路、第三條路，還有重新選擇的能力。」", "4": "身心靈機制｜這個節氣容易怎麼呈現？如何解套？\n身｜較冷環境可能改變活動、睡眠、衣著與日常舒適度。解套｜依實際天氣做好保暖、規律飲食、活動與睡眠，而不是把所有不適都歸因於「寒」。\n心｜不知道未來→反覆想最壞情況。解套｜把「如果怎麼辦？」改寫成「如果發生，我要怎麼做？」\n靈｜渴望完全掌控未來→越想越怕。解套｜接受不確定，但增加準備。\n公式｜辨識風險→估計影響→提前準備→建立備案→真正發生→快速應對。", "5": "五臟智慧｜這個節氣在傳統養生中提醒什麼？\n傳統冬季常以「水、腎、藏」描述收藏意象；小寒可以進一步轉成「保存核心、減少不必要耗損、為嚴峻條件做準備」。\n人生智慧｜不要等資源見底，才開始保護資源。\n提醒｜傳統文化觀察≠現代醫學診斷。", "6": "五行智慧｜此時的木火土金水正在教什麼？\n水｜保存資源。\n木｜新生尚未真正展開，先準備。\n火｜保留必要動力。\n土｜穩住基本供應。\n金｜排除不必要風險。\n智慧｜真正的準備＝不是囤最多，而是知道什麼最不能缺。", "7": "能量智慧｜現在應該怎麼用力？\n小寒＝不要把能量用到100%。\n時間留緩衝。\n體力留餘裕。\n金錢留預備。\n工作留備案。\n行程不要全部塞滿。\n智慧｜系統最危險的狀態，常常不是資源少，而是沒有任何緩衝。", "8": "情緒智慧｜最值得觀察什麼？\n小寒最值得觀察「擔心」。\n低階擔心｜一直想「萬一怎麼辦？」\n高階擔心｜把「萬一」變成準備清單。\n情緒→需要｜擔心→需要資訊＋備案＋可控制行動。\n智慧｜焦慮如果能轉成準備，就不必一直停留在腦中。", "9": "心理需求｜此時真正缺的是什麼？\n核心需求＝可預期感。\n我們無法讓世界完全可預期，但可以讓自己的反應變得比較可預期。\n事情A發生→我知道找誰。\n事情B發生→我知道先做什麼。\n事情C發生→我有備用資源。\n智慧｜安全感的一部分，來自「我已經想過下一步」。", "10": "認知偏誤｜這個階段最容易想錯什麼？\n錯誤｜只要我規劃得夠好，就不會出問題。\n現實｜再好的計畫也會遇到意外。\n更正｜好計畫不是消滅所有風險，而是出問題後仍能運作。\n智慧｜不要只設計成功路線，也要設計失敗路線。", "11": "預測錯誤｜原本以為A，現實告訴我B\n原本相信｜事情應該會照計畫進行。\n現實結果｜真正讓人措手不及的，常是沒有準備的偏差。\n差異｜我只有「正常版本」，沒有「意外版本」。\n新理解｜重要系統都需要備案。", "12": "模型更新｜這個節氣該淘汰哪個舊方法？\n舊方法｜先假設一切正常→出事再處理。\n新證據｜臨時處理通常成本更高、選項更少。\n新方法｜事前辨識→先做低成本預防→準備備案→真正發生再啟動。\n模型更新｜「希望不要發生」→「如果發生，我知道怎麼辦」。", "13": "真正瓶頸｜最容易卡在哪裡？\n小寒最大瓶頸＝單點故障。\n只有一個人知道怎麼做。\n只有一份資料。\n只有一種收入。\n只有一套教學方法。\n只有一個登入方式。\n只有一條解決路線。\n智慧｜只要一個點壞掉就全部停止，系統就太脆弱。", "14": "決策規則｜留下什麼可帶走的規則？\n先問四題：\n發生機率高嗎？\n一旦發生影響大嗎？\n現在能低成本預防嗎？\n有沒有備案？\n規則｜高影響＋可提前準備→現在就準備。\n低影響＋低機率→不要用大量生命一直擔心。", "15": "最小行動｜今天最值得做哪一步？\n今天只做一張「如果→那麼」表。\n如果學生大量缺交→那麼＿＿。\n如果工作突然增加→那麼＿＿。\n如果孩子需要幫助→那麼＿＿。\n如果收入突然下降→那麼＿＿。\n如果自己突然沒有體力→那麼＿＿。\n智慧｜把模糊的怕，變成清楚的下一步。", "16": "高度主動｜我仍然能選什麼？\n不可控｜意外是否發生、別人的決定、制度改變、天氣。\n可影響｜資訊、合作、家庭分工、環境與資源配置。\n可直接行動｜備份、預留、保險、求助名單、緊急預備、替代方案。\n智慧｜我不能控制事件，但可以降低自己被事件擊倒的程度。", "17": "關係智慧｜此時關係需要什麼？\n小寒＝提前說清楚。\n不要等衝突發生才談界線。\n不要等累到不行才說需要幫忙。\n不要等失望累積才說期待。\n策略｜事前說明需求＋界線＋分工＋替代方案。\n智慧｜很多關係危機，不是沒有愛，而是沒有事前協調。", "18": "親子智慧｜父母此時應該怎麼做？\n小寒＝教孩子「遇到問題怎麼辦」。\n不是替孩子排除所有危險。\n而是一起練習：\n忘帶東西→怎麼處理？\n考差→下一步？\n和同學衝突→找誰？\n手機失控→怎麼重新開始？\n智慧｜真正保護孩子，不是讓他永遠不出事，而是讓他出事時有處理能力。", "19": "學習智慧｜學生此時應長哪一種能力？\n小寒＝考前風險管理。\n不要只讀會的。\n先找｜最弱單元｜高頻錯誤｜容易忘的單字｜時間不足題型。\n再建立備案｜題目不會怎麼猜？｜時間不足先放哪題？｜卡住多久要跳？\n智慧｜考試能力不只是「會多少」，也包括「不會時怎麼處理」。", "20": "工作智慧｜此時工作應該做什麼？\n小寒＝建立備援系統。\n重要檔案→備份。\n固定工作→標準流程。\n常見問題→範本。\n只有自己會→交接文件。\n突發班務→處理流程。\n高頻提醒→自動化。\n智慧｜真正自由，不是事情變少，而是事情不再只能靠我。", "21": "財富智慧｜現在是什麼階段？\n小寒＝財務防守。\n先問｜如果收入中斷怎麼辦？｜突發支出從哪裡來？｜資產是否過度集中？｜固定支出是否太高？｜有沒有流動資源？\n智慧｜投資是在增加未來可能性；風險管理是在保護自己還能留在場上。", "22": "自我／女性成長｜這個階段我要把什麼還給自己？\n小寒要拿回「選擇權」。\n不是所有責任都只能我扛。\n不是所有收入只能來自一處。\n不是所有問題只有一種答案。\n不是所有人生都只能照原計畫。\n提問｜「如果原本那條路走不通，我還有哪三條路？」\n智慧｜選項越多，面對不確定越有底氣。", "23": "斷捨離＋靈性提問｜現在該放下什麼？\n放下｜事情一定照計畫｜只准成功不能失敗｜一直擔心卻不準備｜把安全感建立在控制所有人。\n留下｜備案＋緩衝＋資源＋支持＋選擇權。\n提問｜「我真正害怕的是事情發生，還是事情發生時我不知道怎麼辦？」\n智慧｜準備不是恐懼未來，而是尊重不確定。", "24": "14天生命實驗｜小寒備援實驗\n第1天｜列出5個重要領域：健康／家庭／工作／財務／資料。\n第2天｜每個領域找1個最大風險。\n第3天｜分成高影響／低影響。\n第4天｜找出最不能承受的一項。\n第5天｜做1個低成本預防。\n第6天｜建立1個備案。\n第7天｜備份1份重要資料。\n第8天｜整理1份求助名單。\n第9天｜替1件工作寫標準流程。\n第10天｜找出1個單點故障。\n第11天｜建立替代路線。\n第12天｜模擬「如果真的發生」。\n第13天｜找出準備不足處。\n第14天｜模型更新。\n目的｜不是預測所有問題，而是降低「一出問題就全垮」的機率。\n公式｜風險→影響→預防→備案→模擬→修正→準備完成。", "25": "小寒 × 團購產品｜果效 × 機制\n\n小寒產品主軸｜「準備」不等於囤一堆補充品。先建立睡眠、飲食、保暖、活動、醫療與家庭備援，再依實際營養需求配置少數產品；節氣本身不會創造營養素缺乏。\n\n① 069｜發熱襪｜NT$25\n果效｜提供足部日常保暖。\n機制｜織物與皮膚間形成隔熱層→減少局部熱量散失→實際保暖程度依材質、厚度與環境而異。\n\n② 017｜酵母鋅＋核酸｜NT$550\n果效｜補充鋅→支持正常免疫功能、蛋白質與DNA合成。\n機制｜鋅→作為多種酵素與蛋白質的重要輔因子→參與正常細胞生理；核酸部分需依實際配方判斷。\n\n③ 085｜NAC複方（膠囊）｜NT$530\n果效｜提供NAC及實際配方中的其他營養素材。\n機制｜NAC可提供半胱胺酸來源→參與穀胱甘肽合成相關路徑；完整產品作用仍需依複方成分與劑量判斷。\n\n④ 002｜EPA+DHA複方粉包｜NT$1350\n果效｜補充EPA與DHA→支持正常脂肪酸營養與細胞膜組成。\n機制｜EPA、DHA→吸收後可整合進細胞膜磷脂→並作為多種脂質介質的前驅原料。\n\n⑤ 034｜胺基酸可可粉包（30包）｜NT$780\n果效｜提供胺基酸→補充蛋白質合成相關營養原料。\n機制｜胺基酸→吸收後進入人體胺基酸池→作為肌肉與其他組織蛋白質及含氮化合物的合成原料。\n\n⑥ 096｜孢子益生菌（加亞麻仁渣）（6g×30包）｜NT$650\n果效｜提供特定菌株與亞麻仁來源素材→支持日常腸道環境。\n機制｜芽孢型菌株具有特定環境耐受特性；亞麻仁渣若含可利用纖維→部分可成為腸道菌群的底物。\n\n⑦ 046｜丁酸鈉複合包｜NT$890\n果效｜提供丁酸相關營養素材→支持日常腸道營養。\n機制｜丁酸屬短鏈脂肪酸→可作為結腸細胞能量來源之一→並參與腸道局部生理訊號。\n\n⑧ 091｜甘氨酸鎂複方粉包｜NT$1350\n果效｜補充鎂→支持正常神經、肌肉與能量代謝。\n機制｜鎂→作為多種酵素反應的輔因子→參與能量代謝、神經傳導與肌肉正常功能。\n\n⑨ 060｜Q10（10:1）（膠囊）｜NT$580\n果效｜提供Q10→支持正常細胞能量代謝。\n機制｜Q10→參與粒線體電子傳遞鏈→協助電子傳遞與能量生成相關過程。\n\n⑩ 094｜D3（2000IU＋A＋E）（錠）｜NT$580\n果效｜提供維生素D、A、E相關營養支持。\n機制｜維生素D參與鈣磷調節；維生素A參與正常視覺與上皮生理；維生素E參與脂質環境中的抗氧化作用。是否需要補充仍依飲食、日照與個人狀況判斷。\n\n⑪ 004｜益生菌牙膏｜NT$79\n果效｜協助日常牙齒與口腔清潔。\n機制｜刷牙的機械作用＋牙膏配方→協助移除牙菌斑與食物殘留；益生菌相關作用需依實際菌株與產品證據判斷。\n\n⑫ 082｜牙間刷（一盒）｜NT$140\n果效｜協助清潔一般牙刷較難到達的牙間區域。\n機制｜細小刷毛→進入牙間空間→機械性移除部分牙菌斑與食物殘留。\n\n⑬ 012｜接地線路檢測儀｜NT$199\n果效｜協助確認特定插座的線路與接地狀態。\n機制｜檢測器→依插座電氣連接狀態顯示結果→可作為相關設備使用前的環境確認工具。\n\n⑭ 006｜專利HEZY氫鬆袋（買空袋送氫水）｜NT$250\n果效｜氫水部分可作為日常飲水來源；分子氫相關作用仍屬研究領域。\n機制｜水→支持正常體液平衡；溶解分子氫則涉及氧化還原相關研究，但不能因此推論排毒、抗癌或疾病治療效果。\n\n小寒產品一條線｜保暖→069｜鋅→017｜穀胱甘肽相關原料→085｜脂肪酸→002｜蛋白質原料→034｜腸道→096／046｜鎂→091｜能量代謝→060｜維生素→094｜口腔→004／082｜環境檢查→012｜補水→006。\n\n小寒真正的健康準備｜睡眠穩定→飲食正常→保暖→規律活動→慢性病與用藥管理→需要時再依缺口補充。若有持續疲勞、呼吸困難、胸痛、高燒或其他明顯／加重症狀，應尋求醫療評估，不要只用「寒氣」解釋。"}, "23": {"1": "節氣本質｜天地現在正在發生什麼？\n大寒是二十四節氣最後一個節氣，也是冬季最後一個節氣。名稱代表傳統季節觀察進入寒冷深處，但實際冷暖仍依地區與當年天氣而異。再往後，就是立春，新循環即將開始。\n小寒＝為風險做準備。\n大寒＝把整輪經驗整理成下一輪的新版方法。\n自然智慧｜真正的結束，不是句點，而是下一次開始前的更新。", "2": "節氣核心智慧｜自然正在教我什麼？\n大寒教的是「更新」。\n做過很多事≠得到很多智慧。\n經歷很多失敗≠自然會成長。\n真正的成長是：\n發生什麼→我原本怎麼想→結果怎樣→哪裡判斷錯→下次改什麼。\n智慧｜經驗只有經過整理，才會變成能力。", "3": "神聖語言｜這個節氣最值得對自己說什麼？\n「我不需要證明過去的自己都是對的。我願意看見錯誤、承認差異、留下有效方法、淘汰過期方法。每一次更新，都讓下一個自己更自由。」", "4": "身心靈機制｜這個節氣容易怎麼呈現？如何解套？\n身｜冬季環境仍可能偏冷，活動、睡眠、飲食與生活節奏需要依真實狀態調整。解套｜不要用「冬天應該怎樣」取代自己的實際回饋。\n心｜一年累積大量事件→容易只記得最痛或最近發生的事情。解套｜用紀錄重新看完整證據。\n靈｜害怕承認自己曾經判斷錯→一直維護舊身份。解套｜把「我錯了」改成「我得到新資料了」。\n公式｜經驗→回饋→預測錯誤→找差異→模型更新→下一輪。", "5": "五臟智慧｜這個節氣在傳統養生中提醒什麼？\n傳統冬季常以「水、腎、藏」描述收藏意象。大寒走到冬季末端，更適合轉譯成「收藏一整年的精華，準備下一次生發」。\n不是把所有舊東西留下。\n而是把真正有價值的留下。\n提醒｜傳統文化觀察≠現代醫學診斷。\n智慧｜最高級的收藏，是收藏經驗裡的智慧。", "6": "五行智慧｜此時的木火土金水正在教什麼？\n水｜完成收藏。\n木｜準備下一輪萌芽。\n火｜等待新的動力。\n土｜把經驗沉澱成基礎。\n金｜最後一次篩選與切割。\n智慧｜大寒不是只有「藏」，而是「藏完之後準備重新生」。", "7": "能量智慧｜現在應該怎麼用力？\n大寒＝不急著再開新戰場。\n先問：\n什麼值得繼續？\n什麼需要停止？\n什麼可以自動化？\n什麼應該交出去？\n什麼值得下一輪加碼？\n智慧｜開始新計畫之前，先把舊系統更新。", "8": "情緒智慧｜最值得觀察什麼？\n大寒最值得觀察「懊悔」。\n早知道就不要......\n早知道應該......\n如果當時......\n懊悔如果只重播過去→消耗。\n懊悔如果提取規則→智慧。\n情緒→需要｜懊悔→需要修正下一次選擇。\n智慧｜過去不能修改，但未來的決策規則可以修改。", "9": "心理需求｜此時真正缺的是什麼？\n核心需求＝完成感。\n很多人不是事情沒做完，而是心理上從未「結案」。\n做完→沒有整理。\n失敗→沒有理解。\n成功→不知道為什麼成功。\n於是大腦一直掛著。\n智慧｜真正完成＝結果出來＋經驗整理＋下一步清楚。", "10": "認知偏誤｜這個階段最容易想錯什麼？\n錯誤｜結果不好＝我不好。\n結果好＝方法一定對。\n更正｜結果只是資料。\n好結果可能有運氣。\n壞結果可能有外部限制。\n真正要問｜方法、環境、能力、時機各自貢獻多少？\n智慧｜不要評判自己，先分析系統。", "11": "預測錯誤｜原本以為A，現實告訴我B\n原本相信｜只要努力，就一定得到預期結果。\n現實結果｜努力相同，方法、時機、環境與資源不同，結果仍可能不同。\n差異｜把「努力」誤認為唯一變因。\n新理解｜結果＝努力×方法×能力×環境×時機×運氣。\n智慧｜努力值得保留，但方法必須接受現實檢驗。", "12": "模型更新｜這個節氣該淘汰哪個舊方法？\n舊方法｜結果不好→更用力做同一件事。\n新證據｜投入增加，但結果沒有同步改善。\n新方法｜停止→找差異→找瓶頸→只改一個關鍵變因→再測。\n模型更新｜「更努力」→「更準確」。", "13": "真正瓶頸｜最容易卡在哪裡？\n大寒最大瓶頸＝只有經驗，沒有更新。\n教了一年→明年完全重來。\n帶了一屆→沒有留下班級系統。\n做了團購→不知道哪種文章真正有效。\n孩子出問題→每次重新焦慮。\n投資虧損→只記得痛，沒留下規則。\n智慧｜沒有模型更新，人生就會重複繳同一筆學費。", "14": "決策規則｜留下什麼可帶走的規則？\n每個重要事件結束後問六題：\n我原本預測什麼？\n實際發生什麼？\n差異在哪裡？\n真正瓶頸是什麼？\n下次只改哪一件事？\n什麼時候再測？\n規則｜沒有回饋，就不急著下結論；有新證據，就允許自己改答案。", "15": "最小行動｜今天最值得做哪一步？\n今天只更新一個模型。\n寫四行：\n我原本以為｜＿＿＿＿\n實際結果｜＿＿＿＿\n我忽略了｜＿＿＿＿\n下次改成｜＿＿＿＿\n智慧｜一個真正被更新的錯誤，比收藏100條金句更有價值。", "16": "高度主動｜我仍然能選什麼？\n不可控｜過去、別人的選擇、已經發生的結果。\n可影響｜下一次合作、環境、資源與流程。\n可直接行動｜承認錯誤、改方法、重新測試、停止無效投入、建立新規則。\n智慧｜高度主動不是「我永遠不錯」，而是「錯了，我能更新」。", "17": "關係智慧｜此時關係需要什麼？\n大寒＝更新關係模型。\n不要一直用三年前的印象看今天的人。\n他以前不成熟≠現在不成熟。\n孩子以前需要幫忙≠現在仍要代做。\n曾經受傷≠永遠不能重新設定界線。\n策略｜重新觀察→重新理解→重新協商。\n智慧｜真正尊重一個人，就是允許他改變。", "18": "親子智慧｜父母此時應該怎麼做？\n大寒＝更新孩子版本，也更新父母版本。\n問：\n今年孩子多會了什麼？\n哪裡仍需要支持？\n哪些事情我可以退出？\n哪些風險仍需要守底線？\n下一階段最值得培養哪一種能力？\n智慧｜孩子每升級一次，父母的角色也要更新一次。", "19": "學習智慧｜學生此時應長哪一種能力？\n大寒＝錯誤模型更新力。\n不要只看分數。\n把錯題分類：\n不知道→補知識。\n看錯→建立檢查。\n忘記→間隔提取。\n不會用→增加變式。\n時間不足→改作答順序。\n一直錯同類→找到真正瓶頸。\n公式｜錯題→分類→原因→策略→再測。\n智慧｜錯題不是失敗紀錄，而是下一次進步的導航。", "20": "工作智慧｜此時工作應該做什麼？\n大寒＝年度工作系統更新。\n把工作分成：\n刪｜不再做。\n併｜集中處理。\n授｜交給別人。\n自動｜交給系統。\n資產化｜做一次以後可以重複使用。\n保留｜只有我能做＋真正高價值。\n智慧｜年度回顧不是列出做了多少，而是讓明年的工作量下降、成果上升。", "21": "財富智慧｜現在是什麼階段？\n大寒＝年度財務模型更新。\n不要只問今年賺多少。\n也問｜哪些收入最穩？｜哪些支出最沒價值？｜哪次決策是運氣？｜哪次損失暴露風險？｜現金流夠不夠？｜資產是否過度集中？\n智慧｜真正的財富能力不是每次判斷正確，而是錯一次之後，不再用同樣的方法錯第二次。", "22": "自我／女性成長｜這個階段我要把什麼還給自己？\n大寒要拿回「重新定義自己的權利」。\n以前的我，不必限制現在的我。\n曾經失敗，不代表我是失敗的人。\n曾經選錯，不代表不能改路。\n曾經答應，也可以因條件改變重新評估。\n提問｜「如果我不需要忠於舊版本的自己，明年我最想成為怎樣的人？」\n智慧｜成長不是找到固定的自己，而是不斷更新自己。", "23": "斷捨離＋靈性提問｜現在該放下什麼？\n放下｜過期方法｜舊身份｜無效承諾｜錯誤假設｜沉沒成本｜一定要證明自己沒錯。\n留下｜真正有效的方法｜重要關係｜核心能力｜可重複資產｜最重要的人生原則。\n提問｜「如果明天就是新的立春，我要帶什麼走？又要把什麼留在這一輪？」", "24": "14天生命實驗｜大寒模型更新實驗\n第1天｜列今年10個重要事件。\n第2天｜選1個最好結果。\n第3天｜找出它真正成功的原因。\n第4天｜選1個最差結果。\n第5天｜寫下原本預測。\n第6天｜寫下實際結果。\n第7天｜找最大差異。\n第8天｜找真正瓶頸。\n第9天｜找一個過期假設。\n第10天｜設計新版方法。\n第11天｜做一個最小測試。\n第12天｜收集回饋。\n第13天｜保留有效、刪除無效。\n第14天｜寫成一條新的決策規則。\n目的｜不是證明今年做得很好，而是讓明年的自己更聰明。\n公式｜經驗→預測→結果→差異→瓶頸→修正→再測→模型更新。", "25": "大寒 × 團購產品｜果效 × 機制\n\n大寒產品主軸｜大寒最適合做的不是「冬天最後大補一次」，而是年度營養盤點：現在吃什麼→為什麼吃→是否重複→是否真的需要→有沒有可觀察結果→下一輪保留什麼。節氣本身不會創造營養素需求。\n\n① 039｜大補王｜NT$1560\n果效｜依實際配方提供基礎營養支持。\n機制｜不同營養成分→經消化吸收→進入各自代謝路徑；是否適合長期保留，需依完整成分、劑量、飲食缺口與實際需求判斷。\n\n② 071｜王牌粉（12g×30包）｜NT$2000\n果效｜依實際配方提供日常營養支持。\n機制｜產品實際作用取決於其中營養成分與每份含量→需依完整配方判斷，不能單由產品名稱推論效果。\n\n③ 098｜粒線寶（膠囊）｜NT$550\n果效｜依實際配方提供能量代謝相關營養素材。\n機制｜若配方含參與粒線體代謝的營養成分→可分別進入相應代謝路徑；實際作用仍需依完整配方判斷。\n\n④ 061｜NMN複方（膠囊）｜NT$570\n果效｜提供健康老化研究相關營養素材。\n機制｜NMN是菸鹼醯胺腺嘌呤二核苷酸生合成途徑的前驅物之一→因此受到細胞能量與老化研究關注；機制有研究價值不等於已證實可以逆轉人體老化。\n\n⑤ 060｜Q10（10:1）（膠囊）｜NT$580\n果效｜提供Q10→支持正常細胞能量代謝。\n機制｜Q10→參與粒線體電子傳遞鏈→協助電子傳遞與能量生成相關過程。\n\n⑥ 002｜EPA+DHA複方粉包｜NT$1350\n果效｜提供EPA與DHA→支持正常脂肪酸營養與細胞膜組成。\n機制｜EPA、DHA→吸收後可整合進細胞膜磷脂→也能作為多種脂質介質的前驅原料。\n\n⑦ 097｜亞麻仁油（500cc×2瓶）｜NT$780\n果效｜提供植物性必需脂肪酸ALA。\n機制｜ALA→參與脂肪酸代謝與細胞膜脂質組成→部分可轉換為EPA與DHA，但轉換率有限。\n\n⑧ 034｜胺基酸可可粉包（30包）｜NT$780\n果效｜提供胺基酸→補充蛋白質合成相關營養原料。\n機制｜胺基酸→吸收後進入人體胺基酸池→作為肌肉及其他組織蛋白質與含氮化合物合成原料。\n\n⑨ 091｜甘氨酸鎂複方粉包｜NT$1350\n果效｜補充鎂→支持正常神經、肌肉與能量代謝。\n機制｜鎂→作為多種酵素反應的輔因子→參與能量代謝、神經傳導與肌肉正常功能；真正補充量應看元素鎂含量。\n\n⑩ 096｜孢子益生菌（加亞麻仁渣）（6g×30包）｜NT$650\n果效｜提供特定菌株與亞麻仁來源素材→支持日常腸道環境。\n機制｜芽孢型菌株具有特定環境耐受特性；亞麻仁渣若含可利用纖維→部分可成為腸道菌群利用的底物。\n\n⑪ 046｜丁酸鈉複合包｜NT$890\n果效｜提供丁酸相關營養素材→支持日常腸道營養。\n機制｜丁酸屬短鏈脂肪酸→可作為結腸細胞能量來源之一→並參與腸道局部生理訊號。\n\n⑫ 079｜憂遁草粉｜NT$750\n果效｜提供植物來源營養與植化素素材。\n機制｜植物中的多種天然化合物→經消化、吸收與代謝→進入不同生理路徑；細胞或動物研究結果不能直接推論成人體抗癌或疾病治療效果。\n\n⑬ 090｜人參皂苷複方（膠囊）｜NT$560\n果效｜提供人參皂苷相關植物素材。\n機制｜人參皂苷屬人參中的活性天然化合物→涉及多種生理研究；實際作用取決於皂苷種類、含量、配方與個人狀況。\n\n⑭ 006｜專利HEZY氫鬆袋（買空袋送氫水）｜NT$250\n果效｜氫水部分可作為日常飲水來源；分子氫相關生理作用仍屬研究領域。\n機制｜水→支持正常體液平衡；溶解分子氫涉及氧化還原相關研究，但不能由此推論排毒、抗癌或疾病治療效果。\n\n大寒產品一條線｜不是「全部留下」→而是「年度模型更新」｜基礎營養→039／071｜能量代謝→098／060｜健康老化研究→061｜脂肪酸→002／097｜蛋白質原料→034｜鎂→091｜腸道→096／046｜植物素材→079／090｜補水→006。\n\n大寒產品模型更新｜正在吃什麼→目的為何→成分是否重複→劑量多少→有沒有客觀或主觀基準→約2週看回饋→有效且有需要才保留→無明確目的重新評估。若有慢性疾病、正在用藥、症狀持續或惡化，應把醫療評估放在節氣補充之前。"}};
