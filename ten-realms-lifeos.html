<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12273b"><title>十法界 LifeOS｜Bilingual Learning App</title><style>
:root{--bg:#f4f6f8;--paper:#fff;--ink:#1c2d3a;--muted:#5c6d7c;--line:#dbe3e9;--navy:#12273b;--teal:#0c796e;--accent:#c28a3e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Noto Sans TC','Microsoft JhengHei',sans-serif;line-height:1.65}button,select,input,textarea{font:inherit}button{cursor:pointer}header{background:linear-gradient(130deg,#12273b,#21495b);color:white;padding:28px max(20px,calc((100vw - 1200px)/2));}header h1{margin:0;font-size:clamp(26px,4vw,42px)}header p{margin:7px 0 0;color:#d9e5ec}.eyebrow{letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:#a6d4d0}main{max-width:1200px;margin:auto;padding:20px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.btn,.tab{background:white;border:1px solid var(--line);border-radius:12px;padding:9px 15px;color:var(--ink)}.btn:hover,.tab:hover{border-color:var(--teal)}.active{background:var(--navy)!important;color:white!important;border-color:var(--navy)!important}.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px}.panel{display:none}.panel.active-panel{display:block}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 3px 18px #18304408}.card h2,.card h3{margin:0 0 12px}.muted{color:var(--muted)}.small{font-size:13px}.dual{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dual>div{background:#f5f8fa;padding:10px 13px;border-radius:10px}.en{color:#486172}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.realm-tile{padding:17px;border-radius:15px;background:white;border:1px solid var(--line);text-align:left}.realm-tile strong{font-size:19px}.realm-tile span{display:block;color:var(--muted);font-size:13px}.realm-tile:hover{border-color:var(--teal);transform:translateY(-1px)}.pill{display:inline-block;border-radius:100px;background:#e7f3f0;color:#086c62;font-size:12px;padding:3px 10px;margin:3px}.field{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}.field select,.field input,.field textarea{border:1px solid #bac8d1;background:white;border-radius:10px;padding:9px;max-width:100%}.field textarea{width:100%;min-height:85px}.quote{border-left:4px solid var(--accent);padding:10px 15px;margin:12px 0;background:#fbfaf6;border-radius:0 10px 10px 0}.quote .en{margin-top:4px}.table-wrap{overflow:auto;border-radius:14px;border:1px solid var(--line);background:white}table{width:100%;border-collapse:collapse;min-width:840px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:11px;vertical-align:top}th{background:#e9f0f4;position:sticky;top:0}td:first-child{font-weight:700;white-space:nowrap}tr:hover td{background:#f7fafb}.mind{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mind .branch{border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:12px;padding:16px;background:#fff}.mind .branch h3{margin:0 0 8px}.step{padding:13px 16px;background:#f0f5f6;border-radius:12px;margin:8px 0}.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}.compare .card{margin:0}.notice{background:#fff8e9;border:1px solid #ead9b6;border-radius:12px;padding:13px 16px}.correct{color:#087466;font-weight:700}.wrong{color:#a34730;font-weight:700}footer{color:var(--muted);text-align:center;padding:30px 20px}.hidden{display:none!important}@media(max-width:700px){.dual,.mind,.compare{grid-template-columns:1fr}main{padding:12px}.card{padding:15px}header{padding:25px 18px}}
@media print{header{color:black;background:white}.toolbar,.tabs,.no-print{display:none!important}.panel{display:block!important}.card{break-inside:avoid}main{max-width:none}}
</style></head><body><header><div class="eyebrow">LifeOS · Buddhist Philosophy × Systems Thinking</div><h1>十法界生命智慧 APP</h1><p>Ten Realms · Bilingual Knowledge Atlas · 繁體中文 / English</p><p class="small">BUD-OS-0049 · 十界互具 · 生命狀態 × 認知模型 × 最小行動</p></header><main><div class="toolbar no-print"><button class="btn active" id="both" onclick="setLang('both')">中英對照</button><button class="btn" id="zh" onclick="setLang('zh')">繁體中文</button><button class="btn" id="en" onclick="setLang('en')">English</button><button class="btn" onclick="window.print()">列印 / Print</button><button class="btn" onclick="exportText()">匯出文字 / Export</button></div><nav class="tabs no-print" id="tabs"></nav><section id="overview" class="panel active-panel"></section><section id="atlas" class="panel"></section><section id="matrix" class="panel"></section><section id="compare" class="panel"></section><section id="quotes" class="panel"></section><section id="practice" class="panel"></section><section id="quiz" class="panel"></section><section id="sources" class="panel"></section></main><footer>LifeOS · Educational interpretation, not a religious or clinical diagnosis · 單檔離線可使用</footer><script>
const DATA=[{"id": 1, "zh": "地獄", "en": "Hell", "state": ["痛苦封閉", "Pain and closure"], "force": ["絕望與負向預測", "Despair and negative predictions"], "need": ["脫離痛苦", "Relief from suffering"], "blind": ["新可能性", "New possibilities"], "mechanism": ["負向證據被過度加權", "Overweighting negative evidence"], "inner": ["我沒有希望了", "There is no hope"], "risk": ["可能性收縮", "Shrinking possibilities"], "action": ["改寫一句限制自己的舊結論", "Rewrite one limiting belief"], "example": ["「我永遠學不好英文」→「我今天先練一篇短文」", "“I can never learn English” → “I will try one short passage today.”"], "quotes": [["真正困住你的，不是曾經發生的痛苦，而是你把一次痛苦，當成整個人生永遠不會改變的命運。", "What traps you is not only past pain, but the belief that one painful event defines your entire future."], ["一次失敗不代表你是失敗者，一次背叛不代表所有人都不可信，一段關係結束也不代表你不值得被愛。", "One failure does not make you a failure; one betrayal does not make everyone untrustworthy."], ["最深的地獄，不是世界沒有出口，而是舊有的認知模型，已經不允許你相信出口存在。", "The deepest hell is not a world without exits, but a model that no longer allows you to see them."], ["真正的療癒，不是強迫自己忘記痛苦，而是讓新的經驗、新的證據、新的理解，逐漸修正過去的預測。", "Healing is not forced forgetting; it is allowing new evidence and experience to revise old predictions."], ["生命最深的自由，不是永遠不再受傷，而是即使跌入黑暗，仍然保有重新理解世界、重新生成自己的能力。", "Freedom means retaining the capacity to understand and rebuild, even after being hurt."]]}, {"id": 2, "zh": "餓鬼", "en": "Hungry Ghost", "state": ["永遠不足", "Endless lack"], "force": ["缺乏與欲望", "Scarcity and desire"], "need": ["填補缺乏", "Fill perceived lack"], "blind": ["足夠與滿足", "Sufficiency"], "mechanism": ["缺乏訊號被過度加權", "Overweighting signals of scarcity"], "inner": ["為什麼還是不夠", "Why is it never enough?"], "risk": ["目標無限擴張", "Unbounded goal escalation"], "action": ["為一項欲望設定足夠標準", "Set a clear enough-point for one desire"], "example": ["「我要更多錢」→「先定六個月緊急預備金」", "“I need more money” → “Set a six-month emergency-fund target.”"], "quotes": [["最深的貧窮，不一定是什麼都沒有，而是明明已經擁有很多，卻永遠只看得見自己還缺少什麼。", "The deepest poverty may be seeing only what is missing, even while possessing much."], ["你以為自己在追求金錢，其實可能在追求安全感；你以為自己在追求掌聲，其實可能在證明自己值得被愛。", "What looks like a pursuit of money may be a search for safety; applause may be a search for worth."], ["當人生的目標永遠往前移動，再多的成功也無法帶來滿足，因為真正失控的不是資源，而是沒有停止條件的欲望。", "If the finish line always moves, no achievement can create lasting enoughness."], ["成熟不是消滅欲望，而是重新建立選擇：知道自己要什麼、為什麼要，以及得到多少才真正足夠。", "Maturity means knowing what you seek, why you seek it, and when enough is enough."], ["真正的富足，不是擁有整個世界，而是即使世界還有許多尚未得到的東西，你仍然能夠感受到自己生命的完整。", "Abundance is not owning the world; it is appreciating life while still pursuing worthy goals."]]}, {"id": 3, "zh": "畜生", "en": "Animal", "state": ["自動反應", "Automatic reaction"], "force": ["本能與舊習慣", "Instinct and habit"], "need": ["即時安全", "Immediate safety"], "blind": ["長期後果", "Long-term outcomes"], "mechanism": ["刺激直接觸發舊反應", "Stimulus triggers learned response"], "inner": ["我忍不住", "I cannot help it"], "risk": ["舊迴路重複", "Repeated habitual loops"], "action": ["在情緒反應前暫停三秒", "Pause three seconds before reacting"], "example": ["孩子頂嘴→停三秒→詢問真正想表達什麼", "A child talks back → pause → ask what they mean"], "quotes": [["人生最可怕的慣性，不是偶爾做錯決定，而是每天重複相同反應，卻以為自己始終擁有自由選擇。", "The most dangerous habit is repeating the same response while believing you freely chose it."], ["被批評就反擊、感到焦慮就逃避、遇到壓力就拖延，這些看似不同的問題，背後可能都是舊模型自動接管行動。", "Retaliation, avoidance and procrastination may all be old patterns taking over."], ["本能不是敵人，情緒也不是錯誤；真正需要更新的，是讓刺激直接變成反應、中間沒有判斷的生命迴路。", "Instinct is not the enemy; the problem is skipping the space for judgment."], ["高階智慧不是反應最快，而是能在衝動出現時暫停三秒，重新觀察、重新評估、重新選擇。", "Wisdom can mean pausing three seconds before choosing how to act."], ["改變命運的起點，往往不是一場驚天動地的革命，而是某一天，你終於沒有再用過去的方式傷害現在的自己。", "A life can change the day you stop using yesterday’s pattern to harm today’s self."]]}, {"id": 4, "zh": "修羅", "en": "Asura", "state": ["比較競爭", "Competitive comparison"], "force": ["身份與輸贏", "Identity and winning"], "need": ["身份肯定", "Validation of identity"], "blind": ["合作價值", "Value of cooperation"], "mechanism": ["把分歧解讀成身份威脅", "Disagreement threatens identity"], "inner": ["我不能輸", "I must not lose"], "risk": ["競爭消耗資源", "Resource-draining rivalry"], "action": ["把一次比較轉化成學習", "Turn comparison into learning"], "example": ["同事表現出色→請教一項教學策略", "A colleague excels → ask for one teaching strategy"], "quotes": [["當你把勝過別人當成生命價值，別人的每一次成功，都可能變成你內心的一次失敗。", "When worth depends on outperforming others, their success feels like your defeat."], ["比較讓人不斷追逐排名，智慧讓人重新辨識目標；前者只想證明自己更強，後者真正關心能否創造更多價值。", "Comparison seeks rank; wisdom asks what value you can create."], ["真正消耗生命的，不一定是努力本身，而是把大量時間、情緒與能力，投入一場永遠不能輸的身份競賽。", "The exhausting part may not be effort, but a contest you believe you must never lose."], ["高階利他不是犧牲自己，而是從「我要贏過誰」轉向「我能解決什麼問題」，讓合作創造更多共同價值。", "Generosity can mean shifting from “Who must I beat?” to “What problem can we solve?”"], ["星星不必熄滅其他星星才能證明自己明亮，真正成熟的生命，也不必依靠別人的失敗來確認自己的存在。", "Stars need not extinguish other stars to shine."]]}, {"id": 5, "zh": "人", "en": "Human", "state": ["自我覺察", "Self-awareness"], "force": ["反思與修正", "Reflection and revision"], "need": ["理解自己", "Self-understanding"], "blind": ["尚未發現的盲點", "Unseen blind spots"], "mechanism": ["區分事實與解釋", "Separating facts from interpretations"], "inner": ["我可能看錯了", "I may be mistaken"], "risk": ["覺察未化為行動", "Reflection without action"], "action": ["將事實與解釋分開", "Separate facts from interpretations"], "example": ["朋友沒回訊息→先不認定自己被討厭", "No reply from a friend → avoid assuming rejection"], "quotes": [["一個人最深的限制，不是沒有答案，而是從未懷疑自己深信的答案，可能只是世界眾多解釋中的一種。", "A deep limitation is assuming your favorite explanation is the only possible truth."], ["你看見的世界，不只是外在發生的事件，也包含過去記憶、情緒權重與認知模型共同形成的理解。", "What you see includes both events and interpretations shaped by memory and emotion."], ["當你說「我就是這樣」，你正在固定自己的身份；當你說「我現在是這樣」，你已經替生命重新打開更新的空間。", "“I am always like this” freezes identity; “I am like this now” opens a door to change."], ["真正的成長，不是永遠堅持自己正確，而是當現實出現不同證據時，願意重新調整判斷、權重與行動。", "Growth means adjusting judgments when reality supplies new evidence."], ["覺醒不是突然知道所有真相，而是終於看見自己正在使用什麼模型，並發現自己永遠還有重新選擇的可能。", "Awareness begins when you can notice your own model and choose again."]]}, {"id": 6, "zh": "天", "en": "Heaven", "state": ["幸福順境", "Well-being and comfort"], "force": ["高資源與高回報", "Resources and reward"], "need": ["幸福舒適", "Comfort and happiness"], "blind": ["環境變動", "Changing conditions"], "mechanism": ["維持高回報的舒適狀態", "Preserving a rewarding state"], "inner": ["現在這樣很好", "Things are good as they are"], "risk": ["舒適依賴", "Dependence on comfort"], "action": ["嘗試一件安全且不熟悉的新事", "Try one safe unfamiliar activity"], "example": ["熟悉舊教法→嘗試一次安全的AI輔助活動", "Try one safe AI-supported learning activity"], "quotes": [["幸福是一種值得珍惜的生命經驗，但如果幸福只能建立在環境永遠順利之上，那麼它仍然可能受到條件控制。", "Happiness is precious, but happiness dependent on unchanging conditions remains fragile."], ["有錢不一定有智慧，成功不一定有自由，生活舒適也不代表一個人已經具備面對變化的能力。", "Wealth, success and comfort do not automatically create adaptability."], ["真正成熟的生命，不是要求世界永遠符合期待，而是在世界改變時，仍然能夠重新學習、重新調整、重新生成。", "Maturity is learning to adjust when the world does not meet your expectations."], ["舒適能夠恢復能量，但過度依賴舒適也可能限制成長；智慧不是拒絕幸福，而是不讓幸福成為唯一的生命目標。", "Comfort can restore us, yet dependence on comfort may limit growth."], ["真正有生命力的樹，不是從未經歷風雨，而是即使季節改變、環境動盪，仍然保有重新生長的能力。", "A resilient tree has not avoided storms; it has learned to keep growing."]]}, {"id": 7, "zh": "聲聞", "en": "Śrāvaka", "state": ["知識輸入", "Knowledge intake"], "force": ["學習與接收", "Learning and reception"], "need": ["獲得知識", "Gain knowledge"], "blind": ["適用條件", "Scope of applicability"], "mechanism": ["接收新的資訊與概念", "Taking in concepts and information"], "inner": ["我要學習", "I want to learn"], "risk": ["資訊過載", "Information overload"], "action": ["學一個概念並用自己的話解釋", "Learn and explain one new concept"], "example": ["學 affect→造句→比較 effect", "Learn “affect,” use it, and compare with “effect”"], "quotes": [["真正的無知，不只是知道得太少，而是以為自己已經知道得足夠，因此拒絕讓新的資訊改變原本的理解。", "Ignorance also includes the belief that you no longer need to learn."], ["讀過一百本書，不代表擁有一百種能力；收藏一千篇文章，也不代表真正更新過自己的世界模型。", "Reading a hundred books does not automatically create a hundred abilities."], ["學習的價值，不在於記住多少漂亮的答案，而在於能否辨識錯誤、理解差異，並減少下一次重複犯錯的機會。", "Knowledge matters when it helps you recognize errors and make better decisions."], ["真正會學習的人，不只問「答案是什麼」，還會問「為什麼成立、何時適用、有哪些反例、需要如何修正」。", "Ask not only “What is the answer?” but “When does it apply, and what could disprove it?”"], ["知識不是用來裝滿生命的倉庫，而是替心靈打開更多窗戶，讓新的證據、新的理解與新的可能持續進入。", "Knowledge should open windows, not merely fill a warehouse."]]}, {"id": 8, "zh": "緣覺", "en": "Pratyekabuddha", "state": ["結構理解", "Structural insight"], "force": ["關係與規律", "Relations and patterns"], "need": ["理解規律", "Understand patterns"], "blind": ["實際驗證", "Real-world validation"], "mechanism": ["建立變數關係與回饋迴路", "Mapping variables and feedback loops"], "inner": ["背後有什麼結構", "What structure lies beneath?"], "risk": ["分析過度", "Overanalysis"], "action": ["找出問題背後的三個變數", "Identify three variables behind a problem"], "example": ["拖延→檢查睡眠、手機、任務大小", "For procrastination, inspect sleep, phone and task size"], "quotes": [["低階思考只問誰做錯了，高階思考開始追問：哪些變數、關係與回饋迴路，正在共同維持眼前的結果？", "Surface thinking asks who is wrong; systems thinking asks which variables sustain the outcome."], ["學生拖延不一定只是懶惰，關係衝突不一定只是脾氣不好，人生失衡也不一定能用單一原因解釋。", "Procrastination, conflict and imbalance rarely yield to one simplistic explanation."], ["真正困住人的，可能不是某一件事情，而是情緒、環境、習慣、預測與行動彼此強化，形成難以跳脫的循環。", "Emotion, environment, habit and action can reinforce one another in a loop."], ["智慧不是對每個問題都更用力，而是先看懂系統，再找出最值得改變的關鍵變數，用最小行動產生有效回饋。", "Wisdom is finding a leverage point rather than simply trying harder everywhere."], ["當你開始看見事情背後的結構，就不再只是被事件推著走，而是逐漸擁有重新設計人生運作方式的能力。", "When you see the structure, you gain more ways to redesign what happens next."]]}, {"id": 9, "zh": "菩薩", "en": "Bodhisattva", "state": ["能力實踐", "Applied capability"], "force": ["利他與行動", "Care and action"], "need": ["解決問題", "Solve problems"], "blind": ["對方自主性", "Others’ autonomy"], "mechanism": ["以行動測試理解", "Testing understanding through action"], "inner": ["我能如何幫忙", "How can I help?"], " function renderOverview(){const branches=[['限制性迴路','Constraining loops',[0,1,2,3]],['覺察與資源','Awareness and resources',[4,5]],['知識到能力','From knowledge to capability',[6,7,8]],['智慧整合','Wisdom integration',[9]]];$('overview').innerHTML=`<div class="card"><h2>${label('十界不是固定身份，而是可變動的生命狀態','Realms are dynamic states, not fixed identities')}</h2><p>${label('十界互具提醒我們：任何一個人都可能在不同情境中展現多種狀態。這個APP以現代系統隱喻呈現，並非佛教原義的直接等同。','Mutual inclusion reminds us that many states can coexist. This app offers a modern systems analogy, not a literal equation with Buddhist doctrine.')}</p><div class="notice">${label('重要：十界不是人格標籤、心理診斷或由低到高的固定排行榜。','Important: realms are not personality labels, diagnoses, or a fixed ladder of human worth.')}</div></div><h2>${label('心智圖：十界四大系統','Mind map: Four systems')}</h2><div class="mind">${branches.map(([zh,en,ids])=>`<div class="branch"><h3>${label(zh,en)}</h3>${ids.map(i=>`<button class="btn" style="margin:3px" onclick="current=${i};go('atlas')">${title(DATA[i])}</button>`).join('')}</div>`).join('')}</div><div class="card"><h2>${label('四層生命框架','Four-layer life framework')}</h2>${[['本體：我目前處於什麼生命狀態？','Ontology: What state am I in?'],['結構：哪些需求、變數與關係在作用？','Structure: Which needs, variables and relations matter?'],['機制：我如何解釋、預測與反應？','Mechanism: How do I interpret, predict and react?'],['行動：下一個最小更新是什麼？','Action: What is the smallest useful update?']].map((a,i)=>`<div class="step"><strong>${i+1}.</strong> ${label(...a)}</div>`).join('')}</div><div class="card"><h2>${label('生命更新閉環','Model-update loop')}</h2><p>${label('輸入 → 表徵 → 權重 → 預測 → 行動 → 回饋 → 預測誤差 → 模型更新 → 再測','Input → Representation → Weighting → Prediction → Action → Feedback → Prediction error → Model update → Retest')}</p></div>`}
function renderAtlas(){let r=DATA[current];$('atlas').innerHTML=`<div class="field no-print"><label>${label('選擇十界','Choose a realm')} <select onchange="current=+this.value;renderAtlas()">${opts(current)}</select></label></div><div class="card"><h2>${r.id.toString().padStart(2,'0')}｜${title(r)}</h2><div class="pill">${tx(...r.state)}</div><p class="muted">${label('十界互具：本界是狀態，不是固定身份。','Mutual inclusion: a state, not a fixed identity.')}</p></div><div class="grid">${[['核心狀態','Core state','state'],['主導力量','Dominant force','force'],['核心需求','Core need','need'],['認知盲點','Blind spot','blind'],['資訊處理機制','Information mechanism','mechanism'],['內在語言','Inner voice','inner'],['系統風險','System risk','risk'],['最小行動','Minimum action','action']].map(([a,b,k])=>field(a,b,r[k])).join('')}</div>${field('生活示範','Life example',r.example)}<div class="card"><h3>${label('五句哲學金句','Five philosophical quotes')}</h3>${r.quotes.map((q,i)=>`<div class="quote"><b>${String(i+1).padStart(2,'0')}</b> ${bi(q)}</div>`).join('')}</div><div class="field no-print"><button class="btn" onclick="current=(current+9)%10;renderAtlas()">← ${label('上一界','Previous')}</button><button class="btn" onclick="current=(current+1)%10;renderAtlas()">${label('下一界','Next')} →</button></div>`}
const cols=[['state','生命狀態','State'],['force','主導力量','Dominant force'],['need','核心需求','Core need'],['blind','認知盲點','Blind spot'],['mechanism','資訊機制','Mechanism'],['inner','內在語言','Inner voice'],['risk','系統風險','System risk'],['action','最小行動','Minimum action']];let shownCols=['state','force','need','blind','mechanism','inner','risk','action'];

function renderQuiz(){let q=scenarios[quizIndex];$('quiz').innerHTML=`<div class="card"><h2>${label('十界情境辨識｜教學練習','Scenario quiz · Educational practice')}</h2><p class="muted">${quizIndex+1}/10 · ${label('答對','Correct')} ${score} · ${label('不作人格診斷','Not a personality diagnosis')}</p>${bi(q.q)}<div class="grid" style="margin-top:16px">${DATA.map((r,i)=>`<button class="realm-tile" ${answered?'disabled':''} onclick="answer(${i})"><strong>${r.zh}</strong><span>${r.en}</span></button>`).join('')}</div><div id="feedback" class="card ${answered?'':'hidden'}"></div><div class="field no-print"><button class="btn" onclick="quizIndex=(quizIndex+1)%10;answered=false;renderQuiz()">${label('下一題','Next')} →</button><button class="btn" onclick="quizIndex=0;score=0;answered=false;renderQuiz()">${label('重新開始','Restart')}</button></div></div>`}
function answer(i){if(answered)return;answered=true;let ok=i===scenarios[quizIndex].a;if(ok)score++;let correct=DATA[scenarios[quizIndex].a];$('feedback').classList.remove('hidden');$('feedback').innerHTML=`<b class="${ok?'correct':'wrong'}">${ok?label('答對了','Correct'):label('再想想','Try another perspective')}</b><p>${label('參考辨識','Suggested interpretation')}：${title(correct)}</p>${bi(correct.mechanism)}<p class="muted">${label('這是教學案例的主要線索，不代表真實人物只有一種狀態。','This is the primary cue in a teaching example, not a fixed label for real people.')}</p>`;renderQuizButtons()}
function renderQuizButtons(){document.querySelectorAll('#quiz .realm-tile').forEach(x=>x.disabled=true);let p=$('quiz').querySelector('.muted');if(p)p.textContent=`${quizIndex+1}/10 · ${label('答對','Correct')} ${score}`}
function renderSources(){ $('sources').innerHTML=`<div class="card"><h2>${label('資料來源與解釋邊界','Sources and interpretive boundaries')}</h2><p>${label('主要來源：本對話先前整理的《生命大數據：法華經與十法界》十界摘要，以及使用者確認的LifeOS十界對照、50句金句與十項最小行動。','Primary basis: the earlier conversation’s summary of “Life Big Data: Lotus Sutra and the Ten Realms,” plus the agreed LifeOS comparisons, 50 quotes and ten minimum actions.')}</p><p>${label('資料編號：BUD-OS-0049；本APP是可攜式教育成品，並未直接寫入外部會員平台或資料庫。','Data ID: BUD-OS-0049. This is a portable educational artifact; it has not been written into an external membership platform or database.')}</p><div class="notice">${label('佛教原義與現代類比必須區分。傳統佛教十界涉及六凡四聖、業、修行與解脫；聲聞不只是知識輸入，緣覺不只是結構分析，菩薩不只是助人技巧，佛界也不只是認知更新。','Keep Buddhist doctrine distinct from this modern analogy. Traditional ten realms concern karma, practice and liberation; Śrāvaka is not merely information intake, Pratyekabuddha not merely systems analysis, Bodhisattva not merely helping skills, and Buddha not merely cognitive updating.')}</div><h3>${label('傳統與LifeOS的區別','Traditional vs LifeOS')}</h3><div class="table-wrap"><table><thead><tr><th>${label('概念','Concept')}</th><th>${label('佛教原義','Traditional Buddhism')}</th><th>LifeOS</th></tr></thead><tbody>${[['聲聞','依四聖諦等教法修行','Knowledge intake'],['緣覺','觀察緣起、因緣','Structural understanding'],['菩薩','菩提心、慈悲、六度','Action and helpful capability'],['佛','覺悟、解脫、究竟智慧','Integrated model revision'],['十界互具','每一界皆具十界，為天台一念三千之重要觀念','Dynamic coexistence of states']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}</tbody></table></div><p>${label('「熵增／逆熵」、「預測模型」與「動態狀態空間」均屬現代詮釋的教學隱喻，並非物理測量或臨床判定。','Entropy, prediction models and dynamic state spaces are teaching metaphors here—not physical measurements or clinical classifications.')}</p></div>`}
function getText(){let out=['十法界 LifeOS / Ten Realms','BUD-OS-0049'];DATA.forEach(r=>{out.push(`\n${r.id}. ${r.zh} / ${r.en}`);cols.forEach(([k,zh,en])=>out.push(`${zh} / ${en}: ${r[k][0]} / ${r[k][1]}`));r.quotes.forEach((q,i)=>out.push(`${i+1}. ${q[0]}\n${q[1]}`));if(notes[r.id-1])out.push('Notes: '+JSON.stringify(notes[r.id-1]))});return out.join('\n')}
function downloadText(s,filename){let blob=new Blob([s],{type:'text/plain;charset=utf-8'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function exportText(){if(tab==='practice')saveNote();downloadText(getText(),'ten_realms_lifeos_bilingual.txt')}
function copyQuotes(){let s=DATA.map(r=>`【${r.zh} / ${r.en}】\n`+r.quotes.map((q,i)=>`${i+1}｜${q[0]}\n${q[1]}`).join('\n')+`\n最小行動｜${r.action[0]} / ${r.action[1]}`).join('\n\n');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(s).then(()=>alert(label('已複製50句金句','50 quotes copied'))).catch(()=>downloadText(s,'50_quotes.txt'));else downloadText(s,'50_quotes.txt')}
render();</script></body></html>
