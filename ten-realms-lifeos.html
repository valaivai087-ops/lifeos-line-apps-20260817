<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12273b"><title>十法界 LifeOS｜Bilingual Learning App</title><style>
:root{--bg:#f4f6f8;--paper:#fff;--ink:#1c2d3a;--muted:#5c6d7c;--line:#dbe3e9;--navy:#12273b;--teal:#0c796e;--accent:#c28a3e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Noto Sans TC','Microsoft JhengHei',sans-serif;line-height:1.65}button,select,input,textarea{font:inherit}button{cursor:pointer}header{background:linear-gradient(130deg,#12273b,#21495b);color:white;padding:28px max(20px,calc((100vw - 1200px)/2));}header h1{margin:0;font-size:clamp(26px,4vw,42px)}header p{margin:7px 0 0;color:#d9e5ec}.eyebrow{letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:#a6d4d0}main{max-width:1200px;margin:auto;padding:20px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.btn,.tab{background:white;border:1px solid var(--line);border-radius:12px;padding:9px 15px;color:var(--ink)}.btn:hover,.tab:hover{border-color:var(--teal)}.active{background:var(--navy)!important;color:white!important;border-color:var(--navy)!important}.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px}.panel{display:none}.panel.active-panel{display:block}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 3px 18px #18304408}.card h2,.card h3{margin:0 0 12px}.muted{color:var(--muted)}.small{font-size:13px}.dual{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dual>div{background:#f5f8fa;padding:10px 13px;border-radius:10px}.en{color:#486172}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.realm-tile{padding:17px;border-radius:15px;background:white;border:1px solid var(--line);text-align:left}.realm-tile strong{font-size:19px}.realm-tile span{display:block;color:var(--muted);font-size:13px}.realm-tile:hover{border-color:var(--teal);transform:translateY(-1px)}.pill{display:inline-block;border-radius:100px;background:#e7f3f0;color:#086c62;font-size:12px;padding:3px 10px;margin:3px}.field{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}.field select,.field input,.field textarea{border:1px solid #bac8d1;background:white;border-radius:10px;padding:9px;max-width:100%}.field textarea{width:100%;min-height:85px}.quote{border-left:4px solid var(--accent);padding:10px 15px;margin:12px 0;background:#fbfaf6;border-radius:0 10px 10px 0}.quote .en{margin-top:4px}.table-wrap{overflow:auto;border-radius:14px;border:1px solid var(--line);background:white}table{width:100%;border-collapse:collapse;min-width:840px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:11px;vertical-align:top}th{background:#e9f0f4;position:sticky;top:0}td:first-child{font-weight:700;white-space:nowrap}tr:hover td{background:#f7fafb}.mind{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mind .branch{border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:12px;padding:16px;background:#fff}.mind .branch h3{margin:0 0 8px}.step{padding:13px 16px;background:#f0f5f6;border-radius:12px;margin:8px 0}.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}.compare .card{margin:0}.notice{background:#fff8e9;border:1px solid #ead9b6;border-radius:12px;padding:13px 16px}.correct{color:#087466;font-weight:700}.wrong{color:#a34730;font-weight:700}footer{color:var(--muted);text-align:center;padding:30px 20px}.hidden{display:none!important}@media(max-width:700px){.dual,.mind,.compare{grid-template-columns:1fr}main{padding:12px}.card{padding:15px}header{padding:25px 18px}}
@media print{header{color:black;background:white}.toolbar,.tabs,.no-print{display:none!important}.panel{display:block!important}.card{break-inside:avoid}main{max-width:none}}
</style></head><body><header><div class="eyebrow">LifeOS · Buddhist Philosophy × Systems Thinking</div><h1>十法界生命智慧 APP</h1><p>Ten Realms · Bilingual Knowledge Atlas · 繁體中文 / English</p><p class="small">BUD-OS-0049 · 十界互具 · 生命狀態 × 認知模型 × 最小行動</p></header><main><div class="toolbar no-print"><button class="btn active" id="both" onclick="setLang('both')">中英對照</button><button class="btn" id="zh" onclick="setLang('zh')">繁體中文</button><button class="btn" id="en" onclick="setLang('en')">English</button><button class="btn" onclick="window.print()">列印 / Print</button><button class="btn" onclick="exportText()">匯出文字 / Export</button></div><nav class="tabs no-print" id="tabs"></nav><section id="overview" class="panel active-panel"></section><section id="atlas" class="panel"></section><section id="matrix" class="panel"></section><section id="compare" class="panel"></section><section id="quotes" class="panel"></section><section id="practice" class="panel"></section><section id="quiz" class="panel"></section><section id="sources" class="panel"></section></main><footer>LifeOS · Educational interpretation, not a religious or clinical diagnosis · 單檔離線可使用</footer><script>
const DATA=[{"id": 1, "zh": "地獄", "en": "Hell", "state": ["痛苦封閉", "Pain and closure"], "force": ["絕望與負向預測", "Despair and negative predictions"], "need": ["脫離痛苦", "Relief from suffering"], "blind": ["新可能性", "New possibilities"], "mechanism": ["負向證據被過度加權", "Overweighting negative evidence"], "inner": ["我沒有希望了", "There is no hope"], "risk": ["可能性收縮", "Shrinking possibilities"], "action": ["改寫一句限制自己的舊結論", "Rewrite one limiting belief"], "example": ["「我永遠學不好英文」→「我今天先練一篇短文」", "“I can never learn English” → “I will try one short passage today.”"], "quotes": [["真正困住你的，不是曾經發生的痛苦，而是你把一次痛苦，當成整個人生永遠不會改變的命運。", "What traps you is not only past pain, but the belief that one painful event defines your entire future."], ["一次失敗不代表你是失敗者，一次背叛不代表所有人都不可信，一段關係結束也不代表你不值得被愛。", "One failure does not make you a failure; one betrayal does not make everyone untrustworthy."], ["最深的地獄，不是世界沒有出口，而是舊有的認知模型，已經不允許你相信出口存在。", "The deepest hell is not a world without exits, but a model that no longer allows you to see them."], ["真正的療癒，不是強迫自己忘記痛苦，而是讓新的經驗、新的證據、新的理解，逐漸修正過去的預測。", "Healing is not forced forgetting; it is allowing new evidence and experience to revise old predictions."], ["生命最深的自由，不是永遠不再受傷，而是即使跌入黑暗，仍然保有重新理解世界、重新生成自己的能力。", "Freedom means retaining the capacity to understand and rebuild, even after being hurt."]]}, {"id": 2, "zh": "餓鬼", "en": "Hungry Ghost", "state": ["永遠不足", "Endless lack"], "force": ["缺乏與欲望", "Scarcity and desire"], "need": ["填補缺乏", "Fill perceived lack"], "blind": ["足夠與滿足", "Sufficiency"], "mechanism": ["缺乏訊號被過度加權", "Overweighting signals of scarcity"], "inner": ["為什麼還是不夠", "Why is it never enough?"], "risk": ["目標無限擴張", "Unbounded goal escalation"], "action": ["為一項欲望設定足夠標準", "Set a clear enough-point for one desire"], "example": ["「我要更多錢」→「先定六個月緊急預備金」", "“I need more money” → “Set a six-month emergency-fund target.”"], "quotes": [["最深的貧窮，不一定是什麼都沒有，而是明明已經擁有很多，卻永遠只看得見自己還缺少什麼。", "The deepest poverty may be seeing only what is missing, even while possessing much."], ["你以為自己在追求金錢，其實可能在追求安全感；你以為自己在追求掌聲，其實可能在證明自己值得被愛。", "What looks like a pursuit of money may be a search for safety; applause may be a search for worth."], ["當人生的目標永遠往前移動，再多的成功也無法帶來滿足，因為真正失控的不是資源，而是沒有停止條件的欲望。", "If the finish line always moves, no achievement can create lasting enoughness."], ["成熟不是消滅欲望，而是重新建立選擇：知道自己要什麼、為什麼要，以及得到多少才真正足夠。", "Maturity means knowing what you seek, why you seek it, and when enough is enough."], ["真正的富足，不是擁有整個世界，而是即使世界還有許多尚未得到的東西，你仍然能夠感受到自己生命的完整。", "Abundance is not owning the world; it is appreciating life while still pursuing worthy goals."]]}, {"id": 3, "zh": "畜生", "en": "Animal", "state": ["自動反應", "Automatic reaction"], "force": ["本能與舊習慣", "Instinct and habit"], "need": ["即時安全", "Immediate safety"], "blind": ["長期後果", "Long-term outcomes"], "mechanism": ["刺激直接觸發舊反應", "Stimulus triggers learned response"], "inner": ["我忍不住", "I cannot help it"], "risk": ["舊迴路重複", "Repeated habitual loops"], "action": ["在情緒反應前暫停三秒", "Pause three seconds before reacting"], "example": ["孩子頂嘴→停三秒→詢問真正想表達什麼", "A child talks back → pause → ask what they mean"], "quotes": [["人生最可怕的慣性，不是偶爾做錯決定，而是每天重複相同反應，卻以為自己始終擁有自由選擇。", "The most dangerous habit is repeating the same response while believing you freely chose it."], ["被批評就反擊、感到焦慮就逃避、遇到壓力就拖延，這些看似不同的問題，背後可能都是舊模型自動接管行動。", "Retaliation, avoidance and procrastination may all be old patterns taking over."], ["本能不是敵人，情緒也不是錯誤；真正需要更新的，是讓刺激直接變成反應、中間沒有判斷的生命迴路。", "Instinct is not the enemy; the problem is skipping the space for judgment."], ["高階智慧不是反應最快，而是能在衝動出現時暫停三秒，重新觀察、重新評估、重新選擇。", "Wisdom can mean pausing three seconds before choosing how to act."], ["改變命運的起點，往往不是一場驚天動地的革命，而是某一天，你終於沒有再用過去的方式傷害現在的自己。", "A life can change the day you stop using yesterday’s pattern to harm today’s self."]]}, {"id": 4, "zh": "修羅", "en": "Asura", "state": ["比較競爭", "Competitive comparison"], "force": ["身份與輸贏", "Identity and winning"], "need": ["身份肯定", "Validation of identity"], "blind": ["合作價值", "Value of cooperation"], "mechanism": ["把分歧解讀成身份威脅", "Disagreement threatens identity"], "inner": ["我不能輸", "I must not lose"], "risk": ["競爭消耗資源", "Resource-draining rivalry"], "action": ["把一次比較轉化成學習", "Turn comparison into learning"], "example": ["同事表現出色→請教一項教學策略", "A colleague excels → ask for one teaching strategy"], "quotes": [["當你把勝過別人當成生命價值，別人的每一次成功，都可能變成你內心的一次失敗。", "When worth depends on outperforming others, their success feels like your defeat."], ["比較讓人不斷追逐排名，智慧讓人重新辨識目標；前者只想證明自己更強，後者真正關心能否創造更多價值。", "Comparison seeks rank; wisdom asks what value you can create."], ["真正消耗生命的，不一定是努力本身，而是把大量時間、情緒與能力，投入一場永遠不能輸的身份競賽。", "The exhausting part may not be effort, but a contest you believe you must never lose."], ["高階利他不是犧牲自己，而是從「我要贏過誰」轉向「我能解決什麼問題」，讓合作創造更多共同價值。", "Generosity can mean shifting from “Who must I beat?” to “What problem can we solve?”"], ["星星不必熄滅其他星星才能證明自己明亮，真正成熟的生命，也不必依靠別人的失敗來確認自己的存在。", "Stars need not extinguish other stars to shine."]]}, {"id": 5, "zh": "人", "en": "Human", "state": ["自我覺察", "Self-awareness"], "force": ["反思與修正", "Reflection and revision"], "need": ["理解自己", "Self-understanding"], "blind": ["尚未發現的盲點", "Unseen blind spots"], "mechanism": ["區分事實與解釋", "Separating facts from interpretations"], "inner": ["我可能看錯了", "I may be mistaken"], "risk": ["覺察未化為行動", "Reflection without action"], "action": ["將事實與解釋分開", "Separate facts from interpretations"], "example": ["朋友沒回訊息→先不認定自己被討厭", "No reply from a friend → avoid assuming rejection"], "quotes": [["一個人最深的限制，不是沒有答案，而是從未懷疑自己深信的答案，可能只是世界眾多解釋中的一種。", "A deep limitation is assuming your favorite explanation is the only possible truth."], ["你看見的世界，不只是外在發生的事件，也包含過去記憶、情緒權重與認知模型共同形成的理解。", "What you see includes both events and interpretations shaped by memory and emotion."], ["當你說「我就是這樣」，你正在固定自己的身份；當你說「我現在是這樣」，你已經替生命重新打開更新的空間。", "“I am always like this” freezes identity; “I am like this now” opens a door to change."], ["真正的成長，不是永遠堅持自己正確，而是當現實出現不同證據時，願意重新調整判斷、權重與行動。", "Growth means adjusting judgments when reality supplies new evidence."], ["覺醒不是突然知道所有真相，而是終於看見自己正在使用什麼模型，並發現自己永遠還有重新選擇的可能。", "Awareness begins when you can notice your own model and choose again."]]}, {"id": 6, "zh": "天", "en": "Heaven", "state": ["幸福順境", "Well-being and comfort"], "force": ["高資源與高回報", "Resources and reward"], "need": ["幸福舒適", "Comfort and happiness"], "blind": ["環境變動", "Changing conditions"], "mechanism": ["維持高回報的舒適狀態", "Preserving a rewarding state"], "inner": ["現在這樣很好", "Things are good as they are"], "risk": ["舒適依賴", "Dependence on comfort"], "action": ["嘗試一件安全且不熟悉的新事", "Try one safe unfamiliar activity"], "example": ["熟悉舊教法→嘗試一次安全的AI輔助活動", "Try one safe AI-supported learning activity"], "quotes": [["幸福是一種值得珍惜的生命經驗，但如果幸福只能建立在環境永遠順利之上，那麼它仍然可能受到條件控制。", "Happiness is precious, but happiness dependent on unchanging conditions remains fragile."], ["有錢不一定有智慧，成功不一定有自由，生活舒適也不代表一個人已經具備面對變化的能力。", "Wealth, success and comfort do not automatically create adaptability."], ["真正成熟的生命，不是要求世界永遠符合期待，而是在世界改變時，仍然能夠重新學習、重新調整、重新生成。", "Maturity is learning to adjust when the world does not meet your expectations."], ["舒適能夠恢復能量，但過度依賴舒適也可能限制成長；智慧不是拒絕幸福，而是不讓幸福成為唯一的生命目標。", "Comfort can restore us, yet dependence on comfort may limit growth."], ["真正有生命力的樹，不是從未經歷風雨，而是即使季節改變、環境動盪，仍然保有重新生長的能力。", "A resilient tree has not avoided storms; it has learned to keep growing."]]}, {"id": 7, "zh": "聲聞", "en": "Śrāvaka", "state": ["知識輸入", "Knowledge intake"], "force": ["學習與接收", "Learning and reception"], "need": ["獲得知識", "Gain knowledge"], "blind": ["適用條件", "Scope of applicability"], "mechanism": ["接收新的資訊與概念", "Taking in concepts and information"], "inner": ["我要學習", "I want to learn"], "risk": ["資訊過載", "Information overload"], "action": ["學一個概念並用自己的話解釋", "Learn and explain one new concept"], "example": ["學 affect→造句→比較 effect", "Learn “affect,” use it, and compare with “effect”"], "quotes": [["真正的無知，不只是知道得太少，而是以為自己已經知道得足夠，因此拒絕讓新的資訊改變原本的理解。", "Ignorance also includes the belief that you no longer need to learn."], ["讀過一百本書，不代表擁有一百種能力；收藏一千篇文章，也不代表真正更新過自己的世界模型。", "Reading a hundred books does not automatically create a hundred abilities."], ["學習的價值，不在於記住多少漂亮的答案，而在於能否辨識錯誤、理解差異，並減少下一次重複犯錯的機會。", "Knowledge matters when it helps you recognize errors and make better decisions."], ["真正會學習的人，不只問「答案是什麼」，還會問「為什麼成立、何時適用、有哪些反例、需要如何修正」。", "Ask not only “What is the answer?” but “When does it apply, and what could disprove it?”"], ["知識不是用來裝滿生命的倉庫，而是替心靈打開更多窗戶，讓新的證據、新的理解與新的可能持續進入。", "Knowledge should open windows, not merely fill a warehouse."]]}, {"id": 8, "zh": "緣覺", "en": "Pratyekabuddha", "state": ["結構理解", "Structural insight"], "force": ["關係與規律", "Relations and patterns"], "need": ["理解規律", "Understand patterns"], "blind": ["實際驗證", "Real-world validation"], "mechanism": ["建立變數關係與回饋迴路", "Mapping variables and feedback loops"], "inner": ["背後有什麼結構", "What structure lies beneath?"], "risk": ["分析過度", "Overanalysis"], "action": ["找出問題背後的三個變數", "Identify three variables behind a problem"], "example": ["拖延→檢查睡眠、手機、任務大小", "For procrastination, inspect sleep, phone and task size"], "quotes": [["低階思考只問誰做錯了，高階思考開始追問：哪些變數、關係與回饋迴路，正在共同維持眼前的結果？", "Surface thinking asks who is wrong; systems thinking asks which variables sustain the outcome."], ["學生拖延不一定只是懶惰，關係衝突不一定只是脾氣不好，人生失衡也不一定能用單一原因解釋。", "Procrastination, conflict and imbalance rarely yield to one simplistic explanation."], ["真正困住人的，可能不是某一件事情，而是情緒、環境、習慣、預測與行動彼此強化，形成難以跳脫的循環。", "Emotion, environment, habit and action can reinforce one another in a loop."], ["智慧不是對每個問題都更用力，而是先看懂系統，再找出最值得改變的關鍵變數，用最小行動產生有效回饋。", "Wisdom is finding a leverage point rather than simply trying harder everywhere."], ["當你開始看見事情背後的結構，就不再只是被事件推著走，而是逐漸擁有重新設計人生運作方式的能力。", "When you see the structure, you gain more ways to redesign what happens next."]]}, {"id": 9, "zh": "菩薩", "en": "Bodhisattva", "state": ["能力實踐", "Applied capability"], "force": ["利他與行動", "Care and action"], "need": ["解決問題", "Solve problems"], "blind": ["對方自主性", "Others’ autonomy"], "mechanism": ["以行動測試理解", "Testing understanding through action"], "inner": ["我能如何幫忙", "How can I help?"], "risk": ["過度承擔", "Over-responsibility"], "action": ["提供符合對方需求的具體協助", "Offer one specific, consent-based help"], "example": ["學生學習困難→先找一種錯誤類型並練三題", "Find one error pattern and practice three questions"], "quotes": [["善意如果沒有理解，可能變成干涉；知識如果沒有實踐，可能停留在口號；真正的利他，需要尊重與能力共同支撐。", "Kindness without understanding can become interference; knowledge without practice stays abstract."], ["好的老師不是讓學生永遠依賴自己，好的父母不是替孩子決定人生，好的服務者也不是讓客戶失去自主判斷。", "Good teachers and helpers build others’ autonomy rather than dependence."], ["真正高階的幫助，不是證明自己多麼有能力，而是讓對方因為你的參與，增加理解問題、做出選擇與採取行動的能力。", "Useful help expands another person’s capacity to understand, choose and act."], ["知識經過理解才能建立模型，模型經過行動才能接受檢驗，行動經過回饋與修正，才有機會逐漸形成真正的能力。", "Knowledge becomes a model, action tests the model, and feedback builds capability."], ["真正的慈悲，不只存在於溫柔的語言，而是願意走進真實世界，把理解化為行動，把善意化為對方能夠感受到的幫助。", "Compassion becomes tangible when understanding turns into respectful action."]]}, {"id": 10, "zh": "佛", "en": "Buddha", "state": ["智慧整合", "Integrated wisdom"], "force": ["整合與校正", "Integration and calibration"], "need": ["生成智慧", "Develop wisdom"], "blind": ["避免自認完成", "Avoiding complacency"], "mechanism": ["整合反例與回饋持續更新", "Integrating counterevidence and feedback"], "inner": ["哪個模型需要更新", "Which model needs revision?"], "risk": ["模型自滿", "Model complacency"], "action": ["用新證據修正一項舊判斷", "Revise a belief using new evidence"], "example": ["「AI一定讓學生偷懶」→觀察反例並修正條件", "Test the claim “AI always makes students lazy” against evidence"], "quotes": [["智慧的最高境界，不是從此不再犯錯，而是能夠辨識錯誤、接受差異、修正模型，讓每一次經驗都成為更新的材料。", "Wisdom is not never making mistakes; it is learning how to detect and revise them."], ["聲聞讓資訊成為知識，緣覺讓知識成為模型，菩薩讓模型成為能力，佛界則象徵能力與經驗不斷整合，逐漸生成智慧。", "Information becomes knowledge, knowledge becomes models, models become action, and experience can become wisdom."], ["真正成熟的生命，不是永遠不會失衡，而是即使受到痛苦、欲望、比較與環境變化的干擾，仍然知道如何重新調整。", "Maturity means knowing how to recalibrate after disruption."], ["成長不是累積更多永遠不變的答案，而是持續提高判斷品質；自由不是想做什麼就做什麼，而是不再被舊模型完全綁架。", "Growth improves judgment function renderOverview(){const branches=[['限制性迴路','Constraining loops',[0,1,2,3]],['覺察與資源','Awareness and resources',[4,5]],['知識到能力','From knowledge to capability',[6,7,8]],['智慧整合','Wisdom integration',[9]]];$('overview').innerHTML=`<div class="card"><h2>${label('十界不是固定身份，而是可變動的生命狀態','Realms are dynamic states, not fixed identities')}</h2><p>${label('十界互具提醒我們：任何一個人都可能在不同情境中展現多種狀態。這個APP以現代系統隱喻呈現，並非佛教原義的直接等同。','Mutual inclusion reminds us that many states can coexist. This app offers a modern systems analogy, not a literal equation with Buddhist doctrine.')}</p><div class="notice">${label('重要：十界不是人格標籤、心理診斷或由低到高的固定排行榜。','Important: realms are not personality labels, diagnoses, or a fixed ladder of human worth.')}</div></div><h2>${label('心智圖：十界四大系統','Mind map: Four systems')}</h2><div class="mind">${branches.map(([zh,en,ids])=>`<div class="branch"><h3>${label(zh,en)}</h3>${ids.map(i=>`<button class="btn" style="margin:3px" onclick="current=${i};go('atlas')">${title(DATA[i])}</button>`).join('')}</div>`).join('')}</div><div class="card"><h2>${label('四層生命框架','Four-layer life framework')}</h2>${[['本體：我目前處於什麼生命狀態？','Ontology: What state am I in?'],['結構：哪些需求、變數與關係在作用？','Structure: Which needs, variables and relations matter?'],['機制：我如何解釋、預測與反應？','Mechanism: How do I interpret, predict and react?'],['行動：下一個最小更新是什麼？','Action: What is the smallest useful update?']].map((a,i)=>`<div class="step"><strong>${i+1}.</strong> ${label(...a)}</div>`).join('')}</div><div class="card"><h2>${label('生命更新閉環','Model-update loop')}</h2><p>${label('輸入 → 表徵 → 權重 → 預測 → 行動 → 回饋 → 預測誤差 → 模型更新 → 再測','Input → Representation → Weighting → Prediction → Action → Feedback → Prediction error → Model update → Retest')}</p></div>`}
function renderAtlas(){let r=DATA[current];$('atlas').innerHTML=`<div class="field no-print"><label>${label('選擇十界','Choose a realm')} <select onchange="current=+this.value;renderAtlas()">${opts(current)}</select></label></div><div class="card"><h2>${r.id.toString().padStart(2,'0')}｜${title(r)}</h2><div class="pill">${tx(...r.state)}</div><p class="muted">${label('十界互具：本界是狀態，不是固定身份。','Mutual inclusion: a state, not a fixed identity.')}</p></div><div class="grid">${[['核心狀態','Core state','state'],['主導力量','Dominant force','force'],['核心需求','Core need','need'],['認知盲點','Blind spot','blind'],['資訊處理機制','Information mechanism','mechanism'],['內在語言','Inner voice','inner'],['系統風險','System risk','risk'],['最小行動','Minimum action','action']].map(([a,b,k])=>field(a,b,r[k])).join('')}</div>${field('生活示範','Life example',r.example)}<div class="card"><h3>${label('五句哲學金句','Five philosophical quotes')}</h3>${r.quotes.map((q,i)=>`<div class="quote"><b>${String(i+1).padStart(2,'0')}</b> ${bi(q)}</div>`).join('')}</div><div class="field no-print"><button class="btn" onclick="current=(current+9)%10;renderAtlas()">← ${label('上一界','Previous')}</button><button class="btn" onclick="current=(current+1)%10;renderAtlas()">${label('下一界','Next')} →</button></div>`}
const cols=[['state','生命狀態','State'],['force','主導力量','Dominant force'],['need','核心需求','Core need'],['blind','認知盲點','Blind spot'],['mechanism','資訊機制','Mechanism'],['inner','內在語言','Inner voice'],['risk','系統風險','System risk'],['action','最小行動','Minimum action']];let shownCols=['state','force','need','blind','mechanism','inner','risk','action'];
function renderMatrix(){ $('matrix').innerHTML=`<div class="card"><h2>${label('十界 × 八大維度完整對照','Ten realms × eight comparison dimensions')}</h2><p class="muted">${label('表格可左右捲動；點擊欄位可切換顯示。','Scroll horizontally; toggle dimensions below.')}</p><div class="field no-print">${cols.map(([k,a,b])=>`<label class="pill"><input type="checkbox" ${shownCols.includes(k)?'checked':''} onchange="toggleCol('${k}',this.checked)"> ${label(a,b)}</label>`).join('')}</div></div><div class="table-wrap"><table><thead><tr><th>${label('十界','Realm')}</th>${cols.filter(x=>shownCols.includes(x[0])).map(x=>`<th>${label(x[1],x[2])}</th>`).join('')}</tr></thead><tbody>${DATA.map(r=>`<tr><td>${title(r)}</td>${cols.filter(x=>shownCols.includes(x[0])).map(x=>`<td>${bi(r[x[0]])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}

function renderPractice(){let r=DATA[current];let n=notes[current]||{};$('practice').innerHTML=`<div class="card"><h2>${label('每日最小行動 × 模型更新','Daily minimum action × model update')}</h2><div class="field no-print"><select onchange="saveNote();current=+this.value;renderPractice()">${opts(current)}</select></div><h3>${title(r)}</h3>${field('今日最小行動','Today’s minimum action',r.action)}${field('生活示範','Life example',r.example)}<div class="notice">${label('以下記錄只在目前頁面暫存；可匯出文字保存，不會上傳伺服器。','Notes stay in this page session. Export to save them; nothing is uploaded.')}</div><div class="field"><label style="width:100%">${label('觸發事件 / Trigger')}<textarea id="note-trigger" placeholder="${label('今天發生了什麼？','What happened today?')}">${esc(n.trigger||'')}</textarea></label><label style="width:100%">${label('原本預測 / Original prediction')}<textarea id="note-prediction">${esc(n.prediction||'')}</textarea></label><label style="width:100%">${label('最小行動與實際回饋 / Action & feedback')}<textarea id="note-feedback">${esc(n.feedback||'')}</textarea></label><label style="width:100%">${label('更新後的理解 / Revised model')}<textarea id="note-update">${esc(n.update||'')}</textarea></label></div><button class="btn active no-print" onclick="saveNote();alert('${label('已暫存於本頁，可匯出保存。','Saved in this page session. Export to keep it.')}')">${label('暫存記錄','Save in page')}</button><button class="btn no-print" onclick="saveNote();exportText()">${label('匯出記錄','Export notes')}</button></div>`}

function renderQuiz(){let q=scenarios[quizIndex];$('quiz').innerHTML=`<div class="card"><h2>${label('十界情境辨識｜教學練習','Scenario quiz · Educational practice')}</h2><p class="muted">${quizIndex+1}/10 · ${label('答對','Correct')} ${score} · ${label('不作人格診斷','Not a personality diagnosis')}</p>${bi(q.q)}<div class="grid" style="margin-top:16px">${DATA.map((r,i)=>`<button class="realm-tile" ${answered?'disabled':''} onclick="answer(${i})"><strong>${r.zh}</strong><span>${r.en}</span></button>`).join('')}</div><div id="feedback" class="card ${answered?'':'hidden'}"></div><div class="field no-print"><button class="btn" onclick="quizIndex=(quizIndex+1)%10;answered=false;renderQuiz()">${label('下一題','Next')} →</button><button class="btn" onclick="quizIndex=0;score=0;answered=false;renderQuiz()">${label('重新開始','Restart')}</button></div></div>`}
function answer(i){if(answered)return;answered=true;let ok=i===scenarios[quizIndex].a;if(ok)score++;let correct=DATA[scenarios[quizIndex].a];$('feedback').classList.remove('hidden');$('feedback').innerHTML=`<b class="${ok?'correct':'wrong'}">${ok?label('答對了','Correct'):label('再想想','Try another perspective')}</b><p>${label('參考辨識','Suggested interpretation')}：${title(correct)}</p>${bi(correct.mechanism)}<p class="muted">${label('這是教學案例的主要線索，不代表真實人物只有一種狀態。','This is the primary cue in a teaching example, not a fixed label for real people.')}</p>`;renderQuizButtons()}
function renderQuizButtons(){document.querySelectorAll('#quiz .realm-tile').forEach(x=>x.disabled=true);let p=$('quiz').querySelector('.muted');if(p)p.textContent=`${quizIndex+1}/10 · ${label('答對','Correct')} ${score}`}
function renderSources(){ $('sources').innerHTML=`<div class="card"><h2>${label('資料來源與解釋邊界','Sources and interpretive boundaries')}</h2><p>${label('主要來源：本對話先前整理的《生命大數據：法華經與十法界》十界摘要，以及使用者確認的LifeOS十界對照、50句金句與十項最小行動。','Primary basis: the earlier conversation’s summary of “Life Big Data: Lotus Sutra and the Ten Realms,” plus the agreed LifeOS comparisons, 50 quotes and ten minimum actions.')}</p><p>${label('資料編號：BUD-OS-0049；本APP是可攜式教育成品，並未直接寫入外部會員平台或資料庫。','Data ID: BUD-OS-0049. This is a portable educational artifact; it has not been written into an external membership platform or database.')}</p><div class="notice">${label('佛教原義與現代類比必須區分。傳統佛教十界涉及六凡四聖、業、修行與解脫；聲聞不只是知識輸入，緣覺不只是結構分析，菩薩不只是助人技巧，佛界也不只是認知更新。','Keep Buddhist doctrine distinct from this modern analogy. Traditional ten realms concern karma, practice and liberation; Śrāvaka is not merely information intake, Pratyekabuddha not merely systems analysis, Bodhisattva not merely helping skills, and Buddha not merely cognitive updating.')}</div><h3>${label('傳統與LifeOS的區別','Traditional vs LifeOS')}</h3><div class="table-wrap"><table><thead><tr><th>${label('概念','Concept')}</th><th>${label('佛教原義','Traditional Buddhism')}</th><th>LifeOS</th></tr></thead><tbody>${[['聲聞','依四聖諦等教法修行','Knowledge intake'],['緣覺','觀察緣起、因緣','Structural understanding'],['菩薩','菩提心、慈悲、六度','Action and helpful capability'],['佛','覺悟、解脫、究竟智慧','Integrated model revision'],['十界互具','每一界皆具十界，為天台一念三千之重要觀念','Dynamic coexistence of states']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}</tbody></table></div><p>${label('「熵增／逆熵」、「預測模型」與「動態狀態空間」均屬現代詮釋的教學隱喻，並非物理測量或臨床判定。','Entropy, prediction models and dynamic state spaces are teaching metaphors here—not physical measurements or clinical classifications.')}</p></div>`}
function getText(){let out=['十法界 LifeOS / Ten Realms','BUD-OS-0049'];DATA.forEach(r=>{out.push(`\n${r.id}. ${r.zh} / ${r.en}`);cols.forEach(([k,zh,en])=>out.push(`${zh} / ${en}: ${r[k][0]} / ${r[k][1]}`));r.quotes.forEach((q,i)=>out.push(`${i+1}. ${q[0]}\n${q[1]}`));if(notes[r.id-1])out.push('Notes: '+JSON.stringify(notes[r.id-1]))});return out.join('\n')}
function downloadText(s,filename){let blob=new Blob([s],{type:'text/plain;charset=utf-8'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function exportText(){if(tab==='practice')saveNote();downloadText(getText(),'ten_realms_lifeos_bilingual.txt')}
function copyQuotes(){let s=DATA.map(r=>`【${r.zh} / ${r.en}】\n`+r.quotes.map((q,i)=>`${i+1}｜${q[0]}\n${q[1]}`).join('\n')+`\n最小行動｜${r.action[0]} / ${r.action[1]}`).join('\n\n');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(s).then(()=>alert(label('已複製50句金句','50 quotes copied'))).catch(()=>downloadText(s,'50_quotes.txt'));else downloadText(s,'50_quotes.txt')}
render();</script>

<script>
(function(){
var TAG=['情境衝突','反問句','哲學命題','對比句','排比句','認知翻轉','層層遞進','詩性收束'];
var P=[{"page": "01｜地獄：痛苦封閉", "t": "地獄不在別處，在你對自己說「我沒有希望了」的那一刻", "tags": "#十法界 #地獄 #痛苦封閉 #改寫舊結論 #LifeOS", "s": ["那年她考研究所落榜，第二年再考，又落榜。第三年的放榜日，她沒有去看榜單，只是關在房間裡，一遍遍地對自己說：「我就是不行，我永遠都學不好。」那段日子，她吃不下、睡不著，看什麼都是灰的。媽媽敲門，她不想應；朋友傳訊息，她不想回。那不是一個地方，卻比任何地方都更像地獄：一個她自己走進去，卻找不到出口的房間。", "如果地獄是死後才去的地方，為什麼有那麼多人，活著的時候就已經在裡面？如果痛苦是外面的事情造成的，為什麼同樣的事件，有人走出來了，有人卻一直被困住？讓我們最絕望的，究竟是事情本身，還是我們心裡那句，把所有可能都關上的話？", "這個 APP 用現代的系統角度，重新理解佛法裡的十法界，並特別提醒：十界不是人格標籤，也不是由低到高的排行榜，而是每個人在不同情境裡，都可能出現的生命狀態。地獄的狀態，是痛苦與封閉；主導的力量，是絕望與負向的預測；它最看不見的，是新的可能性。負面的證據被過度放大，心裡的聲音說：我沒有希望了。", "地獄的狀態說：「我永遠學不好。」走出來的第一步說：「我今天先練一篇短文。」一個把一次失敗，擴大成一生的判決，一個把一生的問題，縮小成今天的一步；一個關上所有的門，一個只推開最近的那一扇；一個說沒有希望，一個說：我先找一點點光。", "痛苦會讓視野變窄，窄到只看得見最壞的結局；絕望會讓時間變長，長到好像永遠都不會結束；封閉會讓聲音變小，小到聽不見身邊的人在叫你；負向的預測會讓證據變得單一，單一到只剩下「我不行」這一個答案。這不是你軟弱，而是痛苦，本來就會讓人的世界縮小。", "我們以為要先不痛了，才能走出來；其實很多時候，是先說出一句不一樣的話，痛才開始鬆動。最深的翻轉是：地獄最堅固的牆，往往不是事件本身，而是那句被我們反覆說了太多次的舊結論。改寫一句話，牆上就出現了一道裂縫，光就有機會照進來。", "今天，只做一件事：找出一句你最常用來否定自己的話，把它改寫成一句「今天可以做的小事」。「我永遠做不好」改成「我今天先做第一步」。第一次寫，你可能完全不相信它；寫十次之後，你開始願意試試看。如果你正處在很深的絕望裡，請不要一個人撐著，告訴一個信任的人，或撥打衛福部 1925 安心專線，24 小時都有人陪你說話。", "最黑的夜裡，星星其實一直都在，只是被雲遮住了。雲會移動，夜會過去，而你，會在某一個清晨，重新看見光。願你知道，你現在待的地方，不是你永遠的住址；願你今天，先替自己點一盞小小的燈；願你相信，再深的夜，也會有人陪你一起，等到天亮。"], "q": [["你現在待的地方，不是你永遠的住址。", "Where you are now is not where you'll always be."], ["改寫一句限制自己的舊結論；絕望時，請撥 1925 找人陪你。", "Rewrite one old belief that limits you; if you feel hopeless, call 1925 in Taiwan for support."]]}, {"page": "02｜餓鬼：永遠不足", "t": "你不是不夠多，你只是從來沒有替自己定義過什麼叫「夠了」", "tags": "#十法界 #餓鬼 #永遠不足 #足夠標準 #LifeOS", "s": ["他年收入已經是同齡人的兩倍，可是每天打開手機，看到別人的房子、別人的車子、別人的投資報酬率，他就覺得自己還差得遠。他換了更大的房子，就想要更好的地段；換了更好的車，就想要下一個等級。朋友羨慕他，他卻總是焦慮。某天深夜，太太問他：「到底要多少，你才會覺得夠？」他張開嘴，發現自己從來沒有答案。", "如果我們一直在追求更多，為什麼得到之後，滿足感總是那麼短？如果缺乏的感覺來自真的不夠，為什麼擁有很多的人，也常常覺得什麼都不夠？我們心裡那個永遠填不滿的洞，到底是因為東西太少，還是因為我們從來沒有替它畫過一條底線？", "十界裡的餓鬼，是一種永遠不足的生命狀態。主導的力量，是缺乏與欲望；它最看不見的，是足夠與滿足。缺乏的訊號被過度放大，心裡的聲音不停地問：為什麼還是不夠？系統最大的風險，是目標無限擴張，永遠在追，永遠到不了。這不是貪心的人才有的狀態，每一個人在某些時刻，都可能活成這個樣子。", "餓鬼的狀態說：「我要更多錢。」足夠的狀態說：「我先準備好六個月的緊急預備金。」一個沒有終點，一個有一個清楚的標準；一個越追越焦慮，一個達標之後能安心地停一下；一個看別人有什麼，一個看自己需要什麼；一個用欲望填洞，一個用標準替洞畫一條邊。", "想要更多的錢，先問：多少才足夠安心？想要更多的讚，先問：誰的肯定對我真正重要？想要更多的東西，先問：哪一樣是我真的會用、會珍惜的？想要更多的成就，先問：哪一件是我真正在乎的？每一個「更多」，都值得一個「夠了」的標準。", "我們以為滿足要等到擁有夠多才會來，其實滿足是一種需要被練習的能力。最深的翻轉是：讓我們永遠不夠的，不是擁有得太少，而是我們從來沒有定義過「夠」。當你替一項欲望定下足夠的標準，你不是放棄了野心，而是第一次讓自己有機會，在抵達之後，真正地鬆一口氣。", "今天，選一項你最常覺得「不夠」的東西，替它寫下一個清楚的足夠標準：多少錢夠安心？多少時間夠陪家人？多少工作量夠有成就感？然後在達到的那一天，好好地慶祝一次。第一次，你可能會想立刻提高標準；第二次，你開始學會停下來；慢慢地，你會發現，那份追不完的焦慮，正在一點一點地安靜下來。", "杯子之所以能裝水，是因為它有邊；沒有邊的杯子，倒再多的水，也只會流走。願你替自己的欲望，做一個溫柔的杯子；願你在杯子滿了的時候，懂得停下來，好好地喝一口；願你嚐到那份久違的甜，發現原來，你早就擁有了很多。"], "q": [["杯子能裝水，是因為它有邊。", "A cup can hold water because it has edges."], ["替一項欲望，寫下一個清楚的「夠了」標準。", "Write a clear \"enough\" for one of your desires."]]}, {"page": "03｜畜生：自動反應", "t": "「我忍不住」不是一句藉口，而是一個需要被看見的舊迴路", "tags": "#十法界 #畜生 #自動反應 #暫停三秒 #LifeOS", "s": ["孩子又頂嘴了。那句「你很煩欸」一出口，他的手比腦袋還快，一掌拍在桌上，吼了一句：「你再說一次看看！」孩子哭著跑回房間。他站在客廳，手還在發麻。這個畫面他太熟悉了，小時候，他的爸爸也是這樣對他的。他曾經發誓絕對不要變成那樣的父親，可是在那一瞬間，他的身體，好像根本不聽他的。", "如果我們真的不想那樣做，為什麼還是一次次做出同樣的反應？如果我們已經長大、已經懂了，為什麼在某些時刻，身體會比理智更早行動？我們說「我忍不住」，可是，那個忍不住的，到底是誰？", "十界裡的畜生，在這個 APP 的現代解讀裡，指的是自動反應的生命狀態：被本能與舊習慣主導，最需要的是即時的安全，最看不見的是長期的後果。刺激一來，舊反應就直接被觸發，心裡的聲音說：我忍不住。系統最大的風險，是舊迴路一再重複，連我們最不想傳下去的東西，也一代一代地傳了下去。", "自動反應說：「他頂嘴，我就吼回去。」覺察的反應說：「他頂嘴，我先停三秒，問他真正想說什麼。」一個由刺激直接連到行為，一個在中間放了一個小小的空隙；一個只顧著當下的安全感，一個看見了長期的關係；一個重複了上一代的模式，一個開始寫下新的一頁。", "三秒鐘，可以讓一句傷人的話停在嘴邊；三秒鐘，可以讓一個揚起的手放下來；三秒鐘，可以讓你從「他在挑釁我」，換成「他可能有話說不出口」；三秒鐘，可以讓一個舊的迴路，第一次沒有被走完。不需要一下子變成完美的人，只需要一次又一次，給自己三秒。", "我們以為要改掉壞脾氣，需要很大的意志力；其實改變自動反應，最需要的不是力氣，而是一個空隙。最深的翻轉是：在刺激和反應之間，永遠有一個小小的空間；你在那個空間裡停留得越久，你就越自由。那三秒，就是你從舊的自己，走向新的自己的那一步。", "這週，選一個最容易讓你自動反應的情境，替自己準備一個暫停的動作：深呼吸一次、喝一口水、或在心裡數一二三。下一次刺激來時，先做那個動作，再決定怎麼回應。第一次，你可能只停了一秒；第五次，你停了三秒；一個月後，你發現自己比以前少後悔了很多；而你的孩子，也開始在你面前，願意多說幾句真心話。", "河水沿著舊河道流了很多年，可是只要在某個地方放下一塊石頭，水就會開始繞出一條新的路。願你在自己的生命裡，放下那一塊小小的石頭；願你給每一次衝動，留三秒鐘的空隙；願你親手改變的那一條河道，從此流向一個更溫柔的地方。"], "q": [["在刺激和反應之間，永遠有一個小小的空間。", "Between stimulus and response, there is always a small space."], ["情緒反應之前，先停三秒。", "Pause for three seconds before you react."]]}, {"page": "04｜修羅：比較競爭", "t": "你把每一次不同意見都當成戰爭，所以你一直很累", "tags": "#十法界 #修羅 #比較競爭 #把比較變學習 #LifeOS", "s": ["同事在會議上提出一個很好的點子，主管當場大力稱讚。他坐在一旁，臉上在笑，心裡卻翻騰著：她憑什麼？我上次提的明明也不差。接下來的一週，他開始挑她的毛病，在主管面前暗示她的方案有風險，甚至故意不分享手上的資料。他贏了幾次小小的口舌之爭，卻在年底的考核裡，被寫下一句：「團隊合作有待加強。」", "如果贏過別人就能證明自己的價值，為什麼贏了之後，我們還是那麼不安？如果競爭能讓人進步，為什麼越愛比較的人，越容易被耗盡？我們真的需要在每一件事上分出輸贏嗎，還是我們只是害怕，一旦輸了，自己就什麼都不是了？", "十界裡的修羅，是一種比較與競爭的生命狀態。主導的力量，是身分與輸贏；最需要的，是身分被肯定；最看不見的，是合作的價值。它的機制，是把分歧解讀成對身分的威脅，所以每一個不同意見，都像一場戰爭；心裡的聲音說：我不能輸。系統的風險，是競爭不斷消耗資源，最後誰都沒有贏。", "修羅的狀態說：「她表現得比我好，我要想辦法贏回來。」學習的狀態說：「她表現得很好，我可以向她請教一招。」一個把別人的成功當成自己的失敗，一個把別人的成功當成一份學習資料；一個在比較裡消耗，一個在比較裡成長；一個守著自己的位置，一個擴大大家的可能。", "把一次嫉妒，換成一個好奇的問題：她是怎麼做到的？把一次不服，換成一次請教：這一招可以教我嗎？把一次爭辯，換成一次確認：我們真正的目標是什麼？把一次比較，換成一次自我對照：我比去年的自己，進步了多少？比較本身不是錯，錯的是只用它來分輸贏。", "我們以為只有贏，才能證明自己值得被肯定；其實真正穩固的價值，不需要靠打敗任何人來維持。最深的翻轉是：當你不再把每一次分歧當成身分的威脅，你就從一個每天都在作戰的人，變成一個每天都在學習的人；而那些曾經的對手，也可能變成，你身邊最好的老師。", "這週，找一位讓你有點嫉妒、有點不服的人，主動向他請教一件他做得比你好的事。第一次開口，你會覺得很沒面子；聽完之後，你會發現自己學到了好多；第二次，你開始能真心地稱讚他；慢慢地，你的心裡少了一些戰場，多了一些夥伴；而你的能力，也在這個過程裡，悄悄地往上長。", "兩棵樹如果拚命爭搶陽光，枝幹會長得扭曲；如果它們各自往上，又在地底下彼此相連，就會一起長成一片森林。願你不再把每一棵身邊的樹都當成敵人；願你把比較的力氣，變成往上長的力氣；願你在某一天發現，自己站在一片茂密的森林裡，而且一點都不孤單。"], "q": [["真正穩固的價值，不需要靠打敗任何人來維持。", "Truly solid worth doesn't need to defeat anyone to survive."], ["把一次比較，變成一次請教。", "Turn one comparison into one chance to learn."]]}, {"page": "05｜人：自我覺察", "t": "成為「人」，是從願意說一句「我可能看錯了」開始的", "tags": "#十法界 #人界 #自我覺察 #事實與解釋 #LifeOS", "s": ["朋友已經兩天沒回她訊息了。她的腦袋開始轉：是不是我上次說錯了什麼？是不是她覺得我很煩？是不是她其實一直都不喜歡我？她越想越難過，差點就傳了一封很長的訊息去質問。可是在按下送出之前，她停了下來，問自己一句：我現在知道的事實是什麼？答案只有一個：她兩天沒回。其他的，全都是她自己的解釋。", "如果我們看到的事情就是真相，為什麼我們常常在事後才發現，自己完全誤會了？如果我們的感受都是對的，為什麼同一件事，不同的人會有完全不同的感受？我們有多少的痛苦，是來自發生的事，又有多少，是來自我們替那件事加上的故事？", "十界裡的人，是自我覺察的生命狀態。主導的力量，是反思與修正；最需要的，是理解自己；它的機制，是區分事實與解釋；心裡的聲音說：我可能看錯了。這是一個很珍貴的狀態，因為它讓人有機會停下來、看清楚、再選擇。它的盲點，是還沒有發現的其他盲點；它的風險，是覺察了，卻沒有化成行動。", "沒有覺察的狀態說：「她不回我，一定是討厭我。」覺察的狀態說：「她兩天沒回，我還不知道原因。」一個把解釋當成事實，一個把兩者分開；一個在想像裡受傷，一個在事實裡停留；一個急著反應，一個先給自己一點空間；一個確定自己是對的，一個願意承認自己可能看錯。", "事實是：他沒有打招呼。解釋是：他看不起我。事實是：主管改了我的報告。解釋是：主管覺得我能力差。事實是：孩子成績退步了。解釋是：孩子不用功。事實是：伴侶今天比較安靜。解釋是：他對我不滿意。每一組事實和解釋之間，都藏著一大片，我們還沒有問清楚的空白。", "我們以為覺察是一種很高深的能力，其實它常常只是一個很簡單的動作：把事實和解釋分開寫。最深的翻轉是：「我可能看錯了」這句話，聽起來像是示弱，其實是一種很大的力量。願意這樣說的人，不會被自己的想像困住，也比較少因為誤會，傷害了自己在乎的人。", "這週，每當你感到難過或生氣，拿一張紙分成兩欄：左邊寫事實，只寫看得見、聽得見的事；右邊寫解釋，寫你心裡加上去的故事。然後問自己：還有沒有其他可能的解釋？第一次，你會發現右邊寫得比左邊長很多；一個月後，你開始在心裡自動分欄；而你的誤會、你的內耗，也會一點一點地變少。", "鏡子上起了霧，看見的臉就是模糊的；輕輕擦一擦，臉就清楚了。覺察，就是那一下輕輕的擦拭。願你常常替自己的心擦一擦鏡子；願你在每一次想下結論之前，都記得問一句：我可能看錯了嗎？願你在越來越清楚的鏡子裡，看見真實的世界，也看見真實的自己。"], "q": [["「我可能看錯了」，是一句很有力量的話。", "\"I might be wrong\" is a powerful sentence."], ["把事實和解釋分成兩欄寫下來。", "Write facts and interpretations in two separate columns."]]}, {"page": "06｜天：幸福順境", "t": "最危險的時刻，往往是你覺得「現在這樣就很好」的時候", "tags": "#十法界 #天界 #順境 #舒適依賴 #LifeOS", "s": ["她在同一所學校教書二十年，教材早就背得滾瓜爛熟，學生的評價一直很好，生活穩定又舒服。新的教學工具出現時，年輕老師們都在討論，她卻笑著說：「我現在這樣教就很好了，不需要改。」幾年後，學生變了，學習方式也變了，她第一次發現，台下的孩子好像聽不太進去了。她很困惑：我明明沒有變啊。後來她才明白，問題正是，她沒有變。", "如果順境是我們一直追求的，為什麼順境裡的人，有時候反而最容易被時代拋下？如果一切都很好，為什麼還需要改變？我們拚命爬上了山頂，可是在山頂上安穩地坐著，真的就能一直待在那裡嗎？", "十界裡的天，是幸福與順境的生命狀態。主導的力量，是高資源與高回報；最需要的，是幸福與舒適；它的機制，是維持高回報的舒適狀態；心裡的聲音說：現在這樣很好。順境本身是一份祝福，值得好好珍惜。可是它最看不見的，是環境的變動；它最大的風險，是對舒適的依賴。", "天的狀態說：「我習慣的方法一直都有效，不需要改。」持續更新的狀態說：「我的方法現在有效，但我願意試試新的可能。」一個把舒適當成終點，一個把舒適當成學習的安全基地；一個等到環境逼它改變，一個在一切都好的時候，就主動做一點小小的嘗試。", "順境裡最適合學新東西，因為你有餘裕；順境裡最適合冒小小的險，因為你有底氣；順境裡最適合聽不同的聲音，因為你不必急著防衛；順境裡最適合替未來準備，因為你還有時間。好日子不是用來把自己鎖住的，而是用來替下一段路，存一點彈性。", "我們以為危機都發生在不順利的時候，其實很多危機，是在最舒服的時候悄悄種下的。最深的翻轉是：真正讓人走得長遠的，不是一直待在順境裡，而是在順境裡依然保持好奇。當你願意在不需要改變的時候嘗試改變，你就不會在必須改變的時候，措手不及。", "這週，在你最熟悉、最舒服的領域裡，嘗試一件安全但不熟悉的新事情：一個新的工具、一種新的做法、一個新的合作對象。不必大，只要新。第一次，你可能會覺得笨手笨腳；第二次，你開始看見它的好處；一年後，當環境改變時，你會發現自己早就準備好了，因為你從來沒有，讓自己停在原地。", "晴天的時候修屋頂，雨天才不會手忙腳亂。願你好好享受生命裡的每一個晴天；願你也在陽光最好的時候，替未來修一修屋頂；願你在順境裡不忘學習，在變動裡依然從容，讓幸福不只是一段時光，而是一種你一直都有能力，重新創造的狀態。"], "q": [["晴天的時候修屋頂，雨天才不會手忙腳亂。", "Fix the roof while the sun shines, so the rain won't catch you off guard."], ["在最熟悉的地方，嘗試一件安全但不熟悉的新事。", "Try one safe but unfamiliar thing in your most familiar place."]]}, {"page": "07｜聲聞：知識輸入", "t": "你學了那麼多，有沒有一個，是你能用自己的話講清楚的？", "tags": "#十法界 #聲聞 #知識輸入 #用自己的話解釋 #LifeOS", "s": ["他的書架上有三百本書，手機裡收藏了上千篇文章，每天通勤都在聽課程。朋友都說他很好學，他也覺得自己知道很多。可是有一天，同事請他解釋一個他明明讀過好幾遍的概念，他開口說了兩句，就卡住了。那一刻他很尷尬，也很困惑：我明明學過，為什麼講不出來？", "如果學得越多就懂得越多，為什麼有那麼多東西，我們讀過卻說不出來？如果知識是力量，為什麼收藏了那麼多知識，生活卻沒有什麼改變？我們一直在把資訊裝進腦袋，可是，裝進去的東西，真的變成我們的了嗎？", "十界裡的聲聞，在這個 APP 的解讀裡，是知識輸入的生命狀態：主導的力量，是學習與接收；最需要的，是獲得知識；心裡的聲音說：我要學習。這是一個很美好的狀態，因為所有的成長，都從願意學習開始。可是它最看不見的，是知識的適用條件；最大的風險，是資訊過載。", "只輸入的狀態說：「我讀過這個概念了。」消化的狀態說：「我可以用自己的話，把它講給一個小學生聽。」一個在收藏，一個在理解；一個知道很多名詞，一個知道它們什麼時候能用、什麼時候不能用；一個越學越焦慮，一個越學越踏實。", "學一個英文單字，就試著造一個句子；學一個心理學概念，就試著用它解釋一件自己的事；學一個管理方法，就試著在下週的工作裡用一次；學一個道理，就試著說給家人聽。每一次用自己的話說出來，知識就從別人的書裡，搬進了你的生命裡。", "我們以為學習是把東西放進腦袋，其實學習更像是把東西從腦袋裡拿出來。最深的翻轉是：你真正學會的，不是你讀過的，而是你能講清楚、能用出來的。少學一點、學深一點，比學很多卻都只停在表面，更能讓你成長。知識不是用來收藏的，是用來被你活出來的。", "這週，選一個你最近學到的概念，做一個簡單的練習：用三句話，向一個不懂的人解釋它；再舉一個生活裡的例子；最後找一個和它很像、卻不一樣的概念，比較它們的差別。第一次，你會發現自己講得結結巴巴；第三次，你講得越來越清楚；一個月後，你學的東西變少了，懂的東西卻變多了。", "一棵樹從土壤裡吸收養分，可是如果它只吸收、不消化，再肥沃的土地，也長不出果實。願你學習的每一份知識，都能被你好好地消化；願你能用自己的話，說出你相信的道理；願你的學習，最後都結成果實，讓你和身邊的人，一起嚐到甜。"], "q": [["你真正學會的，是你能講清楚、用得出來的。", "What you've truly learned is what you can explain and use."], ["學一個概念，用三句話講給不懂的人聽。", "Learn one idea and explain it to someone new in three sentences."]]}, {"page": "08｜緣覺：結構理解", "t": "拖延不是你懶，是睡眠、手機和任務大小一起把你卡住了", "tags": "#十法界 #緣覺 #結構理解 #找出三個變數 #LifeOS", "s": ["她一直覺得自己是個拖延的人。每次有重要的報告，她都拖到最後一晚才開始，然後熬夜趕完，隔天又累得什麼都做不了。她試過罵自己、試過設很多鬧鐘，都沒有用。直到有一天，她試著把問題拆開來看：她發現，每次拖延的那幾天，她都睡不到六小時；她的手機一直放在桌上；而那份報告，大到她根本不知道從哪裡開始。", "如果拖延是因為懶，為什麼我們在別的事情上又那麼勤快？如果問題只有一個原因，為什麼解決了那個原因，問題還在？我們總是急著替自己的問題貼一個標籤，可是，有沒有可能，那個問題其實是好幾個因素，交織在一起的結果？", "十界裡的緣覺，在這個 APP 的解讀裡，是結構理解的生命狀態：主導的力量，是關係與規律；最需要的，是理解規律；它的機制，是建立變數之間的關係和回饋迴路；心裡的聲音說：背後有什麼結構？它讓人從單一的標籤，走向更立體的理解。它的盲點，是還沒有實際驗證；它的風險，是分析過度。", "貼標籤的狀態說：「我就是懶。」結構的狀態說：「我的睡眠、手機和任務大小，一起影響了我的行動。」一個把問題歸到人格，一個把問題拆成變數；一個只能責怪自己，一個看見可以調整的地方；一個一直重複同樣的循環，一個找到了循環的開關。", "把拖延拆成三個變數：睡眠夠不夠、環境有沒有干擾、任務是不是太大；把吵架拆成三個變數：雙方累不累、話題是不是太敏感、時間點是不是不對；把學習卡關拆成三個變數：基礎夠不夠、方法對不對、練習夠不夠。每一個問題，都值得被拆成三個可以動手的地方。", "我們以為看懂問題，就要找到那個唯一的原因；其實大部分的問題，都是好幾個原因一起造成的。最深的翻轉是：當你看見了結構，你就不必再責怪自己的性格；你只需要調整其中一兩個變數，整個循環就會開始改變。不過也要記得，分析是為了行動，想清楚了，就去試一試。", "這週，選一個你一直卡住的問題，替它找出三個可能的變數，然後只調整其中一個，觀察一週。像那位以為自己很會拖延的人，她先讓自己每天多睡一小時，結果發現，光是這一個改變，報告就提前了兩天完成。第一個變數，可能只改變一點點；第二個、第三個加上去，你會看見，整個問題慢慢地解開了。", "一張網打了結，不是只有一個地方打結，而是好幾條線纏在一起。急著用力拉，結只會越拉越緊；找到每一條線的走向，輕輕地鬆開，網就能重新攤平。願你在每一個糾結的問題裡，都有耐心看見那些線；願你溫柔地，一條一條地鬆開；願你的生活，重新變得平整而寬闊。"], "q": [["拆開一個問題，你就不必再責怪自己的性格。", "Break a problem apart, and you no longer need to blame your character."], ["替卡住的問題找出三個變數，先調整一個。", "Find three variables behind your problem, and adjust one first."]]}, {"page": "09｜菩薩：能力實踐", "t": "真正的幫助，不是替別人做完，而是給他剛好需要的那一份", "tags": "#十法界 #菩薩 #利他行動 #尊重自主 #LifeOS", "s": ["他是一位很熱心的老師。看到學生功課跟不上，他就留下來替學生補課；看到學生家裡有困難，他就自己掏錢幫忙；看到學生情緒低落，他半夜也會回訊息。他幫了很多人，卻也越來越累。有一天，一個他幫了很久的學生對他說：「老師，其實我想自己試試看。」他愣了一下，才發現，自己的幫忙，有時候也讓對方沒有機會長大。", "如果幫助別人是好事，為什麼有些幫助，會讓對方更依賴、讓自己更疲憊？如果我們真心想讓對方變好，為什麼有時候對方並不領情？我們以為自己在付出，可是，我們給出去的，真的是對方需要的嗎？", "十界裡的菩薩，是能力實踐與利他的生命狀態：主導的力量，是利他與行動；最需要的，是解決問題；它的機制，是用行動去測試理解；心裡的聲音說：我能如何幫忙？這是一個很溫暖、很有力量的狀態。可是它最看不見的，是對方的自主性；最大的風險，是過度承擔。", "過度承擔的狀態說：「我來幫你全部處理好。」成熟的利他說：「你最卡的是哪一個地方？我們先從那裡開始。」一個替對方完成，一個陪對方長出能力；一個忽略了對方想自己來的心意，一個尊重對方的選擇；一個越幫越累，一個幫得剛剛好，雙方都能走得長遠。", "學生學習困難，先找出一種最常犯的錯誤，陪他練三題；朋友遇到難關，先問他需要的是建議、陪伴，還是實際的幫忙；家人生病了，先問他想要怎麼被照顧；同事卡住了，先問他想自己試，還是想一起做。好的幫助，從一個好的問題開始。", "我們以為給得越多，就越是愛；其實真正的愛，有時候是給得剛剛好，然後退一步，讓對方自己走。最深的翻轉是：最好的幫助，不是讓別人更需要你，而是讓別人越來越不需要你。當你尊重對方的自主，你的利他，就不再是一份沉重的承擔，而是一份讓彼此都更自由的禮物。", "這週，當你想幫助一個人時，先問一句：「你現在最需要的是什麼？」然後只提供那一份。也許只是陪他找出一個錯誤，也許只是聽他說完，也許只是告訴他一個可以找的資源。第一次，你會很想多做一點；第三次，你學會停在剛好的地方；一個月後，你發現自己沒那麼累了，而你幫助的人，也站得比以前更穩了。", "好的園丁不會替花去開，他只是給它陽光、給它水、替它拔掉旁邊的雜草，然後耐心地等。願你也成為一位好的園丁；願你的每一份幫助，都恰好是對方需要的那一份；願你在給予之後，看見那些你陪伴過的人，一個一個，開出屬於他們自己的花。"], "q": [["最好的幫助，是讓別人越來越不需要你。", "The best help makes others need you less and less."], ["幫忙之前先問：你現在最需要的是什麼？", "Before helping, ask: what do you need most right now?"]]}, {"page": "10｜佛：智慧整合", "t": "真正的智慧，不是相信自己已經完成，而是一直願意被新的證據修正", "tags": "#十法界 #佛界 #智慧整合 #持續更新 #LifeOS", "s": ["一位資深的老師，一直相信「AI 一定會讓學生變懶」。他禁止學生在作業裡使用任何 AI 工具，也常在課堂上提醒大家要小心。直到有一學期，他發現班上一個原本很怕寫作的學生，因為用 AI 一句一句地追問、修改，第一次交出了一篇讓他驚喜的文章。他沒有立刻改變想法，可是他開始觀察，開始把自己的判斷，改得更精確：不是 AI 讓學生變懶，而是怎麼使用，決定了結果。", "如果智慧就是知道正確的答案，為什麼最有智慧的人，常常最願意說「我不確定」？如果我們已經走得很遠，是不是就可以停下來，不必再學了？我們以為智慧的終點，是再也不會出錯，可是，有沒有一種智慧，是在一直被修正的過程裡，才變得更深？", "十界裡的佛，在這個 APP 的現代解讀裡，是智慧整合的生命狀態：主導的力量，是整合與校正；最需要的，是生成智慧；它的機制，是整合反例與回饋，持續更新；心裡的聲音說：哪一個模型需要更新？這個 APP 也提醒，這是一種教育性的系統比喻，並不等同於佛教的原義。它最需要避免的，是自認已經完成；最大的風險，是對模型的自滿。", "自滿的狀態說：「我早就知道答案了。」智慧的狀態說：「這個新證據，讓我需要修正哪一部分？」一個守著自己的結論，一個歡迎反例；一個把經驗當成真理，一個把經驗當成會被更新的假說；一個在某個地方停了下來，一個一直走在路上。", "從地獄的封閉，到餓鬼的不足；從畜生的自動反應，到修羅的比較；從人的覺察，到天的順境；從聲聞的學習，到緣覺的理解；從菩薩的實踐，到佛的整合。十界不是一座要往上爬的階梯，而是每個人心裡都同時存在的十種狀態；每一種，都可以在當下，被看見，被轉化。", "我們以為智慧是一個終點，到了就可以休息；其實智慧更像一條沒有盡頭的路，越往前走，越知道自己還有多少不知道。最深的翻轉是：最高的狀態，不是不再犯錯，而是錯了之後，能最快地看見、最誠實地承認、最溫柔地修正。願意一直被修正的心，就是最接近智慧的心。", "這週，選一個你堅信了很多年的判斷，主動去找一個反例。不急著推翻它，只是讓它變得更精確：在什麼條件下它是對的？在什麼條件下它可能不對？第一次，你會很不舒服；第二次，你開始覺得有趣；慢慢地，你會發現，自己的心變得更寬，看世界的眼光變得更細膩，也更溫柔。", "大海之所以深廣，是因為它從不拒絕任何一條流進來的河。願你的心，也像大海一樣，願意接納每一份新的證據；願你在十界的起伏裡，都記得自己有能力看見、有能力轉化；願你在每一個平凡的當下，都離智慧，再近一點點。"], "q": [["願意一直被修正的心，就是最接近智慧的心。", "A heart willing to keep being corrected is closest to wisdom."], ["替一個堅信多年的判斷，主動找一個反例。", "Look for one counterexample to a judgment you've held for years."]]}];
var cur=0,hide=false;
function g(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var QL=[['心靈雞湯｜Soul Soup',''],['激勵｜Motivation','act']];
function qtext(p){return p.q?'\n\n'+p.q.map(function(x,k){return '【'+QL[k][0]+'】\n'+x[0]+'\n'+x[1]}).join('\n\n'):''}
function qhtml(p){return p.q?'<div class="lfb-qs">'+p.q.map(function(x,k){return '<div class="lfb-q '+QL[k][1]+'"><small>'+QL[k][0]+'</small><b>'+esc(x[0])+'</b><i lang="en">'+esc(x[1])+'</i></div>'}).join('')+'</div>':''}
function text(p){return '【'+p.t+'】\n\n'+p.s.join('\n\n')+qtext(p)+'\n\n'+p.tags}
function list(){
  var q=g('lfbQ').value.trim().toLowerCase();
  g('lfbList').innerHTML=P.map(function(p,i){
    if(q&&(p.page+' '+text(p)).toLowerCase().indexOf(q)<0)return '';
    return '<button type="button" data-i="'+i+'" class="'+(i===cur?'cur':'')+'"><small>第 '+(i+1)+' 頁｜'+esc(p.page)+'</small>'+esc(p.t)+'</button>';
  }).join('')||'<p style="padding:8px;font-size:14px">沒有符合的圖文</p>';
}
function show(i){
  cur=i;var p=P[i];
  g('lfbPost').innerHTML='<div class="lfb-eye">第 '+(i+1)+' / '+P.length+' 頁｜'+esc(p.page)+'</div><h2>'+esc(p.t)+'</h2><div class="lfb-meta">約 '+p.s.join('').replace(/\s/g,'').length+' 字 · 八種手法 · 文中情境為示例</div><div id="lfbBody" class="'+(hide?'notag':'')+'">'+p.s.map(function(x,k){return '<div class="lfb-part"><span class="lfb-tag">'+TAG[k]+'</span><p>'+esc(x)+'</p></div>'}).join('')+'</div>'+qhtml(p)+'<div class="lfb-tags">'+esc(p.tags)+'</div><div class="lfb-act"><button type="button" class="pri" id="lfbCopy">複製貼文</button><button type="button" id="lfbHide">'+(hide?'顯示':'隱藏')+'手法標籤</button><span class="lfb-st" id="lfbSt" role="status"></span></div>';
  g('lfbPost').scrollTop=0;list();
}
function copy(){
  var t=text(P[cur]),st=g('lfbSt');
  function fall(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();st.textContent=ok?'已複製，可直接貼到臉書。':'無法自動複製，請手動選取內文。'}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){st.textContent='已複製，可直接貼到臉書。'},fall)}else fall();
}
g('lfbOpen').onclick=function(){g('lfb').classList.add('on');show(cur);g('lfbQ').focus()};
g('lfbClose').onclick=function(){g('lfb').classList.remove('on');g('lfbOpen').focus()};
g('lfb').addEventListener('click',function(e){
  if(e.target===g('lfb'))g('lfbClose').onclick();
  var b=e.target.closest&&e.target.closest('[data-i]');if(b)show(+b.getAttribute('data-i'));
  if(e.target.id==='lfbCopy')copy();
  if(e.target.id==='lfbHide'){hide=!hide;show(cur)}
});
g('lfbQ').addEventListener('input',list);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&g('lfb').classList.contains('on'))g('lfbClose').onclick()});
})();
</script>
</body></html>
