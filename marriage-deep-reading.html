甚至一些自稱基督徒的人，\n用各種理由反對跨種族婚姻——\n有的怕失去族群認同，有的怕血統被稀釋，有的引用經文說神設定了各族的疆界。\n\n可是，聖經真正的故事是什麼？\n神從一本造出萬族，\n基督在十字架上，拆毀了中間隔斷的牆，\n使兩下成為一個新人，藉著十字架與神和好。\n天上的敬拜，是各國、各族、各民、各方的人，一同站在寶座前。\n\n我們以為，同族結婚比較「自然」；\n其實，在基督裡，最自然的事，是不同的人成為一家。\n我們以為，跨族婚姻會讓身分模糊；\n其實，在基督裡，我們最深的身分，從來不是膚色，而是神的兒女。\n\n有學者指出，文化中對通婚的禁忌，是教會種族分裂的核心原因之一。\n如果我們連「他們可以成為我的家人」都無法接受，\n又怎能真心說「我們在基督裡是一家人」？\n\n一段在基督裡的跨種族婚姻，\n不只是兩個人的相愛，\n更是一幅活生生的福音圖畫：\n十字架真的拆毀了牆，\n基督真的使仇敵成為家人。\n\n法律說：你們可以結婚；\n福音說：你們本來就是一家；\n文化說：要保持距離；\n基督說：我已經把距離釘在十字架上了。\n\n你心裡，有沒有一道還沒拆掉的牆？\n當你的孩子帶回一個不同膚色、不同文化、卻同樣愛主的人，\n你會怎麼迎接他？\n\n願教會成為世上最不在乎膚色、\n卻最在乎基督的地方；\n願每一個在主裡相愛的家庭，\n無論長得多不一樣，\n都能自在地站在一起，\n像一首由各種聲部合成的詩歌，\n向世界唱出：\n祂所成就的合一，比任何牆都更堅固。\n\n#婚姻 #跨種族婚姻 #福音的合一 #以弗所書2章 #種族和好"}, "if-love-is-god-love-will-fail": {"zh": "若愛成了神，愛必失敗", "tags": ["福音與奧祕"], "core": "浪漫的愛是神普遍恩典中的好禮物，但聖經的愛是捨己的、出於聖靈；神就是愛，所以要從祂那裡汲取愛。", "sum": ["作者曾害怕墜入愛河，以為結婚就「到站」了，婚後才發現自己不懂真正的愛。", "浪漫之愛自然而生，是普遍恩典；聖經之愛違反天性，需要聖靈在我們裡面動工。", "聖經之愛的核心是死：婚禮誓言是愛的「死刑判決」——在每個季節為對方向自己死。", "路易斯說：多數人說「神是愛」，其實是指「愛是神」；基督徒的意思是愛的活動永遠在神裡面運行。", "婚姻是神顯明並傳遞這更深之愛的方法；浪漫不是婚姻的最高峰。"], "mm": {"c": "兩種愛", "b": [["浪漫之愛", ["自然而生", "普遍恩典"]], ["聖經之愛", ["捨己", "聖靈工作"]], ["神就是愛", ["不是愛是神", "路易斯的提醒"]], ["婚姻的目的", ["學習真愛", "成為愛的管道"]]]}, "fw": {"q": "浪漫的愛足以支撐婚姻嗎？", "a": "不夠，需要從神而來的捨己之愛", "steps": ["分辨浪漫之愛與聖經之愛", "明白誓言是向自己死", "親近神，讓祂的愛「感染」我們"], "do": ["今天為配偶的喜樂放下一件自己想要的事", "求聖靈在你裡面生出捨己的愛"]}, "gold": ["婚禮誓言，是一份愛的死刑判決。", "真愛不只建立在感覺上，而建立在永恆的真理上。", "把愛當成神，愛就會失敗；從神領受愛，愛才會長存。"], "ref": ["約翰一書 4:8", "西番雅書 3:17"], "fb": "婚禮那天，她以為自己終於「到了」。\n她曾經很怕談戀愛，怕把心交出去，怕受傷。\n後來她鼓起勇氣，愛上一個敬虔的人，也走進了婚姻。\n她以為，最難的關卡已經過了。\n\n婚後她才發現：原來，她只學會了「墜入愛河」，\n卻還不懂得什麼叫「去愛」。\n\n世上有兩種愛，很容易被混為一談。\n一種是浪漫的愛：心跳、思念、想靠近。\n它自然地發生，像春天的花，不必學就會開。\n它是神普遍恩典裡美好的禮物，也很適合長成婚姻。\n\n另一種是聖經說的愛：捨己、守約、願意為對方的好而付代價。\n它不會自然發生，因為它違反我們的天性；\n除非神在我們裡面動工，否則沒有人能這樣愛。\n\n浪漫的愛說：「你讓我好快樂。」\n聖經的愛說：「我願意讓你在神裡面快樂，就算我要付出代價。」\n浪漫的愛靠感覺點燃，\n聖經的愛靠真理燒得長久。\n\n婚禮的誓言，其實是一份愛的「死刑判決」：\n在每一個季節，我都要向自己死，\n不惜一切守住這個約，\n為了你在耶穌裡的喜樂。\n\n這聽起來很沉重，卻正是福音的形狀。\n神的愛的中心，就是死——\n祂在有一千個理由離開我們的時候，選擇了為我們死。\n\n很多人說「神是愛」，其實心裡想的是「愛是神」。\n當愛成了神，我們就會要求愛給出它給不起的東西：\n永遠的心動、永遠的滿足、永遠不會讓人失望的對方。\n而當愛做不到時，我們就說：愛消失了。\n\n若愛成了神，愛必失敗；\n若神就是愛，愛才有源頭。\n因為真正能持續捨己的愛，不是從我們裡面生出來的，\n而是從那位本身就是愛的神，一點一點流進我們裡面。\n\n所以，婚姻最美的高峰，不是浪漫，\n而是兩個人一起靠近那愛的源頭，\n被祂感染，被祂改變，\n然後在彼此身上，活出一點點天上的愛。\n\n你心中，是把愛當成神，還是讓神成為你的愛？\n當感覺退去時，你有沒有一個比感覺更深的地方可以站立？\n\n願你的婚姻有浪漫，\n更有那份越過浪漫、仍然願意的愛。\n那份愛，不怕感覺變淡，\n因為它從來就不是靠感覺活著——\n它靠的是十字架，\n和那位永遠不會不愛我們的神。\n\n#婚姻 #愛 #浪漫與捨己 #約翰一書 #神就是愛"}, "letter-to-a-friend-engaged-to-a-nonbeliever": {"zh": "寫給與非信徒訂婚的朋友", "tags": ["婚前與擇偶"], "core": "一封懇切的信：嫁給非信徒是得罪神；別用「別人也這樣」「他人很好」「給他機會」「我會孤單一生」來合理化。", "sum": ["作者驚訝朋友與非信徒訂婚，出於愛不得不說話。", "「別人也這樣」：作者自己的妻子也曾與未信的他交往，雖蒙神恩，但那是例外，不是榜樣。", "「他是好人」：屬世標準的好，不等於在神面前的地位；別只和過去更差的對象比較。", "「給他機會」：心是詭詐的；沒有屬靈中立；若他現在對基督沒興趣，婚後憑什麼會改變？", "「我會孤單一生」：比單身更糟的，是一輩子獨自上教會，並想到所愛的人可能永遠與神隔絕。"], "mm": {"c": "四個藉口", "b": [["別人也這樣", ["例外不是榜樣", "與智慧人同行"]], ["他是好人", ["屬世的好", "別橫向比較"]], ["給他機會", ["心是詭詐的", "沒有中立"]], ["會孤單", ["獨自上教會", "永恆的分離"]]]}, "fw": {"q": "與不信主的人訂婚，該怎麼辦？", "a": "重新考慮，因為這是得罪神的決定", "steps": ["面對自己內心的保留", "逐一檢視合理化的藉口", "以順服神為最優先"], "do": ["誠實與屬靈長輩談談", "重讀哥林多前書7:39"]}, "gold": ["神在別人身上的恩典，不是給你的承諾。", "若他現在對基督沒興趣，婚後為何會改變？", "比獨自上教會更痛的，是想到他可能永遠與神分離。"], "ref": ["哥林多前書 7:39", "耶利米書 17:9", "馬太福音 12:30"], "fb": "親愛的朋友：\n\n聽到妳訂婚的消息，我很想毫無保留地為妳高興。\n可是，我心裡有一個放不下的擔心：妳的未婚夫，還不認識基督。\n因為我在乎妳，所以我選擇現在說，而不是之後才說。\n\n我知道，妳心裡可能也有一點不安。\n請不要急著把那份不安壓下去。\n\n我聽過很多人用這幾句話說服自己。\n\n「別人也是這樣，後來對方信主了啊。」\n是的，神有時會行這樣的恩典。\n可是神在別人身上的恩典，不是給妳的承諾；\n例外，不是榜樣。\n而且，我聽過更多結局不是那樣的故事。\n\n「他人真的很好。」\n我相信。他尊重妳、體貼妳，比妳上一任好太多。\n可是，比較的對象不該是過去的錯誤，而是神的心意。\n他的好，是在人面前的好；\n婚姻需要的，是兩個人一起站在神面前。\n如果他不和妳一樣被基督吸引，你們的誓言，就會一直站在一塊不平穩的地上。\n\n「再給他一點時間，他最近對信仰比較有興趣了。」\n人心比萬物都詭詐，蝴蝶在胃裡飛的聲音，常常比聖靈的聲音大。\n沒有所謂「靈性上的中立」；不與主相合的，就是與主相敵。\n如果他現在對基督沒興趣，為什麼會在婚後忽然改變？\n\n「我怕我會一個人到老。」\n我懂。看著別人一對對走進禮堂，心裡真的會酸。\n可是，請想像另一種孤單：\n妳每週一個人坐在教會裡，丈夫在家；\n妳為孩子禱告時，身邊沒有人一起說阿們；\n更讓人心痛的，是想到那個妳把一生交給他的人，\n可能永遠與神隔絕。\n\n單身的孤單，是一段路；\n不同心的孤單，是一輩子。\n等待很痛，但等待有盼望；\n將就很快，但將就要用一生償還。\n\n我不是要妳立刻做什麼決定，\n只是求妳停下來，把這段關係帶到神面前，\n也帶到一兩位真正愛妳的屬靈長輩面前。\n聖經說「只是要嫁這在主裡面的人」，\n這不是要奪走妳的幸福，\n而是要保護妳的幸福。\n\n無論妳最後怎麼決定，我都會繼續愛妳、為妳禱告。\n只是，此刻我想做那個拉住妳衣角的朋友，\n輕輕地說：親愛的，再想一想，好嗎？\n\n#單身 #擇偶 #在主裡嫁娶 #不同負一軛 #屬靈友誼"}, "child-of-divorce-do-not-fear-marriage": {"zh": "離婚家庭的孩子，不要懼怕婚姻", "tags": ["婚前與擇偶", "離婚"], "core": "來自離婚家庭的人不受統計數字擺佈：你首要的身分是神的兒女，不必重蹈父母的罪，主是你的倚靠。", "sum": ["作者交往一個月時父母分居，後來談到婚姻時非常恐懼：我還能信任人嗎？我的婚姻也會失敗嗎？", "「離婚家庭的孩子」不是你最深的身分；在基督裡，你是神的兒女，被重價買來。", "你不必受父母罪的捆綁：神不因父母的罪懲罰兒女；福音改變生命的軌跡。", "神不保證婚姻不受傷，但「耶和華是你所倚靠的」（箴言3:26）讓她內心安靜下來。", "父母分開讓她失去地上的安全感，但基督永不離棄，是信任永恆的安歇之處。"], "mm": {"c": "不要懼怕婚姻", "b": [["恐懼", ["還能信任嗎", "會重蹈覆轍嗎"]], ["新身分", ["神的兒女", "重價買來"]], ["不受捆綁", ["不擔父母的罪", "福音改變軌跡"]], ["倚靠", ["耶和華是倚靠", "基督不離棄"]]]}, "fw": {"q": "來自破碎家庭，如何面對婚姻的恐懼？", "a": "在基督裡找到身分與倚靠", "steps": ["承認自己的恐懼", "以神的兒女為首要身分", "把信心放在不離棄的主身上"], "do": ["默想箴言3:25-26", "與未來的配偶坦誠分享你的擔心"]}, "gold": ["你可能帶著傷疤，但不必帶著毒。", "統計數字不能決定你的故事。", "主是你的倚靠，你不再是孤單的。"], "ref": ["約翰福音 1:12-13", "以西結書 18:20", "箴言 3:25-26", "哥林多後書 5:17"], "fb": "她交往才一個月，父母就分居了。\n後來，男友開始談到婚姻，她卻嚇壞了。\n我還能信任任何人嗎？\n我知道什麼是健康、長久的婚姻嗎？\n如果我的婚姻，也走上和爸媽一樣的路呢？\n\n來自離婚家庭的人，對婚姻的恐懼，常常比別人更深。\n那份恐懼會在自己站到「父母跌倒的地方」時，達到最高點。\n\n可是，親愛的，你不屬於統計數字。\n\n第一，「離婚家庭的孩子」不是你最深的身分。\n如果你屬於基督，你最深的名字，是「神的兒女」。\n你不是一段失敗婚姻的副產品，不是一件有瑕疵的商品；\n你是神甘心樂意、用重價買回來的人。\n比血緣更濃的，是基督的血。\n\n第二，你不必重演父母的罪。\n外遇、背叛、遺棄、暴力、自私——\n那些也許在你身上留下了傷疤，\n但不必在你身上留下毒。\n神不會因父母的罪懲罰兒女；\n在基督裡，沒有任何一種「家族的罪」，對你有不可擺脫的拉力。\n也許有人曾經冷冷地對你說：「你以後一定會跟你爸一樣。」\n可是福音說：若有人在基督裡，他就是新造的人。\n因著恩典，你可以重寫你的故事。\n\n第三，主是你的倚靠。\n神沒有保證婚姻不會受傷；\n祂沒有說「只要你什麼都做對，就給你一個打不破的婚姻」。\n你仍可能失望，仍可能心碎。\n但箴言說：忽然來的驚恐，不要害怕；因為耶和華是你所倚靠的。\n你的安全感，不必建立在婚姻永不出錯上，\n而是建立在那位永不離棄你的主身上。\n\n第四，基督永遠不會離開你。\n父母分開那天，你失去了許多地上的安全感，\n像有人拿電鋸，把你的心和你的家從中間鋸開。\n可是有一個地方，永遠不會被鋸開——\n那位應許「我總不撇下你，也不丟棄你」的主。\n\n恐懼說：你注定重蹈覆轍；\n恩典說：你可以開始新的故事。\n傷疤說：你曾經被拋下；\n福音說：你已經被收納。\n\n如果你正站在婚姻的岸邊，雙腳發抖，\n我不會說「別怕」——怕是正常的。\n我只想說：你不是一個人走進去。\n那位帶你走過父母離婚的主，\n也會牽著你，走進你自己的婚姻，\n並且，陪你走到最後。\n\n#離婚家庭 #婚前恐懼 #神的兒女 #新造的人 #倚靠"}, "does-god-tell-us-who-to-marry": {"zh": "神會告訴我們該和誰結婚嗎？", "tags": ["婚前與擇偶"], "core": "神並不事先確切啟示我們要和誰結婚；祂藉著聖經與祂的兒子說話，並給我們在祂旨意中選擇的自由。", "sum": ["作者不認為神會事先確切告訴你和誰結婚；若誤以為有，可能導致信心危機或錯過其他好對象。", "神確實說話：從前藉先知，末世藉祂的兒子（希伯來書1:1-2）。", "我們不是先知；舊約先知的信息主要是給神百姓的，不是預告個人生活。", "聖經中只有兩次神指定婚姻：何西阿與約瑟，兩者都為了救贖計畫，不是常態。", "把自己的想法當作神的話，是把自己看得太高、把神看得太低；神給我們在信仰與聖潔範圍內選擇的自由。"], "mm": {"c": "神如何引導婚姻", "b": [["誤解", ["神會告訴我", "可能信心危機"]], ["神如何說話", ["先知", "祂的兒子"]], ["聖經例外", ["何西阿", "約瑟"]], ["選擇的自由", ["只在主裡", "遵行聖經"]]]}, "fw": {"q": "我感覺神告訴我要嫁娶某人，可信嗎？", "a": "要謹慎，神主要藉聖經引導，並給我們自由", "steps": ["回到神已說的話——聖經", "辨別自己的感覺與神的啟示", "在聖經原則內自由而智慧地選擇"], "do": ["以聖經標準評估交往對象", "不要因「感覺」而拒絕其他敬虔的人"]}, "gold": ["把自己的想法當作神的話，是把自己看太高、把神看太低。", "神已經在祂兒子裡說得夠清楚了。", "在聖經界線內，神給我們選擇的自由。"], "ref": ["希伯來書 1:1-2", "何西阿書 1:2", "馬太福音 1:20-21", "哥林多前書 7:39"], "fb": "「我禱告的時候，神告訴我，他就是我未來的丈夫。」\n她說得很篤定。\n兩年後，那個人和別人結婚了。\n她的信心，碎了一地。\n\n神會事先告訴我們，要和誰結婚嗎？\n很多人希望答案是「會」，因為那樣比較安心。\n可是，如果我們把自己的感覺當成神的聲音，\n可能會帶來三個風險：\n當事情沒有照著發生時，信心會受重創；\n我們可能因此拒絕了其他敬虔的對象；\n更深的是，我們對神的認識，會變得太小。\n\n神當然會說話。\n希伯來書說：神從前藉著先知多次多方地曉諭列祖，\n就在這末世，藉著祂兒子曉諭我們。\n神說話，而且說得很清楚——在祂的兒子裡，在祂的話語裡。\n\n可是我們不是先知。\n舊約那些先知，主要是替神向百姓傳話，\n不是領取一份份個人生活的預告。\n聖經裡，神直接指定某人和誰結婚，屈指可數；\n而每一次，都是為了祂救贖的大計畫，不是為了滿足個人的不安。\n\n我們以為，聽見「神說他就是那個人」，是信心大；\n其實，把自己心裡的聲音當成神的聲音，常常是把自己看得太高，把神看得太低。\n我們以為，神沒有指定，就是沒有帶領；\n其實，神早已在祂的話語裡畫好了界線，然後給了我們自由。\n\n那條界線是什麼？\n只在主裡嫁娶；\n找一個愛主、行在聖潔中、和你一起朝向基督的人。\n在這個範圍裡，你可以運用智慧、聽取勸告、誠實禱告，然後——選擇。\n\n這不是比較不屬靈的方式，\n而是一種更深的信靠：\n我信任神的話足夠清楚，\n我也信任祂的主權足夠大，\n大到連我在自由中做的選擇，都在祂美好的計畫裡。\n\n你是否在等一個「神的訊號」，才敢往前一步？\n你是否因為一個「感覺」，錯過了一個真正敬虔的人？\n\n親愛的，不必害怕選錯，\n因為神不是一個躲在雲裡出謎題的神，\n祂已經在祂兒子裡，把最重要的話說完了。\n帶著祂的話，帶著群體的智慧，帶著一顆謙卑的心，\n去做選擇吧。\n\n然後，當你站在婚禮的祭壇前回頭看，\n你會發現：神沒有在天上大聲指名，\n卻一直在你身邊，安靜地帶領著每一步。\n\n#擇偶 #神的旨意 #單身 #聖經 #屬靈分辨"}, "jesus-will-lead-you-through-the-valley": {"zh": "耶穌會帶你走過幽谷", "tags": ["苦難與死亡", "給丈夫"], "core": "妻子陷入憂鬱的黑暗時，丈夫無法用話語修好她，卻能帶領她走過：天天以言行傳福音，並奔向十架領受恩典。", "sum": ["看著妻子陷入憂鬱，丈夫感到悲傷、痛苦、恐懼和挫折：你一個人無法滿足她。", "沒有魔杖；連福音此刻在她耳中也可能顯得遙遠。", "但不要灰心：每天用思想、言語、行為向她傳福音；疲憊時就奔向十架。", "你無法說服她離開黑暗，但可以帶領她走過：讓她躲在你身後一同爭戰。", "當她沒有盼望、喜樂、平安時，你在基督裡擁有並向她顯明；你失敗時，神的恩典也屬於你。"], "mm": {"c": "陪妻子走幽谷", "b": [["丈夫的感受", ["悲傷痛苦", "恐懼挫折"]], ["沒有捷徑", ["沒有魔杖", "福音也顯得遙遠"]], ["帶領她", ["天天傳福音", "背起十架"]], ["倚靠基督", ["顯出盼望平安", "恩典也為你"]]]}, "fw": {"q": "妻子憂鬱時丈夫能做什麼？", "a": "無法修好她，但能在基督裡帶領她走過", "steps": ["放下「找到正確話語」的壓力", "以言行持續顯明基督", "疲憊時奔向十架領受恩典"], "do": ["每天為她做一件具體的服事", "尋求專業與教會的支持"]}, "gold": ["你無法把她說出黑暗，但可以帶她走過黑暗。", "她沒有盼望時，你在基督裡為她持守盼望。", "你越向妻子彰顯基督，基督越向你顯明自己。"], "ref": ["哥林多後書 12:9", "以弗所書 5:25-27", "詩篇 88", "希伯來書 6:19"], "fb": "她已經三天沒有拉開窗簾了。\n他下班回家，看見她坐在沙發角落，眼神空空的。\n他想說些什麼，想找到一句能讓她好起來的話；\n可是他說了很多次「會好的」，她只是更沉默。\n\n看著自己最愛的人，墜入一個你搆不到的黑洞，\n那是一種很特別的痛。\n悲傷，因為她在受苦；\n疼痛，因為她是你身上的一部分；\n恐懼，因為不知道這片黑暗有沒有盡頭；\n挫折，因為你發現，自己一個人，怎麼樣都不夠。\n\n很多丈夫以為：只要我說對了話，她就能走出來。\n可是，沒有魔法棒，沒有銀子彈。\n此刻，甚至連最美好的福音，聽在她耳裡，都可能像一段遙遠的夢。\n\n我們以為，愛她就是要把她拉出來；\n其實，有時候愛她，是陪她走過去。\n我們以為，要先有答案，才能給她盼望；\n其實，你可以在沒有答案的時候，替她握著盼望。\n\n你沒辦法用話語把她帶離黑暗，\n但你可以走在前面，讓她跟在你身後。\n這就是丈夫被呼召的帶領——\n不是站在高處喊她上來，而是走進幽谷，牽著她一步步往前。\n\n當她沒有盼望，你在基督裡為她持守盼望；\n當她不配得憐憫，你在基督裡給她憐憫——因為你也不配；\n當她找不到喜樂，你在基督裡讓她看見一點點光；\n當她只剩不安，你把基督的平安帶進那個房間；\n當她只剩苦澀，你先開口感恩；\n當她沒有力氣對抗罪，你為她禱告、替她守望；\n當她在痛苦裡，你成為那位安慰者在地上的手。\n\n可是，你也會累，也會失敗。\n有時你會不耐煩，有時你會想逃。\n那時候，請記得：神的恩典，不只是給她的，也是給你的。\n祂的能力，正是在你最軟弱的時候，顯得最完全。\n\n當床邊那個人，好像變成了陌生人；\n當你覺得自己孤單得不得了；\n緊緊抓住十字架。\n那裡站著你的避難所、你的磐石、你的拯救者。\n\n你越在她面前顯出基督，\n基督就越在你面前顯明祂自己。\n\n這條幽谷也許很長，\n但你們不是兩個人在走，\n是三個人。\n走在最前面的那一位，曾經親自走過死蔭的幽谷，\n而且，祂走出來了。\n\n#婚姻 #憂鬱 #陪伴 #丈夫 #死蔭幽谷"}, "six-ways-to-pursue-spiritual-intimacy-in-marriage": {"zh": "追求婚姻屬靈親密的六種方式", "tags": ["溝通與親密"], "core": "屬靈親密難以維持是正常的，因為墮落破壞了合一；但我們可以敞開心、更愛耶穌、除去障礙，邁向神設計的親密。", "sum": ["作者夫妻事工興旺、彼此相愛，卻從未一起讀經禱告，讓他覺得自己很失敗。", "婚姻是福音的圖畫；越有屬靈親密，越能向世界見證神的愛。", "家庭背景、孩子、責任、社群媒體、撒但的攻擊，以及墮落後的躲藏與推卸，都阻礙親密。", "若你覺得很難，你完全正常：你渴望神所造的合一，但墮落世界還無法完全實現。", "方法：保持敞開的心、追求耶穌勝過婚姻、替換掉扼殺親密的習慣……"], "mm": {"c": "屬靈親密", "b": [["困境", ["不一起讀經禱告", "感到失敗"]], ["障礙", ["忙碌與背景", "墮落與撒但"]], ["安慰", ["困難是正常的", "渴望合一"]], ["方法", ["敞開心", "更愛耶穌", "除去障礙"]]]}, "fw": {"q": "夫妻如何培養屬靈親密？", "a": "先在基督裡滿足，再邀請配偶一同前行", "steps": ["承認困難並向神傾訴", "以耶穌為最大的滿足", "找出並替換扼殺親密的習慣"], "do": ["從每晚一起禱告兩分鐘開始", "分享本週神在你身上的一件工作"]}, "gold": ["若你覺得與配偶屬靈連結很難，你完全正常。", "要讓婚姻榮耀神，就得在神裡面比在婚姻裡更滿足。", "即使配偶不改變，你仍能對基督保持柔軟。"], "ref": ["以弗所書 5:31-32", "創世記 3:7-12", "腓立比書 3:8"], "fb": "他在教會很受歡迎，事工也很興旺。\n夫妻感情不錯，兩人也都愛主。\n可是有一個秘密，他從沒對人說過：\n他們從來沒有一起讀經，也很少一起禱告。\n在神的事情上，他們好像各自住在不同的房間。\n他心裡一直有個聲音：我是不是很失敗？我們是不是哪裡有問題？\n\n如果你也有這樣的感覺，先聽一句安慰的話：\n你很正常。\n\n為什麼和配偶有屬靈的親密，這麼難？\n原生家庭也許從沒示範過；\n孩子和責任吸乾了力氣；\n社群媒體讓我們以為別人的婚姻都很屬靈；\n還有一位敵人，像吼叫的獅子，專門想讓夫妻在靈裡疏遠。\n更深的原因是：從伊甸園開始，人就學會了躲藏——\n躲在無花果葉後面，躲在「都是她害的」後面。\n\n可是，這份困難裡，藏著一個好消息：\n你之所以渴望靈裡的合一，是因為神本來就是這樣造你們的。\n那份渴望不是錯，而是你們還在一個墮落的世界，還沒完全回家。\n\n那麼，可以從哪裡開始？\n\n保持心門敞開。\n當你們一直無法靈裡交流，最容易的反應是關上心門、不再期待。\n不如把失望帶到神面前，誠實地向祂哭訴。\n就算對方暫時沒有改變，你仍能保持一顆柔軟、向基督敞開的心。\n\n追求耶穌，勝過追求婚姻。\n很矛盾，卻很真實：當你更愛主，你會變成配偶更想靠近的人。\n要讓婚姻榮耀神，就要在神裡面，比在婚姻裡更滿足。\n\n找出扼殺親密的習慣，換掉它。\n也許是壓力一大就封閉自己，也許是一開口就批評，也許是睡前一定要滑手機。\n每個人都有自己的「小狐狸」，找到它，就能少一點破壞。\n\n世界說：先把婚姻經營好，再來談屬靈；\n福音說：先被基督滿足，婚姻才有源頭。\n世界說：你要讓對方改變；\n福音說：你先讓神改變你。\n\n今晚，不必一下子開始一小時的家庭靈修。\n也許只要兩分鐘——\n牽著手，說一句：「主啊，謝謝你今天還讓我們在一起。」\n或是一句：「我最近在讀這段經文，我想和你分享。」\n\n靈裡的親密，很少是一夜之間長出來的；\n它像一株植物，需要每天一點點的水。\n今天，就是第一杯水。\n\n#婚姻 #屬靈親密 #夫妻禱告 #一起讀經 #在基督裡滿足"}, "did-you-marry-the-one": {"zh": "你娶／嫁的是「對的人」嗎？", "tags": ["婚前與擇偶", "離婚"], "core": "「對的人」的觀念隱含「錯的人」，會傷害婚姻；其實你所娶所嫁的那一位，就是「對的人」。", "sum": ["若有「對的人」，就可能有「錯的人」；婚後這個想法可能摧毀婚姻。", "若以為可能選錯，就不會懷著盼望全力面對困難，甚至想離婚重新尋找。", "浪漫喜劇常讓觀眾在90分鐘內從反對外遇變成為外遇歡呼。", "婚姻是對一個有缺點的人的委身；而我們自己也是「錯的人」。", "交往時找一個在成聖路上的人；一旦立約，你就娶／嫁了「對的人」。"], "mm": {"c": "對的人？", "b": [["迷思", ["有對就有錯", "婚後的危險"]], ["文化影響", ["浪漫喜劇", "為外遇歡呼"]], ["真相", ["委身有缺點的人", "我也是錯的人"]], ["結論", ["結婚的那位就是對的人", "成聖的軌跡"]]]}, "fw": {"q": "婚後懷疑自己嫁錯／娶錯了怎麼辦？", "a": "你所立約的那位，就是對的人", "steps": ["識破「錯的人」的迷思", "承認自己也是有缺點的人", "以委身代替比較與懷疑"], "do": ["留意影視中對外遇的美化", "為配偶的成聖與你們的婚姻禱告"]}, "gold": ["結婚之後，就不存在「錯的人」。", "兩個「錯的人」彼此委身，正是婚姻的榮耀。", "你所嫁娶的那一位，就是對的人。"], "ref": ["以弗所書 5:25", "羅馬書 3:23", "馬太福音 19:4-6"], "fb": "電影裡常有這樣的劇情：\n男主角已經有了伴侶，卻遇見了「真正命中注定的那個人」。\n一開始，你不希望他們在一起；\n九十分鐘後，你卻為他們拋下原本的承諾而鼓掌。\n\n這種劇情之所以成立，是因為一個前提：\n世上有一個「對的人」，所以也就有一個「錯的人」。\n\n聽起來很浪漫，對吧？\n在交往階段，這個想法似乎還有點幫助——讓人謹慎選擇。\n可是一旦結了婚，它就變成了一顆不定時炸彈。\n\n如果我可能娶錯人，那麼遇到困難時，我為什麼要拚命？\n如果他可能不是對的那一個，為什麼不離開，重新去找？\n很多破碎的婚姻背後，都站著這個陰影：「也許我選錯了。」\n\n其實，婚後根本不存在「錯的人」。\n\n你所嫁娶的那一位，就是「對的那一位」。\n不是因為他完美，\n而是因為婚姻本身就宣告了：從今以後，我選擇你。\n\n婚姻，就是對一個有缺點的人許下承諾。\n不是假裝看不見缺點，而是看見了，仍然委身。\n更重要的是：別忘了，你自己也是一個「錯的人」。\n聖經說，世人都犯了罪，虧缺了神的榮耀。\n\n兩個「錯的人」，彼此委身，\n這正是婚姻的榮耀所在。\n如果對方完美無缺，委身有什麼了不起？\n\n我們以為，幸福的婚姻是找到對的人；\n其實，幸福的婚姻是持續成為對的人。\n我們以為，問題出在「選錯」；\n其實，問題常常出在「不願繼續選」。\n\n那麼，還沒結婚的人該怎麼辦？\n不要找「命中注定」，而是找一個正在成聖路上的人——\n他愛主、願意悔改、正在一點一點變得更像基督。\n然後，在神與眾人面前立約。\n恭喜你，從那天起，你就娶了／嫁了「對的人」。\n\n已經結婚的你呢？\n恭喜你，你也已經和「對的人」在一起了。\n當路變得顛簸，請記得：\n世上最好的婚姻，也是兩個需要被救贖的人，\n連同他們的關係，一起被救贖。\n而耶穌來，正是為了這件事。\n\n今晚看著身邊的那個人，\n別再問「他是不是對的人」，\n而是問：「我今天，願不願意再選他一次？」\n\n#婚姻 #對的人 #委身 #承諾 #婚前"}, "men-intimacy-begins-with-good-listening": {"zh": "弟兄們，親密從好好聆聽開始", "tags": ["溝通與親密", "給丈夫"], "core": "情感上的親密就是「被認識」；要維持它，丈夫需要不分心、以理解而非解決為目的地聆聽。", "sum": ["婚姻的親密不只是性；最讓妻子感到連結的，常是情感上的親密。", "聖經用「認識」描述親密：是對整個人——心思、頭腦與靈魂——的體驗式認識。", "交往初期這種認識自然發生，日久熟悉後就需要努力；關鍵是好的溝通，尤其是好的聆聽。", "好的聆聽是不分心：放下手機、關掉電視；若無法專心，就約好稍後再談。", "好的聆聽是為了理解而不是修理：男人常急著給解答或為自己辯護；兩個重要時機是對方分享感興趣的事，以及衝突時。"], "mm": {"c": "聆聽與親密", "b": [["情感親密", ["被認識", "心思與靈魂"]], ["不分心", ["放下手機", "約好時間"]], ["為理解而聽", ["不急著修理", "不急著辯護"]], ["兩個時機", ["分享生活", "面對衝突"]]]}, "fw": {"q": "丈夫如何加深與妻子的情感親密？", "a": "透過專注、以理解為目的的聆聽", "steps": ["放下干擾，全心在場", "聽懂她的經歷與感受", "在衝突中忍住修理與辯護的衝動"], "do": ["今晚問她：今天最在意的一件事是什麼？只聽不給建議", "聽完後用自己的話複述她的感受"]}, "gold": ["好的聆聽，是以對方的益處為念，而非自己的。", "邊滑手機邊聽，等於說「你沒有這些事重要」。", "她要的常常不是解答，而是被理解。"], "ref": ["雅各書 1:19", "箴言 18:13", "阿摩司書 3:2"], "fb": "她說：「今天公司發生一件事……」\n他一邊回訊息，一邊說：「嗯嗯，然後呢？」\n她講到一半，他打斷：「妳就直接跟主管說啊。」\n她停下來，不說了。\n他困惑：我不是給了很好的建議嗎？\n\n弟兄們，很多時候，她要的不是答案。\n她要的是被認識。\n\n親密不只是性。\n對很多妻子來說，最讓她感到和丈夫相連的，是情感上的親密——\n一種「被你看見、被你懂」的感覺。\n聖經常用「認識」來形容夫妻的親密，\n因為真正的親密，是對一個人全心、全思、全魂的認識。\n\n交往的時候，這種認識很自然地發生：\n你想知道她喜歡什麼、害怕什麼、昨天做了什麼夢。\n結婚久了，熟悉感慢慢取代了好奇心，\n你以為自己早就懂她了，於是不再問、不再聽。\n\n怎麼重新點燃？\n關鍵是好的溝通，而好的溝通，關鍵是好的聆聽。\n雅各說：要快快地聽，慢慢地說。\n箴言說：未曾聽完先回答的，便是他的愚昧和羞辱。\n\n什麼是好的聆聽？\n\n第一，不分心地聽。\n手機在手上、電視開著、腦子裡還在想待辦清單——\n就算你是世界上最會一心多用的人，對她來說，傳達的訊息只有一個：\n「這些事，比妳重要。」\n放下它、關掉它、擱在一邊。\n如果真的走不開，就誠實地說：「我現在沒辦法專心，晚一點好好聽妳說，好嗎？」\n\n第二，為了理解而聽，不是為了修理而聽。\n男人特別容易卡在這裡。\n我們聽的時候，常常只是在等自己說話的機會；\n或者急著提供解決方法，好讓話題快點結束；\n或者聽到一半，就開始替自己辯護。\n可是好的聆聽，是以對方的益處為念，而不是自己的。\n\n兩個時刻特別需要好的聆聽：\n當她想分享她在乎的事——那是一次邀請，邀請你認識她；\n當你們發生衝突——那時要同時忍住兩個衝動：急著修理，和急著辯護。\n\n修理讓問題結束，聆聽讓人被接住；\n建議讓你顯得能幹，理解讓她感到被愛。\n\n今晚，試試看：\n問她一個問題，然後只是聽。\n不給建議，不轉移話題，不看手機。\n聽完以後，用你自己的話說：「所以妳今天其實很委屈，對嗎？」\n\n你會發現，有時候最深的親密，\n不是你說了什麼，\n而是你終於，好好地聽見了她。\n\n#婚姻 #聆聽 #丈夫 #情感親密 #溝通"}, "your-marriage-is-not-about-you": {"zh": "你的婚姻不是關於你", "tags": ["婚姻使命"], "core": "婚姻的核心是捨己而非自我滿足；當我們效法基督服事配偶，婚姻便散發福音的馨香。", "sum": ["人人都想上天堂卻不想死；許多人渴望婚姻，卻不願接受婚姻的全部。", "我們不知不覺相信婚姻是為了自我滿足，而不是自我犧牲。", "保羅在以弗所書5章描繪的是無私的結合：向自己死，才是婚姻引力的中心。", "要以配偶的需要為先：從晚上冷氣的溫度，到在性親密中的忍耐。", "滿足我們一切渴望是基督的工作，不是配偶的；因為基督已滿足我們，我們才能自由地付出。"], "mm": {"c": "捨己的婚姻", "b": [["常見迷思", ["婚姻為了我", "找到完美另一半"]], ["聖經圖畫", ["無私的結合", "向自己死"]], ["實踐", ["以對方為先", "日常服事"]], ["根源", ["基督滿足我們", "自由地付出"]]]}, "fw": {"q": "婚姻的重心應該是什麼？", "a": "效法基督的捨己服事", "steps": ["識破自我滿足的婚姻觀", "以配偶的需要為優先", "從基督得滿足，再自由付出"], "do": ["今天主動完成一件配偶在意的小事", "停止期待配偶滿足你所有的需要"]}, "gold": ["婚姻的門，是掛在基督般的犧牲上轉動的。", "滿足你一切渴望，是基督的工作，不是配偶的。", "當我們為配偶犧牲，婚姻就散發福音的香氣。"], "ref": ["以弗所書 5:22-32", "腓立比書 2:1-8", "馬可福音 10:43-45"], "fb": "有一句話說：人人都想上天堂，卻沒有人想死。\n婚姻也很像：人人都想要幸福的婚姻，卻很少人想要婚姻裡的「死」。\n\n我們看著電影裡完美的愛情，心裡想：\n我要找一個懂我、補足我、填滿我所有空缺的人。\n一個像遺失的拼圖、像另一半心臟的人。\n找到以後，我就會被滿足了。\n\n可是，當我們帶著這樣的期待走進婚姻，\n很快就會發現：對方不是拼圖，而是另一個需要被愛的人。\n\n我們以為，婚姻的重心是「我被滿足」；\n其實，婚姻的重心是「我為你捨己」。\n我們以為，婚姻會讓我們得到更多；\n其實，婚姻首先邀請我們放下更多。\n\n保羅描繪的婚姻，不是一個自私的聯盟，\n而是一個無私的結合。\n婚姻引力的中心，不是個人的滿足，而是向自己死。\n這句話聽起來很嚴肅，難怪我們很少聽到——\n因為它太難做到，也和我們的肉體、和娛樂圈的劇本完全相反。\n\n向自己死，具體長什麼樣子？\n小到晚上冷氣要開幾度，\n大到在親密關係裡，願意耐心等候對方的軟弱。\n小到幫他打一通保險公司的電話，\n大到在漫長的低谷裡，仍然選擇留下來。\n\n耶穌說：人子來，不是要受人的服事，乃是要服事人，並且要捨命。\n祂又說：凡要救自己生命的，必喪掉生命；凡為我喪掉生命的，必得著生命。\n婚姻那扇榮耀的門，就是掛在這種基督般的犧牲上轉動的。\n\n那麼，誰來滿足我呢？\n這正是福音最美的地方：\n滿足你一切渴望，是基督的工作，不是配偶的工作。\n當你知道基督已經完全地滿足了你，\n你就不必再向配偶討，而可以自由地給。\n\n向配偶討愛的人，永遠覺得不夠；\n從基督領受愛的人，才有多餘的愛可以給。\n要求對方填滿你的人，會讓婚姻變成債務；\n願意先為對方倒空的人，會讓婚姻變成禮物。\n\n你走進婚姻時，是帶著一個空杯子，等著被倒滿？\n還是帶著一壺已經被基督倒滿的水，準備倒給對方？\n\n當我們為配偶犧牲，\n婚姻就散發出福音甜美的香氣——\n讓世界聞到，\n也提醒我們自己：\n我們之所以能這樣愛，\n是因為有一位，先這樣愛了我們。\n\n#婚姻 #捨己 #以弗所書5章 #服事 #福音的香氣"}, "she-still-enchants-me": {"zh": "她依然令我著迷", "tags": ["給丈夫", "苦難與死亡"], "core": "作者在中年仍深愛妻子，而且比三十年前更愛；他公開讚美她，也鼓勵年輕人：最好的婚姻之愛在後頭。", "sum": ["作者在交往前三週就確知會娶她；吸引他的不只是外貌，而是她罕見的屬靈之美。", "近三十年來經歷學位、事工、五個孩子、許多喜樂與風暴，也失去了頭髮與年輕的身體。", "他們的愛如今既年輕又成熟：充滿淚水與歡笑、謙卑與恩典。", "他比三十年前更愛她；最吸引他的依然是她的靈魂。", "兩個理由公開讚美：敬畏神的婦人當受稱讚；也要告訴年輕人，經過高山深谷後，最好的愛在前頭。"], "mm": {"c": "中年之愛", "b": [["初遇", ["交往前就確知", "屬靈之美"]], ["歲月", ["喜樂與風暴", "失去青春"]], ["成熟的愛", ["年輕又成熟", "充滿恩典"]], ["公開讚美", ["敬畏神的婦人", "給年輕人盼望"]]]}, "fw": {"q": "婚姻之愛會隨年歲消退嗎？", "a": "不一定，它可以更豐富成熟", "steps": ["欣賞配偶的屬靈之美", "在苦難中一同經歷恩典", "持續公開與私下地讚美"], "do": ["當著孩子或朋友的面稱讚配偶", "寫下你們一起走過的高山與深谷"]}, "gold": ["我們的愛不再年輕，卻依然充滿青春的喜樂。", "最好的婚姻之愛，還在前頭。", "敬畏耶和華的婦人，當被她的丈夫公開稱讚。"], "ref": ["箴言 31:28-30", "傳道書 3:11"], "fb": "結婚快三十年了。\n他的頭髮少了，她的眼角有了細紋；\n兩個人的新陳代謝都變慢了，自信也少了一點。\n可是那天傍晚，她從車庫走向家門，\n他從窗戶看見她，心跳竟然和十九歲時一樣快。\n\n我們的文化很會歌頌初戀：心跳、悸動、眼神相遇的那一秒。\n電影大多停在婚禮那一幕，\n好像那就是愛情的高峰，接下來只剩下坡。\n\n可是，有一種愛，是越老越動人的。\n\n年輕的愛像十五歲的少年，熱情、純真、天不怕地不怕；\n成熟的愛像三十歲的人，仍保有那份熱情，卻多了許多閱歷。\n三十歲的人回頭看十五歲的自己，會覺得可愛，\n但不會想拿現在的智慧，去換回當年的天真。\n\n成熟的愛，被眼淚醃過，被笑聲曬過，\n被供應和堅忍打磨過，\n被失敗、軟弱和「我真的需要神」的謙卑，深深地刻過。\n那是一種滿有恩典的愛——\n兩個人都知道：我其實配不上你，\n而神，對我們真是太憐憫了。\n\n我們以為，愛情會被時間沖淡；\n其實，被恩典浸泡過的愛情，會被時間釀深。\n我們以為，吸引力只在外表；\n其實，最讓人著迷的，是一個敬畏神的靈魂，越來越發光。\n\n箴言說：豔麗是虛假的，美容是虛浮的；惟敬畏耶和華的婦女，必得稱讚。\n她的丈夫也稱讚她。\n在一個把魅力和外貌當成女神的時代，\n一位丈夫公開讚美他敬虔的妻子，本身就是一種見證。\n\n如果你剛結婚，或還在等候婚姻，\n你也許聽過太多破碎的故事，\n看過太多只歌頌熱戀、卻很少描寫中年之愛的劇。\n讓我告訴你一個盼望：\n最好的婚姻之愛，在前頭。\n你可能要經過陡峭的高山、深深的山谷、泥濘的沼澤才到得了；\n路上你會懷疑、會動搖。\n但如果你信靠神、守住誓言，\n有一天你會發現——\n那個陪你走過一切的人，\n比當年第一眼看見她時，更讓你著迷。\n\n你今天，有好好看她一眼嗎？\n有沒有告訴她，你仍然被她吸引？\n\n願你們的愛，\n不是一朵開過就謝的花，\n而是一棵年年加上年輪的樹；\n越老，越穩；\n越久，越美。\n\n#婚姻 #中年之愛 #箴言31章 #讚美妻子 #愛情"}, "opposites-attract": {"zh": "異性相吸", "tags": ["衝突與修復"], "core": "夫妻性格南轅北轍時，離婚不是出路；所有婚姻共同的愛之語言是「捨己」。", "sum": ["作者結婚31年，夫妻常意見不合：她外向、他內向；他節儉、她愛分享與體驗。", "最大的差異是處理怒氣：她要說出來，他則沉默退縮，常造成吼叫與冷戰的惡性循環。", "他們仍堅決不離婚，原因是基督。", "離婚只會移除照出她驕傲的最大鏡子；沒有挑戰就沒有成長。", "在次要的事上「不同軛」不能成為分開的理由；所有婚姻的愛之語言是捨己。"], "mm": {"c": "南轅北轍", "b": [["差異", ["外向與內向", "花錢與節儉"]], ["最大挑戰", ["她要說", "他要沉默"]], ["為何不離婚", ["基督", "驕傲的鏡子"]], ["出路", ["不為次要爭吵", "愛之語言是捨己"]]]}, "fw": {"q": "夫妻個性差太多，該怎麼相處？", "a": "以捨己代替堅持己見", "steps": ["承認差異並非罪", "把衝突看成神照出驕傲的鏡子", "在次要的事上讓步、捨己"], "do": ["討論彼此處理怒氣的方式，約定暫停與再談", "這週在一件小事上順著對方的喜好"]}, "gold": ["移除了挑戰，也就移除了成長的機會。", "在次要的事上，我們沒有拆開彼此的權利。", "所有婚姻共同的愛之語言，是捨己。"], "ref": ["羅馬書 14:1", "哥林多後書 6:14", "馬太福音 11:30", "馬可福音 10:9"], "fb": "他喜歡早睡，她是夜貓子；\n他出門前一定要把路線查好，她說走到哪算到哪；\n他吃飯要準時，她肚子餓了才想到要吃。\n朋友笑他們：「你們到底怎麼走到一起的？」\n他們也常常問自己同樣的問題。\n\n交往時，這些差異很迷人——\n他覺得她好自由，她覺得他好可靠。\n婚後，同樣的差異變成了磨擦——\n他嫌她沒計畫，她嫌他太死板。\n\n最難的，往往不是生活習慣，而是處理情緒的方式。\n有人一生氣就想立刻說清楚，有人一生氣就需要先安靜；\n一個追，一個逃；一個越說越急，一個越躲越遠。\n吵到最兇的時候，「乾脆分開算了」這幾個字，甚至會顯得很有道理。\n\n可是，如果差異本身，不是問題，而是功課呢？\n\n我們以為，個性不合，就是婚姻失敗的理由；\n其實，個性不合，常常是神用來磨掉我們驕傲的砂紙。\n我們以為，離開能讓日子輕鬆；\n其實，離開的同時，也拿走了一面最能照出自己的鏡子。\n\n和一個跟自己很像的人生活，比較舒服，卻不一定讓人長大；\n和一個跟自己很不一樣的人生活，比較辛苦，卻逼著我們面對自己的自私。\n移除了挑戰，也就移除了成長。\n\n保羅說：信心軟弱的，你們要接納，但不要辯論所疑惑的事。\n如果神用婚姻來描繪基督與教會，\n我們怎麼能為了那些和救恩無關、只和自己的驕傲有關的事，去拆毀它？\n\n兩個信主的人，在最重要的事上是同負一軛的；\n只是在許多次要的事上，常常覺得像兩頭步伐不同的牛。\n可是，既然都已經負起基督那容易的軛，\n就不該為了習慣和喜好，把神配合的拆開。\n\n那麼，兩個南轅北轍的人，怎麼在同一個軛下走路？\n答案可能很簡單，也很難：捨己。\n我們常常在等對方先滿足自己的期待——\n等他先體貼，等她先讓步；\n卻忘了，基督沒有等我們先變好，才為我們捨命。\n\n要求對方像我，婚姻會越來越窄；\n願意為對方讓步，婚姻會越來越寬。\n\n你們家，最大的差異是什麼？\n你是想把對方改造成另一個你，\n還是願意在這些差異中，先學會捨己？\n\n異性相吸，很浪漫；\n異性相守，才是恩典。\n願你們在每一次摩擦裡，\n都更像基督一點，\n也更懂得，那個和你完全不同的人。\n\n#婚姻 #個性差異 #衝突 #捨己 #不同負一軛"}, "do-i-want-marriage-more-than-jesus": {"zh": "我渴望婚姻勝過耶穌嗎？", "tags": ["婚前與擇偶", "福音與奧祕"], "core": "婚姻是值得珍惜的禮物，但它只是天上之愛的照片；若緊抓照片而忽略本人，就失去真正的喜樂。", "sum": ["每個人都渴望被深深地愛；渴望婚姻一點也不錯。", "但婚姻最美好時，也只是天國的預嚐。", "比喻：朋友遠行前給你一張照片；他們回來時，你卻只抱著照片不見本人，那是荒謬的。", "把婚姻這張照片偶像化，高過它所代表的實體——成為基督的新婦，就會讓我們失去喜樂。", "要期待那場永不褪色的婚禮：羔羊的婚筵。"], "mm": {"c": "照片與本人", "b": [["正當渴望", ["渴望被愛", "婚姻是禮物"]], ["限度", ["只是預嚐", "不是終極滿足"]], ["照片比喻", ["抱著照片", "不見本人"]], ["真正的婚禮", ["羔羊婚筵", "永不褪色"]]]}, "fw": {"q": "單身時渴望婚姻，如何不讓它變成偶像？", "a": "把婚姻看成影子，把基督看成實體", "steps": ["肯定渴望婚姻是好的", "承認婚姻不能滿足最深的渴望", "把盼望放在與基督的永恆聯合"], "do": ["讀啟示錄19:6-9", "為你的渴望禱告，並說：主啊，你是我最大的喜樂"]}, "gold": ["婚姻是天上的一張照片，不是天上本身。", "把照片看得比本人重要，是荒謬的。", "最盛大的婚禮還在前頭，而且永不結束。"], "ref": ["啟示錄 19:6-9", "創世記 2:24", "以弗所書 5:31"], "fb": "冬天的夜裡，你站在一盞路燈下取暖。\n燈光很美，也真的有一點點溫度。\n可是如果有人告訴你：再往前走幾步，就是一個生著火的家，\n你會說「不用了，我站在路燈下就好」嗎？\n\n婚姻，就像那盞路燈。\n\n從小到大，我們都渴望被深深地愛。\n我們會想：那個人什麼時候出現？會長什麼樣子？我們的婚禮會是怎樣？\n單身越久，這些想像越常佔滿心思，渴望也越來越深。\n\n渴望婚姻一點也不錯。\n神清楚地說，婚姻是寶貴的，\n在祂的恩典中，它甚至能成為地上的一點天堂。\n\n可是，我們很容易忘記：\n婚姻再美，最好也只是天堂的一點預嚐；\n它是路燈，不是家。\n\n我們以為，找到那個人，就找到了一切；\n其實，那個人是一盞美麗的燈，照著通往那位新郎的路。\n我們以為，渴望婚姻和渴望耶穌是兩件事；\n其實，對婚姻最深的渴望，本來就是在渴望耶穌。\n\n當我們把婚姻放在耶穌之上，\n就像抱著路燈不肯走，\n最後不但凍僵了，還忘了燈本來是要帶我們回家的。\n\n路燈很珍貴，因為夜很黑；\n但路燈的意義，是指向那扇亮著的門。\n地上的婚姻很寶貴，因為我們還在路上；\n那天新郎來了，所有的燈，都會在晨光中圓滿地熄滅。\n\n啟示錄說：羔羊婚娶的時候到了，新婦也自己預備好了。\n凡被請赴羔羊婚筵的有福了。\n那是一場不會褪色、不會結束的婚禮，\n是我們被造來永遠享受的那一位。\n\n你現在的渴望，停在路燈下，還是朝著家走？\n如果婚姻遲遲沒有來，你會不會覺得，人生就不完整了？\n如果婚姻已經來了，你會不會不知不覺，把它放在神的位置上？\n\n親愛的，繼續渴望吧，\n這份渴望是神放在你心裡的。\n只是，別讓它停在燈下——\n讓它帶你走向那扇門，\n門外站著的，\n是那位一直在等你的新郎。\n\n#單身 #渴望婚姻 #羔羊婚筵 #偶像 #等候"}, "marriage-is-not-about-me": {"zh": "婚姻不是關於我", "tags": ["婚姻使命"], "core": "婚姻是神的恩賜，但不是迪士尼式的浪漫禮物；它是為了神的榮耀、他人的益處與神國的推進。", "sum": ["作者曾因害怕受傷而抗拒婚姻，後來憑信心走入婚姻。", "婚後幾年她懷疑婚姻是否真的是禮物，因為它常常不令人快樂。", "我們以浪漫和多愁善感的文化眼光看「禮物」；但神賜禮物的首要目的不是讓我們感覺好。", "哥林多前書7:7稱婚姻為恩賜：是聖靈賜能力，讓我們參與神國、服事他人。", "我們對婚姻的渴望太弱、太以自我為中心；戴上神恩典的眼鏡，才能在信心中堅持並享受這份恩賜。"], "mm": {"c": "婚姻是恩賜", "b": [["恐懼", ["怕受傷", "抗拒婚姻"]], ["失望", ["不總是快樂", "懷疑是否禮物"]], ["錯誤眼鏡", ["迪士尼式浪漫", "以我為中心"]], ["神的眼鏡", ["為神的榮耀", "服事他人"]]]}, "fw": {"q": "婚姻不快樂時，它還算是禮物嗎？", "a": "是，因為神的禮物是為了更深的目的", "steps": ["辨識浪漫化的期待", "重新理解「恩賜」的意義", "把婚姻看成服事神與人的託付"], "do": ["夫妻一起討論：我們的婚姻可以如何祝福別人？", "把一個失望換成感恩的禱告"]}, "gold": ["神賜禮物的首要目的，不是讓我們感覺快樂。", "我們對婚姻的渴望不是太強，而是太弱。", "婚姻是關於神與他人，不是關於我。"], "ref": ["哥林多前書 7:7"], "fb": "小時候收禮物，最期待的是拆開包裝紙那一刻。\n如果打開是玩具，就開心；如果打開是一套百科全書，就有點失望。\n很多年後才明白，那套百科全書，陪你走得比任何玩具都遠。\n\n婚姻，也常常是這樣的一份禮物。\n\n我們在婚禮上，以為自己收到的是一束玫瑰、一場湖畔野餐、一個永遠的浪漫。\n可是打開婚姻這份禮物，裡面裝的，常常是另一樣東西：\n要磨合的個性、要學習的饒恕、要放下的自我、要一起扛的重擔。\n\n於是有人開始懷疑：這真的是禮物嗎？\n禮物不是應該讓人開心的嗎？\n\n我們以為，神送禮物的目的是讓我們快樂；\n其實，神送禮物的目的，是讓我們更像祂、更靠近祂。\n我們以為，婚姻是關於「我被成全」；\n其實，婚姻首先是關於「神被榮耀」和「別人被祝福」。\n\n保羅在哥林多前書七章談婚姻與單身時，用了一個字：恩賜。\n恩賜不是放在櫃子裡欣賞的紀念品，\n而是聖靈給的能力，讓人能參與神國的工作、服事身邊的人。\n婚姻是一份恩賜，\n它不只為了我，也為了我的配偶、我的教會、我的鄰舍，\n甚至為了一個還沒聽過福音的世界。\n\n路易斯曾說過大意這樣的話：\n不是我們的渴望太強，而是太弱。\n我們像在泥坑裡玩泥巴的孩子，因為想像不到海邊的假期，就滿足於眼前的小遊戲。\n\n很多人對婚姻的渴望，也太小了——\n只想要一個體貼的伴侶、一個舒服的家、一段不吵架的日子。\n這些都很好，但如果只到這裡，\n一旦婚姻不再讓我們舒服，我們就會失望，甚至想退貨。\n\n迪士尼的夢想是：從此過著幸福快樂的日子；\n福音的夢想是：從此一起成為更像基督的人。\n前者很美，卻經不起現實；\n後者很難，卻越走越深。\n\n你對婚姻的渴望，是太大，還是太小？\n你是不是還在等它「讓你快樂」，\n卻忘了它也在邀請你「讓別人蒙福」？\n\n換一副眼鏡看看吧——\n不是浪漫的粉紅鏡片，\n而是神恩典的鏡片。\n透過它，你會發現，\n這份看起來很重、很難、很不像禮物的禮物，\n其實正一點一點，\n把你塑造成一個更自由、更豐富、更像祂的人。\n\n#婚姻 #恩賜 #哥林多前書7章 #期待 #神的榮耀"}, "anniversaries-are-about-god-not-gifts": {"zh": "結婚紀念日是關於神，不是禮物", "tags": ["詩與紀念日"], "core": "神是傳統的發明者；結婚紀念日可以用來記念誓言、頌讚神的作為，並向人述說福音。", "sum": ["社會上一提到紀念日就想到禮物清單或社群網站上的浪漫旅行。", "神設立逾越節等傳統，叫百姓記念祂的作為並傳給下一代；紀念日也可以如此。", "記念誓言：拿出誓詞一起朗讀、討論如何持守並彼此代禱；聯絡伴郎伴娘與證婚牧師。", "頌讚神的作為：回想福音如何拯救你們，把配偶看作主內弟兄姊妹，回顧神這一年的帶領。", "向人述說神：在社群貼文中分享福音；禮物和旅行可以有，但讓紀念日關乎神。"], "mm": {"c": "屬神的紀念日", "b": [["文化習慣", ["禮物清單", "浪漫旅行"]], ["記念誓言", ["一起朗讀", "彼此代禱"]], ["頌讚神", ["回想福音", "回顧這一年"]], ["述說福音", ["分享見證", "社群貼文"]]]}, "fw": {"q": "如何過一個榮耀神的結婚紀念日？", "a": "把紀念日變成記念神作為的傳統", "steps": ["重溫結婚誓言", "數算神一年來的恩典", "向他人見證婚姻中的福音"], "do": ["下次紀念日一起朗讀誓詞並禱告", "背誦哥林多前書13章"]}, "gold": ["神是傳統的發明者。", "紀念日不只是禮物和旅行，而是記念神。", "看配偶時，別忘了他也是主內的弟兄姊妹。"], "ref": ["出埃及記 12:42", "以弗所書 5:22-33", "約翰福音 13:35"], "fb": "結婚紀念日前一週，他在網路上搜尋：\n「結婚第五年送什麼？」「紀念日餐廳推薦」「紀念日驚喜」。\n越看越焦慮——別人家的紀念日，好像都比他們的精彩。\n\n我們的文化，很會替紀念日定標準：\n第一年送紙，第二年送棉，第三年送皮革……\n社群上，到處都是浪漫旅行和豪華晚餐的照片。\n沒做到，好像就代表愛情變淡了。\n\n可是，如果紀念日不是一場比賽，而是一場記念呢？\n\n聖經裡，神是設立傳統的那一位。\n祂吩咐以色列人守逾越節，\n不是為了熱鬧，而是為了記念祂的作為，\n並且把這些作為講給兒女、孫子聽。\n\n那麼，結婚紀念日，也可以是這樣的一天。\n\n記念你們的誓言。\n把那份誓詞找出來，一句一句再讀一遍。\n不是為了檢討誰沒做到，而是一起問：\n這一年，神怎樣幫助我們守住這些話？\n接下來的一年，我們想怎樣更忠心？\n然後彼此代禱。\n\n記念神的作為。\n回想那個把你們從滅亡中拉出來、賜下永生的福音；\n回想這一年，祂怎樣帶你們走過低谷、跨過難關。\n那些平常讓你受不了的小習慣——他吃飯的聲音、她開車的方式——\n在這一天，也許可以換個眼光看：\n他是我主內的弟兄，她是我主內的姊妹，\n神忍耐我的，比我需要忍耐對方的，多太多了。\n\n述說神的作為。\n紀念日不只是兩個人的節日，\n也是一個向世界見證的機會。\n在你分享的那張照片底下，不只寫「愛你」，\n也寫一句：「謝謝神，帶我們走到這裡。」\n\n禮物會舊，誓言要新；\n旅行會結束，恩典會延續；\n比較讓人焦慮，記念讓人感恩。\n\n今年的紀念日，你打算怎麼過？\n是為了交出一份漂亮的成果，還是為了一起抬頭，看看神做了什麼？\n\n當然，買份禮物、去趟小旅行，都很好。\n只是，別讓它們成了主角。\n讓那一天，像一座小小的石碑，\n上面刻著：\n到如今，耶和華都幫助我們。\n\n#結婚紀念日 #婚姻 #記念 #誓言 #感恩"}, "is-god-the-center-of-your-marriage": {"zh": "神是你婚姻的中心嗎？", "tags": ["福音與奧祕"], "core": "許多基督徒婚姻實際上是「不可知論」的；以神為中心意味著認識祂——藉聖經、禱告、敬拜，認識聖靈的同在與天父的主權。", "sum": ["新婚夫妻常說要以神為中心，但經歷試煉、試探或無聊後，這承諾就淡了。", "許多人不知道以神為中心的婚姻是什麼樣子，所以婚姻實際上是「不可知論」的。", "若神不是生命的首位，就不可能是婚姻的首位；認識神需要讀經、禱告與群體敬拜。", "認識聖靈：祂永不離開，所以我們不怕孤單、不必逃避或製造衝突，也能接受配偶指出我們的罪。", "認識天父的主權：萬事都在祂掌管之中，即使不明白配偶的行為，也能安息。"], "mm": {"c": "以神為中心", "b": [["問題", ["承諾淡化", "實際上不可知論"]], ["認識神", ["讀經禱告", "群體敬拜"]], ["認識聖靈", ["永不離開", "不怕孤單"]], ["認識主權", ["萬事在祂手中", "可以安息"]]]}, "fw": {"q": "「以神為中心的婚姻」具體是什麼？", "a": "夫妻各自並一同深入認識神", "steps": ["讓神成為個人生命的首位", "倚靠聖靈的同在面對衝突", "在天父的主權中安息"], "do": ["檢視每週的讀經禱告與聚會節奏", "衝突時先把重擔帶到施恩寶座前"]}, "gold": ["神若不是我生命的首位，也不會是我婚姻的首位。", "因為從不孤單，我們不必逃避衝突，也不必製造衝突。", "許多基督徒的婚姻，實際上是不可知論的。"], "ref": ["哥林多前書 3:16", "希伯來書 13:5", "羅馬書 8:26", "詩篇 139:7-10"], "fb": "婚禮上，新人說：「我們要讓神成為婚姻的中心。」\n台下的人都說阿們。\n幾年後，那句話還在嗎？\n還是被工作、孩子、帳單、疲倦，悄悄擠到了角落？\n\n很多基督徒夫妻，其實是兩個信主的人，\n過著一段「實際上不太需要神」的婚姻。\n他們不否認神，只是很少想起神。\n像一間有十字架掛在牆上，卻從沒人抬頭看的屋子。\n\n以神為中心，是什麼意思？\n不是多掛幾幅經文，也不是飯前多禱告一句，\n而是兩個人，都真正認識神。\n\n你不可能讓一位你不認識的神，成為婚姻的中心。\n如果神不是我生命的首位，\n祂也不會是我婚姻的首位。\n\n認識神，從三件很平凡的事開始：\n讀祂的話，向祂禱告，和祂的百姓一起敬拜。\n在一個越來越不在乎這些事的文化裡，\n這三件事，反而成了最有力的反文化行動。\n\n認識聖靈，會改變婚姻。\n聖靈住在我們裡面，永不離開。\n所以，我們不必害怕孤單——\n不必為了維持表面的和平而逃避衝突，\n也不必為了感覺親密而製造衝突。\n我們可以讓配偶有自己的情緒空間，\n不怕他的難過、她的害怕，會讓我們被丟下。\n我們不必急著為自己辯護，\n因為有一位中保，懂我們說不出口的痛。\n我們甚至可以接受：配偶，可能正是聖靈用來指出我罪的那一位。\n\n認識天父的主權，也會改變婚姻。\n沒有一件事，逃得出祂的眼睛；\n沒有一個分子，不聽祂的命令。\n所以，即使不懂配偶為什麼這樣做，\n即使不懂這個季節為什麼這麼難，\n我們仍能在祂的掌管中安息。\n\n名義上的中心掛在牆上，\n真正的中心活在心裡；\n把神當裝飾，婚姻會很空，\n讓神作中心，婚姻會很穩。\n\n你們的婚姻，現在的中心是什麼？\n是孩子？是事業？是對方的情緒？\n還是那位，坐在一切之上，也住在你們中間的神？\n\n也許不必一次改變很多。\n明天早上，早起十分鐘，\n兩個人一起讀一段經文，一起說一句禱告。\n讓那個掛在牆上的十字架，\n慢慢地，回到你們的心中。\n\n#婚姻 #以神為中心 #聖靈 #神的主權 #夫妻靈修"}, "the-silent-marriage-killer": {"zh": "無聲的婚姻殺手", "tags": ["溝通與親密", "衝突與修復"], "core": "羞恥——害怕坦露後被拒絕——悄悄破壞溝通與性；在福音裡被遮蓋的人，可以彼此成為醫治羞恥的人。", "sum": ["作者輔導近十年，發現幾乎每段婚姻都在某程度上受羞恥影響，尤其在溝通與性方面。", "自我檢查：是否有不能碰的話題？分享糗事時會得到同理還是嘲笑？能否坦然談失敗、認罪、一起禱告？", "羞恥就是害怕「若我對你脆弱，你會拒絕我」；對抗它的方法是冒險敞開。", "伊甸園以來人就在躲藏，但神遮蓋我們的羞恥，也使我們能遮蓋彼此。", "在基督裡我們被祂的義遮蓋、不被定罪；以此為根基，先說出羞恥綑綁的領域。"], "mm": {"c": "婚姻中的羞恥", "b": [["症狀", ["不能碰的話題", "不敢坦露失敗"]], ["本質", ["怕被拒絕", "躲藏"]], ["福音的遮蓋", ["基督的義", "不被定罪"]], ["醫治彼此", ["說出羞恥", "以恩典回應"]]]}, "fw": {"q": "為什麼夫妻之間有些話題總是談不開？", "a": "背後常是羞恥：害怕坦露後被拒絕", "steps": ["用問題自我檢查", "在基督的遮蓋中得勇氣", "彼此說出並以恩典回應羞恥"], "do": ["夫妻各選一題檢查問題誠實分享", "對方坦露時，先回應同理而非評論"]}, "gold": ["羞恥是害怕：若我對你脆弱，你會拒絕我。", "你比任何人都更能成為配偶羞恥的醫治者。", "赤身露體而不羞恥，是被救贖婚姻的方向。"], "ref": ["創世記 2:25", "羅馬書 8:1, 38-39"], "fb": "有些話題，在你們家是不能碰的。\n一碰，他就變得很防衛；一碰，她就開始哭。\n於是，你們學會繞過去，就像繞過客廳裡一個看不見的洞。\n\n很多夫妻不會說羞恥是婚姻的主要問題。\n可是一位婚姻輔導說，她見過的婚姻，幾乎都在某種程度上被羞恥拖累，\n只是它常常不是第一個被認出來的那一個。\n它躲在溝通困難後面，躲在性的尷尬後面，躲在一次次的冷戰後面。\n\n羞恥是什麼？\n就是那個聲音：如果我讓你看見真正的我，你會不會不要我？\n\n它常常藏在一些很小的地方：\n一句「沒事」，其實很有事；\n一個玩笑，其實是在試探對方會不會笑你；\n一段沉默，其實是在保護那塊不敢給人看的傷。\n最可惜的是，兩個人明明睡在同一張床上，\n卻各自守著一個不敢說出口的自己。\n\n從伊甸園開始，人就學會了躲。\n亞當和夏娃用無花果葉遮住身體，也遮住了心。\n可是神沒有讓他們一直躲下去——祂親手為他們做了皮衣。\n\n這就是福音給婚姻的禮物：\n神遮蓋了我們的羞恥，所以我們也能遮蓋彼此的羞恥。\n在基督裡，我們赤露敞開地站在神面前，\n祂卻用祂兒子的義，為我們披上衣服；\n不再定罪，也不再有任何事能使我們與祂的愛隔絕。\n\n我們以為，坦露會讓人被看輕；\n其實，在恩典裡的坦露，會讓人被愛得更深。\n我們以為，保護自己的方法是藏起來；\n其實，真正的安全，是被一個人看見全部，卻仍被接納。\n\n羞恥說：躲起來，才安全；\n恩典說：走出來，才自由。\n羞恥讓兩個人各自築牆，\n恩典讓兩個人一起拆牆。\n\n在所有人之中，你最有機會醫治你配偶的羞恥——\n因為你最常看見他最脆弱的樣子。\n在那一刻，你可以給出審判，\n也可以給出你自己在基督裡領受的恩典。\n\n今晚，也許可以從一件小事開始：\n先由你，說出一個你一直不好意思說的掙扎。\n然後，當對方也願意說時，\n請不要評論，先輕輕地說：\n「謝謝你願意告訴我。我還是一樣愛你。」\n\n那句話，可能就是拆掉那堵牆的第一塊磚。\n\n#婚姻 #羞恥 #坦誠 #恩典 #親密"}, "wanted-a-spouse-willing-to-suffer": {"zh": "徵求：願意一同受苦的配偶", "tags": ["婚前與擇偶", "苦難與死亡"], "core": "擇偶清單常漏掉最重要的一項：願意擁抱苦難；在基督裡，軟弱正是祂能力彰顯的地方。", "sum": ["一位自幼罹患慢性病的單身姊妹寫道：理想配偶應願意以擁抱苦難來活出福音。", "擇偶清單常列出善良、聰明、幽默、好看，卻漏了願意受苦。", "統計顯示：慢性病或特殊需求兒女會大幅提高離婚率；社會常說「這不是我當初簽的」。", "保羅說：主的能力在人的軟弱上顯得完全；苦難是跟隨基督的一部分，而非要逃避的事。", "基督為成就福音承受了最大的苦難；願意與配偶一同承受任何苦難的人，才在人群中脫穎而出。"], "mm": {"c": "願意受苦", "b": [["擇偶清單", ["常見條件", "漏掉受苦"]], ["現實", ["慢性病", "高離婚率"]], ["聖經觀點", ["軟弱中顯能力", "苦難的意義"]], ["值得嫁的人", ["擁抱苦難", "反映福音"]]]}, "fw": {"q": "選擇配偶時，該看重什麼特質？", "a": "願意在基督裡一同承受苦難", "steps": ["把「願意受苦」加入擇偶清單", "重新理解苦難在信仰中的位置", "在婚姻中一同反映福音的盼望"], "do": ["交往時談談：若遇到重病，我們會怎麼面對？", "從小事上觀察對方是否願意為人付代價"]}, "gold": ["最常被遺漏的擇偶條件：願意受苦。", "神從未命令我們逃避苦難，而是要我們明白它的意義。", "願意一同受苦的人，才值得託付一生。"], "ref": ["哥林多後書 12:9", "雅各書 1:2-4", "羅馬書 8:28"], "fb": "交友軟體上，每個人的自介都寫得差不多：\n喜歡旅行、喜歡美食、個性開朗、希望對方幽默體貼。\n從來沒有人寫：「徵求一位，願意陪我一起受苦的人。」\n\n可是，如果婚姻真的會走過「無論好壞、疾病健康」，\n那這不就是最重要的一項條件嗎？\n\n我們列擇偶清單時，常寫上善良、聰明、有趣、好看；\n很少有人寫上：願意擁抱苦難。\n因為受苦聽起來不浪漫，甚至有點不吉利。\n\n可是，那些從小就與疾病、殘障同行的人，比我們更早明白一件事：\n愛，最終是在困難裡被證明的。\n\n社會對疾病與婚姻的態度，常常很現實。\n很多數據都顯示，當配偶生重病、或孩子有特殊需要時，婚姻破裂的比例明顯升高。\n人們常說：「這不是我當初答應的。」\n我們很不擅長靠近困難，更不擅長留在困難裡。\n\n可是，聖經呈現的是另一個方向。\n保羅三次求主拿走他身上的刺，主卻說：我的恩典夠你用，因為我的能力是在人的軟弱上顯得完全。\n於是保羅說：我更喜歡誇自己的軟弱，好叫基督的能力覆庇我。\n\n我們以為，軟弱會讓人不值得被愛；\n其實，軟弱常常是基督能力最清楚的展示場。\n我們以為，選一個健康、順利、沒有包袱的人比較保險；\n其實，人生沒有保險，只有願不願意。\n\n健康的時候，人人都說「我願意」；\n生病的時候，才知道誰真的願意。\n順境裡的愛，看起來很美；\n逆境裡的愛，看起來很真。\n\n那麼，「願意受苦」是什麼樣子？\n不是喜歡痛苦，也不是把苦難浪漫化；\n而是在苦難來的時候，不急著逃，\n相信神會在其中工作，\n並且願意和對方一起，把這段路走成福音的見證。\n\n基督為了成就福音，甘心承受了最大的苦難。\n相比之下，祂邀請我們和配偶一起忠心地走過一些艱難，\n好像就沒那麼不合理了。\n\n你的擇偶清單上，有沒有這一項？\n你自己，是不是一個願意在對方最軟弱時，仍然留下的人？\n\n如果你正在尋找另一半，\n除了看他順境時怎麼對你，\n也看看他怎麼對待病人、老人、弱勢的人。\n一個願意為別人付代價的人，\n才值得託付「疾病健康」那一句誓言。\n\n願你遇見那樣的人，\n也願你自己，先成為那樣的人。\n\n#擇偶 #苦難 #疾病 #哥林多後書12章 #願意"}, "commitment-killed-a-part-of-me": {"zh": "承諾讓一部分的我死去", "tags": ["婚前與擇偶", "給丈夫"], "core": "求婚後感覺消退很常見，因為承諾本身就是一種死亡：向舊我死，才能在婚姻中活出新生命。", "sum": ["作者交往六個月就求婚，幾天後卻感到情感下沉，害怕自己犯了錯，覺得神讓他失望。", "許多男人在承諾之後都有類似感受：像是失去了某部分最深的自我。", "男人喜歡追逐；得到之後，渴望新的冒險——在戀愛中，這需要以盟約重新定義：婚姻就是新的冒險。", "承諾感覺像死亡，因為它真的是死亡：向單身死、向追逐愛情死，從「追尋的刺激」轉為「認識的喜樂」。", "福音的核心是：新生命透過死亡而來；婚姻反映基督為新婦捨命。"], "mm": {"c": "承諾與死亡", "b": [["求婚後", ["感覺下沉", "害怕犯錯"]], ["男人的心", ["喜歡追逐", "渴望新冒險"]], ["承諾即死亡", ["向單身死", "向追逐死"]], ["新生命", ["福音模式", "婚姻是新冒險"]]]}, "fw": {"q": "訂婚後感覺消退，是不是選錯人了？", "a": "不一定，那可能是向舊我死去的過程", "steps": ["認識承諾必然帶來失去", "把追逐的渴望轉向婚姻本身", "在基督裡經歷死而復生"], "do": ["與敬虔的長輩分享你的感受", "把婚姻規劃成一起的冒險"]}, "gold": ["承諾感覺像死亡，因為它真的是。", "從追尋的刺激，轉向認識的喜樂。", "在基督裡，死亡從來不是故事的結局。"], "ref": ["以弗所書 5:25-32", "約翰福音 12:24"], "fb": "求婚成功的那天晚上，朋友們的祝福訊息一則接一則。\n他笑著回覆，心裡卻慢慢升起一股說不出的感覺。\n幾天後，那股感覺越來越清楚：\n他好像……沒有那麼興奮了。\n\n他嚇壞了。\n我禱告過、禁食過、問過人、想了很久，\n為什麼答應之後，感覺反而沉下去了？\n是不是我選錯了？是不是神讓我失望了？\n\n這樣的經驗，比我們以為的更普遍，尤其在男人身上。\n很多人一想到「一輩子」，就覺得喘不過氣，\n好像有一部分的自己，正在被拿走。\n\n為什麼？\n也許因為，我們很擅長追逐。\n追一份升遷、一個獎項、一場旅行、一個人——\n追到手的那一刻，心裡會短暫地滿足，然後立刻開始尋找下一個目標。\n在很多領域，這種動力讓人進步；\n可是在愛情裡，它若沒有被重新定位，就可能引向背叛。\n\n所以，需要一個重新的理解：\n婚姻，不是追逐的終點，而是一場新的冒險。\n\n承諾感覺像死亡，因為它真的是一種死亡。\n向單身的自己死，\n向「隨時可以離開」的選項死，\n向「一直追逐新鮮」的那個我死。\n從「追尋的刺激」，轉向「認識的喜樂」。\n\n這很痛，很陌生，甚至很可怕。\n可是在基督裡，死亡從來不是故事的結局。\n一粒麥子不落在地裡死了，仍舊是一粒；若是死了，就結出許多子粒來。\n\n我們以為，失去了選擇，就失去了自由；\n其實，有了承諾，才有了深度。\n我們以為，感覺下沉，代表愛消失了；\n其實，那可能是舊的我正在死去，新的我正要誕生。\n\n追逐讓人興奮，卻永遠在路上；\n承諾讓人害怕，卻終於有了家。\n\n如果你也在承諾之後，感覺到一陣失落，\n先別急著判斷「是不是選錯了」。\n找一位成熟的長輩談談，把這份感覺帶到神面前。\n問問自己：我害怕失去的，是她，還是那個不想長大的自己？\n\n福音的核心，就是新生命從死亡而來。\n耶穌為祂的新婦捨命，好讓她得著真正的生命。\n婚姻，正是這個故事的縮影。\n\n有一天，你會回頭感謝那個晚上——\n那個你覺得有一部分自己死去的晚上。\n因為正是從那裡開始，\n你才真正，活成了一個丈夫。\n\n#婚前 #承諾 #訂婚 #向己死 #新生命"}, "the-problem-with-the-pinterest-dream-wedding": {"zh": "Pinterest 夢幻婚禮的問題", "tags": ["婚前與擇偶"], "core": "不要讓婚禮變成與人比較的競賽；婚禮的目的是彰顯福音——聖潔的神愛罪人新婦。", "sum": ["一位牧師寫信給準備結婚的新人：社會正暗暗推動一場「誰的婚禮最夢幻」的競賽。", "婚紗雜誌承諾獨特、完美、夢想成真，還附上86項「必備」清單。", "婚禮一天會過得很快；真正的家人朋友在乎的是你們，不希望你們為婚禮背上卡債或延後結婚。", "當好東西（盛大婚禮）成了終極的東西，就是偶像；Pinterest是好工具，卻是糟糕的主人。", "牧師也承認自己想講出「最夢幻」的證道；我們都需要定睛耶穌，讓婚禮彰顯福音。"], "mm": {"c": "夢幻婚禮", "b": [["文化壓力", ["比較競賽", "86項必備"]], ["真相", ["一天很快過", "親友在乎你們"]], ["偶像", ["好事變終極", "工具成主人"]], ["真正目的", ["彰顯福音", "定睛耶穌"]]]}, "fw": {"q": "籌備婚禮時，如何避免陷入比較？", "a": "讓婚禮的焦點回到福音", "steps": ["識破社會的比較壓力", "拒絕為婚禮背債", "以彰顯基督為婚禮的主軸"], "do": ["列出預算上限並堅守", "挑選能清楚傳講福音的經文與證道"]}, "gold": ["Pinterest 是好工具，卻是糟糕的主人，更是可怕的神。", "你的大日子應該特別，但不是照世界的標準。", "婚禮最終不是關於你，而是關於神的愛。"], "ref": ["約翰福音 15:11", "馬太福音 25:21"], "fb": "籌備婚禮的第三個月，她的手機裡存了上千張參考圖：\n森林系、復古風、極簡白、花牆、乾燥花、手工喜帖……\n每一張都好美，每一張都讓她覺得「我們的還不夠」。\n某天深夜，她看著試算表上不斷增加的預算，忽然哭了出來。\n\n沒有人會明說，但很多新人都感受到一種壓力：\n我的婚禮，要比別人的更好。\n照片要更有質感，佈置要更有特色，場地要更上相，\n伴手禮要獨一無二，連賓客的座位卡都要有巧思。\n\n婚禮產業很懂得用一句話打動人：「這是你夢想中的一天。」\n然後附上一張長長的「必備清單」。\n\n可是，如果停下來想一想，\n這一天真正的重點是什麼？\n\n婚禮當天會過得很快，快到你可能記不清楚大部分細節。\n真正愛你的家人朋友，不在乎你的花藝有沒有比別人精緻，\n他們不想看到你為了一天，背上好幾年的卡債，\n也不想看到你為了存婚禮的錢，一再延後結婚。\n他們想看到的，是你們成為忠心、喜樂的夫妻。\n\n我們以為，婚禮越完美，婚姻越有好的開始；\n其實，婚禮越被比較綁架，越容易讓人忘了婚姻的本質。\n我們以為，特別就是與眾不同；\n其實，最特別的，是那一刻兩個人在神面前許下的承諾。\n\n當一件好事變成了終極的事，它就成了偶像。\n婚禮很好，美也很好，\n但如果它站上了主角的位置，那天走紅毯的，就不只是兩個人，還有一個偶像。\n\nPinterest 是很好的工具，\n卻是很糟的主人，更是很可怕的神。\n\n比較說：要比別人更好；\n福音說：要讓人看見神的好。\n潮流說：要讓大家記得這場婚禮；\n盟約說：要讓這段婚姻值得被記得。\n\n連證婚的牧者，也會被同樣的壓力試探——\n想講一篇最動人、最讓人感動落淚的「完美證道」。\n可是，那不是神要的。\n我們都需要把眼睛，從自己的表現，轉回耶穌身上。\n\n你在籌備的，是一場婚禮，還是一段婚姻？\n你花最多時間在想的，是佈置，還是誓言？\n\n婚禮當然可以美，\n但願它最美的地方，\n是讓在場的每一個人，\n透過你們，看見那位聖潔的神，\n怎樣深愛祂那不完美的新婦。\n\n#婚禮 #籌備婚禮 #比較 #偶像 #新婚"}, "a-cure-for-the-common-cold-feet": {"zh": "治療「婚前恐懼」", "tags": ["婚前與擇偶"], "core": "婚前恐懼很常見；要分辨是一般的不安還是警訊，需要多方徵詢敬虔的意見，並看關係的「氣候」而非「天氣」。", "sum": ["訂婚的人常出現「冷腳」（婚前恐懼）；如何分辨一般的恐懼與警訊？", "文化鼓吹保留選擇，加上身邊不幸的婚姻與「50%離婚率」，讓人害怕。", "但研究顯示固定參加聚會的人離婚率遠低於此，約八成認為婚姻幸福。", "有些恐懼是對的：兩個軟弱的罪人立約，本該讓人戰兢。", "箴言說謀士多就成功：看關係的整體氣候而非一時天氣，並請認識雙方的人評估：你在這段關係中更像基督嗎？"], "mm": {"c": "婚前恐懼", "b": [["來源", ["文化與經驗", "錯誤數據"]], ["正確的恐懼", ["兩個罪人立約", "應該戰兢"]], ["認識自己", ["氣候非天氣", "不要說服自己"]], ["徵詢意見", ["多位謀士", "評估對方"]]]}, "fw": {"q": "訂婚後很害怕，該取消嗎？", "a": "先分辨恐懼的來源，並徵詢敬虔的意見", "steps": ["辨識恐懼是否源於錯誤資訊", "看關係的長期氣候", "請認識雙方的屬靈長輩評估"], "do": ["寫日記整理感受並禱告", "問朋友：我在這段關係中更像基督嗎？"]}, "gold": ["要看的是關係的氣候，而不是一時的天氣。", "若結婚一點都不讓你戰兢，你可能不夠誠實。", "謀士多，計畫就能成功。"], "ref": ["箴言 15:22"], "fb": "距離婚禮還有兩個月，他半夜突然醒來。\n心裡一個聲音說：你真的確定嗎？一輩子耶。\n他翻來覆去，越想越慌。\n\n這種感覺，英文叫作「cold feet」——腳底發冷。\n很多準新人都經歷過。\n問題是：這是正常的緊張，還是一個需要停下來的警訊？\n\n先說，為什麼我們會怕。\n我們身處的文化不斷說：人生就是要追求最大的快樂，所以最好保留所有選項。\n我們身邊也有太多不快樂的婚姻、太難看的離婚。\n加上那句常聽到的「一半的婚姻都會離婚」，\n結婚好像變成了一場賭博。\n\n可是，很多研究發現：固定參與教會聚會的夫妻，離婚率遠低於一般印象，\n多數人也認為自己的婚姻是幸福的。\n只是，悲慘的故事比平凡的幸福更容易被記住，\n所以我們的感覺，常常被扭曲了。\n\n不過，有一種恐懼是對的。\n一個有限、軟弱、會犯錯的罪人，\n要和另一個有限、軟弱、會犯錯的罪人，立下一生的盟約——\n這件事如果完全不讓你戰兢，\n你可能對自己、對對方、對婚姻，都不夠誠實。\n\n那麼，怎麼分辨？\n\n看氣候，而不是天氣。\n剛吵完架時問「要不要結婚」，答案可能很悲觀；\n約會很開心時問，答案可能連孩子名字都想好了。\n重要的不是一時的天氣，而是長期的氣候：\n整體來說，你們的關係是健康偶有風雨，還是常常風雨偶有晴天？\n如果你發現自己一直在「說服自己」結婚，那就是一個警訊。\n\n聽聽謀士的話。\n箴言說：不先商議，所謀無效；謀士眾多，所謀乃成。\n問問那些認識你們、也認識主的人：\n自從你們在一起，他們覺得你變得更好，還是更糟？\n你身上的基督，是更明顯，還是更模糊了？\n你比較快樂，還是比較焦慮？\n\n也用同樣的問題，了解你的另一半。\n熱戀會讓人短暫地喜歡平常不感興趣的事；\n認識對方很久的人，往往看得比你清楚。\n\n恐懼說：快逃；\n衝動說：快衝；\n智慧說：停下來，看清楚，問一問，再禱告。\n\n如果你此刻也腳底發冷，\n不必羞愧，也不必慌張。\n把這份不安帶到神面前，也帶到幾位成熟的弟兄姊妹面前。\n也許你會發現，那只是走進大事前的正常顫抖；\n也許你會發現，那是神慈愛的提醒。\n\n無論是哪一種，\n願你最後走上紅毯時，\n不是因為不敢回頭，\n而是因為清楚知道：\n我要走向的，是神所帶領的路。\n\n#婚前恐懼 #訂婚 #分辨 #謀士 #箴言"}, "sunday-morning-with-the-simpsons": {"zh": "辛普森家的主日早晨", "tags": ["衝突與修復"], "core": "高爾夫球員 Webb Simpson 分享：衝突的根源總能追溯到我自己；妻子以恩典回應他的怒氣，改變了他。", "sum": ["一篇講道改變了作者：雅各書4章說爭吵源於心中私慾的爭戰，所以衝突的原因總能追溯到我。", "兩個罪人同住，一定會有衝突；但神使用衝突，讓我們反映基督的良善、忍耐與饒恕。", "我們不配得任何東西，所以在婚姻中不該有應得的心態。", "一個主日他在家顧孩子，妻子晚歸，他怒問「你去哪了？」妻子卻溫柔一笑、親他一下就離開。", "處理衝突有兩種方式：為自己爭勝，或謙卑尋求配偶與關係的益處；恩典會帶來良性循環。"], "mm": {"c": "衝突的根源", "b": [["雅各書4章", ["私慾爭戰", "原因在我"]], ["衝突的目的", ["反映基督", "忍耐饒恕"]], ["主日故事", ["我發怒", "她以恩典回應"]], ["兩條路", ["爭勝", "謙卑求益處"]]]}, "fw": {"q": "夫妻衝突時，我該先看哪裡？", "a": "先看自己心中的私慾", "steps": ["承認衝突的根源在我", "放下應得的心態", "以恩典而非爭勝回應"], "do": ["下次衝突時問：我想要的是什麼？", "當配偶犯錯時，試著以溫柔回應一次"]}, "gold": ["衝突的原因，總能追溯到我自己。", "最像勝利的衝突，不是我贏了，而是我們更相愛了。", "恩典會引出恩典，形成美好的循環。"], "ref": ["雅各書 4:1-7", "哥林多前書 7:28", "羅馬書 5:8"], "fb": "那天她在公司被主管當眾數落，回到家，看到水槽裡一堆沒洗的碗，\n忍不住對他吼：「你一整天到底在幹嘛？」\n他其實也忙了一天，一句話已經到了嘴邊，\n卻在那一秒停住了。\n他放下手機，走過去捲起袖子，說：「我來洗。妳今天是不是很辛苦？」\n\n她愣住了，眼淚忽然掉下來。\n那一刻，原本要燒起來的一場戰火，就這樣熄了。\n\n雅各書問：你們中間的爭戰鬥毆，是從哪裡來的呢？\n不是從你們百體中戰鬥之私慾來的嗎？\n這句話很不舒服，因為它把箭頭指回自己：\n衝突的根源，常常不在對方做了什麼，\n而在我心裡，有什麼想要卻得不到。\n\n我想要被感謝，我想要被體諒，我想要事情照我的時間表走；\n得不到，我就生氣，然後把氣出在最近的那個人身上。\n\n我們以為，吵架是因為對方不對；\n其實，吵架常常是因為我心裡的某個慾望，被踩到了。\n我們以為，自己什麼都沒做錯；\n其實，在神面前，我們本來就不配得什麼——\n連呼吸，都是恩典。\n\n處理衝突，有兩種方式。\n一種是為自己而戰：我要贏，我要說完我想說的，我要證明我是對的。\n另一種，是雅各接著說的：神阻擋驕傲的人，賜恩給謙卑的人；故此你們要順服神。\n謙卑地尋求對方和這段關係的益處，即使自己也受了傷。\n\n回想那些「好像贏了」的衝突，\n真正讓人懷念的，從來不是「我把他說到啞口無言」，\n而是「那次之後，我們更相愛了」。\n\n爭贏的人得到一句道歉，\n讓步的人得到一個家；\n討回公道的人覺得痛快一下，\n給出恩典的人，帶出一連串的恩典。\n\n因為恩典是會傳染的。\n當一個人在你最不配的時候，選擇用溫柔回應你，\n你心裡會湧出一股想要用同樣方式回應的渴望。\n一來一往，原本的戰場，竟然慢慢變成了避風港。\n\n你們家最近一次衝突，是怎麼結束的？\n是有人贏了，還是你們一起贏了？\n\n也許下一次，當那句冷冷的話又要出口時，\n你可以先停一秒，問自己：\n我現在，是想要贏，還是想要愛？\n然後，學那個在一秒之間選擇了溫柔的人，\n更學那位，在我們最不配的時候，\n就為我們捨命的主。\n\n#婚姻 #衝突 #雅各書4章 #謙卑 #恩典"}, "did-you-expect-your-marriage-to-be-easy": {"zh": "你以為婚姻會很容易嗎？", "tags": ["衝突與修復", "福音與奧祕"], "core": "婚姻從來不容易，因為罪讓婚姻艱難；神創造婚姻不是要讓生活輕鬆，而是要展開在「容易之地」找不到的愛。", "sum": ["多數人結婚時深信：別人的婚姻很難，我們會不一樣。", "亞當初見夏娃時期待滿滿，但創世記3章美好的圖畫立刻崩壞。", "問題不在婚姻，而在罪：每段婚姻都在罪的重壓下掙扎；不結婚也不會比較輕鬆。", "神創造婚姻是要展開美麗、深度、力量與愛，顯明祂對我們的愛。", "我們是基督的新婦：像何西阿一樣，新郎持續追尋、犧牲、饒恕常常輕忽祂的新婦。"], "mm": {"c": "婚姻不容易", "b": [["期待", ["我們會不同", "亞當的歡喜"]], ["現實", ["創世記3章", "罪使婚姻艱難"]], ["神的目的", ["不是輕鬆", "展開真愛"]], ["福音", ["最好的婚姻", "最糟的新婦"]]]}, "fw": {"q": "為什麼婚姻這麼難？", "a": "因為罪；但神藉著艱難顯明祂的愛", "steps": ["放下「我們會不一樣」的幻想", "承認罪是問題的根源", "在艱難中看見基督對新婦的愛"], "do": ["在挫折時默想何西阿書2章", "把一個日常的煩躁轉成敬拜"]}, "gold": ["神創造婚姻，不是為了讓生活輕鬆。", "有些愛，在「容易之地」永遠找不到。", "問題不是婚姻，是罪。"], "ref": ["創世記 2:18-23", "創世記 3", "何西阿書 2:14-23", "羅馬書 5:8"], "fb": "婚前，很多人心裡都偷偷相信一件事：\n別人的婚姻很辛苦，但我們會不一樣。\n因為我們很相愛，因為我們很合，因為我們都愛主。\n\n然後，婚禮過了，蜜月過了，\n第一次為了洗碗吵架，第一次為了錢冷戰，第一次在深夜背對背入睡。\n你才驚覺：原來婚姻，沒有我以為的那麼容易。\n\n其實，從來沒有一段婚姻是容易的。\n伊甸園裡的第一對夫妻，起初多麼美好：\n亞當看見夏娃，忍不住歡呼。\n可是沒過多久，罪進來了，\n他們從樂園被趕出來，從此要汗流滿面才得糊口。\n\n問題不在婚姻，而在罪。\n亞當的罪、夏娃的罪、我們的罪。\n每一段婚姻，都在罪的重壓下掙扎。\n那麼，不結婚就會比較輕鬆嗎？\n問問單身的人就知道，答案也不是。\n\n我們以為，神設計婚姻是要讓生活更輕鬆；\n其實，神設計婚姻，是要展開一種在「容易之地」永遠找不到的愛。\n我們以為，困難代表婚姻出了錯；\n其實，困難常常是婚姻開始變得真實的地方。\n\n如果婚姻很容易，我們永遠不會知道，\n饒恕有多深、忍耐有多長、捨己有多美。\n就像沒有黑夜，人永遠不會知道星星有多亮。\n\n聖經說，我們是基督的新婦。\n這段婚姻，從新郎的角度看，一點都不容易：\n新婦常常轉頭去找別的愛人，\n常常輕忽祂，甚至好幾天想不起祂。\n可是新郎沒有離開。\n祂追求、保護、饒恕、擁抱，甚至為她死。\n這幅畫面一點也不輕鬆，卻驚人地美麗。\n新郎越是不惜一切去愛，那份愛就越顯得光輝。\n\n輕鬆的婚姻展示的是兩個人的運氣，\n艱難中仍堅守的婚姻，展示的是神的恩典。\n容易的愛，人人會給；\n困難的愛，才讓人看見天國。\n\n你曾經以為婚姻會很簡單嗎？\n如果今天它很難，你是覺得被騙了，還是願意相信，神正在用它教你更深的愛？\n\n也許你們正在一段很辛苦的路上。\n請別急著問「為什麼這麼難」，\n試著問「在這份難裡，我可以怎樣更像祂」。\n因為神給你婚姻，不是為了讓你一路順風，\n而是為了讓你在逆風裡，\n一點一點，喝到祂那份最深的愛。\n\n#婚姻 #困難 #真實的愛 #福音 #基督與教會"}, "marital-intimacy-is-more-than-sex": {"zh": "婚姻的親密不只是性", "tags": ["溝通與親密", "性與親密"], "core": "夫妻感到疏離時，問題常在親密；親密有五種面向，必須全部運作，婚姻才會深深連結。", "sum": ["一對夫妻說：我們感覺沒有連結，像兩條平行的軌道。", "親密可能因忙碌漸漸流失，也可能被刻意拿來報復；親密是多面向的，共有五種。", "屬靈親密是核心：一起讀經、彼此代禱、一同敬拜；若屬靈親密高，其他親密就有韌性。", "休閒親密：一起從事活動，從填字遊戲到滑翔翼；能一起笑、一起玩，才能撐過淚水與勞苦。", "知性親密：一起討論各種話題；夫妻常以為已知道對方怎麼想而停止探索。"], "mm": {"c": "五種親密", "b": [["屬靈親密", ["一起讀經禱告", "是核心"]], ["休閒親密", ["一起玩", "一起笑"]], ["知性親密", ["一起討論", "持續探索"]], ["其他", ["情感親密", "身體親密"]]]}, "fw": {"q": "夫妻感到疏離時，該從哪裡修復？", "a": "檢視並培養五種親密，從屬靈開始", "steps": ["先恢復屬靈親密", "安排一起玩的時間", "重新探索彼此的想法"], "do": ["暫停一項讓你們分開聚會的服事，一起敬拜", "每週安排一個共同的休閒活動"]}, "gold": ["屬靈親密是輪軸，其他親密都從它延伸。", "能一起笑一起玩，才撐得過淚水與勞苦。", "別以為你已經知道配偶怎麼想。"], "ref": ["馬太福音 4:4", "傳道書 9:9"], "fb": "他們沒有吵架，也沒有冷戰。\n只是坐在同一張餐桌上，各自滑著手機；\n睡在同一張床上，各自想著明天的事。\n有一天她說：「我們好像兩條平行線。」\n他愣了一下，竟然沒辦法反駁。\n\n很多夫妻說「我們沒有連結感」，\n問題常常出在親密。\n可是一說到親密，很多人只想到一件事：性。\n\n其實，親密是一個多面的寶石，\n每一面都需要被擦亮，婚姻才會發光。\n\n屬靈的親密，是一切的軸心。\n一起讀經、彼此代禱、一起敬拜。\n當兩個人吃同一種屬靈的食物，就會朝同一個方向長大。\n而且，代禱不是只在禱告裡列出對方的缺點，\n而是真心把對方放在神面前，求祂祝福他。\n當屬靈的親密深了，其他的親密就算有起伏，也比較有韌性。\n\n一起玩的親密，常被嚴重低估。\n交往時，我們願意陪對方做很多自己沒興趣的事，只為了在一起；\n結婚久了，工作、孩子、家務一多，一起玩的時間就被擠掉了。\n可是傳道書說：要和你所愛的妻快活度日。\n能一起笑、一起玩的夫妻，才比較撐得過一起流淚、一起勞苦的日子。\n\n思想的親密，也需要被照顧。\n從最喜歡的電影，到最在意的社會議題，\n一起討論、一起想，會讓兩個人的心靠得更近。\n結婚久了，我們常以為自己已經知道對方怎麼想，於是不再問。\n可是人一直在變，你真的還知道他現在怎麼想嗎？\n\n當然，還有情感的親密，還有身體的親密。\n每一種，都像一根線；\n很多根線一起纏繞，才成為一條結實的繩子。\n\n只有身體的親密，像一棟沒有地基的房子；\n只有屬靈的親密，像一座沒有門窗的教堂；\n各種親密都在，才像一個真正可以住人的家。\n\n你們現在，哪一種親密最弱？\n是很久沒一起禱告了？很久沒一起笑了？\n還是很久沒聊過一個比孩子功課更深的話題？\n\n從今天開始，挑一個最弱的地方，加一點點溫度。\n也許是一起散步十分鐘，\n也許是睡前一起禱告一分鐘，\n也許只是問一句：「最近有什麼讓你一直在想的事嗎？」\n\n兩條平行線，不一定永遠平行；\n只要其中一條，願意先彎一點點，\n它們就會開始，慢慢靠近。\n\n#婚姻 #親密 #夫妻相處 #屬靈親密 #傳道書9章"}, "good-marriages-say-no-to-good-things": {"zh": "好的婚姻懂得對好事說不", "tags": ["婚姻使命"], "core": "真正的愛會為了配偶放下自己的計畫，甚至放下好的服事機會；家庭要「特別」優先，但不是「唯一」。", "sum": ["基督徒婚姻常見的陷阱：無法在必要時把家中的服事排在對外服事之前，尤其是全職事奉者。", "新婚十個月的作者學到：愛知道自己的限度，必須選擇何時、如何為人捨己。", "說不出「不」有時是心腸太軟，更多時候是懼怕人。", "婚後生命的餅只剩幾大塊：神、工作、配偶；單身時浪費的時間，婚後代價更高。", "「特別原則」：要先照顧自己家裡的人、特別是信徒；但「特別」不是「唯一」，家庭也不能吞掉所有對外的服事。"], "mm": {"c": "對好事說不", "b": [["陷阱", ["以服事為名", "家人受苦"]], ["原因", ["心軟", "懼怕人"]], ["新的優先", ["生命的餅變大塊", "時間更寶貴"]], ["特別原則", ["先顧家人", "但不是唯一"]]]}, "fw": {"q": "服事和家庭衝突時怎麼辦？", "a": "按「特別原則」排序，必要時對好事說不", "steps": ["承認自己的有限", "察覺懼怕人的動機", "以家庭為特別優先，同時保持對外服事"], "do": ["檢視下個月的行程，刪去一項以陪伴配偶", "和配偶一起決定要接下哪些服事"]}, "gold": ["愛知道自己的限度。", "說不出「不」，常常是因為怕人。", "「特別」不等於「唯一」。"], "ref": ["哥林多前書 7:33-34", "提摩太前書 5:8", "加拉太書 6:10"], "fb": "他是小組長，也是教會的同工。\n週一開會，週三查經，週五探訪，週六帶青少年，主日還要服事。\n每一件都是好事，每一件都有人需要他。\n直到某天晚上，妻子輕輕地說：「我好像，排不進你的行事曆。」\n\n婚姻裡有一種很隱微的陷阱：\n以服事為名，忽略了最近的那一份服事——家。\n它很危險，因為受苦的是配偶和孩子；\n它很隱微，因為它常常打著「為神做工」的旗號。\n\n真正的愛，會常常為了所愛的人，\n放下自己的偏好、自己的計畫，\n甚至放下一些很好的服事機會。\n愛，知道自己的有限，所以必須選擇：什麼時候、用什麼方式，為誰擺上自己。\n\n為什麼我們很難說「不」？\n有些人是因為心太軟，看到需要就忍不住；\n更多人，是因為怕別人失望、怕被看成不夠屬靈。\n說穿了，是怕人。\n\n單身時，人生的餅可以切成很多小塊，分給很多人和很多事；\n結婚後，神和工作之外，多了一大塊永久的位置：配偶。\n能分給其他事的，自然就少了。\n這不是損失，而是神給婚姻的新飲食。\n而那些單身時看起來無傷大雅的時間——滑手機、追劇、和朋友混到很晚——\n在婚姻裡，每一分鐘都變得更有分量。\n\n保羅說：有人不看顧親屬，就是背了真道，比不信的人還不好，不看顧自己家裡的人更是如此。\n他也說：向眾人行善，向信徒一家的人更當這樣。\n這裡有一個原則，叫作「特別」：\n先特別照顧自己的家，再特別照顧主內的家，再擴及所有人。\n\n可是，「特別」不是「唯一」。\n另一個極端，是讓家庭吞掉一切，\n夫妻兩人從此再也沒空接待人、幫助人、服事人。\n那也不是神的心意。\n\n對所有人說「好」，常常是對家人說「不」；\n學會對某些好事說「不」，才能對最重要的事說「好」。\n\n你的行事曆，最近替誰留了位置？\n你的配偶，覺得自己是被排在前面，還是被擠在角落？\n\n今晚，也許可以一起打開行事曆，\n不是為了互相指責，\n而是一起禱告、一起決定：\n這個季節，我們要對什麼說「好」，對什麼說「不」。\n\n好的婚姻，不是什麼都做，\n而是一起，選擇做最重要的事。\n\n#婚姻 #服事 #優先次序 #說不 #家庭"}, "six-things-submission-is-not": {"zh": "順服不是這六件事", "tags": ["順服與帶領"], "core": "彼得前書3章說明妻子的順服，但順服不是凡事同意、不是把腦袋留在祭壇、不是盲從……而是出於對神的盼望。", "sum": ["人常帶著預設看「順服」，若其中多數聽起來很可怕，就可能整個丟掉。", "順服不是凡事同意：彼前3章中的丈夫是非信徒，妻子仍忠於耶穌，不跟從他的宗教。", "順服不是把腦袋留在祭壇：說「家裡只有我能思考」的丈夫是有病的，扭曲了權柄的意義。", "妻子是有思想的人，不是身體或機器；要自己判斷福音是否真實。", "好的帶領常說：「你是對的，我錯了。」"], "mm": {"c": "順服不是…", "b": [["不是凡事同意", ["丈夫可能不信", "忠於耶穌"]], ["不是不思考", ["妻子有頭腦", "不是機器"]], ["扭曲的權柄", ["控制一切", "不是聖經教導"]], ["好的帶領", ["承認錯", "尊重同承恩典者"]]]}, "fw": {"q": "聖經說的順服是什麼意思？", "a": "出於對神的盼望，而非盲從或失去自我", "steps": ["先排除對順服的錯誤理解", "看彼得前書3章的實際情境", "在順服中保持忠於基督與獨立思考"], "do": ["夫妻一起讀彼得前書3:1-7並討論", "丈夫練習說：你是對的，我錯了"]}, "gold": ["順服從不要求把頭腦留在祭壇上。", "說「家裡由我思考」的丈夫，誤解了權柄。", "好的帶領常說：你是對的，我錯了。"], "ref": ["彼得前書 3:1-7", "哥林多前書 7"], "fb": "一聽到「順服」兩個字，很多女人的身體會先緊繃起來。\n腦海裡浮現的畫面，可能是一個不敢說話的妻子、一個專制的丈夫、\n一個沒有自己想法、只能點頭的人。\n如果順服是那個樣子，誰會想要？\n\n問題是：那真的是聖經說的順服嗎？\n\n我們常帶著自己的經驗和預設去讀聖經。\n如果「順服」在我們心裡等於七件事，其中五件聽起來很可怕，\n我們就很可能連同那兩件美好的，一起丟掉。\n所以，先說清楚：順服不是什麼。\n\n順服不是凡事同意。\n彼得前書三章寫給妻子的話，背景裡的丈夫甚至還不信主。\n那位妻子沒有因為要順服，就跟著丈夫拜別的神。\n她可以溫柔地說：「我愛你，也願意尊重你，\n但在這件事上，我屬於耶穌，我沒有別的選擇。」\n\n順服不是把腦袋留在家門口。\n神給了女人頭腦，她是會思考、會判斷、會面對真理的人，\n不是一具身體，也不是一台機器。\n一個丈夫若說「家裡只有我能思考」，\n他不是在帶領，而是扭曲了權柄的意義。\n\n順服不是盲從、不是怕、不是失去自我。\n彼得說，聖潔的婦人是「仰賴神的」，\n她們的順服，出自盼望，不是出自恐懼。\n\n我們以為，順服就是被壓低；\n其實，聖經的順服，是一個有思想、有信仰、有尊嚴的女人，\n因為信靠神，而甘心選擇的姿態。\n我們以為，帶領就是永遠是對的；\n其實，好的帶領，常常願意說：「你是對的，我錯了。」\n\n被強迫的順服，是恐懼；\n甘心的順服，是信心。\n專制的帶領，讓人窒息；\n謙卑的帶領，讓人安心。\n\n丈夫們，你的帶領，讓妻子覺得自己更有價值，還是更渺小？\n妻子們，妳心中的順服，是來自對神的盼望，還是來自對衝突的害怕？\n\n當我們把那些扭曲的畫面一一移開，\n也許會驚訝地發現，\n聖經說的順服，其實很美——\n像兩個人跳舞，一個人帶，一個人跟，\n但兩個人都在聽同一首音樂，\n而那首音樂，是神寫的。\n\n#婚姻 #順服 #彼得前書3章 #妻子 #帶領"}, "seeing-jesus-on-the-stage-of-marriage": {"zh": "在婚姻舞台上看見耶穌", "tags": ["順服與帶領", "福音與奧祕"], "core": "丈夫與妻子都反映耶穌：丈夫反映祂捨己的愛與用神話語洗淨，妻子反映祂順服父的心。", "sum": ["她順服、他犧牲；她跟隨、他帶領；兩人都反映耶穌，方式不同但榮耀相同。", "丈夫反映耶穌：以犧牲的愛帶妻子更認識、更享受神，向自己的私慾與偏好死去。", "丈夫用神的話洗淨妻子：一起讀經、溫柔地責備、向她認罪，讓聖經充滿婚姻。", "妻子反映耶穌：如同子順服父，即使有不同的心願，仍願意跟隨丈夫的帶領。", "唯一例外是丈夫帶她犯罪；即使抗拒也帶著破碎的心呼召他悔改。謙卑順服者必被升高，如同基督。"], "mm": {"c": "兩種反映", "b": [["丈夫像耶穌", ["捨己的愛", "帶她到神面前"]], ["用道洗淨", ["一起讀經", "溫柔責備"]], ["妻子像耶穌", ["子順服父", "不照我的意思"]], ["結果", ["彼此信任", "謙卑者被升高"]]]}, "fw": {"q": "夫妻在婚姻中如何彰顯耶穌？", "a": "各以不同方式反映基督", "steps": ["丈夫：以犧牲之愛求妻子在神裡的喜樂", "丈夫：讓神的話充滿婚姻", "妻子：效法基督對父的順服"], "do": ["丈夫本週帶妻子讀一段經文", "妻子在一個決定上順從丈夫的帶領"]}, "gold": ["婚姻最大的特權，是反映我們的救主。", "丈夫要向「成為妻子心中的神」這野心死去。", "謙卑順服的，神必使他升高。"], "ref": ["以弗所書 5:22-26", "腓立比書 2:6-9", "馬可福音 14:36"], "fb": "在一場婚禮上，有個小女孩問媽媽：\n「為什麼新郎要站在前面等？為什麼新娘要慢慢走進來？」\n媽媽想了想，說：「因為他們在演一個故事。」\n「什麼故事？」\n「一個關於耶穌的故事。」\n\n婚姻最大的特權，是在一個平凡的家裡，反映一位不平凡的救主。\n奇妙的是，丈夫和妻子都在反映耶穌，只是方式不同。\n\n丈夫反映的，是耶穌捨己的愛。\n愛一個人，就是渴望、計畫、行動，為了她最終的好處。\n而對一個人最好的，是神自己。\n所以丈夫的愛，最終是要幫助妻子更認識神、更享受神。\n耶穌為此倒空自己，取了奴僕的形像，一直到死在十字架上。\n丈夫也被呼召向自己死：死在自私裡，死在「一定要照我的方式」裡，\n甚至死在一個隱密的野心裡——想成為妻子心中的神。\n\n丈夫也反映耶穌對真理的忠誠。\n他讓神的話充滿家裡的對話、衝突、和好與決定；\n他和妻子一起讀經；\n她偏離真理時，他溫柔地提醒；\n自己犯錯時，他先在她面前認罪。\n像耶穌在試探中一再說「經上記著說」，\n他讓聖經成為這個家最後的權威。\n\n妻子反映的，是耶穌順服的心。\n聖子與聖父同等，卻甘心順服父的旨意；\n在客西馬尼園，祂說：不要照我的意思，只要照你的意思。\n妻子跟隨丈夫的帶領，即使自己心裡有另一個想法——\n這不是軟弱，而是在反映耶穌那份奇妙的順服。\n當然，若丈夫要她犯罪，她不跟隨；\n但即使那時，她的拒絕也是帶著破碎的心，盼望他回轉。\n\n而且，耶穌的順服有一個結局：神將祂升為至高。\n謙卑順服的，從不會被神遺忘。\n\n他捨己，她順服；\n他帶領，她跟隨；\n他洗淨，她回應；\n兩個不同的姿態，卻是同一位耶穌。\n\n丈夫們，你的妻子看著你，能看見一點點那位為她捨命的主嗎？\n妻子們，你的丈夫看著妳，能看見一點點那位甘心順服父的主嗎？\n\n婚姻是一個舞台，燈光打在你們身上，\n但真正的主角，一直站在你們背後。\n願每一個看見你們的人，\n都像那個小女孩一樣問：\n「他們在演什麼？」\n然後聽見那個最美的答案：\n「他們在演，耶穌。」\n\n#婚姻 #反映耶穌 #丈夫 #妻子 #腓立比書2章"}, "in-defense-of-date-night": {"zh": "為約會之夜辯護", "tags": ["溝通與親密"], "core": "約會之夜不必昂貴；它是刻意不帶孩子的兩人時光，在工作狂與以孩子為中心的文化中保護婚姻。", "sum": ["有人認為約會之夜可有可無；作者夫妻十六年來卻視它為讓婚姻保持新鮮的關鍵。", "美國文化推崇工作狂與以孩子為中心，婚姻容易被擱在一旁。", "約會之夜的定義：刻意且不帶孩子的兩人時間，可以是散步、野餐、孩子睡後喝茶看電影。", "他們每月至少安排兩次外出約會，作為健康的習慣而非律法。", "「太貴了」？可以發揮創意：騎車野餐、與朋友交換顧孩子；我們會把時間和錢投資在看重的事上。"], "mm": {"c": "約會之夜", "b": [["為何需要", ["文化壓力", "婚姻被擱置"]], ["定義", ["刻意的兩人時間", "不帶孩子"]], ["實踐", ["每月兩次", "關掉電腦手機"]], ["回應藉口", ["太貴", "發揮創意與交換"]]]}, "fw": {"q": "忙碌又有孩子，還需要約會嗎？", "a": "需要，刻意的兩人時光是婚姻的養分", "steps": ["重新定義約會：重點是刻意相處", "固定安排在行事曆中", "以創意克服金錢與保母的困難"], "do": ["本月預定兩個約會時段", "與另一家庭約好互相幫忙顧孩子"]}, "gold": ["我們會把時間和金錢花在自己看重的事上。", "約會不必昂貴，但必須刻意。", "不先計畫兩人時間，它就會被一切吞掉。"], "ref": [], "fb": "「約會？我們連好好吃一頓飯的時間都沒有了。」\n三個孩子、兩份工作、一間要整理的房子、一堆要回的訊息。\n一提到「約會之夜」，很多夫妻只覺得是另一項做不到的待辦事項。\n\n有人說，約會只是婚姻的加分題，可有可無；\n也有人說，好的婚姻是建立在平凡的日常，不是浪漫的出遊。\n這兩句話都有道理，\n可是有一件事也是真的：\n如果不刻意保留兩人時光，它一定會被其他事吞掉。\n\n我們的文化推崇工作狂，也推崇以孩子為中心。\n於是婚姻，常常被放在爐子最後面那一格，小火慢燉，慢到快要涼掉。\n\n我們以為，約會一定要很昂貴：高級餐廳、表演門票、請保母；\n其實，約會的核心，是兩個人刻意地、不被打擾地在一起。\n也許是公園裡的一段散步，\n也許是海邊的一份簡單野餐，\n也許是孩子睡著後，關掉電腦和手機，泡一壺茶，一起看一部電影。\n\n「太貴了。」\n可以發揮創意：騎腳踏車、帶便當、和另一個家庭交換顧孩子——\n這週我們幫你們顧，下週你們幫我們顧。\n說到底，我們會把時間和錢，花在自己看重的事上。\n孩子的才藝班我們願意付，\n那麼，婚姻值不值得我們付一點保母費？\n\n「太忙了。」\n正因為太忙，才更需要。\n不刻意排進行事曆的事，就不會發生。\n\n「平常相處就夠了。」\n平常相處很重要，可是平常的相處，常常圍繞著孩子、家務和行程。\n約會讓你們暫時離開那堆「待處理事項」，\n重新看見彼此，而不只是看見彼此的分工。\n\n不約會的婚姻，不一定會壞掉，\n但很容易慢慢褪色；\n刻意約會的婚姻，不一定很浪漫，\n但會一直記得，當初為什麼選擇了對方。\n\n你們上一次只有兩個人、沒有手機干擾地相處，是什麼時候？\n你們的行事曆上，有沒有一格寫著對方的名字？\n\n這個月，不妨就訂下兩個晚上。\n不必很豪華，只要很專心。\n當車子開出家門、或孩子房門關上的那一刻，\n你們可能會一起鬆一口氣，相視一笑：\n「我們好久沒這樣了。」\n然後，在那個小小的夜晚裡，\n重新找回那兩個曾經一見面就聊不停的人。\n\n#婚姻 #約會之夜 #夫妻時光 #優先次序 #經營婚姻"}, "do-not-fear-the-hard-things-of-marriage": {"zh": "不要懼怕婚姻中的難處", "tags": ["苦難與死亡"], "core": "好牧人的杖不保證婚姻沒有痛苦，但祂引導並管教我們，在幽谷中保護我們的靈魂，並帶我們更親近祂。", "sum": ["作者交往時害怕受傷，神藉著「牧人用杖引導羊」的畫面對她說：不要怕。", "她以為這代表一切都會順利，其實是在倚靠樂觀與浪漫；婚後她的恐懼真的應驗了。", "神說「不要怕」，正因世上有可怕之事；婚姻的難處揭露並剝去我們必須死去的自我。", "大衛說：雖行過死蔭幽谷也不怕，因你的杖你的竿安慰我；杖象徵神數點並擁有祂的羊。", "牧人的竿也是管教：不是懲罰而是教導；神不應許沒有痛苦的婚姻，卻應許保護我們的靈魂。"], "mm": {"c": "好牧人的杖", "b": [["恐懼", ["怕受傷", "倚靠浪漫"]], ["神的引導", ["不要怕", "可怕之事真實"]], ["杖與竿", ["數點擁有", "引導方向"]], ["管教", ["不是懲罰", "保護靈魂"]]]}, "fw": {"q": "婚姻帶來的痛苦，是神失信了嗎？", "a": "不是，好牧人藉此引導並保護我們", "steps": ["分辨對神的信靠與對浪漫的樂觀", "明白難處會剝去自我", "在幽谷中經歷基督的同在"], "do": ["默想詩篇23篇", "把一個婚姻中的難處交給神並求祂教導"]}, "gold": ["神說「不要怕」，正因為有可怕的事。", "祂不應許婚姻沒有痛苦，但應許保護我們的靈魂。", "在幽谷中，好牧人正帶我們走向祂自己。"], "ref": ["詩篇 23:4"], "fb": "交往的時候，她常常在禱告裡聽見一個聲音：「不要怕。」\n她以為那句話的意思是：\n神會保護我，我不會受傷，一切都會很順利。\n\n結婚幾年後，她才發現，\n那些她害怕的事，很多都真的發生了。\n\n神說「不要怕」，難道是騙人的嗎？\n\n我們很容易把「不要怕」，理解成「不會有可怕的事」。\n其實，神說「不要怕」，正是因為這個世界真的有可怕的事。\n祂不是說黑暗不存在，\n而是說：在黑暗裡，你不必害怕，因為我與你同在。\n\n婚姻很容易讓人害怕，因為它是一片未知的土地。\n兩個人的長處和軟弱，會不斷地碰撞；\n我們原本以為的「我」，會在婚姻裡一層一層被剝開。\n怕受傷，其實常常是怕死——\n怕那個自我中心的「我」，要在婚姻裡死去。\n\n大衛說：我雖然行過死蔭的幽谷，也不怕遭害，因為你與我同在；你的杖，你的竿，都安慰我。\n牧人的杖，是用來數算羊的——\n祂知道你是祂的，祂不會把你弄丟。\n牧人的竿，是用來引導、也用來管教的——\n有時輕輕敲一下，是為了讓羊回到正路上。\n\n我們以為，好牧人會帶我們繞過所有幽谷；\n其實，好牧人常常帶我們走進幽谷，因為祂要在那裡，讓我們更認識祂。\n我們以為，神的保護就是沒有痛苦；\n其實，神的保護是：無論發生什麼事，我們的靈魂都在祂手中。\n\n樂觀會讓我們期待一切順利，\n信心卻讓我們在不順利時，仍然信靠。\n浪漫說：只要相愛，就不會痛；\n福音說：就算很痛，愛仍然在，因為祂仍然在。\n\n你的婚姻，現在正經過哪一段路？\n你是在責怪神沒保護你，還是願意相信，祂正在幽谷裡陪著你？\n\n親愛的，如果你正走在一段很黑的路上，\n請記得：那根輕敲你的竿，不是懲罰，而是愛；\n那位走在前面的牧人，從沒離開過。\n\n有一天，當你們走出幽谷，回頭看，\n也許會發現：\n最讓你們害怕的那一段路，\n正是你們，最靠近祂的一段路。\n\n#婚姻 #恐懼 #詩篇23 #好牧人 #苦難中的信心"}, "serpents-seeds-and-a-savior": {"zh": "蛇、後裔與救主", "tags": ["福音與奧祕", "外遇與試探"], "core": "伊甸的婚禮之後緊接著「蛇」；撒但仍在追擊婚姻，但神早已應許女人的後裔要傷蛇的頭。", "sum": ["新婚的作者重讀創世記2章：神親自主婚，充滿合一、喜悅、毫無羞恥。", "緊接著是「蛇」——這突兀的轉折讓她停下來默想了好幾個小時。", "婚姻設計來彰顯三一神的合一，甚至在需要救贖之前就述說救贖的故事。", "蛇繞過男人、單獨找女人，種下對神話語的懷疑；短短一章內親密破碎、羞恥取代榮耀。", "撒但至今仍追擊婚姻，但神應許女人的後裔要傷蛇的頭——基督已得勝。"], "mm": {"c": "伊甸的婚禮", "b": [["完美婚姻", ["神親自主婚", "赤身不羞恥"]], ["蛇的出現", ["突兀的轉折", "種下懷疑"]], ["破碎", ["親密破碎", "羞恥取代榮耀"]], ["救主", ["女人的後裔", "傷蛇的頭"]]]}, "fw": {"q": "為什麼美好的婚姻也會遭受攻擊？", "a": "因為撒但仍在追擊；但基督已應許得勝", "steps": ["欣賞神原本的婚姻設計", "看見撒但如何以懷疑破壞", "倚靠女人後裔的得勝"], "do": ["夫妻一起重讀創世記2-3章", "當出現對神話語的懷疑時，一起禱告抵擋"]}, "gold": ["在需要救贖之前，婚姻就已在述說救贖。", "撒但最初的武器，是一句「神豈是真說」。", "蛇在追擊，但女人的後裔已得勝。"], "ref": ["創世記 2:18-25", "創世記 3:1-15"], "fb": "聖經的第二頁，是一場完美的婚禮。\n神親自主婚，新郎看見新娘，忍不住唱歌；\n兩個人赤身露體，彼此毫無羞恥。\n一切都好得不能再好。\n\n然後，翻到第三頁，第一句話是：\n「耶和華神所造的，惟有蛇比田野一切的活物更狡猾。」\n\n就這麼突兀。\n上一秒還在蜜月，下一秒，陰影已經爬進新房。\n\n很多新婚夫妻，也有過類似的經驗：\n婚禮的花還沒謝，第一次爭吵就來了；\n蜜月的照片還沒整理完，就已經在為一句話冷戰。\n我們以為，愛情的美好能擋住一切；\n其實，越美好的東西，越容易被盯上。\n\n為什麼？\n因為婚姻從一開始，就不只是兩個人的事。\n它被設計來反映三一神那永恆的合一，\n甚至在世界還不需要救贖之前，就已經在述說一個救贖的故事。\n難怪那條蛇，會專門挑這個地方下手。\n\n牠的手法很安靜，只是一句問話：\n「神豈是真說……？」\n不是正面攻擊，而是一顆懷疑的種子。\n先讓人懷疑神的話，再讓人懷疑神的心；\n先把妻子和丈夫隔開，再把人和神隔開。\n短短一章之內，親密碎了，信任變成恐懼，祝福變成咒詛，\n坦然變成躲藏，榮耀的衣裳變成羞恥的遮蓋。\n\n今天的婚姻，也還在面對同一條蛇。\n牠很少大聲說「去犯罪吧」，\n更常輕輕地說：\n「他真的愛你嗎？」\n「神真的在乎你的婚姻嗎？」\n「照神的方式，真的會比較好嗎？」\n\n可是，第三章裡還有另一句話，常被我們忽略。\n神對蛇說：女人的後裔要傷你的頭，你要傷他的腳跟。\n在最黑暗的那一章裡，神點亮了第一盞福音的燈。\n那位後裔，後來真的來了；\n祂在十字架上被傷了腳跟，卻徹底踩碎了蛇的頭。\n\n蛇的武器是懷疑，\n救主的武器是應許；\n蛇讓人躲藏，\n救主讓人回家。\n\n你們的婚姻裡，最近有沒有聽見那句「神豈是真說」？\n是在懷疑對方，還是在懷疑神？\n\n別讓那顆種子在你們之間生根。\n一起打開神的話，一起宣告祂的應許，一起在禱告裡抵擋那個聲音。\n因為那條蛇雖然還在追擊，\n但女人的後裔，\n早已得勝。\n\n#婚姻 #創世記3章 #屬靈爭戰 #福音的應許 #新婚"}, "dispelling-our-fear-of-submission": {"zh": "驅散對順服的恐懼", "tags": ["順服與帶領", "給妻子"], "core": "順服不是照號碼填色，而是一幅藝術品：不能孤立看待、是合一的一部分，也是所有基督徒的呼召。", "sum": ["作者婚前以為角色分工像照號碼填色；婚後才發現更像需要時間與練習的藝術創作。", "第一，順服不應被孤立：妻子不需順服違反神律法的要求，也不需忍受虐待；以斯帖與亞比該首先順服神。", "第二，順服是合一的一部分：夫妻都要朝向彼此；丈夫的頭份要向妻子與其他權柄負責。", "婚姻不是權力階級，而是一支由神編排的雙人舞：男人帶、女人跟，偶爾踩到腳，彼此調整。", "第三，順服是每個基督徒的呼召：夫妻都要謙卑、願意放下自己。"], "mm": {"c": "順服的真貌", "b": [["不能孤立", ["不順服罪", "不忍受虐待"]], ["合一的一部分", ["彼此朝向", "雙人舞"]], ["普遍呼召", ["每個基督徒", "謙卑柔軟"]], ["例子", ["以斯帖", "亞比該"]]]}, "fw": {"q": "如何不再害怕「順服」這個詞？", "a": "在整本聖經與合一的脈絡中理解它", "steps": ["不把以弗所書5:22單獨抽出", "把婚姻看成彼此配合的舞蹈", "記得順服是所有基督徒的姿態"], "do": ["夫妻討論：我們的「舞步」哪裡常踩到腳？", "讀以斯帖與亞比該的故事"]}, "gold": ["順服是通往公義的路，不是罪的掩護。", "婚姻不是權力階級，而是一支編排好的雙人舞。", "謙卑柔軟，是每個基督徒的呼召。"], "ref": ["以弗所書 5:22", "撒母耳記上 25", "以斯帖記 4-5", "雅各書 4:6-7"], "fb": "她婚前以為，夫妻角色就像照著號碼填色：\n一號塗藍色，二號塗紅色，照著做，就會畫出一幅漂亮的圖。\n\n結婚以後才發現，婚姻更像一幅真正的畫——\n需要時間、需要練習，常常會不小心打翻顏料，也常常卡住不知道下一筆怎麼畫。\n顏色會彼此暈開，界線沒有那麼硬，\n可是一筆一筆下去，一種和諧的美，慢慢浮現出來。\n\n很多姊妹對「順服」的恐懼，來自一個誤解：\n以為它是一個孤立的命令，一個冰冷的規則，一條鎖鏈。\n\n第一，順服不能被孤立地讀。\n如果只把「妻子要順服丈夫」一句話單獨抽出來，它的確會顯得很可怕。\n但放回整本聖經裡，就會看見：\n妻子不需要順服丈夫去違背神的律法；\n妻子不需要忍受任何形式的虐待或持續的罪。\n聖經裡的順服，是通往公義的路，不是罪的掩護。\n\n第二，順服是合一的一部分。\n夫妻都要朝向對方。\n如果只有妻子在付出、在服事、在犧牲，那這段婚姻一定出了問題。\n丈夫的頭份，也不是一張隨心所欲的通行證；\n他要向神交帳，也要接受妻子和教會的提醒。\n他首先的責任，是用捨己的愛照顧她。\n\n婚姻不是一座權力的金字塔，\n而是一支雙人舞。\n男人帶，女人跟；\n有時會踩到對方的腳，\n有時女人需要輕輕提醒男人下一步怎麼帶，\n有時男人需要溫柔地引導女人怎麼回應。\n兩個人都彎一點、讓一點，舞才會美。\n\n第三，順服是每個基督徒的呼召。\n不只妻子，丈夫也要順服神、順服教會的帶領、彼此順服。\n謙卑、柔軟、願意放下自己，本來就是跟隨基督的樣子。\n\n我們以為，順服會讓人消失；\n其實，在基督裡的順服，會讓人找到自己真正的位置。\n我們以為，順服是女人單方面的功課；\n其實，順服是每一個跟隨耶穌的人，一輩子的功課。\n\n號碼填色很安全，卻沒有生命；\n真正的畫有點亂，卻會一天比一天美。\n\n妳心中的「順服」，現在是什麼形狀？\n是一條鎖鏈，還是一支舞？\n\n願妳在主裡發現：\n那個曾經讓妳害怕的詞，\n其實是一扇門，\n門後，是一種被保護、被珍惜、也被釋放的自由。\n\n#婚姻 #順服 #妻子 #合一 #雙人舞"}, "three-ways-to-love-your-imperfect-husband": {"zh": "愛你不完美丈夫的三種方式", "tags": ["給妻子"], "core": "妻子的呼召不取決於丈夫是否盡責；她可以藉著禱告、鼓勵等方式，愛一位不完美的丈夫。", "sum": ["我們常想：如果丈夫更屬靈、更愛我，我就更容易順服尊重他。", "但妻子的呼召不取決於丈夫的表現；我們單獨站在主面前，凡事為主而做。", "第一，為丈夫禱告：這是妻子最有力的服事，不是無計可施才做；王的心在神手中，丈夫的心也是。", "禱告也軟化自己的心，提醒我們夫妻都需要恩典。", "第二，鼓勵丈夫：身為一家之主的重擔很大；即使懷疑改變能否持久，也要肯定微小的進步。"], "mm": {"c": "愛不完美的丈夫", "b": [["前提", ["呼召不靠他的表現", "單獨站在主前"]], ["禱告", ["最有力的服事", "神能轉動人心"]], ["鼓勵", ["他的重擔很大", "肯定小進步"]], ["自省", ["容易挑剔", "我也需要恩典"]]]}, "fw": {"q": "丈夫屬靈上不夠盡責，妻子能做什麼？", "a": "不以他的表現為條件，持續禱告與鼓勵", "steps": ["把焦點從他的不足轉向神", "懇切持續地為他禱告", "肯定他每一個小小的努力"], "do": ["每天具體為丈夫的一個需要禱告", "本週說出三次對他的肯定"]}, "gold": ["妻子的呼召，不取決於丈夫是否盡了他的呼召。", "禱告不是最後手段，而是第一優先。", "相信改變可能，就去鼓勵那最小的改變。"], "ref": ["箴言 21:1", "提多書 2:4", "以弗所書 5:25"], "fb": "「如果他禱告得多一點，我就比較願意跟隨他。」\n「如果他常讀經，我就會尊重他。」\n「如果他像基督愛教會那樣愛我，我就會好好敬重他。」\n很多妻子心裡，都有一串「如果」。\n\n這些期待並不奇怪，甚至很合理。\n可是，有一件事很容易被忘記：\n妳的呼召，不取決於他有沒有活出他的呼召。\n我們每個人，最後都是單獨站在主面前；\n我們做的一切，都是做給主看的。\n\n更何況，在同一個屋簷下住久了，\n我們很容易把對方的缺點看得一清二楚，\n卻對自己一長串的毛病視而不見。\n\n當然，如果丈夫真的在屬靈上很冷淡，如果愛真的很缺乏，那是很痛的。\n那麼，該怎麼愛一個不完美的丈夫？\n\n為他禱告。\n不是「其他方法都沒用了，只好禱告」，\n而是深信：禱告是妳能為他做的、最有力的服事。\n妳比任何人都更清楚他的起伏、他的情緒、他的強項與軟弱。\n妳可以拿這份認識去「修理」他——提醒變成嘮叨，糾正變成批評；\n也可以拿這份認識，到神面前為他代求。\n王的心在耶和華手中，好像隴溝的水，隨意流轉；\n妳丈夫的心，也在祂手中。\n禱告也會改變妳的心——讓妳想起，妳自己也同樣需要恩典。\n\n鼓勵他。\n作一家之主，是很重的擔子。\n聖經只叫妻子愛丈夫，卻叫丈夫像基督捨命那樣愛妻子；\n那個標準，連最敬虔的男人都會覺得壓力很大。\n所以，與其一直盯著他哪裡還不夠，\n不如找出他哪怕一點點的進步，說出來。\n就算妳心裡還懷疑「這不會持久吧」，也先肯定它。\n\n嘮叨讓他想逃，\n禱告讓神動工；\n批評讓他變小，\n鼓勵讓他長大。\n\n妳最近，為他禱告的次數多，還是對他嘆氣的次數多？\n妳上一次具體地肯定他，是什麼時候？\n\n親愛的姊妹，妳的丈夫不完美，\n就像妳也不完美。\n但妳們都被一位完美的主深深愛著。\n從那份愛裡，\n妳可以先跨出一步——\n不是因為他已經值得，\n而是因為，主值得。\n\n#婚姻 #妻子 #為丈夫禱告 #鼓勵 #不完美的愛"}, "a-marriage-leaning-on-jesus-and-longing-for-heaven": {"zh": "倚靠耶穌、渴慕天家的婚姻", "tags": ["苦難與死亡"], "core": "Ian 與 Larissa 在 Ian 腦傷後仍守約成婚；他們「似乎憂愁，卻常常快樂」的婚姻，被耶穌圍護並渴慕天家。", "sum": ["Ian 在2006年車禍造成嚴重腦傷，原本計畫畢業就結婚的兩人，最後在他生病殘障時成婚。", "Larissa 坦言：嫁給 Ian 意味著一生工作、丈夫無法獨處、管理照護者與醫療，代價巨大。", "他們在二十多歲就深刻體會「似乎憂愁，卻常常快樂」；憂傷成了常住的房客。", "她也曾問神：為什麼是我們？是在受懲罰嗎？但耶穌這位多受痛苦的人一路扶持。", "他們說：基督與不完美、憂傷、殘缺的教會立約，就像他們的婚姻一樣，被耶穌圍護並渴望天家。"], "mm": {"c": "Ian與Larissa", "b": [["事件", ["車禍腦傷", "守約成婚"]], ["代價", ["一生照顧", "情緒與屬靈爭戰"]], ["經歷", ["似乎憂愁", "卻常快樂"]], ["盼望", ["基督與殘缺的教會", "渴慕天家"]]]}, "fw": {"q": "在無法改變的苦難中，婚姻如何持守？", "a": "倚靠多受痛苦的耶穌，並仰望天家", "steps": ["誠實面對代價與悲傷", "把婚姻看成基督與教會之約的縮影", "在憂傷中經歷基督的扶持"], "do": ["為身邊照顧病殘配偶的家庭具體提供幫助", "在困難中練習同時哀哭與感恩"]}, "gold": ["他們帶著悲傷，也帶著喜樂，走進婚姻。", "基督所立約的教會，同樣不完美、憂傷、殘缺。", "要真正去愛，就得先倚靠那位先愛我們的主。"], "ref": ["哥林多後書 6:10", "以賽亞書 53:3"], "fb": "大學畢業前，他們已經計畫好要結婚了。\n然後，一場車禍，讓他腦部嚴重受傷。\n醫生說，他也許再也無法回到從前。\n\n她仍然嫁給了他。\n\n有人會說：那是多麼浪漫的愛情。\n可是浪漫，只是故事的封面；\n翻開內頁，是一天又一天的復健、照護、帳單、等待，\n是許多別人不必面對、他們卻每天都要面對的現實。\n\n同齡的朋友在旅行、在升遷、在計畫生孩子，\n他們在學習怎樣讓一個簡單的動作再做一次。\n羨慕會來，委屈會來，「為什麼是我們」的疑問也會來。\n這些都不必假裝沒有。\n\n可是，他們仍然手牽著手走下去。\n保羅說：似乎憂愁，卻是常常快樂。\n悲傷和喜樂，原來可以同時住在一個家裡。\n\n我們以為，愛情的最高點是兩個人健健康康、一起實現夢想；\n其實，愛情最深的地方，常常是在夢想碎了以後，仍然選擇彼此。\n我們以為，苦難會讓人離開神；\n其實，苦難也可能讓人更緊地抓住那位「多受痛苦、常經憂患」的主。\n\n想一想：基督立約的對象，從來不是一個完美的教會。\n祂的新婦，也常常軟弱、憂傷、殘缺；\n可是祂沒有因此退婚，反而用自己的生命圍護她，帶她回家。\n\n健康的婚姻，見證愛的甜美；\n殘缺中堅守的婚姻，見證恩典的力量。\n平順的愛，讓人羨慕；\n破碎中的愛，讓人看見天國。\n\n你的婚姻，現在正背著什麼樣的重擔？\n是疾病、是失落，還是說不出口的疲憊？\n你是用它來證明神不愛你，還是讓它帶你更靠近那位懂得痛的主？\n\n也許你們的故事，不會被拍成影片，\n也不會被很多人知道。\n但天上的那一位，看得見每一次扶起、每一次陪伴、每一次忍住眼淚的微笑。\n\n願每一段倚靠耶穌的婚姻，\n都能在憂傷中仍唱著歌，\n在殘缺中仍彼此擁抱，\n一起向著那個沒有眼淚、沒有病痛的家，\n慢慢地，堅定地走去。\n\n#婚姻 #苦難 #殘障 #盼望 #似乎憂愁卻常常快樂"}, "love-and-respect": {"zh": "愛與尊重", "tags": ["給丈夫", "給妻子"], "core": "聖經特別吩咐丈夫愛妻子、妻子尊重丈夫；命令針對各自的弱點，也透露對方的需要：男人靠尊重運作，女人靠愛運作。", "sum": ["所有基督徒都要愛人、尊敬人；但在夫妻關係中，聖經有特別的強調。", "命令針對各自的弱點：丈夫被吩咐去愛，因為男人容易不愛；妻子被吩咐尊重，因為女人可能愛一個她並不尊重的人。", "命令也透露接受者的需要：妻子需要被愛，丈夫需要被尊重，像兩種車使用不同的燃料。", "這避免我們只給自己想要的：有位丈夫送妻子獵槍，第二年妻子回送他珍珠項鍊。", "婚姻陷入困境時，雙方常給出自己需要的，而不是對方需要的。"], "mm": {"c": "愛與尊重", "b": [["基本", ["愛所有人", "尊重所有人"]], ["針對弱點", ["丈夫要愛", "妻子要尊重"]], ["透露需要", ["男人靠尊重", "女人靠愛"]], ["常見錯誤", ["給自己想要的", "獵槍與珍珠"]]]}, "fw": {"q": "夫妻該如何滿足彼此最深的需要？", "a": "丈夫給愛，妻子給尊重", "steps": ["承認自己天生的弱點", "辨識配偶真正的需要", "給對方需要的，而不是自己想要的"], "do": ["丈夫：今天為妻子「多費一點心」", "妻子：今天具體表達對丈夫的尊敬"]}, 順著它往上，細絲漸漸變成粗壯的金索。", "夫妻起初是自己努力攀爬，後來發現不是自己在爬，而是被吸引、被提升。", "金索把兩人纏繞保護，安全地穿過黑暗上升。", "最後兩人一同站在神面前，聽見神宣告：是祂把他們聯合在一起，無人能拆開。（本頁僅摘要主題，詩句請見原文。）"], "mm": {"c": "婚姻的金索", "b": [["細絲", ["幾乎察覺不到", "看似脆弱"]], ["金索", ["越往上越粗", "有生命"]], ["被提升", ["不再靠自己爬", "神在吸引"]], ["終點", ["一同在神面前", "神所配合"]]]}, "fw": {"q": "婚姻能撐到最後嗎？", "a": "能，因為連結夫妻的是神的超自然力量", "steps": ["承認婚姻看似脆弱", "看見那條線的另一端在天上", "信靠神會把兩人一同帶回家"], "do": ["夫妻一起讀原詩", "在困難時提醒彼此：是神把我們聯合"]}, "gold": ["婚姻看似細絲，另一端卻繫在天上。", "我們不是靠自己往上爬，而是被神吸引上升。", "神所配合的，無人能拆開。"], "ref": ["馬太福音 19:6"]}, "marriage-on-the-edge-of-eternity": {"zh": "站在永恆邊緣的婚姻", "tags": ["婚姻使命"], "core": "陳恩藩提醒：在永恆的光中，婚姻很短暫；教會常過度強調婚姻，忘了目標是專心事奉主。", "sum": ["與永恆相比，婚姻都不會持續很久；永恆改變我們如何享受與愛。", "許多基督徒為家庭感謝神多過為十字架感謝神；神要我們重視婚姻，但不可過度。", "寫以弗所書5章的保羅，也寫了哥林多前書7章：有妻子的要像沒有妻子；耶穌也說愛家人不可勝過愛祂。", "教會因離婚氾濫而過度強調婚姻，反而讓夫妻變得自我中心，而非以使命為焦點。", "目標是「殷勤服事主，沒有分心」；聖經不是一本關於婚姻的書，而是關於神的書。"], "mm": {"c": "永恆視角", "b": [["婚姻的短暫", ["與永恆相比", "不可過度看重"]], ["兩段經文", ["弗5章", "林前7章"]], ["過度強調", ["夫妻自我中心", "失去使命"]], ["目標", ["專心事主", "聖經是關於神"]]]}, "fw": {"q": "基督徒該如何看待婚姻的地位？", "a": "珍惜婚姻，但以永恆與使命為首", "steps": ["以永恆眼光看婚姻", "平衡弗5章與林前7章", "讓婚姻服事神國的使命"], "do": ["夫妻一起討論：結婚後我們更服事主還是更少？", "為十字架感謝神，多過為家庭感謝"]}, "gold": ["聖經不是一本關於婚姻的書，而是關於神的書。", "別讓家庭成為比十字架更大的感恩理由。", "目標是專心事奉主，沒有分心。"], "ref": ["哥林多前書 7:27-35", "路加福音 14:26", "以弗所書 5:25"]}, "ian-and-larissa-eight-twenty-eight": {"zh": "Ian 與 Larissa：8月28日", "tags": ["苦難與死亡"], "core": "羅馬書8:28對 Ian 與 Larissa 意義深重；他們的書《Eight Twenty Eight》見證神在最黑暗時的美善。", "sum": ["「萬事都互相效力，叫愛神的人得益處」（羅馬書8:28）對這對夫妻有多重意義。", "Ian 的父親死於腦癌，生日是8月28日。", "在 Ian 危及生命、改變一生的車禍中，神用這節經文扶持他們。", "2014年8月28日，他們出版講述自己故事的書：《Eight Twenty Eight: When Love Didn't Give Up》。", "本文整理了相關影片與文章資源，邀請讀者更深經歷羅馬書8:28的真理。"], "mm": {"c": "8:28", "b": [["經文", ["羅馬書8:28", "萬事互相效力"]], ["多重意義", ["父親生日", "車禍中的扶持"]], ["書", ["2014年出版", "愛沒有放棄"]], ["資源", ["影片", "相關文章"]]]}, "fw": {"q": "在苦難中如何持守羅馬書8:28？", "a": "相信神在一切事上為愛祂的人效力", "steps": ["誠實面對苦難", "緊抓神的應許", "讓生命成為見證"], "do": ["閱讀他們的故事或觀看影片", "把羅馬書8:28寫下來放在家中"]}, "gold": ["萬事互相效力，不代表萬事都好，而是神在其中作工。", "愛沒有放棄，因為神沒有放棄。", "在最黑暗的時候，神的美善依然真實。"], "ref": ["羅馬書 8:28"]}, "your-wedding-is-still-something-worth-wanting": {"zh": "婚禮仍然值得渴望", "tags": ["婚前與擇偶", "福音與奧祕"], "core": "許多年輕人對婚姻失望，但婚姻因為屬於神而奇妙且必要；它在神的創造中心，也揭露世界短視的價值。", "sum": ["離婚率高、身邊婚姻不美滿，讓許多二三十歲的人放棄婚姻，以為可從別處得到愛與陪伴。", "婚姻並非人人必須；神呼召並裝備許多單身者見證基督的豐足，他們也該為婚姻的存在歡喜。", "理由一：婚姻是神完美創造中美好而豐盛的一部分，在故事的中心。", "從起初，婚姻就是要代表基督與教會；罪沒有出乎神的意料，反而讓婚姻成就神的美意。", "理由二：基督徒婚姻挑戰並揭露社會短視的價值（個人主義、消費主義、職涯至上）。"], "mm": {"c": "值得渴望", "b": [["現況", ["對婚姻失望", "以為可替代"]], ["單身也可", ["神的呼召", "為婚姻歡喜"]], ["理由一", ["創造的中心", "指向基督與教會"]], ["理由二", ["挑戰個人主義", "揭露短視價值"]]]}, "fw": {"q": "在婚姻普遍破碎的時代，還值得結婚嗎？", "a": "值得，因為婚姻屬於神並承載福音", "steps": ["分辨單身呼召與逃避婚姻", "從創造看婚姻的地位", "以婚姻挑戰世界的價值觀"], "do": ["寫下你對婚姻的懷疑，逐一以聖經回應", "與一對敬虔夫妻聊聊他們的婚姻"]}, "gold": ["婚姻奇妙且必要，因為它屬於神。", "婚姻不是神計畫中的附屬品，而是在中心。", "基督徒婚姻揭露世界短視的夢想。"], "ref": ["創世記 1:27-31", "以弗所書 5:32", "哥林多前書 7:6-7, 32-35"]}, "the-seven-year-itch-and-the-joy-of-lifelong-marriage": {"zh": "七年之癢與終身婚姻的喜樂", "tags": ["衝突與修復", "離婚"], "core": "「七年之癢」是迷思；正因婚姻除了死亡沒有出口，夫妻才得以做真實的自己，並在彼此面前對付罪。", "sum": ["2007年一位德國政治人物提議婚姻七年自動到期，可續約或分手。", "「七年之癢」因1955年電影流行，後續研究從四年、十二年到三年都有，其實並沒有神奇數字。", "作者同年結婚，誓言「直到我們都活著」：沒有例外條款，不只在豐盛喜樂健康時。", "交往時太和平；一旦進入無條件的盟約，兩人才能做真實的自己，罪也浮上檯面。", "這些混亂是好的、必要的：最好的婚姻會越來越好，但往往要先變糟。"], "mm": {"c": "終身盟約", "b": [["七年之癢", ["電影流行", "研究不支持"]], ["誓言", ["沒有出口", "直到死亡"]], ["無條件的自由", ["做真實的自己", "罪浮上來"]], ["成長", ["先變糟", "再越來越好"]]]}, "fw": {"q": "為什麼終身承諾反而帶來自由？", "a": "因為沒有出口，才能安心面對真實的自己與罪", "steps": ["識破「保鮮期」的文化謊言", "以無條件的盟約為基礎", "在安全中坦誠面對罪並成長"], "do": ["重讀結婚誓言，特別是「直到死亡」那一句", "與配偶分享一個你們一起處理過、讓婚姻更好的「混亂」"]}, "gold": ["除了死亡沒有出口，這是一件榮耀的事。", "在無條件的盟約裡，我們終於能做真實的自己。", "最好的婚姻會越來越好，但通常要先變糟。"], "ref": ["創世記 2:24", "馬太福音 19:6"]}, "preparing-to-worship-in-attending-a-wedding": {"zh": "預備心參加婚禮來敬拜", "tags": ["福音與奧祕"], "core": "參加婚禮時可以預備心敬拜：為新人禱告、為自己的心禱告，並在婚禮的象徵中看見基督與教會。", "sum": ["每場婚禮——即使新人不是信徒——都指向基督與祂子民的聯合。", "為相關的人禱告：見證婚禮也意味著承諾支持這對夫妻；為新人、家人、牧師、樂手等禱告。", "為自己的心禱告：願我們因神為祂兒子贖回新婦而滿溢敬拜，渴慕與新郎基督聯合。", "看見象徵：白紗代表我們在羔羊血中洗淨的衣裳；新郎的喜悅反映基督對新婦的愛。", "會眾敬拜預嚐將來眾聖徒同聲讚美；戒指象  ["辨識文化中「關係」取代婚姻的趨勢", "看見其背後逃避責任的動機", "以盟約婚姻為神所定的形式"], "do": ["交往時清楚討論彼此的方向與承諾", "與年輕人討論這些文化現象"]}, "gold": ["「關係」容易建立，也容易斷裂。", "用租房子的語言談盟約，盟約就不再是盟約。", "拿掉婚姻，換來的不是自由，而是更多條款。"], "ref": ["創世記 2:24", "馬太福音 19:4-6"]}, "ian-and-larissa-one-year-later": {"zh": "Ian 與 Larissa：一年後", "tags": ["苦難與死亡"], "core": "影片發布一年後的訪談：故事觸動了許多受苦與照顧殘障者的人；Ian 的身體持續進步，他們也開始寫書與服事。", "sum": ["《Ian 與 Larissa 的故事》影片一年內播放超過150萬次，觸及世界各地。", "Larissa 驚訝地發現，回應最多的是受苦或照顧殘障者的人；神使用 Ian 帶給人盼望。", "他們也痛心於仍有人不重視殘障者的生命，因此持續公開故事，宣揚神看重每一個生命。", "他們正在寫書，並開始受邀演講；Ian 這一年進步很大，開始每天用助行器走路，七年來第一次不坐輪椅出門。", "Ian 開始畫畫並在網路販售以支付治療費用；Larissa 也投入一部揭露墮胎罪行的紀錄片。"], "mm": {"c": "一年後", "b": [["影片影響", ["150萬次播放", "觸動受苦者"]], ["信念", ["神看重生命", "殘障者的價值"]], ["Ian的進步", ["用助行器走路", "開始畫畫"]], ["新的服事", ["寫書演講", "紀錄片"]]]}, "fw": {"q": "苦難中的婚姻如何成為祝福？", "a": "藉著誠實分享，讓神使用他們的故事", "steps": ["持守彼此與信仰", "公開見證神的作為", "把苦難轉成服事他人的機會"], "do": ["為照顧殘障者的家庭提供實際幫助", "思考你的苦難故事能如何鼓勵人"]}, "gold": ["神沒有停止醫治他，即使已過了七年。", "他們的故事最常觸動的，是同樣受苦的人。", "神看重每一個生命——未出生的、殘障的、健康的。"], "ref": []}, "marriage-on-the-cosmic-stage": {"zh": "宇宙舞台上的婚姻", "tags": ["福音與奧祕"], "core": "一集與聖經學者 G. K. Beale 的訪談：基督已完成的工作開啟新創造，基督徒婚姻因此成了在世人面前演出的救贖戲劇。", "sum": ["這是一集 Podcast 的介紹，訪談新約聖經神學學者 G. K. Beale。", "他研究以弗所書，說明基督已完成的工作如何開啟新創造，並塑造基督徒的婚姻。", "他的核心觀點：丈夫無條件地愛妻子、妻子忠心回應，就像在救贖歷史舞台上的演員，在世人面前演出。", "訪談中他先簡要總結以弗所書，再把婚姻編織進這個總結。", "原文提供 Podcast 收聽與完整逐字稿連結（約29分鐘）。"], "mm": {"c": "宇宙舞台", "b": [["訪談對象", ["G. K. Beale", "新約聖經神學"]], ["以弗所書", ["基督完成的工作", "新創造開始"]], ["婚姻", ["救贖舞台", "世人觀看"]], ["角色", ["丈夫無條件的愛", "妻子忠心回應"]]]}, "fw": {"q": "基督徒婚姻在神的計畫中有什麼位置？", "a": "它是新創造中、在世人面前演出的救贖戲劇", "steps": ["理解基督工作的宇宙性", "看見新創造已經開始", "在婚姻中演出福音"], "do": ["收聽這集訪談", "夫妻一起通讀以弗所書"]}, "gold": ["婚姻已被捲入福音的宇宙戲劇中。", "夫妻是在救贖歷史舞台上的演員。", "世界正在看我們的婚姻演出什麼。"], "ref": ["以弗所書 5:22-33"]}, "marriage-in-the-cosmic-plan-of-god": {"zh": "神宇宙計畫中的婚姻", "tags": ["福音與奧祕", "順服與帶領"], "core": "婚姻很容易與基督已完成的工作脫鉤；以弗所書把婚姻織進基督改變宇宙的勝利中，使婚姻成為福音能力的縮影。", "sum": ["在婚姻被重新定義得像黏土一樣的時代，我們很容易讓婚姻脫離基督的工作。", "作者身為丈夫常問：我如何以「只有因基督死而復活並住在我裡面才可能」的方式帶領？", "以弗所書顯示基督在四個層面的恢復：勝過邪惡權勢、開啟新創造、恢復起初的模式、恢復被罪撕裂的關係。", "四點對應到婚姻：和諧互補的婚姻是聖靈充滿生活的縮影、第二亞當恢復原初設計的見證、福音合一人類的縮影。", "只談丈夫的頭份與妻子的順服還不夠，必須把角色放回基督改變宇宙的福音中。"], "mm": {"c": "宇宙中的婚姻", "b": [["危險", ["與基督脫鉤", "婚姻被重新定義"]], ["基督的工作", ["勝過權勢", "開啟新創造"]], ["恢復", ["起初模式", "關係和諧"]], ["婚姻", ["福音的縮影", "向權勢宣告勝利"]]]}, "fw": {"q": "夫妻角色與福音有什麼關係？", "a": "角色必須放在基督改變宇宙的工作中理解", "steps": ["從以弗所書看基督工作的範圍", "把四個層面對應到婚姻", "讓婚姻成為基督勝利的見證"], "do": ["丈夫思考：我的帶領如何倚靠基督的死與復活？", "夫妻一起禱告讀完以弗所書"]}, "gold": ["沒有任何重新定義能動搖神對婚姻的設計。", "敬重基督的婚姻，是基督宇宙勝利的活證據。", "角色若脫離福音，就只剩空殼。"], "ref": ["以弗所書 1:10", "以弗所書 5:22-33"]}, "learning-from-lincolns-flawed-marriage": {"zh": "從林肯不完美的婚姻中學習", "tags": ["衝突與修復", "離婚"], "core": "林肯與瑪麗的婚姻充滿痛苦，但他們守住了婚約；在人身安全無虞的前提下，為基督忍受婚姻之痛可以帶來深刻的力量。", "sum": ["電影《林肯》呈現了林肯與妻子瑪麗緊張複雜的婚姻；本文摘自 Piper 1997年的靈修書。", "Piper 強調：尋求脫離身體暴力並沒有錯；但在此之外，許多婚姻因情緒痛苦而結束，其實不必如此。", "我們的文化以情緒痛苦合理化離婚；歷史上多數文化更重視婚姻的持久，為了孩子、社會穩定，以及基督的榮耀。", "林肯情感內斂、常不在家；瑪麗脾氣暴躁、揮霍、苛待僕人，甚至曾攻擊他。", "他們仍保持婚姻，守住了誓言的這一部分；Piper 認為接受痛苦，長遠帶來深刻的力量。"], "mm": {"c": "痛苦的婚姻", "b": [["前提", ["暴力可尋求庇護", "情緒痛苦不同"]], ["文化", ["以痛苦合理化離婚", "歷史重視持久"]], ["林肯夫婦", ["他冷淡缺席", "她暴躁揮霍"]], ["結果", ["守住誓言", "痛苦生出力量"]]]}, "fw": {"q": "婚姻很痛苦但沒有暴力，可以離開嗎？", "a": "在安全的前提下，為基督忍受痛苦可能帶來更大的益處", "steps": ["分辨人身危險與情緒痛苦", "看見神對悖逆子民的不離不棄", "選擇守約並尋求幫助"], "do": ["若有暴力，先尋求安全與協助", "若是情緒痛苦，找牧者或輔導同行"]}, "gold": ["婚姻的持久，曾被看得比情緒的平靜更重要。", "他們無法除去痛苦，但選擇了承擔。", "堅韌的婚姻，根植於神對悖逆子民的不離不棄。"], "ref": ["以賽亞書 54:5-7"]}, "hedonism-for-husbands-and-wives": {"zh": "給夫妻的基督徒享樂主義", "tags": ["順服與帶領"], "core": "墮落扭曲了丈夫的帶領與妻子的順服；救贖是恢復而非拆毀；夫妻各自在對方的喜樂中尋求自己的喜樂。", "sum": ["夫妻角色不同：丈夫以基督為教會之頭為榜樣，妻子以教會順服基督為榜樣。", "墮落使丈夫的愛心帶領變成敵意的轄制或懶惰的冷漠；使妻子的順服變成操控的諂媚或公然的反抗。", "彌賽亞帶來的救贖不是拆毀愛的帶領與甘心的順服，而是恢復它們。", "妻子在丈夫的喜樂中尋求自己的喜樂，肯定他的帶領；丈夫在妻子的喜樂中尋求喜樂，像基督那樣承擔帶領並捨己。", "Piper 與 Noël 結婚五十多年，見證這是心願得滿足的道路。"], "mm": {"c": "喜樂中的婚姻", "b": [["神的模式", ["丈夫像基督", "妻子像教會"]], ["墮落的扭曲", ["轄制或冷漠", "諂媚或反抗"]], ["救贖", ["恢復而非拆毀", "重回設計"]], ["喜樂", ["在對方喜樂中", "五十年見證"]]]}, "fw": {"q": "怎樣的婚姻能帶來最深的喜樂？", "a": "雙方在對方的喜樂中尋求自己的喜樂", "steps": ["認出墮落如何扭曲自己的角色", "以基督與教會為榜樣更新", "以對方的喜樂為自己的追求"], "do": ["丈夫：找出自己傾向轄制還是冷漠", "妻子：找出自己傾向操控還是反抗"]}, "gold": ["救贖不是拆毀神的設計，而是恢復它。", "在配偶的喜樂中，尋找你自己的喜樂。", "婚姻可以是追求最深喜樂的溫床。"], "ref": ["以弗所書 5:21-33"]}, "the-mystery-of-marriage": {"zh": "婚姻的奧祕（每日靈修）", "tags": ["福音與奧祕"], "core": "神不是隨意設計婚姻，而是刻意照著祂永恆計畫中基督與教會的關係來設計；因此夫妻角色不是任意分配的。", "sum": ["保羅引用墮落之前的創世記2:24，說它指向基督與教會，因此是極大的奧祕。", "這表示神在設計男女與婚姻時，不是擲骰子，而是刻意照著祂從永恆就計畫的基督與教會關係。", "婚姻蘊含並隱藏著遠大於表面的意義。", "因此夫妻的角色不是任意分配的，而是根植於基督與教會不同的角色。", "已婚的人要一再思想：神讓我們在婚姻中彰顯遠比自己偉大的屬天實際，這是何等的特權。"], "mm": {"c": "奧祕", "b": [["經文", ["創2:24", "墮落之前"]], ["神的設計", ["不是擲骰子", "照基督與教會"]], ["意義", ["隱藏的深意", "遠大於表面"]], ["角色", ["不是任意的", "根植於基督與教會"]]]}, "fw": {"q": "為什麼夫妻角色不同？", "a": "因為婚姻是照著基督與教會的關係設計的", "steps": ["看見婚姻在墮落前就已指向基督", "明白角色根源於基督與教會", "有意識地效法這個模式"], "do": ["每天默想以弗所書5:31-32", "思考你的角色如何反映基督或教會"]}, "gold": ["神設計婚姻時，沒有擲骰子。", "婚姻的意義，遠大於我們從外面看到的。", "我們有特權在婚姻中彰顯比自己大得多的實際。"], "ref": ["以弗所書 5:31-32", "創世記 2:24", "馬太福音 19:5"]}, "loves-greatest-happiness": {"zh": "愛的最大快樂（每日靈修）", "tags": ["福音與奧祕", "給丈夫"], "core": "基督在追求新婦的聖潔與喜樂中得著自己的喜樂；愛不排除自我的益處，但與自私不同：它在他人的快樂中尋找快樂。", "sum": ["以弗所書5:29-30：沒有人恨惡自己的身體，總是保養顧惜，正像基督待教會。", "基督與新婦如此親密，凡對她好的事也是對祂自己好；祂在潔淨、成全新婦中得著喜樂。", "有人說真愛必須沒有任何私利；但經文直接稱基督這樣的作為為「愛」。", "應讓經文來定義愛：愛是在所愛之人聖潔的喜樂中，追求基督的喜樂。", "自我益處不等於自私；自私是犧牲他人求私利，基督般的愛是在他人的快樂中尋找快樂，甚至為此受苦受死。"], "mm": {"c": "愛與喜樂", "b": [["經文", ["保養顧惜", "我們是祂的肢體"]], ["基督的喜樂", ["對她好即對己好", "成全新婦"]], ["定義愛", ["讓經文定義", "不排除喜樂"]], ["分辨", ["自我益處", "不是自私"]]]}, "fw": {"q": "愛可以有自己的喜樂嗎？", "a": "可以，真愛在對方的快樂中找到自己的快樂", "steps": ["看見基督在新婦身上得喜樂", "讓經文重新定義愛", "分辨自私與愛中的喜樂"], "do": ["想一件讓配偶真正喜樂的事，並以此為樂去做", "檢視自己的付出是否帶著「犧牲他人」的自私"]}, "gold": ["自我益處不等於自私。", "自私犧牲別人求自己的快樂；愛在別人的快樂中找到快樂。", "讓經文定義愛，而不是讓哲學定義。"], "ref": ["以弗所書 5:25-30"]}, "jesuss-joy-in-marriage": {"zh": "耶穌在婚姻中的喜樂（每日靈修）", "tags": ["福音與奧祕", "給丈夫"], "core": "婚姻痛苦的原因不是夫妻追求自己的快樂，而是沒有在配偶的快樂中追求它；耶穌為那擺在前面的喜樂忍受十架。", "sum": ["Piper 說：婚姻的不幸不是因為追求快樂，而是因為沒有在配偶的快樂中追求快樂。", "以弗所書5:25-30幾乎是聖經中最「享樂主義」的段落：丈夫要像基督愛教會那樣愛妻子。", "基督捨己是為了使教會成聖，而成聖是為了把榮耀的教會獻給自己——這就是祂面前的喜樂。", "耶穌不要一位污穢的新婦，所以甘願受死來潔淨她，藉著為她受苦得著心中所願。", "愛妻子就是愛自己；你最大的喜樂，是在追求配偶最大的喜 都不嫌多", "tags": ["福音與奧祕"], "core": "Noël Piper 說：婚姻是基督與教會的模型，怎麼說都不嫌多；這真理不只是婚姻的入門，也是每天婚姻生活的根基。", "sum": ["Piper 講婚姻系列時問妻子意見，她說：婚姻是基督與教會的模型，這點怎麼強調都不為過。", "這是婚姻的基礎課程，卻需要不斷強調。", "正如福音不只是進入基督徒生活的門，也是每天的力量；婚姻作為基督與教會的圖畫，也扎根於日常生活。", "基督單單憑恩典得著並維繫祂的新婦，這給婚姻穩固的恩典根基。", "歌羅西書2:13-14：神把我們的罪債釘在十字架上——夫妻都要深信這替代的救恩，這對活出婚姻設計至關重要。"], "mm": {"c": "一再強調", "b": [["Noël的提醒", ["怎麼說都不嫌多", "基督與教會"]], ["日常根基", ["不只是入門", "每天的力量"]], ["恩典根基", ["基督憑恩典", "得著並維繫"]], ["十字架", ["罪債被釘", "替代的救恩"]]]}, "fw": {"q": "婚姻作為福音的圖畫，如何影響日常？", "a": "使我們從神的憐憫出發，轉化彼此的關係", "steps": ["一再回到基督與教會的模型", "默想基督如何憑恩典對待新婦", "讓縱向的恩典流向橫向的關係"], "do": ["夫妻一起讀歌羅西書2:13-14", "衝突時提醒彼此：我們的罪都已被釘在十架上"]}, "gold": ["婚姻是基督與教會的模型，這怎麼說都不嫌多。", "福音不只是門，也是每天的力量。", "我的罪和配偶的罪，都已被釘在十字架上。"], "ref": ["歌羅西書 2:13-14", "羅馬書 8:3", "以弗所書 5:22-33"]}, "four-reasons-why-marriage-is-gods-doing": {"zh": "婚姻是神所做的四個理由", "tags": ["福音與奧祕"], "core": "婚姻最根本的真理是：它是神的作為——神設計它、神親自把新娘交給新郎、神說出它的設計、神親自使二人成為一體。", "sum": ["Piper 在《這短暫的婚姻》中說：認識婚姻之美的第一步，是看見神才是那位偉大的行動者。", "第一，婚姻是神的設計：是神宣告獨居不好，並親自造一位與他相配的幫助者。", "第二，神親自把第一位新娘交出去：祂造了她，然後把她帶到亞當面前。", "第三，神說出婚姻的設計：耶穌說創世記2:24是神所說的話。", "第四，神親自使二人成為一體：立誓時主要的行動者不是新人、牧師或父母，而是神；這是人無權拆毀的。"], "mm": {"c": "神的作為", "b": [["神設計", ["獨居不好", "造幫助者"]], ["神交出新娘", ["造她", "帶她來"]], ["神說話", ["創2:24", "耶穌引用"]], ["神聯合", ["使二人一體", "人不可分開"]]]}, "fw": {"q": "為什麼說婚姻是神的作為？", "a": "從設計、交付、宣告到聯合，都是神親自做的", "steps": ["看見神設計婚姻", "看見神親自主婚", "明白神使二人成為一體"], "do": ["夫妻一起讀創世記2:18-24與馬可福音10:8-9", "紀念日時感謝神親自把你們聯合"]}, "gold": ["立誓時，真正的主角是神。", "神沒有把新娘藏起來讓亞當去找，祂親自把她帶來。", "神配合的，人不可分開——因為那不是人造的。"], "ref": ["創世記 2:18-24", "馬太福音 19:4-5", "馬可福音 10:8-9"]}, "thoughts-on-the-minnesota-marriage-amendment": {"zh": "對明尼蘇達州婚姻修憲案的思考", "tags": ["福音與奧祕"], "core": "Piper 從聖經立場回應2011年明州婚姻修憲案：婚姻由神定義為一男一女的終身盟約；所有人在性上都已破碎，需要基督的赦免與醫治。", "sum": ["2011年明州眾議院通過將「婚姻僅限一男一女」的修憲問題交付2012年公投。", "Piper 認為：在神眼中並不存在所謂的「同性婚姻」，因為婚姻是由神而非人定義的。", "人與神的關係破裂後，性的美好也被扭曲；自戀、色情、淫亂、通姦、強迫等都是表現，人人都在性上破碎。", "同性的慾望是這種失序的一種形式；許多正直的人、包括基督徒也有此掙扎，並非都是自己有意招致。", "神禁止我們放縱任何失序的慾望；同性性行為是罪，異性間的通姦同樣是罪，都需要基督的赦免與醫治。"], "mm": {"c": "聖經的婚姻觀", "b": [["背景", ["2011年修憲案", "2012公投"]], ["婚姻定義", ["由神定義", "一男一女盟約"]], ["人人破碎", ["性的失序", "需要赦免"]], ["同性議題", ["失序的一種", "不放縱慾望"]]]}, "fw": {"q": "基督徒如何從聖經看婚姻的定義？", "a": "婚姻由神定義；人人都需要基督的醫治", "steps": ["回到創世記2:24的定義", "承認所有人在性上都破碎", "以真理與憐憫回應掙扎的人"], "do": ["以謙卑而非優越的態度參與討論", "為在性上掙扎的人禱告並提供支持"]}, "gold": ["婚姻不是人創造或定義的，是神。", "我們每個人在性上都以某種方式破碎了。", "垂直的關係失序，水平的關係也隨之失序。"], "ref": ["創世記 2:24", "羅馬書 1:25-27", "哥林多前書 6:9-11"]}, "marriage-and-the-unthinkable": {"zh": "婚姻與不可思議之事", "tags": ["福音與奧祕"], "core": "一則極短的反思：六十年前覺得荒謬的事已成真；今天覺得荒謬的事，六十年後呢？", "sum": ["這是一篇只有幾句話的短文。", "Piper 對比：1951年時，若說六十年後美國總統會拒絕把婚姻定義為一男一女，人們會覺得荒謬。", "到了2011年，這已成為現實。", "他接著提出一個今天看似更荒謬的設想，暗示婚姻定義一旦鬆動，界線將持續後退。", "最後只問一句：你笑得出來嗎？"], "mm": {"c": "界線後退", "b": [["1951年", ["荒謬的想法", "婚姻被改定義"]], ["2011年", ["已成現實", "界線移動"]], ["推論", ["今日的荒謬", "明日的現實"]], ["提問", ["你笑得出來嗎", "嚴肅省思"]]]}, "fw": {"q": "文化的界線為何不斷後退？", "a": "一旦離開神的定義，就沒有穩固的錨點", "steps": ["回顧過去被視為荒謬的變化", "思考界線移動的方向", "重新錨定在神的話語上"], "do": ["和家人討論文化價值如何改變", "以聖經為穩固的標準"]}, "gold": ["昨天的荒謬，可能是今天的現實。", "離開神的定義，界線就會一直後退。", "別太快笑——想想六十年後。"], "ref": []}, "john-pipers-poem-for-his-wife-on-valentines-day": {"zh": "派博給妻子的情人節詩（2011）", "tags": ["詩與紀念日"], "core": "Piper 以一連串意象讚美妻子 Noël：她是神的心意、他的一體、教會的比喻、孩子的母親與孫輩的祖母，是他在地上最確定的歸屬。", "sum": ["這是 Piper 2011年情人節寫給妻子的詩，以長串的稱呼與意象堆疊而成。", "詩中把妻子比作聖經中的女性（拉結、亞比該、底波拉、路得），讚美她的聰慧、勇敢與忠誠。", "他讚美她作為兒子們的母親、女兒的知己，以及後來作祖母的心。", "他稱她為同承產業的人、蒙救贖、被揀選的伴侶。", "結尾說她是他在地上那份確定不被拒絕、穩固的愛。（本頁僅摘要主題，詩句請見原文。）"], "mm": {"c": "讚美妻子", "b": [["聖經女性", ["拉結亞比該", "底波拉路得"]], ["品格", ["聰慧勇敢", "忠誠"]], ["家庭角色", ["母親知己", "祖母"]], ["屬靈身分", ["同承產業", "蒙揀選"]]]}, "fw": {"q": "丈夫可以怎樣讚美妻子？", "a": "具體地讚美她的品格、角色與屬靈身分", "steps": ["觀察她的品格", "肯定她在家中的角色", "記念她在基督裡的身分"], "do": ["寫一首詩或一封信，列出十個你欣賞她的地方", "在紀念日當面讀給她聽"]}, "gold": ["妻子是丈夫在地上最確定的歸屬。", "她是同承生命之恩的人，不只是伴侶。", "讚美要具體，愛才會被看見。"], "ref": ["彼得前書 3:7", "箴言 31"]}, "a-valentine-for-my-wife-in-pictures-and-rhyme": {"zh": "給妻子的圖文情人節韻文", "tags": ["詩與紀念日"], "core": "Piper 以押韻的詩句回顧與妻子的一生：從初戀、婚禮、育兒到中年與旅途，每個階段都說「我愛你」，最後說最大的奧祕是她也愛我。", "sum": ["這是 Piper 2010年寫給妻子的情人節韻文，原文搭配照片。", "詩句以「我愛你……」重複開頭，依時間回顧他們的生命。", "從刻在樹上的名字、婚禮、在德國的小公寓，到第一個兒子出生與家中的孩子們。", "也回顧中年的她、一起爬山旅行、在困難中得平安的時刻。", "結尾說：他仍然愛她，而那奧祕是——她也愛他。（本頁僅摘要主題，詩句請見原文。）"], "mm": {"c": "一生的愛", "b": [["初戀", ["刻在樹上", "婚前一年"]], ["婚禮與新婚", ["婚紗", "德國小公寓"]], ["育兒", ["第一個兒子", "滿堂兒女"]], ["歲月", ["中年之美", "愛的奧祕"]]]}, "fw": {"q": "如何在紀念日回顧婚姻？", "a": "按時間回顧一起走過的每個階段", "steps": ["列出婚姻中的重要片段", "在每段中說出你的愛", "感謝神讓對方也愛你"], "do": ["一起翻閱舊照片並分享回憶", "寫下「我愛你在……的時候」清單"]}, "gold": ["在每個季節，都說一次「我愛你」。", "愛情最大的奧祕，是對方也愛我。", "回憶是婚姻的寶藏。"], "ref": []}, "sonnet-written-on-our-41st-wedding-anniversary": {"zh": "結婚41週年紀念的十四行詩", "tags": ["詩與紀念日", "外遇與試探"], "core": "Piper 以約翰福音6章「你們也要去嗎？」為背景寫詩：他絕不離開主，也絕不想望另一位妻子。", "sum": ["這是 Piper 2009年結婚41週年寫的十四行詩。", "詩的背景是約翰福音6章：許多人離開耶穌，主問門徒是否也要離開。", "詩中他回答：離開那用愛餵養他的主，是不可想像的。", "他把對主的忠誠與對妻子的忠誠連在一起：在紀念日的美好夜晚，去找別的女人同樣荒謬。", "結尾呼應彼得的話：只有主有永生之道，他也不會夢想另一位妻子。（本頁僅摘要主題，詩句請見原文。）"], "mm": {"c": "雙重的忠誠", "b": [["經文背景", ["約翰福音6章", "你們也要去嗎"]], ["對主忠誠", ["不能離開", "祂有永生之道"]], ["對妻忠誠", ["不想望他人", "紀念日之夜"]], ["連結", ["信仰與婚姻", "同一種忠心"]]]}, "fw": {"q": "對主的忠誠與婚姻的忠誠有何關聯？", "a": "兩者都出於對那唯一寶貴者的珍惜", "steps": ["默想主有永生之道", "看見離開主的荒謬", "以同樣的心持守婚姻"], "do": ["讀約翰福音6:66-69", "紀念日時一起重申對主與彼此的委身"]}, "gold": ["離開主是不可想像的，離開妻子也是。", "只有主有永生之道。", "對神的忠心與對配偶的忠心，是同一種心。"], "ref": ["約翰福音 6:66-69"]}, "why-say-that-marriage-is-like-christ-and-the-church": {"zh": "為何要說婚姻像基督與教會？", "tags": ["福音與奧祕", "順服與帶領"], "core": "一再強調婚姻是基督與教會的模型有三個理由：提升婚姻的意義、給婚姻恩典的根基、使頭份與順服都被十字架定義。", "sum": ["Noël 提醒 Piper：婚姻是基督與教會的模型，怎麼說都不嫌多。", "理由一：它把婚姻從低俗的情境喜劇形象中提升，賦予神原本要的崇高意義。", "理由二：它給婚姻穩固的恩典根基，因為基督單單憑恩典得著並維繫祂的新婦。", "理由三：它顯示丈夫的頭份與妻子的順服既至關重要，又被釘在十字架上。", "兩者都由基督捨己的工作來定義，因此驕傲與奴性都被取消。"], "mm": {"c": "三個理由", "b": [["提升意義", ["脫離低俗形象", "崇高的設計"]], ["恩典根基", ["基督憑恩典", "得著並維繫"]], ["十架定義角色", ["頭份與順服", "至關重要"]], ["結果", ["取消驕傲", "取消奴性"]]]}, "fw": {"q": "為何要一再強調婚姻像基督與教會？", "a": "因為這賦予婚姻意義、恩典與正確的角色", "steps": ["看見婚姻的崇高意義", "以恩典為婚姻根基", "讓十字架定義頭份與順服"], "do": ["夫妻討論：我們的帶領或順服中有驕傲或奴性嗎？", "每週提醒一次：我們的婚姻在述說基督"]}, "gold": ["婚姻是基督與教會的模型，這怎麼說都不嫌多。", "頭份與順服，既至關重要，也被釘在十字架上。", "十字架同時取消了驕傲與奴性。"], "ref": ["以弗所書 5:22-33"]}, "by-how-many-doors-must-you-enter-paradise": {"zh": "要從幾道門進入樂園？", "tags": ["性與親密"], "core": "Piper 引用卻斯特頓的觀點：抱怨一生只能結一次婚，就像抱怨只能出生一次；多妻不是更懂性，反而是對性的麻木。", "sum": ["這是一篇極短的文章，Piper 稱之為關於婚姻奇妙的「不尋常的警鐘」。", "他引用卻斯特頓《回到正統》中的一段話。", "卻斯特頓認為：抱怨只能結婚一次，就像抱怨只能出生一次，完全不相稱於婚姻那可怕的激動。", "這不是對性過度敏感，而是奇怪地對性麻木。", "他說多妻是一種對性的不領悟，就像心不在焉地摘了五個梨子。"], "mm": {"c": "一扇門", "b": [["抱怨", ["只能結一次婚", "像只能出生一次"]], ["真相", ["婚姻的激動", "對性麻木"]], ["多妻", ["不領悟性", "心不在焉"]], ["結論", ["一扇門已足夠", "婚姻的奇妙"]]]}, "fw": {"q": "一夫一妻會不會限制了人？", "a": "不，它正是體會婚姻奇妙的方式", "steps": ["反思抱怨背後的態度", "看見婚姻的獨一與深度", "在一位配偶身上深入體會"], "do": ["讀卻斯特頓《回到正統》相關章節", "感謝神賜下獨一的配偶"]}, "gold": ["抱怨只能結一次婚，就像抱怨只能出生一次。", "渴望更多伴侶，不是更懂愛，而是對愛麻木。", "進入樂園，一扇門就夠了。"], "ref": []}, "questions-to-ask-when-preparing-for-marriage": {"zh": "婚前應該討論的問題", "tags": ["婚前與擇偶"], "core": "Piper 提供一份婚前討論清單，涵蓋神學、敬拜、夫妻角色、子女、生活方式、娛樂、衝突、工作、朋友與健康；每項也要問：我們如何面對差異？", "sum": ["每個主題都可加上一題：我們如何處理差異？哪些差異可以保留而不危害關係？", "神學與敬拜：彼此信什麼、如何讀經；聚會、小組、個人靈修與家庭禮拜由誰帶領。", "夫妻：頭份與順服的意義、與異性獨處的界線、家務分工、性生活、財務由誰管理。", "子女與生活方式：要不要生、幾個、管教方式、教育選擇；買房、車子、金錢觀、奉獻比例。", "娛樂、衝突、工作、朋友、健康：花費、電視電影標準；怎麼處理怒氣、是否尋求輔導；誰養家、妻子是否外出工作；健康狀況與醫療觀。"], "mm": {"c": "婚前清單", "b": [["信仰", ["神學", "敬拜與靈修"]], ["夫妻與子女", ["角色與家務", "生養與管教"]], ["生活", ["金錢與房車", "娛樂"]], ["其他", ["衝突與工作", "朋友與健康"]]]}, "fw": {"q": "婚前要討論哪些事？", "a": "從信仰到生活細節，並學習處理差異", "steps": ["逐項誠實討論", "辨識可接受與不可接受的差異", "在不確定處尋求輔導"], "do": ["每週挑一個主題深入討論", "請一對成熟夫妻陪你們走過清單"]}, "gold": ["每個主題都要問：我們如何面對差異？", "婚前多談一小時，婚後少吵一百次。", "不要只談夢想，也要談家務、金錢與怒氣。"], "ref": []}, "weighty-words-on-the-meaning-of-a-husbands-headship": {"zh": "關於丈夫頭份的沉重話語", "tags": ["給丈夫", "順服與帶領"], "core": "Piper 引用路易斯《四種愛》：丈夫的頭份最充分地體現在最像十字架的婚姻中；基督使新婦美麗，而非找到美麗的新婦。", "sum": ["Piper 說：結婚並持守婚姻最大的理由之一，不是情慾的火焰，而是聖潔的煉火。", "沒有一種關係比婚姻更清楚地被命令去效法基督的死。", "路易斯指出：丈夫是妻子的頭，正如基督是教會的頭——要像基督那樣為她捨命。", "這種頭份最充分體現在付出最多、得到最少的丈夫身上；教會的美是新郎賜的，祂不是找到美麗，而是使她美麗。", "這頭份顯在婚姻的憂傷中：不倦的照顧、不盡的饒恕（不是縱容）；像基督看見不完美的教會將成為無瑕的新婦，從不絕望。"], "mm": {"c": "像十字架的頭份", "b": [["結婚理由", ["不是情慾", "而是聖潔"]], ["路易斯", ["像基督  ["詩與紀念日", "苦難與死亡"], "core": "Piper 2009年寫給妻子的情詩，每段用一種語言帶出一節神的應許，盼望神親自向她的心說話。", "sum": ["這是一首以七種語言寫成的情人節詩，獻給妻子 Noël。", "每一段以英文起頭，最後一句換成另一種語言（法文、西班牙文、希伯來文、希臘文、拉丁文、德文等）。", "每段都呼應一節聖經應許：主常與我們同在、祂的軛是容易的、不要懼怕因祂與我們同在。", "即使黑暗延遲了黎明，神仍使萬事互相效力；即使仇敵入侵心靈，基督的光仍在黑暗中站立。", "最後一段談到苦難的功課：一宿雖有哭泣，早晨便必歡呼。（本頁僅摘要主題，詩句請見原文。）"], "mm": {"c": "七種語言的應許", "b": [["同在", ["主常與我們同在", "不要懼怕"]], ["安息", ["祂的軛容易", "重擔輕省"]], ["盼望", ["萬事互相效力", "黑暗中的光"]], ["苦難", ["不浪費痛苦", "早晨必歡呼"]]]}, "fw": {"q": "如何用神的應許彼此鼓勵？", "a": "在婚姻中一再向彼此宣講神的話", "steps": ["選擇在困境中最需要的應許", "以愛與創意向配偶表達", "一起把盼望放在神身上"], "do": ["為配偶抄寫一節應許放在她看得到的地方", "一起背誦詩篇30:5"]}, "gold": ["讓我們的主，親自向你的心說話。", "黑暗延遲黎明，卻擋不住黎明。", "一宿哭泣之後，早晨必有歡呼。"], "ref": ["馬太福音 28:20", "馬太福音 11:30", "以賽亞書 41:10", "羅馬書 8:28", "詩篇 30:5"]}, "valentines-from-jonathan-edwards-and-martyn-lloyd-jones": {"zh": "愛德華茲與鍾馬田的情書", "tags": ["詩與紀念日", "婚前與擇偶"], "core": "Piper 分享兩封他最喜愛的情書：年輕的愛德華茲讚美莎拉對神的愛；中年的鍾馬田說歲月只讓他更愛妻子。", "sum": ["19歲的愛德華茲在希臘文文法書扉頁寫下他對莎拉的讚美——那是他心中唯一能寫的情歌。", "他讚美的不是外貌，而是她被神所愛、以神為樂、純潔正直、溫柔安靜，常在田野間與看不見的主交談。", "當時莎拉才13歲；四年後兩人結婚，23年間生了11個孩子。", "鍾馬田40歲時寫信給妻子 Bethan，說歲月只讓他對她的愛更深更濃。", "他說自己以為不可能更愛她了，卻發現仍在增加；甚至同情那些沒有結婚的戀人。"], "mm": {"c": "兩封情書", "b": [["愛德華茲", ["19歲", "讚美她愛神"]], ["莎拉", ["純潔正直", "與神同行"]], ["鍾馬田", ["40歲", "愛隨歲月加深"]], ["啟示", ["看重屬靈之美", "婚姻之愛會增長"]]]}, "fw": {"q": "真正動人的愛情看重什麼？", "a": "看重對方與神的關係，並讓愛隨歲月加深", "steps": ["欣賞對方的屬靈之美", "在婚姻中持續表達愛", "相信愛可以越來越深"], "do": ["寫一封情書，讚美配偶與神的關係", "告訴配偶：我今天比當初更愛你"]}, "gold": ["最美的情書，讚美的是她與神的關係。", "歲月沒有沖淡愛，反而讓它更深。", "以為不可能更愛了，卻發現還在增加。"], "ref": []}, "on-our-40th-wedding-anniversary": {"zh": "結婚四十週年", "tags": ["詩與紀念日", "苦難與死亡"], "core": "Piper 回顧四十年婚姻：婚禮只有一個絨布十字架和一本聖經作裝飾——那正是他們生命的根基；路雖陡峭，卻值得攀登。", "sum": ["Piper 的父親為他們證婚，婚禮在喬治亞州一間鄉村小教會舉行。", "他們不用鮮花，只有他親手做的紅色絨布十字架與一本聖經——那是他們生命的根基。", "神賜給他們五個孩子、四位媳婦、十個孫兒；生活不總是輕鬆，他們也從未這樣期待。", "他等了四十年才寫婚姻書《這短暫的婚姻》；罹癌後他不再拖延事情。", "婚禮上讀的是哈巴谷書3:17-18——艱難卻喜樂的經文；這四十年路很陡，但值得攀登。"], "mm": {"c": "四十年", "b": [["婚禮", ["十字架與聖經", "生命的根基"]], ["家庭", ["五個孩子", "十個孫兒"]], ["寫作", ["等四十年", "罹癌後不拖延"]], ["經文", ["哈巴谷書3章", "陡峭卻值得"]]]}, "fw": {"q": "長久的婚姻建立在什麼上面？", "a": "建立在十字架與神的話語上", "steps": ["以基督與聖經為婚姻根基", "不期待生活總是輕鬆", "在艱難中仍以神為樂"], "do": ["紀念日一起讀哈巴谷書3:17-19", "數算神在你們婚姻中的恩典"]}, "gold": ["婚禮的裝飾，就是生命的根基：十字架與聖經。", "生活不總是輕鬆，我們也從未如此期待。", "這條路很陡，但值得攀登。"], "ref": ["哈巴谷書 3:17-18"]}, "sanctifying-unbelieving-spouses": {"zh": "使不信的配偶成聖？", "tags": ["福音與奧祕"], "core": "哥林多前書7:14說不信的配偶因信主的配偶「成聖」，指的是婚姻盟約的合法與聖潔，而非使對方得救。", "sum": ["Piper 引用 Paul Jewett 對哥林多前書7:13-14的解釋。", "經文：不信的丈夫因妻子成了聖潔，不信的妻子因丈夫成了聖潔；不然兒女就不潔淨了。", "這裡的「成聖」是指婚姻盟約使不信的一方被分別出來，專屬於信主的配偶。", "保羅要安慰哥林多信徒：信仰的差異不會廢除婚約的專屬性與合法性，與不信的配偶同住不會使信徒被玷污。", "他從大家都同意的事（兒女是聖潔、合法的）推論到有疑問的事：因此生下他們的婚姻也是合法而無可指摘的。"], "mm": {"c": "林前7:14", "b": [["經文", ["不信者成聖", "兒女聖潔"]], ["意思", ["婚約的專屬", "不是得救"]], ["安慰", ["不會被玷污", "婚約仍有效"]], ["推論", ["兒女合法", "婚姻無可指摘"]]]}, "fw": {"q": "與不信的配偶同住，會被玷污嗎？", "a": "不會，婚姻盟約仍是聖潔合法的", "steps": ["理解經文中「成聖」的意思", "肯定婚約不因信仰差異而失效", "持守婚姻並活出信仰"], "do": ["讀哥林多前書7:12-16", "為不信的配偶持續禱告"]}, "gold": ["信仰的差異，不會廢除婚約。", "這裡的「成聖」是被分別出來，不是得救。", "信主的一方不必害怕被玷污。"], "ref": ["哥林多前書 7:12-16"]}, "happy-meeting-anniversary-noel": {"zh": "相遇紀念日快樂，Noël", "tags": ["詩與紀念日"], "core": "Piper 在相遇四十週年寫詩：當初那株新芽，沒人能預知它會枯萎還是長成大樹；如今它已長成有四十道堅實年輪的樹。", "sum": ["Piper 每年紀念與妻子相遇的那一天（1966年6月6日），並寫了這首詩。", "詩中說：他們的相遇不是播種後的成熟，而是突然、原創地長出的一株新芽。", "當時無法預知那株嫩芽是蒲公英般短暫，還是會長成橡樹；是愛還是情慾，只有神知道。", "四十年後答案清楚了：它已長成一棵有四十道年輪的樹。", "每一個冬天的憂傷都壓實成堅硬的木質，形成新的一圈堅固的愛。（本頁僅摘要主題，詩句請見原文。）"], "mm": {"c": "四十道年輪", "b": [["相遇", ["1966年6月6日", "突然的新芽"]], ["未知", ["蒲公英或橡樹", "只有神知道"]], ["四十年後", ["長成大樹", "四十道年輪"]], ["冬天", ["憂傷壓實", "更堅固的愛"]]]}, "fw": {"q": "婚姻中的苦難有什麼意義？", "a": "像冬天，使愛的年輪更堅實", "steps": ["回想相遇時的不確定", "看見神如何使愛成長", "把苦難看作堅固愛的過程"], "do": ["和配偶一起慶祝你們的相遇紀念日", "回顧一個讓你們更堅固的「冬天」"]}, "gold": ["當初的嫩芽，沒有人能預言它會長成什麼。", "冬天的憂傷，壓實成堅固的年輪。", "每一年，都是一圈更厚的愛。"], "ref": []}, "married-or-single-for-better-or-worse": {"zh": "已婚或單身：無論好壞", "tags": ["婚前與擇偶"], "core": "婚姻與單身本身都不一定吸引人；吸引力來自客觀的神的設計與內心對神的渴慕相結合，兩者都是「無論好壞」。", "sum": ["有人問 Piper：若單身這麼蒙福，為何還要結婚？", "婚姻的設計：彰顯基督與教會的守約之愛、以婚姻特有的苦與樂使人成聖、養育熱切敬拜的下一代、把性引導至聖潔並預嚐天上的喜樂。", "單身的設計：彰顯神的家是靠重生而非生育
