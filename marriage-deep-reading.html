<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>婚姻文章精讀</title>
<style>
:root{--bg:#faf8f5;--fg:#2b2b2b;--mut:#7a746c;--card:#fff;--line:#e6e1da;--acc:#b5532c;--acc2:#3f6e8c;--acc3:#5b7f4a;--tag:#f3ece4;--soft:#fbf3ec}
@media (prefers-color-scheme:dark){:root{--bg:#1c1b1a;--fg:#e8e4de;--mut:#9a948c;--card:#262422;--line:#3a3633;--acc:#e08a5f;--acc2:#7fb2d4;--acc3:#9cc487;--tag:#33302c;--soft:#2e2925}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Microsoft JhengHei",sans-serif;line-height:1.6;display:flex}
#side{width:340px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;height:100vh}
#side header{padding:14px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 8px}
#q{width:100%;padding:9px 11px;font-size:15px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
.row{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
select{padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);font-size:13px;max-width:100%}
#count{color:var(--mut);font-size:12px}
#list{overflow:auto;flex:1}
.li{padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.li:hover{background:var(--soft)}
.li.on{background:var(--tag);border-left:3px solid var(--acc)}
.li b{display:block;font-size:14px;font-weight:600}
.li small{color:var(--mut);font-size:12px}
#main{flex:1;overflow:auto;height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:22px 22px 60px}
.en{color:var(--mut);font-size:14px}
h2{font-size:24px;margin:2px 0 4px;line-height:1.35}
.meta{color:var(--mut);font-size:13px}
.core{margin:16px 0;padding:14px 16px;background:var(--soft);border-left:4px solid var(--acc);border-radius:6px;font-size:17px;font-weight:600}
section{margin-top:26px}
section>h3{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
section>h3:before{content:"";width:6px;height:18px;border-radius:3px;background:var(--acc)}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
#mm svg{width:100%;height:auto;display:block}
.fw{display:flex;flex-direction:column;align-items:center;gap:0}
.fwq,.fwa{width:100%;max-width:640px;border-radius:10px;padding:10px 14px;text-align:center}
.fwq{border:2px dashed var(--acc2);color:var(--acc2);font-weight:600}
.fwa{background:var(--acc);color:#fff;font-weight:700;font-size:16px}
.arrow{color:var(--mut);font-size:18px;line-height:1;padding:4px 0}
.fwsteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;width:100%}
.fwsteps div{border:1px solid var(--line);border-top:4px solid var(--acc2);border-radius:8px;padding:9px 11px;background:var(--card);font-size:14px}
.fwsteps div i{font-style:normal;color:var(--acc2);font-weight:700;margin-right:4px}
.fwdo{width:100%;border:1px solid var(--acc3);border-radius:10px;padding:10px 14px}
.fwdo b{color:var(--acc3)}
.fwdo ul{margin:4px 0 0;padding-left:20px}
.gold{display:grid;gap:10px}
.gold div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px 12px 40px;position:relative;font-size:15px}
.gold div:before{content:"“";position:absolute;left:12px;top:0;font-size:38px;color:var(--acc);font-family:Georgia,serif}
.sum{margin:0;padding-left:22px}
.sum li{margin-bottom:6px}
.note{color:var(--mut);font-size:12px;margin-top:6px}
.tags span{display:inline-block;background:var(--tag);border-radius:4px;padding:0 7px;font-size:12px;margin:6px 5px 0 0}
.fbwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.fb{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-size:15px;line-height:1.95}
.fbside img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--acc)}
.fbcount{color:var(--mut);font-size:12px;margin-top:6px}
@media (max-width:900px){.fbwrap{grid-template-columns:1fr}}
.src{margin-top:30px;color:var(--mut);font-size:12px}
.src a{color:var(--mut)}
#back{display:none}
@media (max-width:760px){
  body{display:block}
  #side{width:auto;height:auto;border-right:0}
  #list{max-height:none}
  #main{height:auto}
  body.detail #side{display:none}
  body:not(.detail) #main{display:none}
  #back{display:inline-block;margin-bottom:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:4px 10px}
  .wrap{padding:16px}
}
</style>
</head>

</aside>

const NOTES={"the-terrible-possibility-of-adultery": {"zh": "外遇的可怕可能", "tags": ["外遇與試探"], "core": "外遇不是遠方別人的事；它是由一連串被縱容的「小罪」累積而成，但神也應許了出路。", "sum": ["作者牧會二十年，親眼看過十多起身邊基督徒的外遇，每一件都波及上百人。", "聖經說的「跌倒」不是意外，而是長期的習慣把人推向那一步，我們要為此負責。", "不必疑神疑鬼，但若停止每日悔改、覺得自己「有資格」犯小罪，任何人都可能滑落。", "大衛的墮落始於失職的小模式；婚姻中未和好的衝突、冷淡與忙碌，會讓外人的一句讚美變得危險。", "神是信實的，必在試探中開出路，叫人能忍受得住。"], "mm": {"c": "謹防跌倒", "b": [["看見危險", ["外遇就在教會裡", "波及範圍極大"]], ["不是意外", ["每天潑水結冰的比喻", "小罪累積成大罪"]], ["婚姻破口", ["衝突未和好", "冷淡與忙碌", "外人的讚美"]], ["神的應許", ["試探人所常有", "神必開出路"]]]}, "fw": {"q": "外遇真的可能發生在我身上嗎？", "a": "會——若放任小罪累積；但神提供出路", "steps": ["承認危險真實存在", "明白跌倒是長期模式的結果", "與看似微小的罪爭戰"], "do": ["每日悔改，不給自己「小罪特權」", "及早處理夫妻間的冷淡與怨氣"]}, "gold": ["自以為站得穩的，要謹慎，免得跌倒。", "用湯匙挖的屬靈坑洞，久了也會變成大坑。", "外遇有可怕的可能，但忍耐與出路有更美的應許。"], "ref": ["哥林多前書 10:12-13", "撒母耳記下 11"], "fb": "深夜十一點，她傳來一句：「你今天看起來好累，辛苦了。」\n你盯著螢幕，心裡忽然一暖。\n可是，家裡那個人，已經很久沒對你說這句話了。\n\n沒有人是在某一天突然墜落的。\n墜落，從來不是一個瞬間，而是一千個「沒關係」的總和。\n\n我們以為外遇是遠方的新聞，是別人家的破碎，是名人的醜聞。\n其實它更像冬天的台階——\n不是一場暴風雪讓它結冰，\n是你每天潑上一小杯水，說服自己「只是一點點」。\n\n一句沒有和好的爭執，\n一次不想解釋的冷淡，\n一段忙到看不見對方的日子，\n一點「我這麼辛苦，應該可以」的特權感。\n一杯、一杯、又一杯。\n直到某天，外人一句平常的讚美，竟比家裡十年的陪伴更響亮。\n\n跌倒的人不是比較壞，只是比較晚發現自己站在冰上。\n站得穩的人不是比較強，而是比較早承認自己會滑。\n\n「我不可能會這樣」——這句話，不正是每一個跌倒的人，最後一句說得很篤定的話嗎？\n\n大衛王不是在一夜之間成為奪人妻子的人。\n他先是在該出征的季節留在宮裡，\n然後習慣了差遣別人、習慣了得到想要的，\n最後，連差遣一個忠心的士兵去送死，都不覺得太錯。\n小罪不是小，它只是還沒長大。\n\n所以真正的防線，不在手機的密碼，而在今晚的那句「對不起」；\n不在監控對方的行蹤，而在每天回頭看看自己的心；\n不在害怕失去，而在仍然珍惜。\n\n聖經說：自己以為站得穩的，須要謹慎，免得跌倒。\n但聖經也說：神是信實的，必在試探中開一條出路。\n\n這兩句話要一起讀。\n只讀前一句，人會活在恐懼裡；\n只讀後一句，人會活在僥倖裡；\n兩句一起讀，人才會活在警醒又盼望的恩典裡。\n\n如果你已經在冰上，請現在就停下來，\n不是因為你一定會跌倒，\n而是因為你值得一條更好的路。\n\n回家吧。\n把那杯水倒掉，\n把那句道歉說出口，\n把那個人重新看清楚——\n那個在你最狼狽時仍沒有離開的人。\n\n愛，不是從不跌倒的人才配擁有；\n愛，是每天都願意再站穩一次的人，慢慢守住的。\n\n#婚姻 #外遇 #警醒 #恩典 #夫妻 #信仰與生活"}, "what-if-she-wont-follow": {"zh": "如果她不願跟隨？", "tags": ["順服與帶領", "給丈夫"], "core": "一位曾是平權主義者的妻子分享：丈夫先與主同行、成為敬虔的人，神便用他軟化她的心。", "sum": ["作者婚禮時刪掉「順服」誓詞，身為廣告公司主管，深信男女角色毫無分別。", "教會選她而非丈夫當平信徒領袖，夫妻都感到不對勁，後來轉到逐節講解聖經的教會。", "在敬虔男性牧者帶領下，她反而感到釋放，婚姻與靈命一起興旺。", "她鼓勵丈夫們：只有神能改變妻子的心，但丈夫可以先改變自己。", "她看見丈夫更親近主、更像敬虔人、認真承擔以弗所書第五章的呼召，用神的話洗淨她。"], "mm": {"c": "幫助妻子擁抱呼召", "b": [["她的轉變", ["從平權到欣賞神的設計", "好教會帶來釋放"]], ["丈夫先改變", ["更親近耶穌", "成為可敬的人"]], ["承擔呼召", ["以弗所書五章", "每天用神的話洗她"]], ["盼望", ["只有神能改變人心", "不要灰心"]]]}, "fw": {"q": "妻子不願接受丈夫帶領時，丈夫該怎麼辦？", "a": "不急著改變她，先讓神改變你", "steps": ["與基督同行、結果子", "活出謙卑溫柔、可被尊敬的品格", "主動用神的話餵養妻子"], "do": ["每天與妻子一起讀經禱告", "在認罪與幽默中帶領，而非強迫"]}, "gold": ["只有神能改變她的心，但神可以使用你。", "先成為一個值得妻子尊敬的男人。", "妻子看見丈夫的悔改，心就被融化了。"], "ref": ["以弗所書 5:22-33", "歌羅西書 1:9-10", "以弗所書 4:1-2"], "fb": "她曾在婚禮上，堅持把誓詞裡「順服」那兩個字刪掉。\n她是廣告公司的合夥人，能言善道，雷厲風行。\n她相信：女人什麼位置都能坐，何必跟在誰後面？\n\n多年後，她卻說：我學會了，而且是喜樂地學會了。\n\n是什麼改變了她？\n不是一場辯論，不是一本書，也不是丈夫的命令。\n是一個男人，安靜地，先改變了自己。\n\n我們常以為，帶領就是走在前面、說了算、讓人服從。\n但真正的帶領，是讓人願意跟上。\n命令只能改變行為，榜樣卻能改變人心。\n\n他開始更常讀經，\n他開始和敬虔的弟兄同行，\n他開始在禱告裡為自己的罪流淚，\n他開始每天早上，把神的話讀給她聽。\n他沒有逼她順服，他只是讓自己變得值得尊敬。\n\n強迫的順服是牆，甘心的跟隨是橋；\n辯贏的道理會被遺忘，活出來的愛會被記住。\n\n丈夫們，你是想要一個「聽話」的妻子，還是一個「信任你」的妻子？\n如果連你自己都不信任神的帶領，又怎能期待她信任你的帶領？\n\n這位妻子後來說，當她看見丈夫在禱告中認罪、在生活中謙卑、在失敗時還能自嘲，她的心就融化了。\n她發現，順服不是被貶低，而是被保護；\n不是失去聲音，而是找到安息；\n不是跟隨一個完美的男人，而是跟隨一個正在跟隨基督的男人。\n\n這就是改變的次序：\n先是神改變了他，\n然後他改變了家的氣氛，\n最後，神在那樣的氣氛裡，改變了她。\n\n所以，如果你的妻子還不願意跟隨，\n別急著改變她——\n只有神能改變人心。\n但神很樂意使用一個先被改變的丈夫。\n\n先跪下，再站起來；\n先低頭，再帶頭；\n先被基督帶領，再去帶領她。\n\n有一天你會發現，\n她不是被你說服的，\n她是被你身上的那道光，慢慢吸引過來的。\n\n#婚姻 #丈夫 #帶領 #順服 #以弗所書 #信仰與家庭"}, "what-if-he-wont-lead": {"zh": "如果他不願帶領？", "tags": ["順服與帶領", "給妻子"], "core": "丈夫不帶領時，妻子不是無能為力：禱告、調整期待、保守己心、鼓勵他，並求助於群體。", "sum": ["婚姻是天路同行的夥伴，丈夫以愛帶領，妻子溫柔幫助，目標是彼此幫助到天家。", "沒有萬靈丹，但妻子作為幫助者，可以鼓勵丈夫帶領，而且不要獨自承擔。", "第一是禱告：「愛他是我的責任，改變他是神的工作。」", "以聖經而非別人的婚姻設定期待；並提防驕傲、應得心態、冷漠、操控、苦毒、不尊重、比較與外遇。", "多肯定他的成長，讓鼓勵多過批評，也省察自己是否讓他難以帶領。"], "mm": {"c": "幫助丈夫帶領", "b": [["禱告", ["為他禱告", "也為自己求恩典"]], ["合理期待", ["以聖經為準", "好好溝通"]], ["保守己心", ["驕傲與苦毒", "操控與比較"]], ["鼓勵與省察", ["鼓勵多於批評", "檢視自己"]]]}, "fw": {"q": "丈夫在屬靈上被動，妻子能做什麼？", "a": "以禱告和鼓勵，成為他最好的幫助者", "steps": ["恆切禱告，把改變交給神", "依聖經調整期待並溝通", "警醒八種心中試探"], "do": ["每天具體感謝丈夫一件事", "找敬虔姊妹與牧者同行"]}, "gold": ["愛他是我的責任，改變他是神的工作。", "禱告的妻子是丈夫最好的朋友。", "神不只在你丈夫身上工作，也在你身上工作。"], "ref": ["以弗所書 5:25", "彼得前書 3:7", "加拉太書 6:1"], "fb": "週日早上，她一個人帶著孩子去教會。\n回到家，他還在沙發上滑手機。\n她想說的話很多，最後只剩一句：「算了。」\n\n「算了」——是很多婚姻慢慢冷掉的聲音。\n\n愛他是我的責任，改變他是神的工作。\n這句話聽起來像放棄，其實是最深的信心。\n\n我們以為，丈夫不帶領，妻子只能二選一：要嘛拚命推他，要嘛乾脆自己來。\n但還有第三條路——成為他身邊那個禱告的人。\n\n妳希望他更愛神的話？禱告。\n妳希望他主動帶全家靈修？禱告。\n妳希望他溫柔地追求妳？禱告。\n妳需要智慧、需要忍耐、需要不被苦毒吞噬？也禱告。\n禱告的妻子，是丈夫最好的朋友。\n\n但禱告不是沉默。\n妳也可以調整期待：分清楚神要求他的，和妳希望他做的。\n不是每個好丈夫都會在咖啡香裡帶早晨靈修；\n但每個丈夫，都被神呼召忠於盟約、帶孩子認識基督。\n\n然後，請保護妳的心。\n驕傲說：我比他屬靈。\n應得說：我值得更好的。\n冷漠說：隨便他。\n操控說：我用別的方式逼他。\n苦毒說：要是沒有他就好了。\n比較說：別人的丈夫都比較好。\n每一個聲音都很合理，每一個聲音都在把妳拉離基督。\n\n批評像寒風，只會讓人把外套裹得更緊；\n鼓勵像陽光，才會讓人願意把手張開。\n\n妳上一次具體謝謝他，是什麼時候？\n妳的鼓勵，有沒有多過妳的嘆氣？\n他是否毫無疑問地知道——妳站在他這一邊？\n\n也許妳會說：可是他真的很少做對什麼。\n那就求神開妳的眼睛，看見他哪怕一點點的成長。\n因為神不只在他身上工作，祂也在妳身上工作。\n\n婚姻不是兩個人比賽誰比較屬靈，\n而是兩個天路客，互相攙扶，走回天家。\n有時妳在前面，有時他在前面，\n有時你們都跌坐在路邊，\n但只要仍朝同一個方向，路就還在。\n\n親愛的，別只說「算了」。\n把那句話，換成一句禱告；\n把那聲嘆息，換成一個擁抱；\n把那份失望，交給那位從不對我們失望的主。\n\n#婚姻 #妻子 #禱告 #帶領 #天路同行"}, "wife-double-his-strength": {"zh": "妻子，讓他的力量加倍", "tags": ["給妻子", "順服與帶領"], "core": "婚姻像騎雙人腳踏車：坐後座的妻子不是被動，她可以讓丈夫的力量加倍，也可以讓他寸步難行。", "sum": ["結婚就像從單車換到雙人車後座：丈夫掌方向，兩人一起經歷跌倒、風景與勝利。", "後座需要勇氣、努力與技巧；妻子只要把腳放下，就能讓整台車停下。", "第一，為他加油：讚美比指出失敗更能激勵男人。", "第二，在自己的恩賜上用力踩：像箴言31章的婦人，擴展丈夫的影響。", "第三，跟隨他的方向：忙著達成「家庭目標」時，記得對照丈夫的異象與心意。"], "mm": {"c": "雙人腳踏車", "b": [["為他打氣", ["讚美勝於數落", "說「好，而且…」"]], ["用力踩踏", ["發揮女性恩賜", "箴言31章"]], ["跟隨方向", ["對照他的異象", "信任他轉彎"]], ["反面警告", ["把腳放下就停", "親手拆毀家"]]]}, "fw": {"q": "妻子如何幫助而非阻礙丈夫？", "a": "成為加倍他力量的同伴", "steps": ["用恩慈的話鼓勵他", "全力發揮自己的恩賜", "讓自己的計畫配合他的帶領"], "do": ["把「為什麼你沒…」換成「謝謝你…」", "做決定前先問他的想法"]}, "gold": ["數落只會削弱他，鼓勵才能讓他的力量加倍。", "坐在後座不是被動，而是全力踩踏。", "先學會順服基督，順服丈夫就不再那麼難。"], "ref": ["箴言 14:1", "箴言 31"], "fb": "你騎過雙人腳踏車嗎？\n坐在後座的人，看不到前方的路，摸不到方向，\n卻得跟前面的人一起踩、一起傾斜、一起煞車。\n只要後座的人把腳放下，整台車就慢得像拖著一座山。\n\n婚姻，就是一台雙人腳踏車。\n\n很多人以為後座是被動的位置，只是被載著走。\n其實後座需要更大的勇氣——\n要在看不見前方的時候踩下去，\n要在不能掌握方向的時候信任，\n要在對方轉彎時，跟著一起傾斜。\n\n妻子手中握著一個奇妙的力量：\n她可以讓丈夫的力量加倍，\n也可以讓他寸步難行。\n智慧的婦人建立家室，愚妄的婦人親手拆毀。\n差別往往不在大事，而在每天一句話。\n\n「謝謝你。」或是「你為什麼又沒有……」\n「好，而且我們還可以……」或是「可是你想過……嗎？」\n一句讓他覺得自己更大，一句讓他覺得自己更小。\n\n很多妻子以為，丈夫不夠積極，是因為他不知道自己哪裡做錯；\n於是一次又一次，把他的失敗講得更清楚。\n但問題從來不是資訊不足，而是力氣不足。\n數落是刺，扎在他肋旁；鼓勵是肋骨，撐在他臂下。\n\n妳是他的見證人——\n從他跳上這台大車開始，\n他每一次手忙腳亂、每一次歪歪斜斜，妳都看見了。\n那麼，妳要做一個讓他羞愧的見證人，\n還是一個讓他重新挺起胸膛的見證人？\n\n後座也要用力踩。\n妳的接待、妳的智慧、妳的規劃、妳的信心、妳教養孩子的耐心——\n這些都在把整個家往前推。\n箴言三十一章那位婦人，不是丈夫的影子，\n而是讓丈夫在城門口被人敬重的力量。\n\n但最難的，是跟隨方向。\n當他轉進一條妳不想走的路，\n當他錯過妳以為該轉的彎，\n妳還願意相信那位真正掌舵的神嗎？\n\n先學會順服基督，順服丈夫就不再那麼難。\n因為妳知道，就算前座的人會迷路，\n天上的那位，從不迷路。\n\n所以，親愛的，別急著把腳放下。\n抬起頭，看他的肩膀，感覺他的傾斜，\n然後，一起踩下去。\n\n有一天，路人會轉頭看你們——\n不是因為車子多漂亮，\n而是因為兩個人，竟能騎得這麼和諧，這麼快，這麼美。\n\n#婚姻 #妻子 #鼓勵 #箴言31 #夫妻同心"}, "husband-make-her-shine": {"zh": "丈夫，讓她發光", "tags": ["給丈夫"], "core": "好的領導者讓人發光；丈夫要以崇高目標、反覆贏得她的心、基督般的服事與扶持軟弱，使妻子綻放。", "sum": ["作者以少棒教練與校園牧者為例：好的帶領能讓人脫胎換骨。", "第一，追求更高目標：為基督而活的家庭需要妻子的幫助，也給她一個好教會。", "第二，一再贏得她的心：神都反覆向亞伯拉罕確認應許，丈夫更該常說「我愛你」。", "第三，以基督的愛服事：讓她從未覺得服事她是一種負擔。", "第四，在軟弱中堅固她：用你的力量支持她的恩賜與興趣。"], "mm": {"c": "讓她發光", "b": [["崇高目標", ["為基督而活", "找好教會"]], ["贏得她心", ["常說我愛你", "公開私下的承諾"]], ["基督的愛", ["愛是動詞", "服事不嫌累"]], ["扶持軟弱", ["鼓勵她的恩賜", "以力量服事"]]]}, "fw": {"q": "丈夫怎樣帶領，妻子才會綻放？", "a": "像好教練：目標清楚、不斷肯定、犧牲服事", "steps": ["定下需要她幫助的屬神目標", "反覆用言語確認盟約之愛", "以基督捨己的愛服事她"], "do": ["今天具體告訴她你欣賞她什麼", "支持她進修或發揮恩賜"]}, "gold": ["好的帶領，會讓被帶領的人發光。", "神一再向我們確認應許，丈夫也要一再向妻子確認愛。", "最好的服事，是讓對方從不覺得自己是負擔。"], "ref": ["以弗所書 5:25-28", "創世記 12, 15, 22", "腓立比書 2:4"], "fb": "他小時候參加少棒，第一年一場都沒贏。\n第二年，換了一位教練，竟然一場都沒輸。\n同樣一群孩子，不同的帶領，完全不同的結局。\n\n好的領導者，會讓人發光。\n這句話，對丈夫而言，是一份一生的功課。\n\n很多丈夫以為，帶領就是做決定、賺錢、扛責任。\n這些都對，但還不夠。\n真正的問題是：在你的帶領下，她有沒有越來越發光？\n\n第一，給她一個值得一起奔跑的目標。\n如果你嘴上說要為主而活，生活卻只追求好學區、好房子、好車子，\n她會知道的。\n一個心裡愛主的女人，不會甘心把一生浪費在一場沒有意義的比賽。\n給她一個需要她幫助的屬神異象，也給她一間好教會。\n\n第二，一次又一次地贏得她的心。\n有個男人說：「我結婚時就說過我愛她了，如果我改變心意，會再通知她。」\n聽起來很好笑，卻是很多婚姻的真實寫照。\n神從不改變心意，卻一再向亞伯拉罕重申應許：\n在創世記十二章說，在十五章立約，在二十二章起誓。\n連信實的神都願意一再確認，我們又憑什麼吝嗇一句「我愛你」？\n\n第三，用基督的愛服事她。\n有人問一位令人敬重的妻子，她丈夫為什麼那麼敬虔。\n她說：「我從來不覺得，服事我對他來說是一種負擔。」\n這一句話，勝過一百束玫瑰。\n\n第四，在她的軟弱裡堅固她。\n你最清楚她哪裡會累、哪裡會怕、哪裡會失敗。\n你可以用這份認識去指責她，也可以用它去扶持她。\n基督看見我們最軟弱的地方，選擇的是靠近，而不是遠離。\n\n命令讓人服從，肯定讓人成長；\n控制讓人窒息，服事讓人綻放。\n\n當試探在你耳邊說：「她也有罪，她不配你的愛。」\n你願意怎麼回答？\n也許可以這樣說：「我也有罪，而基督從未停止愛我。」\n\n從一個目標，到一句承諾；\n從一個服事，到一份扶持；\n一點一點，你在她生命中成為那位好教練。\n\n有一天，你會看見她在主裡發光——\n不是因為你多耀眼，\n而是因為你甘願成為她背後那道安靜的光。\n\n#婚姻 #丈夫 #帶領 #基督的愛 #讓她發光"}, "two-hearts-that-work-as-one": {"zh": "同心合一的兩顆心", "tags": ["婚姻使命", "順服與帶領"], "core": "婚姻不是冒險的終點，也不是冒險的獎盃，而是一同踏上冒險的途徑。", "sum": ["關於婚姻與冒險有三種看法：婚姻終結冒險、婚姻完成冒險、婚姻就是冒險。", "前兩種觀點充斥文化：把婚姻當枷鎖，或當成功之後的戰利品。", "聖經的觀點是：婚姻是為使命而設立的，配偶是夥伴而不只是獎品。", "最大的冒險：婚姻講述基督與教會的愛，並使人成聖，以享受神為樂。", "普遍的冒險：生養眾多、治理全地；這需要夫妻兩人以不同方式一起完成。"], "mm": {"c": "婚姻即冒險", "b": [["三種觀點", ["終結冒險", "完成冒險", "就是冒險"]], ["最大冒險", ["述說基督與教會", "使人成聖"]], ["普遍冒險", ["生養眾多", "治理全地"]], ["頭與身體", ["分工不同", "缺一不可"]]]}, "fw": {"q": "結婚會讓人生失去冒險嗎？", "a": "不，婚姻正是神賜的冒險途徑", "steps": ["拒絕「枷鎖」與「獎盃」兩種錯誤觀點", "認識婚姻榮耀神的終極目的", "一起承擔創造的使命"], "do": ["夫妻一起寫下家庭的使命", "把帶領與跟隨看成同一場冒險的分工"]}, "gold": ["婚姻的首要目的，是幫助人藉著享受神來榮耀神。", "她不只是戰利品，更是夥伴。", "這場冒險需要兩個人——頭與身體。"], "ref": ["創世記 1:28", "創世記 2:19-24", "以弗所書 5:22-33"], "fb": "婚禮前一晚，朋友拍拍他的肩：「兄弟，從明天開始，你的自由就結束了。」\n大家都笑了。他也笑了。\n可是那天夜裡，他翻來覆去，想著：結婚，真的是冒險的終點嗎？\n\n關於婚姻與冒險，世界給了我們兩個劇本。\n第一個劇本說：婚姻是枷鎖。單身是一片無限可能的大陸，戒指一戴上，就被困在柴米油鹽的小島。\n第二個劇本說：婚姻是獎盃。先去打怪、升職、買房、成名，等功成名就，再把愛情擺上展示櫃，當作人生最後一塊拼圖。\n\n一個把婚姻當牢籠，一個把婚姻當勳章；\n一個說「結婚讓我失去」，一個說「結婚證明我擁有」。\n兩個劇本看似相反，卻有同一個前提——婚姻和冒險是敵人。\n\n可是聖經寫的是第三個劇本：婚姻就是冒險本身。\n\n她不只是你奮鬥後的戰利品，而是與你並肩作戰的同伴；\n他不只是你安穩生活的避風港，而是邀請你上路的那道門。\n像那位老巫師敲開哈比人的家門，婚姻把兩個人推出舒適圈，走上一條滿是風景、也滿是挑戰的路。\n\n這場冒險有多大？\n第一層，是最宏大的冒險：藉著享受神來榮耀神。每一對敬虔的夫妻，都在重演那個最偉大的故事——英雄屠龍、迎娶新娘、與她一同作王。基督是原版，婚姻是祂一再翻拍的縮影。\n第二層，是成聖的冒險：兩個罪人朝夕相處，把彼此磨成更像基督的樣子，一點一點長出天上的榮光。\n第三層，是使命的冒險：生養眾多、治理全地、讓神的美善遍滿每一個角落。這件事，一個人做不到；需要兩個人，以不同的方式，一起完成。\n\n如果婚姻真的是終點，為什麼神在伊甸園裡，是在給了使命之後，才把夏娃帶到亞當面前？\n如果婚姻只是獎盃，為什麼聖經從第一頁開始，就把夫妻放在故事最核心的位置？\n\n頭與身體，不是互相搶奪方向盤，而是一起朝向同一個地平線。\n他帶頭，是為了讓路更清楚；\n她同行，是為了讓路走得更遠；\n他們一起，讓仇敵沮喪，讓朋友喜樂，讓天上的父得著榮耀。\n\n所以，別相信那句「你的自由就結束了」。\n真正的自由，不是沒有人與你同行，\n而是有人與你同行，而且你們知道要往哪裡去。\n\n明天，不是故事的最後一頁。\n明天，是你們一起翻開地圖的第一天。\n願你們走得遠，走得深，\n走過山谷也走上高山，\n最後，一起走進那場永不結束的婚筵。\n\n#婚姻 #冒險 #使命 #創世記 #夫妻同行 #新婚"}, "go-get-her": {"zh": "去追求她吧", "tags": ["婚前與擇偶", "給丈夫"], "core": "對多數單身男性來說，婚姻是神的心意；與其猶豫拖延，不如憑信心勇敢去追求一位敬虔的女子。", "sum": ["作者以馬丁路德寫信鼓勵一位修士結婚為例，路德不久後自己也結了婚。", "教會裡有許多敬虔、渴望成家的姊妹在等待，部分原因是弟兄們的不成熟、懼怕或自私。", "作者分享自己飛越半個地球去認識未來妻子：她的敬虔、群體的肯定、神的話給了他勇氣。", "保羅預設多數長老都有家室；獨身是少數人的恩賜，婚姻是多數人的常態。", "與情慾爭戰卻不往婚姻邁進的人，往往還不夠認真對待情慾；婚姻是神賜的聖潔兵器。"], "mm": {"c": "勇敢追求", "b": [["路德的勸勉", ["別再空想", "歡喜去做"]], ["勇氣來源", ["她的敬虔", "群體的肯定", "神的話"]], ["神的心意", ["婚姻是常態", "獨身是少數恩賜"]], ["聖潔與婚姻", ["對抗情慾", "邁向求婚"]]]}, "fw": {"q": "單身弟兄為什麼一直不敢走入婚姻？", "a": "要剛強壯膽，把婚姻視為神的心意", "steps": ["承認拖延背後的懼怕或自私", "以聖經標準認識好妻子", "讓敬虔群體幫你確認方向"], "do": ["問自己：我為婚姻採取了什麼具體行動？", "請信任的弟兄陪你評估、鼓勵你行動"]}, "gold": ["遲疑太久，也是一種選擇。", "與情慾作戰，別只靠禁食，也要走向婚約。", "娶妻需要膽量，而膽量來自神的話與群體。"], "ref": ["創世記 2:18", "哥林多前書 7:9", "馬太福音 19:12"], "fb": "教會裡有一位三十五歲的姊妹。\n她愛主、會接待、會帶查經、渴望成家，也願意陪一個男人走上事奉的路。\n可是她只能等。因為她不能自己去追求。\n而在同一間教會的另一邊，有一群弟兄，還在想：「再等等吧，我還沒準備好。」\n\n五百年前，有一位修士寫信給馬丁路德，問自己該不該結婚。\n路德回信大意是：娶妻需要膽量，你最需要的是有人推你一把。別再想了，歡歡喜喜地去吧。\n一個月後，那位修士結婚了；兩個月後，路德自己也結婚了。\n\n遲疑太久，本身也是一種選擇。\n\n我們以為拖延是謹慎，其實有時候是害怕；\n我們以為等待是屬靈，其實有時候是懶惰；\n我們以為還沒準備好，其實是不想長大。\n永遠的伴郎，從來不是新郎；停在港口的船，永遠到不了彼岸。\n\n當然，有些人蒙召單身，那是寶貴的恩賜。\n但聖經清楚地把婚姻當作多數人的常態，連教會的長老，保羅都預設他們有家室。\n如果你沒有獨身的呼召，為什麼要活得像有？\n\n有一位弟兄，只和一位姊妹在聚會中相處了幾小時，就買了機票，飛了十三個小時到一個他在地圖上都找不到的國家，去認識她、被她的群體「審問」。\n他哪來的勇氣？\n第一，是她。她的敬虔讓他知道：如果要娶，就要娶這樣的人。\n第二，是群體。平常意見分歧的兄弟們，這次異口同聲：去吧，讓神來關門。\n第三，是神的話。聖經早已告訴他，敬畏耶和華的妻子是冠冕、是幫助、是恩賜、是榮耀。\n\n還有一件事，很少人願意說破：\n很多弟兄很認真地對抗情慾——裝過濾軟體、找問責夥伴、禁食禱告，這些都很好。\n但當被問到：「你為走向婚姻做了什麼？」卻沉默了。\n十次裡有九次，認真對抗情慾卻不認真面對婚姻的人，其實還沒有那麼認真對抗情慾。\n婚姻不是萬靈丹，卻是神所賜的聖潔兵器。\n\n弟兄們，這不是要羞辱你，而是要喚醒你。\n世界已經花太多力氣嘲笑男人了，我們要的不是更多嘲笑，而是更多勇氣。\n\n找一位敬虔的女子為目標，\n找一群敬虔的弟兄同行，\n讓神的話把你的膽量點燃。\n然後，別再空想了。\n\n去追求她吧。\n帶著禱告，帶著尊重，帶著一點顫抖也無妨。\n因為最勇敢的事，往往是在雙腿發抖的時候，仍然往前走。\n\n#婚姻 #單身 #弟兄 #勇氣 #擇偶 #路德"}, "the-happy-kind-of-hierarchy": {"zh": "快樂的那種階序", "tags": ["順服與帶領", "婚姻使命"], "core": "約拿單與拿兵器的少年，示範了健康的「頭與身體」關係：頭帶著喜樂與信心指向使命，身體全心同行。", "sum": ["每段婚姻都在宣講基督與教會；頭與身體失序，這篇講章就變成異端。", "撒母耳記上14章：掃羅躲在洞裡，約拿單卻帶著拿兵器的少年攻擊非利士人，神使全軍潰散。", "好的頭：帶著喜樂的雄心、以神的性情為根基的使命，先求證神的心意，並帶領身體同行。", "好的身體：像拿兵器的人說「我與你同心」，以女性的力量支持、補足、成全頭的使命。", "這種階序不是壓迫，而是一同打仗、一同得勝的喜樂。"], "mm": {"c": "頭與身體", "b": [["經文背景", ["掃羅懼怕躲藏", "約拿單憑信出擊"]], ["好的頭", ["喜樂的雄心", "敬虔的使命", "帶領同行"]], ["好的身體", ["我與你同心", "持盾的幫助"]], ["結果", ["神施行拯救", "喜樂的階序"]]]}, "fw": {"q": "夫妻的「頭與身體」關係實際長什麼樣？", "a": "頭引導並賦能於使命，身體全心支持成全", "steps": ["頭：以信心定下屬神的使命", "頭：求證神的心意，不魯莽", "身體：全心同行、成全使命"], "do": ["丈夫：邀請妻子一起投入具體的事工或計畫", "妻子：用「我與你同心」的態度回應"]}, "gold": ["健康的階序，不是誰壓過誰，而是一起上戰場。", "頭沒有身體，就像船沒有帆。", "好丈夫帶著喜樂與信心，把家帶向使命。"], "ref": ["撒母耳記上 14:6-23", "以弗所書 5:23, 32"], "fb": "三萬輛戰車，多如海沙的敵軍。\n以色列的王躲在山洞裡。\n王的兒子約拿單，卻轉頭對身邊那個拿兵器的少年說：「來，我們過去。耶和華使人得勝，不在乎人多人少。」\n少年回答：「隨你心裡所願的去做，我與你同心。」\n\n這不是一段婚禮常讀的經文，\n卻是我讀過最美的一幅「頭與身體」的圖畫。\n\n今天，一聽到「階序」兩個字，很多人就皺眉。\n我們以為階序就是壓迫，就是有人在上、有人在下，有人說了算、有人只能忍。\n但約拿單和拿兵器的少年，讓我們看見另一種階序——\n不是誰踩著誰，而是兩個人一起往上爬；\n不是誰壓過誰，而是兩個人一起上戰場；\n不是一個人的獨裁，而是一個使命的合唱。\n\n好的頭是什麼樣子？\n他有一種喜樂的雄心——不是為自己的名，而是為神的名。\n他的勇氣扎根在神的性情裡：耶和華使人得勝，不在乎人多人少。\n他不魯莽，先求證神的心意，敲敲門，看神是否打開。\n他不孤軍奮戰，他轉頭說：「來，我們一起。」\n\n好的身體是什麼樣子？\n她不是被拖著走的影子，而是全心同行的戰友。\n她說：「我與你同心。」這不是軟弱的附和，而是最勇敢的委身。\n就像古代的持盾女子，跟在戰士身後，用自己的力量守護、成全、放大他的出擊。\n\n頭沒有身體，像一艘沒有帆的船，哪裡也去不了；\n身體沒有頭，像一支沒有方向的箭，射得再遠也偏了靶。\n\n如果婚姻只是兩個人分配權力，那它永遠會是一場拔河。\n但如果婚姻是兩個人一起投入神的使命，它就會變成一首進行曲。\n\n掃羅躲在洞裡的時候，約拿單爬上了山崖。\n他用手腳攀爬，少年緊跟在後。\n敵人在他面前倒下，少年隨後收拾戰場。\n然後神使全營驚慌，大地震動，以色列得救了。\n\n丈夫們，你是在洞裡，還是在山崖上？\n妻子們，你是在拉他的衣角，還是在他身後舉起盾牌？\n\n每一段婚姻，都在宣講基督與教會。\n頭與身體失序，這篇講章就會走調；\n頭與身體同心，這篇講章就會讓人看見天國。\n\n願你們的家，不是一個要爭誰作主的會議室，\n而是一支彼此信任、一起衝鋒的小小軍隊。\n在那裡，帶領是喜樂的，跟隨是甘心的，\n而勝利，永遠屬於那位使人得勝的神。\n\n#婚姻 #頭與身體 #約拿單 #夫妻同心 #帶領與跟隨"}, "for-richer-for-poorer": {"zh": "無論富足或貧窮", "tags": ["金錢"], "core": "夫妻的金錢目標不該是美國夢，而是一同管家、慷慨奉獻、在永恆裡投資——這帶來真正的喜樂。", "sum": ["作者與已故妻子 Nanci 的理財成長與靈命成長並行，奉獻的討論反而使婚姻更緊密。", "愛錢是萬惡之根；財物有「重力」，會漸漸把夫妻拉離神、教會與彼此。", "優先慷慨奉獻：建議至少十分之一；神使我們富足，是要提高奉獻標準，不是生活標準。", "夫妻對奉獻意見不同時，手牽手同行，不要推也不要拉。", "一起記帳、訂預算（例如信封法），先求神的國，信靠神供應。"], "mm": {"c": "屬神的理財", "b": [["物質主義的危險", ["財物的重力", "你的帳單顯示你的心"]], ["慷慨奉獻", ["至少十一", "提高奉獻標準"]], ["夫妻同心", ["手牽手", "不推不拉"]], ["預算儲蓄", ["記錄支出", "信封法"]]]}, "fw": {"q": "夫妻該如何一起管理金錢？", "a": "承認一切屬神，以奉獻與預算一同管家", "steps": ["辨識物質主義的陷阱", "把慷慨奉獻放在第一位", "一起討論、訂預算、明智儲蓄"], "do": ["一起檢視過去一個月的支出明細", "訂下固定的奉獻比例並堅持"]}, "gold": ["重要的不是賺多少，而是留多少給自己。", "神使人富足，是為了提高奉獻的標準。", "施比受更有福——那是真正的快樂，不是責任。"], "ref": ["提摩太前書 6:9-10, 19", "使徒行傳 20:35", "馬太福音 6:21, 33", "哥林多後書 9:11"], "fb": "銀行打來電話：「您的房貸申請，沒有通過。」\n掛掉電話後，客廳很安靜。\n他開始算，她開始嘆氣，孩子在房間裡問：「爸爸媽媽在吵架嗎？」\n\n我們以為，金錢問題是數學問題。\n其實，金錢問題常常是心的問題。\n\n你的錢去了哪裡，你的心就在哪裡。\n耶穌幾乎是在說：給我看你的帳單和刷卡紀錄，我就能告訴你，你真正愛的是什麼。\n\n很多夫妻的理財目標，是更大的房子、更好的車、更多的玩具、更厚的退休金。\n可是，這是誰的夢想？\n是美國夢，是台灣夢，還是那位復活之主的夢？\n\n財物是有重量的，重量會產生引力，\n引力會把我們拉進它的軌道。\n一對新婚夫妻，起初常一起散步、玩桌遊、讀書，日子簡單卻知足；\n後來收入增加了，優先次序也慢慢變了——\n神往後退一點，教會往後退一點，彼此相處的時間也往後退一點。\n賺得多不是問題，留給自己多才是問題。\n\n有一對夫妻，把奉獻放在第一位。\n先決定一個比例，至少十分之一，然後堅持。\n丈夫說：「如果你的薪水減少一成，你會活不下去嗎？」\n當然不會。那為什麼我們不敢把那一成先歸給神？\n\n他也坦承，起初他熱心奉獻，卻讓妻子覺得自己和孩子的需要被忽略。\n後來他學會先對家人慷慨，妻子也漸漸在奉獻中找到喜樂。\n他們不推也不拉，而是手牽著手；\n有時一個人走在前面，但兩人始終牽著。\n多年以後，走在前面的，常常是她。\n\n神使我們富足，不是為了提高生活的標準，\n而是為了提高奉獻的標準。\n\n然後，一起坐下來，記下錢去了哪裡，再決定錢應該去哪裡。\n有些家庭收入不高，卻因為有預算而過得安穩；\n有些家庭收入很高，卻永遠在財務危機裡打轉。\n信封法看起來很老派，卻教會我們一件很新的事：資源是有限的。\n\n當娛樂的信封空了，這個月就不再外食；\n當某處超支了，就在別處省下來。\n這不只是理財，這是操練知足；\n這不只是記帳，這是學習信靠。\n\n施比受更為有福。\n那個「福」字，原文是「使人快樂」。\n原來慷慨不是義務的苦差，而是快樂的祕密。\n\n無論富足或貧窮——\n願你們的錢包，不是決定你們關係的主人，\n而是你們一起在永恆裡投資的工具。\n因為有一天，所有的帳戶都會歸零，\n只有天上的財寶，會在那天閃閃發亮。\n\n#婚姻 #理財 #奉獻 #夫妻同心 #天上的財寶"}, "bring-out-her-best": {"zh": "成全她最好的一面", "tags": ["給丈夫"], "core": "好丈夫像園丁一樣，以愛她與帶領她兩個姿態，在神手中培育出妻子最美好的樣子。", "sum": ["結婚後，男人與神的關係也改變了：怎麼對待妻子會影響禱告是否蒙垂聽。", "丈夫的門徒之路要穿過婚姻的每個房間；壞丈夫不可能是好基督徒。", "「丈夫」一詞有耕耘之意：好丈夫在妻子的靈魂花園裡勞苦，讓她綻放。", "愛她：享受她、服事她（包括家務與屬靈餵養）、公開稱讚她，尊重她是同承生命之恩的人。", "帶領她：以神的話和屬靈節奏帶領全家，使她常坐在主腳前。"], "mm": {"c": "成全她", "b": [["新身分", ["禱告受影響", "門徒之路經過婚姻"]], ["愛她", ["享受她", "服事她", "稱讚她"]], ["尊重她", ["同承生命之恩", "內在的美"]], ["帶領她", ["神的話", "屬靈節奏"]]]}, "fw": {"q": "丈夫的呼召可以怎麼概括？", "a": "好丈夫會帶出妻子最好的一面", "steps": ["向內：喜愛、享受她", "服事：分擔實際與屬靈的重擔", "向外：公開肯定她的美德"], "do": ["這週寫一張意想不到的情書", "安排固定時間讓她能親近主"]}, "gold": ["丈夫對待妻子的方式，會直接影響他的禱告。", "敬虔女子的美，常在敬虔男子的土壤中盛開。", "丈夫最常犯的錯，不是過度讚美，而是沉默。"], "ref": ["彼得前書 3:7", "以弗所書 5:25-30", "箴言 31:28-29", "傳道書 9:9"], "fb": "他在小組裡禱告得很流利，在公司裡是可靠的主管，在球場上是熱心的教練。\n可是那天晚上，他跪下來禱告，卻覺得天好像關上了。\n因為就在一小時前，他對妻子說了一句很冷的話。\n\n彼得說：丈夫要按情理和妻子同住，免得你們的禱告被阻礙。\n原來，丈夫怎樣對待妻子，會直接影響神怎樣聽他的禱告。\n\n一個人結婚的那天，他和神的關係也換了形狀。\n他不再只是一個單身的門徒，\n他成了一個頭，有了一個身體；\n成了亞當，有了夏娃；\n成了丈夫，有了妻子。\n從此，他跟隨耶穌的路，要穿過婚姻的每一個房間。\n\n一個壞丈夫，可以是好員工、好教練、好鄰居，\n卻不可能是一個好基督徒。\n\n「丈夫」這個字，在英文裡有「耕耘」的意思。\n好丈夫像一位園丁，跪在妻子靈魂的花園裡，\n在聖靈手中當一把鏟子，\n讓花苞綻放，讓種子結果。\n\n這不是說女人沒有男人就不行——路得、亞比該、亞拿都是明證；\n也不是說丈夫敬虔，妻子就一定敬虔；\n但大多時候，敬虔女人的美，是在敬虔男人的土壤裡盛開的。\n\n怎麼做？兩個姿態：愛她，帶領她。\n\n愛她，是向內的姿態。\n像亞當第一次看見夏娃時忍不住唱歌，\n像雅歌裡的新郎看著新婦失了神，\n像箴言的丈夫在城門口稱讚他的妻子。\n愛會笑、會跳舞、會寫一張不在節日裡的小紙條，\n愛不讓孩子、工作、帳單，把當年那首歌唱停。\n\n愛也是服事：洗碗、陪孩子、讓她有一個安靜的下午；\n更深的服事，是問：我怎樣讓她常常坐在主腳前？\n\n愛還是讚美。\n大部分丈夫的錯，不是讚美得太多，\n而是當妻子活出值得稱讚的樣子時，我們沉默了。\n\n帶領她，是向外的姿態。\n不是發號施令，而是把神的話帶進家的節奏，\n讓禱告、讀經、敬拜，成為全家呼吸的空氣。\n\n指責會讓一朵花低頭，\n欣賞會讓一朵花抬頭。\n有些花看見太陽才抬起頭；\n很多妻子，是看見一個歡喜欣賞她的丈夫，才抬起頭來。\n\n丈夫們，你今天讓她低頭，還是抬頭？\n你是她生命中的寒霜，還是春雨？\n\n願你一生都做一個園丁，\n不急躁、不放棄、不邀功；\n有一天，當人們讚嘆這座花園的美麗，\n你會安靜地站在一旁，\n心裡知道：最好的園丁不是我，是那位使萬物生長的主。\n\n#婚姻 #丈夫 #愛她 #帶領 #彼得前書 #成全她"}, "temptations-common-to-marriage": {"zh": "婚姻常見的試探", "tags": ["衝突與修復", "順服與帶領"], "core": "每段婚姻都會面對三種試探：認錯敵人、聽從背離神的聲音、把婚姻變成偶像；唯有基督是出路。", "sum": ["作者在婚前輔導中扮「黑臉」，戳破戴著粉紅眼鏡看婚姻的盲點。", "第一，認清真正的敵人：撒但要的是夫妻「友軍誤擊」，所以要打屬靈的仗，而不是夫妻之戰。", "第二，拒絕違背神的聲音：撒但顛倒創造次序；夫妻要被聖靈和神的話充滿。", "第三，不要把婚姻偶像化：亞當的罪在於選擇妻子過於神；為了得到想要的而犯罪，就是偶像。", "以弗所書1-3章的恩典，是活出5章婚姻的根基。"], "mm": {"c": "三種試探", "b": [["認錯敵人", ["配偶不是敵人", "穿戴全副軍裝"]], ["違背神的聲音", ["創造次序被顛倒", "被神的話充滿"]], ["婚姻偶像化", ["亞當聽從妻子", "為所欲而犯罪"]], ["解藥", ["福音恩典", "以弗所書1-3章"]]]}, "fw": {"q": "為什麼基督徒婚姻也會陷入困境？", "a": "撒但攻擊婚姻，唯有基督是可靠解答", "steps": ["打屬靈的仗，而非互相攻擊", "以神的話過濾所有聲音", "找出驅使犯罪背後的偶像並悔改"], "do": ["吵架時提醒自己：對方不是敵人", "夫妻固定一起讀經"]}, "gold": ["你在跟錯誤的敵人打仗。", "撒但最愛的戰術是讓夫妻互相開火。", "願意為得到某樣東西而犯罪，那東西就是偶像。"], "ref": ["以弗所書 5-6", "創世記 3", "雅各書 4:1-7"], "fb": "婚前輔導的第一次見面，他對那對準新人說：\n「我太太會是好警察，我會是壞警察。」\n接下來六週，他一直板著臉，專門戳洞。\n他不是不喜歡婚禮，而是太愛婚姻，所以太恨離婚。\n\n戴著粉紅色眼鏡走進婚姻的人，\n常常在蜜月結束前，眼鏡就碎了。\n然後他們發現，那些「無法調和」的問題，其實一直都在。\n\n每一段婚姻，都會遇到三種試探。\n\n第一，認錯敵人。\n很多夫妻的家，不像玫瑰花園，像戰場。\n你沒有發瘋，這真的是一場戰爭——\n只是你一直對錯了人開槍。\n撒但在伊甸園研究過亞當，然後牠沒有直接找他，牠找了他的新娘。\n牠的戰術從來沒變：讓夫妻友軍互射。\n一個家若自相紛爭，就站立不住。\n\n所以，配偶不是你的敵人。\n真正的爭戰，不是夫妻之戰，而是屬靈之戰；\n真正的兵器，不是尖銳的話語，而是神全副的軍裝。\n\n第二，聽從背離神的聲音。\n蛇問夏娃：「神豈是真說？」\n一句問話，就把創造的次序翻轉了：\n蛇在帶領，夏娃在跟隨，亞當在附和，神被放到最底下。\n今天，同樣的聲音仍在耳邊低語：\n要妻子抗拒順服，要丈夫逃避帶領。\n那聲音可能來自社會，來自朋友，甚至來自自己的心。\n凡與神的話相反的，都是仇敵的聲音。\n\n第三，把婚姻變成偶像。\n亞當的罪，是「聽從了妻子的話」。\n聽妻子的話有錯嗎？當然沒有——神正是為此把她賜給他。\n錯的是，他選擇了她，過於選擇神。\n撒但最狡猾的地方，就是利用一個男人對妻子的喜愛，讓他背向神。\n\n任何時候，你願意為了得到某樣東西而犯罪，\n或因為得不到某樣東西而犯罪，\n那樣東西，就是你的偶像。\n\n我們以為婚姻的問題在婚姻裡，\n其實婚姻的出路在婚姻之外——在基督裡。\n保羅寫以弗所書，先用三章講恩典，第五章才講夫妻。\n沒有一到三章的福音，第五章就只是一張做不到的清單。\n\n所以，當戰火又起，請先放下槍；\n當聲音又響，請先打開聖經；\n當你想要的比神更重要，請先跪下來。\n\n然後你會發現，\n你們從來不是彼此的對手，\n而是站在同一條戰壕裡，\n被同一位元帥，帶領著得勝的戰友。\n\n#婚姻 #屬靈爭戰 #以弗所書 #夫妻 #試探"}, "romance-can-ruin-you": {"zh": "浪漫可能毀了你", "tags": ["婚前與擇偶", "福音與奧祕"], "core": "浪漫是神所賜的美好，但一旦成為神就會毀掉人；我們對愛最深的渴望，指向羔羊的婚筵。", "sum": ["作者年輕時雖常讀經上教會，實際上卻把戀愛和婚姻當成能滿足靈魂的神。", "渴望婚姻本身是好的：神照自己形像造男造女，婚姻講述三一神的愛與基督愛教會的故事。", "但墮落後，浪漫不再安全：躲藏、指責、爭奪、痛苦接踵而來。", "把只有神能給的期待加在浪漫上，就導致性罪、色情、離婚與絕望。", "真正的婚姻在將來：基督再來的羔羊婚筵；健康的婚姻從那裡得到力量。"], "mm": {"c": "浪漫與偶像", "b": [["好的渴望", ["得妻是得好處", "神形像男女"]], ["壞的渴望", ["墮落後的破碎", "把浪漫當神"]], ["後果", ["性罪與色情", "離婚與絕望"]], ["真正的婚姻", ["羔羊婚筵", "婚姻是彩排"]]]}, "fw": {"q": "為什麼戀愛和婚姻常讓人失望？", "a": "因為我們要它給出只有神能給的東西", "steps": ["承認浪漫是神所賜的好禮物", "看見罪如何扭曲它", "把終極渴望轉向基督與羔羊婚筵"], "do": ["檢視：我是否期待另一半滿足我的一切？", "把戀愛或婚姻放回神之下的位置"]}, "gold": ["浪漫成了神，就變成恐怖分子。", "我們對愛最深的渴望，是對婚姻之上那場婚姻的渴望。", "健康快樂的婚姻，從那將來的婚筵汲取力量。"], "ref": ["創世記 1:26-27", "創世記 3", "箴言 18:22", "啟示錄 19:7-8"], "fb": "他從小就讀經，幾乎從不缺席聚會。\n可是如果你仔細看他的青春，你會以為他真正信的神，叫做「戀愛」。\n太早交往，太常交往，在情感和身體上都走得太遠。\n一段接一段，他把神給他的金子，一塊一塊熔掉，鑄成一頭金牛犢。\n\n浪漫一旦成了神，就會變成一個恐怖分子。\n\n我們以為，渴望愛情是軟弱，是情慾，是需要被壓抑的東西。\n其實，渴望愛情本身是好的。\n得著妻子的，就是得著好處——那麼渴望妻子的，就是渴望好處。\n\n神在創造的最高潮，照著自己的形像造人，\n而且不只是造男，而是造男造女。\n祂把自己的形像，刻在一對夫妻身上。\n婚姻之愛，在最好的時候，述說著宇宙最深的故事：\n父、子、聖靈之間的愛，以及聖子對新婦的愛。\n\n可是，蜜月很短。\n創世記第三章，蛇溜進了新房，掀翻了婚床，在客廳放了一把火。\n他們第一次躲藏，第一次害怕神，\n丈夫第一次指責，妻子第一次和丈夫搶方向盤，\n痛苦第一次敲門，從此不走。\n\n從那天起，浪漫不再安全。\n赤身露體，從坦然變成脆弱；\n愛情，從伊甸變成戰場。\n\n他年輕時的錯，不是想要浪漫，\n而是要浪漫給他只有神能給的東西；\n然後還要求真神，盡快把他的假神送到門口。\n結果，他得到的不是滿足，而是更深的孤單。\n\n為什麼性的罪這麼猖獗？\n為什麼色情能賺那麼多錢？\n為什麼離婚、憂鬱，甚至輕生，都常和愛情有關？\n不正是因為我們向愛情索取了它給不起的東西嗎？\n\n我們對愛最深、最純、最強烈的渴望，\n其實是在渴望一場超越婚姻的婚姻。\n有一天，天要降到地，基督要駕雲再來，\n那時，羔羊的婚筵要開始，新婦要穿上光明潔白的細麻衣，\n新郎要對她唱出最初那首歌：這是我骨中的骨，肉中的肉。\n\n健康又幸福的婚姻，不是因為兩個人終於找到彼此，\n而是因為兩個人一起，從那場將來的婚筵汲取力量。\n\n所以，如果你曾在浪漫的祭壇前下拜，\n別只是把祭壇拆掉，\n請抬起頭，看見那一位更大的愛。\n\n戀愛可以是一盞燈，但它不是太陽；\n婚姻可以是一首歌，但它不是那整部交響樂；\n當你把愛情放回神的手中，\n它就會從一個恐怖分子，\n變回一個溫柔的僕人，帶你走向真正的家。\n\n#婚姻 #戀愛 #偶像 #羔羊婚筵 #單身"}, "outdo-one-another": {"zh": "彼此爭先", "tags": ["溝通與親密", "順服與帶領"], "core": "「彼此順服」不會取消夫妻各自的角色，卻會讓婚姻充滿互相尊重、關心與服事的「爭先」氛圍。", "sum": ["以弗所書5:21的彼此順服，出現在夫妻、親子、主僕的教導之前，塑造了所有關係。", "彼此順服不會讓妻子成為丈夫的頭，但會讓基督徒婚姻與世俗婚姻明顯不同。", "在說話上順服：不打斷對方、真心想先聽對方說。", "在認錯上順服：即使覺得自己大致沒錯，也先為語氣道歉，並願意聽對方指正。", "在服事上順服：搶著做家務、為對方騰出靈修、休息與交友的空間。"], "mm": {"c": "彼此順服", "b": [["經文基礎", ["以弗所書5:21", "角色不被取消"]], ["說話", ["不打斷", "真心想先聽"]], ["認錯", ["先為語氣道歉", "求主使我謙卑"]], ["服事", ["搶著做家務", "給對方空間"]]]}, "fw": {"q": "夫妻之間的「彼此順服」具體是什麼？", "a": "一場安靜的競賽：搶著把對方放在前面", "steps": ["在言語上等候、聆聽", "在衝突後主動認錯", "在日常中搶先服事"], "do": ["這週練習一次「你先說，我想聽」", "主動接手一件對方平常做的家務"]}, "gold": ["彼此順服不會抹去角色，卻會改變角色的溫度。", "說「你先說」時，要真心想聽，而不只是等輪到自己。", "最好的婚姻，是一場搶著讓對方優先的比賽。"], "ref": ["以弗所書 5:18-33", "以弗所書 6:1-4"], "fb": "兩個人同時開口：「我覺得……」\n然後同時停下來：「你先說。」\n可是，說「你先說」的那個人，心裡其實在等：等你說完，我要說我的。\n\n以弗所書第五章，在講到夫妻之前，先有一句很容易被跳過的話：\n「當存敬畏基督的心，彼此順服。」\n\n有人擔心，彼此順服會抹去夫妻的角色。\n其實不會。\n父母和兒女、主人和僕人，各自的責任都還在；\n丈夫仍要像基督捨己那樣愛妻子，妻子仍要像教會順服基督那樣順服丈夫。\n但彼此順服，會改變這些角色的溫度。\n\n彼此順服，不會取消角色，卻會讓角色充滿溫柔；\n它不會讓妻子變成丈夫的頭，卻會讓基督徒的家，和世界的家看起來完全不同。\n如果更多人看見這樣的婚姻，\n「順服」這兩個字，也許就不會那麼刺耳了。\n\n那是什麼樣子？\n一句話：一場安靜的競賽，大家都搶著讓對方先。\n\n在說話上，彼此順服是等候。\n不是那種「老夫老妻接話接得很溫馨」的打斷，\n而是那種「我聽夠了，現在換我教你」的打斷——那種，要停下來。\n當兩人同時開口，真心說：「我想先聽你的。」\n當年紀漸長、思緒容易斷，就說：「我還有一個想法，但你先說，免得你忘了。」\n\n在衝突後，彼此順服是認錯。\n吵完架，良心開始輕輕刺你一下——那是黃金時刻。\n即使你覺得自己大致是對的，也可以先說：\n「對不起，我剛剛的語氣很不好。你願意告訴我，我還有哪裡錯嗎？我不會馬上反駁，我會想一想、禱告一下，再回來找你。」\n這很難。所以在說之前、說的時候、說完以後，都需要禱告：\n主啊，使我謙卑；主啊，讓我真心；主啊，開我的眼睛。\n\n在日常裡，彼此順服是服事。\n搶先關最後一盞燈，搶先下樓查看奇怪的聲音，\n搶先倒一杯水放在床邊，搶先把碗洗好。\n也搶先為對方騰出時間——讓他去讀經，讓她去見朋友，\n讓對方有空運動、休息、獨處。\n\n世界的婚姻常問：「我得到了什麼？」\n基督徒的婚姻學著問：「我還能給什麼？」\n世界的競爭是爭第一，\n天國的競爭是讓別人先。\n\n你們家，最近在比賽什麼？\n比誰比較累、誰比較委屈、誰比較對？\n還是比誰先伸手、先低頭、先說謝謝？\n\n願你們的家，\n每天都有一點點這樣的比賽，\n沒有輸家，\n只有兩個越來越像基督的人，\n和一位在旁邊微笑的主。\n\n#婚姻 #彼此順服 #以弗所書 #溝通 #服事"}, "wander-away-to-her": {"zh": "為她神魂顛倒", "tags": ["給丈夫", "性與親密"], "core": "新婚的迷戀會褪去，但神命令丈夫要「常常戀慕」妻子——用信心的眼光重新看見她。", "sum": ["作者借路易斯描寫初戀的魔力，對比婚後「安定下來」的平淡。", "婚姻多了友誼與合作，但可能少了戀人之間的詩意與專注。", "箴言5章命令丈夫「常常被她的愛迷住」，原文有「被引離正路」之意：讓自己被她吸引而迷失時間。", "我們的心容易因熟悉而變得遲鈍，卻被新鮮事物吸引，所以需要這道命令。", "好丈夫的第一步，是照聖經的眼光看她：她是不朽的靈魂、與基督同作後嗣的人。"], "mm": {"c": "常常戀慕她", "b": [["初戀與平淡", ["迷戀褪去", "只剩簡訊與表情符號"]], ["箴言5章", ["常被她的愛迷住", "她是可愛的母鹿"]], ["心的遲鈍", ["熟悉使人盲目", "新鮮使人分心"]], ["重新看見", ["用信心的眼光", "像雅歌的讚美"]]]}, "fw": {"q": "婚後激情冷卻了怎麼辦？", "a": "順服神的命令，刻意讓自己再次被她吸引", "steps": ["承認熟悉帶來的遲鈍", "把箴言5章當成命令來遵行", "培養用聖經眼光看妻子的習慣"], "do": ["放下手機，專心與她相處一段時間", "具體讚美她的美麗與品格"]}, "gold": ["得著了，不代表可以不再追求。", "丈夫最該「迷失」的地方，是妻子的愛。", "看見她的第一步，是記得她是誰：神所救贖的人。"], "ref": ["箴言 5:18-19", "雅歌 4:9", "雅歌 2:7"], "fb": "還記得剛認識她的時候嗎？\n她的聲音，像你一直想記起卻怎麼也想不起來的某首歌；\n和她隨便聊十分鐘，比世上所有別的女人加起來都珍貴。\n那時候，你們說「戀愛了」。\n\n幾年後呢？\n你娶了她。世界恢復正常。\n那首歌你好像記起來了，然後就不再想了。\n孩子出生後，和她好好聊十分鐘，變成一件幾乎不可能的事。\n人們說：「你們安定下來了。」\n\n得到了很多，也失去了一些。\n她就睡在你身邊，有些日子卻比從前更遠。\n你們成了更好的朋友，更好的家庭合夥人，\n可是，還是更好的戀人嗎？\n那些需要時間和專注的情詩，是不是變成了縮寫的訊息和千篇一律的表情符號？\n\n箴言裡，一位父親對兒子說：\n要喜悅你年少時所娶的妻，她是可愛的母鹿，可喜的母羊；\n你要常常戀慕她的愛。\n\n「戀慕」那個字，原文有「被引離正路」的意思。\n父親在說：兒子，要讓自己為她迷失。\n迷失在時間裡，迷失在她的笑裡，迷失到忘了手機在哪裡。\n\n我們最容易迷失的地方，往往不是她，\n而是工作、野心、螢幕、無止盡的待辦清單。\n奇怪的是，人會因為擁有而變得冷淡，\n會因為熟悉而變得遲鈍，\n卻會因為新鮮而眼睛發亮。\n\n所以，我們需要一位父親，在婚禮那天提醒我們，\n在十週年那天再提醒一次：\n兒子，要讓自己一直被她吸引，被引離那些比較不重要的路。\n\n婚前，我們被勸「不要驚動、不要叫醒我所親愛的，等他自己情願」；\n那時我們的心像脫韁的馬，一刻也等不及。\n如今時候到了，天也微笑了，\n我們的愛卻打起瞌睡，晚上九點就撐不住了。\n這不是很諷刺嗎？\n\n我們住在一顆不停旋轉、繞著巨大火球飛行的星球上，\n卻打個呵欠，說：「今天只是個普通的星期二。」\n我們身邊躺著一個不朽的靈魂——\n一個被基督救贖、被聖靈內住、與基督同作後嗣的女人，\n卻說：「她就是孩子的媽。」\n\n好丈夫的第一課，是用信心的眼睛重新看她。\n像畫家凝視一幅肖像，\n像亞當從沉睡中醒來，第一次看見夏娃。\n\n今晚，放下手機吧。\n不是為了完成一項婚姻任務，\n而是為了再一次，讓自己迷路——\n迷路在她的眼睛裡，\n迷路在那首你差點忘記的歌裡，\n迷路在那份，神親手為你預備的愛裡。\n\n#婚姻 #丈夫 #戀慕 #箴言 #重新看見她"}, "keep-them-from-sex": {"zh": "讓他們遠離性愛（魔鬼書信）", "tags": ["性與親密", "外遇與試探"], "core": "以魔鬼寫信的諷刺手法，揭露撒但如何藉著乾涸夫妻性生活來為外遇與色情鋪路。", "sum": ["仿路易斯《地獄來鴻》，老魔鬼教導小魔鬼如何破壞一對新婚夫妻。", "策略不是直接引向色情或外遇，而是先讓夫妻的床「乾涸」，正如保羅警告「不可彼此虧負」。", "第一招：用熟悉感冷卻熱情，讓一夫一妻顯得單調乏味。", "第二招：讓丈夫拿色情的幻想對照真實的妻子而失望，並在被拒絕時自憐、懷怨。", "第三招：讓妻子在疲憊、孩子與荷爾蒙變化中，覺得丈夫的需要是不體貼。"], "mm": {"c": "撒但的計謀", "b": [["總策略", ["先讓婚床乾涸", "再引向別處"]], ["冷卻熱情", ["熟悉生厭", "忙碌苦毒無聊"]], ["誤導丈夫", ["色情的假期待", "自憐與怨恨"]], ["使妻子疲乏", ["孩子與疲累", "覺得他不體貼"]]]}, "fw": {"q": "為什麼夫妻性生活是屬靈爭戰？", "a": "撒但利用婚床的冷淡，製造試探的破口", "steps": ["識破「熟悉生厭」的謊言", "拒絕用色情標準衡量配偶", "正視疲累與差異，彼此體恤"], "do": ["夫妻坦誠談論彼此的需要", "不要讓怨氣與疲憊長期取代親密"]}, "gold": ["撒但不急著拉人去外遇，牠先讓婚床變冷。", "色情裡的假人，永遠不會累、不會哭，也不真實。", "不可彼此虧負，免得撒但趁虛而入。"], "ref": ["哥林多前書 7:3-5", "以弗所書 4:27", "彼得前書 2:11"], "fb": "如果魔鬼寫一封信，教牠的小徒弟怎麼破壞一對新婚夫妻，\n牠會先叫徒弟把男人帶去看色情嗎？\n會先安排一個迷人的同事嗎？\n不。牠會說：別急。先讓他們的婚床，慢慢變冷。\n\n這是一個令人不安的想像，卻揭露一個真實的戰術。\n保羅說：夫妻不可彼此虧負，免得撒但趁著你們情不自禁引誘你們。\n原來，婚床的冷淡，常常是試探的前門。\n\n我們以為，外遇是突然發生的；\n其實，它常常是從家裡的一段沉默開始的。\n\n第一步，用熟悉冷卻熱情。\n世界把婚外的性包裝得色彩繽紛，像在禁止的瀑布下自由奔跑；\n把婚內的性說成一成不變：「跟同一個人五十年？」\n牆上那幅畫，看久了就看不見；重複播放的交響曲，聽久了就聽不到。\n忙碌、苦毒、無聊，一夜一夜睡在床的兩邊。\n幾個孩子、幾次爭吵以後，那座曾經充滿驚奇的花園，長滿了雜草。\n\n第二步，用幻想誤導丈夫。\n讓他心裡浮出一句話：「這和我想像的不一樣。」\n其實他沒說出口的是：「這和色情不一樣。」\n螢幕裡的女人永遠想要、沒有孩子、不會吵架、不會累、不會哭、不需要被理解；\n真實的妻子會累、會分心、會有傷口、會需要談話。\n當她太疲倦而拒絕時，讓他自憐，讓他懷著怨氣入睡——\n自憐，是男人最危險的朋友。\n\n第三步，用疲憊消磨妻子。\n荷爾蒙的季節、孩子掛在手臂上的日子、被各種需要拉扯到極限的神經，\n然後讓她心想：「他怎麼這麼不體貼，在我這麼累的時候還想要？」\n白天塞滿好事，晚上塞滿倦意。\n\n一個越來越苦毒懶散，一個越來越麻木滿足，\n而那封信的作者，越來越得意。\n\n讀到這裡，你會不會心頭一緊？\n有沒有哪一句，正寫著你們家的現況？\n\n認出戰術，就是破解戰術的開始。\n熟悉不一定生厭，它也可以生出深度；\n幻想不是標準，真實才是禮物；\n疲憊不是敵人，冷漠才是。\n\n所以，丈夫們，別拿螢幕裡的假人，來衡量你身邊的真人；\n妻子們，別讓疲憊替你說出「你不體貼」，先說出「我好累，你抱抱我」；\n夫妻們，一起把婚床當成屬靈戰場上的一塊陣地，而不是一個可有可無的角落。\n\n神設計的親密，不是短暫的煙火，\n而是一盆慢慢燒熱的炭火。\n它需要添柴，需要守護，需要兩個人一起蹲下來吹氣。\n\n不要讓那封信得逞。\n今晚，向對方靠近一點點，\n那一點點的溫度，\n就是你們對仇敵最溫柔、也最堅定的反擊。\n\n#婚姻 #親密 #屬靈爭戰 #哥林多前書7章 #夫妻"}, "your-husband-will-be-perfect": {"zh": "你的丈夫終將完全", "tags": ["給妻子", "衝突與修復"], "core": "活在光中的妻子會接受兩個真理（他仍是罪人、他正在成長），並拒絕兩個謊言（我比他義、他永遠不會改變）。", "sum": ["福音能叫死人復活，也能改變普通的夫妻，但需要時間，所以要「住在光中」。", "真理一：丈夫仍是罪人，會驕傲、急躁、失敗；光讓我們看清罪，不再驚訝。", "真理二：他正在成長；在光中，他會越來越看見罪並知道怎麼對付。", "謊言一：「我比他更義。」十字架使人平等；不要用自己的罪回應他的罪。", "以恩慈、憐恤、饒恕回應，並持續認自己的罪。"], "mm": {"c": "住在光中", "b": [["真理一", ["他仍是罪人", "不再驚訝"]], ["真理二", ["他正在成長", "福音的能力"]], ["謊言一", ["我比他更義", "十字架使人平等"]], ["回應", ["生氣卻不犯罪", "彼此饒恕"]]]}, "fw": {"q": "妻子該怎麼面對丈夫的失敗？", "a": "在基督的光中調整期待", "steps": ["接受他仍是罪人", "相信他正在成長", "拒絕自義，持續饒恕"], "do": ["丈夫犯錯時，先省察自己的回應", "為他的成長具體禱告"]}, "gold": ["神比你更清楚丈夫的缺點，也比你更有智慧。", "真理讓理想不落空，也讓悲觀有盼望。", "別讓他的罪，成為你犯罪的藉口。"], "ref": ["以弗所書 5:8-14", "以弗所書 4:26-32"], "fb": "半夜起床上廁所，你會開燈嗎？\n一位住在德州的媽媽說：一定要開。\n不然你可能會踩到一隻德州尺寸的蟑螂。\n\n光，不會製造蟑螂；光只是讓你看見牠。\n婚姻裡也是這樣。\n\n保羅在教導夫妻之前，先引用了一首詩：\n「你這睡著的人當醒過來，從死裡復活，基督就要光照你了。」\n福音能叫死人復活，當然也能改變平凡的丈夫和妻子。\n只是，這改變不是自動的，也不是一夜之間的。\n所以保羅說：要住在光中。\n\n住在光中的妻子，會接受兩個真理，拒絕兩個謊言。\n\n第一個真理：他仍是罪人。\n他會驕傲、會急躁、會疏忽、會失敗，\n會在要捨己愛妳的地方，選擇了自己。\n光照出來，妳就不再驚訝。\n不驚訝，不是因為冷漠，而是因為清醒。\n\n第二個真理：他正在成長。\n如果他已經醒過來、活過來，基督就正在光照他。\n他會越來越看見自己的罪，也知道該怎麼對付它。\n他手中不只有一隻厚底鞋，而是神全副的軍裝。\n\n這兩個真理要一起握著：\n只看見他是罪人，妳會失望；\n只相信他會成長，妳會天真；\n兩個一起看，理想就不會落空，悲觀也會有盼望。\n\n第一個謊言：「我比他更義。」\n我們都有過那種時刻——心裡默默覺得，自己比丈夫更屬靈、更成熟、更好。\n可是十字架是一個讓所有人一樣高的地方。\n我們需要耶穌的寶血，一點也不比他少。\n更危險的是，自義會讓我們用自己的罪，去回應他的罪：\n尖酸的話、冷戰、報復的計畫、絕望的嘲諷、不肯饒恕。\n\n生氣是對傷害的自然反應，\n但「生氣卻不要犯罪」——因為真正的敵人，不是丈夫，\n而是躲在他失敗後面、想藉妳的怒氣反客為主的那一位。\n\n那條光明的路是：以恩慈相待，存憐憫的心，彼此饒恕，\n正如神在基督裡饒恕了我們。\n\n妳願意在他認罪的時候，給出神給妳的那份恩典嗎？\n即使不是不痛，但仍然願意？\n\n「妳的丈夫終將完全。」\n這句話不是今天的事實，卻是那一天的應許。\n在那之前，神看他的缺點比妳看得更清楚，\n祂的智慧也比妳更高。\n\n所以，把燈打開吧。\n不是為了找他的蟑螂，\n而是為了讓你們兩個，都在同一道光裡，\n一步一步，走向那個不再有黑夜的早晨。\n\n#婚姻 #妻子 #住在光中 #饒恕 #以弗所書"}, "will-my-marriage-ever-be-more": {"zh": "我的婚姻還會更好嗎？", "tags": ["衝突與修復", "溝通與親密"], "core": "對於平淡、疏離、令人失望的婚姻，一個人仍能帶來改變：靠聖靈，學習說有智慧的話。", "sum": ["有一種艱難的婚姻沒有明顯的背叛，只是平淡、孤單、令人失望，也很少被關注。", "一個人可以影響關係：信的人心中流出活水，聖潔會擴散。", "有信心聖靈會使用你，你就會更堅韌、更有創意、更投入。", "沉默和帶著怒氣的話都不是辦法；目標是有智慧的話，學習神說話的方式：溫柔、忍耐、美好。", "具體做法：邀請對話、約時間談、請對方為自己禱告、交換今天的好與難。"], "mm": {"c": "失望的婚姻", "b": [["處境", ["平淡疏離", "少被關注"]], ["一個人能改變", ["活水江河", "聖潔擴散"]], ["避免", ["長期沉默", "帶怒氣的話"]], ["智慧的話", ["學神說話", "有創意地開口"]]]}, "fw": {"q": "婚姻沒有大問題，卻冷淡失望，怎麼辦？", "a": "倚靠聖靈，成為說智慧話的人", "steps": ["相信聖靈能使用你", "放下沉默與抱怨", "向神求說話的智慧並有創意地實踐"], "do": ["試著問：今天你有什麼開心和困難的事？", "請朋友為你「說話有智慧」禱告"]}, "gold": ["一個人，也能改變一段關係。", "沉默不是聖經的策略。", "先享受神對你說的好話，再把這種文化帶回家。"], "ref": ["約翰福音 7:38", "哥林多前書 7:14", "箴言 25:11"], "fb": "你的婚姻沒有外遇，沒有暴力，沒有孩子看得見的大罪。\n只是……很冷。\n像一間燈一直亮著、卻沒有人說話的房子。\n\n破碎的婚姻會被關心，正在奮鬥的婚姻會被代禱，\n可是「令人失望」的婚姻，很少有人注意。\n你看著別的夫妻相視而笑，心裡有一點點羨慕，更多的是孤單。\n\n如果你正住在這樣的房子裡，\n請先聽一句話：你被記念了。\n\n婚姻很難，我們第二週就知道了。\n可是難有兩種：一種是難但有盼望，一種是難而沒盼望。\n最難的，是那種疏離、冷淡、看不到改變的難。\n\n你也許已經試過一切，最後只剩下兩個選擇：\n沉默，或是帶著怒氣說話。\n\n沉默看起來像和平，其實是撤退；\n怒氣看起來像誠實，其實是推開。\n沉默說「我放棄了」，怒氣說「都是你的錯」；\n一個讓距離變冷，一個讓距離變遠。\n\n可是還有第三條路：說有智慧的話。\n\n耶穌說：信我的人，從他腹中要流出活水的江河。\n你是一座行走的會幕，聖靈在你裡面，\n可以在一片荒地裡，成為活水。\n保羅也說：信主的一方，會使不信的一方成聖——聖潔是會擴散的。\n\n一個人，真的能改變一段關係嗎？\n能。不是靠你的能力，而是靠住在你裡面的那一位。\n當你相信聖靈會使用你，你就會變得更堅韌、更有創意、更願意投入。\n\n智慧的話從哪裡來？\n先從神那裡聽。\n祂對我們說話的方式：溫柔、忍耐、謹慎、美好；\n連責備都是好的，都在邀請我們靠近。\n先享受祂對你說的好話，再把這種說話的文化帶回家。\n\n然後，求祂賜你「金蘋果落在銀網子裡」那樣的話。\n然後，發揮創意：\n「我最近被神的話感動，想學習怎麼好好說話。」\n「這件事很難談，但很重要，我們星期六早上找個時間好嗎？」\n「我們都把父母的影子帶進對話裡了，你覺得我在哪裡最像我爸媽？」\n「今天我真的很掙扎，你可以為我禱告嗎？」\n「告訴我，今天一件開心的事、一件辛苦的事，好嗎？」\n\n也許一開始，對方沒有回應。\n也許第一句話，像丟進深井的小石頭，聽不到迴響。\n但活水不是一次就把荒地變成花園的，\n它是一點一點滲進去，直到某天，裂縫裡長出第一株綠芽。\n\n你的婚姻還會更好嗎？\n我不能保證明天，\n但我知道，那位使枯骨復生的神，\n從不嫌棄一間冷掉的房子。\n\n今晚，先別沉默，也別生氣。\n說一句好話吧。\n那可能就是春天的第一聲敲門。\n\n#婚姻 #冷淡 #溝通 #智慧的話 #聖靈"}, "every-marriage-needs-a-mission": {"zh": "每段婚姻都需要使命", "tags": ["婚姻使命", "給丈夫"], "core": "婚姻不只是面對面的相愛，也是肩並肩的同工；丈夫要愛妻子如「女人」，也帶領她如「幫助者」。", "sum": ["戀人面對面，朋友肩並肩；但若婚姻只有向內的凝視，就會生病。", "「那人獨居不好」不只是情感上的缺乏，也是使命上的需要：亞當需要一位幫助者。", "夏娃有兩個稱號：「女人」（使亞當歌頌）與「幫助者」（一同治理）。", "今日的丈夫也有使命場域：家庭、兒女、教會、工作、鄰舍。", "實用框架：夢想（看見可能）、規劃、行動。"], "mm": {"c": "婚姻的使命", "b": [["兩種姿態", ["面對面相愛", "肩並肩同工"]], ["夏娃的稱號", ["女人", "幫助者"]], ["使命場域", ["家庭兒女", "教會鄰舍"]], ["三步驟", ["夢想", "規劃", "行動"]]]}, "fw": {"q": "婚姻除了相愛，還為了什麼？", "a": "一同在神國的使命中同工", "steps": ["欣賞她是神所賜的女人", "邀請她成為使命中的幫助者", "以夢想、規劃、行動帶領"], "do": ["一起想像：我們家可以怎樣更像基督的國？", "定一個具體的家庭事工目標"]}, "gold": ["只向內看的愛，最後會走調。", "她不只是你面前的臉，也是你身旁的肩膀。", "婚姻的目標不只是幸福的家，也是被祝福的世界。"], "ref": ["創世記 2:15-23", "創世記 1:28", "箴言 31"], "fb": "週末晚上，他們終於把孩子哄睡，窩在沙發上看劇。\n第三集播完，她問：「我們這樣，是不是就是幸福了？」\n他想了很久，沒有回答。\n\n我們心中的愛情畫面，總是兩個人面對面，眼神交會，彼此沉醉。\n這沒有錯。亞當第一次開口，就是對夏娃唱歌；\n雅歌裡，整個世界都成了新婦美麗的背景。\n\n但戀人面對面，朋友肩並肩。\n一段只有向內凝視的愛，久了會生病；\n一首只唱給彼此聽的歌，久了會走調。\n\n神說「那人獨居不好」，我們常以為那只是情感上的孤單。\n可是緊接著，神說：「我要為他造一個配偶幫助他。」\n亞當早已領受了使命：修理看守那園子。\n他需要的，不只是一張面對他的臉，\n更是一個站在他身旁的肩膀。\n\n夏娃有兩個稱號。\n她是「女人」——讓亞當驚嘆、讓他唱歌，是他骨中的骨。\n她也是「幫助者」——與他一同治理全地，一同生養眾多。\n他愛她如同愛女人，也帶領她如同帶領同工；\n他為她寫詩，也和她一起耕地；\n他擁抱她如同戀人，也和她並肩如同君王與王后。\n\n浪漫是樹幹，使命是枝葉。\n樹幹不往上長出枝葉，就結不出果子。\n\n今天的我們，沒有一座字面上的伊甸園，\n卻有自己的使命場域：一個要經營的家，一群要養育的孩子，\n一間要愛護的教會，一份要做好的工作，一條要傳福音的街。\n每一塊地，都需要拔荊棘、翻土、撒種。\n看著這些田，任何誠實的男人都會承認：獨自一人，真的不好。\n\n我們是不是常把婚姻的使命，只當成婚姻本身？\n好像只要家裡和樂，就完成了任務？\n像一支一直躺在箭袋裡的箭，忘了被弓拉滿、射向遠方的感覺。\n\n怎麼開始？三個字：夢想、規劃、行動。\n夢想：如果基督在我們家完全作主，孩子、鄰居、教會會變成什麼樣子？\n規劃：像箴言裡勤快的人，在秋天就耕地，在收成前就預備。\n行動：一個具體的接待、一次固定的家庭禱告、一個一起服事的位置。\n\n今晚，看完那一集以後，\n也許可以關掉電視，拿出一張紙，\n兩個人一起寫下：\n「如果神要用我們這個家，祂想做什麼？」\n\n然後你會發現，\n愛情不會因為使命而變淡，\n反而會因為一起流汗、一起盼望、一起看見果子，\n變得更深、更穩、更像天國。\n\n#婚姻 #使命 #創世記 #夫妻同工 #家庭異象"}, "marriage-in-three-postures": {"zh": "婚姻的三種姿態", "tags": ["溝通與親密"], "core": "婚姻靠信任茁壯；信任在三種姿態中建立：面對面的親密、背靠背的守護、肩並肩的友誼。", "sum": ["作者以《嚴厲的慈悲》中夫妻築起「閃亮屏障」為警告：過度排外的愛會取代神。", "但它也提醒：婚姻需要信任。", "面對面：透過約會、禱告、散步、性愛，彼此認識也被認識，需要脆弱與坦誠。", "背靠背：知道彼此的弱點，一起抵擋罪、撒但與外在壓力（例如姻親）。", "肩並肩：在共同的興趣與使命中成為朋友。"], "mm": {"c": "建立信任", "b": [["警告", ["閃亮屏障", "愛取代了神"]], ["面對面", ["認識與被認識", "脆弱坦誠"]], ["背靠背", ["守護弱點", "對抗外在壓力"]], ["肩並肩", ["共同興趣", "一起前行"]]]}, "fw": {"q": "夫妻如何培養深厚的信任？", "a": "在三種姿態中彼此追求", "steps": ["面對面：分享喜樂與重擔", "背靠背：保護彼此不被攻擊", "肩並肩：一起投入共同的目標"], "do": ["安排每週固定的約會或散步", "討論如何一起面對姻親或工作壓力"]}, "gold": ["過度排外的愛，最後會把神也排除在外。", "信任和脆弱，在親密裡並肩而行。", "知道彼此的弱點，是為了守護，不是為了攻擊。"], "ref": ["創世記 4:7", "彼得前書 5:8", "以弗所書 5:25-33"], "fb": "有一對年輕夫妻，愛得太深，怕任何人事物介入他們的愛。\n他們決定永遠不生孩子，免得孩子打擾兩人世界；\n甚至約定，有一天要一起把帆船開到海上鑿沉，免得死亡把他們分開。\n他們稱之為「閃亮的屏障」。\n\n多年後，丈夫信了主，回頭看那段愛，給它下了一個標題：異教的愛。\n\n一段只為自己而活的愛，最後會把神也擋在門外。\n這是一個嚴肅的警告。\n但這個故事也點出一個真相：婚姻靠信任而活。\n\n信任要怎麼建立？用三種姿態。\n\n第一種，面對面——親密。\n每週的約會、睡前的禱告、早晨的散步、日常的打鬧，當然還有性。\n但親密不只是性。\n親密是抬起頭，離開自己、離開世界，真正看見另一個人；\n是把喜樂與重擔、恐懼與成功，一次次攤開給對方看，\n也一次次接住對方攤開的心。\n信任和脆弱，在親密裡並肩而行。\n\n第二種，背靠背——守護。\n朝夕相處，你一定會看見對方的盲點、軟弱、反覆跌倒的罪。\n這份認識，可以拿來攻擊，也可以拿來守護。\n罪伏在門前，撒但如吼叫的獅子；\n夫妻要像兩個被敵人包圍的英雄，背靠著背，\n提醒、警告、打氣，連最小的勝利都一起慶祝。\n有時敵人不是撒但，而是難搞的主管、過高的期待、\n或是一對作風完全不同的公婆。\n那時候，更需要你轉過身，和她背靠著背。\n\n第三種，肩並肩——友誼。\n一起有共同的興趣，一起投入同一個使命，\n不只看著彼此，也一起看著同一個方向。\n\n面對面，讓你們被認識；\n背靠背，讓你們被保護；\n肩並肩，讓你們被成全。\n只有面對面，愛會窒息；\n只有背靠背，愛會疲憊；\n只有肩並肩，愛會變成合夥。\n三者一起，婚姻才會像一條三股合成的繩子，不容易折斷。\n\n你們最近，比較常是哪一種姿態？\n是很久沒有面對面好好說話了？\n還是總在爭吵時，把背轉向了對方，而不是靠向對方？\n\n有一位歌手唱過，他年輕時夢想環遊世界，\n後來卻在一位女子的心裡，成了另一種旅人——\n她打開門，牽著他的手，帶他走進她靈魂裡的星系。\n\n願你們也成為彼此的旅人：\n用不急不徐的注意力，探索對方的心；\n然後在每一個轉身之間，\n成為對方最安全的那一面牆，\n和最忠實的那一個同伴。\n\n#婚姻 #信任 #親密 #夫妻友誼 #三股合成的繩子"}, "your-spouse-is-gods-creation": {"zh": "你的配偶是神的創造", "tags": ["衝突與修復"], "core": "健康的婚姻需要敬拜造物主、欣賞祂的選擇；別想把配偶改造成自己的形像。", "sum": ["Paul Tripp 回憶第一次說「我愛你」被妻子打槍，五十年後兩人都為神的主權讚美。", "神決定了每個人的身高、長相，也決定了性格、天賦、是機械型、分析型或關係型。", "我們自私時，會想坐上造物主的寶座，把配偶重塑成自己的樣子。", "結果：婚前吸引彼此的差異，婚後卻變成惱人的地方。", "例子：學者型妻子看不起不愛讀書的機械型丈夫，造成婚姻窒息。"], "mm": {"c": "欣賞神的設計", "b": [["神的主權", ["安排相遇", "決定一切特質"]], ["配偶的特質", ["性格與天賦", "不是自己選的"]], ["自私的試探", ["想重塑對方", "差異變惱怒"]], ["解藥", ["敬拜造物主", "慶祝祂的選擇"]]]}, "fw": {"q": "配偶跟我差太多，常起衝突怎麼辦？", "a": "把差異看成造物主的作品，而非缺陷", "steps": ["承認對方的特質出自神的設計", "察覺自己想改造對方的自私", "以敬拜代替抱怨"], "do": ["列出三個對方與你不同、卻是神美好設計的地方", "為這些差異感謝神"]}, "gold": ["婚前吸引你的差異，婚後別讓它變成刺。", "你不是配偶的造物主。", "每一個人，都是那位無限創意藝術家的作品。"], "ref": ["使徒行傳 17:24-26", "詩篇 139"], "fb": "他十七歲那年，在學校餐廳排隊時遇見她。\n第一眼，他就淪陷了。\n幾週後，他找到一個最完美的時刻，深情地說：「我愛妳。」\n她卻冷冷回他：「你懂什麼是愛？以後別再說了。」\n\n五十年後，他們笑著回憶這一幕。\n也一起敬拜那位在無數人裡，把一個古巴女孩和一個俄亥俄男孩安排到同一個隊伍裡的神。\n\n我們很容易為神安排「相遇」而感謝，\n卻很難為神設計「對方的樣子」而敬拜。\n\n神決定了你的身高、體質、膚色、髮質、鼻子的形狀。\n祂也決定了你配偶的性格、說話的語調、天生的恩賜——\n他是天生的技工型、分析型，還是關係型；\n她喜歡安靜還是熱鬧，喜歡規劃還是隨興。\n這些，都不是你選的，也不是他選的。\n這些，都是那位無限創意的藝術家，親手做的選擇。\n\n有一位作者半開玩笑地說：\n今天出門，去留意你看到的每一個鼻子吧。\n幾十億個鼻子，神從沒有重複過同一個款式。\n\n可是在婚姻裡，我們常常偷偷爬上造物主的寶座，\n想把配偶重新捏成自己的形像，\n或至少，捏成一個比較好相處的人。\n\n於是，一件奇怪的事發生了：\n婚前吸引你的差異，婚後變成了刺。\n當初你欣賞他的冷靜，現在你說他冷漠；\n當初你喜歡她的熱情，現在你嫌她太吵；\n當初你覺得互補很浪漫，現在你覺得互補很累。\n\n有一位妻子熱愛讀書、討論哲學，\n她的丈夫是個技工，也喜歡書——拿來墊東西。\n她打從心裡覺得丈夫比她低一等，\n一心想把他改造成另一個自己，\n結果，把丈夫壓得喘不過氣，也把婚姻壓得滿是衝突。\n\n讀書很好，但神沒有要每個人都長成同一種樣子。\n你不是配偶的造物主。\n你的任務不是重造他，而是欣賞那位造他的神。\n\n怎麼對抗這份自私？\n回到一個屬靈操練：敬拜造物主，慶祝祂的選擇。\n當他又用你不習慣的方式做事，\n先別嘆氣，先說：「主啊，這也是你的作品。」\n\n也許你會發現，\n讓你最受不了的那個特質，\n正是神放在你身邊，要磨掉你自私稜角的那塊砂紙；\n也正是神放在你身邊，要補上你缺口的那塊拼圖。\n\n今天，列出三個你們不一樣的地方，\n不是為了檢討，而是為了感謝。\n因為在那些不一樣裡，\n你可以看見一位創意無窮、從不重複的神。\n\n#婚姻 #差異 #造物主 #欣賞 #夫妻相處"}, "can-christians-date-nonbelievers": {"zh": "基督徒可以和非信徒約會嗎？", "tags": ["婚前與擇偶"], "core": "聖經的答案是「只在主裡」嫁娶；婚姻是要述說基督與教會的真理，所以別退而求其次。", "sum": ["很少人計畫要和非信徒約會；問題出現時，對方通常已有名字、故事和吸引力。", "晚婚、交友軟體、過去的壞經驗，讓有些基督徒考慮教會外的對象。", "最清楚的經文是哥林多前書7:39：可以自由嫁娶，「只是要嫁這在主裡面的人」。", "「在主裡」是保羅整個世界觀；婚姻更是特別設計來彰顯在基督裡的生命。", "婚姻要「說真話」：述說基督如何愛教會；與不信者同負一軛，無法一起說出這個故事。"], "mm": {"c": "只在主裡", "b": [["現實處境", ["晚婚與交友軟體", "對方已有名字"]], ["關鍵經文", ["林前7:39", "林後6:14"]], ["婚姻的意義", ["述說基督與教會", "說真話而非誹謗"]], ["勸勉", ["不要將就", "繼續等候"]]]}, "fw": {"q": "可以跟不信主的人交往嗎？", "a": "不行——基督徒只在主裡嫁娶", "steps": ["承認處境的掙扎與誘惑", "以「在主裡」作為決定框架", "記得婚姻要彰顯基督與教會"], "do": ["交往前先問：我們能一起述說基督的故事嗎？", "請屬靈長輩陪你面對孤單與等待"]}, "gold": ["沒有人真心想嫁給一個不愛耶穌的人。", "婚姻是一篇講章，要講對內容。", "用完了好計畫，也不要選一個壞計畫。"], "ref": ["哥林多前書 7:39", "哥林多後書 6:14", "以弗所書 5:31-32"], "fb": "「我沒有打算要跟非信徒交往。」\n她說的是真話。\n她原本想找一個可以一起讀經、一起禱告、一起服事的人。\n可是，教會裡的人好像都不太對；\n工作上那個他，幽默、體貼、尊重她，什麼都好，\n除了一件事：他不認識耶穌。\n\n很少有基督徒「計畫」要和非信徒約會。\n通常等到問題出現時，那個「非信徒」已經有名字、有故事、有一張讓你心動的臉了。\n\n晚婚、交友軟體、過去和基督徒交往的壞經驗……\n讓有些人開始想：也許可以把範圍放寬一點？\n甚至覺得，和班上、網路上的非信徒，比和主日那些單身弟兄姊妹更有共同話題。\n\n但這不是你的原本計畫，對吧？\n不是A計畫，不是B計畫，甚至不是C計畫。\n你來到這裡，是因為好計畫都用完了。\n而用完了好計畫，也不該換成一個壞計畫。\n\n大家最常想到「不要和不信的原不相配」。\n但更直接的一句，藏在哥林多前書七章：\n可以自由嫁娶，只是要嫁這在主裡面的人。\n\n「在主裡」——保羅在同一封信裡用了二十多次。\n那不是貼在婚姻上的屬靈標籤，而是他整個世界。\n基督徒做的每一件事都在主裡，更何況是婚姻？\n\n而且，婚姻本身就是一篇講章。\n它被設計來述說基督如何愛教會、教會如何回應基督。\n世上許多婚姻，其實在說謊：\n丈夫不捨己，妻子不敬重，神的話不在家中，聖潔不被追求。\n當保羅說「在主裡嫁娶」，他是在說：\n讓你的婚姻說真話。\n\n兩個人可以一起吃飯、旅行、養孩子，\n卻無法一起說出那個最重要的故事；\n可以同一張床，卻不能同一個信仰；\n可以同一個屋簷，卻不能同一個永恆。\n\n你真的想和一個人共度一生，\n卻不能和他一起為孩子禱告？\n不能在最黑暗的夜裡，一起抓住同一個應許？\n不能在臨終時，一起盼望同一個天家？\n\n也許你會說：可是我好孤單。\n是的，等待很難，看著別人一對一對走進禮堂更難。\n但比單身更孤單的，是一輩子獨自坐在教會裡，\n而那個你最愛的人，在家裡，永遠不懂你為什麼要來。\n\n所以，親愛的，再撐一下。\n把你的孤單帶到主面前，也帶到信任的弟兄姊妹面前。\n寧可慢一點，也要對；\n寧可等久一點，也要在主裡。\n\n因為你的婚姻，不只是你的故事，\n它也是神要對世界說的一段話。\n願那段話，說得清楚，說得真實，說得美麗。\n\n#單身 #擇偶 #在主裡 #哥林多前書 #婚前"}, "how-to-fail-a-wife": {"zh": "如何辜負一位妻子", "tags": ["給丈夫"], "core": "亞當的失敗提醒丈夫：被動、妥協、推卸責任，是辜負妻子最常見的方式。", "sum": ["連在樂園中，作壞丈夫都比作忠心的丈夫容易。", "試探來時亞當就在旁邊，卻沉默不語：這是男人常見的罪——被動。", "他明知神的命令，卻接過果子吃了：這是另一種罪——妥協。", "神把看守園子、領受命令的責任交給「那人」；丈夫要供應並保護家庭。", "被動可能來自驕傲、懼怕、懶惰或貪戀權力；保護家最好的方法是先保守自己的心。"], "mm": {"c": "亞當的失敗", "b": [["被動", ["站在旁邊不出聲", "沒有看守園子"]], ["妥協", ["明知故犯", "接過果子吃"]], ["背後原因", ["驕傲懼怕", "懶惰貪婪"]], ["丈夫的呼召", ["供應與保護", "保守己心"]]]}, "fw": {"q": "丈夫最容易在哪裡失職？", "a": "在試探面前被動並妥協", "steps": ["認清神交託丈夫看守的責任", "警覺自己的沉默與退縮", "拒絕明知故犯的妥協"], "do": ["在家中屬靈問題上主動開口", "先處理自己心中的罪"]}, "gold": ["家會倒，常不是因為暴風，而是因為丈夫的沉默。", "最可怕的三個字：「他也吃了」。", "要保護身邊的家，先保守裡面的心。"], "ref": ["創世記 2:15-17", "創世記 3:1-12", "提摩太前書 2:14"], "fb": "創世記第三章，最悲傷的一章，開頭幾節甚至沒有提到那個男人。\n蛇對女人說話，女人回答蛇，女人看見、摘下、吃了。\n然後，一句話像刀一樣落下：\n「又給她丈夫，她丈夫也吃了。」\n\n原來，他一直都在。\n\n我們以為亞當只是故事的配角，甚至是受害者。\n其實，他的「不在場」，正是他第一個失敗。\n他人就在旁邊，卻什麼也沒說。\n\n家倒塌，常常不是因為外面的暴風，\n而是因為裡面那個該開口的人，選擇了沉默。\n\n神把「那人」安置在園中，要他修理看守；\n神把命令交給「那人」：這棵樹的果子不可吃。\n看守，就是供應、保護、擋下一切攔阻家人榮耀使命的威脅。\n可是當試探真正走進家門時，他沒有擋，他讓出了空間。\n\n為什麼？聖經沒說。\n也許是驕傲——「你們便如神」聽起來很誘人。\n也許是懼怕——怕拒絕之後，她會怎麼看他。\n也許是懶惰——沒有力氣抵擋，也沒有心志爭戰。\n也許是貪戀——他自己也想嚐那一口。\n被動，可以長在很多種土壤裡，卻總是結出同一種苦果。\n\n但亞當不只是被動。\n他接過果子，吃了。\n他明明親耳聽過神的命令，卻在那一刻，把耳朵關上了。\n一個家最痛的時刻之一，就是那個明明知道更好的男人，自己跳進罪裡。\n\n被動，是該做的沒做；\n妥協，是不該做的做了。\n一個是空的手，一個是髒的手；\n一個讓敵人進門，一個親自為敵人開門。\n\n丈夫們，我們和亞當有什麼不同？\n當家裡出現屬靈的危機，我們是開口，還是假裝沒聽見？\n當罪在客廳裡坐下來，我們是請它出去，還是遞給它一杯茶？\n\n結婚越久，越容易穿上亞當的無花果葉。\n他的罪是第一個，卻不是最特別的；\n他的失敗，就是很多丈夫每天的失敗。\n作一個壞丈夫，連在樂園裡都比作一個忠心丈夫容易。\n\n可是，亞當的失敗也像一面鏡子，\n把我們模糊又舒服的「好丈夫」想像，照得更清楚、更不舒服。\n原來，作丈夫不只是不做壞事，\n更是在需要的時候，站出來；\n在試探面前，說不；\n在家人面前，先守住自己的心。\n\n要保護身邊的家，先保守裡面的心。\n因為一個家最堅固的防線，\n不是鎖，不是牆，\n而是一個在神面前清醒、願意開口、願意擋在前面的男人。\n\n#婚姻 #丈夫 #亞當 #被動 #保護家庭"}, "how-a-head-loves-a-body": {"zh": "頭如何愛身體", "tags": ["順服與帶領"], "core": "頭與身體彼此依存並共有使命：頭以同在、言行來安排、賦能與保護，身體則接受、回饋並放大頭的努力。", "sum": ["頭與身體缺一不可，整個身體為神的使命而存在，不是為自己。", "頭的職責：向內安排、賦能全身完成使命；向外守護邊界、代表全家、為整體福祉負責。", "頭不是發號施令，而是像行星以引力帶動月亮、像樂手定下節拍、像免疫系統保護身體。", "忠心的頭即使不在場也有影響力；不忠的頭人在心不在，或成為家中暴君。", "身體領受是為了給出更多：提供回饋與建議，並美化、放大、使頭的努力結出果子。"], "mm": {"c": "頭與身體", "b": [["共同基礎", ["彼此依存", "共有使命"]], ["頭的職責", ["安排與賦能", "守護與代表"]], ["三個比喻", ["行星與月亮", "節拍與旋律", "免疫系統"]], ["身體的職責", ["領受與回饋", "美化與放大"]]]}, "fw": {"q": "「頭」和「身體」在家中如何運作？", "a": "頭以同在帶動，身體以回應成全", "steps": ["明白家庭的使命", "頭：以同在與犧牲帶領", "身體：提供建議並放大果效"], "do": ["丈夫：想想你在家中設定了什麼「節拍」", "妻子：主動提供觀察與建議"]}, "gold": ["丈夫用自己的「引力」帶動全家。", "被動的丈夫在場，卻輕得沒有重量。", "身體領受，是為了給出更多。"], "ref": ["以弗所書 5:22-30", "創世記 1:28", "創世記 2:18"], "fb": "沒有人想要一顆沒有身體的頭，\n也沒有人想要一個沒有頭的身體。\n\n聖經常用身體來描述人際關係：教會是基督的身體，婚姻是二人成為一體。\n一談到頭與身體，我們常常只想到兩個字：權柄與順服。\n可是，頭與身體的關係，比這兩個字深得多。\n\n先說最明顯的：頭與身體彼此依存。\n神說「那人獨居不好」，從一開始，頭和身體就是互相配合的。\n而且，整個身體有一個使命——生養眾多、治理全地。\n身體不是為了自己存在，而是為了神在世上的工作。\n\n那麼，頭在做什麼？\n向內，他安排、賦能，讓每個肢體都能完成自己的呼召；\n向外，他守護邊界、代表全家，為整體的福祉負責。\n\n但頭不是靠吼叫來帶領的。\n三個畫面可以幫助我們：\n頭像一顆行星，用自己的引力，讓月亮在正確的軌道上運行；\n頭像一位樂手，定下節拍，讓旋律與和聲得以成形——或者，讓整個家變成噪音；\n頭像身體的免疫系統，不只抵抗病菌，也調節功能、守護界線。\n\n忠心的頭，即使不在場，也有影響力。\n爸爸在上班，媽媽在管教孩子，爸爸的同在仍站在她背後，給她力量。\n不忠的頭，即使在場，也輕得沒有重量。\n他坐在客廳裡，心卻不在；他的被動留下空洞，讓全家各行其是。\n另一種不忠，則是在家裡作暴君，用自己的聲音壓過所有音樂。\n\n被動的頭沒有引力，月亮會亂飛；\n暴君的頭只有引力，月亮會撞毀；\n忠心的頭，用愛的引力，讓一切各安其位。\n\n那麼身體在做什麼？\n身體領受，是為了給出更多。\n她領受頭的同在、言語與行動，然後提供回饋、建議、提醒，讓帶領更有智慧；\n她跟上頭的步伐，把頭的努力放大、美化、使之結果。\n最明顯的例子，就是生命本身：他撒種，她懷胎；他耕耘，她結果。\n\n身體不是只會照做的工具，\n她是讓頭的心意，變成真實美好的那雙手。\n\n你家的引力，現在是什麼狀態？\n你定下的節拍，讓家裡響起的是音樂，還是噪音？\n妳給出的回應，是讓他的帶領更好，還是讓它無聲地落空？\n\n頭與身體，不是一場權力的分配，\n而是一支舞，一首歌，一段使命。\n當頭樂意擔當、樂意犧牲，\n當身體樂意回應、樂意成全，\n那個家，就會成為世上一幅小小的圖畫——\n讓人看見基督怎樣愛祂的教會，\n教會又怎樣在祂的愛裡，變得美麗。\n\n#婚姻 #頭與身體 #帶領 #家庭 #以弗所書"}, "king-over-kin": {"zh": "君王高於親人", "tags": ["苦難與死亡", "福音與奧祕"], "core": "申命記13章的嚴厲命令試驗我們：是愛神至上，還是愛配偶超過神？在新約，這以教會紀律的形式延續。", "sum": ["作者以想像情境開場：多年的妻子轉向拜別神，並引誘全家跟隨。", "申命記13章命令：連最親愛的妻子引誘你拜別神，也不可顧惜、不可隱藏。", "這一幕試驗我們是否真的愛神至上，也教導我們看見離棄真神有多嚴重。", "新約不再用石頭打死背道者，但教會紀律與開除會籍同樣嚴肅。", "婚姻再親密，也不能取代神在心中的王位。"], "mm": {"c": "愛神至上", "b": [["情境", ["妻子轉向假神", "引誘全家"]], ["申命記13章", ["不可顧惜", "不可隱藏"]], ["目的", ["試驗愛", "教導敬畏"]], ["新約應用", ["教會紀律", "神高於一切"]]]}, "fw": {"q": "當最親的人引誘我離開神，怎麼辦？", "a": "君王高於親人：神必須在首位", "steps": ["明白舊約命令的嚴肅意義", "看見它試驗我們的愛", "在新約中以教會紀律回應"], "do": ["檢視：是否有任何關係比神更重要？", "在家中堅定以神為首"]}, "gold": ["最難的試驗，是在神與摯愛之間選擇。", "天然的情感，不能凌駕神的話。", "再深的婚姻，也不能坐上神的寶座。"], "ref": ["申命記 13:1-14", "哥林多前書 5:13"], "fb": "想像一個畫面。\n你和她結婚多年，四個孩子都很可愛。\n某天，女兒告訴你一件你不敢相信的事：媽媽開始拜別的神了。\n你去問她，她的聲音還是一樣，酒窩還在原處，\n可是從她口中說出來的，是另一個人的話。\n她不只自己去，還要你和孩子們一起去。\n\n申命記十三章說：\n若是你懷中的妻引誘你去事奉別神，你不可依從她，不可顧惜她，不可遮庇她。\n\n這是整本聖經裡最難讀的經文之一。\n讀到這裡，你的心會不會也痛起來？\n那不是一個沒有臉的拜偶像者，那是你枕邊的人，是你孩子的母親。\n天然的情感在尖叫：這太殘忍了。\n\n神為什麼要這樣命令？\n經文說：這是耶和華試驗你們，要知道你們是不是盡心盡性愛祂。\n它也在教導：離開真神去愛別的，是何等嚴重的事。\n\n最難的試驗，從來不是在神與仇敵之間選擇，\n而是在神與摯愛之間選擇。\n\n我們以為，愛神和愛家人從來不會衝突。\n大多時候確實如此——愛神的人，會更懂得愛家人。\n可是總有一些時刻，兩條路會分岔，\n那時候，你的心會被試出來：誰才是坐在王位上的那一位？\n\n新約不再用石頭處死背道的人，\n但教會紀律、開除會籍，同樣嚴肅。\n保羅說：要把那惡人從你們中間趕出去。\n神的心意沒有變：祂要作王，高過一切親情。\n\n耶穌也說過類似的話：\n愛父母過於愛我的，不配作我的門徒；\n愛兒女過於愛我的，不配作我的門徒。\n這不是要我們少愛家人，而是要我們把愛放在對的次序裡。\n\n當神在第一位，家人在第二位，\n我們反而能用更純淨、更堅定、更無私的方式愛他們；\n當家人在第一位，神在第二位，\n我們的愛就會變成偶像，最後連家人也一起拖垮。\n\n今天，有什麼關係，正悄悄爬上你心裡那個王座？\n是你對配偶的依戀？是對孩子的期待？是怕失去某個人的恐懼？\n\n這篇經文不是要我們變得冷酷，\n而是要我們在最溫柔的關係裡，仍然記得誰是主。\n婚姻再深，也不能坐上神的寶座；\n愛人再親，也不能取代那位為我們捨命的君王。\n\n願我們的家，有很多很多的愛，\n但在一切愛之上，\n有一面旗，清楚寫著：\n君王高於親人，基督高於一切。\n\n#婚姻 #愛神至上 #申命記 #門徒的代價 #信仰"}, "the-beautiful-roots-of-courageous-submission": {"zh": "勇敢順服的美麗根源", "tags": ["順服與帶領", "給妻子"], "core": "撒拉是勇敢的典範：她的順服出自安靜溫柔、井然有序的心，這種勇氣不畏懼任何驚嚇。", "sum": ["彼得把撒拉列為勇氣的榜樣：行善、不怕任何驚嚇。", "「溫柔安靜的心」不是內向個性，而是心志堅定、情緒穩健、屬靈沉著。", "安靜的反面是「喧嚷、腳不留家」的不安分。", "撒拉的勇氣表現在行動與言語上：順服亞伯拉罕，稱他為主。", "作者問妻子們：你如何談論丈夫？別人只聽你的話，會怎麼看他？"], "mm": {"c": "撒拉的勇氣", "b": [["內在", ["溫柔安靜的心", "穩健沉著"]], ["反面", ["喧嚷不安分", "說閒話"]], ["外在", ["順服行動", "尊敬的言語"]], ["省思", ["怎麼談論丈夫", "尊重或輕視"]]]}, "fw": {"q": "順服和勇敢有關嗎？", "a": "真正的順服需要井然有序的勇敢之心", "steps": ["培養內在的穩健與盼望", "以順服的行動表達", "以尊敬的言語表達"], "do": ["留意自己對外人怎麼形容丈夫", "把盼望放在基督的恩典上"]}, "gold": ["溫柔安靜不是個性，而是一種屬靈的力量。", "順服並不貶低撒拉，她是偉大的母親。", "你的話語，透露你對丈夫的心。"], "ref": ["彼得前書 3:1-6", "創世記 18:12", "箴言 7:11"], "fb": "說到聖經裡的勇氣，你會想到誰？\n帶著三百一十八個家丁去救羅得的亞伯拉罕？\n拿著甩石機面對巨人的大衛？\n在公會前說「順從神不順從人是應當的」的使徒們？\n\n彼得給了另一個答案：撒拉。\n他說，你們若行善，不怕任何驚嚇，就是撒拉的女兒了。\n\n很多人聽到「順服」，就想到軟弱、退縮、沒有聲音。\n彼得卻把順服和勇氣放在同一句話裡。\n\n撒拉的勇氣，從哪裡開始？\n從「裡面存著長久溫柔安靜的心」開始。\n這不是在稱讚內向的個性——神沒有比較喜歡害羞的人。\n「溫柔安靜」指的是一種心志的堅定、情緒的穩健、屬靈的沉著；\n一個井然有序、在自己的呼召裡知足安穩的靈魂。\n\n安靜的反面，不是說話，而是喧嚷。\n箴言描述那個不忠的婦人：喧嚷、不服約束，腳不留在家中。\n保羅描述那些閒懶、說長道短、好管閒事的人。\n真正的安靜，是在危險與恐懼中，仍然清醒、節制、剛強，\n把盼望完全放在基督再來時要帶來的恩典上。\n\n然後，這份裡面的勇氣，會在外面被看見。\n撒拉順服亞伯拉罕，稱他為主。\n她用行動跟隨，也用言語尊重。\n\n今天的文化對這兩件事都很敏感。\n順服好像是貶低，尊重好像是卑屈。\n但路易斯曾提醒：一個人若連「甘心忠誠地跟隨」和「謙卑高貴地被跟隨」都無法想像，\n他失去的不是自由，而是一整片美好的世界。\n\n撒拉的順服沒有讓她變小。\n她順服亞伯拉罕這位偉大的族長，因為她自己就是偉大的族母；\n她稱他為主，因為她是他的夫人、他的妻子、他的榮耀。\n\n其實，彼得引用的那一句，在創世記裡平凡得幾乎不起眼——\n那只是撒拉平常談到丈夫的方式。\n\n所以，問題不在於今天要不要用某個特定的稱呼，\n而在於心——那些話是從怎樣的心裡說出來的？\n\n姊妹們，妳怎麼談論妳的丈夫？\n如果別人只聽妳的話來認識他，他們會覺得他是一個怎樣的人？\n妳的言語裡，充滿的是敬重和欣賞，還是輕視和失望？\n\n喧嚷的心向外求，安靜的心向上望；\n輕視的話拆毀家，敬重的話建造家；\n懼怕讓人退縮，盼望讓人剛強。\n\n願妳成為撒拉的女兒——\n不是因為妳從不害怕，\n而是因為妳把盼望放得那麼高，\n高到眼前任何驚嚇，都不能奪走妳的平安。\n\n#婚姻 #妻子 #撒拉 #勇氣 #彼得前書3章"}, "when-death-does-us-part": {"zh": "直到死亡將我們分開", "tags": ["苦難與死亡", "福音與奧祕"], "core": "愛得越深，分離越痛；但基督徒婚姻是對抗世界瓦解的兵器，並在復活的盼望中得安慰。", "sum": ["作者說：婚姻若照應有的樣子運作，終將以悲劇收場——總有一方先離去。", "以《魔戒》中亞拉岡與亞玟的故事為例：他們選擇彼此，也一同投身於對抗黑暗。", "作者夫妻領悟：婚姻是對抗邪惡的兵器；忠誠、饒恕、聆聽、施恩，都是爭戰的選擇。", "基督徒婚姻拒絕「陰影」（只為自己享受），也拒絕「暮光」（逃避爭戰、只顧小倆口）。", "死亡帶來的痛在此世無可安慰，但基督復活的應許給我們超越此世的盼望。"], "mm": {"c": "死亡與盼望", "b": [["婚姻的悲劇", ["總有一方先走", "愛深痛深"]], ["亞拉岡與亞玟", ["相遇與選擇", "拒絕陰影與暮光"]], ["婚姻是兵器", ["忠誠饒恕", "對抗邪惡"]], ["盼望", ["超越此世", "復活應許"]]]}, "fw": {"q": "如何面對配偶終將離世的事實？", "a": "在基督裡把婚姻活成對抗黑暗的爭戰，並仰望復活", "steps": ["承認分離之痛的真實", "選擇一同投身神國的爭戰", "把盼望放在此世之外"], "do": ["珍惜今天與配偶的時間", "一起談論對永恆的盼望"]}, "gold": ["愛越長久，離別越痛。", "我們的婚姻，是對抗世界瓦解的武器。", "此世沒有安慰，但此世之外有。"], "ref": ["帖撒羅尼迦前書 4:13-18"], "fb": "告別式開始前，她慢慢走向第一排的座位。\n五十年前，她也是這樣走進這間禮堂——那時她是新娘，所有人的目光都在她身上；\n今天，所有人的目光又在她身上，只是這一次，大家想知道她撐不撐得住。\n\n婚姻若照著它該有的樣子運作，最後總會以悲傷收場。\n因為總有一個人，要先走。\n\n兩個人相守五、六十年，\n認識彼此比認識任何人都深，\n不用說話就能懂，\n兩萬個日夜，彼此捨己，也為對方而活。\n然後，就在體力衰退、最需要對方的時候，一個人走了，\n另一個人，被留下來。\n\n愛得越久，分離越痛；\n愛得越深，空位越大。\n這套安排，乍看之下真是殘酷。\n\n有一位牧師和妻子年輕時一起朗讀《魔戒》，讀到附錄裡那段亞拉岡與亞玟的故事，忍不住落淚。\n一個是凡人的王，一個是不死的精靈公主。\n當他們選擇彼此，也同時選擇了一件事：\n不逃避這個世界的黑暗，而是一起投身於對抗它的戰爭。\n他拒絕了陰影；她放棄了遠方安全的暮光，選擇留在會死的世界裡，與他同行。\n\n這位牧師說：越深地活在基督裡、為基督而活，\n我們越明白，婚姻本身就是對抗世界瓦解的一件兵器。\n忠誠是兵器，饒恕是兵器，聆聽是兵器，施恩是兵器。\n每一個選擇去愛的日子，都是一場小小的勝仗。\n\n基督徒的婚姻要拒絕兩件事。\n拒絕「陰影」：只為自己而活，盡量消費這世界的美好；\n也拒絕「暮光」：逃離爭戰，只想偷得一點兩人的平靜。\n不是躲進享受裡，也不是躲進安逸裡，\n而是手牽著手，走進神國的使命裡。\n\n可是，分離的那天終究會來。\n那時候，信心會被推向絕望的邊緣。\n在這個世界的範圍裡，真的沒有一種安慰，能填滿那種痛。\n\n但「在這個世界的範圍裡」——這幾個字很重要。\n因為基督徒的盼望，從來不只在這個世界的範圍裡。\n那位從墳墓裡走出來的主，已經把一扇門，開在死亡的另一邊。\n\n所以，今天還擁有彼此的人，\n請多牽一次手，多說一次謝謝，\n多為一件小事一起笑。\n不是因為怕失去，\n而是因為知道，你們正在寫的，\n是一個不會在告別式那天結束的故事。\n\n此世沒有安慰，\n但此世之外，有一個清晨，\n那時，被留下的人，不會再被留下。\n\n#婚姻 #死亡 #盼望 #復活 #至死不渝"}, "put-your-anger-to-bed": {"zh": "別帶著怒氣上床", "tags": ["衝突與修復"], "core": "怒氣本身可以是好的，但必須限時處理；神讓太陽每天下山，是給婚姻和好的恩典。", "sum": ["「不可含怒到日落」說來簡單，做起來需要時間與努力。", "婚姻最容易使人生氣，因為婚姻最親密：越敞開，傷害越深。", "可以生氣：對罪惡發怒是正當的；許多婚姻卻假設怒氣總是錯的，或自己的怒氣總是對的。", "但要除掉一切惱恨：義怒也有保存期限，就是今天。", "24小時的一天是恩典：每天日落逼我們選擇和好；即使無法完全解決，也要尋求有意義的和好。"], "mm": {"c": "處理怒氣", "b": [["為何易怒", ["親密帶來脆弱", "小罪像宣戰"]], ["可以生氣", ["對罪的義怒", "承認對方有理"]], ["除掉怒氣", ["義怒也有期限", "期限是今天"]], ["每日恩典", ["日落促和好", "有意義的和好"]]]}, "fw": {"q": "夫妻吵架後該怎麼辦？", "a": "可以生氣，但不要讓怒氣過夜", "steps": ["分辨正當與犯罪的怒氣", "承認自己的錯，允許對方生氣", "在睡前尋求有意義的和好"], "do": ["睡前說：「我錯了，你生氣是對的。」", "約定若太累，隔天一早繼續談"]}, "gold": ["婚姻越親密，就越容易生氣。", "神給義怒也設了期限：今天。", "信任是親密的貨幣，苦毒會慢慢花光它。"], "ref": ["以弗所書 4:26-32"], "fb": "「不要含怒到日落。」\n婚前輔導時，每對新人都點頭如搗蒜。\n結婚幾個月後，他們才知道，要在睡前把怒氣處理好，\n有時就像要在睡前把整個地下室裝潢完一樣。\n\n為什麼婚姻特別容易讓人生氣？\n不是婚姻有缺陷，而恰恰因為婚姻很美。\n婚姻有最高的親密，所以也有最深的傷害。\n當你把自己完全交給一個人，\n連小小的罪，都會像一場宣戰。\n\n以弗所書四章給了我們三個提醒。\n\n第一：生氣可以是好的。\n經文說「生氣卻不要犯罪」，不是說「永遠不要生氣」。\n很多人在心裡畫了一張地圖，把怒氣整片劃為禁區，\n尤其是別人對我的怒氣——一定是不對的。\n但對罪惡發怒，是正當的。\n你們的婚姻裡，有沒有空間讓對方說：「你得罪了我，我生氣是對的」？\n而你，能不能回答：「是的，我錯了，你的怒氣是合理的」？\n\n許多婚姻的問題，正在於我們以為：\n對方的怒氣總是錯的，自己的怒氣總是對的。\n\n第二：要除掉一切怒氣。\n這不是矛盾嗎？剛說可以生氣，現在又說要除掉？\n成熟的智慧，就在於知道什麼時候用哪一句：\n什麼時候該指出，什麼時候該包容；\n什麼時候該說話，什麼時候該閉口；\n什麼時候為罪發怒，什麼時候放下怒氣。\n怒氣在健康的心裡有一個位置，但那是一個有限、短暫的位置。\n神給連正當的怒氣都設了保存期限——期限就是今天。\n\n第三：二十四小時的一天，是給婚姻的恩典。\n你有沒有想過，神為什麼把一天定為二十四小時？\n其中一個理由，祂自己說了：為了限制怒氣，免得它變成一場安靜的野火。\n太陽每天穿過天空，慢慢沉入地平線，\n像在溫柔地推著我們：去和好吧。\n它在沙上畫一條線，逼我們選擇：順服神，或是寵愛自己的傷口。\n\n信任是親密的貨幣。\n大的背叛會一次花光它，\n但更常見的，是每天一點點地花掉——\n把冒犯收藏起來，把怨氣餵養長大，\n明明理由早已過期，苦毒卻還留在心裡。\n\n當然，有些衝突一晚解決不了。\n所以重點不是「睡前完全解決」，而是「睡前真誠地走向和好」。\n有時一點時間和睡眠，反而幫助我們看得更清楚。\n\n今晚，在燈關掉之前，\n也許可以說一句：\n「我還在難過，但我不想讓這件事站在我們中間。我們明天一起再談，好嗎？」\n\n讓太陽落下，\n也讓怒氣，跟著一起落下。\n\n#婚姻 #怒氣 #和好 #以弗所書4章 #不含怒到日落"}, "a-wife-no-man-would-want": {"zh": "沒有男人想要的妻子", "tags": ["福音與奧祕", "外遇與試探"], "core": "何西阿娶了不忠的歌篾，畫出神對不忠子民的愛：神要那個沒人想要的新娘。", "sum": ["神吩咐先知何西阿娶淫婦歌篾，用婚姻向背道的以色列講一篇震撼的講章。", "歌篾是那種向別人尋求供應、把丈夫給的東西拿去取悅別人的妻子。", "何西阿卻揀選她、尋找她、買回她、愛她。", "神說：「我必勸導她，領她到曠野，對她說安慰的話。」在背叛後，祂的愛依然溫暖。", "神的兒子後來背負「不蒙憐憫」之名，使我們這不忠的新娘得稱為「蒙愛的」。"], "mm": {"c": "何西阿的婚姻", "b": [["神的吩咐", ["娶淫婦歌篾", "向以色列講道"]], ["歌篾的樣子", ["向別人求供應", "忘記丈夫"]], ["何西阿的愛", ["揀選", "買回"]], ["福音", ["神要沒人要的新娘", "基督代替我們"]]]}, "fw": {"q": "何西阿的婚姻要告訴我們什麼？", "a": "神以不離不棄的愛追回不忠的我們", "steps": ["看見自己就是歌篾", "看見神信實的追尋", "在基督裡被稱為蒙愛的"], "do": ["以這份恩典眼光看待配偶的失敗", "為自己的屬靈不忠悔改"]}, "gold": ["神要的，是沒有人想要的新娘。", "忠心丈夫的愛，讓淫婦成為憐憫的記號。", "我們都是歌篾，而祂仍來尋找。"], "ref": ["何西阿書 1-3"], "fb": "如果真有那場婚禮，大概是史上最尷尬的一場。\n全城都知道她是怎樣的女人，有些男人，甚至親身知道。\n新郎說出「無論好壞」時，「壞」這個字顯得太輕；\n「好」這個字，則像一個天真的幻想。\n\n他知道接下來會有多少眼淚，\n知道會有多少夜晚獨自醒著，猜她在哪裡、在誰懷裡；\n知道有一天要怎麼向孩子解釋。\n他都知道，卻還是娶了她。\n為什麼？\n\n因為神對先知何西阿說：去娶一個淫婦。\n因為這地大行淫亂，離棄了耶和華。\n\n神要用一場婚姻，抓住祂百姓四處遊蕩的眼睛。\n那是一篇刺耳又令人羞愧的講章，\n一面讓人想別過頭去的鏡子。\n\n歌篾是怎樣的女人？\n她說：我要追隨我的情人，他們給我餅、水、羊毛、麻、油和酒。\n她拿丈夫給她的東西，去取悅別的男人；\n她把丈夫為她做的一切，歸功給別人。\n她是一個配不上好男人的女人。\n\n可是，何西阿揀選她、尋找她、用銀子和大麥把她買回來，\n對她說：妳要安心住在我這裡，我也必向妳如此。\n\n這篇講章到這裡，才讓人真正看懂：\n以色列啊，看看你是誰；也看看我是誰。\n\n經文裡有一個驚人的轉折。\n神說：她為巴力燒香，戴上耳環首飾，隨從她所愛的，卻忘記我——\n「後來」我必勸導她，領她到曠野，對她說安慰的話。\n\n如果是你，被這樣背叛之後，會怎麼接那句「後來」？\n後來我必離開她？後來我必報復她？後來我必讓她付出代價？\n神卻說：後來，我必吸引她。\n\n神要的，是沒有男人想要的新娘。\n祂追求的，是大多數男人早已放棄的女人。\n而且，祂要用最昂貴的方式得著她——\n祂的兒子要背負「不蒙憐憫」的名，\n好讓我們這些淫亂的新婦，被稱為「蒙憐憫的」。\n\n讀到這裡，你還覺得自己比歌篾好嗎？\n我們是不是也常拿神給的恩典，去追逐別的愛？\n是不是也把祂賜下的一切，歸功給工作、運氣、自己的努力？\n\n我們都是歌篾。\n而祂，仍然來尋找。\n\n這份愛，讓婚姻有了新的意義。\n當配偶讓你失望，當你自己讓配偶失望，\n請記得那場尷尬的婚禮——\n一位忠心的丈夫，讓一個破碎的女人，成了憐憫的記號；\n讓一段不被看好的婚姻，成了恩典的神蹟。\n\n#婚姻 #何西阿書 #恩典 #饒恕 #福音"}, "the-best-sermon-for-marriage": {"zh": "給婚姻最好的講道", "tags": ["婚姻使命", "衝突與修復"], "core": "健康的婚姻與其說靠雅歌，不如說更靠登山寶訓：把家建在順服耶穌的磐石上。", "sum": ["作者結婚七週年，提到「七年之癢」：婚姻比預期更難，想離開總找得到理由。", "婚禮誓言不是宣告現在的愛，而是彼此約束、承諾未來的愛。", "墮落世界中，婚姻要倚靠的不只是浪漫，更是耶穌在山上的教導。", "第一個功課：小心把家建在哪裡——聽了就去行，才是建在磐石上。", "衝突時，讓「耶穌最想要什麼」成為決定因素，而不是誰贏。"], "mm": {"c": "登山寶訓與婚姻", "b": [["七年之癢", ["婚姻比預期難", "理由總是很多"]], ["誓言", ["承諾未來的愛", "把艱難寫進婚禮"]], ["磐石上的家", ["聽了就去行", "把耶穌放中心"]], ["衝突", ["耶穌要什麼", "順服勝過己意"]]]}, "fw": {"q": "婚姻遇到「七年之癢」怎麼辦？", "a": "把婚姻建造在順服耶穌的磐石上", "steps": ["記得誓言是對未來的承諾", "把耶穌的話放在婚姻節奏中心", "衝突時以順服基督為優先"], "do": ["一起讀登山寶訓並討論", "吵架時問：耶穌在這裡最想要什麼？"]}, "gold": ["誓言不是宣告現在的感覺，而是承諾將來的愛。", "婚姻需要雅歌，更需要登山寶訓。", "暴風來時，才知道愛是不是建在磐石上。"], "ref": ["馬太福音 5-7", "馬太福音 7:24-25"], "fb": "今天，是他們結婚第七年。\n大家都說，七年是個坎，有個電影就叫《七年之癢》。\n研究說離婚率常在第五到第十年達到高峰。\n其實不用研究，多數夫妻自己就知道：婚姻比想像中難。\n如果要找離開的理由，永遠都找得到。\n\n不然，我們為什麼要立誓？\n誓言，不是宣告「我現在愛你」，\n而是彼此約束、承諾「我將來也會愛你」。\n無論好壞、貧富、疾病健康，都愛你、珍惜你，直到死亡把我們分開。\n誓言把婚姻未來的脆弱與艱難，直接寫進了婚禮的美麗裡。\n\n有一位學者說：在這個墮落的世界，健康的婚姻，\n恐怕要倚靠登山寶訓，多過倚靠雅歌。\n\n我們以為，婚姻最需要的是浪漫的詩；\n其實，婚姻更需要的是耶穌在山上說的話。\n不是不要雅歌——健康的婚姻，依然是一段值得寫詩的愛情；\n而是在所有詩句之下，需要一塊磐石。\n\n登山寶訓一百多節，只有兩節直接談婚姻，\n卻處處都是給婚姻的忠告。\n就從最後那幅畫面開始吧：\n兩間房子，一間蓋在沙土上，一間蓋在磐石上。\n雨淋、水沖、風吹，沙上的倒了，磐石上的站住了。\n\n什麼是蓋在磐石上的婚姻？\n不是沒有雨，而是雨來的時候不倒；\n不是沒有爭執，而是爭執的時候，仍然問同一個問題：\n「耶穌在這裡最想要什麼？」\n\n聽了就去行，這是磐石；\n只是聽，不去行，就是沙土。\n把耶穌的話放在婚姻的節奏、浪漫、甚至衝突的中心——\n一起讀經、一起禱告、一起唱歌、一起感謝、一起享受祂。\n每一段婚姻都很快會發現：\n要不從磐石上漂走，需要被聖靈充滿的刻意。\n\n當氣象預報變暗，烏雲爬過來，風開始呼嘯，\n我們就會感覺到，我們的愛，到底蓋在哪裡。\n我們更在乎順服耶穌，還是更在乎自己的方式？\n每天勝出的，是祂的話，還是我們的感覺？\n\n七年，不是一個魔咒，\n而是一個提醒：\n房子蓋好了，現在是檢查地基的時候。\n\n願你們的婚姻，有雅歌的甜，\n更有登山寶訓的穩。\n願你們在風雨中，仍能並肩站著，\n笑著說：這房子沒倒，\n不是因為我們很強，\n而是因為底下，是那塊永不挪移的磐石。\n\n#婚姻 #七年之癢 #登山寶訓 #磐石 #結婚週年"}, "is-it-the-thought-that-counts": {"zh": "心意最重要嗎？", "tags": ["溝通與親密", "給丈夫"], "core": "別拿「心意最重要」掩飾不用心；要按照對配偶的認識去愛，而不只是更努力地愛。", "sum": ["「心意最重要」常被拿來為不用心的禮物開脫。", "真正有價值的心意，是基於了解、讓對方真正感到喜悅的心意。", "彼得要丈夫「按情理（照著知識）」與妻子同住；許多丈夫其實是照著對自己的認識在愛。", "不必愛得更多，而是愛得更好：帶著知識與辨別力的愛。", "耶穌以不同方式安慰馬大與馬利亞，示範按每個人的需要去愛。"], "mm": {"c": "有知識的愛", "b": [["常見藉口", ["心意最重要", "掩飾不用心"]], ["按情理同住", ["照著知識", "研究你的配偶"]], ["愛得更好", ["不是更多", "有辨別力"]], ["耶穌榜樣", ["馬大要真理", "馬利亞要陪伴"]]]}, "fw": {"q": "為什麼我的用心常常沒打中？", "a": "因為照著自己的喜好愛，而非照著對方", "steps": ["承認自己常用「我喜歡的」方式愛", "持續學習配偶的喜好與需要", "依所學調整愛的方式"], "do": ["問配偶：最近什麼事讓你最感到被愛？", "記下對方的偏好清單"]}, "gold": ["別再努力愛得更多，試著愛得更好。", "許多丈夫照著知識愛妻子——只是那是對自己的知識。", "好的心意，是讓對方感到喜悅的心意。"], "ref": ["彼得前書 3:7", "腓立比書 1:9", "約翰福音 11"], "fb": "想像一下：\n一位光頭的丈夫，收到妻子送的高級梳子；\n一位死忠的球迷，收到妻子花好幾個小時、親手織的——敵隊的毛毯。\n他愣在那裡，她笑著說：「心意最重要嘛！」\n他只好默默想：嗯，這心意……真的很特別。\n\n「心意最重要」這句話，本來是用來安慰那些用心卻沒打中的禮物。\n可是很多時候，它被拿來替「不用心」找台階。\n最諷刺的是，一句強調「心思」的話，常常被用來掩飾沒有用心思。\n\n真正算數的心意，不是隨便的心意，\n而是「有認識的心意」——讓對方真正感到喜悅的心意。\n\n彼得對丈夫說：要按情理和妻子同住。\n「按情理」，原文是「按著知識」。\n很多丈夫其實真的是按著知識愛妻子——只是，那是對自己的知識。\n他們規劃了一場自己會很開心的約會，送了一份自己會很想要的禮物，\n然後很困惑：她為什麼沒有很感動？\n\n如果你覺得自己已經愛得很累、追求得很累，\n這句話也許能讓你鬆一口氣：\n別再努力愛得「更多」，試著愛得「更好」。\n\n保羅為腓立比教會禱告：願你們的愛，在知識和各樣見識上，多而又多。\n不是更多的愛，而是更有智慧、更有辨別力的愛。\n如果世上有一種關係，最該向世界示範這種愛，那就是婚姻。\n\n「同住」，不是住在同一個地址就好，\n而是像一個坐在第一排的學生，眼睛、心思、心門都打開，\n熱切地想認識這份叫作「妻子」的禮物。\n一年一年，你越認識她，就越知道怎麼愛她。\n\n耶穌就是這樣愛人的。\n拉撒路死後，馬大和馬利亞對祂說了一模一樣的話：「主啊，你若早在這裡，我兄弟必不死。」\n可是祂對馬大，用真理安慰她：我是復活，我是生命；\n對馬利亞，祂陪她一起哭。\n同樣的話，不同的人；同樣的愛，不同的方式。\n\n你知道你的另一半，比較需要真理，還是比較需要陪伴嗎？\n你知道她累的時候想被擁抱，還是想被幫忙？\n你知道他沮喪的時候想說話，還是想安靜？\n你上一次「研究」你的配偶，是什麼時候？\n\n雖然這段經文是對丈夫說的，但這個原則也屬於妻子。\n當兩個人都在學習對方的語言，都在搶著用對方喜歡的方式彼此尊重，\n那個家，就會充滿被理解的溫暖。\n\n今天，問一個簡單的問題吧：\n「最近，我做了什麼事，讓你最覺得被愛？」\n然後，安靜地聽，好好地記。\n因為真正的心意，\n是從認識開始的。\n\n#婚姻 #溝通 #愛的語言 #彼得前書 #按情理同住"}, "your-first-years-of-marriage": {"zh": "婚姻的頭幾年", "tags": ["婚前與擇偶", "衝突與修復"], "core": "新婚最大的障礙不是外在環境，而是內在的罪；讓神的話定義「正常」，與聖靈同行，就能減少碰撞。", "sum": ["作者與丈夫看似天作之合，卻低估了內住罪的頑固。", "每個人都帶著原生家庭的「正常」進入婚姻；這可以豐富婚姻，也可能成為偶像。", "讓神的話定義正常：妻子順服丈夫的帶領，丈夫以基督為愛與帶領的標準。", "與聖靈同行：不要彼此貪圖虛名、惹氣、嫉妒；世界教男女彼此競爭，婚姻卻是同一隊。", "母親的建議：選擇以神的話為權威的伴侶，才有穩固的共同基礎。"], "mm": {"c": "新婚功課", "b": [["真正的障礙", ["內住的罪", "而非外在環境"]], ["定義正常", ["原生家庭差異", "以神的話為準"]], ["與聖靈同行", ["不嫉妒惹氣", "男女不是對手"]], ["共同基礎", ["神的話是權威", "經得起風雨"]]]}, "fw": {"q": "新婚夫妻如何減少碰撞？", "a": "讓神的話成為婚姻的標準", "steps": ["察覺原生家庭帶來的「正常」", "以聖經重新定義新家庭", "與聖靈同行，拒絕彼此競爭"], "do": ["列出彼此原生家庭的不同習慣並討論", "遇到分歧時一起查考聖經"]}, "gold": ["婚姻最大的顛簸，常常在自己裡面。", "原生家庭可以豐富婚姻，但不能統治婚姻。", "以神的話為權威，就有無論如何都站得住的共同基礎。"], "ref": ["提摩太後書 3:16-17", "以弗所書 5:22-25", "加拉太書 5:25-26"], "fb": "訂婚時，她覺得他們簡直是天作之合：\n都愛耶穌、都愛讀經、都愛敬拜、都想要很多孩子、都喜歡接待、\n都有北歐血統，連挖苦瑞典人和挪威人的笑話都懂。\n她想不出婚後會遇到什麼困難。\n\n後來她才發現，最大的顛簸，不在路上，而在自己裡面。\n她以為阻礙會是外在的：錢、健康、工作；\n結果真正的阻礙，是兩個人心裡那頑固的罪。\n\n新婚的頭幾年，最需要學的第一課：讓神來定義「正常」。\n\n她從小在一個有二十七個表兄弟姊妹的大家族長大，十四歲就當阿姨，家裡永遠有小孩；\n他只有四個表親，幾乎沒近距離接觸過嬰兒。\n她長在鄉下，覺得戶外是用來工作的——割草、燒雜物、餵動物；\n他長在城市郊區，覺得戶外是用來玩的——爬山、騎車、划船。\n\n每個人都帶著原生家庭的「正常」走進婚姻。\n這些差異可以讓婚姻更豐富、更有趣、更有笑聲；\n也可能悄悄成為心裡的偶像。\n如果童年的正常，成了婚姻的最高標準，我們的忠誠就放錯了地方。\n\n原生家庭可以豐富婚姻，但不能統治婚姻。\n\n在婚姻裡，神正在做一件新事：一個新的一體，一個新的家。\n妻子要重新排序，在新的家裡學習跟隨丈夫的帶領；\n丈夫要以基督為愛與帶領的標準，原生家庭的做法，只在合乎基督時才保留。\n\n她的母親在她年輕時，只給了一個擇偶建議：\n「神的話，必須是他的權柄。」\n若神的話是你們的標準——不是文化，不是朋友的意見，不是家族傳統，不是影集，不是社群媒體——\n那麼無論發生什麼事，你們都有一塊共同站立的磐石。\n\n第二課：與聖靈同行。\n保羅說：不要貪圖虛名，彼此惹氣，互相嫉妒。\n兩個相愛、承諾「無論好壞」的人，怎麼會彼此嫉妒、互相惹氣？\n其實，這在婚姻裡太常見了。\n\n世界告訴我們，男人和女人在兩支不同的隊伍裡。\n女孩從小被教導，要贏過男孩才代表自己夠好。\n帶著這種競爭心進入婚姻，就會不知不覺地比較、計較、爭輸贏。\n\n可是婚姻不是男隊對女隊的比賽，\n而是一支隊伍，一起對抗罪、一起追求基督。\n\n新婚的你們，會不會也在某些地方暗暗較勁？\n會不會把「我家都是這樣做的」當成真理？\n\n親愛的，頭幾年的顛簸很正常。\n別害怕路不平，\n要害怕的，是忘了誰在開路。\n讓神的話鋪路，讓聖靈掌舵，\n顛簸，就會變成你們一起長大的痕跡。\n\n#新婚 #婚姻 #原生家庭 #聖靈 #夫妻同心"}, "romance-after-kids": {"zh": "有了孩子之後的浪漫", "tags": ["溝通與親密"], "core": "育兒忙亂時期也不要暫停浪漫；夫妻的喜悅能支撐育兒，也是孩子需要看見的。", "sum": ["作者有五個孩子，常被疾病與忙碌包圍，浪漫似乎是有錢有閒人的特權。", "但浪漫值得追求：欣賞美善能供應力量，避免在育兒戰場上疲乏。", "孩子需要看見父母彼此相愛；「保養顧惜」是充滿喜悅的字眼。", "實際做法：一起早起、讀詩篇、感謝神賜下彼此。", "孩子睡後放下手機，問「今天過得如何」；一起玩、一起笑，幽默是婚姻安全感的表現。"], "mm": {"c": "育兒期浪漫", "b": [["困境", ["時間與精力不足", "似乎只能務實"]], ["為何要浪漫", ["美善供應力量", "孩子需要看見"]], ["日常做法", ["一起早起", "睡前聊天"]], ["一起玩", ["幽默與笑聲", "安全感"]]]}, "fw": {"q": "孩子小、生活忙，還能談浪漫嗎？", "a": "能，而且更需要", "steps": ["認清浪漫是育兒的燃料", "把小小的面對面時刻排進日常", "用玩笑與喜樂經營安全感"], "do": ["孩子睡後10分鐘不看手機，彼此分享", "找一件兩人都覺得好笑的事一起做"]}, "gold": ["育兒很務實，但婚姻不能只剩務實。", "父母彼此相愛，是孩子最需要的禮物之一。", "每一個刻意的面對面時刻，都有幫助。"], "ref": ["以弗所書 5:29", "詩篇 19"], "fb": "五個孩子。\n妻子剛從病中恢復，一家人第二次居家隔離，\n兩個孩子這幾天輪流吐。\n他半開玩笑地想：浪漫，大概是有錢有閒的人才有的奢侈品吧。\n\n我們的世界，繞著「需要」轉：要換的尿布、要洗的碗、要回的訊息、要哄的孩子。\n在這樣的季節，好像只能務實、只能肩並肩打仗，\n面對面、慢慢地相處，聽起來像天方夜譚。\n\n可是，真的該把浪漫按下暫停鍵嗎？\n\n育兒很務實，但婚姻不能只剩務實。\n\n理由一：欣賞美善，是生命的養分。\n育兒的戰場不適合膽小的人。\n若沒有固定的時刻，一起被神的美好充電——\n日出日落、好吃的一餐、動人的旋律，尤其是在彼此身上看見的神的形像——\n我們會被疲憊打倒，甚至忘了當初為什麼要養育這些孩子。\n\n理由二：孩子需要看見父母彼此相愛。\n神設計父母，是要讓喜樂滿溢；\n父母彼此的喜悅，像泉水一樣流到孩子身上。\n以弗所書說要「保養顧惜」自己的身體——\n「顧惜」不是一個務實的字，它是一個充滿喜悅、會寫進情詩裡的字。\n\n那麼，在這片育兒的大草原上，浪漫長什麼樣子？\n不是威尼斯的貢多拉，而是很平凡、卻很刻意的小事。\n\n一起起床。\n天還沒亮，孩子還沒醒，兩個人揉著眼睛，\n把神的憐憫一條一條說出來，用詩篇向神禱告，\n直接為「彼此」這份不配得的禮物獻上感謝——這就是浪漫。\n\n孩子睡後，留幾分鐘給彼此。\n晚餐太混亂，不適合面對面；\n要在孩子都睡了以後，在你們快要陷入疲憊的恍惚之前，\n不開電視、不拿手機，轉向對方說：「告訴我，你今天過得怎樣？」\n\n一起玩。\n晚上十點以後，她的濾鏡常常失靈，開始吐槽、開始笑到流淚，\n他也配合演出誇張的反應。\n外人看起來，像兩個國中生在打情罵俏；\n其實那是一種婚姻裡的安全感——\n只有在最放心的人面前，人才敢這麼傻。\n\n浪漫不是逃離現實，\n而是在現實裡，替彼此點一盞燈。\n\n你們上一次一起笑到停不下來，是什麼時候？\n上一次不看手機、只看著對方，是什麼時候？\n\n孩子會長大，會離家，\n有一天，家裡又會只剩你們兩個。\n願那一天，你們不是兩個陌生的室友，\n而是兩個一起走過戰場、仍然會為對方心動的戀人。\n\n#婚姻 #育兒 #浪漫 #夫妻時光 #保養顧惜"}, "one-another-your-one-and-only": {"zh": "彼此相愛，從你的唯一開始", "tags": ["溝通與親密"], "core": "許多婚姻是「追求、得手、共存」；神卻呼召我們「追求、得手、繼續追求」，因為神就是這樣愛我們。", "sum": ["作者在婚禮上會說：「好好享受今天，然後在某方面假裝它沒發生過。」", "意思是：別在婚後停止追求；許多夫妻婚後只剩「一起存在」。", "為什麼要持續追求？因為神對我們的愛是不停的追尋：恩惠慈愛必隨著我。", "目標是反映，不是完美。", "持續勝過華麗：像生火一樣，先用小樹枝累積熱度，日常的小追求比偶爾的大驚喜更重要。"], "mm": {"c": "持續追求", "b": [["常見模式", ["追求", "得手", "共存"]], ["更好模式", ["追求", "得手", "再追求"]], ["為什麼", ["神不停追尋我們", "反映而非完美"]], ["怎麼做", ["持續勝過華麗", "像生火"]]]}, "fw": {"q": "婚後怎麼保持愛的熱度？", "a": "效法神的愛，持續追求配偶", "steps": ["察覺自己是否已停止追求", "從神的追尋中找到動機", "建立每日小而持續的追求"], "do": ["每天做一件小事表達愛", "再安排一次像交往時的約會"]}, "gold": ["親吻新娘之後，別跟追求說再見。", "神得著了我們，卻從未停止追求。", "持續，比華麗更重要。"], "ref": ["詩篇 23:6", "以弗所書 2:7", "以弗所書 4:32"], "fb": "婚禮上，牧師對新人說：\n「今天，用盡全力好好享受。然後，從某個角度來說，假裝它從沒發生過。」\n新郎新娘瞪大眼睛，像是想舉手抗議：「我們等這一天等了好久耶！」\n\n牧師停頓了一下，才解釋那句話的關鍵：「從某個角度來說」。\n\n很多婚姻有一個悲傷的規律：\n親吻新娘的那一刻，也同時親吻了「追求」說再見。\n交往時，我們追求；\n結婚後，我們得手；\n然後，我們開始「一起存在」。\n追求、得手、共存——這是很多婚姻的三部曲。\n\n可是，如果有另一種三部曲呢？\n追求、得手、繼續追求。\n\n為什麼要繼續追求？\n不是因為婚姻專家這樣建議，而是因為神就是這樣愛我們的。\n大衛說：我一生一世必有恩惠慈愛隨著我——\n「隨著」，原文有「追趕」的意思。\n神的追求，不是只為了把大衛帶進祂的殿；\n大衛住進殿裡以後，祂仍然在追。\n保羅說，在永世裡，神要把祂極豐富的恩典，在恩慈上顯明給我們看。\n神得著了我們，卻從未停止追求我們。\n\n我們要的是反映，不是完美。\n沒有人能時時刻刻像耶穌那樣愛配偶，\n但被聖靈充滿的人，可以一點一點長得更像。\n\n當然，馬上會有人說：\n「我們做不到。」\n「沒時間、沒預算。」\n「我們有工作、有孩子、有責任，每天都快被壓扁了。」\n「不可能再像交往時那樣了。」\n\n如果追求的意思是常常製造華麗的驚喜，這些反對確實有道理。\n可是，持續勝過華麗。\n\n想想生火。\n一開始，不是先丟一根大木頭進去，\n而是先放很多小樹枝、細枝、乾葉子，讓熱度慢慢累積。\n太早丟大木頭，不但點不著，還會把火壓熄。\n\n婚姻也是。\n如果忽略了每天小小的追求，\n偶爾一次盛大的驚喜，反而會讓人覺得突兀、空洞。\n一則問候的訊息、一杯泡好的茶、一句「今天辛苦了」、\n一個出門前的擁抱、一次專心的聆聽——\n這些小樹枝，才是讓愛一直燒著的祕密。\n\n你們家的火，現在燒得怎麼樣？\n是熱烈的、溫暖的，還是只剩一點點餘燼？\n你今天，有添一根小樹枝嗎？\n\n婚禮那天，請盡情享受。\n然後，從追求這件事來說，假裝它從沒發生過——\n繼續追她、繼續追他，\n像那位從不停止追趕我們的神一樣，\n一天一天，一生一世。\n\n#婚姻 #追求 #持續的愛 #詩篇23 #夫妻"}, "the-wedding-at-the-end-of-marriage": {"zh": "婚姻盡頭的婚禮", "tags": ["福音與奧祕"], "core": "婚姻存在不只是解決單身的孤單，而是要告訴我們：我們需要耶穌，那位更好的新郎。", "sum": ["神先造亞當，讓他經歷「獨居不好」，才把夏娃帶給他：婚姻是創造的高峰。", "神讓亞當在祭壇前等待，好讓我們渴望夏娃；又等了許多世紀才差兒子來，好讓我們渴慕新郎。", "以弗所書5章：婚姻的奧祕是指基督與教會。", "丈夫的愛要顯出基督對我們的喜悅，妻子的順服要顯出我們對基督的喜悅。", "神一再用婚姻比喻祂救贖的熱情，所有婚姻都指向將來羔羊的婚筵。"], "mm": {"c": "更好的新郎", "b": [["創造次序", ["獨居不好", "婚姻是高峰"]], ["婚姻的目的", ["不只解孤單", "指向耶穌"]], ["夫妻角色", ["丈夫像基督", "妻子像教會"]], ["終極婚禮", ["神是丈夫", "羔羊婚筵"]]]}, "fw": {"q": "婚姻為什麼存在？", "a": "為了讓我們看見並渴慕基督", "steps": ["從創世記看婚姻的位置", "從以弗所書看婚姻的奧祕", "以將來的婚禮校準今天的婚姻"], "do": ["在婚姻中刻意反映基督與教會的關係", "向單身朋友分享：終極的婚姻是與基督"]}, "gold": ["婚姻存在，是要告訴我們：我們需要耶穌。", "每段婚姻都是一幅屬靈實況的畫布。", "真正的婚禮，在婚姻的盡頭。"], "ref": ["創世記 2:18-23", "以弗所書 5:22-32", "以賽亞書 54:5-6"], "fb": "你有沒有想過，為什麼人類的歷史，是從一個孤單的男人開始的？\n\n神造了亞當，然後停了下來。\n祂讓走獸飛鳥一一來到亞當面前，等他命名。\n一個又一個，一對又一對，牠們都有伴，只有他沒有。\n在一個充滿「好」的樂園裡，出現了唯一一句「不好」：\n那人獨居不好。\n\n然後，神使他沉睡，從他身上取出一根肋骨，造成一個女人，領到他面前。\n亞當醒來，脫口而出：這是我骨中的骨，肉中的肉！\n像一場愉悅的地震，震動了整個受造界。\n\n婚姻不是神臨時想到的附加品，而是創造的高潮。\n神刻意讓亞當在祭壇前等得夠久，久到我們也開始渴望夏娃。\n\n可是，這個故事真正想讓我們渴望的，不只是夏娃。\n\n神讓亞當在創造的祭壇前等候，\n又讓整個人類在歷史的祭壇前等了好幾千年，\n才差祂的兒子降世——\n好讓我們渴望那位新郎，並且在祂來的時候愛祂。\n\n保羅說：二人成為一體，這是極大的奧祕，但我是指著基督和教會說的。\n\n我們以為，婚姻存在是為了治癒單身的孤單；\n其實，婚姻存在是為了告訴我們：我們需要耶穌。\n\n每一段婚姻，都是一場關於基督的現場解說：\n祂熱烈而不放棄地追求祂所揀選的子民，\n而教會的心，也一直焦渴地等著祂。\n祂得不著她不肯罷休；她沒被祂尋見也無法安息。\n\n所以，丈夫的愛，要讓世界看見基督怎樣喜悅我們；\n妻子的回應，要讓世界看見我們怎樣喜悅基督。\n一位妻子的言語、態度、選擇，是在尊榮或背叛「基督的新婦」這個形像；\n一位丈夫的言語、態度、選擇，是在尊榮或背叛「新郎」這個形像。\n每一個家，都是一塊畫布。\n\n難怪神一再用婚姻來形容祂救贖的熱情。\n以賽亞說：造你的是你的丈夫；\n你像被離棄、心中憂傷的妻子，像幼年所娶、被休棄的妻子，耶和華卻召你回來。\n\n你的婚姻現在是什麼樣子？\n甜蜜的、平淡的、疲憊的、破碎的？\n無論如何，它都不是故事的全部。\n\n因為在婚姻的盡頭，還有一場婚禮。\n天要裂開，號角要吹響，\n新郎要從天而降，新婦要穿上潔白的細麻衣。\n那時，所有地上的婚禮，都會像預告片一樣，\n終於等到正片上映。\n\n願你今天的婚姻，\n不論笑著或哭著，\n都在為那一天練習——\n練習等候，練習回應，\n練習說出那一句：新郎啊，求你快來。\n\n#婚姻 #羔羊婚筵 #基督與教會 #創世記 #奧祕"}, "a-great-marriage-wrecking-lie": {"zh": "摧毀婚姻的大謊言", "tags": ["衝突與修復", "離婚"], "core": "「神只要我快樂」——照我自己的定義——是摧毀婚姻的謊言；神要我們透過捨己得著更長久的喜樂。", "sum": ["作者的叔叔細心照顧患腦癌的妻子直到她離世：這是聖經的婚姻圖畫——忠心、捨己中的喜樂。", "社會觀念轉變：過去是「我要為婚姻努力」，現在是「婚姻最好為我服務」。", "學者稱之為「靈魂伴侶模式」：婚姻成功的標準是主觀的快樂感。", "這謊言被用來合理化離婚、外遇、遺棄等各種自私。", "神確實要我們快樂，但由祂定義；祂要我們延遲眼前的滿足，透過捨己得著更大的喜樂。"], "mm": {"c": "神只要我快樂？", "b": [["榜樣", ["叔叔照顧病妻", "忠心與捨己"]], ["觀念轉變", ["為婚姻努力", "婚姻為我服務"]], ["謊言的果子", ["離婚與外遇", "各種自私"]], ["真理", ["神定義快樂", "捨己得長久喜樂"]]]}, "fw": {"q": "「神只要我快樂」錯在哪裡？", "a": "它把快樂的定義權從神手中奪走", "steps": ["辨識文化中的自我中心假設", "看見它如何瓦解盟約", "以捨己追求長久的喜樂"], "do": ["留意廣告與影視中「為自己而活」的訊息", "在婚姻中選擇一件需要捨己的事去做"]}, "gold": ["過去：我要為婚姻努力；現在：婚姻最好為我服務。", "神要你快樂，但由祂來定義快樂。", "延遲眼前的滿足，是為了更長久的喜樂。"], "ref": ["馬可福音 8:34-35", "以弗所書 5:25"], "fb": "他十歲那年，第一次見到阿姨。\n她坐在客廳中央的輪椅上，口水不停流下，不知道他來了，也無法照顧自己。\n叔叔溫柔地照顧她。\n他們是高中時的戀人，結婚十五年，她因腦癌走向生命的盡頭。\n叔叔沒有離開，沒有找別人。\n因為他曾當眾立誓：無論疾病健康，直到死亡把我們分開。\n\n這是一幅聖經的婚姻圖畫：在服事、忠心與捨己中，找到喜樂。\n\n可是時代變了。\n有人這樣形容：過去的態度是「我必須為婚姻努力」；\n今天的態度是「婚姻最好為我服務」。\n\n一位社會學家觀察到，上世紀六十年代以前，人們多以責任、義務、犧牲的眼光看婚姻；\n心理學革命之後，婚姻被看成實現自我、追求浪漫與親密的工具。\n婚姻成功的標準，不再是對配偶和孩子盡了多少責任，\n而是我主觀上覺得自己有多快樂。\n這被稱為「靈魂伴侶模式」。\n\n在這個模式的中心，藏著一個摧毀婚姻的謊言：\n「神只要我快樂」——而且，快樂由我來定義。\n\n這個謊言被拿來合理化很多事：\n墮胎、離婚、外遇、遺棄，各種各樣的自私。\n它聽起來很屬靈，卻像溶劑一樣，慢慢溶掉盟約的黏著劑。\n\n這個謊言之所以危險，是因為它扭曲了一個真理。\n神確實要我們快樂——\n但定義快樂的是祂，不是我們；\n而且，眼前的快樂從來不是祂首要的目標。\n\n神要的，是更長久、更深刻的快樂，\n而通往那份快樂的路，常常經過基督般的捨己。\n有時，那需要極大的信心：\n延遲眼前的滿足，等待更大的喜樂。\n\n這些文化假設很難察覺，因為它們藏在我們的潛意識裡，\n透過電視、電影、音樂、廣告，一點一點滲進來。\n「沒有規則，只有正確」「你值得更好的」「做你自己」……\n每一句單獨聽起來都無害，\n放進婚姻裡，卻可能成為壓垮駱駝的最後一根稻草。\n\n為婚姻努力的人，在病床邊找到愛；\n要婚姻服務自己的人，在病床邊找到出口。\n一個說「我在這裡」，一個說「我值得更好」；\n一個在犧牲中發現深度，一個在享受中逐漸空洞。\n\n你心裡，是哪一句話比較大聲？\n\n那位叔叔沒有讀過社會學，\n但他用一生回答了這個問題：\n真正的快樂，不是找到一個讓我快樂的人，\n而是在神面前，成為一個守約的人。\n\n那份快樂，可能來得慢，\n卻永遠不會被一張診斷書奪走。\n\n#婚姻 #謊言 #捨己 #守約 #真正的快樂"}, "what-keeps-couples-apart": {"zh": "是什麼讓夫妻疏離？", "tags": ["溝通與親密"], "core": "親密能讓婚姻承受小摩擦；但忙碌、不用心，以及更深層的心中障礙，會讓夫妻漸行漸遠。", "sum": ["作者買了重複的演唱會門票當生日禮物，妻子大笑；有些夫妻卻會為此大吵。", "差別在於婚姻的親密：彼此深刻的認識與情感，分享經歷、情緒、想法與性愛。", "障礙一：忙碌。親密需要大量時間，無法塞在零碎的十五分鐘裡。", "障礙二：不夠用心。希伯來書10:24要我們「彼此相顧」：觀察並思考對方，成為最了解配偶的專家。", "在時間與用心之下，還有更深的障礙：我們會為真正在乎的事投入時間。"], "mm": {"c": "親密的障礙", "b": [["親密的力量", ["承受小摩擦", "一笑置之"]], ["忙碌", ["各忙各的", "沒時間深談"]], ["不用心", ["彼此相顧", "研究配偶"]], ["更深障礙", ["心中真正在乎什麼", "需要省察"]]]}, "fw": {"q": "為什麼我們越來越疏遠？", "a": "缺乏時間、用心，以及背後的心中障礙", "steps": ["檢視時間分配", "刻意觀察並思考配偶", "找出阻礙投入的更深原因"], "do": ["每週固定一段不被打擾的兩人時間", "寫下三件你最近才發現的配偶特點"]}, "gold": ["親密讓婚姻能一笑置之，而不是大吵一架。", "你應該成為世界上最了解配偶的專家。", "我們總會為真正在乎的事撥出時間。"], "ref": ["希伯來書 10:24"], "fb": "妻子生日那天，他興奮地送上兩張演唱會門票。\n那是她最喜歡的樂團，他特地多花了一點錢買了好位子。\n她打開信封，愣了一下，然後——爆笑。\n笑到喘不過氣。\n原來，他們幾個月前早就一起買過同一場、同一晚的票了。\n而且，那兩張舊票的位子，還比較好。\n\n他們後來想：如果這件事發生在別的夫妻身上，可能不是笑話，而是一場大戰。\n妻子會把它當成「他根本不在乎我」的鐵證，一講再講；\n丈夫會死不認錯，越辯越硬。\n\n為什麼有些婚姻能把小摩擦笑著吞下去，有些婚姻卻一碰就碎？\n很大一部分原因，是親密。\n\n親密，是夫妻彼此深刻的認識與情感：\n喜歡一起經歷、一起感受、一起思考、一起享受性的親密。\n它像婚姻的避震器，讓小小的冒犯、愚蠢的疏忽、說錯的話，不至於造成重傷。\n\n那麼，是什麼讓夫妻失去親密？\n\n第一，是忙碌。\n親密需要大量的時間，不能塞在零碎的十五分鐘裡。\n工作、家務、教會服事、接送孩子——每一件都是好事，\n卻讓夫妻像夜裡擦身而過的兩艘船，\n只來得及打個招呼，來不及深談。\n\n第二，是不用心。\n文化告訴我們：只要找到靈魂伴侶，親密就會魔法般地自動出現。\n當我們發現不是這樣，就幻滅了。\n希伯來書說：要彼此相顧，激發愛心，勉勵行善。\n原文的重點不只是「怎麼激勵別人」這個計畫，而是「彼此相顧」這個人。\n「相顧」是仔細觀察、用心思考。\n你要成為全世界最了解你配偶的專家。\n像任何研究領域一樣，這需要精力、專注和投入。\n\n可是，在這兩個障礙之下，還有更深的障礙。\n我們總會為真正在乎的事撥出時間。\n熱愛的劇，再忙也會追；熱愛的球隊，再累也會看。\n那麼，是什麼讓我們不願意這樣投資在婚姻上？\n\n是害怕被看透？是累積的失望？是暗暗的怨氣？是不知從何開始的尷尬？\n親密的障礙底下，常常還有障礙。\n\n忙碌讓我們沒時間，不用心讓我們沒方法，\n更深的心結，讓我們沒意願。\n\n你最近一次真正「研究」你的另一半，是什麼時候？\n你知道他最近最煩惱什麼嗎？知道她最近最開心的是什麼嗎？\n\n願你們的婚姻，\n有足夠的時間，足夠的用心，\n更有足夠的勇氣，去拆掉心底那堵牆。\n然後，當下一次有人買重了票，\n你們能一起笑得東倒西歪，\n笑著說：還好，我們一起去兩次。\n\n#婚姻 #親密 #忙碌 #彼此相顧 #夫妻"}, "the-hidden-enemy-of-family": {"zh": "家庭隱藏的敵人", "tags": ["衝突與修復", "婚姻使命"], "core": "家庭的失序往往是屬靈的爭戰；要抵擋撒但，個別家庭需要教會這個大家庭的敬拜與同工。", "sum": ["撒但樂見家庭破碎；牠雖藉人工作，但我們爭戰的對象不是屬血氣的。", "以弗所書把家庭的教導夾在「集體敬拜」與「集體爭戰」之間。", "原文中5:22的「順服」借用5:21的動詞，把家庭與教會的敬拜緊緊相連。", "教會是家庭的力量來源、榜樣與保護：被聖靈充滿的群體，才能活出各樣家庭角色。", "沒有一個家庭擁有所需的一切資源；藐視神的家，就難以建立自己的家。"], "mm": {"c": "屬靈爭戰中的家", "b": [["真正敵人", ["撒但", "非屬血氣"]], ["經文結構", ["集體敬拜", "家庭角色", "集體爭戰"]], ["教會的角色", ["力量", "榜樣", "保護"]], ["應用", ["委身教會", "穿戴軍裝"]]]}, "fw": {"q": "如何保護家庭不被擊垮？", "a": "把家庭扎根在教會的敬拜與爭戰中", "steps": ["認清家庭衝突背後的屬靈爭戰", "在集體敬拜中被聖靈充滿", "與弟兄姊妹一同穿戴全副軍裝"], "do": ["固定參與主日與小組", "請教會肢體為你的家庭禱告"]}, "gold": ["家庭失和，常常比表面上更屬靈。", "沒有一個家庭能獨自成為完整的基督徒家庭。", "藐視神的家，就很難建立自己的家。"], "ref": ["以弗所書 5:18-6:20"], "fb": "一個家，為什麼會一直吵？\n是個性不合？是溝通不良？是壓力太大？\n也許都是。但也許，不只是這樣。\n\n家庭的失序，常常比表面看起來更屬靈。\n撒但樂見家庭破碎，牠努力讓家變得軟弱；\n家越軟弱，牠的統治就越強。\n\n牠常常透過人來工作，透過血肉之軀；\n可是保羅說：我們並不是與屬血氣的爭戰。\n真正的敵人，不是坐在你對面的那個人。\n\n那我們要和誰結盟，來抵擋牠對家庭的攻擊？\n答案是：神的家——教會。\n\n很多人沒有注意到，以弗所書的結構很有意思：\n關於夫妻、親子、主僕的教導，\n前面是集體的敬拜：被聖靈充滿，用詩章頌詞靈歌彼此對說；\n後面是集體的爭戰：穿戴神所賜的全副軍裝。\n家庭，被夾在敬拜與爭戰之間。\n\n甚至在原文裡，「妻子要順服」那一句沒有自己的動詞，\n它借用了前一節「彼此順服」的動詞。\n保羅用特殊的文法，把家庭和聚集的教會緊緊綁在一起。\n\n意思是：個別家庭的生命，是從神的大家庭滿溢出來的。\n\n教會是家庭的力量來源——被聖靈充滿的群體，才能活出各樣的家庭角色；\n教會是家庭的榜樣——教會怎樣順服基督，妻子怎樣順服丈夫；基督怎樣愛教會，丈夫怎樣愛妻子；\n教會是家庭的保護——一同穿戴軍裝的弟兄姊妹，是你家最堅固的城牆。\n\n有一位神學家提醒過：家庭需要教會，就像樹需要森林。\n一個家再努力，也缺少某些只有肢體才能給的東西——陪伴、榜樣、勸勉、眼淚。\n神從來就沒有打算讓一對父母，單獨扛起把孩子帶到基督面前的全部重擔。\n\n我們以為，顧好自己的小家，就是對教會最好的貢獻；\n其實，投入神的大家，才是顧好小家最好的方法。\n\n藐視神的家，就很難建立自己的家；\n孤立的家，是仇敵最喜歡的獵物。\n\n你家最近的爭吵，是不是一直在對著彼此開火？\n你們有多久沒有一起去聚會、一起敬拜、一起被肢體代禱了？\n你們的家，有沒有一群可以在夜裡打電話求救的弟兄姊妹？\n\n親愛的，把武器從彼此身上移開，\n轉向真正的敵人。\n然後，帶著你的家，走進神的家；\n在那裡，一起唱歌，一起禱告，一起穿上軍裝。\n\n因為一根筷子容易折斷，\n一把筷子很難折斷；\n一個家庭也許會疲憊，\n但一整支軍隊肩並肩站著，\n地獄的門，也不能勝過。\n\n#婚姻 #家庭 #教會 #屬靈爭戰 #以弗所書"}, "the-other-spurgeon": {"zh": "另一位司布真", "tags": ["苦難與死亡"], "core": "司布真的妻子蘇珊娜一生病痛，卻與丈夫同心服事；丈夫離世後，她繼續推動送書事工，祝福數萬牧者。", "sum": ["1892年司布真在法國去世，久病的蘇珊娜在悲傷中決定延續丈夫以福音為中心的事工。", "1875年起她發起「司布真夫人送書基金」，到1903年共送出二十多萬本書給兩萬五千位牧者。", "她也協助建立教會、寫書、合編司布真自傳。", "她在訂婚時就立志永不攔阻丈夫的事奉，即使年老、患病、孤單也未改變。", "兩人36年的婚姻充滿愛與苦難；她相信在風暴中仍能讚美神，全是恩典。"], "mm": {"c": "蘇珊娜·司布真", "b": [["相遇", ["天路歷程", "信心成長"]], ["婚姻", ["36年相愛", "苦難相隨"]], ["送書基金", ["20萬本書", "2.5萬位牧者"]], ["寡居事奉", ["建立教會", "編寫自傳"]]]}, "fw": {"q": "苦難中的妻子能有怎樣的事奉？", "a": "在病痛與喪偶中仍委身福音事工", "steps": ["支持而不攔阻丈夫的事奉", "從自己的負擔中開展事工", "在失去後延續屬神的託付"], "do": ["思考：我能如何支持配偶的呼召？", "在苦難中尋找可以服事人的方式"]}, "gold": ["在風暴中仍能讚美，全是恩典的工作。", "她立志永不攔阻丈夫的事奉，至死不渝。", "病痛限制了她的身體，卻沒有限制她的服事。"], "ref": [], "fb": "1892年冬天，法國南部的海邊。\n一位被稱為「講道王子」的牧師，在妻子的陪伴下離開了人世。\n他的遺體被運回倫敦，數萬人前來致哀；\n她卻因悲傷與病痛，暫時無法回家，\n只能坐在義大利海岸的一座宅邸前，望著地中海。\n\n她的名字叫蘇珊娜·司布真。\n大家都記得她的丈夫，很少人記得她。\n\n她一生多病，長年承擔丈夫事奉的壓力，也承擔自己身體的軟弱。\n那天，她望著大海，問自己：沒有他，我還能做什麼？\n\n她想起十七年前。\n丈夫的新書即將出版，她說：真希望英國每一位牧師都能有一本。\n丈夫沒有一笑置之，而是鼓勵她：那就去做吧。\n於是，「司布真夫人送書基金」開始了。\n\n到她離世時，她已經送出二十多萬本書，給兩萬五千位牧者。\n許多貧窮的鄉村牧師，因為這些書而重新得力，他們的教會也因此堅固。\n她還協助建立教會、自己寫書、合編丈夫的自傳。\n\n我們以為，病弱的人只能被服事；\n她卻證明，病弱的人也能服事成千上萬的人。\n病痛限制了她的身體，卻沒有限制她的使命；\n喪偶奪走了她的伴侶，卻沒有奪走她的呼召。\n\n他們的故事是這樣開始的：\n年輕的牧師聽說一位女孩在信仰上掙扎，便送她一本他最愛的《天路歷程》。\n那本書打開了她害羞的心，愛情也悄悄萌芽。\n訂婚時，她立志：一生永不攔阻他的事奉。\n三十六年的婚姻裡，有甜蜜，也有接連不斷的苦難；\n而這個承諾，她守到最後，甚至守到他離開以後。\n\n她曾寫下大意這樣的話：\n當風暴襲來、喜愛的樹木凋零，當神拿走我們習慣的安慰，\n甚至把我們最深的心愛之人也帶走，\n那時還能向祂歌唱、頌讚祂的名——那完全是祂白白的恩典。\n\n你是不是也覺得，自己太軟弱、太疲憊，什麼都做不了？\n你是不是以為，只有站在台前的人，才是在事奉？\n\n有一種事奉，是不攔阻；\n有一種事奉，是在背後支持；\n有一種事奉，是在失去之後，仍然把託付接過來，繼續往前走。\n\n講台上的聲音會停止，\n但一本本送出去的書，一顆顆被激勵的心，\n會在許多看不見的鄉村教會裡，繼續迴響。\n\n願我們也記得，那「另一位司布真」——\n她提醒我們：在神的國裡，\n沒有一個軟弱的人，是無用的；\n沒有一段眼淚，是白流的。\n\n#婚姻 #司布真 #寡婦 #事奉 #苦難中的恩典"}, "a-man-worthy-of-a-wife": {"zh": "配得妻子的男人", "tags": ["婚前與擇偶", "給丈夫"], "core": "波阿斯是配得路得的男人：他在暗處與人前一樣正直，主動保護、供應、敬畏神。", "sum": ["聖經中值得效法的婚姻很少，波阿斯與路得是少數的美好例子。", "重要的智慧：一個人婚前的樣子，很大程度就是他婚後的樣子；誓言無法改變品格。", "橡樹從橡實長出，不從荊棘長出：不要嫁給荊棘，期待婚禮讓他變好。", "波阿斯是「大財主」，也是可敬的人：不濫用財富與權力，在暗處也正直。", "他一見路得就主動保護她，預先吩咐僕人不可欺負她。"], "mm": {"c": "配得妻子的男人", "b": [["關鍵原則", ["婚前即婚後", "誓言改不了品格"]], ["可敬", ["人前人後一致", "不濫用權力"]], ["保護", ["預見危險", "主動阻止"]], ["擇偶應用", ["觀察他如何對待女性", "等候橡實"]]]}, "fw": {"q": "什麼樣的男人值得嫁？", "a": "像波阿斯一樣，在暗處也正直、主動保護人", "steps": ["觀察他婚前的品格", "看他是否保護身邊的女性", "看他在無人時是否仍正直"], "do": ["請信任的朋友一起評估交往對象", "弟兄們：先努力成為那樣的人"]}, "gold": ["婚前的他，大致就是婚後的他。", "不要嫁給荊棘，期待它變成橡樹。", "真正可敬的人，在暗處與人前一樣。"], "ref": ["路得記 2:1-9", "路得記 3:11"], "fb": "「他現在是有點問題，可是結婚以後，他會改的。」\n很多女孩在婚前這樣說。\n很多妻子在婚後，再也說不出這句話。\n\n有一個不受歡迎卻非常重要的智慧：\n一個人婚前是什麼樣子，很大程度上，就是他婚後的樣子。\n誓言很神聖，但誓言改變不了品格。\n\n橡樹是從橡實長出來的，不是從荊棘長出來的。\n當然，神有時會在荊棘地裡行神蹟；\n但我們不該嫁給荊棘，然後期待婚禮把它變成橡樹。\n\n聖經裡值得效法的婚姻其實很少——雅各、亞伯拉罕、大衛，都有明顯的失敗。\n所以波阿斯和路得的故事格外珍貴。\n\n我們第一次聽到波阿斯，聖經就說：他是一個大財主。\n這個詞也有「值得敬重、有德行」的意思。\n他有錢有勢，卻沒有用財富和權力換取自私的享樂；\n他看重責任，照顧所託付給他的人，保護軟弱的人。\n\n他第一次見到路得——一個遠離家鄉、孤苦無依的外邦寡婦——\n立刻為她的安全負起責任。\n他告訴她：留在我的田裡，跟著我的使女。\n然後，他沒有等出事，就先去吩咐僕人們：不可欺負她。\n\n好男人有足夠的警覺，預見危險；\n也有足夠的勇氣，去阻止危險。\n\n真正可敬的男人，在暗處和人前一樣。\n沒有人看見的時候，他仍然正直；\n有權力的時候，他仍然謙卑；\n有機會佔便宜的時候，他仍然保護。\n\n所以，姊妹們，當你在考慮一位弟兄時，\n不只看他對你好不好——交往中的人，很少對你不好；\n也要看他怎麼對待其他女性：\n他會主動保護她們嗎？他會在言語和界線上尊重她們嗎？\n他在沒有人看見的地方，是什麼樣子？\n\n弟兄們，這篇文章不只是給姊妹看的。\n與其問「我值不值得被愛」，不如問「我配不配得上一位路得」？\n你今天的品格，就是你未來妻子會嫁的那個人。\n\n婚前不看清楚，婚後就要用一輩子去看清楚；\n婚前選擇橡實，婚後才能在樹蔭下安歇。\n\n願你等候的，是一顆橡實，\n不是一叢包裝得很漂亮的荊棘。\n也願你自己，成為那樣的一顆橡實——\n在無人的田野裡，安靜地長成一棵\n能為別人遮風擋雨的大樹。\n\n#擇偶 #單身 #波阿斯 #品格 #路得記"}, "a-worthy-wife-to-be": {"zh": "配作妻子的女人", "tags": ["婚前與擇偶", "給妻子"], "core": "路得被稱為「賢德的女子」：她忠誠、無畏、倚靠神，並以順服的方式主動。", "sum": ["路得在禾場躺在波阿斯腳下，是以當時的方式請求他娶她，看似冒險卻是純潔的。", "她唯一一次被稱為「賢德的女子」，正是在這最脆弱的時刻。", "真正賢德的女人，在暗處與人前一樣。", "她忠誠：在有充分理由離開時，仍緊跟婆婆拿俄米，說「你的神就是我的神」。", "她無畏：明知留下可能受苦甚至死亡，仍堅定立誓。"], "mm": {"c": "賢德的女子", "b": [["禾場一幕", ["謙卑的主動", "純潔與勇氣"]], ["忠誠", ["緊跟拿俄米", "你的神是我的神"]], ["無畏", ["不怕犧牲", "堅定立誓"]], ["倚靠神", ["投靠神翅膀下", "順服的主動"]]]}, "fw": {"q": "什麼樣的女子適合作妻子？", "a": "像路得一樣忠誠、勇敢、倚靠神", "steps": ["在困境中保持忠誠", "在風險中展現勇氣", "以順服的方式表達心意"], "do": ["弟兄們：看重品格勝過外表", "姊妹們：在日常關係中操練忠誠"]}, "gold": ["賢德不是在聚光燈下，而是在黑暗中仍然賢德。", "她有一百個離開的理由，卻選擇留下。", "真正的勇氣，常以安靜謙卑的方式出現。"], "ref": ["路得記 1:14-17", "路得記 2:11", "路得記 3:7-11"], "fb": "夜深了。打穀場上，一個男人吃飽喝足，在糧堆旁睡著。\n一個女子輕輕走來，掀開他腳上的被，躺了下來。\n她知道通常是男人主動；\n她知道這看起來可疑，甚至可能成為醜聞；\n她知道別人會怎麼說，也知道自己可能再失去一切。\n可是她仍然躺在那裡——脆弱、盼望、信任、勇敢——\n等著那個男人醒來。\n\n這是路得，用當時的方式，請求波阿斯娶她。\n\n讀到這一幕，很多人會不自在。\n可是在神眼中，她是純潔而光明的。\n更驚人的是，在路得記四章裡，她只有一次被稱為「賢德的女子」——\n就是在這個最脆弱的時刻。\n\n賢德不是在聚光燈下的表現，\n而是在黑暗中，仍然賢德。\n\n路得的賢德，從哪裡來？\n\n先是忠誠。\n她的丈夫死了，婆婆拿俄米也失去了丈夫和兩個兒子。\n拿俄米勸兩個媳婦回娘家，俄珥巴親吻婆婆離開了，路得卻捨不得她。\n她說：妳往哪裡去，我也往哪裡去；妳的國就是我的國，妳的神就是我的神。\n除非死，誰也不能使我們分離。\n\n她有一百個離開的理由，卻選擇留下。\n留下意味著受苦、犧牲、冒險，甚至可能死亡——\n那是一個士師不照顧寡婦、人人任意而行的時代。\n\n然後是無畏。\n沒有勇氣，就不可能在這樣的處境中保持忠誠。\n她不是天真，她清楚知道前面有什麼，\n她只是更清楚知道，自己投靠的是誰——\n她是來投靠在耶和華的翅膀底下。\n\n再來，是一種很美的姿態：謙卑的主動。\n她不是被動地等，也不是強勢地抓；\n她把自己放在一個需要對方回應的位置，\n把結果交給神，也交給那位值得信任的男人。\n\n世界說：女人要嘛等待，要嘛爭取；\n路得卻示範了第三種：在信靠中，勇敢而謙卑地表達。\n\n波阿斯後來說：本城的人都知道妳是賢德的女子。\n不是因為她多美，不是因為她多能幹，\n而是因為她在最難的時候，仍然忠誠；\n在最暗的時候，仍然純潔。\n\n姊妹們，妳是否以為，賢德只是一種外在的形象？\n弟兄們，你在尋找的，是一個會打扮的人，還是一個會留下的人？\n\n願我們都看重這樣的女子：\n她可能不在人群的中心，\n卻在別人轉身離開時，\n輕輕地說：我不走。\n\n#擇偶 #路得 #賢德的女子 #忠誠 #單身"}, "a-marriage-of-tragedy-and-triumph": {"zh": "悲劇與凱歌交織的婚姻", "tags": ["苦難與死亡", "婚姻使命"], "core": "戴德生與瑪利亞在中國經歷反對、喪子與死亡，他們的婚姻卻在苦難中見證基督與教會不可動搖的愛。", "sum": ["1870年瑪利亞在中國去世，年僅33歲；臨終時她說十年來與救主之間沒有一片雲彩。", "那一年她剛埋葬新生的兒子和五歲的兒子。", "瑪利亞自幼喪親，在寧波教書時認識穿中國服裝宣教的戴德生。", "他們的戀情遭到監護人強烈反對，瑪利亞以禱告和等候回應，願神在心中居首位。", "苦難是他們愛情三股合成繩中黑暗而持續的一股，卻讓這婚姻成為福音的戲劇。"], "mm": {"c": "戴德生與瑪利亞", "b": [["相遇", ["寧波", "同樣渴慕聖潔"]], ["反對", ["監護人阻撓", "禱告等候"]], ["苦難", ["喪子", "疾病與死亡"]], ["凱歌", ["沒有一片雲彩", "見證基督之愛"]]]}, "fw": {"q": "夫妻如何在極大苦難中同行？", "a": "讓神居首位，彼此的愛才能經得起試煉", "steps": ["在交往中把神放在第一", "在反對中忍耐等候", "在苦難中一同仰望基督"], "do": ["讀一本宣教士夫婦的傳記", "和配偶分享：神在苦難中如何保守我們"]}, "gold": ["在最暗的谷中，與救主之間仍沒有一片雲。", "苦難是他們愛情繩索中的一股，卻沒有讓它斷裂。", "她要他在心中居次位，因為第一位屬於神。"], "ref": ["以弗所書 5:31-32"], "fb": "1870年夏天，中國鎮江。\n三十三歲的瑪利亞，生命的光漸漸暗下去。\n丈夫戴德生坐在床邊，輕聲問她：妳知道自己快要回天家了嗎？\n她說，她一點也不難過要去見主，\n十年來，她和救主之間沒有一片雲彩；\n她唯一不捨的，是要留下他一個人。\n但她相信，主會與他同在，供應他一切所需。\n\n那一年，她剛埋葬了出生三天的嬰兒；\n同一年稍早，她已經埋葬了五歲的兒子。\n許多人會在這樣的年月裡問：神在哪裡？\n她卻說：沒有一片雲彩。\n\n他們的愛情，從一開始就不容易。\n瑪利亞六歲喪父，十歲喪母，在寧波的女校長大，教書也傳福音。\n然後，她遇見了一位穿著中國服裝、留著辮子的年輕宣教士。\n他和她一樣，渴慕聖潔、渴慕被神使用、渴慕親近神；\n他似乎活在一個非常真實的世界，與一位非常真實、偉大的神同行。\n\n但她的監護人強烈反對。\n有些宣教士嘲笑他的打扮，覺得那是荒唐的作秀。\n瑪利亞被禁止見他，好幾個月。\n她怎麼回應？她沒有私奔，也沒有怨恨；\n她在禱告中寫下：她最大的地上心願，是能愛這個人、與他屬靈地相交，\n但她更盼望，他不要在她心中佔據第一的位置。\n\n她要他在心中居次位，因為第一位，屬於神。\n\n後來，他們結婚了，一起在中國事奉。\n死亡一直跟在他們身邊，反對與誤解從未停止；\n許多婚姻在少得多的壓力下就枯萎了，\n神卻扶持他們，手牽著手，走過更深、更暗的幽谷。\n\n苦難，是他們愛情三股合成繩中，黑暗卻持續的那一股。\n奇妙的是，它沒有讓繩子斷裂，\n反而讓這段婚姻，成為「基督與教會」那不可動搖之愛的戲劇。\n\n我們以為，蒙福的婚姻就是少一點苦難；\n其實，蒙福的婚姻是在苦難裡，仍然看見神。\n順境中的愛情很美，逆境中的愛情才真；\n一起歡笑的人很多，一起埋葬孩子還能一起敬拜的人很少。\n\n你們的婚姻，正走在哪一段路上？\n如果正在幽谷，請記得：雲彩可以遮住太陽，\n卻遮不住一顆與救主之間沒有雲彩的心。\n\n願我們的婚姻，也有這樣的凱歌——\n不是因為沒有悲劇，\n而是因為在每一個悲劇的盡頭，\n都站著那位勝過死亡的主。\n\n#婚姻 #戴德生 #宣教 #苦難 #信心"}, "her-desire-will-be-for-her-husband": {"zh": "「你必戀慕你丈夫」？", "tags": ["順服與帶領"], "core": "創世記3:16描述咒詛下的婚姻：妻子想控制丈夫，丈夫或壓迫或放棄；但在基督裡，「戀慕」與「管轄」都得到救贖。", "sum": ["墮落後神說：妻子的慾望將與丈夫相對，丈夫卻要管轄她。", "原文「戀慕」只出現三次；與創世記4:7（罪要戀慕你，你卻要制伏它）結構相同。", "因此這不是浪漫的渴望，而是想要壓倒、顛覆丈夫的權柄。", "丈夫正確的回應是以敬虔的方式帶領，而非壓迫或退讓。", "在基督裡，妻子學習讓渴望對齊神的設計，丈夫學習以捨己的方式治家，向世界彰顯基督與教會。"], "mm": {"c": "創世記3:16", "b": [["咒詛的內容", ["生產的痛苦", "與丈夫相對的慾望"]], ["關鍵對照", ["創世記4:7", "罪要戀慕你"]], ["墮落的模式", ["妻子想控制", "丈夫壓迫或放棄"]], ["在基督裡", ["慾望被更新", "捨己的帶領"]]]}, "fw": {"q": "「你必戀慕你丈夫」是什麼意思？", "a": "墮落後妻子傾向抵抗丈夫；基督使婚姻得贖", "steps": ["比較創3:16與4:7的用語", "辨識咒詛下的婚姻張力", "在基督裡回到神的設計"], "do": ["夫妻一起討論：我們在哪裡看見這種張力？", "丈夫拒絕壓迫也拒絕被動"]}, "gold": ["咒詛下的婚姻：她想掌控，他想壓制或逃避。", "「戀慕」在這裡不是浪漫，而是爭奪。", "在基督裡，渴望與帶領都能被救贖。"], "ref": ["創世記 3:16", "創世記 4:7", "雅歌 7:10"], "fb": "她說：「這件事，我來決定就好。」\n他說：「隨便妳。」\n或者，他說：「我說了算，妳不用多問。」\n這兩種對話，在很多家庭裡每天上演。\n\n你有沒有想過，這種拉扯，從什麼時候開始的？\n\n創世記三章，人犯罪之後，神對女人說：\n你必戀慕你丈夫，你丈夫必管轄你。\n很多人把這句話讀成一句浪漫的話：妻子會深深愛慕丈夫。\n但如果仔細看，這其實是咒詛的一部分。\n\n「戀慕」這個希伯來字，聖經只出現三次。\n其中一次，就在下一章：神對該隱說，罪伏在門前，它必戀慕你，你卻要制伏它。\n兩節經文的用字和句型幾乎一模一樣。\n罪「戀慕」該隱，不是愛他，而是想吞噬他、壓倒他、掌控他。\n\n原來，咒詛下的婚姻，有一種扭曲的拉力：\n妻子的渴望，傾向與丈夫相對，想要掌控、想要推翻他被神賦予的帶領；\n而丈夫，若不是以壓迫回應——轄制、粗暴、讓她閉嘴，\n就是以退縮回應——放棄、讓步、乾脆不管。\n\n她想掌控，他想壓制；\n或者，她想掌控，他想逃避。\n墮落的婚姻，常常就在這兩種舞步裡打轉。\n\n讀到這裡，你會不會心頭一震？\n那些看似「個性不合」的爭執，背後是不是有更古老的根？\n那些看似「我只是比較有主見」或「我只是不想吵架」的態度，\n是不是其實是咒詛留下的疤痕？\n\n可是，咒詛不是故事的最後一頁。\n\n基督來了，祂承擔了咒詛，也更新了我們的渴望與帶領。\n在基督裡，妻子可以學習讓自己的渴望對齊神的設計——\n不是被壓制，而是被釋放；不是失去聲音，而是找到安息。\n在基督裡，丈夫可以學習以捨己的方式治理家——\n不是轄制，也不是逃避，而是像基督那樣，為所愛的人擺上自己。\n\n妻子不必再為控制而戰，因為她信任的是那位掌管一切的神；\n丈夫不必再靠壓迫證明自己，因為他效法的是那位洗門徒腳的主。\n\n這樣的婚姻，會向一個仍在咒詛下的世界，\n展現基督與教會的榮耀：\n一位捨己的新郎，一位甘心的新婦，\n不再互相爭奪，而是一起得勝。\n\n也許今天，你們家的拉扯還在。\n但你可以先問自己：\n我是在用咒詛的方式回應，還是用救贖的方式回應？\n\n戀慕與管轄，曾是咒詛的名字；\n在基督裡，它們可以重新被命名——\n叫作信任，叫作擺上，叫作愛。\n\n#婚姻 #創世記3章 #墮落與救贖 #帶領與順服 #夫妻"}, "why-did-god-allow-polygamy": {"zh": "神為什麼容許一夫多妻？", "tags": ["福音與奧祕"], "core": "聖經記載一夫多妻，卻從不認可；從整本聖經看，一夫一妻是神的設計，最終指向基督與新婦。", "sum": ["舊約中亞伯拉罕、雅各、大衛等人有多妻，常被質疑聖經默許這種行為。", "但「描述」不等於「規範」：聖經記錄聖徒的行為，不代表推崇。", "聖經的倫理要從整個故事來看：創造的設計、人的悖逆、基督的恢復。", "耶穌在馬可福音10章回到「起初」：神造男造女，二人成為一體。", "多妻的記載充滿家庭與屬靈的破壞，反而凸顯一夫一妻的美好。"], "mm": {"c": "一夫一妻是設計", "b": [["問題", ["族長多妻", "聖經默許？"]], ["解經原則", ["描述非規範", "整本聖經看倫理"]], ["耶穌的方法", ["回到起初", "二人成為一體"]], ["結果", ["多妻帶來破壞", "指向基督與新婦"]]]}, "fw": {"q": "舊約聖徒多妻，代表神認可嗎？", "a": "不，聖經記載卻不認可，一夫一妻是常規", "steps": ["區分描述與規範", "從創造—墮落—救贖看倫理", "觀察多妻帶來的苦果"], "do": ["讀馬可福音10:2-9", "面對文化中多元關係的主張時以此回應"]}, "gold": ["聖經記錄了，不代表聖經贊同。", "耶穌回答婚姻問題，總是回到「起初」。", "多妻故事的傷痕，反襯出一夫一妻的美。"], "ref": ["馬可福音 10:2-9", "創世記 2:24"], "fb": "讀舊約的時候，你可能也曾皺眉：\n亞伯拉罕有妾，雅各娶了兩姊妹，大衛有很多妻子，所羅門更誇張。\n聖經不是說一夫一妻嗎？為什麼這些「信心偉人」都這樣？\n難道神默許了？\n\n今天，有些人拿這些故事說：你看，聖經自己就不一致。\n也有人說：既然古人可以，現代人為什麼不行？\n\n這個問題很重要，因為它牽涉到一件事：我們怎樣從聖經得出倫理。\n\n聖經記錄了，不代表聖經贊同。\n福音書記錄了彼得三次不認主，沒有人因此覺得我們應該效法。\n描述不等於規範，記載不等於推薦。\n\n聖經不是一本把每個英雄的行為都當模範的道德手冊，\n而是一個完整的故事：\n神在創造中定下對人的心意，人背叛了這心意，\n基督來恢復，並藉著聖靈使人重新順服。\n我們要從整個故事，來判斷故事裡的人做的是美德，還是罪。\n\n耶穌自己就示範了這種讀法。\n法利賽人問祂離婚的問題，搬出摩西的條例；\n耶穌卻說：摩西因為你們心硬，才許你們休妻，但起初並不是這樣。\n然後祂回到創世記：神造男造女，二人成為一體；神所配合的，人不可分開。\n\n每當有人想在婚姻上找漏洞，耶穌總是回到「起初」。\n\n而當你真正仔細讀那些多妻的故事，你會發現一件事：\n聖經從來沒有把它寫成美事。\n撒拉和夏甲的嫉妒、驅逐與眼淚；\n拉結和利亞的爭寵，一個孩子接一個孩子，只為了換得丈夫一點愛；\n大衛家中的亂倫、謀殺、叛變；\n所羅門的妃嬪，使他的心偏離了神。\n每一個多妻的家庭，幾乎都留下了傷痕。\n\n多妻的故事不是在推薦多妻，\n而是在用一道道傷痕，反襯出一夫一妻的美。\n\n世界說：愛可以分給很多人；\n聖經說：盟約只能給一個人。\n世界說：選擇越多越自由；\n聖經說：專一才是真正的自由。\n\n為什麼是一個？\n因為婚姻從起初就指向一件更大的事——\n一位新郎，一位新婦；\n基督不是有很多新婦，祂只有一個教會；\n祂對她的愛，是全然的、專一的、永不分心的。\n\n所以，當文化越來越推崇各種多元關係，\n基督徒不需要驚慌，也不需要尷尬地迴避舊約。\n我們可以平靜地說：\n是的，聖經記載了這些，\n而正是這些記載，讓我們更加確信——\n神起初的設計，才是最好的。\n\n#婚姻 #一夫一妻 #舊約 #聖經倫理 #起初的設計"}, "before-you-leave-your-wife": {"zh": "在你離開妻子之前", "tags": ["離婚", "給丈夫"], "core": "瑪拉基書對想離開妻子的丈夫發出警醒：你立了約、神是見證、婚姻的不忠始於與神關係的不忠。", "sum": ["作者婚後才明白為何許多人離婚：溝通、決策、罪性、差異都讓婚姻變得艱難。", "交往凸顯相似，婚姻放大差異。", "瑪拉基時代的男人因心冷或追求更好的生活，離棄年少的妻子另娶外邦女子。", "婚姻中的罪，始於與神關係中的罪：他們其實是在懷疑神的愛。", "第一個警醒：你立了約。婚禮慶祝的不是找到愛，而是宣告並承諾愛。"], "mm": {"c": "瑪拉基的警告", "b": [["婚姻的艱難", ["交往凸顯相似", "婚姻放大差異"]], ["當時的罪", ["心冷離棄", "追求更好生活"]], ["根源", ["懷疑神的愛", "與神的關係"]], ["警醒", ["你立了約", "神是見證"]]]}, "fw": {"q": "想放棄婚姻時，神要我們記得什麼？", "a": "你在神面前立了約", "steps": ["回到你在神面前的誓言", "省察與神的關係是否冷淡", "以忠心而非感覺決定"], "do": ["重讀你的結婚誓詞", "找牧者談談，而不是獨自決定"]}, "gold": ["交往放大相似，婚姻放大差異。", "婚姻中的不忠，起於對神的不信。", "婚禮不是慶祝找到愛，而是宣告要去愛。"], "ref": ["瑪拉基書 2:13-16", "創世記 2:24"], "fb": "他曾經很困惑：為什麼身邊這麼多人離婚？\n小學同學、大學朋友，很多都是離婚家庭的孩子；\n畢業沒幾年，一些同齡人也已經離婚了。\n\n然後他結婚了。\n他第一次發現，男人和女人之間的溝通可以這麼難；\n做一個決定可以這麼累；\n婚姻可以把他身上的罪，引出得比任何關係都多。\n預算、行程、整潔、衝突、姻親——每一個都是地雷。\n交往凸顯了相似，婚姻放大了差異。\n曾經那麼契合、那麼安全、那麼容易的感覺，忽然變得好像不可能。\n他終於明白，為什麼那麼多人會離婚。\n\n在舊約的最後一卷書，先知瑪拉基對一群想離開妻子的男人說話。\n他們不是遭遇外遇或被遺棄，\n而是心冷了，或是想娶更有利的外邦女子，換一個更好的人生。\n\n有趣的是，瑪拉基書的開頭，不是談婚姻，而是神說：我曾愛你們。\n百姓卻回答：你在何事上愛我們呢？\n他們剛從被擄之地回來，日子艱難，覺得被神遺棄。\n苦難讓他們絕望，絕望讓一些人放棄了盟約、拋下了家庭。\n\n婚姻中的不忠，常常起於對神的不信。\n夫妻關係出問題之前，人和神的關係，往往早已出了問題。\n\n神怎麼勸這些男人？\n第一句話就是：你立了約。\n「耶和華在你和你幼年所娶的妻中間作見證；她雖是你的配偶，又是你盟約的妻，你卻以詭詐待她。」\n\n她是你盟約的妻。\n這不是一個「我們試過了」的志向，而是一個在神與眾人面前許下的承諾。\n創世記說要「與妻子連合」，那不只是溫暖的擁抱，而是專一、堅定的委身。\n\n婚禮不是慶祝「找到了愛」，\n而是宣告「我要去愛」。\n不是記錄一種感覺，而是許下一個承諾；\n不是說「只要我還快樂」，而是說「直到死亡把我們分開」。\n\n如果你正在考慮離開，請先停一下。\n你還記得那天，你在神面前說了什麼嗎？\n你和神之間，現在是什麼樣子？\n你真正在逃離的，是她，還是那個不肯面對的自己？\n\n這不是要否認你的痛，\n而是要提醒你：痛苦不是拆毀盟約的理由，\n而是回到神面前的邀請。\n\n去找一位牧者談談，不要一個人做決定。\n把結婚誓詞拿出來，再讀一次。\n然後問問那位見證你誓言的神：\n「我還能怎麼愛她？」\n\n也許你會發現，\n要換掉的不是那個人，\n而是那顆已經冷
