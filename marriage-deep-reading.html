  return `<div class="fw"><div class="fwq">❓ ${esc(fw.q)}</div><div class="arrow">▼</div><div class="fwa">${esc(fw.a)}</div><div class="arrow">▼</div>
  <div class="fwsteps">${(fw.steps||[]).map((t,i)=>`<div><i>${i+1}</i>${esc(t)}</div>`).join('')}</div><div class="arrow">▼</div>
  <div class="fwdo"><b>✔ 實踐應用</b><ul>${(fw.do||[]).map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div></div>`;
}
function copyText(t,btn){
  const done=()=>{const o=btn.textContent;btn.textContent='已複製 ✓';setTimeout(()=>btn.textContent=o,1500)};
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();done()};
  try{navigator.clipboard.writeText(t).then(done,fallback)}catch(e){fallback()}
}
function wrapCJK(ctx,text,maxW){const lines=[];let line='';for(const ch of String(text)){if(ctx.measureText(line+ch).width>maxW&&line){lines.push(line);line=ch}else line+=ch}if(line)lines.push(line);return lines}
const PALS=[['#7a2e14','#c4683f'],['#23465c','#4f86a8'],['#33522a','#6f9a5c'],['#5a3352','#9a6a8f'],['#6b4a12','#b8892f']];
function card(x){
  const W=1080,c=document.createElement('canvas');c.width=W;c.height=W;const g=c.getContext('2d');
  const p=PALS[x.zh.length%PALS.length];const gr=g.createLinearGradient(0,0,W,W);gr.addColorStop(0,p[0]);gr.addColorStop(1,p[1]);g.fillStyle=gr;g.fillRect(0,0,W,W);
  g.fillStyle='rgba(255,255,255,.08)';g.beginPath();g.arc(W*.85,W*.18,260,0,7);g.fill();g.beginPath();g.arc(W*.1,W*.95,200,0,7);g.fill();
  const F='"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif';
  g.fillStyle='rgba(255,255,255,.75)';g.font='600 34px '+F;g.fillText('婚姻文章精讀',90,130);
  g.fillStyle='#fff';g.font='800 64px '+F;let y=250;wrapCJK(g,x.zh,W-180).slice(0,3).forEach(l=>{g.fillText(l,90,y);y+=86});
  g.fillStyle='rgba(255,255,255,.5)';g.fillRect(90,y-20,120,6);y+=70;
  g.fillStyle='#fff';g.font='500 46px '+F;g.font='italic 120px Georgia,serif';g.fillStyle='rgba(255,255,255,.35)';g.fillText('“',80,y+40);
  g.fillStyle='#fff';g.font='600 50px '+F;y+=40;wrapCJK(g,(x.gold||[x.core])[0],W-200).slice(0,4).forEach(l=>{g.fillText(l,110,y);y+=74});
  y+=30;g.fillStyle='rgba(255,255,255,.85)';g.font='400 34px '+F;wrapCJK(g,x.core,W-180).slice(0,4).forEach(l=>{if(y<W-150){g.fillText(l,90,y);y+=52}});
  g.fillStyle='rgba(255,255,255,.7)';g.font='400 28px '+F;g.fillText(x.a+' · '+x.d.slice(-4),90,W-80);
  return c.toDataURL('image/png');
}
function show(id,user){
  const x=items.find(i=>i.id===id);if(!x)return;cur=id;
  try{localStorage.setItem('dg-mm-last',id)}catch(e){}
  $('detail').innerHTML=`<button id="back">← 返回列表</button>
  <div class="en">${esc(x.t)}</div><h2>${esc(x.zh)}</h2>
  <div class="meta">${esc(x.a)} · ${esc(x.d)}${x.s?' · 📖 '+esc(x.s):''}</div>
  <div class="tags">${(x.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div>
  <div class="core">${esc(x.core)}</div>
  <section><h3>重點摘要</h3><div class="box"><ol class="sum">${(x.sum||[]).map(t=>`<li>${esc(t)}</li>`).join('')}</ol></div></section>
  <section><h3>心智圖</h3><div class="box" id="mm">${mindmap(x.mm)}</div></section>
  <section><h3>框架圖</h3><div class="box">${framework(x.fw)}</div></section>
  <section><h3>金句</h3><div class="gold">${(x.gold||[]).map(t=>`<div>${esc(t)}</div>`).join('')}</div><div class="note">金句為依文章重點濃縮的中文短句，非原文翻譯。</div></section>
  ${x.fb?`<section><h3>臉書圖文</h3><div class="fbwrap"><div><div class="fb" id="fbtext">${esc(x.fb)}</div><div class="fbcount">約 ${x.fb.replace(/\s/g,'').length} 字</div><div class="btns"><button class="btn" id="copyfb">複製文案</button></div></div><div class="fbside"><img id="fbimg" alt="圖卡"><div class="btns"><a class="btn" id="dlimg" download="${esc(x.zh)}.png">下載圖卡</a><button class="btn ghost" id="copyall">複製文案＋標題</button></div></div></div></section>`:''}
  <div class="src">出處：${esc(x.a)}〈${esc(x.t)}〉，Desiring God，${esc(x.d)}。<a href="https://www.desiringgod.org${x.u.startsWith('/')?x.u:'/articles/'+x.u}" target="_blank" rel="noopener">原文</a></div>`;
  if(x.fb){
    const src=card(x);$('fbimg').src=src;$('dlimg').href=src;
    $('copyfb').onclick=e=>copyText(x.fb,e.target);
    $('copyall').onclick=e=>copyText('【'+x.zh+'】\n\n'+x.fb,e.target);
  }
  $('back').onclick=()=>{document.body.classList.remove('detail');window.scrollTo(0,0)};
  if(user){document.body.classList.add('detail');window.scrollTo(0,0)}$('main').scrollTop=0;renderList();
}
$('list').addEventListener('click',e=>{const li=e.target.closest('.li');if(li)show(li.dataset.id,true)});
['q','tag','author'].forEach(i=>$(i).addEventListener('input',renderList));
renderList();
let last=null;try{last=localStorage.getItem('dg-mm-last')}catch(e){}
show(items.some(i=>i.id===last)?last:(items[0]||{}).id);
</script>
