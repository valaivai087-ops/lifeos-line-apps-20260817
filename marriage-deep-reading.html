掉的心。\n\n#婚姻 #離婚 #瑪拉基書 #盟約 #回轉"}, "four-defining-moments-for-young-marriages": {"zh": "年輕婚姻的四個關鍵時刻", "tags": ["衝突與修復", "婚前與擇偶"], "core": "新婚期間神安排了一些關鍵時刻：婚姻揭露內心、放下道德優越、成為最好的朋友……這些時刻決定婚姻的方向。", "sum": ["作者借《遠大前程》說明：某一天的一個決定，可能成為一生鎖鏈的第一環。", "時刻一：婚姻揭露你的心。不是配偶「讓我犯罪」，衝突只是挖出心裡原有的東西。", "神用婚姻引出我們殘存的罪，這是好事：使人謙卑並倚靠恩典。", "時刻二：放下道德制高點。作者以為自己點餐果斷比妻子優越；長處一旦使人自滿就成了弱點。", "時刻三：成為地上最好的朋友。婚姻太依賴浪漫，太少依賴友誼。"], "mm": {"c": "四個關鍵時刻", "b": [["揭露內心", ["沒有人能讓我犯罪", "衝突挖出罪"]], ["放下優越", ["長處變弱點", "大兒子的罪"]], ["成為摯友", ["友誼勝於浪漫", "培養與保護"]], ["結果", ["謙卑倚靠", "差異變喜樂"]]]}, "fw": {"q": "新婚期最重要的轉折是什麼？", "a": "讓婚姻引出的罪，帶我們回到恩典", "steps": ["承認衝突暴露的是自己的心", "放下自以為義的優越感", "刻意培養夫妻友誼"], "do": ["下次生氣時問：我心裡愛什麼勝過配偶？", "把一個「看不慣」的差異改成欣賞"]}, "gold": ["配偶沒有按鈕能讓你犯罪，衝突只是揭開你的心。", "長處一旦令人自滿，就成了弱點。", "婚姻太依賴浪漫，太少依賴友誼。"], "ref": ["馬太福音 15:18", "路加福音 15:11-32"], "fb": "新婚幾個月，她說了一句話，正好踩到他的地雷。\n他覺得如果不立刻說點什麼，地球就要歪掉了。\n於是他很「有技巧地」告訴她：「妳讓我生氣了，妳讓我犯罪了。」\n\n從他的角度，這完全合理。\n婚前，他是一個看起來很不錯的基督徒；\n婚後，罪卻到處冒出來——當然是她的錯。\n\n狄更斯在《遠大前程》裡寫過一個意思：\n人生中某一天的一個決定，可能成為一條鐵鍊或金鍊的第一環，綁住接下來的整段路。\n新婚的頭幾年，神灑下了許多這樣的關鍵時刻。\n\n第一個時刻：當婚姻揭露你的心。\n其實，配偶身上沒有任何按鈕，能讓你犯罪。\n衝突只是把你心裡早已埋著的東西挖了出來——\n那些你愛得比配偶更多、甚至比耶穌更多的東西。\n耶穌說：從口裡出來的，是從心裡發出來的。\n神常用婚姻引出我們殘存的罪，這其實是好事：\n它讓我們看見，靠自己是沒有指望的，\n讓我們從自以為的得勝勇士，變回需要恩典的軟弱罪人。\n\n第二個時刻：當你走下道德制高點。\n他上餐廳，一坐下就知道要點什麼；\n她看菜單，像在看調色盤，慢慢創作自己的一餐。\n他一度深信：自己的果斷，在道德上比較高尚。\n可是長處一旦讓人自滿，就成了弱點。\n浪子回頭的比喻，真正的焦點其實是那位大兒子——\n他守規矩、盡本分，卻覺得自己比弟弟高一等；\n而那份自以為義，才是更深的罪。\n緊抓著道德制高點，我們會錯過婚姻的喜樂；\n走下來，站在同樣需要恩典的平地上，差異就成了慶祝與相愛的理由。\n\n第三個時刻：當你們成為地上最好的朋友。\n有人說，婚姻太依賴浪漫，太少依賴友誼。\n友誼需要被培養、被保護、被優先——\n不是只有心動，而是能一起笑、一起扛、一起往前看。\n\n衝突說「都是你害的」，恩典說「原來是我的心」；\n驕傲說「我比較對」，福音說「我們都需要基督」；\n浪漫說「我好愛你」，友誼說「我會一直在」。\n\n你們家的第一環鍊子，現在是什麼？\n是一次又一次的指責，還是一次又一次的認罪？\n是比較誰更好，還是一起變得更好？\n\n新婚的頭幾年，是在打地基。\n每一次你選擇看見自己的罪、放下自己的高傲、珍惜彼此的友誼，\n你就是在鍛造一條金鍊——\n它不會綁住你們，\n而會把你們，一環一環，緊緊連在一起。\n\n#新婚 #婚姻 #衝突 #謙卑 #夫妻友誼"}, "submission-is-a-wonderful-weapon": {"zh": "順服是美好的兵器", "tags": ["順服與帶領", "給妻子"], "core": "順服不是只給完美丈夫的妻子的理想；它出自我們對神的順服，常在隱藏的日常細節中實踐。", "sum": ["作者婚前隨和，以為順服很容易，卻沒想到婚姻是與另一個人在各方面緊緊綁在一起。", "許多妻子並非試過順服失敗，而是從未真正嘗試，把它當成只適合嫁給完美男人的人。", "順服是自願服在另一人的權柄下；每個基督徒都順服神，其他的順服由此而來。", "實例：丈夫喜歡接待客人，順服就是安排邀約與準備；別人的丈夫可能偏好安靜，順服就是先問他。", "要分辨「順服到犯罪」（不可）與「順服一個動機不完美的人」（這是常態）。"], "mm": {"c": "順服", "b": [["誤解", ["只給完美丈夫", "從未嘗試"]], ["定義", ["自願服在權柄下", "源於順服神"]], ["實踐", ["隱藏的日常", "依你丈夫的異象"]], ["界線", ["不可順服犯罪", "接受不完美動機"]]]}, "fw": {"q": "丈夫不完美，我還要順服嗎？", "a": "是，因為順服丈夫源於順服神", "steps": ["先確認自己對神的順服", "依照自己丈夫的心意調整", "分辨犯罪與不完美的差別"], "do": ["本週在一件小事上先問丈夫的想法", "有疑問時請教會中成熟的姊妹"]}, "gold": ["順服沒有被試過而失敗，而是被擱在架上積灰塵。", "順服常常是隱藏的，在生活細節中發生。", "輕看順服丈夫，就是輕看順服神。"], "ref": ["以弗所書 5:22", "提多書 2:3-5"], "fb": "她婚前是一個很好相處的人。\n要做什麼、吃什麼、怎麼做，別人有意見，她通常第一個說好。\n交代什麼工作就做什麼，也很樂意不當主角。\n她心想：順服？那對我應該很簡單吧。\n\n她沒想到的是，婚姻意味著和另一個人，在所有可能的層面上被綁在一起。\n他的問題，變成她的問題；她的問題，也變成他的問題。\n就算婚禮那天多麼熱情地選擇了彼此，\n總有一天你會發現：有些問題，真希望可以不要選。\n\n光是「完全被綁在一起」這件事就夠讓人驚慌了，\n要再順服對方，好像更可怕。\n\n於是，很多妻子其實沒有真正試過順服。\n不是試了覺得不好，而是根本把它擱在架上積灰塵。\n偶爾經過時，還會酸一句：「有些人要處理的是真實的問題，比如嫁給這個罪人。」\n好像順服只是給那些嫁給近乎完美男人的人，給師母、給全職事奉者的，\n「我們這些住在真實世界的人，只想撐過去。」\n\n順服沒有被試過而失敗，\n它是被擱置著，從沒被認真試過。\n\n什麼是順服？是甘心服在另一人的權柄之下。\n這就是為什麼每一個真基督徒，都是一個順服的人——\n神給了我們新心，那顆心把順服的生命，泵送到全身。\n我們順服神，祂是我們生命的作者，也是一切的真正權柄。\n地上其他的順服，都是從這個最終的順服延伸出來的。\n\n所以，輕看「妻子要順服自己的丈夫，如同順服主」，\n其實就是輕看我們對神的順服。\n\n順服長什麼樣子？很少轟轟烈烈，常常隱藏在生活的細節裡。\n有一位丈夫喜歡常常接待人來家裡吃飯；\n對他的妻子來說，順服就是傳訊息、約時間、規劃菜單、把家打理好。\n但另一位丈夫可能比較喜歡安靜的家；\n對他的妻子來說，順服可能是：先問他，若他覺得這個季節要慢一點，就先不邀那家人。\n\n要小心，別把別人的例子，變成順服別人丈夫的規則。\n\n也有人問：如果他不想接待人，是因為自私呢？\n這裡有一個重要的區分：\n不能為了順服而犯罪——如果他要妳離開教會，妳不能照做；\n但順服一個動機不完全的人，這是我們每個人一直到主再來前的日常。\n正如他被呼召去愛一個不完美的妳。\n\n順服不是軟弱的姿態，而是一件奇妙的兵器：\n它對抗驕傲，它拆毀自我中心，它在家裡為基督讓出位置。\n\n今天，也許可以把那本積灰的書拿下來，\n在一件很小的事上，先試試看。\n妳會發現，那不是失去，\n而是一種意想不到的自由。\n\n#婚姻 #順服 #妻子 #以弗所書 #隱藏的事奉"}, "your-spouse-should-complete-you": {"zh": "你的配偶應當使你完整", "tags": ["福音與奧祕"], "core": "聖經的「二人成為一體」比浪漫情感更深：夫妻是一個身體，帶來共同的呼召、離開父母、永久性與愛的邏輯。", "sum": ["加爾文說：亞當被取走一部分，好在妻子身上重新變得完整。", "以弗所書5:28：愛妻子就是愛自己，因為二人成為一體。", "一體帶來共同的呼召：生養治理需要夫妻同工。", "一體要求離開原生家庭，開始一個新的頭與身體的關係。", "一體意味永久：離婚像死亡一樣撕裂身體；虐待妻子等於傷害自己，藐視丈夫等於藐視自己。"], "mm": {"c": "二人成為一體", "b": [["起源", ["從亞當身上取出", "骨中的骨"]], ["共同呼召", ["生養治理", "彼此需要"]], ["離開父母", ["新的家庭", "頭與身體"]], ["永久與愛", ["離婚如撕裂", "愛她即愛己"]]]}, "fw": {"q": "「一體」在生活中有什麼含義？", "a": "夫妻是一個身體，彼此的福祉不可分", "steps": ["承認對方是你的一部分", "離開原生家庭的優先順序", "以終身的承諾對待婚姻"], "do": ["做決定時以「我們」而非「我」思考", "檢視與原生家庭的界線"]}, "gold": ["愛你的配偶，就是愛你自己。", "傷害配偶，其實是在傷害自己。", "一體不只是感覺，而是新的身分。"], "ref": ["創世記 2:18-24", "以弗所書 5:28-32", "馬太福音 19:6"], "fb": "電影裡，男主角深情地看著女主角說：「妳讓我完整。」\n很多基督徒聽到這句話會皺眉：只有耶穌能讓人完整吧？\n\n但加爾文在註釋創世記時，大意說過：\n亞當身上被取走了一部分，好讓他能更溫柔地擁抱「自己的一部分」；\n原本只有一半的他，在妻子身上變得完整。\n\n這不是浪漫喜劇的台詞，而是聖經的「一體」。\n\n保羅說：丈夫應當愛妻子，如同愛自己的身子；愛妻子，便是愛自己了。\n這比感覺深得多。\n二人成為一體，不是一種情緒，而是一種新的身分。\n\n「一體」帶來四件事。\n\n第一，共同的呼召。\n亞當領受了生養眾多、治理全地的使命，這件事他一個人做不到。\n動物裡找不到配偶，神就從他身上造了一個女人。\n她不是可有可無的附加品，而是唯一適合與他一同完成使命的人。\n\n第二，離開原來的連結。\n詩篇四十五篇說：女子啊，你要忘記你的民和你的父家。\n婚姻開始了一個新的頭與身體的關係，\n它不同於大家族，是社會最基本的單位。\n\n第三，永久。\n耶穌說：既然如此，夫妻不再是兩個人，乃是一體的了。\n所以神配合的，人不可分開。\n即使在某些允許離婚的情況下，離婚永遠是悲劇，因為它撕裂了一個身體。\n它像死亡一樣，把本該在一起的分開。\n\n第四，愛的邏輯。\n丈夫愛妻子，是在愛他的身體；妻子愛丈夫，是在愛她的頭。\n所以，恨配偶，其實是一種恨自己。\n虐待妻子，就是傷害自己；藐視丈夫，就是藐視自己。\n\n我們以為，愛配偶是在為對方付出，\n其實，也是在照顧自己的一部分；\n我們以為，傷害配偶只會讓對方痛，\n其實，那刀子也同時劃在自己身上。\n\n可是，如果聖經的圖畫這麼美，為什麼活出來這麼難？\n因為罪讓我們想做回兩個人——\n各算各的帳、各過各的生活、各自保護自己。\n\n今天，你是用「我」在思考，還是用「我們」在思考？\n你做的決定，是為了你自己這一半，還是為了你們整個身體？\n\n讓我們再聽一次那句話：\n妳讓我完整。\n不是因為妳取代了基督，\n而是因為基督，把妳放在我身上，\n讓我這個原本只有一半的人，\n在妳身上，學會怎樣愛得完整。\n\n#婚姻 #一體 #以弗所書5章 #創世記2章 #夫妻"}, "for-worse-or-better": {"zh": "無論更壞或更好", "tags": ["衝突與修復"], "core": "婚姻不如預期時，關鍵在於如何面對被延遲或落空的夢想：學習知足，相信神的美意不是意外。", "sum": ["許多夫妻婚後發現現實與期待落差很大，甚至懷疑「是不是嫁錯／娶錯了」。", "渴望美好婚姻不是錯，問題在於夢想落空時，我們怎麼對待神與配偶。", "當渴望變成要求，不滿會吞噬我們對神主權的信心，婚姻就像一場不幸的意外。", "保羅在監獄中說他學會了知足：知足不是特殊恩賜，而是學來的。", "知足是信靠神並調整未滿足的渴望；並對配偶說「這很難，但神信實，我愛你」。"], "mm": {"c": "落空的夢想", "b": [["落差", ["不如預期", "懷疑選錯"]], ["危險", ["渴望變要求", "不滿吞噬信心"]], ["知足", ["保羅的秘訣", "可以學習"]], ["回應配偶", ["承認艱難", "神信實我愛你"]]]}, "fw": {"q": "婚姻不是我想像的樣子，怎麼辦？", "a": "學習知足，在神的主權中調整渴望", "steps": ["承認夢想被延遲或落空", "察覺渴望是否已變成要求", "操練知足並信靠神的美意"], "do": ["寫下你對婚姻的期待，分辨哪些已成要求", "對配偶說：這很難，但我仍愛你"]}, "gold": ["婚姻常取決於我們如何面對落空的夢想。", "渴望一旦變成要求，不滿就會吞掉信心。", "神的美意是刻意的，不是意外。"], "ref": ["腓立比書 4:11-13"], "fb": "結婚三年，被問到「你們多久約會一次？」\n他們互看一眼，尷尬地笑：「我們……沒有約會。」\n婚前的盼望像旭日，現在的現實像墜落的飛機。\n他們心裡各自想著：我以為到現在，會不一樣的。\n\n另一位妻子，從小想像的婚姻總是寬裕的。\n她從沒想過，要每個月精打細算、剪優惠券才能買菜。\n她對丈夫說：「這不只是辛苦，這是羞辱。」\n昨晚她甚至在心裡想：我愛我丈夫，可是我不喜歡婚姻。這是不是一個錯誤？\n\n你也曾這樣懷疑過嗎？\n我的婚姻，是不是神沒看到時溜過去的一個意外？\n\n渴望美好的婚姻沒有錯。\n想和配偶一起興旺，是健康的。\n問題在於：當夢想遲遲不來，甚至落空時，\n我們怎樣對待神，又怎樣回應配偶？\n\n婚姻常常轉折在一件事上：我們怎樣面對被延遲、被拒絕的夢想。\n\n夢想被延遲時，我們會怕：怕永遠得不到最想要的——\n美好的性生活、健康的孩子、共同的異象、一個肯定我而不是嘮叨我的配偶。\n我們也會怕：怕一直困在最不想要的狀態裡，\n好像夢想一個個過期，最深的恐懼卻一個個成真。\n\n當渴望變成要求，不滿就會吞噬我們對神主權的信心。\n神的良善在我們眼中縮小，婚姻就像一場不幸的意外。\n\n保羅說：我無論在什麼景況都可以知足，飽足飢餓、有餘缺乏，都得了祕訣。\n他寫這些話時，人在監獄裡。\n更驚人的是，他說這是「學來的」——不是特別恩賜，而是學習的結果。\n\n知足，不是沒有夢想，\n而是一顆信靠神、能夠在未滿足的渴望中調整自己的心。\n對家庭大小、生活水準、壓力程度、性生活，你都可以有夢想；\n但當夢想落空時，知足讓你仍然相信：神的美意是刻意的，不是意外的。\n\n渴望說「我想要」，要求說「我必須」；\n知足說「我可以沒有，但我不能沒有神」。\n\n那麼，你可以怎樣回應你的配偶？\n也許是這樣一句話：\n「是的，這很難，也不是我們想像的樣子。但神是信實的——對了，我愛你。」\n\n無論更壞或更好，\n婚姻都不是一個走錯的房間，\n而是一間神親手為你們打開的教室。\n在那裡，我們學習知足，\n也學習在落空的夢想之上，\n看見一位從不落空的神。\n\n#婚姻 #知足 #腓立比書4章 #失望 #神的主權"}, "a-famous-and-forgotten-romance": {"zh": "著名卻被遺忘的愛情", "tags": ["婚姻使命"], "core": "百基拉與亞居拉是聖經中少見的模範夫妻：一同讀經、一同服事、一同冒險，並以家接待教會。", "sum": ["聖經中的婚姻大多有明顯失敗，可以效法的很少。", "保羅未婚，卻深刻教導婚姻；他很可能從百基拉與亞居拉身上看到美好的婚姻。", "他們總是一起被提到，一同為保羅冒生命危險，眾教會都感謝他們。", "他們聽了亞波羅講道，一起私下為他把神的道講解得更準確：夫妻都是神話語的人。", "健康結果子的婚姻，需要雙方都辛勤、喜樂、犧牲地工作。"], "mm": {"c": "百基拉與亞居拉", "b": [["少見的榜樣", ["總是一起出現", "眾教會感謝"]], ["神話語的人", ["一同讀經", "教導亞波羅"]], ["同工", ["一起織帳棚", "一起冒險"]], ["接待", ["家中聚會", "敞開的家"]]]}, "fw": {"q": "夫妻可以如何一起服事？", "a": "像百基拉與亞居拉，一起浸潤在神的話中並同工", "steps": ["一起深入讀經", "一起服事人", "一起敞開家庭"], "do": ["夫妻一起讀一卷書並分享", "一起邀請一個需要關心的人吃飯"]}, "gold": ["他們從不單獨被提起，因為他們一起活、一起服事。", "別把認真讀經留給配偶一個人。", "健康的婚姻，需要兩個人都辛勤而喜樂地付出。"], "ref": ["使徒行傳 18:1-26", "羅馬書 16:3-5"], "fb": "如果你可以選一對聖經裡的夫妻，作為你婚姻的榜樣，你會選誰？\n\n亞當和夏娃？蜜月期太短，很快就失敗了。\n以撒和利百加？開頭很浪漫，後來她設計騙了他。\n雅各和拉結？他苦等多年，卻也娶了她姊姊，並冷待她。\n大衛和亞比該？她很高貴，但大衛不只她一個妻子，還犯了姦淫。\n何西阿？他的愛令人動容，但歌篾是反面教材。\n\n能效法的婚姻其實很少。\n可是在保羅的書信裡，藏著一對常被遺忘的夫妻——\n百基拉和亞居拉。\n\n保羅說：問百基拉和亞居拉安，他們為我的命，將自己的頸項置之度外；\n不但我感謝他們，就是外邦的眾教會也感謝他們。\n在沒有網路、沒有媒體的時代，他們的愛與服事，傳遍了各地。\n\n很特別的是，聖經提到他們時，從來沒有單獨提過其中一個人。\n永遠是「百基拉和亞居拉」，一體，一起，一股結出果子的力量。\n\n他們最為人知的一件事，是聽見口才很好、熟悉聖經的亞波羅講道後，\n「就接他來，將神的道給他講解更加詳細」。\n不是只有亞居拉，是他們兩個一起。\n神給夫妻不同的呼召，但他們一起生活、一起服事。\n\n有多少婚姻掙扎受苦，是因為其中一方把認真讀經這件事，全丟給另一方？\n\n他們是織帳棚的，一起工作；\n他們搬過好幾個城市，一起冒險；\n他們把家打開，讓教會在家裡聚會，一起接待。\n健康、結果子的婚姻，需要雙方都辛勤、喜樂、犧牲地付出。\n\n不是每一段好的婚姻，都會長得像他們。\n但每一段基督徒婚姻，都可以渴望一件事：\n每天、深深地，一起浸泡在神話語的井裡。\n\n我們以為，好婚姻的標誌是兩個人很恩愛；\n其實，好婚姻的標誌，是兩個人一起很愛神、一起很愛人。\n只看著彼此的婚姻會越來越小，\n一起看著神國的婚姻會越來越大。\n\n你們最近，一起讀過哪一段聖經？\n你們的家門，最近為誰打開過？\n你們的手，最近一起為什麼事而忙？\n\n也許你們不會出名，\n也許外邦的眾教會不會為你們感謝神，\n但願你們的婚姻，被記得的方式也是這樣——\n不是「他」，也不是「她」，\n而是「他們」：\n一起聽道、一起講道、一起冒險、一起打開家門，\n一起，把基督帶給更多人。\n\n#婚姻 #百基拉和亞居拉 #夫妻同工 #接待 #讀經"}, "why-did-satan-target-eve": {"zh": "撒但為何鎖定夏娃？", "tags": ["順服與帶領"], "core": "保羅以創造與墮落為根據解釋提摩太前書2:12：神先造亞當為頭，撒但卻繞過他去引誘夏娃，顛覆神的次序。", "sum": ["提摩太前書2:12（不許女人講道管轄男人）如今備受爭議，但保羅有提出理由。", "理由一：「先造亞當」——呼應創世記2:7；神刻意先造男人，賦予他首要責任。", "「後造夏娃」：神讓亞當先看遍動物、領受命令，才造女人作幫助者；二者同等尊貴卻不同。", "理由二：「夏娃被引誘」——撒但繞過被設立為頭的亞當，直接找夏娃，顛覆了次序。", "兩個理由相連：創造的次序被墮落時的試探所顛覆。"], "mm": {"c": "提前2:12-14", "b": [["爭議經文", ["不許女人管轄男人", "保羅給理由"]], ["先造亞當", ["創2:7", "首要責任"]], ["後造夏娃", ["幫助者", "同等而不同"]], ["蛇引誘夏娃", ["繞過頭", "顛覆次序"]]]}, "fw": {"q": "保羅為何限制女性在教會中的教導權柄？", "a": "根據創造次序與墮落中次序被顛覆", "steps": ["看見創造中先後的意義", "明白男女同等卻有不同呼召", "看見撒但如何顛覆神的次序"], "do": ["夫妻一起讀創世記2-3章與提前2章", "思考在家中如何尊重神的次序"]}, "gold": ["神不急著同時造出男女，祂要人看見差異的意義。", "同一物種，不同性別；同等價值，不同呼召。", "撒但攻擊婚姻的方式，是顛倒神的次序。"], "ref": ["提摩太前書 2:12-14", "創世記 2:7-22", "創世記 3:1-6"], "fb": "伊甸園裡有兩個人。\n蛇卻沒有去找那個先被造、親耳領受命令的人，\n牠去找了那個後被造、從別人口中聽到命令的人。\n為什麼？\n\n這個問題，藏在一段今天常引起爭議的經文背後。\n保羅在提摩太前書說：我不許女人講道，也不許她轄管男人。\n很多人讀到這裡就停住了，覺得刺耳，甚至覺得這是古代文化的偏見。\n\n可是保羅沒有丟下一句話就走。\n他給了理由——而且不是文化的理由，是創造的理由。\n他說：因為先造的是亞當，後造的是夏娃；\n且不是亞當被引誘，乃是女人被引誘，陷在罪裡。\n\n先看「先造亞當」。\n神為什麼不同時造男造女？\n祂先用地上的塵土造了那人，把他安置在園中，叫他修理看守，\n把那條關乎生死的命令交給他——交給「那人」，不是交給一對夫妻。\n然後，神還讓所有走獸飛鳥一一經過他面前，讓他看見：沒有一個是配偶。\n最後，才使他沉睡，取出肋骨，造成女人，領到他面前。\n\n神似乎刻意放慢腳步，讓亞當，也讓我們看清楚：\n男人和女人，同為人，同樣寶貴；\n卻又奇妙地不同，在各自的呼召裡彼此成全。\n同一個物種，不同的性別；同等的價值，不同的角色。\n\n神彷彿在對亞當說：你要負責。重量主要在你身上。\n命令給了你，她是為你造的；你是頭，她是幫助者。\n你要帶領、保護、供應她，而她的呼召，對你的呼召不可或缺。\n\n再看「女人被引誘」。\n蛇做的事，不只是說謊，更是顛覆。\n牠繞過被設立為頭的亞當，直接去找夏娃；\n牠讓幫助者變成決策者，讓頭變成跟隨者，讓神變成被懷疑的對象。\n撒但攻擊婚姻最古老的方式，就是把神的次序上下顛倒。\n\n這兩個理由是連在一起的：\n創造時，神定下了次序；\n墮落時，撒但推翻了次序。\n\n世界說：差異就是不平等；聖經說：差異是為了彼此成全。\n世界說：次序就是壓迫；聖經說：次序是愛的形狀。\n世界說：誰都可以是任何角色；聖經說：神刻意造了你，給了你一個位置。\n\n這段經文不是在說女人不重要，\n而是在說：神的設計，比我們以為的更深、更細膩，\n深到連創造的順序，都在說話。\n\n今天，當我們談論男女角色時，\n願我們不要只用文化的眼睛看，\n也願我們不要用驕傲或貶低的心看；\n而是回到起初，\n去聽那位不急不徐、一步一步造人的神，\n輕輕告訴我們：你們不同，但你們都被我深愛。\n\n#聖經 #男女角色 #創世記 #提摩太前書 #創造次序"}, "for-better-or-worse": {"zh": "無論好壞（亞拿尼亞與撒非喇）", "tags": ["衝突與修復", "金錢"], "core": "亞拿尼亞與撒非喇同心犯罪的悲劇提醒我們：沒有一段婚姻是中立的，它不是加深信仰，就是腐蝕心靈。", "sum": ["這對夫妻在興旺的教會中看似同心，卻一同在奉獻上欺哄聖靈，當天相繼死亡。", "慕勒說：婚姻的選擇深深影響我們的快樂、用處，以及是為神還是為自己而活。", "每段婚姻都會加深信心，或悄悄地分散、敗壞我們的心。", "罪如何敗壞婚姻：撒但在一方心中撒下謊言；那人沒有抵擋，反而謀算。", "另一方沒有反對，選擇同謀；罪之所以進入婚姻，是因為有人讓門開著。"], "mm": {"c": "同心犯罪", "b": [["事件", ["奉獻作假", "欺哄聖靈"]], ["婚姻不中立", ["加深信心", "或敗壞心靈"]], ["他的失敗", ["撒但撒謊", "心中謀算"]], ["她的失敗", ["沒有反對", "同謀"]]]}, "fw": {"q": "夫妻如何避免一起滑向罪中？", "a": "彼此成為抵擋試探的力量，而非同謀", "steps": ["承認撒但在攻擊婚姻", "不給罪留門縫", "敢對配偶的錯誤說不"], "do": ["夫妻在財務上完全透明", "約定：彼此提醒，不一起妥協"]}, "gold": ["在對抗罪這件事上，沒有中立的婚姻。", "罪能進門，是因為有人沒鎖門。", "愛配偶，有時就是對他說「不」。"], "ref": ["使徒行傳 5:1-11"], "fb": "他們看起來好相愛、好同步。\n剛加入一間成長中的教會，牧者忠心，講道很好。\n教會在募款，很多人奉獻遠超過自己的能力。\n他們也承諾：賣掉那塊地，全部奉獻。\n\n可是最後一刻，他說：我們留一點吧，沒人會發現。\n她沒有反對。\n於是，這對主日早晨的「雌雄大盜」，帶著錢離開，\n然後對牧者、對群體、對神說謊，假裝很慷慨。\n\n那一天，死亡把他們分開——只相隔幾個小時。\n他們的名字是：亞拿尼亞和撒非喇。\n\n這個故事最令人戰慄的地方，不只是他們說謊，\n而是他們是一起說謊的。\n路加刻意告訴我們：他們夫妻同謀。\n他們不是因為不和而失敗，而是因為「很同心」地一起犯罪。\n\n喬治·慕勒說過，選擇與誰結婚，深深影響我們的快樂、我們的用處，\n以及我們之後是為神而活，還是為自己而活。\n\n每一段婚姻都不是中立的。\n它不是一天天加深我們的信心，\n就是一天天悄悄地分散、敗壞我們的心。\n在對付罪、追求聖潔這件事上，沒有一段婚姻是旁觀者。\n\n罪怎樣進入婚姻？\n彼得對亞拿尼亞說：為什麼撒但充滿了你的心？為什麼你心裡起這意念？\n先是撒但在一個人心裡撒下謊言；\n然後那個人沒有抵擋，反而開始謀算。\n罪的種子也許來自撒但，但它本該在亞拿尼亞那裡被終止。\n\n幾小時後，彼得問撒非喇：你們為什麼同心試探主的靈呢？\n第二個失敗出現了：另一方沒有攔阻，而是同意了。\n\n罪能進門，是因為有人沒鎖門。\n也許是刻意的——為肉體留了餘地，藏起一個帳戶、一個瀏覽紀錄、一段苦毒；\n也許是疏忽的——只是懶得禱告、懶得省察、懶得說不。\n\n我們常以為，夫妻同心就是好事；\n其實，同心犯罪，比各自犯罪更危險。\n真正的愛，有時是對配偶說「好」；\n有時，是勇敢地對配偶說「不」。\n\n你們的婚姻，最近在哪些地方「很同心」？\n是一起走向神，還是一起把神擋在門外？\n你願意成為那個說「不，我們不要這樣」的人嗎？\n\n無論好壞，我們都會一起。\n但願「一起」的方向，是向著光；\n願你們彼此成為抵擋試探的力量，而不是彼此的共犯；\n願你們的婚姻，一天天加深彼此的信心，\n直到那天，不是死亡把你們分開，\n而是永生，把你們一起迎進去。\n\n#婚姻 #亞拿尼亞與撒非喇 #誠實 #屬靈守望 #夫妻同心"}, "what-makes-any-marriage-difficult": {"zh": "讓婚姻變難的是什麼", "tags": ["衝突與修復", "溝通與親密"], "core": "三個問題幫助夫妻突破僵局：我哪裡難相處？我如何得罪配偶？我能做什麼改善婚姻？", "sum": ["作者夫妻很懂得怎麼傷害彼此，也懂得怎麼使對方喜樂；被完全認識後仍被愛，是恩典。", "在低潮時，他們請朋友吃一頓飯，討論三個問題。", "問題一：我有什麼（不是罪的）個性或習慣讓人難以相處？謙卑承認能讓配偶感到被聆聽。", "問題二：我如何得罪配偶？不只說「我是罪人」，要說出具體的罪；可對照箴言中愚昧人的特徵。", "問題三：我能做什麼改善？像會議結束時一樣，定出具體的行動項目。"], "mm": {"c": "三個問題", "b": [["我哪裡難相處", ["非罪的弱點", "謙卑承認"]], ["我如何得罪你", ["說出具體的罪", "愚昧人清單"]], ["我能做什麼", ["具體行動", "彼此同意"]], ["前提", ["被認識仍被愛", "聖靈幫助"]]]}, "fw": {"q": "婚姻卡住了，從哪裡開始？", "a": "誠實回答三個問題", "steps": ["承認自己的難相處之處", "具體說出自己的罪", "訂出可執行的改善行動"], "do": ["和配偶各自寫下三個問題的答案再分享", "邀請信任的朋友陪你們談"]}, "gold": ["說「我是罪人」很容易，說出具體的罪很難。", "配偶不會讓你犯罪，你自己就做得到。", "好意要落實成行動項目。"], "ref": ["馬太福音 15:18-19", "雅各書 4:1-2", "箴言 12-29"], "fb": "結婚多年，他們學會了一件事：怎麼得罪對方。\n知道用什麼語氣、什麼眼神、什麼字眼，能造成最大的傷害。\n婚姻揭露了他們的罪，比他們自己以為的還多。\n\n當然，他們也學會了怎麼讓對方喜樂、怎麼服事對方。\n被一個完全認識你的人，仍然愛著——那是純粹的恩典。\n他說：若沒有聖靈的幫助，我不確定我們還會在一起。\n\n有一次婚姻陷入低潮，他們請一位朋友吃飯，\n用一頓飯的時間，討論三個問題。\n那頓飯，鬆動了許多說不清楚的卡點。\n\n第一個問題：我哪裡讓人難以相處？\n不是罪，而是個性、習慣、偏好——那些不見得是錯，卻讓人很累的地方。\n他第一個寫下：我常常找不到東西。\n說完兩小時後，他們回到租來的車旁，他把手伸進口袋——鑰匙不見了。\n對有條理的妻子來說，這不只是麻煩。\n他們摸黑走了兩英里回旅館。她很有恩典。\n\n驕傲告訴我們：我什麼都很行，問題都在對方。\n謙卑讓我們看見自己怎樣讓配偶辛苦，\n也讓配偶感覺被聽見、被在乎。\n\n第二個問題：我怎樣得罪我的配偶？\n這才是核心。\n耶穌說，惡念、兇殺、姦淫……都是從心裡發出來的。\n配偶不會讓你犯罪，你自己就做得到。\n雅各說：你們爭吵，是因為你們得不著所想要的。\n\n他的妻子曾經對他說：你很會說「我是罪人」，卻很不會說出具體的罪。\n她說得對。\n說「我是罪人」很容易，說出「我昨天用輕蔑的語氣回你」很難。\n箴言裡的愚昧人，自以為正直、急於發怒、輕看管教、喜歡發表意見、容易爭吵……\n你能在那張清單上，找到自己嗎？\n\n第三個問題：我能做什麼來改善婚姻？\n像每次開會結束時，列出行動項目，彼此同意，一起執行。\n說「我要像基督愛教會一樣愛妳」很美，\n但具體是什麼？少弄丟東西？包容一個弱點？定期彼此認罪？\n\n好意需要變成行動，願望需要變成步驟。\n\n今晚，也許你們可以各自拿一張紙，寫下這三題。\n不是為了算帳，而是為了看見；\n不是為了指責，而是為了回頭。\n\n當兩個人都願意先回答「我」，\n婚姻裡就會出現一種奇妙的安全感——\n那是一種，不用再防備的愛。\n\n#婚姻 #衝突 #認罪 #三個問題 #夫妻溝通"}, "your-family-is-the-frontlines": {"zh": "家庭就是前線", "tags": ["婚姻使命"], "core": "現代社會的結構不利於家庭；疫情讓人被迫回家，正是基督徒重建家庭、讓家成為身心靈生產中心的契機。", "sum": ["疫情前，家常只是外出活動之間的「停機坪」；如今人們被迫回家，卻不知道在家該做什麼。", "晚婚、少生、高離婚率，不只因個人的罪，也因現代社會結構本身與家庭作對。", "重建家庭不關乎得救，也不是每個人都蒙召結婚；但特殊呼召就是特殊，不是常態。", "聖經以婚姻與兒女為蒙福的象徵，家庭是屬靈訓練的第一所學校。", "第一步：建立家庭——鼓勵年輕人不要因文化與經濟壓力一再延後結婚。"], "mm": {"c": "重建家庭", "b": [["現況", ["家是停機坪", "社會結構不利"]], ["澄清", ["非關得救", "獨身是特殊呼召"]], ["聖經觀點", ["婚姻是常態", "家是第一所學校"]], ["行動", ["建立家庭", "讓家有生產力"]]]}, "fw": {"q": "基督徒該如何看待家庭在現代的處境？", "a": "把家庭重新當作信仰與生活的前線", "steps": ["認清社會結構對家庭的壓力", "肯定婚姻家庭是一般的呼召", "讓家成為門徒訓練與生產的中心"], "do": ["一起規劃每天在家中的靈修與談話", "思考家可以如何更有生產力與接待"]}, "gold": ["家不只是兩個行程之間的停機坪。", "特殊的呼召之所以特殊，正因它不是常態。", "家庭是屬靈訓練的第一所學校。"], "ref": ["創世記 2:18", "詩篇 68:6", "申命記 6:7-8", "以弗所書 6:1-4"], "fb": "疫情那段時間，整個世界被按下暫停鍵。\n人們被告知：「回家吧。」\n可是，很多人回到家之後才發現：我們好像不知道，在家要做什麼。\n\n疫情之前，家常常只是一個停機坪——\n上學、上班、補習、活動之間，短暫降落、充電、再起飛。\n一家人一天相處的時間，常常只有出門前的匆忙和回家後的疲憊。\n\n為什麼越來越多人晚婚、少生、離婚？\n當然有個人的罪與粗心，\n但更大的原因是：現代社會的結構，本身就不太利於家庭。\n家庭像一根方形的木樁，被硬塞進一個圓形的洞。\n\n那麼，一場全球性的疫情，會不會正好是一個機會，\n讓基督徒重新認真看待「家」？\n\n一談到這個，馬上會有人反彈：\n「你是說每個基督徒都要結婚嗎？」\n「你是想回到五〇年代嗎？」\n「這是生活方式的律法主義吧！」\n\n讓我們先說清楚：\n家庭不是得救的條件。人是因信稱義，而信心是聖靈白白的恩賜。\n也不是每個基督徒都蒙召結婚——獨身是可敬的呼召，常常更專心於福音的工作。\n\n但是，特殊的呼召之所以特殊，正因為它不是常態。\n聖經清楚地把婚姻視為人類一般的呼召：\n那人獨居不好；神叫孤獨的有家。\n舊約以一對夫妻開始，新約以一場婚筵結束；\n聖經一再用婚姻與兒女，作為蒙福的記號。\n\n更重要的是，家庭是屬靈訓練的第一所學校。\n申命記說，要把神的話放在心上，殷勤教訓兒女，\n無論坐在家裡、行在路上、躺下、起來，都要談論。\n父母不能控制孩子的屬靈命運，\n卻是神平常用來作門徒訓練的器皿。\n\n我們以為，家是休息的地方；\n其實，家是前線。\n世界的戰爭在外面，信仰的戰爭從客廳開始；\n社會的崩解在新聞裡，社會的重建從餐桌開始。\n\n所以，基督徒應該重新建立家。\n第一步也許很簡單：建立你的家。\n不要因為文化和經濟的壓力，一再把婚姻延後。\n然後，讓家成為一個有生產力的地方——\n不只是消費的地方，而是讓身體和靈魂都被餵養、被造就的地方。\n\n疫情過去了，世界又開始轉動，\n可是那個問題還在：\n我們的家，只是停機坪嗎？\n還是一座堡壘、一間教室、一個小小的天國前哨站？\n\n今晚，坐在餐桌前，\n也許可以問家人一個問題：\n「如果神要用我們這個家，你覺得祂會想做什麼？」\n那可能，就是重建的第一塊磚。\n\n#家庭 #婚姻 #門徒訓練 #疫情 #家是前線"}, "may-she-always-love-him-more": {"zh": "願她永遠更愛祂", "tags": ["給丈夫", "福音與奧祕"], "core": "想更愛妻子，就要讓她愛你少一點——少於她愛耶穌；因為耶穌在每方面都比你更能滿足她。", "sum": ["作者坦承曾嫉妒妻子把時間給孩子、事工，甚至給她與主的靈修。", "耶穌說愛父母兒女過於愛祂的不配作祂的門徒；這也包括夫妻。", "耶穌的約更好：永遠只有「更好」沒有「更壞」。", "耶穌的禮物更好、祂是更好的大祭司：比你更了解並體恤她的軟弱，永遠為她代求。", "耶穌更會愛她、帶領她；丈夫只能從耶穌的愛中滿溢出來愛她。"], "mm": {"c": "讓她更愛耶穌", "b": [["作者掙扎", ["嫉妒排第二", "自私合理化"]], ["更好的約", ["永恆", "只有更好"]], ["更好的禮物", ["赦罪與生命", "生命的糧"]], ["更好的祭司與領袖", ["體恤軟弱", "捨命的牧人"]]]}, "fw": {"q": "丈夫該希望在妻子心中排第一嗎？", "a": "不，要希望她最愛耶穌", "steps": ["承認想被排第一的自私", "看見耶穌在各方面更好", "從基督的愛中滿溢去愛她"], "do": ["主動為妻子保留靈修時間", "為她與主的關係禱告"]}, "gold": ["若想更愛妻子，就讓她愛你少於愛耶穌。", "你的禮物很好，但祂的禮物才是她真正需要的。", "你只能用從基督那裡滿溢出來的愛去愛她。"], "ref": ["馬太福音 10:37", "希伯來書 4:14-16", "以弗所書 5:23-25"], "fb": "他當牧師的時間，比他當丈夫的時間還長。\n可是他承認，有好多年，他嫉妒排在第二位。\n嫉妒妻子花在六個孩子身上的時間，\n嫉妒她的服事，\n甚至——說出來很羞愧——嫉妒她每天早上和主單獨相處的時間。\n\n他的自私很會找理由：\n我是她的丈夫，我應該是她最重要、最緊急的那一位，不是嗎？\n\n後來他才學到一件反直覺的事：\n如果你想更愛你的妻子，就要學習讓她愛你少一點——少於她愛耶穌。\n\n耶穌說：愛父母過於愛我的，不配作我的門徒；愛兒女過於愛我的，也不配。\n這個清單沒有寫出「夫妻」，但當然也包括在內。\n\n為什麼要希望她更愛祂？\n\n因為祂的約更好。\n你和她的婚約很美，神把你們黏成一體，人不可分開；\n但耶穌與她立的新約是永恆的，只會「更好」，永不「更壞」。\n你可以用神的話洗淨她，但耶穌就是那道；\n她和神的關係，不是建立在你身上，而是建立在祂的身體和寶血上。\n\n因為祂的禮物更好。\n你存了很久的錢買給她的戒指，她戴了二十五年還很喜歡。\n但耶穌給她的，是赦罪、是復活的生命、是祂完全的義、是生命的糧、是永不再渴的活水，\n是祂所承受的一切產業。\n你的禮物很好，但祂的禮物，才是她真正需要的。\n\n因為祂是更好的大祭司。\n你為她禱告，神垂聽；\n但耶穌比你更了解她的需要，比你更體恤她的軟弱，\n而且祂永遠活著，為她代求。\n五十年後，億萬年後，祂都還在那裡為她。\n\n因為祂愛她、帶領她，都比你更好。\n神使你作她的頭，你要以犧牲而非轄制的方式帶領；\n但耶穌是那位為羊捨命的好牧人，知道哪裡有青草地和安歇的水邊。\n祂先愛她，也愛她更多。\n你只能從祂給你的愛裡，滿溢出來去愛她。\n\n想排第一的丈夫，常常讓妻子很累；\n願意排第二的丈夫，反而讓妻子很自由。\n嫉妒她的靈修時間，是在跟耶穌搶位置；\n守護她的靈修時間，是在跟耶穌同工。\n\n丈夫們，你今天是在幫她更靠近主，還是在不知不覺中，拉住她的衣角？\n\n願你的妻子，永遠愛祂更多。\n然後你會發現，\n一個在基督裡被滿足的女人，\n會用一種你從未經歷過的方式，\n更溫柔、更自由、更長久地，愛你。\n\n#婚姻 #丈夫 #愛神至上 #大祭司 #好牧人"}, "three-lies-that-separate-spouses": {"zh": "拆散夫妻的三個謊言", "tags": ["衝突與修復"], "core": "「不可和解」在聖經中是可怕的罪；夫妻常因相信三個謊言而拒絕饒恕。", "sum": ["許多婚姻以「不可調和的差異」收場，但聖經中「不肯和解」描述的是末世敗壞的人。", "不肯和解的人懷著不容休戰的敵意，卻還把苦毒屬靈化，以為是在順服神。", "謊言一：「除非你承認我看到的所有罪，我才饒恕你。」撒但的詭計是讓人不接受真心的悔改。", "謊言二：「若要付代價，我就不饒恕。」饒恕需要放棄懲罰，並自己承擔對方欠的債。", "基督承擔了我們無法償還的債；被饒恕的人才能饒恕人。"], "mm": {"c": "不肯和解", "b": [["聖經定義", ["末世的敗壞", "不容休戰的敵意"]], ["謊言一", ["要你承認全部", "懷疑對方悔改"]], ["謊言二", ["饒恕不該有代價", "放棄懲罰並承擔"]], ["解藥", ["十字架", "被饒恕而饒恕"]]]}, "fw": {"q": "為什麼我們難以饒恕配偶？", "a": "因為相信了撒但的謊言", "steps": ["分辨自己是否不肯和解", "接受對方真心的悔改", "願意承擔饒恕的代價"], "do": ["對配偶說：我看見饒恕你的代價，我接受。", "回想基督為你承擔的債"]}, "gold": ["「不可調和」在聖經裡不是理由，而是罪。", "饒恕不是債務消失，而是我選擇承擔。", "撒但的詭計之一，是讓人拒絕悔改者的道歉。"], "ref": ["提摩太後書 3:1-9", "哥林多後書 2:5-11", "馬太福音 18:21-35"], "fb": "一位丈夫拒絕饒恕妻子，因為她就是看不見他列出的那些罪。\n一位妻子不肯和好，除非丈夫完全認同她對事情的看法。\n一段婚姻搖搖欲墜，因為其中一方，已經把對方的動機判定為無可救藥。\n\n最後，他們說：我們有「不可調和的差異」。\n\n這個詞被說得太輕了。\n在提摩太後書三章，保羅列出末世敗壞之人的特徵，其中一個詞，正是「不肯和解」。\n它描述的是一種不容休戰的敵意：記仇、不饒恕、無法平息。\n這樣的人會精緻地包裝自己的苦毒，讓它與別人隔絕。\n\n更危險的是，他自稱基督徒、自稱是忠心的配偶，\n卻在拒絕和解時，認為自己正在順服神。\n把苦毒屬靈化的人，是教會裡最容易受傷，也最容易傷人的人。\n他們常常相信了三個謊言。\n\n第一個謊言：「除非你承認我看到的所有罪，我才饒恕你。」\n哥林多教會有一個人犯了嚴重的罪，後來真心悔改，教會卻不肯接納。\n保羅出面說：要向他顯出堅定的愛，饒恕他，\n免得撒但趁著機會勝過你們，因為我們並非不曉得牠的詭計。\n撒但的詭計之一，就是說服信徒：不必饒恕悔改的人。\n我們以為自己已經照X光看透對方的心，判定他不夠真誠，\n然後擋住每一次和好的嘗試。\n\n第二個謊言：「如果要付代價，我就不饒恕。」\n耶穌說了一個比喻：一個僕人被主人免了一大筆債，\n轉身卻掐住欠他一點小錢的同伴，要他還清。\n饒恕至少要承擔兩個代價。\n第一，說：「我不懲罰你。」放下那個想要報復的本能。\n第二，說：「你欠我的，我來承擔。」\n饒恕不會讓債務魔法般地消失；借出去的錢，原諒了也不會自己回到錢包裡。\n基督饒恕我們時，祂承擔了羞辱與痛苦；我們饒恕時，也要承擔代價。\n\n我們以為，不報復就已經很偉大了；\n其實，真正的饒恕，是願意自己吞下那筆帳。\n我們以為，被傷的人有權利不饒恕；\n其實，被饒恕最多的人，最沒有權利不饒恕。\n\n「憑什麼是我來買單？」——這句話很合理。\n可是看看十字架：無瑕的羔羊，承受了歷史上最大的不公義。\n我們該受的刑罰，祂受了；我們還不起的債，祂付了。\n\n今天，你心裡有沒有一筆一直不肯撕掉的帳？\n你是不是在等對方「悔改得夠完整」，才願意放手？\n\n也許可以試著說出這句話：\n「我看見饒恕你的代價，而我願意承擔。」\n那不是軟弱，\n那是你在婚姻裡，\n離十字架最近的一刻。\n\n#婚姻 #饒恕 #和好 #苦毒 #十字架"}, "how-do-i-choose-a-spouse": {"zh": "如何選擇配偶？", "tags": ["婚前與擇偶"], "core": "選擇配偶影響世代；父母要在餐桌上及早教導兒女：寧可單身也不要不智的婚姻、為更親近基督而結婚。", "sum": ["除了信主，兒女最重要的決定就是和誰結婚，影響好幾代人的永恆。", "父母（尤其父親）要在家庭餐桌上，從青春期開始就與兒女討論。", "寧可單身，也不要進入不智的婚姻；但婚姻是一般常態，應當追求。", "為更深經歷基督而結婚：只與信徒結婚，並觀察對方能否說明福音、生活是否以基督為中心。", "找一個能成為最好朋友的人；婚禮的重點是誓言；結婚就是燒斷退路。"], "mm": {"c": "擇偶原則", "b": [["寧缺勿濫", ["寧可單身", "但要追求婚姻"]], ["更親近基督", ["只與信徒結婚", "以基督為中心"]], ["成為摯友", ["共同興趣", "外貌會褪去"]], ["重視誓言", ["婚禮重點", "燒斷退路"]]]}, "fw": {"q": "父母如何幫助兒女選擇配偶？", "a": "及早、持續在餐桌上教導屬靈的擇偶原則", "steps": ["從青春期開始討論", "教導只與成熟信徒結婚", "強調友誼與誓言的重要"], "do": ["每週至少四次家庭晚餐", "問對方：他能清楚說明福音嗎？"]}, "gold": ["寧可單身，也不要不智地結婚。", "要嫁娶一個讓你更靠近基督的人。", "婚禮的重點不是花和禮服，而是誓言。"], "ref": ["哥林多前書 7:39", "哥林多後書 6:14", "詩篇 2:11"], "fb": "很多父母花大量時間討論孩子的成績、才藝、要上哪所大學，\n卻很少坐下來談：你將來要和怎樣的人結婚？\n\n除了信主之外，孩子一生最重要的決定，就是和誰結婚。\n這個決定，會影響好幾代人的永恆：\n他自己的、他配偶的、你的孫子、你的曾孫。\n\n一位養大五個孩子的父親說：\n最好的教導場所，是家裡的餐桌。\n一週至少四次、最好六次，一家人一起吃飯。\n好的父母，尤其是父親，不只用榜樣教，也用嘴巴教；\n而且要早，最好在孩子進入青春期時就開始，然後持續地談。\n\n他們常和孩子討論幾個原則。\n\n第一，寧可單身，也不要不智的婚姻。\n今天，一段婚姻可能長達五十到七十年。\n以基督為中心，它可以甜美得不可思議；以別的為中心，前景就不太樂觀。\n除非神給你為天國單身的心志，否則就追求婚姻——那是聖經的常態；\n但要謹慎、要有智慧地追求。\n\n第二，結婚是為了更深地經歷基督。\n神清楚吩咐：只在主裡嫁娶，沒有例外。\n可是「信徒」是什麼？很多人說自己信了，生活卻對屬靈的事毫無興趣。\n可以問：他能清楚說明福音嗎？他相信並以它為樂嗎？\n他的生活是圍繞基督，還是圍繞別的東西？\n和這個人結婚，會明顯讓我更靠近基督，還是悄悄把我拉遠？\n\n第三，嫁娶一個可能成為最好朋友的人。\n不要只娶一張漂亮的臉，也不要只嫁一份看好的前途。\n美麗的身體很快會改變；事業成功在五十歲時，若沒有共同的信仰與親密，也毫無意義。\n\n第四，重點是誓言。\n婚禮不是花、音樂、禮服、賓客、蜜月；\n婚禮是在見證人面前立誓——而最重要的見證人，是那位聖潔、全知、恨惡背約的審判者。\n所以，要存戰兢而快樂。\n\n第五，準備燒斷退路。\n「直到死亡把我們分開」，意思是：沒有回頭路。\n\n世界問：他條件好不好？\n智慧問：他讓你更像基督嗎？\n世界問：她漂不漂亮？\n智慧問：她二十年後，還會是你最好的朋友嗎？\n世界問：婚禮要辦得多好看？\n智慧問：誓言要守得多長久？\n\n爸爸媽媽們，今晚的餐桌上，\n也許可以少問一句「考得怎麼樣」，\n多問一句「你覺得，怎樣的人值得託付一生」。\n那一句話，可能比任何補習班，\n都更深遠地，祝福你的孩子和孫子。\n\n#擇偶 #家庭教育 #父母 #婚姻 #在主裡"}, "love-your-wife-like-jesus-loves-her": {"zh": "像耶穌愛她一樣愛你的妻子", "tags": ["給丈夫"], "core": "丈夫要問一個問題：耶穌如何愛教會？作者從聖經整理出十種基督的愛，作為一生的功課。", "sum": ["作者18歲時，牧師在婚前查經中問：耶穌如何愛教會？這成了他22年的功課。", "堅定的愛：耶穌永不離棄，不以表現為依據。", "有盼望的愛：耶穌看她為已成聖、已得榮耀，所以能忍耐。", "追求的愛、饒恕的愛：像耶穌為彼得預備早餐；喜樂的愛：耶穌樂意愛她。", "服事的愛、使人成聖的愛、帶領的愛：拿起毛巾與水盆，鼓勵她靈命成長，徵詢她的意見後承擔決定。"], "mm": {"c": "十種基督的愛", "b": [["堅定與盼望", ["永不離棄", "看見終點"]], ["追求與饒恕", ["持續追求", "主動和好"]], ["喜樂與服事", ["樂意愛她", "拿起毛巾"]], ["成聖與帶領", ["助她成長", "承擔決定"]]]}, "fw": {"q": "丈夫如何像基督那樣愛妻子？", "a": "研究並效法耶穌愛教會的各種方式", "steps": ["以堅定與盼望的愛為根基", "以追求、饒恕、喜樂表達", "以服事、成聖、帶領實踐"], "do": ["每週挑一種「基督的愛」刻意操練", "晚上照顧孩子，讓她去查經"]}, "gold": ["丈夫該常問的問題：耶穌怎麼愛教會？", "被基督的愛抓住的丈夫，會成為無可救藥的浪漫者。", "丈夫不是要被服事的國王，而是家中的首席僕人。"], "ref": ["以弗所書 5:25", "約翰福音 13:12-17", "約翰福音 21:12-15"], "fb": "1998年春天，一個十八歲的大學新鮮人，報名了教會的「婚前預備」查經班。\n那天，牧師讀了一節經文：丈夫們，要愛你們的妻子，正如基督愛教會。\n然後問了一個很顯然的問題：\n「那麼，基督是怎麼愛教會的？」\n\n這個問題，成了他二十二年的作業，\n而且，他打算一直寫到「直到死亡把我們分開」。\n\n一年又一年，他在聖經裡尋找基督愛教會的方式，\n整理出十種愛。\n\n堅定的愛。\n祂應許：我常與你們同在，直到世界的末了。\n祂愛她，不是因為她表現多好，而是因為祂的盟約。\n當我們在多年的挑戰與改變中守住婚約，就反映了這種固執又歡喜的愛。\n\n有盼望的愛。\n祂看她，彷彿她已經成聖，甚至已經得榮耀。\n你的愛，是「凡事盼望」嗎？\n帶著永恆的眼光，你就能像祂一樣，對她有耐心——也對你自己。\n\n追求的愛。\n祂從不休息地追求她的心，不只要她的忠誠，也要她的情感；\n像那位撇下九十九隻羊，去找一隻的牧人。\n被耶穌的愛抓住的丈夫，會成為一個無可救藥的浪漫者。\n\n饒恕的愛。\n她不配的時候，祂給她恩典。\n最像基督的一件事，可能就是每天饒恕她，記得你也需要饒恕。\n想想復活的耶穌，在海邊為三次不認祂的彼得預備早餐。\n你們之間，通常是誰先走向和好？\n\n喜樂的愛。\n祂不是勉強地、咬著牙愛她，祂是樂意愛她。\n被這樣愛著的妻子，常常會成為別人更大的祝福。\n\n服事的愛。\n祂捨己。沒有任何一件神要你為她做的事，是太多的。\n很多丈夫把自己當成要被服事的國王，\n但我們被呼召，成為家裡的首席僕人——拿起毛巾，拿起水盆。\n\n使人成聖的愛、帶領的愛……\n鼓勵她去查經，即使你得一個人顧孩子一整晚；\n常常把她帶到父面前禱告；\n帶領她走向對她真正好的事——而這需要你自己先被神的話和禱告帶領。\n\n世上的愛，常常是「因為」：因為你好，所以我愛你；\n基督的愛，常常是「雖然」：雖然你不配，我仍然愛你。\n世上的丈夫問：她為我做了什麼？\n基督的丈夫問：我還能為她做什麼？\n\n這份作業永遠寫不完，\n因為基督的愛，長闊高深，\n一輩子也學不盡。\n但每一天多學一點，\n她就多一點，看見那位真正的新郎。\n\n#婚姻 #丈夫 #基督的愛 #以弗所書5章 #十種愛"}, "you-waited-long-and-well-for-him": {"zh": "你為他等候得又久又好", "tags": ["婚前與擇偶", "溝通與親密"], "core": "一篇婚禮致詞：以神為最大的喜樂，能讓你們不對婚姻要求過多，也不輕看浪漫，並迅速解決衝突。", "sum": ["新娘在宣教工場等了近十年，先求神的國，如今神成全了她的心願。", "「想結婚」其實是渴望一段健康、溫柔、熱情、長久的關係。", "建議：把所有雞蛋放在「以耶和華為樂」這個籃子裡；愛神的人會成為更好的愛人。", "以神為樂能避免對配偶要求過多：期待配偶滿足一切，會從愛變成怒、再變成恨。", "也能避免輕看浪漫：丈夫常停止追求，但妻子從不抱怨被追求太多；並要決心迅速解決衝突。"], "mm": {"c": "以神為樂", "b": [["等候", ["宣教十年", "先求神國"]], ["核心原則", ["以耶和華為樂", "愛神者更會愛人"]], ["避免過度要求", ["配偶不能滿足一切", "人人都有缺點"]], ["持續浪漫", ["一直追求", "迅速解決衝突"]]]}, "fw": {"q": "新婚夫妻最重要的根基是什麼？", "a": "以神為最大的喜樂", "steps": ["把終極滿足放在神身上", "對配偶保持合理期待", "持續追求並迅速和好"], "do": ["一起讀詩篇37篇", "約定衝突不過夜"]}, "gold": ["把所有雞蛋放在一個籃子裡——如果那籃子是神。", "期待配偶滿足一切，最後愛會變成怨。", "妻子從不抱怨被追求得太多。"], "ref": ["詩篇 37:4", "箴言 13:19", "馬太福音 6:33"], "fb": "她想結婚，也想要孩子。\n可是有將近十年，她選擇了一條人少的路——去宣教工場。\n她在那裡先求神的國，等了很久，也等得很好。\n今天，她穿上白紗。那些安靜又孤單的夜晚，終於結束了。\n\n心願得成，心覺甘甜。\n可是，婚禮這天也是一個提醒：從今天起，你們要把對婚姻的夢想，換成婚姻真實的喜樂與挑戰。\n\n當人說「我想結婚」，他真正想說的是什麼？\n大概是：我渴望一段健康、溫柔、熱情、彼此滿足、長長久久的關係。\n那麼，該怎樣走向這樣的關係？\n\n有一個人生哲學說：「不要把所有雞蛋放在同一個籃子裡。」\n可是有一個籃子，值得你放進全部的雞蛋：\n當以耶和華為樂，祂就將你心裡所求的賜給你。\n\n有人會問：我心裡想要的，不一定都是好的啊？\n是的。但觀察下來，以神為樂的人，渴望會慢慢變得敬虔；\n愛神的人，會成為更好的愛人。\n他的渴望和神的旨意，會漸漸對齊。\n\n以神為樂，帶來兩個保護。\n\n第一，它保護你們不對彼此要求過多。\n期待配偶滿足自己每一個需要、讓自己一直快樂的人，\n會把婚姻壓得喘不過氣。\n這樣的婚姻常常從「我愛你，因為你讓我好快樂」，\n走到「我生你的氣，因為你現在沒讓我快樂」，\n最後走到「我恨你，因為你讓我不快樂」。\n就像一位輔導說的：兩隻蝨子，卻沒有狗。\n人人都有缺點，玫瑰也有刺。\n讓神成為你快樂的終極來源，期待才會實際，你們才能一起承受更好的和更壞的。\n\n第二，它保護你們不輕看浪漫。\n日子一久，丈夫常常就不再追求了——這是大錯特錯。\n妻子從來不會抱怨被追求得太多。\n以神為樂的人，會被聖靈輕輕推一把：\n當花開始枯萎，就該澆水了——一句溫柔的話、一個體貼的服事。\n\n還有，要決心迅速解決衝突。\n因為以神為樂，你會遵守祂的命令；\n而祂的命令，本來就是為了成全你心裡那份「健康、溫柔、熱情、長久」的渴望。\n\n期待配偶滿足一切，愛會變成怨；\n期待神滿足一切，愛會變成禮物。\n\n你們把雞蛋，放在哪一個籃子裡？\n\n親愛的新娘，妳等得又久又好；\n親愛的新郎，你加入了她那條等候的路。\n願你們接下來的路，\n仍然先求祂的國，仍然以祂為樂，\n然後驚喜地發現——\n祂賜下的，比你們當初所求的，更多更好。\n\n#婚禮 #新婚 #以神為樂 #等候 #詩篇37"}, "they-laid-love-on-the-altar": {"zh": "他們把愛獻在祭壇上", "tags": ["婚前與擇偶"], "core": "吉姆與伊莉莎白·艾略特的書信顯示：他們把彼此的愛獻給神，在等候與禱告中先求神的旨意。", "sum": ["作者是艾略特夫婦的女兒，在母親過世後找到母親寫給父親的信件。", "兩人原本都以為要單身宣教，在惠頓大學相遇後，彼此的吸引成了內心的掙扎。", "他們認為感情應當降服在主的權柄下，像舊約中「當獻給神的物」。", "五年間只見面五次，卻每兩週通信，不斷為對方禱告，把對方交給神。", "等候、信靠、禱告、再等候——在等候中，他們的禱告生活更加深刻。"], "mm": {"c": "獻上的愛", "b": [["發現", ["失而復得的信", "女兒的見證"]], ["掙扎", ["原想單身宣教", "新的吸引"]], ["獻上", ["感情降服神", "當獻之物"]], ["等候", ["五年見五次", "持續禱告"]]]}, "fw": {"q": "當感情可能與呼召衝突時怎麼辦？", "a": "把愛獻在祭壇上，先求神的旨意", "steps": ["承認感情的力量", "把對方交給神", "在禱告與聖經中等候"], "do": ["把你的感情與期待具體交託給神", "讀《Passion and Purity》一類的書"]}, "gold": ["他們先屬於神，然後才屬於彼此。", "等候不是空白，而是禱告最深的季節。", "把所愛的獻上，並不會失去，而是被神保守。"], "ref": ["利未記 27:28", "以賽亞書 64:4-5"], "fb": "有一位女兒，在母親過世後整理閣樓，\n意外找到一疊她以為早就遺失的信——母親當年寫給父親的情書。\n那些信曾經跟著父親走遍南美洲的叢林，竟然保存得好好的。\n她的父母，是吉姆·艾略特與伊莉莎白·艾略特。\n\n他們在惠頓大學的宣教團契相遇。\n兩個人原本都以為，自己要單身去宣教，\n也滿足於在神裡面找到所有的愛與安全。\n然後，一份新的吸引出現了，攪亂了他們專心讀希臘文的心。\n\n他們認為：這份感情必須死去，必須降服在主的權柄之下。\n就像舊約裡「永獻給耶和華的物」，他們把彼此獻在祭壇上。\n\n接下來五年，他們只見過五次面。\n他們分別在厄瓜多爾的兩端服事，\n每兩週寫一次信，美麗，有時也很掙扎；\n每一封信都在為對方禱告，都在努力把對方完全交給神。\n\n今天的戀愛文化說：喜歡就要抓緊，愛就要擁有。\n他們卻示範了另一種愛：愛，就是交出去。\n\n我們以為，把所愛的獻上，就會失去；\n其實，把所愛的獻上，才會真正被神保守。\n我們以為，等候是一段空白；\n其實，等候是禱告最深的季節。\n我們以為，降服會讓愛變淡；\n其實，降服讓愛變得更純、更深、更經得起考驗。\n\n他們在信裡常常默想關於等候和信靠的經文。\n以賽亞說：自古以來，人未曾聽見、未曾看見，在你以外有什麼神，能為等候祂的人行事。\n他們等候，信靠，禱告，再等候。\n當人真的把神的話當真、反覆默想時，禱告生活會變得何等深！\n\n他們最後結婚了。\n後來的故事，很多人都知道：\n吉姆在向奧卡族傳福音時殉道，\n伊莉莎白帶著年幼的女兒，繼續在那片土地上服事。\n他們的愛，從一開始就放在祭壇上；\n所以當神真的取走時，那份愛沒有變成苦毒，而成了更深的獻上。\n\n你心裡，是否也有一份緊抓著不放的感情？\n一個人、一段關係、一個對未來的夢？\n你願意把它放在祭壇上嗎？\n\n放上去，不是因為它不重要，\n而是因為它太重要了，\n重要到只有交在神手中，才是最安全的地方。\n\n他們先屬於神，然後才屬於彼此。\n願我們的愛也是這樣——\n不是緊握的拳頭，\n而是張開的手掌，\n放在祭壇上，\n等神說：好，現在，我把它還給你。\n\n#單身 #等候 #艾略特 #降服 #宣教"}, "stop-loving-your-spouse-too-much": {"zh": "別再過度愛你的配偶", "tags": ["福音與奧祕"], "core": "每段婚姻不是基督徒的就是拜偶像的；唯有基督是生命和光，當我們更愛祂，就能更好地愛配偶。", "sum": ["分別在於：給予或索求、享受或利用、分享或操控。", "婚姻是特權：一體是完全的歸屬與不羞恥的坦露；神在逐出伊甸時沒有收回婚姻。", "你的婚姻是伊甸園的一小塊遺跡，要培養成美好的基督徒樣式。", "基督是資源：生命不在你或配偶裡面，而在基督裡。", "「過度愛配偶」其實是錯誤地愛；從她得到的愛，其實也是神藉著她的愛。"], "mm": {"c": "基督徒或偶像", "b": [["分別", ["給予或索求", "享受或利用"]], ["婚姻的特權", ["一體", "伊甸的遺跡"]], ["基督的資源", ["生命在祂", "祂是光"]], ["結果", ["不苛求配偶", "感恩與敬拜"]]]}, "fw": {"q": "怎樣避免把配偶變成偶像？", "a": "把生命的源頭放在基督，而非配偶", "steps": ["察覺索求、利用、操控的傾向", "珍惜婚姻作為神的禮物", "從基督得生命，再去愛配偶"], "do": ["感謝神藉配偶給你的愛", "放下要配偶成為你「生命」的期待"]}, "gold": ["兩個基督徒結婚，不代表婚姻就是基督徒的。", "配偶不能成為你的生命和光，他只是像你一樣的人。", "從她而來的愛，也是神藉著她的愛。"], "ref": ["創世記 2:24-25", "約翰福音 1:4", "馬太福音 19:3-6"], "fb": "每一段婚姻，不是基督徒的，就是拜偶像的。\n而且，兩個基督徒結婚，也可能在不知不覺中拜偶像。\n\n這句話聽起來很重，卻很真實。\n差別在哪裡？\n給予，還是索求；\n享受，還是利用；\n分享，還是操控；\n謙卑地感恩，還是沒察覺的自私。\n\n每一段被不公平的期待所傷的婚姻，\n都可以因為被喚醒的敏銳，而得醫治；\n都可以成為榮耀基督、使夫妻得生命的婚姻。\n\n兩個聖經的洞見，可以打開新的可能。\n\n第一，婚姻是一份特權。\n人要離開父母，與妻子連合，二人成為一體。\n一男一女，手牽手走過這一生，完全彼此歸屬。\n健康的友誼有界線，婚姻卻讓兩個人赤身露體、毫無羞恥。\n當神把人逐出伊甸園時，祂沒有把婚姻收回去；\n祂讓我們保留了這份禮物。\n耶穌看待我們不完美的婚姻，和亞當夏娃那完美的婚姻，一樣神聖、一樣不可侵犯。\n\n你的婚姻，就是伊甸園留下來的一小塊。\n在那個只屬於你們兩人的圈子裡，神要你們耕耘一個小小的、美麗的前哨站。\n\n第二，基督是我們的資源。\n生命在祂裡頭，這生命就是人的光。\n生命不在你裡面，也不在你配偶裡面；\n我們渴望的生命，只在基督裡。\n\n你的配偶之所以不能成為你的生命和光，\n是因為他做不到。\n他和你一樣，是次要的、衍生的、有限的、需要倚靠的、很容易疲乏的。\n只有基督，是首要的、原初的、自由的、大能的、樂意的。\n\n我們以為，問題是「愛配偶愛得太多」；\n其實，問題是「愛的方式錯了」——像愛一個偶像。\n當我們更愛基督，反而能更好地愛配偶。\n\n有一位丈夫說：當我把妻子擁入懷中，\n我所經歷的愛，不只來自她，也是神藉著她臨到我的愛。\n那份愛沒有因此變得比較不像她的，\n反而讓她在我眼中更加奇妙。\n我被帶向對她的感恩、對神的敬拜——那一刻，我站在聖地上。\n\n當你記得，是基督給了你們一切生命和光，\n你就不需要配偶成為她做不到的那個人。\n你們的不完美，正是基督最深地住在其中的地方。\n\n兩個基督徒結婚，不會讓婚姻自動變成基督徒的；\n兩個基督徒一直仰望基督，婚姻才會真正成為基督徒的。\n\n今天，別再要求配偶當你的救主了。\n把那份重擔還給基督，\n然後輕輕地、自由地、感恩地，\n享受那個神放在你身邊的人。\n\n#婚姻 #偶像 #基督是生命 #伊甸園 #感恩"}, "how-could-heaven-not-have-sex": {"zh": "天堂怎麼可能沒有性？", "tags": ["性與親密", "苦難與死亡"], "core": "天堂沒有嫁娶，不是因為比地上少了樂趣，而是因為有更大的喜樂，使地上最好的享受都相形失色。", "sum": ["一位非信徒驚訝地問：天堂怎麼可能沒有性？他無法想像比地上更少樂趣的天堂。", "作者也曾困惑：耶穌說復活時不娶不嫁；婚後更覺得從獨一的親密變成一般的關係是種失落。", "路易斯的比喻：小男孩聽說性是最高的身體享受，就問那時能不能吃巧克力。", "我們只認識巧克力（地上的樂趣），還不認識那排除它的更美好之物。", "天堂不是地上喜樂的升級版；發明這些歡愉的神，會用更大的喜樂取代它們。"], "mm": {"c": "天堂的喜樂", "b": [["困惑", ["復活時不娶不嫁", "像失去獨特親密"]], ["路易斯比喻", ["性與巧克力", "不知道更好的"]], ["重新理解", ["想像力的軟弱", "不是減少樂趣"]], ["盼望", ["影子讓位給實體", "更大的喜樂"]]]}, "fw": {"q": "天堂沒有婚姻與性，會不會比較無聊？", "a": "不會，因為那裡有更大的喜樂", "steps": ["承認心中的不捨", "用路易斯的比喻重新思考", "把地上的喜樂看成將來的影子"], "do": ["感謝神賜下婚姻與親密的禮物", "讓地上的喜樂提醒你渴慕天上的"]}, "gold": ["我們熟悉巧克力，卻還不認識那更美的。", "地上最亮的光，在天上只像一根燭火。", "天堂不是去掉痛苦的地球2.0。"], "ref": ["路加福音 20:34-36", "馬太福音 22:30"], "fb": "「那你們的天堂，能給我什麼？」\n他笑著問。\n他剛聽說另一種宗教的天堂裡有美女，覺得很吸引人。\n知道對方是基督徒，他又追問：\n「是不是每隔幾千年，你們從永遠的聚會中休息一下，可以有一點親密？」\n\n「天堂裡不會有性。」\n他愣住了，聲音大到連自己都嚇一跳：\n「天堂怎麼可能沒有性？」\n大海怎麼可能沒有雨滴？宴席怎麼可能沒有食物？\n他無法想像一個比地上樂趣更少的天堂。\n\n說實話，很多基督徒心裡也嘆過一口氣。\n耶穌說，復活的時候，人不娶也不嫁，像天上的使者一樣。\n結婚以後，這個問題甚至更大了——\n從和她那份獨一無二的親密，\n變成和所有聖徒一樣的一般關係，\n好像從量身訂做，變成生產線；\n好像第二次被取走一根肋骨。\n\n路易斯曾用「小孩與巧克力」來比喻這種心情：\n一個只懂糖果的孩子，很難想像大人的世界裡，有比糖果更讓人忘我的喜樂；\n他只會注意到「那裡沒有糖果」，卻看不見那裡有什麼。\n\n我們就像那個孩子。\n我們熟悉地上的親密，\n卻只在偶爾的瞥見中，認識那將在天上取代它的東西。\n\n問題不在天堂太貧乏，\n而在我們的想像力太貧乏，信心太軟弱。\n\n我們以為，天堂是去掉痛苦的地球二點零版；\n其實，天堂是讓地上最好的喜樂，都顯得像影子的地方。\n我們以為，失去婚姻是一種剝奪；\n其實，婚姻本來就是指向那更大喜樂的路標。\n我們以為，神對巧克力有意見；\n其實，巧克力就是祂發明的。\n\n是怎樣的光，會讓燭火變得不再重要？\n是怎樣的喜樂，會讓地上最高的歡愉，變成遙遠而被遺忘的回憶？\n\n所以，不必緊緊抓著地上最亮的影子，害怕它們消失；\n也不必把口袋塞滿巧克力，才敢踏進天堂的門。\n那位喜樂地發明了這些歡愉的神，\n會用更大的東西取代它們。\n\n今天，仍在婚姻裡的你，請好好享受這份禮物，\n並且讓它提醒你：\n這麼美的，還只是影子；\n那麼，實體會有多美？\n\n#天堂 #婚姻 #親密 #盼望 #路易斯"}, "together-in-bed-apart-in-soul": {"zh": "同床，卻不同心", "tags": ["溝通與親密", "給丈夫"], "core": "許多夫妻成了「屬靈室友」；靈裡的親密需要刻意經營，從一起清除小狐狸、讀經、禱告開始。", "sum": ["一群丈夫坦承：最難與之有屬靈對話的人，竟是自己的妻子。", "原因：妻子靈命獨立、一談就吵、工作太累、怕自己不夠懂聖經而失去尊重。", "結果：各讀各的經、各上各的查經班，同床卻不同心。", "撒但恨婚姻，因為它代表基督與教會；若不能讓人外遇或背道，就讓夫妻在靈裡分開。", "需要的是刻意：身體的靠近不等於靈魂的親密；第一步是「捉小狐狸」——彼此認罪，清除障礙。"], "mm": {"c": "靈裡親密", "b": [["現況", ["屬靈室友", "各讀各的"]], ["障礙", ["吵架與疲累", "自我懷疑"]], ["屬靈爭戰", ["撒但要分開", "不只是外遇"]], ["開始", ["刻意安排", "捉小狐狸"]]]}, "fw": {"q": "為什麼和配偶很難有屬靈對話？", "a": "因為靈裡的親密需要刻意經營，且有屬靈攻擊", "steps": ["承認你們已成屬靈室友", "辨識阻擋的「磚塊」", "建立固定的讀經禱告節奏"], "do": ["一起禱告前先彼此認罪", "每週安排一次固定的夫妻靈修"]}, "gold": ["身體靠近，不代表靈魂相親。", "脫下靈魂的外衣，比脫衣服更難。", "撒但若不能拆散身體，就想拆散靈魂。"], "ref": ["以弗所書 5:25-27", "雅歌 2:15"], "fb": "一群弟兄圍著桌子，有人說了一句話，大家都沉默地點頭：\n「我最難和他有屬靈對話的人，就是我太太。我想，她也會這樣說我。」\n\n不是不愛，不是不信，\n而是吵架、誤會、冷淡、疲倦、忙碌、不安全感，\n讓靈魂的親密，變得幾乎不可能。\n一起「存在」，比一起「交融」容易多了。\n有些人乾脆放棄：「這種事，在我們家就是行不通。」\n\n為什麼？\n有人娶了一位非常能幹的妻子，她自己的靈命照顧得很好，好像不需要他；\n有人一開口就吵架；\n有人下班回家已經累到不想深談；\n有人怕自己不夠懂聖經，會失去她的尊重。\n\n結果呢？\n她有她的查經班，他有他的；\n她讀這本書，他讀那本；\n頂多飯前一起禱告一句。\n交往時，一天的時間不夠他們談主；\n如今，他們可以和任何人深談，唯獨不和彼此。\n\n同床，卻不同心。\n他們成了屬靈的室友。\n\n我們以為，住在同一個屋簷下、一起吃飯、一起跑腿、一起看電視、都愛耶穌，\n靈魂就自然會親近。\n其實，身體的靠近，常常讓我們誤以為靈魂也靠近了；\n我們把肩膀的摩擦，錯當成靈魂的親吻。\n好幾個星期沒有一次深談，竟然也沒發現。\n\n脫下靈魂的外衣，有時比脫下衣服還難。\n因為那堵牆是用很多磚砌成的：\n家庭、教會、鄰舍無止盡的需要，對自己信仰知識的懷疑，\n一方或雙方屬靈低潮的季節，沒處理完的衝突……\n\n而且，有一位敵人很在意這堵牆。\n撒但恨婚姻，因為婚姻代表基督與新婦。\n如果牠還不能讓你們外遇或背道，\n那麼讓你們在靈裡分開，也是一種勝利。\n神配合的，牠想要拆開——如果拆不開身體，就拆開靈魂。\n\n所以，需要的是刻意。\n有一對夫妻，曾經也覺得這是遙不可及的事；\n後來他們決定，固定一起讀經、一起禱告，從一個可行的小習慣開始。\n\n第一步，叫作「捉小狐狸」。\n雅歌說：要給我們擒拿狐狸，就是毀壞葡萄園的小狐狸。\n自己尋求神時，可以忽略夫妻間的張力；\n一起來到神面前時，就很難忽略了。\n所以，先彼此認罪，再一起把它帶到主面前。\n\n今晚，在燈關掉之前，\n也許可以問一句：\n「最近，有沒有什麼事，讓我們之間有一點點卡住？」\n\n然後一起禱告，哪怕只有兩分鐘。\n那兩分鐘，\n可能就是兩個室友，\n重新變回同行天路的旅伴的開始。\n\n#婚姻 #屬靈親密 #夫妻禱告 #雅歌 #屬靈室友"}, "the-story-of-marriage-in-seven-verses": {"zh": "七節經文說完婚姻的故事", "tags": ["福音與奧祕"], "core": "從創世記到啟示錄，七節關鍵經文勾勒出婚姻的全貌：創造、合一、墮落、持守、基督與教會、終極的婚筵。", "sum": ["作者為一對成熟的新人挑選了聖經中七節最重要的婚姻經文。", "創世記1:27：神造男造女，同等尊貴而美好互補；男人獨居不好。", "創世記2:24：離開父母，與妻子連合，二人成為一體——最根本的人際關係。", "墮落後婚姻充滿痛苦，但馬太福音19:6說：神配合的，人不可分開；婚姻被設計來承受罪。", "丈夫要在亞當失敗之處忠心守護；雙方都不可拿對方的失敗當藉口。"], "mm": {"c": "七節經文", "b": [["創造", ["創1:27 男女", "創2:18 獨居不好"]], ["合一", ["創2:24 一體", "最根本的關係"]], ["持守", ["太19:6", "承受罪"]], ["奧祕與終局", ["弗5:32", "羔羊婚筵"]]]}, "fw": {"q": "聖經如何完整描述婚姻？", "a": "從創造到新天新地，婚姻指向基督與教會", "steps": ["創造：男女的尊嚴與差異", "合一與墮落：一體與破碎", "救贖：持守盟約並指向基督"], "do": ["夫妻一起背誦這七節經文", "在婚禮或紀念日讀出來"]}, "gold": ["男女的差異，不讓誰更好，而是讓彼此一起更好。", "婚姻被設計成能承受罪的衝擊。", "她的失敗不是他的藉口，他的失敗也不是她的。"], "ref": ["創世記 1:27", "創世記 2:24", "馬太福音 19:6", "以弗所書 5:32"], "fb": "那對新人都快四十歲了。\n他們等候得很有耐心，生活和信仰都很穩，\n清楚知道自己站在哪裡：一起站在神的話上。\n\n牧師請他們挑一兩段喜歡的經文在婚禮上讀，\n他們卻說：我們愛整本聖經，每一個字、每一筆一劃，\n不管神在那天要對我們說什麼，我們都樂意接受。\n\n牧師被感動了，決定替他們挑——\n不只一節，而是七節：聖經裡關於婚姻最重要的七節經文。\n\n第一節，創世記一章：神照自己的形像造人，造男造女。\n男女有同等的尊嚴，又有榮耀的差異。\n我們不是中性的人類，再加上男性或女性的配件；\n我們從每一個細胞開始，就是男人或女人。\n這些差異不讓男人比女人好，也不讓女人比男人好，\n而是讓男人和女人在一起更好。\n神造了日夜、海陸、萬物，每天都說「好」；\n唯獨看見那人獨居，祂說：不好。\n\n第二節，創世記二章：人要離開父母，與妻子連合，二人成為一體。\n兩個人成為一個新的實體，成為受造世界中最根本的人際關係，\n比親子關係更根本。\n在神之下，她是他最根本的委身；他也是她最根本的委身。\n\n然後，罪進來了。\n男人沒有看守好園子，讓蛇在妻子耳邊說話；\n他自己明明親耳聽過命令，卻聽從了妻子，得罪了神。\n從此，婚姻這個最根本的關係，也帶著劇痛與艱難。\n\n第三節，馬太福音十九章：神配合的，人不可分開。\n幾千年後，耶穌重申起初的設計。\n罪可以挑戰它，卻不能推翻它。\n婚姻本來就是設計來承受罪的衝擊；\n神要二人成為一體，不是要一體再被撕成兩半。\n\n神特別呼召男人，在第一個男人失敗的地方忠心——\n先保護妻子和婚姻，不受自己的罪所害，再不受別人的罪所害。\n她的失敗不是他的藉口，他的失敗也不是她的藉口。\n\n而這個故事，還沒說完。\n接下來的經文，會一路走到以弗所書的奧祕，走到啟示錄的羔羊婚筵。\n\n我們以為，婚姻是兩個人的故事；\n其實，婚姻是從創世記寫到啟示錄的故事。\n我們以為，婚禮是起點；\n其實，婚禮是一個更大故事中的一章。\n\n如果請你挑一節經文放在你們的婚姻裡，你會挑哪一節？\n你的婚姻，現在正活在故事的哪一章？\n\n願你們不只挑自己喜歡的經文，\n而是讓整本聖經，\n從第一頁到最後一頁，\n都在你們的家裡說話。\n\n#婚姻 #七節經文 #創世記 #馬太福音19 #聖經"}, "have-sex-like-you-know-god": {"zh": "像認識神的人那樣對待性", "tags": ["性與親密", "婚前與擇偶"], "core": "不認識神的人放縱情慾不足為奇；認識神的人，要讓對神的認識深入生命，成為保守性純潔的力量。", "sum": ["作者回顧年輕時的交往失敗：不是不知道規則，而是「明明認識祂」卻活得像不認識。", "帖撒羅尼迦前書4章：神的旨意是叫你們成聖，不要像不認識神的外邦人放縱私慾。", "若神不在畫面裡，性很容易成為神，即使最終會讓人失望。", "認識神的人知道罪、審判與十架的真實；為何要用片刻歡愉換取永恆的喜樂？", "屢戰屢敗的原因之一：對神的認識還沒穿透受綑綁的部分；需要透過禱告、默想、團契使之更深。"], "mm": {"c": "認識神與性", "b": [["作者回顧", ["明明認識祂", "卻活得像不認識"]], ["經文", ["帖前4:3-5", "成聖與節制"]], ["對比", ["不認識神的人", "認識神的人"]], ["得勝之道", ["讓真理穿透", "禱告默想團契"]]]}, "fw": {"q": "為什麼知道對錯，還是在性上跌倒？", "a": "因為對神的認識還沒深入內心", "steps": ["承認認識與生活脫節", "默想神的主權、憐憫與愛", "讓真理穿透受綑綁之處"], "do": ["面對試探時問：我所認識的神是怎樣的？", "找人一起禱告、彼此守望"]}, "gold": ["問題不是不知道規則，而是活得像不認識神。", "你所認識的神，已足以保守你。", "為何用片刻滿足，換掉永遠的喜樂？"], "ref": ["帖撒羅尼迦前書 4:3-5", "以弗所書 5:3-5", "希伯來書 12:4"], "fb": "回頭看那些年的戀愛和失敗，\n有三個字一直在他心裡響起：\n你明明知道。\n\n不是「你明明知道不該做」，雖然那也是真的；\n而是「你明明認識祂」。\n你看過神榮耀的光輝，嚐過十架流出的恩慈，\n聞過那使你從死裡復活的基督的香氣，\n聽過那比蜜甘甜、比精金寶貴的聲音。\n你認識祂。\n那為什麼，你的許多決定，卻像不認識祂一樣？\n\n保羅說：神的旨意就是要你們成為聖潔，遠避淫行；\n要你們各人曉得用聖潔、尊貴守著自己的身體，\n不放縱私慾的邪情，像那不認識神的外邦人。\n\n不認識神的人，在性上放縱，其實不令人意外。\n如果神不在畫面裡，性就和任何一個偶像一樣，看起來值得追求。\n它最終一定會讓人失望，\n但若你不相信耶穌，不相信罪、天堂與地獄，\n你只相信「現在」——那就盡量享受吧，直到再也無法悔改。\n\n可是在基督裡，我們知道得更多。\n我們知道，罪、死亡與地獄，和頭上的屋頂、這個月的帳單一樣真實。\n我們活在一位真實的創造者、真實的審判者面前，\n祂知道我們每一個念頭和每一個動作。\n我們也知道，基督為了救我們脫離罪，戴上荊棘冠冕、被釘在十架、承受神的忿怒。\n\n神創造了我們，也發明了性——\n我們為什麼要假裝比祂更懂？\n神警告性罪會帶來痛苦、羞恥、捆綁與審判——\n我們為什麼要為一點點眼前的快樂冒這麼大的險？\n神用祂兒子的血，買回我們的赦免、自由和純潔——\n我們為什麼要在祂肩上堆更多的罪，把釘子釘得更深？\n神張開雙臂，邀請我們進入一場永不結束的平安與快樂——\n我們為什麼要拿它去換幾秒鐘的滿足？\n\n可悲的是，有時我們還是換了。\n他坦承：我知道性罪是什麼、會帶來什麼，我還是跌倒了。\n不是因為我知道得不夠，\n而是因為我還沒有用足夠的嚴肅和喜樂，去看待我所知道的。\n\n保羅的意思是：你對神的認識，已經足以保守你。\n如果你在試探中一再失敗，原因可能很多，\n但最重要的一個是：你對神的認識，還沒有穿透你被捆綁的那個部分。\n\n  ["婚前與擇偶", "福音與奧祕"], "core": "婚禮誓詞不是宣告現在的愛，而是承諾將來的愛；這麼大的承諾，只能建立在神更大的應許上。", "sum": ["新人站在未知之地，立下超越自己的誓言：擁有與珍惜、無論好壞、相愛珍惜、至死不渝。", "這些承諾不能建立在年輕的愛、統計數字或毅力上，只能建立在神的信實上。", "「我娶你」：離開與連合，成為基督與教會奧祕的管家；丈夫以基督的喜悅接納她，妻子以撒拉的女兒的信心跟隨。", "「無論好壞」：婚姻不是為了展現容易的愛，而是效法最昂貴的愛；放棄擁有夢想婚姻的權利。", "「相愛珍惜」：丈夫永遠在加略山的愛中學習。"], "mm": {"c": "婚禮誓詞", "b": [["誓言根基", ["未知之地", "神更大的應許"]], ["擁有與珍惜", ["離開與連合", "基督與教會"]], ["無論好壞", ["效法昂貴的愛", "不設條件"]], ["相愛珍惜", ["加略山的愛", "持續一生"]]]}, "fw": {"q": "結婚誓詞要建立在什麼上面？", "a": "建立在神的信實，而非自己的感覺或能力", "steps": ["明白誓詞是對未來的承諾", "每一句誓詞都對應神更大的應許", "放下條件，以基督的愛去愛"], "do": ["紀念日重讀誓詞並一起禱告", "寫下神在婚姻中的信實見證"]}, "gold": ["我們今天不是說「我愛你」，而是承諾「我會愛你」。", "婚姻不是為了展現容易的愛。", "即使愛結成冰，也不跑去別的火堆取暖。"], "ref": ["創世記 2:24", "哈巴谷書 3:17-18", "以弗所書 5:25-32"], "fb": "婚禮現場，音樂停了，所有人安靜下來。\n他握著她的手，說出那幾句老得不能再老的話：\n我娶你，無論好壞、貧富、疾病健康，愛你、珍惜你，直到死亡將我們分開。\n\n很少有人注意到，那一刻，他們其實站在一片完全陌生的土地邊緣。\n沒有人知道接下來會走過高山還是幽谷，\n他們卻許下了比自己還大的承諾。\n\n我們以為，婚禮是在宣告「我愛你」；\n其實，婚禮是在承諾「我會愛你」。\n前者是此刻的感覺，後者是未來的方向；\n前者靠心跳，後者靠信實。\n\n這麼大的承諾，靠什麼撐得住？\n不能靠年輕的愛，它太輕；\n不能靠統計數字，它太冷；\n不能靠自己的毅力，它太脆。\n只能靠神。\n這片對我們陌生的土地，對祂一點也不陌生；\n我們每許下一個承諾，祂都已先許下一個更大的。\n\n「擁有與珍惜」——\n從今天起，雙手不再空著。\n他用獨立換來連合，她在他身旁找到自己的位置。\n他們接下的，不只是彼此，還有一份託付：\n要在家中，演出基督與教會那更大的愛情。\n\n「無論好壞」——\n今天站在這裡，沒有人知道「壞」會長什麼樣子。\n也許是空蕩的搖籃，也許是見底的存款，\n也許是疾病讓青春枯萎，也許是年老讓記憶消失。\n神沒有設計婚姻來展示一種容易的愛，\n而是要它模仿那最昂貴的愛——\n那位穿過痛苦、貧窮與死亡，去尋找、拯救祂新婦的愛。\n所以在這一天，他們放棄了「擁有夢想婚姻」的權利，\n拒絕只在對方可愛時才愛，\n刪去誓言後面所有可能附加的「如果」。\n\n就算苦難的冬天讓愛結成冰，\n他們也不會跑去別人的火堆取暖；\n他們會坐在寒冷裡，手牽手，一遍遍複述神的應許，\n直到從那團火裡，得到足夠的溫度，繼續相愛。\n\n「相愛珍惜」——\n丈夫要愛妻子，正如基督愛教會，為她捨己。\n這是一所丈夫永遠畢不了業的學校：各各他的愛。\n\n你還記得你說過的那幾句話嗎？\n那些話，現在對你來說，是一段美好的回憶，還是一個每天的選擇？\n\n願每一位站在祭壇前的新人，\n也願每一對已經走了很久的夫妻，\n都記得：我們不是靠自己守住誓言，\n而是被那位更信實的神，守在誓言裡。\n\n#婚禮 #結婚誓詞 #無論好壞 #盟約 #新婚"}, "lift-her-chin-with-love": {"zh": "用愛抬起她的下巴", "tags": ["給丈夫", "溝通與親密"], "core": "在追求完美外貌的文化中，丈夫要像雅歌中的新郎，在妻子最擔心不美的地方，真誠地欣賞她。", "sum": ["妻子手術後臉頰腫脹，請作者不要看她；這讓作者想起雅歌中女子說「不要因我黑就看我」。", "色情化的文化設下不可能的美的標準：女人不能老、不能胖、不能有病痛。", "許多神的女兒在心裡對男人說：「不要看我。」", "雅歌中的新郎一再稱讚「你甚美麗」，在她害怕不美的地方喜悅她。", "丈夫不是要奉承，而是成為世上最好的愛人：從臥室到病房、到葬禮，都以她為美。"], "mm": {"c": "抬起她的下巴", "b": [["妻子的不安", ["不要看我", "雅歌1:6"]], ["文化壓力", ["色情化標準", "不能老不能胖"]], ["新郎的回應", ["一再稱讚她美", "在弱處喜悅"]], ["丈夫的呼召", ["不是奉承", "一生的愛人"]]]}, "fw": {"q": "妻子覺得自己不夠美時，丈夫該怎麼做？", "a": "像雅歌的新郎，真誠地稱讚並喜悅她", "steps": ["拒絕世界的美貌標準", "遠離色情與貶低女性的慾念", "在她害怕之處表達欣賞"], "do": ["今天具體稱讚她一個她沒自信的地方", "在別人面前也讚美她"]}, "gold": ["丈夫的眼睛，是妻子的鏡子。", "在她害怕不美的地方，正是你表達喜悅的地方。", "愛她，從臥室一直延伸到病房。"], "ref": ["雅歌 1:6-15", "雅歌 4:1-9", "箴言 5:19"], "fb": "她剛動完口腔手術，穿著睡衣，頭髮沒整理，\n兩頰腫得像各塞了一顆網球。\n她坐在那裡，看著丈夫，想知道一件事：\n他還覺得我好看嗎？\n然後，不等他回答，她就說：「你不要看我。」\n\n這句話，讓他想了好幾個小時。\n好熟悉，在哪裡聽過？\n在雅歌裡。那個在葡萄園裡被曬黑的女子說：\n不要因日頭把我曬黑了，就輕看我。\n\n她不是穿著繡花長袍的公主，\n她用手工作，流汗，指甲縫裡有泥土；\n她看守別人的葡萄園，自己的那一園，卻沒空照顧。\n當她的王子找到她，她第一句話是：別看我。\n\n今天的世界，是一個被修圖修壞的世界。\n美的標準被數位加工、被專業打造，\n高到只有願意挨餓、打針、修圖、脫衣的人才搆得到。\n女人不能老，不能胖，不能生病，不能生太多孩子，\n不能在田裡工作，不能被看見術後的樣子，\n不能把白髮當成榮耀的冠冕。\n她們的美必須永不凋謝，像塑膠一樣。\n\n於是，太多神的女兒在心裡對男人說：\n不要看我。\n\n我們以為，男人只要不嫌棄就夠了；\n其實，男人被呼召去做更多——\n在她最害怕不美的地方，真誠地欣賞她。\n\n雅歌裡的新郎，就是這樣做的。\n他托起她低垂的下巴，看著她被曬黑的皮膚，\n說：讓我看見你的面容，聽見你的聲音，因為你的聲音柔和，你的面貌秀美。\n他不只說一次「我的佳偶，你甚美麗」，\n而是一次、又一次、再一次。\n\n每當鏡子多照出一道皺紋、一處下垂、一道疤痕，\n每當她又說「不要看我，因為……」，\n她的丈夫就認真地糾正她：\n你全然美麗，毫無瑕疵。\n他像一位懂畫的人，在盟約裡被託付了一幅傑作，一生細細欣賞。\n\n這不只是婚禮那天的丈夫，\n也是推著她走向化療病房的丈夫，\n是對著年邁、耳背的她，仍說「你奪了我的心」的丈夫。\n\n基督徒丈夫不是被呼召去奉承，\n而是被呼召成為世上最好的愛人——\n他的愛，從臥室延伸到病房、到禮拜堂、到孩子的球場，\n一直延伸到殯儀館。\n\n丈夫們，你的眼睛，是她的鏡子。\n今天，她在你眼中，看見的是什麼？\n\n願你成為那個托起她下巴的人。\n當世界對她說「你不夠好」，\n你用一生的眼神告訴她：\n在我眼中，你一直都是最美的那一位。\n\n#婚姻 #丈夫 #雅歌 #美麗 #欣賞妻子"}, "a-marriage-made-in-hell": {"zh": "地獄裡配成的婚姻（魔鬼書信）", "tags": ["順服與帶領", "福音與奧祕"], "core": "以魔鬼書信諷刺：撒但最恨婚姻述說基督與教會，所以要讓夫妻角色變得「功能相同」，使婚姻失去它的戲劇。", "sum": ["老魔鬼驚恐地說：婚姻的終極目的是神自己要娶祂的子民，丈夫扮演基督，妻子代表新婦。", "撒但的策略：推動「同功能婚姻」——不同性別，卻完全相同地帶領與跟隨。", "角色可以互換，羅密歐與茱麗葉就變成茱麗葉與茱麗葉。", "例子：強勢主導的妻子 Monique，與樂於坐副駕駛、逃避責任的丈夫 Alex。", "旁人看不到愛妻捨己的丈夫，也看不到敬重跟隨並在愛中綻放的妻子——看不到神的劇本。"], "mm": {"c": "撒但的劇本", "b": [["撒但的恐懼", ["神要娶人", "婚姻述說福音"]], ["同功能婚姻", ["都帶領都跟隨", "角色可互換"]], ["實例", ["強勢的妻子", "被動的丈夫"]], ["失去的見證", ["捨己的丈夫", "敬重的妻子"]]]}, "fw": {"q": "夫妻角色完全一樣有什麼問題？", "a": "婚姻將無法演出基督與教會的故事", "steps": ["明白婚姻是神的戲劇", "辨識角色互換或逃避的傾向", "各自按神的呼召扮演角色"], "do": ["丈夫：在一個家庭決定上主動承擔", "妻子：思考如何敬重並成全丈夫的帶領"]}, "gold": ["撒但最恨婚姻，因為它在講基督的故事。", "角色一旦可以互換，戲就不再是原本那齣戲。", "丈夫坐副駕駛很舒服——但那不是他的位置。"], "ref": ["以弗所書 5:22-33", "加拉太書 3:28"], "fb": "如果地獄裡有一位老魔鬼，寫信給牠的小徒弟，\n教牠怎麼破壞一對基督徒夫妻，\n牠會怎麼說？\n\n牠也許會先抱怨：你怎麼還沒開始扭曲他對婚姻的想法？\n你難道不知道，只要一個人照著神的設計生活，就可能讓我們失去好多靈魂嗎？\n\n然後牠會透露一個讓地獄最驚恐的秘密：\n婚姻最終不是關於兩個人彼此的愛。\n那位神從一開始就打算——親自娶這些人。\n每一段婚姻，丈夫扮演那位新郎，妻子扮演祂的新婦；\n神藉著兩個平凡的人，一次又一次重演祂那不可思議的愛與犧牲。\n\n所以，老魔鬼說：既然婚姻是一齣戲，我們就改劇本。\n\n牠不一定要鼓吹某些極端的東西，\n牠有一個更溫和、更好用的版本，可以叫作「同功能婚姻」：\n男女依然結婚，但兩個人的角色完全一樣。\n都帶領，也都跟隨；負擔一樣多，犧牲一樣多，\n在神面前，對彼此負一模一樣的責任。\n\n讓演員互相學對方的台詞、交換對方的戲服，\n觀眾看到的就不是另一個版本，而是另一齣戲。\n羅密歐與茱麗葉，變成茱麗葉與茱麗葉。\n可以互換，完全可以互換。\n\n可是，五十比五十很難撐久，總要有人打破平手。\n於是，劇情就這樣發展：\n她在職場上叱吒風雲，扛起全家，不願被稱為幫助者，一談到順服就皺眉；\n他則越來越少表達意見，發現讓太太開車，自己就不會被怪罪開進水溝。\n副駕駛座比較舒服，可以躺平，比較少犧牲，比較多睡覺；\n甚至還有人稱讚他「懂得捨己」。\n\n老魔鬼得意地說：觀眾看到了什麼？\n沒有看到一個丈夫主動地、持續地為妻子捨己；\n也沒有看到一個妻子歡喜地敬重丈夫，在他的愛與帶領中綻放。\n他們什麼都沒看到——沒看到那位神的劇本。\n\n讀到這裡，你會不會有點坐立不安？\n你們家，是哪一齣戲？\n\n當然，撒但的另一種戲碼，是讓男人轄制、貶低、虐待；\n那是牠早就用慣的招數。\n而「同功能婚姻」比較隱微——它不流血，還能得到掌聲。\n\n轄制的丈夫毀了劇本，缺席的丈夫也毀了劇本；\n奪權的妻子改了劇本，被踐踏的妻子也看不見劇本。\n真正的劇本，是捨己的帶領與甘心的回應，\n是一位新郎，和一位被愛到發光的新婦。\n\n撒但最恨婚姻，因為它在講基督的故事。\n所以，也許最有力的屬靈爭戰，\n不是在遠方，而是在今天晚上，\n在你們家客廳裡，\n照著神的劇本，好好演出一場愛。\n\n#婚姻 #屬靈爭戰 #夫妻角色 #以弗所書5章 #魔鬼書信"}, "teach-them-about-marriage-before-the-world-does": {"zh": "在世界之前，先教孩子認識婚姻", "tags": ["婚姻使命"], "core": "世界正積極重新定義婚姻；父母要及早用聖經的故事，讓孩子看見婚姻是福音的奇妙圖畫。", "sum": ["孩子身邊有很多已婚的人，卻不知道婚姻是福音的奇蹟。", "世界說婚姻是人發明的，可以隨意改造，並以新的性與家庭觀念影響孩子。", "從伊甸園講起：神看見亞當需要一位與他相似又不同的人，親自把夏娃帶給他。", "在孩子面前珍惜配偶、表達感情、善待對方；帶孩子參加婚禮並討論誓言。", "用兩顆黏在一起的紙心說明「一體」；溫柔地談離婚；清楚說明國家法律不一定等於神的律法。"], "mm": {"c": "教孩子認識婚姻", "b": [["世界的聲音", ["人發明婚姻", "可隨意改造"]], ["講述故事", ["伊甸園", "神親自主婚"]], ["活出榜樣", ["珍惜配偶", "表達感情"]], ["困難話題", ["離婚", "同性婚姻與法律"]]]}, "fw": {"q": "父母如何教導孩子聖經的婚姻觀？", "a": "及早講述神的故事，並在家中活出來", "steps": ["分辨世界與神的兩種觀點", "從創世記講婚姻的起源與目的", "在日常中示範並討論困難議題"], "do": ["和孩子一起看結婚照並分享感恩", "做「兩顆紙心」的小實驗"]}, "gold": ["孩子看過很多婚姻，卻不知道婚姻是奇蹟。", "神眼中不再是兩個「我」，而是一個「我們」。", "聖經的婚姻，是那場偉大愛情的小小縮影。"], "ref": ["創世記 2", "馬太福音 19:4-6", "馬可福音 10:2-5"], "fb": "你的孩子，身邊有很多已婚的人：\n爸爸媽媽、爺爺奶奶、叔叔阿姨、鄰居、老師。\n對他們來說，婚姻一點也不稀奇。\n他們不知道，婚姻其實是福音的奇蹟。\n\n世界告訴孩子：婚姻是人類自己發明的，所以可以隨意改造。\n它也正積極地，用一套新的婚姻觀、性別觀、幸福觀，浸泡我們的孩子。\n\n如果我們不先教，世界就會先教。\n\n我們以為，孩子長大自然會懂婚姻；\n其實，孩子會照著他們最常聽到的故事長大。\n我們以為，這些話題等他們大一點再說；\n其實，在他們還小的時候，世界已經開始說了。\n\n那麼，父母可以怎麼開始？\n\n講一個故事。\n從伊甸園講起：\n在那個美麗的花園裡，有很多動物陪著亞當，\n可是神知道，亞當需要一個像他、又和他不一樣的人。\n於是神用一種很特別的方式造了第一個女人——從亞當的身體裡造出來。\n然後，神就像第一場婚禮裡新娘的父親，親自把她帶到亞當面前。\n今天人們還在結婚，就是因為這件事：\n婚姻，是神很棒很棒的主意。\n\n活出一個樣子。\n讓孩子看見，你多珍惜你的配偶；\n讓他們常聽見你為婚姻感恩，看見你們彼此表達感情，\n聽見你溫柔地對配偶說話，也溫柔地談論配偶。\n給他們看你們的結婚照，讓他們看見你們每年慶祝紀念日的喜樂；\n等他們大一點，帶他們參加婚禮，一起討論新人在神面前許下的誓言。\n\n用一個簡單的實驗。\n剪兩顆大大的紙愛心，代表兩個相愛、結婚的人，\n把它們黏在一起，放一個晚上。\n第二天，試著把它們分開。\n孩子會看見：要分開，兩顆心都會受傷。\n神看結婚的人，不再是兩個「我」，而是一個「我們」。\n\n也要溫柔地談困難的話題。\n談離婚時，用最溫柔的話——人心剛硬時，會傷害最該愛的人，\n而神會特別看顧那些受傷的人。\n談到不同的婚姻定義時，要謹慎而清楚：\n我們剛出生時不知道什麼會讓我們真正快樂，但神知道，祂在聖經裡告訴我們。\n國家的法律不一定等於神的話，而神的話是世上最重要的。\n\n今晚睡前，\n也許你可以不只講一個童話故事，\n而是講那個最古老、最真實的愛情故事——\n從伊甸園開始，\n一路講到那場永遠的婚筵。\n\n因為聖經裡的婚姻，\n是那場偉大愛情的小小縮影，\n而你們的家，\n就是孩子第一個看見它的地方。\n\n#家庭教育 #婚姻 #親子 #創世記 #父母"}, "what-is-the-mystery-of-marriage": {"zh": "婚姻的奧祕是什麼？", "tags": ["福音與奧祕"], "core": "以弗所書5:32的「奧祕」不是難以理解的浪漫謎團，而是如今已被揭開的真理：婚姻指向基督與教會。", "sum": ["箴言30章讚嘆男女之間的愛難以測度；婚姻確實有奇妙之處。", "但新約的「奧祕」通常指：過去隱藏、如今在基督裡已被揭示的真理。", "保羅說福音就是那歷代隱藏、如今顯明的奧祕；他的職分就是把奧祕公開。", "以弗所書5:32的意思不是「太深奧無法理解」，而是「我現在告訴你：這是指基督與教會」。", "千百年來人們嫁娶卻不知為何；如今答案揭曉：人間婚姻指向神人基督與祂的新婦。"], "mm": {"c": "婚姻的奧祕", "b": [["常見誤解", ["浪漫謎團", "難以言喻"]], ["新約用法", ["曾經隱藏", "如今顯明"]], ["以弗所書", ["福音的奧祕", "保羅的職分"]], ["答案", ["基督與教會", "婚姻的真正理由"]]]}, "fw": {"q": "「這是極大的奧祕」是什麼意思？", "a": "婚姻的真正意義已被揭示：指向基督與教會", "steps": ["分辨日常與聖經中「奧祕」的意思", "看保羅如何使用這個詞", "把婚姻理解為已被公開的福音圖畫"], "do": ["讀以弗所書1、3、5章中的「奧祕」", "在婚姻中刻意活出這幅圖畫"]}, "gold": ["奧祕不是要守住的秘密，而是要說出來的真理。", "千百年來人們結婚，卻不知道真正的原因。", "人間的婚姻，指向那位神人和祂的新婦。"], "ref": ["以弗所書 5:32", "箴言 30:18-19", "歌羅西書 1:26-27"], "fb": "婚禮上，新娘走進來的那一刻，全場都安靜了。\n有人紅了眼眶，有人說不出話。\n大家都感覺到一種美，卻說不清楚那是什麼。\n我們常把這叫作「婚姻的奧祕」。\n\n箴言的作者也曾讚嘆：鷹在空中飛的道、蛇在磐石上爬的道、船在海中行的道、男與女交合的道，\n這四件事，我都不明白。\n愛情確實有它說不清的地方。\n\n可是，當保羅在以弗所書說「這是極大的奧祕」時，\n他指的，並不是那份說不清。\n\n今天我們說「奧祕」，常常是指一個解不開的謎；\n新約說「奧祕」，卻常常是指一個曾經被藏起來、如今被打開的秘密。\n前者讓人停在門外讚嘆，後者邀請人走進門內明白。\n前者說「你不必懂」，後者說「現在你可以懂了」。\n\n保羅一生的工作，就是把這個秘密說出來。\n他說，神歷世歷代所隱藏的旨意，如今在基督裡顯明了；\n他求人為他禱告，好讓他放膽講明福音的奧祕。\n奧祕不是要守住的秘密，而是要被傳開的好消息。\n\n所以，當他談到婚姻，說「這是極大的奧祕」，\n下一句馬上揭曉謎底：「但我是指著基督和教會說的。」\n\n想想看：\n幾千年來，世界各地的人都在結婚。\n不同的文化、不同的語言、不同的宗教，\n卻都感覺到一股奇怪的拉力——不只是想要後代，而是想要承諾、想要一生一世。\n連神的子民，雖然有神的話，也不完全明白為什麼。\n\n為什麼一男一女要離開父母、彼此連合？\n為什麼人心裡總渴望一份不離不棄的愛？\n為什麼背叛會那麼痛，忠誠會那麼美？\n\n答案終於被說出來了：\n因為從起初，神就照著祂兒子與教會的關係，設計了婚姻。\n地上的每一場婚禮，都是天上那場婚禮的預告。\n\n這改變了什麼？\n它讓婚姻從一段私人的感情，變成一篇公開的講章；\n讓平凡的洗碗、爭吵、和好、守候，都有了永恆的分量；\n讓丈夫的捨己，指向那位在十架上捨命的新郎；\n讓妻子的回應，指向那個被愛到發光的教會。\n\n你們的婚姻，正在向別人訴說一個怎樣的故事？\n是一個令人費解的謎，還是一個讓人看見基督的答案？\n\n奧祕已經被打開了。\n現在，輪到我們用一生，\n把它活出來給世界看。\n\n#婚姻 #奧祕 #以弗所書5章 #基督與教會 #福音"}, "my-marriage-will-end-when-life-begins": {"zh": "當生命開始時，我的婚姻將結束", "tags": ["苦難與死亡", "福音與奧祕"], "core": "作者夫妻在結婚三十週年那天走進墓園，深深體會婚姻的短暫；它是那更永久婚姻的比喻。", "sum": ["作者與妻子在三十週年紀念日，意外地在墓園度過最有意義的時光。", "他們探望二十年前過世的好友，看著無數刻著夫妻名字的墓碑。", "他們感受到婚姻雖美，卻是暫時的，是將來與新郎基督聯合的比喻。", "傳道書說：往遭喪的家去，強如往宴樂的家去；智慧人把結局放在心上。", "三天後他們的第一個孫子出生；在哀哭之後，他們能從更深的喜樂中歡笑。"], "mm": {"c": "墓園與婚姻", "b": [["意外的紀念日", ["走進墓園", "探望老友"]], ["領悟", ["婚姻是暫時的", "永久婚姻的比喻"]], ["傳道書", ["遭喪之家", "把結局放心上"]], ["喜樂", ["孫子出生", "哀哭後的歡笑"]]]}, "fw": {"q": "思想死亡對婚姻有什麼益處？", "a": "讓我們珍惜現在，並仰望真正的開始", "steps": ["面對婚姻終將結束的事實", "把婚姻看作永恆聯合的影子", "在盼望中更深地喜樂"], "do": ["和配偶談談你們對天家的盼望", "在紀念日一起感謝神的信實"]}, "gold": ["剛哭過的人，能從更深的井裡笑出來。", "婚姻再美，也只是更永久之事的比喻。", "智慧人把結局放在心上，也望向結局之後真正的開始。"], "ref": ["傳道書 7:2-3", "傳道書 3:1-11", "帖撒羅尼迦前書 4:13"], "fb": "結婚三十週年那天，他們本來要去兒子工作的咖啡店。\n經過一座墓園時，她說：我們進去看看吧。\n\n他們找到一位老朋友的墓。\n他三十七歲就走了，如今已經離開二十年。\n那個聲音宏亮、愛開玩笑、熱愛福音的朋友，\n一轉眼，已經是一整個世代以前的人了。\n\n他們在草地上慢慢走。\n一塊又一塊的石碑，刻著名字和年份；\n每一塊石頭底下，都曾經是一個活生生的故事——\n美麗的、痛苦的、複雜的、永恆的。\n他們注意到，好多石碑上，刻著的是夫妻兩個人的名字。\n\n那天，在墓園裡，他們第一次那麼清楚地感受到：\n我們的婚姻，有一天也會結束。\n\n我們以為，紀念日應該去最熱鬧的地方慶祝；\n其實，有時最好的慶祝，是去最安靜的地方記念。\n我們以為，想到死亡會讓愛情變得悲傷；\n其實，想到死亡會讓愛情變得清醒。\n\n傳道書說：往遭喪的家去，強如往宴樂的家去；\n因為死是眾人的結局，活人也必將這事放在心上。\n智慧人不是不去宴樂，而是先學會哀哭，\n先把結局放在心上，再望向結局之後。\n\n婚姻很美，卻是暫時的。\n它是一個比喻，指向一個更長久、更美麗的聯合——\n我們與新郎基督，永遠的聯合。\n地上的婚姻在死亡時結束，\n天上的婚姻在那一刻，才真正開始。\n\n三天後，他們的第一個孫子出生了。\n剛從墓園回來的他們，走進了另一個家——一個宴樂的家。\n奇妙的是，那份在墓前流過淚的心，\n讓他們在嬰兒床邊，笑得更深。\n\n剛哭過的人，能從更深的井裡笑出來。\n\n你的婚姻，現在正在第幾年？\n你有沒有想過，總有一天，你們之中會有一個人先走？\n如果想到這裡，你會想現在就對他說什麼？\n\n不要等到墓前，才說出那些話。\n不要等到失去，才發現每一個平凡的日子都是禮物。\n也不要以為，死亡會是故事的最後一句。\n\n因為對屬基督的人來說，\n當地上的婚姻走到盡頭，\n不是燈熄了，\n而是門開了——\n那時，我們會一起看見，\n這一生所有的愛，原來都只是序曲。\n\n#婚姻 #結婚紀念日 #傳道書 #死亡與盼望 #永恆"}, "married-to-weakness": {"zh": "與軟弱結為夫妻", "tags": ["苦難與死亡"], "core": "慢性病長期考驗婚姻；夫妻可以選擇苦毒封閉，或倚靠神的恩典，在苦難中更深地愛主也愛彼此。", "sum": ["一位丈夫在妻子確診阿茲海默症後禱告：若神不醫治她，就在我身上行屬靈的神蹟，使我愛她到底。", "作者婚後不久就被慢性疼痛與疾病纏身，十四年來丈夫一直陪伴。", "受苦者在逃離痛苦與安息於神之間拉扯；配偶則承擔更多責任、哀悼失去、感到無助。", "約伯的妻子在極度悲傷中勸丈夫棄掉神；約伯溫柔卻堅定地指出她的錯誤。", "不要向內退縮、不要彼此對立；先把需要帶到神面前，再與配偶一起面對。"], "mm": {"c": "慢性病中的婚姻", "b": [["榜樣", ["麥奎肯的禱告", "愛她到底"]], ["雙方的苦", ["受苦者的拉扯", "配偶的負擔"]], ["約伯夫婦", ["妻子的絕望", "約伯的溫柔"]], ["出路", ["先到神面前", "一起面對"]]]}, "fw": {"q": "慢性病讓婚姻疲憊不堪，怎麼辦？", "a": "倚靠神的恩典，彼此同行而不對立", "steps": ["承認雙方都在受苦", "拒絕苦毒與封閉", "把需要先交給神，再與配偶溝通"], "do": ["為配偶的辛勞具體道謝", "一起找出可分擔的實際方式"]}, "gold": ["若你不醫治她，就在我身上行神蹟，讓我愛她到底。", "受苦的配偶直接痛，陪伴的配偶間接痛。", "我們不必只求生存，也能在苦難中更深地相愛。"], "ref": ["約伯記 1:21", "約伯記 2:9-10"], "fb": "「主啊，求你在我妻子身上行一個身體的神蹟；\n如果你不這樣做，就求你在我身上行一個屬靈的神蹟，\n讓我能好好愛她，直到最後。」\n這是一位丈夫，在妻子確診阿茲海默症後的禱告。\n\n一位長年患慢性病的妻子讀到這段話，心像被刺穿了。\n因為它碰到她心底最深的恐懼：\n我的丈夫，能愛我到最後嗎？\n如果有一天他覺得犧牲太大，我能怪他嗎？\n\n有些婚姻，是在健康中開始，在疾病中被試驗；\n有些婚姻，幾乎從一開始，就和疾病住在一起。\n\n受苦的那一方，每天在兩股力量之間拉扯：\n想逃離疼痛，又想學習安息在神的安排裡。\n陪伴的那一方，看似沒有直接的痛，\n卻扛著更多責任、哀悼著失去的日子，\n還有那種想幫忙卻幫不上的無力。\n\n受苦的人直接痛，陪伴的人間接痛；\n一個在身體裡痛，一個在心裡痛。\n若不小心，兩份痛會讓兩個人轉身背對彼此，\n各自築起高牆，以為只有自己最苦。\n\n約伯失去了一切，滿身毒瘡，坐在爐灰裡。\n他說：賞賜的是耶和華，收取的也是耶和華。\n他的妻子卻說：你棄掉神，死了吧。\n我們很容易責怪她。\n可是想想：她也失去了所有孩子、所有財產，\n現在還眼睜睜看著那個曾經堅強受人尊敬的丈夫，在痛苦中呻吟。\n她不是不愛，她是被悲傷淹沒了。\n\n約伯沒有罵她是愚頑的婦人，\n他說：妳說話，像愚頑的婦人一樣。\n他沒有攻擊她的人格，只是溫柔而堅定地指出她說錯了。\n\n所以，不論你是受苦的那一位，還是陪伴的那一位，\n都不必只求「撐過去」。\n先把需要帶到神面前，再和配偶好好談：\n這個病，我們要怎麼一起面對？\n受苦的人，不要以為自己只是對方的負擔；\n陪伴的人，不要以為自己的累不值得說。\n\n疾病可以奪走很多東西：體力、計畫、收入、夢想。\n但它奪不走一件事：兩個人選擇一起倚靠神。\n\n你們家，現在住著怎樣的軟弱？\n你們是轉身背對，還是轉身面對？\n\n也許神沒有行身體的神蹟。\n但願祂行另一個神蹟——\n讓兩個軟弱的人，\n在苦難裡，愛得比健康時更深。\n\n#婚姻 #慢性病 #苦難 #約伯記 #陪伴"}, "nine-words-for-every-marriage": {"zh": "每段婚姻都需要的九個字", "tags": ["衝突與修復"], "core": "婚姻是每天操練悔改與饒恕；三句話——「我錯了」「對不起」「請原諒我」——是福音在婚姻中的實踐。", "sum": ["作者希望兒女在結婚前，能真心說出三句話（英文共九個字）。", "「我錯了」：驕傲最討厭這句話；但聖經清楚說我們會犯錯，在基督裡不定罪，所以能坦然認錯。", "衝突時本能地強調自己無辜、誇大對方的錯；自義只會讓傷害變成怒火。", "「對不起」：要為傷害真心憂傷，像大衛在詩篇51篇的哀求；淺薄的道歉帶來薄弱的饒恕。", "「請原諒我」：請求對方有勇氣恢復關係，這不是小事。"], "mm": {"c": "三句話", "b": [["我錯了", ["治死驕傲", "在基督裡不定罪"]], ["對不起", ["真心憂傷", "詩篇51篇"]], ["請原諒我", ["請求恢復", "不是小事"]], ["核心", ["每日悔改", "指向救主"]]]}, "fw": {"q": "夫妻如何真正和好？", "a": "誠實地認錯、憂傷、請求饒恕", "steps": ["承認：我錯了", "表達：我為傷害你感到難過", "請求：請原諒我"], "do": ["下次衝突後完整說出這三句話", "不要在道歉時加上「但是」"]}, "gold": ["婚姻是每天操練悔改與饒恕。", "自義不是藥膏，而是火上加油。", "淺薄的道歉，常帶來失敗的饒恕。"], "ref": ["羅馬書 8:1", "詩篇 51:1-3", "約翰一書 1:8"], "fb": "有一位父親說：\n將來我的孩子帶著他想結婚的人來見我，\n在我給祝福之前，我想先確定一件事——\n他們能不能真心說出三句話：\n「我錯了。」\n「對不起。」\n「請原諒我。」\n\n不是學歷，不是收入，不是家世，\n而是這三句話。\n\n因為婚姻，是每天操練悔改與饒恕的地方。\n沒有人能成為完美的配偶；\n我是罪人，我的罪一定會傷到身邊的人。\n但在不完美中，我們可以一直指向那位完美的救主。\n\n「我錯了。」\n驕傲最討厭這句話。\n每個字都卡在喉嚨裡，因為說出來，好像會毀掉我的形象、\n動搖我從表現裡得到的價值、讓我不再像個專家。\n可是聖經最清楚的一件事，不就是我們會犯錯嗎？\n而聖經另一件最清楚的事，是神的赦免。\n在基督裡沒有定罪，所以我們終於可以，不找藉口地承認：我錯了。\n\n衝突時，我們的本能是：放大對方的錯，縮小自己的錯。\n自義像一劑止痛藥，其實是一桶汽油。\n\n「對不起。」\n承認錯誤，是對自我的死；\n為傷害憂傷，是對心的觸碰。\n如果我說「我錯了」，臉上卻沒有一點難過，\n對方很難相信我，也很難饒恕我。\n大衛犯罪後，不只承認，他哀求：求你按你的慈愛憐恤我，洗除我的罪。\n真正的道歉，不必表演，不必乞求，\n但要讓對方知道：我看見我傷了你，我真的很難過。\n淺薄的道歉，常帶來失敗的饒恕。\n\n「請原諒我。」\n這是把主動權交出去的一句話。\n我傷了你，現在我請求你，有勇氣重新恢復我們之間的關係。\n這不是一個小請求，因為它承認：我需要你的恩典。\n\n「我錯了」拆掉驕傲，\n「對不起」打開心門，\n「請原諒我」把雙手伸出去。\n三句話，一層一層，從頭腦、到心、到關係。\n\n你上一次完整地說出這三句話，是什麼時候？\n還是你常常說了一半，後面再加上一句「可是你也……」？\n\n這三句話不會讓你變小，\n反而會讓你的婚姻變大——\n大到容得下兩個罪人的軟弱，\n也大到裝得下，一位救主的恩典。\n\n#婚姻 #道歉 #饒恕 #悔改 #溝通"}, "restore-the-sweetness-to-your-marriage": {"zh": "讓婚姻重拾甜蜜", "tags": ["溝通與親密"], "core": "忙碌會讓配偶變成生產力夥伴；要刻意放慢，用注意、服事、感謝與兩人時光，重新增添甜蜜。", "sum": ["忙碌的生活讓夫妻只剩分工合作，晚上累得只想睡覺。", "我們常用完成任務表達犧牲的愛，卻缺少溫柔。", "婚姻是基督愛教會的比喻；守護心中的火，愛的溫暖才能擴及他人。", "注意對方：配偶進門時放下手機，熱情問候。", "服事對方、說謝謝、安排沒有干擾的兩人時間；不要計分，要以對方為重。"], "mm": {"c": "重拾甜蜜", "b": [["問題", ["只剩分工", "疲累忽略"]], ["為什麼", ["福音的比喻", "愛向外擴散"]], ["四個做法", ["注意對方", "服事對方"]], ["更多做法", ["說謝謝", "兩人時光"]]]}, "fw": {"q": "婚姻變得只剩分工，怎麼辦？", "a": "刻意放慢，在日常中加入溫柔", "steps": ["看見對方、熱情回應", "主動問如何服事他", "表達感謝並安排相處時間"], "do": ["配偶回家時先放下手機擁抱他", "這週寫一張感謝卡給配偶"]}, "gold": ["別讓配偶變成你的生產力夥伴。", "守護心中的火，愛的溫暖才能擴散出去。", "計分只會帶來失望和挫折。"], "ref": ["以弗所書 5", "腓立比書 2:3-4", "歌羅西書 3:15-17"], "fb": "早上七點，廚房裡。\n「你今天接老大，我帶老二去上課。」\n「晚餐我來弄，功課你來看。」\n「好。」「好。」\n一天就這樣開始，也這樣結束。\n晚上躺下時，兩個人背對背，累到連晚安都懶得說。\n\n你們沒有吵架，也沒有冷戰，\n你們只是，變成了很有效率的工作夥伴。\n\n我們以為，愛就是把事情做好：洗衣、煮飯、繳帳單、接送孩子。\n這些當然是愛，而且是很實在的愛。\n可是，犧牲的愛常常比溫柔的愛來得容易。\n我們很會為對方「做事」，卻漸漸忘了怎麼「看見」對方。\n\n甜蜜不會自己留下來，\n它像一壺茶，不添熱水，就會慢慢涼掉。\n\n為什麼要在乎甜蜜？\n難道把孩子和待辦清單放在配偶前面，不是很自然嗎？\n可是婚姻不只是一個家庭的運作系統，\n它是基督喜悅教會的一幅圖畫。\n基督不只是「照顧」祂的新婦，祂喜悅她。\n有人說：要守護心中的火，愛的溫暖才能擴散到別人身上。\n一對冷掉的夫妻，很難讓孩子感受到溫暖的家。\n\n怎麼把甜蜜找回來？不需要什麼大工程，只需要一些很小的刻意。\n\n看見對方。\n他進門的時候，放下手機，抬頭看他一眼，說一句：「你回來了。」\n她說話的時候，停下手上的事，讓她知道：此刻，妳比螢幕重要。\n\n服事對方。\n不只是做自己分內的事，而是主動問：「今天我可以為你做什麼？」\n也許是幫他拿乾洗的衣服，也許是讓她早點休息，也許只是煮一道他愛吃的菜。\n小心那個陷阱——計分。\n「我做了這麼多，你做了多少？」\n計分只會換來失望與挫折；以對方為重，才會換來喜樂。\n\n說謝謝。\n我們心裡常常感謝，嘴巴卻很少說出來。\n他養家很辛苦，謝謝他；她放下自己的渴望照顧孩子，謝謝她。\n寫一張卡片，或是睡前輕輕說一句：「有你真好。」\n\n安排兩人時光。\n每週一次的約會也好，一段只有兩個人的散步也好。\n不刻意安排，時間就會被孩子的活動、工作和瑣事全部吞掉。\n\n效率讓家運轉，甜蜜讓家有溫度；\n分工讓日子過得下去，親密讓日子值得過下去。\n\n你們家，最近是比較像一間公司，還是比較像一個家？\n\n今晚，不必做什麼大事。\n只要在關燈前，轉過身來，\n看著他，說一句謝謝；\n握著她，說一聲晚安。\n甜蜜，往往就是從這麼小的一步，\n慢慢走回來的。\n\n#婚姻 #甜蜜 #夫妻相處 #感恩 #約會"}, "i-will-not-lie-with-you": {"zh": "我不與你同寢", "tags": ["外遇與試探", "性與親密"], "core": "約瑟拒絕波提乏之妻的引誘，靠的是被聖靈充滿的信念：信任寶貴、權柄是為服事、婚姻神聖、罪是得罪神。", "sum": ["抵擋性試探不只靠過濾軟體和問責夥伴，更靠聖靈所賜的信念，逐漸產生新的渴望。", "信念一：信任是寶貴而脆弱的；性罪會從各方面摧毀信任。", "信念二：權柄是為了服事，不是特權；約瑟拒絕濫用權位，甚至因此坐牢多年。", "信念三：婚姻是神聖的；約瑟比波提乏之妻更看重她的婚姻。", "最終：這是得罪神的大惡。"], "mm": {"c": "約瑟的信念", "b": [["信任", ["寶貴而脆弱", "性罪摧毀信任"]], ["權柄", ["為了服事", "不是特權"]], ["婚姻", ["神所配合", "神聖不可侵"]], ["神", ["得罪神的大惡", "敬畏神"]]]}, "fw": {"q": "如何在性試探中得勝？", "a": "讓聖經的信念在心中扎根", "steps": ["珍惜所得的信任", "把權柄當作服事的託付", "看重婚姻並敬畏神"], "do": ["寫下你最不願失去的信任關係", "默想創世記39章"]}, "gold": ["過濾軟體很重要，但贏得戰爭的是信念。", "權柄是服事的委任，不是滿足私慾的特權。", "最終，這是得罪神的事。"], "ref": ["創世記 39:1-10", "馬太福音 19:5-6"], "fb": "他被賣為奴，遠離家鄉。\n他忠心工作，主人把整個家都交給他管理。\n他年輕、英俊、能幹。\n然後，主人的妻子一天又一天對他說：與我同寢吧。\n\n沒有人會知道。沒有監視器，沒有問責夥伴，沒有過濾軟體。\n可是約瑟說：我怎能作這大惡，得罪神呢？\n\n今天，我們對抗性試探的方法，常常是外在的：\n裝軟體、設密碼、找人監督。\n這些都很好，是珍貴的兵器。\n可是它們打不贏整場戰爭。\n真正打贏的，是被聖靈點燃的信念——\n它們會一點一點，長出新的渴望。\n\n約瑟手上的聖經，比我們少得多，\n但他心裡有幾個堅定的信念。\n\n第一，信任是寶貴的，也是脆弱的。\n主人把一切都交給他了。\n他首先想到的不是會失去工作或金錢，\n而是會辜負一個人的信任。\n性的罪會從每個方向摧毀信任——配偶的、孩子的、教會的、同事的。\n你珍惜身上被託付的信任嗎？還是暗地裡願意拿它去換一時的滿足？\n\n第二，權柄是為了服事，不是為了特權。\n約瑟有很大的權力，也因此有很多機會。\n多少有才幹、有權勢的人，利用位置去佔別人的便宜。\n約瑟拒絕了，即使因此被誣陷、坐了好幾年的牢。\n權柄不是讓你取用的鑰匙，而是讓你守護的責任。\n\n第三，婚姻是神聖的。\n那個女人願意為了幾分鐘的歡愉，交出她的婚姻；\n約瑟卻比她更看重她的婚姻。\n因為他知道，是神把這一男一女配合在一起。\n\n最後，也是最根本的：這是得罪神。\n不只是傷害了人，更是在神面前作惡。\n\n外在的防線告訴你「不能」，\n內在的信念告訴你「不要」；\n軟體可以攔住手指，\n只有信念能攔住心。\n\n如果你一直在這場仗裡輸，\n也許不是因為你不夠努力，\n而是這些信念的種子，還沒有在你心裡扎根。\n\n求神讓它們扎得更深。\n在讀經時，在禱告時，在與神同行的每一天。\n\n有一天，當試探又在耳邊低語，\n你會發現自己不是咬著牙說「我不能」，\n而是平靜地說：「我不要。」\n因為你心裡，已經有一個比這一切更寶貴的東西——\n一份你不願辜負的信任，\n和一位你不願得罪的神。\n\n#性純潔 #約瑟 #試探 #創世記39章 #聖潔"}, "you-need-to-end-that-friendship": {"zh": "你需要結束那段友誼", "tags": ["外遇與試探", "給妻子"], "core": "與異性「屬靈好友」的親密交流，可能已是情感外遇的開始；罪是詭詐的，必須果斷切斷。", "sum": ["一位姊妹說她和某位弟兄只是朋友，談的都是信仰與事工，很造就人。", "但她的心事、靈命分享和寫作想法，都給了他，而不是丈夫。", "作者直言：你已經走在外遇的路上了；罪是詭詐的，會讓你以為自己能控制。", "罪甚至會利用你對基督的愛，引誘你走向不忠；求神鑒察你的心並赦免你。", "要徹底切斷：停止聯絡、封鎖對方；因為「心靈願意，肉體卻軟弱了」。"], "mm": {"c": "情感外遇", "b": [["處境", ["屬靈好友", "只是朋友？"]], ["警訊", ["分享給他不給丈夫", "被他的關注吸引"]], ["罪的詭詐", ["以為能控制", "利用屬靈話題"]], ["行動", ["徹底切斷", "封鎖聯繫"]]]}, "fw": {"q": "和異性的屬靈友誼有什麼危險？", "a": "它可能已在取代配偶的位置", "steps": ["誠實檢視：我把心給了誰？", "承認罪的詭詐與心的軟弱", "果斷結束聯繫"], "do": ["把那些對話改為與配偶分享", "請可信任的人陪你守望"]}, "gold": ["你說你離外遇很遠，其實已經在路上了。", "罪甚至會利用你對基督的愛。", "半套措施，只是把門留了一條縫。"], "ref": ["希伯來書 3:12-13", "箴言 4:23", "馬太福音 26:41"], "fb": "「我們只是朋友。」\n她說得很篤定。\n他們在一個基督教營會認識，一起服事，一起吃便當，聊的都是信仰。\n後來加了好友，從私訊到傳簡訊，現在偶爾通電話。\n「我們談家庭、談服事、分享靈修，他也會聽我分享寫作的想法。\n每次聊完，我都覺得被造就，更有力量走神要我走的路。」\n\n「那妳丈夫呢？他會聽妳分享寫作的想法嗎？」\n「他太忙了，我不介意。」\n「那你們夫妻會分享神最近教導你們什麼嗎？」\n「他工作很辛苦，沒時間。」\n\n親愛的，我知道妳說，外遇這個念頭讓妳反感，妳不可能走上那條路。\n可是，我要很溫柔、也很清楚地告訴妳：\n妳已經在那條路上了。\n\n我們以為，外遇是從一張床開始的；\n其實，外遇常常是從一段「很屬靈」的對話開始的。\n我們以為，危險的是不正經的人；\n其實，最危險的，常是那個讓妳覺得被懂、被看見的人。\n\n罪是詭詐的。\n它讓妳以為自己能掌控，能決定「到這裡就好，不會再往前」；\n它讓妳相信自己的動機很純粹：「我們只是談神的事啊。」\n它一邊誇讚這些對話有多造就人，一邊隱藏一個事實：\n妳的心，正在被他吸引。\n妳被他的時間和關注吸引，被你們共同的屬靈熱情吸引。\n罪甚至會利用妳對基督的愛，引誘妳走向不忠。\n\n誰是妳在情緒上依靠的人？\n誰是妳在屬靈上一起成長的人？\n如果答案不是妳的丈夫，那份「友誼」就已經在佔據他的位置了。\n\n心比萬物都詭詐，我們自己也測不透。\n但神知道。求祂鑒察妳的心，顯出每一個暗藏的渴望；\n求祂赦免，也求祂給妳力量，結束這段友誼。\n\n是的，結束。\n「一定要這麼極端嗎？」\n要的。每一則訊息都在加溫，每一次通話都在牽動情感，\n每一次在社群上看到他，都佔據妳的心思。\n只是「不回他訊息」還不夠，那等於把門留了一條縫。\n耶穌在談到試探時說：心靈固然願意，肉體卻軟弱了。\n\n所以，停止聯絡，封鎖他。\n然後，把那些本來說給他聽的話，試著說給丈夫聽；\n把那份屬靈的渴望，帶回家，帶到神面前。\n\n切斷一段友誼，會痛一陣子；\n保留一段危險，會痛一輩子。\n\n親愛的，這不是羞辱妳，\n而是有人愛妳，所以拉住妳。\n回頭吧，趁現在，\n趁那條路還沒有走得太遠。\n\n#婚姻 #情感外遇 #界線 #妻子 #保守你心"}, "i-still-seek-to-win-him": {"zh": "我仍盼望贏得他", "tags": ["給妻子", "苦難與死亡"], "core": "一位嫁給非信徒24年的妻子勉勵同路人：不要放棄，也不要妥協；神是信實的，並賜下以敬虔贏得丈夫的方法。", "sum": ["作者身處「即使」的婚姻：即使丈夫不信，仍要順服，以品行感化他。", "她明白獨自帶孩子上教會、在浴室偷偷禱告哭泣、在討好丈夫與基督之間拉扯的感受。", "神知道與不信者同負一軛的分裂之苦，但祂不讓我們絕望。", "真理一：神是信實的；回顧24年，看見神一直托住她。", "真理二：神賜下贏得丈夫的方法——不是外貌，而是敬虔的品行；目標不是快樂婚姻，而是堅忍奔跑信心的路。"], "mm": {"c": "嫁給不信者", "b": [["處境", ["獨自上教會", "偷偷禱告"]], ["神知道", ["同負一軛之苦", "不讓人絕望"]], ["神是信實的", ["回顧24年", "聖經的見證"]], ["贏得他", ["敬虔品行", "不放棄不妥協"]]]}, "fw": {"q": "丈夫不信主，妻子該如何堅持？", "a": "信靠神的信實，以敬虔品行贏得他", "steps": ["記念神過去的信實", "以順服和恩典對待丈夫", "以堅忍信心為目標，而非改變結果"], "do": ["寫下神在你婚姻中的信實見證", "找同處境的姊妹彼此代禱"]}, "gold": ["不要放棄，也不要讓步。", "神所賜贏得丈夫的方法，正是可能讓他退縮的敬虔。", "目標不是幸福的婚姻，而是堅忍跑完信心的路。"], "ref": ["彼得前書 3:1-6", "哥林多後書 6:14-16"], "fb": "親愛的疲憊的妻子：\n\n如果我們能面對面，我想先抱抱妳，然後告訴妳：不要放棄，也不要讓步。\n\n我知道主日早上是什麼感覺——\n妳幫孩子穿好衣服，知道丈夫會留在家裡，\n妳一個人帶著孩子去教會。\n我知道聽到講台上講婚姻時，好像有一半都不適用，\n因為妳的丈夫不信主，也從不思考怎樣像基督愛教會那樣愛妳。\n我知道躲在浴室、打開抽風機，才敢禱告、唱歌、流淚，\n因為在客廳裡做，可能會被嘲笑。\n我知道那種一直在拉扯的感覺：要討好不信的丈夫，也要討好基督。\n\n有一位姊妹，在這樣的婚姻裡走了二十四年。\n她說：我會累，我會灰心，有時醒來就覺得什麼都不會改變；\n我會開始盯著婚姻裡的巨人看，而忘了看神的信實。\n\n神知道這份苦。\n祂說不要和不信的人同負一軛，因為祂知道那份分裂有多真實。\n神原本設計婚姻是二人一體，\n妳卻常常覺得，是兩隻完全不同的動物，被一副粗重的軛硬綁在一起。\n\n但神沒有讓妳絕望。\n\n第一，神是信實的。\n也許現在很難看見，但回頭看，妳會看見祂一直托著妳。\n打開聖經，聽那些見證人說話：\n但以理在巴比倫見證神聽禱告，以斯帖見證神把她放在那個位置「正為現今的機會」。\n讓婚姻的試煉，成為妳自己的見證，見證神怎樣信實地待妳。\n\n第二，神給了妳一條贏得他的路。\n很多妻子以為，順服就是什麼都不做、默默接受。\n可是彼得前書三章的重點，正是告訴妻子怎樣「贏得」丈夫——\n不是靠髮型、身材或衣服，\n而是靠那個可能讓他退縮的東西：妳的敬虔。\n\n記得妳是神的兒女，不是人的奴僕；\n順服這個帶著罪的男人，向他顯出妳所領受的恩典；\n用愛心說誠實話，謙卑地站穩妳的信仰。\n\n不要放棄，是因為神還在工作；\n不要讓步，是因為神值得妳持守。\n放棄說「他不會變」，讓步說「我改信他的」；\n堅持說：「我會一直愛他，也一直愛主。」\n\n那位姊妹說：二十四年了，我的丈夫還沒信主。\n但只要我還有氣息，我會靠神的恩典，繼續贏得他。\n\n親愛的，目標不是一段幸福的婚姻，或一個好相處的丈夫；\n目標是堅忍地跑完基督擺在妳前頭的路。\n就算這一生都沒看見他信主，\n妳為他付出的每一份愛，都沒有白費——\n神都看見了，祂也會成就祂的美意。\n\n#婚姻 #不信的配偶 #妻子 #堅忍 #彼得前書3章"}, "four-steps-to-rebuild-trust": {"zh": "重建信任的四個步驟", "tags": ["衝突與修復", "外遇與試探"], "core": "信任建立在「對方為我著想，即使要付代價」的行動上；重建信任需要認罪悔改、可信的行動、被看見的努力，以及信靠神。", "sum": ["信任是關係的基石，但什麼是「可信的行動」，常因人而異。", "研究指出：信任來自看見對方「站在我這邊，即使要付代價」；需要一方去做、一方去認出。", "以丈夫使用色情為例：第一步，丈夫必須承認並真心悔改，不能缺少憂傷與道歉。", "第二步，雙方定義可信的行動，例如開放所有裝置、安裝追蹤、有可聯絡的問責夥伴。", "第三步，妻子要看見並肯定丈夫的努力；第四步，信任最終要錨定在神身上。"], "mm": {"c": "重建信任", "b": [["定義", ["為我著想", "即使付代價"]], ["認罪悔改", ["真心憂傷", "明白傷害"]], ["可信行動", ["開放裝置", "問責夥伴"]], ["肯定與信靠", ["看見努力", "錨定於神"]]]}, "fw": {"q": "信任破裂後還能修復嗎？", "a": "能，透過雙方的行動並以神為錨", "steps": ["犯錯者承認並悔改", "雙方定義並實行可信的行動", "受傷者看見並肯定努力"], "do": ["一起寫下具體的「可信行動」清單", "一同禱告，把信任先交給神"]}, "gold": ["信任來自對方為你付代價的行動。", "一方去做，一方去看見，信任才會重建。", "只有神是信任最穩固的根基。"], "ref": ["以賽亞書 25:1", "約伯記 13:15", "約書亞記 21:45"], "fb": "她拿起他的手機，手在發抖。\n不是想偷看，而是因為上個月發現的那件事，讓她再也無法不去想。\n他坐在對面，說：「妳要看就看吧。」\n那一刻，兩個人都很痛。\n\n信任，是每一段關係的地基。\n可是地基裂了以後，要怎麼補？\n\n有人說：信任，是可信的行為累積出來的。\n這句話對，但不夠。\n因為「什麼才算可信的行為」，常常是一個人覺得已經很努力，另一個人卻完全沒感覺到。\n\n信任其實需要兩個動作：\n一個人，願意為對方付出代價；\n另一個人，願意看見那份代價。\n缺了任何一個，裂縫都補不起來。\n\n第一步，是認錯與悔改。\n不是一句「好啦，我錯了」，\n而是讓受傷的人清楚知道：你真的明白，你造成了多深的傷。\n悔改不是一個按鈕，而是一段過程——\n裡面會有憂傷、羞愧、眼淚，和一次又一次的道歉。\n\n第二步，是一起定義「可信的行動」。\n也許是手機和電腦完全開放；\n也許是裝上追蹤或過濾；\n也許是有一位問責夥伴，而且受傷的那一方也能直接和他聯絡。\n這些做法，可能會讓犯錯的人覺得沒面子。\n可是，重建信任本來就需要付代價——那份代價，正是信任的材料。\n\n第三步，是看見並肯定。\n受傷的一方，若把對方的每一個努力都視為理所當然，\n對方心裡也會慢慢累積委屈和怨氣。\n當然，就算沒有被肯定，犯錯的人仍要負起該負的責任；\n但當一方努力、另一方說「我看見了」，裂縫就補得特別快。\n\n第四步，也是最深的一步：信靠神。\n被背叛過的人，要怎麼再一次把自己交出去？\n答案是：先把自己交給那位從不背約的神。\n祂守約施慈愛，祂的應許一句也不落空；\n祂為了我們，付上了最昂貴的代價——祂的兒子。\n當信任的錨，先拋在神身上，\n我們才有力氣，再一次小心翼翼地，向人伸出手。\n\n只靠對方的表現，信任會一直搖晃；\n先倚靠神的信實，信任才有地方站穩。\n只要求對方改變，關係會變成監獄；\n雙方一起努力，關係才會變成工地——雖然塵土飛揚，卻在一天天蓋起來。\n\n如果你們正走在這條路上，\n請不要期待一夜之間回到從前。\n裂過的地基，補好以後，會比以前更清楚哪裡需要支撐；\n走過背叛又走回彼此的夫妻，\n往往比從未受傷的人，更懂得珍惜。\n\n約伯說：祂必殺我，我仍要信靠祂。\n願你們的婚姻，也有這樣一份信靠——\n不是因為對方從不讓人失望，\n而是因為那位托住你們的神，從不讓人失望。\n\n#婚姻 #信任 #重建 #悔改 #饒恕"}, "where-dead-men-lie": {"zh": "死人躺臥之處", "tags": ["外遇與試探", "給丈夫"], "core": "一封寫給丈夫的警告信：淫婦的床是墳場，外遇是無知者的自殺；要遠離她，並以妻子為樂。", "sum": ["作者以箴言5-7章為本，寫信警告丈夫不要聽淫婦甜美的話。", "她承諾滿足、隱密、讓你覺得被渴望；但「到了終局」她苦如茵蔯、快如兩刃劍。", "她的房間是死亡的寢宮；沾染她的人必不免受罰。", "要遠離她，連她家的門都不要靠近；不要以為傳訊息、喝一杯不會怎樣。", "要從自己的井裡喝水：以年少的妻子為樂，常常戀慕她；因為人所行的道都在神眼前。"], "mm": {"c": "箴言的警告", "b": [["她的誘惑", ["甜言蜜語", "承諾滿足"]], ["終局", ["苦如茵蔯", "死亡之床"]], ["遠離", ["不靠近她的門", "不玩火"]], ["選擇生命", ["以妻子為樂", "神都看見"]]]}, "fw": {"q": "丈夫如何抵擋外遇的誘惑？", "a": "看清終局，遠離誘惑，並以妻子為樂", "steps": ["想到「到了終局」的後果", "切斷一切靠近的可能", "重新戀慕自己的妻子"], "do": ["刪除或封鎖可能的危險聯繫", "今天刻意欣賞並親近妻子"]}, "gold": ["把頭靠在她的枕頭上，就是把名字刻在墓碑上。", "你沒有強到可以安全地玩火。", "你的妻子，是你最好的酒。"], "ref": ["箴言 5:1-23", "箴言 6:27-33", "箴言 7:18-27"], "fb": "深夜的旅館走廊，燈光昏黃。\n他站在一扇門前，心跳得很快。\n手機裡的訊息說：「進來吧，沒有人會知道的。」\n\n箴言用好幾章的篇幅，描寫這樣的一扇門。\n她嘴唇滴下蜂蜜，口比油更滑；\n她說：來吧，我們可以飽享愛情，直到早晨。\n她讓男人覺得被渴望，覺得像一個王。\n\n可是箴言緊接著說了四個字：\n「至終」。\n\n至終，她苦似茵蔯，快如兩刃的刀；\n至終，她的家是陰間之路，下到死亡之宮。\n那張床，不是溫柔鄉，而是墳場；\n躺在上面的，是一個又一個曾經以為自己不會有事的男人。\n\n我們以為，外遇是一場浪漫的冒險；\n其實，它是一場慢動作的自我毀滅。\n我們以為，誘惑是外來的敵人；\n其實，最後回頭看時，人會發現——開門的，是自己。\n\n箴言說：與婦人行淫的，便是無知，行這事的，必喪掉生命。\n人豈能懷裡搋火，衣服不燒呢？\n人豈能在火炭上走，腳不燙呢？\n\n你以為傳幾則深夜訊息沒關係，\n你以為約出來喝一杯沒關係，\n你以為只是聊聊心事沒關係；\n可是你真的強大到，可以抱著火，卻不被燒傷嗎？\n\n所以箴言給的策略只有一個字：遠。\n你所行的道要離她遠，不可就近她的房門。\n不是站在門口和試探談判，而是根本不要走上那條街。\n\n那麼，男人心裡那份渴望怎麼辦？\n箴言沒有叫你壓抑，而是叫你轉向：\n你要喝自己池中的水，飲自己井裡的活水；\n要喜悅你年少時所娶的妻，她如可愛的母鹿，如可喜的母羊；\n願她的胸懷使你時時知足，她的愛情使你常常戀慕。\n\n看看她吧。\n她身上，有比你當年立誓時更多一千個值得你愛的理由。\n別拿那隻可愛的母鹿，去換一個至終會讓你毀滅的陷阱。\n\n為什麼要這麼認真？\n因為人所行的道，都在耶和華眼前。\n妻子也許不在身邊，但主一直都在。\n無論旅館的燈多昏暗，祂都看得見。\n\n那條走廊的盡頭，有兩扇門：\n一扇通往一夜的慾望，和一生的廢墟；\n一扇通往家，通往那個在燈下等你的人，\n通往一份需要用一生去守護、也值得用一生去享受的愛。\n\n轉身吧。\n趁你還能轉身。\n\n#婚姻 #外遇 #箴言5章 #丈夫 #選擇生命"}, "matrimony-no-more": {"zh": "不再有婚姻", "tags": ["苦難與死亡", "福音與奧祕"], "core": "來世不只比今生最糟的好，也比今生最好的更好；所以復活時不再嫁娶，是因為有更大的喜樂。", "sum": ["Piper 認為：復活後的喜樂將取代今生最強烈的享受。", "理由一：保羅說「從前我以為與己有益的，現在都當作有損的」——基督勝過今生最好的。", "理由二：神為愛祂的人所預備的，是眼未見、耳未聞、人心未曾想到的。", "理由三：聖經形容來世是滿足的喜樂、永遠的福樂、無法測度的恩典。", "在這個前提下聽耶穌說復活時不娶不嫁：婚姻不是被剝奪，而是被超越。"], "mm": {"c": "來世勝過今生", "b": [["論點一", ["得著當作有損", "基督最寶貴"]], ["論點二", ["眼未見耳未聞", "超越想像"]], ["論點三", ["滿足的喜樂", "無限恩典"]], ["結論", ["不娶不嫁", "婚姻被超越"]]]}, "fw": {"q": "天國沒有婚姻，是一種損失嗎？", "a": "不是，來世的喜樂勝過今生最好的", "steps": ["基督勝過一切今生的益處", "神預備的超越人的想像", "以此理解耶穌關於復活的話"], "do": ["讀路加福音20:27-36", "把婚姻的喜樂當作預嚐，感謝神"]}, "gold": ["天堂不只是改善了今生最糟的，也超越了今生最好的。", "我們能想像的，都還不是神所預備的。", "婚姻不是被拿走，而是被更大的喜樂取代。"], "ref": ["腓立比書 3:7-8", "哥林多前書 2:9", "詩篇 16:11", "路加福音 20:27-36"], "fb": "一位新婚的弟兄讀到耶穌的話：\n復活的時候，人也不娶也不嫁。\n他闔上聖經，心裡有點失落：\n天堂裡，她不再是我的妻子了嗎？\n那天堂，豈不是比現在少了一樣最美的東西？\n\n這個失落很真實。\n因為婚姻，確實是這世上最深的喜樂之一。\n\n可是，有一個問題值得我們停下來想：\n天堂，只是比這世上最糟的部分更好，\n還是比這世上最好的部分也更好？\n\n保羅說：從前我以為與我有益的，我現在因基督都當作有損的。\n他沒有說「我的損失，因基督變成了益處」，\n而是說「我的益處，在基督面前都成了損失」。\n基督不只勝過這世上的苦，也勝過這世上的甜。\n\n保羅又說：神為愛祂的人所預備的，是眼睛未曾看見、耳朵未曾聽見、人心也未曾想到的。\n如果是我們想像得到的，就還不是神所預備的。\n而我們最好的婚姻、最深的親密、最甜的時刻——我們都想像得到。\n所以，神預備的，一定比這些更好。\n\n詩篇說：在你面前有滿足的喜樂，在你右手中有永遠的福樂。\n「滿足的喜樂」，是一種再也沒有更多可以加上去的喜樂。\n這世上最好的東西，總讓我們覺得：還可以更多。\n天上的喜樂，會讓這份「還可以更多」的渴望，終於被填滿。\n\n我們以為，天堂沒有婚姻，是一種剝奪；\n其實，那是因為婚姻本來就是路標，指向一個更大的實體。\n當你已經抵達目的地，就不需要再看路標了。\n我們以為，天堂會比地上冷清；\n其實，地上最溫暖的火光，在那裡只像一根小蠟燭。\n\n那麼，我們在地上的婚姻，算什麼？\n是一份預嚐。\n像宴席前從廚房飄出來的香氣，\n讓你知道：主菜就要上了。\n\n所以，今天還在婚姻中的人，請好好享受這份香氣。\n不要因為它會結束，就不敢投入；\n也不要因為它很美，就以為它是全部。\n\n有一天，我們會在那裡相見。\n那時，也許你們不再是夫妻，\n但你們會一起站在那位新郎面前，\n發現這一生彼此的愛，\n都只是在為那一天練習。\n\n那一天，不是失去，\n而是終於得著。\n\n#天堂 #永恆 #婚姻 #盼望 #復活"}, "flee-from-the-darkness": {"zh": "逃離黑暗", "tags": ["外遇與試探", "給妻子"], "core": "外遇真正的戰場，是對神同在的渴慕與私慾之間的爭戰；要以飢渴慕義、禁食禱告的屬靈兵器來爭戰。", "sum": ["作者寫信給可能陷入外遇試探的妻子，提醒她那些「顯而易見」卻必須重申的事。", "罪帶來與神的隔絕，這應當使我們戰兢；不能一邊行在黑暗裡一邊說與神相交。", "外遇的根源不是對丈夫與他人的熱情衝突，而是對神同在的渴慕與私慾的衝突。", "飢渴慕義的人必得飽足；許多人渴望關注、新鮮、自由，卻不渴慕公義。", "這是屬靈爭戰，要用屬靈兵器：禁食、禱告、請姊妹陪伴代禱。"], "mm": {"c": "逃離黑暗", "b": [["罪的後果", ["與神隔絕", "自欺"]], ["真正的戰場", ["渴慕神同在", "對抗私慾"]], ["飢渴慕義", ["必得飽足", "而非渴求關注"]], ["屬靈兵器", ["禁食禱告", "群體陪伴"]]]}, "fw": {"q": "妻子陷入情感或外遇試探時怎麼辦？", "a": "重新渴慕神的同在，用屬靈兵器爭戰", "steps": ["承認罪正在把你帶離神", "培養對公義的飢渴", "以禁食禱告與群體支持爭戰"], "do": ["每次受試探就打電話給一位姊妹一起禱告", "安排一天禁食為婚姻禱告"]}, "gold": ["外遇的根源，是對神的渴慕輸給了私慾。", "飢渴慕義的人，神自己會使她飽足。", "屬靈的仗，要用屬靈的兵器打。"], "ref": ["約翰一書 1:6", "詩篇 51:11", "馬太福音 5:6", "以弗所書 6:12"], "fb": "親愛的姊妹：\n\n我想像自己坐在妳對面。\n我不知道妳完整的故事，\n但我很想伸出手，把妳從那片黑暗裡拉出來。\n\n也許妳會覺得：這些道理我都聽過了。\n可是，有時候我們最需要的，就是被提醒那些「早就知道」的事。\n\n很多人以為，外遇的戰場，是「對丈夫的感情」和「對另一個人的感情」在打仗。\n其實，真正的戰場，是另一場戰爭——\n妳對神同在的渴慕，和妳裡面的私慾，正在爭奪妳的心。\n\n罪會帶來與神的隔絕，這件事本該讓我們戰兢。\n約翰說：我們若說是與神相交，卻仍在黑暗裡行，就是說謊話。\n妳還記得，與神親近時那種甘甜嗎？\n妳還喜歡聽祂的聲音嗎？\n認識基督的寶貴，是不是在妳心裡，被別的東西擠到角落了？\n\n大衛犯罪後禱告：不要丟棄我，使我離開你的面；不要從我收回你的聖靈。\n他最怕失去的，不是名聲，不是王位，而是神的同在。\n\n耶穌說：飢渴慕義的人有福了，因為他們必得飽足。\n我看見很多人在飢渴：渴望被注意、渴望被肯定、渴望新鮮感、渴望從責任裡逃走。\n可是，渴望公義的人，好像越來越少了。\n如果妳願意培養對公義的胃口，神會親自餵飽妳；\n祂的同在與愛，會滿到讓妳不再需要那些假的東西。\n\n這是一場看不見的仗。\n我們不是與屬血氣的爭戰，而是與屬靈氣的惡魔爭戰。\n所以，要用屬靈的兵器。\n\n有一位妻子發現丈夫沉迷色情，她沒有崩潰，而是開始固定禁食禱告；\n有些夫妻每週一起禁食，因為他們知道情感的戰爭有多激烈；\n有一位姊妹對一位受試探的年輕妻子說：\n「每次妳感覺被他吸引，就打電話給我，我們一起奉耶穌的名禱告。」\n\n肉體說：沒有人會知道；\n聖靈說：神都知道，而祂仍然愛妳。\n私慾說：妳值得被好好對待；\n真理說：妳已經被一位為妳捨命的主，好好地愛著。\n黑暗說：太晚了；\n恩典說：只要回頭，永遠不晚。\n\n姊妹，我不相信妳能一邊走向外遇，一邊說自己正忠心地禱告、禁食、尋求神。\n所以，與其和試探談判，不如跪下來。\n\n妳不是一個人在打這場仗。\n那位使人得勝的主，正等著妳轉身。\n逃離黑暗吧——\n不是逃向一個沒有渴望的地方，\n而是逃向那位，唯一能滿足妳所有渴望的神。\n\n#婚姻 #情感外遇 #妻子 #禁食禱告 #飢渴慕義"}, "something-greater-than-us": {"zh": "比我們更大的事", "tags": ["福音與奧祕", "婚前與擇偶"], "core": "一篇婚禮宣言：婚姻是天上的戲劇在地上演出；新郎戰兢地扮演基督，因為他不是她的救主，只能求神幫助。", "sum": ["新郎說：今天我踏入比我更大的事——那在伊甸園低語、在基督裡揭曉的奧祕。", "婚姻是天上的戲劇，丈夫扮演基督，妻子扮演教會，世界與天使都在觀看。", "丈夫要演出的，是基督捨棄天上榮華、為新婦受苦受死的愛，這比在海面行走更難。", "「我不是她的救主」：他用墨水立約，基督用血立約。", "他三次禱告「神啊，幫助我」：在喜悅、專一、屬靈帶領上反映基督。"], "mm": {"c": "婚姻是戲劇", "b": [["天上的戲", ["丈夫如基督", "妻子如教會"]], ["丈夫的角色", ["基督捨己的愛", "戰兢扮演"]], ["謙卑", ["我不是她的救主", "墨水與血"]], ["禱告", ["神啊幫助我", "等候新郎再來"]]]}, "fw": {"q": "結婚時，丈夫承擔的是什麼角色？", "a": "在地上演出基督愛教會的戲", "steps": ["明白婚姻是更大的故事", "承認自己無法成為救主", "倚靠神去愛、專一、帶領"], "do": ["在紀念日一起讀以弗所書5:25", "丈夫為自己的角色禱告：神啊，幫助我"]}, "gold": ["婚姻是天上的戲劇，在地上的舞台演出。", "我用墨水與她立約，祂用血與我們立約。", "今天踏入比我們更大的事，明天踏入永恆。"], "ref": ["以弗所書 5:25", "創世記 2:23", "箴言 18:22"], "fb": "婚紗店裡，她站在鏡子前轉了一圈。\n店員說：「這是妳人生的主角時刻。」\n她笑了，心裡卻閃過一個念頭：真的是我嗎？\n\n我們這個時代，很習慣把婚禮當成兩個人的作品：\n我們的故事、我們的風格、我們的回憶、我們的主題色。\n一切都很美，一切也都很「我們」。\n\n可是，如果婚禮其實不是一部自傳，而是一齣更大的戲呢？\n如果站在台上的你們，不是編劇，而是被邀請的演員呢？\n\n聖經說，婚姻是一個奧祕，指向基督和教會。\n這意思是：當你們說「我願意」的那一刻，\n你們同時接下了一個角色——\n他要演那位為新婦捨命的新郎，\n她要演那位被愛到發光、也甘心回應的新婦。\n\n這是一個太大的角色。\n大到沒有一個男人演得好，\n大到沒有一個女人不會忘詞。\n\n平凡的人要演出不平凡的愛，\n有限的人要模仿無限的忠誠，\n會累的人要學那位永不疲倦的主，\n會變的人要見證那位永不改變的神。\n\n我們以為，演不好，就該換人演；\n其實，正因為演不好，才更需要天天回去讀劇本。\n我們以為，婚姻要靠兩個人的力量撐起來；\n其實，婚姻是靠那位真正的主角撐著——我們只是祂的影子。\n\n一個丈夫最需要記得的一件事，是：我不是她的救主。\n我給她的承諾，是用墨水寫的；祂給她的承諾，是用血寫的。\n我願意保護她，祂已經保護她到底了。\n所以，我不必假裝完美；我需要的，是每天說一句：主啊，幫助我。\n\n一個妻子最需要記得的一件事，是：他也不是我的救主。\n他會讓我失望，會在台上忘詞；\n但我仍可以回應他，因為我真正倚靠的，是那位從不忘詞的新郎。\n\n那麼，你們家今天的這一幕，演給世界看的是什麼？\n是兩個人搶鏡頭，還是兩個人一起指向那一位？\n是一齣關於「我們有多相愛」的戲，還是一齣關於「祂有多愛我們」的戲？\n\n鏡子前的新娘，\n妳當然很美，但妳不是全劇的主角，\n這不是遺憾，而是安慰：\n戲的結局，不靠妳演得多完美，\n而靠那位作者，從一開始就寫好的——\n新郎必再來，\n新婦必被迎娶，\n而所有在地上努力演出的夫妻，\n都會在那天，終於看懂自己演的是什麼。\n\n#婚禮 #婚姻 #基督與教會 #新郎新婦 #以弗所書5章"}, "only-love-prevents-adultery": {"zh": "唯有愛能防止外遇", "tags": ["外遇與試探", "給妻子"], "core": "外遇從心思開始；最好的防線不是問「能走多遠」，而是在基督裡得著深深的滿足。", "sum": ["沒有人結婚時想要毀掉婚姻；外遇常從想像、情感依附、渴望另一個男人的關注開始。", "我們對自己隱藏的罪容忍度特別高，但外遇根本上是心的問題。", "外遇用自私的鎚子砸碎一體的關係；性是靈魂的坦露，只屬於婚姻。", "外遇帶來羞恥、背叛的傳承、讓兒女失去安全感；作者從未見過一個為外遇而快樂的女人。", "防止外遇的最好方法是在基督裡得滿足：悔改並遠離試探來源（節目、讀物、社群、甚至工作）。"], "mm": {"c": "防止外遇", "b": [["如何開始", ["想像與幻想", "渴望關注"]], ["為何嚴重", ["砸碎一體", "靈魂坦露"]], ["後果", ["羞恥與背叛", "兒女受傷"]], ["防線", ["在基督裡滿足", "遠離試探源"]]]}, "fw": {"q": "如何保護自己不走向外遇？", "a": "在基督裡深深滿足，並果斷遠離試探", "steps": ["察覺心中的失望與幻想", "認識外遇帶來的痛苦", "悔改並切斷誘惑的來源"], "do": ["停掉會引發幻想的節目或社群", "寫下你想留給兒女的屬靈傳承"]}, "gold": ["問題不是「能走多遠」，而是「能在基督裡走多深」。", "你可能「墜入情網」，但你是自己走進那張床的。", "從基督喜樂的河中暢飲的人，不會渴求假的喜樂。"], "ref": ["希伯來書 13:4", "馬太福音 5:27-30", "箴言 4:23", "詩篇 36:8"], "fb": "沒有一個女人，是在婚禮那天想著：「我要怎麼毀掉這段婚姻？」\n每一個新娘，都希望這是一段一生的愛情故事。\n可是，有些女人後來發現，自己竟然在想著從前想都不敢想的事。\n\n那是怎麼開始的？\n\n通常不是從一張床開始，而是從一個念頭。\n先是對丈夫的失望——他賺得不夠多、嗜好太花時間、屬靈上很冷淡、親密時刻索然無味；\n或是覺得他的期待太高，自己永遠達不到；\n或是單純地，太久沒有被看見、被聽見。\n然後，一個願意傾聽的男人出現了。\n先是在心裡想像，再是情感上依賴，然後是越來越多的幻想。\n一路上，沒有人喊停，包括自己。\n\n我們對自己隱藏的罪，容忍度總是特別高。\n可是沒有人能一邊撫摸著秘密的幻想世界，一邊保持靈魂不受污染。\n外遇，和所有的罪一樣，根源都在心裡。\n\n婚姻是神聖的，人人都當尊重。\n外遇卻拿起一把叫作自私的鐵鎚，砸碎了一體的關係。\n性不只是身體的釋放，而是靈魂的坦露；\n它只屬於婚姻，因為在那裡，坦露的人才是安全的。\n過度的坦露，會在熱情的那一刻，造成看不見的傷。\n\n外遇帶來的痛，一層一層：\n自己的羞恥，家族傳承裡的背叛，\n孩子學到「媽媽的快樂比我的安全更重要」，\n還有教會群體的心碎。\n\n所以，只有一個字要說：不要。\n不要在腦海裡去，不要在心裡去，不要讓身體去。\n\n可是，光說「不要」還不夠。\n真正能防止外遇的，不是「我能走多遠才算犯罪」，\n而是「我能在基督裡走多深，深到純潔成為我滿足的自然結果」。\n一個正在從神喜樂的河中暢飲的人，不會口渴地去喝假的泉水。\n\n禁令說「別去那裡」，渴慕說「我已經在這裡」；\n恐懼讓人勉強停住，滿足讓人自然轉身。\n\n那就具體一點吧。\n哪個節目讓妳總想像自己在別人懷裡？關掉它。\n哪些讀物讓妳的心飄走？放下它。\n哪個社群、哪個聯絡人，總讓妳心跳加速？離開它。\n有時，甚至需要換一份工作。\n\n然後，想想婚姻的祝福：\n妳屬於某個地方，屬於某個人；\n有人選擇了妳，妳也選擇了他；\n你們正在一起寫一段歷史，留給下一代。\n妳想留下什麼樣的傳承？\n\n願妳的心，被那份更大的愛填滿，\n滿到連幻想，都找不到縫隙。\n\n#婚姻 #外遇 #妻子 #保守己心 #在基督裡滿足"}, "rejoice-in-the-wife-of-your-youth": {"zh": "要喜悅你年少時所娶的妻", "tags": ["給丈夫", "外遇與試探"], "core": "防止外遇的兩個提醒：她永遠是你年少所娶的那個女孩；她也是你屬靈傳承的同伴，影響到第十代。", "sum": ["箴言5:18說的不是「年輕的妻子」，而是「年少時所娶的妻」：無論多少年，她永遠是那個女孩。", "回想她在新婚之夜對你完全的信任與交付；那段戀愛是神親自點燃的火焰。", "即使生活變得平淡、苦難不少，你仍擁有她；她是神使你成聖的主要途徑之一。", "她也是你屬靈傳承的同伴：作者夫婦禱告神分別他們的家族直到第十代。", "你們的生活將影響幾萬名後代；要以正直和勇氣留下屬靈的產業。"], "mm": {"c": "年少所娶的妻", "b": [["她永遠是那女孩", ["新婚的信任", "神點燃的火"]], ["面對平淡", ["你仍擁有她", "成聖的途徑"]], ["屬靈傳承", ["到第十代", "數萬後代"]], ["行動", ["重拾戀愛", "正直勇敢"]]]}, "fw": {"q": "丈夫如何保守對妻子的忠誠？", "a": "喜悅年少所娶的妻，並為家族傳承而活", "steps": ["回想她當初對你的交付", "重拾兩人的友誼與浪漫", "以世代的眼光看你們的婚姻"], "do": ["和妻子重遊初識或約會的地方", "一起為後代禱告"]}, "gold": ["她不會一直年輕，但永遠是你年少所娶的妻。", "你們的愛情不是幻覺，它指向永恆的愛情故事。", "今天的忠誠，會影響到第十代。"], "ref": ["箴言 5:18-19", "雅歌 8:6", "以弗所書 5:31-32"], "fb": "他翻出一張發黃的照片。\n照片裡的她，二十二歲，站在校園的樹下，笑得有點害羞。\n他抬頭，看見廚房裡的她，五十多歲了，頭髮有幾根白，正在洗碗。\n他忽然很想走過去，從後面抱住她。\n\n箴言說：要喜悅你年少時所娶的妻。\n它沒有說「要喜悅你年輕的妻子」。\n沒有任何妻子能一直年輕；\n但她永遠是你「年少時所娶的」那個人。\n年齡會改變，身分不會改變。\n\n我們常把愛情想成一朵花：開了，然後謝了。\n可是聖經更像把愛情比作一棵樹：\n年輪一圈一圈加上去，外表越來越粗糙，裡面卻越來越堅實。\n\n時間拿走了一些東西：平滑的皮膚、輕盈的腳步、無憂的笑聲。\n時間也加上了一些東西：一起熬過的夜、一起埋過的眼淚、一起看過的風景、\n一起被神扶持過的每一個難關。\n拿走的看得見，加上的看不見；\n可是真正讓一段婚姻值錢的，正是那些看不見的。\n\n世界說：舊的，就該換新的；\n聖經說：舊的，要更加珍惜。\n世界說：激情注定會消失；\n聖經說：激情可以重新點燃，而且因著成熟，燒得更穩。\n世界說：你值得更好的；\n聖經說：神給你的，就是最好的那一份功課，也是最好的那一份禮物。\n\n還有一件事，常被忽略：\n你們的婚姻，不只屬於你們兩個人。\n它會影響孩子，影響孫子，影響一代又一代你看不見的人。\n今天你在她身上種下的忠誠，\n可能在幾十年後，成為一個你從未見過的後代，\n願意相信「愛可以一輩子」的理由。\n\n丈夫們，你最近一次「看見」她，是什麼時候？\n不是看見孩子的媽、家務的分工者、行程的協調者，\n而是看見那個——\n曾經讓你緊張到說錯話的女孩？\n\n今晚，走到她身邊吧。\n也許什麼都不用說，\n只要讓她感覺到：\n在你心裡，她從來不是「老伴」，\n她一直都是，\n那個讓你心跳的人。\n而你，也決定用剩下的每一天，\n繼續為她心跳。\n\n#婚姻 #丈夫 #箴言5章 #年少時所娶的妻 #世代傳承"}, "i-would-rather-die": {"zh": "我寧可死", "tags": ["外遇與試探", "給丈夫"], "core": "陳恩藩分享守住性純潔的支柱：敬畏神、嚴謹的自律，以及專注於使命、靠聖靈行事。", "sum": ["作者新婚時常禱告：寧可主取我性命，也不讓我對妻子不忠。", "單身時他在純潔上屢戰屢敗；後來用「跌倒就禁食一天」的方法操練自己。", "聖經的原則很簡單：逃避少年的私慾，追求公義。", "敬畏神是好的：一位牧師朋友外遇後痛苦到想輕生，這成了他的警鐘。", "嚴謹自律：23年來不與親屬以外的女性單獨同車，妻子可查看所有郵件與通話；並且不只逃離罪，更要靠聖靈奔向神。"], "mm": {"c": "守住純潔", "b": [["敬畏神", ["神是聖潔的", "外遇的悲慘"]], ["嚴謹自律", ["不單獨相處", "完全透明"]], ["兩種得勝", ["超自然釋放", "每日操練"]], ["專注使命", ["靠聖靈行事", "奔向神"]]]}, "fw": {"q": "如何長期守住婚姻的純潔？", "a": "敬畏神、嚴守界線、專注使命", "steps": ["培養對神的敬畏", "設立清楚的界線並保持透明", "不只逃離罪，也奔向神"], "do": ["讓配偶能查看你的手機與信箱", "訂下不與異性單獨相處的原則"]}, "gold": ["禁食讓人更容易抗拒罪。", "敬畏可以是一種恩典。", "不只要逃離試探，更要奔向神。"], "ref": ["提摩太後書 2:22", "詩篇 111:10", "哥林多前書 9:27", "加拉太書 5:16"], "fb": "有一種男人，誇口說：「我絕對不會出軌。」\n還有一種男人，安靜地說：「我知道我有可能，所以我每天都在防守。」\n第二種男人，通常比較安全。\n\n為什麼？\n因為守住純潔的第一步，不是覺得自己很強，\n而是誠實承認：那份惡的可能性，就在我裡面。\n\n我們以為，忠誠是一種個性——有的人天生專一，有的人天生花心；\n其實，忠誠更像一種操練——每天選擇，每天防守，每天回到神面前。\n我們以為，界線會讓人顯得不信任自己；\n其實，界線正是因為太愛自己的婚姻，所以不願拿它冒任何風險。\n\n守住婚姻，可以靠幾根柱子。\n\n第一根，叫作敬畏。\n不是害怕被抓到，而是害怕傷了神的心。\n當你想到，人所行的一切都在神眼前，\n那份敬畏會像一盞燈，在最暗的地方照著你。\n恐懼本身不是目的，但對聖潔之神的敬畏，是智慧的開端。\n\n第二根，叫作界線。\n不單獨和異性深夜聊天，不單獨相約喝酒，不把心事先說給配偶以外的異性聽；\n手機、信箱、帳戶，對配偶完全透明。\n有人會說：這也太誇張了吧？\n可是，你會覺得在懸崖邊加裝護欄很誇張嗎？\n\n第三根，叫作使命。\n逃離罪是對的，但只會逃的人，很容易累。\n心裡有一個更大的方向，人才會自然地背對試探。\n聖經說：你們當順著聖靈而行，就不放縱肉體的情慾了。\n不是用力壓住水，而是挖一條讓水流向大海的河道。\n\n敬畏讓你停下腳步，\n界線讓你遠離懸崖，\n使命讓你轉過身，朝著光跑。\n一根柱子撐不住一棟房子，三根一起，才站得穩。\n\n而在這三根柱子底下，還有一塊地基：恩典。\n有些人蒙神特別的釋放，那份試探好像從生命裡被拿走了；\n有些人則是一天一天、一次一次，靠恩典重新站起來。\n兩種人，神都得著榮耀；兩種人，都不是靠自己。\n\n你的婚姻，現在靠什麼守著？\n是因為沒機會？還是因為你決定，就算有機會，也不要？\n\n願我們都不必禱告「寧可死，也不要背叛」，\n而是每一天都能平靜地說：\n「我寧可活——活在你面前，活得清潔，活得專一，\n活成一個讓妻子安心、讓孩子驕傲、讓神喜悅的男人。」\n\n#婚姻 #性純潔 #丈夫 #界線 #敬畏神"}, "how-god-saved-my-marriage": {"zh": "神如何挽救我的婚姻", "tags": ["衝突與修復", "給丈夫"], "core": "一位法利賽人般的丈夫立志一年內不提妻子的錯，只處理自己的樑木；夫妻從比賽攻擊變成比賽悔改。", "sum": ["新婚頭一年天天爭吵：妻子越來越敏感，作者越來越冷漠，總是承認兩項錯、列出對方八項錯。", "妻子說：婚前我很有自信，嫁給你一年後失去了所有自尊。", "作者看見自己像法利賽人：用神的話當利劍攻擊妻子的軟弱，卻淡化自己的罪。", "他立志一年內不主動提妻子的罪，只談自己的罪，看見她的罪就禱告。", "在禱告中他被神的赦免軟化；後來兩人變成「比賽誰先悔改」。"], "mm": {"c": "先去掉樑木", "b": [["衝突模式", ["她情緒化", "他冷漠攻擊"]], ["醒悟", ["她失去自尊", "我是法利賽人"]], ["新誓言", ["一年不提她的錯", "只談自己的罪"]], ["結果", ["被恩典軟化", "比賽悔改"]]]}, "fw": {"q": "總覺得配偶錯得比較多，怎麼辦？", "a": "先去掉自己眼中的樑木", "steps": ["承認自己的自義", "暫停指責，只處理自己的罪", "把對方的錯交給神禱告"], "do": ["試行一個月不主動提配偶的錯", "每次衝突後先說自己哪裡錯"]}, "gold": ["即使你只錯了1%，也要先處理那1%。", "我沒有用神的話洗淨妻子，而是用它攻擊她。", "從比賽誰先攻擊，變成比賽誰先悔改。"], "ref": ["馬太福音 7:5", "以弗所書 5:26"], "fb": "吵架的時候，你是哪一種人？\n有人會哭、會大聲、會摔門；\n也有人很冷靜，冷靜到像法官，\n等對方情緒一出錯，就精準地指出：「你這樣說不合理。」\n\n後一種人，常常以為自己比較成熟。\n可是有一天，他聽見妻子說：\n「跟你結婚以後，我越來越不喜歡自己了。」\n\n那一刻，他才看見：\n自己一直用真理當武器，卻從沒用真理當洗淨的水。\n他記得自己的兩個小錯，卻清點她的八個大錯；\n他說「我道歉了，現在換妳」，好像饒恕是一場交易。\n\n耶穌說：先去掉自己眼中的樑木，然後才能看得清楚，去掉弟兄眼中的刺。\n我們通常讀成：先處理自己，再處理別人。\n但這句話還有一層意思：\n離你最近的罪，就是你自己的罪；\n就算你只錯了一分，那一分也是你最該負責的部分。\n\n我們以為，指出對方的錯，是在幫助她成長；\n其實，帶著樑木去挑刺，只會讓兩個人都看不清楚。\n我們以為，冷靜就是理性；\n其實，沒有憐憫的冷靜，是另一種形式的冷酷。\n\n於是，他做了一個奇怪的決定：\n接下來一段時間，他不主動提她的任何一個缺點，\n只談自己的錯；看見她的錯，就拿去禱告。\n\n這很難。\n有時他心裡翻騰，嘴巴卻閉著；\n有時他跪下來，一開口就是「主啊，你要改變她」，\n可是禱告到最後，總是變成「主啊，求你赦免我」。\n\n奇妙的事慢慢發生了。\n他越常面對自己的罪，就越常經歷神的赦免；\n越經歷神的赦免，心就越柔軟；\n心越柔軟，就越聽得進她的話。\n有一天，她又指出他的錯，他立刻承認。\n她停下來，輕輕說：「其實……也不全是你的錯，我也有不對。」\n\n比賽誰先攻擊，兩個人都會輸；\n比賽誰先悔改，兩個人都會贏。\n指責的話越說越硬，認罪的話越說越軟；\n法官的家很整齊，恩典的家才溫暖。\n\n你的家，現在是法庭，還是避難所？\n你最常說的是「你應該」，還是「我錯了」？\n\n神挽救婚姻的方式，常常不是先改變那個讓你受不了的人，\n而是先讓你看見，自己臉上那根樑木。\n然後，在十字架下，\n兩個本來忙著互相審判的人，\n終於一起跪下來，\n發現彼此都一樣需要恩典，\n也一樣被恩典深深愛著。\n\n#婚姻 #衝突 #樑木與刺 #悔改 #恩典"}, "when-love-is-war": {"zh": "當愛變成戰爭", "tags": ["衝突與修復"], "core": "夫妻爭吵時，舌頭是殺手；關鍵在於是否給予恩典，並識破讓我們拒絕施恩的謊言。", "sum": ["最親密的盟友變成對手；一體的關係讓每句惡言都像迴力鏢傷到自己。", "雅各書形容舌頭是地獄點著的火、滿了致命的毒。", "整本新約充滿恩典：恩典是神主動、不配得的恩惠，基督徒生命浸泡在恩典裡。", "爭吵時我們常忘記恩典，於是也不給對方恩典。", "謊言一：給恩典是公平的？不，饒恕從來就不公平，是基督代付了代價；我們不該要求對方先補贖。"], "mm": {"c": "施恩或不施恩", "b": [["戰場", ["盟友變對手", "惡言如迴力鏢"]], ["舌頭", ["地獄之火", "致命之毒"]], ["恩典", ["不配得的恩惠", "基督徒的生命"]], ["謊言", ["要公平", "要對方先補贖"]]]}, "fw": {"q": "吵架時如何停止互相傷害？", "a": "記得自己所領受的恩典，並放下武器", "steps": ["察覺舌頭的破壞力", "回想神在基督裡給你的恩典", "識破拒絕施恩的謊言"], "do": ["吵架中先停下說：我們先禱告", "道歉時不附加條件"]}, "gold": ["在一體的關係裡，每句惡言都會飛回自己身上。", "因信稱義是唯獨恩典——別只用在自己身上。", "對方不需要先補贖，基督已經付清了。"], "ref": ["雅各書 3:5-12", "以賽亞書 53:7", "以弗所書 2:7"], "fb": "本來是全世界最親的兩個人，\n此刻卻站在客廳兩端，像兩個拿著武器的敵人。\n她說一句帶刺的話，他回一句更尖的；\n他翻出舊帳，她翻出更舊的。\n孩子躲在房門後，聽著這場沒有裁判的拳擊賽。\n\n在婚姻裡打架，有一個殘酷的規則：\n你打中對方，也同時打中自己。\n因為你們是一體的，每一句惡言，都會像迴力鏢一樣飛回來。\n\n雅各書說，舌頭是火，是罪惡的世界，是不能制伏的惡物，滿了害死人的毒氣。\n我們常以為，傷人的是拳頭；\n其實，最常讓婚姻流血的，是一句話。\n\n在每一場衝突裡，總有一個時刻，你必須做選擇：\n放下拳套，還是再出一拳？\n給恩典，還是討公道？\n\n奇怪的是，我們每天都在說「恩典」，\n唱「奇異恩典」，讀「你們得救是本乎恩」，\n可是一旦吵起架來，恩典就像被鎖進了櫃子。\n\n為什麼？因為我們心裡常有幾個聲音。\n\n「給她恩典不公平。」\n是的，確實不公平。\n可是，恩典本來就不是公平——恩典是你不配得卻得到了。\n你自己的罪被赦免時，公平嗎？\n那時，是無罪的羔羊默然無聲，替你承受了最不公平的判決。\n我們很喜歡「唯獨恩典」，只是常常只想用在自己身上。\n\n「他得先付出代價。」\n我們想看見對方買花、道歉、徹底認錯、在我面前低頭；\n可是十字架已經付了代價，\n我們沒有資格再向對方收一次。\n\n「我先讓步，就輸了。」\n可是在婚姻裡，最先放下武器的人，不是輸家，\n而是最先想起自己是誰的人——一個蒙了大恩的罪人。\n\n討公道的話，越說越大聲；\n給恩典的話，越說越安靜。\n公道讓你贏了一場爭吵，\n恩典讓你保住一個家。\n\n下一次，當你們又站在客廳兩端，\n也許可以試著做一件很難的事：\n先停下來，深呼吸，然後說——\n「我們先不要吵了，可以先一起禱告嗎？」\n\n也許對方還在氣頭上，\n也許你心裡也還有很多話想說，\n但那一刻，你們就從兩個拳擊手，\n變回兩個在同一位恩典之主面前，\n一樣需要被饒恕的人。\n\n#婚姻 #衝突 #恩典 #言語 #雅各書3章"}, "will-you-cleave-and-leave-your-man": {"zh": "你會緊連還是離開你的丈夫？", "tags": ["給妻子", "外遇與試探"], "core": "Noël Piper 分享：「cleave」既是劈開也是緊連；在婚姻最黑暗的時期，四個習慣和一個問題保守了她。", "sum": ["英文cleave有相反兩義：劈開（菜刀）與緊連（創世記2:24）。", "作者近49年前嫁給約翰·派博，當時毫不懷疑；但後來經歷失眠、渴望改變的低谷，那是最可能轉向別人的時期。", "四個習慣保守了她：不與其他男人調情、避開過度關注她的男人、不與男人單獨會面、與丈夫固定一同靈修。", "最難卻最重要的是一同靈修：她的父母在婚姻危機中仍堅持每晚家庭讀經禱告，神保守了他們。", "在最黑暗的夜裡，她問自己：我要做劈開家庭的刀，還是緊連丈夫的人？"], "mm": {"c": "劈開或緊連", "b": [["雙關語", ["菜刀", "緊緊連合"]], ["低谷", ["失眠", "最易轉向他人"]], ["四個習慣", ["不調情", "不單獨見面", "一同靈修"]], ["關鍵問題", ["我是哪種cleaver", "選擇緊連"]]]}, "fw": {"q": "在婚姻低谷時如何保持忠誠？", "a": "藉由好習慣與一同敬拜，選擇緊連丈夫", "steps": ["建立與異性的界線", "即使不想，也堅持一同靈修", "問自己：我在劈開還是緊連？"], "do": ["和丈夫恢復固定的讀經禱告", "檢視自己是否有過度親近的異性關係"]}, "gold": ["一同禱告時即使覺得虛偽，也比完全不來好。", "神用祂的信實當膠水，把夫妻黏在一起。", "我要成為劈開家庭的刀，還是緊連丈夫的人？"], "ref": ["創世記 2:24"], "fb": "中文的「離」與「合」，是兩個相反的字。\n英文裡卻有一個奇妙的字：cleave。\n它可以是「劈開」——像菜刀把東西一分為二；\n它也可以是「緊連」——像聖經說的，人要與妻子連合。\n同一個字，兩種完全相反的意思。\n\n這個字，像是一面鏡子，照出每一位妻子心裡都會面對的一個問題：\n我要成為劈開這個家的那把刀，\n還是緊緊連合在他身邊的那個人？\n\n婚禮那天，這個問題好像不存在。\n誓詞說得那麼篤定：無論好壞，只忠於他一人。\n可是，沒有人在婚禮那天，會預先看見那些難熬的夜晚——\n失眠、疲憊、心裡一直喊著「我想要不一樣的生活」的季節。\n那往往才是一個人最容易轉向別人的時候。\n\n我們以為，不忠是某一天突然做出的決定；\n其實，忠誠是在千萬個平凡日子裡，一點一點守住的。\n\n有一些很樸實的習慣，在風暴中特別有用：\n不和其他男人調情——哪怕只是「開玩笑」；\n遠離那些對妳表現得太有興趣的人；\n不和丈夫以外的男人單獨見面；\n還有最難、卻最重要的一個：和丈夫固定一起讀經、一起禱告。\n\n為什麼一起禱告這麼重要？\n因為在最冷淡的季節，你們可能一點也不想一起敬拜；\n坐在一起禱告，甚至會覺得自己很虛偽。\n可是，帶著不完整的心來到神面前，\n仍然比完全不來要好。\n很多婚姻能撐過暴風雨，不是因為感覺一直都在，\n而是因為兩個人一直還在同一個地方跪下來。\n神用祂的信實，把那些搖搖欲墜的家，慢慢黏了回去。\n\n刀子說：我受夠了，我要切開；\n連合說：我也很累，但我不放手。\n刀子一刀下去，很快；\n連合需要一輩子，卻能結出一整個家族的果子。\n\n妳現在手中握著的，是哪一個cleave？\n\n如果此刻正是妳最黑暗的夜晚，\n請不要急著做決定，先問自己一個問題：\n這一刀下去，會切開的，不只是我和他，\n還有孩子們、還有我們這些年在神面前許下的一切。\n\n然後，選擇另一個cleave吧——\n緊緊抓住他，更緊緊抓住那位抓住你們的神。\n有一天，當妳回頭看，\n會感謝那個在黑夜裡沒有放手的自己。\n\n#婚姻 #妻子 #忠誠 #連合 #一起禱告"}, "are-your-bank-accounts-divorced": {"zh": "你們的銀行帳戶離婚了嗎？", "tags": ["金錢"], "core": "婚姻是全然的合一，包括財務；共同帳戶傳遞「我們的錢」、透明與信任，分開帳戶則可能逃避彼此的問責。", "sum": ["作者當銀行員時，親眼看見一位妻子在貸款會議中發現丈夫隱藏的信用卡。", "研究指出：婚姻早期的金錢爭執是日後離婚的首要預測因素；不少人瞞著配偶消費或擁有秘密帳戶。", "二人成為一體；哥林多前書7章說連身體都不屬於自己，其他權利更是如此。", "分開帳戶增加管理複雜度，也讓慷慨奉獻與儲蓄更困難。", "共同帳戶傳達「我們的錢」、透明、信任與承諾；分開帳戶可能表達不想彼此負責。"], "mm": {"c": "財務合一", "b": [["故事", ["隱藏的信用卡", "信任破裂"]], ["數據", ["金錢爭執預測離婚", "秘密消費"]], ["聖經原則", ["二人一體", "沒有我的你的"]], ["帳戶", ["共同帳戶的信息", "分開帳戶的風險"]]]}, "fw": {"q": "夫妻該不該分開管理金錢？", "a": "婚姻是全然的合一，財務也應如此", "steps": ["承認財務隱瞞的破壞力", "以「我們的」取代「我的、你的」", "建立透明的共同帳戶與溝通"], "do": ["一起檢視所有帳戶與負債", "大額消費前先彼此商量"]}, "gold": ["婚姻是全部投入的交易。", "沒有「我的」和「你的」，只有「我們的」。", "共同帳戶傳達透明、信任與承諾。"], "ref": ["創世記 2:24", "哥林多前書 7:4"], "fb": "銀行櫃台前，一對夫妻正在等房貸審核結果。\n行員翻著信用報告，指著一筆卡債問：「這張卡，是你們的嗎？」\n妻子一臉疑惑：「不是啊，是不是被盜刷？」\n坐在旁邊的丈夫，臉卻慢慢紅了起來。\n\n那一刻，傷她的不是那筆債，\n而是她突然發現：原來我們之間，有一扇我不知道的門。\n\n金錢是婚姻裡最常見的爭吵原因之一。\n很多研究都指出，婚姻早期關於錢的爭執，常常是日後危機的預兆。\n更讓人心驚的是，不少夫妻承認，曾瞞著配偶花大錢，甚至擁有對方不知道的帳戶。\n\n為什麼錢這麼容易傷婚姻？\n因為錢從來不只是錢。\n錢是安全感、是控制權、是自由，也是信任。\n當帳戶有秘密，心也就有了秘密。\n\n聖經說，二人成為一體。\n保羅甚至說，妻子沒有權柄主張自己的身子，丈夫也沒有權柄主張自己的身子。\n如果連身體都不再是「我的」，\n那麼帳戶、薪水、存款，又怎麼會是「我的」？\n\n婚姻是一場全部投入的交易。\n沒有「我的」和「你的」，只有「我們的」。\n\n有人會問：那夫妻一定不能有分開的帳戶嗎？\n聖經沒有規定帳戶的形式，\n但它清楚地描繪婚姻的精神：合一、透明、彼此負責。\n分開的帳戶，若是為了方便管理、而且彼此完全知情，也許無妨；\n但若是為了保留一塊「你管不到我」的地方，\n那就是在合一的盟約裡，偷偷保留了一個出口。\n\n共同的帳戶在說：我們一起承擔，一起決定，一起成長；\n秘密的帳戶在說：我信任你，但只信任到某個程度。\n共同的存款簿記錄的是數字，\n更記錄了兩個人願意被彼此看見的勇氣。\n\n你們家的錢，是一起討論的，還是各自決定的？\n你有沒有一筆花費，是不太想讓對方知道的？\n如果明天對方翻開你所有的帳單，你會坦然，還是緊張？\n\n今晚，也許可以泡一壺茶，\n把所有帳戶、所有卡、所有借款，攤在桌上，\n不是為了審判誰，而是為了一起重新開始。\n\n錢可以被賺回來，\n信任卻很難賺回來。\n願你們的家，沒有一扇對方不知道的門，\n只有一條兩個人並肩走、\n光明又踏實的路。\n\n#婚姻 #理財 #金錢 #透明 #信任"}, "good-lovemaking-is-about-god": {"zh": "美好的性愛關乎神", "tags": ["性與親密"], "core": "神設計夫妻的性愛隨時間加深，是在各種季節中編織靈魂的親密；它反映基督對教會恆久的愛。", "sum": ["年輕人問一位已婚朋友：和同一個女人做愛不無聊嗎？他回答：「她不是同一個女人。」", "夫妻都在成長改變，親密關係也像好酒一樣隨時間成熟。", "夫妻在蜜月、流產後、生病時、埋葬親人後都做愛；性是在服事、犧牲與掙扎中加深的連結。", "世界的歡愉像海市蜃樓，帶來更深的不滿足；色情從來無法讓人滿足。", "性不總是輕鬆愉快，但在每個季節中反映神恆久的愛；最終目的是享受神。"], "mm": {"c": "屬神的性愛", "b": [["她不是同一個人", ["彼此成長", "像好酒"]], ["各種季節", ["喜樂與悲傷", "健康與疾病"]], ["世界的假象", ["海市蜃樓", "越來越不滿足"]], ["終極目的", ["反映基督之愛", "享受神"]]]}, "fw": {"q": "長年婚姻的性生活會變無聊嗎？", "a": "不會，神設計它隨時間加深", "steps": ["看見彼此都在成長變化", "在各種季節中持續親密", "以反映基督之愛為目標"], "do": ["在困難季節中也保持身體的親近", "一起感謝神賜下親密的禮物"]}, "gold": ["她不是同一個女人，我們都在成長。", "性愛不只是情慾，而是編織靈魂的親密。", "罪的歡愉像口渴的人看見海市蜃樓。"], "ref": ["箴言 5:18-19", "以弗所書 5:31-32"], "fb": "一個年輕人半開玩笑地問已婚的朋友：\n「跟同一個人過一輩子，不會膩嗎？」\n朋友想了想，笑著說：\n「其實，我每年都在認識一個新的她。」\n\n世界告訴我們，激情來自新鮮：新的人、新的刺激、新的幻想。\n所以它總在換：換對象、換畫面、換花樣。\n可是，換來換去的人，真的比較滿足嗎？\n看過一張色情圖片的人，會就此滿足停下來嗎？\n幻想幾秒鐘的人，會從此不再幻想嗎？\n\n罪的快樂，像口渴的人在沙漠裡看見海市蜃樓。\n剛看見時，心頭一亮；\n走近了，只剩更深的乾渴。\n\n神設計的親密，走的是另一條路。\n它不是靠新鮮維持，而是靠時間加深。\n像一瓶好酒，越陳越香；\n像一盆炭火，不是瞬間的煙花，而是長長久久的熱度。\n\n真正的親密，會在各種季節裡出現：\n在蜜月的甜蜜裡，也在流產後的眼淚裡；\n在想要孩子的盼望裡，也在送別孩子的悲傷裡；\n在身體健康時，也在對抗疾病的日子裡；\n在買下新房的興奮裡，也在埋葬父母後的沉默裡。\n每一次靠近，都在說：無論好壞，我都在。\n\n世界的激情問：你能給我什麼刺激？\n婚姻的親密問：我能陪你走過什麼？\n世界的激情越換越空，\n婚姻的親密越守越深。\n\n當然，親密也不總是輕鬆或美好。\n兩個會改變、會成長、也會軟弱的罪人，\n總會有甜的日子，也有澀的季節。\n這不是失敗，而是神智慧的設計——\n讓我們學會，不靠外表或表現來相愛，\n而是靠一份守約的承諾。\n\n為什麼神要這樣設計？\n因為夫妻的親密，是一面鏡子，\n照出基督對祂新婦那深刻、親密、忠誠、捨己的愛。\n那份愛，不是因為新婦一直很美，\n而是因為新郎一直很信實。\n\n所以，性的終極目的，不只是享受彼此，\n更是透過彼此，享受那位設計這一切的神。\n神比性更好，\n而祂把一點點天上的喜樂，藏在夫妻的親密裡，\n讓我們在地上就能預嚐。\n\n你們的親密，最近是怎樣的季節？\n是熱烈、是平淡，還是有點冷？\n無論是哪一種，都別放棄靠近。\n\n因為最好的親密，不是最刺激的那一次，\n而是走過五十年風雨後，\n兩個滿是皺紋的手還握在一起——\n那一握，勝過世上所有的新鮮。\n\n#婚姻 #親密 #性 #守約之愛 #神的設計"}, "husband-lift-up-your-eyes": {"zh": "丈夫，抬起你的眼睛", "tags": ["外遇與試探", "給丈夫"], "core": "Piper 分享近五十年從未被其他女人吸引的原因：求神除去不當的慾望，並感受外遇的可憎。", "sum": ["Piper 坦言自己的眼睛和一般男人一樣容易被吸引，所以對影視中的裸露零容忍。", "他婚後與妻子享有深刻的親密，51年來從未在浪漫或性上被其他女人吸引。", "他認為這是神主權的恩典禮物，而非靠自己的努力。", "第一個可傳遞的原則：不只求神保守你不跌倒，更求神除去對妻子以外女人的任何慾望。", "第二個原則：讓外遇在你感覺中變得令人反胃；耶穌用「剜出眼睛」的強烈畫面，或許就是要喚起這種本能的厭惡。"], "mm": {"c": "從未被吸引", "b": [["坦白", ["眼睛同樣軟弱", "不看裸露"]], ["恩典禮物", ["51年的專一", "不是靠努力"]], ["原則一", ["求神除去慾望", "懇切祈求"]], ["原則二", ["感到可憎", "剜眼的比喻"]]]}, "fw": {"q": "如何不只是抵擋，而是不再渴望外遇？", "a": "懇求神除去不當慾望，並深感外遇的可憎", "steps": ["保護眼目，遠離挑逗的影像", "懇切求神改變渴望", "默想外遇的醜惡與後果"], "do": ["今天禱告：求神除去我對配偶以外的慾望", "刪除會引誘你的影片與帳號"]}, "gold": ["不要只求不跌倒，要求神拿走那慾望。", "神行了神蹟，讓外遇不只是道德上錯，更令人反胃。", "耶穌用強烈的畫面，要喚起我們本能的厭惡。"], "ref": ["馬太福音 5:29"], "fb": "機場、海灘、街頭的廣告看板、手機推播的短片——\n一個男人一天之中，眼睛要經過多少次試探？\n很多弟兄嘆氣說：我也不想看，可是它就在那裡。\n\n有一位年長的牧者，結婚近五十年。\n他坦白說，他的眼睛和其他男人一樣，很容易被吸引；\n所以他幾乎不看有裸露或挑逗畫面的影片，\n因為他知道，那些畫面一進到腦海，就很難再出去。\n可是他也說：這麼多年來，我從來沒有渴望過妻子以外的任何女人。\n\n這不是因為他特別有意志力，\n他說，這是神白白給的恩典。\n\n我們以為，對抗試探只能靠咬牙：看到了，忍住；想到了，壓下去。\n其實，聖經給了我們更深的盼望：\n神不只能幫你不去做，\n祂還能改變你「想不想」。\n\n所以，第一件事是：求。\n不要只禱告「主啊，求你保守我不要跌倒」，\n也要禱告「主啊，求你拿走我對妻子以外任何女人的慾望」。\n懇切地求，一次又一次地求。\n不只求在懸崖邊停住，更求神讓你根本不想往懸崖走。\n\n第二件事是：看清它的醜陋。\n耶穌說：若是你的右眼叫你跌倒，就剜出來丟掉。\n祂本可以說得溫和一點：「如果眼睛讓你跌倒，就把頭轉開吧。」\n可是祂用了一個讓人震驚的畫面。\n也許，祂要喚醒的不只是道德上的「不應該」，\n而是一種更本能的反應——像看見髒東西時，喉嚨裡那種想吐的感覺。\n\n當外遇在你心裡只是「不應該」，它仍然可能很誘人；\n當外遇在你心裡變得「不想要」，它就失去了力量。\n「不應該」靠意志，「不想要」靠恩典；\n意志會累，恩典不會。\n\n那麼，眼睛該往哪裡看？\n抬起眼睛吧——\n看向那個每天和你一起醒來的女人，\n看向那位使你們成為一體的神，\n看向那個你們將一起抵達的永恆。\n\n弟兄們，今天你的眼睛，是被什麼牽著走？\n你願意今晚就禱告：「主啊，連我的慾望，也求你更新」嗎？\n\n願你的眼睛，不再四處張望，\n而是像一個找到寶藏的人——\n眼裡只有那一份，\n神親手放在你身邊的珍寶。\n\n#丈夫 #性純潔 #眼目的情慾 #禱告 #婚姻"}, "the-most-important-text-on-marriage": {"zh": "最重要的婚姻經文", "tags": ["衝突與修復", "溝通與親密"], "core": "對作者夫婦而言，最重要的婚姻經文不是以弗所書5章，而是4:32：以恩慈相待、存憐憫的心、彼此饒恕。", "sum": ["作者與 iPhone 同一天「發表」：2007年6月29日結婚。", "以弗所書5:22-33很重要，但十年來對他們最關鍵的是4:32。", "他們最需要的不是技巧，而是學習在盟約中做基督徒。", "研究者高特曼發現：好婚姻的關鍵是恩慈——回應對方的「連結邀請」，而不是轉身忽略。", "但研究只能談外在行為；聖經提供內在改變的途徑：存憐憫的心，並像神在基督裡饒恕我們一樣饒恕。"], "mm": {"c": "弗4:32", "b": [["恩慈相待", ["回應邀請", "轉向而非轉開"]], ["存憐憫的心", ["內在改變", "研究做不到"]], ["彼此饒恕", ["像神饒恕我們", "每天需要"]], ["核心", ["在盟約中做基督徒", "不只是技巧"]]]}, "fw": {"q": "婚姻最需要的是什麼？", "a": "學習在盟約中活出基督徒的樣式", "steps": ["以恩慈回應配偶的小邀請", "求神給你柔軟憐憫的心", "效法神在基督裡的饒恕"], "do": ["配偶找你說話時，放下手邊的事轉向他", "背誦以弗所書4:32"]}, "gold": ["我們最需要的，是在婚姻裡學做基督徒。", "每一次小小的搭話，都是一次連結的邀請。", "研究能教你外在的恩慈，但只有福音能改變內心。"], "ref": ["以弗所書 4:32", "以弗所書 5:22-33"], "fb": "如果只能挑一節經文，送給你的婚姻，你會挑哪一節？\n\n大多數人會選以弗所書五章：丈夫要愛妻子，妻子要順服丈夫。\n或是哥林多前書十三章：愛是恆久忍耐，又有恩慈。\n這些當然都很重要。\n\n可是有一對結婚十年的夫妻說，對他們影響最大的，\n其實是在婚姻那一段前面幾節、很容易被跳過的一句話：\n並要以恩慈相待，存憐憫的心，彼此饒恕，正如神在基督裡饒恕了你們一樣。\n\n這節經文甚至沒有提到婚姻。\n可是十年下來，他們發現：\n婚姻最需要的，不是更多技巧，\n而是學習在盟約裡，好好地做一個基督徒。\n\n第一，以恩慈相待。\n心理學家研究了上千對夫妻，發現婚姻最好的「高手」和最糟的「災難」，\n差別常常就在一件很小的事：恩慈。\n一天裡，夫妻會不斷向對方發出小小的「連結邀請」——\n「你看外面那隻鳥。」「今天好累喔。」「你聽這首歌。」\n對方可以轉向你，回應、好奇、關心；\n也可以轉開，繼續滑手機、看電視，或不耐煩地說「我在忙」。\n日積月累，這些小小的轉向或轉開，決定了婚姻的溫度。\n\n可是，研究只能告訴我們「要怎麼做」，\n卻無法改變那顆不想恩慈的心。\n\n第二，存憐憫的心。\n這是聖經比研究更深的地方。\n它不只要求你表現得溫柔，而是要你的心真的變軟。\n怎麼變？靠著看見——看見自己有多需要憐憫。\n\n第三，彼此饒恕，正如神在基督裡饒恕了你們。\n這是整節經文的發動機。\n我們能恩慈、能憐憫，不是因為對方值得，\n而是因為我們自己，早已在基督裡被饒恕了那麼多。\n\n技巧教你怎麼回應，福音改變你為什麼願意回應；\n研究告訴你什麼有效，十字架給你力量去做；\n專家說「要溫柔」，基督說「我已先溫柔待你」。\n\n今天，你的配偶向你發出了幾次小小的邀請？\n你轉向了，還是轉開了？\n你的心，是一塊越來越硬的石頭，還是一塊被恩典慢慢泡軟的土？\n\n願這一節經文，貼在你們家的冰箱上，\n更刻在你們的心上。\n當你忍不住想說重話時，看一眼；\n當你很難饒恕時，再看一眼——\n然後想起那個十字架，\n想起自己，也曾經是那個不配被饒恕、卻被饒恕的人。\n\n#婚姻 #以弗所書4章32節 #恩慈 #饒恕 #夫妻"}, "fifty-years-after-loving-v-virginia": {"zh": "「洛文訴維吉尼亞案」五十年後", "tags": ["福音與奧祕"], "core": "跨種族婚姻在基督裡不僅美好地反映基督與教會，更是基督藉死與復活所成就之合一的具體化身。", "sum": ["1967年美國最高法院一致裁定禁止跨種族婚姻的州法違憲；有些州到1998、2000年才修改州憲。", "這是值得慶祝的判決，但更重要的是：在基督裡的跨種族婚姻，推進而非破壞神啟示的旨意。", "至今仍有來自不同族群（包括一些福音派人士）的反對聲音。", "Piper 認為：基督徒必須確信，在基督裡的跨種族婚姻是基督合一工作的血肉見證。", "他同意學者觀點：文化上對通婚的禁忌，是教會種族分裂的核心；反對通婚是種族疏離與敵意最深的根源之一。"], "mm": {"c": "跨種族婚姻", "b": [["歷史", ["1967年判決", "各州遲遲修法"]], ["反對聲音", ["各族群都有", "以聖經為名"]], ["Piper的立場", ["反映基督與教會", "合一的化身"]], ["影響", ["通婚禁忌", "教會的種族分裂"]]]}, "fw": {"q": "基督徒該如何看待跨種族婚姻？", "a": "在基督裡，它彰顯十架所成就的合一", "steps": ["認識歷史中的不義", "檢視以聖經為名的反對", "以福音的合一來肯定它"], "do": ["檢視自己心中是否有種族偏見", "在教會中歡迎並支持跨族群家庭"]}, "gold": ["在基督裡的通婚，不是破壞神的旨意，而是推進它。", "反對通婚，是種族敵意最深的根之一。", "跨種族婚姻是福音合一的血肉見證。"], "ref": ["以弗所書 2:14-16", "使徒行傳 17:26"], "fb": "1958年，一對夫妻在華盛頓結婚。\n丈夫是白人，妻子是黑人與原住民的後裔。\n回到維吉尼亞州的家鄉後，他們被逮捕了，罪名是：以夫妻身分同居。\n九年後，美國最高法院一致裁定：禁止跨種族婚姻的法律違憲。\n那對夫妻的姓氏，恰好叫作「Loving」。\n\n這是一個值得慶祝的判決。\n但對基督徒來說，比法律更重要的，是神的心意。\n\n當時的法官曾說：神把各種族分在不同的大陸，就表示祂不要他們混在一起。\n很可惜，直到今天，仍有不同族群、
