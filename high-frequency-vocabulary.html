<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>必考高頻率單字</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1f2933;--mut:#66727f;--line:#dde3e9;--ac:#0a7ea4;--acbg:#e3f3f9;--ok:#1a7f4b;--okbg:#e2f5ea;--no:#c0392b;--nobg:#fdeaea;--hf:#0a7ea4}
@media (prefers-color-scheme:dark){:root{--bg:#14181d;--card:#1d232a;--tx:#e6eaee;--mut:#97a3af;--line:#313a44;--ac:#4cc2e6;--acbg:#173440;--ok:#5fd08f;--okbg:#17382a;--no:#ff8a7a;--nobg:#45211e;--hf:#4cc2e6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 "Segoe UI","Microsoft JhengHei","PingFang TC",sans-serif}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.bar{max-width:980px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar h1{font-size:18px;margin:0 8px 0 0;white-space:nowrap}
input,select,button{font:inherit;color:inherit}
#q{flex:1 1 200px;min-width:0;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
select{padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);max-width:100%}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--ac)}
.tabs{display:flex;gap:4px}
.tabs button.on,.tog.on{background:var(--ac);border-color:var(--ac);color:#fff}
main{max-width:980px;margin:0 auto;padding:16px}
.info{color:var(--mut);font-size:14px;margin:0 0 12px}
.w{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;scroll-margin-top:120px}
.w.flash{outline:2px solid var(--ac)}
.wh{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.wh .n{color:var(--mut);font-size:14px}
.wh h3{margin:0;font-size:22px;font-family:Georgia,"Times New Roman",serif}
.kk{color:var(--mut);font-family:"Lucida Sans Unicode","Segoe UI","Arial Unicode MS",sans-serif;font-size:14px}
.ib{border:0;background:none;padding:0 4px;font-size:16px;line-height:1}
.star{color:var(--mut)}.star.on{color:#e0a100}
.sp{flex:1}
.tag{display:inline-block;font-size:12px;padding:0 7px;border-radius:10px;background:var(--acbg);color:var(--ac);white-space:nowrap;margin-left:2px}
.defs{margin:6px 0}
.defs i,.c i{color:var(--mut);font-family:Georgia,serif}
.ex{margin:6px 0 0;padding:0;list-style:none}
.ex li{padding-left:16px;position:relative;margin-bottom:4px}
.ex li:before{content:"▸";position:absolute;left:0;color:var(--ac)}
.en{font-family:Georgia,"Times New Roman",serif}
.zh{color:var(--mut);font-size:15px}
.sec{font-size:13px;font-weight:700;color:var(--ac);margin:12px 0 4px;letter-spacing:2px}
.u{margin-bottom:8px}
.u>b{font-family:Georgia,serif}
.chain{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:2px 18px}
.c{font-size:15px}
.c b{font-family:Georgia,serif;font-weight:400}
.c b.hf{color:var(--hf);font-weight:700}
body.hide .zh,body.hide .defs span,body.hide .c .m{filter:blur(6px);cursor:pointer}
body.hide .zh:hover,body.hide .defs span:hover,body.hide .c .m:hover{filter:none}
.res{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin-bottom:6px;cursor:pointer;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.res:hover{border-color:var(--ac)}
.res b{font-family:Georgia,serif;font-size:17px}
.res small{color:var(--mut);margin-left:auto}
.qz h2{font-size:17px;margin:20px 0 8px}
.qq{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.qq .st{font-family:Georgia,serif}
.qq .src{color:var(--mut);font-size:12px}
.op{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin-top:6px}
.op button{text-align:left;font-family:Georgia,serif}
.op button.sel{border-color:var(--ac);background:var(--acbg)}
.op button.ok,select.ok{border-color:var(--ok);background:var(--okbg)}
.op button.no,select.no{border-color:var(--no);background:var(--nobg)}
.exp{display:none;margin-top:6px;font-size:14px;color:var(--mut)}
.done .exp{display:block}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-family:Georgia,serif}
.act{display:flex;gap:10px;align-items:center;margin:14px 0 30px}
.score{font-weight:700;font-size:18px}
.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.nav{display:flex;justify-content:space-between;margin:10px 0 30px}
</style>
</head>

to so many people gave her a tremendous sense of ____.","a":"J"},{"q":"The crocodile is a strange-looking ____. Most people think that it’s very ugly.","a":"D"},{"q":"Do kids really ____ the violence they see on TV?","a":"H"},{"q":"Since Jenny loves to read, she spends a lot of time ____ in bookstores.","a":"E"},{"q":"Helen went abroad to ____ her knowledge of music. She wanted to be a great musician.","a":"B"},{"q":"Jack ____ the whole class with his enthusiasm. Everyone became enthusiastic.","a":"I"},{"q":"The new mayor spoke of his ____ to regulate the traffic and reduce the crime rate.","a":"F"}]},{"n":32,"title":"Unit 17 學習篇II","mc":[{"q":"I hope my warning would ____ her to make more effort. She needs more motivation.","o":["intercept","originate","eliminate","stimulate"],"a":"D"},{"q":"Fear of change is the greatest single ____ to progress. We need to get rid of it.","o":["obstacle","course","label","survey"],"a":"A"},{"q":"Tomorrow it will be mostly cloudy, with a few sunny ____.","o":["intervals","risks","shortcomings","origins"],"a":"A"},{"q":"They offered their help ____. They were not forced by anyone.","o":["impulsively","strenuously","spontaneously","repetitively"],"a":"C"},{"q":"After she’d got over her ____ shyness, she became very friendly.","o":["distinctive","initial","progressive","gradual"],"a":"B"},{"q":"We’ll be given a brief ____ of the computer’s functions. Therefore, we’ll be able to use the computer more efficiently.","o":["inspiration","demonstration","preference","barrier"],"a":"B"},{"q":"These programs are designed to ____ cooperation among the players, so that there will be better teamwork.","o":["formulate","overthrow","swear","strengthen"],"a":"D"},{"q":"The ____ was passed by a two-thirds majority. Most members agreed to it.","o":["distinction","resolution","conflict","glamor"],"a":"B"},{"q":"I ____ his phone number in my address book because I was in a hurry.","o":["scribbled","prescribed","described","subscribed"],"a":"A"},{"q":"Our ____ was to defend and then counterattack.","o":["organ","conference","strategy","remembrance"],"a":"C"},{"q":"Parents are supposed to take the responsibility for teaching their children to ____ between right and wrong.","o":["recall","neglect","distinguish","evolve"],"a":"C"},{"q":"Some experts are doing some ____ on the economic development of the country, hoping to have a better understanding of it.","o":["challenge","persistence","charm","research"],"a":"D"},{"q":"It’s reckless to ____ such a problem because it could lead to a serious crisis.","o":["sweat","overlook","edit","consult"],"a":"B"},{"q":"There must be no ____ in this race. No one is allowed to meddle with it.","o":["interference","stage","duration","search"],"a":"A"},{"q":"Her designs have great ____. She can come up with new and different ideas.","o":["resolution","progression","originality","repetition"],"a":"C"}],"bank":["obtain","repeat","outcome","process","repetitious","swear","persisted","protest","spell","inspire"],"fill":[{"q":"We need a new leader－someone who can ____ the team and raise the morale.","a":"J"},{"q":"The farmers have extended the growing season to ____ a larger crop.","a":"A"},{"q":"She was very satisfied with the ____ of her efforts. The final result was rewarding.","a":"C"},{"q":"In spite of my warning, John ____ in carrying out his previous plan.","a":"G"},{"q":"Teaching him to read was a slow ____. It took patience and skill.","a":"D"},{"q":"A team of female workers took to the streets to ____ against being paid less than their male colleagues.","a":"H"},{"q":"Please ____ after me, “I must not be a naughty boy.”","a":"B"},{"q":"We all felt bored because it was a(n) ____ speech. The speaker said the same thing over and over.","a":"E"},{"q":"The prince fell under the ____ of her beauty. It was so magical.","a":"I"},{"q":"He said he was there all the time, but I ____ I never saw him. Obviously, he was telling a lie.","a":"F"}]},{"n":33,"title":"Unit 18 環境篇I","mc":[{"q":"This blouse is too big for me. I’ll have to ____ it.","o":["alter","charge","exert","expose"],"a":"A"},{"q":"We had to fight; there was no ____. It was the only way to save our country.","o":["drought","breeze","alternative","mainstream"],"a":"C"},{"q":"I won’t have my children go to school on a(n) ____ stomach. They must eat breakfast first.","o":["balanced","indispensable","frigid","empty"],"a":"D"},{"q":"The seamen’s strike has seriously ____ the country’s stock of food.","o":["depleted","melted","executed","inserted"],"a":"A"},{"q":"____ paper cups are generally used in our daily life. We throw them away after using them.","o":["Eternal","Ignorant","Deliberate","Disposable"],"a":"D"},{"q":"The old bank is going to be ____ into a fancy restaurant. We’ll not be able to use the bank anymore.","o":["converted","aroused","dumped","exhausted"],"a":"A"},{"q":"The government has repeatedly ____ that it will not change its policy.","o":["alternated","rotated","asserted","perished"],"a":"C"},{"q":"The farmers were ____ seeds on the farm. They expected a harvest a few months later.","o":["freezing","scattering","supposing","distinguishing"],"a":"B"},{"q":"The woods are ____ by many wild animals. They live and breed there.","o":["conveyed","ascended","pondered","inhabited"],"a":"D"},{"q":"The message was written in ____ ink. You need a special instrument to read it.","o":["immortal","desirable","invisible","conservative"],"a":"C"},{"q":"The polar bear is threatened with complete ____ now. They might not exist in the future.","o":["conservation","deletion","disposal","extinction"],"a":"D"},{"q":"The old shepherd ____ in a ruined cottage on the hillside and lived there by himself.","o":["cast","terminated","dwelled","littered"],"a":"C"},{"q":"There’s a(n) ____ possibility that she’ll be appointed director. We’re almost sure of it.","o":["distinct","dispensable","inaudible","splashing"],"a":"A"},{"q":"____ made an appeal to the public to save the earth. They tried hard to protect the planet.","o":["Extinguishers","Visions","Conservationists","Customs"],"a":"C"},{"q":"Because of human interference in nature, some species of animals will become ____ in the near future.","o":["converse","admonished","deserted","extinct"],"a":"D"}],"bank":["conservative","balance","arise","accused","deliberate","freezing","accustomed","forecast","maintain","ignore"],"fill":[{"q":"These people are ____ to hard work. They work all day long without any complaint.","a":"G"},{"q":"He was ____ of murder. The police believed he had killed his girlfriend.","a":"D"},{"q":"If any problems should ____, please let me know.","a":"C"},{"q":"That’s really a(n) ____ attitude to education. You need to be more liberal.","a":"A"},{"q":"We are supposed to make more effort to ____ a suitable living environment for our next generation.","a":"I"},{"q":"The naughty boy was punished severely because of his ____ act of vandalism.","a":"E"},{"q":"Try to keep a(n) ____ between work and play. Don’t overwork or play too much.","a":"B"},{"q":"He ____ good weather for the next two days and planned to go on an outing.","a":"H"},{"q":"Don’t ____ the fact that hard work brings success. You have to make more effort.","a":"J"},{"q":"As it was ____ cold outside, everyone stayed indoors and the streets were almost deserted.","a":"F"}]},{"n":34,"title":"Unit 18 環境篇II","mc":[{"q":"A lot of factory work is done by ____ workers. They come from foreign countries.","o":["moist","perceivable","migrant","preventive"],"a":"C"},{"q":"Plants use their roots to absorb ____ from the soil.","o":["moisture","survival","vitality","exile"],"a":"A"},{"q":"There was a(n) ____ of disease in this area. We had to take measures to stop it.","o":["outbreak","resource","prevention","occasion"],"a":"A"},{"q":"Hundreds of people ____ when the ship went down. They lost their lives in the shipwreck.","o":["committed","rescued","noticed","perished"],"a":"D"},{"q":"The mountaintop is covered in ____. We can’t see the top clearly.","o":["situation","engagement","solid","mist"],"a":"D"},{"q":"When the war broke out, they took ____ in foreign embassies. They got protection there.","o":["distress","perception","refuge","machinery"],"a":"C"},{"q":"Our ____ on the world is deeply influenced by our parents.","o":["vigor","outfit","outlook","marble"],"a":"C"},{"q":"The company has really ____ since we moved our factory to Tainan. The business is successful.","o":["avoided","addressed","flourished","permitted"],"a":"C"},{"q":"It’s a(n) ____ climb to the top of the mountain. It takes great effort to make it.","o":["steep","dynamic","spacious","indispensable"],"a":"A"},{"q":"His parents died in the accident, but he ____.","o":["revived","deceived","evacuated","survived"],"a":"D"},{"q":"Jack is now at the ____ of his career. He has become the president of a big enterprise.","o":["summit","outrage","site","spice"],"a":"A"},{"q":"We ____ that the policy is not practicable and that it could even lead to contamination of the environment.","o":["locate","perceive","induce","lay"],"a":"B"},{"q":"The pollution problem will have serious ____ for the future of our country, so we can’t be too careful.","o":["consequences","shelters","reasons","conditions"],"a":"A"},{"q":"The earthquake was the biggest ____ that I have ever experienced. It was really a nightmare.","o":["mist","temperature","paradox","disaster"],"a":"D"},{"q":"In writing this report, I have ____ all unnecessary details. Now, it’s quite concise.","o":["admitted","summoned","contaminated","omitted"],"a":"D"}],"bank":["species","shelter","layers","reduce","pebble","vital","migrate","pretending","space","situated"],"fill":[{"q":"Some tribes ____ with their cattle in search of fresh grass. They’re always on the move.","a":"G"},{"q":"Doctors have advised us to ____ the amount of salt in our diets.","a":"D"},{"q":"The hotel is conveniently ____ close to the beach. It’s in a perfect location.","a":"J"},{"q":"This rare bird has become an endangered ____. We must protect it carefully.","a":"A"},{"q":"She wasn’t really crying; she was only ____. In fact, she just wanted to win some sympathy.","a":"H"},{"q":"In the storm, he took ____ in a cave.","a":"B"},{"q":"The piano takes up too much ____. We should move it to another place.","a":"I"},{"q":"It’s widely known that fresh air is ____ to our health; accordingly, we can’t afford to pollute the air.","a":"F"},{"q":"She’s wearing several ____ of clothing to keep out the cold.","a":"C"},{"q":"The boy picked up a ____ and threw it into the lake.","a":"E"}]}]}</script>
<script>
const D=JSON.parse(document.getElementById('d').textContent),L=D.lessons,Z=D.quiz;
const $=s=>document.querySelector(s),m=$('#m'),sel=$('#sel'),qi=$('#q');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const POS=/\b((?:v|n|adj|adv|prep|conj|pron|aux|int|art|phr)\.)/g;
const lname=l=>`Unit ${l.unit} ${l.name}`;
let S={t:'w',li:0,zi:0};
let stars;try{stars=new Set(JSON.parse(localStorage.getItem('hfw-star')||'[]'))}catch(e){stars=new Set()}
const saveStars=()=>{try{localStorage.setItem('hfw-star',JSON.stringify([...stars]))}catch(e){}};
try{Object.assign(S,JSON.parse(localStorage.getItem('hfw-pos')||'{}'))}catch(e){}
const savePos=()=>{try{localStorage.setItem('hfw-pos',JSON.stringify(S))}catch(e){}};

function tags(t){if(!t)return'';if(t.indexOf('名校')>=0)return'<span class="tag">名校模擬考</span>';
  return t.replace(/(學|指) ([\d,]+)/g,(a,k,n)=>`<span class="tag">${k=='學'?'學測':'指考'} ${n}</span>`).replace(/[學指]\s*/g,'')}
function defHtml(d){const k=d.match(/^((?:(?:v|n|adj|adv|prep|conj|pron|aux|int|art)\.\s*)+)(.*)$/);
  return k?`<i>${esc(k[1])}</i> <span>${esc(k[2])}</span>`:`<span>${esc(d)}</span>`}
function exHtml(a){return a.length?'<ul class="ex">'+a.map(e=>`<li><span class="en">${e.en}</span> <button class="ib say" data-s="${esc(e.en.replace(/<[^>]+>/g,''))}" title="朗讀">🔊</button><br><span class="zh">${esc(e.zh)}</span></li>`).join('')+'</ul>':''}
function chainHtml(c){const d=esc(c.d).replace(/〔(學|指) ([\d,]+)〕/g,(a,k,n)=>`<span class="tag">${k=='學'?'學測':'指考'} ${n}</span>`).replace(POS,'<i>$1</i>');
  return `<div class="c"><b class="${c.hf?'hf':''}">${esc(c.w)}</b> <span class="kk">${esc(c.kk)}</span> <span class="m">${d}</span></div>`}
function wordHtml(w,li){const id=li+'-'+w.n;
  return `<article class="w" id="w-${id}"><div class="wh"><span class="n">${w.n}.</span><h3>${esc(w.w)}</h3><span class="kk">${esc(w.kk)}</span>
<button class="ib say" data-s="${esc(w.w)}" title="發音">🔊</button><span class="sp"></span>${tags(w.tags)}
<button class="ib star ${stars.has(id)?'on':''}" data-id="${id}" title="加入星號">★</button></div>
<div class="defs">${w.defs.map(defHtml).join('<br>')}</div>${exHtml(w.ex)}
${w.use.length?'<div class="sec">用法</div>'+w.use.map(u=>`<div class="u">${u.p?`<b>${esc(u.p)}</b> `:''}<span class="zh">${esc(u.zh)}</span>${exHtml(u.ex)}</div>`).join(''):''}
${w.chain.length?'<div class="sec">連鎖記憶</div><div class="chain">'+w.chain.map(chainHtml).join('')+'</div>':''}</article>`}

function fillSel(){let h='';
  if(S.t=='z')h=Z.map((z,i)=>`<option value="${i}">第 ${z.n} 回　${esc(z.title)}</option>`).join('');
  else{if(S.t=='w')h='<option value="-1">★ 我的星號單字</option>';h+=L.map((l,i)=>`<option value="${i}">${lname(l)}（${l.words.length}）</option>`).join('')}
  sel.innerHTML=h;sel.value=S.t=='z'?S.zi:S.li;if(sel.selectedIndex<0){sel.selectedIndex=0;S.li=+sel.value}}
function navHtml(i,n){return `<div class="nav"><button data-go="${i-1}" ${i<=0?'disabled':''}>← 上一課</button><button data-go="${i+1}" ${i>=n-1?'disabled':''}>下一課 →</button></div>`}

function render(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==S.t));
  if(S.t!='w'&&S.li<0)S.li=0;fillSel();savePos();
  if(S.t=='w'){
    if(S.li<0){const a=[];L.forEach((l,li)=>l.words.forEach(w=>{if(stars.has(li+'-'+w.n))a.push(wordHtml(w,li))}));
      m.innerHTML=`<p class="info">星號單字共 ${a.length} 個（按單字右上角的 ★ 加入或移除）</p>`+a.join('')}
    else{const l=L[S.li];const cn=l.words.reduce((s,w)=>s+w.chain.length,0);
      m.innerHTML=`<p class="info">${lname(l)}・主單字 ${l.words.length} 個・連鎖單字 ${cn} 個・課本第 ${l.page} 頁起。藍色粗體為大考曾出現的單字。</p>`+l.words.map(w=>wordHtml(w,S.li)).join('')+navHtml(S.li,L.length)}
  }else if(S.t=='e'){const l=L[S.li];
    m.innerHTML=`<div class="qz"><p class="info">${lname(l)}・作答後按「對答案」，會顯示正解與中譯。</p><h2>基礎練功題</h2>${l.ex1.map((q,i)=>mcHtml(q,i,'a')).join('')}<h2>大考模擬題</h2>${l.ex2.map((q,i)=>mcHtml(q,i,'b')).join('')}${actHtml()}</div>`+navHtml(S.li,L.length)
  }else{const z=Z[S.zi];
    m.innerHTML=`<div class="qz"><p class="info">實力評量 第 ${z.n} 回・${esc(z.title)}・每題 4 分，共 100 分。</p><h2>一、字彙選擇（60%）</h2>${z.mc.map((q,i)=>mcHtml(q,i,'a')).join('')}
<h2>二、字彙選填（40%）</h2><div class="bank">${z.bank.map((b,i)=>`<span>(${'ABCDEFGHIJ'[i]}) ${esc(b)}</span>`).join('')}</div>
${z.fill.map((q,i)=>`<div class="qq" data-a="${q.a}"><span class="st">${i+1}. ${blank(q.q)}</span> <select class="fs"><option value="">－</option>${z.bank.map((b,j)=>`<option value="${'ABCDEFGHIJ'[j]}">(${'ABCDEFGHIJ'[j]}) ${esc(b)}</option>`).join('')}</select><div class="exp"></div></div>`).join('')}${actHtml()}</div>`+navHtml(S.zi,Z.length)}
}
const blank=s=>esc(s).replace('____','<u>　　　　</u>');
function mcHtml(q,i,g){return `<div class="qq" data-a="${q.a}"><div class="st">${i+1}. ${blank(q.q)} ${q.src?`<span class="src">${esc(q.src)}</span>`:''}</div>
<div class="op">${q.o.map((o,j)=>`<button data-v="${'ABCD'[j]}">(${'ABCD'[j]}) ${esc(o)}</button>`).join('')}</div>
<div class="exp">${q.zh?esc(q.zh)+'<br>'+q.ozh.map((o,j)=>`(${'ABCD'[j]}) ${esc(o)}`).join('　'):''}</div></div>`}
const actHtml=()=>'<div class="act"><button class="pri" id="chk">對答案</button><button id="redo">重做</button><span class="score" id="sc"></span></div>';
function grade(){let ok=0,n=0;m.querySelectorAll('.qq').forEach(q=>{n++;const a=q.dataset.a;q.classList.add('done');
    const s=q.querySelector('select');
    if(s){const r=s.value==a;ok+=r;s.classList.add(r?'ok':'no');if(!r)q.querySelector('.exp').textContent='正解：('+a+') '+Z[S.zi].bank['ABCDEFGHIJ'.indexOf(a)];s.disabled=true}
    else{q.querySelectorAll('.op button').forEach(b=>{const v=b.dataset.v;if(v==a)b.classList.add('ok');else if(b.classList.contains('sel'))b.classList.add('no');
      if(v==a&&b.classList.contains('sel'))ok++;b.disabled=true})}});
  $('#sc').textContent=S.t=='z'?`得分 ${ok*4} 分（答對 ${ok} / ${n}）`:`答對 ${ok} / ${n}`}

let IDX=null;
function buildIdx(){IDX=[];L.forEach((l,li)=>l.words.forEach(w=>{const z=w.defs.join('；');
  IDX.push({t:w.w,z,li,n:w.n,k:0});
  w.use.forEach(u=>IDX.push({t:u.p||w.w,z:u.zh,li,n:w.n,k:1,of:w.w}));
  w.chain.forEach(c=>IDX.push({t:c.w,z:c.d.replace(/〔[^〕]*〕/g,'').trim(),li,n:w.n,k:2,of:w.w}))}))}
function search(s){if(!IDX)buildIdx();s=s.toLowerCase();const r=[];
  for(const x of IDX){const t=x.t.toLowerCase();let sc=-1;
    if(t==s)sc=0;else if(t.startsWith(s))sc=1;else if(t.includes(s))sc=2;else if(x.z.toLowerCase().includes(s))sc=3;
    if(sc>=0)r.push([sc*10+x.k,x])}
  r.sort((a,b)=>a[0]-b[0]||a[1].t.localeCompare(b[1].t));
  const KN=['','片語','連鎖'];
  m.innerHTML=`<p class="info">找到 ${r.length} 筆${r.length>150?'，顯示前 150 筆':''}（點一下跳到該單字）</p>`+r.slice(0,150).map(([,x])=>
    `<div class="res" data-li="${x.li}" data-n="${x.n}"><b>${esc(x.t)}</b><span class="zh">${esc(x.z).replace(POS,'<i>$1</i>')}</span><small>${x.k?KN[x.k]+'・'+esc(x.of)+'｜':''}${lname(L[x.li])}</small></div>`).join('')}
function jump(li,n){qi.value='';S.t='w';S.li=li;render();const e=document.getElementById('w-'+li+'-'+n);
  if(e){e.scrollIntoView();e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),1600)}}
function say(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\.\.\./g,' '));u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}

qi.addEventListener('input',()=>{const s=qi.value.trim();if(s)search(s);else render()});
sel.addEventListener('change',()=>{if(S.t=='z')S.zi=+sel.value;else S.li=+sel.value;qi.value='';render();scrollTo(0,0)});
$('#hide').addEventListener('click',e=>{e.target.classList.toggle('on',document.body.classList.toggle('hide'))});
document.querySelector('.tabs').addEventListener('click',e=>{const t=e.target.dataset.t;if(t){S.t=t;qi.value='';render();scrollTo(0,0)}});
m.addEventListener('click',e=>{const b=e.target.closest('button,.res');if(!b)return;
  if(b.classList.contains('res'))return jump(+b.dataset.li,+b.dataset.n);
  if(b.classList.contains('say'))return say(b.dataset.s);
  if(b.classList.contains('star')){const id=b.dataset.id;stars.has(id)?stars.delete(id):stars.add(id);b.classList.toggle('on',stars.has(id));return saveStars()}
  if(b.dataset.go!=null){if(S.t=='z')S.zi=+b.dataset.go;else S.li=+b.dataset.go;render();return scrollTo(0,0)}
  if(b.id=='chk')return grade();
  if(b.id=='redo'){render();return scrollTo(0,0)}
  if(b.dataset.v){b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x==b))}});
render();
</script>
</body>
</html>
