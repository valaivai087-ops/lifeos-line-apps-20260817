<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>學測英文完整系統 - 雙語詞彙版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', -apple-system, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #2c3e50;
        }
        .main-container { display: flex; height: 100vh; }
        .sidebar {
            width: 280px;
            background: white;
            overflow-y: auto;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }
        .sidebar h3 {
            font-size: 13px;
            font-weight: 700;
            color: #667eea;
            margin: 14px 0 6px 0;
            padding-bottom: 4px;
            border-bottom: 2px solid #667eea;
        }
        .menu-item {
            padding: 8px 12px;
            margin: 3px 0;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
            color: #666;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }
        .menu-item:hover { background: #f0f0f0; color: #667eea; border-left-color: #667eea; }
        .menu-item.active { background: #667eea; color: white; font-weight: 600; border-left-color: #667eea; }
        .content { flex: 1; overflow-y: auto; padding: 28px; background: white; }
        .header { font-size: 26px; font-weight: 700; color: #667eea; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 3px solid #667eea; }
        .subheader { font-size: 15px; font-weight: 700; color: #333; margin: 20px 0 10px 0; padding-bottom: 6px; border-bottom: 2px solid #ddd; }
        .text { font-size: 13px; color: #555; line-height: 1.8; margin: 12px 0; }
        .box {
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            padding: 12px;
            margin: 12px 0;
            border-radius: 4px;
            font-size: 13px;
            color: #333;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            line-height: 1.6;
        }
        .key-point {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 14px;
            border-radius: 6px;
            margin: 12px 0;
            font-size: 13px;
            line-height: 1.7;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            font-size: 12px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-weight: 700;
            font-size: 12px;
        }
        tr:hover { background: #f0f0f0; }
        .bilingual-cell {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .en { color: #667eea; font-weight: 600; font-size: 12px; }
        .zh { color: #666; font-size: 11px; }
        .quiz-q {
            background: #f9f9f9;
            padding: 14px;
            margin: 10px 0;
            border-radius: 4px;
            border-left: 3px solid #667eea;
        }
        .quiz-num { font-weight: 700; color: #667eea; font-size: 13px; margin-bottom: 6px; }
        .quiz-text { margin: 6px 0; font-size: 12px; color: #333; }
        .option { padding: 3px 0; font-size: 12px; color: #666; margin-left: 16px; }
    </style>
</head>

                    {n:"12",t:"Sleep can ___ your health.",o:["(A) affect ✓","(B) effect","(C) efect","(D) affection"],e:"affect(V)"},
                    {n:"13",t:"Test is difficult. ___, Amy got high score.",o:["(A) However ✓","(B) Therefore","(C) So","(D) Because"],e:"方向相反"},
                    {n:"14",t:"It was raining, ___ we stayed home.",o:["(A) so ✓","(B) but","(C) however","(D) although"],e:"邏輯因果"},
                    {n:"15",t:"She is ___ to the environment.",o:["(A) adapt","(B) adapting ✓","(C) adaptation","(D) adaptive"],e:"verb form"},
                    {n:"16",t:"He enjoys ___ basketball.",o:["(A) play","(B) playing ✓","(C) played","(D) to play"],e:"enjoy+V-ing"},
                    {n:"17",t:"We ___ forward to seeing you.",o:["(A) look ✓","(B) see","(C) wait","(D) expect"],e:"look forward to"},
                    {n:"18",t:"The book ___ of sections.",o:["(A) consist ✓","(B) consists","(C) consisted","(D) consisting"],e:"consist of"},
                    {n:"19",t:"She looks healthy and ___.",o:["(A) slim ✓","(B) skinny","(C) thin","(D) lean"],e:"語氣正面"},
                    {n:"20",t:"unhappy meaning?",o:["(A) 開心","(B) 不開心 ✓","(C) 幸運","(D) 悲傷"],e:"un- = 不"},
                    {n:"21",t:"The boy with dogs ___ every morning.",o:["(A) run ✓","(B) runs","(C) running","(D) to run"],e:"the boy is subject"},
                    {n:"22",t:"I was very ___, so I drank.",o:["(A) thirsty ✓","(B) sleepy","(C) tired","(D) hungry"],e:"語意邏輯"},
                    {n:"23",t:"The film ___ me of memories.",o:["(A) remembered","(B) reminded ✓","(C) recall","(D) recall"],e:"remind sb of"},
                    {n:"24",t:"She is ___ for project success.",o:["(A) responsibility","(B) responsible ✓","(C) responsibly","(D) respond"],e:"need adjective"},
                    {n:"25",t:"We need to ___ this problem.",o:["(A) solve ✓","(B) resolve","(C) solution","(D) solvable"],e:"solve a problem"}
                ],
                part2: Array.from({length:25},(_, i) => ({n:String(26+i).padStart(2,'0'),t:`Question ${26+i}: Sample.`,o:["(A) option1","(B) option2 ✓","(C) option3","(D) option4"],e:"Sample explanation"})),
                part3: Array.from({length:25},(_, i) => ({n:String(51+i).padStart(2,'0'),t:`Question ${51+i}: Sample.`,o:["(A) option1","(B) option2 ✓","(C) option3","(D) option4"],e:"Sample explanation"})),
                part4: Array.from({length:25},(_, i) => ({n:String(76+i).padStart(2,'0'),t:`Question ${76+i}: Sample.`,o:["(A) option1","(B) option2 ✓","(C) option3","(D) option4"],e:"Sample explanation"}))
            };
        }

        // ===== 初始化 =====
        function init() {
            renderSidebar();
            renderErrorDetail("01");
        }

        function renderSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = '';
            menuStructure.forEach(section => {
                const h3 = document.createElement('h3');
                h3.textContent = section.title;
                sidebar.appendChild(h3);
                section.items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'menu-item';
                    div.textContent = item.name;
                    div.onclick = () => switchSection(item.id, div);
                    sidebar.appendChild(div);
                });
            });
        }

        function switchSection(id, element) {
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            element.classList.add('active');
            if (id.startsWith('error-')) {
                renderErrorDetail(id.replace('error-', ''));
            } else if (id === 'vocab-confusables') {
                renderConfusables();
            } else if (id === 'vocab-family') {
                renderFamily();
            } else if (id === 'vocab-collocation') {
                renderCollocation();
            } else if (id === 'vocab-prep') {
                renderPrepBank();
            } else if (id === 'vocab-multimeaning') {
                renderMultimeaning();
            } else if (id === 'word-prefix-100') {
                renderPrefix();
            } else if (id === 'word-root-100') {
                renderRoot();
            } else if (id === 'word-suffix-100') {
                renderSuffix();
            } else if (id.startsWith('quiz-')) {
                renderQuiz(id.replace('quiz-part', ''));
            }
        }

        function renderErrorDetail(num) {
            const error = allErrors.find(e => e.id === num);
            if (!error) return;
            const content = document.getElementById('content');
            content.innerHTML = `<div class="header">${error.id}. ${error.name}</div><div class="subheader">例題</div><div class="box">${error.example}</div><div class="subheader">答案</div><div class="key-point">${error.answer}</div>`;
        }

        function renderConfusables() {
            const content = document.getElementById('content');
            let html = '<div class="header">易混字詞 Bank (80+組 - 雙語)</div><table><tr><th style="width:40%">English 英文</th><th style="width:60%">中文</th></tr>';
            confusablesData.forEach(item => {
                html += `<tr><td><div class="bilingual-cell"><span class="en">${item.en}</span></div></td><td><div class="bilingual-cell"><span class="zh">${item.zh}</span></div></td></tr>`;
            });
            html += '</table>';
            content.innerHTML = html;
        }

        function renderFamily() {
            const content = document.getElementById('content');
            let html = '<div class="header">詞族完整系統 (30組 - 雙語)</div><table><tr><th style="width:10%">字根</th><th style="width:20%">名詞 N</th><th style="width:20%">動詞 V</th><th style="width:25%">形容詞 Adj</th><th style="width:25%">副詞 Adv</th></tr>';
            familyData.forEach(item => {
                html += `<tr><td><strong>${item.en}</strong><br><small>${item.zh}</small></td><td><div class="bilingual-cell"><span class="en">${item.forms.N.split('/')[0]}</span><span class="zh">${item.forms.N.split('/')[1]}</span></div></td><td><div class="bilingual-cell"><span class="en">${item.forms.V.split('/')[0]}</span><span class="zh">${item.forms.V.split('/')[1]}</span></div></td><td><div class="bilingual-cell"><span class="en">${item.forms.Adj.split('/')[0]}</span><span class="zh">${item.forms.Adj.split('/')[1]}</span></div></td><td><div class="bilingual-cell"><span class="en">${item.forms.Adv.split('/')[0]}</span><span class="zh">${item.forms.Adv.split('/')[1]}</span></div></td></tr>`;
            });
            html += '</table>';
            content.innerHTML = html;
        }

        function renderCollocation() {
            const content = document.getElementById('content');
            let html = '<div class="header">高頻搭配 Bank (120+組 - 雙語)</div><table><tr><th style="width:45%">English 英文</th><th style="width:55%">中文</th></tr>';
            collocationData.forEach(item => {
                html += `<tr><td><div class="bilingual-cell"><span class="en">${item.en}</span></div></td><td><div class="bilingual-cell"><span class="zh">${item.zh}</span></div></td></tr>`;
            });
            html += '</table>';
            content.innerHTML = html;
        }

        function renderPrepBank() {
            const content = document.getElementById('content');
            let html = '<div class="header">介詞搭配 Bank (52組 - 雙語)</div><table><tr><th style="width:20%">Word 詞</th><th style="width:10%">Prep 介詞</th><th style="width:70%">Meaning 含義</th></tr>';
            prepData.forEach(item => {
                html += `<tr><td><strong>${item.word}</strong></td><td><strong>${item.prep}</strong></td><td><div class="bilingual-cell"><span class="en">${item.word} ${item.prep}...</span><span class="zh">${item.zh}</span></div></td></tr>`;
            });
            html += '</table>';
            content.innerHTML = html;
        }

        function renderMultimeaning() {
            const content = document.getElementById('content');
            let html = '<div class="header">多義字 Bank (80+ - 雙語)</div><table><tr><th style="width:15%">Word 詞</th><th style="width:28%">Meaning 1</th><th style="width:28%">Meaning 2</th><th style="width:29%">Meaning 3</th></tr>';
            multiMeaningData.forEach(item => {
                html += `<tr><td><strong>${item.word}</strong></td><td><div class="bilingual-cell"><span class="en">${item.m1.split(' ')[0]}</span><span class="zh">${item.m1.split(' ').slice(1).join(' ')}</span></div></td><td><div class="bilingual-cell"><span class="en">${item.m2.split(' ')[0]}</span><span class="zh">${item.m2.split(' ').slice(1).join(' ')}</span></div></td><td><div class="bilingual-cell"><span class="en">${item.m3.split(' ')[0]}</span><span class="zh">${item.m3.split(' ').slice(1).join(' ')}</span></div></td></tr>`;
            });
            html += '</table>';
            content.innerHTML = html;
        }

        function renderPrefix() {
            const content = document.getElementById('content');
            let html = '<div class="header">字首 Prefix (100個 - 雙語)</div><table><tr><th style="width:10%">#</th><th style="width:20%">Prefix</th><th style="width:35%">Example 例字</th><th style="width:35%">中文</th></tr>';
            prefixData.forEach((item, idx) => {
                const [en, zh] = item.ex.split('/');
                html += `<tr><td>${idx + 1}</td><td><strong>${item.prefix}</strong></td><td><span class="en">${en}</span></td><td><span class="zh">${zh}</span></td></tr>`;
            });
            html += '</table>';
            content.innerHTML = html;
        }

        function renderRoot() {
            const content = document.getElementById('content');
            let html = '<div class="header">字根 Root (100+個 - 雙語)</div><table><tr><th style="width:10%">#</th><th style="width:15%">Root</th><th style="width:37%">Example 例字</th><th style="width:38%">中文</th></tr>';
            rootData.forEach((item, idx) => {
                const [en, zh] = item.ex.split('/');
                html += `<tr><td>${idx + 1}</td><td><strong>${item.root}</strong></td><td><span class="en">${en}</span></td><td><span class="zh">${zh}</span></td></tr>`;
            });
            html += '</table>';
            content.innerHTML = html;
        }

        function renderSuffix() {
            const content = document.getElementById('content');
            let html = '<div class="header">字尾 Suffix (100個 - 雙語)</div><table><tr><th style="width:10%">#</th><th style="width:15%">Suffix</th><th style="width:37%">Example 例字</th><th style="width:38%">中文</th></tr>';
            suffixData.forEach((item, idx) => {
                const [en, zh] = item.ex.split('/');
                html += `<tr><td>${idx + 1}</td><td><strong>${item.suf}</strong></td><td><span class="en">${en}</span></td><td><span class="zh">${zh}</span></td></tr>`;
            });
            html += '</table>';
            content.innerHTML = html;
        }

        function renderQuiz(part) {
            const content = document.getElementById('content');
            const quizzes = generateQuizzes()[`part${part}`] || [];
            let html = `<div class="header">診斷測驗 - PART ${part}</div>`;
            quizzes.forEach(q => {
                html += `<div class="quiz-q"><div class="quiz-num">${q.n}. ${q.t}</div><div>${q.o.map(opt => `<div class="option">${opt}</div>`).join('')}</div><div class="key-point" style="margin-top: 8px;">💡 ${q.e}</div></div>`;
            });
            content.innerHTML = html;
        }

        init();
    </script>
</body>
</html>
