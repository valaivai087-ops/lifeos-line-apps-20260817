# 總覽
## 一句話與口訣
> **B1–B5＝找機制｜B6＝驗因果｜B7＝驗人體｜B8＝驗產品**
> 前5 BANK找「為什麼」；後3 BANK驗「真的假的」。

### 最好背口訣（營養素偵探流程）
**人 → 胞 → 路 → 手 → 開 → 驗 → 人 → 品**
B1 看人出了什麼問題 → B2 找哪個細胞 → B3 找哪條路 → B4 找誰動手 → B5 找誰控制開關 → B6 實驗驗真假 → B7 真人驗效果 → B8 看能不能套到我的產品。

> 「看人、找胞、追路、抓手、查開關；實驗驗因果、臨床驗人體、轉譯驗產品。」

### 八個問題
- B1｜人怎麼了？
- B2｜哪個細胞？
- B3｜哪條路？
- B4｜誰動手？
- B5｜誰控制？
- B6｜真的試過？
- B7｜真人有效？
- B8｜能套我的產品？

### 真正的商業價值
不是把每支產品的「功效數量最大化」，而是把每一個功效的**證據可追溯性最大化**：看到任何一句產品敘述，都能一路追回 Phenotype → Cell → Pathway → Protein → Gene → Experiment → Human → Product。同一套母體可同時拿來做產品篩選、群友教育、文章寫作，並避免把前臨床機制誤寫成人體療效。

## 八大BANK總表
| BANK | 白話核心 | 必存資料 | 最重要問題 | 任務 | 最後產出 |
|---|---|---|---|---|---|
| **B1 Phenotype 表型** | 人怎麼了？ | 症狀、徵象、Biomarker、功能、Baseline | 發生什麼？能不能量？ | 找需求｜定義真正問題 | 可測量需求（Problem Statement） |
| **B2 Cell 細胞** | 哪間工廠？ | Cell、Organelle、Function | 哪種細胞？哪個零件？哪個功能？ | 找位置｜定位作用細胞 | Cell × Function |
| **B3 Pathway 路徑** | 哪條路？ | 上游、路徑、下游 | 誰啟動？怎麼傳？最後造成什麼？ | 找機制｜找訊號流程 | Mechanism Map |
| **B4 Protein 蛋白質** | 誰動手？ | Receptor、Enzyme、Target | 哪個受體、酵素、蛋白在執行？ | 找執行者 | Molecular Target |
| **B5 Gene 基因調控** | 誰控制？ | Expression、Regulation | 哪個基因開關變了？ | 找上游控制 | Regulation Map |
| **B6 Experiment 實驗** | 真的嗎？ | Cell、Animal、Human | 試管？動物？人體？改它真的會改結果？ | 驗機制與因果 | Evidence Level |
| **B7 Clinical 臨床** | 人有效嗎？ | RCT、Meta、Outcome、Safety | 有效多少？誰有效？安全嗎？ | 驗人體效益 | Clinical Evidence |
| **B8 Translation 轉譯** | 我的產品呢？ | 研究Dose vs 產品Dose | 同成分？同型態？同劑量？同族群？ | 研究→產品轉譯 | Product Evidence |

## 8 BANK 運作流程（三道Gate）
```
【客人／疾病／需求】
        ↓
B1｜Phenotype　我到底要改什麼？
        ↓
B2｜Cell　　　問題可能發生在哪？
        ↓
B3｜Pathway　 機制怎麼走？
        ↓
B4｜Protein　 真正誰在執行？
        ↓
B5｜Gene　　　上游如何調控？
──── 前五庫＝建立 Mechanism ────
        ↓
B6｜Experiment　這個機制真的被驗證？
──── B6＝Causality Gate ────
        ↓
B7｜Clinical　真人真的得到好處？
──── B7＝Human Benefit Gate ────
        ↓
B8｜Translation　這個研究真的能套到我的產品？
──── B8＝Product Gate ────
        ↓
【產品定位】→【推薦強度】→【Baseline】→【介入】→【Retest】→【保留／調整／停止】
```

## 24問（每個BANK只記三題）
| BANK | 三個必問 |
|---|---|
| **B1 表型** | 什麼問題？多嚴重？怎麼量？ |
| **B2 細胞** | 哪個細胞？哪個胞器？哪個功能？ |
| **B3 路徑** | 誰啟動？怎麼傳？最後做什麼？ |
| **B4 蛋白** | 誰執行？在哪裡？活性真的變了嗎？ |
| **B5 基因** | 哪個Gene？怎麼調控？Protein跟著變嗎？ |
| **B6 實驗** | 在哪做？Dose多少？能證明因果嗎？ |
| **B7 臨床** | 誰吃？改善多少？安全嗎？ |
| **B8 轉譯** | 同成分？同Dose？真的能套到我的產品嗎？ |

## 紅黃綠燈（產品功效證據燈號）
| 燈號 | 條件 | 怎麼用 |
|---|---|---|
| 🟢 **GREEN 綠燈** | 人體證據較完整＋產品成分／劑量具有合理可比性＋安全性可接受 | 可以當主要知識重點 |
| 🟡 **YELLOW 黃燈** | 有人體研究，但劑量、族群、結果或產品匹配度有限 | 寫：「有相關人體研究，但仍有條件與限制。」 |
| 🟠 **ORANGE 橘燈** | 主要是 Cell／Animal／Mechanism | 只能當「機制研究」 |
| 🔴 **RED 紅燈** | 只有推論、研究與產品不匹配，或安全風險超過可接受範圍 | 不應拿來當產品功效 |

## 證據五格 A–E
跑完8 BANK後，才決定一個功效應放在哪一格：
- **A｜人體功效證據**
- **B｜人體Biomarker證據**
- **C｜Mechanism機制證據**
- **D｜Preclinical前臨床證據**
- **E｜Hypothesis假說**

這樣產品資料庫不再只是「收集很多功效」，而是：每一個功效，都知道它從哪裡來、證據走到哪裡、能不能合理套到自己的產品。

## 示範｜王牌 × 槲皮素（Quercetin × Nrf2）
看到一篇「Quercetin與Nrf2相關研究」，不要馬上放進「王牌功效」。跑BANK：
```
B1｜人　研究最後想改善什麼Phenotype？
B2｜胞　研究的是什麼Cell？
B3｜路　Nrf2上游與下游怎麼變？
B4｜手　涉及哪些Protein／Enzyme？
B5｜開　哪些Gene Expression改變？
B6｜驗　細胞？動物？還是人體？用了多少Quercetin？
B7｜人　人體RCT真的改善重要Outcome嗎？
B8｜品　研究的Quercetin型態＋Dose 和「王牌」實際提供的量一樣嗎？
```
研究說 Quercetin 有效、產品也有 Quercetin —— 中間不能直接畫「＝」。

## 每支產品做「8張身分證」（以王牌為例）
不要只有：「抗氧化＋免疫＋發炎。」
```
【王牌｜B1 Phenotype】哪些人體Outcome有研究？哪些只是推論？
【B2 Cell】Immune Cell？Mast Cell？Endothelial Cell？其他？
【B3 Pathway】Redox、Nrf2、Inflammatory signaling……
【B4 Protein】真正涉及哪些Target？直接／間接？
【B5 Gene】有哪些Expression研究？Cell？Animal？Human？
【B6 Experiment】每條機制：E0／E1／E2／E3／E4／E5／E6？
【B7 Clinical】RCT？Meta-analysis？Outcome？Effect Size？Safety？
【B8 Translation】
　研究Ingredient vs 王牌Ingredient
　研究Dose　　　vs 王牌Dose
　研究Form　　　vs 王牌Form
　研究Outcome　 vs 王牌能合理主張的範圍
```

# 8 BANK
## B1｜Phenotype 表型庫＝「這個人到底發生什麼？」
整個系統的**入口**。口訣：**症 → 徵 → 指 → 功 → 起**

功能醫學最容易犯的第一個錯誤：症狀 → 猜機制 → 推產品。
> 應改成：**症狀 → 定義Phenotype → 排除重要疾病 → 建Baseline → 才往下追機制。**

### ① Symptoms 症狀＝本人感覺得到的問題
疲勞、失眠、腹脹、疼痛、頭暈、腦霧、心悸。但不能只存「疲勞」，還要拆：
- **Onset**｜何時開始？
- **Duration**｜多久？
- **Frequency**｜多久一次？
- **Severity**｜多嚴重？
- **Trigger**｜什麼會誘發？
- **Relieving Factor**｜什麼會改善？
- **Associated Symptoms**｜還伴隨什麼？

白話：不是只問「你累不累？」而是：什麼時候累？怎麼累？多累？什麼讓你更累？休息會不會好？

### ② Signs 徵象＝別人可以客觀觀察或測量
Blood Pressure 血壓、Heart Rate 心率、Temperature 體溫、Body Weight 體重、Waist Circumference 腰圍。
> Symptom＝本人感受到。Sign＝可以客觀觀察。

### ③ Biomarker 生物標記
Glucose 血糖、HbA1c 糖化血色素、LDL-C、Triglycerides 三酸甘油酯、CRP、Ferritin 鐵蛋白、Vitamin B12、25-OH Vitamin D 等。
> **Biomarker ≠ Disease**。CRP升高只告訴你某些情況下存在較高的發炎相關訊號，不能只靠CRP回答「是哪個疾病？哪個Pathway？該吃哪個產品？」

### ④ Function 功能
Sleep Function 睡眠、Exercise Capacity 運動能力、Cognitive Function 認知、Digestive Function 消化、Muscle Strength 肌力。
有時Lab沒有巨大改變，但Function真的改善，仍可能具有實際意義。

### ⑤ Baseline 起點
```
Baseline → Intervention → 2–8週等適當時間 → Retest → Difference
```
時間不能固定套用所有指標，要依介入與Outcome決定。

### B1最後產出：Problem Statement 問題定義
不是「這個人適合Q10」，而是：
> 「主要問題＝活動後疲勞；持續8週；睡眠後只有部分改善；目前尚未知道病因，需要先完成必要臨床評估與建立可追蹤Outcome。」

### 對你最有用
群友說「最近很累」，不要立刻「吃粒線寶」。而是：累是Phenotype → 先定義 → 找可測指標 → 再找機制 → 最後才配產品。

## B2｜Cell 細胞庫＝「事情發生在哪間工廠？」
B1看到的是結果，B2開始問：哪些細胞可能生成這個結果？
固定公式：**Cell → Organelle → Process → Function**（哪個細胞 → 哪個零件 → 哪個功能）

### ① Cell Type
| Cell | 中文 | 白話工作 |
|---|---|---|
| **Enterocyte** | 腸上皮細胞 | 海關＋城牆 |
| **Hepatocyte** | 肝細胞 | 化學處理廠 |
| **Adipocyte** | 脂肪細胞 | 能量倉庫＋訊號站 |
| **Myocyte** | 肌肉細胞 | 動力工廠 |
| **Neuron** | 神經元 | 電訊中心 |
| **Endothelial Cell** | 血管內皮細胞 | 血管內壁控制中心 |
| **Macrophage** | 巨噬細胞 | 清道夫＋警衛 |
| **T Cell** | T細胞 | 精準免疫部隊 |
| **B Cell** | B細胞 | 抗體部隊 |
| **Mast Cell** | 肥大細胞 | 警報器 |
| **β Cell** | 胰島β細胞 | 胰島素工廠 |

### ② Organelle 胞器
- **Mitochondria 粒線體**＝發電＋代謝樞紐
- **Nucleus 細胞核**＝DNA與基因調控中心（資料中心）
- **ER 內質網**＝蛋白質／脂質製造與加工
- **Lysosome 溶酶體**＝分解與回收
- **Peroxisome 過氧化體**＝部分脂質代謝與氧化還原反應

### ③ Cell Function
不要停在「作用於Mitochondria」。要繼續問到底改變：ATP Production？ROS Handling？Fatty-acid Oxidation？Apoptosis 凋亡？Autophagy 自噬？Cytokine Secretion？Barrier Function？（能量、屏障、分泌、免疫、增殖、凋亡、自噬）

例：Enterocyte → Tight Junction相關結構 → Barrier regulation → Intestinal barrier function。

### 最重要防錯
看到「某成分讓癌細胞死亡」，不能立刻寫「所以可以抗癌」。
> **Cell Culture ≠ Human Cancer Treatment**，還差很長的證據鏈。

## B3｜Pathway 路徑庫＝「訊息到底怎麼走？」
最值得大量建立的BANK之一。不要收藏「Nrf2＝抗氧化」，太粗。應收藏完整路徑：**上游 → 中間 → 下游**。
口訣：**誰按 → 誰收 → 怎麼傳 → 做什麼**

### Pathway固定六格
```
① Input / Trigger　　誰開始？ROS、Growth Factor、Cytokine、Hormone、Nutrient、Hypoxia
② Sensor / Receptor　誰發現？Receptor、Sensor Protein
③ Signal Transducer　誰往裡傳？Kinase、Phosphatase、Second Messenger
④ Core Pathway　　　 主要道路
⑤ Transcription / Effector　最後誰下命令？Transcription Factor、Metabolic Enzyme
⑥ Output　　　　　　 細胞最後做什麼？

Trigger → Sensor → Signal → Pathway → Effector → Cell Response
```

### 優先建立的十條Pathway
| 領域 | Pathway |
|---|---|
| Redox 氧化還原 | **Nrf2–Keap1** |
| Inflammation 發炎 | **NF-κB** |
| Energy 能量 | **AMPK** |
| Growth 生長 | **mTOR** |
| Insulin / Survival | **PI3K–AKT** |
| Proliferation 增殖 | **RAS–MAPK** |
| Immunity 免疫 | **JAK–STAT** |
| Fibrosis / Repair 纖維化／修復 | **TGF-β–SMAD** |
| Hypoxia 缺氧 | **HIF** |
| Development 發育 | **Wnt–β-catenin** |

這十條先吃透，比背100條Pathway更實用。

## B4｜Protein 蛋白質庫＝「真正做事的是誰？」
Pathway只是地圖，Protein才是真正的機器：門、機器、工人、開關、搬運車。
口訣：**誰做？在哪？做多少？**（量多少 → 活性如何 → 在哪裡）
> **Protein存在 ≠ Protein正在工作**

### 八類蛋白
| 類別 | 負責 | 白話 |
|---|---|---|
| ① Receptor 受體 | 收訊息 | 接電話的人 |
| ② Enzyme 酵素 | 加速化學反應 | 做工作的機器 |
| ③ Kinase 激酶 | 加磷酸基團，改變訊號 | 開關 |
| ④ Phosphatase 磷酸酶 | 移除磷酸基團 | 反向開關 |
| ⑤ Transporter 運輸蛋白 | 搬東西（如GLUT家族運葡萄糖） | 搬運工 |
| ⑥ Ion Channel 離子通道 | 控制Na⁺、K⁺、Ca²⁺、Cl⁻進出 | 門 |
| ⑦ Transcription Factor 轉錄因子 | 決定哪些基因增加／減少表現（Nrf2、NF-κB） | 控制基因開關的人 |
| ⑧ Structural Protein 結構蛋白 | Collagen、Actin等 | 支架 |

### 每個Protein固定存7＋3格
> **名稱｜在哪裡｜誰啟動｜做什麼｜上游｜下游｜怎麼測**
再增加三格（對產品資料特別重要）：
> **營養素是否直接作用？｜證據層級？｜人體濃度達得到嗎？**

## B5｜Gene / Regulation 基因調控庫＝「為什麼工人會增加或減少？」
口訣：**哪個基因 → 開還關 → 多還少 → 蛋白有沒有跟著變**
```
DNA｜總食譜 → RNA｜抄下來的食譜 → Protein｜做出來的工具 → Function｜開始工作

Genome → Regulatory State → Transcription → RNA Processing → Translation
→ Protein → Post-translational Modification → Protein Activity
```
> Gene存在，不等於Gene正在大量Expression。
> **Gene Expression改變 ≠ DNA被改寫。**

### 必存六類
- ① **Gene**｜哪個Gene？
- ② **Variant**｜序列有沒有差異？
- ③ **Expression**｜mRNA多還少？
- ④ **Epigenetic Regulation**｜DNA methylation 甲基化、histone modification 組蛋白修飾、chromatin accessibility 染色質可及性
- ⑤ **Protein Output**｜RNA改變後，蛋白真的改了嗎？
- ⑥ **Functional Outcome**｜蛋白改變後，功能真的改了嗎？

### 營養素最重要兩個領域（不要混在一起）
- **Nutrigenomics 營養基因體學**：營養如何影響Gene Expression與生物路徑。
- **Nutrigenetics 營養遺傳學**：人的遺傳差異如何影響對營養的反應。

## B6｜Experiment 實驗庫＝「證據到底做到哪裡？」（防誇大BANK）
看到研究第一件事不是找漂亮結論，而是貼標籤：**它在哪裡做？**
口訣：**在哪做？→ 用多少？→ 跟誰比？→ 變什麼？→ 能重做嗎？**

### 證據階梯 E0–E6
| 等級 | 名稱 | 白話 |
|---|---|---|
| **E0** | In Silico 電腦模擬 | 電腦說可能 |
| **E1** | Biochemical 純化分子／蛋白 | 分子真的可能互動 |
| **E2** | Cell 培養細胞 | 細胞真的會改變 |
| **E3** | Animal 動物模型 | 完整活體系統開始看到效果 |
| **E4** | Human Mechanistic 人體機制研究 | 在人身上看到某Target／Biomarker變化 |
| **E5** | Human Clinical 人體臨床結果 | 人本身真的得到某種可測量效益 |
| **E6** | Replication / Synthesis 重現／系統性整合 | 不是只有一篇碰巧成功 |

### 每篇研究固定抽10個資料
口訣：**誰－幾－吃－量－久－比－測－差－安－限**
- ① Population / Model｜誰？
- ② N｜多少人／樣本？
- ③ Intervention｜給什麼？
- ④ Dose｜多少？
- ⑤ Duration｜多久？
- ⑥ Control｜跟誰比？
- ⑦ Endpoint｜測什麼？
- ⑧ Effect Size｜差多少？
- ⑨ Safety｜副作用？
- ⑩ Limitation｜限制？

另存 **Dose-response**｜越多效果是否有規律改變？

### 因果最重要一問
> 把這個Target關掉，效果會消失嗎？如果會，因果證據就更強。

## B7｜Clinical 臨床庫＝「真人到底得到多少好處？」
不要只收藏「研究顯示有效」——這句幾乎沒有判讀價值。
口訣：**誰 → 吃什麼 → 跟誰比 → 變多少 → 多久 → 安不安全**

### 第一層｜PICO
- **P｜Population**：誰？健康人？缺乏者？疾病患者？幾歲？疾病多嚴重？
- **I｜Intervention**：吃什麼？成分、Form、Dose、Frequency。
- **C｜Comparator**：跟誰比較？Placebo？標準治療？不同Dose？
- **O｜Outcome**：到底改善什麼？

### Outcome三級
| 級別 | 內容 |
|---|---|
| **Level A｜Mechanistic Outcome** | 某分子訊號改變 |
| **Level B｜Surrogate / Biomarker** | 血糖、血脂、CRP等 |
| **Level C｜Patient-important Outcome** | 症狀、功能、生活品質、疾病事件、住院、骨折、復發、死亡等 |

> C通常比A更接近病人真正關心的事情。

### 再存五件事
- **Effect Size**｜效果到底多大？
- **Confidence Interval**｜結果有多不確定？
- **Duration**｜效果維持多久？
- **Adverse Events**｜有什麼不良反應？
- **Applicability**｜能不能套到我的族群？

不要只問「P < 0.05嗎？」還要問：**效果大到值得使用嗎？**

## B8｜Translation 轉譯庫＝「別人的研究能不能變成我的產品證據？」
> **Ingredient Evidence ≠ Product Evidence**
口訣：**成 → 型 → 量 → 吸 → 時 → 人 → 配 → 果**
同成分？同型態？同劑量？吸得到？吃多久？同樣的人？同配方？同結果？

### 八大比對
| 編號 | 比對 | 問題 |
|---|---|---|
| **T1** | Ingredient Match 成分 | 研究成分一樣嗎？ |
| **T2** | Form Match 型態 | 化學型態／萃取物／製劑一樣嗎？ |
| **T3** | Dose Match 劑量 | 研究Dose跟產品Dose接近嗎？（研究500 mg，產品到底多少？） |
| **T4** | Bioavailability Match 吸收 | 吸收是否可比較？ |
| **T5** | Duration Match 時間 | 研究吃多久？（研究12週，你的使用方式呢？） |
| **T6** | Population Match 人 | 研究的人跟你的使用族群像嗎？缺乏者？健康者？糖尿病患者？高齡者？ |
| **T7** | Formula Match 配方 | 單方研究能不能套到複方？複方可能加成、無影響、降低吸收、產生交互作用，不能預設「1＋1＞2」 |
| **T8** | Outcome Match 結果 | 研究真正證明什麼？（最重要） |

T8 例：研究是「CRP下降」→ 產品文案最多只能在證據允許範圍討論相關人體指標研究，不能自動升級成防癌、治癌、預防心肌梗塞。「某Biomarker下降」不能翻譯成「某疾病被治療」。

### 安全轉譯（固定多四欄）
- **Contraindication**｜禁忌／不適用情況：誰不適合？
- **Drug Interaction**｜藥物交互作用：會不會和處方藥互動？
- **Upper Limit / Dose Boundary**｜劑量邊界：高劑量是否增加風險？
- **Special Population**｜特殊族群：孕婦、兒童、高齡者、肝腎疾病者是否有不同考量？

# 髒基因七大
## 書籍資訊與一句話
- 英文原名：《Dirty Genes: A Breakthrough Program to Treat the Root Cause of Illness and Optimize Your Health》
- 作者：自然醫學醫師 Ben Lynch
- 台灣繁中版：《28天打造不生病的基因》，2019年三采文化
- 簡中版：《淨化基因》

### 一句話抓住整本書
**DNA不是命運。**
Gene Variant 基因變異＋Gene Expression 基因表現＋Environment 環境＋Nutrition 營養＋Lifestyle 生活方式 → 最後形成 Phenotype 身體表現。

「髒基因」不是DNA真的變髒，是方便理解的比喻，也不是正式遺傳學名詞。較精準的翻譯：
> 「某些遺傳變異或生理路徑，在特定環境與生活條件下，功能表現可能不理想。」

### 生活版一句話
基因＝身體工廠的設計圖。酵素＝工人。營養素＝工具＋原料。生化路徑＝生產線。器官＝工廠部門。症狀＝警報器。檢驗＝儀表板。生活方式＝每天怎麼操作工廠。
不能看到一個基因就說一定會生病。真正要問的是：**哪一條生產線現在真的塞車？**

## 本體層｜這本書真正談什麼
傳統直覺：Gene → Disease（有這個基因就會得這個病）。
《Dirty Genes》核心模型：
```
Genome 基因體 → Genetic Variants 基因變異 → Gene Regulation 基因調控
→ Gene Expression 基因表現 → Protein／Enzyme 蛋白質／酵素功能
→ Pathway 生化路徑 → Cell Function 細胞功能 → Phenotype 症狀與健康狀態
```
中間會被很多Input改變：Nutrition 營養、Sleep 睡眠、Stress 壓力、Exercise 運動、Toxins 環境暴露、Microbiome 菌相、Medication 藥物、Lifestyle 生活型態。
> 不是 Gene＝Destiny，而是 **Gene＝Constraint＋Susceptibility**（限制條件與易感性，不是單一確定結局）。

### 全書三大部分（15章，後半為前兩週＋後兩週實作方案）
- **Part 1｜你能控制自己的基因嗎？**為什麼相同基因不一定產生相同健康結果？
- **Part 2｜認識你的「髒基因」**哪些基因與路徑值得特別注意？
- **Part 3｜如何「清理」基因**如何從飲食、睡眠、壓力、環境與營養支持降低系統負荷？

### 最大的智慧
不是「可以把壞基因洗乾淨」，而是不要把Genome誤認成Destiny。人體狀態是 **Genome × Regulation × Environment × Time** 不斷互動的動態系統。真正值得優化的是 Regulatory Capacity 調節能力、Resilience 韌性、Adaptive Capacity 適應能力。

## 01｜MTHFR｜葉酸－一碳代謝Node（葉酸加工廠）
- 全名：Methylenetetrahydrofolate Reductase｜亞甲基四氫葉酸還原酶
- 常討論Variant：C677T／rs1801133；A1298C／rs1801131
- 核心反應：5,10-Methylene-THF → 5-Methyl-THF；5-Methyl-THF再參與Homocysteine → Methionine的再甲基化
- MTHFR需要FAD作為輔因子，FAD來自Vitamin B2／Riboflavin
- C677T的TT型與較低MTHFR活性、較低葉酸及較高Homocysteine相關，尤其在葉酸或B2不足時

### 核心鏈
```
Folate → THF → 5,10-Methylene-THF → MTHFR → 5-Methyl-THF
→ Homocysteine再甲基化 → Methionine → SAM → Methylation
```

### 生活比喻
買了一袋米，有米≠已經有飯，還需要洗米→加水→煮飯。MTHFR就像其中一台重要的煮飯設備。

### 可能表現
不要把疲勞、腦霧、情緒問題直接診斷成MTHFR。較有價值的是：Variant＋營養狀態＋Homocysteine＋Folate／B12一起看。

### 優先檢驗
Plasma Total Homocysteine 血漿總同半胱胺酸｜Serum Folate 血清葉酸｜RBC Folate 紅血球葉酸｜Vitamin B12｜必要時 MMA 甲基丙二酸（協助判讀B12功能狀態）｜CBC 全血球計數。
基因層可看C677T／A1298C，但Genotype不能取代上述功能指標。

### 營養Node
Folate／B9（主要原料）｜Riboflavin／B2（機器輔助工具）｜B12（下游再甲基化）｜B6（同半胱胺酸其他代謝路徑）｜Choline／Betaine（另一條一碳支援路徑）。這些在一碳代謝中彼此連動。

### 食物
深綠色葉菜、豆類 → 天然Folate。蛋與部分動物性食物 → Choline（素食者需另外設計來源）。乳製品、蛋、杏仁、菇類 → 部分B2。純植物性飲食的B12尤其需另外確認來源。

### 介入順序
① 先看飲食 → ② 看Homocysteine／Folate／B12等功能指標 → ③ 確認藥物、酒精及其他影響因素 → ④ 發現缺乏才針對缺口補充 → ⑤ 介入後重測。
> 不是「MTHFR陽性 → 大量甲基葉酸」，而是 Genotype → Phenotype → Biomarker → Intervention → Retest。
> 不是「我累 → MTHFR不好」，而是：有問題 → 驗數據 → 看路徑 → 最後才判斷基因資訊是否值得加權。

### 32 Node掛點
Gene Regulation｜Micronutrients｜Methylation／One-Carbon｜Redox｜Neurotransmitter｜Cardiovascular

## 02｜COMT｜兒茶酚胺代謝Node（訊號清理員）
- 全名：Catechol-O-Methyltransferase｜兒茶酚-O-甲基轉移酶
- 常討論Variant：Val158Met／rs4680
- 核心反應：利用SAM進行O-methylation
- 主要涉及：Dopamine 多巴胺、Norepinephrine 正腎上腺素、Epinephrine 腎上腺素、Catechol Estrogens 兒茶酚雌激素

### 核心鏈
```
Tyrosine → Catecholamines → Dopamine／Norepinephrine／Epinephrine → COMT → Methylated Metabolites
Estrogen → Catechol Estrogen → COMT → Methylated Estrogen Metabolites
```

### 白話與生活比喻
COMT像「兒茶酚類分子的處理站」。LINE訊息一直進來，有人讀完就快速歸檔，有人需要比較久才能整理。但一個人會不會焦慮，不可能只由「整理LINE的速度」決定。
> 不能簡化成：慢COMT＝焦慮／壞；快COMT＝沒動力／好。心理與認知表現是大量基因＋環境＋睡眠＋壓力＋藥物共同生成的Phenotype。
真正問題是：現在這個人的整個神經系統是否適應目前環境？

### 可能觀察（都不是COMT基因型的特異症狀）
壓力下的注意力變化、咖啡因敏感程度、睡眠、焦慮／躁動、藥物反應。

### 檢驗
COMT rs4680可提供遺傳資訊。目前沒有一個常規血液COMT檢驗可單獨告訴你「COMT功能好不好」。功能判讀更需要：症狀時間軸、藥物、咖啡因、睡眠、壓力；若有內分泌適應症再依醫師判斷相關荷爾蒙檢查。

### 營養Node與食物
Magnesium 鎂｜SAM代謝相關營養素｜Folate／B12／B6／Choline等一碳代謝營養。不能從COMT SNP直接推導某一補充品劑量。
食物：深綠葉菜、豆類、全穀、堅果種子、富含鎂與B群的完整食物。

### 介入
第一槓桿往往不是補充品。先做：**Sleep → Caffeine → Stress Load → Exercise → Medication Review**，再依缺乏證據補營養。

### 32 Node掛點
Neurotransmitter｜Stress／HPA｜Methylation｜Hormone Metabolism｜Sleep／Circadian

## 03｜DAO／AOC1｜組織胺Node（組織胺垃圾車）
- Gene：AOC1；常用名稱DAO；Enzyme：Diamine Oxidase 二胺氧化酶
- 主要位置：腸黏膜等組織
- 核心Pathway：Histamine Degradation

### 核心鏈
```
Histamine-rich Food／Gut Histamine → Intestinal Histamine → DAO → Histamine Degradation
```
細胞內組織胺代謝還涉及HNMT。所以 **Histamine系統 ≠ 只有DAO**。

### 生活比喻
社區每天產生10袋垃圾，垃圾車一天可載15袋 → 通常沒問題。今天突然產生30袋 → 垃圾開始堆。問題不只是垃圾車好不好，還要看一天產生多少垃圾：
> **Histamine Load ÷ Histamine Clearance**

可能Trigger：某些高組織胺或容易累積組織胺的食物、腸道狀態、部分藥物、個人耐受Threshold。

### 可能表現（高度非特異）
進食特定食物後頭痛、潮紅、鼻部症狀、腹脹、腹瀉、心悸、皮膚症狀。
必須先排除：食物過敏、乳糖／果糖等不耐、腸胃疾病、肥大細胞相關疾病、藥物影響等。

### 檢驗
DAO血液活性／濃度有商業檢驗，但單一DAO值的診斷能力有限。比較重要的是：Food-Symptom Diary 飲食症狀紀錄、Temporal Relationship 時間關係、Differential Diagnosis 鑑別診斷；必要時由醫師／營養專業人員進行短期飲食介入與Rechallenge。

### 營養Node
Vitamin B6｜Copper 銅｜Vitamin C。但「DAO低＝直接大量補銅／B6」並不成立，仍需看實際缺乏。

### 食物策略
不是建立永久禁食清單，而是：**Baseline → 找疑似Trigger → 短期降低暴露 → 觀察 → Rechallenge → 確認個人Threshold**。
吃什麼？→ 多久後發生？→ 發生什麼？→ 拿掉後有沒有改善？→ 重新吃是否再次出現？這才是Feedback。

### 介入五層
第一層｜排除真正過敏與其他疾病 → 第二層｜記錄食物－症狀時間關係 → 第三層｜降低明確Trigger → 第四層｜處理腸胃疾病與藥物因素 → 第五層｜重新測試Tolerance。

### 32 Node掛點
Gut Barrier｜Microbiome｜Histamine／Immune｜Micronutrient｜Inflammation

## 04｜MAOA｜單胺代謝Node（神經訊號回收員）
- Enzyme：Monoamine Oxidase A｜單胺氧化酶A
- 位置：粒線體外膜
- 核心Pathway：Monoamine Neurotransmitter Metabolism
- 涉及：Serotonin／5-HT 血清素、Norepinephrine、Epinephrine；Dopamine亦受多套系統共同調控
- 書中用它討論情緒波動與碳水化合物渴望

### 核心鏈
```
Tryptophan → Serotonin → MAOA → Metabolites
Tyrosine → Dopamine → Norepinephrine → MAOA／COMT等代謝系統
```

### 白話與生活比喻
MAOA不是「快樂基因」「暴力基因」「憂鬱基因」，只是複雜神經傳導網路中的一個酵素Node。
學校廣播「現在下課」一次有用；24小時一直播，系統就亂了。重點不是神經傳導物質越多越好，而是：**製造適量＋釋放適量＋接收適量＋清除適量**＝Homeostasis 動態平衡。

### 可能觀察（不能反推MAOA異常）
情緒波動、睡眠、壓力反應、衝動性、焦慮。

### 檢驗
MAOA基因型屬研究／遺傳資訊，臨床通常不靠MAOA SNP診斷情緒問題。優先：臨床症狀、睡眠、藥物、精神健康評估、甲狀腺／貧血／營養等可能模仿情緒症狀的因素。

### 營養Node
B2／FAD與MAO酵素系統有生化關係｜B6參與多種神經傳導物質合成｜Magnesium與神經功能相關。不能把營養素簡化成「MAOA修復劑」。

### 介入
Sleep｜Circadian Rhythm｜Exercise｜Stress Regulation｜足夠蛋白質與整體營養｜藥物交互作用評估。
> MAO inhibitor藥物涉及重大食物／藥物交互作用，不能自行用營養補充概念取代醫療管理。

### 32 Node掛點
Neurotransmitter｜Mitochondria｜Stress／HPA｜Sleep／Circadian｜Micronutrients

## 05｜GST＋GPX｜Glutathione／Redox Node（防鏽清潔隊）
這裡不是一個基因，是一整個Enzyme Family。作者歸入「排毒困境」。
- **GST**｜Glutathione S-Transferases：GSH＋Electrophilic Compounds → GST → Glutathione Conjugation。白話＝把GSH接到某些需要處理的分子上（貼上處理標籤），協助後續生物轉化與排出。
- **GPX**｜Glutathione Peroxidases：H₂O₂／Lipid Peroxides＋GSH → GPX → Water／Reduced Products＋GSSG。白話＝處理過氧化物的消防隊。

### 核心鏈
```
Exposure／Metabolism → Reactive Species → Glutathione System → GST／GPX
→ Neutralization／Conjugation → Redox Homeostasis
```

### 生活比喻
汽車開動有廢氣、廚房煮飯有油煙、工廠運作有垃圾——人體每天工作都會產生需要處理的副產品。

### 可能表現
沒有「GST不足專屬症狀」。疲勞、頭痛、腦霧都高度非特異，不能用症狀直接診斷「排毒基因不好」。

### 可考慮檢驗
CBC／CMP等基礎檢驗依臨床情境｜Liver Enzymes：ALT／AST／GGT｜實際Exposure Biomarker依暴露物決定｜某些專門實驗室提供GSH／GSSG或氧化壓力指標，但臨床解讀限制較多。GST基因型可提供Risk Information，不能單獨定義「Detox能力」。

### 營養Node
Glutathione（GSH）＝Glutamate 麩胺酸＋Cysteine 半胱胺酸＋Glycine 甘胺酸。Selenium 硒與部分GPX功能密切相關。Riboflavin等也參與Redox網路。

### 食物
足夠蛋白質｜十字花科蔬菜｜蔥蒜類｜富含硒食物（需考慮總攝取量）｜多樣植物性食物。

### 介入優先順序
> **Exposure Reduction ＞ Sleep／Nutrition ＞ 改善代謝健康 ＞ 補足明確營養缺口 ＞ 最後才是複雜Supplement Stack**
最有效的「Detox」常常是：不要一直把Exposure送進系統。少一點煙、少一點不必要暴露、少一點過量酒精、改善睡眠與代謝健康，再補真正缺少的營養。

### 32 Node掛點
Redox｜Biotransformation｜Liver｜Micronutrients｜Mitochondria｜Inflammation｜Environmental Exposure

## 06｜NOS3｜Nitric Oxide／血管內皮Node（血管水龍頭）
- 另一名稱：eNOS；Enzyme：Endothelial Nitric Oxide Synthase｜內皮型一氧化氮合酶
- 核心反應：L-Arginine → NOS3 → Nitric Oxide／NO → Smooth Muscle Relaxation → Vasodilation

### 核心鏈
```
Endothelium → NOS3 → NO → Soluble Guanylate Cyclase → cGMP
→ Vascular Smooth Muscle Relaxation → Vascular Tone
```

### 白話與生活比喻
血管不是硬水管，會收縮也會放鬆。NOS3像血管內皮的「放鬆訊號製造器」之一。道路太窄車子容易塞，適當放寬車流較順，但道路也不是越寬越好。
> NO足夠不是「血管永遠越鬆越好」。目標是適當的Endothelial Regulation：該放鬆時放鬆、該調節時調節。

### 可能觀察（都是Network Phenotype，不是NOS3單基因疾病）
高血壓、代謝疾病、吸菸、久坐、內皮功能下降。

### 檢驗
Blood Pressure 血壓｜Fasting Glucose／HbA1c｜Lipid Profile｜Kidney Function｜必要時臨床評估Cardiovascular Risk。NO相關商業檢驗不能取代心血管標準風險評估。

### 營養Node與食物
L-Arginine｜L-Citrulline｜Folate｜BH4相關代謝｜Antioxidant Network。補充與否需考慮血壓、腎功能、藥物等情境。
食物：富含Nitrate的葉菜類與甜菜根、堅果種子、豆類、完整植物性飲食。

### 介入
**Exercise是非常重要的內皮刺激。**再加：Blood Pressure Control｜Smoking Avoidance｜Glucose Control｜Sleep｜Weight／Metabolic Health｜Mediterranean-style Dietary Pattern。

### 32 Node掛點
Cardiovascular｜Endothelium／NO｜Metabolic Health｜Redox｜Inflammation｜Exercise Adaptation

## 07｜PEMT｜Choline－Phosphatidylcholine－Liver Node（細胞膜材料廠）
- Enzyme：Phosphatidylethanolamine N-Methyltransferase｜磷脂醯乙醇胺N-甲基轉移酶
- 核心反應：Phosphatidylethanolamine／PE＋3 SAM → PEMT → Phosphatidylcholine／PC
- 同時連到：Choline、Phospholipid、Methylation、Liver Lipid Export、Cell Membrane

### 核心鏈
```
PE → PEMT＋SAM → PC → Cell Membrane
PC → VLDL Assembly → Triglyceride Export from Liver
```
膽鹼／PC不足可影響肝臟脂質輸出，因此Choline與肝脂肪代謝存在重要關係。

### 生活比喻
蓋房子需要磚、運貨需要貨車。PC同時參與「牆壁材料＋脂質運輸系統」。

### Gene × Environment重點
PEMT受Estrogen調節。部分PEMT variants與低膽鹼飲食下較高器官功能異常風險相關。但不同研究對特定variant與NAFLD的關聯並非完全一致，不能看到PEMT SNP就宣稱一定脂肪肝。

### 可能表現
真正值得觀察：脂肪肝、肝酵素、飲食膽鹼攝取、血脂、代謝健康；而不是用疲勞等非特異症狀反推PEMT。

### 檢驗
ALT｜AST｜GGT｜Triglycerides｜HDL／LDL／non-HDL-C｜必要時腹部超音波｜Homocysteine（一碳代謝旁路資訊）。PEMT SNP屬加權資訊，不是診斷。

### 營養Node
Choline｜Phosphatidylcholine｜Betaine｜Folate｜B12｜Methionine。Choline可經Betaine參與Homocysteine再甲基化；Folate與Choline metabolism不是兩套完全分離的系統。

### 食物
雞蛋是高膽鹼來源；素食版本可用黃豆／豆製品、部分豆類、十字花科蔬菜、堅果種子、小麥胚芽等。實際膽鹼攝取量仍需看整體飲食。

### 介入
第一步｜估算Choline Intake → 第二步｜看肝臟與代謝指標 → 第三步｜處理酒精、精製熱量過剩、胰島素阻抗等更大的脂肪肝Driver → 第四步｜若攝取不足，再提高食物膽鹼 → 第五步｜需要補充品時再依個人狀況評估。
> 成人膽鹼補充不是越高越好；大量攝取亦有耐受上限與其他代謝考量。

### 32 Node掛點
Cell Membrane｜Liver｜Lipid Metabolism｜Methylation｜Choline｜Cardiometabolic

## 七大基因不是七座孤島（Network）
```
MTHFR → One-Carbon Metabolism → 5-MTHF → Methionine → SAM
                                              ↙        ↘
                                           COMT        PEMT
                                            ↓            ↓
                                        神經訊號   Phosphatidylcholine → 細胞膜＋肝臟
```
- **MTHFR ↔ COMT ↔ PEMT**＝Methylation／甲基供體Network（SAM是COMT需要的Methyl Donor，也用來製造PC）
- **DAO＋MAOA＋COMT**＝Histamine／Monoamine／Catecholamine「訊號產生－作用－清除」Network
- **GST＋GPX＋NOS3**＝Redox／Oxidative Stress／Endothelial Network
- **PEMT＋MTHFR**＝Choline／Betaine／Homocysteine／One-Carbon Network

七個Gene不應做成七個孤立抽屜。更高階母體：**Gene → Enzyme → Pathway → Network → Cell → Organ → Phenotype**。

Homocysteine　Dopamine　Histamine　Serotonin

## 人體城市比喻
- MTHFR＝原料加工廠
- COMT＝訊息整理中心
- DAO＝垃圾車
- MAOA＝廣播訊號回收站
- GST／GPX＝清潔隊＋消防隊
- NOS3＝道路寬度調節系統
- PEMT＝建材工廠＋物流支援

任何一個部門有差異，都不代表城市一定會崩潰。城市還有：備援系統、其他路徑、營養、睡眠、運動、腸道、荷爾蒙、環境、藥物、年齡、其他基因。
> 疾病通常不是「一個壞基因 → 一個疾病」，而是：多個Node＋多條Relation＋不同Weight＋長時間累積 → 系統跨過Threshold → 出現Phenotype。

## 判讀流程 12 步
```
STEP 01｜Phenotype　　　人現在到底發生什麼？
STEP 02｜Biomarker　　　症狀有沒有客觀數據支持？
STEP 03｜Pathway　　　　數據指向哪一條生理路徑？
STEP 04｜Nutrient　　　 這條路徑需要哪些Substrate／Cofactor？
STEP 05｜Environment　　飲食、睡眠、壓力、藥物、酒精、抽菸、毒物暴露是否正在改變系統？
STEP 06｜Gene　　　　　 最後再問Gene Variant是否增加這條路徑的Susceptibility
STEP 07｜Bottleneck　　 找出目前真正限制系統的高權重Node
STEP 08｜Minimum Intervention　一次先改最少、最有機會影響結果的變數
STEP 09｜Feedback　　　 症狀＋Biomarker重新測量
STEP 10｜Prediction Error　沒照預測改變，不是硬加更多補充品，先問「我的模型哪裡錯了？」
STEP 11｜Model Update　 重新調整Gene、Nutrition、Environment、Pathway的權重
STEP 12｜Retest　　　　 再做下一輪實驗
```
### 不要
症狀 → Google → 看到MTHFR → 買補充品。

### 判讀原則
七大基因不是七種疾病。SNP≠疾病｜Gene≠命運｜症狀≠基因證據｜營養素≠看到SNP就直接補。真正要找的是「目前哪條Pathway真的成為Bottleneck瓶頸」。

## 舊模式 → 新模式
| 舊模式 | 新模式 |
|---|---|
| 我有某個基因／壞基因，所以一定會生病、完蛋了 | 基因通常只是風險模型中的一個變數，是系統的一個Constraint |
| 找到SNP就找到病因 | Variant必須放回Pathway＋Environment＋Phenotype一起判讀 |
| MTHFR異常＝直接補甲基葉酸 | 先確認Genotype、Phenotype、飲食、藥物、相關Biomarker與整體一碳代謝情境 |
| 有SNP就吃補充品 | 先看Phenotype＋Biomarker＋Pathway |
| 一個基因控制／造成一個疾病 | 複雜疾病是Polygenic多基因＋Environment＋Regulation共同生成；Network跨過Threshold後的結果 |
| 基因檢測＝答案 | 基因檢測＝先驗資訊Prior，不是最終Diagnosis |
| 症狀就是證據 | 症狀只是Signal，還需要檢驗與鑑別 |
| 吃越多營養素越好 | 找到真正Bottleneck才介入 |
| 一次吃十種，看有沒有改善 | Minimum Action → Feedback → Retest |
| 第一次判斷就是答案 | Prediction Error就是下一次更新模型的資料 |

## 控制論版本
| 人體 | 控制論角色 |
|---|---|
| Genome | 系統初始限制 |
| Environment | Input |
| Gene Regulation | Controller |
| Pathway | Process |
| Phenotype | Output |
| Biomarker | Sensor |
| Symptoms | Alarm |
| Intervention | Control Input |
| Response | Feedback |
| Prediction Error | 原模型與Reality之間的差 |
| Model Update | 重新調整對基因、環境與路徑的權重 |

> 真正的High Agency不是「我要控制我的基因」，而是「我知道哪些變數不可改，哪些狀態可以調整，並用Feedback持續修正」。
> 真正的自由不是「沒有基因限制」，而是知道哪些是不能改的Constraint、哪些是可以調整的State，再用Reality不斷更新自己的健康模型。

## 科學邊界
出版社文案會用「關掉生病的基因」「改寫基因命運」「逆轉疾病」等很強的語言。這些適合當書籍主張理解，不應直接當成臨床已證實的普遍因果定律。尤其不能推導成：
- 有MTHFR變異＝一定有甲基化疾病
- 有COMT變異＝一定焦慮
- 有DAO變異＝一定組織胺不耐
- 有PEMT變異＝一定脂肪肝

一個SNP通常只是整個生成網路中的一個Node。真正該看的不是「我有沒有髒基因？」而是：
> Gene Variant＋Expression／Regulation＋Pathway Function＋Biomarker＋Phenotype＋Environment＋Time → 目前哪個Node真的成為Bottleneck？

《髒基因》可當作「理解Gene × Environment互動的入口」，但真正做營養判讀時，要回到現代的基因功能、人體研究與實際Biomarker。

## 全書最終公式與模型升級
DNA≠Destiny｜Variant≠Disease｜Risk≠Outcome｜Gene只是Node｜Expression才進入Function｜Function必須放回Network｜Network必須放回Environment｜Environment必須放回Time｜最後用Biomarker＋Phenotype＋Feedback驗證。

真正的個人化健康不是「知道我的基因」，而是：**知道基因 → 找到路徑 → 找到瓶頸 → 測量現況 → 小幅介入 → 觀察回饋 → 修正模型**。
```
Gene → Protein → Pathway → Cell → Organ → Phenotype → Biomarker
→ Intervention → Feedback → Prediction Error → Model Update
```
### 入門模型 → 升級模型
《髒基因》入門：Dirty Gene → Clean Gene。升級成：
```
Genetic Variant → Enzyme Capacity → Pathway State → Network Interaction
→ Environmental Load → Nutrient Availability → Cellular State → Organ Function
→ Phenotype → Biomarker → Intervention → Feedback → Prediction Error → Model Update
```
### 往上下游展開的母體
```
Phenotype｜現在出現什麼症狀？ → Organ｜哪個器官系統？ → Cell｜哪種細胞？
→ Organelle｜哪個胞器？ → Pathway｜哪條路徑？ → Protein／Enzyme｜哪個執行者？
→ Gene｜哪個基因？ → Variant｜哪個變異？ → Epigenome｜調控狀態如何？
→ Nutrient｜缺什麼原料或輔因子？ → Environment｜有哪些外部Input？
→ Biomarker｜怎麼驗證？ → Intervention｜改什麼？ → Feedback｜結果如何？
→ Model Update｜原本假設要不要修正？
```
可放進母體的領域：Nutrigenomics、Nutrigenetics、Epigenetics、Methylation、One-carbon Metabolism、Detoxification／Biotransformation、Redox、Neurotransmitter Metabolism、Histamine Metabolism、Endothelial Function、Phospholipid／Choline Metabolism。

## 國小版解析｜先懂這個故事
把身體想成一座**大工廠**：
- **基因**＝工廠的「說明書」。每一頁教你做出一種工人。
- **酵素／蛋白質**＝照說明書做出來的「工人」。
- **營養素**＝工人手上的「工具」和要加工的「材料」。
- **路徑**＝一條一條的「生產線」。
- **檢驗數字**＝工廠牆上的「儀表板」。
- **症狀**＝工廠的「警報器」。

每個人的說明書都有幾個字跟別人不一樣（這就叫**基因變異**）。有的字不一樣，工人照樣做得很好；有的字不一樣，工人動作會慢一點。
> 工人慢一點 ≠ 工廠壞掉。工廠還有別的工人、備用道路，而且只要材料和工具給得夠，慢一點的工人常常也做得完。

### 三個一定要記的道理
- **說明書不是成績單。**說明書只說「可能」，儀表板才說「現在」。
- **工具不是越多越好。**工人只有兩隻手，給他十把槌子也只能拿一把；有些工具太多還會傷到工廠（例如鐵、硒）。
- **先看儀表板，再決定要不要補。**補了以後再看一次儀表板，才知道有沒有用。

## 增建①｜One-Carbon Metabolism 一碳代謝母體（MTHFR不能單獨看）
只有「MTHFR → Folate → Methylation」還不夠。
```
Folate → MTHFR → 5-MTHF
                   ↓
Homocysteine ──(MTR＋B12)──→ Methionine → SAM → Methyl Donation → SAH → Homocysteine

旁路：Choline → Betaine → BHMT → Homocysteine → Methionine

轉硫：Homocysteine → CBS → Cystathionine → Cysteine → Glutathione
```
該建立的不是「MTHFR基因」，而是 **One-Carbon Metabolism 一碳代謝母體**。
核心Gene BANK：**MTHFR＋MTR＋MTRR＋BHMT＋SHMT1＋CBS＋MAT1A＋PEMT＋CHDH**

## 增建②｜Histamine 組織胺母體
```
Histidine → Histamine → 兩大處理道路
　① DAO / AOC1　→ 較偏細胞外／腸道等組織胺處理
　② HNMT　　　　→ 細胞內Histamine methylation
```
再連到：Mast Cell 肥大細胞｜Histamine Receptors H1/H2/H3/H4｜Gut Barrier 腸道屏障｜Microbiome 微生物群。
從「DAO低＝組織胺問題」升級成：
> **Histamine Load → Production/Release → Degradation → Receptor Response → Phenotype**
症狀不能單靠DAO基因型解釋。

## 增建③｜Glutathione／Redox 母體
```
Superoxide → SOD2 → H₂O₂ → GPX / Catalase → H₂O

Electrophiles / Xenobiotic metabolites → GST family → Glutathione conjugation → Further metabolism / elimination

Oxidative / Electrophilic Stress → KEAP1 → Nrf2 → Antioxidant Response Element → Cellular Defense Genes
```
重要Genes：**SOD2 → GPX1 → CAT → GSTM1/GSTT1/GSTP1 → NFE2L2 → KEAP1**
營養關係：
- Selenium 硒 → GPx生物學
- Manganese 錳 → MnSOD
- Riboflavin B2 → 多種氧化還原酵素系統
- Protein/Amino acids → GSH原料網絡

比「抗氧化基因不好，要多吃抗氧化劑」精準很多。

## 增建④｜Endothelial–NO 血管內皮母體
```
Arginine → NOS3 / eNOS（＋BH4＋O₂）→ NO → Soluble Guanylate Cyclase → cGMP
→ Vascular Smooth Muscle Response → Vascular Tone
```
若Redox環境異常、BH4不足等情境，NOS biology也可能發生不同狀態。應一起存：
**NOS3｜eNOS**、**GCH1｜BH4 synthesis**、**ARG1/ARG2｜Arginine metabolism**、**SOD2｜Redox**、**NFE2L2｜Cell defense**

## 增建⑤｜Vitamin D 基因母體
```
Vitamin D → CYP2R1 → 25-OH Vitamin D → CYP27B1 → 1,25-(OH)₂D → VDR → Gene Regulation → Cell Response
GC → Vitamin D Binding Protein → Transport
```
四大Gene口訣：**做 → 活 → 收 → 搬**
- CYP2R1＝加工
- CYP27B1＝活化
- VDR＝接收
- GC＝搬運

## 增建⑥｜Omega-3／脂肪酸母體
```
ALA → FADS2 → 中間脂肪酸 → FADS1 → 長鏈PUFA相關代謝
```
> 基因差異 ≠ 直接決定「一定需要吃多少魚油」。
還要加入：Dietary Intake → Biomarker → Clinical Context → Outcome。判Omega-3狀態，直接的人體營養狀態資料往往比單一SNP更有用。

## 增建⑦｜Choline／PEMT 母體
```
Choline ├→ Phosphatidylcholine
        ├→ Acetylcholine
        └→ Betaine → BHMT → Homocysteine → Methionine

PEMT：Phosphatidylethanolamine → Phosphatidylcholine
```
應連：**PEMT＋CHDH＋BHMT＋MTHFR**，讓 Choline → Liver → Membrane → Methylation 全部連起來。

## 增建⑧｜B12 母體
```
Dietary B12 → GI absorption → Transport → TCN2 → Cellular B12
→ MTR等B12-dependent reactions → One-carbon metabolism
```
再加入FUT2等與B12狀態／腸道相關的遺傳研究。
檢驗不能只看Serum B12，可依臨床問題考慮：MMA 甲基丙二酸｜Homocysteine 同半胱胺酸｜CBC 全血球計數。

## 增建⑨｜Iron 鐵母體（營養素不是越多越好）
```
Dietary Iron → Intestinal Absorption → Transport / Storage → Cellular Use
調控：HFE、TMPRSS6、Hepcidin、Ferroportin → Iron Homeostasis
```
基因資料不能直接變成「你需要補鐵」。至少還要看：CBC｜Hemoglobin｜Ferritin｜Transferrin Saturation｜臨床背景。
> 某些鐵負荷相關遺傳狀況，反而可能需要避免不必要補鐵。

## 增建⑩｜Caffeine 咖啡因母體
```
Coffee / Caffeine → Absorption → CYP1A2 → Caffeine Metabolism → Exposure Duration → Individual Response
```
AHR參與CYP1A2等基因的調控。
白話：大家喝的是同一杯咖啡，但每個人的代謝速度與反應可能不同。這就是 **Gene → Nutrient/Xenobiotic Response**，很適合拿來解釋Nutrigenetics。

### 阿明與小美
阿明喝一杯咖啡 → 晚上照睡。小美喝一杯 → 半夜還很清醒。
```
CYP1A2等遺傳差異 ＋ 喝多少 ＋ 幾點喝 ＋ 其他飲食／藥物／吸菸等因素
＋ 年齡與生理狀態 ＋ 個人對咖啡因的敏感度
→ 最後真正的 Caffeine Response
```
> **Gene × Environment → Response**，而不是 Gene → Destiny。

## 增建⑪｜Lactose 乳糖母體
```
Lactose → LCT / Lactase → Glucose + Galactose → Absorption

乳糖酶活性低：Lactose未充分消化 → 進入大腸 → Microbial fermentation＋osmotic effects
→ Gas / Bloating / Diarrhea 等可能表型
```
MCM6附近調控變異與成人LCT持續表現密切相關。這是漂亮的 **Gene Regulation → Enzyme → Food Response → Phenotype** 案例。

## 增建⑫｜Alcohol 酒精代謝母體
```
Ethanol → ADH1B → Acetaldehyde 乙醛 → ALDH2 → Acetate
```
ALDH2功能降低相關變異 → 乙醛處理能力下降。這是 **Gene → Enzyme → Metabolite → Phenotype** 最漂亮的教科書案例之一。

## 營養素果效機制｜怎麼讀（五段鏈＋三級果效）
每一個營養素都用同一條鏈來看：
```
① 吃進去　　　吃的是什麼型態？吸收得了嗎？
② 變身　　　　在身體裡被加工成什麼「可用型」？
③ 交給誰　　　變成哪個工人（酵素）的工具或材料？
④ 路徑改變　　那條生產線因此多做了什麼、少堆了什麼？
⑤ 看得到的果效　哪個儀表板數字、哪個身體功能可以量到？
```
國小版：**吃進去 → 變身 → 交給工人 → 生產線變順 → 儀表板看得到。**

### 果效分三級（對應 B7 的 Outcome 三級）
| 級別 | 意思 | 例子 | 可信度 |
|---|---|---|---|
| **第一級｜補回缺的** | 本來缺，補足後恢復正常 | B12缺乏性貧血補B12後改善 | 最確定 |
| **第二級｜儀表板改變** | 指標數字變了 | 葉酸＋B12讓同半胱胺酸下降 | 可以量，但數字變 ≠ 疾病變少 |
| **第三級｜人真的比較好** | 症狀、功能、疾病事件改善 | 孕前葉酸降低胎兒神經管缺陷風險 | 最有價值，也最需要人體試驗 |

> 營養素最確定的果效，幾乎都是「把缺的補回來」。本來就夠的人再多吃，通常不會多一份果效。
> 下面每張表寫的是**機制**（它在身體裡做什麼）。機制成立 ≠ 吃補充品一定有感，仍要過 B6／B7／B8 三道Gate。

| 營養素 | 國小白話 | 果效機制（進身體後做什麼） | 交給哪個工人 | 可量到的果效 | 邊界 |

```
超氧 →（SOD2＋錳）→ 過氧化氫 →（GPX＋硒＋GSH）→ 水

| 營養素 | 國小白話 | 果效機制 | 交給哪個工人 | 可量到的果效 | 邊界 |
|---|---|---|---|---|---|
| **精胺酸 L-Arginine** | 放鬆口令的原料 | NOS3把精胺酸做成NO，NO讓血管平滑肌放鬆 | NOS3 | 人體研究整體顯示血壓小幅下降 | 口服有一大部分在腸和肝先被用掉；與降壓藥、硝酸鹽類藥物併用要小心 |
| **瓜胺酸 L-Citrulline** | 繞路送進來的原料 | 不會在肝臟先被用掉，到腎臟再變成精胺酸，所以提高血中精胺酸反而比較有效率 | NOS3（間接） | 血中精胺酸上升；血壓與運動表現有小幅研究結果 | 同上，低血壓與用藥者留意 |
| **蔬菜硝酸鹽** | 另一條不靠NOS3的路 | 硝酸鹽→口腔細菌變成亞硝酸鹽→在身體裡變成NO | 不經NOS3 | 甜菜根汁等在人體研究可見血壓小幅下降 | 抗菌漱口水會削弱這條路；果效短暫，需持續攝取 |
| **葉酸** | 幫小工具BH4保養 | 5-MTHF有助維持BH4，BH4夠NOS3才做NO而不是做出火花 | NOS3、GCH1（間接） | 部分人體研究見內皮功能指標改善 | 屬第二級果效，不等於減少心血管事件 |

### 這一群的果效鏈
```
瓜胺酸 → 精胺酸 →（NOS3＋BH4）→ NO → cGMP → 血管放鬆 → 血壓
蔬菜硝酸鹽 → 口腔細菌 → 亞硝酸鹽 → NO
火花太多（氧化壓力）→ NO被消耗、BH4被破壞 → 口令變少
```
> 運動讓血流沖刷血管壁，是最直接叫NOS3多做口令的方法，果效比任何原料都穩定。

## 營養素果效機制④｜神經訊號／組織胺群
| 營養素 | 國小白話 | 果效機制 | 交給哪個工人 | 可量到的果效 | 邊界 |
|---|---|---|---|---|---|
| **鎂 Magnesium** | 幫工人扶梯子的人 | COMT工作時需要鎂離子；身體用能量（ATP）時也都要搭配鎂；能讓神經和肌肉不要太興奮 | COMT及三百多種酵素 | 偏低者補足後抽筋、睡眠等可能改善；人體研究結果不一 | 補充品上限約350 mg／日，過量腹瀉；腎功能不好者要小心 |
| **維生素B6** | 做紙條的扳手 | 色胺酸→血清素、酪胺酸→多巴胺、麩胺酸→GABA，最後一步都要B6 | 神經傳導物質合成酵素 | 缺乏者補足恢復 | 長期高劑量傷神經 |
| **酪胺酸／色胺酸（蛋白質）** | 紙條的紙 | 酪胺酸是多巴胺、正腎上腺素的原料；色胺酸是血清素、褪黑激素的原料 | 合成酵素；用完由COMT、MAOA回收 | 飲食蛋白質足夠即可 | 與精神科藥物、MAO抑制劑有交互作用風險 |
| **銅 Copper** | 垃圾車的引擎零件 | DAO是含銅酵素，沒有銅就不能分解組織胺 | DAO | 缺銅者補足恢復 | 一般少缺；長期高劑量鋅會把銅壓低；銅過量有毒 |
| **維生素C** | 幫忙收警報的朋友 | 小型人體研究見血中組織胺下降 | 非特定 | 證據有限 | 不能當成組織胺問題的解方 |

> 這一群最要小心：情緒、睡眠、過敏樣症狀原因很多，補充品不是第一槓桿。先睡眠、咖啡因、壓力、飲食紀錄，再談營養素。

## 營養素果效機制⑤｜維生素D／Omega-3／鐵
| 營養素 | 國小白話 | 果效機制 | 交給哪個工人 | 可量到的果效 | 邊界 |
|---|---|---|---|---|---|
| **維生素D** | 一封要蓋兩個章的信 | 肝臟蓋第一章（25-OH-D）→腎臟蓋第二章（活性型）→進細胞核和VDR結合→打開一批基因，例如讓腸子多吸收鈣 | CYP2R1、CYP27B1、VDR、GC | 缺乏者補足：預防佝僂症、骨軟化；25-OH-D上升 | 成人上限4000 IU／日；過量造成高血鈣；夠的人再補，額外果效有限 |
| **Omega-3（EPA／DHA）** | 細胞牆裡比較柔軟的磚 | ①嵌進細胞膜，改變膜的性質 ②和花生四烯酸搶位子，做出的發炎訊號比較溫和，還能做出「收尾訊號」 ③讓肝臟少做三酸甘油酯 | 直接吃EPA／DHA可以不靠FADS1／FADS2加工 | 降三酸甘油酯是人體證據最明確的果效 | 高劑量略增出血與心房顫動風險；用抗凝血藥者先問醫師 |
| **ALA（亞麻仁油等）** | 還沒加工的短磚 | 要靠FADS2→FADS1一步步加長才變EPA，轉換率本來就低 | FADS2、FADS1 | 提供必需脂肪酸；轉成DHA的量很少 | 不能直接等同吃EPA／DHA |
| **鐵 Iron** | 載氧氣的小卡車 | 做血紅素載氧、肌紅素存氧、粒線體發電鏈；滅火的CAT裡面也有鐵 | 由鐵調素、HFE、TMPRSS6管進貨 | 缺鐵者補足：血紅素、鐵蛋白回升，疲勞改善 | 多的鐵排不掉，會產生火花傷組織；**先驗再補**，鐵過載體質不能補 |

### 這一群的果效鏈
```
維生素D →（肝 CYP2R1）→ 25-OH-D →（腎 CYP27B1）→ 活性型 → VDR → 基因開關 → 鈣吸收等
EPA／DHA → 細胞膜 → 較溫和的發炎訊號＋收尾訊號；肝臟 → 三酸甘油酯↓
鐵 → 血紅素 → 載氧；鐵調素決定腸子放多少鐵進來
```

## Gene Card 16格
| 欄位 | 必存內容 | 白話 |
|---|---|---|
| **01 Gene** | Gene symbol | 哪個基因？ |
| **02 Variant** | rsID／variant | 哪裡不同？ |
| **03 Protein** | Protein/Enzyme | 做出什麼工人？ |
| **04 Substrate** | 底物 | 工人拿什麼來做？ |
| **05 Product** | 產物 | 做出什麼？ |
| **06 Cofactor** | 輔因子 | 工作需要什麼工具？ |
| **07 Pathway** | 生化路徑 | 在哪條生產線？ |
| **08 Cell/Tissue** | 細胞／組織 | 在哪間工廠重要？ |
| **09 Phenotype** | 可能表型 | 差異可能表現在哪？ |
| **10 Biomarker** | 可測指標 | 怎麼知道？ |
| **11 Nutrient** | 營養關係 | 哪些營養素真正相關？ |
| **12 Food** | 食物來源 | 食物從哪來？ |
| **13 Intervention** | 可修改因素 | 可以做什麼？ |
| **14 Evidence** | Cell/Animal/Human/RCT | 證據走到哪？ |
| **15 32 Node** | Node Crosswalk | 掛回哪個母體節點？ |
| **16 Actionability** | 可行動性 A–D | 測了有沒有用？ |

### 第16格 Actionability 可行動性
> 可以測基因 ≠ 測了有用。
- **A｜High Actionability**：結果能明確改變有實證支持的管理策略。
- **B｜Moderate**：可以和飲食、Biomarker、臨床資料一起判讀。
- **C｜Low**：有關聯研究，但對個人決策幫助有限。
- **D｜Research Only**：主要研究用途，不應拿來決定補充品。

這格可以阻止 **SNP → 缺陷 → 症狀 → 賣營養素** 這種過度推論。

## 營養基因母體總圖
```
Genome → Variant → Gene Regulation → RNA → Protein / Enzyme → Pathway
→ Metabolite → Cell Function → Phenotype → Biomarker
──────────────
Environment｜Diet｜Lifestyle｜Microbiome｜Age / Sex / Disease / Medication
──────────────
→ Actual Nutrient Requirement / Response → Intervention → Clinical Outcome → Retest
```
成熟的營養基因學不是「你有MTHFR，所以你要吃X」，而是：
> Gene Variant → 功能影響有多大？→ Pathway是否真的受影響？→ Biomarker有沒有異常？→ 飲食是否不足？→ 症狀／疾病背景？→ 藥物？→ 人體介入證據？→ 才決定要不要介入。

## 生活版心智圖｜吃進去 → 身體加工
從這裡開始背，不要從基因名稱開始：
> 我吃了什麼 → 身體怎麼處理 → 哪個基因／酵素參與 → 最後我可能有什麼不同反應。
```
【我吃進去的東西】葉酸、B12｜脂肪、膽鹼｜咖啡、酒精｜維生素D、鐵……
        ↓
【我的Gene｜基因】身體的「使用說明書」
        ↓
【Protein / Enzyme】實際工作的工人
        ↓
【Pathway】身體工作流程
        ↓
【Metabolite】中間產物／代謝物
        ↓
【Cell】細胞功能發生變化
        ↓
【Phenotype】人表現出差異
        ↓
Biomarker 抽血／檢驗　＋　生活表現／身體感受
        ↓
【真的需要介入嗎？】
        ↓
飲食 → 營養素 → 生活型態 → 必要醫療
        ↓
【Retest】看結果到底有沒有改善
```
> **吃進去 → 身體加工 → 基因有差 → 工人工作 → 指標不同 → 人的反應不同。**

## 框架圖｜不要「看到基因就賣營養素」
```
【Gene Variant】說明書有一點不同
　↓
【Protein / Enzyme】工人真的因此工作不同嗎？
　↓
【Pathway】整條生產線真的受到影響嗎？
　↓
【Biomarker】抽血／檢驗真的看得到嗎？
　↓
【Phenotype】人真的出現相關問題嗎？
　↓
【Diet】平常飲食真的不足／不合適嗎？
　↓
【Intervention】這時才考慮飲食／營養介入
　↓
【Retest】介入以後真的改善嗎？
```
### MTHFR示範
不要：MTHFR變異 → 甲基化不好 → 吃甲基葉酸。
```
【Gene】MTHFR有某Variant → 只是知道「說明書有差異」
【Enzyme】這個Variant對酵素功能影響多大？
【Pathway】Folate / One-carbon metabolism 真的受到影響嗎？
【Biomarker】Homocysteine？Folate？B12？CBC？及臨床需要的其他資料
【Diet】葉酸、B12、B6、B2等攝取狀況？
【Phenotype / Clinical Context】本人真的有相關臨床問題嗎？還有沒有其他原因？
【Intervention】先處理真正存在的問題
【Retest】指標／症狀／功能有沒有改善？
```
> 基因檢測只是告訴你「這條路可能值得看一下」，不是告訴你「現在一定壞了」。

## 三層判讀
| 層 | 名稱 | 白話 | 看什麼 |
|---|---|---|---|
| 第一層 | **Gene Risk** | 基因說：可能 | 某Variant可能影響某酵素功能 |
| 第二層 | **Functional Evidence** | 身體說：現在真的有沒有發生？ | Biomarker＋飲食＋症狀＋臨床資料 |
| 第三層 | **Intervention Evidence** | 研究說：改了真的有沒有比較好？ | Human Trial＋Dose＋Outcome＋Safety |

> **Gene Prediction → Functional Verification → Intervention Verification**
> 基因先猜 → 身體檢查看是不是 → 介入後再看有沒有改善。

## 生活操作流程 9 步
```
我最近有問題（疲勞／睡不好／腹脹）
① Phenotype　到底是什麼問題？
② Gene　　　 有沒有相關遺傳差異？
③ Enzyme / Protein　這個基因做什麼工人？
④ Pathway　　工人在哪條生產線？
⑤ Biomarker　這條生產線現在真的異常嗎？
⑥ Diet　　　 平常到底吃了什麼？
⑦ Nutrient　 真的有缺乏／需求或合理介入點嗎？
⑧ Intervention　食物／生活／必要時補充
⑨ Retest　　 真的改善嗎？　YES → 保留｜NO → 回頭找其他原因
```
> 「基因看可能，檢查看現在，介入看能不能改，回測看有沒有真的變好。」

接回功能醫學母體：**Gene → Enzyme → Pathway → Cell → Phenotype → Biomarker → Diet/Nutrient → Intervention → Retest**，而不是 **Gene → Supplement**。

# 32 Node
## 統一原則與標記
七大基因不再各自獨立分類，全部灌入同一套32 Node母體。判讀統一使用：
> Gene → Enzyme → Pathway → 32 Node → Phenotype → Biomarker → Bottleneck → Intervention → Feedback → Retest
- ●＝Primary Node｜第一直接節點
- ○＝Secondary Node｜重要下游／上游節點
- △＝Conditional Node｜特定情境才重要
- —＝沒有足夠直接性，不強行連結

### 32 Node人體城市
七個工人住在同一座城市：腸道負責原料進來｜免疫負責警戒｜Redox負責防鏽｜Methylation負責搬運與化學標記｜粒線體負責發電｜大腦負責傳訊｜肝臟負責加工｜血管負責運輸｜細胞膜負責內外邊界｜基因調控決定哪些程式比較活躍｜修復系統負責出錯後恢復｜Reserve決定整座城市遇到壓力還撐不撐得住。

## 固定32 Node判讀器
不要再問：「這個人是哪個髒基因？」改問：
```
Reality｜現在真正發生什麼？
→ Phenotype｜哪個症狀？
→ Domain｜落在哪一大系統？
→ Node｜是哪個節點？
→ Biomarker｜哪個數字能驗證？
→ Pathway｜哪條路徑能解釋？
→ Gene｜哪個基因值得增加權重？
→ Environment｜外部Input是什麼？
→ Bottleneck｜目前最高權重瓶頸是哪個？
→ Intervention｜先改哪個可改變Node？
→ Feedback｜結果有沒有照預測改變？
→ Prediction Error｜猜錯在哪一層？
→ Model Update｜重新調整Node與Weight。
```
### 最終統一公式
> **7 Genes → 4 Super-Networks → 8 Domains → 32 Nodes → Phenotype → Biomarker → Bottleneck → Intervention → Feedback → Prediction Error → Model Update**

真正要管理的從來不是七個「好／壞基因」，而是七個基因在32 Node動態網路中的位置、權重、限制條件與目前功能狀態。

const $=s=>document.querySelector(s);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');

// 解析：# 模組 / ## 卡片
const mods=[];let mod=null,card=null,fence=false;
for(const ln of $('#data').textContent.split('\n')){
  if(ln.startsWith('```'))fence=!fence;
  if(!fence&&ln.startsWith('# ')){mod={t:ln.slice(2).trim(),cards:[]};mods.push(mod);card=null;continue}
  if(!fence&&ln.startsWith('## ')){card={t:ln.slice(3).trim(),lines:[],mod:mod.t};mod.cards.push(card);continue}
  if(card)card.lines.push(ln);
}
mods.forEach(m=>m.cards.forEach(c=>c.text=(c.t+'\n'+c.lines.join('\n')).toLowerCase()));

const SYM={'●':'s1','○':'s2','△':'s3','—':'s0'};
function md(L){
  let h='',i=0;
  while(i<L.length){
    const l=L[i];
    if(l.startsWith('```')){let b=[];i++;while(i<L.length&&!L[i].startsWith('```'))b.push(L[i++]);i++;h+='<pre>'+esc(b.join('\n'))+'</pre>';continue}
    if(l.startsWith('|')){
      const rows=[];while(i<L.length&&L[i].startsWith('|')){rows.push(L[i++])}
      const cells=r=>r.replace(/^\||\|\s*$/g,'').split('|').map(x=>x.trim());
      const body=rows.filter((r,k)=>k>0&&!/^\|[\s:|-]+$/.test(r));
      h+='<div class="tw"><table><thead><tr>'+cells(rows[0]).map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>'+
        body.map(r=>'<tr>'+cells(r).map(c=>'<td'+(SYM[c]?' class="'+SYM[c]+'"':'')+'>'+inl(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
      continue}
    if(l.startsWith('### ')){h+='<h4>'+inl(l.slice(4))+'</h4>';i++;continue}
    if(l.startsWith('> ')){let b=[];while(i<L.length&&L[i].startsWith('> '))b.push(inl(L[i++].slice(2)));h+='<blockquote>'+b.join('<br>')+'</blockquote>';continue}
    if(l.startsWith('- ')){let b=[];while(i<L.length&&L[i].startsWith('- '))b.push('<li>'+inl(L[i++].slice(2))+'</li>');h+='<ul>'+b.join('')+'</ul>';continue}
    if(!l.trim()){i++;continue}
    let b=[];while(i<L.length&&L[i].trim()&&!/^(```|\||### |> |- )/.test(L[i]))b.push(inl(L[i++]));
    h+='<p>'+b.join('<br>')+'</p>';
  }
  return h;
}

function mark(el,q){
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),ns=[];
  while(w.nextNode())ns.push(w.currentNode);
  for(const n of ns){
    const t=n.nodeValue,low=t.toLowerCase();let p=low.indexOf(q);
    if(p<0)continue;
    const f=document.createDocumentFragment();let s=0;
    while(p>=0){f.append(t.slice(s,p));const m=document.createElement('mark');m.textContent=t.slice(p,p+q.length);f.append(m);s=p+q.length;p=low.indexOf(q,s)}
    f.append(t.slice(s));n.replaceWith(f);
  }
}

let cur=0,allOpen=true;
function render(){
  const q=$('#q').value.trim().toLowerCase();
  const list=$('#list'),toc=$('#toc');list.innerHTML='';toc.innerHTML='';
  const cards=q?mods.flatMap(m=>m.cards).filter(c=>c.text.includes(q)):mods[cur].cards;
  document.querySelectorAll('#nav button').forEach((b,k)=>b.classList.toggle('on',!q&&k===cur));
  $('#info').textContent=q?`搜尋「${$('#q').value.trim()}」：找到 ${cards.length} 張卡片（跨全部模組）`:`${mods[cur].t}｜${cards.length} 張卡片`;
  if(!cards.length){list.innerHTML='<div class="empty">找不到符合的資料，換個關鍵字試試。</div>';return}
  cards.forEach((c,k)=>{
    const d=document.createElement('details');d.id='c'+k;d.open=allOpen||!!q;
    d.innerHTML='<summary><span>'+esc(c.t)+'</span>'+(q?'<span class="mod">'+esc(c.mod)+'</span>':'')+'</summary><div class="body">'+md(c.lines)+'</div>';
    if(q){
      // 表格只留符合的列（標題或其他段落命中時保留整張表）
      d.querySelectorAll('tbody').forEach(tb=>{
        const rs=[...tb.rows],hit=rs.filter(r=>r.textContent.toLowerCase().includes(q));
        if(hit.length&&hit.length<rs.length)rs.forEach(r=>{if(!hit.includes(r))r.hidden=true});
      });
      mark(d,q);
    }
    list.append(d);
    if(!q){const a=document.createElement('a');a.href='#c'+k;a.textContent=c.t;a.onclick=()=>{d.open=true};toc.append(a)}
  });
}

mods.forEach((m,k)=>{const b=document.createElement('button');b.textContent=m.t;b.onclick=()=>{cur=k;$('#q').value='';render();scrollTo(0,0)};$('#nav').append(b)});
$('#q').addEventListener('input',render);
$('#tg').onclick=()=>{allOpen=!allOpen;$('#tg').textContent=allOpen?'全部收合':'全部展開';document.querySelectorAll('details').forEach(d=>d.open=allOpen)};
render();
</script>
</body>
</html>
