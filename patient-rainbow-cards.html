ow my needs, know the role of each tool, and know how to observe Feedback.\""],["不是：","Not:"],["「我要打敗自己的身體。」","\"I have to defeat my own body.\""],["而是：","But:"],["「我要重新學會跟自己的身體合作。」","\"I want to learn again to cooperate with my own body.\""],["不是：","Not:"],["「疾病讓我的人生停止。」","\"Illness has stopped my life.\""],["而是：","But:"],["「Reality改變了，所以我也開始更新我的人生Model。」","\"Reality has changed, so I'm starting to update my life Model too.\""],["這才是病友真正可以帶走的身心靈翻轉：","This is the body-mind-spirit turnaround patients can truly take with them:"],["身體被支持。","The body is supported."],["情緒被容納。","Emotions are held."],["資訊被辨識。","Information is discerned."],["選擇權被拿回。","The power to choose is taken back."],["關係被連結。","Relationships are connected."],["模型持續更新。","The model keeps updating."],["即使疾病仍然存在，","Even if the illness is still here,"],["生命仍然可以繼續生成新的可能。","life can still keep generating new possibilities."]],"index":[["【病友彩虹卡｜245張七色總索引】","【Patient Rainbow Cards｜Seven-Color Master Index of 245 Cards】"],["245張＝7色×35張。","245 cards = 7 colors × 35 cards."],["使用原則：","How to use:"],["不是從01一路讀到245。","Don't read from 01 straight through to 245."],["而是：","Instead:"],["今天的Reality","Today's Reality"],["→找到問題","→Find the problem"],["→找到顏色","→Find the color"],["→找到卡號","→Find the card number"],["→一天1張","→1 card a day"],["→1個Minimum Action","→1 Minimum Action"],["→Feedback","→Feedback"],["→Model Update。","→Model Update。"]],"rhymeTitle":["【最短選卡口訣】","【The Quickest Card-Picking Rhyme】"],"order":[["【真正使用順序】","【The Real Order of Use】"],["Reality","Reality"],["→找最低Node","→Find the lowest Node"],["→找顏色","→Find the color"],["→找卡號","→Find the card number"],["→今天只選1張","→Pick only 1 card today"],["→看見Old Model","→See the Old Model"],["→寫下Prediction","→Write the Prediction"],["→做1個Minimum Action","→Do 1 Minimum Action"],["→觀察Feedback","→Observe Feedback"],["→找Prediction Error","→Find the Prediction Error"],["→Model Update","→Model Update"],["→Retest","→Retest"],["→New Capability","→New Capability"],["→New Wisdom。","→New Wisdom。"]],"navIntro":[["【病友彩虹卡｜245張情境導航×直接執行版】","【Patient Rainbow Cards｜245 Situational Navigation × Direct Action Edition】"],["每張固定三層：","Each card has three fixed layers:"],["【使用時機】什麼情況抽這張？","【When to Use】In what situation do you draw this card?"],["【今日行動】今天立刻做什麼？","【Today's Action】What do you do right away today?"],["【完成標準】做到哪裡就可以停？","【Done When】How far do you go before you can stop?"],["一天只需要1張。","Only 1 card a day is needed."]],"entryTitle":["【七色情境快速入口】","【Seven-Color Situational Quick Entry】"],"daily":[["【每天不用找245張】","【No Need to Search All 245 Cards Every Day】"],["只問：","Just ask:"],["「我現在發生什麼？」","\"What is happening to me right now?\""],["↓","↓"],["「這屬於哪一色？」","\"Which color does this belong to?\""],["↓","↓"],["「哪張卡最像現在的我？」","\"Which card is most like me right now?\""],["↓","↓"],["看【使用時機】","Read【When to Use】"],["↓","↓"],["做【今日行動】","Do【Today's Action】"],["↓","↓"],["達到【完成標準】","Reach【Done When】"],["↓","↓"],["晚上留下Feedback","Leave Feedback in the evening"],["↓","↓"],["Prediction Error","Prediction Error"],["↓","↓"],["Model Update","Model Update"],["↓","↓"],["明天Retest。","Retest tomorrow."]],"goal":[["【最終目標】","【The Ultimate Goal】"],["卡片不是答案。","The cards are not answers."],["卡片是Trigger。","The cards are Triggers."],["使用時機＝Context Recognition。","When to Use = Context Recognition."],["今日行動＝Action。","Today's Action = Action."],["完成標準＝Observable Output。","Done When = Observable Output."],["晚上回顧＝Feedback。","Evening review = Feedback."],["預期與結果不同＝Prediction Error。","Expectation differs from result = Prediction Error."],["修正下一步＝Model Update。","Correcting the next step = Model Update."],["反覆練習＝Capability。","Repeated practice = Capability."],["把大量經驗壓縮成可重複使用的規則＝Wisdom。","Compressing lots of experience into reusable rules = Wisdom."],["245張卡最後真正要交給病友的，","What the 245 cards ultimately give patients"],["不是245句話，","is not 245 sentences,"],["而是245次「我知道現在發生什麼，也知道下一步可以做什麼」的能力。","but 245 moments of the ability to say, \"I know what's happening right now, and I know what I can do next.\""]],"pageTitle":["【245張｜七色一頁導航】","【245 Cards｜Seven-Color One-Page Navigator】"]},"g3":{"title":["【彩虹卡3.0｜245張Model Update智慧卡】","【Rainbow Cards 3.0｜245 Model Update Wisdom Cards】"],"loop":["核心循環＝Reality → 舊Model → Prediction → Prediction Error → Error Type → Bottleneck → New Hypothesis → Correct Action → Reality Test → Feedback → Retest → Evidence → Model Update → New Capability → New Wisdom。","Core loop = Reality → Old Model → Prediction → Prediction Error → Error Type → Bottleneck → New Hypothesis → Correct Action → Reality Test → Feedback → Retest → Evidence → Model Update → New Capability → New Wisdom."],"osTitle":["【七色生命OS】","【Seven-Color Life OS】"],"os":[["🔴紅色01–35｜STABILITY｜安全・身體・資源・穩定｜我能站穩。","🔴Red 01–35｜STABILITY｜Safety · Body · Resources · Stability｜I can stand steady."],["🟠橙色36–70｜FLOW｜感受・快樂・創造・流動｜我能感受。","🟠Orange 36–70｜FLOW｜Feeling · Joy · Creativity · Flow｜I can feel."],["🟡黃色71–105｜AGENCY｜選擇・界線・行動・自主｜我能選擇。","🟡Yellow 71–105｜AGENCY｜Choice · Boundaries · Action · Autonomy｜I can choose."],["🟢綠色106–140｜CONNECTION｜愛・關係・接納・修復｜我能連結。","🟢Green 106–140｜CONNECTION｜Love · Relationships · Acceptance · Repair｜I can connect."],["🔵藍色141–175｜COMMUNICATION｜表達・溝通・真實・傾聽｜我能說清楚。","🔵Blue 141–175｜COMMUNICATION｜Expression · Communication · Truth · Listening｜I can say it clearly."],["🟣靛色176–210｜METACOGNITION｜覺察・洞察・辨識・更新｜我能看見自己的Model。","🟣Indigo 176–210｜METACOGNITION｜Awareness · Insight · Discernment · Updating｜I can see my own Model."],["🟪紫色211–245｜TRANSCENDENCE｜智慧・意義・不確定性・超越｜我能超越舊Model。","🟪Violet 211–245｜TRANSCENDENCE｜Wisdom · Meaning · Uncertainty · Transcendence｜I can go beyond my old Model."]],"redHeader":["【🔴紅色｜01–35｜STABILITY】","【🔴Red｜01–35｜STABILITY】"],"redIntro":[["紅色不是叫自己「不要害怕」。","Red is not about telling yourself \"don't be afraid.\""],["紅色真正訓練的是：當Reality不確定時，我仍有能力讓身體、時間、金錢、環境與行動重新穩定。","What red really trains is this: when Reality is uncertain, I still have the ability to re-stabilize my body, time, money, environment and actions."]],"cards":[{"n":1,"t":["先站穩","Stand Steady First"],"f":[[["金句","Key line"],["不必一次解決人生，先讓自己站穩。","You don't have to solve your whole life at once — first, get yourself steady."]],[["白話","Plainly"],["事情很多時，先處理最基本的一件。","When there's too much going on, handle the most basic thing first."]],[["舊Model","Old Model"],["我必須一次把全部問題解決。","I must solve every problem at once."]],[["Prediction","Prediction"],["只要還有問題，我就不能安心。","As long as any problem remains, I can't feel at ease."]],[["Prediction Error","Prediction Error"],["很多問題其實可以分批處理。","Many problems can actually be handled in batches."]],[["Error Type","Error Type"],["全有全無。","All-or-nothing thinking."]],[["Bottleneck","Bottleneck"],["沒有Priority。","No Priority."]],[["蘇格拉底問句","Socratic question"],["現在真正最需要先處理的是哪一件？","What truly needs to be handled first right now?"]],[["New Hypothesis","New Hypothesis"],["先穩住最大節點，整體混亂會下降。","Steady the biggest node first, and the overall chaos will drop."]],[["Correct Action","Correct Action"],["找出第一優先。","Identify the first priority."]],[["Minimum Action","Minimum Action"],["今天只完成一件最重要的小事。","Today, finish just one most-important small thing."]],[["Reality Test","Reality Test"],["做完後觀察壓力是否下降。","Afterwards, notice whether the pressure has dropped."]],[["Evidence","Evidence"],["我沒有全部完成，但系統已經比較穩。","I didn't finish everything, but the system is steadier."]],[["Model Update","Model Update"],["安全不等於沒有問題，而是我知道下一步。","Safety doesn't mean having no problems — it means knowing the next step."]],[["New Capability","New Capability"],["優先排序。","Prioritizing."]],[["Decision Rule","Decision Rule"],["亂的時候，先找最大節點。","When things are chaotic, find the biggest node first."]],[["Wisdom","Wisdom"],["穩定先於擴張。","Stability comes before expansion."]]]},{"n":2,"t":["回到身體","Return to the Body"],"f":[[["金句","Key line"],["腦袋很亂時，先回到身體。","When your mind is a mess, come back to your body first."]],[["白話","Plainly"],["先確認睡眠、呼吸、飢餓、疼痛與疲勞。","Check sleep, breathing, hunger, pain and fatigue first."]],[["舊Model","Old Model"],["所有不舒服都是心理問題。","All discomfort is psychological."]],[["Prediction Error","Prediction Error"],["身體狀態會直接改變情緒與判斷。","Your physical state directly changes emotions and judgment."]],[["Error Type","Error Type"],["忽略生理訊號。","Ignoring physiological signals."]],[["Bottleneck","Bottleneck"],["Body Awareness不足。","Not enough Body Awareness."]],[["蘇格拉底問句","Socratic question"],["我的身體現在正在告訴我什麼？","What is my body telling me right now?"]],[["Correct Action","Correct Action"],["先處理基本生理需求。","Meet basic physical needs first."]],[["Minimum Action","Minimum Action"],["喝水、吃飯、休息、伸展或慢呼吸。","Drink water, eat, rest, stretch or breathe slowly."]],[["Retest","Retest"],["20分鐘後重新評估。","Reassess after 20 minutes."]],[["Model Update","Model Update"],["身體是決策系統的一部分。","The body is part of the decision-making system."]],[["New Capability","New Capability"],["身體覺察。","Body awareness."]],[["Wisdom","Wisdom"],["先調狀態，再做重大判斷。","Adjust your state first, then make big judgments."]]]},{"n":3,"t":["安全感不是等來的","Security Isn't Something You Wait For"],"f":[[["金句","Key line"],["真正的安全感，是知道自己能處理下一步。","Real security is knowing you can handle the next step."]],[["舊Model","Old Model"],["我要等環境完全安全才能安心。","I have to wait until my environment is completely safe before I can relax."]],[["Prediction Error","Prediction Error"],["世界不可能完全可控。","The world can never be fully controlled."]],[["Bottleneck","Bottleneck"],["把安全交給外界。","Handing your safety over to the outside world."]],[["Correct Action","Correct Action"],["建立自己的應對能力。","Build your own capacity to respond."]],[["Minimum Action","Minimum Action"],["寫下「如果X發生，我就做Y」。","Write down: \"If X happens, I will do Y.\""]],[["Model Update","Model Update"],["安全＝風險辨識＋資源＋Plan B＋行動能力。","Safety = risk recognition + resources + Plan B + ability to act."]],[["New Capability","New Capability"],["風險管理。","Risk management."]],[["Wisdom","Wisdom"],["不能控制世界，可以提高自己的可應對性。","You can't control the world, but you can make yourself more able to respond."]]]},{"n":4,"t":["先處理能控制的","Handle What You Can Control First"],"f":[[["金句","Key line"],["不要把全部能量花在不能控制的地方。","Don't spend all your energy where you have no control."]],[["舊Model","Old Model"],["只要我一直想，就能讓事情改變。","If I keep thinking about it, I can make things change."]],[["Prediction Error","Prediction Error"],["思考不等於控制。","Thinking is not controlling."]],[["Error Type","Error Type"],["控制錯置。","Misplaced control."]],[["Bottleneck","Bottleneck"],["可控與不可控沒有分開。","Controllable and uncontrollable haven't been separated."]],[["Correct Action","Correct Action"],["畫出控制圈。","Draw your circle of control."]],[["Minimum Action","Minimum Action"],["列出一件現在能做的事。","List one thing you can do right now."]],[["Model Update","Model Update"],["Agency來自可執行節點。","Agency comes from actionable nodes."]],[["New Capability","New Capability"],["控制圈辨識。","Identifying your circle of control."]],[["Wisdom","Wisdom"],["力量要放在有回饋的地方。","Put your strength where there is feedback."]]]},{"n":5,"t":["資源盤點","Take Stock of Resources"],"f":[[["金句","Key line"],["覺得自己什麼都沒有時，先重新盤點。","When you feel you have nothing, take stock again."]],[["舊Model","Old Model"],["我缺少某一項資源，所以沒有辦法。","I'm missing one resource, so there's nothing I can do."]],[["Prediction Error","Prediction Error"],["常常不是沒有資源，而是沒有看見資源。","Often it's not a lack of resources, but not seeing them."]],[["Bottleneck","Bottleneck"],["Resource Map缺失。","Missing Resource Map."]],[["Correct Action","Correct Action"],["盤點人、錢、時間、工具、知識、關係。","Inventory people, money, time, tools, knowledge and relationships."]],[["Minimum Action","Minimum Action"],["找出三項已存在資源。","Find three resources you already have."]],[["Model Update","Model Update"],["限制之外通常還存在可用節點。","Beyond the limits there are usually still usable nodes."]],[["New Capability","New Capability"],["資源辨識。","Recognizing resources."]],[["Wisdom","Wisdom"],["先看手上有什麼，再看缺什麼。","First see what's in your hands, then see what's missing."]]]},{"n":6,"t":["休息不是浪費","Rest Is Not Waste"],"f":[[["金句","Key line"],["休息不是停止前進，而是維修前進的系統。","Rest isn't stopping your progress — it's maintaining the system that moves you forward."]],[["舊Model","Old Model"],["停下來就是落後。","Stopping means falling behind."]],[["Prediction Error","Prediction Error"],["長期過載會降低Output。","Long-term overload lowers Output."]],[["Bottleneck","Bottleneck"],["恢復不足。","Insufficient recovery."]],[["Correct Action","Correct Action"],["把Recovery納入計畫。","Build Recovery into the plan."]],[["Minimum Action","Minimum Action"],["安排10分鐘真正休息。","Schedule 10 minutes of real rest."]],[["Model Update","Model Update"],["休息是Performance Loop的一部分。","Rest is part of the Performance Loop."]],[["New Capability","New Capability"],["恢復管理。","Recovery management."]],[["Wisdom","Wisdom"],["可持續比短期爆發更重要。","Sustainability matters more than short bursts."]]]},{"n":7,"t":["不要透支明天","Don't Overdraw Tomorrow"],"f":[[["金句","Key line"],["今天的效率，不應靠借走明天的能量。","Today's efficiency shouldn't come from borrowing tomorrow's energy."]],[["舊Model","Old Model"],["撐過今天就好。","Just get through today."]],[["Prediction Error","Prediction Error"],["睡眠債、壓力債最後都會回來。","Sleep debt and stress debt always come back."]],[["Bottleneck","Bottleneck"],["只看短期Output。","Only looking at short-term Output."]],[["Correct Action","Correct Action"],["計算延遲成本。","Calculate the delayed cost."]],[["Minimum Action","Minimum Action"],["今天少做一件低Priority工作。","Do one fewer low-Priority task today."]],[["Model Update","Model Update"],["真正效率＝今天Output＋明天仍可運作。","True efficiency = today's Output + still being able to function tomorrow."]],[["New Capability","New Capability"],["長期資源管理。","Long-term resource management."]],[["Wisdom","Wisdom"],["不要用未來替現在買單。","Don't make the future pay for the present."]]]},{"n":8,"t":["建立自己的基地","Build Your Own Base"],"f":[[["金句","Key line"],["外面再亂，也要有一個能讓自己恢復的地方。","No matter how chaotic it is outside, have a place where you can recover."]],[["舊Model","Old Model"],["環境不重要。","Environment doesn't matter."]],[["Prediction Error","Prediction Error"],["環境會持續影響神經與注意力。","Environment continuously affects your nerves and attention."]],[["Bottleneck","Bottleneck"],["Recovery Environment不足。","Not enough Recovery Environment."]],[["Correct Action","Correct Action"],["建立固定恢復空間。","Create a fixed recovery space."]],[["Minimum Action","Minimum Action"],["整理一個桌面、床邊或角落。","Tidy one desk, bedside or corner."]],[["Model Update","Model Update"],["環境也是調節工具。","Environment is also a regulation tool."]],[["New Capability","New Capability"],["環境設計。","Environment design."]],[["Wisdom","Wisdom"],["不要只靠意志力，讓環境幫你。","Don't rely only on willpower — let your environment help you."]]]},{"n":9,"t":["一次只處理現在","Deal Only With Now"],"f":[[["金句","Key line"],["現在沒有發生的災難，不必提前活一次。","A disaster that hasn't happened doesn't need to be lived through in advance."]],[["舊Model","Old Model"],["最壞情況可能發生，所以我要一直擔心。","The worst could happen, so I must keep worrying."]],[["Prediction Error","Prediction Error"],["可能性不等於正在發生。","Possible is not the same as happening."]],[["Error Type","Error Type"],["災難化。","Catastrophizing."]],[["Correct Action","Correct Action"],["分開Now與Maybe。","Separate Now from Maybe."]],[["Minimum Action","Minimum Action"],["問：「此刻真正發生什麼？」","Ask: \"What is actually happening right now?\""]],[["Model Update","Model Update"],["Reality先於想像。","Reality comes before imagination."]],[["New Capability","New Capability"],["現實校準。","Reality calibration."]],[["Wisdom","Wisdom"],["不要替尚未發生的事情預付痛苦。","Don't prepay pain for things that haven't happened."]]]},{"n":10,"t":["建立備案","Make a Backup Plan"],"f":[[["金句","Key line"],["Plan B不是悲觀，而是降低恐懼的方法。","Plan B isn't pessimism — it's a way to reduce fear."]],[["舊Model","Old Model"],["只有一條路。","There's only one road."]],[["Prediction Error","Prediction Error"],["多數問題其實存在替代路徑。","Most problems actually have alternative paths."]],[["Bottleneck","Bottleneck"],["Option太少。","Too few Options."]],[["Correct Action","Correct Action"],["建立第二與第三方案。","Build a second and third plan."]],[["Minimum Action","Minimum Action"],["寫下兩個替代方案。","Write down two alternatives."]],[["Model Update","Model Update"],["Option增加，Agency增加。","More Options, more Agency."]],[["New Capability","New Capability"],["備案思維。","Backup-plan thinking."]],[["Wisdom","Wisdom"],["自由度來自可行路徑數。","Freedom comes from the number of workable paths."]]]},{"n":11,"t":["金錢是資源","Money Is a Resource"],"f":[[["金句","Key line"],["錢不是你的價值，而是一種可配置資源。","Money isn't your worth; it's a resource you can allocate."]],[["舊Model","Old Model"],["有錢才代表成功／沒錢代表失敗。","Having money means success / no money means failure."]],[["Prediction Error","Prediction Error"],["人格價值與資源數量不是同一件事。","Personal worth and amount of resources are not the same thing."]],[["Bottleneck","Bottleneck"],["Money與Identity綁定。","Money tied to Identity."]],[["Correct Action","Correct Action"],["把金錢轉成Flow來看。","Look at money as a Flow."]],[["Minimum Action","Minimum Action"],["記錄今天一筆收入與一筆支出。","Record one income and one expense today."]],[["Model Update","Model Update"],["Money＝Resource Allocation。","Money = Resource Allocation."]],[["New Capability","New Capability"],["財務覺察。","Financial awareness."]],[["Wisdom","Wisdom"],["先管理流向，再評價數量。","Manage the flow first, then judge the amount."]]]},{"n":12,"t":["小量累積","Small, Steady Accumulation"],"f":[[["金句","Key line"],["穩定的小步，常常勝過偶爾的大爆發。","Steady small steps often beat occasional big bursts."]],[["舊Model","Old Model"],["一定要一次做很多才有效。","It only works if I do a lot at once."]],[["Prediction Error","Prediction Error"],["複利依靠重複。","Compounding depends on repetition."]],[["Correct Action","Correct Action"],["降低每日行動門檻。","Lower the threshold for daily action."]],[["Minimum Action","Minimum Action"],["做5分鐘。","Do 5 minutes."]],[["Model Update","Model Update"],["Consistency > Intensity。","Consistency > Intensity."]],[["New Capability","New Capability"],["持續力。","Persistence."]],[["Wisdom","Wisdom"],["能重複的行動才有複利。","Only repeatable actions compound."]]]},{"n":13,"t":["規律降低混亂","Routine Reduces Chaos"],"f":[[["金句","Key line"],["當生活很亂，先固定幾個不需要重新決定的節點。","When life is chaotic, fix a few points you don't have to re-decide."]],[["舊Model","Old Model"],["每天看心情安排。","I plan each day by mood."]],[["Prediction Error","Prediction Error"],["大量小決策會消耗注意力。","Lots of small decisions drain attention."]],[["Bottleneck","Bottleneck"],["Decision Load過高。","Decision Load too high."]],[["Correct Action","Correct Action"],["固定起床、飲食、工作或睡眠錨點。","Fix anchors for waking, eating, working or sleeping."]],[["Minimum Action","Minimum Action"],["先固定一個時間點。","Fix one time point first."]],[["Model Update","Model Update"],["Routine可以降低系統熵。","Routine can lower the system's entropy."]],[["New Capability","New Capability"],["節律管理。","Rhythm management."]],[["Wisdom","Wisdom"],["規律替大腦省下決策能量。","Routine saves your brain decision energy."]]]},{"n":14,"t":["先補漏洞","Patch the Leaks First"],"f":[[["金句","Key line"],["一直加東西以前，先看看哪裡正在漏。","Before adding more, check where things are leaking."]],[["舊Model","Old Model"],["問題靠增加更多資源解決。","Problems are solved by adding more resources."]],[["Prediction Error","Prediction Error"],["如果漏洞存在，投入越多可能漏越多。","If a leak exists, the more you pour in, the more may leak out."]],[["Correct Action","Correct Action"],["找Leak。","Find the Leak."]],[["Minimum Action","Minimum Action"],["找出目前最大時間、金錢或能量漏洞。","Find your biggest current leak of time, money or energy."]],[["Model Update","Model Update"],["減少Loss有時比增加Input有效。","Reducing Loss is sometimes more effective than increasing Input."]],[["New Capability","New Capability"],["瓶頸診斷。","Bottleneck diagnosis."]],[["Wisdom","Wisdom"],["先止漏，再加水。","Stop the leak first, then add water."]]]},{"n":15,"t":["界線也是安全","Boundaries Are Safety Too"],"f":[[["金句","Key line"],["不是所有要求都需要答應。","Not every request needs a yes."]],[["舊Model","Old Model"],["拒絕別人會失去關係。","Saying no will cost me the relationship."]],[["Prediction Error","Prediction Error"],["沒有界線反而可能累積怨氣。","Without boundaries, resentment may build up instead."]],[["Bottleneck","Bottleneck"],["Boundary不足。","Not enough Boundary."]],[["Correct Action","Correct Action"],["區分責任。","Distinguish whose responsibility it is."]],[["Minimum Action","Minimum Action"],["今天對一件超出負荷的事說「我需要想一下」。","Today, say \"I need to think about it\" to one thing beyond your capacity."]],[["Model Update","Model Update"],["界線保護長期關係。","Boundaries protect long-term relationships."]],[["New Capability","New Capability"],["界線建立。","Setting boundaries."]],[["Wisdom","Wisdom"],["好的關係不需要靠無限犧牲維持。","Good relationships don't need endless sacrifice to survive."]]]},{"n":16,"t":["不要忽略小警報","Don't Ignore Small Alarms"],"f":[[["金句","Key line"],["小問題被看見時，通常最便宜。","Problems are usually cheapest when they're small and noticed."]],[["舊Model","Old Model"],["還能撐，所以沒事。","I can still cope, so it's fine."]],[["Prediction Error","Prediction Error"],["系統失衡常先出現小訊號。","System imbalance often shows small signals first."]],[["Correct Action","Correct Action"],["建立Early Warning。","Set up an Early Warning."]],[["Minimum Action","Minimum Action"],["記錄一個最近重複出現的小問題。","Note one small problem that keeps recurring lately."]],[["Model Update","Model Update"],["Signal不是麻煩，而是資料。","A Signal isn't a nuisance — it's data."]],[["New Capability","New Capability"],["早期偵測。","Early detection."]],[["Wisdom","Wisdom"],["越早修正，代價通常越小。","The earlier you correct, the smaller the cost usually is."]]]},{"n":17,"t":["睡眠是底層資源","Sleep Is a Foundational Resource"],"f":[[["金句","Key line"],["睡眠不足時，不要把所有低效都怪給自己。","When you're short on sleep, don't blame all the inefficiency on yourself."]],[["舊Model","Old Model"],["我意志力不夠。","I don't have enough willpower."]],[["Prediction Error","Prediction Error"],["睡眠會影響注意、記憶與情緒調節。","Sleep affects attention, memory and emotion regulation."]],[["Correct Action","Correct Action"],["先校正生理Baseline。","Correct your physiological Baseline first."]],[["Minimum Action","Minimum Action"],["今晚提前15分鐘進入睡眠流程。","Start your bedtime routine 15 minutes earlier tonight."]],[["Model Update","Model Update"],["Performance受底層狀態限制。","Performance is limited by your underlying state."]],[["New Capability","New Capability"],["睡眠管理。","Sleep management."]],[["Wisdom","Wisdom"],["先保護系統，再要求Output。","Protect the system first, then demand Output."]]]},{"n":18,"t":["吃飯也是維持系統","Eating Maintains the System Too"],"f":[[["金句","Key line"],["身體不是用意志力充電的。","The body isn't recharged by willpower."]],[["舊Model","Old Model"],["忙起來可以忽略吃飯。","When I'm busy I can skip meals."]],[["Prediction Error","Prediction Error"],["能量供應不足會影響表現。","Insufficient energy supply affects performance."]],[["Correct Action","Correct Action"],["讓基本營養變成固定Input。","Make basic nutrition a fixed Input."]],[["Minimum Action","Minimum Action"],["準備下一餐。","Prepare your next meal."]],[["Model Update","Model Update"],["身體需要材料才能產生Output。","The body needs materials to produce Output."]],[["New Capability","New Capability"],["基本自我照顧。","Basic self-care."]],[["Wisdom","Wisdom"],["不要要求沒有Input的系統持續Output。","Don't ask a system with no Input to keep producing Output."]]]},{"n":19,"t":["降低環境摩擦","Reduce Environmental Friction"],"f":[[["金句","Key line"],["如果一件好事很難開始，就把第一步變容易。","If a good thing is hard to start, make the first step easy."]],[["舊Model","Old Model"],["做不到是我不自律。","If I can't do it, I lack self-discipline."]],[["Prediction Error","Prediction Error"],["行為高度受到摩擦成本影響。","Behavior is heavily shaped by friction costs."]],[["Correct Action","Correct Action"],["重新設計環境。","Redesign the environment."]],[["Minimum Action","Minimum Action"],["把明天第一個工具先準備好。","Get tomorrow's first tool ready now."]],[["Model Update","Model Update"],["Behavior＝Motivation × Environment × Friction。","Behavior = Motivation × Environment × Friction."]],[["New Capability","New Capability"],["行為設計。","Behavior design."]],[["Wisdom","Wisdom"],["好系統讓正確行動比較容易。","A good system makes the right action easier."]]]},{"n":20,"t":["把問題寫下來","Write the Problem Down"],"f":[[["金句","Key line"],["腦中的問題通常比紙上的問題大。","Problems in your head are usually bigger than problems on paper."]],[["舊Model","Old Model"],["我必須一直記住所有事情。","I have to remember everything all the time."]],[["Prediction Error","Prediction Error"],["工作記憶有限。","Working memory is limited."]],[["Correct Action","Correct Action"],["Externalize。","Externalize."]],[["Minimum Action","Minimum Action"],["把所有擔心寫下來。","Write down all your worries."]],[["Model Update","Model Update"],["外部工具可以擴充認知容量。","External tools can expand cognitive capacity."]],[["New Capability","New Capability"],["外部化思考。","Externalized thinking."]],[["Wisdom","Wisdom"],["不要讓大腦同時當硬碟與處理器。","Don't make your brain be both the hard drive and the processor."]]]},{"n":21,"t":["分清需要與想要","Tell Needs From Wants"],"f":[[["金句","Key line"],["不是每個想要，都必須立刻滿足。","Not every want has to be satisfied right away."]],[["舊Model","Old Model"],["想要＝需要。","Want = need."]],[["Prediction Error","Prediction Error"],["短期慾望與長期需求可能衝突。","Short-term desires and long-term needs can conflict."]],[["Correct Action","Correct Action"],["Need/Want分流。","Split Need / Want."]],[["Minimum Action","Minimum Action"],["購買或決定前多問一次「這解決什麼問題？」","Before buying or deciding, ask once more: \"What problem does this solve?\""]],[["Model Update","Model Update"],["資源應流向真正Priority。","Resources should flow to real Priorities."]],[["New Capability","New Capability"],["延遲滿足。","Delayed gratification."]],[["Wisdom","Wisdom"],["自由不是什麼都買，而是知道什麼值得。","Freedom isn't buying everything; it's knowing what's worth it."]]]},{"n":22,"t":["接受有限","Accept Limits"],"f":[[["金句","Key line"],["資源有限不是失敗，而是所有決策的起點。","Limited resources aren't failure — they're the starting point of every decision."]],[["舊Model","Old Model"],["我應該什麼都做到。","I should be able to do everything."]],[["Prediction Error","Prediction Error"],["時間、能量與注意力都有上限。","Time, energy and attention all have limits."]],[["Correct Action","Correct Action"],["承認Constraint。","Acknowledge the Constraint."]],[["Minimum Action","Minimum Action"],["今天主動放掉一件低價值任務。","Actively drop one low-value task today."]],[["Model Update","Model Update"],["限制會迫使Priority出現。","Limits force Priorities to emerge."]],[["New Capability","New Capability"],["取捨。","Making trade-offs."]],[["Wisdom","Wisdom"],["沒有取捨，就沒有真正的策略。","Without trade-offs, there is no real strategy."]]]},{"n":23,"t":["求助也是能力","Asking for Help Is a Skill"],"f":[[["金句","Key line"],["真正的自主，不代表所有事情都自己做。","True autonomy doesn't mean doing everything yourself."]],[["舊Model","Old Model"],["求助表示我不夠好。","Asking for help means I'm not good enough."]],[["Prediction Error","Prediction Error"],["人類本來就是協作網路。","Humans are a collaborative network by nature."]],[["Correct Action","Correct Action"],["找到適合的Node。","Find the right Node."]],[["Minimum Action","Minimum Action"],["向一個人提出一個具體請求。","Make one specific request of one person."]],[["Model Update","Model Update"],["Agency包括調動外部資源。","Agency includes mobilizing external resources."]],[["New Capability","New Capability"],["求助與協作。","Asking for help and collaborating."]],[["Wisdom","Wisdom"],["強不是一個人扛，而是知道何時連結資源。","Strength isn't carrying it alone; it's knowing when to connect to resources."]]]},{"n":24,"t":["建立可信任流程","Build Trustworthy Processes"],"f":[[["金句","Key line"],["不要每天重新靠勇氣完成同一件事。","Don't rely on fresh courage every day to do the same thing."]],[["舊Model","Old Model"],["每次都臨場處理就好。","I'll just improvise each time."]],[["Prediction Error","Prediction Error"],["重複問題會重複消耗認知資源。","Repeated problems repeatedly consume cognitive resources."]],[["Correct Action","Correct Action"],["建立SOP。","Create an SOP."]],[["Minimum Action","Minimum Action"],["把一個重複工作寫成三步驟。","Write one recurring task as three steps."]],[["Model Update","Model Update"],["流程把經驗變成可重複能力。","Processes turn experience into repeatable capability."]],[["New Capability","New Capability"],["流程化。","Systematizing."]],[["Wisdom","Wisdom"],["智慧的一部分，就是不用每次從零開始。","Part of wisdom is not having to start from zero each time."]]]},{"n":25,"t":["保留緩衝","Keep a Buffer"],"f":[[["金句","Key line"],["行程塞滿，不代表時間利用得好。","A packed schedule doesn't mean time is well used."]],[["舊Model","Old Model"],["空白時間是浪費。","Empty time is wasted time."]],[["Prediction Error","Prediction Error"],["Reality一定會出現意外。","Reality will always bring surprises."]],[["Correct Action","Correct Action"],["加入Buffer。","Add a Buffer."]],[["Minimum Action","Minimum Action"],["今天保留15分鐘空白。","Keep 15 minutes blank today."]],[["Model Update","Model Update"],["Robust System需要冗餘。","A Robust System needs redundancy."]],[["New Capability","New Capability"],["緩衝設計。","Buffer design."]],[["Wisdom","Wisdom"],["沒有餘裕的系統最容易崩。","A system with no slack is the easiest to collapse."]]]},{"n":26,"t":["不要一直比較","Stop Constant Comparison"],"f":[[["金句","Key line"],["別人的進度，不是你的Baseline。","Other people's progress is not your Baseline."]],[["舊Model","Old Model"],["別人比我快，所以我落後。","Others are faster than me, so I'm behind."]],[["Prediction Error","Prediction Error"],["每個人的資源、起點與目標不同。","Everyone has different resources, starting points and goals."]],[["Correct Action","Correct Action"],["改與自己的Baseline比較。","Compare with your own Baseline instead."]],[["Minimum Action","Minimum Action"],["寫下自己比一個月前多會的一件事。","Write one thing you can do now that you couldn't a month ago."]],[["Model Update","Model Update"],["有效Feedback必須有正確Reference。","Useful Feedback needs the right Reference."]],[["New Capability","New Capability"],["自我校準。","Self-calibration."]],[["Wisdom","Wisdom"],["比較要產生資訊，不是產生羞恥。","Comparison should produce information, not shame."]]]},{"n":27,"t":["允許慢","Allow Slowness"],"f":[[["金句","Key line"],["慢不一定是停滯，有時是系統正在重新穩定。","Slow isn't necessarily stuck; sometimes the system is re-stabilizing."]],[["舊Model","Old Model"],["沒有快速進步就是失敗。","No fast progress means failure."]],[["Prediction Error","Prediction Error"],["複雜系統的改變常有延遲。","Change in complex systems often lags."]],[["Correct Action","Correct Action"],["觀察Trend而非單點。","Watch the Trend, not single points."]],[["Minimum Action","Minimum Action"],["把觀察時間拉長。","Lengthen your observation window."]],[["Model Update","Model Update"],["Lag不等於No Effect。","Lag doesn't mean No Effect."]],[["New Capability","New Capability"],["延遲理解。","Understanding delays."]],[["Wisdom","Wisdom"],["不要因為果實還沒出現，就否定正在長的根。","Don't deny the growing roots just because the fruit hasn't appeared yet."]]]},{"n":28,"t":["危機先縮小","Shrink the Crisis First"],"f":[[["金句","Key line"],["事情太大時，把它切到可以動。","When something is too big, cut it down until you can move."]],[["舊Model","Old Model"],["我要解決整個問題才能開始。","I have to solve the whole problem before I can start."]],[["Prediction Error","Prediction Error"],["大問題通常由很多Node組成。","Big problems are usually made of many Nodes."]],[["Correct Action","Correct Action"],["Decompose。","Decompose."]],[["Minimum Action","Minimum Action"],["把問題切成下一個10分鐘任務。","Cut the problem into the next 10-minute task."]],[["Model Update","Model Update"],["可執行單位越小，啟動成本越低。","The smaller the actionable unit, the lower the startup cost."]],[["New Capability","New Capability"],["問題拆解。","Breaking problems down."]],[["Wisdom","Wisdom"],["不要搬整座山，先搬眼前一塊石頭。","Don't move the whole mountain; move the one stone in front of you."]]]},{"n":29,"t":["建立底線","Set Your Bottom Lines"],"f":[[["金句","Key line"],["知道自己不能失去什麼，決策會清楚很多。","Knowing what you can't afford to lose makes decisions much clearer."]],[["舊Model","Old Model"],["所有東西都同等重要。","Everything is equally important."]],[["Prediction Error","Prediction Error"],["資源其實存在層級。","Resources actually have tiers."]],[["Correct Action","Correct Action"],["定義Minimum Viable Stability。","Define Minimum Viable Stability."]],[["Minimum Action","Minimum Action"],["列出健康、金錢、時間、關係各一條底線。","List one bottom line each for health, money, time and relationships."]],[["Model Update","Model Update"],["先保護核心節點。","Protect the core nodes first."]],[["New Capability","New Capability"],["底線管理。","Managing bottom lines."]],[["Wisdom","Wisdom"],["先守住不可逆的，再追求可增加的。","Guard the irreversible first, then pursue what can be added."]]]},{"n":30,"t":["不要因一次失敗否定全部","Don't Let One Failure Negate Everything"],"f":[[["金句","Key line"],["一次跌倒只是Data Point，不是人生判決。","One fall is just a Data Point, not a verdict on your life."]],[["舊Model","Old Model"],["這次失敗＝我就是失敗者。","This failure = I am a failure."]],[["Prediction Error","Prediction Error"],["單一事件不能代表整體分布。","A single event can't represent the whole distribution."]],[["Error Type","Error Type"],["過度概括。","Overgeneralization."]],[["Correct Action","Correct Action"],["增加樣本。","Increase the sample."]],[["Minimum Action","Minimum Action"],["再試一次不同方法。","Try again with a different method."]],[["Model Update","Model Update"],["Failure＝Feedback。","Failure = Feedback."]],[["New Capability","New Capability"],["韌性。","Resilience."]],[["Wisdom","Wisdom"],["失敗最有價值的部分是它提供的新資訊。","The most valuable part of failure is the new information it provides."]]]},{"n":31,"t":["重新開始","Start Again"],"f":[[["金句","Key line"],["中斷不等於結束，下一次行動就是新的起點。","An interruption isn't an ending; the next action is a new starting point."]],[["舊Model","Old Model"],["破功了就沒有意義。","Once I've broken the streak, it's meaningless."]],[["Prediction Error","Prediction Error"],["長期結果由大量回合構成。","Long-term results are made of many rounds."]],[["Correct Action","Correct Action"],["縮短Restart Time。","Shorten your Restart Time."]],[["Minimum Action","Minimum Action"],["現在重新做一次最小版本。","Do the smallest version again, right now."]],[["Model Update","Model Update"],["真正能力不是永不中斷，而是快速重啟。","Real capability isn't never being interrupted; it's restarting fast."]],[["New Capability","New Capability"],["Restart能力。","Restart ability."]],[["Wisdom","Wisdom"],["跌倒不可怕，長時間不起來才增加成本。","Falling isn't scary; staying down for a long time is what raises the cost."]]]},{"n":32,"t":["讓生活可預測一點","Make Life a Bit More Predictable"],"f":[[["金句","Key line"],["不需要控制所有未來，只要增加幾個可靠節點。","You don't need to control the whole future — just add a few reliable nodes."]],[["舊Model","Old Model"],["人生完全不可控。","Life is completely uncontrollable."]],[["Prediction Error","Prediction Error"],["雖然不能控制全部，但能建立部分穩定結構。","You can't control it all, but you can build some stable structure."]],[["Correct Action","Correct Action"],["建立Anchor。","Set Anchors."]],[["Minimum Action","Minimum Action"],["固定一個每日儀式。","Fix one daily ritual."]],[["Model Update","Model Update"],["局部可預測性可以降低整體不確定負荷。","Local predictability can lower the overall load of uncertainty."]],[["New Capabi or the Prediction Error"],[184,"找反例","Find Counterexamples"],[185,"找支持證據","Find Supporting Evidence"],[186,"找反對證據","Find Opposing Evidence"],[187,"提出三種解釋","Propose Three Explanations"],[188,"降低絕對化","Reduce Absolutes"],[189,"辨認確認偏誤","Identify Confirmation Bias"],[190,"辨認災難化","Identify Catastrophizing"],[191,"辨認過度概括","Identify Overgeneralization"],[192,"辨認讀心","Identify Mind-Reading"],[193,"辨認因果錯置","Identify Misplaced Causation"],[194,"辨認控制錯覺","Identify the Illusion of Control"],[195,"辨認沉沒成本","Identify Sunk Costs"],[196,"辨認身份綁定","Identify Identity Fusion"],[197,"辨認情緒推理","Identify Emotional Reasoning"],[198,"辨認錯誤Reference","Identify the Wrong Reference"],[199,"重新定義問題","Redefine the Problem"],[200,"尋找真正Bottleneck","Find the Real Bottleneck"],[201,"提出New Hypothesis","Propose a New Hypothesis"],[202,"設計Reality Test","Design a Reality Test"],[203,"取得Feedback","Get Feedback"],[204,"建立Evidence","Build Evidence"],[205,"重新測試","Test Again"],[206,"更新Model","Update the Model"],[207,"保留不確定性","Keep Uncertainty Open"],[208,"允許自己不知道","Allow Yourself Not to Know"],[209,"讓Reality修正我","Let Reality Correct Me"],[210,"我可以看見並更新自己的Model","I Can See and Update My Own Model"]]},{"h":["【🟪紫色｜TRANSCENDENCE｜211–245】","【🟪Violet｜TRANSCENDENCE｜211–245】"],"items":[[211,"答案不是永遠固定","Answers Aren't Fixed Forever"],[212,"世界比Model大","The World Is Bigger Than the Model"],[213,"地圖不是領土","The Map Is Not the Territory"],[214,"接受未知","Accept the Unknown"],[215,"與不確定共處","Live With Uncertainty"],[216,"放下必須知道","Let Go of Needing to Know"],[217,"放下必須控制","Let Go of Needing to Control"],[218,"放下單一答案","Let Go of the Single Answer"],[219,"容納矛盾","Hold Contradictions"],[220,"容納多種視角","Hold Multiple Perspectives"],[221,"從對錯走向條件","From Right/Wrong to Conditions"],[222,"從個人走向系統","From the Individual to the System"],[223,"從事件看Pattern","From Events to Patterns"],[224,"從Pattern看Structure","From Patterns to Structure"],[225,"從Structure看Dynamics","From Structure to Dynamics"],[226,"從Dynamics看Feedback","From Dynamics to Feedback"],[227,"從Feedback看Learning","From Feedback to Learning"],[228,"從Learning看Evolution","From Learning to Evolution"],[229,"讓舊自己死亡","Let the Old Self Die"],[230,"允許新自己生成","Allow a New Self to Emerge"],[231,"身份也可以更新","Identity Can Be Updated Too"],[232,"信念也可以更新","Beliefs Can Be Updated Too"],[233,"價值排序可以更新","Value Rankings Can Be Updated"],[234,"人生策略可以更新","Life Strategies Can Be Updated"],[235,"智慧不是知道很多","Wisdom Isn't Knowing a Lot"],[236,"智慧是壓縮規律","Wisdom Is Compressing Patterns"],[237,"智慧是知道何時不用舊規律","Wisdom Is Knowing When Not to Use Old Rules"],[238,"增加可能路徑","Increase Possible Paths"],[239,"增加自由度","Increase Degrees of Freedom"],[240,"增加選擇權","Increase Your Choices"],[241,"提高適應力","Improve Adaptability"],[242,"提高生成力","Improve Generativity"],[243,"成為可持續更新的系統","Become a Continuously Updating System"],[244,"不保存答案，保存更新能力","Don't Save Answers — Save the Ability to Update"],[245,"我不是固定的我，我是持續生成中的系統","I Am Not a Fixed Me; I Am a System Still Becoming"]]}],"structure":[["【245張卡的真正結構】","【The True Structure of the 245 Cards】"],["紅｜先讓系統活得下來。","Red｜First, let the system survive."],["↓","↓"],["橙｜讓感受與生命能量重新流動。","Orange｜Let feelings and life energy flow again."],["↓","↓"],["黃｜把選擇權與行動權拿回來。","Yellow｜Take back the power to choose and act."],["↓","↓"],["綠｜進入關係，但不失去自己。","Green｜Enter relationships without losing yourself."],["↓","↓"],["藍｜讓真實資訊在關係中流動。","Blue｜Let true information flow within relationships."],["↓","↓"],["靛｜看見自己的Internal Model與Prediction Error。","Indigo｜See your own Internal Model and Prediction Error."],["↓","↓"],["紫｜不再被任何單一Model困住。","Violet｜No longer be trapped by any single Model."],["↓","↓"],["Reality","Reality"],["→ Difference","→ Difference"],["→ Prediction Error","→ Prediction Error"],["→ Model Update","→ Model Update"],["→ New Capability","→ New Capability"],["→ New Option","→ New Option"],["→ Higher Agency","→ Higher Agency"],["→ Higher Freedom","→ Higher Freedom"],["→ New Reality","→ New Reality"],["→ 下一輪更新。","→ The next round of updating."]],"summary":[["【一句話總結】","【One-Sentence Summary】"],["紅色教你「站穩」。","Red teaches you to \"stand steady.\""],["橙色教你「感受」。","Orange teaches you to \"feel.\""],["黃色教你「選擇」。","Yellow teaches you to \"choose.\""],["綠色教你「連結」。","Green teaches you to \"connect.\""],["藍色教你「表達」。","Blue teaches you to \"express.\""],["靛色教你「看見」。","Indigo teaches you to \"see.\""],["紫色教你「超越」。","Violet teaches you to \"transcend.\""],["七色最後不是七套答案，而是一套能力：不論人生出現什麼Reality，我都有能力看見、測試、修正、重新選擇，再生成下一個更能面對Reality的自己。","In the end the seven colors aren't seven sets of answers but one capability: whatever Reality life brings, I can see, test, correct, choose again — and generate the next version of me that can better face Reality."]]},"hd":{"core":[["【核心定位】","【Core Positioning】"],["人類圖可以當作「提出假設的Pattern Map」，但不要把它當成決定你是誰的真理。","Human Design can serve as a \"Pattern Map for generating hypotheses,\" but don't treat it as the truth that decides who you are."],["真正有價值的流程是：看見Pattern → 提出Prediction → 現實測試 → 找Prediction Error → Model Update → 長出能力。","The truly valuable process is: see a Pattern → make a Prediction → test against reality → find the Prediction Error → Model Update → grow a capability."],["自由不是「找到真正的自己」後永遠照那個版本活。","Freedom isn't \"finding your true self\" and then living that version forever."],["自由是「我知道自己現在怎麼運作，但我仍然有能力更新」。","Freedom is \"I know how I currently operate, but I still have the ability to update.\""]],"domains":[{"n":1,"name":["自我","Self"],"q":["我怎麼運作？","How Do I Operate?"],"f":[[["Human Design問題","Human Design question"],["我怎麼運作？"," How do I operate?"]],[["真正能力","Real capability"],["Self-awareness｜自我覺察"," Self-awareness"]],[["解答","Answer"],["觀察自己在不同情境下的思想、情緒、身體與行為反應。"," Observe your thoughts, emotions, body and behavioral reactions in different situations."]],[["舊Model","Old Model"],["我就是這種人。"," I'm just that kind of person."]],[["新Model","New Model"],["這是我目前常出現的運作Pattern。"," This is an operating Pattern that often shows up in me right now."]],[["Prediction","Prediction"],["如果同樣情境再次發生，我可能再次出現同樣反應。"," If the same situation happens again, I may react the same way again."]],[["Prediction Error","Prediction Error"],["實際反應與預測不同，就是更新自己的新資料。"," When my actual reaction differs from the prediction, that's new data for updating myself."]],[["訓練","Training"],["每天問「剛才發生什麼？我怎麼反應？為什麼？」"," Ask every day, \"What just happened? How did I react? Why?\""]],[["能力","Capability"],["看見自己，而不是被自己自動駕駛。"," Seeing yourself, rather than being on autopilot."]],[["智慧","Wisdom"],["能觀察自己的人，才有機會重新設計自己。"," Only people who can observe themselves have the chance to redesign themselves."]]]},{"n":2,"name":["人格","Personality"],"q":["我有哪些Pattern？","What Patterns Do I Have?"],"f":[[["Human Design問題","Human Design question"],["我有哪些Pattern？"," What Patterns do I have?"]],[["真正能力","Real capability"],["Identity Flexibility｜身份彈性"," Identity Flexibility"]],[["解答","Answer"],["辨認自己反覆出現的思考、情緒、關係與行動模式。"," Identify your recurring patterns of thinking, feeling, relating and acting."]],[["舊Model","Old Model"],["我的人格就是固定的。"," My personality is fixed."]],[["新Model","New Model"],["人格包含穩定傾向，也包含可以隨經驗與情境調整的部分。"," Personality includes stable tendencies, and also parts that can adjust with experience and context."]],[["Prediction","Prediction"],["我預測自己遇到某種人或事情會怎麼反應。"," I predict how I'll react when I meet certain people or situations."]],[["Prediction Error","Prediction Error"],["如果實際表現不同，就證明舊身份模型不完整。"," If I actually behave differently, it proves the old identity model is incomplete."]],[["訓練","Training"],["把「我是___的人」改成「我目前常常___」。"," Change \"I am a ___ person\" into \"I currently often ___.\""]],[["能力","Capability"],["Pattern Recognition＋Identity Flexibility。"," Pattern Recognition + Identity Flexibility."]],[["智慧","Wisdom"],["不要把Pattern變成牢籠。"," Don't turn a Pattern into a cage."]]]},{"n":3,"name":["身體","Body"],"q":["我注意到什麼訊號？","What Signals Do I Notice?"],"f":[[["Human Design問題","Human Design question"],["我的身體正在告訴我什麼？"," What is my body telling me?"]],[["真正能力","Real capability"],["Interoception｜內感受覺察"," Interoception"]],[["解答","Answer"],["辨認疲累、心跳、呼吸、緊繃、飢餓、疼痛、睡意等身體訊號。"," Recognize body signals such as tiredness, heartbeat, breathing, tension, hunger, pain and sleepiness."]],[["舊Model","Old Model"],["撐下去就好。"," Just push through."]],[["新Model","New Model"],["身體訊號是資料，不等於命令，也不應完全忽略。"," Body signals are data — not commands, but not to be completely ignored either."]],[["Prediction","Prediction"],["睡太少＋壓力增加 → 明天專注可能下降。"," Too little sleep + more stress → focus may drop tomorrow."]],[["Evidence","Evidence"],["睡眠、HRV、情緒、疲勞、活動量與實際表現。"," Sleep, HRV, mood, fatigue, activity level and actual performance."]],[["訓練","Training"],["Signal → Context → Action → Result。"," Signal → Context → Action → Result."]],[["能力","Capability"],["更早發現系統偏離Baseline。"," Noticing earlier when the system drifts from Baseline."]],[["智慧","Wisdom"],["身體不是敵人，而是Feedback System。"," The body is not an enemy but a Feedback System."]]]},{"n":4,"name":["情緒","Emotion"],"q":["情緒如何影響我？","How Do Emotions Affect Me?"],"f":[[["Human Design問題","Human Design question"],["情緒如何影響我的判斷？"," How do emotions affect my judgment?"]],[["真正能力","Real capability"],["Emotion Regulation｜情緒調節"," Emotion Regulation"]],[["解答","Answer"],["辨認情緒，而不是讓情緒直接控制決策。"," Recognize emotions instead of letting them directly control decisions."]],[["舊Model","Old Model"],["我感覺如此，所以事情一定如此。"," I feel it, so it must be so."]],[["新Model","New Model"],["Emotion ≠ Reality；情緒是重要訊號，但不是全部證據。"," Emotion ≠ Reality; emotions are important signals, but not the whole of the evidence."]],[["Prediction","Prediction"],["生氣時，我可能高估威脅、低估其他解釋。"," When angry, I may overestimate threats and underestimate other explanations."]],[["Correct Action","Correct Action"],["命名情緒 → 延遲反應 → 搜集證據 → 再決策。"," Name the emotion → delay the reaction → gather evidence → then decide."]],[["能力","Capability"],["Emotion Awareness＋Regulation＋Reappraisal。"," Emotion Awareness + Regulation + Reappraisal."]],[["智慧","Wisdom"],["不是沒有情緒，而是情緒來了仍然保有選擇權。"," It's not about having no emotions, but keeping your power to choose when they arrive."]]]},{"n":5,"name":["學習","Learning"],"q":["我在哪種Context學得好？","In What Context Do I Learn Well?"],"f":[[["Human Design問題","Human Design question"],["什麼環境與方式適合我學習？"," What environments and methods suit my learning?"]],[["真正能力","Real capability"],["Metacognition｜後設認知"," Metacognition"]],[["解答","Answer"],["知道自己「怎麼學才真的會」。"," Knowing \"how I actually learn so that it sticks.\""]],[["舊Model","Old Model"],["我英文不好。"," I'm bad at English."]],[["新Model","New Model"],["我要找出是哪個Skill Node形成Bottleneck。"," I need to find which Skill Node is forming the Bottleneck."]],[["Prediction","Prediction"],["如果問題是單字不足，增加有效字彙提取訓練後，閱讀表現應改善。"," If the problem is limited vocabulary, then after effective vocabulary-retrieval practice, reading performance should improve."]],[["Retest","Retest"],["換一篇文章再測。"," Test again with a different article."]],[["Evidence","Evidence"],["正確率、速度、錯誤類型是否改善。"," Whether accuracy, speed and error types improve."]],[["能力","Capability"],["Plan → Learn → Test → Diagnose → Update。"," Plan → Learn → Test → Diagnose → Update."]],[["智慧","Wisdom"],["高手不是永遠學得快，而是知道自己為什麼學不會。"," Experts don't always learn fast; they know why they aren't learning."]]]},{"n":6,"name":["工作","Work"],"q":["什麼環境讓能力容易發揮？","What Environment Lets My Abilities Shine?"],"f":[[["Human Design問題","Human Design question"],["什麼環境適合我？"," What environment suits me?"]],[["真正能力","Real capability"],["Person–Environment Fit｜人境適配"," Person–Environment Fit"]],[["解答","Answer"],["辨認自己的能力與環境條件如何互相作用。"," Recognize how your abilities and environmental conditions interact."]],[["舊Model","Old Model"],["不適合就是離開。"," If it doesn't fit, leave."]],[["新Model","New Model"],["先拆成Person × Task × Environment × Resource × Constraint。"," First break it down into Person × Task × Environment × Resource × Constraint."]],[["Prediction","Prediction"],["換掉哪一個環境變數，Output可能改善？"," Changing which environmental variable might improve Output?"]],[["Test","Test"],["先做低成本小實驗。"," Start with a low-cost small experiment."]],[["能力","Capability"],["Environment Design＋Job Crafting＋Adaptation。"," Environment Design + Job Crafting + Adaptation."]],[["智慧","Wisdom"],["不要只問「我適合什麼」，也問「我要如何設計環境讓能力出現」。"," Don't only ask \"what suits me,\" but also \"how can I design an environment where my abilities emerge.\""]]]},{"n":7,"name":["關係","Relationships"],"q":["我如何與別人互動？","How Do I Interact With Others?"],"f":[[["Human Design問題","Human Design question"],["我在關係中有哪些Pattern？"," What Patterns do I have in relationships?"]],[["真正能力","Real capability"],["Relationship Awareness｜關係覺察"," Relationship Awareness"]],[["解答","Answer"],["看見自己與不同的人互動時，會形成什麼Feedback Loop。"," See what Feedback Loops form when you interact with different people."]],[["舊Model","Old Model"],["都是他害我變成這樣。"," It's all their fault that I turned out like this."]],[["新Model","New Model"],["關係是Self × Other × Context × History形成的動態系統。"," A relationship is a dynamic system formed by Self × Other × Context × History."]],[["Prediction","Prediction"],["我用這種方式說話，對方可能如何反應？"," If I speak this way, how might the other person react?"]],[["Feedback","Feedback"],["對方真正怎麼反應？"," How did the other person actually react?"]],[["Model Update","Model Update"],["下一次換一種溝通方式測試。"," Next time, test a different way of communicating."]],[["能力","Capability"],["Perspective Taking＋Boundary＋Communication＋Repair。"," Perspective Taking + Boundary + Communication + Repair."]],[["智慧","Wisdom"],["關係不是找到完全正確的人，而是提高彼此調節與修復的能力。"," Relationships aren't about finding the perfectly right person, but about improving each other's ability to regulate and repair."]]]},{"n":8,"name":["決策","Decisions"],"q":["我怎麼做選擇？","How Do I Make Choices?"],"f":[[["Human Design問題","Human Design question"],["我適合怎麼決定？"," How should I decide?"]],[["真正能力","Real capability"],["Decision Skill｜決策能力"," Decision Skill"]],[["解答","Answer"],["不要只靠人格標籤，而要建立可以校準的決策流程。"," Don't rely only on personality labels; build a decision process that can be calibrated."]],[["舊Model","Old Model"],["跟著直覺一定對／理性分析一定對。"," Following intuition is always right / rational analysis is always right."]],[["新Model","New Model"],["Decision＝Goal＋Evidence＋Uncertainty＋Trade-off＋Feedback。"," Decision = Goal + Evidence + Uncertainty + Trade-off + Feedback."]],[["Prediction","Prediction"],["選A，我預測三個月後會出現什麼結果？"," If I choose A, what result do I predict in three months?"]],[["Counterfactual","Counterfactual"],["如果選B呢？"," What if I chose B?"]],[["Action","Action"],["小規模測試可逆選項。"," Test reversible options on a small scale."]],[["能力","Capability"],["Evidence Evaluation＋Probability＋Trade-off＋Calibration。"," Evidence Evaluation + Probability + Trade-off + Calibration."]],[["智慧","Wisdom"],["好決策不是保證結果正確，而是在當時資訊下建立高品質選擇機制。"," A good decision doesn't guarantee the right result; it builds a high-quality choosing mechanism given the information at the time."]]]},{"n":9,"name":["壓力","Stress"],"q":["我何時容易失衡？","When Do I Tend to Lose Balance?"],"f":[[["Human Design問題","Human Design question"],["什麼情境容易讓我失衡？"," What situations easily throw me off balance?"]],[["真正能力","Real capability"],["Stress Regulation｜壓力調節"," Stress Regulation"]],[["解答","Answer"],["找到自己的Stress Trigger、Threshold與Recovery Pattern。"," Find your own Stress Triggers, Threshold and Recovery Pattern."]],[["舊Model","Old Model"],["壓力不好，我要逃離壓力。"," Stress is bad; I need to escape it."]],[["新Model","New Model"],["壓力是系統負荷；關鍵是Load是否超過Capacity，以及能否Recovery。"," Stress is system load; the key is whether Load exceeds Capacity, and whether you can Recover."]],[["結構","Structure"],["Demand > Capacity → Error增加 → Performance下降 → Stress再增加。"," Demand > Capacity → more Errors → Performance drops → Stress increases again."]],[["Correct Action","Correct Action"],["降低不必要負荷＋增加資源＋拆小任務＋恢復＋逐步提高容量。"," Reduce unnecessary load + add resources + break tasks down + recover + gradually raise capacity."]],[["能力","Capability"],["Stress Detection＋Load Management＋Recovery＋Resilience。"," Stress Detection + Load Management + Recovery + Resilience."]],[["智慧","Wisdom"],["不是追求零壓力，而是讓自己的系統容量逐漸變大。"," It's not about pursuing zero stress, but letting your system's capacity gradually grow."]]]},{"n":10,"name":["人生","Life"],"q":["我還有哪些可能路徑？","What Other Possible Paths Do I Have?"],"f":[[["Human Design問題","Human Design question"],["我可能成為誰？"," Who might I become?"]],[["真正能力","Real capability"],["Agency｜主體能動性"," Agency"]],[["解答","Answer"],["把人生從「尋找命定答案」改成「持續生成可行路徑」。"," Shift life from \"searching for a destined answer\" to \"continuously generating workable paths.\""]],[["舊Model","Old Model"],["我要找到唯一正確的人生道路。"," I have to find the one right path in life."]],[["新Model","New Model"],["人生是一個不斷更新的State Space。"," Life is a continuously updating State Space."]],[null,["現在的我 → Options → Action → Feedback → Prediction Error → Model Update → New Options。","Me now → Options → Action → Feedback → Prediction Error → Model Update → New Options."]],[null,["每增加一項能力，就增加一些可能路徑。","Each new capability adds some possible paths."]],[null,["每修正一個錯誤模型，就減少一些無效路徑。","Each corrected faulty model removes some ineffective paths."]],[null,["每建立一個新Node，就可能連接出新的Relation。","Each new Node built may connect into new Relations."]],[["能力","Capability"],["Option Generation＋Experimentation＋Adaptation＋Agency。"," Option Generation + Experimentation + Adaptation + Agency."]],[["智慧","Wisdom"],["自由不是沒有Constraint，而是在Constraint中仍然能產生更多可行選項。"," Freedom isn't having no Constraints; it's still generating more workable options within Constraints."]]]}],"os":[["【10領域真正統一成一套OS】","【The 10 Domains Truly Unified Into One OS】"],["自我 → 看見自己。","Self → see yourself."],["人格 → 看見Pattern。","Personality → see Patterns."],["身體 → 看見Signal。","Body → see Signals."],["情緒 → 看見State。","Emotion → see States."],["學習 → 看見Learning Error。","Learning → see Learning Errors."],["工作 → 看見Environment。","Work → see the Environment."],["關係 → 看見Interaction。","Relationships → see Interactions."],["決策 → 看見Trade-off。","Decisions → see Trade-offs."],["壓力 → 看見Capacity。","Stress → see Capacity."],["人生 → 看見Options。","Life → see Options."]],"loop":[["【最後全部收斂成一個更新循環】","【Finally, Everything Converges In tion＋Emotion Regulation＋Metacognition＋Relationship Awareness＋Decision Skill＋Stress Regulation＋Agency。","It's Self-awareness + Interoception + Emotion Regulation + Metacognition + Relationship Awareness + Decision Skill + Stress Regulation + Agency."],["最終目標不是讓一張圖更精準地定義你。","The ultimate goal isn't letting a chart define you more precisely."],["而是讓你越來越精準地預測自己、理解環境、修正錯誤、生成選項與改變行動。","It's letting you predict yourself, understand your environment, correct errors, generate options and change actions ever more precisely."],["成長＝Prediction Error下降＋Model更新速度提高＋Capability增加。","Growth = falling Prediction Error + faster Model updating + growing Capability."],["自由＝舊Pattern仍然存在，但它不再自動決定你的下一步。","Freedom = the old Pattern still exists, but it no longer automatically decides your next step."]]},"notes":[["可以。病友版我會把剛才醫學生版的核心改成：疾病不是你的全部 → 身體不是敵人 → 情緒不是病因 → 不把希望建立在保證上 → 醫療＋營養＋睡眠＋活動＋情緒＋關係共同支持 → 從失控感拿回可控制的部分 → 每次Feedback都變成Model Update。","Sure. For the patient edition, I'll turn the core of the earlier medical-student edition into: the disease is not all of you → your body is not the enemy → emotions are not the cause of illness → don't build hope on guarantees → medicine + nutrition + sleep + activity + emotions + relationships support you together → take back the controllable parts from the feeling of losing control → every piece of Feedback becomes a Model Update."],["功能醫學與營養素會放在「支持身體功能、補足經評估的需求、改善可追蹤的生活與營養目標」的位置，不寫成治癌、逆轉癌症或取代標準治療，這樣反而更能建立長期信任。","Functional medicine and nutrients are positioned as \"supporting bodily function, meeting assessed needs, and improving trackable lifestyle and nutrition goals\" — not written as curing cancer, reversing cancer or replacing standard treatment. That actually builds more long-term trust."],["可以。最適合直接放在 245 張卡最前面，變成「七色→需求→卡號」快速導航。以下先做成一眼就能找到卡的索引。","Sure. It works best placed right at the front of the 245 cards as a \"color → need → card number\" quick navigator. Below is an index that lets you find a card at a glance."],["把每張卡改成可直接執行補上病友每日使用填寫欄位建立病友分級選卡路徑","Make every card directly actionable · Add daily fill-in fields for patients · Build tiered card-selection paths for patients"],["補上每領域可執行練習統一十領域的固定欄位改成高中生白話版本","Add actionable exercises for each domain · Unify fixed fields across the ten domains · Rewrite in plain language for high-school students"],["可以。這樣每張卡就會從「可執行」再升級成真正的情境導航卡：什麼時候用 → 今天做什麼 → 怎樣算完成。以下直接整合進原本 245 張。","Sure. This way each card upgrades from \"actionable\" into a true situational navigation card: when to use it → what to do today → what counts as done. Below it's integrated directly into the original 245 cards."],["統一每張卡的欄位名稱新增病友安全提醒總頁刪除重複卡片並合併編號","Unify the field names on every card · Add a patient safety reminder page · Remove duplicate cards and merge numbering"]]};

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean = s => s.replace(EMOJI,'').replace(/^【|】$/g,'').trim();
// bilingual text from [zh,en]
function T(p, opt={}){
  if(!p) return '';
  let [z,e] = p; if(opt.clean){z=clean(z);e=clean(e)}
  if(lang==='zh') return `<span class="zh">${esc(z)}</span>`;
  if(lang==='en') return `<span class="en">${esc(e)}</span>`;
  if(z===e) return `<span class="en">${esc(e)}</span>`;
  return `<span class="bi${opt.inline?' inline':''}"><span class="zh">${esc(z)}</span><span class="en">${esc(e)}</span></span>`;
}

/* ---------- prose renderer ---------- */
function prose(lines){
  return `<div class="prose">${lines.map(p=>{
    const z=p[0];
    if(/^【[^】]+】$/.test(z)) return `<div class="h">${T(p,{clean:true})}</div>`;
    if(z.trim()==='↓') return `<div class="arrow">↓</div>`;
    if(/^→/.test(z.trim())) return `<div class="flow">${T(p)}</div>`;
    return `<p>${T(p)}</p>`;
  }).join('')}</div>`;
}
function loopChips(p){
  const z=p[0].replace(/^.*?＝/,'').replace(/。$/,''), e=p[1].replace(/^.*?= /,'').replace(/\.$/,'');
  const zs=z.split(/\s*→\s*/), es=e.split(/\s*→\s*/);
  return `<div class="loop">${zs.map((s,i)=>(i?'<i>→</i>':'')+`<span>${T([s,es[i]||s])}</span>`).join('')}</div>`;
}

/* ---------- Cards tab ---------- */
function cardMatches(c){
  if(filter && c.c!==filter) return false;
  if(favOnly && !favs.has(c.n)) return false;
  if(!query) return true;
  const q=query.toLowerCase();
  const hay=[c.n+'',...c.title,...c.stmt,...c.navTitle,...c.nav.flatMap(x=>x[1])].join(' ').toLowerCase();
  return hay.includes(q);
}

  </div>
  <div class="picker" role="group" aria-label="${L('依情境選顏色','Pick a color by situation')}">${picks}</div>
  <div class="tools">
    <label class="search" for="q"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="${esc(L('搜尋卡號、關鍵字…','Search number or keyword…'))}" value="${esc(query)}"></label>
    <button class="btn ghost" id="favonly" aria-pressed="${favOnly}">${favOnly?'★ ':'☆ '}${L('我的收藏','Saved')} (${favs.size})</button>
    ${filter||query||favOnly?`<button class="btn ghost" id="clear">${L('清除篩選','Clear')}</button>`:''}
    <span class="count">${list.length} / 245</span>
  </div>
  ${body}
  <div class="safety">${U('本卡片為自我照護與溝通輔助工具，不取代醫療診斷與治療。任何用藥、補充品或治療變更，請與你的醫療團隊討論。','These cards are a self-care and communication aid and do not replace medical diagnosis or treatment. Discuss any change in medication, supplements or treatment with your medical team.')}</div>
  ${community()}`;
}

function openCard(n){
  const c = DATA.cards[n-1]; if(!c) return;
  const g = DATA.groups[C.indexOf(c.c)];
  const NAVK = {when:['使用時機','When to use'],action:['今日行動','Today’s action'],done:['完成標準','Done when']};
  const detail = c.detail && c.detail.length ? `<div><div class="label">${U('模型更新','Model update')}</div>
     <dl class="fields">${c.detail.map(([k,v])=>`<dt>${T(k)}</dt><dd>${T(v)}</dd>`).join('')}</dl></div>` : '';
  document.getElementById('modal').innerHTML = `
  <div class="scrim" id="scrim">
   <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="stitle" style="--c:var(--${c.c});--c-t:var(--${c.c}-t)">
    <div class="shead lang-${lang}">
      <button class="x" id="close" aria-label="${L('關閉','Close')}">×</button>
      <div class="meta"><span class="dot"></span>${T(g.indexHeader,{clean:true,inline:true})}</div>
      <div class="big">${String(c.n).padStart(2,'0')}</div>
      <div class="stmt" id="stitle">${T(c.stmt)}</div>
    </div>
    <div class="sbody">
      <div><div class="label">${U('情境導航','Situational guide')} · ${T(c.navTitle,{inline:true})}</div>
        <div class="steps3">${c.nav.map(([k,v])=>`<div><div class="k">${U(NAVK[k][0],NAVK[k][1])}</div><div class="v">${T(v)}</div></div>`).join('')}</div></div>
      ${detail}
      <div><div class="label">${U('索引標題','Index title')}</div>${T(c.title)}</div>
      <div><div class="label">${U('本色核心問題','Core question of this color')}</div>${T(g.question)}
        <div style="margin-top:10px" class="tagline">${splitTags(g.abilities)}</div>
        <p style="margin-top:10px;font-weight:600">${T(g.oneLiner)}</p></div>
    </div>
    <div class="navrow">
      <button id="prev" ${n<=1?'disabled':''}>← ${L('上一張','Previous')}</button>
      <button class="fav" id="fav" aria-pressed="${favs.has(n)}">${favs.has(n)?'★':'☆'} ${L('收藏','Save')}</button>
      <button id="next" ${n>=245?'disabled':''}>${L('下一張','Next')} →</button>
    </div>
   </div>
  </div>`;
  document.getElementById('modal').dataset.n = n;
  document.getElementById('close').focus();
  try{history.replaceState(null,'','#c'+n)}catch(e){}
}
function splitTags(p){
  const zs=p[0].replace(/。$/,'').split('｜'), es=p[1].replace(/\.$/,'').split('｜');
  return zs.map((z,i)=>`<span>${esc(lang==='zh'?z:lang==='en'?(es[i]||z):z+' · '+(es[i]||z))}</span>`).join('');
}
function closeCard(){document.getElementById('modal').innerHTML='';delete document.getElementById('modal').dataset.n;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}

/* ---------- Guide tab ---------- */
function renderGuide(){
  const G=DATA.guide, g=DATA.groups;
  const os = g.map(x=>{
    const r=DATA.cards.filter(c=>c.c===x.c);
    const [lz,le]=x.lifeos; const tz=lz.replace(EMOJI,'').split('｜'), te=le.replace(EMOJI,'').split('｜');
    return `<div class="osrow" style="--c:var(--${x.c});--c-t:var(--${x.c}-t)">
      <div class="sw"><b>${L(CNAME[x.c][0],CNAME[x.c][1])}</b>${r[0].n}–${r[r.length-1].n}</div>
      <div class="rows">
        <div><span class="name">${esc(tz[1])}</span> — ${T([tz[2],te[2]])}</div>
        <div class="mini">${T(x.question)}</div>
        <div class="mini">${T(x.page[1])} <b>↓</b> ${T(x.page[2])}</div>
        <div class="mini">${U('情境入口：','Situations: ')}${T(x.entry)}</div>
        <div class="tagline">${splitTags(x.abilities)}</div>
        <div style="font-weight:600">${T(x.oneLiner)}</div>
      </div></div>`;
  }).join('');
  return `
   <h2 class="sec" style="margin-top:6px">${T(DATA.guide.intro[0],{clean:true})}</h2>
   <div class="panel">${prose(G.intro.slice(1))}</div>
   <h2 class="sec">${T(G.lifeosTitle,{clean:true})}</h2>
   <div class="os">${os}</div>
   <h2 class="sec">${U('怎麼使用','How to use')}</h2>
   <div class="two">
     <div class="panel">${prose(G.index)}</div>
     <div class="panel">${prose(G.order)}</div>
     <div class="panel">${prose(G.navIntro)}</div>
     <div class="panel">${prose(G.daily)}</div>
   </div>
   <h2 class="sec">${T(G.loop[0],{clean:true})}</h2>
   <div class="panel">${prose(G.loop.slice(1))}</div>
   <h2 class="sec">${T(G.turn[0],{clean:true})}</h2>
   <div class="panel">${prose(G.turn.slice(1))}</div>
   <h2 class="sec">${U('你真正要建立的','What you really want to build')}</h2>
   <div class="panel">${prose(G.closing)}</div>
   <h2 class="sec">${T(G.goal[0],{clean:true})}</h2>
   <div class="panel">${prose(G.goal.slice(1))}</div>
   ${community()}`;
}

/* ---------- Rainbow 3.0 ---------- */
function renderG3(){
  const g=DATA.g3;
  const os=g.os.map((p,i)=>{
    const c=C[i]; const zs=p[0].replace(EMOJI,'').split('｜'), es=p[1].replace(EMOJI,'').split('｜');
    return `<div class="osrow" style="--c:var(--${c});--c-t:var(--${c}-t)">
      <div class="sw"><b>${L(CNAME[c][0],CNAME[c][1])}</b>${zs[0].replace(/[^\d–]/g,'')}</div>
      <div class="rows"><div class="name">${esc(zs[1])}</div><div>${T([zs[2],es[2]])}</div><div style="font-weight:600">${T([zs[3],es[3]])}</div></div></div>`;
  }).join('');
  const cards=g.cards.map(c=>`<details class="g" id="g3-${c.n}"><summary><span class="no">${String(c.n).padStart(2,'0')}</span><span>${T(c.t)}</span><span class="chev">›</span></summary>
    <div class="body"><dl class="fields">${c.f.map(([k,v])=>`<dt>${T(k)}</dt><dd>${T(v)}</dd>`).join('')}</dl></div></details>`).join('');
  const dir=g.dir.map((d,i)=>`<h3 style="color:var(--${C[i]})">${T(d.h,{clean:true})}</h3>
    <div class="dir" style="--c:var(--${C[i]})">${d.items.map(([n,z,e])=>`<div><b>${String(n).padStart(2,'0')}</b><span>${T([z,e])}</span></div>`).join('')}</div>`).join('');
  return `<h2 class="sec" style="margin-top:6px">${T(g.title,{clean:true})}</h2>
    <p class="note" style="margin-bottom:12px">${U('原檔中的通用版彩虹卡（非病友版），保留完整內容。','The general (non-patient) edition of the Rainbow Cards from the original file, kept in full.')}</p>
    <div class="panel">${loopChips(g.loop)}</div>
    <h2 class="sec">${T(g.osTitle,{clean:true})}</h2><div class="os">${os}</div>
    <h2 class="sec" style="color:var(--red)">${T(g.redHeader,{clean:true})}</h2>
    <div class="panel" style="margin-bottom:14px">${prose(g.redIntro)}</div>
    ${cards}
    <h2 class="sec">${T(g.dirTitle,{clean:true})}</h2>${dir}
    <h2 class="sec">${T(g.structure[0],{clean:true})}</h2><div class="panel">${prose(g.structure.slice(1))}</div>
    <h2 class="sec">${T(g.summary[0],{clean:true})}</h2><div class="panel">${prose(g.summary.slice(1))}</div>`;
}

/* ---------- Human Design ---------- */
function renderHD(){
  const h=DATA.hd;
  return `<h2 class="sec" style="margin-top:6px">${T(h.core[0],{clean:true})}</h2>
    <div class="panel">${prose(h.core.slice(1))}</div>
    <h2 class="sec">${U('十個領域','Ten domains')}</h2>
    <div class="hdgrid">${h.domains.map(d=>`<div class="hd"><div class="hn"><b>${String(d.n).padStart(2,'0')}</b><div><div class="t">${T(d.name)}</div><div class="mini" style="color:var(--muted)">${T(d.q)}</div></div></div>
      <dl class="fields">${d.f.filter(f=>f[0]).map(([k,v])=>`<dt>${T(k)}</dt><dd>${T(v)}</dd>`).join('')}</dl>
      ${d.f.filter(f=>!f[0]).map(f=>`<div class="plain">${T(f[1])}</div>`).join('')}</div>`).join('')}</div>
    <h2 class="sec">${T(h.os[0],{clean:true})}</h2><div class="panel">${prose(h.os.slice(1))}</div>
    <h2 class="sec">${T(h.loop[0],{clean:true})}</h2><div class="panel">${prose(h.loop.slice(1))}</div>
    <h2 class="sec">${T(h.upgrade[0],{clean:true})}</h2><div class="panel">${prose(h.upgrade.slice(1))}</div>`;
}

function renderNotes(){
  return `<h2 class="sec" style="margin-top:6px">${U('原檔附註','Notes from the original file')}</h2>
   <p class="note" style="margin-bottom:14px">${U('原始 Word 檔中夾帶的編輯說明與後續建議，原文保留，供參考。','Editorial remarks and follow-up suggestions that appear inside the original Word file, kept verbatim for reference.')}</p>
   <div class="prose" style="gap:12px">${DATA.notes.map(p=>`<div class="panel">${T(p)}</div>`).join('')}</div>`;
}

function render(){
  renderChrome();
  const m=document.getElementById('main');
  m.innerHTML = tab==='cards'?renderCards():tab==='guide'?renderGuide():tab==='g3'?renderG3():tab==='hd'?renderHD():renderNotes();
  const n=document.getElementById('modal').dataset.n; if(n) openCard(+n);
  drawQR();
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button, .scrim'); if(!t) return;
  if(t.dataset.lang){lang=t.dataset.lang;store.set('rc-lang',lang);render();return}
  if(t.dataset.tab){tab=t.dataset.tab;store.set('rc-tab',tab);render();window.scrollTo({top:0});return}
  if(t.dataset.pick){filter=filter===t.dataset.pick?null:t.dataset.pick;render();return}
  if(t.dataset.card){openCard(+t.dataset.card);return}
  if(t.id==='draw'){const pool=DATA.cards.filter(c=>!filter||c.c===filter);openCard(pool[Math.floor(Math.random()*pool.length)].n);return}
  if(t.id==='clear'){filter=null;query='';favOnly=false;render();return}
  if(t.id==='favonly'){favOnly=!favOnly;render();return}
  if(t.id==='close'){closeCard();return}
  if(t.id==='scrim'&&e.target.id==='scrim'){closeCard();return}
  if(t.id==='prev'||t.id==='next'){const n=+document.getElementById('modal').dataset.n;openCard(n+(t.id==='next'?1:-1));return}
  if(t.id==='fav'){const n=+document.getElementById('modal').dataset.n;favs.has(n)?favs.delete(n):favs.add(n);store.set('rc-favs',[...favs]);render();return}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){query=e.target.value.trim();const pos=e.target.selectionStart;render();const q=document.getElementById('q');q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}
});
document.addEventListener('keydown',e=>{
  const n=document.getElementById('modal').dataset.n; if(!n) return;
  if(e.key==='Escape') closeCard();
  if(e.key==='ArrowRight'&&+n<245) openCard(+n+1);
  if(e.key==='ArrowLeft'&&+n>1) openCard(+n-1);
});
if(!TABS.some(t=>t[0]===tab)) tab='cards';
const h=(location.hash||'').match(/^#c(\d{1,3})$/);
render();
if(h&&+h[1]>=1&&+h[1]<=245){tab='cards';render();openCard(+h[1]);}
</script>
