<title>病友彩虹卡 Rainbow Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Figtree:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root{
  --ground:#F4F5F7; --surface:#FFFFFF; --sunk:#ECEEF2; --ink:#1D2330; --muted:#5A6272; --faint:#8A92A1; --line:#DDE1E7;
  --red:#CF4B45; --orange:#DD7F2E; --yellow:#C79A1C; --green:#338F5F; --blue:#3574B8; --indigo:#4A52A3; --violet:#8650AC;
  --red-t:#FBEDEC; --orange-t:#FCF1E6; --yellow-t:#FAF4E1; --green-t:#E8F4ED; --blue-t:#E8F0F9; --indigo-t:#ECEDF8; --violet-t:#F3ECF8;
  --shadow:0 1px 2px rgba(20,28,45,.06),0 8px 24px rgba(20,28,45,.08);
  --zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --zh-serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --en:"Figtree","Segoe UI",system-ui,sans-serif;
  --num:"Fraunces",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#14171D; --surface:#1C2028; --sunk:#232833; --ink:#E9ECF2; --muted:#A5ADBB; --faint:#7C8595; --line:#2E3441;
    --red:#EE7A73; --orange:#F0A060; --yellow:#E6C35A; --green:#63C08D; --blue:#6FA6E3; --indigo:#8C93E0; --violet:#BD8BDE;
    --red-t:#2E1F20; --orange-t:#2F241A; --yellow-t:#2C2717; --green-t:#18291F; --blue-t:#17232F; --indigo-t:#1D1F33; --violet-t:#271E2F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#14171D; --surface:#1C2028; --sunk:#232833; --ink:#E9ECF2; --muted:#A5ADBB; --faint:#7C8595; --line:#2E3441;
  --red:#EE7A73; --orange:#F0A060; --yellow:#E6C35A; --green:#63C08D; --blue:#6FA6E3; --indigo:#8C93E0; --violet:#BD8BDE;
  --red-t:#2E1F20; --orange-t:#2F241A; --yellow-t:#2C2717; --green-t:#18291F; --blue-t:#17232F; --indigo-t:#1D1F33; --violet-t:#271E2F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--en),var(--zh);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:1080px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

/* bilingual */
.zh{font-family:var(--zh)}
.en{font-family:var(--en)}
.bi{display:flex;flex-direction:column;gap:2px}
.bi>.en{color:var(--muted);font-size:.92em}
.bi.inline{display:inline-flex}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-inline:-16px;padding:12px 16px 0;border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.spectrum{display:grid;grid-template-columns:repeat(7,6px);gap:2px;height:22px}
.spectrum i{border-radius:3px}
.brand b{font-family:var(--zh-serif);font-size:19px;letter-spacing:.04em;white-space:nowrap}
.brand small{font-family:var(--en);color:var(--muted);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
nav.tabs{max-width:1080px;margin:10px auto 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:9px 12px 11px;font-size:14px;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink);font-weight:600}

main{padding-top:22px}
section[hidden]{display:none}
h2.sec{font-family:var(--zh-serif);font-size:24px;line-height:1.3;margin:36px 0 14px;text-wrap:balance}
h2.sec .en{font-family:var(--num);font-weight:500;font-size:.72em;color:var(--muted)}
h3{font-family:var(--zh-serif);font-size:18px;margin:26px 0 10px;text-wrap:balance}
h3 .en{font-family:var(--en);font-weight:600;font-size:.8em;color:var(--muted)}
p{margin:0}
.lead{font-size:16px;max-width:66ch}

/* Today strip */
.today{display:grid;grid-template-columns:1fr auto;gap:14px 20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
.today h1{font-family:var(--zh-serif);font-size:22px;margin:0;line-height:1.35;text-wrap:balance}
.today h1 .en{font-family:var(--en);font-size:15px;font-weight:500;color:var(--muted)}
.today .steps{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--muted)}
.today .steps span{background:var(--sunk);padding:3px 9px;border-radius:999px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--ground);border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}

/* color picker (rhyme) */
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:16px}
.pick{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;position:relative;overflow:hidden}
.pick::before{content:"";position:absolute;inset:0 auto 0 0;width:0;background:var(--c-t);transition:width .2s}
.pick>*{position:relative}
.pick .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.pick .top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pick .say{font-size:13.5px;line-height:1.4}
.pick[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.pick[aria-pressed="true"]::before{width:100%}

.tools{display:flex;gap:10px;align-items:center;margin:18px 0 10px;flex-wrap:wrap}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.search input{border:0;background:transparent;outline:0;flex:1;font:inherit;color:var(--ink);min-width:0}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* group banner */
.gbanner{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:start;margin:30px 0 12px;padding-top:14px;border-top:2px solid var(--c)}
.gbanner .range{font-family:var(--num);font-size:30px;line-height:1;color:var(--c);font-variant-numeric:tabular-nums;grid-row:span 2}
.gbanner .gh{font-family:var(--zh-serif);font-size:18px;font-weight:700}
.gbanner .gh .en{font-family:var(--en);font-weight:500;font-size:.8em}
.gbanner .gq{color:var(--muted);font-size:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;transition:transform .15s,box-shadow .15s,border-color .15s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--c)}
.card .no{font-family:var(--num);font-weight:650;font-size:20px;color:var(--c);font-variant-numeric:tabular-nums;min-width:2.1em;line-height:1.2}
.card .tt{font-size:14.5px;line-height:1.45}
.card .tt .en{font-size:12.5px}
.card .star{font-size:11px;color:var(--c);margin-top:4px;display:block}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media (min-width:720px){.scrim{align-items:center;padding:24px}}
.sheet{background:var(--surface);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:720px){.sheet{border-radius:22px}}
.shead{background:var(--c-t);padding:20px 22px 22px;position:relative}
.shead .meta{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.shead .meta .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.shead .big{font-family:var(--num);font-weight:650;font-size:52px;line-height:1;color:var(--c);font-variant-numeric:tabular-nums;margin:10px 0 6px}
.shead .stmt{font-family:var(--zh-serif);font-size:21px;line-height:1.5;text-wrap:balance}
.shead .stmt .en{font-family:var(--en);font-size:15.5px;line-height:1.5;margin-top:6px;color:var(--ink);opacity:.78}
.shead.lang-en .stmt{font-family:var(--en);font-weight:600}
.x{position:absolute;top:14px;right:14px;border:0;background:var(--surface);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sbody{padding:18px 22px 24px;display:flex;flex-direction:column;gap:20px}
.label{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:8px;font-family:var(--en)}
.label .zh{letter-spacing:.2em}
.steps3{display:grid;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.steps3>div{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.steps3>div:first-child{border-top:0}
.steps3 .k{font-size:12.5px;font-weight:600;color:var(--c);line-height:1.4}
.steps3 .k .en{color:var(--muted);font-weight:500;font-size:11.5px}
.steps3 .v{white-space:pre-line}
dl.fields{margin:0;display:grid;grid-template-columns:minmax(92px,max-content) 1fr;gap:8px 14px}
dl.fields dt{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.5}
dl.fields dd{margin:0}
dl.fields .bi>.en{font-size:.9em}
.navrow{display:flex;justify-content:space-between;gap:8px;padding:14px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.navrow button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13.5px}
.fav{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13.5px}
.fav[aria-pressed="true"]{border-color:var(--c);color:var(--c);font-weight:600}

/* prose */
.prose{display:flex;flex-direction:column;gap:8px;max-width:70ch}
.prose .h{font-family:var(--zh-serif);font-weight:700;font-size:17px;margin-top:14px}
.prose .h .en{font-family:var(--en);font-weight:600;font-size:.82em}
.prose .arrow{color:var(--faint);line-height:1;padding-left:4px}
.prose .flow{padding-left:14px;border-left:2px solid var(--line)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}

/* LifeOS color rows */
.os{display:grid;gap:10px}
.osrow{display:grid;grid-template-columns:62px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.osrow .sw{border-radius:10px;background:var(--c-t);color:var(--c);font-family:var(--num);font-weight:650;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-variant-numeric:tabular-nums;text-align:center;line-height:1.2;padding:8px 4px}
.osrow .sw b{font-size:20px}
.osrow .name{font-weight:700}
.osrow .rows{display:flex;flex-direction:column;gap:8px}
.osrow .mini{font-size:13px;color:var(--muted)}
.tagline{display:flex;flex-wrap:wrap;gap:6px}
.tagline span{font-size:12.5px;background:var(--c-t);color:var(--ink);padding:2px 9px;border-radius:999px}

.loop{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.loop span{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px}
.loop i{color:var(--faint);font-style:normal}

/* 3.0 cards */
details.g{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
details.g summary{list-style:none;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 16px;cursor:pointer}
details.g summary::-webkit-details-marker{display:none}
details.g summary .no{font-family:var(--num);font-weight:650;font-size:20px;color:var(--red);font-variant-numeric:tabular-nums;min-width:2em}
details.g summary .chev{color:var(--faint);transition:transform .2s}
details.g[open] summary .chev{transform:rotate(90deg)}
details.g .body{padding:0 16px 16px}
.dir{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 18px}
.dir div{display:grid;grid-template-columns:2.4em 1fr;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
.dir div b{font-family:var(--num);font-weight:500;color:var(--c);font-variant-numeric:tabular-nums}

.hdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.hd{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.hd .hn{display:flex;gap:10px;align-items:baseline;margin-bottom:10px}
.hd .hn b{font-family:var(--num);font-size:22px;color:var(--indigo);font-variant-numeric:tabular-nums}
.hd .hn .t{font-weight:700}
.hd .plain{padding:4px 0 4px 10px;border-left:2px solid var(--line);margin:4px 0}
.note{font-size:13px;color:var(--muted);max-width:70ch}
.safety{background:var(--sunk);border-radius:14px;padding:14px 16px;font-size:13.5px;color:var(--muted);margin-top:28px}
.join{display:inline-flex;align-items:center;gap:6px;background:#06C755;color:#fff;text-decoration:none;font-weight:600;font-size:13px;padding:6px 13px;border-radius:999px;white-space:nowrap}
.join:hover{filter:brightness(1.06)}
.join svg{width:15px;height:15px;flex:none}
.community{display:grid;grid-template-columns:1fr auto;gap:14px 20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-top:28px}
.community h3{margin:0 0 4px}
.community .url{font-size:12.5px;color:var(--muted);user-select:all;word-break:break-all;margin-top:6px}
.community .join{font-size:14.5px;padding:10px 18px}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:8px}
.qr{background:#fff;padding:10px;border-radius:12px;border:1px solid var(--line);width:170px;height:170px;display:flex;align-items:center;justify-content:center}
.qr img,.qr canvas{width:148px;height:148px;display:block}
.qrcap{font-size:12px;color:var(--muted)}
@media (max-width:520px){
  .community{grid-template-columns:1fr}
  .today{grid-template-columns:1fr}
  .steps3>div{grid-template-columns:1fr;gap:4px}
  dl.fields{grid-template-columns:1fr;gap:2px}
  dl.fields dd{margin-bottom:8px}
  .shead .big{font-size:42px}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="bar">
    <div class="brand">
      <div class="spectrum" aria-hidden="true"><i style="background:var(--red)"></i><i style="background:var(--orange)"></i><i style="background:var(--yellow)"></i><i style="background:var(--green)"></i><i style="background:var(--blue)"></i><i style="background:var(--indigo)"></i><i style="background:var(--violet)"></i></div>
      <b>病友彩虹卡</b><small>Patient Rainbow Cards</small>
    </div>
    <a class="join" id="join-top" href="https://line.me/R/ti/g/4-yfOVEEh6" target="_blank" rel="noopener"></a>
    <div class="seg" role="group" aria-label="Language">
      <button id="lang-zh" data-lang="zh">中文</button>
      <button id="lang-bi" data-lang="bi">雙語</button>
      <button id="lang-en" data-lang="en">EN</button>
    </div>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>

<main class="wrap" id="main"></main>
<div id="modal"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const DATA = {"cards":[{"n":1,"stmt":["今天不用解決整個人生，先照顧現在的自己。","You don't have to solve your whole life today — first, take care of yourself right now."],"detail":[[["舊Model","Old Model"],["我要趕快恢復正常。","I have to get back to normal quickly."]],[["新Model","New Model"],["現在最重要的是找到今天最需要支持的地方。","What matters most now is finding where I need the most support today."]],[["舊Prediction","Old Prediction"],["沒有一次全部改善就沒有用。","If everything doesn't improve at once, it's useless."]],[["新Prediction","New Prediction"],["一個小地方穩下來，整個系統就可能開始改變。","Once one small area steadies, the whole system may begin to change."]],[["能力","Capability"],["自我照顧。","Self-care."]],[["智慧","Wisdom"],["真正的恢復，常從一個很小的地方開始。","Real recovery often starts from something very small."]]],"title":["今天先照顧現在的自己","Take care of yourself right now, first"],"navTitle":["今天先照顧現在的自己","Take care of yourself right now, first"],"nav":[["when",["事情很多、身體很累、不知道先處理什麼時。","When there's a lot going on, your body is exhausted, and you don't know what to handle first."]],["action",["寫下「我現在最需要的是＿＿」，立刻做最小一步。","Write \"What I need most right now is ___,\" then immediately take the smallest step."]],["done",["完成1件照顧自己的事。","You've done 1 thing to take care of yourself."]]],"c":"red"},{"n":2,"stmt":["你的身體不是敵人。","Your body is not the enemy."],"detail":[[["舊Model","Old Model"],["身體背叛了我。","My body betrayed me."]],[["新Model","New Model"],["身體正在一個非常複雜的疾病與治療環境中努力維持平衡。","My body is working hard to keep balance in a very complex environment of illness and treatment."]],[["舊Prediction","Old Prediction"],["我要跟身體作戰。","I have to fight my body."]],[["新Prediction","New Prediction"],["我可以學習觀察、理解並支持它。","I can learn to observe, understand and support it."]],[["能力","Capability"],["身體覺察。","Body awareness."]],[["智慧","Wisdom"],["不要在最需要合作的時候，先跟自己的身體開戰。","Don't declare war on your own body at the very moment you most need to cooperate."]]],"title":["身體不是敵人","Your body is not the enemy"],"navTitle":["身體不是敵人","Your body is not the enemy"],"nav":[["when",["生氣自己的身體、覺得身體背叛自己時。","When you're angry at your body or feel it has betrayed you."]],["action",["掃描疼痛／疲勞／口渴／飢餓／呼吸／緊繃。","Scan for pain / fatigue / thirst / hunger / breathing / tension."]],["done",["找到最明顯的1個Signal。","You've found the 1 most noticeable Signal."]]],"c":"red"},{"n":3,"stmt":["累，不等於你弱。","Being tired doesn't mean you're weak."],"detail":[[["舊Model","Old Model"],["別人可以，為什麼我不行？","Other people can do it — why can't I?"]],[["新Model","New Model"],["疲勞可能受到疾病、治療、睡眠、營養、活動與情緒等多重因素影響。","Fatigue can be affected by many factors: illness, treatment, sleep, nutrition, activity and emotions."]],[["舊Prediction","Old Prediction"],["再撐一下就好。","Just hold on a bit longer."]],[["新Prediction","New Prediction"],["找到原因並調整資源，比責怪自己更有用。","Finding the causes and adjusting resources is more useful than blaming myself."]],[["能力","Capability"],["疲勞管理。","Fatigue management."]],[["智慧","Wisdom"],["身體發出的訊號，不需要先被羞辱。","The signals your body sends don't need to be shamed first."]]],"title":["累不等於弱","Tired doesn't mean weak"],"navTitle":["累不代表弱","Tired doesn't mean weak"],"nav":[["when",["疲勞、沒力氣，又開始責怪自己時。","When you're fatigued and drained, and start blaming yourself again."]],["action",["疲勞0–10分＋列3個可能影響因素。","Rate fatigue 0–10 + list 3 possible contributing factors."]],["done",["得到今天的疲勞Baseline。","You have today's fatigue Baseline."]]],"c":"red"},{"n":4,"stmt":["休息不是投降。","Resting is not giving up."],"detail":[[["舊Model","Old Model"],["躺著就是什麼都沒做。","Lying down means doing nothing."]],[["新Model","New Model"],["恢復也是身體工作的一部分。","Recovery is part of the body's work too."]],[["舊Prediction","Old Prediction"],["休息讓我越來越弱。","Resting makes me weaker and weaker."]],[["新Prediction","New Prediction"],["適當休息與適合自己的活動，可以共同支持生活功能。","Appropriate rest and suitable activity can together support daily functioning."]],[["能力","Capability"],["節奏管理。","Pacing."]],[["智慧","Wisdom"],["有時候，停下來正是在替下一步準備力量。","Sometimes stopping is exactly how you gather strength for the next step."]]],"title":["休息不是投降","Resting is not giving up"],"navTitle":["休息不是投降","Resting is not giving up"],"nav":[["when",["明明很累卻不敢休息時。","When you're clearly exhausted but afraid to rest."]],["action",["真正休息10分鐘。","Truly rest for 10 minutes."]],["done",["休息前後各評能量0–10分。","You've rated energy 0–10 before and after resting."]]],"c":"red"},{"n":5,"stmt":["今天吃得下，就是值得珍惜的事。","If you can eat today, that's worth cherishing."],"detail":[[["舊Model","Old Model"],["一定要吃到完美才算健康。","I have to eat perfectly to be healthy."]],[["新Model","New Model"],["疾病期間，能量、蛋白質與營養攝取需要依個人狀況調整。","During illness, energy, protein and nutrient intake need to be adjusted to your individual situation."]],[["舊Prediction","Old Prediction"],["吃得不完美就前功盡棄。","If I don't eat perfectly, all my effort is wasted."]],[["新Prediction","New Prediction"],["先讓身體得到目前能接受的支持。","First give my body the support it can accept right now."]],[["能力","Capability"],["營養照護。","Nutritional care."]],[["智慧","Wisdom"],["不要讓追求完美的飲食，反而成為身體新的壓力。","Don't let the pursuit of a perfect diet become a new stress on your body."]]],"title":["吃得下就值得珍惜","Being able to eat is worth cherishing"],"navTitle":["吃得下就值得珍惜","Being able to eat is worth cherishing"],"nav":[["when",["食慾下降、吃不完、因飲食焦慮時。","When appetite drops, you can't finish meals, or food makes you anxious."]],["action",["記錄今天實際吃下什麼。","Record what you actually ate today."]],["done",["知道真實攝取，而不是批判自己。","You know your real intake, without criticizing yourself."]]],"c":"red"},{"n":6,"stmt":["營養不是比誰吃得多。","Nutrition isn't a contest of who takes more."],"detail":[[["舊Model","Old Model"],["營養素越多越好。","The more nutrients, the better."]],[["新Model","New Model"],["真正重要的是需求、劑量、來源、安全性與交互作用。","What really matters is need, dose, source, safety and interactions."]],[["舊Prediction","Old Prediction"],["多補一定多一點保障。","Taking more always gives more protection."]],[["新Prediction","New Prediction"],["適合自己的支持，比堆疊更多東西更重要。","Support that fits me matters more than piling on more things."]],[["能力","Capability"],["營養判斷。","Nutritional judgment."]],[["智慧","Wisdom"],["身體需要的不是最多，而是適合。","Your body doesn't need the most; it needs what fits."]]],"title":["營養不是比誰吃得多","Nutrition isn't a contest of who takes more"],"navTitle":["營養不是越多越好","Nutrition isn't \"more is better\""],"nav":[["when",["同時吃很多補充品、越買越多時。","When you're taking many supplements at once and keep buying more."]],["action",["列出今天全部補充品。","List every supplement you take today."]],["done",["得到完整清單。","You have a complete list."]]],"c":"red"},{"n":7,"stmt":["天然，不等於一定安全。","Natural doesn't necessarily mean safe."],"detail":[[["舊Model","Old Model"],["天然的東西不會有問題。","Natural things can't cause problems."]],[["新Model","New Model"],["天然產品也可能有劑量、肝腎功能與藥物交互作用問題。","Natural products can also involve dosage, liver/kidney function and drug-interaction issues."]],[["舊Prediction","Old Prediction"],["保健品可以自己一直加。","I can keep adding supplements on my own."]],[["新Prediction","New Prediction"],["重要補充品也值得讓醫療團隊知道。","Important supplements are worth letting my medical team know about."]],[["能力","Capability"],["安全判斷。","Safety judgment."]],[["智慧","Wisdom"],["真正照顧自己，也包括知道什麼不能只靠感覺決定。","Truly caring for yourself includes knowing what can't be decided by feeling alone."]]],"title":["天然不等於一定安全","Natural isn't necessarily safe"],"navTitle":["天然不等於安全","Natural isn't necessarily safe"],"nav":[["when",["因為「天然」就準備直接使用某產品時。","When you're about to use a product directly just because it's \"natural.\""]],["action",["查成分、每日量、注意事項。","Check ingredients, daily amount and precautions."]],["done",["留下至少1個Safety Check。","You've recorded at least 1 Safety Check."]]],"c":"red"},{"n":8,"stmt":["營養素是工具，不是神。","Nutrients are tools, not gods."],"detail":[[["舊Model","Old Model"],["找到對的營養素，一切就會翻轉。","Find the right nutrient and everything will turn around."]],[["新Model","New Model"],["營養支持是整體照護的一個Node。","Nutritional support is one Node of overall care."]],[["舊Prediction","Old Prediction"],["單一產品可以解決整個疾病系統。","A single product can solve the whole disease system."]],[["新Prediction","New Prediction"],["真正的支持來自醫療、營養、睡眠、活動、心理與關係等多個節點。","Real support comes from many nodes: medicine, nutrition, sleep, activity, psychology and relationships."]],[["能力","Capability"],["系統思考。","Systems thinking."]],[["智慧","Wisdom"],["不要把整個希望壓在任何單一工具上。","Don't rest all your hope on any single tool."]]],"title":["營養素是工具，不是神","Nutrients are tools, not gods"],"navTitle":["營養素是工具，不是神","Nutrients are tools, not gods"],"nav":[["when",["把希望集中在某一瓶產品時。","When you've pinned all your hope on one bottle of product."]],["action",["替每項補充品寫「為什麼使用？」","For each supplement, write \"Why am I using this?\""]],["done",["目的不明者標記「待確認」。","Anything without a clear purpose is marked \"to be confirmed.\""]]],"c":"red"},{"n":9,"stmt":["功能醫學最有價值的地方，是幫助你多問一層。","The most valuable thing about functional medicine is helping you ask one layer deeper."],"detail":[[["舊Model","Old Model"],["有症狀就找一個東西壓下去。","When there's a symptom, find something to suppress it."]],[["新Model","New Model"],["我也可以觀察睡眠、飲食、活動、壓力、腸胃與其他可能相關因素。","I can also observe sleep, diet, activity, stress, digestion and other possibly related factors."]],[["舊Prediction","Old Prediction"],["一個症狀一定只有一個原因。","A symptom must have only one cause."]],[["新Prediction","New Prediction"],["多因素評估可能讓支持策略更精準。","Multi-factor assessment may make support strategies more precise."]],[["能力","Capability"],["多系統觀察。","Multi-system observation."]],[["智慧","Wisdom"],["看得更完整，不代表什麼都治，而是更知道下一個問題該問什麼。","Seeing more completely doesn't mean treating everything; it means knowing better what question to ask next."]]],"title":["多問一層身體發生了什麼","Ask one layer deeper about what's happening in your body"],"navTitle":["多問一層","Ask one layer deeper"],"nav":[["when",["一出現症狀就認定只有一個原因時。","When a symptom appears and you immediately assume it has only one cause."]],["action",["寫3個可能相關因素。","Write 3 possibly related factors."]],["done",["至少保留3個Hypothesis。","You're keeping at least 3 Hypotheses open."]]],"c":"red"},{"n":10,"stmt":["不要只問「我要吃什麼？」","Don't only ask, \"What should I take?\""],"detail":[[["舊Model","Old Model"],["健康等於找到產品。","Health equals finding a product."]],[["新Model","New Model"],["先問：我現在真正的需求與瓶頸是什麼？","First ask: what is my real need and bottleneck right now?"]],[["舊Prediction","Old Prediction"],["產品先選，再看效果。","Choose the product first, then see the effect."]],[["新Prediction","New Prediction"],["先評估問題，再決定是否需要介入。","Assess the problem first, then decide whether intervention is needed."]],[["能力","Capability"],["需求診斷。","Needs diagnosis."]],[["智慧","Wisdom"],["工具之前，先找問題。","Before the tool, find the problem."]]],"title":["不要只問我要吃什麼","Don't only ask what I should take"],"navTitle":["不要先問我要吃什麼","Don't start by asking what to take"],"nav":[["when",["第一個念頭就是找營養素或產品時。","When your first thought is to find a nutrient or product."]],["action",["改問：「我真正想改善的Outcome是什麼？」","Ask instead: \"What Outcome do I really want to improve?\""]],["done",["得到1個清楚Target。","You have 1 clear Target."]]],"c":"red"},{"n":11,"stmt":["睡眠不是小事。","Sleep is not a small thing."],"detail":[[["舊Model","Old Model"],["生病了睡不好很正常，只能忍。","Sleeping badly is normal when sick — I just have to endure it."]],[["新Model","New Model"],["睡眠本身就是值得被評估與支持的重要生活功能。","Sleep itself is an important life function worth assessing and supporting."]],[["舊Prediction","Old Prediction"],["只能等疾病好了才改善。","It can only improve once the illness is better."]],[["新Prediction","New Prediction"],["找到影響睡眠的可調因素，生活品質可能先開始改變。","By finding the adjustable factors affecting sleep, quality of life may start to change first."]],[["能力","Capability"],["睡眠管理。","Sleep management."]],[["智慧","Wisdom"],["夜晚被照顧好，白天常常也會多一點力量。","When your nights are cared for, your days often gain a little more strength."]]],"title":["睡眠不是小事","Sleep is not a small thing"],"navTitle":["睡眠不是小事","Sleep is not a small thing"],"nav":[["when",["失眠、早醒、睡很多仍疲勞時。","Insomnia, waking early, or sleeping a lot but still tired."]],["action",["記錄上床／入睡／醒來／起床。","Record time to bed / fell asleep / woke / got up."]],["done",["建立睡眠Baseline。","You've established a sleep Baseline."]]],"c":"red"},{"n":12,"stmt":["腸胃不舒服，不需要默默忍耐。","Stomach and gut discomfort doesn't need to be silently endured."],"detail":[[["舊Model","Old Model"],["治療期間一定這樣。","It's always like this during treatment."]],[["新Model","New Model"],["噁心、便祕、腹瀉、食慾等症狀值得記錄並與醫療團隊討論。","Symptoms like nausea, constipation, diarrhea and appetite changes are worth recording and discussing with your medical team."]],[["舊Prediction","Old Prediction"],["忍過去就好。","Just endure it and it'll pass."]],[["新Prediction","New Prediction"],["越清楚描述，越容易得到適合的支持。","The more clearly I describe it, the easier it is to get suitable support."]],[["能力","Capability"],["症狀紀錄。","Symptom recording."]],[["智慧","Wisdom"],["說清楚自己的不舒服，本身就是照顧自己的能力。","Describing your discomfort clearly is itself a way of caring for yourself."]]],"title":["腸胃不舒服不要默默忍","Don't silently endure gut discomfort"],"navTitle":["腸胃不舒服不要默默忍","Don't silently endure gut discomfort"],"nav":[["when",["腹脹、便祕、腹瀉、噁心或腸胃改變時。","Bloating, constipation, diarrhea, nausea or changes in digestion."]],["action",["記錄時間＋食物＋症狀＋排便。","Record time + food + symptoms + bowel movements."]],["done",["建立1筆Gut Diary。","You've made 1 Gut Diary entry."]]],"c":"red"},{"n":13,"stmt":["食慾不好時，不要再用罪惡感餵自己。","When your appetite is poor, don't feed yourself guilt."],"detail":[[["舊Model","Old Model"],["吃不下是我不努力。","Not being able to eat means I'm not trying hard enough."]],[["新Model","New Model"],["食慾受到很多生理與治療因素影響。","Appetite is affected by many physiological and treatment factors."]],[["舊Prediction","Old Prediction"],["逼自己就能解決。","Forcing myself will solve it."]],[["新Prediction","New Prediction"],["找原因、調整形式與尋求專業支持可能更有效。","Finding causes, adjusting food forms and seeking professional support may be more effective."]],[["能力","Capability"],["飲食調整。","Diet adjustment."]],[["智慧","Wisdom"],["身體已經很辛苦，不需要再加一層自責。","Your body is already working so hard; it doesn't need another layer of self-blame."]]],"title":["食慾不好不要責怪自己","Don't blame yourself for poor appetite"],"navTitle":["食慾不好不要責怪自己","Don't blame yourself for poor appetite"],"nav":[["when",["吃不下又覺得自己不努力時。","When you can't eat and feel you're not trying hard enough."]],["action",["食慾0–10＋記錄最好入口的食物。","Rate appetite 0–10 + note the foods easiest to get down."]],["done",["找到1個目前可接受的選擇。","You've found 1 option that's acceptable right now."]]],"c":"red"},{"n":14,"stmt":["體重只是訊號之一。","Weight is just one signal."],"detail":[[["舊Model","Old Model"],["只要體重沒有掉就沒問題。","As long as my weight hasn't dropped, it's fine."]],[["新Model","New Model"],["體重、攝取、肌力、活動與身體組成都是不同訊息。","Weight, intake, muscle strength, activity and body composition are all different pieces of information."]],[["舊Prediction","Old Prediction"],["體重代表全部營養狀態。","Weight represents my whole nutritional status."]],[["新Prediction","New Prediction"],["多個指標一起看，才比較接近Reality。","Looking at several indicators together gets closer to Reality."]],[["能力","Capability"],["營養監測。","Nutritional monitoring."]],[["智慧","Wisdom"],["不要讓一個數字代表整個身體。","Don't let one number stand for your whole body."]]],"title":["體重只是訊號之一","Weight is just one signal"],"navTitle":["體重只是訊號之一","Weight is just one signal"],"nav":[["when",["因體重數字焦慮時。","When the number on the scale makes you anxious."]],["action",["同時記食慾／活動／疲勞。","Also record appetite / activity / fatigue."]],["done",["至少用4個訊號看自己。","You're looking at yourself through at least 4 signals."]]],"c":"red"},{"n":15,"stmt":["肌肉也是你要守護的資產。","Muscle is also an asset worth protecting."],"detail":[[["舊Model","Old Model"],["生病只要多休息。","When sick, I should just rest more."]],[["新Model","New Model"],["在醫療允許與個人能力範圍內，適度活動可能有助維持功能。","Within what your medical team allows and your ability permits, moderate activity may help maintain function."]],[["舊Prediction","Old Prediction"],["完全不動最安全。","Not moving at all is safest."]],[["新Prediction","New Prediction"],["活動量需要依身體狀況個別調整。","Activity levels need to be adjusted individually to your physical condition."]],[["能力","Capability"],["功能維持。","Maintaining function."]],[["智慧","Wisdom"],["真正要守住的，不只是數字，也是你生活的能力。","What you really want to protect is not just a number, but your ability to live your life."]]],"title":["肌肉也是重要資產","Muscle is an important asset too"],"navTitle":["肌肉也是資產","Muscle is an asset too"],"nav":[["when",["長期躺坐、活動明顯減少時。","After long periods of lying or sitting, with clearly reduced activity."]],["action",["醫療狀況允許下做5–10分鐘適合自己的活動。","If your medical condition allows, do 5–10 minutes of activity that suits you."]],["done",["留下活動前後感受。","You've noted how you felt before and after."]]],"c":"red"},{"n":16,"stmt":["喝水很普通，但普通的事常常很重要。","Drinking water is ordinary, but ordinary things are often important."],"detail":[[["舊Model","Old Model"],["一定要找到高階方法。","I have to find an advanced method."]],[["新Model","New Model"],["基本需求永遠值得先確認。","Basic needs are always worth checking first."]],[["舊Prediction","Old Prediction"],["越複雜的方法越有效。","The more complex the method, the more effective."]],[["新Prediction","New Prediction"],["先把基本節點做好，才知道還缺什麼。","Get the basic nodes right first, then you'll know what's still missing."]],[["能力","Capability"],["基本照護。","Basic care."]],[["智慧","Wisdom"],["不要為了尋找奇蹟，忘記身體每天都需要的普通支持。","Don't forget the ordinary support your body needs every day while searching for a miracle."]]],"title":["基本補水也很重要","Basic hydration matters too"],"navTitle":["基本補水很重要","Basic hydration matters"],"nav":[["when",["忙到忘記喝水、攝取不足時。","When you're too busy to drink or your intake is low."]],["action",["依個人醫療限制與需求記錄實際飲水。","Record your actual fluid intake, following your personal medical limits and needs."]],["done",["知道今天真正的飲水量。","You know how much you really drank today."]]],"c":"red"},{"n":17,"stmt":["先建立自己的Baseline。","First, establish your own Baseline."],"detail":[[["舊Model","Old Model"],["今天不好就代表惡化。","A bad day means I'm getting worse."]],[["新Model","New Model"],["我要看自己的趨勢。","I need to look at my own trend."]],[["舊Prediction","Old Prediction"],["單一天的感受就是結論。","How I feel on a single day is the conclusion."]],[["新Prediction","New Prediction"],["連續記錄能讓我更清楚地看見變化。","Continuous records help me see changes more clearly."]],[["能力","Capability"],["自我監測。","Self-monitoring."]],[["智慧","Wisdom"],["生命是影片，不是一張照片。","Life is a movie, not a photograph."]]],"title":["建立自己的Baseline","Establish your own Baseline"],"navTitle":["建立Baseline","Establish a Baseline"],"nav":[["when",["覺得最近「整體變差」，卻說不出哪裡時。","When you feel \"worse overall\" lately but can't say where."]],["action",["睡眠／食慾／疲勞／疼痛／情緒各0–10。","Rate sleep / appetite / fatigue / pain / mood 0–10 each."]],["done",["得到五項Baseline。","You have five Baseline scores."]]],"c":"red"},{"n":18,"stmt":["症狀不是敵人，也是資訊。","Symptoms aren't enemies; they're also information."],"detail":[[["舊Model","Old Model"],["不舒服只想立刻消失。","I just want the discomfort to vanish immediately."]],[["新Model","New Model"],["症狀也在告訴我身體現在發生什麼。","Symptoms also tell me what's happening in my body right now."]],[["舊Prediction","Old Prediction"],["只要把感覺壓掉就好。","I just need to suppress the feeling."]],[["新Prediction","New Prediction"],["描述時間、程度與觸發因素，能產生更有用的資訊。","Describing timing, severity and triggers produces more useful information."]],[["能力","Capability"],["症狀辨識。","Symptom recognition."]],[["智慧","Wisdom"],["真正的照顧從看見開始。","Real care begins with seeing."]]],"title":["症狀也是資訊","Symptoms are information too"],"navTitle":["症狀也是資訊","Symptoms are information too"],"nav":[["when",["有不舒服卻不知道如何向醫療團隊描述時。","When you're uncomfortable but don't know how to describe it to your medical team."]],["action",["記時間＋程度＋多久＋可能Trigger。","Note time + severity + duration + possible Trigger."]],["done",["形成一段具體症狀描述。","You have a specific symptom description."]]],"c":"red"},{"n":19,"stmt":["一次改一件事，你才知道什麼真的有幫助。","Change one thing at a time, so you know what truly helps."],"detail":[[["舊Model","Old Model"],["所有好東西一起上。","Throw all the good things in at once."]],[["新Model","New Model"],["改變太多變項，很難知道Feedback來自哪裡。","Change too many variables and it's hard to know where the Feedback comes from."]],[["舊Prediction","Old Prediction"],["越多介入改善越快。","More interventions mean faster improvement."]],[["新Prediction","New Prediction"],["有計畫地調整，更容易看清效果與問題。","Planned adjustments make it easier to see effects and problems clearly."]],[["能力","Capability"],["自我實驗設計。","Designing self-experiments."]],[["智慧","Wisdom"],["想得到答案，就不要同時改掉所有問題。","If you want answers, don't change every variable at once."]]],"title":["一次改一件事","Change one thing at a time"],"navTitle":["一次改一件事","Change one thing at a time"],"nav":[["when",["同一天準備換飲食、補充品、運動與睡眠策略時。","When you're about to change diet, supplements, exercise and sleep strategy on the same day."]],["action",["只選1個主要變項。","Pick only 1 main variable."]],["done",["其他主要條件暫時不亂改。","Other main conditions stay unchanged for now."]]],"c":"red"},{"n":20,"stmt":["感覺改善值得珍惜，也值得留下紀錄。","Feeling better is worth cherishing — and worth recording."],"detail":[[["舊Model","Old Model"],["有效就繼續。","If it works, just keep going."]],[["新Model","New Model"],["我要記錄開始時間、改變內容與結果。","I'll record the start date, what I changed and the results."]],[["舊Prediction","Old Prediction"],["我一定會記得。","I'm sure I'll remember."]],[["新Prediction","New Prediction"],["紀錄能減少記憶偏差。","Records reduce memory bias."]],[["能力","Capability"],["Evidence紀錄。","Evidence recording."]],[["智慧","Wisdom"],["不要只留下感覺，也替未來的自己留下資料。","Don't keep only the feeling; leave data for your future self too."]]],"title":["改善值得留下紀錄","Improvements are worth recording"],"navTitle":["改善留下紀錄","Record improvements"],"nav":[["when",["覺得好像有改善卻不確定時。","When you seem to be improving but aren't sure."]],["action",["寫下具體改變。","Write down the specific change."]],["done",["留下日期＋Before＋After。","You've recorded date + Before + After."]]],"c":"red"},{"n":21,"stmt":["沒有感覺，不代表一定沒有作用；有感覺，也不代表一定是作用。","Feeling nothing doesn't necessarily mean no effect; feeling something doesn't necessarily mean an effect."],"detail":[[["舊Model","Old Model"],["身體感覺就是因果證明。","What my body feels is proof of cause and effect."]],[["新Model","New Model"],["感受是重要資料，但因果需要更謹慎判斷。","Feelings are important data, but causation needs more careful judgment."]],[["舊Prediction","Old Prediction"],["吃了以後變好，就是它造成。","I got better after taking it, so it caused it."]],[["新Prediction","New Prediction"],["時間、其他介入與自然波動也需要考慮。","Timing, other interventions and natural fluctuations also need to be considered."]],[["能力","Capability"],["因果判斷。","Causal judgment."]],[["智慧","Wisdom"],["尊重自己的感受，也不要讓感受替Evidence做完所有工作。","Respect your feelings, but don't let feelings do all of Evidence's work."]]],"title":["感覺不等於因果證明","Feelings aren't proof of cause and effect"],"navTitle":["感覺不等於因果","Feelings aren't cause and effect"],"nav":[["when",["吃某東西後變好，就立刻認定一定是它時。","When you feel better after taking something and immediately conclude it must be the reason."]],["action",["再列2種可能原因。","List 2 more possible causes."]],["done",["至少3個Hypothesis。","You have at least 3 Hypotheses."]]],"c":"red"},{"n":22,"stmt":["檢驗數字不是成績單。","Lab numbers are not a report card."],"detail":[[["舊Model","Old Model"],["紅字代表我失敗了。","Red flags mean I've failed."]],[["新Model","New Model"],["檢驗值是醫療判斷的一部分。","Test values are one part of medical judgment."]],[["舊Prediction","Old Prediction"],["數字不好就是一切不好。","Bad numbers mean everything is bad."]],[["新Prediction","New Prediction"],["醫療團隊會結合趨勢與整體Context判讀。","The medical team interprets them together with trends and the overall Context."]],[["能力","Capability"],["數據理解。","Understanding data."]],[["智慧","Wisdom"],["數字可以提供方向，不需要成為你的身份。","Numbers can give direction; they don't need to become your identity."]]],"title":["檢驗數字不是成績單","Lab numbers are not a report card"],"navTitle":["檢驗數字不是成績單","Lab numbers are not a report card"],"nav":[["when",["看到紅字、箭頭或異常數字就恐慌時。","When red flags, arrows or abnormal numbers make you panic."]],["action",["記數值／日期／醫療團隊解釋。","Record the value / date / your medical team's explanation."]],["done",["不自行只靠單一數字下結論。","You don't draw conclusions on your own from a single number."]]],"c":"red"},{"n":23,"stmt":["你的身體每天都可能不同。","Your body may be different every day."],"detail":[[["舊Model","Old Model"],["昨天能做到，今天也必須做到。","If I could do it yesterday, I must do it today."]],[["新Model","New Model"],["疾病與治療中的容量可能波動。","Capacity can fluctuate during il ects are worth proactively discussing with the medical team."]],[["舊Prediction","Old Prediction"],["說了也沒有用。","Saying something won't help."]],[["新Prediction","New Prediction"],["及早反映可能得到支持或調整。","Reporting early may bring support or adjustments."]],[["能力","Capability"],["治療溝通。","Treatment communication."]],[["智慧","Wisdom"],["接受治療，不等於放棄照顧生活品質。","Accepting treatment doesn't mean giving up on quality of life."]]],"title":["副作用值得主動討論","Side effects are worth raising proactively"],"navTitle":["副作用值得討論","Side effects are worth discussing"],"nav":[["when",["治療後出現困擾卻認為只能忍時。","When treatment causes problems and you think you just have to endure them."]],["action",["列最困擾的1項。","List the 1 most troubling one."]],["done",["形成下次或依醫囑提早詢問的問題。","You have a question to ask at the next visit, or earlier as your care team advises."]]],"c":"red"},{"n":26,"stmt":["把每天的能量當成有限資產。","Treat each day's energy as a limited asset."],"detail":[[["舊Model","Old Model"],["以前做得到，現在也要全部做。","I could do it all before, so I must do it all now."]],[["新Model","New Model"],["我要把能量放在真正重要的地方。","I'll put my energy where it truly matters."]],[["舊Prediction","Old Prediction"],["全部維持才算正常。","Only keeping everything going counts as normal."]],[["新Prediction","New Prediction"],["重新排序，可以讓有限能量產生更大的價值。","Re-prioritizing lets limited energy create more value."]],[["能力","Capability"],["能量管理。","Energy management."]],[["智慧","Wisdom"],["生命有限時，選擇就變得更珍貴。","When life feels limited, choices become more precious."]]],"title":["管理有限的能量","Manage your limited energy"],"navTitle":["管理有限能量","Manage limited energy"],"nav":[["when",["每天事情做不完、越做越累時。","When you can never finish your tasks and get more tired the more you do."]],["action",["分「一定要／可以等／可以不做」。","Sort into \"must do / can wait / can skip.\""]],["done",["刪除或延後1項。","You've dropped or postponed 1 item."]]],"c":"red"},{"n":27,"stmt":["今天只完成一件重要的事，也可以。","Finishing just one important thing today is enough."],"detail":[[["舊Model","Old Model"],["一天要做很多才有價值。","A day only has value if I do a lot."]],[["新Model","New Model"],["疾病期間的成功標準可以重新設定。","The standard for success can be reset during illness."]],[["舊Prediction","Old Prediction"],["做得少就是退步。","Doing less means going backward."]],[["新Prediction","New Prediction"],["真正重要的是今天做了最適合現在的事。","What matters is that today I did what best fits right now."]],[["能力","Capability"],["優先排序。","Prioritizing."]],[["智慧","Wisdom"],["生命的價值從來不等於待辦事項的數量。","The value of life never equals the length of a to-do list."]]],"title":["今天完成一件重要的事就好","Finishing one important thing today is enough"],"navTitle":["今天一件重要的事就好","One important thing today is enough"],"nav":[["when",["待辦很多、開始癱住時。","When the to-do list is long and you start to freeze."]],["action",["選今天唯一P1。","Choose today's single P1."]],["done",["完成P1。","You've completed P1."]]],"c":"red"},{"n":28,"stmt":["你的身體需要安全，不需要恐嚇。","Your body needs safety, not intimidation."],"detail":[[["舊Model","Old Model"],["一定要非常害怕，才會更自律。","I have to be very scared to stay disciplined."]],[["新Model","New Model"],["清楚資訊比恐嚇更能支持決策。","Clear information supports decisions better than fear."]],[["舊Prediction","Old Prediction"],["越恐懼越會照顧自己。","The more afraid I am, the better I'll take care of myself."]],[["新Prediction","New Prediction"],["理解風險與下一步，更容易產生穩定行動。","Understanding the risks and the next step makes steady action more likely."]],[["能力","Capability"],["風險管理。","Risk management."]],[["智慧","Wisdom"],["恐懼可以提醒你，但不必統治你。","Fear can remind you, but it doesn't have to rule you."]]],"title":["身體需要安全，不需要恐嚇","Your body needs safety, not intimidation"],"navTitle":["身體需要安全，不需要恐嚇","Your body needs safety, not intimidation"],"nav":[["when",["健康資訊越看越害怕時。","When the more health information you read, the more scared you get."]],["action",["關掉1個低品質焦慮來源。","Shut off 1 low-quality source of anxiety."]],["done",["24小時不再查看。","You don't look at it again for 24 hours."]]],"c":"red"},{"n":29,"stmt":["建立自己的照護SOP。","Build your own care SOP."],"detail":[[["舊Model","Old Model"],["每天看狀況再說。","I'll see how things go each day."]],[["新Model","New Model"],["固定幾個基本節點，可以降低每天重新決策的負擔。","Fixing a few basic nodes lowers the burden of deciding everything anew each day."]],[["舊Prediction","Old Prediction"],["健康管理一定很複雜。","Managing health must be complicated."]],[["新Prediction","New Prediction"],["簡單、穩定、可持續的流程更容易留下Feedback。","Simple, stable, sustainable processes make it easier to capture Feedback."]],[["能力","Capability"],["自我管理。","Self-management."]],[["智慧","Wisdom"],["把重要的事變成流程，就不用每天重新靠意志力。","Turn important things into routines, and you won't need willpower for them every day."]]],"title":["建立自己的照護SOP","Build your own care SOP"],"navTitle":["建立照護SOP","Build a care SOP"],"nav":[["when",["每天照護很亂、常忘東忘西時。","When daily care is chaotic and you keep forgetting things."]],["action",["早／中／晚各設定1件固定事。","Set 1 fixed task each for morning / noon / evening."]],["done",["建立3步驟SOP。","You've built a 3-step SOP."]]],"c":"red"},{"n":30,"stmt":["把所有藥物與營養補充品整理成一張表。","Put all your medications and supplements into one list."],"detail":[[["舊Model","Old Model"],["每個東西分開記就好。","Keeping separate notes for each is fine."]],[["新Model","New Model"],["醫療團隊需要看見完整清單。","The medical team needs to see the complete list."]],[["舊Prediction","Old Prediction"],["不同來源的產品互不相關。","Products from different sources are unrelated."]],[["新Prediction","New Prediction"],["完整資訊有助於評估重複、劑量與交互作用。","Complete information helps assess duplication, dosage and interactions."]],[["能力","Capability"],["用藥安全。","Medication safety."]],[["智慧","Wisdom"],["資訊越完整，合作越安全。","The more complete the information, the safer the collaboration."]]],"title":["整理藥物＋營養補充品清單","List medications + supplements together"],"navTitle":["整理完整清單","Compile a complete list"],"nav":[["when",["看診、換醫師、新增產品或不知道自己到底吃多少時。","At appointments, when changing doctors, adding a product, or when you're unsure what you're actually taking."]],["action",["藥物＋補充品＋草本全部列出。","List all medications + supplements + herbal products."]],["done",["名稱／量／頻率／用途完成。","Name / amount / frequency / purpose are all filled in."]]],"c":"red"},{"n":31,"stmt":["真正重要的營養問題，值得專業評估。","Important nutrition questions deserve professional assessment."],"detail":[[["舊Model","Old Model"],["網路查一下就知道自己缺什麼。","A quick online search will tell me what I'm lacking."]],[["新Model","New Model"],["症狀可能有很多原因。","Symptoms can have many causes."]],[["舊Prediction","Old Prediction"],["某個症狀一定等於缺某個營養素。","A certain symptom must mean a certain nutrient deficiency."]],[["新Prediction","New Prediction"],["病史、飲食、檢驗與醫療Context一起看更可靠。","Looking at medical history, diet, tests and medical Context together is more reliable."]],[["能力","Capability"],["營養評估。","Nutritional assessment."]],[["智慧","Wisdom"],["不要把複雜的身體，縮成一張網路症狀表。","Don't shrink a complex body into an online symptom chart."]]],"title":["重要營養問題值得專業評估","Important nutrition questions deserve professional assessment"],"navTitle":["營養問題值得專業評估","Nutrition questions deserve professional assessment"],"nav":[["when",["懷疑自己缺某營養素時。","When you suspect you're lacking a certain nutrient."]],["action",["把問題寫成一句具體問題。","Write the issue as one specific question."]],["done",["知道應該問哪位合適專業人員。","You know which appropriate professional to ask."]]],"c":"red"},{"n":32,"stmt":["不要用營養素取代該做的醫療。","Don't use nutrients to replace the medical care you need."],"detail":[[["舊Model","Old Model"],["只要把身體調好，就不需要治療。","If I just tune my body up, I won't need treatment."]],[["新Model","New Model"],["營養支持與疾病治療回答的是不同問題。","Nutritional support and disease treatment answer different questions."]],[["舊Prediction","Old Prediction"],["只能二選一。","I can only pick one."]],[["新Prediction","New Prediction"],["安全的整合可以讓不同工具各自在適合的位置工作。","Safe integration lets different tools each work in their proper place."]],[["能力","Capability"],["整合照護。","Integrative care."]],[["智慧","Wisdom"],["真正的整合不是排斥，而是知道每個工具的角色與邊界。","Real integration isn't exclusion; it's knowing each tool's role and limits."]]],"title":["不要用營養素取代該做的醫療","Don't use nutrients to replace needed medical care"],"navTitle":["營養不能取代必要醫療","Nutrition can't replace necessary medical care"],"nav":[["when",["想用營養素取代原本醫療計畫時。","When you want to replace your original medical plan with nutrients."]],["action",["分「疾病治療／支持照護」兩欄。","Make two columns: \"disease treatment / supportive care.\""]],["done",["角色清楚。","The roles are clear."]]],"c":"red"},{"n":33,"stmt":["不要因為生病，就停止喜歡自己的身體。","Don't stop liking your body because you're sick."],"detail":[[["舊Model","Old Model"],["它變得不像以前了。","It's not like it used to be."]],[["新Model","New Model"],["它正在經歷非常艱難的旅程。","It's going through a very hard journey."]],[["舊Prediction","Old Prediction"],["只有恢復以前的樣子，我才能接受它。","I can only accept it once it's back to how it was."]],[["新Prediction","New Prediction"],["我現在就可以開始重新與它合作。","I can start cooperating with it again right now."]],[["能力","Capability"],["身體接納。","Body acceptance."]],[["智慧","Wisdom"],["身體不是展示品，是陪你走過生命的夥伴。","Your body isn't a display piece; it's the partner that walks through life with you."]]],"title":["重新喜歡自己的身體","Learn to like your body again"],"navTitle":["重新與身體合作","Cooperate with your body again"],"nav":[["when",["討厭、嫌棄、怨恨自己的身體時。","When you hate, reject or resent your body."]],["action",["寫身體今天仍替你完成的3件事。","Write 3 things your body still did for you today."]],["done",["至少3件。","At least 3."]]],"c":"red"},{"n":34,"stmt":["照顧今天，也是在替明天保留選項。","Caring for today also keeps options open for tomorrow."],"detail":[[["舊Model","Old Model"],["現在什麼都不能控制。","I can't control anything right now."]],[["新Model","New Model"],["我仍能管理一部分睡眠、營養、活動、資訊與求助。","I can still manage part of my sleep, nutrition, activity, information and help-seeking."]],[["舊Prediction","Old Prediction"],["失去疾病控制權就等於失去全部控制權。","Losing control over the disease means losing all control."]],[["新Prediction","New Prediction"],["一個可控制節點，也能重新產生Agency。","One controllable node can regenerate Agency."]],[["能力","Capability"],["控制圈。","Circle of control."]],[["智慧","Wisdom"],["自由不是控制所有事情，而是仍知道自己下一步能做什麼。","Freedom isn't controlling everything; it's still knowing what your next step can be."]]],"title":["照顧今天就是替明天保留選項","Caring for today keeps options for tomorrow"],"navTitle":["照顧今天就是保留明天","Caring for today preserves tomorrow"],"nav":[["when",["擔心明天、檢查或治療時。","When you're worried about tomorrow, a test or treatment."]],["action",["替明天預先準備1件事。","Prepare 1 thing for tomorrow in advance."]],["done",["明天少1個Decision。","Tomorrow has 1 fewer Decision."]]],"c":"red"},{"n":35,"stmt":["先站穩，再談翻轉。","Stand steady first, then talk about turning things around."],"detail":[[["舊Model","Old Model"],["我要立刻把整個身體翻轉。","I have to turn my whole body around immediately."]],[["新Model","New Model"],["真正的改變來自Baseline、行動、Feedback與持續更新。","Real change comes from Baseline, action, Feedback and continuous updating."]],[["舊Prediction","Old Prediction"],["越劇烈改變越有效。","The more drastic the change, the more effective."]],[["新Prediction","New Prediction"],["能持續的改變，才有機會形成新的Pattern。","Only sustainable change has a chance to form a new Pattern."]],[["能力","Capability"],["穩定改變。","Steady change."]],[["智慧","Wisdom"],["不要急著成為奇蹟，先成為每天願意照顧自己的人。","Don't rush to become a miracle; first become someone willing to care for yourself every day."]]],"title":["先站穩，再談翻轉","Stand steady first, then turn things around"],"navTitle":["先站穩再翻轉","Stand steady before turning things around"],"nav":[["when",["想一次改變全部健康問題時。","When you want to change all your health problems at once."]],["action",["找最低分的1個身體Node。","Find the 1 lowest-scoring body Node."]],["done",["本週先處理它。","You'll deal with it first this week."]]],"c":"red"},{"n":36,"stmt":["你可以害怕。","You're allowed to be afraid."],"detail":[],"title":["你可以害怕","You're allowed to be afraid"],"navTitle":["你可以害怕","You're allowed to be afraid"],"nav":[["when",["剛確診、檢查前、等報告或突然很害怕時。","Just diagnosed, before tests, waiting for results, or suddenly very scared."]],["action",["寫：「我現在最害怕＿＿。」","Write: \"What I'm most afraid of right now is ___.\""]],["done",["恐懼變成一句具體話。","The fear has become one specific sentence."]]],"c":"orange"},{"n":37,"stmt":["害怕不代表事情一定會發生。","Being afraid doesn't mean it will definitely happen."],"detail":[],"title":["害怕不代表一定會發生","Fear doesn't mean it will definitely happen"],"navTitle":["害怕不等於一定發生","Fear doesn't mean it will happen"],"nav":[["when",["大腦開始想最壞結局時。","When your brain starts imagining the worst ending."]],["action",["把「一定」改成「我擔心可能」。","Change \"definitely\" to \"I'm worried it might.\""]],["done",["Prediction不再等於Reality。","The Prediction no longer equals Reality."]]],"c":"orange"},{"n":38,"stmt":["焦慮是預測，不是預言。","Anxiety is a prediction, not a prophecy."],"detail":[],"title":["焦慮是預測，不是預言","Anxiety is a prediction, not a prophecy"],"navTitle":["焦慮是Prediction","Anxiety is a Prediction"],"nav":[["when",["反覆預演未來時。","When you keep rehearsing the future."]],["action",["寫下焦慮正在預測什麼。","Write down what the anxiety is predicting."]],["done",["等待Reality核對。","It's waiting to be checked against Reality."]]],"c":"orange"},{"n":39,"stmt":["今天哭了，也沒有把昨天的努力洗掉。","Crying today doesn't wash away yesterday's effort."],"detail":[],"title":["今天哭了也沒有退步","Crying today isn't going backward"],"navTitle":["哭了沒有退步","Crying isn't going backward"],"nav":[["when",["哭完又責怪自己不夠堅強時。","When you blame yourself for not being strong enough after crying."]],["action",["允許10分鐘不解決問題。","Allow 10 minutes of not solving anything."]],["done",["不增加第二層自責。","No second layer of self-blame added."]]],"c":"orange"},{"n":40,"stmt":["你不需要每天勇敢。","You don't need to be brave every day."],"detail":[],"title":["你不需要每天勇敢","You don't need to be brave every day"],"navTitle":["不用每天勇敢","No need to be brave every day"],"nav":[["when",["一直撐著不敢示弱時。","When you keep holding it together and don't dare show weakness."]],["action",["請1個人幫1件事。","Ask 1 person to help with 1 thing."]],["done",["真正求助。","You've really asked for help."]]],"c":"orange"},{"n":41,"stmt":["難過不是負能量。","Sadness is not \"negative energy.\""],"detail":[],"title":["難過不是負能量","Sadness is not negative energy"],"navTitle":["難過不是負能量","Sadness is not negative energy"],"nav":[["when",["害怕負面情緒影響疾病時。","When you fear negative emotions will affect your illness."]],["action",["難過0–10。","Rate sadness 0–10."]],["done",["晚上再評一次。","Rate it again in the evening."]]],"c":"orange"},{"n":42,"stmt":["生氣也可能是在告訴你界線被碰到了。","Anger may be telling you a boundary has been touched."],"detail":[],"title":["生氣可能是在提醒界線","Anger may be signaling a boundary"],"navTitle":["生氣可能是界線","Anger may be a boundary"],"nav":[["when",["對家人、醫療、朋友突然很生氣時。","When you suddenly get very angry at family, medical staff or friends."]],["action",["寫「我真正不能接受的是＿＿。」","Write \"What I really can't accept is ___.\""]],["done",["找出界線。","You've found the boundary."]]],"c":"orange"},{"n":43,"stmt":["你不需要為自己的恐懼道歉。","You don't need to apologize for your fear."],"detail":[],"title":["不需要為恐懼道歉","No need to apologize for fear"],"navTitle":["不用為恐懼道歉","No need to apologize for fear"],"nav":[["when",["覺得「別人都很勇敢，只有我怕」時。","When you feel \"everyone else is brave, only I'm scared.\""]],["action",["改說「我現在正在害怕」。","Say instead: \"I'm feeling afraid right now.\""]],["done",["不評價自己。","No judging yourself."]]],"c":"orange"},{"n":44,"stmt":["不要逼自己感恩疾病。","Don't force yourself to be grateful for the illness."],"detail":[],"title":["不必逼自己感恩疾病","No need to force gratitude for the illness"],"navTitle":["不用感恩疾病","No need to be grateful for the illness"],"nav":[["when",["被要求「生病也是禮物」而感到壓力時。","When you feel pressured by being told \"illness is a gift too.\""]],["action",["寫下1件你真的討厭的改變。","Write 1 change you truly hate."]],["done",["允許Reality。","Reality is allowed."]]],"c":"orange"},{"n":45,"stmt":["疾病不需要被美化，生命仍然可以被珍惜。","Illness doesn't need to be glorified; life can still be cherished."],"detail":[],"title":["疾病不需要被美化","Illness doesn't need to be glorified"],"navTitle":["疾病不用美化","Illness needn't be glorified"],"nav":[["when",["覺得必須把痛苦說成成長時。","When you feel you must describe suffering as growth."]],["action",["完成：「這真的很難，但今天仍有＿＿。」","Complete: \"This is really hard, but today there's still ___.\""]],["done",["同時容納兩個Reality。","Two Realities held at once."]]],"c":"orange"},{"n":46,"stmt":["你可以同時有希望，也有害怕。","You can ing positively enough"],"navTitle":["不是想得不夠好","It's not that you didn't think well enough"],"nav":[["when",["相信自己不夠正向才生病時。","When you believe you got sick because you weren't positive enough."]],["action",["說：「這是想法，不是醫學Evidence。」","Say: \"This is a thought, not medical Evidence.\""]],["done",["辨認1次錯誤Model。","You've identified 1 faulty Model."]]],"c":"orange"},{"n":51,"stmt":["身心互相影響，不等於心念決定一切。","Body and mind influence each other — that doesn't mean thoughts decide everything."],"detail":[],"title":["身心互相影響≠心念決定一切","Mind-body influence ≠ thoughts decide everything"],"navTitle":["身心互動不等於心念控制疾病","Mind-body interaction ≠ thoughts control disease"],"nav":[["when",["把所有疾病Outcome歸因於情緒時。","When you attribute every disease Outcome to emotions."]],["action",["找1個心理真正能影響的可控Node。","Find 1 controllable Node the mind can genuinely influence."]],["done",["對它行動。","Act on it."]]],"c":"orange"},{"n":52,"stmt":["冥想可以支持你，但不需要背負治癒疾病的責任。","Meditation can support you, but it doesn't have to carry the responsibility of curing disease."],"detail":[],"title":["冥想可以支持，不必背負治癒責任","Meditation can support you without carrying the burden of a cure"],"navTitle":["冥想只是支持工具","Meditation is just a support tool"],"nav":[["when",["冥想後期待疾病指標一定改變時。","When you expect disease markers to change after meditating."]],["action",["冥想5分鐘。","Meditate for 5 minutes."]],["done",["只比較緊繃感前後。","Only compare tension before and after."]]],"c":"orange"},{"n":53,"stmt":["呼吸練習的目標可以只是讓此刻舒服一點。","The goal of breathing practice can simply be to make this moment a little more comfortable."],"detail":[],"title":["呼吸可以只是讓此刻舒服一點","Breathing can simply make this moment more comfortable"],"navTitle":["呼吸回到現在","Breathe back into the present"],"nav":[["when",["緊張、等待、思緒停不下來時。","When you're tense, waiting, or your thoughts won't stop."]],["action",["做1–3分鐘舒服、不勉強的緩慢呼吸。","Do 1–3 minutes of comfortable, unforced slow breathing."]],["done",["觀察前後感受；不舒服即停止。","Notice how you feel before and after; stop if uncomfortable."]]],"c":"orange"},{"n"
