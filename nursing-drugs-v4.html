<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>護理國考</title>
<style>
:root{--navy:#1A2B5F;--teal:#0A7A72;--gold:#C9960C;--bg:#f3f5f9;--card:#fff;--ink:#1c2333;--sub:#5b6478;--line:#dfe3ec;--memo:#fff4c9;--trap:#ffeceb;--range:#e8f3ff;--chip:#eef1f7;--mark:#ffe066}
@media (prefers-color-scheme:dark){:root{--navy:#9db4ff;--teal:#4fd1c5;--gold:#f0c24b;--bg:#12151c;--card:#1b2030;--ink:#e8ebf3;--sub:#9aa3b8;--line:#2c3348;--memo:#3a3312;--trap:#3b1f1f;--range:#16283d;--chip:#262c3e;--mark:#806800}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
.top{background:linear-gradient(135deg,#1A2B5F,#0A7A72);color:#fff;padding:14px 0 12px}
.top h1{margin:0;font-size:20px;line-height:1.3}
.top p{margin:4px 0 0;font-size:13px;opacity:.9}
.apps{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.apps a{color:#fff;text-decoration:none;font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.45)}
.apps a.on{background:#fff;color:#1A2B5F;font-weight:700;border-color:#fff}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0 0}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;padding:11px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);font-size:16px}
.search input:focus{outline:none;border-color:var(--teal)}
.btn{padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--teal)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
@media (prefers-color-scheme:dark){.btn.pri{color:#0b1220}}
.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;border-bottom:3px solid transparent;color:var(--sub);white-space:nowrap;font-weight:600}
.tabs button.on{color:var(--navy);border-bottom-color:var(--teal)}
.filters{padding:10px 0 4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--bg);font-weight:700}
.opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.opts select{padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);max-width:100%}
.count{margin-left:auto;font-size:13px;color:var(--sub)}
main{padding:14px 0 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:12px;padding:14px 14px 10px;min-width:0}
.card.lab{border-left-color:var(--navy)}
.card.known{opacity:.62}
.card h3{margin:0;font-size:17px;line-height:1.35;color:var(--navy);overflow-wrap:anywhere}
.card h3 small{display:block;font-size:13px;font-weight:400;color:var(--sub)}
.head{display:flex;gap:8px;justify-content:space-between;align-items:flex-start;cursor:pointer}
.stars{color:var(--gold);font-size:13px;letter-spacing:1px;white-space:nowrap;padding-top:3px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.tag{font-size:12px;padding:1px 8px;border-radius:6px;background:var(--chip);color:var(--sub)}
.tag.cat{background:var(--teal);color:#fff}
@media (prefers-color-scheme:dark){.tag.cat{color:#0b1220}}
.rows{margin:0}
.row{display:grid;grid-template-columns:4.6em 1fr;gap:8px;padding:5px 0;border-top:1px dashed var(--line);font-size:15px}
.row dt{color:var(--teal);font-weight:700;font-size:13px;padding-top:2px}
.row dd{margin:0;overflow-wrap:anywhere}
.row.range dd{background:var(--range);border-radius:6px;padding:2px 8px;font-weight:600}
.memo,.trap{border-radius:8px;padding:7px 10px;margin-top:8px;font-size:15px}
.memo{background:var(--memo);font-weight:700}
.trap{background:var(--trap)}
.trap b,.memo b{font-size:13px}
details.case{margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:15px}
details.case summary{cursor:pointer;font-weight:600}
details.case p{margin:8px 0 2px;padding:8px 10px;background:var(--range);border-radius:6px}
.acts{display:flex;gap:6px;margin-top:10px}
.acts button{flex:1;font-size:13px;padding:6px;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer;color:var(--sub)}
.acts button.on{background:var(--memo);color:var(--ink);font-weight:700;border-color:var(--gold)}
.compact .card .rows,.compact .card details.case,.compact .card .trap{display:none}
.compact .card.open .rows,.compact .card.open details.case{display:block}
.compact .card.open .trap{display:block}
.empty{text-align:center;color:var(--sub);padding:48px 0}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
h2.sec{font-size:18px;color:var(--navy);margin:26px 0 10px}
h2.sec:first-child{margin-top:4px}
.note{background:var(--memo);border-left:4px solid var(--gold);border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.sys{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.sys h3{margin:0 0 8px;font-size:19px;color:var(--navy)}
.sys .flag{background:var(--trap);border-radius:8px;padding:8px 12px;font-size:15px}
.sys h4{margin:14px 0 6px;font-size:13px;color:var(--teal);letter-spacing:.5px}
.links{display:flex;gap:6px;flex-wrap:wrap}
.link{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:3px 10px;font-size:14px;cursor:pointer}
.link:hover{border-color:var(--teal)}
.link.d{border-left:3px solid var(--teal)}
.link.l{border-left:3px solid var(--navy)}
.link.x{cursor:default;opacity:.7}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.chain{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
table.chain th,table.chain td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
table.chain th{background:var(--chip);font-size:13px;color:var(--sub);white-space:nowrap}
table.chain tr:last-child td{border-bottom:0}
table.chain td:first-child{font-weight:700;color:var(--navy);white-space:nowrap}
.quiz{max-width:720px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.quiz .q{font-size:20px;font-weight:700;line-height:1.5;margin:10px 0 18px}
.quiz .a{background:var(--range);border-radius:10px;padding:14px;margin-bottom:14px}
.quiz .a b{color:var(--navy)}
.quiz .meta{font-size:13px;color:var(--sub);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.quiz .go{display:flex;gap:8px;flex-wrap:wrap}
.quiz .go button{flex:1;padding:12px;font-size:16px}
.tip{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:12px;padding:12px 14px;font-size:15px}
.tip h3{margin:0 0 4px;font-size:16px;color:var(--navy)}
.tip p{margin:0;color:var(--sub)}
.quiz p{margin:0 0 12px}
.optlist{display:grid;gap:8px;margin-bottom:14px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font-size:16px;line-height:1.5}
.opt b{color:var(--teal);min-width:1.2em}
.opt:not(:disabled):hover{border-color:var(--teal)}
.opt:disabled{cursor:default;color:inherit}
.opt.right{border-color:#1f9d55;background:rgba(31,157,85,.14)}
.opt.wrong{border-color:#d64545;background:rgba(214,69,69,.14)}
dialog{border:0;border-radius:14px;padding:0;max-width:min(560px,94vw);width:100%;background:transparent}
dialog::backdrop{background:rgba(10,15,30,.55)}
dialog .card{margin:0}
dialog .x{display:block;margin:8px 0 0 auto}
footer.ft{font-size:13px;color:var(--sub);padding:0 0 32px;line-height:1.7}
@media (max-width:560px){.wrap{padding:0 12px}.grid{grid-template-columns:1fr}.top h1{font-size:18px}.count{width:100%;margin-left:0}.quiz{padding:16px}.quiz .q{font-size:18px}}
@media print{.bar,.top .apps,.acts{display:none}.card{break-inside:avoid}}

</style>
</head>
<body>
<div class="top"><div class="wrap">
  <h1 id="title">護理國考</h1>
  <p id="sub"></p>
  <nav class="apps" id="apps"></nav>
</div></div>
<div class="bar"><div class="wrap">
  <div class="search"><input id="q" type="search" autocomplete="off"><button class="btn" id="clear">清除</button></div>
  <div class="tabs" id="tabs"></div>
</div></div>
<div class="wrap">
  <div class="filters" id="filters">
    <div class="chips" id="chips"></div>
    <div class="opts">
      <select id="cat"></select>
      <select id="status"><option value="">全部狀態</option><option value="five">只看 ★★★★★</option><option value="fav">只看收藏</option><option value="todo">只看未熟</option></select>
      <button class="btn" id="compact"></button>
      <span class="count" id="count"></span>
    </div>
  </div>
  <main id="view"></main>
  <footer class="ft">資料說明｜數值為常用成人教學參考範圍，實際判讀以題目或執行檢驗的實驗室 reference range 為準；劑量與門檻依適應症、途徑、腎肝功能與最新指引而異。星等是學習優先級，不代表官方出題率。國考題為依國考題型編寫的練習題，非歷屆原題。本工具供國考複習使用，不作為臨床處置依據。收藏、「已熟」與錯題本紀錄只存在這台裝置的瀏覽器。</footer>
</div>
<dialog id="dlg"><div id="dlgBody"></div><button class="btn x" data-act="close">關閉</button></dialog>

  }
  $('compact').textContent = store.compact ? '展開全部內容' : '精簡檢視';
  $('view').innerHTML = st.tab==='nav' ? viewNav() : st.tab==='quiz' ? viewQuiz() : st.tab==='exam' ? viewExam() : st.tab==='tips' ? viewTips() : viewList(st.tab);
}

function init(){
  document.title = '護理國考－' + TITLE;
  $('title').textContent = '護理國考｜' + TITLE;
  $('sub').textContent = '藥物 ' + DRUGS.length + ' 筆・檢驗 ' + LABS.length + ' 筆・' + SYS.length + ' 個系統・國考題 ' + EXAMS.length + ' 題';
  $('apps').innerHTML = [['sys','🧭 系統導航'],['drugs','💊 藥物庫'],['labs','🧪 檢驗庫']].map(function(a){
    return '<a href="'+encodeURI(LINKS[a[0]])+'" class="'+(a[0]===MODE?'on':'')+'">'+a[1]+'</a>';
  }).join('');
  $('q').placeholder = MODE==='labs' ? '搜尋 WBC、K、Troponin、黃疸、子癇…（空白分隔可多關鍵字）'
                     : '搜尋 aspirin、高血鉀、EPS、解毒劑…（空白分隔可多關鍵字）';

  $('q').addEventListener('input', function(){ st.q = this.value; render(); });
  $('clear').addEventListener('click', function(){ st.q = st.sys = st.cat = st.status = ''; $('q').value = ''; $('status').value = ''; render(); $('q').focus(); });
  $('cat').addEventListener('change', function(){ st.cat = this.value; render(); });
  $('status').addEventListener('change', function(){ st.status = this.value; render(); });
  $('compact').addEventListener('click', function(){ store.compact = !store.compact; save(); render(); });
  $('dlg').addEventListener('click', function(ev){ if (ev.target === this) this.close(); });

  document.addEventListener('click', function(ev){
    var t = ev.target.closest('[data-tab],[data-sys],[data-act]');
    if (!t) return;
    if (t.dataset.tab) { st.tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.sys !== undefined) { st.sys = t.dataset.sys; render(); return; }
    var act = t.dataset.act, cardEl = t.closest('.card'), e = cardEl && BYID[cardEl.dataset.id];
    if (act === 'open') { if (store.compact) cardEl.classList.toggle('open'); return; }
    if (act === 'fav' || act === 'known') {
      var k = pkey(e); store[act][k] ? delete store[act][k] : store[act][k] = 1; save();
      var inDlg = !!t.closest('dialog');
      render();
      if (inDlg) $('dlgBody').innerHTML = card(e);
      return;
    }
    if (act === 'peek') { $('dlgBody').innerHTML = card(BYID[t.dataset.id]); $('dlg').showModal(); return; }
    if (act === 'close') { $('dlg').close(); return; }
    if (act === 'exam') { startExam(examPool(), +t.dataset.n); render(); return; }
    if (act === 'examwrong') { startExam(wrongPool(), 0); render(); return; }
    if (act === 'examredo') { startExam(st.exam.miss, 0); render(); return; }
    if (act === 'examback') { st.exam = null; render(); return; }
    if (act === 'clearwrong') { store.wrong = {}; save(); render(); return; }
    if (act === 'pick') {
      var x = st.exam, cur = x.qs[x.i]; x.pick = +t.dataset.k;
      if (x.perm[x.pick] === 0) delete store.wrong[cur.q]; else { store.wrong[cur.q] = 1; x.miss.push(cur); }
      save(); render(); return;
    }
    if (act === 'examnext') { var y = st.exam; y.i++; y.pick = null; y.perm = shuffle([0,1,2,3]); render(); window.scrollTo(0, 0); return; }
    if (act === 'reveal') { st.quiz.show = true; render(); return; }
    if (act === 'skip') { nextQuiz(); render(); return; }
    if (act === 'ok' || act === 'no') {
      var q = BYID[st.quiz.id];
      if (act === 'ok') { st.score.ok++; store.known[pkey(q)] = 1; save(); } else st.score.no++;
      nextQuiz(); render(); return;
    }
  });
  render();
}
init();
})();

</script>
</body>
</html>
