<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人性隱學系統｜懂人性，改命運</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0D1B3E;--teal:#1B5E7B;--gold:#8A6200;--lgold:#F5E6C0;
  --green:#0F6E56;--red:#8B1A1A;--purple:#4A1A7A;
  --bg:#F4F6F9;--card:#fff;--border:#DDE2E9;--text:#1a1a1a;--text2:#555;--text3:#999;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── NAV ── */
.topnav{background:var(--navy);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-logo{color:var(--lgold);font-size:16px;font-weight:700;display:flex;align-items:center;gap:7px}
.nav-tabs{display:flex;gap:4px}
.nav-tab{background:transparent;border:none;color:rgba(255,255,255,.6);font-size:13px;padding:7px 12px;border-radius:8px;cursor:pointer;transition:.15s}
.nav-tab.active,.nav-tab:hover{background:rgba(255,255,255,.12);color:#fff}

/* ── HERO ── */
.hero{background:linear-gradient(150deg,#0D1B3E 0%,#1B5E7B 100%);color:#fff;padding:2.5rem 1.2rem 2rem;text-align:center}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(245,230,192,.15);color:var(--lgold);font-size:12px;padding:4px 12px;border-radius:999px;margin-bottom:14px;font-weight:500}
.hero-title{font-size:26px;font-weight:700;line-height:1.4;margin-bottom:8px}
.hero-sub{font-size:14px;opacity:.8;line-height:1.7;margin-bottom:20px}
.hero-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:380px;margin:0 auto 22px}
.hcard{background:rgba(255,255,255,.12);border-radius:12px;padding:10px 8px;text-align:center}
.hcard-num{font-size:20px;font-weight:700;color:var(--lgold)}
.hcard-label{font-size:11px;opacity:.75;margin-top:2px}

/* ── PAGE ── */
.page{display:none;padding:1rem}
.page.active{display:block}

/* ── SECTION HEADER ── */
.sec-head{margin-bottom:16px}
.sec-title{font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--navy)}
.sec-sub{font-size:13px;color:var(--text3);margin-top:3px}

/* ── CARDS ── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;cursor:pointer;transition:box-shadow .2s}
.card:hover{box-shadow:0 2px 12px rgba(0,0,0,.08)}
.card-icon{font-size:22px;color:var(--teal);margin-bottom:8px}
.card-title{font-size:14px;font-weight:600;color:var(--navy);margin-bottom:4px}
.card-desc{font-size:12px;color:var(--text2);line-height:1.5}
.card-tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;margin-top:6px}

/* ── MODULE DETAIL ── */
.module-back{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--teal);cursor:pointer;margin-bottom:16px;padding:8px 0}
.module-hero{background:linear-gradient(135deg,var(--navy),var(--teal));border-radius:16px;padding:18px 16px;color:#fff;margin-bottom:16px}
.module-title{font-size:20px;font-weight:700;margin-bottom:6px}
.module-thesis{font-size:13px;opacity:.8;line-height:1.6}
.insight-box{border-radius:12px;padding:13px;margin-bottom:10px;border-left:4px solid}
.insight-box.gold{background:#FFF8E7;border-color:var(--gold)}
.insight-box.teal{background:#E8F4FB;border-color:var(--teal)}
.insight-box.red{background:#FDE8E8;border-color:var(--red)}
.insight-box.green{background:#E6F5F0;border-color:var(--green)}
.insight-box.purple{background:#F0E8FA;border-color:var(--purple)}
.insight-label{font-size:11px;font-weight:700;margin-bottom:5px}
.insight-text{font-size:13px;color:var(--navy);line-height:1.7}
.vs-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
.vs-table th{padding:9px 10px;font-weight:600;font-size:12px;color:#fff}
.vs-table td{padding:8px 10px;border-bottom:1px solid #f0f0f0}
.vs-table tr:last-child td{border-bottom:none}
.vs-l{color:var(--red);font-weight:500}
.vs-r{color:var(--green);font-weight:500}
.formula-flow{display:flex;flex-direction:column;align-items:center;gap:4px;margin:14px 0}
.formula-step{background:#FFF8E7;border:1.5px solid var(--gold);border-radius:10px;padding:9px 20px;font-size:14px;font-weight:600;color:var(--navy);text-align:center}
.formula-arrow{font-size:20px;color:var(--gold);line-height:1}
.checklist{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.check-item{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;background:#F8F8F8;border-radius:10px;font-size:13px;color:var(--navy);line-height:1.5}
.check-icon{font-size:15px;flex-shrink:0;margin-top:1px}

/* ── QUIZ ── */
.quiz-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.quiz-q{font-size:15px;font-weight:600;color:var(--navy);margin-bottom:14px}
.quiz-opts{display:flex;flex-direction:column;gap:8px}
.quiz-opt{background:#F8F8F8;border:1.5px solid var(--border);border-radius:10px;padding:11px 13px;font-size:13px;cursor:pointer;text-align:left;transition:.15s}
.quiz-opt:hover{border-color:var(--teal);background:#E8F4FB}
.quiz-opt.correct{background:#E6F5F0;border-color:var(--green);color:var(--green);font-weight:600}
.quiz-opt.wrong{background:#FDE8E8;border-color:var(--red);color:var(--red)}
.quiz-explain{font-size:13px;color:var(--text2);background:#F8F8F8;border-radius:10px;padding:11px;margin-top:8px;line-height:1.6;display:none}
.quiz-progress{background:#F0F0F0;border-radius:4px;height:4px;margin-bottom:16px}
.quiz-fill{height:100%;border-radius:4px;background:var(--teal);transition:.4s}
.score-box{background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;border-radius:16px;padding:20px;text-align:center;margin:16px 0}
.score-num{font-size:48px;font-weight:700;color:var(--lgold)}
.score-label{font-size:14px;opacity:.8;margin-top:4px}

/* ── DIAGNOSIS ── */
.diag-option{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;transition:.15s}
.diag-option:hover,.diag-option.selected{border-color:var(--teal);background:#E8F4FB}
.diag-option.selected .diag-radio{background:var(--teal);border-color:var(--teal)}
.diag-option.selected .diag-radio::after{display:block}
.diag-row{display:flex;align-items:flex-start;gap:10px}
.diag-radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:.15s}
.diag-radio::after{content:'';width:8px;height:8px;border-radius:50%;background:#fff;display:none}
.diag-text{font-size:14px;color:var(--navy)}
.diag-desc{font-size:12px;color:var(--text3);margin-top:2px}
.diag-nav{display:flex;gap:8px;margin-top:14px}
.btn-primary{flex:1;background:var(--navy);color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.btn-primary:hover{background:var(--teal)}
.btn-primary:disabled{background:#ccc;cursor:not-allowed}
.btn-back{background:#F0F0F0;color:var(--text2);border:none;border-radius:10px;padding:12px 14px;font-size:14px;cursor:pointer}
.result-bar{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px}
.bar-fill{height:8px;border-radius:4px;margin-bottom:10px}
.result-type{font-size:17px;font-weight:700;color:var(--navy);margin-bottom:6px}
.result-sub{font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:14px}

/* ── TAGS ── */
.tag-navy{background:#E8ECF5;color:var(--navy)}
.tag-gold{background:#FFF8E7;color:var(--gold)}
.tag-red{background:#FDE8E8;color:var(--red)}
.tag-green{background:#E6F5F0;color:var(--green)}
.tag-teal{background:#E8F4FB;color:var(--teal)}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:9px 20px;border-radius:999px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="topnav">
  <div class="nav-logo"><i class="ti ti-brain"></i> 人性隱學</div>

<!-- ══════════════════════════════════ MODULES ══════════════════════════════════ -->

<script>
// ══════════════════════════════════════════════════════════════════
// DATA
// ══════════════════════════════════════════════════════════════════

const QUOTES = [
  '人性不是善惡，而是生存演算法\n理解機制，才能升級自己',
  '同樣的事件，不同的解讀，造就完全不同的人生',
  '越缺什麼，越容易被什麼拿捏\n最好的防身術，是讓自己不缺',
  '看一個人，要看他在失敗時怎麼做\n這才是他真正的人格底色',
  '廉價的本質，是過度供給\n稀缺性，才是真正的議價權',
  '情緒可以有，但不一定要公開播放\n成熟不是沒情緒，而是懂得管理時機',
  '真正聰明的人，不是最強的人\n而是最懂人性的人',
  '人生最大的損耗，不是努力不夠\n而是在錯誤的迴路裡反覆消耗',
  '福氣不是神明給的\n福氣是人格長期運作後產生的結果',
  '低維看人看外表，高維看人看系統\n最高維看人看他的更新能力',
  '識人的三把尺：失敗時看責任感，壓力下看人格底色，批評後看更新能力',
];

let quoteIdx = Math.floor(Math.random()*QUOTES.length);

const MODULES = [
  {
    id:'observe', icon:'ti-eye', color:'teal', tagClass:'tag-teal', tag:'觀人術',
    title:'如何看透一個人',
    desc:'16個維度，讀懂人格底色',
    thesis:'高維觀人，看系統，不看表面',
    content: {
      insight: {type:'gold', label:'核心洞見', text:'看一個人，最準確的三個時機：失敗時（看責任感）、壓力下（看人格底色）、面對批評後（看更新能力）。這三個時刻，人最難偽裝。'},
      sections: [
        {title:'16維觀人術', type:'table', headers:['觀察面向','看什麼','能看出什麼'], rows:[
          ['對待弱者','對服務生、下屬的態度','品格與同理心'],
          ['面對失敗','怪別人還是檢討自己','責任感'],
          ['面對批評','防衛還是學習','成熟度'],
          ['時間分配','時間花在哪裡','核心價值'],
          ['面對誘惑','即時享樂還是延遲滿足','自律力'],
          ['面對承諾','說到做到嗎','信任資產'],
          ['獨處能力','焦慮還是自在','內在穩定度'],
          ['持續學習','願不願意更新','未來上限'],
        ]},
        {title:'低維 vs 高維看人', type:'vs', left:'低維看人', right:'高維看人', rows:[
          ['看外表','看習慣'],['看口才','看行動'],['看學歷','看學習力'],
          ['看情緒','看恢復力'],['看成功','看誠信'],['看結果','看系統'],
        ]},
      ],
      quote: '口說的是願望，行動才是真相',
    }
  },
  {
    id:'survival', icon:'ti-shield', color:'navy', tagClass:'tag-navy', tag:'生存機制',
    title:'人性的底層演算法',
    desc:'大腦如何生成行為與決策',
    thesis:'人性是生存策略，不是善惡標籤',
    content:{
      insight:{type:'teal', label:'核心洞見', text:'人類大腦的核心目標只有一個：最大化生存機率、降低不確定性。所有看起來「奇怪」的人性反應，幾乎都可以從這個角度理解。'},
      sections:[
        {title:'人性背後的生存機制', type:'checks', items:[
          {icon:'ti-shield', text:'焦慮：大腦預測到未知威脅，啟動高警報模式保護自己'},
          {icon:'ti-heart', text:'討好：為了維持社群連結，避免被排斥的生存策略'},
          {icon:'ti-eye', text:'嫉妒：監控他人相對地位，確保資源分配的雷達系統'},
          {icon:'ti-lock', text:'控制欲：試圖降低不確定性，增加預測感'},
          {icon:'ti-users', text:'尋求認可：確認自己在群體中的價值，提高合作機會'},
          {icon:'ti-run', text:'逃避：減少預測的能量消耗，回到舒適的已知區'},
        ]},
        {title:'高熵 vs 低熵人格', type:'vs', left:'高熵循環（消耗）', right:'低熵循環（升級）', rows:[
          ['恐懼→高警報→情緒化','覺察→觀察→修正'],
          ['災難化預測','現實驗證'],
          ['控制欲強','接納不確定性'],
          ['關係高耗能','建立低耗能關係'],
          ['情緒接管人格','情緒調節後決策'],
          ['人生重播模式','持續更新模型'],
        ]},
      ],
      formula:['生存威脅感知','大腦高警報','情緒反應','行為輸出','結果回饋','模型更新'],
      quote: '了解機制，才能超越機制',
    }
  },
  {
    id:'emotion', icon:'ti-mood-smile', color:'gold', tagClass:'tag-gold', tag:'情緒機制',

    {name:'成長型人格', score:[0,2], color:'var(--green)', desc:'你有較強的自我覺察和成長能力，傾向從問題中學習。你的優勢是更新能力強，風險是有時可能過度理性而忽略情感需求。建議：持續深化覺察，並建立更穩固的情緒基礎。'},
    {name:'穩健型人格', score:[3,5], color:'var(--teal)', desc:'你在情緒管理和人際關係上相對穩定，但可能在面對高壓時出現盲點。你的優勢是可預測性高，讓人信任。建議：主動尋找自己的盲點，在舒適中保持成長動力。'},
    {name:'高警報型人格', score:[6,8], color:'var(--gold)', desc:'你的大腦傾向高警報模式，在壓力下容易情緒化或防衛。這不是你的錯，而是生存機制過度活躍。建議：練習降低警報的技術（呼吸、觀察者視角），建立安全感的內在基礎。'},
    {name:'高耗能型人格', score:[9,99], color:'var(--red)', desc:'你目前可能在高熵循環中，消耗大量能量在控制、防衛或比較。這是可以改變的。建議：先從一件事開始練習：每次情緒出現時，先問「這個情緒在告訴我什麼需求？」'},
  ],
};

// STATE
// ══════════════════════════════════════════════════════════════════
let quizState={current:0,score:0,done:false,answered:[]};
let diagState={current:0,answers:[],done:false};
let currentModule=null;

// ══════════════════════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════════════════════
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t=>{
    if(t.textContent.trim()==={home:'首頁',modules:'模組',quiz:'測驗',diag:'診斷'}[id])t.classList.add('active');
  });
  if(id==='modules')renderModules();
  if(id==='quiz')renderQuiz();
  if(id==='diag')renderDiag();
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

function nextQuote(){
  quoteIdx=(quoteIdx+1)%QUOTES.length;
  document.getElementById('daily-quote').textContent=QUOTES[quoteIdx];
}

// ══════════════════════════════════════════════════════════════════
// MODULES
// ══════════════════════════════════════════════════════════════════
function renderModules(){
  const list=document.getElementById('moduleCards');
  list.innerHTML=MODULES.map((m,i)=>`
    <div class="card" onclick="openModule(${i})">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:44px;height:44px;border-radius:14px;background:var(--${m.color==='navy'?'navy':m.color==='gold'?'gold':m.color==='red'?'red':m.color==='green'?'green':m.color==='purple'?'purple':'teal'});display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;opacity:.85">
          <i class="ti ${m.icon}" style="color:#fff"></i>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:15px;font-weight:600;color:var(--navy)">${m.title}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px">${m.desc}</div>
          <span class="card-tag ${m.tagClass}" style="margin-top:5px">${m.tag}</span>
        </div>
        <i class="ti ti-chevron-right" style="color:var(--text3);flex-shrink:0"></i>
      </div>
    </div>
  `).join('');
}

function openModule(idx){
  currentModule=idx;
  const m=MODULES[idx];
  const c=m.content;
  document.getElementById('module-list').style.display='none';
  const det=document.getElementById('module-detail');
  det.style.display='block';
  det.scrollTop=0;

  let html=`
    <div class="module-back" onclick="closeModule()"><i class="ti ti-arrow-left"></i> 返回模組列表</div>
    <div class="module-hero">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <i class="ti ${m.icon}" style="font-size:24px;color:var(--lgold)"></i>
        <span style="font-size:12px;background:rgba(255,255,255,.15);padding:3px 10px;border-radius:999px">${m.tag}</span>
      </div>
      <div class="module-title">${m.title}</div>
      <div class="module-thesis">${m.thesis}</div>
    </div>`;

  // Insight box
  const ins=c.insight;
  const insColors={gold:'var(--gold)',teal:'var(--teal)',red:'var(--red)',green:'var(--green)',purple:'var(--purple)'};
  html+=`<div class="insight-box ${ins.type}" style="margin-bottom:12px"><div class="insight-label" style="color:${insColors[ins.type]}">▌ ${ins.label}</div><div class="insight-text">${ins.text}</div></div>`;

  // Sections
  c.sections.forEach(sec=>{
    html+=`<div style="font-size:15px;font-weight:600;color:var(--navy);margin:16px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--border)">${sec.title}</div>`;

    if(sec.type==='table'){
      html+=`<div style="overflow-x:auto"><table class="vs-table"><thead><tr>${sec.headers.map(h=>`<th style="background:var(--navy);text-align:left">${h}</th>`).join('')}</tr></thead><tbody>`;
      sec.rows.forEach((row,ri)=>{
        html+=`<tr style="background:${ri%2===0?'#F8F8F8':'#fff'}">${row.map((cell,ci)=>`<td class="${ci===0?'':'ci===1?vs-l:vs-r'}">${cell}</td>`).join('')}</tr>`;
      });
      html+=`</tbody></table></div>`;
    }

    if(sec.type==='vs'){
      html+=`<div style="overflow-x:auto"><table class="vs-table"><thead><tr><th style="background:var(--red)">${sec.left}</th><th style="background:var(--green)">${sec.right}</th></tr></thead><tbody>`;
      sec.rows.forEach((row,ri)=>{
        html+=`<tr style="background:${ri%2===0?'#F8F8F8':'#fff'}"><td class="vs-l">${row[0]}</td><td class="vs-r">${row[1]}</td></tr>`;
      });
      html+=`</tbody></table></div>`;
    }

    if(sec.type==='checks'){
      html+=`<div class="checklist">`;
      sec.items.forEach(item=>{
        html+=`<div class="check-item"><i class="ti ${item.icon} check-icon" style="color:var(--teal)"></i>${item.text}</div>`;
      });
      html+=`</div>`;
    }

    if(sec.type==='formula'){
      html+=`<div style="font-size:12px;color:var(--gold);font-weight:700;text-align:center;margin-bottom:8px">【公式】</div><div class="formula-flow">`;
      sec.steps.forEach((s,i)=>{
        html+=`<div class="formula-step">${s}</div>`;
        if(i<sec.steps.length-1)html+=`<div class="formula-arrow">↓</div>`;
      });
      html+=`</div>`;
    }
  });

  // Formula (standalone)
  if(c.formula){
    html+=`<div style="font-size:15px;font-weight:600;color:var(--navy);margin:16px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--border)">核心公式</div>
    <div style="font-size:12px;color:var(--gold);font-weight:700;text-align:center;margin-bottom:8px">【公式】</div><div class="formula-flow">`;
    c.formula.forEach((s,i)=>{
      html+=`<div class="formula-step">${s}</div>`;
      if(i<c.formula.length-1)html+=`<div class="formula-arrow">↓</div>`;
    });
    html+=`</div>`;
  }

  // Quote
  html+=`<div style="background:linear-gradient(135deg,#0D1B3E,#1B5E7B);border-radius:14px;padding:16px;margin-top:16px;text-align:center">
    <div style="font-size:16px;font-weight:600;color:var(--lgold);line-height:1.7">「${c.quote}」</div>
  </div>`;

  det.innerHTML=html;
  det.scrollIntoView({behavior:'smooth'});
}

function closeModule(){
  document.getElementById('module-list').style.display='block';
  document.getElementById('module-detail').style.display='none';
}

// ══════════════════════════════════════════════════════════════════
// QUIZ
// ══════════════════════════════════════════════════════════════════
function renderQuiz(){
  const con=document.getElementById('quiz-container');
  if(quizState.done){renderQuizScore();return;}
  const q=QUIZ[quizState.current];
  const pct=Math.round(quizState.current/QUIZ.length*100);
  con.innerHTML=`
    <div style="margin-bottom:4px;font-size:13px;color:var(--text3)">題目 ${quizState.current+1} / ${QUIZ.length}</div>
    <div class="quiz-progress"><div class="quiz-fill" style="width:${pct}%"></div></div>
    <div class="quiz-card">
      <div class="quiz-q">${q.q}</div>
      <div class="quiz-opts">
        ${q.opts.map((opt,i)=>`<button class="quiz-opt" onclick="answerQuiz(${i})" id="opt-${i}">${opt}</button>`).join('')}
      </div>
      <div class="quiz-explain" id="quiz-explain">${q.explain}</div>
    </div>
    <div style="text-align:center;margin-top:8px;font-size:13px;color:var(--text3)">已答對 ${quizState.score} 題</div>`;
}

function answerQuiz(idx){
  const q=QUIZ[quizState.current];
  if(quizState.answered[quizState.current])return;
  quizState.answered[quizState.current]=true;
  const opts=document.querySelectorAll('.quiz-opt');
  opts.forEach((o,i)=>{
    o.style.pointerEvents='none';
    if(i===q.correct)o.classList.add('correct');
    else if(i===idx&&idx!==q.correct)o.classList.add('wrong');
  });
  document.getElementById('quiz-explain').style.display='block';
  if(idx===q.correct)quizState.score++;
  setTimeout(()=>{
    quizState.current++;
    if(quizState.current>=QUIZ.length){quizState.done=true;renderQuizScore();}
    else renderQuiz();
  },2000);
}

function renderQuizScore(){
  const pct=Math.round(quizState.score/QUIZ.length*100);
  const msg=pct>=80?'人性高手！你對人性有深刻的理解':pct>=60?'理解不錯！繼續深化這些洞見':'還有成長空間，多學習幾個模組再來挑戰！';
  document.getElementById('quiz-container').innerHTML=`
    <div class="score-box">
      <div style="font-size:14px;opacity:.8;margin-bottom:8px">測驗完成！</div>
      <div class="score-num">${quizState.score}/${QUIZ.length}</div>
      <div class="score-label">正確率 ${pct}%</div>
      <div style="font-size:14px;margin-top:12px;opacity:.85">${msg}</div>
    </div>
    <button class="btn-primary" onclick="resetQuiz()">再測一次</button>
    <button style="width:100%;background:#F0F0F0;color:var(--navy);border:none;border-radius:10px;padding:12px;font-size:14px;cursor:pointer;margin-top:8px" onclick="showPage('modules')">回去學習模組</button>`;
}

function resetQuiz(){quizState={current:0,score:0,done:false,answered:[]};renderQuiz();}

// ══════════════════════════════════════════════════════════════════
// DIAG
// ══════════════════════════════════════════════════════════════════
function renderDiag(){
  const con=document.getElementById('diag-container');
  if(diagState.done){renderDiagResult();return;}

  if(diagState.current===0){
    con.innerHTML=`
      <div style="text-align:center;padding:1rem 0 1.5rem">
        <div style="font-size:22px;font-weight:700;color:var(--navy);margin-bottom:8px">${DIAG.title}</div>
        <div style="font-size:14px;color:var(--text2);line-height:1.7">${DIAG.sub}</div>
      </div>
      <div class="insight-box teal" style="margin-bottom:16px">
        <div class="insight-label" style="color:var(--teal)">▌ 診斷說明</div>
        <div class="insight-text">誠實回答每個問題，選最接近你真實反應的選項（不是你希望自己的樣子）。沒有好壞之分，只有對自己更真實的了解。</div>
      </div>
      <button class="btn-primary" onclick="startDiag()">開始診斷</button>`;
    return;
  }

  const qi=diagState.current-1;
  const q=DIAG.questions[qi];
  const pct=Math.round(qi/DIAG.questions.length*100);
  const selected=diagState.answers[qi];

  con.innerHTML=`
    <div style="margin-bottom:4px;font-size:13px;color:var(--text3)">問題 ${qi+1} / ${DIAG.questions.length}</div>
    <div class="quiz-progress"><div class="quiz-fill" style="width:${pct}%"></div></div>
    <div style="font-size:16px;font-weight:600;color:var(--navy);margin-bottom:16px;line-height:1.5">${q.q}</div>
    ${q.opts.map((opt,i)=>`
      <div class="diag-option ${selected===i?'selected':''}" onclick="selectDiag(${i})">
        <div class="diag-row">
          <div class="diag-radio"></div>
          <div class="diag-text">${opt}</div>
        </div>
      </div>`).join('')}
    <div class="diag-nav">
      ${qi>0?`<button class="btn-back" onclick="diagBack()"><i class="ti ti-arrow-left"></i></button>`:''}
      <button class="btn-primary" onclick="diagNext()" ${selected===undefined?'disabled':''}>
        ${qi<DIAG.questions.length-1?'下一題':'查看結果'}
      </button>
    </div>`;
}

function startDiag(){diagState.current=1;renderDiag();}

function selectDiag(idx){
  diagState.answers[diagState.current-1]=idx;
  renderDiag();
}

function diagNext(){
  if(diagState.current>=DIAG.questions.length){
    diagState.done=true;renderDiagResult();
  } else {
    diagState.current++;renderDiag();
  }
}

function diagBack(){
  if(diagState.current>1){diagState.current--;renderDiag();}
}

function renderDiagResult(){
  // Score based on answers (0=best, 3=worst pattern)
  const total=diagState.answers.reduce((s,a)=>s+a,0);
  const type=DIAG.types.find(t=>total>=t.score[0]&&total<=t.score[1])||DIAG.types[DIAG.types.length-1];

  const bars=[
    {label:'成長動力',val:Math.max(20,100-total*8)},
    {label:'情緒穩定',val:Math.max(15,95-total*7)},
    {label:'人際智慧',val:Math.max(20,90-total*6)},
    {label:'自我覺察',val:Math.max(25,85-total*5)},
  ];

  const barColors=['var(--green)','var(--teal)','var(--navy)','var(--gold)'];

  let html=`
    <div style="background:linear-gradient(135deg,var(--navy),var(--teal));border-radius:16px;padding:18px;color:#fff;text-align:center;margin-bottom:16px">
      <div style="font-size:13px;opacity:.7;margin-bottom:6px">你的人格模式</div>
      <div style="font-size:22px;font-weight:700;color:var(--lgold)">${type.name}</div>
    </div>
    <div class="insight-box gold" style="margin-bottom:14px">
      <div class="insight-label" style="color:var(--gold)">▌ 診斷解讀</div>
      <div class="insight-text">${type.desc}</div>
    </div>
    <div style="font-size:15px;font-weight:600;color:var(--navy);margin-bottom:12px">人格維度分析</div>`;

  bars.forEach((b,i)=>{
    html+=`
      <div class="result-bar"><span style="font-size:13px;color:var(--navy);font-weight:500">${b.label}</span><span style="font-size:13px;color:var(--text3)">${b.val}%</span></div>
      <div class="bar-fill" style="background:${barColors[i]};width:${b.val}%;opacity:.75"></div>`;
  });

  html+=`
    <div style="font-size:15px;font-weight:600;color:var(--navy);margin:14px 0 10px">推薦學習模組</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${total<4?`
        <div class="card" onclick="openModule(1);showPage('modules')"><div style="display:flex;align-items:center;gap:10px"><i class="ti ti-shield" style="color:var(--teal);font-size:18px"></i><div><div style="font-size:14px;font-weight:600">人性的底層演算法</div><div style="font-size:12px;color:var(--text3)">深化你的系統思維</div></div></div></div>
      `:total<8?`
        <div class="card" onclick="openModule(2);showPage('modules')"><div style="display:flex;align-items:center;gap:10px"><i class="ti ti-mood-smile" style="color:var(--gold);font-size:18px"></i><div><div style="font-size:14px;font-weight:600">情緒是訊號，不是敵人</div><div style="font-size:12px;color:var(--text3)">提升情緒解讀能力</div></div></div></div>
      `:`
        <div class="card" onclick="openModule(10);showPage('modules')"><div style="display:flex;align-items:center;gap:10px"><i class="ti ti-infinity" style="color:var(--navy);font-size:18px"></i><div><div style="font-size:14px;font-weight:600">人性低熵工程學</div><div style="font-size:12px;color:var(--text3)">從高熵循環走向低熵智慧</div></div></div></div>
      `}
      <div class="card" onclick="openModule(3);showPage('modules')"><div style="display:flex;align-items:center;gap:10px"><i class="ti ti-brain" style="color:var(--purple);font-size:18px"></i><div><div style="font-size:14px;font-weight:600">信念如何綁架人生</div><div style="font-size:12px;color:var(--text3)">升級你的解讀框架</div></div></div></div>
    </div>
    <button class="btn-primary" style="margin-top:14px" onclick="resetDiag()">重新診斷</button>`;

  document.getElementById('diag-container').innerHTML=html;
}

function resetDiag(){diagState={current:0,answers:[],done:false};renderDiag();}

// ══════════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════════
document.getElementById('daily-quote').textContent=QUOTES[quoteIdx];
renderModules();
</script>

(function(){
var TAG=['情境衝突','反問句','哲學命題','對比句','排比句','認知翻轉','層層遞進','詩性收束'];
var P=[{"page": "如何看透一個人｜16維觀人術", "t": "看一個人，不要看他順利的時候，要看他失敗的時候", "tags": "#識人 #16維觀人術 #看行動不聽承諾 #LifeOS", "s": ["那位新同事一進公司就讓人印象深刻：口才好、穿著得體、會議上總有漂亮的見解，大家都說他是明日之星。直到某一次專案出了大錯，他第一時間在群組裡說：「這部分不是我負責的。」那天之後，同事們開始注意到一些以前沒放在心上的細節：他對清潔阿姨從不打招呼，答應的事常常忘記，被主管指正時總是急著解釋。原來，大家看見的，一直只是他最好看的那一面。", "如果一個人說得很好，就代表他做得很好嗎？如果第一印象這麼準，為什麼我們總在吃過虧之後，才說「早該看出來的」？我們看人，到底是在看他這個人，還是在看他願意讓我們看見的樣子？", "看人，最準確的三個時機是：失敗時，看他的責任感；壓力下，看他的人格底色；面對批評後，看他的更新能力。這三個時刻，人最難偽裝。高維的觀人，不看表面，而看系統：看他怎麼對待弱者，怎麼分配時間，怎麼面對誘惑，怎麼兌現承諾，獨處時是焦慮還是自在，還願不願意繼續學習。", "低維看人看外表，高維看人看習慣；低維看口才，高維看行動；低維看學歷，高維看學習力；低維看情緒，高維看恢復力；低維看成功，高維看誠信；低維看一時的結果，高維看長期的系統。口說的是願望，行動才是真相。", "看他對服務生的態度，就知道他的同理心；看他失敗時怪別人還是檢討自己，就知道他的責任感；看他被批評時是防衛還是學習，就知道他的成熟度；看他的時間花在哪裡，就知道他真正在乎什麼；看他說過的話有沒有做到，就知道他的信任值多少。", "我們以為看透一個人，是為了防備他；其實學會看人，更深的意義是學會看自己。最深的翻轉是：當你用這十六個維度去看別人時，也請拿它們照一照自己的鏡子。你在失敗時怎麼做？你被批評時怎麼想？別人看你的那些時刻，也正在定義你是誰。", "這週，選三個維度練習觀察：對待弱者、面對承諾、面對批評。先觀察身邊的人，也觀察自己。不急著下結論，只是記錄。第一週，你會發現自己以前看人有多快；第一個月，你開始比較少被第一印象騙；半年後，你身邊留下來的，越來越多是真正可靠的人，而你自己，也越來越成為那樣的人。", "河面平靜的時候，誰都看不出水有多深；只有暴風雨來了，才知道哪裡有暗流，哪裡有礁石。願你不再被平靜的水面迷惑；願你學會在風雨裡看清一個人；願你自己，也成為那條無論晴雨，都清澈見底的河。"], "q": [["口說的是願望，行動才是真相。", "Words are wishes; actions are the truth."], ["這週練習觀察三件事：對待弱者、面對承諾、面對批評。", "This week, observe three things: how they treat the weak, keep promises, and take criticism."]]}, {"page": "人性的底層演算法", "t": "人性不是善惡，是一套為了活下去而設計的演算法", "tags": "#人性 #生存機制 #高熵低熵 #LifeOS", "s": ["她一直覺得婆婆很難相處：什麼都要管，什麼都要問，連冰箱裡的菜放哪裡都有意見。她在心裡給婆婆貼了一張標籤：控制狂。直到有一天，婆婆生病住院，在病床上拉著她的手說：「我年輕的時候，家裡什麼都沒有，每一分錢、每一樣東西都要算好，不然就活不下去。」她愣住了，那張貼了好多年的標籤，突然有點撕不下來，又有點不忍心再貼著。", "如果人性可以簡單地分成好人和壞人，為什麼好人也會做出傷人的事？如果某些行為看起來很討厭，那背後是不是一定有一顆壞心？我們急著替別人貼上標籤，可是我們有沒有問過，是什麼讓一個人，變成了現在的樣子？", "人類大腦的核心目標只有一個：最大化生存的機率，降低不確定性。所有看起來「奇怪」的人性反應，幾乎都可以從這個角度理解：焦慮，是大腦預測到未知的威脅；討好，是為了維持連結、避免被排斥；嫉妒，是在監控相對的位置；控制欲，是想降低不確定；逃避，是想回到熟悉的安全區。人性是生存策略，不是善惡標籤。", "高熵的循環是：恐懼、高警報、情緒化、災難化預測、控制欲強、關係高耗能、情緒接管人格、人生一再重播。低熵的循環是：覺察、觀察、修正、現實驗證、接納不確定、建立低耗能的關係、情緒調節後再做決定、持續更新模型。同樣的大腦，可以跑出兩種完全不同的人生。", "看見焦慮，就問它在預測什麼威脅；看見討好，就問它在害怕失去什麼連結；看見嫉妒，就問它在比較什麼位置；看見控制，就問它想降低什麼不確定；看見逃避，就問它想回到什麼安全的地方。每一個問題，都把一個標籤，還原成一個可以被理解的人。", "我們以為理解人性，是為了原諒別人或看穿別人；其實理解人性，最大的禮物是理解自己。最深的翻轉是：當你知道自己的焦慮、討好、嫉妒都只是大腦在努力保護你，你就不必再那麼討厭自己。了解機制，才能超越機制；而超越，總是從溫柔地看懂開始。", "下一次，當你對自己或別人的某個反應感到不耐煩時，先問一句：這個反應，是在保護什麼？第一次，你也許想不出來；第五次，你開始看見背後的恐懼；一個月後，你對別人多了一點耐心，對自己也是；半年後，你發現很多衝突變小了，因為你不再只看見行為，而是看見了行為背後那個想活下去的人。", "樹根在地底下彎彎曲曲，看起來很醜，可是正是那些彎曲，讓它繞過石頭，找到了水。願你看見每一個人身上那些彎曲的根；願你明白，那是他們為了活下去而長成的樣子；願你也溫柔地看待自己的彎曲，然後慢慢地，長出更直、更高的枝幹。"], "q": [["了解機制，才能超越機制。", "Understand the mechanism, and you can rise above it."], ["對一個反應不耐煩時，先問：它在保護什麼？", "When a reaction annoys you, ask first: what is it protecting?"]]}, {"page": "情緒是訊號，不是敵人", "t": "壓抑情緒，就像把警報器的電線剪斷", "tags": "#情緒是訊號 #焦慮憤怒悲傷羞愧 #情緒解讀 #LifeOS", "s": ["他是大家眼中情緒最穩定的人，從不生氣，從不哭，什麼事都說「沒關係」。可是這兩年，他常常胃痛、失眠，醫生找不出明確的原因。有一天，一位朋友問他：「你上一次真正生氣，是什麼時候？」他想了很久，想不起來。朋友又問：「那你是不是有很多事，其實很在意，卻一直說沒關係？」他沉默了，胃又開始隱隱作痛。", "如果情緒是不好的東西，為什麼越壓抑情緒的人，身體越容易出狀況？如果控制情緒就是成熟，為什麼那些從不表現情緒的人，有時候會在某一天突然爆發？我們一直被教導要管好情緒，可是，有沒有人教過我們，情緒到底想告訴我們什麼？", "每一種情緒，都是大腦發出的訊號。壓抑情緒等於拒絕訊號，情緒就會以更大的代價重新浮現。焦慮的底層訊號，是預測到未知的威脅；憤怒的底層訊號，是界線被侵犯、需求被阻礙；悲傷的底層訊號，是失去了某個重要的東西；羞愧的底層訊號，是身分感受到否定。真正的情緒管理，是解讀訊號，而不是消滅訊號。", "壓抑的人說：「不要想，就會過去。」解讀的人說：「這個情緒在告訴我什麼？」一個把焦慮當成軟弱，一個去驗證威脅是否真實；一個把憤怒吞下去，一個清楚地表達界線；一個不准自己悲傷，一個允許自己整合失去；一個在羞愧裡否定自己，一個分清楚是行為錯了，不是人錯了。", "焦慮來了，去驗證那個威脅是不是真的；憤怒來了，去說出你的界線，保護你的需求；悲傷來了，給自己時間，讓失去慢慢被放進生命裡；羞愧來了，告訴自己：我做錯了一件事，不代表我是一個錯的人。每一種情緒，都有它正確的回應方式。", "我們以為情緒是問題，所以想辦法讓它消失；其實情緒是老師，它來，是為了教我們一些我們還沒看見的事。最深的翻轉是：情緒不是你的問題，是你的老師。當你開始聽懂它，它就不必再用胃痛、失眠和爆發，來引起你的注意。", "從今天開始，練習一個情緒解讀的公式：事件發生，情緒出現，問一句「這在告訴我什麼」，找到真實的需求，再採取有效的行動。第一次，你可能只能做到第二步；第七次，你開始找得到需求；一個月後，你發現自己比較少爆發，也比較少內傷；三個月後，身邊的人會說：你好像變得比較真實，也比較輕鬆了。", "煙霧警報器很吵，可是沒有人會因為它吵，就把電線剪斷，因為它在提醒我們，有地方可能著火了。願你不再剪斷心裡的警報器；願你每一次聽見它響，都願意走過去看一看；願你在聽懂它之後，好好照顧那個，一直想被你看見的地方。"], "q": [["情緒不是你的問題，是你的老師。", "Your emotions aren't your problem; they're your teacher."], ["事件、情緒、問「這在告訴我什麼」、找需求、再行動。", "Event, emotion, ask \"what is this telling me?\", find the need, then act."]]}, {"page": "信念如何綁架人生", "t": "同一件事，不同的解讀，就是不同的人生", "tags": "#信念 #解讀決定命運 #成長型信念 #LifeOS", "s": ["兩個學生同樣考了六十分。一個人回家後對自己說：「我就是笨，再怎麼讀都沒用。」從此他越來越少翻開課本。另一個人說：「這次我的讀法不對，下次換個方式試試。」他開始問老師、改筆記。十年後，兩個人走上了完全不同的路。他們的起點是同一張考卷，分岔點，是同一個晚上，對自己說的那一句話。", "如果事件決定了我們的命運，為什麼同樣的事件，會走出完全不同的人生？如果我們只是在描述事實，為什麼我們說給自己聽的那些話，會一句一句地，變成我們的性格？我們以為自己是被發生的事情改變，可是，真正改變我們的，會不會是我們怎麼解讀那些事？", "人不是活在現實裡，而是活在信念裡。信念不是天生的，而是從無數次的解讀中，累積而成的「結論」。命運有一條公式：事件本身是中性的，經過解讀被賦予意義，意義累積成信念，信念形成身分，身分變成自動運作的人格，人格長期運作的結果，就是命運。改變解讀，才能改變命運。", "限制性的解讀說：「我不夠好。」成長型的解讀說：「我在某些方面還有成長空間。」限制性的解讀說：「我失敗了。」成長型的解讀說：「這個方法在這個情境下沒有成功。」限制性的解讀說：「沒有人愛我。」成長型的解讀說：「我目前的連結方式需要調整。」限制性的解讀說：「這是命。」成長型的解讀說：「這是一個我可以修正的模型。」", "把「我做不到」換成「我現在的能力還不夠，但可以學」；把「我總是搞砸」換成「這次有一個環節沒處理好」；把「他們都看不起我」換成「我還不確定別人怎麼想」；把「太晚了」換成「現在開始，就是最早的時候」。每換一次，命運的軌道就偏一度。", "我們以為信念是我們擁有的東西，其實很多時候，是信念擁有了我們。最深的翻轉是：信念雖然強大，卻不是牢不可破的；它是一次一次解讀堆起來的，就能一次一次重新堆起來。你不必一夜之間換掉所有的信念，你只需要從下一次解讀，開始換一個說法。", "這週，每天記下一件讓你不舒服的事，以及你對它的第一個解讀，然後在旁邊寫一個成長型的解讀。第一天，你會覺得新的解讀很假；第一週，你開始相信一點點；一個月後，第一個解讀出現時，第二個解讀也跟著出現了；半年後，你會發現，很多以前會讓你一蹶不振的事，現在只是一個需要調整的問題。", "同一片天空，有人看見烏雲，有人看見烏雲後面透出來的光。天空沒有變，變的是看的人。願你在每一個陰天，都記得抬頭找一找那道光；願你說給自己聽的每一句話，都能讓你多走一步；願你的命運，在一次又一次溫柔的解讀裡，慢慢轉向你想去的地方。"], "q": [["改變解讀，才能改變命運。", "Change your interpretation, and you change your destiny."], ["每天替一件不舒服的事，寫一個成長型的解讀。", "Each day, write a growth-minded reading of one thing that upset you."]]}, {"page": "情感的底層邏輯", "t": "大多數感情問題，不是愛不愛，而是需求有沒有被看見", "tags": "#感情 #關係需求 #安全感 #LifeOS", "s": ["他們又冷戰了三天。起因是她傳了一則訊息，他隔了五個小時才回。她覺得被忽略，他覺得被控制。朋友勸她：「他就是不夠愛妳。」朋友勸他：「她就是太黏了。」可是兩個人都很清楚，他們是愛著對方的。只是每一次吵架，他們都在吵同一件事，卻從來沒有人說出那句真正想說的話：「我需要確定，你還在乎我。」", "如果吵架代表不愛了，為什麼那麼多相愛的人，吵得最兇？如果感情只靠感覺，為什麼感覺最濃烈的關係，有時候反而最不穩定？我們總是在問「他到底愛不愛我」，可是，這真的是我們最需要知道的答案嗎？", "愛情的本質，是兩個需求系統能否長期協同。表面上的現象，常常藏著底層的邏輯：吃醋，常是害怕失去；冷戰，常是防衛系統啟動；爭吵，常是需求衝突；分手，常是長期的預測失敗；白頭到老，不是運氣好，而是持續地更新關係。大多數感情問題，不是愛不愛的問題，而是需求有沒有被看見和回應。", "大眾的解讀說：「一見鍾情是命中注定。」底層的邏輯說：「那是一次很快的價值評估。」大眾的解讀說：「冷戰是沒感情了。」底層的邏輯說：「是防衛系統打開了。」大眾的解讀說：「爭吵是個性不合。」底層的邏輯說：「是兩個需求在互相碰撞。」看懂底層，就不必再被表面嚇壞。", "每個人在關係裡，至少需要四樣東西：被愛，是被重視，不只是言語，更是行動；被理解，是被看見真實的自己，而不是被期待；被選擇，是在有其他選擇的時候，仍然選擇我；安全感，是能預測對方的行為，不需要一直處在高度警覺裡。", "我們以為愛得夠深，就不會吵架；其實再深的愛，也需要翻譯。最深的翻轉是：愛的語言不同，不代表愛的深度不同。那個五個小時沒回訊息的人，可能只是在用他的方式專心工作；那個一直傳訊息的人，可能只是在用她的方式說「我想你」。學會翻譯，很多爭吵就不必發生。", "下一次感到委屈時，先別問「你為什麼這樣」，試著說出你的需求：「我需要的是……」例如：「我需要你忙的時候，先跟我說一聲，我就安心了。」第一次說，你會覺得很難為情；第二次說，對方開始懂了；一個月後，你們的冷戰變少了；半年後，你們學會了用對方聽得懂的語言，說出同樣的愛。", "兩條河匯流的地方，水會打旋，會起浪，那不是因為它們互相排斥，而是因為它們正在學著，一起流向同一個方向。願你們不再害怕那些浪；願你們都能說出自己的需要，也聽懂對方的需要；願你們的愛，在一次次的翻譯裡，越來越深，越來越穩。"], "q": [["愛的語言不同，不代表愛的深度不同。", "Different love languages don't mean different depths of love."], ["委屈時別問「你為什麼這樣」，先說「我需要的是……」", "When hurt, don't ask \"why did you do that?\"; say \"what I need is…\""]]}, {"page": "不被算計的10大忠告", "t": "越缺什麼，越容易被什麼拿捏：最好的防身術，是讓自己不缺", "tags": "#保護自己 #界線 #先驗證再相信 #LifeOS", "s": ["她在最寂寞的那一年，認識了一位很懂她的人。對方記得她說過的每一句話，在她難過時總是第一個出現。三個月後，對方開始提起自己的財務困難，她毫不猶豫地借了錢；半年後，她發現那個人同時對好幾個人說了一樣的故事。她不懂，自己明明不笨，為什麼會被騙？後來她才明白，對方看見的不是她的聰明，而是她那份太需要被理解的寂寞。", "如果被算計只是運氣不好，為什麼有些人總是一再受傷？如果善良是美德，為什麼最善良的人，往往最容易被利用？我們是不是太相信別人，還是我們太少看見，自己身上那個最容易被打開的缺口？", "認識人性，不是為了算計別人，而是為了保護自己。被算計的人，往往不是因為壞運氣，而是因為暴露了弱點、需求或底牌。越缺什麼，越容易被什麼拿捏：缺愛的人，容易被甜言蜜語打動；缺錢的人，容易被快速致富的承諾吸引；缺認可的人，容易被一點點肯定牽著走。最好的防身術，是讓自己不缺。", "天真的人說：「他對我這麼好，一定是真心的。」清醒的人說：「先觀察他的行動，再決定信任多少。」一個在情緒最高的時候做決定，一個在衝動的時候延遲決策；一個讓善良沒有邊界，一個讓善良有原則；一個把希望寄託在別人身上，一個把實力放在自己身上。", "不輕易透露底牌，資訊是籌碼；不高估人性，先驗證再相信；不讓需求感外露，保持內在獨立；不被情緒控制，衝動時先等一等；不只聽他說什麼，更要看他做什麼；不讓善良失去邊界，有原則的善良才能長久；不停止成長，因為實力才是最根本的底牌。", "我們以為保護自己，就是要變得冷漠、多疑；其實真正的保護，是讓自己內在夠完整，完整到不需要靠任何人來填滿。最深的翻轉是：當你不再那麼缺，那些想利用你的人，就找不到可以抓住的地方；而那些真心對你的人，也終於能被你，用清醒的心好好珍惜。", "這週，誠實地問自己：我最缺的是什麼？是被愛、被肯定、安全感，還是錢？然後做一件小事，自己替自己補一點：如果缺肯定，就每天寫下一件自己做得好的事；如果缺安全感，就整理一下自己的財務與支持系統。若遇到任何要求你借錢、投資或轉帳的陌生關係，先停下來，問問信任的人。在台灣，也可以撥打 165 反詐騙專線諮詢。", "一扇門如果總是開著，什麼風都吹得進來；裝上一把鎖，不是為了把世界擋在外面，而是讓你自己決定，什麼時候為誰開門。願你的善良，永遠有一把屬於自己的鎖；願你不再因為寂寞或匱乏，把鑰匙交給錯的人；願你在完整的自己裡，安心地，去愛值得的人。"], "q": [["最好的防身術，是讓自己不缺。", "The best self-defense is not being in need."], ["遇到要你借錢或轉帳的陌生關係，先停下來問信任的人。", "If someone new asks you to lend or transfer money, pause and ask someone you trust."]]}, {"page": "成熟的隱藏藝術", "t": "成熟不是沒有情緒，而是知道什麼時候說、對誰說、說多少", "tags": "#成熟 #情緒時機 #底牌 #LifeOS", "s": ["升職的消息還沒正式公布，他就忍不住在部門聚餐時說了出來。大家舉杯恭喜，他很開心。可是接下來的一個月，他發現同事對他客氣了，也冷淡了；有人開始在主管面前提起他過去的小失誤；原本談好的跨部門合作，也莫名其妙地卡住了。後來，一位資深同事私下對他說：「好消息，要等它真的落地了再說。」", "如果誠實是美德，為什麼有些話說得太早，反而傷了自己？如果分享能拉近距離，為什麼有些分享之後，人反而離我們更遠？我們一直以為成熟就是坦率，可是，坦率和不設防之間，到底有什麼差別？", "成熟不是沒有情緒，而是知道何時表達、何時保留。真正成熟的人，不是什麼都不說，而是清楚知道：什麼時候說，說給誰聽，說多少。四種情況下要特別小心：憤怒時，判斷力最低；開心時，高調容易招來嫉妒；脆弱時，容易誤判對方的動機；有需求時，越外露越容易被拿捏。", "不成熟的坦率說：「我想到什麼就說什麼。」成熟的表達說：「這件事，現在說，對誰說，說到哪裡最合適？」一個在憤怒時傳出傷人的訊息，一個等情緒過了再回；一個把未來的計畫逢人就講，一個在事情成了之後再分享；一個在脆弱時把心交給任何一個願意聽的人，一個先找真正值得信任的人。", "真實的財務，不必逢人就說；尚未成形的計畫，不必急著宣布；重要的人脈，不必到處展示；家裡最脆弱的地方，只說給真正可靠的人聽；真實的情緒，選擇安全的人和時機；核心的能力，持續累積，不必處處炫耀。保留，不是虛偽，而是對自己負責。", "我們以為隱藏是不真誠，其實真正的真誠，是對值得的人完整地打開；而對每個人都毫無保留，常常只是一種沒有界線的焦慮。最深的翻轉是：情緒可以有，但不一定要公開播放。懂得保留的人，不是心機重，而是終於學會了，把自己最珍貴的部分，好好地收著。", "從今天開始，練習一個小小的停頓：想說一件重要的事之前，先問自己三個問題：現在是對的時機嗎？對方是對的人嗎？說到哪裡就夠了？第一次，你會覺得有點彆扭；第十次，你開始習慣這個停頓；一個月後，你發現少了很多事後的後悔；半年後，你成了那個大家覺得「很穩」、也最值得信任的人。", "果實要熟了才摘，太早摘下來，又酸又澀，還浪費了一整季的陽光。話也是一樣。願你懂得等待每一句話成熟的時候；願你把最真的心，留給最值得的人；願你在每一次選擇說與不說之間，都更像一個溫柔而清醒的大人。"], "q": [["情緒可以有，但不一定要公開播放。", "You can have emotions without broadcasting them."], ["說重要的事之前問：時機對嗎？人對嗎？說到哪裡就夠？", "Before sharing something big, ask: right time, right person, how much is enough?"]]}, {"page": "永遠不要做廉價的人", "t": "你不是不夠努力，你是付出得太便宜", "tags": "#稀缺性 #不再討好 #自我價值 #LifeOS", "s": ["她是辦公室裡最好說話的人。同事請她幫忙，她從不拒絕；主管臨時加派工作，她總是說好；週末有人找她代班，她也點頭。她以為這樣會被喜歡，會被重視。可是升遷名單公布時，沒有她的名字。主管說：「她人很好，可是好像什麼都可以，看不出她真正的價值在哪裡。」她回家哭了一整晚。", "如果付出越多，就越被珍惜，為什麼最常付出的人，往往最被理所當然？如果討好能換來喜歡，為什麼討好所有人的人，最後常常失去了尊重？我們一直在拚命證明自己有用，可是，有沒有可能，我們正是因為給得太多、太快、太便宜，才讓自己變得不再珍貴？", "廉價的本質，不是沒有錢，而是失去了稀缺性。市場不會根據你的辛苦定價，而是根據稀缺性定價。你的時間、精力、情感與原則，都可能被過度供給；當你什麼都可以，你就什麼都不特別。稀缺性的建立，來自可以創造的價值、可以被信任的程度，以及不可輕易取代的能力。", "廉價的行為帶來短期的收益：討好所有人，暫時被喜歡；免費付出，獲得掌聲；降低原則，減少衝突；情緒反應，發洩壓力；過度透明，換來認同。可是長期的代價是：失去尊重，被當成理所當然，失去底線，失去信用，失去主導權。", "你可以幫忙，但不必每一次都幫；你可以付出，但要讓付出被看見；你可以溫柔，但溫柔裡要有底線；你可以分享，但不必把自己全部攤開；你可以努力，但要把力氣放在能累積價值的地方。珍惜自己的時間，別人才會珍惜你的時間。", "我們以為說「不」會讓人討厭我們，其實適當的「不」，才讓我們的「好」有了重量。最深的翻轉是：不做廉價的人，不是要你變得高傲或冷漠，而是要你明白，你的時間與心力是有價值的；當你先尊重自己的價值，別人才學得會怎麼尊重你。", "這週，練習三件事：第一，對一件不在你責任範圍內、又讓你很累的請求，溫和地說「這次我沒辦法」；第二，把一件你做得很好的事，清楚地讓相關的人知道；第三，每天花一點時間，投資一個讓你更難被取代的能力。第一次拒絕，你會心跳得很快；第三次，你發現天沒有塌；一年後，你會發現，大家對你的態度，不知不覺變了。", "山泉之所以珍貴，不是因為它很難喝到，而是因為它清澈、穩定、源源不絕，卻不會隨便漫到每一條水溝裡。願你也像一道清澈的泉；願你的溫柔有方向，你的付出有分寸；願你在每一次被需要的時候，都記得，你自己也是值得被好好珍惜的人。"], "q": [["先尊重自己的價值，別人才學得會尊重你。", "Respect your own worth first, and others will learn to respect it."], ["這週溫和地拒絕一件不屬於你的請求。", "Gently decline one request this week that isn't yours to carry."]]}, {"page": "脾氣裡藏著你的福氣", "t": "福氣不是神明給的，是你的脾氣，一天一天替你攢下來的", "tags": "#脾氣 #福氣 #情緒慣性 #LifeOS", "s": ["他是公司裡能力最強的人，卻也是最容易發脾氣的人。開會時一不順心就拍桌，同事犯錯就當眾罵，回家也常對家人沒耐心。他常說：「我就是直，脾氣來得快去得也快。」可是這些年，他身邊的人一個一個走了：得力的部下跳槽了，好朋友疏遠了，孩子也不太跟他說話。他一直覺得自己運氣不好，卻從沒想過，自己的福氣，可能是被脾氣一點一點趕走的。", "如果福氣是天注定的，為什麼脾氣好的人，身邊總是圍繞著願意幫他的人？如果脾氣是天生的，改不了，為什麼有些人到了中年，卻變得溫和了？我們總說「這個人很有福氣」，可是，福氣到底是從哪裡來的？", "福氣，是人格長期運作的複利結果。脾氣不是天生的性格，而是神經系統的慣性反應模式。慣性可以被覺察，可以被訓練，可以被升級。七種壞脾氣，背後各有一個底層信念：抱怨，是「世界欠我」；憤怒，是「必須照我的意思」；嫉妒，是「別人不該比我好」；計較，是「我不能吃虧」；傲慢，是「我永遠正確」；猜疑，是「人都不可信」；怨恨，是「我無法放下」。", "低福氣的人格是：抱怨、控制、嫉妒、計較、傲慢、猜疑、怨恨。高福氣的人格是：感恩、信任、欣賞、分享、謙虛、真誠、放下。一個讓人緣越來越差，一個讓人越來越想靠近；一個讓關係不斷衝突，一個讓合作機會越來越多；一個讓能量一直卡住，一個讓生命越流越順。", "把一次抱怨，換成一次感謝；把一次控制，換成一次信任；把一次嫉妒，換成一次真心的欣賞；把一次計較，換成一次分享；把一次傲慢，換成一次請教；把一次猜疑，換成一次坦誠的確認；把一次怨恨，換成一次對自己的放過。", "我們以為脾氣只是情緒的一時發洩，其實每一次發洩，都在替未來的人際關係記帳。最深的翻轉是：改變脾氣，就是在改變命運的軌跡。這不是要你壓抑情緒，而是讓你在情緒來時，有能力選擇一個更好的出口。你的每一次選擇，都在替你存下一份福氣。", "這週，從七種壞脾氣裡，挑一個你最常犯的，只練習一件事：在它要發作的那一刻，停三秒，說出它的名字，例如「我現在想抱怨了」。然後試著換一個反應。第一次，你可能還是忍不住；第五次，你停下來的時間越來越長；一個月後，身邊的人開始說你變了；一年後，你會發現，好事好像越來越常找上門來了。", "一塊田地，脾氣是天氣。暴雨和烈日會讓種子枯死，溫和的陽光與適時的雨，才能讓一整片田長滿稻穗。願你學會照顧自己心裡的天氣；願你的每一次溫和，都在替你播下一粒種子；願你在往後的歲月裡，收穫一整片，自己親手種出來的福氣。"], "q": [["福氣不是神明給的，是你的脾氣一天一天攢下來的。", "Blessings aren't handed down; they're saved, day by day, through your temper."], ["脾氣要發作時，停三秒，說出它的名字。", "When your temper rises, pause three seconds and name it."]]}, {"page": "中年人最高級的活法", "t": "中年的任務，不是擁有更多，而是內耗更少", "tags": "#中年 #健康時間關係認知 #降低內耗 #LifeOS", "s": ["四十八歲那年，他的存款終於達到了年輕時設定的目標。可是那一年，他也做了心導管手術，和大學最好的朋友因為一件小事斷了聯絡，孩子去外地讀書後，家裡安靜得只聽得見電視的聲音。他坐在病床上想：我花了二十年追求的東西都有了，可是為什麼，我覺得自己好像錯過了什麼更重要的東西？", "如果中年的成功，是擁有更多的錢和頭銜，為什麼那麼多擁有這些的人，反而感到空虛？如果我們還在用年輕時的方式拚命，身體和關係，還撐得住嗎？人生走到一半，我們是要繼續往外擴張，還是該開始，好好整理自己已經擁有的東西？", "中年的核心任務，是從擴張轉為優化，從增加轉為降低內耗。中年最容易犯的錯，是把焦點只放在錢的多少，而不是放在生命系統的品質。真正的財富，是健康的身體、清晰的關係、有效的時間，以及持續的選擇權。中年最重要的三項資產，是信任、健康與能力，它們都比金錢更難重建。", "年輕的活法說：「多賺一點，多做一點，多認識一些人。」中年的活法說：「少一點耗損，深一點關係，穩一點身體。」一個追求數量，一個追求品質；一個什麼機會都想抓，一個學會拒絕，保護注意力；一個把人脈當成資源，一個深化少數高品質的關係，清理高耗能的連結。", "投資健康，因為生病的代價遠比預防高，睡眠是報酬率最高的投資；投資時間，因為時間是中年最稀缺的資產；投資關係，因為能陪你走到最後的人，就那麼幾個；投資認知，因為思維不更新，人生就會在舊的模式裡重播。這四項投資，會在下半場替你回本。", "我們以為中年是一個要更努力證明自己的階段，其實中年最大的智慧，是知道什麼不必再證明了。最深的翻轉是：人生的下半場，贏的不是跑得最快的人，而是耗損最少、走得最穩的人。當你開始做減法，你會發現，生命反而變得更豐盛。", "這週，替自己做一次中年盤點：寫下你目前最耗能的三件事，以及最滋養你的三件事。先從耗能清單裡刪掉一件，再替滋養清單多安排一次。第一週，你可能會不習慣多出來的空白；第一個月，你的睡眠變好了；半年後，你和重要的人之間，多了好幾次深談；一年後，你會覺得，原來中年，可以活得這麼從容。", "秋天的樹，不再拚命長新葉，而是把力氣收回根部，準備下一個春天。那不是衰退，而是一種更深的智慧。願你在人生的秋天，也懂得把力氣收回來，好好照顧自己的根；願你少一點追逐，多一點安住；願你的下半場，不必轟轟烈烈，卻溫暖、踏實，而且自由。"], "q": [["人生的下半場，贏的是耗損最少、走得最穩的人。", "In life's second half, the winner is the one who wastes least and walks steadiest."], ["從耗能清單刪掉一件，替滋養清單多安排一次。", "Cross one draining thing off your list, and add one nourishing thing."]]}, {"page": "人性低熵工程學", "t": "人生最大的損耗，不是努力不夠，而是在錯誤的迴路裡反覆消耗", "tags": "#低熵人格 #人性機制 #人格診斷 #LifeOS", "s": ["她每天都很努力：早起運動、上課進修、經營人脈、照顧家庭。可是她總覺得很累，好像一直在原地打轉。每次吵架，都是同樣的理由；每次放棄，都是同樣的時間點；每次失望，都是同一種人讓她失望。她做了一個人格診斷，結果寫著「高耗能型人格」。她看著那幾個字，忽然懂了：她不是不夠努力，她只是一直在同一個迴路裡，用盡了力氣。", "如果努力就能改變人生，為什麼那麼多努力的人，人生還是一再重播？如果我們已經很拚了，為什麼總覺得能量不夠用？我們是不是一直在加大油門，卻從來沒檢查過，車子是不是一直在原地空轉？", "人性的低熵工程學，是讓人格從高耗能的循環，走向低耗能、可持續更新的循環。人格大致可以看見四種模式：成長型、穩健型、高警報型、高耗能型。高警報型的人，常被恐懼驅動，什麼都要防；高耗能型的人，常在關係與情緒裡反覆消耗。低熵的路徑是：覺察、觀察、修正、驗證、更新，一圈一圈，讓能量越用越有效。", "高熵的人格說：「我要更努力，才能改變。」低熵的人格說：「我要先找到，我的力氣都漏去了哪裡。」一個在恐懼裡高度警覺，一個在現實裡驗證威脅；一個用情緒做決定，一個調節之後再決定；一個讓關係高耗能，一個建立低耗能的關係；一個人生重播，一個模型持續更新。", "看懂一個人，從失敗、壓力和批評時開始；理解人性，從生存機制開始；解讀情緒，從訊號開始；改變命運，從解讀開始；經營感情，從需求開始；保護自己，從讓自己不缺開始；成熟，從懂得保留開始；有價值，從不廉價開始；有福氣，從好脾氣開始；過好下半場，從降低內耗開始。", "我們以為改變人格需要很大的意志力，其實改變人格，更像修理一台機器：先找到最耗能的那個零件，換掉它，整台機器就會順很多。最深的翻轉是：真正聰明的人，不是最強的人，而是最懂人性的人；而最懂人性的人，第一個看懂的，永遠是自己。", "這週，做一次人格模式的自我診斷，誠實地看看自己比較像哪一種。然後只選一個最耗能的迴路，例如「一被批評就防衛」或「一感到不安就控制」，畫出它的循環：觸發、反應、結果。接著，在循環裡選一個點，做一次不一樣的反應。第一次會很難；第五次，迴路開始鬆動；三個月後，你會發現自己多了好多力氣，可以用在真正重要的地方。", "一條漏水的水管，再怎麼加大水壓，送到遠方的水還是很少；找到那個漏洞補起來，細細的水流，也能灌溉一整片花園。願你不再責怪自己不夠努力；願你溫柔地找到那些讓力氣流失的地方；願你在補好之後，看見自己的生命，開出一整片你想要的花。"], "q": [["最懂人性的人，第一個看懂的，永遠是自己。", "Those who understand human nature best understand themselves first."], ["找到最耗能的那個迴路，做一次不一樣的反應。", "Find your most draining loop, and respond differently once."]]}];
var cur=0,hide=false;
function g(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var QL=[['心靈雞湯｜Soul Soup',''],['激勵｜Motivation','act']];
function qtext(p){return p.q?'\n\n'+p.q.map(function(x,k){return '【'+QL[k][0]+'】\n'+x[0]+'\n'+x[1]}).join('\n\n'):''}
function qhtml(p){return p.q?'<div class="lfb-qs">'+p.q.map(function(x,k){return '<div class="lfb-q '+QL[k][1]+'"><small>'+QL[k][0]+'</small><b>'+esc(x[0])+'</b><i lang="en">'+esc(x[1])+'</i></div>'}).join('')+'</div>':''}
function text(p){return '【'+p.t+'】\n\n'+p.s.join('\n\n')+qtext(p)+'\n\n'+p.tags}
function list(){
  var q=g('lfbQ').value.trim().toLowerCase();
  g('lfbList').innerHTML=P.map(function(p,i){
    if(q&&(p.page+' '+text(p)).toLowerCase().indexOf(q)<0)return '';
    return '<button type="button" data-i="'+i+'" class="'+(i===cur?'cur':'')+'"><small>第 '+(i+1)+' 頁｜'+esc(p.page)+'</small>'+esc(p.t)+'</button>';
  }).join('')||'<p style="padding:8px;font-size:14px">沒有符合的圖文</p>';
}
function show(i){
  cur=i;var p=P[i];
  g('lfbPost').innerHTML='<div class="lfb-eye">第 '+(i+1)+' / '+P.length+' 頁｜'+esc(p.page)+'</div><h2>'+esc(p.t)+'</h2><div class="lfb-meta">約 '+p.s.join('').replace(/\s/g,'').length+' 字 · 八種手法 · 文中情境為示例</div><div id="lfbBody" class="'+(hide?'notag':'')+'">'+p.s.map(function(x,k){return '<div class="lfb-part"><span class="lfb-tag">'+TAG[k]+'</span><p>'+esc(x)+'</p></div>'}).join('')+'</div>'+qhtml(p)+'<div class="lfb-tags">'+esc(p.tags)+'</div><div class="lfb-act"><button type="button" class="pri" id="lfbCopy">複製貼文</button><button type="button" id="lfbHide">'+(hide?'顯示':'隱藏')+'手法標籤</button><span class="lfb-st" id="lfbSt" role="status"></span></div>';
  g('lfbPost').scrollTop=0;list();
}
function copy(){
  var t=text(P[cur]),st=g('lfbSt');
  function fall(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();st.textContent=ok?'已複製，可直接貼到臉書。':'無法自動複製，請手動選取內文。'}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){st.textContent='已複製，可直接貼到臉書。'},fall)}else fall();
}
g('lfbOpen').onclick=function(){g('lfb').classList.add('on');show(cur);g('lfbQ').focus()};
g('lfbClose').onclick=function(){g('lfb').classList.remove('on');g('lfbOpen').focus()};
g('lfb').addEventListener('click',function(e){
  if(e.target===g('lfb'))g('lfbClose').onclick();
  var b=e.target.closest&&e.target.closest('[data-i]');if(b)show(+b.getAttribute('data-i'));
  if(e.target.id==='lfbCopy')copy();
  if(e.target.id==='lfbHide'){hide=!hide;show(cur)}
});
g('lfbQ').addEventListener('input',list);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&g('lfb').classList.contains('on'))g('lfbClose').onclick()});
})();
</script>
</body>
</html>
