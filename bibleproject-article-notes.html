<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#23211d;--sub:#6b665c;--line:#e2dccf;--acc:#b5532c;--acc2:#2f6f6a;--chip:#eee7d8;--b1:#fbe9df;--b2:#e3f1ef;--b3:#eef0fa;--b4:#f6f0d9}
@media (prefers-color-scheme:dark){:root{--bg:#1b1a17;--card:#25231f;--ink:#ece8df;--sub:#a49e92;--line:#3b3832;--acc:#e48c62;--acc2:#6fc0b8;--chip:#34312b;--b1:#43302a;--b2:#233b39;--b3:#2c2f42;--b4:#3d3826}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
header h1{font-size:18px;margin:0 0 6px}
#q{width:100%;padding:9px 12px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:2px 10px;border-radius:999px;cursor:pointer;font-size:13px;font-family:inherit}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.layout{display:grid;grid-template-columns:320px 1fr;max-width:1300px;margin:0 auto}
#list{border-right:1px solid var(--line);height:calc(100vh - 120px);overflow:auto;position:sticky;top:120px;padding:8px}
.li{padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.li:hover{background:var(--card)}
.li.on{background:var(--card);border-color:var(--acc)}
.li b{display:block;font-size:14px;line-height:1.45}
.li span{font-size:12px;color:var(--sub)}
.count{font-size:12px;color:var(--sub);padding:2px 10px}
main{padding:16px 24px 60px;min-width:0}
.tag{display:inline-block;background:var(--chip);padding:0 8px;border-radius:4px;font-size:12px;margin-right:6px}
h2.title{font-size:24px;margin:6px 0 2px;line-height:1.4}
.en{color:var(--sub);font-size:13px}
.one{background:var(--card);border-left:4px solid var(--acc);padding:12px 16px;border-radius:6px;font-size:17px;font-weight:bold;margin:16px 0}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:14px 0}
section h3{margin:0 0 10px;font-size:16px;color:var(--acc)}
ol.pts{margin:0;padding-left:22px}
ol.pts li{margin:4px 0}
.mm{width:100%;height:auto;display:block}
.mm text{font-family:"Microsoft JhengHei","PingFang TC",sans-serif;fill:var(--ink)}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:0}
.step{border:1px solid var(--line);border-radius:10px;padding:8px 14px;background:var(--b3);display:flex;gap:12px;align-items:flex-start}
.step .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--acc2);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.step b{display:block}
.step small{color:var(--sub);font-size:13px}
.arrow{text-align:center;color:var(--acc2);line-height:1;font-size:18px;padding:2px 0}
.verse{border-left:3px solid var(--acc2);padding:6px 12px;margin:8px 0;background:var(--b2);border-radius:4px}
.verse cite{display:block;font-style:normal;font-size:12px;color:var(--sub);margin-top:2px}
.gold{padding:6px 12px;margin:8px 0;background:var(--b4);border-radius:4px}
.gold::before{content:"✦ ";color:var(--acc)}
.fb{white-space:pre-wrap;line-height:1.9;font-size:15.5px;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:14px 16px}
.fbbar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.fbbar small{color:var(--sub)}
.copy{border:none;background:var(--acc2);color:#fff;padding:5px 14px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:13px}
.src{font-size:12px;color:var(--sub);margin-top:24px}
.src a{color:var(--sub)}
.back{display:none}
@media (max-width:800px){
 .layout{grid-template-columns:1fr}
 #list{position:static;height:auto;border-right:none}
 body.detail #list{display:none}
 body:not(.detail) main{display:none}
 .back{display:inline-block;margin-bottom:6px}
 main{padding:12px 16px 40px}
}
</style>
</head>

"exalted-horn-of-psalm-148":{
one:"詩篇148篇呼召天地萬物讚美神，因為祂為百姓興起了「拯救的角」——耶穌。",
pts:["詩篇150篇分為：導言（1–2）、五卷、結語（146–150），整本書用詩重述整個聖經故事。","詩1描繪喜愛律法、像生命樹的人；詩2應許大衛家的王、神的兒子、彌賽亞。","第1–2卷講大衛家；第3卷講被擄與王室衰敗；第4–5卷重燃彌賽亞盼望。","結語五篇都以「哈利路亞」開始和結束；哈利路亞是「邀請別人讚美耶和華」。","詩148先呼召天上萬有讚美，再呼召地上萬有讚美，呼應創1:1的「天地」。","「高舉的角」源自公牛勝利時昂起的角，象徵從壓迫中得勝；哈拿之歌求神高舉受膏者的角。","馬利亞與撒迦利亞的歌接續這主題：神在大衛家興起拯救的角。"],

"exile-in-the-bible-ethic-of-loyalty-and-subversion":{
one:"面對壓迫，「流亡之道」既不屈從也不反擊，而是以忠誠的愛來顛覆。",
pts:["面對霸凌，人常有兩種本能：放棄妥協（逃），或報復反擊（戰）。","聖經提供第三條路：扎根於愛與智慧的「流亡之道」。","主前587年巴比倫毀滅耶路撒冷，以色列人被擄到敵人的城市。","耶利米要百姓定居、蓋房、栽種、成家，並為巴比倫城求平安。","但以理與三友服事巴比倫王，卻拒絕拜偶像、不停止禱告，也不咒詛王——非暴力的忠誠。","耶穌在羅馬統治下同樣如此：呼召稅吏馬太與奮銳黨西門，教人愛仇敵。","祂潔淨聖殿、批評腐敗領袖，卻不傷人；最後捨命，以愛勝過敗壞的權勢。"],

flow:[["遇到霸凌","個人或制度性的壓迫"],["拒絕兩種本能","不逃避妥協，也不暴力報復"],["以愛重建","像耶利米：為所在的城市求平安"],["忠誠地抵抗","像但以理：服事卻不妥協信仰"],["跟隨耶穌","以捨己的愛顛覆不義的權勢"]],
v:[["耶利米書 29:7","我所使你們被擄到的那城，你們要為那城求平安，為那城禱告耶和華；因為那城得平安，你們也隨著得平安。"],["路加福音 6:27-28","你們的仇敵，要愛他！恨你們的，要待他好！咒詛你們的，要為他祝福！凌辱你們的，要為他禱告！"]],

mc:"團契 koinonia",

"god-name-many-actually":{
one:"聖經用許多稱號稱呼神，但這些稱號都指向同一位有名字的神——耶和華，並在耶穌身上完全顯明。",
pts:["神向人啟示時，使用那個時代的語言、觀念與文化；許多稱號是回應迦南人的宗教觀念。","El 是古閃族對「神」的稱號；Elohim 是較長的形式，舊約用了兩千多次。","變化形式：El Elyon（至高神）、El Shaddai（全能的神）。","「神」是頭銜不是名字；舊約承認有其他受造的靈界存在，如巴力、基抹。","以色列神的名字是 Yahweh（耶和華），首次向摩西啟示，意思是「祂將是」——永恆的創造者。","後來猶太人出於敬畏不唸這名字，改讀 Adonai（主）；文士把 Adonai 的母音加在 YHWH 上，歐洲學者誤讀成 Jehovah。","新約作者相信耶穌就是耶和華的具體化身，透過祂我們能認識神的名。"],

flow:[["多種稱號","讀舊約時發現神有很多稱呼"],["El / Elohim","通用的「神」的頭銜"],["Yahweh","以色列的神有獨特的名字"],["敬畏而不唸","改讀 Adonai，後來產生 Jehovah"],["在耶穌裡","我們能親自認識神的名"]],
v:[["出埃及記 3:14","神對摩西說：我是自有永有的。又說：你要對以色列人這樣說：那自有的打發我到你們這裡來。"],["創世記 17:1","耶和華向他顯現，對他說：我是全能的神。你當在我面前作完全人。"]],

"how-does-jesus-fulfill-law":{
one:"耶穌「成全」律法和先知，不只是遵守條文，而是完成整個故事、並教人用愛把律法「填滿」。",
pts:["太5:17說的是「律法和先知」——指整本希伯來聖經，不只是613條誡命。","「成全」可理解為「填滿」：比單純遵守更深。","第一層：耶穌完成了舊約的故事。希律殺嬰像法老、逃往埃及又回來像摩西、受洗過約旦河、曠野受試探——別人失敗的地方，祂通過了。","第二層：登山寶訓教導一種「義」——與神、與人的正確關係，讓跟隨者也能填滿律法。","例子：「不可殺人」——不殺人只填了一部分；愛人才是把它填滿。","律法若脫離整個聖經故事來讀，容易變成外表虔誠、內心仍懷恨。","總綱：盡心愛神、愛人如己；「你們願意人怎樣待你們，你們也要怎樣待人」就是律法和先知。"],

"how-does-the-bible-explain-suffering":{
one:"咒詛是人用自己的方式奪取祝福的後果；耶穌選擇信靠神，扭轉了咒詛。",
pts:["聖經的「祝福」指生命的興旺與增長；「咒詛」是神任憑人承受自己奪取祝福的後果：匱乏、孤立、死亡。","創1：神祝福動物與人「生養眾多」，並讓人代表神治理世界。","祝福以信靠神為條件；蛇誘惑人相信自己的判斷，人就落入咒詛。","神咒詛蛇和地，卻沒有咒詛人；但人承受咒詛的影響。神也應許女人的後裔要勝過蛇。","亞伯拉罕家族本該帶來祝福，卻一再「搶」祝福：夏甲、立王、大衛奪人妻——帶來更多咒詛，最後被擄。","耶穌在曠野拒絕捷徑，在客西馬尼園說「不要從我的意思」，在十字架上讓咒詛落在自己身上；神使祂復活。","在「已然未然」之間：我們仍經歷痛苦，但靠聖靈饒恕、愛仇敵、抵抗不義，參與扭轉咒詛；最終「再沒有咒詛」。"],
mc:"祝福與咒詛",
mind:[["定義",["祝福：生命興旺","咒詛：自取的後果"]],["起源",["創1的祝福","分別善惡樹","蛇的欺騙"]],["咒詛的影響",["地受咒詛","生育與關係受苦","死亡"]],["以色列的故事",["亞伯拉罕被揀選","一再搶奪祝福","被擄"]],["耶穌扭轉",["曠野拒絕捷徑","客西馬尼的順服","復活"]],["在其間生活",["饒恕與愛仇敵","帶著盼望哀哭","再沒有咒詛"]]],
flow:[["神的祝福","創造、興旺、治理"],["人奪取祝福","不信神，以自己方式定義善惡"],["咒詛蔓延","暴力、匱乏，連選民也落入其中"],["耶穌選擇祝福","信靠神的旨意，承擔咒詛"],["祝福擴展","藉聖靈，我們成為祝福的管道"]],
v:[["創世記 12:3","為你祝福的，我必賜福與他；那咒詛你的，我必咒詛他。地上的萬族都要因你得福。"],["馬可福音 14:36","阿爸，父啊！在你凡事都能；求你將這杯撤去。然而，不要從我的意思，只要從你的意思。"],["啟示錄 22:3","以後再沒有咒詛。"]],
g:["祝福是要領受的禮物，不是靠自己搶來的。","我們的盼望不是一句「凡事都有原因」，而是與耶穌一同哀哭，又確信咒詛終將結束。"]},

"how-does-the-bibles-story-lead-to-jesus":{
one:"整本舊約一再重演伊甸園的故事，引發人等候那位不會失敗的拯救者——耶穌。",
pts:["以馬忤斯路上，復活的耶穌從摩西、先知和詩篇講解經上指著祂的話。","關鍵在創1–3：神的祝福、人照自己的方式統治、被逐出伊甸、以及創3:15「女人的後裔」的應許。","神的兩難：放棄人就不是愛，忽視罪就不是公義。","挪亞：義人帶家人穿過洪水，卻在葡萄園喝醉、赤身——伊甸重演。","摩西：為百姓代求很像拯救者，後來也照自己的意思行事。以色列：享有祝福卻背約，被擄。","以賽亞描繪一位以受苦和捨己之愛得勝的僕人。","耶穌在客西馬尼園做了亞當沒做到的選擇；在以馬忤斯擘餅後，門徒的眼睛「開了」——逆轉了伊甸的盲目。"],
mc:"聖經故事指向耶穌",

"how-do-we-make-sense-of-the-book-of-genesis":{
one:"創世記分四個樂章，每個樂章追蹤一個主題，最後總結為：人意要害，神意為善。",
pts:["聖經是古代近東的文學，現代讀者常覺得難懂，這是正常的。","「樂章」是把一組故事或詩編在一起、形成有意義的整體。","樂章一（創1:1–11:26）亞當到挪亞：追蹤「神的靈 ruakh」——風、氣息、賜生命的能力；人的反叛一路擴大到巴別。","樂章二（11:27–25:18）亞伯拉罕：追蹤「生命樹」意象；神與亞伯拉罕立約，透過他的家族祝福萬國。","樂章三（25:19–37:1）以撒與雅各：追蹤「祝福與咒詛」；雅各靠詭計搶祝福，最後在與神摔跤受傷後才領受祝福，改名以色列。","樂章四（37:2–50:26）雅各的兒子：追蹤「流放」；約瑟被賣到埃及，後來拯救全家。","創50:20總結整卷：人的惡意擋不住神的美意（tov）。"],
mc:"創世記四樂章",
mind:[["樂章一：亞當到挪亞",["主題：神的靈","創造與反叛","洪水與巴別"]],["樂章二：亞伯拉罕",["主題：生命樹","立約","萬國得福"]],["樂章三：以撒與雅各",["主題：祝福與咒詛","雅各的詭計","與神摔跤"]],["樂章四：約瑟",["主題：流放","被賣到埃及","拯救全家"]],["總結",["創50:20","神的美意 tov"]]],
flow:[["創1–11","神創造美好世界，人反叛，災難擴大"],["創12–25","神揀選亞伯拉罕，應許祝福萬國"],["創25–37","雅各從詭詐到被神改變"],["創37–50","約瑟的苦難成為拯救"],["未完待續","亞伯拉罕家族在埃及，應許尚待成就"]],

pts:["「神記念」第一次出現在洪水故事中央（創8:1），是整個故事從混亂轉向新創造的轉捩點。","洪水故事呈對稱結構，「神記念挪亞」位於正中心；接著神的風（ruakh）吹過水面，如同創造之初。","神記念的是創3:15的應許：要差一位拯救者來醫治受造界。","同樣模式重複出現：所多瑪——「神記念亞伯拉罕」救出羅得；出埃及——「神記念祂的約」，摩西也是從方舟（tebah）得救。","模式：人的惡到達極點→神看見並憂傷→神記念→看似反創造的審判中，開出拯救之路。","詩人和先知常問「神忘了我們嗎？」以賽亞說神像母親不忘懷中的嬰孩。","路加福音：撒迦利亞（名字意為「神記念」）與馬利亞都頌讚神記念祂的約；耶穌受洗時聖靈如鴿子降下，呼應挪亞的鴿子。"],

one:"以賽亞書40–55章揭示：神要藉一位被棄絕、受苦而死、又復活的僕人來拯救以色列和萬國。",
pts:["賽1–39以希西家失敗、被擄預言作結；賽40以「安慰我的百姓」開啟新希望。","神要穿越曠野回到錫安，像牧人懷抱羊羔帶領百姓歸回。","但以色列仍苦毒，覺得被神遺忘；賽41–47像一場法庭辯論：神以古列興起、被擄的原因、巴比倫傾覆為證據。","神要以色列作祂的「僕人」、作外邦人的光，但賽48指出他們仍拜偶像，無法勝任。","一位新的、被聖靈膏抹的僕人出現（賽48:16、49章），被稱為「以色列」，卻被本國人藐視。","賽52:13–53:12：「我們」原以為他被神擊打，後來才明白他是為我們的罪受苦，像贖愆祭；死後又「看見後裔」、得以稱許多人為義。","這是創3:15的發展：女人的後裔讓邪惡勝過自己，再以愛和生命勝過死亡——這就是「福音」。"],

"jesus-gods-forgiveness-meaning-matthew-614-15":{
one:"不饒恕人，顯示我們還沒真正敞開心領受神的饒恕；饒恕是一個需要時間的醫治過程。",
pts:["太6:14-15聽起來像「你不饒恕，神就不饒恕你」，但重點不是神拒絕饒恕。","饒恕需要誠實面對情緒，也需要時間；神不要求我們立刻原諒重大傷害。","不饒恕的僕人比喻（太18）：被免了天文數字的債，卻不肯免同伴小小的債——心沒有被恩典改變。","每個人都參與了世界的敗壞，都欠了還不起的債；神憐憫地「放下」（希臘文 aphiemi）我們的過犯。","不饒恕會產生怨恨，像牢籠困住自己；研究也顯示它影響身心健康。","饒恕不等於和好：嚴重傷害需要對方承認並改變；太18:15教導先私下指出、再請人同去、再告訴教會。","「當外邦人和稅吏」不是驅逐——耶穌正是愛他們、與他們同桌的；神的公義在十字架上與饒恕合一，祂要更新世界而非毀滅。"],

"keeping-the-sabbath-is-it-still-relevant-to-christians-today":{

pts:["希伯來文 ga'al（救贖）與 go'el（至近親屬救贖者）在路得記中反覆出現。","go'el 是近親，當家人因貧窮賣掉人或地時，負責贖回（利25:25-28）。","拿俄米失去丈夫、兒子、土地，說「不要叫我拿俄米（甜），要叫我瑪拉（苦）」，卻沒看見身旁忠心的路得。","路得去拾穗（利19:9-10的律法保護窮人與寄居者），「恰巧」進入波阿斯的田；波阿斯慷慨待她。","收割結束，波阿斯卻沒有行動；拿俄米設計讓路得夜裡到禾場——非常危險的一步。","路得主動說「求你用衣襟遮蓋我，因為你是至近的親屬」，提醒波阿斯的責任；波阿斯正直地處理，贖回土地並娶路得。","他們的兒子俄備得是大衛的祖父；伯利恆（餅之家）也是耶穌出生之地。路得的捨己與波阿斯的救贖，指向耶穌。"],

"rosh-hashanah":{
one:"吹角節（猶太新年）不是要你變成新的人，而是提醒你想起自己原本是誰——神所愛、蒙召與祂一同掌權的人。",

one:"神選擇透過倚靠祂的軟弱者來治理世界；承認需要、向神呼求，就是勝過仇敵的保障。",
pts:["詩8描寫耶和華是創造之王，讓需要倚靠祂的人成為祂的王室夥伴。","太21：耶穌騎驢進耶路撒冷，潔淨被商業化的聖殿，醫治瞎子瘸子，孩子們喊「和散那歸於大衛的子孫」。","祭司長不滿，耶穌引用詩8:2回應——他們也知道下一句是「使仇敵閉口」，暗指他們站在神的對立面。","耶穌引用的是七十士譯本「完全了讚美」，希伯來原文是「建立了能力（保障）」。","讚美＝承認神是王，並表達倚靠；嬰孩最懂得這點。「和散那」的意思是「求你拯救」。","保障＝保護人免受仇敵的地方：耶穌清出聖殿，讓弱小的人可以來到神面前。","彼前5:7：把憂慮卸給神就能勝過仇敵。耶穌成為軟弱的嬰孩、被釘十架，卻藉此勝過仇敵，萬物服在祂腳下（詩8:6）。"],

"sin-iniquity-and-transgression-in-the-bible":{

"teaching-and-signs-in-the-bible":{
one:"教導與神蹟有同一個目的：引導人信靠神；耶穌是最終的神蹟，而信靠祂的人也成為活的記號。",
pts:["徒2:42-43中「使徒」出現兩次：一次與教訓相連，一次與神蹟相連——這是平行結構，暗示兩者相關。","希伯來文「神蹟／記號」'ot：用於警告、審判、拯救（出埃及）、標記聖約與聖日（安息日、割禮），以及以馬內利的預兆。","所有記號的共同點：都指向神，教人認識並單單倚靠祂。","耶穌是最終的記號：祂承擔審判、成全聖約、開啟永遠的安息，祂的死與復活證明祂的信息可信。","每個人都蒙召傳講神的故事；方法包括默想、背誦、公開讀經、在生活節奏中教導兒女、紀念物與節期。","但若信靠儀式本身就失去重點。今日神仍可使用神蹟，但我們信靠的是耶穌，不是神蹟。","信靠耶穌、領受聖靈的人，自己就成為讓世界認識耶穌的活記號。"],
mc:"教導與神蹟",

"the-apocalypse-of-jesus":{
one:"馬可福音是一部「啟示」：分三幕，每一幕都揭示耶穌是那位受膏的君尊祭司。",
pts:["「啟示」（apokalupto）意為「揭開、顯露」，不是世界末日。","馬可福音分三幕：加利利、路上、耶路撒冷；每一幕都有一個揭示耶穌身分的場景。","第一幕——受洗：天「裂開」，聖靈降下，聲音結合了創22（亞伯拉罕的兒子）、詩2（大衛的王子）、賽42（受苦的僕人）。","受洗像祭司用水與油被分別為聖；接著耶穌赦免癱子的罪——以自己的權柄做祭司的事。","第二幕——登山變像：六天、高山、雲彩、發光的衣服，呼應摩西在西奈山與大祭司的聖衣。","第三幕——受審與十架：耶穌向大祭司該亞法承認自己是但以理書7章與詩篇110篇的人子；十架上黑暗籠罩，羅馬百夫長說「這人真是神的兒子」。","馬可福音原本結束在婦女驚慌逃跑——或許是故意的，留給讀者回應：你要如何面對這個啟示？"],
mc:"耶穌的啟示",
mind:[["啟示的意思",["揭開、顯露","不是世界末日"]],["第一幕：受洗",["天裂開","三段經文的結合","赦免癱子"]],["第二幕：變像",["高山與雲彩","發光的衣服","摩西與以利亞"]],["第三幕：十架",["該亞法審問","人子的宣告","百夫長的認信"]],["突然的結尾",["空墳墓","婦女驚慌","讀者的回應"]]],
flow:[["加利利","受洗，被膏立為君尊祭司"],["路上","登山變像，如發光的大祭司"],["耶路撒冷","受審，宣告自己是人子"],["十字架","外邦百夫長認出神的兒子"],["空墳墓","把問題留給讀者"]],
v:[["馬可福音 9:7","有一朵雲彩來遮蓋他們，也有聲音從雲彩裡出來，說：這是我的愛子，你們要聽他。"],["馬可福音 14:62","耶穌說：我是。你們必看見人子坐在那權能者的右邊，駕著天上的雲降臨。"],["馬可福音 15:39","對面站著的百夫長看見耶穌這樣喊叫斷氣，就說：這人真是神的兒子！"]],
g:["你會像門徒一樣逃跑，還是認出被釘的耶穌就是王？"]}

pts:["徒1:9耶穌被「取上升」、被雲彩接去；升天是兩千年來信經的核心信念。","希伯來文「天」shamayim 是天空，「地」ehrets 是陸地；天是神的空間，地是人的空間，兩者本應完全重疊。","聖經作者常用地理位置表達超越的實在：神在「上面」，陰間在「下面」。","伊甸是「宇宙之山上的園子聖殿」：亞當夏娃上到神面前領受話語與生命，再下去把它擴展到全地。","摩西與長老上西奈山，在神面前吃喝；大祭司在贖罪日先獻祭，再進入幔子內——先獻祭，後上升。","以色列人總是「上」耶路撒冷，唱上行之詩。","耶穌上耶路撒冷、被舉在十架上、從死裡復活、升天——呼應但以理書7章人子登基；祂先獻上自己為祭，再上升，成為天地合一的新人類。我們在基督裡也蒙召「上升」：讓神的旨意行在地上。"],

"the-larger-story-of-exodus":{
one:"出埃及記是一場奴役與自由的爭戰：神的祝福勝過人的邪惡，但最大的威脅最後竟是以色列自己。",
pts:["出埃及記屬於一個更大的故事，也是耶穌的故事、我們的故事。","樂章一：法老因以色列人「生養眾多」（呼應創1:28）而感到威脅——他要人成為他的財產，寧可他們死也不要他們自由。","奴役與自由的爭戰從創世記就開始：人被逐出伊甸，神應許透過亞伯拉罕恢復祝福。","神聽見哀聲而「下來」拯救；摩西在燃燒的荊棘中蒙召，神應許與他同在。","十災對抗法老與埃及的神；過紅海後有聖經第一首讚美詩「海之歌」（出15）。","樂章二：在西奈山，神邀請以色列立約成為「祭司的國度」。","樂章三：會幕是可攜帶的小伊甸；但百姓造金牛犢，摩西代求，神重申自己的慈愛（出34:6-7）。最後榮光充滿會幕，摩西卻不能進去——留待利未記。"],
mc:"出埃及記的大故事",

"were-adam-and-eve-priests-eden":{

pts:["創1以七日完成：古代聖殿都以七日儀式奉獻，讀者會立刻明白「創造就是神的聖殿」。","會幕與聖殿三部分（至聖所、聖所、外院）對應宇宙：宇宙是大聖殿，聖殿是小宇宙。","古人在神廟中心放神像；神把人放在宇宙聖殿中，作祂的「形像」（tselem）。","伊甸是會幕的原型：生命樹＝燈臺；分別善惡樹＝約櫃中的律法；入口朝東、位在山上。","神在園中「行走」用的動詞形式，也用於神在會幕中與人同在。","創2:15「修理看守」：'abad（工作／事奉／敬拜）與 shamar（看守／遵守），兩字並用時多指利未人與祭司在聖殿的職責。","亞當夏娃失敗被逐，但有「女人後裔」的應許；耶穌建立新的祭司國度，將來在新的園子中，人要再次事奉、掌權。"],

"what-are-rewards-heaven-bible":{
one:"天上的賞賜不是死後的豪宅或金冠，而是現在就能經歷的平安、無懼的愛、智慧與醫治。",
pts:["太6:20「積攢財寶在天上」是邀請我們現在就嚐到將來更新世界的生活。","耶穌示範了充滿天上賞賜的人生：公義、仁慈、誠實、慷慨、饒恕、憐憫。","比喻：奧運選手的金牌不是唯一的獎賞，整段旅程本身就是獎賞。","把賞賜想成金牌，容易變得自我中心、只想著將來。","伊甸園有足夠的食物、生命樹白白賜下——不必競爭，這就是天國的生活方式。","永生就是認識獨一真神和耶穌基督（約17:3）；神的目標是把天帶到地上，而非把人帶離地球。","人的財寶終會失去，只是時間早晚；照耶穌的方式行出的每個愛的行動，都有永恆的價值。"],

one:"福音書不只是傳記，而是「好消息」的宣告：耶穌是彌賽亞、是世界的主，並要求讀者回應。",
pts:["「福音」來自希臘文 euangelion，意為好消息；耶穌與保羅都取自以賽亞書52章「報好信」的詩。","福音書既記述歷史，也要說服讀者承認耶穌為主、成為門徒。","特徵一：大量引用舊約——直接引用、隱約暗示、敘事平行（例如馬太把耶穌寫成比摩西更大的那一位）。","特徵二：透過神蹟、教導、各種人物的反應（門徒、鬼魔、彼得、大祭司、彼拉多、百夫長）塑造耶穌的身分。","特徵三：十架與復活是整個聖經故事的高潮（馬可用6章寫最後7天）。","特徵四：重新編排事件以凸顯不同面向——馬太：新摩西與天地之王；馬可：被誤解、被釘的彌賽亞；路加：福音傳向萬國；約翰：神成為人，賜永生。","讀法：找重複的字詞與主題；留意人物如何回應耶穌，問自己像誰；反覆閱讀。"],

"what-does-faith-without-works-dead-mean-james-214-26":{
one:"雅各談的不是有沒有信心，而是信心是活的還是死的：沒有愛的行動，信心就像落空的承諾。",
pts:["比喻：媽媽答應週末來接孩子卻沒出現——沒有行動的承諾就死了。","死的信心一：偏心——禮遇富人、冷落窮人（雅2:1-4），與信靠榮耀的主不相容。","死的信心二：對缺衣缺食的弟兄說「願你穿暖吃飽」卻什麼都不給——溫暖的話配上冰冷的行為。","死的信心三：鬼魔也信神只有一位（呼應示瑪禱文），卻戰驚——觀念正確卻完全失落。","活的信心：亞伯拉罕（富有的希伯來族長）獻以撒，信心與行為一同運作；中間也有靠自己的「死信心」時刻（夏甲）。","喇合（迦南的妓女）冒險接待探子——兩人代表社會兩極，合起來代表所有信靠神的人。","雅各與保羅並不衝突：保羅說的「律法的行為」是割禮、飲食等界線記號；兩人說的都是改變整個生活的活信心。"],
mc:"活的信心",

"what-does-isaiah-4031-wings-eagles-verse-mean":{
one:"「等候耶和華」不是被動地乾等，而是主動回想神是誰、做過什麼，從記憶中得著新力。",
pts:["賽40:31：等候耶和華的必從新得力，如鷹展翅上騰。","「等候」qavah 與 qav（繩索）相關：像拉緊的繩子，期待張力被釋放——也譯作「盼望」。","受苦時視野會縮小到眼前，人就忘記神過去的作為。","背景：被擄巴比倫的以色列人說「我的道路向耶和華隱藏」（賽40:27），以為神不在乎或無能。","先知反問「你豈不曾知道？豈不曾聽見？」——健忘的不是神，是以色列；整章都在提醒神是誰。","這是「記憶之詩」：用詩觸動情感、重塑想像，不只是冷冰冰的回顧。","「如鷹展翅」呼應出19:4神如鷹背負以色列；但這裡以色列成了鷹——等候神的人變得像創造主一樣不疲乏。"],
mc:"如鷹展翅",
mind:[["qavah 等候",["繩索拉緊","期待與盼望","不是被動"]],["苦難的影響",["視野縮小","忘記神","失去身分"]],["賽40的背景",["被擄巴比倫","以為被神遺忘"]],["先知的回應",["你豈不曾知道","神是創造主","列國如虛無"]],["記憶之詩",["觸動情感","重塑想像"]],["如鷹展翅",["出19:4的回聲","以色列成為鷹","不疲乏不困倦"]]],
flow:[["疲憊與絕望","被擄的百姓以為神忘了他們"],["神的提醒","你豈不曾知道？豈不曾聽見？"],["回想","創造與出埃及的作為"],["等候 qavah","帶著記憶盼望神再次行動"],["從新得力","如鷹展翅，奔跑不困倦"]],
v:[["以賽亞書 40:31","但那等候耶和華的必從新得力。他們必如鷹展翅上騰；他們奔跑卻不困倦，行走卻不疲乏。"],["以賽亞書 40:28","你豈不曾知道嗎？你豈不曾聽見嗎？永在的神耶和華，創造地極的主，並不疲乏，也不困倦。"],["出埃及記 19:4","我向埃及人所行的事，你們都看見了；且看見我如鷹將你們背在翅膀上，帶來歸我。"]],
g:["安慰扎根於記憶。","等候不是放空，而是用神過去的信實餵養今天的盼望。"]},

one:"「不要害怕，我與你同在」原是對被擄以色列的應許；神的幫助不只是救人脫離困境，也是使人成為照亮列國的光。",

mc:"不要害怕",

pts:["詩23被安排在詩22與24之間，這兩篇都講神作王。","古代的王常被比作牧人；但法老、以西結書中的壞牧人、甚至大衛都曾濫用權力——詩23要呈現真正的好牧者。","出埃及的模式：出來（脫離壓迫）→經過（曠野）→進入（應許之地）；詩23特別取用後兩段。","「我必不致缺乏」呼應曠野四十年「一無所缺」（申2:7）；「可安歇的水」呼應神為以色列找「安歇之處」；「引導」呼應紅海之歌。","「死蔭的幽谷」（tsalmavet）在耶2:6用來形容曠野；牧者的「杖」（shevet）也是王的權杖，用來施行公義。","「在敵人面前擺設筵席」呼應詩78「神豈能在曠野擺設筵席？」；「恩惠慈愛隨著我」的「隨著」原是敵人「追趕」的字。","三個信心宣告：我必不缺乏、我不怕遭害、我要住在耶和華的殿中。耶穌說「我是好牧人，為羊捨命」。"],

one:"民數記是一場曠野求生記：獲得自由的以色列人能否學會信靠神，走進應許之地？",
pts:["書名來自兩次人口普查：出埃及的一代，以及他們死後的下一代。","以色列人在埃及為奴430年，剛獲自由，又累又怕；神在西奈山與他們同住一年，教他們如何與神、與人相處。","第一部分（1–12章）準備出發：會幕安置在營地正中央——神要在曠野中天天與他們同在。","但百姓抱怨、嫌棄嗎哪，甚至懷念埃及的韭菜、西瓜和黃瓜。","第二部分（13–25章）拒絕進入：十二個探子中十個報惡信，百姓以為神要藉巨人殺他們；只有迦勒與約書亞相信。","神照他們所說的：這一代在曠野漂流四十年直到死去，但下一代仍有盼望。","第三部分（26–36章）準備進入：新一代在約旦河邊，再次普查、分地、領受律法，確保新地不像埃及那樣壓迫人。"],

"what-hagar-and-ishmaels-story-reveals-about-gods-purposes":{
one:"夏甲被亞伯拉罕和撒拉當作工具，神卻看見她、聽見她，並給她和以實瑪利美好的應許——神的愛超越「我們」和「他們」的界線。",
pts:["夏甲的名字與希伯來文 hagger（外人）諧音；她是埃及女奴，在聖經中是「他者」。","撒萊等不及神的應許，叫夏甲作代孕——在古代很普遍，卻不符合創1–2的平等設計；他們從不叫她的名字，只稱「使女」。","夏甲懷孕後輕看撒萊，撒萊苦待（'anah）她，她逃到曠野。神的使者要她回去——不是說受虐是對的，而是在當時唯一能保全她生產的處境中保護她。","撒萊的「苦待」預示了後來埃及「苦待」以色列人（創15:13，同一個字）——這是對自認蒙揀選者的警告。","神聽見她的苦情，叫她給兒子取名以實瑪利（神聽見）；夏甲稱神為「看顧人的神」（El Roi）——她是聖經中唯一為神命名的人。","神應許以實瑪利也要成為大國，他也受了割禮；撒拉後來要趕走他們，亞伯拉罕只給一點餅和一皮袋水。","在曠野中神再次聽見孩子的聲音，開了夏甲的眼睛看見水井；此後她不再被稱為「使女」——這是她的出埃及。"],
mc:"夏甲與以實瑪利",
mind:[["夏甲是誰",["埃及女奴","名字意為外人","被當作工具"]],["第一次逃亡",["被撒萊苦待","曠野中遇見神","El Roi 看顧人的神"]],["神的應許",["以實瑪利＝神聽見","成為大國","也受割禮"]],["被趕出",["撒拉的嫉妒","一點餅和一袋水"]],["第二次相遇",["神聽見童子","開眼看見水井","不再是使女"]],["信息",["神不偏待人","打破我們與他們","蒙揀選者的警告"]]],

v:[["創世記 16:13","夏甲就稱那對他說話的耶和華為看顧人的神。因而說：在這裡我也看見那看顧我的嗎？"],["創世記 21:17","不要害怕，神已經聽見童子的聲音了。"],["創世記 21:19","神使夏甲的眼睛明亮，他就看見一口水井，便去將皮袋盛滿了水，給童子喝。"]],

"what-happens-when-we-read-bible-together":{
one:"聖經原本是設計給群體一起朗讀、聆聽的；只有獨自閱讀，常會錯過神要說的話。",
pts:["獨自安靜讀經只有幾百年歷史；此前人們是聽人朗讀，或看教堂裡的圖畫。","第一次公開讀經：打敗亞瑪力人後，神要摩西寫下來並念給約書亞聽。","西奈山上摩西把律法唸給百姓聽並寫下；每七年住棚節，男女老幼和寄居者都要聚集聽律法。","約書亞死後不再聚集聽神的話，結果出現「不認識耶和華」的一代（士2:10）。","約西亞重新發現律法書，帶來復興；以斯拉與尼希米念律法並講明意思。","耶穌在會堂讀以賽亞書開始祂的使命；保羅常要教會公開宣讀他的書信。","每個人的視角都有限——這是好事，因為我們需要彼此；就像合唱曲不該只由一人獨唱。"],
mc:"一起讀聖經",
mind:[["歷史背景",["印刷術之前","聽讀與圖像","群體的文學"]],["舊約",["摩西寫下並朗讀","每七年聚集聽律法","約西亞與以斯拉的復興"]],["遺忘的代價",["不認識耶和華的一代"]],["新約",["耶穌在會堂讀經","保羅的書信公開宣讀"]],["為何要一起讀",["每人視角有限","互相學習","跨文化、跨傳統"]],["實踐方式",["聚會中朗讀","讀歷代解經","與不同背景的人對話"]]],
flow:[["寫下","神要摩西把故事寫下"],["朗讀","在群體中大聲念出"],["遺忘","停止聚集讀經，世代忘記神"],["復興","約西亞、以斯拉重新朗讀律法"],["今天","個人讀經之外，也要一起讀、一起談"]],
v:[["申命記 31:12","要招聚他們男、女、孩子，並城裡寄居的，使他們聽，使他們學習，好敬畏耶和華—你們的神，謹守遵行這律法的一切話。"],["尼希米記 8:8","他們清清楚楚的念神的律法書，講明意思，使百姓明白所念的。"],["提摩太前書 4:13","你要以宣讀、勸勉、教導為念，直等到我來。"]],

"what-is-pentecost-and-why-is-it-important":{
one:"五旬節時，神的火不再降在山上或聖殿，而是落在每個人身上——神的新聖殿是由人組成的教會，新世界由此開始。",
pts:["Pentecost 是希臘文「第五十」，也是猶太人的收割節（七七節，Shavu'ot），在逾越節後五十天。","舊約中，風與火總是與神的同在和聖殿有關：燃燒的荊棘、西奈山的雷電火焰、會幕上的火柱、聖殿中的榮光。","徒2：響聲如大風充滿屋子，舌頭如火焰落在「各人」頭上——聖殿現在是由人組成的。","耶穌復活後講論神的國；門徒問「是復興以色列國的時候嗎？」耶穌說要等候聖靈，並在地極作祂的見證。","神的國不是靠暴力，而是靠慈愛與饒恕來終結邪惡。","萬國的猶太人來耶路撒冷過節，門徒忽然能說各國的語言——全世界來到他們面前。","呼應以賽亞「你們是我的見證」「作外邦人的光」：五旬節開啟包容萬民的神的家。"],
mc:"五旬節",
mind:[["節期背景",["第五十天","七七節","收割節"]],["風與火",["燃燒的荊棘","西奈山","會幕與聖殿"]],["新的聖殿",["火落在各人頭上","由人組成","教會誕生"]],["神的國",["慈愛與饒恕","不是暴力"]],["方言",["各國的語言","萬國來到耶路撒冷"]],["以賽亞的應許",["你們是我的見證","外邦人的光"]]],
flow:[["舊約的火","神的同在標記聖殿"],["耶穌的應許","等候聖靈，作我的見證"],["五旬節","風與火降臨在每個人身上"],["萬國聽見","門徒說出各國的語言"],["新世界","教會成為天地交會之處"]],
v:[["使徒行傳 1:8","但聖靈降臨在你們身上，你們就必得著能力，並要在耶路撒冷、猶太全地，和撒馬利亞，直到地極，作我的見證。"],["使徒行傳 2:2-3","忽然，從天上有響聲下來，好像一陣大風吹過，充滿了他們所坐的屋子；又有舌頭如火焰顯現出來，分開落在他們各人頭上。"]],
g:["神的聖殿不再是一座建築，而是一群活出耶穌之愛的人。"]}
});

"what-is-the-sermon-on-the-mount":{
one:"登山寶訓中，耶穌以新摩西的身分，把律法「填滿」，描繪一個靠愛而非武力更新世界的神的國。",
pts:["登山寶訓（太5–7）可能是一次講道，也可能是馬太把耶穌的教導整理成一篇；內容包括「使人和睦的有福」「愛仇敵」。","聽眾是被羅馬壓迫的猶太農民與工人；耶穌上山教導，令人聯想摩西在西奈山。","馬太把耶穌寫成新摩西、也是更大的摩西：祂不要人敬拜自己，眾人卻覺得祂的話有權柄。","摩西教奴隸不靠暴力而靠信靠神得自由；耶穌也說不要用惡的力量對抗惡，而要與神一同創造美善。","六次「你們聽見有話說……只是我告訴你們」：不是推翻律法，而是深化；不殺人只是表面，愛人才是核心。","「義」（dikaiosune）是正確對待所有人；神的國是天地合一、人人以愛相待的世界。","「先求祂的國」：不讓對基本需要的憂慮主導決定；世界的改變來自被更新的心，而不是消滅敵人。"],
mc:"登山寶訓",
mind:[["場景",["上山教導","受壓迫的群眾","聯想西奈山"]],["新摩西",["更大的摩西","有權柄的教導","不靠暴力的拯救"]],["填滿律法",["六個對比","不殺人→愛人","看見內心"]],["神的國",["天地合一","以愛相待","八福"]],["先求祂的國",["不被憂慮主導","正確的關係"]],["世界如何改變",["不是消滅敵人","不是逃到天上","被改變的心"]]],
flow:[["受壓迫的群眾","期待一位拯救者"],["耶穌上山","像摩西一樣頒布教導"],["填滿律法","從行為深入到內心"],["神的國","以愛勝過惡，人人得滿足"],["群眾希奇","這教導有權柄，觸動人心深處"]],

"what-is-the-shema":{
one:"示瑪禱文是以色列的效忠宣誓：聽從並全心愛獨一的耶和華，而不是分心事奉多神。",
pts:["示瑪出自申6:4-5，名稱來自第一個字 shema（聽）；古猶太人早晚結合申11:13-21、民15:37-41一起誦念。","shema 不只是聽見，而是聽了就回應——在希伯來文中，聽與行是同一件事。","「愛」ahavah 不是溫暖的感覺，而是忠誠的行動；對以色列而言就是忠於聖約。","盡心、盡性、盡力：以整個人去愛神。","翻譯問題：古希伯來文沒有「是」這個字，四個字「耶和華 我們的神 耶和華 獨一」可有不同斷句；放在申命記的脈絡，重點是「只有耶和華是我們的神」——效忠宣誓，而非哲學命題。","以色列長期身處多神文化，分心事奉是最大威脅；所以要殷勤教導兒女，繫在手上、戴在額上。","耶穌說示瑪是第一要緊的誡命；啟示錄中神的名在額上，對比獸的印記在手上或額上——效忠決定我們看見什麼、做什麼。"],
mc:"示瑪禱文",
mind:[["來源",["申6:4-5","早晚誦念","猶太人的效忠宣誓"]],["聽 shema",["聽了就行","回應的行動"]],["愛 ahavah",["忠誠的行動","盡心盡性盡力"]],["翻譯",["沒有「是」這個字","強調只有耶和華"]],["多神文化",["埃及與迦南","分心的危險","教導下一代"]],["新約",["耶穌：第一要緊","啟示錄：額上的名","約14:21"]]],
flow:[["聽","讓神的話進入並產生回應"],["認定","只有耶和華是我們的神"],["愛","以全人忠誠地愛神"],["傳承","在日常生活中教導下一代"],["今日","讓對耶穌的忠誠引導我們所見所行"]],
v:[["申命記 6:4-5","以色列啊，你要聽！耶和華—我們神是獨一的主。你要盡心、盡性、盡力愛耶和華—你的神。"],["馬可福音 12:29-31","第一要緊的就是說：以色列啊，你要聽，主—我們神是獨一的主。你要盡心、盡性、盡意、盡力愛主—你的神。其次就是說：要愛人如己。"],["約翰福音 14:21","有了我的命令又遵守的，這人就是愛我的；愛我的必蒙我父愛他，我也要愛他，並且要向他顯現。"]],
g:["在希伯來文裡，聽見和行出是同一件事。","你效忠於誰，就決定了你看見什麼、做什麼。"]},

"what-jesus-meant-turn-other-cheek-matthew-539":{
one:"「轉過另一邊臉」不是要人被動忍受虐待，而是用創意、非暴力的方式翻轉局面，以愛與尊嚴回應惡。",
pts:["「以眼還眼」（lex talionis）原意是建立公義、限制報復，不讓懲罰超過罪行。","耶穌說「不要以同樣方式對抗惡人」：既不暴力報復，也不消極任人宰割。","打右臉＝用手背打，是當時最嚴重的公開羞辱；轉過左臉，對方只能用手掌打——那是對待平輩的方式，等於拒絕被貶低。","被告要拿裡衣，連外衣也給他：以慷慨面對貪婪，也讓對方的冷酷無所遁形。","羅馬兵可強迫人背東西走一里；主動走第二里，是重新掌握主動權、以朋友之道相待。","約瑟對待賣他的哥哥：不報復也不裝沒事，而是試驗他們、給他們悔改的機會，最終饒恕和好。","耶穌被打、被剝衣、背十架，仍為敵人禱告——祂不是無力的受害者。對受虐者而言，離開往往是最智慧、也最有愛的回應；看見不公，要與受害者站在一起。"],
mc:"轉過另一邊臉",
mind:[["以眼還眼",["限制報復","建立公義"]],["第三條路",["不暴力報復","不消極順從"]],["三個例子",["轉臉：拒絕羞辱","給外衣：以慷慨對貪婪","走二里：掌握主動"]],["約瑟",["試驗哥哥","給悔改機會","饒恕和好"]],["耶穌",["被打不還手","為敵人禱告","不是無力的受害者"]],["今日應用",["受虐者可離開","與受害者站在一起","創意的愛"]]],
flow:[["被冒犯","面對羞辱、貪婪或壓迫"],["拒絕兩種本能","不報復，也不退縮"],["創意回應","以尊嚴與慷慨翻轉局面"],["邀請改變","讓對方重新思考自己的行為"],["恢復關係","朝向神起初的和諧與公義"]],
v:[["馬太福音 5:38-39","你們聽見有話說：以眼還眼，以牙還牙。只是我告訴你們，不要與惡人作對。有人打你的右臉，連左臉也轉過來由他打。"],["馬太福音 5:41","有人強逼你走一里路，你就同他走二里。"],["箴言 25:21","你的仇敵若餓了，就給他飯吃；若渴了，就給他水喝。"]],
g:["轉過另一邊臉，是在說：你奪不走我的尊嚴。","不必找出唯一正確的回應，而是用耶穌的樣式訓練想像力。"]},

"what-kind-of-culture-shaped-the-bible":{
one:"讀聖經是一趟跨文化之旅：認識古代作者的文化背景，留意自己的盲點，才能聽見他們真正要說的。",

"what-makes-the-bible-unified":{
one:"聖經雖由多位作者、歷經千年寫成，卻藉重複的字詞、意象與情節織成一個指向耶穌的完整故事。",
pts:["聖經看起來零散甚至矛盾（如箴26:4-5），但用對的眼光讀，會看見深層的合一。","結構：希伯來聖經（TaNaK＝律法 Torah、先知 Nevi'im、著作 Ketuvim），跨越約一千年；新約是一世紀下半葉的猶太文獻：福音書、書信、啟示錄。","連結的方法：創1:1與約1:1都以「太初／起初」開始；伊甸園中人面臨抉擇，客西馬尼園中耶穌也面臨抉擇——前者悲劇，後者帶來盼望。","重複的象徵、字詞、場景、情節與人物，把整本書連在一起。","希伯來聖經的作者包括牧人、改革者、文士、先知；被擄歸回後，一群文士與先知約在主前200–300年完成編輯——編者和作者一樣受聖靈引導。","新約作者與第一代耶穌運動的領袖有關：漁夫、醫生、稅吏、法利賽人；保羅的書信在各教會間傳閱。","舊約累積對神應許實現的期待，新約宣告這期待在耶穌身上實現。"],

"what-matthew-622-23-eye-lamp-body-means":{
one:"「眼睛是身上的燈」是希伯來成語：好眼睛＝慷慨，壞眼睛＝吝嗇——看一個人怎麼用錢，就能看出他的屬靈健康。",
pts:["這句話在登山寶訓中談錢財的段落（太6:19-34），所以要從金錢的角度理解。","希伯來文 tov 'ayin（好眼睛）是「慷慨」：箴22:9「眼目慈善的必蒙福，因他將食物分給窮人」。","ra' 'ayin（壞眼睛）是自私、表面大方實則只顧自己（箴23:6-7）。","馬太用 haplous（單純、真誠）對比壞眼睛；其相反詞 diplous 是「雙重」——表裡不一的動機。新約中 haplotes 常指慷慨。","舊約也用明亮的眼睛代表生命與喜樂，昏暗的眼睛代表衰老與痛苦。","財主與拉撒路：只為自己而活的人就是「壞眼睛」；阿摩司與以西結都揭露以色列的財富常建立在欺壓窮人上。","財富本身不是光也不是暗，愛錢才是黑暗；耶穌用隱喻，是要我們長期默想、從心裡渴望慷慨。"],

"what-matthew-6-33-seek-first-the-kingdom-of-god-means":{
one:"「先求祂的國」是邀請人把愛神愛人放在自我保護之上，相信神最終會供應一切需要。",
pts:["我們鎖門、設密碼，因為世界危險；耶穌也重視安全，但祂把愛神愛人放在一切之上，甚至包括受苦。","想像一個沒有傷害、人人彼此相愛、資源豐足的世界——這就是神的國。","創3：人靠自己的智慧求安全，結果進入一個需要門鎖與武器的世界。","太6:33以「但」開頭：對比憂慮地保護自己，和信靠神供應的兩種世界。","在一世紀，「國」是真實的世界：有王、有百姓、有生活方式；王是好是壞決定百姓的福禍。","「這些東西都要加給你們」是長遠的應許：耶穌自己一生貧窮、受害，但祂從未失去安全感，知道生命在神手中。","徒2的教會示範了在危險世界中活出神國：彼此給予、免於恐懼。保羅面對死亡仍說「死啊，你的毒鉤在哪裡？」"],
mc:"先求祂的國",
mind:[["安全的本能",["門鎖與密碼","保護我和我的"]],["伊甸的抉擇",["靠自己的智慧","進入危險的世界"]],["神的國",["真實的國度","好王帶來生命","天地合一"]],["加給你們",["長遠的應許","耶穌也受苦","生命在神手中"]],["活出神國",["徒2的教會","彼此給予","愛勝過恐懼"]],["盼望",["死的毒鉤在哪裡","我們快到家了"]]],

one:"「不要論斷人」不是禁止分辨是非，而是不要定罪、輕看別人；先除去自己眼中的梁木。",
pts:["希臘文 krino 可指「分辨」，也可指「定罪」；上下文顯示耶穌指的是定罪、輕視他人。","耶穌自己也會分辨並指出錯誤，還教人「憑果子認出他們」，所以不是要人不分是非。","例子：法利賽人西門看見有罪的女人用香膏抹耶穌的腳，心裡定她的罪。","耶穌講兩個欠債人的比喻，指出西門連基本的待客之禮都沒做——像鏡子一樣讓他看見自己。","梁木與刺：大部分教導在講自我反省，最後才談幫助別人。","定罪別人等於扮演神——假裝能看見別人內心；這正是伊甸園裡人「自己定善惡」的老問題。","黃金律（太7:12）：想想自己跌倒時希望別人怎麼對待你，就那樣對待人。"],

"who-has-god-chosen":{
one:"神揀選以色列不是偏愛一族，而是揀選一個群體去祝福萬族——最終在耶穌身上實現，並臨到所有跟隨祂的人。",
pts:["舊約多處稱以色列為神的選民、特作自己的子民。","這引發疑問：神偏心嗎？舊約的神和新約的耶穌矛盾嗎？萬國蒙愛是備用計畫嗎？關鍵問題：以色列被揀選是「為了什麼」？","神揀選亞伯拉罕家族：「地上的萬族都要因你得福」——揀選一個，是為了祝福眾多。","西奈山：以色列要成為「祭司的國度」——祭司是調和兩方的人，這裡是神與萬國。","以色列被揀選不是為了得救本身，而是為了一個使命：以愛、公義和專一敬拜向萬國彰顯神。","以色列一再失敗；以賽亞預言神要興起一位蒙揀選的彌賽亞，作外邦人的光。","耶穌自稱世界的光，接納撒瑪利亞婦人；彼得把「被揀選的族類、君尊的祭司」用在混合的教會身上。"],

"who-is-the-angel-of-the-lord":{
one:"「耶和華的使者」有時像神的代言人，有時就是耶和華自己——這種刻意的張力預備我們理解耶穌與三位一體。",
pts:["希伯來文 malak 意為「使者」；「耶和華的使者」（malak Yahweh）是唯一帶著耶和華名字的使者（出23:20-21「我的名在他裡面」）。","問題：這位使者有時以神的使者身分說話，有時又直接以耶和華的身分說話。","夏甲的故事：使者應許「使你的後裔極其繁多」（通常是神說的話），又說「耶和華聽見了你的苦情」，夏甲卻稱他為「看顧人的神」。","同樣模式出現在燃燒的荊棘、亞伯拉罕獻以撒、巴蘭、基甸、以利亞、大衛等故事中——不是筆誤，而是刻意的文學藝術。","聖經作者故意留下空白，邀請讀者參與與探索。","意義一：幫助理解耶穌說「我與父原為一」，同時又是「子」。意義二：為三位一體預留「書架空間」——神是多元而合一的愛的群體。","意義三：神既超越萬有，又親近人，甚至取了人的形體——這在耶穌道成肉身時達到高峰。"],

"7-powerful-women-bible-who-help-rescue-gods-people":`【被看輕的人，才是改寫歷史的人】

深夜的產房裡，油燈搖晃。一位收生婆抱著剛出生的男嬰，孩子的母親滿身是汗，眼神裡全是哀求。
門外，是王的命令：「若是男孩，就殺了他。」
門內，是一聲微弱卻倔強的啼哭。
她該聽誰的？是聽握有生殺大權的王，還是聽那個剛來到世上、什麼都還不會說的生命？

權力最大的盲點，往往不是看不見敵人，而是看不見那些「不算數」的人。

法老以為女孩沒有威脅，所以下令：女孩可以活。
他算準了軍隊、算準了人口、算準了糧倉、算準了每一塊磚的產量，
卻沒算到——兩個收生婆、一位母親、一個姊姊、一位公主、一個婢女、一個異族的妻子，
會一個接一個，把他的死亡命令拆成碎片。

你以為出埃及記是從摩西舉杖分開紅海開始的嗎？
不。它是從七個女人的「不」開始的。

收生婆說「不」，因為她們敬畏神勝過敬畏王；
母親說「不」，因為她看見孩子「美好」，就像神看見祂的創造；
姊姊說「不」，因為她守在河邊，不肯讓弟弟孤單漂走；
公主說「不」，因為憐憫比效忠父親更重要；
西坡拉說「不」，因為她知道在最危急的時刻該做什麼。

法老用的是權力，她們用的是生命；
法老製造恐懼，她們保護希望；
法老要人消失在尼羅河，她們卻把一個孩子從水裡拉了上來——
那孩子的名字，就叫「摩西」，意思是「從水裡拉出來」。
更奇妙的是，母親做給他的小籃子，原文和挪亞的「方舟」是同一個字。
原來，一位母親的手工，也能是拯救世界的方舟。

這不只是一個古老的故事，這是一個關於「力量」的提問：
真正的力量，是能讓多少人害怕？
還是能讓多少人活下來？
是站在高處發號施令，
還是在低處默默守住一個生命？

第一層，她們保住了一個嬰孩；
第二層，她們保住了一個家庭；
第三層，她們預備了一位拯救者；
最後，她們成了整個民族得自由的起點。

也許你今天也覺得自己不重要。
沒有頭銜，沒有舞台，沒有人記得你做了什麼。
你照顧年邁的父母，你陪伴哭泣的孩子，你在職場上拒絕說謊，

"are-the-parables-of-jesus-confusing-on-purpose":`【耶穌為什麼不把話說清楚？】

美術館裡，你站在一幅畫前。
顏色奇特，線條模糊，看了很久還是不懂。
旁邊的人匆匆走過，嘟囔一句「看不懂」，順手拍了張照就離開；
你卻停下來，越看越想知道：畫家想說什麼？為什麼這樣畫？

最深的真理，常常不是用說明書寫成的，而是用畫筆畫成的。

耶穌是一位藝術家。
祂要宣告人類歷史上最重要的消息——神的國來了，
卻選擇用一個農夫撒種的故事：
有的種子被鳥吃了，有的落在石頭上曬死了，有的被荊棘擠住了，只有少數長成。
神的國，像這樣？
不是戰車、不是風暴、不是千軍萬馬，而是一個看起來有點失敗的農夫？

門徒也忍不住問：「你為什麼要用比喻？」
耶穌的回答更令人意外：因為有些人「看也看不見，聽也聽不見」。
這句話來自先知以賽亞——一個被差去對著心硬的人說話的先知。

你以為比喻是為了讓人更容易懂？
其實，比喻是一面鏡子，照出聽的人是什麼心。

想聽的人，越聽越明白；
不想聽的人，越聽越糊塗。
願意追問的人，被邀請進屋；
急著離開的人，只看見門外的牆。

這不是排擠，而是邀請。
任何一個好奇的人，都可以像門徒一樣留下來問：「這是什麼意思？」
真正擋住人的，從來不是比喻的難懂，而是心的匆忙。

為什麼神不直接把答案寫在天空上？
如果一切都清清楚楚，我們還會靠近嗎？
如果真理只是一句口號，我們還會被觸動嗎？
如果愛只是一份說明書，誰會為它流淚？

藝術家不只想被理解，更想被認識；
耶穌不只想給你答案，更想讓你認識祂——
祂怎麼看世界、怎麼說話、怎麼愛人。
祂要你想像、要你感受、要你被挑戰、要你被翻轉。

所以讀比喻時，別急著挖出一條教條或一句格言。
先讓那粒種子落進心裡；
再讓它在黑暗的土裡安靜扎根；
然後讓它在某個你沒預料的清晨，長出一片綠。

也許你最近讀經讀不懂，覺得神好像不說話。
也許那不是沉默，而是一幅畫，在等你停下腳步。

真理有時像畫，不像字；
有時像種子，不像果實。
它不急著被看懂，
它只等待一顆願意停下來的心。

"baptism-in-the-bible":`【穿過死亡之水的人】

水，可以養活人，也可以淹沒人。
古代的人看著無邊的大海，心裡想的不是浪漫，而是恐懼——
那是混沌、是深淵、是一切無法掌控的力量。
今天也一樣：一場洪水、一場海嘯，就能讓人明白自己有多渺小。
那麼，為什麼基督徒的入門儀式，偏偏是走進水裡？

人不是靠逃離死亡得救，而是被帶著穿過死亡。

這是一條從聖經第一頁就開始的線：
創造之初，神分開混沌的水，讓旱地出現，生命開始；
洪水來臨，挪亞一家坐在方舟裡，穿過水進入新的世界；
以色列人被追兵逼到海邊，神分開紅海，他們走在乾地上；
四十年後，約書亞帶百姓走過約旦河，進入應許之地；
先知以賽亞又應許：將來神要再一次帶被擄的人，穿過列國的「大水」回家。

一次又一次，同一個模式：
水代表死亡，神帶人穿過，對岸是新的開始。

你以為洗禮只是一個宗教儀式，表示「我信了」？
其實，洗禮是把自己放進這個千年的故事裡。

施洗約翰在約旦河給人施洗，正是在重演出埃及：
過去的人在這條河進入應許之地，今天的人在這條河預備迎接彌賽亞。
接著，耶穌來了，走進水中，又從水裡上來。
那一刻，天裂開了——像創造時分開的天；
聖靈如鴿子降下——像挪亞放出的那隻鴿子；
天上的聲音說：「你是我的愛子」——像神稱以色列為「我的兒子」。

挪亞靠方舟躲過洪水，耶穌卻親自沉入死亡；
以色列人走過乾地，耶穌卻走進最深的水；
別人是被救出來的，祂卻是那位帶人出來的。

所以保羅說：我們受洗，是與基督一同埋葬，也一同復活。
舊的我，留在水裡；新的我，從水裡上來。
不是因為我們會游泳，而是因為有一位先走過去、又回來牽我們的手。

你心裡有沒有一片海，怎麼也過不去？
一段過去、一個傷口、一個你以為會淹沒你的恐懼？
如果神曾經分開紅海，
祂會不會也能在你的深水中，開出一條路？
如果耶穌曾經從死裡上來，
你的谷底，會不會也只是新生命的河岸？

不論是浸入水中，還是點水在額上；
不論是嬰孩，還是大人；
意義都是同一個：
我跟著耶穌，穿過死亡，走進新創造。

水退去的地方，
就是新生命開始的地方。
那一天，你從水裡抬起頭——
天，也為你裂開了。

"fellowship-of-the-church-in-the-bible":`【你會帶什麼菜來這張桌子？】

你是否只想得到團契的溫暖，卻不想付出團契的代價？
你是否害怕，給出去就再也拿不回來？

一層一層地學習：

位子也為你留好了。

"god-name-many-actually":`【神有名字，而且祂願意讓你叫祂】

讀舊約的時候，你可能會困惑：神到底叫什麼？

枝葉，自然就伸向全世界。

"how-does-the-bible-explain-suffering":`【祝福不是搶來的】

社群網站上，到處都是 #blessed：新車、旅行、升職、寶寶出生。
可是另一邊，有人在化療室裡，有人剛辦完喪事，有人每天和憂鬱症搏鬥。
如果「蒙福」就是一切順利，那這些人是被神遺忘了嗎？
這個世界，好像哪裡出了問題。

祝福是被領受的禮物，咒詛是被強奪的後果。

聖經第一次說「賜福」，是神對動物說：要生養眾多。
第二次，是對人說：要生養眾多，並且管理這地。
祝福的意思，就是生命的興旺與擴展——而且神邀請人一起參與。

不是「你表現好，我才祝福你」，而是「選擇我的道路，就是選擇生命」。
園子中央有一棵樹，代表一個選擇：讓神定義善惡，還是自己定義？
一個狡猾的聲音說：你應該相信自己的判斷。
人伸手了。

其實，咒詛是神任憑人承受自己選擇的結果。

神咒詛了蛇，咒詛了地，卻沒有咒詛人。
但人進入了咒詛的世界：土地長出荊棘，生育帶著痛苦，關係充滿控制與傷害，最後歸於塵土。
即使如此，神仍留下一個應許：女人的後裔要傷蛇的頭。

然後，耶穌來了。
在曠野，撒但給祂一條捷徑，祂拒絕了；

祂沒有逃，沒有反擊，讓咒詛落在自己身上。
三天後，神使祂復活——咒詛死了，祝福重新開始流動。

亞當伸手拿取，耶穌張手給予；
亞當在園中跌倒，耶穌在園中站立；
亞當帶來死亡，耶穌帶來生命。

那麼，在疾病、離婚、失業、焦慮還沒有消失的今天，我們怎麼辦？
我們可以假裝「凡事都有原因」嗎？
還是可以和耶穌一起哀哭，同時相信咒詛終將結束？

一層一層地參與翻轉：
當你饒恕傷害你的人，咒詛退後一步；
當你祝福咒詛你的人，咒詛又退後一步；

而在你放開的手心上。
當你不再伸手奪取，
你會發現，
神早就把最好的放在那裡。

"how-do-we-make-sense-of-the-book-of-genesis":`【你讀不懂創世記，不是你的錯】

你下定決心今年要讀完聖經，從創世記第一章開始。
前幾章還好，可是越讀越困惑：會說話的蛇、活了九百歲的人、奇怪的家譜、令人不安的暴力、對女性不公平的對待……
讀到一半，你默默把聖經放回書架。
你心裡想：是不是我太笨了？

讀不懂古老的書，不代表你不夠屬靈，只代表你需要一張地圖。

聖經是古代近東的文學，作者的語言、文化、敘事方式都和我們不同。
所以第一步，是承認：它本來就不容易。
第二步，是學會看結構。

創世記不是一堆零散的故事，而是四個「樂章」——一組組故事被精心編排成一個整體。

第一樂章（亞當到挪亞）：追蹤「神的靈」。
神的 ruakh——風、氣息、靈——在混沌的水面上運行，把生命吹進泥土做的人。
可是人選擇自己定義善惡，裂痕從家庭擴大到全世界，直到巴別塔。

第二樂章（亞伯拉罕）：追蹤「樹」。
神揀選一個家族，要透過他們祝福萬國。
亞伯拉罕有信心的時刻，也有失敗的時刻，但神的應許從未撤回。

第三樂章（以撒與雅各）：追蹤「祝福與咒詛」。
雅各這個名字的意思是「抓腳跟的人」「騙子」，他一生都在用詭計搶祝福。
直到有一天夜裡，他和神摔跤，被摸了大腿窩，從此一瘸一拐——
就在那受傷的時刻，他終於學會「領受」祝福，被改名為以色列。

第四樂章（雅各的兒子們）：追蹤「流放」。
約瑟被哥哥們賣到埃及，從奴隸到囚犯，再到宰相，最後救了全家。

你以為創世記是一本關於「好人」的書？
其實，它幾乎沒有好人——只有一位不肯放棄壞人的神。

人選擇欺騙，神選擇信實；
人製造斷裂，神持續修補；
人的意思是要害，神的意思是要保全。

創世記最後，約瑟對曾經出賣他的哥哥們說：
「從前你們的意思是要害我，但神的意思原是好的。」
這句話，總結了整卷書。

你的人生是不是也像這樣——有欺騙、有失去、有被背叛、有自己的失敗？
你是否也在某個夜裡，和神摔跤，受了傷，卻不知道那是祝福的開始？
如果神能把約瑟的坑洞變成拯救的通道，
祂會不會也能把你的傷口，變成別人的出路？

一層一層地讀下去：
先放下「我應該懂」的壓力，
再看見樂章與主題，
然後在每個破碎的家庭裡找到神的手，
最後，發現這個故事還沒結束——它一路延伸到你身上。

創世記的最後一頁，
家族還在埃及，應許還沒實現。
就像你的人生，
還有很多章沒寫完。
別急著闔上，
翻頁的那一位，一直都在。

"if-god-remembers-does-he-also-forget":`【當你覺得被神忘記的時候】

方舟在海上漂了好幾個月。
四周一片漆黑，水沒有退的跡象，動物在船艙裡騷動，挪亞的家人輪流守夜。

就在洪水故事的正中央，聖經寫了一句話：「神記念挪亞。」
整個故事是對稱的，前半是水漲，後半是水退，而這句話，正好在中心點。
接著，神的風吹過水面——就像創世之初，神的靈運行在水面上。
水開始退去，鴿子找到了橄欖葉，方舟停在山頂。

神記念什麼？祂記念在伊甸許下的那個應許——要差一位拯救者，醫治受造界。
該隱殺了弟弟，暴力擴散，人心所想盡都是惡。
讀者會問：那位拯救者在哪裡？
聖經的回答是：神沒有忘記，祂一直在動工。

這個模式一再出現：
所多瑪罪惡滔天，天降火焰，「神記念亞伯拉罕」，救出了羅得；

馬利亞也唱：神記念祂的憐憫。

大概是：大有能力、所向無敵、一出手就擊敗所有敵人。

神勝過邪惡的方法，是讓邪惡先勝過祂。

以賽亞書前半部結束時，景況一片黑暗：連最好的君王希西家也失敗了，被擄巴比倫已成定局。

證據三，看哪，壓迫你們的巴比倫倒下了。

你以為接下來以色列會悔改，成為萬國的光？
其實，第四十八章說：他們仍然心硬，仍然拜偶像。

福音書被稱為「福音」，這個詞也來自以賽亞的「好信息」。

一位被藐視的人，
用他的傷，

"jesus-gods-forgiveness-meaning-matthew-614-15":`【饒恕像呼吸】

她被最好的朋友出賣了，秘密被傳遍整個教會。
她的丈夫外遇了，還說是她的錯。
他的父親從小打他，現在卻要他在病床前說「我原諒你」。

這句話，是安慰，還是更重的枷鎖？

先說清楚：耶穌不是在說神會因為你還沒原諒加害者，就拒絕原諒你。
饒恕需要誠實面對情緒，需要時間，有時需要一次又一次地放下。
神不要求你一夜之間原諒那個毀了你世界的人。

耶穌講過一個故事：
一個僕人欠王一筆天文數字的債，大約是六千萬天的工資——一輩子都還不起。

神定罪那個錯，卻放過那個人。

嚴重的傷害，需要對方承認、改變，關係才能真正修復。
耶穌教導：先私下指出錯誤；不聽，請一兩個人同去；再不聽，告訴群體。

意思是：保持界線，但不要關上愛的門。

你是否覺得，饒恕就等於說「那件事沒關係」？
你能不能在不假裝、不否認的情況下，慢慢放下？

一層一層地走：
先誠實——承認那件事真的很痛；

然後放下——一次不夠就放下第二次、第三次；
最後盼望——也許有一天，關係真的能恢復。

你要吸進神的饒恕，
也要呼出對人的饒恕。
只吸不呼的人會窒息，
學會呼氣的人，
才能真正活著。

"keeping-the-sabbath-is-it-still-relevant-to-christians-today":`【你停下來，才能住下來】

週日晚上，你躺在床上，腦中已經在排明天的會議、回覆的訊息、截止的報告。
說是休假，手機卻從沒離手；說是陪家人，心卻一直在工作裡。
你很累，卻不知道怎麼停下來。
你甚至有點罪惡感：休息，是不是在浪費時間？

休息不是停止生產，而是回到生命的源頭。

在人犯罪之前、在以色列立約之前，安息就已經存在了。
神用六天創造，第七天歇了一切的工，並且賜福給這一天。

希伯來文有兩個關於「安息」的字：
一個是 shabbat——停止，像下班打卡，工作結束了；
另一個是 nuakh——安住、定居，像冬夜裡和心愛的人坐在火爐邊，像回到外婆家，把行李打開，住下來。
創世記先說神「歇了工」（shabbat），接著說神把人「安置」（nuakh）在園子裡。
停止，是為了同在。

你以為安息日是一條要人遵守的規定？
其實，它是神送給人的邀請：來，和我住在一起。

可是以色列一再拒絕這份邀請。
有時他們忽略安息日，有時又把它變成沉重的規條——
不准做這個、不准做那個，連掐幾顆麥穗都被指控違法。

耶穌說：「凡勞苦擔重擔的人，可以到我這裡來，我就使你們得安息。」
馬太緊接著記錄了兩件安息日的衝突：門徒掐麥穗、耶穌醫治枯乾的手。
意思很清楚：人被律法壓得喘不過氣，而真正的安息，就站在他們面前。

停止工作是 shabbat，和神同在是 nuakh；
只有停止沒有同在，是空虛；

"rethinking-redemption-with-a-kinsman-redeemer-in-the-bible":`【有人願意把你贖回來】

"ruling-the-world-through-weakness-in-psalm-8":`【嬰孩的哭聲，竟能讓仇敵閉口】

一個嬰孩半夜醒來，大聲哭喊。
他不會說話，不會走路，不會自己吃飯，什麼都做不到。
但他知道一件事：哭，就會有人來。
在所有人類中，最懂得「需要」的，就是嬰孩。

神選擇的治理方式，不是透過最強大的人，而是透過最知道自己需要祂的人。

詩篇第八篇說：神從嬰孩和吃奶的口中，建立了能力，使仇敵和報仇的閉口無言。

答案藏在一千年後的耶路撒冷。
耶穌騎著驢進城，群眾歡呼。
祂走進聖殿，看見那裡變成了市場——祭司們在兌換銀錢，窮人得付錢才能見神。
耶穌推翻了桌子，把做買賣的趕出去。
然後，瞎子和瘸子進來了，耶穌醫治他們；
孩子們也進來了，大聲喊著：「和散那歸於大衛的子孫！」

祭司長們很生氣：「你聽見這些孩子在說什麼嗎？」
耶穌回答：「你們沒有念過：『你從嬰孩和吃奶的口中完全了讚美』嗎？」

你以為耶穌只是在為孩子們辯護？
其實，祂是在說：你們熟讀詩篇，應該記得下一句——「使仇敵閉口」。
站在神對面的，正是你們。

宇宙的創造主成了一個無助的嬰孩；
與被社會遺棄的人同行；
戴著荊棘冠冕，在軟弱中死去——
卻正是藉著這樣的軟弱，勝過了仇敵，萬物都服在祂腳下。

你是否覺得，承認自己需要幫助，是一種失敗？
你是否總想表現得堅強，不讓任何人看見你的脆弱？

軟弱算什麼？神竟使用它；
呼求算什麼？神竟以它為保障；
最後，最軟弱的那一位，成了萬王之王。

今晚如果你又在黑暗中醒來，
不必假裝堅強。
像個嬰孩一樣，
對神說：我需要你。
那一刻，地獄都會安靜下來。

"sin-iniquity-and-transgression-in-the-bible":`【罪不是一張好人壞人的分數表】

電影裡，總是好人對壞人。
新聞裡，我們很快就能指出誰是加害者、誰該被罵。
教會裡，有時「罪」被列成一張清單：說謊、喝醉、說髒話……
我們拿這張表衡量別人，也衡量自己：我算好人嗎？我比他好嗎？我配被愛嗎？

罪不是用來把人分類的標籤，而是每個人都要面對的敗壞。

聖經用了好幾個字描述罪，每一個都打開不同的視角。

第一個字，khata'——「失誤、沒射中」。
士師記裡，神射手拋石，一根頭髮都不差，就叫「沒有 khata'」。
那麼，人生的靶心是什麼？
神照自己的形像造人，而神是父、子、聖靈永恆相愛的群體。
所以人的目標，就是愛——愛神，愛人，愛受造界。
不去愛，就是沒射中。

該隱想殺弟弟之前，神警告他：「罪就伏在門前，想要得著你，你卻要制伏它。」
罪像一頭蹲在門口的猛獸——在你外面，卻想進來；你可以選擇制伏它。

你以為罪就是做了一件壞事？
其實，罪更像一種偏離——偏離了你被造的樣子。

第二個字，avon——「彎曲、扭曲」。
彎曲的道路、駝背、頭暈目眩，都用這個字。
它是把美好的東西扭曲變形，也指這種扭曲帶來的後果：受苦的人、破碎的關係、報復的循環。
有時我們甚至不知道自己在扭曲——還以為自己在做好事。
所以耶穌在十字架上說：「父啊，赦免他們，因為他們所做的，他們不曉得。」

第三個字，pesha——「背叛、破壞信任」。
陌生人偷東西是盜竊，鄰居偷東西就是 pesha，因為他本該值得信任。
先知說，以色列拜別神是 pesha；欺壓窮人、為了國家安全和經濟發展而犧牲弱者，也是 pesha。

錯過目標，是沒有去愛；
扭曲美好，是把愛變了形；
破壞信任，是把愛背叛了。

而耶穌，是唯一從未錯過目標的人。
祂從不扭曲，從不背叛，總是以神的方式愛每一個人。
彼得說：祂沒有犯罪，卻親自擔當了我們的罪，使我們在罪上死，在義上活。

你是否把罪當成衡量別人的尺？
你是否害怕面對自己的罪，因為那會證明你「不夠好」？
如果神的愛如此堅定，我們能不能誠實地把自己的偏離、扭曲、背叛，都帶到光中？

一層一層地走出來：
先承認——我也錯過了目標；
再看見——我也扭曲了美好；
然後悔改——我也背叛過信任；
最後，在耶穌裡，重新瞄準那個靶心——愛。

罪在黑暗中最強大，
一被帶到光裡，就顯出它的軟弱。
不必再比誰好誰壞，
因為我們都需要同一位——
那位就是靶心本身的耶穌。

"study-notes-for-the-bible":`【好的嚮導，讓你看見更美的風景】

你決定去爬一座從沒去過的山。
可以自己摸索：看錯路標、走進死路、在天黑前慌張下山。
也可以找一位熟悉這條路的嚮導：他知道哪裡危險、哪裡有最美的觀景台，也知道怎麼帶你平安回家。
讀聖經，也是這樣。

讀經不是一場考試，而是一趟旅程；最好的旅程，需要同行的人。

很多人想讀聖經，卻在第一座山前迷路：
古代的語言、陌生的文化、奇怪的律法、讀不懂的詩歌。
不是你不夠聰明，而是這本書本來就需要有人陪你讀。

BibleProject 的每一支影片背後，都有一份研究筆記。
它們來自 Tim Mackie 和 Carissa Quinn 兩位學者的研究——
一週裡有好幾個早上，他們不開會，只讀經文、讀原文、讀學術著作。
這些筆記原本只是寫腳本用的大綱，後來整理出來，免費提供給所有人。

你以為學者讀經，就是查字典、背資料？
其實，他們最常做的事，是一遍又一遍地讀同一段經文，直到熟悉得像自己的手掌。

做「主題研究」時，從創世記第一章開始，一路讀到全本聖經，追蹤一個主題怎麼發展；
做「字詞研究」時，觀察一個字在新舊約怎麼被使用，整理出它的層次，再用這個字重新看整個故事；
做「經文註釋」時，沉浸在希伯來文或希臘文裡，留意結構、重複的字詞，找出作者真正想說的重點。

他們重視的，不只是答案，而是方法：
仔細看作者在做什麼、怎麼表達、整段經文如何連到更大的故事。

答案讓你停下來，方法讓你走下去；
結論讓你記住，過程讓你改變；
一個人讀，讀到的是自己；一群人讀，讀到的是更大的神。

"teaching-and-signs-in-the-bible":`【神蹟從來不是重點】

也有人一生追逐神蹟，哪裡有醫治大會就往哪裡跑。
還有人說：「現在已經沒有神蹟了，只要讀經就夠了。」
到底神蹟和教導，哪個比較重要？

所有的記號，都指向同一個方向——那位行神蹟、說話的神。

使徒行傳第二章描寫初代教會時，「使徒」出現了兩次：
一次是「使徒的教訓」，一次是「使徒行了許多奇事神蹟」。

警告人的記號、審判的記號、拯救的記號（像出埃及的十災）；
標記聖約的記號——彩虹、割禮、安息日；
還有以賽亞說的：「必有童女懷孕生子，給他起名叫以馬內利。」

你以為神蹟是為了讓人驚嘆？
其實，每一個記號，都是為了讓人認識神、倚靠神。
一個記號若不指向神，就不可信。

祂承受審判，帶領人從罪中出埃及；
祂成全所有的約，開啟永遠的安息；

讓別人從你的生命裡，看見神的真實。

最大的神蹟，
有時不是病得醫治、海被分開，
而是一個被愛改變的人，
在這個世界裡，
活成了一盞燈。

"the-apocalypse-of-jesus":`【「啟示」不是世界末日】

聽到「Apocalypse」這個字，你想到什麼？
大概是電影裡的末日景象：城市崩塌、天空燃燒、人類逃亡。

它的意思是——揭開。

最驚人的揭示，不是世界的毀滅，而是一個被釘十字架的人，原來就是王。

馬可福音被設計成一齣三幕劇：
第一幕在加利利，第二幕在路上，第三幕在耶路撒冷。
每一幕裡，都有一個場景，揭開耶穌真正的身分。

第一幕：約旦河邊。
耶穌從水裡上來，天被「撕裂」了——一個很激烈的字。
聖靈降下，天上有聲音說：「你是我的愛子，我喜悅你。」
這句話融合了三段經文：亞伯拉罕的獨生子、大衛家的王子、以賽亞那位受苦的僕人。
古代祭司要用水和油被分別出來，而耶穌被水和聖靈膏立——祂是祭司，也是王。
接著，祂對一個癱子說：「你的罪赦了。」
祭司可以宣告神的赦免，但耶穌是憑自己的權柄赦罪。

第二幕：高山上。
六天之後，耶穌帶三個門徒上山，在他們面前變了形像，衣服白得發光，雲彩遮蓋他們。
摩西和以利亞出現在旁邊——兩位曾在西奈山見過神的人。
天上又有聲音說：「這是我的愛子。」
那一刻，耶穌就像一位發光的大祭司，站在神的山上。

你以為這些場景只是在展示耶穌有多榮耀？
其實，馬可要我們準備好面對最難接受的第三幕。

第三幕：耶路撒冷。
群眾歡迎祂作王，祂卻潔淨聖殿、揭穿領袖的虛偽。
祂被捕，被帶到大祭司該亞法面前。
大祭司問：「你是基督嗎？」
耶穌說：「我是。你們必看見人子坐在權能者的右邊，駕著天上的雲降臨。」
這句話讓大祭司撕裂了衣服，判祂死刑。

最後，在十字架上。
這次天沒有開，而是黑暗籠罩；沒有天上的聲音，只有耶穌大聲喊叫，然後斷氣。
就在這時，一個羅馬百夫長——一個外邦人、一個行刑者——說：

第一幕天開了，第三幕天黑了；
第一幕神說祂是愛子，第三幕外邦人說祂是神的兒子；
最榮耀的宣告，竟然在最羞辱的時刻出現。

馬可福音的原始結尾很突然：婦女們看見空墳墓，害怕地逃跑了。
沒有圓滿的結局，沒有歡呼。
也許，這是刻意的——作者把問題留給你。

你會像門徒一樣逃跑嗎？
你能在一個被釘的人身上，認出你的王嗎？
你願意帶著這個奇怪的好消息，走進你的世界嗎？

一層一層地揭開：
先是河邊的愛子，
再是山上的榮光，
然後是審判中的宣告，
最後是十字架上的認信。

真正的啟示，
不是天塌下來，
而是你的眼睛被打開，
在最黑暗的地方，
看見了光。

"the-ascension-of-jesus":`【耶穌升天，不是離開地球】

"the-larger-story-of-exodus":`【最大的敵人，最後竟是自己的心】

"what-are-the-gospels":`【這是一本會要你回應的書】

"what-does-faith-without-works-dead-mean-james-214-26":`【一個沒有兌現的承諾】

小男孩站在窗邊，等媽媽來接他。
「這週末我一定來，我保證！」媽媽電話裡是這樣說的。

爸爸摸摸他的頭：「看來她不會來了。」

一個弟兄或姊妹缺衣少食，有人對他說：「平平安安地去吧，願你穿得暖、吃得飽！」

溫暖的話，配上冰冷的手——那有什麼用？

他才終於明白：
原來愛，
是會準時出現在門口的。

"what-does-isaiah-4031-wings-eagles-verse-mean":`【等候，不是發呆】

你已經撐了很久。
工作壓力、家人生病、經濟拮据、看不到出口。
有人對你說：「要等候神。」
你心裡想：等？我已經等很久了。還要等到什麼時候？難道就坐著什麼都不做嗎？

真正的等候，不是被動地等待，而是主動地記得。

以賽亞書40章31節：「那等候耶和華的，必從新得力。他們必如鷹展翅上騰；他們奔跑卻不困倦，行走卻不疲乏。」
這節經文常被印在書籤、海報、畢業卡上。
可是它最初是寫給誰的？

是寫給被擄到巴比倫的以色列人。
他們的家園被燒毀，聖殿被拆毀，在異鄉受苦了幾十年。
他們說：「我的道路向耶和華隱藏，我的冤屈神並不查問。」

其實，「等候」的希伯來文 qavah，和「繩子」是同一個字根——

疲憊讓人忘記自己是誰，等候讓人想起自己屬於誰；

等候神，

讓祂的風，把你托起來。

"what-does-isaiah-4110-do-not-fear-i-am-you-mean":`【「不要害怕」，然後呢？】

"what-does-jeremiah-2911-mean-i-know-plans-i-have-you":`【這節經文，原本不是給畢業典禮的】

畢業典禮上，演講者微笑著念出：
「我知道我向你們所懷的意念，是賜平安的意念，不是降災禍的意念，要叫你們末後有指望。」
台下的學生戴著方帽，滿心期待未來的成功。
這節經文，好像就是為這一刻寫的。
可是你知道，它最早是寫給誰的嗎？

真正的盼望，不是否認苦難，而是在苦難中仍然相信神正在創造生命。

它是寫給一群剛剛失去一切的人。
巴比倫攻打耶路撒冷，大批人被擄走，被迫離開神賜給他們的土地。
對以色列人來說，這不只是亡國，而是出埃及的倒轉——像世界本身在崩解。

先知耶利米寄了一封信給他們。
信的開頭，不是「很快就會好起來」，而是：
「你們要蓋房子，住在其中；栽種田園，吃其中的果子；娶妻生子，在那裡生養眾多。」
意思是：準備長住吧，這不會很快結束。

當時有另一位先知哈拿尼雅，說兩年內就能回家。
那是大家想聽的。
耶利米卻說：七十年。
他說：不要被那些說好聽話的先知欺騙了。

你以為這節經文是一個「很快就會成功」的保證？
其實，它是一個在長期苦難中堅持下去的呼召。

更驚人的是下一句：「你們要為那城求平安，為它禱告。」
那座城，是摧毀他們家園的巴比倫。
平安，希伯來文 shalom，不只是沒有戰爭，而是完整、和諧、彼此興旺。
在被擄之前，耶路撒冷的假先知最愛說「平安、平安」——
他們一邊說平安，一邊縱容權貴欺壓窮人。
那是假的平安。

真正的平安，竟然要在敵人的城市裡尋找；
真正的盼望，竟然要從蓋房子、種菜園開始；
真正的未來，竟然要先接受漫長的現在。

然後才是那句話：
「我知道我向你們所懷的意念……要叫你們末後有指望。」
神知道你、在乎你；祂的心意是平安，不是災禍。
苦難不是報復，而是轉化——祂要把你塑造成一個連敵人都願意祝福的人。

如果我們把這節經文當成「保證我成功」的口號，
會不會不小心變成了那些說好聽話、卻不肯面對現實的假先知？

你現在是不是也在某種「被擄」裡——一份看不到出口的工作、一段漫長的病、一個回不去的過去？
你是一直等著「兩年後就好了」，還是願意在這裡蓋房子、種田園？
你能不能為那個讓你受苦的地方，禱告求平安？

一層一層地走下去：
先接受——這會比我想的更久；
再生活——在這裡好好過每一天；
然後祝福——為身邊的人、甚至敵人求平安；
最後盼望——相信神的意念，終究是好的。

每一棟在異鄉蓋起的房子，
每一棵在敵國種下的樹，
都是一句無聲的信心告白：
我的故事，
還沒有結束。

"what-does-psalm-23-lord-my-shepherd-mean":`【牧者，也是擊敗法老的王】

你的世界突然崩塌了。
一通電話、一張診斷書、一段破裂的關係，讓你掉進一個黑暗的山谷。
你很害怕，很無助。
然後你想起那句熟悉的經文：「耶和華是我的牧者，我必不致缺乏。」
可是，一個溫柔的牧羊人，怎麼能在死亡的幽谷裡保護你？

真正的安慰，不只來自溫柔，也來自力量。

詩篇23篇被放在22篇和24篇之間，而這兩篇都在講：神是王。
在古代，君王常被比喻成牧人——好的王要像牧人一樣供應、保護、帶領百姓。
可是很多王是壞牧人：法老奴役百姓，以色列的領袖剝削羊群，連大衛自己都曾濫用權力。
那麼，誰是真正的好牧人？

你以為詩篇23篇只是一首溫柔的田園詩？
其實，它的每一行，都在回想出埃及的故事。

「我必不致缺乏」——以色列在曠野四十年，「一無所缺」；
「可安歇的水邊」——神為以色列在曠野尋找「安歇之處」；
「祂引導我」——正是紅海之歌裡，讚美神「引導」被救贖之民的同一個字。
「死蔭的幽谷」——先知耶利米用同一個字形容以色列走過的曠野。
「你的杖」——那個字也是王的權杖，用來施行公義，讓仇敵不敢靠近。
「在敵人面前擺設筵席」——讓人想起曠野中百姓懷疑：神豈能在曠野擺設筵席？結果神降下嗎哪與鵪鶉。
「恩惠慈愛隨著我」——「隨著」的原文，是「追趕」，正是法老的軍隊追趕以色列的那個字。

從前追趕你的是敵人，現在追趕你的是恩惠；
從前曠野是缺乏，現在曠野有筵席；
從前幽谷是死亡，現在幽谷裡有一位與你同在。

整首詩有三個宣告：
我必不缺乏；我不怕遭害；我要住在耶和華的殿中。
這份信心不是空想，而是建立在神曾經做過的事上——
那位溫柔的牧者，也是擊敗法老的王。

後來，耶穌說：「我是好牧人，好牧人為羊捨命。」
祂不只帶你走過幽谷，祂親自走進死亡，又從死裡出來，為你開路。

你現在在哪一段路上？
在青草地上，還是在幽谷裡？
當你害怕的時候，你記得的是一個溫柔的形象，還是一位能擊敗邪惡的王？

一層一層地被帶領：
先是青草地——祂供應你；
再是溪水邊——祂讓你安歇；
然後是幽谷——祂與你同在；
接著是筵席——祂在敵人面前尊榮你；
最後是祂的殿——你永遠住在祂面前。

也許你今晚正走在死蔭的幽谷，
四周一片漆黑。
但請回頭看看——
那個一直追著你跑的，
不是仇敵，是慈愛。

"what-does-the-bible-say-about-angels-and-cherubim":`【天使沒有翅膀，基路伯才有】

聖誕卡上的天使，通常是有翅膀、頭上有光環的可愛孩子。
電影裡的天使，常常是溫柔的金髮守護者。
可是聖經裡的天使，和你想像的可能很不一樣。
而那些有翅膀的，其實叫做基路伯——而且一點也不可愛。

所有天上的使者，都在指向同一件事：人怎樣回到神的面前。

伯利恆的夜晚，牧羊人圍著火堆守夜。
突然，一個發光的存在出現在他們面前：「不要懼怕！我報給你們大喜的信息。」
接著，滿天都是這樣的使者，讚美神。
他們會說話、會唱歌、像人一樣出現——但聖經沒說他們有翅膀。

「天使」的希伯來文 malach、希臘文 angelos，意思都是「使者」。
他們傳遞神的信息：
救羅得一家逃出所多瑪；
在以利亞最絕望的時候，叫醒他、給他吃的；
在夢中警告約瑟帶孩子逃往埃及；
向撒迦利亞和馬利亞宣告孩子的誕生。

你以為天使是聖經的主角之一？
其實，他們很少談自己——他們總是在談耶穌。

那麼，基路伯呢？
他們第一次出現，是在人被逐出伊甸之後。
神在園子東邊安設基路伯和發火焰的劍，把守通往生命樹的路。
伊甸是天地合一的地方，在那裡違背神的旨意，就無法繼續住下去。

後來，會幕的幔子上繡著基路伯，擋在至聖所前面；
約櫃上方有兩個金基路伯，神說：我要在二基路伯中間與你說話。
以西結看見的基路伯，有人與動物混合的臉孔，翅膀的聲音像全能者的聲音。
他們不是可愛的裝飾，而是守護聖所的強大受造物。

天使傳遞信息，基路伯守護門口；
天使說「不要懼怕」，基路伯提醒「不可輕忽」；
天使把神帶近人，基路伯提醒人：要與神的旨意合一，才能進入。

兩者合起來，訴說同一個故事：
人被逐出了生命之地；
神不斷派使者告訴人怎樣回來；
最後，在耶穌死的那一刻，聖殿裡那道繡著基路伯的幔子，從上到下裂成兩半。
回家的路，打開了。

你對天使的想像，是從聖經來的，還是從卡片和電影來的？
你是否期待一個超自然的經驗，卻忽略了天使一直在指向的那一位？
如果回到神面前的路已經打開，你還在門外徘徊什麼？

一層一層地明白：
先是基路伯守住門口，
再是天使傳來好消息，
然後是幔子裂開，
最後，人可以再次走進天地交會的地方。

天使唱完歌就離開了，
牧羊人卻起身去找那個嬰孩。
信息從來不是終點，
它要帶你去的，
是那個躺在馬槽裡的神。

"what-does-the-book-numbers-teach-us":`【自由了，卻還不會當自由的人】

一個在監獄裡關了二十年的人，終於出獄了。
外面的世界很大、很自由，但他卻手足無措：不知道怎麼找工作、怎麼規劃一天、怎麼相信別人。
有些人甚至會懷念牢裡的日子——至少三餐有人準備，每天該做什麼都很清楚。
離開監獄很快，離開監獄的心態卻要很久。

身體得自由只要一天，心得自由卻要一生。

以色列人在埃及為奴四百三十年。
神用大能的手把他們帶出來，在西奈山和他們住了一年，教他們怎麼和神相處、怎麼和彼此相處。
然後，該出發了——往神應許給他們祖先的那塊地。

出發前，神吩咐點算人數。
這就是「民數記」名字的由來。
後來又點算了一次——因為第一次被數算的那一代人，幾乎全都死在曠野。

你以為民數記是一本無聊的人口普查？
其實，它是一部驚心動魄的曠野求生記：天上降下食物、磐石湧出活水、火柱帶路、探子偵察、巨人擋道。

營地安排得很特別：會幕在正中央，十二支派圍繞四周。
神的同在，是整個生活的中心——不只在應許之地，也在每天跋涉的曠野裡。

可是百姓開始抱怨。
嫌嗎哪太單調，懷念埃及的韭菜、蔥、蒜、西瓜和黃瓜——
他們懷念的，是當奴隸時吃的菜。

到了應許之地的邊界，十二個探子去偵察了四十天。
十個人回來說：那裡的人像巨人，我們看自己像蚱蜢。
只有迦勒和約書亞說：神喜悅我們，就必領我們進去。
百姓哭了一整夜，說：我們寧願死在曠野！
他們以為神帶他們出來，是要讓他們死在巨人刀下——
完全忘了，神把他們救出來，是為了給他們生命。

神就照他們說的：這一代人在曠野漂流四十年，直到死去。
但迦勒、約書亞和孩子們，會活下來，進入那地。

埃及給的是奴役的安全，曠野給的是自由的挑戰；
懷念過去的人看見巨人，信靠神的人看見應許；
同一片土地，有人看見死亡，有人看見流奶與蜜。

民數記最後，新的一代站在約旦河邊，神再次點算他們，教導他們怎麼分地、怎麼生活，
確保新的土地不會變成另一個埃及。

你是否也在某個「曠野」裡，懷念以前雖然不自由、卻很熟悉的日子？
你看見的是巨人，還是那位帶你出來的神？
你是否也曾因為害怕，對神的應許說「不」？

一層一層地學會自由：
先是被救出來；
再是在曠野裡學習信靠；
然後在邊界上選擇——相信，還是退縮；
最後，新的一代站在河邊，準備進入。

曠野不是懲罰，而是學校。
在那裡，神每天降下嗎哪，
不是為了讓你吃膩，
而是讓你天天記得：
你的生命，在祂手中。

"what-hagar-and-ishmaels-story-reveals-about-gods-purposes":`【沒有人是神眼中的外人】

我們從小就學會畫線：
我們這組、他們那組；我們這區、他們那區；我們這種人、他們那種人。
在這些線的外面，總有一些人：沒有名字，只有標籤。
在創世記裡，有一個女人就是這樣——她的名字甚至聽起來就像「外人」。

神看見的人，往往是我們早就決定不看的人。

她叫夏甲。
希伯來文裡，她的名字和「外人」諧音。
她是埃及女奴，屬於亞伯蘭和撒萊。

撒萊等不到神應許的兒子，就照當時的習俗，叫夏甲替丈夫生孩子。
在整個故事裡，亞伯蘭和撒萊從來沒叫過她的名字，只叫她「使女」。
敘述者還一再提醒：她是埃及人——那個後來奴役以色列的民族。

夏甲懷孕後，輕看了撒萊；撒萊就苦待她。
「苦待」這個字，正是後來埃及人苦待以色列人時用的同一個字。
蒙揀選的家族，竟然先成了壓迫者。

夏甲逃到曠野。
一個懷孕的女人，獨自在荒漠裡——幾乎是死路一條。
就在那裡，耶和華的使者找到了她，叫她的名字：「夏甲。」

你以為神只關心蒙揀選的亞伯拉罕家族？
其實，神第一次在曠野中顯現、說應許的對象之一，就是這個被趕走的外族女奴。

神說：你要生一個兒子，給他起名叫以實瑪利——意思是「神聽見」。
因為神聽見了你的苦情。
夏甲於是給神起了一個名字：El Roi——「看顧人的神」。
她是聖經裡唯一一個為神命名的人。

神應許以實瑪利也要成為大國；以實瑪利也受了割禮。
可是多年後，撒拉生了以撒，又要把夏甲母子趕出去。
富有的亞伯拉罕，只給了他們一點餅和一皮袋水。

水喝完了。夏甲把孩子放在小樹下，走開一段距離，因為她不忍心看孩子死去。
她放聲大哭。
神又聽見了——聽見孩子的聲音。
神開了夏甲的眼睛，她看見一口水井。

人叫她「使女」，神叫她「夏甲」；
人把她趕走，神在曠野找她；
人只給一袋水，神給她一口井。

更動人的是：這一次，神再也沒有稱她為「撒拉的使女」。
被趕出去的那一天，竟成了她出埃及、得自由的那一天。

你心裡，有沒有一條把某些人畫在外面的線？
你是否也曾經是那個被叫「使女」、沒被叫名字的人？
在你最絕望的曠野，你是否看見了那口神早已預備的井？

一層一層地被看見：
先是被使用，
再是被苦待，
然後被看見、被聽見、被應許，
最後，被釋放。

神的愛，不照我們畫的線走。
那個在曠野哭泣的女人，
後來對所有被遺忘的人說：
有一位神，
看見你。

"what-happens-when-we-read-bible-together":`【有些歌，一個人唱不完】

清晨，你泡一杯咖啡，坐在最喜歡的椅子上，翻開聖經。
安靜、私密、專注——這是很多人心中最理想的讀經時間。
這很好。
可是你知道嗎？在人類歷史的大部分時間裡，人們從來不是這樣讀聖經的。

聖經是為群體寫的，所以要在群體中讀，才讀得完整。

在印刷術發明之前，大部分人沒有自己的聖經。
他們聽聖經被朗讀，看教堂裡的圖畫和雕刻。
從摩西到新約時代，再到之後一千五百年，「聽」才是主要的讀經方式。

第一次公開讀經，發生在以色列人打敗亞瑪力人之後。
神對摩西說：把這件事寫在書上，念給約書亞聽。
寫下來，是為了念出來。

在西奈山，摩西把神的話念給百姓聽，並當著他們的面寫下來。
後來規定：每七年的住棚節，男人、女人、孩子、寄居的外人，都要聚集，聽律法被宣讀。
聽，為了學習；聽，為了明白；聽，為了記得自己是誰。

你以為不讀經的代價，只是少了一點屬靈知識？
其實，聖經裡記錄了那個代價：
約書亞死後，沒有人再聚集聽神的話，結果出現了「不認識耶和華」的一代。

多年後，約西亞王重新發現律法書，一讀就撕裂衣服，帶來全國的復興；
以斯拉站在高台上宣讀律法，利未人逐句講解，百姓聽了又哭又笑。
耶穌在拿撒勒的會堂，站起來讀以賽亞書，宣告這經今天應驗了；
保羅一再叮嚀：把我的信念給眾人聽。

一個人讀，讀到的是自己的理解；

如果你把左臉轉過去，對方只能用手掌打——那是對待平輩的方式。

"what-kind-of-culture-shaped-the-bible":`【讀聖經，是一趟出國旅行】

你出國旅行，走進一家餐廳。

要聽懂一段話，先要走進說話的人的世界。

聖經是古代的猶太文學，用希伯來文、亞蘭文、希臘文寫成。
作者是幾千年前的牧人、農夫、漁夫、文士、先知。
譯本像一位雙語導遊，幫你把他們的話翻成你的語言。

你得從他們的文化裡去理解。

其實，譯文背後還藏著一整個你不熟悉的世界。

第一，屬靈的實在，是一切物質的根基。
世界不是偶然出現的，而是從神的靈與話語而來。

第二，集體主義。
一個人的選擇，可以影響好幾代、整個民族——

男人、富人、特定族群被看重，其他人常被壓迫。
理解這一點，你才會震驚：耶穌竟然主動和撒瑪利亞女人說話，讓小孩成為天國裡最大的。

第四，潔淨觀。
聖潔與不潔、潔淨與污穢、合宜與不合宜——這些詞彙構成了他們看世界的方式。

用作者的眼光讀經，才讀到他們真正要說的；
不認識文化，經文是平的；認識文化，經文才會立體起來。

讀經也是一樣。

你讀經時，是把自己的觀念讀進去，還是讓經文把你帶出去？

一層一層地走進那個世界：
先承認——我是一個旅人；

當你願意離開自己熟悉的世界，
就會發現，
神正在醫治每一種文化，包括你的。

"what-makes-the-bible-unified":`【六十六卷書，一個故事】

聖經裡有歷史、有詩歌、有律法、有預言、有書信、有異象；
有人打仗，有人談戀愛，甚至有一頭會說話的驢子。
作者有牧人、君王、漁夫、醫生、稅吏，寫作時間跨越上千年。
它看起來像一個大雜燴，甚至有時互相矛盾——
箴言才說「不要照愚昧人的愚妄話回答他」，下一節就說「要照愚昧人的愚妄話回答他」。
這樣的書，真的有一個統一的訊息嗎？

真正的合一，不是每個聲音都一樣，而是每個聲音都在說同一個故事。

先看結構。
希伯來聖經叫 TaNaK：律法（Torah）、先知（Nevi'im）、著作（Ketuvim），寫作與編輯跨越約一千年。
新約則是一世紀下半葉的猶太文獻：福音書、使徒的書信、最後是啟示錄。

你以為聖經只是把一堆古書裝訂在一起？
其實，它的作者和編者，刻意用重複的字詞、場景和情節，把整本書織成一張網。

創世記第一句是「起初」，約翰福音第一句也是「太初」——
約翰在告訴你：一個新的創造開始了。

伊甸園裡，一個人面對一個選擇：聽神的話，還是照自己的智慧？
他選擇了自己，結局是悲劇。
幾千年後，客西馬尼園裡，另一個人面對同樣的選擇。
祂說：「不要照我的意思，只要照你的意思。」
同一個場景，相反的選擇，截然不同的結局。

兩個園子，一個失落，一個得回；
兩個「起初」，一個舊創造，一個新創造；
兩種文體，相隔千年，說的卻是同一個故事。

希伯來聖經在被擄歸回後，由一群文士和先知整理成最後的形式——
他們和作者一樣，被聖靈引導，把散落的經卷編成一個彼此呼應的整體。
新約的作者，則是第一代跟隨耶穌的人：漁夫、醫生、稅吏、法利賽人。
保羅的書信在各地教會之間傳閱，很快就被收集在一起。

舊約一頁一頁累積盼望：神的應許什麼時候實現？
新約一開頭就宣告：時候到了，就在耶穌身上。

你讀聖經時，是否只挑喜歡的段落，像抽籤一樣？
你是否因為某些經文看起來矛盾，就覺得整本書不可信？
如果這是一個完整的故事，你讀到的那一頁，在整個故事中扮演什麼角色？

一層一層地看見合一：
先看見結構，
再看見重複的模式，
然後認識背後的作者與編者，
最後看見那條貫穿一切的線——耶穌。

就像一幅巨大的織錦，
近看是千百條不同顏色的線，
退後一步，
你會看見一張臉。
那張臉，正看著你。

#BibleProject #聖經的合一 #讀經 #舊約新約`,

"what-matthew-622-23-eye-lamp-body-means":`【你怎麼用錢，透露了你的心有多亮】

耶穌說過一句很奇怪的話：
「眼睛就是身上的燈。你的眼睛若瞭亮，全身就光明；你的眼睛若昏花，全身就黑暗。」
這是在講視力？在講專注？還是在講什麼神秘的屬靈經驗？
大多數人讀到這裡，都會跳過去。

一個人的屬靈健康，常常寫在他的錢包裡。

要讀懂這句話，得先看它放在哪裡。
它夾在耶穌談錢財的段落中間：
前面說「不要為自己積攢財寶在地上」，後面說「一個人不能事奉兩個主，你們不能又事奉神，又事奉瑪門」。
所以，這句話是在講錢。

希伯來文有一個成語：「好眼睛」（tov 'ayin）。
箴言說：「眼目慈善的，就必蒙福，因他將食物分給窮人。」
「好眼睛」就是慷慨。
相反，「壞眼睛」（ra' 'ayin）就是吝嗇——
箴言警告：不要吃惡眼人的飯，他嘴裡說「請吃請喝」，心卻不向著你。

你以為耶穌在講一種神秘的內在光照？
其實，祂在用一個大家都懂的成語，問一個很實際的問題：你慷慨嗎？

更妙的是，馬太在這裡沒有用「好」，而是用了 haplous——單純、真誠、一心。
它的反義詞是 diplous——雙重。
表面大方、心裡算計的人，就是「雙重」的眼睛。
新約裡，haplous 的名詞形式，常常就翻譯成「慷慨」。

舊約也常用「明亮的眼睛」形容生命與喜樂，用「昏花的眼睛」形容衰老與痛苦。
所以耶穌在說：
慷慨的人，像一盞亮著的燈，充滿生命；
吝嗇的人，眼睛漸漸昏暗，最後陷入孤獨的黑暗。

財富本身不是光也不是暗，愛財富勝過愛人才是黑暗；
擁有很多不一定危險，抓得很緊才危險；
吝嗇不只傷害別人，也慢慢熄滅自己裡面的光。

很多人以為財富代表神的祝福。
可是先知阿摩司和以西結都指出：以色列的富裕，常常是建立在欺壓窮人之上。
耶穌講財主和拉撒路的比喻：財主每天奢華宴樂，門口躺著一個滿身是瘡的窮人，他卻視而不見。
那就是一雙「壞眼睛」。

為什麼耶穌不直接說「要慷慨，不要吝嗇」？
也許因為比喻會讓人停下來想——
想很久，想到自己心裡去，直到我們不只是照著做，而是真的想要那樣活。

你最近一次慷慨地給出，是什麼時候？
你給的時候，心是單純的，還是在算計回報？
如果你的眼睛是一盞燈，它現在有多亮？

一層一層地點亮：
先察覺——我抓得有多緊；
再鬆手——給出一點點；
然後單純——不求回報地給；
最後發光——你的慷慨照亮了別人，也照亮了自己。

一盞燈的價值，
不在於它有多貴，
而在於它照亮了多少人。
願你的眼睛單純，
願你的全身，都是光。

"what-matthew-6-33-seek-first-the-kingdom-of-god-means":`【門鎖、密碼，與另一種安全感】

睡前，你檢查門有沒有鎖好；出門，你鎖上車門；
手機、電腦、銀行帳戶，都有密碼。
我們活在一個充滿威脅的世界，學會把安全放在一切之上。
這很合理。
但如果有一個地方，根本不需要門鎖呢？

真正的安全，不是來自把別人擋在外面，而是來自彼此相愛。

想像一個世界：沒有人會傷害你，每個人都愛你，你也愛每個人。
資源豐富，不需要囤積、不需要競爭。
沒有暴力，沒有威脅，沒有死亡。
沒有門鎖，沒有掛鎖，也沒有密碼。
在那樣的世界裡，你會怎麼生活？

耶穌說，那就是「神的國」。
祂說：「你們要先求祂的國和祂的義，這些東西都要加給你們了。」

你以為耶穌是在教一種更屬靈的方式，確保自己的生活無虞？
其實，祂是在邀請你，把愛放在自保之上。

回到創世記：人選擇用自己的智慧保護自己，結果被逐出園子，
進入一個需要門鎖、武器、圍牆的世界。
從此，「保護我和我的」成了人性的本能，甚至被當成一種美德。

馬太福音6:33的第一個字是「但」。
前面，耶穌描述了兩種人：一種憂慮吃什麼、喝什麼、穿什麼；
另一種相信天父知道他們需要什麼。
「但」你們，要先求祂的國。

在一世紀，「國」是一個真實的世界：有王、有百姓、有一種由王決定的生活方式。
壞的王帶來苦難，好的王帶來生命。
耶穌宣告：那位好王已經來了。

一般的國度說：先保護好自己，再去幫助別人；
神的國說：先去愛，你的需要天父知道；
世界的安全靠防備，神國的安全靠信任。

「這些東西都要加給你們」——注意，是「要」，不是「立刻」。
耶穌自己一生貧窮，最後還被殺害。
可是祂從來沒有失去安全感，因為祂知道，祂的生命在父的手中。

初代教會就這樣活：凡物公用，照各人所需分配，彼此給予，沒有恐懼。
保羅面對監禁和死亡，還能說：「死啊，你的毒鉤在哪裡？」
愛，比恐懼更有力量。

想活下去，不是錯。
耶穌在客西馬尼園也求過：「求你將這杯撤去。」
但祂接著說：「然而，不要照我的意思，只要照你的意思。」
那就是「先求祂的國」最真實的樣子。

你最近被什麼樣的憂慮主導了決定？
你是在跟同事競爭、討好別人、拚命掌控一個你控制不了的未來嗎？
如果你真的相信天父知道你需要什麼，你今天會怎麼活？

一層一層地放下：
先承認——我很害怕失去；
再信任——天父知道我的需要；
然後選擇——把愛放在自保之前；
最後經歷——一種連死亡都奪不走的平安。

有一天，所有的門鎖都會被拆下，
因為再也不需要了。
在那之前，
我們先學著打開心門——
神看顧我們，我們是安全的，也是被愛的。

"what-matthew-71-5-judge-not-lest-ye-be-judged-means":`【先看看自己眼中的那根梁木】

「不要論斷人！」——每當有人指出別人的問題，就有人搬出這句話。
可是，如果完全不能判斷，我們怎麼分辨對錯？怎麼保護孩子遠離危險？怎麼指出不公義？
耶穌真的是要我們什麼都不判斷嗎？

耶穌禁止的不是分辨是非，而是把自己當成神去定別人的罪。

「論斷」的希臘文是 krino，它有兩個意思：分辨，或者定罪。
耶穌說「不要論斷人」之後，緊接著教人怎麼處理弟兄的錯誤，又教人「憑果子認出他們」——
所以祂不是要人放棄分辨。
祂要禁止的，是一種態度：看不起別人，判定別人不夠好、比我低一等。

你以為「不要論斷」就是什麼都不能說？
其實，它是要你先把鏡子轉向自己。

有一次，一位叫西門的法利賽人請耶穌吃飯。
一個有壞名聲的女人走進來，跪在耶穌腳邊，用眼淚洗祂的腳，用頭髮擦乾，再抹上昂貴的香膏。
西門心裡想：「這人若是先知，一定知道摸祂的是個罪人。」

耶穌轉向西門，講了一個故事：
兩個人欠債，一個欠五百，一個欠五十，債主都免了。哪一個會更愛他？
西門說：免得多的那一個。
耶穌說：我進你的家，你沒給我水洗腳，沒親我，沒用油抹我的頭；
這女人卻一直用眼淚洗我的腳、親我的腳、用香膏抹我。

西門忙著數她的罪，卻看不見自己的冷淡；
女人知道自己需要赦免，所以愛得很多；
西門以為自己不需要，所以愛得很少。

這就是「你們怎樣論斷人，也必怎樣被論斷」——
耶穌把西門的審判，像鏡子一樣照回他自己身上。

接著，耶穌畫了一幅幽默的畫：
一個人眼睛裡卡著一根大梁木，卻忙著要幫弟兄挑出眼中的一根小刺。
注意：這段話大部分都在講自我省察，最後一句才說「然後你才能看得清楚，去掉弟兄眼中的刺」。
不是不能幫人，而是要先謙卑。

為什麼定罪別人那麼危險？
因為只有神能看見一個人內心的全部——他的悲傷、失望、渴望被看見、對未來的憂慮。
當我們看不起一個人，我們就在假裝自己是神。
而在伊甸園裡，人「自己決定善惡」，正是一切破碎的開始。

耶穌把整段教導總結成一句話：
「你們願意人怎樣待你們，你們也要怎樣待人。」

你最近心裡看不起誰？
當你自己跌倒時，你希望別人怎樣對待你？
你眼中有沒有一根梁木，大到你根本沒發現？

一層一層地轉向：
先停下——不急著下結論；
再照鏡子——看見自己的梁木；
然後謙卑——記得自己也是被赦免的人；
最後溫柔——用你希望被對待的方式，幫助別人。

當我們把手指向別人，
有三根手指指著自己。
願我們先低頭，
再伸手——
不是去指責，而是去扶起。

#BibleProject #不要論斷 #登山寶訓 #黃金律`

"what-narrow-gate-bible-matthew-713-14-meaning":`【窄門，不是更多的規條】

耶穌說：「我的軛是容易的，我的擔子是輕省的。」
可是祂又說：「你們要進窄門……引到永生，那門是窄的，路是小的，找著的人也少。」
到底是容易，還是困難？
跟隨耶穌，是讓人得安息，還是一場只有少數人能通過的嚴格考試？

寬路上不只有放蕩的人，也有自以為義的人。

很多人以為：窄路是道德的路，寬路是墮落的路；
做好事很難，做壞事很容易；
只有少數人夠好，大部分人都要滅亡。

你以為窄門與寬門，是好人與壞人的分界？
其實，耶穌在整篇登山寶訓裡，比較的是另一件事：外在的義，和內心的轉化。

舊約常用「兩條路」比喻生命與死亡：
該隱的門前，罪像野獸蹲伏著；
詩篇第一篇，義人的道路與惡人的道路；
以賽亞說，有人的腳奔跑行惡，平安的路他們不知道。

耶穌在登山寶訓裡說：你們聽見有話說「不可殺人」，只是我告訴你們，凡向弟兄動怒的，就難免受審判。
一個人可以一輩子沒殺過人，外表彬彬有禮，心裡卻充滿輕蔑、嫉妒、仇恨。
從外面看，他很虔誠；從裡面看，他正走在寬路上。

寬路很容易：只守住看得見的規矩，挑選對自己方便的條文，維持體面的形象；
窄路很難：讓神的話進到心裡最深處，連仇敵也不懷恨，願意為和好付代價。
寬路讓你看起來很好，窄路讓你真的變好；
寬路讓心慢慢變硬，窄路讓心慢慢變軟。

所以窄路不是更多的規條，而是一顆被改變的心。
走在這條路上的人，透過禱告和默想讓神的道進入內心，靠聖靈學習耶穌捨己的愛。
這條路帶來的，正是耶穌應許的安息——希伯來文 shalom，完整的平安。

但耶穌也誠實地說：這條路有代價。
「窄」這個字，在原文裡也帶著「患難、壓迫」的意思。
當你選擇不懷恨、選擇和好、選擇愛仇敵，有些人會不理解，你可能會被誤會、被排擠。
保羅說：現在的苦楚，比起將來要顯明的榮耀，就不足介意了。

你是否把信仰變成了一張「不做什麼」的清單？
你心裡是否藏著某種被包裝得很好的輕蔑？
你是否覺得自己沒做壞事，就已經走在窄路上？

一層一層地走進窄門：
先放下——外在的體面；
再打開——讓神看見你真實的心；
然後學習——像耶穌一樣愛每一個人；
最後抵達——那個沒有仇恨、只有平安的國度。

窄門不是為了把人擋在外面，
而是為了讓人放下多餘的行李。
你背著的驕傲和怨恨太大，進不去；
放下它們，
你會發現，門其實為你開著。

#BibleProject #窄門 #登山寶訓 #內心轉化`,

"who-has-god-chosen":`【被揀選，不是特權，是使命】

「神的選民」——這四個字，在歷史上引發過多少驕傲，也引發過多少傷害。
有人因此覺得自己比別人高一等；
有人因此覺得神偏心，只愛某一群人；
有人甚至問：舊約的神只愛以色列，新約的耶穌卻愛萬國，難道是兩個神？
萬國蒙愛，是不是神的「B計畫」？

神揀選一個，從來是為了祝福眾多。

所有這些問題，其實只需要回答一個問題：以色列被揀選，是「為了什麼」？

看神第一次揀選亞伯拉罕。
神說：我要叫你成為大國，賜福給你，叫你的名為大。
聽起來很像特權。
可是最後一句話說：「地上的萬族都要因你得福。」
神揀選一個家族，是要讓這個家族成為所有家族的祝福。

你以為「蒙揀選」就是比別人多得一些？
其實，蒙揀選是被交付一項任務——為了別人而存在。

再看西奈山。
神說：你們要在萬民中作屬我的子民。
接著說：「因為全地都是我的。你們要歸我作祭司的國度。」
祭司是什麼？是在兩方之間調和的人。
在這個故事裡，兩方是誰？是神，和萬國。

"who-is-the-angel-of-the-lord":`【看似矛盾的地方，正是入口】

讀舊約時，你可能會碰到一個奇怪的角色：「耶和華的使者」。
有時候，他說話像是神派來的信差，提到「耶和華」時像在說另一個人；
有時候，他說話的口吻又像神自己；
甚至故事最後，敘述者直接說：是耶和華對她說話。
這到底是筆誤，還是有意的安排？

經文看似矛盾的地方，常常是作者邀請你更深入的入口。

「使者」的希伯來文是 malak，意思就是信差。
可是這位「耶和華的使者」很特別——神對摩西說：「我的名在他裡面。」
他是唯一一位帶著耶和華名字的使者。

看夏甲的故事。
她懷著孕，被主母苦待，逃到曠野。
耶和華的使者在水泉旁找到她，對她說：「我必使你的後裔極其繁多。」
這種應許，通常只有神自己才會說。
接著他又說：「耶和華聽見了你的苦情。」——好像在講另一位。
然後經文說：夏甲稱那對她說話的耶和華為「看顧人的神」。

你以為這只是古代作者寫得不夠精確？
其實，同樣的模式在舊約裡一再出現。

在燃燒的荊棘裡，耶和華的使者向摩西顯現，接著是神從荊棘裡呼叫他；
亞伯拉罕要獻以撒時，耶和華的使者從天上呼叫，說「你沒有將你的兒子留下不給我」；
巴蘭、基甸、以利亞、大衛的故事裡，都有同樣的張力。

一次可能是巧合，兩次可能是疏忽，一再出現，就是刻意的設計。
好的故事會留下空白，邀請讀者參與、思考、追問。

既是神，又有別於神；
既是使者，又帶著神的名；
既在天上，又走進人間。

這種刻意的張力，到底要告訴我們什麼？

第一，它幫助我們理解耶穌那些聽起來矛盾的話：
「我與父原為一」，同時祂又是「子」，與父有別。
這不是新約突然冒出來的想法，舊約早已預留了空間。

第二，它為我們理解三位一體預留了「書架」：
耶和華是一位，卻是一位多元而合一的神，是一個愛的群體。

第三，它讓我們認識神的品格：
祂是超越萬有的神，卻願意以有形的樣子靠近人；
祂不只在遠方說話，祂親自走到曠野的水泉旁，找到一個被趕出來的女奴。
而這一切，最終在耶穌身上達到頂點——神成為人，好親近我們，也帶我們親近神。

你讀聖經時遇到難懂、看似矛盾的地方，是跳過去，還是停下來問？
你心中的神，是遙遠的、抽象的，還是會親自來找你的？
如果神願意在曠野找到夏甲，祂會不會也正在你的曠野裡？

一層一層地看見：
先是一個奇怪的使者，
再是一個重複的模式，
然後是一個關於神本質的奧秘，
最後，是那位道成肉身、親自來到我們中間的耶穌。

神不只是高高在上的那一位，
祂也是走到你身邊、叫你名字的那一位。
當你覺得被遺忘在曠野，
請抬起頭——
那位使者，可能已經站在水泉旁。

"why-did-god-flood-the-world":`【一位憂傷的神，和一場洪水】

很多人讀聖經讀到洪水，心裡就卡住了。
如果神是愛，為什麼要毀滅全地？
如果神是良善的，怎麼能看著那麼多人淹死？
這些問題，不該被輕輕帶過。它們應該讓我們睡不著，直到找到答案。

洪水不是一位任性的神在發怒，而是一位心碎的神，在攔阻失控的惡。

洪水的故事，要放在創世記一到十一章的脈絡中讀。
人吃了禁果後，惡開始擴散：
該隱殺了弟弟亞伯；
他的後代拉麥誇耀自己殺人，還要報復七十七倍；
暴力充滿全地。
然後經文說：「耶和華見人在地上罪惡很大，終日所思想的盡都是惡。」
接著是一句很少被注意的話：「耶和華就後悔造人在地上，心中憂傷。」

你以為神是帶著怒氣發動洪水？
其實，經文首先強調的，是神的心碎。

洪水被描寫成一場「反創造」：
天上的窗戶開了，深淵的泉源裂開了，世界回到起初混沌的水中。
神原本為人預備一個興旺的世界，人卻把它變成了暴力的舞台。

這裡有三個值得注意的觀察。
第一，洪水是一種公義的憐憫——攔阻人類一路滑向徹底的邪惡。
第二，它出於憂傷，不是報復——神從不以毀滅為樂。
第三，故事的高潮不是洪水，而是聖約。
後來先知以賽亞想起挪亞時，想到的不是滅絕，而是神的誓言：「我必不再使洪水漫過遍地。」

挪亞像一個新的亞當，被安置在山上，被吩咐生養眾多。
可是很快地，他喝醉了，家族又開始散播惡。
那麼，挪亞的故事怎麼推進神的救贖計畫？

耶穌曾說：「我有當受的洗還沒有成就，我是何等的迫切呢？」
祂不是已經受過洗了嗎？
原來，十字架就是祂要受的「洗」——祂要沉入死亡的洪水。

在挪亞的故事裡，義人得救，惡人滅亡；
在耶穌的故事裡，惡人得救，義人沉沒；
挪亞躲進方舟才活下來，耶穌卻自己成了方舟——
不只為了一個家庭，而是為了全受造界。

洪水很暴力，但它不是一位暴力之神的作為。
這位神最後成了肉身，死在暴力的人手中，
又用這場死亡，拯救了祂的敵人，開啟一個和平的國度。

你是否也因為聖經裡的暴力，對神產生懷疑？
你是否想過，神看見世界的惡時，心中是憂傷的？
如果神願意親自走進死亡的洪水，祂會不會也願意走進你的黑暗？

一層一層地看懂：
先看見惡的擴散，
再看見神的憂傷，
然後看見神的約，
最後看見那位沉入洪水、又從死裡上來的耶穌。

難解的經文，
不是信心的敵人。
當你願意停下來，帶著謙卑去問，
它們可能會帶你走到，
比你原本想的更深的愛裡。

#BibleProject #洪水 #挪亞 #聖經中的暴力`

"why-deuterocanon-apocrypha-some-bibles-and-not-others":`【為什麼我的聖經和你的不一樣？】

你在朋友家看到一本聖經，翻開目錄，發現裡面多了好幾卷你沒聽過的書：多比傳、猶滴傳、馬加比書、所羅門智訓……
你愣住了：是他的聖經印錯了，還是我的少了幾本？
哪一本才是「真正的」聖經？

基督徒從來沒有在所有時代都完全同意聖經應包含哪些書，但這並沒有讓神的話失去力量。

今天的新教聖經有66卷；天主教聖經多了幾卷；東正教又再多一些。
有趣的是：三者的新約完全一樣，差異全在舊約。

先說希伯來聖經。
經過大約一千年的書寫與編輯，在主前四到二世紀間，一群被擄歸回的文士與先知，把以色列的經卷整理成 TaNaK——律法、先知、著作。
新教的舊約和它內容相同，只是排列與分卷不同。

你以為多出來的那幾卷，是後來某個教會擅自加上去的？
其實，它們是一群熱愛聖經的猶太人寫的。

TaNaK 成書後，猶太人熱切地研讀、默想它，於是寫出了大量新作品——
歷史、智慧書、啟示文學、詩歌、重述舊約的故事。
這些書被稱為「第二聖殿時期猶太文學」，作者們可以說是一群「聖經迷」。
死海古卷顯示，有些群體很重視以諾書、禧年書，抄本數量甚至比某些舊約書卷還多。
在書卷時代，「書內」與「書外」的界線，不像今天印成一本書時那麼清楚。

耶穌和使徒引用希伯來聖經時，常說「經上記著」「聖靈說」；
他們也引用或化用這些較晚的作品——保羅在羅馬書第一章、猶大書引用以諾書——
但他們談論這些書的方式，和談論希伯來聖經不同。

教會歷史裡也一直有不同聲音：
耶柔米學了希伯來文，主張舊約應該和希伯來聖經一樣；
奧古斯丁則認為，教會用了幾百年的擴充版希臘文聖經，也是聖靈所定。
最古老的幾部聖經抄本，都包含這些額外的書卷。

宗教改革初期，路德聖經、日內瓦聖經、1611年欽定本都附有「次經」。
後來因為贖罪券的爭議——有人引用馬加比二書支持為死人禱告——
新教漸漸把這些書移除；天主教則在天特會議正式確認它們為「第二正典」。

有人看見分歧就失去信心，有人看見歷史就更加謙卑；
有人急著證明自己的版本才對，有人願意去理解別人的傳統；
差異可以製造牆，也可以打開窗。

你是否曾因為不同教派的差異，對聖經產生懷疑？
你是否知道，自己手上這本聖經，是經過多少世代的人用心抄寫、保存、爭論才來到你手中？
你願意讀一讀那些你不熟悉的書，認識耶穌當時的世界嗎？

一層一層地認識：
先是希伯來聖經成形，
再是一大批熱愛聖經的猶太作品，
然後是教會兩千年的傳承與爭論，
最後，是你今天手中的這本書。

不同傳統的人，對這些書的地位看法不同；
但大家可以一起承認：它們幫助我們更了解耶穌的時代。
真理不怕被仔細檢視，
它只怕被我們用驕傲，
關在一個太小的盒子裡。

"why-did-jesus-have-to-die-a-question-worth-unpacking":`【祂死，是因為祂愛】

如果你問五個人：「耶穌為什麼要死在十字架上？」
你可能會聽到十幾種答案：
為了赦罪、為了戰勝死亡、為了做我們的榜樣、為了滿足公義……
每一個答案，又引出更多的問題。
那麼，最核心的答案是什麼？

耶穌選擇死，是因為神愛人。

新約常說：耶穌「為我們」死。
「為」這個字，在希臘文裡有好幾層意思：
為了我們的好處、代替我們、代表我們、因為我們。
也許，全都是。

保羅說：基督「照聖經所說」為我們的罪死了。
他指的是舊約。所以要明白耶穌的死，得先回到我們為什麼會死。

創世記說：神用地上的塵土（adamah）造人（adam），把生命的氣吹進去，然後把人安置在一個園子裡。
那個園子是神的家，是沒有死亡的地方。
園外的世界也美好，但一切都有期限——從塵土來，回到塵土去。
神給人選擇：吃生命樹，就是信靠神的智慧，永遠活著；
吃分別善惡樹，就是信靠自己的智慧，必定死。

人選了後者，被送回園外，回到塵土之地。
你以為神從此和人斷絕關係？
其實，故事才剛開始。

神在伊甸東邊安設基路伯和發火焰的劍，把守回去的路。
這造成一個矛盾：人要回到生命，似乎必須穿過那把劍——也就是，必須死。

神沒有放棄。
祂讓以色列建造會幕，後來是聖殿——裡面滿是伊甸的意象：石榴、杏花、橄欖樹，幔子上繡著基路伯，祭壇的火燃燒在中間，就像當年的火焰劍。
然後神設立了獻祭：一隻無瑕疵的動物，代替一個有罪的人獻上生命；
祭司帶著牠的血，穿過那條危險的界線，進入至聖所，向神求憐憫。
神說：「我把這血賜給你們。」——這是神自己設計的方法，一種勝過死亡的死。

然後，約翰說：道成了肉身，「支搭帳幕」住在我們中間。
神親自來到園子外面，和我們一起住在塵土裡——也和我們一起死。
保羅說：祂無罪，卻替我們成為罪。
祂穿過那把火焰劍。
在祂斷氣的那一刻，聖殿裡繡著基路伯的幔子，從上到下裂成兩半。
回家的路，開了。

人從園子裡被送出來，神從天上走進來；
人因為想活而失去生命，神因為愛而交出生命；
獸祭只能暫時遮蓋，耶穌卻永遠打開。

三天後，祂從死裡復活——一個真實的人，帶著釘痕。
祂讓我們看見：死亡不是終點。
而對死亡的恐懼，正是那條古蛇的謊言——
它讓我們囤積、讓我們爭鬥、讓我們把犁頭打成刀劍。
當這份恐懼被愛取代，我們就能開始饒恕、祝福、慷慨地活。

你最害怕的是什麼？
那份恐懼，是不是正在決定你怎麼對待別人？
如果死亡已經不是終點，你今天會怎麼活？

一層一層地明白：
先是伊甸的失落，
再是會幕的獻祭，
然後是十字架上的死亡與裂開的幔子，
最後是空墳墓——愛勝過死亡。

關於十字架，還有很多問題可以問，
但答案的中心，始終只有一句：
「基督在我們還作罪人的時候為我們死，
神的愛就在此向我們顯明了。」

"why-did-jesus-rise-on-the-third-day":`【為什麼是第三天？】

耶穌在週五被釘十字架，週日復活。
為什麼不是第二天，也不是第四天？
復活就是復活，晚一天、早一天，有什麼差別嗎？
可是耶穌在福音書裡提到「三天」，竟然有二十一次。
這個數字，一定有它的意義。

第三天，是神在聖經中一再選擇創造新生命、確立聖約的日子。

回到聖經的第一頁。
創世記第一章，第三天：神讓旱地露出來，地上長出青草、菜蔬、結果子的樹——
生命，從原本沒有生命的地裡冒出來。
第六天——第二個「第三天」：神讓地生出活物，又用塵土造人。
人和樹一樣，從地裡被造出來，都會結果子。
但人更特別：神照自己的形像造他，並與他立約、賜福給他。

這裡出現了一個模式：
從沒有生命的地方，神創造新生命；
神與新造的生命立約；
這一切發生在高處——伊甸，一座有河流流出的山上園子。

你以為「第三天」只是時間的記錄？
其實，它是聖經作者埋下的一條線，一再出現。

亞伯拉罕被神要求獻上獨生子以撒。
經文說：「第三天，亞伯拉罕舉目遠遠地看見那地方。」
在山上，神預備了一隻公羊代替以撒——以撒「復活」般地被還給父親；
神再次確認那個約：你的後裔要如天上的星，萬國要因他得福。
又是第三天，又是新生命，又是聖約，又是一座山。

以色列出埃及後來到西奈山。
神說：第三天我要降臨。——這一章裡「第三天」出現了四次。
在山上，以色列得到一個新身分：祭司的國度；神與他們立約。
又是第三天，又是新生命，又是聖約，又是一座山。

可是以色列一再背約。
先知何西阿呼喊：歸向耶和華吧！「第三天祂必使我們興起，我們就在祂面前得以存活。」
先知約拿違背神，被大魚吞下，在魚腹中三日三夜，然後被吐到岸上——也許是聖經裡最奇特的「復活」。

然後，耶穌說：約拿怎樣三日三夜在魚腹中，人子也要這樣三日三夜在地裡頭。
祂在一座山丘上被釘死，被埋進地裡；
第三天，祂從墳墓——從地裡——復活了；
並且藉著祂的死與復活，設立了新約。

創造的第三天，生命從地裡長出；
摩利亞的第三天，兒子被還給父親；
西奈的第三天，奴隸成了祭司；
復活的第三天，死亡被打敗。

所以，復活節不只是一個傳統節日。
它是神從起初就一再顯明的模式，在耶穌身上達到高峰——
而這個模式還沒結束：它最後會臨到所有跟隨耶穌的人，臨到整個受造界。

你是否正處在人生的「第一天」或「第二天」？
失去了什麼，被埋葬了什麼，四周一片寂靜？
如果神總是在第三天行事，你願不願意再等一等？

一層一層地看見：
從創造，
到摩利亞山，
到西奈山，
到先知的盼望，
最後，到那個空了的墳墓。

週五的黑暗是真的，
週六的寂靜也是真的。
但請記得——
在聖經裡，
第三天總會來。

"why-leviticus-is-worth-your-time":`【最多人讀不下去的那卷書】

讀經計畫的第三卷，往往是許多人放棄的地方。
創世記有故事，出埃及記有神蹟，然後就是利未記：
獻祭的條例、潔淨與不潔、皮膚病、霉菌、節期……
讀著讀著，不是困惑，就是睡著。
這卷書，真的和我們有關係嗎？

利未記不是一份規條清單，而是一個關於神想要和人同住的故事。

先看它放在哪裡。
出埃及記最後一幕：會幕建好了，神的榮光充滿帳幕——可是摩西進不去。
民數記第一句話：耶和華在會幕中對摩西說話——摩西已經在裡面了。
中間發生了什麼？
答案就在利未記。

你以為利未記是一堆繁瑣的宗教規定？
其實，它是一座橋——從「進不去」到「住進來」的橋。

利未記的第一句話是：「耶和華從會幕中呼叫摩西。」
人進不去，神就從裡面呼喚。

第一個樂章（1–7章）：修復關係。
神設立了獻祭與贖罪的制度。
今天聽起來很奇怪——動物獻祭？
但它讓人用眼睛看見、用鼻子聞到、用手觸摸到：罪的代價是什麼，破碎的關係要付出什麼。
同時，也讓人經歷被饒恕的釋放。
後來，施洗約翰指著耶穌說：「看哪，神的羔羊，除去世人罪孽的！」

第二個樂章（8–16章）：恢復空間。
「聖潔」不只是道德好，而是屬於神、與死亡和敗壞分開。
潔淨的條例，讓會幕和進去的人暫時潔淨，好讓神能與人相會。

第三個樂章（17–27章）：改造百姓。
神給以色列一種新的生活方式，讓他們成為列國中神的代表。
就在這段看似枯燥的律法中間，出現了一句後來被耶穌稱為第二大的誡命：「要愛人如己。」
還有節期——不是建議，是規定。
神把「愛鄰舍」和「一起開派對紀念神的作為」，都列為必須做的事。
所有節期，都圍繞著安息日：停下來，相信神會供應，進入祂的安息。

人以為律法是隔開人與神的牆，利未記說它是讓人回家的路；
人以為聖潔是遙不可及，利未記說神要住在人中間；
人以為獻祭是殘酷，利未記說罪的代價本來就那麼沉重——而神親自預備了出路。

你是否也曾跳過利未記，覺得它和你無關？
你是否也覺得，靠近神是一件很遠、很難的事？
如果神從會幕裡主動呼叫摩西，祂會不會也正在呼喚你？

一層一層地走進去：
先是罪被遮蓋，
再是空間被潔淨，
然後是生活被改造，
最後是人與神一同安息。

利未記讀起來很慢，
但每一頁都在說同一件事：
神想要和你住在一起。
而耶穌，獻上了最後的祭，
把那扇門永遠打開。
