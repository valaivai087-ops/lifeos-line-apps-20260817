</style><aside><div class="seal">厚德載物</div><div class="small">知 行 之 境</div><nav id="nav"><button data-view="home" class="active">◈　能力地圖</button><button data-view="all">☷　完整對話</button><button data-view="search">⌕　搜尋內容</button><button data-view="saved">♡　我的收藏</button><button data-view="journal">✎　行動筆記</button><button data-view="lens">◎　哲學視角</button></nav><div class="asidefoot small">在生活之中理解，<br>在行動之中顯現。<br><br>私人閱讀空間 · 2026</div></aside><main><header><span>個人對話知識庫 / 厚德載物解析</span><a href="https://chatgpt.com/c/6ad7f147-0738-83ec-b91e-921b197a3e6d" target="_blank" rel="noopener">原始對話 ↗</a></header><div id="app"></div><footer>內容取自指定對話的頁面文字快照。原文保留其表述；哲學視角為另加的閱讀提問。收藏與筆記儲存在此瀏覽器。</footer></main><script>const DATA = "分享\n你說：\n上面每個點的金句各列出10個\nChatGPT 說：\n寫作\n厚德載物｜18大核心能力 × 180句生命智慧金句\n\n核心架構：厚＝認知深度、心理韌性、結構彈性、更新能力。\n德＝內在價值、品格穩定、能力顯現。\n載＝承擔能力、整合能力、調節能力、轉化能力。\n物＝責任管理、關係經營、資源配置、衝突處理、機會辨識、成果生成。\n終極能力＝長期價值生成。\n以下180句為依據上述能力架構創作的原創金句，並非古籍原文。\n\n一、厚｜內在結構的四大能力\n01｜認知深度：看見表象背後的結構\n\n01．看見現象，是知識；看見關係，是理解；看見系統如何運作，才是智慧。\n02．認知淺的人急著尋找答案，認知深的人先檢查問題是否問對。\n03．你看見的世界，不只是世界本身，也是你的認知模型所允許你看見的世界。\n04．真正限制你的，不一定是資訊不足，而是你不知道自己忽略了哪些資訊。\n05．一個答案可以解決眼前的問題，一套結構才能解釋反覆出現的問題。\n06．當你只能看見對錯，世界充滿敵人；當你開始看見變數，世界出現新的可能。\n07．低維思考急著找出誰錯了，高維思考先追問什麼機制讓錯誤持續發生。\n08．知識讓你知道事情發生了什麼，智慧讓你理解事情為何發生，以及何時可能改變。\n09．真正的認知升級，不是把原本的答案說得更漂亮，而是發現原本沒有看見的問題。\n10．世界的複雜度不會因為你的理解不足而降低，但你的理解可以因為持續更新而深化。\n\n02｜心理韌性：在壓力中保留選擇能力\n\n01．真正的堅強，不是永遠不倒下，而是倒下之後仍能找到恢復的路。\n02．情緒可以告訴你哪裡受傷，卻不必替你決定人生方向。\n03．韌性不是把痛苦吞下去，而是讓痛苦不再擁有全部的控制權。\n04．一個人最深的力量，不是控制所有事情，而是面對不可控時仍能選擇下一步。\n05．成熟不是失去脆弱，而是知道脆弱時如何保護自己。\n06．當你不再把一次失敗解讀成整個人生的失敗，韌性便開始生成。\n07．真正的勇敢，不是沒有恐懼，而是能辨識恐懼、評估風險，再決定是否前進。\n08．壓力可以揭露結構的弱點，但不代表你必須靠不斷受苦才能成長。\n09．能夠休息的人，不一定比努力的人弱；懂得恢復的人，才有機會走得長遠。\n10．心理韌性的最高表現，不是承受無限壓力，而是知道何時堅持、何時求助、何時離開。\n\n03｜結構彈性：不被單一路徑綁架\n\n01．真正的自由，不是永遠走自己熟悉的路，而是發現那條路失效時仍能轉向。\n02．固執把方法當成身分，彈性把方法當成工具。\n03．當你只有一個答案，任何反對都像威脅；當你擁有多種可能，差異便成為資訊。\n04．成熟的結構不是永遠不變，而是在變動中仍能保留核心價值。\n05．一個人最危險的時刻，不一定是沒有選擇，而是誤以為自己沒有其他選擇。\n06．真正的穩定，不是拒絕變化，而是擁有適應變化的能力。\n07．放棄失效的方法，不等於放棄目標；重新選擇路徑，也可以是一種堅持。\n08．認知僵化的人努力證明過去正確，結構彈性的人努力尋找現在有效的方法。\n09．有彈性的生命，不會因為一扇門關閉，就認定整個世界沒有出口。\n10．你不必永遠忠於昨天的選擇，但可以始終忠於今天更清楚的價值。\n\n04｜更新能力：讓現實修正舊模型\n\n01．成長不是不再犯錯，而是讓同一種錯誤不再無限重演。\n02．真正的智慧，不是永遠預測正確，而是預測錯誤後能迅速修正。\n03．當現實與信念衝突，成熟的人願意重新檢查信念，而不只是責怪現實。\n04．舊模型曾經保護你，不代表它永遠適合你。\n05．沒有回饋的努力可能只是重複，有回饋的修正才可能累積能力。\n06．承認不知道，是知識更新的入口；承認判斷錯誤，是智慧成長的開始。\n07．真正的自由，是不必用一生去維護一個早已失效的答案。\n08．每一次預測誤差，都是現實提供的校正訊號，而不是對你價值的否定。\n09．昨天的成功經驗可以成為資產，也可能在環境改變後成為限制。\n10．人生最重要的升級，不是增加更多確定感，而是提升面對不確定性的更新能力。\n\n二、德｜價值顯現的三大能力\n05｜內在價值：知道什麼值得守護\n\n01．價值不是你口中最重視的事，而是資源有限時你仍然願意優先守護的事。\n02．當利益與原則衝突，你的選擇便揭露真正的價值排序。\n03．沒有價值方向的能力，可能讓人走得更快，卻不保證走向值得抵達的地方。\n04．真正的自由，不只是能做想做的事，更是有能力拒絕違背核心價值的事。\n05．別人可以決定是否欣賞你，卻不應獨占你對自身價值的判斷權。\n06．價值不是用來要求別人服從的口號，而是用來約束自己行動的原則。\n07．當你不知道什麼最重要，任何眼前的誘惑都可能成為人生的方向。\n08．有些東西可以交換，有些原則不能出賣；知道差別，才有真正的選擇。\n09．人生不是把所有想要的東西都得到，而是知道哪些東西值得付出代價。\n10．內在價值愈清楚，外界的掌聲與批評就愈不容易完全決定你的方向。\n\n06｜品格穩定：在壓力下守住原則\n\n01．沒有利益衝突時談誠信很容易，真正的考驗是誠信需要付出代價的時候。\n02．品格不是別人看見時的表現，而是沒有觀眾時仍願意遵守的原則。\n03．一個人的可靠，不在於承諾多麼動聽，而在於承諾如何被履行。\n04．真正的謙卑，不是貶低自己，而是有能力承認自己可能錯了。\n05．善良若只存在於語言，還不是成熟的品格；善良需要透過選擇接受檢驗。\n06．真正的誠實，不是永遠說出自己想說的話，而是尊重事實，也承擔表達的責任。\n07．品格的厚度，不在於從未犯錯，而在於犯錯後是否願意負責與修復。\n08．一個人如何對待無法帶來利益的人，往往比他如何討好權勢更能揭露品格。\n09．原則不是拿來控制別人的武器，而是面對誘惑時用來提醒自己的界線。\n10．真正穩定的品格，不需要每天宣告自己是好人，而會在長期行動中留下證據。\n\n07｜能力顯現：讓知識轉化為貢獻\n\n01．知道很多，不等於能解決問題；能把知識轉化為行動，才開始形成能力。\n02．能力的價值，不只在於你會做什麼，也在於你讓哪些問題得到改善。\n03．真正的專業，不是讓別人覺得你高深，而是讓複雜問題變得更容易理解與處理。\n04．知識停留在腦中，是潛能；知識進入現實並產生效果，才成為可見的貢獻。\n05．一個人不必無所不能，但應知道自己的能力邊界在哪裡。\n06．能力不是用來證明自己比別人高，而是用來增加自己與他人的可行選擇。\n07．真正的價值創造，不是把自己的努力說得多辛苦，而是確認問題是否真的改善。\n08．當你的經驗可以整理成別人也能使用的方法，個人能力便開始產生擴散效益。\n09．有能力卻沒有責任感，可能放大風險；有善意卻沒有能力，也可能無法真正幫助人。\n10．德的顯現，不只是心中想成為怎樣的人，更是你的行動讓世界發生了什麼改變。\n\n三、載｜承載現實的四大能力\n08｜承擔能力：知道哪些責任值得承擔\n\n01．真正的承擔，不是把所有問題扛在身上，而是清楚知道哪些責任屬於自己。\n02．能夠拒絕不合理的要求，不是缺乏責任感，而是保護合理責任的完成能力。\n03．承擔不是犧牲自己到耗盡，而是讓責任與能力保持可持續的平衡。\n04．一個人愈成熟，愈能分清幫助別人與替別人活著的差別。\n05．真正的力量，不是什麼都自己做，而是知道何時合作、授權與求助。\n06．責任不是用來證明自己值得被愛，而是對自己選擇與承諾的回應。\n07．沒有界線的承擔，可能讓善意變成負擔，也讓別人失去成長的機會。\n08．有能力承擔，不代表有義務承擔所有事情。\n09．真正可靠的人，不是永遠答應，而是清楚承諾並盡力履行。\n10．厚德載物不是背負全世界，而是有智慧地承擔自己應當承擔的世界。\n\n09｜整合能力：讓分散資源形成系統\n\n01．資源多，不代表力量大；能讓資源彼此配合，才可能形成真正的系統優勢。\n02．低效的人不斷增加工作，高效的人先檢查工作之間能否整合。\n03．一個人最有價值的能力之一，是讓原本分散的知識開始彼此連結。\n04．整合不是把所有東西堆在一起，而是找到它們之間真正有用的關係。\n05．當資訊沒有結構，愈多可能愈混亂；當資訊形成系統，知識才更容易被使用。\n06．真正的協作，不是每個人都做同樣的事，而是不同能力形成互補。\n07．系統的力量，不只來自個別節點的優秀，也來自節點之間的有效連結。\n08．資源不足時，整合可以增加選擇；資源充足時，整合可以減少浪費。\n09．真正的整合者，不是控制每個人，而是讓不同角色在共同目標下發揮能力。\n10．一個人的智慧，不只看他擁有多少知識，也看他能把多少知識轉化成有用的連結。\n\n10｜調節能力：在變動中維持穩定\n\n01．真正的穩定，不是沒有波動，而是波動出現時仍有調整與恢復的能力。\n02．不懂調節的人只能不斷加碼，懂得調節的人知道何時增加、減少或停止。\n03．一個系統最危險的時候，不一定是資源不足，而是警訊已經出現卻無法修正。\n04．成熟不是永遠保持高強度，而是知道什麼節奏能讓自己持續前進。\n05．沒有緩衝的效率，可能只是尚未遇到衝擊的脆弱。\n06．情緒需要調節，關係需要調節，資源需要調節，人生也需要調節。\n07．真正的自律，不是把自己逼到極限，而是建立能長期維持的運作節奏。\n08．當你開始辨識早期警訊，就不必等到系統崩潰才開始修復。\n09．調節不是放棄目標，而是調整速度、強度與方法，使目標更有機會實現。\n10．能夠持續修正的生命，比只能維持表面完美的生命更有韌性。\n\n11｜轉化能力：把經驗轉化成新價值\n\n01．經歷本身不保證成長，經歷被理解、整理與實踐後，才可能轉化為智慧。\n02．痛苦不是成長的必要證明，但痛苦發生後，我們仍可以尋找修復與學習的可能。\n03．真正的轉化，不是替失敗找漂亮理由，而是讓失敗改善下一次的選擇。\n04．當你能把個人經驗變成別人也能使用的方法，生命便產生新的價值。\n05．一個問題若反覆出現，就值得從單次處理升級為系統改善。\n06．資訊可以被收藏，知識可以被整理，智慧則需要在現實中接受檢驗。\n07．轉化能力讓人不只消耗資源，也能重新組合資源並創造新的可能。\n08．真正的生命資產，不只是你得到過什麼，而是你從經驗中建立了哪些可持續的能力。\n09．當你不再只問為什麼發生在我身上，而開始問現在有哪些可行選擇，轉化便有了入口。\n10．生命的深度，不只取決於經歷多少事情，也取決於你如何理解、修正與運用這些經歷。\n\n四、物｜現實世界的六大能力\n12｜責任管理：讓承諾與能力匹配\n\n01．責任感不是答應所有要求，而是讓重要承諾真正得到完成。\n02．當責任沒有排序，每一件小事都可能吞噬真正重要的事。\n03．真正成熟的人，不會用過度忙碌證明價值，而會用清楚的成果檢驗投入。\n04．你可以關心很多人，但不能因此忽略自己也是需要被照顧的人。\n05．責任需要界線，界線保護責任，兩者不是敵人。\n06．沒有權限卻承擔全部結果，往往不是負責，而是責任結構失衡。\n07．真正的責任管理，是讓該負責的人有能力、有資源，也有相應的決策權。\n08．一個人不能決定所有結果，但可以對自己的選擇、準備與行動負責。\n09．懂得重新協商承諾，不一定是不守信用，也可能是對現實限制的誠實。\n10．責任的價值，不在於你背負多少，而在於你完成了多少真正值得承擔的事。\n\n13｜關係經營：在尊重與界線中建立連結\n\n01．真正的愛，不是把對方變成自己想要的樣子，而是尊重彼此作為獨立個體的存在。\n02．理解一個人，不代表必須認同他的所有選擇。\n03．沒有界線的親密，容易變成控制；沒有尊重的付出，容易變成交換。\n04．成熟的關係，不是永遠沒有衝突，而是能安全地表達差異並處理問題。\n05．真正的信任，不是要求對方永遠相信，而是透過可靠行動逐漸建立。\n06．你可以陪伴別人成長，卻不能代替別人完成他自己的生命功課。\n07．關係中的自由，不是彼此毫無責任，而是不以控制代替承諾。\n08．愛不是無限容忍傷害，真正健康的愛需要尊重、安全與清楚界線。\n09．一段關係是否成熟，不只看彼此多麼需要對方，也看雙方能否保有自主與尊嚴。\n10．真正的連結，不是兩個人互相吞沒，而是兩個完整的人願意共同創造價值。\n\n14｜資源配置：讓有限投入產生長期價值\n\n01．人生最大的浪費，不一定是沒有資源，而是把珍貴資源持續投入錯誤方向。\n02．時間不會因為你很忙就變多，價值也不會因為你很累就自動增加。\n03．真正的效率，不是做完更多事 11．產品交貨延誤｜舊：要求會員等待→新：主動通知、提供選擇與合理處理→德：尊重權益。\n12．家庭照顧負荷過重｜舊：一人硬撐→新：協商分工與外部支持→德：維持照顧品質。\n13．學生不喜歡閱讀｜舊：強迫閱讀同一教材→新：提供難度與主題選擇→德：提升參與。\n14．原有職涯受AI影響｜舊：拒絕新工具→新：重新組合專業與AI能力→德：持續學習。\n15．關係進入僵局｜舊：認為只有忍耐或爭吵→新：考慮界線、協商、諮詢或分開→德：保護自主。\n16．健康計畫難以維持｜舊：直接放棄→新：降低難度並調整時間→德：建立可持續習慣。\n17．學生團體活動失敗｜舊：取消所有活動→新：改變分組與規則→德：持續改善。\n18．收入來源過度集中｜舊：依賴單一客戶→新：在可控風險下發展多元收入→德：提升韌性。\n19．生活節奏被打亂｜舊：認定整天毀了→新：保留核心任務並重新排序→德：適應現實。\n20．人生角色發生變化｜舊：堅持過去身分→新：重新學習並建立新定位→德：擴展生命可能。\n本項最小行動：針對一個問題設計三條可行路徑。\n\n04｜更新能力：從維護舊信念走向誤差修正\n\n01．學生測驗未進步｜舊：責怪不努力→新：檢查題型、教法與練習方式→德：改進教學。\n02．產品回購率下降｜舊：增加促銷→新：分析體驗、需求與服務品質→德：改善價值。\n03．投資判斷錯誤｜舊：尋找藉口→新：記錄原假設與錯誤變數→德：降低重犯。\n04．與孩子溝通失敗｜舊：認為孩子不聽話→新：檢查語氣、時機與需求→德：改善關係。\n05．工作計畫延誤｜舊：要求更努力→新：修正時間估計與流程→德：提高可靠性。\n06．健康習慣無效｜舊：盲目增加強度→新：檢查執行方式、適配性與客觀指標→德：避免無效投入。\n07．教學APP使用率低｜舊：認為學生懶→新：觀察介面、難度與使用障礙→德：優化工具。\n08．會員反應文章難懂｜舊：認為會員程度不足→新：降低術語並增加例子→德：改善溝通。\n09．家庭預算超支｜舊：只責怪花費者→新：修正預算假設與支出分類→德：共同管理。\n10．孩子對建議反感｜舊：重複說服→新：檢查是否忽略自主需求→德：尊重成長。\n11．合作專案失敗｜舊：認定夥伴不可靠→新：檢查目標、分工與回饋制度→德：改善合作。\n12．原本有效的方法失靈｜舊：加倍執行→新：檢查環境是否已經改變→德：適應新條件。\n13．閱讀文章被指出錯誤｜舊：急著辯護→新：核對原始資料並更正→德：尊重真實。\n14．學生持續犯同一錯誤｜舊：增加罰寫→新：定位錯誤概念並重新教學→德：改善學習。\n15．生活計畫常常失敗｜舊：責怪意志力→新：調整目標大小與環境提示→德：提升執行率。\n16．人際關係反覆衝突｜舊：認定總遇到壞人→新：檢查界線、互動模式與選擇→德：增加自主。\n17．經營成本增加｜舊：直接提高售價→新：檢查供應鏈與流程效率→德：公平經營。\n18．決策過度樂觀｜舊：忽略失敗可能→新：加入最差情境與風險預案→德：審慎負責。\n19．學生學習數據異常｜舊：直接判定退步→新：確認樣本、題目難度與測量誤差→德：避免誤判。\n20．長期目標不再適合｜舊：因沉沒成本繼續→新：重新評估價值、成本與替代方案→德：保持自由。\n本項最小行動：記錄一個預測誤差，提出一個模型修正方案。\n\n寫作\n二、德｜內在價值、品格穩定、能力顯現\n05｜內在價值：從外部認同走向價值自主\n\n01．朋友邀請高消費聚會｜舊：怕被排擠而勉強參加→新：依預算與個人需求決定→德：自主選擇。\n02．同事要求幫忙說謊｜舊：為維持關係而答應→新：拒絕不實陳述→德：守護誠信。\n03．孩子選擇冷門科系｜舊：只看社會地位→新：評估興趣、能力與未來發展→德：尊重自主。\n04．團購產品利潤很高｜舊：只看獲利→新：先確認品質、資訊與適配性→德：負責經營。\n05．主管要求美化數據｜舊：為升遷配合→新：如實呈現結果→德：誠實可靠。\n06．家人要求無限付出｜舊：害怕被說自私→新：說明可承擔範圍→德：善良有界線。\n07．網路流行炫耀財富｜舊：跟著比較→新：依自己的財務目標生活→德：不受虛榮支配。\n08．學生為分數想作弊｜舊：認為成績最重要→新：選擇誠實作答並補強能力→德：守護學習價值。\n09．朋友要求加入排擠｜舊：為融入團體而附和→新：拒絕傷害他人→德：獨立判斷。\n10．伴侶要求放棄工作｜舊：為維持關係直接犧牲→新：討論雙方需求與自主權→德：尊重平等。\n11．長輩要求照傳統生活｜舊：完全服從→新：理解傳統後自主選擇→德：尊重而不盲從。\n12．有人提供不透明的投資機會｜舊：只看高報酬→新：要求資訊、評估風險→德：審慎負責。\n13．孩子希望獲得昂貴禮物｜舊：用購物證明愛→新：討論需求、預算與替代方案→德：理性關愛。\n14．學生希望老師直接給答案｜舊：為討好學生立即提供→新：引導學生自行思考→德：重視能力成長。\n15．朋友要求分享私人資訊｜舊：怕得罪而透露→新：保護當事人隱私→德：尊重信任。\n16．工作機會薪水高但違背原則｜舊：只看待遇→新：同時評估倫理與長期代價→德：價值一致。\n17．社群流行誇大健康功效｜舊：跟風宣傳→新：區分研究證據與行銷說法→德：尊重消費者。\n18．孩子成績優異卻不快樂｜舊：只要求維持排名→新：同時關心身心狀態→德：重視完整的人。\n19．親友嘲笑自己的選擇｜舊：立即改變以求認同→新：檢查意見後自主決策→德：保有尊嚴。\n20．人生面臨重大抉擇｜舊：只問別人希望我怎樣→新：確認自己的價值、責任與現實條件→德：自主負責。\n本項最小行動：每天選擇一件事，寫下它對應的核心價值。\n\n06｜品格穩定：從形象管理走向行為一致\n\n01．收銀員多找錢｜舊：覺得沒人發現就收下→新：主動退還→德：誠實。\n02．學生考試時監考不注意｜舊：趁機作弊→新：遵守考試規範→德：自律。\n03．同事犯錯｜舊：公開羞辱→新：指出問題並協助改善→德：尊重。\n04．自己工作出錯｜舊：推給別人→新：承認並修復→德：負責。\n05．承諾幫朋友完成事情｜舊：忘記就算了→新：履行或主動重新協商→德：可靠。\n06．會員收到錯誤商品｜舊：推卸責任→新：核對訂單並合理處理→德：守信。\n07．學生提出不同意見｜舊：認為挑戰權威→新：聽取理由並公平回應→德：謙遜。\n08．發現自己引用錯誤資訊｜舊：悄悄刪除不承認→新：公開更正重要錯誤→德：尊重事實。\n09．面對弱勢服務人員｜舊：態度傲慢→新：維持基本尊重→德：平等。\n10．主管不在辦公室｜舊：故意敷衍工作→新：按照合理標準完成→德：自我管理。\n11．團隊成果受到表揚｜舊：全部歸功自己→新：承認成員貢獻→德：公正。\n12．別人誤會自己｜舊：編造故事保全面子→新：清楚說明可確認的事實→德：真誠。\n13．有人提供不當利益｜舊：認為只是小好處→新：拒絕利益衝突→德：廉潔。\n14．學生家庭背景不同｜舊：依身分差別待遇→新：使用一致且合理的標準→德：公平。\n15．朋友遇到困難｜舊：只在公開場合表達關心→新：私下詢問實際需要→德：真誠關懷。\n16．孩子犯錯｜舊：情緒化懲罰→新：依事實、規範與教育目的處理→德：公正。\n17．團購供應商出現品質疑慮｜舊：為保住利潤隱瞞→新：確認問題並處理風險→德：誠信。\n18．自己獲得權力｜舊：要求所有人服從→新：遵守程序並接受監督→德：節制權力。\n19．他人批評自己的錯誤｜舊：攻擊對方人格→新：檢查批評是否有根據→德：願意修正。\n20．沒有人知道自己的選擇｜舊：認為可以放棄原則→新：仍依照核心價值行動→德：內外一致。\n本項最小行動：每天完成一項承諾，或主動修復一項失誤。\n\n07｜能力顯現：從知識收藏走向現實貢獻\n\n01．學會英文文法｜舊：只背規則→新：設計例句並正確運用→德：知識實踐。\n02．閱讀健康研究｜舊：直接轉傳結論→新：核對研究設計與適用範圍→德：負責傳播。\n03．學習AI工具｜舊：收藏大量教學影片→新：完成一個實際工作流程→德：有效應用。\n04．學習財務管理｜舊：只聽理財觀念→新：建立收支與風險紀錄→德：改善生活。\n05．了解親子溝通｜舊：只分享金句→新：實際練習傾聽與提問→德：改善關係。\n06．學習營養知識｜舊：背誦成分名稱→新：辨識需求、證據與使用限制→德：提供正確資訊。\n07．教師研究教學法｜舊：只參加研習→新：在課堂測試並收集回饋→德：改善教學。\n08．學習程式設計｜舊：只閱讀程式碼→新：製作可使用的小工具→德：解決問題。\n09．閱讀心理學書籍｜舊：用概念分析別人→新：先改善自己的溝通方式→德：自我實踐。\n10．學習時間管理｜舊：收藏行事曆模板→新：每天完成第一優先任務→德：提升執行。\n11．學會簡報設計｜舊：追求漂亮版面→新：讓聽眾理解並採取適當行動→德：有效溝通。\n12．熟悉疾病知識｜舊：自認可以替人診斷→新：理解專業界線並協助就醫溝通→德：審慎助人。\n13．懂得資料分析｜舊：只製作圖表→新：找出問題並驗證改善方法→德：支持決策。\n14．具備領導知識｜舊：要求團隊服從→新：建立目標、分工與回饋→德：促進合作。\n15．學習寫作技巧｜舊：只追求華麗文字→新：讓讀者真正理解並受益→德：清楚表達。\n16．學習衝突管理｜舊：只會說溝通很重要→新：實際釐清責任與界線→德：改善互動。\n17．學習商業行銷｜舊：只追求成交話術→新：解決顧客真實問題→德：創造價值。\n18．學習運動知識｜舊：只研究理論→新：建立安全且可持續的運動習慣→德：照顧身體。\n19．熟悉教育科技｜舊：購買很多軟體→新：確認工具是否改善學生學習→德：以成果為本。\n20．擁有多年專業經驗｜舊：只依賴個人能力→新：整理成教材與可傳承流程→德：擴大貢獻。\n本項最小行動：每天把一項知識轉化成一個可以使用的成果。\n【三、載｜承擔、整合、調節、轉化】\n\n08｜承擔能力：從過度負責走向合理承擔\n\n01．孩子忘記帶作業｜舊：家長每次急送→新：協助建立出門檢查表→德：培養自主。\n02．同事經常拖延｜舊：自己全部做完→新：釐清分工與期限→德：責任公平。\n03．長輩需要照顧｜舊：一人承擔全部→新：協商家庭分工與外部資源→德：可持續照顧。\n04．學生考試失敗｜舊：教師認為全是自己的錯→新：檢查教學與學生學習等因素→德：合理負責。\n05．伴侶情緒低落｜舊：認為必須讓對方永遠快樂→新：提供支持但不代替專業協助→德：關愛有界線。\n06．團購商品出錯｜舊：推給物流→新：依實際責任協調處理→德：履行服務。\n07．朋友經濟困難｜舊：不顧自身能力持續借錢→新：評估能力並提供適當協助→德：理性關懷。\n08．主管臨時增加工作｜舊：全部答應→新：討論優先順序與資源→德：誠實承擔。\n09．家庭成員發生爭執｜舊：自己必須讓所有人和好→新：釐清自己的角色並尊重各方選擇→德：守住責任界線。\n10．孩子不願讀書｜舊：父母替孩子安排每分鐘→新：共同設定目標並逐步交還責任→德：培養自主。\n11．學生未交作業｜舊：教師代替學生完成→新：提供補救資源並要求學生負責→德：教育責任。\n12．合作夥伴違約｜舊：自己承擔全部損失→新：依約定與事實處理責任→德：公平。\n13．家人生病｜舊：照顧者完全放棄休息→新：安排輪替與支持→德：保護照顧品質。\n14．朋友經常深夜求助｜舊：每次立即回應→新：設定合理聯絡時間與緊急處理方式→德：界線清楚。\n15．孩子做錯決定｜舊：家長替他掩蓋所有後果→新：在安全範圍內陪伴承擔→德：培養責任。\n16．社群會員要求超出服務範圍｜舊：為維持關係全部答應→新：清楚說明服務界線→德：可靠經營。\n17．團隊成員能力不足｜舊：直接接手全部任務→新：提供訓練並合理調整分工→德：能力培育。\n18．長輩要求不合理的財務支援｜舊：害怕不孝而照單全收→新：確認需求、預算與權益→德：理性照顧。\n19．自己犯下錯誤｜舊：過度自責卻不行動→新：承認責任並完成修復→德：有效負責。\n20．面對多重人生角色｜舊：要求自己每個角色都完美→新：設定優先順序與可承擔範圍→德：長期穩健。\n本項最小行動：完成一項自己的責任，拒絕或重新協商一項不合理負擔。\n\n09｜整合能力：從資源堆積走向系統協同\n\n01．英文單字與閱讀分開教｜舊：各自練習→新：把單字放進閱讀情境→德：提高學習效率。\n02．學生錯題分散｜舊：每次重新查找→新：建立錯誤類型資料庫→德：精準補救。\n03．健康文章很多｜舊：不斷收藏→新：依主題、證據與用途建立索引→德：知識可用。\n04．家庭支出紀錄分散｜舊：憑記憶管理→新：整合帳戶與分類紀錄→德：財務透明。\n05．團購會員需求不同｜舊：全部推薦同一產品→新：依需求提供產品資訊與適配判斷→德：尊重差異。\n06．教師重複製作教材｜舊：每次從零開始→新：建立可更新的教材模板→德：節省資源。\n07．家人輪流照顧長輩｜舊：各自傳訊息→新：建立共同照顧紀錄→德：減少遺漏。\n08．學生使用多個學習APP｜舊：資料互不連結→新：整合作答、錯題與複習進度→德：提升學習。\n09．商業客服訊息分散｜舊：人工逐一查找→新：建立訂單與問題追蹤系統→德：服務可靠。\n10．團隊成員專長不同｜舊：每人做所有工作→新：依專長分工→德：協同合作。\n11．閱讀多本哲學書｜舊：只記住各書金句→新：建立共同概念與差異對照→德：深化理解。\n12．健康檢查資料跨年度｜舊：只看單次數字→新：整理趨勢並與醫療專業討論→德：改善判斷。\n13．社群常問相同問題｜舊：每次重新回答→新：建立FAQ與資料來源→德：提高服務品質。\n14．孩子考試資料龐大｜舊：無序閱讀→新：建立科目知識樹與錯題索引→德：有效準備。\n15．工作會議過多｜舊：每次重複報告→新：建立共用進度看板→德：降低協作成本。\n16．家中物品經常找不到｜舊：不斷購買替代品→新：分類、標記與建立固定位置→德：減少浪費。\n17．營養產品資訊複雜｜舊：只看宣傳重點→新：整合成分、劑量、風險與證據→德：資訊完整。\n18．學生能力差異大｜舊：全部使用同一份練習→新：依錯誤類型提供分層任務→德：公平支持。\n19．商業內容反覆創作｜舊：每次寫新文章→新：把研究資料轉為文章、教材與會員工具→德：知識複用。\n20．人生目標分散｜舊：每個目標獨立競爭時間→新：尋找健康、工作、家庭與成長的共同支持策略→德：整體協調。\n本項最小行動：連結兩項現有資源，產生一個可重複使用的成果。\n\n10｜調節能力：從硬撐到底走向動態平衡\n\n01．工作連續加班｜舊：持續增加工時→新：調整優先順序與休息→德：保護健康。\n02．學生學習過量｜舊：繼續增加題數→新：依錯誤率與疲勞調整練習→德：有效學習。\n03．投資波動增加｜舊：依情緒頻繁交易→新：依既定風險規則調整→德：理性管理。\n04．睡眠品質下降｜舊：靠意志力硬撐→新：檢查作息、壓力與必要醫療因素→德：重視恢復。\n05．團購訂單暴增｜舊：所有事情自己處理→新：分工、排程與通知→德：維持品質。\n06．孩子情緒激動｜舊：立即要求講道理→新：先確保安全並等待情緒緩和→德：適時溝通。\n07．家庭支出超出預算｜舊：忽略警訊→新：重新檢查支出與必要項目→德：財務穩健。\n08．學生注意力下降｜舊：延長講課時間→新：加入短練習與活動切換→德：適應學習狀態。\n09．社群訊息過量｜舊：全天即時回覆→新：設定回覆時段與緊急分類→德：服務可持續。\n10．身體運動後不適｜舊：認為一定要堅持→新：停止不適活動並評估是否需要就醫→德：安全優先。\n11．會議討論失焦｜舊：任由討論延長→新：重新確認目標與時間→德：節省集體資源。\n12．孩子考前焦慮｜舊：不斷提醒考試重要→新：調整複習量與休息→德：穩定支持。\n13．夫妻溝通升溫｜舊：堅持當場爭出結果→新：在安全前提下暫停並約定後續處理→德：減少傷害。\n14．商品庫存過高｜舊：繼續進貨→新：檢查需求與庫存週轉→德：降低浪費。\n15．學生作答速度太慢｜舊：一味催促→新：分析閱讀、理解與時間分配→德：精準調整。\n16．工作目標太多｜舊：同時推進所有任務→新：限制進行中的專案數量→德：集中資源。\n17．家人需要長期照顧｜舊：照顧者永不休息→新：安排替班與外部支持→德：維持照顧。\n18．產品使用者出現不適｜舊：要求繼續使用→新：停止疑似相關產品並視情況尋求醫療評估→德：安全負責。\n19．學生已熟練某類題型｜舊：持續重複相同難度→新：提高挑戰或轉向薄弱能力→德：有效配置。\n20．生活出現重大變動｜舊：仍照舊行程硬做→新：重新設定階段目標→德：動態適應。\n本項最小行動：每天檢查一項重要狀態，根據回饋調整一次。\n\n11｜轉化能力：從消耗經驗走向累積資產\n\n01．學生常錯同一文法｜舊：每次口頭提醒→新：製作錯誤辨識卡→德：經驗轉化。\n02．團購客服反覆回答問題｜舊：每次重新打字→新：建立標準回覆與知識庫→德：服務升級。\n03．投資判斷失誤｜舊：只留下後悔→新：建立決策紀錄與風險規則→德：經驗學習。\n04．家庭衝突反覆出現｜舊：每次重新爭吵→新：辨識觸發點並建立溝通規則→德：改善互動。\n05．孩子考試失敗｜舊：只看分數→新：整理錯誤類型與複習計畫→德：轉化挫折。\n06．工作交接混亂｜舊：每次口頭說明→新：建立交接清單→德：組織可靠。\n07．健康資料分散｜舊：每次看診重新回想→新：整理症狀與檢查時間軸→德：改善醫療溝通。\n08．讀完一本好書｜舊：只收藏金句→新：整理一項可實踐的策略→德：知行合一。\n09．教學活動成功｜舊：只留下滿意感→新：記錄流程與適用條件→德：成果複用。\n10．產品銷售不佳｜舊：只感到失望→新：整理需求與服務改善方向→德：經驗資產化。\n11．學生提出有價值的問題｜舊：回答後結束→新：轉成教學案例與題庫→德：知識擴散。\n12．家庭照顧遇到困難｜舊：每次臨時處理→新：建立照顧流程與緊急聯絡表→德：降低風險。\n13．社群文章被指出錯誤｜舊：只刪除文章→新：建立事實查核與版本修正流程→德：制度改善。\n14．使用AI產生錯誤答案｜舊：只抱怨AI不準→新：建立來源核對與品質檢查清單→德：提高可靠性。\n15．工作專案延期｜舊：只責怪進度落後→新：整理瓶頸與時間估計模型→德：提升預測。\n16．親子溝通改善｜舊：認為只是運氣好→新：記錄有效的提問與回應方式→德：經驗累積。\n17．完成一套教材｜舊：只使用一次→新：模組化供不同班級使用→德：擴大價值。\n18．經營會員社群多年｜舊：依靠個人記憶→新：建立需求、回饋與服務資料庫→德：系統化經營。\n19．人生遭遇重大挫折｜舊：強迫自己立刻找到意義→新：先恢復安全與生活，再逐步整理經驗→德：尊重復原歷程。\n20．建立有效的新方法｜舊：只自己使用→新：教導他人並接受回饋→德：創造可傳承價值。\n本項最小行動：每天把一項經驗整理成一條可重複使用的規則。\n【四、物｜責任、關係、資源、衝突、機會、成果】\n\n12｜責任管理：從忙碌混亂走向優先排序\n\n01．教師同時有備課與行政任務｜舊：隨機處理→新：依期限與學生影響排序→德：優先負責。\n02．學生作業很多｜舊：先做最喜歡的→新：先處理高重要性與高風險任務→德：自主管理。\n03．家庭帳單即將到期｜舊：拖延不處理→新：設定提醒與付款計畫→德：財務可靠。\n04．孩子生病與工作衝突｜舊：勉強兩邊硬撐→新：安排照顧與工作代理→德：合理協調。\n05．團購出貨量大｜舊：憑記憶處理→新：依訂單狀態建立流程→德：降低錯誤。\n06．同事請求臨時支援｜舊：全部答應→新：確認現有任務與支援範圍→德：誠實承諾。\n07．學生需要補救教學｜舊：想到才安排→新：建立名單、目標與追蹤→德：持續支持。\n08．家人照顧責任不清｜舊：誰有空誰做→新：明確分工與替代安排→德：公平承擔。\n09．工作會議沒有結論｜舊：下次再討論→新：指定負責人、期限與完成標準→德：有效執行。\n10．孩子想參加很多活動｜舊：全部報名→新：評估時間與身心負荷→德：合理選擇。\n11．健康檢查異常需要追蹤｜舊：先放著→新：安排專業評估與後續追蹤→德：重視健康。\n12．商業合作出現分歧｜舊：只靠口頭約定→新：記錄權責與交付標準→德：降低爭議。\n13．家庭重大支出｜舊：臨時決定→新：建立預算、比較與決策程序→德：資源負責。\n14．學生幹部工作不均｜舊：由能力強者包辦→新：重新分配任務與提供訓練→德：公平。\n15．教師需要批改大量作業｜舊：全部拖到最後→新：分批處理並建立回饋規則→德：維持品質。\n16．照顧長輩與孩子時間衝突｜舊：所有事情都自己做→新：安排支援與優先順序→德：保護家庭功能。\n17．經營多個專案｜舊：全部同時開工→新：限制進行數量與設定里程碑→德：提高完成率。\n18．會員反映問題｜舊：想到才回覆→新：建立處理時限與追蹤紀錄→德：可靠服務。\n19．孩子準備重大考試｜舊：每天臨時決定讀什麼→新：依考試範圍與錯誤類型排程→德：有效學習。\n20．人生責任持續增加｜舊：無限接受→新：定期檢查角色、資源與負荷→德：長期承擔。\n本項最小行動：每天完成一項第一優先任務。\n\n13｜關係經營：從依附控制走向尊重共創\n\n01．孩子不想分享學校生活｜舊：強迫交代→新：提供安全且不急著批評的空間→德：尊重隱私。\n02．伴侶與自己意見不同｜舊：要求服從→新：理解需求並協商→德：尊重平等。\n03．朋友沒有立即回訊息｜舊：認定不重視自己→新：尊重對方時間並確認情況→德：減少猜測。\n04．父母不接受新觀念｜舊：嘲笑落伍→新：用生活例子說明並尊重選擇→德：耐心。\n05．孩子選擇不同職涯｜舊：用經濟支持施壓→新：討論現實條件並保留自主→德：尊重成長。\n06．學生犯錯｜舊：當眾羞辱→新：依規範處理並保護尊嚴→德：教育關懷。\n07．朋友需要陪伴｜舊：立即給建議→新：先問希望被傾聽還是協助解決→德：精準支持。\n08．伴侶需要個人空間｜舊：認為不愛自己→新：討論合理的獨處與共同時間→德：尊重界線。\n09．長輩反覆談過去｜舊：直接打斷→新：適度傾聽並了解情感需求→德：關懷。\n10．同事提出批評｜舊：認為敵對→新：確認內容並討論改善→德：合作。\n11．孩子交友遇到挫折｜舊：責怪不會做人→新：理解事件並協助建立社交能力→德：支持。\n12．朋友借錢｜舊：怕傷感情而直接答應→新：評估能力並說明界線→德：誠實。\n13．家庭成員需要幫助｜舊：未經同意直接介入→新：先確認需求與意願→德：尊重自主。\n14．伴侶發生激烈爭吵｜舊：用威脅迫使對方留下→新：停止威脅、尊重安全與法律界線→德：不傷害。\n15．孩子不認同父母價值觀｜舊：貼上叛逆標籤→新：討論理由與責任→德：尊重差異。\n16．同事工作方式不同｜舊：要求完全照自己方法→新：先確認共同成果標準→德：合作彈性。\n17．會員不願購買產品｜舊：持續施壓→新：尊重決定並提供需要的資訊→德：不操控。\n18．朋友長期單方面索取｜舊：無限配合→新：清楚表達界線並調整互動→德：健康互惠。\n19．家人有不同信仰｜舊：強迫接受自己的信念→新：尊重信仰自由並討論共同倫理→德：尊重。\n20．關係需要結束｜舊：以控制、報復或糾纏回應→新：尊重選擇並處理安全與責任→德：成熟分離。\n本項最小行動：每天進行一次傾聽，確認一項需求並尊重一項界線。\n\n14｜資源配置：從即時消耗走向長期價值\n\n01．每天滑手機兩小時｜舊：無意識消耗→新：保留部分時間用於重要目標→德：注意力自主。\n02．每月收入固定｜舊：花完才存→新：先規劃必要支出與儲蓄→德：財務管理。\n03．學生讀書時間有限｜舊：平均分配所有科目→新：依考試需求與薄弱程度調整→德：精準投入。\n04．教師備課時間不足｜舊：每次重做教材→新：建立可複用教學資源→德：提高效率。\n05．團購資金有限｜舊：大量囤貨→新：依需求與庫存週轉配置→德：降低風險。\n06．家庭有醫療支出｜舊：忽略緊急預備金→新：保留必要流動性→德：風險準備。\n07．孩子想買昂貴電 ['生活情境','情境裡的每個人都有尚未說完的故事。旁觀時容易給出乾淨俐落的答案，真正身在其中，才會碰見時間、角色與關係交纏的重量。請先放慢判斷，寫下你知道的事與不知道的事。容許一個問題暫時沒有結論，也容許下一個選擇，比昨天多照顧一個人的處境。','把道理放回人間，才聽見人的聲音']
];
function createSocial(seed,modeIndex=0,source=''){
 const [topic,scene,oldWord,newWord,claim,poem,action]=seed;
 const mode=MODES[modeIndex];
 const anchor=source?`這一次，我想停在這句話前：「${source.slice(0,110)}${source.length>110?'…':''}」讀到它時，你是否想到一張熟悉的臉？一段遲遲沒有說完的對話？一個當時沒能好好照顧的自己？文字碰到生活，才開始有了溫度。`: `我們談${topic}，也許可以先從一個很普通的傍晚開始。沒有掌聲，沒有頓悟，只有一個人忽然發現：自己熟悉的回應，已經無法安放眼前的生活。於是，他試著把一句說慣了的話，慢慢說成另一種可能。`;
 const parts=[
 ['哲學命題',`有些改變，從重新理解一句話開始。${claim}。借用維根斯坦對語言使用的關切，也借用海德格對在世處境的追問，我們可以這樣問自己：當我說「${topic}」，我究竟在回應什麼樣的生活，又為誰留下了位置？`],
 ['情境衝突',`想像這樣一個片刻：${scene}。你心裡先浮起的是「${oldWord}」。這句話說來如此順口，像一條走慣了的路。但對面那個人沒有因此靠近，你也沒有因此鬆一口氣。原來，熟悉的語言有時能保護自己，也可能使彼此越站越遠。`],
 ['排比句',`我們急著把事情講清楚，卻來不及問對方聽見了什麼；我們急著把責任做好，卻來不及問自己還能承擔多少；我們急著成為值得被肯定的人，卻來不及辨認，那份肯定究竟要把生命帶往哪裡。一次次趕路之間，最親近的生活，反而被留在身後。`],
 ['對比句',`「${oldWord}」，把對話帶回熟悉的軌道；「${newWord}」，則試著替眼前的人開一道門。前一句使我們更快完成判斷，後一句讓我們願意多停留片刻。兩種語言，兩種姿態，也可能走出兩種不同的關係。${anchor}`],
 ['反問句',`如果一個道理使我們越來越難以傾聽，它究竟帶來了什麼理解？如果一句勉勵只讓人更害怕承認困難，它又照顧了誰？如果所有努力都必須換成別人的讚許，我們還剩下多少空間，能誠實地說出自己真正珍惜的事？這些追問，不需要急著交卷。`],
 ['認知翻轉',`也許${topic}可以從另一個方向開始：先看見自己如何描述眼前的事，再看見描述之外還有誰。${mode[1]}我們可以保留對重要之物的在意，同時讓表達它的方法重新生長。願意改口的那一刻，也許正是願意重新相遇的開始。`],
 ['層層遞進',`今天，先停下一次自動說出口的評語；再試著說出一個尚未被聽見的需要；接著，${action}。做完之後，回頭看看對話打開了什麼，也看看哪裡仍然困難。從一個詞，到一個選擇；從一個選擇，到一段關係；從一段關係，到你願意長久居住的生活。`],
 ['詩性收束',`${poem}。願你讀過的句子，終有一天變成桌邊耐心的等待、門口真誠的招呼、夜深時仍肯善待自己的聲音。當世界催促你立刻成為誰，願你還能聽見心裡那個輕輕的回答：我在這裡，我願意再理解一次，也願意再走近一步。`]
 ];
 return {title:topic+'｜'+mode[2],cover:poem,parts,text:topic+'｜'+mode[2]+'\n\n'+parts.map(p=>p[1]).join('\n\n')+'\n\n#厚德載物 #'+topic.replace(/\s/g,'')+' #生活中的哲學'};
}
let currentSocial=null;
const socialStore={get(k){try{return JSON.parse(appStorage.getItem('houde-social-v1')||'{}')[k]}catch{return null}},set(k,v){try{let d=JSON.parse(appStorage.getItem('houde-social-v1')||'{}');d[k]=v;appStorage.setItem('houde-social-v1',JSON.stringify(d));return true}catch{return false}}};
const socialStyle=document.createElement('style');socialStyle.textContent=`.social-entry{margin:24px 0;padding:25px;border:1px solid #b18748;border-radius:12px;background:#f1eddf}.social-entry h2{margin:4px 0}.social-field{display:block;float:none;font-size:12px;margin:14px 0 4px}.social-modal{width:min(1140px,96vw);max-height:92vh;overflow:auto;border:1px solid var(--line);border-radius:15px;padding:28px;background:var(--paper);color:var(--ink)}.social-modal::backdrop{background:#172d28aa}.social-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(280px,.9fr);gap:26px}.social-modal textarea{height:460px;line-height:1.85}.social-cover{width:100%;height:auto;border-radius:12px}.social-controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.social-analysis p{margin:12px 0;padding-bottom:12px;border-bottom:1px solid var(--line)}.social-analysis b{color:var(--gold);display:block;font-size:13px}.social-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.social-head h2{margin-top:0}#socialStatus{font-size:13px;min-height:1.85em;color:var(--ink)}@media(max-width:750px){.social-layout{grid-template-columns:1fr}.social-modal{padding:18px}.social-modal textarea{height:420px}}`;document.head.append(socialStyle);
const socialDialog=document.createElement('dialog');socialDialog.className='social-modal';socialDialog.setAttribute('aria-label','臉書圖文工作室');socialDialog.innerHTML=`<div class="social-head"><div><span class="eyebrow">FACEBOOK · 原創延伸圖文</span><h2 id="socialTitle"></h2></div><button id="socialClose" aria-label="關閉圖文工作室">✕</button></div><p class="small">以維根斯坦、海德格的提問方向作應用性創作；非哲學家引文，非原對話內容。圖卡＋約千字貼文可分別下載。</p><div class="social-layout"><div><label for="socialText">貼文內文（可編輯）</label><textarea id="socialText"></textarea><div class="social-controls"><button id="socialCopy">複製貼文</button><button id="socialSave">儲存修改</button><button id="socialDownload">下載文字</button></div><span id="socialCount" class="badge"></span><div id="socialStatus" role="status" aria-live="polite"></div><details class="social-analysis"><summary>查看八段寫作結構（原始版本）</summary><div id="socialStructure"></div></details></div><div><label for="socialCoverText">圖卡金句（可編輯，建議 45 字以內）</label><textarea id="socialCoverText" style="height:95px;min-height:95px" maxlength="70"></textarea><canvas id="socialCanvas" width="1080" height="1350" class="social-cover" aria-label="臉書直式金句圖卡預覽"></canvas><div class="social-controls"><button id="socialImage">下載圖卡 PNG</button></div><p class="small">1080 × 1350 · 圖卡摘句搭配千字內文<br>新增文字為原創延伸，情境為示例。</p></div></div>`;document.body.append(socialDialog);
function socialSeedForLine(line){let i=names.findIndex(n=>line.includes(n));if(i<0&&selected>=0&&view==='detail')i=selected;if(i<0){const pos=DATA.indexOf(line);if(pos>=0){const before=DATA.slice(0,pos),heads=[...before.matchAll(/(?:^|\n)(\d{2})｜([^\n]+)/g)];const last=heads.at(-1);if(last){const n=Number(last[1])-1;if(n>=0&&n<18&&last[2].includes(names[n]))i=n}}}return i>=0?STORY_SEEDS[i]:(PAGE_SEEDS[view]||PAGE_SEEDS.home)}
function openSocial(line=''){let seed=line?socialSeedForLine(line):(view==='detail'?STORY_SEEDS[selected]:PAGE_SEEDS[view]||PAGE_SEEDS.home);let mode=view==='detail'?type:0;let post=createSocial(seed,mode,line);let key=line?'field:'+line:'page:'+view+':'+(view==='detail'?selected+':'+type:'');let stored=socialStore.get(key);currentSocial={...post,key};document.getElementById('socialTitle').textContent=post.title;document.getElementById('socialText').value=stored?.text??post.text;document.getElementById('socialCoverText').value=stored?.cover??post.cover;document.getElementById('socialStructure').innerHTML=post.parts.map(p=>'<p><b>'+esc(p[0])+'</b>'+esc(p[1])+'</p>').join('');document.getElementById('socialStatus').textContent='';updateSocialCount();drawSocialCard();socialDialog.showModal()}
function updateSocialCount(){document.getElementById('socialCount').textContent='內文 '+Array.from(document.getElementById('socialText').value.replace(/\s/g,'')).length+' 字（含標點）'}
function drawSocialCard(){const c=document.getElementById('socialCanvas'),x=c.getContext('2d');x.fillStyle='#e9ede4';x.fillRect(0,0,1080,1350);x.strokeStyle='#b18748';x.lineWidth=2;x.strokeRect(60,60,960,1230);x.fillStyle='#b18748';x.font='24px sans-serif';x.fillText('厚 德 載 物  /  生 活 中 的 哲 學',100,150);x.strokeStyle='#c3ccbf';for(let i=0;i<6;i++){x.beginPath();x.arc(1000,1310,250+i*65,Math.PI,Math.PI*1.48);x.stroke()}x.fillStyle='#253e38';x.font='44px serif';const topic=currentSocial?.title.split('｜')[0]||'';x.fillText(topic,100,270);x.font='62px serif';let chars=Array.from(document.getElementById('socialCoverText').value),rows=[],row='';chars.forEach(ch=>{if(ch==='\n'){rows.push(row);row=''}else if(x.measureText(row+ch).width>850){rows.push(row);row=ch}else row+=ch});if(row)rows.push(row);rows.slice(0,8).forEach((r,i)=>x.fillText(r,100,450+i*95));x.fillStyle='#718078';x.font='24px sans-serif';x.fillText('在生活之中理解，在行動之中顯現。',100,1190);x.font='20px sans-serif';x.fillText('原創延伸  ·  知行之境',100,1240)}
document.getElementById('socialClose').onclick=()=>socialDialog.close();document.getElementById('socialText').oninput=updateSocialCount;document.getElementById('socialCoverText').oninput=drawSocialCard;
document.getElementById('socialCopy').onclick=async()=>{let t=document.getElementById('socialText');try{await navigator.clipboard.writeText(t.value);document.getElementById('socialStatus').textContent='貼文已複製，可貼到臉書。'}catch{t.focus();t.select();document.getElementById('socialStatus').textContent='已選取全文，請按 Ctrl+C 或使用系統複製。'}};
document.getElementById('socialSave').onclick=()=>{let ok=socialStore.set(currentSocial.key,{text:document.getElementById('socialText').value,cover:document.getElementById('socialCoverText').value});document.getElementById('socialStatus').textContent=ok?'修改已保存在此瀏覽器。':'此瀏覽器無法儲存，請下載文字備份。'};
document.getElementById('socialDownload').onclick=()=>saveFile(document.getElementById('socialText').value,currentSocial.title+'.txt','text/plain;charset=utf-8');
document.getElementById('socialImage').onclick=()=>{let a=document.createElement('a');a.href=document.getElementById('socialCanvas').toDataURL('image/png');a.download=currentSocial.title+'.png';a.click()};
const originalLineHTML=lineHTML;lineHTML=function(l){return originalLineHTML(l).replace(/<\/div>$/, '<button class="social-field" data-social="'+encodeURIComponent(l)+'">讀完原文 → 臉書延伸圖文</button></div>')};
app.addEventListener('click',e=>{let b=e.target.closest('[data-social]');if(b)openSocial(decodeURIComponent(b.dataset.social));if(e.target.closest('[data-page-social]'))openSocial()});
const originalRender=render;render=function(){originalRender();const box=document.createElement('section');box.className='social-entry';box.innerHTML='<span class="eyebrow">讓文字走進人心</span><h2>讀完原文，再看臉書圖文</h2><p>哲學命題 → 情境衝突 → 排比與對比 → 反問 → 認知翻轉 → 層層遞進 → 詩性收束</p><button data-page-social>閱讀、編輯與下載圖文 ↗</button><p class="small">每個內容欄位均先呈現原文，再提供臉書延伸圖文入口。圖卡搭配約千字貼文。</p>';app.append(box)};render();
