"法令紋 × 枕骨與 SCM":"head","顴骨變寬、菱形臉":"head","枕骨：總閘門":"head","舌頭三練":"tongue","只有一側肩膀緊":"twist","肩膀內扣、肱骨前旋":"shoulder","肋骨外翻":"rib",
"骨盆前傾":"tilt","骨盆後傾":"tilt","骨盆六個觀察點":"pelvis","骨盆三角":"pelvis","夾尾巴（過度捲尾骨）":"tail","腰髂肌":"psoas","O 型腿":"legs","X 型腿":"legs",
"足底三點與大腳趾":"tripod","腎型腳印":"tripod","高足弓":"arch","低足弓、扁平足":"arch","翻開舊鞋底":"shoe","五根腳趾的意義":"toes","步態三階段":"gait","360° 圓柱呼吸":"cyl","泵與池":"dfl"};
D.forEach(d=>d.g=G[GM[d.t]]||"");

const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
let cat="全部";
const cats=["全部","圖解",...new Set(D.map(d=>d.c))];
{const h=decodeURIComponent(location.hash.slice(1));if(cats.includes(h))cat=h}
D.forEach(d=>d.s=(d.c+d.t+d.k+d.r.flat().join("")).toLowerCase());
function drawCats(){$("#cats").innerHTML=cats.map(c=>`<button class="${c===cat?"on":""}" data-c="${c}">${c}</button>`).join("")}
function draw(){
  const ws=$("#q").value.toLowerCase().split(/\s+/).filter(Boolean);
  const L=D.filter(d=>(cat==="全部"||(cat==="圖解"?d.g:d.c===cat))&&ws.every(w=>d.s.includes(w)));
  $("#n").textContent=`${L.length} 張卡`+(L.length?"":"，換個關鍵字試試");
  $("#list").innerHTML=L.map(d=>`<article class="card"><h2>${esc(d.t)}<span class="cat">${d.c}</span></h2><div class="k">${esc(d.k)}</div>${d.g?`<div class="g">${d.g}</div>`:""}<dl>${d.r.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join("")}</dl></article>`).join("");
}
$("#q").addEventListener("input",draw);
$("#cats").addEventListener("click",e=>{if(e.target.dataset.c){cat=e.target.dataset.c;drawCats();draw()}});
$("#rc").addEventListener("click",e=>{e.target.classList.toggle("on");document.body.classList.toggle("recite")});
$("#list").addEventListener("click",e=>{const c=e.target.closest(".card");if(c&&document.body.classList.contains("recite"))c.classList.toggle("open")});
drawCats();draw();
</script>
</body>
</html>
