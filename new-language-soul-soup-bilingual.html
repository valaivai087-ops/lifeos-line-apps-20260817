<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新語言生成器｜心靈雞湯雙語版</title>
<style>
:root{
  --bg:#f6f5f1;--card:#ffffff;--ink:#1d1d1f;--muted:#6b6b70;--line:#e3e1da;
  --accent:#2f6f5e;--accent-soft:#e3f0ec;--old:#9a5b3c;--mark:#ffe58a;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141517;--card:#1e2023;--ink:#ecebe7;--muted:#9a9a9f;--line:#2e3034;
    --accent:#7cc4ae;--accent-soft:#1f302b;--old:#d89a78;--mark:#6b5a12;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;line-height:1.6}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 0}
.wrap{max-width:900px;margin:0 auto}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0 8px 0 0;white-space:nowrap}
#q{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:15px}
#q:focus{outline:2px solid var(--accent);border-color:transparent}
button{font:inherit;cursor:pointer}
.btn{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.tab{padding:8px 12px;border:0;background:none;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
main{padding:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:13px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--muted)}
.chip:hover{color:var(--accent);border-color:var(--accent)}
h2{font-size:17px;margin:26px 0 10px;padding-left:10px;border-left:4px solid var(--accent)}
h2 small{color:var(--muted);font-weight:normal;font-size:13px;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.meta{display:flex;gap:8px;align-items:baseline;margin-bottom:4px}
.num{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 7px}
.ttl{font-weight:600;font-size:14px}
.src{margin-left:auto;font-size:11px;color:var(--muted)}
.old{color:var(--old);font-size:14px}
.old::before{content:"以前｜";color:var(--muted)}
.card.soup .new::before,.new.plain::before{content:"";}
.card.soup .new{font-weight:500;line-height:1.7}
.today{background:var(--accent-soft);border-radius:14px;padding:18px 20px;margin-bottom:16px;font-size:19px;font-weight:700;color:var(--accent);line-height:1.6}
.today small{display:block;font-size:12px;font-weight:normal;color:var(--muted);margin-bottom:4px}
.new{font-weight:600;font-size:15px;margin-top:2px}
.new::before{content:"現在｜";color:var(--muted);font-weight:normal}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.block{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.block h3{margin:0 0 8px;font-size:16px;color:var(--accent)}
.block ul,.block ol{margin:0;padding-left:22px}
.block li{margin:3px 0}
.block p{margin:6px 0}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow span{background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:8px;font-size:14px;font-weight:600}
.flow i{color:var(--muted);font-style:normal}
.quote{font-weight:600;border-left:3px solid var(--accent);padding-left:10px}
.block pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;font-family:inherit;font-size:14px;white-space:pre-wrap;line-height:1.5}
.tblwrap{overflow-x:auto;margin:6px 0}
.block table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
.block th,.block td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.block th{color:var(--muted);font-weight:600}
.block td:first-child{font-weight:700;color:var(--accent);white-space:nowrap}
.hero{text-align:center;font-size:22px;font-weight:700;letter-spacing:2px;color:var(--accent);margin:4px 0 10px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.count{color:var(--muted);font-size:13px;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#modal.show{display:flex}
#modal .card{max-width:480px;width:100%;padding:24px;cursor:default}
#modal .new{font-size:20px}
#modal .old{font-size:16px}
.en{display:block;color:var(--muted);font-size:13.5px;font-weight:normal;cursor:pointer;line-height:1.45;margin:1px 0 5px;letter-spacing:0}
.en::before{content:"🔊 ";font-size:11px;opacity:.55}
.en:hover,.en.on{color:var(--accent)}
.flow+.en{margin-top:6px}
pre.en{font-size:13px}
.hero .en,.today .en{font-size:14px}
.say{margin-left:auto;border:1px solid var(--line);background:none;border-radius:8px;padding:1px 8px;font-size:13px;color:var(--muted)}
.say:hover{border-color:var(--accent);color:var(--accent)}
.say+.src,.fb+.src{margin-left:6px}
.fb{margin-left:4px;border:1px solid var(--line);background:none;border-radius:8px;padding:1px 8px;font-size:13px;color:var(--muted)}
.fb:hover{border-color:var(--accent);color:var(--accent)}
#fbc{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);display:block}
#fbt{width:100%;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;line-height:1.55;resize:vertical}
#modal .card.wide{max-width:520px;max-height:94vh;overflow-y:auto;overflow-x:hidden;padding:16px}
#modal .card.wide .acts{flex-wrap:wrap;margin-top:10px}
#slow.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
#modal .en{font-size:16px}
#modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <h1>換句話說・心靈雞湯</h1>
    <input id="q" type="search" placeholder="搜尋：焦慮、生氣、懶、底線、失敗…" autocomplete="off">
    <button class="btn" id="vsrc" title="沒聲音時按這裡換另一種語音">🔈 內建語音</button>
    <button class="btn" id="slow" title="英文慢速朗讀">🐢 慢速</button>
    <button class="btn" id="rand">🎲 隨機一句</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div></header>
<main><div class="wrap" id="view"></div></main>
<div id="modal"><div class="card" id="mcard"></div></div>
<div id="toast"></div>

<script>
/* ===== 資料 0：心靈雞湯 ===== */
const SOUP_RAW = `#一|你不是你的標籤
一次考差，不代表你很差；它只是說，這裡還可以再練。
你不是懶，你只是還沒找到一個容易開始的方法。
別急著說「我就是這樣」，你還在長大，還在改變。
標籤是別人貼的，也可以由你自己撕下來。
你做錯了一件事，不等於你是一個錯的人。
「還不會」的後面，藏著一個「快要會」。
#二|心情是小信差
焦慮不是壞東西，它只是提醒你：有件事你很在乎。
生氣的時候，問問自己：是哪條線被踩到了？
難過，是因為你認真在乎過。
嫉妒在偷偷告訴你：那也是你想要的。
心情像天氣，會來，也會走；你是那片天空。
不用趕走壞心情，先聽聽它想說什麼。
#三|看清楚，再下結論
先看發生了什麼，再決定要怎麼想。
「他討厭我」是猜的；「他今天沒回我」才是事實。
「大家」通常只是兩三個人，「每次」通常只是兩三次。
把話說清楚一點，煩惱就會小一點。
看錯了方向，跑再快也到不了。
多問一句「真的嗎？」，心就會輕一點。
#四|大問題，拆成小問題
山很高，但你只需要走眼前這一步。
太難的事，拆成三小塊，就沒那麼可怕了。
一團亂的時候，拿張紙寫下來，往往只有三件事。
不用一次解決全部，先解開最卡的那一個結。
找到源頭，比擦一百次地板更有用。
努力很好，用對地方的努力更好。
#五|錯誤是禮物
錯誤不是在笑你，它是在教你。
失敗只是告訴你：這條路不通，換一條。
沒有白走的路，每一步都算數。
與其後悔「早知道」，不如開心「現在知道了」。
分數不是判決書，是一張告訴你哪裡該補的地圖。
跌倒不丟臉，賴在地上不起來才可惜。
#六|總有路可以走
「不可能」常常只是「現在還不行」。
當你覺得只有兩條路時，試著再想第三條。
沒有時間？先從兩分鐘開始。
路不是沒有，只是還沒被你看見。
做不到全部，就先做十分之一。
管不了風往哪吹，但可以調整自己的帆。
#七|先做一小步
不用等到準備好；先做，就會慢慢準備好。
今天的一小步，比明天的一大步更真實。
知道一百個道理，不如今天做一件小事。
完美會讓你停在原地，第一版會帶你出發。
想讓自己不拖延，就把第一步變得很簡單。
與其硬忍，不如把手機放遠一點。
#八|好好相處
他拒絕的是這件事，不是你這個人。
與其等他猜，不如好好說出你的需要。
改變不了別人，但可以改變和他相處的方式。
立下底線不是自私，是好好照顧自己。
吵架不全是壞事，它讓你們看見彼此不一樣的地方。
你可以善良，也可以說「不」。
#九|一直更新自己
厲害的人不是從不犯錯，而是願意改。
「我可能錯了」是很有勇氣的一句話。
以前有用的方法，現在不一定有用；沒關係，再試新的。
真正學會，是換一題、換一天，還做得出來。
做到一次是運氣，做到很多次是實力。
把經驗變成一句提醒自己的話，那就是智慧。
#十|送給今天的你
新的說法不是要騙自己開心，而是幫自己看得更清楚。
換一句話，就多一條路。
你說出口的每一句話，都在幫自己畫地圖。
對自己說話溫柔一點，你也是第一次長大。
慢慢來，比較快。
今天比昨天多懂一點點，就很棒了。`;

/* ===== 資料 1：換句話說 100 ===== */
const S1 = `#A|把事情看清楚 01–20
01|我是誰 → 我做了什麼|我是＿＿的人|我只是在＿＿的時候，做了＿＿這件事。
02|個性 → 習慣|我就是＿＿|我在什麼時候，比較容易變成＿＿？
03|批評 → 看見|他很＿＿|我真的看到的，是他做了＿＿。
04|感覺 → 事實|我覺得＿＿|我的心情是＿＿；真正確定的事是＿＿。
05|亂猜 → 可能|他一定是因為＿＿|也許是因為＿＿，但我還不確定。
06|猜他的心 → 看他的行為|他故意＿＿|我只看到他做了＿＿；他心裡怎麼想，我還不知道。
07|每次 → 哪幾次|他每次都＿＿|最近真的有哪幾次是這樣？
08|永遠 → 這陣子|我永遠＿＿|只是最近這段時間，我比較常＿＿。
09|全部 → 一部分|我什麼都不會|我現在還不會的，只是＿＿。
10|很糟 → 說清楚|事情很糟|其實是發生了＿＿，影響了＿＿。
11|結果 → 細項|我考很差|我是在＿＿、＿＿、＿＿這三種題目丟分。
12|貼標籤 → 數一數|我很懶|這週我有＿＿次沒照計畫開始。
13|印象 → 數字|最近變差了|是哪個數字從＿＿變成＿＿？
14|想像 → 真的發生的事|大家都不喜歡我|真正發生的事，其實只有＿＿。
15|我的解讀 → 他的原話|他看不起我|他說／做了＿＿；是我把它想成＿＿。
16|生氣 → 提醒|我很生氣|我的生氣，是想提醒我＿＿。
17|焦慮 → 擔心的事|我很焦慮|我是在擔心＿＿會發生。
18|委屈 → 期待落空|我很委屈|我本來期待＿＿，結果卻是＿＿。
19|害怕 → 怕什麼|我好怕|我真正怕的是＿＿。
20|一團亂 → 三件事|全部亂掉了|其實只有＿＿、＿＿、＿＿這三件事。
#B|把事情想明白 21–40
21|一個原因 → 很多原因|都是因為＿＿|可能是＿＿、＿＿、＿＿一起造成的。
22|為什麼 → 怎麼來的|為什麼這麼糟？|這件事是怎麼一步一步變成這樣的？
23|表面 → 源頭|我要解決＿＿|是什麼一直讓這個問題冒出來？
24|全部改 → 找卡關點|我要全部改善|現在最卡住我的，是哪一個地方？
25|更努力 → 用對力|我要更努力|改哪一個地方，進步會最多？
26|我不行 → 還沒學會|我不行|我還缺哪一項技巧？
27|不能 → 被什麼擋住|我不能＿＿|現在擋住我的是什麼？
28|沒辦法 → 缺什麼|沒有辦法|我缺的是時間、錢、幫手、資訊、工具，還是能力？
29|太難 → 拆小|太難了|可以拆成哪三個小問題？
30|只能這樣 → 還有別條路|只能這樣|除了這個方法，還有第二、第三種嗎？
31|二選一 → 多幾種|只能A或B|能不能把兩個混在一起，想出新辦法？
32|合不來 → 哪裡不同|我們合不來|我們是需要的、在乎的、想法，還是底線不一樣？
33|怪別人 → 看情況|都是他的問題|是哪些情況，讓這件事一再發生？
34|怪自己 → 看環境|我沒自制力|身邊有什麼東西一直在誘惑我？
35|現在 → 拉長時間|現在很糟|一週後、一年後、五年後再看，會怎樣？
36|選哪個 → 我真正要什麼|我要A還是B？|不管選哪個，我心裡真正想要的是什麼？
37|他錯了 → 換位置看|他錯了|如果我站在他的位置，會看到什麼？
38|一定有效 → 前提是什麼|這一定有效|我是先相信了哪些事，才這樣認為？
39|一定 → 有多可能|一定會發生|照現在的情況看，可能性有多大？
40|只有一個解釋 → 多想三個|原因就是＿＿|還有哪三種別的可能？
#C|把事情做出來 41–60
41|想變好 → 下一步|我要變好|今天我可以做的下一小步是＿＿。
42|大目標 → 小小一步|我要學好英文|今天先做＿＿分鐘／＿＿題就好。
43|完美 → 先有第一版|還沒準備好|現在能先交出的第一版是什麼？
44|等確定 → 先試試|等我確定再做|可以先做哪個不花力氣的小試驗？
45|想很多 → 試一下|我不知道答案|做什麼小測試，就能多知道一點？
46|多做 → 練弱點|多做題目|我該專門練哪一種錯？

55|好忙 → 先做一件|事情好多|現在最重要的那一件是＿＿。
56|樣樣都做 → 抓重點|全部都重要|哪一小部分做好，效果最大？

61|失敗 → 猜錯了|我失敗了|我原本以為會怎樣，結果哪裡不一樣？

63|罵自己 → 找原因|我怎麼這麼笨|真正的原因是什麼？
64|後悔 → 學到|早知道就＿＿|現在的我，比當時多懂了什麼？
65|白做 → 少一條錯路|全部白費|這次讓我知道，哪條路走不通？
66|沒用 → 什麼時候沒用|這方法沒用|它是在什麼情況下沒效？
67|成功 → 為什麼成功|太好了，成功了|到底是做對了哪件事？
68|運氣 → 我能做的|只是運氣好／差|哪些是碰巧？哪些是我能努力的？
69|分數 → 體檢表|我只有55分|這55分告訴我，哪裡還需要補？

function parse(text, kind, src){
  const out=[]; let group=null, groupSub="", n=0;
  text.trim().split("\n").forEach(line=>{
    line=line.trim(); if(!line) return;
    if(line[0]==="#"){ const p=line.slice(1).split("|"); group=p[0]+"｜"+p[1]; groupSub=p[2]||""; return; }
    const p=line.split("|"); n++;
    if(kind===3) out.push({src,group,num:String(n).padStart(2,"0"),ttl:"",old:"",nw:line});
    else if(kind===1) out.push({src,group,num:String(+p[0]).padStart(2,"0"),ttl:p[1],old:p[2],nw:p[3]});
    else out.push({src,group:group&&(group+(groupSub?"｜"+groupSub:"")),num:String(n).padStart(2,"0"),ttl:"",old:"不說「"+p[0]+"」",nw:p[1]});
  });
  return out;
}

const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let query="";
function hl(s){
  let h=esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  if(!query) return h;
  const re=new RegExp("("+esc(query).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
  return h.replace(/(<[^>]+>)|([^<]+)/g,(m,tag,txt)=>tag?tag:txt.replace(re,"<mark>$1</mark>"));
}

  const i=ALL.indexOf(it);
  return `<div class="card${it.old?"":" soup"}" data-i="${i}">
    <div class="meta"><span class="num">${it.num}</span>${it.ttl?`<span class="ttl">${hl(it.ttl)}</span>`:""}<button class="say" data-i="${i}" title="朗讀英文">🔊</button><button class="fb" data-i="${i}" title="臉書貼文＋圖卡">📣</button>${showSrc?`<span class="src">${it.src}</span>`:""}</div>
    ${it.en.ttl?en(it.en.ttl):""}
    ${it.old?`<div class="old">${hl(it.old)}</div>${en(it.en.old)}`:""}<div class="new">${hl(it.nw)}</div>${en(it.en.nw)}</div>`;
}
const en=s=>s?`<span class="en">${hl(s)}</span>`:"";
const flowH=(f,e)=>`<div class="flow">${f.map(x=>`<span>${hl(x)}</span>`).join("<i>→</i>")}</div>`+(e?en(e.join(" → ")):"");
const parasH=(ps,e=[])=>ps.map((x,k)=>x.startsWith("> ")?`<p class="quote">${hl(x.slice(2))}${en(e[k])}</p>`:`<p>${hl(x)}${en(e[k])}</p>`).join("");
function block(b,id){
  const e=b.en||{};
  let body="";
  if(b.hero) body+=`<div class="hero">${hl(b.hero)}${en(e.hero)}</div>`;
  if(b.p) body+=parasH(b.p,e.p);
  if(b.pre) body+=`<pre>${hl(b.pre)}</pre>`+(e.pre?`<pre class="en">${hl(e.pre)}</pre>`:"");
  if(b.flow) body+=flowH(b.flow,e.flow);
  if(b.items){ const tag=b.ol?"ol":"ul"; body+=`<${tag}>${b.items.map((x,k)=>`<li>${hl(x)}${en((e.items||[])[k])}</li>`).join("")}</${tag}>`; }
  if(b.table){ const et=e.table||{head:[],rows:[]};
    body+=`<div class="tblwrap"><table><tr>${b.table.head.map((h,k)=>`<th>${hl(h)}<br>${esc(et.head[k]||"")}</th>`).join("")}</tr>${b.table.rows.map((r,j)=>`<tr>${r.map((c,k)=>`<td>${hl(c)}${en((et.rows[j]||[])[k])}</td>`).join("")}</tr>`).join("")}</table></div>`; }
  if(b.hero2) body+=`<div class="hero" style="font-size:17px;letter-spacing:0">${hl(b.hero2)}${en(e.hero2)}</div>`;
  if(b.p2) body+=parasH(b.p2,e.p2);
  if(b.flow2) body+=flowH(b.flow2,e.flow2);
  return `<div class="block"${id?` id="${id}"`:""}><h3>${hl(b.t)}${en(e.t)}</h3>${body}</div>`;
}
const blockText=b=>[JSON.stringify(b.en||""),b.t,b.hero||"",b.hero2||"",b.pre||"",...(b.p||[]),...(b.p2||[]),...(b.flow||[]),...(b.flow2||[]),...(b.items||[]),
  ...(b.table?[...b.table.head,...b.table.rows.flat()]:[])].join(" ");

/* ===== 渲染 ===== */
let tab="soup";
try{ tab=localStorage.getItem("nl-soup-tab")||tab; }catch(e){}
if(!TABS.some(t=>t.id===tab)) tab="soup";
const today=SOUP[Math.floor(Date.now()/864e5)%SOUP.length];

function renderTabs(){
  $("#tabs").innerHTML=TABS.map(t=>`<button class="tab${t.id===tab&&!query?" on":""}" data-t="${t.id}">${t.name}</button>`).join("");
}
function renderSet(items){
  const groups=[...new Set(items.map(i=>i.group))];
  if(groups.length===1&&!groups[0]) return `<div class="grid">${items.map(i=>card(i)).join("")}</div>`;
  const chips=`<div class="chips">${groups.map((g,k)=>`<button class="chip" data-g="g${k}">${esc(g.split("｜").slice(0,2).join("｜"))}</button>`).join("")}</div>`;
  return chips+groups.map((g,k)=>{
    const p=g.split("｜");
    return `<h2 id="g${k}">${esc(p[0])}｜${esc(p[1])}${p[2]?`<small>${esc(p[2])}</small>`:""}</h2>
      <div class="grid">${items.filter(i=>i.group===g).map(i=>card(i)).join("")}</div>`;
  }).join("");
}
function render(){
  renderTabs();
  const v=$("#view");
  if(query){
    const q=query.toLowerCase();
    const hits=ALL.filter(i=>(i.ttl+" "+i.old+" "+i.nw+" "+(i.group||"")+" "+i.en.ttl+" "+i.en.old+" "+i.en.nw).toLowerCase().includes(q));
    const bl=[...THEORY,...NINE,...LESSON].filter(b=>blockText(b).toLowerCase().includes(q));
    v.innerHTML=`<div class="count">找到 ${hits.length} 句、${bl.length} 段說明</div>`+
      (hits.length?`<div class="grid">${hits.map(i=>card(i,true)).join("")}</div>`:"")+
      (bl.length?`<h2>說明段落</h2>${bl.map(b=>block(b)).join("")}`:"")+
      (!hits.length&&!bl.length?`<div class="empty">沒有符合「${esc(query)}」的內容</div>`:"");
    return;
  }
  const set=SETS.find(s=>s.id===tab);
  if(set) v.innerHTML=(tab==="soup"?`<div class="today"><small>今天送你一句 Today's line</small>${esc(today.nw)}${en(today.en.nw)}</div>`:"")+renderSet(set.items);
  else if(tab==="theory") v.innerHTML=THEORY.map(b=>block(b)).join("");
  else if(tab==="nine") v.innerHTML=`<div class="chips">${NINE.map((b,k)=>`<button class="chip" data-g="n${k}">${esc(b.t)}</button>`).join("")}</div>`+
    NINE.map((b,k)=>block(b,"n"+k)).join("");
  else v.innerHTML=LESSON.map(b=>block(b)).join("")+`<h2>六句口訣</h2><div class="grid">${SIX.map(i=>card(i)).join("")}</div>`;
}

/* ===== 互動 ===== */
$("#tabs").onclick=e=>{
  const b=e.target.closest(".tab"); if(!b) return;
  tab=b.dataset.t; query=""; $("#q").value="";
  try{ localStorage.setItem("nl-soup-tab",tab); }catch(e){}
  render(); window.scrollTo(0,0);
};
$("#q").oninput=e=>{ query=e.target.value.trim(); render(); };
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1400); }
function copy(it){
  const txt=(it.old?it.old.replace(/^不說/,"")+" → "+it.nw:it.nw)+"\n"+(it.en.old?it.en.old+" → ":"")+it.en.nw;
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("已複製"),()=>toast(txt));
}
/* ===== 英文朗讀（瀏覽器內建，不用網路金鑰） ===== */
let slow=false, voice=null;
function pickVoice(){
  const vs=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(v=>/^en/i.test(v.lang));
  const us=vs.filter(v=>/en[-_]US/i.test(v.lang));
  voice=us.find(v=>v.localService)||us[0]||vs.find(v=>v.localService)||vs[0]||null;   // 優先用電腦內建的聲音，最穩
}
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
let seq=0, audio=null, online=false;
try{ online=localStorage.getItem("nl-voice")==="online"; }catch(e){}
function showVsrc(){ $("#vsrc").textContent=online?"🌐 線上語音":"🔈 內建語音"; }
showVsrc();
$("#vsrc").onclick=()=>{ online=!online; try{ localStorage.setItem("nl-voice",online?"online":"local"); }catch(e){} showVsrc(); speak("Hello! Can you hear me?"); };
function stopSpeak(){
  seq++;
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(audio){ audio.pause(); audio=null; }
  document.querySelectorAll(".en.on").forEach(x=>x.classList.remove("on"));
}
/* 備援：內建語音沒聲音時，改用線上語音（不需要金鑰，但要有網路） */
function speakOnline(t, el, my){
  const parts=[]; let cur="";
  (t.match(/[^.!?;,]+[.!?;,]*\s*/g)||[t]).forEach(s=>{ if((cur+s).length>170&&cur){ parts.push(cur); cur=s; } else cur+=s; });
  if(cur.trim()) parts.push(cur);
  const done=()=>{ if(el) el.classList.remove("on"); };
  const next=k=>{
    if(my!==seq) return;
    if(k>=parts.length){ done(); return; }
    audio=new Audio("https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q="+encodeURIComponent(parts[k].trim()));
    audio.playbackRate=slow?0.75:1;
    audio.onended=()=>next(k+1);
    audio.onerror=()=>{ if(my===seq){ done(); toast("這裡發不出聲音，請用 Chrome 開啟並確認喇叭音量"); } };
    audio.play().catch(()=>audio&&audio.onerror());
  };
  next(0);
}
function speak(text, el){
  stopSpeak();
  const my=seq;
  const t=text.replace(/\*\*/g,"").replace(/_{2,}/g," blank ").replace(/[→↓]/g,", ").replace(/↔/g," versus ").replace(/×/g," times ").replace(/[｜|=+]/g,", ");
  if(el) el.classList.add("on");
  toast("🔊 朗讀中…");
  if(online || !window.speechSynthesis || !speechSynthesis.getVoices().length){ speakOnline(t,el,my); return; }
  const u=new SpeechSynthesisUtterance(t);
  let started=false;
  u.lang="en-US"; if(voice) u.voice=voice; u.rate=slow?0.7:0.95; u.volume=1;
  u.onstart=()=>{ started=true; };
  u.onend=()=>{ if(my===seq&&el) el.classList.remove("on"); };
  u.onerror=ev=>{ if(my===seq&&ev.error!=="canceled"&&ev.error!=="interrupted") speakOnline(t,el,my); };
  window._u=u;   // 留住參照，避免 Chrome 唸到一半被回收
  // Chrome 的老毛病：cancel() 後馬上 speak() 會沒聲音，所以稍等一下再唸
  setTimeout(()=>{ if(my!==seq) return; speechSynthesis.resume(); speechSynthesis.speak(u); },120);
  setTimeout(()=>{ if(my===seq&&!started){ speechSynthesis.cancel(); speakOnline(t,el,my); } },2000);
}
$("#slow").onclick=e=>{ slow=!slow; e.currentTarget.classList.toggle("on",slow); toast(slow?"慢速朗讀":"正常速度"); };
/* ===== 臉書貼文＋圖卡（每一句都有） ===== */
const THEME_OF={A:2,B:3,C:6,D:4,E:7,F:8,"一":0,"二":2,"三":1,"四":3,"五":4,"六":5,"七":5,"八":7,"九":5,"十":8};
function soupFor(it){
  if(!it.old) return null;
  const k=it.group?it.group.split("｜")[0]:"";
  const th=k in THEME_OF?THEME_OF[k]:9;
  return SOUP[th*6+ALL.indexOf(it)%6];
}
const oldZh=it=>it.old.replace(/^不說「/,"").replace(/」$/,"");
function postText(it){
  const tags="#心靈雞湯 #換句話說 #每天一句 #給自己的話 #正能量 #成長";
  if(!it.old) return `🌿 ${it.nw}\n\n${it.en.nw}\n\n今天把這句話送給你，也送給自己。\n如果你也需要，留一個 ❤️，或分享給那個正在努力的人。\n\n${tags}`;
  const s=soupFor(it);
  return `🌿 換一句話，心就鬆一點\n\n以前我會說：「${oldZh(it)}」\n現在我想換一句：「${it.nw}」\n\n${s.nw}\n\n🔤 English\nInstead of: ${it.en.old}\nTry: ${it.en.nw}\n${s.en.nw}\n\n你今天想換掉哪一句話？留言告訴我 💬\n\n${tags}`;
}
const PALS=[["#fdf6e3","#f7d9c4","#4a3b32","#c0623f"],["#e8f3ee","#cde5da","#23483d","#2f6f5e"],["#eef2fb","#d6def5","#2b3558","#4a5fb0"],["#fff4f6","#fbd5dc","#5a2a35","#c2506a"],["#1f2a30","#2f4a4a","#f3efe6","#f0c36a"]];
const CJKF='"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif';
function wrap(ctx,text,maxW){
  const toks=text.match(/[A-Za-z0-9'’\-_]+|\s+|[^]/g)||[], lines=[]; let cur="";
  for(const t of toks){
    if(ctx.measureText(cur+t).width>maxW && cur.trim() && !/^[，。？！；：、」』）,.?!;:”"]$/.test(t)){ lines.push(cur.trim()); cur=/^\s+$/.test(t)?"":t; }
    else cur+=t;
  }
  if(cur.trim()) lines.push(cur.trim());
  return lines;
}
function drawCard(it,pi){
  const c=$("#fbc"), ctx=c.getContext("2d"), W=1080, H=1080, P=PALS[pi%PALS.length], M=110;
  const g=ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,P[0]); g.addColorStop(1,P[1]);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=P[3]; ctx.globalAlpha=.12; ctx.beginPath(); ctx.arc(W-90,110,230,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(70,H-60,170,0,7); ctx.fill(); ctx.globalAlpha=1;
  ctx.textBaseline="top";
  let scale=1, rows, total;
  do{  // 字太多就縮小，直到放得進去
    rows=[];
    const add=(text,size,weight,color,alpha,gap)=>{ size=Math.round(size*scale); ctx.font=`${weight} ${size}px ${CJKF}`;
      wrap(ctx,text,W-2*M).forEach((l,k,a)=>rows.push({l,size,weight,color,alpha,h:size*1.45,gap:k===a.length-1?gap*scale:0})); };
    if(it.old){
      add("以前我會說",30,600,P[3],1,10);
      add("「"+oldZh(it)+"」",44,500,P[2],.6,44);
      add("現在我想換一句",30,600,P[3],1,10);
      add(it.nw,64,800,P[2],1,34);
      add(it.en.nw,34,500,P[2],.72,40);
      add(soupFor(it).nw,32,500,P[3],1,0);
    }else{
      add(it.nw,70,800,P[2],1,44);
      add(it.en.nw,38,500,P[2],.72,0);
    }
    total=rows.reduce((s,r)=>s+r.h+r.gap,0); scale-=.06;
  }while(total>H-330 && scale>.4);
  ctx.fillStyle=P[3]; ctx.font=`800 150px Georgia,serif`; ctx.fillText("“",M-14,70);
  let y=190+(H-330-total)/2;
  rows.forEach(r=>{ ctx.font=`${r.weight} ${r.size}px ${CJKF}`; ctx.fillStyle=r.color; ctx.globalAlpha=r.alpha; ctx.fillText(r.l,M,y); y+=r.h+r.gap; });
  ctx.globalAlpha=1; ctx.fillStyle=P[3]; ctx.fillRect(M,H-128,90,6);
  ctx.font=`700 32px ${CJKF}`; ctx.fillStyle=P[2]; ctx.fillText("換句話說・心靈雞湯",M,H-104);
  ctx.font=`500 26px ${CJKF}`; ctx.globalAlpha=.6; ctx.textAlign="right"; ctx.fillText(`${it.src} ${it.num}`,W-M,H-98); ctx.textAlign="left"; ctx.globalAlpha=1;
}
function showPost(it){
  let pi=ALL.indexOf(it);
  const m=$("#mcard"); m.classList.add("wide");
  m.innerHTML=`<canvas id="fbc" width="1080" height="1080"></canvas>
    <textarea id="fbt" rows="9"></textarea>
    <div class="acts"><button class="btn" id="fbpal">🎨 換配色</button><button class="btn" id="fbdl">⬇ 下載圖卡</button><button class="btn" id="fbcp">📋 複製貼文</button><button class="btn" id="fbx">關閉</button></div>`;
  $("#fbt").value=postText(it); drawCard(it,pi);
  $("#fbpal").onclick=()=>drawCard(it,++pi);
  $("#fbdl").onclick=()=>$("#fbc").toBlob(async b=>{
    const filename=`雞湯圖卡_${it.src}_${it.num}.png`;
    // 部署在 claude.ai 上時，要透過平台的下載功能；本機直接開檔則用一般下載
    const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(dl){ try{ await dl.save({filename,data:b}); toast("圖卡已下載"); }catch(err){ toast(err&&err.code==="declined"?"已取消下載":"這裡無法下載圖卡"); } return; }
    const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=filename; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); toast("圖卡已下載");
  });
  $("#fbcp").onclick=()=>{ const t=$("#fbt"); (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast("貼文已複製"),()=>{ t.select(); document.execCommand("copy"); toast("貼文已複製"); }); };
  $("#fbx").onclick=()=>$("#modal").classList.remove("show");
  $("#modal").classList.add("show");
}
document.addEventListener("click",e=>{
  const f=e.target.closest(".fb"); if(f){ showPost(ALL[+f.dataset.i]); return; }
  const s=e.target.closest(".say"); if(s){ speak(sayText(ALL[+s.dataset.i])); return; }
  const x=e.target.closest(".en"); if(x) speak(x.textContent, x);
});
$("#view").onclick=e=>{
  if(e.target.closest(".en,.say,.fb")) return;
  const c=e.target.closest(".chip");
  if(c){ const el=document.getElementById(c.dataset.g); window.scrollTo({top:el.getBoundingClientRect().top+scrollY-$("header").offsetHeight-8,behavior:"smooth"}); return; }
  const k=e.target.closest(".card[data-i]"); if(k) copy(ALL[+k.dataset.i]);
};
function showRandom(){
  const it=ALL[Math.floor(Math.random()*ALL.length)];
  $("#mcard").innerHTML=`<div class="meta"><span class="num">${it.num}</span>${it.ttl?`<span class="ttl">${esc(it.ttl)}</span>`:""}<span class="src">${it.src}</span></div>
    ${it.old?`<div class="old">${esc(it.old)}</div>${en(it.en.old)}`:""}<div class="new${it.old?"":" plain"}">${esc(it.nw)}</div>${en(it.en.nw)}
    <div class="acts"><button class="btn say" data-i="${ALL.indexOf(it)}" style="margin-left:0;padding:8px 12px">🔊 朗讀</button><button class="btn fb" data-i="${ALL.indexOf(it)}" style="margin-left:0;padding:8px 12px">📣 臉書貼文</button><button class="btn" id="mcopy">複製</button><button class="btn" id="mnext">再一句</button><button class="btn" id="mclose">關閉</button></div>`;
  $("#mcard").classList.remove("wide");
  $("#mcopy").onclick=()=>copy(it); $("#mnext").onclick=showRandom; $("#mclose").onclick=()=>$("#modal").classList.remove("show");
  $("#modal").classList.add("show");
}
$("#rand").onclick=showRandom;
$("#modal").onclick=e=>{ if(e.target.id==="modal") $("#modal").classList.remove("show"); };
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") $("#modal").classList.remove("show");
  if(e.key==="/"&&document.activeElement!==$("#q")){ e.preventDefault(); $("#q").focus(); }
});
render();
</script>
</body>
</html>
