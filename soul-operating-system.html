<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>靈魂作業系統 Soul OS</title>
<style>
:root{--bg:#f6f4ef;--panel:#fffdf9;--ink:#23211d;--mute:#7a746a;--line:#e3ddd1;--acc:#0f6e63;--acc2:#e6f2ef;--old:#fbeeea;--oldink:#8a3b24;--new:#e8f4ee;--newink:#17613f;--hit:#ffe58a}
@media(prefers-color-scheme:dark){:root{--bg:#171613;--panel:#201f1b;--ink:#ece8df;--mute:#9a9488;--line:#35322c;--acc:#5fc8b8;--acc2:#1e2f2c;--old:#33221d;--oldink:#f0b5a2;--new:#1b2e25;--newink:#a5e0c0;--hit:#6b5a12}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.7 "Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;white-space:nowrap;color:var(--acc)}
#q{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
#q:focus{outline:2px solid var(--acc);border-color:transparent}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--acc);color:var(--acc)}
.wrap{display:flex;min-height:calc(100% - 56px)}
nav{width:250px;flex:none;padding:12px 8px;border-right:1px solid var(--line);position:sticky;top:56px;align-self:flex-start;max-height:calc(100vh - 56px);overflow:auto}
nav a{display:block;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;cursor:pointer;font-size:14px;line-height:1.4}
nav a small{color:var(--mute);display:block;font-size:12px}
nav a:hover{background:var(--acc2)}
nav a.on{background:var(--acc);color:#fff}
nav a.on small{color:#ffffffcc}
main{flex:1;min-width:0;padding:18px 22px 80px;max-width:1100px}
h2{font-size:21px;margin:0 0 4px}
.desc{color:var(--mute);margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.chips a{font-size:12.5px;padding:3px 9px;border:1px solid var(--line);border-radius:99px;cursor:pointer;background:var(--panel);color:var(--mute)}
.chips a:hover{color:var(--acc);border-color:var(--acc)}
h3{font-size:16.5px;margin:26px 0 8px;padding:6px 12px;background:var(--acc2);border-left:4px solid var(--acc);border-radius:0 8px 8px 0;scroll-margin-top:70px}
p,.it,.q,.sub,.lab,.ar,.on2,.call{margin:3px 0;scroll-margin-top:70px}
.lab{font-weight:700;margin-top:12px;color:var(--acc)}
.term{font-weight:700;margin-top:10px}
.sub{padding-left:16px;color:var(--mute)}
.ar{text-align:center;color:var(--mute);line-height:1.1}
.it{display:flex;gap:8px}
.it b.n{flex:none;font-size:12px;height:22px;min-width:26px;margin-top:3px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;background:var(--acc2);color:var(--acc)}
.it.hd{margin-top:14px;font-weight:700}
.q{padding:5px 12px;border-left:3px solid var(--line);background:var(--panel);border-radius:0 6px 6px 0}
.call{padding:10px 14px;border:1px solid var(--acc);border-radius:10px;background:var(--acc2);font-weight:600;margin:10px 0}
.on2{display:grid;grid-template-columns:30px 1fr 1fr;gap:6px;align-items:stretch;margin:5px 0}
.on2>b{font-size:12px;color:var(--mute);padding-top:7px;text-align:center}
.on2>div{padding:6px 10px;border-radius:8px}
.on2 .o{background:var(--old);color:var(--oldink)}
.on2 .w{background:var(--new);color:var(--newink)}
.on2 em{display:block;font-style:normal;font-size:12.5px;opacity:.85;margin-top:2px}
.tw{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;text-align:left;min-width:110px}
th{background:var(--acc2);position:sticky;top:0;white-space:nowrap}
tr:last-child td{border-bottom:0}td:last-child,th:last-child{border-right:0}
td:first-child,th:first-child{min-width:40px}
mark{background:var(--hit);color:inherit;border-radius:3px;padding:0 1px}
.flash{animation:fl 2s}
@keyframes fl{0%,60%{background:var(--hit)}100%{background:transparent}}
.res{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin:6px 0;cursor:pointer}
.res:hover{border-color:var(--acc)}
.res small{color:var(--mute);display:block}
.quote{display:flex;gap:10px;align-items:center;padding:10px 14px;border:1px dashed var(--acc);border-radius:10px;margin:0 0 16px;background:var(--panel)}
.quote span{flex:1}
.day{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.day input[type=date],.f input,.f textarea{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
.gate{display:grid;grid-template-columns:28px 1fr;gap:4px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:8px 0}
.gate.done{border-color:var(--acc);background:var(--acc2)}
.gate input[type=checkbox]{width:20px;height:20px;margin-top:3px;accent-color:var(--acc)}
.gate .t{font-weight:700}.gate .t small{font-weight:400;color:var(--mute);margin-left:6px}
.gate .ask{color:var(--acc)}.gate .do{color:var(--mute);font-size:13.5px}
.gate input[type=text]{width:100%;margin-top:4px;font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.f{display:grid;grid-template-columns:200px 1fr;gap:6px 10px;align-items:center;margin:6px 0}
.f input{width:100%}
details{margin:10px 0;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
summary{cursor:pointer;font-weight:700}
.pg{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.post{white-space:pre-wrap;padding:14px 18px;border:1px solid var(--line);border-radius:10px;background:var(--panel);line-height:1.85}
.cardbox{position:sticky;top:70px}
.cardbox canvas{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);display:block}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.qs div{padding:5px 10px;border:1px solid var(--line);border-radius:8px;margin:4px 0;cursor:pointer;font-size:13px;background:var(--panel)}
.qs div.on{border-color:var(--acc);background:var(--acc2)}
.chips a.on{background:var(--acc);color:#fff;border-color:var(--acc)}
@media(max-width:1000px){.pg{grid-template-columns:1fr}.cardbox{position:static;max-width:420px}}
@media(max-width:800px){.wrap{display:block}nav{position:static;width:auto;max-height:none;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}nav a{white-space:nowrap}nav a small{display:none}main{padding:14px 16px 60px}.on2{grid-template-columns:24px 1fr}.on2 .w{grid-column:2}.f{grid-template-columns:1fr}}
@media print{header,nav,.chips,.quote{display:none}main{max-width:none}}
</style>
</head>

</header>

<script type="text/plain" id="raw1">已把「一頁總表」改成固定六欄，並統一每列的語意層級，避免原本「層級／核心問題／舊模式／更新模式／操作槓桿」互相錯位。
【一頁總表｜欄位對齊修正版】
| Node｜節點 | 本體／功能 | 核心問題 | 舊模式｜被模型綁架 | 新模式｜可更新模型 | 核心槓桿｜實際操作 |
|---|---|---|---|---|---|
| 01｜Soul OS｜靈魂作業系統 | 整體生成系統｜統整自我、世界、價值、意義、身分、權重與方向 | 我整體如何理解自己與世界？ | 我就是這樣，現在的我就是永遠的我 | 現在只是系統目前的狀態，不等於永恆本質 | 找出Thought背後的Generator |
| 02｜Self Model｜自我模型 | 自我表徵｜系統對「我是誰」的模型 | 我認為自己是誰？ | 我失敗＝我是失敗的人 | 我在某個任務失敗≠我的全部身分 | Identity Differentiation｜身分分化 |
| 03｜World Model｜世界模型 | 世界表徵｜系統對「世界如何運作」的模型 | 我認為世界怎麼運作？ | 世界就是危險／人都會傷害我 | 這個模型只適用於哪些情境？ | Reality Test｜現實測試 |
| 04｜Value Model｜價值模型 | 價值排序｜決定什麼值得追求 | 對我而言什麼最重要？ | 別人的認同比自己的Reality更重要 | 重新檢查真正想最佳化的目標 | Goal／Value Update｜目標與價值更新 |
| 05｜Meaning｜意義模型 | 意義賦予｜事件對「我」代表什麼 | 我把這件事解讀成什麼？ | 被拒絕＝我沒有價值 | 被拒絕＝一次關係結果，不等於整體自我價值 | Meaning Reconstruction｜意義重構 |
| 06｜Identity｜身分模型 | 身分穩定器｜維持「我是誰」的一致性 | 我正在保護哪一個自己？ | 我不能失敗，否則我就不是好學生／好老師／好媽媽 | 身分可以保持核心價值，同時允許表現改變 | Identity Flexibility｜身分流動性 |
| 07｜Weight｜權重 | 訊號重要度｜決定哪些資訊取得控制權 | 我把什麼看得最重要？ | 舊創傷、批評、失敗取得最高權重 | 目前Reality與新Evidence可以重新取得權重 | Reweighting｜重新賦權 |
| 08｜Attention｜注意 | 資訊閘門｜決定什麼進入主要處理 | 我的注意力被什麼抓走？ | 自動搜尋威脅、拒絕、失敗 | 主動搜尋Difference與反例 | Attention Reallocation｜注意重新配置 |
| 09｜Evidence Selection｜證據選擇 | 證據取樣｜決定哪些資料進入模型 | 我正在採信哪些證據？ | 只收集支持舊信念的資料 | 同時尋找支持證據與反證 | Evidence Expansion｜擴大證據集 |
| 10｜Representation｜表徵 | 經驗建模｜把Reality轉成可理解的內在模型 | 我把事情解釋成什麼？ | 第一個解釋＝Reality | 第一個解釋只是Candidate Model｜候選模型 | Differentiation｜表徵分化 |
| 11｜Prediction｜預測 | 未來模型｜根據目前模型預測下一步 | 我預期接下來會發生什麼？ | 我覺得會發生＝一定會發生 | Prediction只是有機率的模型輸出 | Probability Calibration｜機率校準 |
| 12｜Thought｜念頭 | 表層輸出｜模型進入意識後形成的內容 | 我腦中現在出現什麼？ | Thought＝Truth＝Self | Thought＝目前Generator的一次輸出 | Decentering｜與念頭脫鉤 |
| 13｜Emotion｜情緒 | 狀態訊號｜反映Prediction、Value與身體狀態的整合 | 系統正在警告／重視什麼？ | 我害怕＝事情一定危險 | 我害怕＝系統目前提高Threat Weight | Emotion Differentiation｜情緒分化 |
| 14｜Agency｜自主選擇 | 行動自由度｜在多個Action之間重新選擇 | 我還有其他選擇嗎？ | Trigger直接啟動舊Action | Trigger與Action之間重新打開選擇空間 | Action Space Expansion｜擴大行動空間 |
| 15｜Action｜行動 | 模型輸出｜把Prediction轉成世界中的行為 | 我實際做了什麼？ | 自動執行最高權重的舊反應 | 把Action當成可以測試模型的Experiment | Minimum Experiment｜最小實驗 |
| 16｜Feedback｜回饋 | Reality回傳資料｜行動後世界真正發生什麼 | Reality實際回答了什麼？ | 只看符合自己期待的結果 | 收集完整結果，不替Reality說話 | Measurement｜測量 |
| 17｜Prediction Error｜預測誤差 | 模型與Reality的Difference | 我的預測哪裡錯了？ | 猜錯＝失敗／羞恥 | 猜錯＝Reality提供新的學習訊號 | Error Detection｜誤差偵測 |
| 18｜Reweighting｜重新賦權 | 證據權重更新｜重新排序資訊的重要程度 | 哪些證據應升權或降權？ | 新證據必須服從舊模型 | 新Evidence可以降低舊Prior的控制力 | Weight Update｜權重更新 |
| 19｜Model Update｜模型更新 | Generator更新｜修改產生Prediction的模型 | 哪個深層模型需要修改？ | 保護舊模型，即使Reality已經不同意 | 用Prediction Error修改Self／World／Value Model | Updating｜模型更新 |
| 20｜Awakening｜覺醒 | Meta-awareness｜看見整個生成系統正在運作 | 我能不能看見「我是如何生成這個世界經驗的」？ | 把Representation、Prediction、Thought直接當Reality | 看見Thought只是Output，並能追溯Generator | Meta-awareness＋Updating｜後設覺察＋更新 |
【六欄固定讀法】
第1欄｜Node＝現在處理哪個節點。
第2欄｜本體／功能＝這個Node到底負責什麼。
第3欄｜核心問題＝進入這個Node時要問什麼。
第4欄｜舊模式＝系統如何被既有模型鎖住。
第5欄｜新模式＝如何恢復流動性與可更新性。
第6欄｜核心槓桿＝下一步到底做什麼。
【整張表的垂直生成順序】
Soul OS
→Self Model
→World Model
→Value Model
→Meaning
→Identity
→Weight
→Attention
→Evidence Selection
→Representation
→Prediction
→Thought
→Emotion
→Agency
→Action
→Feedback
→Prediction Error
→Reweighting
→Model Update
→Awakening
→再回到新的Soul OS。
【最短記憶版】
靈魂決定深層模型。
深層模型決定權重。
權重決定注意。
注意決定你看見哪些證據。
證據進入表徵。
表徵生成預測。
預測生成念頭與情緒。
Agency決定是否照舊模式行動。
Action碰到Reality。
Reality產生Feedback。
Feedback暴露Prediction Error。
Prediction Error促成Reweighting。
Reweighting推動Model Update。
Model Update改變下一輪生成。
所以真正的覺醒不是「把念頭轉好」。
而是「看見念頭的生成鏈，並取得修改Generator的能力」。【總公式】
Self Model→World Model→Value Model→Meaning→Identity→Weight→Attention→Evidence Selection→Representation→Prediction→Thought→Emotion→Agency→Action→Feedback→Prediction Error→Reweighting。
以下「舊→新」不是壞人變好人，而是Rigid Model｜僵固模型→Updatable Model｜可更新模型。
━━━━━━━━━━━━━━━━━━
【01｜Self Model｜自我模型｜我是誰？】
01｜舊：我是失敗者→新：我目前在某個任務失敗。
02｜舊：我就是沒能力→新：能力是分領域、分階段的狀態。
03｜舊：我個性就是這樣→新：目前只是穩定的行為模式。
04｜舊：我不會改變→新：我可以透過新Evidence更新自己。
05｜舊：我很笨→新：我要定位是哪個Node不足。
06｜舊：我沒有自制力→新：我要找出什麼情境讓控制失效。
07｜舊：我很懶→新：我要拆解動機、摩擦與獎賞結構。
08｜舊：我很脆弱→新：目前某些Trigger具有過高Threat Weight。
09｜舊：我不值得被愛→新：關係結果不能直接測量我的整體價值。
10｜舊：我一定做不到→新：目前模型缺乏成功Evidence。
11｜舊：我是內向的人→新：不同情境下我的社交輸出不同。
12｜舊：我天生焦慮→新：目前系統容易生成威脅Prediction。
13｜舊：我是問題本身→新：我擁有一個需要更新的問題模型。
14｜舊：別人比我強＝我很差→新：比較提供能力Difference。
15｜舊：犯錯代表我不好→新：錯誤是Model與Reality的差距。
16｜舊：我的過去就是我→新：過去形成Prior，不等於現在全部的我。
17｜舊：我的情緒就是我→新：情緒是目前系統狀態。
18｜舊：我的念頭就是我→新：Thought是Generator的一次輸出。
19｜舊：別人的評價定義我→新：他人的評價只是Evidence之一。
20｜舊：成績定義我→新：成績只測量特定時間的部分表現。
21｜舊：工作定義我→新：角色只是Self Model的一部分。
22｜舊：關係定義我→新：關係狀態不等於Self Worth。
23｜舊：我必須證明自己→新：我可以測試與發展自己。
24｜舊：我不能示弱→新：暴露限制可以增加模型解析度。
25｜舊：我不能改口→新：新Evidence出現就應更新。
26｜舊：改變代表否定過去→新：改變代表模型解析度提高。
27｜舊：我要維持一致→新：我要維持可更新性。
28｜舊：我需要找到真正的自己→新：Self Model會持續生成與重構。
29｜舊：我是固定實體→新：我是具有歷史與可塑性的動態系統。
30｜舊：自由＝做自己→新：自由＝不被舊Self Model永久綁架。
━━━━━━━━━━━━━━━━━━
【02｜World Model｜世界模型｜世界如何運作？】
01｜舊：世界很危險→新：危險具有情境與機率。
02｜舊：人都不可信→新：可信度需要逐人、逐情境估計。
03｜舊：世界不公平→新：不同系統存在不同資源與規則。
04｜舊：努力一定成功→新：努力只是多個變數之一。
05｜舊：失敗就是命不好→新：失敗可以拆成多個結構變數。
06｜舊：成功靠運氣→新：區分可控制與不可控制變數。
07｜舊：好人一定有好報→新：道德價值與結果機制不是同一變數。
08｜舊：壞事發生一定有原因→新：複雜結果可能來自多因素交互。
09｜舊：別人都在看我→新：我要檢查實際Evidence。
10｜舊：大家都比我幸福→新：我只看見別人暴露出的局部資訊。
11｜舊：有錢就安全→新：安全由多種資源與適應能力共同生成。
12｜舊：穩定最好→新：過度穩定可能降低適應性。
13｜舊：變化很危險→新：變化同時帶來Error與新可能。
14｜舊：不確定性很可怕→新：不確定性代表模型尚未收斂。
15｜舊：一定要找到答案→新：某些問題應維持機率分布。
16｜舊：世界應該照我的期待走→新：Reality沒有服從Prediction的義務。

【17階總壓縮｜最好背版本】
Self Model｜從「我是這樣」→「我目前這樣」。
World Model｜從「世界就是這樣」→「這是目前最能解釋世界的模型」。

Evidence Selection｜從「找證據證明我」→「找證據修正我」。
Representation｜從「第一解釋＝Reality」→「第一解釋＝Candidate Model」。
Prediction｜從「我覺得＝會發生」→「把未來轉成可測試機率」。
Thought｜從「念頭＝我」→「念頭＝Generator輸出」。
Emotion｜從「情緒＝真相」→「情緒＝System Signal」。
Agency｜從「我只能這樣」→「我還能生成什麼Action？」。
Action｜從「行動證明自己」→「行動測試模型」。
Feedback｜從「Reality評價我」→「Reality提供資料」。
Prediction Error｜從「猜錯＝失敗」→「猜錯＝更新入口」。
Reweighting｜從「保護舊權重」→「讓新Evidence重新分配控制權」。
【整體生成公式】
Self Model→World Model→Value Model→Meaning→Identity→Weight→Attention→Evidence Selection→Representation→Prediction→Thought→Emotion→Agency→Action→Feedback→Prediction Error→Reweighting→Model Update→再次生成新的Self Model。
【最核心的新舊差異】
舊系統的核心不是「負面」。
舊系統真正的問題是Rigid｜僵固。
新系統的核心也不是「正面」。
新系統真正的能力是Fluid｜流動＋Updatable｜可更新。
因此真正的靈魂覺醒，不是把510個「舊念頭」全部換成510個「好念頭」。
而是讓這17個生成層都重新取得被Reality修正的能力。
最高階自由不是「我終於控制所有念頭」。

統一讀法＝舊模式→舊後果｜新模式→新後果。

而是：
僵固→流動。

這六個詞不是六件分開的事，而可以整理成一條「從被舊模式自動控制，到能重新選擇」的生成鏈。
資訊熵↑→可能狀態增加→單一表徵鬆動→表徵分化↑→注意與價值權重可重新配置→自主選擇空間↑→新行動→新回饋→預測誤差→模型更新→長期學習與可塑性改變→形成新的穩定模式。
若把「靈魂覺醒」當成哲學與身心靈語言，而不是生物醫學診斷，它可以被操作性地定義成：
靈魂覺醒＝一個人開始看見「我的念頭、情緒、身分與價值排序只是目前模型的輸出，而不是Reality本身」，因此取得重新表徵、重新賦權與重新選擇的能力。

【一｜資訊熵 Information Entropy｜不是混亂，而是可能性尚未被過早壓縮】
認知系統每一刻都在面對多種可能解釋。
同一句「他沒有回我訊息」，至少可以生成：
他討厭我。
他很忙。
他沒看到。
他不知道怎麼回答。
他正在處理自己的問題。
關係正在改變。
我目前沒有足夠資料。
舊模式會迅速把多個可能性壓成一個答案。
「他沒回＝他不在乎我。」
這等於過早降低認知狀態空間。
真正重要的不是追求最大熵，而是避免在證據不足時過早鎖死模型。
成熟系統不是永遠保持無限可能。
成熟系統是：
先保留足夠可能性→取得Difference→再依Evidence更新機率。
所以真正需要的是「可調節的不確定性」，而不是永遠確定，也不是永遠混亂。
生活白話：
事情剛發生時，不要急著宣布答案。
先讓Reality有機會說話。
━━━━━━━━━━━━━━━━━━
【二｜表徵 Representation｜你活的不是Reality本身，而是大腦目前建立的Reality模型】
外界事件不會原封不動進入意識。
Reality→感覺輸入→注意選擇→特徵抽取→記憶比對→概念分類→語言標記→意義生成→Prediction。
所以：
事件≠表徵。
表徵≠真相。
表徵＝系統目前用來理解事件的工作模型。
例如：
Reality＝學生考58分。
表徵A＝「我就是不會英文。」
表徵B＝「我的單字提取速度不夠。」
表徵C＝「長句解析是主要瓶頸。」
表徵D＝「目前策略沒有對準錯誤來源。」
同一個58分，可以生成完全不同的未來。
因為真正控制下一步行動的，不只是58分，而是你把58分表徵成什麼。
━━━━━━━━━━━━━━━━━━
【三｜分化 Differentiation｜覺醒的重要能力不是正向，而是解析度提高】
低分化系統喜歡二元分類。
成功／失敗。
愛我／不愛我。
好人／壞人。
有救／沒救。
命好／命差。
高分化系統則能把一個巨大標籤拆成多個可辨識狀態。
「我很焦慮。」
可以分化成：
不確定性。
失控感。
評價威脅。
能力不足預期。
身體高喚醒。
關係安全感下降。
時間壓力。
過往記憶被觸發。
分化一增加，可控制的Node就增加。
Node增加，介入點就增加。
介入點增加，Action Space就增加。
所以：
分化不是想更多。
分化是把模糊痛苦轉成可以辨識、比較、測試與更新的結構。
低分化：
「我的人生完了。」
高分化：
「目前是財務壓力高＋關係衝突高＋睡眠不足，但工作能力仍存在，社會支持仍存在，而且其中三個變數可以分別介入。」
前一句生成宿命。
後一句生成控制介面。
━━━━━━━━━━━━━━━━━━
【四｜權重 Weight｜真正支配人的往往不是知道什麼，而是哪個訊號被系統判定最重要】
認知系統不是平等處理所有資訊。
每個訊號都有不同權重。
注意權重。
威脅權重。
獎賞權重。
記憶權重。
社會評價權重。
身分權重。
價值權重。
預測誤差權重。
所以一個人可能「知道很多」，行為卻完全沒有改變。
因為Knowledge存在，不代表Knowledge取得控制權。
例如：
你知道「一次考差不代表人生失敗」。
但如果系統內部：
父母評價Weight＝90。
同儕比較Weight＝80。
一次考試Weight＝95。
自己的長期成長Weight＝20。
那麼考試仍然會控制整個情緒系統。
真正的成長不是再增加一句大道理。
真正的成長是Weight Reallocation。
把：
別人怎麼看我↑
改成：
Reality告訴我什麼↑。
把：
一次結果↑
改成：
長期趨勢↑。
把：
舊記憶↑
改成：
目前證據↑。
把：
身分防衛↑
改成：
Prediction Error↑。
━━━━━━━━━━━━━━━━━━
【五｜自主選擇 Agency｜自由不是沒有影響，而是影響不能直接決定輸出】
認知科學不需要假設人完全脫離過去。
人的選擇會受到：
記憶。
習慣。
情緒。
身體狀態。
社會環境。
獎賞結構。
既有信念。
預測模型。
共同塑形。
因此真正有用的自由定義不是：
「我完全不受任何東西影響。」
而是：
Stimulus與Action之間存在可更新的模型空間。
低Agency：
刺激→舊表徵→舊權重→自動反應。
高Agency：
刺激→暫停→生成多個表徵→辨識權重→預測不同結果→選擇Action→觀察Feedback→更新Model。
所以自由不是「想做什麼就做什麼」。
自由＝舊模型不再擁有唯一的輸出權。
━━━━━━━━━━━━━━━━━━
【六｜表觀遺傳學 Epigenetics｜不是改寫DNA，而是生命系統存在可塑性的調控層】
DNA序列不是每一刻全部以相同方式運作。
細胞會透過DNA methylation｜DNA甲基化、Histone Modification｜組蛋白修飾、Chromatin Accessibility｜染色質可及性等機制調節基因表現。
因此：
Genome相對穩定。
Gene Expression具有情境依賴性。
同樣的Genome，可以存在不同Regulatory State。
但這裡必須保留重要邊界。
不能把「想法改變」直接簡化成「意念改寫DNA」。
也不能把每一次情緒改變直接宣稱為特定表觀遺傳改變。
較精準的模型是：
環境／行為／壓力／睡眠／營養／活動等長期條件→生理訊號環境改變→部分細胞調控路徑與基因表現可能改變。
所以表觀遺傳學真正帶來的重要啟發不是「你可以用意念控制基因」。
而是：
Genome不是生命所有狀態的唯一決定層。
Regulation也是系統的一部分。
生命存在多層控制與可塑性。
━━━━━━━━━━━━━━━━━━
【七｜認知可塑性 × 表觀遺傳可塑性｜兩者不能粗暴畫等號】
認知科學描述的是：
注意如何改變。
表徵如何形成。
預測如何產生。
學習如何更新。
習慣如何穩定。
認知彈性如何增加。
表觀遺傳學描述的是：
細胞如何調節Gene Expression。
Chromatin如何改變可及性。
環境訊號如何與細胞調控網路互動。
兩者可以放進同一個多層系統，但不能說：
「一個念頭＝一個甲基化變化。」
更好的跨層模型是：
Experience→Perception→Representation→Prediction→Action→Repeated Behavior→Environment/Physiology→Cellular Signaling→Gene Regulation。
反方向也成立：
Gene Regulation→Cellular State→Neural/Physiological State→Cognitive Constraints→Representation與Action的機率分布。
這是一個雙向、多尺度、非線性的耦合系統。
━━━━━━━━━━━━━━━━━━
【八｜靈魂覺醒 Soul Awakening｜把神祕詞轉成可以操作的高階能力】
若保留「靈魂」作為存在論與生命意義語言，而不假裝它是可直接由生物學測量的器官，那麼「覺醒」可以拆成七個可操作能力。
Awareness｜看見自己正在產生表徵。
Decentering｜知道「我有這個念頭」不等於「這個念頭就是我」。
Differentiation｜把模糊經驗拆成更細Node。
Reweighting｜重新決定什麼證據值得更高權重。
Model Flexibility｜允許第二、第三種解釋存在。
Agency｜在多個可能Action之間重新選擇。
Updating｜Reality不同意我時，我願意修改自己。
因此：
覺醒≠知道宇宙秘密。
覺醒≠永遠正能量。
覺醒≠沒有負面情緒。
覺醒≠相信自己可以控制一切。
覺醒＝開始看見「我的模型正在生成我的世界經驗」。
更高階的覺醒＝知道模型可以被Reality修正。
━━━━━━━━━━━━━━━━━━
【九｜六大Node真正串起來】
N01｜Information Entropy｜資訊熵｜現在到底還存在多少可能解釋？
↓
N02｜Representation｜表徵｜我目前把事情解釋成什麼？
↓
N03｜Differentiation｜分化｜我能不能生成第二、第三、第四個更精細模型？
↓
N04｜Weight｜權重｜哪一個訊號正在取得我的注意、情緒與決策控制權？
↓
N05｜Agency｜自主選擇｜我能不能不直接執行最高權重的舊反應？
↓
N06｜Awakening｜覺醒｜我能不能看見整個生成過程，而不是把生成結果誤認成Reality？
↓
Feedback｜回饋。
↓
Prediction Error｜預測誤差。
↓
Model Update｜模型更新。
↓
新的Representation。
↓
新的Weight。
↓
新的Action Space。
━━━━━━━━━━━━━━━━━━
【十｜舊模式→新模式】
舊模式｜事情只有一個解釋→新模式｜先保留多個假設。
舊模式｜我的感覺就是真相→新模式｜感覺是系統訊號，不等於Reality全貌。
舊模式｜我的念頭就是我→新模式｜念頭是目前模型生成的內容。
舊模式｜個性就是這樣→新模式｜穩定模式也可能包含可塑性。
舊模式｜過去決定未來→新模式｜過去形成Prior，但新Evidence可以更新Posterior。
舊模式｜別人否定我＝我沒有價值→新模式｜他人的評價只是眾多Evidence之一。
舊模式｜失敗證明我不行→新模式｜失敗提供Prediction Error。
舊模式｜我要消滅負面情緒→新模式｜我要提高情緒分化解析度。
舊模式｜我要控制世界→新模式｜我要提高模型更新速度。
舊模式｜自由＝沒有限制→新模式｜自由＝限制存在時仍能生成新的Action。
舊模式｜覺醒＝得到終極答案→新模式｜覺醒＝不再把任何暫時模型當成終極答案。
━━━━━━━━━━━━━━━━━━
【十一｜一個生活案例】
事件：
孩子考試失敗。
第一層｜Information Entropy。
不要立刻收斂成「他不用功」。
保留：
知識缺口？
提取速度？
注意力？
睡眠？
焦慮？
題型陌生？
時間管理？
策略錯誤？
第二層｜Representation。
把「他很懶」改成「目前存在尚未定位的Performance Bottleneck」。
白話：
先不要罵人，先找卡在哪裡。
第三層｜Differentiation。
把「英文不好」拆成：
Vocabulary。
Syntax。
Reading。
Retrieval。
Working Memory。
Time Allocation。
第四層｜Weight。
找出真正高權重Node。
例如Vocabulary Retrieval＝0.7。
Syntax Parsing＝0.6。
Motivation＝0.2。
第五層｜Agency。
不要因為「考差」直接生成「補更多題」。
重新選擇：
先針對最高權重瓶頸介入。
第六層｜Feedback。
兩週後重測。
第七層｜Prediction Error。
如果單字改善但閱讀仍然慢，就表示原模型漏掉Node。
第八層｜Model Update。
重新估計Syntax與Working Memory權重。
這就是覺醒的生活版本：
不再被第一個解釋綁架。
━━━━━━━━━━━━━━━━━━
【十二｜真正可以訓練的每日七問】
今天什麼事件讓我立刻產生強烈反應？
我第一個Representation是什麼？
除了這個解釋，至少還有哪三個可能？
我把哪一個訊號Weight放得過大？
目前真正Evidence是什麼？
如果舊模型錯了，我可以做哪個最小實驗？
什麼Feedback會讓我願意更新Model？
━━━━━━━━━━━━━━━━━━
【十三｜最終統一公式】
Reality
→Information Uncertainty
→Observation
→Representation
→Differentiation
→Weight Allocation
→Prediction
→Emotion
→Action Tendency
→Agency
→Choice
→Action
→Feedback
→Prediction Error

→Model Update
→Learning
→Repeated Embodiment
→新的穩定模式。
真正的成長，不只是資訊增加，而是Prediction Error之後仍然能更新。
真正的智慧，不是永遠猜對，而是猜錯以後能更快接近Reality。
真正的自主，不是不受過去影響，而是過去不能壟斷下一個Action。
真正的分化，不是把世界搞得更複雜，而是提高解析度，找到真正可介入的Node。
真正的權重自由，不是什麼都不重要，而是自己能重新決定什麼值得重要。
真正的覺醒，不是從此找到唯一真相，而是不再把第一個表徵誤認為Reality。
資訊熵替生命保留可能性。
表徵替Reality建立模型。
分化提高模型解析度。
權重決定哪個模型取得控制權。
自主選擇打開新的Action Space。
Prediction Error迫使舊模型接受Reality校正。
Model Update讓人不再被昨天的自己永久綁架。
若要用一句話統整：
「覺醒不是知道更多，而是看見自己如何生成世界，並重新取得更新這套生成系統的能力。」
若再壓縮成一條LifeOS核心鏈：
可能性→表徵→分化→權重→選擇→行動→回饋→誤差→更新→自由。
自由的最高形式，不是世界永遠符合你的Prediction。
自由的最高形式，是世界推翻你的Prediction之後，你仍然能重新生成自己。【核心命題】
如果把「靈魂」定義為人的深層價值、身分、意義、目標與長期權重結構，那麼「念頭」可以理解成這套深層結構在特定情境下生成的表層輸出。
因此，比「轉念」更精準的說法不是「把負面想法換成正面想法」，而是「改變生成念頭的深層模型」。
但必須保留一條邊界：
認知科學與表觀遺傳學目前不能證明一個獨立存在的「靈魂實體」直接產生神經活動或念頭。
所以以下的「靈魂」是存在論／生命系統層的概念，不把它冒充成已被生物學驗證的器官或因果變數。
━━━━━━━━━━━━━━━━━━
【一｜為什麼單純「轉念」可能只是表層操作】
一個人害怕被拒絕。
表面念頭是：
「他不回我，一定是不喜歡我。」
有人告訴他：
「轉念，他可能只是很忙。」
句子改變了。
但如果深層仍然存在：
Identity＝我不值得被愛。
World Model＝人最後都會離開。
Value Weight＝別人的認可極度重要。
Threat Weight＝被拒絕是重大威脅。
Prediction＝親密最後會帶來傷害。
那麼新的正向句子很可能壓不過舊模型。
今天可以告訴自己「他只是忙」。
明天對方再次不回訊息，舊Prediction又重新取得控制權。
所以問題不一定是：
「我應該換成哪個念頭？」
而可能是：
「到底是哪套生成模型，一直產生這類念頭？」
━━━━━━━━━━━━━━━━━━
【二｜念頭不是起點，而是輸出】
可以把系統改寫成：
Deep Model→Weight→Attention→Representation→Prediction→Thought。
白話就是：
深層怎麼理解自己與世界。
↓
決定什麼最重要。
↓
決定注意什麼。
↓
決定怎麼解讀事情。
↓
決定預測接下來會發生什麼。
↓
最後才形成你聽見的「念頭」。
所以念頭比較像螢幕上的畫面。
生成模型才像後面的作業系統。
只修改螢幕文字，不一定修改作業系統。
━━━━━━━━━━━━━━━━━━
【三｜「靈魂生成念頭」可以如何精準化】
若使用Soul OS語言，可以把「靈魂」拆成七個深層Node。
Self Model｜我是誰。
World Model｜世界是什麼。
Value Model｜什麼重要。
Meaning Model｜事情對我代表什麼。
Identity｜我要維持什麼樣的自己。
Weight｜哪些訊號值得最高注意。
Telos｜我的生命正在朝哪裡去。
因此可以寫成：
Soul OS
＝Self Model＋World Model＋Value Model＋Meaning＋Identity＋Weight＋Telos。
Soul OS
↓
決定Attention。
↓
決定Evidence Selection。
↓
決定Representation。
↓
決定Prediction。
↓
生成Thought。
所以「念頭」不是靈魂本身。
念頭比較像靈魂深層結構在此刻情境中的投影。
━━━━━━━━━━━━━━━━━━
【四｜認知科學真正重要的是Generative Model】
認知系統不是等Reality進來之後才被動反應。
它會利用過去經驗、當前線索與既有模型，不斷形成對世界的預期。
所以：
Reality≠你最後經驗到的世界。
Reality→Observation→Prior Model→Representation→Prediction→Experience。
同一句：
「我們改天再約。」
A模型可能生成：
「他討厭我。」
B模型可能生成：
「時間還沒確定。」
C模型可能生成：
「資訊不足，先不下結論。」
外界語句相同。
生成出的內在世界完全不同。
差異不只發生在「想法內容」。
更深的差異在生成想法的模型。
━━━━━━━━━━━━━━━━━━
【五｜真正需要改的不是Thought，而是Prior】
認知模型中，過去經驗會形成Prior｜先驗預期。
如果一個人長期形成：
「別人終究會拒絕我。」
新事件一進來，就容易被舊Prior解釋。
對方晚回訊息。
↓
Prior＝我要被拋棄。
↓
Attention自動搜尋危險線索。
↓
模糊Evidence被解讀成拒絕。
↓
Representation＝他開始討厭我。
↓
Prediction＝關係快結束。
↓
Thought＝我果然不值得被愛。
此時強迫自己說：
「我是值得被愛的。」
未必足以更新Prior。
因為舊系統仍然存在。
真正的更新需要：
Prediction→Reality Test→Prediction Error→Evidence Reweighting→Prior Update。
━━━━━━━━━━━━━━━━━━
【六｜所以「轉念」不是完全沒用，而是層級常常太淺】
把轉念直接稱為「幻覺」會過度絕對。
更精準的說法是：
「只有語句替換、沒有模型更新的轉念，很容易成為表層覆蓋。」
真正有效的重新表徵則不同。
它不是：
負面句→正面句。
而是：
舊表徵→提出替代假設→尋找Reality Evidence→比較Prediction→實際測試→更新權重。
例如：
舊念頭＝「學生不理我，就是不尊重我。」
假性轉念＝「沒關係，他一定還是很愛老師。」
模型更新＝「我目前只知道他沒有回應；原因可能包含不理解、注意力轉移、抗拒、疲累或關係問題，我需要新的Evidence才能提高其中任何一個解釋的權重。」
這不是正向思考。
這是提高Representation Resolution。
━━━━━━━━━━━━━━━━━━
【七｜分化才是比轉念更重要的能力】
低分化：
「他討厭我。」
高分化：
「我現在感受到被拒絕。」
「被拒絕感不等於他真的拒絕我。」
「目前Evidence只有他沒有回覆。」
「至少存在五種可能解釋。」
「我要等新的Difference出現。」
分化不是把負面變正面。
分化是把一個巨大、黏死的表徵拆開。
Thought。
Emotion。
Reality。
Prediction。
Memory。
Identity。
全部重新分離。
一旦分離，系統才重新取得自由度。
━━━━━━━━━━━━━━━━━━
【八｜真正的覺醒不是轉念，而是看見念頭如何被生成】
第一階：
我相信念頭。
「我一定會失敗。」
第二階：
我試圖修改念頭。
「我要相信自己會成功。」
第三階：
我觀察念頭。
「我的系統正在生成『會失敗』這個Prediction。」
第四階：
我找到生成結構。
「因為過去三次失敗被賦予過高Weight。」
第五階：
我重新測試。
「現在的條件真的和過去一樣嗎？」
第六階：
我更新權重。
新的Evidence開始取得更高Weight。
第七階：
念頭自然改變。
不是因為我逼自己正向。
而是生成念頭的模型已經不同。
━━━━━━━━━━━━━━━━━━
【九｜表觀遺傳學給這套模型最大的啟發是Regulation】
表觀遺傳學最重要的哲學啟發之一，不是「思想神奇地修改DNA」。
而是：
相同Genome並不意味著永遠只有一種Expression State。
DNA Methylation｜DNA甲基化。
Histone Modification｜組蛋白修飾。
Chromatin Accessibility｜染色質可及性。
這些都提醒我們：
生命系統存在Regulation Layer｜調控層。
因此更好的生命隱喻不是：
「我天生就是這樣。」
而是：
「目前系統處於這個Regulatory State。」
這與認知科學的模型形成漂亮的結構同構：
Genome≠Gene Expression。
Reality≠Representation。
Memory≠Destiny。
Thought≠Self。
Current State≠Final State。
共同核心都是：
底層條件會限制可能性，但「目前輸出」不能直接等同於「永恆本質」。
━━━━━━━━━━━━━━━━━━
【十｜但不要把表觀遺傳學神化】
不能直接寫成：
「靈魂改變DNA甲基化。」
目前沒有足夠證據支持這種簡單因果鏈。
也不能寫成：
「轉念可以開啟好基因、關閉壞基因。」
這會把複雜的Gene Regulation過度簡化。
比較精準的是：
長期Experience＋Behavior＋Environment＋Physiological State可能共同改變生理訊號環境，而部分生理訊號與基因調控存在交互作用。
因此：
Thought不是魔法按鈕。
生活模式也不是單一基因開關。
生命是一個多層耦合的調控網路。
━━━━━━━━━━━━━━━━━━
【十一｜Soul OS真正應該更新的不是Thought Bank，而是Generator】
舊方法：
Thought→換Thought。
Soul OS方法：
Thought→追溯Generator。
可以固定追問：
這個念頭背後是哪個Self Model？
這個念頭背後是哪個World Model？
哪段Memory取得過高Weight？
哪個Threat Signal正在控制Attention？
哪個Identity正在被保護？
我忽略了哪些Evidence？
我現在把Prediction誤認成Reality了嗎？
哪個Prediction Error足以推翻舊模型？
━━━━━━━━━━━━━━━━━━
【十二｜實際案例：我沒有人愛】
Thought：
「沒有人愛我。」
不要急著改成：
「全世界都愛我。」
先往下挖。
Representation：
「某人的冷淡＝沒有人愛我。」
↓
Weight：
某一人的反應被給予極高權重。
↓
Identity：
「必須被重要的人肯定，我才有價值。」
↓
Self Model：
「我的價值來自外界確認。」
↓
World Model：
「關係是價值審判場。」
↓
Prediction：
「被拒絕＝證明我沒有價值。」
這時真正的更新不是念：
「我值得被愛。」
而是重新測試：
「一個人的選擇真的能測量我的全部價值嗎？」
「這個模型可以預測所有Reality嗎？」
「有哪些Evidence與它矛盾？」
「我是不是把Relationship Outcome錯當成Self Worth Measurement？」
這才進入Generator層。
━━━━━━━━━━━━━━━━━━

舊轉念｜我不要想壞的。
靈魂更新｜我要知道為什麼系統一直生成這個Prediction。
舊轉念｜我要正向。
靈魂更新｜我要提高Reality解析度。
舊轉念｜把負面句換成正面句。
靈魂更新｜重新估計Evidence Weight。
舊轉念｜我要相信自己。
靈魂更新｜我要知道Self Model如何形成。
舊轉念｜不要害怕。
靈魂更新｜我要辨識Threat Model。
舊轉念｜事情會變好。
靈魂更新｜什麼條件改變，Prediction才應該改變？
舊轉念｜控制Thought。
靈魂更新｜理解Thought Generator。
舊轉念｜壓低Prediction Error。
靈魂更新｜利用Prediction Error更新模型。
━━━━━━━━━━━━━━━━━━
【十四｜最重要的更新鏈】
Soul OS。
↓
Self Model。
↓
World Model。
↓
Value Model。
↓
Meaning。
↓

【十五｜一句話重新定義「靈魂覺醒」】
靈魂覺醒不是「我終於學會想好事」。
靈魂覺醒是「我終於看見，是什麼深層結構一直替我生成念頭。」
更高一階是：
「我不再把念頭當Reality。」
再高一階是：
「我不再把目前的Self Model當永恆的我。」
最高操作原則是：
Thought不是敵人。
Thought是Signal。
負面念頭不是首先要被消滅的東西。
它可能是通往Generator的入口。
所以不要急著問：
「這個念頭怎麼轉？」
先問：
「什麼樣的靈魂結構／Self Model／World Model／Weight配置，才會穩定生成這個念頭？」
找到Generator。
找到Weight。
找到Prediction。
找到Reality中的Difference。
讓Prediction Error進來。
重新分配Weight。
更新Generator。
當Generator真正更新後，新的念頭不必靠強迫「轉」出來。
它會成為新模型更自然的輸出。
【最終公式】
不是：
負面念頭→轉念→正面念頭。
而是：
Soul OS→Weight→Representation→Prediction→Thought→Action→Reality Feedback→Prediction Error→Reweighting→Model Update→新的Thought。
所以真正值得訓練的能力不是「轉念能力」。
而是「看見念頭生成器＋允許Reality修正生成器」的能力。
自由不是永遠產生漂亮的念頭。

【八｜最高階判讀指標】
低階覺醒＝我找到了一個更好的答案。
中階覺醒＝我發現原來還有其他答案。
高階覺醒＝我知道任何答案都需要接受Reality測試。
更高階覺醒＝我能看見自己的Representation、Weight、Prediction與Action正在如何生成。
最高階覺醒＝即使最珍惜的模型被Reality推翻，我仍然保有更新自己的能力。
所以：
覺醒≠固定得到某種世界觀。
覺醒＝獲得「世界觀可以持續更新」的能力。
成長≠累積更多答案。
成長＝Prediction Accuracy持續提高。
智慧≠永遠正確。
智慧＝更快發現自己錯在哪一層。
Agency≠控制Reality。
Agency＝持續生成可測試的新Action。
自由≠沒有舊模型。
自由＝舊模型出現時，我仍然可以看見、分離、拆解、重配、重選、重測、重構。
【最終公式】
Reality→Awareness→Decentering→Differentiation→Model Flexibility→Reweighting→Agency→Action→Feedback→Prediction Error→Updating→Retest→更高解析度的Reality Contact。
【一句總結】
Soul Awakening不是「我終於知道宇宙真正的答案」，而是「我終於擁有一套不斷讓Reality修正自己、又能持續生成新選擇的生命更新系統」。【九｜七大能力評量指標｜把「覺醒」從抽象感覺變成可觀察能力】
核心原則：
不要評量「你覺得自己有沒有覺醒」。
要評量「遇到Reality與Prediction不一致時，你實際能完成哪些操作」。
因此評量鏈統一為：
Input→Representation→Differentiation→Alternative Model→Evidence Weight→Action→Feedback→Update。

【十一｜統一五級成熟度量表｜L0～L4】
L0｜融合Fusion。
完全不知道自己正在使用模型。
第一個念頭＝Reality。
L1｜看見Detection。
事後能發現「原來這是我的解讀」。
L2｜分離Separation。
當下能把Reality與Representation分開。
L3｜重構Reconstruction。
能主動生成替代模型、重新配權與選擇Action。
L4｜更新Updating。
Reality反駁自己後，能修改Model並Retest。
所以成熟度不是：
知道多少身心靈知識。
而是：
模型被挑戰時，更新迴路可以跑到哪一層。
━━━━━━━━━━━━━━━━━━
【十二｜①Awareness覺察｜評量指標】
A1｜Fact–Interpretation Separation｜事實／解讀分離率。
10個陳述中能正確辨認幾個是Observation、幾個是Interpretation。
A2｜Representation Detection｜表徵辨識率。
能否說出「我正在把這件事解讀成什麼」。
A3｜Awareness Latency｜覺察延遲。
事件發生後多久才發現自己正在腦補。
A4｜Emotion–Interpretation Link｜情緒－解讀連結辨識。
能否找到「哪個Interpretation生成目前Emotion」。
A5｜Automaticity Detection｜自動模式辨識。
能否發現「這是我常出現的舊模式」。
【0～4分】
0＝完全把解讀當事實。
1＝別人提醒後才看見。
2＝事後自己看見。
3＝當下能看見。
4＝當下看見且能立即暫停自動反應。
━━━━━━━━━━━━━━━━━━
【十三｜②Decentering去中心化｜評量指標】
D1｜Thought–Self Separation｜念頭／自我分離。
D2｜Thought–Reality Separation｜念頭／Reality分離。
D3｜Identity Flexibility｜身分流動性。
D4｜Hypothesis Language｜假說語言使用率。
D5｜Cognitive Distance｜認知距離。
測驗句：
「我失敗了，所以我就是失敗者。」
要求改寫。
L0＝「對，我就是不行。」
L1＝「也許我不是完全不行。」
L2＝「這次結果不好。」
L3＝「我的模型正在把一次結果泛化成Identity。」
L4＝「先保留這個Prediction，再用下一次行動測試。」
高分核心：
Thought≠Self。
Thought≠Reality。
Thought＝Candidate Representation。
━━━━━━━━━━━━━━━━━━
【十四｜③Differentiation分化｜評量指標】
DF1｜Node Count｜節點數。
一個模糊問題能拆出多少有意義Node。
DF2｜Node Precision｜節點精準度。
拆出的Node是否真正不同。
DF3｜Boundary Accuracy｜邊界精準度。
能否辨認哪些變數不應混在一起。
DF4｜Relation Mapping｜關係辨識。
能否說明Node之間如何互相影響。
DF5｜Bottleneck Detection｜瓶頸辨識。
能否找出High-weight Node。
測驗：
「我學測英文就是不好。」
0分＝英文不好。
1分＝單字不好。
2分＝單字＋文法＋閱讀。
3分＝拆出Vocabulary Retrieval／Syntax Parsing／Inference／Reading Speed／Working Memory等。
4分＝拆Node後還能找出High-weight Bottleneck與驗證方式。
核心公式：
Problem Resolution↑→Intervention Precision↑。
━━━━━━━━━━━━━━━━━━
【十五｜④Model Flexibility模型彈性｜評量指標】
MF1｜Alternative Count｜替代模型數量。
MF2｜Alternative Diversity｜替代模型差異度。
MF3｜Uncertainty Tolerance｜不確定容忍度。
MF4｜Premature Closure｜過早定論率。
MF5｜Model Switching｜模型切換能力。
測驗：
「朋友已讀不回。」
要求60秒產生可能原因。
0分＝他討厭我。
1分＝勉強接受另一種解釋。
2分＝能生成2種。
3分＝能生成3～5種真正不同的模型。
4分＝生成多模型後，還能提出Discriminating Evidence來區分它們。
真正高分不是：
「凡事正向解讀。」
而是：
「正向、負向、中性模型都可以暫時存在，等待Evidence。」
━━━━━━━━━━━━━━━━━━
【十六｜⑤Reweighting重新配權｜評量指標】
RW1｜Evidence Quality｜證據品質辨識。
RW2｜Sample-size Sensitivity｜樣本數敏感度。
RW3｜Counter-evidence Integration｜反證整合能力。
RW4｜Confidence Calibration｜信心水準校準。
RW5｜Weight Revision｜新證據出現後的權重修改能力。
測驗：
原Prediction：
「這個學生不想學。」
Evidence 1＝今天趴桌。
Evidence 2＝昨天只睡3小時。
Evidence 3＝過去四週作業完成率95%。
問：
現在三項Evidence應該如何配Weight？
0分＝仍死守第一判斷。
1分＝知道可能錯但不改。
2分＝願意加入新Evidence。
3分＝重新調整Confidence。
4分＝修改Prediction並說明哪項Evidence造成Weight Change。
核心：
真正的智慧不是沒有Bias。
而是Weight可以被新Evidence重新配置。
━━━━━━━━━━━━━━━━━━
【十七｜⑥Agency能動性｜評量指標】
AG1｜Action Generation｜行動生成數。
AG2｜Controllable Variable Detection｜可控制變數辨識。
AG3｜Minimum Action｜最小行動生成能力。
AG4｜Reversibility｜優先選擇可逆實驗。
AG5｜Information Gain｜行動能否產生新資訊。
AG6｜Recovery Speed｜失敗後重新行動速度。
測驗：
「你的方案被拒絕。」
60秒內列出下一步。
0分＝沒辦法了。
1分＝只有原方案重試。
2分＝產生2個Action。
3分＝產生5個Action。
4分＝能從5個Action中選出「低成本＋高資訊增益＋可逆＋可立即執行」的Minimum Action。
Agency真正評量的不是：
「你多有自信？」
而是：
「Reality封掉A路徑後，你多久能生成B、C、D路徑？」
━━━━━━━━━━━━━━━━━━
【十八｜⑦Updating更新｜評量指標】
UP1｜Error Detection｜是否發現Prediction Error。
UP2｜Error Attribution｜能否定位錯誤類型。
UP3｜Model Revision｜是否真的修改Model。
UP4｜Behavior Revision｜修改是否進入Action。
UP5｜Retest｜是否重新測試。
UP6｜Repeat Error Rate｜同類錯誤重複率。
測驗：
先要求受測者做Prediction。
再提供與Prediction衝突的新Evidence。
最後問：
「你現在修改什麼？」
0分＝否認Evidence。
1分＝接受Evidence但維持原模型。
2分＝承認原Prediction可能錯。
3分＝指出Node／Relation／Weight／Boundary哪裡需要修改。
4分＝形成New Model＋New Prediction＋New Action＋Retest。
所以真正Updating不是：
「我知道我錯了。」
而是：
Old Model→Error→Revision→New Prediction→Retest。
━━━━━━━━━━━━━━━━━━
【十九｜七能力總分｜Soul Awakening Capability Index】
每項能力0～4分。
7項×4分＝28分。
SACI＝Awareness＋Decentering＋Differentiation＋Model Flexibility＋Reweighting＋Agency＋Updating。
0～7｜Model Fusion。
容易被第一表徵直接帶走。
8～14｜Model Awareness。
開始看見自己的模型，但更新能力仍不穩定。
15～20｜Model Flexibility。
能產生替代模型與新Action。
21～24｜Model Updating。
Prediction Error已能轉成模型更新。
25～28｜Recursive Learning。
形成「預測→回饋→修正→重測」的穩定循環。
但28分不是「覺醒完成」。
因為真正成熟的系統不存在永久畢業。
高階能力的特徵恰恰是：
永遠保留Model Update入口。
━━━━━━━━━━━━━━━━━━
【二十｜比總分更重要的是七能力雷達】
不要只看總分。
兩個人都可能得到18分，但系統完全不同。
A型：
Awareness高。
Decentering高。
Differentiation高。
Agency低。
＝很會看懂自己，但不容易轉成行動。
B型：
Agency高。
Updating低。
＝非常會行動，但容易重複同一套錯誤。
C型：
Differentiation低。
Reweighting低。
＝知道很多理論，但問題仍然只能分成「好／壞」。
D型：
Model Flexibility高。
Agency低。
＝可以想到很多可能性，卻停留在分析。
E型：
Agency高＋Updating高。
＝做→看結果→改→再做。
這通常才會形成真正High Agency Learning Loop。
所以評量目的不是貼標籤。
而是尋找：
【目前整個更新系統的Bottleneck在哪裡？】
━━━━━━━━━━━━━━━━━━
【二十一｜最重要的跨能力KPI】
KPI 1｜Fact／Interpretation Separation Rate。
我多常能分清事實與解讀？
KPI 2｜Alternative Model Count。
遇到重大事件平均能生成幾個合理模型？
KPI 3｜Prediction Confidence Calibration。
我的確定程度是否符合Evidence品質？
KPI 4｜Prediction Error Detection Rate。
猜錯後，我能不能看見自己猜錯？
KPI 5｜Update Rate。
看到反證後，有多少比例真的修改Model？
KPI 6｜Action Generation Rate。
卡住後能生成多少新Action？
KPI 7｜Retest Rate。
更新模型後，有沒有回到Reality重新測試？
KPI 8｜Repeat Error Rate。
同一種錯誤是否一直重複？
KPI 9｜Recovery Time。
模型失敗後多久重新開始行動？
KPI 10｜Representation Flexibility。
舊表徵出現後，多久能生成第二表徵？

【二十三｜最終判準】
最低階問題：
「我是不是覺醒的人？」
更好的問題：
「我的七項更新能力目前各是多少？」
再高一階：
「哪一項能力正在限制整個系統？」
最高階：
「我能不能讓Reality持續改寫我的模型，而不因為Identity受到威脅就關閉更新？」
所以Soul Awakening最終不應該被做成一個神祕身分標籤。
它可以被重新操作化為：
Awareness｜看見模型。
Decentering｜離開模型。
Differentiation｜拆解模型。
Model Flexibility｜生成模型。
Reweighting｜校準模型。
Agency｜測試模型。
Updating｜修改模型。
【最終評量公式】
Soul Awakening Capacity
＝Model Visibility
×Model Distance
×Representation Resolution
×Model Diversity
×Evidence Calibration
×Action Space
×Update Capacity。
任何一項接近0，都可能成為整個系統的限制因子。
因此真正值得追蹤的不是「我今天感覺有沒有比較高頻」。
而是：

【七能力最好背｜7字訣】
**看→離→拆→生→配→選→改**
看＝Awareness｜看見自己的模型。
離＝Decentering｜把自己與念頭分開。
拆＝Differentiation｜把模糊問題拆成Node。
生＝Model Flexibility｜生成第二、第三個模型。
配＝Reweighting｜重新配置Evidence Weight。
選＝Agency｜重新生成與選擇Action。
改＝Updating｜Reality不同意時修改Model。
【統一能力生成鏈】
Reality→**看**見表徵→**離**開第一念頭→**拆**成Node→**生**成多模型→**配**置證據權重→**選**擇Action→Feedback→Prediction Error→**改**模型→Retest。
【統一0～4評分】
0｜Fusion｜完全被第一模型帶走。
1｜Detection｜別人提醒後才看見。
2｜Separation｜事後可以自己分辨。
3｜Reconstruction｜當下能重新表徵、配權與選擇。
4｜Updating｜能用Reality修正模型並Retest。
【總分】
7能力×4分＝**28分**。
0–7｜Model Fusion｜模型融合。
8–14｜Model Awareness｜開始看見模型。
15–20｜Model Flexibility｜能生成替代模型與行動。
21–24｜Model Updating｜能利用Prediction Error更新。
25–28｜Recursive Learning｜形成穩定「預測→回饋→更新→重測」循環。
【真正要看的不是總分，而是最低分】
最低分能力＝目前系統Bottleneck｜瓶頸。
因此不是七項一起亂練。
而是：
Baseline評量→找最低分Node→針對訓練→真實情境測試→Feedback→兩週後重測→Model Update。
【最高階總公式】
**Soul Awakening Capacity＝Model Visibility × Model Distance × Representation Resolution × Model Diversity × Evidence Calibration × Action Space × Update Capacity。**
任何一項接近0，都可能限制整個更新系統。

【140策略統一操作｜不要140個一起練】
Awareness 20＝學會【看】。
Decentering 20＝學會【離】。
Differentiation 20＝學會【拆】。
Model Flexibility 20＝學會【生】。
Reweighting 20＝學會【配】。
Agency 20＝學會【選】。
Updating 20＝學會【改】。
20×7＝140 Strategies。
真正執行不是140項Checklist。
而是：
七能力Baseline評量→找最低分能力→從該表選3個策略→連續訓練14天→收集Reality Feedback→重新評量→保留有效策略→淘汰低效策略→進入下一個Bottleneck。
【140策略最終壓縮公式】
看｜Reality與我的Interpretation有什麼不同？
→離｜這個Thought只是Hypothesis嗎？
→拆｜這件事到底有哪些Node？
→生｜至少還有哪三個Model？
→配｜哪些Evidence真正值得高Weight？
→選｜哪個Action成本低、可逆、資訊增益高？
→改｜Reality不同意我的地方，要修改Node、Relation、Weight、Boundary還是Action？
→Retest。
【最終目標】
不是背會140個策略。
而是把140個策略逐漸壓縮成七個自動化能力。
最後甚至不需要記住策略名稱。
遇到Reality時，系統自然會完成：
**看得見→離得開→拆得細→生得多→配得準→選得動→改得快。**【總定位】
這17階不是17個知識點，而是17個可以被訓練的「生命操作能力」。
能力＝我實際能做到什麼。
智慧＝我知道何時、為何、在什麼邊界使用這個能力。
策略＝把能力從「知道」變成「穩定可調用」的方法。
總生成鏈：
Self Model→World Model→Value Model→Meaning→Identity→Weight→Attention→Evidence Selection→Representation→Prediction→Thought→Emotion→Agency→Action→Feedback→Prediction Error→Reweighting→Model Update。

【01｜Self Model｜自我模型】
核心能力＝Self-model Flexibility｜自我模型流動能力。
核心智慧＝「現在的我」不是「永遠的我」。
要得到的能力：
01｜Self-awareness｜自我覺察。
02｜Self–State Separation｜自我與狀態分離。
03｜Trait–State Discrimination｜特質與狀態辨識。
04｜Role–Self Separation｜角色與自我分離。
05｜Ability Differentiation｜能力分化。
06｜Pattern Recognition｜自我模式辨識。
07｜Context Awareness｜情境辨識。
08｜Self-model Reconstruction｜自我模型重構。
09｜Identity Flexibility｜身分流動。
10｜Self-complexity｜多元自我表徵。
核心智慧：
01｜我不是我的一次失敗。
02｜我不是我的情緒。
03｜我不是我的Thought。
04｜我不是我的職業。
05｜我不是別人對我的評價。
06｜過去形成Prior，但不等於未來。
07｜穩定Pattern不等於永恆Essence。
08｜能力不足比「我不好」更可操作。
09｜Self Model只是Reality的壓縮模型。
10｜自由首先來自Self Model可以更新。
所有核心策略：
01｜把「我是……」改寫成「我目前在……情境下容易……」。
02｜每天抓3句Self-label。
03｜把人格標籤拆成Behavior＋Context＋Frequency。
04｜建立「我是誰」Evidence List。
05｜建立反例Evidence List。
06｜區分Self／Role／State／Ability／Behavior。
07｜每次失敗先做Node Diagnosis。
08｜建立Past Self／Current Self／Possible Self三欄。
09｜每週找一個「我原本以為自己不會，但其實做得到」的反例。
10｜用新Action主動生成新的Self Evidence。
11｜每月重寫一次Self Model。
12｜遇到「我就是」時自動問：「永遠如此嗎？所有Context都如此嗎？」
最終生成＝Self不再是牢籠，而成為可更新模型。

【14｜Action｜行動】
核心能力＝Experimental Action｜實驗式行動能力。
核心智慧＝行動不只是取得Outcome，也是取得Evidence。
要得到的能力：
01｜Execution。
02｜Minimum Action。
03｜Experimentation。
04｜Iteration。
05｜Behavior Design。
06｜Environment Design。
07｜High-leverage Action。
08｜Measurement-linked Action。
09｜Adaptive Execution。
10｜Retesting。
核心智慧：
01｜行動不需要等100%確定。
02｜小Experiment勝過巨大幻想。
03｜努力多不等於槓桿高。
04｜Action必須對應Bottleneck。
05｜Action最好能產生Feedback。
06｜失敗Action仍可能產生高Information Gain。
07｜一次成功不能證明Mechanism。
08｜Action需要Review。
09｜Action可以重塑Identity。
10｜行動是Learning Loop的一部分。
所有核心策略：
01｜把Goal切成Minimum Action。
02｜設定24小時內可做步驟。
03｜一次優先改一個High-weight Node。
04｜行動前寫Prediction。
05｜行動前寫Measurement。
06｜行動後收Feedback。
07｜失敗做Error Attribution。
08｜成功找Mechanism。
09｜跨Context Retest。
10｜建立Action Log。
11｜刪除Low-leverage Action。
12｜每週做Action→Outcome→Learning Review。
最終生成＝Doing→Experimenting→Learning。
━━━━━━━━━━━━━━━━━━
【15｜Feedback｜回饋】
核心能力＝Feedback Literacy｜回饋解讀能力。
核心智慧＝Feedback不是Reality對我的人格評分，而是系統回傳Difference。
要得到的能力：
01｜Feedback Detection。
02｜Signal Extraction。
03｜Source Evaluation。
04｜Trend Detection。
05｜Measurement Interpretation。
06｜Delayed-feedback Recognition。
07｜Unexpected-feedback Detection。
08｜Feedback Integration。
09｜Feedback History Tracking。
10｜Feedback-loop Design。
核心智慧：
01｜稱讚不等於全部正確。
02｜批評不等於全部錯。
03｜Outcome是Data。
04｜一次Outcome可能只是Noise。
05｜Trend比Single Point更重要。
06｜Feedback需要Context。
07｜沒有Feedback不等於Negative Feedback。
08｜Unexpected Outcome常具有高Information Gain。
09｜Feedback不是命令。
10｜Feedback的目的在Update。
所有核心策略：
01｜先記Observation再Interpretation。
02｜建立Prediction／Outcome對照。
03｜多次Measurement看Trend。
04｜分Immediate／Delayed Feedback。
05｜分Quantitative／Qualitative。
06｜檢查Source Quality。
07｜找Unexpected Result。
08｜找Missing Feedback。
09｜建立Feedback History。
10｜每次Feedback問：「哪個Node應更新？」
11｜避免一次Feedback改整個Self。
12｜建立固定Action→Measure→Review節奏。
最終生成＝Experience真正轉化成Learning。
━━━━━━━━━━━━━━━━━━
【16｜Prediction Error｜預測誤差】
核心能力＝Error Attribution｜誤差歸因能力。
核心智慧＝Error不是羞恥，而是Reality指出模型解析度不足的位置。
要得到的能力：
01｜Error Detection。
02｜Error Classification。
03｜Error Attribution。
04｜Error Localization。
05｜Error Magnitude Estimation。
06｜Structured-error Detection。
07｜Noise Discrimination。
08｜Root-error Analysis。
09｜Update-threshold Design。
10｜Error Learning。
核心智慧：
01｜猜錯不等於笨。
02｜結果錯不一定是Model錯。
03｜Model錯不代表全部錯。
04｜Observation可能錯。
05｜Representation可能錯。
06｜Weight可能錯。
07｜Timing可能錯。
08｜Action可能錯。
09｜Goal可能錯。
10｜Measurement本身也可能錯。
所有核心策略：
01｜E1 Observation Error｜資料看錯。
02｜E2 Representation Error｜事情解釋錯。
03｜E3 Node Error｜漏重要變數。
04｜E4 Relation Error｜關係連錯。
05｜E5 Weight Error｜重要度估錯。
06｜E6 Boundary Error｜模型用錯情境。
07｜E7 Timing Error｜時間尺度錯。
08｜E8 Action Error｜執行錯。
09｜E9 Goal Error｜最佳化錯目標。
10｜E10 Measurement Error｜量錯東西。
11｜每次重大Prediction Error至少跑一次E1–E10。
12｜修正後Retest，確認Error是否真正下降。
最終生成＝Error從「失敗證據」變成「Reality提供的導航資料」。
━━━━━━━━━━━━━━━━━━
【17｜Reweighting｜重新賦權】
核心能力＝Dynamic Reweighting｜動態重新賦權能力。
核心智慧＝真正的Model Update不是多知道一件事，而是新Evidence真的改變了系統內部的重要性排序。
要得到的能力：
01｜Evidence Reweighting。
02｜Prior Updating。
03｜Threat Recalibration。
04｜Reward Recalibration。
05｜Memory Reweighting。
06｜Identity Reweighting。
07｜Social-weight Recalibration。
08｜Temporal Reweighting。
09｜Value Reweighting。
10｜Dynamic Model Updating。
核心智慧：
01｜知道新Evidence不代表真正相信新Evidence。
02｜真正更新必須改變Weight。
03｜舊記憶不必刪除，只需要重新校準預測權重。
04｜一次創傷不能合理代表所有Context。
05｜一次成功也不能代表所有Context。
06｜反證通常具有高更新價值。
07｜Prior可以存在，但不能拒絕Likelihood。
08｜Weight必須依Context變化。
09｜新的Model也不能再次僵固。
10｜最高智慧＝永遠替Reality保留重新賦權的權利。
所有核心策略：
01｜Prediction前記錄原Weight。
02｜Feedback後重新評分。
03｜問：「哪個Evidence應升權？」
04｜問：「哪個Evidence應降權？」
05｜把Emotion Strength與Evidence Strength分開。
06｜把Old Memory與Current Evidence分開。
07｜把Authority與Evidence分開。
08｜把Popularity與Truth分開。
09｜把Short-term Reward與Long-term Value分開。
10｜對Disconfirming Evidence提高注意。
11｜修改Weight後產生新的Prediction。
12｜Retest。
13｜若新Prediction仍錯，再次Reweight。
14｜避免從「舊絕對」跳到「新絕對」。
15｜建立Weight History，看自己長期如何改變。
最終生成＝過去仍然存在，但不再擁有永久最高權重。
━━━━━━━━━━━━━━━━━━

【17階最終能力生成鏈】
Self Model訓練→得到「不被舊自己綁架」的能力。
World Model訓練→得到「不把自己的世界觀當世界」的能力。
Value Model訓練→得到「知道什麼真正值得最佳化」的能力。
Meaning訓練→得到「不被事件第一層意義綁架」的能力。
Identity訓練→得到「身分穩定但不僵固」的能力。
Weight訓練→得到「重新決定什麼重要」的能力。
Attention訓練→得到「重新決定看什麼」的能力。
Evidence訓練→得到「讓Reality進入模型」的能力。
Representation訓練→得到「生成第二種世界」的能力。
Prediction訓練→得到「把感覺轉成可測模型」的能力。
Thought訓練→得到「念頭存在但不必服從」的能力。
Emotion訓練→得到「情緒存在但仍保有選擇」的能力。
Agency訓練→得到「Constraint中生成選項」的能力。
Action訓練→得到「用行動向Reality取資料」的能力。
Feedback訓練→得到「把經驗轉成Learning」的能力。
Prediction Error訓練→得到「從猜錯的位置升級模型」的能力。
Reweighting訓練→得到「讓新的Reality真正改變舊自己」的能力。
【最高階統一智慧】
低階系統問：「我要怎麼讓自己想得更正面？」
高階系統問：「這個Thought是什麼Generator產生的？」
再高階系統問：「Generator用了哪些Representation與Weight？」
更高階系統問：「什麼Evidence可以區分目前競爭中的Models？」
最高階系統問：「Reality已經給我Prediction Error之後，我有沒有真的Reweight？」
因此真正的成長不是Knowledge↑。
而是Representation Resolution↑＋Prediction Accuracy↑＋Error Detection↑＋Update Speed↑＋Action Space↑。
真正的智慧不是「我知道答案」。
而是「我知道我的答案只是一個目前版本的Model，而且我知道什麼Evidence出現時，我應該修改它。」
真正的High Agency不是控制Reality。
而是Reality沒有照Prediction發生時，仍然能Observation→Differentiation→Reweighting→Model Update→New Action。
真正的靈魂自由不是沒有舊記憶、舊情緒、舊念頭。
而是舊記憶可以存在、舊情緒可以存在、舊念頭可以存在，但它們不再自動擁有最高Weight與最後Action權。
最終公式：
Awareness→Differentiation→Representation Flexibility→Evidence Discrimination→Prediction→Reality Test→Feedback→Prediction Error→Error Attribution→Reweighting→Model Update→Action Space Expansion→High Agency。
最終一句：
智慧，是知道自己的Model可能錯。
能力，是知道錯在哪裡。
Agency，是知道下一步還能做什麼。
覺醒，是不再把任何一個暫時版本的自己，誤認成不可更新的命運。可以。下面我把上一版能力樹裡最重要的專業名詞，全部翻成「國小生也能懂、生活中馬上能用」的語言；英文保留，方便之後仍能對回專業母體。

【先記住最重要的一句】
整套Soul OS其實就是：
事情發生了
→我看到了什麼
→我怎麼想這件事
→我覺得什麼重要
→我猜接下來會怎樣
→我產生什麼感覺
→我決定怎麼做
→看看結果
→發現自己哪裡猜錯
→重新調整
→下一次做得更好。
━━━━━━━━━━━━━━━━━━
【01｜Self Model｜自我模型】
專業意思＝大腦裡「我是怎樣的人」的內在模型。
國小白話＝我怎麼看自己。
生活例子＝「我數學很爛」「我很害羞」「我很會照顧別人」都是Self Model的一部分。
Self-awareness｜自我覺察
＝我知道自己現在怎麼了。
例：我發現自己現在很緊張。
Self-observation｜自我觀察
＝像站旁邊看自己。
例：我發現每次被老師點名，我都會低頭。
Self-description｜自我描述
＝不用「好、壞、笨」亂貼標籤，而是把自己說清楚。
例：不要說「我很笨」，改成「我這次有三題公式不熟」。
Self–State Separation｜自我與狀態分離
＝「現在這樣」不等於「我永遠這樣」。
例：我今天考不好≠我是爛學生。
Self–Thought Separation｜自我與念頭分離
＝我想到什麼，不代表我就是什麼。
例：我想到「我不行」≠我真的不行。
Self–Emotion Separation｜自我與情緒分離
＝我有情緒，但我不是那個情緒。
例：我現在很生氣≠我是一個壞人。
Trait–State Discrimination｜特質與狀態辨識
＝分清楚「一直如此」還是「今天剛好如此」。
例：今天不想講話≠我是內向的人。
Role–Self Separation｜角色與自我分離
＝我的角色只是我的一部分。
例：我是老師，但我不只有「老師」這個身分。
Ability Differentiation｜能力分化
＝不要說整個人不行，要找出哪個能力還不會。
例：不是「英文很差」，而是「單字提取速度比較慢」。
Behavior Differentiation｜行為分化
＝做錯一件事≠整個人不好。
例：忘記交作業≠你是懶惰的人。
Context Awareness｜情境覺察
＝知道自己在哪些情況特別容易出問題。
例：我不是都不專心，而是手機放旁邊時特別容易分心。
Pattern Recognition｜模式辨識
＝找出自己一直重複發生的事情。
例：每次考試前一天都熬夜。
Possible-self Generation｜可能自我生成
＝想像「我還可以變成什麼樣的人」。
例：現在不敢上台，但我可以慢慢變成敢說話的人。
Self-model Updating｜自我模型更新
＝新證據出現後，修改「我是誰」的故事。
例：以前覺得自己不會英文，但最近三次閱讀都進步，就要修改舊看法。
一句話：
「我現在這樣，不代表我永遠只能這樣。」
━━━━━━━━━━━━━━━━━━
【02｜World Model｜世界模型】
專業意思＝我心裡認為「這個世界是怎麼運作的」。
國小白話＝我覺得世界有什麼規則。
Systems Thinking｜系統思考
＝不要只看一件事，要看很多東西怎麼互相影響。
例：成績下降可能跟睡眠、手機、單字量、壓力、讀書方法都有關。
Structural Thinking｜結構思考
＝不要只問「發生什麼」，還要問「它是怎麼組成的」。
例：英文不好，可以拆成單字、文法、閱讀速度、理解、時間管理。
Relational Thinking｜關係思考
＝找出A跟B怎麼互相影響。
例：睡太少→注意力下降→上課聽不懂→回家更不想讀。
Complex Causality｜複雜因果
＝一件事情通常不是只有一個原因。
例：朋友不回訊息，不一定就是討厭你。
Context Thinking｜情境思考
＝同一件事情放在不同情況，答案可能不同。
例：安靜在圖書館是好事，但上台報告一直安靜就有問題。
Boundary Recognition｜邊界辨識
＝知道一個方法不是到處都有效。
例：跑步很好，但不是「跑愈多永遠愈好」。
Probabilistic Thinking｜機率思考
＝不要一直說「一定」，改成「有多大可能」。
例：不是「我一定考不好」，而是「如果沒複習，考差的機會比較高」。
Uncertainty Tolerance｜容納不確定
＝還不知道答案時，不急著亂猜。
例：對方沒回訊息，可以先說「現在資料還不夠」。
Scenario Thinking｜情境推演
＝先想可能發生的不同版本。
例：最好情況、普通情況、最壞情況各是什麼？
Reality Testing｜現實測試
＝不要只靠想，用真的結果看看。
例：覺得自己不會英文？做一份題目看看。
World-model Updating｜世界模型更新
＝發現世界跟自己想的不一樣，就修改自己的想法。
一句話：
「不是世界一定照我想的走，而是我的想法要跟著世界修正。」
━━━━━━━━━━━━━━━━━━
【03｜Value Model｜價值模型】
專業意思＝什麼事情在我心裡比較重要。
國小白話＝我的人生排行榜。
Value Awareness｜價值覺察
＝知道自己真正重視什麼。
Value Clarification｜價值澄清
＝把「我想要很多東西」整理清楚。
Value Ranking｜價值排序
＝不能全部第一名，要排順序。
Priority Setting｜優先排序
＝先做最重要的。
Goal-function Design｜目標函數設計
＝先決定「這次我最想得到什麼」。
例：選社團時，是最重視交朋友、比賽、自由時間，還是功課？
Trade-off Thinking｜取捨思考
＝選A通常就會少一點B。
Opportunity Cost｜機會成本
＝選這個，就失去了另一個可能。
例：玩兩小時手機，就少了兩小時讀書或睡覺。
Long-term Thinking｜長期思考
＝不要只看今天爽不爽，也看以後會怎樣。
Value–Action Alignment｜價值與行動一致
＝嘴巴說重要的事情，時間也真的花在上面。
Value Reweighting｜價值重新排序
＝人生變化後，重要的東西也可以重新排。
一句話：
「不是什麼都要，而是知道現在什麼最值得。」
━━━━━━━━━━━━━━━━━━
【04｜Meaning｜意義】
專業意思＝我替事情加上的解釋。
國小白話＝事情發生後，我心裡替它配了什麼故事。
Event–Meaning Separation｜事件與意義分離
＝事情本身跟我的解釋是兩件事。
例：
事情＝朋友今天沒跟我打招呼。
解釋＝「他討厭我。」
第二句不是事情，是我加上的故事。
Observation–Interpretation Separation｜觀察與解釋分離
＝分清楚「看到什麼」和「我怎麼猜」。
Meaning Differentiation｜意義分化
＝同一件事可以有很多解釋。
Alternative Meaning Generation｜替代意義生成
＝再想第二、第三個可能。
Perspective Taking｜換位思考
＝站到別人的位置看事情。
Narrative Flexibility｜故事流動
＝不要一輩子只能用同一個故事解釋自己。
Failure Reconstruction｜重新理解失敗
＝失敗不是「我沒用」，而可能是「方法還要改」。
Meaning–Evidence Testing｜用證據測試意義
＝問：「我這個故事真的有證據嗎？」
Meaning Updating｜意義更新
＝有新資料，就修改原來的故事。
一句話：
「事情只有一個，但你對事情的故事可能有很多個。」
━━━━━━━━━━━━━━━━━━
【05｜Identity｜身分】
專業意思＝我認為「我是誰」。
國小白話＝我貼在自己身上的名字牌。
Identity Awareness｜身分覺察
＝知道自己身上貼了哪些名字牌。
例：老師、媽媽、學生、好孩子、成功者。
Role Separation｜角色分離
＝一個角色不是全部的我。
Role Transition｜角色轉換
＝知道不同地方要換不同角色。
Role Exit｜角色退出
＝有些舊角色可以放下。
Identity–Behavior Separation
＝做了一件不好的事≠我是壞人。
Identity–Outcome Separation
＝一次輸了≠我是失敗者。
Identity–Evaluation Separation
＝別人不喜歡我≠我沒有價值。
Possible-self Generation
＝我可以慢慢長成新的自己。
Identity Plasticity｜身分可塑性
＝「我是誰」可以隨著學習與經驗改變。
Identity Integration｜身分整合
＝我可以同時有很多面，而且仍然是我。
一句話：
「我的名字牌可以很多張，而且可以換。」
━━━━━━━━━━━━━━━━━━
【06｜Weight｜權重】
專業意思＝系統認為一件事「有多重要」。
國小白話＝幫每件事情調音量。
Weight Awareness｜權重覺察
＝知道現在是哪個聲音最大聲。
Signal Ranking｜訊號排序
＝哪些事情值得先理？
Evidence Weighting｜證據權重
＝不同證據不能全部算一樣重。
Threat Calibration｜威脅校準
＝不要把小危險放大成大災難。
Reward Calibration｜獎賞校準
＝不要因為眼前很爽，就忘了長期代價。
Memory Reweighting｜記憶重新賦權
＝以前發生過，不代表這次一定一樣。
Social-weight Calibration
＝別人的一句話，不一定要變成人生最大的聲音。
Temporal Weighting｜時間權重
＝今天的快樂和未來的結果都要一起算。
Dynamic Reweighting｜動態重新賦權
＝新資料出現後，重新調整每個聲音的音量。
一句話：
「不是誰最大聲就聽誰，而是誰證據最好就給誰比較大的音量。」
━━━━━━━━━━━━━━━━━━
【07｜Attention｜注意】
專業意思＝有限的腦力現在放在哪裡。
國小白話＝我的手電筒現在照哪裡。
Attention Awareness
＝知道手電筒正在照什麼。
Selective Attention
＝選擇現在要看哪裡。
Sustained Attention
＝手電筒可以穩穩照一段時間。
Attention Shifting
＝需要時可以換地方照。
Attention Disengagement
＝可以把手電筒從不重要的東西移開。
Meta-attention
＝我知道自己正在注意什麼。
Noise Filtering
＝不要每個聲音都理。
Difference Detection
＝發現「這次跟以前不一樣」。
Pattern Attention
＝不只看一次，而是看有沒有重複規律。
Counter-evidence Attention
＝也願意看跟自己想法不同的證據。
一句話：
「注意力像手電筒；你照哪裡，就比較容易看見哪裡。」
━━━━━━━━━━━━━━━━━━
【08｜Evidence Selection｜證據選擇】
專業意思＝決定哪些資料值得相信。
國小白話＝當小偵探找線索。
Source Evaluation
＝這個消息是誰說的？
Evidence Quality
＝這個線索可靠嗎？
Evidence Strength
＝這個線索到底有多強？
Supporting Evidence
＝有哪些線索支持我的猜法？
Counter-evidence
＝有哪些線索跟我的猜法相反？
Disconfirming Evidence
＝什麼證據一出現，我就必須承認自己可能猜錯？
Sampling Awareness
＝我看到的幾個人，能不能代表全部人？
Bias Detection
＝我是不是只挑自己喜歡的資料？
Missing-data Awareness
＝還缺哪些重要資料？
Evidence Triangulation
＝從不同地方一起確認。
Evidence Integration
＝把所有可靠線索放在一起看。
一句話：
「好偵探不是只找證明自己對的線索，也會找證明自己錯的線索。」
━━━━━━━━━━━━━━━━━━
【09｜Representation｜表徵】
專業意思＝大腦把事情「畫成什麼樣子」。
國小白話＝我戴著哪一副眼鏡看事情。
Representation Awareness
＝知道自己現在戴的是哪副眼鏡。
Reality–Representation Separation
＝眼鏡看到的畫面，不等於世界全部。
Representation Differentiation
＝把模糊畫面看得更細。
Multiple Representation
＝同一件事可以換不同眼鏡看。
Alternative Representation
＝想第二種解釋。
Representation Switching
＝發現舊眼鏡不好用，可以換。
Mechanism Representation
＝不只看結果，還看「為什麼會變成這樣」。
Structural Representation
＝看事情有哪些零件。
System Representation
＝看很多零件怎麼互相影響。
Temporal Representation
＝把時間也放進來看。
Probabilistic Representation
＝不要只有「會／不會」，而是「可能性多大」。
Representation Testing
＝哪副眼鏡比較符合Reality？
Representation Updating
＝證據不同，就換眼鏡。
一句話：
「第一副眼鏡看到的世界，不一定就是世界本身。」
━━━━━━━━━━━━━━━━━━
【10｜Prediction｜預測】
專業意思＝根據現在模型，猜接下來會發生什麼。
國小白話＝先猜答案，再看看猜得準不準。
Prediction Awareness
＝發現自己其實一直在猜未來。
Probability Estimation
＝猜「有幾成可能」。
Conditional Prediction
＝如果A發生，那B比較可能發生。
Scenario Prediction
＝想不同可能劇本。
Time-horizon Prediction
＝猜多久之後會發生。
Base Rate
＝先看看以前通常發生多少次。
Confidence Estimation
＝我到底有多確定？
Falsifiable Prediction
＝先說清楚「出現什麼結果就算我猜錯」。
Prediction Tracking
＝把以前的猜測留下來。
Prediction–Outcome Comparison
＝比較「我原本猜的」和「最後真的發生的」。
Calibration
＝慢慢讓自己愈猜愈準。
一句話：
「不要只說『我覺得』，要說『我猜有幾成，而且可以驗證』。」
━━━━━━━━━━━━━━━━━━
【11｜Thought｜念頭】
專業意思＝此刻浮到意識中的想法。
國小白話＝腦中突然跳出來的一句話。
Thought Awareness
＝發現腦中出現一句話。
Thought Labeling
＝替它取名字。
例：「這是一個擔心的念頭。」
Thought–Self Separation
＝這句話不是整個我。
Thought–Reality Separation
＝想到的事情不一定是真的。
Thought–Emotion Separation
＝想法和感覺不是同一件事。
Thought–Action Separation
＝想到也不代表一定要做。
Thought Reliability Assessment
＝這個念頭有多可信？
Rumination Detection
＝發現自己一直重播同一件事。
Thought Defusion
＝讓自己不要黏死在一個念頭上。
Generator Tracing
＝問：「這句話是從哪個舊模型跑出來的？」
Metacognition｜後設認知
＝我不只會想，我還知道「自己正在怎麼想」。
一句話：
「念頭像手機跳出的通知；看到通知，不代表一定要點進去。」
━━━━━━━━━━━━━━━━━━
【12｜Emotion｜情緒】
專業意思＝系統對目前情境、價值與預測產生的整體反應。
國小白話＝身體和心裡亮起來的提醒燈。
Emotion Awareness
＝知道提醒燈亮了。
Emotion Labeling
＝說出這是哪種感覺。
Emotion Differentiation
＝不要全部只叫「不爽」。
可以拆成：害怕、失望、委屈、生氣、羞愧、嫉妒、孤單。
Emotion Intensity
＝現在是2分還是9分？
Primary Emotion
＝最先出現的感覺。
Secondary Emotion
＝後來又疊上去的感覺。
Emotion–Reality Separation
＝我很害怕≠外面一定很危險。
Emotion–Action Separation
＝我很生氣≠我一定要罵人。
Threat Signal
＝情緒可能在提醒我「好像有危險」。
Value Signal
＝情緒可能在提醒我「這件事對我很重要」。
Need Detection
＝我現在真正需要的是什麼？
Boundary Signal
＝是不是有人碰到我的界線？
Emotion Regulation
＝不是把情緒消滅，而是把它調到我還能思考。
Emotion Tolerance
＝不舒服存在時，我仍然待得住。
一句話：
「情緒是警示燈，不是方向盤。」
━━━━━━━━━━━━━━━━━━
【13｜Agency｜自主選擇】
專業意思＝即使有很多限制，我仍然可以決定下一步。
國小白話＝事情不一定由我決定，但下一步我還可以選。
Choice Awareness
＝發現「原來我還有選擇」。
Option Generation
＝至少想三個辦法。
Action-space Expansion
＝不要只剩「做／不做」兩條路。
Controllability Detection
＝哪些事情我真的能控制？
Influenceability Detection
＝哪些不能控制，但可以影響？
Constraint Recognition
＝有哪些限制真的存在？
Minimum Action
＝現在最小可以做什麼？
Experiment Design
＝先試一小步看看。
Reversibility Judgment
＝做錯了能不能改回來？
Uncertainty Action
＝不知道全部答案，也能先做安全的小一步。
Pivot Ability
＝發現方向錯了，可以轉彎。
Fallback Plan
＝A不行，還有B。
High Agency
＝世界沒有照我的預測走，我仍然可以更新模型、再選下一步。
一句話：
「我不一定能控制世界，但我可以增加自己的下一步。」
━━━━━━━━━━━━━━━━━━
【14｜Action｜行動】
專業意思＝把模型變成Reality中的實際測試。
國小白話＝不要只想，真的做一小步看看。
Action Initiation
＝開始做。
Execution
＝真的把事情完成。
Minimum Action
＝先做最小的一步。
Action Decomposition
＝大任務切成小任務。
Action Prioritization
＝先做最重要的。
High-leverage Action
＝找「做一點，效果很大」的地方。
Experimentation
＝把行動當小實驗。
Behavior Design
＝讓好行為更容易發生。
Environment Design
＝改環境幫助自己。
Friction Reduction
＝讓正確的事變簡單。
Trigger Design
＝設定提醒自己開始的開關。
Measurement-linked Action
＝做完要知道有沒有效。
Iteration
＝做→看結果→修改→再做。
Retesting
＝修改之後重新測一次。
一句話：
「不要一次改人生，先做一個能得到答案的小實驗。」
━━━━━━━━━━━━━━━━━━
【15｜Feedback｜回饋】
專業意思＝行動後，Reality回給我的資料。
國小白話＝我做完之後，世界給我的成績單。
Feedback Detection
＝有沒有看到結果？
Feedback Collection
＝把結果記下來。
Signal Extraction
＝結果裡真正重要的是什麼？
Noise Filtering
＝哪些只是偶然？
Trend Detection
＝很多次放在一起，有沒有方向？
Variation Detection
＝哪一次特別不一樣？
Immediate Feedback
＝馬上看到結果。
Delayed Feedback
＝過一段時間才看得到結果。
Unexpected Feedback
＝出現我沒想到的結果。
Quantitative Feedback
＝可以用數字看的結果。
Qualitative Feedback
＝用感受、描述、觀察得到的結果。
Feedback Integration
＝把很多回饋放在一起判斷。
一句話：
「世界的成績單不是在罵我，而是在告訴我方法有沒有用。」
━━━━━━━━━━━━━━━━━━
【16｜Prediction Error｜預測誤差】
專業意思＝原本猜的跟真正發生的不一樣。
國小白話＝「咦！怎麼跟我想的不一樣？」
Prediction Error＝Reality－Prediction。
白話＝真的發生的－原本猜的＝我需要學習的地方。
Error Awareness
＝發現自己猜錯了。
Error Magnitude
＝差一點還是差很多？
Error Classification
＝是哪一種錯？
Error Localization
＝錯在哪個位置？
Error Attribution
＝為什麼會錯？
Root-error Analysis
＝找到最底下真正的錯。
E1 Observation Error
＝看錯了。
E2 Representation Error
＝解釋錯了。
E3 Node Error
＝漏掉重要東西。
E4 Relation Error
＝把兩件事情連錯了。
E5 Weight Error
＝把不重要的東西看太重。
E6 Boundary Error
＝方法用錯地方。
E7 Timing Error
＝時間抓錯。
E8 Action Error
＝想法可能沒錯，但做法做錯。
E9 Goal Error
＝一開始追錯目標。
E10 Measurement Error
＝拿錯尺來量。
一句話：
「猜錯不是笨；猜錯是在告訴我，地圖哪裡需要修改。」
━━━━━━━━━━━━━━━━━━
【17｜Reweighting｜重新賦權】
專業意思＝新資料進來後，重新決定每件事情有多重要。
國小白話＝重新調整每個聲音的音量。
Evidence Reweighting
＝新證據比較可靠，就把它聲音調大。
Prior Updating
＝以前的猜法要跟著新資料改。
Threat Recalibration
＝原本以為超危險，後來發現沒有那麼危險，就把警報調低。
Reward Recalibration
＝原本覺得超值得，發現代價太大，就把誘惑調低。
Memory Reweighting
＝過去發生過，不代表它永遠最大聲。
Identity Reweighting
＝「我以前是這樣的人」不必控制未來。
Social-weight Recalibration
＝別人的眼光不需要永遠100分。
Authority-weight Calibration
＝老師、專家、父母也可能錯，仍然要看Evidence。
Temporal Reweighting
＝重新平衡「現在」和「未來」。
Counter-evidence Reweighting
＝看到反證時，不要假裝沒看到。
Model Updating
＝真的修改原本的想法。
Continuous Updating
＝以後有新資料，繼續改。
一句話：
「成熟不是沒有舊聲音，而是知道哪個聲音現在應該大聲、哪個應該小聲。」
━━━━━━━━━━━━━━━━━━

【再壓縮成7個國小生也能記住的超能力】
① 看見｜Awareness
＝我知道自己現在發生什麼。
② 拆開｜Differentiation
＝不要全部混成一團，我可以把問題拆小。
③ 換眼鏡｜Representation Flexibility
＝第一種想法不一定是唯一答案。
④ 找證據｜Evidence Discrimination
＝不要只相信感覺，要當偵探。
⑤ 調音量｜Reweighting
＝重新決定什麼最值得相信。
⑥ 選下一步｜Agency
＝就算不能控制全部，我還是能選下一步。
⑦ 改地圖｜Updating
＝世界跟我想的不一樣，我就修改自己的地圖。

【最高階白話智慧】
厲害的人，不是永遠不會猜錯。
而是：
猜錯了，不急著怪自己。
事情不順，不急著怪別人。
先看看自己是不是看漏了。
是不是想錯了。
是不是把某件事看得太大。
是不是漏掉新的線索。
是不是方法用錯地方。
然後把自己的「人生地圖」修改一下。
再走下一步。
所以真正的High Agency，用國小語言只需要一句話：
「世界不一定照我想的走，但我永遠可以學會看懂結果，再想出更好的下一步。」可以。我直接沿用上一版 **17大能力 × 每階20個子能力＝340個能力**，每一個能力都補上 **3句生活化金句**；金句會保持「短、好記、可拿來做卡片／APP／貼文」。

【01｜Self Model｜自我模型能力群】
01｜Self-awareness｜自我覺察
① 看見自己，是改變自己的第一步。
② 你看不見的模式，最容易偷偷控制你。
③ 覺察不是責怪自己，而是終於看清自己。
02｜Self-observation｜自我觀察
① 不急著評價自己，先學會觀察自己。
② 能站到旁邊看自己，就不必困在自己裡面。
③ 看清自己怎麼反應，才有機會重新選擇。
03｜Self-description｜精準自我描述
① 說得愈精準，改變愈有方向。
② 少一句「我很爛」，多一句「我哪裡還不會」。
③ 模糊的標籤製造無力，精準的描述產生行動。
04｜Self–State Separation｜自我／狀態分離
① 我現在不好，不等於我不好。
② 今天的狀態，不是明天的命運。
③ 把「我是」改成「我現在」，人生就多了一條出口。
05｜Self–Thought Separation｜自我／念頭分離
① 我有這個念頭，但我不是這個念頭。
② 腦中出現一句話，不代表它有資格定義我。
③ 念頭可以經過我，不必成為我。
06｜Self–Emotion Separation｜自我／情緒分離
① 我正在生氣，不等於我是壞人。
② 情緒是我正在經歷的天氣，不是我的名字。
③ 暴雨會來，也會走；天空不等於暴雨。
07｜Trait–State Discrimination｜特質／狀態辨識
① 一次如此，不代表永遠如此。
② 不要把今天的狀態，寫成一生的人格。
③ 先問「什麼情境會這樣」，再問「我是怎樣的人」。
08｜Role–Self Separation｜角色／自我分離
① 我扮演很多角色，但沒有一個角色等於全部的我。
② 工作可以失去，完整的我不必跟著消失。
③ 角色是衣服，不是皮膚。
09｜Ability Differentiation｜能力分化
① 不要說「我不行」，要問「哪一項能力還不行」。
② 能力拆得愈細，進步的入口愈多。
③ 找到真正不會的地方，比責怪整個自己有用。
10｜Behavior Differentiation｜行為分化
① 做錯一件事，不等於你是一個錯的人。
② 修正行為，不需要摧毀自己。
③ 把「你很懶」改成「這件事沒有完成」，問題才有解。
11｜Context Awareness｜情境覺察
① 不是所有地方的你，都一模一樣。
② 找到讓問題出現的情境，就找到一半的解法。
③ 有時不是你不行，而是環境一直讓你失敗。
12｜Pattern Recognition｜模式辨識
① 一次叫事件，重複發生才叫模式。
② 不要只處理今天的問題，要找到昨天也出現過的規律。
③ 看懂重複，就開始看見命運背後的結構。
13｜Self-complexity｜多元自我
① 你不是只有一個版本。
② 一個地方失敗，不代表整個人生失敗。
③ 自我愈有層次，一次打擊愈難摧毀全部的你。
14｜Possible-self Generation｜可能自我生成
① 現在的你，只是眾多可能版本中的一個。
② 不要只問「我是誰」，也要問「我還能成為誰」。
③ 未來的自己，要先在今天成為一種可能。
15｜Self-evidence Evaluation｜自我證據評估
① 不要用一個失敗證明整個自己。
② 對自己的判決，也需要證據。
③ 如果你願意查證別人的話，也要學會查證自己對自己的話。
16｜Self-model Testing｜自我模型測試
① 「我做不到」不是答案，是一個等待測試的Prediction。
② 不要用想像證明自己，讓行動提供證據。
③ 關於自己的信念，也要接受Reality考試。
17｜Self-model Reconstruction｜自我模型重構
① 新證據出現，就有權重寫自己。
② 成長不是找到真正固定的自己，而是不斷修正對自己的理解。
③ 舊故事解釋不了新的你，就換故事。
18｜Self-model Updating｜自我模型更新
① 昨天的資料，不該永遠決定今天的你。
② 新的Reality出現，舊的自我模型就應該更新。
③ 成長，就是讓今天的證據有資格修改昨天的自己。
19｜Self-continuity｜自我連續
① 改變自己，不等於背叛自己。
② 成長不是把舊自己殺掉，而是把他帶到更大的世界。
③ 我可以一直改變，也仍然知道自己是誰。
20｜Self-model Flexibility｜自我模型流動
① 最危險的不是不知道自己，而是太早認定自己。
② 「我就是這樣」常常是成長最厚的一道牆。
③ 自由從「我也可能不是這樣」開始。
━━━━━━━━━━━━━━━━━━
【02｜World Model｜世界模型能力群】
01｜Reality Observation｜現實觀察
① 先看發生什麼，再決定它代表什麼。
② Reality不需要配合你的故事。
③ 看清事實，是智慧開始的地方。
02｜Reality–Model Separation｜現實／模型分離
① 地圖不是土地，想法不是世界。
② 你相信的世界，只是你目前畫出的地圖。
③ 不要要求Reality符合模型，要讓模型學會符合Reality。
03｜Systems Thinking｜系統思考
① 很多問題沒有壞人，只有互相影響的系統。
② 不要只問「誰造成的」，還要問「什麼循環讓它一直發生」。
③ 看見循環，就比只看見事件多了一層自由。
04｜Structural Thinking｜結構思考
① 現象告訴你出了事，結構告訴你為什麼一直出事。
② 不要只擦地上的水，要找水從哪裡漏。
③ 能拆出結構，就能找到槓桿。
05｜Relational Thinking｜關係思考
① 一個Node很少單獨決定結果。
② 智慧不是只看東西，而是看東西之間怎麼連。
③ 改變一條關係，有時比增加十個東西更有效。
06｜Complex Causality｜複雜因果
① 一個結果，常常有很多爸爸媽媽。
② 不要用一個原因解釋整個世界。
③ 愈複雜的問題，愈要小心簡單答案。
07｜Multi-factor Analysis｜多變數分析
① 找不到答案時，可能不是沒有原因，而是原因不只一個。
② 不要只找最大的聲音，也要找被忽略的小變數。
③ 多看幾個Node，才不會把世界看扁。
08｜Context Thinking｜情境思考
① 同一個方法，換個地方可能完全不同。
② 沒有脫離情境的智慧。
③ 問「對不對」以前，先問「在什麼情況下對」。
09｜Boundary Recognition｜邊界辨識
① 每個好方法都有不能用的地方。
② 知道方法有效很重要，知道何時失效更重要。
③ 沒有邊界的真理，很容易變成新的錯誤。
10｜Probabilistic Thinking｜機率思考
① 世界很少只有「一定」和「絕對不會」。
② 把「一定」改成「幾成可能」，思考就開始成熟。
③ 不確定不是缺點，而是Reality本來就有的樣子。
11｜Uncertainty Tolerance｜容納不確定
① 不知道答案，也可以先不亂填答案。
② 成熟不是什麼都知道，而是不知道時仍能穩穩站著。
③ 不確定存在，不代表你必須立刻做出結論。
12｜Scenario Thinking｜情境推演
① 不要只準備一個未來。
② 同時想最好、普通、最壞，你就不容易被任何一個結果綁架。
③ 有備案的人，不需要假裝自己能預知未來。
13｜Risk Modeling｜風險建模
① 危險不是只問「會不會」，還要問「機率多大、代價多大」。
② 小機率的大損失，也值得被看見。
③ 好決策不是沒有風險，而是知道自己承擔什麼風險。
14｜Pattern Recognition｜模式辨識
① 不要被一天騙，要看一段時間。
② 一個點是故事，一串點才可能是趨勢。
③ 智慧常藏在重複出現的Difference裡。
15｜Feedback-loop Recognition｜回饋循環辨識
① 有些結果會回頭變成下一次的原因。
② 你今天的Action，可能正在製造明天的Environment。
③ 看懂Loop，才能停止一直治標。
16｜Controllability Analysis｜可控性分析
① 不是所有事情都能控制，但通常還有一部分可以選。
② 把力氣放在能改的地方，Agency才會長大。
③ 接受不可控，不等於放棄可控。
17｜Environmental Modeling｜環境建模
① 行為不只來自意志，也來自環境。
② 如果每次都靠忍耐，也許該先改環境。
③ 好環境，會讓正確行動變得比較便宜。
18｜Reality Testing｜現實測試
① 想一百遍，不如讓Reality回答一次。
② 信念要有接受考試的勇氣。
③ 不能被Reality推翻的想法，也很難被Reality教導。
19｜World-model Updating｜世界模型更新
① 世界變了，地圖也要跟著改。
② 舊經驗有價值，但沒有永久否決新Reality的權力。
③ 更新世界觀不是反覆無常，而是尊重證據。
20｜Adaptive World Modeling｜適應式世界建模
① 最好的地圖不是永遠不改，而是永遠能改。
② Reality一直動，智慧也必須會動。
③ 活得好，不是找到永久答案，而是保持校準能力。
━━━━━━━━━━━━━━━━━━
【03｜Value Model｜價值模型能力群】
01｜Value Awareness｜價值覺察
① 你把時間給誰，就正在告訴世界什麼對你重要。
② 不知道自己重視什麼，就容易替別人的目標努力。
③ 價值不是嘴巴說什麼，而是你願意為什麼付代價。
02｜Value Identification｜價值辨識
① 想要的很多，真正重要的通常沒有那麼多。
② 欲望問「我要什麼」，價值問「什麼值得我要」。
③ 找到真正重要的，很多選擇自然會變簡單。
03｜Value Clarification｜價值澄清
① 模糊的價值，會製造混亂的選擇。
② 說清楚自己在乎什麼，才能知道該拒絕什麼。
③ 人生卡住，有時不是沒有選項，而是不知道什麼最重要。
04｜Value Differentiation｜價值分化
① 「我想要」裡面，可能藏著十種不同需求。
② 把重要拆細，才能知道真正衝突的是什麼。
③ 分清楚安全、自由、成就、關係，選擇才會清楚。
05｜Value Ranking｜價值排序
① 如果每件事都是第一名，就等於沒有第一名。
② 人生不是什麼都要，而是知道什麼先要。
③ 排序，就是願意承認資源有限。
06｜Priority Setting｜優先排序
① 忙，不代表正在做重要的事。
② 最重要的事情，要先得到最好的時間。
③ 優先順序，是價值真正落地的地方。
07｜Goal Identification｜目標辨識
① 不知道終點，就很難判斷哪條路比較好。
② 問題有時不是做不到，而是一開始就不知道自己要什麼。
③ 清楚的Goal會替很多雜訊自動降權。
08｜Goal-function Design｜目標函數設計
① 在努力以前，先確認自己正在把什麼變大。
② 最危險的不是效率低，而是高效率地追錯目標。
③ Goal錯了，愈努力可能離真正想要的愈遠。
09｜Goal–Value Alignment｜目標／價值對齊
① 目標若違背價值，成功也可能很空。
② 不只問「能不能做到」，也問「值得不值得做到」。
③ 好目標不是看起來厲害，而是符合你真正重視的生活。
10｜Value–Action Alignment｜價值／行動對齊
① 真正的價值會出現在行事曆裡。
② 如果你說重要卻從不行動，它目前的Weight可能沒有你想的高。
③ 讓時間配置，開始說出你真正相信的事。
11｜Trade-off Thinking｜取捨思考
① 每個Yes背後，都藏著一些No。
② 成熟不是得到全部，而是知道願意放掉什麼。
③ 不願取捨的人，最後常常被Reality替他取捨。
12｜Opportunity-cost Awareness｜機會成本
① 你花掉的不只是錢，也是一個沒有選擇的另一條路。
② 每一小時只能活一次。
③ 問「得到什麼」時，也要問「因此失去什麼」。
13｜Long-term Thinking｜長期思考
① 今天舒服，不一定讓明天更自由。
② 不要只替今天的自己投票。
③ 好決策，是現在的我也願意照顧未來的我。
14｜Temporal-value Integration｜跨時間價值整合
① 現在與未來，不必只能犧牲一個。
② 最好的選擇，是讓不同時間版本的自己一起坐上決策桌。
③ 不要讓今天的衝動，永遠替明天買單。
15｜Multi-objective Optimization｜多目標最佳化
① 人生不是只有一個分數。
② 健康、關係、成長、自由，有時需要一起算。
③ 真正的最佳解，常常不是某一項100分，而是整體能長久運作。
16｜Value-conflict Detection｜價值衝突辨識
① 很多內耗，其實是兩個重要價值正在打架。
② 找到衝突的Value，就不必一直責怪自己矛盾。
③ 不是你沒有答案，而是兩個「都重要」需要重新排序。
17｜Value-boundary Setting｜價值邊界
① 重視關係，不代表什麼都答應。
② 每個Yes都需要Boundary保護。
③ 沒有邊界的善良，最後可能耗盡善良。
18｜External–Internal Value Separation｜外在／內在價值分離
① 別人的掌聲可以參考，但不要當人生方向盤。
② 被喜歡和活得值得，是兩個不同問題。
③ 成熟，是慢慢分清楚「大家要我」和「我真正重視」。
19｜Value Reweighting｜價值重新賦權
① 人生階段變了，重要性也可以改。
② 過去第一名的東西，不必永遠第一名。
③ 重新排序，不代表以前錯，而代表現在有了新Reality。
20｜Value Updating｜價值更新
① 價值需要穩定，也需要接受生命經驗校正。
② 真正的堅定，不是永不改變，而是知道為何改變。
③ 新的人生，可能需要新的重要排行榜。
━━━━━━━━━━━━━━━━━━
【04｜Meaning｜意義能力群】
01｜Meaning Awareness｜意義覺察
① 事情發生是一層，我替事情下的解釋是另一層。
② 很多痛苦不是只有事件，也包含我們給事件的Meaning。
③ 看見自己正在解釋，才有重新解釋的可能。
02｜Event–Meaning Separation｜事件／意義分離
① 「他沒回訊息」是事件；「他討厭我」是解釋。
② 不要把故事偷偷寫進事實。
③ 先把發生什麼說乾淨，很多誤會就少一半。
03｜Observation–Interpretation Separation｜觀察／解釋分離
① 眼睛看到的是資料，心裡補上的才是故事。
② 把「我看到」和「我認為」分開，Reality會清楚很多。
③ 解釋可以改，Observation先留下。
04｜Meaning Differentiation｜意義分化
① 一件事情，不必只有一種意義。
② 意義拆得愈細，命運感就愈小。
③ 「失敗」拆開後，可能只是方法、時間或條件還沒對。
05｜Alternative Meaning Generation｜替代意義生成
① 第一個故事不是唯一的故事。
② 多一個解釋，就多一個可能的下一步。
③ 在下結論以前，先替Reality保留第二種可能。
06｜Contextual Interpretation｜情境化解釋
① 同一句話，放在不同Context可能完全不同。
② 不看情境的Meaning，很容易誤判。
③ 先問「當時發生什麼」，再問「它代表什麼」。
07｜Perspective Taking｜觀點轉換
① 換一個位置，可能看見另一個世界。
② 理解別人的視角，不等於必須同意他。
③ 能同時容納兩個視角，思考就多了一個維度。
08｜Narrative Awareness｜敘事覺察
① 每個人都在替自己的人生寫故事。
② 故事說久了，我們很容易忘記它只是故事。
③ 看見自己的Narrative，就開始拿回作者權。
09｜Narrative Flexibility｜敘事流動
① 舊故事可以保留，但不必永遠當唯一版本。
② 同一段過去，可以在新的生命階段產生新的Meaning。
③ 故事會流動，人生才不會被過去封死。
10｜Narrative Reconstruction｜敘事重構
① 不能改寫過去，但可以重新理解過去。
② 重寫故事不是騙自己，而是加入以前漏掉的Evidence。
③ 成熟的故事，比舊故事多看見一些Reality。
11｜Failure Reconstruction｜失敗重構
① 失敗不是身分，是Feedback。
② 「我失敗了」和「我是失敗者」差了一整個人生。
③ 每次失敗都在指出下一個需要升級的Node。
12｜Loss Integration｜失落整合
① 接受失去，不等於否定曾經擁有。
② 有些傷不需要消失，而需要找到可以安放的位置。
③ 整合不是忘記，而是讓失落不再控制全部人生。
13｜Conflict Interpretation｜衝突解讀
① 衝突不一定代表關係失敗，也可能代表Difference終於被看見。
② 沒有差異的關係，不一定是真正沒有差異。
③ 衝突若被讀懂，可以成為重新設定Boundary的入口。
14｜Uncertainty Interpretation｜不確定性解讀
① 不知道，不等於壞事正在發生。
② 空白不是答案，不要急著用恐懼填滿。
③ 能讓未知保持未知，是很高級的能力。
15｜Meaning–Evidence Testing｜意義／證據測試
① 再動人的故事，也要問Evidence在哪裡。
② Meaning若不能接受Reality檢驗，很容易變成牢籠。
③ 好故事不是讓你舒服，而是能容納更多Reality。
16｜Meaning–Identity Separation｜意義／身分分離
① 一件事對你的意義，不等於它有權定義你。
② 關係失敗，不等於你是失敗的人。
③ 結果可以很重要，但不必吞掉Identity。
17｜Meaning Reframing｜重新框架
① 換框架不是把壞事說成好事，而是看見漏掉的部分。
② 真正的Reframing不是正向，而是更完整。
③ 不要換成比較好聽的故事，要換成比較接近Reality的故事。
18｜Meaning Updating｜意義更新
① 新Evidence出現，舊Meaning就可以改。
② 成熟不是守住原解釋，而是允許Reality增加新的解釋。
③ 今天懂得更多，就不必永遠用昨天的Meaning。
19｜Meaning Integration｜意義整合
① 人生不是刪掉痛苦，而是讓痛苦找到位置。
② 能把矛盾經驗放進同一個故事，就是整合。
③ 完整的人生，不需要每一頁都是快樂。
20｜Meaning Generation｜意義生成
① 意義不是永遠等著被找到，也可以在行動中慢慢生成。
② 問「為什麼發生在我身上」之外，也能問「我接下來怎麼使用它」。
③ Meaning真正有力量時，會生成新的Action。

【05｜Identity｜身分能力群】
01｜Identity Awareness｜身分覺察
① 先看見自己貼了哪些標籤，才知道哪些標籤正在控制你。
② 「我是誰」常常比「我要做什麼」更深地影響行動。
③ 身分一旦被看見，就不必永遠偷偷掌權。
02｜Identity Differentiation｜身分分化
① 我可以同時是很多種人。
② 不要讓一張名字牌代表整個自己。
③ 身分愈有層次，一次失敗愈難摧毀全部的你。
03｜Role Awareness｜角色覺察
① 你正在扮演角色，不代表角色就是你。
② 看見角色，才能知道什麼時候該穿上、什麼時候該脫下。
③ 角色是功能，不是靈魂的全部。
04｜Role Separation｜角色分離
① 好老師不等於必須永遠堅強。
② 好父母不等於必須滿足孩子所有要求。
③ 角色有責任，但不必吞掉整個Self。
05｜Role Transition｜角色轉換
① 能進入角色是能力，能離開角色也是能力。
② 下班之後，不必把辦公室一起帶回家。
③ 角色切換得好，人生才不會只有一個頻道。
06｜Role Exit｜角色退出
① 有些角色完成任務後，就可以畢業。
② 放下舊角色，不等於否定曾經的自己。
③ 退出不適合的角色，也是成長。
07｜Role Expansion｜角色擴張
① 你永遠可以增加新的自己。
② 不要讓過去的履歷決定未來全部的角色。
③ 新行動，是新Identity最好的入口。
08｜Identity Complexity｜多重身分
① 你可以堅強，也可以需要幫助。
② 人不是單一形容詞。
③ 能容納矛盾的自己，比逼自己只有一面更完整。
09｜Identity–Behavior Separation｜身分／行為分離
① 行為需要負責，但Self不必被判死刑。
② 「我做錯了」比「我是壞人」更能產生改變。
③ 改Behavior，不必摧毀Identity。
10｜Identity–Outcome Separation｜身分／結果分離
① 比賽輸了，不等於你是輸家。
② 成績是一個Outcome，不是你的名字。
③ 結果可以評估表現，不能量完一個人。
11｜Identity–Evaluation Separation｜身分／評價分離
① 別人的評價是資料，不是身分證。
② 一個人不喜歡你，不代表Reality已經投票否定你。
③ 外界的眼睛可以參考，不必成為唯一鏡子。
12｜Possible-self Generation｜可能自我生成
① 不只問「我是誰」，也要問「我還可能是誰」。
② 新的自己，通常先從一個小Action開始。
③ 你沒有義務永遠忠於別人熟悉的版本。
13｜Identity Expansion｜身分擴張
① 人生變大，Identity也要跟著變大。
② 不要因為以前不會，就拒絕成為會的人。
③ 新能力會替Self增加新的房間。
14｜Identity Reconstruction｜身分重構
① 當舊Identity裝不下新Reality，就重建它。
② 重構不是否定自己，而是讓自己更完整。
③ 你可以保留根，也可以長出新的枝。
15｜Identity Resilience｜身分韌性
① 一個地方倒下，不必讓全部的我倒下。
② 穩定的Self能承受「我這次錯了」。
③ 真正有韌性的Identity，不怕Reality修正它。
16｜Identity Consistency｜核心一致
① 流動不等於沒有原則。
② 角色可以變，核心價值可以留下。
③ 真正的一致不是每次做一樣，而是知道自己為何這樣選。
17｜Identity Plasticity｜身分可塑性
① 「以前的我」不是「永遠的我」。
② 重複的新Action，會慢慢提供新的Identity Evidence。
③ 人可以保留歷史，也可以產生新的模式。
18｜Identity Updating｜身分更新
① 新證據累積了，就別再用舊名字叫自己。
② 你已經走遠了，就不要一直拿十年前的地圖定位自己。
③ Identity也需要版本更新。
19｜Identity Integration｜身分整合
① 不需要刪掉某一面自己，才能成為完整的人。
② 成熟是讓不同版本的自己學會一起生活。
③ 整合不是變單純，而是變得能容納複雜。
20｜Identity Flexibility｜身分流動
① 最自由的Identity，是可以穩定，也可以更新。
② 不必每天重新發明自己，也不必一生困在同一版本。
③ 我知道我是誰，也知道我還能改變。
━━━━━━━━━━━━━━━━━━
【06｜Weight｜權重能力群】
01｜Weight Awareness｜權重覺察
① 真正控制你的，常常不是你知道什麼，而是你把什麼看得最重要。
② 看見Weight，才看得見選擇背後真正的力量。
③ 問自己：「現在誰的聲音最大？」
02｜Weight Identification｜隱性權重辨識
① 有些Weight嘴巴不承認，行動卻天天證明。
② 看時間、金錢與情緒，就能找到隱藏的權重。
③ 你一直怕失去什麼，往往就是它的Weight很高。
03｜Signal Ranking｜訊號排序
① 不是每個訊號都值得一樣大的注意。
② 大聲不等於重要。
③ 智慧就是知道先聽哪一個聲音。
04｜Evidence Weighting｜證據賦權
① 十個弱證據，不一定勝過一個強證據。
② Evidence不是只算數量，也要算品質。
③ 真正的公平，是讓證據得到它應得的Weight。
05｜Evidence-strength Evaluation｜證據強度
① 感覺很強，不代表Evidence很強。
② 情緒的音量和證據的力量，要分開計算。
③ 先問「多確定」，再決定「多相信」。
06｜Threat Weight Detection｜威脅權重
① 恐懼會把小訊號自動放大。
② 你一直盯著什麼危險，就要檢查它是不是被升權了。
③ 警報很大聲，不代表火一定很大。
07｜Threat Calibration｜威脅校準
① 不要關掉警報，要把警報調準。
② 真正的安全不是什麼都不怕，而是怕得符合Reality。
③ 把危險看太小會受傷，看太大也會失去自由。
08｜Reward Weight Detection｜獎賞權重
① 眼前很甜的東西，常常容易被大腦升權。
② 快樂來得快，不代表價值比較高。
③ 想要，不等於值得。
09｜Reward Calibration｜獎賞校準
① 今天的獎賞，要把明天的代價一起算進來。
② 真正值得的Reward，不應只看眼前。
③ 把短期爽感調小一點，長期自由才有機會變大。
10｜Memory Weight Detection｜記憶權重
① 記得最清楚的事情，不一定最能代表Reality。
② 痛苦的Memory常常比普通日子更大聲。
③ 一段過去，不該自動取得未來的最高投票權。
11｜Memory Reweighting｜記憶重新賦權
① 過去可以提醒你，但不必統治你。
② 舊傷是真的，但今天的新Evidence也是真的。
③ 不需要刪除Memory，只需要重新調整它的預測權。
12｜Social-weight Detection｜社會評價權重
① 別人的眼光如果太大，你自己的Value就會變小。
② 問：「我是真的想要，還是怕別人怎麼看？」
③ 掌聲太大聲，也可能讓人聽不見自己。
13｜Social-weight Calibration｜社會權重校準
① 別人的意見值得參考，不值得自動100分。
② 尊重別人，不等於把方向盤交給別人。
③ 社會評價是Evidence之一，不是Reality全部。
14｜Temporal Weighting｜時間權重
① 今天和未來，都應該有投票權。
② 不要讓五分鐘的衝動，打敗五年的目標。
③ 時間拉長後，很多「現在最重要」會重新排序。
15｜Value Weighting｜價值權重
① 知道價值還不夠，還要真的給它Weight。
② 重要的事情如果永遠排最後，它其實沒有得到高權重。
③ 價值要進入時間與行動，才真正有重量。
16｜Risk Weighting｜風險權重
① 風險要看機率，也要看代價。
② 不要因為怕一件事，就把它的Probability想成100%。
③ 好的風險判斷，不誇大也不忽略。
17｜Contextual Weighting｜情境權重
① 同一個Evidence，在不同Context不一定一樣重要。
② Weight沒有永久固定值。
③ 好判斷會問：「在這個情況下，它應該多重要？」
18｜Weight Comparison｜權重比較
① 選擇困難時，先把真正競爭的Weight排出來。
② 很多糾結不是沒有答案，而是權重沒有說清楚。
③ 比較重要性，比一直增加資訊更有用。
19｜Weight Reallocation｜權重重新分配
① 新Evidence來了，就讓舊Weight重新排隊。
② 改變不是刪除過去，而是改變誰坐第一排。
③ 重新分配Weight，就是重新分配人生的注意與行動。
20｜Dynamic Reweighting｜動態重新賦權
① 今天最好的Weight，不一定是明天最好的Weight。
② 成熟的系統不是沒有權重，而是權重可以被Reality更新。
③ 真正的自由，是沒有任何舊Evidence擁有永久最高權重。
