    if(!t||/^━+$/.test(t)){i++;continue}
    if(t.startsWith('|')){const rows=[];while(i<L.length&&L[i].startsWith('|')){rows.push([i,L[i]]);i++}h+=table(c,rows);continue}
    if(isHead(t)){secs.push([i,t.slice(1,-1)]);h+=`<h3 ${id}>${fmt(t.slice(1,-1))}</h3>`}
    else if(/^【.*】$/.test(t))h+=`<div class="call" ${id}>${fmt(t.slice(1,-1))}</div>`
    else if(/^[↓↑]$/.test(t))h+=`<div class="ar" ${id}>${t}</div>`
    else if(/^\d\d｜舊：/.test(t)&&oldNew(t,id))h+=oldNew(t,id)
    else if(/^\d\d｜/.test(t)){const m=t.match(/^(\d\d)｜(.*)$/);const hd=/^[①②③]/.test(L[i+1]||'');h+=`<div class="it${hd?' hd':''}" ${id}><b class="n">${m[1]}</b><span>${fmt(m[2])}</span></div>`}
    else if(/^[①-⑳]/.test(t))h+=`<div class="q" ${id}>${fmt(t)}</div>`
    else if(/^(＝|例：)/.test(t))h+=`<div class="sub" ${id}>${fmt(t)}</div>`
    else if(/[：:]$/.test(t)&&t.length<40)h+=`<div class="lab" ${id}>${fmt(t)}</div>`
    else if(/^[A-Z][A-Za-z0-9 –\-\/]+｜[^。]{1,24}$/.test(t)&&/^(＝|①)/.test(L[i+1]||''))h+=`<div class="term" ${id}>${fmt(t)}</div>`
    else h+=`<p ${id}>${fmt(t)}</p>`;
    i++;
  }
  const chips=secs.length>3?'<div class="chips">'+secs.map(s=>`<a data-go="L${c.k}-${s[0]}">${esc(s[1])}</a>`).join('')+'</div>':'';
  return `<h2>${esc(c.title)}</h2><p class="desc">${esc(c.desc)}</p>${chips}${h}`;
}

/* ---------- 每日打卡（存在本機瀏覽器） ---------- */
const gates=R3.split('\n').filter(l=>/^\|\s*□\s*\|/.test(l)).map(l=>l.split('|').map(x=>x.trim())).map(a=>({name:a[2],plain:a[3],ask:a[4],act:a[5]}));
const errs=R3.split('\n').filter(l=>/^E\d+｜/.test(l));
const upd=['① Reality｜今天真正發生','② Old Model｜我原本以為','③ Difference｜結果不同在','④ Error｜最可能錯在（E1–E10）','⑤ Reweight｜什麼↓／什麼↑','⑥ New Model｜我現在改成認為','⑦ Minimum Action｜下一步最小行動','★ 明天要 Retest'];
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let day=today();
const load=d=>{try{return JSON.parse(localStorage.getItem('soulos-'+d))||{}}catch(e){return {}}};
const save=(d,o)=>{try{localStorage.setItem('soulos-'+d,JSON.stringify(o))}catch(e){}};
function renderDaily(){
  const s=load(day); s.c=s.c||[]; s.a=s.a||[]; s.u=s.u||[];
  const v=x=>esc(x||'').replace(/"/g,'&quot;');
  let h=`<h2>每日17關打卡</h2><p class="desc">每關一問＋一動作。紀錄只存在這台電腦的這個瀏覽器，不會上傳。</p>
  <div class="day"><input type="date" id="dd" value="${day}"><button id="dt">今天</button><button id="cp">複製這天的紀錄</button><button id="cl">清空這天</button><b id="pg"></b></div>
  <div class="bar"><i id="pb"></i></div>
  <div class="f"><label>今日事件／問題</label><input type="text" data-k="e" value="${v(s.e)}"></div>`;
  gates.forEach((g,i)=>{h+=`<div class="gate${s.c[i]?' done':''}"><input type="checkbox" data-c="${i}"${s.c[i]?' checked':''}>
   <div><div class="t">${esc(g.name)}<small>${esc(g.plain)}</small></div><div class="ask">問：${esc(g.ask)}</div><div class="do">做：${esc(g.act)}</div>
   <input type="text" data-a="${i}" placeholder="我的答案" value="${v(s.a[i])}"></div></div>`});
  h+=`<details><summary>十大 Error 快速碼（第16關用）</summary>${errs.map(e=>'<div>'+esc(e)+'</div>').join('')}</details><h3>今日 Model Update</h3>`;
  upd.forEach((u,i)=>{h+=`<div class="f"><label>${u}</label><input type="text" data-u="${i}" value="${v(s.u[i])}"></div>`});
  $('#main').innerHTML=h;
  const prog=()=>{const n=gates.filter((_,i)=>s.c[i]).length;$('#pg').textContent=`完成 ${n}／${gates.length}`;$('#pb').style.width=(n/gates.length*100)+'%'};
  prog();
  $('#main').oninput=e=>{const t=e.target,d=t.dataset;
    if(d.c!==undefined){s.c[d.c]=t.checked;t.closest('.gate').classList.toggle('done',t.checked);prog()}
    else if(d.a!==undefined)s.a[d.a]=t.value; else if(d.u!==undefined)s.u[d.u]=t.value; else if(d.k)s.e=t.value; else return;
    save(day,s)};
  $('#dd').onchange=e=>{day=e.target.value||today();renderDaily()};
  $('#dt').onclick=()=>{day=today();renderDaily()};
  $('#cl').onclick=()=>{if(confirm('確定清空 '+day+' 的打卡紀錄？')){try{localStorage.removeItem('soulos-'+day)}catch(e){}renderDaily()}};
  $('#cp').onclick=()=>{let t=`Soul OS 每日17關｜${day}\n事件：${s.e||''}\n`;
    gates.forEach((g,i)=>t+=`${s.c[i]?'☑':'☐'} ${g.name}：${s.a[i]||''}\n`);
    t+='\n【今日 Model Update】\n';upd.forEach((u,i)=>t+=`${u}：${s.u[i]||''}\n`);
    const ok=()=>{$('#cp').textContent='已複製 ✓';setTimeout(()=>$('#cp').textContent='複製這天的紀錄',1500)};
    if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,()=>prompt('請手動複製：',t));else prompt('請手動複製：',t)};
}

/* ---------- 臉書貼文＋圖卡 ---------- */
const posts=$('#posts').textContent.replace(/\r\n?/g,'\n').trim().split(/\n=====\n/).map(b=>{
  const L=b.trim().split('\n'), h=L[0].split('｜'), qs=[];
  const body=L.slice(1).map(l=>{ if(l[0]!=='★')return l; const p=l.indexOf('｜'), q=[l.slice(1,p),l.slice(p+1)]; qs.push(q); return '✦ '+q[0]+'\n　'+q[1]; }).join('\n');
  return {n:h[0],en:h[1],zh:h[2],t:h[3],te:h[4],qs,text:h[3]+'\n'+h[4]+'\n\n'+body};
});
const themes=[['#0f6e63','#0a3f3a','#ffffff','#bfe9df'],['#f6efe1','#ead9bd','#3a2c1c','#a0612a'],['#1d2a4a','#0f1830','#ffffff','#f3c969'],['#b5553c','#7c3220','#fffaf3','#ffd9b8'],['#f3f6f1','#d5e4d6','#1f3b2c','#3f8a5f'],['#2b2b2b','#111111','#f4f1ea','#d9b46a']];
let pi=0, qi=0, ti=0;
function wrap(x,text,maxW,cjk){
  const out=[]; let line='';
  const units=cjk?Array.from(text):text.split(/(\s+)/);
  units.forEach(u=>{ const t=line+u;
    if(x.measureText(t).width>maxW&&line.trim()&&!(cjk&&/[，。！？；：、」』）]/.test(u))){out.push(line.trim());line=u.trim()?u:''} else line=t; });
  if(line.trim())out.push(line.trim()); return out;
}
function drawCard(cv){
  const p=posts[pi], q=p.qs[qi]||['',''], th=themes[ti], W=1080, x=cv.getContext('2d'), F='"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif';
  const g=x.createLinearGradient(0,0,W,W); g.addColorStop(0,th[0]); g.addColorStop(1,th[1]); x.fillStyle=g; x.fillRect(0,0,W,W);
  x.textBaseline='top'; x.textAlign='left';
  x.fillStyle=th[3]; x.globalAlpha=.25; x.font='bold 360px Georgia,serif'; x.fillText('“',60,40); x.globalAlpha=1;
  x.font='bold 34px '+F; x.fillText(`SOUL OS ｜ ${p.n} ${p.en}`,90,84);
  x.textAlign='right'; x.fillText(p.zh,W-90,84); x.textAlign='left';
  x.fillRect(90,140,W-180,3);
  let fs=84, zl; do{ x.font=`bold ${fs}px ${F}`; zl=wrap(x,q[0],W-200,true); fs-=4; }while(zl.length>5&&fs>44); fs+=4;
  x.font='italic 40px Georgia,"Times New Roman",serif'; const el=wrap(x,q[1],W-200,false);
  const zh=fs*1.45, eh=56, total=zl.length*zh+50+el.length*eh; let y=Math.max(190,(W-total)/2+10);
  x.fillStyle=th[2]; x.font=`bold ${fs}px ${F}`; zl.forEach(l=>{x.fillText(l,100,y);y+=zh});
  y+=18; x.fillStyle=th[3]; x.fillRect(100,y,120,5); y+=32;
  x.font='italic 40px Georgia,"Times New Roman",serif'; x.fillStyle=th[2]; x.globalAlpha=.88; el.forEach(l=>{x.fillText(l,100,y);y+=eh}); x.globalAlpha=1;
  x.fillStyle=th[3]; x.fillRect(90,W-150,W-180,3);
  x.font='bold 32px '+F; x.fillText('靈魂作業系統 Soul OS',90,W-120);
  x.textAlign='right'; x.font='30px '+F; x.fillText('僵固 → 流動 ｜ Rigid → Fluid',W-90,W-118);
}
function renderPosts(){
  const p=posts[pi]; qi=Math.min(qi,p.qs.length-1);
  const zhN=(p.text.match(/[一-鿿]/g)||[]).length, enN=(p.text.match(/[A-Za-z][A-Za-z'’\-]*/g)||[]).length;
  $('#main').innerHTML=`<h2>臉書貼文＋圖卡</h2><p class="desc">17 大能力各一篇：痛點 → 更新 → 能力 → 智慧 → 金句，中英雙語。圖卡可換金句、換配色後下載 PNG。</p>
  <div class="chips">${posts.map((o,i)=>`<a data-pi="${i}" class="${i===pi?'on':''}">${o.n} ${esc(o.zh)}</a>`).join('')}</div>
  <div class="pg"><div><div class="row"><button id="pc">複製貼文</button><span class="desc" style="margin:6px 0 0">本篇約 ${zhN+enN} 字（中文 ${zhN} 字＋英文 ${enN} 個單字）</span></div><div class="post" id="pt"></div></div>
  <div class="cardbox"><canvas id="cv" width="1080" height="1080"></canvas>
  <div class="row"><button id="pd">下載圖卡 PNG</button><button id="pth">換配色</button><button id="pall">下載本篇全部 ${p.qs.length} 張</button></div>
  <div class="qs">${p.qs.map((q,i)=>`<div data-qi="${i}" class="${i===qi?'on':''}">${esc(q[0])}<br><small style="color:var(--mute)">${esc(q[1])}</small></div>`).join('')}</div></div></div>`;
  $('#pt').textContent=p.text; drawCard($('#cv'));
  const dl=i=>new Promise(r=>{qi=i;drawCard($('#cv'));$('#cv').toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`SoulOS_${p.n}_${p.zh}_金句${i+1}.png`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>{URL.revokeObjectURL(a.href);r()},350)},'image/png')});
  $('#pd').onclick=()=>dl(qi);
  $('#pall').onclick=async()=>{const keep=qi;for(let i=0;i<p.qs.length;i++)await dl(i);qi=keep;drawCard($('#cv'))};
  $('#pth').onclick=()=>{ti=(ti+1)%themes.length;drawCard($('#cv'))};
  $('#pc').onclick=()=>{const ok=()=>{$('#pc').textContent='已複製 ✓';setTimeout(()=>$('#pc').textContent='複製貼文',1500)};
    if(navigator.clipboard)navigator.clipboard.writeText(p.text).then(ok,()=>prompt('請手動複製：',p.text));else prompt('請手動複製：',p.text)};
  $('#main').onclick=e=>{const a=e.target.closest('[data-pi],[data-qi]');if(!a)return;
    if(a.dataset.pi!==undefined){pi=+a.dataset.pi;qi=0;renderPosts();window.scrollTo(0,0)}
    else{qi=+a.dataset.qi;document.querySelectorAll('.qs div').forEach((d,i)=>d.classList.toggle('on',i===qi));drawCard($('#cv'))}};
}

/* ---------- 導覽、搜尋、金句 ---------- */
const DAILY=chapters.length, POSTS=DAILY+1; let cur=0;
function nav(){
  $('#nav').innerHTML=`<a data-ch="${DAILY}" class="${cur===DAILY?'on':''}">✅ 每日17關打卡<small>可勾選、可填寫、自動儲存</small></a>`+
   `<a data-ch="${POSTS}" class="${cur===POSTS?'on':''}">📣 臉書貼文＋圖卡<small>17篇雙語貼文、金句圖卡下載</small></a>`+
   chapters.map((c,k)=>`<a data-ch="${k}" class="${cur===k?'on':''}">${String(k+1).padStart(2,'0')}　${esc(c.title)}<small>${esc(c.desc)}</small></a>`).join('');
}
function show(k,target){
  cur=k; nav(); $('#main').oninput=null; $('#main').onclick=null;
  if(k===DAILY)renderDaily(); else if(k===POSTS)renderPosts(); else $('#main').innerHTML=renderChapter(chapters[k]);
  try{localStorage.setItem('soulos-last',k)}catch(e){}
  if(target)jump(target); else window.scrollTo(0,0);
}
function jump(id){const el=document.getElementById(id);if(!el)return;el.scrollIntoView({block:'center'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}
function search(q){
  const words=q.toLowerCase().split(/\s+/).filter(Boolean), hits=[]; let total=0;
  chapters.forEach(c=>c.lines.forEach((l,i)=>{ if(!l||/^━+$/.test(l)||/^\|\s*-{2,}/.test(l))return;
    const low=l.toLowerCase(); if(words.every(w=>low.includes(w))){total++;if(hits.length<300)hits.push([c,i,l])}}));
  const re=new RegExp('('+words.map(w=>esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
  const ph=[]; posts.forEach((p,i)=>p.text.split('\n').forEach(l=>{const low=l.toLowerCase();if(l.trim()&&words.every(w=>low.includes(w))){total++;if(ph.length<60)ph.push([i,l,p])}}));
  $('#main').oninput=null; $('#main').onclick=null;
  $('#main').innerHTML=`<h2>搜尋「${esc(q)}」</h2><p class="desc">共 ${total} 筆${total>300?'，顯示前 300 筆（多打幾個字可縮小範圍，空白分隔＝同時符合）':''}。點任一筆跳到原文位置。</p>`+
   ph.map(([i,l,p])=>`<div class="res" data-post="${i}"><small>📣 臉書貼文 › ${p.n} ${esc(p.zh)}</small>${esc(l).replace(re,'<mark>$1</mark>')}</div>`).join('')+
   hits.map(([c,i,l])=>`<div class="res" data-ch="${c.k}" data-go="L${c.k}-${i}"><small>${esc(c.title)}${c.sec[i]?' › '+esc(c.sec[i]):''}</small>${esc(l.replace(/\*\*/g,'')).replace(re,'<mark>$1</mark>')}</div>`).join('');
  window.scrollTo(0,0);
}
const quotes=[];chapters.forEach(c=>{if(c.title.indexOf('金句')>=0)c.lines.forEach((l,i)=>{if(/^[①②③]/.test(l))quotes.push([c,i,l.replace(/^[①②③]\s*/,'')])})});
function quote(){
  if(!quotes.length)return; const [c,i,t]=quotes[Math.floor(Math.random()*quotes.length)];
  let j=i;while(j>0&&!/^\d\d｜/.test(c.lines[j]))j--;
  const old=document.querySelector('.quote');if(old)old.remove();
  $('#main').insertAdjacentHTML('afterbegin',`<div class="quote"><span>「${esc(t)}」<br><small style="color:var(--mute)">${esc(c.sec[i])}｜${esc(c.lines[j].replace(/^\d\d｜/,''))}</small></span><button data-ch="${c.k}" data-go="L${c.k}-${i}">看出處</button></div>`);
  window.scrollTo(0,0);
}
let timer;
$('#q').addEventListener('input',e=>{clearTimeout(timer);const q=e.target.value.trim();timer=setTimeout(()=>q?search(q):show(cur),180)});
$('#rnd').onclick=quote;
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-ch],[data-go],[data-post]'); if(!a)return;
  if(a.dataset.post!==undefined){pi=+a.dataset.post;qi=0;$('#q').value='';show(POSTS);return}
  const go=a.dataset.go;
  if(a.dataset.ch!==undefined){$('#q').value='';show(+a.dataset.ch,go)} else jump(go);
});
let last=0;try{last=+localStorage.getItem('soulos-last')||0}catch(e){}
show(last>=0&&last<=POSTS?last:0);
})();
</script>
