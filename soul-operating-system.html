【07｜Attention｜注意能力群】
01｜Attention Awareness｜注意覺察
① 先知道手電筒照哪裡，才談得上移動它。
② 你一直看的地方，會慢慢變成你以為的世界。
③ 問自己：「我的注意現在被什麼抓走？」
02｜Selective Attention｜選擇性注意
① 世界太大，你必須學會選擇看什麼。
② 注意力不是無限資源，要花在值得的地方。
③ 不選擇注意什麼，就會由外界替你選。
03｜Sustained Attention｜持續注意
① 很多能力不是不會，而是注意停留得不夠久。
② 深度需要時間，時間需要注意。
③ 能把手電筒穩穩照住，是學習的基本功。
04｜Attention Shifting｜注意轉換
① 專注重要，能離開錯的地方也重要。
② 卡住時，換一個焦點可能比更用力有效。
③ 注意能轉彎，思考才不會撞牆。
05｜Attention Disengagement｜注意脫離
① 不是所有吸引你的東西，都值得你留下。
② 能把注意拿回來，就是一種自由。
③ 放下不重要的刺激，才能看見真正重要的訊號。
06｜Meta-attention｜後設注意
① 高階注意不是只看東西，而是知道自己正在看什麼。
② 能觀察自己的注意，就能開始管理自己的注意。
③ 手電筒之外，再多一雙看手電筒的眼睛。
07｜Priority Attention｜優先注意
① 先把最好的注意力給最重要的事。
② 注意的順序，就是人生資源的順序。
③ 不要把清醒的腦留給手機，把疲累的腦留給夢想。
08｜Threat Disengagement｜威脅脫離
① 大腦看到危險會盯住，但你可以重新檢查危險有多大。
② 一直看威脅，世界會看起來只剩威脅。
③ 看見危險之後，也要記得把手電筒照向Resource。
09｜Opportunity Detection｜機會發現
① 問題旁邊，常常也藏著可以利用的資源。
② 只找危險的人，很容易看漏出口。
③ 高Agency的人不只問「哪裡有問題」，也問「哪裡可以動」。
10｜Signal Detection｜訊號偵測
① 資訊很多，真正重要的Signal很少。
② 智慧不是看更多，而是看見更重要的。
③ 找到關鍵Signal，可以省掉大量無效努力。
11｜Noise Filtering｜雜訊過濾
① 不是所有資訊都值得進入腦中。
② Noise愈多，不代表你知道得愈多。
③ 能忽略不重要的，是專注的重要一半。
12｜Difference Detection｜差異偵測
① 改變通常先以一點點Difference出現。
② 不一樣的地方，就是Reality在提醒你模型可能要改。
③ 看見Difference，是Learning的入口。
13｜Pattern Attention｜模式注意
① 不只看今天，要看它是不是一直重複。
② Pattern比單一事件更值得高Weight。
③ 能看見重複，就能提早預測下一次。
14｜Structural Attention｜結構注意
① 不只看內容，也要看內容背後怎麼組成。
② 表面很亂時，去找下面的Structure。
③ 看懂結構，複雜就開始變簡單。
15｜Relational Attention｜關係注意
① 不只看A和B，也看A怎麼影響B。
② 很多答案藏在箭頭，不藏在Node。
③ 關係一變，整個系統都可能跟著變。
16｜Resource Attention｜資源注意
① 不要只盤點自己缺什麼，也要盤點已經有什麼。
② Resource被看見，Agency才會增加。
③ 解決問題不只靠補缺口，也靠重新使用現有資源。
17｜Counter-evidence Attention｜反證注意
① 真正想知道真相的人，也會看讓自己不舒服的證據。
② 只看支持自己的Evidence，模型會愈來愈硬。
③ 反證不是敵人，是免費的模型校正器。
18｜Attention Recovery｜注意恢復
① 分心不是結束，回來就是訓練。
② 專注高手不是從不分心，而是更快回來。
③ 每一次把注意帶回來，都在練習Agency。
19｜Attention Reallocation｜注意重新配置
① 發現看錯地方，就把手電筒移走。
② 注意不是承諾，可以重新分配。
③ 新Priority需要新的Attention配置。
20｜Attention Regulation｜注意調節
① 能決定什麼時候看、看多久、何時離開，就是注意自由。
② 注意不是只有集中，也包括切換與休息。
③ 管理注意，就是管理有限的生命資源。
━━━━━━━━━━━━━━━━━━
【08｜Evidence Selection｜證據能力群】
01｜Evidence Awareness｜證據覺察
① 有感覺以前，先問有沒有Evidence。
② 相信一件事之前，先知道自己憑什麼相信。
③ 沒有Evidence的地方，要勇敢留下「不知道」。
02｜Evidence Identification｜證據辨識
① 不是每一句話都是證據。
② 故事可以啟發你，但不能自動證明主張。
③ 先分清楚Opinion和Evidence。
03｜Source Evaluation｜來源評估
① 看內容以前，也要看它從哪裡來。
② 同一句話，不同來源的可信度可能完全不同。
③ 好資訊的第一關，是問「誰說的、怎麼知道的？」
04｜Source Reliability Judgment｜來源可靠性
① 名氣不等於永遠可靠。
② 可靠來源也可能在它不熟的領域犯錯。
③ 信來源，但不要把來源變成免檢查的權威。
05｜Evidence-quality Evaluation｜證據品質
① Evidence不是有就好，還要看品質。
② 好證據讓你更接近Reality，不只是更有信心。
③ 品質比堆數量更重要。
06｜Evidence-strength Evaluation｜證據強度
① 一個線索能支持多少，就只讓它支持多少。
② 不要用小Evidence下大結論。
③ 結論的重量，不該超過Evidence能承受的重量。
07｜Evidence Ranking｜證據排序
① 不同Evidence需要不同Weight。
② 排證據，比堆證據更重要。
③ 最可靠的資料應該坐在決策桌最前面。
08｜Supporting-evidence Search｜支持證據搜尋
① 想法需要證據，不只需要喜歡。
② 支持證據告訴你模型為什麼可能對。
③ 找支持很重要，但不能停在支持。
09｜Counter-evidence Search｜反證搜尋
① 想知道自己對不對，就主動找自己可能錯在哪。
② 反證是防止自我欺騙的工具。
③ 真正強的信念，不怕被反證檢查。
10｜Disconfirming Evidence Detection｜推翻性證據
① 先問：「看到什麼，我願意承認自己錯？」
② 如果答案是「沒有任何東西」，那就不是在測試模型。
③ 能被推翻的信念，才有真正學習的入口。
11｜Sampling Awareness｜樣本覺察
① 三個人這樣，不代表所有人都這樣。
② 看見幾個案例以前，先問它們代表誰。
③ 小樣本最容易長出大故事。
12｜Bias Detection｜偏誤偵測
① 大腦很喜歡找自己想看的東西。
② 偏誤不是別人才有，而是每個模型都需要防。
③ 最難發現的Bias，就是剛好支持自己的Bias。
13｜Missing-data Awareness｜缺失資料
① 沒看到，不代表不存在。
② 好問題不只問「我知道什麼」，也問「我還缺什麼」。
③ Missing Data有時就是最重要的資訊。
14｜Measurement Evaluation｜測量評估
① 尺拿錯了，數字再精準也沒有用。
② 先確認量的是不是你真正想知道的東西。
③ 精準地量錯東西，仍然是錯。
15｜Evidence Triangulation｜交叉驗證
① 一個角度容易誤判，多個獨立角度更可靠。
② 不要只用一支手電筒照Reality。
③ 不同來源指向同一方向，信心才有理由增加。
16｜Boundary Evaluation｜邊界評估
① Evidence在這裡成立，不代表到處成立。
② 每個結論都要問「適用到哪裡？」
③ 知道Boundary，才能避免把小真理變成大錯誤。
17｜Evidence–Claim Matching｜證據／主張匹配
① 小Evidence只能支持小Claim。
② 不要拿「可能」的資料證明「一定」。
③ Claim說多大，Evidence就要撐得住多大。
18｜Evidence Integration｜證據整合
① 不要讓最後看到的一個Evidence吃掉前面全部資料。
② 整合，是把支持、反對與未知一起放進來。
③ 好結論能容納複雜Evidence，而不是只挑喜歡的部分。
19｜Discriminative Evidence Selection｜區辨性證據
① 最有價值的Evidence，是能讓兩個模型分出勝負的Evidence。
② 不要只問「有沒有資料」，要問「什麼資料最能區分答案？」
③ 高Information Gain的Evidence，能少走很多路。
20｜Evidence-based Updating｜證據驅動更新
① Evidence的終點不是收藏，而是改變Model。
② 新資料如果永遠改不了信念，就沒有真正進入系統。
③ 尊重Evidence，就是允許它改變你。
━━━━━━━━━━━━━━━━━━
【09｜Representation｜表徵能力群】
01｜Representation Awareness｜表徵覺察
① 你不是直接看見Reality，而是在使用一種看法理解Reality。
② 看見自己的眼鏡，才知道世界可能不只長這樣。
③ 第一個Representation只是版本一。
02｜Reality–Representation Separation
① 地圖不是土地，表徵不是Reality。
② 你看到的「他很冷漠」，可能只是對行為的一種解釋。
③ 把Representation當Reality，是很多困局的起點。
03｜Representation Differentiation
① 愈能拆細，愈能找到真正問題。
② 「我不好」沒有出口；「我在公開發言時會緊張」開始有出口。
③ 高解析度Representation會增加Action Space。
04｜Multiple Representation
① 同一件事至少值得三種解釋。
② 第二個Representation，就是第一道自由。
③ 模型多一個，命運感少一點。
05｜Alternative Representation Generation
① 不必急著相信新解釋，只要先允許它存在。
② 替代模型不是自我安慰，而是避免過早定案。
③ 可能性增加，測試才真正開始。
06｜Representation Switching
① 一副眼鏡看不清楚，就換一副。
② 堅持不是永遠用同一種Representation。
③ 能切換視角的人，比只會堅持答案的人更有適應力。
07｜Representation Comparison
① 不問哪個故事最好聽，要問哪個模型解釋力更高。
② 好Representation應該能解釋更多Evidence。
③ 比較模型，不比較誰比較有面子。
08｜Representation Testing
① 每個Representation都應該接受Reality測試。
② 想法的價值，在於能不能產生可檢驗Prediction。
③ 不測試的Representation很容易變成信仰自己的故事。
09｜Representation Updating
① Reality變了，Representation就要跟著改。
② 更新不是輸，是模型完成工作。
③ 最好的Representation永遠保留版本號。
10｜Abstraction｜抽象化
① 從很多故事裡找到共同規律，就是抽象。
② 不只記案例，要找案例背後共同的Structure。
③ 抽象讓一個Learning可以帶到很多地方。
11｜Concretization｜具體化
① 太抽象的道理，要能落回一個真實例子。
② 說「要努力」不夠，要說今天晚上做什麼。
③ 能從概念回到Action，知識才開始有力量。
12｜Categorization｜分類
① 分類是為了看清楚，不是把世界關進盒子。
② 好分類幫助思考，壞分類取代思考。
③ 類別是工具，不是Reality最後的樣子。
13｜Recategorization｜重新分類
① 舊分類不好用，就重新分。
② 有些問題解不了，只因為一開始放錯抽屜。
③ 換分類方式，有時整個答案都會改變。
14｜Mechanism Representation｜機制表徵
① 不只問「發生什麼」，要問「它怎麼發生」。
② Mechanism找到，才知道可以從哪裡介入。
③ 結果是最後一站，智慧要往前找生成路徑。
15｜Structural Representation｜結構表徵
① 複雜不是亂，只是Structure還沒被看見。
② 把Node與Relation畫出來，問題就開始變清楚。
③ 結構比資訊量更重要。
16｜System Representation｜系統表徵
① 不要只修一顆零件，也看整台機器怎麼運作。
② 系統裡，一個改變可能跑一圈再回來。
③ 看懂System，才能避免頭痛醫頭。
17｜Relational Representation｜關係表徵
① Node告訴你有什麼，Relation告訴你怎麼動。
② 很多智慧藏在箭頭裡。
③ 改變Relation，有時比改變Node更有槓桿。
18｜Temporal Representation｜時間表徵
① 今天的結果可能是昨天的原因造成。
② 不把時間放進模型，就容易把延遲效果看錯。
③ 有些方法不是沒效，只是時間尺度看錯。
19｜Probabilistic Representation｜機率表徵
① 世界不是只有黑和白，還有很多百分比。
② 「可能」不等於「一定」。
③ 用Probability看世界，能保留更多Reality。
20｜Representation Portfolio｜多模型共存
① 聰明不是只有一個答案，而是能暫時保留幾個候選答案。
② 模型可以競爭，不必急著結婚。
③ 保留多個Candidate Models，直到Reality提供更多Difference。
━━━━━━━━━━━━━━━━━━
【10｜Prediction｜預測能力群】
01｜Prediction Awareness
① 很多焦慮，其實是腦中偷偷做了Prediction。
② 看見「我正在猜」，就不必把猜測當Reality。
③ 預測被說出來，才有機會被檢查。
02｜Prediction Explicitness
① 把模糊的「我覺得」說成清楚的「我預測」。
② 說清楚Prediction，Reality才知道怎麼回答你。
③ 模糊預測永遠不會錯，也永遠學不到東西。
03｜Probability Estimation
① 不只問會不會，要問有幾成。
② 給Prediction一個百分比，就是給自己留下更新空間。
③ 機率語言比絕對語言更接近不確定的世界。
04｜Conditional Prediction
① 好Prediction一定包含條件。
② 「如果A，那麼B」比「B一定發生」更有用。
③ 條件改變，Prediction也應該改。
05｜Scenario Prediction
① 不要押一個未來，準備幾個未來。
② 多情境不是悲觀，是讓模型更有彈性。
③ 未來有分支，計畫也要有分支。
06｜Time-horizon Prediction
① Prediction沒有時間，就很難驗證。
② 「會變好」要加一句「大概什麼時候」。
③ 時間尺度不同，同一模型可能看起來完全相反。
07｜Mechanism Prediction
① 不只猜結果，也猜它會透過什麼機制發生。
② Mechanism猜對，才能真正Transfer。
③ 只猜中答案，不代表理解原因。
08｜Outcome Prediction
① 行動以前，先寫下你預期看到什麼。
② 沒有預測，就很難知道結果到底教了你什麼。
③ Outcome是模型接受Reality考試的答案紙。
09｜Risk Prediction
① 風險不是想像最可怕的事，而是估計可能性與代價。
② 怕得很真，不代表發生機率很高。
③ 把Risk變成可估計的東西，恐懼就不必獨占方向盤。
10｜Base-rate Integration
① 看自己以前，也看看世界通常怎麼發生。
② 一個特別故事，不應完全蓋過基本機率。
③ Base Rate是防止故事太迷人的安全帶。
11｜Confidence Estimation
① 不只說答案，也說你有多確定。
② 100%信心應該需要非常強的Evidence。
③ 智慧的一部分，是知道自己的確定程度。
12｜Falsifiable Prediction
① 好Prediction要先說怎樣算自己錯。
② 永遠能替自己找理由的Prediction，學不到Reality。
③ 願意被推翻，是模型真正變強的開始。
13｜Prediction Discrimination
① 不同模型，要提出不同的未來。
② 如果兩個模型什麼都預測一樣，就很難靠Reality區分。
③ 找到分歧Prediction，就找到最值得測試的地方。
14｜Prediction Tracking
① 不記下昨天怎麼猜，就很容易以為自己一直很準。
② Prediction Journal是對抗事後聰明的工具。
③ 記錄猜測，才能看見模型真正的進步。
15｜Prediction–Outcome Comparison
① 學習發生在「我猜的」與「真的」之間。
② 不比較Prediction與Outcome，Experience很難變成Learning。
③ Difference就是Reality寫給模型的批改。
16｜Calibration
① 70%把握的事情，長期大約七成命中，才叫校準。
② 不是每次猜對，而是信心與準確度愈來愈匹配。
③ 真正的高手，不只答案準，連「自己有多準」也愈來愈準。
17｜Prediction Error Detection
① 「咦？」是很重要的智慧訊號。
② 跟預期不一樣的地方，最值得停下來看。
③ Surprise常常是高Information Gain。
18｜Prediction Revision
① 新Evidence來了，改Prediction不是丟臉。
② 堅持錯誤Prediction不叫堅持。
③ 修正預測，是模型尊重Reality的方式。
19｜Prediction Updating
① 每一筆新資料，都可以讓Probability微調。
② 不必從100跳到0，更新可以是一點一點。
③ 成熟的Prediction會隨Evidence移動。
20｜Adaptive Forecasting
① 未來在變，預測也要跟著變。
② 最好的預測者不是水晶球，而是最快校準的人。
③ Forecasting真正的力量來自持續Update。
━━━━━━━━━━━━━━━━━━
【11｜Thought｜念頭能力群】
01｜Thought Awareness
① 能看見念頭，就已經不完全困在念頭裡。
② 念頭被看見，就從主人變成Observation。
③ 第一個自由，是知道「我正在想」。
02｜Thought Detection
① 自動Thought跑得很快，所以要練習把它抓回來看。
② 情緒突然升高時，常常有一句Thought跑在前面。
③ 抓到那句話，就找到Generator的入口。
03｜Thought Labeling
① 替念頭命名，就能與它拉開一點距離。
② 「這是一個災難化Prediction」比「完蛋了」多了一層自由。
③ Label不是判決，是讓模糊變清楚。
04｜Thought Observation
① 不急著趕走Thought，先看看它怎麼來、怎麼走。
② 觀察念頭，不等於相信念頭。
③ 能看Thought的人，就不必每句都跟著跑。
05｜Thought–Self Separation
① 我有Thought，不等於Thought就是我。
② 腦中一句話沒有資格代表完整的Self。
③ 「我想到我不行」和「我不行」是兩個世界。
06｜Thought–Reality Separation
① 想到最壞情況，不代表最壞情況正在發生。
② Thought可以非常真實地被感受到，但仍然不是Reality。
③ 先問Evidence，再決定相信多少。
07｜Thought–Emotion Separation
① Thought和Emotion會互相影響，但不是同一件事。
② 「我害怕」和「我認為會失敗」需要分開看。
③ 拆開之後，才知道真正要更新哪個Node。
08｜Thought–Action Separation
① 想做，不等於要做。
② Thought可以出現，Action仍然需要你的同意。
③ 自由存在於「想到」和「做到」之間。
09｜Thought Reliability Assessment
① 每個Thought都可以問：「你有多可靠？」
② 熟悉的念頭，不一定是準確的念頭。
③ 重複很多次，不會自動把Thought變成Truth。
10｜Thought Evidence Testing
① Thought也要拿出Evidence。
② 「沒有人喜歡我」需要接受Reality查核。
③ 不要和Thought吵架，讓Evidence來說話。
11｜Thought Pattern Recognition
① 重複的Thought可能透露重複的Generator。
② 不要只處理句子，要找句子背後的Pattern。
③ 同類Thought一直出現，就往Self Model、Weight與Prediction找。
12｜Recurring-thought Detection
① 一直回來的Thought值得被研究，不一定值得被相信。
② 重複不是Truth的證明，而是Pattern的證明。
③ 問「為什麼系統一直生成它？」比「怎麼把它趕走？」更有用。
13｜Rumination Detection
① 思考會前進，反芻只會繞圈。
② 如果想了很久卻沒有新Evidence、新Model、新Action，可能只是在重播。
③ 真正的Thinking會產生Difference。
14｜Thought Defusion
① 不需要消滅Thought，只需要不要和它黏在一起。
② 讓Thought坐在旁邊，不必讓它開車。
③ 念頭可以很大聲，但最後Action仍由你決定。
15｜Decentering
① 我是看見Thought的人，不只是Thought本身。
② 退半步，才看得到整個Pattern。
③ 去中心化不是否定自己，而是把Self放回更大的畫面。
16｜Generator Tracing
① 不要只問「我在想什麼」，要問「什麼系統一直生成它」。
② Thought是果實，Generator才是樹根。
③ 找到Weight、Representation與Prediction，才能改變重複Thought。
17｜Thought Recontextualization
① 同一句Thought放到不同Context，意義可能不同。
② 「我做不到」也許真正意思是「我現在還沒有這個Skill」。
③ 換Context，Thought常會從命運變成問題。
18｜Alternative Thought Generation
① 第二個Thought不是要取代第一個，而是打開競爭。
② 多一個假設，就少一點被單一念頭綁架。
③ 不必逼自己正向，只要先允許更多可能。
19｜Meta-cognition｜後設認知
① 不只會想，還知道自己怎麼想。
② 高階智慧，是能觀察自己的思考機器。
③ 看見思考過程，就有機會修改思考過程。
20｜Thought Freedom｜念頭自由
① 自由不是腦中永遠只有好念頭。
② 自由是任何Thought出現，都不自動取得Action權。
③ Thought可以來訪，但不必取得房子的所有權。
━━━━━━━━━━━━━━━━━━
【12｜Emotion｜情緒能力群】
01｜Emotion Awareness
① 情緒被看見，就不必只靠行為替它說話。
② 先知道自己有感覺，才知道要照顧什麼。
③ 覺察Emotion，是調節Emotion的第一步。
02｜Emotion Detection
① 身體常比語言更早知道情緒來了。
② 心跳、肩膀、呼吸，都可能是Emotion的早期訊號。
③ 愈早發現，愈有選擇。
03｜Emotion Labeling
① 能說出「委屈」，就比只說「不爽」多一個解法。
② 情緒有名字，就比較不會只剩下爆發。
③ 命名不是貼標籤，而是增加解析度。
04｜Emotion Differentiation
① 生氣下面可能還有害怕、受傷與失望。
② 情緒拆得愈細，真正需要愈容易被看見。
③ 高解析度Emotion會產生高解析度Action。
05｜Emotion Intensity Estimation
① 先問現在是3分還是9分。
② 強度不同，需要的Action也不同。
③ 能量化情緒，就比較不會被「永遠、全部、完蛋」帶走。
06｜Primary–Secondary Emotion Separation
① 有時第一層是受傷，第二層才是生氣。
② 不要只處理最後爆出來的Emotion。
③ 找到第一層感受，常常才找到真正需要。
07｜Mixed-emotion Capacity
① 同時愛一個人又生他的氣，不矛盾。
② 人可以同時期待又害怕。
③ 能容納混合情緒，是情緒成熟，不是混亂。
08｜Emotion–Reality Separation
① 我害怕，不代表危險一定存在。
② Emotion是真的，但Emotion描述的世界不一定完全準確。
③ 感受需要被尊重，Prediction仍需要被檢查。
09｜Emotion–Thought Separation
① 「我難過」和「一切都完了」不是同一件事。
② 情緒是感受，Thought是解釋。
③ 拆開兩者，就能分別處理。
10｜Emotion–Action Separation
① 生氣可以存在，傷人的Action仍然可以不做。
② Emotion有發言權，但不必有最後決定權。
③ 能帶著Emotion選擇Action，就是Agency。
11｜Threat Signal Detection
① 害怕常在說：「我的系統認為有東西可能傷害我。」
② 聽懂警報，再檢查火到底多大。
③ Threat Signal值得聽，不必盲從。
12｜Value Signal Detection
① 你會難過，往往因為有東西對你很重要。
② Emotion常常偷偷告訴你Value在哪裡。
③ 找到「我在乎什麼」，情緒就開始有方向。
13｜Need Detection
① 情緒後面常藏著一個沒有被看見的Need。
② 不要只問「怎麼不要難過」，也問「我需要什麼？」
③ 看懂Need，Action才不會只剩下壓抑或爆發。
14｜Boundary Signal Detection
① 生氣有時是在說：「這裡越界了。」
② Boundary不是把人推開，而是告訴彼此哪裡需要停止。
③ 讀懂界線訊號，比單純壓住怒氣更有用。
15｜Loss Signal Detection
① 悲傷常常是在替重要的失去說話。
② 能悲傷，代表那件事曾經有Weight。
③ 失落不必被修掉，它需要被理解與整合。
16｜Emotion Prediction Tracing
① 情緒前面常站著一個Prediction。
② 焦慮時問：「我到底在預測什麼會發生？」
③ 找到Prediction，Emotion就有了可以測試的入口。
17｜Emotion Regulation
① 調節不是關掉情緒，而是把音量調到還能思考。
② 情緒可以留下，方向盤拿回來就好。
③ Regulation的目的不是舒服，而是恢復選擇能力。
18｜Emotion Tolerance
① 不舒服不代表必須立刻逃跑。
② 能和Emotion待一下，就是在增加自由。
③ 不需要等感覺消失，才開始做重要的事。
19｜Emotion Integration
① 不必選擇只保留「好情緒」。
② 完整的人可以同時容納喜悅、害怕、悲傷與希望。
③ 整合不是沒有情緒，而是每個情緒都有位置。
20｜Emotion-informed Agency
① 聽見情緒，再由自己做決定。
② Emotion提供資料，Agency選擇Action。
③ 最成熟的自由不是沒有感覺，而是帶著感覺仍能選。
━━━━━━━━━━━━━━━━━━
【13｜Agency｜自主選擇能力群】
01｜Agency Awareness
① 第一個Agency，是發現「我不是只能這樣」。
② 即使不能改全部，也找得到一個可以動的地方。
③ 看見可選擇的地方，無力感就開始鬆動。
02｜Choice Awareness
① 有時不是沒有選擇，而是只看見最熟悉的選擇。
② 在自動反應以前，先問「還有呢？」
③ 第二個選項，就是自由開始長出來的地方。
03｜Option Generation
① 困住人的常常不是問題，而是只剩一個答案。
② 至少生成三個選項，再談決定。
③ 選項增加，Action Space就增加。
04｜Alternative Action Generation
① 同一個Emotion，可以有不同Action。
② 不回應、晚點回應、換方法回應，都是新的路。
③ 不要讓Trigger只連到一個Action。
05｜Action-space Expansion
① 自由不是沒有牆，而是在牆裡找到更多路。
② Action Space愈大，舊Pattern愈難綁架你。
③ 多一個可行Action，就多一點Agency。
06｜Controllability Detection
① 先把「我能改的」圈出來。
② 不要把生命耗在命令不可控的Reality。
③ 控制不了結果，仍可能控制準備、行動與回應。
07｜Influenceability Detection
① 有些事情不能控制，但可以提高發生機率。
② 影響不是保證，仍然值得行動。
③ Agency不需要全能，只需要找到可施力的地方。
08｜Constraint Recognition
① 看見限制不是悲觀，是準確。
② 真正的自由不是假裝沒有牆。
③ 把Constraint畫出來，才知道門可能在哪裡。
09｜Constraint Navigation
① 不能穿牆，就找門、找路、找工具。
② 限制會縮小空間，但不一定把空間變成零。
③ 高Agency不是否認限制，而是會在限制中移動。
10｜Minimum-action Design
① 不知道怎麼走很遠，就先走下一步。
② 小到做得下去的Action，比完美但不開始的計畫更有力量。
③ 最小行動，是把可能變成Evidence的第一步。
11｜Experiment Design
① 不確定答案時，不一定要辯論，可以做Experiment。
② 好實驗用小成本換高Information Gain。
③ 與其猜很久，不如設計一個Reality能回答的問題。
12｜Decision Making
① Decision不是等到完全確定，而是在足夠Evidence下選下一步。
② 不決定也是一種決定。
③ 好決策不保證好結果，但能提高長期品質。
13｜Reversibility Judgment
① 能改回來的決策，可以更快Experiment。
② 很難回頭的決策，需要更高Evidence Threshold。
③ 先問「做錯能不能改」，就知道該多謹慎。
14｜Uncertainty Action
① 不知道全部答案，也能做不會把自己鎖死的小Action。
② 等100%確定，常常等不到Reality的新資料。
③ 在不確定中前進，是Agency的重要能力。
15｜Fear-tolerant Action
① 勇敢不是沒有Fear，而是Fear存在仍能做重要的事。
② 不必先把害怕治好，才開始行動。
③ 情緒可以坐車，但不要讓它搶方向盤。
16｜Pivot Ability
① 轉彎不是失敗，是使用Feedback。
② 原路走不通，換路比證明自己沒錯重要。
③ 真正的堅持，是堅持Goal，不是堅持同一條路。
17｜Fallback Planning
① A失敗時有B，恐懼就不必把A想成世界末日。
② 備案不是沒信心，是尊重不確定性。
③ 有第二條路的人，更敢走第一條路。
18｜Review-point Design
① 不要做完一年才問有沒有效。
② 提前設定檢查點，錯路就能早點轉彎。
③ Review Point是避免堅持變成僵化的安全裝置。
19｜Adaptive Agency
① 好Agency不是永遠照原計畫，而是能依Reality調整。
② 目標可以穩，方法可以動。
③ 適應不是隨波逐流，而是用Feedback重新選擇。
20｜High Agency
① High Agency不是「我能控制Reality」。
② High Agency是「Reality不照Prediction走，我仍能生成New Action」。
③ 世界可以否定我的Prediction，但不必拿走我的下一步。
━━━━━━━━━━━━━━━━━━
【14｜Action｜行動能力群】
01｜Action Initiation
① 最難的一步，常常是第一步。
② 不必等想做，先讓Action開始。
③ 開始會產生新的Evidence。
02｜Execution
① 好想法只有進入Reality，才知道好不好。
② 完成比一直準備更能產生Feedback。
③ Execution是讓Model接受Reality檢驗。
03｜Minimum Action
① 小到做得下去，才是真正的下一步。
② 一分鐘能開始的事，比一小時的幻想更接近改變。
③ Minimum Action不是目標小，而是啟動成本小。
04｜Action Decomposition
① 太大的任務會讓大腦只看見壓力。
② 把大山切成一步一步，路就出現了。
③ 拆小不是降低標準，而是提高完成率。
05｜Action Prioritization
① 不要同時救十個Node。
② 找到Bottleneck，先打最重要的一點。
③ 忙很多，不如改對一個高權重Node。
06｜High-leverage Action Selection
① 最好的Action不是最大，而是槓桿最高。
② 問：「哪個小改變可能帶動最多後續改變？」
③ 力氣有限，更要放在會連鎖反應的位置。
07｜Experimentation
① 行動不是宣誓，可以只是一次Experiment。
② 把「我要永遠做到」改成「我先測兩週」。
③ Experiment降低恐懼，也增加Information。
08｜Behavior Design
① 不要只靠意志力，要讓行為變容易。
② 好Behavior Design讓正確Action變成預設值。
③ 你每天重複什麼，比偶爾下多大決心更重要。
09｜Environment Design
① 改不了自己時，先看看能不能改環境。
② Environment每天都在替某些Action加分。
③ 把好選擇放近，把壞選擇放遠。
10｜Friction Reduction
① 好習慣的路要短，壞習慣的路要長。
② 少一個步驟，有時比多一點意志力有效。
③ 降低Friction，就是替未來的自己鋪路。
11｜Trigger Design
① 好行動需要清楚的「什麼時候開始」。
② 「有空再做」通常沒有真正的Trigger。
③ 把Action接到固定時間、地點或前一個行為。
12｜Reward Design
① 大腦喜歡知道努力之後有什麼。
② Reward不必很大，但要讓系統知道這個Action值得重複。
③ 獎賞設計是幫助Pattern形成，不是賄賂自己。
13｜Measurement-linked Action
① 沒有Measurement，就不知道Action有沒有效。
② 做以前先決定要看哪個指標。
③ 能被測量的Action，更容易被改進。
14｜Prediction-linked Action
① Action以前先說「我猜會發生什麼」。
② Prediction讓Action從做事升級成Experiment。
③ 有Prediction，Outcome才有真正的Learning Value。
15｜Iteration
① 第一版不必完美，只要能產生Feedback。
② 做→看→改→再做，比一直想完美更快。
③ Iteration讓錯誤變成進度。
16｜Adaptive Execution
① 計畫不是命令，是目前版本。
② Reality變了，Execution方式也可以變。
③ 執行力不只是堅持，也包含及時調整。
17｜Action Review
① 做完不是結束，Review才把Experience變Learning。
② 問「發生什麼、為什麼、下次改什麼」。
③ 沒有Review，經驗可能只是重複。
18｜Action Correction
① 發現錯就改，比證明自己原本沒錯重要。
② 修正Action不是前功盡棄，而是Learning正在發生。
③ 快速小修正，勝過長期錯方向。
19｜Retesting
① 改了模型，要重新讓Reality考一次。
② 沒有Retest，就不知道修正是否真的有效。
③ 真正的Update必須能在下一次行動中被看見。
20｜Action-to-Learning Conversion
① 做很多事不一定學很多。
② Action＋Feedback＋Reflection才容易形成Learning。
③ 行動最大的價值之一，是替模型帶回新Evidence。
━━━━━━━━━━━━━━━━━━
【15｜Feedback｜回饋能力群】
01｜Feedback Awareness
① 每個Action之後，Reality都可能留下答案。
② 沒有看Feedback，再努力也可能只是在重複。
③ 回饋一直存在，問題是你有沒有看見。
02｜Feedback Detection
① 結果不只在成功與失敗兩格。
② 微小Difference也是Feedback。
③ 愈早看見訊號，愈早可以修正。
03｜Feedback Collection
① 記憶會改寫故事，紀錄會留下資料。
② 想進步，就把重要Feedback留下來。
③ 沒有資料的回顧，很容易變成印象。
04｜Feedback Observation
① 先寫「發生什麼」，再寫「我覺得為什麼」。
② 不要讓Interpretation污染Observation。
③ 純Observation是模型更新最乾淨的原料。
05｜Signal Extraction
① Feedback很多，但不是每一部分都重要。
② 從結果裡找真正能改變Decision的Signal。
③ 好Learning不是記住全部，而是抽出關鍵Difference。
06｜Noise Filtering
① 一次好壞可能只是Noise。
② 不要因為一個點，就重寫整個人生模型。
③ Trend需要時間，Noise需要耐心。
07｜Source Evaluation
① 誰給的Feedback，也會影響它應得的Weight。
② 不懂你目標的人，也許只能提供局部Feedback。
③ 聽所有人，不等於所有人都給一樣Weight。
08｜Feedback-strength Evaluation
① 一次Feedback和長期Trend不該同權。
② 強烈批評不一定是強Evidence。
③ 回饋的音量與回饋的品質要分開。
09｜Trend Detection
① 不要問今天好不好，問最近是不是往某個方向走。
② Trend比單點更能告訴你Model是否有效。
③ 真正的改變常常藏在慢慢移動的平均值裡。
10｜Variation Detection
① 平均值會藏住Difference。
② 問「什麼時候特別好、什麼時候特別差？」
③ Variation常常能幫你找到Context Node。
11｜Immediate-feedback Recognition
① 有些Action馬上有結果。
② 即時Feedback適合快速調整。
③ 能立刻看到Difference，就立刻學一點。
12｜Delayed-feedback Recognition
① 有些重要結果需要時間。
② 太早判定沒效，可能只是Feedback還沒到。
③ 時間尺度錯了，也會把好Model判成壞Model。
13｜Unexpected-feedback Detection
① 最值得看的，常常是「怎麼會這樣？」
② Surprise是Reality敲門的聲音。
③ 意外結果可能比符合預期更有Information。
14｜Quantitative-feedback Interpretation
① 數字可以幫你看Trend，但數字不是全部Reality。
② 量化讓模糊變清楚，也要知道量到了什麼。
③ 數字需要Context，才有Meaning。
15｜Qualitative-feedback Interpretation
① 不是所有重要事情都能只用數字描述。
② 語言、感受、觀察也可以提供重要Signal。
③ 質性Feedback不是隨便，而是另一種資料形式。
16｜Prediction–Feedback Comparison
① Feedback真正有力量，是拿來和Prediction比較。
② 不是只問結果好不好，而是問「跟我原本猜的差多少？」
③ Difference就是Learning Signal。
17｜Feedback Integration
① 一次結果、一段Trend、他人觀察，都可以一起看。
② 整合不是平均，而是依品質給不同Weight。
③ 好Model能吃進多種Feedback。
18｜Feedback History Tracking
① 今天的結果放進歷史，Meaning才更清楚。
② 看長期紀錄，才能知道自己真的有沒有進步。
③ History讓你少被當下Emotion騙。
19｜Feedback-loop Design
① 不要等問題很大才收到Feedback。
② 好系統會讓Action很快遇見結果。
③ Feedback愈快、愈清楚，學習循環通常愈短。
20｜Feedback-to-Learning Conversion
① Feedback不是評分，是教材。
② 世界回你什麼，就拿什麼更新模型。
③ 真正的Learning，是Feedback進來後下一次Action不同了。
━━━━━━━━━━━━━━━━━━
【16｜Prediction Error｜預測誤差能力群】
01｜Error Awareness
① 「跟我想的不一樣」不是壞消息，是Learning開始。
② 看見Error，比假裝自己一直對更有力量。
③ Reality不同意你時，先聽它說完。
02｜Error Detection
① 沒有Difference，就不知道哪裡需要Update。
② Error不是人格問題，是模型與Reality之間的距離。
③ 找得到錯，才改得到對。
03｜Error Magnitude Estimation
① 差一點和差很大，需要不同程度的Update。
② 不要因為小誤差推翻全部模型。
③ 先量Difference，再決定改多少。
04｜Error Classification
① 所有錯都叫「我不行」，就永遠不知道怎麼修。
② 分類Error，就是把挫折變成可操作資料。
③ 錯在哪一類，比「有沒有錯」更重要。
05｜Error Localization
① 不要拆掉整棟房子，只因為一扇窗壞了。
② 找到真正錯的Node，修改才精準。
③ 局部錯誤不等於整體失敗。
06｜Error Attribution
① Outcome錯了，不代表一定是Model錯。
② 先問到底是看錯、想錯、做錯，還是量錯。
③ 正確歸因，才能正確更新。
07｜Root-error Analysis
① 表面的錯誤下面，可能還有更深的錯誤。
② 不要只修症狀，要找到第一個開始偏掉的地方。
③ Root Error找到，很多後面的錯會一起改善。
08｜Structured-error Detection
① 如果同一種錯一直出現，就別只怪運氣。
② 重複Error通常值得找Structure。
③ Patterned Error需要Patterned Solution。
09｜Noise–Error Discrimination
① 不是每次不準都代表模型壞了。
② 有些Difference只是Noise。
③ 不要讓偶然事件逼你過度Update。
10｜Observation Error
① 第一種可能：我一開始就看錯了。
② 資料輸入錯，後面推理再漂亮也沒用。
③ 修模型以前，先確認Reality有沒有看清楚。
11｜Representation Error
① Reality可能沒錯，是我解釋錯了。
② 換一副眼鏡，整個問題可能不同。
③ Representation Error常把可以處理的問題變成命運。
12｜Node Error
① 有時不是算錯，而是漏了一個重要變數。
② 問「還有什麼沒有放進模型？」
③ 找到Missing Node，Prediction可能立刻改善。
13｜Relation Error
① Node都對，箭頭也可能畫錯。
② A和B一起出現，不代表A一定造成B。
③ 關係連錯，整張地圖就會帶你走錯路。
14｜Weight Error
① 有時每個Node都有，只是重要性排錯了。
② 把小事看太大，也是一種Model Error。
③ Weight一改，Decision可能完全不同。
15｜Boundary Error
① 好方法用錯地方，也會變成壞方法。
② 模型不是錯，只是超出適用範圍。
③ 問「它在哪裡有效？」比問「它到底對不對？」更精準。
16｜Timing Error
① 有些Prediction只是時間抓錯。
② 太早看結果，可能把慢效誤判成無效。
③ Time Scale也是模型的一部分。
17｜Action Error
① 想法可能對，但執行方式錯。
② 不要因為Action失敗，就立刻推翻全部Model。
③ 先分清楚「方向錯」還是「做法錯」。
18｜Goal Error
① 最可怕的不是沒達標，而是達成錯的Goal。
② 努力以前先檢查計分板。
③ Goal錯了，成功也可能把你帶到不想去的地方。
19｜Measurement Error
① 尺錯了，數字愈精準可能愈危險。
② 不要只問「幾分」，要問「這個分數到底量到什麼？」
③ Measurement不是Reality，只是觀察Reality的一種工具。
20｜Error-to-Learning Conversion
① Error只有被更新，才真正變成Learning。
② 犯錯不可怕，重複同樣的錯卻沒有Model Update才可惜。
③ 每個Error都可以問：「下一版模型要改哪裡？」
━━━━━━━━━━━━━━━━━━
【17｜Reweighting｜重新賦權能力群】
01｜Reweighting Awareness
① 新Evidence來了，先問Weight需不需要改。
② 知道新資訊，不等於真的更新。
③ 真正的改變發生在重要性重新排序時。
02｜Evidence Reweighting
① 新證據更強，就讓它得到更大的聲音。
② 不要因為Evidence來得晚，就永遠讓它坐最後一排。
③ 尊重Reality，就是允許新Evidence改變Weight。
03｜Prior Updating
① 過去經驗是起點，不是終點。
② Prior可以影響今天，但不能拒絕今天的新Evidence。
③ 成熟的模型會記得過去，也會學習現在。
04｜Threat Recalibration
① 曾經危險，不代表現在仍然一樣危險。
② 警報系統也需要更新。
③ 把Threat調準，比叫自己「不要怕」更有用。
05｜Reward Recalibration
① 曾經想要的，不一定現在仍值得。
② Reward也需要接受長期Outcome校正。
③ 讓真正有價值的Reward慢慢變大聲。
06｜Memory Reweighting
① 記憶不需要消失，只需要回到適合的位置。
② 過去可以有聲音，但不必永遠最大聲。
③ 新Reality累積久了，舊Memory的預測權應該重新評估。
07｜Identity Reweighting
① 「我以前就是這樣」只是Evidence之一。
② 新Action可以慢慢提高新Identity的Weight。
③ 不要讓舊名字壓過現在正在發生的新證據。
08｜Social-weight Recalibration
① 別人的評價有資訊，但不是最終判決。
② 不需要把每個人的Opinion都調成最大聲。
③ 社會眼光降一點，Reality與Value才能被聽見。
09｜Authority-weight Calibration
① 尊重專家，不等於停止思考。
② Authority應該增加初始可信度，不應取消Evidence檢查。
③ 最好的權威也需要Boundary。
10｜Temporal Reweighting
① 時間會改變Evidence的重要性。
② 十年前的資料不應自動壓過今天的Reality。
③ 愈新的Evidence不一定愈好，但時間差必須被看見。
11｜Value Reweighting
① 人生改變，Value Weight也可以改變。
② 曾經最重要，不代表永遠最重要。
③ 重新排序Value，是成長的一部分。
12｜Risk Reweighting
① 新資料出現後，風險估計也要更新。
② 不要讓一次恐怖經驗永久把Probability鎖在100%。
③ Risk應該跟Evidence一起移動。
13｜Counter-evidence Reweighting
① 反證不能只被看見，還要真的得到Weight。
② 如果反證永遠改不了信念，你只是收藏資料，不是在Learning。
③ 真正的開放，是讓不舒服的Evidence有投票權。
14｜Contextual Reweighting
① 換了Context，Weight也應該重新計算。
② 同一個規則不必在所有情境都一樣重要。
③ 適應力，就是知道什麼時候該把誰調大聲。
15｜Weight-history Awareness
① 看自己以前把什麼看得很重，就能看見人生Pattern。
② 權重歷史，是理解舊Action的重要地圖。
③ 你今天的Weight，也可能是昨天的Feedback留下來的。
16｜Update-threshold Calibration
① 不要一個新Evidence就全盤翻轉，也不要一百個Evidence都不改。
② 更新太快會漂，更新太慢會僵。
③ 智慧是找到適合的Update Threshold。
17｜Model Permeability
① 好模型要有門，讓新Evidence進得來。
② 太硬的模型什麼都學不到，太鬆的模型什麼都留不住。
③ 穩定與可更新，要同時存在。
18｜Model Updating
① 新Evidence若沒有改變Prediction，可能還沒有真正更新。
② Model Update最後要看下一次你怎麼看、怎麼猜、怎麼做。
③ 真正更新不是說「我懂了」，而是Generator開始不同。
19｜Retest-based Reweighting
① 改完不要急著相信自己改對，再測一次。
② Reality是Model Update最後的老師。
③ Reweighting之後的新Prediction，還要重新接受考試。
20｜Continuous Updating
① 沒有最後版本，只有目前最好版本。
② 智慧不是找到永遠不變的答案，而是保有更新能力。
③ 真正的自由，是任何模型都不能禁止Reality教你。
━━━━━━━━━━━━━━━━━━

【Soul OS｜17大能力＝17個每天可以練的動作】
總流程：
看自己→看世界→排重要→拆故事→鬆身分→調音量→移手電筒→找證據→換眼鏡→下預測→看念頭→讀情緒→生選項→做實驗→收結果→找誤差→重新調權重→再測一次。

【01｜Self Model｜自我模型】
白話＝不要急著說「我就是這樣」，先把「我」拆開。
每天練習＝把一句「我是……」改寫成可改變的描述。
STEP 1｜抓一句今天對自己的評價。
例如：
「我英文很差。」
「我很懶。」
「我不會跟人相處。」
STEP 2｜禁止使用「我就是」。
STEP 3｜改成：
什麼情境？
什麼行為？
什麼能力？
什麼時間？
STEP 4｜重新寫。
「我英文很差」
→「我今天閱讀測驗錯6題。」
→「其中4題是單字看不懂。」
→真正Node＝Vocabulary Retrieval｜單字提取。
STEP 5｜問：
「這是State｜目前狀態，還是Trait｜長期特質？」
STEP 6｜找一個反例。
「有沒有哪一次我其實做得到？」
STEP 7｜生成新版Self Model。
「我不是英文差，我目前單字提取速度不足。」
每日產出：
舊標籤→可觀察事實→真正Node→反例→新版Self Model。
過關指標：
遇到失敗時，不再第一時間說「我就是不行」。
金句：
不要判決自己，診斷自己。
━━━━━━━━━━━━━━━━━━
【02｜World Model｜世界模型】
白話＝把「世界就是這樣」改成「我目前猜世界是這樣」。
每天練習＝抓一條自己很相信的世界規則。
例如：
「努力就一定成功。」
「人都不可信。」
「沒有人喜歡失敗者。」
STEP 1｜寫下信念。
STEP 2｜問：
「這是Reality，還是我的World Model？」
STEP 3｜找支持Evidence×3。
STEP 4｜找反例Evidence×3。
STEP 5｜找Boundary：
什麼情況成立？
什麼情況不成立？
STEP 6｜改成機率語言。
「人都不可信」
→「不同人的可信度不同，而且會依事情與情境改變。」
STEP 7｜生成新版World Model。
每日產出：
舊規則→支持證據→反證→適用邊界→新版規則。
過關指標：
「一定、永遠、全部、從來沒有」開始減少。
金句：
世界不必符合我的地圖；地圖要持續符合世界。
━━━━━━━━━━━━━━━━━━
【03｜Value Model｜價值模型】
白話＝把人生重要的東西真正排順序。
每天練習＝今天只能保留三件重要的事。
STEP 1｜列出今天想要的10件事。
STEP 2｜只能留下5件。
STEP 3｜再砍到3件。
STEP 4｜排序：
①最重要。
②第二重要。
③第三重要。
STEP 5｜問每一項：
「我真的願意拿時間交換它嗎？」
STEP 6｜檢查今天的時間分配。
嘴巴Value vs 實際Action。
例如：
嘴巴說健康第一。
實際：
睡眠5小時＋手機4小時。
→真正Weight可能不是健康第一。
STEP 7｜修改今天時間。
每日產出：
Top 3 Values＋各一個對應Action。
過關指標：
重要的事開始真的出現在行事曆。
金句：
你把時間給誰，就正在替什麼投票。
━━━━━━━━━━━━━━━━━━
【04｜Meaning｜意義】
白話＝把「事情」和「我替事情編的故事」拆開。
每天練習＝事件三解法。
STEP 1｜寫一件讓自己不舒服的事。
例如：
「朋友沒有回訊息。」
STEP 2｜只寫攝影機拍得到的Reality。
「昨天晚上8點傳訊息，到今天早上8點尚未回覆。」
STEP 3｜寫第一個Meaning。
「他討厭我。」
STEP 4｜再生兩個Meaning。
可能忙。
可能睡著。
可能不知道怎麼回答。
STEP 5｜問：
「目前哪個Meaning有最多Evidence？」
STEP 6｜暫時保留Unknown。
STEP 7｜等待新Evidence。
每日產出：
Reality｜Meaning A｜Meaning B｜Meaning C｜目前最合理版本。
過關指標：
事件發生後，可以生成至少3種解釋。
金句：
第一個故事，不必成為最後的真相。
━━━━━━━━━━━━━━━━━━
【05｜Identity｜身分】
白話＝把貼在自己身上的名字牌鬆開。
每天練習＝「我不是只有……」。
STEP 1｜寫下5個身分。
例如：
老師。
媽媽。
朋友。
學習者。
照顧者。
STEP 2｜找一個目前最綁架自己的Identity。
例如：
「我是老師，所以不能不知道。」
STEP 3｜問：
這個身分要求我一定怎樣？
STEP 4｜找出不合理規則。
「老師＝不能犯錯。」
STEP 5｜重新定義。
「老師＝示範如何發現錯誤並更新的人。」
STEP 6｜生成一個Possible Self。
「我還可以成為什麼？」
STEP 7｜今天做一個支持新Identity的小Action。
每日產出：
舊Identity→隱藏規則→新版Identity→新Action。
過關指標：
犯錯時不需要靠防衛保護身分。
金句：
身分不是監獄，是可以更新的名字牌。
━━━━━━━━━━━━━━━━━━
【06｜Weight｜權重】
白話＝看看今天到底是哪個聲音最大聲。
每天練習＝權重打分。
STEP 1｜遇到一個重要決定。
STEP 2｜列出影響你的因素。
例如：
安全。
金錢。
別人眼光。
自由。
健康。
成長。
STEP 3｜每個給0～10分。
STEP 4｜問：
「為什麼它有這麼高的Weight？」
STEP 5｜找Evidence。
STEP 6｜重新評分。
例如：
別人眼光＝原本9分。
檢查Evidence後＝4分。
健康＝原本5分。
長期Outcome加入後＝9分。
STEP 7｜重新決策。
每日產出：
Node｜舊Weight｜Evidence｜新Weight。
過關指標：
開始能說出「我為什麼把它看這麼重」。
金句：
不要讓最大聲的聲音，自動變成最重要的聲音。
━━━━━━━━━━━━━━━━━━
【07｜Attention｜注意】
白話＝練習控制自己的手電筒。
每天練習＝3次「注意力回收」。
STEP 1｜一天設定3次提醒。
STEP 2｜提醒響時問：
「我的注意力現在在哪裡？」
STEP 3｜分類：
重要。
不重要。
威脅。
手機。
擔心。
工作。
他人。
STEP 4｜問：
「這值得我現在繼續看嗎？」
STEP 5｜如果不值得，移回Priority。
STEP 6｜專注10分鐘。
STEP 7｜記錄成功回收次數。
每日產出：
被抓走→發現→移回→維持多久。
過關指標：
不是「完全不分心」，而是愈來愈快回來。
金句：
專注高手不是從不分心，而是更快把自己帶回來。
━━━━━━━━━━━━━━━━━━
【08｜Evidence Selection｜證據選擇】
白話＝每天當一次偵探。
每天練習＝支持證據3個＋反證3個。
STEP 1｜選一個今天很相信的想法。
例如：
「他一定對我有意見。」
STEP 2｜支持Evidence×3。
STEP 3｜反對Evidence×3。
STEP 4｜標記：
事實？
感覺？
猜測？
別人說的？
STEP 5｜來源可信度0～10。
STEP 6｜問：
「還缺什麼Evidence？」
STEP 7｜暫定結論。
每日產出：
Claim→支持3→反證3→Missing Data→目前信心%。
過關指標：
開始主動找「可能證明自己錯」的Evidence。
金句：
好偵探不只找自己喜歡的線索。
━━━━━━━━━━━━━━━━━━
【09｜Representation｜表徵】
白話＝同一件事練習戴三副眼鏡。
每天練習＝三表徵法。
事件：
「考試60分。」
眼鏡A｜人格眼鏡：
「我很笨。」
眼鏡B｜能力眼鏡：
「某些能力還不足。」
眼鏡C｜結構眼鏡：
「單字不足＋閱讀速度慢＋時間分配錯。」
STEP 1｜寫第一Representation。
STEP 2｜強迫生成第二個。
STEP 3｜再生成第三個。
STEP 4｜問：
哪一個最能解釋Evidence？
STEP 5｜哪一個最能產生Action？
STEP 6｜選目前最佳Representation。
STEP 7｜保留其他Candidate Models。
每日產出：
事件→Representation A/B/C→Evidence→暫定模型。
過關指標：
不再把第一個解釋直接當Reality。
金句：
自由，從第二副眼鏡開始。
━━━━━━━━━━━━━━━━━━
【10｜Prediction｜預測】
白話＝不要只說「我覺得」，真的猜一個可以驗證的答案。
每天練習＝每日3個Prediction。
格式：
「如果我做X，我預測Y有___%機率發生，期限是___。」
例如：
「如果今晚複習單字30分鐘，我預測明天小考80分以上的機率是70%。」
STEP 1｜寫Prediction。
STEP 2｜填Probability。
STEP 3｜填Time Horizon。
STEP 4｜填成功指標。
STEP 5｜填「什麼結果代表我猜錯？」
STEP 6｜等待Outcome。
STEP 7｜Prediction vs Reality。
每日產出：
Prediction｜信心%｜Outcome｜Error。
過關指標：
「一定」減少，「我估計70%」增加。
金句：
不要追求永遠猜對；追求愈猜愈準。
━━━━━━━━━━━━━━━━━━
【11｜Thought｜念頭】
白話＝把腦中的通知拿出來看，不要每一則都點開。
每天練習＝抓3個自動念頭。
STEP 1｜Emotion突然升高時停一下。
STEP 2｜問：
「剛才腦中閃過哪句話？」
STEP 3｜原句寫下。
例如：
「完了，我一定做不到。」
STEP 4｜前面加：
「我現在出現一個念頭：________。」
STEP 5｜再問：
這是Fact？
Prediction？
Memory？
Fear？
Identity？
STEP 6｜問：
「它從哪個Generator來？」
STEP 7｜決定：
相信？
降低Weight？
等待Evidence？
每日產出：
Thought→類型→Generator→Evidence→處理方式。
過關指標：
念頭出現後，不再立刻跟著走。
金句：
念頭可以敲門，不必讓它拿走房子的鑰匙。
━━━━━━━━━━━━━━━━━━
【12｜Emotion｜情緒】
白話＝把情緒當提醒燈讀懂。
每天練習＝情緒五問。
STEP 1｜我現在是什麼Emotion？
STEP 2｜強度0～10？
STEP 3｜身體哪裡感覺最明顯？
STEP 4｜它可能在預測什麼？
STEP 5｜它可能在保護什麼Value／Need／Boundary？
例如：
焦慮8。
胸口緊。
Prediction＝「明天會考差。」
Value＝成就。
Need＝準備感。
STEP 6｜問：
「Emotion是真的；但Prediction有Evidence嗎？」
STEP 7｜選Action。
每日產出：
Emotion→Intensity→Prediction→Value/Need→Action。
過關指標：
能把「我很不爽」拆成更精準的Emotion＋Need。
金句：
情緒是提醒燈，不是方向盤。
━━━━━━━━━━━━━━━━━━
【13｜Agency｜自主選擇】
白話＝每次覺得「沒辦法」，強迫自己生出三條路。
每天練習＝3 Options Rule。
STEP 1｜抓一句：
「我沒辦法。」
「我只能……。」
STEP 2｜問：
不可控的是什麼？
STEP 3｜可控制的是什麼？
STEP 4｜可以影響的是什麼？
STEP 5｜強迫生成3個Action。
A。
B。
C。
STEP 6｜每個Action評估：
成本。
風險。
可逆性。
可能收益。
STEP 7｜選最小可行Action。
每日產出：
Constraint→Controllable→3 Options→Minimum Action。
過關指標：
遇到困局可以在5分鐘內生成至少3個選項。
金句：
High Agency不是控制世界，而是永遠能生成下一步。
━━━━━━━━━━━━━━━━━━
【14｜Action｜行動】
白話＝不要一次改人生，只做一個最小實驗。
每天練習＝Minimum Experiment。
STEP 1｜選今天最重要的Goal。
STEP 2｜找最大Bottleneck。
STEP 3｜問：
「最小可以測試它的Action是什麼？」
STEP 4｜限制在5～20分鐘。
STEP 5｜行動前寫Prediction。
STEP 6｜真的做。
STEP 7｜記錄Outcome。
例如：
Goal＝增加閱讀速度。
Experiment＝每天陌生文章限時10分鐘。
Prediction＝兩週後閱讀時間下降10%。
每日產出：
Goal→Bottleneck→Minimum Action→Prediction→Outcome。
過關指標：
想法能在24小時內轉成一個Experiment。
金句：
不要用想法證明自己，用行動向Reality拿答案。
━━━━━━━━━━━━━━━━━━
【15｜Feedback｜回饋】
白話＝每天讀一次世界給你的成績單。
每天練習＝Action後四問。
①我原本做了什麼？
②真正發生什麼？
③哪裡比預期好？
④哪裡跟預期不同？
STEP 1｜只寫Observation。
STEP 2｜暫時不責怪。
STEP 3｜找Signal。
STEP 4｜排除Noise。
STEP 5｜看Trend。
STEP 6｜問：
「哪個Node可能要改？」
STEP 7｜決定下一輪Action。
每日產出：
Action→Observation→Signal→Difference→Next Action。
過關指標：
結果不好時，第一反應從「我失敗」變成「資料告訴我什麼？」
金句：
Feedback不是判決書，是下一版模型的教材。
━━━━━━━━━━━━━━━━━━
【16｜Prediction Error｜預測誤差】
白話＝專門研究「咦？怎麼跟我想的不一樣？」
每天練習＝每日抓1個Surprise。
STEP 1｜今天哪件事跟預期不同？
STEP 2｜Prediction是什麼？
STEP 3｜Reality是什麼？
STEP 4｜Difference是什麼？
STEP 5｜套用十大Error：
E1 Observation Error｜看錯。
E2 Representation Error｜解釋錯。
E3 Node Error｜漏東西。
E4 Relation Error｜連錯。
E5 Weight Error｜重要性估錯。
E6 Boundary Error｜用錯情境。
E7 Timing Error｜時間抓錯。
E8 Action Error｜執行錯。
E9 Goal Error｜目標錯。
E10 Measurement Error｜量錯東西。
STEP 6｜選最可能Error。
STEP 7｜只修那一層。
每日產出：
Prediction→Reality→Difference→Error Type→Correction。
過關指標：
出錯後能說出「錯在哪一層」，而不是只說「我失敗了」。
金句：
猜錯的地方，就是Reality正在教你的地方。
━━━━━━━━━━━━━━━━━━
【17｜Reweighting｜重新賦權】
白話＝新證據來了，真的把心裡的音量重新調整。
每天練習＝Before／After Weight。
STEP 1｜選今天一個重要信念。
STEP 2｜列主要Evidence。
STEP 3｜每項Weight＝0～10。
STEP 4｜加入今天的新Evidence。
STEP 5｜問：
「如果公平看待這個Evidence，哪個Weight應該改？」
STEP 6｜重新評分。
例如：
「我不會公開演講。」
舊失敗記憶＝Weight 9。
今天成功講5分鐘＝新Evidence。
舊失敗Weight 9→7。
「我可以慢慢進步」Weight 2→4。
STEP 7｜寫新版Prediction。
STEP 8｜安排下一次Retest。
每日產出：
Old Weight→New Evidence→New Weight→New Prediction→Retest。
過關指標：
新Evidence真的會改變下一次Prediction與Action。
金句：
知道新證據不叫成長；讓新證據改變權重，才叫更新。
━━━━━━━━━━━━━━━━━━
【17大能力｜每天17問】
01 Self Model｜我是不是又把「現在」說成「永遠的我」？
02 World Model｜這是Reality，還是我對世界的猜法？
03 Value Model｜今天真正最重要的三件事是什麼？

09 Representation｜還能戴哪兩副眼鏡看這件事？
10 Prediction｜我到底預測什麼？機率多少？
11 Thought｜這只是念頭，還是Fact？
12 Emotion｜這個提醒燈正在告訴我什麼？
13 Agency｜除了現在這條路，我還有哪兩條？

15 Feedback｜Reality剛剛回了我什麼資料？

【一件事完整跑完17關｜實戰版】
Reality：
「這次英文考60分。」
↓
01 Self Model：
不是「我是爛學生」。
→「我這次考60分。」
↓
02 World Model：
不是「我就是沒有英文天分」。
→英文成績由多個能力Node共同生成。
↓
03 Value：
我真正要的是「能力提升」，不是只保護面子。
↓
04 Meaning：
60分≠我很笨。
→它是目前Learning System的Feedback。
↓
05 Identity：
「我不是失敗者。」
→我是正在學習的人。
↓
06 Weight：
把「同學怎麼看我」9→4。
把「找到錯誤Node」4→9。
↓
07 Attention：
從「我好丟臉」
→移到「錯題分布」。
↓
08 Evidence：
50題中錯20題。
其中：
單字10。
文法3。
閱讀7。
↓
09 Representation：
不是「英文差」。
→主要Bottleneck＝Vocabulary Retrieval＋Reading Processing。
↓
10 Prediction：
如果每天增加20分鐘單字提取＋限時閱讀，
預測四週後分數提高10分的機率＝70%。
↓
11 Thought：
「我一定沒救。」
→這是一個Thought，不是Reality。
↓
12 Emotion：
挫折7／10。
→它在告訴我：成績對我很重要。
↓
13 Agency：
Option A＝只背單字。
Option B＝只刷題。
Option C＝單字提取＋限時閱讀＋錯題分析。
→選C。
↓
14 Action：
今天先做20分鐘。
↓
15 Feedback：
一週後閱讀速度提升8%。
↓
16 Prediction Error：
原預測＝單字是唯一主因。
Reality＝句構解析也造成大量失分。
→Node Error。
↓
17 Reweighting：
Vocabulary Weight 9→7。
Syntax Parsing Weight 3→7。
↓
Model Update：
新模型＝Vocabulary＋Syntax Parsing共同形成Bottleneck。
↓
New Action：
下一週加入句構拆解。
↓
Retest。

【真正每天可用的3分鐘Soul OS】
第1分鐘｜STOP
現在發生什麼？
我在想什麼？
我在感覺什麼？
↓
第2分鐘｜MODEL
我怎麼解釋？
我在預測什麼？
我把什麼看得太重？
有沒有第二種解釋？
有沒有反證？
↓
第3分鐘｜ACT
什麼可以控制？

做。

━━━━━━━━━━━━━━━━━━
【17大能力最後統一成7個真正要練的動作】
① 看見｜Observe
看見Self、Thought、Emotion、Attention。
② 拆開｜Differentiate
把事件、解釋、情緒、身分、能力、Evidence拆開。
③ 多生一個｜Generate
多一個Representation、多一個Prediction、多一個Action。
④ 查證｜Test
支持Evidence＋Counter-evidence＋Reality Test。
⑤ 做一步｜Act
Minimum Action＋Experiment。
⑥ 看差多少｜Compare
Prediction vs Reality＝Prediction Error。
⑦ 重新調整｜Update
Reweight→Model Update→New Action→Retest。
【Soul OS最終訓練公式】
Trigger
→停3秒
→Observation
→「這是Reality還是我的故事？」
→找Thought
→找Emotion
→找Prediction
→找Weight
→生成3個Representation
→支持Evidence＋反證
→生成3個Action
→選Minimum Action
→執行
→收Feedback
→Prediction vs Reality
→找Error Type
→Reweight
→Model Update
→Retest。
【最高階訓練目標】
不是：
「我再也不犯錯。」
而是：
犯錯→更快看見。
情緒來→更快讀懂。
舊念頭來→更快分離。
第一解釋來→更快生成第二解釋。
不確定來→仍能生成Action。
Reality不同意→不急著保護Identity。
Prediction錯誤→找Error。
新Evidence出現→真的改Weight。
Weight改變→Prediction改變。
Prediction改變→Action改變。
Action改變→Feedback改變。
Feedback再回來→Model繼續更新。
最後真正練成的，不是17個分散技巧。
而是一個終身能力：
「我可以不斷讓Reality教我，然後生成更好的下一步。」

<script type="text/plain" id="posts">01｜Self Model｜自我模型｜你不是「就是這樣」，你只是「目前這樣」｜You're not "just like this" — you're "like this, for now"
💔 痛點｜The Pain
考差一次，你說「我就是笨」。
被拒絕一次，你說「我就是沒人要」。
拖延一個晚上，你說「我就是爛」。
一次的結果，被你寫成一生的判決。
最累的不是失敗本身，而是你每天背著那句「我就是這樣」過日子。
One bad exam, and you say, "I'm just stupid."
One rejection, and you say, "Nobody wants me."
One night of procrastination, and you say, "I'm hopeless."
A single result gets written into a life sentence.
The heaviest part isn't the failure. It's carrying "that's just who I am" every single day.

🔄 更新｜The Update
「我是誰」不是事實，而是大腦目前畫出來的一張自我地圖。
地圖可以重畫。
把「我是」改成「我目前」。
把「我不行」改成「我哪一項還不行」。
把「永遠」改成「這一次」。
"Who I am" is not a fact. It is a map of yourself that your mind has drawn so far.
Maps can be redrawn.
Change "I am" into "right now, I."
Change "I can't" into "which part can't I do yet?"
Change "always" into "this time."

💪 能力｜The Skill
你會學會把自己和狀態分開。
你會學會把人格標籤，拆成可以練的能力。
你會學會用新的行動，替自己累積新的證據。
You learn to separate yourself from your state.
You learn to break a label into skills you can train.
You learn to collect new evidence about yourself through new action.

🦉 智慧｜The Wisdom
現在的你，不是永遠的你。
穩定的模式，不是永恆的本質。
過去是起點，不是終點。
Who you are now is not who you are forever.
A stable pattern is not a permanent essence.
The past is a starting point, not a finish line.

🌊 從舊到新｜From Old to New
舊：我是失敗者。→ 新：我目前在某件事上失敗了。
Old: I am a failure. → New: I failed at one thing, for now.
舊：我很懶。→ 新：我要拆開動機、阻力和獎賞。
Old: I'm lazy. → New: let me look at motivation, friction, and reward.
舊：我的過去就是我。→ 新：過去是起點，不是全部的我。
Old: my past is me. → New: my past is a starting point, not all of me.
舊：成績定義我。→ 新：成績只量到某一天的一部分表現。
Old: my grades define me. → New: a grade measures part of one day.
舊：我要找到真正的自己。→ 新：我會在行動裡，不斷長出自己。
Old: I must find my true self. → New: I keep growing a self through action.

🌱 當你開始這樣練｜When You Begin to Practice
你會發現，失敗變小了，因為它只是一件事。
你會發現，選擇變多了，因為問題被拆開了。
你會發現，羞愧變輕了，因為錯的是方法，不是你。
你會發現，勇氣變大了，因為試一次不再等於賭上整個自己。
You'll find failure shrinks, because it's only one event.
You'll find options multiply, because the problem has been taken apart.
You'll find shame lightens, because the method was wrong — not you.
You'll find courage grows, because one try no longer bets your whole self.

🤍 寫給今天的你｜A Note for You Today
如果今天你又對自己說了很重的話，沒關係。
先把那句話放下來，看一看它。
它不是真相，它只是一張舊地圖。
而你，手上一直握著筆。
If you said something harsh to yourself again today, it's all right.
Set the sentence down and look at it.
It isn't the truth. It's only an old map.
And you have been holding the pen all along.

✨ 金句｜Lines to Keep
★不要判決自己，診斷自己。｜Don't sentence yourself. Diagnose yourself.
★我現在不好，不等於我不好。｜"I'm not okay right now" does not mean "I am not okay."
★把「我是」改成「我現在」，人生就多了一條出口。｜Change "I am" to "right now I," and life opens another exit.
★做錯一件事，不等於你是一個錯的人。｜Doing one thing wrong doesn't make you a wrong person.
★你不是只有一個版本。｜You are not only one version.
★自由，從「我也可能不是這樣」開始。｜Freedom begins with "maybe I'm not like this after all."

👉 今日一小步｜One Small Step
抓一句今天對自己說的「我就是……」，改寫成「我目前在……的情況下，容易……」。
Catch one "I'm just…" you said today, and rewrite it as "Right now, in … situations, I tend to …"

02｜World Model｜世界模型｜世界沒有欺負你，是你的地圖太舊了｜The world isn't against you — your map is just old
💔 痛點｜The Pain
你說：「人都不可信。」
你說：「努力根本沒有用。」
你說：「這個世界就是不公平。」
每一句都像真理，每一句都讓你更不敢走出去。
你以為自己看清了世界，其實你只是一直拿著十年前的地圖找今天的路。
You say, "People can't be trusted."
You say, "Hard work never pays off."
You say, "The world is simply unfair."
Each sentence sounds like truth, and each one keeps you from stepping outside.
You think you've seen the world clearly. In fact, you're using a ten-year-old map to find today's road.

🔄 更新｜The Update
「世界就是這樣」，其實是「我目前猜世界是這樣」。
把「一定」換成「有幾成可能」。
把「全部」換成「在哪些情況下」。
把「誰害的」換成「是什麼循環讓它一直發生」。
"That's how the world is" really means "that's my current guess about the world."
Trade "definitely" for "how likely?"
Trade "everyone" for "in which situations?"
Trade "who did this?" for "what loop keeps this happening?"

💪 能力｜The Skill
你會看見系統，而不只看見事件。
你會看見機率，而不只看見黑白。
你會看見邊界，知道一個道理在哪裡成立、在哪裡失效。
You begin to see systems, not just events.
You begin to see probabilities, not just black and white.
You begin to see boundaries — where a rule holds, and where it breaks.

🦉 智慧｜The Wisdom
世界不需要符合我的模型。
未知不等於危險。
好的地圖不是永遠不改，而是永遠能改。
The world has no duty to match my model.
Unknown does not mean dangerous.
A good map is not one that never changes, but one that always can.

🌊 從舊到新｜From Old to New
舊：世界很危險。→ 新：危險有情境，也有機率。
Old: the world is dangerous. → New: danger has contexts and odds.
舊：努力一定成功。→ 新：努力只是許多變數裡的一個。
Old: effort always wins. → New: effort is one variable among many.
舊：拒絕代表敵意。→ 新：拒絕可能只是邊界不同。
Old: rejection means hostility. → New: rejection may just be a different boundary.
舊：困難代表走錯路。→ 新：困難可能只是阻力變大。
Old: difficulty means the wrong road. → New: difficulty may only be more friction.
舊：我要世界符合我的想法。→ 新：我要我的想法持續符合世界。
Old: the world should fit my ideas. → New: my ideas should keep fitting the world.

🌱 當你開始這樣練｜When You Begin to Practice
你會發現，壞人變少了，循環變清楚了。
你會發現，抱怨變少了，槓桿變多了。
你會發現，恐懼變小了，因為未知不再等於危險。
你會發現，世界沒有變溫柔，是你看得更準了。
You'll find fewer villains and clearer loops.
You'll find fewer complaints and more levers.
You'll find less fear, because unknown no longer equals danger.
You'll find the world hasn't softened — you just see it more accurately.

🤍 寫給今天的你｜A Note for You Today
你曾經受過傷，所以畫下了那張小心翼翼的地圖。
那張地圖保護過你，謝謝它。
但今天的路，已經和當年不一樣。
你可以帶著它，也可以開始修改它。
You were hurt once, so you drew that careful map.
That map protected you. Thank it.
But today's road is not the road of those years.
You can carry it — and you can start to revise it.

✨ 金句｜Lines to Keep
★地圖不是土地，想法不是世界。｜The map is not the land. The thought is not the world.
★不要要求世界符合你的地圖，讓地圖持續符合世界。｜Don't ask the world to fit your map. Keep your map fitting the world.
★一個結果，常常有很多爸爸媽媽。｜One result often has many parents.
★不知道答案，也可以先不亂填答案。｜Not knowing the answer doesn't mean you must fill in a wrong one.
★想一百遍，不如讓現實回答一次。｜A hundred guesses are worth less than one answer from reality.
★世界變了，地圖也要跟著改。｜When the world changes, the map must change too.

👉 今日一小步｜One Small Step
寫下一條你深信的「世界規則」，找三個支持、三個反例，再寫出它「在什麼情況下才成立」。
Write down one "rule of the world" you believe. Find three supports, three counter-examples, and then write when it actually holds.

03｜Value Model｜價值模型｜你不是時間不夠，是什麼都想排第一｜You're not short on time — everything is trying to be first
💔 痛點｜The Pain
你很忙，卻不知道在忙什麼。
你很累，卻說不出為了什麼。
你答應了所有人，唯獨沒有答應自己。
嘴巴說健康最重要，手卻滑到半夜兩點。
你不是不努力，你只是一直替別人的排行榜努力。
You're busy, but you don't know what for.
You're tired, but you can't say why.
You said yes to everyone — except yourself.
You say health comes first, yet you scroll until two in the morning.
It's not that you don't work hard. You're just working hard for someone else's ranking.

🔄 更新｜The Update
人生不是把所有東西最大化，而是知道什麼真正值得最大化。
十件想要的事，留五件。
五件重要的事，留三件。
三件裡面，排出誰先誰後。
Life is not about maximizing everything. It's about knowing what is truly worth maximizing.
From ten wants, keep five.
From five priorities, keep three.
Among the three, decide who goes first.

💪 能力｜The Skill
你會學會取捨，而不是全部都要。
你會學會看見機會成本，知道每個「好」後面都藏著幾個「不」。
你會學會讓行事曆，說出你真正相信的事。
You learn to trade off instead of wanting it all.
You learn to see opportunity cost — behind every yes hide several no's.
You learn to let your calendar say what you truly believe.

🦉 智慧｜The Wisdom
重要不等於緊急。
舒服不等於值得。
別人的期待，不等於我的價值。
目標錯了，愈有效率，走得愈遠。
Important is not the same as urgent.
Comfortable is not the same as worthwhile.
Other people's expectations are not my values.
With the wrong goal, the more efficient you are, the farther you stray.

🌊 從舊到新｜From Old to New
舊：被喜歡最重要。→ 新：真實和長期價值更重要。
Old: being liked matters most. → New: truth and long-term value matter more.
舊：忙就是有價值。→ 新：有效的產出比忙碌重要。
Old: busy means valuable. → New: real output matters more than busyness.
舊：犧牲自己才是愛。→ 新：能長久的互相照顧才是愛。
Old: love is self-sacrifice. → New: love is care that can last on both sides.
舊：不能讓人失望。→ 新：別人的失望，不等於我的錯。
Old: I must never disappoint. → New: their disappointment is not my fault.
舊：成為正確的人。→ 新：成為可以更新的人。
Old: become someone who's right. → New: become someone who can update.

🌱 當你開始這樣練｜When You Begin to Practice
你會發現，拒絕變得比較容易，因為你知道自己在守什麼。
你會發現，選擇變得比較快，因為排行榜已經排好。
你會發現，內耗變得比較少，因為兩個都重要的事終於分出先後。
你會發現，日子沒有變長，卻變得比較像你的。
You'll find saying no gets easier, because you know what you're protecting.
You'll find choosing gets faster, because the ranking is already set.
You'll find less inner friction, because two important things finally have an order.
You'll find the days aren't longer — but they feel more like yours.

🤍 寫給今天的你｜A Note for You Today
你不必把每一件事都做好。
你只需要把最重要的那幾件，好好放在前面。
其他的，可以慢一點，可以少一點，可以說不。
這不是自私，這是對生命誠實。
You don't have to do everything well.
You only need to place the few things that matter most in front.
The rest can be slower, smaller, or a no.
That is not selfish. That is being honest with your life.

✨ 金句｜Lines to Keep
★你把時間給誰，就正在替什麼投票。｜Where you give your time is where you cast your vote.
★如果每件事都是第一名，就等於沒有第一名。｜If everything is number one, nothing is.
★每個「好」的背後，都藏著一些「不」。｜Behind every yes, there are a few no's.
★不願取捨的人，最後常常被現實替他取捨。｜Those who refuse to choose are often chosen for by reality.
★不要讓五分鐘的衝動，打敗五年的目標。｜Don't let a five-minute impulse defeat a five-year goal.
★沒有邊界的善良，最後可能耗盡善良。｜Kindness without boundaries eventually runs out of kindness.

👉 今日一小步｜One Small Step
列出今天想做的十件事，砍到三件，各配一個今天就能做的小行動。
List ten things you want today, cut them down to three, and give each one small action you can do today.

04｜Meaning｜意義｜傷你最深的，常常不是事情，是你替它寫的故事｜What hurts most is often not the event, but the story you wrote about it
💔 痛點｜The Pain
他沒有回訊息，你寫下：「他討厭我。」
主管皺了一下眉，你寫下：「我完蛋了。」
一段關係結束，你寫下：「我的人生失敗了。」
事情只發生一次，故事卻在你心裡重播一百次。
你不是被事件打倒的，你是被自己配的旁白打倒的。
He didn't reply, and you wrote: "He hates me."
Your boss frowned, and you wrote: "I'm finished."
A relationship ended, and you wrote: "My life has failed."
The event happened once. The story replayed a hundred times.
You weren't knocked down by the event. You were knocked down by your own narration.

🔄 更新｜The Update
事情是一層，解釋是另一層。
先寫下攝影機拍得到的事實。
再寫下你的第一個故事。
然後，強迫自己再寫兩個。
最後問：哪一個故事，真的有證據？
The event is one layer. The interpretation is another.
First, write what a camera could record.
Then, write your first story.
Then, force yourself to write two more.
Finally, ask: which story actually has evidence?

💪 能力｜The Skill
你會把觀察和解釋分開。
你會把失敗從「我不行」讀成「方法還要改」。
你會把衝突從「關係破裂」讀成「差異終於被看見」。
You learn to separate observation from interpretation.
You learn to read failure as "the method needs work," not "I'm not enough."
You learn to read conflict as "a difference finally seen," not "a relationship broken."

🦉 智慧｜The Wisdom
失敗不自帶「我不行」。
拒絕不自帶「我沒有價值」。
不知道，不自帶「我無能」。
意義不是撿到的，意義是生成的。
Failure doesn't come with "I'm not enough."
Rejection doesn't come with "I'm worthless."
Not knowing doesn't come with "I'm incapable."
Meaning isn't found lying around. Meaning is made.

🌊 從舊到新｜From Old to New
舊：批評就是攻擊。→ 新：批評裡可能藏著有用的差異。
Old: criticism is attack. → New: criticism may hide a useful difference.
舊：被糾正很丟臉。→ 新：我得到一個免費的修正訊號。
Old: being corrected is humiliating. → New: I just got a free correction signal.
舊：休息就是偷懶。→ 新：休息是系統在恢復。
Old: rest is laziness. → New: rest is the system recovering.
舊：別人離開，是我不好。→ 新：關係的變化有很多原因。
Old: they left because I'm not enough. → New: relationships change for many reasons.
舊：危機就是結束。→ 新：危機是舊模型不再合用的訊號。
Old: crisis is the end. → New: crisis signals the old model no longer fits.

🌱 當你開始這樣練｜When You Begin to Practice
你會發現，同一件事，不再只有一種痛法。
你會發現，等待變得可以忍受，因為空白不再被恐懼填滿。
你會發現，過去沒有改變，可是它的重量變了。
你會發現，你不只是故事裡的角色，你也是寫故事的人。
You'll find one event no longer has only one way to hurt.
You'll find waiting becomes bearable, because the blank isn't filled with fear.
You'll find the past hasn't changed, but its weight has.
You'll find you're not only a character in the story — you're also its author.

🤍 寫給今天的你｜A Note for You Today
也許那件事真的很痛，這不需要否認。
但請留一點空間，給還沒出現的解釋。
有些答案，要再等一下才會到。
在那之前，先對自己溫柔一點。
Maybe it truly hurt. No need to deny that.
But leave a little room for the explanation that hasn't arrived.
Some answers take a bit longer to come.
Until then, be a little gentler with yourself.

✨ 金句｜Lines to Keep
★第一個故事，不必成為最後的真相。｜The first story doesn't have to be the final truth.
★不要把故事，偷偷寫進事實。｜Don't quietly write your story into the facts.
★空白不是答案，不要急著用恐懼填滿。｜A blank is not an answer. Don't rush to fill it with fear.
★「我失敗了」和「我是失敗者」，差了一整個人生。｜"I failed" and "I am a failure" are a whole life apart.
★不能改寫過去，但可以重新理解過去。｜You can't rewrite the past, but you can understand it anew.
★完整的人生，不需要每一頁都是快樂。｜A whole life doesn't need every page to be happy.

👉 今日一小步｜One Small Step
選一件讓你不舒服的事，寫下「事實」一行，再寫出三種可能的解釋。
Pick one thing that bothered you. Write one line of fact, then three possible explanations.

05｜Identity｜身分｜那張名字牌，你戴太久了｜You've worn that name tag too long
💔 痛點｜The Pain
因為是老師，所以不能說「我不知道」。
因為是媽媽，所以不能說「我好累」。
因為是強者，所以不能哭。
因為是好人，所以不能拒絕。
你把角色演得很好，好到忘了角色下面還有一個人。
Because you're the teacher, you can't say "I don't know."
Because you're the mother, you can't say "I'm exhausted."
Because you're the strong one, you can't cry.
Because you're the nice one, you can't say no.
You play the role so well that you forgot there's a person underneath.

🔄 更新｜The Update
身分給你穩定，但不該變成監獄。
角色是衣服，不是皮膚。
老師，可以是示範如何發現錯誤並更新的人。
父母，可以是和孩子一起探索的人。
強者，可以是敢承認脆弱的人。
Identity gives you stability, but it shouldn't become a prison.
A role is clothing, not skin.
A teacher can be someone who shows how to find a mistake and update.
A parent can be someone who explores alongside the child.
The strong one can be the one brave enough to admit weakness.

💪 能力｜The Skill
你會把角色和自己分開。
你會把行為和身分分開。
你會用一個小小的新行動，替自己長出新的身分。
You learn to separate the role from the self.
You learn to separate behavior from identity.
You learn to grow a new identity through one small new action.

🦉 智慧｜The Wisdom
改變不是背叛自己。
承認錯誤，不會摧毀自己。
真正穩定的身分，容得下更新。
Changing is not betraying yourself.
Admitting a mistake will not destroy you.
A truly stable identity has room for updates.

🌊 從舊到新｜From Old to New
舊：我是專家，不能改口。→ 新：專業本來就包含更新。
Old: I'm the expert; I can't change my answer. → New: expertise includes updating.
舊：我是受害者。→ 新：我曾受傷，但仍然保有選擇。
Old: I am a victim. → New: I was hurt, and I still have choices.
舊：我是焦慮的人。→ 新：我的系統目前容易產生焦慮。
Old: I'm an anxious person. → New: my system currently produces anxiety easily.
舊：我要保持人設。→ 新：我要保持真實，並且可以更新。
Old: I must keep up my image. → New: I'll stay real, and stay updatable.
舊：身分決定行動。→ 新：行動也會回頭重塑身分。
Old: identity decides action. → New: action reshapes identity in return.

🌱 當你開始這樣練｜When You Begin to Practice
你會發現，說「我不知道」沒有那麼可怕。
你會發現，說「我錯了」沒有讓你消失。
你會發現，說「我需要幫忙」反而讓關係更近。
你會發現，脫下角色之後，你還在，而且更完整。
You'll find "I don't know" isn't so frightening.
You'll find "I was wrong" didn't make you vanish.
You'll find "I need help" brings people closer.
You'll find that with the role taken off, you're still here — and more whole.

🤍 寫給今天的你｜A Note for You Today
你撐了很久，演得很好，辛苦了。
今天可以把那張名字牌拿下來一下。
不是因為你不稱職，
而是因為你不只是那一張牌。
You've held on a long time and played the part well. That was hard.
Today you can take the name tag off for a while.
Not because you failed at the role,
but because you are more than that one tag.

✨ 金句｜Lines to Keep
★身分不是監獄，是可以更新的名字牌。｜Identity is not a prison. It's a name tag you can update.
★角色是衣服，不是皮膚。｜A role is clothing, not skin.
★比賽輸了，不等於你是輸家。｜Losing a game doesn't make you a loser.
★別人的評價是資料，不是身分證。｜Other people's opinions are data, not your ID card.
★你可以保留根，也可以長出新的枝。｜You can keep your roots and still grow new branches.
★我知道我是誰，也知道我還能改變。｜I know who I am, and I know I can still change.

👉 今日一小步｜One Small Step
寫下五個身分，找出最綁住你的那一個，把它的隱藏規則改寫成一句更自由的定義。
Write down five identities. Find the one that binds you most, and rewrite its hidden rule into a freer definition.

06｜Weight｜權重｜最大聲的，不一定最重要｜The loudest voice isn't the most important one
💔 痛點｜The Pain
十個人稱讚你，你記不得。
一個人批評你，你記三年。
道理你都懂，可是心還是被那一句話拖著走。
不是你不夠聰明，而是那句話在你心裡的音量，被調到了最大。
Ten people praise you, and you forget.
One person criticizes you, and you remember for three years.
You understand every principle, yet one sentence still drags your heart around.
It's not that you aren't smart enough. It's that one sentence has been turned up to maximum volume inside you.

🔄 更新｜The Update
真正支配人的，往往不是知道什麼，而是把什麼看得最重。
替每個聲音打分數。
問它：你的分數來自證據，還是來自情緒？
然後，親手把音量重新調一次。
What rules us is often not what we know, but what we weigh the most.
Give each voice a score.
Ask it: does your score come from evidence, or from emotion?
Then turn the dial again — with your own hand.

💪 能力｜The Skill
你會把情緒的強度和證據的強度分開。
你會把一次的事件和長期的趨勢分開。
你會把別人的眼光，從一百分調回它應得的分數。
You learn to separate the strength of a feeling from the strength of the evidence.
You learn to separate one event from a long-term trend.
You learn to turn other people's opinions down from a hundred to the score they deserve.

🦉 智慧｜The Wisdom
最痛的，不一定最重要。
最熟悉的，不一定最真。
最大聲的，不一定最有資訊。
權重放錯，比缺少資訊更危險。
The most painful is not always the most important.
The most familiar is not always the most true.
The loudest is not always the most informative.
A wrong weight is more dangerous than missing information.

🌊 從舊到新｜From Old to New
舊：一次失敗權重最大。→ 新：看長期的分布。
Old: one failure weighs the most. → New: look at the long-run distribution.
舊：熟悉就是可信。→ 新：熟悉感不等於真實。
Old: familiar means reliable. → New: familiarity is not truth.
舊：權威說的就算數。→ 新：權威和證據要分開看。
Old: authority settles it. → New: weigh authority and evidence separately.
舊：語氣確定就是可信。→ 新：證據的品質比語氣重要。
Old: a confident tone is credible. → New: evidence quality matters more than tone.
舊：權重是固定的。→ 新：權重本身就需要一直更新。
Old: weights are fixed. → New: weights themselves need constant updating.

🌱 當你開始這樣練｜When You Begin to Practice
你會發現，那句批評還在，但它變小聲了。
你會發現，那些稱讚還在，而且你終於聽得見了。
你會發現，害怕還在，但它不再自動替你做決定。
你會發現，真正重要的事，慢慢走到了前面。
You'll find the criticism is still there, only quieter.
You'll find the praise is still there, and you can finally hear it.
You'll find the fear remains, but it no longer decides for you automatically.
You'll find what truly matters slowly moving to the front.

🤍 寫給今天的你｜A Note for You Today
不用把那個刺耳的聲音趕出去。
你只要走到音響前面，把它轉小一點。
再把那個一直很小聲、卻一直在的聲音，轉大一點。
音量，一直都在你手上。
You don't have to throw the harsh voice out.
Just walk to the speaker and turn it down a little.
Then turn up the voice that has always been quiet, yet always there.
The volume has always been in your hands.

✨ 金句｜Lines to Keep
★不要讓最大聲的聲音，自動變成最重要的聲音。｜Don't let the loudest voice automatically become the most important one.
★感覺很強，不代表證據很強。｜A strong feeling is not strong evidence.
★警報很大聲，不代表火一定很大。｜A loud alarm doesn't mean a big fire.
★過去可以提醒你，但不必統治你。｜The past may remind you. It need not rule you.
★想要，不等於值得。｜Wanting is not the same as worth it.
★改變不是刪除過去，而是改變誰坐第一排。｜Change isn't deleting the past. It's changing who sits in the front row.

👉 今日一小步｜One Small Step
面對一個決定，列出影響你的因素，各打零到十分，檢查證據後再重新打一次。
Facing a decision, list what's influencing you, score each from zero to ten, check the evidence, then score again.

07｜Attention｜注意｜你一直盯著的地方，會變成你的全世界｜What you keep staring at becomes your whole world
💔 痛點｜The Pain
打開手機只想看一則訊息，回過神已經四十分鐘。
明明有九件順利的事，你只盯著那一件不順的。
你把最清醒的腦給了螢幕，把最疲累的腦留給夢想。
然後你說：我沒有時間，我沒有專注力，我沒有進步。
You open your phone for one message and look up forty minutes later.
Nine things went well, and you stare at the one that didn't.
You give your clearest mind to the screen, and your most tired mind to your dreams.
Then you say: I have no time, no focus, no progress.

🔄 更新｜The Update
注意力像一支手電筒，照到哪裡，哪裡就變成你的世界。
你不必永不分心，你只要更快回來。
看完問題，記得照一照資源。
看完威脅，記得照一照出口。
看完支持你的證據，記得照一照反證。
Attention is a flashlight. Wherever it shines becomes your world.
You don't have to never drift. You only have to come back faster.
After the problem, shine on the resources.
After the threat, shine on the exit.
After the evidence that supports you, shine on the evidence that doesn't.

💪 能力｜The Skill
你會知道手電筒現在照在哪裡。
你會把它從不重要的地方移開。
你會把最好的注意力，留給最重要的事。
You learn to know where your flashlight is pointing.
You learn to move it away from what doesn't matter.
You learn to save your best attention for what matters most.

🦉 智慧｜The Wisdom
看見什麼，會影響你相信什麼。
沒看見，不等於不存在。
注意力不是無限的，它就是你有限的生命。
What you see shapes what you believe.
Unseen does not mean nonexistent.
Attention is not unlimited. It is your limited life.

🌊 從舊到新｜From Old to New
舊：只看錯誤。→ 新：同時看做對的部分。
Old: see only mistakes. → New: also see what worked.
舊：只看缺少什麼。→ 新：同時盤點已經有什麼。
Old: see only what's missing. → New: also count what you already have.
舊：只看眼前。→ 新：把長期也放進來。
Old: see only the present. → New: bring the long term into view.
舊：只看誰錯。→ 新：看哪個模型錯了。
Old: look for who's wrong. → New: look for which model is wrong.
舊：看自己想看的。→ 新：看最可能推翻自己的地方。
Old: look at what I want to see. → New: look where I'm most likely to be proven wrong.

🌱 當你開始這樣練｜When You Begin to Practice
你會發現，同樣的一天，多了很多你以前沒看見的東西。
你會發現，問題旁邊，其實一直站著資源。
你會發現，分心沒有消失，但回來變快了。
你會發現，時間沒有變多，生命卻變得比較清楚。
You'll find the same day holds much you never noticed.
You'll find resources were standing beside the problem all along.
You'll find distraction hasn't vanished, but returning is faster.
You'll find time hasn't grown, yet life has become clearer.

🤍 寫給今天的你｜A Note for You Today
你今天又分心了嗎？沒關係。
分心不是失敗，回來就是練習。
輕輕地，把手電筒移回你在乎的地方。
一次，再一次，這就是專注。
Did you drift again today? That's fine.
Drifting isn't failure. Coming back is the practice.
Gently move the flashlight back to what you care about.
Once, and once more — that is focus.

✨ 金句｜Lines to Keep
★專注高手不是從不分心，而是更快把自己帶回來。｜Masters of focus aren't never distracted. They just return faster.
★不選擇注意什麼，就會由外界替你選。｜If you don't choose what to notice, the world will choose for you.
★大聲不等於重要。｜Loud is not the same as important.
★只找危險的人，很容易看漏出口。｜Those who look only for danger easily miss the exit.
★每一次把注意帶回來，都是在練習自由。｜Every time you bring your attention back, you are practicing freedom.
★管理注意，就是管理有限的生命。｜To manage attention is to manage a limited life.

👉 今日一小步｜One Small Step
設三次提醒，響的時候只問一句：「我的手電筒現在照在哪裡？值得嗎？」
Set three reminders. When each rings, ask only: "Where is my flashlight pointing right now? Is it worth it?"

08｜Evidence Selection｜證據選擇｜你不是在找真相，你是在找同意你的人｜You're not looking for truth — you're looking for agreement
💔 痛點｜The Pain
你先有了答案，才開始找資料。
朋友都這麼說，所以你覺得一定是真的。
看到支持自己的，你馬上收藏。
看到反對自己的，你馬上滑走。
你收集的證據愈來愈多，離真相卻愈來愈遠。
You had the answer first, and then went looking for data.
All your friends said so, so it must be true.
What supports you, you save at once.
What challenges you, you scroll past at once.
Your pile of evidence grows, and the truth moves farther away.

🔄 更新｜The Update
每天當一次偵探。
支持的線索找三個。
反對的線索也找三個。
再問一句：我還缺哪一塊資料？
最後問自己：看到什麼，我願意承認我錯了？
Be a detective once a day.
Find three clues that support you.
Find three clues that don't.
Then ask: what piece am I still missing?
And finally: what would I have to see to admit I was wrong?

💪 能力｜The Skill
你會分清楚故事、感覺和證據。
你會看來源，看樣本，看缺了什麼。
你會挑出那個最能分出勝負的線索。
You learn to tell story, feeling, and evidence apart.
You learn to check the source, the sample, and what's missing.
You learn to pick the one clue that can actually settle the question.

🦉 智慧｜The Wisdom
故事不等於證據。
多數不等於真相。
權威不等於免檢查。
證據的品質，比證據的數量重要。
A story is not evidence.
A majority is not truth.
Authority is not exempt from checking.
The quality of evidence matters more than the quantity.

🌊 從舊到新｜From Old to New
舊：一個案例就下結論。→ 新：多看幾個樣本。
Old: conclude from one case. → New: look at more samples.
舊：感覺就是證據。→ 新：感覺是內在的訊號。
Old: feeling is evidence. → New: feeling is an inner signal.
舊：看到相關就說是因果。→ 新：先不急著說誰造成誰。
Old: correlation is causation. → New: don't rush to say what caused what.
舊：資料愈多愈好。→ 新：能分出對錯的資料才重要。
Old: more data is better. → New: data that can tell models apart is what counts.
舊：證據用來證明我。→ 新：證據用來修正我。
Old: evidence is to prove me right. → New: evidence is to correct me.

🌱 當你開始這樣練｜When You Begin to Practice
你會發現，自己沒有以前那麼容易被一則貼文帶走。
你會發現，自己敢說「我還不確定」。
你會發現，被反駁的時候，心跳沒有那麼快了。
你會發現，承認錯的那一刻，其實比硬撐輕鬆。
You'll find a single post no longer sweeps you away so easily.
You'll find you dare to say, "I'm not sure yet."
You'll find your heart races less when you're challenged.
You'll find the moment of admitting error is lighter than holding on.

🤍 寫給今天的你｜A Note for You Today
你不必永遠是對的。
你只需要比昨天，更接近真實一點。
讓不舒服的證據坐下來，聽它說完。
它不是來打敗你的，它是來幫你的。
You don't need to always be right.
You only need to be a little closer to the truth than yesterday.
Let the uncomfortable evidence sit down, and hear it out.
It didn't come to defeat you. It came to help.

✨ 金句｜Lines to Keep
★好偵探不只找自己喜歡的線索。｜A good detective doesn't only look for the clues they like.
★沒有證據的地方，要勇敢留下「不知道」。｜Where there is no evidence, be brave enough to leave "I don't know."
★小樣本，最容易長出大故事。｜Small samples grow the biggest stories.
★最難發現的偏見，就是剛好支持自己的偏見。｜The hardest bias to notice is the one that happens to agree with you.
★結論的重量，不該超過證據能承受的重量。｜A conclusion should not weigh more than its evidence can bear.
★尊重證據，就是允許它改變你。｜To respect evidence is to let it change you.

👉 今日一小步｜One Small Step
選一個今天你很相信的想法，寫支持三條、反對三條，再寫下你目前的信心是百分之幾。
Pick one belief you feel sure about today. Write three supports, three counters, and your current confidence in percent.

09｜Representation｜表徵｜換一副眼鏡，世界就多一條路｜Change the glasses, and a new road appears
💔 痛點｜The Pain
考六十分，你看見的是「我很笨」。
孩子拖拖拉拉，你看見的是「他很懶」。
同事沒打招呼，你看見的是「他針對我」。
你以為自己看見了事實，其實你只是戴著第一副眼鏡。
而第一副眼鏡，往往只給你一條死路。
You scored sixty, and you saw "I'm stupid."
Your child dawdled, and you saw "he's lazy."
A colleague didn't say hello, and you saw "she's against me."
You think you saw the facts. You were only wearing the first pair of glasses.
And the first pair usually shows only a dead end.

🔄 更新｜The Update
同一件事，練習戴三副眼鏡。
人格眼鏡說：我很笨。
能力眼鏡說：有些能力還不夠。
結構眼鏡說：單字不足，速度太慢，時間分配錯了。
然後問：哪一副最符合證據？哪一副最能生出行動？
Practice wearing three pairs of glasses for the same event.
The personality glasses say: I'm stupid.
The ability glasses say: some skills aren't there yet.
The structure glasses say: too few words, too slow, time badly split.
Then ask: which pair fits the evidence best? Which one produces action?

💪 能力｜The Skill
你會把標籤改成行為。
你會把命運改成條件。
你會把絕對的話，改成有機率的話。
You learn to turn labels into behaviors.
You learn to turn fate into conditions.
You learn to turn absolute words into words with probability.

🦉 智慧｜The Wisdom
事件不等於解釋。
標籤會降低解析度。
多一種看法，往往就多一個行動。
An event is not its interpretation.
Labels lower the resolution.
One more way of seeing often means one more way of acting.

🌊 從舊到新｜From Old to New
舊：他不回，就是討厭我。→ 新：我只知道他還沒回。
Old: no reply means he hates me. → New: I only know he hasn't replied.
舊：拖延就是意志力差。→ 新：拆開獎賞、抗拒和不確定。
Old: procrastination is weak will. → New: unpack reward, aversion, and uncertainty.
舊：一次就是永遠。→ 新：狀態和特質分開。
Old: once means always. → New: separate state from trait.
舊：問題就是那個人。→ 新：問題在人和環境的互動裡。
Old: the person is the problem. → New: the problem lives between person and environment.
舊：我要找到唯一正解。→ 新：我要找到目前最能預測現實的看法。
Old: find the one right answer. → New: find the view that best predicts reality for now.

🌱 當你開始這樣練｜When You Begin to Practice
你會發現，罵人的話變少了，問問題的話變多了。
你會發現，孩子不是懶，是卡住了。
你會發現，自己不是笨，是某一個環節還沒練到。
你會發現，死路的旁邊，一直有一條小路。
You'll find fewer scolding words and more questions.
You'll find the child isn't lazy — just stuck.
You'll find you aren't stupid — one part simply hasn't been trained yet.
You'll find that beside the dead end, a small path was always there.

🤍 寫給今天的你｜A Note for You Today
下次心裡冒出一句很重的標籤時，
請先停三秒，問一句：還能怎麼看？
你不必馬上相信新的看法，
你只要先讓它有個位子坐。
Next time a heavy label rises in your mind,
pause three seconds and ask: how else could I see this?
You don't have to believe the new view right away.
Just give it a seat.

✨ 金句｜Lines to Keep
★自由，從第二副眼鏡開始。｜Freedom begins with the second pair of glasses.
★第一個解釋，只是版本一。｜The first explanation is only version one.
★模型多一個，命運感少一點。｜One more model, a little less fate.
★「我不好」沒有出口；「我上台會緊張」開始有出口。｜"I'm no good" has no exit. "I get nervous on stage" begins to have one.
★複雜不是亂，只是結構還沒被看見。｜Complexity is not chaos. The structure just hasn't been seen yet.
★不問哪個故事最好聽，要問哪個最接近現實。｜Don't ask which story sounds best. Ask which is closest to reality.

👉 今日一小步｜One Small Step
選一件事，寫出三種看法，圈出最能讓你採取行動的那一種。
Pick one event, write three ways of seeing it, and circle the one that best lets you act.

10｜Prediction｜預測｜你怕的那件事，其實還沒有發生｜The thing you fear hasn't happened yet
💔 痛點｜The Pain
還沒上台，你已經看見自己出糗。
還沒開口，你已經聽見對方拒絕。
還沒開始，你已經宣布自己失敗。
你不是活在今天，你是活在腦中那部還沒上映的災難片裡。
最可惜的是，你從來沒有回頭檢查：那部片，後來真的上映了嗎？
Before you walk on stage, you already see yourself embarrassed.
Before you speak, you already hear the no.
Before you begin, you already declare failure.
You're not living in today. You're living inside a disaster film that hasn't been released.
And the saddest part: you never go back to check whether it ever was.

🔄 更新｜The Update
把「我覺得」改成「我預測」。
把「一定」改成「大概幾成」。
加上期限，加上指標。
再加一句：出現什麼結果，就代表我猜錯了。
然後，讓現實來批改。
Change "I feel" into "I predict."
Change "definitely" into "about what percent."
Add a deadline. Add a measure.
Add one more line: what result would mean I was wrong?
Then let reality grade it.

💪 能力｜The Skill
你會把模糊的害怕，寫成清楚的預測。
你會把最壞的情況和最可能的情況分開。
你會記下自己猜過什麼，看見自己愈猜愈準。
You learn to write vague fear into a clear prediction.
You learn to separate the worst case from the most likely case.
You learn to record your guesses and watch them grow more accurate.

🦉 智慧｜The Wisdom
預測不是現實。
信心不等於準確。
最壞，不等於最可能。
猜錯本身，就是資訊。
A prediction is not reality.
Confidence is not accuracy.
The worst is not the most likely.
A wrong guess is itself information.

🌊 從舊到新｜From Old to New
舊：一定會失敗。→ 新：失敗的機率是多少？
Old: I'll surely fail. → New: what are the odds of failing?
舊：永遠不會變。→ 新：什麼條件改變，結果就會改變？
Old: it will never change. → New: which condition, if changed, changes the outcome?
舊：信心高就是準。→ 新：追蹤我的信心和結果合不合。
Old: high confidence means accurate. → New: track whether my confidence matches results.
舊：只記得猜對的。→ 新：把每一次預測都留下來。
Old: remember only the hits. → New: keep a record of every prediction.
舊：我要未卜先知。→ 新：我要愈猜愈準。
Old: I must foresee everything. → New: I'll become better calibrated.

🌱 當你開始這樣練｜When You Begin to Practice
你會發現，很多你怕的事，根本沒有發生。
你會發現，發生的那幾件，也沒有想像中可怕。
你會發現，自己從「我完了」變成「大概三成」。
你會發現，未來還是未知，但你不再被它嚇住。
You'll find most of what you feared never happened.
You'll find the few things that did were less terrible than imagined.
You'll find "I'm doomed" turning into "about thirty percent."
You'll find the future is still unknown, but it no longer freezes you.

🤍 寫給今天的你｜A Note for You Today
你腦中那部災難片，拍得很逼真。
但它還沒有上映，也不一定會上映。
今天先做好今天能做的那一小步。
其他的，讓明天的現實來回答。
The disaster film in your head is vividly made.
But it hasn't been released, and may never be.
Today, just take today's small step.
Let tomorrow's reality answer the rest.

✨ 金句｜Lines to Keep
★不要追求永遠猜對，追求愈猜愈準。｜Don't aim to always be right. Aim to be right more often.
★模糊的預測永遠不會錯，也永遠學不到東西。｜A vague prediction is never wrong — and never teaches anything.
★怕得很真，不代表發生機率很高。｜Fear feeling real doesn't make it likely.
★有備案的人，不需要假裝自己能預知未來。｜Those with a backup plan don't need to pretend they can see the future.
★學習，發生在「我猜的」和「真的」之間。｜Learning happens between "what I guessed" and "what was."
★願意被推翻，是模型真正變強的開始。｜Being willing to be proven wrong is where a model truly grows strong.

👉 今日一小步｜One Small Step
寫一句：「如果我做某件事，我預測某個結果，機率幾成，期限到哪一天。」明天回來對答案。
Write: "If I do X, I predict Y, with this percent chance, by this date." Come back tomorrow and check.

11｜Thought｜念頭｜念頭來敲門，不必交出鑰匙｜A thought can knock; it doesn't get the keys
💔 痛點｜The Pain
半夜兩點，腦中有個聲音說：「你完了。」
你信了。
它說：「沒有人喜歡你。」
你也信了。
你花很多力氣趕它走，它卻愈趕愈大聲。
你花很多力氣換一句正面的話，隔天舊的那一句又回來。
At two in the morning, a voice in your head says, "You're finished."
You believe it.
It says, "Nobody likes you."
You believe that too.
You spend so much strength pushing it away, and it only gets louder.
You spend so much strength replacing it with something positive, and the old line returns the next day.

🔄 更新｜The Update
念頭不是你，念頭不是真相，念頭只是系統此刻的一次輸出。
在它前面加一句：「我注意到，我現在出現一個念頭。」
不急著相信，不急著趕走。
先問：你的證據在哪裡？
再問：是哪個舊模型，一直把你生出來？
A thought is not you. A thought is not truth. It is one output of the system at this moment.
Put a line in front of it: "I notice I'm having the thought that…"
No rush to believe it. No rush to chase it away.
First ask: where is your evidence?
Then ask: which old model keeps producing you?

💪 能力｜The Skill
你會把念頭和自己分開。
你會把想到和做到分開。
你會順著念頭往下找，找到一直生出它的那個源頭。
You learn to separate the thought from the self.
You learn to separate thinking it from doing it.
You learn to trace a thought downward to the source that keeps generating it.

🦉 智慧｜The Wisdom
想到，不等於是真的。
強烈，不等於有證據。
重複出現，不等於很重要。
真正要更新的，往往不是那句話，而是生出那句話的系統。
Thinking it does not make it true.
Intensity is not evidence.
Repetition is not importance.
What needs updating is often not the sentence, but the system that produces it.

🌊 從舊到新｜From Old to New
舊：負面念頭要消滅。→ 新：先追蹤它從哪裡來。
Old: destroy negative thoughts. → New: first trace where they come from.
舊：想到就代表想做。→ 新：想到和做到是兩件事。
Old: thinking it means wanting it. → New: thinking and doing are two things.
舊：壞念頭代表我是壞人。→ 新：念頭不等於身分。
Old: a bad thought makes me bad. → New: a thought is not an identity.
舊：每個念頭都要處理。→ 新：依重要性決定理不理。
Old: every thought must be handled. → New: decide by weight whether to engage.
舊：轉念。→ 新：更新生出念頭的模型。
Old: flip the thought. → New: update the model that generates it.

🌱 當你開始這樣練｜When You Begin to Practice
你會發現，念頭還是會來，但你不再每一則都點開。
你會發現，半夜的那個聲音，沒有白天聽起來那麼可信。
你會發現，自己和念頭之間，多了一步的距離。
你會發現，那一步，就是自由。
You'll find thoughts still come, but you no longer open every one.
You'll find the voice at midnight sounds less credible by day.
You'll find one step of distance between you and the thought.
You'll find that one step is freedom.

🤍 寫給今天的你｜A Note for You Today
你不需要打贏腦中的每一句話。
你只需要記得，你是那個聽見它的人。
聽見了，點個頭，讓它過去。
天空不會因為一朵雲，就不是天空。
You don't need to win against every sentence in your head.
Just remember: you are the one who hears it.
Hear it, nod, and let it pass.
The sky does not stop being the sky because of one cloud.

✨ 金句｜Lines to Keep
★念頭可以敲門，不必讓它拿走房子的鑰匙。｜A thought may knock. It doesn't get the keys to the house.
★我有這個念頭，但我不是這個念頭。｜I have this thought, but I am not this thought.
★念頭可以很大聲，但最後的行動仍由你決定。｜A thought can be loud, but the action is still yours to choose.
★念頭是果實，生成它的系統才是樹根。｜The thought is the fruit. The system that grows it is the root.
★不要和念頭吵架，讓證據來說話。｜Don't argue with a thought. Let the evidence speak.
★自由不是只有好念頭，而是任何念頭都不能自動指揮你。｜Freedom isn't having only good thoughts. It's that no thought commands you automatically.

👉 今日一小步｜One Small Step
情緒突然升高時，寫下腦中閃過的那句話，前面加上「我現在出現一個念頭：」。
When emotion suddenly rises, write the sentence that flashed by, and put "I'm having the thought that" in front.

12｜Emotion｜情緒｜情緒是提醒燈，不是方向盤｜Emotion is a warning light, not the steering wheel
💔 痛點｜The Pain
你生氣的時候，說了最後悔的話。
你害怕的時候，放棄了最想要的事。
你難過的時候，告訴自己「不准哭」。
你不是被情緒淹沒，就是把情緒壓到底。
可是壓下去的沒有消失，它只是換一個時間、換一個人，再爆一次。
When you were angry, you said the words you regret most.
When you were afraid, you gave up what you wanted most.
When you were sad, you told yourself, "Don't cry."
You're either flooded by emotion or pressing it all the way down.
But what's pressed down doesn't disappear. It just erupts later, at someone else.

🔄 更新｜The Update
情緒不是命令，情緒是訊號。
焦慮在說：我預測有危險。
生氣在說：有條界線被碰到了。
悲傷在說：我失去了重要的東西。
嫉妒在說：原來我在乎這個。
先讀懂訊號，再由你決定怎麼做。
Emotion is not a command. Emotion is a signal.
Anxiety says: I predict danger.
Anger says: a boundary has been touched.
Sadness says: I lost something that mattered.
Envy says: so this is what I care about.
Read the signal first. Then you decide what to do.

💪 能力｜The Skill
你會把「不爽」拆成害怕、委屈、失望、羞愧。
你會替情緒打分數，知道現在是三分還是九分。
你會帶著情緒，仍然選擇自己的行動。
You learn to break "upset" into fear, hurt, disappointment, and shame.
You learn to score a feeling — is it a three or a nine?
You learn to carry the feeling and still choose your action.

🦉 智慧｜The Wisdom
我害怕，不等於真的危險。
我生氣，不等於我要傷人。
情緒是真的，但它描述的世界不一定準。
I'm afraid does not mean it's dangerous.
I'm angry does not mean I must hurt someone.
The feeling is real. The world it describes may not be accurate.

🌊 從舊到新｜From Old to New
舊：悲傷代表脆弱。→ 新：系統正在處理失去。
Old: sadness is weakness. → New: the system is processing a loss.
舊：羞愧代表我不好。→ 新：我的社會自我感到被威脅。
Old: shame means I'm bad. → New: my social self feels threatened.
舊：不舒服就該停止。→ 新：分辨是危險，還是成長的成本。
Old: discomfort means stop. → New: tell danger from the cost of growth.
舊：情緒要壓掉。→ 新：先辨認它帶來的訊號。
Old: suppress emotion. → New: first identify the signal it carries.
舊：自由是沒有負面情緒。→ 新：自由是情緒還在，我仍有選擇。
Old: freedom is no negative emotion. → New: freedom is having choices while the emotion remains.

🌱 當你開始這樣練｜When You Begin to Practice
你會發現，生氣的時候，話慢了一秒。
你會發現，害怕的時候，腳還是往前走了一步。
你會發現，難過的時候，你允許自己難過。
你會發現，情緒沒有變少，但後悔變少了。
You'll find that when angry, your words arrive one second later.
You'll find that when afraid, your feet still take one step forward.
You'll find that when sad, you allow yourself to be sad.
You'll find the feelings haven't lessened — but the regrets have.

🤍 寫給今天的你｜A Note for You Today
你的情緒不是麻煩，它是在替你說話。
它說：這個我在乎，這個我害怕，這個我捨不得。
先聽它說完，再輕輕把方向盤握回來。
你可以有感覺，也可以有選擇。
Your emotions aren't trouble. They are speaking for you.
They say: this I care about, this I fear, this I can't let go.
Hear them out, then gently take the wheel back.
You can have feelings, and you can have choices.

✨ 金句｜Lines to Keep
★情緒是提醒燈，不是方向盤。｜Emotion is a warning light, not the steering wheel.
★情緒是我正在經歷的天氣，不是我的名字。｜Emotion is the weather I'm passing through, not my name.
★生氣下面，可能還有害怕、受傷與失望。｜Beneath anger there may be fear, hurt, and disappointment.
★情緒可以坐車，但不要讓它搶方向盤。｜Emotion may ride along. Don't let it grab the wheel.
★你會難過，往往因為有東西對你很重要。｜You grieve because something mattered to you.
★最成熟的自由不是沒有感覺，而是帶著感覺仍能選擇。｜The most mature freedom isn't feeling nothing. It's choosing while feeling.

👉 今日一小步｜One Small Step
情緒來時問五句：什麼情緒？幾分？身體哪裡？它在預測什麼？它在保護什麼？
When a feeling comes, ask five things: which emotion, how strong, where in the body, what is it predicting, what is it protecting?

13｜Agency｜自主選擇｜「沒辦法」的後面，其實還有三條路｜Behind "I can't," there are still three roads
💔 痛點｜The Pain
「我沒辦法。」
「我只能這樣。」
「等環境好一點再說。」
「等我有動力再說。」
「等我不怕了再說。」
你等了很久。環境沒有變，動力沒有來，害怕也沒有走。
真正困住你的，不是那道牆，而是你以為只有一條路。
"I can't."
"This is all I can do."
"I'll wait until things get better."
"I'll wait until I feel motivated."
"I'll wait until I'm not afraid."
You've waited a long time. Things didn't change, motivation didn't come, and the fear didn't leave.
What traps you isn't the wall. It's believing there's only one road.

🔄 更新｜The Update
自由不是沒有限制，而是在限制裡仍然生得出選項。
先圈出不能控制的。
再圈出可以控制的。
再圈出可以影響的。
然後，強迫自己寫出三條路，選最小的那一步。
Freedom is not having no limits. It's still generating options inside them.
First, circle what you can't control.
Then, circle what you can.
Then, circle what you can influence.
Then force yourself to write three roads, and take the smallest step.

💪 能力｜The Skill
你會在「做」和「不做」之間，長出第三種選擇。
你會把大決定，縮成一個可以回頭的小實驗。
你會在原路不通的時候，轉彎，而不是放棄。
You learn to grow a third option between doing and not doing.
You learn to shrink a big decision into a small experiment you can undo.
You learn to turn when the road is blocked, instead of quitting.

🦉 智慧｜The Wisdom
不能控制全部，不等於什麼都不能控制。
帶著害怕，仍然可以行動。
選錯了，不等於永遠錯了。
Not controlling everything doesn't mean controlling nothing.
You can act while still afraid.
Choosing wrong does not mean being wrong forever.

🌊 從舊到新｜From Old to New
舊：刺激，然後反應。→ 新：刺激，停一下，選擇，再行動。
Old: stimulus, then reaction. → New: stimulus, pause, choose, then act.
舊：等有動力再做。→ 新：先設計一個最小的行動。
Old: wait for motivation. → New: design the smallest action first.
舊：做對才行動。→ 新：用可以回頭的小實驗探索。
Old: act only when sure. → New: explore with small, reversible experiments.
舊：靠忍耐。→ 新：把環境的阻力降低。
Old: rely on endurance. → New: lower the friction in the environment.
舊：自由是永遠選對。→ 新：自由是選錯之後還能重選。
Old: freedom is always choosing right. → New: freedom is choosing again after choosing wrong.

🌱 當你開始這樣練｜When You Begin to Practice
你會發現，「沒辦法」說得愈來愈少。
你會發現，「那我先試試看」說得愈來愈多。
你會發現，牆還在，但你找到了門。
你會發現，你不是變得更有自信，而是變得更會找路。
You'll find you say "I can't" less and less.
You'll find you say "let me try" more and more.
You'll find the wall is still there, but you found the door.
You'll find you haven't become more confident — you've become better at finding roads.

🤍 寫給今天的你｜A Note for You Today
有些事，你真的改變不了。
承認這一點，不是認輸。
在改變不了的事情旁邊，
永遠還有一件，是你今天可以做的。
Some things you truly cannot change.
Admitting that is not surrender.
Beside what cannot be changed,
there is always one thing you can do today.

✨ 金句｜Lines to Keep
★困住人的常常不是問題，而是只剩一個答案。｜What traps people is often not the problem, but having only one answer.
★第二個選項，就是自由開始長出來的地方。｜The second option is where freedom begins to grow.
★不能穿牆，就找門、找路、找工具。｜If you can't walk through the wall, find a door, a path, a tool.
★勇敢不是不怕，而是怕的時候仍然做重要的事。｜Courage isn't the absence of fear. It's doing what matters while afraid.
★轉彎不是失敗，是聽懂了回饋。｜Turning is not failing. It's understanding the feedback.
★世界可以否定我的預測，但拿不走我的下一步。｜The world may reject my prediction. It cannot take my next step.

👉 今日一小步｜One Small Step
抓一句今天的「我沒辦法」，在它下面寫出三個可以做的選項，圈出最小的那一個。
Catch one "I can't" today. Write three possible options beneath it, and circle the smallest.

14｜Action｜行動｜別再等準備好，先做五分鐘｜Stop waiting to be ready — do five minutes
💔 痛點｜The Pain
你買了書，沒有翻。
你報了課，沒有上。
你寫了完美的計畫，停在第一行。
你不是懶，你是把第一步設得太大，大到每次看見它都想逃。
於是你一直在腦中證明自己，卻從來沒有讓現實回答過你。
You bought the book and never opened it.
You signed up for the course and never attended.
You wrote the perfect plan and stopped at line one.
You're not lazy. You made the first step so big that you want to run each time you see it.
So you keep proving yourself in your head, and never let reality answer.

🔄 更新｜The Update
不要一次改人生，先做一個最小的實驗。
找到最卡的那一點。
設計一個五到二十分鐘的行動。
做之前，先猜結果。
做之後，記下真正發生了什麼。
Don't change your whole life at once. Run one smallest experiment.
Find the tightest bottleneck.
Design an action of five to twenty minutes.
Before you do it, guess the result.
After you do it, write what truly happened.

💪 能力｜The Skill
你會把大山切成一步一步。
你會改環境，而不是只靠意志力。
你會把每一次行動，都變成一次向現實取資料的實驗。
You learn to cut the mountain into single steps.
You learn to change the environment instead of leaning only on willpower.
You learn to turn every action into an experiment that collects data from reality.

🦉 智慧｜The Wisdom
行動不必等到完全確定。
努力很多，不等於槓桿很高。
失敗的行動，也可能帶回很有價值的資訊。
Action doesn't have to wait for certainty.
More effort is not more leverage.
Even a failed action can bring back valuable information.

🌊 從舊到新｜From Old to New
舊：想很多。→ 新：做一個可以驗證的行動。
Old: think a lot. → New: take one testable action.
舊：一次做到完美。→ 新：先做最小的一步。
Old: perfect in one go. → New: the smallest step first.
舊：失敗就停止。→ 新：修正之後再試一次。
Old: stop at failure. → New: adjust and try again.
舊：努力更多。→ 新：先找最關鍵的那一點。
Old: work harder. → New: find the key point first.
舊：忙就是前進。→ 新：看狀態有沒有真的改變。
Old: busy means progress. → New: check whether anything actually changed.

🌱 當你開始這樣練｜When You Begin to Practice
你會發現，開始沒有想像中難，難的是一直想。
你會發現，五分鐘常常變成二十分鐘。
你會發現，做錯了也有收穫，因為你知道哪裡不通。
你會發現，自信不是想出來的，是做出來的。
You'll find starting isn't as hard as imagined — overthinking is.
You'll find five minutes often becomes twenty.
You'll find even a wrong move pays, because now you know what doesn't work.

意料之外的結果，往往最有資訊。

💔 痛點｜The Pain
你最怕的一句話是：「你錯了。」

或者反過來，你把全部都怪在自己身上。
兩種方式，都讓你錯過同一件事：到底錯在哪一層？

So you explain, you argue, you find reasons, you blame others.

🔄 更新｜The Update

是我看錯了嗎？
是我解釋錯了嗎？
是我漏了一個因素嗎？
是我把小事看太重了嗎？
是方法用錯了地方、時間抓錯了，還是做法做錯了？
找到那一層，只修那一層。
An error is not shame. It's reality pointing to where the map is not accurate enough.
Did I see it wrong?
Did I interpret it wrong?
Did I miss a factor?
Did I weigh a small thing too heavily?
Was the method in the wrong place, the timing off, or the execution flawed?
Find that layer. Fix only that layer.

💪 能力｜The Skill

You learn to tell a wrong direction from a wrong execution.

🦉 智慧｜The Wisdom

一個地方錯，不等於全部都錯。
智慧不是不犯錯，而是更快發現、更快修正。
Guessing wrong does not mean stupid.
A wrong result doesn't always mean a wrong idea.
One part wrong does not mean all wrong.
Wisdom is not never erring. It's noticing and correcting faster.
