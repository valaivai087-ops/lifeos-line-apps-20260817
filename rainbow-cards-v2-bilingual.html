<!doctype html>
<html lang="zh-Hant">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>彩虹卡 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root{
  --bg:#F2F2F6; --surface:#FFFFFF; --soft:#E9E8F0; --ink:#1B1A22; --muted:#625F76; --line:#DCDAE5;
  --red:#D1433A; --orange:#E27C2A; --yellow:#E6B527; --green:#37905A; --blue:#2C77C4; --indigo:#4649A8; --violet:#8243B0;
  --on-dark:#1B1A22; --on-light:#FFFFFF;
  --serif:"Noto Serif TC","Songti TC",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --latin:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121117; --surface:#1B1A22; --soft:#24232D; --ink:#ECEAF3; --muted:#9C99AF; --line:#2E2C39;
    --red:#E45A50; --orange:#EE9243; --yellow:#EEC445; --green:#4DAA6C; --blue:#4A92DE; --indigo:#7276D8; --violet:#A468D0;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121117; --surface:#1B1A22; --soft:#24232D; --ink:#ECEAF3; --muted:#9C99AF; --line:#2E2C39;
  --red:#E45A50; --orange:#EE9243; --yellow:#EEC445; --green:#4DAA6C; --blue:#4A92DE; --indigo:#7276D8; --violet:#A468D0;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:1120px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* bilingual text */
.zh{display:block}
.en{display:block;font-family:var(--latin);color:var(--muted);font-size:.94em;line-height:1.45;margin-top:.15em}
.en1{display:block;font-family:var(--latin)}
.ui-en{font-family:var(--latin);color:var(--muted);font-size:.9em}
.inline .zh,.inline .en,.inline .en1{display:inline}
.inline .en{margin-left:.4em;margin-top:0}

/* header */
.spectrum{display:flex;height:8px;margin-inline:-16px}
.spectrum span{flex:1}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:28px 18px}
.brand h1{font-family:var(--serif);font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0;letter-spacing:.02em}
.brand h1 .en1,.brand h1 .en{font-family:var(--latin);font-weight:600;letter-spacing:0}
.brand h1 .en{font-size:.55em;color:var(--muted);margin-top:.3em}
.brand p{margin:6px 0 0;color:var(--muted);font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:28px;scrollbar-width:none}
nav.tabs button{flex:none;border:0;background:none;padding:12px 14px 11px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);font-size:14px;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}

.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:8px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg-lb{display:inline-flex;align-items:center;padding:0 6px 0 8px;color:var(--muted)}
.say{border:0;background:transparent;color:inherit;opacity:.6;cursor:pointer;padding:2px 3px;border-radius:4px;vertical-align:-2px;line-height:0}
.say:hover,.say.on{opacity:1;background:color-mix(in srgb,currentColor 12%,transparent)}
.say.on{color:var(--blue)}
.face-head .say.on{color:inherit}
.read-all{display:inline-flex;align-items:center;gap:6px;margin-top:12px;border:1px solid color-mix(in srgb,var(--on) 45%,transparent);background:transparent;color:var(--on);border-radius:999px;padding:4px 12px 4px 10px;font-size:12.5px;cursor:pointer}
.read-all .ui-en{color:inherit;opacity:.8}
.read-all:hover,.read-all.on{background:color-mix(in srgb,var(--on) 16%,transparent)}
.btn.primary .ui-en,nav.tabs .ui-en,.seg .ui-en,.chip[aria-pressed="true"] .ui-en{color:inherit;opacity:.75}
.label{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h2.sec{font-family:var(--serif);font-size:22px;margin:0 0 4px;text-wrap:balance}
h2.sec .en,h2.sec .en1{font-family:var(--latin);font-weight:600}
.lede{color:var(--muted);margin:0 0 22px;max-width:65ch}

/* card face */
.face{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.face-head{background:var(--c);color:var(--on);padding:18px 22px 22px}
.face-head .meta{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;opacity:.92}
.face-head .meta .en,.face-head .meta .ui-en{color:inherit;opacity:.85}
.face-title{font-family:var(--serif);font-size:clamp(21px,3vw,26px);line-height:1.4;margin:14px 0 0;text-wrap:balance}
.face-title .en,.face-title .en1{font-family:var(--latin);font-weight:400;color:inherit;opacity:.88;font-size:.8em;margin-top:.35em;font-style:italic}
.face-title .en1{font-style:normal;font-weight:600;opacity:1;font-size:1em}
.face-body{padding:18px 22px 22px}
.bignum{font-family:var(--mono);font-size:44px;line-height:1;font-weight:500;letter-spacing:-.02em}

.steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
.steps li{position:relative;padding:0 0 16px 22px}
.steps li::before{content:"";position:absolute;left:4px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--c)}
.steps li::after{content:"";position:absolute;left:8px;top:20px;bottom:2px;width:1px;background:var(--line)}
.steps li:last-child{padding-bottom:0}
.steps li:last-child::after{display:none}
.steps li.key::before{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}
.steps .lb{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.steps p{margin:2px 0 0}
.steps li.key p .zh{font-weight:500}
.layer-box{background:var(--soft);border-radius:10px;padding:12px 14px;margin-bottom:18px}
.layer-box p{margin:2px 0 0}
.sub-h{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted);margin:0 0 12px;text-transform:uppercase}

/* draw view */
.draw-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px;align-items:start}
.draw-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.usage{color:var(--muted);font-size:13.5px;margin:14px 2px 0;max-width:60ch}
.deal{animation:deal .45s cubic-bezier(.2,.8,.2,1)}
@keyframes deal{from{transform:perspective(900px) rotateY(-70deg) translateY(8px);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.deal{animation:none}}
.qs{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:14px;counter-reset:q}
.qs li{counter-increment:q}
.qs label{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}
.qs label::before{content:counter(q);font-family:var(--mono);font-size:12px;color:var(--bg);background:var(--ink);border-radius:50%;width:20px;height:20px;flex:none;display:inline-flex;align-items:center;justify-content:center;transform:translateY(-1px)}
.qs textarea{width:100%;min-height:54px;resize:vertical;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px}
.note{color:var(--muted);font-size:12.5px;margin-top:12px}

/* cards view */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 8px;cursor:pointer;font-size:13px}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--c,var(--ink))}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip small{font-family:var(--mono);font-size:11px;opacity:.7}
input[type=search]{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;width:260px;max-width:100%}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);margin:6px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--c);transform:translateY(-1px)}
.t-head{display:flex;align-items:center;gap:10px}
.sw{background:var(--c);color:var(--on);font-family:var(--mono);font-size:13px;font-weight:500;min-width:38px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.t-kind{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.05em}
.t-title{font-family:var(--serif);font-weight:600;font-size:15.5px;line-height:1.5}
.t-title .en,.t-title .en1{font-family:var(--latin);font-weight:400}
.t-title .en1{font-size:16px}
.empty{color:var(--muted);padding:40px 0;text-align:center}

/* os view */
.os{display:grid;gap:12px}
.os-row{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px 14px 14px}
.os-block{background:var(--c);color:var(--on);border-radius:10px;height:92px;display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px}
.os-block b{font-family:var(--serif);font-size:30px;line-height:1}
.os-block span{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em}
.os-stmt{font-family:var(--serif);font-size:19px;font-weight:600;margin:0}
.os-stmt .en,.os-stmt .en1{font-family:var(--latin);font-weight:400}
.os-themes{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.os-themes .en{font-size:1em}

/* algo */
.formula{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:36px}
.node{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;line-height:1.35}
.node .en{font-size:.88em}
.arrow{color:var(--muted);font-family:var(--mono)}
.loop{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.loop li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:baseline;position:relative}
.loop li::before{content:counter(s,decimal-leading-zero);font-family:var(--mono);font-size:11px;color:var(--muted)}
.loop li.hot{border-color:var(--ink)}
.loop li.tail{background:var(--soft)}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin:14px 0 0;color:var(--muted);font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;border:1px solid var(--line);background:var(--surface)}
.legend i.hot{border-color:var(--ink)}
.legend i.tail{background:var(--soft)}

/* definition */
.def{max-width:760px}
.nots{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
.nots li{color:var(--muted);padding-left:20px;position:relative}
.nots li::before{content:"✕";position:absolute;left:0;font-size:12px;top:3px}
.thesis{font-family:var(--serif);font-size:clamp(20px,3vw,26px);font-weight:700;line-height:1.45;margin:0 0 30px;text-wrap:balance}
.thesis .en,.thesis .en1{font-family:var(--latin);font-weight:400;font-style:italic}
.thesis .en1{font-style:normal;font-weight:600}
.eqs{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:0;border-top:1px solid var(--line);margin-bottom:34px}
.eqs>div{padding:10px 14px 10px 0;border-bottom:1px solid var(--line)}
.eqs .k{font-family:var(--serif);font-weight:600;padding-right:22px}
.eqs .k .en,.eqs .k .en1{font-family:var(--latin)}
.rainbow-h{font-family:var(--serif);font-size:20px;margin:0 0 14px}
.rainbow-h .en,.rainbow-h .en1{font-family:var(--latin);font-weight:400}
.layers{list-style:none;padding:0;margin:0 0 34px;display:grid;gap:8px}
.layers li{display:flex;gap:12px;align-items:flex-start}
.layers i{flex:none;width:14px;height:14px;border-radius:4px;background:var(--c);margin-top:5px}
.goal{border-left:3px solid var(--ink);padding:4px 0 4px 18px;display:grid;gap:8px}
.goal p{margin:0}
.goal p:first-child .zh{font-weight:700}
.intro-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:34px}

/* dialog */
dialog{border:0;padding:0;background:transparent;width:min(640px,calc(100% - 24px));max-height:calc(100% - 24px);color:var(--ink)}
dialog::backdrop{background:rgba(12,11,18,.55)}
.dlg-nav{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
.dlg-nav .btn{background:var(--surface)}

@media (max-width:820px){
  .draw-grid{grid-template-columns:1fr}
  .os-row{grid-template-columns:84px minmax(0,1fr)}
  .os-row .btn{grid-column:1 / -1;justify-self:start}
  .os-block{height:84px}
}
@media (max-width:480px){
  .eqs{grid-template-columns:1fr}
  .eqs .k{border-bottom:0;padding-bottom:0}
  input[type=search]{width:100%}
}
</style>
</head>
<body>

<div class="spectrum" aria-hidden="true">
  <span style="background:var(--red)"></span><span style="background:var(--orange)"></span><span style="background:var(--yellow)"></span><span style="background:var(--green)"></span><span style="background:var(--blue)"></span><span style="background:var(--indigo)"></span><span style="background:var(--violet)"></span>
</div>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1 id="brandTitle"></h1><p id="brandSub"></p></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Language">
        <button data-lang="zh" id="lang-zh">中文</button>
        <button data-lang="en" id="lang-en">English</button>
        <button data-lang="both" id="lang-both">中英對照</button>
      </div>
      <div class="seg" role="group" aria-label="English speech speed" id="rateSeg">
        <span class="seg-lb" aria-hidden="true"></span>
        <button data-rate="0.7" id="rate-slow">慢 Slow</button>
        <button data-rate="0.9" id="rate-normal">正常 Normal</button>
        <button data-rate="1.1" id="rate-fast">快 Fast</button>
      </div>
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main>
    <section id="view-draw" hidden></section>
    <section id="view-cards" hidden></section>
    <section id="view-os" hidden></section>
    <section id="view-algo" hidden></section>
    <section id="view-def" hidden></section>
  </main>
</div>

"It's enabling students to one day surpass the teacher's Model.","AI isn't Truth either.","AI is a high-speed Model Generator.","I use AI to generate Hypotheses; I don't treat AI Output as Reality.","AI's most important value is expanding the Search Space.",
"In the end, Reality Feedback is still needed.","Wisdom isn't knowing everything.","Wisdom is knowing when your own Model might fail.","Maturity isn't having no uncertainty.","Maturity is being able to keep moving forward with uncertainty.",
"Control is not freedom.","Having choices is closer to freedom.","Freedom = not being held hostage by old Models.","Growth = continually improving Prediction Accuracy.","Learning = Reality rewriting the Model.",
"Capability = a Model that can reliably produce effective Action.","Wisdom = still finding high-leverage structures across different contexts.","Pain sometimes comes from Reality, and sometimes from a long-standing mismatch between Model and Reality.","So I don't rush to eliminate every discomfort.","I first ask: what is this Prediction Error trying to tell me?",
"A new Difference comes in, and the old structure comes under pressure.","Pressure creates Prediction Error.","Prediction Error drives Model Update.","Model Update creates New Capability.","I don't aim to be someone who is always right; I aim to be someone who can always update."
];

/* ---------- parse the Chinese source ---------- */
const COLORS = [
  {k:'red',zh:'紅',on:'var(--on-light)'},{k:'orange',zh:'橙',on:'var(--on-dark)'},{k:'yellow',zh:'黃',on:'var(--on-dark)'},
  {k:'green',zh:'綠',on:'var(--on-light)'},{k:'blue',zh:'藍',on:'var(--on-light)'},{k:'indigo',zh:'靛',on:'var(--on-light)'},{k:'violet',zh:'紫',on:'var(--on-light)'}
];
const parts = RAW.split(/━+/).map(s=>s.trim()).filter(Boolean);
const INTRO = (()=>{ const m = parts[0].match(/^【(.*?)】核心公式＝(.*?)使用方式＝(.*)$/s);
  return {title:m[1], formula:m[2].split(/\s*→\s*/), usage:m[3]}; })();
const SECT = [], CARDS = {};
for(let i=1;i<=7;i++){
  const sec = parts[i];
  const hm = sec.match(/^【(.)色｜(.*?)｜(\d+)[–-](\d+)】/);
  let body = sec.slice(hm[0].length), uni = null;
  const ui = body.indexOf('【');
  if(ui>=0){
    const um = body.slice(ui).match(/】舊Model＝(.*?)Prediction Error＝(.*?)Correct Action＝(.*?)Model Update＝(.*?)New Capability＝(.*?)New Wisdom＝(.*)$/s);
    uni = um.slice(1,7); body = body.slice(0,ui);
  }
  const ci = i-1;
  SECT.push({ci, themes:hm[2], from:+hm[3], to:+hm[4], uni, uniEn:EN.unified[ci]||null});
  body.split(/(?=(?<!\d)\d{2,3}｜)/).filter(s=>s.trim()).forEach(c=>{
    const m = c.trim().match(/^(\d+)｜(.*?)(?:舊Model＝(.*?)Prediction Error＝(.*?)Correct Action＝(.*?)Model Update＝(.*?)能力＝(.*?)智慧＝(.*))?$/s);
    const n = +m[1];
    const full = m[3]!==undefined;
    const en = n<=105 ? EN_FULL[n-1] : [EN_SHORT[n-106]];
    CARDS[n] = {n, ci, zh:{title:m[2], f: full? m.slice(3,9):null}, en:{title:en[0], f: full? en.slice(1):null}};
  });
}
const strip = s=>s.replace(/^【(.*?)】/,'');
const hdr = s=>(s.match(/^【(.*?)】/)||[])[1]||'';
const OS = [...strip(parts[8]).matchAll(/(.)｜([A-Z]+)｜(.*?。)/g)].map((m,i)=>({c:m[1],layer:m[2],zh:m[3],en:EN.os[i]}));
const OS_TITLE = hdr(parts[8]);
const ALGO = strip(parts[9]).split('→').map(s=>s.trim());
const ALGO_TITLE = hdr(parts[9]);
const QS = strip(parts[10]).split(/[①②③④⑤⑥⑦]/).map(s=>s.trim()).filter(Boolean);
const Q_TITLE = hdr(parts[10]);
const FINAL = strip(parts[11]).split('。').map(s=>s.trim()).filter(Boolean).map(s=>s+'。');
const FINAL_TITLE = hdr(parts[11]);
const TOTAL = Object.keys(CARDS).length;
if(TOTAL!==245||EN_FULL.length!==105||EN_SHORT.length!==140||FINAL.length!==EN.final.length||ALGO.length!==EN.algo.length) console.warn('data mismatch',TOTAL,EN_FULL.length,EN_SHORT.length,FINAL.length,ALGO.length);

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let LANG = store.get('rc-lang') || 'both';
let RATE = [0.7,0.9,1.1].includes(store.get('rc-rate')) ? store.get('rc-rate') : 0.9;
const CAN_SPEAK = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
const SPK = '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 8.5a5 5 0 0 1 0 7M18.8 6a8.5 8.5 0 0 1 0 12"/></svg>';
const sayBtn = en => CAN_SPEAK ? ` <button class="say" data-say="${esc(en)}" aria-label="Play English" title="Play English">${SPK}</button>` : '';
function T(zh,en,say=true){
  const sb = say ? sayBtn(en) : '';
  if(LANG==='zh') return `<span class="zh">${esc(zh)}</span>`;
  if(LANG==='en') return `<span class="en1">${esc(en)}${sb}</span>`;
  if(zh===en) return `<span class="zh">${esc(zh)}${sb}</span>`;
  return `<span class="zh">${esc(zh)}</span><span class="en">${esc(en)}${sb}</span>`;
}
function U(zh,en){
  if(LANG==='zh'||zh===en) return esc(zh);
  if(LANG==='en') return esc(en);
  return `${esc(zh)} <span class="ui-en">${esc(en)}</span>`;
}
const pad = n=>String(n).padStart(2,'0');
const colStyle = ci=>`--c:var(--${COLORS[ci].k});--on:${COLORS[ci].on}`;
const FIELD = [['舊Model','Old Model'],['Prediction Error','Prediction Error'],['Correct Action','Correct Action'],['Model Update','Model Update'],['能力','Capability'],['智慧','Wisdom']];
const UFIELD = [['舊Model','Old Model'],['Prediction Error','Prediction Error'],['Correct Action','Correct Action'],['Model Update','Model Update'],['New Capability','New Capability'],['New Wisdom','New Wisdom']];
const today = ()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
function dayCard(){ let h=0; for(const ch of today()) h=(h*31+ch.charCodeAt(0))>>>0; return (h%245)+1; }

function steps(labels, zh, en){
  return `<ol class="steps">${labels.map((lb,i)=>`<li class="${i===3?'key':''}"><span class="lb">${U(lb[0],lb[1])}</span><p>${T(zh[i],en[i])}</p></li>`).join('')}</ol>`;
}
function cardFace(n){
  const c = CARDS[n], s = SECT[c.ci], os = OS[c.ci];
  let body;
  if(c.zh.f) body = steps(FIELD, c.zh.f, c.en.f);
  else {
    body = `<div class="layer-box"><span class="label">${U('所屬層級','Layer')} · ${esc(os.layer)}</span><p>${T(os.zh,os.en)}</p></div>`;
    if(s.uni) body += `<p class="sub-h">${U(COLORS[c.ci].zh+'色統一 Model Update',EN.colors[c.ci]+' · shared Model Update')}</p>`+steps(UFIELD, s.uni, s.uniEn);
  }
  const readBtn = CAN_SPEAK ? `<button class="read-all" data-card="${n}">${SPK}<span>${U('朗讀整張英文','Read card aloud')}</span></button>` : '';
  return `<div class="face-head">
      <div class="meta"><span>No. ${pad(n)}</span><span>${U(COLORS[c.ci].zh+'色',EN.colors[c.ci])} · ${esc(os.layer)}</span></div>
      ${readBtn}
      <h3 class="face-title">${T(c.zh.title,c.en.title)}</h3>
    </div>
    <div class="face-body">${body}</div>`;
}

/* ---------- views ---------- */
const VIEWS = [
  ['draw','今日抽卡','Daily Draw'],['cards','全部卡片','All Cards'],['os','七層生命OS','Seven-Layer OS'],['algo','底層演算法','Core Algorithm'],['def','最終定義','Definition']
];
const state = { view:'draw', filter:-1, q:'', draw:null };
(function initDraw(){ const saved = store.get('rc-draw'); state.draw = (saved && saved.d===today() && CARDS[saved.n]) ? saved.n : dayCard(); })();

function renderChrome(){
  document.documentElement.lang = LANG==='en'?'en':'zh-Hant';
  $('#brandTitle').innerHTML = T('彩虹卡 2.0','Rainbow Cards 2.0',false);
  const sub = INTRO.title.split('｜')[1]||INTRO.title;
  $('#brandSub').innerHTML = `<span class="inline">${T(sub, EN.intro.title.split('| ')[1],false)}</span>`;
  document.querySelectorAll('.seg button[data-lang]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.lang===LANG));
  document.querySelectorAll('.seg button[data-rate]').forEach(b=>b.setAttribute('aria-pressed', +b.dataset.rate===RATE));
  $('#tabs').innerHTML = VIEWS.map(([k,z,e])=>`<button data-view="${k}" ${state.view===k?'aria-current="page"':''}>${U(z,e)}</button>`).join('');
}

function renderDraw(animate){
  const n = state.draw, c = CARDS[n];
  const key = `rc-j-${today()}-${n}`, ans = store.get(key) || [];
  $('#view-draw').innerHTML = `
  <div class="draw-grid">
    <div>
      <div class="draw-actions">
        <button class="btn primary" id="btnDraw">${U('抽一張','Draw a card')}</button>
        <button class="btn" id="btnToday">${U('今日卡','Today’s card')}</button>
        <button class="btn" id="btnOpen">${U('在卡庫中開啟','Open in deck')}</button>
      </div>
      <article class="face ${animate?'deal':''}" style="${colStyle(c.ci)}">${cardFace(n)}</article>
      <p class="usage"><span class="label">${U('使用方式','How to use')}</span><br>${T(INTRO.usage, EN.intro.usage)}</p>
    </div>
    <div>
      <h2 class="sec">${T(Q_TITLE, EN.qTitle)}</h2>
      <p class="lede" style="margin-bottom:0">${U('用這張卡測試今天正在運作的Model。','Use this card to test the Model running in you today.')}</p>
      <ol class="qs">${QS.map((q,i)=>`<li><label for="q${i}"><span>${T(q,EN.qs[i])}</span></label><textarea id="q${i}" data-i="${i}" rows="2">${esc(ans[i]||'')}</textarea></li>`).join('')}</ol>
      <p class="note">${U('筆記只儲存在這個瀏覽器裡，依日期與卡號分開保存。','Notes are saved only in this browser, kept separately for each date and card.')}</p>
    </div>
  </div>`;
  $('#btnDraw').onclick = ()=>{ let r; do{ r = 1+Math.floor(Math.random()*245);}while(r===state.draw); setDraw(r); };
  $('#btnToday').onclick = ()=>setDraw(dayCard());
  $('#btnOpen').onclick = ()=>openCard(n);
  document.querySelectorAll('.qs textarea').forEach(t=>t.addEventListener('input',()=>{
    const a = store.get(key)||[]; a[+t.dataset.i]=t.value; store.set(key,a);
  }));
}
function setDraw(n){ stopSpeech(); state.draw=n; store.set('rc-draw',{d:today(),n}); renderDraw(true); }

function renderCards(){
  const chip = (ci,label,range)=>`<button class="chip" data-f="${ci}" aria-pressed="${state.filter===ci}" style="${ci>=0?colStyle(ci):''}">${ci>=0?'<i></i>':''}${label}${range?` <small>${range}</small>`:''}</button>`;
  $('#view-cards').innerHTML = `
    <h2 class="sec">${U('245 張卡','All 245 cards')}</h2>
    <p class="lede">${U('依顏色篩選，或搜尋中英文關鍵字。點卡片看完整內容。','Filter by color or search in Chinese or English. Tap a card to see everything on it.')}</p>
    <div class="toolbar">
      <div class="chips">${chip(-1,U('全部','All'))}${SECT.map(s=>chip(s.ci,U(COLORS[s.ci].zh,EN.colors[s.ci]),`${pad(s.from)}–${s.to}`)).join('')}</div>
      <input type="search" id="q" value="${esc(state.q)}" placeholder="${LANG==='en'?'Search cards':LANG==='zh'?'搜尋卡片':'搜尋卡片 / Search'}" aria-label="Search cards">
    </div>
    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>`;
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{state.filter=+b.dataset.f; renderCards();});
  $('#q').addEventListener('input',e=>{state.q=e.target.value; renderGrid();});
  renderGrid();
}
function matches(c,q){
  if(!q) return true;
  const hay = [c.n, c.zh.title, c.en.title, ...(c.zh.f||[]), ...(c.en.f||[])].join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}
function renderGrid(){
  const list = Object.values(CARDS).filter(c=>(state.filter<0||c.ci===state.filter) && matches(c,state.q.trim()));
  $('#count').textContent = LANG==='en' ? `${list.length} cards` : LANG==='zh' ? `共 ${list.length} 張` : `共 ${list.length} 張 · ${list.length} cards`;
  $('#grid').innerHTML = list.length ? list.map(c=>`<button class="tile" data-n="${c.n}" style="${colStyle(c.ci)}">
      <span class="t-head"><span class="sw">${pad(c.n)}</span><span class="t-kind">${c.zh.f?U('完整卡 · 6 步','Full card · 6 steps'):U('單句卡','Statement')}</span></span>
      <span class="t-title">${T(c.zh.title,c.en.title,false)}</span></button>`).join('')
    : `<p class="empty">${U('沒有符合的卡片，試試其他關鍵字。','No cards match. Try another word.')}</p>`;
  document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>openCard(+t.dataset.n));
}

function renderOS(){
  $('#view-os').innerHTML = `
    <h2 class="sec">${T(OS_TITLE, EN.osTitle)}</h2>
    <p class="lede">${U('七種顏色是七層更新能力。','The seven colors are seven layers of the ability to update.')}</p>
    <div class="os">${OS.map((o,i)=>{ const s=SECT[i]; return `<div class="os-row" style="${colStyle(i)}">
      <div class="os-block"><b>${esc(o.c)}</b><span>${esc(o.layer)}</span></div>
      <div><p class="os-stmt">${T(o.zh,o.en)}</p><div class="os-themes">${T(s.themes,EN.themes[i])}</div><span class="label">${pad(s.from)}–${s.to} · ${s.to-s.from+1} ${U('張','cards')}</span></div>
      <button class="btn" data-f="${i}">${U('看這層的卡','Browse cards')}</button></div>`;}).join('')}</div>`;
  document.querySelectorAll('#view-os .btn').forEach(b=>b.onclick=()=>{state.filter=+b.dataset.f; state.q=''; go('cards');});
}

function renderAlgo(){
  const zhF = INTRO.formula, enF = EN.intro.formula;
  const hot = new Set(['Prediction Error','Correct Action','Model Update','New Capability','New Wisdom']);
  $('#view-algo').innerHTML = `
    <h2 class="sec">${U('核心公式','Core formula')}</h2>
    <p class="lede">${U('每張卡都在走同一條路。','Every card walks the same path.')}</p>
    <div class="formula">${zhF.map((z,i)=>`${i?'<span class="arrow">→</span>':''}<span class="node">${T(z,enF[i])}</span>`).join('')}</div>
    <h2 class="sec">${T(ALGO_TITLE, EN.algoTitle)}</h2>
    <p class="lede">${U('從Reality出發，經過誤差與修正，最後通往更高的自由度。','Starting from Reality, passing through error and correction, and ending in greater freedom.')}</p>
    <ol class="loop">${ALGO.map((a,i)=>`<li class="${hot.has(a)?'hot':''} ${i>=17?'tail':''}"><span>${T(a,EN.algo[i])}</span></li>`).join('')}</ol>
    <div class="legend"><span><i class="hot"></i>${U('核心公式中的步驟','Step in the core formula')}</span><span><i class="tail"></i>${U('最終收穫','What it adds up to')}</span></div>`;
}

function renderDef(){
  const F = FINAL, E = EN.final;
  const eq = (z,e)=>{ const [zk,...zv]=z.split('＝'); const [ek,...ev]=e.split(' = '); return `<div class="k">${T(zk,ek)}</div><div>${T(zv.join('＝'),ev.join(' = '))}</div>`; };
  $('#view-def').innerHTML = `<div class="def">
    <div class="intro-card">
      <span class="label">${U('原創智慧卡','Original wisdom cards')}</span>
      <p style="margin:6px 0 10px;font-family:var(--serif);font-weight:600;font-size:17px">${T(INTRO.title, EN.intro.title)}</p>
      <p style="margin:0">${T(INTRO.usage, EN.intro.usage)}</p>
    </div>
    <h2 class="sec" style="margin-bottom:14px">${T(FINAL_TITLE, EN.finalTitle)}</h2>
    <ul class="nots">${[0,1,2].map(i=>`<li>${T(F[i],E[i])}</li>`).join('')}</ul>
    <p class="thesis">${T(F[3],E[3])}</p>
    <div class="eqs">${[4,5,6,7,8,9,10,11].map(i=>eq(F[i],E[i])).join('')}</div>
    <h3 class="rainbow-h">${T(F[12],E[12])}${T(F[13],E[13])}</h3>
    <ul class="layers">${[14,15,16,17,18,19,20].map((i,k)=>`<li style="${colStyle(k)}"><i></i><div>${T(F[i],E[i])}</div></li>`).join('')}</ul>
    <div class="goal">${[21,22,23,24,25].map(i=>`<p>${T(F[i],E[i])}</p>`).join('')}</div>
  </div>`;
}

const RENDER = {draw:renderDraw, cards:renderCards, os:renderOS, algo:renderAlgo, def:renderDef};
function go(v){
  state.view = v;
  VIEWS.forEach(([k])=>$('#view-'+k).hidden = k!==v);
  renderChrome(); RENDER[v]();
  if(location.hash.slice(1)!==v) history.replaceState(null,'','#'+v);
}

/* ---------- dialog ---------- */
const dlg = $('#dlg'); let dlgN = null;
function openCard(n){
  stopSpeech(); dlgN = n; const c = CARDS[n];
  $('#dlgBody').innerHTML = `<article class="face" style="${colStyle(c.ci)}">${cardFace(n)}</article>
    <div class="dlg-nav"><button class="btn" id="dPrev">← ${U('上一張','Previous')}</button><button class="btn" id="dClose">${U('關閉','Close')}</button><button class="btn" id="dNext">${U('下一張','Next')} →</button></div>`;
  $('#dPrev').onclick = ()=>openCard(n===1?245:n-1);
  $('#dNext').onclick = ()=>openCard(n===245?1:n+1);
  $('#dClose').onclick = ()=>dlg.close();
  if(!dlg.open) dlg.showModal();
}
dlg.addEventListener('click',e=>{ if(e.target===dlg) dlg.close(); });
dlg.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft') $('#dPrev').click(); if(e.key==='ArrowRight') $('#dNext').click(); });

/* ---------- English speech ---------- */
let VOICE = null, activeBtn = null;
function pickVoice(){
  if(!CAN_SPEAK) return;
  const vs = speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  VOICE = vs.find(v=>/en[-_]US/i.test(v.lang) && /natural|google|samantha|aria|jenny/i.test(v.name))
       || vs.find(v=>/en[-_]US/i.test(v.lang)) || vs[0] || null;
}
function stopSpeech(){
  if(!CAN_SPEAK) return;
  speechSynthesis.cancel();
  if(activeBtn){ activeBtn.classList.remove('on'); activeBtn = null; }
}
function speak(lines, btn){
  if(!CAN_SPEAK) return;
  const wasActive = btn && btn===activeBtn;
  stopSpeech();
  if(wasActive) return;            // second tap on the same button stops it
  if(!VOICE) pickVoice();
  activeBtn = btn || null; if(btn) btn.classList.add('on');
  lines.forEach((text,i)=>{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = VOICE ? VOICE.lang : 'en-US'; if(VOICE) u.voice = VOICE; u.rate = RATE;
    if(i===lines.length-1) u.onend = u.onerror = ()=>{ if(activeBtn===btn){ btn && btn.classList.remove('on'); activeBtn=null; } };
    speechSynthesis.speak(u);
  });
}
function cardLines(n){
  const c = CARDS[n], s = SECT[c.ci];
  const out = [`Card ${n}. ${c.en.title}`];
  if(c.en.f) FIELD.forEach((lb,i)=>out.push(`${lb[1]}: ${c.en.f[i]}`));
  else {
    out.push(`Layer: ${EN.os[c.ci]}`);
    if(s.uniEn) UFIELD.forEach((lb,i)=>out.push(`${lb[1]}: ${s.uniEn[i]}`));
  }
  return out;
}
if(CAN_SPEAK){
  pickVoice();
  speechSynthesis.addEventListener && speechSynthesis.addEventListener('voiceschanged', pickVoice);
  $('.seg-lb').innerHTML = SPK;
} else {
  $('#rateSeg').hidden = true;
}
document.addEventListener('click',e=>{
  const s = e.target.closest('.say');
  if(s){ e.preventDefault(); e.stopPropagation(); speak([s.dataset.say], s); return; }
  const r = e.target.closest('.read-all');
  if(r){ speak(cardLines(+r.dataset.card), r); }
});
dlg.addEventListener('close', stopSpeech);

/* ---------- boot ---------- */
document.querySelectorAll('.seg button[data-lang]').forEach(b=>b.onclick=()=>{
  stopSpeech(); LANG=b.dataset.lang; store.set('rc-lang',LANG); go(state.view); if(dlg.open) openCard(dlgN);
});
document.querySelectorAll('.seg button[data-rate]').forEach(b=>b.onclick=()=>{
  RATE=+b.dataset.rate; store.set('rc-rate',RATE); renderChrome();
});
$('#tabs').addEventListener('click',e=>{ const b=e.target.closest('button[data-view]'); if(b) go(b.dataset.view); });
const h = location.hash.slice(1);
go(VIEWS.some(v=>v[0]===h)?h:'draw');
</script>
