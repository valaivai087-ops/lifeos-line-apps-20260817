const NUM = ["①","②","③","④","⑤"];
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const pad = n => String(n).padStart(2,"0");
const lines = t => t.split("\n").map(s => s.trim()).filter(Boolean).map(s => s.split("|"));
const L = (z,e,tag) => `<${tag||"div"} class="ln"><span class="z">${esc(z)}</span><span class="e">${esc(e||"")}</span></${tag||"div"}>`;

// 通用區塊（框架、序言、總結）
function blocks(text){
  let out = "", open = false, tbl = null;
  const closeTbl = () => { if(tbl){ out += tbl + "</tbody></table></div>"; tbl = null; } };
  for(const f of lines(text)){
    const k = f[0];
    if(k === "#"){ closeTbl(); if(open) out += "</div>"; out += `<div class="card">${L(f[1],f[2],"h2")}`; open = true; }
    else if(k === "##"){ closeTbl(); out += L(f[1],f[2],"h3"); }
    else if(k === "R"){
      if(!tbl) tbl = `<div class="tw"><table><thead><tr><th>模組 Module</th><th>原書核心概念 Core idea</th><th>更新機制 Update mechanism</th><th>最小行動 Minimum action</th></tr></thead><tbody>`;
      tbl += `<tr><td><b>${f[1]}</b> ${L(f[2],f[3])}</td><td>${L(f[4],f[5])}</td><td>${L(f[6],f[7])}</td><td>${L(f[8],f[9])}</td></tr>`;
    }
    else if(k === "O"){ closeTbl(); out += `<div class="on2"><div class="old"><b>舊模型 Old</b>${L(f[1],f[2])}</div><div class="new"><b>新模型 New</b>${L(f[3],f[4])}</div></div>`; }
    else { closeTbl(); out += L(f[0],f[1]); }
  }
  closeTbl(); if(open) out += "</div>";
  return out;
}

const tabs = document.querySelectorAll("nav button");
function showTab(id){
  tabs.forEach(b=>b.classList.toggle("on", b.dataset.tab===id));
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on", s.id===id));
  try{ localStorage.setItem("kxTab", id); }catch(e){}
}
tabs.forEach(b=>b.onclick=()=>{ document.getElementById("search").value=""; doSearch(); showTab(b.dataset.tab); window.scrollTo(0,0); });

// 語言
let lang = "both";
function setLang(l){
  lang = l;
  document.body.classList.toggle("only-zh", l==="zh");
  document.body.classList.toggle("only-en", l==="en");
  document.querySelectorAll("#lang button[data-l]").forEach(b=>b.classList.toggle("on", b.dataset.l===l));
  try{ localStorage.setItem("kxLang", l); }catch(e){}
}
document.querySelectorAll("#lang button[data-l]").forEach(b=>b.onclick=()=>setLang(b.dataset.l));

// 英文朗讀（瀏覽器內建語音，不需網路金鑰）
const synth = window.speechSynthesis;
function voice(){ const v = synth ? synth.getVoices() : []; return v.find(x=>/en-US/i.test(x.lang)&&/Natural|Online|Google/i.test(x.name)) || v.find(x=>/^en/i.test(x.lang)); }
function speak(texts){
  if(!synth){ toast("此瀏覽器不支援朗讀"); return; }
  synth.cancel();
  const v = voice();
  texts.forEach(t=>{ const u = new SpeechSynthesisUtterance(t); u.lang="en-US"; u.rate=.92; if(v) u.voice=v; synth.speak(u); });
}
document.getElementById("stop").onclick = ()=>{ if(synth) synth.cancel(); };
document.addEventListener("click", ev=>{
  const e = ev.target.closest(".e");
  if(e && e.textContent.trim()){ speak([e.textContent]); return; }
  const r = ev.target.closest("[data-read]");
  if(r){ speak([...document.getElementById(r.dataset.read).querySelectorAll(".e")].map(x=>x.textContent).filter(Boolean)); return; }
  const c = ev.target.closest("[data-copy]");
  if(c) copyLine(+c.dataset.copy.slice(1), c.dataset.copy[0]==="a");
});

// 複製 LINE 格式（依目前語言模式）
function pick(pair){ return lang==="zh" ? pair[0] : lang==="en" ? pair[1] : pair[0]+"\n"+pair[1]; }
function copyLine(n, withAct){
  const p = P[n-1];
  let s = `【${pad(p.n)}｜${pick(p.t).replace("\n"," / ")}】\n`;
  p.q.forEach((q,j)=>{ s += pick([NUM[j]+" "+q[0], NUM[j]+" "+q[1]]) + "\n"; });
  if(withAct){ s += pick(["🎯最小行動｜"+p.a[0], "🎯Minimum action｜"+p.a[1]]) + "\n" + pick(["✅完成指標｜"+p.k[0], "✅Completion check｜"+p.k[1]]) + "\n"; }
  const done = ()=>toast("已複製，可貼到 LINE");
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(s.trim()).then(done, ()=>fallback(s.trim(),done)); }
  else fallback(s.trim(),done);
}
function fallback(s,done){ const t=document.createElement("textarea"); t.value=s; document.body.appendChild(t); t.select(); try{document.execCommand("copy"); done();}catch(e){toast("複製失敗");} t.remove(); }
let tt; function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),1600); }

// 搜尋（跨全部分頁，中英都可）
function clearMarks(){ document.querySelectorAll("mark").forEach(m=>{ const p=m.parentNode; m.replaceWith(m.textContent); p.normalize(); }); }
function mark(root,q){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), hits=[];
  while(w.nextNode()) if(w.currentNode.nodeValue.toLowerCase().includes(q)) hits.push(w.currentNode);
  hits.forEach(node=>{
    const s = node.nodeValue, low = s.toLowerCase(), frag = document.createDocumentFragment(); let i=0, k;
    while((k = low.indexOf(q,i)) > -1){ frag.append(s.slice(i,k)); const m=document.createElement("mark"); m.textContent=s.slice(k,k+q.length); frag.append(m); i=k+q.length; }
    frag.append(s.slice(i)); node.replaceWith(frag);
  });
}
function doSearch(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  clearMarks();
  const cards = document.querySelectorAll("section .card"), chipsEl = document.querySelectorAll(".chips");
  document.body.classList.toggle("searching", !!q);
  let n = 0;
  cards.forEach(c=>{ const hit = !q || c.textContent.toLowerCase().includes(q); c.classList.toggle("hide", !hit); if(hit && q){ n++; mark(c,q); } });
  chipsEl.forEach(c=>c.style.display = q ? "none" : "");
  document.getElementById("count").textContent = q ? `找到 ${n} 張卡片 · ${n} cards found` : "";
  document.getElementById("empty").style.display = q && !n ? "block" : "none";
}
let st; document.getElementById("search").addEventListener("input", ()=>{ clearTimeout(st); st=setTimeout(doSearch,200); });

try{ const l=localStorage.getItem("kxLang"); if(l) setLang(l); const t=localStorage.getItem("kxTab"); if(t && document.getElementById(t)) showTab(t); }catch(e){}
</script>
