d": "9. chemical", "definition": "化學的"}, {"word": "10. odor", "definition": "難聞的）氣味"}]}, {"id": "L5", "title": "Lesson 5 · The Life of a Plastic Bag", "exercises": [{"english": "I am a plastic bag.", "chinese": "我是一個塑膠袋。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "主詞", "text": "I"}, {"label": "動詞", "text": "am a"}, {"label": "補語", "text": "plastic bag."}]}, {"english": "When I was very young, I was sent from the factory to a convenience store.", "chinese": "在我非常年幼的時候，我從工廠被送到一間便利商店。", "pattern": "S/V", "analysis": "副詞子句：主從句時態與連接詞 不定詞：to＋原形動詞", "roles": [{"label": "連接詞", "text": "When"}, {"label": "修飾語", "text": "I was very young,"}, {"label": "主詞", "text": "I"}, {"label": "動詞", "text": "was sent"}, {"label": "補語", "text": "from the factory to a convenience store."}]}, {"english": "I stayed there for a long time and waited eagerly to be used.", "chinese": "我在那裡待了很長的一段時間，並渴望地等著被使用。", "pattern": "S/V/O(C)", "analysis": "被動語態：be＋p.p. 不定詞：to＋原形動詞", "roles": [{"label": "主詞", "text": "I"}, {"label": "動詞", "text": "stayed"}, {"label": "補語", "text": "there for a long time and waited eagerly to be used."}]}, {"english": "Finally, some kids came along, bought some snacks, and took me along to the beach for a picnic.", "chinese": "終於，有一些小孩出現，買了一些零食，並把我帶到海灘野餐。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞", "roles": [{"label": "修飾語", "text": "Finally,"}, {"label": "主詞", "text": "some kids came along, bought some snacks, and"}, {"label": "動詞", "text": "took"}, {"label": "受詞", "text": "me along to the beach for a picnic."}]}, {"english": "When it was getting dark, they packed everything up and let me stay there alone!", "chinese": "當天色漸暗，他們收拾所有東西並讓我獨自待在那裡！", "pattern": "S/V", "analysis": "副詞子句：主從句時態與連接詞 V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "連接詞", "text": "When"}, {"label": "修飾語", "text": "it was getting dark,"}, {"label": "主詞", "text": "they"}, {"label": "動詞", "text": "packed"}, {"label": "受詞", "text": "everything up and let me stay there alone!"}]}, {"english": "The wind started to howl, and suddenly I was in the sea all on my own.", "chinese": "風開始呼嘯，突然間我獨自漂流在海中。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞", "roles": [{"label": "修飾語", "text": "The wind started to howl,"}, {"label": "主詞", "text": "and suddenly I"}, {"label": "動詞", "text": "was"}, {"label": "補語", "text": "in the sea all on my own."}]}, {"english": "I floated helplessly in the water for a while, but soon realized I wasn’t alone.", "chinese": "我在水中無助地漂了一陣子，但很快就發現自己並不孤單。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "主詞", "text": "I floated helplessly in the water for a while, but soon"}, {"label": "動詞", "text": "realized"}, {"label": "受詞", "text": "I wasn’t alone."}]}, {"english": "I was surrounded by plastic cups, plates, and straws.", "chinese": "我被塑膠杯、盤子和吸管包圍著。", "pattern": "S/V/O(C)", "analysis": "被動語態：be＋p.p.", "roles": [{"label": "修飾語", "text": "I was surrounded by plastic cups,"}, {"label": "補語／片語", "text": "plates, and straws."}]}, {"english": "After days of drifting, I started to envy the birds up above, who were flying so high and free.", "chinese": "漂流了幾天後，我開始羨慕上方的鳥兒，牠們飛得又高又自由。", "pattern": "S/V", "analysis": "關係子句：who/which 修飾先行詞 副詞子句：主從句時態與連接詞 不定詞：to＋原形動詞", "roles": [{"label": "連接詞", "text": "After"}, {"label": "修飾語", "text": "days of drifting,"}, {"label": "主詞", "text": "I started to envy the birds up above, who"}, {"label": "動詞", "text": "were flying"}, {"label": "補語", "text": "so high and free."}]}, {"english": "I could only follow the currents.", "chinese": "我只能隨著洋流漂動。", "pattern": "S/V/O(C)", "analysis": "情態助動詞＋原形動詞", "roles": [{"label": "主詞", "text": "I"}, {"label": "動詞", "text": "could only"}, {"label": "受詞", "text": "follow the currents."}]}, {"english": "Suddenly, I went down a tunnel into a chamber. “What happened?” I asked a fork next to me. “I think we were just swallowed by a huge fish!” he replied.", "chinese": "突然，我沿著一條通道進入一個腔室。「發生什麼事了？」我問身旁的一支叉子。", "pattern": "S/V/O(C)", "analysis": "被動語態：be＋p.p. 不定詞：to＋原形動詞", "roles": [{"label": "修飾語", "text": "Suddenly,"}, {"label": "主詞", "text": "I went down a tunnel into a chamber. “What"}, {"label": "動詞", "text": "happened"}, {"label": "受詞", "text": "?” I asked a fork next to me. “I think we were just swallowed by a huge fish!” he replied."}]}, {"english": "More and more of us were swallowed until it got quite crowded inside.", "chinese": "「我想我們剛剛被一條大魚吞下去了！」他回答。", "pattern": "S/V/O(C)", "analysis": "被動語態：be＋p.p.", "roles": [{"label": "主詞", "text": "More and more of us"}, {"label": "動詞", "text": "were swallowed"}, {"label": "補語", "text": "until it got quite crowded inside."}]}, {"english": "We obviously weren’t that nutritious because the fish died after a few days.", "chinese": "越來越多像我們一樣的東西被吞下去，直到裡面變得相當擁擠。", "pattern": "S/V/O(C)", "analysis": "that 子句：留意名詞子句或關係子句", "roles": [{"label": "補語／片語", "text": "We obviously weren’t that nutritious because the fish died after a few days."}]}, {"english": "The fish’s body slowly decomposed, and then I was back in the ocean.", "chinese": "那條魚的身體慢慢分解，然後我又回到了海裡。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "修飾語", "text": "The fish’s body slowly decomposed,"}, {"label": "主詞", "text": "and then I"}, {"label": "動詞", "text": "was back"}, {"label": "補語", "text": "in the ocean."}]}, {"english": "One day, a big wave came and threw me up onto the shore.", "chinese": "有一天，一個大浪打來，把我拋上岸。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "修飾語", "text": "One day,"}, {"label": "主詞", "text": "a big wave"}, {"label": "動詞", "text": "came"}, {"label": "受詞", "text": "and threw me up onto the shore."}]}, {"english": "A few days later, some schoolchildren walked up to me.", "chinese": "幾天後，一些學童走向我。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞", "roles": [{"label": "修飾語", "text": "A few days later,"}, {"label": "主詞", "text": "some schoolchildren"}, {"label": "動詞", "text": "walked"}, {"label": "受詞", "text": "up to me."}]}, {"english": "They were carrying bags and pairs of tongs.", "chinese": "他們拿著袋子和夾子。", "pattern": "S/V/O(C)", "analysis": "V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "主詞", "text": "They"}, {"label": "動詞", "text": "were carrying"}, {"label": "補語", "text": "bags and pairs of tongs."}]}, {"english": "I felt a sudden pinch, and the next thing I knew, I was inside a big bag of trash.", "chinese": "我突然感到被夾了一下，下一刻我就已經在一大袋垃圾裡。", "pattern": "S/V/O(C)", "analysis": "V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "修飾語", "text": "I felt a sudden pinch,"}, {"label": "主詞", "text": "and the next thing I knew, I"}, {"label": "動詞", "text": "was inside"}, {"label": "補語", "text": "a big bag of trash."}]}, {"english": "A teacher told the schoolchildren, “Because of all the littering, a lot of plastic products end up in the ocean.", "chinese": "一位老師告訴那些學童：「因為到處亂丟垃圾，許多塑膠製品最後會進入海洋。」", "pattern": "S/V/O(C)", "analysis": "V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "修飾語", "text": "A teacher told the schoolchildren,"}, {"label": "補語／片語", "text": "“Because of all the littering, a lot of plastic products end up in the ocean."}]}, {"english": "They are then consumed by different sea creatures.", "chinese": "接著，它們會被不同的海洋生物吃下。", "pattern": "S/V/O(C)", "analysis": "被動語態：be＋p.p.", "roles": [{"label": "主詞", "text": "They"}, {"label": "動詞", "text": "are then"}, {"label": "補語", "text": "consumed by different sea creatures."}]}, {"english": "You might think that’s okay, but when we eat seafood, the poisonous substances from the plastic end up inside us and make us feel sick.”", "chinese": "你們可能覺得那沒關係，但當我們吃海鮮時，塑膠中的有毒物質最後會進到我們體內，讓我們生病。」", "pattern": "S/V/O(C)", "analysis": "that 子句：留意名詞子句或關係子句 情態助動詞＋原形動詞", "roles": [{"label": "修飾語", "text": "You might think that’s okay,"}, {"label": "主詞", "text": "but when we eat seafood, the poisonous substances from the plastic end up inside us and"}, {"label": "動詞", "text": "make"}, {"label": "受詞", "text": "us feel sick.”"}]}, {"english": "According to a plastic bottle nearby, the humans are going to take us to a recycling plant.", "chinese": "根據附近一個塑膠瓶的說法，這些人類將會把我們帶到一間回收場。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞 V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "修飾語", "text": "According to a plastic bottle nearby,"}, {"label": "主詞", "text": "the humans"}, {"label": "動詞", "text": "are going to take"}, {"label": "補語", "text": "us to a recycling plant."}]}, {"english": "I really don’t understand them.", "chinese": "我真的不了解他們。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "補語／片語", "text": "I really don’t understand them."}]}, {"english": "They produce us to make their lives better, but then they misuse us and make everyone’s life worse!", "chinese": "他們製造我們來讓他們的生活變得更好，但是他們卻接著濫用我們，把每個人的生活弄得更糟！", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞", "roles": [{"label": "修飾語", "text": "They produce us to make their lives better,"}, {"label": "主詞", "text": "but then they misuse us and"}, {"label": "動詞", "text": "make"}, {"label": "受詞", "text": "everyone’s life worse!"}]}, {"english": "I’m tired of floating around, killing fish, and causing harm to the environment.", "chinese": "我對到處漂流、殺死魚類和破壞環境感到厭倦。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞 V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "修飾語", "text": "I’m tired of floating around,"}, {"label": "補語／片語", "text": "killing fish, and causing harm to the environment."}]}, {"english": "I really hope that my future owner will use me properly in my next life.", "chinese": "我真的希望下輩子我未來的主人會適當地使用我。", "pattern": "S/V/O(C)", "analysis": "that 子句：留意名詞子句或關係子句 情態助動詞＋原形動詞", "roles": [{"label": "主詞", "text": "I really hope that my future owner"}, {"label": "動詞", "text": "will use"}, {"label": "受詞", "text": "me properly in my next life."}]}], "vocabulary": [{"word": "plastic", "definition": "塑膠（製）的 made of a type of material that can be shaped into countless forms"}, {"word": "convenience", "definition": "便利 the condition of being useful, easy, or suitable for people"}, {"word": "eagerly", "definition": "渴望地 in a way that shows excitement about something that will soon happen"}, {"word": "eager", "definition": "渴望的"}, {"word": "surround", "definition": "圍繞 to be or go totally around something or someone"}, {"word": "surroundings", "definition": "環境"}, {"word": "drift", "definition": "漂流 to move in a certain direction smoothly and slowly, usually on water or in the air"}, {"word": "envy", "definition": "羨慕 to desire the same qualities, possessions, opportunities, etc. that someone else has"}, {"word": "crowded", "definition": "擠滿的；擁擠的 filled with things or people"}, {"word": "crowd", "definition": "人群"}, {"word": "obviously", "definition": "顯然 used to indicate that something is very easy to see or understand"}, {"word": "obvious", "definition": "明顯的"}, {"word": "product", "definition": "產品 something that is grown or produced, and usually sold"}, {"word": "produce", "definition": "製造；生產"}, {"word": "production", "definition": "製造"}, {"word": "consume", "definition": "吃喝 to eat or drink something"}, {"word": "consumer", "definition": "消費者"}, {"word": "poisonous", "definition": "有毒的 able to make a person or animal die or become ill if consumed or entering the body"}, {"word": "poison", "definition": "毒害"}, {"word": "substance", "definition": "物質 a kind of solid, liquid, or gas that has certain qualities"}, {"word": "recycling", "definition": "回收 a process of treating used items such as plastic, metal, glass, etc. so that they can be used again"}, {"word": "recycle", "definition": "回收"}, {"word": "harm", "definition": "傷害 damage or injury"}, {"word": "harmful", "definition": "有害的"}, {"word": "environment", "definition": "自然環境 the natural world in which living things exist"}, {"word": "n.", "definition": "環境"}, {"word": "environmental", "definition": "自然環境的"}, {"word": "properly", "definition": "適當地 in the correct or most suitable manner"}, {"word": "proper", "definition": "適當的"}, {"word": "howl", "definition": "風）呼嘯；狂嚎"}, {"word": "current", "definition": "水流"}, {"word": "tunnel", "definition": "隧道"}, {"word": "chamber", "definition": "腔室"}, {"word": "swallow", "definition": "吞"}, {"word": "nutritious", "definition": "營養的"}, {"word": "decompose", "definition": "分解"}, {"word": "tongs", "definition": "夾具"}, {"word": "pinch", "definition": "捏；擰"}, {"word": "littering", "definition": "亂丟垃圾"}, {"word": "recycling plant", "definition": "回收場"}, {"word": "misuse", "definition": "錯誤使用"}]}, {"id": "L6", "title": "Lesson 6 · Built for Freedom", "exercises": [{"english": "It was October 28, 1886.", "chinese": "時間是西元1886年10月28日。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "修飾語", "text": "It was October 28,"}, {"label": "補語／片語", "text": "1886."}]}, {"english": "Even though it was a rainy day in New York City, close to a million people were out for their first look at the city’s newest addition on Bedloe’s Island, which was later renamed Liberty Island.", "chinese": "儘管在紐約市是一個下著雨的日子，仍有將近一百萬人外出，為了首次觀看這個城市在貝德羅島（後改名為自由島）上最新的成員。", "pattern": "S/V/O(C)", "analysis": "被動語態：be＋p.p. 關係子句：who/which 修飾先行詞 不定詞：to＋原形動詞", "roles": [{"label": "主詞", "text": "Even though it was a rainy day in New York City, close to a million people were out for their first look at the city’s newest addition on Bedloe’s Island, which"}, {"label": "動詞", "text": "was later"}, {"label": "補語", "text": "renamed Liberty Island."}]}, {"english": "When French sculptor Frédéric Auguste Bartholdi removed the large French flag from the front of his latest creation, the crowds cheered and the soldiers fired their guns in celebration.", "chinese": "當法國雕塑家弗里德利．奧古斯特．巴特勒迪從他最新作品前移開了大面的法國國旗時，群眾們歡呼，而士兵們鳴槍慶祝。", "pattern": "S/V", "analysis": "副詞子句：主從句時態與連接詞", "roles": [{"label": "連接詞", "text": "When"}, {"label": "主詞", "text": "French sculptor Fr é d é ric Auguste Bartholdi removed the large French flag from the front of his latest creation, the crowds"}, {"label": "動詞", "text": "cheered"}, {"label": "受詞", "text": "and the soldiers fired their guns in celebration."}]}, {"english": "The grand sight before their eyes was the Statue of Liberty.", "chinese": "在他們眼前的宏偉景象是自由女神像。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "主詞", "text": "The grand sight before their eyes"}, {"label": "動詞", "text": "was the"}, {"label": "補語", "text": "Statue of Liberty."}]}, {"english": "The Statue of Liberty is a gift that France presented to America to celebrate its one hundred years of independence from Great Britain.", "chinese": "自由女神像是法國送給美國慶祝它脫離大不列顛獨立一百週年的禮物。", "pattern": "S/V/O(C)", "analysis": "that 子句：留意名詞子句或關係子句 不定詞：to＋原形動詞", "roles": [{"label": "主詞", "text": "The Statue of Liberty"}, {"label": "動詞", "text": "is a"}, {"label": "補語", "text": "gift that France presented to America to celebrate its one hundred years of independence from Great Britain."}]}, {"english": "The full height of the monument is 305 feet, and the statue itself stands 151 feet tall.", "chinese": "這座紀念碑總高度是305英尺，而雕像本身則有151英尺高。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "補語／片語", "text": "The full height of the monument is 305 feet, and the statue itself stands 151 feet tall."}]}, {"english": "When it was first created, the statue’s copper surface was reddish-brown.", "chinese": "它剛被製作出來時，這個雕像的銅製表面是紅棕色的。", "pattern": "S/V", "analysis": "被動語態：be＋p.p. 副詞子句：主從句時態與連接詞", "roles": [{"label": "連接詞", "text": "When"}, {"label": "修飾語", "text": "it was first created,"}, {"label": "主詞", "text": "the statue’s copper surface"}, {"label": "動詞", "text": "was reddish"}, {"label": "補語", "text": "- brown."}]}, {"english": "Over time, this outer layer has been exposed to the air and oxidized so much that it has turned green.", "chinese": "隨著時間經過，這個外層一直被暴露在空氣中並過於氧化以致於變成綠色。", "pattern": "S/V/O(C)", "analysis": "完成式：have/has/had＋p.p. 被動語態：be＋p.p. that 子句：留意名詞子句或關係子句", "roles": [{"label": "修飾語", "text": "Over time,"}, {"label": "主詞", "text": "this outer layer"}, {"label": "動詞", "text": "has been exposed to"}, {"label": "受詞", "text": "the air and oxidized so much that it has turned green."}]}, {"english": "Each part of the statue has a special meaning.", "chinese": "這座雕像的每一個部分都有特別的意義。", "pattern": "S/V/O(C)", "analysis": "V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "主詞", "text": "Each part of the statue"}, {"label": "動詞", "text": "has a"}, {"label": "受詞", "text": "special meaning."}]}, {"english": "In her left hand, Lady Liberty holds a giant tablet with the date “July 4, 1776” on it.", "chinese": "在她的左手，自由女神拿著一面巨大的牌子，上頭寫著「1776年7月4日」的日期。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "修飾語", "text": "In her left hand,"}, {"label": "補語／片語", "text": "Lady Liberty holds a giant tablet with the date “July 4, 1776” on it."}]}, {"english": "It was on this day that the United States became independent, and the tablet symbolizes a new and free America.", "chinese": "美國就是在這一天獨立，而這個牌子象徵著一個全新且自由的美國。", "pattern": "S/V/O(C)", "analysis": "that 子句：留意名詞子句或關係子句", "roles": [{"label": "補語／片語", "text": "It was on this day that the United States became independent, and the tablet symbolizes a new and free America."}]}, {"english": "A giant torch, which symbolizes that Lady Liberty lights the way to freedom, is held firmly in her right hand.", "chinese": "一把巨大的火炬，象徵著自由女神點亮了前往自由的路，緊握在她的右手中。", "pattern": "S/V/O(C)", "analysis": "關係子句：who/which 修飾先行詞 that 子句：留意名詞子句或關係子句 不定詞：to＋原形動詞", "roles": [{"label": "修飾語", "text": "A giant torch,"}, {"label": "主詞", "text": "which symbolizes that Lady Liberty lights the way to freedom,"}, {"label": "動詞", "text": "is held"}, {"label": "補語", "text": "firmly in her right hand."}]}, {"english": "Other symbolic parts of the statue include Lady Liberty’s crown, her dress, and the broken chains at her feet.", "chinese": "這座雕像其他具象徵意義的部分包括了自由女神的王冠、她的裙裝，以及在她腳邊的斷鍊。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "補語／片語", "text": "Other symbolic parts of the statue include Lady Liberty’s crown, her dress, and the broken chains at her feet."}]}, {"english": "Seven spikes rise from the top of the crown and represent the rays of the sun.", "chinese": "七支尖刺從王冠的頂端升起，象徵著太陽的光芒。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "補語／片語", "text": "Seven spikes rise from the top of the crown and represent the rays of the sun."}]}, {"english": "Lady Liberty is thus divine and shines her heavenly light on the world.", "chinese": "自由女神因此如神一般，將她神聖的光照耀全世界。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "主詞", "text": "Lady Liberty"}, {"label": "動詞", "text": "is thus"}, {"label": "補語", "text": "divine and shines her heavenly light on the world."}]}, {"english": "Her robe in the ancient Roman style shows that Bartholdi was also inspired by Libertas, the Roman goddess of freedom.", "chinese": "她古羅馬風格的長袍顯示巴特勒迪也從羅馬自由女神利貝塔斯獲得靈感。", "pattern": "S/V/O(C)", "analysis": "被動語態：be＋p.p. that 子句：留意名詞子句或關係子句 so...that：如此……以致於……", "roles": [{"label": "補語／片語", "text": "Her robe in the ancient Roman style shows that Bartholdi was also inspired by Libertas, the Roman goddess of freedom."}]}, {"english": "The broken chains represent the end of slavery in the United States and symbolize freedom from unfair treatment.", "chinese": "斷鍊象徵美國奴隸制度的結束，並象徵擺脫不平等的對待。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "主詞", "text": "The broken chains represent the end of slavery in the"}, {"label": "動詞", "text": "United"}, {"label": "受詞", "text": "States and symbolize freedom from unfair treatment."}]}, {"english": "Today, the Statue of Liberty is one of America’s biggest tourist attractions.", "chinese": "現今，自由女神像是美國最熱門的觀光景點之一。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "修飾語", "text": "Today,"}, {"label": "主詞", "text": "the Statue of Liberty"}, {"label": "動詞", "text": "is one"}, {"label": "補語", "text": "of America’s biggest tourist attractions."}]}, {"english": "It is such a popular landmark that every visitor to New York City has heard of it and wants to pay a visit to Liberty Island.", "chinese": "它是一個如此受歡迎的地標以致於每位到紐約市的遊客都聽說過它，而且想去參觀自由島。", "pattern": "S/V/O(C)", "analysis": "that 子句：留意名詞子句或關係子句 不定詞：to＋原形動詞", "roles": [{"label": "主詞", "text": "It"}, {"label": "動詞", "text": "is such"}, {"label": "補語", "text": "a popular landmark that every visitor to New York City has heard of it and wants to pay a visit to Liberty Island."}]}, {"english": "As always, Lady Liberty stands tall and proud.", "chinese": "一如往常，自由女神充滿自信驕傲矗立。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "連接詞", "text": "As"}, {"label": "修飾語", "text": "always,"}, {"label": "補語／片語", "text": "Lady Liberty stands tall and proud."}]}, {"english": "She is a symbol of hope and freedom for visitors from around the globe.", "chinese": "她現在對於來自世界各地的遊客而言是一個希望與自由的象徵。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "主詞", "text": "She"}, {"label": "動詞", "text": "is a"}, {"label": "補語", "text": "symbol of hope and freedom for visitors from around the globe."}]}], "vocabulary": [{"word": "freedom", "definition": "自由 the right to do or say what one wants"}, {"word": "statue", "definition": "雕像 a figure of a person, animal, god, goddess, etc. that is usually made of metal or stone"}, {"word": "remove", "definition": "移除 to take a thing away from somewhere"}, {"word": "celebration", "definition": "慶祝 the act of doing activities for a special day or event"}, {"word": "n.", "definition": "慶祝活動"}, {"word": "celebrate", "definition": "慶祝"}, {"word": "independence", "definition": "獨立 freedom from being controlled by a person, a country, etc."}, {"word": "independent", "definition": "獨立的"}, {"word": "monument", "definition": "紀念碑 a building, statue, or other large object built to remind us of an important person or event"}, {"word": "symbolize", "definition": "象徵；代表 to stand for something"}, {"word": "symbol", "definition": "象徵"}, {"word": "symbolic", "definition": "作為象徵的；象徵性的"}, {"word": "firmly", "definition": "牢固地；堅定地 in a strong way that will prevent something from becoming loose; with a strong will"}, {"word": "firm", "definition": "堅硬的；結實的"}, {"word": "represent", "definition": "作為……的象徵；代表 to be a symbol of something"}, {"word": "representation", "definition": "表現（形式）；塑像"}, {"word": "ancient", "definition": "古代的；古老的 from a period of time in the distant past"}, {"word": "slavery", "definition": "蓄奴制；奴隸身分 the practice of owning and forcing people to work for no pay or the condition of being owned and forced to work for no pay"}, {"word": "slave", "definition": "奴隸"}, {"word": "unfair", "definition": "不公正的；不公平的 not equal or fair"}, {"word": "treatment", "definition": "對待；待遇 the way a person behaves toward or deals with another person or thing"}, {"word": "tourist", "definition": "遊客 a person who is traveling to or visiting a place for fun or to learn about it"}, {"word": "tourism", "definition": "旅遊業；觀光業"}, {"word": "attraction", "definition": "有吸引力的事物或地點 a place that people want to see or an activity that people want to do"}, {"word": "attract", "definition": "招引；吸引"}, {"word": "attractive", "definition": "吸引人的"}, {"word": "landmark", "definition": "地標 a large natural or man-made thing that makes it easy to know one’s location"}, {"word": "globe", "definition": "地球；世界 the world (used especially to emphasize its large size and round shape)"}, {"word": "global", "definition": "全球的；全世界的"}, {"word": "the Statue of Liberty", "definition": "自由女神像（又稱Lady Liberty）"}, {"word": "New York City", "definition": "紐約市（位於美國紐約州）"}, {"word": "Bedloe’s Island", "definition": "貝德羅島（為Liberty Island的舊稱， 於1956年正式改為此名）"}, {"word": "Liberty Island", "definition": "自由島（位於美國紐約灣的小島，為自由女神像所在地）"}, {"word": "sculptor", "definition": "雕刻家"}, {"word": "Frédéric Auguste Bartholdi", "definition": "弗里德利．奧古斯特．巴特勒迪（1834–1904， 法國雕塑家，自由女神像的創作者）"}, {"word": "Great Britain", "definition": "大不列顛（包括英格蘭、蘇格蘭和威爾士）"}, {"word": "copper", "definition": "銅"}, {"word": "reddish-brown", "definition": "紅棕色的"}, {"word": "layer", "definition": "層；表層"}, {"word": "oxidize", "definition": "氧化"}, {"word": "tablet", "definition": "刻有文字的） 牌；碑"}, {"word": "torch", "definition": "火炬；火把"}, {"word": "crown", "definition": "王冠；皇冠"}, {"word": "chain", "definition": "鎖鏈；鏈子"}, {"word": "spike", "definition": "尖刺；尖狀物"}, {"word": "divine", "definition": "神的；如神一樣的"}, {"word": "heavenly", "definition": "神聖的；天堂的"}, {"word": "robe", "definition": "長袍；禮袍"}, {"word": "Roman", "definition": "羅馬的"}, {"word": "Libertas", "definition": "利貝塔斯（古羅馬神話中的自主神）"}, {"word": "goddess", "definition": "女神"}]}, {"id": "L7", "title": "Lesson 7 · From Trash to Triumph", "exercises": [{"english": "Ada Ríos grew up in a slum near the Cateura landfill in Paraguay.", "chinese": "AdaRíos在巴拉圭的卡特烏拉垃圾掩埋場附近的貧民窟長大。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "補語／片語", "text": "Ada R í os grew up in a slum near the Cateura landfill in Paraguay."}]}, {"english": "Every morning, garbage trucks rolled into the landfill and unloaded tons of trash.", "chinese": "每天早上，垃圾車會駛進垃圾掩埋場，卸下大量的垃圾。", "pattern": "S/V/O(C)", "analysis": "V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "修飾語", "text": "Every morning,"}, {"label": "主詞", "text": "garbage trucks"}, {"label": "動詞", "text": "rolled"}, {"label": "受詞", "text": "into the landfill and unloaded tons of trash."}]}, {"english": "People in the slum then looked through the trash for things they could recycle or sell.", "chinese": "貧民窟的居民會在垃圾中尋找他們可以回收或出售的東西。", "pattern": "S/V/O(C)", "analysis": "情態助動詞＋原形動詞", "roles": [{"label": "主詞", "text": "People in the slum then"}, {"label": "動詞", "text": "looked"}, {"label": "補語", "text": "through the trash for things they could recycle or sell."}]}, {"english": "This was how they made a living, and Ada believed her future would be no different.", "chinese": "這就是他們謀生的方式，Ada相信她的未來也不會有所不同。", "pattern": "S/V/O(C)", "analysis": "V-ing：動名詞或分詞，依句中功能判斷 情態助動詞＋原形動詞", "roles": [{"label": "修飾語", "text": "This was how they made a living,"}, {"label": "主詞", "text": "and Ada"}, {"label": "動詞", "text": "believed"}, {"label": "受詞", "text": "her future would be no different."}]}, {"english": "One day, Ada’s grandma saw a poster that said “Free music lessons from Mr.", "chinese": "有一天，Ada的祖母看到一張寫著「Chávez先生提供免費音樂課程」的海報。", "pattern": "S/V/O(C)", "analysis": "that 子句：留意名詞子句或關係子句", "roles": [{"label": "修飾語", "text": "One day,"}, {"label": "補語／片語", "text": "Ada’s grandma saw a poster that said “Free music lessons from Mr."}]}, {"english": "Chávez.” Ada’s grandma knew Ada loved music, so she applied for Ada.", "chinese": "Ada的祖母知道Ada熱愛音樂，所以她為Ada報名。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "主詞", "text": "Ch á vez.” Ada’s grandma knew Ada loved music, so she"}, {"label": "動詞", "text": "applied"}, {"label": "受詞", "text": "for Ada."}]}, {"english": "Ada really looked forward to the lessons.", "chinese": "Ada非常期待去上課。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞", "roles": [{"label": "主詞", "text": "Ada"}, {"label": "動詞", "text": "really looked"}, {"label": "補語", "text": "forward to the lessons."}]}, {"english": "She wanted to learn how to play the violin and be carried away by the power of music.", "chinese": "她想學習如何演奏小提琴，並陶醉在音樂的力量之中。", "pattern": "S/V/O(C)", "analysis": "被動語態：be＋p.p. 不定詞：to＋原形動詞", "roles": [{"label": "主詞", "text": "She"}, {"label": "動詞", "text": "wanted to"}, {"label": "受詞", "text": "learn how to play the violin and be carried away by the power of music."}]}, {"english": "Ada and some other children took Mr.", "chinese": "Ada 和其他一些孩子上了 Mr.", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "主詞", "text": "Ada and some other children"}, {"label": "動詞", "text": "took"}, {"label": "受詞", "text": "Mr."}]}, {"english": "Chávez’s lessons, but there were not enough instruments.", "chinese": "Chávez 先生的課，但樂器不夠。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "修飾語", "text": "Ch á vez’s lessons,"}, {"label": "主詞", "text": "but there"}, {"label": "動詞", "text": "were not"}, {"label": "補語", "text": "enough instruments."}]}, {"english": "Buying new ones was impossible, since a violin cost more than a local house!", "chinese": "買新的樂器是不可能的，因為一把小提琴比當地一棟房子還貴！", "pattern": "S/V/O(C)", "analysis": "V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "修飾語", "text": "Buying new ones was impossible,"}, {"label": "補語／片語", "text": "since a violin cost more than a local house!"}]}, {"english": "Fortunately, a garbage picker who was good at using tools learned about their trouble and tried to use what was at hand.", "chinese": "幸運的是，一位擅長使用工具的拾荒者得知他們的困難，並試著運用手邊可用的東西。", "pattern": "S/V/O(C)", "analysis": "關係子句：who/which 修飾先行詞 不定詞：to＋原形動詞 V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "修飾語", "text": "Fortunately,"}, {"label": "主詞", "text": "a garbage picker who"}, {"label": "動詞", "text": "was good"}, {"label": "補語", "text": "at using tools learned about their trouble and tried to use what was at hand."}]}, {"english": "By putting together metal cans, forks, and other items from the landfill, the garbage picker somehow managed to make various instruments.", "chinese": "透過把垃圾掩埋場裡的金屬罐、叉子和其他物品組合起來，這位拾荒者不知怎地成功做出各式各樣的樂器。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞 V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "修飾語", "text": "By putting together metal cans,"}, {"label": "主詞", "text": "forks, and other items from the landfill, the garbage picker somehow"}, {"label": "動詞", "text": "managed to make"}, {"label": "受詞", "text": "various instruments."}]}, {"english": "They weren’t very traditional and barely cost anything, but to these children they were invaluable.", "chinese": "這些樂器並不十分傳統，也幾乎不花錢，但對這些孩子來說卻非常珍貴。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞 V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "修飾語", "text": "They weren’t very traditional and barely cost anything,"}, {"label": "主詞", "text": "but to these children they"}, {"label": "動詞", "text": "were invaluable"}, {"label": "補語", "text": "."}]}, {"english": "At first, each child played in his or her own way, and only screeches came out of the instruments.", "chinese": "起初，每個孩子各奏各的，樂器只發出尖銳刺耳的聲音。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "修飾語", "text": "At first,"}, {"label": "主詞", "text": "each child played in his or her own way, and only screeches"}, {"label": "動詞", "text": "came"}, {"label": "受詞", "text": "out of the instruments."}]}, {"english": "Some kids quit the music lessons after a few weeks, but with Mr.", "chinese": "有些孩子在幾週後就放棄了音樂課，但在Chávez先生的鼓勵下，Ada和其他孩子持續練習，有時一天練習好幾小時。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "補語／片語", "text": "Some kids quit the music lessons after a few weeks, but with Mr."}]}, {"english": "Chávez’s encouragement, Ada and the others kept practicing, sometimes for several hours a day.", "chinese": "慢慢地，他們的音樂技巧有了進步。", "pattern": "S/V/O(C)", "analysis": "V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "修飾語", "text": "Ch á vez’s encouragement,"}, {"label": "補語／片語", "text": "Ada and the others kept practicing, sometimes for several hours a day."}]}, {"english": "Slowly, their musical skills improved.", "chinese": "他們開始演奏出正確的音符，並且和諧地一起演出。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "修飾語", "text": "Slowly,"}, {"label": "主詞", "text": "their musical skills"}, {"label": "動詞", "text": "improved"}, {"label": "受詞", "text": "."}]}, {"english": "They began to hit all the right notes and played together harmoniously.", "chinese": "最後，他們組成了「回收管弦樂團」。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞", "roles": [{"label": "主詞", "text": "They"}, {"label": "動詞", "text": "began to"}, {"label": "受詞", "text": "hit all the right notes and played together harmoniously."}]}, {"english": "Finally, they formed the “Recycled Orchestra.” After the orchestra performed several local concerts, they attracted wider attention and even received invitations to perform abroad.", "chinese": "樂團在當地舉辦幾場音樂會後，吸引了更廣泛的關注，甚至收到海外演出的邀請。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞", "roles": [{"label": "修飾語", "text": "Finally,"}, {"label": "主詞", "text": "they formed the “Recycled Orchestra.” After the orchestra performed several local concerts, they"}, {"label": "動詞", "text": "attracted"}, {"label": "受詞", "text": "wider attention and even received invitations to perform abroad."}]}, {"english": "Ada and the other members visited different countries.", "chinese": "Ada和其他團員造訪了不同的國家。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "主詞", "text": "Ada and the other members"}, {"label": "動詞", "text": "visited"}, {"label": "受詞", "text": "different countries."}]}, {"english": "The world dazzled them just as they dazzled the world.", "chinese": "世界讓他們讚嘆，就像他們讓世界讚嘆一樣。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "主詞", "text": "The world"}, {"label": "動詞", "text": "dazzled"}, {"label": "受詞", "text": "them just as they dazzled the world."}]}, {"english": "Four years later, a world-famous rock band saw the children’s potential and invited the orchestra to tour with them.", "chinese": "四年後，一個世界知名的搖滾樂團看出這群孩子們的潛力，邀請這個管弦樂團和他們一起巡演。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞", "roles": [{"label": "修飾語", "text": "Four years later,"}, {"label": "主詞", "text": "a world - famous rock band saw the children’s potential and"}, {"label": "動詞", "text": "invited"}, {"label": "受詞", "text": "the orchestra to tour with them."}]}, {"english": "At their first concert with the band, Ada and her friends nervously stepped on stage in front of nearly 35,000 people.", "chinese": "在跟這個樂團表演的第一場演唱會上，Ada和朋友們在近35,000人面前緊張地走上舞臺。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "修飾語", "text": "At their first concert with the band,"}, {"label": "補語／片語", "text": "Ada and her friends nervously stepped on stage in front of nearly 35, 000 people."}]}, {"english": "They saw glaring lights and heard screams of excitement.", "chinese": "他們看到刺眼的燈光和聽到興奮的尖叫聲。", "pattern": "S/V/O(C)", "analysis": "V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "補語／片語", "text": "They saw glaring lights and heard screams of excitement."}]}, {"english": "These children felt dizzy and didn’t know what to do.", "chinese": "這些孩子們感到頭暈目眩，不知道該做什麼。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞", "roles": [{"label": "主詞", "text": "These children"}, {"label": "動詞", "text": "felt"}, {"label": "補語", "text": "dizzy and didn’t know what to do."}]}, {"english": "However, as soon as the orchestra began to play, everyone cheered.", "chinese": "然而，當管弦樂團開始演奏時，所有人都歡呼起來。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞", "roles": [{"label": "修飾語", "text": "However,"}, {"label": "主詞", "text": "as soon as the orchestra began to play, everyone"}, {"label": "動詞", "text": "cheered"}, {"label": "受詞", "text": "."}]}, {"english": "When Ada and her friends bowed to the crowd at the end, they knew that the performance was a triumph.", "chinese": "當Ada和朋友們在最後向觀眾鞠躬時，他們明白這次表演非常成功。", "pattern": "S/V", "analysis": "that 子句：留意名詞子句或關係子句 副詞子句：主從句時態與連接詞 不定詞：to＋原形動詞", "roles": [{"label": "連接詞", "text": "When"}, {"label": "主詞", "text": "Ada and her friends bowed to the crowd at the end, they knew that the performance"}, {"label": "動詞", "text": "was a"}, {"label": "補語", "text": "triumph."}]}, {"english": "Touring overseas changed their lives in other ways, too.", "chinese": "海外巡演也以其他方式改變他們的生活。", "pattern": "S/V/O(C)", "analysis": "V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "修飾語", "text": "Touring overseas changed their lives in other ways,"}, {"label": "補語／片語", "text": "too."}]}, {"english": "With the money they earned, Ada and her friends had larger, safer houses built for their families.", "chinese": "Ada和朋友們用賺來的錢為家人蓋了較大、較安全的房子。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "修飾語", "text": "With the money they earned,"}, {"label": "補語／片語", "text": "Ada and her friends had larger, safer houses built for their families."}]}, {"english": "More importantly, they showed the locals that children’s dreams didn’t have to end up in the trash.", "chinese": "更重要的是，他們向當地人證明孩子們的夢想不必埋沒在垃圾堆中。", "pattern": "S/V/O(C)", "analysis": "that 子句：留意名詞子句或關係子句 不定詞：to＋原形動詞", "roles": [{"label": "修飾語", "text": "More importantly,"}, {"label": "主詞", "text": "they"}, {"label": "動詞", "text": "showed"}, {"label": "受詞", "text": "the locals that children’s dreams didn’t have to end up in the trash."}]}, {"english": "Through determination and hard work, these children were able to create beauty out of garbage and have faith in their abilities to pursue greater things.", "chinese": "透過決心和努力，這群孩子能夠從垃圾中創造出美，並對他們追求更美好事物的能力具有信心。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞", "roles": [{"label": "修飾語", "text": "Through determination and hard work,"}, {"label": "主詞", "text": "these children"}, {"label": "動詞", "text": "were able to create"}, {"label": "補語", "text": "beauty out of garbage and have faith in their abilities to pursue greater things."}]}], "vocabulary": [{"word": "triumph", "definition": "勝利；成就 a great success or achievement"}, {"word": "n.", "definition": "因勝利而產生的）喜悅；得意"}, {"word": "apply", "definition": "申請；報名 (applied—applied—applying) to officially request something, such as a job or a place at a university"}, {"word": "application", "definition": "申請；申請書"}, {"word": "applicant", "definition": "申請人"}, {"word": "instrument", "definition": "樂器 an item whose main use is to make music, such as a guitar or violin"}, {"word": "somehow", "definition": "以某種方式；不知怎麼地 in a manner that is not clear or cannot be easily understood"}, {"word": "barely", "definition": "幾乎不 almost not"}, {"word": "bare", "definition": "赤裸的"}, {"word": "invaluable", "definition": "非常寶貴的 very important or useful"}, {"word": "encouragement", "definition": "鼓勵；鼓舞 words or actions that make a person feel more confident about doing something"}, {"word": "encourage", "definition": "鼓勵"}, {"word": "discourage", "definition": "阻止；勸阻"}, {"word": "concert", "definition": "音樂會 a musical performance or show given in a public place"}, {"word": "receive", "definition": "收到；獲得 to be sent or given something"}, {"word": "dazzle", "definition": "使讚嘆；使傾倒 to amaze someone with a particularly impressive quality"}, {"word": "potential", "definition": "潛力 qualities that could be developed and bring a person success"}, {"word": "scream", "definition": "尖叫 a loud high cry one makes when he or she is hurt, frightened, excited, etc."}, {"word": "dizzy", "definition": "頭暈目眩的 feeling that you are losing your balance and that everything is spinning around"}, {"word": "overseas", "definition": "在海外；到海外 in or to a foreign country, usually one across an ocean"}, {"word": "determination", "definition": "決心 the quality that makes someone keep trying to achieve something difficult"}, {"word": "determine", "definition": "決定；影響"}, {"word": "faith", "definition": "信心；信任 trust in something or confidence that someone will do something specific"}, {"word": "faithful", "definition": "忠誠的；忠實的"}, {"word": "pursue", "definition": "追求；從事 to do something or seek to achieve something, often over a long period"}, {"word": "pursuit", "definition": "追求"}, {"word": "slum", "definition": "貧民窟"}, {"word": "Cateura landfill", "definition": "卡特烏拉垃圾掩埋場（位於亞松森市郊，為巴拉圭最大的垃圾掩埋場）"}, {"word": "Paraguay", "definition": "巴拉圭"}, {"word": "unload", "definition": "從車上）卸下"}, {"word": "screech", "definition": "尖銳刺耳的聲音"}, {"word": "harmoniously", "definition": "和諧地"}, {"word": "orchestra", "definition": "管弦樂團"}, {"word": "glaring", "definition": "刺眼的；炫目的"}]}, {"id": "L8", "title": "Lesson 8 · Convenience Stores", "exercises": [{"english": "It has probably happened to you before.", "chinese": "你以前大概也發生過這種事。", "pattern": "S/V/O(C)", "analysis": "完成式：have/has/had＋p.p. 不定詞：to＋原形動詞", "roles": [{"label": "主詞", "text": "It"}, {"label": "動詞", "text": "has probably"}, {"label": "受詞", "text": "happened to you before."}]}, {"english": "The glass doors of the convenience store slide open invitingly; you hear the familiar “Welcome!” and enter just to pick up one item.", "chinese": "便利商店的玻璃門誘人地滑開；你聽見熟悉的「歡迎光臨！」，然後走進去只為了買一樣東西。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞", "roles": [{"label": "補語／片語", "text": "The glass doors of the convenience store slide open invitingly; you hear the familiar “Welcome!” and enter just to pick up one item."}]}, {"english": "A few minutes later, you walk out with a whole bag full of drinks, snacks, and other goodies you never even thought of buying!", "chinese": "幾分鐘後，你走出來，手上拿著整袋飲料、點心，以及其他你甚至從未想過要買的好東西！", "pattern": "S/V/O(C)", "analysis": "V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "修飾語", "text": "A few minutes later,"}, {"label": "主詞", "text": "you walk out with a whole bag full of drinks, snacks, and other goodies you never even"}, {"label": "動詞", "text": "thought"}, {"label": "受詞", "text": "of buying!"}]}, {"english": "There’s no need to be embarrassed if you’ve experienced this sudden urge to shop.", "chinese": "如果你曾經歷過這種突然想購物的衝動，不需要感到不好意思。", "pattern": "S/V/O(C)", "analysis": "被動語態：be＋p.p. 不定詞：to＋原形動詞", "roles": [{"label": "主詞", "text": "There’s no"}, {"label": "動詞", "text": "need to"}, {"label": "受詞", "text": "be embarrassed if you’ve experienced this sudden urge to shop."}]}, {"english": "Convenience stores use certain strategies to make you feel this way.", "chinese": "便利商店運用某些策略，讓你有這樣子的感覺。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞", "roles": [{"label": "主詞", "text": "Convenience stores"}, {"label": "動詞", "text": "use"}, {"label": "受詞", "text": "certain strategies to make you feel this way."}]}, {"english": "One of these strategies is to follow the “eye level is buy level” rule.", "chinese": "其中一項策略，就是遵循「視線高度等於購買高度」的規則。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞", "roles": [{"label": "主詞", "text": "One of these strategies"}, {"label": "動詞", "text": "is to"}, {"label": "補語", "text": "follow the “eye level is buy level” rule."}]}, {"english": "The more visible the products are, the easier it is for shoppers to notice and purchase them.", "chinese": "商品愈容易被看見，顧客愈容易注意並購買它們。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞", "roles": [{"label": "修飾語", "text": "The more visible the products are,"}, {"label": "主詞", "text": "the easier it"}, {"label": "動詞", "text": "is"}, {"label": "補語", "text": "for shoppers to notice and purchase them."}]}, {"english": "Therefore, smart shop owners usually place their most profitable and popular items at the average shopper’s eye level to make sure that those items are most likely to be seen.", "chinese": "因此，聰明的店主通常把他們最有利潤及最受歡迎的商品，擺放在一般顧客的視線高度以確保那些商品最有可能被看見。", "pattern": "S/V/O(C)", "analysis": "that 子句：留意名詞子句或關係子句 不定詞：to＋原形動詞", "roles": [{"label": "修飾語", "text": "Therefore,"}, {"label": "主詞", "text": "smart shop owners"}, {"label": "動詞", "text": "usually place"}, {"label": "受詞", "text": "their most profitable and popular items at the average shopper’s eye level to make sure that those items are most likely to be seen."}]}, {"english": "Similarly, products that are aimed at children, such as toys, are placed on lower shelves so that younger shoppers will surely see them.", "chinese": "同樣地，以兒童為對象的商品，比如玩具，則被放在較低的貨架以便讓年紀較小的顧客一定會看見它們。", "pattern": "S/V/O(C)", "analysis": "被動語態：be＋p.p. that 子句：留意名詞子句或關係子句 情態助動詞＋原形動詞", "roles": [{"label": "修飾語", "text": "Similarly,"}, {"label": "主詞", "text": "products that are aimed at children, such as toys,"}, {"label": "動詞", "text": "are placed"}, {"label": "補語", "text": "on lower shelves so that younger shoppers will surely see them."}]}, {"english": "Another eye-catching convenience store strategy is to promote impulse purchases of small, cheap items like candy bars.", "chinese": "另一項引人注目的便利商店策略是提高對便宜小物的衝動購物，比如糖果棒。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞 V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "補語／片語", "text": "Another eye - catching convenience store strategy is to promote impulse purchases of small, cheap items like candy bars."}]}, {"english": "These are displayed near cash registers and are thus easily noticed and within quick reach.", "chinese": "這些商品會被展示於靠近收銀機的地方，因此容易被注意，而且可以快速取得。", "pattern": "S/V/O(C)", "analysis": "被動語態：be＋p.p.", "roles": [{"label": "主詞", "text": "These"}, {"label": "動詞", "text": "are displayed"}, {"label": "補語", "text": "near cash registers and are thus easily noticed and within quick reach."}]}, {"english": "Special offers, like “buy one, get one free,” make such little “extras” even more attractive.", "chinese": "商品特價，像是「買一送一」，使這些小的「額外東西」更加吸引人。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "修飾語", "text": "Special offers,"}, {"label": "主詞", "text": "like “buy one, get one free,”"}, {"label": "動詞", "text": "make"}, {"label": "受詞", "text": "such little “extras” even more attractive."}]}, {"english": "Since customers are lining up at cash registers to pay for their things anyway, these items can easily be grabbed and added to their shopping baskets on impulse.", "chinese": "反正因為顧客們正在收銀機排隊以便為他們所買的東西付錢，這些商品可以容易被取得，然後被一時衝動加到他們的購物籃裡。", "pattern": "S/V", "analysis": "被動語態：be＋p.p. 副詞子句：主從句時態與連接詞 不定詞：to＋原形動詞", "roles": [{"label": "連接詞", "text": "Since"}, {"label": "主詞", "text": "customers are lining up at cash registers to pay for their things anyway, these items"}, {"label": "動詞", "text": "can easily"}, {"label": "受詞", "text": "be grabbed and added to their shopping baskets on impulse."}]}, {"english": "A third strategy is to make customers spend more time in stores so that they will spend more money, too.", "chinese": "第三個策略是使顧客在店裡面花更多的時間，他們因此也會花更多的錢。", "pattern": "S/V/O(C)", "analysis": "that 子句：留意名詞子句或關係子句 不定詞：to＋原形動詞 情態助動詞＋原形動詞", "roles": [{"label": "補語／片語", "text": "A third strategy is to make customers spend more time in stores so that they will spend more money, too."}]}, {"english": "Studies have shown that the longer people stay inside, the more products they buy.", "chinese": "研究已經顯示，人們在店裡待得愈久，他們會買愈多的產品。", "pattern": "S/V/O(C)", "analysis": "that 子句：留意名詞子句或關係子句", "roles": [{"label": "主詞", "text": "Studies have shown that the longer people stay inside, the more products they"}, {"label": "動詞", "text": "buy"}, {"label": "受詞", "text": "."}]}, {"english": "Shops take advantage of this by setting up bar-style seating or dining areas.", "chinese": "便利商店利用這點，設立吧檯式的座位或是用餐區。", "pattern": "S/V/O(C)", "analysis": "V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "主詞", "text": "Shops"}, {"label": "動詞", "text": "take"}, {"label": "受詞", "text": "advantage of this by setting up bar - style seating or dining areas."}]}, {"english": "Here, people can read the paper, hold a meeting, or just hang out.", "chinese": "在這裡，人們可以看報紙、舉行會議，或只是消磨時間。", "pattern": "S/V/O(C)", "analysis": "V-ing：動名詞或分詞，依句中功能判斷 情態助動詞＋原形動詞", "roles": [{"label": "修飾語", "text": "Here,"}, {"label": "補語／片語", "text": "people can read the paper, hold a meeting, or just hang out."}]}, {"english": "Although these customers might start off with just a beverage, they often grow hungry over time.", "chinese": "雖然這些顧客可能開始只是買個飲料，他們時常隨著時間過去而變餓。", "pattern": "S/V/O(C)", "analysis": "副詞子句：主從句時態與連接詞 情態助動詞＋原形動詞", "roles": [{"label": "連接詞", "text": "Although"}, {"label": "補語／片語", "text": "these customers might start off with just a beverage, they often grow hungry over time."}]}, {"english": "Eventually, they end up purchasing more things like microwave dinners and fruit packs.", "chinese": "最後，他們會買更多東西，像是微波晚餐以及盒裝水果。", "pattern": "S/V/O(C)", "analysis": "V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "修飾語", "text": "Eventually,"}, {"label": "補語／片語", "text": "they end up purchasing more things like microwave dinners and fruit packs."}]}, {"english": "To avoid falling into any of the traps above, try to be more aware of the clever strategies convenience stores use to get deeper into your pocket.", "chinese": "為了避免落入任何以上的圈套，設法對這些便利商店用來深入你口袋的聰明策略更加警覺。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞 V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "修飾語", "text": "To avoid falling into any of the traps"}, {"label": "主詞", "text": "above,"}, {"label": "動詞", "text": "try to"}, {"label": "受詞", "text": "be more aware of the clever strategies convenience stores use to get deeper into your pocket."}]}, {"english": "If you can always remember the tricks that shop owners use, you won’t have to worry about spending too much!", "chinese": "如果你可以總是記得這些店主們使用的伎倆，你將不需要擔心花太多錢！", "pattern": "S/V", "analysis": "that 子句：留意名詞子句或關係子句 副詞子句：主從句時態與連接詞 不定詞：to＋原形動詞", "roles": [{"label": "連接詞", "text": "If"}, {"label": "主詞", "text": "you can always remember the tricks that shop owners use, you won’t"}, {"label": "動詞", "text": "have to"}, {"label": "受詞", "text": "worry about spending too much!"}]}], "vocabulary": [{"word": "familiar", "definition": "熟悉的 well-known to someone, usually because that thing or person has often been seen or heard"}, {"word": "urge", "definition": "衝動 a strong desire to do something"}, {"word": "strategy", "definition": "策略 a plan or method used to achieve a certain aim"}, {"word": "visible", "definition": "看得見的 able to be seen"}, {"word": "purchase", "definition": "購買 to buy"}, {"word": "profitable", "definition": "有利潤的 (used for a product or business activity) able to make money"}, {"word": "profit", "definition": "獲得好處"}, {"word": "similarly", "definition": "同樣地；相似地 used to indicate that two or more facts, actions, statements, etc. are almost the same"}, {"word": "similar", "definition": "相似的"}, {"word": "similarity", "definition": "相似性；相似處"}, {"word": "aim", "definition": "針對；對象是 to direct something, such as information, a product, or some action, at a certain person or group of people"}, {"word": "impulse", "definition": "衝動 a sudden urge to do something, usually without thinking about the possible results"}, {"word": "display", "definition": "展示；陳列 to put something somewhere so people can easily see it"}, {"word": "offer", "definition": "特價 a discounted price for something, usually for a short period of time"}, {"word": "customer", "definition": "顧客；客戶 a person or company that buys goods or services from a shop or business"}, {"word": "advantage", "definition": "優勢；有利條件 something that helps one be better or more successful than others"}, {"word": "eventually", "definition": "最後 in the end, usually after a long period of time or many difficulties"}, {"word": "eventual", "definition": "最後的"}, {"word": "trap", "definition": "圈套 a plan to trick people, either by catching them or by making them do something they don’t want to"}, {"word": "aware", "definition": "知道；意識到 knowing or realizing something"}, {"word": "awareness", "definition": "意識；認識"}, {"word": "clever", "definition": "聰明的 showing or done in a way that shows intelligent thinking"}, {"word": "invitingly", "definition": "誘人地"}, {"word": "goody", "definition": "糖果；好吃的東西"}, {"word": "eye level", "definition": "視線高度"}, {"word": "eye-catching", "definition": "引人注目的"}, {"word": "cash register", "definition": "收銀機"}, {"word": "seating", "definition": "座位"}, {"word": "beverage", "definition": "飲料"}]}, {"id": "L9", "title": "Lesson 9 · Fighting for or against Graffiti", "exercises": [{"english": "When people draw or spray-paint pictures or words onto a wall, under bridges, or even on the sides of buses and trains, these pictures or words are called graffiti.", "chinese": "當人們用畫圖或用噴漆的方式將圖畫或文字噴到一面牆、橋底下、或甚至在公車或火車的兩側時，這些圖或字就叫作塗鴉。", "pattern": "S/V", "analysis": "被動語態：be＋p.p. 副詞子句：主從句時態與連接詞", "roles": [{"label": "連接詞", "text": "When"}, {"label": "主詞", "text": "people draw or spray - paint pictures or words onto a wall, under bridges, or even on the sides of buses and trains, these pictures or words"}, {"label": "動詞", "text": "are called"}, {"label": "補語", "text": "graffiti."}]}, {"english": "It comes in all shapes and sizes, from simple words to detailed paintings.", "chinese": "塗鴉有各種不同的形狀和尺寸，從簡單的文字到細節詳實的畫作都有。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞", "roles": [{"label": "修飾語", "text": "It comes in all shapes and sizes,"}, {"label": "主詞", "text": "from simple words to"}, {"label": "動詞", "text": "detailed"}, {"label": "受詞", "text": "paintings."}]}, {"english": "Some love it, while others hate it.", "chinese": "有些人很喜歡，而有些人卻很討厭它。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "修飾語", "text": "Some love it,"}, {"label": "補語／片語", "text": "while others hate it."}]}, {"english": "The question is: Is graffiti a form of art or just a mess?", "chinese": "問題是：塗鴉是一種藝術形式或只是一團亂？", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "主詞", "text": "The question"}, {"label": "動詞", "text": "is: Is graffiti"}, {"label": "補語", "text": "a form of art or just a mess?"}]}, {"english": "Graffiti is obviously art.", "chinese": "塗鴉顯然地是藝術。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "主詞", "text": "Graffiti"}, {"label": "動詞", "text": "is obviously"}, {"label": "補語", "text": "art."}]}, {"english": "First, it takes a lot of time and hard work.", "chinese": "首先，它很需要很多的時間和努力。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "修飾語", "text": "First,"}, {"label": "主詞", "text": "it takes a lot of time and hard"}, {"label": "動詞", "text": "work"}, {"label": "受詞", "text": "."}]}, {"english": "It is not just scribbling.", "chinese": "它不只是隨便亂塗一通。", "pattern": "S/V/O(C)", "analysis": "V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "主詞", "text": "It"}, {"label": "動詞", "text": "is not just"}, {"label": "補語", "text": "scribbling."}]}, {"english": "Graffiti artists are like other painters.", "chinese": "塗鴉藝術家就像其他的畫家一樣。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "主詞", "text": "Graffiti artists"}, {"label": "動詞", "text": "are"}, {"label": "補語", "text": "like other painters."}]}, {"english": "Their art starts as sketches and outlines, perfected with vivid pictures and various details later.", "chinese": "他們的藝術從素描和輪廓開始，然後以鮮豔的圖像以及多樣的細節使之完美。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "修飾語", "text": "Their art starts as sketches and outlines,"}, {"label": "補語／片語", "text": "perfected with vivid pictures and various details later."}]}, {"english": "The only difference is that they paint on walls rather than on paper.", "chinese": "唯一不同的是他們是畫在牆上而不是紙上。", "pattern": "S/V/O(C)", "analysis": "that 子句：留意名詞子句或關係子句", "roles": [{"label": "主詞", "text": "The only difference"}, {"label": "動詞", "text": "is"}, {"label": "補語", "text": "that they paint on walls rather than on paper."}]}, {"english": "Second, like other art forms, graffiti is about expressing one’s feelings and being creative.", "chinese": "第二，就像是其他藝術形式一樣，塗鴉是把一個人的情感表達出來並具有創意。", "pattern": "S/V/O(C)", "analysis": "V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "修飾語", "text": "Second,"}, {"label": "主詞", "text": "like other art forms, graffiti"}, {"label": "動詞", "text": "is"}, {"label": "補語", "text": "about expressing one’s feelings and being creative."}]}, {"english": "Banksy, for example, is a famous graffiti artist who paints to show his opinions.", "chinese": "舉例來說，Banksy是一位有名的塗鴉藝術家，而他用畫來表達他的意見。", "pattern": "S/V/O(C)", "analysis": "關係子句：who/which 修飾先行詞 不定詞：to＋原形動詞", "roles": [{"label": "修飾語", "text": "Banksy,"}, {"label": "主詞", "text": "for example,"}, {"label": "動詞", "text": "is a"}, {"label": "補語", "text": "famous graffiti artist who paints to show his opinions."}]}, {"english": "Many of his works contrast the horror of war with the innocence of children.", "chinese": "他的許多作品將戰爭的恐怖和孩子們的無辜做對比。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "主詞", "text": "Many of his"}, {"label": "動詞", "text": "works"}, {"label": "受詞", "text": "contrast the horror of war with the innocence of children."}]}, {"english": "In one of his pieces, a young boy places a flower into a soldier’s gun.", "chinese": "在他的一件作品中，有一個小男孩把一朵花放進了一位軍人的槍裡面。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "修飾語", "text": "In one of his pieces,"}, {"label": "主詞", "text": "a young boy"}, {"label": "動詞", "text": "places"}, {"label": "受詞", "text": "a flower into a soldier’s gun."}]}, {"english": "The gun represents violence, whereas the flower stands for peace.", "chinese": "這把槍代表著暴力，而這朵花代表著和平。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "修飾語", "text": "The gun represents violence,"}, {"label": "補語／片語", "text": "whereas the flower stands for peace."}]}, {"english": "Works like this call attention to the need for positive change in the world.", "chinese": "像這樣的作品可以引起人們注意到在世界上做出正向改變的需要。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞", "roles": [{"label": "主詞", "text": "Works like this"}, {"label": "動詞", "text": "call"}, {"label": "受詞", "text": "attention to the need for positive change in the world."}]}, {"english": "Isn’t it art?", "chinese": "這難道不是藝術嗎？", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "補語／片語", "text": "Isn’t it art?"}]}, {"english": "Graffiti makes a mess.", "chinese": "塗鴉造成混亂。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "主詞", "text": "Graffiti"}, {"label": "動詞", "text": "makes"}, {"label": "受詞", "text": "a mess."}]}, {"english": "It is nothing but visual pollution.", "chinese": "它只不過是視覺上的汙染。", "pattern": "S/V/O(C)", "analysis": "V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "主詞", "text": "It"}, {"label": "動詞", "text": "is nothing"}, {"label": "補語", "text": "but visual pollution."}]}, {"english": "Most graffiti is “tagging,” which is more like just scribbling someone’s name.", "chinese": "大部分的塗鴉只是留下表明身分的名字，比較像只是塗上某個人的名字。", "pattern": "S/V/O(C)", "analysis": "關係子句：who/which 修飾先行詞 V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "主詞", "text": "Most graffiti"}, {"label": "動詞", "text": "is “"}, {"label": "補語", "text": "tagging,” which is more like just scribbling someone’s name."}]}, {"english": e that graffiti is associated with criminal activity, feeling that it is unsafe to walk around or live in areas with graffiti.", "chinese": "許多人相信塗鴉和犯罪的活動有關，並覺得走在那些有塗鴉的地方或住在那些地方是不安全的。", "pattern": "S/V/O(C)", "analysis": "被動語態：be＋p.p. that 子句：留意名詞子句或關係子句 不定詞：to＋原形動詞", "roles": [{"label": "主詞", "text": "Many people believe that graffiti is associated with criminal activity, feeling that it"}, {"label": "動詞", "text": "is unsafe to"}, {"label": "補語", "text": "walk around or live in areas with graffiti."}]}, {"english": "If graffiti causes all these problems, can we really call it art?", "chinese": "如果塗鴉造成這些問題，我們真的能稱它為藝術嗎？", "pattern": "S/V", "analysis": "副詞子句：主從句時態與連接詞 情態助動詞＋原形動詞", "roles": [{"label": "連接詞", "text": "If"}, {"label": "修飾語", "text": "graffiti causes all these problems,"}, {"label": "主詞", "text": "can we"}, {"label": "動詞", "text": "really call"}, {"label": "受詞", "text": "it art?"}]}, {"english": "Which side of the wall are you on when it comes to graffiti?", "chinese": "當談到塗鴉時，你是站在這兩面向的哪一方呢？", "pattern": "S/V/O(C)", "analysis": "關係子句：who/which 修飾先行詞 不定詞：to＋原形動詞", "roles": [{"label": "連接詞", "text": "Which"}, {"label": "主詞", "text": "side of the wall"}, {"label": "動詞", "text": "are you"}, {"label": "補語", "text": "on when it comes to graffiti?"}]}, {"english": "Is it creative or destructive?", "chinese": "它是具有創造力的還是具有破壞性的呢？", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "補語／片語", "text": "Is it creative or destructive?"}]}, {"english": "Now, it’s your turn to express yourself and share your thoughts about it!", "chinese": "現在輪到你來表達你自己的意見，並分享你對它的想法吧！", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞", "roles": [{"label": "修飾語", "text": "Now,"}, {"label": "主詞", "text": "it’s your"}, {"label": "動詞", "text": "turn to"}, {"label": "受詞", "text": "express yourself and share your thoughts about it!"}]}], "vocabulary": [{"word": "detailed", "definition": "詳細的；細緻的 having features or a lot of information; paying a lot of attention to features or information"}, {"word": "detail", "definition": "細節"}, {"word": "mess", "definition": "凌亂；髒亂 a dirty or disorganized condition in a certain place"}, {"word": "messy", "definition": "凌亂的；髒亂的"}, {"word": "express", "definition": "表達 to share a feeling or idea using words, actions, artworks, etc."}, {"word": "expression", "definition": "表達"}, {"word": "opinion", "definition": "想法；意見 one’s ideas or views about someone or something, which may or may not be true"}, {"word": "contrast", "definition": "對比；對照 to compare two things by showing their differences"}, {"word": "horror", "definition": "可怕；恐怖 something that causes fear, shock, or disgust"}, {"word": "n.", "definition": "恐懼"}, {"word": "horrible", "definition": "可怕的；令人害怕的"}, {"word": "horrify", "definition": "使人恐懼；驚嚇"}, {"word": "innocent", "definition": "無辜的；純真的"}, {"word": "violence", "definition": "暴力 behavior or actions that are meant to hurt or kill a person or other living things"}, {"word": "violent", "definition": "暴力的"}, {"word": "visual", "definition": "視覺的 related to seeing or sight"}, {"word": "pollution", "definition": "汙染 the process or state of air, water, soil, etc. becoming or being dirty"}, {"word": "pollute", "definition": "汙染"}, {"word": "permission", "definition": "許可；准許 the act of letting someone do something, usually in a formal or official way"}, {"word": "permit", "definition": "許可；准許"}, {"word": "effort", "definition": "努力 the physical or mental energy required to do something"}, {"word": "community", "definition": "社區 a place and all the people who live there"}, {"word": "associate", "definition": "聯想 to make a connection between two things or people in your mind"}, {"word": "association", "definition": "聯想"}, {"word": "criminal", "definition": "犯罪的 connected with or involving things that are against the law"}, {"word": "crime", "definition": "犯罪行為"}, {"word": "destructive", "definition": "破壞性的；毀滅性的 causing a lot of damage"}, {"word": "destroy", "definition": "破壞；毀滅"}, {"word": "destruction", "definition": "破壞；毀滅"}, {"word": "graffiti", "definition": "塗鴉（為集合名詞，亦可為複數名詞）"}, {"word": "spray-paint", "definition": "噴漆"}, {"word": "scribble", "definition": "亂畫；潦草地寫"}, {"word": "sketch", "definition": "素描；速寫"}, {"word": "outline", "definition": "輪廓"}, {"word": "Banksy", "definition": "班克斯（英國塗鴉藝術家）"}, {"word": "tagging", "definition": "用塗鴉留下名字或某個表明身分的圖形"}, {"word": "Los Angeles", "definition": "洛杉磯（位於美國加利福尼亞州，為美國第二大都市）"}, {"word": "square", "definition": "表示面積單位）平方的"}]}];</script>
<script>
(()=>{const STORE='b1-group-workbook-v5';let saved=JSON.parse(localStorage.getItem(STORE)||'{}');let lesson=0,type=null;
const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hash(s){let h=0;for(const c of s)h=((h<<5)-h)+c.charCodeAt(0)|0;return Math.abs(h)}
function blank(sentence){const words=sentence.match(/[A-Za-z]+(?:['’-][A-Za-z]+)*/g)||[],pool=words.filter(w=>w.length>=5),answer=(pool.length?pool:words)[hash(sentence)%(pool.length||words.length)]||'';return{answer,prompt:sentence.replace(new RegExp(answer.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')),'__BLANK__')}}
function speak(text){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}
function normalize(s){return String(s||'').toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9']/g,'')}
function renderLessons(){$('#lessons').innerHTML=DATA.map((x,i)=>`<button class="lesson ${i===lesson?'active':''}" data-lesson="${i}">${x.id}</button>`).join('')}
function renderProgress(){const total=DATA.length*5,done=Object.keys(saved).filter(k=>saved[k]).length;$('#fill').style.width=(done/total*100)+'%';$('#stat').textContent=`完成題組 ${done} / ${total}`}
function menu(){type=null;const l=DATA[lesson],n=l.exercises.length,v=l.vocabulary.length;$('#card').className='card menu-card';$('#card').innerHTML=`<h2 class="menu-title">${esc(l.title)}</h2><p class="menu-sub">每個大題一次完整呈現，依照習作順序作答。</p><div class="type-grid"><button class="type-card" data-type="vocab"><span class="type-icon">🔤</span><h3>一、單字語境填空</h3><p>依原課文句子及字庫完成整組填空。</p><span class="type-count">${v} 題・整組呈現</span></button><button class="type-card" data-type="cloze"><span class="type-icon">📄</span><h3>二、整篇克漏字</h3><p>整篇文章填空，附逐句彩色結構樹。</p><span class="type-count">${n} 格・整篇呈現</span></button><button class="type-card" data-type="translate"><span class="type-icon">✍️</span><h3>三、中翻英</h3><p>整組中文句子與作答欄一次呈現。</p><span class="type-count">${n} 題・整組呈現</span></button><button class="type-card" data-type="reading"><span class="type-icon">📖</span><h3>四、閱讀測驗</h3><p>完整文章、閱讀題及逐句解析。</p><span class="type-count">文章＋5 題</span></button><button class="type-card" data-type="combine"><span class="type-icon">🔗</span><h3>五、句型合併題</h3><p>依提示合併句子，附結構與文法解析。</p><span class="type-count">整組呈現</span></button></div>`;renderLessons();renderProgress()}
function passageHTML(withBlanks=false){const qs=DATA[lesson].exercises;let out='';for(let p=0;p<qs.length;p+=4){out+='<p class="article-paragraph">';out+=qs.slice(p,p+4).map((q,j)=>{const i=p+j;let english=esc(q.english);if(withBlanks){const b=blank(q.english),parts=b.prompt.split('__BLANK__');english=`${esc(parts[0])}<input class="inline-blank" data-answer="${esc(b.answer)}" aria-label="第 ${i+1} 格">${esc(parts[1]||'')}`}const roles=(q.roles||[]).map(r=>`<span class="role ${roleClass(r.label)}"><b>${esc(r.label)}</b>${esc(r.text)}</span>`).join('');return `<span class="sentence-unit"><span class="sentence-top"><span class="sentence-text">${english}</span><button class="speak-inline" data-say="${esc(q.english)}" aria-label="朗讀第 ${i+1} 句">🔊</button><button class="speak-inline tree-button" data-tree aria-label="查看第 ${i+1} 句結構">🌳</button></span><span class="sentence-translation">${esc(q.chinese)}</span><span class="sentence-tree"><span class="roles">${roles}</span><span class="inline-grammar">${esc(q.analysis)}</span></span></span>`}).join('');out+='</p>'}return out}
function roleClass(label){if(label.includes('主詞'))return'role-subj';if(label.includes('動詞'))return'role-verb';if(label.includes('受詞'))return'role-obj';if(label.includes('補語'))return'role-comp';if(label.includes('連接'))return'role-conj';return'role-mod'}
function analysisList(){return `<section class="sentence-analysis"><h3>逐句雙語・彩色文法結構樹・解析</h3>${DATA[lesson].exercises.map((q,i)=>`<details class="parse-card"><summary>第 ${i+1} 句｜${esc(q.english)}</summary><div class="parse-body"><button class="speak-inline" data-say="${esc(q.english)}">🔊 英文</button><p class="parse-en">${esc(q.english)}</p><p class="parse-zh">${esc(q.chinese)}</p><div class="roles">${(q.roles||[]).map(r=>`<span class="role ${roleClass(r.label)}"><b>${esc(r.label)}</b>${esc(r.text)}</span>`).join('')}</div><div class="grammar-note"><b>${esc(q.pattern||'句型解析')}</b><br>${esc(q.analysis)}</div></div></details>`).join('')}</section>`}
function roleTag(label){if(label.includes('主詞'))return'S';if(label.includes('動詞'))return'V';if(label.includes('受詞'))return'O';if(label.includes('補語'))return'C';if(label.includes('連接'))return'CONJ';return'M'}
function coloredSentence(q){return (q.roles||[]).map(r=>`<span class="syntax-token ${roleClass(r.label)}" title="${esc(r.label)}">${esc(r.text)}<sup class="role-tag">${roleTag(r.label)}</sup></span>`).join(' ')||esc(q.english)}
function diagnosticPassage(withBlanks=false){const qs=DATA[lesson].exercises;let html='';for(let p=0;p<qs.length;p+=4){html+='<p>';html+=qs.slice(p,p+4).map((q,j)=>{const i=p+j,b=blank(q.english);let plain=esc(q.english);if(withBlanks){const parts=b.prompt.split('__BLANK__');plain=`${esc(parts[0])}<input class="inline-blank" data-answer="${esc(b.answer)}" aria-label="第 ${i+1} 格">${esc(parts[1]||'')}`}return `<span class="diag-sentence"><span class="sentence-plain">${plain}</span><span class="sentence-colored">${coloredSentence(q)}</span><button class="speak-inline" data-say="${esc(q.english)}">🔊</button><button class="speak-inline tree-button" data-tree>🌳</button><span class="sentence-translation">${esc(q.chinese)}</span><span class="sentence-tree"><span class="roles">${(q.roles||[]).map(r=>`<span class="role ${roleClass(r.label)}"><b>${esc(r.label)}</b>${esc(r.text)}</span>`).join('')}</span><span class="inline-grammar">${esc(q.analysis)}</span></span> </span>`}).join('');html+='</p>'}return html}
function sheetHead(name,directions){return `<button class="back-menu" data-act="menu">← 返回本課習作菜單</button><section class="group-sheet"><header class="sheet-head"><h2>${esc(DATA[lesson].title)}</h2><div class="workbook-rule">${name}</div><div class="directions">${directions}</div></header>`}
function vocabSentence(v){const q=DATA[lesson].exercises.find(x=>x.english.toLowerCase().includes(v.word.toLowerCase()));if(!q)return `<b>${esc(v.definition)}</b>`;const parts=q.english.split(new RegExp('('+v.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','i'));return `${esc(parts[0])} <b>__________</b> ${esc(parts.slice(2).join(''))}<br><small>${esc(q.chinese)}</small>`}
function vocabSheet(){const l=DATA[lesson],words=[...l.vocabulary].sort((a,b)=>hash(a.word)-hash(b.word));return sheetHead('一、Vocabulary 單字語境填空','請從字庫選出適當單字，填入原課文句子的空格。點字庫單字可聽英文。')+`<div class="word-bank">${words.map(x=>`<button class="bank-word" data-say="${esc(x.word)}">${esc(x.word)} 🔊</button>`).join('')}</div><div class="worksheet-list">${l.vocabulary.map((x,i)=>`<div class="work-row"><span class="work-no">${i+1}.</span><span>${vocabSentence(x)}</span><input class="work-input" data-answer="${esc(x.word)}" aria-label="單字第 ${i+1} 題"></div>`).join('')}</div>${actions()}</section>`}
function passageTools(){return `<div class="passage-tools"><button class="passage-toggle" data-toggle="trees">🔍 顯示句子結構樹</button><button class="passage-toggle" data-toggle="translations">中 顯示逐句中譯</button></div>`}
function legend(){return `<div class="syntax-legend"><span class="role-subj">S 主詞</span><span class="role-verblk">V 動詞</span><span class="role-obj">O 受詞</span><span class="role-comp">C 補語</span><span class="role-mod">M 修飾語</span><span class="role-conj">CONJ 連接詞</span></div>`}
function clozeSheet(){const full=DATA[lesson].exercises.map(x=>x.english).join(' ');return sheetHead('二、Cloze Test 整篇克漏字','閱讀文章，在空格填入最適當的單字。')+`<div class="reading-passage-card"><div class="passage-titlebar"><h3>Reading Passage</h3>${legend()}</div>${passageTools()}<button class="speak-inline" data-say="${esc(full)}">🔊 朗讀整篇</button><article class="diag-passage">${diagnosticPassage(true)}</article></div>${actions()}</section>`}
function translateSheet(){const l=DATA[lesson];return sheetHead('三、Translation 中翻英','依照中文，將完整英文句子寫在作答欄中。')+`<div>${l.exercises.map((q,i)=>`<div class="translation-row"><label>${i+1}. ${esc(q.chinese)}</label><textarea class="translation-answer" data-answer="${esc(q.english)}" aria-label="中翻英第 ${i+1} 題"></textarea><button class="speak-inline" data-say="${esc(q.english)}">🔊 朗讀答案</button></div>`).join('')}</div>${actions()}</section>`}
function readingQuestions(){const l=DATA[lesson],picks=[0,.22,.45,.68,.9].map(x=>Math.min(l.exercises.length-1,Math.floor(x*l.exercises.length)));return picks.map((idx,qi)=>{const q=l.exercises[idx],others=l.exercises.filter((_,i)=>i!==idx).sort((a,b)=>hash(a.chinese+q.english)-hash(b.chinese+q.english)).slice(0,3),opts=[q,...others].sort((a,b)=>hash(q.english+a.chinese)-hash(q.english+b.chinese));return `<article class="reading-q" data-answer="${esc(q.chinese)}"><div class="question-kicker">第 ${qi+1} 題</div><h4>根據文章，下列哪一項最符合畫線句子的意思？</h4><div class="question-hint">細節題：回原文定位關鍵句，找語意相符的選項，排除拼湊或語意顛倒。</div><p class="evidence">“${esc(q.english)}” <button class="speak-inline" data-say="${esc(q.english)}">🔊</button></p>${opts.map((x,i)=>`<button class="reading-choice" data-choice="${esc(x.chinese)}"><b>${String.fromCharCode(65+i)}.</b> ${esc(x.chinese)}</button>`).join('')}<button class="explain-btn" data-explain>📘 查看解答與解析</button><div class="q-explanation"><div class="q-answer">✅ 正確答案：${esc(q.chinese)}</div><div class="q-meta"><div><b>題型</b><br>細節理解題</div><div><b>解題方法</b><br>定位題幹英文句，對照上下文與中文語意；正解完整保留原句關係。</div></div><div class="evidence-box"><b>📍 原文證據</b><br>${esc(q.english)}<br><span class="translation">${esc(q.chinese)}</span></div><div class="option-analysis"><b>選項解析</b>${opts.map((x,i)=>`<div class="option-line ${x===q?'correct-opt':''}">${String.fromCharCode(65+i)}. ${esc(x.chinese)} — ${x===q?'符合原文證據。':'來自其他句子，與本題定位句不符。'}</div>`).join('')}</div></div></article>`}).join('')}
function readingSheet(){const full=DATA[lesson].exercises.map(x=>x.english).join(' ');return sheetHead('四、Reading Comprehension 閱讀測驗','先閱讀文章，再回原文找證據完成題目。')+`<div class="reading-passage-card"><div class="passage-titlebar"><h3>Reading Passage · 彩色句構＋逐句翻譯</h3>${legend()}</div>${passageTools()}<button class="speak-inline" data-say="${esc(full)}">🔊 朗讀整篇</button><article class="diag-passage">${diagnosticPassage(false)}</article></div><section class="reading-section"><h3>Integrated Questions</h3><div class="section-sub">先回文章找證據，再選答案</div>${readingQuestions()}</section>${actions()}</section>`}
function combineItems(){return DATA[lesson].exercises.filter(q=>/,\s*(so|but|and|when|while|because|although|however)\b/i.test(q.english)||/\bthat\b/i.test(q.english)).slice(0,10)}
function combineSheet(){const qs=combineItems();return sheetHead('五、Sentence Combining 句型合併','依括號中的連接詞或句型提示，把兩個意思合併成原課文完整句。')+qs.map((q,i)=>{const m=q.english.match(/,\s*(so|but|and|when|while|because|although|however)\b/i),connector=m?m[1]:(q.english.includes(' that ')?'that':'適當連接詞'),parts=m?q.english.split(m[0]):q.english.split(/\bthat\b/i);return `<div class="combine-row"><b>${i+1}. Combine the sentences. <span class="connector">(${esc(connector)})</span></b><div class="combine-source"><span>${esc((parts[0]||'').trim())}</span><span>${esc((parts[1]||q.chinese).trim())}</span></div><textarea class="combine-answer" data-answer="${esc(q.english)}" aria-label="句型合併第 ${i+1} 題"></textarea><button class="speak-inline" data-say="${esc(q.english)}">🔊 朗讀答案</button><details class="parse-card"><summary>查看合併結構與解析</summary><div class="parse-body"><p class="parse-en">${esc(q.english)}</p><p class="parse-zh">${esc(q.chinese)}</p><div class="roles">${(q.roles||[]).map(r=>`<span class="role ${roleClass(r.label)}"><b>${esc(r.label)}</b>${esc(r.text)}</span>`).join('')}</div><div class="grammar-note">${esc(q.analysis)}</div></div></details></div>`}).join('')+actions()+'</section>'}
function actions(){return `<div class="result-box"></div><div class="group-actions"><button class="btn" data-act="grade">整組批改</button><button class="btn secondary" data-act="answers">顯示全部答案</button><button class="btn secondary" data-act="clear">清除重做</button></div>`}
function render(){const maps={vocab:vocabSheet,cloze:clozeSheet,translate:translateSheet,reading:readingSheet,combine:combineSheet};$('#card').className='';$('#card').innerHTML=maps[type]();renderLessons();renderProgress()}
function fields(){return [...document.querySelectorAll('[data-answer]')].filter(x=>x.matches('input,textarea,.reading-q'))}
function chosen(q){return q.querySelector('.reading-choice.selected')?.dataset.choice||''}
function grade(){let good=0;const fs=fields();fs.forEach(x=>{const answer=x.dataset.answer,value=x.matches('.reading-q')?chosen(x):x.value,ok=x.matches('textarea')?normalize(value)===normalize(answer):value.trim().toLowerCase()===answer.trim().toLowerCase();x.style.outline=ok?'2px solid #1c9664':'2px solid #c54a3b';if(ok)good++});const box=$('.result-box');box.classList.add('show');box.innerHTML=`<b>批改結果：${good} / ${fs.length}</b><br>${good===fs.length?'全部答對！':'紅框題目需要再訂正；可按「顯示全部答案」查看。'}`;if(good===fs.length){saved[`${DATA[lesson].id}-${type}`]=true;localStorage.setItem(STORE,JSON.stringify(saved));renderProgress()}}
function answers(){fields().forEach(x=>{if(x.matches('.reading-q')){x.querySelectorAll('.reading-choice').forEach(b=>{if(b.dataset.choice===x.dataset.answer)b.classList.add('correct')})}else x.value=x.dataset.answer});const box=$('.result-box');box.classList.add('show');box.innerHTML='<b>解答已標示。</b> 翻譯與句構可用文章上方按鈕分別開啟。'}
function clearAll(){fields().forEach(x=>{if(x.matches('.reading-q'))x.querySelectorAll('.reading-choice').forEach(b=>b.classList.remove('selected','correct','wrong'));else x.value='';x.style.outline=''});const sheet=document.querySelector('.group-sheet');sheet?.classList.remove('show-trees','show-translations');document.querySelectorAll('.passage-toggle').forEach(b=>b.classList.remove('active'));$('.result-box').classList.remove('show')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.say!==undefined){speak(b.dataset.say);return}if(b.dataset.tree!==undefined){b.closest('.diag-sentence')?.classList.toggle('color-open');return}if(b.dataset.explain!==undefined){const panel=b.nextElementSibling;panel?.classList.toggle('show');b.textContent=panel?.classList.contains('show')?'收合解答與解析':'📘 查看解答與解析';return}if(b.dataset.toggle){const sheet=document.querySelector('.group-sheet'),cls=b.dataset.toggle==='trees'?'show-trees':'show-translations';sheet?.classList.toggle(cls);b.classList.toggle('active');b.textContent=b.classList.contains('active')?(b.dataset.toggle==='trees'?'✓ 句子結構樹 已開啟':'✓ 逐句中譯 已開啟'):(b.dataset.toggle==='trees'?'🔍 顯示句子結構樹':'中 顯示逐句中譯');return}if(b.dataset.lesson!==undefined){lesson=+b.dataset.lesson;menu();return}if(b.dataset.type){type=b.dataset.type;render();return}if(b.classList.contains('reading-choice')){const q=b.closest('.reading-q');q.querySelectorAll('.reading-choice').forEach(x=>x.classList.toggle('selected',x===b));return}if(b.dataset.act==='menu')menu();if(b.dataset.act==='grade')grade();if(b.dataset.act==='answers')answers();if(b.dataset.act==='clear')clearAll()});menu()})();
</script></body></html>
