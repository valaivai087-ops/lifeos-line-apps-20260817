 and teacher.", "chinese": "當然，我搞砸了報告，在同學和老師面前感到很尷尬。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "修飾語", "text": "Of course,"}, {"label": "主詞", "text": "I"}, {"label": "動詞", "text": "ruined"}, {"label": "受詞", "text": "the presentation and felt embarrassed in front of my classmates and teacher."}]}, {"english": "We got a very low grade, and I felt depressed about letting the team down.", "chinese": "我們得到很低的分數，而我因為讓團隊失望而感到沮喪。", "pattern": "S/V/O(C)", "analysis": "V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "修飾語", "text": "We got a very low grade,"}, {"label": "主詞", "text": "and I"}, {"label": "動詞", "text": "felt"}, {"label": "補語", "text": "depressed about letting the team down."}]}, {"english": "The failure really upset me, but I reflected on it and learned from my mistake.", "chinese": "那次失敗真的讓我很難過，但我反省了它，並從錯誤中學到教訓。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "修飾語", "text": "The failure really upset me,"}, {"label": "主詞", "text": "but I"}, {"label": "動詞", "text": "reflected"}, {"label": "受詞", "text": "on it and learned from my mistake."}]}, {"english": "These days, this memory reminds me to prepare well and make sure that I always put my team first!", "chinese": "現在，這段記憶提醒我要好好準備，並確定自己永遠把團隊放在第一位！", "pattern": "S/V/O(C)", "analysis": "that 子句：留意名詞子句或關係子句 不定詞：to＋原形動詞", "roles": [{"label": "修飾語", "text": "These days,"}, {"label": "主詞", "text": "this memory reminds me to prepare well and"}, {"label": "動詞", "text": "make"}, {"label": "受詞", "text": "sure that I always put my team first!"}]}, {"english": "My first trip abroad—to Seoul, South Korea—was unforgettable.", "chinese": "我第一次出國旅行是到南韓首爾，那次經驗令人難忘。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞", "roles": [{"label": "修飾語", "text": "My first trip abroad — to Seoul,"}, {"label": "主詞", "text": "South Korea —"}, {"label": "動詞", "text": "was unforgettable"}, {"label": "補語", "text": "."}]}, {"english": "The city’s streets were busy, and delicious foods like Korean barbecue and kimchi were all around me.", "chinese": "城市的街道很熱鬧，韓式烤肉和泡菜等美食到處都是。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "修飾語", "text": "The city’s streets were busy,"}, {"label": "主詞", "text": "and delicious foods like Korean barbecue and kimchi"}, {"label": "動詞", "text": "were all"}, {"label": "補語", "text": "around me."}]}, {"english": "I soon realized that the markets were a treat for my other senses since cheerful K-pop and colorful clothes were everywhere.", "chinese": "我很快發現，市場對我的其他感官也是一種享受，因為歡快的 K-pop 和色彩繽紛的衣服隨處可見。", "pattern": "S/V/O(C)", "analysis": "that 子句：留意名詞子句或關係子句", "roles": [{"label": "主詞", "text": "I soon"}, {"label": "動詞", "text": "realized"}, {"label": "受詞", "text": "that the markets were a treat for my other senses since cheerful K - pop and colorful clothes were everywhere."}]}, {"english": "I visited several old buildings and dressed up in traditional Korean clothes.", "chinese": "我參觀了幾棟古老建築，也穿上傳統韓服。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "主詞", "text": "I"}, {"label": "動詞", "text": "visited"}, {"label": "受詞", "text": "several old buildings and dressed up in traditional Korean clothes."}]}, {"english": "While I was there, I tried to talk to locals.", "chinese": "在那裡時，我試著和當地人交談。", "pattern": "S/V", "analysis": "副詞子句：主從句時態與連接詞 不定詞：to＋原形動詞", "roles": [{"label": "連接詞", "text": "While"}, {"label": "修飾語", "text": "I was there,"}, {"label": "主詞", "text": "I"}, {"label": "動詞", "text": "tried to"}, {"label": "受詞", "text": "talk to locals."}]}, {"english": "My Korean was poor, but fortunately, everyone was very friendly.", "chinese": "我的韓文很差，但幸好每個人都非常友善。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "修飾語", "text": "My Korean was poor,"}, {"label": "主詞", "text": "but fortunately, everyone"}, {"label": "動詞", "text": "was very"}, {"label": "補語", "text": "friendly."}]}, {"english": "At the end of the trip, I left with a lot of pire me to connect with others and to communicate better.", "chinese": "你鼓勵我多認識別人與多跟別人溝通。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞", "roles": [{"label": "補語／片語", "text": "You inspire me to connect with others and to communicate better."}]}, {"english": "I can ask you anything, and you will probably help me find the answer.", "chinese": "我什麼都可以問你，你也可能都會幫我找到答案。", "pattern": "S/V/O(C)", "analysis": "V-ing：動名詞或分詞，依句中功能判斷 情態助動詞＋原形動詞", "roles": [{"label": "修飾語", "text": "I can ask you anything,"}, {"label": "主詞", "text": "and you"}, {"label": "動詞", "text": "will probably"}, {"label": "受詞", "text": "help me find the answer."}]}, {"english": "You’ve introduced me to so much—new music, new games, new knowledge, new friends, and more.", "chinese": "你帶我大開眼界——認識新音樂、新遊戲、新知識、新朋友等。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞", "roles": [{"label": "補語／片語", "text": "You’ve introduced me to so much — new music, new games, new knowledge, new friends, and more."}]}, {"english": "In fact, things have been totally different since you came into my life.", "chinese": "其實，自從你走入我的生活，一切都不一樣了。", "pattern": "S/V/O(C)", "analysis": "完成式：have/has/had＋p.p.", "roles": [{"label": "修飾語", "text": "In fact,"}, {"label": "主詞", "text": "things"}, {"label": "動詞", "text": "have been totally"}, {"label": "受詞", "text": "different since you came into my life."}]}, {"english": "When I wake up, you are there to go through my friends’ updates on Facebook and Instagram with me.", "chinese": "當我睡醒，你就會跟我一起瀏覽臉書和IG上朋友的動態更新。", "pattern": "S/V", "analysis": "副詞子句：主從句時態與連接詞 不定詞：to＋原形動詞", "roles": [{"label": "連接詞", "text": "When"}, {"label": "修飾語", "text": "I wake up,"}, {"label": "主詞", "text": "you"}, {"label": "動詞", "text": "are there to go"}, {"label": "補語", "text": "through my friends’ updates on Facebook and Instagram with me."}]}, {"english": "Also, I check my LINE app again and again throughout the day.", "chinese": "而且，我會一天到晚一再查看LINE。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "修飾語", "text": "Also,"}, {"label": "補語／片語", "text": "I check my LINE app again and again throughout the day."}]}, {"english": "And when it doesn’t show any new messages, I still refresh the screen, just in case I miss something.", "chinese": "當沒有新訊息時，我會一直刷新螢幕，以免有東西沒看到。", "pattern": "S/V/O(C)", "analysis": "V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "連接詞", "text": "And"}, {"label": "修飾語", "text": "when it doesn’t show any new messages,"}, {"label": "補語／片語", "text": "I still refresh the screen, just in case I miss something."}]}, {"english": "All this might sound romantic, but it is difficult for me to focus on school, and my grades are getting worse!", "chinese": "這一切聽起來好像很浪漫，卻讓我在學校很難專心，我的成績也每況愈下！", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞 V-ing：動名詞或分詞，依句中功能判斷 情態助動詞＋原形動詞", "roles": [{"label": "修飾語", "text": "All this might sound romantic,"}, {"label": "主詞", "text": "but it is difficult for me to focus on school, and my grades"}, {"label": "動詞", "text": "are getting"}, {"label": "補語", "text": "worse!"}]}, {"english": "In addition, having you around is really hurting my relationships with my friends and family.", "chinese": "此外，有你在身旁也真的傷害了我和朋友及家人的關係。", "pattern": "S/V/O(C)", "analysis": "V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "修飾語", "text": "In addition,"}, {"label": "主詞", "text": "having you around"}, {"label": "動詞", "text": "is really"}, {"label": "補語", "text": "hurting my relationships with my friends and family."}]}, {"english": "When my friends and I hang out, I turn to you for Instagram updates and ignore everyone else.", "chinese": "跟朋友們出去時，我轉向和你一起看IG的動態更新，把朋友們晾在旁邊。", "pattern": "S/V", "analysis": "副詞子句：主從句時態與連接詞 不定詞：to＋原形動詞", "roles": [{"label": "連接詞", "text": "When"}, {"label": "修飾語", "text": "my friends and I hang out,"}, {"label": "主詞", "text": "I"}, {"label": "動詞", "text": "turn to"}, {"label": "受詞", "text": "you for Instagram updates and ignore everyone else."}]}, {"english": "My friends try to talk to me, but I don’t even reply because I am too busy paying attention to you.", "chinese": "朋友們想跟我聊天，我連回話都沒有，因為我的注意力都放在你身上。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞 V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "修飾語", "text": "My friends try to talk to me,"}, {"label": "主詞", "text": "but I don’t even reply because I"}, {"label": "動詞", "text": "am too"}, {"label": "補語", "text": "busy paying attention to you."}]}, {"english": "I’m worried that they are going to stop inviting me out!", "chinese": "我擔心他們以後都不找我出去了。", "pattern": "S/V/O(C)", "analysis": "that 子句：留意名詞子句或關係子句 不定詞：to＋原形動詞 V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "主詞", "text": "I’m"}, {"label": "動詞", "text": "worried"}, {"label": "受詞", "text": "that they are going to stop inviting me out!"}]}, {"english": "I can’t deny that you are always by my side, and I love it when we play games or respond to messages together.", "chinese": "我不否認你一直在我身邊，我也很喜歡和你一起玩遊戲或是回訊息。", "pattern": "S/V/O(C)", "analysis": "that 子句：留意名詞子句或關係子句 不定詞：to＋原形動詞 情態助動詞＋原形動詞", "roles": [{"label": "補語／片語", "text": "I can’t deny that you are always by my side, and I love it when we play games or respond to messages together."}]}, {"english": "But doing this late into the night means I seldom speak to my family!", "chinese": "但是這些都弄得太晚，代表我跟家人都沒講到什麼話！", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞 V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "連接詞", "text": "But"}, {"label": "主詞", "text": "doing this late into the night"}, {"label": "動詞", "text": "means"}, {"label": "受詞", "text": "I seldom speak to my family!"}]}, {"english": "That’s really not a good way to build a relationship with anybody, and my parents are both angry and disappointed with me.", "chinese": "這樣實在不是跟任何人建立關係的好方法，而我爸媽對我很生氣也很失望。", "pattern": "S/V/O(C)", "analysis": "that 子句：留意名詞子句或關係子句 不定詞：to＋原形動詞", "roles": [{"label": "主詞", "text": "That’s really not a good way to build a relationship with anybody, and my parents"}, {"label": "動詞", "text": "are both"}, {"label": "補語", "text": "angry and disappointed with me."}]}, {"english": "Please don’t take any of this personally.", "chinese": "請別把我說的這些當成針對你。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "主詞", "text": "Please don’t"}, {"label": "動詞", "text": "take"}, {"label": "受詞", "text": "any of this personally."}]}, {"english": "You’re truly wonderful, and I’ll miss you terribly.", "chinese": "你真的很好，我也會很想念你。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "修飾語", "text": "You’re truly wonderful,"}, {"label": "補語／片語", "text": "and I’ll miss you terribly."}]}, {"english": "But right now, I really need to focus on my studies, spend more time with my friends, and become a real part of my family again.", "chinese": "只是現在，我真的要專心念書，多和朋友相處，真正回歸家庭。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞", "roles": [{"label": "連接詞", "text": "But"}, {"label": "修飾語", "text": "right now,"}, {"label": "主詞", "text": "I really need to focus on my studies, spend more time with my friends, and"}, {"label": "動詞", "text": "become"}, {"label": "補語", "text": "a real part of my family again."}]}, {"english": "Sally", "chinese": "我希望你能了解。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "補語／片語", "text": "Sally"}]}], "vocabulary": [{"word": "relationship", "definition": "戀愛關係 a close or loving friendship between two people"}, {"word": "n.", "definition": "關係"}, {"word": "relation", "definition": "關係"}, {"word": "relate", "definition": "使兩者有聯繫"}, {"word": "satisfying", "definition": "令人滿意的 bringing pleasure to a person by providing something that person wants or needs"}, {"word": "satisfy", "definition": "使……滿意 (satisfied—satisfied—satisfying)"}, {"word": "satisfaction", "definition": "滿意"}, {"word": "inspire", "definition": "激勵 to cause someone to have the desire, confidence, or enthusiasm to do a good thing or improve himself or herself"}, {"word": "inspiration", "definition": "靈感"}, {"word": "connect", "definition": "與他人建立良好關係 to develop a relationship with someone"}, {"word": "connection", "definition": "關聯；關係"}, {"word": "communicate", "definition": "溝通 to share information, facts, ideas, or feelings with others"}, {"word": "communication", "definition": "溝通"}, {"word": "Introduce", "definition": "使某人初次體驗 to inform or teach someone about something that he or she doesn’t know much about"}, {"word": "introduction", "definition": "介紹"}, {"word": "throughout", "definition": "自始至終 occurring during an entire period of time"}, {"word": "message", "definition": "電郵或手機等的）訊息 a piece of writing such as an email or SMS (short message service) sent to someone electronically"}, {"word": "refresh", "definition": "刷新 to click on something to make the latest information appear"}, {"word": "romantic", "definition": "浪漫的；愛情的 related to love or a couple’s personal relationship"}, {"word": "romance", "definition": "浪漫愛情故事"}, {"word": "focus", "definition": "專注；專心 to pay particular attention to one thing, situation, or person"}, {"word": "ignore", "definition": "忽略 to not pay attention to something or someone"}, {"word": "ignorance", "definition": "無知"}, {"word": "attention", "definition": "注意力 the act of focusing on something or someone"}, {"word": "deny", "definition": "否認 (denied—denied—denying) to refuse to admit that something is true"}, {"word": "respond", "definition": "回應 to give a spoken or written reply to someone or something"}, {"word": "response", "definition": "回應"}, {"word": "disappointed", "definition": "感到失望的 sad or upset because something you hoped for has not happened or has not occurred in the way that you expected"}, {"word": "disappoint", "definition": "使……失望"}, {"word": "disappointment", "definition": "失望"}, {"word": "personally", "definition": "針對某人地 in a way that is regarded as hurtful to one’s self"}, {"word": "personal", "definition": "個人的"}, {"word": "update", "definition": "最新動態"}, {"word": "Facebook", "definition": "臉書"}, {"word": "Instagram", "definition": "一款提供圖片及視訊分享的社交應用軟體）"}, {"word": "LINE", "definition": "一款即時通訊軟體與行動應用程式）"}, {"word": "app", "definition": "應用程式（application的縮寫）"}, {"word": "terribly", "definition": "非常地"}]}, {"id": "L3", "title": "Lesson 3 · Do Animals Sleep like You and Me?", "exercises": [{"english": "You may know that brown bears hibernate and that goldfish sleep without closing their eyes, but have you ever wondered how other animals sleep?", "chinese": "你也許知道棕熊會冬眠，金魚睡覺時眼睛不用閉著，但是你有想過其他動物怎麼睡覺嗎？", "pattern": "S/V/O(C)", "analysis": "完成式：have/has/had＋p.p. that 子句：留意名詞子句或關係子句 V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "主詞", "text": "You may know that brown bears hibernate and that goldfish sleep without closing their eyes, but"}, {"label": "動詞", "text": "have you"}, {"label": "受詞", "text": "ever wondered how other animals sleep?"}]}, {"english": "You might be surprised when you read some of the following amazing facts about animals’ sleeping habits.", "chinese": "以下是一些有關動物睡眠習慣的奇妙事實，你讀的時候可能會覺得驚訝。", "pattern": "S/V/O(C)", "analysis": "被動語態：be＋p.p. V-ing：動名詞或分詞，依句中功能判斷 情態助動詞＋原形動詞", "roles": [{"label": "主詞", "text": "You"}, {"label": "動詞", "text": "might be surprised"}, {"label": "受詞", "text": "when you read some of the following amazing facts about animals’ sleeping habits."}]}, {"english": "Unlike most mammals, giraffes sleep very little.", "chinese": "不同於大多數哺乳類動物，長頸鹿睡得很少。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "修飾語", "text": "Unlike most mammals,"}, {"label": "補語／片語", "text": "giraffes sleep very little."}]}, {"english": "In fact, it is reported that some giraffes sleep only thirty minutes a day on average.", "chinese": "事實上，據報導有些長頸鹿平均一天只睡三十分鐘。", "pattern": "S/V/O(C)", "analysis": "被動語態：be＋p.p. that 子句：留意名詞子句或關係子句", "roles": [{"label": "修飾語", "text": "In fact,"}, {"label": "主詞", "text": "it"}, {"label": "動詞", "text": "is reported"}, {"label": "補語", "text": "that some giraffes sleep only thirty minutes a day on average."}]}, {"english": "When a giraffe sleeps, it curls its long neck and lays its head on its hip.", "chinese": "長頸鹿睡覺時，會捲起長長的脖子，並把頭放在臀部上。", "pattern": "S/V", "analysis": "副詞子句：主從句時態與連接詞", "roles": [{"label": "連接詞", "text": "When"}, {"label": "修飾語", "text": "a giraffe sleeps,"}, {"label": "補語／片語", "text": "it curls its long neck and lays its head on its hip."}]}, {"english": "However, there are often predators around, and a giraffe can’t stand up from this position very quickly.", "chinese": "然而，附近常有掠食者，而長頸鹿無法從這個姿勢很快站起來。", "pattern": "S/V/O(C)", "analysis": "情態助動詞＋原形動詞", "roles": [{"label": "修飾語", "text": "However,"}, {"label": "主詞", "text": "there"}, {"label": "動詞", "text": "are often"}, {"label": "補語", "text": "predators around, and a giraffe can’t stand up from this position very quickly."}]}, {"english": "Therefore, a giraffe never naps for too long.", "chinese": "因此，長頸鹿從來不會小睡太久。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "修飾語", "text": "Therefore,"}, {"label": "補語／片語", "text": "a giraffe never naps for too long."}]}, {"english": "Sea otters, one of the world’s cutest animals, perhaps have the cutest sleeping position.", "chinese": "海獺是世界上最可愛的動物之一，或許牠們的睡姿也是最可愛的。", "pattern": "S/V/O(C)", "analysis": "V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "修飾語", "text": "Sea otters,"}, {"label": "主詞", "text": "one of the world’s cutest animals, perhaps"}, {"label": "動詞", "text": "have the"}, {"label": "受詞", "text": "cutest sleeping position."}]}, {"english": "Groups of sea otters float on their backs and hold hands while they are sleeping!", "chinese": "成群的海獺睡覺時，會手牽手仰漂在海面上！", "pattern": "S/V/O(C)", "analysis": "V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "主詞", "text": "Groups of sea otters float on their backs and hold hands while they"}, {"label": "動詞", "text": "are sleeping"}, {"label": "補語", "text": "!"}]}, {"english": "They can rest on the land, but they are much safer in the water.", "chinese": "牠們可以在陸地上休息，但是在水上會更安全。", "pattern": "S/V/O(C)", "analysis": "情態助動詞＋原形動詞", "roles": [{"label": "修飾語", "text": "They can rest on the land,"}, {"label": "主詞", "text": "but they"}, {"label": "動詞", "text": "are much"}, {"label": "補語", "text": "safer in the water."}]}, {"english": "To avoid floating away, they lock their little paws together and hold on to each other.", "chinese": "為了避免漂走，牠們會緊扣彼此的小爪子，把對方抓牢。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞 V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "修飾語", "text": "To avoid floating away,"}, {"label": "補語／片語", "text": "they lock their little paws together and hold on to each other."}]}, {"english": "Dolphins have one of the most amazing sleeping secrets: only half their brain is asleep at a time!", "chinese": "海豚有一個最令人驚奇的睡眠祕密：牠們一次只有半邊大腦在睡覺！", "pattern": "S/V/O(C)", "analysis": "V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "主詞", "text": "Dolphins"}, {"label": "動詞", "text": "have one"}, {"label": "受詞", "text": "of the most amazing sleeping secrets: only half their brain is asleep at a time!"}]}, {"english": "One of the reasons for this is that they must swim to the surface once every twenty minutes to breathe.", "chinese": "其中一個原因是，牠們必須每二十分鐘游到水面呼吸一次。", "pattern": "S/V/O(C)", "analysis": "that 子句：留意名詞子句或關係子句 不定詞：to＋原形動詞 情態助動詞＋原形動詞", "roles": [{"label": "主詞", "text": "One of the reasons for this"}, {"label": "動詞", "text": "is"}, {"label": "補語", "text": "that they must swim to the surface once every twenty minutes to breathe."}]}, {"english": "They also have to look out for sharks and other predators.", "chinese": "牠們也必須留意鯊魚和其他掠食者。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞", "roles": [{"label": "主詞", "text": "They"}, {"label": "動詞", "text": "also have to"}, {"label": "受詞", "text": "look out for sharks and other predators."}]}, {"english": "When one half of their brain goes to sleep, the other half stays awake to help them swim, breathe, and be on the lookout for danger.", "chinese": "當牠們一半的大腦睡著時，另一半會保持清醒，幫助牠們游泳、呼吸並警戒危險。", "pattern": "S/V", "analysis": "副詞子句：主從句時態與連接詞 不定詞：to＋原形動詞", "roles": [{"label": "連接詞", "text": "When"}, {"label": "修飾語", "text": "one half of their brain goes to sleep,"}, {"label": "主詞", "text": "the other half stays awake to help them swim, breathe, and"}, {"label": "動詞", "text": "be"}, {"label": "補語", "text": "on the lookout for danger."}]}, {"english": "Some migratory birds have yet another impressive way of sleeping: they sleep up in the sky!", "chinese": "有些候鳥則有另一項驚人的睡眠方式：邊飛邊睡！", "pattern": "S/V/O(C)", "analysis": "V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "主詞", "text": "Some migratory birds"}, {"label": "動詞", "text": "have yet"}, {"label": "受詞", "text": "another impressive way of sleeping: they sleep up in the sky!"}]}, {"english": "For example, Alpine swifts have to keep flying for a long time over a great distance during their journeys to and from Africa.", "chinese": "以高山雨燕為例，牠們在往返非洲的長程旅途中，必須長時間飛行。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞 V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "修飾語", "text": "For example,"}, {"label": "主詞", "text": "Alpine swifts"}, {"label": "動詞", "text": "have to keep"}, {"label": "受詞", "text": "flying for a long time over a great distance during their journeys to and from Africa."}]}, {"english": "Along the way, they eat insects in the air and take little naps while in flight.", "chinese": "牠們沿途在空中吃昆蟲，也會在飛行中小睡。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "修飾語", "text": "Along the way,"}, {"label": "主詞", "text": "they"}, {"label": "動詞", "text": "eat"}, {"label": "受詞", "text": "insects in the air and take little naps while in flight."}]}, {"english": "This habit can save their lives since they may be caught by wild animals if they land.", "chinese": "這種習慣可以保全性命，因為如果牠們著陸，就可能被野生動物給吞下肚。", "pattern": "S/V/O(C)", "analysis": "情態助動詞＋原形動詞", "roles": [{"label": "主詞", "text": "This habit"}, {"label": "動詞", "text": "can save"}, {"label": "受詞", "text": "their lives since they may be caught by wild animals if they land."}]}, {"english": "According to studies, these amazing little birds may be able to stay in the air for up to two hundred days without needing to land and get some sleep.", "chinese": "據研究，這種神奇的小鳥可以連續飛行長達200天，無須落地補眠。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞 V-ing：動名詞或分詞，依句中功能判斷 情態助動詞＋原形動詞", "roles": [{"label": "修飾語", "text": "According to studies,"}, {"label": "主詞", "text": "these amazing little birds"}, {"label": "動詞", "text": "may be able to"}, {"label": "受詞", "text": "stay in the air for up to two hundred days without needing to land and get some sleep."}]}, {"english": "The sleeping habits of the giraffe, sea otter, dolphin, and Alpine swift may seem quite amazing.", "chinese": "長頸鹿、海獺、海豚和高山雨燕的睡眠習慣可能看起來相當驚人。", "pattern": "S/V/O(C)", "analysis": "V-ing：動名詞或分詞，依句中功能判斷 情態助動詞＋原形動詞", "roles": [{"label": "修飾語", "text": "The sleeping habits of the giraffe,"}, {"label": "主詞", "text": "sea otter, dolphin, and Alpine swift"}, {"label": "動詞", "text": "may seem"}, {"label": "補語", "text": "quite amazing."}]}, {"english": "Yet these are just four examples.", "chinese": "然而，這些只是四個例子。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "主詞", "text": "Yet these"}, {"label": "動詞", "text": "are just"}, {"label": "補語", "text": "four examples."}]}, {"english": "The wide variety of sleeping habits in the animal kingdom shows how different creatures have different ways of avoiding danger.", "chinese": "動物王國中各式各樣的睡眠習慣顯示，不同生物有不同避開危險的方式。", "pattern": "S/V/O(C)", "analysis": "V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "主詞", "text": "The wide variety of sleeping habits in the animal kingdom"}, {"label": "動詞", "text": "shows"}, {"label": "受詞", "text": "how different creatures have different ways of avoiding danger."}]}, {"english": "As you can see, each animal is an expert at surviving in the wild.", "chinese": "如你所見，每種動物都是野外生存的專家。", "pattern": "S/V/O(C)", "analysis": "V-ing：動名詞或分詞，依句中功能判斷 情態助動詞＋原形動詞", "roles": [{"label": "連接詞", "text": "As"}, {"label": "修飾語", "text": "you can see,"}, {"label": "主詞", "text": "each animal"}, {"label": "動詞", "text": "is an"}, "各式各樣的"}, {"word": "creature", "definition": "生物 a living thing such as an animal, or an imagined being such as a monster"}, {"word": "expert", "definition": "專家；行家 a person with advanced knowledge, skills, or training in a particular field or subject"}, {"word": "survive", "definition": "生存；倖存 to stay alive or continue to exist"}, {"word": "survival", "definition": "生存；倖存"}, {"word": "hibernate", "definition": "冬眠"}, {"word": "mammal", "definition": "哺乳類動物"}, {"word": "curl", "definition": "捲曲"}, {"word": "predator", "definition": "掠食者"}, {"word": "sea otter", "definition": "海獺"}, {"word": "paw", "definition": "爪"}, {"word": "migratory bird", "definition": "候鳥"}, {"word": "Alpine swift", "definition": "高山雨燕"}, {"word": "Africa", "definition": "非洲"}]}, {"id": "L4", "title": "Lesson 4 · Sniffing Out More Than Just Bones", "exercises": [{"english": "Have you ever noticed that dogs are able to smell things that we can’t?", "chinese": "你有沒有注意到狗可以聞到我們聞不到的東西？", "pattern": "S/V/O(C)", "analysis": "完成式：have/has/had＋p.p. that 子句：留意名詞子句或關係子句 不定詞：to＋原形動詞", "roles": [{"label": "主詞", "text": "Have you ever"}, {"label": "動詞", "text": "noticed"}, {"label": "受詞", "text": "that dogs are able to smell things that we can’t?"}]}, {"english": "This is because a dog’s sense of smell is far more sensitive than a human’s.", "chinese": "這是因為狗的嗅覺比人類靈敏得多。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "主詞", "text": "This"}, {"label": "動詞", "text": "is"}, {"label": "補語", "text": "because a dog’s sense of smell is far more sensitive than a human’s."}]}, {"english": "For this reason, some dogs are specially trained to become “sniffer dogs,” which use their keen sense of smell to detect certain items such as hidden drugs.", "chinese": "因為這個理由，有些狗會被特別訓練為「嗅探犬」，用牠們敏銳的嗅覺去偵測某些物件，例如藏匿的毒品。", "pattern": "S/V/O(C)", "analysis": "被動語態：be＋p.p. 關係子句：who/which 修飾先行詞 不定詞：to＋原形動詞", "roles": [{"label": "修飾語", "text": "For this reason,"}, {"label": "主詞", "text": "some dogs"}, {"label": "動詞", "text": "are specially"}, {"label": "補語", "text": "trained to become “sniffer dogs,” which use their keen sense of smell to detect certain items such as hidden drugs."}]}, {"english": "But this isn’t the only task that sniffer dogs can accomplish.", "chinese": "但這並非嗅探犬能夠完成的唯一任務。", "pattern": "S/V/O(C)", "analysis": "that 子句：留意名詞子句或關係子句 情態助動詞＋原形動詞", "roles": [{"label": "連接詞", "text": "But"}, {"label": "主詞", "text": "this isn’t the only task that sniffer dogs"}, {"label": "動詞", "text": "can accomplish"}, {"label": "受詞", "text": "."}]}, {"english": "Here are a few more interesting ways that these amazing animals can help humans out.", "chinese": "以下還有一些這種神奇的動物們能幫忙人類的有趣方式。", "pattern": "S/V/O(C)", "analysis": "that 子句：留意名詞子句或關係子句 V-ing：動名詞或分詞，依句中功能判斷 情態助動詞＋原形動詞", "roles": [{"label": "主詞", "text": "Here"}, {"label": "動詞", "text": "are a"}, {"label": "補語", "text": "few more interesting ways that these amazing animals can help humans out."}]}, {"english": "In Pingtung, officials in one park use trained dogs to find trees that have “brown root rot” disease.", "chinese": "在屏東，有公園管理處的職員用受訓後的狗發現罹患「褐根病」的樹。", "pattern": "S/V/O(C)", "analysis": "that 子句：留意名詞子句或關係子句 不定詞：to＋原形動詞", "roles": [{"label": "修飾語", "text": "In Pingtung,"}, {"label": "主詞", "text": "officials in one park"}, {"label": "動詞", "text": "use"}, {"label": "受詞", "text": "trained dogs to find trees that have “brown root rot” disease."}]}, {"english": "Due to their keen sense of smell, the dogs can detect infected trees.", "chinese": "既然這些狗有敏銳的嗅覺，可以探查出受感染的樹。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞 情態助動詞＋原形動詞", "roles": [{"label": "修飾語", "text": "Due to their keen sense of smell,"}, {"label": "主詞", "text": "the dogs"}, {"label": "動詞", "text": "can detect"}, {"label": "受詞", "text": "infected trees."}]}, {"english": "Once they locate such a tree, they sit down beside it until their trainer hands them a treat as a reward.", "chinese": "一旦牠們發現病樹的位置，牠們會坐在樹旁，直到訓練師給牠們好吃的東西當作獎勵。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "連接詞", "text": "Once"}, {"label": "修飾語", "text": "they locate such a tree,"}, {"label": "補語／片語", "text": "they sit down beside it until their trainer hands them a treat as a reward."}]}, {"english": "Workers then dig out these trees before they fall and hurt people.", "chinese": "工作人員便將這些樹挖起，以免樹倒傷人。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "補語／片語", "text": "Workers then dig out these trees before they fall and hurt people."}]}, {"english": "Since they have realized how useful these sniffer dogs can be, officials in parks across Taiwan are inviting them to come and help find the trees with brown root rot disease.", "chinese": "由於他們了解嗅探犬能發揮極大的功能，於是全臺各地的公園管理人員都找來這些狗兒協助發現患有褐根病的樹。", "pattern": "S/V", "analysis": "完成式：have/has/had＋p.p. 副詞子句：主從句時態與連接詞 不定詞：to＋原形動詞", "roles": [{"label": "連接詞", "text": "Since"}, {"label": "主詞", "text": "they have realized how useful these sniffer dogs can be, officials in parks across Taiwan"}, {"label": "動詞", "text": "are inviting"}, {"label": "補語", "text": "them to come and help find the trees with brown root rot disease."}]}, {"english": "Sniffer dogs’ ability to detect sickness can be used for more than just locating sick trees.", "chinese": "嗅探犬偵測疾病的能力不只可以用來找出生病的樹。", "pattern": "S/V/O(C)", "analysis": "被動語態：be＋p.p. 不定詞：to＋原形動詞 V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "主詞", "text": "Sniffer dogs’ ability to detect sickness"}, {"label": "動詞", "text": "can be used"}, {"label": "受詞", "text": "for more than just locating sick trees."}]}, {"english": "They have also been trained to predict the onset of certain diseases in humans.", "chinese": "牠們也接受訓練，用來預測人類某些疾病的發作。", "pattern": "S/V/O(C)", "analysis": "完成式：have/has/had＋p.p. 被動語態：be＋p.p. 不定詞：to＋原形動詞", "roles": [{"label": "主詞", "text": "They"}, {"label": "動詞", "text": "have also"}, {"label": "受詞", "text": "been trained to predict the onset of certain diseases in humans."}]}, {"english": "Maria Tello, who was a 58-year-old woman with diabetes, was asleep one night.", "chinese": "Maria Tello 是一位患有糖尿病的五十八歲女性，某天晚上她正在睡覺。", "pattern": "S/V/O(C)", "analysis": "關係子句：who/which 修飾先行詞", "roles": [{"label": "修飾語", "text": "Maria Tello,"}, {"label": "主詞", "text": "who was a 58 - year - old woman with diabetes,"}, {"label": "動詞", "text": "was asleep"}, {"label": "補語", "text": "one night."}]}, {"english": "All of a sudden, her dog Malachi opened its eyes and got up.", "chinese": "突然間，她的狗 Malachi 睜開眼睛並站了起來。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "修飾語", "text": "All of a sudden,"}, {"label": "主詞", "text": "her dog Malachi"}, {"label": "動詞", "text": "opened"}, {"label": "受詞", "text": "its eyes and got up."}]}, {"english": "By using its powerful nose, it could sense that Maria’s blood sugar was dropping to a dangerously low level.", "chinese": "牠利用強大的鼻子，能感覺到 Maria 的血糖正在降到危險的低水準。", "pattern": "S/V/O(C)", "analysis": "that 子句：留意名詞子句或關係子句 不定詞：to＋原形動詞 V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "修飾語", "text": "By using its powerful nose,"}, {"label": "主詞", "text": "it"}, {"label": "動詞", "text": "could sense"}, {"label": "受詞", "text": "that Maria’s blood sugar was dropping to a dangerously low level."}]}, {"english": "Malachi woke her up and then rushed to get her medicine.", "chinese": "Malachi 把她叫醒，然後衝去拿她的藥。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞", "roles": [{"label": "主詞", "text": "Malachi woke her up and then"}, {"label": "動詞", "text": "rushed to"}, {"label": "受詞", "text": "get her medicine."}]}, {"english": "It turned out that Malachi saved Maria’s life in this way four more times that year.", "chinese": "結果，Malachi 那一年又用這種方式救了 Maria 四次。", "pattern": "S/V/O(C)", "analysis": "that 子句：留意名詞子句或關係子句", "roles": [{"label": "主詞", "text": "It"}, {"label": "動詞", "text": "turned"}, {"label": "受詞", "text": "out that Malachi saved Maria’s life in this way four more times that year."}]}, {"english": "How can sniffer dogs manage to do the above-mentioned tasks?", "chinese": "嗅探犬怎麼能完成上述任務呢？", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞 情態助動詞＋原形動詞", "roles": [{"label": "主詞", "text": "How"}, {"label": "動詞", "text": "can sniffer"}, {"label": "受詞", "text": "dogs manage to do the above - mentioned tasks?"}]}, {"english": "The answer is that diseases cause chemical changes in plants, animals, and even the human body.", "chinese": "答案是，疾病會在植物、動物，甚至人體中造成化學變化。", "pattern": "S/V/O(C)", "analysis": "that 子句：留意名詞子句或關係子句", "roles": [{"label": "補語／片語", "text": "The answer is that diseases cause chemical changes in plants, animals, and even the human body."}]}, {"english": "These chemical changes usually create special odors, and trainers need to expose their dogs to these smells many times.", "chinese": "這些化學變化通常會產生特殊氣味，而訓練師需要讓狗多次接觸這些氣味。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞", "roles": [{"label": "修飾語", "text": "These chemical changes usually create special odors,"}, {"label": "主詞", "text": "and trainers"}, {"label": "動詞", "text": "need to"}, {"label": "受詞", "text": "expose their dogs to these smells many times."}]}, {"english": "The dogs are then taught to perform a certain kind of behavior as an alert, such as sitting down or barking, when they come across these smells.", "chinese": "接著，狗會被教導在遇到這些氣味時做出某種警示行為，例如坐下或吠叫。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞 V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "補語／片語", "text": "The dogs are then taught to perform a certain kind of behavior as an alert, such as sitting down or barking, when they come across these smells."}]}, {"english": "Once their training is complete, sniffer dogs are assigned to carry out specific duties.", "chinese": "一旦訓練完成，嗅探犬就會被指派去執行特定任務。", "pattern": "S/V/O(C)", "analysis": "被動語態：be＋p.p. 不定詞：to＋原形動詞 V-ing：動名詞或分詞，依句中功能判斷", "roles": [{"label": "連接詞", "text": "Once"}, {"label": "修飾語", "text": "their training is complete,"}, {"label": "主詞", "text": "sniffer dogs"}, {"label": "動詞", "text": "are assigned to"}, {"label": "補語", "text": "carry out specific duties."}]}, {"english": "Dogs really are our best friends.", "chinese": "狗真的是我們最好的朋友。", "pattern": "S/V/O(C)", "analysis": "基本句型：先找主詞與動詞，再判斷受詞／補語", "roles": [{"label": "主詞", "text": "Dogs"}, {"label": "動詞", "text": "really are our"}, {"label": "受詞", "text": "best friends."}]}, {"english": "As we continue to understand them better, they can help us more.", "chinese": "我們愈了解牠們，牠們就愈能幫助我們。", "pattern": "S/V/O(C)", "analysis": "不定詞：to＋原形動詞 情態助動詞＋原形動詞", "roles": [{"label": "連接詞", "text": "As"}, {"label": "修飾語", "text": "we continue to understand them better,"}, {"label": "主詞", "text": "they"}, {"label": "動詞", "text": "can help"}, {"label": "受詞", "text": "us more."}]}, {"english": "Who knows in what other ways their sharp sense of smell will be useful to us in the future?", "chinese": "誰知道未來牠們敏銳的嗅覺還能在什麼方面協助我們呢？", "pattern": "S/V/O(C)", "analysis": "關係子句：who/which 修飾先行詞 不定詞：to＋原形動詞 情態助動詞＋原形動詞", "roles": [{"label": "連接詞", "text": "Who"}, {"label": "主詞", "text": "knows in what other ways their sharp sense of smell"}, {"label": "動詞", "text": "will be useful to"}, {"label": "受詞", "text": "us in the future?"}]}], "vocabulary": [{"word": "sensitive", "definition": "敏感的 able to notice very subtle things such as changes or differences that others may not be aware of"}, {"word": "2. keen", "definition": "敏銳的 highly advanced, referring to the five senses"}, {"word": "3. detect", "definition": "偵測到；察覺 to find or be aware of something not easy to notice"}, {"word": "item", "definition": "一項物品 a single product or thing"}, {"word": "accomplish", "definition": "達成 to complete a difficult task or reach a goal"}, {"word": "accomplishment", "definition": "成就"}, {"word": "disease", "definition": "疾病 a human, animal, or plant sickness that is usually caused by an infection"}, {"word": "infected", "definition": "遭感染的 affected by or containing disease-causing bacteria"}, {"word": "infect", "definition": "感染"}, {"word": "infection", "definition": "感染"}, {"word": "locate
