function nodeDetail(n){return `<div class="node-body"><div class="detailgrid"><div><b>本體｜在處理什麼</b><p>${E(n.body)}</p></div><div><b>結構｜與哪些部分相連</b><p>${E(DATA.topics.filter(t=>t.nodes.includes(n.id)).map(t=>t.title).join('、'))}</p></div><div><b>機制｜可能如何影響</b><p>${E(n.mechanism)}</p></div><div><b>能力｜要練什麼</b><p>${E(n.capability)}</p></div><div><b>策略｜怎麼安排</b><p>${E(n.strategy)}</p></div><div><b>預測｜觀察什麼</b><p>${E(n.prediction)}</p></div><div><b>常見模型誤差</b><p>${E(n.error)}</p></div><div><b>更新機制</b><p>${E(n.update)}</p></div></div><div class="product-strip"><b>團購產品對應</b><div class="row">${productTags(n.products)}</div><p class="meta">${E(n.productRole)}</p>${n.products.map(name=>{const p=DATA.products.find(p=>p.name===name);return p?`<p class="node-effect"><b>${E(name)}：</b>${E(p.effect)}</p>`:""}).join('')}</div><p><b>相關檢驗：</b>${n.labs.length?E(n.labs.join('、')):'以症狀、功能與資源紀錄為主，無固定檢驗配對。'}</p><div class="action"><b>最小行動：</b>${E(n.action)}</div><p class="wisdom">${E(n.wisdom)}</p><div class="row">${DATA.topics.filter(t=>t.nodes.includes(n.id)).slice(0,5).map(t=>`<button class="mini" data-topic="${t.id}">${E(t.title)}</button>`).join('')}</div></div>`}
function topicCard(t){const refs=t.postIds.map(id=>DATA.posts.find(p=>p.id===id));return `<details class="topic-card" id="topic-${t.id}"><summary><span class="number">${t.id}</span> ${E(t.title)} <span class="meta">${refs.length}則原文索引</span></summary><p class="tag">${E(t.en)}</p><p><b>母體歸屬：</b>${E(t.group)}</p><div class="detailgrid"><div><b>本體</b><p>${E(DATA.nodes.find(n=>n.id===t.nodes[0]).body)}</p></div><div><b>結構</b><p>${t.nodes.map(id=>{const n=DATA.nodes.find(n=>n.id===id);return `<button class="mini" data-node="${id}">${id} ${E(n.title)}</button>`}).join(' ')}</p></div><div><b>機制</b><p>${E(t.mechanism)}</p></div><div><b>能力</b><p>${E(t.capability)}</p></div><div><b>常見誤差</b><p>${E(t.error)}</p></div><div><b>更新機制</b><p>${E(t.update)}</p></div></div><div class="product-strip"><b>相關團購入口</b><div class="row">${productTags(t.products)}</div><p class="meta">連結用來查閱營養議題、成分清單或既有使用紀錄；主題匹配不代表商品能治療該問題。</p></div><p><b>檢驗入口：</b>${t.labs.length?E(t.labs.join('、')):'以生活功能、症狀與協作紀錄為主。'}</p><p><b>追蹤指標：</b>${E(t.indicator)}</p><div class="action"><b>最小行動：</b>${E(t.action)}</div><p class="wisdom">${E(t.wisdom)}</p><details class="nested"><summary>展開 ${refs.length} 則原文完整索引</summary><p class="meta">依關鍵字匹配，一篇可屬多個主題；以下原文尚未逐篇查核。</p><div class="source-list">${refs.map(p=>`<button class="source-link" data-post="${p.id}"><span>${p.id} · ${E(p.date)}</span>${E(p.title.slice(0,130))}</button>`).join('')||'<p class="meta">本次讀取原文沒有符合的關鍵字；保留為近期主題整理入口。</p>'}</div></details></details>`}
function map(){return heading('心智圖・框架・一頁表｜MAX增建','六大領域 × 30主題 × 46節點 × 24情境，連接586則原文與團購資料。')+`<div class="map-summary"><span><b>30</b> 個主題</span><span><b>46</b> 個完整節點</span><span><b>24</b> 個情境</span><span><b>586</b> 則原文可追溯</span></div><div class="map-tabs" role="group" aria-label="架構閱讀方式">${mapModes.map(([id,title])=>`<button data-mapmode="${id}" class="${mapMode===id?'active':''}">${title}</button>`).join('')}</div><div id="map-content"></div>`}
function mapOverview(){const groups=[...new Set(DATA.nodes.map(n=>n.group))];return `<div class="hero-box"><h3>核心：醫療治療 × 支持照護 × 可更新資訊</h3><p>資料不是越多就越有用；先知道主題、關係、用途與下一步，資訊才會變成可使用的能力。</p></div><h3 class="map-title">六大領域導航</h3><div class="tree">${groups.map((g,i)=>`<div class="card"><span class="number">母體 ${String(i+1).padStart(2,'0')}</span><h3>${E(g)}</h3><p class="meta">${DATA.topics.filter(t=>t.group===g).length} 主題 · ${DATA.nodes.filter(n=>n.group===g).length} 節點</p>${DATA.topics.filter(t=>t.group===g).map(t=>`<button class="text-link" data-topic="${t.id}">${t.id} ${E(t.title)} <small>${t.postIds.length}則</small></button>`).join('')}</div>`).join('')}</div><h3 class="map-title">四層一頁總表</h3><div class="table-wrap"><table><thead><tr><th>層級</th><th>核心問題</th><th>輸出</th><th>生活例子</th><th>更新方式</th></tr></thead><tbody><tr><td>本體</td><td>到底在處理什麼？</td><td>診斷背景、醫療目標、生活目標</td><td>目標是吃得下，還是腫瘤治療？</td><td>不同目標用不同指標</td></tr><tr><td>結構</td><td>哪些因素一起影響？</td><td>療程、症狀、飲食、藥物、家庭</td><td>吃不下可能連著嘴痛與疲勞</td><td>補足被忽略的因素</td></tr><tr><td>機制</td><td>變化可能怎麼發生？</td><td>可以討論與查驗的假設</td><td>是噁心阻礙進食，還是口腔疼痛？</td><td>比較不同解釋</td></tr><tr><td>行動</td><td>今天做什麼？如何比較？</td><td>回報、求助、紀錄、最小行動</td><td>寫清症狀並找團隊討論</td><td>基線→差異→更新→再觀察</td></tr></tbody></table></div><h3 class="map-title">三條觀察線分開走</h3><div class="grid"><div class="card"><h3>生活支持線</h3><p>食量、睡眠、疲勞、功能、照顧者負荷。</p><p>用日誌與個人生活目標追蹤。</p></div><div class="card"><h3>醫療追蹤線</h3><p>病理、影像、療程、檢驗及副作用。</p><p>由醫療團隊判讀與決策。</p></div><div class="card"><h3>資訊更新線</h3><p>來源、研究對象、原文ID、成分標示、版本。</p><p>新的資料出現後，修正主張與適用範圍。</p></div><div class="card"><h3>產品對照線</h3><p>節點→需求→商品／成分→實際清單→團隊核對。</p><p>商品只是相關資料入口；必要照護、飲食與分工仍要落實。</p></div></div><h3 class="map-title">生活例子：這週一直睡不好</h3><div class="card"><p><b>本體：</b>改善睡眠連續性與隔日功能。</p><p><b>結構：</b>睡眠、疼痛、藥物、焦慮、作息及家庭環境一起看。</p><p><b>機制：</b>把「一定缺鎂」改成多種待辨識的可能原因。</p><p><b>產品入口：</b>褪黑素、GABA、鎂，供成分與既有使用紀錄討論。</p><p><b>行動：</b>記錄夜醒原因，回診時帶完整清單。</p><p><b>更新：</b>比較多天資料；睡眠改善與腫瘤反應分開追蹤。</p></div><div class="card" style="margin-top:18px"><h3>整理方法與資料覆蓋</h3><p>30主題由本次原文及既有節點整理而成；關鍵字交叉索引共有${DATA.mapMetadata.tagAssignments.toLocaleString()}個匹配關係，一篇可連到多個主題。</p><p>7則沒有匹配到這30主題，已保留在「其他原文」入口；22組完全相同文字保留各自原始ID，不偷偷刪除。</p><p class="meta">索引是查找工具，不代表每篇已被醫療審查，也不是全部歷史對話已完成匯入。</p><button data-mapmode="sourceindex">查閱全部來源 →</button></div>`}
function mapFramework(){return `<div class="section-head"><h3>12步照護資料循環</h3><p class="muted">每一步都包含輸入、輸出與誤差修正；急症直接轉入醫療求助。</p></div><div class="grid">${DATA.steps.map((x,i)=>`<div class="card"><span class="number">${String(i+1).padStart(2,'0')} · ${E(x.en)}</span><h3>${E(x.title)}</h3><p>${E(x.body)}</p><p><b>輸出：</b>${E(x.output)}</p><p><b>校準問句：</b>${E(x.question)}</p></div>`).join('')}</div><h3 class="map-title">三個回饋迴路</h3><div class="table-wrap"><table><thead><tr><th>回路</th><th>可能的連動</th><th>可介入處</th><th>觀察</th></tr></thead><tbody><tr><td>進食支持</td><td>症狀→吃不下→日常功能受影響</td><td>回報症狀、營養評估、餐食協助</td><td>食量、體重趨勢與功能</td></tr><tr><td>照顧協作</td><td>分工不明→負荷累積→交接失敗</td><td>任務明確、輪替、替補與社工資源</td><td>完成率、休息與求助可得性</td></tr><tr><td>資訊更新</td><td>只看支持舊想法的資料→誤判→重複選擇</td><td>查來源、找反例、記誤差、更新主張</td><td>理由是否可追溯、問題是否更準確</td></tr></tbody></table></div><div class="card" style="margin-top:18px"><h3>控制論白話版</h3><p>目標：想改善的生活狀況。</p><p>感測：症狀、功能、報告與日誌。</p><p>控制動作：安全的生活安排、求助與團隊協作。</p><p>外部變動：療程、藥物、感染、環境與家庭資源。</p><p>回饋延遲：有些變化不會當天出現，不能立即把結果歸到一款商品。</p><p>更新：把不準的解釋改掉；藥物與療程由醫療團隊決定。</p><p class="meta">這是照護資訊的操作框架，並非用APP控制癌症生物過程。</p></div>`}
function mapTable(){return `<p class="meta">46個節點逐一列出機制、能力、團購對照與最小行動；點節點可看完整解析，點商品可看反向對照。</p><div class="table-wrap"><table class="wide-table"><thead><tr><th>ID／節點</th><th>白話本質</th><th>機制／能力</th><th>團購產品對照</th><th>最小行動</th><th>模型更新</th></tr></thead><tbody>${DATA.nodes.map(n=>`<tr><td><button class="text-link" data-node="${n.id}">${n.id}<br>${E(n.title)}</button><span class="meta">${E(n.group)}</span></td><td>${E(n.body)}</td><td>${E(n.mechanism)}<p class="meta">能力：${E(n.capability)}</p></td><td><div class="row">${productTags(n.products)}</div><p class="meta">${E(n.productRole)}</p></td><td>${E(n.action)}</td><td>${E(n.update)}</td></tr>`).join('')}</tbody></table></div>`}
function mapSituations(){return `<p class="muted">從今天的痛點進入，找到主題、節點、相關產品資料與下一步。</p><div class="grid">${DATA.scenarios.map((x,i)=>{const t=DATA.topics.find(t=>t.id===x.topic);return `<div class="card"><span class="number">情境 ${String(i+1).padStart(2,'0')}</span><h3>${E(x.title)}</h3><p>${E(x.action)}</p><p class="meta">對應 ${t.nodes.join('、')}</p><div class="row">${productTags(t.products)}</div><button data-topic="${x.topic}" style="margin-top:15px">進入${E(t.title)} →</button></div>`}).join('')}</div>`}
function mapSourceIndex(){return `<div class="card"><h3>來源鏈：原文 → 主題 → 節點 → 行動</h3><p>保留原文ID、日期與來源，不把所有文章壓成沒有脈絡的一句話。</p><p>資料源：健康社群文章智庫｜欣蓉版主精選健康主題.html。</p><p>篩選方式：癌／腫瘤／化療／放療；主題分配：關鍵字交叉匹配。</p><p>本版有586則原文，30個主題、4781條索引關係，7則保留於其他入口。</p></div><div class="results" style="margin-top:18px">${DATA.topics.map(t=>`<details><summary>${t.id} · ${E(t.title)} · ${t.postIds.length}則</summary><div class="source-list">${t.postIds.map(id=>{const p=DATA.posts.find(p=>p.id===id);return `<button class="source-link" data-post="${p.id}"><span>${p.id} · ${E(p.date)}</span>${E(p.title.slice(0,130))}</button>`}).join('')||'<p>這份原文尚無匹配資料，保留近期議題入口。</p>'}</div></details>`).join('')}<details><summary>其他原文 · ${DATA.unassigned.length}則</summary>${DATA.unassigned.map(id=>{const p=DATA.posts.find(p=>p.id===id);return `<button class="source-link" data-post="${id}">${id} ${E(p.title)}</button>`}).join('')}</details><details><summary>22組完全相同文字的原始ID索引</summary><p class="meta">只比對去除空白後的全文；內容相似但不完全相同的文章沒有視為重複。</p>${DATA.duplicates.map(ids=>`<p>${ids.map(id=>`<button class="mini" data-post="${id}">${id}</button>`).join(' ')}</p>`).join('')}</details></div>`}
function fillMap(){const target=document.getElementById('map-content');if(!target)return;document.querySelectorAll('[data-mapmode]').forEach(b=>b.classList.toggle('active',b.dataset.mapmode===mapMode));if(mapMode==='overview')target.innerHTML=mapOverview();else if(mapMode==='framework')target.innerHTML=mapFramework();else if(mapMode==='table')target.innerHTML=mapTable();else if(mapMode==='situations')target.innerHTML=mapSituations();else if(mapMode==='sourceindex')target.innerHTML=mapSourceIndex();else{target.innerHTML=`<div class="toolbar"><input id="map-q" aria-label="搜尋心智主題" placeholder="搜尋主題、商品、節點或機制…" value="${E(mapQuery)}"><select id="map-group" aria-label="主題母體"><option value="all">六大領域全部</option>${[...new Set(DATA.topics.map(t=>t.group))].map(g=>`<option ${mapGroup===g?'selected':''}>${E(g)}</option>`).join('')}</select></div><div id="topic-results" class="results"></div>`;fillTopics();document.getElementById('map-q').addEventListener('input',e=>{mapQuery=e.target.value;fillTopics()});document.getElementById('map-group').addEventListener('change',e=>{mapGroup=e.target.value;fillTopics()})}}
function fillTopics(){const q=mapQuery.trim().toLowerCase();const rows=DATA.topics.filter(t=>(mapGroup==='all'||t.group===mapGroup)&&[t.title,t.en,t.mechanism,t.nodes.join(' '),t.products.join(' '),t.group].join(' ').toLowerCase().includes(q));document.getElementById('topic-results').innerHTML=rows.map(topicCard).join('')||'<div class="empty">沒有符合主題，請調整關鍵字。</div>'}

function toolbar(groups,placeholder){return `<div class="toolbar"><input id="q" aria-label="搜尋" placeholder="${placeholder}" value="${E(state.q)}"><select id="group" aria-label="分類"><option value="all">全部分類</option>${groups.map(g=>`<option ${state.group===g?'selected':''}>${E(g)}</option>`).join('')}</select></div>`}
function nodes(){return heading('46個結構節點・團購對照','逐節點加入本體、結構、機制、能力、策略、產品、檢驗、最小行動與模型更新。')+toolbar([...new Set(DATA.nodes.map(n=>n.group))],'搜尋節點／睡眠／創傷／丁酸…')+`<div class="results" id="items"></div>`}
function archive(){return heading('586則歷史原文智庫','已讀取一份健康文章智庫，保留原文ID與日期；搜尋也包含你在本機新增的資料。')+`<div class="warning">此區是資料保存，不是使用建議。<br>原文可能含未證實療法、高劑量方案與不精確因果；不要直接套用。<br>涉及治療或補充品時，請交由醫師／藥師核對。</div>`+toolbar([...new Set(DATA.posts.map(p=>p.topic)),'★ 我的收藏'],'搜尋癌別／化療／NAC／時間治療…')+`<p class="meta" id="count"></p><div id="items" class="results"></div><div id="pages" class="pagination"></div>`}
function fillItems(){let items=document.getElementById('items');if(!items)return;const q=state.q.trim().toLowerCase();if(state.tab==='nodes'){const rows=DATA.nodes.filter(n=>(state.group==='all'||n.group===state.group)&&JSON.stringify(n).toLowerCase().includes(q));items.innerHTML=rows.map(n=>`<details id="node-${n.id}"><summary>${n.id} · ${E(n.title)} <span class="meta">${E(n.group)}</span></summary>${nodeDetail(n)}</details>`).join('')||'<div class="empty">沒有符合的節點，請換一個關鍵字。</div>';return}let rows=[...saved.custom,...DATA.posts].filter(p=>(state.group==='all'||p.topic===state.group||(state.group==='★ 我的收藏'&&saved.favorites.includes(p.id)))&&[p.title,p.text,p.topic,p.date,p.id].join(' ').toLowerCase().includes(q));const total=rows.length;state.page=Math.min(state.page,Math.max(0,Math.ceil(total/20)-1));document.getElementById('count').textContent=`找到 ${total} 則 · 每頁20則 · 原文未逐篇查核`;items.innerHTML=rows.slice(state.page*20,state.page*20+20).map(p=>`<details><summary>${E(p.title.slice(0,100))}</summary><div class="row"><span class="tag">${E(p.status)}</span><span class="meta">${E(p.id)} · ${E(p.date)} · ${E(p.topic)}</span><button data-fav="${E(p.id)}">${saved.favorites.includes(p.id)?'★ 已收藏':'☆ 收藏'}</button></div><p class="meta">來源：${E(p.source)}</p><p class="warning">閱讀校準：機制≠臨床效果；個人經驗≠因果；原文劑量≠適合你的劑量。</p><div class="original">${E(p.text)}</div><button data-copy="${E(p.id)}">複製原文</button></details>`).join('')||'<div class="empty">沒有符合的資料，請調整關鍵字或分類。</div>';document.getElementById('pages').innerHTML=`<button data-page="-1" ${state.page===0?'disabled':''}>上一頁</button><span>${state.page+1} / ${Math.max(1,Math.ceil(total/20))}</span><button data-page="1" ${(state.page+1)*20>=total?'disabled':''}>下一頁</button>`}
function effectSources(p){return `<details class="effect-sources"><summary>成分與來源</summary><p class="meta">${E(p.formulaNotes)}</p>${p.references.map(([title,url])=>`<p><a href="${E(url)}" target="_blank" rel="noopener">${E(title)}</a></p>`).join('')}<p class="meta">核對日期：${DATA.productEffectDate}。公開成分資料不是對此品牌成品的背書。</p></details>`}
function products(){return heading('團購產品功效・白話對照','24個項目逐一說明成分作用、會員看得懂的功效與對應節點。')+`<div class="card"><h3>先看作用，再看對應用途</h3><p>把已知營養功能、人體研究結果與原文商品定位分開寫清楚。</p><p class="meta">複方以已找到的原文描述為依據，實際成分與含量以包裝標示為準；本表不將成分研究直接當成商品治癌功效。</p></div><div class="table-wrap" style="margin-top:20px"><table class="product-table"><thead><tr><th>商品／成分</th><th>產品功效與白話說明</th><th>對應結構節點／照護用途</th></tr></thead><tbody>${DATA.products.map((p,i)=>{const ns=DATA.nodes.filter(n=>n.products.includes(p.name));return `<tr id="product-${i}"><td data-label="商品／成分"><b class="product-name">${E(p.name)}</b><br><span class="tag">${E(p.kind)}</span></td><td data-label="產品功效與白話說明"><p class="effect-title">${E(p.effect)}</p><p><b>作用說明：</b>${E(p.mechanism)}</p><p class="effect-plain"><b>白話理解：</b>${E(p.plain)}</p>${effectSources(p)}</td><td data-label="對應結構節點／照護用途"><p><b>照護用途：</b>${E(p.care)}</p><div class="node-links">${ns.map(n=>`<button class="mini" data-node="${n.id}">${n.id} ${E(n.title)}</button>`).join(' ')}</div></td></tr>`}).join('')}</tbody></table></div><div class="card" style="margin-top:20px"><h3>會員使用順序</h3><p>看懂功效 → 找自己的照護問題 → 閱讀節點 → 整理實際成分與用量 → 與團隊核對 → 留下生活回饋。</p><p>營養功能看需求，症狀改善看原因，使用回饋看可比較的紀錄。</p></div>`}
function labs(){return heading('檢驗白話速查','18組常見指標，用於理解與就醫溝通；不是先前77項檢驗的完整匯入。')+`<p class="warning">看趨勢、看症狀、看療程時點、看實驗室參考範圍。<br>不能從單一紅字直接配對營養素，也不能憑腫瘤標記自行調整治療。</p><div class="table-wrap"><table><thead><tr><th>專業項目</th><th>中文</th><th>白話意義</th><th>判讀背景</th></tr></thead><tbody>${DATA.labs.map(r=>`<tr>${r.map(c=>`<td>${E(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="card" style="margin-top:20px"><h3>前後判讀模板</h3><p>日期／療程第幾天／檢驗數值與單位／該院參考範圍／前次數值／目前症狀／新增藥物或補充品／醫師解釋／下次追蹤。</p></div>`}
function daily(){return heading('每日回饋・兩週模型更新','這是生活支持紀錄，儲存在本裝置；不會自動判斷病情或監控急症。')+red()+(!storageOK?'<div class="warning">瀏覽器儲存讀取異常，請用匯出備份保留資料。</div>':'')+`<form id="dailyForm" class="card"><div class="formgrid"><label>日期<input name="date" type="date" required value="${new Date().toLocaleDateString('sv-SE')}"></label><label>目前療程／階段<input name="stage" placeholder="例如：化療後第5天"></label><label>今日主要瓶頸<input name="bottleneck" required placeholder="例如：口腔疼痛讓我吃不下"></label><label>症狀影響程度（0–10）<input name="score" type="number" min="0" max="10" required value="0"></label><label>觀察基線<textarea name="baseline" placeholder="今天的食量、活動、睡眠或症狀"></textarea></label><label>安全的最小行動<textarea name="action" placeholder="例如：聯絡團隊討論口腔照護"></textarea></label><label>行動前的預測<textarea name="prediction" placeholder="我預期什麼會改善？什麼時候觀察？"></textarea></label><label>實際結果與差異<textarea name="actual" placeholder="與預期不同之處；不要只記好結果"></textarea></label><label class="full">模型更新／回診提問<textarea name="update" placeholder="我需要改哪個假設？還有哪些因素？"></textarea></label></div><div class="toolbar"><button class="primary" type="submit">保存今日紀錄</button><button type="button" id="export">匯出全部本機資料</button><label style="display:inline"><span class="meta">匯入備份</span><input id="import" type="file" accept="application/json" style="max-width:220px"></label></div></form><div class="card" style="margin-top:20px"><h3>兩週回顧</h3><p>最後14個日曆日 ${saved.logs.filter(l=>Date.now()-new Date(l.date).getTime()<=14*86400000&&new Date(l.date).getTime()<=Date.now()).length} 筆紀錄。</p><p>回顧：最常出現的瓶頸是什麼？哪項行動有回饋？哪些結果仍不確定？需要團隊協助什麼？</p><p class="muted">不把分數加總成抗癌成效，也不從兩週變化宣稱因果。</p></div><h3 style="margin-top:22px">已保存 ${saved.logs.length} 筆紀錄</h3><div class="results">${saved.logs.slice().reverse().map(l=>`<details><summary>${E(l.date)} · ${E(l.bottleneck)} · 影響${E(l.score)}/10</summary>${[['stage','階段'],['baseline','基線'],['action','行動'],['prediction','預測'],['actual','實際差異'],['update','更新']].map(([k,n])=>`<p><b>${n}：</b>${E(l[k])}</p>`).join('')}</details>`).join('')||'<div class="empty">尚無紀錄，從今天一個瓶頸開始。</div>'}</div>`}
function sources(){return heading('證據・來源・更新','保留歷史資料，也保留修正資料的能力。')+`<div class="grid"><div class="card"><h3>本版納入範圍</h3><p>原始智庫：2,415則文章。</p><p>關鍵字篩選：586則；未聲稱全部皆以癌症為主題。</p><p>MAX v3增建：30主題、24情境、12步框架、46節點完整解析與产品對照。</p><p>MAX v3增建：24項產品功效、成分作用、白話說明及來源；18組檢驗入口保留。</p><p>近期議題：代謝、腸道、時間治療、創傷安全，以摘要節點呈現。</p><p>未完整匯入：全部歷史對話、NotebookLM、77項檢驗原表與每份癌症原檔。</p></div><div class="card"><h3>五種閱讀標籤</h3><p>臨床資料：需看人群、比較與結果。</p><p>前臨床研究：細胞／動物，不能直接套用人。</p><p>機制假說：可能解釋，不是效益證明。</p><p>個人經驗：保留敘述，不推導普遍療效。</p><p>待查核：本版586原文尚未逐篇重新分類。</p></div></div><div class="card" style="margin-top:20px"><h3>本版核對的公開來源</h3><p><a href="https://www.cancer.gov/about-cancer/treatment/cam/diets-supplements" target="_blank" rel="noopener">NCI｜飲食、營養補充與癌症</a>：不能把飲食或補充品当作已證實癌症治療。</p><p><a href="https://www.cancer.gov/about-cancer/treatment/cam/patient/dietary-interactions-pdq" target="_blank" rel="noopener">NCI｜食品與補充品交互作用</a>：需核對療程與實際成分。</p><p><a href="https://www.cancer.gov/about-cancer/treatment/side-effects" target="_blank" rel="noopener">NCI｜癌症治療副作用</a>：症狀類別與團隊溝通入口。</p><p><a href="https://www.cdc.gov/cancer-preventing-infections/patients/fever.html" target="_blank" rel="noopener">CDC｜化療期間發燒</a>：38°C需立即聯絡醫療團隊。</p><p class="meta">核對日期：2026-10-05；這些來源沒有逐一背書本 APP 的每項商品或每篇原文。</p></div><div class="card" style="margin-top:20px"><h3>新增資料到本機智庫</h3><p class="muted">保留來源、標記待查核；不會自動上傳、醫療驗證或修改正式版本。</p><form id="sourceForm"><div class="formgrid"><label>標題<input name="title" required></label><label>來源／連結<input name="source" required></label><label class="full">原文<textarea name="text" required></textarea></label></div><button class="primary" style="margin-top:15px">保存新增資料</button></form></div><div class="card" style="margin-top:20px"><h3>更新閘門</h3><p>新資料 → 記錄來源 → 找既有節點 → 去重或保留差異 → 核對研究層級 → 修正主張 → 更新版本 → 再測。</p><p>成長＝更準確地辨識可用資訊與適用邊界；自由＝不被舊主張綁住。</p><p>降熵＝減少照護資訊的混亂；此處是操作比喻，不是人體熱力學檢測指標。</p></div>`}
function render(){document.querySelector('.nav').innerHTML=navs.map(([id,t])=>`<button data-go="${id}" class="${state.tab===id?'active':''}" ${state.tab===id?'aria-current="page"':''}>${t}</button>`).join('');view.innerHTML=({home,map,nodes,archive,products,labs,daily,sources}[state.tab])();fillItems();fillMap();document.getElementById('q')?.addEventListener('input',e=>{state.q=e.target.value;state.page=0;fillItems()});document.getElementById('group')?.addEventListener('change',e=>{state.group=e.target.value;state.page=0;fillItems()});document.getElementById('dailyForm')?.addEventListener('submit',e=>{e.preventDefault();let l=Object.fromEntries(new FormData(e.target));l.id=Date.now();saved.logs.push(l);persist();render();notify('今日紀錄已保存，記得定期匯出備份。')});document.getElementById('export')?.addEventListener('click',()=>dl('Cancer_LifeOS_本機備份.json',JSON.stringify(saved,null,2)));document.getElementById('import')?.addEventListener('change',async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>20000000)throw Error();const d=JSON.parse(await file.text());if(!Array.isArray(d.logs)||!Array.isArray(d.favorites)||!Array.isArray(d.custom)||!d.logs.every(x=>x&&typeof x.date==='string'&&typeof x.bottleneck==='string')||!d.custom.every(x=>x&&typeof x.id==='string'&&typeof x.title==='string'&&typeof x.text==='string')||!d.favorites.every(x=>typeof x==='string'))throw Error();for(const l of d.logs)if(!saved.logs.some(x=>x.id===l.id))saved.logs.push(l);saved.favorites=[...new Set([...saved.favorites,...d.favorites])];for(const p of d.custom)if(!saved.custom.some(x=>x.id===p.id))saved.custom.push(p);persist();render();notify('備份已合併，原有紀錄保留。')}catch(err){notify('備份格式無效，原有資料保留。')}});document.getElementById('sourceForm')?.addEventListener('submit',e=>{e.preventDefault();let p=Object.fromEntries(new FormData(e.target));p.id='local-'+Date.now();p.topic='本機新增';p.date=new Date().toLocaleDateString('sv-SE');p.status='新增原文・待查核';saved.custom.push(p);persist();e.target.reset();notify('已保存，可在原文智庫搜尋。')})}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go)go(b.dataset.go);if(b.dataset.mapmode){mapMode=b.dataset.mapmode;fillMap()}if(b.dataset.topic){mapMode='mind';mapQuery='';mapGroup='all';go('map');const d=document.getElementById('topic-'+b.dataset.topic);if(d){d.open=true;d.scrollIntoView({block:'start'})}}if(b.dataset.node){go('nodes');state.q=b.dataset.node;fillItems();const d=document.getElementById('node-'+b.dataset.node);if(d){d.open=true;d.scrollIntoView({block:'start'})}}if(b.dataset.product){const name=b.dataset.product;go('products');const i=DATA.products.findIndex(p=>p.name===name);const d=document.getElementById('product-'+i);if(d){d.classList.add('highlight');d.scrollIntoView({block:'center'})}}if(b.dataset.post){go('archive');state.q=b.dataset.post;fillItems();const d=document.querySelector('#items details');if(d){d.open=true;d.scrollIntoView({block:'start'})}}if(b.dataset.page){state.page+=Number(b.dataset.page);fillItems()}if(b.dataset.fav){const id=b.dataset.fav;saved.favorites=saved.favorites.includes(id)?saved.favorites.filter(x=>x!==id):[...saved.favorites,id];persist();fillItems()}if(b.dataset.copy){const p=[...saved.custom,...DATA.posts].find(x=>x.id===b.dataset.copy);try{await navigator.clipboard.writeText(p.text);notify('原文已複製。')}catch{notify('此瀏覽器不支援複製，請選取原文複製。')}}});document.getElementById('print').onclick=()=>window.print();document.getElementById('download').onclick=()=>{const doc=document.documentElement.cloneNode(true);doc.querySelector('#view').innerHTML='';doc.querySelector('.nav').innerHTML='';doc.querySelector('#toast').classList.add('hidden');dl('Cancer_LifeOS_MAX_v3.html','<!doctype html>\n'+doc.outerHTML,'text/html;charset=utf-8')};render();
</script></body></html>
