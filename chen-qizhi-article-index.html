const PAGE = 'https://www.facebook.com/DanTCM.ca/';
const posts = RAW.trim().split('\n').map(line => {
  const [date, code, ...rest] = line.split('|');
  const id = code.slice(1);
  const url = { p: PAGE + 'posts/' + id, b: PAGE + 'posts/pfbid' + id, f: 'https://www.facebook.com/photo/?fbid=' + id }[code[0]] || '';
  return { date, url, title: rest.join('|') };
});

// 分類規則：依標題關鍵字自動歸類，一篇可屬多類；第一個符合的為主分類
const CATS = [
  ['節氣養生', /立春|雨水｜|驚蟄|春分|清明|穀雨|立夏|小滿|芒種|夏至|小暑|大暑|立秋|處暑|白露|秋分|寒露|霜降|立冬|小雪｜|大雪｜|冬至|小寒|大寒|節氣|三伏|三九|末伏|端午|午時水|冬病夏治|夏病冬治|春生、夏長/],
  ['農曆七月・民俗冷知識', /農曆七月|卡到陰|鬼針|月全食|磁暴|抗飄|加持|護體|星座/],
  ['睡眠・情緒・自律神經', /睡|失眠|安眠|熬夜|自律神經|高敏|壓力|情緒|憂鬱|悲傷|大腦|不快樂|想太多|倦怠|過勞|降噪|放鬆|關機|心很累|病痛，從來|悲秋|疏肝/],
  ['減重・體質・進補', /瘦|肥胖|體質|減重|脂肪|進補|大補|怎麼補|補氣|麻油雞|泡芙|虛/],
  ['婦科・兒科', /經痛|月經|宮寒|產後|暖宮|保產|孩子|兒科|兒童|腸病毒|流感|女兒|聰明藥/],
  ['針灸・穴位・痠痛', /針灸|穴|落枕|痠|尾椎|脖子|鞋底|把脈|經絡|肝經|針療|手八門|美顏針|腸阻塞|急 CALL/],
  ['飲食・食安・保健', /食安|油品|茶包|茶飲|西芹汁|橄欖油|保健品|喝酒|蘋果水|胃酸|腸胃|脾胃|微塑膠|發炎|蘇丹紅|散步|解暑|中暑|飲食|無花果|金銀花|松茸|運動零食|狗脊|中藥/],
  ['皮膚・過敏・美顏', /過敏|濕疹|蕁麻疹|體味|多汗|口氣|口臭|掉髮|抗老|養顏|美顏|眼睛/],
  ['冥想・心靈醫藥箱', /冥想|心靈醫藥箱|Podcast|靜心|心靈樹洞|靈性覺察|聽你說|Clubhouse|直播|居話家常|對談/],
  ['漢方芳療・精油', /芳療|精油|配方|噴霧|調香|香水|沉檀香|艾草/],
  ['書籍・課程・講座', /書|講座|課|學院|勘誤|出版|雜誌|博客來|下載|app|教學|執業/],
  ['團購・合作推薦', /團購|ATEX|LA NEW|泰達|黑松|益生菌|清淨機|洗沐|好眠被|優惠|預購|按摩器|龜鹿|清冠|能量輔具|折|推薦！|抽書|徵/],
  ['加拿大生活・旅遊', /溫哥華|加拿大|極光|洛磯|Banff|北海道|櫻花|自駕|藍莓|園藝|Canada|山中|山和海|出遊|七夕|中秋|Black Friday|Skytrain|迎新|發呆|獸醫|山林大火|氣溫驟降/],
  ['診所・行醫日誌', /診間|診所|開診|門診|患者|義診|封面相片|正式上線|感恩的|歲末年初|鼎妍|發文|Instagram|設計師|新朋友|社團|母親節|譚德賽|林兩傳|人體太奧妙|同學|栩栩|無文字|影片重新|贈品|不情之請|兔北|中醫不科學|實證|開房|冠軍/],
];
const seen = {};
posts.forEach(p => {
  p.tags = CATS.filter(c => c[1].test(p.title)).map(c => c[0]);
  if (!p.tags.length) p.tags = ['其他'];
  seen[p.date] = (seen[p.date] || 0) + 1;
  p.notes = NOTES[p.date + (seen[p.date] > 1 ? '#' + seen[p.date] : '')];
  p.text = (p.title + ' ' + (p.notes || []).join(' ')).toLowerCase();
});
const only = document.getElementById('only');
only.addEventListener('change', () => render());
const CAT_NAMES = [...CATS.map(c => c[0]), '其他'];

const q = document.getElementById('q'), y = document.getElementById('y'), v = document.getElementById('v');
const list = document.getElementById('list'), info = document.getElementById('info'), chips = document.getElementById('chips');
[...new Set(posts.map(p => p.date.slice(0, 4)))].forEach(yr => y.add(new Option(yr + ' 年', yr)));
let cat = '';

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function render() {
  const kw = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const base = posts.filter(p => (!y.value || p.date.startsWith(y.value)) && (!only.checked || p.notes) && kw.every(k => p.text.includes(k)));
  const hit = base.filter(p => !cat || p.tags.includes(cat));

  chips.innerHTML = `<button class="chip${cat ? '' : ' on'}" data-c="">全部 ${base.length}</button>` +
    CAT_NAMES.map(c => [c, base.filter(p => p.tags.includes(c)).length]).filter(x => x[1])
      .map(([c, n]) => `<button class="chip${cat === c ? ' on' : ''}" data-c="${c}">${c} ${n}</button>`).join('');

  const hl = s => {
    let t = esc(s);
    for (const k of kw) t = t.replace(new RegExp(esc(k).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`);
    return t;
  };
  const row = p => {
    const d = v.value === 'year' ? p.date.slice(5).replace('-', '/') : p.date.slice(2).replace(/-/g, '/');
    const head = `<span class="d">${d}</span><span class="t">${hl(p.title)}<span class="tags">${p.tags.join('　')}</span></span>`;
    if (!p.notes) return `<div class="row plain">${head}</div>`;
    return `<details class="row"${kw.length ? ' open' : ''}><summary>${head}</summary><ul>${p.notes.map(n => `<li>${hl(n)}</li>`).join('')}</ul></details>`;
  };
  let html = '';
  if (v.value === 'year') {
    let year = '';
    for (const p of hit) {
      if (p.date.slice(0, 4) !== year) { year = p.date.slice(0, 4); html += `<h2>${year} 年</h2>`; }
      html += row(p);
    }
  } else {
    // 依分類：選了分類就只列該類；否則每篇放在主分類下
    for (const c of cat ? [cat] : CAT_NAMES) {
      const g = hit.filter(p => cat ? true : p.tags[0] === c);
      if (g.length) html += `<h2>${c}（${g.length}）</h2>` + g.map(row).join('');
    }
  }
  list.innerHTML = html || '<p>找不到符合的貼文。</p>';
  info.textContent = `顯示 ${hit.length} / ${posts.length} 篇（其中 ${hit.filter(p => p.notes).length} 篇有重點整理，點標題展開）｜收錄範圍 2019/04/19 – 2026/09/23`;
}
chips.addEventListener('click', e => { if (e.target.dataset.c !== undefined) { cat = e.target.dataset.c; render(); } });
q.addEventListener('input', render);
y.addEventListener('change', render);
v.addEventListener('change', render);
render();
</script>
