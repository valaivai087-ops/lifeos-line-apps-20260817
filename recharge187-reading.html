", "保護自己的能量場，", "讓生活只留下正向的能量流。", "5.\t一切為我所用。", "將所有發生的事都視為有利於自己，", "視為對自我蛻變的助力。", "積極思維是高手的標誌，", "他們的思想始終充滿希望、正向與力量。", "持續這樣，你的人生將永遠充滿希望和正能量。"], "s": ["1.\t先成为超级勇敢的人。", "每天觉察自我，锻炼勇气，做一个无畏的人。", "让每个思想、每个细胞都散发出无畏的能量。", "大道正，心无惧，一身浩然正气自然生长，", "你会发现，自己不再畏惧任何事物。", "2.\t盲目相信自己。", "屏蔽那些不支持你的人，", "绝不让任何外界声音削弱你的内在力量。", "坚持对自己无条件的自信，", "忠诚于内心的信念，这种坚定至关重要。", "3.\t坚守自己的立场。", "永不妥协，坚定自己的决心与态度，", "树立清晰的边界感。", "人性如天平，你对自己的价值轻视，", "你便处于弱势。", "坚守自己，你才能站稳脚跟。", "4.\t清理人际关系泡沫。", "减少不必要的关系，", "清除一切消耗你能量的联系。", "远离消极和负能量的人，", "保护自己的能量场，", "让生活只留下正向的能量流。", "5.\t一切为我所用。", "将所有发生的事都视为有利于自己，", "视为对自我蜕变的助力。", "积极思维是高手的标志，", "他们的思想始终充满希望、正向与力量。", "持续这样，你的人生将永远充满希望和正能量。"], "st": "重建能量，避免内耗的5个顶级思维", "tg": ["自我救贖", "內心的力量", "自我成長", "自我的力量", "內在力量建設", "突破自我設限", "向內探尋自我", "內心世界探索", "自我覺醒之路", "重新定義自我"], "p": "重建能量的5個方法：做勇敢的人、相信自己、守住立場、清理耗能的人際關係、把所有事都當成幫助自己的機會。", "m": [["勇敢", ["無畏能量"]], ["相信", ["屏蔽打擊的聲音"]], ["立場", ["清楚界線"]], ["清理", ["人際泡沫"]], ["為我所用", ["一切有利於我"]]], "f": ["能量被內耗", "練勇氣與自信", "守界線清理關係", "把一切轉為助力"], "g": "能量蛋白棒", "gm": "隨身補充能量，忙碌時也能穩住體力，保持正向行動力。"}, {"id": 172, "t": "真正讓你改變的不是認知，而是決心！", "d": "2/12/2025", "b": ["決心到位，一切隨之而來。", "智慧、靈感、機遇、行動力、自律、格局——都將隨決心的力量展現。", "這正是所有頂尖人物內在的底層邏輯，支撐他們不斷突破、不斷蛻變的核心。", "最關鍵的，是堅定自己的決心。", "讓它如磐石般牢固，無堅不摧，", "讓它成為你內心的指引，震撼一切。", "不要在乎他人的看法與評價，", "停止與他人對比，將所有精力聚焦於自己，", "讓內心的光與力量主導一切。", "明白，外界的所有現象，", "都是內心世界的投射。", "內心更新，外在就會發生變化，", "你能重塑一切，只需堅定決心，", "它會吸引一切有利的力量，", "為你創造智慧、機遇、成功。", "當決心足夠堅定、宏大、光明，", "一切有利的力量自然會匯聚在你周圍，", "形成強大的能量場，助你騰飛。"], "s": ["决心到位，一切随之而来。", "智慧、灵感、机遇、行动力、自律、格局——都将随决心的力量展现。", "这正是所有顶尖人物内在的底层逻辑，支撑他们不断突破、不断蜕变的核心。", "最关键的，是坚定自己的决心。", "让它如磐石般牢固，无坚不摧，", "让它成为你内心的指引，震撼一切。", "不要在乎他人的看法与评价，", "停止与他人对比，将所有精力聚焦于自己，", "让内心的光与力量主导一切。", "明白，外界的所有现象，", "都是内心世界的投射。", "内心更新，外在就会发生变化，", "你能重塑一切，只需坚定决心，", "它会吸引一切有利的力量，", "为你创造智慧、机遇、成功。", "当决心足够坚定、宏大、光明，", "一切有利的力量自然会汇聚在你周围，", "形成强大的能量场，助你腾飞。"], "st": "真正让你改变的不是认知，而是决心！", "tg": ["改變從心開始", "心態的力量", "選擇讓改變發生", "改變別人不如改變自己", "改變的力量", "改變從一件小事開始", "成為真正的自己", "成長與突破", "心態決定一切"], "p": "真正讓人改變的不是懂多少道理，而是「下定決心」。決心夠堅定，靈感、機會、行動力都會跟著來。", "m": [["關鍵", ["決心"]], ["隨之而來", ["智慧", "機遇", "自律"]], ["專注", ["停止比較"]], ["投射", ["內心更新外在改變"]]], "f": ["知道卻做不到", "下定堅定的決心", "專注自己不比較", "外在跟著改變"], "g": "21天挑戰打卡日曆", "gm": "用一張日曆記錄決心，每天打一個勾，看見自己的堅持。"}, {"id": 173, "t": "你是誰不重要，選擇讓什麼人靠近你更重要", "d": "2/11/2025", "b": ["你是誰，不重要。選擇讓什麼樣的人靠近你，比確定自己是什麼樣的人，還重要。人是群體動物，環境決定行為，伴侶影響思想，身邊人的平均值，就塑造了你差不多的樣子。多數人其實是做不到“境由心生”的，是沒辦法用幼小的自己跟大環境作鬥爭的。", "孫悟空和哪吒，哪個都沒能逆了天，反而最終歸順朝廷。這還是建立在，他們自身具有不可替代價值的前提下。人性的真相或許更傾向於：“心由境生”。", "混亂下行的磁場會讓原本堅定乾淨的人，變得自我懷疑。常人的心理本沒有什麼病，若是遇到的懷疑變多了，也就有了病。信息和聯絡如此發達的今天，其實不管你渴望什麼，都一定能找到適合自己的那一款。重要的是你要敢於忠於自己的本心，踽踽行者，從一而終，而不是假裝合群，左搖右擺。不合群的你，才能遇見更合適的人，合群的人往往只是為了群，或許連自己都沒有合過。不要預設和別人共度一生，就自然的相處，命運把你們帶到哪裡就到哪裡。天有道，自不會讓有情人分離;天若無道，人就該遵循天命。天道自然會推著你走向適合你的道路，你只需忍受孤寂，順從心意。", "一個積極的人會知道自己該屏蔽什麼，並且主動去尋找，由哪種聲音來影響和優越自己。自己找到真正神合的群，找到心之所向的夥伴，就是在找回自己，就是在確定自己想要成為什麼樣的人。"], "s": ["你是谁，不重要。选择让什么样的人靠近你，比确定自己是什么样的人，还重要。人是群体动物，环境决定行为，伴侣影响思想，身边人的平均值，就塑造了你差不多的样子。多数人其实是做不到“境由心生”的，是没办法用幼小的自己跟大环境作斗争的。", "孙悟空和哪吒，哪个都没能逆了天，反而最终归顺朝廷。这还是建立在，他们自身具有不可替代价值的前提下。人性的真相或许更倾向于：“心由境生”。", "混乱下行的磁场会让原本坚定干净的人，变得自我怀疑。常人的心理本没有什么病，若是遇到的怀疑变多了，也就有了病。信息和联络如此发达的今天，其实不管你渴望什么，都一定能找到适合自己的那一款。重要的是你要敢于忠于自己的本心，踽踽行者，从一而终，而不是假装合群，左摇右摆。不合群的你，才能遇见更合适的人，合群的人往往只是为了群，或许连自己都没有合过。不要预设和别人共度一生，就自然的相处，命运把你们带到哪里就到哪里。天有道，自不会让有情人分离;天若无道，人就该遵循天命。天道自然会推着你走向适合你的道路，你只需忍受孤寂，顺从心意。", "一个积极的人会知道自己该屏蔽什么，并且主动去寻找，由哪种声音来影响和优越自己。自己找到真正神合的群，找到心之所向的伙伴，就是在找回自己，就是在确定自己想要成为什么样的人。"], "st": "你是谁不重要，选择让什么人靠近你更重要", "tg": ["文字的力量", "當我真正開始愛自己", "選擇對的人", "相信自己的選擇", "人生最重要是做對選擇", "真正適合你的人", "堅定的選擇", "別否定自己", "人生沒有絕對正確的選擇", "每一幀都是熱愛"], "p": "身邊的人會深深影響你，環境常常比意志力更有力量。要勇敢忠於自己，選擇對的人靠近，就是在選擇成為什麼樣的人。", "m": [["環境", ["心由境生"]], ["平均值", ["身邊人塑造你"]], ["忠於本心", ["不假裝合群"]], ["選擇", ["找到同頻夥伴"]]], "f": ["被環境影響", "覺察身邊的聲音", "屏蔽消耗選擇同頻的人", "找回自己"], "g": "讀書會/成長社群年費", "gm": "加入正向的學習社群，讓好的人和好的聲音圍繞自己。"}, {"id": 174, "t": "你在餵養你的靈魂什麼？", "d": "2025/2/10", "b": ["每一個念頭，都在餵養你的靈魂。", "它不分善惡，只吸收你給它的能量。", "你讓它飲下的是焦慮、恐懼、怨恨，", "還是平靜、寬容、覺察？", "當你的念頭被負面情緒填滿，", "靈魂的土地便開始荒蕪。", "你感到沉重、迷失，", "卻從未意識到，正是自己，", "在餵養內心的空虛與痛苦。", "靈魂的力量，來自你對每一個念頭的選擇。", "你可以讓它棲息在憤怒和自我否定中，", "也可以讓它滋養於寧靜與接受之間，", "讓它從無形的枷鎖中解脫，", "活得更加清明與自在。", "你在每個瞬間，都在做出選擇——", "餵養恐懼，它便是束縛；", "餵養愛與信任，它便是自由。", "你餵養什麼，靈魂便是什麼。", "它不依賴外界，它依賴你給的每一個念頭、每一次決心。", "當你停止被痛苦牽引，", "開始關注內心的平和，", "你會發現，靈魂的種子，正在悄然生長。"], "s": ["每一个念头，都在喂养你的灵魂。", "它不分善恶，只吸收你给它的能量。", "你让它饮下的是焦虑、恐惧、怨恨，", "还是平静、宽容、觉察？", "当你的念头被负面情绪填满，", "灵魂的土地便开始荒芜。", "你感到沉重、迷失，", "却从未意识到，正是自己，", "在喂养内心的空虚与痛苦。", "灵魂的力量，来自你对每一个念头的选择。", "你可以让它栖息在愤怒和自我否定中，", "也可以让它滋养于宁静与接受之间，", "让它从无形的枷锁中解脱，", "活得更加清明与自在。", "你在每个瞬间，都在做出选择——", "喂养恐惧，它便是束缚；", "喂养爱与信任，它便是自由。", "你喂养什么，灵魂便是什么。", "它不依赖外界，它依赖你给的每一个念头、每一次决心。", "当你停止被痛苦牵引，", "开始关注内心的平和，", "你会发现，灵魂的种子，正在悄然生长。"], "st": "你在喂养你的灵魂什么？", "tg": ["文字的力量", "當我真正開始愛自己", "靈魂", "心靈的力量", "靈魂和肉體", "豐富我們的內在的精神世界", "心靈的滋養", "心靈的觸動", "身體和靈魂", "被看見的力量"], "p": "每個念頭都在餵養你的靈魂。餵焦慮、怨恨，心會荒蕪；餵平靜、寬容，心會自由。你給什麼，靈魂就變成什麼。", "m": [["念頭", ["餵養靈魂"]], ["負面", ["土地荒蕪"]], ["選擇", ["每一刻都在選"]], ["結果", ["恐懼束縛", "愛與信任自由"]]], "f": ["察覺自己在餵什麼", "停止被痛苦牽引", "選擇平和與信任", "靈魂種子生長"], "g": "心靈療癒書籍", "gm": "每天讀幾頁溫暖的文字，用好的內容餵養自己的心。"}, {"id": 175, "t": "成長的本質是向內求", "d": "2025/2/7", "b": [], "s": [], "st": "成长的本质是向内求", "tg": ["向內探尋自我", "自我的力量", "向內求提升自己", "自洽而內求", "成長的力量", "成長與突破", "一切向內求", "醒悟自己就是成長"], "p": "成長的關鍵是往自己心裡找答案。不是向外抓，而是向內看見自己、調整自己。", "m": [["成長", ["向內求"]], ["自洽", ["和自己和好"]], ["醒悟", ["就是成長"]], ["力量", ["來自內在"]]], "f": ["向外找答案", "轉向內在探尋", "看見並調整自己", "真正成長"], "g": "內在探索日記", "gm": "每天問自己一個問題並寫下答案，慢慢認識內在的自己。"}, {"id": 176, "t": "厭倦生活，是因為你停止了成長", "d": "2025/2/6", "b": ["疲倦和厭倦，往往不是來自外界，而是內心的停滯。", "當我們停止了成長，生命的能量便開始枯竭。", "“無常是唯一常”。", "一切都在流動，心靈也應如此。", "如果你停止了內在的變化，", "你便與生命的能量脫節，", "就像一潭死水，失去了活力。", "成長，是內在能量的覺醒。", "它不需要外界的刺激，", "而是自己不斷探索、突破、改變。", "當你停止了思考和行動，", "你就開始了對生活的厭倦。", "每一次成長，都是能量的流動。", "它讓你不斷超越自我，", "讓生活恢復色彩。", "沒有成長，生活只剩下空洞。", "厭倦生活，是因為你不再前行，", "是因為你不再覺醒。", "而每一個覺醒，都是新生。", "🌸 生活的意義，在於不斷成長，", "在於不斷與內在的能量連接。"], "s": ["疲倦和厌倦，往往不是来自外界，而是内心的停滞。", "当我们停止了成长，生命的能量便开始枯竭。", "“无常是唯一常”。", "一切都在流动，心灵也应如此。", "如果你停止了内在的变化，", "你便与生命的能量脱节，", "就像一潭死水，失去了活力。", "成长，是内在能量的觉醒。", "它不需要外界的刺激，", "而是自己不断探索、突破、改变。", "当你停止了思考和行动，", "你就开始了对生活的厌倦。", "每一次成长，都是能量的流动。", "它让你不断超越自我，", "让生活恢复色彩。", "没有成长，生活只剩下空洞。", "厌倦生活，是因为你不再前行，", "是因为你不再觉醒。", "而每一个觉醒，都是新生。", "🌸 生活的意义，在于不断成长，", "在于不断与内在的能量连接。"], "st": "厌倦生活，是因为你停止了成长", "tg": ["生活美學", "日常文案", "人生的意義", "能量"], "p": "覺得生活很無聊、很累，常常是因為自己停止成長了，像一潭不流動的水。持續學習、改變，生活就會重新有色彩。", "m": [["厭倦", ["內心停滯"]], ["無常", ["一切在流動"]], ["成長", ["內在能量覺醒"]], ["新生", ["每次覺醒"]]], "f": ["厭倦生活", "看見自己停止成長", "開始探索與突破", "生活恢復色彩"], "g": "線上學習課程", "gm": "學一個新技能或新興趣，讓生活重新流動起來。"}, {"id": 177, "t": "你把“時間”“精力”“錢”放在了哪裡？", "d": "2025/1/6", "b": ["年初，我們通常都會做計劃，期待著達到某個目標，無論是職業晉升、身體健康，還是人際關係的改善。但真正問自己，“我的焦點真的在這個上面嗎？”時，答案往往令人沉默。因為很多時候，我們的焦點並沒有真正放在所追求的那些事物上。", "🕰️ 想要成就一件事，單單的渴望是不夠的。需要的是不斷的投入——時間、精力和金錢。反思自己每天的生活，我們會發現，我們的時間和精力往往被瑣事和即刻的滿足所佔據，而真正重要的目標，卻因缺乏持續的關注和行動而被邊緣化。", "🌱 《焦點在哪，成果就在哪》這句話揭示了一個簡單卻深刻的真理：我們的成果直接反映了我們的關注點。如果你想要健康的身體，回顧一下，你每天有多少時間是在做有益於健康的事？如健身、合理飲食。如果你的目標是職場晉升，思考一下，你有多少精力是在提升自己的專業技能和工作效率上？", "🔍 一個有效的方法是進行自我審查。每天晚上，花幾分鐘回顧一天中的時間如何分配。哪些時間是有效利用，哪些是被浪費的？逐漸地，你可以調整自己的行為模式，確保更多的時間和精力被投入到真正重要的事務上。", "📈 通過這種方法，你會逐漸看到變化。因為當你的焦點對準了目標，每一點小小的進步都會累積起來，最終帶來顯著的成果。", "🌟", "希望這篇分享能夠激勵你重新評估和分配你的時間和精力。記住，只有真正關注和努力，你的夢想才會逐步變為現實。願你在這個過程中找到自己的節奏，把每一份關注都轉化為明天的成果。", "多少錢在這件事情上！"], "s": ["年初，我们通常都会做计划，期待着达到某个目标，无论是职业晋升、身体健康，还是人际关系的改善。但真正问自己，“我的焦点真的在这个上面吗？”时，答案往往令人沉默。因为很多时候，我们的焦点并没有真正放在所追求的那些事物上。", "🕰️ 想要成就一件事，单单的渴望是不够的。需要的是不断的投入——时间、精力和金钱。反思自己每天的生活，我们会发现，我们的时间和精力往往被琐事和即刻的满足所占据，而真正重要的目标，却因缺乏持续的关注和行动而被边缘化。", "🌱 《焦点在哪，成果就在哪》这句话揭示了一个简单却深刻的真理：我们的成果直接反映了我们的关注点。如果你想要健康的身体，回顾一下，你每天有多少时间是在做有益于健康的事？如健身、合理饮食。如果你的目标是职场晋升，思考一下，你有多少精力是在提升自己的专业技能和工作效率上？", "🔍 一个有效的方法是进行自我审查。每天晚上，花几分钟回顾一天中的时间如何分配。哪些时间是有效利用，哪些是被浪费的？逐渐地，你可以调整自己的行为模式，确保更多的时间和精力被投入到真正重要的事务上。", "📈 通过这种方法，你会逐渐看到变化。因为当你的焦点对准了目标，每一点小小的进步都会累积起来，最终带来显著的成果。", "🌟", "希望这篇分享能够激励你重新评估和分配你的时间和精力。记住，只有真正关注和努力，你的梦想才会逐步变为现实。愿你在这个过程中找到自己的节奏，把每一份关注都转化为明天的成果。", "多少钱在这件事情上！"], "st": "你把“时间”“精力”“钱”放在了哪里？", "tg": ["目標實現", "時間管理", "生活技能", "小紅書心得分享", "如何給自己補充精神能量", "實現自我的價值", "怎樣變得富有", "讓時間更有力量"], "p": "你想要什麼成果，就看你把時間、精力和錢放在哪裡。每天晚上回顧一下時間用在哪，慢慢調整到重要的事情上。", "m": [["焦點", ["在哪成果就在哪"]], ["投入", ["時間", "精力", "金錢"]], ["審查", ["每晚回顧"]], ["累積", ["小進步變成果"]]], "f": ["訂了目標", "檢查時間精力金錢流向", "調整投入到重要的事", "成果累積"], "g": "時間管理手帳", "gm": "用時間軸記錄一天，清楚看見投入在哪，幫助實現目標。"}, {"id": 178, "t": "我是一切的源泉，愛是一切的答案", "d": "2025/1/2", "b": [], "s": [], "st": "我是一切的源泉，爱是一切的答案", "tg": ["你的生命屬於你自己", "愛", "陌生人也很溫暖", "擁有愛的能力", "本自具足的愛與力量", "一切發生皆利於我", "當我開始真正愛自己", "愛的具象化", "愛自己", "自由與勇敢"], "p": "你自己就是一切的源頭，而「愛」是所有問題的答案。先真正愛自己，就有能力把愛給別人。", "m": [["源泉", ["我自己"]], ["答案", ["愛"]], ["愛自己", ["開始真正愛自己"]], ["一切發生", ["皆利於我"]]], "f": ["感到匱乏", "回到自己是源頭", "先好好愛自己", "用愛回應一切"], "g": "自我呵護面膜組", "gm": "敷一片面膜好好照顧自己，是很具體的「愛自己」時刻。"}, {"id": 179, "t": "這個世界只有你在場，其他人都是NPC", "d": "2024/12/24", "b": ["想象一下，如果這個世界上只有你是真實的，周圍的人都像電子遊戲中的NPC（非玩家控制角色），他們的行為和反應都是預設的，不具備真實的情感和意識。這樣的思考角度雖然極端，但它啟發我們重新審視自己在這個世界中的角色和存在的意義。", "🌀 在這樣的世界觀下，每一次交流和互動，都是你與自己的對話。每一個所謂的“他人”的反應，都是你內心期望和恐懼的反映。這不是鼓勵自我中心，而是一個探索自我、理解內心的工具。通過這種方式，你可以更清晰地看到，很多時候，外界的壓力和衝突其實是自我內在衝突的外化。", "💡 如果將這個概念應用到日常生活中，你會發現自己對事件的反應完全取決於自己的選擇。別人的言行不再有能力影響你"], "s": ["想象一下，如果这个世界上只有你是真实的，周围的人都像电子游戏中的NPC（非玩家控制角色），他们的行为和反应都是预设的，不具备真实的情感和意识。这样的思考角度虽然极端，但它启发我们重新审视自己在这个世界中的角色和存在的意义。", "🌀 在这样的世界观下，每一次交流和互动，都是你与自己的对话。每一个所谓的“他人”的反应，都是你内心期望和恐惧的反映。这不是鼓励自我中心，而是一个探索自我、理解内心的工具。通过这种方式，你可以更清晰地看到，很多时候，外界的压力和冲突其实是自我内在冲突的外化。", "💡 如果将这个概念应用到日常生活中，你会发现自己对事件的反应完全取决于自己的选择。别人的言行不再有能力影响你"], "st": "这个世界只有你在场，其他人都是NPC", "tg": ["你的生命屬於你自己", "你應該是自己的那座山", "成為真正的自己", "別在意別人眼裡的自己", "陌生人也很溫暖"], "p": "想像世界只有你是主角，別人像遊戲角色，他們的反應其實照出你內心的期待和害怕。你的反應由你自己選擇。", "m": [["想像", ["只有你在場"]], ["他人", ["內心的反映"]], ["不是", ["自我中心"]], ["選擇", ["反應由你決定"]]], "f": ["被別人影響", "看見那是內心的投射", "選擇自己的反應", "不再被外界左右"], "g": "遊戲化習慣App訂閱", "gm": "把生活當成一場自己主導的遊戲，用升級方式養成好習慣。"}, {"id": 180, "t": "樹上有洞，也不影響它長成參天大樹", "d": "2024/12/9", "b": ["🌳 《樹上有個洞，不影響它長成參天大樹》", "週末去抱了抱大樹，抬頭猛然發現，樹幹中央有一個不小的洞。不過，在粗壯的樹幹上顯得微不足道，大樹依然枝繁葉茂，昂首挺胸。", "🍃 即使內心有裂縫，也不會阻礙我們的成長。我們每個人的生命中，都有那些失敗的嘗試、心靈的創傷、失去的愛......但是，幹嘛要糾結於那些傷痕和洞呢？", "💪 真正的力量源於我們如何面對這些裂縫。樹，雖然心臟有洞，它依然能吸收雨水和陽光，堅強地面對風雨，每到春天依舊能吐翠，夏天為路人帶來陰涼，秋天掛滿果實。", "🌞 我們每個人的生活中也存在無法填補的空白，但正是這些不完美的地方，構成了我們成長的土壤。這些裂痕讓我們更加堅韌，增加了我們的同理心，教會我們如何珍惜眼前所擁有的。", "🌈 當我們學會接受並擁抱自己的不完美時，會發現這些傷痕其實幫助我們建立了更堅實的自我。它們不是阻礙，而是推動我們向前的動力。", "🍁 所以，當覺得自己因為“缺陷”而自卑或挫敗時，不妨想想那棵帶著傷痕依然堅強挺立的老樹。內心的裂痕絕不是成長的障礙，反而是我們成為更好自己的催化劑，讓我們更真實、更有力量。", "🌟", "願你也能像那棵樹一樣，即使帶著傷痕，也能生長得更加茂盛、更加堅強。在接納自身的不完美中，找到真正的自我，勇敢地向著陽光生長！"], "s": ["🌳 《树上有个洞，不影响它长成参天大树》", "周末去抱了抱大树，抬头猛然发现，树干中央有一个不小的洞。不过，在粗壮的树干上显得微不足道，大树依然枝繁叶茂，昂首挺胸。", "🍃 即使内心有裂缝，也不会阻碍我们的成长。我们每个人的生命中，都有那些失败的尝试、心灵的创伤、失去的爱......但是，干嘛要纠结于那些伤痕和洞呢？", "💪 真正的力量源于我们如何面对这些裂缝。树，虽然心脏有洞，它依然能吸收雨水和阳光，坚强地面对风雨，每到春天依旧能吐翠，夏天为路人带来阴凉，秋天挂满果实。", "🌞 我们每个人的生活中也存在无法填补的空白，但正是这些不完美的地方，构成了我们成长的土壤。这些裂痕让我们更加坚韧，增加了我们的同理心，教会我们如何珍惜眼前所拥有的。", "🌈 当我们学会接受并拥抱自己的不完美时，会发现这些伤痕其实帮助我们建立了更坚实的自我。它们不是阻碍，而是推动我们向前的动力。", "🍁 所以，当觉得自己因为“缺陷”而自卑或挫败时，不妨想想那棵带着伤痕依然坚强挺立的老树。内心的裂痕绝不是成长的障碍，反而是我们成为更好自己的催化剂，让我们更真实、更有力量。", "🌟", "愿你也能像那棵树一样，即使带着伤痕，也能生长得更加茂盛、更加坚强。在接纳自身的不完美中，找到真正的自我，勇敢地向着阳光生长！"], "st": "树上有洞，也不影响它长成参天大树", "tg": ["成長的力量", "生命的智慧", "接受不完美", "小紅書勵志", "不如去理解一棵樹", "我變成了一顆樹", "我要做一棵樹", "去長成不一樣的樹吧", "我應該是一棵參天大樹", "擁有你的一棵樹"], "p": "大樹中間有一個洞，還是長得又高又茂盛。我們心裡的傷和缺點，也不會擋住成長，反而讓我們更堅強。", "m": [["樹洞", ["不影響長大"]], ["傷痕", ["失敗", "創傷", "失去"]], ["力量", ["如何面對裂縫"]], ["接納", ["不完美是成長土壤"]]], "f": ["因缺陷自卑", "想想帶洞的大樹", "接納自己的不完美", "更茂盛堅強地成長"], "g": "森林步道健行", "gm": "去抱抱大樹、走走森林，在大自然裡感受生命的韌性。"}, {"id": 181, "t": "轉念後，我悟了", "d": "2024/12/3", "b": ["《轉念後，我悟了》", "生活有時像是一股壓得人喘不過氣的重流，工作、家庭、責任、期待，好像一切都在向前推進，幾乎沒有停歇的餘地。那天，突然意識到，心裡竟然壓得滿滿的，疲憊成了常態，世界彷彿對每個人都佈滿了無法逃避的枷鎖。", "🍃 然而，正是在這種時刻，突然領悟到——“沒人能傷害我，除非我允許。” 這句話就像一道光，照亮了內心的一片陰霾，瞬間發現，真正的束縛，其實是自己給自己設下的心結。", "💭 曾經，情緒總是被外界的人事物所牽動。別人說一句話，或做了什麼，情緒就會隨之起伏。但轉念一想，那些所謂的“傷害”，真正的源頭，並不是別人，而是內心的反應。別人如何說話，做事，完全無法決定情緒，只有當允許它們影響，痛苦才會在心裡生根發芽。", "🌿 於是，學會了放下那些無謂的期待和評價，不再讓外界的聲音輕易左右自己的心境。漸漸明白，真正的力量來自內心，情緒的主權應該交還給自己，而非交給外界的那些看不見的力量。", "✨ 當終於明白這一點時，感到一種前所未有的釋然。原來，所有的困擾和不安，都是內心投射出的影像。轉念之後，才發現，生活中的每一次挑戰，每一次困境，都是一次重新認識自我的機會，每一次受傷，都是讓自己更加堅韌的契機。", "🌸 現在，更加懂得與自己和解，慢慢學會在忙碌和喧囂中找到平靜，不再糾結於那些曾經讓人痛苦的小事。生活不必完美，重要的是內心的平和與自在。只要心裡明白——外界的紛擾無法左右情緒，真正的力量，掌握在自己手中。", "💫 希望這份領悟能帶給你一絲啟發，提醒自己：沒人能傷害，除非允許。釋放那些不屬於自己的負擔，重新掌控內心的平靜與力量，整個世界，便會在不經意間變得輕盈而美好。", "🌈", "願你也能在心靈的旅程中找到自己真正的主宰，活得更自在、真實。"], "s": ["《转念后，我悟了》", "生活有时像是一股压得人喘不过气的重流，工作、家庭、责任、期待，好像一切都在向前推进，几乎没有停歇的余地。那天，突然意识到，心里竟然压得满满的，疲惫成了常态，世界仿佛对每个人都布满了无法逃避的枷锁。", "🍃 然而，正是在这种时刻，突然领悟到——“没人能伤害我，除非我允许。” 这句话就像一道光，照亮了内心的一片阴霾，瞬间发现，真正的束缚，其实是自己给自己设下的心结。", "💭 曾经，情绪总是被外界的人事物所牵动。别人说一句话，或做了什么，情绪就会随之起伏。但转念一想，那些所谓的“伤害”，真正的源头，并不是别人，而是内心的反应。别人如何说话，做事，完全无法决定情绪，只有当允许它们影响，痛苦才会在心里生根发芽。", "🌿 于是，学会了放下那些无谓的期待和评价，不再让外界的声音轻易左右自己的心境。渐渐明白，真正的力量来自内心，情绪的主权应该交还给自己，而非交给外界的那些看不见的力量。", "✨ 当终于明白这一点时，感到一种前所未有的释然。原来，所有的困扰和不安，都是内心投射出的影像。转念之后，才发现，生活中的每一次挑战，每一次困境，都是一次重新认识自我的机会，每一次受伤，都是让自己更加坚韧的契机。", "🌸 现在，更加懂得与自己和解，慢慢学会在忙碌和喧嚣中找到平静，不再纠结于那些曾经让人痛苦的小事。生活不必完美，重要的是内心的平和与自在。只要心里明白——外界的纷扰无法左右情绪，真正的力量，掌握在自己手中。", "💫 希望这份领悟能带给你一丝启发，提醒自己：没人能伤害，除非允许。释放那些不属于自己的负担，重新掌控内心的平静与力量，整个世界，便会在不经意间变得轻盈而美好。", "🌈", "愿你也能在心灵的旅程中找到自己真正的主宰，活得更自在、真实。"], "st": "转念后，我悟了", "tg": ["自我覺醒", "從容生活", "內心力量", "小紅書心靈啟發", "轉念一想一切都好", "轉念轉人生", "轉移注意力", "轉變你的心態轉變你的思維", "正念練習", "改變從心開始"], "p": "生活壓力很大時突然想通一句話：「沒人能傷害我，除非我允許。」別人怎麼說是他的事，讓不讓它影響我，是我自己決定的。", "m": [["壓力", ["工作家庭責任"]], ["領悟", ["除非我允許"]], ["源頭", ["內心的反應"]], ["主權", ["情緒交還自己"]]], "f": ["被外界牽動", "轉念看見是自己的反應", "放下期待與評價", "拿回情緒主權"], "g": "香氛擴香瓶(無火)", "gm": "在家放一瓶喜歡的香氣，忙亂時深吸一口，提醒自己：心情由我決定。"}, {"id": 182, "t": "有些記憶，有味道…", "d": "2024/11/6", "b": ["你會因為一個味道勾起一段回憶嗎？例如烤紅薯想起放學的時間，例如某個淡淡的洗衣液味想起某個crush.....", "評論區分享看看會不會遇到“味道”的靈魂伴侶"], "s": ["你会因为一个味道勾起一段回忆吗？例如烤红薯想起放学的时间，例如某个淡淡的洗衣液味想起某个crush.....", "评论区分享看看会不会遇到“味道”的灵魂伴侣"], "st": "有些记忆，有味道…", "tg": ["心理學效應", "氣味是記憶的載體", "回憶", "情緒樹洞", "治癒", "內容過於真實", "萬萬沒想到", "記錄吧就現在"], "p": "一個味道可以勾起一段回憶，像烤地瓜讓人想起放學時光。氣味是記憶的鑰匙，好好收藏讓你開心的味道。", "m": [["氣味", ["記憶的載體"]], ["例子", ["烤地瓜", "洗衣精"]], ["情緒", ["被勾起"]], ["分享", ["找到味道知己"]]], "f": ["聞到熟悉味道", "回憶湧上來", "感受當下情緒", "收藏溫暖的記憶"], "g": "天然香氛洗衣精", "gm": "乾淨溫柔的衣物香氣，每天穿上身，變成屬於自己的幸福記憶味道。"}, {"id": 183, "t": "這場雨，好像也沒那麼壞", "d": "2024/11/4", "b": ["因為一場雨，我看清楚了愛情……", "事件：今天因為下雨沒有去菜市場，有點小遺憾，導致一直提不起興趣做飯就迷迷糊糊睡著了，一覺醒來老公把菜全都做好了，還有我最喜歡吃的麻婆豆腐", "覺察：其實可能我想要去買菜的意願沒有如此強烈，壞情緒的來源也並非因為這場雨……而是最近工作的事情很心煩，只是剛好天下雨了，讓我把壞情緒歸咎於大雨", "思考：老天安排的這場雨好像也沒有這麼壞，它讓我看到我身邊有一個如此愛惜我的人，突然好開心，好幸福"], "s": ["因为一场雨，我看清楚了爱情……", "事件：今天因为下雨没有去菜市场，有点小遗憾，导致一直提不起兴趣做饭就迷迷糊糊睡着了，一觉醒来老公把菜全都做好了，还有我最喜欢吃的麻婆豆腐", "觉察：其实可能我想要去买菜的意愿没有如此强烈，坏情绪的来源也并非因为这场雨……而是最近工作的事情很心烦，只是刚好天下雨了，让我把坏情绪归咎于大雨", "思考：老天安排的这场雨好像也没有这么坏，它让我看到我身边有一个如此爱惜我的人，突然好开心，好幸福"], "st": "这场雨，好像也没那么坏", "tg": ["壞情緒走開", "好的另一邊能減輕人間疾苦", "壞天氣", "轉念", "夫妻日常", "婚姻修復"], "p": "因為下雨沒去買菜，心情不好，後來才發現壞心情其實是工作煩，不是雨的錯。醒來老公做好了飯，這場雨反而讓我看見愛。", "m": [["事件", ["下雨沒買菜"]], ["覺察", ["壞情緒源於工作"]], ["轉念", ["雨沒那麼壞"]], ["看見", ["身邊的愛"]]], "f": ["心情不好怪天氣", "覺察真正的原因", "轉念看見好的一面", "感到幸福"], "g": "家常調味料組(麻婆豆腐醬)", "gm": "一起做一道喜歡的家常菜，把日常小事變成彼此表達愛的方式。"}, {"id": 184, "t": "天下婆婆，一般“黑”？", "d": "11/1/2024", "b": ["09.05 覺察功課", "【事件】回家一進門看到廁所鏡櫃下有一管婆婆的BB霜，我的心情瞬間有點複雜了...", "【覺察】你們懂那種突然冒出來的不舒服情緒嗎？我也問了自己：她用個BB霜，我為什麼會不開心？其實，追求美麗是每個人的權利，婆婆也不例外呀！不過一想到婆婆會去貼孩子的臉，帶孩子時可能會沾到化妝品，我才意識到自己潛在的擔憂。", "【思考】護崽心理真的會有，但不是錯。多一點覺察背後的原因，不要被情緒帶跑，不要對立和指責，溝通才是解決的最佳方式。長了嘴是要說話的，但是我決定讓老公做溝通的人，提醒她儘量別在帶孩子時用化妝品，免得對寶寶有影響。"], "s": ["09.05 觉察功课", "【事件】回家一进门看到厕所镜柜下有一管婆婆的BB霜，我的心情瞬间有点复杂了...", "【觉察】你们懂那种突然冒出来的不舒服情绪吗？我也问了自己：她用个BB霜，我为什么会不开心？其实，追求美丽是每个人的权利，婆婆也不例外呀！不过一想到婆婆会去贴孩子的脸，带孩子时可能会沾到化妆品，我才意识到自己潜在的担忧。", "【思考】护崽心理真的会有，但不是错。多一点觉察背后的原因，不要被情绪带跑，不要对立和指责，沟通才是解决的最佳方式。长了嘴是要说话的，但是我决定让老公做沟通的人，提醒她尽量别在带孩子时用化妆品，免得对宝宝有影响。"], "st": "天下婆婆，一般“黑”？", "tg": ["護崽心理", "婆婆帶娃", "新手媽媽", "婆媳關係怎樣處理"], "p": "看到婆婆的BB霜心情複雜，問自己為什麼不開心，發現是擔心寶寶。不對立、不指責，請老公溫和溝通就好。", "m": [["事件", ["看到婆婆BB霜"]], ["覺察", ["擔心化妝品沾到寶寶"]], ["思考", ["護崽心理不是錯"]], ["做法", ["不對立", "找對的人溝通"]]], "f": ["突然不舒服", "問自己為什麼", "看見背後的擔心", "用溝通取代指責"], "g": "嬰幼兒溫和濕紙巾", "gm": "隨時幫寶寶擦臉擦手，安心又溫和，減少家人之間的擔心。"}, {"id": 185, "t": "沒有人能傷害我，除非我允許", "d": "2024/11/1", "b": ["真正能傷害我們的，並不是別人，而是我們自己對待這些事情的方式。😊", "1. 情緒的真正主導者是我們自己", "在心理學中，有個非常經典的情緒ABC理論：A是事件，B是我們的信念，C才是最終的情緒反應。簡單來說，就是事情發生後，我們怎麼“想”這件事，才決定了我們的感受。比如朋友沒有回覆消息，有些人會覺得“她是不是不重視我了”，而有些人則會想“她可能在忙吧”。其實，情緒是由我們自己對事情的解讀而產生的！所以，不妨在感覺到受傷時，停下來問問自己：我是不是真的需要這麼在意？✨", "2. 建立“情緒邊界”，學會保護自己🛡️", "設立清晰的情緒邊界，是讓自己不輕易被影響的關鍵。別人隨意的評論或負面的情緒，不一定非得影響到我們。比如當別人對你有負面評價時，問問自己：“這是對我的真實反饋嗎？還是對方在宣洩情緒？”學會對外界聲音進行篩選，才能避免讓自己陷入情緒的漩渦。⛅️", "3. 學會自我認可，成為自己的“最佳支持者”🌈", "我們總是太在意外界的評價，彷彿只有別人的肯定，才能讓自己感到安心。但其實，我們每個人都有獨一無二的價值。通過自我認可和接納，找到屬於自己的安全感，才不會輕易被他人左右。記住，你的價值不在於別人怎麼想，而在於你自己怎麼看待自己！💪#自信心提升#內在力量", "4. 允許自己選擇“無感”🌸", "其實，對很多事情，我們可以選擇“不在意”！有時候無視一些不必要的評價，比反應更有力量。允許自己對那些不值得的事選擇無感，意味著我們已經不再需要依靠外界的認可來證明自己。學會忽略，才是真正的成長。😊#情緒自由#心靈成長", "5. 每一次的“受傷”，都是我們成長的機會🌱", "每次經歷情緒波動後，其實我們都在成長。感到被傷害的瞬間，也是在提醒我們，有什麼還沒完全看清、放下，或者接納自己。通過一次次的反思和學習，我們會越來越接近那個內心強大的自己。🌻每一次情緒的波動，都是我們成長的力量。#心靈治癒#自我成長"], "s": ["真正能伤害我们的，并不是别人，而是我们自己对待这些事情的方式。😊", "1. 情绪的真正主导者是我们自己", "在心理学中，有个非常经典的情绪ABC理论：A是事件，B是我们的信念，C才是最终的情绪反应。简单来说，就是事情发生后，我们怎么“想”这件事，才决定了我们的感受。比如朋友没有回复消息，有些人会觉得“她是不是不重视我了”，而有些人则会想“她可能在忙吧”。其实，情绪是由我们自己对事情的解读而产生的！所以，不妨在感觉到受伤时，停下来问问自己：我是不是真的需要这么在意？✨", "2. 建立“情绪边界”，学会保护自己🛡️", "设立清晰的情绪边界，是让自己不轻易被影响的关键。别人随意的评论或负面的情绪，不一定非得影响到我们。比如当别人对你有负面评价时，问问自己：“这是对我的真实反馈吗？还是对方在宣泄情绪？”学会对外界声音进行筛选，才能避免让自己陷入情绪的漩涡。⛅️", "3. 学会自我认可，成为自己的“最佳支持者”🌈", "我们总是太在意外界的评价，仿佛只有别人的肯定，才能让自己感到安心。但其实，我们每个人都有独一无二的价值。通过自我认可和接纳，找到属于自己的安全感，才不会轻易被他人左右。记住，你的价值不在于别人怎么想，而在于你自己怎么看待自己！💪#自信心提升#内在力量", "4. 允许自己选择“无感”🌸", "其实，对很多事情，我们可以选择“不在意”！有时候无视一些不必要的评价，比反应更有力量。允许自己对那些不值得的事选择无感，意味着我们已经不再需要依靠外界的认可来证明自己。学会忽略，才是真正的成长。😊#情绪自由#心灵成长", "5. 每一次的“受伤”，都是我们成长的机会🌱", "每次经历情绪波动后，其实我们都在成长。感到被伤害的瞬间，也是在提醒我们，有什么还没完全看清、放下，或者接纳自己。通过一次次的反思和学习，我们会越来越接近那个内心强大的自己。🌻每一次情绪的波动，都是我们成长的力量。#心灵治愈#自我成长"], "st": "没有人能伤害我，除非我允许", "tg": ["成長心路", "內在力量", "心靈治癒", "自我成長", "情緒自由", "心理學知識", "心態建設", "情緒管理", "如何提升自己", "內心力量", "獨立思維", "自我接納", "活出自我", "如何更快樂", "關係中的自我"], "p": "讓我們受傷的，常常是自己對事情的「想法」。學會設情緒界線、自我肯定、對不值得的事選擇不在意，每次受傷都是成長。", "m": [["ABC理論", ["事件", "信念", "情緒"]], ["界線", ["篩選外界聲音"]], ["自我認可", ["最佳支持者"]], ["無感", ["允許不在意"]]], "f": ["感到受傷", "停下問我的想法是什麼", "設界線並肯定自己", "從受傷中成長"], "g": "情緒覺察日誌", "gm": "用「事件／想法／情緒」三欄記錄，練習看見是想法決定了感受。"}, {"id": 186, "t": "我只是來陪練的，你可別真恨了我", "d": "2024/10/31", "b": ["🌈 有個故事，聽完好像觸了電。有幾位小仙打算來人間修行，其中一個說她要來磨練自己的脾氣和怨恨。她問大家：“誰願意和我一起？誰來做我的陪練？”可是，沒人願意做她的敵人。", "💔 最後，她最好的朋友說：“既然沒有人願意，我就陪你去吧。” 她聽了很開心，覺得終於能來人間磨練一下了。但她的朋友突然哭了起來。她問：“你為什麼哭啊？”朋友說：“我就怕到時候你真的會恨上我。”", "🌟 生活中的爭執其實都是在幫我們成長。特別是和伴侶之間的小摩擦，完全可以看成是彼此成長的機會。", "🌺 宗薩欽哲仁波切曾經說過：“觀察自己的情緒，而不被它們控制，這就是智慧的開始。”夫妻關係的實質是互為陪練，這話一點沒錯。每次爭吵都是認識對方更深、讓關係更緊密的機會。", "🌀 真正的親密關係不是沒有摩擦，而是在摩擦中找到成長的空間，一起向前走。每次不快其實都是瞭解彼此更多的機會，是讓關係更緊密的橋樑。", "💫 讓我們把每一個挑戰都看作是成長的禮物，用這個故事作為鏡子，反思並改善自己的內心。當你內心和諧，你的世界也會變得更美好。🌷"], "s": ["🌈 有个故事，听完好像触了电。有几位小仙打算来人间修行，其中一个说她要来磨练自己的脾气和怨恨。她问大家：“谁愿意和我一起？谁来做我的陪练？”可是，没人愿意做她的敌人。", "💔 最后，她最好的朋友说：“既然没有人愿意，我就陪你去吧。” 她听了很开心，觉得终于能来人间磨练一下了。但她的朋友突然哭了起来。她问：“你为什么哭啊？”朋友说：“我就怕到时候你真的会恨上我。”", "🌟 生活中的争执其实都是在帮我们成长。特别是和伴侣之间的小摩擦，完全可以看成是彼此成长的机会。", "🌺 宗萨钦哲仁波切曾经说过：“观察自己的情绪，而不被它们控制，这就是智慧的开始。”夫妻关系的实质是互为陪练，这话一点没错。每次争吵都是认识对方更深、让关系更紧密的机会。", "🌀 真正的亲密关系不是没有摩擦，而是在摩擦中找到成长的空间，一起向前走。每次不快其实都是了解彼此更多的机会，是让关系更紧密的桥梁。", "💫 让我们把每一个挑战都看作是成长的礼物，用这个故事作为镜子，反思并改善自己的内心。当你内心和谐，你的世界也会变得更美好。🌷"], "st": "我只是来陪练的，你可别真恨了我", "tg": ["心靈成長", "修行之路", "人際關係", "宗薩智慧", "夫妻同行", "人生的意義", "人生就是一場修行"], "p": "有個故事：好朋友願意來人間當你的「陪練」敵人，只怕你真的恨他。生活中的爭執，尤其和伴侶的摩擦，都是幫彼此成長的機會。", "m": [["故事", ["小仙找陪練"]], ["陪練", ["爭執是幫助成長"]], ["伴侶", ["互為陪練"]], ["智慧", ["觀察情緒不被控制"]]], "f": ["和伴侶起摩擦", "想起對方是陪練", "觀察情緒不被控制", "關係更緊密"], "g": "雙人下午茶組", "gm": "吵架後一起喝杯茶、吃點心，讓摩擦變成更了解彼此的機會。"}, {"id": 187, "t": "相信一下，對你有什麼壞處？", "d": "編輯時間：2024/10/31", "b": ["相信一下對你來說有什麼壞處", "我有一個朋友，他的父親在一次意外中去世了。那一天幾乎摧毀了他整個世界。父親曾是他最親近的人，帶給他無盡的溫暖和安全感。父親去世後，他陷入深深的悲痛中，久久不能釋懷，甚至時常擔心父親會因為自己未能彌補的過失而在地獄受苦。", "在我們一次聊天中，他向我傾訴了這些困擾。他聲音哽咽，內心充滿了對父親的思念與自責，“我害怕我爸去了地獄，受著懲罰。好多事情我都還沒來得及做，他會不會怪我？”", "聽著他的話，我感到他的痛苦，便輕輕地問他：“相信你爸爸去了天堂對你來說有什麼壞處呢？”", "他愣了一下，似乎從來沒有想過這樣的問題。他沉默了好一會兒，才緩緩地回答：“也許沒有壞處吧……但是我總覺得自己做得不夠好，害怕他會因為我的錯而不安。”", "我微笑著對他說：“你想象一下，如果你的父親現在在一個溫暖的地方，看著你繼續生活，他會不會更希望看到你開心、平和？相信他去了天堂，不會減少你的思念，但卻能帶給你一份內心的安寧。也許，這也是他希望看到的，對吧？”", "他深深地吸了一口氣，彷彿終於放下了心中的包袱。從那天起，他開始試著去相信父親在另一個平靜而美好的地方守護著他。他的內心逐漸從痛苦中走出來，開始帶著溫暖的懷念去回憶父親。我看到他慢慢走向內心的平靜，彷彿找到了內心的歸宿。"], "s": ["相信一下对你来说有什么坏处", "我有一个朋友，他的父亲在一次意外中去世了。那一天几乎摧毁了他整个世界。父亲曾是他最亲近的人，带给他无尽的温暖和安全感。父亲去世后，他陷入深深的悲痛中，久久不能释怀，甚至时常担心父亲会因为自己未能弥补的过失而在地狱受苦。", "在我们一次聊天中，他向我倾诉了这些困扰。他声音哽咽，内心充满了对父亲的思念与自责，“我害怕我爸去了地狱，受着惩罚。好多事情我都还没来得及做，他会不会怪我？”", "听着他的话，我感到他的痛苦，便轻轻地问他：“相信你爸爸去了天堂对你来说有什么坏处呢？”", "他愣了一下，似乎从来没有想过这样的问题。他沉默了好一会儿，才缓缓地回答：“也许没有坏处吧……但是我总觉得自己做得不够好，害怕他会因为我的错而不安。”", "我微笑着对他说：“你想象一下，如果你的父亲现在在一个温暖的地方，看着你继续生活，他会不会更希望看到你开心、平和？相信他去了天堂，不会减少你的思念，但却能带给你一份内心的安宁。也许，这也是他希望看到的，对吧？”", "他深深地吸了一口气，仿佛终于放下了心中的包袱。从那天起，他开始试着去相信父亲在另一个平静而美好的地方守护着他。他的内心逐渐从痛苦中走出来，开始带着温暖的怀念去回忆父亲。我看到他慢慢走向内心的平静，仿佛找到了内心的归宿。"], "st": "相信一下，对你有什么坏处？", "tg": ["心態很重要", "心態", "人生低谷", "自我價值", "勇敢做自己", "人生感悟", "相信自己", "經歷", "人生", "人生就是一場修行"], "p": "朋友的爸爸過世，他擔心爸爸受苦而很痛苦。問他：「相信爸爸去了好地方，對你有什麼壞處？」選擇一個溫暖的信念，能帶來內心的安寧。", "m": [["悲傷", ["失去至親"]], ["自責", ["擔心沒做好"]], ["提問", ["相信一下有什麼壞處"]], ["信念", ["溫暖的懷念帶來平靜"]]], "f": ["陷入悲傷自責", "被溫柔地提問", "選擇一個溫暖的信念", "帶著懷念走向平靜"], "g": "回憶紀念相冊", "gm": "把和親人的照片與故事整理成一本相冊，用溫暖的方式好好懷念。"}];

const hl = s => {

};
DATA.forEach(n => {
  n.hay = [n.t, n.d, n.b.join(''), n.tg.join(' '), n.p, n.m.map(b => b[0] + b[1].join('')).join(''), n.f.join(''), n.g, n.gm].join('\n').toLowerCase();
});
function card(n, open) {
  const mm = n.m.map(b => `<div class="br"><b>${hl(b[0])}</b>${b[1].map(x => `<span class="leaf">${hl(x)}</span>`).join('')}</div>`).join('');
  const fw = n.f.map((s, i) => `<div class="step"><i>步驟 ${i + 1}</i>${hl(s)}</div>`).join('<span class="ar">→</span>');
  return `<article class="note${open ? ' open' : ''}" data-id="${n.id}">
  <div class="head"><span class="num">${n.id}</span><div class="ht"><div class="ttl">${hl(n.t)}</div>
  <div class="meta">${n.d ? esc(n.d) + '・' : ''}<span class="gp">對應產品：${hl(n.g)}</span></div></div><span class="arrow">▶</span></div>
  <div class="body">
    <div class="sec"><h3>① 白話解析（國小版）</h3><div class="plain">${hl(n.p)}</div></div>
    <div class="sec"><h3>② 心智圖 <button class="cp" data-k="mm">複製到 LINE</button></h3><div class="mm"><div class="center">${hl(n.t)}</div><div class="stem"></div><div class="branches">${mm}</div></div></div>
    <div class="sec"><h3>③ 框架圖 <button class="cp" data-k="fw">複製到 LINE</button></h3><div class="fw">${fw}</div></div>
    <div class="sec"><h3>④ 對應團購產品＋正面機制 <button class="cp" data-k="gp">複製到 LINE</button></h3><div class="prod"><div class="pn">🛒 ${hl(n.g)}</div><div>${hl(n.gm)}</div></div>
      <div class="note-tip">※ 產品為配合主題的建議品項類別，非醫療用途；有疾病或服藥者請先諮詢醫師。</div></div>
    <div class="sec"><h3>⑤ 原文（繁簡對照）</h3><div class="orig bi"><div class="lh">繁體中文</div><div class="lh sc">简体中文（原文）</div>${bi(n)}</div>
      ${n.tg.length ? `<div class="tags">${n.tg.map(t => `<span class="tag">#${hl(t)}</span>`).join('')}</div>` : ''}</div>
    <button class="cp cpall" data-k="all">📋 一鍵複製：心智圖＋框架圖＋產品（貼到 LINE）</button>
  </div></article>`;
}
function bi(n) {
  const rows = [n.st ? [n.t, n.st] : null].filter(Boolean);
  const len = Math.max(n.b.length, n.s.length);
  for (let i = 0; i < len; i++) rows.push([n.b[i] || '', n.s[i] || '']);
  return rows.map((r, i) => `<p class="tc"${i === 0 ? ' style="font-weight:bold"' : ''}>${hl(r[0])}</p><p class="sc"${i === 0 ? ' style="font-weight:bold"' : ''}>${esc(r[1])}</p>`).join('');
}
// plain-text versions for LINE
const txt = {
  mm: n => `🧠【心智圖】${n.t}\n` + n.m.map((b, i) => `${i === n.m.length - 1 ? '└' : '├'} ${b[0]}：${b[1].join('、')}`).join('\n'),
  fw: n => `📐【框架圖】${n.t}\n` + n.f.map((s, i) => `${'①②③④⑤⑥'[i]} ${s}`).join('\n　⬇\n'),
  gp: n => `🛒【推薦團購】${n.g}\n✅ 正面機制：${n.gm}`,
};
txt.all = n => `📖 立刻充電｜${n.t}\n\n💡 白話解析：${n.p}\n\n${txt.mm(n)}\n\n${txt.fw(n)}\n\n${txt.gp(n)}`;
const toast = document.getElementById('toast');
function copy(s) {
  const done = () => { toast.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => toast.classList.remove('on'), 1500); };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = s; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { prompt('請手動複製：', s); }
    ta.remove();
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(s).then(done, fallback);
  else fallback();
}
let allOpen = false;
function render() {
  kw = q.value.trim();
  const k = kw.toLowerCase();
  const hits = k ? DATA.filter(n => k.split(/\s+/).every(w => n.hay.includes(w))) : DATA;
  if (k.includes(' ')) kw = '';
  list.innerHTML = hits.length ? hits.map(n => card(n, allOpen || (k && hits.length <= 3))).join('') : '<div class="empty">找不到符合的筆記</div>';
  count.textContent = k ? `找到 ${hits.length} 篇` : `共 ${DATA.length} 篇・點標題展開`;
}
list.addEventListener('click', e => {
  const c = e.target.closest('.cp');
  if (c) {
    const n = DATA.find(x => x.id == c.closest('.note').dataset.id);
    copy(txt[c.dataset.k](n));
    return;
  }
  const h = e.target.closest('.head');
  if (h) h.parentElement.classList.toggle('open');
});
document.getElementById('all').onclick = e => {
  allOpen = !allOpen;
  e.target.textContent = allOpen ? '全部收合' : '全部展開';
  document.querySelectorAll('.note').forEach(n => n.classList.toggle('open', allOpen));
};
let t;
q.addEventListener('input', () => { clearTimeout(t); t = setTimeout(render, 150); });
render();
</script>
</body>
</html>
