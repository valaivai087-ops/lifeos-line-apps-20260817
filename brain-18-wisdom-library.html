詩性收束｜願每一篇文字都像一顆種子，落在需要它的人心裡，在某個不經意的早晨，悄悄發芽。
金句｜智慧不是擁有永遠正確的答案，而是擁有不斷更新答案的能力。
最小行動｜挑一篇最打動你的短文，用八個步驟寫下你自己的版本，分享給一位朋友。
## 01 觀察感知力（01–05）
【◆ 你看見的，只是你準備好要看見的】
哲學命題｜觀察是一切智慧的起點，卻也是最容易被高估的能力。我們以為睜開眼睛就是看見，其實大腦只讓符合期待的畫面進來。真正的觀察，是承認自己可能沒看清，然後願意再看一次。
排比句｜觀察力讓你看見發生的事，注意力讓你看見重要的事，細節力讓你看見微小的變化，辨識力讓你分清事實與猜測，篩選力讓你留下真正有用的資訊。五種能力，像五層濾鏡，決定世界以什麼樣子進入你的心。
對比句｜粗心的人只看結果，細心的人看見變化；急躁的人看見表情，耐心的人看見心事；被資訊淹沒的人什麼都知道一點，懂得篩選的人知道下一步該做什麼。
反問句｜當孩子考不好，你看見的是懶惰，還是他努力後仍然不懂？為什麼有些問題爆發時，我們才說「早知道」？訊號是不是一直都在，只是我們沒有留意？
情境衝突｜一位安親班老師發現，一個平常活潑的孩子，連續一週下課都坐在座位上。她起初沒放在心上，直到第二週孩子的作業開始空白。她停下來仔細觀察，發現孩子總在看窗外的大門口。一問才知道，孩子的爸媽正在辦離婚。那些被忽略的安靜，其實一直在說話。
認知翻轉｜觀察不是被動地接收，而是主動地放下偏見。最清楚的眼睛，不是看得最快的眼睛，而是願意讓世界修正自己的眼睛。
層層遞進｜先記錄三個事實，不加評價；再把注意力集中五分鐘在一件重要的事；再找出一個與平常不同的小變化；再把一個煩惱分成事實與猜測；最後刪除一項沒有幫助的資訊干擾。五個動作，讓你從看到，走向看見。
詩性收束｜願你在匆忙的日子裡，仍保有一雙安靜的眼睛。世界不會大聲告訴你它的祕密，它只會輕輕地，等你看見。
金句｜智慧不是事後驚訝，而是事前願意看見。
最小行動｜今天記錄三個你觀察到的事實，不加入任何評價，晚上再看看自己加上了哪些解釋。
## 02 資訊理解力（06–10）
【◆ 讀得再多，不如讀懂一句】
哲學命題｜我們活在資訊最多的時代，卻不一定是理解最深的時代。每天閱讀上百則訊息，聽了上百句話，真正改變我們的卻寥寥無幾。理解不是資訊經過眼睛，而是資訊在心裡找到位置，並且改變了某個選擇。
排比句｜閱讀力讓文字走進生活，聆聽力讓對方的世界被聽見，分類力讓混亂找到位置，比較力讓選擇不再只是習慣，查證力讓相信不再冒充知道。五種能力，把資訊從噪音變成養分。
對比句｜有人讀完一本書只記得金句，有人讀完一頁就改變了一個習慣；有人聽完對方說話急著回答，有人先說一句「你的意思是……」；有人把轉傳當成知道，有人把查證當成責任。
反問句｜如果讀了那麼多道理，遇到衝突仍然只會責怪別人，究竟讀懂了什麼？一篇文章寫得動人，就代表它是真的嗎？真相有義務符合你的喜好嗎？
情境衝突｜一位阿嬤在群組裡看到「喝某種果汁可以降血壓」的影片，馬上停掉醫師開的藥，改喝果汁。兩週後她頭暈送醫。孫女陪她回家後，沒有責備，而是教她一個方法：看到健康資訊，先問「來源是誰、有沒有醫師或研究支持」，再打電話問家人。阿嬤後來說：「原來不是所有說得很肯定的話，都值得相信。」
認知翻轉｜理解不是收集更多，而是讓重要的留下、讓錯誤的被攔下、讓相似的歸類、讓不同的被比較。真正的聰明，不是知道得多，而是知道得準。
層層遞進｜先用一句話摘要你讀到的；再在回應前重述對方的意思；再把煩惱整理成三個類別；再比較兩種方法的優點與限制；最後查核一個重要說法的原始來源。五步之後，資訊才真正成為你的。
詩性收束｜願你在資訊的洪流中，有一艘屬於自己的小船。不必喝下整條河，只需要舀起那一瓢，真正能解渴的水。
金句｜不要把相信，誤認成知道。
最小行動｜今天轉傳任何訊息前，先查核它的原始來源，並用一句話寫下它對你的實際意義。
## 03 提問追問力（11–15）
【◆ 問錯了問題，再努力也只是跑錯方向】
哲學命題｜我們從小被獎勵回答問題，很少被鼓勵提出問題。於是長大後，我們很擅長回答別人給的題目，卻很少停下來檢查：這個題目本身，問對了嗎？智慧的起點，常常不是找到答案，而是終於問對了問題。
排比句｜提問讓你發現值得解決的事，追問讓你找到第一個答案背後的原因，質疑讓你檢查習以為常的信念，反問讓你從抱怨轉向可能，重構讓你看見真正的問題其實在別處。
對比句｜問「為什麼沒有人幫我」，注意力停在缺少什麼；問「我還能建立什麼資源」，行動空間開始出現。問「孩子為什麼這麼懶」，只會帶來責備；問「孩子哪裡學不會」，才會帶來方法。
反問句｜如果問題問錯了，再努力回答又有什麼用？你最需要懷疑的，會不會正是你最熟悉的那個答案？你以為要解決的，真的是問題本身，還是只是問題的症狀？
情境衝突｜一位工廠主管發現產線效率下降，第一個想法是「員工不夠努力」，於是加強監督，結果離職率上升。後來他連續追問：為什麼效率下降？因為等料時間變長。為什麼等料變長？因為倉庫動線改了。為什麼改動線？因為新設備放錯位置。三個為什麼之後，他調整了設備位置，效率回來了，也沒有人再被責怪。
認知翻轉｜問題不是麻煩，而是通往理解的入口。當你願意多問一次，責備就可能轉化為理解；當你願意換一個問法，困境就可能轉化為選擇。
層層遞進｜先對一個習以為常的現象問「為什麼」；再連續追問三次，檢查每一層的證據；再問自己常說的話「真的總是如此嗎」；再把一個抱怨改寫成可行動的問題；最後把整個困境重寫成「真正需要改善的是什麼」。
詩性收束｜願你永遠保有孩子般的好奇，也擁有大人般的勇氣：不怕問，也不怕問到讓自己改變的答案。
金句｜答案讓思考停止，問題讓智慧開始。
最小行動｜把今天一個抱怨，改寫成一個「我可以怎麼……」開頭的問題。
## 04 邏輯思辨力（16–20）
【◆ 你怎麼知道？這四個字，能救你很多次】
哲學命題｜人很少因為缺少結論而犯錯，更多是因為結論來得太快。一次冷淡就判斷不被愛，一次上漲就預測會一直漲，一個成功案例就認定方法有效。邏輯思辨，就是在結論和證據之間，安放一個誠實的檢查站。
排比句｜推理讓你檢查每一步是否有理由，因果辨識讓你不把同時發生當成彼此造成，假設辨識讓你看見沒說出口的前提，矛盾辨識讓你發現言行之間的落差，反例思考讓你知道結論的邊界在哪裡。
對比句｜情緒化的判斷說「一定是這樣」，清醒的判斷說「目前證據顯示可能是這樣」。迷信方法的人只記得成功案例，思辨的人會主動尋找失敗的例子。
反問句｜成功的人每天早起，所以早起一定成功嗎？有人吃了某樣東西後感覺變好，所以一定是那樣東西的功勞嗎？當你說「永遠」「一定」「全部」時，你真的檢查過例外嗎？
情境衝突｜一位家長發現孩子開始玩手機遊戲後成績下滑，立刻沒收手機。成績卻沒有回來。後來他和老師深談，才知道同一時期孩子換了數學老師，跟不上新的教法。手機和成績下滑同時發生，卻不是唯一的原因。沒收手機沒有錯，但真正需要處理的，是另一個被忽略的因素。
認知翻轉｜思辨不是冷漠，而是對真相的尊重；懷疑自己的結論不是軟弱，而是讓自己不被錯誤牽著走。真正有力量的思考，不怕別人問一句「你怎麼知道」。
層層遞進｜先寫下判斷與兩項支持證據；再對因果判斷提出另一種解釋；再找出強烈想法背後的隱藏前提；再指出一件「說重要卻沒做」的矛盾；最後尋找一個挑戰絕對化信念的反例。五道檢查，讓你的結論更站得住，也更溫柔。
詩性收束｜願你的心像一盞穩定的燈，不被第一陣風吹熄，也不拒絕新的光照進來。
金句｜看見關聯只是開始，理解機制才是更深的功課。
最小行動｜今天寫下一個你很確定的判斷，再找一個可能推翻它的反例或替代解釋。
## 05 認知建模力（21–25）
【◆ 說不清楚的煩惱，畫出來就有了出口】
哲學命題｜腦中的煩惱像一團纏住的毛線，越想越亂。不是我們不夠聰明，而是問題還沒有被賦予形狀。認知建模，就是替混亂畫出輪廓：把它說清楚、找出規則、用熟悉的比喻理解、把分散的知識連起來，最後建成一個可以被檢驗的解釋。
排比句｜表徵力讓問題有了形狀，抽象力讓事件露出規則，類比力讓陌生變得熟悉，概念整合力讓碎片變成地圖，模型建構力讓理解可以接受現實的考驗。
對比句｜只記住事件的人，容易重複事件；能抽出模式的人，才可能改變模式。只把煩惱放在心裡的人，反覆感受它；把煩惱畫在紙上的人，開始處理它。
反問句｜為什麼相似的困境，總是換個人物重新上演？你說自己壓力很大，但壓力究竟來自時間、關係、金錢，還是期待？如果一個解釋永遠不可能被證明有錯，它是模型，還是故事？
情境衝突｜一位上班族覺得自己「人際關係很差」，換了三份工作都和主管不合。後來她把三次衝突畫成圖，才發現共同模式：每次都是主管臨時改需求，她默默加班、不說出口，最後在某個點爆發。問題不是她人緣差，而是她從不在一開始說出界線。看見模式後，第四份工作，她第一次在會議上說：「這個變更，我需要多兩天。」
認知翻轉｜模型不是現實本身，而是暫時幫助我們理解現實的工具。好的模型不需要永遠正確，只需要能從錯誤中變得更好。
層層遞進｜先把煩惱畫成三個相連的方框；再找出兩件不同事件的共同模式；再用一個生活比喻解釋它；再把兩個不同領域的概念連起來；最後寫一句「如果發生A，我預期會出現B」，讓現實來檢驗。
詩性收束｜願你不再被看不見形狀的煩惱困住。當它被畫出來，它就不再是怪物，而只是一道等待你解開的題目。
金句｜把混亂放到紙上，思考才有機會找到入口。
最小行動｜把今天最困擾的一件事，畫成三個方框和兩條箭頭，看看真正的連結在哪裡。
## 06 結構洞察力（26–30）
【◆ 不是每個地方都要用力，找到卡點就夠了】
哲學命題｜很多人的疲憊，來自平均用力：每件事都想做好，每個問題都想解決，每個人都想照顧。可是系統的表現，往往被最關鍵的少數因素決定。結構洞察，就是看見關係、位置、權重、邊界與瓶頸，把力氣放在真正能撬動全局的地方。
排比句｜關係辨識讓你看見誰影響誰，位置辨識讓你知道自己站在哪裡，權重判斷讓你分出輕重，邊界辨識讓你知道方法何時失效，瓶頸洞察讓你找到最該改善的一點。
對比句｜全面用力的人，越來越累卻越來越慢；找到卡點的人，一個改變就讓整個系統重新流動。拿別人的地圖走路的人，常常迷路；看清自己位置的人，才走得出自己的路。
反問句｜什麼事情一旦改善，其他問題也會跟著鬆動？如果沒有找到瓶頸，增加資源是不是只是增加浪費？一個曾經成功的方法，後來為什麼會失效？
情境衝突｜一間小餐廳的老闆每天工作十四個小時，忙著備料、收銀、外送、回覆訊息，生意卻一直沒有起色。他畫出店裡的流程才發現，客人最常流失的地方，是尖峰時段等餐超過二十分鐘。他把有限的資金只用在一件事：增加一位尖峰時段的廚房幫手。等餐時間縮短一半，回頭客開始增加，他也終於可以準時回家吃飯。
認知翻轉｜智慧不是把每件事都做到完美，而是找出最有影響力的變數。把力量放對位置，微小的行動也可能撬動巨大的改變。
層層遞進｜先畫出問題涉及的三個關係；再寫下自己目前的資源與限制；再排出三個影響因素的優先順序；再替常用的方法寫下一項不適用的條件；最後圈出那個最妨礙目標的瓶頸，今天只處理它。
詩性收束｜願你不再用全身的力氣推一扇門，而是找到那個小小的門把。輕輕一轉，路就開了。
金句｜真正的突破，不是全面用力，而是找到卡點。
最小行動｜列出影響目標的三個因素，圈出最大的瓶頸，今天只為它做一件事。
## 07 系統動態力（31–35）
【◆ 你以為只是一件小事，其實它正在牽動一整個循環】
哲學命題｜人生不是一張靜止的照片，而是一部持續播放的影片。一件事影響另一件事，一個習慣強化另一個習慣，一個累積在某天跨過門檻，突然改變一切。系統動態，就是學會看見事情如何連鎖、如何循環、如何隨時間變化。
排比句｜耦合理解讓你看見連鎖反應，回饋迴路讓你看見問題如何自我強化，時間動態讓你知道今天的答案明天未必正確，臨界點辨識讓你在危機爆發前看見訊號，情境推演讓你為不同未來預留選擇。
對比句｜只看單一事件的人，總覺得命運在捉弄自己；看見循環的人，知道只要改變一個環節，整個循環就會轉向。事後驚訝的人說「怎麼會這樣」，提前觀察的人說「我看見它正在累積」。
反問句｜你正在解決的問題，會不會同時製造另一個問題？那些反覆回來的困境，是偶然，還是一個你從未打斷的循環？如果世界一直在變，為什麼你期待一套方法永遠適用？
情境衝突｜一位研究生因為論文進度落後而熬夜，熬夜讓白天專注力下降，專注力下降讓進度更慢，進度更慢又讓他更焦慮、更晚睡。他一直以為自己需要更多時間，後來才發現他需要的是打斷循環。他強迫自己十二點前睡覺，第一週很不安，第三週，進度反而比熬夜時快了。
認知翻轉｜打破困境不一定需要巨大的力量，有時只要改變循環中的一個環節。理解系統，不是為了控制一切，而是為了知道在哪裡輕輕推一下，最有效。
層層遞進｜先寫下一條「A影響B，B再影響C」的連鎖；再畫出一個反覆困境的三步循環；再比較這件事一個月前與現在的差異；再設定一個需要重新評估的警戒值；最後替一個決策列出最好、普通、最差三種情境。
詩性收束｜願你看見生活不是一顆顆散落的珠子，而是一條串起來的項鍊。輕輕調整其中一顆，整條項鍊就會換一個樣子。
金句｜有時只要改變其中一個環節，人生就可能開始轉向。
最小行動｜畫出一個你反覆陷入的三步循環，圈出最容易改變的那一步，今天就試著打斷它。
## 08 自我覺察力（36–40）
【◆ 最難看清的人，往往是自己】
哲學命題｜我們可以分析別人的情緒、預測別人的動機、評論別人的盲點，卻常常看不見自己。因為看自己，需要一面不扭曲的鏡子，也需要承認鏡子裡的人並不總是那麼好看的勇氣。自我覺察，是一切改變的起點。
排比句｜情緒辨識讓你知道自己正在感受什麼，需求辨識讓你知道自己真正想要什麼，信念覺察讓你看見深信不疑的規則，偏誤覺察讓你發現自己可能看錯，自我反省讓你從錯誤中找到下次可以調整的地方。
對比句｜你以為自己在生氣，其實可能是在害怕；你以為自己想要成功，其實可能是想要安全感。自責的人重播痛苦，反省的人產生方法；看不見偏誤的人越來越固執，承認偏誤的人越來越清醒。
反問句｜如果連自己正在感受什麼都不知道，又怎麼選擇回應？如果所有資訊都只證明你是對的，你真的檢查過其他可能嗎？誰規定你必須永遠照顧所有人、永遠不能失敗？
情境衝突｜一位事業有成的經理，總在週末對家人發脾氣，事後又很懊悔。他一直以為自己是壓力太大。直到某次諮商，他被問：「你最常在什麼時候生氣？」他想了很久才發現，都是在家人提出想去哪裡玩的時候。更深處的信念浮現了：「我必須讓所有人滿意，否則我就是失敗的爸爸。」那份憤怒，其實是害怕自己做不到。
認知翻轉｜覺察不是為了審判自己，而是為了理解自己；反省不是為了證明自己多糟糕，而是為了找出下次可以不同的地方。當錯誤成為資訊而不是身分標籤，成長才真正開始。
層層遞進｜先說出一種情緒與它連結的需求；再問自己真正希望得到什麼；再寫下一句「我一直相信……」並檢查它是否總是成立；再找一項與自己看法相反的可靠證據；最後寫下一個今天可以改善的行為，不批判人格。
詩性收束｜願你溫柔地看著鏡子裡的自己，不急著修補，也不急著責備。只是看見，就已經是改變的開始。
金句｜真正的自我理解，從替內在經驗找到名字開始。
最小行動｜今晚寫下一句「我一直相信……」，再問自己：這句話在今天的生活裡，還總是成立嗎？
## 09 情緒調節力（41–45）
【◆ 在刺激與反應之間，你還有十秒鐘】
哲學命題｜情緒來得很快，後果卻停留很久。一句衝口而出的話、一次衝動的消費、一個逃避的決定，常常只發生在幾秒之間，卻需要好幾個月來修補。情緒調節，不是讓情緒消失，而是在刺激與反應之間，替自己創造一點選擇的空間。
排比句｜情緒調節讓你不被情緒駕駛，壓力管理讓你不被負荷壓垮，挫折承受讓你跌倒後還願意再試，延遲滿足讓你為長期目標暫緩誘惑，心理彈性讓你在變動中重新站穩。
對比句｜壓抑情緒的人，以為自己很堅強，其實只是延後爆發；無限承受的人，以為自己很負責，其實只是延後崩潰。真正的力量，是能停下來，也能調整方向。
反問句｜如果每一次情緒升起都直接變成行動，你還剩多少選擇？如果壓力來源始終不變，忍耐是不是只是在延後崩潰？當道路改變時，你是否也允許方法改變？
情境衝突｜一位國小老師在課堂上被學生頂撞，當下她氣得想當眾責罵。她想起「先停十秒」，深呼吸，轉身在黑板上寫字。十秒後，她平靜地說：「你剛才的話讓我很不舒服，下課後我們談談。」下課後學生紅著眼睛說，他那天早上被爸爸罵了，一整天都很煩。那十秒鐘，保住了一段師生關係。
認知翻轉｜韌性不是永遠不倒，而是跌倒後重新理解道路；自由不是想做什麼就做什麼，而是有能力為更重要的未來保留今天的選擇。
層層遞進｜先在情緒強烈時停十秒；再找出一項可以減少的壓力來源；再選一個失敗經驗，修改方法再試一次；再把一次非必要的滑手機延後十分鐘；最後替一件不順利的事提出另一種做法。五個練習，讓情緒從主人變成信差。
詩性收束｜願你像水一樣，遇到石頭時不硬碰，也不停止流動。保有方向，也保有轉彎的能力。
金句｜真正的力量，不是沒有情緒，而是不被情緒駕駛。
最小行動｜今天情緒升起時，先停十秒、深呼吸一次，再決定要不要回應、怎麼回應。
## 10 人際理解力（46–50）
【◆ 理解一個人，從承認他的世界和你不一樣開始】
哲學命題｜人與人之間最常見的誤會，來自一個隱形的假設：別人應該和我想的一樣。於是我們用自己的經驗衡量別人的處境，用自己的標準判斷別人的對錯。人際理解，就是學會在評價之前，先走進對方的世界看一看。
排比句｜同理讓你理解對方的處境，動機辨識讓你看見行為背後的需要，換位思考讓你增加理解的維度，信任評估讓你用行動而不是承諾判斷可靠，界線建立讓你的善良不必以自我耗損為代價。
對比句｜只看行為的人，快速貼上標籤；看見動機的人，設計更好的回應。盲目相信的人容易受傷，無限懷疑的人容易孤單；用時間與行動判斷的人，信任才有穩固的根。
反問句｜你覺得簡單的事，對別人會不會非常困難？如果只允許自己的視角存在，溝通要如何開始？如果一段關係只能靠你不斷退讓來維持，那真的是合作嗎？
情境衝突｜一位婆婆總覺得媳婦不願意回家吃飯，是不喜歡她。她心裡委屈了好幾年。某次聚會，她試著問：「回家吃飯對你來說，最困難的地方是什麼？」媳婦愣了一下，才說出口：每次回家都要被問什麼時候生孩子，她其實一直在做不孕治療。那天晚上，婆婆第一次握住了媳婦的手。
認知翻轉｜同理不是認同所有行為，而是理解行為發生的背景；界線不是拒絕愛，而是讓愛可以長久。真正成熟的人際智慧，既看見別人，也不遺忘自己。
層層遞進｜先問對方最困難的是什麼；再替難以理解的行為提出兩種可能動機；再用對方的立場描述一次衝突；再檢查一項承諾是否和行動一致；最後清楚說出一件自己可以接受、與不能接受的事。
詩性收束｜願你在每一段關係裡，都能多一點好奇，少一點定論。每個人心裡都有一段你沒走過的路，願你願意聽他說。
金句｜當理解先於評價，關係才有可能從對立走向對話。
最小行動｜今天問一個你常誤解的人：「這件事對你來說，最困難的地方是什麼？」

## 11 溝通表達力（51–55）
【◆ 說出口的話，要能抵達對方的心】
哲學命題｜溝通不是把自己的想法倒出去，而是讓對方真正接收到。很多爭吵不是因為彼此不在乎，而是因為一方說的，和另一方聽到的，根本是兩件事。溝通表達，是在語言與理解之間，搭一座穩固的橋。
排比句｜清楚表達讓重點準確抵達，精準提問讓答案更有用，傾聽回應讓對方感到被理解，衝突溝通讓問題被討論而不是人被攻擊，說服協商讓雙方找到願意一起執行的方案。
對比句｜說了十分鐘別人仍不知道重點，不如三句話說清問題、需求與行動。「你總是這樣」讓對方築起高牆，「當這件事發生，我感到……我希望……」讓對方願意靠近。
反問句｜你真正想要的，是改善關係，還是證明對方錯了？如果聽的人始終不明白，你是否需要重新整理自己的語言？如果每次討論都要有人認輸，關係還剩多少空間？
情境衝突｜一對夫妻每次談到家用開銷就吵架。先生說「你亂花錢」，太太說「你根本不關心家裡」。後來他們試著換個方式：先生說「當我看到這個月卡費超過預算，我感到不安，我希望我們每週一起看一次帳」。太太沉默了一下，說：「好，其實我也希望有人跟我一起討論。」吵了三年的話題，第一次變成了合作。
認知翻轉｜表達的力量不在聲音大小，而在對方是否真的理解；說服的高明不在讓對方閉嘴，而在找到雙方都願意執行的方案。最好的回答，有時只是一句「我理解得對嗎」。
層層遞進｜先用三句話說清問題、需求與希望；再把模糊的問題改寫成具體的問題；再先重述對方的意思再回應；再把一句「你總是」改成我訊息；最後提出一個兼顧雙方需求的選項。
詩性收束｜願你的話語像一座橋，而不是一道牆。願每一次開口，都讓彼此更靠近一點。
金句｜讓語言成為橋，而不是新的迷霧。
最小行動｜今天把一句想說的「你總是……」，改寫成「當……發生，我感到……我希望……」再說出口。
## 12 合作博弈力（56–60）
【◆ 好的合作，不只靠善意，也靠好的規則】
哲學命題｜我們常以為合作失敗，是因為有人不夠努力、有人不夠真誠。可是很多時候，問題不在人心，而在結構：角色不清楚、誘因不一致、規則太模糊、退出條件從未談過。合作博弈，是看懂人與人之間的選擇如何互相影響。
排比句｜角色辨識讓每個人知道自己的位置，誘因分析讓你理解各方為何這樣選擇，策略預測讓你把他人的反應放進計畫，合作設計讓期待變成可執行的約定，進退判斷讓你知道何時堅持、何時離開。
對比句｜只要求別人變好的人，常常失望；調整誘因與規則的人，合作自然變得容易。因為已經投入太多而不敢停下的人，越陷越深；事先設定停止條件的人，進退都有依據。
反問句｜如果角色不清楚，再多熱情能維持多久？當一個制度只獎勵個人競爭，你還能期待大家真心合作嗎？過去付出的代價，真的能證明未來值得繼續嗎？
情境衝突｜三位好朋友一起開咖啡店，一開始說好「大家一起努力」。半年後，一個人覺得自己做最多，一個人覺得自己投資最多，一個人覺得自己的意見都不被採納。友情差點破裂。後來他們坐下來，寫下每個人的職責、決策方式與利潤分配，還約定每季檢討一次。他們說：早該在開店第一天就寫下來。
認知翻轉｜規則不是不信任的表現，而是保護信任的方式。讓規則承擔誤解，讓人與人之間保留善意。真正成熟的合作，是把期待轉化成透明、可執行、可修正的約定。
層層遞進｜先寫出負責人、工作內容與完成標準；再寫下各方最在乎的利益與擔憂；再列出對方可能的兩種反應；再寫下一條清楚的共同約定；最後替長期投入設定繼續與停止的條件。
詩性收束｜願你的每一段合作，都像一首合奏：每個人知道自己的聲部，也聽得見彼此的旋律。
金句｜讓規則保護信任，而不是讓信任代替規則。
最小行動｜替一項正在進行的合作，寫下一條清楚的共同約定，並和夥伴確認一次。
## 13 目標決策力（61–65）
【◆ 忙碌不等於前進，選擇才決定方向】
哲學命題｜一天只有二十四小時，每一次說「好」，都在對別的事情說「不」。目標決策，就是在有限的時間與精力中，誠實地面對取捨：什麼值得追求、什麼先做、代價是什麼、風險在哪裡，以及什麼時候該停止猶豫、開始選擇。
排比句｜目標設定讓努力有方向，優先排序讓重要的事先發生，利弊權衡讓你看見選擇的代價，風險評估讓希望擁有邊界，決斷力讓你在資訊足夠時願意邁步。
對比句｜被手機通知帶著走的人，一天很忙卻什麼都沒累積；先完成最重要一件事的人，一天不長卻向前了一步。等待完美答案的人一直停在原地，接受不完美決定的人得到修正的機會。
反問句｜如果連目標都說不清楚，怎麼知道自己正在進步？如果只看眼前的好處，是否忽略了長期的代價？等待完美答案，難道不也是一種選擇？
情境衝突｜一位三十五歲的上班族同時想考證照、學投資、經營副業、改善健康，結果每件事都做一點，一年後什麼都沒完成。後來他坐下來問自己：「哪一件事一旦改善，其他問題也會跟著鬆動？」答案是健康。他先把運動和睡眠排在最前面，三個月後，精神變好，副業和學習的效率也跟著提升了。
認知翻轉｜目標不是用來綁架人生，而是幫助資源找到方向；決斷不是保證每次選對，而是讓選擇能被檢驗與修正。真正的自由，從重新安排自己的順序開始。
層層遞進｜先寫下一個可衡量、有期限的目標；再選出今天最重要的三件事；再替兩個選項各寫一項好處與代價；再寫下最壞情況與可承受的損失；最後為一件已評估的小事設定決定期限。
詩性收束｜願你不再被每一個聲音拉扯，而是在眾多可能之中，安靜地選出屬於你的那一條路，然後勇敢地走上去。
金句｜真正的自由，從重新安排自己的順序開始。
最小行動｜今天只選三件最重要的事情，在做任何其他事之前，先完成第一件。
## 14 資源配置力（66–70）
【◆ 你如何使用資源，就是你如何塑造人生】
哲學命題｜時間、精力、金錢、工具，是每個人手中有限的資源。大多數人不是資源太少，而是資源被放錯了地方：最清醒的時間給了瑣事，最寶貴的金錢給了衝動，最重複的工作沒有交給工具。資源配置，是讓有限的東西，產生最大的價值。
排比句｜時間管理讓重要的事有時段，精力管理讓難事遇上清醒的自己，財務規劃讓金錢增加選擇，工具運用讓重複交給機器，槓桿辨識讓一次努力產生多次價值。
對比句｜有人把時間交給通知，有人把時間留給創造；有人每次都從頭來過，有人把經驗整理成流程。收入增加卻焦慮不減的人，缺的不是錢，而是方向。
反問句｜如果時間永遠被外界安排，你還能決定人生的方向嗎？如果每一次消費都只是回應當下慾望，未來還剩多少自由？每天重複回答相同問題，為什麼不建立一份常見問題庫？
情境衝突｜一位自由接案的設計師，每次接案都要重新寫報價、重新解釋流程、重新整理合約，常常忙到深夜。某個週末，她把所有重複的東西整理成三份範本和一頁常見問答。之後每接一個案子，至少省下三小時。她說：「原來我缺的不是更多時間，而是一次把事情做對的系統。」
認知翻轉｜時間管理不是塞滿行程，而是讓時間服務價值；槓桿不是投機取巧，而是讓有效的方法可以重複使用。不是逼自己永遠高效，而是讓有限的能量產生更好的成果。
層層遞進｜先保留二十分鐘不受干擾的時間；再把最需要思考的工作放在最清醒的時段；再記錄一筆支出並判斷它是否符合優先目標；再找一項重複工作試用工具簡化；最後把一項重複任務整理成三步流程。
詩性收束｜願你手中的每一分時間、每一分力氣，都流向你真正珍惜的地方。資源有限，但用心安排的生活，可以很豐盛。
金句｜努力的最高境界，是讓一次努力產生多次價值。
最小行動｜找出本週重複做了三次以上的一件事，把它整理成一份三步驟的流程或範本。
## 15 行動執行力（71–75）
【◆ 夢想太大時，就先把它切成今天吃得下的一口】
哲學命題｜困住人的，常常不是事情太難，而是第一步太大。想寫一本書、想改變健康、想開發一個APP，目標越遠大，越容易讓人望而卻步。行動執行，是把夢想切小、開始做、持續做、隨變化調整，最後真正交付出一個成果。
排比句｜任務拆解讓大事情有了入口，開始行動讓想法第一次接受現實，持續執行讓好行動變成習慣，應變力讓計畫面對變化時不崩潰，完成交付讓想法成為別人可以使用的成果。
對比句｜等待完美時機的人，一年後夢想仍在腦海；先做兩分鐘的人，一年後夢想已經長出形狀。迷戀強烈開始的人，三天後放棄；擁抱平凡重複的人，三個月後看見改變。
反問句｜如果目標大到無法開始，為什麼不把它拆小？如果信心需要透過行動累積，為什麼一定要先有信心才能開始？如果沒有任何一件事真正完成，世界如何感受到它的價值？
情境衝突｜一位家庭主婦一直想開一個分享料理的社群帳號，卻擔心照片不夠美、文字不夠好，拖了三年。某天她決定只做一件事：把當天晚餐拍一張照片，寫三行字發出去。第一篇只有五個讚，但她連續發了一百天。一年後，她的帳號有了上萬位追蹤者，還出了一本小食譜。她說：「如果我等到完美，現在還在等。」
認知翻轉｜完成不代表完美，交付也不代表停止改善。與其永遠等待最好的版本，不如先完成一個能夠更新的版本。真正的開始不必盛大，只需要兩分鐘。
層層遞進｜先把一個大目標拆成三個小步驟；再選一件重要小事立刻做兩分鐘；再選一項兩分鐘習慣連續做三天；再替重要任務準備一個備案；最後完成並交付一件小作品。
詩性收束｜願你不再站在山腳仰望山頂，而是低頭看見腳下的第一塊石階。一步一步，山也會被你走成路。
金句｜與其永遠等待最好的版本，不如先完成一個能夠更新的版本。
最小行動｜現在選一件拖延已久的重要小事，設定兩分鐘計時，只做第一步。
## 16 學習成長力（76–80）
【◆ 看過很多次，不代表真正學會】
哲學命題｜我們常把熟悉感誤認為掌握感。課本讀了三遍，每句話都很眼熟，合上書卻說不出重點。真正的學習，不是讓資訊反覆經過眼睛，而是能主動想起、專練弱點、診斷錯誤，並且在新的情境中用得出來。
排比句｜自主學習讓你不再依賴別人安排，記憶提取讓知識在需要時被想起，刻意練習讓你縮小能力缺口，錯誤診斷讓修正有方向，遷移應用讓學會的東西離開原本的情境仍然有用。
對比句｜一直練自己已經會的部分，只會越來越熟悉；專練不熟的部分，才會真正升級。把所有錯誤都叫作粗心的人，下次還會犯；替錯誤分類的人，下次就知道要改哪裡。
反問句｜如果沒有答案提示，你還能自己說出重點嗎？如果每次都只練已經會的部分，能力要如何升級？如果知識只能停留在原來的情境，你究竟學會了多少？
情境衝突｜一位準備學測的學生每天寫一百題數學，成績卻停滯不前。老師請她把三週的錯題分類，發現八成錯在同一個觀念：機率的條件判斷。她停下題海，每天只練十題條件機率，並且每題寫下「為什麼這樣算」。一個月後，她不只數學進步，連物理題的推理也變得更清楚了。
認知翻轉｜進步不是累積辛苦，而是縮小能力缺口；學習不是把錯題藏起來，而是替錯誤找到正確的位置。每一道錯題，都可能是一張通往能力升級的地圖。
層層遞進｜先自己提出一個學習問題並找一項可靠資源；再合上書本說出三個重點；再挑一個最常犯的錯誤專練五分鐘；再替今天的錯誤標記具體原因；最後把學到的一個原則用在完全不同的情境。
詩性收束｜願你不再害怕錯誤，而是珍惜每一次答錯。那是學習在對你說：這裡，還可以更好。
金句｜與其反覆確認自己看懂，不如練習證明自己能想起。
最小行動｜今晚合上書本或關掉影片，憑記憶寫下今天學到的三個重點，再對照看看漏了什麼。
## 17 創新創造力（81–85）
【◆ 第一個想到的答案，往往只是最熟悉的答案】
哲學命題｜創新不是天才的專利，而是一種可以練習的思考習慣：保持好奇、跨越領域、反向思考、生成多個方案、用小版本測試。我們常被第一個答案困住，不是因為它最好，而是因為它最熟悉。創造力，就是給自己多幾個選項的勇氣。
排比句｜好奇探索讓你承認自己還不知道，跨域連結讓不同的知識彼此照亮，逆向思考讓熟悉的問題出現新入口，方案生成讓選擇從一個變成三個，原型測試讓想法用最低的成本接受現實。
對比句｜只有一個答案的人，最容易被答案困住；有三個方案的人，才真正擁有選擇。用一年幻想的人，永遠不知道想法有沒有價值；用一天測試的人，很快就知道下一步該怎麼改。
反問句｜為什麼一定要從增加開始，不能先從減少開始？如果永遠只用同一套語言理解問題，如何看見新的可能？如果想法從未接受現實檢驗，怎麼知道它是否有價值？
情境衝突｜一位社區圖書館員發現，年輕人越來越少來借書。他第一個想法是「多辦講座」，效果不好。後來他反過來問：「什麼讓年輕人不想來？」答案是：太安靜、不能討論、沒有插座。他先在角落設了一個可以聊天、充電的小空間，只花了一週布置。一個月後，那個角落成了附近高中生最愛的讀書地點。
認知翻轉｜創造力不是立刻找到完美方案，而是先增加可能性，再評估限制；原型不是粗糙的失敗品，而是低成本取得回饋的工具。有時候，最有效的改變，是先停止製造原本的阻礙。
層層遞進｜先研究一個原本不懂的小問題；再找兩個領域的一項共同原理；再問「怎樣會讓它更糟」；再為困境提出三種不同做法；最後把一個想法做成最簡單的可測試樣本。
詩性收束｜願你永遠對世界保有一點好奇，也對自己的想法保有一點懷疑。新的可能，常常就藏在「如果反過來呢」的那一瞬間。
金句｜智慧不是永遠有答案，而是知道如何生成新答案。
最小行動｜為今天一個困境寫下三種不同做法，其中一種必須是「先停止做某件事」。
## 18 倫理價值力（86–90）
【◆ 能力越強，越需要知道為了什麼而用】
哲學命題｜一個人可以很聰明、很有效率、很會溝通，卻仍然迷失方向。因為能力回答的是「怎麼做」，價值回答的是「為什麼做」。倫理價值力，是讓所有能力都對準真正重要的事：知道自己珍惜什麼、能負責什麼、什麼是公平、如何尊重差異、怎樣的幫助才真正讓人變得更好。
排比句｜價值澄清讓你知道什麼值得長期投入，責任承擔讓你把責任放回正確的位置，公平判斷讓分配有清楚的理由，尊重差異讓不同的人都能自由，長期利他讓幫助變成對方的能力。
對比句｜成功後才發現走錯方向的人，得到掌聲卻失去自己；先澄清價值的人，選擇不再被外界左右。替別人解決所有問題的人，讓對方越來越依賴；教會別人方法的人，讓對方越來越自由。
反問句｜如果目標不是來自自己的價值，再大的成功能帶來多少滿足？公平真的是每個人拿到一樣的東西嗎？如果幫助讓對方越來越依賴，這真的是最好的幫助嗎？
情境衝突｜一位熱心的鄰居長年幫獨居長輩處理所有事情：繳費、買菜、預約門診。某天她生病住院兩週，長輩完全不知道怎麼繳電費，也不會用手機掛號。她出院後改變了做法：每次只做一半，另一半陪長輩自己完成。半年後，長輩學會了用手機掛號，還開心地教其他鄰居。
認知翻轉｜真正的負責，不是無限自責，而是承擔自己可以改善的部分；真正的利他，不是讓自己永遠不可取代，而是讓更多人有能力選擇自己的道路。
層層遞進｜先寫下自己最重要的三項價值；再找出一件能負責的事並完成承諾；再檢查一項分配是否兼顧規則與需求；再理解一個與自己不同的觀點而不急著反駁；最後教會一個人一項可以獨立使用的方法。
詩性收束｜願你的能力像一盞燈，不只照亮自己的路，也讓身邊的人看清他們自己的方向。
金句｜最高層次的幫助，是讓對方逐漸不需要你。
最小行動｜寫下你最重要的三項價值，檢查這週的行程，有多少時間真正花在它們身上。
## 19 驗證修正力（91–95）
【◆ 不敢預測的人，永遠不知道自己錯在哪裡】
哲學命題｜事情發生後，我們總能找到很多解釋：成功了說早就知道，失敗了說環境太難。可是如果從來沒有事先留下預測，就永遠無法知道自己的判斷到底準不準。驗證修正，是讓想法接受現實的檢驗，並且有勇氣根據結果改變自己。
排比句｜預測讓理解變成可以比較的期待，測量讓改變留下可檢查的痕跡，回饋分析讓你看見預期與實際的落差，誤差歸因讓你找到錯誤真正的位置，模型更新讓昨天的自己被今天修正。
對比句｜只憑感覺判斷進步的人，常常高估或低估自己；用指標記錄的人，才知道真正改變了什麼。失敗時只說「我不夠努力」的人，下次還會用同樣的方法；找出錯誤在哪個環節的人，下次就能精準修正。
反問句｜如果從未事先留下預測，你怎麼知道自己的模型準不準？你說自己變得更專注，但每天真正專注多久？如果一個人永遠不能改變想法，知識再多又有什麼用？
情境衝突｜一位健身教練自認為很會帶學員，直到他開始記錄每位學員三個月的進步數據。他發現，自己最喜歡用的訓練方法，對上班族的效果遠不如預期，因為他們沒有時間做完整套。他起初很難接受，後來改設計了一套二十分鐘的版本。半年後，學員的續約率提高了一倍。
認知翻轉｜現實不是來證明你正確，而是來幫助你更新；努力是資源，不是萬能的解釋。真正的智慧，不是永遠猜中，而是逐步改善判斷。
層層遞進｜先寫下一項明確預測、期限與預期結果；再替目標選一個可重複記錄的指標；再比較預期與實際，寫出差異；再把差異歸入觀察、理解、判斷、行動或測量其中一類；最後根據新證據修改一個原本的判斷。
詩性收束｜願你把每一次「我錯了」，都聽成「我又更接近真相了一點」。修正不是倒退，而是校準方向的那一刻。
金句｜真正的智慧，不是永遠猜中，而是逐步改善判斷。
最小行動｜今天寫下一項明確預測與期限，到期時再回來比較，寫出差異與原因。
## 20 智慧整合力（96–100）
【◆ 最高的智慧，是知道自己還在學習】
哲學命題｜所有能力最後都要整合成一個人：能把複雜說得簡單，能把道理用在生活，能把人、事、物連成一張地圖，能觀察自己如何思考，並且持續進化。智慧整合，不是成為完美的人，而是成為一個永遠可以更新的人。
排比句｜知識壓縮讓複雜收進簡潔，知識解壓讓大道理走進小日子，世界模型整合讓你看見事件背後的關係，元認知讓你檢查自己的思考方式，持續進化讓你在世界改變時跟著重新學習。
對比句｜講了一小時仍說不清重點的人，可能還沒真正整理好；五句話說清核心的人，才真正理解了。只會說大道理的人，遇到小事仍手足無措；能把道理變成一句對話的人，才讓智慧真正落地。
反問句｜如果一個道理無法進入生活，它還缺少什麼？如果你只能觀察世界，卻不能觀察自己的思考，智慧是否仍有盲點？如果世界持續改變，你願意讓自己也一起改變嗎？
情境衝突｜一位退休校長讀了很多教育理論，卻在照顧孫子時常常束手無策。孫子頂嘴時，他知道「要尊重孩子」，卻不知道該說什麼。後來他練習把每個原則寫成一句具體的話，例如把「尊重」寫成「你可以不同意，我們來聽聽彼此的理由」。他說，退休後他才真正學會，怎麼把知道變成做到。
認知翻轉｜智慧不是掌握所有答案，而是不再被任何舊答案永久困住；元認知讓學習有了更新的入口。你不需要永遠正確，你需要的是看見、理解、提問、選擇、行動與更新的能力。
層層遞進｜先把一個複雜概念濃縮成五句話；再替一個抽象原則寫出具體的對話句；再畫出一件事涉及的人、環境、信念與行動；再檢查自己做判斷時用了什麼思考方式；最後每週回顧一次：看錯什麼、學會什麼、下週更新什麼。
詩性收束｜願你像一條流動的河，不執著昨日的形狀，卻始終奔向更寬廣的海。願你在每一次回顧裡，都看見一個比昨天更清醒、更溫柔的自己。
金句｜真正的自由，不是掌握所有答案，而是不再被任何舊答案永久困住。
最小行動｜每週日花十分鐘回顧：這週我看錯了什麼、學會了什麼、下週要更新什麼。
## 總結
【◆ 讓每一次錯誤，都成為看得更清楚的起點】
哲學命題｜一百項能力、一百篇短文，最後都指向同一個方向：人生最值得累積的，不是永遠成功的紀錄，而是一套能從成功與失敗中持續更新的生命系統。知識是世界留下的痕跡，智慧是我們重新理解世界的能力。
排比句｜觀察現實，提出問題，辨認假設，理解關係，找出瓶頸，評估策略，採取最小行動，測量結果，分析誤差，更新模型，再次測試。這不是一次走完的路，而是一圈又一圈，越走越清明的螺旋。
對比句｜愚昧不是不知道，而是不知道自己可能不知道；智慧不是永遠正確，而是知道自己可能錯了，並且願意修正。讓別人依賴自己答案的人，是給予；協助別人生成自己智慧的人，是真正的利他。
反問句｜今天你真正看見了什麼？哪些判斷可能只是舊模型？哪個問題最值得優先改善？你能採取什麼最小行動？今天的現實回饋，要求你更新什麼？
情境衝突｜一位讀者寫信說，她讀完一百篇短文，沒有變成什麼了不起的人。但她發現自己吵架時會先停十秒，看到健康謠言會先查證，被批評時會先問證據，想放棄時會先做兩分鐘。她說：「我還是會犯錯，只是犯錯之後，我知道該怎麼回來了。」
認知翻轉｜真正的自由，不是永遠不受限制，而是能夠辨認限制、調整模型、重新選擇。智慧不在終點，而在每一次願意回頭檢查、願意重新出發的瞬間。
層層遞進｜每天問五個問題，每週做一次回顧，每月挑一個新能力練習，每年回頭看看自己更新了哪些信念。日子一天一天過去，你會發現，自己不只是變老了，而是真的變得更有智慧了。
詩性收束｜願你不必把自己訓練成永遠不會犯錯的人，而是讓每一次錯誤，都有機會成為下一次看得更清楚、愛得更成熟、選得更自由的起點。
金句｜知識是世界留給我們的痕跡，智慧是我們重新理解世界的能力。
最小行動｜今晚睡前，用每日智慧生成五問回顧今天，每題只寫一句話。

## 系列說明
【◆ 生病之後，你仍然是一個完整的人】
哲學命題｜一份診斷書，可能在一瞬間改變生活的節奏，卻不能改變一個人的價值。疾病會帶走某些能力、某些計畫、某些熟悉的日常，可是它帶不走你被尊重、被愛、被好好對待的權利。這個系列，寫給每一位正在與疾病同行的人，也寫給陪在身邊的家人。
排比句｜我們不要求病友永遠正向，不要求照顧者永遠堅強，也不要求每一段故事都要有勵志的結局。我們只希望，在不確定的日子裡，你能多一點理解、多一點選擇、多一點連結、多一點生活的力量。
對比句｜「你要加油」有時是鼓勵，有時是壓力；「我在這裡」有時比任何建議都更有力量。把病友當成需要被修好的問題，會讓人疲憊；把病友當成需要被理解的人，才讓人安心。
反問句｜一個人的價值，真的只能用健康、工作能力或檢查數字來衡量嗎？如果生病的人也能被允許害怕、允許休息、允許說不，他們的日子會不會輕一點？
情境衝突｜一位病友說，確診後她收到最多的訊息是「要正向」「一定會好」「你要堅強」。她每天都很努力笑，卻在夜裡一個人哭。直到一位朋友只傳來一句：「你不用回我，我只是想讓你知道，我記得你。」那天晚上，她終於好好睡了一覺。
認知翻轉｜智慧不是要求病人永遠樂觀，而是在疾病帶來的不確定中，慢慢找回理解、選擇與生活。這裡的文字不是治療，也不取代醫療；它們只是陪伴，讓你在和醫療團隊一起前進的路上，不那麼孤單。
層層遞進｜先接住自己的感受；再看清事實與猜測；再整理想問醫師的問題；再找到身邊可以依靠的支持；最後，在今天能做到的範圍裡，做一件讓自己舒服一點的小事。
詩性收束｜願你知道，無論今天是好是壞，你都不必獨自面對。願醫療給你專業，家人給你理解，朋友給你陪伴，而你，給自己一點溫柔。
金句｜疾病可能改變身體的條件，卻不應取消一個人被尊重與被愛的權利。
最小行動｜今天問自己：「什麼事情能讓現在的我，多一點舒適與安心？」並做其中最小的一件。
## 第一模組｜觀察感知力
【◆ 一張報告寫的是數字，不是你整個人】
哲學命題｜收到檢查報告的那一刻，世界彷彿只剩下那幾個紅色的數字。我們盯著異常值、搜尋存活率、放大每一個身體的變化，卻忘了自己仍然是一個會笑、會愛、會想念的人。看清疾病很重要，但同時看見生命，同樣重要。
排比句｜觀察讓你同時看見疾病與生活，注意力讓你不被恐懼佔滿，細節讓身體的變化被清楚記錄，辨識讓事實與猜測分開，篩選讓不可靠的抗癌資訊留在門外。
對比句｜被恐懼放大的觀察，把每一次疲倦都看成惡化；清楚記錄的觀察，把每一次變化都變成醫療團隊可以判斷的資訊。相信神奇承諾的希望很脆弱，經過查證的希望才站得穩。
反問句｜今天的疲倦，你已經確認原因了，還是只是在心裡替它寫了最壞的結局？當手機裡塞滿了疾病資訊，你還記得上一次好好看窗外的陽光，是什麼時候嗎？
情境衝突｜一位治療中的病友，某天發現自己特別容易累，整夜上網查詢，越查越害怕，認定是病情惡化。隔天回診，她把一週的症狀紀錄拿給醫師，醫師對照抽血結果後，判斷與治療期間的貧血有關，調整了處置。她說：「那張紀錄，比我整夜的搜尋有用太多了。」
認知翻轉｜觀察不是為了更害怕，而是為了讓醫療團隊有更完整的線索；篩選不是放棄希望，而是保護希望不被誤導。感受是真實的，但對感受的解釋，可以交給專業一起確認。若出現嚴重或突然惡化的症狀，請立即就醫。
層層遞進｜先記錄症狀的時間、強度與變化；再寫下一件仍然能帶來安慰的事；再把擔憂分成「已確認的事實」與「需要問醫師的問題」；最後，轉傳任何健康資訊前，先確認來源。
詩性收束｜願你在看見疾病的同時，也看見自己依然溫熱的生命。報告是一頁紙，而你，是一整本還在書寫的書。
金句｜真正的智慧，不是忽略疾病，而是同時看見疾病與生命。
最小行動｜今天記錄三項身體狀況，也記錄一件仍然能帶來安慰的事。
## 第二模組｜資訊理解力
【◆ 你不需要一夜之間變成醫學專家】
哲學命題｜確診後，陌生的醫學名詞像潮水一樣湧來：分期、病理、基因、標靶、免疫治療。很多病友努力搜尋，想把一切弄懂，卻越讀越焦慮。理解疾病是好事，但理解不必一次完成，也不必獨自完成。
排比句｜閱讀讓你一點一點看懂與自己有關的資訊，聆聽讓陪伴者聽見病友真正的需要，分類讓混亂的事情有了先後，比較讓你明白別人的治療不一定是你的地圖，查證讓希望不被神奇承諾利用。
對比句｜一口氣讀完所有資料的人，常常被恐懼淹沒；每天只整理一個問題的人，反而慢慢找回掌握感。把別人的抗癌故事當成標準答案，容易混亂；把它當成陪伴，同時向醫師確認自己的條件，才更安心。
反問句｜當病友說「我好害怕」，他需要的真的是一句「要正向」嗎？當你看見別人用了某種治療，你是否確認過，你們的癌別、分期與身體條件是否相同？
情境衝突｜一位病友的女兒，在網路上看到一篇文章說某種療法效果很好，急著要媽媽換醫院。媽媽很猶豫，母女因此爭吵。後來她們一起列出問題，回診時請醫師說明：這種療法適合哪些條件、媽媽目前的治療依據是什麼。醫師耐心解釋後，女兒說：「我原本只是害怕，怕自己沒有替媽媽找到最好的方法。」
認知翻轉｜真正的理解，不是把所有資料塞進腦袋，而是把與自己決策有關的問題整理清楚，帶到醫療團隊面前一起討論。陪伴者的焦慮也是愛，只是需要被引導到正確的方向。
層層遞進｜先每天只整理一個醫療問題；再把煩惱分成醫療、生活、情緒三類；再在聽病友說話時，不急著糾正他的情緒；再向主治醫師詢問治療方案的依據；最後，對任何宣稱能治癒疾病的產品，先查證並詢問醫療團隊。
詩性收束｜願你不被資訊的浪潮捲走，而是一次撿起一顆貝殼，慢慢拼出屬於你的那片海岸。
金句｜一點一點看懂，也是一種重新找回掌握感的方式。
最小行動｜今天只寫下一個最想弄清楚的醫療問題，帶到下次門診問醫師。
## 第三模組｜提問追問力
【◆ 在診間，你有權利多問一句】
哲學命題｜走進診間，很多病友緊張得忘記想問什麼，醫師說完，只能點頭。回家後才發現，心裡還有好多疑問。提問不是挑戰醫師，而是參與自己的照護。這是你的身體，你值得理解正在發生的事。
排比句｜提問讓你不再只是被動接受，追問讓你理解治療的目的、效益與風險，質疑讓你不把一次結果當成永遠的結論，反問讓你從「為什麼是我」走向「現在我需要什麼」，重構讓你看見醫療目標也包含生活品質。
對比句｜只記得「化療」兩個字的病友，帶著恐懼回家；問清楚目的、副作用與處理方式的病友，帶著準備回家。只問「我會不會好」的人，得到的常常是不安；也問「我有哪些選擇」的人，得到的是可以參與的方向。
反問句｜你是不是因為怕耽誤醫師時間，而把問題吞了回去？一次不如預期的檢查結果，真的足以代表所有的未來嗎？除了活得更久，你是否也想知道，怎樣活得更舒服、更有尊嚴？
情境衝突｜一位長輩每次回診都只說「好、好、好」，回家卻跟兒子說聽不懂。兒子陪他回診，事先寫好三個問題：這次治療的目的是什麼？最常見的副作用是什麼？出現哪些狀況要馬上回醫院？醫師一一回答，長輩那天回家，第一次說：「我終於知道自己在做什麼治療了。」
認知翻轉｜即使治療選項有限，疼痛控制、陪伴與生活目標仍然值得被討論。提問不會讓醫師不耐煩，清楚的問題反而讓溝通更有效率。把絕望的句子改寫成問題，就是替自己找回一點選擇。
層層遞進｜先在門診前寫下三個最重要的問題；再詢問治療的目的、預期效益、主要風險與替代方案；再把一句「我沒希望了」改寫成一個可以確認的問題；再問自己此刻最需要的一項支持；最後告訴醫師，你最希望維持的生活能力。
詩性收束｜願你在每一次走進診間時，都記得自己不是旁觀者，而是這段旅程的同行者。你的問題，值得被好好回答。
金句｜真正的提問，不是挑戰醫師，而是幫助自己理解治療。
最小行動｜下次門診前，寫下三個最重要的問題，看診時拿出來逐一詢問。
## 第四模組｜邏輯思辨力
【◆ 生病，不是你不夠正向造成的】
哲學命題｜病友身邊常有許多聲音：「是不是壓力太大才生病？」「只要放下就會好。」「一個數字上升，一定是惡化了。」這些說法看似有道理，卻可能讓已經辛苦的人背上更多罪惡感，也可能讓人急著替未來下判決。邏輯思辨，是保護自己不被錯誤推論傷害。
排比句｜推理提醒你單一數值需要結合趨勢與臨床狀況解讀，因果辨識提醒你疾病不是某一種心情造成的，假設辨識讓你看見「病人必須堅強」的隱藏規則，矛盾辨識讓你發現自己努力治療卻忘了生活，反例思考讓你不讓最悲傷的故事成為唯一的未來。
對比句｜把複雜疾病簡化成「想太多」的說法，讓病友自責；承認疾病涉及多重因素的理解，讓病友安心。只看悲傷案例的人，越看越害怕；向醫師了解自己情況的人，才看見屬於自己的可能。
反問句｜誰規定生病的人不能脆弱、不能哭、不能說累？一次檢驗數字的變化，在和醫師討論之前，真的能告訴你全部的答案嗎？你努力活下去，是否也記得讓自己好好生活？
情境衝突｜一位病友的親戚對她說：「你就是太愛生氣，才會生這種病。」她聽完整晚睡不著，反覆回想自己哪裡做錯。後來她把這句話告訴醫師，醫師溫和地說：「疾病的形成很複雜，不是你的個性造成的。你現在需要的不是自責，是好好照顧自己。」那一刻，她才終於放下壓在心上好幾週的石頭。
認知翻轉｜情緒值得照顧，但不能把疾病歸咎於某一種情緒；你可以練習平靜，也有權利悲傷。真正的勇氣，有時只是承認自己需要幫忙。
層層遞進｜先詢問醫師某個數值需要與哪些資訊一起判讀；再停止使用「都是因為你想太多」解釋疾病；再向信任的人說出一項真實需要；再在醫療許可下安排一件讓自己開心的小事；最後減少閱讀缺乏醫療背景的恐怖案例。
詩性收束｜願你放下那些不屬於你的責備。疾病不是你的錯，而你，值得被溫柔地對待。
金句｜真正的療癒性陪伴，不應該讓病友為疾病責怪自己。
最小行動｜如果有人說生病是你的錯，告訴自己：「這不是事實，我值得被好好照顧。」並向信任的人說出這份感受。
## 第五模組｜認知建模力
【◆ 把病程寫成一張地圖，你就不必把一切都記在心裡】
哲學命題｜每次門診都有新報告，每次治療都有不同安排，藥名、日期、副作用、注意事項，全部擠在腦海裡。記不住不是你不認真，而是資訊太多了。認知建模，就是把散落的資訊整理成地圖，讓自己和醫療團隊都更容易看清方向。
排比句｜表徵讓病程變成清楚的時間軸，抽象讓反覆出現的症狀露出模式，類比讓艱難的旅程有了可以理解的形狀，概念整合讓醫療與生活照顧彼此協調，模型建構讓症狀紀錄成為醫師判斷的線索。
對比句｜把所有事情記在腦中的病友，每次回診都很緊張；把病程寫成一頁表格的病友，看診時能更清楚地溝通。每天靠猜測理解身體的人，越猜越焦慮；建立簡單紀錄的人，慢慢看見規律。
反問句｜你是否常常在診間突然想不起，上次的副作用是哪一天開始的？那些反覆出現的不舒服，有沒有可能藏著某種時間或情境上的規律，值得和醫師討論？
情境衝突｜一位照顧父親的女兒，每次陪診都被醫師問：「上次治療後幾天開始發燒？吃了什麼藥？」她總是答不出來，很自責。後來她做了一張簡單的表：日期、治療、症狀、用藥、問題。第三次回診時，醫師看了表格說：「這很有幫助，我們可以從這裡調整。」她第一次覺得，自己也是照護團隊的一員。
認知翻轉｜建立症狀紀錄，不是自己診斷疾病，而是讓醫療團隊取得更完整的線索；把疾病比喻成航海，不能保證旅途平安，卻提醒我們：未知不代表完全沒有選擇。
層層遞進｜先建立一張包含診斷、治療、檢查與症狀的時間表；再記錄三次相似症狀，觀察規律；再寫下目前最能幫助自己的三項支持資源；再和醫療團隊確認最需要改善的一項生活品質問題；最後記錄一項症狀與可能相關因素，帶去門診討論。
詩性收束｜願你手中有一張屬於自己的地圖。也許還看不見終點，但至少知道自己走過哪裡，下一步可以往哪裡去。
金句｜把病程寫成時間軸，不是讓自己更像病人，而是讓資訊有秩序，讓溝通更容易。
最小行動｜今天建立一頁簡單的紀錄表：日期、治療、症狀、用藥、想問醫師的問題。
## 第六模組｜結構洞察力
【◆ 力氣有限，就把它留給最重要的地方】
哲學命題｜生病之後，體力和精力像一個變小的杯子，裝不下以前那麼多事情。很多病友仍然想照顧全家、整理家務、完成工作，最後把自己耗盡。結構洞察，是看見痛苦之間的關係、看清自己的起點，然後把有限的力氣放在最值得的地方。
排比句｜關係辨識讓你看見疼痛、睡眠與疲倦如何互相牽動，位置辨識讓你不拿別人的康復速度責怪自己，權重判斷讓你把能量留給重要的事，邊界辨識讓你知道別人的營養建議不一定適合你，瓶頸洞察讓你先處理最困擾你的那一件事。
對比句｜同時想改善所有問題的人，常常一項也沒改善；先找出最困擾問題的人，支持才有方向。複製別人飲食方法的人可能冒險，先請醫師或營養師確認的人才更安全。
反問句｜如果最讓你痛苦的是疼痛，卻一直只被要求要正向，真正的困難是否仍然存在？別人已經開始運動，你還容易累，這代表你不夠努力，還是你們本來就站在不同的起點？
情境衝突｜一位病友同時面對疲倦、失眠、食慾差與疼痛，她試了各種方法，都沒有明顯改善，越來越灰心。後來在護理師協助下，她把四項困擾排序，發現疼痛是影響睡眠與食慾的源頭。醫師調整止痛方式後，她的睡眠先改善了，接著精神和胃口也慢慢回來。
認知翻轉｜真正的照護，是看見整個人，而不只看見診斷名稱。智慧不是要求自己做得更多，而是把有限的能量放在重要的地方；真正的進步，不是追上別人，而是理解自己的起點。
層層遞進｜先畫出一條影響生活品質的症狀連鎖；再依目前體力與醫療建議設定個人化目標；再選一件今天最重要的事，其餘允許延後；再開始任何特殊飲食或補充品前，先讓專業人員確認；最後列出三項困擾，選最嚴重的一項與醫療團隊討論。
詩性收束｜願你不必把每一件事都扛起來。有些事可以放下，有些事可以交給別人，而你，值得把力氣留給自己最珍惜的時光。
金句｜智慧不是要求自己做得更多，而是把有限的能量放在重要的地方。
最小行動｜列出目前三項最困擾的症狀，選出最嚴重的一項，下次門診優先和醫療團隊討論。
## 第七模組｜系統動態力
【◆ 身體有起伏，不代表你在退後】
哲學命題｜治療期間，身體像天氣一樣有晴有雨：有些日子比較有精神，有些日子只想躺著。一次治療可能同時影響食慾、睡眠與體力，一個不安的夜晚可能牽動隔天的情緒。理解這些連鎖與起伏，才不會把一天的狀態，當成整段旅程的結論。
排比句｜耦合理解讓你看見治療如何影響生活的各個面向，回饋迴路讓你看見失眠與焦慮如何互相強化，時間動態讓你看見趨勢而不只是一天，臨界點辨識讓你知道哪些警訊需要立即求助，情境推演讓你為可能的變化提前安排。
對比句｜把一天的不舒服當成永久結論，心情只會更沉重；用一週的紀錄觀察趨勢，才看得清真正的變化。忍到撐不住才求助的人，常常讓狀況更危險；事先知道急症警訊的人，才能及時保護自己。
反問句｜越擔心睡不著，是不是越睡不著？你知道治療期間，出現哪些狀況必須立刻聯絡醫療團隊嗎？如果副作用突然增加，你知道該打電話給誰、誰能陪你去醫院嗎？
情境衝突｜一位接受治療的病友在家發燒，覺得「再忍一下就好」，不想麻煩家人，也怕被說太緊張。拖到隔天，症狀變得更嚴重才送醫。醫師說，治療期間的某些發燒需要及時處理。之後她把醫院給的急症警訊和聯絡電話貼在冰箱上，家人也都知道該怎麼做。她說：「勇敢不是忍耐，是知道什麼時候該求助。」
認知翻轉｜發燒、呼吸困難、意識改變、無法進食或喝水等，都可能是需要及時處理的警訊，請依醫療團隊的指示立即聯絡或就醫。改善失眠，不是責怪自己睡不著，而是找出可以介入的環節，持續失眠時尋求醫療評估。
層層遞進｜先記錄治療期間的食慾、體重與體力；再記錄睡眠與夜間症狀；再使用一週紀錄觀察趨勢；再向醫療團隊確認急症警訊與聯絡方式；最後建立一份醫療聯絡人、交通與緊急支援清單。
詩性收束｜願你在起伏的日子裡記得：今天的雨，不代表明天沒有晴。而在風雨真正來臨時，你身邊早已有人準備好撐傘。
金句｜勇敢不是忍到最後一刻，而是事先知道什麼情況需要立即求助。
最小行動｜向醫療團隊確認治療期間的急症警訊與聯絡方式，寫下來貼在家人看得到的地方。
## 第八模組｜自我覺察力
【◆ 你笑著說沒事，心裡卻下著大雨】
哲學命題｜很多病友白天在家人面前笑，夜裡一個人哭。他們害怕拖累別人，害怕被說不夠堅強，也害怕承認自己真的很害怕。自我覺察，是允許自己看見那場雨，並且知道：下雨不是失敗，只是天氣。
排比句｜情緒辨識讓你承認真實的感受，需求辨識讓你說出真正需要的幫助，信念覺察讓你看見「生病就沒有價值」的錯誤規則，偏誤覺察讓你知道恐懼會放大最壞的消息，自我反省讓你思考未來而不必審判過去。
對比句｜把所有感受藏起來的人，越來越孤單；說出一句真實感受的人，才給別人靠近的機會。用生產力衡量自己的人，生病後只剩自責；明白價值不只來自能力的人，才保有尊嚴。
反問句｜一個人的價值，真的只能用能不能工作、能不能照顧家人來衡量嗎？你反覆搜尋同一個可怕的問題，是在找答案，還是在餵養恐懼？回想過去的生活習慣，是為了改善未來，還是在審判自己？
情境衝突｜一位一直是家中支柱的媽媽，生病後不能再煮飯、接送孩子。她開始覺得自己是全家的負擔，連吃飯都不好意思多吃一口。某天孩子寫了一張卡片：「媽媽，你不用煮飯，只要在家就好，你在，我就安心。」她抱著卡片哭了很久，第一次明白，自己被愛，不是因為做了多少事。
認知翻轉｜疾病可能改變能力，卻不能取消人的價值；疾病通常涉及複雜因素，不能把責任簡化成過去的某個生活習慣。真正的更新，是關心未來能做什麼，而不是無止境地審判過去。
層層遞進｜先用一句話寫下最真實的情緒；再說出一項具體的需要，讓照顧者先確認再行動；再寫下三件不依靠工作能力也能代表自己價值的事；再停止反覆搜尋同一個恐怖問題，整理疑問向醫師確認；最後選一項目前能安全改善的生活習慣。
詩性收束｜願你不必在任何人面前假裝晴天。願你知道，你的眼淚值得被接住，你的存在本身，就已經足夠珍貴。
金句｜疾病可能改變能力，卻不能取消人的價值。
最小行動｜寫下三件不依靠工作能力，也能代表你生命價值的事情。
## 第九模組｜情緒調節力
【◆ 你可以害怕，也可以慢慢做出選擇】
哲學命題｜等待報告的那幾天，心跳加快，腦海不斷浮現最壞的畫面。很多人告訴病友要冷靜、要放鬆，可是情緒不是開關，說關就能關。情緒調節，不是強迫自己不害怕，而是在害怕之中，找到一點可以站穩的地方。
排比句｜情緒調節讓你在焦慮中先停一分鐘，壓力管理讓你不必把所有重擔自己扛，挫折承受讓你明白疾病結果不是努力的成績單，延遲滿足讓你不被快速見效的承諾利用，心理彈性讓你在新的身體條件下重新安排生活。
對比句｜強迫自己不怕的人，常常更緊繃；允許自己害怕、同時尋找支持的人，反而比較能安定。覺得求助很丟臉的人，越扛越重；願意向家人、社工或專業人員求助的人，才有機會喘口氣。
反問句｜你努力配合治療，卻仍遇到波折，這代表你不夠努力嗎？當有人說「三天見效、七天逆轉」，你是否願意先停下來，查證並詢問醫療團隊？以前做得到的事，現在做不到，就代表人生沒有意義了嗎？
情境衝突｜一位病友在治療後出現不理想的結果，他對自己非常生氣：「我那麼認真吃藥、忌口、運動，為什麼還是這樣？」他甚至開始考慮網路上一個昂貴的「快速療法」。家人沒有責備他，而是陪他一起去找醫師與社工。醫師說明了接下來的選擇，社工協助他申請了照顧資源。他後來說：「我需要的不是更用力，而是有人陪我一起面對。」
認知翻轉｜真正的韌性，是允許自己難過，也願意與醫療團隊討論接下來的選擇；智慧不是放棄希望，而是讓希望不被不實承諾利用。調整生活方式，不代表放棄自己。
層層遞進｜先在焦慮時暫停一分鐘，觀察呼吸；再列出一項最沉重的負擔，尋求協助；再寫下目前最需要醫療團隊協助的一項困難；再對新的療法或產品先查證、不因促銷立即決定；最後依目前體力調整一項活動，保留其中最重要的樂趣。
詩性收束｜願你在風浪裡，不必假裝自己是一座不動的山。你可以是一艘小船，搖晃，卻有錨；害怕，卻仍在前進。
金句｜疾病結果不是努力程度的成績單。
最小行動｜焦慮時暫停一分鐘，觀察呼吸與身體感受，然後聯絡一位可以陪你說話的人。
## 第十模組｜人際理解力
【◆ 不要對病友說「你要堅強」，卻不允許他哭】
哲學命題｜愛一個生病的人，常常讓人手足無措。我們急著給建議、急著保證會好、急著把對方的眼淚擦乾。可是病友需要的，有時不是被修好，而是被理解。人際理解，是在關心與壓力之間，找到那條溫柔的界線。
排比句｜同理讓害怕、難過與希望都能同時存在，動機辨識讓你明白病友拒絕幫助背後的原因，換位思考讓照顧者與病友看見彼此的辛苦，信任評估讓病友敢在醫療關係中說真話，界線建立讓病友有權拒絕不想要的關心。
對比句｜一句「不要哭，一定會好」，可能讓病友覺得情緒不被允許；一句「你最難受的是什麼？我願意聽」，卻讓他終於可以卸下偽裝。把拒絕當成不領情的人會受傷，先詢問原因的人才會理解。
反問句｜如果每次只比較誰比較累，病友與照顧者的關係要如何得到支持？當病友明明很累，還要顧慮別人的好意，那份關心是否已經變成新的壓力？
情境衝突｜一位病友的朋友們輪流來探病，有人推薦偏方，有人追問病情細節，有人一直說「要正向」。病友每次都強打精神應對，送走客人後累得說不出話。後來她鼓起勇氣在群組裡說：「謝謝大家的關心，這陣子我比較需要休息，有醫療問題我會和醫師討論。如果想陪我，傳一張你們生活的照片給我就好。」那之後，她收到許多溫暖的照片，也終於有時間好好休息。
認知翻轉｜真正的同理，不是替對方保證結果，而是讓對方知道情緒都可以存在；真正的善意，不應該變成新的壓力。病友可以感謝關心，也可以清楚說出自己的界線。
層層遞進｜先對病友說「你現在最難受的是什麼？我願意聽」；再被拒絕時，先問對方希望用什麼方式接受支持；再請病友與照顧者各說出一項最需要的協助；再遇到不理解的醫療說明，請醫療人員用更容易懂的方式解釋；最後練習說：「謝謝關心，這部分我想先和醫療團隊討論。」
詩性收束｜願每一份關心都能抵達對方真正需要的地方。願陪伴不是給出更多，而是更懂得對方要的是什麼。
金句｜真正的同理，不是替對方保證結果，而是讓他知道，害怕、難過與希望都可以同時存在。
最小行動｜今天對身邊的病友或照顧者說：「你現在最難受的是什麼？我願意聽。」然後安靜地聽完。

## 第十一模組｜溝通表達力
【◆ 你說得越清楚，醫療團隊越能幫到你】
哲學命題｜看診的時間很短，心裡的擔心卻很長。很多病友說不清自己哪裡不舒服，也不敢問最想知道的問題；很多家人在病友說「不想治療了」時，只聽見恐懼，沒聽見背後的痛苦。溝通，是讓真正的需要被聽見，也讓病友的意願被尊重。
排比句｜清楚表達讓醫師了解症狀的時間、位置、程度與影響，精準提問讓你知道目前有哪些選擇，傾聽回應讓家人理解病友想停止的究竟是什麼，衝突溝通讓家人的不同意見不變成誰比較愛誰的比賽，協商讓病友在安全範圍內保有自主。
對比句｜說「我很不舒服」，醫師只能猜；說「這三天每到晚上肚子痛，大概七分，影響睡覺」，醫師就有了線索。用「我都是為你好」替病友決定一切的家人，常讓病友失去選擇；先問病友最在乎什麼的家人，才讓照顧真正貼近他。
反問句｜當病友說「我不想再治療了」，他想停止的是治療本身，還是疼痛、副作用與孤單？家人意見不同時，病友本人的想法，是否曾被好好問過一次？
情境衝突｜一位長輩在治療期間說：「我不要再去醫院了。」兒女們嚇壞了，有人勸、有人罵、有人哭。最後是孫女坐在床邊問：「阿公，現在最讓你受不了的是哪一部分？」阿公沉默了很久才說：「每次去醫院都要等一整天，我腰痛到坐不住。」家人和醫療團隊討論後，調整了止痛與回診安排。阿公後來說：「原來不是我想放棄，是我撐不住那張椅子。」
認知翻轉｜溝通不是說服病友接受安排，而是讓病友在充分資訊與支持下，表達自己的價值與選擇。誠實又有同理心的對話，比任何好意的隱瞞都更能讓人安心。
層層遞進｜先用三句話描述最困擾的症狀、持續時間與生活影響；再在門診前寫下一個關於治療選擇的具體問題；再在病友說想放棄時，先問最讓他受不了的是什麼；再在家庭討論時，先確認病友本人最在乎的目標；最後，在安全可行的範圍內，讓病友自主決定一項日常安排。
詩性收束｜願每一句話都能被好好聽見。願病友的聲音，不在家人的焦急裡被淹沒，也不在診間的匆忙裡被遺漏。
金句｜真正的照顧，不是讓對方完全服從，而是提供資訊、討論限制，並尊重他的自主與安全。
最小行動｜下次看診前，用三句話寫下最困擾的症狀、持續多久，以及它如何影響你的生活。
## 第十二模組｜合作博弈力
【◆ 照顧一個人，需要一整個團隊】
哲學命題｜生病不只是病友一個人的事，它牽動整個家庭的時間、金錢、情緒與生活安排。很多家庭的照顧重擔，最後都落在一個人身上，那個人越來越累，卻不敢說。合作博弈，是讓病友、家人與醫療團隊看見彼此的目標，一起分工、一起準備、一起做決定。
排比句｜角色辨識讓照顧責任不再落在同一個人身上，誘因分析讓你理解病友為什麼不想活動，策略預測讓治療前就做好交通與照顧安排，合作設計讓三方說出各自的需要，進退判斷讓治療選擇不再被簡化成勇敢或懦弱。
對比句｜一個人扛起所有照顧責任，愛會慢慢變成疲憊；把任務清楚分工，每個人都能陪得更久。以為病友不願努力的家人會生氣，理解疼痛、疲倦與跌倒風險的家人，才會和醫療團隊一起設計安全的活動。
反問句｜家裡的照顧工作，是不是一直默默落在同一個人身上？病友需要照顧，照顧者又由誰來照顧？當治療的負擔與生活品質需要權衡時，你們是否曾一起和醫療團隊討論治療目標？
情境衝突｜一位大女兒獨自照顧罹病的母親兩年，弟妹住在外地，只在過年回來，還常常質疑她的照顧方式。她終於崩潰大哭。後來一家人開了一次視訊會議，列出所有照顧任務：回診陪同、文件與費用、每週採買、晚上陪伴。弟弟負責文件與保險，妹妹每月回來兩個週末。大女兒說：「我不是不愛媽媽，我只是需要有人一起。」
認知翻轉｜真正的家庭支持，不是比誰犧牲最多，而是讓責任可以清楚分工；治療選擇也不是勇敢與懦弱的比賽，而是理解效益、風險、替代方案與病友的價值。即使疾病無法治癒，舒適與尊嚴仍然值得被照顧。
層層遞進｜先列出三項照顧任務並確認負責的人；再先詢問病友不願活動的原因，再請專業人員評估合適的活動量；再在治療前確認常見副作用與處理方式；再在門診時向醫療團隊說出病友最重視的生活目標；最後與醫療團隊討論目前的治療目標與重新評估的條件。
詩性收束｜願每一位照顧者都不必孤單地撐著。願愛被分成很多雙手，每一雙都不太累，卻一起把人穩穩地托住。
金句｜病友需要照顧，照顧者也需要被照顧。
最小行動｜今天和家人一起列出三項照顧任務，寫下每一項由誰負責。
## 第十三模組｜目標決策力
【◆ 今天能好好吃一餐，也是一個值得慶祝的目標】
哲學命題｜生病之前，我們的目標可能是升遷、旅行、存一筆錢；生病之後，目標可能變成好好睡一覺、吃完半碗粥、走到巷口曬太陽。目標變小了，並不代表人生變小了。目標決策，是在新的限制裡，依然為自己保留方向與選擇。
排比句｜目標設定讓今天有一件可以完成的事，優先排序讓有限的力氣留給重要的人，利弊權衡讓你理解治療的效益與代價，風險評估讓你知道什麼要預防、什麼要觀察、什麼要立即求助，決斷力讓重大決定不必在孤單中完成。
對比句｜用生病前的標準要求自己，只會不斷失望；依照當下體力設定小目標，才能一次次感受到完成。把每件小事都抓著不放的人，錯過了想珍惜的時光；懂得放下與請人幫忙的人，才留得住重要的陪伴。
反問句｜如果每一件小事都不能放下，真正想珍惜的時光，是否反而被擠走了？面對治療選擇時，你是否清楚它的主要效益、風險與替代方案？你知道自己可以尋求第二意見嗎？
情境衝突｜一位病友在治療期間仍然堅持每天整理家裡、準備全家的晚餐，因為「這是我的責任」。某天她在廚房暈倒，家人嚇壞了。出院後，她和家人約定：每天只選一件她最想做的事，其他交給家人。她選了「每天傍晚和孫子一起讀一本繪本」。她說：「我以前什麼都做，卻什麼都沒好好享受。」
認知翻轉｜真正的成長，不是忽略限制，而是在限制中保留選擇；真正的醫療決策，不是尋找沒有代價的選項，而是在充分資訊下，選擇最符合病況與個人價值的方案。風險管理不是活在恐懼裡，而是讓準備取代無止境的猜測。
層層遞進｜先設定一項今天安全、可完成的生活目標；再選一件最重要的事，其餘允許延後或請人幫忙；再請醫師說明治療的效益、風險與替代選擇；再建立一張個人化的急症警訊與就醫指引；最後列出決策中最缺少的一項資訊，向專業人員確認。
詩性收束｜願你學會為小小的完成而微笑。能吃一口飯、能睡一場好覺、能握住一隻溫暖的手，都是今天值得珍惜的勝利。
金句｜真正的成長，不是忽略限制，而是在限制中保留選擇。
最小行動｜今天設定一項符合當下體力、安全可完成的小目標，完成後替自己記上一筆。
## 第十四模組｜資源配置力
【◆ 求助不是丟臉，是讓資源找到需要它的人】
哲學命題｜生病後，生活好像被切成一段段等待：等門診、等報告、等治療、等下一次檢查。體力有限，金錢壓力增加，資訊又多又亂。資源配置，是重新安排時間、精力、金錢與工具，讓疾病不必佔據生活的全部，也讓求助成為一件理所當然的事。
排比句｜時間管理讓等待之間仍有值得珍惜的片刻，精力管理讓休息不再被當成偷懶，財務規劃讓金錢問題被正視而不是被藏起來，工具運用讓手機成為助手而不是焦慮來源，槓桿辨識讓一頁病歷摘要減少很多次重複說明。
對比句｜不好意思談錢的家庭，壓力常常越積越大；向醫院社工詢問補助與資源的家庭，才發現原來有人可以幫忙。整夜搜尋可怕故事的手機，只會偷走睡眠；用來記錄用藥與門診的手機，才真正減輕負擔。
反問句｜治療期間的體力變化，真的是意志力的測驗嗎？你知道醫院社工可以協助了解補助、福利與照顧資源嗎？每次換科別或尋求第二意見，你是不是都要重新說一次病史？
情境衝突｜一對年邁夫妻，先生生病後收入中斷，太太每天煩惱醫藥費和交通費，卻不好意思告訴孩子，也不知道可以問誰。一次回診時，護理師注意到太太憔悴的樣子，轉介了社工。社工協助他們申請了適用的補助與交通協助。太太說：「我以為求助是給人添麻煩，原來是有人一直在等著幫我們。」
認知翻轉｜財務困難不是羞恥，而是需要被處理的現實問題；休息不是偷懶，而是尊重身體目前的需要。真正的槓桿，不是省略重要資訊，而是讓資訊容易被正確使用。
層層遞進｜先每天安排十五分鐘做一件讓自己平靜的事；再把耗力工作拆成短時段，中間安排休息；再向醫院社工詢問可申請的補助與照顧資源；再建立門診提醒與症狀紀錄，減少無目的搜尋；最後整理一頁病歷摘要，包含診斷、治療與目前用藥。
詩性收束｜願你在漫長的等待裡，仍然找得到屬於自己的片刻陽光。願每一份需要，都能被看見，被接住。
金句｜休息不是偷懶，而是尊重身體目前的需要。
最小行動｜下次回診時，向醫院社工詢問一次：目前有哪些補助、福利或照顧資源可以申請。
## 第十五模組｜行動執行力
【◆ 今天能做到的一小步，就值得珍惜】
哲學命題｜病友常常想等身體完全恢復，再開始照顧自己的生活。可是恢復不是一條直線，有些事不必等到完美狀態才能開始。行動執行，是在醫療許可下，把復原拆成小步驟，允許起伏，也允許自己在今天就做一件讓生活保有溫度的事。
排比句｜任務拆解讓康復的每一步都可以小一點，開始行動讓兩分鐘的小事也有意義，持續執行讓照護習慣可以依體力調整，應變力讓治療計畫改變時先確認原因再整理下一步，完成交付讓想說的愛不必等到特別的日子。
對比句｜用以前的標準衡量自己的人，一開始就被挫折擊倒；從可承受的最小步驟開始的人，慢慢累積出力量。總想著「以後再說」的人，可能錯過表達的機會；今天就說出一句謝謝的人，讓愛及時抵達。
反問句｜如果你只能用一天的狀態評價整段歷程，那昨天精神很好的那一天又算什麼？為什麼愛一定要等到最完美的時刻才說出口？
情境衝突｜一位剛結束治療的病友，想恢復以前每天散步一小時的習慣，第一天就累到隔天下不了床，非常沮喪。復健師建議她從每天在家裡走五分鐘開始，覺得可以再慢慢增加。三個月後，她能走到附近的公園。她說：「原來不是我不行，是我給自己的第一步太大了。」
認知翻轉｜小行動不能替代治療，卻能讓生活保留自己的節奏；病友不需要每天都進步，仍然可以保有方向。生命裡值得完成的，不只有工作與責任，還有一聲謝謝、一句想念、一個擁抱。
層層遞進｜先和醫療團隊確認適合的活動，從最小步驟開始；再選一件兩分鐘內能完成、讓自己舒服的小事；再選一項可調整強度的生活習慣，記錄一週；再在治療計畫改變時詢問原因與接下來要觀察什麼；最後今天就向一位重要的人表達一件具體的感謝。
詩性收束｜願你不必等到一切都好，才允許自己生活。聽一首歌、看一次天空、說一句「謝謝你」，今天，就已經很好。
金句｜今天做得到的一小步，仍然值得珍惜。
最小行動｜今天向一位重要的人，說出一件你一直放在心裡的具體感謝。
## 第十六模組｜學習成長力
【◆ 看診時忘記醫師說什麼，不代表你不認真】
哲學命題｜面對疾病，病友和家人都需要學很多新東西：治療的原理、副作用的處理、復健的方法、照護的技巧。可是在緊張與疲憊中，記不住是很常見的事。學習成長，不是要病友成為自己的醫師，而是建立可靠的學習方式與提醒系統，並且在照護沒有改善時，懂得重新評估而不是責怪自己。
排比句｜自主學習讓你從可靠來源了解與自己有關的照護知識，記憶提取讓筆記與陪診者協助你留住重要資訊，刻意練習讓你在專業指導下逐步恢復能力，錯誤診斷讓沒有改善的照護得到重新評估，遷移應用讓你的經驗可以陪伴其他病友。
對比句｜要求自己記住每個細節的病友，越緊張越記不住；看診後立刻整理三個重點的病友，下次回診更有準備。把沒有改善解釋成「我不夠努力」的人，忽略了真正的原因；把持續症狀記錄下來請醫療團隊重新評估的人，才可能找到解方。
反問句｜網路上的資訊，能直接取代醫師對你個別狀況的判斷嗎？明明按時休息仍然很疲倦，是你做得不夠，還是原因需要重新評估？你的經驗，能不能在清楚說明「這只是個人經驗」的前提下，成為別人的陪伴？
情境衝突｜一位病友加入了一個病友社群，起初她到處詢問偏方，越問越亂。後來她遇到一位資深病友，對方沒有給她任何偏方，只分享了一個習慣：每次看診帶一本小筆記，寫下醫師說的三個重點和下次要問的問題，並且只從醫院或專業醫療機構的資料學習。她照做之後說：「我不再被資訊追著跑，我開始知道自己在學什麼。」
認知翻轉｜真正的自主，不是自己承擔所有醫療判斷，而是知道如何取得可靠資訊、提出問題與尋求專業協助；真正的分享，不是替別人決定答案，而是讓對方知道自己並不孤單。
層層遞進｜先從醫院或專業醫療機構的資料學一項與自己相關的照護知識；再在看診後整理三個重點與下次要問的問題；再向復健或醫療人員詢問一項適合目前狀況的練習；再把持續未改善的症狀記錄下來請醫療團隊重新評估；最後分享一項對自己有幫助的經驗，並說明它只是個人經驗。
詩性收束｜願你不必在一夜之間懂得一切。願每一次看診、每一次練習，都讓你多理解自己一點，也多一分面對的底氣。
金句｜真正的智慧，不是要求記憶完美，而是建立可靠的提醒系統。
最小行動｜下次看診帶一本小筆記，看完後立刻寫下三個重點與下次要確認的問題。
## 第十七模組｜創新創造力
【◆ 做不到以前的樣子，仍然可以找到新的樣子】
哲學命題｜生病常常帶走一些熟悉的喜好：不能遠行、不能久站、不能像以前一樣忙碌。失去是真實的，難過也是自然的。但如果我們保留那些喜好背後真正珍惜的感受，或許還能找到新的形式。創新創造，是在新的限制裡，依然為生活開一扇窗。
排比句｜好奇探索讓你在體力允許時仍能接觸新事物，跨域連結讓不同專業在各自的職責範圍內合作，逆向思考讓你先找出正在消耗你的事，方案生成讓暫時做不到的喜好有了替代版本，原型測試讓生活調整一次只試一項、低風險地進行。
對比句｜一次改變飲食、運動、補充品與作息的人，出現不舒服時無從判斷原因；一次只試一項、先與醫療團隊確認的人，才知道什麼真正有幫助。只會不斷做加法的照護，讓人越來越累；先做減法的照護，反而讓人鬆一口氣。
反問句｜真正讓你疲憊的，是缺少某種補充品，還是沒有控制好的疼痛、反覆失眠或過多的訪客？以前喜歡旅行的你，真正珍惜的是遠方的風景，還是那份自由與新鮮感？
情境衝突｜一位熱愛登山的病友，治療後體力大不如前，連爬樓梯都喘。他一度覺得人生失去了樂趣。後來女兒幫他在陽台種了幾盆植物，每天陪他記錄植物的變化，週末推著他到附近的植物園。他說：「我原來愛的不是爬山本身，是和大自然在一起的感覺。現在，它換了一個樣子回來了。」
認知翻轉｜真正的整合，不是讓任何一種方法包辦全部，而是讓不同專業在各自的證據與職責範圍內合作；真正的照護，有時不是加法，而是先做減法。尤其治療期間，不應自行大幅改變醫療或營養安排。
層層遞進｜先依體力選一件感興趣的小事，探索五分鐘；再詢問醫療團隊是否需要營養、復健或心理支持轉介；再找出一項最消耗精力的事情，討論如何減少負擔；再為一項暫時做不到的喜好設計安全的替代版本；最後與醫療團隊確認後，一次只測試一項低風險的生活調整。
詩性收束｜願你在失去之中，仍然找得到另一扇窗。風景也許變了，但那份讓你心動的感受，仍然可以用新的方式回到你身邊。
金句｜真正的照護，有時不是加法，而是先做減法。
最小行動｜選一項暫時做不到的喜好，寫下它背後你真正珍惜的感受，並設計一個安全可行的替代版本。
## 第十八模組｜倫理價值力
【◆ 生命的意義，不只寫在檢查數字裡】
哲學命題｜疾病讓很多人重新思考：什麼值得珍惜？誰是最重要的人？還有什麼想完成？這些問題不需要偉大的答案，也不必把疾病解釋成上天安排的課題。倫理價值力，是讓病友自己決定什麼最重要，也讓每一位病友都被公平、尊重地照顧。
排比句｜價值澄清讓你決定什麼對現在的生活最重要，責任承擔讓你做好能控制的部分而不為結果全然自責，公平判斷讓我們看見不同病友取得資源的障礙，尊重差異讓每個人選擇適合自己的支持，長期利他讓病友社群成為彼此增能的地方。
對比句｜用治療結果評價自己人格的病友，背負著不屬於他的重量；明白疾病存在不確定性的病友，才能在努力的同時保有平靜。把版主當醫師的社群，可能讓錯誤資訊擴散；教會大家查證與提問的社群，才真正保護病友。
反問句｜疾病會因為一個人比較有資源，就變得比較值得被照顧嗎？當你想鼓勵一位病友，你是否先問過他希望如何被陪伴？
情境衝突｜一個病友社群裡，有人分享了某種保健食品「讓腫瘤縮小」的經驗，底下很多人留言詢問購買管道。版主沒有直接刪文，而是留言：「謝謝分享個人經驗。提醒大家，每個人的病況不同，使用任何產品前請先和自己的醫療團隊討論。」接著貼上一份查證健康資訊的步驟。那篇留言被置頂，後來許多新病友說，這是他們在社群裡學到最重要的一件事。
認知翻轉｜真正的負責，是做好自己能控制的部分，也理解醫療與生物變化存在不確定性；真正的尊重，是讓病友有權選擇適合自己的支持；真正的利他，是讓更多人有能力辨識資訊、理解風險、參與自己的照護。
層層遞進｜先寫下三件目前最值得珍惜的人、事或經驗；再列出三項自己能做到的照護行動，不用結果評價人格；再協助一位需要幫助的病友尋找正式醫療或社福資源；再詢問病友希望如何被陪伴；最後分享一個病友可以自行使用的醫療資訊查證方法。
詩性收束｜願每一位病友都被當成一個完整的人來對待，不因為資源多寡而被差別看待，不因為身體變化而失去尊嚴。
金句｜生命的價值，不由檢查數字、治療結果或身體能力單獨決定。
最小行動｜寫下三件目前最值得你珍惜的人、事或經驗，今天為其中一件做一件小事。
## 第十九模組｜驗證修正力
【◆ 沒有改善，不是你不夠努力，而是需要重新評估】
哲學命題｜病友常常懷著期待：希望這次治療後比較不累，希望調整作息後睡得比較好。期待很珍貴，但它不是保證。當結果和期待不同，最容易出現的念頭是「一定是我不夠努力」。驗證修正，是用簡單的紀錄看見變化，讓結果帶我們找到下一步，而不是帶來更多責備。
排比句｜預測讓期待成為可以觀察的目標，測量讓疼痛、疲倦、睡眠與食慾的變化被看見，回饋分析讓你知道需要向醫師反映什麼，誤差歸因讓不舒服的原因保留多種可能，模型更新讓生活安排跟著身體的現況調整。
對比句｜每天只問「有沒有比較好」，答案常受心情影響；每天用0到10分記錄一項症狀，變化才清楚可見。把所有不舒服歸咎於自己的人，可能忽略真正需要處理的原因；保留多種可能、請專業評估的人，才可能找到解方。
反問句｜如果結果與期待不同，代表你失敗了嗎？今天的疲倦，有沒有可能和治療、睡眠、營養或其他健康問題有關，而不是你不夠努力？以前適合你的生活方式，現在還適合嗎？
情境衝突｜一位病友為了改善失眠，照著網路建議調整作息一個月，卻仍然每晚醒來三四次。她很自責，覺得自己連睡覺都做不好。後來她把一個月的睡眠紀錄帶去門診，醫師發現她夜間醒來多與某種症狀有關，轉介給相關專科處理。她說：「那份紀錄讓我知道，不是我沒用，是有些事本來就需要醫師幫忙。」
認知翻轉｜測量不是為了把人生變成考試，而是為了改善照護；當生活調整效果有限，醫療評估就更重要。真正的更新，不是要求自己回到過去的樣子，而是依照現在的身體條件，重新建立適合自己的節奏。
層層遞進｜先設定一項生活品質觀察目標，記錄預期與實際；再選一項症狀每天以0到10分記錄一次；再比較一週前後的紀錄，找出需要向醫師反映的變化；再對持續症狀列出可能相關因素，帶到門診討論；最後調整一項已不適合目前體力的生活安排。
詩性收束｜願你把紀錄當成和身體的對話，而不是對自己的審判。數字只是線索，而你，始終值得被溫柔地理解。
金句｜真正的測量，是為了改善照護，而不是增加焦慮。
最小行動｜選一項最在意的症狀，從今天起每天以0到10分記錄一次，一週後帶給醫療團隊看。
## 第二十模組｜智慧整合力
【◆ 你不是只有「病人」這一個身分】
哲學命題｜確診之後，很多人開始只用一個詞稱呼你：病人。你的行程圍著治療轉，你的對話圍著病情轉，連你自己也漸漸忘了，你曾經是誰、喜歡什麼、珍惜什麼。智慧整合，是把複雜的醫療資訊變得可以理解，把抽象的關心變成具體的行動，也把被疾病切碎的自己，重新拼回完整的樣子。
排比句｜知識壓縮讓衛教資訊變成五句容易理解的重點，知識解壓讓「好好照顧自己」變成清楚的步驟，世界模型整合讓你記起自己除了病友之外的身分，元認知讓你看見「我正在害怕」不等於「事情已經發生」，持續進化讓你在不同的道路上都保有尊嚴與選擇。
對比句｜一份滿是專業名詞的衛教單，看完仍不知道下一步；五句清楚的重點，卻讓人知道今天該做什麼。被恐懼帶走的念頭，直接變成了事實；被看見的念頭，只是一個需要確認的想法。
反問句｜除了病友之外，你是否仍然是某人的父母、伴侶、朋友，是一個喜歡某首歌、某道菜、某片風景的人？當你說「我一定是復發了」，那是已確認的事實，還是你正在害怕的想法？
情境衝突｜一位退休音樂老師在治療期間，覺得自己的世界只剩下醫院和藥袋。某天以前的學生來探望，帶來一份全班錄製的合唱。聽著聽著，她跟著哼了起來。那天晚上她在日記裡寫：「我是病人，但我也還是那個教會四十個孩子唱歌的老師。」從那以後，她每天花十分鐘聽音樂、寫下一段回憶，說那是讓自己「回家」的方式。
認知翻轉｜疾病是生命的一部分，卻不是生命的全部；真正的元認知，是讓想法被看見，而不是讓想法直接變成事實。有些病友逐漸康復，有些仍在治療，有些與疾病長期共處，每一條路都值得被尊重。
層層遞進｜先把一項可靠的衛教資訊整理成五句重點；再把一句健康建議改寫成一個安全、可執行的步驟；再寫下除了病友之外，自己仍然珍惜的三個身分；再在焦慮時寫下「我現在的想法是……我已確認的事實是……」；最後問自己：什麼能讓現在的我，多一點舒適與安心？
詩性收束｜願你記得自己仍是那個會笑、會愛、會被想念的人。願你在變化之中，始終保有尊嚴、關係與選擇。
金句｜疾病是生命的一部分，卻不是生命的全部。
最小行動｜寫下除了病友之外，你仍然珍惜的三個身分，今天為其中一個身分做一件小事。
## 生命金句與收束
【◆ 你值得被愛，不是因為你戰勝了什麼】
哲學命題｜我們的文化很喜歡抗癌英雄的故事：咬牙撐過、奇蹟康復、正能量滿滿。這些故事很動人，卻也可能讓其他病友覺得，自己不夠堅強、不夠努力、不夠樂觀。其實，每一位病友都值得被愛，不是因為他戰勝了什麼，而是因為他本來就是一個值得珍惜的人。
排比句｜如果今天很累，就允許自己休息；如果今天很怕，就允許自己說出害怕；如果今天想哭，就不必勉強微笑；如果今天有一點力氣，就做一件喜歡的小事；如果今天什麼都做不到，也不代表你失去價值。
對比句｜勇敢不是永遠不哭，而是害怕時也能在支持下尋找下一步；希望不是保證結果，而是在不確定中仍看見值得珍惜的可能。替病友決定一切的照顧，讓人失去自己；幫助病友保有理解、選擇與尊嚴的照顧，才讓人真正安心。
反問句｜你是否曾經為了讓家人安心，而不敢說出自己的害怕？你是否覺得，只有變好了，才值得被好好對待？如果你不必每天都勇敢，你最想對自己說什麼？
情境衝突｜一位病友在臉書上寫下自己的治療日記，起初每篇都很正向，充滿鼓勵的話。某天她寫下：「今天我很害怕，不想假裝了。」她以為會被說不夠堅強，沒想到收到上百則留言：「謝謝你說出來，我也是。」「你不用堅強，我們陪你。」她說，那是她生病以來，第一次覺得自己不是一個人。
認知翻轉｜你不需要把痛苦變成勵志故事，也不需要為每一次檢查結果向任何人證明自己。這些文字適合心理支持與自我覺察，不是醫療建議；醫療決策、持續症狀與緊急警訊，仍應由合格的醫療專業人員評估。
層層遞進｜每天問自己五個問題：今天我的身體最需要什麼？哪些擔憂是事實，哪些仍是猜測？今天我需要向醫療團隊確認什麼？今天誰可以提供我一點支持？今天有什麼小事，能讓生活多一點舒適與溫暖？
詩性收束｜願醫療給你專業的支持，願家人給你理解的空間，願朋友給你不必逞強的陪伴。願你在每一個未知的日子裡，仍然被溫柔而有尊嚴地對待。
金句｜你值得被愛，不是因為你戰勝了什麼，而是因為你本來就是一個值得珍惜的人。
最小行動｜今晚用「病友每日五問」問自己一次，只回答你想回答的那幾題。

<div id="modal" hidden><div class="box"><canvas id="cv" width="1080" height="1080"></canvas><button id="dl">下載 PNG 圖卡</button><button id="mc" class="sec">關閉</button></div></div>
<script>
const TABS=[["t1","運行模型"],["t2","十八篇貼文"],["t3","九十金句"],["t4","百項能力"],["t5","百篇短文"],["t6","病友篇"]];
const $=id=>document.getElementById(id);
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function parse(raw){const secs=[];let sec=null,card=null;
 raw.split(/\r?\n/).forEach(l=>{l=l.trim();if(!l)return;
  if(l.startsWith('## ')){sec={name:l.slice(3),cards:[]};secs.push(sec);card=null;return}
  if(!sec){sec={name:'',cards:[]};secs.push(sec)}
  if(/^【.*】$/.test(l)){card={title:l.slice(1,-1),lines:[]};sec.cards.push(card);return}
  if(!card){card={title:'',lines:[]};sec.cards.push(card)}
  card.lines.push(l)});
 secs.forEach(s=>s.cards.forEach(c=>{c.post=c.title.startsWith('◆');if(c.post)c.title=c.title.replace(/^◆\s*/,'');c.text=(s.name+' '+c.title+' '+c.lines.join(' ')+(c.post?' 臉書圖文':'')).toLowerCase()}));
 return secs}
const DATA={};
TABS.forEach(([id])=>{DATA[id]=parse($(id).textContent);const pe=$(id+'p');if(!pe)return;
 parse(pe.textContent).forEach(ps=>{const s=DATA[id].find(x=>x.name===ps.name);if(s)s.cards.unshift(...ps.cards);else{console.warn('找不到分段：',id,ps.name);DATA[id].push(ps)}})});
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
let RE=null;
function hl(s){s=esc(s);return RE?s.replace(RE,m=>'<mark>'+m+'</mark>'):s}
const KEY=/^(最小行動|金句|教學金句|最終金句|終極金句|總結金句|核心問題|核心命題)$/;
function body(lines,post){let h='',rows=[];const flush=()=>{if(rows.length){h+='<table>'+rows.join('')+'</table>';rows=[]}};
 for(const l of lines){const hd=l.startsWith('!');const t=hd?l.slice(1):l;const p=t.split('｜');
  if(post&&p.length===2){h+=KEY.test(p[0])?`<p class="key"><b>${hl(p[0])}</b>${hl(p[1])}</p>`:`<p><span class="tag">${esc(p[0])}</span>${hl(p[1])}</p>`;continue}
  if(p.length>=3){const tg=hd?'th':'td';rows.push('<tr>'+p.map(x=>`<${tg}>${hl(x)}</${tg}>`).join('')+'</tr>');continue}
  flush();
  if(p.length===2&&p[0].length<=12){h+=`<p${KEY.test(p[0])?' class="key"':''}><b>${hl(p[0])}</b>${hl(p[1])}</p>`}
  else h+=`<p>${hl(t)}</p>`}
 flush();return h}
let tab=store('lifeos18_tab')||'t1';if(!DATA[tab])tab='t1';
let onlyPost=store('lifeos18_only')==='1';
if(store('lifeos18_tag')==='0')document.body.classList.add('hidetag');
function terms(){return $('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean)}
function match(c,ts){return (!onlyPost||c.post)&&ts.every(t=>c.text.includes(t))}
function render(){const ts=terms();const filt=ts.length||onlyPost;
 $('onlyPost').classList.toggle('on',onlyPost);
 RE=ts.length?new RegExp(ts.map(t=>esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'gi'):null;
 $('tabs').innerHTML=TABS.map(([id,name])=>{let n='';if(filt){let c=0;DATA[id].forEach(s=>s.cards.forEach(x=>{if(match(x,ts))c++}));n=`<span class="n">${c}</span>`}
  return `<button data-t="${id}" class="${id===tab?'on':''}">${name}${n}</button>`}).join('');
 let h='',chips='',total=0;
 DATA[tab].forEach((s,si)=>{const cs=s.cards.filter(c=>match(c,ts));if(!cs.length)return;total+=cs.length;
  if(s.name){h+=`<h2 id="s${si}">${hl(s.name)}</h2>`;chips+=`<a data-s="s${si}">${esc(s.name.replace(/（.*）/,''))}</a>`}
  cs.forEach(c=>{const i=si+'-'+s.cards.indexOf(c);
   h+=`<div class="card${c.post?' post':''}">${c.title?`<h3>${hl(c.title)}</h3>`:''}<div class="btns">${c.post?`<button class="cp" data-img="${i}">圖卡</button>`:''}<button class="cp" data-c="${i}">複製</button></div>${body(c.lines,c.post)}</div>`})});
 $('out').innerHTML=h||'<div class="empty">找不到符合的內容，試試其他關鍵字。</div>';
 $('chips').innerHTML=chips;
 $('info').textContent=(filt?`本分頁符合 ${total} 則`:`本分頁共 ${total} 則`)+'（每個分段最上方的綠框是臉書圖文，可複製全文或下載金句圖卡）';
 store('lifeos18_tab',tab)}
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;render();scrollTo(0,0)};
$('chips').onclick=e=>{const a=e.target.closest('a');if(a)$(a.dataset.s).scrollIntoView({behavior:'smooth'})};
let tm;$('q').oninput=()=>{clearTimeout(tm);tm=setTimeout(render,150)};
$('clr').onclick=()=>{$('q').value='';onlyPost=false;store('lifeos18_only','0');render();$('q').focus()};
$('onlyPost').onclick=()=>{onlyPost=!onlyPost;store('lifeos18_only',onlyPost?'1':'0');render()};
$('tagBtn').onclick=()=>{const off=document.body.classList.toggle('hidetag');store('lifeos18_tag',off?'0':'1')};
$('top').onclick=()=>scrollTo({top:0,behavior:'smooth'});
$('theme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';store('lifeos18_theme',r.dataset.theme)};
{const t=store('lifeos18_theme');if(t)document.documentElement.dataset.theme=t}
function cardAt(k){const[a,c]=k.split('-');return DATA[tab][a].cards[c]}
function plain(card){
 if(card.post){const g=k=>(card.lines.find(l=>l.startsWith(k+'｜'))||'');
  const paras=card.lines.filter(l=>!/^(金句|最小行動)｜/.test(l)).map(l=>l.split('｜').slice(1).join('｜')||l);
  return '【'+card.title+'】\n\n'+paras.join('\n\n')+'\n\n'+[g('金句'),g('最小行動')].filter(Boolean).join('\n')+'\n\n#LifeOS #智慧生成 #大腦十八環節'}
 return (card.title?'【'+card.title+'】\n':'')+card.lines.map(l=>l.replace(/^!/,'')).join('\n')}
function copy(txt,b){const ok=()=>{const o=b.textContent;b.textContent='已複製';setTimeout(()=>b.textContent=o,1200)};
 const fb=()=>{const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy');ok()}catch(_){}t.remove()};
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(ok,fb);else fb()}
const FONT='"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif';
function wrap(x,text,w){const out=[];let cur='';const nb='，。、；：？！」』）…—';
 for(const ch of text){if(cur&&x.measureText(cur+ch).width>w&&!nb.includes(ch)){out.push(cur);cur=ch}else cur+=ch}
 if(cur)out.push(cur);return out}
let curName='圖卡';
function draw(card){const cv=$('cv'),x=cv.getContext('2d'),W=1080;
 const g=k=>((card.lines.find(l=>l.startsWith(k+'｜'))||'').split('｜')[1]||'');
 const quote=g('金句')||g('詩性收束'),act=g('最小行動');
 const bg=x.createLinearGradient(0,0,W,W);bg.addColorStop(0,'#f5f1e8');bg.addColorStop(1,'#dcebe6');x.fillStyle=bg;x.fillRect(0,0,W,W);
 x.fillStyle='#2f6f68';x.fillRect(0,0,W,14);
 x.textBaseline='top';x.fillStyle='#2f6f68';x.font='bold 30px '+FONT;x.fillText('LifeOS｜大腦十八環節 × 智慧生成 OS',80,70);
 x.fillStyle='#22262b';x.font='bold 42px '+FONT;let y=135;
 wrap(x,card.title,920).slice(0,3).forEach(l=>{x.fillText(l,80,y);y+=58});
 x.fillStyle='rgba(47,111,104,.18)';x.font='bold 220px Georgia,serif';x.fillText('“',60,y-20);
 let fs=64,ql;do{x.font='bold '+fs+'px '+FONT;ql=wrap(x,quote,900);fs-=4}while(ql.length>6&&fs>36);
 const lh=fs*1.55,qTop=y+70,qH=ql.length*lh,area=820-qTop;let qy=qTop+Math.max(0,(area-qH)/2);
 x.fillStyle='#1f3d39';ql.forEach(l=>{x.fillText(l,90,qy);qy+=lh});
 x.fillStyle='#2f6f68';x.fillRect(80,860,920,3);
 x.font='bold 30px '+FONT;x.fillText('最小行動',80,885);
 x.fillStyle='#22262b';x.font='30px '+FONT;let ay=930;wrap(x,act,920).slice(0,3).forEach(l=>{x.fillText(l,80,ay);ay+=44});
 curName=card.title.split('：')[0].replace(/[\\/:*?"<>|｜]/g,'_')}
$('out').onclick=e=>{const b=e.target.closest('.cp');if(!b)return;
 if(b.dataset.img){draw(cardAt(b.dataset.img));$('modal').hidden=false;return}
 copy(plain(cardAt(b.dataset.c)),b)};
$('dl').onclick=()=>{const a=document.createElement('a');a.download=curName+'.png';a.href=$('cv').toDataURL('image/png');document.body.appendChild(a);a.click();a.remove()};
$('mc').onclick=()=>$('modal').hidden=true;
$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').hidden=true};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').hidden=true;if(e.key==='/'&&document.activeElement!==$('q')){e.preventDefault();$('q').focus()}});
render();
</script>
