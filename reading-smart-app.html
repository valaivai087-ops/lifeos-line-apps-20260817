o spray their crops with pesticides, so fewer chemicals will end up in the soil. Agricultural Research for Development says they are needed to feed the world’s growing population. Drought-resistant corn could help feed the 925 million people that go hungry every day. To summarize, GM crops do sometimes affect the environment and people in ways that scientists have not planned. However, GM crops may offer benefits that regular crops can’t match. As the planet heats up, so does the debate over GM crops. Which side are you on? 解答請參考別冊 第 26 頁","translation":"你知道在美國販售的大部分加工食品都包含了一些 基因改造的成分嗎？多數人不知道基因改造食物在我 們生活當中扮演了多重大的角色，而且他們也不會樂 於聽聞此事。 科學家操作基因時很可能對人類和環境帶來意想不 到的事情。舉例來說，某一種基因改造玉米可能讓人 生病，所以只能用來餵養家畜。不過當中有些玉米最 後卻出現在餐廳的餐點當中，據報導，將近三十個人 對此產生過敏反應。 基因改造作物對環境可能也有負面影響。科學家改 造植物，使之能抵抗除草劑，這樣農夫在噴灑作物農 藥時就只會殺死野草。有些野生植物得到這種能力， 變成了超級野草，而農夫無力阻止超級野草，只能任 由它們長滿他們的田地。會毒死吃作物昆蟲的基改作 物也會殺死蝴蝶這類非預定目標的昆蟲。 如果基因改造作物這麼不好，為什麼全球還有 一千四百萬名農夫在種植？基因改造技術的支持者宣 稱環境能從基改作物中受益。以抗蟲玉米為例。種植 這種玉米的農夫不必為作物噴灑殺蟲劑，所以最後進 到土壤中的化學藥劑會比較少。 人類也能受益於基改作物。全球農業研究發展大會 表示，要餵養全球持續增長的人口就需要基改作物。 抗旱玉米可能有助於餵養每天都處於挨餓狀態的九億 兩千五百萬人口。 總而言之，基因改造作物有時確實會以科學家未計畫 的方式來影響環境與人類。然而，基改作物可能提供一 般作物無法匹敵的好處。隨著地球越來越熱，對於基改 作物的爭論也越來越熱烈。你支持哪一邊呢？","questions":[{"id":1,"prompt":"What is one benefit of growing pest-resistant corn?","options":{"A":"It stops weeds from growing.","B":"It keeps people from getting sick.","C":"Fewer chemicals end up in the soil.","D":"Fewer nontarget insects get killed."},"answer":"C"},{"id":2,"prompt":"What is the main idea of the article?","options":{"A":"To discuss how farmers are affected by GM crops","B":"To weigh the pros and cons of GM foods","C":"To show the benefits that GM foods provide","D":"To look at the environmental damage of GM farming"},"answer":"B"}]},{"number":23,"title":"Hop in a Taxi and Go!","zhTitle":"跳上計程車 全球不一樣","category":"Culture and Customs","article":"people paid carts by distance to take them from places like the Colosseum to their villas. Carriages drawn by horses were for hire in London and Paris as early as 1640. By the end of the 19th century, gas-powered taxis hit the roads. Not all modern taxis are the same. In an Internet survey by Hotels. com, travelers ranked London’s famous black cabs as the best. The ranking is based on the taxis’ cleanliness, the friendliness of the drivers, and safety. Although New York’s yellow taxis came in second, their drivers still tied with Paris’s as the rudest in the world. Rome’s cab drivers were voted the worst for safety. Many cities’ taxis are standard four-door cars, but there are other shapes and sizes, too. For example, Bangkok has tuk-tuks, which are open three-wheeled vehicles. In watery cities such as Venice and Amsterdam, boats called water taxis are for hire. You don’t always need a motor to get around. In some places of the world, seats on two wheels, called rickshaws, are still pulled by people! Lots of interesting taxi services have popped up all over the world. Pink Ladies is a taxi service in the UK for women only, and it prides itself on safety and comfort. In Toronto, a f leet of EcoCabs has landed. These are bicycle taxis that are free of charge. That makes them great for the environment and your wallet. In other cities, you’ll find karaoke taxis and cabs decked out with disco balls and lights to help get your fun evening started. There’s no end to the creativity and variety of taxis. Whether you’re rushing to work or coming home late, taxis make travel easy. At times, they also make it a little more fun.","translation":"在引擎出現很久前就有計程車了。在古羅馬時期， 人們按距離計費付錢請馬車載他們從古羅馬競技場之 類的地方到他們的別墅。早在一六四○年時，在倫敦 和巴黎就可雇用由馬拖拉的馬車。到了十九世紀末 期，以汽油發動的計程車上路了。 並非所有的現代計程車都相同。在 Hotels.com 網 站所做的一項網路調查中，倫敦著名的黑色計程車被 旅客評為最佳計程車。這項評等是以計程車的潔淨 度、司機的友善度與安全性為基準。雖然紐約的黃色 計程車排名第二，他們的司機與巴黎的計程車司機仍 並列為世界上最沒禮貌的司機。羅馬的計程車司機被 票選為最不安全的。 許多城市的計程車是標準的四門汽車，但也有其他 形狀和大小的計程車。例如，曼谷有嘟嘟車這種開放 式的三輪交通工具。在水都如威尼斯和阿姆斯特丹， 有稱作水上計程車的船可出租。你不一定總是需要馬 達才能到處遊晃。世界上有些地方有稱為黃包車的兩 輪式座車還是用人力拉的！ 許多有趣的計程車服務紛紛出現在世界各地。英國 的「粉紅淑女」是一種女性專屬的計程車服務，以安 全與舒適為豪。在多倫多則有環保計程車車隊進駐。 這些是不收費的腳踏計程車。那使得它們對環境和你 的荷包都很棒。在其他城市，你會發現有卡拉 OK 計 程車和裝飾了迪斯可球和燈泡的計程車，幫助你展開 有趣的夜晚。 計程車的創意與多樣性是無止盡的。不管你是趕 著去上班還是很睌才回家，計程車讓交通往返變得容 易。有時候，它們也讓旅程多了點樂趣。","questions":[{"id":1,"prompt":"If you wanted to save some money, which taxi would you choose?","options":{"A":"An EcoCab","B":"A Pink Lady taxi","C":"A karaoke taxi","D":"A taxi with disco balls and lights"},"answer":"A"},{"id":2,"prompt":"Which of the following is NOT true, according to the article?","options":{"A":"In Paris, people used to take carriages pulled by horses to get around.","B":"Rome’s taxi drivers are considered the rudest in the world.","C":"In the United Kingdom, there are taxis for women only.","D":"Amsterdam is a good place to find water taxis."},"answer":"B"}]},{"number":24,"title":"Body Temperatures Aren’t as Simple as We Think","zhTitle":"體溫沒有我們想的那麼簡單","category":"Health","article":"What’s the average human body temperature? If you said 37 degrees Celsius, you are . . . wrong. It turns out that the average body temperature has dropped in the past 150 years. In a new study, a team at Stanford University looked at medical data from three different periods: 1862 to 1930, 1971 as We Think 150 years ago: 37°C now: 36.6°C to 1975, and 2007 to 2017. Comparing the data, they determined that body temperatures had decreased by about 0.02°C per decade. So what’s the new normal? It’s 36.6°C, says the study. One possible reason is that living in temperature-controlled buildings has changed our bodies. They don’t need to work as hard to retain a normal temperature. Another is less inflammation in people’s bodies. Inflammation causes your body to consume more energy, which increases body temperature. Advances in medicine and improved standards of living have led to less inflammation compared to 200 years ago. Whatever the cause, our bodies are evolving. Frequently, the battle of the thermostat is a battle of the sexes. According to one study, women are comfortable at 24–°C, which is 2.°C higher than the temperature preferred by men. A 1990s study found that women have a warmer internal temperature but colder hand and foot temperatures. Women’s body temperatures were on average 0.23 degrees higher than those of men (36.56°C vs. 36.33°C), whereas men had higher average hand temperatures (32.22°C vs. .67°C). Additionally, women respond differently to changes in environmental temperature. Studies have shown that as the temperature decreases, their blood flow slows more than men’s. This leaves their skin more sensitive, especially on their hands and feet, since it’s blood flow that maintains hand and foot temperature. Our bodies may have changed, but one thing has remained constant: the disagreement between men and women when it comes to what temperature is comfortable.","translation":"人的平均體溫是多少？如果你說攝氏三十七度，你 就……錯了。原來過去一百五十年來，平均體溫已經 下降了。 在一項新的研究中，史丹佛大學的團隊檢視三 個不同時期的醫療數據：一八六二年至一九三○27 年、一九七一年至一九七五年，以及二○○七年至 二○一七年。比對數據，他們確定了每十年體溫下降 約攝氏 0.02 度。那麼新的常態是什麼呢？這項研究表 示是攝氏 36.6 度。 一種可能的原因是住在溫度受到控制的建築中改 變了我們的身體。身體不需要花那麼多力氣來維持正 常溫度。另一個原因是人體的發炎症狀減少。發炎會 讓你的身體消耗更多的精力，這會讓體溫升高。相較 於兩百年前，醫療的進步和提升的生活水準使得整體 人口的發炎減少。不管原因是什麼，我們的身體正在 進化。 爭奪溫度調節器的衝突屢屢成為性別間的戰爭。 根據一項研究，女性在攝氏二十四度至二十五度時感 到舒服，這比男性偏好的溫度高出攝氏二點五度。 一九九○年代的一項研究發現女性體內的溫度較高， 但手腳溫度較低。女性的體溫平均比男性體溫高 0.23 度（攝氏 36.56 度對攝氏 36.33 度），而男性手的平 均溫度較高（攝氏 32.22 度對攝氏 30.67 度）。 此外，女性的身體對環境溫度變化的反應也不同。 研究顯示，隨著溫度下降，女性的血流速度比男性 慢。這使得她們的皮膚更為敏感，特別是手和腳，因 為維持手腳溫度的就是血液流動。 人體可能發生了變化，但有件事仍是不變的，那就 是男女之間對什麼溫度感到舒適的意見分歧。","questions":[{"id":1,"prompt":"What does “their” refer to in “Their blood flow slows more than men’s”?","options":{"A":"Women with warm hands","B":"Women who took part in the study","C":"Women in the 1860s","D":"Women in temperature-controlled buildings"},"answer":"B"},{"id":2,"prompt":"Which period was NOT part of the Stanford University study?","options":{"A":"1862–1930","B":"1940–1950","C":"1971–1975","D":"2007–2017"},"answer":"B"}]},{"number":25,"title":"Stories behind Everyday Inventions","zhTitle":"日常發明背後的小故事","category":"Origins","article":"Section 2 Section 2 24 Body Temperatures Aren’t as Simple as We ThinkThe need for something that can solve the problems in our daily lives often leads to new and interesting inventions. Here are some examples of inventions that were born as solutions to common daily problems. Earle Dickson noticed that his wife often burned or cut herself accidentally while working in the kitchen. She would then need his help to put bandages on the wounds. Since Dickson couldn’t always be there to assist her, he invented a bandage that she could easily apply herself. Sold under the brand name Band-Aid, these adhesive bandages are now used for many types of minor injuries. Then there was Bette Nesmith Graham, a secretary who wanted a simple way to correct her typing mistakes. One day, as she was watching painters apply touch-up paint to a wall, it struck her that the same technique could be used on paper. She mixed a white paint and used a small brush to apply it to her work. This small bottle of paint with brush eventually came to be known as Liquid Paper. In some cases, though, people invent things for one purpose but end up using them for another. Take tea bags, for example. In 1908, a New York tea seller named Thomas Sullivan came up with the idea of creating samples for customers by putting tea leaves in small silk bags. He intended for customers to remove the loose leaves from each bag before brewing a pot of tea. However, some people misunderstood and began putting the unopened bags directly into hot water, and the custom of using tea bags was born. Sometimes inventions are used for their original purpose. Other times they end up being used for something completely different. Either way, they make our lives a whole lot better.","translation":"對某樣可解決我們日常生活中問題的東西的需求常 會帶來新奇有趣的發明。這裡有幾個發明的例子就是 為解決常見的日常問題而產生。 厄爾．狄克森注意到太太在廚房工作時常不小心 燙傷或切傷自己。然後她會需要他幫忙在傷口上包上 繃帶。由於狄克森無法隨時在她身邊幫她，他就發明 了一種她自己便可以敷用的繃帶。這些黏性繃帶以 Band-Aid 的品牌名稱販售，現在用來處理許多類型的 小傷口。 還有貝蒂．奈史密斯．葛拉姆，她是一名想用簡 單的方法來修正打字錯誤的祕書。有一天，當她看著 油漆工在牆上塗補漆時，她突然想到同樣的技術可以 運用在紙上。她混合了一種白漆，然後用小刷子把它 塗在文件上。這一小瓶附刷子的漆最後漸漸以「立可 白」為人所知。 不過，在某些例子中，人們因為某目的而發明的東 西最後卻用在其他用途上。就以茶包為例，一九○八 年時，一位名叫湯瑪斯．蘇利文的紐約茶商想到一個 點子，他把茶葉放進小蠶絲袋裡讓顧客試喝。他本打 算要顧客在泡茶前先把散裝茶葉從每個袋子中取出。 但有些人誤解了，開始把未拆的袋子直接放進熱水 裡，使用茶包的習慣於焉而生。 有時發明物是用在原本的用途上。有時最後則用在 截然不同的地方。無論是哪一種情況，它們都讓我們 的生活更美好。","questions":[{"id":1,"prompt":"Why were adhesive bandages invented?","options":{"A":"Because a secretary wanted to correct her mistakes","B":"Because a wife needed to put them on by herself","C":"Because they made wounds heal more quickly","D":"Because customers should be able to put them in water"},"answer":"B"},{"id":2,"prompt":"How was the custom of using tea bags born?","options":{"A":"It was born from a misunderstanding.","B":"It was born from a need to remove loose tea leaves.","C":"It was born from a new creative idea to make tea.","D":"It was born from a creative tea package used for presents."},"answer":"A"},{"id":3,"prompt":"From (A) to (F) below, choose the statements that are true, based on the article.","options":{"A":"Tea bags were originally meant to be used as gifts.","B":"The invention of Band-Aid came from an unexpected accident.","C":"Thomas Sullivan was the first person to sell tea in the United States.","D":"Liquid Paper was invented by a secretary to deal with her trouble at work. (E) Originally, tea was supposed to be removed from the bag before brewing. (F) Earle Dickson invented Band-Aid to help his wife."},"answer":"D"}]},{"number":26,"title":"The Truth about Lies","zhTitle":"看穿謊言的真相","category":"Science and Technology","article":"How can you tell if a person is telling the truth? Scientists at the University of Portsmouth in England believe they have discovered a way to catch people in lies. The study concluded that the human mind has a limited capacity for how much it can think about at one time. Telling the truth doesn’t take much mental effort, whereas lying does. Liars have to invent a story, match it to the facts as they tell it, and remember the details. They also have to control their expressions and watch everyone else to make sure their lie is working. The scientists from this study say that to spot a lie, investigators just need to increase the cognitive load. One technique is making people tell their story in reverse. Another is having them draw a detailed picture of the story they just told. Already loaded down with the effort of lying, a liar’s brain won’t be able to handle the extra tasks and the lie will fall apart. Police specialists have some other tips to pass on to the average person to help in everyday lie detection. According to police interviewers, some signs of lying include unnecessary physical actions and fidgeting. If a person repeats phrases such as “to be honest” or “trust me,” there’s a good chance he’s lying. !! ... mind that they don’t work for everyone. There is a common belief that people who are remembering something will look up and right, while someone lying will look left. With so much now known about lying, honesty is the safest policy. By being truthful to others, you’ll encourage them to treat you with the same respect.","translation":"你要怎麼分辨一個人是不是在說實話？英國普茲茅 斯大學的科學家認為他們已找到一種抓出別人說謊的 方法。 這項研究推斷人類心智在同一時間能想多少事情 的能力有限。說實話並不用耗費很多心力，但說謊則 要。說謊者必須創造一個故事，訴說的時候要讓它符 合事實，並記住細節。他們還必須控制表情，並觀察 其他每一個人以確保謊話有效。 這項研究的科學家表示，要發現謊言，調查人員只 需要增加認知負荷即可。一個技巧是叫人把故事倒過 來講。另一個則是叫他們把剛講過的故事畫成一幅詳 細的圖畫。說謊者的腦子早已承擔說謊的重擔，無法 處理額外的任務，於是謊言將會崩解。 警界專家還有一些訣竅要傳授給一般人來協助察覺 日常謊言。根據警方的訊問者表示，說謊的跡象包括 不必要的肢體動作和坐立不安。如果有人重複「老實 說」或「相信我」這類詞彙，他很有可能在說謊。 如果你想利用這些察覺謊言的訣竅，重要的是記 住它們並不是對每個人都有用。有個普遍的看法是在 回想事情的人會看右上方，而在捏造事情的人則會看 左邊。28 現在對說謊的瞭解已相當多，誠實才是最安全的策 略。藉由對別人誠實，你才能鼓勵他們用同樣的尊重 來對你。","questions":[{"id":1,"prompt":"Why do liars have to watch everyone else?","options":{"A":"To remember the details of the lie","B":"To make sure their lie is working","C":"To be able to handle extra tasks","D":"To pretend they’re telling the truth"},"answer":"B"},{"id":2,"prompt":"Which of the following is a method that investigators use to increase the cognitive load?","options":{"A":"Remember the details","B":"Watch others’ reaction","C":"Invent a story","D":"Match the story to facts __________ → __________ → __________ → __________"},"answer":"A"}]},{"number":27,"title":"Health Threats Caused by Electronic Devices","zhTitle":"","category":"Health","article":"computer every day? These devices help us in many ways, but they may also cause health problems. Staring at screens for too long can cause eyestrain, which leaves your eyes feeling dry and sore and could also affect your vision. To help your eyes stay healthy, follow the “--” rule: every minutes, focus on something feet away for seconds. Your eyes aren’t the only parts of your body that could suffer from using electronic devices. People who write a lot of text messages can develop an injury called “texting thumb.” The repeated motion of typing with your thumbs can cause thumb and wrist pain and lead to the loss of grip strength. To avoid this, do this exercise: wrap a rubber band around the tips of your five fingers and open your hand to stretch the rubber band. Repeat this a few times. Scientific research suggests that electronic devices can also hurt your mind. One of the biggest problems is that using these devices can affect your sleep patterns. Doctors say the light-emitting screens stop you from feeling sleepy. Therefore, they advise people not to use electronic devices for at least one hour before trying to sleep. Another notable danger is Internet addiction. Many people turn to the Internet to ease feelings of stress, sadness, and loneliness. Over time, they might start to rely on the Internet and feel worried if they’re not 158connected. To stop yourself from falling into this kind of trap, limit the amount of time you spend online. To use your smartphone or computer safely, just make sure you follow these health tips. Also, remember that there is more to life than looking at an electronic screen.","translation":"","questions":[]},{"number":28,"title":"Gender Divide: The Science behind Our Differences","zhTitle":"男女視界大不同","category":"Science and Technology","article":"While many people believe that some gender differences result mainly from stereotyping and the way we were raised, recent studies have shown that they are actually based on biology. A study performed by researchers from the City University of New York showed that the visual senses of the sexes simply function differently. Participants were asked to name certain colors, and it was found that women required less time than men to see the proper shade. Men also had more trouble than women telling the difference between hues. Color perception wasn’t the only difference in vision noted by the researchers. The study also measured how sensitive participants were to contrast. They were shown groups of images made up of light and dark bars of varying width and placement. When the images changed rapidly on the screen, the men were better than the women at identifying the faster-changing images that showed thinner bars. Additional research explained how men and women are biologically different from each other in other ways. For one, males and females react to stress differently. Both sexes release certain hormones under stressful situations. Women, however, release more of a particular hormone that is associated with social behavior. Experts say this difference makes women more likely to seek the support of family and friends in stressful times, approach might seem healthier, but studies have also shown that females have more trouble letting go of stress. Differences between men and women can often lead to misunderstandings. By learning about what makes the other gender tick, both sexes can hopefully find a way to embrace the differences.","translation":"儘管很多人認為有些性別差異主要是來自於刻板印 象和我們被養育的方式，最近的研究顯示這些差異其 實是根據生物學而來。 一項由紐約市立大學研究人員進行的研究顯示，兩性 的視覺運作根本就不同。受測者被要求說出特定顏色的 名稱，結果發現女性在看出正確的色彩濃淡時所需的時 間比男性短。男性也比女性難以分辨色相之間的差異。 色彩感知能力不是研究人員唯一注意到的視覺差異。 此項研究也測量了受測者對於對比的敏感度。研究人員 讓他們看了幾組寬度和位置不斷改變的深淺色條紋組成 的影像。當影像在螢幕上快速變化時，男性比女性更擅 於辨識出變化越來越快的影像中較細的條紋。 其他的研究解釋了男女在其他方面彼此是如何不同。 其一，男女對壓力的反應不同。兩性在承受壓力的情況 下都會釋放特定的荷爾蒙。然而，女性釋放更多某種與 社交行為有關的荷爾蒙。專家表示，這種差異使得女性 在面臨壓力時較可能尋求家人和朋友的支持，而男性可 能覺得需要爭論或獨處。女性的方法也許看似比較健 康，但研究也顯示女性比較難以釋放壓力。 男女之間的差異可能經常導致誤解。藉由了解異性為 何會那樣做，男女雙方都希望能找到接納差異的方法。","questions":[{"id":1,"prompt":"Which of the following is true, according to the article?","options":{"A":"The study of the visual senses was conducted at New York University.","B":"Men are better than women at telling the difference between hues.","C":"Women aren’t as good as men when it comes to recognizing faster\u0002changing images.","D":"Men can identify the shade of a color more easily than women."},"answer":"C"},{"id":2,"prompt":"Which one of the following was NOT included in the study of gender differences?","options":{"A":"Color perception","B":"Images made up of light and dark bars","C":"Reaction to stress","D":"Ability to remember things better 3 Look at the research findings in the table below, and then check () whether they apply to men or to women. Finding Women Men Quicker at naming colors Trouble with identifying hues More likely to argue when dealing with stress Less able to let go of stress"},"answer":"D"}]},{"number":29,"title":"You’re an Animal!","zhTitle":"全球十二生肖不一樣","category":"Culture and Customs","article":"with “Libra” or “Cancer”? These are two of the 12 signs of the Western zodiac, but the Chinese zodiac also has 12 signs. The year of your birth determines which animal you are from the Chinese zodiac. There are many stories about how the 12 animals were chosen. One says that the Jade Emperor announced a race across a river. The first 12 animals to finish would each govern one year. Clever Rat won the race by riding Ox and jumping ahead at the end. Some people believe that your animal sign plays a role in your personality and destiny. For example, people born in the Year of the Tiger are said to be brave, and Horses are friendly and energetic. However, the most popular year to be born in is the Year of the Dragon, which is thought to help children be lucky and powerful. Many other Asian cultures have similar zodiac systems, with a twist. In Vietnam, some say a mistake in pronunciation led to a Year of the Cat instead of the Rabbit. A snake-like water creature called a Naga is used in place of the Dragon in Thailand. Asians are not the only ones with animal signs. Many Native American tribes also believe in animals linked to a person’s date of birth. The animal is thought to be your guide through life. This zodiac only shares one animal with the Chinese zodiac—the Snake. The other animals include Wolf, Bear, and different kinds of birds. All in all, the answer to “What’s your sign?” can be complicated. It’s important to remember that no matter what your zodiac sign or animal is, you can make your own destiny.","translation":"當你聽到：「你是屬什麼的？」這個問題時，你會 回答「天秤座」或是「巨蟹座」嗎？這些是西方黃道帶 十二星座中的兩個，但中國的黃道帶也有十二種生肖。 你的出生年分決定了你是中國生肖中的哪一種動物。 有非常多關於這十二種動物是怎麼被選出來的故事。 有一個是說玉皇大帝宣布一場渡河比賽。前十二種跑完 的動物將可各自統治一年。聰明的老鼠藉著騎在牛身 上，並在最後跳到前頭而拔得頭籌。 有些人認為你的生肖動物對你的個性和命運有影響。 例如，虎年出生的人據說很勇敢，而屬馬的人則友善又 充滿活力。然而，最熱門的出生年分是龍年，這一年被 認為會幫助小孩幸運又有影響力。29 其他許多亞洲文化都有類似的黃道帶系統，但有一點 變化。在越南，有些人說因為一個發音的錯誤導致貓年 取代兔年。在泰國則是由一種像蛇一樣、名叫「那伽」 的水中生物來取代龍。 不僅只有亞洲人使用動物生肖。很多美洲原住民部落 也相信和人的出生日期相關聯的動物。這種動物被認為 是你一生的嚮導。這種生肖系統和中國生肖只有一種動 物相同：蛇。其他動物包括狼、熊和不同種類的鳥。 總而言之，「你是屬什麼的？」這個問題的答案可能 很複雜。重要的是記住，不管你的星座或生肖是什麼， 你都可以創造自己的命運。","questions":[{"id":1,"prompt":"Why does Vietnam have the Year of the Cat?","options":{"A":"In Vietnamese tales, it was the Cat, not the Rat, that won the river race.","B":"Cats are believed by Vietnamese to be one’s guide through life.","C":"They think that cats are lucky and powerful.","D":"There was a mistake in the translation, making it “cat” instead of “rabbit.”"},"answer":"D"},{"id":2,"prompt":"Which of the following is NOT true, according to the article?","options":{"A":"Libra is a sign in the Western zodiac.","B":"In the story about the river race, the Rat wins by riding an Ox.","C":"One animal in the Native American zodiac is the Rabbit.","D":"Those born in the year of the Horse are said to be friendly."},"answer":"C"}]},{"number":30,"title":"Giving Your Way to Success","zhTitle":"天助「助人」者","category":"Life and Education","article":"Integrated Questions A B C D 1. sign [sa6n] n. 生肖；星座、宮 She told me that her sign is Taurus, but she acts more like a Pisces. 2. announce [4`na8ns] v. 宣布；聲稱 The mayor announced that he would retire from politics at the end of his term. 3. personality [%p-s4`n1l4ti] n. 個性；性格； 名人、風雲人物 Karl has a great personality and is very good with people. 4. twist [tw6st] n. 改變；轉折 I thought I knew how the movie would end, but there was a surprising twist. . pronunciation [pr4%n9nsi`e]4n] n. 發音 Lee’s English pronunciation is so good that people often think that he was born in the United States. 6. tribe [tra6b] n. 部落 This desert tribe has lived in the area for thousands of years. 7. complicated [`k3mpl4%ket4d] adj. 複雜的 It took a few hours for James to learn all of the rules of the complicated game. - 參考字彙與說明  Libra [`libr4] n. 天秤座  Cancer [`k1ns0] n. 巨蟹座  zodiac [`zodi%1k] 指「黃道帶」，在西方常指 「星座」，在中國可指「生肖」。  destiny [`d5st4ni] n. 命運  play a role in . . . 可引申表「在……中有影 響力；在……方面發揮作用」。  Vietnam [vi`5t`n3m] n. 越南（Vietnamese 則指「越南人」）  Naga [`n3g3] 指「那伽」， 為佛教與印度教傳說中的一種 靈性生物。  all in all 指「總而言之 ; 整體而言」，類似 on the whole。 關鍵解析 Language Notes -like 作字尾 like 指「像、似」，可接在名詞後面成為形容詞，表 示「像……般的；如……一樣的」。 • I wish Sybil would hurry up, but she’s moving with snail-like slowness. 我希望西柏快一點，但她以像蝸牛一樣慢的速度移動。 A in place of B 以 A 取代 B • I often use honey in place of sugar when I am cooking. 我煮菜時常用蜂蜜取代糖。 We’ve all received advice about what it takes to be successful in life: work hard, be passionate, set priorities, and don’t give up. While these tips can bring you a long way, there is another, less-obvious quality that often leads to success: giving. According to a recent study, people at work can be divided into three types, based on the way they act toward others. These types are the takers, matchers, and givers. Takers are selfish. They try to get more than they give. Matchers are willing to give, but they expect something in return. Givers, however, offer help and share knowledge without any expectations of gain. Studies have found that giving can be contagious. When people act generously, they inspire observers to behave similarly. In addition, we live in a world where collaborating with others is important for advancing our own work goals. Therefore, a willingness to help people lies at the heart of achieving quality and excellence, which in turn can lead to success. Takers can be successful, too, but their success is often short-lived. When a taker wins, it usually means that someone else has lost. However, when givers win, their success spreads outward to benefit those around them. In addition, givers are better than matchers at creating lucky situations by not limiting their generosity to those whom they think will give back. Matchers, on the other hand, keep a mental balance sheet, which limits their number of connections and opportunities for success. Section 2 Giving Your Way to SuccessFinding ways to be a giver isn’t difficult. For example, helping your classmate with English rather than guarding your knowledge and time is a good way to give. When you try to help others achieve their goals while keeping a clear focus on your own ambitions, success comes more easily as a result.","translation":"我們都獲得過人生要成功需要什麼的建議：努力工 作、有熱情、安排事情的優先順序以及不要放棄。儘 管這些祕訣會帶你走向成功，但有另一個較不顯著卻 常帶來成功的特質：付出。 根據一份最近的研究，依照與他人互動的方式， 可將職場上的人分成三種類型。這些類型分別是拿取 者、平衡者以及付出者。拿取者是自私的。他們試圖 拿取多過於給予的。平衡者願意付出，但他們期待回 報。然而，付出者提供協助、分享知識，而不期待任 何好處。 研究發現付出是有感染力的。當人們表現慷慨， 他們會激勵觀察者依樣效法。再者，我們處在一個要 推動自身的工作目標，就有必要與別人通力合作的世 界。因此，樂於助人是達成品質和卓越的核心要素， 繼而帶來成功。 拿取者也可能成功，但他們的成功通常不長久。當 拿取者贏時，通常表示其他人輸了。然而，當付出者 勝利時，他們的成功會向外傳播讓周遭的人也受益。 此外，付出者並不只將慷慨侷限在他們認為會回報的 人，因此通常比平衡者更能創造幸運的情況。另一方 面，平衡者會在心裡計算利益得失，反而限制他們的 人脈和成功的機會。 找到方法成為付出者並不難。比如說，幫助同學學 英文而非保守你的知識和時間是一個付出的好方式。 當你明確關注自己的抱負又能設法幫助別人達成他們 的目標時，結果可能會讓你更容易成功。","questions":[{"id":1,"prompt":"According to the article, why is the act of giving contagious?","options":{"A":"It inspires others to make a mental balance sheet.","B":"It makes others feel that they should also give.","C":"It gives others the expectation of gain.","D":"It helps others realize their opportunities."},"answer":"B"},{"id":2,"prompt":"What can we infer from this article?","options":{"A":"Success comes more easily to those who help others.","B":"Though it’s difficult to be a giver, it’s the best way to become successful.","C":"Takers and matchers don’t find success, so it’s better to be a giver.","D":"The success that matchers achieve can benefit those around them."},"answer":"A"},{"id":3,"prompt":"From (A) to (F) below, choose the statements that are true according to the article.","options":{"A":"A mental balance sheet can provide an unlimited amount of opportunities for success.","B":"Takers usually aren’t successful for very long.","C":"When a matcher succeeds, it means someone else has lost.","D":"Finding ways to be a giver isn’t easy at all. (E) Matchers are the best at creating lucky situations for themselves. (F) How you behave toward others determines what type of person you are."},"answer":"B"}]},{"number":31,"title":"The Truth behind Five Health Myths","zhTitle":"揭發五大健康迷思","category":"Health","article":"字彙 Vocabulary 1. expectation [~5k%sp5k`te]4n] n. 期望； 預期 The company’s success was beyond everyone’s expectations. 2. excellence [`5ks4l4ns] n. 卓越；傑出 Naomi is a model of excellence when it comes to being a student. 3. generosity [~d.5n4`r3s4ti] n. 慷慨；大方 I was able to pay for the summer classes due to my uncle’s generosity. 4. opportunity [~3p0`tun4ti] n. 機會 Did you have an opportunity to speak with Lester this morning? . ambition [1m`b6]4n] n. 抱負、野心；夢想 Robert’s ambition is to become an escape artist. - 參考字彙與說明  passionate [`p1]4n4t] adj. 熱情的  priority [pra6`7r4ti] n. 優先考慮的事  contagious [k4n`ted.4s] adj. 有感染力的； 接觸傳染的  observer [4b`z-v0] n. 觀察者  collaborate [k4`l1b4%ret] v. 合作  a long way 字面意思指「很長一段路」，常用 來比喻「帶你走向成功大道」。  willingness [`w6l6;n4s] n. 自願；樂意  the heart of sth 指「某事物的核心、重點」， 即最重要、最核心的部分。  outward [`a8tw0d] adv. 向外地 adj. 向外的  short-lived 為複合形容詞，指「短暫、不長 久的；曇花一現的」。  keep a balance sheet是「記錄資產負債表」， 加入 mental 比喻「在心裡計算利弊得失」。 關鍵解析 Language Notes lead to 導致；造成；引發 意近 give rise to、bring about、result in。 • Debra’s meeting with Linda led to the start of a new business opportunity. 黛博拉和琳達的會面開啟一項新的商機。 • The company’s rules gave rise to many complaints from its workers. 這間公司的規定引起員工諸多不滿。 • The president is determined to bring about change in the country. 這位總統決心要為國家帶來改變。 • The restaurant’s special offer resulted in an increase in the number of customers. 這家餐廳的特惠活動致使顧客人數增加。 on the other hand 另一方面 此片語也常和 on (the) one hand 合用，表示 「一方面……；另一方面……」。 • Anna goes to a public school, but her sister, on the other hand, goes to a private school. 安娜上公立學校，但另一方面，她姊姊卻上私立 學校。 • On (the) one hand, I want to go to Australia for vacation. On the other hand, I’m afraid to fly. 一方面，我想要去澳洲度假。另一方面，我又怕搭 飛機。 ideas. Here are some of them. Winter Colds Can cold weather make you catch a cold? Science tells us the answer is “no.” Colds are caused by viruses, not low temperatures. People get sick more often in the winter because they stay indoors, where they’re more likely to spread and pick up germs. Fresh vs. Frozen Foods For years, scientists have advanced the health benefits of eating fresh fruits and vegetables. This has led many to consider frozen foods to be less nutritious. However, the freezing process actually locks in the foods’ vitamins. Fresh foods, if left uneaten for too long, can lose these vitamins through heat and air exposure. Brushing after Meals Research shows that brushing immediately after a meal, especially after eating acidic foods, actually pushes the acid deeper into the teeth, thus damaging them. To protect your teeth, you should wash your mouth out with water after meals, and brush in the morning and before you go to sleep. Washing Away Acne Acne is not caused by a lack of cleanliness. Rather, it results from oil and dead skin cells trapped in your pores. Washing your face often actually causes acne because it forces your body to produce more oil to replace the oil washed away. Shaving and Hair Growth Shaving doesn’t make hair grow back thicker. Hair is thicker at the roots than at the ends, and shaving removes hair at skin level. When shaved hair begins to grow back, the roots appear at the skin surface, looking thicker and darker than it was prior to shaving. Popular advice should be taken with a grain of salt. Where your health is concerned, it never hurts to research the facts.","translation":"許多廣為流傳與健康相關的看法事實上都由錯誤的 觀念而來。這裡是其中一些。 冬天感冒 寒冷的天氣會讓你感冒？科學告訴我們答案是「不 會的」。感冒是由病毒引起，不是低溫。人在冬天較常 生病是因為他們待在室內，而在室內比較可能散播和 感染病菌。 新鮮食品與冷凍食品 許多年來，科學家提倡食用新鮮蔬果對健康的益 處。這導致許多人認為冷凍食品較不營養。然而，冷 凍過程其實能鎖住食物中的維生素。新鮮的食物如果 放太久沒吃，會因為高溫與暴露在空氣中而流失這些 維生素。 飯後刷牙 研究顯示飯後立刻刷牙，尤其是吃了酸性食物後， 事實上會把酸性物質往牙齒深處推，因此造成傷害。 要保護牙齒的話，你應該在飯後漱口，並且在早上和 就寢前各刷一次牙。 洗掉粉刺 粉刺並不是清潔不足引起的。反之，它是由卡在毛 孔中的油脂和死皮細胞所造成。經常洗臉其實會產生 粉刺，因為那會迫使你的身體製造更多油脂來取代被 洗掉的油脂。 剃除毛髮與毛髮生長 剃除毛髮並不會讓再長出來的毛髮變得更粗。毛 髮的髮根比髮尾還粗，剃毛髮除去的是皮膚表層的毛 髮。當剃掉的毛髮開始長回來時，出現在皮膚表層的 髮根看起來比在剃毛髮之前更粗、顏色更深。 對流傳的忠告應該要持保留態度。就健康而言，探 究事實總是不會有壞處的。","questions":[{"id":1,"prompt":"What is the main idea of the article?","options":{"A":"The origins of some health myths","B":"Clearing up incorrect ideas about health","C":"Different ways we can improve our health","D":"To offer five tips for staying healthy"},"answer":"B"},{"id":2,"prompt":"What does “with a grain of salt” mean in the final paragraph?","options":{"A":"It’s a good idea to add a little salt to one’s diet.","B":"Popular advice is usually 100 percent accurate, but sometimes it’s not.","C":"We shouldn’t completely believe the advice given.","D":"It’s better not to eat anything with too much salt."},"answer":"C"}]},{"number":32,"title":"Hired by a Machine Mind","zhTitle":"求職新考驗：人工智慧面試官","category":"Science and Technology","article":"1Landing a job has never been easy and now the “person” you have to impress may not even be a human being. 2Increasingly, employers are using Artificial Intelligence systems to find suitable workers. 3AI systems can read thousands of résumés far faster than a person can and they can run video interviews, too. 4During these, a person’s facial expressions, words, and answers are examined to judge how good the person would be for the job. 5While those who support such systems claim that this hiring method is the future, others fear it has serious problems. 6Because AI uses biased data sets to select people, the hiring process may be more unfair. 7An example of this was at Amazon, where women were automatically ignored on the grounds that most technical workers are male. Naturally, job seekers are now trying to satisfy AI’s selection criteria. In South Korea, where a number of top companies use AI for hiring, many candidates attend special cram schools to learn how to pass their AI interview. Of course, many of the techniques taught are nothing more than educated guesses. Without knowing exactly what each AI system is Mind looking for, knowing how to please it is extremely difficult. However, one tip is to use industry-specific terms in your interview, as AIs often search for key words. Another tip is to keep your résumé simple. That way, the AI can search it more easily. You should also remove anything that reveals your sex or race in case a biased data set is being used. It seems unfair that our success could depend on the mysterious judgment of a machine mind. In the end, the power to change the system, or at least make it work for you, is in your hands.","translation":"想獲得一份工作從來都不容易，而現在你必須打 動的「人」甚至可能不是人類。越來越多的雇主正在 用人工智慧系統來找到合適的員工。人工智慧系統檢 視數千份履歷的速度比人還要快得多，也能進行影 像面試。在這些面試中，人的臉部表情、用字遣詞及 回答都會被仔細檢視，以判斷此人對這份工作會有多 擅長。 儘管支持這類系統的人聲稱這套聘僱方法是未來 趨勢，有些人卻擔心系統會有嚴重的問題。因為人工 智慧用有偏見的資料集來挑選人才，這種聘僱流程可 能更不公平。一個例子就是亞馬遜的人工智慧招募系 統，它自動忽略女性，理由是目前大多數的技術員工 都是男性。 求職者自然會盡其所能來滿足人工智慧的挑選標 準。南韓當地目前有好幾間頂尖公司用人工智慧來招 聘，許多求職者會去上特別的補習班來學習如何通過 人工智慧面試。 當然，許多傳授的技巧只不過是憑經驗所做的猜測 而已。在未精確知道每一個個別人工智慧系統到底在 找什麼的情況下，知道要如何取悅它是非常困難的。 然而，有一個訣竅是在面試中使用特定行業的術語， 因為人工智慧經常會搜尋關鍵用語。另一個訣竅是讓 你的履歷表保持簡潔。那樣一來，人工智慧比較容易 搜尋。你也應該剔除履歷表中任何會透漏性別或種族 的東西，以防有使用帶有偏見的資料集。 我們的成功可能取決於機器思維神祕難解的判斷， 這似乎很不公平。最終，改變系統，或至少讓它為你 工作的權力掌控在你手中。","questions":[{"id":1,"prompt":"Which of the following tips is NOT mentioned in the article as a way to pass an AI selection process?","options":{"A":"Remove anything that might indicate your sex or race from your résumé.","B":"Use terms that are related to the industry you want to work in.","C":"Make sure your résumé style is not too fancy.","D":"Treat the AI as if it were a human being during your interview. 2 From the sentences numbered 1 to 7, choose one sentence that describes the advantage of an AI system in hiring new workers.Write down the number of the sentence. ________"},"answer":"D"},{"id":3,"prompt":"Which of the following elements would an AI system be likely to use to judge a person’s suitability during an interview?","options":{"A":"Answers to questions","B":"Hand gestures","C":"Facial expressions","D":"Word choice (E) Politeness (F) Outfit"},"answer":"A"}]},{"number":33,"title":"How to Give Feedback That People Will Listen To","zhTitle":"如何給予建設性的回饋","category":"Life and Education","article":"performance. Feedback can show us how to improve. Someone has to give that feedback and sometimes that will be you. How should you approach this? First things first—if you spot a situation in which feedback would be helpful, give it as soon as possible. If you wait until the matter fades from the person’s mind, they might not understand what you’re trying to tell them. Feedback should be clear and well timed, or it’s likely to be ignored. Once you’re giving feedback, keep in mind that no one likes to be told they’re doing a bad job. Always give positive feedback to balance out anything negative. Like the saying goes, “A spoonful of sugar helps the medicine go down.” Next, remember that good feedback should Life ard Education It’s delicious but just a bit salty. Yeah, I’ll add less salt next time. help accomplish a specific goal. It’s less useful to tell your friend that their dish tastes “interesting” than it is to suggest adding a little salt to improve the flavor. Feedback should also look toward the future. You can’t change what’s already happened, but you can prevent it from happening again. Tell your friend they should take more notes in class instead of saying they should have studied harder for the exam they failed. Plus, always focus on the action, not the person. If someone said that your speech was boring, would you know how to fix it? Being told you should add a funny story is a lot easier to put into practice. Finally, don’t assume your suggestion is the only way to deal with a situation. Consider other points of view and keep your ego under control. You might even get some feedback on your feedback. Don’t take it personally—it can only help you give better advice next time.","translation":"如果我們想要成功，我們需要知道別人對我們表現 的看法。回饋可以告訴我們如何進步。必須有人提出 反饋，而有時候，那個人會是你。你該如何處理這個 問題呢？ 重要的事先做——如果你發現反饋會有幫助的情 況，就盡快給予。如果你等到此人漸漸忘了這件事， 他們可能就不明白你想要跟他們說什麼。反饋應該要 清楚、適時，否則可能就會被忽略。 一旦你要提供反饋意見，要記住沒有人喜歡被告知 他們做得很糟。永遠都要給予正面反饋來平衡負面的 反饋。就像俗話說的：「一匙糖有助於吞下苦藥。」 接著，記住好的反饋應該有助於達成特定的目標。跟 朋友說他們的菜嚐起來「怪怪的」，不如建議加一點 鹽來改善味道來得有用。反饋也應該展望未來。你無 法改變已發生的事情，但你可以防止它再次發生。告 訴你的朋友他們應該在課堂上多記筆記，而不是說他 們應該為不及格的考試更用功。此外，總是要把重點 放在行動上，而不是人身上。如果有人說你的演說很 無趣，你會知道如何解決嗎？被告知你要在結尾加一 個有趣的故事，就比較容易實踐了。 最後，不要以為你的建議是處理某情況唯一的方 法。考慮其他觀點並控制你的自尊心。你的回饋甚至 可能會再得到一些反饋。不要認為它是針對自己—— 它只會幫你下次給出更好的建議。","questions":[{"id":1,"prompt":"According to the article, what should feedback be?","options":{"A":"Honest and immediate","B":"Objective and detailed","C":"Clear and timely","D":"Friendly and public"},"answer":"C"},{"id":2,"prompt":"According to the article, which of the following would be considered good feedback?","options":{"A":"Feedback that contains many points to work on","B":"Feedback that helps a person achieve a particular objective","C":"Feedback that will lead to someone living a happier life","D":"Feedback that tells someone how to change their personality"},"answer":"B"}]},{"number":34,"title":"Tips for Better Concentration","zhTitle":"增進專注力有妙招","category":"Science and Technology","article":"Do you find yourself studying the same page for minutes? Are you thinking of a TV show while doing your homework? If so, you may have a concentration problem. Concentration is the ability to focus on a task at hand while blocking out distractions. Luckily, concentration can be improved through training. Start by creating a space that’s well lit, quiet, and comfortable. Remove distractions like a TV or your smartphone. For fewer interruptions, have everything you need at your desk. This area is your concentration zone, and you should use it only for working. After a while, your brain will automatically switch to concentration mode as soon as you sit down. Physical health also plays a part in concentration. Healthy food, sufficient sleep, and regular exercise help your mind stay sharp. When stress gets in the way, try meditation. It will help you relax and practice concentration. American communication and creativity expert Sam Horn provides more tips for improving your “FOCUS.” F = Five More Rule. When you think you can’t work anymore, just do five more minutes. O = One “Think” at a Time. Stop juggling lots of things in your head. Instead, set a time for thinking about a single task. C = Conquer Procrastination. Sometimes we don’t feel like concentrating, so we put off work. Just ask yourself, “Will it get easier later?” Then you’ll probably want to get it over with. U = Use Your Hands as Blinkers. Cup your hands and zoom in only on what you are reading. or last time you’ll see or experience it. Concentration can help you get ahead in life. Use these tips and find out for yourself!","translation":"你是否發現自己十五分鐘都在看同一頁內容？你會 邊做功課邊想著電視節目嗎？如果是這樣，你可能有 專注的問題。 專注力是屏除分心的事物、專注在手邊工作的能 力。幸好，專注力可以透過訓練來改善。先從打造一 個光線充足、安靜又舒適的空間開始。排除像是電視 或智慧型手機等讓人分心的東西。為了減少干擾的事 物，就把所需要的一切物品都放在桌上。這個區域就 是你的專心區，你應該只用它來工作。過不久，在你 一坐下你的頭腦就會自動切換到專心模式。 身體健康也會影響專注。有益健康的食物、充足的睡 眠以及規律的運動都能幫助你的思維保持敏銳。當壓力 阻擾時，試試冥想。它會幫助你放鬆和練習專注。 美國溝通及創意專家珊．洪恩提供更多改善「專注 力」（FOCUS）的訣竅。 F = 多五分鐘法則。當你覺得自己不能再工作時，只 要再多做五分鐘就好了。 O = 一次只想一件事。停止在腦中同時想很多事。反 之，定一個時間來想一件事。 C = 克服拖延。有時候我們不想要專心，所以就拖延 工作。只要捫心自問：「晚點做會變得比較簡單 嗎？」那麼你或許就會想要趕快解決它。 U = 用手當護目鏡。把手圈成杯狀，並且只專注於你 正在看的東西。31 S = 當成是第一次看。把每一刻都當成是你第一次或 最後一次看到或體驗到。 專注可以幫助你在人生中獲得成功。運用這些訣竅 並自己去發掘吧！","questions":[{"id":1,"prompt":"According to the writer, when should you practice meditation?","options":{"A":"When you are too stressed out","B":"When you need to focus on one thing","C":"When you want to be physically healthy","D":"When you start to feel relaxed"},"answer":"A"},{"id":2,"prompt":"Which of the following is NOT mentioned as something that will help your mind stay sharp?","options":{"A":"Healthy food","B":"Sufficient sleep","C":"Reading a book","D":"Regular exercise 3 List the four things that you should have in your concentration zone, according to the author. 1. ___________________ 2. ___________________ 3. ___________________ 4."},"answer":"C"}]},{"number":35,"title":"Exploring Columbus Day","zhTitle":"哥倫布日的由來","category":"Culture and Customs","article":"Integrated Questions 180字彙 Vocabulary 1. concentration [%k3ns4n`tre]4n] n. 專注 （力）；專心 The sound of the telephone ringing caused Allen to lose his concentration. 2. interruption [%6nt4`r9p]4n] n. 干擾 My mother does not like interruptions when she is painting. 3. zone [zon] n. 地帶；地區、區域 Officials have marked that area a danger zone. 4. automatically [%7t4`m1t6kli] adv. 自動地 This coffeemaker automatically turns itself on in the morning. . sufficient [s4`f6]4nt] adj. 充足的；足夠的 Gerald’s parents made sure that he had sufficient money to take a taxi home from the museum. 6. communication [k4%mjun4`ke]4n] n. 溝通 Theo thinks that communication with his brother Jay is very difficult. 7. conquer [`k3;k0] v. 克服 Kim is taking a class that is supposed to help her conquer her fear of flying. - 參考字彙與說明  distraction [d6s`tr1k]4n] n. 令人分心的事物  mode [mod] n. 模式  meditation [%m5d4`te]4n] n. 冥想  get in the way 以字面意思「擋在路上」來表 示「妨礙；阻撓」。  juggle [`d.9g4l] v. 盡力同時應付（兩種或兩種 以上不同的活動或人）  procrastination [pro%kr1st4`ne]4n] n. 拖延  blinkers [`bl6;k0z] 原指「（繫在馬眼旁使其 只能直視的）馬眼罩」，在文中指減少干擾的「護 目鏡」。  zoom in on N. 以「特寫某人事物」的意象來 指「專注於某人事物」。 關鍵解析 Language Notes feel like 的意義及用法 1 指「想要」，之後接 N./V-ing。 • Do you feel like a trip to the beach this weekend? = Do you feel like taking a trip to the beach this weekend? 你這個週末想到海邊玩嗎？ 2 指「感覺像是……」，之後接 N. 或子句。 • Ashley felt like the luckiest girl in the world. 愛胥麗感覺自己像是世界上最幸運的女孩。 • I felt like the room was spinning when I stood up too quickly. 我太快站起來時，感覺房間像是在旋轉。 get . . . over with vs. get over . . . 1 get . . . over with 指「熬過……；盡速完成、結 束……」。get 之後常接令人不愉快的事，強調 儘快把事情結束。 • I don’t want to see the dentist, but I know I should get the appointment over with soon. 我不想去看牙醫，但我知道我應該快點預約看診。 2 get over . . . 則指「（對不愉快的事）釋懷； （從疾病中）復原」。 • The two friends had a big argument, but I think they will get over it soon. 那兩個朋友大吵了一架，但我認為他們很快就會 釋懷。 • When you get over your cold, we should go out for coffee. 等你感冒好了，我們應該出來喝咖啡。 from Spain. With the backing of King Ferdinand and Queen Isabella, Columbus was to chart a trade route to Asia but ended up in the Americas instead. Today, people in the United States celebrate his chance arrival with a holiday in his honor—Columbus Day. When Columbus and his sailors crossed the Atlantic Ocean, they had no idea where they would land. On October 12, after two months at sea, Columbus thought that he had landed in India. Where his ships actually made landfall was in the Bahamas. That is why the native peoples of the Americas were often mistakenly referred to as “Indians.” Columbus Day was celebrated for the first time in 1792 in New York. The city’s large Italian-American minority population wanted to honor the great achievement of their countryman, and the holiday gradually spread to other parts of the United States. By 1937, Columbus Day had become a national holiday, representing patriotism and traditional family values. Not everyone believes Columbus Day should be celebrated, though. Originally known as the man who “discovered the Americas,” Columbus is seen today in a different light. He wasn’t actually the first European to sail to the New World. That distinction belongs to the Vikings, who arrived on North American shores centuries before he did. There’s also the fact that Native Americans had been in the Americas for thousands of years before Columbus arrived. Some say that Columbus is no hero but a villain who invited the destruction of the native peoples of the Americas. Despite opposition, Columbus Day continues to be celebrated on the second Monday of each October. Perhaps you can use the occasion to become more familiar with history and see which side of the argument you stand on.","translation":"在一四九二年八月，義大利探險家克里斯多福．哥 倫布自西班牙啟航。哥倫布在斐迪南國王和伊莎貝拉 女王的支持下，準備要制定一條到亞洲的貿易路線， 但最後反而到了美洲。今天，美國人以一個紀念他的 節日——哥倫布日來慶祝他偶然的到來。 哥倫布和他的船員穿越大西洋時，他們不知道會 在哪裡靠岸。在海上航行兩個月後，在十月十二日這 天，哥倫布以為他已在印度登陸。他的船其實是在巴 哈馬群島靠岸。那也是美洲原住民常被誤稱為「印第 安人」（編注：Indians可指「印第安人」或「印度 人」）的原因。 第一次慶祝哥倫布日是在一七九二年的紐約。該 市數量龐大的義大利裔美國少數民族想要表彰他們同 胞的偉大成就，之後這個節日就漸漸傳到美國其他地 方。到了一九三七年，哥倫布日已經變成一個國定假 日，代表愛國精神與傳統的家庭價值。 不過並非所有人都認為應該慶祝哥倫布日。哥倫布 原本被稱為「發現美洲」的人，但今天對他卻有不同 的看法。事實上，他並不是第一個航行到新大陸的歐 洲人。那個殊榮屬於維京人，他們比他早好幾百年就 已抵達北美洲。還有個事實就是美洲原住民在哥倫布 抵達的數千年前就已經在美洲了。有些人說哥倫布不 是英雄，而是為美洲原住民帶來毀滅的禍首。 儘管有反對聲浪，人們還是繼續在每年十月的第二 個星期一慶祝哥倫布日。或許你可以利用這個時機多 熟悉一下歷史，並看看你支持哪一邊的論點。","questions":[{"id":1,"prompt":"Why were the native peoples of the Americas mistakenly referred to as “Indians”?","options":{"A":"They told Columbus they were Indian to trick him.","B":"The language of the native peoples was similar to Indian languages.","C":"Columbus thought that he had arrived in India.","D":"They looked exactly like people from India."},"answer":"C"},{"id":2,"prompt":"What is the main idea of the article?","options":{"A":"To introduce the history of Columbus Day and what it is today","B":"To honor Christopher Columbus for his contribution to the world","C":"To propose reasons for removing Columbus Day as a national holiday","D":"To support the spirit of Columbus Day 3 List the events mentioned in the article on the map below."},"answer":"A"}]},{"number":36,"title":"Off the Menu: Shark Fin Soup","zhTitle":"守護海洋「筵」禁魚翅","category":"Culture and Customs","article":"Few dishes have caused as much debate as shark fin soup. In Chinese culture, this dish is regarded as a symbol of wealth and class. 1However, for many people, it represents cruelty and waste. 2The reality behind making shark fin soup is difficult to stomach. In many cases, the fins are chopped off and the sharks are tossed back into the water alive. There, they bleed to death or become food for other animals. This process, called shark-finning, is used on tens of millions of sharks each year. Shark-finning is destroying the shark population and oceans. Sharks mature at an extremely slow pace, and some shark populations are already in danger of disappearing completely because of shark-finning. 3The loss of shark species could affect the populations of other ocean species and upset the marine ecosystem’s natural balance. One reason why people still consume shark fin soup is that they have false ideas about it. 4Many believe that the soup is healthy, but they don’t realize that sharks, and therefore shark fins, can be loaded with toxins. 5Luckily, campaigns around the world have begun to raise awareness. Couples are choosing not to offer it at their wedding ceremonies, and hotel restaurants have also taken this dish off their menus. 6Governments have taken steps to solve the problem, too. Many island countries, such as the Bahamas and Palau, have created shark became illegal in 2000, and several states have also passed laws banning the possession, sale, and trade of shark fins. 7Each of us can help protect sharks by spreading knowledge of the truth: the price of eating shark fin soup extends way beyond the dining table.","translation":"少有菜餚像魚翅羹一樣造成這麼多的爭論。在中華 文化中，這道菜被視為財富與階級的象徵。然而對許 多人來說，它代表著殘酷與浪費。 烹煮魚翅羹背後的真相讓人難以忍受。在許多案例 中，魚鰭從鯊魚身上被砍下來，然後鯊魚被活生生地 丟回海裡。牠們在海裡流血至死或成為其他動物的食 物。這種被稱為「割鰭棄鯊」的過程每年都用在數千 萬條鯊魚身上。 割鰭棄鯊正在摧毀鯊魚數量與海洋。鯊魚長成成鯊 的速度極為緩慢，有些鯊魚已經因為割鰭棄鯊而瀕臨 絕種。鯊魚物種消失可能影響其他海洋生物的數量並 破壞海洋生態系統的自然平衡。 人們還在食用魚翅羹的一個原因是他們對魚翅羹有 所誤解。很多人認為這種羹湯有益健康，但他們並不 了解鯊魚可能含有很多毒素，因此魚翅也有毒。 幸好，全球各地已展開各項活動來提高民眾的意 識。夫妻選擇不在婚宴上提供魚翅羹，而且飯店餐廳 也將這道菜從菜單上移除。 各國政府也採取行動來解決這個問題。許多島國如 巴哈馬和帛琉，都設立了鯊魚禁獵區。在美國，割鰭 棄鯊在二○○○年變成非法，而且有好幾個州也通過 法案，禁止持有、販售和交易魚翅。 我們每個人都可以藉由傳播真相來幫助保護鯊魚： 吃魚翅羹的代價遠超過餐桌上的價錢。","questions":[{"id":1,"prompt":"According to the article, why do some people in Chinese culture eat shark fin soup?","options":{"A":"It represents social and economic status.","B":"They think the soup is delicious.","C":"It represents good luck for a bride and groom.","D":"They think eating the soup will make them smarter."},"answer":"A"},{"id":2,"prompt":"Which of the following is true, according to the article?","options":{"A":"Shark-finning became illegal in the Bahamas in 2000.","B":"Many people think eating shark fin soup is healthy, but it is actually the opposite.","C":"Sharks are usually killed immediately after having their fins cut off.","D":"Nowadays, all hotel restaurants have stopped serving shark fin soup. 3 Some sentences in the article have been numbered 1 to 7. Which sentence best indicates the author’s attitude towards shark-finning? Write down the number of the sentence and then circle the adjective below that best describes the author’s attitude. ______, hopeful furious negative optimistic"},"answer":"B"}]},{"number":37,"title":"The Cold Hard Facts about Frozen Food","zhTitle":"關於冷凍食品的二三事","category":"Origins","article":"Integrated Questions 186字彙 Vocabulary 1. cruelty [`krulti] n. 殘忍；殘酷（的行為） The poor dog had suffered cruelty from its previous owner. 2. chop [t]3p] v. 砍、剁 Lou chopped some more wood for the fire. 3. bleed [blid] v. 流血；出血 The nurse put a bandage on the wound to stop the bleeding. 4. mature [m4`t]8r] v. 發育成長；長成 As the baby penguin matured, its feathers began to change color. . extremely [6k`strimli] adv. 極其；非常 The goods in this store are extremely expensive. 6. species [`spi]iz] n. （動植物的）種、物種 （單複數同形） This species of ape has been shown to be very intelligent. 7. upset [9p`s5t] v. 打亂、破壞（計畫、規律、 功能等） The storm upset our plans to go fishing. 8. campaign [k1m`pen] n. （政治或社會的） 活動、運動 Students have started a campaign to save the music school. 9. possession [p4`z5]4n] n. 擁有；所有物 （作此義時常用複數） The police arrested Dylan for possession of stolen goods. . extend [6k`st5nd] v. 擴展；延長 The clothing company wants to extend its range of products to include jewelry. - 參考字彙與說明  fin [f6n] n. 鰭；鰭狀物（shark-finning 指 「割掉鯊魚鰭」）  be difficult/hard to stomach 意為 「令人難以忍受的」，stomach 在此作動詞，表 示「能夠忍受、承受得住」。  marine [m4`rin] adj. 海洋的  ecosystem [`iko~s6st4m] n. 生態系統  toxin [`t3ks4n] n. 毒素  ceremony [`s5r4%moni] n. 典禮；儀式  Palau [p4`la8] n. 帛琉（位於西太平洋的島國）  sanctuary [`s1;t]4~w5ri] n. 禁獵區、鳥獸 保護區；庇護所  ban [b1n] v. 禁止  dining table [`da6n6;] [`teb4l] n. 餐桌 關鍵解析 Language Notes in danger (of N./V-ing) 有……的危險 • The people are no longer in danger now that the police have arrived. 既然警方已經抵達，那些人就不再有危險了。 • The building is so old that it’s in danger of falling. 那棟建築物十分老舊，以致於有倒塌的危險。 take steps to V. 採取措施做某事 steps 在此片語中指「措施；步驟」，通常用複數形。 • The school has taken steps to offer healthier cafeteria food to its students. 學校已採取措施為學生提供更健康的自助餐食物。 延伸學習 take action to V. 採取行動做某事 • If we don’t take action now to stop environmental pollution, it may be too late. 如果我們現在不採取行動停止環境汙染，可能就太 遲了。 there’s nothing more convenient than a frozen meal. Today, frozen food is a $240-billion global industry, but have you ever wondered how it all began? The history of frozen food dates back to 1,000 BC, when the Chinese stored food in ice cellars. However, frozen food didn’t become popular until much later. The modern frozen-food industry began with an American named Clarence Birdseye. During a trip to Canada, Birdseye went ice fishing with Inuit people and noticed that their fish froze immediately. Impressed by how fresh the fish tasted, he brought the idea back to the United States. In 1930, Birdseye used his new quick-freezing method to create a line of tasty, frozen foods. It included meat, fish, fruits, and vegetables. Despite the improved taste, it took time for people to warm up to frozen food. During World War II, however, a shortage of canned foods forced Americans to switch to frozen. Ever since then, frozen food has remained a kitchen staple. Frozen food has improved a lot since the 1930s, but it still tends to have a bad reputation. A common worry is that it’s unhealthy. But frozen produce might actually be healthier than fresh, since fruits and vegetables lose nutrients when they’re not consumed at their ripest. If they’re frozen just after they’re picked, these nutrients are locked in. People also believe that frozen food contains lots of preservatives. However, it’s not necessary to add preservatives to frozen food because most bacteria can’t grow at freezing temperatures. It’s only during thawing that bacteria may start to grow. If you pick the right frozen food, it can be just as nutritious and delicious as its fresh alternative. It’s no wonder that we keep reaching for frozen food after all these years!","translation":"當你匆忙著要做晚餐時，沒有什麼比冷凍餐更方便 的了。今天，冷凍食品是一個產值兩千四百億美元的 全球產業，但你可曾想過這一切是怎麼開始的？ 冷凍食品的歷史最早可追溯至西元前一千年，當時 中國人將食物儲存在冰窖中。然而，冷凍食品要到很 久之後才開始流行。現代的冷凍食品業是從一位名叫32 克拉倫斯．伯斯艾的美國人開始的。在到加拿大的一 趟旅行期間，伯斯艾和因紐特人在冰上釣魚，並注意 到他們的魚立刻就結冰了。他對魚的鮮味留下深刻的 印象，便把這個想法帶回美國。 一九三○年，伯斯艾用他新的急速冷凍法建立了 美味冷凍食品的產品線。當中包括肉、魚、水果和蔬 菜。儘管味道有所改善，但人們還是花了一段時間才 對冷凍食品感興趣。不過在第二次世界大戰期間， 當時罐頭食品短缺迫使美國人改用冷凍食品。從那之 後，冷凍食品就一直是廚房的主要產品。 冷凍食品自一九三○年代以來已有大幅進展，但它 的名聲常常還是不好。對冷凍食品的一個擔憂是不健 康。不過冷凍農產品其實可能比新鮮的更健康，因為 蔬果不是在最熟時食用，營養就會流失。如果在摘採 後立刻冷凍，就能將這些營養鎖住。 人們也認為冷凍食品含有許多防腐劑。然而，冷凍 食品沒必要添加防腐劑，因為大多數細菌無法在極冷 溫度下生長。只有在解凍期間細菌才可能開始生長。 如果你選對冷凍食品，它就可以和新鮮食物一樣營 養美味。難怪這麼多年後我們還是繼續在食用冷凍食 品！","questions":[{"id":1,"prompt":"What gave Clarence Birdseye the idea to start selling frozen food?","options":{"A":"His experience of going hunting with his son","B":"His discovery that the Chinese stored food in ice cellars","C":"His dislike of canned foods","D":"His observation that fish frozen immediately tasted fresh"},"answer":"D"},{"id":2,"prompt":"What led Americans to switch from canned to frozen food in the 1930s?","options":{"A":"They realized frozen food tasted better than canned.","B":"Canned food was in short supply because of the war.","C":"Freezers began selling very well.","D":"Commercials for frozen food were very effective. 3 Put the following events from the article in the correct order. ______ Clarence Birdseye went ice fishing during a trip to Canada. ______ People stored food in ice cellars. ______ Americans switched to frozen food. ______ World War II began. ______ Birdseye created a new line of tasty frozen foods."},"answer":"B"}]},{"number":38,"title":"The Many Uses of Lemons","zhTitle":"檸檬妙用多","category":"Food and Health","article":"Lemons are often used to make lemonade in the summer, but there is much more to these little yellow fruits. They have amazing healing power, and they can also be used to replace some personal care products. Check out these facts, and you’ll want to go lemon shopping right away. Lemon juice can reduce asthma symptoms and help fight throat infections. You can also apply lemon juice directly to minor cuts to help kill germs and stop bleeding. Drinking a glass of lemon water a day does wonders for your health, as it helps rid your body of toxins. Lemons also beat out expensive beauty products. You can use lemon juice as a natural facial wash to fight off acne and brighten up your skin. To make dandruff go away, you can rub lemon juice on your head before washing your hair with lemon water. Lastly, if you want great-looking nails, you can try putting them in warm lemon water and rubbing them with a lemon peel. Besides making you look and feel better, lemons are also extremely useful in the kitchen. A natural sanitizer, lemon juice may help wash away any chemicals on your fruits and vegetables. into the washer during the wash cycle. Your clothes will turn out bright and fragrant. Lemon juice even works for mildew. Mix it with salt and rub the mixture on the affected area. Then, let the clothes dry in the sun. Repeat the process and watch the mildew disappear. The uses of this amazing fruit go on and on. When life gives you lemons, make more than lemonade!","translation":"夏天時檸檬常被用來做成檸檬飲料，但是這些小小 的黃色水果還有更多用途。它們有驚人的治癒力，也 可以被用來取代一些個人護理產品。看看這些實際的 資料，你就會馬上想去採買檸檬了。 檸檬汁可以減輕氣喘症狀並有助於對抗喉嚨感染。 你也可以直接把檸檬汁敷在小傷口上來幫助殺菌及止 血。每天喝一杯檸檬水對你的健康具有神奇的功效， 因為它可幫助身體排毒。 檸檬也打敗昂貴的美容產品。你可以用檸檬汁作為 天然洗臉用品來對抗粉刺並且讓肌膚明亮有光澤。想 讓頭皮屑消失，你可以在用檸檬水洗頭髮前先抹一些 檸檬汁在頭上。最後，如果你想要好看的指甲，你可 以試著把指甲放進溫的檸檬水裡然後用檸檬皮來搓磨 指甲。 除了讓你更好看且感覺更好之外，檸檬在廚房裡也 極有用。檸檬汁是天然的殺菌劑，可能有助於清洗掉 蔬菜水果上的化學物質。 甚至是你的衣服也能受惠於檸檬。在洗程中加一杯 檸檬汁到洗衣機裡。你的衣服會變得鮮艷又芳香。檸 檬汁甚至還對黴菌有效。把檸檬汁和鹽混合，並將混 合物塗在發霉的地方。然後讓衣服在陽光下曬乾。重 複這個步驟就可以看到黴菌消失無蹤。 這種神奇水果的用途持續在增加中。當生命給你的 是檸檬，就做比檸檬飲料更多的利用吧！","questions":[{"id":1,"prompt":"How are lemons a natural sanitizer?","options":{"A":"They taste good in food.","B":"They can help clean the dishes.","C":"They keep your nails looking great.","D":"They can be used to wash fruits and vegetables."},"answer":"D"},{"id":2,"prompt":"What does “beat out” mean in the third paragraph?","options":{"A":"Lemons are better than beauty products.","B":"Lemons can brighten up your skin.","C":"Lemons are more expensive than beauty products.","D":"Lemons can make dandruff go away. 3 The graphic below shows how lemon juice helps in some chores. Fill in the blanks based on what you’ve learned from the article."},"answer":"A"}]},{"number":39,"title":"Is Drinking Milk Really Good for Us?","zhTitle":"喝牛奶真的好處多多嗎？","category":"Food and Health","article":"packed with vitamins and minerals. However, nutrition experts have recently begun to question whether milk really is good for us. Let’s look first at the benefits of drinking milk. Milk has a high concentration of calcium and vitamin D, which are necessary for maintaining strong bones. People who don’t drink milk tend not to get enough of these nutrients, and this can lead to bone loss and fractures. Another benefit of milk is that it contains a lot of potassium, which regulates the amount of salt in the body. Too much salt and too little potassium may increase the risk of high blood pressure. Some scientists also think that the acids found in milk can reduce the chances of a heart attack. Milk has also been linked to a lower risk of certain diseases such as colon cancer. However, several recent studies have shown that milk isn’t all it’s cracked up to be. One analysis revealed that milk doesn’t reduce the risk of fractures, while other studies indicated that a high consumption of milk actually increases fracture rates. Furthermore, it was shown that countries with the lowest milk consumption have the lowest rates of fractures. Research conducted in Canada and in Italy has also linked milk consumption to a higher risk of prostate cancer. Over recent decades, other studies have linked milk consumption to acne, asthma, heart disease, and other problems. Presented with so much conflicting evidence on the benefits of milk, what should we do? There’s no need to avoid milk altogether, but it’s also probably not necessary to drink as much of it as was suggested in the past. For those of us wanting to cut back on milk consumption, there are plenty of other healthy choices.","translation":"好幾個世代以來，牛奶被宣傳成一種富含維生素 和礦物質的食物來源。不過，營養專家最近開始質疑 牛奶是否真的對我們有好處。 我們先來看看喝牛奶的益處。牛奶含有高濃度的 鈣質和維生素 D，是維持骨骼強健所必需。不喝牛奶 的人往往無法攝取到足夠的這些營養素，而這可能導 致骨質流失和骨折。 牛奶的另一項好處是富含鉀，鉀能調節身體裡的鹽 分。鹽分太多、鉀太少可能會增加高血壓的風險。有些 科學家也認為牛奶裡的酸能降低心臟病發的可能性。 牛奶也跟降低某些疾病的風險有關，例如結腸癌。 然而，一些最近的研究顯示牛奶並沒有所說的那麼 好。一項在美國所做的分析顯示，牛奶不會降低骨折 的風險，其他研究則指出大量攝取牛奶其實會增加骨 折的比率。此外，研究顯示牛奶喝得最少的國家有最 低的骨折發生率。 在加拿大和義大利進行的研究也顯示牛奶攝取與罹 患前列腺癌風險較高有所關聯。最近這幾十年來，其 他研究認為喝牛奶跟粉刺、氣喘、心臟疾病和許多其 他身體毛病有關。 關於牛奶的好處顯示出這麼多矛盾的證據，我們該 怎麼做呢？完全不喝牛奶是沒有必要的，但可能也不 需要像過去所建議的喝那麼多。對我們當中想要減少 牛奶攝取的人來說，還有很多其他健康的選擇。33","questions":[{"id":1,"prompt":"What is the main idea of the article?","options":{"A":"To examine whether milk is good for us","B":"To look at research coming out of Canada and Italy","C":"To talk about the diseases related to milk","D":"To discuss the disadvantages of drinking too much milk"},"answer":"A"},{"id":2,"prompt":"What suggestion does the writer give for consuming milk?","options":{"A":"Never drink milk","B":"Drink milk sometimes","C":"Drink milk every day","D":"Drink milk once a month 3 Fill in the blanks in the chart below with the information contained in the article about the possible benefits and disadvantages of consuming milk. Benefits Disadvantages Heart __________ found in milk can regulate salt in the body. __________ found in milk may prevent heart attacks. Some studies have linked milk to heart disease. Cancer Lowers the risk of getting __________ cancer. Increases the chance of getting __________ cancer."},"answer":"B"}]},{"number":40,"title":"Legal Here, Illegal There","zhTitle":"什麼？！這是違法的？","category":"Culture and Customs","article":"Laws differ from country to country, so what is acceptable where you live may be illegal somewhere else. Knowing this can give you some insight into the values of other societies. It can also help you stay out of trouble when traveling. For example, ketchup may be just an ordinary food dressing for us, but in France, it is seen as a cultural threat. The French government has banned this American condiment from school cafeterias across France to preserve French cuisine. It did make one exception, though: ketchup may be served with french fries. While France banned ketchup to protect its culture, Canada, the United States, and several European countries have blocked the sale of fruit jelly cups to save lives. Governments decided to ban these bite-sized snacks following reports of people choking to death from eating them. In Italy, it’s not what you eat but where you eat that counts. To protect the city’s beauty, Rome, Florence, and Venice have created laws that forbid tourists from eating and drinking near architectural treasures. If caught eating in front of a monument, you may have to pay a fine. The city of Venice has banned pigeon feeding as a way to reduce the birds’ population. Pigeons build nests on top of delicate structures and ruin the surfaces of buildings with their claws and droppings. In Australia, walking the streets dressed like a burglar—in black clothes, black shoes, and with your face painted black—may get you fined. In Barcelona, it’s against the law to wear a bikini or swimming trunks outside beach areas. In the end, you should be mindful of other countries’ laws. This way, you’ll get a deeper understanding of their cultures as well.","translation":"法律因國家而異，所以在你住的地方可以接受的事 情在其他地方可能不合法。知道這點可以讓你對其他 社會的價值觀有些許深入的了解。也可以幫助你在旅 遊時避開麻煩。 舉例來說，番茄醬對我們而言也許只是一種平常 的食物醬料，但在法國則被視為一種文化威脅。法國 政府已在全國各級學校的自助餐廳禁止這種美式調味 料，以保存法國美食。不過確實有個例外：番茄醬可 以配薯條。（編註：薯條的英文 french fries 字面意思 指「法式炸物」） 法國禁用番茄醬來保護自己的文化，而加拿大、 美國及幾個歐洲國家則為了拯救生命而禁止販賣小果 凍。在出現有人吃這種一口大小的零嘴噎死的報導 後，這些國家的政府決定予以禁止。 在義大利，重要的不是你吃什麼，而是你在哪裡 吃。為了維護城市美觀，羅馬、佛羅倫斯和威尼斯都 已立法禁止觀光客在建築寶藏附近飲食。如果被抓到 在歷史遺跡前吃東西，你可能就得付一筆罰款。威尼 斯以禁止餵食鴿子作為一種減少該鳥數量的方式。鴿 子會在脆弱的建築物上面築巢，用牠們的爪子和排泄 物破壞建築物的表面。 還有關於衣著的法律是你該注意的。在澳洲，穿得 像竊賊一樣在路上行走——也就是穿黑衣、黑鞋，又 把臉塗黑——可能會害你被罰款。在巴塞隆納，於海 灘區外穿比基尼或泳褲是違法的。 最後，你應該要留意其他國家的法律。如此一來， 你也能對他們的文化有更深入的了解。","questions":[{"id":1,"prompt":"Why has the city of Venice stopped people from feeding pigeons?","options":{"A":"The pigeons make too much noise.","B":"The food is harmful to the pigeons.","C":"They worry about the spread of bird flu.","D":"The pigeons pollute structures and buildings with droppings."},"answer":"D"},{"id":2,"prompt":"What is NOT the purpose of the article?","options":{"A":"To help you avoid getting in trouble when traveling","B":"To discuss how laws are different in certain countries","C":"To criticize some unreasonable laws in other countries","D":"To provide some information about cultures in other societies"},"answer":"C"}]},{"number":41,"title":"Easter Is upon Us","zhTitle":"你不知道的復活節趣聞","category":"Culture and Customs","article":"Christ was resurrected. It is not a fixed holiday, though. In AD 325, a religious council said that Easter would be celebrated on the Sunday after the first full moon following the spring equinox. Since the spring equinox is on March 21, Easter can be anywhere between March 22 and April . While most Christians celebrate Easter by attending a special religious service, there are other traditions. One of the most well-known is the Easter Bunny. Legend says that the Easter Bunny hides dyed eggs in the homes of children. When the kids wake up, they hunt for the colorful eggs. This custom is at least 400 years old. Nowadays, “Easter egg” also has another meaning. Some authors, game designers, and filmmakers put hidden messages—Easter eggs—in their products for fans to find. Another great Easter tradition involving eggs is the Easter Egg Roll. Off and on since 1814, children have been invited to the White House lawn on Easter for a very special race. In it, children use spoons with long handles to roll dyed Easter eggs from one side of the lawn to the other. As with many holidays, people from different parts of the world have put their own spin on Easter. In Sweden, little girls dress up as witches and go from house to house asking for treats. In New York, a costumed, rowdy parade takes place. And in Bermuda, people fly kites of all shapes and sizes to demonstrate Jesus rising to Heaven. Whether you celebrate with prayers, bunnies, or kites, Easter offers a great chance to get outside. After all, spring and new life are all around.","translation":"慶祝復活節是為了紀念基督徒相信的耶穌基督復 活的日子。不過，這個節日的日期並不固定。西元 三二五年，一場宗教會議表示復活節會在春分後第一 個滿月過後的星期日慶祝。因為春分是在三月二十一 日，復活節可能是在三月二十二日到四月二十五日之 間的某一天。 雖然大部分的基督徒會參加特別的宗教儀式來慶祝 復活節，但還有其他的傳統活動。其中最廣為人知的 就是復活節兔子。傳說復活節兔子會把染色的蛋藏在 兒童的家裡。當孩子醒來，就要尋找彩蛋。這項習俗 至少有四百年的歷史了。如今，「復活節彩蛋」還有 另一個意思。有些作家、遊戲設計師和電影製作人在 他們的作品中放入隱藏的訊息——彩蛋——讓粉絲來 尋找。 另一項跟蛋有關的復活節優良傳統是復活節滾彩 蛋。自從一八一四年以來，兒童們不時會在復活節這 天受邀至白宮草坪參加一項非常特別的比賽。在比賽 中，孩子們用長柄湯匙把復活節彩蛋從草坪的一邊滾 向另一邊。 就像許多其他節日一樣，來自世界不同地方的人對 復活節都有自己的詮釋。在瑞典，小女孩們打扮得像 巫婆，然後挨家挨戶要點心。在紐約則是舉辦一場扮 裝、喧鬧的遊行。而在百慕達，人們會施放各種形狀 和大小的風箏來展示耶穌上天堂。 不論你是用禱告、兔子或風箏來慶祝，復活節提供了 一個外出的大好機會。畢竟，春天和新生命就在身邊。","questions":[{"id":1,"prompt":"What is the main idea of the article?","options":{"A":"How Christians celebrate Easter","B":"The history and traditions of Easter","C":"Easter traditions from around the world","D":"The beginnings of Easter"},"answer":"B"},{"id":2,"prompt":"Which of the following is NOT correct, according to the article?","options":{"A":"Easter is a religious holiday to celebrate the resurrection of Jesus Christ.","B":"Children have been invited to attend the Easter Egg Roll every year since 1814.","C":"A lively costumed parade is held in New York to celebrate Easter.","D":"There are many traditions of Easter around the world."},"answer":"B"}]},{"number":42,"title":"Say “Aloha” to Hawaii!","zhTitle":"阿囉哈，夏威夷！","category":"Travel","article":"Kauai Oahu Molokai Maui Nihua Honolulu The US state of Hawaii is composed of several islands. The largest ones are Hawaii and Maui, followed by Oahu, which is where my family and I recently spent our holiday. Oahu is also known as “The Gathering Place,” since it is Hawaii’s most populated island and home to the state’s largest city, Honolulu. As we f lew into Honolulu International Airport, I could see skyscrapers lining the arched, sandy coastline known as Waikiki Beach. My excitement built as we headed to our beachside hotel, Aulani, a Disney Resort and Spa. Unlike Disney’s amusement parks, Aulani doesn’t have any rides. Instead, it offers a clear blue sea and several pools, complete with waterslides. We spent most of our vacation enjoying water sports. Snorkeling was a lot of fun as it gave us a chance to see schools of tropical fish and wonderful coral gardens. I also got to fulfill my lifelong dream of surfing in Hawaii. With expert instruction, I was up and riding on my first wave. Located near our hotel were many public beaches that we explored. The swaying palm trees and dramatic sunrises and sunsets there made every picture we took look like a postcard. During our stay, we also went to visit the USS Arizona Memorial, located at Pearl Harbor. This floating memorial marks the spot where more than a thousand US sailors on the USS Arizona died when Japanese this memorial reminded us of the significant role that Hawaii has played in US history. All too soon, we were on our flight back to my other favorite island, Taiwan. As the plane took off, though, I vowed to return to discover more of amazing Hawaii.","translation":"美國夏威夷州是由好幾個島嶼所組成的。最大的 島嶼是夏威夷島和茂宜島，接著是歐胡島，那就是最 近我和家人度假的地方。歐胡島又被稱為「相聚之 地」，因為它是夏威夷人口最稠密的島嶼，也是該 州最大城檀香山（編注：亦稱作「火奴魯魯」）的 所在地。 隨著飛機飛進檀香山國際機場，我可以看到高樓大 廈沿著稱作威基基海灘的拱形沙岸林立著。在前往我 們的海濱飯店奧拉尼︰迪士尼度假旅館的路上，我的 興奮之情逐漸增加。不同於迪士尼樂園，奧拉尼沒有 供騎乘的遊樂設施。反之，它提供了清澈蔚藍的海洋 和好幾座備有滑水道設施的泳池。 我們假期大部分的時間都在享受水上運動。浮潛 好玩極了，因為它讓我們有機會看到一群又一群的熱 帶魚和非常美的珊瑚園。我也得以實現在夏威夷衝浪 這個畢生的夢想。在專家指導下，我第一次站立在浪 頭上。我們也去探訪許多位在我們飯店附近的公共海 灘。那裡隨風搖曳的棕櫚樹和令人驚豔的日出、日落 讓我們拍的每一張照片看起來都像是明信片。 我們停留期間也造訪了位在珍珠港的美國海軍亞利 桑那號戰艦紀念館。這個浮動的紀念館標示日軍在第 二次世界大戰攻擊珍珠港時，亞利桑那號戰艦上一千 多名美國水兵死亡的地點。探訪這座紀念館內部提醒 我們夏威夷在美國歷史上的重要地位。 很快，我們就要搭機返回另一個我鍾愛的島嶼：臺 灣。不過當飛機起飛時，我發誓要再回來發掘更多令 人讚嘆的夏威夷。","questions":[{"id":1,"prompt":"Why is Oahu known as “The Gathering Place”?","options":{"A":"More tourists visit this island than other islands.","B":"It has the largest number of people in Hawaii.","C":"It has more skyscrapers than other islands.","D":"It’s the largest island in the state of Hawaii."},"answer":"B"},{"id":2,"prompt":"Which of the following is NOT true, according to the article?","options":{"A":"The USS Arizona Memorial is a floating museum in memory of those who died in the attack on Pearl Harbor.","B":"The writer saw whales and dolphins when he went diving.","C":"The writer and his family took a lot of pictures that looked like postcards.","D":"The writer learned how to surf in Hawaii."},"answer":"B"}]},{"number":43,"title":"How to Improve Your Memory","zhTitle":"增進記憶力妙方","category":"Science and Technology","article":"Did you forget an important date during your history test again? The problem isn’t that you have a bad memory. You just need to train your brain. Here are some tips to help improve your memory. Association Words are usually easier to remember than numbers are. Therefore, the association method, which may involve linking numbers to words, can be used to help you memorize dates. For example, to remember “1492,” the year Columbus discovered America, think of the rhyme: “In fourteen hundred ninety-two / Columbus sailed the ocean blue.” Images Creating strong images in your mind can improve your memory, too. Take “pineapple” as an example. The object’s shape makes it look like a pinecone. Also, like an apple, it’s a fruit. Chunking Breaking large pieces of information into smaller ones makes them easier to remember. We break phone numbers into groups, such as 0955- 007-111, for this reason. Chunking is also useful for memorizing other information, such as poems and vocabulary words. Brain exercises Give your brain a workout with brain-training activities. Crossword puzzles, trivia games, and sudoku can keep your mind sharp. Physical exercise Regular exercise, like walking and running, helps increase the amount of oxygen in your brain and improve brain function. Keeping fit also reduces stress, which can affect your focus and your memory. Eat right Eating foods that protect your brain cells naturally enhances memory. These foods include berries, broccoli, carrots, and green tea. In addition, no vitamin pills can match the natural omega-3 fatty acids found in walnuts and some fish. Memories are made in your brain, so the more you take care of it, the more you will remember. Forget the excuse that you have a bad memory. Take the right steps and unlock the power of your mind.","translation":"你在考歷史時又忘記某個重要日期了嗎？問題不是 你記憶力不好。你只是需要訓練你的頭腦。這裡有一 些幫助你改善記憶力的訣竅。 聯想 文字通常比數字好記。因此，聯想法可用來幫你記 住日期，這或許需要將數字與文字作連結。例如，要 記住一四九二，即哥倫布發現美洲的那一年，就可以 想這段韻文：「在一四九二（two）年，哥倫布航向藍 色（blue）大海」。（編註：在英文中，two 與 blue 押韻） 圖像 在腦海裡創造強烈的圖像也可以增進記憶力。以鳳 梨（pineapple）為例。這物品的形狀使它看起來像 松果（pinecone）。而且它跟蘋果一樣是水果。 組塊 把長串的訊息拆成較小的片段可讓它們更容易記 憶。我們把電話號碼分組，例如 0955-007-111 ，就 是這個原因。組塊法用來記像詩和字彙等其他訊息也 很好用。 腦力鍛鍊 用訓練頭腦的活動來讓你的腦子動起來。填字遊 戲、益智問答遊戲和數獨也可以讓你的頭腦保持敏 銳。 體能運動 像走路和跑步這類規律的運動有助於提升腦部的含 氧量及提升腦部功能。健身也能減輕壓力，可以影響 你的專注力和記憶力。 吃得正確 攝取保護腦細胞的食物自然能增進記憶力。這些食 物包括莓果類、青花菜、胡蘿蔔和綠茶。此外，核桃 和某些魚類中所含的天然 omega-3 脂肪酸是任何維 他命丸都比不上的。 記憶是在腦中形成的，所以你越照顧頭腦，就越能 記住東西。忘掉記憶力差這個藉口吧。採取正確的步 驟來釋放大腦的力量。","questions":[{"id":2,"prompt":"Which of the following is true, according to the article?","options":{"A":"Staying physically fit can help you concentrate and enhance your memory.","B":"Vitamin pills can be a good choice to help improve your memory.","C":"Linking words to numbers is the best method to memorize long information.","D":"Doing brain workouts can help you develop your imagination."},"answer":"A"}]},{"number":44,"title":"Food for Thought","zhTitle":"美味的代價","category":"Food and Health","article":"When choosing between apples at the grocery store, many people make their choices based on price. However, the cost of your food isn’t just about money. Let’s look at those apples again. One group is organic, and the other looks just as nice and is priced at NT$ less. Before you reach for the regular apples, though, think about what the chemicals and wax on them will do to your health. Pesticides and chemical fertilizers used on apple trees may cause cancer or other illnesses. In addition, when you buy nonorganic produce, you are supporting businesses that pollute the land and water with harmful chemicals. To help the planet, you can make smarter choices when buying food. For example, cut down on meat. It takes 14 times more energy to produce chicken protein than it does to produce the same amount of soy protein. By choosing to eat less meat, you will use less energy and produce less waste. There’s another question you should ask about your food: Where did it come from? Food miles are the distances between where food is produced and where the consumer eats it. The trucks, planes, and ships used to transport the food burn fuel, producing carbon emissions. The greater distance food has to travel, the more harm it does to the environment. The solution to this problem is simple. You can choose to eat locally grown and produced food. In this way, carbon emissions are reduced, and you are supporting your community by paying local farmers instead of ones in foreign countries. Eventually, you have to face the fact that your food choices affect you and the planet. Do your part by buying locally grown organic food when possible. It’s a small price to pay for a healthy planet and a healthy body.","translation":"在雜貨店挑選蘋果時，許多人會根據價格來做選 擇。然而，你的食物的代價不只跟錢有關。 我們再來看看那些蘋果。一堆是有機的，另一堆看 起來一樣好且便宜了新台幣二十元。不過，在你伸手 去拿普通蘋果前，想想它們上面的化學物質和蠟會對 你健康造成的影響。用在蘋果樹上的殺蟲劑和化學肥 料可能會導致癌症或其他疾病。此外，當你購買非有 機的農產品時，你正在支持用有害化學物質汙染土地 與水源的企業。 為了幫助地球，在購買食物時你可以做更聰明的 選擇。例如，減少肉類。生產雞肉蛋白質耗費的能源 是生產相同份量大豆蛋白質的十四倍。藉由選擇少吃 肉，你將使用較少的能源且製造較少的垃圾。35 關於食物你有另一個該問的問題：它是從哪裡來 的？食物里程是食物生產地與消費者食用地點間的距 離。用來運送食物的卡車、飛機和船消耗燃料，產生 碳排放。食物必須運輸的距離越長，它對環境造成的 傷害就越大。 這個問題的解決辦法很簡單。你可以選擇吃在地種 植及生產的食物。這樣一來，碳排放會減少，而且你 藉由付錢給當地而非國外的農夫來支持你的社區。 最後，你得面對你的食物選擇會影響你和地球的這 個事實。可能的話，購買在地栽種的有機食物來盡一 份心力。對健康的地球和健康的身體來說，這只是一 個小小的代價。","questions":[{"id":1,"prompt":"Which of the following is NOT mentioned as a smart choice when buying food?","options":{"A":"Reduce the amount of meat consumption","B":"Learn where the food is produced","C":"Choose locally grown food","D":"Only buy food that is inexpensive"},"answer":"D"},{"id":2,"prompt":"What is the main idea of the article?","options":{"A":"How to find pesticide-free foods","B":"Making the right choices when buying food","C":"The differences between organic and nonorganic produce","D":"Helping the planet by cutting down on meat"},"answer":"B"}]},{"number":45,"title":"Waging a War on Food Waste","zhTitle":"向食物浪費宣戰","category":"Food","article":"字彙 Vocabulary 1. organic [7r`g1n6k] adj. 施用有機肥料的 （nonorganic [%n3n7r`g1n6k] 則指「非有機的； 無機的」） My brother grows his own organic fruit and vegetables. 2. wax [w1ks] n. 蠟 Wax from the candle is dripping onto the table and making a mess. 3. pollute [p4`lut] v. 汙染 Dirty water from that factory is running into the river and polluting it. 4. harmful [`h3rmf4l] adj. 有害的 This plant is harmful to cats if they eat it, so you shouldn’t keep it in the house. . protein [`pro%tin] n. 蛋白質（chicken protein 指「雞肉蛋白質」，soy protein 則指 「大豆蛋白質」） Beef and eggs contain a lot of protein. 6. transport [tr1ns`p7rt] v., n. 運送；運輸 （作名詞時要唸成 [`tr1ns%p7rt]） We’ve hired a big truck to transport the furniture to the new house. 7. fuel [`fju4l] n. 燃料 Jim drives a car that uses vegetable oil as fuel. - 參考字彙與說明  food for thought（提供思考的食物）引申指 「引人深思的事物」，而本文討論的是「食物」，故 此標題帶有雙重意含。  fertilizer [`f-t4%la6z0] n. 肥料  carbon emission [`k3rb4n] [i`m6]4n] 指 「碳排放」。carbon 為 carbon dioxide [da6`3k%sa6d]（二氧化碳）的簡稱，是溫室氣體 中占比最大的。 關鍵解析 Language Notes instead of 的用法 片語 instead of 之後接名詞或 V-ing，表示「而 不是……；代替……」，可放在句中或句首，放句首 時以逗號隔開。 S. + V. instead of N./V-ing = Instead of N./V-ing, S. + V. • Glenda wore contacts today instead of her glasses. = Instead of her glasses, Glenda wore contacts today. 葛蘭達今天戴隱形眼鏡而不是眼鏡。 • I’ll ride my bicycle to school instead of walking. = Instead of walking, I’ll ride my bicycle to school. 我會騎腳踏車上學，而不是走路。 our good intentions, as much as two billion tons of it ends up in the trash. 2Considering that nearly one billion people worldwide are either starving or hungry, this figure is shocking. What is perhaps more shocking is that every one of these mouths could be fed using less than a quarter of the food that is wasted in the United States and in Europe alone! How is so much food wasted each year? Some foods may be lost in production due to pests or poor transportation and storage practices. 3Damaged or imperfect-looking fruits and vegetables may be thrown out since most supermarkets won’t buy them. Of the items that do make it to the market, many will go bad while sitting on the shelf. 4Once bought and placed in the fridge at home, a certain amount of food will rot because of improper meal planning. Then, there is food that might get prepared but ends up being tossed away when our bellies are full. To help deal with the problem of food waste, a number of improvements need to be made. In developing countries, the problem lies mainly in production. 5By improving harvesting, processing, storage, and transportation methods, people can save millions of tons of food each year. 6In the developed world, the issue comes down to raising awareness. In the United States, for example, restaurants account for around percent of all food waste. Certain restaurants have begun offering smaller portions and are encouraging diners to take home their leftovers. In a world with limited land, water, and energy, we need to pay more attention to the issue of food waste. 7With our ever-increasing population, it’s time to stop wasting food and start taking action!","translation":"我們都知道絕不該浪費食物。然而，儘管我們是善 意的，還是有多達二十億噸的食物最後都被丟到垃圾 桶裡。 考量到世界各地有將近十億人不是餓死就是挨餓， 這個數字令人震驚。也許更令人震驚的是，單單只要 用不到四分之一在美國與歐洲浪費掉的食物，就可以 餵飽每一個挨餓的人！ 每年怎麼會浪費掉這麼多食物？有些食物因為病蟲 害或不當的運輸和保存方式，或許在生產過程就浪費 掉了。受損或賣相不佳的水果和蔬菜可能因為大部分 超市不會選購而被丟棄。 在確實送達市場的商品中，很多在架上時就壞掉 了。一旦被買回家放在冰箱，一部分的食物會因為不 當的料理規劃而腐壞。然後，有些食物也許煮了，最 後卻因為我們吃飽了而被扔掉。 為了協助處理食物浪費的問題，有許多改進措施需 要來執行。在開發中國家，問題主要在生產過程。藉 由改善收割、加工、儲存和運輸方式，人們每年可以 省下幾百萬噸的食物。 在已開發世界，這議題歸根究柢在於提升意識。舉 例來說，在美國，餐廳大約占了所有食物浪費的百分 之十五。某些餐廳已開始提供較小份量的餐點，並鼓 勵用餐者將吃剩的食物帶回家。 身處在一個土地、水和能源都有限的世界，我們需 要更加關注食物浪費這個議題。由於人口不斷增加， 該是停止浪費食物並開始採取行動的時候了！","questions":[{"id":1,"prompt":"Which of the following is NOT mentioned as a way to deal with the problem of food waste?","options":{"A":"Countries should improve harvesting and processing.","B":"People should eat out rather than eat in to avoid improper meal planning.","C":"Restaurants should serve smaller portions of food.","D":"We should pay more attention to the i
