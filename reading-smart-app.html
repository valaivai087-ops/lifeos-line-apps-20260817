ssue of food waste."},"answer":"B"},{"id":2,"prompt":"What is the main idea of the article?","options":{"A":"How to solve the problem of too much thrown-away food","B":"How to deal with damaged or imperfect-looking food","C":"How to improve transportation methods for delivering food","D":"How to feed the starving and hungry people of the world"},"answer":"A"}]},{"number":46,"title":"App Sticker Popularity","zhTitle":"貼圖風潮 全球引爆？","category":"Culture and Customs","article":"The craze for app stickers has taken over Asia, with Cony, Hello Kitty, and other characters gracing billions of mobile app messages each day. These digital stickers are also responsible for the popularity of Asian app giants like LINE, WeChat, and KakaoTalk. However, despite their popularity in Asia, app stickers have never really taken off in North America. Stickers are popular in Asia because they can be used as a visual shortcut. Typing Asian characters using smartphones designed with the Latin alphabet may be tiring. Stickers let users communicate quickly and efficiently without using strings of characters. With stickers, users can also express ideas indirectly, thus avoiding embarrassment or offending people. For example, to decline someone’s invitation to dinner, one could send a sticker to get that message across in a cute way, rather than saying “no” or “I can’t.” Cultural factors that have made digital stickers popular in Asia don’t exist in North America, though. To begin with, the styles of many of the stickers fit into Japan’s cute culture, which is popular in other Asian countries but is often considered childish by North Americans. Also, many English speakers don’t find writing text messages time-consuming. In fact, many common expressions are typed using abbreviations, such as TTYL for “talk to you later” and BTW for “by the way.” Lastly, North Americans are not as willing as Asians to spend money on buying stickers. So far, social messaging apps have focused on Asian tastes. To be profitable in North America, these companies should take culture into consideration to make stickers that will actually stick.","translation":"應用程式貼圖的風潮已經席捲亞洲，可妮兔（一般 多稱之為「兔兔」）、凱蒂貓和其他角色每天妝點了數 十億則手機應用程式的訊息。這些數位貼圖也讓 LINE、 WeChat（微信）、KakaoTalk 等亞洲應用程式的巨頭 大受歡迎。 然而，儘管應用程式貼圖在亞洲很受歡迎，但它們 在北美從未真正流行過。貼圖在亞洲受歡迎是因為它們 可用來作為一種視覺捷徑。用以拉丁文字母表設計的智 慧型手機來輸入亞洲文字可能很累。貼圖讓使用者無 需使用一連串的文字就能快速又有效率地溝通。有了貼 圖，使用者也可以間接表達想法，因而避免尷尬或冒犯 別人。比方說，要婉拒某人的晚餐邀約，你可以傳送一 張貼圖、用可愛的方式把訊息告訴對方，而不用說「不 要」或「不行」。 不過，那些讓數位貼圖在亞洲受歡迎的文化因素在北 美並不存在。首先，許多貼圖的風格都符合日本的可愛 文化，這種文化在亞洲其他國家很受青睞，但北美洲的 人通常會覺得幼稚。 再者，許多說英語的人可能不覺得寫文字訊息很 費時。事實上，許多常見的說法會用縮寫輸入，例如 TTYL 表示 talk to you later（晚點再聊），以及 BTW 表示 by the way（順便一提）。最後，北美洲人不像亞 洲人那樣願意花錢去買貼圖。 到目前為止，社交通訊應用程式一直著重在亞洲人 的喜好上。想要在北美獲利，這些公司應該考慮文化因 素，做出真正貼近人心的貼圖。","questions":[{"id":1,"prompt":"According to the writer, what is one reason that digital stickers might not be popular in North America?","options":{"A":"Most North Americans think the stickers are ugly.","B":"Most North Americans don’t get “texting thumb.”","C":"Most North Americans think “cute” culture is childish.","D":"Most North Americans use different kinds of messaging apps."},"answer":"C"},{"id":2,"prompt":"What can we infer from the article?","options":{"A":"The writer doesn’t think app stickers will be popular in North America because of cultural differences.","B":"With a strong marketing strategy, app stickers may become profitable in North America.","C":"The writer doesn’t know what will happen in the future, so he doesn’t comment on the usage of stickers in North America.","D":"App-sticker services may become popular in North America as long as companies can create stickers that fit into their culture."},"answer":"D"},{"id":3,"prompt":"From (A) to (F) below, choose the statements that are true based on the article.","options":{"A":"Most popular stickers in Asia are cute, and this is slowly being accepted by North Americans.","B":"Many English speakers think writing text messages takes time, so they often use abbreviations.","C":"LINE, WeChat, and KakaoTalk are three of the apps that commonly use stickers.","D":"Typing Asian characters is more difficult on smartphones designed with the Latin alphabet in mind. (E) Whether app giants like LINE will ever be successful in North America depends on the popularity of the app stickers. (F) Sending stickers can mean less embarrassment for English speakers."},"answer":"C"}]},{"number":47,"title":"A Journey to Osaka","zhTitle":"吃喝玩樂遊大阪","category":"Travel","article":"capitals, and this wisdom applies to Osaka. Second to Tokyo in size, Osaka is not lacking in places to see. The structure that best represents the city is Osaka Castle. Visible from far away because of its raised position and gold-decorated exterior, the castle rises 55 meters into the air. It is also a reminder of Osaka’s central role in unifying Japan during the Edo period. Surrounding the castle is a beautiful park with over 1,000 trees. Their leaves take on bright red, orange, and yellow shades in autumn. For modern architecture, the Umeda Sky Building can’t be beat. It is composed of two -story towers that are connected at the top by glass-enclosed escalators. Riding the escalators to get to the rooftop observatory is great fun if you’re unafraid of heights. Another kind of exciting ride is found at Universal Studios Japan theme park. The park is famous for its Wizarding World of Harry Potter, where you can fly through the sky on the Flight of the Hippogriff roller coaster and explore the inside of Hogwarts Castle. Osaka is known for its high-quality food, and one of the best places for eating traditional local dishes is Dotonbori Street. Many restaurants and street stalls selling pancake-like okonomiyaki and octopus-filled 218balls known as takoyaki can be found here. Other dishes that Osaka is famous for include thick-noodle soup with fried tofu and sushi pressed in a bamboo box. With interesting buildings, rides, and foods, Osaka invites visitors to explore its many qualities. It’s a city that moves to its own rhythm, and it never misses a beat.","translation":"經驗豐富的旅人都知道，最佳的造訪城市不一定是 首都，這種普遍看法也適用於大阪。大阪面積次於東 京，但不乏值得參觀的地方。 最能代表這座城市的建築是大阪城。大阪城高 五十五公尺、聳入天際，因地勢高加上黃金裝飾的外 觀，遠遠就看得見它。它也讓人想起大阪在江戶時期 一統日本時扮演的核心角色。環繞城堡的是一座美麗 的公園，裡面有超過一千棵樹。樹葉在秋天時呈現出 鮮紅、橙橘和黃色不同深淺的顏色。 關於現代建築風格，梅田藍天大廈無可匹敵。它由 兩座四十層樓的塔樓所組成，在塔頂以玻璃圍起的電 扶梯相連。如果你不怕高的話，搭電扶梯到頂樓觀景 台會很有趣。 另一種刺激的遊樂設施可在日本環球影城主題樂園 找到。該樂園以其「哈利波特的魔法世界」聞名，你 可以搭乘「鷹馬飛行」雲霄飛車飛越天際，還可以探 索霍格華茲城堡的內部。 大阪以高品質的美食著稱，而品嚐傳統道地佳餚其 中一個最棒的地方就是道頓堀。在這裡可以找到很多 販售像鬆餅的大阪燒和稱作章魚燒、塞滿章魚的丸子 的餐廳和街頭攤販。其他大阪有名的菜色還包括豆皮 烏龍麵和擠壓在竹盒裡的箱壽司。 擁有饒富趣味的建築、遊樂設施和美食的大阪邀請 遊客前來探訪它眾多的特色。這是一個依自己節奏律 動的城市，而且從不落拍。","questions":[{"id":1,"prompt":"What does “it never misses a beat” mean in the last paragraph?","options":{"A":"Osaka never stops being an amazing place.","B":"There is a lot of good music in Osaka.","C":"Osaka beats many other cities in Japan when it comes to entertainment.","D":"The qualities of Osaka can be compared to music."},"answer":"A"},{"id":2,"prompt":"Which of the following is NOT mentioned in the article?","options":{"A":"The rides in a theme park","B":"The convenience of the transportation in Osaka","C":"Some ancient and modern architecture","D":"Delicious Japanese dishes in Osaka"},"answer":"B"}]},{"number":48,"title":"Where Do Birds Go in Bad Weather?","zhTitle":"狂風暴雨時，鳥兒去哪裡了？","category":"Animals","article":"In stormy weather we can stay safely indoors. But for birds, rain can be a matter of life and death. So, how do birds survive bad weather? Rain poses two dangers to birds: heat loss and starvation. A bird’s feathers trap air to keep the bird warm. But if the air pockets fill with water, the bird’s body temperature can drop quickly, and it can die. Many birds waterproof their feathers by using oil stored at the base of their tails. This allows them to fly in the rain for short distances, though most find shelter until the rain stops. If the rain lasts for more than a few hours, birds will be left with no choice but to brave the weather in search of food. Small birds have an especially hard time in the rain. Their small bodies lose heat quickly, and the bugs they feed on stay out of sight. Since rain is dangerous for many birds, it’s not surprising that more extreme weather can be even more so. However, birds can tell when a storm is coming as they feel changes in air pressure. As a result, birds that migrate may leave earlier to avoid the storm, while others seek shelter and hang on for dear life. In colder climates, birds also have to deal with snowstorms and freezing temperatures. Thankfully, birds’ bodies are built to help them survive. Birds’ feet are always cold, so they air in their feathers to hold in warmth, and they prepare for winter by fattening up to help keep warm. As you can see, birds have a number of ways to handle bad weather. When storm clouds gather, your feathered friends will probably be just fine.","translation":"在暴風雨的天氣，我們可以安全地待在室內。但對 於鳥兒來說，下雨可能是生死攸關的事。那鳥兒是如 何挺過壞天氣的呢？ 雨對鳥類造成兩種危險：失溫和飢餓。鳥的羽毛會 存留空氣讓牠們保暖。但如果這些氣團充滿水的話， 鳥的體溫可能會驟降，牠可能會因此喪命。許多鳥類 藉由使用儲存在尾巴底部的油脂讓羽毛不會透水。這 使得牠們可以在雨中短途飛行，不過大多數的鳥尋找 遮蔽處，直到雨停為止。 如果雨持續下超過數小時，就會讓鳥類別無選擇， 只能勇敢地冒雨覓食。小型鳥在雨中尤其辛苦。牠們 小小的身軀會快速失溫，且牠們賴以為食的蟲也不見 蹤影。 由於雨對許多鳥類來說是危險的，更極端的天氣更 可能如此也就不令人意外了。然而，鳥類可以判斷風 暴何時來臨，因為牠們會感受到氣壓的變化。因此， 遷徙的鳥類可能會提早離開以避開風暴，而其他鳥類 則會尋找遮蔽處、竭盡全力地抓牢。 在較冷的氣候中，鳥類還得面對暴風雪及冰凍的溫 度。幸好，鳥類的身體構造幫助牠們生存。鳥的腳一 直都是冷的，所以牠們不會受到冰冷地面的影響。牠 們能將空氣存留在羽毛中來保暖，也可藉由增肥來保 暖為冬天做好準備。 如你所見，鳥類有許多種應對惡劣天氣的方法。當 風暴雲聚集，你那有羽毛的朋友或許會一切安好。","questions":[{"id":1,"prompt":"According to the passage, which of the following actions best fits what birds’ feathers do to air?","options":{"A":"Stop it from escaping","B":"Blow it away","C":"Cool it down","D":"Heat it up"},"answer":"A"},{"id":3,"prompt":"According to the article, what do most birds do during bad weather? Choose all that apply.","options":{"A":"Look for food","B":"Waterproof their feathers with oil stored at the base of their tails","C":"Wait in trees or find shelter until the rain stops","D":"Hide underground (E) Hang on for dear life (F) Change their diet"},"answer":"B"}]},{"number":49,"title":"Winter Fun in Budapest","zhTitle":"冬遊布達佩斯","category":"Travel","article":"{ Europeans are heading to Budapest, the capital of Hungary. During Christmas, exciting celebrations take place there. Beyond that, Budapest is a beautiful city that must be seen in one’s lifetime. December in Budapest is a time for Christmas markets, and the most famous one is in Vörösmarty Square. Walking along the dozens of wooden stalls selling traditional items, you’ll come across locally made Christmas-tree decorations, jewelry, and fur hats and slippers. Your appetite will be tickled by the scent of Hungarian foods sold at the market. Roasted meats, stuffed cabbage rolls, and lángosok are some local favorites. Wash it all down with warm cider, and for dessert, try some crispy, oven-baked chimney cake. At night, visitors can watch images of Santa and giant snowflakes dance across the surface of a white-marble building. This light show, along with puppet shows and live musical performances, makes the Christmas market in Budapest a memorable experience. Budapest’s City Park is another place to go for winter fun. It has a huge lake that is used for boating in the summer and ice-skating in the winter. Visitors can rent skates and enjoy the view of Vajdahunyad Castle as they glide across the ice. Besides skating, the park also offers one of the best and largest thermal baths in Europe. Széchenyi Spa Baths contain indoor baths and three big outdoor pools. Built in 1913, it shows the importance of baths in Hungarian culture. In fact, the first baths in Hungary were built over 2,000 years ago by the Romans. These highlights only scratch the surface of the richness of Budapest. It’s one of the most charming cities in Europe, and visitors there will surely be impressed.","translation":"許多歐洲人在決定要去哪裡尋找一些冬季假期的歡 樂時會前往匈牙利的首都布達佩斯。聖誕節期間，那 裡會舉辦有趣的慶祝活動。除此之外，布達佩斯是個 人一生一定要去看一次的美麗城市。 十二月的布達佩斯有聖誕市集，而最有名的市集就 在弗洛斯馬提廣場。當你沿著數十個用木頭架起、販 售傳統物品的攤位行走時，你會看到當地產的聖誕樹 飾品、珠寶、毛皮帽子和拖鞋。 市集裡販售的匈牙利食物的香味會勾起你的食欲。 烤肉、填餡的甘藍菜捲和起司炸麵糰是一些當地最受 歡迎的食物。搭配溫熱的蘋果汁一起食用，而至於甜 點，試試一些酥脆、用烤爐烤的煙囪蛋糕吧。 到了晚上，遊客可以觀賞聖誕老人和大片雪花的影 像在一幢白色大理石建築表面舞動。這場燈光秀加上 木偶戲和現場音樂表演，讓布達佩斯的聖誕市集成為 令人難忘的體驗。 布達佩斯的城市公園是另一個享受冬季樂趣的地 方。它有一座很大的湖，夏天用來划船，冬天則用來 溜冰。遊客可以租溜冰鞋，在冰上滑行時還可以欣賞 維達杭亞城堡的景觀。 除了溜冰之外，這座公園還有歐洲其中一座最棒也 是最大的溫泉浴池。賽切尼水療浴場有十五個室內浴 池和三個大型戶外池。它建於西元一九一三年，展現 出浴池在匈牙利文化中的重要性。事實上，匈牙利最 早的浴池是羅馬人在兩千多年前所建造的。 這些精彩的景點只觸及了布達佩斯豐富內涵的表面 而已。它是歐洲最迷人的城市之一，到那裡的遊客肯 定會留下深刻的印象。37","questions":[{"id":1,"prompt":"What is the main idea of the article?","options":{"A":"The many foods you can find in winter in Budapest","B":"The fun you can have at Budapest’s City Park in winter","C":"The different ways to celebrate Christmas in Budapest","D":"What Budapest is like in winter"},"answer":"D"},{"id":2,"prompt":"What does the word “highlights” in the last paragraph refer to?","options":{"A":"The parts of Budapest that are mentioned in the article","B":"The lights in the Christmas markets","C":"The high castle that you can see while ice-skating","D":"The largest thermal baths in Europe"},"answer":"A"}]},{"number":50,"title":"Some Facts about the English Alphabet","zhTitle":"趣談英文字母的歷史","category":"Origins","article":"The English alphabet was created over a thousand years ago, and it has changed a lot over the centuries. It grew out of the Roman alphabet, which itself came from the Greek. In fact, the word “alphabet” is made up of the first two letters of the Greek alphabet: “alpha” and “beta.” Here are a few other examples that demonstrate the ancient and mixed origins of the English alphabet: The letter w is the only letter in English whose name—double u— has more than one syllable. It was first written as uu, or two u’s side by side. In the 11th century, these two letters came to be united and given sharper angles at the bottom to form the modern w. The letter x started life in the alphabet of the Phoenicians, an ancient people of Western Asia. Later, it was acquired by the Greeks and used as the first letter of the Greek word for “Christ.” This is why many people write “Xmas” for “Christmas.” The letter q did not exist in English until the Normans invaded England in 1066, bringing with them the ancient dialect of northern France. One of their many contributions to the English language was the q-u letter combination, which replaced the English c-w. Before that, the word “queen” had been spelled “c-w-i-n” in English. Historically, there have been efforts to change the English alphabet. In 1768, Benjamin Franklin invented an alphabet to set Americans apart from the British. He dropped the letters c, j, q, w, x, and y and added","translation":"英文字母表是一千多年前創造出來的，幾個世紀 以來已有很大的改變。它從羅馬字母表發展而來， 羅馬字母表本身又源自希臘。事實上，「字母表」 （alphabet）這個單詞是由希臘字母表頭兩個字母 alpha 及 beta 所組成。這裡有一些其他的例子顯示英 文字母表古老且多元的起源： 字母 w 是英文中唯一一個字母名稱（兩個 u）超過 一個音節的。它原本是寫作 uu，或者是說兩個 u 並 排。十一世紀時，這兩個字母合在一起、底部角度變 更尖而形成現在的 w。 字母 x 在西亞一支古老民族腓尼基人的字母表中就 存在了。之後，希臘人取得這個字母並以此作為希臘 單字「基督」（Christ）的第一個字母。這就是許多人會 把 Christmas（聖誕節）寫作 Xmas 的原因。 字母 q 一直到一○六六年諾曼人入侵英國才存在英 文中，他們同時帶來了北法的古老方言。他們對英文 的眾多貢獻中之一是字母 q-u 的組合，用來取代了英 文的 c-w。在那之前，queen（皇后）這個字在英文 中是拼作 c-w-i-n。 歷史上一直有人努力要改變英文字母表。一七六八 年，班傑明．富蘭克林發明了一套字母表來區別美國 英語和英國英語。他捨棄字母 c、j、q、w、x 和 y， 增加了一些新的字母。富蘭克林認為他的字母表容易 學習，但它從未流行起來，最後就被遺忘了。 現今大約有一百種語言使用英文字母表中的字母， 使它成為世界上最廣泛使用的字母表之一。在這麼普 及的情況下，看來英文字母表短期內不太可能經歷什 麼劇烈的改變。","questions":[{"id":1,"prompt":"Which of the following words includes a contribution from the Normans?","options":{"A":"Christmas","B":"Quarter","C":"Alpha","D":"Cwin"},"answer":"B"},{"id":2,"prompt":"What does the last paragraph imply?","options":{"A":"The English alphabet will continuously change because it’s used in a lot of languages.","B":"English is the most widely spoken language in the world because of its popularity.","C":"There won’t be great changes in the English alphabet for a while.","D":"The English alphabet will be more popular in the future."},"answer":"C"}]},{"number":51,"title":"Life of a Plasticarian","zhTitle":"一起來當不「塑」之客吧！","category":"Life and Education","article":"at home, the desks we use at work, and the pens we write with at school. It’s even wrapped around the food we buy. 1Some people have had enough of plastic, though, and have chosen a new lifestyle. These people have become plasticarians, meaning they try to live life without purchasing or using plastic. British student Thomas Smith decided to go plastic-free, telling reporters, “A bit of plastic you had for a second lasts longer than your lifetime.” 2Smith tried to avoid buying anything that had plastic in it, which made getting even the simplest items, like toilet paper, difficult. Over a period of six months, he lost five kilograms in weight and eventually gave up. Beth Terry, a woman in California, has lived mostly plastic-free for more than six years. 3For Beth, choosing a plasticarian lifestyle came out of concern for the planet and her health. Studies have linked some kinds of plastic to cancer and heart disease, and chemicals in these plastics can interfere with a baby’s development. 4That’s why some doctors say it is important that pregnant women avoid eating food stored in plastic containers. 5It’s never too late to start reducing the amount of plastic. You can start by giving up bottled water and teas. Instead, buy a reusable stainless-steel bottle and bring drinks from home. 6You can also buy food from farmers’ markets, where fresh produce and meat are not packaged in plastic. 7Finally, it’s better to use soap and shampoo Life and Education TRACK 59 圖片 / Stephen Loewinsohn, stephenloewinsohn.com 230bars that are wrapped in paper than liquid soaps and shampoos that come in plastic bottles. While cutting plastic out of your life all at once may be too much to manage, every journey begins with one step. Choose one plastic item to live without today, and you will be on your way to a healthier life and a cleaner planet.","translation":"塑膠就在我們周遭。它在家裡我們看的電視、工作所 使用的桌子和學校用來書寫的筆當中。它甚至包著我們 購買的食物。不過，有些人已經受夠了塑膠，並且選擇 一種新的生活方式。這些人成了不「塑」之客，意指他 們嘗試過著不購買或不使用塑膠製品的生活。 英國學生湯瑪斯‧史密斯決定過不用塑膠製品的生 活，他告訴記者：「你用一下的那小塊塑膠製品會比 你的生命還要長久。」史密斯試著避免購買任何含有 塑膠的東西，這使得連買衛生紙這類最簡單的東西都 變得困難。在六個月期間，他體重掉了五公斤，最後 放棄了。 一名加州女子貝絲．泰瑞已經過著大半沒有塑膠製 品的日子逾六年了。對貝絲來說，選擇不「塑」之客 的生活方式是來自於對地球和健康的關心。研究發現 某些種類的塑膠和癌症與心臟疾病有關，而且這些塑 膠製品裡的化學物質也會妨礙嬰兒的發育。那就是有 些醫師會說孕婦要避免食用裝在塑膠容器的食物是很 重要的的原因。 開始減少塑膠用量永遠都不嫌晚。你可以從不再 喝瓶裝水和茶飲做起。反之，買一個可重複使用的不 鏽鋼瓶，並從家裡帶飲料吧。你也可以從農夫市集購 買食物，那裡的新鮮農產品和肉類不用塑膠包裝。最 後，最好用紙包裝的肥皂塊和洗髮皂而不用裝在塑膠 瓶裡的液體肥皂和洗髮精。 雖然一次完全排除生活中的塑膠製品可能會令人難 以招架，不過每趟旅程都是一步一步開始。今天就選 擇不用某一樣塑膠製品，你就能朝向一個更健康的生 活以及更乾淨的地球邁進。","questions":[{"id":1,"prompt":"What is the article mainly about?","options":{"A":"A woman in California who lives plastic-free","B":"Examples of, and advice for, living plastic-free","C":"How to completely cut plastic out of your life","D":"How to lose weight by avoiding plastic"},"answer":"B"},{"id":2,"prompt":"What does the last paragraph imply?","options":{"A":"You should cut out all plastic immediately; otherwise, it will be too late.","B":"Since it’s too difficult to live without plastic, we should just learn to live with it.","C":"Don’t try to cut out all plastic at once. Do it gradually.","D":"Most people give up easily when they try to cut out too much plastic from their life."},"answer":"C"}]},{"number":52,"title":"Delivery without Drivers","zhTitle":"未來物流趨勢：無人貨運服務","category":"Science and Technology","article":"Boxes of groceries speed past you on the sidewalk, and in the sky, delivery drones buzz around like insects on a summer’s day. It sounds like a scene from a science-fiction story, but thanks to COVID-19, it could soon be a reality. 2During the pandemic, the need to minimize human contact caused many companies to try out driverless deliveries. While a small number of such services were trialed in the United States before the pandemic, new trials have popped up all over the world. In Delhi, India, for example, a “last-mile” driverless delivery system has been tested. A delivery person stops at the end of a street and a robot then takes the package to the customer’s house. 3Companies such as Amazon and Google have also been granted permission to develop flying delivery services. In fact, Wing, which is owned by Google’s parent company, has already successfully tested food-deliveries in Australia, Finland, and the US state of Virginia. 4 Driverless delivery promises many benefits to customers and businesses alike. Drones can easily fly over traffic and buildings, thus achieving faster delivery times. They can also reach places where poor roads make delivery by truck impossible. 5There are, however, still many problems to solve before this supercovenient future becomes a reality. Science and Technology TRACK 60 圖片 / Wing.com out of action. There is also the increased possibility of damage or theft. And while delivery robots work well in quiet residential areas during a lockdown, they would probably fare less well on crowded city streets. As a result, special routes would likely have to be put in place, resulting in some major changes to our cities. 7Driverless delivery proved useful during the pandemic. The question is: Can this system thrive in a post-pandemic world?","translation":"裝滿食品雜貨的箱子在人行道上快速經過你身旁， 而在天空中，送貨無人機像夏天的昆蟲一樣來回嗡嗡 作響。這聽起來像是科幻故事裡的一個場景，但由於 新冠肺炎，它可能很快就會成真了。 在疫情期間，盡量減少人際接觸的需求促使許多 公司嘗試無人駕駛運送。而儘管在疫情之前已有少數 這類的服務在美國進行試驗，世界各地到處都在進行 新的試驗。例如在印度德里，已經測試了「最後一哩 路」無人送貨系統。送貨員會停在街道盡頭，然後機 器人就把包裹送到顧客家裡。 亞馬遜和谷歌之類的公司都已得獲准發展飛行送貨 服務。事實上，Wing（為谷歌的母公司所有）已在澳 洲、芬蘭及美國維吉尼亞州成功完成食品運送測試。38 無人送貨承諾對顧客和商家都有很多好處。無人機 可以輕鬆飛過車陣和建築物，因而達到更快的送貨時 間。它們也可以到達路況差而貨車無法抵達的地方。 然而，在這個超級便利的未來能夠實現之前還有很多 可能的問題要解決。 突然有暴風雨來襲或風向改變可能會迫使無人機 無法正常運作。貨物受損或遭竊的可能性也會增加。 而儘管貨運機器人在封城期間安靜的住宅區裡運作順 利，在擁擠的城市街道上可能就不會進行得那麼順 利。因此，可能需要施行無人貨運機器人用的特別路 線，這表示我們的城市要有一些重大改變。 無人貨運在疫情期間證明有其用處。問題是：這套 系統在後疫情的世界能夠蓬勃發展嗎？","questions":[{"id":2,"prompt":"Why does the author think that driverless deliveries will result in changes to our cities?","options":{"A":"Because people will be too afraid to share the sidewalk with robots","B":"Because delivery robots will need more space to travel on our busy streets","C":"Because everything will be delivered to the door, so no one will need to go out","D":"Because trucks and truck drivers will no longer be necessary 3 Some sentences in the article have been numbered to 7. Choose the sentence that best indicates the author’s attitude toward a future involving drone delivery and write down the number of the sentence. _______________ 25 30"},"answer":"B"}]}],KEY='reading-smart-reading-v1';let state=JSON.parse(localStorage.getItem(KEY)||'{"answers":{},"xp":0,"days":[]}'),unit=null,cat='全部';const app=document.querySelector('#app'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toISOString().slice(0,10);
function save(){localStorage.setItem(KEY,JSON.stringify(state));stats()}function stats(){xp.textContent='✨ '+state.xp+' XP';lv.textContent='Lv.'+(1+Math.floor(state.xp/150));let a=[...new Set(state.days)].sort().reverse(),n=0,d=new Date;for(const x of a){if(x===d.toISOString().slice(0,10)){n++;d.setDate(d.getDate()-1)}else break}streak.textContent='🔥 '+n+' 天'}

function annotateSentence(sentence){let t=sentence.match(/[A-Za-z]+(?:[’'][A-Za-z]+)*|\d+(?:\.\d+)?|[^\sA-Za-z\d]/g)||[],w=t.map(x=>x.toLowerCase()),roles=t.map(()=>null);let comma=t.indexOf(','),lead=/^(in|on|at|during|after|before|with|without|by|for|from|to|as|because|although|when|while|if|since|however|therefore|moreover|instead|finally|today|sometimes|usually|often)$/;if(lead.test(w[0]||'')){let e=comma>=0?comma:Math.min(t.length-1,2);for(let i=0;i<=e;i++)roles[i]=i===0&&/^(because|although|when|while|if|since|as)$/.test(w[i])?'CONJ':'M'}let verbs=new Set(('am is are was were be been being have has had do does did can could will would shall should may might must become became seem seems feel feels look looks make makes made give gives gave take takes took get gets got grow grows grew keep keeps kept know knows knew say says said see sees saw find finds found think thinks thought tell tells told show shows let puts go goes went come comes came turn turns turned cause causes use uses need needs help helps play plays live lives mean means happen happens protect protects raise raises lay lays hatch hatches stay stays offer offers want wants learn learns watch watches contain contains affect affects claim claims feed feeds end ends').split(' '));let vi=-1;for(let i=0;i<t.length;i++){if(roles[i]||!/[a-z]/i.test(t[i]))continue;if(verbs.has(w[i])||/(ed|ing|en)$/.test(w[i])){vi=i;break}}if(vi<0)vi=Math.min(t.length-1,1);for(let i=0;i<vi;i++)if(!roles[i]&&/[A-Za-z]/.test(t[i]))roles[i]='S';for(let i=vi;i<t.length&&i<=vi+1;i++)if(!roles[i]&&(i===vi||/^(not|be|been|being|have|has|had)$/.test(w[i])))roles[i]='V';let link=/^(am|is|are|was|were|be|been|being|become|became|seem|seems|feel|feels|look|looks)$/;for(let i=vi+1;i<t.length;i++)if(!roles[i]&&/[A-Za-z]/.test(t[i]))roles[i]=link.test(w[vi])?'C':'O';for(let i=vi+3;i<t.length;i++)if(/^(in|on|at|during|after|before|with|without|by|for|from|to|under|over|through|around|among|into|onto)$/.test(w[i])){for(let j=i;j<t.length&&t[j]!==',';j++)roles[j]='M';break}for(let i=0;i<t.length;i++)if(/^(and|but|or|so|because|although|if|when|while|since|however|therefore|moreover)$/.test(w[i]))roles[i]='CONJ';for(let i=0;i<t.length;i++)if(/^(who|whom|whose|which|where)$/.test(w[i]))for(let j=i;j<t.length&&t[j]!==','&&t[j]!==';';j++)roles[j]='REL';for(let i=0;i<t.length;i++)if(!roles[i])roles[i]=i?roles[i-1]:'M';let out='',start=0;for(let i=1;i<=t.length;i++)if(i===t.length||roles[i]!==roles[start]){let x=t.slice(start,i).join(' ').replace(/\s+([,.;:!?])/g,'$1');out+='<span class="syn s-'+roles[start]+'" data-role="'+roles[start]+'">'+esc(x)+'</span> ';start=i}return out.trim()}
function splitEn(t){return t.match(/[^.!?]+[.!?]+(?:[”"])?|[^.!?]+$/g)||[t]}function splitZh(t){return t.match(/[^。！？]+[。！？]?/g)?.map(x=>x.trim()).filter(Boolean)||[]}
function renderSyntax(u){let es=splitEn(u.article),zs=splitZh(u.translation);return syntaxLegend()+es.map((s,i)=>{let a=Math.floor(i*zs.length/es.length),b=Math.floor((i+1)*zs.length/es.length),z=zs.slice(a,Math.max(a+1,b)).join('');if(!z)z=zs[Math.min(a,zs.length-1)]||'（本句中文翻譯整理中）';return '<div class="sentence" data-sentence="'+(i+1)+'"><button onclick="speakSentence('+i+',this)" aria-label="朗讀第 '+(i+1)+' 句" style="float:right;margin:0 0 6px 10px;border:0;border-radius:9px;background:#eef2fb;padding:7px 10px;cursor:pointer">🔊 第 '+(i+1)+' 句</button><span class="sentence-en">'+annotateSentence(s.trim())+'</span><span class="sentence-zh">'+esc(z)+'</span></div>'}).join('')}
function qGuide(prompt){let p=prompt.toLowerCase();if(/main idea|mainly|main topic|purpose|best title/.test(p))return['主旨題','找首段／尾段與重複詞；答案要概括，排除太窄的細節。'];if(/infer|suggest|imply|conclude|most likely/.test(p))return['推理題','結論必須有文本依據；選同義推論，排除過度延伸。'];if(/mean|refer to|closest in meaning|word/.test(p))return['猜詞／指代','回到上下文，用前後邏輯判斷；常見字義不一定是本題答案。'];if(/attitude|tone|feeling|view/.test(p))return['態度題','看全文語氣與轉折後立場，判斷正向、中立或負向。'];return['細節題','定位題目關鍵字，找同義替換；排除相反、半對半錯、絕對化與未提及。']}
function strategyPanel(){return '<details class="strategy-panel" open><summary>🔥 閱讀理解蒙題技巧（核心）</summary><div class="strategy-body"><div class="strategy-grid"><div class="strategy-box"><h4>基本規則</h4><table class="rule-table"><tr><td><b>原文照抄</b></td><td>通常不是答案；同義替換較可能是正解</td></tr><tr><td><b>絕對詞</b></td><td>must / always 等優先排除</td></tr><tr><td><b>模糊語氣</b></td><td>may / might 較可能正確</td></tr><tr><td><b>長短分布</b></td><td>觀察選項長度規律</td></tr><tr><td><b>抽象 ＞ 具體</b></td><td>主旨題優先概括選項</td></tr></table></div><div class="strategy-box"><h4>三類干擾項</h4><b>細節題：</b>相反、半對半錯、過度絕對、原文未提<br><b>主旨題：</b>太籠統、太狹窄、不相關<br><b>推理題：</b>無文本依據、推論過度</div><div class="strategy-box"><h4>五大題型</h4><ol><li>主旨：首尾句、重複詞、概括答案</li><li>細節：回原文定位、看轉折與因果</li><li>推理：源於原文，不可無中生有</li><li>猜詞：依上下文與指代關係</li><li>態度：看全文與語氣詞</li></ol></div><div class="strategy-box"><h4>12 條決策規則</h4><ol><li>同義替換優先</li><li>題序通常對應文序</li><li>兩極對立常一對一錯</li><li>舉例不等於主旨</li><li>引號句是重點</li><li>長難句常是出題點</li><li>首句常承擔主旨</li><li>轉折後看作者態度</li><li>拼湊選項排除</li><li>過度具體排除</li><li>主旨大於細節</li><li>排除兩項後選最符合主旨者</li></ol></div><div class="strategy-box"><h4>閱讀理解母體系統</h4><b>語意層：</b>主旨、細節、推論、詞義、態度<br><b>結構層：</b>首尾句、邏輯、關鍵句、題序<br><b>決策層：</b>同義替換、干擾排除、最優選擇<br><br><b>能力 = 語意壓縮 × 結構辨識 × 干擾排除</b></div><div class="strategy-box"><h4>固定 6 步流程</h4><ol><li>看標題，建立預測</li><li>看第一段，建立主題</li><li>一句話概括每段功能</li><li>畫出文章結構</li><li>找作者立場</li><li>最後做題目</li></ol></div><div class="strategy-box"><h4>八種文章模型</h4>問題→解決｜原因→結果｜比較→對比｜時間→發展｜分類→說明｜觀點→證據｜研究→結論｜現象→解釋</div><div class="strategy-box"><h4>長句拆解 6 步</h4>抓主幹 → 標 S/V/O/C/M → 分辨子句 → 畫句型樹 → 累積標準句型 → 分層視覺化</div><div class="strategy-box"><h4>提升方法</h4>碎片學習、背單字、朗讀、逐句翻譯、做真題。錯題要分類並更新判斷規則。</div><div class="strategy-box"><h4>作文提升</h4>字跡清晰、字數符合要求、開頭結尾有吸引力、合理運用模板。</div></div><p><b>核心：</b>蒙題不是亂猜，而是用語意＋邏輯＋結構＋分布壓縮選項空間，做最小誤差決策。</p></div></details>'}
function enhanceUnit(){let p=document.querySelector('.passage-text'),h=document.querySelector('.passage h3');if(!p||!unit)return;p.innerHTML=renderSyntax(unit);if(h)h.textContent='Reading Passage · 彩色句構＋逐句翻譯';let passage=document.querySelector('.passage');passage.insertAdjacentHTML('afterend',strategyPanel());unit.questions.forEach(q=>{let card=document.querySelector('#q'+q.id),ans=card&&card.querySelector('.answers');if(ans){let g=qGuide(q.prompt);ans.insertAdjacentHTML('beforebegin','<div class="q-strategy"><span class="q-type">'+g[0]+'</span>'+g[1]+'</div>')}})}
document.addEventListener('click',e=>{if(e.target.closest('.card'))setTimeout(enhanceUnit,0)});
function home(){unit=null;let cs=['全部',...new Set(UNITS.map(u=>u.category))],us=cat==='全部'?UNITS:UNITS.filter(u=>u.category===cat);app.innerHTML='<section class="hero"><div><div class="eyebrow" style="color:#dce3ff">READ · THINK · MASTER</div><h1>讀懂文章，也讀懂考點</h1><p>52 篇主題閱讀 · 中文輔助 · 逐題理解診斷</p></div><div class="hero-icon">📖</div></section><div class="head"><div><h2>閱讀測驗</h2><p>依照原教材 Section 2 編排</p></div><b>'+UNITS.reduce((n,u)=>n+u.questions.length,0)+' 題</b></div><div class="filters">'+cs.map(c=>'<button class="filter '+(c===cat?'active':'')+'" onclick="setCat(\''+c.replace(/'/g,"\\'")+'\')">'+esc(c)+'</button>').join('')+'</div><div class="grid">'+us.map(u=>{let p=prog(u);return '<article class="card" onclick="openUnit('+u.number+')"><span class="eyebrow">'+String(u.number).padStart(2,'0')+' · '+esc(u.category)+'</span><h3>'+esc(u.title)+'</h3><div class="muted">'+esc(u.zhTitle)+' · '+u.questions.length+' 題</div><div class="bar"><i style="width:'+p.p+'%"></i></div></article>'}).join('')+'</div>'}
function setCat(c){cat=c;home()}function openUnit(n){unit=UNITS.find(u=>u.number===n);app.innerHTML='<div class="reader-head"><button class="back" onclick="home()">‹ 返回閱讀列表</button><div><h2>'+esc(unit.title)+'</h2><p>'+String(n).padStart(2,'0')+' · '+esc(unit.category)+' · '+esc(unit.zhTitle)+'</p></div></div><article class="passage"><h3>Reading Passage</h3><div class="passage-text">'+esc(unit.article)+'</div><div class="passage-tools"><button class="tool" onclick="speak()">🔊 全文朗讀</button><button class="tool" onclick="toggleZh()">中 中文翻譯</button><button class="tool" onclick="readingTip()">🌳 閱讀策略</button></div><div class="translation" id="zh">'+esc(unit.translation)+'</div></article><div class="head"><div><h2>Integrated Questions</h2><p>先回文章找證據，再選答案</p></div></div>'+unit.questions.map(q=>'<article class="question" id="q'+q.id+'"><div class="qtop"><span class="qnum">第 '+q.id+' 題</span><button class="tool" onclick="speakQ('+q.id+')">🔊</button></div><p class="prompt">'+esc(q.prompt)+'</p><div class="answers">'+Object.entries(q.options).map(([k,v])=>'<button class="choice" data-q="'+q.id+'" data-a="'+k+'" onclick="choose('+q.id+',\''+k+'\')"><b>'+k+'</b>　'+esc(v)+'</button>').join('')+'</div><div class="feedback" id="f'+q.id+'"></div></article>').join('')+'<div class="actions"><button class="ghost" onclick="resetUnit()">重新作答</button><button class="primary" onclick="grade()">完成並計分</button></div>';restore();scrollTo(0,0)}
function choose(q,a){state.answers[unit.number+'-'+q]=a;state.days.push(today());save();document.querySelectorAll('[data-q="'+q+'"]').forEach(e=>e.classList.toggle('chosen',e.dataset.a===a))}function restore(){unit.questions.forEach(q=>{let a=state.answers[unit.number+'-'+q.id],e=document.querySelector('[data-q="'+q.id+'"][data-a="'+a+'"]');if(e)e.classList.add('chosen')})}
function grade(){let c=0,g=0;unit.questions.forEach(q=>{let a=state.answers[unit.number+'-'+q.id];document.querySelectorAll('[data-q="'+q.id+'"]').forEach(e=>{e.classList.remove('correct','wrong');if(e.dataset.a===q.answer)e.classList.add('correct');if(a===e.dataset.a&&a!==q.answer)e.classList.add('wrong')});let f=document.querySelector('#f'+q.id);f.classList.add('show');if(a===q.answer){c++;f.innerHTML='✅ 答對了！答案是 <b>'+q.answer+'</b>。';if(!state.answers['_s'+unit.number+'-'+q.id]){g+=15;state.answers['_s'+unit.number+'-'+q.id]=1}}else f.innerHTML='答案是 <b>'+q.answer+'. '+esc(q.options[q.answer])+'</b>。回到文章找出支持這個答案的句子。'});state.xp+=g;save();toast.textContent='本篇 '+c+'/'+unit.questions.length+' 題正確'+(g?'，獲得 '+g+' XP':'');toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)}
function evidenceFor(q){let ss=splitEn(unit.article),zs=splitZh(unit.translation),stop=new Set('what which who where when why how does did is are was were the a an of to in on for and or not following according article passage writer'.split(' ')),terms=(q.prompt+' '+q.options[q.answer]).toLowerCase().match(/[a-z]{3,}/g)?.filter(x=>!stop.has(x))||[];let best=0,score=-1;ss.forEach((s,i)=>{let low=s.toLowerCase(),v=terms.reduce((n,x)=>n+(low.includes(x)?1:0),0);if(v>score){score=v;best=i}});let a=Math.floor(best*zs.length/ss.length),b=Math.floor((best+1)*zs.length/ss.length),zh=zs.slice(a,Math.max(a+1,b)).join('')||zs[Math.min(a,zs.length-1)]||'';return{en:ss[best]?.trim()||'',zh}}
function optionReason(k,text,q){if(k===q.answer)return '符合原文證據，通常以同義替換或概括方式呈現。';let low=text.toLowerCase();if(/\b(always|never|must|all|only|completely|every)\b/.test(low))return '含有過度絕對的語氣，原文沒有支持這麼強的結論。';let words=low.match(/[a-z]{4,}/g)||[],hits=words.filter(w=>unit.article.toLowerCase().includes(w)).length;if(hits>=Math.max(2,words.length*.65))return '雖使用原文字詞，但語意關係可能被拼湊、顛倒或只對一半。';return '缺少足夠文本依據，或與題目要求的範圍不一致。'}
function explanationHtml(q){let g=qGuide(q.prompt),ev=evidenceFor(q);return '<div style="font-size:15px;line-height:1.75"><div style="font-size:17px;color:var(--ink);margin-bottom:8px"><b>✅ 正確答案：'+q.answer+'. '+esc(q.options[q.answer])+'</b></div><div><b>題型：</b>'+g[0]+'</div><div><b>解題方法：</b>'+g[1]+'</div><div style="margin-top:10px;padding:11px;background:#fff;border-left:4px solid var(--blue);border-radius:8px"><b>📍 原文證據</b><br>'+esc(ev.en)+(ev.zh?'<br><span style="color:#665987">'+esc(ev.zh)+'</span>':'')+'</div><div style="margin-top:10px"><b>選項解析</b>'+Object.entries(q.options).map(([k,v])=>'<div style="margin-top:5px"><b>'+k+'.</b> '+esc(v)+'<br><span style="color:'+(k===q.answer?'var(--good)':'var(--muted)')+'">'+optionReason(k,v,q)+'</span></div>').join('')+'</div></div>'}
function revealAnswer(id){let q=unit.questions.find(x=>x.id===id),f=document.querySelector('#f'+id);if(!q||!f)return;document.querySelectorAll('[data-q="'+id+'"]').forEach(e=>{e.classList.remove('correct','wrong');if(e.dataset.a===q.answer)e.classList.add('correct')});f.innerHTML=explanationHtml(q);f.classList.add('show')}

function resetUnit(){unit.questions.forEach(q=>delete state.answers[unit.number+'-'+q.id]);save();openUnit(unit.number)}function toggleZh(){let zs=[...document.querySelectorAll('.sentence-zh')],show=zs.some(e=>e.style.display==='none'||getComputedStyle(e).display==='none');zs.forEach(e=>e.style.display=show?'block':'none');let b=[...document.querySelectorAll('.passage-tools .tool')].find(x=>x.textContent.includes('中文翻譯')||x.textContent.includes('收起翻譯'));if(b)b.textContent=show?'中 收起翻譯':'中 中文翻譯'}function say(t,button){speechSynthesis.cancel();document.querySelectorAll('[data-speaking]').forEach(x=>{x.removeAttribute('data-speaking');x.style.background='#eef2fb'});let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.86;if(button){button.dataset.speaking='1';button.style.background='#dceaff';u.onend=()=>{button.removeAttribute('data-speaking');button.style.background='#eef2fb'}}speechSynthesis.speak(u)}function speakSentence(i,button){let s=splitEn(unit.article)[i];if(s)say(s.trim(),button)}function speak(){speechSynthesis.cancel();document.querySelectorAll('[data-speaking]').forEach(x=>{x.removeAttribute('data-speaking');x.style.background='#eef2fb'})}function speakQ(id){say(unit.questions.find(q=>q.id===id).prompt)}function readingTip(){let panel=document.querySelector('.strategy-panel');if(panel){panel.open=true;panel.scrollIntoView({behavior:'smooth',block:'start'})}}

function progress(){let total=UNITS.reduce((n,u)=>n+u.questions.length,0),done=UNITS.reduce((n,u)=>n+prog(u).d,0),correct=UNITS.flatMap(u=>u.questions.map(q=>state.answers[u.number+'-'+q.id]===q.answer)).filter(Boolean).length;app.innerHTML='<div class="head"><div><h2>我的閱讀進度</h2><p>紀錄保存在目前裝置</p></div></div><div class="dashboard"><div class="dash"><span class="muted">完成文章</span><b>'+UNITS.filter(u=>prog(u).p===100).length+'</b><span>/ 52 篇</span></div><div class="dash"><span class="muted">已作答</span><b>'+done+'</b><span>/ '+total+' 題</span></div><div class="dash"><span class="muted">目前答對</span><b>'+Math.round(correct/Math.max(1,done)*100)+'%</b><span>'+state.xp+' XP</span></div></div><div class="head"><h2>各篇進度</h2></div><div class="grid">'+UNITS.map(u=>{let p=prog(u);return '<article class="card" onclick="openUnit('+u.number+')"><span class="eyebrow">'+String(u.number).padStart(2,'0')+'</span><h3>'+esc(u.title)+'</h3><div class="muted">'+p.d+'/'+p.t+' 題</div><div class="bar"><i style="width:'+p.p+'%"></i></div></article>'}).join('')+'</div>'}
