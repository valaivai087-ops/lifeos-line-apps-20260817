<style>:root{--ink:#183153;--muted:#687690;--blue:#3d68e8;--violet:#7256e7;--mint:#159b77;--bg:#f4f7fb;--card:#fff;--line:#e3e8f2;--bad:#df4962;--good:#128865}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans TC","Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:5;background:#ffffffed;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.nav{max-width:1180px;margin:auto;min-height:70px;display:flex;align-items:center;gap:16px;padding:10px 20px}.brand{font-size:20px;font-weight:900;margin-right:auto}.brand em{font-style:normal;color:var(--blue)}button{font:inherit}.tab,.pill,.tool,.choice,.primary,.ghost,.back{border:0;cursor:pointer}.tab{background:none;color:var(--muted);font-weight:800;padding:10px}.tab.active{color:var(--blue)}.stats{display:flex;gap:7px}.pill{background:#eef2ff;border-radius:99px;padding:8px 11px;font-weight:800}.wrap{max-width:1180px;margin:auto;padding:26px 20px 80px}.hero{background:linear-gradient(120deg,#315cd5,#7657df);color:white;border-radius:24px;padding:30px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 18px 45px #4e62ac2b}.hero h1{font-size:clamp(28px,4vw,46px);margin:5px 0}.hero p{margin:0;opacity:.87}.hero-icon{font-size:58px;background:#ffffff1f;border-radius:26px;padding:23px}.head{display:flex;justify-content:space-between;align-items:end;margin:32px 2px 15px}.head h2{margin:0}.head p{color:var(--muted);margin:5px 0 0}.filters{display:flex;gap:8px;overflow:auto;padding:2px 0 14px}.filter{white-space:nowrap;border:1px solid var(--line);border-radius:99px;background:#fff;padding:8px 12px;cursor:pointer}.filter.active{background:var(--ink);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;transition:.18s;box-shadow:0 5px 18px #1b315009}.card:hover{transform:translateY(-3px);border-color:#b8c6f4}.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--violet);font-weight:900}.card h3{margin:7px 0 4px}.muted{color:var(--muted)}.bar{height:7px;background:#edf0f6;border-radius:9px;margin-top:14px;overflow:hidden}.bar i{height:100%;display:block;background:linear-gradient(90deg,var(--mint),#5fd0aa)}.reader-head{display:flex;align-items:center;gap:14px}.back,.ghost{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}.reader-head h2{margin:0}.reader-head p{margin:4px 0;color:var(--muted)}.passage,.question{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;margin:16px 0;box-shadow:0 5px 18px #1b315008}.passage h3{margin:0 0 12px}.passage-text{font:17px/1.9 Georgia,"Times New Roman",serif;white-space:pre-line}.passage-tools{display:flex;gap:8px;margin-top:18px}.tool{background:#eef2fb;border-radius:11px;padding:9px 12px}.translation{display:none;background:#f7f4ff;color:#574b78;border-radius:14px;padding:16px;margin-top:15px;line-height:1.75}.translation.show{display:block}.qtop{display:flex;justify-content:space-between}.qnum{color:var(--violet);font-weight:900}.prompt{font:600 18px/1.65 Georgia,"Times New Roman",serif}.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{text-align:left;background:#fafbfe;border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink)}.choice:hover,.choice.chosen{border-color:var(--blue);background:#eef3ff}.choice.correct{border-color:var(--good);background:#eaf9f3;color:#087052}.choice.wrong{border-color:var(--bad);background:#fff0f2;color:#a22c42}.feedback{display:none;margin-top:12px;background:#f3f6fb;color:var(--muted);padding:12px;border-radius:12px}.feedback.show{display:block}.actions{position:sticky;bottom:14px;display:flex;justify-content:center;gap:10px}.primary{background:var(--blue);color:#fff;border-radius:12px;padding:11px 17px;font-weight:900;box-shadow:0 8px 24px #315cc64a}.dashboard{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.dash{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}.dash b{font-size:32px;display:block}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#172541;color:white;border-radius:13px;padding:12px 18px;opacity:0;transition:.2s;z-index:10}.toast.show{opacity:1}@media(max-width:700px){.nav{gap:3px;flex-wrap:wrap}.brand{width:100%}.stats{margin-left:auto}.hero-icon{display:none}.answers{grid-template-columns:1fr}.dashboard{grid-template-columns:1fr}.wrap{padding:18px 13px 70px}.passage,.question{padding:17px}}</style></head>
<style>.syntax-legend{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 18px}.legend-chip{font:800 12px/1 sans-serif;padding:7px 9px;border-radius:8px}.sentence{font:17px/1.95 Georgia,"Times New Roman",serif;padding:14px 12px;border-top:1px dashed var(--line)}.sentence:first-child{border-top:0}.syn{display:inline;padding:2px 3px;border-radius:5px;margin:0 1px}.syn:after{content:attr(data-role);font:800 9px/1 Inter,sans-serif;vertical-align:super;margin-left:2px;opacity:.75}.s-S{background:#dceaff;color:#174e9b}.s-V{background:#ffe2e8;color:#a72543}.s-O{background:#dcf7e9;color:#08744f}.s-C{background:#f0e1ff;color:#6d2ca0}.s-M{background:#fff1c9;color:#855d00}.s-CONJ{background:#dff6f7;color:#08747a}.s-REL{background:#ffe5ca;color:#9a4c00}.syntax-note{font-size:12px;color:var(--muted);margin-top:8px}</style>
<style>.sentence-en{display:block}.sentence-zh{display:block;margin-top:7px;padding:8px 11px;border-left:3px solid #8f79e8;background:#f7f4ff;border-radius:0 9px 9px 0;color:#554a73;font:14px/1.65 "Noto Sans TC","Segoe UI",sans-serif}.strategy-panel{ls{background:#fff;border:1px solid var(--line);border-radius:18px;margin:16px 0;overflow:hidden}.strategy-panel summary{cursor:pointer;padding:17px 20px;font-weight:900;background:linear-gradient(90deg,#fff4de,#fff)}.strategy-body{padding:4px 20px 20px;line-height:1.7}.strategy-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.strategy-box{background:#f7f9fd;border-radius:13px;padding:14px}.strategy-box h4{margin:0 0 7px;color:var(--violet)}.strategy-box ul,.strategy-box ol{margin:6px 0;padding-left:21px}.rule-table{width:100%;border-collapse:collapse}.rule-table td{border-bottom:1px solid var(--line);padding:7px}.q-strategy{display:inline-flex;gap:8px;align-items:center;background:#fff6df;color:#76520a;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:800;margin:-4px 0 12px}.q-type{background:#f0e8ff;color:#673ba0;border-radius:6px;padding:3px 6px}@media(max-width:700px){.strategy-grid{grid-template-columns:1fr}}</style>

<script>const UNITS=[{"number":1,"title":"The Best Dads of the Water","zhTitle":"水中好爸爸","category":"Animals","article":"In the animal world, the mother is usually the parent that does the most for the child. She gives birth to it and often raises it on her own. However, there are several aquatic animals that are turning this idea upside down. One of the most interesting examples of an excellent ocean dad is the sea horse. The female lays her eggs in a pouch on the front of a male sea horse. As the eggs grow, so does his belly. When the eggs finally hatch, the dad gives birth by pushing the tiny new sea horses from the pouch. Another father with a pouch is the Darwin’s frog. The female lays eggs and the male guards them for about two weeks. When the tadpoles come out of their eggs, the father puts them in the big pouch of skin under his chin, where they stay until they are ready to hop out into the dangerous world. The clown fish was made famous by the Disney film Finding Nemo. After the female clown fish lays eggs, the male protects them until they hatch. That’s not all. If the mother fish dies, the dad can turn into a female and be the new mom of the family. Now that’s real dedication! Another great ocean dad is the emperor penguin. These dads keep the eggs on top of their feet under a thick fold of warm skin. During the next two months of the Antarctic winter, these fantastic fathers go without food as they keep their precious eggs warm. While each of these fathers is very different, they all take responsibility for their children. These dads of the water make sure their kids have a safe place to grow so they will have a good life in the future.","translation":"在動物界裡，媽媽通常是為孩子付出最多的家長。 牠生育孩子且常獨力撫養。然而，有好幾種水生動物 顛覆了這個想法。 海洋中的好爸爸最有趣的例子之一就是海馬。雌海 馬把卵產在雄海馬身體正面的一個育兒袋裡。隨著卵 成長，牠的肚子也會變大。當卵終於孵化時，海馬爸 爸會藉由將幼小的新生海馬推出育兒袋來生產。 另一個有育兒袋的爸爸是達爾文蛙。雌蛙產卵後， 雄蛙會看顧它們約兩個星期。當蝌蚪從卵裡出來後， 蛙爸爸會把牠們放進在牠下巴下面由皮膚形成的大育 兒袋裡，牠們會待在裡頭，直到準備好要跳進危險的 世界為止。 小丑魚因為迪士尼電影《海底總動員》而聲名大噪。 雌性小丑魚產卵後，雄魚會保護牠們直到孵化為止。 還不只這樣。如果魚媽媽死了，魚爸爸可以變性成雌 魚、成為家中的新媽媽。那才是真正的奉獻！ 另一種偉大的海洋父親是皇帝企鵝。這些企鵝爸爸 會把蛋放在腳上，蓋在一層厚厚的溫暖皮膚下面。在 接下來兩個月的南極冬季期間，這些了不起的父親在 維持牠們珍貴的蛋的溫暖時都不會進食。 雖然這些父親每一個都非常不同，但牠們都負起照顧 孩子的責任。這些水中的爸爸確保牠們的孩子有安全的 地方可以成長，這樣牠們未來才會有美好的生活。","questions":[{"id":1,"prompt":"What is the second paragraph mainly about?","options":{"A":"How the male sea horse takes care of the eggs","B":"How the female sea horse hatches the eggs","C":"How the male sea horse lays eggs in a pouch","D":"How the female sea horse grows the eggs in her belly"},"answer":"A"},{"id":2,"prompt":"Which of the following statements would the writer NOT agree with?","options":{"A":"It is usually the mother who does the most for the child.","B":"Darwin’s frog dads protect their young before and after hatching.","C":"The emperor penguin is an example of a great ocean dad.","D":"The fathers in the passage all protect their children in the same way."},"answer":"D"}]},{"number":2,"title":"Museums for Love","zhTitle":"愛情博物館","category":"Culture and Customs","article":"What does love mean to you? Is it that special feeling in your heart when you see someone you like? Is it the warm glow you get when you hold hands? Love seems to be everywhere, and at some museums around the world, love is in the air all year round. The Palazzo Filomela in Venice is better known as the Museum of Love. This museum was once the private home of a famous 16th-century singer. On the walls, you can see paintings of legendary lovers, such as the god Cupid and his lover, Psyche. For many, love and chocolate go hand in hand, so a visit to the Chocolate Museum in Cologne, Germany, makes sense. There, visitors can learn about the history of chocolate and watch chocolate bars being made. The museum also gives out wafers that were dipped in chocolate from a three-meter-high chocolate fountain. Love isn’t always sunshine and rainbows. Sometimes things can go wrong, and the Museum of Broken Relationships in Croatia is dedicated to this. It has a collection of objects that people donated from their failed relationships, and each item has a story that goes along with it. Visitors will see letters, photographs, dolls, and clothing from broken hearts all over the world. On the brighter side, the Diamond Museum Amsterdam in Holland is the place to go when you’re ready to take your love to the next level. At this museum, you can learn about diamonds, including how to tell a real Love to buy when you’re getting engaged. Shakespeare once wrote, “Love looks not with the eyes, but with the mind.” Thanks to these special museums, we can all open our minds to—and fill our hearts with—love.","translation":"愛情對你來說意味著什麼呢？是你看到喜歡的人時 那股特殊的感覺嗎？是你倆牽手時心滿意足嗎？愛情 似乎無所不在，在世界各地的一些博物館裡，一整年 都充滿著浪漫愛情的氣氛。 位於威尼斯的「菲羅米拉宮」更常被稱為「愛情博 物館」。這間博物館曾是十六世紀一位知名歌手的私 人住宅。在牆上，你可以看到傳說中戀人的畫，像是 愛神邱比特和他的情人賽姬。 對許多人來說，愛情和巧克力密切相關，所以參觀 位於德國科隆的「巧克力博物館」是有道理的。在那 裡，遊客可以瞭解巧克力的歷史並觀看巧克力棒的製 作過程。這座博物館也會贈送沾浸三公尺高的巧克力 噴泉裡的巧克力的威化餅。 愛情並非總是如陽光和彩虹般美好。有時事情可能 會出錯，位在克羅埃西亞的「失戀博物館」就是因此 而建立的。它收集人們從失敗戀情中捐贈的物品，每 項物品都有一個故事。參觀者將會看到來自世界各地 心碎戀人的信件、照片、玩偶和衣物。 來看較光明的一面，當你準備好與情人攜手邁向下 一個階段時，位於荷蘭的「阿姆斯特丹鑽石博物館」 是你可以去的地方。在這個博物館裡，你可以學到鑽 石的知識，包括如何分辨鑽石的真假。你或許也會獲 得一些在你訂婚時要購買哪種鑽石的想法。 莎士比亞曾寫下：「愛情不是用眼睛看，而是用心 去體會的。」多虧有這些特殊的博物館，我們都可以 對愛情敞開心胸，也讓心中充滿愛。","questions":[{"id":1,"prompt":"What does “Love isn’t always sunshine and rainbows” mean in paragraph four?","options":{"A":"Sometimes love can make you feel bad.","B":"You can’t always see sunshine when you are in love.","C":"There is always failure in relationships.","D":"Love is like a colorful rainbow."},"answer":"A"},{"id":2,"prompt":"Which of the following statements is true about the Museum of Broken Relationships?","options":{"A":"It has sunshine and rainbows painted on the walls.","B":"It has pictures of people with broken hearts on the walls.","C":"It has many dolls and photographs that visitors can see.","D":"It has a collection of objects from successful relationships."},"answer":"C"}]},{"number":3,"title":"Up, Up, and Away!","zhTitle":"熱氣球：飛啊！飛上天際！","category":"Sports and Entertainment","article":"fans and see the fire of gas burners. Some of the balloons are almost meters tall! As the morning sun lights the field, hundreds of colorful balloons rise into the sky. The best place to see a sight like the one just described is at a hot-air balloon festival. These happen all over the world, from the United States and Canada to Europe and Asia, and many of them take place in August. At these festivals, balloon pilots test their skills in races or by dropping markers onto targets while visitors cheer them on. Flying a hot-air balloon is not as easy as it looks. When the air is heated, the balloon rises. Over time, the air cools, and the balloon goes down. Winds move in different directions at different altitudes, so you can change course by taking the balloon up or down. For safety, pilots prefer to f ly when skies are clear and winds are predictable. If the weather is good, a balloon ride can be an amazing experience. Passengers are struck by the feeling of being in a quiet dream as the balloon moves with the wind. Of course, the view is wonderful, too. Then, 8625 there are the beautiful moments that can happen in the basket. Many hot-air balloon pilots have seen romantic marriage proposals. Some couples even come back to the hot-air balloon to get married! You don’t have to be planning a wedding to enjoy a wonderful and peaceful ride in a hot-air balloon. It really is an unforgettable event. As you ride the wind across the sky, you’ll also feel your heart and soul soar.","translation":"想像日出前的一片開闊平原。原野上滿是在充滿 熱空氣時漸漸變大的熱氣球。你聽見風扇的嗡嗡聲、 看到瓦斯噴火器的火焰。有些氣球有將近三十公尺高！ 當朝陽照亮原野，數百個五彩繽紛的氣球升上天空。 要看到剛描述的景象，最好的地點就是在熱氣球嘉年 華上。從美國、加拿大到歐洲和亞洲等地，全球各地都 有舉辦熱氣球嘉年華，而且很多都是在八月舉辦。在這 些嘉年華中，氣球飛行員藉由競速或把標記物丟到靶上 來測試自己的技能，同時還有遊客為他們加油打氣。 駕駛熱氣球沒有看起來那麼容易。空氣升溫時， 氣球就會升起。經過一段時間，空氣冷卻，氣球隨之 下降。風在不同的高度吹拂的方向也不同，所以你可 以藉由升降氣球來改變航向。為了安全起見，飛行員 比較喜歡在晴空萬里且可以預測風向時飛行。 如果天氣好的話，搭乘熱氣球會是一次美妙的 體驗。氣球隨風移動時，乘客因為感覺像在祥和的夢 境中而深受感動。當然，視野也很棒。此外，吊籃裡 還可能有美好的時刻。許多熱氣球飛行員都見過浪漫 的求婚。有些情侶甚至會回到熱氣球上結婚！ 你不需要計畫婚禮才能享受搭乘熱氣球美妙且寧 靜的感受。它確實是件令人難忘的事。當你乘風飛越 天際，你也會感覺到內心和靈魂在翱翔。19","questions":[{"id":1,"prompt":"What is the main idea of the article?","options":{"A":"To discuss the different kinds of hot-air balloons","B":"To discuss how to become a hot-air balloon pilot","C":"To discuss balloon festivals from all over the world","D":"To discuss different ways of enjoying hot-air balloons"},"answer":"D"}]},{"number":4,"title":"The Bare Facts of Toilet Paper","zhTitle":"淺談衛生紙","category":"Origins","article":"Picture this: You’ve just answered nature’s call, and to your horror, there’s no toilet paper in the bathroom! Instead, there is a sponge on a stick soaking in salt water. You probably can’t imagine using that, but the ancient Romans did. Before modern toilet paper was invented, people used all kinds of materials for the same purpose. Greeks used stones. Hawaiians used coconut shells. The Vikings used wool, and Eskimos used snow. Leaves and corncobs were used in America. People made do with whatever was at hand. The first real toilet paper was made in 1391 for the emperor of China. They were two-by-three-foot sheets and perfumed! By the late 15th century, people were using newspapers. In 1857, Joseph C. Gayetty sold toilet paper in packages of f lat sheets in the United States, but it wasn’t a hit. Toilet paper didn’t become popular until 1897, when the Scott brothers sold toilet paper in rolls. In 1942, an English company created the two-layer paper that we’re used to now. It’s common these days to see toilet paper sold in different colors and scents. However, some toilet-paper makers have turned this simple item into something that can even be entertaining. For those who get bored Japan, toilet-paper makers have put out a story toilet paper with an entire novel printed on it for your reading pleasure. From the early days of using sponges on sticks to the present-day toilet-paper novels, the evolution of toilet paper certainly is fascinating. One thing we know for sure is that using modern toilet paper is much, much better than using coconuts or corncobs!","translation":"想像一下這個情境：你剛上完廁所，令你驚恐的 是，廁所裡面竟然沒有衛生紙！反而只有一支浸泡在 鹽水裡的海綿刷。你可能無法想像使用那種東西，但 古羅馬人就是用那個。 在現代的衛生紙發明以前，人類使用各種材料來達 到同樣的目的。希臘人用石頭。夏威夷人用椰子殼。 維京人用羊毛，而愛斯基摩人則用雪。在美洲則用樹 葉和玉米穗軸。人們湊合著用手邊有的東西。 第一張真正的衛生紙是一三九一年為中國皇帝製造 的。尺寸為二乘三英尺，而且還有香味！到了十五世 紀末，人們則使用報紙。 一八五七年，喬瑟夫．C．蓋耶堤在美國販售有包裝 的平版衛生紙，但乏人問津。直到一八九七年史考特兄 弟以捲筒形式販售，衛生紙才開始風行。一九四二年， 一家英國公司製造了我們現今慣用的雙層衛生紙。 現在看到衛生紙以不同顏色和香味來販售是很平 常的事了。然而，有些衛生紙製造商把這種簡單的物 品變得甚至具有娛樂性。針對那些上廁所時感到無聊 的人，有一種衛生紙上面印有解謎遊戲。而在日本， 製造商推出一種故事衛生紙，他們把整部小說印在衛 生紙上，為你帶來閱讀樂趣。 從早期用海綿刷到現今的衛生紙小說，衛生紙的演 進確實很有趣。我們非常確信的一件事情是，用現代 的衛生紙比用椰子或玉米穗軸要好太多了！","questions":[{"id":1,"prompt":"What does the phrase “answered nature’s call” mean in the first paragraph?","options":{"A":"Gone back to nature","B":"Responded to an invitation from nature","C":"Gone for a walk in nature","D":"Gone to the bathroom"},"answer":"D"},{"id":2,"prompt":"What is paragraph five mainly about?","options":{"A":"People read texts printed on toilet paper.","B":"Flat sheets of toilet paper in packages were introduced.","C":"Sponges on sticks were used instead of toilet paper.","D":"Rolls of toilet paper were invented (E) Perfumed sheets of paper were first used."},"answer":"A"}]},{"number":5,"title":"Moon Legends and Superstitions","zhTitle":"月亮傳奇故事及迷信傳說","category":"Culture and Customs","article":"the bright moon in the sky, they see light and shadows that make shapes on the surface. What do you see? People in East Asia see the Jade Rabbit. Ancient legends tell the story of an old man who was begging for food. A rabbit threw itself onto a fire, offering to feed the man. The old man was really the Jade Emperor, and he rewarded the rabbit by letting it live forever on the moon. Some Europeans see a man on the moon carrying sticks on his back. German stories say the man was banished to the moon for stealing his neighbor’s wood. Roman fables say he’s being punished for stealing sheep. A Maori legend explains that the image on the moon is the woman Rona under a tree. One dark night, Rona hurt her foot because she couldn’t see, and she called the moon rude names. The angry moon goddess reached down to grab Rona, who tried to hold on to a tree. The tree ended up on the moon with her. Superstitions warn us that cutting your hair between the full moon and the new moon makes hair unhealthy. Other people say that pointing at the moon brings bad luck. Stories also warn us to watch out for werewolves during a full moon. Moon Legends and 05 Superstitions The moon also has a place in language. If people say that something happens “once in a blue moon,” they mean it rarely happens. Actually, a “blue moon” is a second full moon in one calendar month, and that happens every three years. So, the next time you find yourself gazing up at the moon, pay close attention. Maybe you can come up with your own story about what you see.","translation":"人們仰望天空看著天空上的明月，他們看到月球表 面由亮光和陰影構成的形狀。你看到什麼呢？ 東亞人看到玉兔。古老的傳說訴說一個老人在乞討 食物的故事。一隻兔子將自身投入火中，自願餵飽那 個人。那個老人其實是玉皇大帝，於是他讓這隻兔子 永遠住在月亮上來酬謝牠。 有些歐洲人看到一個背上背著樹枝的男人在月亮上。 德國的故事說那個人因為偷了鄰居的木材而被放逐到 月亮上。羅馬的寓言故事則說他是偷了羊而受到懲罰。 毛利人的傳說則解釋月亮上的影像是在樹下的女 子蘿娜。在一個暗夜，蘿娜因為看不見而弄傷了腳， 於是她用粗話辱罵月亮。生氣的月亮女神下凡來抓蘿 娜，她則試圖緊抓一棵樹。結果那棵樹和她一起上了 月球。 有迷信警告我們說在滿月和新月之間剪頭髮會讓頭 髮不健康。其他人則說指著月亮會帶來厄運。有些故 事也警告我們在滿月期間要小心狼人。 月球在語言中也有一席之地。如果人們說某件事 「每逢藍月（once in a blue moon）」才發生，他們 的意思是它很少發生。事實上，「藍月」是指一個日曆 月中的第二次滿月，而那情況每三年會發生一次。 因此，下次你賞月時可以仔細注意。也許你可以想 出關於你自己所見的月亮故事。","questions":[{"id":1,"prompt":"What is the main idea of the article?","options":{"A":"To discuss different ways of looking at the moon","B":"To discuss how the moon has a place in everyday language","C":"To discuss an old Maori legend about a woman under a tree","D":"To discuss the East Asian legend of the Jade Rabbit"},"answer":"A"},{"id":2,"prompt":"If a “blue moon” happens in 2021, when will the next one after it take place?","options":{"A":"2023","B":"2024","C":"2025","D":"2026"},"answer":"B"}]},{"number":6,"title":"Left or Right: Which Do Animals Prefer?","zhTitle":"左撇子還是右撇子：動物偏好","category":"Animals","article":"For a long time, scientists believed that only humans were left- or right-handed. However, recent studies have shown that this isn’t true. Just like people, animals favor one side or the other. In Ireland, scientists studied a group of 42 cats. They gave them three tasks. One was to get a delicious piece of fish out of a bottle. They found that the male cats preferred to use their left paw, and the female cats preferred to use their right. Being left- or right-handed isn’t limited to arms and legs. It can include eyes, ears, claws, and even tails. In Italy, scientists discovered that dogs wag their tails to the right when they see something that they like. When they see something that they don’t like, their tails go to the left. There are lots of other fun examples. Bottlenose dolphins swim to the left when they feed, which shows that they favor the right side. Even snakes prefer to curl up only one way. Then there is the myth of polar bears being left-handed. Some say that polar bears cover their black nose with their right paw, which helps them hide in the snow when they are hunting. Then they can sneak up on a seal, and their left paw will be free to grab it. Scientists, however, disagree. Some have watched polar bears for thousands of hours. They never saw the bears cover their nose during a hunt. They also saw no evidence that they were left-handed. Despite this, many sources continue to claim that polar bears are left-handed. Left or Right: Which Do 06 Animals Prefer? the meantime, try studying an animal—whether it’s your pet cat or an elephant at the zoo—for yourself. Does it prefer the left or the right?","translation":"哪一種？ 有很長一段時間，科學家相信只有人類有左撇子 或右撇子。但是近來的研究顯示並非如此。就像人一 樣，動物也會偏好某一邊或另一邊。 在愛爾蘭，科學家研究由四十二隻貓組成的群體。 他們給這些貓三項任務。有一項是把一片好吃的魚肉 從一個瓶子裡取出。他們發現公貓較喜歡用左掌， 而母貓較喜歡用右掌。 左撇子或右撇子不限於手腳。它也可以包括眼睛、 耳朵、爪子，甚至是尾巴。在義大利，科學家發現狗 狗看到喜歡的東西時會向右邊搖尾巴。牠們看到不喜 歡的東西時，尾巴會搖向左邊。 還有很多其他有趣的例子。瓶鼻海豚進食時會往左 游，顯示牠們偏好右側。甚至蛇也比較喜歡只以一種 方式蜷曲起來。 然後有北極熊是左撇子的錯誤說法。有些人說北極 熊會用右掌遮住牠們的黑鼻子，幫助牠們打獵時在雪 地中藏匿。然後牠們可以偷偷接近海豹，而牠們的左 掌就能空出來抓住海豹。 但是科學家有不同的看法。有些科學家觀察了北極 熊數千個小時。他們從沒有看過北極熊在狩獵時遮住20 鼻子。他們也沒有看到任何證據顯示牠們是左撇子。儘 管如此，許多引文出處仍持續宣稱北極熊是左撇子。 科學家還在了解關於動物及其行為的知識。在此同 時，試著自己去研究一種動物――無論牠是你的寵物 貓還是動物園裡的大象。牠偏好左邊還是右邊呢？","questions":[{"id":1,"prompt":"Which one of the following statements is true about polar bears?","options":{"A":"Many people believe polar bears are left-handed because they use their left paw to cover their nose.","B":"The finding that polar bears cover their nose while hunting is supported by scientists.","C":"Scientists disagree with the popular belief that polar bears are left-handed.","D":"The claim from many websites that polar bears are left-handed is based on scientific research."},"answer":"C"},{"id":2,"prompt":"In the last paragraph, what does the author suggest we do?","options":{"A":"Watch animals, and try to find out if they are left- or right-handed.","B":"Talk to scientists, and ask them which animals are left- or right\u0002handed.","C":"Become a scientist to understand if animals prefer one side.","D":"Adopt a cat to observe if cats are left- or right-handed."},"answer":"A"}]},{"number":7,"title":"Taking Responsibility for Your Actions","zhTitle":"為自己的行為負責","category":"Life and Education","article":"Integrated Questions A B C D 96字彙 Vocabulary 1. paw [p7] n. 腳爪；爪子 My dog’s paws were covered with mud because he ran around in the park. 2. curl up [k-l] [9p] v. 捲曲；蜷縮 My cat sometimes likes to curl up into a ball when she sleeps. 3. seal [sil] n. 海豹 Seals are the favorite food of polar bears. 4. evidence [`5v4d4ns] n. 證據；證明 Scientists are looking for evidence of life on Mars. . behavior [b6`hevj0] n. 行為；舉止 The team of scientists documents the behavior of owls at night. - 參考字彙與說明  Ireland [`a6rl4nd] n. 愛爾蘭  left-handed [`l5ft`h1nd4d] adj. 左撇子的； 慣用左手的  right-handed [`ra6t`h1nd4d] adj. 右撇子的； 慣用右手的  wag [w1g] v. 搖動；擺  bottlenose dolphin [`b9ty%noz] [`d3lf4n] n. 瓶鼻海豚  myth [m6q] n. 普遍卻錯誤的看法；神話  polar [`pol0] adj. 極地的（polar bear 指 「北極熊」）  sneak [snik] v. 偷偷地走；溜（動詞三態為 sneak–sneaked/snuck–sneaked/snuck， sneak up on . . . 指「偷偷接近……」） 關鍵解析 Language Notes one . . . the other vs. one . . . another 「另一個」有分別 • One man liked the movie, and the other thought it was bad. 有一個男人喜歡那部電影，而另一個男人覺得它不好 看。（總共只有兩個人） • Several bicycles were broken. One had no wheels; another was missing its seat. 數台腳踏車壞了。有一台沒有輪子；另一台缺椅墊。 （總共有很多台腳踏車） thousands of . . . 數千個…… 要估計某人事物的大概數量時，可用以下說法： dozens + of + 複數名詞 數十個…… hundreds 數百個…… thousands 數千個…… millions 數百萬個…… • There were dozens of ducks on the lake. 湖面上有數十隻鴨子。 despite 雖然；儘管 despite 作介系詞用，之後接 N. 或 V-ing。 Despite + N./V-ing, S. + V. 雖然、儘管……，…… • Despite the hot weather, I didn’t turn on the air conditioner. 雖然天氣熱，我並沒有開空調。 • Despite studying all night, David didn’t get a very good grade. 雖然唸了整晚的書，大衛還是沒有得到很好的成績。 in the meantime 同時；在此期間 meantime 指「那段時間；那期間」，in the meantime 表示「在某件事期間」，也可寫成 in the meanwhile。 • Ben is waiting for dinner. In the meantime, he is buying the desserts. 班在等著吃晚餐。與此同時，他去買甜點。 to “be more responsible.” Perhaps you would like to take their advice, but you don’t know where to start. What does being responsible mean anyway? A part of being responsible is having self-discipline. Here’s an example: Jenny and her classmates have a big school science project, and Jenny must complete her part of the project over the weekend. A friend calls Jenny and invites her to spend Saturday at the beach. Jenny accepts the invitation, but on Sunday, she realizes that she doesn’t have enough time to finish her work. In the end, she does a poor job on the group project. If Jenny had been disciplined and said “no” to the invitation, she wouldn’t have let her classmates down. Sometimes, we’re unable to follow through on tasks because we’ve accepted too many of them or because they’re beyond our ability. Biting off more than we can chew often gets us into trouble. Instead, setting reasonable goals lets us finish what we’ve started. If you’re unable to fulfill your tasks, making excuses or blaming others for it isn’t the answer. It’s easy to say “it wasn’t my fault.” However, by doing so, you’re giving up your power to improve. Therefore, always take responsibility for your own actions. Taking Responsibility 07 for Your Actions Remember that responsibility has to be earned. All of us have to show that we can be trusted with certain tasks before we are given greater responsibility. Earning that trust gives us a sense of achievement. You’re a hundred percent responsible for your own decisions and feelings. By taking responsibility, you’ll be in charge of your own life, be more independent, and be much happier.","translation":"你的師長和父母可能已經不只一次要求你要「多一 點責任心」。也許你想接受他們的意見，但不知從何做 起。負責任到底是什麼意思？ 負責任在某種程度上意味著自律。這裡有個例子： 珍妮和同學們有一項大型的學校科學作業，珍妮必須 在週末完成自己負責的部分。有一個朋友打電話給 珍妮，邀她週六到海邊玩。珍妮接受了這個邀請， 但星期天時她意識到她沒有足夠的時間來完成作業。 結果她在這個團體作業的表現很不理想。如果珍妮當 時有所自制並拒絕那個邀請，她就不會讓她的同學們 失望。 有時我們無法完成任務是因為我們接了太多工作， 或是因為這些工作超出我們的能力。沒有量力而為常 讓我們陷入困境。反之，設定合理的目標能讓我們 貫徹始終。 若是你無法完成工作，找藉口或是責怪他人都不是 解決方法。「這不是我的錯。」說起來很容易。但是這 麼做的話，你就放棄了進步的能力。因此，隨時都要 為自己的行為負責。 記住，職責是必須爭取來的。我們所有人在被賦 予更大的責任之前，都必須讓別人看到我們可被託付 某些任務。贏得那份信任會帶給我們成就感。 你要為自己的決定和感受百分之百地負責。藉由 負責任，你將能為自己的人生負責、更加獨立，也會 更快樂。","questions":[{"id":1,"prompt":"What does “biting off more than we can chew” mean in paragraph three?","options":{"A":"Taking on more tasks than we can handle","B":"Eating too much food at one time","C":"Setting reasonable goals that you can finish on time","D":"Blaming others for your mistakes"},"answer":"A"},{"id":2,"prompt":"What is paragraph five mainly about?","options":{"A":"Achieving goals","B":"Self-discipline","C":"Completing tasks","D":"Earning trust"},"answer":"D"}]},{"number":8,"title":"Six Steps to a Smarter You","zhTitle":"六招讓你變聰明","category":"Science and Technology","article":"E. Allows us to become more __________ F. Makes us __________ A. Must be __________ B. Shows we can be __________ D. Gives us a sense of __________ C. Will lead to greater __________ responsibility Do you want to think more clearly and solve problems more easily? Here are some steps you can take toward a smarter you. Exercise For a fit brain, you need a fit body. Get at least minutes of exercise four days a week. Try something fun that requires your attention, like hip-hop dancing, or just take a fast walk around the park. Sleep Sleep strengthens your memory, which is important for learning new things. Go to bed and wake up at the same time every day, and aim for eight hours of sleep a night. Eat What you eat plays a big part in how you think. Your brain needs healthy fats to work, and salmon is a great source. Berries, spinach, and tomatoes also keep your brain working at its best. Read Read books that show you a new way of looking at the world. You can also read to learn a skill or figure out how things work. The more challenging the book is, the more your brain will benefit from it. Learn Try a simple activity, like brushing your teeth, with the other hand. This will help strengthen the side of the brain that you don’t use as often. In addition, learn to do things that take some time to master. Practicing a musical instrument is a great way to do this. Don’t forget to play! Puzzles, word games, and sudoku all exercise your brain. To make your mental workout even more effective, play some games against the clock or find a smart friend to challenge. By following these easy steps every day, you will help make sure that your brain is able to perform at its highest level. This can make you smarter today, tomorrow, and well into the future.","translation":"你想要思緒更清楚且能更輕易地解決問題嗎？這裡 有幾個方法可以讓你變得更聰明。 運動： 想要有健康的頭腦，你需要有強健的身體。 一週至少運動四天，一次三十分鐘。嘗試一些 需要專注力的好玩活動，像是嘻哈舞，或只是 在公園快走也行。 睡眠： 睡眠會增強你的記憶力，這對於學習新事物 是很重要的。每天在同一個時間上床睡覺和 起床，並且以每晚睡八小時為目標。 飲食： 你所吃的東西對你的思考力有很大的影響。 你的頭腦需要健康的脂肪來運作，而鮭魚是絕 佳的來源。莓果、菠菜和番茄也能使你的頭腦 運作處於最佳狀態。 閱讀： 閱讀能帶你用新的方式看世界的書籍。你也能藉 由閱讀來學習技能或理解事情運作的道理。你所 讀的書越具有挑戰性，你的頭腦受益就越多。 學習： 嘗試用另一隻手做簡單的活動，像是刷牙。這有 助於強化你比較不常用的那側頭腦。此外，學習 一些需要花時間才能熟練的事情。練習樂器是進 行此項訓練的好方法。 玩樂： 不要忘了玩樂！猜謎、文字遊戲和數獨都能鍛 鍊你的頭腦。為了讓你的心智鍛鍊更有成效， 不妨在時間限制下玩些遊戲，或找個聰明的 朋友來挑戰。 每天遵循這些簡單的方法將有助於確保你的頭腦能 夠有最高水準的表現。這能讓你一天比一天更聰明， 邁向成功的未來。","questions":[{"id":2,"prompt":"According to the article, what should you do if you want to build up the side of the brain you use less?","options":{"A":"Try any activity with the other hand.","B":"Read a book with a challenge.","C":"Learn some things that take time to master.","D":"Play games that can exercise your brain."},"answer":"A"}]},{"number":9,"title":"Leave It to Beaver: Bringing Beavers Back to Control UK Flooding","zhTitle":"英國打算用河狸來治水？","category":"Ecology","article":"been debating whether the reintroduction of beavers into the wild is a good thing. The animals were hunted to extinction more than 300 years ago in the UK, but thanks to their positive effects on the environment, small numbers of the dam-building animals have been brought back. Beavers have already proved their worth. In 2020, as the UK experienced its wettest February on record and flooding was widespread, one area remained dry. Along the River Otter in the county of Devon, a family of beavers were released in 2015 in a government trial. The beavers built dams with logs, sticks, bark, rocks, mud, leaves, and anything else they could get their paws on. The end result was a network of dams nearly a mile long that held up in the storms and helped stop flooding. Scientists studied the beavers that were released in Devon to see what effect the animals had. They discovered several benefits. In addition to slowing floodwaters, the dams helped filter pollution from the river. They also created rich marshland, which greatly increased fish populations. Still, many farmers are against bringing beavers back. In fact, the areas where beavers have been released are mostly surrounded by electric fences to keep the animals in. While beaver dams protect areas further down the river, they can cause local flooding. This often results in destroyed farmland. While fencing the beavers in is one solution, this may be too costly over time. Nevertheless, the reaction to the reintroduction of beavers from the general public has been mostly positive and the beavers seem to have succeeded in building solid foundations not only for their dams but also for ecotourism.","translation":"英國人一直在爭論把河貍重新引進當地的野生環境 中是不是一件好事。這動物在三百多年前於英國被獵 殺到滅絕，但由於牠們對環境的正面影響，會築水壩 的這種動物有少數被帶回來了。21 河貍已證明牠們的價值。二○二○年，英國經歷有 史以來最潮濕的二月且到處都是水患時，有一個地區 還是乾燥的。在二○一五年一次政府進行的試驗中， 沿著德文郡的奧特河釋放了一個河狸家族。這些河貍 用木頭、樹枝、樹皮、石頭、泥巴、樹葉，以及別的 可以到「掌」的東西來建造水壩。最後形成一個將近 一英里長的水壩網絡，在暴風雨中仍保持完好並幫助 阻擋了洪水。 科學家研究被釋放到德文郡的河貍來觀察這些動物 有什麼影響。他們發現了好幾個好處。除了減緩洪水 外，水壩有助於過濾河中的汙染物。它們也創造出肥 沃的沼澤地，使魚的數量大為增加。 儘管如此，許多農人還是反對把河貍帶回來。事實 上，野放河狸的地區周邊幾乎被一道道通電的圍籬圍 起來，好讓那些動物留在裡面。雖然河貍水壩保護河 流較下游的地區，但可能會造成當地淹水。這常導致 農地受到破壞。雖然用圍籬把河貍圍起來是一個解決 辦法，但長期下來代價可能太高。 然而，大眾對重新引入河貍的反應大多是正面的， 而且河狸似乎不僅為牠們的水壩，也為生態旅遊的成 功奠定了堅實的基礎。","questions":[{"id":2,"prompt":"What does “Beavers have already proved their worth.” in paragraph two imply?","options":{"A":"Beavers have already shown that they are beneficial.","B":"Beavers have already proven to be worth a lot of money.","C":"Beavers have shown that they are worthy of great respect.","D":"Beavers have shown that they are able to build good dams."},"answer":"A"},{"id":3,"prompt":"How did beavers help the countryside around the River Otter? Choose the statements that are true, based on the article.","options":{"A":"The beavers built a system of dams that was nearly five miles long.","B":"The beavers’ dams helped to clean the River Otter.","C":"The beavers’ dams changed the land around the river which led to a growth in fish numbers.","D":"Beavers were able to get onto farmers’ land and chase away animals. (E) The beavers collected many different materials to build their dams. (F) Nature-loving tourists have started visiting the area because of the beavers."},"answer":"B"}]},{"number":10,"title":"From Brick to Hip: The History of Mobile Phones","zhTitle":"手機的發展史：從黑金剛到","category":"Origins","article":"Whether it’s taking photos or contacting others, the cell phone is an essential tool for modern life. But how did mobile phones get to be so cool? In 1973, the first cell phone call was made by Motorola engineer Martin Cooper, who used a phone shaped like a brick and weighing over a kilogram to call a fellow engineer. The phone could be used for minutes per -hour charge. Motorola released the first truly mobile phone in 1983, which cost US$4,000. Naturally, it was a huge status symbol. Though it was portable, the phone was still heavy. Six years later, Motorola released a flip phone that was small enough to fit inside a pocket. Mass production soon brought cheaper mobile phones to the market. In 1992, the Nokia 1011 was released. It was reasonably priced and had a digital display. In 2000, Sharp launched a camera phone, and Samsung produced a touch screen model. The BlackBerry 6210, which had a full keyboard, came out in 2003. By 2004, consumers were starting to value form as well as function. The slim Motorola RAZR came in several colors and was marketed as a fashion phone. 1973 1983 1992 2003 screen functioned helped make cell phones more user-friendly. In addition, the iPhone’s iconic design cemented cell phones’ status as a cool fashion accessory. In 2008, Apple introduced the App Store as well as the iPhone 3G. Over the next decade, data became ever more important. Download speeds and screen sizes increased to support high-resolution video streaming and mobile games. Advances in technology have made the brick phones of the 1970s a distant memory. If the future of mobile phones is anything like the past, there’s no telling what’s next.","translation":"潮品 無論是拍照還是聯繫別人，手機都是現代生活不可 或缺的工具。但手機到底是如何變得這麼時髦的？ 一九七三年，來自手機的第一通電話是由摩托羅拉 公司的一位工程師馬汀‧庫伯所撥打的，他是用一支 形狀像磚頭且重量超過一公斤的電話打給一位工程師 同事。這支電話每充電十小時可以使用三十分鐘。 摩托羅拉公司於一九八三年推出了第一款真正的 行動電話，售價為四千美元。自然地，它在當時是很 重要的地位象徵。雖然可攜帶，這款電話仍然相當笨 重。六年後，摩托羅拉公司推出了一款體積小到可以 放進口袋裡的掀蓋手機。 大量生產使較便宜的手機進到了消費者市場。 一九九二年，諾基亞1011發表了。這款手機價格合 理，並且有數位顯示器。 二○○○年，夏普推出了照相手機，三星也推出一 款具備觸控螢幕的機型。有完整鍵盤的黑莓機 6210 則在二○○三年上市。到了二○○四年，消費者已開 始重視外形和功能。輕薄的摩托羅拉 RAZR 有好幾種 顏色可供選擇，並且標榜為時尚手機在市場上銷售。 蘋果於二○○七年推出第一支 iPhone。iPhone 觸 控螢幕的運作方式讓手機更方便使用。此外，iPhone 標誌性的設計鞏固了手機作為時髦流行配件的地位。 二○○八年，蘋果推出了 App Store 和 iPhone 3G。在接下來的十年，數據變得越來越重要。下載速 度和螢幕尺寸提升以支援高解析度的影音串流和手機 遊戲。 科技的進步使得一九七○年代的黑金剛手機成了遙 遠的記憶。如果手機的未來就跟過去一樣的話，接下 來會是什麼就難以預料了。","questions":[{"id":2,"prompt":"According to the article, what has become more important to consumers over the last decade or so?","options":{"A":"The first truly mobile phone was released.","C":"Apple launched the first iPhone.","B":"The first call from a cell phone was made.","D":"Motorola came out with a flip phone. (E) Motorola came out with phones in different colors. ______ →______ → ______ → ______ →______"},"answer":"D"}]},{"number":11,"title":"Mark Twain: The Father of American Literature","zhTitle":"馬克．吐溫：美國文學之父","category":"People","article":"literature comes from one book by Mark Twain called Huckleberry Finn. There was nothing before. There has been nothing as good since.” Mark Twain was born Samuel Clemens on November , 1835. He grew up in Missouri on the Mississippi River. After his father died, he worked as a printer’s apprentice during the day and studied at the library by night. By age 16, Clemens was writing for a newspaper and beginning to discover his passion for writing. Clemens tried his hand at everything. He was a printer, miner, steamboat pilot, and journalist. In 1863, he began signing his work “Mark Twain.” This phrase was used by steamboat captains to say, “It’s safe to pass.” Thus, his pen name was created. Like many great writers, Mark Twain was inspired by his life experiences to write stories. He grew up where people were allowed to have slaves, but he knew slavery was wrong. Twain used his writing as a tool to speak out against it. Twain saw freedom and anti-racism as American values, and he used humor to tackle serious issues. Once in a lecture on racism, he had the audience laughing by saying, “I have no color prejudices; a man is a human being, and that’s enough. He can’t be any worse.” Twain also made fun of himself. When asked about his smoking habit, he replied, “To cease smoking is the easiest thing—I’ve done it a thousand times!” By using everyday language in his writings, he helped Americans break away from their European traditions and start an American way of life. No wonder American author William Faulkner called him “the father of American literature.” He was the great American humorist, and his wisdom continues to influence American literature and social development.","translation":"作家厄尼斯特．海明威曾說：「所有現代美國文學 都源自馬克．吐溫所寫的《頑童歷險記》。這是史無 前例。自那之後沒有可與之匹敵的作品。」 馬克．吐溫於一八三五年十一月三十日出生， 本名為山繆．克萊門斯。他在密西西比河畔的密蘇里 州長大。父親過世後，他白天在印刷廠當學徒，晚上 在圖書館念書。十六歲時，克萊門斯替報社撰稿， 並開始發現他對寫作的熱情。 克萊門斯嘗試過所有的事情。他當過印刷工人、礦 工、蒸汽船領航員和記者。一八六三年，他開始在作 品上署名「馬克．吐溫」。這個詞被蒸汽船長用來指 「可以安全通過」。因此，他的筆名於焉而生。 就像許多偉大的作家，馬克．吐溫是受到生活經驗 的啟發而寫作。他生長在人們允許擁有奴隸的地方， 但他知道蓄奴是不對的。馬克．吐溫利用作品作為公 開反對的工具。 吐溫認為自由與反種族歧視是美國的價值，於是他 用幽默來處理嚴肅的議題。曾經在一次關於種族歧視 的演講上，他說了這樣的話讓聽眾大笑：「我沒有膚 色偏見；一個人就是人，這就足夠了。他沒辦法更糟 了。」吐溫也會自嘲。當被問到自己的抽煙習慣時， 他回答：「戒煙是最簡單的事情——我已經做過一千 次了！」 藉由在作品中使用日常語言，他幫助美國人擺脫 歐洲的傳統、開始美國的生活方式。難怪美國作家威 廉．福克納稱他為「美國文學之父」。他是美國偉大 的幽默大師，其智慧持續影響美國文學與社會發展。22","questions":[{"id":1,"prompt":"According to the article, which of the following is true about Mark Twain?","options":{"A":"He used writing as a tool to speak out against slavery.","B":"He chose the name “Mark Twain” because that’s what his father called him.","C":"His writings were inspired by authors such as Faulkner and Hemingway.","D":"His lectures were always serious events."},"answer":"A"},{"id":2,"prompt":"What is the main idea of this article?","options":{"A":"Mark Twain’s books and their influence","B":"The life of Mark Twain","C":"Mark Twain’s views on slavery","D":"Comparing Mark Twain to Hemingway and Faulkner 3 Fill in the blanks in the following sentences using information given in the article."},"answer":"B"}]},{"number":12,"title":"The Fastest Animals on Land, in the Sea, and in the Air","zhTitle":"陸海空誰最快？","category":"Animals","article":"字彙 Vocabulary 1. literature [`l6t4r4%t]8r] n. 文學 Julie studied many great works of literature for her degree course. 2. passion [`p1]4n] n. 強烈愛好；熱情 Roger has a passion for rock music. 3. miner [`ma6n0] n. 礦工 The miner spent eight hours each day underground, looking for gold. 4. inspire [6n`spa6r] v. 啟發；給予靈感；鼓舞 Carla’s speech inspired Dee to donate money to the charity. . slave [slev] n. 奴隸（slavery [`slevri] 指 「蓄奴制度」） You are not a slave if you get paid for your work and are free to leave at any time. 6. lecture [`l5kt]0] n. 演講 I learned so much from the professor’s lecture this morning. 7. cease [sis] v. 停止 When the machine ceased working, I had to get it fixed. 8. break away from [brek] [4`we] [fr9m] v. 擺脫 Hank broke away from his old company and started his own business. 9. wisdom [`w6zd4m] n. 智慧 One of the advantages of getting older is that you gain wisdom. ✍ 參考字彙與說明  Ernest Hemingway 即厄尼斯特．海明威， 是二十世紀美國知名作家之一。  apprentice [4`pr5nt4s] n. 學徒  steamboat [`stim%bot] n. （蒸）汽船  journalist [`d.-n4l6st] n. 記者  anti-racism [%1nti`re%s6z4m] n. 反種族歧視 （racism [`re%s6z4m] 為名詞，指「種族歧視」）  tackle [`t1k4l] v. 著手對付（或處理）；解決  issue [`6]u] n. 問題；議題  prejudice [`pr5d.4d6s] n. 歧視；偏見  humorist [`hjum4r6st] n. 幽默作家；詼諧藝 術家 關鍵解析 Language Notes try one’s hand at 某人嘗試（做某事）； 某人動手嘗試（某事） • Kevin tried his hand at bowling, but he wasn’t very good. 凱文嘗試打保齡球，但是他打得並不是很好。 speak out against 公開反對 speak out 表示「大膽直言、公開表白」的意思。 • The politician often speaks out against the current health care system, saying it is bankrupting the country. 那名政治人物常公開反對目前的醫療體系，說它正 讓國家破產。 see A as B 將 A 視為 B • I see this job as a good opportunity to learn more about international business. 我將這份工作視為是學習更多國際商務的好機會。 If there were Animal Olympic Games, there would have to be three separate gold medals for speed. On land, a cheetah would sprint across the finish line first at a speed of 120 km/hr. In the sea, a sailfish would swim smoothly to victory at 110 km/hr. In the air, a peregrine falcon would blow away the competition by diving at 320 km/hr. These are the fastest animals on Earth. Cheetahs are truly built for speed. Their large nostrils and lungs take in more air when their breathing increases from 60 to 150 breaths per minute during a chase. Their long tails allow them to make sharp turns, and their spines work like springs. Light bones and strong muscles make them as quick as lightning. Their speed is what makes cheetahs great hunters on the plains of Africa. To catch their prey, they can accelerate from zero to 110 km/hr in three seconds. That’s quicker than a Ferrari, one of the fastest cars in the world! In the water, sailfish rule. They’re not only the fastest but also the weirdest-looking. They’re about three meters long and have sharp sword-like beaks and tall, sail-shaped fins. Their speed and ability to jump high above the water has made them a popular challenge in sportfishing. feathers on their heads, they look like they are wearing racing helmets. At over 300 km/hr, the falcon knocks its prey out cold in midair, then turns to grab the falling bird. Where do humans rank in this speed competition? With an average running speed of km/hr, we might only tie in a race with hippos or elephants. It is a good thing that the Olympic Games only include humans.","translation":"如果有動物奧運的話，在速度方面就得要有三面個 別的金牌。陸地上，獵豹會以時速一百二十公里率先 跑過終點線。在海裡，旗魚會以時速一百一十公里順 利取得勝利。而在空中，遊隼則會以時速三百二十公 里的速度俯衝而擊敗對手。這些都是地球上速度最快 的動物。 獵豹的確是為了速度而生。在追逐時牠們的呼吸每 分鐘從六十次增加到一百五十次時，而大鼻孔和肺會 吸入更多的空氣。牠們的長尾巴讓牠們能夠急轉彎， 而牠們的脊椎就像彈簧一樣。質輕的骨骼和強健的肌 肉讓牠們快如閃電。 獵豹的速度讓牠們成為非洲平原上的捕獵好手。 為了抓到獵物，牠們可以在三秒內從○加速到時速 一百一十公里。這可是比法拉利，世界上速度最快的 其中一款車還快！ 在水中，旗魚是老大。牠們不僅速度最快，也長得 最怪。牠們長約三公尺，有個像劍的魚吻和長長的、 像船帆的鰭。牠們的速度和跳升水面的能力讓牠們成 為垂釣的一項熱門挑戰。 遊隼是空中速度最快的生物。頭上的黑色羽毛讓牠 們看起來像是戴著競速安全帽。以超過時速三百公里 的速度，遊隼可在半空中將獵物擊昏，然後回頭去抓 跌落的鳥。 人類在這場競速中排名第幾呢？以平均二十五公里 的跑步時速，我們也許只能跟河馬或大象打成平手。 還好奧運只有人類比賽。","questions":[{"id":1,"prompt":"What is the main idea of the first paragraph?","options":{"A":"To introduce the first Animal Olympic Games","B":"To introduce the three fastest animals on Earth","C":"To show that the sailfish is the fastest animal in the world","D":"To compare the speed of three different animals"},"answer":"B"},{"id":2,"prompt":"Why are sailfish considered a popular challenge in sportfishing?","options":{"A":"Their meat is delicious.","B":"They’re quite huge and their beaks are like swords.","C":"They are fast and jump high above the water.","D":"They can dive at more than 300 kilometers per hour. 3 Label the picture of the cheetah with its features and how these help it to be the fastest land animal. The second one has been done for you."},"answer":"C"}]},{"number":13,"title":"All Things Pumpkin","zhTitle":"妙用無窮的南瓜","category":"Food and Health","article":"across North America, glowing faces appear. Some have scary grins, and others just look funny, but all of them are carved from pumpkins and are called jack-o’-lanterns. Jack-o’-lanterns didn’t start out being carved from pumpkins. In Great Britain and Ireland, long before people brought back pumpkins from the Americas, people carved scary faces onto turnips and put them outside their homes to keep spirits away. When these people moved to the Americas, they started using pumpkins because they were larger and easier to carve. Pumpkins are used for a lot more than just Halloween decorations. They are good for your health, too! The chemical that makes pumpkins orange helps fight against cancer and is useful for keeping your eyes healthy. The meat of the pumpkin is also low in fat, making it great for people who are worried about their weight. If you’ve carved some jack-o’-lanterns and have eaten your fill of pumpkin pie, what do you do with the rest of the pumpkins? How about tossing them into the air at the annual Punkin Chunkin contest? This contest got its start in 1986 when four friends in Delaware wanted to see who could get a pumpkin to fly the farthest. They built catapults to throw the pumpkins and had a marvelous time. The next year, a few more people took part. Now, tens of thousands of people come to watch catapults and cannons fire “punkins” through the sky. The next time you see a pumpkin at the grocery store, think about how useful it is. You can carve it up for Halloween, eat it to improve your health, or even use it to participate in a strange but fun competition. When it comes to pumpkins, the sky really is the limit.","translation":"每年十月，北美洲家家戶戶的窗戶上都會出現閃閃 發光的臉孔。有些露出嚇人的笑臉，有些則只是滑稽 好笑，不過它們全都是用南瓜刻出來的，被稱為空心 南瓜燈。 空心南瓜燈一開始並不是用南瓜來刻的。在英國 和愛爾蘭，早在人們從美洲帶回南瓜之前，就有人在 蕪菁上刻出嚇人的臉孔並把它們放在家門外以驅趕幽 靈。當這些人移居美洲後，他們開始用南瓜，因為南 瓜較大且比較好刻。 南瓜的用途很多，不只是萬聖節的裝飾品而已。它 們對健康也很有益處！讓南瓜呈現橘色的化學物質有 助於抗癌且對維持眼睛健康很有用。南瓜果肉的脂肪 含量也很低，使對擔心體重的人來說這就很棒。 如果你已刻了一些空心南瓜燈，也吃夠了南瓜派， 你要怎麼處理剩下的南瓜呢？參加年度拋南瓜大賽把 它們丟向天空怎麼樣？ 這項比賽始於一九八六年，當時美國德拉瓦州有四 個朋友想要知道誰能讓南瓜飛得最遠。他們建造了彈 射裝置來丟南瓜，玩得不亦樂乎。隔年多了好幾個人 加入。現在，有數萬人會前來觀賞彈射裝置和大砲把 「南瓜彈」射向空中的景象。 下次你在食品雜貨店看到南瓜時，想想它多有用 吧。你可以為萬聖節雕刻它、為了增進健康而吃它， 或甚至用它來參加一場奇特卻有趣的比賽。提到南瓜 時，總有無限的可能。","questions":[{"id":1,"prompt":"How is the annual Punkin Chunkin contest played?","options":{"A":"Contestants see who can eat the most pumpkin pies.","B":"Contestants see who can build the best catapult.","C":"Contestants see who can carve the best jack-o’-lantern.","D":"Contestants see who can get a pumpkin to fly the farthest."},"answer":"D"},{"id":2,"prompt":"What does “the sky really is the limit” in the last sentence mean?","options":{"A":"There are a lot of pumpkins in the world.","B":"There are many things you can do with a pumpkin.","C":"There are pumpkins that get shot into the sky.","D":"You can buy as many pumpkins as you want."},"answer":"B"},{"id":3,"prompt":"Why are pumpkins good for you? Choose the statements that are true, based on the article.","options":{"A":"The meat of the pumpkin is high in fiber.","B":"Eating pumpkins helps one lose weight faster.","C":"The chemical they contain helps fight against cancer.","D":"They make beautiful decorations inside the house. (E) They last long as lanterns to keep spirits away. (F) They can help improve your eyesight."},"answer":"C"}]},{"number":14,"title":"Some Food Facts to Chew On","zhTitle":"你吃了什麼？食物祕密大探究！","category":"Food and Health","article":"How much do you know about the foods you eat? Indeed, some foods might make you wonder each time you eat them. Consider Pop Rocks. If you’ve tried them, then you’ll know the popping sensation that they create in your mouth. This effect comes from the great pressure that Pop Rocks are made under, which locks gas inside. When we put these candies in our mouths, the sugar melts and the gas escapes, creating the interesting sound. Few people know that ketchup was once considered a medicine. In the 1830s, Dr. John Cook Bennett from Ohio reported tomatoes’ effectiveness in treating illnesses. Then, a salesman began selling tomato-based “medicine” with great success. Around the same time, the first tomato ketchup was created, and it became a hit in the West. Some foods aren’t what they appear to be. Take Pringles, for example. They may look like perfectly formed potato chips, but in fact, they’re only 42 percent actual potatoes. The rest of Pringles consists mainly of wheat starch and flour. For this reason, they don’t meet the definition of potato chips. Lastly, there’s a food that most of us have eaten: McDonald’s Chicken McNuggets. Perhaps not many people know that besides chicken, these Section 2 have a host of things not normally used in home cooking. One of these is a chemical that stops Chicken McNuggets from producing foam during the preparation process. As you can see, food can contain a lot of surprises. It’s always a good idea to know exactly what you are putting inside your body. Think about the foods you eat, and perhaps do some research on them to find out their health value. Food may never taste the same again.","translation":"你對於你吃下肚的食物了解多少？的確，有些食物 可能會讓你每次吃的時候都很納悶。 想想跳跳糖吧。如果你有嚐過，那麼你就會知道它 在你嘴裡產生的那種爆裂感。這種效果來自於跳跳糖 是在極大的壓力下製成的，這會把氣體鎖在裡頭。當 我們把這種糖果放進嘴裡，糖溶化後氣體就跑出來， 產生有趣的聲音。 很少有人知道番茄醬曾被視為藥物。在一八三○ 年代，俄亥俄州的約翰‧庫克‧班奈特博士公布了番茄 在治療疾病上的功效。之後，一位銷售員開始販售以番 茄為主要成分的「藥」而大獲成功。差不多在同一時 間，第一瓶番茄醬問世，在西方世界蔚為風潮。23 有些食物不是它們外表看起來的樣子。以品客洋 芋片為例。它們可能看起來像是外型完美的洋芋片， 但事實上，它們只有百分之四十二是真正的馬鈴薯。 品客洋芋片的其他成分主要包含小麥澱粉和麵粉。 基於這個理由，它們並不符合洋芋片的定義。 最後，有一種我們大部分的人都吃過的食物：麥當勞 的麥克雞塊。或許沒有很多人知道除了雞肉之外，這些 一口大小的雞塊含有很高比例的玉米和糖。它們也含有 很多平常家庭烹飪不會用到的東西。其中一項是一種可 以防止麥克雞塊在準備過程中產生泡沫的化學物質。 正如你所見，食物可能包含許多意想不到的東西。 確切知道你吃進身體裡的東西是什麼總是個不錯的 想法。想想你所吃的食物，或許對它們做些研究，找出 它們的健康價值。也許食物嚐起來再也不一樣了。","questions":[{"id":1,"prompt":"According to the article, which foods include sugar?","options":{"A":"Pop Rocks and Pringles","B":"Tomato Ketchup and Pringles","C":"Pop Rocks and Chicken McNuggets","D":"Pringles and Chicken McNuggets"},"answer":"C"},{"id":2,"prompt":"According to the article, which of the following is NOT true?","options":{"A":"McDonald’s Chicken McNuggets contain a chemical that prevents the nuggets from creating foam during the preparation process.","B":"Pringles don’t meet the definition of potato chips because the percentage of potato is under the requirement.","C":"When the first tomato ketchup was invented, it wasn’t popular in the West.","D":"Pop Rocks are made by locking gas inside, which creates the interesting sound when being eaten."},"answer":"C"}]},{"number":15,"title":"How Colors Affect Us","zhTitle":"你不知道的色彩祕密","category":"Science and Technology","article":"emotions. For example, if you “feel blue,” it means that you’re sad. A person who “sees red” is angry, and someone who’s “tickled pink” is happy about something. Besides expressing feelings, though, colors may also influence our actions. In Japan, officials have put in blue lights around railroad platforms to discourage people from jumping in front of trains. As a result, certain stations with blue lights have seen an 84 percent drop in suicide numbers. Pink has been believed to prevent violence. In the United States, jail cells were painted this color to calm prisoners. In sports, some visiting teams have had to use all-pink locker rooms, which were meant to weaken the teams and make them lose. Unlike pink, red may let you gain an upper hand in sports. In the 2004 Olympics, boxers who wore red were found to have a slightly higher chance of winning. Red is also believed to be the color of energy and power. The ways in which colors affect us may be a result of nature and evolution. Red is the color of fire and blood, so it is connected to life, appetite, and danger. Yellow describes sunny days and can make us feel energetic and happy, while blue relaxes us with images of the sea and sky. Other factors determining our reactions to colors are culture and history. In the past, purple dyes were difficult to come by, and only kings and nobles could afford them. As a result, the color became a royal symbol. Colors shape how we interpret the world. They are seen in all parts of life, and they can affect us in ways that we may not notice.","translation":"顏色常用來描述情緒。舉例來說，如果你「感覺藍藍 的」，那代表你很難過。「看見紅色」的人是在生氣， 而「被粉紅色逗笑」的人則因為某件事感到開心。不過 除了表達感覺之外，顏色也可能影響我們的行為舉止。 在日本，行政人員在鐵道月台周圍裝設藍燈以打消民 眾從火車前面一躍而下的念頭。結果，一些裝有藍燈的 車站輕生率下降了百分之八十四。 粉紅色據信能預防暴力。在美國，牢房漆上這種顏色 來讓囚犯冷靜。在體育活動方面，有些客隊必須使用全 都是粉紅色的更衣室，用意是要削弱該隊的戰鬥力，讓 他們輸球。 紅色與粉紅色不同，可能讓你在體育賽事中占上風。 在二○○四年的奧運中，發現穿紅色衣服的拳擊手獲勝 的機會略高。據信紅色也是代表活力和力量的顏色。 顏色對我們各方面的影響可能是自然和演化的結果。 紅色是火和血的顏色，所以它和生命、食慾及危險有 關。黃色用來形容晴天，可讓我們感到活力充沛且快 樂，藍色則以海洋和天空的意象讓我們放鬆。 其他決定我們對顏色反應的因素還有文化與歷史。在 過去，紫色染料不易取得，只有國王和貴族負擔得起。 結果，這種顏色就成為王室的象徵。 顏色影響我們如何詮釋這個世界。它們在生活的各個 層面都可以看到，而且會以我們可能沒注意的方式影響 我們。","questions":[{"id":1,"prompt":"How do we describe somebody who is feeling pleased?","options":{"A":"She is feeling blue.","B":"She is seeing red.","C":"She is tickled pink.","D":"She is becoming yellow."},"answer":"C"},{"id":2,"prompt":"Why did certain railway stations see a drop in suicide numbers in Japan?","options":{"A":"Officials painted the platform pink to make people calm.","B":"Officials painted the images of lights in blue around the platform.","C":"Officials put yellow paintings around the platform.","D":"Officials put in blue lights around the platform."},"answer":"D"}]},{"number":16,"title":"Mad about Memory?","zhTitle":"男女記憶大不同","category":"Science and Technology","article":"字彙 Vocabulary 1. suicide [`su4~sa6d] adj. 輕生的 n. 輕生 People think that the man may have killed himself, but no suicide note has been found. 2. violence [`va64l4ns] n. 暴力；暴力行為 Movies these days contain too much violence, according to my mother. 3. jail [d.el] n. 監獄（jail cell 指「監獄牢房」） The guards went around to each jail cell to look for hidden weapons. 4. weaken [`wik4n] v. 使變弱；削弱 The soldier’s body had been weakened badly by hunger and lack of water. . slightly [`sla6tli] adv. 輕微地；稍微地 Jane opened the door slightly to peek in the room. 6. energetic [%5n0`d.5t6k] adj. 精力旺盛的； 有活力的 The energetic puppy ran around in circles. 7. relax [r6`l1ks] v. （使）放鬆；（使身體部位） 鬆弛 A good massage can help relax your tired muscles in a short time. 8. determine [d6`t-m4n] v. 決定；是……的決 定因素 Hotel rates are determined by room type and travel period. 9. dye [da6] n. 染料 My mother used a red dye to change the color of her hair. . noble [`nob4l] n. 貴族 When the king had to go to war, he took his nobles with him to help fight. 11. afford [4`f7rd] v. 買得起；負擔得起 I really want to buy that car, and I hope to be able to afford it one day. 12. interpret [6n`t-pr4t] v. 詮釋；說明 The dancers interpreted the story of Romeo and Juliet with their ballet. ✍ 參考字彙與說明  tickled pink 為俚語，表「再高興不過了；很 樂意的」。  locker room 指的是體育館、游泳池等場所的 「更衣室」。  gain an upper hand 即「占上風；具有 優勢」的意思。  boxer [`b3ks0] n. 拳擊手 關鍵解析 Language Notes discourage sb from V-ing 勸阻某人做 某事；打消某人做某事的念頭 • Don’t let the weather discourage you from going out for some exercise. 不要讓天氣打消你出門運動的念頭。 • Jane’s parents discouraged her from seeing her new boyfriend. 珍的父母阻止她與新男友交往。 come by 取得、獲得（某種不易取得的東西）； 拜訪（某人住處） • How did you come by those concert tickets? They’ve been sold out for days. 你是怎麼弄到那些演唱會門票的？票好幾天之前就 賣完了。 • Some friends came by for dinner last night and stayed till midnight. 一些朋友昨晚過來吃晚餐，待到半夜才走。 124“You forgot once again, didn’t you?” Caroline asks as she glares at her boyfriend. Tom tries to remember if there was something important that he was supposed to do today, but his girlfriend only grows angrier. “It’s my birthday, you idiot!” Caroline says. “Why can’t you ever seem to remember a simple date?” This is a common scene in relationships. Recent studies have begun to show that there are scientific reasons behind the memory differences between men and women. Women score higher on tests for long-term episodic memory, and men do better with visuospatial memories. To put it more simply, women tend to hold on to memories about events, such as weddings, accidents, and everyday occurrences. Men, however, are better with tactical memories, like traveling directions and sports facts. In addition, if the memory involves faces, smells, or emotions, women usually remember more clearly. This explains why it’s more likely for a woman to remember the date of the first day a couple met. The way people remember has to do with how the brain processes and stores information. The part of the brain that deals with emotions is bigger for women, so it’s easy to understand that they would process memories of emotional events more easily. On the other hand, one directions technology sports facts smells anniversaries birthdays may be their larger space-perception brain area. With these differences, is it any wonder that men and women remember things differently? You shouldn’t use this new knowledge as an excuse for forgetting things, though. Instead, forget about memory misunderstandings and create special moments that everyone will enjoy remembering.","translation":"「你又忘記了，對吧？」卡洛琳邊瞪著男友邊問。 湯姆試著想今天是否有該做的重要事情，但他女友只 是越來越生氣。「今天是我生日，你這個白痴！」卡洛 琳說：「為什麼連一個簡單的日期你都記不得？」 這個場景在戀愛關係中很常見。最近的研究已開始 顯示男女之間的記憶不同背後是有科學根據的。女人 在長期情節記憶的測試所獲得的分數較高，而男人則 對視覺空間的記憶較好。 更簡單的說，女人常記住與事件有關的記憶，像是 婚禮、意外與每日發生的事件。然而，男人較擅長策略 性的記憶，像是旅行方向和運動資料。此外，如果和 臉孔、味道或情緒有關，女人通常記得比較清楚。 這解釋為什麼女人更可能記得情侶第一天相遇的日期。 人們記憶的方式與大腦處理和儲存訊息的方式有 關。女人腦部處理情緒的部分較大，所以她們更容易 處理情緒記憶便不難理解。另一方面，男人更精確地 記住方向和某些視覺細節的一個原因，可能和他們腦 部感知空間較大有關。 有了這些差異，男女記憶方式不同還會令人驚奇 嗎？不過，別用這個新知識當作忘記事情的藉口。反 之，忘掉記憶的誤解，創造每個人都會喜歡記得的特 別時刻吧。","questions":[{"id":1,"prompt":"What is the purpose of the article?","options":{"A":"To learn why women get upset when men forget something","B":"To show how men forget more easily than women","C":"To introduce how men and women remember differently","D":"To explain why women are more willing to remember things"},"answer":"C"},{"id":2,"prompt":"According to the article, what should you use this new knowledge for?","options":{"A":"Use it as an excuse for forgetting things","B":"Use it to increase your visuospatial memories","C":"Use it to recall certain visual details","D":"Use it to create memories that can be enjoyed by everyone"},"answer":"D"}]},{"number":17,"title":"Vincent van Gogh: Viewing the Man through His Art","zhTitle":"燃燒的靈魂：梵谷","category":"People","article":"Integrated Questions 126字彙 Vocabulary 1. scientific [%sa64n`t6f6k] adj. 科學的；應用 科學方法的 We used a scientific approach to solve the problem. 2. tend to [t5nd] [tu] v. 有……傾向（之後接 V.） Beth tends to eat very quickly, so she often finishes her meal before others. 3. involve [6n`v3lv] v. 需要、包含；牽涉到 This assignment involves only reading and no writing. 4. information [%6nf0`me]4n] n. 資訊；消息 The Internet totally changed the way people get information. . deal with [dil] [w6q] v. 處理；應付 Cole works in the department that deals with customer problems. 6. emotional [6`mo]4ny] adj. 情緒（上）的； 情感（上）的 Brian showed a lot of emotional strength when his wife became seriously ill. 7. recall [r6`k7l] v. 回憶起；回想起 Her style of dress recalls the fashion of the 1960s. 8. visual [`v6.4l] adj. 視覺的 The visual effects in the movie are amazing. 9. accurately [`1kj4r4tli] adv. 精確地 The woman accurately described the man who stole her purse. . misunderstanding [%m6s%9nd0`st1nd6;] n. 誤解 The mistake that the employee made arose from a misunderstanding of instructions. ✍ 參考字彙與說明  glare [gl5r] v. 怒目注視  idiot [`6di4t] n. 白痴  long-term episodic memory [`l7;`t-m] [%5p4`s3d6k] [`m5m4ri] n. phr. 長 期情節記憶  visuospatial memory [%v6.4wo`spe]4l] n. phr. 視覺空間記憶  occurrence [4`k-4ns] n. 事件  tactical [`t1kt6k4l] adj. 策略的  perception [p0`s5p]4n] n. 感知；察覺 關鍵解析 Language Notes it’s more likely . . . 的句型 likely 為形容詞，指「可能的」，likely 前面可加副詞 如more（更）、less（較不）來修飾。要表示「（某人） 可能（做某事）」，可用以下句型： It’s likely + for sb + to V. = It’s likely that + sb will + V. • It’s likely for Betty to have the book that you want. = It’s likely that Betty will have the book that you want. 貝蒂可能有你要的那本書。 have to do with 與……有關 A + have to do with + B 指「A 與 B 有關」，並可 視關係密切的程度，加上如 nothing/something/ much 等字來修飾。 • Peter said that the computer changes had nothing to do with him. 彼德說電腦變更跟他沒有關係。 • The way the dog can find people has something to do with smell. 狗可以找到人跟氣味有點關係。 • Kim’s decision to get a summer job had much to do with her desire to buy a nice smartphone. 金決定找暑期工作跟她很想買支好的智慧型手機 有很大的關係。 brightly blaze, swirling clouds in violet haze.” These are lyrics from the song “Vincent,” describing the famous paintings of Vincent van Gogh. Van Gogh started painting daily scenes from his Dutch village at the age of 27. The pieces were dark and realistic. Van Gogh moved to Antwerp in 1885. His brother Theo sent him money, but Van Gogh often spent it on art supplies instead of food. Poor and starving, he visited museums for ideas. The Japanese woodblock prints especially inspired him to use bold reds, blues, and greens in his paintings. In 1886, Van Gogh moved to Paris, where he was introduced to Impressionism and Pointillism. In 1888, Van Gogh moved to Arles, where he painted cafés and his sunflower series. In The Night Café, with its blood-red walls, Van Gogh tried to show “the powers of darkness” in a place where one can “go mad.” After fighting with his good friend Gauguin in Arles, Van Gogh cut off his own ear. His Self-Portrait with Bandaged Ear shows the bandaged ear and a great sadness in his eyes. As Van Gogh spent time in mental hospitals, he developed a distinctive style. Works like The Starry Night and Cypresses were painted in strong colors with thick, swirling brushstrokes. In 1890, he tried 128______ ______ Aged 27 1885 1886 1888 1890 ______ ______ ______ ______ ______ ______ Began painting. b to recapture childhood happiness by painting the northern scenes of his youth. However, the dark, stormy sky of Wheatfield with Crows shows that his depression was growing. That year, Van Gogh shot himself. His last words were “the sadness will last forever.” Although his life was cut short, Vincent van Gogh left a great legacy. Today, his three thousand works of art are treasured, and his style continues to influence art around the world.","translation":"「星光閃耀的夜晚。花朵如火焰般閃耀燃燒，紫羅 蘭色的雲霧迷濛如漩渦。」這是〈文森〉這首歌的歌 詞，描述的正是文森．梵谷的知名畫作。 梵谷在二十七歲時開始描繪荷蘭村莊的日常情景。 其作品顏色暗沈而寫實。梵谷在一八八五年搬到安特 衛普。他的弟弟西奧寄錢給他，但是梵谷常常把錢花 在美術用品而非食物上。又窮又餓的他會為了點子而 造訪博物館。日本木刻版畫尤其激發他在自己的畫中 使用醒目的紅色、藍色和綠色。一八八六年，梵谷搬 到巴黎，他在那裡接觸到了印象主義和點彩畫派（編 注：又稱為「新印象主義」。） 一八八八年，梵谷搬到亞爾，他在那裡畫了向日葵 和咖啡館系列畫作。在《夜間咖啡館》（The Night Café）這幅畫中，梵谷試圖以血紅的牆壁展現一個 足以令人「發瘋」的地方的「黑暗力量」。在亞爾 和他的好朋友高更爭吵後，梵谷割下自己的耳朵。他 的《耳朵包著繃帶的自畫像》（Self-Portrait with Bandaged Ear）呈現包著繃帶的耳朵和他眼中深沈的 哀傷。 梵谷待在精神病院那段期間發展出一種獨特的風 格。像《星夜》（The Starry Night）和《絲柏樹》 （Cypresses）等作品都是以厚實、漩渦般筆觸的強 烈色彩畫成。在一八九○年，他試著藉由描繪少年時 居住的北方場景來重拾童年的快樂。然而，《麥田群 鴉》（Wheatfield with Crows）畫中陰暗如暴風雨 前夕的天空顯示他的憂鬱症與日俱增。那一年，梵谷 舉槍自盡。他的遺言是：「悲傷將持續到永遠。」 雖然他的生命突然中止，文森．梵谷卻留下偉大的 遺產。今天，他的三千幅畫作都被珍藏著，而他的風 格則繼續影響世界各地的藝術。","questions":[{"id":2,"prompt":"How did Van Gogh feel toward the end of his life?","options":{"A":"He felt he had recaptured his childhood happiness.","B":"He felt very depressed toward the end of his life.","C":"He felt proud of the works he left behind.","D":"He felt valued by his lifelong friend."},"answer":"B"}]},{"number":18,"title":"Speed Walking to a Healthier You","zhTitle":"快走運動讓你更健康","category":"Sports and Entertainment","article":"Not many people realize that the sport of speed walking has been an Olympic event since 1904. Speed walking is an old competitive sport, and it’s also a great form of exercise for those who want to stay fit. Speed walking comes in many forms, but the basic movements are the same. The upper body is kept straight, and the arms bent at the elbows swing naturally. The hips turn to swing the legs forward, and most importantly, at least one foot should touch the ground at all times during your strides. The right pace to practice speed walking as a form of exercise is around five kilometers per hour. Those who are very fit can go up to six-and-a-half kilometers per hour. Speed walking may be one of the healthiest exercises today, and it even has some advantages over running. First, speed walking lets you burn slightly more calories than running does, so it may be better for weight loss. Second, a study has found that walking briskly is more effective than running for reducing the risk of heart disease, high blood pressure, and high cholesterol. Unlike running, which can create stress on the knees and ankles, speed walking is easy on the bones. Also, speed walking is great for building muscle tone. If you’re interested in taking up this sport, there are a few things that you should remember. Always warm up before you begin and cool down after you finish. Doing some gentle stretches before speed walking helps you avoid injuries. Likewise, doing Speed Walking to 18 a Healthier You the next day. With such great advantages, consider speed walking today. You might even go so far as to look for it in the next Olympics!","translation":"沒有多少人知道快走這項運動從一九○四年以來就 是奧運比賽項目。快走是一項歷史悠久的競賽運動， 對想要保持健康的人來說也是一種絕佳的運動。 快走有很多種形式，但基本動作是一樣的。上半身 要保持挺直，手臂在手肘處彎曲、自然擺動。臀部則 擺動讓雙腳向前邁進，而最重要的是，大步前進時隨 時都至少要有一隻腳接觸地面。 練習快走作為一種運動形式的合適步調約為每小時 五公里。非常健康的人每小時可以走到六點五公里。 快走也許是現今最健康的運動之一，甚至有一些勝過 慢跑的好處。首先，快走讓你消耗的卡路里略多於跑 步，所以對減重而言或許還更好。其次，研究發現， 在降低心臟病、高血壓及高膽固醇的風險方面，快步 行走比跑步更有效。快走不像跑步那樣可能對膝蓋和 腳踝造成壓力，對骨頭較無負擔。而且快走對雕塑肌 肉線條也非常好。 如果你有興趣開始從事這項運動，有幾件事情應該 要記住。在開始前一定要暖身，並且在結束後讓身體 緩和下來。在快走前做一些溫和的伸展運動能幫助你 避免受傷。同樣地，事後做伸展運動來緩和則表示你 隔天較不會肌肉痠痛。 有這麼多好處，現在就開始考慮快走吧。你甚至可 能會想在下屆奧運會上尋找它！","questions":[{"id":2,"prompt":"According to the article, which is NOT a benefit of speed walking?","options":{"A":"It can lessen the risk of high cholesterol.","B":"It can be helpful for losing weight.","C":"It won’t produce any stress on knees and ankles.","D":"It is a good way to build muscle tone."},"answer":"C"}]},{"number":19,"title":"Staying Squeaky-Clean with Soap","zhTitle":"肥皂歷史大公開","category":"Origins","article":"Integrated Questions A B C D 132字彙 Vocabulary 1. competitive [k4m`p5t4t6v] adj. 競爭（性） 的；好競爭的 Ken is very competitive; he likes to win. 2. elbow [`5l~bo] n. 手肘 Tommy hit his elbow on the desk when he sat down. 3. pace [pes] n. 步調；速度 When the hikers got tired, their pace slowed down a lot. 4. kilometer [k4`l3m4t0] n. 公里 It is about 345 kilometers from Taipei to Kaohsiung. . advantage [4d`v1nt6d.] n. 優勢；好處 There are many advantages to studying English from an early age. 6. calorie [`k1l4ri] n. （熱量單位）卡路里 When Angela is on a diet, she won’t eat foods that have a lot of calories. 7. risk [r6sk] n. 風險；危險 Investing money always involves some risks. 8. injury [`6nd.4ri] n. 傷害；損傷 The baseball player suffered many injuries last season. 9. afterwards [`1ft0w0dz] adv. 後來；之後 （也可拼成 afterward） Carol has an appointment; she said she’ll meet us afterwards. ✍ 參考字彙與說明  stride [stra6d] n. 一大步；步伐  briskly [`br6skli] adv. 輕快地；生氣勃勃地  heart disease [d6`ziz] n. 心臟病  high blood pressure [`pr5]0] n. 高血壓  high cholesterol [k4`l5st4~rol] n. 高膽固醇  muscle tone 可譯為「肌肉張力」，用在健身 時常譯為「肌肉線條」，與 muscle definition 意思相似。  likewise [`la6k~wa6z] adv. 同樣地  the Olympics 指「奧林匹克運動會」，又稱 作 Olympic Games。 關鍵解析 Language Notes up to 的不同意思與用法 1 表示「高達……；到……為止」，後接數字或時間點。 • The temperature yesterday went up to almost 38 degrees. 昨天的氣溫高達將近三十八度。 2 表示「在於；取決於」，用法為 sth be up to sb，表示「某事由某人決定、負責」。 • It’s not up to me to decide what’s best for Clark. 怎麼做對克拉克最好並不是由我來決定。 3 表示「勝任、有能力（做某事）」，後接名詞或 V-ing，常用在否定或疑問句。 • Stuart has the flu, so he’s not up to going out this afternoon. 史都華得了流感，所以他今天下午無法出門。 take up 的不同意義 1 表示「從事；開始進行（某嗜好、計畫、工作等）」， 之後接名詞或 V-ing。 • Lisa took up shell collecting after she came back from the beach. 莉莎從海灘回來之後就開始收集貝殼。 2 表示「占用；花費」，之後接空間、時間等名詞。 • Doing paperwork took up a lot of the teacher’s time. 文書工作占掉那位老師很多時間。 We use it every day, and it’s in every supermarket. It’s soap. But how did people start using soap and how is it made? The Origin of Soap The word “soap” comes from the Celtic word saipo, which means “fat,” the substance soap is made from. Soap dates back to 3,000 BC, when people in Mesopotamia used it for cleaning wool. Over the following centuries, soap continued to be used to clean everything but the human body. Using Soap to Bathe In the second century, a Greek doctor wrote about using soap to clean the body. However, bathing with soap was still not common. It wasn’t until the 17th century that soap was used for bathing in Europe, though a soap tax made it a luxury reserved for the wealthy. In the 19th century, the removal of this tax made soap available to most people. As a result, cleanliness improved in many places. How to Make Soap Soap isn’t hard to make. Simply take any alkali and mix it with fat or oil. Once it’s mixed, leave it in a mold until it becomes hard. After 24 hours, it’s ready to cut into pieces. However, the soap still needs around two to three weeks to cure before it can be used. Recycling Soap Every day, hotels throw away large amounts of soap. At the same time, many people can’t afford soap and other necessities. Seeing this need, an organization called Clean the World recycles used soap bars. It cleans, melts, and repackages them before sending them to people in need. It’s a great way to reduce waste and help make the world a better place. Easy to make, soap has helped humans stay clean for centuries. You could even say it’s the most important invention in human history, bar none.","translation":"我們每天都會用到它，而且它出現在每個超市裡。 它就是肥皂。但人們是怎麼開始使用肥皂，它又是怎 麼做出來的呢？ 肥皂的起源 soap（肥皂）這個字源自凱爾特語的 saipo，意思 是「脂肪」，也就是用來製造肥皂的物質。肥皂可追溯 至西元前三千年，當時美索不達米亞人用它來清潔羊 毛。在接下來的幾個世紀，肥皂持續被用來清潔人體 以外的所有東西。25 用肥皂沐浴 在西元二世紀，一位希臘醫生寫到用肥皂來清潔身 體。然而，用肥皂沐浴還是不常見。在歐洲，一直到 十七世紀時，肥皂才被用於沐浴，不過肥皂稅使肥皂 成為專門為有錢人所用的奢侈品。在十九世紀，取消 這項稅賦讓大部分人都可以取得肥皂。因此，在許多 地方清潔度都獲得了改善。 如何製造肥皂 肥皂不難製造。只要取任一種鹼類來跟脂肪或油混 合即可。一旦混合，就把肥皂放在模子裡直到變硬為 止。二十四小時後，就可以準備切塊。然而，肥皂還 需要大約兩、三週乾燥保存後才可以使用。 回收肥皂 旅館每天都丟棄大量的肥皂。另一方面，許多人 買不起肥皂和其他必需品。有個名叫「清潔全世界」 （Clean the World）的組織看到這項需求而回收使 用過的肥皂塊。它把這些皂塊清潔、融化並重新包裝 後再送去給需要的人。這是一個減少浪費和幫助世界 變成更美好地方的絕佳方法。 肥皂容易製造，幾百年來都幫助人類保持清潔。你 甚至可以說它是人類史上最重要的發明，無庸置疑。","questions":[{"id":1,"prompt":"Which of the following does Clean the World NOT do?","options":{"A":"Clean used soap bars","B":"Melt soap","C":"Sell recycled soap","D":"Send soap to people who need it"},"answer":"C"}]},{"number":20,"title":"Mars or Bust!","zhTitle":"火星任務，使命必達","category":"Science and Technology","article":"It is another beautiful morning on Mars. You have already enjoyed a breakfast of freeze-dried eggs. Now, with a special suit on, you can step outside of your home and watch the sun rise behind Olympus Mons, the tallest mountain in the entire solar system. Believe it or not, you—or your children—may be doing this in the near future. People have long been interested in the “Red Planet.” It has appeared in many legends and myths, and it has been featured in science fiction films, such as The Martian and Mission to Mars. It was really only in the last century that exploration of Mars began. At first, satellites were used to take pictures of the planet from afar. Then, probes were sent to land on the planet and take pictures of the surface. Now, rovers take pictures and collect soil samples. Some rovers have even discovered evidence of ice on Mars. Many scientists believe that Mars would make an excellent space colony since it is the closest planet to Earth. More importantly, evidence shows that Mars used to have liquid water, which would be vital for any settlement of earthlings. To make this dream a reality, NASA is using the Moon as a testing ground for living in space. If things go smoothly, people will land on Mars by 2037! believe a hundred more years are needed. Despite the possibility of there being a space colony, the biggest challenge may be getting people to and from the planet. Some researchers say bringing people back from Mars will be five times more expensive than sending them there. For the first explorers and colonists, it may be a one-way ticket to a new life on Mars!","translation":"又是一個在火星上的美麗早晨。你已經享用過冷藏 乾燥蛋做的早餐。現在，穿上特製服裝，你就可以踏 出家門，觀看從整個太陽系最高的山——奧林帕斯山 升起的日出。信不信由你：你，或你的孩子，可能在 不久的未來會這麼做。 人們長久以來對這個「紅色星球」深感興趣。它已經 在許多的傳奇故事和神話中出現過，而且它一直都是科 幻電影的主題，像是《絕地救援》和《火星任務》。 在上個世紀火星探索才真正開始。首先，從遠處用衛 星來拍攝星球的照片。然後，太空探測器被送上火星， 拍攝地表照片。現在，火星探測車拍照並採集泥土樣 本。有些探測車甚至已發現火星上有冰的證據。 許多科學家認為由於火星是最接近地球的星球， 它可以成為絕佳的太空殖民地。更重要的是，證據顯示 火星曾經有液態水，這對任何地球人移居而言是至關重 要的。 為了使這個夢想成真，美國航太總署正利用月球作 為在太空生活的測試地點。如果情況順利的話，人類將 在二○三七年前登陸火星！歐洲太空總署則努力要在 二○三五年達成，然而俄國科學家認為要達到這個目標 還需要再一百年。 儘管有太空殖民的可能性，最大的挑戰或許是如何 讓人往返火星。有些研究人員說，把人類從火星帶回來 會比送他們到那裡貴五倍。對第一批探險者和開拓者來 說，到火星的新生活可能是張單程票！","questions":[{"id":1,"prompt":"Why do scientists feel that Mars would make a great space colony?","options":{"A":"It has a lot of water.","B":"It is close to Earth.","C":"It is about the same size as Earth.","D":"It has the same temperatures as Earth."},"answer":"B"},{"id":2,"prompt":"What is the main idea of the article?","options":{"A":"The technology used to explore Mars","B":"The first signs of life on Mars","C":"The first Mars colonists","D":"The exploration and future colonization of Mars"},"answer":"D"}]},{"number":21,"title":"Tom Holland: From Ballet to Spider-Man and Beyond","zhTitle":"湯姆 ‧ 霍蘭德：從芭蕾到蜘","category":"People","article":"signed him up for hip-hop dance classes, she never imagined this would be the path to Hollywood. When Holland was ten years old, he auditioned for Billy Elliot: The Musical, a play about a boy who becomes a ballet dancer. 2He landed a part even though he didn’t know ballet. After only two months of performing, he was given the title role. This was Holland’s big break. 3By the time Holland was 16, he was getting major parts in films, but he didn’t feel successful. His mom even sent him to carpentry school in case acting didn’t work out. However, at the age of 19, he got the offer of a lifetime—a six-picture deal to play Spider-Man in the Marvel Cinematic Universe. Today, everyone knows Holland as Peter Parker, one of Marvel’s superheroes. Thanks to his dance background, he’s able to perform all of his own stunts. 4When Spider-Man does a backflip, that’s Holland showing off his own amazing abilities. 5Although Spider-Man is a huge role, Holland doesn’t want it to define his whole career. That’s why Holland has crime, adventure, and science fiction films all coming up. He hopes that he will eventually move on to directing. In fact, he already has some film ideas in the works. 1406Besides acting, Holland runs a charity with his parents and brothers, The Brothers Trust. The organization raises money for charities that don’t get much public attention. For someone who’s only years old, Holland sure has made his mark on popular culture. 7As he swings into the next chapter of his cinematic career, Tom Holland is out to show the world that you don’t need to be Spider-Man to be spectacular.","translation":"蛛人，不斷挑戰自我 湯姆．霍蘭德的母親一直都知道他具有明星的才 能。但她替他報名嬉哈舞蹈課時，她從未想過這會是 通往好萊塢的路。 霍蘭德十歲那年，他去試鏡了《舞動人生音樂 劇》，這是關於一個男孩成為芭蕾舞者的一齣戲。雖然 霍蘭德對芭蕾一竅不通，他還是得到了一個角色。只 表演兩個月，他便得到劇名的角色。這是霍蘭德的大 好機會。 到了霍蘭德十六歲時，他已得到電影中的重要角 色，但他並不覺得自己成功。他母親甚至送他去木工 學校，以防演藝工作不順遂。然而，在十九歲時，他 得到了千載難逢的工作邀約——在「漫威電影宇宙」 中飾演蜘蛛人的六部電影合約。 今天，每個人都知道霍蘭德是彼得．帕克，他是漫 威英雄之一。由於他的舞蹈背景，他能夠在電影裡親 自演出他所有的特技動作。當蜘蛛人後空翻時，那是 霍蘭德在展現自己令人讚嘆的能力。 雖然蜘蛛人是一個重大的角色，但霍蘭德並不想讓 這個角色將他的整個職涯定型。這就是為什麼霍蘭德 還將有犯罪、冒險甚至科幻片要上映。他希望自己最 終會走向導演。事實上，他已有一些電影的想法在籌 劃中。 除了演戲之外，霍蘭德還與父母及兄弟一起經營一 個慈善機構：兄弟互信基金會。這個組織是為那些不 受大眾關注的慈善機構募款。26 對於一個年僅二十五歲的人來說，霍蘭德確實對流 行文化產生深遠的影響。隨著湯姆．霍蘭德跳入電影 事業的下一個篇章，他要向世人展示你不需要是蜘蛛 人也可以很出色。","questions":[{"id":1,"prompt":"What event directly led to Holland getting major parts in films?","options":{"A":"He landed the part of Spider-Man.","B":"He started taking hip-hop dance lessons.","C":"He followed his dream of becoming a ballet dancer.","D":"He played Billy Elliot in a musical."},"answer":"D"},{"id":2,"prompt":"Besides Spider-Man films, what kinds of upcoming films will Holland be starring in, according to the article?","options":{"A":"Tom Holland was cast as Spider-Man in a Marvel film.","B":"Tom Holland landed a part in Billy Elliot: The Musical.","C":"Tom Holland attended carpentry school.","D":"Tom Holland’s mom signed him up for hip-hop dance classes. __________ → __________ → __________ → __________ 4 The article contains seven numbered sentences. Which sentence best demonstrates the author’s attitude toward Tom Holland? Write the number below. __________ 解答請參考別冊 第 26 頁"},"answer":"D"}]},{"number":22,"title":"The Great Food Debate","zhTitle":"基改食物爭論","category":"Food and Health","article":"Did you know that most of the processed foods sold in the United States contain some genetically modified (GM) ingredients? Most people don’t realize how big a part GM foods play in our lives, and they wouldn’t be happy to hear it. When scientists play with genes, unexpected things can happen to people and the environment. For example, one type of GM corn can cause people to become sick, so it was fed only to livestock. However, some of the corn ended up in dishes at restaurants, and almost people reported reactions to it. GM crops can negatively affect the environment, too. Scientists modified plants to be resistant to weed spray so that farmers could spray their crops and kill only weeds. Some wild plants picked up this ability and became superweeds, which farmers are unable to stop from taking over their fields. GM crops that are toxic to crop-eating bugs can also kill nontarget insects like butterf lies. If GM crops are such a bad idea, why are 14 million farmers around the world growing them? The GM supporters claim that the environment benefits from GM crops. Take pest-resistant corn, for example. Farmers who grow this won’t have t
