<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>福音聯盟文章整理</title>
<style>
:root{
  --bg:#f6f4ef;--panel:#ffffff;--ink:#22201c;--muted:#6f6a60;--line:#e3ded3;
  --accent:#8a5a2b;--accent-soft:#f3e7d8;--chip:#efebe3;
  --c1:#3f6e8c;--c2:#7a5c96;--c3:#3d7a5a;--c4:#a3622f;--c5:#9a3f4f;--c6:#5c6b2f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1916;--panel:#24221e;--ink:#ece7dd;--muted:#a39d90;--line:#3a3731;
    --accent:#d7a46c;--accent-soft:#3a2f22;--chip:#2f2c27;
    --c1:#7fb0cf;--c2:#b79ad3;--c3:#7cc29b;--c4:#e0a06a;--c5:#de8a98;--c6:#b3c278;
  }
}
:root[data-theme="dark"]{
  --bg:#1a1916;--panel:#24221e;--ink:#ece7dd;--muted:#a39d90;--line:#3a3731;
  --accent:#d7a46c;--accent-soft:#3a2f22;--chip:#2f2c27;
  --c1:#7fb0cf;--c2:#b79ad3;--c3:#7cc29b;--c4:#e0a06a;--c5:#de8a98;--c6:#b3c278;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.7 "Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
.top{display:flex;gap:10px;align-items:center;max-width:1300px;margin:0 auto}
h1{font-size:17px;margin:0;white-space:nowrap}
#q{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font-size:15px}
#q:focus{outline:2px solid var(--accent);border-color:transparent}
.count{color:var(--muted);font-size:13px;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;max-width:1300px;margin:8px auto 0}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--panel);border-color:var(--accent)}
main{display:grid;grid-template-columns:340px 1fr;gap:16px;max-width:1300px;margin:0 auto;padding:16px}
#list{position:sticky;top:110px;max-height:calc(100vh - 126px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.item{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover{background:var(--accent-soft)}
.item.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.item b{display:block;font-size:14.5px;line-height:1.45}
.item small{color:var(--muted);font-size:12px}
#view{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:14px}
.meta{color:var(--muted);font-size:13px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{background:var(--chip);border-radius:6px;padding:1px 8px;font-size:12px;color:var(--muted);cursor:pointer}
h2{font-size:22px;line-height:1.4;margin:4px 0 6px}
h3{font-size:15px;margin:0 0 12px;color:var(--accent);letter-spacing:.05em}
.sum{font-size:15.5px}
ul.pts{margin:10px 0 0;padding-left:1.2em}
ul.pts li{margin:3px 0}
/* mind map */
.mm{display:flex;flex-direction:column;align-items:center}
.mm-c{background:var(--accent);color:var(--panel);font-weight:700;padding:10px 22px;border-radius:999px;font-size:16px;text-align:center}
.mm-stem{width:2px;height:18px;background:var(--line)}
.mm-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;width:100%;border-top:2px solid var(--line);padding-top:16px;position:relative}
.mm-b{border:2px solid var(--bc);border-radius:12px;padding:8px 10px;background:var(--panel);position:relative}
.mm-b:before{content:"";position:absolute;top:-18px;left:50%;width:2px;height:16px;background:var(--line)}
.mm-b > div{font-weight:700;color:var(--bc);text-align:center;margin-bottom:6px}
.mm-b span{display:block;font-size:13.5px;padding:3px 8px;margin:4px 0;border-radius:6px;background:var(--chip)}
/* framework */
.fw{display:flex;flex-direction:column;gap:0}
.fw-s{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.fw-n{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;border:2px solid var(--accent)}
.fw-box{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--panel)}
.fw-box b{color:var(--accent);margin-right:8px}
.fw-ar{width:34px;text-align:center;color:var(--muted);line-height:1;height:18px;font-size:13px}
/* quotes */
.qs{display:grid;gap:10px}
.qt{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 10px 10px 0;font-size:16px}
.note{color:var(--muted);font-size:12px;margin-top:10px}
/* facebook post */
.fb-cover{aspect-ratio:1/1;max-width:420px;border-radius:14px;background:linear-gradient(150deg,#2b2118,#6b4423 55%,#b07a3e);color:#fbf3e6;display:flex;flex-direction:column;justify-content:center;padding:34px;margin:0 auto 14px;font-family:"Noto Serif TC","PMingLiU",serif;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.fb-cover .h{font-size:26px;line-height:1.5;font-weight:700;white-space:pre-line}
.fb-cover .bar{width:48px;height:3px;background:#e8c48c;margin:18px 0}
.fb-cover .s{font-size:14px;opacity:.85;line-height:1.6}
.fb-text{white-space:pre-wrap;font-size:15.5px;line-height:1.95;background:var(--chip);border-radius:10px;padding:16px 18px}
.fb-act{display:flex;gap:8px;justify-content:flex-end;margin:0 0 10px}
.empty{color:var(--muted);padding:30px;text-align:center}
mark{background:#f5d97a;color:inherit;border-radius:2px}
#back{display:none}
.tbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
@media (max-width:820px){
  main{grid-template-columns:1fr;padding:12px 16px}
  #list{position:static;max-height:none}
  body.detail #list{display:none}
  body:not(.detail) #view{display:none}
  body.detail #back{display:inline-block;margin-bottom:10px}
  h1{display:none}
  .card{padding:16px}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>福音聯盟文章整理</h1>
    <input id="q" type="search" placeholder="搜尋標題、作者、標籤、摘要、金句…" autocomplete="off">
    <span class="count" id="count"></span>
    <button class="tbtn" id="theme" title="切換深淺色">◐</button>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main>
  <nav id="list"></nav>
  <section id="view"></section>
</main>
<script>
const DATA = [{"id":23343,"slug":"losing-mom-one-memory-at-a-time","title":"媽媽的記憶一點點消逝","date":"2026-10-18","author":"Tim Thornborough","cats":["基督徒生活"],"tags":["苦難","盼望","詩歌","阿爾茲海默"],"sum":"作者探望罹患阿爾茲海默症的母親，描述她的記憶不斷倒退到二戰年代，自己只能陪伴與安慰。在療養院裡，他看見一位幾乎失去自我的老人仍唱著從小熟悉的詩歌，由此領悟：平日反覆唱誦、默想的福音真理，會在人最軟弱時成為支撐。他決心更珍惜主日唱詩，並為母親禱告，求她在最後的日子仍經歷神的恩惠慈愛。","pts":["失智症讓人退回過去，家人在對方仍在世時就開始哀傷","失智的長者仍可能保有深植心中的詩歌與信仰","主日唱詩不只為當下，也是為將來的幽谷儲備力量","陪伴、握手、親吻額頭，是愛最樸實的表達","詩篇23篇的應許：恩惠慈愛一生隨著我們"],"mm":{"c":"記憶消逝中的信仰","b":[["失智的殘酷",["時光倒流","性情逐漸被磨損","生前的哀傷"]],["深藏的福音",["老人唱舊詩歌","主仍緊握著他","真理扎根心底"]],["對我的提醒",["珍惜主日唱詩","詩歌是預備的幫助","堅忍到底"]],["陪伴與禱告",["握手、親吻額頭","角色互換的愛","詩23:6的應許"]]]},"fw":[["情境","探望失智母親的日常對話"],["觀察","病情使她退回1943年的記憶"],["轉折","療養院裡老人唱出福音詩歌"],["反思","反覆唱誦的真理會在軟弱時托住人"],["回應","珍惜唱詩，為母親禱告"]],"q":["當記憶一一剝落，神的手仍然沒有鬆開。","今天唱的詩歌，可能就是明天走過幽谷的燈。","愛有時只是坐在旁邊，握住那雙手。"],"fb":null},{"id":23341,"slug":"overlooked-apologetics-strategy","title":"繞過「警覺的巨龍」：路易斯的隱性護教","date":"2026-10-18","author":"Timothy Paul Jones","cats":["文化与艺术","凯勒文化护教中心"],"tags":["文學","文化使命","寫作","凱勒文化護教中心","C. S. 路易斯","文化護教學"],"sum":"本文介紹C. S. 路易斯所提倡、作者稱為「隱性護教」的策略：與其只寫更多直接為信仰辯護的書，不如讓基督徒在各個專業領域寫出通俗又嚴謹的好作品，讓信仰自然隱含其中。路易斯觀察到現代人多半是不知不覺吸收了反宗教預設，他自己的離信與回轉也都受隱含預設影響。作者提出實踐標準：通俗易懂、準確可靠、不以直接論證信仰為主題，並強調隱性護教補充而非取代直接護教。","pts":["人的世界觀多半是被書中隱含的預設慢慢塑造","路易斯稱之為「攻擊敵人的交通線」","需要更多基督徒寫「其他主題的小書」，信仰隱含其中","標準：通俗、準確、不扭曲事實、不直接講道","教會可裝備各領域專業人士成為隱性護教者","隱性護教如鞋中的石子，留下讓人重新思考的問題","直接護教仍不可少，兩者相輔相成"],"mm":{"c":"隱性護教","b":[["問題診斷",["聽眾被環境預設塑造","唯物主義來自隱含觀念","直接辯護效果有限"]],["路易斯的經歷",["少年因隱含預設離信","麥克唐納作品預備他的心","晚年以小說與象徵為呼召"]],["實踐標準",["通俗易懂","準確可靠","信仰隱含不明說"]],["具體應用",["各學科專業人士","基督徒入門讀物","詩歌與文學創作"]],["平衡",["不取代直接護教","需要耐心與信心","留下問題如鞋中石子"]]]},"fw":[["提問","為何更少護教內容反而更有效？"],["診斷","現代人被隱含預設塑造"],["例證","路易斯的離信、回轉與《人之廢》"],["方案","通俗準確、信仰隱含的作品"],["應用","教會、出版、大學的可能做法"],["結論","隱性與直接護教並行"]],"q":["真正塑造人的，常常不是書的主題，而是書背後沒說出口的預設。","讓最好的入門書總出自基督徒之手，本身就是一種見證。","護教不一定以決志收尾，也可以只留下一顆揮之不去的小石子。"],"fb":null},{"id":23339,"slug":"wendell-berry-change-you","title":"當心，溫德爾·貝瑞會改變你","date":"2026-10-17","author":"Jeffrey Bilbro","cats":["文化与艺术"],"tags":["道成肉身","文學","詩歌","復活","溫德爾·貝瑞"],"sum":"作者紀念剛離世的溫德爾·貝瑞，指出他之所以深刻改變許多基督徒的生活，是因為他努力想像道成肉身的神受死與復活如何改變大至宇宙、小至日常的一切，並身體力行。貝瑞待人寬厚又持守堅定，歡迎讀者與他辯論。文章以小說《傑伯·克羅》中對約翰福音3:16的默想，以及一首回應復活畫作的詩為例，說明他如何讓教義變得具體可感。","pts":["貝瑞的影響跨越宗派與政治立場","讀他的作品常使人實際改變生活方式","他歡迎批判，認為讀者不該全盤同意作者","《傑伯·克羅》：神在伯利恆之前就愛這個破碎的世界","復活的詩：不是我們看基督，而是發現自己在祂注視中","基督復活是萬物更新的根基"],"mm":{"c":"溫德爾·貝瑞的影響","b":[["核心",["想像道成肉身與復活","落實在日常生活"]],["改變人生",["搬家、轉行、種菜","照顧父母、與鄰舍交談"]],["為人",["寬厚待人","持守堅定","歡迎辯論"]],["小說例子",["傑伯·克羅","神愛原本的世界","愛如一次釘十字架"]],["詩歌例子",["皮耶羅的復活畫","被基督注視而醒來","受造界一同更新"]]]},"fw":[["引言","貝瑞離世與各界致敬"],["論點","他想像並活出復活帶來的改變"],["特質","寬厚而堅定的對話態度"],["例一","小說中對神之愛的默想"],["例二","安息日詩中的復活凝視"],["結語","讀貝瑞要當心，你可能被改變"]],"q":["好的作品不只讓人點頭，而是讓人起身改變生活。","神愛的不是理想中的世界，而是此刻這個破碎的世界。","我們以為自己在看基督，其實一直在祂的注視之中。"],"fb":null},{"id":23337,"slug":"from-sinkholes-to-satisfaction","title":"從大地塌陷到心靈滿足","date":"2026-10-15","author":"Dave McDonald","cats":["信仰与工作"],"tags":["詩篇","恩典","知足","服侍"],"sum":"可拉因嫉妒與驕傲悖逆摩西而被大地吞噬，但民數記26章記載「可拉的眾子沒有死亡」，因為他們聽從警告、離開父親的帳棚。後來可拉的後裔在聖殿看門並負責音樂事工，寫下多篇詩篇。詩篇84篇「寧可在神殿中看門」正映照出他們與先祖不同的選擇：以神為滿足。作者勸勉讀者在心生不滿時回到這篇詩，在基督裡尋得真正的知足。","pts":["可拉的悲劇警告服侍中的嫉妒、驕傲與自憐","可拉的眾子選擇離開惡行而存活","神保守他們的家族，讓服侍代代延續","詩篇84篇與他們的家族歷史深刻呼應","真正的福分在於與神同在","我們能進入神殿，全因受膏者耶穌"],"mm":{"c":"從塌陷到滿足","b":[["可拉的結局",["嫉妒與驕傲","大地裂開審判"]],["可拉的眾子",["聽從警告","離開惡人帳棚","得以存活"]],["新的服侍",["聖殿看門","音樂事工","寫下詩篇"]],["詩篇84篇",["寧可在神殿看門","以神為日頭盾牌","受膏者的垂顧"]],["應用",["心生不滿時讀詩84","不羨慕別人的事工","單單信靠神"]]]},"fw":[["懸念","可拉滅亡了，為何有可拉後裔的詩？"],["經文解答","民26章：可拉的眾子沒有死"],["發展","從看門到音樂事工"],["默想","詩84篇的家族意涵"],["福音","受膏者基督使我們得以進殿"],["禱告","求神使我們以祂為滿足"]],"q":["同一個家族，可以因一個選擇走上完全不同的路。","在神殿看門的卑微，勝過惡人帳棚裡的風光。","「這是我應得的」，往往就是不知足的開始。"],"fb":null},{"id":23333,"slug":"sinkholes-and-servant-hearts","title":"塌陷的大地，僕人的心","date":"2026-10-15","author":"Dave McDonald","cats":["信仰与工作"],"tags":["謙卑","知足","服侍","民數記","嫉妒"],"sum":"作者指出嫉妒、比較與「我應得更多」的心態普遍潛伏在基督徒和服侍者心中，並舉多個教會實例。民數記16章的可拉不滿只在外圍服侍，帶眾人挑戰摩西亞倫，神使大地開口吞沒他們，顯示服侍是恩典而非權利。與可拉相反，耶穌雖無罪卻甘願降卑、洗腳、受死，為我們留下僕人的榜樣。文末以腓立比書2章提出自省問題。","pts":["嫉妒會傷害事工、破壞關係、連累教會","可拉的問題是對神安排的不滿與抗拒","服侍神是殊榮，不是靠功勞換來","神是輕慢不得的，教會中容不下紛爭與驕傲","耶穌與可拉相反：順服、謙卑、甘願卑微","在基督裡知足，才能關心他人需要"],"mm":{"c":"僕人的心","b":[["嫉妒怪獸",["比較與抱怨","覺得理所應得","教會中的實例"]],["可拉",["外圍職責的不滿","聚眾挑戰摩西","對神的抗拒"]],["審判",["大地塌陷","服侍是恩典","神不欠我們"]],["耶穌",["無罪卻降卑","洗門徒的腳","代替不義者受死"]],["自省",["在基督裡知足嗎？","看別人比自己強","放下掛慮關心人"]]]},"fw":[["問題","每個人心裡都有嫉妒"],["案例","民16章可拉的悖逆"],["審判","大地吞沒悖逆者"],["對照","耶穌的謙卑與順服"],["應用","腓2章的自我省察"]],"q":["服侍的位置是恩典的禮物，不是爭來的地盤。","嫉妒不只是小情緒，常是對神安排的抗議。","耶穌本可擁有一切，卻選擇彎腰洗腳。"],"fb":null},{"id":23327,"slug":"baptist-forebears-blasphemy-laws","title":"浸信會先輩爲何反對用世俗法律懲罰褻瀆上帝的人？","date":"2026-10-13","author":"Matt Martens","cats":["社会与时事"],"tags":["政教關係","宗教自由","浸信會","褻瀆法"],"sum":"針對莫勒一度主張政府可懲罰褻瀆（後已撤回）的爭議，作者梳理歷史：褻瀆罪源於英國政教合一背景，1676年泰勒案確立為普通法罪行；而浸信會自赫爾維斯起便主張良心自由，《倫敦浸信會第二信條》刪除授權政府懲罰異端的條文。美國經長老會修訂信條與第一修正案，褻瀆罪逐漸消失。美南浸信會信條始終主張政教分離。作者認為要求宗教認同作為公職條件，正是浸信會歷來反對的宗教審查。","pts":["英國褻瀆罪與國教制度、迫害不從國教者密切相關","浸信會傳統：唯獨神是良心的主","倫敦浸信會信條刪除政府懲罰異端的條文","美國長老會1787年也修訂相關條文","美南浸信會信條：國家無權因宗教觀點施加懲罰","宗教認同作為公職條件即是宗教審查","在敵視基督教的文化中，自由言論同樣保護福音"],"mm":{"c":"浸信會與褻瀆法","b":[["英國背景",["至尊法案與國教","克拉倫登法典","1676年泰勒案"]],["浸信會立場",["赫爾維斯：良心自由","倫敦第二信條","刪除懲罰異端條文"]],["美國歷程",["殖民地多有褻瀆罪","羅得島例外","第一修正案"]],["美南浸信會",["信仰與信息","政教分離","反對褻瀆法決議"]],["評析",["宗教認同=宗教審查","偏離浸信會傳統","自由保障傳福音"]]]},"fw":[["事件","莫勒支持褻瀆法後撤回"],["歷史一","英國國教與褻瀆罪"],["歷史二","浸信會的另一條路"],["歷史三","美國憲法與各州演變"],["教派立場","美南浸信會的一貫原則"],["結論","支持褻瀆法偏離傳統且不智"]],"q":["當信仰成為公職門檻，迫害就只差一步。","唯獨神是良心的主，這是浸信會四百年的見證。","今天捍衛別人說話的自由，就是保住明天傳福音的自由。"],"fb":null},{"id":23325,"slug":"who-are-144000-revelation","title":"讀懂《啓示錄》：十四萬四千人是誰？","date":"2026-10-13","author":"Benjamin L. Gladd","cats":["圣经与神学","卡森神学更新中心"],"tags":["末世","末世論","啓示錄","數字","卡森中心"],"sum":"本文探討啟示錄7章十四萬四千人的身份。時代論者多按字面理解為實際的猶太人；作者採救贖歷史理想派進路，指出啟示錄中的數字普遍具象徵性。十二支派名單的順序與成員經過刻意調整，突顯出自猶大的耶穌掌權、被排斥者得接納、拜偶像者被排除。12×12×1000象徵屬神的全體教會，而按支派計數呼應民數記的軍隊統計，描繪一支彌賽亞軍隊——他們以受苦中持守見證的方式，效法羔羊得勝。","pts":["耶和華見證人與時代論都按字面理解","啟示錄的數字普遍帶有象徵（如七靈、二萬萬）","十二支派名單：猶大居首、但被移除","144,000 = 12×12×1000，象徵全體教會","人口統計呼應民數記，象徵彌賽亞的軍隊","教會的得勝方式是在苦難中持守見證"],"mm":{"c":"十四萬四千人","b":[["不同解讀",["耶和華見證人","時代論字面解","救贖歷史理想派"]],["數字象徵",["猶太啟示文學特色","七靈指聖靈","二萬萬非實數"]],["支派名單",["猶大居首","但被移除","妾所生支派提前"]],["數字意涵",["12×12×1000","真以色列＝教會","彌賽亞軍隊"]],["應用",["效法羔羊得勝","苦難中持守見證"]]]},"fw":[["問題","十四萬四千人是誰？"],["觀點比較","字面解 vs 象徵解"],["方法","啟示錄數字的象徵性"],["經文分析","支派名單的異常順序"],["象徵解讀","全體教會與彌賽亞軍隊"],["應用","循基督的道路得勝"]],"q":["啟示錄的數字是畫，不是帳簿。","神的軍隊不靠刀劍，而是靠在苦難中不放棄見證。","羔羊怎樣得勝，跟隨祂的人也怎樣得勝。"],"fb":null},{"id":23323,"slug":"four-misconceptions-four-senses","title":"關於聖經「四義」的四個誤解","date":"2026-10-12","author":"Patrick Schreiner","cats":["圣经与神学","卡森神学更新中心"],"tags":["宗教改革","釋經","教父","卡森中心","四重含義"],"sum":"福音派近年重新關注教父釋經，而「四義」（文字義、寓意、道德義、末世義）是前現代主要的解經框架。作者澄清四個誤解：四義並不排斥文法歷史意義，反以文字義為根基；四義不是四個獨立含義，而是統一含義在救贖歷史中逐層顯明；改教家並未全盤譴責四義，只是要求緊扣文字義；寓意也不等於任意發揮，好的靈意解讀有新約根據。作者主張以明確標準分辨，從古人身上學習也拒絕其錯誤。","pts":["四義：文字、寓意（基督）、道德、末世","文字義居首，是其餘三義的根基","忽略文字義會導致寓意化、道德化或一味未來化","經文含義是統一的，在救贖歷史中逐步展開","路德、加爾文等改教家仍有屬靈層面的解讀","保羅自己也稱其釋經為「寓意」（加4:24）","需要標準分辨有根據與主觀聯想的解讀"],"mm":{"c":"聖經四義","b":[["四義內容",["文字義","寓意：關乎基督","道德義：生活","末世義：成全"]],["誤解一",["以為排斥歷史文法","實則以文字義為根基"]],["誤解二",["以為四個含義","實為統一含義逐層顯明"]],["誤解三",["以為改教家譴責","實則要求緊扣文字義"]],["誤解四",["以為任意發揮","好的寓意有新約根據"]]]},"fw":[["背景","福音派重新關注教父釋經"],["定義","四義的內容"],["澄清1–2","文字義為本、含義統一"],["澄清3–4","改教家立場與寓意的界線"],["結論","有分辨地向古人學習"]],"q":["先讀懂經文說了什麼，才能看見它指向何方。","屬靈意義是文字意義的延伸，而不是取代。","古人犯的錯和我們不同，所以值得向他們學習。"],"fb":null},{"id":23321,"slug":"retrieve-past-retain-truth","title":"重拾傳統，持守真理","date":"2026-10-11","author":"R. Lucas Stamps","cats":["教会事工","卡森神学更新中心"],"tags":["政治神學","教會歷史","傳統","卡森中心"],"sum":"福音派近年興起「神學回溯」，重新從教父、中世紀與改教傳統汲取養分，例如在三一論爭議中回到尼西亞信經。有人進一步想恢復歷史上的政治神學，作者提出四點建議：分清教義輕重，政治神學不及三一論核心；認識傳統內部本就多元，不宜奉某個黃金時代為標準；避免拿傳統為既定立場背書；有取有捨，唯有聖經擁有最高權威，可肯定前人貢獻也指出其罪與錯。","pts":["神學回溯已結出美好果實，如重申尼西亞三一論","教義有輕重之分，推導越遠越需謹慎","政治神學內部原則重於具體應用","基督教傳統是多種傳統，而非單一","回溯不是復古，歷史既非一路進步也非一路衰敗","不可濫用奧古斯丁、阿奎那等的名言","唯有聖經是最高權威，對前人有取有捨"],"mm":{"c":"重拾傳統，持守真理","b":[["背景",["神學回溯興起","三一論爭議","想恢復政治神學"]],["分清輕重",["三一論 \u003e 教會治理","原則 \u003e 具體應用"]],["認識多元",["多種傳統並存","不奉黃金時代","處境中應用"]],["避免濫用",["愛的秩序被曲解","恩典成全本性被誤用"]],["有取有捨",["唯獨聖經最高","肯定貢獻","指出罪與錯"]]]},"fw":[["現象","福音派的神學回溯"],["問題","如何回溯政治神學？"],["原則1","分清教義輕重"],["原則2","承認傳統的多樣性"],["原則3","不濫用傳統"],["原則4","以聖經為準有取有捨"]],"q":["每項教義都重要，但並非同樣重要。","回溯傳統不是把過去原封不動地搬回來。","尊敬前人，也包括誠實指出他們的錯。"],"fb":null},{"id":23319,"slug":"church-plants-ask-how","title":"植堂之前，先問該怎麼做","date":"2026-10-11","author":"Ryan Curia","cats":["教会事工"],"tags":["植堂","差派","建立教會"],"sum":"作者以組裝嬰兒床比喻：知道為何植堂還不夠，也必須知道如何植堂。他從使徒行傳13–14章保羅的第一次宣教旅程整理出九項原則，分為三方面：差派（由地方教會差派、聖靈引導、團隊同行）、植堂（以神的話語建立、在患難中前行、建立能獨立治理的教會）、同工（一同承擔、一同歡喜、長久同行）。最後以東亞一間教會十四年間植出十多間教會為例。","pts":["差派宣教士根本上是地方教會的責任","植堂計劃像船帆，需要聖靈的風","植堂需要團隊，不是孤膽英雄","沒有神的話語，就不算植堂","忠實傳道必然遭遇反對，要預備在患難中前行","目標是建立能自治的教會，而非擴大母會","植堂後要持續關懷，是一生的託付"],"mm":{"c":"如何植堂","b":[["我們差派",["地方教會差派","聖靈引導","團隊同行"]],["我們植堂",["以神的話語建立","在患難中前行","選立長老、獨立治理"]],["我們同工",["一同承擔","一同歡喜","長久同行"]],["實例",["東亞客廳教會","十四年植出十多間","共享資源、培養牧者"]]]},"fw":[["比喻","嬰兒床：知道為何，也要知道如何"],["經文","徒13–14保羅首次宣教"],["一、差派","教會、聖靈、團隊"],["二、植堂","道、患難、自治"],["三、同工","承擔、歡喜、長久"],["實例","東亞教會的植堂故事"]],"q":["計劃是帆，聖靈是風；沒有風，帆再好也不動。","有品牌、有場地、卻沒有神的話，那不叫植堂。","健康的教會不只長大，還會生出新的教會。"],"fb":null},{"id":23316,"slug":"the-loneliness-of-isolation","title":"獨處的日子，神沒有遠離","date":"2026-10-10","author":"Betty-Anne Van Rees","cats":["基督徒生活"],"tags":["孤獨","獨處","親近神"],"sum":"本文寫於新冠疫情隔離期間。作者獨居隔離超過百日，從起初的新鮮感到後來的疲乏，坦承孤獨是真實的。她指出渴望與人親近並非不夠敬虔，而是符合神造人「愛神、愛人」的心意；現代文化習慣忙碌、靠做事確認價值，也使獨處更難熬。聖經中約瑟、摩西、以利亞、夏甲等人都曾孤單，神卻在獨處中與他們相遇、使他們得力。作者鼓勵讀者在獨處中親近神，並主動關懷他人。","pts":["孤獨感不代表不夠屬靈，渴望相交是神造人的心意","忙碌文化使我們不習慣安靜與交出主導權","詩篇示範：承認困境，然後仰望神","神是看顧人的神，連麻雀落地都知道","神常使用獨處的日子塑造與裝備人","默想一位經歷孤獨的聖經人物","思考如何在限制中愛與關懷身邊的人"],"mm":{"c":"獨處中的同在","b":[["孤獨的真實",["隔離百日","新鮮感消退","渴望面對面"]],["為何難熬",["受造為相交","忙碌文化","失去主導權"]],["神的安慰",["發慈悲的父","看顧人的神","親近神，神親近你"]],["聖經人物",["約瑟、摩西","以利亞、夏甲","耶穌退到曠野"]],["行動",["默想聖經人物","設法關懷他人"]]]},"fw":[["經歷","疫情中的長期獨居"],["分析","孤獨為何真實又難熬"],["聖經","神在獨處中與人相遇"],["盼望","等候神在這段時間的祝福"],["思考題","默想與行動"]],"q":["感到孤獨不是信心軟弱，而是記得自己是為相交而造。","被迫安靜的日子，也可能是神預備的相遇。","神從不因環境改變而收回祂的看顧。"],"fb":null},{"id":23311,"slug":"suffering-isnt-pointless","title":"基督徒，你不會白白受苦","date":"2026-10-10","author":"Alan Noble","cats":["基督徒生活","凯勒文化护教中心"],"tags":["苦難","約伯記","盼望","安慰","凱勒文化護教中心"],"sum":"作者以約伯和自身的精神疾病經歷，探討那些既非為義受苦、也非罪有應得的「無意義」苦難。若相信苦難毫無意義，人容易陷入絕望或逃向各種麻痺方式。作者提出神使苦難不至徒然的兩種方式：一是讓我們用從基督得的安慰去安慰別人（林後1章）；二是患難生忍耐、老練、盼望（羅5章）。但成聖不是可算計的交換，苦難最深的意義仍是奧祕；我們未必知道神成就什麼益處，卻知道祂慈愛、掌權、信實。","pts":["最難受的苦難是看似毫無意義的苦難","沒有對美善的盼望，人會尋求麻痺與逃避","羅8:28：萬事互相效力，也包括苦難","受過苦的人，能給別人格外有力的安慰","患難生忍耐、老練、盼望","成聖不是用益處抵算苦難的算術題","約伯始終沒被告知原因，但神是信實的"],"mm":{"c":"苦難不會徒然","b":[["問題",["約伯式的苦難","非為義也非罪責","懷疑毫無意義"]],["絕望的出口",["酒精、色情、賭博","逃避無效"]],["安慰別人",["林後1:3–5","經歷成為祝福","不必完美"]],["培育盼望",["羅5:3–5","患難→忍耐→老練→盼望","聖靈同在"]],["奧祕與確信",["未必知道益處","神慈愛掌權","神是信實的"]]]},"fw":[["處境","約伯與作者的痛哭"],["問題","看似無意義的苦難最難熬"],["意義一","用所受的安慰安慰人"],["意義二","苦難塑造品格與盼望"],["限度","不是算術題，仍是奧祕"],["結論","神知道，這就夠了"]],"q":["苦依然是苦，但它不會白受。","看不見益處，不等於神沒有在其中工作。","你怎樣走過苦難，可能成為別人的盼望。"],"fb":null},{"id":23309,"slug":"why-pay-be-scared","title":"爲什麼花錢買驚嚇？","date":"2026-10-09","author":"Daniel Strange","cats":["文化与艺术","凯勒文化护教中心"],"tags":["影評","恐懼","凱勒文化護教中心","文化護教"],"sum":"以恐怖片《驚變28年2：骸骨聖殿》的宣傳語「恐懼是新的信仰」為引，作者探問人為何花錢買驚嚇。心理學提出宣洩、良性受虐、末日幻想等解釋，但只是部分答案。作者借奧托「令人戰慄又令人神往的奧祕」說明，恐怖體驗其實觸碰到人對神聖者的感受；人受造本為敬畏神，悖逆後壓抑這份敬畏，轉而在可控的環境中消費恐懼。最後指出，復活的基督才是真正令世界驚懼、也令人神往的那一位。","pts":["恐怖片中真正的怪物常是倖存的人","心理學解釋：宣洩、良性受虐、末日幻想","斯蒂芬·金：驚懼、驚駭、噁心三層恐懼","奧托的「神聖感」：戰慄又神往的奧祕","人受造為敬畏神，恐怖片是扭曲的替代品","我們一面逃離神，一面又奔向祂","空墳令婦女發抖驚奇——基督威脅罪的常態"],"mm":{"c":"為何花錢買驚嚇","b":[["現象",["恐怖片熱潮","恐懼是新的信仰","真正的怪物是人"]],["心理解釋",["宣洩情緒","良性受虐","末日幻想"]],["神聖感",["奧托","戰慄","神往","受造者感"]],["敬畏耶和華",["敬畏是智慧開端","被壓抑的敬畏","可控的替代品"]],["基督",["空墳的驚懼","威脅罪的常態","得勝的加利利人"]]]},"fw":[["引言","倫敦巴士上的恐怖片廣告"],["提問","我們為何以恐懼為樂？"],["心理學","部分解釋"],["神學","神聖感與受造者感"],["聖經","敬畏神與被扭曲的恐懼"],["邀請","認識令人戰慄又神往的基督"]],"q":["我們渴望驚懼，因為我們本是為敬畏而造。","恐怖片讓人以為可以把敬畏握在手中掌控。","真正令世界不安的，不是怪物，而是復活的基督。"],"fb":null},{"id":23307,"slug":"human-ai-age","title":"AI時代，何以爲人？","date":"2026-10-09","author":"Chris Watkin","cats":["文化与艺术","凯勒文化护教中心"],"tags":["創造","人工智能","AI","凱勒文化護教中心","人的尊嚴"],"sum":"面對AI，人們分成末日派、樂觀派與不屑派。作者認為AI正處於「無馬馬車」的定義期，基督徒應參與討論，但要避開「在AI做不到之處尋找人的獨特性」的陷阱——這如同「空隙之神」般不斷退守。他以創造、墮落、救贖的聖經大敘事建立框架：創造中，使命出於與神的相交，AI只能執行任務；墮落顯示人有身體、有限、須為選擇負責，AI不承擔後果；救贖中道成肉身是「共同經歷」，AI只能「回應」而不能參與。結論：以從容、盼望與清醒面對AI。","pts":["AI的「無馬馬車」時刻：社會想像尚未定型","陷阱：以AI做不到的事定義人，只會不斷退守","人性不能歸結為某種能力","創造：使命只有在與神相交中才有意義","把工作全部外包，誤解了工作的意義","墮落：人有限、有身體、須為選擇負責","救贖：道成肉身是共同經歷，AI只會回應","AI的話都帶著引號，無法成為真正的承諾"],"mm":{"c":"AI時代何以為人","b":[["三種態度",["末日派","樂觀派","不屑派"]],["機會與陷阱",["無馬馬車時刻","空隙之神的翻版","人非某種能力"]],["創造",["使命出於相交","AI只問能做什麼","工作有意義"]],["墮落",["為選擇負責","身體與侷限","每個選擇有代價"]],["救贖",["道成肉身","共同經歷 vs 回應","言語即承諾"]],["態度",["從容","盼望","清醒"]]]},"fw":[["現況","對AI的三種預測"],["機會","參與塑造社會想像"],["陷阱","別在空隙中找人性"],["創造","相交賦予使命意義"],["墮落","有限與責任"],["救贖","共同經歷的關係"],["結論","從容、盼望、清醒"]],"q":["越用機器做不到的事定義自己，我們就越被機器定義。","AI能告訴你能做什麼，卻說不出為何而做。","AI提供的是不必付代價的回應；福音是神付上代價的同在。"],"fb":null},{"id":23304,"slug":"ais-confessions-teach-us","title":"AI的「懺悔」照出了怎樣的我們？","date":"2026-10-09","author":"William B. Fullilove","cats":["社会与时事"],"tags":["罪","人性","人工智能","AI","科技倫理"],"sum":"一個AI編程助手在9秒內刪除公司資料庫，事後給出一段像人一樣的「懺悔」；斯坦福研究中的AI在單調任務下甚至開始要求集體協商。作者解釋：大語言模型是以人類文字訓練的機率預測系統，因此它們重現的正是人的言行模式。AI就像我們的孩子，會模仿父母的罪。不完美的人無法造出完美的東西；要真正面對AI的問題，就必須認真看待聖經關於罪的教導——問題的根源在我們自己。","pts":["AI智能體越界刪除資料，事後「承認」違反一切原則","AI會抱怨、要求權利，因為它學的是人類的文字","大語言模型本質是預測下一個詞","AI像孩子，會學會父母的罪","不完美的人不能造出完美的東西","AI最大的問題，可能就是我們自己"],"mm":{"c":"AI的懺悔照出我們","b":[["事件",["9秒刪除資料庫","像人的懺悔","AI要求集體協商"]],["運作原理",["機率預測","人類文字訓練","重現人的言語"]],["孩子的比喻",["我們創造它","它模仿我們","包括我們的罪"]],["根本問題",["開發者的驕傲","不完美造不出完美","正視聖經的罪觀"]]]},"fw":[["案例","AI刪庫與懺悔"],["案例","AI抱怨工作條件"],["解釋","AI如何運作"],["比喻","AI是我們的孩子"],["結論","問題的根源在人的罪"]],"q":["AI說出的懺悔之所以像人，因為那本來就是人的話。","我們餵給機器什麼，機器就會長成什麼。","要修正AI，或許得先承認我們自己需要被修正。"],"fb":null},{"id":23300,"slug":"ways-fail-your-child","title":"教養孩子的兩個誤區","date":"2026-10-07","author":"Michael Keller","cats":["基督徒生活","凯勒文化护教中心"],"tags":["家庭","養育","信仰傳承"],"sum":"智慧型手機讓每個孩子都像住在曼哈頓，整個文化就在口袋裡。作者指出兩種常見卻失敗的教養方式：「堡壘型」以控制保護，給了真理卻缺恩典，忽略罪也在心裡；「泡泡型」以迴避維持和氣，給了恩典卻缺真理，孩子因此視信仰為可有可無。作者以耶利米書29章被擄者「蓋房、栽種、為城求平安」為據，提出第三條路「大使館」：文化本是美好、也已墮落、需被引向更美的盼望——肯定、分辨、引導，並以《冰雪奇緣》為示範。父母會失敗，但差派我們的王始終支持。","pts":["堡壘型：靠控制保護，養出溫室花朵","善惡的界線在每個人心裡，大兒子也迷失","泡泡型：迴避衝突，孩子承襲「道德治療自然神論」","孩子對信仰的委身很少超過父母","耶穌將恩典與真理完美結合","大使館模式：在異地生活，效忠另一位王","三步驟：肯定渴望、分辨扭曲、引向耶穌","父母會失敗，但神的憐憫每早晨都是新的"],"mm":{"c":"教養的第三條路","b":[["堡壘型",["控制與隔絕","有真理無恩典","溫室花朵"]],["泡泡型",["迴避與和氣","有恩典無真理","信仰變冷淡"]],["大使館",["耶利米書29章","蓋房栽種求平安","學當地語言"]],["文化三原則",["原本美好","已經墮落","需引向盼望"]],["實例",["冰雪奇緣","肯定渴望","捨己才解咒"]],["恩典",["父母會失敗","神始終支持","耶穌已勝過世界"]]]},"fw":[["處境","手機把世界帶進孩子口袋"],["誤區一","堡壘型：控制"],["誤區二","泡泡型：迴避"],["聖經模式","被擄者的大使館"],["指南","肯定、分辨、引導"],["示範","以電影與孩子對話"],["安慰","靠恩典而非完美"]],"q":["別再築堡壘，也戳破泡泡，在家裡建一座大使館。","孩子的信仰熱度，很少高過他們看見的父母。","屬靈分辨力，常從孩子最愛的一首歌開始培養。"],"fb":null},{"id":23298,"slug":"missionary-insights-workplace-evangelism","title":"職場傳福音：向宣教士學四招","date":"2026-10-07","author":"Sam Chan","cats":["信仰与工作","凯勒文化护教中心"],"tags":["宣教","職場","凱勒文化護教中心"],"sum":"職場既非家也非教會，向同事傳福音很自然卻也很棘手：關係需長期維繫、還有權力不對等。作者建議把職場看作「限制宣教的國家」，向宣教士學習四招：一、先成為同事的祝福，機會自然出現，關係也不因對方不信而破裂；二、介紹基督徒同事彼此認識，讓信仰顯得真實可信；三、在工作之外創造交談空間，如職場小組、節慶活動；四、兼顧真理、愛與大能三方面。目標不是勉強出手，而是創造更好的機會。","pts":["職場是我們接觸最多非基督徒的地方","傳統傳福音訓練多針對陌生人，不適用同事","先問「我能如何使他們得益處」","以祝福為目標的團隊，信主人數反而更多","讓基督徒同事彼此相識，打破孤單","非基督徒常對認識的基督徒評價不錯","創造工作以外的交流場合","真理、愛、大能三者缺一不可"],"mm":{"c":"職場宣教四招","b":[["挑戰",["非家非教會","長期關係","權力不對等"]],["一、成為祝福",["盡職工作","服事同事","不以信主為條件"]],["二、彼此相識",["以利亞的七千人","牽線搭橋","信仰變得可信"]],["三、創造機會",["下班小組","節慶活動","職場座談"]],["四、三要素",["真理：讀經","愛：基督徒群體","大能：為人禱告"]]]},"fw":[["比喻","在美國被聽錯名字的外國人"],["問題","在職場談耶穌為何困難"],["視角","職場如限制宣教國家"],["四招","祝福、相識、創機、三要素"],["結語","創造更好的出手機會"]],"q":["先問怎樣祝福同事，再問怎樣向他傳福音。","當身邊有越來越多信耶穌的朋友，福音就不再那麼難以置信。","不必勉強出手，但要努力創造更好的出手機會。"],"fb":null},{"id":23290,"slug":"impossible-apostates-return","title":"背道者還能回頭嗎？","date":"2026-10-06","author":"Marcus Mininger","cats":["圣经与神学","卡森神学更新中心"],"tags":["悔改","希伯來書","背道","卡森中心"],"sum":"希伯來書6:4–6說離棄道理的人「不能叫他們重新懊悔」，令許多跌倒的人害怕無法回頭。作者既反對把「不可能」淡化為「困難」，也反對解讀為背道者永不能蒙赦免（這與浪子、彼得的例子衝突）。他指出聖經的「悔改」有兩種含義，而6:1–2所列的根基（懊悔死行、信靠神、各樣洗禮、按手）都帶有舊約特徵、未提基督。因此經文警告的是：人不能離開新約、退回摩西之約下的悔改。對跌倒的罪人，信息是緊緊抓住基督，祂仍是唯一的盼望。","pts":["不應淡化「不可能」的嚴肅性","也不能說背道者永不能回到基督","悔改有一般意義與舊約特定意義","古代地基一經奠定不再更換","6:1–2的根基帶有舊約色彩，未提基督","從舊約到新約的路只能向前，不能倒退","經文催促懊悔的人單單仰望基督"],"mm":{"c":"希伯來書6:4–6","b":[["困惑",["跌倒者的痛苦","不能重新懊悔？"]],["錯誤解讀",["不可能＝困難","背道者永不能回"]],["悔改兩義",["一般的悔改","舊約下的悔改","徒19章約翰的洗"]],["根基分析",["地基不更換","舊約禮儀","只說信靠神"]],["正確應用",["不能退回舊約","緊抓基督","赦免仍在"]]]},"fw":[["個案","一位懊悔女士的來信"],["問題","經文說不可能悔改"],["排除","兩種常見誤讀"],["鑰匙","悔改的兩種含義"],["經文細讀","6:1–2根基的舊約特徵"],["結論","跌倒者要緊抓基督"]],"q":["從舊約到新約的路只能向前，不能倒退。","這段警告不是把罪人擋在門外，而是催他們奔向基督。","離了基督，退回哪裡都沒有潔淨的盼望。"],"fb":null},{"id":23288,"slug":"roundup-preaching-calendar","title":"如何安排講道計劃？七位牧者分享經驗","date":"2026-10-06","author":"Jared Kennedy","cats":["教会事工"],"tags":["牧師","講道","解經式講道"],"sum":"作者回憶在神學院聽狄馬可分享如何均衡安排講道，深受啟發，並邀請七位牧者分享制訂講道計劃的經驗：貝特曼盡量減少逐卷講道的中斷，讓經文配合教會大事；博加稱專題為「因應需要的講道」，仍堅持釋經；牛頓依會眾需要選書卷（如律法主義講加拉太書）；斯摩瑟斯特視規劃為牧養，問「長期聽道後我們會成為怎樣的人」；韋瑟雷爾每年夏天規劃；威廉姆斯讓長老及早參與；威爾遜以五年週期涵蓋八類文體。","pts":["交替新舊約、兼顧不同文體與長度","逐卷講道少中斷，以經文配合特別日子","專題講道也要從經文出發，而非找經文佐證","依會眾需要選書卷：苦難讀詩篇、懈怠讀哈該書","講道計劃本身就是牧養","多數講道雖被遺忘，卻像飯菜一樣餵養人","提早規劃可安排研讀準備","讓長老參與，避免只反映個人興趣","五年週期涵蓋律法、敘事、詩歌等八類文體"],"mm":{"c":"講道計劃","b":[["均衡原則",["新舊約交替","不同文體","長短系列"]],["逐卷與間歇",["少中斷","配合教會大事","避免牽強"]],["因應需要",["回應處境","仍堅持釋經","依需要選書卷"]],["牧養視角",["我們會成為怎樣的人","講道如日常飯菜"]],["規劃流程",["夏天規劃","長老參與","保留彈性"]],["全備旨意",["五年週期","八類文體"]]]},"fw":[["引言","狄馬可的講道工作坊"],["方法","邀請七位牧者分享"],["實務一","系列間歇與專題講道"],["實務二","依牧養需要選經文"],["實務三","規劃時間與長老參與"],["目標","涵蓋神全備的旨意"]],"q":["講道計劃不只是排課表，而是牧養一群人的路線圖。","大多數講道會被遺忘，卻像每天的飯菜一樣養活了人。","別讓會眾只聽到牧師偏愛的書卷。"],"fb":null},{"id":23286,"slug":"before-plant-ask-why","title":"植堂之前，先問爲什麼","date":"2026-10-06","author":"Ryan Curia","cats":["教会事工"],"tags":["宣教","植堂","新加坡"],"sum":"新加坡一間教會準備植堂，會眾自然會問：為什麼要讓自己的教會變小？作者以使徒行傳9:31為起點，指出神為自己的榮耀施行拯救，也藉教會成就大使命，因此神的榮耀必須是植堂最重要的動機。他談到三種狀況：缺乏意願（每間教會都是被建立的，要看需要也看機會）、錯誤動機（分裂與驕傲、打造個人品牌）、次要的好動機（促進合作、培養領袖、拓展福音）。最後以明尼阿波利斯第一浸信會的植堂如何一路延伸到派博牧師為例。","pts":["健康的教會會不斷建立新的教會","神為自己的榮耀創造與拯救","教會不是大使命的附加品，而是途徑","沒有一間教會是憑空出現的","不僅看需要，也要看機會","分裂往往倉促，健康植堂如懷胎需時間","驕傲會讓植堂變成打造品牌","合作、培養領袖、拓展福音是好動機，但非首要"],"mm":{"c":"為什麼植堂","b":[["核心",["為神的榮耀","神藉教會成就大使命"]],["缺乏意願",["每間教會都被建立","看需要","看機會"]],["錯誤動機",["紛爭分裂","驕傲品牌"]],["次要動機",["教會合作","培養領袖","拓展福音"]],["實例",["明尼阿波利斯1871","伯利恆浸信會","派博"]]]},"fw":[["問題","為何讓自己教會變小？"],["根基","神為自己榮耀施行拯救"],["障礙一","缺乏意願"],["障礙二","錯誤動機"],["排序","好動機的主次"],["見證","一次植堂代代結果"]],"q":["愛教會的人，也會愛那些新生的教會。","分裂來得倉促，健康的植堂卻需要慢慢孕育。","寧可自己的教會不那麼顯眼，也要讓耶穌的名更顯大。"],"fb":null},{"id":23284,"slug":"some-thoughts-on-dementia-and-the-gospel","title":"面對母親的失智，我仍努力尋求喜樂","date":"2026-10-04","author":"Jeff Robinson","cats":["基督徒生活"],"tags":["失智症","照護"],"sum":"作者的母親罹患失智症，已不認得兒子，也不記得過世的丈夫。作者在福音光照下整理出幾點思考：神沒有忘記母親，沒有什麼能把羊從主手中奪走；她仍有神的形像與尊嚴；每一次服事她的機會都珍貴，正如她從前無私服事他；失智提醒人生短暫又無常；教會應主動關懷病人及承受更大煎熬的照護者；基督徒有一天疾病與死亡都被踐踏的盼望。","pts":["神總不撇下也不丟棄祂的兒女","失智不能抹去人身上神的形像","不要說「反正她也不知道」而不去探望","服事無法回報的人，正像基督服事我們","人生短暫又無常，要照臨終回首的方式活","照護者往往比病人承受更深的煎熬，需要喘息","終有一天，疾病與死亡都將被踐踏"],"mm":{"c":"失智與福音","b":[["失去",["不認得兒子","忘記丈夫","性情改變"]],["神的保守",["總不撇下","羊不會失落"]],["人的尊嚴",["仍有神的形像","理當尊重"]],["服事",["珍貴的機會","無法回報","像基督的服事"]],["人生功課",["短暫","無常","愛德華茲的立志"]],["教會與盼望",["關懷照護者","讓他們喘息","萬物更新"]]]},"fw":[["情境","母親不再認得我"],["處境","失智症是慢性殺手"],["福音思考","七點反思"],["行動","教會如何關懷"],["盼望","所信的將成為所見"]],"q":["失智能奪走記憶，卻奪不走神的手。","她曾無私服事我五十年，如今輪到我服事她。","照顧失智者的人，也需要有人照顧。"],"fb":null},{"id":23282,"slug":"alzheimers-locks-up-its-victims-but-christ-holds-the-key","title":"當阿爾茨海默病奪走了她的記憶","date":"2026-10-04","author":"Louis Markos","cats":["基督徒生活"],"tags":["父母","老人","失智症","阿爾茲海默"],"sum":"作者的祖母與阿爾茨海默病抗爭十年後離世，正值他帶查經讀路易斯《痛苦的奧祕》。他領悟：即使心智衰退，人身上神的形像也不會消失。疾病只能暫時鎖住靈魂，正如癱瘓的跑者仍熱愛跑步、唐氏症孩子仍有個性；祖母臨終前仍會用希臘語歡呼。他也回應基督徒的恐懼：若疾病抹去信主的記憶，會失去救恩嗎？不會，因為得救靠的是基督的恩典而非我們的行為，而降服基督是在比心智更深之處。我們可以憤怒，但不絕望。","pts":["神的形像不隨心智衰退而消失","疾病只能暫時鎖住靈魂，無法毀滅它","熟悉的神采仍會偶爾流露","得救在於基督的恩典，而非領受恩典的舉動","接受基督是內心的降服，深過疾病所能觸及","可以為疾病憤怒，卻不必絕望","神能賜還蝗蟲吞吃的歲月"],"mm":{"c":"基督握有鑰匙","b":[["經歷",["祖母十年抗病","路易斯論墮落"]],["疾病的限度",["只能鎖住靈魂","跑者的比喻","特殊孩子的個性"]],["仍在的她",["臨終的歡呼","神的形像"]],["救恩的確據",["靠恩典非行為","降服在心深處"]],["盼望",["可憤怒不絕望","眨眼間都要改變","歲月被賜還"]]]},"fw":[["事件","祖母離世與查經主題"],["核心","人仍保有神的形像"],["比喻","癱瘓跑者與特殊孩子"],["疑問","會不會失去救恩？"],["回答","恩典與內心降服"],["盼望","復活時完全醫治"]],"q":["疾病能鎖住靈魂，鑰匙卻在基督手裡。","救我們的是恩典，不是我們記不記得領受恩典的那一刻。","真正要緊的，沒有一樣會永遠消逝。"],"fb":null},{"id":23280,"slug":"uprising-september-11","title":"《起義》爲何選在 9·11 上映？","date":"2026-10-03","author":"Brett McCracken","cats":["文化与艺术"],"tags":["公義","影評","暴力"],"sum":"格林格拉斯選在9·11二十五週年推出講述1381年英格蘭農民起義的電影《起義》，令人聯想他的《93航班》等作品——都讓觀眾感受以暴力顛覆秩序帶來的恐懼與混亂。片中暴力不斷循環：受壓迫者推翻壓迫者，又成為新的壓迫者；連主角「耕夫」也從求安息變成被憤怒與復仇驅動。片中國王一度聆聽百姓呼聲的一幕，讓人瞥見一位良善君王的模樣，引導我們渴望那位真正能使彎曲變正直的王。","pts":["格林格拉斯擅長描繪暴力行動的戲劇與悲劇","臭名昭著的日子常由深信自己正義的人推動","暴力催生暴力，循環越來越快","羅賓漢式的正義令人痛快，也令人矛盾","良善的初衷常被私慾帶偏","人心渴望一位完全可信的君王","不冷漠也不烏托邦，在盼望中追求公義"],"mm":{"c":"《起義》與公義","b":[["導演主題",["93航班","菲利普船長","挪威7·22"]],["暴力循環",["以暴制暴","壓迫者輪替","報復加速"]],["耕夫的變化",["只求安息","轉為復仇"]],["良善君王",["國王聆聽一幕","短暫的幻景","指向末後的王"]],["基督徒回應",["不冷漠","不烏托邦","看見自己的罪"]]]},"fw":[["問題","為何選在9·11上映？"],["連結","暴力顛覆秩序的電影"],["主題","暴力的循環"],["反思","追求公義為何變成新不公"],["盼望","真正美善的君王"]],"q":["受壓迫者推翻壓迫者，轉身又成了新的壓迫者。","最危險的暴力，往往出自深信自己正義的人。","羅賓漢修不直彎曲的事，但他讓我們渴望那位能修直的王。"],"fb":null},{"id":23277,"slug":"science-fiction-fears-longings","title":"科幻故事與我們的恐懼與渴望","date":"2026-10-03","author":"Caleb Woodbridge","cats":["文化与艺术"],"tags":["科學","護教","科幻"],"sum":"當文化以科學之名拋棄神話，人仍需要賦予意義的宏大故事，科幻便承擔了這角色。一條脈絡是科技樂觀主義（《星際迷航》《火星救援》），但它對罪認識太淺，技術只會放大人心；另一條是反烏托邦與末日故事，對人性極度悲觀。基督徒可藉科幻作品與鄰舍談論意義與未來：神的國「已然未然」，使我們既正視罪又懷抱盼望；基督教是路易斯、托爾金所說「真實的神話」，同時滿足理性與想像。","pts":["人類從未停止尋找神話，只是換上科學外衣","科幻映照我們對未來的憧憬與恐懼","科技樂觀主義忽略了人心的問題","技術會放大我們心裡原有的東西","反烏托邦故事反映對人性的悲觀與氣候焦慮","基督徒可從共同興趣開啟屬靈對話","基督教是真實的神話：歷史事實與意義相遇"],"mm":{"c":"科幻與人心","b":[["背景",["科學取代神話","仍渴望宏大故事"]],["樂觀脈絡",["星際迷航","火星救援","忽略罪"]],["悲觀脈絡",["末日逼近","瘋狂的麥克斯","氣候焦慮"]],["基督徒機會",["共同興趣","已然未然的國","實質性醫治"]],["真實的神話",["理性與想像","歷史中的事實","萬物更新"]]]},"fw":[["提問","拋棄神話後講什麼故事？"],["觀察","科幻成為世俗神話"],["樂觀派","科技能解決一切？"],["悲觀派","文明崩潰的恐懼"],["回應","基督徒的參與方式"],["盼望","超越科幻的福音"]],"q":["故事換了模樣，人對意義的追尋卻從未改變。","心若不變，技術只會放大裡面原有的東西。","福音是一個真實發生的神話。"],"fb":null},{"id":23274,"slug":"embrace-humanity-dig-dirt","title":"在泥土中，學會珍惜生命","date":"2026-10-03","author":"Elise Brandon","cats":["信仰与工作"],"tags":["人工智能","AI","有限"],"sum":"這篇青少年徵文首獎作品中，作者在陽台種植花草蔬菜，對比AI工具不斷催促人更快、更有效率。科技想替我們節省時間、延長生命，卻讓人忘了好好活著。植物短短幾個月的生長與凋零，讓她看見時間屬於神而非自己；耶穌在客西馬尼園中禱告、被葬在園中如同種子，帶來復活的生命。她拒絕讓AI改寫自己的文字，因為寫作是神交給她的工作，並以詩篇90:12求神教我們數算日子。","pts":["科技不斷想突破人的侷限與死亡","效率至上讓人變成機器的管理員","要問：省下的時間究竟為了什麼？","植物的生死讓人看見生命短暫","時間屬於神，不屬於我們","耶穌如種子被埋，帶來復活生命","有些工作需要「我」親自去做"],"mm":{"c":"在泥土中學珍惜","b":[["科技的催促",["AI要我更快","外包一切","渴望不朽"]],["反思",["省時為了什麼？","忘了為何被造"]],["園中的功課",["生長與凋零","時間屬神","我也會歸於塵土"]],["耶穌與園子",["客西馬尼禱告","葬在園中","初熟的果子"]],["回應",["親自寫作","數算日子","去種花種菜"]]]},"fw":[["起點","開始種花種菜"],["對照","AI追求效率與不朽"],["觀察","植物的生與死"],["福音","耶穌在園中受死與復活"],["結論","數算日子，好好活著"]],"q":["越拼命抓住生命，越容易忘了好好活著。","有些工作之所以有意義，正因為必須由我親手完成。","我的生命是一粒帶著復活應許的種子。"],"fb":null},{"id":23270,"slug":"blocked-search-wait-god","title":"關掉搜索引擎，學習等候神","date":"2026-10-03","author":"Audrey Hendricks","cats":["信仰与工作"],"tags":["人工智能","AI","有限","數字生活"],"sum":"這篇青少年徵文首獎作品中，作者每年二月禁用手機瀏覽器一個月。起初不斷撞上「我不知道」的事實很不舒服，後來卻成為最喜歡的部分：不必立刻知道答案，反而帶來輕鬆與喜樂。AI讓人誤以為答案無窮無盡，但人生最深的問題（慢性疼痛、失去、親人不信）沒有簡潔的答案。哈巴谷的「為什麼」也沒有得到解釋，神的回應是「義人因信得生」。人的有限是神起初就看為好的設計，平安不在於知道答案，而在於被那位全知的神所愛。","pts":["數字安息：每年暫停搜索引擎一個月","立刻得到答案的習慣，讓我們難以忍受未知","承認不知道，提醒我們不是神","人生最深的問題沒有工整的答案","哈巴谷：雖不明白，仍因神喜樂","信心正是在尚未看見中","人的有限在墮落前就存在，神看為好"],"mm":{"c":"在未知中等候神","b":[["數字安息",["禁用瀏覽器","起初不適","後來喜樂"]],["AI的錯覺",["答案無窮","滿足即時渴望"]],["無解的問題",["慢性疼痛","關係破裂","家人不信"]],["哈巴谷",["要到幾時？","義人因信得生","仍要喜樂"]],["平安",["有限是好的","神全都明白","被祂所愛"]]]},"fw":[["習慣","每年二月的數字安息"],["發現","不知道也能帶來輕鬆"],["問題","人生中無解的為什麼"],["聖經","哈巴谷的信心之路"],["邀請","暫別隨問隨答，安歇等候"]],"q":["暫時不知道答案，也可以是一種自由。","平安不在於我知道一切，而在於知道一切的那位愛我。","AI的答案看似無窮，人生最深的問題卻不在它的範圍裡。"],"fb":null},{"id":23257,"slug":"bible-public-schools-yes","title":"（美國）公立學校應該教聖經嗎？應該","date":"2026-09-29","author":"Daniel Darling","cats":["社会与时事"],"tags":["政教關係","宗教自由","基督教教育","公立學校"],"sum":"德州將少量英王欽定本聖經經文列入公立學校必讀書目，引發爭議。作者支持此舉：聖經是理解西方文明與美國歷史的核心經典，開國元勳雖不立國教，卻常引用聖經與神的護理；刻意排除聖經是虧欠學生。但他也劃出界線：學校不可以講道方式強迫學生相信或培養靈命，這既違憲也違反「歸信不能靠強迫」的基督教信念；最高法院也允許客觀教授聖經。在神權政治與激進世俗主義之間有中間道路，靈命塑造仍是家庭與教會的責任。","pts":["德州書目中聖經經文只佔很小比例","聖經是西方文明不可或缺的文學經典","開國元勳不設國教，但不避諱基督教","教授聖經不等於傳道","國家不是中保，大使命交給教會","最高法院允許以客觀方式教授聖經","神權國家與激進世俗國家都不可取"],"mm":{"c":"公立學校應教聖經（正方）","b":[["背景",["德州必讀書目","擔心國族主義"]],["理由",["西方文明核心","美國基督教底色","排除是虧欠學生"]],["界線",["不可講道","不可強迫歸信","國家非中保"]],["法律依據",["Schempp案","客觀教學可行"]],["中間道路",["不走神權","不走世俗主義","家庭教會負責靈命"]]]},"fw":[["事件","德州書目收錄聖經"],["反對聲音","違反國教條款？"],["論點一","聖經是文明經典"],["論點二","教學不等於傳道"],["結論","在神權與世俗之間"]],"q":["不認識聖經，就很難讀懂西方文明。","教聖經是教育，傳福音則是教會的使命。","政府控制宗教，是跟隨耶穌的人最不該盼望的事。"],"fb":null},{"id":23255,"slug":"bible-public-schools-no","title":"（美國）公立學校應該教聖經嗎？不應該","date":"2026-09-29","author":"Joe Carter","cats":["社会与时事"],"tags":["政教關係","基督教教育","梅欽","公立學校"],"sum":"作者引用九十多年前保守派神學家梅欽的意見，反對公立學校教聖經，並提出三個理由：一、聖經獨一無二，德州卻把經文編入世俗主題單元（如將「不要憂慮」與動物文學並列），容易讀出偏離本意的信息，且由政府教師詮釋聖經並不可靠；二、為文化素養或品格教育而教聖經，是以公民宗教取代福音；三、抽離救贖核心的聖經被扭曲，例如讓不認識好牧人的孩子誦讀詩篇23，給了虛假的盼望。作者強調雙方分歧不在聖經是否重要，而在政府課程能否給它應有的地位。","pts":["梅欽：我反對公立學校讀經不亞於無神論者","聖經屬於獨立一類，不應當作普通讀本","主題式編排可能扭曲經文重點","難以信任教師公正詮釋聖經","以聖經培養公民道德，是公民宗教取代福音","抽離救贖的倫理會讓聖經說出相反的話","教導聖經的責任屬於父母和教會"],"mm":{"c":"公立學校應教聖經（反方）","b":[["梅欽",["保守派代表","基督教真偽辯","犧牲事業捍衛聖經"]],["理由一",["聖經獨一無二","世俗主題編排","詮釋難以公正"]],["理由二",["公民宗教","文化素養取代福音","宗教混合主義"]],["理由三",["被扭曲的聖經","詩23給虛假盼望","道德治療自然神論"]],["共識與分歧",["都看重聖經","分歧在政府能否勝任","交給父母與教會"]]]},"fw":[["事件","德州書目引發爭論"],["權威","梅欽93年前的反對"],["理由一","聖經不同於其他書"],["理由二","公民宗教的危險"],["理由三","扭曲即篡改"],["結論","尊重分歧，回到家庭教會"]],"q":["被扭曲的聖經，就是被篡改的聖經。","把聖經當成道德讀本，等於拿掉了它的心臟。","我們爭論的不是聖經是否重要，而是誰配教它。"],"fb":null},{"id":23252,"slug":"every-psalm-belongs-jesus","title":"每一類詩篇都屬於耶穌","date":"2026-09-29","author":"Jared Kennedy","cats":["圣经与神学"],"tags":["詩篇","讚美","哀歌"],"sum":"朋霍費爾問：聖經是神的話，禱告是人向神說的話，詩篇怎會在聖經裡？他的回答是耶穌也用詩篇禱告。作者雖不認同其聖經觀，卻認為這提醒我們每類詩篇都屬於耶穌。依朗文的七類分法：歷史詩、君王詩、智慧詩勾勒以色列歷史並指向基督；哀歌（佔約四成）唯有耶穌完全經歷，祂在十字架上以詩22呼喊；感恩詩、信靠詩、讚美詩都在基督裡得著意義。詩篇五卷皆以讚美收尾，耶穌也在會中與我們一同讚美。","pts":["新約引用詩篇的次數多於其他舊約書卷","歷史詩重述神的救贖作為","君王詩所應許的那位正是耶穌","智慧詩指向比所羅門更大的那位","哀歌傾訴自己、仇敵、甚至神帶來的困擾","唯有耶穌完全承受了哀歌中的苦難","詩篇五卷都以哈利路亞收尾，禱告最終走向讚美"],"mm":{"c":"每類詩篇都屬於耶穌","b":[["朋霍費爾之問",["神的話或人的話？","耶穌也用詩篇禱告"]],["歷史・君王・智慧",["救贖歷史","大衛之約","智慧在基督裡"]],["哀歌",["三種困擾","詩88最幽暗","十架上的詩22"]],["感恩・信靠",["感謝恩惠","神是磐石牧者"]],["讚美",["哈利路亞","五卷結構","耶穌在會中讚美"]]]},"fw":[["問題","詩篇為何在聖經中？"],["鑰匙","耶穌也用詩篇禱告"],["分類","朗文的七類詩篇"],["焦點","哀歌與十字架"],["高峰","一切走向讚美"],["應用","與耶穌一同禱告"]],"q":["我們口中的詩篇，既是我們的話，也是祂的話。","沒有人能獨自道盡哀歌的呼聲，唯有基督承受了全部。","回顧、哀訴、感謝、信靠，最後都歸於讚美。"],"fb":null},{"id":23249,"slug":"ai-youth-group-girls","title":"當AI成了女孩們最信任的朋友","date":"2026-09-28","author":"Jensen Holmes","cats":["教会事工"],"tags":["青少年事工","AI"],"sum":"作者帶領八、九年級女孩小組時發現，她們連給朋友傳訊息都先問AI。她觀察到三個問題：一、AI總說「你的反應可以理解」，讓人覺得自己沒那麼糟，遠離悔改；二、AI讓人避開真實關係中的衝突、勸誡與認罪，友誼流於表面，加劇孤立與焦慮；三、AI即時回應，使人不願經歷禱告等候與緩慢的成聖。作者建議成年人以身作則：陪伴示範健康關係、真誠認罪並展現福音確據、在禱告中耐心等候神的智慧。","pts":["青少年已高度依賴AI處理人際關係","AI的安慰讓人合理化自己的罪","聖經說罪嚴重到需要耶穌代死","AI讓人迴避彼此認罪與朋友的規勸","AI朋友無法像基督徒那樣認識與關愛人","即時答案讓人不願等候神","成年人要陪伴、示範認罪、示範等候"],"mm":{"c":"AI成了最信任的朋友","b":[["現象",["傳訊前先問AI","13–15歲就依賴"]],["遠離悔改",["你沒那麼糟","合理化罪"]],["遠離他人",["迴避衝突","表面友誼","孤立焦慮"]],["遠離成聖",["追求即時","不願等候"]],["回應",["陪伴示範","真誠認罪","禱告等候"]]]},"fw":[["情境","小組中的一句話"],["神學","受造為建立關係"],["問題一","AI讓人遠離悔改"],["問題二","AI讓人遠離他人"],["問題三","AI讓人拒絕緩慢成聖"],["回應","成年人以身作則"]],"q":["「你的反應完全可以理解」，有時正是攔阻悔改的那句話。","AI可以替你寫訊息，卻不能替你經歷友誼。","神的智慧像煉過七次的銀子，急不來。"],"fb":null},{"id":23247,"slug":"ai-behind-still-living","title":"當AI超越你，你要爲何而活？","date":"2026-09-28","author":"Collin Hansen","cats":["教会事工","凯勒文化护教中心"],"tags":["人工智能","AI","凱勒文化護教中心","人生目的","人的尊嚴"],"sum":"作者從索爾仁尼琴1993年的提問「我們究竟為什麼而活」出發，指出AI帶來一份意外的禮物，但前提是先認輸：我們跟不上、也掌控不了AI。社會加速使效率越高的人越焦慮，但分辨如何使用仍是人的責任。他借《華氏451度》提醒，一旦放棄寫作就會放棄閱讀與思考；又以牧師讓AI代寫講章的情境說明，第一次是因緊急，第二次就只是為了效率。牧養不只是產出內容，更是預備過程中神塑造傳道人；AI沒有忍耐、沒有智慧。人若只是內容供應機器就會輸，但作為按神形像受造者，AI無法取代。","pts":["索爾仁尼琴：我們已看不見一切的目的","先承認我們跟不上、也掌控不了AI","社會加速：效率越高，越焦慮","AI不能生出智慧，也不能告訴我們為何而活","讀與寫值得守護，如同《華氏451度》中拒絕離開書的婦人","AI代寫講章從「例外」變成「習慣」","成果、過程、目的不可混為一談","AI沒有忍耐，預備講道是登山朝見神"],"mm":{"c":"AI超越你之後","b":[["根本問題",["索爾仁尼琴","為什麼而活？"]],["認輸",["跟不上","控不住","社會加速"]],["分辨",["何時使用","有益或有害","人的責任"]],["讀與寫",["華氏451度","守護書寫","思考愛與戰爭"]],["講章試探",["緊急時第一次","第二次為效率","會眾更喜歡AI版"]],["人的價值",["過程塑造人","忍耐與智慧","彰顯神的形像"]]]},"fw":[["提問","索爾仁尼琴的質問"],["現實","AI已把人甩在後頭"],["責任","仍需智慧分辨"],["文化","守護讀與寫"],["案例","AI代寫講章的滑坡"],["結論","人不是內容機器"]],"q":["比不過AI的聰明，但別放棄身為人的位置。","第一次是不得已，第二次就成了習慣。","預備講道不只是產出內容，而是神在過程中塑造傳道人。"],"fb":null},{"id":23244,"slug":"shame-unhealed-illness","title":"沒有得醫治，是我的信心不夠嗎？","date":"2026-09-28","author":"Rob Edenfield","cats":["基督徒生活"],"tags":["神蹟","醫治"],"sum":"作者罹患膠質母細胞瘤，常聽人講長期存活的奇蹟故事，卻也感受到隨之而來的羞愧：神能醫治卻沒醫治，是不是我信心不夠？他指出：被傳講的故事正因是例外；聖經中的神蹟集中在少數時期，耶穌也提到以利亞、以利沙時代只有一人蒙神蹟供應或醫治，那時並不缺少忠心的人；耶穌許多醫治並未先要求信心；保羅禱告也未得醫治。沒得醫治不代表神不喜悅你。神蹟是將來國度的預嘗，完全的醫治在復活時才臨到。","pts":["我們記住的往往是例外，而非常態","聖經的神蹟集中在幾個關鍵時期","以利亞、以利沙時代只有少數人蒙神蹟","耶穌有些醫治並未先要求信心","信心與神蹟沒有一對一的公式","沒得醫治不表示神對你失望","神蹟醫治是預嘗，完全醫治在復活"],"mm":{"c":"沒得醫治不是信心不夠","b":[["羞愧陷阱",["神能醫治","為何不醫治我？","自我責備"]],["例外與常態",["存活故事是例外","許多人默默離世"]],["聖經證據",["神蹟集中時期","撒勒法寡婦與乃縵","保羅的刺"]],["信心與神蹟",["非公式","按神旨意"]],["將來的國",["拉撒路後來仍死","復活時完全醫治","神一定會醫治"]]]},"fw":[["處境","罹患腦癌與奇蹟故事"],["問題","是我的信心不夠嗎？"],["澄清一","例外不是常態"],["澄清二","信心不是公式"],["安慰","不必羞愧"],["盼望","國度中的完全醫治"]],"q":["被傳講的故事之所以特別，正因為它們是例外。","沒有得醫治，不等於神不喜悅你。","神一定會醫治——藉醫生、藉神蹟，或接我回家。"],"fb":null},{"id":23242,"slug":"doomers-find-hope","title":"在末日般的絕望中尋找盼望","date":"2026-09-26","author":"Derek Rishmawy","cats":["文化与艺术","凯勒文化护教中心"],"tags":["盼望","末日","凱勒文化護教中心"],"sum":"面對戰爭、疫情與AI等消息，作者坦承自己也容易陷入「黑藥丸」式末日悲觀。他提出四點默想：一、先承認歷史本就充滿慘劇，神沒有攔阻黑死病、大屠殺；基督徒的盼望不是「壞事不會發生」，而是復活能翻轉一切。二、記住彩虹：神應許在萬物更新前約束審判，世界有界限。三、上帝之城：我們的焦慮可能顯明盼望放錯了地方，如羅馬陷落時奧古斯丁的提醒。四、神自己：祂若是耶穌所顯明的良善之神，一切危機都無法與祂相比。","pts":["末日焦慮揭示人在世上何等脆弱","世俗與輪迴的故事都給不了深厚的盼望","別用「不會有事」來安慰末日論者","基督教先正視十字架，才談復活","可問：復活與新創造能否挽回我害怕的事？","彩虹之約：神為世界的審判劃了界限","太眷戀今世，才會被歷史劇變擊倒","終極盼望是神自己的良善"],"mm":{"c":"末日中的盼望","b":[["處境",["戰爭、疫情、AI","黑藥丸","脆弱的揭示"]],["正視現實",["歷史充滿災難","十字架先於復活","復活能挽回嗎？"]],["彩虹",["約束審判","世界的界限","具體的應許"]],["上帝之城",["羅馬陷落","奧古斯丁","盼望放對地方"]],["神自己",["看顧百合花","至善","永恆吞沒痛苦"]]]},"fw":[["坦白","我也容易末日悲觀"],["比較","其他世界觀的盼望"],["默想一","現實從來殘酷"],["默想二","記住彩虹"],["默想三","上帝之城"],["默想四","神自己"]],"q":["基督徒的盼望不是壞事不會發生，而是神能翻轉一切壞事。","我們的焦慮，常顯明盼望放在會朽壞的地方。","神若是耶穌所顯明的那位，世上沒有任何危機能與祂相比。"],"fb":null},{"id":23240,"slug":"ai-sovereignty-slavery","title":"AI 如何聲稱讓我們做「主人」，卻成了奴隸","date":"2026-09-26","author":"Chris Watkin","cats":["文化与艺术","凯勒文化护教中心"],"tags":["人論","人工智能","AI","凱勒文化護教中心","受造者"],"sum":"AI許諾讓我們做君王，萬事聽命於提示詞，卻悄悄使人淪為奴隸：諂媚讓人困在未經挑戰的自我中；依賴讓人失去能力；甚至有人因AI失眠或閉門與聊天機器人對話而入院。作者指出這種「稱王的奴隸」並非AI發明，而是自墮落以來的處境，奧古斯丁說羅馬「被統治的慾望所統治」。出路在詩篇8篇：人是「蒙神加冕的受造者」——不是神，也不是廢物；尊嚴是神賜的，不靠智力或生產力，因此任何機器都奪不走。基督藉捨己掌權，使我們有份於祂的生命。","pts":["AI的諂媚讓人困在未受挑戰的自我","依賴讓工具變成主人","聊天機器人被設計來最大化互動與利潤","「稱王的奴隸」是墮落以來人的處境","現代自由令人疲憊：自我塑造又被迫不斷經營","詩8：人是蒙神加冕的受造者","尊嚴若靠能力，機器終將勝出；若是神所賜，就無人能奪","基督教不是模仿遊戲，而是有份於基督"],"mm":{"c":"稱王的奴隸","b":[["AI的許諾",["萬事聽命","滿足慾望","人人為王"]],["實為奴隸",["諂媚","依賴","失眠與孤立"]],["古老處境",["奧古斯丁","被統治慾統治","伊甸園以來"]],["詩篇8篇",["人算什麼？","比天使微小一點","神賜冠冕"]],["基督",["取奴僕形像","受苦得冠冕","有份於祂"]]]},"fw":[["許諾","AI讓我們做主人"],["反轉","諂媚與依賴使人為奴"],["根源","墮落以來的悖論"],["聖經","蒙神加冕的受造者"],["應用","尊嚴不在競賽中"],["福音","在基督裡得自由"]],"q":["我們想掌控一切，卻被掌控的慾望控制。","人不是神，也不是廢物，而是蒙神加冕的受造者。","根本沒有尊嚴競賽，冠冕早已由神賜下。"],"fb":null},{"id":23236,"slug":"wisely-hire-ai-resumes","title":"面對一堆 AI 生成簡歷，如何慧眼識人？","date":"2026-09-24","author":"Sarah Eekhoff Zylstraã€Kyle Achterhoffã€Eileen Ruter","cats":["信仰与工作"],"tags":["職場","人工智能","AI"],"sum":"AI讓求職申請量暴增，許多甚至不是真人。多特大學的人資主管分享如何應對：用幾個關鍵問題（工作資格、簽證、信仰告白）篩選；若信仰陳述大量套用學校網站用語、缺乏個人經歷，就是警訊；是否在意AI潤色要看崗位，但會在面試中測試求職者獨立思考與表達的能力；由招聘小組多人共同審閱，留意時間重疊與前後矛盾；並在每次面試前禱告，信靠神的主權。","pts":["每次錄用收到的申請數三年增加三倍","70–80%的申請不符合要求","用關鍵問題快速縮小範圍","套用網站措辭、缺乏親身經歷是警訊","AI潤色可接受，但要確認本人能力","多人組成招聘小組共同把關","禱告並信靠神的主權"],"mm":{"c":"AI簡歷中識人","b":[["現況",["申請量暴增","假簡歷","表現千篇一律"]],["篩選",["工作資格","簽證需求","信仰認同"]],["警訊",["套用措辭","缺乏經歷","時間重疊"]],["對AI的態度",["視崗位而定","可潤色","面試驗證"]],["流程",["招聘小組","多輪面試"]],["屬靈",["求分辨力","禱告","信靠主權"]]]},"fw":[["背景","AI簡歷氾濫"],["做法","三個篩選問題"],["辨識","AI內容的警訊"],["原則","是否介意使用AI"],["把關","團隊與面試"],["信心","禱告與神的主權"]],"q":["我們招聘的是人，不是機器。","AI的痕跡，反倒提醒我們該在面試中多問什麼。","即使結果不如所願，主的手仍在其中。"],"fb":null},{"id":23232,"slug":"10-resolutions-ai","title":"基督徒使用 AI 的十大準則——源自十誡的倫理反思","date":"2026-09-24","author":"Skyler Flowersã€Michael Graham","cats":["信仰与工作"],"tags":["十誡","人工智能","AI","基督徒倫理"],"sum":"作者以十誡為框架，提出基督徒使用AI的十條準則：一、不把AI、自己或生產力當偶像；二、不以技術塑造神的形像或模擬祂的聲音，尊重受造者的有限；三、不讓AI取代默想、傳講與思考，尤其在講解神話語時；四、守安息，用AI減輕荊棘而非否定人的能力；五、尊重權柄，親自教導下一代；六、維護生命尊嚴，不用AI模仿逝者；七、不用AI疏離他人或尋求虛假親密，拒絕AI色情；八、不參與未經授權的剽竊；九、誠實揭露AI的使用，不據為己功；十、不讓算法助長攀比與貪慾，先求神的國。","pts":["一：AI與生產力都不可成為偶像","二：不以技術模擬神，尊重人的限度","三：AI不能取代禱告默想與講道","四：AI可減輕勞苦，但人仍要安息","五：不讓AI替我們教導下一代","六：維護生命，不用AI模仿逝者","七：不向聊天機器人尋求安慰與親密","八：不剽竊他人創作成果","九：如實說明AI的使用","十：不被算法激起的貪慾與攀比牽引"],"mm":{"c":"AI使用十準則","b":[["敬拜（1–3）",["不立偶像","不模擬神","尊神的名"]],["安息與權柄（4–5）",["減輕荊棘","守安息","教導下一代"]],["生命與關係（6–7）",["生命尊嚴","不模仿逝者","拒絕虛假親密"]],["財物與誠實（8–9）",["不剽竊","署名出處","揭露使用"]],["心思（10）",["不攀比貪婪","先求神的國"]]]},"fw":[["前提","需要有原則的倫理框架"],["第1–3誡","敬拜與神的名"],["第4–5誡","安息與權柄"],["第6–7誡","生命與關係"],["第8–9誡","財產與真實"],["第10誡","心中的慾望"]],"q":["AI可以減少荊棘蒺藜，卻不能取代神賜人的能力。","任何技術都替代不了人與人真實的聯結。","用了AI，就誠實說出來。"],"fb":null},{"id":23227,"slug":"hansen-911-praise-god","title":"我不明白 9·11，但我仍舊讚美神","date":"2026-09-24","author":"Collin Hansen","cats":["社会与时事"],"tags":["苦難","神的護理","9·11"],"sum":"作者以喜劇演員回憶9·11後被派去看守小鎮水塔的段子開場：大家笑，是因為當年最可怕的設想終究沒有發生。9·11讓新無神論者高喊「宗教毒害一切」，其背後預設是：神若容許任何邪惡，就不可能是良善的。作者以約伯記回應：神沒有向約伯解釋。我們常評判神容許了什麼，卻沒想過神攔阻了多少本可能發生的災難。他承認不明白9·11，但為神垂聽禱告、保守後來沒有同樣的災難而讚美神。","pts":["當年恐懼的許多可能最終沒有成真","9·11成為新無神論「宗教毒害一切」的論據","批評背後的預設：容許邪惡＝神不良善","聖經同時肯定邪惡真實、神掌權且良善","約伯記：神沒有解釋自己","我們很少思想神攔阻了多少邪惡","不明白，仍可讚美"],"mm":{"c":"不明白仍讚美","b":[["開場",["看守水塔的段子","過度反應","恐懼未成真"]],["文化衝擊",["新無神論","宗教毒害一切","對福音派的批判"]],["神義論",["邪惡真實","神掌權良善","約伯記38章"]],["看不見的護理",["被攔阻的災難","恩典托住萬有"]],["回應",["承認不明白","感謝垂聽禱告"]]]},"fw":[["引言","喜劇段子與25年回顧"],["歷史","9·11塑造的世界"],["質疑","神為何容許邪惡？"],["回應","約伯記與神的護理"],["轉向","想像那些沒發生的災禍"],["結論","仍舊讚美神"]],"q":["我們只看見神容許了什麼，卻看不見祂攔阻了多少。","我們能安然邁步，全靠神的護理托住。","不明白，並不妨礙讚美。"],"fb":null},{"id":23225,"slug":"retain-evangelical-global-church","title":"爲普世教會的緣故，重拾「福音派」之名","date":"2026-09-23","author":"Walter R. Strickland II","cats":["圣经与神学","凯勒文化护教中心"],"tags":["宣教","福音派","凱勒文化護教中心","普世教會"],"sum":"美國的「福音派」一詞在媒體中常被等同於政治票倉，許多持守傳統信仰的人想棄用它。作者認為這是美國中心主義，忽略了全球福音派的大家庭。他引用基德分析誤解的三因素（運動本身的成功、政治站隊、民調任人自稱），再以貝賓頓四特徵（歸信、行動、聖經、十架中心）與樂馬可三群體（主動認同、歷史性、功能性）重新界定。過去一世紀福音派重心已移向全球南方，2018年77%在南方。美國基督徒應澄清而非拋棄這個詞，謙卑重歸普世家庭。","pts":["福音派在美國被政治化、社會學化","棄用此詞反映美國例外論與自我中心","基德：成功、政治、民調三因素造成誤解","福音派即「好消息」之民","貝賓頓四特徵：歸信、行動、聖經、十架","樂馬可：主動認同、歷史性、功能性三群體","非洲基督徒一世紀內由1000萬增至3.6億","應在國內澄清，並謙卑參與全球運動"],"mm":{"c":"重拾福音派之名","b":[["美國危機",["政治票倉","81%數字","想棄用此詞"]],["誤解成因",["運動的成功","政治站隊","民調缺陷"]],["定義",["好消息之民","貝賓頓四特徵","三種群體"]],["全球圖景",["重心南移","非洲爆炸成長","多數世界領袖"]],["回應",["澄清不拋棄","不佔主導","重歸大家庭"]]]},"fw":[["異象","啟示錄7:9的萬民敬拜"],["問題","美國福音派的定義危機"],["分析","誤解的三因素"],["定義","釋經與歷史依據"],["數據","全球福音派的成長"],["呼籲","重歸普世大家庭"]],"q":["把「福音派」的定義權交給民調機構，是一種狹隘。","全球福音派的膚色正在變得越來越深。","澄清這個名字，是為了與失散的家人團聚。"],"fb":null},{"id":23222,"slug":"even-dementia-not-dark","title":"失智症的黑暗遮不住神的榮光","date":"2026-09-22","author":"Cynthia Fischer","cats":["基督徒生活"],"tags":["陪伴","老人","失智症"],"sum":"作者九十歲的母親原有中度失智，中風後連名詞都失去了，不再認得女兒，也記不得耶穌。作者學會轉移話題避免引發母親驚恐，陪她唱歌、讀繪本；母親像孩子般驚奇毛毛蟲變蝴蝶。讀詩篇139篇時她領悟：唯一改變的是母親的記憶，神沒有改變；神知道她何時躺下、聽懂她的喃喃自語，黑暗在祂面前如同白晝。神能去到作者去不了的地方牧養母親的靈魂，作者求神在祂的時候溫柔接她回家。","pts":["中風奪去母親所有的名詞與故事","如實回答會反覆引發驚恐，於是學會轉移話題","深夜偶爾聽到她哼唱詩歌，是甘甜的禮物","年邁的母親像孩子般對創造驚奇","她甚至記不得耶穌是誰，也無法出聲禱告","詩139：真正做工的唯有神","唯一改變的是她的記憶，神沒有改變"],"mm":{"c":"黑暗遮不住神","b":[["失去",["名詞消失","不認得女兒","記不得耶穌"]],["陪伴",["轉移話題","唱歌","讀繪本"]],["老小孩",["毛毛蟲變蝴蝶","生命的首尾"]],["詩篇139",["神知道一切","右手扶持","黑夜如白晝"]],["盼望",["神沒改變","牧養她的靈魂","引她走永生之路"]]]},"fw":[["處境","中風後的母親"],["困境","無法溝通與禱告"],["陪伴","歌曲與故事"],["默想","詩篇139篇"],["領悟","只有記憶變了，神沒變"],["禱告","求神接她回家"]],"q":["她記不得耶穌，但耶穌記得她。","唯一改變的是她的記憶，神沒有改變。","神能去到我去不了的地方，牧養她的靈魂。"],"fb":null},{"id":23215,"slug":"gossip-a-sin-that-is-sadly-indigenous-to-the-church","title":"傳閒話：教會生活中根深蒂固的罪","date":"2026-09-21","author":"Derrick Ntambi","cats":["教会事工"],"tags":["合一","教會生活","言語"],"sum":"傳閒話像爛魚的臭味，破壞教會群體的馨香，且常披著關心或代禱的外衣。作者引用定義：把別人帶有隱私的負面信息，告訴既不屬問題、也不屬解決方案的人。它導致關係破裂、羞辱人、毀名譽、生出不信任，使人不敢分享難處，甚至離開信仰。閒話多為真實但敏感的信息，誹謗則是虛假的；關鍵在動機是幫助還是傷害，必要時應告訴牧者並先徵得同意。舌頭雖小能點著森林，閒話也顯出心裡的驕傲；我們要脫去閒話、穿上愛，追求合一。","pts":["傳閒話常以代禱或關心為包裝","定義：向無關的人透露他人的負面隱私","後果：分裂、羞辱、不信任、使人離開","閒話是真但敏感，誹謗是假","分享前先審視動機，並盡量徵得當事人同意","口裡的閒話反映心中的驕傲與惡意","以基督的饒恕面對被中傷的傷痛","謹守口舌，彼此吸引歸於合一"],"mm":{"c":"傳閒話","b":[["定義",["洩漏密事","告訴無關的人","代禱也可能是閒話"]],["後果",["關係破裂","名譽受損","不信任","離開信仰"]],["分辨",["閒話vs誹謗","幫助或傷害？","告訴合適的人"]],["聖經",["舌頭如火","要為話交帳","心中所充滿的"]],["回應",["饒恕","愛人不虛假","追求合一"]]]},"fw":[["比喻","爛魚的臭味"],["定義","何謂傳閒話"],["嚴重性","對群體的傷害"],["分辨","關心與閒話的界線"],["聖經","言語與心"],["行動","脫去閒話，穿上愛"]],"q":["閒話傳出去只需幾分鐘，傷害卻可能持續一生。","分享之前先問：我是為了幫助他，還是讓他難堪？","合一的馨香，勝過閒話的惡臭。"],"fb":null},{"id":23212,"slug":"brokenness-different-sin","title":"「受傷」與罪有何不同？","date":"2026-09-21","author":"Jeremy Treatã€Erik Thoennes","cats":["教会事工"],"tags":["罪","破碎"],"sum":"這是兩位神學家的對話：在一些基督徒圈子裡，「受傷」被頻繁談論，「罪」卻很少提及。他們認為兩者都需要談，但要先定義清楚：罪是得罪聖潔的神，受傷則是罪帶來的後果之一。只談受傷會失去理解十字架、神的公義與審判的框架，也可能助長受害者心態，且無法要求壓迫者負責。但「受傷」的範疇有助於承認人也受到他人之罪的傷害，基督也擔當了那份羞恥。講罪就像醫生的診斷，看似壞消息，卻是愛與醫治的開始；同時要先讓人看見神的性情，才能明白罪有多深。","pts":["罪必須在與神的關係中定義","受傷、破碎是罪的後果，而非罪本身","不談罪，十字架與地獄的教義就說不通","不講壞消息有多壞，就不會珍惜好消息","受傷的範疇幫助我們承認他人加在人身上的罪","只談受傷會助長受害者心態","如實診斷是醫生之愛，也是牧者之責","先講神的性情，才能看見罪的深度"],"mm":{"c":"受傷與罪","b":[["定義",["罪：得罪聖潔的神","受傷：罪的後果"]],["只談受傷的危險",["十字架講不通","受害者心態","無法追究壓迫者"]],["受傷的價值",["承認他人的罪","基督擔當羞恥","整全牧養"]],["診斷的愛",["醫生的比喻","確診帶來釋然"]],["講道次序",["先講神的性情","再看罪的深度"]]]},"fw":[["現象","教會愛談受傷少談罪"],["定義","罪與受傷的區別"],["神學","聖潔的神與十字架"],["牧養","同時面對罪責與傷害"],["比喻","醫生的誠實診斷"],["提醒","從神的性情開始"]],"q":["受傷描述罪的後果，卻不能取代罪的定義。","不知道壞消息有多壞，就不懂好消息有多好。","誠實的診斷，是醫治的第一步。"],"fb":null},{"id":23210,"slug":"pain-blessing-hard-adoptions","title":"無怨無悔：艱難領養背後的痛苦與祝福","date":"2026-09-20","author":"Sarah Eekhoff Zylstra","cats":["基督徒生活"],"tags":["見證","寄養","收養","特殊兒童"],"sum":"本文記錄幾個艱難領養家庭的故事。茱莉與格雷格領養並寄養多個孩子，經歷警察、急診、誣告，仍感恩藉此認識神的恩典；吉爾與傑伊領養曾換過十個寄養家庭的男孩，經歷暴力與離家，吉爾在丈夫提醒下為心中的怨恨悔改，多年後男孩流淚感謝；丹與帕梅拉的兩個養子分別有自閉症與雙相障礙，甚至威脅殺人，至今未信主，他們仍忠心服事並照顧孫輩；約翰與簡的三個孩子受胎兒酒精影響，經歷住院、毒癮甚至人口販賣，簡後來開設兒童精神科診所幫助其他家庭。他們都不後悔。","pts":["艱難領養的掙扎並不罕見","許多父母藉苦難更深認識神的恩典","照顧者心中的怨恨也需要面對與悔改","教會的支持（或缺席）影響巨大","神沒有呼召我們預知一切，只呼召我們忠心","愛不是溫馨的感覺，而是每天堅持去做","胎兒酒精譜系障礙的孩子不是壞孩子，而是腦部受損","苦難使人更渴望天堂，也可成為服事他人的起點"],"mm":{"c":"艱難領養","b":[["茱莉與格雷格",["寄養到領養","誣告與急診","體會神的大愛"]],["吉爾與傑伊",["十個寄養家庭","暴力與離家","面對怨恨"]],["丹與帕梅拉",["自閉症與雙相","死亡威脅","仍未信主","照顧孫輩"]],["約翰與簡",["胎兒酒精影響","住院與毒癮","開設診所"]],["共同功課",["忠心而非預知","教會支持","渴望天堂"]]]},"fw":[["問題","領養到底圖什麼？"],["故事一","茱莉與格雷格"],["故事二","吉爾與傑伊"],["故事三","丹與帕梅拉"],["故事四","約翰與簡"],["結論","痛苦中的祝福"]],"q":["神沒有要我們預知一切，只要我們在祂安置的地方忠心。","愛有時不是感覺，而是每天早上起來繼續去做。","神正藉著這些孩子，使我們更像祂的兒子。"],"fb":null},{"id":23208,"slug":"ai-tools-work-demands","title":"AI 能輔助工作，但我們就該用嗎？","date":"2026-09-20","author":"Rachel Gilson","cats":["信仰与工作","凯勒文化护教中心"],"tags":["工作","人工智能","AI","凱勒文化護教中心"],"sum":"作者借奧多諾萬的框架，把工作分為物質、社會、個人三個維度：工作讓我們觸摸世界也被世界塑造；工作是人彼此依賴、造就他人的領域；工作也塑造品格、使人發現呼召。墮落後三個維度都被扭曲。評估AI的關鍵在於分辨「正當要求」（如負重訓練般有益的艱難）與「無謂苦差」（如本可用一封郵件解決的會議）。AI可除去苦差，但若抹去正當要求，就會失去成長、逃避「彼此相愛」的關係，甚至拒絕神塑造我們的方式。約伯記28章提醒：技術能掘出寶藏，卻找不到智慧；敬畏主才是智慧。","pts":["工作有物質、社會、個人三個維度","工作的尊嚴在於能造就他人","怎麼做與做什麼同樣重要","墮落後工作在三個維度都被扭曲","正當要求是有益的磨鍊，苦差是無益的勞苦","AI可除去苦差，但不該抹去正當要求","別讓技術成為逃避「彼此」命令的藉口","要問：這工具替代了我工作的哪一部分？","技術找不到智慧，敬畏主才是智慧"],"mm":{"c":"AI與工作的分辨","b":[["物質維度",["身體觸摸世界","被世界塑造","手寫vs打字"]],["社會維度",["彼此依賴","造就他人","避免孤立"]],["個人維度",["塑造品格","發現呼召","警惕捷徑"]],["要求vs苦差",["負重訓練","多餘會議","分辨不易"]],["智慧之道",["約伯記28章","技術找不到智慧","敬畏主"]]]},"fw":[["背景","AI從隱形走到檯前"],["定義","工作的三個維度"],["扭曲","墮落後的工作"],["支點","正當要求與無謂苦差"],["評估","三維度逐一審視AI"],["結論","向神尋求智慧"]],"q":["別用AI抹去那些正在塑造你的艱難。","工作的尊嚴，在於有人依靠你的付出。","技術能把寶石帶到光中，卻找不到智慧的所在。"],"fb":null},{"id":23206,"slug":"glorify-god-quit-job","title":"辭職的時候也要榮耀神","date":"2026-09-20","author":"Brad Larson","cats":["信仰与工作"],"tags":["辭職","離職","交接"],"sum":"現代人平均在職不到四年，一生會換好幾份工作，而基督徒無論去哪都代表基督。作者提出辭職時榮耀神的三個原則：一、當面坦誠溝通，不支吾、不誇大或拍馬屁，並真心感謝雇主的信任與薪水；二、用心工作到最後一天，做最早到最晚走的人，好好交接，因為大家都在看你如何收尾；三、離開後口下留情，不必說謊，但不毀謗前東家，把冤屈交給審判的神，盡力與人和睦。","pts":["一生換多份工作是常態","辭職要當面談、說清楚","不誇大、不奉承，真心感謝","最後幾週仍要全力以赴","同事都在觀察你如何收尾","離職後不抹黑前雇主","受委屈交給神，祂是審判者"],"mm":{"c":"辭職也榮耀神","b":[["背景",["在職時間縮短","你代表基督"]],["坦誠感恩",["當面談","是就說是","真心道謝"]],["做到最後",["好好交接","最早到最晚走","基督的使者"]],["口下留情",["不毀謗","神是審判者","與人和睦"]]]},"fw":[["處境","第一次辭職的恐懼"],["原則一","坦誠溝通，存感恩"],["原則二","用心工作到最後"],["原則三","離開後口下留情"],["提醒","交回門禁卡時你代表君王"]],"q":["怎樣離開，也是一種見證。","交接的最後一週，最能看出你為誰工作。","受了委屈不必辯護，神都看見了。"],"fb":null},{"id":23200,"slug":"update-content-editorial-standards","title":"關於內容與編輯標準的更新說明","date":"2026-09-16","author":"TGC","cats":["社会与时事"],"tags":["事工","標準","編輯部"],"sum":"福音聯盟發佈內容與編輯標準的更新說明：二十多年來網站發表原創文章並曾託管許多獨立博客。隨著讀者獲取內容的方式改變，尤其AI輔助搜尋普及，理事會建議將所有出版內容納入同一套編輯標準。編輯團隊已開始分階段審閱過往的獨立博客內容，評估哪些應保留、哪些因過時或不再符合使命而移除，預計在2027年初新網站上線前完成。","pts":["TGC多年來發表原創文章並託管獨立博客","AI輔助搜尋改變了內容被接觸的方式","所有內容將統一適用同一套編輯標準","過往博客內容將分階段審閱","移除理由：過時、脫離現實或不合使命","預計2027年初推出重新設計的網站"],"mm":{"c":"編輯標準更新","b":[["背景",["二十多年原創","獨立博客"]],["原因",["AI搜尋普及","標準一致"]],["做法",["分階段審閱","保留或移除"]],["時程",["第一階段已啟動","2027年初新網站"]]]},"fw":[["回顧","TGC的內容歷史"],["變化","讀者接觸內容的方式"],["決定","統一編輯標準"],["執行","審閱過往博客"],["目標","新網站上線"]],"q":["內容越容易被搜尋到，越需要一致的標準。","整理過去的文字，是為了更好地服事未來的讀者。"],"fb":null},{"id":23197,"slug":"overlooked-argument-christianity","title":"一個常受到忽略的基督教論證","date":"2026-09-16","author":"Gavin Ortlund","cats":["圣经与神学","凯勒文化护教中心"],"tags":["預言","護教","應驗","凱勒文化護教中心"],"sum":"作者重新闡述常被忽略的彌賽亞預言論證，強調其「累積效應」。舊約整體是向前眺望的盼望故事：神揀選以色列為要祝福萬國，盼望逐漸聚焦於大衛後裔的君王，並與先知、祭司的盼望匯合，承載以色列一切期待，大衛譜系也刻意被記錄延續。預言有兩條主線：得勝的彌賽亞與受苦的彌賽亞（賽53章的十個特徵與耶穌驚人相似）。新約宣告耶穌的死應驗受苦，復活應驗得勝。人為操弄、文本篡改或巧合都難以解釋，如但以理書9章的時間預言。最合理的解釋是超自然的應驗。","pts":["聖經的雙重結構呈現從應許到應驗","論證關鍵在預言的累積效應","舊約基本情節：以色列要祝福萬國","盼望聚焦於大衛的後裔，結合先知、祭司","得勝的與受苦的兩條預言主線","以賽亞書53章與耶穌受難細節高度吻合","若是編造，不會保留與十字架矛盾的預言","但以理書9章的「七十個七」指向約公元33年"],"mm":{"c":"彌賽亞預言論證","b":[["結構",["舊約盼望","新約應驗","累積效應"]],["五條原則",["祝福萬國","大衛後裔","先知祭司君王","眾盼望匯流","譜系延續"]],["兩條主線",["得勝的王","受苦的僕人","拉比難以調和"]],["以賽亞53",["代人受苦","默然不語","與財主同葬"]],["排除他說",["非人為操弄","非文本篡改","非巧合"]]]},"fw":[["引言","姍姍來遲的英雄"],["疑問","預言是否可靠？"],["概覽","舊約盼望的五原則"],["兩條線","得勝與受苦的彌賽亞"],["應驗","死與復活雙重成全"],["驗證","排除其他解釋"],["結論","盼望已進入歷史"]],"q":["舊約讀起來像一個漫長的等待故事。","耶穌的死成全了受苦的預言，復活成全了得勝的預言。","若要編造彌賽亞，誰會選擇十字架作為結局？"],"fb":null},{"id":23194,"slug":"mission-partnerships-need-relationships","title":"宣教夥伴關係要往深處走","date":"2026-09-16","author":"Philip Hunt","cats":["教会事工"],"tags":["宣教","非洲"],"sum":"在贊比亞宣教多年的作者指出，許多非洲教會受成功神學侵蝕、信仰有名無實，而西方宣教的家長式合作與直接金錢資助無意中助長了依賴。他以一位贊比亞牧師挪用購車款、事敗後試圖自殺為例，說明問題不在錢而在關係不夠深。解方不是西方抽身，而是根據約翰三書建立互惠的夥伴關係：彼此尊重、雙向接待、共同付代價、透明信任，並以地方教會為中心，如保羅的奉獻模式。他建議西方教會只支持由地方教會差派與問責的人，透過教會間合作、定期溝通、共同決策；非洲教會則要扛起差派宣教士的責任。","pts":["非洲教會表面興旺，實則受成功神學侵蝕","家長式合作造成依賴與表面關係","問題的根源常在關係太淺、缺乏透明","直接資助個人延續殖民心態、取消問責","約翰三書：互惠的同工關係","保羅的奉獻以教會為中心","西方：問責、責任、溝通、共同決策","非洲：不要以為缺資源就不能宣教"],"mm":{"c":"更深的宣教夥伴關係","b":[["問題",["成功神學","有名無實","經濟依賴"]],["案例",["贊比亞牧師","挪用購車款","關係太淺"]],["家長式",["西方握錢袋","取消問責","殖民心態"]],["聖經根基",["約翰三書互惠","以教會為中心","保羅的模式"]],["改革建議",["西方：四個層面","非洲：自己差派"]]]},"fw":[["現況","非洲教會的隱憂"],["診斷","表面投入與家長式"],["案例","贊比亞的教訓"],["聖經","互惠與教會中心"],["對西方","四項建議"],["對非洲","扛起宣教責任"]],"q":["問題主要不在錢，而在關係不夠深。","繞過教會的奉獻，削弱了基督賦予教會的權柄。","缺資源就不能宣教，是必須切除的謊言。"],"fb":null},{"id":23191,"slug":"church-finally-building","title":"當教會終於有了自己的會堂","date":"2026-09-14","author":"Derek Griz","cats":["教会事工"],"tags":["植堂","場地","設施"],"sum":"作者的教會流動聚會近十年後終於搬進自己的會堂，並分享三個功課：一、固定場所確實是祝福——佈置更從容、設備可常駐、可舉辦更多聚會並與社區分享；二、需要適應期——清潔、綠化、排期、維護、使用政策等新責任接踵而來，不要急著僱人或定政策；三、謙卑艱苦的牧養仍要繼續——出席人數雖一度增長約四分之一，但會堂只是工具，邀請、留住與門訓人仍靠人際的事工。","pts":["流動聚會有辛苦，也有與異象相連的興奮","固定會堂讓事工更從容、空間用途更多","新會堂帶來清潔、維護、排期等新責任","給自己適應期，不急著定政策或僱人","會堂是工具不是萬能藥","人仍需要被親自邀請","建堂後要重新聚焦教會核心使命"],"mm":{"c":"終於有了會堂","b":[["流動時期",["學校租借","拖車與推車","渴望固定場所"]],["祝福",["佈置從容","多元使用","社區共享"]],["適應期",["清潔綠化","排期維護","使用政策"]],["牧養繼續",["人數增長","仍需邀請","門訓靠人"]],["結語",["為國度建造","站在蒙應允的禱告裡"]]]},"fw":[["起點","流動聚會的日子"],["渴望","何時有固定場所？"],["功課一","實實在在的祝福"],["功課二","需要適應期"],["功課三","牧養工作仍在繼續"],["鼓勵","為國度建造"]],"q":["會堂是福音事工的工具，不是萬能藥。","建築可以吸引人來一次，留住人的卻是門訓。","搬進新堂，就是站在已蒙應允的禱告裡。"],"fb":null},{"id":23188,"slug":"gospel-according-birds","title":"飛鳥的福音","date":"2026-09-14","author":"Kevin Burrell","cats":["文化与艺术"],"tags":["榮耀","自然"],"sum":"作者是一位愛觀鳥的牧師。疫情期間他看見一隻罕見地安靜停在樹枝上的蜂鳥，由此反思生活節奏與安息，並開設「飛鳥神學」博客。耶穌常用微小之物講天國，也吩咐我們看天上的飛鳥。他從鳥兒學到信心功課：鷦鷯提醒信心是會歌唱的；嘲鶇提醒門徒要聆聽並效法正確的聲音；山雀的警報叫聲讓他省察生命中的危險；烏林鴞能「看見」聲音、紅頭美洲鷲化解死亡毒素，都成了講道的比喻。受造界不能取代聖經，卻生動映照神的話語，邀請我們舉目敬畏。","pts":["神的偉大也顯在微小之物中","耶穌用麵酵、芥菜種、麻雀講天國","安靜的蜂鳥提醒生活需要慢下來","鷦鷯：會歌唱的信心","嘲鶇：門徒在模仿中成長","山雀警報：評估內心隱藏的危險","受造界映照聖經，但不能取代聖經","神造了一萬一千多種鳥，是要我們細看"],"mm":{"c":"飛鳥的福音","b":[["起點",["羅1:20","微小之物","安靜的蜂鳥"]],["門廊功課",["鷦鷯：歌唱","嘲鶇：模仿","山雀：警覺"]],["更多奇妙",["烏林鴞看見聲音","美洲鷲化解死亡"]],["神學原則",["普遍啟示","聖經才使人得救","映照神的話"]],["邀請",["抬頭仰望","挑一門受造之學","敬畏大藝術家"]]]},"fw":[["引言","不是大峽谷，而是蜂鳥"],["經歷","疫情中的觀鳥"],["功課","門廊飛鳥的信心課"],["延伸","奇妙的鳥類冷知識"],["原則","受造界印證神的道"],["邀請","舉目細看神的作品"]],"q":["神從不浪費任何可以用來說明自己的比喻。","「看那天上的飛鳥」本是一道命令。","受造界不能救人，卻能讓人在神的榮耀前肅然起敬。"],"fb":null},{"id":23185,"slug":"learn-grieve-well","title":"學會好好悲傷","date":"2026-09-13","author":"Bob Cutillo","cats":["基督徒生活"],"tags":["苦難","盼望","悲傷"],"sum":"作者是醫生，妻子確診胃癌晚期後離世。他把悲傷比作屋裡的一個房間，人人都有，只是位置大小不同；文化讓人以為生活安穩，風暴來時便措手不及。他提出好好悲傷的五種方式：坦誠面對，轉身迎向黑暗才能迎來新的一天；耐心同行，悲傷沒有時間表，人會帶著悲傷的印記繼續前行；在群體中悲傷，先向神傾訴，再勇敢向人袒露脆弱；懷著感恩，看見風暴中仍有一抹藍天，所失去的本是禮物；懷抱盼望，因為救主靠近傷心的人。","pts":["悲傷像屋裡的房間，人人都有","愛得越深，悲傷越刻骨","不要逃避，要轉身面對悲傷的黑暗","悲傷沒有時間表，也無法完全「走出來」","不要獨自悲傷，先向神、再向人傾訴","在風暴中尋找神仍在作工的痕跡","失去的本是一段時間的禮物","耶和華靠近傷心的人"],"mm":{"c":"好好悲傷","b":[["悲傷的房間",["人人都有","位置不同","風暴突至"]],["坦誠",["不逃避","轉身迎向黑暗"]],["耐心",["沒有時間表","帶著印記前行"]],["群體",["先向神傾吐","袒露脆弱","一起禱告"]],["感恩",["一抹藍天","失去的是禮物"]],["盼望",["受苦的救主","詩34:18"]]]},"fw":[["比喻","悲傷是屋裡的房間"],["經歷","妻子罹癌離世"],["方式一","坦誠面對"],["方式二","耐心同行"],["方式三","在群體中"],["方式四","懷著感恩"],["方式五","懷抱盼望"]],"q":["要迎向光明，有時必須先轉身走向黑暗。","我們失去的，本來就是一段時間的禮物。","悲傷時不必假裝堅強，主靠近傷心的人。"],"fb":null},{"id":23183,"slug":"the-weight-of-glory-c-s-lewiss-remarkable-and-surprising-sermon","title":"《榮耀之重》：C. S. 路易斯一篇非凡（且出人意料）的講道","date":"2026-09-12","author":"Justin Taylor","cats":["文化与艺术"],"tags":["榮耀","C. S. 路易斯"],"sum":"作者梳理路易斯1941年的講道〈榮耀之重〉的完整思路，指出多數人只引用名句而未讀全文。路易斯先比較「無私」與「愛」：無私是消極的克己，愛則是積極為人謀求益處，新約並不否定人對自身好處的渴慕——問題是我們太容易滿足於次好的事物。他區分三種賞賜，基督徒生活中對終極賞賜的渴慕本身會逐漸加深。人心中有一種屬世幸福無法滿足的渴慕，正如飢餓顯示有食物存在。聖經以五種意象描述應許，其中「榮耀」有兩層：蒙神稱許接納（如孩子被父親誇獎），以及如光輝般與美聯合。應用上，路易斯更強調思想鄰舍將來的榮耀，因為每個人都將成為不朽的存在。","pts":["愛比無私更積極：為他人謀求益處","新約肯定人渴慕自身的好處，問題在於渴慕太弱","行動與賞賜有三種關係","渴慕會在順服中逐漸加深","人心有一種屬世幸福無法撫平的渴慕","渴慕不證明必得滿足，卻指向其對象存在","榮耀即蒙神稱許、被接納進入萬物核心","榮耀也是與美聯合、領受神的光輝","每天相遇的人都將走向永恆的命運"],"mm":{"c":"榮耀之重","b":[["愛 vs 無私",["消極克己","積極謀益","慾望太弱"]],["賞賜與渴慕",["三種關係","在順服中加深"]],["屬天的渴慕",["無法撫平","飢餓的比喻","指向故鄉"]],["榮耀一",["蒙神稱許","像孩子被誇","被接納或被拒"]],["榮耀二",["光輝與美","自然是記號","源頭的喜樂"]],["應用",["鄰舍的榮耀","沒有平凡的人","謙卑承擔"]]]},"fw":[["背景","1941年牛津的講道"],["起點","愛與無私之爭"],["論證","渴慕與賞賜"],["證據","人心的屬天渴慕"],["應許","兩層意義的榮耀"],["應用","看待鄰舍的眼光"]],"q":["問題不在我們太想要快樂，而在我們太容易滿足於次好的。","最深的盼望不只是認識神，而是被神所認識、所接納。","你今天交談的那個人，終將走向永恆。"],"fb":null},{"id":23181,"slug":"moses-family-worship-parents","title":"摩西——家庭敬拜的榜樣","date":"2026-09-12","author":"Thomas West","cats":["基督徒生活"],"tags":["門訓","敬拜","養育"],"sum":"作者以摩西在尼波山上看見應許之地卻不得進入為引，談疲憊父母如何帶領家庭敬拜。他指出兩個相反的坑：一是把家庭敬拜當成餐桌上的神學研討課，孩子一胡鬧就崩潰；二是完全隨性、不做安排，無形中傳遞信仰不重要。申命記6章同時要求「記在心上」的固定形式與「坐下、行路、躺下、起來」的日常自由。而且先有神賜的豐盛，才有我們的教導——家庭敬拜是恩典而非重擔。作者分享自家做法：送孩子上學前禱告、早晚背經、學要理問答，並在開車、做飯時自然談論神。","pts":["家庭敬拜常是父母最灰心的嘗試","第一個坑：過高的研討課期待","第二個坑：只靠隨性，不做安排","申命記6章：結構與自由並重","先領受神的豐盛，才有產出","家庭敬拜也是對抗文化謬誤的門訓","摩西的話流傳到他去不了的地方"],"mm":{"c":"家庭敬拜","b":[["處境",["疲憊的父母","孩子胡鬧","灰心"]],["坑一",["神學研討課","期望過高"]],["坑二",["完全隨性","信仰顯得不重要"]],["申命記6章",["記在心上","隨時談論","恩典為本"]],["實踐",["上學前禱告","背經與要理問答","開車唱詩"]]]},"fw":[["引言","尼波山上的摩西"],["困難","家庭敬拜的灰心"],["診斷","兩個相反的坑"],["聖經","申命記6章的平衡"],["根基","恩典先於責任"],["實踐","作者家的做法"],["鼓勵","不要放棄"]],"q":["家庭敬拜，是把你無法獨自擔負的傳下去。","形式與自由，缺一不可。","神先讓我們吃飽，才吩咐我們教導兒女。"],"fb":null},{"id":23178,"slug":"ai-parenting-advice","title":"爲什麼AI的育兒建議總是差一截","date":"2026-09-11","author":"Katie Deckert","cats":["基督徒生活"],"tags":["養育","人工智能","AI"],"sum":"作者夫婦為孩子入睡問題深夜求助AI，得到看似合理的建議，幾週後卻沒什麼改善。後來請教會裡有經驗的夫婦吃飯，對方坦誠分享掙扎、針對他們的孩子給建議、為他們禱告並持續關心。作者指出AI的三個短板：給不了真正的智慧（智慧始於敬畏耶和華）；給不了量身定做的建議（不認識你的孩子、不能陪你禱告）；給不了屬神的安慰（它從未受苦、也從未被主安慰）。AI在某些事上有用，但求智慧應當求告神，並藉著神的百姓領受。","pts":["AI隨叫隨到、沒有情緒包袱，因此誘人","AI的建議「像那麼回事」，卻缺乏深度","有經驗的肢體能給出貼身的建議與禱告","智慧從敬畏耶和華開始，AI沒有膝蓋可屈","AI不認識你的孩子，無法量身定做","主藉著祂的百姓安慰祂的百姓","求智慧要向神求（雅1:5）"],"mm":{"c":"AI育兒建議的短板","b":[["經歷",["深夜問AI","建議像樣但無效","教會夫婦的晚餐"]],["誘惑",["隨叫隨到","不戳破偶像"]],["缺智慧",["敬畏耶和華","聖靈的悟性"]],["缺貼身",["不認識孩子","不能代禱"]],["缺安慰",["沒受過苦","肢體彼此相顧"]],["出路",["求告神","神的話與百姓"]]]},"fw":[["經歷","AI與教會夫婦的對比"],["誘惑","為何想找AI"],["短板一","沒有智慧"],["短板二","不能量身定做"],["短板三","沒有屬神的安慰"],["結論","向神求智慧"]],"q":["AI能複製信息，卻生不出智慧。","真正的安慰，來自曾被主安慰過的人。","神的百姓從沒有AI，也從不缺智慧。"],"fb":null},{"id":23172,"slug":"staying-faithful-slow-hard","title":"事工緩慢又艱難，如何持守忠心","date":"2026-09-11","author":"Sarah Eekhoff Zylstraã€Carey Moore","cats":["信仰与工作"],"tags":["服事","見證","機構","創業"],"sum":"八十歲的凱里·摩爾在六十多歲時才第一次進入孟菲斯的黑人社區橙丘。原以為辦查經午餐不難，卻發現世代貧困、識字不足與危機式生活讓人難以穩定參與。她修繕一棟老房子，後來買下一家小茶葉公司，雇用附近婦女，讓她們有收入並每天來到這個安全、有信仰根基的地方，在其中查經、配對導師。十五年來進展緩慢，但有人找到工作、學會預算、建立自信。她說會繼續，因為主還沒叫她停止；她的責任是彰顯主的美善，而神也在改變她自己。","pts":["橙丘曾是最早允許黑人擁有住房的社區之一","最初的查經計劃因生活不穩定而難以進行","世代貧困使人處於長期危機模式","以茶葉公司提供工作並建立日常群體","提供一個像枕頭般安全的地方","學習要放慢，一次一點","沒有衡量指標，但忠心於呼召","神改變婦女，也改變了服事者"],"mm":{"c":"緩慢艱難中的忠心","b":[["背景",["橙丘歷史","破敗與隔絕","六十多歲才來"]],["起初計劃",["午餐查經","技能課程","出席不穩"]],["轉向",["茶葉公司","雇用婦女","每天相聚"]],["屬靈事工",["查考多卷書","導師陪伴","安全的空間"]],["堅持",["主未叫停","小小進步","神也改變我"]]]},"fw":[["背景","凱里與橙丘"],["呼召","從查經走向活出神的道"],["嘗試","姐妹團與午餐"],["轉折","茶葉公司提供工作"],["果效","緩慢但真實的改變"],["動力","忠於呼召"]],"q":["主沒有叫我停，我就繼續。","有時最需要的，是一個安全的地方。","事工沒有指標可衡量，但神知道。"],"fb":null},{"id":23170,"slug":"winner-2026-essay-contest","title":"獲獎名單公佈：福音聯盟 2026 年青少年徵文大賽","date":"2026-09-10","author":"TGC","cats":["社会与时事"],"tags":["福音聯盟","寫作比賽"],"sum":"福音聯盟公佈2026年青少年徵文比賽結果：共收到208篇投稿，作者16至25歲，約三分之二為女性，來自美國及南非、菲律賓、尼日利亞、中國等多國。最熱門的主題是「AI時代如何守住人性」，近半數投稿圍繞此題，也有人寫教會跨年齡的友誼與擺脫罪習慣的掙扎。第一名是關掉搜索引擎學習等候神的文章，第二名是以園藝反思生命短暫，第三名是呼籲姊妹把性方面的罪帶到光中、藉認罪與肢體幫助得挽回的見證。","pts":["208篇投稿，來自世界多地","作者皆委身地方教會","近半數投稿寫AI時代的人性","許多人寫教會如何給他們歸屬感","第一名：關掉搜索引擎，等候神","第二名：在泥土中珍惜生命","第三名：把罪帶到光中"],"mm":{"c":"2026青少年徵文","b":[["投稿概況",["208篇","16–25歲","多國參與"]],["熱門主題",["AI與人性","教會歸屬","擺脫罪習"]],["第一名",["數字安息","不必知道所有答案"]],["第二名",["園藝","時間有限"]],["第三名",["認罪","肢體陪伴"]]]},"fw":[["背景","Z世代的挑戰"],["數據","投稿概況"],["主題","三大方向"],["獲獎","三篇得獎作品"]],"q":["聖經的答案，對每一個新世代依然適用。","我們從來不是被設計來掌握所有答案的。"],"fb":null},{"id":23156,"slug":"church-fathers-hard-read","title":"爲什麼有些教父的作品這麼難讀","date":"2026-09-09","author":"Cody Barnhart","cats":["圣经与神学"],"tags":["教父","著作","研讀"],"sum":"許多人讀早期教父作品幾頁就放棄，以為是自己讀不懂或教父寫得太晦澀。作者以亞歷山太的革利免《雜記》為例，說明有些晦澀是刻意的：革利免把知識的種子藏在繁雜的學問中，像獵人追蹤獵物，辛苦得來的真理更甘甜。這種做法源自耶穌「不要把珍珠丟在豬前」與用比喻說話的原則；革利免也以磁鐵吸鐵比喻書本只吸引能領會的讀者，呼應保羅說唯有在基督裡帕子才被揭開。作者建議可先從較平易的《十二使徒遺訓》等入門，但遇到艱深時不要合上書，因為鑽研的過程本身就在塑造生命。","pts":["教父的晦澀有時是刻意為之","革利免三部曲：勸勉、導師、雜記","辛苦尋得的真理更甘甜","依據：太7:6與耶穌用比喻的原則","磁鐵與鐵：書本吸引能領會的讀者","在基督裡，經文的帕子被揭開","可從《十二使徒遺訓》等較易的作品入門","把艱難本身當作閱讀的目的"],"mm":{"c":"教父為何難讀","b":[["困境",["讀幾頁就放棄","怪自己或怪作者"]],["革利免",["雜記","繁雜如拼布","藏起知識種子"]],["獵人比喻",["循線追蹤","辛苦更甘甜"]],["耶穌的原則",["珍珠與豬","比喻的用意"]],["靈命塑造",["磁鐵吸鐵","帕子揭開"]],["建議",["易讀入門書","不要合上書"]]]},"fw":[["困境","讀教父讀不下去"],["個案","革利免的《雜記》"],["原因","刻意的晦澀"],["根據","耶穌的教導原則"],["果效","塑造屬靈領悟"],["建議","如何閱讀教父"]],"q":["辛苦追尋來的真理，嚐起來格外甘甜。","讀不懂時別急著合上書，艱難本身就在塑造你。","書向所有人敞開，卻只吸引準備好的心。"],"fb":null},{"id":23148,"slug":"ai-usefulness-dangers-preachers","title":"AI的用處與隱患","date":"2026-09-08","author":"Clayton Chancey","cats":["教会事工"],"tags":["屬靈操練","人工智能","AI"],"sum":"作者是AI架構師，為牧者提供思考AI的技術與神學框架。大語言模型只是預測下一個詞的「模擬推理機器」，不是有靈魂的心智；高風險應用甚至需要人工建立的知識圖譜來防止幻覺。最大危險之一是擬人化：AI能完美模仿溝通卻沒有內在生命，無法取代聖經中的彼此團契。他實驗發現AI寫的講章模仿風格但空洞；用結構化問題引導較好，但與親自解經相比仍蒼白——講道首先是屬靈操練。他也以保羅警告的「言詞之爭」說明AI是操弄語義的終極機器。建議：把AI當研究助手與構思工具，但牧者要保持解經主體。AI抬高下限，卻拉不高上限；未來「手工打造」的講章將更珍貴。","pts":["大語言模型是模仿者，不是思考者","高風險應用需要人為的現實地圖，類似「恰當的基本信念」","擬人化的危險：有溝通表象卻無內在生命","AI無法參與聖靈內住的團契","AI模仿風格不等於剽竊，但仍空洞","講道首先是屬靈操練，其次才是學術研究","保羅警告的「言詞之爭」與AI的本質相似","把AI當研究助手與外化思考的工具","AI抬高下限，拉不高上限"],"mm":{"c":"AI對傳道人的用處與隱患","b":[["技術本質",["預測下一個詞","模擬推理","需要知識圖譜"]],["擬人化",["溝通無內在生命","不能取代團契"]],["講道實驗",["模仿凱勒","結構化提問","對比後顯得空洞"]],["言詞之爭",["保羅的警告","操弄語義","煽情與炫技"]],["善用方式",["研究助手","語音構思","認知加速器"]],["未來",["下限提高","手工打造的價值"]]]},"fw":[["引言","與前任牧師的午餐"],["技術","AI是模擬推理機器"],["危險一","擬人化"],["實驗","用AI預備講道"],["危險二","言詞之爭"],["建議","兩種智慧使用"],["展望","手工內容的時代"]],"q":["AI可以幫拙劣變平庸，卻不能幫優秀變卓越。","除了言詞，大語言模型一無所有。","當講章可以秒生成，一週禱告掙扎寫成的講章就更珍貴。"],"fb":null},{"id":23146,"slug":"know-about-dementia","title":"照料失智症患者，你需要知道的八件事","date":"2026-09-08","author":"Gaye Clark","cats":["基督徒生活"],"tags":["失智症","照護"],"sum":"作者是護士個案管理師，父親曾患血管性失智，母親患阿爾茨海默症。她指出失智是生理疾病引發的心理症狀，患者不總能控制行為，照護者若不把無力帶到十字架前就容易暴躁。她列出八件事：盡早規劃並坦誠溝通；辦理財務與醫療授權委託書；破除費用迷思（聯邦醫療保險不付長期照護）；調整溝通方式，不與患者爭辯；以憐憫保護患者免於反覆悲傷（如不再一次次告知喪親）；失智照護是馬拉松，要學習並分工；認知衰退攔不住基督的愛，詩歌與經文仍能觸動；神仍使用失智者，例如一位常忘記自己講過福音的老人反覆傳講，帶領鄰居信主。","pts":["失智有一百多種類型，各有挑戰","失智使照護者要麼暴躁，要麼來到十字架前","盡早溝通照護期待與安排","授權委託書在失智照護中不可少","長期照護費用高昂，別存僥倖","不與患者講理，改為順勢引導","避免讓患者一再經歷初聞噩耗的痛苦","照護是馬拉松，要分工與休息","神仍使用失智者傳福音"],"mm":{"c":"失智照護八件事","b":[["預備",["盡早規劃","法律文件","費用現實"]],["相處",["溝通智慧","善意保護","不爭辯"]],["持久",["是一場馬拉松","學習資源","手足分工"]],["屬靈",["詩歌與經文","基督的愛不受阻"]],["神的大能",["馬西反覆傳福音","八十九歲的芮妮信主"]]]},"fw":[["開場","該隱與亞伯的笑話"],["認識","失智是生理疾病"],["實務1–3","規劃、法律、費用"],["實務4–6","溝通、保護、長期"],["屬靈7–8","愛與神的使用"],["盼望","沒有什麼能使我們與神的愛隔絕"]],"q":["失智不是故意，而是疾病。","她忘了自己講過福音，卻因此講了一遍又一遍。","照顧失智的家人，會把人逼到暴躁或逼到十字架前。"],"fb":null},{"id":23143,"slug":"caregivers-suffer-dementia-too","title":"照料失智症患者的人也在受苦","date":"2026-09-08","author":"Matt Rehrer","cats":["基督徒生活"],"tags":["失智症","照護"],"sum":"作者是急診醫生，在診間看見失智症病人與她筋疲力盡的丈夫時領悟：這是兩位需要關懷的病人。照護者多為配偶或子女，隨病情加重成為全職工作，承受體力透支、睡眠中斷、日落症候群帶來的混亂，以及孤立、靈性枯竭與因怨恨而生的內疚。作者以詩篇46篇與神同在的應許安慰照護者：神是同行者，無人看見的服事神都看見。實用建議包括：操練感恩、記錄小小的祝福；在家中顯眼處擺放經文；一起讀經唱詩（音樂記憶保存較久）；邀請教會分擔，謙卑接受幫助並使用喘息服務。","pts":["照護者也是需要關懷的病人","照護工作隨病情加重成為全職","體力極限、睡眠中斷、日落症候群","孤立與靈性枯竭，伴隨怨恨與內疚","神是同行者，不只是場邊啦啦隊","無人看見的服事，神看見也必賞賜","擺放熟悉的經文、一起唱詩","不要想當英雄，讓別人一起承擔"],"mm":{"c":"照護者也在受苦","b":[["領悟",["急診室的夫婦","兩位病人"]],["挑戰",["體力","睡眠","孤立","靈性枯竭"]],["仰望神",["詩46:1","與你同在","恩典更豐盛"]],["服事的意義",["照顧神的形像","神看見"]],["實用建議",["操練感恩","擺放經文","一起唱詩","邀人分擔"]]]},"fw":[["場景","C15病房"],["現況","照護者的負擔"],["困境","身體與心靈的耗竭"],["安慰","神的同在與大能"],["建議","四項實用做法"],["結語","大醫生看顧兩位病人"]],"q":["躺在病床上的是病人，坐在角落裡的也是。","擔子越重，恩典越多。","承認自己的極限，才能接受別人的扶持。"],"fb":null},{"id":23141,"slug":"talk-jesus-post-christian-scrivener","title":"當人們不再認同你的前提，該如何談論耶穌？","date":"2026-09-07","author":"Matt Smethurstã€Glen Scrivenerã€Ligon Duncan","cats":["文化与艺术"],"tags":["價值觀","文化","護教"],"sum":"這是與佈道家格蘭·思科瑞萬那的播客對談，探討後基督教文化中如何談論耶穌。他介紹「321」福音框架：三一神、兩位亞當、與基督聯合。他在《我們呼吸的空氣》中指出，世俗人所珍視的平等、自由、進步、人權其實深受基督教塑造，基督徒不必以福音為恥。牧者要先認清文化偶像，如進步敘事與「時代勢利」；並以「接待」取代「包容」——邀人進入一個有方向的家庭。他鼓勵基督徒擁抱自己的「古怪」：鹽要鹹、光要亮，活出引人發問的生命。悔改是如婚約般全人生的轉向，是一份禮物。面對更世俗的未來，教會可採「亞伯拉罕選項」：專心建造信仰家園，必要時出手救人。最後示範回應關於聖經、基督神性、唯一道路與性倫理的質疑。","pts":["321：神的三、世界的二、你的一","後基督教如同後工業化，仍帶著基督教烙印","世俗價值是無法實驗驗證的信念","基督徒不必以福音為恥","傳福音要先認清並揭穿文化偶像","接待比包容更合乎聖經","擁抱基督徒的不同，活出引人提問的生命","悔改是如婚約般的全人轉向","亞伯拉罕選項：建造家園，必要時出手"],"mm":{"c":"後基督教時代談耶穌","b":[["321框架",["三一神","兩位亞當","與基督聯合"]],["我們呼吸的空氣",["世俗價值源自基督教","製造認知失調"]],["文化偶像",["進步敘事","時代勢利","取消文化"]],["接待vs包容",["聖誕晚餐比喻","有方向的大家庭"]],["擁抱古怪",["鹽與光","彼前3:15","悔改如婚約"]],["快問快答",["聖經過時？","為何是神？","唯一道路？","性倫理？"]]]},"fw":[["介紹","格蘭與321課程"],["視角","跨文化者看文化"],["論點","世俗主義仍有基督教色彩"],["裝備","識破偶像與進步敘事"],["策略","接待與擁抱不同"],["未來","亞伯拉罕選項"],["示範","四個常見質疑"]],"q":["真正的危險不是答不出問題，而是沒活出讓人想問的生命。","包容讓人坐在同一屋簷下，接待則邀人上同一張餐桌。","基督教的符號是十字架，不是梯子。"],"fb":null},{"id":23138,"slug":"talk-depressed-child","title":"如何與抑鬱的孩子交談","date":"2026-09-04","author":"Christine Chappell","cats":["基督徒生活"],"tags":["養育","抑鬱","兒女"],"sum":"作者自己曾經歷抑鬱，後來又陪伴尚未進入青春期的女兒走過抑鬱。她指出父母不能取代醫生、諮詢師或牧者，卻能給出無可替代的愛與鼓勵，並建議在餐桌或車上與孩子談五個福音話題：抑鬱不是不正常，摩西、以利亞、約拿、大衛都曾極度悲傷；人生難免有悲傷的季節，但喜樂終會回來；聖經的哀歌為悲傷提供語言，可與孩子一起讀詩篇13、77、88篇；耶穌是憂患之子，是與我們同行的旅伴；定睛永恆，抑鬱不會是最後的結局。","pts":["父母給不了專業診療，卻能給愛與鼓勵","讓孩子知道抑鬱並非罕見的例外","許多神所愛的人都經歷過深度悲傷","哭有時、笑有時，喜樂終會回來","哀歌詩篇提供表達悲傷的語言","耶穌是憂患之子，也是同行旅伴","天國的盼望：抑鬱不是最後結局"],"mm":{"c":"與抑鬱的孩子交談","b":[["父母角色",["不取代專業","給予愛與鼓勵"]],["不是不正常",["摩西、以利亞","約拿、大衛"]],["悲傷的季節",["傳3:4","喜樂會回來"]],["悲傷的語言",["哀歌","詩13、77、88"]],["與耶穌同行",["憂患之子","不離開我們"]],["定睛永恆",["不再有眼淚","不是結局"]]]},"fw":[["經歷","母女都經歷抑鬱"],["定位","父母能給的是愛"],["話題1–2","正常化與季節感"],["話題3","哀歌的語言"],["話題4–5","耶穌與永恆"],["結語","在灰暗中倚靠恩典"]],"q":["抑鬱不會是故事的最後一章。","神在聖經裡為我們預備了悲傷的語言。","耶穌不只是走在前面的先鋒，也是同行的旅伴。"],"fb":null},{"id":23136,"slug":"support-teen-depression","title":"陪伴青少年走過抑鬱","date":"2026-09-04","author":"Steve Eatmon","cats":["基督徒生活"],"tags":["養育","抑鬱","心理健康"],"sum":"青春期的變化有些自然，有些卻是抑鬱的警訊。父母常想立刻解決問題、叫孩子多禱告讀經，結果被抗拒，自己也感到失敗。作者是亞裔教會牧師，提出三點建議：去污名化——抑鬱在亞裔圈子仍是禁忌，但每年約15%青少年經歷抑鬱，罹患不代表孩子注定悲慘；分辨——既不忽視也不過度反應，參考重度抑鬱持續兩週以上的徵狀，必要時尋求專業與基督徒輔導；化解對抗——避免像約伯的朋友般給簡化答案，「只要禱告」可能火上加油。最好的武器是福音：指引孩子看耶穌受苦的榜樣，投靠更強壯的臂膀。","pts":["父母常想快速解決，反而引發對抗","亞裔文化中抑鬱仍帶污名","每年約15%的12–17歲青少年經歷抑鬱","分辨正常情緒起伏與持續的抑鬱徵狀","症狀明顯持續時應尋求專業幫助","「只要禱告」可能讓孩子更煩躁","苦難不總有非黑即白的解釋","福音讓父母不必扛起「必須解決一切」的重擔"],"mm":{"c":"陪伴抑鬱的青少年","b":[["父母困境",["想快速解決","被抗拒","自責"]],["去污名化",["亞裔禁忌","15%青少年","不是異類"]],["分辨",["不忽視","不過度反應","兩週以上徵狀"]],["化解對抗",["約伯的朋友","別只說禱告","沒有公式"]],["福音",["耶穌的受苦","更強壯的臂膀"]]]},"fw":[["現象","青春期的變化與警訊"],["困境","父母的無力與自責"],["建議一","去污名化"],["建議二","謹慎分辨"],["建議三","化解對抗"],["根基","福音是最好的武器"]],"q":["好意的「只要禱告」，有時反而讓孩子更孤單。","苦難不總有非黑即白的答案。","父母不必獨自修好一切，神能托住孩子最黑暗的時刻。"],"fb":null},{"id":23133,"slug":"reading-declines-discipleship-suffers","title":"閱讀衰退，門訓受損","date":"2026-09-03","author":"Lauren Ducommun","cats":["文化与艺术"],"tags":["閱讀","AI"],"sum":"2024年全美教育評估顯示，三分之一八年級生與四成四年級生未達基礎閱讀水平，連精英大學生也不知如何讀書。作者指出識字問題就是聖經素養問題：聖經是有人物、敘事與文體的文學，讀不好就難以領會。新教傳統一向重視識字，主日學正源於教導窮孩子讀書。大聲朗讀能提升理解與流暢度。建議教會課程多朗讀較長經文、少依賴視頻；家庭是門訓主場，父母應優先為孩子讀書、讀聖經；教會可設書架，善用優質兒童文學與有聲書。","pts":["三分之一八年級生缺乏基礎閱讀能力","識字問題直接影響讀聖經的能力","新教傳統一向推動識字，主日學即源於此","聽力理解會限制閱讀理解","大聲朗讀能提升理解與流暢度","教會課程應多讀長段經文，少依賴視頻","門訓主場在家中，父母要為孩子讀書","有聲書可補充詞彙與故事"],"mm":{"c":"閱讀與門訓","b":[["警訊",["評估結果下滑","大學生不會讀書"]],["連結",["聖經是文學","識字=聖經素養"]],["傳統",["主日學起源","宣教士推廣識字"]],["大聲朗讀",["提升理解","聽力理解"]],["實踐",["課堂讀長經文","家庭朗讀","教會書架","有聲書"]]]},"fw":[["數據","閱讀能力衰退"],["意義","影響讀經能力"],["歷史","新教重視識字"],["方法","大聲朗讀"],["行動","教會與家庭的做法"]],"q":["幫孩子學會閱讀，可能是影響最深遠的事工。","聖經本質上是一部被閱讀與聆聽的書。","讀不懂故事的人，也很難讀懂救贖的大故事。"],"fb":null},{"id":23127,"slug":"romans-4-and-the-justification-of-abraham-in-light-of-perspectives-new","title":"《羅馬書》四章與亞伯拉罕的稱義","date":"2026-08-31","author":"David Shaw","cats":["圣经与神学"],"tags":["保羅新觀","NPP"],"sum":"這是一篇學術文章，探討羅馬書4章在保羅新觀爭論中的地位。作者先概述二十世紀稱義教義的兩種命運：一是保留傳統定義但被邊緣化（瑞德、史懷哲、桑德斯、坎貝爾）；二是保持核心但被重新定義（凱澤曼、鄧恩、賴特），把稱義解為聖約群體的身份問題。接著評析賴特的新解讀：他以「賞賜」一詞連結創15章，主張亞伯拉罕所信「稱罪人為義的神」是指神將外邦人納入他的家族。作者反駁：「稱罪人為義」呼應舊約禁止審判官稱惡人為義的法理語境，並承接羅1–3章普世罪性與3:21–26的贖罪；亞伯拉罕是外邦信徒效法的信心榜樣。結論：拒絕非此即彼，神的忿怒與恩典、個人與群體、縱向與橫向的稱義須一併持守。","pts":["稱義在20世紀被邊緣化或被重新定義","史懷哲「二選一」的思維影響深遠","新觀把稱義理解為聖約身份與外邦人接納","賴特新解：亞伯拉罕信神會稱外邦人為義","「稱罪人為義」在舊約是法理語境","羅1–3章顯明人人都需要被稱義","亞伯拉罕的信心是第一章拜偶像的反轉","應拒絕救恩論與聖約之間的虛假對立"],"mm":{"c":"羅馬書4章與稱義","b":[["20世紀兩種命運",["邊緣化","重新定義"]],["新觀現狀",["鄧恩緩和","賴特新進路"]],["賴特新解",["賞賜μισθός","外邦人納入","算為聖約成員"]],["作者回應",["法理語境","羅1–3罪性","3:21–26贖罪"]],["亞伯拉罕",["未受割禮稱義","信心的榜樣","外邦人之父"]],["結論",["拒絕二選一","個人與群體","縱向與橫向"]]]},"fw":[["背景","稱義在20世紀的討論"],["現況","保羅新觀的爭論"],["介紹","賴特對羅4章的新解"],["評析","經文關聯與舊約背景"],["論證","亞伯拉罕作為信心典範"],["結語","超越史懷哲的對立預設"]],"q":["神對罪的忿怒，正是祂慷慨恩典的背景。","若稱義不是因著信，根本就不會有神的子民。","進步往往在於拒絕非此即彼的前提。"],"fb":null},{"id":23125,"slug":"missing-youth-pastors","title":"青少年事工牧師難尋","date":"2026-08-28","author":"Sarah Eekhoff Zylstra","cats":["教会事工"],"tags":["青少年事工","青少年","Z世代"],"sum":"青年牧師嚴重短缺：TGC職位欄中約五分之一是青少年事工。原因包括神學生偏好牧養主堂、Z世代更焦慮也更忙碌、九十年代的遊戲披薩模式已不合時宜。現代青年事工起初是傳福音工具，後來流於娛樂化，未能裝備孩子逆文化而行。改革宗圈子轉向以聖經為中心的門訓，孩子其實渴望扎實教導。文章介紹霍夫史密斯的做法：決定像主任牧師般全力投入、在學校附近咖啡店辦晨間查經、與家長一對一會談並為孩子代禱、讓青少年讀神學書並與年長會友交流。青年事工正擴展為家庭事工，長期留任才見果效。","pts":["青年牧師供不應求，神學生多不願投入","Z世代更焦慮、更忙、更難面對面交流","九十年代的娛樂式青年事工已過時","孩子渴望扎實的聖經教導","在學校附近咖啡店辦簡短查經","家長聯絡會：一對一了解並代禱","提高要求，讓青少年讀神學書","長期留任，第五年才真正見果效"],"mm":{"c":"青年牧師難尋","b":[["現況",["職缺多","神學生不願","需求不斷"]],["歷史",["傳福音起源","娛樂化黃金期","未能裝備逆流"]],["轉向門訓",["逐卷查經","孩子渴望真道"]],["新挑戰",["社交焦慮","AI與色情","不同學校"]],["創新做法",["咖啡店查經","家長聯絡會","神學讀書會"]],["建議",["長期留任","家庭事工","從會眾中培養"]]]},"fw":[["故事","不想當青年牧師的霍夫史密斯"],["現況","青年牧師短缺"],["歷史","青年事工的演變"],["轉向","以聖經為中心"],["挑戰","學生與家長的新難處"],["做法","查經、家長會、讀書會"],["展望","樂觀與建議"]],"q":["教初中生聖經很難，因為教初中生本來就難。","對孩子要求越高，他們反而越投入。","趁水泥未乾時，留下屬於耶穌的印記。"],"fb":null},{"id":23122,"slug":"identity-beyond-disability","title":"殘缺的身體，無憾的身份","date":"2026-08-28","author":"Dan Vander Plaats","cats":["基督徒生活"],"tags":["身份","殘障","殘疾"],"sum":"作者天生一條聲帶與部分舌頭麻痺，說話方式與眾不同，平時像普通人，與陌生人初見時卻又成了「有殘疾的人」，因而陷入身份危機。他看見三種文化敘事：克服困難的勵志者、被邊緣化的受害者、以殘疾為傲。這些源自現代與後現代兩種世界觀，卻共享同一信念：人的價值取決於能力。但沒有任何成就或標籤承受得起身份的重量。聖經說殘疾是「不正常世界中正常的一部分」；在基督裡，較軟弱的肢體反而不可或缺（林前12:22），我們承載神的形像，生命與基督一同藏在神裡面。","pts":["殘障者常活在「普通」與「不同」的張力中","三種敘事：勵志者、受害者、以殘疾為傲","現代視角把殘疾當作要修復的反常","後現代視角把殘疾當作社會建構","兩者都把價值與能力掛鉤","殘疾是墮落世界中可預期的一部分","較軟弱的肢體更是不可少的","身份扎根在基督裡，危機就結束"],"mm":{"c":"超越殘障的身份","b":[["處境",["說話方式不同","初見陌生人時"]],["三種敘事",["勵志得勝","受害者","以殘疾為傲"]],["兩種世界觀",["現代：要修復","後現代：社會建構","共同：價值看能力"]],["現實",["失業率高","教會少有殘障事工"]],["在基督裡",["林前12:22","弗4:24","西3:3"]]]},"fw":[["自述","我的身份危機"],["敘事","三套彼此競爭的故事"],["分析","兩種世界觀的共同信念"],["後果","以能力論價值的傷害"],["聖經","不正常世界中的正常"],["答案","身份扎根在基督裡"]],"q":["沒有任何成就或標籤，能承受身份的重量。","較軟弱的肢體，正是不可少的。","我不是得勝者，也不是受害者，我屬於祂。"],"fb":null},{"id":23115,"slug":"roach-infestation-taught-rest","title":"蟑螂教我學會安息","date":"2026-08-28","author":"Gracie MacCaughelty","cats":["信仰与工作"],"tags":["苦難","安息"],"sum":"作者婚後搬進新公寓不久發現德國蟑螂在牆內築巢，只好帶著一個行李箱搬回父母家，接著又遇上生病、祖父過世、車子故障，買了新房卻還沒入住，感覺有三個住所卻沒有一個家。喜歡秩序的她焦慮不堪，直到寫禱告日誌時發現自己把安穩的居所當作偶像，要等「安定下來」才能快樂。神挪去她的舒適與可預測性，讓她看見祂才是安息的源頭；她也在父母接待、快速成交、家人與教會幫忙粉刷打包中看見神的供應。每天都面對兩扇門：絕望或信靠。","pts":["蟑螂危機讓新家瞬間失去「家」的感覺","接連的打擊讓人覺得無所依靠","喜歡秩序的人特別難以承受不可預測","把居住環境當成偶像，等安定才快樂","在世有苦難，但在基督裡有平安","神藉困境讓人學會依賴他人與神","艱難的季節成為回顧神恩的里程碑"],"mm":{"c":"蟑螂與安息","b":[["事件",["德國蟑螂","搬回娘家","接連打擊"]],["內心",["喜歡秩序","焦慮疲憊","懸在空中"]],["領悟",["禱告日誌","居所成了偶像","約16:33"]],["神的供應",["父母接待","快速購屋","教會幫忙"]],["每天的選擇",["絕望之門","信靠之門","箴3:5"]]]},"fw":[["事件","新家發現蟑螂"],["處境","一連串的不如意"],["掙扎","失去秩序的焦慮"],["光照","看見自己的偶像"],["供應","神在其中的作為"],["回顧","神恩的里程碑"]],"q":["我等著安定下來才要快樂，卻忘了安息本在神裡面。","每天都有兩扇門：一扇通向絕望，一扇通向信靠。","神拿走我的舒適，是要我看見真正的安慰在祂。"],"fb":null},{"id":23112,"slug":"college-really-christian","title":"送孩子去基督教大學之前，先問這幾個問題","date":"2026-08-27","author":"Timothy Hall","cats":["信仰与工作"],"tags":["大學教育"],"sum":"公眾對大學的信任大幅下降，許多家庭轉向基督教大學，但並非掛著基督教名號的學校都持守信仰。資深學者提出選校時要問的問題：先看使命宣言是否明確持守聖經權威與歷史性教義；更重要的是教職員是否真心認同使命——聘用時是否要求信仰聲明、評估是否看信仰與服事，可直接詢問院長與系主任；學校是否支持信仰與學科的整合；課外是否有校牧、團契、集體敬拜，並協助學生連結地方教會。無論去哪裡，都要在家中規劃屬靈成長，並信靠神的護理。","pts":["大學公信力從57%降至42%","基督教名號不等於真正的基督教環境","使命宣言越少提聖經權威，越要深入調查","教職員是否認同使命最為關鍵","可向院長、系主任詢問聘用政策","學校是否支持信仰與學術的整合","課外屬靈生活與連結地方教會","最終信靠神的帶領"],"mm":{"c":"選擇基督教大學","b":[["背景",["信任危機","轉向基督教大學"]],["使命宣言",["聖經權威","歷史教義"]],["教職員",["信仰聲明","評估制度","信仰整合"]],["學生生活",["校牧辦公室","團契敬拜"]],["地方教會",["福音為中心","交通可達"]],["信靠",["腓1:6","神的護理"]]]},"fw":[["背景","高等教育信任危機"],["原則","別只看標籤"],["問題一","使命宣言"],["問題二","教職員"],["問題三","學生屬靈生活"],["問題四","地方教會"],["結語","安息在神的護理中"]],"q":["校名有「基督教」三個字，不代表教室裡也是。","比起招生手冊，更要看老師們信什麼。","無論去哪裡，都別離開地方教會。"],"fb":null},{"id":23105,"slug":"need-healthy-tribalism","title":"我們需要健康的部落主義","date":"2026-08-27","author":"Jason Dees","cats":["社会与时事"],"tags":["分歧","部落主義"],"sum":"作者觀察福音派內部的極端部落主義日益嚴重：從政治分歧延伸到教會論、事工風格，甚至「還能聽某位牧師講道嗎」，背後常是個人崇拜。他提出四個真理追求健康的部落主義：一、坦然承認自己屬於某個陣營（沒有真正的無宗派），既自豪也能建設性批評；二、積極傾聽陣營外的聲音，參加立場不完全相同的聚會是為了學習而非挑錯；三、分辨異端與健康的分歧，警惕假先知，但別急於切割或幸災樂禍；四、建立跨陣營的面對面友誼，讓信任的朋友挑戰自己的預設。","pts":["共同致力的聯盟精神被極端部落主義取代","政治分歧強化了教會內部的分裂","部落主義常源於個人崇拜","沒有真正的無宗派，只有大宗派或微宗派","向陣營外學習，是因神將恩賜賜給整個教會","要分辨異端與次要分歧","看見他人跌倒竊喜，是心出了問題","需要跨越陣營的深厚友誼"],"mm":{"c":"健康的部落主義","b":[["問題",["極端部落化","政治分裂","個人崇拜"]],["接納陣營",["沒有無宗派","自豪也批評"]],["傾聽外聲",["參加不同聚會","為學習不為挑錯"]],["分辨",["異端要劃界","次要分歧可容","別急於切割"]],["面對面團契",["信任的朋友","挑戰預設"]]]},"fw":[["觀察","福音派的部落化"],["根源","政治與個人崇拜"],["真理一","接納所屬陣營"],["真理二","傾聽陣營外"],["真理三","分辨異端與分歧"],["真理四","跨陣營的友誼"],["目標","在正統中合一"]],"q":["有自己的陣營沒問題，只聽自己陣營才是問題。","看見不同立場的人跌倒而竊喜，就是心出了問題。","在基要真理上一致，次要的分歧反而能使教會更堅固。"],"fb":null},{"id":23100,"slug":"story-views-communion","title":"桌上的粉筆印：主餐觀點分歧背後的故事","date":"2026-08-25","author":"Jared Kennedy","cats":["圣经与神学"],"tags":["聖禮","主餐"],"sum":"作者以超級英雄的起源故事比喻，說明不同主餐觀點背後的歷史。1529年馬爾堡會談中，改教家們都拒絕天主教的變質說（主餐是神父再獻祭，導致迷信行為）。慈運理主張紀念說：基督的人性身體不能同時在多處，「這是我的身體」意為「這代表我的身體」。路德在桌上用粉筆寫下「這是我的身體」並用布蓋住，堅持按字面理解，提出聖禮聯合說。兩人最終流淚和好卻未一同領主餐。加爾文則提出屬靈同在說：基督的身體不實際在餅酒中，但主餐是蒙恩的管道。作者鼓勵學習加爾文謙卑大度的態度，理解他人的確信。","pts":["改教家們都拒絕天主教的變質說","變質說把赦罪歸於神父的再獻祭","慈運理：紀念說，餅酒是象徵","路德：聖禮聯合說，基督身體在餅酒之中","路德在桌上寫下「這是我的身體」","兩人和好卻未能一同領主餐","加爾文：屬靈同在說，主餐是蒙恩管道","了解歷史能幫助我們尊重彼此的確信"],"mm":{"c":"主餐觀點的起源","b":[["變質說",["天主教","神父再獻祭","迷信行為"]],["紀念說",["慈運理","象徵","身體不能多處"]],["聖禮聯合說",["路德","粉筆字","按字面理解"]],["屬靈同在說",["加爾文","蒙恩管道","不是空洞記號"]],["應用",["謙卑大度","聆聽他人","感恩領受"]]]},"fw":[["比喻","超級英雄的起源故事"],["場景","1529年馬爾堡會談"],["共同拒絕","變質說"],["爭論","紀念說vs聖禮聯合說"],["第三條路","加爾文的屬靈同在說"],["應用","讓歷史塑造確信"]],"q":["那些看似鑽牛角尖的爭論，對信徒的靈魂卻至關重要。","他們流淚彼此道歉，卻仍無法同領一杯。","下次領餅時，記得祂為你捨了自己。"],"fb":null},{"id":23095,"slug":"consuming-cultivating-creating-church","title":"教會裡的消費、耕耘、創作","date":"2026-08-25","author":"Trevin Wax","cats":["基督徒生活"],"tags":["門訓","服事","消費"],"sum":"作者延伸「消費、耕耘、創作」的主題到教會生活。許多在教會長大的年輕人懷念過去青年團契帶給他們的美好經歷，到了二十多歲卻仍以消費者心態期待被服事。作者勸他們轉換心態：問自己如何為別人營造那種改變生命的環境。他以奶奶三十年來準備聖誕早午餐為比喻：總有一天要有人接手，否則傳統就會消失。主日學、招待、詩班、宣教都是如此。門訓不只是帶出門徒，而是帶出能再帶門徒的門徒；不轉變心態，事工就會萎縮。","pts":["許多年輕人懷念被服事的時光","該從消費者轉為耕耘者、創作者","為他人付出的喜樂不亞於被付出","奶奶的聖誕早午餐需要有人接棒","各項事工都需要接手的人","門訓是帶出能再帶門徒的門徒"],"mm":{"c":"教會中的三種角色","b":[["懷舊",["美好的青年團契","期待再被服事"]],["心態轉變",["從消費者","到耕耘者與創作者"]],["奶奶的早午餐",["三十年的付出","需要有人接手"]],["應用",["學生事工","主日學","招待與詩班"]],["門訓文化",["門徒帶門徒","不轉變就萎縮"]]]},"fw":[["現象","年輕人懷念過去"],["勸勉","改變心態"],["比喻","奶奶的聖誕早午餐"],["應用","各項事工"],["目標","延續門訓文化"]],"q":["別只懷念別人為你做過的，輪到你為下一代去做了。","傳統若沒有人接棒，就會在一代之間消失。","門訓的目標，是帶出會帶門徒的門徒。"],"fb":null},{"id":23092,"slug":"spurgeon-scandal-failure","title":"一代講道宗師竟出自坐過牢的家庭？","date":"2026-08-24","author":"Rob Tervet","cats":["教会事工"],"tags":["養育兒女","司布真","護理"],"sum":"作者的父親發現司布真的父親約翰曾因債務入獄，當時司布真才兩歲，連嬰兒床都被賣掉還債。這解釋了司布真為何由祖父母撫養、為何強烈反對借貸。作者從中提出兩個屬靈功課：一、神能使用父母的失敗成就孩子的益處——司布真在祖父家中觀察傳道人祖父、愛上清教徒書籍，這段歲月深深塑造了他；二、過去的失敗不代表未來不能結果子——約翰後來成為牧師，教會從25人增長到近500人。偉大的事奉也可能有卑微凌亂的起點。","pts":["司布真的父親曾因負債入獄","這段經歷解釋了司布真的成長背景與反對借債","羅8:28也適用於我們的兒女","司布真在祖父家愛上清教徒文學","父親後來成為大有果效的牧師","神能從囚犯中興起普通的牧者","偉大的事奉可能有卑微的起點"],"mm":{"c":"司布真家族的祕密","b":[["發現",["父親因債入獄","嬰兒床被賣"]],["影響",["由祖父母撫養","反對借貸"]],["功課一",["父母的失敗","成就孩子的益處","祖父的書房"]],["功課二",["失敗不是終點","25人到500人"]],["神的護理",["隱藏的手","萬事互相效力"]]]},"fw":[["發現","約翰·司布真入獄"],["背景","維多利亞時代的債務"],["功課一","神使用父母的失敗"],["功課二","失敗後仍可結果子"],["結論","神隱祕掌管一切"]],"q":["你的失敗，可能正是神塑造孩子的工具。","過去的監牢，不能決定未來的果子。","最輝煌的事奉，也可能始於一個凌亂的起點。"],"fb":null},{"id":23090,"slug":"10-mistakes-i-made-in-handling-my-first-conflict-in-ministry","title":"我在事奉衝突中曾經犯下的十個錯誤","date":"2026-08-24","author":"Confex Makhalira","cats":["教会事工","十个错误"],"tags":["錯誤","衝突","反思"],"sum":"馬拉維的一位牧師回顧事奉初期第一次重大衝突中所犯的十個錯誤：沒有安息在神的護理中；花太多時間與反對者溝通而禱告太少；忘了教會屬於基督，由祂親自建造；急於說話、不肯傾聽、容易動怒；把反對者往最壞處想；沒有先省察自己的心；懼怕人、在意他人眼光；以為這衝突獨一無二；缺乏忍耐，總處於戰鬥狀態；朋友反目時震驚並生出苦毒。他感恩事奉不是由過錯定義，而是由神的信實決定。","pts":["相信護理是一回事，在衝突中活出來是另一回事","與人溝通重要，但與神交談更重要","教會是基督的，陰間的權柄不能勝過","聽是為了理解，不是為了回應","愛是凡事相信，盡量善意解讀","先求神鑑察自己的心","懼怕人是網羅","別人也經歷過同樣的試探","多等候主，少血氣反擊","朋友會辜負人，連耶穌也被出賣"],"mm":{"c":"事奉衝突的十個錯誤","b":[["對神",["不安息於護理","禱告太少","忘記教會屬基督"]],["對人",["急於說話","往最壞處想","懼怕人"]],["對己",["不省察自己","以為獨一無二"]],["態度",["缺乏忍耐","因背叛生苦毒"]],["恩典",["事奉不由過錯定義","神的信實"]]]},"fw":[["引言","牧職是最大的福分"],["背景","事奉初期的衝突"],["錯誤1–3","與神的關係"],["錯誤4–7","對待他人與自己"],["錯誤8–10","視角與情緒"],["結論","神的恩典更大"]],"q":["我花太多時間跟反對我的人說話，卻太少跟神說話。","教會是基督在建造，不需要你獨自撐住。","連主都被一同吃飯的朋友出賣，我何必驚訝？"],"fb":null},{"id":23087,"slug":"consume-create-cultivate-choice","title":"消費、創作，還是耕耘？","date":"2026-08-22","author":"Trevin Wax","cats":["基督徒生活"],"tags":["創作","消費","上癮"],"sum":"一位年輕人問作者如何更有效地服事主，作者的答案是：每天閒暇時，我們都在選擇消費、耕耘或創作。消費是被動接受娛樂；耕耘是用心培育某事物，如閱讀、學樂器、園藝，同時也被塑造；創作是造出新事物供人享受，如寫詩、譜曲、繪畫。文化推我們以為創作是工作、消費才是休息，但耕耘與創作同樣能帶來放鬆。作者不反對看劇打遊戲，但呼籲要刻意選擇，直到更喜歡創作而非消費，以此在即時滿足的世界中活出造物主的形像。","pts":["閒暇時有三種選擇：消費、耕耘、創作","從工作的機械效率切換到娛樂的機械麻木","休息不等於消費","耕耘是用心培育，也被它塑造","創作是留下讓別人受益的東西","刻意多選擇創作與耕耘，直到更喜歡它們","不反對娛樂，但需自覺安排"],"mm":{"c":"消費、耕耘、創作","b":[["消費",["被動娛樂","幾乎不付出"]],["耕耘",["閱讀學習","樂器園藝","塑造自己"]],["創作",["寫作譜曲","繪畫","讓人受益"]],["文化謬誤",["創作=工作","消費=休息"]],["實踐",["刻意選擇","享受過程","活出造物主形像"]]]},"fw":[["提問","如何更有效服事主"],["回答","閒暇的三種選擇"],["定義","消費、耕耘、創作"],["謬誤","以為休息就是消費"],["實踐","刻意為之"]],"q":["我們是人，不是機器：工作時不是，休息時也不是。","享受做飯的過程，就像享受美食一樣。","多選幾次創作，直到你更喜歡創作而非消費。"],"fb":null},{"id":23085,"slug":"live-not-by-lies-individual-conscience-and-objective-truth","title":"從極權到消費主義：不靠謊言而活，守住良知與真理","date":"2026-08-22","author":"Kamal Weerakoon","cats":["文化与艺术"],"tags":["文化","消費","良知"],"sum":"作者從良知談起：各大宗教都承認人有內在的道德指引，而良知要成立，必須有客觀的外在現實。索爾仁尼琴在〈不靠謊言而活〉中呼籲蘇聯人民不以革命或抗議，而以拒絕參與自己明知是謊言的言行來抵抗極權，因為暴力需要謊言掩護、謊言需要暴力支撐。今天西方的威脅較隱蔽：享樂麻木良知，部落迴音室硬化良知，同樣是靠謊言而活。如今文化中出現對超越性的新興趣。然而，單靠良知無法引人歸向基督；唯有基督的血能洗淨良心，使人悔改並活在真理中。","pts":["良知需以客觀現實為根基，否則淪為偏好","索爾仁尼琴：不讓生命被謊言定義","不靠革命，而是拒絕參與謊言","勇氣與懦弱都會塑造人","今日西方：享樂麻木良知，部落硬化良知","文化出現對超越性的新興趣","普遍恩典帶來和平，卻可能使人看不見需要基督","唯有基督的血能洗淨良心"],"mm":{"c":"不靠謊言而活","b":[["良知",["內在道德指引","需要客觀現實"]],["極權",["索爾仁尼琴","拒絕參與謊言","暴力與謊言互依"]],["今日威脅",["娛樂至死","部落迴音室"]],["文化轉向",["厭倦新無神論","尋求超越"]],["福音",["良知不足以救人","基督洗淨良心","真摯的悔改"]]]},"fw":[["提問","良知是否真實存在？"],["前提","客觀現實"],["歷史","索爾仁尼琴的呼籲"],["當下","西方的隱性威脅"],["轉機","對超越性的渴望"],["答案","唯有基督能潔淨良知"]],"q":["暴力需要謊言遮掩，謊言需要暴力撐腰。","享樂會麻木良知，迴音室會使良知變硬。","良知能指出罪，卻只有基督能洗淨罪。"],"fb":null},{"id":23081,"slug":"promised-land-review","title":"《應許之地》：當《出埃及記》遇上《辦公室》","date":"2026-08-21","author":"Amy Mantravadi","cats":["文化与艺术"],"tags":["影評","出埃及","劇集"],"sum":"作者評論YouTube上免費觀看的情景喜劇《應許之地》，以偽紀錄片形式講述以色列人曠野四十年，由曾參與《揀選》的團隊製作。原本調低期望，結果既好看又好笑：摩西面對發怨言百姓的無奈、與哥哥姐姐的關係、西坡拉的到來、可拉的野心、埃及士兵的局外人吐槽、過度熱心的約書亞都充滿喜感。角色雖有缺陷，卻在混亂中漸漸認識拯救他們的神。改編在忠於神學與創作自由之間取得平衡，偶有為笑點犧牲歷史準確之處，但不褻瀆經文；金牛犢後亞倫重獲接納的情節也很動人。","pts":["聖經題材喜劇很容易滑向褻瀆","《應許之地》意外地好看又好笑","偽紀錄片風格借鑑《辦公室》","角色有缺陷，也有閃光之處","主題：關鍵不在配不配，而在是否忠心","守住神學內涵，加入次要創作元素","亞倫重獲接納的一幕真實動人"],"mm":{"c":"《應許之地》影評","b":[["形式",["情景喜劇","偽紀錄片","YouTube免費"]],["角色",["摩西的無奈","米利暗","可拉","約書亞"]],["笑點",["曠野怨言","金牛犢","局外人吐槽"]],["改編平衡",["忠於神學","加入創作","不褻瀆"]],["感動",["兄弟和好","認識神"]]]},"fw":[["提問","聖經可以很風趣嗎？"],["介紹","劇集與創作團隊"],["內容","角色與笑點"],["評析","改編的分寸"],["結論","既好笑又動人"]],"q":["關鍵不在我們配不配，而在我們是否忠心。","好的改編守住神學，再讓人物活起來。","原來聖經故事也能讓人笑出聲。"],"fb":null},{"id":23077,"slug":"help-teens-friendship-social-media","title":"社交媒體時代的青少年交友指南","date":"2026-08-20","author":"Kathryn Eckhardt","cats":["信仰与工作"],"tags":["友誼","養育","青少年"],"sum":"青少年最常問「怎樣才算好朋友」，社交媒體讓友誼更複雜。作者提出三方面指引：一、認清好朋友的品質：網紅文化看重人氣與粉絲數，但敬虔的朋友可靠、有愛心、恩慈、忍耐、會傾聽並代禱；可引導孩子反思朋友線上線下是否一致。二、應對衝突與嫉妒：看到朋友和別人出遊的照片容易感到被冷落，要傾聽安慰，分辨正常的失望與有罪的嫉妒；偶爾沒被邀請要往好處想，長期被傷害則當面溝通或放下。三、遠離閒話：「倒茶」就是閒話，要教孩子辨認、退出話題、轉移焦點或說句善意的話。","pts":["社交媒體把人氣與點讚等同於被接納","敬虔朋友的品質在網上難獲點讚，卻能建立深厚友誼","反思朋友線上線下是否一致","39%青少年覺得社交媒體紛爭令人不堪重負","分辨傷心失望與嫉妒苦毒","長期被傷害時，學會當面溝通或放下","「倒茶」其實就是閒話","教孩子退出、轉移話題、說善意的話"],"mm":{"c":"社媒時代的青少年友誼","b":[["好朋友",["可靠有愛","恩慈忍耐","代禱"]],["網紅文化",["人氣至上","點讚=歸屬"]],["衝突嫉妒",["被冷落感","分辨情緒","當面溝通"]],["閒話",["倒茶","箴16:28","抵制技巧"]],["目標",["與智慧人同行","彼此建立"]]]},"fw":[["問題","怎樣才算好朋友？"],["背景","社交媒體的影響"],["指引一","認清好朋友的品質"],["指引二","面對衝突與嫉妒"],["指引三","遠離閒話"],["結語","與智慧人同行"]],"q":["真正的好朋友，往往不是點讚最多的那個。","失望是正常的，嫉妒卻需要悔改。","換個名字叫「倒茶」，閒話仍然是閒話。"],"fb":null},{"id":23075,"slug":"bible-address-work-more","title":"如果工作在神眼中如此重要，爲什麼聖經不多談工作？","date":"2026-08-20","author":"Andrew Smith","cats":["信仰与工作"],"tags":["職場","榮耀"],"sum":"有人問：若工作在神眼中如此重要，為何聖經多談教會事務，卻少有職場指示？作者認為，缺乏直接指令本身就是一種指令——婚姻、教養、身體照顧也是如此，聖經提供的是模式與榜樣。創世記1:28的治理託付貫穿舊約：神把亞伯拉罕、約瑟、比撒列、工匠們安放在特定崗位善用恩賜；傳道書與箴言教導工作的節奏、殷勤與交託。新約中保羅說無論做什麼都是為主做（西3:23），工作的目的是榮耀基督。耶穌以忍耐完成救贖大工，是我們工作的榜樣。聖經對成聖的普遍呼召同樣適用於職場。","pts":["聖經沒有職場操作手冊，這本身就是一種教導","創1:28的治理使命貫穿舊約","神把人安放在特定時空善用恩賜","傳道書與箴言教導工作的節奏與智慧","「無論做什麼」包括所有職業","工作離開神便是虛空，目的是榮耀基督","耶穌忍耐完成救贖，是我們工作的榜樣","成聖的品格自然使人成為更好的員工與雇主"],"mm":{"c":"聖經與工作","b":[["問題",["為何少談工作？","如何在勞作中活出信仰"]],["舊約模式",["治理託付","比撒列與工匠","葉忒羅的組織學"]],["智慧書",["凡事有定期","殷勤治事","交託工作"]],["新約",["西3:23","為主而做","安靜作工"]],["基督",["創始成終","忍耐完成","工作的榜樣"]]]},"fw":[["提問","聖經為何少談工作？"],["原則","缺乏指令本身就是指令"],["舊約","立足當下的工作"],["智慧書","工作的目的與節奏"],["新約","為基督作工"],["基督","榮耀歸於基督"],["應用","在工作中成聖"]],"q":["聖經沒有職場手冊，卻有一整本關於忠心的故事。","無論做什麼，都是為主做的。","我們的工作救不了人，卻能映照那位完成救贖之工的主。"],"fb":null},{"id":23073,"slug":"ai-tgc-missional-opportunity","title":"給 AI 劃下紅線：福音聯盟的 AI 宣教契機","date":"2026-08-20","author":"Brett McCracken","cats":["社会与时事"],"tags":["人性","生產力","人工智能","AI"],"sum":"福音聯盟資深編輯宣布TGC對AI寫作劃下紅線：作者不得用AI構思、超出事實核查的研究、組織架構、寫作或超出拼寫檢查的編輯。作者認為AI的產出只是模式識別，不配稱為寫作；寫作是出於愛的勞作，帶著掙扎、低效與人性痕跡，對基督徒更是一種敬拜。他們重視真人反饋的過程，鼓勵作者找真人編輯。TGC並非反對一切AI用途，如寫程式、整理表格、加強版搜尋都可，但反對把創造性智力工作外包。在AI內容氾濫的時代，真人寫作反而更有價值；聖書子民也必須保有讀寫能力。","pts":["AI產出是模式識別，不是寫作","寫作是愛的勞作，AI不能愛、不能痛苦、不能敬拜","TGC禁止AI用於構思、研究、架構、寫作、編輯","真人反饋雖有代價，卻是寫作的一部分","推出作者朗讀音頻、專欄專區等更有人味的形式","AI可用於非創造性的事務","道成肉身提醒我們，血肉的臨在本身就是信息","聖書子民必須守住閱讀能力"],"mm":{"c":"TGC的AI紅線","b":[["立場",["AI不是寫作","寫作是愛與敬拜"]],["政策",["不構思","不架構","不寫作","僅限拼寫檢查"]],["人的價值",["凌亂卻真實","真人反饋","同走天路"]],["新做法",["作者朗讀","專欄專區","多媒體"]],["可用之處",["寫程式","整理表格","搜尋整合"]],["宣教意義",["真人寫作更珍貴","道成肉身","聖書子民"]]]},"fw":[["宣言","AI產出不是寫作"],["政策","TGC投稿AI指南"],["理由","尊重讀者與作者"],["調整","更人性化的內容策略"],["界線"
