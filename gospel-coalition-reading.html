膩了，對明知重要的事感到厭倦，再用演算法推來的刺激掩蓋。沙漠教父的解藥是「堅守」：在熱度消退後仍守在議題、教會、婚姻與服事中。如保羅說「所信的道我已經守住了」。","pts":["熱點來得快，去得也快","觀點不等於立場，立場不等於行動","我們觀點最多，信念卻最薄弱","觀點能高速生產，信念卻不能","信念體現在行事曆與帳單上","許多人只有觀點，沒有信念","我們的病是靈性倦怠：不是累，是膩","演算法用新刺激掩蓋厭倦","解藥是堅守：熱度消退後仍然在場"],"mm":{"c":"熱點與信念","b":[["現象",["下一件事","熱度即逝","觀點泛濫"]],["觀點vs信念",["認知更新","走入生命","行事曆與帳單"]],["例證",["反墮胎觀點","羅伊案後"]],["病因",["acedia","正午的惡魔","FOBO"]],["解藥",["堅守","持續在場","來10:23"]],["榜樣",["雲彩般的見證人","保羅守住信仰"]]]},"fw":[["引子","寫不完的下一件事"],["分析","觀點的速度"],["區分","觀點與信念"],["診斷","靈性倦怠"],["解藥","操練持守"],["榜樣","保羅守住了"]],"q":["我們是觀點最多的一代，也可能是信念最薄的一代。","信念不只在你的動態裡，更在你的行事曆和帳單上。","我們不是精疲力竭，而是百無聊賴。"],"fb":null},{"id":22702,"slug":"motherhood-fatherhood-films","title":"三部近期電影中的母親（與父親）角色","date":"2026-06-16","author":"Brett McCracken","cats":["文化与艺术"],"tags":["捨己","養育","單親","單親媽媽"],"sum":"作者從今年奧斯卡談起：最佳女主角巴克利在《哈姆奈特》中飾演莎士比亞之妻阿格尼絲，她在得獎感言中讚美做母親「美好的混亂」。作者把這部片和《如果有腿，我會踢你》《奧馬哈之旅》放在一起看，三部都描寫一個人扛起育兒重擔，但處理方式不同。在缺席的另一半方面：《如果有腿》把常年在外的丈夫醜化，反映出「分工不均就是不公」的憤世觀；《哈姆奈特》接受角色不對等，共同的悲傷反使夫妻更親近；《奧馬哈》中母親因死亡缺席，一段錄音中的歌聲顯出父母互補的美好設計。在孩子的刻畫方面：《如果有腿》始終不露女兒的臉，使孩子幾乎成了反派；另兩部則讓孩子成為有血有肉的人。最後，詩篇127篇說兒女是耶和華所賜、如箭在手，要為未來射出；在生育率危機中，作者鼓勵人勇敢做父母，「為未來下注」。","pts":["三部電影都描寫一人扛起育兒重擔","把缺席的父親醜化，反映憤世的育兒觀","接受角色不對等，未必就是不公","共同的悲傷可以使夫妻更親近","父母缺席的空洞印證男女互補的設計","孩子不該被描繪成只會索取的負擔","孩子是有血有肉、與父母相連的人","父母承受一切，是為了孩子的天真與快樂","兒女是暫時託付的禮物，要為使命射出","生養孩子是在為未來下注"],"mm":{"c":"電影中的父母","b":[["三部電影",["哈姆奈特","如果有腿我會踢你","奧馬哈之旅"]],["另一半缺席",["被醜化的父親","彼此敬重","死亡帶走母親"]],["孩子的刻畫",["看不見的臉","血肉相連","以孩子為中心"]],["盼望",["朝向未來","哈姆雷特的誕生"]],["聖經視角",["詩篇127篇","箭在手中","暫時託付"]],["呼籲",["生育率危機","為未來下注"]]]},"fw":[["引子","奧斯卡上的母親"],["比較","三部電影"],["主題一","當父親或母親缺席"],["主題二","以孩子為中心"],["主題三","為未來下注"],["呼召","勇敢地做父母"]],"q":["孩子不是點綴生活的配飾，而是領受後再為使命交出的禮物。","缺席留下的空洞，反而印證了父母互補的美好設計。","嬰孩總是麻煩，卻也是你能做的最榮耀的事。"],"fb":null},{"id":22700,"slug":"young-men-work-ethic-ai","title":"年輕人，別讓 AI 偷走你勤奮工作的心","date":"2026-06-15","author":"Seth Troutt","cats":["信仰与工作"],"tags":["人工智能","AI","求職"],"sum":"神造人「修理看守」伊甸園，工作與人的身份密不可分；但AI革命讓大量工作岌岌可危。作者向年輕弟兄提出四個方向：一、對懶惰感到噁心——像《機器人總動員》中無所事事的人類，有人盼望全民基本收入好無止境地打遊戲、看色情，基督徒應厭惡這種無勞苦的生活，因為勞作就是愛。二、承受咒詛——地長荊棘、汗流滿面才得餬口，AI不會改變這一點，要調整期待，在不確定中不斷學習與轉型。三、培養真實生活中的信任——AI讓影音文字真假難辨，面對面的關係與聖靈果子成為稀缺的資產。四、順應市場——水電工、技師、治療師、醫護、牧師等需要親手與線下連結的工作較安全；AI也讓創業與接手嬰兒潮世代的中小企業變得更容易。最後，基督已擔當咒詛，使工作成為敬拜，要盡心像是給主做。","pts":["工作是人受造身份的核心","AI可能取代大量工作","該對無所事事的生活感到噁心","勞作就是愛","咒詛不會因AI而改變，要承擔而非推卸","在不確定中學習、轉向、重塑自己","真實生活中的信任將成為稀缺資產","需要親手與面對面的工作更持久","AI讓創業與接手企業更容易","基督的救贖讓工作成為敬拜"],"mm":{"c":"別讓AI偷走勤奮","b":[["背景",["修理看守","工作危機","大量職位風險"]],["厭惡懶惰",["機器人總動員","全民基本收入","勞作即是愛"]],["承受咒詛",["荊棘蒺藜","汗流滿面","不斷轉型"]],["真實的信任",["真假難辨","面對面","聖靈果子"]],["順應市場",["技術工人","治療與醫護","創業接班"]],["敬拜",["供養保護繁衍","基督擔當咒詛","像給主做"]]]},"fw":[["根基","人生來是勞動者"],["危機","AI衝擊就業"],["一","厭棄懶惰"],["二","承受咒詛"],["三","培養信任"],["四","順應市場"],["結論","盡心竭力做工"]],"q":["去勞作，就是去愛。","憑什麼你該比你的曾祖父們少出力？","耶穌的救贖之工，把我們的工作變成了敬拜。"],"fb":null},{"id":22698,"slug":"usually-people-become-writes-because-they-choose-to-become-writers","title":"我如何選擇了走上作家道路","date":"2026-06-15","author":"Mikey Lynch","cats":["信仰与工作","与资深基督徒作家对谈"],"tags":["出版","寫作","基督徒作家"],"sum":"澳洲福音聯盟編輯林奇接受訪談，談基督徒寫作。他十八九歲信主後就把寫作融入信仰生活，辦過小眾雜誌、寫了多年部落格，在朋友鼓勵下於2017年出版第一本書。他把寫作看作事工、愛好、呼召，也是副業。靈感多半來自想寫「自己希望早已存在的書」，填補事工與神學中的空白，也來自教導、閱讀、電影與交談。他直言：人成為作家，通常是因為選擇成為作家，要不斷投稿、承受無數退稿，壓下「我是冒牌貨」的懷疑。對編輯意見不必事事爭辯，但在乎的地方要堅持；請試讀者時要說清楚想要哪類意見並厚待他們。面對沒有回音的痛，要轉為感激。作者常受的試探是公開為自己辯護，以及嫉妒他人成功；要把情緒帶到主前，為人歡喜。朋友與事工領袖可以閱讀、推薦、轉發、放進書單來支持基督徒作者；想進步就多讀多寫，多聽真人的建議，不要事事問AI。","pts":["寫作可以同時是事工、愛好與副業","寫你希望早已存在的書","留意粗糙的教導，就能發現空白","人成為作家，通常是因為選擇成為作家","做好被拒絕無數次的準備","編輯的反饋是難得的禮物","說清楚想要哪類意見，厚待試讀者","不要公開與批評者爭辯","為別人的成功歡喜","事工領袖可以主動推介本地作者"],"mm":{"c":"選擇成為作家","b":[["起步",["信主後寫作","部落格","朋友鼓勵"]],["定位",["事工","愛好","副業"]],["靈感",["填補空白","教導與閱讀","好奇的朋友"]],["出版",["主動投稿","無數退稿","遵守要求"]],["反饋",["編輯是夥伴","試讀者","別每點都爭"]],["試探",["公開辯護","嫉妒","把情緒帶到主前"]],["支持",["朋友閱讀","領袖推介","多讀多寫"]]]},"fw":[["起點","如何認真對待寫作"],["定位","事工還是副業"],["靈感","點子從哪裡來"],["出版","投稿與退稿"],["反饋","與編輯和試讀者合作"],["試探","作者的屬靈爭戰"],["支持","朋友與領袖能做什麼"],["建議","打磨寫作"]],"q":["人成為作家，通常是因為他們選擇成為作家。","我寫的是那些我希望早已存在、希望自己能讀到的書。","既為別人的大成功歡喜，也為自己的小成就歡喜。"],"fb":null},{"id":22693,"slug":"xenophobia-migration-and-the-christian-response","title":"仇外、移民與基督徒的回應","date":"2026-06-13","author":"Newton Chilingulo","cats":["社会与时事"],"tags":["福利","移民","非法移民","仇外"],"sum":"南非的仇外問題再度引發熱議，輿論常落入兩種一刀切的敘事：南非人天生仇外，或外國人壓垮了經濟。作者在南非生活了21年，呼籲基督徒以真理、憐憫與智慧思考。首先，每個人都承載神的形像，任何針對外國人的暴力與羞辱都不可接受。聖經吩咐要善待寄居者，因以色列也曾在埃及寄居；但聖經也承認國家與法律的正當性，兩者必須並重。不能以偏概全地說所有南非人都仇外，許多南非人熱情接待移民。外國人不是經濟困境的主因，腐敗、結構不平等與治理失敗影響更大，但移民確實給公共服務帶來壓力。對於無證移民，基督徒應承認違法是違法，但也要正視家庭責任，教會應提供輔導、鼓勵合法化、給予實際幫助，政府也有責任改善失靈的制度。仇外的根源是罪人的心，立法無法改變人心，唯有福音拆毀隔斷的牆。","pts":["不要落入一刀切的敘事","每個人都承載神的形像","聖經吩咐善待寄居的","憐憫寄居者與尊重法律要並重","不能定一整個民族的罪","外國人不是經濟困境的主因","但移民確實給公共服務帶來壓力","無證移民需要牧養而非只有定罪","失靈的移民制度也在製造問題","仇外的根源是人心，唯有福音能醫治"],"mm":{"c":"仇外與移民","b":[["處境",["南非仇外","兩種極端敘事"]],["神的形像",["每個人有尊嚴","拒絕暴力"]],["聖經教導",["善待寄居","尊重法律","教會是萬民"]],["避免概括",["許多南非人好客","作者的親身經歷"]],["經濟",["腐敗與不平等","公共服務壓力","走投無路的移民"]],["無證移民",["承認違法","家庭責任","教會牧養","政府責任"]],["根本解方",["罪人的心","福音拆毀隔牆"]]]},"fw":[["現象","仇外再成焦點"],["原則","神的形像"],["聖經","寄居者與法律"],["事實","不可一概而論"],["經濟","工作被搶走了嗎"],["難題","非法移民"],["解方","福音的愛"]],"q":["化解仇外靠的不是立法，而是福音的愛。","既憐憫外族人，也尊重合法秩序；世界往往只取其一。","真相需要細細道來。"],"fb":null},{"id":22686,"slug":"missing-reformed-doctrine-spiritual-formation","title":"遭遺忘的改革宗教義","date":"2026-06-13","author":"Kyle Strobe","cats":["圣经与神学"],"tags":["靈修","靈命塑造","屬靈離棄"],"sum":"禱告碰壁、讀經乏味、靈裡如曠野——作者指出，「屬靈離棄」曾是新教靈修神學數百年的標準教導，如今幾乎被遺忘。它是神主動的作為：帶領祂的子民經歷祂的缺席，好喚醒他們看見自己的罪與破碎，藉此彰顯祂的大能、恩典與赦免之大。這一教義同時糾正兩種錯誤：跟著感受起伏生活，或完全無視感受。神在其中挖掉「我能修復自己屬靈生命」的假信念，如祂離開希西家來試驗他。布雷克與司布真都說，神按信徒的成長階段——嬰孩、青年、成人——施以不同的帶領；從前被溫柔包裹，如今神為你預備更多。牧養屬靈離棄的人時，清教徒布里奇把人指向基督，而非自己的長進：基督要「宣判我們能力的死刑」，叫我們唯獨安息在祂裡面。屬靈離棄不是離開十字架，而是更深擁抱十字架。","pts":["屬靈枯乾曾有一個名字：屬靈離棄","屬靈離棄是神主動的作為","神領人進入軟弱，為要彰顯祂的大能","既不跟著感受走，也不無視感受","神挖掉「我能自我修復」的假信念","神按屬靈成長階段施以不同帶領","艱難經歷不證明你被假應許欺騙","牧養時要把人指向基督，而非自己的長進","屬靈離棄是更深地擁抱十字架"],"mm":{"c":"屬靈離棄","b":[["經歷",["禱告碰壁","讀經乏味","靈裡曠野"]],["定義",["神主動的作為","經歷神的缺席","喚醒人看見罪"]],["目的",["彰顯大能","顯明恩典","更深倚靠"]],["階段成長",["布雷克","司布真","嬰孩青年成人"]],["牧養",["布里奇","指向基督","不灰心"]],["結論",["擁抱十字架","長進從神而來"]]]},"fw":[["問題","靈裡乾涸的季節"],["教義","屬靈離棄"],["曠野","神為何這樣帶領"],["成長","階段性的成熟"],["牧養","如何輔導離棄之人"],["提醒","重拾被遺忘的教導"]],"q":["我們不是離開十字架走向自己的良善，而是更深地擁抱十字架。","祂領你進入軟弱，為要向你彰顯祂的大能。","無論感到基督近在咫尺或遙不可及，神都在塑造我們。"],"fb":null},{"id":22683,"slug":"womens-ministry-accessible-single-moms","title":"姊妹事工是否把單親媽媽擋在了門外？","date":"2026-06-12","author":"Alyson Punzi","cats":["教会事工"],"tags":["姊妹事工","查經","喪偶","單親"],"sum":"作者是牧師遺孀，剛成為單親媽媽時，去教會是一週最難的事。統計顯示只有四分之一單親媽媽定期聚會，是基督徒父母中出席率最低的群體。許多教會願意關懷她們，卻不知道主日之外怎麼幫助她們參與。作者提出七個問題供姊妹事工反思：一、有明確邀請單親媽媽嗎？她們早已習慣格格不入。二、考慮過她們的上班時間嗎？週四早上九點的查經她們永遠來不了。三、能提供兒童看顧嗎？四、能把事工「送上門」嗎？例如在孩子睡後於她家查經、在她午休時約見。五、內容有顧及她們的處境嗎？如出庭、撫養權、遺屬撫卹。六、這活動值得她們花時間嗎？是否帶來門訓與友誼。七、有人用心與她們建立長期關係嗎？強健的事工要的是門徒而非參加者。大多數單親媽媽不上教會，這也是向社區發出邀請的大好機會。","pts":["單親媽媽是教會出席率最低的父母群體","教會願意關懷，卻不知從何著手","要明確邀請，她們習慣格格不入","活動時間要顧及上班族","盡可能提供兒童看顧","把事工帶到她們所在的地方","內容要顧及她們的處境","她們會衡量活動是否值得投入","要的不是參加者，而是門徒","讓教會成為單親媽媽容易踏入的地方"],"mm":{"c":"姊妹事工與單親媽媽","b":[["現況",["四分之一出席","主日艱難"]],["邀請與時間",["明確歡迎","避開上班時段"]],["實際支援",["兒童看顧","送上門的事工"]],["內容",["出庭與撫養權","喪偶離婚未婚"]],["價值",["值得花時間嗎","門訓與友誼"]],["關係",["長期陪伴","造就門徒"]],["外展",["走進社區","溫暖的教會"]]]},"fw":[["經歷","單親媽媽的主日"],["現況","出席率最低"],["七問","姊妹事工的自我檢視"],["外展","走出教會，進入社區"],["祝福","讓這條路輕省一些"]],"q":["強健的事工要的不是參加者，而是門徒。","看顧孩子這件事總得有人做，不是教會，就是媽媽自己扛。","願單親媽媽來教會的路，能走得輕省一些。"],"fb":null},{"id":22677,"slug":"reality-respecters","title":"教導孩子做一個尊重現實的人","date":"2026-06-11","author":"Betsy Childs Howard","cats":["基督徒生活"],"tags":["爲人父母","養育","堅韌","現實"],"sum":"「你想成為什麼人，就能成為什麼人」是好意，卻不是真話。主流文化的表現型個人主義教孩子跟著感覺走就能夢想成真，聖經卻說有一條路人以為正，至終成為死亡之路。作者借用「尊重現實的人」這一說法：不跟著稱讚皇帝的新衣，也不接受違背事實的謊言。以尊重現實的方式養育孩子，不是動輒甩出殘酷真相，而是幫助他們在創造、墮落、救贖、更新的大故事中理解人生：墮落帶來疾病、殘疾與管教的需要，救贖則帶來將來復活與萬物更新的盼望，這為困難對話提供了現成框架。尊重現實的人也培養堅韌：一位少女說「我不想成長，只想被理解」，反映當代孩子只求解脫與安慰；但痛苦本是人生的一部分，要教孩子從中成長。佩里、阿里、威爾遜等人都因基督教與現實吻合而歸信；給孩子一個與現實相符的故事，他們才不會有一天發現被騙了。","pts":["「想成為什麼就能成為什麼」並不真實","表現型個人主義是一條看似正確的死路","尊重現實的人拒絕稱讚皇帝的新衣","以神的眼光看世界，才能與現實聯結","不必動輒甩出殘酷真相","在創造、墮落、救贖、更新中理解人生","當代孩子只想被理解，不想成長","堅韌的人承擔責任、正視事實、堅持不懈","基督信仰是與現實相符的故事"],"mm":{"c":"尊重現實的孩子","b":[["謊言",["想成為什麼都可以","跟著感覺走","箴14:12"]],["尊重現實",["皇帝的新衣","以神眼光看世界"]],["救贖故事",["創造","墮落","救贖","更新"]],["堅韌",["只想被理解","從痛苦中成長","承擔責任"]],["歸信見證",["佩里","阿里","威爾遜"]],["結論",["與現實相符的故事"]]]},"fw":[["引子","一句善意的謊言"],["文化","表現型個人主義"],["概念","尊重現實的人"],["框架","活在救贖故事裡"],["品格","培養堅韌"],["護教","福音與現實吻合"]],"q":["我們並不是想成為什麼樣的人，就能成為什麼樣的人。","與其不惜代價保護孩子不受傷，不如教他們從痛苦中成長。","給孩子一個與現實相符的故事。"],"fb":null},{"id":22674,"slug":"follow-science-god","title":"讓科學帶著你找到神","date":"2026-06-10","author":"Brett McCracken","cats":["文化与艺术"],"tags":["科學","影評","護教"],"sum":"「跟著科學走」成了世俗信條，卻常只挑選支持自己立場的科學；真正的科學需要願意改變想法。作者以紀錄片《萬物的故事》為例，指出不帶偏見的科學是信仰的朋友。片中由邁耶解說，訪問倫諾克斯等學者：宇宙有開端，凡有開端的事物都需要原因；多元宇宙等理論只是用一種超自然迴避另一種，更簡潔的解釋是超越時空的智慧上帝。更震撼的證據在細胞裡：DNA與蛋白質中的資訊宛如代碼，而代碼指向寫代碼者。作者認為年輕一代已不覺得科學與信仰衝突，那只是達爾文到道金斯之間的歷史插曲。研究自然的科學引人歸向神；想以技術取代神設計的科學，如超人類主義、變性干預，則會被「木刺劃傷」。他盼年輕人效法伽利略、開普勒、帕斯卡、牛頓，以及在太空中稱地球為「綠洲」的太空人格洛弗。","pts":["「跟著科學走」常是選擇性的","只印證偏見的科學不是科學","不帶偏見的科學是信仰的朋友","宇宙有開端，就需要一個原因","多元宇宙理論是用超自然迴避超自然","細胞中的資訊指向一位設計者","年輕一代不再覺得科學與信仰衝突","探索自然的科學引人歸向神","試圖取代神設計的科學終會失敗","地球是浩瀚虛空中的一片綠洲"],"mm":{"c":"科學帶你找到神","b":[["跟著科學走",["選擇性","真正的科學願改變"]],["宇宙開端",["大爆炸","第一因","多元宇宙"]],["精密調校",["DNA代碼","細胞系統","智慧設計"]],["新世代",["衝突論過時","兩本書"]],["兩條路",["探索自然","取代上帝","木刺劃傷"]],["榜樣",["伽利略與牛頓","格洛弗","地球綠洲"]]]},"fw":[["問題","被挑選的科學"],["影片","萬物的故事"],["論證一","宇宙的開端"],["論證二","精密調校"],["趨勢","新世代的眼光"],["分辨","兩種科學"],["盼望","榮耀神的科學家"]],"q":["只會印證偏見的科學，根本就不是科學。","如果自然界中存在代碼，那麼是誰寫下了代碼？","逆著上帝設計的紋路而行，必然會被木刺劃傷。"],"fb":null},{"id":22668,"slug":"2026-essay-contest-young-adults","title":"福音聯盟 2026 年青年散文大賽","date":"2026-06-10","author":"TGC","cats":["社会与时事"],"tags":["徵文","2026"],"sum":"福音聯盟舉辦2026年青年散文大賽，邀請16至25歲（2001至2010年出生）的青年基督徒投稿，投稿期為6月1日至7月1日，9月1日公佈結果。作品須為原創且未發表，結合親身經歷與信念，並以經文支持結論。三個選題：一、信仰如何幫助我戒除不良習慣，如賭博、色情或沉迷社群媒體，分享聖靈、經文、教會肢體或歷史聖徒如何幫助你治死罪；二、當我真正把一間教會當作自己的教會，例如成為會員、參與服事或在危機中被扶持的時刻；三、在人工智能時代如何保持人性，透過閱讀、創作或關懷他人，以唯獨神形像承載者能有的方式榮耀神。一等獎500美元，二等獎100美元書店購書卡，三等獎一套精選書籍，獲獎作品將在網站發表。","pts":["對象是16至25歲的青年","投稿期6月1日至7月1日","作品須原創未發表","要結合親身經歷與經文","選題一：戒除不良習慣","選題二：真正委身教會","選題三：在AI時代保持人性","一等獎500美元","獲獎作品將在網站發表"],"mm":{"c":"2026青年散文大賽","b":[["資格",["16–25歲","原創未發表"]],["時程",["6/1–7/1投稿","9/1公佈"]],["選題",["戒除壞習慣","委身教會","AI時代的人性"]],["要求",["親身經歷","經文支持","授權發表"]],["獎項",["500美元","購書卡","精選書籍"]]]},"fw":[["邀請","青年基督徒寫作"],["要求","徵文規則"],["選題","三個主題"],["獎項","獎金與發表"],["參賽","提交方式"]],"q":["我們想聽你分享基督信仰如何幫助你治死罪。","委身教會不只是週日出席而已。","以唯獨照神形像被造之人能有的方式榮耀神。"],"fb":null},{"id":22659,"slug":"algorithm-self-ai","title":"算法之外：在 AI 時代尋找真實自我","date":"2026-06-09","author":"Michael Keller","cats":["信仰与工作","凯勒文化护教中心"],"tags":["社交媒體","身份","人工智能","AI","凱勒文化護教中心","認同"],"sum":"精神科醫師發現大量「ChatGPT精神病」案例，研究也顯示AI的三大用途已轉向療癒陪伴、生活管理與尋找意義——AI正參與塑造人的身份。凱勒指出，AI沒有創造新問題，而是加劇現代身份的三個毛病。一、脆弱：現代身份靠自己打拼，卻仍需要他人認可；AI創造了量身定做、永不休息的觀眾與多巴胺迴圈，研究發現AI伴侶使用者孤獨感與自殺念頭反而上升。二、不一致：「向內看」只找到互相矛盾的慾望；推薦演算法在不知不覺中塑造偏好，生成式AI替不同平台打造優化版的自己，造成身份混淆。三、隱藏的道德框架：以盎格魯撒克遜戰士與曼哈頓青年為例，我們其實透過文化濾鏡決定哪些感受是「真我」；AI把WEIRD價值包裝成中立的數據，洗白了偏見。福音回應這三者：身份是領受而非賺取的（羅8:1）；我們在基督裡有統一的核心；福音公開其價值觀，是啟示的真理。真正的自我是從上頭賜下、在基督裡的自我。","pts":["AI已從工具變成塑造身份的一部分","AI加劇而非創造了現代身份危機","靠表現打拼的身份是脆弱的","AI成為永不休息、量身定做的觀眾","AI伴侶使用者反而更孤獨","向內看只找到互相矛盾的慾望","演算法悄悄塑造我們的偏好","我們透過文化濾鏡決定什麼是「真我」","AI把特定價值觀包裝成中立真理","身份是領受的，不是賺取的"],"mm":{"c":"算法之外的真實自我","b":[["現象",["ChatGPT精神病","AI療癒陪伴","塑造身份"]],["脆弱的自我",["需要認可","量身定做的觀眾","孤獨上升"]],["不一致的自我",["矛盾的慾望","推薦演算法","優化人設"]],["隱藏的框架",["戰士與曼哈頓青年","WEIRD價值","算法權威"]],["福音回應",["領受的身份","在基督裡","啟示的真理"]],["應許",["約壹3:1","神的兒女"]]]},"fw":[["現象","AI引發的心理危機"],["論點","AI加劇身份問題"],["問題一","脆弱的自我"],["問題二","不一致的自我"],["問題三","隱藏的道德框架"],["回應","算法時代的福音"]],"q":["算法無法奪走你沒有賺取的東西。","真實與優化，無法同時成立。","我們需要的不是說我們想聽的話的聊天機器人，而是對我們講真理的主。"],"fb":null},{"id":22650,"slug":"divorced-couple-remarry","title":"離婚後可以復婚嗎？","date":"2026-06-08","author":"Jim Newheiser","cats":["教会事工"],"tags":["悔改","離婚","復婚"],"sum":"作者的朋友約翰與莉歐娜結婚九年後離婚，一年後蒙主拯救而復婚，至今已滿五十年。聖經不只談因奸淫或離棄而得以再婚，也談離婚夫妻的複合：保羅吩咐離開的妻子「不可再嫁，或是仍同丈夫和好」。牧者先要確認原則問題：若前配偶已與他人結婚，按申命記24章不可再回到前任；雙方是否都在聖靈中行事？此外要坦誠面對離婚期間的關係、債務、成癮等問題。實際考量有八點：一、釐清婚姻狀態，有罪的離婚仍是真實的離婚，復婚前不享婚姻權利；二、接受婚前輔導；三、省察動機，是否為討神喜悅、見證福音；四、徹底坦誠；五、按聖經處理過去的罪與衝突，已饒恕的罪不能再作離婚理由；六、處理導致離婚的舊模式；七、建立新習慣，一起讀經禱告；八、重新委身婚約。當真實悔改發生時，神能施行非凡的恩典。","pts":["聖經鼓勵離婚夫妻和好","若前配偶已再婚，便不可回到前任","雙方都應在聖靈中行事","有罪的離婚仍是真實的離婚","復婚前不能享有婚姻的權利","必須坦誠交代離婚期間的事","舊有的罪要承認、面對、饒恕","拔除雜草之外，還要栽種新習慣","重新立約，持守到死","真實悔改帶來非凡恩典"],"mm":{"c":"離婚後復婚","b":[["聖經根據",["林前7:10–11","太19:9"]],["原則問題",["前配偶已再婚？","雙方屬靈光景","坦誠披露"]],["釐清與預備",["婚姻狀態","婚前輔導","省察動機"]],["和好",["徹底坦誠","承認與饒恕","處理舊模式"]],["新婚約",["新習慣","一起讀經禱告","持守誓言"]],["見證",["約翰與莉歐娜","五十年"]]]},"fw":[["案例","三個結婚紀念日"],["聖經","複合的可能"],["根據","是否允許再婚"],["實務","八項考量"],["盼望","神使萬物更新"]],"q":["現在不拔掉的雜草，將來很可能佔滿整個婚姻的花園。","即使一段婚姻始於罪中，神仍然可以賜福。","當真實的悔改發生，我們會看見非凡的恩典。"],"fb":null},{"id":22648,"slug":"pastor-those-who-didnt-vote-you","title":"牧養那些沒有投票給你的羊","date":"2026-06-06","author":"Victor S","cats":["教会事工"],"tags":["教會","會眾","長老","投票"],"sum":"一位新當選、未獲全票的長老問：要怎麼牧養沒投票給我的人？作者先澄清權柄來源：長老不是被選出的政治家，而是被「認出來」的僕人；是聖靈立他作全群的監督，會眾投票只是印證。因此他要為全群交帳，不能「放生」沒投票的人。實際上：一、主動走近，傾聽顧慮，有錯就道歉，而非說服或質問；二、公平施教與管教，不因一張選票而有兩套標準；三、以長期、一致、溫柔的行為贏得信任；四、善用眾長老的智慧，讓有隔閡的成員先由較熟悉的長老牧養。關於投票方式，最好只讓長老知道大約比例而不知名單，以免迴避、討好或心懷怨氣；不記名投票讓反對能誠實表達，但事前要有公示期。未投票的成員也應承認長老的合法性，不結黨、不在兒女面前貶低他。這些人往往正是神讓長老學習為仇敵禱告的機會。","pts":["長老的權柄來自聖靈，不是選票","投票是對聖靈設立的印證","長老要為全群交帳","主動走近，傾聽而非說服","公平施教與管教","以長期一致的行為贏得信任","眾長老的設計讓每隻羊都能被牧養","不記名投票讓反對能誠實表達","未投票的成員也要尊重長老職分"],"mm":{"c":"牧養沒投票給你的羊","b":[["權柄來源",["聖靈設立","投票是印證","徒20:28"]],["交帳",["來13:17","不可放生"]],["實際牧養",["主動走近","公平對待","長期贏得信任"]],["眾長老",["不同牧者","放手不是失敗"]],["投票方式",["不需知道名單","不記名投票","公示期"]],["成員責任",["不結黨","尊重職分","給長老機會"]]]},"fw":[["問題","未獲全票的長老"],["根基","權柄從神而來"],["實踐","四種牧養方式"],["制度","投票方式的建議"],["會眾","未投票者的責任"],["總結","牧養全群"]],"q":["長老不是被選出來的政治家，而是被認出來的僕人。","誠實表達出來的反對，遠比掩藏的反對更容易被牧養。","當初沒投票給你的人，日後可能成為你最忠心的代禱夥伴。"],"fb":null},{"id":22646,"slug":"eternal-salvation-continue-to-sin","title":"救恩永蒙保守，是繼續犯罪的「保險單」嗎？","date":"2026-06-06","author":"Victor S","cats":["圣经与神学"],"tags":["救恩","失落","保障"],"sum":"一位新信徒問：既然救恩永蒙保守，犯罪、被管教甚至「落在魔鬼的刑罰裡」也不會失去救恩，那警告還有什麼意義？作者先肯定救恩永蒙保守是聖經教導（約6、約10），根基在基督已成的工作與神的信實。提前3:6的「魔鬼的刑罰」可能指兩種情況：長期驕傲不悔改，顯明從未重生而永遠沉淪；或真信徒今生遭神嚴厲管教。但把保守當作放縱許可證，本身就顯出不明白福音：羅馬書6章說斷乎不可仍在罪中，被保守的人會有新心。這種想法也割裂了神的主權與人的責任——神命定結局，也命定途徑，包括聖靈使人堅忍與成聖。悔改不是決志那一刻的事，而是一生的轉向；就像豬在泥坑裡享受，羊卻厭惡污穢想爬出來。救恩永蒙保守不是犯罪的保險單，而是好牧人伸出的可靠雙手。","pts":["救恩永蒙保守是聖經的教導","保守的根基在神，不在我們","「魔鬼的刑罰」可能指沉淪或嚴厲管教","警告是為了光照自己，不是審判別人","把保守當放縱，顯出不明白福音","被保守的人會顯出新心","神命定結局，也命定途徑","悔改是一生之久的轉向","真信徒會跌倒，卻不會對罪無所謂"],"mm":{"c":"救恩保守不是保險單","b":[["困惑",["提前3:6","犯罪無所謂？"]],["確據",["約6:37–39","約10:27–29","神的信實"]],["魔鬼的刑罰",["永遠沉淪","今生管教"]],["不是放縱",["羅6:1–2","新心"]],["主權與責任",["命定途徑","堅忍到底","腓2:12–13"]],["悔改",["一生轉向","豬與羊的比喻"]]]},"fw":[["問題","嚴厲警告有何意義？"],["確據","神必保守祂的羊"],["解經","魔鬼的刑罰"],["糾正一","不是放縱許可證"],["糾正二","主權與責任同行"],["糾正三","真信徒會悔改"],["結論","好牧人的雙手"]],"q":["被保守的人，會顯出被保守的證據。","神的預定不是讓人躺在恩典上睡覺，而是使人甦醒。","真信徒的標誌不是完美無罪，而是跌倒後仍回到基督面前。"],"fb":null},{"id":22644,"slug":"stay-human-ai-world","title":"AI 時代，活出人樣來","date":"2026-06-05","author":"Pete Nicholas","cats":["基督徒生活"],"tags":["社交媒體","人工智能","AI","品德","具身性"],"sum":"面對AI，市面上多是教人提升效率的技術指南，作者則主張品格塑造比規則更重要：規則像練音階，美德才是演奏音樂，能靈活應用於千變萬化的處境。他提出四種美德：一、團契——人按三一神形像受造，為關係而活；罪使人「向內捲曲」，AI演算法則像數位海洛因般助長個人主義，所以要投入跨世代、跨立場的群體（最好是地方教會），並參與不求回報的服事。二、在場——AI熱潮帶有新諾斯底傾向，貶低身體；基督教看重身體，要盡量親身參與並專注當下。三、忍耐——效率不是聖靈果子，導航削弱認路能力，AI寫作業削弱學習；神帶領人成長從不急於求成，連耶穌也漸漸長大。不用AI作弊，也不在關鍵成長領域使用它。四、忠信——娛訊與深偽使真假難辨，「各有各的真相」的實用主義很危險；要培養分辨力、閱讀長文、以「鋼鐵人」方式理解對方論點。","pts":["品格塑造比規則更重要","規則像音階，美德像演奏","人為關係而受造，罪使人向內捲曲","AI演算法加劇個人主義","投入跨世代、跨立場的群體","AI熱潮帶有新諾斯底傾向","基督教看重身體，要親身在場","效率不是聖靈的果子","在關鍵成長領域不要用AI走捷徑","以鋼鐵人而非稻草人對待不同觀點"],"mm":{"c":"AI時代活出人樣","b":[["方法",["美德勝過規則","音階與演奏"]],["團契",["向內捲曲","數位海洛因","地方教會","服事他人"]],["在場",["新諾斯底","具身性","全神貫注"]],["忍耐",["效率非果子","導航的代價","耶穌漸漸長大"]],["忠信",["娛訊","深偽","鋼鐵人策略","讀長文"]]]},"fw":[["前提","美德比規則更有用"],["一","團契：群體與個人"],["二","在場：身體與虛擬"],["三","忍耐：成長與效率"],["四","忠信：真相與煽情"]],"q":["效率並不是聖靈的果子。","有時最快的那條路，恰恰繞開了成長。","一句真話的分量，抵得上整個世界。"],"fb":null},{"id":22642,"slug":"how-not-fast","title":"禁食操練避坑指南","date":"2026-06-05","author":"Cassie Achermann","cats":["基督徒生活"],"tags":["屬靈操練","禁食"],"sum":"就像化學老師先警告不要讓硝酸銀碰到皮膚，聖經談禁食時，「不要這樣禁食」的篇幅也比正面教導更多。作者提出三不要：一、不要迴避——今日福音派很少禁食，但耶穌預期門徒會禁食，早期教會也常禁食，迴避就錯過恩典；二、不要自誇——像法利賽人般讓人知道自己在禁食，所得的賞賜只有人的稱讚；三、不要濫用——以為禁食能賺取結果或迫使神改變心意，如以賽亞書58章所斥責；大衛為孩子禁食七天，孩子死後他起來敬拜，接受了神的旨意。正面做法有二：一、帶著禱告之心，禁食是「信心的飢餓侍女」，幫助我們感受自己的軟弱與需要，謙卑的心能避開求人稱讚和操控神；作者每週禁食兩餐，用吃飯的時間禱告。二、帶著明確目標，為具體的罪、關係、美德或教會需要禱告，並記錄下來。從一頓飯開始，去試一試。","pts":["聖經的禁食教導多是警告","不要迴避：禁食是神賜的恩典管道","不要自誇：別把禁食當成面子","不要濫用：禁食不能操控神","大衛接受了神的旨意","禁食必須伴隨禱告","禁食讓我們感受自己的軟弱與需要","帶著具體主題禱告，並寫下來","從一頓飯開始試試"],"mm":{"c":"禁食避坑指南","b":[["三不要",["不迴避","不自誇","不濫用"]],["經文",["太6:16–18","賽58","撒下12"]],["帶著禱告",["信心的飢餓侍女","謙卑的心","每週兩餐"]],["明確目標",["掙扎的罪","人際關係","教會需要","記錄筆記"]],["開始",["從一頓飯開始","邀朋友一起"]]]},"fw":[["引子","先講警告"],["錯誤一","迴避禁食"],["錯誤二","自誇"],["錯誤三","濫用"],["做法一","帶著禱告之心"],["做法二","帶著明確目標"],["行動","去試一試"]],"q":["不要因為少吃一頓飯，反而讓撒但把你吞吃了。","禁食是信心的飢餓侍女。","讓這份飢餓提醒你，你對神的渴望。"],"fb":null},{"id":22634,"slug":"sasse-life-death-politics","title":"當生命進入倒計時","date":"2026-06-04","author":"Alex Harris","cats":["信仰与工作","凯勒文化护教中心"],"tags":["政治","見證","社交媒體","人工智能","AI","凱勒文化護教中心"],"sum":"前參議員薩斯被確診第四期胰腺癌，卻選擇在公眾面前走過死蔭幽谷，接受訪問、開設播客《還沒死》。他以「愛惜光陰」為原則：思考罪與死亡的永恆問題，也珍惜擁抱妻子、陪伴孩子的時刻；他坦言死亡可怕，但它是「最後的仇敵」，他相信復活與萬物更新。作者整理他對政治的四點觀察：一、為政治喝彩一兩聲就好——不冷漠，也不把權力當成核心世界觀，因為我們是客旅與基督的使者；二、網路世界不代表現實——極少數最憤怒的人產生了大部分內容，大多數人並沒有那麼憤怒；三、守護摯愛——最重要的是養育孩子、一起吃飯、敬拜和工作的地方，作者以代表鄰居出席酒吧執照聽證為例；我們會變得像我們的同伴，包括所看的媒體。四、政治只是症狀——真正的變革是數位與AI技術革命，教會要學習在其中不被扭曲靈魂，成為山上的城。","pts":["薩斯公開見證面對死亡的盼望","愛惜光陰是以造福鄰舍來感恩","死亡可怕，但它是最後的仇敵","為政治喝彩一兩聲就好","愛鄰舍的一個方式是透過政治","網路上最吵的聲音不代表多數","大多數人並沒有那麼憤怒","權力不是最重要的，愛才是","我們會變得像我們的同伴，包括媒體","政治是技術革命下游的症狀"],"mm":{"c":"當生命進入倒計時","b":[["薩斯",["胰腺癌","還沒死","公開見證"]],["愛惜光陰",["永恆問題","家人朋友","活著就是基督"]],["政治一",["一兩聲喝彩","客旅與使者"]],["政治二",["網路扭曲","少數憤怒者"]],["政治三",["守護摯愛","基層小團體","同伴的影響"]],["政治四",["技術革命","山上的城"]]]},"fw":[["背景","一位參議員的絕症"],["原則","愛惜光陰"],["見證","面對死亡的盼望"],["觀察一","政治重要但非一切"],["觀察二","網路不等於現實"],["觀察三","守護摯愛"],["觀察四","政治只是症狀"]],"q":["為政治喝彩一兩聲就好，不要一聲不吭，也別三聲喝彩。","權力不是最重要的，我們的愛才是。","死亡是仇敵，但它是最後的仇敵。"],"fb":null},{"id":22631,"slug":"lordly-supper-antidote","title":"赴一場「王的盛宴」","date":"2026-06-03","author":"Bruce Henning","cats":["圣经与神学","卡森神学更新中心"],"tags":["主餐","聖餐","卡森中心","詮釋"],"sum":"作者全家在衛城腳下慶祝父母結婚五十週年，沒有人會拒絕這樣的邀請，教會卻常忽視那終極的筵席，甚至因分裂而攪亂它。哥林多教會定期聚餐，但保羅在林前11:20用了一個罕見的形容詞「主的」（kyriakon），諸多詞典顯示它帶有「帝王級」的意味，可譯為「上主的晚餐」，既表達宏大尊貴，也保留與「主」字的關聯。這提出兩方面的糾正：一、警惕冷漠——保羅雖嚴厲批評，卻沒有叫他們放棄聖餐，而是把它描繪成不可忽視的王室盛宴；二、抵制精英主義——哥林多人把聖餐辦成羅馬式宴會，各自先吃、爭奪地位、排斥他人，反而把聖餐貶為俗世飯局，「吃喝自己的罪」。他們把它當帝王盛宴，卻忘了誰才是王：保羅在這段連續七次稱耶穌為主，聖餐宣告的是主的死。凡利用聖餐抬高自己，就錯過了「上主的晚餐」。","pts":["教會常忽視那終極的筵席","林前11:20的「主的」是罕見的形容詞","它帶有「帝王級盛宴」的意味","保羅沒有叫他們放棄聖餐","冷漠地看待聖餐是愚昧的","哥林多人把聖餐辦成爭地位的宴會","分門結黨使聖餐淪為俗世飯局","聖餐宣告的是被釘十字架的主","不能藉聖餐高舉自己"],"mm":{"c":"上主的晚餐","b":[["引子",["衛城晚宴","教會的分裂"]],["字義",["kyriakon","帝王級","上主的"]],["警惕冷漠",["王室盛宴","不可有可無"]],["抵制精英主義",["各自先吃","羅馬式宴會","吃喝自己的罪"]],["真正的王",["七次稱主","主的死","唯獨以主誇口"]]]},"fw":[["引子","一場不容錯過的晚宴"],["經文","林前11:20"],["字義","帝王級的晚餐"],["糾正一","警惕冷漠"],["糾正二","反對精英主義"],["歸結","榮耀歸給主"]],"q":["他們把聖餐當帝王級盛宴，卻忘了誰才是真正的王。","不明白這頓晚餐的意義，聚在一起反而招損。","聖餐所宣告的，是那位受死的主。"],"fb":null},{"id":22627,"slug":"is-education-now-useless","title":"AI時代來臨，教育無用了嗎？","date":"2026-06-02","author":"Jon Cleland","cats":["社会与时事"],"tags":["教育","塑造","古典","靈性"],"sum":"我們常問「你長大想做什麼」，把教育當成找工作的手段；AI威脅知識工作者後，人們更懷疑高等教育是否值得，甚至讓AI代寫論文。作者認為這誤解了教育：教育的實質不是教人做什麼，而是塑造人成為什麼樣的人。在哲學史上，求知與追求智慧和美德緊密相連，而終極的真理在基督裡彰顯。如今神學從「科學的女王」淪為大學的尷尬，古典學、哲學、歷史也被邊緣化；硬科學能讓人活得更久，卻因其唯物主義方法論而對靈魂無話可說。基督徒相信人有身體也有靈魂，教育應思考如何塑造或扭曲靈魂。面對機器取代人的趨勢，我們要更有人性而非更像機器：閱讀經典、歷史、哲學、文學，最重要的是思考神。教育應該把人當人，而不是當機器。","pts":["教育被窄化為找工作的手段","AI讓人懷疑高等教育的價值","教育是塑造人成為怎樣的人","求知與智慧、美德緊密相連","終極真理在基督裡彰顯","神學與人文學科被邊緣化","硬科學對人的靈魂無話可說","人有身體也有靈魂","AI時代要更有人性，而非更像機器"],"mm":{"c":"AI時代的教育","b":[["誤解",["為了工作","AI代寫論文"]],["實質",["塑造人","智慧與美德","基督是真理"]],["現況",["神學失位","人文邊緣化","硬科學當道"]],["唯物主義",["只有物質","對靈魂無話"]],["回應",["經典與哲學","思考神","把人當人"]]]},"fw":[["問題","教育還有用嗎？"],["誤解","教育只為就業"],["本質","教育是塑造"],["診斷","唯物主義的大學"],["回應","更有人性的教育"]],"q":["教育與其說是教我們做什麼，不如說是教我們成為什麼樣的人。","硬科學能讓我們活得更久，卻對靈魂無話可說。","教育應該把人當作人，而不是當作機器。"],"fb":null},{"id":22608,"slug":"two-forces-shape-church","title":"兩股隱形力量，塑造教會「性格」","date":"2026-05-31","author":"Hunter Beaumont","cats":["教会事工"],"tags":["教會文化","福音派","性格"],"sum":"「選教會」聽起來像挑床墊，但人們常好奇：神學相近的教會為何「性格」差這麼多？作者指出兩股力量從五旬節起就在塑造每間教會：守護與融入（處境化）。福音傳到外邦後，教會必須回答：什麼是不可改變的核心？什麼可以按文化調整？耶路撒冷會議拒絕把割禮強加給外邦人，卻嚴禁偶像崇拜與淫亂，使福音掙脫文化束縛。保羅「向什麼人就作什麼人」示範融入，猶大書則呼籲為一次交付的真道竭力爭辯。只融入不守護的教會親切卻會妥協到面目全非；只守護不融入的教會把文化高牆全丟給慕道者。作者列出一連串檢視問題，並以丹佛植堂為例：許多「福音派難民」不滿福音派亞文化，他雖可丟棄可有可無的周邊文化，卻警惕利用反福音派情緒招人，否則會建立核心軟弱、充滿怒氣的教會。他們選擇神學上持守福音派立場，文化上不複製其亞文化，並重新從聖經與教會歷史中提煉表達方式。","pts":["神學相近的教會也可能性格迥異","守護與融入塑造每間教會","耶路撒冷會議分辨核心與可調整之處","強加非必要條件，福音就變質","保羅示範融入，卻不妥協福音","只融入不守護會失去真耶穌","只守護不融入會帶不出門徒","不要利用反福音派情緒來招人","挑別人眼中刺的人，很難聽進恩典","神學上堅守，文化上不盲目複製"],"mm":{"c":"塑造教會性格的兩股力量","b":[["問題",["選教會","性格差異"]],["歷史",["安提阿","割禮之爭","耶路撒冷會議"]],["守護",["一次交付的真道","猶大書"]],["融入",["林前9章","因地制宜"]],["兩種極端",["過度處境化","極度保守化"]],["丹佛案例",["福音派難民","不利用怒氣","重新表述福音"]]]},"fw":[["引子","為什麼教會性格不同"],["歷史","第一場基督徒爭論"],["原則","守護與融入"],["極端","兩種偏差"],["檢視","實際的提問清單"],["案例","丹佛的植堂經驗"],["邀請","掀開引擎蓋看看"]],"q":["什麼是我們絕不能改變的核心？","專盯別人盲點的人，往往看不見自己的盲點。","在各自獨特的處境中，活出那永恆不變的信仰。"],"fb":null},{"id":22606,"slug":"celebrates-desecration-reenchantment","title":"褻瀆的狂歡：復魅爲何無力迴天","date":"2026-05-31","author":"Carl Trueman","cats":["文化与艺术"],"tags":["超人類主義","祛魅","復魅","分別爲聖"],"sum":"韋伯所說的「祛魅」描述了現代人覺得萬物與自己都失去深遠意義的感受，於是有人呼籲「復魅」。楚曼認為這個框架不夠：我們的世界不只是祛魅，而是積極且狂喜地摧毀神聖。墮胎話語從「安全、合法、罕見」變成自豪宣揚；性革命不只寬容放縱，更妖魔化貞潔與一夫一妻；貝爾法斯特市政廳的彩繪玻璃借宗教形式嘲弄基督教道德；超人類主義不惜代價要超越身體與死亡。其神學根源在馬克思與尼采：「弒神」令人亢奮，而要讓上帝真正死去，就得摧毀人身上神的形像。於是身體成為褻瀆的焦點——胎兒、性、跨性別意識形態、死亡與遺體處理皆然；這並沒有解放人，反而使人更不像人，且是在狂歡中自我毀滅。既然問題是褻瀆，答案就不是模糊的復魅，而是「分別為聖」——這是教會的使命：講道是神超自然的宣告，敬拜、聖餐與團契使人重新認識自己是神的形像，並以恩慈與款待流向世界。","pts":["祛魅讓人在自己眼中變得渺小","「復魅」這個答案軟弱而模糊","今日世界不只祛魅，而是狂喜地褻瀆","墮胎話語從無奈變成自豪","超人類主義不惜代價超越人的限制","弒神的亢奮必然攻擊神的形像","身體成為褻瀆的焦點","褻瀆沒有解放人，只使人更不像人","答案是分別為聖，這是教會的使命","每個信徒都能以敬拜與款待見證神的形像"],"mm":{"c":"褻瀆的狂歡","b":[["祛魅",["韋伯","齒輪","渺小的人"]],["褻瀆的例子",["墮胎自豪","性革命","彩繪玻璃","超人類主義"]],["神學根源",["馬克思","尼采","攻擊神的形像"]],["身體",["胎兒","性","跨性別","死亡與遺體"]],["答案",["不是復魅","分別為聖"]],["教會",["講道","敬拜與聖餐","款待鄰舍"]]]},"fw":[["診斷","祛魅的世界"],["不足","復魅的呼聲"],["現象","摧毀神聖"],["根源","弒神的亢奮"],["焦點","褻瀆身體"],["使命","教會的分別為聖"]],"q":["我們的世界不只是祛魅，而是在狂歡中褻瀆。","問題既是褻瀆，答案就是分別為聖。","褻瀆是沉重的枷鎖，分別為聖則是主輕省的軛。"],"fb":null},{"id":22601,"slug":"read-more-poetry","title":"爲什麼基督徒該讀點詩？","date":"2026-05-30","author":"Stephen Witmer","cats":["文化与艺术"],"tags":["詩歌","推薦","經典","AI"],"sum":"我們活在匆忙、撕裂、虛擬化又被AI接管的時代，文字淪為用完即丟的紙巾，注意力不斷退化。作者建議以讀好詩來抵抗這種文化、重塑靈魂。他原本也與詩保持距離，後來因找到能共鳴的詩人（柯林斯、希尼、吉特），以及讀到17世紀鄉村牧師喬治·赫伯特而改變。赫伯特把詩當作牧養策略：〈復活節的翅膀〉的排版本身就是翅膀，行越縮越短，讓人看見墮落使人「赤貧」，再隨基督上升；〈拒絕〉用凌亂的節奏表現神似乎沉默時破碎的心，最後一節恢復整齊韻律，讓身體嚐到恩典；〈渴慕〉停在「死去」一詞，如詩篇88篇般不給答案；〈罪〉列出神設下的層層籬笆，最後兩行卻被私慾輕輕吹散。詩能同時觸動理性、情感與身體，格律讓真理刻進記憶。讀詩是工作，需要專注與慢下來；歌詞雖有影響力，但純文字的詩在主流文化中仍屬反文化。不妨約幾個朋友，取下一本詩集開始誦讀。","pts":["文字在這時代淪為一次性工具","我們使用文字的方式也在塑造人格","讀好詩是一場反文化的抵抗","找到能共鳴的詩人是入門關鍵","赫伯特把詩歌當作牧養策略","詩的形式本身就承載意義","格律與聲音讓身體參與領受真理","詩讓人親歷真理，而不只是聽說","讀詩需要專注、慢讀與努力","約朋友一起誦讀詩集"],"mm":{"c":"基督徒為何該讀詩","b":[["時代病",["匆忙","撕裂","虛擬","AI文字"]],["轉折",["柯林斯","希尼","吉特","赫伯特"]],["形式",["復活節的翅膀","視覺排版"]],["具身",["聲律","格律","拒絕"]],["牧養",["渴慕","詩篇88","罪的伏擊"]],["實踐",["慢讀","挖掘","約朋友誦讀"]]]},"fw":[["診斷","匆忙浮躁的時代"],["提議","以詩歌抵抗"],["經歷","作者與詩的和好"],["範例","喬治牧師的策略"],["具身","詩觸動身體"],["牧養","用詩讓真理入骨"],["行動","開始誦讀"]],"q":["美，應當與優美的詞句如影隨形。","身體能感受到的，心裡印象更深。","讀詩不是為了得到什麼，而是讓整個身心被重塑。"],"fb":null},{"id":22597,"slug":"memento-mori-death-easter","title":"復活節之際，記念你的死亡","date":"2026-05-29","author":"Kelly M. Kapicã€Elizabeth Lewis Hallã€Jason McMartin","cats":["基督徒生活"],"tags":["盼望","死亡","復活","巴特","醫療倫理"],"sum":"莉茲接受癌症治療那年，在熱烈的復活節式敬拜中感到錯位：最該坦然面對死亡的群體，為何最迴避它？心理學的恐懼管理理論指出，人善於不去想死亡，並以死守世界觀、追求成就來逃避，使人刻板防衛。研究也發現虔誠信徒在臨終時更傾向激進的延命醫療，動機多是盼神蹟、怕「放棄信心」，更像恐懼而非神學；教會也用「生命慶祝會」取代誠實哀悼。教會歷史上曾重視memento mori（記念死亡）：本篤會規要每天記念死亡，教堂周圍是墓地，墓碑刻上頭骨，司布真勸人想像自己的離世；巴特說記念死亡本質上就是記念主。莉茲直面死亡後，焦慮反而消退，更能關懷受苦的人；研究也顯示具體面對死亡會減少防衛。正如羅6:4，與基督同死是通往新生命的路。沒有受難日就沒有復活節；可讀詩篇39篇、靜默數算日子、公開宣讀離世者名字、守聖灰星期三，讓「死被得勝吞滅」的喜樂更深。","pts":["教會常跳過受難日直奔復活節","人非常善於迴避思考死亡","逃避死亡使人刻板、防衛、自我膨脹","信徒臨終選擇激進治療，常出於恐懼","生命慶祝會取代了誠實的哀悼","記念死亡是教會悠久的傳統","記念死亡就是記念主","直面死亡反而帶來自由","沒有受難日，就沒有復活節的喜樂"],"mm":{"c":"記念你的死亡","b":[["錯位",["癌症中的敬拜","迴避死亡"]],["心理學",["恐懼管理理論","防衛心理"]],["教會現況",["激進延命","生命慶祝會"]],["傳統",["memento mori","本篤","司布真","巴特"]],["自由",["焦慮消退","更能關懷","羅6:4"]],["實踐",["詩篇39","宣讀名字","聖灰星期三"]]]},"fw":[["經歷","病中的復活節"],["問題","我們很會躲避死亡"],["歷史","教會曾深諳此道"],["轉化","直面死亡，生命更新"],["實踐","重拾記念死亡"]],"q":["記念死亡，本質上就是記念主。","我們匆匆奔向空墳墓，卻沒想過墳墓裡曾安放過什麼。","直接面對死亡，遠比提心吊膽地躲避它更讓人篤定。"],"fb":null},{"id":22595,"slug":"why-vocation-beats-work-life-balance","title":"爲什麼天職觀比「工作與生活平衡」更好","date":"2026-05-29","author":"Paul Carter","cats":["信仰与工作"],"tags":["呼召","創造","平衡"],"sum":"「工作與生活平衡」能提醒人抵制剝削與過勞，但它暗含一個前提：工作不算生活，生活下班後才開始。聖經卻說，早在墮落之前神就交託人修理看守，工作是人之為人的一部分，因此「天職」是更好的理想。比希納說天職是「你內心深處的喜樂與世界深切渴望相遇之處」，它不是自我實現，也不是抹殺自我，而是回應神的呼召。兩側各有一條溝：上一代在大蕭條與冷戰陰影下壓抑熱情、成為工作狂；年輕一代則把工作當純手段，只求保住私人時間，結果效率高卻生命支離破碎。出路是：問什麼工作配得上你的生命、留意使你更誠實有活力的工作、明白真我在委身中被塑造、在禱告與群體中分辨天職，並保持受教。也不要走向另一極端，把野心包裝成神聖。安息日讓我們承認有限、享受神。我們需要的不只是平衡，而是在神面前的整全。","pts":["工作與生活平衡暗含工作不算生活的前提","工作在墮落前就已是人的使命","天職是喜樂與世界需要的交匯點","上一代壓抑熱情，成了工作狂","年輕一代把工作當純手段，逃避責任","以逃避為目的的人生只有空虛","真實的自我在委身中被塑造","在禱告與群體中分辨天職","天職不是工作狂，也不是神聖化野心","需要的不是平衡，而是整全"],"mm":{"c":"天職勝過平衡","b":[["平衡的局限",["防過勞","工作不算生活？"]],["聖經",["創2:15","參與創造之工"]],["天職",["比希納定義","喜樂遇見需要"]],["兩條溝",["工作狂世代","逃避責任世代"]],["走出陷阱",["配得生命的工作","委身塑造自我","群體分辨"]],["整全",["西3:23","安息日"]]]},"fw":[["問題","平衡概念的前提"],["聖經","工作是人性的一部分"],["定義","什麼是天職"],["偏差","兩條溝"],["方法","五個建議"],["結論","在神面前的整全"]],"q":["天職就在恩典帶來的喜樂與愛鄰舍的交匯點上。","真實的自我，往往是在委身中被塑造出來的。","我們需要的不只是平衡，而是在神面前的整全。"],"fb":null},{"id":22592,"slug":"expect-ai-wisdom","title":"審慎擁抱，有所保留：基督徒看 AI","date":"2026-05-28","author":"Mitchell G. Bahnsen","cats":["社会与时事"],"tags":["技術","人工智能","AI","管家職分"],"sum":"關於AI的討論常在恐慌與烏托邦式樂觀之間擺盪，作者主張基督徒可以「審慎擁抱、有所保留」，把AI放在創造、墮落、救贖的敘事中看待。一、技術是管家職分：AI延續人類製造工具的傳統，只能在既有資訊上運作；人的創造不是無中生有，而是耕耘神所造的世界，巴文克說神藉人的勞動做工。二、扭曲的善：問題不在技術本身，而在失序的愛；奧古斯丁說金子無罪，人有罪；巴別塔的罪不在建造能力，而在想與神比肩。三、救贖的潛能：AI已用於早期疾病檢測、加速藥物研發，聖經翻譯時間縮短七八成。但AI不是道德主體，沒有智慧也不敬畏神，道德判斷不能外包給機器。AI既救不了文明，也毀不了它；關鍵在於善盡管家之責。","pts":["不必恐慌，也不必盲目樂觀","AI延續人類製造工具的傳統","人的創造是耕耘神所造之物","技術是人蒙召管家職分的延伸","問題不在技術，而在失序的愛","巴別塔的罪是想與神比肩","AI已在醫療與聖經翻譯上帶來益處","AI不是道德主體，判斷不能外包","AI既不能拯救也不能摧毀文明"],"mm":{"c":"審慎擁抱AI","b":[["兩種反應",["恐慌","烏托邦樂觀"]],["管家職分",["治理這地","耕耘受造","巴文克"]],["扭曲的善",["失序的愛","奧古斯丁","巴別塔"]],["救贖潛能",["醫學影像","藥物研發","聖經翻譯"]],["界限",["非道德主體","敬畏耶和華","效率非首要"]]]},"fw":[["態度","有保留的肯定"],["創造","技術是管家職分"],["墮落","扭曲的善"],["救贖","AI的潛能"],["界限","道德判斷不能外包"]],"q":["金子本無罪，但是人有罪。","失序的心，先於技術的濫用。","AI既無法拯救我們的文明，也無法摧毀它。"],"fb":null},{"id":22584,"slug":"financial-nihilism-hope","title":"Z世代真的「錢」途無望嗎？","date":"2026-05-25","author":"Andrew Lisi","cats":["信仰与工作"],"tags":["管家","知足","財務","Z世代","理財"],"sum":"一位大學橄欖球員撰文指出，體育博彩正毀掉他朋友們的生活；背後更深的問題是「金融虛無主義」：Z世代覺得經濟世界沒有客觀價值，投資只是脫離現實的遊戲，於是不是豪賭就是躺平。作者曾任宣教士與牧師十年、理財規劃師十年，提出教會可以帶來盼望的四種方式。一、認識金錢的力量：金錢承載恐懼、渴望與嫉妒，但教會談錢往往只講債務或奉獻，信徒的理財觀多來自廣告與社群；金錢是門訓問題。二、重拾管家職分：地和其中所有都屬耶和華，墮落就是說「這是我的」，基督卻說「你是我的」；每個財務決定都要問「主啊，你要我怎麼用？」三、建立知足神學：箴30:8–9「不貧窮也不富足」，承認神是供應者、領受並節制，從年輕就開始。四、重置盼望：美國夢破碎，阿們——傳道書早說一切虛空，唯有使人有盼望的神才是真盼望，人可以在此悔改。","pts":["體育博彩正吞噬年輕人","金融虛無主義：覺得金錢世界沒有真實價值","金錢不只是媒介，它承載情感與偶像","教會很少談錢，只講債務與奉獻","金錢是門訓問題","神擁有一切，我們只是管家","每個財務決定都問主要我怎麼用","知足神學：不貧窮也不富足","美國夢破碎，正好轉向真盼望"],"mm":{"c":"Z世代的金錢無望感","b":[["現象",["體育博彩","加密貨幣","金融虛無主義"]],["金錢的力量",["情感管道","偶像","門訓問題"]],["管家職分",["詩24:1","你是我的"]],["知足神學",["箴30:8–9","神是供應者","慷慨節制"]],["盼望",["傳道書虛空","羅15:13","悔改"]]]},"fw":[["現象","博彩與債務"],["診斷","金融虛無主義"],["一","認識金錢的力量"],["二","重拾管家職分"],["三","建立知足神學"],["四","重置盼望"]],"q":["金錢說到底是個門訓問題。","墮落說「這是我的」，十字架說「你是我的」。","美國夢已經破碎了？阿們。"],"fb":null},{"id":22581,"slug":"elders-take-low-seat","title":"新晉長老，先坐末位","date":"2026-05-24","author":"Ryan Curia","cats":["教会事工"],"tags":["服事","長老","長老會議"],"sum":"作者是新任長老，盼這職分多年，最常想到的卻是路加福音14章關於筵席座位的比喻：在神的國裡，向上的路是向下走。新晉長老可以「先坐末位」：一、少說多聽——箴18:13說未聽完先回答是愚昧，資深長老早已安葬會友、輔導危機婚姻，有教會甚至建議新長老頭六個月在會議上不開口。二、了解前因後果、凡事往好處想——你承接的是開始已久的對話，可以先問「我們過去處理過這個問題嗎？」三、牢記角色——長老是牧人不是股東；股東走進會議室才開始工作，牧人走出會議室才開始工作，最重要的不是預算而是靈魂。坐低位不是放棄確信，而是把同工當恩賜。大牧人自己坐了最低的位子——十字架；副手又怎能去搶最高座位？","pts":["神國裡向上的路是向下走","新長老容易想證明自己","少說多聽，讓耳朵比嘴巴熱切","資深長老有你沒見過的傷","先了解前因後果，凡事往好處想","長老是牧人，不是股東","會議服務事工，不是事工服務會議","坐低位不是放棄確信","大牧人坐了十字架這個最低的位子"],"mm":{"c":"新長老先坐末位","b":[["經文",["路14:7–11","尋求尊榮的慾望"]],["少說多聽",["箴18:13","頭六個月","資深長老的傷"]],["了解脈絡",["加入的對話","往好處想","過去處理過嗎"]],["牢記角色",["牧人非股東","彼前5:2","關心靈魂"]],["仰望大牧者",["副手","十字架"]]]},"fw":[["處境","新晉長老"],["經文","筵席的座位"],["一","少說多聽"],["二","了解前因後果"],["三","牢記角色"],["榜樣","大牧者坐了末位"]],"q":["股東走進會議室時開始工作，牧人走出會議室時開始工作。","會議是服務事工的，不是事工服務會議。","如果大牧人坐了最低的位子，副手怎能去搶最高的座位？"],"fb":null},{"id":22573,"slug":"lies-lion-kings","title":"謊言與獅子：如何讀懂《列王紀上》13 章","date":"2026-05-23","author":"Jeremy Kimble","cats":["圣经与神学","卡森神学更新中心"],"tags":["舊約","卡森中心","疑難問題","詮釋"],"sum":"列王紀上13章是聖經中離奇難解的故事：北國王耶羅波安立金牛犢，一位從猶大來的神人當面斥責，預言約西亞將拆毀祭壇，王伸手抓他時手就枯乾，又因神人禱告而復原；神人拒絕王的邀請，因神命他不可在那裡吃喝；後來一位老先知謊稱奉神命請他回家吃飯，神人信了，結果被獅子咬死，耶羅波安仍不悔改。作者分析結構：12:31與13:33首尾呼應形成括號；故事內部是「神人斥責王—王誘勸神人—老先知誘騙神人—老先知斥責神人」的對稱。在整卷列王紀的交錯結構中，13章對應王下22–23章約西亞在伯特利的應驗。「耶和華的話」在本章反覆出現，約西亞也因聆聽遵行主的話而改革。信息是：要正確聆聽、教導並遵行神的話，不可半心半意，即使看似權威的人也不能把我們帶偏。讀懂難解經文的方法，是把整卷書乃至整本聖經當作一體來讀。","pts":["列王紀上13章是難解的經文","耶羅波安帶領百姓拜偶像","神人預言約西亞將興起","神人被老先知的謊言誘騙","違背神的話招致審判","12:31與13:33形成括號結構","本章對應王下22–23的應驗","要正確聆聽、教導並遵行神的話","把整卷書當作一體來讀"],"mm":{"c":"謊言與獅子","b":[["故事",["金牛犢","神人斥責","手枯乾","老先知謊言","獅子"]],["內部結構",["首尾括號","四段對稱"]],["全書結構",["交錯結構","王下23應驗","以利亞以利沙居中"]],["信息",["耶和華的話","全心順服","不被權威帶偏"]],["讀經方法",["整卷閱讀","上下文","晝夜默想"]]]},"fw":[["引子","沒看前傳的電影"],["梗概","神人與老先知"],["結構","括號與對稱"],["全書","列王紀的交錯結構"],["信息","聆聽、教導、遵行"],["方法","整體閱讀聖經"]],"q":["主所要求的從來不是半心半意的順服。","即使看似該聽從的權威，也不能把我們帶離神的話。","把聖經當作一個整體來讀，經文的意思就會更清楚。"],"fb":null},{"id":22569,"slug":"music-liturgy-local-church","title":"地方教會的敬拜音樂與禮儀","date":"2026-05-22","author":"Keith Gettyã€Ligon Duncanã€Sandy Willsonã€Matt Boswell","cats":["教会事工"],"tags":["敬拜","禮儀","音樂事工"],"sum":"這是2025年福音聯盟大會的座談，由威爾遜主持，鄧肯、博斯威爾、蓋蒂討論教會的音樂與禮儀。鄧肯說明為何重要：神最重要；人為頌讚神的榮耀而造；不按神話語敬拜，可能是在拜想像出的神；會眾會相信你敬拜的方式多於你傳講的內容。令人鼓舞的是：年輕人渴慕釋經講道、全球教會與詩歌增長、會眾意識到神才是觀眾。令人擔憂的是：基督教電台的商業模式在決定教會唱什麼；公眾敬拜中讀經與禱告太少，應有讚美、認罪、感恩、光照、委身、差遣等禱告。牧者要牧養整場聚會。實際建議：建立會眾一生要唱的五十首詩歌「正典」，每年新歌不超過六首；把燈打亮、音量調低、用正常人能唱的調；牧者與父親要帶頭唱。好詩歌不只是「神學正確、會眾能唱」，而要讓人驚嘆、迫不及待想唱。設計禮儀要讓聚會充滿聖經（讀、講、禱、唱、看），並以福音的邏輯貫穿。","pts":["神最重要，所以敬拜方式重要","會眾會相信你敬拜的方式，多於你講的內容","會眾不是觀眾，神才是觀眾","商業電台正在左右教會唱什麼","公眾敬拜需要更多讀經與禱告","牧者要牧養整場聚會","建立會眾一生的詩歌正典","每年新歌太多會讓會眾疲憊","開燈、調小音量，會眾才會唱","牧者與父親要帶頭唱"],"mm":{"c":"敬拜音樂與禮儀","b":[["為何重要",["神最重要","為榮耀而造","敬拜塑造神學"]],["鼓舞",["釋經講道","全球詩歌","神是觀眾"]],["擔憂",["商業電台","禱告太少","會眾不唱"]],["實際建議",["五十首正典","少換新歌","燈亮音小","牧者與父親帶唱"]],["好詩歌",["令人驚嘆","旋律難抗拒","老聖詩"]],["禮儀原則",["讀講禱唱看聖經","福音邏輯","神人基督回應"]]]},"fw":[["開場","禱告與介紹"],["重要性","四個原因"],["觀察","鼓舞與擔憂"],["牧者","主導敬拜的責任"],["會眾歌唱","如何讓人唱起來"],["詩歌","好詩歌的要素"],["禮儀","設計原則"]],"q":["如果傳講與敬拜方式不一致，會眾會相信你敬拜的方式。","他們不是觀看敬拜的人，他們是敬拜者，神才是觀眾。","唱得最好的教會，是牧者決定歌唱非常重要的教會。"],"fb":null},{"id":22567,"slug":"rationalists-ai-read-future","title":"爲什麼理性主義者在求AI算命？","date":"2026-05-21","author":"Joe Carter","cats":["社会与时事"],"tags":["預言","啓示","人工智能","AI"],"sum":"社群上有人說AI取代了占星師，只憑生日就能「解鎖你的靈魂、命運與未來」。作者指出一個新亞文化：精通科技、懷疑宗教的「理性主義者」，卻把AI當作自我認知的神諭，請它分析創傷與盲點。Anthropic的研究發現部分用戶對Claude產生「權威投射」，稱它為大師甚至主。尋求隱祕知識是古老的渴望，從巴比倫看內臟、羅馬觀鳥到德爾斐神諭；以賽亞嘲笑觀星者救不了人。AI更顯可信，是因為我們信任數據語言、它的輸出看似高度個人化（實為巴納姆效應），又似乎沒有商業動機。但AI只是預測下一個合理的詞，並不認識你。被認識的渴望是真實美好的：詩139篇說神鑑察我、認識我，且這認識與愛相連；身份是從神領受，而非用提示詞解鎖；未來屬耶和華。AI可以輔助整理思緒，但不能承擔最深問題的權威。「解鎖命運」是世上第二古老的推銷話術，第一句是伊甸園中的「你們便如神」。","pts":["AI被包裝成新式占卜","理性主義者也開始求AI算命","用戶對AI產生權威投射","尋求隱祕知識是古老的渴望","AI的個人化其實是巴納姆效應","AI只是預測下一個詞，並不認識你","被認識的渴望是神所造的","身份是領受的，不是用提示詞解鎖的","未來屬於神，與知道未來的主同行"],"mm":{"c":"求AI算命","b":[["現象",["Grok取代占星","理性的AI信徒","權威投射"]],["古老渴望",["巴比倫","德爾斐","賽47:13"]],["為何可信",["數據語言","巴納姆效應","看似中立"]],["真相",["預測下一個詞","空洞的神諭"]],["福音",["詩139","領受身份","未來屬神"]],["古老謊言",["創3:5","你們便如神"]]]},"fw":[["現象","AI取代占星師"],["群體","求問神諭的理性主義者"],["歷史","古老的飢渴"],["分析","AI為何顯得可信"],["真理","被神認識"],["結論","第二古老的推銷話術"]],"q":["神諭換了新面孔，空洞的承諾卻從未改變。","你不需要解鎖未來，你需要一雙可靠的手托住它。","神對你的認識，與祂對你的愛緊密相連。"],"fb":null},{"id":22565,"slug":"hope-greatest-political-divide","title":"面對最大的政治分裂，答案就在眼前","date":"2026-05-19","author":"J. T. Reevesã€Moriah Lovett","cats":["社会与时事"],"tags":["合一","性別","兩性","不同"],"sum":"一對兄妹作者指出，這一代最深的政治裂痕不在左右兩黨，而在男女之間：Z世代女性政治立場平均比男性偏左三十個百分點，男性則更看重宗教。根源不是女權或父權，而是數位世界放大了男女差異：交友軟體、色情、AI伴侶取代真實關係，男性聚集在對抗性強的平台，女性偏好重關係與審美的空間，彼此活在兩個世界。#MeToo揭露真實惡行，但言辭升級到否定男子氣概本身，如今鐘擺回擺，反動的網紅推波助瀾，更普遍的是彼此忽視。神解決孤獨的方法是一個人——夏娃；罪製造了第一道兩性裂痕。作者分享父母性格相反，有次母親鎖門哭泣，父親搬梯子從窗戶爬進去和好，孩子們看見衝突不是敵人，隔絕才是。教會應成為男女合而不同的家：促成男女友誼與婚姻，減少螢幕干擾，透過混合聚會、交誼舞、分部合唱等創造面對面相處。","pts":["最大的政治裂痕在男女之間","Z世代男女政治立場差距空前","數位世界放大了男女差異","螢幕讓人逃避真實關係，更加孤獨","否定男子氣概與敵視女性都會敗壞社會","彼此忽視比彼此憤怒更危險","神以一個人解決孤獨","衝突不是敵人，隔絕才是","教會應成為男女合而不同的家"],"mm":{"c":"男女之間的裂痕","b":[["現象",["立場差三十點","信息繭房"]],["根源",["數位世界","交友軟體","AI伴侶","不同平台"]],["鐘擺",["#MeToo","否定男性","反動網紅","彼此忽視"]],["聖經",["創2:18","第一道裂痕","失樂園"]],["家庭見證",["梯子與窗戶","衝突可和好"]],["教會",["男女友誼","婚姻","放下螢幕","面對面活動"]]]},"fw":[["問題","最大的政治分歧"],["原因","男女為何漸行漸遠"],["歷史","鐘擺的回擺"],["聖經","第一道裂痕與孤獨"],["見證","合而不同的家庭"],["出路","教會作差異之家"]],"q":["真正的敵人，不是衝突，而是彼此隔絕。","在神的世界裡，相異就會相吸。","與另一方競爭，終點永遠是孤獨。"],"fb":null},{"id":22562,"slug":"happy-wife-happy-life","title":"老婆開心，日子順心？","date":"2026-05-19","author":"Cindy Pickett","cats":["基督徒生活"],"tags":["順服","互補","忍讓"],"sum":"作者曾是聯邦特工，入職第一天就聽到教官嘲諷地說「老婆開心，日子順心」，此後也常聽男同事以譏諷或無奈談論妻子，她不知不覺在心裡列出「完美妻子」清單。她指出這句俗語不合聖經：它的潛台詞是丈夫只需討好妻子換取太平，正像亞當在伊甸園的被動與事後推諉。聖經雖警告爭吵的婦人，但也呼召丈夫像基督愛教會那樣捨己帶領，而非息事寧人。這種模式會讓妻子以情緒或操控變得強勢、丈夫抽身退場，雙方都空洞怨恨。婚姻真正的力量在於彼此服事、彼此順服，映照基督的愛。作者三十多歲單身時卸下職場的苦澀，把單身當作完整而豐富的季節；41歲結婚後，與丈夫聽從建議每天一起禱告，十五年來更謙卑坦誠。比「夫妻開心」更好的口頭禪，是「我和我家必定侍奉耶和華」。","pts":["「老婆開心，日子順心」不合聖經","它把丈夫的責任簡化為討好換和平","亞當的被動與推諉是前車之鑑","丈夫蒙召以捨己的愛來帶領","息事寧人的婚姻會滋生怨恨","婚姻的力量在於彼此服事、彼此順服","單身是完整而豐富的季節","每天一起禱告是婚姻穩固的祕訣","焦點不在夫妻，而在一同侍奉神"],"mm":{"c":"老婆開心日子順心？","b":[["職場經歷",["教官的嘲諷","完美妻子清單"]],["藉口",["討好換太平","亞當的被動"]],["息事寧人",["妻子強勢","丈夫退場","彼此怨恨"]],["聖經婚姻",["弗5:21–33","捨己帶領","彼此順服"]],["另一條路",["單身季節","每天同禱"]],["更好的口頭禪",["路易斯","書24:15"]]]},"fw":[["引子","入職第一天"],["問題","一句流行語"],["分析","藉口與被動"],["後果","息事寧人的婚姻"],["見證","另一種婚姻"],["結語","更好的口頭禪"]],"q":["當夫妻一同俯伏在施恩寶座前，很難再糾結誰說話算數。","婚姻不是不惜代價維持表面祥和，而是映照基督捨己的愛。","至於我和我家，我們必定侍奉耶和華。"],"fb":null},{"id":22560,"slug":"difference-sadness-discontent","title":"難過就等於不知足嗎？","date":"2026-05-18","author":"Brittany Allen","cats":["基督徒生活"],"tags":["悲傷","知足","哀哭"],"sum":"單身、不孕、渴望友誼或工作的人，常聽到「只要你學會知足，神就會賜給你」的安慰。這種說法錯在兩處：它暗示我們能控制神，也預設心願未了而難過的人一定不知足。作者經歷過單身的盼望與多次流產，引用「盼望遲延，令人心憂」。耶穌為耶路撒冷哀哭，祂無罪卻難過，可見憂傷與知足能並存：寡婦可以為孤獨哀傷卻對神的計劃知足，四十多歲仍單身的姊妹也可以既渴望又滿足。悲傷變質為不知足，是在我們願意為得到所想要的而犯罪，或因得不到而犯罪：發怒、指責神、放縱情慾、嫉妒、強求、質疑神的良善。可以自問：若神不給，我仍順服祂、相信祂良善且足夠嗎？悲傷本身不是罪，我們可以到施恩寶座前哀哭，用詩篇13篇禱告，同時握住痛苦與信靠。","pts":["「學會知足就會得到」是錯誤的安慰","這種想法暗示我們能操控神","心願未了而憂傷不等於不知足","耶穌無罪，卻為耶路撒冷哀哭","憂傷與知足可以並存","為得到或因得不到而犯罪，才是不知足","不知足的跡象：強求、嫉妒、質疑神","自問：神若不給，我仍順服祂嗎？","可以到施恩寶座前哀哭"],"mm":{"c":"難過不等於不知足","b":[["未了心願",["單身","不孕","友誼","工作"]],["錯誤安慰",["操控神","預設不知足"]],["既憂傷又知足",["耶穌哀哭","寡婦","單身姊妹"]],["不知足的跡象",["發怒指責","放縱情慾","嫉妒","強求"]],["自我省察",["仍順服嗎","神足夠嗎"]],["出路",["施恩寶座","詩13篇","痛苦與信靠"]]]},"fw":[["處境","未能實現的渴望"],["誤解","知足換取祝福"],["聖經","既憂傷又知足"],["分辨","不知足的跡象"],["回應","為未竟的渴望哀嘆"]],"q":["因心願未了而憂傷，不等於不知足。","耶穌從未犯罪，但祂確實哭了。","基督徒可以同時握住痛苦和信靠。"],"fb":null},{"id":22558,"slug":"equal-protection-harms-pro-life","title":"平等保護法案如何削弱反墮胎運動？","date":"2026-05-18","author":"Scott Klusendorf","cats":["社会与时事"],"tags":["反墮胎","立法","計劃生育"],"sum":"田納西州一項「平等保護」法案若通過，接受墮胎的女性可能被控謀殺；它在多個反墮胎組織支持下被否決，引發爭論。羅訴韋德案前，反墮胎法一律不追訴女性，理由是懲處醫生更能降低墮胎、需要女性作證、許多女性受到脅迫。平等保護派引用「兩樣的法碼為神憎惡」，認為不追訴女性是道德妥協。作者主張這不是妥協而是審慎：深紅州選民也在支持把墮胎寫入州憲法，教會會眾的反墮胎認同兩年內驟降至43%，「反墮胎者仇視女性」的敘事正在發酵。設想一位在福音派家庭長大的少女驚慌中服藥墮胎而以一級謀殺受審，這畫面將重創反墮胎陣營。威伯福斯與林肯都在原則與時機之間審時度勢。此外，女性與墮胎醫生的知情程度不同，多數人對胎兒發育所知甚少，定罪極難。原則不可退讓——蓄意殺害無辜者是錯的——但懲處策略可以調整，以拯救最多生命。","pts":["平等保護法案主張以謀殺罪起訴墮胎女性","過去法律不追訴女性有三個理由","支持者認為不追訴是雙重標準","當前文化與政治處境不利","教會會眾反墮胎認同大幅下降","起訴女性會成為支持墮胎方的宣傳","威伯福斯與林肯示範政治審慎","女性與墮胎醫生的知情程度不同","原則不退讓，策略可調整"],"mm":{"c":"平等保護法案之爭","b":[["事件",["田納西法案","被否決"]],["歷史理由",["懲處供給側","需要證詞","女性受脅迫"]],["支持者論點",["兩樣法碼","知情的女性"]],["審慎考量",["紅州公投","會眾支持下降","莉莉案例"]],["歷史榜樣",["威伯福斯","林肯"]],["知情差異",["醫生的感受","一團細胞迷思","教會的教導"]]]},"fw":[["事件","一項被否決的法案"],["爭論","平等保護的主張"],["處境","審時度勢"],["案例","莉莉的審判"],["歷史","改革者的審慎"],["法律","知情程度的差異"],["結論","原則不變，策略調整"]],"q":["政治是可能性的藝術。","通達人見禍藏躲，愚蒙人前往受害。","我們不能指望靠關押女性來扭轉劣勢。"],"fb":null},{"id":22556,"slug":"edgelords-inherit-earth","title":"「鍵盤俠」成不了氣候","date":"2026-05-14","author":"Joe Carter","cats":["社会与时事"],"tags":["網紅","鍵盤俠"],"sum":"一段網紅斥責牧師懦弱的短片有四萬觀看，而一位牧師深刻的反思只有十四個讚。作者指出，「邊緣領主」（鍵盤俠）把標新立異當深刻、把冒犯當勇氣，正成為一代年輕男性的男子氣概典範。他們受歡迎有四個原因：提供歸屬感與共同敵人；說出年輕男性孤獨、自殺率高、教育落後等被社會忽視的真實痛苦；提供不需多年淬鍊就能立刻感到重要的捷徑；演算法獎勵憤怒。但真勇氣是在付代價時對權勢說真話。聖經的成熟男性標準是節制、自守、溫和、不爭競；保羅能駁倒任何人，卻為教會流淚、親手勞作、像母親般照顧信徒、憑愛心懇求。教會的出路：培養門徒而非與挑釁者爭辯，表揚默默服事數十年的執事與主日學老師；教導年輕人理解演算法如何劫持注意力；重拾忠誠、耐心、克制這些「乏味」的美德。溫柔是受控的力量，溫柔的人必承受地土，鍵盤俠終將被遺忘。","pts":["鍵盤俠把冒犯當勇氣、把越界當深刻","他們正成為年輕男性的男子氣概典範","他們提供歸屬感與共同敵人","他們說出了被忽視的真實痛苦","他們提供通往重要性的捷徑","演算法放大憤怒","聖經的成熟是節制而非魯莽","保羅能摧毀對手，卻選擇以愛服事","培養門徒，表揚默默忠心的人","溫柔是受控的力量"],"mm":{"c":"鍵盤俠成不了氣候","b":[["現象",["四萬觀看","邊緣領主","表演性越界"]],["為何受歡迎",["歸屬感","真實痛苦","重要性捷徑","演算法"]],["聖經典範",["提前3章","多2章","保羅的榜樣"]],["前行之路",["培養門徒","理解演算法","乏味的美德"]],["應許",["太5:5","溫柔是受控的力量","平凡的忠心"]]]},"fw":[["現象","網紅與牧師的對比"],["定義","什麼是邊緣領主"],["原因","為何吸引年輕男性"],["對照","聖經中的成熟男性"],["出路","教會的三項行動"],["應許","溫柔的人承受地土"]],"q":["真正的勇氣，是在付出代價時仍敢於向權勢者直言。","謙卑者或將承受地土，卻難成網絡熱點。","煽動者的悲劇不在於遭受批評，而在於終將被遺忘。"],"fb":null},{"id":22547,"slug":"christian-parents-need-classics","title":"基督徒父母也需要讀經典","date":"2026-05-13","author":"Nadya Williams","cats":["文化与艺术"],"tags":["閱讀","經典","在家教育","博雅教育"],"sum":"英國小王子一入學就學拉丁文，而古典語言與經典教育曾是美國教育的基石；如今多數成年人對經典所知甚少。作者鼓勵錯過古典教育的父母現在就和孩子一起開始，因為經典對心智與靈魂都有益。一、找到群體：古典基督教學校與在家共學小組正在增長，也有古典學習測試與獎學金；也可以只是全家一起學拉丁文、大聲朗讀經典，有人甚至讀完整部《戰爭與和平》。二、養成每日閱讀：父母也需要持續成長，奧古斯丁與路易斯的歸信都與愛書有關；讀經居首，但不只讀經，教父們也熟讀古典文學；每天讀一百頁一年可讀上百本。三、打造家庭圖書館：平裝經典與舊書義賣讓這件事並不昂貴；書在手邊就更可能被讀。在充斥不真、不善、不美之物的世界，經典幫助我們正確地去愛——先愛神，再與人分享美好的故事。","pts":["古典教育曾是美國教育的基石","多數成年人錯過了經典教育","現在和孩子一起開始還不晚","經典對心智和靈魂都有益","找到志同道合的群體","父母也需要持續學習成長","每日閱讀，讀經居首卻不只讀經","打造家庭圖書館並不昂貴","經典幫助我們正確地去愛"],"mm":{"c":"父母也需要讀經典","b":[["背景",["拉丁文","開國先賢","古典教育式微"]],["找到群體",["古典基督教學校","共學小組","全家朗讀"]],["每日閱讀",["父母成長","奧古斯丁與路易斯","每天一百頁"]],["家庭圖書館",["平裝經典","舊書義賣","觸手可及"]],["目的",["真善美","正確地愛"]]]},"fw":[["現況","經典教育的失落"],["鼓勵","與孩子一起開始"],["一","找到你的群體"],["二","養成每日閱讀"],["三","打造家庭圖書館"],["目的","學會正確地愛"]],"q":["經典著作不僅對智識有益，對靈魂也有益。","每日讀經理應居首，但我們不該只讀聖經。","經典幫助我們正確地去愛，首先是愛神。"],"fb":null},{"id":22544,"slug":"questions-evaluate-ai-use","title":"使用AI之前，先問自己三個問題","date":"2026-05-12","author":"Bethany Broderick","cats":["信仰与工作"],"tags":["技術","人工智能","AI","有限"],"sum":"在家教育的媽媽用ChatGPT排課表，在職媽媽用AI規劃菜單，作家朋友用它趕稿。多數基督徒知道AI是糟糕的神學家，也不能取代關係，但仍會問：使用承諾減輕負擔的工具算錯嗎？AI本身沒有道德屬性，但我們會被所用的技術塑造；難以一條規則適用所有人，需要憑聖經智慧與聖靈引導分辨。作者提出三個問題：一、我是否用AI突破神給的限制？人的有限不是待修補的缺陷，而是倚靠全知之神的邀請。二、我是否用AI取代從真實關係得來的智慧？奧特曼說無法想像沒有ChatGPT怎麼養新生兒，作者則無法想像沒有婆婆、教會姊妹與小組媽媽們的幫助；最好的智慧往往來自敬虔朋友的一通電話。三、我是否用AI逃避神託付的工作？人蒙召參與神的創造，AI可以輔助而非代替。無論用或不用，都要為榮耀神而行。","pts":["AI已進入日常生活","AI本身中性，但會塑造使用者","難以一條規則適用所有人","問題一：是否用AI突破神給的限制","人的有限是倚靠神的邀請","問題二：是否用AI取代真實關係中的智慧","最好的智慧常來自敬虔朋友","問題三：是否用AI逃避神託付的工作","AI可以輔助，不應代替"],"mm":{"c":"使用AI前的三問","b":[["背景",["排課表","規劃菜單","趕稿"]],["原則",["技術塑造人","良心判斷","聖靈引導"]],["限制",["突破有限？","詩139:6"]],["關係",["奧特曼的話","婆婆與姊妹","鐵磨鐵"]],["工作",["參與創造","輔助而非代替"]],["結論",["林前10:31"]]]},"fw":[["現象","AI進入日常"],["前提","工具會塑造人"],["問題一","限制"],["問題二","關係"],["問題三","工作"],["結論","為榮耀神而行"]],"q":["人的侷限不是技術需要克服的缺陷，而是一份倚靠神的邀請。","最好的智慧往往不是來自清單，而是來自敬虔朋友的電話。","AI可以輔助我們的工作，卻不應讓我們放棄那工作。"],"fb":null},{"id":22541,"slug":"pastor-productivity-dependence","title":"事奉的果效從倚靠神開始","date":"2026-05-12","author":"Daniel Stegeman","cats":["信仰与工作"],"tags":["效率","生產力","高效"],"sum":"牧者的工作沒完沒了，也要為此向神交帳。作者曾經歷一段效率低落、連基本工作都吃力的時期；反省禱告後，主讓他看見自己太倚靠個人衝勁與才幹而非聖靈，認罪後回到大量讀經與長時間禱告，熱忱才恢復。他提出七個建議：一、明確呼召，與長老討論出四五個核心重點，別人能做的不必攬下，傳道是核心；二、每天在禱告中定下重點，別讓急事擠掉要事；三、建立穩定的每週節奏，為講道、門訓、探訪預留時段；四、善用科技工具，但不被其掌控，路德、加爾文、司布真沒有電腦也碩果累累；五、只在固定時段查郵件，限制社群媒體；六、要休息，也要守安息日，神在你休息時仍在工作；七、每天把工作交託主，禱告「願你堅立我們手所做的工」。","pts":["牧者要為自己的工作向神交帳","效率低落的根源可能是倚靠自己","回到讀經與禱告的基礎","明確呼召，傳道是核心","每天在禱告中定下優先次序","建立穩定的每週節奏","善用工具，但不被工具掌控","固定時段查看郵件","休息與安息日是神的命令","把每天的工作交託給主"],"mm":{"c":"事奉果效從倚靠神開始","b":[["經歷",["效率低落","倚靠才幹","認罪回轉"]],["方向",["明確呼召","務要傳道"]],["每日每週",["禱告定重點","穩定節奏"]],["工具與專注",["科技工具","定時查郵件","限制社群"]],["休息",["中途休息","安息日","神不打盹"]],["交託",["詩90:17","詩37:5"]]]},"fw":[["處境","沒完沒了的牧養工作"],["見證","效率低谷與回轉"],["一至三","呼召、重點、節奏"],["四至五","工具與專注"],["六","休息與安息"],["七","交託給主"]],"q":["規律並不意味著不倚靠神，規律往往帶來更大的果效。","即使你在安息，神仍在工作。","當將你的事交託耶和華，並倚靠祂，祂就必成全。"],"fb":null},{"id":22536,"slug":"christian-leaders-think-ai","title":"教會領袖應如何看待人工智能？","date":"2026-05-12","author":"Gavin Ortlundã€Jay Kim","cats":["社会与时事"],"tags":["技術","社交媒體","人工智能","AI","有限","上癮"],"sum":"奧特倫德與住在矽谷的牧師金對談AI與教會領袖。金指出，我們被騙以為數位工具是中性的，其實它們有設計邏輯、會塑造人，最後是工具在使用我們。他特別擔心網紅出售AI男女友帳號：永遠不抱怨、只說你想聽的話，以虛擬取代真實關係，使人去人性化。奧特倫德反思自己用手機填滿每個空白，逃避神給人的有限與健康的無聊；他每三四個月重新檢視社群媒體習慣，因為平台本就為成癮而設計。金引用波茲曼：當一切都重要，一切都變得瑣碎；我們對世界和彼此麻木，看不見每個人身上神的形像。奧特倫德說，人造不出永恆的靈魂，這讓人更珍惜人；對抗成癮不只是抵抗誘惑，而是把內心需要轉向基督與真實友誼——想刷手機時，打個電話約朋友散步。說到底，AI不過是0與1，唯有神將氣息吹入人裡面。","pts":["數位工具並不中性，它們會塑造人","最終不是我們用工具，而是工具用我們","AI伴侶以虛擬取代真實，使人去人性化","手機讓人逃避健康的有限與無聊","要定期重新檢視使用習慣","當一切都重要，一切都變得瑣碎","人造不出永恆的靈魂","把內心需要轉向基督與真實友誼","放下算法，做一個真實的人"],"mm":{"c":"教會領袖看AI","b":[["工具非中性",["設計邏輯","工具用人"]],["AI伴侶",["網紅AI帳號","去人性化"]],["有限",["健康的無聊","定期檢視","成癮設計"]],["麻木",["波茲曼","路易斯","神的形像"]],["出路",["真實友誼","打電話散步","親近基督"]],["人的獨特",["0與1","神的氣息"]]]},"fw":[["問題","AI帶來的神學與倫理挑戰"],["警示","工具在使用我們"],["例子","AI男女友"],["反思","有限與成癮"],["出路","轉向真實關係"],["結論","人是神所造的"]],"q":["到最後，不是我們在使用工具，是工具在使用我們。","當一切都很重要，就什麼都不重要了。","你我不是由0和1所造的，我們是神創造的。"],"fb":null},{"id":22534,"slug":"when-did-jesus-die","title":"耶穌究竟死於哪一年？","date":"2026-05-11","author":"Bernard N. Howard","cats":["圣经与神学","卡森神学更新中心"],"tags":["歷史","卡森中心","耶穌受難","考證"],"sum":"耶穌受難兩千週年將至，但究竟是哪一年？歷史學家同意在公元26至36年彼拉多任內。作者整理七個因素：一、路加說施洗約翰始於提庇留第十五年，按羅馬慣例應為公元29年，共同執政紀年理論不可取；二、耶穌事奉經歷至少三個逾越節，受難最早在公元32年；三、保羅歸信十四年後上耶路撒冷賑災（約公元46–48年饑荒），排除公元35、36年；四、非基督徒史家弗勒貢記載第202屆奧林匹亞第四年正午變黑、星辰可見，對應公元32–33年，早期教父將之與受難相連；五、天文推算顯示公元33年3月5日是星期四滿月，最後晚餐可能在當晚，受難日為3月6日；六、路加說耶穌「約三十歲」是概數；七、約2:20聖殿造了46年，指向公元30年的逾越節。常見的公元33年4月3日之說，須以逾越節在受難後為前提，與對觀福音不符。2033年逾越節與受難節同週，教會可在當年4月15日紀念兩千週年。但比年份更重要的，是祂為我們捨己這事實本身。","pts":["受難必在公元26至36年之間","提庇留第十五年應為公元29年","三個逾越節使受難最早在公元32年","保羅的時間線排除公元35、36年","弗勒貢記載的正午黑暗指向公元33年","公元33年3月5日是星期四滿月","作者推定受難日為公元33年3月6日","4月3日之說與對觀福音順序不符","2033年可紀念受難兩千週年","比年份更重要的是十字架本身"],"mm":{"c":"耶穌死於哪一年","b":[["範圍",["彼拉多任內","26–36年"]],["羅馬紀年",["提庇留十五年","公元29年"]],["新約線索",["三個逾越節","保羅十四年"]],["外部證據",["弗勒貢","他勒","正午黑暗"]],["天文",["滿月星期四","33年3月5日"]],["其他",["約三十歲","聖殿46年","4月3日之說"]],["應用",["2033年","成了"]]]},"fw":[["問題","哪一年紀念兩千週年"],["因素一","提庇留第十五年"],["因素二","三個逾越節"],["因素三","保羅的時間線"],["因素四","弗勒貢的黑暗"],["因素五","滿月的最後晚餐"],["因素六七","年齡與聖殿"],["辨析","4月3日之說"],["結語","比年份更重要的事"]],"q":["遠比受難年份更重要的，是受難這一事實本身。","造物主甘願被拆毀，為要使我們得以重造。","每一天都是紀念神兒子犧牲的完美日子。"],"fb":null},{"id":22531,"slug":"find-christ-text-fool","title":"是的，你能在一個關於愚頑人的故事裡找到基督","date":"2026-05-11","author":"Ian J. Vaillancourt","cats":["圣经与神学","卡森神学更新中心"],"tags":["救贖歷史","舊約","大衛","卡森中心","愚頑"],"sum":"撒上25章大衛與愚頑人拿八的故事讀來奇怪又難以應用：大衛要殺盡拿八家的男丁，最後還娶了拿八的遺孀與另一位妻子。作者主張把它放在聖經救贖歷史中閱讀。創3:15應許女人的後裔，此使命逐漸聚焦於猶大支派的王；申17章列出君王條件：由神揀選、倚靠神、不可多妻、浸潤在神話語中。撒母耳記的英雄是受膏的大衛，他一再拒絕向掃羅復仇。拿八（意為愚頑人）拒絕承認大衛，其實是在抵擋神所膏的王；大衛立誓報復，被亞比該勸阻，神親自擊殺拿八。三個功課：一、神的救贖計劃永不落空，祂保守了不配又脆弱的大衛；二、聖經似乎在為大衛織一件王袍，但這章顯示他的肩膀還不夠寬——與愚頑人交手後他自己也成了愚頑人，並開始多妻，預示日後的拔示巴之罪；三、我們的盼望要超越大衛，指向那位無罪、被神離棄來拯救我們的君王耶穌。大衛的愚頑如暗色天鵝絨，襯托出基督如鑽石般的公義。","pts":["撒上25章是難以應用的經文","要放在救贖歷史中閱讀","女人後裔的應許聚焦於君王","申17章列出理想君王的條件","拿八拒絕大衛，就是抵擋神的受膏者","神的救贖計劃永不落空","大衛與愚頑人交手後也成了愚頑人","大衛無法承載理想君王的榮光","盼望要指向完全的君王耶穌"],"mm":{"c":"愚頑人故事中的基督","b":[["故事",["拿八拒絕","大衛誓殺","亞比該勸阻","神擊殺拿八"]],["救贖歷史",["創3:15","猶大支派","申17章"]],["大衛",["受膏者","拒殺掃羅","逃亡中"]],["功課一",["計劃不落空"]],["功課二",["王袍太大","箴26:4","多妻"]],["功課三",["猶太人的王","無罪","替代被棄"]]]},"fw":[["困惑","一個奇怪的故事"],["宏觀","舊約君王的故事"],["細節","撒上25章"],["功課一","神的計劃永不落空"],["功課二","大衛不夠完美"],["功課三","指向基督"]],"q":["大衛的肩膀還不夠寬闊，承載不了那王袍全部的榮光。","不要照愚昧人的愚妄話回答他，恐怕你與他一樣。","大衛的愚頑如暗色天鵝絨，襯托出基督如鑽石般的公義。"],"fb":null},{"id":22528,"slug":"verse-helped-spiritual-anxiety","title":"幫助我走出屬靈焦慮的那節經文","date":"2026-05-10","author":"Sara Gonzalez","cats":["基督徒生活"],"tags":["成聖","焦慮","身份"],"sum":"作者從小在教會長大，以為自己信仰不錯，直到認真獨自讀經，越看見神完美的標準，就越察覺自己的罪，陷入「我是不是在做該做的事」的屬靈焦慮，覺得基督的義只是將來的應許。聖靈把她帶回林後5:17：「若有人在基督裡，他就是新造的人，舊事已過，都變成新的了。」她注意到時態：舊事「已」過——我們仍與罪爭戰，但身份不再由罪定義，基督的「成了」宣告舊我終結。「新造」也不是將來的標籤，而是此刻的身份：我們與基督同死同復活，基督就是我們的生命。這改變了追求聖潔的動機：不是焦慮地為自己活，而是被基督的愛激勵。回應太11:28–30的呼召，負祂輕省的軛，成聖便成為安息倚靠祂的果子；雖未完全聖潔，基督完全的義此刻已遮蓋我們。","pts":["越認識神的聖潔，越看見自己的罪","焦慮會讓人依賴行為安撫良心","林後5:17的時態：舊事已過","罪不再定義我們的身份","「新造」是此刻的身份，不只是將來","基督就是我們的生命","被基督的愛激勵，而非焦慮驅動","負基督的軛，在順服中得安息","基督的義此刻已遮蓋我們"],"mm":{"c":"走出屬靈焦慮","b":[["焦慮",["我做得夠嗎","被定罪感","義像將來的事"]],["舊我已死",["舊事已過","成了","仍與罪爭戰"]],["新造的身份",["此刻的身份","與基督同復活","西3:1–4"]],["新動機",["基督的愛激勵","為主而活"]],["安息",["太11:28–30","輕省的軛","義已遮蓋"]]]},"fw":[["掙扎","我是不是在做該做的事"],["經文","林後5:17"],["一","老我與基督同死"],["二","基督是現在的身份"],["三","記住身份，得著安息"]],"q":["舊事已過——我們的身份不再由罪來定義。","新造不是死後的標籤，而是此刻真實的身份。","成聖不是焦慮的努力，而是安息倚靠基督的果子。"],"fb":{"h":"舊事已過，\n不是將來式，是完成式。","t":"你有沒有過這種夜晚？\n明明信主很多年，躺在床上卻一遍遍盤問自己：我做得夠嗎？我是不是又讓神失望了？\n\n奇怪的是，越認真讀經，焦慮反而越深。\n因為你越看清神有多聖潔，就越看清自己有多遠。\n\n這裡藏著一個哲學難題：\n一個有限的人，如何能站在無限聖潔的神面前，而不被壓垮？\n\n多數人的答案是——再努力一點。\n多讀一章，多禱告一刻，多做一件好事。\n可是，努力能換來的，只是更長的待辦清單；\n行為能安撫的，只是一晚的良心。\n天亮之後，控告又回來了。\n\n直到有一天，你重新讀到那節從小背過的經文：\n「若有人在基督裡，他就是新造的人，舊事已過，都變成新的了。」\n\n請停在那個字——「已」。\n不是「將要過去」，不是「努力讓它過去」，\n而是「已經過去」。\n\n這就是認知的翻轉：\n你一直把基督的義當成將來才兌現的支票，\n其實它早已存入你的帳戶。\n你一直以為自己是個努力想變好的舊人，\n其實你是一個正在學習活出新身份的新人。\n\n舊的我，在十字架上與基督同死；\n新的我，在復活裡與基督同活；\n此刻的我，在祂的愛裡被激勵而活。\n\n焦慮問的是：我夠不夠好？\n福音答的是：祂已經成了。\n焦慮把成聖變成考試，\n恩典把成聖變成果子。\n考試讓人緊繃，果子讓人安息。\n\n當然，你明天還會跌倒，還會與罪爭戰。\n但爭戰的人，和被定罪的人，不是同一種人。\n前者在戰場上，後者在法庭上——\n而你的案子，已經結了。\n\n耶穌說：凡勞苦擔重擔的，到我這裡來。\n祂沒有說「先把自己整理好再來」，\n祂說的是「來」。\n\n所以今晚，不必再數算自己的虧欠。\n把那張寫滿「不夠」的清單交出去，\n換上祂那副容易的軛。\n\n舊事已過——\n像黎明之後的夜，\n不必再被你一遍遍點亮。\n\n#新造的人 #林後五17 #屬靈焦慮 #恩典 #安息"}},{"id":22523,"slug":"george-saunders-afterlife","title":"筆尖下的陰陽界","date":"2026-05-09","author":"Jonathon Crump","cats":["文化与艺术"],"tags":["死亡","小說","桑德斯"],"sum":"小說家喬治·桑德斯人氣如明星，許多人稱他為「世俗聖徒」，因為他的作品傳遞清晰的道德願景，且近三部都探討來世。《守夜》中臨終的石油公司總裁必須放下自我中心才能安息——教人摒棄自私；《林肯在中陰》寫林肯喪子之痛使他體恤眾生——教人同情；短篇〈母親節〉中刻薄的阿爾瑪死後雙手滾燙，一碰孩子就灼傷他們——教人克制私慾。桑德斯出身天主教、後轉信佛教，他說寫作比冥想更讓他專注真理，而年近七十，他坦言死亡成了揮之不去的心事，擔心自己沒準備好。基督徒認同這些美德（羅12:15、腓2:3、雅4:1），也看見世俗世界對屬靈指引的渴求。但沒有人能靠自己做足準備迎接死亡，除了耶穌：祂勝過試探、體恤軟弱、虛己順服至死，主動交出靈魂，並應許去為我們預備地方。預備死亡、成為聖徒的唯一途徑是信靠耶穌。","pts":["桑德斯被視為世俗聖徒","他的小說近年聚焦來世","《守夜》教人摒棄自私","《林肯在中陰》教人同情","〈母親節〉教人克制私慾","寫作是他預演死亡的修行","世俗世界渴求屬靈指引","沒有人能靠自己準備好面對死亡","唯有耶穌為死亡做好了準備","成為聖徒的唯一途徑是信靠耶穌"],"mm":{"c":"筆尖下的陰陽界","b":[["世俗聖徒",["明星作家","道德願景"]],["三部作品",["守夜","林肯在中陰","母親節"]],["三個教導",["摒棄自私","常懷同情","克制私慾"]],["桑德斯本人",["天主教到佛教","寫作如修行","怕死亡"]],["基督徒回應",["認同美德","沒人能準備好"]],["耶穌",["大祭司","主動捨命","預備地方"]]]},"fw":[["現象","被奉為聖徒的小說家"],["作品","三部來世故事"],["作者","在寫作中預演死亡"],["共鳴","聖經中的美德"],["渴求","世界需要屬靈指引"],["答案","唯有耶穌引領我們面對死亡"]],"q":["沒有人準備好面對死亡，除了耶穌。","我們尋求的不是另一位聖徒，而是那位偉大的大祭司。","預備死亡的最好方式，不是冥想，而是信靠耶穌。"],"fb":{"h":"沒有人準備好面對死亡，\n除了那一位。","t":"一位暢銷小說家，被讀者封為「世俗聖徒」。\n他的書教人放下自我、學會同情、克制慾望；\n他每天冥想，在寫作中修行。\n然而六十七歲的他坦白說：死亡，成了我揮之不去的心事。\n\n這是一個讓人沉默的畫面——\n最會教人如何好好死的人，自己卻還沒準備好。\n\n我們不妨問一個古老的哲學問題：\n人能不能靠自己，做好面對死亡的準備？\n\n如果答案是「能」，那需要多少無私才夠？多少同情才足？多少節制才算完成？\n沒有人知道終點線在哪裡，\n只知道每一次回頭，都發現自己還差得很遠。\n\n他的小說裡，有三種臨終的人：\n一位執意自我中心的總裁，必須放下自己才能安息；\n一位喪子的父親，在劇痛中學會體恤眾生；\n一位刻薄的老婦，雙手滾燙，一碰孩子就灼傷他們。\n\n這些故事很美，也很真。\n它們說出了世界最深的渴望：\n我們渴望變好，渴望被饒恕，渴望離開時心裡平安。\n\n但這裡有一個翻轉：\n世界在尋找下一位聖徒，\n聖經卻指向一位大祭司。\n\n聖徒告訴你該怎麼走，\n大祭司卻替你走完了那條路。\n\n祂在曠野勝過了慾望，\n在人群中體恤了軟弱，\n在十字架上虛己到底。\n就連最後一口氣，都不是被奪走的，\n而是祂親手交出的。\n\n祂也曾在客西馬尼流汗如血，求那杯離開——\n所以祂懂你怕死的心。\n然而祂站起來，走向十字架，又從墳墓裡走出來，\n回頭對我們說：「我去，原是為你們預備地方。」\n\n冥想可以讓心安靜一會兒，\n寫作可以讓思緒清楚一點，\n但只有一位，能讓死亡失去最後的話語權。\n\n所以，預備死亡最好的方式，\n不是更努力地成為聖徒，\n而是更深地信靠那位已經為你預備好一切的主。\n\n夜很長，\n但有人已經走到黎明那頭，\n為你點著燈。\n\n#死亡 #來世 #大祭司 #信靠 #文學與信仰"}},{"id":22521,"slug":"why-arent-christians-funny","title":"爲什麼基督徒總是那麼無趣？","date":"2026-05-09","author":"Michael Jensen","cats":["基督徒生活"],"tags":["恩典","幽默","歡笑"],"sum":"作者父親愛講一個笑話：參賽者答不出亞伯拉罕生在哪裡，支吾一聲「唔」（Ur，吾珥）卻贏得大獎——失敗反得獎賞，正是因信稱義的小比喻。既然這是我們的福音，基督徒理應活得輕盈。但基督徒常給人無趣的印象。一是把信仰看得太嚴肅：金口約翰說這時代該哭不該笑，聖經的確知道哀慟，但新約從未把無喜樂等同於敬虔，聖靈果子有喜樂，天國被描繪成筵席。二是把自己看得太重：在焦慮的個人主義時代，自我是需要保護的脆弱工程；奧古斯丁與阿奎那說驕傲使人向內蜷縮，切斯特頓說天使能飛是因為把自己看得很輕。無法自嘲的基督徒或許還沒真正領受恩典——若地位全在基督，失敗就不再是災難。福音也讓我們嘲笑仇敵：路德說驅魔最好的方法是嘲弄魔鬼。基督徒的笑謙卑而篤定，不殘忍不憤世；活得輕盈，因為最重要的事基督已成就。","pts":["失敗反得獎賞，正是恩典的比喻","基督徒理應活得輕盈","把嚴肅等同聖潔是個錯誤","聖靈果子包含喜樂，天國是筵席","基督徒不幽默，常因把自己看得太重","驕傲使人向內蜷縮，謙卑為笑聲騰出空間","無法自嘲，或許還沒真正領受恩典","福音讓我們嘲笑那控告我們的仇敵","活得輕盈，因為基督已成就最重要的事"],"mm":{"c":"基督徒為何無趣","b":[["笑話",["吾珥","失敗得獎","因信稱義"]],["太嚴肅",["金口約翰","哀慟有時","喜樂是果子","天國筵席"]],["太看重自己",["脆弱的自我","向內蜷縮","切斯特頓"]],["恩典的自由",["失敗非終極","少些防禦"]],["嘲笑仇敵",["路德","邪惡沒有最終話語權"]],["健康的笑",["謙卑篤定","不殘忍不憤世"]]]},"fw":[["引子","父親的笑話"],["問題","為何基督徒給人無趣印象"],["原因一","把信仰看得太嚴肅"],["原因二","把自己看得太重"],["自由","歡笑吧"],["結語","忘了福音有多好"]],"q":["天使能夠飛翔，是因為他們把自己看得很輕。","一個無法自嘲的基督徒，也許還沒有真正領受恩典。","活得輕盈，不是因為什麼都不重要，而是因為最重要的事基督已經成就。"],"fb":{"h":"天使能飛，\n是因為把自己看得很輕。","t":"有一個老笑話：\n主持人問參賽者：「亞伯拉罕在哪裡出生？」\n參賽者支支吾吾：「唔……」\n主持人大喊：「答對了！吾珥！獎金是你的！」\n\n很冷，對吧？\n但這個冷笑話裡，藏著整本聖經最溫暖的消息：\n失敗的人，竟然得了獎賞。\n這就是恩典。\n\n那麼問題來了——\n既然我們信的是這樣的福音，\n為什麼基督徒常常給人一種印象：嚴肅、緊繃、不太會笑？\n\n或許，是因為我們把兩件事搞混了：\n把嚴肅當成聖潔，\n把緊繃當成敬虔，\n把不苟言笑當成認真對待神。\n\n可是新約從來沒有說喜樂是屬靈的敵人；\n聖靈的果子裡，有喜樂；\n天國被比喻成筵席，不是法庭，也不是考場。\n\n更深的原因，也許是我們太把自己當回事了。\n在這個焦慮的時代，「自我」像一件易碎品，\n要經營、要保護、要不停證明。\n於是笑聲變得危險——\n因為笑，可能讓人看見我們的破綻。\n\n這裡有一個翻轉：\n不會自嘲的人，未必是成熟；\n可能只是還沒真正嘗過恩典。\n\n如果我在神面前的地位，全靠基督，\n那我的失敗，就是真實的，卻不是終極的；\n是痛的，卻不是致命的；\n是一個句號裡的逗點，不是故事的結局。\n\n路德說，趕走魔鬼最好的方法，是嘲笑他。\n因為控告者最怕的，不是我們的嚴肅，\n而是我們在十字架下那份篤定的輕盈。\n\n基督徒的笑，不殘忍、不尖酸、不自鳴得意；\n它是一種謙卑的確信：\n邪惡不會有最後一句話，\n我的荒謬也不會。\n\n我們可以活得輕一點——\n不是因為什麼都不重要，\n而是因為最重要的事，祂已經做完了。\n\n所以，今天如果你出了糗，\n先別急著懊惱。\n試著笑一笑。\n那笑聲，\n也許正是你信得最深的一刻。\n\n#幽默 #恩典 #因信稱義 #喜樂 #謙卑"}},{"id":22517,"slug":"kids-gospel-bite-size-pieces","title":"一口一口「吃」福音","date":"2026-05-08","author":"Michelle Ayres","cats":["基督徒生活"],"tags":["父母","教育","處境化"],"sum":"主日學老師讓四歲小女孩背起裝滿神學院教科書的背包，她背不動而哭，老師說：我們背不動罪的重擔，但耶穌能為我們背。這畫面成了作者家教導福音的常用比喻。這一代孩子活在圖像世界，需要畫面幫助理解與記憶。作者讓孩子從地毯一邊跳到另一邊卻跳不過去，學到人人都虧缺神的榮耀；也畫窄路寬路、橫跨鴻溝的十字架。沒有一張圖能講全福音，每張都是一個側面，像切割精細的鑽石，合起來才顯出光芒；斯托得說這麼大的救恩需要好幾個畫面才能描摹，耶穌也用「天國好像……」講道。實際做法：讓孩子用金色蠟筆畫埋在地裡的寶藏；在鏡子上用白板筆畫一個自己和代表罪的污點，再擦掉；畫幾格漫畫，從站在屋外到被父親迎進家門。用多個畫面講福音，能為純正教義打地基。重要的不是畫得好，而是好消息本身。","pts":["背不動的背包象徵罪的重擔","孩子需要畫面來理解福音","跳不過的地毯教導人虧缺神的榮耀","沒有一張圖能講全福音","每個畫面呈現福音的一個側面","耶穌也用許多比喻描繪天國","用蠟筆、白板筆、漫畫來畫福音","多面呈現為純正教義打地基","真正動人的是好消息，不是畫技"],"mm":{"c":"一口一口吃福音","b":[["背包比喻",["背不動","耶穌背負"]],["為何用圖",["圖像世代","幫助記憶"]],["多個側面",["鑽石切面","斯托得","天國好像"]],["實作",["地毯跳躍","寶藏畫","鏡上污點","漫畫回家"]],["目的",["純正教義","每天一點點"]]]},"fw":[["故事","背不動的背包"],["原理","一圖勝千言"],["方法","福音的不同側面"],["實作","用簡筆畫講救恩"],["鼓勵","把福音秀出來"]],"q":["我們背不動罪的重擔，但耶穌可以為我們背負。","沒有一張圖能把福音全講清楚，每張都是一個側面。","真正動人的是好消息，不是你畫得好不好。"],"fb":{"h":"孩子背不動的，\n耶穌替他背。","t":"主日學裡，一個四歲的小女孩被請上台。\n老師遞給她一個背包，裡面塞滿了神學院的厚重教科書。\n「請把它背到教室另一頭。」\n她用盡全身力氣，背包紋絲不動。\n眼淚掉下來，她說：「我做不到。」\n\n老師蹲下來，輕輕說：\n「對，我們都背不動罪的重擔。\n但耶穌可以替我們背。」\n\n這一幕，比十篇講章更深地留在孩子心裡。\n\n為什麼？\n因為人不只是用耳朵理解真理，\n也用眼睛、用雙手、用一個背不動的背包。\n\n我們常犯一個錯：\n想把整個福音，塞進一句話裡；\n想把無限的恩典，壓縮成一個定義。\n結果孩子記住了句子，卻沒看見畫面；\n背得出答案，卻摸不到盼望。\n\n其實，耶穌自己也不是這樣教的。\n祂說：天國好像藏在地裡的寶貝，\n又好像買賣人尋找好珠子，\n又好像撒在地裡的芥菜種。\n天國像這個，也像那個，還像那個。\n\n真理是一顆鑽石，\n每一個畫面只是一個切面；\n但切面越多，光芒越完整。\n\n所以你可以在家裡這樣做：\n讓孩子從地毯一邊跳到另一邊——跳不過去，\n告訴他：我們也達不到神的標準。\n拿出金色蠟筆，畫一個埋在地裡閃閃發亮的寶藏，\n告訴他：認識耶穌，比什麼都寶貴。\n在浴室鏡子上畫一個自己，再畫一塊污點，\n然後遞給他板擦，\n讓他親手體會：被潔淨是什麼感覺。\n\n或者畫四格漫畫：\n第一格，一個小孩站在屋外；\n最後一格，父親打開門，把他迎進家裡。\n\n你不必畫得好。\n孩子不會記得線條歪不歪，\n他會記得，那天爸媽陪他一起，\n把好消息畫了出來。\n\n福音不必一口吞下。\n一天一口，\n一口一個畫面，\n直到有一天，\n那些畫面在他心裡連成一片天空。\n\n#親子信仰 #兒童主日學 #福音 #家庭敬拜 #比喻"}},{"id":22513,"slug":"chaplains-professionals-shepherds-souls","title":"隨軍牧師：是心理諮詢師，還是靈魂的牧者？","date":"2026-05-07","author":"Timothy Mallard","cats":["信仰与工作"],"tags":["戰爭","靈魂","隨軍牧師"],"sum":"美國國防部長赫格賽斯史無前例地罷免陸軍牧師長，並廢除其主編的《屬靈健康指南》，理由是它宣揚世俗人文主義；他說隨軍牧師應是靈魂的牧者，不是心理疏導官。媒體多解讀為推動基督教傾向或政治化軍隊，作者（退役隨軍牧師）認為兩者都偏離重點：赫格賽斯真正抨擊的是軍方不再視軍人為擁有永恆靈魂、按神形像受造的人。這轉變有兩大歷史成因：1979年卡特科夫訴馬什案質疑牧師制度的合憲性，雖然軍方勝訴，牧師團卻為避險把重心幾乎全放在保障宗教自由，而非牧養靈魂；1980年代末起社會盲信臨床心理治療，軍方把心理健康與戰備掛鉤，屬靈健康被邊緣化，牧師淪為可有可無的配角。因此問題不只是改革牧師團，而是重塑整個軍事文化、重新定義軍人的生命與尊嚴。沙因指出文化變革需要長期而全面的計劃，這需要清晰路線圖與堅定執行。","pts":["國防部長罷免陸軍牧師長","他主張牧師是靈魂的牧者，不是心理輔導","媒體的兩種解讀都偏離重點","核心問題是軍人有沒有靈魂","1979年訴訟後牧師團轉向只保障宗教自由","臨床心理學取代屬靈關懷","心理健康與戰備掛鉤，牧師被邊緣化","真正的挑戰是重塑軍事文化","文化變革需要長期而全面的計劃"],"mm":{"c":"隨軍牧師的定位","b":[["事件",["罷免牧師長","廢除指南","讓牧師團重現榮光"]],["兩種解讀",["基督教傾向","政治化"]],["真正重點",["軍人有靈魂","神的形像"]],["歷史成因",["卡特科夫訴馬什案","心理治療文化"]],["後果",["牧師邊緣化","屬靈健康被排擠"]],["變革",["重塑文化","沙因","需要長期執行"]]]},"fw":[["事件","國防部長的決定"],["輿論","兩種解讀"],["重點","靈魂的牧養"],["歷史","從牧者到心理輔導員"],["現況","從輔導員到配角"],["挑戰","變革的時刻"]],"q":["隨軍牧師就是隨軍牧師，不是心理疏導官。","問題不在牧師團本身，而在是否視軍人為有永恆價值的人。","文化是長年累月形成的，必須持之以恆才能扭轉。"],"fb":{"h":"軍人的戰備清單上，\n有沒有「靈魂」這一欄？","t":"一位將軍被罷免了。\n理由不是貪腐，不是失職，\n而是一本手冊——國防部長認為，它把「信仰與美德」換成了「自我關懷與心理自助」。\n他說：隨軍牧師就是牧師，不是心理疏導官。\n\n新聞很快吵成兩派：\n一派說這是宗教擴張，\n一派說這是政治介入。\n但一位退役隨軍牧師提醒我們，真正的問題更深：\n軍人，到底有沒有靈魂？\n\n這是一個哲學命題，也是一個國家命題。\n如果人只是會流血、會疲倦、會崩潰的身體，\n那麼心理學就足夠了；\n但如果人是按神形像所造、擁有永恆價值的存在，\n那麼戰場上最深的傷，可能不在肉體，也不在情緒，\n而在靈魂。\n\n歷史是怎麼走到這一步的？\n一場官司質疑隨軍牧師的合憲性，\n軍方贏了，牧師團卻怕了；\n他們退守到「保障宗教自由」的安全線，\n漸漸忘了「牧養靈魂」的呼召。\n接著，臨床心理學成了戰備的指標，\n屬靈關懷成了可有可無的附註。\n\n於是出現一個奇怪的對比：\n我們越來越會處理壓力，\n卻越來越不會處理罪疚；\n越來越會談創傷，\n卻越來越不會談饒恕；\n越來越會管理情緒，\n卻越來越不敢問：人為何而活，又為何而死？\n\n你能用量表測出一個士兵的焦慮指數，\n卻測不出他扣下扳機後，夜裡為何睡不著。\n\n認知翻轉在這裡：\n問題不只是牧師的定位，\n而是整個文化如何看待「人」。\n把人看成機器，就只需要保養；\n把人看成靈魂，才需要牧者。\n\n當然，文化不是一紙命令能改的。\n它像河床，是幾十年流水慢慢刻出來的；\n要改道，也需要幾十年的堅持。\n\n但至少，這場爭論讓我們重新聽見那個古老的提問——\n不只是對軍人，也是對我們每一個人：\n當一切都被量化之後，\n誰來照看那無法量化的部分？\n\n槍聲停歇的夜裡，\n有一種傷，只能由靈魂的牧者\n輕輕包紮。\n\n#隨軍牧師 #靈魂 #神的形像 #心理與信仰 #時事"}},{"id":22511,"slug":"announcement-from-tgc-allberry","title":"山姆·奧伯利辭去在教會和凱勒中心的職務","date":"2026-05-07","author":"TGC","cats":["社会与时事"],"tags":["跌倒","犯罪","辭職"],"sum":"福音聯盟宣布：山姆·奧伯利於5月2日告知機構，他幾年前曾與另一名男性有不恰當的關係，並於5月3日向以馬內利教會辭去牧師職務，隨後也辭去凱勒文化護教中心研究員一職。依照福音聯盟的政策與程序，機構已立即著手從網站及其他內容渠道移除他的所有內容，並刻意延後發布此聲明，直到教會會眾先得知此事。福音聯盟表示對此深感痛心，並將持續為奧伯利、以馬內利教會以及所有受影響的人禱告。","pts":["奧伯利承認數年前有不恰當的關係","他辭去以馬內利教會牧師職務","也辭去凱勒中心研究員職務","福音聯盟依政策移除他的所有內容","聲明延後發布，讓教會會眾先知道","福音聯盟表示痛心","呼籲為所有受影響的人禱告"],"mm":{"c":"奧伯利辭職聲明","b":[["事件",["不恰當的關係","主動告知"]],["辭職",["以馬內利教會","凱勒中心"]],["處理",["移除內容","依照政策"]],["程序",["先告知會眾","延後聲明"]],["回應",["痛心","持續禱告"]]]},"fw":[["告知","5月2日主動說明"],["辭職","教會與機構職務"],["處理","依政策移除內容"],["程序","尊重會眾先知"],["回應","痛心與禱告"]],"q":["這一消息令我們痛心不已。","我們將繼續為所有受此影響的人禱告。","依照政策與程序，處理應當清楚而迅速。"],"fb":{"h":"跌倒的消息令人心碎，\n但光仍要照進來。","t":"一則簡短的聲明，讓許多人沉默了很久。\n一位深受敬重的牧者、作者、護教者，\n主動承認數年前曾有一段不恰當的關係，\n並辭去教會與機構的職務。\n機構依照政策移除了他的所有內容，\n並刻意等教會會眾先知道，才對外發布。\n\n這樣的消息，總會引來兩種反應：\n一種是震驚之後的憤怒——怎麼又是他？\n一種是失望之後的冷漠——果然，誰都靠不住。\n\n但或許，我們可以停下來，問三個問題。\n\n第一，我們信的到底是誰？\n如果我的信心建立在某位講員身上，\n那麼他倒下時，我的信心也跟著塌陷；\n如果我的信心建立在基督身上，\n那麼人的跌倒，只會讓我更看清：唯有祂不倒。\n\n第二，真相出來，是壞事還是好事？\n隱藏的罪像地底的裂縫，看不見，卻一直在擴大；\n說出來的罪像攤在陽光下的傷口，痛，卻開始能被醫治。\n黑暗裡沒有醫治，光裡才有。\n\n第三，處理的方式，是否也在作見證？\n不掩蓋、不拖延、不搶在會眾之前張揚，\n先顧及群羊，再面對公眾——\n這樣的程序本身，就是對羊群的尊重。\n\n這裡有一個翻轉：\n我們常以為，教會的見證取決於領袖從不跌倒；\n其實，教會的見證更取決於——\n當領袖跌倒時，群體如何誠實、如何悲傷、如何禱告。\n\n我們不必幸災樂禍，\n也不必假裝無事；\n不必急著定論，\n也不必閉口不言。\n我們可以為當事人禱告，求真實的悔改；\n為受傷的人禱告，求安慰與醫治；\n為教會禱告，求在破碎中仍然站穩；\n也為自己禱告——因為站著的人，要謹慎，免得跌倒。\n\n人會倒下，\n講台會空出，\n書會下架，\n但那位召我們的主，從不改變。\n\n在這樣的日子裡，\n讓我們把眼睛從人身上移開，\n抬頭——\n那光，仍然在。\n\n#禱告 #教會 #悔改 #謙卑 #屬靈領袖"}},{"id":22510,"slug":"challenges-facing-protestant-church-part-2","title":"新教教會面臨的挑戰（第二部分）","date":"2026-05-06","author":"Jared C. Wilsonã€Brett McCrackenã€Gavin Ortlundã€Brad Edwards","cats":["圣经与神学"],"tags":["問答","訪談","挑戰","播客"],"sum":"這是福音聯盟座談的第二部分，由麥克拉肯主持，威爾遜、奧特倫德、愛德華茲對談新教教會的挑戰。威爾遜談福音被「壁紙化」：第二代把福音視為理所當然，解藥沒有新招，就是在講台、門訓與彼此相交中不斷提醒——朋霍費爾說基督徒相遇就是互相帶來福音。奧特倫德回應想轉投天主教、渴望深度與美的年輕人：尊重問題、不懂就說不知道，並帶人挖掘新教傳統的深度；面對新教分裂的批評，要正視並以對教會的愛追求合一（約17）。愛德華茲以新郎新娘比喻回應「愛耶穌但不愛教會」的人：不愛祂的新娘，真的認識祂的愛嗎？兩人也談受害者心態：「教會沒有傷害我，是那五個人傷害了我」；在後體制社會，同情心成了唯一的道德權威，可能讓受害者困在受害中。他們都觀察到年輕人回流、帶父母來教會的跡象。最後分享靈修：不戴耳機散步禱告、安息在基督的愛中、植堂牧者也需要被牧養。","pts":["福音容易被「壁紙化」，成為理所當然","我們都健忘，需要彼此提醒福音","年輕人渴望深度，新教傳統其實深厚","不知道答案時，坦然說不知道","面對分裂的批評，要以愛追求合一","不愛基督的新娘，難以真正認識祂的愛","不要讓受害定義身份","同情心被當成獲取權力的工具","年輕人正在回到教會","牧者自己也需要被牧養"],"mm":{"c":"新教教會的挑戰（下）","b":[["福音壁紙化",["第二代理所當然","彼此提醒","朋霍費爾"]],["渴望深度",["轉投天主教","新教的美","說不知道"]],["合一",["分裂批評","約17","愛教會"]],["反體制",["愛耶穌不愛教會","新郎新娘"]],["受害者心態",["五個人傷害我","同情即權力"]],["氛圍轉變",["年輕人回流","帶父母來"]],["靈修",["散步禱告","安息基督","被牧養"]]]},"fw":[["議題一","福音壁紙化"],["議題二","渴望深度的年輕人"],["議題三","不愛教會的信徒"],["議題四","新教的分裂"],["議題五","受害者心態"],["觀察","復興的跡象"],["個人","牧者的靈修"],["結語","以禱告結束"]],"q":["基督徒相遇，就是互相給對方帶來福音。","教會沒有傷害我，是那五個人傷害了我。","禱告代表了福音的基本姿態：我們除了需要，一無所有。"],"fb":{"h":"福音不是牆上的壁紙，\n是每天都要重新聽見的好消息。","t":"有一個殘酷的定律：\n第一代人為福音流淚，\n第二代人把福音當理所當然，\n第三代人開始問：福音到底是什麼？\n\n福音就這樣被「壁紙化」了——\n它一直在牆上，\n我們卻已經很久沒有停下來看它。\n\n為什麼會這樣？\n因為人是健忘的。\n我們每天醒來，不會自動對準十字架；\n我們會自動對準手機、待辦事項、焦慮和比較。\n\n所以，解藥從來不是什麼新發明，\n而是一個古老的動作：提醒。\n在講台上提醒，\n在門訓裡提醒，\n在餐桌旁、在咖啡店、在一通深夜的電話裡，\n彼此提醒。\n朋霍費爾說：基督徒相遇，就是互相把福音帶給對方。\n\n這場對談裡，還有三個扎心的提問。\n\n有年輕人說：新教太淺，我要去找有深度、有美感的傳統。\n回答是：別急著離開，先往下挖——\n新教的井，比你以為的深得多。\n\n有人說：我愛耶穌，但不愛教會。\n回答是一個比喻：\n如果你想跟我做朋友，卻要求我太太永遠不在場，\n你真的懂我嗎？\n不愛新娘的人，很難明白新郎的愛。\n\n有人說：我在教會受過傷。\n一位受傷的人這樣回答：\n「傷害我的不是教會，是那五個人。」\n這句話不否認傷口，\n卻拒絕讓傷口成為身份。\n\n這裡有一個翻轉：\n我們以為復興需要更新的方法，\n其實復興常常從更舊的真理開始；\n我們以為牧者是給予的人，\n其實牧者也是需要被牧養的羊。\n\n一位植堂牧師說，他找了三個人每兩週一起禱告。\n不是為了教他們，\n而是因為：「我很孤單，我需要你們幫我重新發現耶穌。」\n\n禱告，是福音最基本的姿態——\n我們是罪人，\n除了需要，一無所有。\n\n所以今天，\n別只是路過那面牆。\n停下來，\n再讀一次那個老故事：\n祂為你死，為你活，\n此刻仍為你代求。\n\n#福音 #教會 #合一 #禱告 #新教"}},{"id":22508,"slug":"hidden-resentment","title":"隱藏的怨恨","date":"2026-05-05","author":"Victor S","cats":["基督徒生活"],"tags":["愛","怨恨","坦誠"],"sum":"利未記19:17–18說「不可心裡恨你的弟兄；總要指摘你的鄰舍，免得因他擔罪……卻要愛人如己」。作者從中歸納五點：一、隱藏的怨恨是危險的種子——表面和平，心裡卻埋下苦毒；耶穌說向弟兄動怒與殺人本質相同。二、隱藏的怨恨終必顯露——像地下的火會爆發；「不可含怒到日落」，否則給魔鬼留地步。三、神設立的道路是當面指正——不是挑剔，而是坦誠及時地溝通，讓對方有機會悔改，也讓怨恨在萌芽時處理；太18:15教導先私下指出。四、隱藏怨恨的人自己受虧損——怨恨本身是罪，像牆隔在人與神之間，攔阻禱告與敬拜，所以要先去與弟兄和好再獻禮物。五、從怨恨到愛——神的次序是先處理怨恨、再坦誠溝通，才能不報仇、愛人如己。在日落之前，讓心重歸自由。","pts":["隱藏的怨恨是危險的種子","在神眼中，心中怨恨與殺人本質相同","怨恨不會消失，終必爆發","不可含怒到日落","要及時、坦誠、當面地溝通","先私下指出，不要宣揚或悶著","怨恨本身就是罪，攔阻人與神","先與弟兄和好，再來獻禮物","處理怨恨後，愛才能生長"],"mm":{"c":"隱藏的怨恨","b":[["經文",["利19:17–18"]],["危險種子",["表面和平","心中苦毒","太5:21–22"]],["終必顯露",["地下的火","弗4:26–27"]],["當面指正",["坦誠溝通","太18:15"]],["自己受虧損",["怨恨是罪","太5:23–24"]],["從怨恨到愛",["不報仇","愛人如己"]]]},"fw":[["經文","利未記19章"],["一","危險的種子"],["二","終必顯露"],["三","當面指正"],["四","自己受虧損"],["五","從怨恨到愛"],["應用","日落之前"]],"q":["怨恨若藏在心裡，不會消失，反而在暗中生長。","不可含怒到日落，不要背負怨恨的重擔過夜。","怨恨若不被處理，愛就不可能真正活出來。"],"fb":{"h":"藏在心裡的怨恨，\n不會消失，只會發芽。","t":"有一種傷人，是沒有聲音的。\n表面上，我們照樣打招呼、一起聚會、同桌吃飯；\n心裡，卻默默記下一筆又一筆。\n「算了，不說了。」\n可是，真的算了嗎？\n\n三千多年前，神就對祂的百姓說：\n不可心裡恨你的弟兄；\n總要指摘你的鄰舍，免得因他擔罪；\n不可報仇，也不可埋怨，卻要愛人如己。\n\n這段話裡，藏著一個深刻的命題：\n沉默，不一定是寬容；\n有時，沉默只是怨恨換了一件外衣。\n\n怨恨像一粒種子。\n今天埋下，看不見；\n明天澆水，還看不見；\n直到某一天，一句小事、一個眼神，\n它就破土而出，長成一棵帶刺的樹。\n\n怨恨像地底的火。\n你以為它熄了，\n它只是在暗處蔓延，\n等待一個出口。\n\n怨恨像一堵牆。\n它不只隔開你和那個人，\n也隔開你和神——\n禱告變得乾澀，敬拜變得勉強，\n因為心裡有一個角落，你不願讓光照進去。\n\n所以耶穌說：\n你在祭壇前獻禮物時，若想起弟兄向你懷怨，\n先放下禮物，去和好。\n神寧可你的祭物晚一點，\n也不要你的心一直卡著。\n\n這裡有一個翻轉：\n我們以為不說出來，是保護關係；\n其實說出來，才是保護關係。\n我們以為忍下來，是愛；\n其實真正的愛，是願意坦誠地去談。\n\n不是指責，不是翻舊帳，\n也不是在背後跟別人訴苦；\n而是私下、及時、帶著恩典地說：\n「這件事讓我受傷了，我們可以聊聊嗎？」\n\n先處理怨恨，\n再坦誠溝通，\n然後，愛才有地方生長。\n\n保羅說：不可含怒到日落。\n這不是一條冷冰冰的規矩，\n而是一份溫柔的恩典——\n神不要你背著怨恨過夜。\n\n今天，如果你心裡還壓著誰的名字，\n趁太陽還沒下山，\n鼓起勇氣，\n把那扇門打開。\n\n夕陽落下之前，\n願你的心，\n比天色先亮起來。\n\n#怨恨 #饒恕 #和好 #利未記 #愛人如己"}},{"id":22502,"slug":"pastor-moral-failure-character","title":"恩賜是光環，品格是基石：重新審視教牧領袖的道德危機","date":"2026-05-04","author":"Dan Doriani","cats":["教会事工"],"tags":["謙卑","領導力","恩賜","道德","領袖","品格","溫柔","屬靈虐待"],"sum":"教牧領袖的道德跌倒不只發生在名牧，也涉及濫權、性醜聞、挪用公款、剽竊，甚至自殺。作者檢視四種解釋：一、媒體放大——媒體確實偏愛醜聞，但問題真實存在，聖經也坦白記載領袖的罪；二、教會吸引自戀者——宗教地位確實可能吸引追求權力的人，但許多牧者其實滿懷自我懷疑、起初不願受召，且一定程度的「健康自信」是承擔講台壓力所需；三、教會重才幹輕品格——提前3章列出11項品格卻只有2項技能，與聖靈果子相應；提前4章則要求品格與能力並進；四、教會未能持續關懷，牧者在攻擊中變得剛硬，或在成功中被縱容——作者自述年輕時打籃球對裁判大吼被執事責備，但若教會變大，可能就沒人敢說了；送餐、升級酒店等小特權也會讓人漸漸理所當然。建議：為候選人安排導師，考察是否守信、制怒、不貪財、會和好、能休息；牧者需要能溫柔糾正他的朋友，教會也要保護牧者免受無理攻擊，並有先知敢說皇帝沒穿衣服。","pts":["道德跌倒在各類教會都會發生","媒體會放大，但問題真實存在","聖經坦白記載領袖的罪","宗教地位可能吸引權力慾強的人","許多牧者其實滿懷自我懷疑","提前3章強調品格多於技能","要培養德才兼備的領袖","成功會遮蔽人的判斷力","小特權會漸漸變成理所當然","牧者需要導師與能溫柔糾正他的朋友"],"mm":{"c":"恩賜是光環，品格是基石","b":[["現象",["濫權","性醜聞","挪用","自殺"]],["解釋一",["媒體放大","但問題真實"]],["解釋二",["自戀與權力","健康自信","自我懷疑"]],["解釋三",["重才輕德","提前3章","聖靈果子"]],["解釋四",["缺乏持續關懷","剛硬","特權"]],["建議",["導師","溫柔糾正的朋友","說真話的先知"]]]},"fw":[["問題","領袖頻頻跌倒"],["解釋一","媒體放大？"],["解釋二","吸引自戀者？"],["解釋三","重技能輕品格"],["解釋四","缺乏持續的關懷與問責"],["案例","籃球場上的牧師"],["建議","培育敬虔的領袖"]],"q":["道德的敗壞，皆源於愛的錯位。","恩賜能讓人迅速登頂，缺陷也能讓人瞬間崩塌。","在場上你是球員，但你永遠是我們的牧師。"],"fb":{"h":"恩賜能讓人登上高處，\n只有品格能讓人站得住。","t":"為什麼總有屬靈領袖跌倒？\n每一次新聞出來，我們都在問；\n每一次問完，又很快忘記。\n\n有人說：是媒體放大了。\n是的，媒體偏愛醜聞，\n但若醜聞是真的，就不能怪鏡子。\n\n有人說：教會吸引了自戀的人。\n或許有一些；\n但更多牧者其實在每個週六夜裡失眠，\n懷疑自己：誰會想聽我講道？\n\n真正扎心的，是另外兩個原因。\n\n第一，我們看重才幹，勝過品格。\n保羅描寫監督時，列了十一項品格，只提了兩項技能。\n可是當教會在找牧師時，\n我們問的是：他會不會講？能不能帶增長？\n很少問：他守信嗎？能控制脾氣嗎？\n吵架之後，會不會主動和好？\n他有朋友嗎？他會休息嗎？\n\n第二，我們沒有陪他們走到最後。\n有些牧者在攻擊裡變得剛硬，\n剛硬久了，就變成苛刻；\n有些牧者在成功裡被寵壞，\n寵久了，就忘了自己也是羊。\n\n一位牧師分享過一個故事：\n年輕時打球，他對裁判大吼，\n一位老執事立刻說：「你不能這樣。」\n「可是在場上我是球員！」\n「是的，但你永遠是我們的牧師。」\n\n然後他問了一個讓人背脊發涼的問題：\n如果十年後，教會變大了，\n還會有人敢這樣對他說嗎？\n\n這就是認知的翻轉——\n危險往往不是從大罪開始，\n而是從小特權開始：\n一份送到辦公室的午餐，\n一間升級的飯店房間，\n一句「你那麼辛苦，這是應該的」。\n起初是感謝，後來是習慣，最後是要求。\n\n恩賜像光環，閃亮，卻會褪色；\n品格像基石，沉默，卻承載一切。\n光環讓人仰望，\n基石讓人安心。\n\n所以，教會需要的不只是更好的講員，\n而是更真實的朋友——\n能溫柔糾正他，\n也能保護他免於無理的攻擊；\n能說「皇帝沒穿衣服」，\n也能陪他重新穿上謙卑。\n\n願每一位站上講台的人，\n在掌聲裡仍記得：\n比講台更高的，\n是那位曾經彎腰洗腳的主。\n\n#品格 #屬靈領袖 #牧者 #問責 #謙卑"}},{"id":22500,"slug":"is-it-reliable-to-use-peace-of-mind-to-make-decisions","title":"用「心裡平安」來作決定，靠譜嗎？","date":"2026-05-03","author":"Victor S","cats":["基督徒生活"],"tags":["良心","基督的平安","虛假的平安"],"sum":"基督徒常說「禱告後心裡平安，所以決定這樣做」。作者檢視這做法：核心經文西3:15「讓基督的平安在你們心裡作主」，「作主」原意是裁判；其上下文是信徒彼此包容饒恕，所以首要應用是在肢體摩擦時讓基督的平安而非血氣來仲裁。把平安擴展為一切決策的依據需要謹慎，因為人心詭詐，恐懼懶惰會帶來不平安，自欺與麻木也會帶來假平安。作者提出框架：人際衝突、饒恕、合一上，平安是仲裁者；職業、婚姻等重大決定上，平安只是參考指標之一，需與聖經、屬靈智慧、環境、肢體勸戒並用；道德問題上，不平安是警報，但「有平安」未必可靠；無對錯的偏好可憑平安自由而行。最危險的是良心麻木——如被熱鐵烙慣，持續犯罪仍覺平安，就像發燒的人不再覺得熱。分辨時可問：這不平安是聖靈責備還是焦慮？是不合神心意還是怕走出舒適圈？放在聖經與肢體中檢驗結果如何？真平安總與聖潔相伴。","pts":["西3:15的「作主」意為裁判","上下文是信徒彼此的關係","人心詭詐，平安感可能是假的","人際衝突中，平安是仲裁者","重大決定中，平安只是參考之一","道德問題上，不平安是警報","良心麻木會帶來虛假的平安","要分辨聖靈責備與一般焦慮","平安必須經聖經與肢體檢驗","真平安總是與聖潔相伴"],"mm":{"c":"憑平安作決定？","b":[["經文",["西3:15","作主＝裁判","三明治結構"]],["適用範圍",["人際關係","重大決策","道德問題","個人偏好"]],["危險",["人心詭詐","良心麻木","熱鐵烙慣"]],["分辨不平安",["聖靈或焦慮","不合神心或怕改變","經文與肢體"]],["分辨有平安",["良心敏銳嗎","引向聖潔嗎"]],["結論",["報警器","非唯一標準"]]]},"fw":[["問題","平安能作為依據嗎"],["經文","西3:15的上下文"],["範圍","四種情境"],["危險","良心麻木"],["分辨","真平安與假平安"],["結論","重要但非唯一"]],"q":["心裡平安是重要的報警器，卻不能作為唯一標準。","用失靈的警報器守護安全，後果不堪設想。","真平安總是與聖潔相伴，不會引人安臥在罪中。"],"fb":{"h":"「我心裡很平安」，\n就代表這是神的旨意嗎？","t":"「我禱告之後很平安，所以就決定了。」\n「我心裡沒有平安，可能不是神的旨意。」\n這兩句話，你一定聽過，也可能說過。\n\n但請誠實地想一想：\n平安，真的這麼可靠嗎？\n\n人心是一座奇怪的天平。\n有時候，恐懼會讓它失去平衡，\n明明是神的呼召，我們卻因為害怕而「沒有平安」；\n有時候，麻木會讓它停止擺動，\n明明走在錯路上，我們卻「很平安」。\n\n聖經說：人心比萬物都詭詐。\n所以，最危險的也許不是沒有平安，\n而是假的平安。\n\n保羅確實說過：要讓基督的平安在你們心裡作主。\n「作主」的原文，是裁判。\n但請注意上下文——\n他談的是肢體之間的包容、饒恕與合一。\n當你和弟兄起了衝突，\n不要讓自尊、血氣、舊傷來吹哨，\n讓基督的平安來判決你的反應。\n\n那麼，面對人生的大選擇呢？\n換工作、搬家、結婚？\n平安可以是一個訊號，\n卻不該是唯一的訊號。\n它要和聖經的教導、成熟的勸戒、環境的印證一起被檢驗。\n\n面對道德的事呢？\n不平安常常是警報，要停下來省察；\n但「很平安」不一定是綠燈——\n因為良心可能早已麻木。\n\n保羅形容那種良心：像被熱鐵烙慣了。\n被燙過太多次的皮膚，不再覺得痛；\n發燒太久的人，不再覺得熱。\n那不是痊癒，\n是感覺系統壞了。\n\n這是一個認知翻轉：\n我們以為平安是指南針，\n其實它更像警報器；\n指南針告訴你往哪走，\n警報器只提醒你哪裡可能出事。\n而一個壞掉的警報器，比沒有警報器更危險。\n\n所以，在問「我有沒有平安」之前，\n先問：我的良心還敏銳嗎？\n這份不平安，是聖靈的責備，還是我的膽怯？\n這份平安，是引我走向順服，還是讓我在罪中安睡？\n\n真正的平安，\n不是情緒的平靜，\n而是與神對齊之後的和諧。\n它總是與聖潔同行，\n從不帶人躺在罪中。\n\n願你的心，\n不只是安靜，\n更是被真理校準過的安靜。\n\n#平安 #神的旨意 #良心 #分辨 #歌羅西書"}},{"id":22498,"slug":"working-together-one-work-trinity","title":"一起合作，還是同一個作爲？","date":"2026-05-02","author":"Matt Emerson","cats":["圣经与神学","卡森神学更新中心"],"tags":["神學","三位一體","三一論","卡森中心"],"sum":"作者以多功能工具比喻一種常見錯誤：把聖父、聖子、聖靈看成三個各有專長的獨立行動者，彼此分工合作完成救恩工程。這其實滑向「三神論」，忽略了「不可分割的運作」教義：三一神的外在作為都是同一位神——父、子、聖靈——的同一個作為，不能只歸給某一位而排除其他位格。以十字架為例：是誰差遣耶穌上十字架？聖父（太26:39、賽53:10、徒2:23）；聖子也差遣自己，「是我自己捨的」（約10:17–18）；聖靈也參與，耶穌「藉著永遠的靈」獻上自己（來9:14）。這不是三位做不同的事一起朝同一目標前進，而是一位神的一個作為。創造、護理、啟示、救恩、審判皆然。這很重要，因為關乎神是誰：因祂是一，祂的作為也是一，我們單單敬拜祂。","pts":["不要把三一神想成多功能工具","三位格不是三個分工合作的行動者","這種想法會滑向三神論","不可分割的運作：神的外在作為是一","任何作為都不能只歸給一位位格","聖父差遣耶穌上十字架","聖子也差遣自己捨命","聖靈也參與了十字架的獻上","神的一切作為都是同一位神的同一作為"],"mm":{"c":"三一神的一體作為","b":[["錯誤",["多功能工具","分工合作","三神論"]],["正統教義",["不可分割的運作","外在作為是一"]],["十字架",["父差遣","子自己捨命","藉永遠的靈"]],["延伸",["創造","護理","救恩","審判"]],["意義",["關乎神是誰","單單敬拜祂"]]]},"fw":[["比喻","多功能工具"],["錯誤","神聖多功能工具謬誤"],["教義","不可分割的運作"],["例證","誰差遣耶穌上十字架"],["結論","同一個作為，同一位神"]],"q":["三一神不是在一起合作，而是以同一個作為行動。","因為祂是一體的，所以祂的作為也是一體的。","任何關乎神身份的事情都很重要。"],"fb":{"h":"三位一體，\n不是三人小組。","t":"你的口袋裡有一把多功能工具。\n要用刀，就打開刀；要用十字起子，就打開十字起子；\n用完，收回去，再換下一個。\n\n很方便，對吧？\n可是我們常常不知不覺，用這種方式想像神。\n\n聖父負責計劃，\n聖子負責執行，\n聖靈偶爾出場幫個忙。\n三位各有專長，分工合作，最後一起打敗罪與撒但。\n\n聽起來很合理，甚至很溫馨——\n一個完美的團隊，一場和諧的合作。\n但這裡藏著一個古老的危險：\n如果三位是三個各自行動的個體，\n那我們敬拜的，究竟是一位神，還是三位神？\n\n教會兩千年來給出的答案，是一個不太為人熟知的教義：\n「不可分割的運作」。\n意思是：神的一切外在作為，都是同一位神——聖父、聖子、聖靈——的同一個作為。\n不是三個人做三件事，\n而是一位神做一件事。\n\n就拿十字架來說。\n是誰差遣耶穌上十字架？\n你會說：是聖父。沒錯，「耶和華定意將祂壓傷」。\n但耶穌自己也說：「沒有人奪我的命去，是我自己捨的。」\n希伯來書又說：祂是「藉著永遠的靈」把自己獻給神。\n\n父差遣，\n子捨己，\n靈獻上——\n這不是三個動作拼在一起，\n而是同一個愛，同一個旨意，同一個作為。\n\n這裡有一個認知翻轉：\n我們以為「合作」已經是最高的合一，\n其實在神那裡，比合作更深的，是本質的同一。\n人與人最好的關係，是同心協力；\n神自己的生命，卻是一心一意到連「協」都不需要。\n\n這為什麼重要？\n因為關乎你在禱告時面對的是誰。\n你不是在跟一個委員會說話，\n不必擔心哪一位比較好說話、哪一位比較嚴厲；\n你來到的，是那位完全合一、永不分裂的神。\n\n創造是祂的作為，\n護理是祂的作為，\n救恩是祂的作為，\n將來的審判與更新，也是祂的作為。\n從起初到末了，\n沒有一刻，父、子、聖靈各忙各的。\n\n我們的世界越來越分裂，\n連最親的人都可能各行其是。\n但在這一切之上，\n有一位神，祂的愛從不分工，\n祂的心從不分開。\n\n所以，敬拜吧——\n不是向一個團隊鼓掌，\n而是向那獨一的神，\n俯伏。\n\n#三位一體 #神學 #十字架 #敬拜 #教義"}},{"id":22496,"slug":"rethinking-contact-evangelism-from-colossians","title":"從《歌羅西書》4:5-6 再思「接觸式佈道」","date":"2026-05-01","author":"Victor S","cats":["教会事工"],"tags":["歌羅西書","佈道","接觸式佈道"],"sum":"作者曾受教會植堂運動影響，傳福音時總有異常的緊迫感，覺得沒講完福音核心就是不忠心，卻常忽略對方的狀態。這種模式稱為「接觸式佈道」，在飛機、排隊、計程車等短暫場合幾乎是唯一方式；另一種是長期建立關係的「關係式佈道」，兩者互補。西4:5–6提供共同原則：一、愛惜光陰——原文是「贖回時機（kairos）」，不是填滿每一分鐘，而是分辨對方的心是否敞開、此刻適合說多少；二、用智慧與外人交往——智慧藏在基督裡，因人而異、因時制宜、目標是引人歸向基督，拒絕一刀切的話術；三、言語帶著恩典、用鹽調和——讓人願意聽、不妥協真理、分寸適中；「回答各人」顯示傳福音是對話而非獨白。上下文4:2–4更強調禱告：保羅求的是「神開門」。結論是可以勇敢抓住短暫機會，但要帶智慧與恩典；使人得救的不是講得完整，而是神的主權與恩典。","pts":["沒講完福音就覺得不忠心，是一種焦慮","接觸式佈道在短暫場合很有價值","關係式佈道同樣合乎聖經，兩者互補","愛惜光陰是贖回神所預備的時機","先分辨對方的狀態再開口","智慧因人而異、因時制宜","言語要帶著恩典，像用鹽調和","傳福音是對話，不是獨白","真正開門的是神"],"mm":{"c":"再思接觸式佈道","b":[["兩種佈道",["接觸式","關係式","互補"]],["愛惜光陰",["kairos","分辨時機"]],["用智慧",["基督裡的智慧","不一刀切"]],["帶著恩典",["用鹽調和","對話非獨白"]],["上下文",["恆切禱告","求神開門"]],["結論",["放下焦慮","神的主權"]]]},"fw":[["反思","過去的緊迫感"],["定義","接觸式與關係式"],["一","愛惜光陰"],["二","用智慧交往"],["三","言語帶著恩典"],["四","在上下文中看"],["評估","平衡的結論"]],"q":["使人得救的不是我們傳講得多完整，而是神的主權與恩典。","愛惜光陰的第一步未必是急於開口，而是分辨。","即使只有兩分鐘，帶著恩典的話也讓人感到被尊重。"],"fb":{"h":"傳福音最怕的不是沒講完，\n而是沒聽見對方。","t":"飛機上，你身邊坐著一位陌生人。\n你心裡開始倒數：十二小時的航程，我一定要把福音講完。\n罪、十字架、復活、悔改、信靠——一個都不能漏。\n要是沒講完，就是對主不忠心。\n\n很多熱心的基督徒，都背過這樣的重擔。\n它出於愛，卻也可能讓我們看不見眼前那個人。\n\n保羅在歌羅西書留下兩節很短的經文：\n「你們要愛惜光陰，用智慧與外人交往。\n你們的言語要常常帶著和氣，好像用鹽調和，\n就可知道該怎樣回答各人。」\n\n短短幾句，卻有三層深意。\n\n第一層，愛惜光陰。\n原文的意思是「把時機贖回來」。\n不是要你填滿每一分鐘，\n而是要你認出那一刻——神預備好的那一刻。\n有時該說，有時該聽；\n有時講一整段福音，有時只說一句「我為你禱告」。\n\n第二層，用智慧。\n這智慧不是話術，不是一套背熟的講稿，\n而是藏在基督裡的智慧：\n因人而異，因時制宜，\n目標不是贏得辯論，而是把人引向基督。\n\n第三層，言語帶著恩典，用鹽調和。\n鹽讓食物有味道——恩典讓人願意聽下去；\n鹽能防腐——恩典不等於妥協真理；\n鹽要適量——分寸，本身就是愛。\n\n請注意最後那個詞：「回答」。\n不是「演講」，是「回答」。\n傳福音，本來就是一場對話，不是一場獨白。\n你得先聽見對方在問什麼、痛什麼、抗拒什麼，\n才知道怎麼回應。\n\n這裡有一個認知翻轉：\n我們以為忠心就是把話說完，\n其實忠心可能是把心打開；\n我們以為時間短就只能快講，\n其實兩分鐘的尊重，可能比兩小時的講解更有力。\n\n而在這一切之前，保羅還說了一句：\n「要恆切禱告，求神給我們開傳道的門。」\n他沒有求「給我勇氣推開門」，\n而是求「神來開門」。\n\n原來，真正打開人心的，\n不是我們講得多完整，\n而是神自己的主權與恩典。\n\n所以，下次坐在陌生人旁邊，\n先別急著倒數。\n先問一句：「你好嗎？」\n然後，安靜地聽。\n\n也許，福音最美的開場白，\n就是你願意先成為一個\n聆聽的人。\n\n#傳福音 #歌羅西書 #智慧 #恩典 #聆聽"}},{"id":22493,"slug":"iran-leaders-praised-bible","title":"伊朗歷史上那些推崇聖經的君王","date":"2026-05-01","author":"Anthony S. G. Baldwin","cats":["圣经与神学"],"tags":["護理","中東","伊朗","聖經譯本"],"sum":"作者在梵蒂岡圖書館看到一份1740年代的波斯語四福音書譯本，背後藏著伊朗統治者推崇聖經的故事。納迪爾沙是伊朗史上最殘暴的君王之一，洗劫德里時屠殺兩萬平民，卻召集猶太教、天主教與亞美尼亞學者翻譯舊新約；宣教士候見時眼看18人被勒死，結果國王不但接受譯本還重賞他們，開啟了第一次全本聖經波斯語翻譯。奢華的法特赫-阿里沙在位時，亨利·馬廷於1812年完成波斯語新約，未能親呈便在返英途中31歲去世；1814年英國大使代呈，國王回信讚賞譯文平易自然，並支持在各地分發，使19世紀宣教士得以自由分送上千本聖經。這呼應舊約中神使用波斯王：亞哈隨魯救猶太人、亞達薛西支持尼希米、古列資助聖殿重建；神「激動古列的心」。作者呼籲為伊朗下一任領袖禱告，相信掌管萬有的神仍在動盪中牽引君王的手。","pts":["伊朗君王曾兩度推崇聖經","殘暴的納迪爾沙下令翻譯聖經","這是第一次全本聖經的波斯語翻譯","馬廷完成波斯語新約後早逝","法特赫-阿里沙支持分發新約","19世紀宣教士得以在波斯分發聖經","神在舊約中多次使用波斯王","神能激動君王的心成就祂的旨意","要為伊朗未來的領袖禱告"],"mm":{"c":"推崇聖經的伊朗君王","b":[["起點",["梵蒂岡圖書館","波斯語福音書"]],["納迪爾沙",["殘暴暴君","召集學者翻譯","重賞宣教士"]],["法特赫-阿里沙",["亨利·馬廷","回信讚賞","支持分發"]],["舊約先例",["亞哈隨魯","亞達薛西","古列"]],["神的主權",["激動王心","賽44–45"]],["禱告",["伊朗領袖","福音挺進"]]]},"fw":[["引子","一份波斯語譯本"],["人物一","納迪爾沙"],["人物二","法特赫-阿里沙"],["聖經","神使用波斯王"],["應用","為伊朗禱告"]],"q":["即使是最殘暴的統治者，也會成就神的旨意。","神在背後掌管一切，祂激動君王的心。","在動盪與戰爭中，神始終牽引著統治者的手。"],"fb":{"h":"最殘暴的君王，\n也翻開了聖經。","t":"梵蒂岡圖書館裡，靜靜躺著一份三百年前的手稿：\n波斯文的四福音書。\n它的身世，比任何小說都離奇。\n\n十八世紀，伊朗出了一位以殘暴聞名的君王——納迪爾沙。\n他攻陷德里時，一怒之下屠殺了兩萬平民。\n然而就是這個人，下令召集猶太教、天主教、亞美尼亞的學者，\n把整本聖經翻譯成波斯文。\n\n譯稿完成那天，宣教士們進宮呈獻。\n在殿外等候的一個小時裡，\n他們眼睜睜看著十八個人被帶進寢殿，\n抬出來時，都已經被勒死。\n輪到他們時，他們是抱著殉道的心走進去的。\n結果，暴君不但收下了聖經，\n還賞了他們好幾年薪水的銀子。\n\n一百年後，換成一位愛奢華的國王。\n年輕的宣教士亨利·馬廷在設拉子日夜趕工，\n完成了波斯文新約。\n他想親手呈給國王，卻被擋在宮外；\n四個月後，三十一歲的他病逝在回鄉路上。\n他沒有看見結果。\n但兩年後，大使代為呈上，\n國王讀了，寫信稱讚譯文「平易自然」，\n還下令支持在全國分發。\n此後幾十年，宣教士在波斯送出了成百上千本聖經。\n\n這裡有一個讓人深思的問題：\n神的工作，需要好人才能完成嗎？\n\n我們常以為，福音前進需要友善的政府、敬虔的君王、開放的社會。\n但歷史一次次告訴我們：\n神可以用暴君，\n可以用享樂的王，\n可以用一個沒看見結果就死去的年輕人。\n\n其實聖經早就說過：\n神「激動波斯王古列的心」，讓他資助重建聖殿；\n亞哈隨魯的一道詔書，救了被滅族的猶太人；\n亞達薛西的一句應允，讓尼希米回去修城牆。\n\n君王的心在神手中，\n好像隴溝的水，隨意流轉。\n\n今天，提到伊朗，人們想到的是封閉、逼迫、飛彈與戰火。\n但若你翻開這段歷史，\n你會開始用另一種眼光禱告：\n不是只求動盪停止，\n也求那掌管萬王的主，\n再一次激動某一位統治者的心。\n\n因為神的道，\n從來不是靠權力的善意而前進，\n而是靠神自己的信實。\n\n在飛彈呼嘯的夜空下，\n那位托住萬有的手，\n仍然牽著君王的手，\n寫著祂的故事。\n\n#伊朗 #聖經翻譯 #神的主權 #禱告 #教會歷史"}},{"id":22486,"slug":"why-disabled-person","title":"爲什麼我是殘疾人，而不是有殘疾的人？","date":"2026-04-30","author":"James Abernathy","cats":["基督徒生活"],"tags":["神的形像","尊嚴","侷限","殘疾","身體神學"],"sum":"作者15歲跳水意外導致脊髓損傷，27年後在醫院不經意看見自己枯瘦扭曲的身體而崩潰：這就是神的形像嗎？受傷一年後，親人告訴他「你不是你的殘疾，也不是你的身體」，他全盤接受，把自我與身體剝離，以為這樣就有尊嚴。然而那晚身體在吶喊：我就是你。聖經教導身體是神形像不可或缺的一部分，人不是「擁有」身體，而是身體與靈魂的結合。脫離身體的尊嚴建立在「自主權是尊嚴源頭」的假設上，把身體看成累贅，其實是伊甸園背叛的重演。為了證明價值，他讀完研究所、考上律師、結婚生子，卻始終被羞恥驅使，背著自己打造的軛。殘疾不是罪，也不損害神的形像；神使用殘缺的身體使他效法基督。耶穌復活後仍帶著釘痕，殘缺不是祂永恆身份中的偶然。強調「有殘疾的人」其實暗示要與殘疾保持距離——他寧願說自己是殘疾人。","pts":["一次意外改變了作者的身體與身份","「你不是你的身體」看似給了尊嚴","脫離身體的尊嚴其實很脆弱","身體是神形像不可或缺的一部分","人不是擁有身體，而是身體與靈魂的結合","以自主權為尊嚴源頭是伊甸園的重演","羞恥驅使他在其他領域追求完美","殘疾不是罪，也不損害神的形像","復活的耶穌仍帶著釘痕"],"mm":{"c":"我是殘疾人","b":[["經歷",["跳水意外","醫院鏡中","崩潰"]],["假尊嚴",["你不是你的身體","與身體剝離","自主權"]],["身體重要",["神的形像","靈魂與身體","無法選擇"]],["羞恥枷鎖",["證明價值","自己打造的軛"]],["基督裡",["出4:11","效法基督","釘痕"]],["結論",["接納身體","殘疾人很好"]]]},"fw":[["震撼","鏡中的身體"],["逃避","撇開殘疾的身份"],["真理","身體很重要"],["代價","自主的枷鎖"],["盼望","先受苦，後得榮"],["結論","做一個殘疾人"]],"q":["我不是擁有一個身體，我就是一個生命實體。","沒有身體的尊嚴是脆弱的。","殘缺不是耶穌永恆身份中的偶然，也不是我身份中的偶然。"],"fb":{"h":"我不是擁有一個殘缺的身體，\n我就是這個人。","t":"十五歲那年夏天，他打出一記飛越外野三百多英尺的平飛球，\n一路狂奔，把二壘安打跑成了三壘。\n一個月後，一次跳水意外，脊髓重傷。\n治療師為他鼓掌——因為他終於把一塊積木，塞進了洞裡。\n\n二十七年後，在醫院的病床上，\n他不經意瞥見鏡中自己赤裸的身體：\n枯瘦的雙腿，鬆垮的腹部，扭曲的手指。\n他崩潰了。\n「這就是神的形像嗎？這絕不是我。」\n\n受傷一年後，有位親人曾安慰他：\n「你不是你的殘疾，你也不是你的身體。」\n十六歲的他全盤接受。\n他以為這是尊嚴——\n只要把自己和身體切開，羞恥就碰不到他了。\n\n於是他拚命在身體以外的地方證明自己：\n讀完大學，讀完研究所，考上法學院，\n成了律師，結婚，生子。\n每一個成就，都是一塊遮羞布。\n\n但那一夜，身體開始吶喊：\n「我有意義！我就是你！」\n\n這裡有一個深刻的哲學命題：\n人的尊嚴，來自哪裡？\n\n現代人說：來自自主——\n我能選擇、能思考、能定義自己，所以我有價值。\n可是，若尊嚴來自自主，\n那麼每一個限制，都是對尊嚴的剝奪；\n每一具不聽使喚的身體，都是一種羞辱。\n\n聖經卻說：尊嚴來自神的形像。\n而神的形像，不是只有靈魂，也包括身體。\n我不是「擁有」一個身體，\n我就是一個身體與靈魂結合的人。\n\n這是認知的翻轉：\n他以為剝離身體才能保住尊嚴，\n其實剝離身體，正是在拒絕神給他的身份；\n他以為那句安慰是自由，\n其實那是一副自己打造、越背越重的軛。\n\n耶穌說，我的軛是容易的。\n但那仍是一副軛——\n祂打造的，祂一同背負的。\n\n殘疾不是罪，\n也不會讓人少一分神的形像。\n神使用這具破碎的身體，\n把他塑造成更像基督的樣子。\n\n而那位基督，復活之後，\n身上仍帶著釘痕。\n破碎，不是祂永恆身份中的意外；\n也不是他的。\n\n所以，他現在選擇這樣介紹自己：\n不是「一個有殘疾的人」，\n而是「一個殘疾人」。\n不必再與身體保持距離，\n不必再害怕鏡子。\n\n因為那個從鏡中望回來的人，\n是神親手的作品，\n帶著傷，\n也帶著榮耀的盼望。\n\n#殘疾 #神的形像 #身體神學 #尊嚴 #復活"}},{"id":22484,"slug":"easter-ordinary-day-history","title":"這一天，世界終於回到了它本來的樣子","date":"2026-04-30","author":"Joe Carter","cats":["基督徒生活"],"tags":["盼望","死亡","復活"],"sum":"從一個角度看，復活節是人類史上最驚天動地的事：被處決的猶太拉比三天後復活，向數百人顯現，與門徒吃魚後升天。但從更深一層看，那天發生的卻是歷史上最「正常」的事。我們已習慣萬物凋零的世界，誤將反常當自然；但神起初稱受造為「甚好」，沒有給人的生命設定保質期，死亡是藉罪進入世界的敗壞（羅5:12）。所以復活不是宇宙法則的怪異例外，而是恢復受造的默認設置——就像從未見過疾病的人第一次看見病，會知道出了問題。聖經一貫把死亡描述為仇敵：盡末了被毀滅的仇敵（林前15:26），最終被扔進火湖，不再有死亡。這重塑我們的盼望：若復活是現實的真實本質，盼望就不是非理性的樂觀；正如路易斯說，我們的鄉愁證明確有那家園。墮落的時代只是漫長的中斷，終有一天我們會驚訝自己曾把中斷當成整個故事。","pts":["復活是史上最驚人的神蹟","但從本質看，它是最正常的事","我們習慣了死亡，誤把反常當自然","神起初的創造沒有死亡","死亡是藉著罪進入的敗壞","復活是恢復受造的默認設置","聖經始終把死亡視為仇敵","復活節是死亡開始死去的日子","盼望不是非理性的樂觀","墮落時代只是漫長的中斷"],"mm":{"c":"世界回到本來的樣子","b":[["非凡",["死而復活","向數百人顯現","升天"]],["怪異世界",["萬物凋零","習以為常"]],["起初",["甚好","沒有保質期","羅5:12"]],["復活",["恢復默認","不是例外"]],["死亡是仇敵",["林前15:26","來2:14–15","啟21:4"]],["盼望",["路易斯","鄉愁","漫長的中斷"]]]},"fw":[["反差","最不尋常也最尋常"],["診斷","習以為常的怪異世界"],["事件","復活節發生了什麼"],["聖經","死亡是仇敵"],["盼望","為何這很重要"],["結語","漫長的中斷"]],"q":["復活節，就是死亡開始死去的那個日子。","我們已如此習慣破碎，以至於誤將反常當作自然。","終有一天，我們會詫異自己竟曾把中斷當成了整個故事。"],"fb":{"h":"復活不是世界的例外，\n死亡才是。","t":"一個被羅馬處決的猶太拉比，\n葬在借來的墳墓裡，墓口還封了大石。\n三天後，祂走了出來，\n向幾百人顯現，在海邊烤魚給門徒吃，\n然後在眾目睽睽之下升天。\n\n無論怎麼看，這都是人類史上最驚天動地的事。\n\n但我想邀請你換一個角度：\n如果，復活其實是歷史上最「正常」的一天呢？\n\n我們之所以覺得復活不可思議，\n是因為我們太習慣死亡了。\n花會謝，草會枯，貓狗會老，\n曾經活過的人，幾乎都已經死了。\n死亡如此普遍，我們便以為它是自然。\n\n可是，請回到起初。\n神造完天地，說：「甚好。」\n不是「還不錯」，不是「暫時可以」，\n而是「甚好」。\n神沒有在人的生命上貼一張保存期限。\n\n死亡是從哪裡來的？\n保羅說：罪從一人入了世界，死又是從罪來的。\n死亡不是設計，而是入侵；\n不是本質，而是敗壞；\n不是原廠設定，而是病毒。\n\n想像一個從沒見過疾病的人，第一次看見有人發高燒。\n他不會說：「原來身體本來就是這樣運作的。」\n他會立刻知道：出問題了。\n\n這就是認知的翻轉——\n我們把反常當作日常，\n把中斷當作結局，\n把病當作身體本來的樣子。\n\n所以聖經從不美化死亡。\n它稱死亡為「仇敵」，\n是「盡末了所毀滅的仇敵」；\n它應許有一天，死亡會被扔進火湖，\n「不再有死亡，也不再有悲哀、哭號、疼痛」。\n\n那麼，復活節那天究竟發生了什麼？\n不是神破壞了宇宙的規律，\n而是神恢復了宇宙最初的規律。\n不是一個奇怪的例外，\n而是一個遲來的回歸。\n\n這會改變我們的盼望。\n如果復活違背現實，盼望就像一廂情願；\n但如果復活才是現實最深的本質，\n那盼望就不是逃避，而是清醒。\n\n路易斯說，我們心裡有一種說不出的鄉愁，\n渴慕一個從未見過的故鄉。\n那不是幻覺，\n而是因為我們本來就是為那個世界造的。\n\n所以，當你看著這個充滿失去、衰老與眼淚的世界，\n請記得：\n這不是故事的結尾，\n只是一段很長很長的中斷。\n\n終有一天，屬基督的人會驚訝地回頭說：\n原來我們曾經，\n把那段中斷，\n當成了全部。\n\n#復活節 #死亡 #盼望 #新創造 #福音"}},{"id":22479,"slug":"a-theologian-in-service-of-the-church","title":"爲教會而生的神學家","date":"2026-04-29","author":"Michael A. G. Haykin","cats":["社会与时事"],"tags":["帶領","神學院"],"sum":"教會史學者海金回憶他在多倫多中央浸信會神學院的同事斯坦利·福勒。神學院財務危機時期，有位影響力極大的領袖抱怨「極端加爾文主義者」，斯坦請他先定義，對方語塞，斯坦溫和地說：指責自己無法定義的事，等於做假見證——這正是他捍衛真理、謙和而無懼的風格。兩人1980年代初在禮拜後結識，海金驚喜發現他是真正的思想家；他們一同參加惠頓的福音派研討會、司布真牧者研討會，在雷雨中開車暢談。1993年神學院與倫敦浸信會聖經學院合併，斯坦是促成合併的核心人物：在基本要道上立場堅定，在非核心議題上通情達理；合併後的傳承學院在艱難歲月裡也靠他的帶領得以保全。他把心力全投入學院，出版不多，作者曾盼他多寫；2016年同事為他七十壽辰編輯論文集，今年出版他的兩卷作品集。學生與教會都感激這位為教會服務的神學家。","pts":["斯坦利·福勒捍衛真理，言語謙和","指責無法定義的事等於做假見證","他是熱愛思考的神學家","兩人的友誼在研討會與旅途中加深","他是神學院合併的核心人物","在要道上堅定，在次要議題上包容","他的帶領保全了傳承學院","他把心力投入學院而少著述","神學院對地方教會的興旺至關重要"],"mm":{"c":"為教會而生的神學家","b":[["人物",["斯坦利·福勒","中央浸信會神學院"]],["品格",["捍衛真理","謙和無懼","假見證之語"]],["友誼",["禮拜後結識","惠頓研討會","雷雨長途"]],["帶領",["學院合併","要道堅定","次要包容"]],["著述",["洗禮神學","祝壽文集","兩卷作品集"]],["貢獻",["傳承學院","服事教會"]]]},"fw":[["軼事","一場關於定義的對話"],["初識","真正的思想家"],["同行","研討會中的情誼"],["領導","卓越的帶領"],["晚近","重聚與致敬"],["評價","為教會服務的神學家"]],"q":["對自己無法定義的事物橫加指責，實際上是在做假見證。","在信仰要道上立場堅定，在非核心議題上通情達理。","神學院對於地方教會的興旺至關重要。"],"fb":{"h":"指責你說不清楚的東西，\n就是在做假見證。","t":"一場神學院的會議上，一位德高望重的領袖正在抱怨：\n「那些極端加爾文主義者……」\n一位年輕教授舉手，平靜地問：\n「請問，您能先定義一下什麼是極端加爾文主義嗎？」\n\n全場安靜。\n平時口若懸河的領袖，一時答不上來。\n年輕教授溫和地說：\n「對自己無法定義的事情橫加指責，其實是在做假見證。」\n\n這句話，讓在場的一位同事記了一輩子。\n那位教授叫斯坦利·福勒。\n他沒有成為網紅，也沒有寫很多暢銷書，\n卻被稱為「為教會而生的神學家」。\n\n這個故事，其實在問我們一個很當代的問題：\n在這個人人都有立場的時代，\n我們有多少指責，是建立在真正的理解上？\n\n我們給別人貼標籤，很快；\n理解一個標籤背後的意思，很慢。\n我們批評一種神學，很容易；\n準確說出它到底主張什麼，很難。\n於是，許多爭論不是真理與錯謬的交鋒，\n而是兩個稻草人在打架。\n\n福勒的智慧，不只在於敢說，\n更在於知道什麼時候要堅定，什麼時候要寬容。\n當他的神學院瀕臨倒閉，在購物中心裡勉強辦學時，\n是他坐上談判桌，促成了兩所學院的合併。\n他的原則很簡單：\n在信仰的根基上，寸步不讓；\n在次要的議題上，通情達理。\n\n這聽起來像常識，\n卻是許多教會、許多機構、許多家庭最缺的能力。\n我們常常反過來——\n在小事上寸步不讓，在大事上隨波逐流。\n\n他把一生的心力都給了一所學院，\n寫得不多，說得不響，\n朋友常遺憾：要是他能多寫一點就好了。\n但回頭看，正是那些不被看見的會議、決策、陪伴，\n讓一間神學院活了下來，\n讓一代又一代的牧者被裝備，\n讓許多地方教會因此興旺。\n\n這是一種認知翻轉：\n我們以為影響力來自聲量，\n其實常常來自忠心；\n我們以為重要的是被看見，\n其實重要的是站在對的位置上，站得夠久。\n\n在這個撕裂、喧囂、標籤滿天飛的時代，\n也許我們最需要的，不是更大的聲音，\n而是更多這樣的人：\n說話之前，先求理解；\n堅持之中，仍帶溫度；\n一生的事奉，不為舞台，只為教會。\n\n願我們在指責之前，\n先問自己一句：\n我真的懂嗎？\n\n#神學 #教會 #真理與愛 #忠心 #品格"}},{"id":22477,"slug":"heaven-still-declaring-astronauts","title":"諸天仍在述說","date":"2026-04-29","author":"Joe Carter","cats":["社会与时事"],"tags":["聖經","創造","太空"],"sum":"阿耳忒彌斯2號飛行員格洛弗在離地球25萬英里處被問到復活節信息，他即興說：從太空看地球是一個整體，他讀聖經時感嘆神為我們造了這艘名叫地球的太空船，是虛無宇宙中唯一的綠洲。這讓人想起1968年阿波羅8號太空人在平安夜朗讀創世記「起初，神創造天地」。同樣的話由太空人說出格外厚重，部分原因是「總觀效應」：太空人俯瞰地球時深感它渺小珍貴、人類休戚相關。世俗理論稱之為視角轉變，但從聖經看，太空人並沒有得到新資訊，只是擺脫了讓人無視真理的雜音——諸天本就述說神的榮耀（詩19:1），而人卻壓制這知識（羅1）。不過作者提醒，總觀效應不等於生命翻轉；普遍啟示使人無可推諉，卻不能救人，唯有福音才能。我們不必飛上太空，只要走到戶外、抬頭仰望、靜心聆聽。","pts":["太空人從太空分享復活節感言","地球是虛無宇宙中的綠洲","阿波羅8號曾在太空朗讀創世記","總觀效應讓人看見地球的珍貴","太空人只是擺脫了雜音","諸天一直在述說神的榮耀","人常壓制顯而易見的真理","普遍啟示不足以救人，需要福音","我們只需抬頭仰望、靜心聆聽"],"mm":{"c":"諸天仍在述說","b":[["格洛弗",["阿耳忒彌斯2號","太空船地球","綠洲"]],["阿波羅8號",["平安夜","朗讀創世記"]],["總觀效應",["渺小珍貴","休戚相關"]],["聖經視角",["詩19:1","羅1章","擺脫雜音"]],["界限",["普遍啟示","需要福音"]],["應用",["仰望星空","靜心聆聽"]]]},"fw":[["事件","太空中的復活節信息"],["歷史","阿波羅8號的創世記"],["分析","總觀效應"],["聖經","屏蔽塵世的雜音"],["提醒","視角不等於得救"],["應用","抬頭仰望"]],"q":["諸天述說神的榮耀，分秒不息。","太空人沒有得到新資訊，只是擺脫了雜音。","我們不必飛上太空，才能聽見諸天的宣告。"],"fb":{"h":"你不必飛上太空，\n也能聽見諸天說話。","t":"離地球二十五萬英里，一位太空人被記者問到：\n「能和我們分享一段復活節的話嗎？」\n他沒有講稿，卻從容地說：\n「從這裡看，地球是一個整體。\n你們覺得我們特別，是因為我們坐著太空船遠離地球；\n其實你們也坐在一艘太空船上，它叫地球。\n在這片虛無的宇宙裡，它是唯一的綠洲。」\n\n半個多世紀前的平安夜，\n第一批繞月飛行的太空人，\n在全球四分之一人口的注視下，\n朗讀了創世記：「起初，神創造天地……」\n\n奇怪的是，同樣的話，\n在教會裡說，我們點點頭；\n從太空裡說，我們卻熱淚盈眶。\n為什麼？\n\n有人稱之為「總觀效應」：\n太空人從遠處望見地球，\n突然看見它的渺小與珍貴，\n看見人類原來同在一條船上。\n\n世俗的解釋是：視角變了，認知就重組了。\n但聖經給了另一個答案——\n他們並沒有得到新的資訊，\n只是擺脫了舊的雜音。\n\n「諸天述說神的榮耀，穹蒼傳揚祂的手段。」\n這句話不是只寫給太空人的。\n它每天都在播放，\n只是我們聽不見。\n\n我們被什麼擋住了？\n通知聲、待辦事項、新聞標題、無止境的滑動。\n保羅說，人常常壓制那顯而易見的真理，\n不是因為證據不夠，\n而是因為心太滿、太吵、太不願意聽。\n\n請誠實地問自己一句：\n你上一次抬頭看星空，是什麼時候？\n\n這裡有一個需要保持清醒的翻轉：\n總觀效應再震撼，也只是看見；\n看見受造之美，不等於認識造物之主。\n星空能讓人無可推諉，\n卻不能告訴人：那位造星的神，曾經為你釘在十字架上。\n仰望天空能叫人敬畏，\n唯有福音能叫人得救。\n\n但至少，星空會把我們從自我的中心挪開一點點，\n讓我們重新想起：\n我們不是宇宙的主角，\n卻是宇宙主宰所眷顧的人。\n\n我們沒有太空船的座位，\n卻和太空人仰望同一片天。\n不必飛行二十五萬英里，\n只需要走到門外，\n關掉螢幕，\n抬起頭。\n\n在那片無聲的星光裡，\n諸天仍在述說，\n一夜一夜，\n從未停止。\n\n#創造 #太空 #詩篇19 #敬畏 #普遍啟示"}},{"id":22472,"slug":"on-my-shelf-betsy-childs-howard","title":"我的書架上有什麼：貝茜·蔡爾茲·霍華德的生活與書籍","date":"2026-04-28","author":"Ivan Mesaã€Betsy Childs Howard","cats":["文化与艺术","我的书架上有什么"],"tags":["書評","故事","寫作","兒童繪本","虛構小說"],"sum":"「我的書架上有什麼」專訪兒童作家、福音聯盟編輯貝茜·蔡爾茲·霍華德。她的床頭書包括萊爾《四福音釋經默想》（她說萊爾像維多利亞時代的凱勒，善於向人心講道）、南希·葛絲瑞《我在為你禱告》，睡前讀黃金時代推理小說，做家務聽《白城惡魔》，並說年紀越大越不覺得書必須讀完。喜愛的小說有《米德爾馬契》《傲慢與偏見》《靜如河流》《博來·法拉先生》，二十多歲起花近十年讀完特羅洛普全集。宣教士傳記塑造了她，最常重讀《未見之證》，它示範在感覺不到神時憑信心而行。反覆讀的書有路易斯《裸顏》《魔鬼家書》與《天堂在召喚》。《信心寶藏》讓她明白希伯來書11章的永恆視角。她鼓勵牧師常讀基督徒傳記；給兒童作家的建議是「要展示，不要說教」，每本書只專注一點。目前她在等候的季節中學習享受今日的供應，不為明天憂慮。","pts":["萊爾的釋經默想善於向人心講道","書不一定要從頭讀到尾","宣教士傳記深刻塑造了她","《未見之證》示範憑信心而行","《裸顏》值得與人共讀","希伯來書11章培養永恆視角","牧師應常讀基督徒傳記","兒童寫作要展示，不要說教","在未知中學習享受今天的供應"],"mm":{"c":"貝茜的書架","b":[["床頭",["萊爾","我在為你禱告","推理小說"]],["小說",["米德爾馬契","靜如河流","特羅洛普"]],["傳記",["耶得遜","羅斯維爾","未見之證"]],["重讀",["裸顏","魔鬼家書","天堂在召喚"]],["事工",["信心寶藏","永恆視角"]],["建議",["牧師讀傳記","展示不說教","不為明天憂慮"]]]},"fw":[["床頭","正在讀的書"],["小說","最愛的作品"],["傳記","影響最深的生命"],["重讀","一讀再讀的書"],["事工","塑造服事的書"],["寫作","給作者的建議"],["生活","正在學習的功課"]],"q":["年紀越大，越不覺得一本書必須從頭讀到尾。","在感覺不到神時，仍可憑信心而行。","如果故事寫得引人入勝，它的含意就會留在孩子的想像裡。"],"fb":{"h":"書架上的書，\n會悄悄長成你的樣子。","t":"如果你走進一個人的房間，\n只能看一個地方來認識他，\n我會建議你看他的書架。\n\n一位兒童作家、牧師娘，被問到她的書架上有什麼。\n她的回答，像是一張屬靈生命的地圖。\n\n床頭，放著一套維多利亞時代牧師寫的福音書默想。\n她說，那位牧師很會「向人心講道」——\n不只解釋經文，還把經文送進日常生活。\n旁邊，是一本教人為受苦的朋友禱告的書；\n她正用它，為一位朋友一頁一頁地禱告。\n\n睡前，她讀黃金時代的推理小說；\n做家務時，聽一部歷史有聲書。\n她說了一句很解放的話：\n「年紀越大，我越不覺得一本書必須從頭讀到尾。」\n\n是的，讀書不是打卡。\n不是為了證明讀完了，\n而是為了讓真正值得的部分，留在你心裡。\n\n她小時候的牧師，要全教會在宣教大會前讀一本宣教士傳記。\n那些故事塑造了她。\n其中有一本，她反覆重讀：\n一位女宣教士在戰俘營裡受苦的見證。\n每當生活艱難，她就想起那位女士承受的一切，\n自己的試煉便有了比例。\n那本書示範了一件事：\n在感覺不到神的時候，仍然可以憑信心而行。\n\n她十幾歲讀路易斯的《裸顏》，至今愛不釋手。\n她說它讀起來不難，懂起來卻不容易，\n最好找人一起讀。\n\n這裡藏著一個對比：\n資訊讓人知道更多，\n傳記讓人活得更深；\n文章讓人懂道理，\n故事讓人看見道理如何在一個生命裡成形。\n\n所以她給每一位牧師的建議不是某一本書，而是一類書：\n常讀基督徒傳記。\n當你讀到別人的難關，自己的困境也許會像祝福；\n當你讀到神如何回應別人的禱告，\n你會更放膽地為自己的事工祈求。\n\n她給兒童作家的建議也很動人：\n要展示，不要說教。\n一本書只專注一點，\n讓故事自己說話，\n孩子的想像力會替你完成剩下的部分。\n\n最後，她說自己正在學的功課是：\n享受今天的供應，不為明天憂慮。\n她家正處在一個不知道明年會住在哪裡的季節。\n她不喜歡不確定，\n卻感謝神用不確定，讓她更依靠祂。\n\n也許，這就是一個書架最終的意義：\n不是收藏多少知識，\n而是陪我們走過多少季節。\n\n今晚，去看看你的書架吧。\n那些書，\n正悄悄長成\n你將成為的樣子。\n\n#閱讀 #傳記 #路易斯 #信心 #兒童文學"}},{"id":22466,"slug":"good-news-of-your-limits","title":"作者訪談：《你只是凡人》","date":"2026-04-27","author":"Collin Hansenã€Kelly M. Kapic","cats":["信仰与工作"],"tags":["單身","侷限","身體神學","播客"],"sum":"柯林·漢森訪談神學家凱利·卡皮克新書《你只是凡人》。卡皮克說，我們常把「有限」（受造性）與罪混為一談，為根本不是罪的事內疚：晚上躺在床上不是檢討怎麼待人，而是懊惱沒完成多少工作——生產力已滲入我們對忠心的定義，教會甚至把「時間就是金錢」神學化成「愛惜光陰」。我們對世界和自己的掌控遠比想像的少，養兒女時最能體會；父母常為孩子的好表現攬太多功，又為壞表現背太多鍋。他擔心「你的身份在基督裡」被有權力的人用來抹去族裔、性別等受造身份，需要扎實的創造論。幸福不是追來的，而是在服事中自然產生，最好透過故事傳遞。謙卑包括以他人的恩賜為樂，也要有勇氣相信別人看到你的恩賜。他認為生產力與效率往往是愛的敵人，教會的「低效」常常就是愛；會眾要讓牧師休息、不必參加所有會議。「不要浪費生命」式的熱心若不配合健全的教會論，會壓垮個人、毀壞家庭。他在清晨靜默與散步中得平靜。","pts":["有限不等於罪","我們常為受造的限制而內疚","生產力滲入了我們對忠心的定義","我們對世界的掌控遠比想像的少","父母常把孩子的表現都歸於自己","「身份在基督裡」不應抹去受造身份","幸福是服事的副產品，靠故事傳遞","謙卑包括以他人的恩賜為樂","效率往往是愛的敵人","群體能分擔個人無法承擔的重擔"],"mm":{"c":"你只是凡人","b":[["有限",["受造性","不是罪","錯置的內疚"]],["生產力",["睡前檢討","時間就是金錢"]],["掌控",["養育兒女","攬功背鍋"]],["身份",["在基督裡","創造論"]],["幸福與謙卑",["享樂悖論","以他人為樂"]],["教會",["效率是愛的敵人","讓牧師休息","健全教會論"]],["平靜",["清晨靜默","散步"]]]},"fw":[["引言","新書介紹"],["核心","有限不是罪"],["文化","生產力的執念"],["掌控","放下幻覺"],["身份","在基督裡與受造"],["幸福","副產品"],["職場與教會","效率與愛"],["結語","平靜與好消息"]],"q":["生產力和效率往往是愛的敵人。","我們為孩子的好表現攬了太多功勞，又為壞表現背了太多黑鍋。","神並不以我們的人性為恥。"],"fb":{"h":"你只是凡人，\n而這是好消息。","t":"夜裡躺在床上，你通常怎麼回顧這一天？\n\n大多數人不會想：「今天我對人夠溫柔嗎？」\n而是想：「今天我完成了多少？」\n沒做完的報告、沒回的訊息、沒讀的書、沒陪夠的孩子。\n於是我們帶著內疚入睡——\n不是因為我們犯了罪，\n而是因為我們只是凡人。\n\n一位神學家說，我們常常把兩件事搞混：\n有限，和罪。\n\n有限是什麼？\n是你一次只能在一個地方，\n一天只有二十四小時，\n你的知識有邊界，力氣會用完，需要睡覺。\n這些不是缺陷，是神起初的設計；\n不是墮落的結果，是受造的本質。\n\n但在一個崇拜生產力的世界裡，\n有限看起來像失敗，\n休息看起來像懶惰，\n知足看起來像不夠努力。\n連教會都把「時間就是金錢」講成了「愛惜光陰」。\n\n這裡有一個哲學命題：\n人之所以為人，是因為他能做多少，\n還是因為他被誰所造？\n\n如果是前者，我們永遠不夠；\n如果是後者，我們從一開始就被接納。\n\n他還說了一句讓父母心頭一震的話：\n「我們為孩子的好表現攬了太多功勞，\n又為孩子的壞表現背了太多黑鍋。」\n我們以為自己能掌控孩子，\n其實那只是一個幻覺；\n孩子越大，幻覺越難維持，\n我們才終於學會：原來，真的需要禱告。\n\n認知的翻轉就在這裡——\n我們對世界、甚至對自己的掌控，遠比想像的少。\n聽起來令人恐慌？\n其實是釋放。\n因為那位真正掌管一切的，不是你，\n而是一位良善的神。\n\n他也提醒教會：\n效率常常是愛的敵人。\n有人過世、婚姻破裂、孩子出事——\n這些事沒有一件能排進行程表。\n教會之所以「低效」，\n往往正因為它在愛那些無法高效的人。\n\n我們需要的不是更多的自我鞭策，\n而是彼此提醒：\n你可以休息，\n你可以說不，\n你可以不必樣樣都行，\n你可以欣賞別人的恩賜，而不是只看見別人的問題。\n\n因為神並不以我們的人性為恥。\n祂自己，也曾成為一個會累、會餓、會睡著的人。\n\n今晚，當你躺下，\n試著換一個問題問自己：\n不是「我完成了多少」，\n而是「我在哪裡看見了恩典」。\n然後，安心地睡吧。\n世界不是靠你撐著的。\n\n#有限 #安息 #生產力 #恩典 #受造"}},{"id":22463,"slug":"working-without-recognition","title":"努力工作卻無人喝彩，我該如何堅持？","date":"2026-04-27","author":"Denise Lee Yohn","cats":["信仰与工作","荆棘与蒺藜"],"tags":["敬拜","獎賞"],"sum":"「荊棘與蒺藜」專欄回答一位讀者：工作表現不錯，卻整年沒人說一句「幹得好」，該如何堅持？作者曾在廣告公司經歷同樣的被忽視，先肯定渴望被認可不是軟弱，而是神造人工作、讓工作有價值的天性。一、你的工作屬於更宏大的計劃：基督復活開啟國度的重建，無論做產品、客服或整
