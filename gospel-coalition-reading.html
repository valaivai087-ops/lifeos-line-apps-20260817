橙花、蜂鳥、孩子追蝴蝶——在真實的自然中感到踏實，相比之下，螢幕上的末日預言與資訊災難更讓人不安。如今AI讓文字、圖像甚至敬拜詩歌真假難辨，他又有同樣的感覺：透過螢幕傳來的，不如親眼所見可靠。「媒體」本是現實的間接轉述，像傳話遊戲一樣容易走樣。在過度媒介化的世界裡，邏輯被顛倒：網紅比本地影響力更吸引人，播客主比父母牧者更有權威，我們討論的是「關於討論的討論」，寧可看天氣App也不開門看雨。AI將加速這趨勢。但神給了我們眼睛、耳朵、手指，又把我們放在家庭與教會中，與有血有肉的人面對面。傳記作家卡羅為寫約翰遜睡在德州牧場星空下——AI再強也取代不了親歷。資訊豐富不等於智慧；屬靈上更是如此，可能精通神學卻不認識神。作者一個月遠離社群媒體，把時間花在踢球、搭樂高、抱新生兒、與妻子散步禱告、教會團契上。「你們要嘗嘗主恩的滋味，便知道祂是美善」——別只信ChatGPT告訴你的。","pts":["真實的自然比螢幕更讓人踏實","AI讓媒體內容真假難辨","媒體是現實的間接轉述，容易走樣","過度媒介化的世界顛倒了邏輯","我們越來越相信螢幕勝過親身經歷","神給了我們感官與實體群體","親身經歷無可替代","見多識廣不等於智慧","可以精通神學卻不認識神","嘗嘗主恩的滋味，不只聽AI轉述"],"mm":{"c":"感官學校的智慧","b":[["2020年春",["戶外的踏實","資訊災難"]],["AI時代",["真假難辨","不信任螢幕"]],["媒體",["間接轉述","傳話遊戲"]],["顛倒邏輯",["網紅與播客","討論的討論","天氣App"]],["親身經歷",["感官","卡羅的考察","教會"]],["智慧",["資訊非智慧","詩34:8","遠離社群一個月"]]]},"fw":[["回憶","疫情中的春天"],["處境","AI帶來的不信任"],["分析","媒體的本質"],["診斷","過度媒介化的世界"],["對比","親身體驗無可替代"],["選擇","依靠人還是機器"],["實踐","回到真實生活"]],"q":["見多識廣不等於智慧。","我們可能精通神學，卻從未真正認識那位神。","你們要嘗嘗主恩的滋味，便知道祂是美善。"],"fb":{"h":"別只信AI告訴你的，\n去嘗嘗主恩的滋味。","t":"疫情剛爆發的那個春天，\n他常常跑到戶外。\n玫瑰和山茶花盛開，橙花的香氣很濃，\n蜂鳥忙著採蜜，\n兩歲的兒子在院子裡追蝴蝶，\n完全不知道外面的世界已經亂成一團。\n\n他說，每當他坐在夕陽裡，\n或是從後院的樹上摘一顆酪梨，\n心裡就踏實了一點，\n覺得自己更像一個活生生的人。\n比起螢幕上每天的末日預言，\n神創造的世界，讓人安定得多。\n\n今天，他又有了同樣的感覺。\n\n在AI時代，我們越來越分不清：\n這篇文章是人寫的嗎？\n這張照片是真的嗎？\n這首詩歌、這封信、這個聲音，\n背後是一個人，還是一段程式？\n\n「媒體」這個詞，本來的意思就是「中間」——\n它把一個你不在場的現實，轉述給你。\n就像傳話遊戲，\n經過一個又一個人，\n最後的句子往往面目全非。\n\n這裡有一個值得警覺的現象：\n我們正活在一個過度媒介化的世界。\n網紅的話，比身邊長輩的勸告更有分量；\n播客主的建議，比自己牧師的提醒更可信；\n我們討論的，常常是「對討論的討論」；\n甚至，我們寧可打開天氣App看會不會下雨，\n也不願打開門看看雨有沒有落在身上。\n\n我們被訓練得越來越相信螢幕，\n越來越不相信自己的眼睛。\n而AI，只會讓這件事加速。\n\n但神造我們時，給了我們眼睛看，\n耳朵聽，\n手指觸摸；\n又因為我們的感官也會出錯，\n祂把我們放在家庭和教會裡，\n讓一群有血有肉的人，\n愛我們、塑造我們、提醒我們看不見的地方。\n\n一位傳記作家為了寫一位總統，\n搬到那位總統長大的地方，\n在牧場的星空下睡了好幾個晚上。\nAI可以生成一段精準的描述，\n卻無法替他躺在那片土地上。\n\n認知的翻轉在這裡：\n我們以為資訊越多，就越有智慧；\n其實見多識廣，不等於智慧。\n在屬靈上更是如此——\n你可以知道關於神的一切，\n卻從未真正認識祂；\n你可以精通神學，\n卻在敬拜中一片乾枯。\n\n他給自己放了一個月的假，完全不碰社群媒體。\n那個月，他陪兒子踢球，和女兒搭樂高，\n抱著剛出生的小兒子，看他第一次認出爸爸的臉而笑；\n和妻子在社區裡散步禱告，\n在教會裡敬拜，\n收下弟兄姊妹送來的熱飯。\n\n這些東西，不需要AI替我們轉述。\n我們可以用神給的身體，直接領受。\n\n「你們要嘗嘗主恩的滋味，\n便知道祂是美善。」\n不是讀到，不是聽說，\n而是——嘗。\n\n今天，關掉螢幕一小時吧。\n走出門，\n摸一摸樹皮，\n看一看夕陽，\n握一握一雙真實的手。\n\n世界很吵，\n但神的美善，\n一直在等你\n親自嘗嘗。\n\n#AI #媒體 #真實 #感官 #詩篇34"}},{"id":22168,"slug":"how-know-idolizing-work","title":"我是在勤勉工作，還是把工作偶像化了？","date":"2026-03-30","author":"Kaitlin Febles","cats":["信仰与工作","荆棘与蒺藜"],"tags":["偶像","節制","放棄"],"sum":"一位在金融業工作、深感蒙召的讀者問：我很難放下工作去顧家庭、服事教會、鍛鍊身體，怎麼知道自己是勤勉，還是把工作當成偶像？作者先肯定追求卓越沒有錯，但我們很容易從「以工作敬拜神」滑向「把工作當神敬拜」，並提出五個省察問題：一、你為什麼工作？是榮耀神、造福人、供養家人，還是為自己爭榮耀、在工作中找身份、為積財而勞碌？工作是在神國盡本分，不是建立自己的王國。二、你為工作放棄了什麼？休閒讓路是正常的，但是否犧牲了與神的時間、婚姻、孩子、教會與安息？三、你敬畏工作勝過敬畏神嗎？更渴望老闆的認可還是神的稱讚？四、工作是否過度左右你的情緒？沒升遷就一蹶不振、被批評就動搖價值、因會議而失眠，可能是在向工作尋求只有神能給的。五、若神呼召你離開，你願意嗎？像亞伯拉罕獻以撒一樣。若有扎心之處，就直視這偶像冰冷無氣的真面目，求神使工作回到該有的位置：享受恩典的禮物、事奉祂的工具、彰顯祂榮美的窗口。","pts":["追求卓越本身沒有錯","以工作敬拜神，不是把工作當神","問一：你為什麼工作？","工作是在神國盡本分，不是建自己的王國","問二：你為工作放棄了什麼？","問三：你敬畏工作勝過敬畏神嗎？","問四：工作是否過度左右你的情緒？","問五：神若呼召你離開，你願意嗎？","工作是禮物、工具與窗口"],"mm":{"c":"勤勉還是偶像","b":[["原則",["西3:23","以工作敬拜神"]],["動機",["榮耀神","身份與價值","積財"]],["代價",["與神的時間","家庭","安息"]],["敬畏",["老闆的認可","神的稱讚"]],["情緒",["升遷","批評","失眠"]],["放手",["亞伯拉罕","順服"]]]},"fw":[["問題","讀者的困惑"],["一","工作動機"],["二","放棄了什麼"],["三","敬畏誰"],["四","情緒的主宰"],["五","願意放手嗎"],["回應","推倒偶像"]],"q":["工作的本意，是在神的國度裡盡本分，而不是為自己建造王國。","唯有主，能在一切動搖你的事物中賜下不動搖的平安。","讓工作回到它應有的位置：禮物、工具與窗口。"],"fb":{"h":"以工作敬拜神，\n還是把工作當神敬拜？","t":"你很喜歡你的工作。\n你有恩賜，有機會，有熱情，\n甚至清楚感覺到：這是神呼召我做的事。\n\n但最近，你發現自己很難放下它。\n晚上還在回訊息，週末還在想專案，\n家人說話時你在走神，\n教會的服事一延再延，\n運動的計劃早就放棄了。\n\n你開始問自己：\n我是在勤勉工作，\n還是已經把工作變成了偶像？\n\n這是一個很誠實、也很重要的問題。\n因為兩者的距離，有時只差一步：\n從「以工作敬拜神」，\n滑到「把工作當神敬拜」。\n\n有五個問題，可以幫你省察。\n\n第一，你為什麼工作？\n是為了善用神給的恩賜、榮耀祂、服事人、供養家人？\n還是為了在工作中找到身份，\n為了升遷加薪帶來的認可，\n為了積攢更多的財富？\n工作的本意，是在神的國度裡盡本分，\n不是為自己建造一個王國。\n\n第二，你為工作放棄了什麼？\n放下一些休閒和娛樂，是正常的；\n但如果你放棄的是與神獨處的時間、\n對婚姻的投入、對孩子的陪伴、\n在教會的委身，\n甚至連神命定的安息都放棄了——\n那就要停下來想一想了。\n\n第三，你敬畏工作，勝過敬畏神嗎？\n你更渴望老闆的一句肯定，還是神的一句稱讚？\n同事的評價，比神的評價更能左右你的心嗎？\n比起辜負神的榮耀，\n你是不是更害怕自己的職涯野心落空？\n\n第四，工作是否主宰了你的情緒？\n沒升到那個位置，你就一蹶不振；\n名聲懸而未決，你就焦慮難安；\n被人批評，你就懷疑自己的價值；\n重要的會議前，你徹夜難眠。\n如果是這樣，\n你可能正在向工作索取一樣東西——\n一樣只有神才能給的東西：\n不動搖的平安。\n\n第五，如果神要你離開，你願意嗎？\n就像亞伯拉罕把以撒放上祭壇，\n如果神透過聖經、聖靈和敬虔的勸告要你放下，\n你能鬆手嗎？\n還是會把它握得更緊？\n\n這裡有一個深刻的翻轉：\n偶像從來不會一開始就長得像偶像。\n它常常是一件好東西——\n好到讓我們以為，\n它可以給我們只有神能給的。\n\n如果某個問題讓你扎心，\n那就直視它吧。\n看清這個偶像冰冷、沒有氣息的真面目，\n承認它救不了你。\n無論工作帶來多少成就感，\n它都不能像永生神那樣滿足你的心。\n\n然後，求神給你智慧與節制，\n讓工作回到它應有的位置——\n它是一份讓你享受恩典的禮物，\n一件事奉祂的工具，\n一扇讓人看見祂榮美的窗。\n\n而那個寶座，\n只留給一位。\n\n#工作 #偶像 #職場信仰 #安息 #敬拜"}},{"id":22165,"slug":"ai-proper-place","title":"學生需要的，是一個比 AI 更宏大的故事","date":"2026-03-30","author":"Darin White","cats":["信仰与工作"],"tags":["智慧","身份","AI","工具"],"sum":"一篇題為《大事正在發生》的文章在作者任教的大學瘋傳，指出AI進化之快超出想像；作者同意，熟練使用AI將是學生的生存底線，但那篇文章完全圍繞「能力」，漏掉了核心問題：什麼是人類獨有、演算法永遠無法取代的？答案不是智力，而是身份——人是承載神形像、被賜榮耀尊貴為冠冕的受造者（詩8:5）；這形像因墮落敗壞，又藉福音在知識、公義與聖潔上被更新，結出機器給不了的果子：智慧。AI能瞬間處理數據，卻不能敬畏耶和華，也無法判斷什麼才真正重要。聖經一再出現同一模式：新工具出現、賦予新能力、人心從信靠神轉向信靠工具——巴別的磚、金牛犢（「歡喜自己手中的工作」）、以色列要求立王與戰車。巴別說「我們要為自己立名」，接著神對亞伯拉罕說「我必叫你的名為大」；福音不否定能力，而是重新校正其方向。學生不需要拒絕AI，而需要被比AI更大的故事塑造：知道自己是誰，AI才會回到工具的位置，服事文化使命，而不奴役人。","pts":["AI進化之快超出多數人想像","熟練使用AI將是職場的底線","真正的問題：什麼是人獨有的？","人的獨特在於身份，不在智力","被更新的神形像結出智慧","AI無法敬畏耶和華，也無法判斷什麼重要","聖經中工具常使人心偏離神","巴別要為自己立名，神卻為亞伯拉罕立名","學生需要比AI更大的故事","知道自己是誰，才不被工具奴役"],"mm":{"c":"比AI更大的故事","b":[["現象",["大事正在發生","AI是底線"]],["身份",["詩8:5","神的形像","西3:10"]],["智慧",["敬畏耶和華","判斷什麼重要"]],["聖經模式",["巴別的磚","金牛犢","要求立王"]],["出路",["亞伯拉罕","神立名","文化使命"]],["教育",["先教人心","分辨磚頭與建造者"]]]},"fw":[["引子","一篇瘋傳的文章"],["核心","身份而非智力"],["成長","在智慧中成長"],["模式","工具與人心"],["出路","巴別與亞伯拉罕"],["教育","為冠冕所造"]],"q":["人的獨特之處，不在於智力，而在於身份。","我們能否培養出一代能分辨磚頭與建造者的年輕人？","他們歡喜自己手中的工作；願我們的學生歡喜祂的工作。"],"fb":{"h":"我們被造是為了冠冕，\n不是為了代碼。","t":"有一篇文章在大學校園裡瘋傳，\n標題叫《大事正在發生》。\n作者說：AI進化的速度，已經遠遠超過大多數人的想像。\n\n一位商學院教授讀完，第一個反應是同意。\n他知道，他的學生將來進入職場，\n熟練使用AI不會是加分，\n而是生存的基本門檻。\n\n但接著，他覺得那篇文章少了什麼。\n它整篇都在談「能力」，\n卻沒問一個最根本的問題：\n有哪些東西，是人類獨有，\n而演算法永遠無法取代的？\n\n詩篇第八篇說：\n「你叫他比天使微小一點，\n並賜他榮耀尊貴為冠冕。」\n\n人之所以特別，\n不是因為我們算得比較快，\n而是因為我們承載著神的形像。\n人的獨特，不在智力，\n而在身份。\n\n這個形像因為墮落而破損，\n卻在基督裡一點一點被更新，\n結出一種機器永遠給不了的果子：\n智慧。\n\nAI可以在幾分鐘內整理全人類的知識，\n卻不能敬畏耶和華。\n它可以給你數據、模式、建議，\n卻無法判斷——什麼才是真正重要的。\n\n有一個聖經裡反覆出現的模式，\n值得每一個活在AI時代的人留意：\n一種新工具出現了；\n它給了人新的能力；\n然後，人心悄悄從信靠神，轉向信靠工具。\n\n巴別的人學會了燒磚。\n磚本身沒有錯，\n但他們說：「來吧，我們要建一座塔，塔頂通天，\n為要傳揚我們的名。」\n\n以色列人用金子鑄了一頭牛。\n後來司提反說：\n他們「歡喜自己手中的工作」。\n\n以色列人要求立王，\n想要像列國一樣有軍隊、有戰車；\n神卻說，他們厭棄的不是撒母耳，而是我。\n\n工具一直在換：磚頭、金子、戰車、君王……\n但人心，從來沒變。\n而AI，也許是人類歷史上最有誘惑力的工具。\n\n然而，巴別的故事後面，緊接著另一個故事。\n巴別的人說：「我們要為自己立名。」\n下一章，神對亞伯拉罕說：「我必叫你的名為大。」\n\n一個靠技術成就人的自足，\n一個靠恩典成就神的救贖。\n\n這是一個關鍵的翻轉：\n福音不是要我們丟掉能力，\n而是重新校正能力的方向。\n亞伯拉罕有財富、有能力，\n神沒有要他全部捨棄，\n而是要他把這一切，放進一個更大的故事裡。\n\n我們的學生也是如此。\n他們不需要拒絕AI，\n他們需要一個比AI更大的故事。\n當一個年輕人知道自己是誰——\n按神形像受造，因罪破碎，在基督裡被更新，\n蒙召參與神救贖世界的使命——\nAI就會回到它該在的位置：\n一件強大的工具，\n而不是一位主人。\n\n問題從來不是AI會不會改變世界。\n它會。\n問題是：\n我們能不能培養出一代人，\n分得清磚頭，\n和建造者？\n\n他們歡喜自己手中的工作。\n願我們，\n歡喜祂的工作。\n\n#AI #教育 #神的形像 #智慧 #巴別塔"}},{"id":22153,"slug":"tears-in-heaven-psalm-56","title":"天堂的淚水（《詩篇》56 篇）","date":"2026-03-29","author":"Angie Velasquez Thornton","cats":["圣经与神学"],"tags":["詩篇","苦難","喜樂","同在"],"sum":"聖經應許終有一天神要擦去一切眼淚，但在那日之前，我們仍在哀慟、苦難與不公中流淚，甚至懷疑神是否聽見、是否在乎——撒但最陰險的謊言就是讓我們以為神在苦難中離棄了我們。詩篇56篇是大衛逃亡迦特時所寫：仇敵「終日」追趕、埋伏、扭曲他的話，他害怕卻不否認恐懼，轉而宣告「我倚靠神，我讚美祂的話」——神的應許與神自己密不可分，「血氣之輩能把我怎麼樣呢？」核心在第8節：「我幾次流離，你都記數；求你把我眼淚裝在你的皮袋裡。」仇敵跟蹤他的腳步是為了撲殺，神記錄他的腳步是為了顯明約中的愛；皮袋與冊子的畫面意謂神記念、在乎、永不忘記，沒有一滴眼淚白流。大衛憑信心說「神幫助我，這是我所知道的」，並在得救之前就預備感謝祭。羅8:31–32與此呼應：神連獨生子都賜下，還有什麼不肯給？若皮袋描繪神記念我們的苦，聖餐就是我們記念祂的苦；我們要把自己獻為活祭，在生命光中行在神面前。","pts":["撒但最陰險的謊言是神在苦難中離棄了我們","大衛在逃亡中仍宣告倚靠神","神的應許與神自己密不可分","神記數我們每一次流離","我們的眼淚被神收在皮袋裡","沒有一滴眼淚是白流的","最悲慟的時刻也常是與神最親近的時刻","大衛在得救前就預備感謝祭","聖餐是我們記念祂的受苦","把自己獻上當作活祭"],"mm":{"c":"天堂的淚水","b":[["處境",["逃亡迦特","仇敵終日追趕"]],["信靠",["我倚靠神","讚美祂的話","人能把我怎樣"]],["核心",["記數流離","眼淚皮袋","冊子"]],["新約",["羅8:31–32","信靠基督"]],["回應",["預先的讚美","聖餐","活祭"]],["結語",["在生命光中行走"]]]},"fw":[["問題","神看見我的眼淚嗎"],["背景","逃亡中的君王"],["一","雖被踐踏仍信靠"],["二","流離與拯救"],["應用","聖餐與活祭"]],"q":["我們所流的每一滴眼淚，對祂都有意義。","惡人跟蹤我們是要撲殺，神記錄我們的腳步是要施恩。","神幫助我，這是我所知道的。"],"fb":{"h":"你的每一滴眼淚，\n祂都收在皮袋裡。","t":"有些夜晚，眼淚停不下來。\n為了一段破碎的關係，\n為了一個沒能留住的孩子，\n為了一場拖了好幾年的病，\n為了一位再也見不到的親人。\n\n在那些夜晚，有一個聲音會悄悄說：\n「神沒有聽見。\n祂不在乎。\n你被丟下了。」\n\n這可能是撒但最陰險的謊言。\n\n三千年前，有一個人也在逃亡。\n他是被膏立的王，卻被追殺了十年，\n在曠野裡從一處躲到另一處。\n仇敵「終日」追趕他，埋伏等候他，\n連他說過的話都被扭曲。\n他寫下了詩篇第五十六篇。\n\n他沒有假裝不害怕。\n他說：「我懼怕的時候要倚靠你。」\n然後他問了一個勇敢的問題：\n「血氣之輩能把我怎麼樣呢？」\n\n接著，是整篇詩最溫柔的一句：\n「我幾次流離，你都記數；\n求你把我眼淚裝在你的皮袋裡。\n這不都記在你冊子上嗎？」\n\n請想像這個畫面：\n仇敵在數他的腳步，是為了找機會撲殺；\n神也在數他的腳步，卻是為了記念、看顧、施恩。\n同一條逃亡的路，\n兩雙眼睛在看，\n一雙充滿惡意，\n一雙滿是慈愛。\n\n天上真的有一個裝滿眼淚的倉庫嗎？\n這是詩的語言。\n但它說出了一個比任何倉庫都真實的事實：\n你的眼淚沒有白流。\n神看見了，\n祂知道，\n祂在乎，\n祂永遠不會忘記。\n\n這裡有一個奇妙的悖論：\n回首人生，那些最悲慟的時刻，\n常常也是與神最親近的時刻。\n因為在絕望裡，祂以一種平順時從未有過的方式，\n把我們緊緊抱在懷中。\n\n大衛還做了一件讓人驚訝的事：\n他還沒有得救，\n卻已經開始預備感謝祭。\n因為他說：\n「神幫助我，這是我所知道的。」\n\n而我們，知道大衛當年還不知道的事。\n那位數算我們眼淚的神，\n有一天親自來到人間，\n為我們流淚、流汗、流血。\n祂連自己的兒子都不愛惜，\n還有什麼不肯賜給我們呢？\n\n如果說那個皮袋，是神在記念我們的苦，\n那麼每一次的聖餐，\n就是我們在記念祂的苦。\n\n所以今晚，如果你又在哭，\n不必擦乾眼淚才來到祂面前。\n就這樣來吧。\n每一滴，\n都有一個去處——\n在祂的手裡，\n在祂的皮袋裡，\n在祂的心裡。\n\n終有一天，祂要親手，\n擦去你一切的眼淚。\n\n#詩篇56 #眼淚 #苦難 #神的同在 #盼望"}},{"id":22150,"slug":"ministry-partners-instagram-friends","title":"姊妹對談：建立以福音爲中心的友誼","date":"2026-03-28","author":"Courtney Doctorã€Melissa Krugerã€Ruth Chou Simonsã€Ann Voskamp","cats":["教会事工"],"tags":["恩典","友誼","榮耀"],"sum":"福音聯盟姊妹大會的對談中，克魯格、周雨柔、多克特、沃斯坎普探討「事工夥伴」為何勝過「社群媒體朋友」。以福音為中心的友誼，是與你有同樣使命觀、願意用福音對你說話——該鼓勵時鼓勵、該指正時指正的人。周雨柔多年前在大會走廊主動找到在網上被誤解的沃斯坎普，當場用福音鼓勵她，使她重寫講稿，兩人成為摯友；她家對友誼的定義是：「真正的朋友，是能讓你更愛基督的人。」好友誼的特質包括：恆久忍耐（友誼常不方便，要看別人比自己強、願意饒恕）、同在陪伴（一次又一次帶著砂鍋菜出現）、真實坦誠（不只互相吐槽，而是在混亂中用福音對話）。她們也提醒：別對友誼期待過高，孤獨是儀表板上的警示燈，提醒我們先親近基督，並主動去接觸別人；要為朋友禱告，也要先分享自己，讓人能說「我也是」。聖經的hesed（忠誠的愛）與「朋友加的傷痕出於忠誠」是友誼的模範；指正要像拿針挑刺，而不是拿大錘。地方教會是尋找這種朋友的起點：福音＋安全感＋時間。路易斯說，真正的朋友一同望向同一個方向。","pts":["事工夥伴是在使命上同行的朋友","真正的朋友讓你更愛基督","勇敢說出鼓勵人的話","友誼常常是不方便的","恆久忍耐與同在陪伴","真實坦誠不只是互相吐槽","孤獨是提醒我們親近基督的警示燈","為友誼禱告，也主動分享自己","朋友加的傷痕出於忠誠","指正要像挑刺的針，不是大錘"],"mm":{"c":"以福音為中心的友誼","b":[["定義",["共同使命","讓你更愛基督"]],["故事",["走廊相遇","重寫講稿"]],["特質",["恆久忍耐","同在","真實"]],["孤獨",["期待過高","警示燈","主動接觸"]],["聖經",["hesed","路得","箴27:6"]],["實踐",["地方教會","慢慢來","針不是大錘"]]]},"fw":[["開場","四位朋友的介紹"],["定義","何謂事工夥伴"],["見證","一次勇敢的鼓勵"],["特質","忍耐、同在、真實"],["孤獨","期待與禱告"],["聖經","hesed的愛"],["冒險","慢慢建立信任"],["結語","看見榮耀的自我"]],"q":["真正的朋友，是能讓你更愛基督的人。","真正的朋友不彼此凝視，而是一同望向同一個方向。","帶著大錘來和帶著針來，是兩回事。"],"fb":{"h":"真正的朋友，\n是讓你更愛基督的人。","t":"你的手機裡，也許有上千個「朋友」。\n你按讚他們的照片，他們回覆你的動態。\n可是當你在深夜崩潰的時候，\n有幾個人，你可以打電話？\n\n四位姊妹坐在台上，聊一個很真實的問題：\n為什麼「事工夥伴」，比社群媒體上的朋友更好？\n\n其中一位說了一個故事。\n十多年前，在一場大會的走廊上，\n她看見一位正在網上被誤解、被攻擊的講員。\n她們素未謀面，\n但她走上前去說：\n「我知道你的感受，事情一定不是他們說的那樣。」\n然後，她當場把福音講給她聽。\n那位講員回到房間，把準備好的講稿全部推翻重寫。\n後來，她們成了十多年的摯友。\n\n她家有一個對友誼的定義：\n真正的朋友，是能讓你更愛基督的人。\n\n這是一個值得想一想的命題：\n我們選擇朋友時，問的是什麼？\n她覺得我很酷嗎？\n她能幫我往上爬嗎？\n她和我品味相同嗎？\n還是——\n跟她在一起，我會不會更愛耶穌？\n\n她們說，好的友誼至少有三個特質。\n\n第一，恆久忍耐。\n沒有一段美好的友誼是方便的。\n它需要犧牲，需要看別人比自己強，\n需要在朋友讓你失望的時候，選擇饒恕。\n\n第二，同在。\n一位姊妹說，她父親過世後，\n有個朋友在一個月內來了五次。\n不是說了多少話，\n而是一次又一次地出現——\n帶著砂鍋菜，帶著鬆餅，帶著陪伴。\n\n第三，真實。\n真實不是互相吐槽。\n真實是邀請朋友走進你亂糟糟的家，\n和你更亂的心，\n然後在那些混亂裡，\n仍然用福音對彼此說話。\n\n這裡有一個對比：\n社群媒體的朋友，看見的是你精心挑選的那一面；\n事工夥伴，看見的是你需要恩典的那一面。\n前者為你按讚，\n後者為你禱告。\n前者說「你好棒」，\n後者敢說「我愛你，所以我要告訴你，這樣下去會傷了你」。\n\n聖經說：「朋友加的傷痕，出於忠誠。」\n但也要記得，指正要像挑刺的細針，\n而不是砸下來的大錘。\n\n如果你此刻覺得孤單，\n也許那份孤單，是一盞警示燈——\n提醒你先回到那位最好的朋友身邊；\n然後，也提醒你：\n有沒有人，正在等你主動走過去？\n\n路易斯說：\n真正的朋友，不是彼此凝視，\n而是肩並肩，望向同一個方向。\n\n願你身邊有這樣的朋友。\n也願你，\n成為別人生命中\n那個讓他更愛基督的人。\n\n#友誼 #事工夥伴 #社群媒體 #教會 #陪伴"}},{"id":22144,"slug":"what-we-get-wrong-about-headship","title":"我們對男人作頭的認知誤區","date":"2026-03-27","author":"Lyndon Jost","cats":["基督徒生活"],"tags":["權威","互補","作頭","職分領導權"],"sum":"保羅說「男人是女人的頭」，現代人聽來刺耳；作者相信應肯定男人作頭的教導，但也指出它很容易被誤解。第一，詞彙的意思變了：在西方，頭是大腦所在，是認知、意志與行動的中心，「頭」也代表最高權力（元首、校長、總裁），於是作頭只能被理解為支配與優越。但舊約希伯來人認為心才是智力、情感與意志的源頭，頭不能憑自己意志行動，是謙卑地為身體服務的一部分。第二，工業革命帶來性別格局的改變：之前家庭是生產中心，男女分工合作；工業化後「經濟人」出現，家庭被貶為女性領地，經濟領域成為男性特權，作頭的男性便壟斷了社會與經濟價值。第三，回到希伯來的身體觀：情感在肚腹、肝、腎，思想出於心，而頭主要是整個身體的「代表」——按頭數點人口，各父家由一個頭代表，摩西說以色列眾人近前，其實是各支派的頭。頭不是因作首領而代表，而是因代表而承擔領導。總結：現代「作頭＝統治」遮蔽了合一、責任、配合、代表的原意。","pts":["男人作頭的教導常被誤解","現代西方把頭視為支配一切的中心","希伯來人認為心才是意志的源頭","頭在希伯來觀念中謙卑地服務身體","工業革命使家庭被貶為女性領地","男性壟斷社會與經濟價值","希伯來的頭主要意謂「代表」","頭因代表而承擔領導，而非反過來","作頭原含合一、責任、配合與代表"],"mm":{"c":"作頭的認知誤區","b":[["問題",["林前11:3","刺耳的教導"]],["詞義變化",["西方：大腦與權力","希伯來：心為中心"]],["工業革命",["經濟人","家庭貶值","男性特權"]],["希伯來身體觀",["肚腹與腎","頭是代表"]],["經文例證",["按頭數點","父家之頭","申5章"]],["結論",["合一","責任","代表"]]]},"fw":[["問題","刺耳的教導"],["誤區一","現代詞彙的意思"],["誤區二","工業革命的影響"],["正源","古代近東的身體觀"],["結語","從統治回到代表"]],"q":["頭不是因為作首領而代表，而是因為作代表而承擔領導。","在希伯來人眼中，頭是身體中一個謙卑的部分。","對男人作頭的肯定，可能在不知不覺中偏離本意。"],"fb":{"h":"「頭」的意思，\n不是統治，而是代表。","t":"「男人是女人的頭。」\n這句經文，在今天聽起來非常刺耳。\n\n有人因此覺得聖經壓迫女性；\n也有人把它當作檢驗信仰是否正統的試金石。\n但一位神學家提出了一個值得停下來想的問題：\n我們聽到的「頭」，\n和聖經作者說的「頭」，\n是同一個意思嗎？\n\n在今天的西方文化裡，\n頭是大腦所在的地方，\n是思想、意志、決定、行動的總指揮。\n而在社會上，「頭」代表最高的位置：\n元首、校長、總裁、一家之主。\n在這樣的語境裡，\n「男人作頭」只能被理解成一件事：\n支配，和高人一等。\n\n但在舊約希伯來人的觀念裡，\n思想、情感和意志的中心，\n不是頭，\n而是心。\n憐憫在肚腹，喜樂在肝，善惡在腎，\n而頭，並不能憑自己的意志行動。\n它是身體謙卑的一部分，\n為整個身體服務。\n\n那麼，「頭」在聖經裡到底是什麼意思？\n\n作者指出，舊約裡的「頭」，最根本的意思是「代表」。\n數點人口時，是「按著頭」數；\n每一個家族，由一個「頭」代表；\n當摩西說「以色列眾人都近前來」，\n實際上走上前去的，是各支派的頭。\n頭，就是代表整個身體去看、去聽、去近前的那一位。\n\n這裡有一個關鍵的翻轉：\n頭不是因為作首領，才代表身體；\n而是因為代表身體，才承擔起帶領的責任。\n它的一切權柄，都和它所代表的身體的益處綁在一起。\n\n那為什麼今天我們會理解成「統治」？\n除了詞義的改變，\n還有一段歷史。\n在工業革命以前，家庭是生產的中心，\n男女在田裡、家裡各有分工，彼此配合。\n工業化之後，經濟活動離開了家，\n家被貶為「女人的地方」，\n外面的世界成了男人的特權。\n於是，「作頭」的男人，\n掌握了幾乎所有的社會與經濟價值。\n\n這不是聖經的原意，\n而是一段歷史和罪性交織出來的誤讀。\n\n當然，作者並沒有否定男人作頭的教導，\n而是要把它從現代的框架中救出來，\n還原它原本的樣貌：\n合一，\n責任，\n彼此配合，\n代表。\n\n也許最好的例子，\n就是那位真正的「頭」——基督。\n祂作教會的頭，\n不是坐在高處發號施令，\n而是彎腰為門徒洗腳，\n是代替我們，\n走上了十字架。\n\n作頭，\n從來不是為了站得比別人高，\n而是為了\n在最危險的地方，\n站在最前面。\n\n#作頭 #婚姻 #聖經詮釋 #互補 #性別"}},{"id":22142,"slug":"sharing-gospel-meeting-lost","title":"傳福音，從走出基督徒圈子開始","date":"2026-03-27","author":"Andrea Mathews","cats":["基督徒生活"],"tags":["傳福音","鄰舍","健身"],"sum":"作者讀神學院時有門課要求每週向一位未信主的朋友傳福音並交報告，難處不在開口，而在於大家生活中全是基督徒。若平時連與非信徒深入交流的機會都沒有，又怎能傳福音？她建議有意識地調整生活，與需要福音的人產生交集：一、讓愛好成為橋梁——報社區美術班、匹克球、語言交換；二、固定時段去健身房，熟面孔自然聊起來，她新婚時在健身課結識了信與不信的好友；三、走進學校當助教、志工、教練或代課，參加比賽與演出；四、成為餐廳或咖啡店的常客，記住店員名字、多給小費、邀請他們來教會；五、主動開啟跨信仰對話——耶和華見證人或摩門教傳教士敲門時請他們進來，留意有宗教背景的鄰居，在節日表達善意、問得體的問題；六、和鄰居拉家常——幫忙提重物、送餅乾自我介紹；七、列出身邊不信主的親友名單，為他們禱告並計劃聯絡。神按主權把我們安置在特定時空（徒17:26），身邊的人或許正是神預備要藉我們得救的人。","pts":["許多基督徒生活中全是基督徒","沒有交集就無法傳福音","讓愛好成為與人相遇的橋梁","固定去健身房結識熟面孔","走進學校服事社區","成為店家常客，真心關心店員","勇敢與其他信仰的人對話","刻意與鄰居建立關係","列出未信親友名單並為他們禱告","神把我們安置在特定的時空"],"mm":{"c":"走出基督徒圈子","b":[["問題",["生活全是信徒","無從傳福音"]],["興趣與運動",["社區課程","健身房"]],["社區",["學校志工","店家常客"]],["跨信仰",["請傳教士進門","尊重的提問"]],["鄰里與親友",["拉家常","送餅乾","名單禱告"]],["主權",["徒17:26","神預備的人"]]]},"fw":[["引子","一門傳福音作業"],["問題","困在基督徒圈子裡"],["方法一至三","愛好、健身、學校"],["方法四至五","常客與跨信仰對話"],["方法六至七","鄰居與名單"],["結語","神安置我們的地方"]],"q":["如果平時連與不信的人交流都沒有，又怎麼向他們傳講好消息？","你身邊的未信者，或許正是神預備藉著你領受救恩的人。","我們要刻意建立關係，為的是把福音帶給他們。"],"fb":{"h":"你最後一次和不信主的朋友\n深聊，是什麼時候？","t":"一位神學生，修了一門很特別的課。\n作業是：每週向至少一位不信主的人分享福音，\n然後交一份報告。\n\n聽起來不難。\n真正做的時候，大家卻卡住了。\n不是因為不敢開口，\n而是因為——\n他們身邊，幾乎沒有不信主的人。\n\n這也許是很多基督徒的寫照。\n週日在教會，週三在小組，週五在團契，\n朋友是基督徒，同工是基督徒，\n連聚餐、旅行、聊天的對象，都是基督徒。\n我們很愛福音，\n卻沒有機會，對需要福音的人說話。\n\n這裡有一個值得反省的問題：\n如果我們的生活和不信的人沒有交集，\n大使命，還能怎麼實現？\n\n作者給了幾個很實際的建議。\n\n讓興趣成為橋樑。\n報一個社區美術班，加入一群打匹克球的人，\n找一個語言交換夥伴。\n\n固定時間去健身房。\n久了，自然會有熟面孔，自然聊得起來。\n她和丈夫新婚時參加的健身課，\n後來成了他們最好的朋友圈，有信的，也有不信的。\n\n走進學校。\n當志工、當助教、當教練，\n去看學生的球賽和音樂會。\n\n成為一家店的常客。\n記住店員的名字，下次叫得出來；\n真心關心他，給多一點小費，待人有禮。\n\n別再在耶和華見證人或摩門教傳教士敲門時關燈裝不在家。\n請他們進來，認真聽，\n然後帶著愛心，分享真正的福音。\n\n認識你的鄰居。\n幫他提重物，送一盤剛烤好的餅乾，\n停下來問一句：「最近好嗎？」\n\n最後，列一份名單。\n那位很久沒聯絡的表哥，那位大學同學，\n那位隔壁部門、幾乎沒說過話的同事。\n為名單上的每一個人禱告，\n然後計劃怎麼聯絡他們。\n\n這裡有一個認知的翻轉：\n我們常以為傳福音最難的是開口，\n其實最難的，常常是走出舒適圈；\n我們以為要先等機會出現，\n其實機會，常常需要我們刻意去創造。\n\n使徒行傳說：\n神「預先定準他們的年限和所住的疆界」。\n你住在這條街，\n在這間公司上班，\n常去這家咖啡店，\n都不是偶然。\n\n也許你身邊那個人，\n正是神預備好，\n要藉著你聽見福音的人。\n\n這是何等的尊榮。\n\n今天，就從一件小事開始吧：\n記住一個名字，\n敲一扇門，\n或者，\n傳一則問候給那個\n很久沒聯絡的人。\n\n#傳福音 #鄰舍 #大使命 #宣教生活 #舒適圈"}},{"id":22139,"slug":"gospel-better-news-wokeness","title":"爲何福音比覺醒主義更具美","date":"2026-03-26","author":"Neil Shenviã€Pat Sawyer","cats":["社会与时事"],"tags":["無神論","批判理論","覺醒","覺醒主義"],"sum":"史密森尼學會稱科學方法與客觀理性是「白人文化」的特徵，有自稱基督徒的作者宣稱神是黑人跨性別女性，媒體說跨性別運動員沒有生理優勢——這些都是「覺醒主義」的表現，其本質是批判理論：社會按種族、階級、性別劃分為壓迫者與被壓迫者，統治群體以霸權強加價值，被壓迫者藉親身經歷擁有特殊認知，正義需要解構壓迫制度。多數人不是讀了理論家才陷入覺醒主義，而是吸收了文化中無所不在的壓迫與解放敘事，所以基督徒要講更好的故事。一、身份：批判理論的身份是橫向的群體歸屬，造成「共同敵人」的政治與憤怒、敵意、焦慮；基督教的身份首先是垂直的——神的形像、在亞當裡墮落、在基督裡聯合，塑造愛、饒恕、和平的群體。二、真理：批判理論讓被壓迫者的經驗近乎不可質疑，引發競相自貶；基督教說我們都是會犯錯的罪人，要向外尋求神在聖經與自然中的啟示，帶來謙卑與開放。三、問題與解答：批判理論說問題在外、解方在內，把人綁在行為稱義的跑步機上；聖經說問題在內——我們都是罪人，解方在外——基督代死復活。新無神論被覺醒主義吞噬，因人不只靠邏輯活，而渴望故事；福音是真實世界的真實敘事。","pts":["覺醒主義的本質是批判理論","多數人是吸收了文化敘事，而非讀了理論","基督徒要講一個更好的故事","批判理論的身份是橫向的群體歸屬","基督教的身份首先是垂直的","批判理論以親身經驗為不可質疑的權威","基督教要人謙卑地向外尋求真理","批判理論說問題在外、解方在內","福音說問題在內、解方在外","人渴望故事，福音是真實的故事"],"mm":{"c":"福音勝過覺醒主義","b":[["現象",["科學是白人文化","神是黑人跨性別女性"]],["批判理論",["壓迫者與被壓迫者","霸權","親身經驗"]],["身份",["橫向群體","垂直身份","共同人性"]],["真理",["經驗至上","向外尋求","謙卑"]],["罪與救贖",["問題在內","解方在外","行為稱義的跑步機"]],["故事",["新無神論的教訓","真實的敘事"]]]},"fw":[["現象","覺醒主義的文化產物"],["定義","批判理論的主張"],["問題一","我是誰"],["問題二","何為真理"],["問題三","世界出了什麼問題"],["教訓","新無神論的警示"],["結論","更宏大的真實故事"]],"q":["用枯燥的科學事實取代宏大的敘事，無異於用洗衣機說明書替代《魔戒》。","我們無法自救，但神已在基督裡為我們成就。","基督教的故事，是真實世界的真實敘事。"],"fb":{"h":"世界說問題在外面，\n福音說問題在心裡。","t":"這個時代有一個很強大的故事。\n\n它告訴你：\n世界分成兩群人——壓迫者和被壓迫者。\n你屬於哪一群，取決於你的種族、性別、階級。\n壓迫者看不見真相，\n被壓迫者的親身經歷，就是真理。\n只要拆毀那些壓迫的制度，\n世界就會變好。\n\n這個故事，有人叫它「覺醒主義」，\n背後是一套叫做「批判理論」的思想。\n大多數人不是讀了艱深的理論著作才相信它，\n而是在新聞、電影、社群、課堂裡，\n一點一點吸收了這個故事。\n\n所以，基督徒要回應的，\n不只是一套理論，\n而是一個故事。\n我們需要講一個更好的故事。\n\n第一個問題：我是誰？\n這個時代說：你的身份，來自你屬於哪個群體。\n於是，人被分成「我們」和「他們」，\n站在正確一邊的是好人，\n另一邊的，是需要被打倒的敵人。\n憤怒、敵意、焦慮，就這樣成了日常。\n\n福音說：你的身份首先是垂直的。\n你是按神形像造的，\n你和所有人一樣在亞當裡墮落，\n你在基督裡，和萬族萬民成為一家人。\n這樣的身份，塑造出的群體，\n不是靠共同的敵人凝聚，\n而是靠共同的恩典。\n\n第二個問題：什麼是真理？\n這個時代說：真理在你的親身經歷裡，\n越被壓迫，越有發言權。\n於是，人們競相證明自己是最受壓迫的那一個。\n\n福音說：我們都是會犯錯的罪人，\n真理不在我們裡面，\n而在神的啟示中。\n這不是貶低經驗，\n而是讓每一個人都謙卑下來，\n承認自己有盲點，需要被聖經和弟兄姊妹修正。\n\n第三個問題：世界出了什麼問題？\n這裡，是最根本的翻轉。\n\n這個時代說：問題在外面——是別人、是制度、是那群有權的人；\n解決方法在裡面——我要覺醒、我要行動、我要證明自己站在對的一邊。\n\n福音說：問題在裡面——我們每一個人都是罪人；\n解決方法在外面——神差祂的兒子，為我們死，為我們復活。\n\n前者讓人永遠在一台跑步機上奔跑，\n不停地插標語、轉貼文、表態，\n想證明自己夠好；\n後者讓人停下來，\n領受一份白白的赦免。\n\n十多年前，一群無神論者想用科學與理性取代宗教，\n結果不到十年，他們的運動就被這個新故事吞沒了。\n為什麼？\n因為人不只靠邏輯活著，\n人需要故事、意義、目的。\n用冰冷的事實取代偉大的敘事，\n就像拿洗衣機說明書，去取代《魔戒》。\n\n所以，我們不只要證明這個時代的故事錯了，\n更要講出那個更大、更真實的故事：\n我們曾站在錯的一邊，\n是叛逆的、該被定罪的；\n但偉大的創造主親自降世，付上極大的代價，\n把我們贖回，\n帶進一個萬族萬民一同敬拜的國度，\n直到祂再來，\n使萬物都更新。\n\n這不是神話。\n這是真實世界，\n最真實的故事。\n\n#覺醒主義 #批判理論 #福音 #身份 #世界觀"}},{"id":22132,"slug":"jane-austen-life-faith","title":"簡·奧斯汀文學創作的靈魂：基督教世界觀","date":"2026-03-26","author":"Deanna Rogers","cats":["文化与艺术"],"tags":["小說","簡·奧斯汀","經典文學"],"sum":"在奧斯汀250週年誕辰之際，一位英文教授在研討課開學時帶學生讀奧斯汀的禱告詞，學生驚訝發現她的文學造詣源於敬虔家庭薰陶出的基督徒世界觀。她父親是史蒂文頓教區牧師，哥哥亨利後來也受按立，她最推崇約翰遜與庫珀等基督教道德作家；家中依循聖公會傳統每日晨昏禱告。她留下的三篇禱告詞強調漸進的信仰：求神讓我們更敏銳地感悟救贖的憐憫，不因疏忽丟棄救恩，不只做掛名基督徒；也為身心健康與每日的快樂源頭感恩。她的生活並不順遂：兩個哥哥在海軍服役令家人牽掛，父親去世後失去住所，三位女性在拮据中搬遷，最後落腳喬頓小舍——卻在此進入創作高峰，修訂並寫出多部名著。她禱告求一顆感恩的心，不因不滿而失落恩典。墓碑稱她的仁愛、敬虔、信心、純潔使她蒙救贖主悅納。她的小說刻畫了埃德蒙、範妮等正面的基督徒角色，看重責任與良知；她也開創了家庭場景的小說，讓女性發聲，如《理智與情感》中達什伍德一家的處境呼應她的經歷，為女性法律地位的提升做出貢獻。","pts":["奧斯汀的文學造詣源於基督徒世界觀","她生長在敬虔的牧師家庭","她的禱告詞強調漸進的信仰與感恩","求神使我們不只做掛名的基督徒","她在逆境與拮据中仍持守信仰","困苦中她進入創作高峰","她禱告求一顆知足感恩的心","小說中有正面的基督徒角色","她讓家庭場景與女性處境進入文學"],"mm":{"c":"奧斯汀的信仰","b":[["家庭",["牧師父親","哥哥亨利","晨昏禱告"]],["禱告",["感悟救贖","不做掛名信徒","每日感恩"]],["逆境",["海軍哥哥","父親去世","喬頓小舍"]],["知足",["腓4:6","感恩的心"]],["作品",["埃德蒙","範妮","責任與良知"]],["影響",["家庭場景","女性發聲"]]]},"fw":[["引子","課堂上的禱告詞"],["家庭","敬虔的成長環境"],["禱告","感恩的信仰"],["逆境","扎根的信仰"],["作品","小說中的信仰"],["紀念","活出的信仰生命"]],"q":["求你賜給我們一顆感恩的心，使我們能體察當下的福分。","願我們不只做掛名的基督徒。","我們慶祝的不只是她的文學才華，更是一個活出的信仰生命。"],"fb":{"h":"在客廳與舞會之間，\n她每天跪下禱告。","t":"提起簡·奧斯汀，\n你會想到什麼？\n《傲慢與偏見》裡的伊麗莎白和達西先生，\n英國鄉間的舞會、莊園、書信、誤會與和好。\n\n但很少人知道，\n這位寫出無數浪漫故事的女作家，\n每天早晚，都和家人一起禱告。\n\n她出生在一個牧師家庭。\n父親一生牧養同一個鄉村教區，\n她最親近的哥哥後來也成了牧師。\n她最喜愛的作家，是那些寫道德與信仰的散文家和詩人。\n\n她留下了三篇禱告詞。\n其中一篇這樣求：\n「求你使我們更敏銳地感悟你救贖世人的憐憫，\n願我們不至因自己的疏忽丟棄你所賜的救恩，\n也不願只做掛名的基督徒。」\n\n不只做掛名的基督徒。\n兩百多年前的這句禱告，\n今天讀來，仍然扎心。\n\n她的生活並不順遂。\n兩個哥哥在海軍服役，家人日夜擔心他們的安危。\n父親過世後，她們失去了住處，\n三個女人帶著微薄的收入四處搬遷，\n最後才在一間小屋安頓下來，\n過著精打細算的日子。\n\n可就在這段拮据的歲月裡，\n她修訂了《傲慢與偏見》《理智與情感》，\n又寫出了《曼斯菲爾德莊園》《愛瑪》《勸導》。\n\n這裡有一個值得深思的對比：\n我們常以為，作家的偉大來自於豐富的經歷與優渥的環境；\n但在她的禱告裡，我們看見另一種力量——\n知足。\n\n她寫道：\n「求你賜給我們一顆感恩的心，\n使我們能體察當下的福分，\n不至於因心懷不滿或冷漠荒廢，\n白白失落了這些恩典。」\n\n不是求環境改變，\n而是求心被改變。\n\n她在四十一歲時離世。\n家人在墓碑上寫下：\n那些最了解她的人，因著一個堅定而謙卑的盼望得到安慰——\n深信她的仁愛、敬虔、信心與純潔，\n已使她的靈魂在救贖主眼中蒙悅納。\n\n她的信仰，也悄悄流進她的小說。\n她筆下有正直、穩重的基督徒角色，\n看重責任與良知；\n她把文學的鏡頭，對準客廳裡瑣碎的日常，\n讓那些在家庭與財產制度下無聲的女性，\n有了被看見的機會。\n\n認知的翻轉在這裡：\n我們以為信仰會限制藝術，\n其實真實的信仰，常常讓藝術看得更深、更溫柔；\n我們以為偉大必須轟轟烈烈，\n其實偉大，也可以藏在一句每天早晚的禱告裡。\n\n兩百五十年過去了，\n她的書仍被一代又一代的人捧在手裡。\n但對基督徒來說，\n我們紀念的，不只是一位天才作家，\n更是一個在平凡、拮据、不確定的日子裡，\n仍然選擇感恩、\n選擇信靠、\n選擇不只做掛名基督徒的\n女人。\n\n#簡奧斯汀 #文學 #禱告 #知足 #信仰與藝術"}},{"id":22129,"slug":"where-the-gospel-still-costs-everything","title":"有的地方仍然要爲福音付出極大代價","date":"2026-03-26","author":"Steve Lambert","cats":["社会与时事"],"tags":["宣教","宣教士","差派"],"sum":"作者的教會在1930年代差派宣教士霍恩前往巴西，她創辦的小小女子聖經學校，九十年後發展成「巴西伯特利」：聖經學院與神學院培養數千學生，150間教會，52個宣教家庭分佈15國，還有救助與出版事工。作者赴巴西參加90週年，聽到震撼的見證：羅納爾多團隊沿亞馬遜河航行五日，進入300多種語言的部落傳福音、建立教會、翻譯聖經，如今更徒步深入叢林，尋找那些逃避外人的部落；一位在孟加拉向印度教徒與穆斯林傳福音的寡婦，丈夫過世後把人壽保險金拿來蓋完教堂，獨自撫養三個孩子，並說：「不要為我們免遭迫害禱告，求神讓我們在迫害中持守忠心。」前男孩樂團主唱亞歷山大捨棄名利，燒掉不義之財，與妻子在西非尼日服事，住所被博科聖地燒毀，仍喜樂地收養了十九個孩子。許多人感謝作者的教會派了霍恩，但作者坦言，教會已四十多年沒有差派長期宣教士。他們正禱告，求神幫助教會呼召會眾愛主勝過安逸，並揀選祂要差遣的人。","pts":["一位宣教士的小學校發展成全球事工","福音的種子能結出數代的果子","宣教士深入亞馬遜叢林尋找隱藏的部落","寡婦用保險金蓋完教堂","不求免受迫害，求在迫害中忠心","前偶像歌手捨棄一切去尼日服事","他們信靠神的程度遠超我們","教會已多年沒有差派宣教士","要愛主耶穌勝過安逸的生活","求神揀選祂要差遣的人"],"mm":{"c":"福音的代價","b":[["起點",["霍恩","1934年","女子聖經學校"]],["果子",["巴西伯特利","150間教會","15國宣教"]],["亞馬遜",["羅納爾多","300種語言","隱藏部落"]],["孟加拉",["寡婦","保險金蓋教堂","忠心的禱告"]],["尼日",["前偶像歌手","博科聖地","收養孩子"]],["反省",["四十年未差派","愛主勝過安逸"]]]},"fw":[["起點","九十年前的差派"],["果子","巴西伯特利"],["見證一","亞馬遜叢林"],["見證二","孟加拉的寡婦"],["見證三","尼日的宣教士"],["反省","我們的教會怎麼了"],["呼召","一同禱告"]],"q":["不要為我們免遭迫害禱告，求神讓我們在迫害來臨時持守忠心。","我們對神的信靠，遠不及他們。","要愛主耶穌勝過愛安逸的生活。"],"fb":{"h":"不要求免受逼迫，\n只求在逼迫中忠心。","t":"1934年，一位年輕的女孩搭船抵達巴西。\n第二年，她辦了一間小小的女子聖經學校。\n\n九十年後，\n那間小學校長成了一個遍布全國的事工：\n聖經學院和神學院培養了數千名學生，\n建立了一百五十間教會，\n差派了五十二個宣教家庭到十五個國家，\n還有救助孤兒寡婦的工作，和出版福音書籍的機構。\n\n一顆種子，\n九十年，\n長成一片森林。\n\n差派她的那間加拿大教會的牧師，受邀去參加九十週年慶典。\n他在那裡聽見的見證，讓他久久說不出話。\n\n有一位宣教士，和團隊沿著亞馬遜河航行五天，\n深入只說自己部落語言的村莊傳福音、建立教會、翻譯聖經。\n能坐船到的地方都去完了，\n剩下的部落藏在叢林深處，一見外人就逃。\n於是他們徒步走進叢林好幾天，\n衛星電話收不到訊號，\n晚上要小心選擇地方，免得被野獸攻擊——\n只為了讓那些從未聽過的人，聽見耶穌的名字。\n\n有一位寡婦，\n和丈夫在南亞向印度教徒與穆斯林傳福音。\n教會建立了，信徒卻開始受逼迫，\n他們只能坐在一張綁在框架上的防水布下聚會。\n後來丈夫過世，留下一筆人壽保險。\n多數人會勸她：帶著孩子，去一個安全的地方生活吧。\n她卻把那筆錢，拿去蓋完了教堂。\n然後她說：\n「不要為我們免受逼迫禱告。\n耶穌早就說過，我們必受逼迫。\n求神讓我們在逼迫來臨時，仍能持守忠心。」\n\n還有一位，曾是全國知名的男孩樂團主唱。\n他本可以名利雙收，\n卻為了跟隨耶穌，把用不義手段得來的財物全部燒了。\n如今他和妻子在西非一個最危險的國家服事。\n他給大家看一張照片——\n極端組織燒毀他的家，他站在焦黑的廢墟中。\n而他們，收養了十九個孩子，\n仍然喜樂地留在那裡。\n\n這裡有一個讓人無法迴避的問題：\n當我們聽見這些故事，\n是只覺得感動，\n還是被逼著看見——\n我們大多數人，從來沒有這樣活過？\n\n那位牧師誠實地說：\n很多人跑來感謝他們教會當年差派了那位女孩。\n可是，他們教會已經四十多年，沒有再差派長期宣教士了。\n\n這是一個扎心的翻轉：\n我們以為自己很支持宣教——我們有宣教預算、有代禱名單；\n但真正的問題是：\n我們還願意差派自己的兒女嗎？\n我們還願意，讓自己被差派嗎？\n\n他說，他們教會開始一起禱告：\n求神幫助我們愛主耶穌，勝過愛安逸的生活；\n求神揀選祂要差遣的人。\n\n你願意，\n和他們一起這樣禱告嗎？\n\n#宣教 #逼迫 #巴西 #大使命 #忠心"}},{"id":22122,"slug":"when-i-wake-up","title":"醒來後，先聽祂的聲音","date":"2026-03-25","author":"Andrew Prideaux","cats":["信仰与工作"],"tags":["禱告","讀經","習慣"],"sum":"對抑鬱的人來說，早上不鑽回被窩很難，因為一醒來，那些負面念頭與焦慮就撲過來——朋友稱之為「清晨怪獸」。作者想談醒來之後做什麼。許多人先看新聞，耳朵塞滿戰爭與兇案，或刷手機用八卦麻醉自己；運動很好，但念頭如影隨形；正念冥想能讓人慢下來，但仍要問：是什麼在引導我們的認知與渴望？各種聲音爭奪我們的注意力，使混亂的腦袋更混亂。作者建議從聆聽神的聲音開始：翻開聖經時，天父藉聖靈向我們講述祂的兒子——「這是我的愛子，你們要聽祂。」我們聽見自己在基督裡已蒙赦免、潔淨、接納，「東離西有多遠，祂叫我們的過犯離我們也有多遠」；神若幫助我們，誰能敵擋？我們是神的兒女，與基督一同受苦也必一同得榮耀。他偏好紙本聖經與紙筆，因為電子設備容易讓人分心；用電子設備也可以，但要關掉通知。耶穌說人活著是靠神口裡所出的一切話；讀經與禱告不是規則，而是信心的主要表達。當我來到神的話語面前，我才真正醒來——記起神是誰、我是誰、該如何生活。","pts":["抑鬱的人常害怕醒來面對的念頭","醒來先看新聞或手機只會更混亂","運動與冥想有益，但不夠","要問：是什麼在塑造我們的渴望？","每天從聆聽神的聲音開始","在神的話中確知自己蒙赦免與接納","我們是神深愛的兒女","紙本聖經能幫助專注","讀經禱告是信心的主要表達","來到神的話語面前，才真正醒來"],"mm":{"c":"醒來後先聽祂","b":[["清晨怪獸",["抑鬱","負面念頭"]],["喧囂",["新聞","滑手機","運動","冥想"]],["神的聲音",["可9:7","詩103:12–14","羅8:31–32"]],["身份",["神的兒女","與基督同受苦同得榮"]],["方法",["紙本聖經","筆記本","關掉通知"]],["醒來",["太4:4","弗5:14"]]]},"fw":[["困境","清晨怪獸"],["選項","各種喧囂的聲音"],["答案","聆聽神的聲音"],["方法","紙本聖經的好處"],["實踐","過好每個清晨"]],"q":["當我來到神的話語面前時，我才真正醒來。","人活著，不是單靠食物，乃是靠神口裡所出的一切話。","眼前的磨難，不會讓我們在神眼中貶值。"],"fb":{"h":"醒來的第一個聲音，\n決定你一整天聽見什麼。","t":"有些早晨，最難的不是起床，\n而是醒來之後要面對的那些念頭。\n\n對抑鬱的人來說，睡眠像一個避風港。\n睡著了，就聽不到腦子裡那些沒完沒了的負面聲音；\n一睜開眼，焦慮、虛無、自責，就一擁而上。\n有個朋友給它取了一個名字：\n「清晨怪獸」。\n\n那麼，醒來之後，我們做的第一件事是什麼？\n\n很多人是滑手機。\n看新聞——戰爭、兇殺、災難、股市；\n或者看八卦、看短影音，讓自己麻木一點。\n可是一早就把這些聲音灌進耳朵，\n腦袋只會更吵。\n\n有人去運動。\n這很好，身體動起來了；\n但念頭會一路跟著你跑。\n\n有人練習冥想、正念。\n慢下來、深呼吸，這也是一份禮物；\n但還有一個更深的問題：\n到底是什麼，在塑造我的思想？\n又是什麼，在引導我心裡的渴望？\n\n每天早晨，都有無數聲音在搶奪我們的注意力。\n而一位校園事工同工建議：\n讓第一個聲音，\n是神的聲音。\n\n當我們翻開聖經，\n天父藉著聖靈，向我們講述祂的兒子——\n「這是我的愛子，你們要聽祂。」\n\n我們聽見：\n「東離西有多遠，祂叫我們的過犯離我們也有多遠。\n父親怎樣憐恤他的兒女，\n耶和華也怎樣憐恤敬畏祂的人；\n因為祂知道我們的本體，\n思念我們不過是塵土。」\n\n我們聽見：\n「神若幫助我們，誰能敵擋我們呢？」\n\n我們聽見：\n你不是奴僕，你是兒女；\n你今天所受的苦，不會讓你在神眼中貶值。\n\n這裡有一個重要的翻轉：\n清晨怪獸說：「你不夠好。」\n神的話說：「你已被接納。」\n新聞說：「世界要崩塌了。」\n神的話說：「我在掌權。」\n社群說：「看看別人過得多好。」\n神的話說：「我知道你的本體，我憐恤你。」\n\n他還有一個有點老派的建議：\n用一本紙本聖經。\n因為手機和平板，總讓我們聯想到工作和娛樂，\n一個通知、一次滑動，就分心了。\n拿一支筆，一本筆記本，\n慢慢讀，慢慢寫，慢慢禱告。\n當然，如果電子設備對你有幫助，就關掉通知，好好用它。\n\n耶穌說：\n「人活著，不是單靠食物，\n乃是靠神口裡所出的一切話。」\n讀經禱告，不是一條必須遵守的規則，\n而是我們對天父信靠的表達，\n是一整天力量的來源。\n\n每一個早晨，我們都面對同一個選擇：\n讓哪一個聲音，先進來？\n\n他說：\n當我來到神的話語面前，\n我才真正醒來。\n我記起神是誰，\n我是誰，\n我為什麼活著。\n\n「你這睡著的人，當醒過來，\n從死裡復活，\n基督就要光照你了。」\n\n明天早上，\n在伸手拿手機之前，\n先翻開那本書。\n讓第一道光，\n照進你的心。\n\n#靈修 #讀經 #抑鬱 #清晨 #神的話語"}},{"id":22116,"slug":"how-not-fence-communion","title":"罪中掙扎的基督徒應該自罰停領主餐嗎？","date":"2026-03-24","author":"Sean Demars","cats":["圣经与神学"],"tags":["恩典","主餐"],"sum":"作者回憶自己曾在主餐時呆坐不動：牧師剛提醒「心裡有未處理的罪就先別領」，他便反覆審查自己這週的過犯，主餐桌變成一場注定考砸的考試。改革宗教會常「圍護主餐」，提醒未受洗未認信者不要領，這是對的；但有些做法過頭，讓基督徒焦慮地內省、自我棄權。作者指出，林前11章保羅責備「不分辨主的身子」，是針對哥林多教會的群體罪：有人先吃、有人捱餓，富人羞辱窮人，主餐本該宣告合一，卻暴露了分裂；「省察自己」是檢視自己如何對待群體中的其他人。新約中停領主餐是關係破裂或教會正式紀律的結果（林前5、太18、帖後3），不是個人虔誠的表現。若與弟兄關係破裂，可暫時不領，盡快去和好（太5:23–24），但不應長期；因覺得自己「不夠虔誠」而不領，是自我驅逐，應完全避免。主餐是基督賜給渴求恩典之罪人的禮物，不是給表現不完美之人的懲罰；正與罪掙扎的人，更該帶著飢渴來到桌前。只有非信徒與受教會紀律處分者才應被擋在桌外。","pts":["主餐不應成為一場焦慮的考試","圍護主餐是對的，但不應過頭","林前11章責備的是群體的分裂","「省察自己」是檢視自己如何對待肢體","停領主餐是關係破裂或教會紀律的結果","與人關係破裂時，應盡快去和好","因覺得不夠虔誠而不領，是自我驅逐","主餐是給渴求恩典之罪人的禮物","掙扎的基督徒更該來到主的桌前"],"mm":{"c":"掙扎中仍來到主餐桌","b":[["經歷",["呆坐座位","內心審訊"]],["圍護主餐",["未受洗者","過頭的做法"]],["保羅原意",["群體分裂","富人羞辱窮人","分辨主的身子"]],["停領的情況",["教會紀律","關係破裂","太5:23–24"]],["錯誤",["自我驅逐","不夠虔誠"]],["恩典",["飢渴慕義","太26:28","給罪人的禮物"]]]},"fw":[["經歷","不敢領主餐的我"],["現象","圍護主餐的過度"],["經文","保羅呼籲群體合一"],["原則","何時應停領"],["邀請","來到恩典的桌前"]],"q":["主餐是基督賜給渴求恩典之罪人的禮物，不是給不完美之人的懲罰。","保羅不是叫人等覺得自己潔淨了再來，而是叫人停止彼此輕看。","當基督徒正與私慾爭戰，主餐桌正是他們最該去的地方。"],"fb":{"h":"主餐不是考試，\n是給飢渴罪人的筵席。","t":"全會眾起身走向主餐桌，\n他卻坐在位子上，一動也不敢動。\n\n幾分鐘前，牧師提醒大家：\n「如果你心裡還有沒對付的罪，就先別領。」\n於是他開始在腦海裡重播這一週：\n那句不該說的話，那個不該有的念頭，那件沒做好的事。\n我配嗎？\n我會不會吃喝自己的罪？\n\n那一刻，主餐桌對他來說，\n不是恩典的筵席，\n而是一場註定考不及格的考試。\n\n很多基督徒都有過這樣的經驗。\n每到聖餐，大家低下頭，開始一場無聲的內心審訊：\n我這週表現如何？\n我有資格嗎？\n我要不要自己放棄？\n\n但一位牧師提出了一個重要的問題：\n保羅說「人應當自己省察」，\n真的是這個意思嗎？\n\n回到哥林多前書十一章的背景：\n哥林多教會的聖餐聚會，\n有人自己先吃飽喝足，\n有人卻餓著肚子；\n有錢人讓窮人在眾人面前抬不起頭。\n本該宣告「我們雖多，仍是一個身體」的筵席，\n成了教會分裂的公開展示。\n\n所以保羅說的「不分辨主的身體」，\n不是叫每個人關起門來翻找私人的罪狀，\n而是叫整個教會看看：\n我們是怎樣對待彼此的？\n我們是在拆散基督聯合起來的身體嗎？\n\n一位學者說得很清楚：\n保羅的警告，不是針對那些軟弱、渴望赦免的人，\n而是針對那些在主的桌前，行為羞辱了這份神聖的人。\n\n那麼，什麼時候該停止領主餐？\n在新約裡，那是教會紀律的結果——\n對那些執意不悔改的人。\n或者，當你知道你和弟兄之間有嫌隙，\n可以暫時停下，先去和好，再回來。\n但這不該拖得很久。\n\n而那種「我覺得自己不夠好，所以不領」的做法，\n其實是一種自我驅逐，\n保羅從來沒有這樣要求。\n\n這裡有一個溫暖的翻轉：\n我們以為要先變乾淨，才能來到桌前；\n其實正因為我們不乾淨，才需要這張桌子。\n我們以為主餐是給屬靈表現好的人的獎賞，\n其實它是給渴求恩典的罪人的禮物。\n\n如果你此刻正在和某個罪掙扎，\n覺得重擔壓得喘不過氣，\n那你更應該來。\n帶著飢渴慕義的心，\n來領受那為你擘開的身體，\n為你流出、使罪得赦的寶血。\n\n如果你覺得自己不配——\n記得，\n若不是基督在十字架上成就了一切，\n沒有一個人配與神相交。\n\n所以，下一次聖餐，\n別再呆坐在位子上了。\n站起來，\n走向那張桌子。\n那裡，有一位主在等你，\n祂說：\n「凡勞苦擔重擔的，\n到我這裡來。」\n\n#聖餐 #主餐 #恩典 #悔改 #教會合一"}},{"id":22114,"slug":"pastoral-ministry-worth-pursuing","title":"爲什麼今天仍然值得投身教牧服事","date":"2026-03-23","author":"George Robertson","cats":["教会事工"],"tags":["牧師","呼召","全職"],"sum":"作者每年與兩組主任牧師聚會分享一年的心碎、讚美與盼望，最後總結：福音事工中值得讚美的事遠多於心痛。過去五年牧者特別艱難，有人懷疑呼召，甚至把事奉描繪得只剩挫敗，打消年輕人投身的念頭。作者從林後2:12–3:6說明牧職的尊貴：一、講道的重要——神「常率領我們在基督裡誇勝」，傳道人是基督的特使，顯揚認識基督的香氣；同一信息叫人得生或至死，所以預備講章是極具永恆價值的屬靈操練，緊張會昇華為敬畏。二、個人牧養的殊榮——「你們就是我們的薦信」，是為父的慈愛而非公事公辦；牧者把羊放在心上，為他們徹夜禱告；更是聖靈手中的筆，參與在人心版上的成聖之工；成功不在多少人跟隨我們，而在他們是否與基督同行。三、靠神完成不可能的任務——「這事誰能當得起呢？」沒有人；但那使我們蒙赦免的恩典也使我們有資格服事；連保羅也需要同工的鼓勵，神藉軟弱彰顯大能。牧者不是被派去威嚇或解決一切問題，而是傳講使人得生命的福音。儘管世界輕看、教會常以人數衡量，牧職仍是弟兄所能擁有的最高殊榮之一。","pts":["事工中的讚美遠多於心碎","不應把事奉只描繪成挫敗","講道是關乎永恆的神聖使命","同一信息叫人得生或至死","預備講章是屬靈操練","牧者以為父的慈愛牧養羊群","牧者是聖靈手中的筆","沒有人當得起，唯靠基督的恩典","牧者也需要同工的鼓勵","牧職仍是最高的殊榮之一"],"mm":{"c":"值得投身的牧職","b":[["現況",["五年艱難","懷疑呼召","打消年輕人"]],["講道",["基督的特使","生與死的香氣","敬畏"]],["牧養",["薦信","為父之愛","聖靈的筆"]],["不可能的任務",["誰當得起","恩典使人勝任","同工鼓勵"]],["正確觀念",["傳講福音","不靠人數衡量"]],["呼召",["最高殊榮","擁抱依賴"]]]},"fw":[["聚會","心碎、讚美與盼望"],["現況","艱難的五年"],["一","講道的重要性"],["二","個人牧養的殊榮"],["三","靠神完成不可能"],["結論","擁抱尊貴與依賴"]],"q":["你不是在準備一場演說，而是在宣告一個關乎生死的消息。","牧者，是聖靈手中的筆。","這事誰能當得起呢？沒有人——唯靠基督。"],"fb":{"h":"這事誰能當得起呢？\n沒有人——所以才需要恩典。","t":"最近幾年，當牧師很不容易。\n\n疫情、分裂、批評、審視、網路上的指責，\n有人懷疑自己的呼召，\n有人默默離開了講台。\n更讓人難過的是，\n有些牧師把事奉描繪得只剩下挫折與委屈，\n結果，許多年輕人打消了投身全職事奉的念頭。\n\n一位資深牧師每年和兩群主任牧師聚會。\n大家輪流分享這一年的心碎、讚美與盼望。\n心碎很多，眼淚也不少；\n可是每一年，他們最後都達成同一個結論：\n在福音事工裡，\n值得讚美的事，遠遠多過心痛的事。\n\n保羅在哥林多後書，為自己的事奉辯護。\n那段話，也許是今天每一位牧者、和每一位考慮服事的年輕人，\n最需要重新聽見的。\n\n第一，講道從來不只是一份工作。\n保羅說：神「常率領我們在基督裡誇勝」，\n藉著我們，在各處顯揚認識基督的香氣。\n同一篇信息，\n在一些人身上，是叫人活的香氣；\n在另一些人身上，是叫人死的香氣。\n一旦明白這一點，\n講道的緊張，會從「我會不會講錯」，\n轉變成「我有沒有忠心地傳達神的話」。\n你不是在準備一場勵志演講，\n你是在宣告一個關乎生死的消息。\n\n第二，牧養是一份為父的愛。\n保羅說：「你們就是我們的薦信，寫在我們的心裡。」\n這不是冷冰冰的專業服務，\n而是把一群人放在心上，\n下班帶回家，\n夜裡為他們流淚禱告。\n更奇妙的是，\n牧者是聖靈手中的筆——\n神藉著他，把基督寫在人的心版上。\n衡量成功的標準，\n不是有多少人跟隨我們，\n而是他們是否正與基督同行。\n\n第三，這是一個不可能的任務。\n保羅問：「這事誰能當得起呢？」\n答案很清楚：沒有人。\n不是口才、人脈、學歷能讓人勝任。\n但那一份讓我們在神面前蒙赦免的恩典，\n也正是讓我們有資格服事的恩典。\n\n這裡有一個溫柔的提醒：\n連保羅都會因為找不到同工而心裡不安。\n沒有一位牧者能在沒有鼓勵的情況下獨自撐下去。\n所以，如果你是會眾，\n今天也許可以寫一張卡片給你的牧師。\n\n認知的翻轉在這裡：\n世界用人數、預算、規模衡量成功；\n神看的是忠心。\n世界說，有能力才能做大事；\n神說，祂的能力在人的軟弱上顯得完全。\n\n各行各業都是神的呼召，\n但很少有一個呼召，\n像福音事工一樣，\n直接關乎神國度的擴展與人永恆的結局。\n\n所以，如果你正感受到神的呼召，\n不要被這幾年的難處嚇跑。\n擁抱這職分的尊貴，\n也擁抱你對基督完全的依賴。\n\n因為神的國度，\n仍然需要一群軟弱、蒙恩、\n卻願意擺上一生的\n特使。\n\n#牧者 #呼召 #講道 #全職事奉 #恩典"}},{"id":22111,"slug":"derail-bible-study","title":"查經小組是如何跑偏的？","date":"2026-03-23","author":"Bobby Miller III","cats":["教会事工"],"tags":["輔導","小組","團契","查經"],"sum":"一起查考聖經能讓我們深挖神的話，也讓肢體關係更親密；但若沒有清楚的方向與界限，小組很容易跑偏。作者列出四個陷阱：一、聖經成了配角，課外資料成了主角——靈修書、解經書、播客很有幫助，但查經必須從經文本身開始，像庇哩亞人一樣天天考查；引用他書時，要帶組員回到所引的經文與上下文。二、光談個人問題，不談經文原意——分享與經文相關的經歷很好，但若變成一連串瑣事與舊事，就成了處理個人問題；查經小組不是聖經輔導，需要額外關懷的人可會後一對一交流。三、總想糾正別人，忘了省察自己——應用經文時容易變成批評世界與他人的大會，助長法利賽式的自義；省察自己的虧欠，反而使我們成為更有力的見證。四、急著安慰或支招，忘了信靠聖靈——有人認罪時，有人沒完沒了地訴苦，有人急著出主意，有人過度安慰（「別對自己太苛刻」），淡化了聖靈的責備；不要把兩刃的劍變鈍，而要以禱告和體諒接納認罪。每次聚會，神默示的話語必須是核心。","pts":["查經若無方向，很容易跑偏","課外資料不能取代聖經","像庇哩亞人一樣天天考查聖經","分享要緊扣正在查考的經文","查經小組不等於聖經輔導","應用經文時先省察自己","批評世界容易助長自義","過度安慰會淡化聖靈的責備","不要把神的道這把兩刃的劍變鈍","神的話語必須是每次聚會的核心"],"mm":{"c":"查經如何跑偏","b":[["陷阱一",["資料取代經文","徒17:11","回到上下文"]],["陷阱二",["個人瑣事","小組非輔導","會後關懷"]],["陷阱三",["批判大會","法利賽式自義","提後3:16–17"]],["陷阱四",["訴苦","出主意","過度安慰"]],["正確回應",["來4:12","林後7:10","禱告接納"]],["核心",["神的話居中"]]]},"fw":[["前提","查經的價值與挑戰"],["一","聖經成了配角"],["二","只談個人問題"],["三","只想糾正別人"],["四","急著安慰或支招"],["結論","以神的話為核心"]],"q":["淡化別人的罪，不是敬虔。","神的道像兩刃的劍刺入人心時，我們不該把它變鈍。","反覆唸叨世界多糟糕沒什麼用，省察自己的虧欠才能成為有力的見證。"],"fb":{"h":"查經查到最後，\n聖經去哪裡了？","t":"一群人圍坐在客廳，膝上放著聖經。\n九十分鐘後，大家心滿意足地回家。\n可是如果你仔細回想——\n今晚，我們真的讀了多少聖經？\n\n我們聊了一本暢銷書的觀點，\n聽了一位組員的家務事，\n一起罵了一陣這個世界有多墮落，\n還幫一位認罪的弟兄出了十個主意。\n聖經呢？\n一直安靜地放在膝上。\n\n一位撰稿人指出，查經小組最常在四個地方跑偏。\n\n第一，聖經成了配角。\n靈修書、解經書、播客，都是很好的幫助，\n但它們不能取代經文本身。\n庇哩亞人天天考查聖經，要曉得那道是不是真的，\n連使徒保羅講的，他們都要回到經文裡核對。\n很多話聽起來很屬靈，\n卻經不起聖經的檢驗。\n\n第二，只談自己的事。\n分享和經文相關的經歷，能幫助真理落地；\n但如果分享變成一連串的陳年舊事，\n小組就從查考聖經，變成了處理個人問題。\n查經小組不是聖經輔導。\n需要更多關懷的人，會後可以一對一好好聊。\n\n第三，總想糾正別人。\n經文讀完，大家開始應用：\n這個社會怎麼樣、那些人怎麼樣、外面的世界怎麼樣……\n討論得熱火朝天，\n卻沒有人說：「那我呢？」\n這不是應用，\n是穿著屬靈外衣的抱怨，\n也是法利賽人那種自以為義的溫床。\n\n第四，急著安慰或出主意。\n有人終於鼓起勇氣說：「這段經文讓我很扎心，我在這件事上一直失敗。」\n然後——\n有人急著幫他找解決方法；\n有人急著安慰：「別對自己太苛刻，大家都這樣。」\n聽起來很溫柔，\n其實是幫他躲過了聖靈的責備。\n\n這裡有一個深刻的翻轉：\n我們以為安慰總是愛，\n但有時候，淡化一個人的罪，\n是在攔阻他悔改。\n神的道像兩刃的劍，刺入人心；\n我們不該急著把它磨鈍。\n合神心意的憂愁，會生出悔改，\n帶來不後悔的救恩。\n\n那該怎麼辦？\n安靜一下。\n為他禱告。\n用體諒的心接住他的認罪，\n然後讓聖靈繼續作工。\n\n我們特意空出時間來查經，\n是因為相信神的話能改變生命。\n所以，下次小組聚會，\n不妨在開始前提醒大家一句：\n今晚的主角，\n不是我們的意見，\n不是我們的故事，\n也不是我們對世界的不滿，\n而是那本\n一直放在我們膝上、\n等著被打開的書。\n\n#查經 #小組 #聖經 #悔改 #門徒訓練"}},{"id":22108,"slug":"lost-art-listening-sermons","title":"別隻聽金句：重拾聆聽講道的藝術","date":"2026-03-22","author":"Mike Hernández","cats":["基督徒生活"],"tags":["爭戰","聽道","耐心","靈命塑造"],"sum":"社交媒體充斥講道「金句」與精華片段，作者擔心這正在削弱我們聆聽完整講道的能力。講道通常是崇拜中最長、最不需要會眾回應的部分，因此是一場屬靈爭戰：要對抗分心、思緒，甚至睏倦——就像在保羅長篇講道時睡著、從窗台跌下的猶推古。我們帶著早上的慌亂、停車的煩惱、與配偶的爭執、對週一的焦慮來到教會，而看不見的仇敵也在攔阻我們聽見福音。《威斯敏斯特大要理問答》第160問提供了三個方面的幫助：一、預備——從週六晚上就開始禱告，求神開啟心靈的耳朵，保守撒下的種子不被奪走，並像新生嬰孩愛慕奶一樣，帶著飢渴的心來；二、領受——存溫柔謙卑的心領受所栽種的道，讓同一個福音在心中扎根生長，並問自己是否為道戰兢、是否喜悅神的話應用在我身上；三、實踐——讓道從心走到手和腳：丈夫聽了謙卑的道向妻子道歉、年輕人甘心奉獻、焦慮的人選擇禱告。要行道，不要單單聽道。","pts":["金句片段可能削弱聆聽完整講道的能力","聽道是一場屬靈爭戰","我們要對抗分心與睏倦","預備從週六晚上的禱告開始","帶著屬靈的飢渴來聽道","存溫柔謙卑的心領受道","讓福音在心中扎根生長","讓道從心走到手和腳","要行道，不要單單聽道","講道的目的是塑造生命"],"mm":{"c":"聆聽講道的藝術","b":[["處境",["金句片段","注意力","猶推古"]],["爭戰",["分心","焦慮","仇敵奪道"]],["預備",["週六禱告","可4:15","彼前2:2"]],["領受",["雅1:21","謙卑","為道戰兢"]],["實踐",["雅1:22–24","道歉","奉獻","禱告"]],["目的",["生命塑造","帖前4:3"]]]},"fw":[["現象","金句文化"],["戰場","竭力去聽"],["一","預備"],["二","領受"],["三","實踐"],["結論","塑造生命"]],"q":["聆聽講道是一場屬靈的爭戰。","福音之道不是左耳進右耳出，而是在我們裡面扎根。","我們所聽見的道，需要從心裡走向手和腳。"],"fb":{"h":"金句可以被剪下來，\n生命卻無法被剪輯。","t":"社群媒體上，到處都是講道的精華片段。\n三十秒、一句金句、一段動人的配樂，\n讓人熱淚盈眶，按讚，分享，滑走。\n\n這些片段沒有錯。\n但一位牧師提出了一個讓人不安的問題：\n當我們習慣了三十秒的感動，\n我們還有能力，安靜地聽完一整篇講道嗎？\n\n講道，常常是崇拜裡最長的部分，\n也是最不需要我們做什麼的部分。\n所以它也成了一個戰場。\n我們要對抗分心、對抗雜念，\n有時候，還要對抗睡意。\n\n聖經裡有一個少年叫猶推古。\n保羅講道講到半夜，他坐在窗台上，\n聽著聽著睡著了，\n從三樓摔下去，死了。\n（感謝主，保羅讓他活了過來。）\n你的牧師大概不會講到半夜，\n但你還是需要竭力地聽。\n\n因為我們走進教會時，\n腦子裡裝滿了：\n早上催孩子出門的慌亂，\n找不到停車位的煩躁，\n昨晚和另一半吵架的餘溫，\n對明天上班的焦慮。\n更不用說，那看不見的仇敵，\n一直想把撒在路旁的種子叼走。\n\n古老的信仰問答說：\n聽道的人，要勤勉、要預備、要禱告；\n要用聖經考查所聽的；\n要以信心、愛心、謙卑的心領受真理；\n要默想、談論、藏在心裡，\n並在生命中結出果子來。\n\n這可以歸納成三件事。\n\n預備。\n主日的預備，從週六晚上就開始了。\n禱告，求神開你的耳朵；\n像剛出生的嬰孩渴慕奶一樣，\n帶著飢餓的心來。\n\n領受。\n雅各說：要存溫柔的心，領受那所栽種的道。\n不是左耳進右耳出，\n而是讓它在心裡扎根、生長。\n同一個福音，每週再聽一次，\n卻總能用新的方式觸動你。\n\n實踐。\n這是最容易被忽略的一步。\n講道不是聽完就結束了，\n它需要從耳朵走到心裡，\n再從心裡走到手和腳上。\n\n一位丈夫聽了關於謙卑的講道，\n回家後，第一次沒有為自己辯護，\n而是主動向妻子道歉。\n一位年輕人聽了神的慷慨，\n不再因為害怕而緊抓著錢，\n開始甘心樂意地奉獻。\n一位常常焦慮的人，\n想起神的主權，\n選擇禱告，而不是被恐慌吞沒。\n\n這裡有一個重要的對比：\n金句讓人感動，\n講道讓人改變；\n片段讓我們覺得自己聽懂了，\n行道才證明我們真的聽見了。\n\n雅各說：\n只聽道不行道的人，就像照鏡子的人，\n看見了，走開，\n就忘了自己長什麼樣子。\n\n所以這個主日，\n在走進教會之前，先禱告；\n坐下來時，關掉手機；\n聽完之後，問自己一句：\n今天，這篇道要我怎麼活？\n\n因為神要的，\n不只是一個會轉發金句的人，\n而是一個\n被祂的話語\n慢慢塑造的生命。\n\n#聽道 #講道 #靈命塑造 #行道 #主日"}},{"id":22106,"slug":"hear-gods-voice-today","title":"「神給我的帶領是……」","date":"2026-03-22","author":"Davy Ellison","cats":["基督徒生活"],"tags":["神的旨意","信條","信經"],"sum":"有個高中生對心儀的女孩說：「神告訴我，我們應該交往。」女孩回：「神可沒告訴我。」神確實是說話的神，祂的話匯成聖經，今天仍藉話語與聖靈對我們說話；但「神告訴我」常被當成擋箭牌，為私心或解釋不清的行為撐腰。我們能說「神給我的帶領是……」嗎？可以，但需要三道護欄。一、尊重作者的原意：意義在於詞語、語法與上下文，而非讀者腦補；耶29:11不是應許新工作飛黃騰達，而是告訴被擄者要在巴比倫安居七十年——若你困在枯燥的工作，神可能是要你在那裡榮耀祂。聖靈絕不會說與經文原意相違的話。二、借鑑歷代的解讀：信經、信條、教會歷史雖非無誤，卻是好嚮導；詩37:4「以耶和華為樂，祂就將你心裡所求的賜給你」不是應許財富與豪宅，奧古斯丁、加爾文、司布真都指出它是說：有神就足夠喜樂。三、聽取屬靈長輩的建議：若讀到「務要傳道」就想辭職全職服事，記得提摩太是經眾長老按手、被教會認可的；重大決定要尋求牧者與成熟信徒的印證或糾正。神的道是活潑的，在不同時候對不同的人有不同要求；不要忽視聖靈感動，也不要把私心包裝成神的旨意。","pts":["神是說話的神","「神告訴我」常被當作擋箭牌","第一道護欄：尊重經文作者的原意","聖經不是屬靈版的幸運餅乾","聖靈不會說與經文原意相違的話","第二道護欄：借鑑歷代的解讀","詩37:4不是財富的應許","第三道護欄：聽取屬靈長輩的建議","重大決定需要教會的印證","不要把私心包裝成神的旨意"],"mm":{"c":"聆聽神的聲音","b":[["神說話",["創1章","聖經","來4:12"]],["濫用",["擋箭牌","幸運餅乾"]],["護欄一",["作者原意","耶29:11"]],["護欄二",["教會歷史","詩37:4","奧古斯丁"]],["護欄三",["屬靈長輩","提摩太按手"]],["結論",["存信心領受","忠心去行"]]]},"fw":[["故事","神告訴我們要交往"],["問題","怎麼分辨神的聲音"],["護欄一","尊重原意"],["護欄二","歷代解讀"],["護欄三","長輩建議"],["結論","活潑有功效的道"]],"q":["聖靈會將聖經應用到生活中，但絕不會說與經文原意相違的話。","即便你的未婚妻今天沒出現，你還有我，這便足以喜樂。","不要把個人的小算盤包裝成神的旨意。"],"fb":{"h":"「神告訴我……」\n這句話需要三道護欄。","t":"有一個高中男生，鼓起勇氣走向他喜歡的女孩，\n說出了他自以為萬無一失的開場白：\n「神告訴我，我們應該在一起。」\n女孩回答：\n「喔，可是神沒有告訴我。」\n\n我們笑了。\n但說真的，「神告訴我」這句話，\n在教會裡出現得太頻繁了。\n有時候它很真誠；\n有時候，它是一面盾牌——\n只要說是神說的，別人就不好再反駁了。\n\n神確實是一位說話的神。\n創世記第一章，祂說了一句又一句話，\n世界就從無到有。\n祂的話寫成了聖經，\n而且是活潑的、有功效的，\n今天仍然藉著聖經和聖靈對我們說話。\n\n那麼，我們可以說「神給我的帶領是……」嗎？\n可以。\n但最好有三道護欄。\n\n第一道護欄：尊重作者的原意。\n很多人把聖經當成屬靈版的幸運籤。\n上班第一天，隨手一翻，看見：\n「我知道我向你們所懷的意念，是賜平安的意念……」\n於是滿心歡喜：神說這份工作會讓我飛黃騰達！\n可是在耶利米書裡，這句話是對被擄的人說的——\n他們要在異鄉安頓下來，住上七十年。\n如果你正困在一份枯燥的工作裡，\n神也許真的在對你說話，\n但祂說的可能是：\n「在那裡，安心地榮耀我。」\n\n聖靈會把經文應用在我們身上，\n但祂絕不會說出和經文原意相反的話。\n\n第二道護欄：參考歷代的理解。\n「以耶和華為樂，祂就將你心裡所求的賜給你。」\n很多人以為這是財富、健康、美滿家庭的保證。\n但兩千年來，奧古斯丁、加爾文、司布真都在告訴我們：\n這節經文的重點是——\n當你以神為樂，\n你心裡最深的渴望，就是神自己。\n就算婚禮那天新娘沒出現，\n你仍然有祂，\n而祂足夠讓你喜樂。\n\n如果你聽到的「神的帶領」，\n完全跑出了歷代教會對聖經的理解，\n那就該停下來想一想了。\n\n第三道護欄：聽聽屬靈長輩的話。\n你讀到「務要傳道」，\n突然覺得神要你辭掉做了十幾年的工作，去當全職傳道。\n這也許是真的。\n但別忘了，提摩太是被眾長老按手、得到教會認可的。\n人生重大的決定，\n要讓你的牧者、成熟的弟兄姊妹一起看、一起禱告。\n神常常藉著祂智慧的子民，\n印證，或者糾正我們。\n\n這裡有一個值得深思的翻轉：\n我們以為護欄限制了神說話，\n其實護欄保護我們，\n不至於把自己的聲音，誤認為神的聲音。\n\n所以，不要忽視聖靈在你心裡的感動；\n也不要把自己的小算盤，包裝成神的旨意。\n當一份感動，\n合乎經文的原意，\n合乎歷代的理解，\n也得到屬靈長輩的印證——\n那就帶著信心領受，\n然後，忠心地去行。\n\n至於那位高中男生，\n也許神真正想對他說的是：\n「孩子，先好好認識她，\n也好好認識我吧。」\n\n#神的旨意 #聖經詮釋 #聖靈帶領 #分辨 #智慧"}},{"id":22088,"slug":"forevergreen-gospel-oscars","title":"《生生不息》：當福音照進奧斯卡 ","date":"2026-03-21","author":"Brett McCrackenã€Jeremy Spearsã€Nathan Engelhardt","cats":["文化与艺术"],"tags":["創作","AI","動畫片","創意"],"sum":"今年奧斯卡最佳動畫短片提名中，出現了一部由基督徒創作、充滿福音意蘊的作品《生生不息》：一隻失去雙親的小熊在常青樹下找到家，松樹像父親守護它，小熊卻因貪戀人類垃圾陷入險境，最後松樹犧牲自己，以身體架成橫跨深淵的橋，救回這隻「浪子熊」。導演恩格爾哈特與斯皮爾斯在迪士尼共事十五年，參與過《冰雪奇緣》《魔法滿屋》等片。靈感源於恩格爾哈特在屬靈低谷中被《三棵樹的故事》安慰；斯皮爾斯看見一棵紅杉倒在峽谷上成為橋，而恩格爾哈特幾天前才畫過福音橋圖——兩人相信是神帶領。他們讓小熊看起來像從木頭雕出來，象徵人按神形像受造，並開發技術在3D動畫中呈現手工木雕與定格動畫的質感；配樂在初期就介入塑造情感。他們建議創作者講對自己有意義的故事，挖掘普世真理——「世人都犯了罪」，我們每個人都是那隻小熊。對AI，他們認為它只是工具，沒有心也沒有靈魂；若省時省力成了終極目標，故事會變得空洞——如果作品不值得作者付出心血，也不值得任何人花時間品味。","pts":["基督徒創作的福音短片入圍奧斯卡","松樹犧牲自己成為救小熊的橋","靈感來自恩典與饒恕的經歷","兩位導演在幾天內各自畫出同一個畫面","小熊像木雕，象徵人按神形像受造","每個人都是那隻貪戀垃圾的小熊","講一個對自己有意義的故事","普世真理讓故事引起共鳴","AI沒有心，也沒有靈魂","不值得付出心血的作品，也不值得品味"],"mm":{"c":"生生不息","b":[["故事",["孤兒小熊","常青樹","倒下成橋"]],["創作者",["迪士尼十五年","兩位導演"]],["靈感",["三棵樹的故事","紅杉之橋","福音橋圖"]],["技術",["木雕質感","定格動畫感","早期配樂"]],["信仰與藝術",["普世真理","羅3:23","基督徒做的藝術"]],["AI",["只是工具","愛的勞作"]]]},"fw":[["背景","福音照進奧斯卡"],["故事","樹與浪子熊"],["緣起","兩位導演"],["靈感","神帶領的畫面"],["技術","手工質感"],["建議","給創作者"],["AI","人工創作的價值"]],"q":["這棵倒下的樹，正是基督捨命的寫照。","我們每個人其實就是那隻小熊。","如果一件作品不值得作者付出心血，那它也不值得任何人花時間品味。"],"fb":{"h":"一棵樹倒下，\n成了回家的橋。","t":"一隻小熊失去了父母，\n在一棵常青樹下找到了家。\n那棵松樹像父親一樣守護它，\n為它遮風擋雨。\n\n可是，小熊被人類丟下的垃圾吸引了。\n亮晶晶的包裝、香噴噴的味道，\n它越走越遠，\n最後掉進了一道深不見底的峽谷邊緣。\n\n就在那時，那棵樹倒了下來。\n它用自己的身體，\n架起一座橫跨深淵的橋，\n把小熊救了回來。\n\n這是一部只有十三分鐘的動畫短片，\n名叫《生生不息》。\n它入圍了今年的奧斯卡最佳動畫短片。\n兩位導演在迪士尼工作了十五年，\n參與過許多你一定看過的動畫電影。\n而這部片，是他們利用業餘時間，\n帶著一群志願者，一點一點做出來的。\n\n其中一位導演說，\n幾年前他經歷了一段很深的屬靈低谷，\n過去的過犯讓他覺得自己不配得神的愛。\n那段日子，一個古老的故事安慰了他：\n神會使用破碎、卑微的東西，成就祂的旨意。\n他想講一個關於不配得的恩典的故事。\n\n另一位導演在找靈感時，\n看到一張照片：\n一棵巨大的紅杉倒在峽谷上，成了一座橋。\n他心想：這不就是基督嗎？\n祂用自己的生命，\n跨越那道人永遠跨不過去的鴻溝。\n\n他把這個想法告訴夥伴，\n才發現對方幾天前，\n剛在白板上為同事畫過一張圖：\n一邊是神，一邊是人，\n中間是十字架架成的橋。\n\n兩個人，在幾天之內，\n畫出了同一個畫面。\n他們說：那一刻，我們知道是神在帶領。\n\n為什麼這麼簡單的故事，能打動這麼多人？\n導演說：\n因為我們每一個人，都是那隻小熊。\n我們都知道那袋垃圾代表什麼。\n\n這是一個深刻的命題：\n人最深的問題，不是缺少什麼，\n而是被錯誤的東西吸引，\n一步一步，走向自己無法跨越的深淵。\n\n而福音最美的翻轉是：\n不是小熊爬回去，\n而是那棵樹倒下來。\n不是我們跨越鴻溝，\n而是祂成為我們的橋。\n\n他們還說了一段話，關於AI：\nAI只是工具，它沒有觀點、沒有心、沒有靈魂。\n如果省時省力成了創作的終極目標，\n世界會充滿空洞的故事。\n一件作品若不值得作者付上心血，\n也就不值得任何人花時間去看。\n所以我們稱之為「藝術作品」，\n或者，「愛的勞作」。\n\n這部片，就是一份愛的勞作。\n而它講的，\n正是那份最偉大的愛的勞作——\n一位神，\n為了把迷路的我們帶回家，\n甘願倒下，\n成為那座橋。\n\n#生生不息 #動畫 #恩典 #十字架 #信仰與藝術"}},{"id":22071,"slug":"trouble-religious-trends","title":"關注宗教數據的困境","date":"2026-03-19","author":"Joe Carter","cats":["社会与时事"],"tags":["信仰","美國","數據","趨勢"],"sum":"巴納說年輕人引領教會出席率回升，蓋洛普卻說美國宗教重要性十年驟降17個百分點——基督教到底在復興還是衰落？答案取決於衡量指標與樣本，而基督徒往往只記住符合自己情緒的那份。卡特寫了二十年宗教趨勢，逐漸不願過度看重它們，理由有三。一、趨勢往往不如表面：就像槍擊死亡率持平，是因為醫療進步掩蓋了非致命槍傷的上升；巴納的「復興」是年輕人每月平均去1.8次、以疫情低谷為基準，蓋洛普的下降真實，但美國仍高於多數富國。二、我們不活在平均值的世界：全國平均抹平地區、宗派、人口差異，蓬勃的教會讀到巴納就以為復興，衰退的教會讀到蓋洛普就以為崩潰，都把個人經驗當普遍規律。三、本質上無關緊要：即使確知百年內只有一人信主，我們傳福音、講道、教養兒女的方式都不會改變，因為蒙召是要忠心而非結果——耶得遜在緬甸六年才有第一位信徒。趨勢可供參考，但順勢易自滿，逆勢易絕望；基督應許建立祂的教會，我們的盼望是末世性的，而非統計性的。","pts":["兩份報告指向相反的結論","我們常只記住符合情緒的數據","趨勢往往掩蓋更複雜的現實","「復興」與「崩潰」都是框架","全國平均抹平了巨大差異","不要把個人經驗當普遍規律","我們蒙召是要忠心，不是要結果","耶得遜六年才有第一位信徒","盼望是末世性的，不是統計性的"],"mm":{"c":"宗教數據的困境","b":[["矛盾",["巴納：回升","蓋洛普：下降"]],["理由一",["槍擊例子","復興的定義","國際比較"]],["理由二",["平均值","觀察者偏差"]],["理由三",["忠心非結果","林前4:2","耶得遜"]],["正確定位",["參考","不定議程"]],["盼望",["太16:18","腓2:9–11"]]]},"fw":[["現象","兩則矛盾的新聞"],["理由一","趨勢不如預期"],["理由二","世界不是平均的"],["理由三","本質無關緊要"],["定位","數據的正確位置"],["盼望","寄託在應許者身上"]],"q":["我們蒙召是為了忠心，而非為了結果。","我們的盼望是末世性的，而非統計性的。","百年之後無人記得今年的數據，但你本週的忠心是神建造國度的根基。"],"fb":{"h":"我們的盼望不是統計性的，\n而是末世性的。","t":"一份報告說：年輕人回到教會了，復興來了！\n另一份報告說：宗教在美國的重要性，十年內暴跌了十七個百分點！\n\n到底哪一個是真的？\n\n答案是：兩個都是真的。\n它們衡量的指標不同，樣本不同，框架不同，\n卻指向完全相反的結論。\n而大多數基督徒，\n只記住了符合自己情緒的那一份。\n\n一位寫了二十年宗教趨勢的編輯說，\n他越來越不想過度看重這些數字。\n他給了三個理由。\n\n第一，趨勢常常不是它看起來的樣子。\n他舉了一個例子：\n十年間，槍擊致死率幾乎沒變，\n看起來槍枝暴力很穩定。\n其實非致命的槍傷增加了很多，\n只是醫療技術進步，救活了更多人。\n宗教數據也一樣——\n所謂的「復興」，是年輕人平均每月去教會不到兩次，\n而且是跟疫情封館時的低谷相比；\n所謂的「崩潰」，美國的數字其實仍高於大多數富裕國家。\n\n第二，我們不是活在平均值裡。\n如果你的教會充滿年輕家庭，你會覺得復興來了；\n如果你的教會越來越老、越來越小，你會覺得一切都在崩塌。\n兩種反應犯了同一個錯：\n把自己的經驗，當成了全世界的樣子。\n\n第三，也是最根本的：\n就算我們能精準預測趨勢，\n我們的呼召也不會改變。\n\n他邀請大家做一個思想實驗：\n假設我們確定，未來一百年裡，\n全國只會有一個人信主。\n你會因此改變傳福音的方式嗎？\n會不再講道、不再教導孩子、不再愛鄰舍嗎？\n當然不會。\n\n因為神要我們的，是忠心，\n不是成功率。\n\n宣教士耶得遜在緬甸六年，\n才帶領第一個人信主。\n那六年，他學語言、適應文化、生病、失去孩子——\n按世界的標準，毫無成果。\n今天緬甸的教會存在，\n不是因為他準確預測了趨勢，\n而是因為他在看不見盼望的時候，仍然忠心。\n\n這裡有一個值得記住的翻轉：\n好消息可能讓我們自滿——「年輕人回來了，我們一定做對了！」\n壞消息可能讓我們絕望——「一切都完了，何必堅持？」\n但兩種反應，\n都沒有把信心放在那位掌權的神身上。\n\n基督說：我要把我的教會建造在這磐石上，\n陰間的權柄不能勝過她。\n這個應許，\n不需要人口趨勢支持，\n不需要Z世代的出席率比千禧世代高。\n它只建立在一件事上：\n那位應許者的信實。\n\n所以，讀這些報告吧，\n從中學習可以學的。\n然後，放下它們，\n回到你的家、你的教會、你的社區、你的工作崗位，\n傳講真道，\n愛你的鄰舍，\n教養你的孩子，\n分享福音。\n\n一百年後，\n沒有人會記得今年的數據；\n但你這個禮拜在平凡生活中的忠心，\n卻是神建造祂國度的\n一塊石頭。\n\n#教會 #數據 #忠心 #盼望 #宣教"}},{"id":22069,"slug":"wake-up-dead-man-christian-review","title":"從《利刃出鞘 3》看兩種墮落的基督教","date":"2026-03-19","author":"Brett McCracken","cats":["文化与艺术"],"tags":["政治","自由主義","進步主義","廉價恩典"],"sum":"《利刃出鞘3》以天主教堂區為背景，觀眾除了猜兇手，還要猜誰是真信徒。導演萊恩·約翰遜在福音派長大、如今不再自稱基督徒，片中呈現三種與信仰的關係。威克斯蒙席是川普的化身：講道充滿煽動政治言論，讓會眾憤怒恐懼，趕走單親媽媽、同性伴侶等人，教導信徒成為文化戰士；忠誠支持者說「無論你做什麼我們都支持你」。賈德神父是前福音派心中的夢幻牧師：前拳擊手、髒話連篇卻滿懷憐憫，要「拆牆」、用擁抱而非拳頭，承認自己的罪、愛羊群；但他很少談罪而只談「破碎」，所謂神蹟只是「每天醒來繼續前行」，不提寶血的救贖，近乎勵志雞湯式的廉價恩典。偵探布蘭克則是唯物主義者，「跪拜在理性祭壇前」，因聖經的性倫理等原因離開信仰，片尾婉拒賈德的彌撒邀請——包容的信仰並未說服懷疑者。麥克拉肯指出，兩種基督教都失去鋒芒：政治倡導與療癒式廉價恩典，在別處都能得到。我們需要持守張力的教會：既不以廉價恩典肯定罪人，也不無盼望地羞辱他們，而是引人悔改、得洗淨成聖稱義；既愛世界，又不效法世界；十字架既非黨派武器，也非閹割的符號。","pts":["電影呈現兩種墮落的基督教","川普式信仰以憤怒與恐懼牧養","政治效忠取代了道德要求","進步式信仰以包容取代悔改","只談破碎不談罪，是廉價恩典","不提寶血救贖的福音是空洞的","包容的信仰也無法說服懷疑者","兩種信仰在別處都能得到","需要持守張力、忠於信仰的教會","十字架不是黨派武器，也不是閹割的符號"],"mm":{"c":"兩種墮落的基督教","b":[["威克斯",["川普化身","憤怒恐懼","文化戰士"]],["賈德",["包容","擁抱非拳頭","廉價恩典"]],["布蘭克",["唯物主義","理性祭壇","婉拒彌撒"]],["對照",["第一歸正會","政治倡導","療癒實用主義"]],["共同問題",["沒牙齒","別處可得"]],["真正的教會",["林前6:11","愛世界不效法世界","十字架"]]]},"fw":[["電影","利刃出鞘3"],["角色一","威克斯：右翼的信仰"],["角色二","賈德：進步的信仰"],["角色三","布蘭克：唯物主義"],["分析","兩種失去鋒芒的基督教"],["呼召","持守張力的教會"]],"q":["這是迎合受眾的基督教，而不是真正的基督教。","罪人既不被廉價恩典輕率肯定，也不被無盼望地羞辱。","十字架既不是黨派鬥爭的武器，也不是一個被閹割的符號。"],"fb":{"h":"一個用憤怒牧養，\n一個不再談罪。","t":"一部懸疑電影，在一間小小的天主教堂裡展開。\n觀眾除了要猜兇手是誰，\n還要猜另一件事：\n這些神職人員和會友之中，\n誰是真的信徒，誰是假的？\n\n導演從小在福音派教會長大，\n後來離開了信仰。\n他在片中，放進了三種人。\n\n第一位，是一位強硬的神父。\n他的講道充滿政治口號，\n讓會眾保持憤怒、恐懼，\n把世界看成要被擊退的敵人。\n單親媽媽、同性伴侶、戴口罩的人，一個一個離開了；\n留下來的人，被教成文化戰士。\n他犯過醜聞，\n支持者卻說：「無論你做什麼，我們都支持你。」\n\n第二位，是一位年輕的神父。\n他當過拳擊手，講話粗魯，卻心腸溫柔。\n他說：「基督來是要醫治世界，不是與世界打仗。」\n他承認自己的罪，愛他的羊群，\n深夜在電話裡為痛苦的人禱告。\n他是很多人心中理想的牧者。\n\n但影評人注意到一件事：\n他幾乎不談罪，只說「破碎」；\n當他說到信仰的「神蹟」，\n他說的不是十字架上的救贖，\n而是——「每天醒來，繼續完成使命，儘管痛苦依舊」。\n這聽起來很溫暖，\n卻更像勵志雞湯，\n而不是那能洗淨罪、拯救靈魂的福音。\n\n第三位，是偵探。\n他從小在虔誠的家庭長大，\n後來說基督教是「小孩子的童話」，\n他只跪拜在理性的祭壇前。\n電影結尾，那位溫柔的年輕神父邀請他參加彌撒。\n他笑著婉拒了：\n「那是我最不想做的事。」\n\n這是一個值得深思的結局：\n憤怒的信仰趕走了人，\n包容的信仰，\n也沒有說服任何一個懷疑者。\n\n影評人說：這兩種基督教，都失去了牙齒。\n一種用政治取代福音——\n但政治的歸屬感，在別的地方也能找到；\n一種用療癒取代悔改——\n但溫暖的勵志氛圍，在別的地方也能找到。\n兩者都是迎合聽眾的基督教，\n而不是真正的基督教。\n\n這裡有一個深刻的翻轉：\n我們以為要在「強硬」和「包容」之間選一邊，\n其實真正的福音，\n比兩者都更強硬，\n也比兩者都更溫柔。\n\n它對罪毫不妥協，\n所以需要十字架；\n它對罪人無比憐憫，\n所以有十字架。\n\n真正的教會，\n不會用廉價恩典輕輕放過罪人，\n也不會毫無盼望地羞辱罪人；\n而是引導罪人悔改，\n然後宣告：你們已經洗淨、成聖、稱義了。\n\n它愛這個世界，像神愛世人一樣；\n卻不愛世界的那一套，\n也不效法這個世界。\n\n十字架，\n不是黨派鬥爭的武器，\n也不是一個被拔掉了刺的裝飾品，\n而是神的大能，\n神的智慧，\n我們唯一要傳的信息。\n\n如果那位偵探遇見的是這樣的教會，\n他也許還是會拒絕。\n但至少，\n他會有那麼一刻，\n看見基督教\n真正的臉。\n\n#電影 #利刃出鞘 #福音 #廉價恩典 #教會"}},{"id":22067,"slug":"no-good-deed-hidden","title":"從隱而未現的罪，到隱而未現的善行","date":"2026-03-18","author":"Trevin Wax","cats":["基督徒生活"],"tags":["順服","善行"],"sum":"強調罪普遍性的神學圈常說：我們比自己意識到的更敗壞——罪寄生在善行中、玷污最純的動機；越親近耶穌，越看見自己的污穢。傑克·米勒會對沮喪的基督徒說：「振作起來！你確實比你想像的更敗壞！」我們需要從隱而未現的過錯中被潔淨。但瓦克斯指出另一面同樣真實：基督的聖潔在你生命中滲透得比你知道的更深；順服聖靈的基督徒，活出的善行遠比自己意識到的多。在綿羊山羊的比喻中，義人驚訝地問：「主啊，我們什麼時候做過這些？」派博在《主耶穌啊，我願你來》中引弗6:7–8：各人所行的每一件善事，都必得主的賞賜——一份善意、一次寬容、一杯涼水，無一例外。神是「看顧人的神」，祂看見我們的罪，也看見祂藉我們成就的善。許多人在婚姻、育兒、工作中半途而廢，因為以善報惡往往無人知曉、千百次被冷淡回應；但神看見並記錄，那時我們會說「這一切都值得」。神會燒盡木草禾秸，顯出煉淨的金子；你對他人的影響比你想像的更多，就像《生活多美好》的喬治·貝利，將在末日揭曉。","pts":["我們比自己意識到的更敗壞","越親近耶穌，越看見自己的罪","但基督的聖潔也比你知道的更深","你活出的善行比你意識到的多","義人驚訝於自己被記念的善行","每一件善行都必得主的賞賜","神看見我們的罪，也看見我們的善","以善報惡常無人知曉，但神記錄","你對他人的影響比你想像的更多"],"mm":{"c":"隱而未現的善行","b":[["罪的深度",["隱而未現的過錯","詩19:12","你比想像更敗壞"]],["另一面",["基督的聖潔","順服聖靈"]],["經文",["太25:31–46","弗6:7–8","太10:42"]],["神看見",["看顧人的神","記錄善行"]],["堅持",["以善報惡","婚姻育兒","不喪志"]],["末日",["燒盡木草禾秸","喬治·貝利"]]]},"fw":[["前提","罪比我們想像的更深"],["翻轉","聖潔也比我們想像的更深"],["應許","每件善行都得賞賜"],["神","看顧人的神"],["勸勉","不要喪志"],["盼望","在末日揭曉"]],"q":["振作起來！你確實比你想像的還要敗壞。","一個順服聖靈的基督徒，活出的善行遠比他自己意識到的要多。","世人沒有看見，但天上的神卻看見了，也記錄下來了。"],"fb":{"h":"你比自己想像的更敗壞，\n也比自己知道的更蒙恩。","t":"有一位牧師，在弟兄姊妹因為自己的罪而沮喪時，\n常常說一句很奇怪的安慰話：\n「振作起來！\n你確實比你想像的還要敗壞！」\n\n這句話，說出了一個真相：\n罪比我們以為的更深。\n它藏在我們的善行裡，\n玷污我們最純粹的動機，\n連我們自己都沒察覺的過錯，\n也算在我們身上。\n所以詩人禱告：「求你赦免我隱而未現的過錯。」\n\n而且，越靠近耶穌，\n越看清自己有多髒。\n\n但一位作者提醒我們，\n還有另一個同樣真實、卻常被忽略的真相：\n你也不知道，\n基督的聖潔，已經在你生命裡滲透得多深。\n\n一個順服聖靈的基督徒，\n活出的善行，\n遠比他自己意識到的多。\n\n耶穌講過一個比喻。\n在末日，祂把綿羊和山羊分開，\n然後對右邊的人說：\n我餓了，你們給我吃；我渴了，你們給我喝；\n我做客旅，你們留我住；\n我病了，你們看顧我。\n那些人一臉驚訝：\n「主啊，我們什麼時候做過這些？」\n\n他們不記得了。\n因為那些善事，\n已經成了他們的本能。\n\n保羅說：\n各人所行的善事，不論是為奴的、自主的，\n都必按所行的，得主的賞賜。\n\n每一件。\n不只是那些轟轟烈烈的事，\n還有一句溫柔的話，\n一次忍住不回嘴，\n一份沒人看見的耐心，\n甚至，給人一杯涼水。\n天上的帳簿，\n一筆都不會漏。\n\n這裡有一個深刻的對比：\n我們常常只看見自己的失敗，\n神卻同時看見我們的失敗，\n和祂在我們身上做成的善工。\n我們數算自己的虧欠，\n神也在數算祂的恩典結出的果子。\n\n一位牧師寫道：\n許多人在婚姻、育兒、友誼、工作上半途而廢，\n是因為以善報惡，往往沒人看見。\n你努力愛一個人，對方冷淡、甚至反唇相譏，\n一次、十次、一千次，\n持續了好多年。\n世人沒看見，\n但天上的神看見了，\n而且記下來了。\n有一天，這些都會以你無法想像的方式回來，\n那時你會說：\n「這一切，都值得。」\n\n你也許會說：「可是我有那麼多缺點！」\n是的，主都知道。\n祂會用火燒盡木、草、禾稭，\n好顯出祂在你生命中煉淨的金子。\n\n還有一件事：\n你對別人的影響，比你想像的更多。\n你說過的某一句話，讓某人多了一點耐心；\n你做過的某一件事，讓某人做了一個更好的選擇。\n就像那部老電影《生活多美好》裡的主角，\n直到最後才看見，\n自己平凡的一生，激起了多少漣漪。\n\n所以，別灰心。\n你比自己想像的更需要恩典，\n也比自己知道的，\n更被恩典改變。\n\n繼續行善吧。\n就算今天沒有人看見，\n有一位，\n一直都在看。\n\n#善行 #恩典 #成聖 #賞賜 #不要灰心"}},{"id":22060,"slug":"are-christian-colleges-doomed","title":"基督教大學真的氣數已盡？","date":"2026-03-18","author":"Perry L. Glanzer","cats":["信仰与工作"],"tags":["高等教育","基督教大學","天主教大學"],"sum":"貝勒大學教授格蘭澤指出，關於基督教高等教育即將消亡的傳聞被誇大了。2023至2024年，天主教與新教院校入學人數增長1.6%，新教院校增長2.4%，過去五年增長3.6%，十年增長10.9%；相比之下，州立大學十年下降3.9%，私立大學下降7.1%——新教高教正逆流而上。但大學適齡人口即將減少，最可能受衝擊的是天主教院校（與彌撒出席下降相關）、傳統黑人大學與主流自由派新教院校，這三個板塊十年來已顯著下降；而那些高度實踐基督教身份的院校，如肯塔基西蒙斯學院、麥克默里大學，則逆勢增長。IACE院校十年增長17.1%，其他新教院校（如大峽谷大學）十年增長37%，部分來自線上擴張，但扣除後仍成長。CCCU院校十年穩步增長3.2%，領頭的都在南方；芝加哥地區的院校關閉，部分因世俗化、人口流失與市場飽和。只關注倒閉新聞，是「非救贖式新聞」，忽略了在阻力中成功的案例。市場將萎縮，但天沒有塌下來；那些把信仰高度落實為辦學特色的新教院校，表現優於世俗院校。","pts":["基督教高等教育消亡的傳聞被誇大","新教院校十年入學增長10.9%","州立與私立大學入學人數下降","適齡人口減少將帶來挑戰","天主教、黑人大學、自由派新教院校較受衝擊","高度實踐信仰身份的院校逆勢成長","部分增長來自線上教育擴張","院校關閉與地區市場飽和有關","只關注倒閉新聞是片面的","信仰鮮明的院校表現優於世俗院校"],"mm":{"c":"基督教大學的前景","b":[["數據",["新教+2.4%","十年+10.9%","世俗院校下降"]],["挑戰",["適齡人口減少","市場萎縮"]],["弱勢板塊",["天主教","傳統黑人大學","主流新教"]],["亮點",["西蒙斯學院","麥克默里大學","南方院校"]],["線上",["大峽谷大學","自由大學"]],["新聞觀",["救贖式新聞","創意模式"]]]},"fw":[["問題","基督教大學氣數已盡？"],["數據","整體增長"],["比較","世俗院校下降"],["分類","不同板塊的差異"],["地區","關閉與市場"],["結論","信仰鮮明者勝出"]],"q":["關於基督教高等教育即將消亡的傳聞，實在是誇大其詞了。","這並不意味著天要塌了，只意味著市場正在萎縮。","將信仰高度落實為辦學特色的院校，表現優於世俗院校。"],"fb":{"h":"天沒有塌下來，\n只是有人只看壞消息。","t":"「又一間基督教大學關門了。」\n「基督教高等教育正在走向末日。」\n這樣的新聞標題，你可能看過不少。\n\n但一位研究基督教高等教育的教授，\n拿出了數據，說了一句話：\n關於基督教大學即將消亡的傳聞，\n實在是誇大其詞了。\n\n過去一年，美國新教大學的入學人數增加了百分之二點四；\n過去十年，增加了將近百分之十一。\n同一段時間，州立大學下降了，\n私立世俗大學下降得更多。\n\n換句話說，\n在整個高等教育市場萎縮的時候，\n許多新教大學，正在逆流而上。\n\n當然，挑戰是真實的。\n未來幾十年，適齡的大學生會越來越少，\n市場會越來越小。\n有些學校確實在衰退：\n天主教大學隨著彌撒出席人數下降而受到衝擊；\n許多傳統黑人大學與主流自由派新教大學，\n入學人數持續下滑。\n\n但這裡有一個值得注意的模式：\n在這些衰退的群體中，\n那些逆勢成長的少數學校，\n往往是更認真活出基督教使命的學校。\n一間黑人大學，因為高度落實信仰，十年成長了九成以上；\n一間主流宗派大學，透過強化對基督的委身，十年成長了兩倍多。\n\n這是一個發人深省的翻轉：\n我們以為要生存，就要淡化信仰、迎合市場；\n數據卻顯示，\n把信仰落實成辦學特色的學校，\n反而表現得更好。\n\n至於那些關門的學校，\n有一部分其實和地區有關。\n一個大城市裡，同時擠了好幾所基督教大學，\n人口外移、世俗化加劇，市場早已飽和；\n而另一個人口更多的城市，\n卻只有一兩所。\n難怪成長最快的那些學校，大多在南方。\n\n作者還提出一個很有意思的觀念：\n「救贖式的新聞報導」。\n當我們只關注倒閉、失敗、壞消息，\n就會錯過那些在巨大阻力中，\n仍然有創意、有忠心、在成長的故事。\n\n這不只是關於大學。\n我們看教會、看社會、看下一代，\n是不是也常常只看見崩塌，\n卻看不見那些安靜生長的地方？\n\n悲觀很容易讓人顯得清醒，\n但真正的清醒，\n是同時看見挑戰，\n也看見神仍在動工的地方。\n\n天沒有塌下來。\n市場會變小，\n有些學校會關門，\n但神的工作，\n從來不是靠市場撐起來的。\n\n願我們在讀每一則壞消息的時候，\n也有一雙眼睛，\n去尋找那些\n仍在發芽的種子。\n\n#基督教教育 #大學 #數據 #盼望 #新聞觀"}},{"id":22057,"slug":"evangelical-pastors-and-the-challenge-of-eastern-orthodoxy","title":"面對東正教的吸引力，福音派牧師該如何牧養？","date":"2026-03-17","author":"Christian Clement-Schlimmã€Scott Hurst","cats":["圣经与神学"],"tags":["天主教","東正教","馬利亞","改宗教義"],"sum":"作者起初以為「福音派轉投東正教」只是演算法放大的假象，直到自己教會接連出現三個案例。他認為這挑戰範圍有限：東正教不會吸引多數隨波逐流的信徒；但它吸引的，恰恰是教會中最有神學頭腦、最具領袖潛質的年輕人——擔心西方衰落與新教無根的人、熱愛教會歷史又懷疑教皇制的人、渴望靈修深度的人。他們多半是透過YouTube等社交媒體上的「網路護教士」接觸東正教，這些人往往是前福音派，精通如何戳中福音派痛點。吸引力來自三方面：內容——強調與早期教會的連續性，主教、祭司、聖禮、大公會議令人震撼；話術——專挑新教最弱的例子批判、精心篩選內容（掩蓋如大主教為同性伴侶的孩子施洗等醜聞）；社會壓力——網路上的必勝主義與改宗故事。第二位作者建議牧者建立信任：熟悉自己的傳統（浸信會歷史也曾高看聖禮）、了解東正教的核心爭議（聖像、馬利亞、第二次尼西亞公會議的絕罰）、在講道中引用教父，例如藉耶路撒冷的西里爾與愛任紐指出東正教的馬利亞論是早期教父陌生的。最重要的是做好牧人，認真傾聽；不知道答案時，可以說「我們一起找資源想想」，並對所有人忍耐。","pts":["東正教的挑戰範圍有限，卻不容忽視","它吸引最有神學頭腦的年輕人","接觸途徑多半是社交媒體網紅","網紅常是前福音派，熟知其痛點","東正教強調與早期教會的連續性","網路內容經過篩選，專挑新教的弱點","必勝主義帶來社會壓力","牧者要熟知自己的傳統","講道中適時引用教父能建立信任","不知道答案時，邀請一同查考"],"mm":{"c":"東正教的挑戰","b":[["範圍",["有限","吸引神學型年輕人"]],["途徑",["YouTube","網路護教士","前福音派"]],["吸引力",["內容：連續性","話術：篩選","壓力：必勝主義"]],["建立信任",["熟悉傳統","了解東正教","引用教父"]],["例子",["馬利亞論","西里爾","愛任紐"]],["牧養",["傾聽","坦承不知","忍耐"]]]},"fw":[["觀察","從懷疑到正視"],["範圍","有限但嚴峻"],["途徑","如何接觸東正教"],["原因","內容、話術、壓力"],["預備","建立信任的三種方式"],["態度","沒有答案時"],["結語","以智慧牧養"]],"q":["危險不在於東正教接管福音派，而在於它挖走最有神學頭腦的年輕人。","我們不需要教父，我們只讀聖經——這句話會讓人失去信任。","說「這是個有趣的問題，我們一起找資源想想」，完全可以。"],"fb":{"h":"他們不是要離開信仰，\n而是在尋找更深的根。","t":"一位牧師原本以為，\n「福音派年輕人轉向東正教」只是網路演算法製造的假象。\n直到他的教會裡，接連出現了三個年輕人，\n各自跑來對他說：\n「牧師，我最近一直在研究東正教……」\n\n他開始認真看待這件事。\n\n他觀察到，東正教不會吸引大部分的信徒。\n那些只想輕鬆過信仰生活、或想跟上世俗文化的人，\n對它毫無興趣。\n但它吸引的，恰恰是一群特別的人：\n最愛讀神學的，\n最關心教會歷史的，\n最渴望敬拜有深度與美感的，\n最可能成為下一代教會領袖的年輕人。\n\n這是一個讓牧者心頭一緊的事實：\n危險不在於東正教會接管教會，\n而在於它可能帶走\n教會裡最有思想的那一群人。\n\n他們是怎麼接觸到東正教的？\n多半不是透過家庭或教會，\n而是透過網路。\n一些在YouTube上很有影響力的「護教網紅」，\n很多本身就是前福音派，\n非常清楚福音派的痛點在哪裡。\n\n他們說：\n你的教會說自己遵循使徒的教導，\n可是早期教會有主教、有祭司、有聖禮、有大公會議，\n為什麼你的教會看起來完全不一樣？\n\n他們專挑新教最軟弱、最膚淺的例子來批評，\n卻很少提到自己教會內部的爭議與醜聞。\n再加上網路上不斷出現的改宗見證，\n讓人產生一種錯覺：\n福音派正在崩潰，東正教勢不可擋。\n\n這裡有一個值得反省的命題：\n為什麼這些年輕人覺得，\n要找到歷史與深度，\n就必須離開自己的教會？\n\n另一位牧師誠實地說：\n有時候，問題出在我們自己。\n當我們說「我不在乎奧古斯丁或阿奎那說什麼，我只在乎聖經」，\n聽起來很屬靈，\n卻在告訴年輕人：\n你對歷史的問題，在這裡會被打發掉。\n\n於是他建議牧者做三件事：\n認識自己的傳統——\n很多福音派其實不知道，自己的宗派歷史上也曾高度看重聖禮；\n認識東正教——\n知道真正的分歧在哪裡：聖像、馬利亞、教會權柄；\n在講道中，自然地引用早期教父——\n讓會眾知道，那兩千年的歷史，\n也是我們的歷史。\n\n他舉例，談到馬利亞時可以引用早期教父：\n是聖靈使馬利亞成聖，\n不是因為她本來無罪才被揀選；\n即使是最推崇馬利亞的教父，\n也小心地不讓她取代基督唯一救主的地位。\n\n但比所有知識更重要的，\n是做一個好牧人。\n當年輕人帶著困惑來找你，\n不要急著反駁，\n先好好聽。\n如果你也不知道答案，\n可以說：\n「這是個好問題，我們一起找資料、一起想想吧。」\n\n這是一個溫柔的翻轉：\n我們以為守住羊群，靠的是贏得辯論；\n其實常常靠的是——\n讓羊知道，\n他們可以帶著最難的問題，\n回到牧人身邊。\n\n我們的目標，\n不是保住教會的人數，\n而是守住福音，\n幫助每一個人，\n單單信靠基督。\n\n#東正教 #福音派 #教會歷史 #牧養 #年輕人"}},{"id":22055,"slug":"bring-pastoral-regrets-god","title":"把牧者的遺憾帶到神面前","date":"2026-03-17","author":"Phil A. Newton","cats":["教会事工"],"tags":["服事","教牧","遺憾"],"sum":"退休近四年、牧會五十年的作者，幾乎每週都會想到：若能重回講台，哪些事可以做得不同、更好，甚至不該做。這些遺憾沒有改變他在神面前的地位，反而使他更渴求恩典，成為成長的契機。生命層面的遺憾：一、太急著給意見，沒有聽人把話說完，容易折斷壓傷的蘆葦；二、對需要福音更新的會眾缺乏耐心，暴露出自己不真正相信神的恩典能改變人；三、沒有早點學會在神的護理中喜樂，常垂頭喪氣，未給羊群安息的榜樣。實踐層面：一、沒有花更多時間默想神的話——像少年野外求生時把一塊骨頭含在嘴裡吸吮幾小時那樣，吸吮福音的汁水，而不是匆匆從經文跑到講台；二、沒有更迫切地禱告，禱告的缺乏暴露出不信靠應許的自力更生。講台層面：一、沒有更專注地藉講道幫助會眾預備見主——一位將死的老弟兄來電後他大哭，明白牧會最重要的是幫人預備好去見主；二、沒有在聖餐時把福音講得更清楚，輕慢了這份調動五官的禮物。遺憾催他前行，因有一天見主面時，祂要擦去一切眼淚，那時不再有遺憾。","pts":["遺憾不改變我們在神面前的地位","遺憾使人更渴求恩典","太急著給意見，沒有用心傾聽","對他人缺乏耐心，是不信神能改變人","要學會在神的護理中喜樂","默想就是吸吮福音的汁水","禱告的缺乏暴露出自力更生","講道要幫助會眾預備見主","聖餐是調動五官的福音禮物","見主面時，將不再有遺憾"],"mm":{"c":"牧者的遺憾","b":[["生命",["急著給意見","缺乏耐心","不夠喜樂"]],["實踐",["默想不足","禱告不足"]],["講台",["預備見主","聖餐的福音"]],["比喻",["吸吮骨頭","永恆導航儀"]],["恩典",["地位不變","成長契機"]],["盼望",["擦去眼淚","不再遺憾"]]]},"fw":[["反思","退休後的遺憾"],["生命","心的問題"],["實踐","默想與禱告"],["講台","預備見主與聖餐"],["盼望","遺憾催人前行"]],"q":["越接近天堂，我就越會想到那些小事。","我牧會這麼多年，最重要的一件事，是幫助人預備好去見主。","默想，就是不停地吸吮福音的汁水。"],"fb":{"h":"遺憾不會改變你在神面前的地位，\n卻能改變你接下來的路。","t":"一位牧師牧會了五十年。\n退休之後，他發現自己幾乎每個禮拜都會想到：\n如果能重來，\n有哪些事，我可以做得不一樣？\n有哪些事，我可以做得更好？\n甚至，有哪些事，我根本不該做？\n\n這些念頭，常常變成遺憾。\n\n但每當遺憾浮上心頭，\n神就提醒他：\n你在我面前的地位，從來不是靠你的表現。\n於是，遺憾沒有把他壓垮，\n反而讓他更渴望恩典。\n\n他分享了幾個縈繞在心裡的遺憾。\n\n第一，我太急著給意見。\n人家話還沒說完，我就開好了藥方。\n耶穌不折斷壓傷的蘆葦，不吹滅將殘的燈火，\n我卻常常因為太相信自己的看法，\n還沒體會別人的痛，就急著指點。\n\n第二，我對別人的改變沒有耐心。\n我希望會眾快快長大、快快像基督。\n可是我自己的改變，也花了那麼多年。\n說到底，我的急躁，\n是因為我不夠相信神的恩典真的能改變人。\n\n第三，我太晚學會在神的安排中喜樂。\n有太多次，我本該安息在神的信實裡，\n卻垂頭喪氣，\n讓羊群看不見一個安息的牧人。\n\n他還想起少年時一次野外求生。\n十幾個男孩沒有東西吃，\n打到的一點獵物，每人只分到一小口。\n他把一塊骨頭含在嘴裡，吸了好幾個小時，\n只為了吸出一點點營養。\n他說：默想神的話，就是這樣。\n不停地吸吮福音的汁水，\n直到靈魂得飽足。\n可是有多少年，他都是匆匆忙忙地\n從經文跑到註釋，從註釋跑到講稿，從講稿跑上講台，\n卻沒有停下來，\n嚐一嚐這道對自己的靈魂有多甘甜。\n\n他也遺憾自己禱告得不夠。\n不是不知道要禱告，\n而是禱告的缺乏，暴露了一件事：\n我其實沒有那麼信靠神的應許，\n而是習慣靠自己撐下去。\n\n最深的遺憾，發生在牧會的最後幾年。\n教會裡最年長的一位弟兄打電話給他。\n老弟兄身體越來越差，腦子也開始糊塗了。\n他們在電話裡聊福音、聊天上的喜樂。\n掛了電話，他大哭了一場。\n妻子嚇了一跳，他說：\n「我現在才明白，\n牧會這麼多年，最重要的一件事，\n是幫助人預備好去見主。」\n\n這是一個深刻的翻轉：\n我們以為牧會的重點，是把今天的事做好；\n其實最重要的，\n是幫每個人裝上一個永恆的導航——\n我們都正在預備，\n面對面見耶穌。\n\n他說，他還在學。\n遺憾推著他往前走，\n因為他知道，有一天，\n他會見到耶穌，\n祂要親手擦去他一切的眼淚。\n那時，\n就再也沒有遺憾了。\n\n也許你也有很多遺憾。\n對孩子，對伴侶，對朋友，對自己的服事。\n把它們帶到神面前吧。\n遺憾不能改寫過去，\n但在恩典裡，\n它可以改寫\n你接下來的每一天。\n\n#遺憾 #牧者 #恩典 #默想 #永恆"}}];
const COLORS=['--c1','--c2','--c3','--c4','--c5','--c6'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cat='全部', cur=null;
const TC={'文化与艺术':'文化與藝術','圣经与神学':'聖經與神學','教会事工':'教會事工','信仰与工作':'信仰與工作','社会与时事':'社會與時事','卡森神学更新中心':'卡森神學更新中心','凯勒文化护教中心':'凱勒文化護教中心','基督徒生活':'基督徒生活','十个错误':'十個錯誤','我的书架上有什么':'我的書架上有什麼','讲道工具箱':'講道工具箱','荆棘与蒺藜':'荊棘與蒺藜','与资深基督徒作家对谈':'與資深基督徒作家對談','五种迷思':'五種迷思'};
DATA.forEach(a=>{a.cats=a.cats.map(c=>TC[c]||c);a._t=[a.title,a.author,a.tags.join(' '),a.cats.join(' '),a.sum,a.pts.join(' '),a.q.join(' '),a.mm.c,a.mm.b.map(b=>b[0]+b[1].join(' ')).join(' '),a.fw.map(f=>f.join(' ')).join(' '),a.fb?a.fb.h+' '+a.fb.t:''].join(' ').toLowerCase()});
const cats={};DATA.forEach(a=>a.cats.forEach(c=>cats[c]=(cats[c]||0)+1));
function chips(){
  const all=['全部',...Object.keys(cats).sort((x,y)=>cats[y]-cats[x])];
  $('#chips').innerHTML=all.map(c=>`<button class="chip${c===cat?' on':''}" data-c="${esc(c)}">${esc(c)}${c==='全部'?'':' '+cats[c]}</button>`).join('');
}
function hl(s,terms){s=esc(s);terms.forEach(t=>{if(!t)return;const r=new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');s=s.replace(r,m=>`<mark>${m}</mark>`)});return s}
function terms(){return $('#q').value.trim().toLowerCase().split(/\s+/).filter(Boolean)}
function filtered(){const t=terms();return DATA.filter(a=>(cat==='全部'||a.cats.includes(cat))&&t.every(x=>a._t.includes(x)))}
function renderList(){
  const r=filtered(),t=terms();
  $('#count').textContent=`${r.length} / ${DATA.length} 篇`;
  $('#list').innerHTML=r.length?r.map(a=>`<div class="item${cur===a.id?' on':''}" data-id="${a.id}"><b>${hl(a.title,t)}</b><small>${esc(a.date)} · ${hl(a.author,t)}</small></div>`).join(''):'<div class="empty">找不到符合的文章</div>';
}
function show(id,push){
  const a=DATA.find(x=>x.id===id);if(!a)return;cur=id;const t=terms();
  document.body.classList.add('detail');
  $('#view').innerHTML=`
  <button class="tbtn" id="back">← 回到清單</button>
  <div class="card">
    <div class="meta">${esc(a.date)} · ${esc(a.author)} · ${a.cats.map(esc).join('、')}</div>
    <h2>${hl(a.title,t)}</h2>
    <div class="tags">${a.tags.map(g=>`<span class="tag" data-tag="${esc(g)}">#${esc(g)}</span>`).join('')}</div>
  </div>
  <div class="card"><h3>重點摘要</h3><div class="sum">${hl(a.sum,t)}</div><ul class="pts">${a.pts.map(p=>`<li>${hl(p,t)}</li>`).join('')}</ul></div>
  <div class="card"><h3>心智圖</h3><div class="mm"><div class="mm-c">${hl(a.mm.c,t)}</div><div class="mm-stem"></div><div class="mm-row">${a.mm.b.map((b,i)=>`<div class="mm-b" style="--bc:var(${COLORS[i%6]})"><div>${hl(b[0],t)}</div>${b[1].map(l=>`<span>${hl(l,t)}</span>`).join('')}</div>`).join('')}</div></div></div>
  <div class="card"><h3>框架圖</h3><div class="fw">${a.fw.map((f,i)=>`${i?'<div class="fw-ar">↓</div>':''}<div class="fw-s"><div class="fw-n">${i+1}</div><div class="fw-box"><b>${hl(f[0],t)}</b>${hl(f[1],t)}</div></div>`).join('')}</div></div>
  <div class="card"><h3>金句</h3><div class="qs">${a.q.map(x=>`<div class="qt">${hl(x,t)}</div>`).join('')}</div><div class="note">金句為依文章重點精煉改寫，非逐字引文。　出處：${esc(a.slug)}</div></div>
  ${a.fb?`<div class="card"><h3>臉書圖文</h3><div class="fb-cover"><div class="h">${esc(a.fb.h)}</div><div class="bar"></div><div class="s">${esc(a.title)}</div></div><div class="fb-act"><button class="tbtn" id="fbimg">下載封面圖</button><button class="tbtn" id="fbcopy">複製貼文</button></div><div class="fb-text">${hl(a.fb.t,t)}</div><div class="note">依文章重點原創改寫的貼文草稿，發布前請自行潤飾。</div></div>`:''}`;
  renderList();
  if(push!==false)history.replaceState(null,'','#'+id);
  window.scrollTo({top:0});
}
function fallbackCopy(txt,done){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}ta.remove()}
function wrap(ctx,text,maxW){const lines=[];let line='';for(const ch of text){if(ch==='\n'){lines.push(line);line='';continue}if(ctx.measureText(line+ch).width>maxW){lines.push(line);line=ch}else line+=ch}if(line)lines.push(line);return lines}
function cover(a){const S=1080,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,S,S);g.addColorStop(0,'#2b2118');g.addColorStop(.55,'#6b4423');g.addColorStop(1,'#b07a3e');x.fillStyle=g;x.fillRect(0,0,S,S);
  const P=100,W=S-P*2;x.fillStyle='#fbf3e6';x.font='bold 68px "Noto Serif TC","PMingLiU",serif';const hl=wrap(x,a.fb.h,W);
  x.font='36px "Noto Sans TC","Microsoft JhengHei",sans-serif';const sl=wrap(x,a.title,W);
  const hH=hl.length*104,total=hH+90+sl.length*58;let y=(S-total)/2+68;
  x.font='bold 68px "Noto Serif TC","PMingLiU",serif';hl.forEach(l=>{x.fillText(l,P,y);y+=104});
  x.fillStyle='#e8c48c';x.fillRect(P,y-40,120,6);y+=50;x.fillStyle='rgba(251,243,230,.85)';x.font='36px "Noto Sans TC","Microsoft JhengHei",sans-serif';sl.forEach(l=>{x.fillText(l,P,y);y+=58});
  const link=document.createElement('a');link.download=a.fb.h.replace(/[\\/:*?"<>|\n]/g,'').slice(0,30)+'.png';link.href=c.toDataURL('image/png');link.click()}
$('#list').addEventListener('click',e=>{const it=e.target.closest('.item');if(it)show(+it.dataset.id)});
$('#chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;cat=c.dataset.c;chips();renderList()});
$('#view').addEventListener('click',e=>{
  if(e.target.id==='back'){document.body.classList.remove('detail');return}
  const a=DATA.find(x=>x.id===cur);
  if(e.target.id==='fbcopy'&&a&&a.fb){const txt=a.fb.h+'\n\n'+a.fb.t;const done=()=>{e.target.textContent='已複製 ✓';setTimeout(()=>e.target.textContent='複製貼文',1500)};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done));else fallbackCopy(txt,done);return}
  if(e.target.id==='fbimg'&&a&&a.fb){cover(a);return}
  const g=e.target.closest('.tag');if(g){$('#q').value=g.dataset.tag;renderList();document.body.classList.remove('detail')}
});
$('#q').addEventListener('input',()=>{renderList();if(innerWidth<=820)document.body.classList.remove('detail')});
$('#theme').addEventListener('click',()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('tgc-theme',r.dataset.theme)}catch(e){}});
try{const t=localStorage.getItem('tgc-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
chips();renderList();
const h=+location.hash.slice(1);
if(h&&DATA.some(a=>a.id===h))show(h,false);
else if(DATA.length&&innerWidth>820)show(DATA[0].id,false);
</script>
</body>
</html>
