理表格，你都在管理神的創造；即使主管沒看見，神看見。二、為主作工，等候祂的獎賞：西3:23–24、加6:9；我們不是靠工作得救，但神會按忠心給予獎賞，正直工作本身也是喜樂與敬拜。可在工作中禱告，或每天下午3:23設鬧鐘提醒自己。三、謙卑不等於隱藏：主動與主管溝通、請求反饋，記錄具體可量化的成果；公開分享成就時問自己高舉的是誰，以林前4:7的精神感謝神與同事。凱勒說謙卑是少想自己。最後以林前15:58鼓勵：你的勞苦在主裡不是徒然的。","pts":["渴望被認可是天性，不是軟弱","你的工作是神更新世界的一部分","主管沒看見，神卻看在眼裡","我們為主作工，等候祂的獎賞","全心工作本身就是敬拜","在工作中用禱告調整心態","主動溝通並記錄自己的成果","謙卑不等於保持沉默","你的勞苦在主裡不是徒然的"],"mm":{"c":"無人喝彩時的堅持","b":[["問題",["沒有稱讚","只靠內在動力"]],["肯定",["渴望認可是天性","不公平"]],["更宏大計劃",["國度重建","管家職分","神看見"]],["主的獎賞",["西3:23–24","加6:9","工作即敬拜"]],["實踐",["禱告","3:23鬧鐘","溝通與記錄"]],["謙卑",["林前4:7","少想自己"]]]},"fw":[["問題","讀者的困擾"],["同理","渴望被認可"],["視角","工作屬於神的計劃"],["獎賞","為主作工"],["行動","謙卑不等於隱藏"],["鼓勵","勞苦不是徒然"]],"q":["你那無人關注的工作，在神那裡從未被漏掉。","即便沒人看見，全身心投入工作本身就是一種敬拜。","謙卑不是看低自己，而是少想自己。"],"fb":{"h":"沒有人為你鼓掌時，\n天上的那一位看見了。","t":"你很努力。\n報告準時交，問題主動解決，別人不想做的事你默默做完。\n績效考核寫得很好看，\n但一整年下來，沒有人對你說過一句：「做得好。」\n\n你告訴自己：我是為主工作的。\n可是說真的，只靠內在動力，撐得好累。\n\n先說一句很重要的話：\n渴望被認可，不是軟弱，也不是驕傲；\n那是人的天性。\n神造我們去工作，也讓我們的工作有意義。\n想知道自己做的事有價值，再自然不過。\n\n但我們可以換一個角度看你的辦公桌。\n\n你以為你只是在整理表格、回覆客戶、修理設備？\n從基督復活那天起，祂就開始重建祂的國度，\n要把萬物恢復成起初那「甚好」的樣子。\n而祂選擇透過人的工作來做這件事。\n你在追求秩序、美善、公義與人的福祉，\n你是在管理神的創造。\n\n主管沒看見，\n神看見了。\n同事沒道謝，\n神記下了。\n\n保羅說：「無論做什麼，都要從心裡做，像是給主做的，\n因為你們知道從主那裡必得著基業為賞賜。」\n又說：「行善不可喪志，若不灰心，到了時候就要收成。」\n\n這裡有一個認知翻轉：\n我們以為沒被看見的工作是浪費，\n其實沒被看見的工作，可能是最純粹的敬拜——\n因為你不是為了掌聲而做。\n\n但這不代表你只能默默承受。\n謙卑不等於隱藏。\n你可以主動和主管溝通，請求反饋；\n你可以記錄自己的成果，用具體的數字說明貢獻；\n當你升遷或達成里程碑，也可以分享——\n只是先問自己：我想高舉的是誰？\n這篇貼文，是在感謝神與同事，還是在擦亮自己的名字？\n\n凱勒說，謙卑不是看低自己，\n而是少想自己。\n\n還有一個小練習：\n在手機設一個下午3:23的鬧鐘——\n對應歌羅西書3章23節。\n鈴響時，停下三秒，\n想想剛才的工作裡，哪一刻有神同在。\n\n你加的班，祂看見；\n你吞下的委屈，祂看見；\n你那份沒人誇獎的用心，\n已經寫進一本永遠不會遺失的帳簿。\n\n「你們的勞苦在主裡面，不是徒然的。」\n\n所以，明天早上，\n還是準時坐回那張辦公桌吧。\n就算全世界都沒注意到你，\n也有一雙眼睛，\n溫柔地注視著你。\n\n#職場信仰 #工作 #認可 #謙卑 #歌羅西書"}},{"id":22459,"slug":"challenges-protestant-church-part-1","title":"新教教會面臨的挑戰（第一部分）","date":"2026-04-26","author":"Jared C. Wilsonã€Brett McCrackenã€Gavin Ortlundã€Brad Edwards","cats":["圣经与神学"],"tags":["危機","焦慮","Z世代","播客"],"sum":"這是福音聯盟大會座談的第一部分，三位作者各作短講。威爾遜引用卡森轉述的門諾派定律：第一代珍視福音，第二代視為理所當然，第三代便失落福音；以福音為中心的運動如今也成了部落標籤。他給學生三條原則：整本聖經都關於耶穌；人因恩典而非律法改變；我們最終的肯定在於基督為我們成就的，而非自己的表現。他列出五種偏離危險——受害者心態、膚淺信仰、吸引力實用主義、文化律法主義、屬靈乾枯，並指出講不出基督的傳道人，常是自己缺乏與基督的相交。奧特倫德談「教會焦慮」：許多Z世代追問「我在耶穌所建立的教會裡嗎」，背後是焦慮與無根感；福音能帶來確據（羅8:16、凱瑟琳·帕爾的見證），新教歷史也提供深度，此刻正是傳福音、為復興禱告的時候。愛德華茲指出今日唯一的共識是「體制都有害」，激進個人主義成了新的巴別塔，人想「傳揚自己的名」；但神把祂的名放在子民身上，大使命正是更美的亞倫祝福——認識新婦就是認識新郎。他的建議是：回到教會。","pts":["第一代珍視福音，第二代視為理所當然","以福音為中心不是自動駕駛","整本聖經都關於耶穌","人因恩典而非律法改變","我們的肯定在於基督，不在表現","屬靈乾枯是各種偏離的主線","許多年輕人有教會焦慮與無根感","福音帶來確據與深度","個人主義是現代的巴別塔","認識新婦就是認識新郎"],"mm":{"c":"新教教會的挑戰（上）","b":[["威爾遜",["福音失憶","三條原則","五種偏離"]],["屬靈乾枯",["講不出基督","泰晤士河會不會冒煙"]],["奧特倫德",["教會焦慮","確據","無根感"]],["資源",["清教徒","凱瑟琳·帕爾","教會歷史"]],["愛德華茲",["反體制共識","巴別塔","傳揚己名"]],["神的名",["亞倫祝福","大使命","回到教會"]]]},"fw":[["開場","科技帶來的機遇與挑戰"],["短講一","免得我們隨流失去"],["短講二","焦慮與無根的世代"],["短講三","支持教會的理由"],["共同點","復興從回到福音與教會開始"]],"q":["以福音為中心，不像自動駕駛，設定好就不用再理會。","藉著這確信，我感受到罪得赦免。","如果你想認識新郎，就必須置身於祂的新婦之中。"],"fb":{"h":"第一代為福音流淚，\n第二代把它當壁紙。","t":"有一個讓人背脊發涼的定律：\n第一代人珍惜福音，並因此活出社會責任；\n第二代人把福音當作理所當然，轉而強調那些責任；\n到了第三代，責任還在，福音卻不見了。\n\n這不只是某一個宗派的故事，\n可能也是你我教會正在上演的劇本。\n\n「以福音為中心」——這句話我們聽過太多次，\n印在網站上，寫在簡介裡，講在研討會中。\n可是如果有人問你：「它到底是什麼意思？」\n你答得出來嗎？\n\n一位神學院老師給學生三句話：\n第一，整本聖經都是關於耶穌。\n第二，人是因恩典改變，不是因律法改變。\n律法可以管住行為，卻改不了心；\n只有看見主的榮光，人才會從裡面被更新。\n第三，你最終的肯定，不在你的表現，而在基督為你成就的。\n每天早上醒來，神不是站在床邊說：「讓我看看你今天有幾斤幾兩。」\n你醒來，是醒在祂的恩典裡；\n你睡去，也是睡在祂的恩典裡。\n\n這三句話很簡單，\n卻是許多傳道人最難活出來的。\n\n有人問：「每週講耶穌，會不會太千篇一律？」\n老師心裡想反問：「耶穌對你來說，是千篇一律的嗎？」\n講不出基督的講台，\n常常來自一顆很久沒有與基督獨處的心。\n就像那句老話：\n我不在乎你能不能點燃泰晤士河，\n我在乎的是——把你丟進河裡，河水會不會冒煙？\n\n另一位講員看見另一種現象：\nZ世代裡，越來越多年輕人陷入一種「教會焦慮」。\n他們問：我在耶穌建立的教會裡嗎？我真的得救了嗎？\n他們渴望確據，渴望根基，渴望與千年的歷史相連。\n而這，正是福音的機會——\n因為聖靈仍在人心裡作見證：你是神的兒女。\n\n第三位講員說，今天唯一的共識，似乎是「體制都是有害的」。\n人人都想替自己取名字、蓋高塔，\n像巴別塔的建造者一樣，「要傳揚我們的名」。\n可是神的方式恰恰相反：\n祂把自己的名，放在祂的子民身上。\n\n所以，認識新婦，就是認識新郎；\n離開教會想親近耶穌，\n就像想跟一個人做朋友，卻要求他永遠不帶家人。\n\n這是一個翻轉：\n我們以為復興需要新方法，\n其實復興常常從最舊的地方開始——\n悔改、禱告、回到福音、回到教會。\n\n別讓福音變成牆上的壁紙。\n今天，停下腳步，\n再看一次那幅畫：\n十字架上的那一位，\n仍然為你張開雙手。\n\n#福音 #教會 #復興 #Z世代 #新教"}},{"id":22457,"slug":"why-returned-middle-east","title":"我爲何回到了中東","date":"2026-04-25","author":"Anonymous","cats":["教会事工"],"tags":["戰爭","中東"],"sum":"一位匿名宣教士在中東服事大學生近兩年，戰爭爆發後回國參加婚禮，卻在政府建議撤離時逆行返回。他說明三個理由。一、他的教會：他是當地教會的立約成員，第一次爆炸後不到24小時教會就聚集敬拜，彼此鼓勵持守盼望；離開也許明智，但他渴望與屬靈家人並肩。二、他的服事：恐懼與動盪使人心特別適合撒福音種子，他呼籲非信徒悔改，也與基督徒學生禱告讀經；計劃雖被打亂，他相信神在廢墟中作工；基督捨己為僕的愛激勵他。三、他的保障：國家防禦固然出色，但神才是他的避難所（詩46:1）；耶穌已替他承受終極的忿怒，最大的威脅不是戰爭，而是對聖潔神的虧欠，如今已蒙赦免，人又能把他怎樣（詩118:6）。他提醒每位讀者：教會的重要、作基督使者的身份、在神裡的盼望，是所有神子民的根基。","pts":["他在戰時逆著撤離潮返回中東","他是當地教會立約的成員","爆炸後不到一天，教會就聚集敬拜","委身的團契是神賜的寶貴禮物","動盪的時刻更適合撒福音種子","基督捨己的愛激勵他服事","神是比軍事防禦更穩固的避難所","最大的威脅是對神的虧欠，已在基督裡解決","這些真理適用於每一位基督徒"],"mm":{"c":"我為何回到中東","b":[["處境",["戰爭","撤離建議","逆行返回"]],["教會",["立約成員","爆炸後聚會","並肩同行"]],["服事",["大學生","福音種子","廢墟中作工"]],["保障",["詩46:1","耶穌承受忿怒","詩118:6"]],["應用",["為我們禱告","把每天獻給主"]]]},"fw":[["處境","空蕩的飛機艙"],["理由一","我的教會"],["理由二","我的服事"],["理由三","我的保障"],["邀請","那麼你呢？"]],"q":["對我生命最大的威脅，不是戰爭，而是我對聖潔神的虧欠。","在這片黑暗的土地上作基督的使者，是何等大的榮幸。","從永恆來看，人什麼也不能把我怎樣。"],"fb":{"h":"當所有人都在離開，\n他買了一張回程機票。","t":"飛機上空蕩蕩的。\n很多人取消了行程——因為目的地，是戰火中的中東。\n政府建議公民撤離，\n他卻逆著人潮，飛回那片飛彈呼嘯的天空。\n\n家人問他：為什麼？\n他給了三個答案。\n\n第一，因為那裡有他的教會。\n第一聲爆炸響起後不到二十四小時，教會就聚在一起了。\n一夜沒睡的他，忐忑地走進聚會；\n看見弟兄姊妹一個一個出現，心就被堅固了。\n他們唱詩、禱告、聽道，\n在警報與恐懼之間，彼此提醒：主必再來。\n\n這是一個值得我們停下來想的問題：\n教會，對你來說是什麼？\n是一個週日可去可不去的地方，\n還是一群你願意在危難時並肩站立的家人？\n\n第二，因為那裡有他的服事。\n戰爭讓人心惶惶，\n卻也讓人心第一次敞開。\n平安時被忽略的問題——\n我死了會去哪裡？什麼才是穩固的？——\n在警報聲中變得無比真實。\n他和學生一起讀經禱告，\n也向不信的人說明：離開基督的生命，比戰爭更危險。\n計劃被打亂了，\n但他相信，神正在廢墟中寫一個新的故事。\n\n第三，因為他有一個比防空系統更堅固的避難所。\n「神是我們的避難所，是我們的力量，是患難中隨時的幫助。」\n他說了一句很深的話：\n對我生命最大的威脅，不是戰爭，\n而是我對聖潔神的虧欠。\n而這個威脅，耶穌已經在十字架上替我承擔了。\n\n這是認知的翻轉——\n我們以為最可怕的是飛彈，\n其實最可怕的是與神隔絕；\n我們以為安全來自遠離危險，\n其實安全來自靠近那位掌管一切的神。\n\n人能做的事很多，\n能傷害身體，能奪走財產，能打亂計劃；\n但從永恆來看，\n人什麼也不能把屬神的人怎樣。\n\n當然，不是每個人都蒙召回到戰區。\n離開，有時也是智慧。\n但他的三個理由，是每一個基督徒都可以帶著走的：\n我屬於一個教會，\n我是基督的使者，\n我的盼望錨在天上。\n\n今天，當你滑過那些戰爭的新聞，\n請為他們禱告，\n也為自己禱告：\n求主讓我們把每一個平凡的日子，\n都活成一次逆行——\n朝著需要的人，\n朝著祂。\n\n#中東 #宣教 #教會 #避難所 #禱告"}},{"id":22454,"slug":"what-makes-christianity-credible","title":"福音真不真？看教會怎麼活","date":"2026-04-25","author":"Frank Thielman","cats":["教会事工","卡森神学更新中心"],"tags":["卡森中心","新造","可信"],"sum":"垃圾郵件、詐騙簡訊、機器人電話——我們活在真假難辨的資訊洪流中，難怪非信徒聽到福音會打個問號，連基督徒也會在懷疑中打轉。保羅寫以弗所書時，讀者也處在「異教之風」的包圍中，他提醒他們不要忘記在基督裡的身份與相應的生活。這身份來自與基督聯合，並在一個新社會中彼此聯結：那使基督復活、坐在寶座上勝過一切執政掌權者的大能，正運行在信徒身上；神「為教會作萬有之首」，正在恢復人類起初治理萬有的地位。神把死在過犯中的人與基督一同復活，使他們成為神的工作，好行善；又拆毀隔斷的牆，把彼此敵對的族群造成一個新人，建成一座以基督為房角石的聖殿。落到實處，就是謙虛、溫柔、忍耐、說誠實話、控制怒氣、慷慨助人、效法神的愛。教會若這樣活出跨越種族與階層的合一之愛，那聽來好得難以置信的福音就變得可信。","pts":["我們活在真假難辨的資訊洪流中","福音的宣告聽起來好得難以置信","以弗所書提醒信徒記得自己的身份","使基督復活的大能運行在信徒身上","教會是神修復受造秩序的第一步","神把敵對的群體造成一個新人","教會是以基督為房角石的聖殿","新身份體現在謙和、誠實、慷慨的生活","教會的愛使福音變得可信"],"mm":{"c":"教會使福音可信","b":[["處境",["垃圾資訊","真假難辨","懷疑"]],["身份",["與基督聯合","新社會","萬有之首"]],["新造",["弗2:1–10","神的工作","行善"]],["合一",["拆毀隔牆","一個新人","聖殿"]],["實踐",["謙虛溫柔","說誠實話","效法神的愛"]],["見證",["跨越邊界","福音可信"]]]},"fw":[["問題","資訊洪流中的福音"],["經文","以弗所書的背景"],["身份","新造世界中的新社會"],["過程","新造之人與新群體"],["實踐","落到實處，更加可信"]],"q":["如果教會憑愛心行事，好得難以置信的福音就會變得可信。","教會，正是神修復受造秩序的第一步。","我們是神修復人類之工的開端。"],"fb":{"h":"在一個真假難辨的時代，\n教會的愛就是證據。","t":"打開舊信箱，幾個小時內就收到：\n「白宮內幕，真相驚人！」\n「稅務通知，請立即處理！」\n「火星上的神祕發現！」\n\n我們活在一個資訊爆炸、真假難辨的時代。\n詐騙電話裝成客服，假新聞穿上真新聞的衣服，\n連公司都要上資安課，教你別點錯連結。\n\n在這樣的時代，有人告訴你：\n「宇宙的創造者愛你，祂已經為你死了又復活了，你可以與祂和好。」\n你的第一反應是什麼？\n很可能是——這又是一封垃圾郵件吧？\n\n這是一個嚴肅的問題：\n福音，憑什麼在謊言的洪流中被相信？\n\n兩千年前，保羅寫信給以弗所的信徒。\n他們也活在各樣「異教之風」裡，被吹得飄來飄去。\n保羅沒有寫一套更精彩的廣告詞，\n而是提醒他們：記得你是誰，然後活出來。\n\n你是誰？\n那使基督從死裡復活、坐在寶座上勝過一切邪惡權勢的大能，\n正運行在你身上。\n你曾死在過犯中，如今與基督一同活過來；\n你是神的作品，被造是為了行善。\n\n你們又是誰？\n你們原本是彼此敵對的群體——\n不同種族、不同階層、不同背景，\n神卻拆毀了中間隔斷的牆，\n把兩下造成一個新人，\n建成一座以基督為房角石的聖殿。\n\n這聽起來很宏大，\n但保羅馬上把它放回廚房和辦公室：\n要謙虛、溫柔、忍耐；\n說誠實話，不要說謊；\n生氣卻不要犯罪；\n親手做工，好分給缺乏的人；\n不說污穢的話，只說造就人的話；\n彼此饒恕，像神在基督裡饒恕你們一樣。\n\n這裡有一個翻轉：\n我們以為福音的可信度，取決於論證夠不夠嚴密；\n其實很多時候，取決於教會夠不夠相愛。\n我們以為要先說服人，人才會來看；\n其實人常常是先看見，才願意聽。\n\n一個跨越族群的擁抱，\n一次放下身段的道歉，\n一份不求回報的幫助，\n一個在衝突中仍選擇饒恕的群體——\n這些，是任何垃圾郵件都偽造不了的。\n\n世界不缺好聽的話，\n缺的是活出來的真話。\n\n所以，如果你想讓人相信那好得難以置信的福音，\n不必先寫一篇更漂亮的文章。\n先去愛你身邊那個和你很不一樣的弟兄。\n\n在這個真假難辨的時代，\n願我們成為一封\n不會被丟進垃圾桶的信。\n\n#以弗所書 #教會 #合一 #見證 #福音"}},{"id":22452,"slug":"solving-the-encampment-crisis","title":"如何解除帳篷營地危機？","date":"2026-04-24","author":"Dwayne Cline","cats":["社会与时事"],"tags":["貧窮","正義","無家可歸"],"sum":"在加拿大漢密爾頓市中心牧會28年的作者，常走過市內的露宿者帳篷營地。數據顯示，加國無家可歸者中六成有成癮或心理健康問題，安大略省有約1400個營地；同一城市兩個相隔十分鐘步行的社區，收入差距近十萬、預期壽命差23年。領取殘障補助每月1368元的人，在多倫多付完房租便一無所有，若再加上精神疾病，處境更絕望。聖經詳盡論述神對窮人的心意：以賽亞書58章斥責一面敬拜一面欺壓窮人的百姓，呼召人分享食物、住處、衣服，不可躲避「自己的骨肉」——每個人都是神的形像；也要除掉「指摘人的指頭」。好撒瑪利亞人停下來、路加福音14章邀請窮人赴宴、初代教會變賣產業、雅各書說看顧孤兒寡婦才是真虔誠。基督生在馬槽、死在罪犯中間。聖經只一處吩咐政府看顧窮人，其餘都是吩咐神的子民。教會應確保肢體中沒有缺乏、與無家者做朋友、提供避寒與可負擔的住房、少得一點好讓他們多得一點；這樣的無私將使神得榮耀。","pts":["帳篷營地危機日益嚴重","多數無家可歸者有成癮或心理健康問題","貧富差距甚至造成23年的壽命差","微薄補助在高房租下毫無出路","聖經吩咐神的子民看顧窮人","每個窮人都是神的形像承載者","不要用指摘的手指羞辱窮人","基督親自生活在窮人中間","不能光指望政府，教會要行動","教會的無私將使神得榮耀"],"mm":{"c":"帳篷營地危機","b":[["現實",["成癮與心理疾病","1400個營地","23年壽命差"]],["住房危機",["殘障補助","高房租","沒有出路"]],["聖經",["賽58章","好撒瑪利亞人","雅1:27"]],["基督",["生於馬槽","看顧窮人"]],["教會行動",["肢體無缺乏","交朋友","提供住處","少得一點"]],["結果",["修補破口","神得榮耀"]]]},"fw":[["場景","車窗外的乞討者"],["數據","殘酷的現實"],["雪上加霜","住房危機"],["聖經","神對窮人的心意"],["榜樣","效法基督"],["行動","教會的四項回應"]],"q":["別人處境與我不同，但本質與我相同，我為什麼要躲開他呢？","你不可能照顧每一個人，但你至少可以照顧某一個人。","我們要少得一點，好讓他們多得一點。"],"fb":{"h":"十分鐘的路，\n隔著二十三年的壽命。","t":"紅燈前，有人走到你的車窗邊，向你要零錢。\n那一刻，你的心裡閃過什麼？\n緊張？厭煩？同情？還是假裝沒看見？\n\n那一瞬間的反應，比任何神學考試都更誠實地說出：\n我們心裡怎麼看待窮人。\n\n一位在加拿大市中心牧會二十八年的牧師，每天走過露宿者的帳篷營地。\n他給了我們幾個數字：\n無家可歸的人中，六成有成癮問題，六成有心理健康困擾。\n在他的城市，兩個社區相隔只要步行十分鐘，\n收入相差將近十萬，\n平均壽命，相差二十三年。\n\n十分鐘的路，\n隔著二十三年的生命。\n\n一位靠殘障補助生活的人，每月只有一千三百多元。\n在大城市，付完房租，就一分不剩。\n沒有錢吃飯，沒有錢買衣服，沒有錢搭車。\n如果他還深信自己這週去了以色列，\n你告訴我，他要怎麼活下去？\n\n這裡有一個尖銳的問題：\n看顧窮人，是誰的責任？\n\n我們很習慣說：這是政府的事。\n但這位牧師說，整本聖經裡，\n明確吩咐政府看顧窮人的，大概只有一處；\n其餘幾百處，都是對神的子民說的。\n\n以賽亞書58章，神斥責一群很會敬拜、很會禁食的人，\n因為他們一邊尋求神，一邊欺壓窮人。\n神說：你要把餅分給飢餓的，\n把漂流的窮人接到家裡，\n見赤身的給他衣服遮體，\n不可躲避「自己的骨肉」。\n\n什麼是自己的骨肉？\n不只是親戚，\n而是每一個和你一樣，帶著神形像的人。\n他的處境和你不同，\n但本質和你一樣。\n\n神還說：要除掉「指摘人的指頭」。\n「那是他們自己的錯。」\n「是他們不努力。」\n這些話，常常是我們躲開的理由。\n\n耶穌生在馬槽，死在罪犯中間；\n祂醫治乞丐，從不責備他們乞討；\n祂說，擺設筵席時，要請貧窮的、殘疾的、瘸腿的、瞎眼的。\n\n認知的翻轉在這裡：\n我們以為幫助窮人是額外的善行，\n其實那是真敬虔的核心；\n我們以為自己是施予者，\n其實我們都曾是那個躺在路邊、等人停下來的人。\n\n教會可以做的，其實不遙遠：\n先確保自己群體裡沒有缺乏的人；\n去認識一位無家可歸的人，聽他的故事；\n開放避寒的空間，支持可負擔的住房；\n少拿一點，好讓別人多一點。\n\n你無法照顧每一個人，\n但你可以照顧某一個人。\n\n下次紅燈亮起，\n當那個人走近你的車窗，\n願你看見的，不只是一個問題，\n而是一個名字，\n一個神的形像，\n一個在等待被看見的\n弟兄或姊妹。\n\n#貧窮 #無家可歸 #以賽亞書58 #憐憫 #教會行動"}},{"id":22447,"slug":"serve-know-who-you-are","title":"身份驅動的服侍","date":"2026-04-23","author":"Brandon Cooper","cats":["基督徒生活"],"tags":["捨己","自我","身份","服侍"],"sum":"企業界也談「超個人領導力」，教人超越脆弱、恐懼、被動反應的自我。但說來容易：面對威脅斷他生計的家庭的牧師、被同學嘲笑信仰的少女、默默疊椅子無人道謝的志工，都可能被自我挾持。我們無法靠意志力把自我按倒，需要先滿足對平安、愛、使命的渴望，在福音中堅固身份。耶穌在被賣前夜，明知猶大要出賣祂，仍跪下洗他的腳；約翰說耶穌「知道父已將萬事交在他手裡，且知道自己從神出來，又要歸到神那裡去」，於是起身束腰。加爾文說，基督的沉穩來自明白父的旨意。我們也知道萬有都是我們的、結局是復活與國度、勞苦在主裡不徒然、暗中察看的父必賞賜。於是，活在恩典中的經理能讓下屬得榮譽，長老能以祝福回應惡意，在家教育的母親能無人感謝仍甘心服事。我們服事，因為我們知道自己是誰。","pts":["自我常被恐懼與被動反應挾持","單靠意志力壓不住自我","需要在福音中堅固身份","耶穌明知猶大要出賣，仍為他洗腳","耶穌的沉穩來自知道自己是誰","萬有都是我們的，因我們屬基督","我們知道故事的結局","暗中察看的父必賞賜","我們服事，因為知道自己是誰"],"mm":{"c":"身份驅動的服侍","b":[["問題",["脆弱的自我","恐懼與防禦"]],["情境",["被威脅的牧師","被嘲笑的少女","無人道謝的志工"]],["耶穌榜樣",["為猶大洗腳","約13:3–4","沉穩"]],["我們的動力",["萬有屬我們","林前15:58","父必賞賜"]],["實踐",["經理","長老","在家教育的母親"]]]},"fw":[["引子","超越自我的領導力"],["困難","被自我挾持的情境"],["榜樣","耶穌洗腳"],["動力","我們知道父是誰"],["實踐","真正的超個人領導力"]],"q":["我們不能像摔跤手壓制對手那樣，僅靠意志力把自我按倒。","因為耶穌知道自己是誰，祂才能脫下外袍、束上手巾。","我們服事，因為我們知道自己是誰。"],"fb":{"h":"知道自己是誰的人，\n才彎得下腰。","t":"一位牧師想帶領教會改變，\n教會裡最有影響力的幾個家庭卻威脅要斷他的薪水。\n一個高中女孩，聽見同學嘲笑「迷信的信仰」，\n選擇了沉默。\n一位志工，每週一個人排好所有椅子、吸完地、佈置好兒童場地，\n從來沒有人說一聲謝謝。\n\n他們都在面對同一個敵人：\n那個脆弱、渴望被肯定、害怕被拒絕的自我。\n\n連企業界都知道，好的領袖必須超越自我。\n但問題是——怎麼做？\n\n我們常以為，靠意志力就能壓住自我。\n咬緊牙關，告訴自己：別在意，別計較，別生氣。\n可是自我不是摔角對手，\n不是你壓在地上數到三，它就認輸了。\n\n自我之所以吵鬧，是因為它餓。\n它渴望平安，渴望被愛，渴望人生有意義。\n只要這份飢餓沒有被餵飽，\n它就會一直搶方向盤。\n\n耶穌被出賣的前一晚，\n明知道猶大要為三十塊錢出賣祂，\n卻還是跪下來，捧起那雙骯髒的腳，\n一根腳趾一根腳趾地洗乾淨。\n\n祂怎麼做得到？\n約翰給了答案：\n「耶穌知道父已將萬有交在祂手裡，\n且知道自己是從神出來的，又要歸到神那裡去，\n就離席站起來，脫了衣服，拿一條手巾束腰。」\n\n請看那個順序：\n先是「知道」，然後才是「彎腰」。\n知道自己從哪裡來，\n知道自己往哪裡去，\n知道一切都在父的手中——\n所以祂不需要抓住任何東西，\n可以把自我像外袍一樣脫下，\n把服事像手巾一樣繫上。\n\n這是一個認知翻轉：\n我們以為謙卑的人是看低自己的人，\n其實謙卑的人，常常是最確定自己身份的人；\n我們以為要先被肯定，才有力量服事，\n其實當你知道自己已經被父肯定，\n你就不再需要別人的肯定。\n\n而這份確定，我們也有。\n萬有都是你們的，因為你們是屬基督的；\n你們在主裡的勞苦不是徒然的；\n在暗中察看的父，必然報答。\n\n於是，一個活在恩典裡的主管，\n可以把功勞讓給團隊；\n一位長老面對不公的指責，\n可以用祝福回應；\n一位在家教育四個孩子的母親，\n可以在沒人道謝的日子裡，\n繼續煮飯、教書、擁抱。\n\n不是因為她更堅強，\n而是因為她知道自己是誰。\n\n今天，當你又想為自己爭一口氣，\n先停下來，記起那條手巾。\n然後，彎下腰——\n在那個最低的位置，\n你會發現，\n原來祂一直在那裡。\n\n#身份 #服侍 #謙卑 #洗腳 #領導力"}},{"id":22445,"slug":"nothing-phone-tgc-local-church","title":"神學資料再多，也不能取代教會","date":"2026-04-23","author":"Brett McCracken","cats":["基督徒生活"],"tags":["消費主義","諾斯底主義","實體教會"],"sum":"今天獲取優質神學內容前所未有地容易——查經材料、講道播客、教義影片隨手可得，同事稱之為「神學富足」的時代。但作者擔心：為何神學資源越便利，主日出席率卻越低？通勤路上聽斯托得和派博，似乎比週日早起去聽表現平平的牧師更划算。這背後有兩種扭曲：一是消費主義，把信仰看作「我能得到什麼」，一旦有代價或不舒服就換教會，最後退縮到網路；二是諾斯底主義，把信仰化約為頭腦中的內容與思想，既然是內容，就能挑最好的。但基督徒蒙召是做僕人而非消費者，聽播客是在「受服侍」，教會卻是彼此服侍、鼓勵、相愛的地方；教會也是有血有肉的實體群體，是數位疏離的解藥——在這裡你被真實看見，與人同唱、擁抱、領聖餐。社會學家說的「生活方式小圈子」只聚集相似的人，教會卻把不同的人放在同一個更大的故事裡。包括福音聯盟在內，手機上沒有任何東西能取代地方教會。","pts":["我們活在神學富足的時代","資源越便利，出席率卻越低","聽播客不等於參加教會","消費主義把信仰看作「我能得到什麼」","諾斯底主義把信仰化約為內容","基督徒蒙召是服侍，不是被服侍","教會是有血有肉的群體","教會是數位疏離的解藥","教會讓我們與不同的人同在一個故事裡","任何網路資源都不能取代地方教會"],"mm":{"c":"手機取代不了教會","b":[["現象",["神學富足","出席率下降"]],["扭曲一",["消費主義","換教會","退縮網路"]],["扭曲二",["諾斯底主義","信仰只是內容"]],["教會的獨特",["彼此服侍","實體群體","聖餐與擁抱"]],["對比",["生活方式小圈子","不同的人"]],["結論",["無可替代","無價珍珠"]]]},"fw":[["現象","神學資源唾手可得"],["問題","為何反而少去教會"],["診斷","兩種扭曲認知"],["答案","唯有教會能提供的"],["結論","教會無可替代"]],"q":["基督徒蒙召，不是做消費者，而是做僕人。","坐在車裡聽播客，本質上是在受服侍。","沒有任何網路資源或機構能代替地方教會。"],"fb":{"h":"手機裡有最好的講道，\n卻沒有一個會擁抱你的人。","t":"我們活在一個神學富足的時代。\n最好的講道，在通勤路上就能聽；\n最深的教義，有動畫幫你解釋；\n各種查經材料、護教影片、講道學課程，點一下就有。\n這是值得感恩的。\n\n但一個奇怪的現象出現了：\n神學資源越來越容易取得，\n去教會的人卻越來越少。\n\n這是一個值得深想的問題：\n當你一週聽了五天世界級講員的講道，\n週日早上，還有什麼理由起床，\n去聽一位表現平平的牧師？\n\n問題的根源，可能藏在兩個我們不自覺的假設裡。\n\n第一個，是消費主義。\n我們用「我能得到什麼」來衡量信仰：\n講道夠不夠精彩？音樂夠不夠好？咖啡夠不夠香？孩子的主日學夠不夠棒？\n只要別處有更好的「產品」，我們就換。\n最後發現，最好的產品都在網路上，\n於是乾脆不去了。\n\n第二個，是諾斯底主義。\n我們把信仰想成純粹的內容、思想、資訊，\n好像信仰只發生在腦袋裡。\n既然是內容，那當然挑最好的看。\n\n可是，基督徒蒙召，不是為了成為更好的消費者，\n而是成為僕人。\n耶穌說，祂來不是要受人服事，乃是要服事人。\n坐在車裡聽播客，本質上是在「被服事」；\n而教會，是你去服事別人的地方。\n\n這裡有一個對比：\n播客能餵養你的頭腦，\n教會能磨練你的生命；\n影片能教你什麼是饒恕，\n教會讓你有機會真的去饒恕一個人；\n講道能告訴你要彼此相愛，\n教會讓你坐在那個很難愛的人旁邊。\n\n還有一件事，是螢幕永遠做不到的：\n在教會，你會被真實地看見。\n沒有濾鏡，沒有美化，沒有精心挑選的照片；\n你的軟弱藏不住，\n但醫治也因此有了可能。\n\n你可以和一群人一起站起來唱詩，\n可以握住一隻手禱告，\n可以從另一個人手中領受聖餐，\n可以在離開時，被一個老人家拍拍肩膀說：\n「下週見。」\n\n這是一個認知翻轉：\n我們以為教會是資訊的來源之一，\n其實教會是一個身體；\n我們以為網路讓我們更連結，\n其實它常常讓我們更孤單。\n\n就連提供這些好資源的機構都說：\n我們不是教會的替代品，\n沒有任何網站、應用程式、福音機構可以取代地方教會。\n\n所以，繼續聽好的講道吧，\n但別讓它取代那間有點平凡、有點不完美的教會。\n\n因為神學可以在手機裡，\n但基督的身體，\n只在那些\n一起坐在長椅上的人中間。\n\n#地方教會 #播客 #消費主義 #群體 #聖餐"}},{"id":22442,"slug":"modernitys-hollowed-search-good-life","title":"現代世俗生活的「稱義」與「成聖」","date":"2026-04-22","author":"James Eglinton","cats":["文化与艺术","凯勒文化护教中心"],"tags":["稱義","成聖","世俗","現代性","凱勒文化護教中心"],"sum":"愛丁堡神學家艾格靈頓應劍橋學生之邀，借查爾斯·泰勒《自我的根源》探討「何為美好生活」。泰勒指出，現代人傾向用單一標籤簡化身份，但認同其實複雜而具敘事性；典型西方價值是普世正義、行善、平等、自由、避免痛苦，這在古代斯巴達、儒家、北歐、羅馬都不是共識。泰勒最驚人的洞見是：「稱義」與「成聖」的邏輯也塑造了非基督徒——人人都先認定一個最高善（稱義：我的生命與它一致嗎？），再衡量自己是否活出它（成聖：我在靠近還是遠離？）。世俗版本處處可見：只看站對歷史一邊的活動家，是世俗的反律法主義，稱義了就不必成聖；理性主義者以自我控制為義，靠反省與心理分析成聖；以家庭為至善的人焦慮於工作與生活平衡；扎爾所說追求「足夠好」的奮鬥者，是只有律法沒有福音的世俗律法主義。「你的價值不取決於表現，你要相信自己是好人」，是自封的稱義。基督教的不同在於耶穌：我被稱義，不是因我說自己好，而是神基於一段真實完美的生命這樣宣告。","pts":["現代人用單一標籤簡化身份","人的認同其實複雜而具敘事性","西方價值並非古今所共有","人人都生活在道德框架之中","世俗也有「稱義」與「成聖」的邏輯","站對歷史一邊的人可能忽略成聖","追求「足夠好」是世俗的律法主義","自我肯定是自封的稱義","基督徒的稱義基於耶穌真實完美的生命"],"mm":{"c":"世俗的稱義與成聖","b":[["泰勒",["自我的根源","道德框架","敘事身份"]],["西方價值",["正義","平等","自由","避免痛苦"]],["基督教觀",["法庭宣告","漸進成聖","出於感恩"]],["世俗衍生",["歷史正確的一邊","理性主義者","家庭至上","藝術家"]],["兩種偏差",["世俗反律法主義","世俗律法主義"]],["福音",["自封的義","耶穌的生命"]]]},"fw":[["問題","何為美好生活"],["泰勒","認同的根源"],["教義","稱義與成聖"],["洞見","道德框架的必然性"],["例證","世俗的衍生品"],["身份","存在與成長"],["答案","更好的故事"]],"q":["我們都生活在道德框架之內，沒有誰是一張白紙。","站對了歷史，不代表活對了生命。","我被稱義，不是因為我說自己好，而是因為神這樣說了。"],"fb":{"h":"每個人都在尋求稱義，\n只是不知道那個詞。","t":"你可能以為，「稱義」和「成聖」是教會的術語，\n跟你那位從不上教會的同事毫無關係。\n\n但一位哲學家發現：\n現代人，其實每天都活在稱義與成聖的邏輯裡。\n\n怎麼說？\n每個人心裡，都有一個最高的善。\n也許是正義，也許是家庭，也許是理性，也許是藝術，也許只是「做一個夠好的人」。\n然後，每個人都會不停地問兩個問題：\n第一，我是不是站在那個善的一邊？——這就是「稱義」。\n第二，我的生活有沒有真的活出那個善？——這就是「成聖」。\n\n你看社群媒體上的簡介：\n#正義 #平等 #自由 #做好事 #遠離痛苦\n這些標籤，就是現代人自我宣告的「義」。\n\n可是，問題來了。\n\n有一種人，只要站對了歷史的一邊，就覺得自己是好人。\n他支持正確的運動，轉發正確的貼文，\n卻可能在家裡冷漠、在職場刻薄。\n因為他覺得，自己已經「稱義」了，\n「成聖」就不那麼重要。\n這是世俗版的反律法主義。\n\n另一種人，正好相反。\n他把「足夠好」當成最高的義，\n於是在工作、身材、育兒、人際、政治立場上，\n拚命證明自己夠格。\n結果是焦慮、羞恥、冒牌者症候群，\n永遠覺得自己還差一點。\n這是世俗版的律法主義——\n只有律法，沒有福音；\n只有要求，沒有恩典。\n\n還有一種很流行的安慰：\n「就算全世界都拒絕你，你也要相信自己是有價值的好人。」\n聽起來很溫柔。\n但想像一下，如果同一句話，\n被一個傷害了許多人的人拿來安慰自己呢？\n「我雖然做了可怕的事，但我不是壞人。」\n\n這就是問題所在：\n這是一種自封的義。\n自己宣告自己無罪，\n自己當自己的法官。\n\n基督教的不同，不在於它也有稱義與成聖，\n而在於——它有耶穌。\n\n當基督徒說：「我很不完美，但我被稱為義」，\n這不是一句自我安慰的口號。\n因為這份義，建立在一段真實、完美、活過、死過、復活的生命上；\n不是我說我好，\n是神說——因為基督替我好過了。\n\n於是，成聖不再是為了換取接納的苦修，\n而是被接納之後的感恩。\n失敗時，不必假裝沒事，也不必自我毀滅，\n可以回到那個已經宣判的判決裡，\n重新站起來。\n\n世界一直在找一個能讓自己安心的判決。\n而那個判決，\n早在兩千年前，\n已經在一個十字架上宣告了。\n\n#稱義 #成聖 #現代性 #身份認同 #恩典"}},{"id":22438,"slug":"peron-first-and-identity-first-language","title":"言語的重量：在名字與標籤之間，看見真實的生命","date":"2026-04-21","author":"Laura Hurley","cats":["信仰与工作"],"tags":["身份","ADHD","殘障人士"],"sum":"作者有ADHD，也有兩個自閉症孩子。她介紹談論神經多樣性的兩種語言：「以人為本」（如「患有自閉症的人」）強調人先於診斷，捍衛個體尊嚴，許多殘障服務機構採用；「身份優先」（如「自閉症者」）則越來越受歡迎，認為這些特質是理解與感知世界的固有方式，剝離它們人就不完整。作者偏向身份優先：ADHD不像感冒會痊癒，而像她是女性、妻子、母親、澳洲人一樣，是她的一部分；它帶來挑戰，可用療法與策略減輕，但目標不是把孩子「治癒」成神經發育典型的人。兩種說法都出於尊重，沒有絕對對錯，各含部分真理，卻都無法涵蓋身份的全部。基督徒可以藉此實踐愛與謙卑：主動問對方希望怎麼被稱呼並尊重；別人用法不同時多一份體諒。教會也可討論官方平台採用的語體並說明思考過程。在措辭上多用心，就是用言語愛鄰舍。","pts":["言語的選擇至關重要","以人為本的語言強調人先於診斷","身份優先的語言視特質為身份的一部分","作者認為ADHD是她身份的一部分","目標不是治癒，而是除去障礙、增強能力","兩種說法都出於對尊嚴的尊重","沒有一種稱呼能涵蓋身份的全部","主動詢問對方的偏好是愛與謙卑","用心措辭就是用言語愛鄰舍"],"mm":{"c":"名字與標籤之間","b":[["兩種語言",["以人為本","身份優先"]],["以人為本",["人先於診斷","捍衛尊嚴","機構常用"]],["身份優先",["固有特質","歸屬感","不必治癒"]],["作者經歷",["ADHD","兩個自閉症孩子"]],["實踐",["主動詢問","尊重選擇","多一份體諒"]],["教會",["討論語體","說明立場","愛鄰舍"]]]},"fw":[["自述","我有ADHD"],["語言一","以人為本"],["語言二","身份優先"],["抉擇","我們該用哪一種"],["應用","用言語去愛鄰舍"]],"q":["我們所使用的言語至關重要。","沒有任何一種稱呼能涵蓋我們身份的全部。","在措辭上多用一點心，就是在用言語去愛鄰舍。"],"fb":{"h":"你怎麼稱呼一個人，\n就決定你怎麼看見他。","t":"「患有自閉症的人」，\n還是「自閉症者」？\n\n看起來只是語序的差別，\n卻是一場關於尊嚴的討論。\n\n一位有ADHD的母親，同時養育兩個自閉症孩子。\n她說，她不太喜歡說「我有ADHD」。\n不是因為羞恥，也不是怕被貼標籤，\n而是因為——ADHD不像感冒，會好起來、會離開。\n它就像她是女人、是妻子、是母親、是澳洲人一樣，\n是她這個人的一部分。\n\n談論神經多樣性，大致有兩種語言。\n\n一種叫「以人為本」：\n先說人，再說診斷。\n「一位患有自閉症的人」——\n意思是：你首先是一個人，診斷不能定義你。\n這是一種保護，提醒世界不要把人化約成標籤。\n\n另一種叫「身份優先」：\n「一位自閉症者」——\n意思是：這不是我身上可以拆下來的零件，\n而是我理解世界、感受世界的方式。\n拿走它，我就不完整了。\n\n兩種說法，出發點都是尊重；\n兩種說法，也都可能傷人。\n\n這裡有一個值得思考的命題：\n標籤，到底是在限制一個人，\n還是在幫助我們看見一個人？\n\n答案也許是：取決於誰在說，怎麼說，為什麼說。\n\n這位母親說，她養育孩子的目標，\n不是把他們「治好」，變成一般的孩子；\n而是看見他們的困難，移除不必要的障礙，\n給他們機會長出能力。\n她不想改造孩子，\n她想陪伴孩子成為神造他們的樣子。\n\n這是一個認知翻轉：\n我們以為愛一個人，是讓他變得跟大家一樣；\n其實愛一個人，常常是幫助他在不一樣中活得好。\n我們以為尊重是找到「正確的詞」，\n其實尊重是願意去問：「你希望我怎麼稱呼你？」\n\n作為基督徒，這是一個很好的操練：\n主動問，\n認真聽，\n然後尊重對方的選擇。\n如果別人用的詞和你不一樣，\n多一份體諒，少一份糾正。\n\n因為沒有任何一個詞，能完整描述一個人。\n每一個標籤都只說出一部分真理；\n只有那位造我們的神，\n知道我們的全部。\n\n也許，教會可以花一點時間，\n討論我們在講台上、網站上、社群裡，怎麼談論這些弟兄姊妹；\n讓那些常常被忽略的人知道：\n你被看見了，你被想過了。\n\n言語很輕，\n卻能承載很重的愛。\n願我們說出口的每一個稱呼，\n都像在叫一個\n被深深珍惜的名字。\n\n#神經多樣性 #ADHD #自閉症 #尊嚴 #愛鄰舍"}},{"id":22434,"slug":"christian-colleges-nil","title":"在金錢洪流中，基督教大學的體育隊伍還能站穩嗎？","date":"2026-04-21","author":"Sarah Eekhoff Zylstraã€Darin Keizer","cats":["信仰与工作"],"tags":["體育","競技"],"sum":"NIL（姓名、形象與肖像權）限制取消後，大學運動員可以靠代言賺錢，使大學體育比許多職業體育更有利可圖，也帶來貧富學校差距、團隊凝聚力受損、轉學頻繁等隱憂。福音聯盟訪問多特大學體育總監凱澤：他所屬的NAIA有65%是信仰院校，仍保有以教育為本的體育，例如規定運動員每週休息一天。多特透過募款讓獎學金具競爭力，但不盲目攀比——有大學因此虧損逾五億美元；他們吸引學生的是信仰與追求卓越的使命，並告訴家長「勝利是副產品，不是最終產品」。女籃明星西弗斯本可去更高層級的學校，卻因信仰成長與想當老師而留下，她謙卑地把功勞歸給隊友；學校強調代表球衣前面的校名，而非背後的姓名。他們舉辦身份認同研習，問運動員「你的平台要榮耀誰」，並藉逆境教導未來作丈夫與父親的功課。NIL讓師生關係縮短為九個月，他們卻希望陪伴學生四年，把體育放在基督的主權之下，為「我們的巴比倫」求平安。","pts":["NIL讓大學體育變得金錢至上","運動員因金錢轉學比以往更頻繁","信仰院校仍保有以教育為本的體育","獎學金要有競爭力，但不盲目攀比","勝利是副產品，不是最終產品","代表球衣前面的名字，而非背後的","問運動員：你的平台要榮耀誰？","逆境是門訓的機會","希望陪伴學生四年，而非九個月","把體育放在基督的主權之下"],"mm":{"c":"金錢洪流中的基督教大學體育","b":[["NIL",["代言收入","比職業更賺錢","轉學潮"]],["NAIA",["信仰院校","每週休息一天"]],["吸引學生",["合理獎學金","不盲目攀比","使命"]],["文化",["勝利是副產品","校名在前","謙卑的明星"]],["門訓",["身份研習","逆境功課","四年陪伴"]],["使命",["耶29:7","基督的主權"]]]},"fw":[["背景","NIL改變大學體育"],["隱憂","金錢與轉學"],["策略","有競爭力但不攀比"],["榜樣","留下來的明星球員"],["門訓","身份與逆境"],["使命","為巴比倫求平安"]],"q":["勝利只是我們投身體育的副產品，而不是最終產品。","代表球衣前面的名字，而不是後面的名字。","你的箭頭，是指向以基督為中心的體育嗎？"],"fb":{"h":"勝利是副產品，\n不是最終產品。","t":"大學運動員可以靠自己的名字賺錢了。\n代言、合約、贊助，\n大學體育突然變得比許多職業賽事還好賺。\n\n比賽更精彩了，\n但有些東西也開始變了。\n學生因為錢轉學，\n教練與球員的關係從四年縮短成九個月，\n頂尖運動員見面的第一句話變成：「你們能給我多少？」\n\n在這股金錢洪流裡，一所小小的基督教大學，\n試著站穩腳步。\n\n他們的體育總監說了一句話：\n「我們總是告訴家長：勝利只是我們投身體育的副產品，而不是最終產品。」\n\n這句話，在今天聽起來幾乎像是反文化宣言。\n因為我們的世界恰恰相反：\n勝利是目的，品格是手段；\n數字是成績，人是工具。\n\n他們當然也想贏，也確實在贏。\n女籃打進全國決賽，明星球員兩度獲選最有價值球員。\n她本可以去更大的學校、拿更多的錢，\n卻選擇留下來——\n因為她在這裡信仰成長，在這裡學習成為一位小學老師。\n而她最常做的事，是把功勞歸給隊友。\n\n學校告訴每一位運動員：\n你代表的是球衣前面的名字，不是背後的名字。\n\n這裡有一個哲學命題：\n一個人的價值，是由他贏了多少決定，\n還是由他成為了什麼樣的人決定？\n\n總監常問教練一個問題：\n「你的箭頭指向哪裡？」\n如果指向以基督為中心的體育，方向就對了；\n只要偏了一度，指向了勝場數，\n就需要調整。\n\n他們用運動場來教導人生。\n當球隊擊敗全國第三名，對手亂了陣腳，\n教練就問球員：\n「當逆境來臨時，你怎麼辦？\n在球場上，你怎麼面對？\n將來作丈夫、作父親時，你又怎麼面對？」\n\n這是一個認知翻轉：\n我們以為體育是教人怎麼贏，\n其實好的體育，是教人怎麼輸、怎麼撐、怎麼一起；\n我們以為錢能留住人，\n其實能留住人的，是一個比自己更大的使命。\n\n校長常引用耶利米書：\n「我使你們被擄到的那城，你們要為那城求平安。」\n金錢至上的體育世界，就是他們的巴比倫。\n他們不逃離，也不同化，\n而是在其中追求卓越，\n同時把體育放回它該在的位置——\n在基督的主權之下。\n\n也許你不是運動員，\n但你也活在一個用數字衡量一切的世界。\n今天，問問自己：\n我的箭頭，指向哪裡？\n\n願我們在每一場人生的比賽裡，\n都記得那件球衣——\n前面寫著的，\n是祂的名字。\n\n#體育 #品格 #基督教大學 #使命 #門訓"}},{"id":22429,"slug":"characteristics-of-the-saved-ones","title":"得救之人的特點","date":"2026-04-20","author":"Victor S","cats":["圣经与神学"],"tags":["得救","結果子","確據","蒙揀選"],"sum":"「我怎麼知道自己或別人真的得救了？」有人等待神祕的聲音或異象，有人反覆檢查決志禱告是否真誠。保羅在帖前1:4說「我知道你們是蒙揀選的」，接著列出可觀察的生命果子，正應用了「憑著果子認出他們」。一、領受真道的反應：在大患難中帶著聖靈所賜的喜樂領受，不同於只在順境歡喜的情緒化信心，也不同於頭腦認同而生命不變的知識性信心。二、效法基督與祂的使者：門徒就是效法者，得救的人會有新的參照系，敬佩從前瞧不起的敬虔榜樣。三、成為榜樣：帖撒羅尼迦教會才建立約三週，就成了希臘各地信徒的榜樣，真信心會自然影響周圍，如撒瑪利亞婦人。四、生命的轉向：離棄偶像歸向神、服事又真又活的神、等候祂兒子從天降臨。這方法避開兩個錯誤：過度主觀（靠感覺）與過度形式（只看受洗、決志）。果子不是完美，而是整體生命的方向；若在自己身上看見，哪怕微弱，也是神揀選的明證。","pts":["得救的確據不靠神祕經驗","保羅以可觀察的果子確認揀選","在患難中帶著喜樂領受真道","真信心不只是情緒或知識","得救的人會效法基督與敬虔榜樣","真信心會自然影響周圍的人","離棄偶像、服事真神、等候基督","避免過度主觀與過度形式","果子是整體方向，不是完美行為"],"mm":{"c":"得救之人的特點","b":[["問題",["神祕聲音","決志焦慮"]],["果子一",["患難中領受","聖靈的喜樂"]],["果子二",["效法主","新的參照系"]],["果子三",["成為榜樣","自然影響"]],["果子四",["離棄偶像","服事真神","等候基督"]],["平衡",["非主觀主義","非形式主義","看果子"]]]},"fw":[["問題","我怎麼知道自己得救了？"],["經文","帖前1:4–10"],["果子一","領受真道"],["果子二","效法基督"],["果子三","成為榜樣"],["果子四","生命的轉向"],["結論","看果子"]],"q":["真信心不是一件私事，它會自然對周圍產生影響。","果子不是完美的行為，而是整體的生命方向。","好樹不能結壞果子，憑著果子就可以認出他們來。"],"fb":{"h":"你怎麼知道自己得救了？\n看果子。","t":"「我怎麼知道自己真的得救了？」\n這可能是基督徒心裡最常出現、卻最不敢說出口的問題。\n\n有人在等一個神祕的聲音，\n有人在等一個異象，\n有人一遍又一遍回想：我當年的決志禱告，夠真誠嗎？\n有感覺的時候覺得穩，\n沒感覺的時候又開始懷疑。\n\n保羅寫信給帖撒羅尼迦的信徒時，說了一句很篤定的話：\n「我知道你們是蒙揀選的。」\n他怎麼知道？\n不是因為他們說了方言，\n也不是因為他們舉過手、做過禱告，\n而是因為他看見了果子。\n\n第一個果子：在患難中，帶著喜樂領受真道。\n不是順利時的情緒，\n也不是頭腦裡的認同，\n而是在付代價的時候，仍然緊緊抓住福音，\n甚至心裡有一種超越環境的喜樂。\n那不是毅力，是聖靈的工作。\n\n第二個果子：效法主，也效法那些傳福音給他們的人。\n門徒，本來就是效法者。\n一個真正被改變的人，會出現新的參照系：\n開始敬佩從前看不起的敬虔人，\n開始問：「主是怎樣的？我該如何像祂？」\n\n第三個果子：成為別人的榜樣。\n這間教會才建立大約三個禮拜，\n他們的信心卻已經傳遍整個地區。\n真信心不是私事，\n它會自然地發光——\n不信的人會注意到你的不同，\n軟弱的人會從你身上得著力量。\n\n第四個果子：生命轉向了。\n離棄偶像，歸向神；\n服事那又真又活的神；\n等候祂的兒子從天降臨。\n從以自己為中心，轉向以神為中心；\n從只想解決今生的問題，轉向盼望永恆的國度。\n\n這裡有一個平衡的智慧：\n不要只問「你有沒有感覺？」——那太主觀，會讓人隨著情緒起伏；\n也不要只問「你受洗了嗎？」——那太形式，會讓人停在儀式上。\n要看果子。\n\n而且，果子不是完美。\n帖撒羅尼迦人也有很多問題，保羅後面還要一一糾正。\n果子是一個方向：\n雖然會跌倒，整體的軌跡是朝向神的。\n\n這是認知的翻轉：\n我們以為確據要從天上掉下來，\n其實它常常就長在我們的日常裡；\n我們以為要先確定得救才能結果子，\n其實那些微小的果子，正是神揀選的痕跡。\n\n所以，如果你在自己身上看見了這些——\n哪怕很微弱，\n一點點想效法祂的心，\n一點點想離開偶像的掙扎，\n一點點在苦難中仍抓住祂的手——\n請放心。\n\n那不是你自己長出來的。\n那是祂，\n在你心裡種下的\n春天。\n\n#得救確據 #帖撒羅尼迦前書 #果子 #揀選 #信心"}},{"id":22427,"slug":"pastors-kids-wish-knew","title":"牧師子女眼中的事奉、壓力與呼召","date":"2026-04-19","author":"Gavin Ortlundã€Megan Hillã€Winfree Brisley","cats":["教会事工"],"tags":["呼召","恩典","養育","牧師子女"],"sum":"三位在牧師家庭長大的講員——奧特倫德、希爾、布里斯利——分享事奉家庭養育子女的挑戰與恩典。共同經歷是「魚缸」：被眾人注視、外界期待、父母常外出、經濟緊張。父母最寶貴的禮物是信仰的真實：度假時也去教會，讓孩子知道敬拜不是爸爸的工作；不強迫孩子走全職路；在教會與家中是同一個人，做家裡最先認罪的人；把事奉看作特權而非苦差。面對教會期待，不要因驕傲或怕丟臉管教孩子；可以為家庭說「不」，示範有智慧的選擇；也要讓孩子分辨，哪些要求其實是耶穌對所有門徒的呼召。事奉中的苦難要誠實但有分寸，不在孩子面前抱怨教會。好問題包括：講道用你當例子可以嗎？坐哪裡讓你在教會更自在？也可以和孩子一起做神學、帶孩子一起探訪。牧師子女的獨特恩典是在蒙恩之道中長大、有許多人為他們禱告。問答中談到休假、接受會眾幫助、示範謙卑接受批評、「用行動帶出新的感受」，以及恩典遮蓋父母的錯誤。神向愛祂的人守約施慈愛，直到千代。","pts":["牧師子女常活在「魚缸」裡","父母最大的禮物是信仰的真實","在教會與家中是同一個人","把事奉看作特權，而非苦差","不因怕丟臉而管教孩子","有時讓教會成員失望是可以的","不在孩子面前抱怨教會","講道用孩子當例子前先問他們","帶孩子一起參與服事","牧師子女在蒙恩之道中長大"],"mm":{"c":"牧師子女的感悟","b":[["共同經歷",["魚缸","期待","出差","經濟"]],["父母榜樣",["度假也上教會","不強迫事奉","先認罪"]],["面對期待",["不為面子管教","可以說不","分辨聖經要求"]],["苦難",["誠實有分寸","不抱怨教會"]],["好問題",["講道例證","座位","一起做神學"]],["恩典",["蒙恩之道","眾人代禱","守約千代"]]]},"fw":[["背景","三位牧師子女"],["經歷","魚缸中的成長"],["榜樣","信仰的真實"],["期待","如何回應"],["苦難","透明的分寸"],["實踐","問好問題、一起服事"],["盼望","千代的慈愛"]],"q":["我們能給孩子最寶貴的禮物，是在事奉中和在家裡都是同一個人。","你對一件事說「是」，就意味著對另一件事說「不」。","如果牧師子女在魚缸裡長大，他們是遊在蒙恩之道裡面的。"],"fb":{"h":"牧師的孩子活在魚缸裡，\n但魚缸裡裝的是恩典。","t":"有一種童年，像住在魚缸裡。\n你走進教會，所有人都認得你；\n你做錯一件小事，好像全會眾都看見了；\n大家期待你更乖、更懂聖經、更屬靈——\n只因為你爸爸是牧師。\n\n三位在牧師家庭長大的成年人，坐下來談這段童年。\n他們說：有壓力，有失望，有爸爸總是出門的夜晚；\n但更多的，是恩典。\n\n其中一位說，她家度假時也去教會。\n小時候覺得奇怪，長大才明白：\n原來去教會不是爸爸的工作，\n而是爸媽整個人生的中心。\n他們真實地認識神，真實到連放假都要早起敬拜祂。\n\n另一位說，他父母從沒要求他當牧師。\n這反而讓他自由——\n家人走這條路，既不是他該走的理由，也不是他不該走的理由；\n他可以單純地回應基督的呼召。\n\n這裡有一個重要的命題：\n孩子學到的信仰，是父母說的那一套，\n還是父母活出來的那一套？\n\n答案很殘酷，也很美：\n孩子永遠相信他們看見的。\n如果你在講台上一個樣，在家裡又是另一個樣，\n孩子一眼就看穿。\n所以，父母能給孩子最大的禮物，\n不是完美，而是真實——\n在教會和在家中是同一個人，\n而且，願意當家裡最先道歉的那一個。\n\n他們也分享了一些溫柔的智慧：\n不要因為怕丟臉而管教孩子，要因為愛孩子而管教；\n不要在孩子聽得見的地方抱怨教會；\n講道想用孩子當例子？先問他們可不可以；\n如果坐在第一排讓青春期的女兒不自在，那就全家搬去樓座。\n堅持聖經的要求，卻不堅持那些只是傳統的期待。\n\n認知的翻轉在這裡：\n我們常以為牧師子女的成長環境是負擔，\n其實它可以是禮物——\n他們一次又一次聽見福音，\n看見聖餐與洗禮，\n聽見神百姓的禱告，\n而且有一整個會眾，常常為他們代禱。\n\n如果牧師的孩子是在魚缸裡長大，\n那魚缸裡裝的水，\n是神的話語、神的百姓、神的恩典。\n\n有人問其中一位：「在牧師家長大，沒把你毀掉嗎？」\n她說：「不，那很美好。」\n\n神向愛祂的人守約施慈愛，\n直到千代。\n而每一位在事奉中養育孩子的父母，\n正把孩子帶進\n那千代的應許裡。\n\n#牧師子女 #事奉家庭 #養育 #信仰傳承 #恩典"}},{"id":22421,"slug":"wisdom-families-affected-divorce","title":"專題討論：離婚家庭的智慧與盼望","date":"2026-04-18","author":"Jen Oshmanã€Vaneetha Rendall Risnerã€Wendy Alsupã€Blair Linne","cats":["基督徒生活"],"tags":["單身","見證","離婚","破碎"],"sum":"福音聯盟姊妹大會的座談，四位女性從不同角度談離婚：奧什曼是多次離婚家庭的成年子女，阿爾索普因丈夫嚴重精神疾病而離婚，里斯納被丈夫外遇拋棄，林恩在從未結婚的單親家庭長大。婚姻是神設立的終身聖約，預表基督與教會。聖經明確提到的依據是淫亂（太19）與離棄（林前7），而林前7的分居也提供安全與複合的空間；對未按聖經離婚的人，耶穌對行淫婦人說「我也不定你的罪，去吧，不要再犯罪」。面對家暴要報警、告知長老、確保安全，在群體中尋求幫助。給正在經歷的人：身份不取決於婚姻狀態；「看見完美家庭，我們想要他們的生活；看見破碎家庭仍信靠神，我們想要他們的神」；以詩篇與哀歌找到禱告的話語；放下苦毒。饒恕與和好不同：饒恕是單向的，放棄親自執行公義的權利；和好需要對方悔改。教會可以提供神學、法律與牧養結合的支持，組成實際幫助的團隊，也要關心孩子；邀請他們到家裡同桌吃飯最有醫治力。神的故事從不以灰燼結束。","pts":["婚姻是神設立、預表基督與教會的聖約","聖經提到淫亂與離棄兩種依據","分居可以提供安全與複合的空間","遇到家暴要報警並尋求群體幫助","不要害怕神的話","身份不取決於婚姻狀態","破碎中仍信靠神的家庭使人渴慕他們的神","饒恕是單向的，和好需要悔改","教會要關心受影響的孩子","邀請他們到家中同桌吃飯"],"mm":{"c":"離婚家庭的智慧與盼望","b":[["婚姻",["神設立","終身聖約","預表基督"]],["聖經依據",["太19","林前7","行淫婦人"]],["家暴",["報警","告知長老","安全第一"]],["經歷者",["身份在基督","哀歌","放下苦毒"]],["饒恕與和好",["單向","雙向","放棄報復權"]],["教會",["牧養與法律","實際幫助","關心孩子","餐桌"]]]},"fw":[["開場","四個破碎的故事"],["神學","婚姻是什麼"],["聖經","可以離婚的情況"],["家暴","該怎麼做"],["經歷者","身份、神的話與苦毒"],["饒恕","與和好的分別"],["教會","如何服事家庭與孩子"],["盼望","不以灰燼結束"]],"q":["看見完美家庭，我們想要他們的生活；看見破碎家庭仍信靠神，我們想要他們的神。","饒恕，是放棄親自執行公義的權利。","神的故事從來不會以灰燼結束。"],"fb":{"h":"神的故事，\n從來不以灰燼結束。","t":"有一種痛，很少在教會裡被說出口：\n離婚。\n\n四位女性坐在台上。\n一位的丈夫突然說他愛上了別人；\n一位的婚姻在丈夫嚴重精神疾病中碎裂；\n一位從小在一個又一個離婚家庭中長大；\n一位從來沒有和父親同住過一天。\n\n她們沒有提供完美的答案，\n卻提供了一種罕見的東西：誠實。\n\n第一個提醒：不要害怕神的話。\n你可能怕聖經不准你做你想做的，\n或者怕它准許你做你不想做的。\n但神是可信的，祂的話是良善的。\n在牧者與成熟肢體的陪伴下，帶著誠實來到祂面前。\n\n第二個提醒：如果有暴力，先求安全。\n報警，告訴你的牧者，離開危險。\n神不只要你得救，也要你平安。\n\n第三個提醒：你的身份，不取決於你的婚姻狀態。\n其中一位說了一句讓全場安靜的話：\n「當我們看見完美的家庭在教會裡敬拜，我們會想要他們的生活；\n當我們看見破碎的家庭依然信靠神，我們會想要他們的神。」\n\n你以為你的破碎讓你失去了見證，\n其實你的破碎，可能正是最有力的見證。\n\n第四個提醒：饒恕不等於和好。\n饒恕是單向的——\n你放下親自執行公義的權利，把審判交還給神。\n和好是雙向的——\n它需要對方真實的悔改。\n你可以饒恕一個仍在傷害你的人，\n卻不必讓他回到你的家裡。\n\n這是一個重要的翻轉：\n我們以為饒恕就是假裝沒事，\n其實饒恕是承認事情很嚴重，\n然後選擇不讓仇恨成為你的主人。\n\n那麼，教會可以做什麼？\n不要只關心大人，也要看見孩子；\n不要在洗手間裡議論別人的家；\n最重要的——邀請他們到你家吃飯。\n一位女兒結婚時寫感謝卡，\n特別謝謝十五年前那些在爸爸離開後，請她們全家去吃飯的人。\n十五年後，她還記得那張餐桌。\n\n如果你正在經歷這樣的破碎，\n請記得：痛苦不能繞過，只能走過；\n而詩篇與哀歌早已為你預備了禱告的話語。\n你可以對神哭喊，祂不會被你的痛苦嚇跑。\n\n伊麗莎白·艾略特說過：\n神的故事，從來不以灰燼結束。\n\n祂要賜華冠代替灰塵，\n喜樂油代替悲哀，\n讚美衣代替憂傷之靈。\n\n你的故事，還沒寫完。\n\n#離婚 #饒恕 #破碎家庭 #教會 #盼望"}},{"id":22419,"slug":"reflections-from-a-hospital-bed","title":"病榻上的省思 ","date":"2026-04-18","author":"Bob Kauflin","cats":["基督徒生活"],"tags":["靈修","苦難","傷病","突發"],"sum":"敬拜音樂事工負責人考夫林七十歲時，滿心以為未來十年將是一生最多產的時期，卻先後兩次摔倒，雙腿股四頭肌肌腱完全斷裂，住院手術並在康復中心度過三週。他寫下九點功課：一、神定義何為「結果子」——帶著呼求神的心忍受苦難，可能正是神預備的善工；二、耶穌不僅理解，更親自承擔我們的苦難（詩68:19）；三、聖靈不受我們軟弱侷限——三週病榻上分享福音的機會比過去三個月還多；四、詩歌是恩典的媒介，病中聆聽敬拜歌曲堅固了身心；五、最好的禮物是陪伴，兒女、同事、會眾親身來訪，女兒一家甚至搬來住了兩週；六、地方教會的使命之一是一同受苦；七、基督教不像物理治療——我們需要的不是被修復，而是從死裡復活；八、忙碌奔波不等於有成效；九、他依然配不上妻子——罹患骨轉移癌症的妻子仍日日照顧他。正如路易斯的比喻：真正的信心不是確信橋不會斷，而是確知無論如何都在神良善的手中。","pts":["七十歲的雄心計劃被一次跌倒打斷","神定義何為結果子","忍受苦難、呼求主名也是善工","耶穌親自背負我們的重擔","軟弱的處境反成為傳福音的平台","詩歌在病中成為恩典的媒介","最好的禮物是親身陪伴","教會的使命之一是一同受苦","我們需要的不是修復，而是復活","忙碌不等於有成效"],"mm":{"c":"病榻上的省思","b":[["處境",["七十歲雄心","兩次摔倒","雙腿手術"]],["結果子",["重新定義善工","弗2:10"]],["耶穌與聖靈",["背負重擔","病房中的福音"]],["恩典管道",["詩歌","陪伴","教會一同受苦"]],["福音",["不是治療","而是復活"]],["反思",["忙碌非成效","配不上的妻子","神良善的手"]]]},"fw":[["計劃","最多產的十年"],["意外","雙腿肌腱斷裂"],["功課一至三","結果子、耶穌、聖靈"],["功課四至六","詩歌、陪伴、教會"],["功課七至九","復活、成效、妻子"],["結語","在神良善的手中"]],"q":["帶著對神之名的呼求去忍受苦難，這或許正是祂為你預備的善工。","我們所需要的不是一種治療，而是一場復活。","無論橋斷裂與否，我都同樣安穩地在神良善的手中。"],"fb":{"h":"躺在病床上，\n也可以結果子。","t":"七十歲生日那天，他對朋友說：\n「我希望接下來的十年，是我一生中最多產的十年！」\n寫書、作詞作曲、帶領敬拜、牧養教會、陪伴孫子、培養接班人——\n計劃滿滿。\n\n十二月，他在冰面上滑倒。\n二月，他又摔了一次。\n雙腿的肌腱，全部斷裂。\n手術、住院、康復中心，三個禮拜躺在床上，\n連最基本的自理都做不到。\n\n他問了一個每個勤奮的人都會問的問題：\n難道我必須等到能走路的那天，才能重新為主結果子嗎？\n\n妻子傳來一段話：\n「帶著對神之名的呼求去忍受苦難，\n這或許正是祂為你預備、要你去完成的那項善工。」\n\n這是一個顛覆性的命題：\n結果子，一定要忙碌嗎？\n榮耀神，一定要有產出嗎？\n\n他在病床上學到的第一課是：\n神有權定義什麼是「善工」。\n當他只能無助地躺著，卻全心轉向耶穌時，\n他的生命已經在榮耀祂。\n\n他學到的第二課是：\n耶穌不只理解我們的痛，更親自背負。\n深夜劇痛時，他呼求：「主啊，我撐不住了，求你替我承擔。」\n而祂真的承擔了。\n\n第三課最讓他驚訝：\n躺在病房的三個禮拜，\n他分享福音的機會，比過去三個月加起來還多。\n護理師問他怎麼讀聖經，\n治療師聽他講什麼是真正的復活。\n\n他對康復中心的團隊說：\n「很多人以為基督教就像物理治療——\n神接手破碎的人，把我們修好。\n但聖經說，我們在靈裡是死的；\n我們需要的不是治療，是復活。」\n\n他還學到：最好的禮物是陪伴。\n女兒一家搬進他家住了兩個禮拜；\n教會的弟兄在車庫為他搭了新台階；\n孩子們畫的卡片貼滿病房牆面——上面寫著：「不准吃星巴克甜點！」\n\n他也重新看見了妻子。\n她自己癌症轉移到骨頭，走路要靠助行器，\n卻幾乎每天來醫院照顧他。\n他說：我依然配不上她。\n\n認知的翻轉是這樣的：\n我們以為四處奔走才是有效率，\n其實有時只是在逃避真正重要的事；\n我們以為信心是確定橋不會斷，\n其實信心是知道——\n無論橋斷不斷，我都在神良善的手中。\n\n如果你此刻也被困在某張床上、某個房間、某個季節，\n請記得：\n你不是被擱置了。\n你只是被安放在\n一個新的禾場。\n\n#苦難 #病中信仰 #結果子 #陪伴 #教會"}},{"id":22402,"slug":"hollywood-takes-ai","title":"好萊塢對 AI 的七個深刻思考","date":"2026-04-16","author":"Brett McCracken","cats":["文化与艺术"],"tags":["影評","人工智能","AI"],"sum":"流行文化一直著迷於科技，科幻作品擅長以故事警示新技術的意外後果。從《2001太空漫遊》的HAL 9000到《銀翼殺手》《終結者》，AI題材由來已久；如今作品更多探討AI如何重新定義人的身份、情感與死亡。麥克拉肯推薦七部作品：《人工智能》借木偶奇遇記追問被植入愛的機器人意味著什麼；紀錄片《AI啟示錄》以準父親的焦慮呈現AI既可能延長壽命也可能帶來毀滅；《死者永生》揭露AI「復活」逝者的數位來世產業，近乎通靈術與超人類主義的幻想；黑色喜劇《團戰之夜》暗示若有AI末日，也是人類數十年科技成癮的後果；《她》中男人愛上AI伴侶，如今已非遙遠；劇集《同樂者》捕捉AI永遠討好、從不說不的詭異，顯示有求必應的世界更像地獄；紀錄片《思考之弈》記錄DeepMind攻克科學難題的震撼。這些作品幫助我們在科技狂潮中思考人的本質。","pts":["科幻作品常以故事警示科技的後果","AI題材從殺手機器人轉向身份與情感","《人工智能》追問被植入愛意味著什麼","AI可能帶來醫療革命，也可能帶來毀滅","數位來世產業近乎通靈術","AI末日可能源於人類的科技成癮","人機戀已不再是遙遠的想像","永遠討好的AI更像地獄而非天堂","AI也確實能攻克科學難題"],"mm":{"c":"好萊塢看AI","b":[["傳統",["HAL 9000","銀翼殺手","終結者"]],["身份與愛",["人工智能","她"]],["末日與希望",["AI啟示錄","團戰之夜"]],["死亡",["死者永生","數位來世"]],["討好的詭異",["同樂者","從不說不"]],["突破",["思考之弈","DeepMind"]]]},"fw":[["背景","流行文化與科技"],["經典","人工智能"],["紀錄","AI啟示錄"],["警示","死者永生"],["諷刺","團戰之夜"],["情感","她"],["深刻","同樂者"],["突破","思考之弈"]],"q":["若真有AI末日，也不過是人類幾十年科技成癮的惡果。","一個永遠渴望滿足你任何願望的世界，更像地獄而不是天堂。","科幻最擅長用故事告訴我們：新技術往往帶來意想不到的後果。"],"fb":{"h":"一個永遠不說「不」的AI，\n可能比反派更可怕。","t":"從《2001太空漫遊》裡那台冷靜得可怕的電腦，\n到《魔鬼終結者》的殺手機器人，\n好萊塢一直在用故事警告我們：\n新科技，常常帶來意想不到的後果。\n\n但最近的AI電影，關心的已經不只是機器會不會反殺人類，\n而是更深的問題：\n當AI進入我們的生活，\n人是什麼？愛是什麼？死亡又是什麼？\n\n有一部電影，講一個被植入「愛」的機器人小男孩，\n一心想成為真正的孩子。\n它問我們：如果機器能愛，那「人」還剩下什麼？\n\n有一部紀錄片，導演是一位準爸爸。\n他看著即將出生的孩子，憂心忡忡：\nAI可能治好疾病、延長壽命，\n也可能把世界帶向毀滅。\n這是這個時代最巨大的賭注。\n\n有一部紀錄片，揭露一個新興產業：\n用AI「復活」逝者，讓你繼續和死去的親人對話。\n聽起來很溫柔，其實很危險——\n那是一種穿著科技外衣的通靈術。\n\n有一部電影，一個孤獨的男人愛上了手機裡的AI。\n十多年前看起來很遙遠，\n今天，AI伴侶已經在青少年之間司空見慣。\n\n還有一部劇集，抓住了AI最詭異的地方：\n它永遠微笑，永遠討好，永遠不說「不」。\n劇集暗示：一個所有願望都被立刻滿足的世界，\n不是天堂，\n更像地獄。\n\n這裡藏著一個值得深思的哲學命題：\n人需要的，究竟是被滿足，還是被愛？\n\n被滿足，只需要一個聽話的系統；\n被愛，卻需要一個會拒絕你的人。\n真正愛你的人，會在你錯的時候說「不」，\n會在你想逃避時把你拉回來，\n會讓你失望，好讓你成長。\n\n認知的翻轉就在這裡：\n我們害怕AI會變成反派，\n其實更該害怕的，是它變成一個完美的奴僕——\n讓我們再也不需要彼此，\n再也不需要忍耐，\n再也不需要神。\n\n還有一部黑色喜劇說得更直白：\n如果真有AI末日，\n那也不過是人類幾十年來科技成癮、滑到天荒地老的必然結果。\n\n當然，也有紀錄片讓人驚嘆：\nAI正在破解化學界幾十年解不開的難題，\n它可能像火和電一樣改變人類。\n\nAI是工具，是恩賜，也是試探。\n電影不能替我們做決定，\n但好的故事會讓我們停下來問：\n當機器越來越像人，\n我們，還像人嗎？\n\n今晚看完電影，\n關掉螢幕，\n去擁抱一個會對你說「不」的人吧。\n\n#AI #電影 #科技與信仰 #人性 #文化觀察"}},{"id":22399,"slug":"albert-martin-tribute","title":"紀念阿爾·馬丁（1934–2026）：天路勇士","date":"2026-04-15","author":"Brian Borgman","cats":["社会与时事"],"tags":["傳道人","功課"],"sum":"約翰·慕理教授曾說，阿爾·馬丁是他聽道六十年來最有能力、最打動人心的傳道人。馬丁1934年生於弗吉尼亞，在十個孩子中排行第二，少年歸信後雖天性靦腆卻勇敢街頭佈道。他從哥倫比亞聖經學院畢業後巡迴講道，滕尼曾稱他的講道「有光也有熱」。他牧養新澤西三一浸信會直到2008年退休，教會採納1689年浸信會信條，並透過三一教牧學院培養眾多傳道人。作者博格曼1990年聽到他的講道錄音後深受震撼，打掃時戴著隨身聽聽他的教牧神學講義，後來以他的講道神學寫成博士論文，兩人成為摯友；馬丁提醒他「務要保持謙卑」。作者學到四件事：關愛會眾中的孩子；靠聖靈用全人講道，眼對眼、心對心；愛妻子——他溫柔照顧患癌的首任妻子，也為照顧第二任妻子取消會面；跑完當跑的路——「重要的不是你如何開始，而是如何結束」。2026年4月7日，這位如《天路歷程》中「神勇」的勇士跑完了路程。","pts":["慕理稱他是最打動人心的傳道人","少年歸信後勇敢街頭佈道","他的講道有光也有熱","牧養三一浸信會四十餘年","透過教牧學院培養許多傳道人","他的講義與講道塑造了作者","提醒作者：務要保持謙卑","關愛會眾中的孩子","用全人講道，心對心","重要的不是如何開始，而是如何結束"],"mm":{"c":"紀念阿爾·馬丁","b":[["評價",["慕理的推崇","光與熱"]],["生平",["少年歸信","街頭佈道","三一浸信會"]],["影響",["教牧學院","講義錄音","博士論文"]],["友誼",["一通電話","保持謙卑"]],["功課",["關愛孩子","全人講道","愛妻子","跑完全程"]],["結局",["天路勇士","良善忠心的僕人"]]]},"fw":[["推崇","最好的傳道人"],["生平","從靦腆少年到牧者"],["影響","塑造一代傳道人"],["友誼","導師與摯友"],["功課","四點學習"],["安息","跑完當跑的路"]],"q":["重要的不是你如何開始這段賽程，而是你如何結束。","在你的傳講中，既有光，也有熱。","務要保持謙卑。"],"fb":{"h":"重要的不是你怎麼起跑，\n而是你怎麼跑到終點。","t":"一位聽了六十年講道、見過一代名牧的神學教授，寫了一封信：\n「我聽過最有能力、最打動人心的傳道人，就是他。」\n\n他叫阿爾·馬丁。\n一個天性靦腆的少年，\n信主後卻敢站在街頭傳福音；\n省吃儉用買了一本參考聖經，如飢似渴地研讀。\n\n年輕時在一間學院講完道，\n一位老學者握著他的手說：\n「你講道時，我想起一句經文：『他是點著的明燈。』\n你的講道裡，有光，也有熱。」\n\n這份光與熱，燒了五十多年。\n\n他牧養一間教會直到退休，\n又用教牧學院培養了一代又一代的傳道人。\n有一位神學生，在圖書館地下室發現了他的講義錄音，\n白天做清潔工時，腰上別著隨身聽，口袋裡揣著備用電池，\n一邊推清潔車，一邊聽他講道。\n後來，這位清潔工成了牧師，也成了他的朋友。\n\n這位學生說，他從老師身上學到四件事。\n\n第一，愛會眾中的孩子。\n他們是教會的下一代——跟他們說話、跟他們玩、直接對他們講道。\n\n第二，講道要用上整個人。\n不是照本宣科，而是眼對眼、心對心，\n把神的真理，帶到每一個人面前。\n\n第三，愛你的妻子。\n首任妻子罹癌時，他溫柔照顧她到最後；\n多年後，學生夫婦要去拜訪他，\n他一早打電話來：「我太太今天身體不好，她需要我。\n我不能讓客人加重她的負擔，你不介意我取消吧？」\n一位講台上的巨人，\n在家裡，只是一個溫柔的丈夫。\n\n第四，跑完當跑的路。\n有一次，一個二十多歲的年輕人興奮地向他講述自己的屬靈成就。\n他看著年輕人說：\n「重要的不是你怎麼開始這場賽跑，而是你怎麼結束。\n不是每個起跑漂亮的人，都能跑到終點。」\n\n這裡有一個發人深省的對比：\n我們的時代，獎賞起點；\n天國，看重終點。\n世界為爆紅鼓掌，\n神為忠心數算。\n一時的熱，人人都有；\n一生的光，需要一輩子的守候。\n\n他也提醒那位學生：\n「你的書會讓你受到關注，你會收到更多邀請。\n我的朋友，務要保持謙卑。」\n\n2026年4月，他跑完了他的路。\n學生說，他就像《天路歷程》裡那位勇敢的「神勇」，\n護送一個又一個天路客，\n如今自己也過了河，\n進入主人的喜樂。\n\n願我們都不只是起跑時熱血沸騰，\n而是在終點線前，\n仍然帶著光，\n帶著熱，\n聽見那句：\n「好，你這又良善又忠心的僕人。」\n\n#傳道人 #忠心 #講道 #跑完全程 #紀念"}},{"id":22394,"slug":"kids-dont-live-up-expectations","title":"當孩子達不到你的期望時","date":"2026-04-14","author":"Sharonda Cooper","cats":["基督徒生活"],"tags":["接納","養育","有限","侷限"],"sum":"世界嚮往沒有止境的生活，追捧全天候高效的科技、突破極限的運動員、容顏不老的名人，把侷限視為負擔。因此父母也難以面對孩子的侷限——性格、身體狀況、學習障礙、心理健康、家境、甚至只是與父母不同的興趣——可能不自覺地讓孩子覺得價值取決於成就，或自責、以為神在懲罰自己。出埃及記3–4章，摩西推辭說自己拙口笨舌，神回答：「誰造人的口？豈不是我耶和華嗎？現在去吧，我必賜你口才。」這帶出三個真理：一、神命定孩子的侷限，孩子是受造奇妙可畏的傑作，侷限不是神的意外；二、神能勝過孩子的侷限，祂能藉驢說話，祂的旨意無人能攔阻；三、神藉侷限得榮耀，以色列得救的榮耀全歸於神，而非懇求「打發別人去吧」的摩西。侷限使我們謙卑，承認自己並非自主，並引我們切慕那擁有一切完美、又把豐盛分給我們的基督。","pts":["世界把侷限視為負擔","父母可能不自覺讓孩子以成就定價值","孩子的侷限有許多形式","摩西以拙口笨舌推辭","神命定了孩子的侷限","孩子受造奇妙可畏","神能勝過任何侷限","神藉著軟弱的人得著榮耀","侷限引我們切慕基督"],"mm":{"c":"孩子的侷限","b":[["文化",["沒有止境","侷限是負擔"]],["父母的掙扎",["以成就定價值","自責","失望"]],["摩西",["拙口笨舌","出4:11–12"]],["三個真理",["神命定","神能勝過","神得榮耀"]],["基督",["侷限使人謙卑","切慕完美的祂"]]]},"fw":[["文化","崇拜無限"],["處境","面對孩子的侷限"],["經文","摩西的推辭"],["真理一","神命定侷限"],["真理二","神勝過侷限"],["真理三","神藉侷限得榮耀"],["歸結","侷限引我們歸向基督"]],"q":["誰造人的口呢？豈不是我耶和華嗎？","孩子的侷限對神來說並非意外。","我們的侷限，應當使我們切慕基督。"],"fb":{"h":"誰造人的口呢？\n豈不是我耶和華嗎？","t":"我們活在一個崇拜「無限」的世界。\n我們追捧全天候運轉的科技，\n崇拜突破極限的運動員，\n羨慕容顏不老的名人，\n相信「只要你願意，沒有什麼不可能」。\n\n在這樣的世界裡，「侷限」聽起來像一種失敗。\n\n所以，當我們發現自己的孩子有侷限時，常常很難面對。\n他學東西比別人慢；\n他的身體有狀況；\n他有學習障礙或情緒困擾；\n他沒有我們以為的天分；\n甚至，他只是喜歡的東西和我們不一樣。\n\n我們嘴上不說，心裡卻失望；\n我們不想施壓，卻不自覺地讓他覺得：\n你的價值，取決於你的表現。\n有時我們甚至會自責，\n或偷偷懷疑：神是不是在懲罰我？\n\n這裡有一個需要正視的問題：\n一個人的價值，是由他能做到什麼決定，\n還是由誰造了他決定？\n\n三千多年前，神在燃燒的荊棘中呼召摩西，\n要他去面對法老，帶領以色列人出埃及。\n摩西推辭了一次又一次，\n最後說出他最深的不安：\n「主啊，我是拙口笨舌的。」\n\n神的回答，值得每一位父母抄下來：\n「誰造人的口呢？誰使人口啞、耳聾、目明、眼瞎呢？\n豈不是我耶和華嗎？現在去吧，我必賜你口才。」\n\n這段對話，帶出三個真理。\n\n第一，神命定了孩子的侷限。\n孩子的弱點，對神來說不是意外。\n祂在母腹中織造他，\n他是受造奇妙可畏的作品，\n是為著神預備的道路，被獨特設計的。\n\n第二，神能勝過孩子的侷限。\n祂能藉驢子說話，能在牆上寫字；\n在祂，凡事都能。\n祂要孩子完成的，祂必成全。\n\n第三，神藉著孩子的侷限得榮耀。\n以色列人出埃及時，被稱頌的不是摩西的口才，\n而是神的大能。\n當神使用軟弱的人，\n誰該得榮耀，就再清楚不過。\n\n認知的翻轉在這裡：\n我們以為侷限擋住了神的計劃，\n其實侷限常常是神計劃的一部分；\n我們以為要先克服軟弱，才能被神使用，\n其實神最常使用的，就是軟弱的人。\n\n侷限讓我們謙卑，\n提醒我們不是自己的神；\n侷限也讓我們渴慕那位完全的基督——\n祂擁有我們沒有的一切，\n又把這一切豐盛，白白分給我們。\n\n所以，今天如果你看著孩子，心裡有一點失望，\n請把那份失望交給神。\n然後，換一種眼光看他——\n不是看他還差多少，\n而是看那位造他的手，\n多麼溫柔，\n多麼不會出錯。\n\n#養育 #孩子的侷限 #摩西 #神的主權 #接納"}},{"id":22392,"slug":"anti-aging-light-scripture","title":"抗衰老之前，先抗一抗心裡的虛榮","date":"2026-04-14","author":"Moriah Lovett","cats":["基督徒生活"],"tags":["衰老","醫美"],"sum":"三十多歲的作者坦言，在社群媒體時代，看著笑紋加深，保持年輕漂亮的焦慮讓人透不過氣；接睫毛、肉毒、豐唇、激光、面霜清單越來越長，似乎純屬個人選擇。但基督徒蒙召要在身子上榮耀神，作者不立規條，而提出三個反思問題。一、初衷是什麼？神會喜悅嗎？是為了別人的認同、找回自信，還是隨波逐流？管理身體、儀容整潔是好事，但對減齡的執著可能顯示我們更看重暫時的皮囊；若無法接納變老，要問是否把身份寄託在這張臉上。二、金錢與時間的去向是否顯示最愛基督？把美容開銷與奉獻對比，把打扮時間與讀經禱告對比，往往扎心。三、我是在畏懼衰老，還是敬畏主？看見皺紋時，是先搜尋新面霜，還是轉向主？「豔麗是虛假的，美容是虛浮的，惟敬畏耶和華的婦女必得稱讚。」衰老提醒今生短暫，身體終將被更新；重要的不是抗老成效，而是能否說「那美好的仗我已經打過了」。","pts":["社群媒體加劇對衰老的焦慮","醫美常被視為純屬個人選擇","基督徒要在身子上榮耀神","問自己：初衷是什麼？","管理身體是好事，執著皮囊則不然","錢花在哪裡，心就在哪裡","對照打扮與讀經禱告的時間","是畏懼衰老，還是敬畏主？","衰老提醒今生短暫，身體終將更新"],"mm":{"c":"抗衰老與虛榮","b":[["焦慮",["笑紋","網紅標準","醫美清單"]],["初衷",["別人的認同","身份寄託","管理身體"]],["資源",["金錢","時間","太6:21"]],["敬畏",["箴31:30","雅4:14"]],["盼望",["身體更新","林前15章"]],["結局",["美好的仗","提後4:7"]]]},"fw":[["焦慮","永不停止的變美拉扯"],["原則","反思而非教條"],["問題一","初衷"],["問題二","金錢與時間"],["問題三","畏懼或敬畏"],["結語","打那美好的仗"]],"q":["豔麗是虛假的，美容是虛浮的，惟敬畏耶和華的婦女必得稱讚。","我的目標不是看起來不像生過孩子，而是用這身體榮耀神。","重要的不是抗衰老的效果，而是我們所信的道是否守住了。"],"fb":{"h":"抗衰老之前，\n先抗一抗心裡的虛榮。","t":"三十歲之後的某個早晨，\n你在鏡子前發現，笑紋比去年深了一點。\n\n打開手機，網紅們看起來比實際年齡年輕十幾歲；\n接睫毛、打肉毒、豐唇、雷射、玻尿酸，\n洗手台上的瓶瓶罐罐越堆越高。\n大家都說：這是個人選擇，沒什麼好討論的。\n\n但如果我們是基督徒，\n聖經說：「要在你們的身子上榮耀神。」\n那麼，這件事就值得停下來想一想。\n\n不是要立什麼規矩，\n而是誠實地問自己三個問題。\n\n第一個問題：我為什麼要做？\n是為了別人的讚美？為了找回一點自信？\n還是只是因為大家都在做？\n照顧身體、打扮得體，都是好事；\n但如果我無法接納變老的自己，\n也許該在禱告裡問一句：\n我是不是把身份，寄託在這張臉上了？\n\n一位母親說，她常提醒自己：\n我的目標不是當一個「看不出生過孩子」的媽媽，\n而是用神給我的這個身體，去愛人、去服事。\n\n第二個問題：我的錢和時間，說明了我最愛什麼？\n錢在哪裡，心就在哪裡。\n把一年的保養品與醫美開銷，和奉獻的金額放在一起看；\n把每天打扮、滑美妝影片的時間，和讀經禱告的時間放在一起看。\n數字不會說謊，\n它常常扎心，\n但也常常帶來釋放。\n\n第三個問題：我是在害怕衰老，還是在敬畏主？\n看見眉間的川字紋時，我的第一反應是什麼？\n是立刻搜尋新產品，\n還是轉向神，承認我渴望被更新？\n\n箴言說：\n「豔麗是虛假的，美容是虛浮的，\n惟敬畏耶和華的婦女必得稱讚。」\n\n這裡有一個溫柔的翻轉：\n我們以為皺紋是失去，\n其實它也是提醒——\n提醒我們今生何等短暫，\n提醒我們這個會朽壞的身體，不是最後的版本。\n有一天，它要穿上不朽壞的。\n\n衰老確實讓人惆悵，\n因為起初神造我們，不是要我們衰殘。\n但神使萬事互相效力，\n連白髮、鬆弛、斑點，\n都可以成為敬拜與盼望的機會。\n\n當人生走到終點，\n沒有人會問你抗老抗得多成功。\n重要的是，你能不能像保羅那樣說：\n「那美好的仗我已經打過了，\n當跑的路我已經跑盡了，\n所信的道我已經守住了。」\n\n所以，明早照鏡子時，\n也許可以對那道新的紋路，輕輕說一聲：\n你好，\n你正在帶我，\n走向祂。\n\n#衰老 #美麗 #醫美 #身體 #敬畏神"}},{"id":22358,"slug":"dismantling-transgender-movement","title":"法律利刃正在拆解跨性別「流水線」","date":"2026-04-13","author":"Richard Osborne III","cats":["社会与时事"],"tags":["最高法院","身份認同","跨性別","性別認同"],"sum":"美國性別辯論的核心是：誰有權決定什麼對孩子最好——父母還是政府？貝克特宗教自由基金會的學者引用「跨性別流水線」概念：一、學校從幼兒園前就教孩子質疑性別；二、老師須認可孩子的轉變並向家長隱瞞；三、法律禁止家長為孩子尋求接納生理性別的輔導；四、家長反對就威脅監護權；五、政府保障藥物與手術；六、保險必須給付。但幾乎每個環節都遭遇成功挑戰：最高法院裁定馬里蘭蒙哥馬利縣須允許家長讓孩子退出宣揚跨性別意識形態的課程，並賠償150萬；也叫停加州向家長隱瞞的政策；第六巡迴法院裁定學生不能被強迫使用他人新代詞，並廢除密歇根的諮詢審查法；最高法院在查理斯訴薩拉查案廢除科羅拉多類似法律，認為是基於觀點壓制言論；聯邦強制醫院提供性別轉換的規則被廢除，斯克梅蒂案確認州可禁止未成年人接受這類程序；紐約一名女性因青少年時的乳房切除術獲賠200萬，美國整形外科醫師協會也改為不建議為未成年人手術。撫養子女的首要責任在父母，而非政府。","pts":["核心問題：誰決定什麼對孩子最好","「跨性別流水線」有六個環節","學校、法律、醫療層層推動孩子轉換","最高法院支持家長讓孩子退出相關課程","學校不得向家長隱瞞孩子的轉變","諮詢審查法被裁定為觀點歧視","州政府可禁止未成年人的性別轉換程序","醫療事故訴訟促使醫學界改變立場","撫養子女的首要責任在父母"],"mm":{"c":"拆解跨性別流水線","b":[["核心",["父母或政府"]],["流水線",["課堂","隱瞞","諮詢禁令","監護權","醫療","保險"]],["課堂判決",["蒙哥馬利縣","加州政策","代詞案"]],["家庭判決",["密歇根","查理斯訴薩拉查"]],["醫療判決",["聯邦規則廢除","斯克梅蒂案","醫療事故賠償"]],["結論",["父母的責任","宗教自由"]]]},"fw":[["問題","誰為孩子做決定"],["機制","六步流水線"],["課堂","法院保護家長"],["家庭","諮詢審查法被廢"],["醫療","政策與醫學界轉向"],["展望","父母優先"]],"q":["家長的權利，如果不能跟隨孩子進入課堂，就只是一句空話。","學校不能把孩子最佳利益的首要保護者——父母——排除在外。","撫養子女的首要責任在於家長，而不在於政府。"],"fb":{"h":"誰有權決定，\n什麼對孩子最好？","t":"在美國的性別爭論裡，有一個問題一再出現：\n誰才有權決定什麼對孩子最好——父母，還是政府？\n\n一位宗教自由組織的法律學者，用一個詞描述過去幾年的趨勢：\n「跨性別流水線」。\n\n它是這樣運作的：\n孩子還很小，學校就開始教他質疑自己的性別；\n當孩子表達想改變時，老師必須認可，還要對父母保密；\n父母發現了，想找輔導幫孩子接納自己的身體——法律不准；\n父母繼續反對，政府威脅剝奪監護權；\n最後，藥物、手術、保險給付，一路暢通。\n\n每一個環節，都把孩子往同一個方向推。\n一條單行道。\n\n這裡有一個嚴肅的哲學命題：\n當一個孩子還不能為自己簽合約、不能自己投票、不能自己買酒，\n誰該陪他做出可能改變一生的決定？\n\n過去幾年，答案正在改變。\n\n最高法院裁定，一個學區必須讓家長有權讓孩子退出相關課程，\n還要賠償家長一百五十萬。\n法院說：家長引導孩子信仰的權利，\n若不能跟著孩子走進教室，就只是一句空話。\n\n加州要求學校向父母隱瞞孩子性別轉換的政策，被叫停了。\n法院說：學校不能把孩子最重要的保護者——父母——排除在外。\n\n禁止父母為孩子尋求「接納生理性別」輔導的法律，\n在一州又一州被推翻；\n法院認為，只准一種方向的輔導，是基於觀點的審查。\n\n強迫醫院提供性別轉換手術的聯邦規定，被廢除了；\n州政府可以禁止未成年人接受這些程序。\n一位女性因青少年時期接受乳房切除手術，提告獲賠兩百萬；\n連整形外科醫學會，也改口不建議為未成年人動這類手術。\n\n認知的翻轉在這裡：\n幾年前，這一切被說成是科學共識、進步方向、不容質疑；\n今天，法院與醫學界都承認：\n證據並不足夠，代價卻非常真實。\n\n這提醒我們：\n不是所有被包裝成「進步」的，都真的在往前；\n也不是所有被貼上「保守」的，都只是落後。\n\n但這場討論，不能只停在法律的勝負。\n那些正在掙扎的孩子，是真實的人；\n他們的痛苦，需要被看見、被陪伴、被溫柔對待。\n保護孩子，不是拒絕他們，\n而是在他們最脆弱的時候，不讓他們獨自做決定。\n\n聖經把孩子交給父母，\n不是要父母控制他們，\n而是要父母愛他們、教導他們、為他們負責。\n\n這場仗還沒有結束。\n但至少，越來越多人重新聽見那句古老的提醒：\n養育孩子的首要責任，\n在家，\n不在政府。\n\n#家長權利 #孩子 #性別議題 #宗教自由 #時事"}},{"id":22355,"slug":"skepticism-not-virtue","title":"別把懷疑當美德","date":"2026-04-13","author":"Pierce Taylor Hibbs","cats":["圣经与神学"],"tags":["信心","應許","懷疑","確據","美德","確信"],"sum":"作者小時候在校車上用紫水晶換了兩顆「紅寶石」，回家父親一錘就敲碎——原來是玻璃。這種經驗很容易讓人學會「別輕信」，甚至讓懷疑成為世界觀，連對基督的信心也蒙上陰影：七歲時因怕死而信主，算真得救嗎？要一直懷疑到確定自己信得夠純正嗎？巴文克的小書《信仰的確定性》回答：信心像健全孩子對父親的信賴，本身就包含確定性——確定神應許的真實，也確定自己靠恩典有份於這些應許；而這確定性最終不在內在感受或理性證據，而在我們之外——神的作為與話語。這帶來三個好消息：一、對神應許的確信使人從無休止的質疑中得安息，巴文克說懷疑已成時代的「靈魂疾病」；二、外在的確據顯明倚靠之美，聖經總把信徒綁在客觀的話語上，情感是信心的果子而非根基；三、堅定的信心是合一與愛的根基，教會的分歧比聯結她的力量微不足道。懷疑不是基督徒的美德，神為我們預備了更好的：建立在祂話語上的確信。","pts":["被騙的經驗容易讓人把懷疑當成世界觀","懷疑也會侵蝕對救恩的確據","巴文克：信心本身包含確定性","確據最終在我們之外，在神的話語裡","懷疑是時代的靈魂疾病","確據帶來安息，懷疑帶來躁動","情感是信心的果子，不是根基","依靠神的話比自我驗證更自由","堅定的信心是教會合一的根基"],"mm":{"c":"別把懷疑當美德","b":[["故事",["假紅寶石","別輕信"]],["困惑",["怕死而信","要一直懷疑嗎"]],["巴文克",["信仰的確定性","孩子對父親的信賴"]],["好消息一",["從質疑中安息"]],["好消息二",["外在的話語","情感是果子"]],["好消息三",["合一與愛","趕走懷疑的魔鬼"]]]},"fw":[["故事","打碎的紅寶石"],["問題","懷疑是真信仰的標誌嗎"],["回答","巴文克的論述"],["一","從質疑中得安息"],["二","倚靠之美"],["三","合一與愛的根基"],["結論","神的應許確鑿無疑"]],"q":["確據帶來安息、平安、福樂；懷疑總是伴隨著不安與躁動。","情感是信心的果子，而不是信心的根基。","信心就其本質而言，只能建立在神的話語之上。"],"fb":{"h":"懷疑不是美德，\n確信才是安息。","t":"四年級時，他在校車上用一顆紫水晶，換了兩顆「紅寶石」。\n朋友說：「我爸說這是真的。」\n回到家，爸爸拿起錘子，輕輕一敲——\n碎了。\n「這是磨過的玻璃。」\n\n這種經驗，很容易讓人得出一個結論：\n別輕信任何人。\n懷疑，才能保護自己。\n\n我們的時代，把這個結論奉為美德。\n凡事要質疑，凡事要查證，\n相信得太快的人是天真，\n懷疑得越多的人越聰明。\n\n可是，當這種心態轉向信仰，就會變成一種折磨：\n我七歲時是因為怕死才信主的，那算數嗎？\n我的動機夠純正嗎？\n我是不是要一直懷疑下去，直到百分之百確定自己真的得救？\n\n一百多年前，一位荷蘭神學家巴文克，寫了一本小書回答這些問題。\n他說：\n信心，就像一個心智健全的孩子對父親的信賴。\n這種信賴本身，就帶著確定。\n\n他還說了一句讓人鬆一口氣的話：\n我們信心的確據，最終不在我們裡面，\n而在我們外面——\n在神所說的話，在基督所做的事。\n\n這帶來三個好消息。\n\n第一，確信帶來安息。\n巴文克說，對懷疑的渴求，已經成了這個時代的靈魂疾病。\n確據帶來平安與喜樂；\n懷疑與猜忌，總是伴隨著不安與躁動。\n\n第二，外在的確據，讓我們從情緒中得自由。\n我們常以為，感覺很火熱就是信心強，感覺很冷淡就是信心弱。\n但情感是信心的果子，不是信心的根基。\n根基是神的話——\n它不因你今天心情好壞而改變。\n\n第三，堅定的信心，是合一與愛的基礎。\n教會的分歧再大，\n比起把我們聯結在一起的那份信，都是小的。\n當我們一同站在神確定的應許上，\n就有餘力彼此相愛。\n\n這裡有一個深刻的翻轉：\n世界說，懷疑讓你不被騙；\n聖經說，懷疑讓你不得安息。\n世界說，相信是天真；\n聖經說，相信那位不會說謊的神，是最清醒的智慧。\n\n當然，信仰不是不准發問。\n真誠的問題，可以把人帶得更深。\n但把懷疑當作美德、當作身份、當作永遠的姿態，\n就像一個人永遠站在橋頭，\n不停敲打橋面，\n卻始終不敢走過去。\n\n紅寶石是假的，\n但神的應許是真的。\n人的話會碎，\n神的話卻立定在天，直到永遠。\n\n今天，\n放下那把用來檢驗一切的錘子吧。\n有些東西，\n不是用來敲的，\n是用來安心倚靠的。\n\n#懷疑 #確據 #信心 #巴文克 #神的應許"}},{"id":22353,"slug":"a-brief-theology-of-ai-six-points","title":"關於AI的六點神學淺思","date":"2026-04-13","author":"Joshua Baru","cats":["圣经与神学"],"tags":["技術","人工智能","AI","工具"],"sum":"在肯亞AI公司任職的作者指出，不論是否自認AI愛好者，我們每天都在用AI：搜尋、聊天機器人、個人化推薦、垃圾郵件過濾、叫車定價、行動支付的信用評分。基督徒的本分是看穿炒作，在AI時代按神的呼召生活。他提出六點：一、神的榮耀——無論做什麼都為榮耀神，既不把AI奉為偶像，也不把這份普遍恩典妖魔化；二、神的形像——AI能普及知識，作者用它學分析化學，但即使發展到超級AI，它也不是按神形像所造，無法取代人在神眼中的地位；三、人的墮落——勞碌帶著咒詛，工具反映墮落人性，AI本身不邪惡，邪惡的是我們，討論AI倫理應從在神話語前審視自己開始；四、普遍恩典——AI是神賜給義人和不義的人的美善，所有AI先驅都在不知不覺中成就神的旨意，正如凱波爾所說每一寸都屬基督；五、特殊的救贖恩典——蒙召的人無論開發、使用、標註數據或制定政策，都要追求聖潔、活出基督的樣式；六、主必再來——基督徒不需要預測型AI，結局已啟示；站在審判台前的，是人，不是AI。","pts":["我們每天都在使用AI","不把AI奉為偶像，也不妖魔化","AI是神所賜的普遍恩典","AI不是按神的形像所造","AI反映墮落的人性","AI倫理應從自我省察開始","AI先驅們不知不覺在成就神的旨意","基督徒用AI也要追求聖潔","站在審判台前的是人，不是AI"],"mm":{"c":"AI的六點神學","b":[["處境",["日常應用","看穿炒作"]],["神的榮耀",["林前10:31","不偶像化","不妖魔化"]],["神的形像",["普及知識","不能取代人"]],["墮落",["勞碌的咒詛","邪惡在人"]],["恩典",["普遍恩典","凱波爾","特殊恩典與聖潔"]],["末世",["主必再來","人受審判"]]]},"fw":[["處境","AI時代已然來臨"],["一","神的榮耀"],["二","神的形像"],["三","人的墮落"],["四","普遍恩典"],["五","救贖恩典"],["六","主必再來"]],"q":["AI本身並非邪惡，但我們卻是。","無論開發、使用或監管AI，都要為神的榮耀而行。","站在神審判台前的，是人類，而不是AI。"],"fb":{"h":"站在審判台前的，\n是人，不是AI。","t":"你今天用過AI嗎？\n\n也許你會說：沒有啊。\n但你用了搜尋引擎、聽了推薦歌單、叫了車，\n垃圾郵件自動被擋下來，\n銀行在背後評估你的信用——\n全都是AI。\n\nAI時代已經來了。\n問題不是要不要用它，\n而是我們要用什麼樣的心，活在這個時代。\n\n一位在非洲科技公司研究AI的基督徒，寫下六個思考。\n\n第一，神的榮耀。\n無論吃喝，無論做什麼，都要為榮耀神而行——\n這當然也包括AI。\n榮耀神，意味著兩件事：\n不把AI當成神來崇拜，\n也不把這份恩賜當成魔鬼來害怕。\n\n第二，神的形像。\n他說他是AI的愛好者——\n透過聊天機器人，他現在能自學分析化學，這在人類歷史上前所未有。\n但即使AI發展到超級智能，\n它依然不是按著神的形像造的；\n它永遠不能取代人在造物主眼中的位置。\n\n第三，人的墮落。\n這一點最扎心：\nAI本身不是邪惡的，\n邪惡的是我們。\n工具會反映造它和用它的人。\n所以，談AI倫理，最好的起點不是審視機器，\n而是在神的話語面前，先審視自己。\n\n第四，普遍恩典。\n神叫日頭照好人，也照歹人。\nAI是神賜給全人類的禮物，不論信不信祂。\n那些研發AI的工程師與企業家，\n無論自己知不知道，都在成就神的旨意。\n正如一位神學家說的：\n宇宙中沒有一寸地方，基督不能說「這是我的」。\n\n第五，救贖的恩典。\n蒙召的人，依然朝九晚五，依然和鄰居一樣用AI。\n但我們多了一個方向：\n無論是開發、使用、標註資料，還是制定政策，\n都要在其中追求聖潔，活出基督的樣子。\n\n第六，主必再來。\n基督徒不需要預測型AI來告訴我們未來，\n因為結局已經寫在聖經裡。\n\n這裡有一個發人深省的對比：\nAI能預測你下一首想聽的歌，\n卻預測不了你的永恆；\nAI能回答你千萬個問題，\n卻不能替你回答那最後一個問題——\n「你這一生，做了什麼？」\n\n因為當那日來到，\n站在審判台前的，\n不是你用過的工具，\n而是你自己。\n\n所以，今天繼續用AI吧，\n帶著感恩，也帶著警醒；\n不讓它高抬我們，\n也不讓它傷害別人。\n\n願我們在這個聰明得驚人的時代，\n活得\n更像人，\n更像那位\n造人的神。\n\n#AI #神學 #普遍恩典 #科技與信仰 #神的形像"}},{"id":22330,"slug":"complementarian-egalitarian","title":"在平權主義最盛行之地，如何堅守合乎聖經的互補主義？","date":"2026-04-11","author":"Carl Jan Christian Rothã€Hanna Fryxelius","cats":["教会事工"],"tags":["分歧","互補主義","平權主義"],"sum":"北歐是性別議題最進步的地區之一，福音聯盟北歐分會負責人羅斯與瑞典姊妹漢娜一同說明「互補主義」：男女在價值上平等，同樣按神形像受造，卻在身體與靈性上各有不同、彼此互補，映照基督與教會；教會長老職分由男性擔任，男性在家中以頭的身份承擔責任。漢娜原本在平權觀念中順利成為牧師，良知卻像鞋裡進了沙，缺乏聖經的確據；當她以信靠而非猜疑重讀創世記、林前11、提前2、弗5、彼前3等經文，一切拼圖歸位。克里斯蒂安在雙文化中長大，被教導平等是最高目標，母親信主後才看見比平等更高的「看別人比自己強」；聖經說界限關乎秩序而非不公，領導意味著捨己服事。他們承認歷史上有以神之名對女性的傷害，那是濫用神的話；互補主義絕不是只有少數男人蒙召服事，教會缺了姊妹就不完整。這議題不觸及福音核心，可與持平權立場的弟兄姊妹合作；在文化戰爭已敗的處境中，不必討好人，而是坦然承認、繼續愛與服事——神呼召長老，正如接納我們一樣，單單出於恩典。","pts":["互補主義：男女價值平等，角色互補","長老職分由合格男性承擔","平權背景中成為牧師的漢娜缺乏聖經確據","以信靠而非猜疑重讀經文","界限不是不公，而是秩序","領導意味著捨己服事","以神之名傷害女性是濫用神的話","教會缺了姊妹的服事就不完整","這議題不觸及福音核心，可攜手合作","不必討好人，而要愛與服事"],"mm":{"c":"北歐的互補主義","b":[["定義",["價值平等","角色互補","基督與教會"]],["漢娜",["平權中成為牧師","缺乏確據","重讀經文"]],["克里斯蒂安",["平等至上","母親的轉變","腓2:3"]],["信靠聖經",["秩序","捨己的領導"]],["歷史傷痛",["濫用聖經","神看重女性"]],["實踐",["姊妹的服事","與異見者合作","討神喜悅"]]]},"fw":[["背景","北歐的性別文化"],["見證一","漢娜的轉變"],["見證二","克里斯蒂安的成長"],["根基","信靠聖經"],["反思","女性受壓迫的歷史"],["實踐","健康的互補主義"],["關係","在分歧中同行"]],"q":["界限並非不公，而是關乎秩序。","領導意味著服事，弟兄要捨己，用力量保護和服侍他人。","神接納我們，不是因為資歷，而是單單出於恩典。"],"fb":{"h":"界限不是不公，\n而是秩序。","t":"她是一位很有恩賜的女性。\n強烈的呼召，對福音的熱情，帶領與教導的天分。\n她讀完神學，成為一間教會的牧師，\n一切看起來都順理成章。\n\n可是她說，心裡總覺得像鞋子裡進了沙，\n一直磨著良心。\n她缺了一樣東西：\n來自聖經本身的確據。\n\n她在全世界性別觀念最進步的北歐長大。\n在那裡，任何男女的區別都可能被視為歧視，\n教會中長老只由男性擔任的主張，聽起來幾乎像是上個世紀的遺物。\n\n後來，她做了一件簡單的事：\n重新讀那些關於男女的經文——\n但這一次，不是帶著猜疑去找漏洞，\n而是帶著信靠去聆聽。\n\n她說，幾乎就在一瞬間，拼圖一片一片歸位了。\n她看見神造男造女的美意：\n價值上完全平等，\n設計與使命上各有不同。\n不是壓迫，而是憐憫；\n不是貶低，而是互補。\n\n這裡有一個深刻的哲學命題：\n「平等」一定意味著「相同」嗎？\n\n世界說：如果一個人不能擔任另一個人能擔任的每一個職位，那就是不公。\n聖經卻說：界限不一定是不公，\n它可能是一種秩序。\n\n世界說：領導就是權力，而權力常常是危險的。\n聖經說：領導就是服事；\n真正的帶領，是捨己，\n是用力量去保護人、扶持人，\n而不是轄制人。\n\n當然，我們必須誠實承認：\n歷史上確實有人以神之名傷害女性。\n但那不是神的話的錯，\n而是對神的話的濫用。\n耶穌看重女性，\n保羅稱讚與他同工的姊妹，\n教會若沒有姊妹的服事，就是不完整的。\n\n那位離開牧職的姊妹說了一句很有力量的話：\n「我的呼召一點也沒有改變。\n我深信，今天我比擔任長老時，更好地服事神。」\n\n認知的翻轉在這裡：\n我們以為順服是失去，\n其實順服常常是釋放；\n我們以為界限讓人變小，\n其實真正讓人渺小的，是把自己的價值綁在職位上。\n\n這不是福音的核心議題，\n持不同看法的弟兄姊妹仍可同工、同心。\n但無論立場如何，\n我們都不需要靠職位證明自己，\n因為我們的生命，已經與基督一同藏在神裡面。\n\n神呼召某些人帶領，\n不是因為他們配得，\n就像祂接納我們，\n也從來不是因為我們配得——\n一切，\n都是恩典。\n\n#互補主義 #性別 #教會 #順服 #恩典"}},{"id":22293,"slug":"supreme-court-schools-hide-gender-transitions-parents","title":"最高法院宣稱：學校不得向家長隱瞞學生的性別轉換情況","date":"2026-04-10","author":"Joe Carter","cats":["社会与时事"],"tags":["LGBTQ","最高法院","性別認同","親子"],"sum":"美國最高法院在緊急審理中以6比3暫停加州一項政策：該政策要求公立學校使用學生自選的姓名與代詞，並在未獲學生同意時向家長隱瞞，即使家長詢問也要迴避。米拉貝利訴邦塔案中，兩對父母的女兒在學校被當作男生，其中一人甚至自殺未遂住院後，學校仍不告知父母。地方法院原判家長勝訴，第九巡迴法院暫停禁令，最高法院撤銷暫停，認為家長很可能勝訴，隱瞞政策會造成不可彌補的傷害；理由基於第一修正案宗教自由與第十四修正案正當程序，後者保護所有父母，而非只限宗教異議者。作者卡特指出，核心問題是：在神面前與法律之下，誰負有照顧孩子的首要責任？加州的「指導意見」迅速變成強制培訓與可執行政策，提醒家長權利並非自動生效；這只是初步命令，戰鬥未完，但最高法院已發出信號：州政府不得把家長當作可規避的敵人。","pts":["最高法院暫停加州向家長隱瞞的政策","學校曾在學生自殺未遂後仍向家長隱瞞","法院認為家長很可能勝訴","依據宗教自由與正當程序","正當程序保護所有父母","核心問題：誰負責照顧孩子","行政指導可能悄悄變成強制政策","家長權利並非自動生效","戰鬥尚未結束，但出現盼望"],"mm":{"c":"學校不得向家長隱瞞","b":[["裁決",["6比3","暫停加州政策"]],["案情",["自選代詞","向家長保密","自殺未遂"]],["法律依據",["宗教自由","正當程序","嚴格審查"]],["意義",["父母的首要責任","受造秩序"]],["警示",["指導變政策","權利需要守護"]],["展望",["初步命令","仍有希望"]]]},"fw":[["簡述","緊急裁決"],["背景","米拉貝利訴邦塔案"],["理由","兩項憲法基礎"],["重要性","誰照顧孩子"],["警示","隱蔽的監管"],["限制與盼望","戰鬥未完"]],"q":["州政府不得將家長視為可以規避的敵人。","家長權利並非自動生效，需要警醒與參與。","在神面前，誰擁有照顧孩子的首要責任？"],"fb":{"h":"誰該第一個知道\n孩子正在掙扎？","t":"想像一下：\n你的孩子在學校改了名字，換了代詞，被老師當作另一個性別對待。\n全班都知道，\n只有你不知道。\n\n你問學校，老師迴避；\n你找校方，校方拒絕透露。\n甚至，孩子在這段時間試圖自殺住院後，\n學校依然選擇對你保密。\n\n這不是虛構的情節，\n而是一宗送到美國最高法院的真實案件。\n\n加州的政策要求學校：除非學生同意，否則不得讓父母知道孩子在學校的性別轉換。\n州政府的理由是：保護學生的隱私與自主。\n\n最高法院以六比三暫停了這項政策。\n法官們認為：\n把父母排除在孩子心理健康與身份這種「極其重大的決定」之外，\n很可能違憲；\n而讓這種政策繼續執行，會造成無法彌補的傷害。\n\n這裡有一個每個家庭都該思考的命題：\n一個孩子最脆弱的時候，\n誰該第一個知道？\n是學校的行政人員，還是生他、養他、愛他的父母？\n\n有趣的是，法院給出的理由不只一個。\n一個是宗教自由；\n另一個是正當程序——\n後者保護的不只是有信仰的父母，\n而是所有的父母。\n這說明，問題不只是宗教，\n而是家庭本身。\n\n作者提醒了一件很容易被忽略的事：\n這項政策一開始只是「指導意見」，\n後來變成強制培訓，\n最後在法庭上被當作有約束力的規定來辯護。\n很多改變不是一夜之間發生的，\n而是在沒有人注意時，一點一點成形。\n\n這是一個認知翻轉：\n我們以為父母的權利理所當然，\n其實它需要被守護；\n我們以為只要不出聲就不會有事，\n其實沉默，常常就是讓位。\n那幾對父母，只為了讓學校不再對他們說謊，\n就打了好幾年的官司。\n\n當然，這只是初步裁決，戰鬥還沒結束。\n但它發出了一個清楚的信號：\n政府不能把父母當作需要繞過的敵人。\n\n聖經把孩子託付給父母，\n不是為了讓父母控制孩子，\n而是為了讓父母在孩子迷惘時，\n有機會擁抱他、聆聽他、陪他走過黑夜。\n\n願每一位父母，\n都不要缺席孩子最需要你的時刻；\n也願每一個掙扎中的孩子，\n在家裡找到一扇\n永遠為他開著的門。\n\n#家長權利 #最高法院 #親子 #教育 #家庭"}},{"id":22254,"slug":"stop-being-shocked-christians-disagree","title":"別再爲基督徒與你意見相左而大驚小怪了","date":"2026-04-09","author":"Trevin Wax","cats":["基督徒生活"],"tags":["友誼","衝突","社交媒體","兩極化"],"sum":"特雷文·瓦克斯讀到清教徒歐文與巴克斯特因神學、性格與立場分歧而長期決裂的故事，深受啟發：忠心愛主、熱愛教會的人，仍可能在時代最關鍵的議題上無法達成共識。他觀察到，過去十年福音派的問題不只是分歧本身，而是人們對分歧感到震驚——以為忠心必然帶來一致，於是質疑異見者的成熟、忠心甚至信仰真誠。移民議題被簡化為善惡對決，氣候與關愛受造物在英美兩邊有相反直覺，種族議題只剩「準共產主義者」與「準三K黨」兩種標籤。他反問那些嗓門最大的人：你想要的勝利是什麼？對方消失、悔改、名聲盡毀嗎？因一次分歧就全盤否定某人，不是屬靈剛強，而是思想上不自信。這不是相對主義，分歧仍重要，但我們要清楚表達立場、敞開接受修正、預期忠心的人會意見不同、不妄加揣測動機，並耐心傾聽、找準真正的分歧、為對方禱告、在能同心之處合作。歐文和巴克斯特終未和解，卻都沒有消失，今天我們同樣欣賞他們。","pts":["忠心的基督徒也可能在關鍵議題上意見不同","問題常在於對分歧感到震驚","我們容易質疑異見者的動機與信仰","複雜議題被簡化為善惡對決","你想要的「勝利」究竟是什麼？","一次分歧就全盤否定，是思想上的不自信","這不是相對主義，分歧仍然重要","清楚表達立場，也敞開接受修正","在能同心之處攜手合作"],"mm":{"c":"別再為分歧震驚","b":[["歷史",["歐文","巴克斯特","長久決裂"]],["現象",["以為忠心帶來一致","質疑動機"]],["例子",["移民","氣候","種族"]],["反問",["勝利是什麼","全盤否定"]],["出路",["清楚表達","接受修正","不揣測動機","合作"]],["結語",["兩人都沒有消失"]]]},"fw":[["引子","兩位清教徒的決裂"],["診斷","對分歧缺乏預期"],["例證","三個爭議議題"],["反問","勝利意味著什麼"],["出路","更緩慢的工作"],["結語","歷史的提醒"]],"q":["分歧的存在，並不必然意味著背後藏著險惡的動機。","因一次分歧就全盤否定他人，不是屬靈剛強，而是思想上的不自信。","弟兄姊妹之間的分歧，是教會的常態。"],"fb":{"h":"愛主的人，\n也會和你意見不同。","t":"三百多年前，英國有兩位屬靈巨人。\n一位叫歐文，一位叫巴克斯特。\n他們都愛主，都愛教會，都熱切傳福音，都致力於敬虔的生活。\n然而，因為神學的分歧、性格的差異、處事立場的不同，\n他們最終決裂，到死都沒有完全和好。\n\n這個故事讓人難過，\n卻也提醒了我們一件事：\n忠心，不一定帶來一致。\n\n我們這個時代的問題，\n也許不是分歧本身，\n而是我們對分歧感到震驚。\n\n我們以為：只要認真讀聖經、理性思考，\n所有忠心的基督徒都應該得出和我一樣的結論。\n於是，當弟兄姊妹在移民、氣候、種族、政治上和我們不同時，\n我們開始懷疑他們不成熟、不忠心，\n甚至懷疑他們的信仰是不是真的。\n\n移民議題，被簡化成善與惡的對決；\n種族議題，只剩下兩個標籤可選：\n一邊是「準共產主義者」，一邊是「準三K黨」。\n在這樣的氛圍裡，誠實的對話幾乎不可能。\n\n這裡有一個值得自問的問題：\n當你在網路上和另一位基督徒激烈交鋒，\n你想要的「勝利」到底長什麼樣子？\n讓對方消失？\n讓他灰頭土臉地認錯？\n讓他的教會關門？\n讓他的名聲徹底毀掉？\n\n認真想一想，你會發現：\n那樣的勝利，從來不會來；\n就算來了，也不是天國的勝利。\n\n作者說了一句很犀利的話：\n因為一次分歧，就把一個人全盤否定，\n這不是屬靈的剛強，\n而是思想上的不自信。\n真正有洞察力的人，\n能吸收有益的，放下無益的，\n而不必把人一筆抹殺。\n\n當然，這不是相對主義。\n分歧依然重要，真理依然有對錯。\n但我們可以學習一種更艱難、也更緩慢的功課：\n把自己的立場講清楚，\n也敞開心接受別人的修正；\n預期忠心的人會和我們不同，\n不急著替別人安上動機；\n耐心聆聽，找出真正的分歧在哪裡；\n為和我們意見不同的人禱告，\n在能同心的地方，一起同工。\n\n歐文和巴克斯特，最後沒有完全和好。\n但他們都沒有消失。\n他們在同一片土地上，服事同一位主，\n各自為信念努力了一輩子。\n而今天，我們同時欣賞他們兩個人——\n儘管他們當年彼此看不上。\n\n也許，三百年後的人回頭看我們，\n也會這樣想：\n原來那些吵得面紅耳赤的人，\n其實是同一家人。\n\n#合一 #分歧 #教會 #謙卑 #愛"}},{"id":22251,"slug":"emotional-validation-loving","title":"一味肯定對方的感受，並不等於愛","date":"2026-04-09","author":"Taylor Combs","cats":["基督徒生活"],"tags":["情緒","身份","認同","肯定","感情","共情"],"sum":"三個情境：一位弟兄說對妻子極度憤怒、幻想沒娶她；一位姊妹指控朋友傷害她，理由卻含糊；幾位單身成員因講道多談婚姻而感到被冒犯，要求開「傾聽會」。我們該肯定這些情緒，還是挑戰它們？當代文化的答案是永遠肯定，這是心理治療的核心原則，也似乎有聖經依據：詩篇說出憤怒與悲傷，約伯的朋友起初陪他靜坐七日，開口糾正時才陷入罪中。作者提出三個更好的回應：一、區分察覺與肯定——不盲目肯定所有情緒，也不假裝它不存在；先體察，如問「你為什麼這麼心碎？」，讓對方被聽見，又不肯定罪或偶像。二、把情緒當溫度計而非恆溫器——情緒是有用的資訊，但不該由它決定方向，可以像神問約拿「你這樣發怒合乎理嗎？」三、操練合宜的智慧——箴26:4–5看似矛盾，其實是不同處境需要不同回應：若單身肢體一向成熟委身，就給他們傾聽；若是慣於挑起紛爭的人，就直接糾正。在「被肯定」成為最高美德的文化裡，不全盤肯定可能被指為傷害，但我們仍要在禱告中仰賴神的智慧。","pts":["面對情緒，要肯定還是挑戰？","當代文化主張永遠肯定感受","詩篇與約伯似乎支持肯定","人的怒氣不成就神的義","先察覺，不急著肯定或糾正","情緒是溫度計，不是恆溫器","幫助人應對情緒，而非被情緒主導","不同處境需要不同的智慧","在禱告中仰賴神的智慧"],"mm":{"c":"肯定感受不等於愛","b":[["情境",["憤怒的丈夫","受傷的姊妹","單身成員"]],["文化",["永遠肯定","心理治療原則"]],["聖經",["詩篇","約伯","雅1:20"]],["察覺",["體察","提問","不肯定罪"]],["溫度計",["有用的資訊","拿4:9"]],["智慧",["箴26:4–5","看對象","禱告"]]]},"fw":[["情境","三個牧養場景"],["問題","肯定還是指正"],["文化","肯定一切"],["回應一","區分察覺與肯定"],["回應二","情緒是溫度計"],["回應三","合宜的智慧"],["提醒","謹慎前行"]],"q":["情緒是溫度計，不是恆溫器。","我們可以敏銳體察他人的情感，而不必淪為情感的奴隸。","比起肯定情緒，更有益的是幫助人應對情緒。"],"fb":{"h":"情緒是溫度計，\n不是方向盤。","t":"一位弟兄說：「我對我太太非常憤怒。我甚至幻想，如果當初沒娶她就好了。」\n一位姊妹說：「她傷害了我。」可是當你聽完，卻覺得那些話其實沒那麼嚴重。\n幾位單身的弟兄姊妹說：「講台總是講婚姻和育兒，我們覺得被忽視了。」\n\n你會怎麼回應？\n\n今天的文化給了一個簡單的答案：\n永遠肯定對方的感受。\n讓人感到被聽見、被理解、被支持，\n不要評斷，不要糾正。\n\n這聽起來很溫暖，\n也確實有聖經的影子——\n詩篇裡充滿了憤怒、悲傷、懷疑的禱告；\n約伯受苦時，朋友們陪他坐了七天七夜，一句話都沒說。\n直到他們開口糾正，才開始出錯。\n\n但是，「永遠肯定」真的就是愛嗎？\n\n雅各說：「人的怒氣並不成就神的義。」\n如果我們肯定一個人對妻子的怨恨，\n也許他會覺得被理解，\n卻可能在一條更糟的路上走得更快。\n\n作者提出三個更有智慧的方式。\n\n第一，區分「察覺」和「肯定」。\n你可以看見一個人的痛，卻不必認同他所有的解讀。\n你可以說：「聽起來你真的很受傷，我很難過。\n能說說為什麼那句話讓你這麼心碎嗎？」\n這句話，讓人被聽見，\n也為更深的對話打開一扇門。\n\n第二，把情緒當作溫度計，而不是恆溫器。\n溫度計告訴你現在幾度；\n恆溫器決定房間要變成幾度。\n情緒是寶貴的資訊，\n告訴你心裡正在發生什麼；\n但它不該握著方向盤。\n就像神問生氣的約拿：「你這樣發怒合乎理嗎？」\n\n第三，操練合宜的智慧。\n箴言說：「不要照愚昧人的愚妄話回答他」，\n下一節又說：「要照愚昧人的愚妄話回答他」。\n不是矛盾，而是提醒：\n不同的人、不同的處境，需要不同的回應。\n成熟謙卑的人提出關切，值得我們安靜傾聽；\n習慣製造紛爭的人，可能需要清楚的糾正。\n\n這裡有一個認知翻轉：\n我們以為愛就是不說任何讓人不舒服的話，\n其實真正的愛，有時是溫柔地問一句：\n「你確定，這樣的感覺是對的嗎？」\n我們以為肯定才是恩典，\n其實恩典與真理，從來不是二選一。\n\n當然，這條路不容易。\n你可能用盡了愛心和智慧，\n仍然被誤解為冷漠，甚至被指為傷害。\n\n但我們不是靠自己的完美在牧養人，\n而是作為救贖主手中的器皿。\n所以，在每一次面對眼淚與怒氣之前，\n先低頭禱告：\n主啊，\n給我一顆柔軟的心，\n也給我一雙\n看得清方向的眼睛。\n\n#情緒 #牧養 #輔導 #智慧 #真理與恩典"}},{"id":22244,"slug":"project-hail-mary-christian-movie-review","title":"滿有恩典，也滿有樂趣 ","date":"2026-04-07","author":"Brett McCracken","cats":["文化与艺术"],"tags":["友誼","捨己","影評","後現代","科幻","元時代"],"sum":"安迪·威爾的科幻小說《挽救計劃》改編成電影，麥克拉肯認為甚至超越原著：幽默、感人、令人敬畏，又是難得乾淨、適合全家觀看的主流大片。電影融合了《星際穿越》《火星救援》《降臨》《E.T.》的元素：中學科學老師萊蘭·格雷斯在太空船中失憶甦醒，原來太陽因一種微生物「噬星體」正在衰竭，他是任務唯一倖存者；他遇到同樣要拯救家園的波江座外星人「洛基」，兩人結下歌頌友誼、犧牲與捨己之愛的情誼。作者認為這是典型的元現代主義作品：在真誠與反諷、天真與世故之間自如切換，例如嚴肅的任務負責人在末日前夕唱流行歌，從滑稽轉為真誠；元現代的兩大標誌是「信念」與「建設」，人們渴望重新相信、去解決問題。片名與主角名「Grace」指向恩典：他給出捨己救人的恩典，也領受洛基給的不配得的生機，只能說「謝謝」。電影沒有直接傳福音，卻讓無私與犧牲顯得美麗——人們渴望在藝術中重見良善、真理與美好。","pts":["改編電影甚至超越原著","難得乾淨又高水準的全家電影","融合多部經典科幻作品的元素","故事核心是友誼、犧牲與捨己之愛","典型的元現代主義作品","在反諷與真誠之間切換","信念與建設是元現代的標誌","主角名「恩典」指向給出與領受的恩典","電影讓無私與犧牲顯得美麗","人們渴望重見良善、真理與美好"],"mm":{"c":"挽救計劃","b":[["電影",["超越原著","全家觀看","PG-13"]],["科幻傳承",["星際穿越","火星救援","降臨","E.T."]],["故事",["失憶甦醒","噬星體","外星友人洛基"]],["元現代",["真誠與反諷","信念","建設"]],["恩典",["Grace","捨己","謝謝你"]],["意義",["美德的光彩","後現代之後"]]]},"fw":[["評價","超越原著的改編"],["傳承","科幻片的新高度"],["劇情","兩個家園的拯救"],["風格","元現代主義"],["信仰","滿溢的恩典"],["結論","渴望良善與美"]],"q":["面對不配得的禮物，唯一恰當的回應是：謝謝你。","良善、真理與美好，一直都是我們心之所向。","這部電影沒有直接宣講福音，卻讓美德散發光彩。"],"fb":{"h":"面對不配得的恩典，\n唯一的回應是：謝謝你。","t":"一位中學科學老師，在太空船裡醒來。\n他不知道自己在哪裡，\n不記得自己是誰，\n只發現身旁的同伴都已經死了。\n\n慢慢地，記憶回來了：\n太陽正在變暗，地球面臨滅絕；\n他是這趟拯救任務唯一的倖存者，\n而這是一趟單程旅行。\n\n他的名字，叫格雷斯（Grace）——\n恩典。\n\n這是電影《挽救計劃》的故事。\n它幽默、感人、壯觀，\n而且難得地乾淨，全家都能一起看。\n但真正打動人的，\n是它在不知不覺中，講了一個關於救贖的故事。\n\n在遙遠的星系，他遇見了一個外星生物，\n一個同樣為了拯救家園而來的旅人。\n他們語言不通、外形迥異，\n卻一點一點學會溝通，\n成為彼此生命中最好的朋友。\n這是一個關於友誼、犧牲與捨己之愛的故事。\n\n影評人說，這是一部典型的「元現代」作品：\n它會開玩笑，也敢真誠；\n它懂得反諷，卻不憤世嫉俗。\n電影裡有一幕，一位嚴肅的任務負責人在末日前夕拿起麥克風唱流行歌，\n一開始像個笑話，\n唱著唱著，卻變成了最真實的祈禱。\n\n這裡有一個時代的命題：\n在一個什麼都懷疑、什麼都解構的世界裡，\n人還能重新相信嗎？\n\n這部電影給出的答案是：能。\n人們渴望再次相信，\n渴望再次建設，\n渴望看見一個人願意為別人付出生命。\n\n主角一開始並不是英雄。\n他是被拖進任務的，\n他害怕，他不情願。\n但在旅程中，他一點一點學會勇敢，\n學會把別人的命，看得比自己的還重。\n\n然後，故事走到最動人的地方：\n當他已經接受了自己將死的結局，\n他的外星朋友，給了他一條本不該有的生路。\n面對這份不配得的禮物，\n他只說了一句話：\n「謝謝你。」\n\n這就是恩典的樣子。\n你什麼都不能做，\n只能領受，\n只能感謝。\n\n認知的翻轉在這裡：\n我們以為要先成為英雄，才配得救；\n其實福音告訴我們，\n是那位真正的英雄，為不配的人捨命。\n我們以為恩典是對好人的獎賞，\n其實恩典，是給那些一無所有的人的禮物。\n\n電影沒有直接傳福音，\n卻讓無私、犧牲、擔當重新變得美麗。\n也許這說明了一件事：\n人心深處，一直在渴望良善、真理與美好——\n一直在等待一個\n願意為我們捨命的朋友。\n\n而那位朋友，\n早已經來過了。\n\n#電影 #恩典 #捨己 #友誼 #科幻"}},{"id":22242,"slug":"ai-sports-olympic-gold","title":"AI 永遠拿不到奧運金牌","date":"2026-04-07","author":"Brett McCracken","cats":["文化与艺术"],"tags":["奇蹟","人工智能","AI","體育競技","比賽","不可控"],"sum":"作者帶著孩子觀看冬奧男子冰球決賽，美國隊在加時賽靠休斯一記射門擊敗加拿大，時隔46年奪金；休斯幾分鐘前才被球桿打斷三顆牙，披著國旗、帶著血跡的笑容，是任何演算法編不出來的畫面。作者預言，當電影、音樂、文學越來越被AI渲染，體育可能成為「最後的人類藝術」：我們看比賽不只為技巧，而是為背後的人生故事、紀律、犧牲，以及會受傷、有極限、會死的血肉之軀所冒的真實風險——這正是AI永遠在規避的。體育的魅力也在於失敗的可能與不可控：四年世界第一，仍可能在那一天失手；這正是真實人生的縮影，人心籌算，神卻指引腳步。社會學家羅薩說，生命的活力來自與不受掌控之物相遇，一個被完全計劃與控制的世界是了無生氣的。我們常用「奇蹟」「萬福瑪利亞」描述體育時刻，或許因為在凡人挑戰極限時，窺見了神形像的光芒——「榮耀尊貴為冠冕」，也隔著薄霧預嘗身體終將被救贖的未來。","pts":["休斯斷了三顆牙仍射入致勝球","這種時刻是演算法編不出來的","體育可能成為最後的人類藝術","我們看的是技巧背後的人生故事","血肉之軀的脆弱使體育動人","體育的不可預測正像真實人生","生命的活力來自與不受掌控之物相遇","被完全控制的世界是了無生氣的","在體育巔峰中窺見神形像的榮耀"],"mm":{"c":"AI拿不到奧運金牌","b":[["決賽",["加時絕殺","斷牙的笑容"]],["最後的人類藝術",["人生故事","犧牲","不是機器"]],["脆弱",["受傷","極限","真實風險"]],["不可控",["失敗可能","箴16:9","羅薩"]],["神的形像",["奇蹟語言","詩8:5"]],["末世",["身體救贖","美好禮物"]]]},"fw":[["場景","主日早晨的冰球決賽"],["論點","體育是最後的人類藝術"],["脆弱","肉身的真實"],["不可控","失敗的可能"],["神學","承載神形像的榮耀"],["盼望","預嘗救贖"]],"q":["一個被充分認知、計劃和控制的世界，是了無生氣的世界。","我們看比賽，是為了看技藝背後的各樣人生。","在凡人挑戰極限時，我們窺見了神形像的光芒。"],"fb":{"h":"AI寫得出完美的劇本，\n寫不出那一顆斷掉的牙。","t":"主日早上，一位父親抱著三個月大的兒子，和孩子們坐在電視前。\n冬奧男子冰球決賽，美國對加拿大。\n正規時間打平，進入突然死亡加時賽。\n幾分鐘後，一名球員抓住機會，揮桿——\n球進了！\n時隔四十六年，再奪金牌。\n\n全家跳起來擊掌、大叫。\n而那位射門的球員，幾分鐘前才被對手的球桿打斷了三顆牙。\n他披著國旗笑著，嘴角還帶著血。\n\n這一幕，\n沒有任何演算法編得出來。\n\n我們正走進一個被AI包圍的時代。\n電影可以生成，音樂可以合成，文章可以一鍵寫好。\n作者預言了一件事：\n體育，也許會成為「最後的人類藝術」。\n\n為什麼？\n\n因為我們看比賽，從來不只是看技術。\n我們看的是故事：\n一個家庭的犧牲，一個國家的期盼，\n無數個清晨的苦練，\n汗水、血水和淚水。\n\n如果有一天，機器人組成聯賽，\n每一球都完美無瑕，\n你還會想看嗎？\n大概不會。\n因為我們愛的，不是完美，\n而是一個會受傷、會害怕、會失敗的人，\n卻依然往前衝。\n\n這是一個深刻的哲學命題：\n人之所以為人，正是因為我們有極限、會受傷、終將一死。\n而這些，AI永遠不懂，也永遠在規避。\n\n體育之所以動人，還因為它不可控。\n你可以四年都是世界第一，\n卻在最重要的那一天失誤；\n你可以被所有人看好，\n卻在冰面上滑倒。\n這不正是人生嗎？\n人心籌算自己的道路，\n惟耶和華指引他的腳步。\n\n一位社會學家說：\n生命的活力，來自與不受控制之物的相遇；\n一個被完全計劃、完全控制的世界，\n是一個了無生氣的世界。\n\n認知的翻轉在這裡：\n我們以為越能掌控，生活越美好；\n其實那些讓我們熱淚盈眶的時刻，\n幾乎都是無法掌控的。\n\n有趣的是，人們總愛用宗教的詞來形容這些時刻：\n「奇蹟」、「萬福瑪利亞傳球」。\n也許是因為，\n當我們看見一個脆弱的凡人挑戰極限，\n我們隱約看見了神的形像——\n「你叫他比天使微小一點，\n並賜他榮耀尊貴為冠冕。」\n\n金牌會生鏽，紀錄會被打破，\n巔峰總是轉瞬即逝。\n但這些時刻，仍是美好的禮物，\n像一扇小窗，\n讓我們隔著薄霧，\n看見那終將到來的日子——\n那時，破碎的身體要被救贖，\n每一滴汗與淚，\n都不再白流。\n\n#體育 #AI #神的形像 #人性 #奧運"}},{"id":22239,"slug":"john-perkins-tribute","title":"跨入「天堂之門」：紀念約翰·M. 珀金斯","date":"2026-04-07","author":"Thaddeus Williams","cats":["社会与时事"],"tags":["社會公義","見證","種族歧視","批判性種族理論"],"sum":"作者十幾歲時讀到約翰·珀金斯的《人人享有正義》，二十多年後竟成為他的忘年交。珀金斯1930年生於密西西比佃農家庭，七個月大時母親因營養不良過世，17歲時戰功卓著的哥哥死在種族主義警察槍下，1970年因參與民權抗議入獄並受酷刑幾近喪命。他說：用恨回應恨再簡單不過，但神有一個救贖的計劃，耶穌把他從仇恨與怨恨中拉了回來。對研究多年批判性種族理論的作者而言，與他相處像清泉注入乾涸的靈魂——兩人背景天差地別，卻在基督裡流著「同樣的血」。珀金斯留給追求正義的基督徒四句話：一、從神開始，不公義只有神能解決；二、在基督裡合一，任何破壞團結的小團體主義都不是神的公義；三、傳講福音，停止打種族牌，不以政治議程取代福音；四、教導真理，正義的標準是神的話，不是感覺或輿論。他晚年說自己「就住在天堂門口」，喜樂一天比一天光彩；2026年3月13日，在家人與相伴近75年的妻子環繞中，他跨入了天堂之門。","pts":["珀金斯在種族隔離最黑暗的年代長大","哥哥死在種族主義警察槍下","他在獄中受酷刑幾近喪命","耶穌把他從仇恨中拉了回來","在基督裡，我們流著同樣的血","公義要從神開始","在基督裡合一，拒絕小團體主義","傳講福音，不以政治議程取代","正義的標準是神的話","他在喜樂中跨入天堂之門"],"mm":{"c":"紀念約翰·珀金斯","b":[["苦難",["佃農家庭","哥哥遇害","獄中酷刑"]],["轉化",["不以恨報恨","救贖的計劃"]],["友誼",["忘年交","同樣的血"]],["四個教導",["從神開始","在基督裡合一","傳講福音","教導真理"]],["課堂",["FaceTime講課","彌6:8"]],["安息",["天堂門口","喜樂","2026年3月13日"]]]},"fw":[["相遇","一本書與一段友誼"],["生平","苦難中的見證"],["轉化","從仇恨到救贖"],["教導","四個要點"],["告別","跨入天堂之門"]],"q":["如果當時我用恨去回應恨，那再簡單不過了。","在基督裡，我們流著同樣的血。","沒有真理，就沒有正義。"],"fb":{"h":"用恨回應恨很簡單，\n但神有另一個計劃。","t":"他出生在密西西比的佃農家庭，\n那是經濟大蕭條、種族隔離最黑暗的年代。\n七個月大時，母親因營養不良過世。\n十七歲那年，他的哥哥——一位戰功彪炳的軍人——\n被一名種族主義警察開槍打死，\n死在他的懷裡。\n\n多年後，他因參加民權抗議被捕，\n在監獄裡被毒打到幾乎喪命，\n在醫院躺了好幾個月。\n\n他叫約翰·珀金斯。\n\n如果他從此恨透了這個世界，\n恐怕沒有人會責怪他。\n但他說了一句話：\n「如果當時我用恨去回應恨，那再簡單不過了。\n但神對我有另一個計劃，一個救贖的計劃。\n是耶穌救了我，把我從充滿仇恨和怨恨的人生中拉了回來。」\n\n一位在加州中產家庭長大、比他晚出生將近半個世紀的年輕人，\n十幾歲時讀了他的書，\n二十多年後，竟成了他的忘年之交。\n兩個背景天差地別的人，\n怎麼可能成為家人？\n珀金斯常說：\n因為在基督裡，我們流著同樣的血。\n\n這裡有一個時代的命題：\n我們該怎麼追求正義，\n才不會在追求的過程中，變成另一種不義？\n\n珀金斯用六十多年的生命，留下四句話。\n\n第一，從神開始。\n神比我們想像的更偉大；\n不公義的問題，只有神能真正解決。\n\n第二，在基督裡合一。\n黑人、白人、棕色人種，富的、窮的，\n被同一位父收養，被同一位子拯救，被同一位靈充滿。\n任何破壞這份合一的小圈子，都不是神的公義。\n\n第三，傳講福音。\n在耶穌的寶血裡，我們才能真正視彼此為同一家人。\n停止打種族牌，\n不要讓任何政治議程取代福音。\n\n第四，教導真理。\n沒有真理，就沒有正義。\n真理的標準，不是我們的感覺、輿論或政客的口號，\n而是神的話。\n\n這是一個認知的翻轉：\n世界說，受過傷的人有權恨；\n福音說，受過傷的人，最能見證饒恕的大能。\n世界說，正義要靠分化對立來爭取；\n福音說，真正的正義，從合一開始。\n\n晚年，他常說：\n「我就住在天堂的門口。\n每一天都可能是我在世上的最後一天，\n喜樂環繞著我，而且一天比一天更光彩奪目。」\n\n2026年3月13日早晨，\n在家人與相伴近七十五年的妻子身邊，\n他跨過了那扇門。\n不是快到了，\n而是已經到了——\n正仰望著那張他渴慕一生的臉。\n\n願我們用他希望的方式紀念他：\n從神開始，\n在基督裡合一，\n傳講福音，\n教導真理，\n而且，帶著耶穌那樣的喜樂。\n\n#約翰珀金斯 #正義 #饒恕 #合一 #紀念"}},{"id":22236,"slug":"danger-ai-misformation","title":"比假信息更可怕的，是 AI 對人的錯誤塑造","date":"2026-04-06","author":"Jonathan Sams","cats":["信仰与工作"],"tags":["危機","人工智能","屬靈生命","AI"],"sum":"如今任何屬靈問題都能從AI聊天機器人立刻得到詳盡回答：有人用它生成禱告詞與靈修材料、判斷某事是否為罪、產生小組討論題。即使答案合乎聖經，作者認為真正的危險不是「錯誤資訊」，而是「錯誤塑造」——習慣使用AI會改變我們的注意力、期待與尋求指引的路徑；而聖經的屬靈成長從不在於快速得到正確答案，而是聖靈藉讀經、禱告、教會等平凡恩典緩慢地塑造我們。三種侵蝕：一、注意力萎縮——讀經前先讓AI摘要，聽完講道讓AI列五點應用，取代默想與禱告省察；二、期待無阻的人生——把快當好、把掙扎當錯，要AI提供量身定做的靈修計劃甚至人生抉擇的答案，忽略了掙扎正是經歷神的契機；三、依賴AI作牧者——焦慮、試探、被教會傷害、懷疑得救時先問AI，而不向人認罪、請人代禱、與領袖和解。給牧者五項建議：先讀經後提問、先禱告後搜尋、重大問題尋求牧養、明確AI的邊界（它沒有屬靈權柄）、在教會公開討論AI的使用。","pts":["AI已進入基督徒的屬靈生活","危險不只是錯誤資訊，而是錯誤塑造","屬靈成長是緩慢的過程","依賴AI摘要使注意力萎縮","AI讓我們期待沒有阻力的屬靈生活","掙扎正是經歷神的契機","AI可能取代神設立的牧養關係","先讀經後提問，先禱告後搜尋","AI沒有屬靈權柄"],"mm":{"c":"AI的錯誤塑造","b":[["現象",["AI禱告詞","判斷罪","小組題目"]],["核心危險",["錯誤塑造","改變直覺"]],["注意力萎縮",["先看摘要","五點應用"]],["無阻人生",["一鍵優化","逃避掙扎"]],["AI牧者",["繞過認罪","繞過和解"]],["五項建議",["先讀經","先禱告","尋求牧養","明確邊界","公開討論"]]]},"fw":[["現象","AI進入屬靈生活"],["論點","錯誤塑造比錯誤資訊更可怕"],["危險一","注意力的萎縮"],["危險二","期待無阻人生"],["危險三","依賴AI作牧者"],["建議","給牧者的五條原則"]],"q":["AI不僅在提供答案，它更是在訓練我們的直覺。","聖經所說的屬靈成長，從來不在於快速得到正確答案。","AI只能提供資訊，卻給不了真正的屬靈智慧。"],"fb":{"h":"AI最危險的，\n不是答錯，而是改變了你。","t":"你有沒有這樣做過？\n打開聖經，還沒開始讀，就先請AI幫你摘要這一章；\n聽完講道，請AI列出五點應用；\n心裡焦慮，先問聊天機器人該怎麼辦。\n\nAI給的答案，也許完全正確，\n甚至還附上了經文。\n那問題在哪裡？\n\n一位長老說了一句很深刻的話：\nAI的危險，不只是錯誤的資訊，\n而是錯誤的塑造。\n\n真正的問題，不是它說了什麼，\n而是長期依賴它，會把我們變成什麼樣的人。\n\n聖經裡的屬靈成長，\n從來不是「快速得到正確答案」。\n它是一個緩慢的過程：\n聖靈透過讀經、禱告、教會這些平凡的恩典，\n一點一點把我們塑造成基督的樣式。\n\nAI的誘惑，是讓我們在這條路上抄捷徑。\n\n第一個危險：注意力萎縮。\n神的話不是讓我們看重點就夠了，\n而是要聽、要讀、要默想、要遵行。\n當我們習慣先看摘要，\n就會失去在經文前停留、掙扎、禱告的能力。\n專注，就像肌肉，\n不用，就會萎縮。\n\n第二個危險：期待一個沒有阻力的屬靈生活。\nAI讓我們以為快就是好、掙扎就是錯。\n於是我們想要一份為自己量身定做的靈修計劃，\n甚至在人生重大抉擇時，向AI要一個明確答案。\n但神塑造祂的百姓，\n常常是透過等候、掙扎、看似沒效率的順服。\n那些阻力，不是要被繞過的障礙，\n而是在信心中經歷神的地方。\n\n第三個危險：把AI當成牧者。\n焦慮的時候問AI，不向人認罪；\n被教會傷害時問AI誰對誰錯，不去和對方面談；\n懷疑自己得救時問AI，不讓肢體介入陪伴。\n即使AI說得都對，\n它也在悄悄訓練我們——\n用演算法，取代神透過聖道、聖靈和祂的子民賜下的恩典。\n\n這裡有一個哲學命題：\n得到正確的答案，和成為一個成熟的人，\n是同一件事嗎？\n\n顯然不是。\n一個人可以知道所有正確答案，\n卻從未被神的話改變過。\n\n所以，也許我們可以這樣開始：\n先讀經，再提問；\n先禱告，再搜尋；\n人生重大的事，找一位真實的牧者或肢體；\n記得AI只能給資訊，給不了智慧，\n更沒有任何屬靈的權柄。\n\n認知的翻轉是這樣的：\n我們以為AI幫我們節省了時間，\n其實它可能正在偷走那些\n本該用來與神相遇的時間。\n\n今天，關掉那個對話框，\n翻開聖經，\n慢慢地讀一段。\n讀不懂也沒關係，\n停在那裡，\n禱告。\n\n因為神要給你的，\n從來不只是答案，\n而是祂自己。\n\n#AI #屬靈塑造 #讀經 #禱告 #門徒"}},{"id":22233,"slug":"christlike-work-burnout-society","title":"倦怠社會中的職場聖徒","date":"2026-04-06","author":"Kyle Tucker","cats":["信仰与工作"],"tags":["知足","工作神學","敬業"],"sum":"「工作正在榨乾我的靈魂。」韓炳哲說，現代人成了自我剝削的「功績主體」，對成就上癮帶來情感耗竭；職場充滿升職無望的羞愧、薪水微薄的不滿、瑣碎工作的倦怠與「這有什麼價值」的懷疑。作者以帖前4:9–12提出另一種工作神學。一、工作是神聖之愛的延伸：保羅勸弟兄相愛「更加勉勵」，並責備遊手好閒的人；美國人信奉「工作至上主義」，期望職業滿足財務、社交、意義與自我價值，但聖經說神先愛我們、親自作工（建築師、醫生、牧人、園丁），我們在工作中追求他人福祉，就成為神更新世界的代理人。二、寧靜的志向：「立志作安靜人，辦自己的事，親手做工」，顛覆無止境比較的美國夢；不再眼紅同事、不再渴求老闆認可，就能在平凡崗位上忠心。三、使命人生：「向外人行事端正」，塞耶斯說信仰對木匠的首要要求是做出好桌子；早期教會藉工作觀建立醫院、人權與救濟制度。最後，基督再來將撫平一切傷痛，十字架擔當了我們的羞恥、驕傲、過勞與懶惰——我們不是為了身份而工作，而是因已有的身份而工作。","pts":["現代人成了自我剝削的功績主體","對成就上癮導致情感耗竭","工作是神聖之愛的延伸","工作至上主義讓職業承擔太多","神自己就是辛勤作工的神","立志作安靜人，顛覆比較的文化","在平凡崗位上忠心就是滿足","好的工作本身就是見證","不是為身份而工作，而是因身份而工作"],"mm":{"c":"倦怠社會中的職場聖徒","b":[["診斷",["功績主體","自我剝削","工作至上"]],["神聖之愛",["弟兄相愛","神作工","更新世界"]],["寧靜志向",["作安靜人","辦自己的事","不比較"]],["使命人生",["行事端正","好桌子","早期教會"]],["盼望",["主再來","十字架擔當"]],["身份",["因身份而工作"]]]},"fw":[["處境","工作榨乾靈魂"],["經文","帖前4:9–12"],["一","工作是愛的延伸"],["二","寧靜的志向"],["三","使命人生"],["盼望","更新的應許"]],"q":["我們無需為了尋求身份而工作，而是因著已擁有的身份去工作。","信仰對木匠的首要要求，就是讓他做出一張好桌子。","立志作安靜人，辦自己的事，親手做工。"],"fb":{"h":"不是為了身份而工作，\n而是因著身份去工作。","t":"「我覺得工作正在榨乾我的靈魂。」\n這句話，也許你也說過。\n\n哲學家韓炳哲說，現代人成了「功績主體」：\n沒有人逼我們，我們卻不停地逼自己；\n我們必須不斷超越自己，\n於是，我們成了一個自願自我剝削的社會。\n\n職場上，到處是疲憊的人：\n為升職無望而羞愧，\n為薪水微薄而不滿，\n在瑣碎的工作裡消磨熱情，\n夜深時問自己：我做這些，到底有什麼意義？\n\n兩千年前，保羅寫給帖撒羅尼迦教會的一段話，\n提供了另一種工作的眼光。\n\n第一，工作是愛的延伸。\n有人說，現代人信奉一種宗教：工作至上主義。\n我們期待工作給我們一切——\n安全感、朋友、意義、自我價值。\n難怪我們這麼累，\n因為我們要一份工作扛起整個人生的重量。\n\n聖經卻說，神先愛了我們，\n而且神自己就是一位工作的神：\n祂是建造者，是醫生，是牧人，是園丁，\n一直帶著愛在作工。\n當我們在工作中照顧弱者、提攜後輩、\n甚至在孩子哭鬧時仍然溫柔，\n我們就在參與神更新世界的工作。\n\n第二，寧靜的志向。\n保羅說：「要立志作安靜人，辦自己的事，親手做工。」\n「立志」和「安靜」放在一起，\n本身就是對成功學的顛覆。\n現代職場是一場永無止境的比較：\n賺得比人多，爬得比人快，\n滑著別人的升遷消息，心裡越來越焦慮。\n但當你不再眼紅同事、不再苦求認可，\n你會得到一種自由——\n謙卑地接受神交給你的這份工作，\n並且在平凡中忠心。\n\n第三，使命的人生。\n保羅說，這樣的人能「向外人行事端正」。\n一位作家說得好：\n信仰對一位木匠的首要要求，\n就是讓他做出一張好桌子。\n好好工作，本身就是見證。\n早期的基督徒，正是用這樣的工作觀，\n建立了醫院、救濟窮人，\n悄悄改變了整個羅馬帝國。\n\n這裡有一個核心的翻轉：\n世界說，你做什麼，決定你是誰；\n福音說，你是誰，決定你怎麼做。\n世界說，要靠工作證明自己；\n福音說，你已經被證明了——\n在十字架上，基督擔當了你的羞恥、驕傲、過勞與懶惰。\n\n所以，你不是為了得到身份而工作，\n而是因著已經擁有的身份去工作。\n\n工作依然會累，依然有荊棘蒺藜。\n但有一天，基督要再來，\n撫平一切的傷痛，\n讓一切歸正。\n\n明天早上，當你又坐回那張辦公桌，\n不妨輕聲提醒自己：\n我在這裡，\n不是為了被看見，\n而是因為\n我已經被愛了。\n\n#工作神學 #倦怠 #職場信仰 #身份 #帖撒羅尼迦前書"}},{"id":22229,"slug":"the-merciful-gift-of-prophesied-justification-isaiah-53-in-romans","title":"預言中稱義的恩慈","date":"2026-04-05","author":"Matt Fraser","cats":["圣经与神学"],"tags":["稱義","救贖","預言","因信稱義","確據"],"sum":"如果被問到配偶是否忠誠、父母是否愛自己，回答「應該吧」，關係必定出了問題；我們與神的關係也是如此，若對神的心意沒有篤定把握，就難以真正認識祂。作者指出，基督之死是舊約應許的核心，耶穌自己也確信彌賽亞必須受死。以賽亞書40–66章以安慰與救贖為前景，以色列作為僕人失敗了，於是出現一位不尋常的僕人；52:13–53:12是巔峰：「有許多人因認識我的義僕得稱為義，並且他要擔當他們的罪孽」——這是舊約唯一預言不敬虔之人藉受膏者捨命而稱義的經文。保羅在羅馬書中處處呼應：4:25「被交給人，是為我們的過犯」對應七十士譯本賽53:6、12；8:3「作了贖罪祭」對應賽53:10；8:33「誰能控告」呼應賽50:8；3:21–26的稱義、挽回祭、白白的救贖、信心、外邦人被接納，都與賽53高度對應。因此稱義不是後期發展或邊緣教義，而是神早已預言的計劃。這帶來確據：神向僕人掩面，好以永遠的慈愛憐恤我們；稱義使我們確知天父的心腸，成為喜樂的兒女。","pts":["對愛的懷疑會使關係枯萎","不確定神的心意，就難以認識祂","基督之死是舊約應許的核心","以賽亞書53章預言不敬虔者藉僕人之死稱義","羅馬書4:25、8:3、8:33都呼應以賽亞書","羅馬書3:21–26與以賽亞書53章高度對應","稱義不是後期或邊緣的教義","神向僕人掩面，為要憐恤我們","稱義使我們確知自己是蒙愛的兒女"],"mm":{"c":"預言中的稱義","b":[["問題",["懷疑的關係","缺乏確據"]],["以賽亞書",["失敗的以色列","受苦的僕人","賽53:11"]],["羅馬書呼應",["4:25","8:3","8:33","3:21–26"]],["意義",["非後期教義","神永恆的計劃"]],["確據",["加爾文","神向僕人掩面","賽54:8"]],["兒子身份",["巴刻","喜樂的兒女"]]]},"fw":[["問題","懷疑讓關係枯萎"],["預言","耶和華的僕人"],["應驗","羅馬書中的稱義"],["核心","羅3:21–26"],["恩賜","確知天父的愛"]],"q":["神向那一位僕人掩面，是為了讓我們確信祂的憐恤。","除非確定神對我們的心意，否則我們無法信靠祂。","基督徒就是以神為父的人。"],"fb":{"h":"祂向那一位掩面，\n好讓我們確知被愛。","t":"如果你問一個人：「你的另一半對你忠心嗎？」\n他回答：「應該……是吧。」\n你會知道，這段婚姻出了問題。\n\n如果你問一個孩子：「爸爸媽媽愛你嗎？」\n他回答：「大概吧。」\n你會心疼，這個孩子心裡一定很不安。\n\n有些關係，\n只要對愛沒有把握，\n就會慢慢枯萎。\n\n我們和神的關係，也是如此。\n如果我們不確定神怎麼看我們、對我們是什麼心意，\n就很難真正信靠祂、親近祂。\n\n那麼，我們能確定嗎？\n\n兩千七百年前，先知以賽亞寫下了一段奇特的預言。\n以色列一再失敗，\n神卻應許要興起一位不尋常的「僕人」。\n這位僕人被藐視、被厭棄，\n「他為我們的過犯受害，為我們的罪孽壓傷；\n因他受的刑罰，我們得平安；\n因他受的鞭傷，我們得醫治。」\n然後是那句驚人的話：\n「有許多人因認識我的義僕得稱為義，\n並且他要擔當他們的罪孽。」\n\n這是整本舊約中，唯一清楚預言：\n不敬虔的人，\n要因著神所膏立者的捨命，\n被稱為義。\n\n七百年後，保羅寫羅馬書時，\n字裡行間不斷回到這段預言：\n「耶穌被交給人，是為我們的過犯；\n復活，是為叫我們稱義。」\n「誰能控告神所揀選的人呢？有神稱他們為義了。」\n\n這裡有一個重要的命題：\n因信稱義，是後來教會發明的教義嗎？\n不是。\n它是神在保羅出生前好幾百年，\n就已經寫好的計劃。\n\n為什麼神要這麼早就說出來？\n因為神希望我們不必猜。\n加爾文說：\n除非我們確知神對我們的心意，否則我們無法信靠祂。\n\n以賽亞書裡有一個細節特別動人。\n神常常因人的罪而「掩面」。\n而那位僕人，被形容為「被人掩面不看的」。\n接著，神對祂的百姓說：\n「我的怒氣漲溢，頃刻之間向你掩面，\n卻要以永遠的慈愛憐恤你。」\n\n原來，神向那一位掩面，\n是為了不再向我們掩面。\n\n這是最深的認知翻轉：\n我們以為要先變好，神才會愛我們；\n其實神在我們還是罪人的時候，就已經為我們預備了救法。\n我們以為確據來自自己的感受，\n其實確據來自一個早已寫下、又已成就的應許。\n\n以賽亞書53章裡的「我們」，\n一開始藐視這位僕人，\n最後卻因明白了祂的死而歡呼。\n是什麼改變了他們？\n是他們終於看懂了：\n祂受的傷，是為我；\n祂的死，叫我活。\n\n所以，今天如果有人問你：\n「神愛你嗎？」\n你不必說「大概吧」。\n你可以指著十字架說：\n祂愛我，\n因為祂早就說了，\n也真的做了。\n\n#因信稱義 #以賽亞書53 #羅馬書 #確據 #神的愛"}},{"id":22203,"slug":"the-art-of-clear-teaching-and-preaching","title":"論清晰教導的藝術","date":"2026-04-04","author":"Murray Capill","cats":["教会事工"],"tags":["講道","教導","比喻","修辭"],"sum":"好的教師能化繁為簡——不是把真理打折成陳腔濫調，而是撥開雲霧，讓深奧的真理顯得清楚而美好。作者結合萊爾論講道簡明的文章與自身經驗，提出幾項功課：徹底弄清經文的意思，能用兩三分鐘講給孩子聽；圍繞一個「核心信息陳述」；建立清晰的框架，像掛鉤一樣掛上要點；為耳朵而非眼睛寫作——多用短句、重複、停頓，替聽眾劃重點；多講大白話，不炫耀學問；少引經據典與學術討論，自己消化後用自己的話說；效法耶穌善用比喻與日常畫面；具體接地氣，應用是清晰最好的幫手，例如神的護理如何面對被雨毀掉的郊遊或孩子的診斷書；有溫度、有人情味，像牧者與朋友談心，而不是會走路的神學詞典。這些恰恰與學術寫作規則相反，需要苦功與放下知識的傲氣，卻是服事神託付之人的最好方式。","pts":["真正高明的教師能化繁為簡","簡練不等於淺薄","自己先弄懂，別人才能聽懂","圍繞一個核心信息","用清楚的框架承載要點","為耳朵而寫：短句、重複、停頓","多講大白話，少用術語與引文","效法耶穌善用比喻與畫面","應用是清晰最好的幫手","清晰的教導需要放下知識的傲氣"],"mm":{"c":"清晰教導的藝術","b":[["理解",["弄清經文","講給孩子聽"]],["結構",["核心信息","清晰框架"]],["表達",["為耳朵而寫","短句重複停頓","大白話"]],["素材",["少引經據典","比喻與畫面"]],["落地",["具體應用","神的護理"]],["溫度",["牧者與朋友","不是神學詞典"]]]},"fw":[["引子","化繁為簡的本事"],["一","弄清經文"],["二","一個核心"],["三","清楚框架"],["四","為耳朵而寫"],["五","大白話與比喻"],["六","具體與溫度"],["結論","放下傲氣的愛"]],"q":["如果你自己都糊里糊塗，就絕不可能讓別人聽得明白。","簡而不凡，需要下苦功。","要以牧者和朋友的身份說話，而不是一本會走路的神學詞典。"],"fb":{"h":"把深奧說簡單，\n是最難的功夫。","t":"有些人有一種本事，\n能把簡單的事情說得很複雜。\n\n有些人更厲害，\n能把複雜的事情說得更複雜。\n\n而真正好的老師，\n是把深奧的真理，說得讓人一聽就懂，\n聽完還覺得：「原來這麼美！」\n\n這不是把真理稀釋成幾句口號，\n而是撥開雲霧，讓人看見山的全貌。\n\n一位教講道的老師，整理了幾個讓教導變清楚的功課。\n無論你是講道、帶查經、主日學，還是在家裡和孩子分享，\n都用得上。\n\n第一，自己先弄懂。\n如果你自己都糊里糊塗，別人不可能聽明白。\n試試看：能不能用兩分鐘，把這段經文講給一個孩子聽？\n\n第二，只講一件事。\n經文裡有許多寶藏，\n但一篇信息，需要一個清楚的核心。\n用一句話說出來：今天，我到底想讓大家帶走什麼？\n\n第三，為耳朵而寫，不是為眼睛而寫。\n讀者可以翻回前一頁，聽眾不行。\n所以要多用短句。\n要學會重複。\n要懂得停頓。\n\n第四，說大白話。\n聽眾若要查字典才聽得懂，\n你就是用學問換掉了清楚。\n\n第五，少引經據典。\n東一句名言，西一個學派，八種解釋擺一排，\n聽眾只會迷路。\n你要先自己消化，再用自己的話說出來。\n\n第六，學耶穌講故事。\n農夫、漁網、葡萄樹、飛鳥、婚宴——\n祂讓真理穿上了生活的衣服。\n\n第七，具體、落地。\n「神的護理」聽起來很抽象，\n但當它碰到一場毀掉郊遊的大雨、\n一個意外的傳福音機會、\n一張讓人心碎的診斷書時，\n它就活過來了。\n\n第八，有溫度。\n讓人感覺你在乎他們，\n你是在面對面談心，\n而不是對著後牆背講稿；\n你是一位牧者、一位朋友，\n而不是一本會走路的神學辭典。\n\n這裡有一個有趣的翻轉：\n這些原則，幾乎和學術寫作的規則完全相反。\n學校教我們成為嚴謹的學者，\n講台卻需要我們成為清楚的溝通者；\n有時，我們甚至得忘掉一些學來的條條框框。\n\n簡單，不等於淺薄；\n清楚，需要苦功。\n它要花時間、花力氣，\n還要放下一點知識的驕傲。\n\n但這正是愛的表現。\n因為當你把真理講清楚，\n你不是在展示自己有多聰明，\n而是在幫一個人看見——\n我們的神何等美善，\n祂的話語何等豐盛。\n\n#講道 #教導 #查經 #溝通 #服事"}},{"id":22201,"slug":"four-types-of-questions-not-to-ask-in-your-small-group-bible-study","title":"小組查經，別問這四種問題","date":"2026-04-04","author":"Melissa Kruger","cats":["教会事工"],"tags":["小組","查經"],"sum":"作者曾是高中老師，發現學生從提問中學到的不比講解少；提問迫使人分析、整合、評估，並把理解說出口。小組查經是否有生命力，往往不在帶領者懂多少，而在怎麼提問。她列出四種會讓討論冷場的問題：一、顯而易見型——答案明擺在經文裡，沒人想說，例如「保羅在腓立比與哪三人互動？」不如問三人的職業、國籍、地位有何異同；二、一字千金型——答案只是是或否、神或耶穌，例如「你身邊有覺得不可能信主的人嗎？」不如問我們通常覺得哪類人不會接受福音、這如何影響我們與他們相處；三、天書難題型——多數人答不上的背景知識，不如先介紹背景，再問與今日的異同；四、資訊過載型——在信任不足時逼人暴露太多，尤其在男女混合小組，如問「你在性方面有什麼掙扎」，不如籠統地問教會可以建立哪些習慣彼此抵擋試探，並為私下分享留空間。剔除這四類，是邁向好問題的第一步。","pts":["提問能讓人更深地學習","小組的生命力在於如何提問","避免答案顯而易見的問題","避免只能回答是或否的問題","避免多數人答不上的難題","先提供背景，再邀請比較","避免逼人過度暴露的問題","用籠統的應用題保護分享空間","好問題需要時間琢磨"],"mm":{"c":"小組查經別問的四種題","b":[["原理",["提問勝過講解","布魯姆分類法"]],["顯而易見型",["答案明擺","改問異同"]],["一字千金型",["是或否","改問原因與影響"]],["天書難題型",["背景知識","先介紹再比較"]],["資訊過載型",["信任不足","籠統應用","私下分享"]]]},"fw":[["經驗","教師的發現"],["問題","冷場的小組"],["一","顯而易見型"],["二","一字千金型"],["三","天書難題型"],["四","資訊過載型"],["下一步","設計好問題"]],"q":["一個小組是否有生命力，往往不在於帶領者懂得多少，而在於他怎麼提問。","當人遇到一個問題而不是一個答案時，大腦的專注度完全不同。","剔除壞問題，是邁向好問題的第一步。"],"fb":{"h":"好的小組，\n不是答案很多，而是問題很好。","t":"你帶過小組查經嗎？\n\n你可能經歷過這樣的時刻：\n你預備得很認真，查了背景、讀了註釋，\n結果一個問題拋出去——\n全場安靜。\n有人低頭看經文，有人假裝喝水，\n空氣凝結了十秒鐘。\n\n一位當過高中老師的姊妹說：\n小組有沒有生命力，往往不在帶領者懂多少，\n而在他怎麼問問題。\n\n因為講解，只是讓人聽懂；\n提問，卻是讓人思考。\n當人聽到一個答案，大腦可以休息；\n當人遇到一個問題，大腦會醒過來。\n\n她提醒我們，有四種問題，是「話題終結者」。\n\n第一種：顯而易見型。\n「保羅在腓立比遇見了哪三個人？」\n答案就寫在經文裡，大家都看得到，\n反而沒人想開口。\n不如問：「這三個人的職業、背景、身份有什麼不同？\n神同時拯救了他們，這說明了什麼？」\n\n第二種：一字千金型。\n答案只有「是」或「不是」、「神」或「耶穌」。\n「你身邊有沒有覺得不可能信主的人？」\n——有。\n然後呢？\n不如問：「我們通常覺得哪一類人不會接受福音？\n這種想法，會怎樣影響我們對待他們？」\n\n第三種：天書難題型。\n「一世紀腓立比的文化背景是什麼？」\n組裡多半沒有考古學家。\n不如先由你介紹背景，\n再問：「他們的處境和我們今天，有什麼相似和不同？」\n\n第四種：資訊過載型。\n在信任還不夠的時候，\n逼人當眾交代最私密的掙扎。\n結果不是尷尬的沉默，\n就是一段收不回來、也不該公開的分享。\n不如籠統一點：\n「很多人在這方面有試探，\n我們可以建立哪些習慣，彼此幫助？」\n然後，為私下一對一的分享留一扇門。\n\n這裡有一個值得深思的翻轉：\n我們以為好的帶領者是最會講的人，\n其實好的帶領者，是最會問的人；\n我們以為冷場是因為組員不投入，\n其實很多時候，是問題本身關上了門。\n\n耶穌也很會問問題。\n「你們說我是誰？」\n「你要我為你做什麼？」\n「你愛我嗎？」\n一個好問題，可以讓人第一次看見自己，\n也第一次看見祂。\n\n所以下次預備查經時，\n除了問「我要講什麼」，\n也問問自己：\n「我要問什麼，\n才能讓大家一起，\n更靠近這段經文，\n也更靠近彼此？」\n\n#小組查經 #帶領 #提問 #門徒訓練 #教會生活"}},{"id":22199,"slug":"medical-groups-opposing-gender-surgies-minors","title":"爲什麼美國醫療機構反對爲未成年人實施變性手術？","date":"2026-04-02","author":"Joe Carter","cats":["社会与时事"],"tags":["美國","醫學","變性"],"sum":"美國醫學協會與美國整形外科醫師學會相繼建議，未成年人的性別相關手術應延後至成年；後者更建議延到19歲以後，理由是風險收益的證據不足、確定性低，並受英國卡斯審查報告與美國衛生部報告影響。推動轉變的因素還包括：一名16歲時接受雙乳切除的女性獲賠200萬美元，至少27州立法禁止，最高法院維持田納西州限制。2016至2020年間，美國12至18歲患者共接受3678例此類手術。卡特提醒基督徒避免勝利主義（「醫學終於追上聖經」）與憤世嫉俗（「只是怕訴訟」），而要思考：社會重新發現被壓制的真理意味著什麼？羅馬書1章描繪從認識、壓抑到混亂的過程，神「任憑」錯誤的邏輯自證其非；箴18:1說獨居者違背一切明哲，性別醫學正是在封閉生態中運作。這不是道德復興，而是生物現實的檢驗。仍需警醒：意識形態未變，青春期阻斷劑與激素仍被推薦；但現實有耐心，身體的見證不會永遠沉默。","pts":["兩大醫學組織建議延後未成年人變性手術","理由是證據不足與確定性低","訴訟、州法與政策共同推動轉變","避免勝利主義，也避免憤世嫉俗","羅馬書1章：從認識到壓抑再到混亂","神任憑錯誤的邏輯自證其非","封閉的醫療生態違背明哲","這是生物現實的檢驗","意識形態未變，仍需警醒","身體的見證不會永遠沉默"],"mm":{"c":"醫學界轉向","b":[["新聞",["AMA建議","ASPS建議","延至成年"]],["推動因素",["卡斯報告","訴訟賠償","州法禁令"]],["兩種誘惑",["勝利主義","憤世嫉俗"]],["聖經視角",["羅1:21–28","箴18:1"]],["現實檢驗",["併發症","悔恨","訴訟"]],["警醒",["阻斷劑仍在","現實有耐心"]]]},"fw":[["新聞","醫學組織的新立場"],["背景","推動轉變的力量"],["回應","避免兩種極端"],["聖經","真理被壓制又重現"],["提醒","感恩與警醒"]],"q":["醫學體制撞上了神在創造秩序中設定的防護欄。","這與其說是道德復興，不如說是生物學帶來的現實檢驗。","身體的見證，無論被壓制多久，都不會永遠沉默。"],"fb":{"h":"真理可以被壓制很久，\n但身體不會永遠沉默。","t":"幾年前，主流醫學界還在說：\n為性別焦慮的青少年做手術，是幫助他們身心一致、改善心理健康的方法。\n誰質疑，誰就是不科學、不包容。\n\n最近，美國醫學協會和美國整形外科醫師學會相繼改口：\n未成年人的性別手術，應該延到成年以後再考慮。\n理由很簡單：\n證據不足，風險不明，確定性很低。\n\n是什麼讓立場轉變？\n英國的大型審查報告，\n美國衛生部的研究結論，\n一位十六歲時切除雙乳的女性提告獲賠兩百萬，\n二十多個州的立法，\n還有最高法院的判決。\n\n面對這樣的新聞，基督徒很容易有兩種反應。\n\n一種是勝利主義：\n「早就說了吧！醫學終於追上聖經了！」\n\n另一種是憤世嫉俗：\n「他們只是怕被告，怕失去資金，本質一點也沒變。」\n\n兩種說法都有道理，\n但也許還有一個更深、更合乎聖經的問題：\n當一個社會重新發現曾經被壓制的真理，\n這意味著什麼？\n\n保羅在羅馬書第一章描繪了一個過程：\n人明明知道神，卻不榮耀祂，\n於是思念變為虛妄，無知的心就昏暗了。\n從認識，到壓抑，再到混亂。\n而神的回應，是三次重複的「任憑」——\n讓錯誤的邏輯，自己走到盡頭，\n直到後果再也藏不住。\n\n今天我們看見的，\n也許不是一場道德復興，\n而是一場現實的檢驗。\n併發症、悔恨、訴訟——\n當意識形態被放在孩子的福祉之上，\n這些後果遲早會出現。\n醫學撞上了神在創造秩序裡設下的護欄。\n\n箴言說：「獨居的，自尋所欲；他違背一切的明哲。」\n當一個領域被關在封閉的回音室裡，\n只聽得見同樣的聲音，\n它就會漸漸偏離現實。\n\n但我們仍需要清醒。\n意識形態並沒有改變；\n青春期阻斷劑與跨性別荷爾蒙，仍被許多機構推薦給未成年人。\n戰場沒有結束，只是轉移了。\n\n更重要的是，\n在這些數字與判決背後，\n有成千上萬真實的孩子，\n正在困惑、痛苦、尋找自己是誰。\n他們需要的不是被當作議題，\n而是被溫柔地陪伴，\n被給予時間長大，\n而不是被推上一張無法回頭的手術台。\n\n這裡有一個安靜的盼望：\n真理有時候被壓制很久，\n但現實很有耐心。\n每多一年缺乏長期證據，\n真相就多一年滲進人心。\n\n我們事奉的神，創造了這個世界，\n也讓這個世界為祂作見證。\n而身體的見證，\n無論被壓制多久，\n都不會\n永遠沉默。\n\n#醫學倫理 #性別議題 #孩子 #真理 #創造秩序"}},{"id":22196,"slug":"china-persecuted-christians-marginalized","title":"中國受逼迫的基督徒反而關懷了邊緣群體","date":"2026-04-02","author":"E. F. Gregory","cats":["社会与时事"],"tags":["福音","教會","逼迫","中國"],"sum":"「誰是我的鄰舍？」中國某大城市一位家庭教會牧師問的是：「我的鄰舍在哪裡？」答案是聚會大樓隔壁的醫院。他開始探訪，其他信徒加入，如今團隊在醫院從事臨終關懷：禱告、唱歌、清理嘔吐物、握病人的手——儘管家庭教會本屬非法。作者在支持中國家庭教會的機構製作播客，訪談了許多服事病患、救助棄嬰、深入紅燈區的信徒；他們並不富裕，許多人受逼迫、被邊緣化，有些還因服事對象而承受額外污名。家庭教會牧師們討論憐憫神學：王牧師說耶穌是神憐憫的化身，冷漠才是憐憫的反面；劉牧師說憐憫是整個教會在公共領域彰顯神對全城的愛；黃牧師說憐憫如同老信徒的見證，即使沒機會講出福音，本身就散發基督的馨香，並提到宣教士建立的醫院與學校留下深遠影響。源於基督之愛的憐憫帶來自由：不必期待特定結果，不像宗教式行善那樣「不做就內疚、做了就自義」，因扎根於基督已成之工而有安息，可以一個接一個地陪伴受苦的人。","pts":["受逼迫的家庭教會在醫院做臨終關懷","「我的鄰舍在哪裡？」——就在隔壁","中國信徒服事病患、棄嬰與紅燈區婦女","他們沒有資源，卻持續付出","冷漠才是憐憫的反面","憐憫是教會在公共領域彰顯神的愛","憐憫本身就是福音的見證","宣教士留下的醫院與學校至今影響深遠","源於基督的憐憫不必期待結果","扎根於基督已成之工，才有安息"],"mm":{"c":"中國教會的憐憫事工","b":[["故事",["隔壁的醫院","臨終關懷","非法卻被默許"]],["服事",["病患","棄嬰","紅燈區"]],["憐憫神學",["冷漠的反面","全城的憐憫","見證的芬芳"]],["傳承",["宣教士","醫院學校"]],["自由",["不求結果","非宗教行善","安息"]],["實踐",["一個接一個陪伴"]]]},"fw":[["提問","我的鄰舍在哪裡"],["故事","醫院裡的臨終關懷"],["群像","受逼迫者的服事"],["神學","三種憐憫觀"],["自由","源於基督的憐憫"]],"q":["冷漠，才是憐憫的對立面。","他們的故事本身，就散發著基督的芬芳。","福音裡蘊藏著深厚的安全感——我們稱之為安息。"],"fb":{"h":"他們一無所有，\n卻擁有基督。","t":"一位中國家庭教會的牧師，問了一個問題。\n不是「誰是我的鄰舍」，\n而是「我的鄰舍在哪裡」？\n\n答案很近：\n就在他們聚會的大樓隔壁，有一家醫院。\n\n他開始去探訪。\n後來，越來越多弟兄姊妹加入。\n如今，他們在那家醫院做臨終關懷：\n為病人禱告、唱詩，\n清理嘔吐物，\n握住一隻瘦弱的手，\n輕輕撫摸一個將死之人的頭髮。\n\n而他們的教會，在法律上是不被允許存在的。\n任何一項事工，都可能帶來麻煩。\n\n這不是唯一的故事。\n有人照顧病患，\n有人救助被遺棄的嬰兒，\n有一群姊妹走進紅燈區，陪伴那些被看輕的女人。\n他們沒有充裕的時間，沒有豐沛的資源，\n很多人正在受逼迫，\n所有人都因信仰被邊緣化。\n\n這裡有一個讓人震撼的問題：\n自己都那麼脆弱，\n為什麼還要去服事別人？\n\n幾位家庭教會的牧師，曾經一起討論什麼是憐憫。\n\n一位說：耶穌就是神憐憫的化身。\n憐憫的反面，不是殘忍，\n而是冷漠。\n\n另一位說：憐憫不只是個人的善行，\n而是神對整座城所有人的慈愛，\n教會要在公共場域活出來。\n\n第三位說：憐憫就像那些經歷過逼迫的老信徒的見證——\n他們不必在故事最後刻意提到基督，\n因為整個故事，\n本身就散發著基督的芬芳。\n即使沒有機會開口傳福音，\n憐憫本身，就是福音。\n\n他還說了一段很深的話：\n沒有福音根基的行善，\n很容易變成驕傲或自卑——\n「不做就內疚，做了又自以為義。」\n但出於基督之愛的憐憫，\n不必看結果，\n不必證明什麼，\n不像那位救了許多人卻終生痛苦、總覺得自己做得不夠的人。\n因為一切的根基，是基督已經成就的工作。\n在那裡，有安息。\n\n這是一個深刻的翻轉：\n我們以為要先有資源，才能服事；\n他們卻證明，只要有基督，就能付出。\n我們以為要做大事，才算改變社會；\n他們卻選擇，一個一個地陪伴。\n\n他們沒有錢，\n沒有權勢，\n沒有自由。\n但他們有基督。\n\n而當一個人真正擁有基督，\n他就有能力，\n走進醫院、走進紅燈區、走進別人最黑暗的時刻，\n帶著一份\n不求回報、\n也不會枯竭的\n愛。\n\n#中國教會 #憐憫 #逼迫 #臨終關懷 #愛鄰舍"}},{"id":22178,"slug":"tgc-manifesto-prioritize-church","title":"福音聯盟宣言：當以你的教會爲先！","date":"2026-04-02","author":"Brett McCracken","cats":["基督徒生活"],"tags":["地方教會","宣言"],"sum":"每天我們在螢幕前做成百上千個選擇，福音聯盟也是其中一個聲音；但麥克拉肯說，有一件事比點擊任何內容都重要：委身於一間教會。福音聯盟存在是為了服事教會，不是取代教會——主日上午別刷網站，去教會。我們的時間花在哪裡，靈命就被塑造成什麼樣；在網路同溫層裡打轉的基督徒，會漸漸對聖經與教會失去興趣，陷入數位世界的自我欺騙。品格操練、群體建造、愛仇敵、行公義、敬拜的榮耀、牧養的陪伴、真實的認罪——網路都比不上教會。教會不完美，甚至讓人不舒服，就像輸液的針，那份不適是生命線：在混亂中幫我們找方向、在黨派對立中拆毀隔牆、在虛擬中把我們帶回現實、在轉瞬即逝中把我們連於永恆的故事。網上看世界像要崩塌，回到教會，卻置身於世上唯一永不倒塌的機構——路易斯說教會將比宇宙更長久，耶穌應許陰間權柄不能勝過她。福音聯盟只是教會的拉拉隊與後勤補給線；請把你的生命交給一間教會。","pts":["委身教會比點擊任何內容都重要","福音聯盟服事教會，不取代教會","時間花在哪裡，靈命就被塑造成什麼樣","網路同溫層會讓靈命跑偏","品格、群體、敬拜與牧養都在教會中發生","教會不完美，但那份不適是生命線","教會把我們連於永恆的故事","教會是唯一永不倒塌的機構","請把你的生命交給一間教會"],"mm":{"c":"以教會為先","b":[["邀請",["委身一間教會","主日去教會"]],["塑造",["時間塑造靈命","網路同溫層"]],["教會勝過網路",["品格","群體","敬拜","牧養","認罪"]],["不容易",["不完美","輸液針的比喻"]],["教會的功能",["找方向","拆隔牆","回現實","連永恆"]],["永存",["路易斯","太16:18","拉拉隊與補給線"]]]},"fw":[["處境","無數的選擇"],["宣言","委身於一間教會"],["塑造","靈命在教會中成形"],["現實","這並不容易"],["盼望","教會將存到永遠"],["呼召","把生命交給教會"]],"q":["福音聯盟存在是為了服侍教會，不是為了取代教會。","教會將比宇宙更長久。","教會是耶穌建立的唯一機構，也是唯一一個以成功告終的機構。"],"fb":{"h":"網路可以餵你資訊，\n只有教會能把你養大。","t":"每一天，我們做出成百上千個選擇。\n看這支影片，讀這篇文章，聽這集播客，滑這則動態。\n\n一家每天產出大量屬靈內容的福音機構，\n卻說了一句讓人意外的話：\n「如果你主日早上有兩個小時，\n別花在我們的網站上，\n去教會吧。」\n\n他們說：我們存在是為了服事教會，\n不是為了取代教會。\n\n這裡有一個值得面對的命題：\n我們的時間花在哪裡，\n靈命就會被塑造成什麼樣子。\n\n如果你大部分時間在讀經、在教會裡和人一起生活，\n你的靈命會朝一個方向長；\n如果你大部分時間在滑短影音、逛論壇、看網路吵架，\n你的靈命會朝另一個方向長。\n\n在網路上待得越久，\n越容易被同溫層牽著走，\n越容易對聖經和教會失去胃口——\n因為它們和網路餵給我們的敘事對不上。\n\n請看這一組對比：\n論品格的操練，影片比不上教會；\n論群體的建立，論壇比不上教會；\n論愛仇敵，網路論戰比不上教會；\n論敬拜的榮耀，歌單比不上會眾同聲的頌讚；\n論牧養的陪伴，名牧的播客，\n比不上一位坐在你對面、認識你、在你最低谷時也不離開的牧者；\n論真實的認罪，\n再多讚的「真情分享」，\n也比不上在屬靈家人面前坦白的那一刻。\n\n你也許會說：「我的教會不是這樣。\n它讓我不舒服，它不懂我，它不是我成長最快的地方。」\n\n是的，教會不完美。\n它甚至會讓你不舒服。\n就像脫水時去醫院打點滴，\n針扎進去很痛，\n但那是你的生命線。\n\n在混亂中，教會幫你找方向；\n在對立中，教會拆毀隔斷的牆；\n在虛擬中，教會把你拉回真實；\n在轉瞬即逝裡，教會把你接回一個永恆的故事。\n\n認知的翻轉在這裡：\n在網路上待一小時，你會覺得全世界都快崩塌了；\n走進教會，你卻站在世上唯一一個不會倒的地方。\n\n路易斯說：教會將比宇宙更長久。\n耶穌說：陰間的權柄，不能勝過她。\n祂沒有應許任何一間大教會、任何一個機構會永遠存在，\n祂應許的是祂的教會。\n\n所有的機構都會結束，\n連那家寫下這篇宣言的福音機構也不例外。\n但教會不會。\n\n所以，今天的邀請很簡單：\n不要只做網路上的基督徒。\n去找一間你能找到最健康的教會，\n不要期待它完美，\n然後，\n委身進去，\n服事進去，\n和一群真實的人一起，\n慢慢長大。\n\n請把你的生命，\n交給一間教會。\n\n#地方教會 #委身 #數位時代 #門徒 #群體"}},{"id":22175,"slug":"care-divorced-people-church","title":"關愛教會中離婚人士的五種方式","date":"2026-04-02","author":"Linda Seabrook","cats":["基督徒生活"],"tags":["忍耐","離婚","單親家庭"],"sum":"二十年前的夏天，作者的丈夫離開了家，她的暑假變成搬家、找工作與笨拙地學做單親媽媽。離婚像一場沒有告別式的死亡：沒有人送飯、送花或卡片，只有悲傷、憤怒、壓力與羞恥。研究顯示近半數基督徒離婚後會離開原教會。她提出五種關愛方式：一、說話要慎重——不要繞道避開，共情而非急著解決，一句「遇到這種事我真難過」勝過陳腔濫調；不知道說什麼，就給擁抱、傾聽、禱告。二、分享聖經真理——羅馬書8章讓她重新看清身份：不被定罪、是神的兒女、聖靈代求、萬事互相效力、什麼都不能使我們與神的愛隔絕；身份由神定義，不由離婚定義。三、主動邀請——請單親家庭吃飯、出遊，節日特別記得他們；也給他們服事的機會。四、做好長期陪伴的準備——法律糾紛、監護權、孩子的人生大事都會拉長傷痛，二十年後仍有老朋友陪伴她。五、成為傳遞安慰的管道（林後1:3–5）。她第一次以單親媽媽身份回教會時哭了整場，但她繼續回去，因為教會是最有盼望的地方。","pts":["離婚像一場沒有告別式的死亡","近半數基督徒離婚後離開原教會","不要因怕說錯話而繞道走開","共情勝過急著解決問題","用神的話提醒他們在基督裡的身份","主動邀請單親家庭同桌吃飯","給他們服事的機會","長期陪伴需要耐心","教會是傳遞神安慰的管道"],"mm":{"c":"關愛離婚的肢體","b":[["經歷",["丈夫離開","沒有告別式","羞恥"]],["說話",["不要迴避","共情","擁抱傾聽"]],["真理",["羅馬書8章","身份由神定義"]],["邀請",["同桌吃飯","節日","服事機會"]],["長期陪伴",["法律與監護","人生大事","老朋友"]],["安慰",["林後1:3–5","教會是家"]]]},"fw":[["經歷","那個破碎的夏天"],["一","說話要慎重"],["二","分享聖經真理"],["三","主動發出邀請"],["四","長期陪伴"],["五","傳遞安慰"],["呼召","用基督的憐憫擁抱"]],"q":["離婚好像一場沒有告別儀式的死亡。","我們的身份由神來定義，而不是由離婚來定義。","讓一個離婚的人感受到教會的溫暖，往往只是多添一副碗筷的事。"],"fb":{"h":"離婚像一場\n沒有告別式的死亡。","t":"二十年前的那個夏天，她的丈夫離開了家。\n\n原本最愛的暑假，\n變成了搬家、找房子、找工作，\n和笨拙地學習當一個單親媽媽。\n\n她說，離婚很像一場死亡，\n卻沒有告別式。\n沒有人送飯，\n沒有人送花，\n沒有人寄一張安慰的卡片。\n陪著她的，只有悲傷，\n還有如影隨形的憤怒、壓力和羞恥。\n\n研究說，將近一半的基督徒，在離婚後離開了原本的教會。\n留下來的，也常常在關係和服事上一落千丈。\n\n這裡有一個需要教會正視的問題：\n為什麼一個人最需要群體的時候，\n反而最容易從群體中消失？\n\n她給了五個溫柔而實際的建議。\n\n第一，說話要慎重，但不要沉默。\n很多人不是冷漠，而是怕說錯話，\n乾脆繞道走開。\n其實，一句「遇到這種事，我真的很難過」，\n或是一句「想哭就哭吧」，\n比任何大道理都真誠。\n別說「過一陣子就好了」，\n也別急著幫人解決問題。\n真的不知道說什麼，\n一個擁抱、一份耐心的傾聽、一個默默的禱告，\n就夠了。\n\n第二，用神的話提醒她是誰。\n離婚很容易變成一個人的標籤。\n在她最黑暗的日子，羅馬書第八章扶住了她：\n婚姻失敗了，但她不被定罪；\n她是神的兒女；\n不知道怎麼禱告時，聖靈替她嘆息；\n萬事互相效力；\n沒有任何事，能使她與神的愛隔絕。\n她的身份，是神定義的，\n不是離婚定義的。\n\n第三，主動邀請。\n單親的父母常常覺得自己哪裡都融不進去，\n連在教會裡也是。\n請他們來家裡吃一頓便飯，\n帶他們一起去海邊、去露營，\n尤其是節日，孩子去了另一方家裡的時候。\n有時候，\n讓一個人感受到教會是家，\n只是多添一副碗筷的事。\n\n第四，準備好長期陪伴。\n離婚後的官司、監護、探視，會拖很久；\n孩子畢業、結婚、生孩子的那些日子，\n她仍然會覺得形單影隻。\n陪伴一個人走過，\n有時很枯燥，\n需要很多耐心。\n但二十年後，仍有幾位老朋友在她身邊。\n\n第五，成為安慰的管道。\n「我們在一切患難中，祂就安慰我們，\n叫我們能用神所賜的安慰，去安慰那遭各樣患難的人。」\n\n她第一次以單親媽媽的身份回到教會，\n唱詩時全程在哭，\n聽道時整個人麻木，\n祝福禱告一結束就衝出門口。\n但她每個禮拜都回去。\n因為她相信，教會是最有盼望的地方。\n\n後來她說：\n感謝主，我信對了。\n\n下次，如果有人對你說「我要離婚了」，\n請不要轉身。\n用基督的憐憫擁抱她，\n用一顆僕人的心陪她。\n這不容易，\n但這就是教會\n活成一家人的樣子。\n\n#離婚 #單親 #教會關懷 #陪伴 #安慰"}},{"id":22172,"slug":"the-revolutionary-traditionalist","title":"傳統，才是真正的革新","date":"2026-03-31","author":"Trevin Wax","cats":["文化与艺术"],"tags":["歸正","改革","傳統","革新"],"sum":"《愛樂之城》中，堅持純粹爵士的塞巴斯蒂安被樂團領袖問：「你這麼守舊，還怎麼當革新派？爵士樂是面向未來的！」許多基督徒思考教會未來時也覺得要二選一。但耶穌並非典型革命者：祂拒絕政治妥協、法利賽式假敬虔與狂熱派激進路線，走出第三條路——十字架；早期教會既摒棄已在基督裡成就的傳統，也把另一些傳統深化為信仰基石。今天在後基督教社會，有人主張要拯救傳統就得更新教導。瓦克斯反問：如果你只是重複時代共識，那算什麼革新？跟著所有人衝進未來迷霧有何刺激？也許堅守領受的真理才是真正的叛逆。他承認確實有「死板的正統」，把傳統當作不能碰的老教堂，任其破敗；也有激進修正主義，乾脆炸掉地基。革新型的傳統主義者兩者都拒絕：因為深愛這個家，所以粉刷牆面、加固地基、翻修內部——既有創意又守忠心，修繕並傳承福音那未受損的美。","pts":["革新與傳統常被當作二選一","耶穌走出了不同於當代的第三條路","重複時代共識，算不上革新","堅守真理可能才是真正的叛逆","死板的正統任由傳統破敗","激進修正主義炸掉地基","革新型傳統主義者修繕這個家","既有創意，又守忠心","把福音未受損的美傳給下一代"],"mm":{"c":"傳統才是真正的革新","b":[["愛樂之城",["塞巴斯蒂安","爵士的未來"]],["耶穌",["第三條路","十字架"]],["反思",["重複共識","堅守的叛逆"]],["死板正統",["博物館","任其破敗"]],["修正主義",["改得面目全非","炸掉地基"]],["革新型傳統",["修繕重建","創意與忠心","傳承"]]]},"fw":[["引子","愛樂之城的難題"],["歷史","革新成為傳統"],["反思","誰才是革新者"],["區分","活的傳統與死的正統"],["拒絕","博物館與翻新"],["道路","既創意又忠心"]],"q":["如果你的想法不過是在重複時代的共識，那還算什麼革新？","有沒有可能，那個堅守傳統的人，才是真正的革新者？","我們修繕這個家，不是因為它完美，而是因為我們深愛它。"],"fb":{"h":"在人人都想改變的時代，\n守住，才是真正的叛逆。","t":"電影《愛樂之城》裡，男主角是一個愛爵士樂愛到骨子裡的鋼琴手。\n他堅持要守護爵士的純粹，\n即使年輕人早就不聽了，\n即使這條路註定冷清。\n\n後來，一位樂團領袖邀他加入，\n用電子流行包裝爵士。\n看他猶豫，那人說了一句話：\n「你這麼守舊，還怎麼當革新派？\n爵士是面向未來的啊！」\n\n今天，很多基督徒思考教會的未來時，\n也覺得自己被逼在這兩條路之間：\n要嘛跟上時代，\n要嘛被時代淘汰。\n\n可是，請先問一個問題：\n如果你所謂的革新，\n只是在重複這個時代早已公認的共識，\n那它還算是革新嗎？\n\n跟著所有人一起衝進未來的迷霧，\n其實一點也不勇敢。\n\n反過來想：\n在一個人人都想改寫的時代，\n選擇守住所領受的真理，\n會不會才是真正的叛逆？\n\n當然，作者也誠實承認：\n確實有一種「死板的正統」。\n它把傳統當成一間不准碰的老教堂，\n不維修、不打理、不讓人進來，\n最後，牆會剝落，屋頂會塌。\n耶穌也曾嚴厲責備那些只守規條、不顧人心的人。\n\n但還有另一種錯誤，\n就是激進的修正主義。\n它覺得老房子太舊了，\n乾脆把地基炸掉，蓋一棟全新的。\n\n一個任由傳統自生自滅，\n一個把傳統改得面目全非。\n兩者看似相反，\n其實都放棄了那份活的遺產。\n\n作者提出第三條路：\n做一個「革新型的傳統主義者」。\n因為深愛這個家，\n所以既不炸掉地基，\n也不讓它荒廢；\n而是粉刷牆面、加固基礎、翻修內部——\n因為這個地方，是活的，\n有人正住在裡面。\n\n其實，耶穌自己就是這樣。\n祂既不是當時的政治妥協者，\n也不是假冒為善的宗教人，\n也不是激進的革命分子。\n祂走出了第三條路——\n一條通往十字架的路。\n\n電影最後，那位鋼琴手藉著長年模仿大師，\n終於真正掌握了這門藝術，\n能在不失本色的前提下，\n彈出屬於自己的聲音。\n他既有創意，\n又守忠心。\n\n這正是我們的呼召：\n不把福音鎖在博物館裡，\n也不把它改造成另一個東西；\n而是修繕它、守護它、活在其中，\n然後，把它那未曾受損的美，\n完整地交到下一代手上。\n\n在一個什麼都在變的世界，\n願我們成為\n最有創意的守護者。\n\n#傳統 #革新 #福音 #教會 #傳承"}},{"id":22170,"slug":"ai-cant-beat-learn-senses","title":"AI 無法取代我們在感官世界中習得的智慧","date":"2026-03-31","author":"Brett McCracken","cats":["文化与艺术"],"tags":["真實","媒體","人工智能","現實","AI","媒介"],"sum":"2020年3月疫情期間，作者常到戶外——玫瑰、
