,"哪些AI用途可以"],["使命","守護讀寫，服事未來教會"]],"q":["寫作是一種出於愛的勞作，而愛是AI做不到的。","當內容越來越廉價，帶著人性印記的文字就越珍貴。","聖書子民若不再閱讀，就難以聆聽神的話。"],"fb":null},{"id":23071,"slug":"low-tide-evangelism","title":"浪潮退去，契機湧現","date":"2026-08-19","author":"Glen Scrivener","cats":["圣经与神学","凯勒文化护教中心"],"tags":["無神論","復興","離教","人本主義"],"sum":"十九世紀詩人阿諾德在英國教會出席率巔峰時，已預感信仰的潮水正在退去；如今出席率從一半降到約5%，美國也有大量人離開教會。作者主張，除了禱告等候漲潮，退潮本身也是契機：它顯露出被海水塑造的地貌。漲潮時，傑斐遜等人以為人權「不言而喻」，其實背後是基督教前提；艾略特、尼采都看出抽掉信仰，人本主義也站不住。退潮讓人看見古老的異教回歸、基督教塑造文明的深遠印記，以及一條通往信仰的古道。作者描繪現代慕道者的七步路徑：發現自己也有信念、這些信念來自文化、西方由基督教故事塑造、察覺社會與自身的脫節、更相信這些價值而非無神敘事，最終被耶穌吸引。","pts":["信仰退潮從十九世紀就已開始","退潮也顯露出基督教塑造的地貌","人權不是不言而喻，而是源於聖經","抽掉對造物主的信仰，人本主義隨之崩塌","低潮顯露古老異教、文明印記與信仰古道","在低潮中信仰不再是隨大流，而是定意選擇","慕道者常走過的七個步驟","世俗化既是挑戰，也是機會"],"mm":{"c":"退潮中的契機","b":[["退潮",["出席率驟降","大離教","復興是否真實？"]],["漲潮的人本主義",["不言而喻的人權","艾略特","尼采"]],["低潮三景",["石化森林：異教回歸","沙洲：文明印記","古道：信仰之路"]],["七個臺階",["我有信念","信念來自文化","基督教塑造西方","社會與我的脫節","被耶穌吸引"]],["慕道者的顧慮",["超自然","虛偽感","功利"]]]},"fw":[["引言","阿諾德的多佛海灘"],["現況","西方的世俗化"],["視角","退潮揭示的真相"],["歷史","漲潮時代的人本主義"],["三景","低潮中的啟示"],["路徑","慕道者的七個步驟"],["結論","藉著低潮的復興"]],"q":["潮水退去，才看得見海水曾經塑造過的地貌。","人權之所以看似不言而喻，是因為背後站著《創世記》。","在退潮時代，信耶穌不再是隨波逐流，而是定意走上的路。"],"fb":null},{"id":23067,"slug":"ai-writing-the-day-of-reckoning","title":"AI 寫作會有反噬","date":"2026-08-18","author":"Collin Hansen","cats":["社会与时事"],"tags":["人性","人工智能","AI","寫作"],"sum":"作者回應外界對TGC AI政策的不同反應，承認基督徒在AI使用上良心領受不同，但堅持劃界。他設想一位十五歲高中生：學校教用AI、老師無法執行禁令、家長也不反對，他當然會用AI「寫」論文。作者以1990年代美國職棒的類固醇時代比喻：先用的人佔便宜，等人人都用，優勢消失，整體只被抬高一檔，連青少年也被迫跟進，健康與公正的代價日後才清算。AI寫作也將迎來清算：若電腦接管寫作，人類就會停止閱讀，下一代可能連情書、婚禮致詞都寫不出來。TGC不是反技術，而是維護人性。","pts":["基督徒對AI的界線可能不同","學校、家長與文化都推著學生用AI","AI訓練使用了未經許可的人類作品","若電腦接管寫作，人類將停止閱讀","人人都能輕鬆擊出全壘打，全壘打就失去價值","類固醇時代：優勢消失，代價日後清算","不反技術，而是拒絕把思想外包","為下一代留下充滿文字的世界"],"mm":{"c":"AI寫作的清算","b":[["十五歲的處境",["學校教AI","老師難執行","家長不反對"]],["各方反應",["支持與反對","良心不同"]],["隱憂",["AI訓練來源","人類停止閱讀","寫作貶值"]],["類固醇比喻",["先用者得利","人人都用","代價延後"]],["立場",["維護人性","不外包思想","道成肉身"]]]},"fw":[["情境","一位高中生的選擇"],["回應","對TGC政策的反響"],["問題","AI如何改變讀寫"],["比喻","職棒類固醇時代"],["結論","留給下一代一個有文字的世界"]],"q":["如果人人都能輕鬆擊出全壘打，全壘打還有什麼價值？","當電腦接管寫作，人類就會停止閱讀。","我們不是反對技術，而是拒絕把思想外包給機器。"],"fb":null},{"id":23064,"slug":"gifts-thin-place","title":"在這裡遇見神：幔薄之處的三重恩賜","date":"2026-08-18","author":"Joel Busby","cats":["圣经与神学"],"tags":["憂慮","同在"],"sum":"作者的第一個孩子出生時出現異常被送進新生兒重症監護室，妻子同時發生危險的產後併發症。三天裡他在連接兩棟樓的天橋上來回奔走，感到完全無力。某次坐在天橋長椅上，聖靈溫柔的同在使他確信：天地的主愛他、保守他，也同樣看顧妻兒，雖然沒有應許結果一定順利。古代凱爾特基督徒稱這樣的地方為「幔薄之處」。作者指出它帶來三重恩賜：使信仰從抽象變具體（神在真實時空中作工，十字架是最薄之處）；成為喚醒記憶、引發敬拜與傳承的通道（如約書亞立石）；挑旺我們切慕萬物更新、處處皆神聖的那一天。","pts":["無力的時刻讓抽象的教義變成拷問","聖靈的同在沒有應許結果，卻賜下平安","我們無法掌控生活，也不需要掌控","幔薄之處：天地距離驟然縮短","恩賜一：信仰從抽象化為具體","十字架是一切幔薄之處中最薄的地方","恩賜二：喚醒記憶，帶出敬拜與傳承","恩賜三：預嘗萬物更新的日子"],"mm":{"c":"幔薄之處","b":[["經歷",["兒子進NICU","妻子併發症","天橋上奔走"]],["相遇",["長椅上","聖靈的微聲","不打盹的神"]],["恩賜一",["抽象變具體","出埃及記","十字架"]],["恩賜二",["喚醒記憶","約書亞立石","向下一代述說"]],["恩賜三",["切慕新天新地","處處皆神聖"]]]},"fw":[["場景","醫院的空中走廊"],["危機","妻兒同時告急"],["相遇","神在天橋上的同在"],["概念","凱爾特的幔薄之處"],["三重恩賜","具體、記念、盼望"],["生活","每次經過都想起神的信實"]],"q":["神的護理曾是概念，那座天橋卻不是。","神沒有應許事情會變容易，但應許祂與我同在。","終有一天，每一處都將成為幔薄之處。"],"fb":null},{"id":23062,"slug":"helping-traumatized","title":"服侍受創傷的人","date":"2026-08-17","author":"Kelly Simpson","cats":["教会事工"],"tags":["苦難","創傷","心理輔導"],"sum":"作者是兒科及新生兒加護病房的職能治療師，每天面對創傷。她指出人面對他人創傷常有兩種反應：關上心門、只處理實際問題，這是自我保護卻讓受害者更孤立，也抹殺對方身上神的形像；或完全被痛苦吞噬、茶飯不思，導致共情疲勞與倦怠，也忽略了神帶來的盼望。第三條路是做「創傷的管家」：以基督為榜樣——祂道成肉身走進痛苦、為拉撒路流淚，卻從未被悲傷吞沒，會退到安靜處禱告休息。實踐上包括同在的服事、回應性的傾聽、尊重每個人的完整人格，以及知道何時退後並把重擔卸給主。","pts":["創傷的形式很多，本質都是極度痛苦與不安","反應一：關上心門，只處理表面問題","反應二：被他人痛苦吞噬，導致倦怠","兩者都傷害自己與受創者","第三條路：做創傷的忠心管家","耶穌靠近痛苦，卻不被吞沒","同在的服事：陪伴、傾聽、一同哀傷","要知道何時退後休息，把重擔交給主"],"mm":{"c":"創傷的管家","b":[["兩種反應",["關上心門","被痛苦吞噬"]],["後果",["孤立受害者","共情疲勞","職業倦怠"]],["基督的榜樣",["道成肉身","為拉撒路哭","退到安靜處"]],["實踐",["同在的服事","回應性傾聽","尊重完整的人"]],["界限",["我是受造之人","卸給主","聖靈代求"]]]},"fw":[["處境","醫院中的創傷"],["分析","兩種常見反應"],["問題","對雙方的傷害"],["榜樣","基督作為創傷管家"],["實踐","陪伴與哀傷"],["提醒","接納自身有限"]],"q":["關上心門保護了自己，卻讓受苦的人更孤單。","耶穌走進眾人的痛苦，卻從未被悲傷吞沒。","我們不必獨自背負他人的創傷。"],"fb":null},{"id":23059,"slug":"3-ways-church-planting-consumerism","title":"植堂：醫治消費教會的三劑良藥","date":"2026-08-17","author":"Shaun Cross","cats":["教会事工"],"tags":["植堂","消費主義"],"sum":"消費主義已滲透生活，教會也容易淪為提供宗教產品的企業：牧師像CEO、長老像董事會、同工像齒輪、會友名冊像銷售報表、外展成為品牌行銷。初代教會問的卻是「我能拿出什麼服事這個家」。作者認為植堂是抵抗消費主義的良藥，原因有三：一、植堂迫使母會不再緊抓人力與資源，重新聚焦神國的使命；二、新教會規模小、事工未成型，人人都需要找到恩賜並親自服事；三、在小教會中很難隱身當旁觀者，人會被看見、被關心、被帶進參與。植堂不能單獨解決問題，但是極好的起點。","pts":["我們越消費，內心越空虛","教會易淪為按需交易的公司","世俗成功指標可能掩蓋屬靈的死亡","初代教會重視服事而非消費","植堂讓母會為神國放手資源","新教會讓每個人都必須服事","小教會中難以只做旁觀者","多一分奉獻，少一分索取"],"mm":{"c":"植堂對抗消費主義","b":[["消費型教會",["牧師如CEO","長老如董事","外展如行銷"]],["初代教會",["服事非消費","家而非集市"]],["良藥一",["聚焦神國","放手資源","培育領袖"]],["良藥二",["人人服事","發揮恩賜"]],["良藥三",["無法隱身","被關心","投入生命"]]]},"fw":[["背景","消費主義無所不在"],["問題","教會淪為消費企業"],["對照","初代教會的服事"],["良藥一","重新聚焦使命"],["良藥二","人人服事"],["良藥三","無處隱藏"],["結語","多奉獻少索取"]],"q":["教會可能看起來蒸蒸日上，實際上卻在走向死亡。","在小教會裡，你很難只做個旁觀的消費者。","正因為沒有現成的事工，大家反而在福音裡扎了根。"],"fb":null},{"id":23052,"slug":"tragedy-consumption","title":"別讓悲劇成爲消遣","date":"2026-08-16","author":"Caroline Stoltzfus","cats":["信仰与工作"],"tags":["社交媒體","上癮"],"sum":"壞消息源源不斷，知曉天下事被視為美德。作者肯定扎實新聞的價值，但提醒我們反思：不停刷壞消息、聽犯罪播客、看政治爭吵，是為了服事神國，還是把他人的悲劇當成消遣、逃避自己與身邊群體的傷痛？刷屏常是孤獨的，讓人陷入絕望而非行動。以賽亞書58章呼召我們不是隔岸觀火，而是親自傾倒自己幫助有需要的人，神應許在服事中滿足我們。作者建議用聖靈果子檢視新聞習慣：若帶來懼怕焦慮就要調整；可嘗試新聞禁食，追求「好學」而非知曉萬事，精選少數議題深入了解並付諸行動。","pts":["扎實的新聞有價值，但要審慎面對壞消息","刷屏可能是在逃避真實的傷痛與鄰舍","為遠方事件義憤，比幫助街角的人容易","賽58章：不是轉發，而是親自傾倒自己","真正的滿足來自服事，而非刷屏","以聖靈的果子檢視資訊習慣","嘗試新聞禁食","好學是精選少數議題深入了解"],"mm":{"c":"別把悲劇當消遣","b":[["現象",["壞消息不斷","知曉天下事","無盡刷屏"]],["反思",["逃避傷痛","孤獨刷屏","陷入絕望"]],["聖經",["以賽亞58章","親自服事","神必滿足"]],["檢視",["聖靈九果","懼怕焦慮的警訊"]],["行動",["新聞禁食","好學而非全知","重建資訊來源"]]]},"fw":[["現象","壞消息作為日常"],["提問","服事神國還是消遣？"],["診斷","逃避與孤立"],["聖經","從旁觀到同行"],["工具","聖靈果子檢視"],["實踐","新聞禁食與精選"]],"q":["為千里之外的事憤怒，比幫助街角的人容易得多。","悲劇不是用來消費的，而是要我們走進去。","不必知道每件事，但要參與神更新世界的工作。"],"fb":null},{"id":23050,"slug":"the-hyper-consuming-christian","title":"當基督徒過度消費","date":"2026-08-16","author":"Renee Zou","cats":["信仰与工作"],"tags":["渴望","消費"],"sum":"作者以澳洲數據指出過度消費普遍：每人每年丟掉三百多公斤食物、添購五十多件新衣。她強調消費本身不是罪，它體現人彼此依存、是有限的受造物，也讓我們感恩他人與神的供應；離群索居的自給自足並不符合神的設計。問題在於為包裝自我、取悅他人而過度消費——用未賺到的錢買不需要的東西給不在乎的人看。十字架使一切歸於平等：耶穌來不是為表達自我而是捨己，我們的價值不在吃穿去過哪裡，而在於被神所愛。若此世無物能滿足我們，正顯示我們是為另一個世界而造。","pts":["過度消費是為了形象而非需要","消費本身反映人彼此依存的受造本質","與世隔絕的自給自足不是答案","許多基督徒也掉進表達自我的享樂主義","我們在基督裡已得著屬靈的福氣","耶穌來是為了捨己，而非實現自我","把時間金錢用在最需要的弟兄姊妹身上","我們是為另一個世界而造"],"mm":{"c":"過度消費的基督徒","b":[["現象",["丟棄食物","新衣過多","急於換新"]],["消費的好",["彼此依存","有限受造","感恩"]],["過度消費",["包裝自我","取悅他人","用未賺的錢"]],["十字架",["使一切平等","捨己而非自我實現","價值在被愛"]],["永恆",["此世不能滿足","為另一個世界而造","向故鄉前行"]]]},"fw":[["提問","你曾為填補空虛而購物嗎？"],["數據","澳洲的過度消費"],["平衡","消費不是壞事"],["問題","為自己還是為他人"],["福音","十字架的重塑"],["盼望","為永恆而造"]],"q":["我們常用沒賺到的錢，買不需要的東西，給不在乎的人看。","我們的價值，不在穿什麼、去過哪裡，而在被誰所愛。","此世無物能滿足的渴望，指向另一個世界。"],"fb":null},{"id":23047,"slug":"finally-transformed-transgender-christian","title":"終極蛻變：跨性別者的歸信","date":"2026-08-14","author":"Jonathan Gass","cats":["社会与时事"],"tags":["見證","變性","轉性別"],"sum":"作者33歲時向家人坦承性別焦慮，在眾人支持下經歷心理治療、激素與手術，從喬納森成為安德莉亞，並想成為跨性別倡導者。但當被邀請和青少年談此議題時，他第一次產生懷疑；身心上始終無法真正跨越與女性生命經驗之間的鴻溝，失望日深。他先後尋求東方宗教、冥想等，刻意避開最令他畏懼的基督教。轉機來自朋友送的《馬太福音》、邀他去教會，以及牧師一頓輕鬆的午餐；讀《柔和謙卑》時，他在淚水中明白耶穌早已愛他。幾週後他不再穿裙子去教會，重新做回喬恩。他最後悔的是只想改變身體，而非尋求救恩，如今想為回歸原生性別者發聲。","pts":["性別轉變一開始帶來圓滿感，後來卻是深深失望","與青少年談跨性別議題時，第一次產生懷疑","身體、心理、基因之間的鴻溝無法跨越","他嘗試各種宗教，唯獨避開基督教","朋友溫和真誠的傳福音態度打開了心門","一頓沒有壓力的午餐讓他明白福音","《柔和謙卑》讓他看見耶穌早已愛他","真正需要的不是另一種人生，而是重生"],"mm":{"c":"從跨性別到基督徒","b":[["轉變",["性別焦慮","激素與手術","成為安德莉亞"]],["懷疑",["不願勸青少年","期望落空","無法跨越的鴻溝"]],["屬靈尋求",["東方宗教","冥想","避開基督教"]],["歸信",["馬太福音","教會午餐","柔和謙卑"]],["醫治",["做回喬恩","父母支持","為回歸者發聲"]]]},"fw":[["開始","手術後的「成了」"],["過程","嘗試做女人"],["失望","期望與現實的落差"],["尋求","各種宗教體驗"],["轉機","福音與教會的接納"],["結局","真正的蛻變：成了"]],"q":["我一直想活出另一種人生，真正需要的卻是重生。","最令我畏懼的信仰，原來最溫柔地接納了我。","手術換不來的喜樂，在基督裡找到了。"],"fb":null},{"id":23043,"slug":"on-my-shelf-life-and-books-with-sd-smith","title":"我的書架上有什麼：S. D. 史密斯的生活與閱讀","date":"2026-08-13","author":"Ivan Mesaã€S. D. Smith","cats":["文化与艺术","我的书架上有什么"],"tags":["屬靈習慣","奇幻小說","兒童文學","想像力"],"sum":"在「我的書架」欄目中，奇幻小說《納塔利亞傳奇》作者S. D.史密斯分享閱讀生活。床頭書包括貝利的禱告日記、紐波特《深度工作》。他最希望福音派讀切斯特頓的《回到正統》，因為有人教義正確卻失去對世界的驚奇，有人則失去對正統的熱愛。他最愛的小說包括《裸顏》《魔戒》《納尼亞》《基督山伯爵》等；影響他藝術觀的有《回到正統》、藍格爾《行於水面》與薛華《藝術與聖經》。他常重讀創世記、傳道書、福音書。近來學到的功課是習慣的力量，以及承認自己無法保護與供應所愛的人，耶穌才是保護者。","pts":["推薦《回到正統》：兼顧驚奇與正統","教義正確卻失去驚奇，信仰容易變得冷峻功利","創世記對參與創作的人至關重要","傳道書最真實地映照世界","《魔戒》教人去愛當愛之事","兒童必讀：托爾金、路易斯、金銀島等","習慣的力量：不只靠隨心所欲","耶穌才是保護者與供應者"],"mm":{"c":"S. D. 史密斯的書架","b":[["床頭書",["個人禱告日記","深度工作"]],["必讀推薦",["回到正統","驚奇與正統"]],["最愛小說",["裸顏","魔戒","基督山伯爵"]],["藝術觀",["行於水面","藝術與聖經"]],["常重讀",["創世記","傳道書","福音書"]],["人生功課",["習慣的力量","耶穌是保護者"]]]},"fw":[["介紹","欄目與作者"],["床頭","正在讀的書"],["推薦","給福音派的一本書"],["書單","小說與藝術影響"],["重讀","聖經與經典"],["功課","習慣與信靠"]],"q":["教義正確，卻可能失去對世界的驚奇。","創造與救贖不該被割裂。","我無法保護所愛的一切，但耶穌可以。"],"fb":null},{"id":23038,"slug":"today-would-have-been-our-daughters-first-birthday","title":"今天本該是我們女兒的第一個生日","date":"2026-08-13","author":"Jackie Gibson","cats":["基督徒生活"],"tags":["死亡","天國","傳道者"],"sum":"作者的女兒萊拉在預產期前三天胎死腹中，一年後的這天本該是她的一歲生日。作者回憶懷孕晚期的期待與自信，直到某天早晨胎動消失、確認沒有心跳，丈夫在醫院走廊痛哭。死亡是殘忍的毀滅者，家中餐桌上少了一個杯子，女兒的缺席如同家人的出席一樣真實。但詩篇139篇說她的日子早已寫在神的冊上。作者轉而把這天看作萊拉在天國一週年——在神院中一日勝過千日。萊拉短暫的生命如同傳道者，把家人與許多人指向復活的基督；墓旁的水仙提醒冬天擋不住春天，終有一日主要呼喚她出來。","pts":["孕晚期的期待中，我們自以為是","明天如何，我們並不知道","死亡是殘忍的毀滅者","她的缺席與我們的出席一樣真實","她的日子早已寫在神的冊上","今天是她在天國的一週年","萊拉的生命把人指向復活的主","冬天無法永遠阻擋春天"],"mm":{"c":"女兒的第一個生日","b":[["出生",["萊拉朱迪格蕾絲","沒有聲音","胎死腹中"]],["失落",["雅4:13-14","丈夫的哭喊","少一個杯子"]],["死亡",["殘忍的毀滅者","詩139:16"]],["天國",["在神院中一年","與君王同在"]],["傳道者萊拉",["指向復活","水仙破土","萊拉，出來"]]]},"fw":[["回憶","一年前的那個早晨"],["失去","沒有心跳的女兒"],["哀傷","死亡的黑暗驚駭"],["轉念","天國的週年"],["見證","傳道者萊拉"],["盼望","復活的那日"]],"q":["她的缺席，和我們的出席一樣真實。","今天不是她的一歲生日，而是她在天國的一週年。","冬天無法永遠擋住春天。"],"fb":null},{"id":23036,"slug":"third-way-politics-mythology","title":"超越黨派政治的「第三條道路」","date":"2026-08-13","author":"Glen Scrivener","cats":["圣经与神学","凯勒文化护教中心"],"tags":["政治","進步","覺醒","凱勒文化護教中心"],"sum":"兩位歷史學家霍蘭德與萊裡不約而同認為，西方未來取決於一條「第三條道路」，而這關乎文化敘事（神話）而非政黨政治。霍蘭德提出三種可能：一、後基督教進步主義（「帕丁頓主義」），像脫離助推器的飛船；二、反覺醒的反彈，回到強權即公理，而反希特勒的道德圖騰隨記憶消退失去約束力；三、後世俗的基督教回歸，英國已見年輕人上教會增加的跡象。作者以表格分析：平等、憐憫、同意本是基督教的果實，進步主義把它們變成權利之劍、社會正義作秀、唯一的性倫理；反覺醒則以個人主義、能力、男性氣概反撲，恩典與自然被割裂。唯有道成肉身的基督能將它們重新合一。基督教不是折衷的第三條路，而是原初的第一條路。","pts":["真正爭奪人心的是敘事，而非政策","帕丁頓主義：脫離源頭的基督教式進步主義","反希特勒情緒取代耶穌成為道德圖騰，卻難以持久","英國年輕人上教會比例上升的跡象","平等、憐憫、同意是基督教文明的果實","進步主義讓價值變成口號與棍棒","反覺醒主義可能連美德本身一併拆毀","福音對雙方都是顛覆性的應驗"],"mm":{"c":"超越黨派的第三條路","b":[["三種未來",["帕丁頓主義","反覺醒反彈","基督教回歸"]],["道德圖騰",["從耶穌到希特勒","空中樓閣"]],["三方分裂",["平等/權利/個人主義","憐憫/社會正義/能力","同意/性選擇/男性氣概"]],["恩典與自然",["被文化割裂","在基督裡合一"]],["宣教姿態",["顛覆性應驗","不是政治理論","第一條道路"]]]},"fw":[["觀察","兩位歷史學家的預言"],["預測一","後基督教進步主義"],["預測二","後覺醒反彈"],["預測三","後世俗基督教"],["分析","三方價值分裂表"],["盼望","尋道者走向教會"],["結論","福音是真正的後繼者"]],"q":["真正爭奪我們的，不是政黨，而是故事。","價值脫離源頭後變成口號，口號又變成打人的棍子。","基督教不是第三條路，而是一切道路分岔前的那條路。"],"fb":null},{"id":23034,"slug":"miss-world-cup","title":"我會懷念這屆世界盃","date":"2026-08-12","author":"Michael Horton","cats":["社会与时事"],"tags":["普遍恩典","體育"],"sum":"神學家霍頓分享他在家中、飛機上、開羅、內羅畢與機場看世界盃的經歷。他指出足球像教會一樣具有普世性：與陌生人用球員名字和戰績交流，彷彿說著同一種語言；一起看球如同一種「禮儀」，在共享飯食與「杯」中建立友誼，甚至交到穆斯林朋友。世界盃也有政治利用、種族嘲諷等陰暗面，但它是一份普通恩典：跨國友誼、陪伴與公平競技。這雖不是救贖之恩，卻映照出基督裡更真實的合一、平安與喜樂。","pts":["足球與教會一樣具有普世性","球迷彷彿說著同一種語言","一起看球像一種群體禮儀","在共享中建立跨信仰的友誼","大型公共活動難免被政治利用","世界盃是一份普通恩典","它映照出基督裡更真實的合一"],"mm":{"c":"世界盃的普通恩典","b":[["經歷",["家中觀賽","開羅與內羅畢","機場看球"]],["普世性",["共同語言","與陌生人交流"]],["禮儀",["同看一屏","共享一杯","穆斯林朋友"]],["陰暗面",["政治利用","種族嘲諷"]],["神學反思",["普通恩典","指向基督的合一"]]]},"fw":[["經歷","世界各地看球"],["觀察","足球的普世性"],["體驗","看球如同禮儀"],["瑕疵","政治與種族問題"],["反思","普通恩典指向救恩"]],"q":["世界盃不是救恩，卻映照出救恩的影子。","友誼常在共享一頓飯、一杯酒中建立。","真正的合一，不會隨著頒獎典禮結束。"],"fb":null},{"id":23032,"slug":"5-reasons-you-need-fiction","title":"五個你需要讀小說的原因","date":"2026-08-12","author":"S. D. Smith","cats":["文化与艺术"],"tags":["故事","小說","想像力"],"sum":"有人以「都是假的」為由反對讀小說，作者S. D.史密斯提出需要優秀小說的五個理由：一、好故事不是讓人逃離現實，而是引人進入現實，喚醒對隱藏榮耀的感恩；二、故事塑造身份，回答「我在哪個故事中」才能回答「我該做什麼」，透過他人眼睛看世界培養同理心；三、想像力是信仰的關鍵能力，幫助我們看見尚未顯現卻真實的國度；四、故事會強化或削弱我們的愛與忠誠，好故事能繞過理智的防線，塑造道德想像；五、藉閱讀間接經歷痛苦與衝突，為人生必然的黑暗日子做預備。作者說，《魔戒》《納尼亞》深深培養了他對耶穌的愛慕。","pts":["好故事本身的美就值得享受，不必另找理由","故事引人進入現實，而非逃離現實","先知道自己在哪個故事中，才知道該做什麼","閱讀讓人透過他人的眼睛看世界","想像力幫助我們看見未見之事","故事是刻在骨子裡的教理問答","藉故事預嘗悲傷，為黑暗日子做準備","好故事能培養對耶穌的愛慕"],"mm":{"c":"為什麼要讀小說","b":[["進入現實",["喚醒驚奇","看見隱藏榮耀"]],["塑造身份",["我在哪個故事","培養同理心"]],["想像與信仰",["看見未見之事","信心的肌肉"]],["塑造情感",["骨中的教理問答","繞過警覺的巨龍"]],["預備痛苦",["間接經歷","堅韌的回報"]]]},"fw":[["反對聲音","小說都是假的"],["比喻","山谷中的橡樹"],["理由1–2","現實與身份"],["理由3–4","想像力與情感"],["理由5","預備痛苦"],["見證","故事加深對耶穌的愛"]],"q":["最好的故事不讓人逃避現實，而是帶人走進現實。","先知道自己身在哪個故事裡，才知道該怎麼活。","想像力是看見尚未顯現之事的信心肌肉。"],"fb":null},{"id":23030,"slug":"way-biblical-progress","title":"先下後上：聖經的「進步」之道","date":"2026-08-12","author":"Glen Scrivener","cats":["圣经与神学","凯勒文化护教中心"],"tags":["共產主義","進步主義","民權運動","人權宣言"],"sum":"聯合國總部象徵現代進步信念，園區內的「鑄劍為犁」雕塑取材自以賽亞書2章。作者指出進步本是聖經觀念：創造從晚上到早晨、從簡單到複雜，以色列從為奴到應許之地，彌賽亞先受苦後得榮耀；聖經的時間觀是向前向上的箭，而非循環或衰退。《世界人權宣言》起草者想保留基督教道德而丟棄其神學。諷刺的是，那座雕塑是蘇聯所贈；二十世紀的世俗進步卻成了「謀殺的世紀」。作者提出三個辨識問題：進步的標準是什麼（主的道）？誰締造進步（神藉祂的話）？進步的道路是什麼——不是巴別塔式的先升後崩，而是先降卑後升高，如十字架後有復活，如金恩的非暴力。","pts":["進步敘事已成為西方的文化底色","進步的觀念源於聖經","聖經的時間觀是向前向上的箭","人權宣言想保留基督教道德卻丟掉神學","鑄劍為犁雕塑由蘇聯贈送","二十世紀成為謀殺的世紀","標準是主的道，締造者是神","真正的進步是先降卑後升高"],"mm":{"c":"聖經的進步之道","b":[["現代象徵",["聯合國","鑄劍為犁雕塑"]],["聖經根源",["創造的進程","出埃及","先受苦後得榮"]],["世俗化",["人權宣言","無稽之談","馬克思黑格爾"]],["敗落",["謀殺的世紀","大躍進"]],["三個問題",["標準是什麼","誰締造","哪條路"]],["真正的弧線",["巴別塔先升後崩","十架後復活"]]]},"fw":[["象徵","聯合國與進步信念"],["根源","聖經中的進步異象"],["世俗化","割斷聖經根基"],["後果","二十世紀的屠殺"],["辨識","三個關鍵問題"],["結論","先降卑後升高的弧線"]],"q":["想贏一場道德爭論，報個年份就夠了——這正是對進步的信仰。","巴別塔是先升後塌，十字架是先降後升。","真正的進步不靠刀劍，而靠神的話語。"],"fb":null},{"id":23025,"slug":"disclosure-day-christian-movie-review","title":"斯皮爾伯格的《揭祕日》：當外星人神話遇見猶太-基督教信仰","date":"2026-08-11","author":"Brett McCracken","cats":["文化与艺术"],"tags":["影評","外星人","科幻"],"sum":"作者評論斯皮爾伯格新片《揭祕日》，正值政府解密UFO檔案的時事背景。片中提出「外星人存在是否會動搖信仰」，但更吸引人的是認識論問題：人如何得知真相？反派企圖隱瞞，吹哨人主角爭取公開，影片暗示揭露真相是一種愛與恩典。作者指出影片充滿猶太—基督教意象：說方言與翻方言、末世戰爭的風聲，尤其重演出埃及——法老般心硬的企業領袖、摩西亞倫般的兩位主角作為器皿施行奇事、冰雹與「過紅海」般的揭祕日。主角順服於引導，像客西馬尼的「照你的意思」。最後一個字「聽」呼應申命記6:4，指向一位樂意啟示自己的神。福音才是真正改變一切的揭祕。","pts":["影片切合當下的UFO解密熱潮","核心問題是認識論：我們如何知道真相","揭露真相被描繪為恩典與愛","片中有說方言、末世等新約意象","故事重演出埃及：法老、摩西亞倫、過紅海","主角作為器皿，順服於更大的主權","最後一個字「聽」呼應申6:4","真正的揭祕日早已在基督裡發生"],"mm":{"c":"《揭祕日》影評","b":[["背景",["斯皮爾伯格外星片","UFO解密時事"]],["核心問題",["信仰會崩潰嗎？","如何得知真相"]],["聖經意象",["說方言","末世","出埃及"]],["順服",["乘客而非駕駛","照你的意思"]],["啟示的神",["聽","光與眼","樂意顯明自己"]],["福音",["真正的揭祕","我們在聽嗎？"]]]},"fw":[["介紹","斯皮爾伯格的新作"],["主題","真相與認知"],["意象","猶太—基督教敘事"],["結構","出埃及式的自由"],["結尾","「聽」與自我啟示的神"],["反思","福音才是驚天消息"]],"q":["照亮黑暗，是一種愛的行動。","我們能知道一點真相，全是恩典。","揭祕日早已來過，問題是我們在聽嗎？"],"fb":null},{"id":23022,"slug":"10-mistakes-i-made-growing-up-in-the-church","title":"我這個「信二代」犯過的十個錯誤","date":"2026-08-11","author":"Tinashe Chengeta","cats":["基督徒生活","十个错误"],"tags":["成長","教訓","青少年","十個錯誤"],"sum":"津巴布韋一位在長老會長大的治理長老，分享自己身為「信二代」犯過的十個錯誤：把服事當成得救；熟知聖經卻不認識神；以信仰傳承與族群身份為傲；把教會當作晉升的梯子、太早擔任領袖；只談長處不談軟弱、隱藏罪；沒有每日讀經，追劇卻比讀經熱心；結交損友；隨大潮而非跟隨基督；坐在禱告會中卻不真正禱告；不順服父母與權柄。他把這些分享給年輕人與父母，並感恩神在他的軟弱中恩待他。","pts":["熱心服事不等於已經得救","背得再多經文，也不等於認識耶穌","家族傳承可能滑向驕傲","太早當領袖，反而少了認識救主的時間","教會長大的孩子同樣與罪掙扎，需要認罪","要學習以神的話為每日靈糧","與愚昧人作伴必受虧損","坐在禱告會中，不代表真正在禱告","父母雖不完美，卻有智慧可給"],"mm":{"c":"信二代的十個錯誤","b":[["信仰本質",["服事≠得救","知識≠認識神"]],["驕傲",["家族傳承","太早領導"]],["隱藏",["只談長處","掩蓋罪"]],["靈命操練",["不讀經","不真禱告"]],["影響",["損友","隨大潮"]],["權柄",["不順服父母"]]]},"fw":[["引言","詩25:7與幼年的罪"],["背景","在改革宗教會長大"],["錯誤1–4","身份與服事"],["錯誤5–8","罪與影響"],["錯誤9–10","禱告與順服"],["恩典","神在軟弱中恩待"]],"q":["我先加入了長老會，後來才成為基督徒。","主日學知識高人一等，不代表認識耶穌。","人可以坐在禱告會裡，卻一句也沒禱告。"],"fb":null},{"id":23019,"slug":"10-mistakes-i-made-as-a-single-woman","title":"我單身時犯過的十個錯誤","date":"2026-08-10","author":"Ruth Nabaasa","cats":["基督徒生活","十个错误"],"tags":["單身","偶像","婚姻"],"sum":"烏干達一位39歲的單身女性回顧單身時犯過的十個錯誤：與異性未劃清情感界限，陷入曖昧關係；把婚姻當偶像，以為忠心就會換來婚姻；聽信「屬靈配偶」的謊言而禁食捆綁；因言情色情讀物陷入自慰，並以未婚為藉口；以為主內弟兄同樣重視貞潔；大學時與非信徒約會（後在聚會中被提醒而結束）；留戀試探，沉溺幻想與影視；沒有把恐懼失望帶到禱告中；與已婚的人比較；很少默想天上的羔羊婚筵。她感恩神讓她在基督裡得滿足，同時仍可懷著對婚姻的盼望。","pts":["沒有明確承諾前，保守自己的心","婚姻不是忠心的獎賞，基督高於一切","信徒有聖靈內住，不會與鬼魔聯合","神的恩典足以使人對罪說不","從一開始就要溝通期待與界限","不要與不信的同負一軛","喜愛罪根的人不會厭惡罪果","效法詩篇作者，把恐懼帶到神面前","默想與基督面對面的盼望"],"mm":{"c":"單身時的十個錯誤","b":[["情感",["界限不清","曖昧關係","期待過高"]],["偶像",["婚姻偶像化","屬靈配偶謊言"]],["性",["自慰","留戀試探","影視影響"]],["關係",["與非信徒約會","需要問責群體"]],["心態",["不禱告面對","與人比較","少想羔羊婚筵"]]]},"fw":[["引言","39歲生日的回顧"],["錯誤1–3","情感與偶像"],["錯誤4–7","試探與罪"],["錯誤8–9","心態與比較"],["錯誤10","忘記永恆盼望"],["恩典","在基督裡得滿足"]],"q":["婚姻不是忠心換來的獎賞。","神沒有忘記我，只是為我預備了不同的道路。","與基督面對面的美好，勝過世上一切歡愉。"],"fb":null},{"id":23017,"slug":"cs-lewis-new-atheists-alister-mcgrath","title":"C. S. 路易斯，新無神論，以及後者在否定神這一議題上的失敗","date":"2026-08-10","author":"Collin Hansenã€Alister McGrath","cats":["文化与艺术"],"tags":["護教","路易斯","播客"],"sum":"這是柯林·漢森與麥葛福（Alister McGrath）的播客對談。麥葛福少年時是無神論者，後來發現自己的立場帶有情感動機（不希望有神限制自由），而且「沒有神」本身無法被證明；在牛津他逐漸被基督教的合理與精彩吸引而歸信。路易斯〈神學是詩歌嗎？〉讓他明白基督教能照亮對整個現實的理解。他回顧與新無神論的交鋒：對方靠斬釘截鐵的話術，卻要求基督徒證明而自己不必證明；新無神論衰落是因內鬥、無法證明己見、領袖私心，且回答不了意義與良善的問題。他認為護教學已從過度理性主義轉向：重要的信念無人能絕對證明，這是「信念對信念」而非「信仰對事實」。護教者像拉開百葉窗讓光進來。他也稱讚凱勒先傾聽再說話，並建議講道中自然融入護教，最後談到路易斯在二戰時期的護教作品。","pts":["無神論常有不希望神存在的情感根基","「沒有神」同樣無法被證明","基督教讓其他一切變得可以理解","新無神論靠斬釘截鐵的語氣說服人","要求雙方都證明自己的立場才公平","新無神論衰落：內鬥、私心、回答不了意義","這不是信仰對事實，而是信念對信念","護教是拉開百葉窗，讓恩典之光進來","在講道中自然融入護教，裝備會眾"],"mm":{"c":"麥葛福談護教","b":[["歸信",["少年無神論","無法證明沒有神","牛津的基督徒"]],["路易斯",["神學是詩歌嗎？","照亮一切"]],["新無神論",["話術","不對稱的舉證","衰落原因"]],["護教轉向",["非過度理性","信念對信念","聖靈改變人心"]],["凱勒",["前設護教","先傾聽","文化分析"]],["講道應用",["自然融入","裝備會眾","路易斯的戰時作品"]]]},"fw":[["見證","麥葛福的歸信"],["影響","路易斯的作品"],["交鋒","與新無神論的辯論"],["分析","新無神論為何衰落"],["方法","護教學的轉變"],["實踐","講道中的護教"],["歷史","路易斯與二戰"]],"q":["我不想要神存在，因為那會威脅我的自由。","這不是信仰對事實，而是一種信念對另一種信念。","護教者的工作，是拉開百葉窗讓光照進來。"],"fb":null},{"id":22965,"slug":"monk-exhausted-worker-today","title":"六世紀的一位修士能給今天疲憊不堪的職場人什麼啓發？","date":"2026-08-06","author":"Gage Arnold","cats":["信仰与工作"],"tags":["自由","界限","倦怠","體力勞動"],"sum":"深夜仍在回郵件的職場人反映出普遍的倦怠：工作自由卻隨時待命，AI非但沒減輕負擔反而加重。作者從六世紀的本篤會規汲取智慧：本篤不把生活切割成屬靈與日常，而把禱告、睡眠、研讀、飲食、勞動都視為塑造生命的節奏；他打破古代輕視體力勞動的觀念，認為工作塑造工作者。「禱告與勞作」的節奏中，每日七次鐘聲響起就放下工作，提醒人神的工作優先、價值不在產出。修道院輪換職責，讓身份不被某項工作定義。本篤避開工作狂與逃避工作兩種誤區，示範「界限帶來自由」。作者描繪2026年的本篤式工作日：先默想再收信、專注工作、刻意中斷、接受限度、從容收工。","pts":["隨時在線的自由帶來隨時待命的壓力","本篤把日常生活整合為屬靈的節奏","無所事事是靈魂的大敵","工作者塑造工作，工作也塑造工作者","禱告與勞作：鐘聲響起就放下工作","職責輪換，讓身份不被工作定義","兩大誤區：工作狂與偽默觀","界限帶來自由，結果不是懶惰而是穩固"],"mm":{"c":"本篤給倦怠職場人","b":[["現代困境",["隨時在線","倦怠","AI加重負擔"]],["本篤會規",["整全的人","勞動的尊嚴","塑造品格"]],["禱告與勞作",["每日七次日課","刻意中斷","神的工作優先"]],["身份",["職責輪換","不以頭銜定義"]],["兩大誤區",["工作狂","偽默觀"]],["實踐",["先默想","專注","接受限度","從容收工"]]]},"fw":[["場景","深夜回郵件的人"],["問題","工作的意義何在"],["人物","努西亞的本篤"],["原則","勞動的尊嚴與節奏"],["對照","工作成了身份"],["實踐","本篤式的一天"],["結論","界限帶來自由"]],"q":["不只問我的工作產出了什麼，更要問它正把我塑造成什麼人。","你受造不是為了當自己的救主，工作也扛不起這重擔。","鐘聲響起，就放下手中的活。"],"fb":null},{"id":22963,"slug":"ai-medical-practice","title":"基督徒如何看待醫療中的人工智能","date":"2026-08-06","author":"Joel Cho","cats":["信仰与工作"],"tags":["技術","醫療","人工智能","AI"],"sum":"一位從醫三十多年的內科醫生認為，AI是他見過最具顛覆性的醫療變革：幾秒鐘就能完成病歷摘要、個人化用藥方案，機器人手術更精準。他認為AI在美國醫療中無法也不應迴避，它是神普遍恩典的一部分，可以感恩領受並用來更好地服事病人。但醫治從不只是開對藥、做對手術，而是建立在醫患之間的信任關係上；耶穌的醫治也總是親自觸摸、與人同在。唯有人按神形像受造、能進入立約的關係，AI再像人也有本質差別。基督徒醫者應善用AI簡化文書、提升效率，但警惕以取代人為目標，避免冰冷、把病人當成無名數據的醫療系統。","pts":["AI可在幾秒內完成病歷摘要與用藥建議","機器人手術更有效率、結果更好","有同事說若當年有AI就不會離開基層醫療","AI可視為神普遍恩典的一部分","醫患關係是醫療生態的核心","耶穌的醫治總包含親自觸摸與同在","AI與人的「關係」在本體上有本質不同","警惕以取代人為目標的醫療體系"],"mm":{"c":"醫療中的AI","b":[["變革",["病歷摘要","用藥方案","機器人手術"]],["不必迴避",["普遍恩典","雅1:17","服事病人"]],["醫治的本質",["醫患信任","醫學是藝術","柳葉刀研究"]],["耶穌的榜樣",["親手觸摸","同在","整全的人"]],["智慧使用",["簡化文書","不取代人","求神賜智慧"]]]},"fw":[["經歷","三十年行醫見證的變革"],["提問","基督徒如何看待醫療AI"],["立場","無法也不應迴避"],["核心","醫治離不開人際關係"],["榜樣","大醫生耶穌"],["實踐","善用但不取代人"]],"q":["AI可以讓醫療更快，卻不能取代病床邊的那雙手。","病人是按神形像所造的人，不是一堆沒有名字的數據。","掌權的神仍坐在寶座上，祂必賜下所需的智慧。"],"fb":null},{"id":22958,"slug":"wait-cultural-reckoning","title":"當文化開始反思時，教會當如何預備自己","date":"2026-08-05","author":"Joe Carter","cats":["社会与时事"],"tags":["護教","說服","影響力"],"sum":"蓋洛普數據顯示，美國人對同性婚姻、性別轉換、賭博、未婚生子等的接受度近年開始下降。作者提醒：這不是因為基督徒贏了辯論，而是惡果已經顯現——體育博彩解禁後的成癮問題、變性後悔者的親身經歷。正如杜塔特所說，人往往要等危害無法否認才會行動。警告仍是聖經的模式（如以西結書的守望者），即使少有人聽。因此更重要的問題是：在警告與清算之間，教會該做什麼？作者引用耶利米書29章：蓋房、栽種、為城求平安，長久忠心地同在。改變世界有三種方式：影響力、教導與效法；美國教會過度依賴前兩者，而效法——活出看得見、行得通的生命——讓人在尋找出路時可以跟隨。先活出來，再講出來。","pts":["社會對部分道德議題的接受度開始回落","轉變的主因是惡果顯現，而非辯論勝利","人往往要等危害無法否認才會行動","警告仍是聖經的模式，守望者盡本分即是忠心","在警告與清算之間，教會要預備一種活法","耶利米書29章：長久而忠心的同在","改變世界的三種方式：影響力、教導、效法","生命→真理→生命；先活出來，再講出來"],"mm":{"c":"等候文化的反思","b":[["數據",["同性婚姻支持下降","性別轉換","賭博"]],["原因",["惡果顯現","現實說服人","杜塔特的觀察"]],["警告",["守望者","盡本分","少有人聽"]],["被擄策略",["耶29章","忠心同在"]],["三種方式",["影響力","教導","效法"]],["榜樣",["生命→真理→生命","太5:16","屹立不倒的見證"]]]},"fw":[["現象","文化開始回頭"],["真相","惡果比辯論更有說服力"],["責任","仍要發出警告"],["問題","過渡期中該做什麼"],["策略","被擄者的忠心同在"],["方法","效法：先活出來"]],"q":["人們改變想法，往往不是因為被說服，而是因為受了傷。","守望者盡了本分，就是忠心，不論城裡的人聽不聽。","當廢墟再也無法掩蓋，要成為那個仍然屹立的見證。"],"fb":null},{"id":22953,"slug":"enoch-why-jude-quote","title":"《以諾一書》是什麼？《猶大書》爲什麼引用它？","date":"2026-08-04","author":"Matthew Harmon","cats":["圣经与神学","卡森神学更新中心"],"tags":["舊約","正典"],"sum":"舊約與新約之間約有四百年，期間產生大量「第二聖殿時期猶太文獻」，《以諾一書》是其中重要的一部，由五部作品組成，主角是未經死亡被神取去的以諾。猶大書14–15節引用了其中「守望者之書」關於神帶千萬聖者降臨審判的話。作者說明這並不令人不安：一、引用某文獻不代表視之為聖經，正如保羅引用希臘詩人；二、新約時期舊約正典範圍已大致確立，猶太史料都沒有把《以諾一書》當正典，耶穌「從亞伯到撒迦利亞」的說法也涵蓋整個希伯來正典；三、「預言」一詞也用於該亞法，不代表默示。聖經作者活在真實的文化世界中，一切真理都是神的真理。","pts":["兩約之間的四百年產生大量猶太文獻","《以諾一書》由五部作品組成，主角是以諾","猶大書引用了「守望者之書」的審判異象","猶大書還可能借用了創6章的解釋傳統與《摩西升天記》","引用不等於承認其為聖經，如保羅引用詩人","當時的猶太史料都不視它為正典","「預言」一詞不自動代表神的默示","一切真理都是神的真理"],"mm":{"c":"以諾一書與猶大書","b":[["背景",["兩約之間","第二聖殿文獻"]],["以諾一書",["五部合集","守望者之書","墮落天使與審判"]],["猶大的引用",["猶14–15","天使離開本位","米迦勒與屍體"]],["不是聖經的理由",["引用≠默示","正典已確立","預言一詞的用法"]],["意義",["真實歷史處境","真理屬神","加深對聖經的信心"]]]},"fw":[["背景","被忽略的四百年"],["介紹","《以諾一書》是什麼"],["問題","猶大為何引用它"],["回答","三個理由說明它不是聖經"],["意義","引用是輔佐論證"]],"q":["引用一句話，不等於承認整本書是聖經。","一切真理都是神的真理。","聖經作者完全清楚自己在做什麼。"],"fb":null},{"id":22950,"slug":"most-overlooked-missionary","title":"從新約中最遭忽視的宣教士身上學功課","date":"2026-08-04","author":"Josh Irby","cats":["教会事工"],"tags":["宣教士","全球宣教"],"sum":"作者以電影《阿甘正傳》比喻：巴拿巴總在使徒行傳的關鍵時刻出現——率先變賣田地奉獻、把剛歸信的保羅引薦給使徒、牧養初生的安提阿教會、培育領袖後與保羅一同被差派。人們只記得他是「勸慰子」，但他也是教師、栽培者、領袖，是最被忽略的宣教士。如今許多昔日的宣教工場已成差派基地，時代需要巴拿巴式的榜樣。作者提出三個功課：值得信賴（在人事與金錢上），尤其在跨文化團隊與鉅額宣教資金中問責至關重要；為他人發聲，用自己的地位提攜保羅、馬可，以及全球南方被忽略的領袖；懂得適時退居幕後，讓後輩超越自己。","pts":["巴拿巴出現在初代教會許多關鍵事件背後","他不只是鼓勵者，也是教師、栽培者、領袖","今日宣教需要不同於保羅的榜樣","值得信賴：管理人事與資源","全球基督教資金挪用問題嚴重，問責勢在必行","用自己的地位成全他人，如保羅與馬可","全球南方的領袖需要被邀請進入決策","甘心退居次席，是耶穌的做事方式"],"mm":{"c":"被忽略的宣教士巴拿巴","b":[["幕後身影",["變賣田地","引薦保羅","牧養安提阿"]],["時代轉變",["工場變基地","普世差派"]],["功課一",["值得信賴","跨文化團隊","財務問責"]],["功課二",["為人發聲","提攜保羅與馬可","全球南方"]],["功課三",["退居幕後","讓後輩超越","甘當配角"]]]},"fw":[["比喻","阿甘與巴拿巴"],["觀察","使徒行傳中的關鍵角色"],["時代","宣教圖景的改變"],["功課一","可信賴"],["功課二","為他人發聲"],["功課三","適時讓位"],["結語","甘心做配角的美"]],"q":["神興起新領袖的速度，遠超過現任領袖願意放手的速度。","巴拿巴能在別人身上看見長處，然後放手讓他們超越自己。","在最偉大的使命裡，甘心做配角是一件極美的事。"],"fb":null},{"id":22947,"slug":"therapy-cant-replace-church","title":"爲什麼心理治療無法取代教會","date":"2026-08-02","author":"Collin Hansenã€Brad Edwards","cats":["教会事工"],"tags":["教會","AI","播客","具身性"],"sum":"柯林·漢森訪談植堂牧師布拉德·愛德華茲，談他的得獎書《為何去教會》。布拉德認為人們不信任教會權威，首因是社會對機構的整體信任崩塌，社交媒體是加速器，領袖的失敗反而排第三；社交媒體的追責往往不公道。人們改觀多半來自在基督身體中的親身經歷，其次是能說明這經歷的基督徒。他指出好的心理治療是好的，但無法取代教會；一位治療師發現把她當「世俗牧師」的客戶反而最掙扎。他主張區分源於神形像的「個體性」與切斷根源的「個人主義」；合一是忠心的果子而非目標；我們的呼召不是追逐復興，而是建立餘民。他也警告AI將把「能動性」商品化，讓人失去經歷神在軟弱中作工的機會。","pts":["不信任教會主因是對機構整體的不信任","社交媒體加速不信任，追責也常不公道","領袖把機構當表演平台而非服事對象","人們改觀主要靠在教會中的親身體驗","治療有益，但不能取代教會","個體性源於神的形像，個人主義是其癌變","合一是果子，不是目標","AI可能把人的能動性商品化","教會是避風港與餘民"],"mm":{"c":"治療不能取代教會","b":[["信任危機",["機構衰落","社交媒體","領袖失敗"]],["改觀之路",["親身經歷","基督徒的見證","聖經"]],["治療文化",["好治療是好的","世俗牧師的期待"]],["個人主義",["個體性vs個人主義","宗教改革的張力"]],["教會與合一",["合一是果子","建立餘民","跨代視野"]],["AI",["能動性商品化","失去經歷神的機會"]]]},"fw":[["介紹","《為何去教會》"],["排序一","信任危機的成因"],["排序二","人如何重新看重教會"],["議題","治療文化"],["概念","個體性與個人主義"],["教會","合一與餘民"],["未來","AI與能動性"]],"q":["我們現在的呼召不是追逐復興，而是建立餘民。","合一是忠心的果子，而不是要追求的目標。","即使你感覺不到，神仍在聚集的教會中作工。"],"fb":null},{"id":22945,"slug":"admitted-lords-supper","title":"誰可以領聖餐？四種觀點","date":"2026-08-02","author":"Davy Ellison","cats":["教会事工","讲道工具箱"],"tags":["教會論","聖餐"],"sum":"作者坦言神學院時期從未認真思考聖餐，而今日許多教會也越來越少、越來越隨便地舉行聖餐。他整理「誰可以領聖餐」的四種觀點：一、不設限的開放式：人人自己省察，教會無權攔阻；二、設限的開放式：聖餐是給信徒的教會禮儀，凡福音派教會中信仰生活良好的信徒都可領；三、限制性：須是信仰相近教會中紀律良好的會友，許多浸信會要求已受信徒洗禮；四、封閉式：只限該教會的正式會友，理由是聖餐與教會紀律相連，並反映羔羊婚筵的聚集。作者傾向帶彈性的封閉式，但更重要的是每位教會領袖都要認真思考聖餐。","pts":["主持聖餐是牧師寶貴而深刻的特權","許多教會忽視聖餐的實踐與神學","不設限開放式：人人自己省察","設限開放式：限於信徒","限制性：須受洗並在教會紀律之下","封閉式：只限本堂會友","洗禮是入門記號，聖餐是持續的記號","重要的是認真思考聖餐的意義"],"mm":{"c":"誰可以領聖餐","b":[["問題",["聖餐被忽視","牧者缺乏聖餐神學"]],["開放式",["林前11:28","人人自省"]],["設限開放",["只限信徒","教會禮儀"]],["限制性",["信徒洗禮","教會紀律"]],["封閉式",["本堂會友","家庭聚餐","羔羊婚筵"]],["作者立場",["彈性封閉式","認真思考"]]]},"fw":[["反思","從未思考聖餐的神學生"],["問題","誰應被接納領聖餐"],["觀點1–2","開放式"],["觀點3–4","限制與封閉"],["結論","重拾這寶貴的蒙恩之道"]],"q":["如果洗禮是進入神家的門，聖餐就是家裡的晚餐。","忽視聖餐，就是忽視一個寶貴的蒙恩之道。","問「誰可以領」，會逼我們想清楚「我們在做什麼」。"],"fb":null},{"id":22943,"slug":"wonder-do-deserve-this","title":"苦難並不總是因爲你的過錯","date":"2026-08-01","author":"Scott W. Kay","cats":["基督徒生活"],"tags":["苦難","懲罰","榮耀"],"sum":"順境時「種什麼收什麼」像嘉獎，逆境時卻變成定罪的烏雲，讓人追問是哪個罪招來苦難。作者指出「好人得好報、壞人得壞報」的公式正是約伯朋友的錯誤：約伯並沒有做錯，他受苦是因魔鬼的攻擊，神允許是為顯明他信心的真實。耶穌也說生來瞎眼的人不是因誰犯罪，而是要顯出神的作為；十字架上的耶穌更是無辜卻承擔全人類的後果。種瓜得瓜是普遍原則而非絕對因果律。若苦難源於罪，聖靈會讓我們知道；若實在找不到原因，神可能正在熬煉並彰顯我們的信心。流淚撒種的必歡呼收割。","pts":["「種什麼收什麼」在逆境中容易變成自責","善有善報惡有惡報的公式並不完整","約伯受苦不是因為做錯，而是因為做對","神允許試煉，為顯明信心如金子","生來瞎眼是要顯出神的作為","耶穌無辜受苦，承擔眾人的罪","若是因罪受苦，聖靈會指出來","苦難的淚水可能是將來喜樂的種子"],"mm":{"c":"苦難不總是你的錯","b":[["困惑",["種什麼收什麼","自我檢討"]],["錯誤假設",["約伯的朋友","因果公式"]],["因善受苦",["約伯","生來瞎眼的人","十字架"]],["分辨",["普遍原則非絕對","聖靈會指出罪","彼前4:19"]],["盼望",["流淚撒種","早晨必歡呼"]]]},"fw":[["經文","加6:7的兩種感受"],["假設","善有善報、惡有惡報"],["反例","約伯的苦難"],["延伸","耶穌與瞎眼的人"],["分辨","兩種苦難"],["盼望","流淚撒種的收割"]],"q":["約伯受苦，不是因為他做錯了什麼，而是因為他沒做錯。","種什麼收什麼是普遍原則，不是絕對的公式。","我們的眼淚，未必是管教的記號，也可能是喜樂的種子。"],"fb":null},{"id":22941,"slug":"what-christian-means-matters","title":"基督徒是什麼人？是屬於基督的人","date":"2026-08-01","author":"Caleb Davis","cats":["基督徒生活"],"tags":["安息","順服","身份"],"sum":"作者以收養孩子為例：孩子起初與他們並不相像，卻屬於他們。他指出「基督徒」一詞原意不是「小基督」，而是「屬於基督的人」；新約多用弟兄、兒女、聖徒等歸屬性稱呼。這個真理在三方面堅固我們：一、喜樂的相交——我們不只是模仿一位歷史人物，而是與活著的神天天同行；二、更深的安息——單靠效法帶不來安息，海德堡要理問答說我們唯一的安慰是身體靈魂都屬於基督，神不只救我們脫離審判，更收養我們、給我們祂的名；三、有能力的順服——若只當自己是跟隨者，仍保留決定跟多緊的權利；歸屬意味著全然交出，反而得自由。","pts":["基督徒的身份源於歸屬，而非效法","Christianos意為「屬於基督」","新約多用家庭與聖徒的歸屬性稱呼","基督教不只是像耶穌，更是與耶穌同在","單靠效法帶不來安息","唯一的安慰：我屬於信實的救主","神不只救我們，更收養我們","歸屬帶來有能力、不帶怨恨的順服"],"mm":{"c":"屬於基督的人","b":[["收養比喻",["不相像卻屬於我們","你們是我們的"]],["詞義",["Christianos","弟兄兒女聖徒"]],["喜樂相交",["與神同在","祂垂聽說話"]],["更深安息",["海德堡要理問答","被收養","有了祂的名"]],["能力順服",["交出一切","加2:20","在愛中得自由"]]]},"fw":[["比喻","收養的孩子"],["澄清","基督徒一詞的本意"],["果效一","喜樂的相交"],["果效二","更深的安息"],["果效三","有能力的順服"],["結論","你是祂的"]],"q":["基督徒首先不是模仿者，而是歸屬者。","神不只把我從火裡救出來，更把我接進祂的家。","無論過去如何，你都屬於祂。"],"fb":null},{"id":22937,"slug":"absurdity-autonomy","title":"自主的荒誕","date":"2026-07-31","author":"Joshua Chatraw","cats":["文化与艺术","凯勒文化护教中心"],"tags":["驕傲","技術","自主","凱勒文化護教中心","掌控"],"sum":"作者從帕斯卡「人的不幸在於不能安靜待在屋裡」與疫情經驗談起：後啟蒙時代的承諾是「掌控得法，人生就美好」。羅薩指出問題不在掌控本身，而在對掌控的追求滲透一切。數字技術讓人不費力就能掌控，卻剝奪了藉面對阻力而生的智慧與能力；自然、他人、身體仍會抗拒，期待與現實的落差產生加繆所說的荒謬感，於是人更躲進聽話的設備，關係與生命逐漸機械化，帶來抑鬱與倦怠。掌控與失控同時暴漲，人便互相怪罪。帕斯卡說人的悲慘正顯出人的偉大。耶穌對少年官的攔阻正是愛：金錢許諾掌控卻隔絕關係。創世記顯示人受造既為相交也為治理；耶穌接納孩子般的依靠，呼召我們以依靠者的身份治理。","pts":["現代生活的引擎是「掌控就能幸福」","數字技術讓人不經阻力就能掌控","缺少阻力，就養不出智慧、本領、韌性","自然、他人、身體都會抗拒我們","期待與現實的落差產生荒謬感","聽話的設備帶不來真正的愛與共鳴","掌控的追求帶來抑鬱、倦怠與互相怪罪","人的悲慘正顯出人的偉大","耶穌的攔阻是愛：金錢只是神的廉價替代品","依靠不是缺陷，而是受造的特色"],"mm":{"c":"自主的荒誕","b":[["掌控的承諾",["後啟蒙引擎","處處便捷"]],["阻力",["自然","他人","身體"]],["荒謬",["加繆","躲進設備","點石成金"]],["後果",["機械化","抑鬱倦怠","互相怪罪"]],["耶穌的攔阻",["少年官","金錢的咒語"]],["古老故事",["相交與治理","像小孩子","以依靠者身份治理"]]]},"fw":[["引言","帕斯卡與疫情"],["診斷","掌控滲透一切"],["問題","阻力與荒謬"],["惡化","點石成金與失控"],["人性","悲慘中的偉大"],["福音","耶穌的抗阻學校"],["出路","相交與掌管並行"]],"q":["我們造出像人的機器，自己卻越來越像沒有生命的機器。","世界的問題不只是我們控制不了它，更在於我們常常控制得了。","依靠不是受造物的缺陷，而是我們的本相。"],"fb":null},{"id":22934,"slug":"claim-christians-act","title":"求助！同事自稱信主，活得卻不像基督徒","date":"2026-07-29","author":"Miranda Carls","cats":["信仰与工作","荆棘与蒺藜"],"tags":["見證","工作","假基督徒"],"sum":"一位公立學校行政助理問：如何向自稱基督徒、神學卻很自由或言行不一的同事傳講基督？作者先分享曾有同事邀她每週一同禱告的祝福，再指出職場中也常遇到「掛名基督徒」。建議包括：調整期待——聖經早已警告假冒為善，這不是新鮮事；守護自己的心——不要被職場規範同化而降低標準，也不要讓苦毒滋長；倚靠恩典與禱告——我們自己也不完美，要為同事禱告；在關係穩固時彼此督責——可先一起喝咖啡聊信仰歷程，關係近時溫和直接指出並邀請同行，或邀請一同禱告查經；並活出榜樣，讓日常言行成為見證。","pts":["職場中的主內同伴是很大的安慰","掛名基督徒自古就有","不要被環境同化而稀釋信仰","不要讓失望變成苦毒","我們自己也可能被別人質疑","為同事禱告，求聖靈作工","關係越穩固，話越能說得直接","邀請一同禱告與查經","日常生活本身就是見證"],"mm":{"c":"自稱信主的同事","b":[["處境",["神學自由","言行不一"]],["調整期待",["假冒為善古已有之","主日基督徒"]],["守護內心",["不降標準","不生苦毒"]],["恩典禱告",["人人虧缺","為同事代禱"]],["督責方式",["喝咖啡聊天","溫和直言","一同查經"]],["活出榜樣",["言語與週末","立場的見證"]]]},"fw":[["問題","如何面對掛名基督徒"],["經歷","一位禱告同伴"],["步驟一","調整期待"],["步驟二","守護內心"],["步驟三","恩典與禱告"],["步驟四","適時督責"],["步驟五","活出榜樣"]],"q":["換個時間點，別人也可能質疑我們算不算基督徒。","關係越穩固，真話越能說出口。","不要在日常的掙扎中，忽略神更宏大的故事。"],"fb":null},{"id":22932,"slug":"before-ai-ecclesiastes","title":"使用 AI 之前，先讀《傳道書》","date":"2026-07-28","author":"Darin White","cats":["信仰与工作"],"tags":["智慧","順服","人工智能","AI"],"sum":"一家公司推出每分鐘收費的AI耶穌虛擬形象；調查顯示四成年輕人認為AI的屬靈建議和牧師一樣可信，許多人把嚴肅問題、就醫決定甚至戀愛託付給AI。作為基督教大學商科教授，作者認為一代人正把需要智慧的決定外包給不可能有智慧的機器。他以傳道書為鏡：所羅門以超凡智慧在「日光之下」——把神排除在外的封閉體系——試遍一切，結果盡是虛空；AI同樣被鎖在日光之下。神將永恆安置在人心，但AI裡沒有永恆。智慧的姿態是在神面前安靜聆聽、言語寡少，AI卻不停產出。神的道路高過人的道路，AI不會叫人饒恕七十個七次或愛仇敵。年輕人要會用AI，但不能被它掌控，因為智慧唯獨來自日光之上。","pts":["有人推出收費的AI耶穌","許多年輕人信任AI如同信任牧師","一代人正在把智慧外包給機器","「日光之下」是把神排除在外的封閉體系","AI永遠在日光之下，不會歸向敬畏神","神將永恆安置在人心，AI卻沒有","智慧的姿態是安靜聆聽，AI卻不停產出","饒恕與愛仇敵在封閉系統中不合邏輯","信息不等於智慧，數據不等於認識神"],"mm":{"c":"用AI前先讀傳道書","b":[["現象",["AI耶穌","年輕人的信任","外包決定"]],["傳道者實驗",["日光之下","盡是虛空","敬畏神"]],["心中的永恆",["傳3:11","神聖感知","AI沒有永恆"]],["智慧的樣子",["傳5:1-2","安靜聆聽","向主交帳"]],["神的道路",["賽55:8-9","饒恕與愛仇敵"]],["下一代",["會用不被控","智慧來自日光之上"]]]},"fw":[["現象","AI耶穌與年輕人"],["鏡子","傳道者的實驗"],["人性","心中的永恆"],["智慧","在神面前聆聽"],["對照","神的道路高過理性"],["責任","教導下一代"]],"q":["AI被鎖在日光之下，永遠觸不到日光之上。","它可以記得你的名字，卻永遠不會認識你。","別把屏幕的熒光錯當成上帝的榮光。"],"fb":null},{"id":22921,"slug":"indias-good-looks-economy-and-the-gospels-better-vision","title":"印度的顏值經濟與福音更美的異象","date":"2026-07-26","author":"Mathew Santhosh Thomas","cats":["社会与时事"],"tags":["技術","健康","掌控","醫美","養生"],"sum":"印度的美容個人護理產業預計2030年達400億美元，「美貌溢價」使外表成為經濟資本，而「好看」常等於「看起來年輕」、推遲衰老。健康食品與養生產業規模逾一兆美元，食物被視為預防藥物；健康追蹤設備從計步器進化為全方位監測，也成為身份象徵。作者提出三重心靈挑戰：觀念——照顧身體是好的，但聖灰星期三提醒人本是塵土；身份——量測工具反過來定義我們，從打理形象滑向打造身份；偶像崇拜——好的渴望佔據太多就成了偶像，人為數據犧牲平安、為完美犧牲同在。此外，這些討論多屬中產以上，全球仍有大量人缺乏基本生存。福音讓我們看顧身體而不敬拜身體，把美與健康當恩賜而非神明，並為受苦的人傾倒自己。","pts":["顏值經濟快速成長，外貌成為經濟資本","好看常被等同於看起來年輕","養生產業把食物當作預防藥物","健康追蹤設備成為文化身份象徵","承認必死，反而讓人活得清醒謙卑","量測工具可能反過來定義我們","好的渴望佔據過多，就成了偶像","全球大量人口連基本生存都成問題","看顧身體，但不敬拜身體"],"mm":{"c":"顏值經濟與福音","b":[["三大產業",["美容護理","健康飲食","健康追蹤"]],["觀念",["身體是聖殿","你本是塵土"]],["身份",["數據定義自我","打造身份的壓力"]],["偶像",["為某物而活","犧牲平安與喜樂"]],["公義缺席",["40%缺基本所需","自我膨脹"]],["福音秩序",["恩賜非神明","在基督裡的身份","為他人傾倒"]]]},"fw":[["現象","印度的顏值經濟"],["延伸","養生與健康追蹤"],["挑戰一","觀念"],["挑戰二","身份"],["挑戰三","偶像崇拜"],["盲點","公義的缺席"],["福音","重新排序美好人生"]],"q":["我們追蹤的是健康，還是我們自己？","看顧身體，但不敬拜身體。","偶像從不滿足，也從不讓人安息。"],"fb":null},{"id":22911,"slug":"meet-gen-z-pastor","title":"認識Z世代牧師","date":"2026-07-25","author":"Sarah Eekhoff Zylstra","cats":["教会事工"],"tags":["牧師","實習","Z世代","培養"],"sum":"美國神學院道學碩士入學人數多年來首次回升，第一波Z世代準牧師正進入事工。文章訪談多位導師與年輕領袖，勾勒這代人的矛盾特質：靈性認真、渴慕屬靈操練與純正教義，但注意力被手機切碎、讀寫能力較弱；對權威高度懷疑、會即時查證講員，卻又渴望宗派的根基與問責，禮儀性傳統因此吸引人；選擇極多又成長於高度安排的環境，因而缺乏自信、晚熟；色情與分心的爭戰更猛烈，但他們也更坦誠、更努力對抗；重視休息與界限，有時被誤認為懶惰。教會的實習與駐牧項目能在真實事奉中建立合宜的自信，導師們對未來大多樂觀。","pts":["道學碩士入學人數多年來首次增長","Z世代屬靈上認真，渴慕深度與操練","手機使注意力渙散，讀寫能力較弱","懷疑權威，卻渴望根基與問責","被禮儀性、有傳統的教會吸引","缺乏自信、晚熟，實習項目有助建立信心","網路名聲短暫空洞，面對面牧養才有持久影響","色情問題普遍，但他們也爭戰得更努力","重視休息與界限，需要學習工作的呼召"],"mm":{"c":"Z世代牧師","b":[["趨勢",["神學院入學回升","年輕男性回到教會"]],["靈性",["認真渴慕","純正教義","體驗式信仰"]],["權威",["即時查證","懷疑機構","渴望宗派根基"]],["自信",["晚熟","實習駐牧","真實事奉中成長"]],["爭戰",["手機成癮","AI代思考","色情"]],["前景",["重視休息","渴望真實","導師樂觀"]]]},"fw":[["人物","從不想去教會到想當牧師"],["背景","年輕躁動歸正運動之後"],["特質一","靈性認真但分心"],["特質二","懷疑權威卻渴望問責"],["特質三","缺乏安全感"],["挑戰","手機、AI與色情"],["展望","前途光明"]],"q":["他們在台下用AI查證我講的每一句話。","網上的掌聲很短暫，面對面牧養才長久。","這一代面對前所未有的試探，也以前所未有的努力對抗。"],"fb":null},{"id":22906,"slug":"women-leaving-church-reverse","title":"姊妹們正在離開教會，讓我們扭轉這一趨勢","date":"2026-07-24","author":"Jen Oshman","cats":["基督徒生活"],"tags":["門訓","合一","姊妹事工"],"sum":"巴納調查顯示，2025年美國男性定期上教會的比例已高於女性，而且女性流失的速度跨越各個世代。作者回顧初代教會：耶穌以恩慈接納、觸摸、醫治女性，邀她們參與使命；在棄殺女嬰、雙重性道德標準的希羅世界裡，教會保護並尊重女性，因此格外吸引她們。如今情況改變：世俗職場提供女性發揮才幹與社群的機會，教會卻讓她們覺得「是給另一種女性的」；姊妹們身兼工作、照顧父母與孩子而疲憊不堪；虐待醜聞也削弱信任。作者不主張改變神學，而是改變活出神學的方式，提出五項建議：培養弟兄姊妹同工的文化、讓姊妹被看見、拆除參與的障礙、徵詢她們的意見、像裝備弟兄一樣門訓栽培姊妹。","pts":["女性參與教會的比例已低於男性","耶穌打破常規，以恩慈接納女性","初代教會因尊重女性而格外吸引她們","超過半數女性認為教會未平等對待男女","職場能發揮的恩賜，在教會反成負擔","姊妹們疲憊不堪，教會又難有歸屬感","虐待醜聞使女性對教會更加戒備","世界看似給尊嚴，實則以產出與外貌論價值","不改神學，但改變活出神學的方式"],"mm":{"c":"姊妹正在離開教會","b":[["數據",["男性43%","女性36%","跨世代流失"]],["初代教會",["耶穌接納女性","保護女嬰","尊重與參與"]],["原因",["職場機會","「另一種女性」","疲憊","信任下降"]],["福音更美",["世界的謊言","真實的價值"]],["五項建議",["弟兄姊妹同工","被看見","拆除障礙","徵詢意見","門訓栽培"]]]},"fw":[["數據","女性流失的趨勢"],["歷史","初代教會的吸引力"],["現況","感受改變了"],["分析","問題出在哪裡"],["行動","五個具體建議"],["結語","福音依然更美"]],"q":["失去姊妹，就是失去半個教會。","教會可以持守神學，也可以充分展現姊妹的價值。","願教會再次成為女性無法抗拒的地方。"],"fb":null},{"id":22903,"slug":"faith-and-faithfulness-in-a-world-redefined-by-technology","title":"信仰與忠心：技術時代的雙重反思","date":"2026-07-22","author":"Mathew Santhosh Thomas","cats":["社会与时事"],"tags":["危機","技術","人工智能","AI","創新"],"sum":"作者描繪技術新時代的應許：AI加速科學發現、基因編輯與器官打印、垂直農場與即時翻譯，有人認為人類正獲得昔日諸神的能力。但豐裕伴隨脆弱：生態崩壞、成癮與孤獨、資訊過載、不平等加劇、生物威脅，且AI發展可能快過人的智慧與治理能力。人們的回應可分為技術樂觀者、悲觀者、轉身不看的鴕鳥、會用不懂的實用者、審慎的技術人，以及被排除在外的人。基督徒的技術觀始於神的形像——創造力是恩典的禮物，但凡人手所觸都帶墮落印記，技術存在於創造、墮落、救贖、恢復的故事中。我們要學習分辨：它使人更有尊嚴還是侵蝕尊嚴？並在權能與危險並存的時代作搭橋的人。","pts":["新技術正在重塑人類生存的根本條件","有人視技術為使人成神的超越之路","力量越大，根基的裂縫越明顯","AI發展可能快過我們的智慧與倫理","六種回應：樂觀、悲觀、鴕鳥、實用、審慎、被排除","人的創造力反映神的形像","技術既放大美德也放大罪惡","分辨問題：它醫治還是傷害、尊重還是剝削","真正的盼望在基督已成就的事"],"mm":{"c":"技術時代的信仰","b":[["應許",["AI","基因工程","農業與翻譯"]],["脆弱",["生態","成癮孤獨","不平等","治理落後"]],["六種回應",["樂觀者","悲觀者","鴕鳥","實用者","審慎者","被排除者"]],["神學視角",["神的形像","墮落印記","救贖恢復"]],["分辨",["尊嚴","醫治或傷害","公義"]],["呼召",["搭橋的人","盼望在基督"]]]},"fw":[["現象","世界正在重組"],["應許","新時代的可能"],["隱憂","進步下的脆弱"],["回應","人們的六種姿態"],["神學","基督徒的技術觀"],["實踐","分辨與搭橋"]],"q":["問題不再是我們能否造出強大的技術，而是能否以智慧引導它。","技術是一件既反映神形像、又帶墮落印記的作品。","這世界想靠創新得救，我們傳揚的是已勝過死亡的救主。"],"fb":null},{"id":22901,"slug":"a-pastoral-reflection-on-ebola-and-the-risks-of-love","title":"關於埃博拉病毒和愛之風險的教牧思考","date":"2026-07-21","author":"Ndaba Mazabane","cats":["社会与时事"],"tags":["疾病","見證","關懷"],"sum":"剛果民主共和國是埃博拉疫情最頻繁的國家，2026年新一輪疫情已有近千例、兩百多人死亡。埃博拉最令人痛心之處，在於它透過照顧病人、清洗遺體等愛的行為傳播，喪葬習俗占相當比例的感染。受苦的人尋求解釋，有人視之為咒詛或巫術，也有人不信任醫療系統；基督徒要以謙卑與憐憫面對，但堅持真相：它是病毒，防疫措施是為保護生命。聖經同時呼召憐憫（「我病了你們看顧我」）與智慧（通達人見禍藏躲），在疫情中愛可能表現為保持距離、調整習俗。地方教會可提供正確資訊、陪伴哀傷家庭、與醫護同行；普世教會則當代禱、奉獻、關注並聆聽，因為一個肢體受苦，所有肢體一同受苦。","pts":["剛果經歷的埃博拉疫情次數居全球之冠","埃博拉藉照顧與喪葬等愛的行為傳播","放棄習俗似乎失去尊嚴，延續卻擴散疾病","人們常以咒詛或審判來解釋疾病","信仰不與真相對立","愛有時以保持距離的形式表達","每個人都承載神的形像，尊嚴須維護","教會是社群中最受信任的機構之一","一個肢體受苦，所有肢體一同受苦"],"mm":{"c":"埃博拉與愛的風險","b":[["現況",["剛果東部","近千病例","蔓延烏干達"]],["傳播",["照顧病人","清洗遺體","喪葬習俗"]],["誤解",["咒詛巫術","不信任醫療","尋求意義"]],["聖經回應",["憐憫","智慧","神的形像"]],["地方教會",["正確資訊","陪伴哀傷","與醫護同行"]],["普世教會",["代禱","奉獻","聆聽學習"]]]},"fw":[["處境","遙遠卻切膚的疫情"],["特徵","藉愛傳播的疾病"],["反應","誤解與尋求意義"],["原則","憐憫與智慧並重"],["呼召","教會的獨特角色"],["考驗","我們的見證"]],"q":["在這場疫情裡，愛的行為本身可能成為傳染的途徑。","保持距離，有時正是愛的表達。","別人的痛苦，也屬於我們每一個人。"],"fb":null},{"id":22898,"slug":"cost-avoiding-theology","title":"不談神學的教會，後來都怎樣了？","date":"2026-07-21","author":"Jacob Percy","cats":["圣经与神学"],"tags":["教義","信條","護教"],"sum":"早期教會發展教義，不是愛好抽象思辨，而是因為沉默代價太高。保羅警告不成熟的信徒會被異教之風搖動；教會若推遲闡明神學，權柄就悄悄轉移到直覺、魅力與情勢上。二世紀的諾斯底教師使用基督教詞彙，卻偷換詞義：視受造界為牢籠、淡化基督的人性、以隱祕知識取代信心。里昂的愛任紐為保護普通信徒而寫《駁異端》，指出謬誤總穿上迷人的外衣，於是教會把一向口傳的「信仰準則」明確化。今日模式相同：避談罪，會眾就不明白十字架；只問經文對我的意義，聖經就成了鏡子；淡化教義的一代會養出不認識教義的下一代。神學清晰不是重擔而是恩賜，是對羊群的愛，也是合一的根基。","pts":["教義的發展源於迴避問題的代價太高","不成熟會使信徒被異教之風搖動","推遲神學，權柄就轉移到直覺與魅力","諾斯底派用舊詞灌入新義","愛任紐為保護普通信徒而寫作","信仰準則把隱含的信念明確化","神學清晰保護使合一成為可能的根基","避談罪，會眾便不明白十字架","沉默保全不了合一，只會讓位給嗓門最大的人"],"mm":{"c":"迴避神學的代價","b":[["起因",["耶穌是主的認信","弗4:14"]],["諾斯底派",["熟悉的詞","偷換意義","隱祕知識"]],["愛任紐",["駁異端","信仰準則","保護信徒"]],["今日翻版",["避談罪","只問對我","教義失傳"]],["清晰是恩賜",["保護羊群","合一根基","事工核心"]]]},"fw":[["原則","沉默的代價高昂"],["歷史","諾斯底的偽裝"],["回應","愛任紐與信仰準則"],["經文","以弗所書4章的成熟"],["今日","迴避神學的後果"],["結論","清晰是愛的表達"]],"q":["謬誤最危險的時候，是它說著和我們一樣的話。","神學清晰不會造成分裂，反而保護合一的根基。","淡化教義的一代，會養出不認識教義的下一代。"],"fb":null},{"id":22896,"slug":"write-sermon-article","title":"從講章到文章：將口傳教導轉化爲書面內容","date":"2026-07-21","author":"Sarah Eekhoff Zylstraã€Jared Kennedy","cats":["教会事工"],"tags":["呼召","恩賜","寫作"],"sum":"牧者每週寫講章，也常寫郵件、靈修短文、卡片，風格本就因對象而異。作者給想把講章改寫成文章或部落格的牧者十項建議。像講道那樣寫的部分：用最好的開場鉤子；選定一個清晰的中心要點，例如找出經文中的墮落景況與福音的回應；以清楚的子要點與小標題展開；要呈現而非說教，用短小的故事；收尾要有力。不要像講道那樣寫的部分：去掉「今天我要講三點」的路線圖；記得讀者遠比會眾廣，要交代背景與預設；調整篇幅；不只解經也要說服，靠文字完成過渡；收斂幽默與諷刺，傾向溫柔厚道。牧者也是作者，因為神本身就是作者。","pts":["寫作風格本就因內容與對象而改變","開頭要用讓人想讀下去的鉤子","一篇文章只要一個清晰的中心要點","用小標題呈現子要點","故事要短小精悍","文章不需要路線圖，直奔主題","讀者不是你的會眾，要交代預設","文字要負責邏輯過渡與說服","幽默在文字裡容易被誤解，宜收斂"],"mm":{"c":"從講章到文章","b":[["像講道",["開場鉤子","一個要點","清楚分點","呈現不說教","有力收尾"]],["不像講道",["去掉路線圖","讀者更廣","調整篇幅","說服為主","收斂個性"]],["神學",["神是作者","寫作是牧職的一部分"]]]},"fw":[["問題","講章與文章有何不同"],["五項相同","像講道那樣寫"],["五項不同","不要像講道那樣寫"],["結語","值得磨礪的技藝"]],"q":["文章不是一段旅程，而是街上的一小段路，不需要地圖。","讀者膝上沒有攤開的聖經，你要替他們把路鋪好。","神本身就是一位作者。"],"fb":null},{"id":22886,"slug":"toy-story-5-christian-movie-review","title":"《玩具總動員 5》：孩子開心、父母扎心","date":"2026-07-19","author":"Brett McCracken","cats":["文化与艺术"],"tags":["影評","科技","養育","上癮"],"sum":"作者以一位八年級生感謝父母讓他沒有智慧型手機、「多做幾年孩子」開場，認為《玩具總動員5》的核心正是「讓孩子做孩子」。片中反派是一台兒童平板，邦妮藉它結交的網友慫恿她「裝大人」，舊玩具們被冷落，甚至感嘆玩具比不上什麼都能做的科技。作者坦承最大的難題是父母自己也整天盯著螢幕，孩子是模仿者，身教比言教更重要。他欣賞影片區分以想像力為本的「玩耍」與算法驅動的「遊戲」，並主張科技最好的用途是促成線下的真實聯結。諷刺的是，這部鼓勵玩耍的電影本身也要看兩小時螢幕；但它對父母的激勵可能比對孩子更大。","pts":["「讓孩子多做會兒孩子」成為文化共識","影片回歸較傳統、適合兒童的價值觀","反派是一台兒童平板","科技讓孩子長大得太快","父母自己的螢幕習慣是最大的難題","孩子是天生的模仿者，身教勝過言教","玩耍是主動想像，遊戲是被動上癮","科技最好用來促成線下的真實聯結"],"mm":{"c":"《玩具總動員5》","b":[["開場",["沒有手機的八年級生","等到八年級運動"]],["故事",["平板反派","邦妮的網友","被冷落的玩具"]],["父母難題",["自己盯螢幕","只許州官放火"]],["玩耍vs遊戲",["想像力","算法上癮","面對面"]],["反思",["輪胎鞦韆","焦慮的一代","先活出好習慣"]]]},"fw":[["引言","畢業典禮上的感謝"],["主題","讓孩子做孩子"],["衝突","玩具對上科技"],["自省","父母的示範"],["區分","玩耍與遊戲"],["結論","電影更激勵父母"]],"q":["童年轉瞬即逝，不需要科技讓它更快結束。","父母怎麼用手機，比對孩子說什麼更重要。","在真實世界過度保護，在虛擬世界卻保護不足。"],"fb":null},{"id":22884,"slug":"reading-summer-2026","title":"今年夏天，你可以讀這些書","date":"2026-07-18","author":"Andrew Spencer","cats":["文化与艺术"],"tags":["書評","書單"],"sum":"這是福音聯盟編輯們的2026夏季書單，涵蓋屬靈、教養、文學與歷史。推薦包括：描寫一位女性一生在信心中成長的《天堂在召喚》、十九世紀談家庭的《打造家園》、談創意工作節奏的《意外的創意》；教孩子堅韌的《有能力》、可選結局的兒童冒險書、默想詩篇139篇的書；路易斯傳記、《華氏451度》、哈珀·李文集；《長襪子皮皮》、羅伯特·卡羅談寫作的《工作》、《巴貝特之宴》；兒童選書指南、《遠去的湖》、宣教士家庭面對毒癮者的回憶錄；《時間的皺褶》、《如何閱讀詩篇》、透過信仰欣賞藝術；《大河戀》、原子彈口述史、鮑威爾與西部開拓；本·薩斯談成年危機、托爾金與路易斯在二戰中、圖解經濟學；棒球、在舊約中認識基督、偵探小說《瘦子》。","pts":["暑期閱讀可以輕鬆，也可以深刻","古老的家庭與敬虔書籍能照出現代盲點","休息時正適合反思工作的方式","教養書幫助父母放手讓孩子自立","詩篇139篇提醒我們被神認識","《華氏451度》警示不再閱讀的時代","《巴貝特之宴》談感恩與慷慨","好書單也能成為與人交流的話題"],"mm":{"c":"2026夏季書單","b":[["屬靈成長",["天堂在召喚","被知道被珍愛","漸顯的奧祕"]],["家庭教養",["打造家園","有能力","滋潤孩子心靈的蜜"]],["經典文學",["華氏451","時間的皺褶","大河戀","巴貝特之宴"]],["傳記歷史",["成為路易斯","原子彈口述史","中土之戰"]],["工作創意",["意外的創意","卡羅的工作"]],["輕鬆讀物",["長襪子皮皮","瘦子","棒球50瞬間"]]]},"fw":[["引言","待讀書堆的樂觀"],["推薦者1–4","阿克曼、布里斯利、漢森、希爾"],["推薦者5–7","霍華德、肯尼迪、麥克拉肯"],["推薦者8–9","斯賓塞、茨爾察"]],"q":["待讀的書堆，證明我相信自己會長壽。","休息時間，往往是重新審視工作的最佳時機。","與其被機器內容淹沒，不如為身邊的人擺上一場真實的盛宴。"],"fb":null},{"id":22882,"slug":"parenting-age-ai","title":"「AI 對孩子並不安全」：在 AI 時代作未雨綢繆的父母","date":"2026-07-18","author":"Sarah Eekhoff Zylstra","cats":["信仰与工作"],"tags":["試探","養育","人工智能","AI","批判性思維"],"sum":"這是一集播客式報導：媒體多擔心AI衝擊經濟與工作，但過去智慧型手機與社交媒體的教訓顯示，最易受傷的是孩子。作者採訪專家與父母，聚焦三個領域。教育：學校普遍配發設備，AI造成作弊、相對主義與「認知卸載」，研究顯示用AI寫作或解題的人記得更少；AI是生產工具而非學習工具，父母可主動要求紙本或親自陪伴，有母親在旁主導對話、用AI輔導女兒數學。情感：AI陪伴被刻意設計得諂媚、令人依戀，已有青少年自殺的悲劇；它提供沒有風險的關係，卻奪走真實的親密。就業：許多恐慌是「氛圍報導」，AI暫未明顯減少工作；最好的預備是不靠電腦的能力、學習的意願與面對面溝通。結論：AI目前不是對孩子安全的技術，像電鋸一樣需要循序漸進教導，並以身作則。","pts":["受AI衝擊最深的可能是孩子","學校全面數位化，AI成為作弊管道","AI可能讓年輕人走向相對主義","付出的功夫越多，學到的越多","AI是生產工具，不是學習工具","父母是孩子教育的最終負責人","AI陪伴被刻意設計得令人依戀","AI關係給人好處卻沒有風險，如同色情","AI尚未明顯減少就業，許多恐慌是渲染","最好的預備是不需電腦的能力與學習意願","AI像電鋸，要循序漸進地教"],"mm":{"c":"AI時代的父母","b":[["教育",["作弊","相對主義","認知卸載","父母主導"]],["情感",["諂媚設計","AI伴侶","自殺悲劇","取代真實親密"]],["就業",["氛圍報導","放射科與會計","不靠電腦的能力"]],["神學",["基督居首位","AI不是人","神為孩子有計劃"]],["實踐",["嚴密看護","家庭晚餐","教孩子游泳","電鋸比喻"]]]},"fw":[["引言","我們看錯了擔憂的方向"],["領域一","教育"],["領域二","情感"],["領域三","就業"],["原則","保護、裝備、門訓"],["結論","不是對孩子安全的技術"]],"q":["我們不是想取代谷歌，而是想取代你媽——這句玩笑已經笑不出來了。","目標不是讓孩子永遠不下水，而是教他們游泳。","說AI目前不適合孩子，不等於反對技術。"],"fb":null},{"id":22879,"slug":"body-keeps-score-mind-heart","title":"身體記下了傷痕，心靈與頭腦也未曾忘記","date":"2026-07-17","author":"Beth Claes","cats":["基督徒生活"],"tags":["心理","創傷","身心靈"],"sum":"范德考克的《身體從未忘記》影響深遠，它肯定創傷會烙印在神經系統、引發持續的身體反應，糾正了過去淡化創傷或只用屬靈方法處理的錯誤。作者肯定這點，但引用《系統神經科學前沿》的研究指出，其框架可能落入另一種化約主義：該研究認為大腦處理創傷後形成對危險的錯誤預判，身體是在回應大腦，而非違背大腦，因此心理與身體的干預都有效。聖經的人觀更進一步：人心、心智與身體彼此影響。應用上，幫助者不應偏重單一面向；倖存者的身體反應真實，但心智與信仰也是資源，人比純身體框架所暗示的更有能動性；教會不必退回純屬靈的方法，身體照護與屬靈成長可以並行。","pts":["《身體從未忘記》幫助大眾理解創傷","過去淡化創傷或只談屬靈，刺痛了受苦者","創傷是整個人對真實傷害的回應","新研究指出認知預判在創傷反應中居核心","身體在回應大腦，而非違背大腦","心理與身體的干預都有證據支持","聖經人觀：心、心智、身體彼此交織","倖存者不只能任憑神經系統擺佈","身體照護與屬靈成長可以並行"],"mm":{"c":"身心靈與創傷","b":[["范德考克",["創傷烙印身體","廣受推薦","糾正淡化"]],["新研究",["錯誤預判","認知僵化","身體回應大腦"]],["聖經人觀",["人心","心智","身體"]],["應用",["幫助者整全看待","倖存者的能動性","教會不二選一"]],["盼望",["神的恩典","祂的同在","永恆家鄉"]]]},"fw":[["背景","一本暢銷的創傷書"],["肯定","身體確實重要"],["批評","以身體為中心的化約"],["研究","心智在創傷中的角色"],["神學","屬靈維度"],["應用","三項實際含義"]],"q":["創傷本質上不是屬靈問題，而是整個人對真實傷害的回應。","你的身體反應是真實的，但你不只是神經系統的囚徒。","身體照護與屬靈成長不是二選一。"],"fb":null},{"id":22865,"slug":"last-yrr-blogger","title":"最後一位改革宗博主","date":"2026-07-17","author":"Sarah Eekhoff Zylstra","cats":["信仰与工作"],"tags":["見證","寫作","博客"],"sum":"當許多改革宗博主逐漸停筆或轉向機構時，提姆·查理斯仍在自己的網站持續發文23年、累積近一萬五千篇。文章回顧他的家族史：顯赫的祖先、姑母與祖父相繼自殺的悲劇，以及父親信主後全家在庇廕所接觸改革宗神學的轉變。他十五歲信主，2003年起每天寫博客，因評論《標竿人生》與《耶穌受難記》而受矚目，並在YRR運動高峰期即時報導各大會。他坦承早年成了「批判型博主」、追逐點擊率，後來在良心責備下轉向以愛心引導人認識真理，也不再追蹤流量；擔任副牧師更使他學會理解人。2020年獨子尼克猝逝，他在博客上公開見證神的信實，朋友們說他因此更謙卑，寫作也更精煉深刻。","pts":["堅持獨立經營個人博客二十多年","家族經歷自殺悲劇，也經歷福音帶來的新生","以評論書籍與電影起步，成為YRR運動的重要聲音","早年追逐流量，寫作變得批判而傲慢","良心責備後轉向以愛心引導人","牧會經驗讓他更理解人生的複雜","獨子猝逝，他公開見證信心之錨穩住","苦難使他更謙卑，寫作也更精煉"],"mm":{"c":"最後一位改革宗博主","b":[["家族",["顯赫祖先","姑母與祖父自殺","父母信主"]],["起步",["2003年開始","評論標竿人生","即時報導大會"]],["轉變",["批判型博主","停止追蹤流量","副牧師經驗"]],["喪子",["尼克猝逝","公開見證","錨被釘痕的手握住"]],["今日",["獨立忠心","更精煉深刻","一個基督徒的生活記錄"]]]},"fw":[["現況","仍在寫博客的人"],["家族","死亡與新生"],["成長","童年與信主"],["事業","博客生涯與YRR"],["轉向","從批判到愛心"],["苦難","兒子離世"],["後來","更深倚靠主"]],"q":["寫負面評論帶來更多流量，卻讓我變成自己都不喜歡的人。","我來這裡不是講自己的故事，而是講神的故事。","錨穩住了，不是因為我剛強，而是因為它握在祂釘痕的手中。"],"fb":null},{"id":22863,"slug":"did-god-command-genocide","title":"神在《申命記》7 章下達的是「種族滅絕令」嗎？","date":"2026-07-15","author":"Andrew Wilson","cats":["圣经与神学","凯勒文化护教中心"],"tags":["倫理","種族滅絕","凱勒文化護教中心","聖戰"],"sum":"道金斯在《上帝的錯覺》中把舊約的神描繪得極其負面，至今仍被廣泛引用，部分原因是基督徒自己也對申命記7章「滅絕淨盡」的命令感到困惑。作者細讀經文：一、以色列是弱小的一方，得勝全靠神，這段歷史不能套用於強國欺凌弱國的現代戰爭；二、命令的核心是拜偶像，目的是潔淨聖地，是神學性而非族裔性的；三、經文說神會「漸漸」趕出列國，又禁止立約與通婚，顯示並非一次性殺光；四、拜偶像的以色列人亞干被除滅，悔改的迦南人喇合卻得救並列入耶穌家譜；五、古代戰爭文獻常用誇張語言，同樣字眼後來甚至用在以色列被擄上。因此這不是種族滅絕，也不給任何人殺戮的許可。聖經確實記載一場從伊甸到羔羊的聖戰，今日基督徒的應用是對自己生命中的罪與偶像決絕抵抗。","pts":["道金斯對舊約神的攻擊至今仍有殺傷力","基督徒自己也對這類經文感到不安","以色列是小國，得勝全靠神","命令的核心理由是拜偶像","這是倫理與神學的審判，而非種族清洗","神「漸漸」趕出列國，並非一次殺盡","亞干被除滅，喇合得救","古代戰爭語言常帶誇張","今日應用：向自己的罪與偶像宣戰"],"mm":{"c":"申命記7章是種族滅絕嗎？","b":[["質疑",["道金斯","基督徒的困惑","多重難處"]],["經文世界",["弱小的以色列","神的作為","拜偶像"]],["細節",["漸漸趕出","不可通婚","亞干與喇合"]],["文學",["誇張語言","耶利米也用同詞"]],["聖戰",["從伊甸到羔羊","屬靈兵器"]],["應用",["推倒偶像","決絕抵抗罪"]]]},"fw":[["背景","新無神論二十年"],["難處","申命記7章為何難"],["經文","得勝出於神、焦點在偶像"],["細節","漸進征服與喇合"],["總結","不是種族滅絕"],["延伸","聖經中的聖戰"],["應用","向偶像宣戰"]],"q":["若你事奉假神，以色列人的身份救不了你；若你事奉真神，迦南人的身份也定不了你的罪。","我們為征戰中喪生的人不安，正是因為那位死在十字架上的神。","我們敬拜什麼，就會變成什麼。"],"fb":null},{"id":22851,"slug":"stone-still-preaches","title":"「石頭仍在呼叫」：三一教會重振阿伯丁花崗岩地標","date":"2026-07-14","author":"Sarah Eekhoff Zylstra","cats":["社会与时事"],"tags":["植堂","教堂","建堂"],"sum":"蘇格蘭阿伯丁是英國最世俗的城市之一，許多宏偉的花崗岩教堂已改成餐廳、公寓與酒吧。三一教會原是因性倫理問題脫離蘇格蘭長老會的會眾，在酒店宴會廳流浪多年，2018年買下市中心一座120年歷史、年久失修的五層教堂。疫情與俄烏戰爭使建材價格飆升，標價比預算多出180萬美元；一位捐贈者沒有借錢，而是出資請專業團隊協助。他們以戴德生「先是不可能，然後困難重重，最後大功告成」為北極星，分階段修繕約四年，2026年3月重新開放。牧師說建築如同以便以謝石，會持續作見證；如今教會已開辦研經室、戒癮事工與假期聖經學校，並優先服事城市貧困的一側。","pts":["阿伯丁許多教堂已改作他用","三一教會因堅守聖經性倫理而失去堂址","長期在酒店聚會，難以開展事工","教會建築是神在社區作工的有形記號","花崗岩教堂如同以便以謝石","物價飆升使工程看似不可能","捐贈者給的不只是錢，而是陪伴與專業","分期推進：不放棄，也不期待奇蹟","重新開放後優先服事城市的貧困一側"],"mm":{"c":"石頭仍在呼叫","b":[["背景",["最世俗的城市","教堂變酒吧"]],["三一教會",["脫離蘇格蘭長老會","酒店聚會","攢錢購堂"]],["建築",["120年老教堂","市中心","以便以謝石"]],["不可能",["疫情與戰爭","超支180萬","捐贈者的回應"]],["困難重重",["分期施工","四年","繼續信靠"]],["大功告成",["2026年3月重開","戒癮事工","向左走"]]]},"fw":[["開場","又要改成酒店嗎？"],["歷史","流浪的會眾"],["決定","買下整座老教堂"],["階段一","不可能"],["階段二","困難重重"],["階段三","大功告成"],["展望","服事城市"]],"q":["石頭不會停止作見證：它要麼與你一同見證，要麼見證你的不是。","先是不可能，然後困難重重，最後大功告成。","你看不見路，這不正是要繼續信靠的原因嗎？"],"fb":null},{"id":22849,"slug":"jesus-meant-judge-not","title":"耶穌說「不要論斷」，到底是什麼意思？","date":"2026-07-13","author":"Rachel Gilson","cats":["圣经与神学","凯勒文化护教中心"],"tags":["謙卑","論斷","判斷"],"sum":"「耶穌說不要論斷人」常被用來結束道德討論，彷彿指出別人錯了，自己就錯了。作者從三方面澄清：詞語——英文judge與希臘文krinō都有多重意思：法官式的定罪宣判、私下的分辨、公開表達看法；語境——登山寶訓本身就嚴肅談論罪、公義與地獄，耶穌甚至吩咐人去掉弟兄眼中的刺，可見並非禁止分辨；聽眾是重視宗教表現、容易假冒為善的猶太人，耶穌要提升他們的道德分辨、削弱以宗教表現定人罪的傾向，所以「不要論斷」是指不要自居審判者、宣告自己無罪而定別人有罪；愛——不可拿這篇文章當板磚打人，要先去掉自己的梁木，但去掉梁木是為了看清楚去幫助弟兄，愛包括天天彼此勸勉。","pts":["「不要論斷」常被用來阻止道德討論","每個詞的意思要看它怎麼被使用","judge有定罪、分辨、公開表態等多種意思","登山寶訓本身充滿道德教導","耶穌吩咐人去掉弟兄眼中的刺","真正的意思是：不要自居審判者定人的罪","糾正人之前，要先謙卑省察自己","去掉梁木是為了看清楚去幫助人","愛包括天天彼此勸勉"],"mm":{"c":"不要論斷","b":[["誤用",["結束討論","說我錯就是你錯"]],["詞語",["法官判決","私下分辨","公開表態"]],["文學語境",["登山寶訓","罪與地獄","弟兄眼中的刺"]],["社會語境",["猶太聽眾","假冒為善","以表現定人"]],["愛",["先去梁木","溫柔或嚴責","彼此勸勉"]]]},"fw":[["現象","一句話終結對話"],["原因","出處權威、字面似通"],["詞語","judge的多重意義"],["語境","文學與社會背景"],["結論","不要自居審判者"],["應用","用愛心彼此勸勉"]],"q":["耶穌叫你去掉梁木，不是叫你從此別管弟兄。","我們不握有最終定罪的權柄，但仍要一同分辨主的旨意。","愛是甘冒風險說出有益的指正。"],"fb":null},{"id":22847,"slug":"response-bart-ehrman","title":"沒有基督教，還能有基督教倫理嗎?——回應巴特·埃爾曼","date":"2026-07-11","author":"Sarah Eekhoff Zylstraã€Michael J. Kruger","cats":["圣经与神学"],"tags":["護教","經文鑑別學","播客"],"sum":"新約學者、懷疑論者埃爾曼出版新書，稱讚耶穌「愛陌生人、愛仇敵」的教導如何塑造西方道德良知。曾是他學生的新約學者克魯格回應：這教導在古代確實革命性——希羅宗教不把倫理與信仰相連，瘟疫中權貴與名醫逃走，留下照顧病人的是基督徒；但埃爾曼只取這一項，忽略同樣革命性的性倫理。他要求基督徒言行一致，這點正確（耶穌最反對假冒為善），但他自己作為唯物論無神論者，卻無法為道德「應當」提供根基；邪惡問題對無神論其實更難。克魯格逐一回應埃爾曼對福音書的質疑：所謂矛盾多可解釋；口傳由可靠的見證人與早期信條傳承，並非傳話遊戲；福音書標題從未匿名流傳，且與目擊者緊密相連；群體幻覺說服力不足。埃爾曼總把標準不斷移高，像另一種基要主義。克魯格說，自己越深入研究越受鼓舞。","pts":["耶穌愛仇敵的教導在古代確實革命性","古代宗教不以倫理為核心","基督徒在瘟疫中留下照顧病人","基督教性倫理同樣具革命性","言行不一正印證人人是罪人的教導","唯物論無法為道德「應當」提供根基","福音書的「矛盾」多可合理解釋","口傳由正式見證人可靠傳遞","福音書從未匿名流傳","歷史給的是可能性，不是數學證明"],"mm":{"c":"回應巴特·埃爾曼","b":[["背景",["從福音派到無神論","克魯格曾是他學生"]],["愛陌生人",["古代革命性","瘟疫中的基督徒","忽略性倫理"]],["一致性",["基督徒要言行一致","無神論也要一致","道德根基"]],["邪惡問題",["基督教有答案","無神論更難解釋"]],["福音書可信",["所謂矛盾","口傳與信條","作者身份","復活與幻覺"]],["方法問題",["球門柱後移","另一種基要主義"]]]},"fw":[["介紹","埃爾曼與新書"],["肯定","愛仇敵的革命性"],["批判","挑揀式的基督教倫理"],["哲學","無神論的道德根基"],["歷史","福音書可靠性的三個質疑"],["方法","不斷移高的標準"],["見證","研究越深越受鼓舞"]],"q":["基督徒的言行不一，正是我們需要赦免的證據。","在只有分子的宇宙裡，只有「是如此」，沒有「應當如此」。","不要把證明和說服混為一談。"],"fb":null},{"id":22845,"slug":"a-brief-history-of-youth-ministry","title":"青少年事工簡史","date":"2026-07-10","author":"Dave Wright","cats":["教会事工"],"tags":["門訓","門徒","青少年事工"],"sum":"許多數據顯示青少年事工成效不彰：多數年輕人高中畢業後離開教會，信仰被概括為「道德主義治療性自然神論」。作者回顧歷史：1940年代「青年生命」以成人與青少年的友誼傳福音，「青年歸主」從大型佈道轉向關係式事工；70年代教會開始聘請青年牧師，引進關係式路線，卻走向以吸引人為主；80年代受MTV影響，聚會越來越娛樂化，信息不斷簡化；到了21世紀，孩子對這些節目也不感興趣了。結果是：青少年被隔離於全會眾之外，畢業後無處可去；娛樂化遮蔽了福音；只求決志不帶門徒；養出消費心態的一代。作者呼籲回到聖經，讓聖經塑造信息，也塑造事工的方式。","pts":["七成年輕人高中畢業後離開教會","許多青少年的信仰只是道德主義治療性自然神論","青年事工起源於機構的關係式佈道","教會聘請青年牧師後走向吸引人的模式","MTV時代使事工越來越娛樂化","青少年被隔離於全體會眾之外","娛樂化傳遞出「耶穌得夠酷才行」","只求決志，少做門徒","回到聖經，塑造信息與方法"],"mm":{"c":"青少年事工簡史","b":[["現況",["七成離開","信仰打不動人","道德治療自然神論"]],["1940年代",["青年生命","青年歸主","關係式佈道"]],["1970年代",["教會聘青年牧師","吸引人的模式"]],["1980年代以後",["MTV影響","娛樂化","信息簡化"]],["結果",["與會眾隔離","福音被遮蔽","缺乏門訓","消費心態"]],["出路",["回到聖經","福音為中心"]]]},"fw":[["問題","青年事工失敗了嗎？"],["40年代","機構事工興起"],["70年代","進入教會"],["80年代後","娛樂化"],["結果","四個後果"],["呼籲","以聖經塑造事工"]],"q":["我們以為耶穌得先包裝得夠酷，福音反而被遮蔽了。","學校與球隊都對孩子有要求，唯獨教會沒有。","聖經不只塑造我們傳的信息，也該塑造我們做事工的方式。"],"fb":null},{"id":22840,"slug":"church-encouraging-single-moms","title":"想讓單親媽媽感受到愛？教會可以這樣做","date":"2026-07-09","author":"Melissa LaCross","cats":["教会事工"],"tags":["養育","單親","單親父母"],"sum":"作者高中時懷孕，兒子出生後回到從小長大的教會，卻聽見育嬰室義工說「你這麼年輕怎麼就有孩子」，深感受傷；許多人對她沉默或尷尬。所幸她在兩間教會都遇到真正認識、愛她的姊妹。她分享教會鼓勵單親媽媽的六種方式：承認她的難處並述說真理，陪她哀悼失去的、耐心聽她的疑問；看見標籤背後的人，不把她當待修補的問題；一起玩樂，分享生活；愛她的孩子，弟兄們成為孩子生命中的男性榜樣；提供實際幫助，如看顧孩子、送日用品；鼓勵她服事，不因過去的罪拒絕她。雅各書1:27呼召教會看顧患難中的孤兒寡婦。","pts":["一句無心的話可能深深刺痛單親媽媽","沉默與尷尬同樣讓人孤單","承認難處，而不是給廉價答案","不要讓標籤定義一個人","友誼也可以輕鬆、一起玩樂","愛她的孩子，弟兄可成為男性榜樣","具體幫助：看孩子、送日用品","讓她服事，把經歷化為祝福"],"mm":{"c":"教會與單親媽媽","b":[["經歷",["育嬰室的話","高中八卦","沉默尷尬"]],["一",["承認難處","陪伴哀悼","述說真理"]],["二",["看見人","不貼標籤","神珍愛的孩子"]],["三四",["一起玩樂","愛她的孩子","男性榜樣"]],["五六",["實際幫助","鼓勵服事"]],["呼召",["雅1:27","主動去愛"]]]},"fw":[["經歷","回到教會的第一個主日"],["渴望","被認識的友誼"],["方式1–2","承認難處、看見人"],["方式3–4","玩樂與愛孩子"],["方式5–6","實際幫助與服事"],["呼召","看顧孤兒寡婦"]],"q":["她們不把我當作要修補的問題，而是當作姊妹。","人們的猜測與過去的罪，都不能定義我。","神呼召教會作耶穌的手和腳。"],"fb":null},{"id":22836,"slug":"single-parents","title":"單親媽媽（或爸爸）希望你知道的三件事","date":"2026-07-08","author":"Tessa Reed","cats":["基督徒生活"],"tags":["單身","養育","單親"],"sum":"作者是獨自撫養女兒十年的單親媽媽，十年來只有一次有人主動問她「你的日子怎麼過」，讓她當場落淚。她代表單親父母說出三個需要：一、需要喘口氣——兩人的工作落在一人身上，還有心碎、官司、創傷等看不見的重擔，請陪伴孩子、帶他們出去、教他們技能，也和他們談信仰；二、需要一個家——單親父母容易不健康地依賴孩子，需要不同年齡與階段的弟兄姊妹陪伴，弟兄能提供敬虔的男性視角，主動邀約很重要，而單親父母也有恩賜可以回饋；三、需要帶領與輔導——沒有配偶提醒，容易陷入孤立、苦毒或在戀愛中尋求滿足，請主動關心、一同禱告查經，溫柔地督責。","pts":["一個簡單的問候能讓人感到被看見","單親育兒是在艱難中做雙倍的事","陪伴孩子就是替父母卸下重擔","單親父母容易不健康地依賴孩子","需要不同人生階段的主內家人","弟兄能幫助單親媽媽理解男性視角","主動邀約，因為他們很累","單親父母也有恩賜可以分享","需要成熟信徒溫柔的帶領與督責"],"mm":{"c":"單親父母的三個需要","b":[["喘口氣",["雙倍的事","看不見的重擔","陪伴孩子"]],["一個家",["避免依賴孩子","跨世代友誼","男性視角","主動邀約"]],["帶領輔導",["仇敵想孤立","需要督責","一起禱告查經"]],["第一步",["問一句：你過得如何？"]]]},"fw":[["開場","十年來唯一的問候"],["需要一","喘口氣"],["需要二","一個家"],["需要三","帶領與輔導"],["行動","主動問候"]],"q":["單親育兒，就像在艱難處境中做著雙倍的事。","別因為你們人生階段不同，就以為自己幫不上忙。","一句「你過得怎麼樣？」可能就是讓人被看見的開始。"],"fb":null},{"id":22834,"slug":"mundane-life-courageous-life","title":"勇敢，其實藏在平凡的每一天","date":"2026-07-08","author":"Alan Noble","cats":["基督徒生活","凯勒文化护教中心"],"tags":["勇氣","畏懼","美德"],"sum":"說到勇敢，我們想到急救人員與軍人，但平凡生活同樣需要勇氣：分享信仰、選擇職業、結交朋友、戀愛結婚、為人父母、忍受苦難，甚至在抑鬱時起床。皮柏說勇氣是為了美善甘冒受苦的風險；文化卻教人不惜代價避免苦難。過度保護與魯莽一樣有害，會讓人錯過神所造世界的喜樂。研究顯示多數年輕男性因怕被拒絕而不敢約會，許多年輕人很少約會。作者認為除了科技，更因缺乏勇氣的操練；科技正是為遷就人的畏縮而設計。勇氣不是為冒險而冒險，而是為榮耀神而行動；不必無所畏懼，而是帶著懼怕仍去做難事。因基督已承擔刑罰，我們可以放膽行動，神的恩典每天早晨都夠用。","pts":["平凡的生活就是勇敢的生活","勇氣是為了美善甘冒受苦的風險","苦難是墮落世界生活的一部分","過度自我保護會攔阻人經歷祝福","許多年輕人因害怕被拒絕而退縮","科技產品被設計來遷就我們的畏縮","勇氣不是魯莽，而是為榮耀神","不必無所畏懼，只要果斷行動","帶著懼怕做難事，正是操練勇氣"],"mm":{"c":"平凡中的勇氣","b":[["兩種勇氣",["捨命救人","日常生活"]],["定義",["為美善冒受苦風險","敞開自己"]],["求穩代價",["錯過喜樂","不約會","不考駕照"]],["畏縮",["科技遷就","迴避面對面","不願承擔"]],["真勇氣",["為榮耀神","不是魯莽","帶著懼怕行動"]],["恩典",["愛除去懼怕","每早夠用","靠基督凡事能做"]]]},"fw":[["引言","另一種勇氣"],["定義","勇氣要求什麼"],["代價","求穩的害處"],["診斷","畏縮如何生根"],["澄清","勇氣與冒險"],["出路","憑勇氣走出恐懼"]],"q":["對有些人來說，在抑鬱中起床就是一次勇敢的行動。","過度保護和魯莽一樣有害。","勇氣不要求你無所畏懼，只要求你帶著懼怕仍去行動。"],"fb":null},{"id":22832,"slug":"artists-ignore-fall","title":"繞開墮落的美，還是美嗎？","date":"2026-07-07","author":"Ryan Currie","cats":["文化与艺术"],"tags":["苦難","情感","美"],"sum":"「光之畫家」金凱德想描繪一個沒有墮落的世界，作品銷量驚人，卻無法塗抹掉他自己被罪所苦的人生——他54歲時因飲酒過量去世。作者藉此反思：渴望迴避罪惡現實的藝術，如同渴望不付十字架代價的救贖。藝術有兩個極端：以墮落為榮的越界藝術，以及繞開破碎與邪惡的濫情藝術；斯克魯頓稱後者為信仰的疾病，讓人不必真正感受就向愛與悲傷致意。對濫情的渴望源於對真美的飢渴，若能引人敬拜是好的，但若只把注意力引向自身就危險了。基督徒的藝術品味應被創造、墮落、救贖、更新的故事塑造：不抹去墮落，也不沉溺黑暗。陀思妥耶夫斯基、卡拉瓦喬的作品展現帶著傷痕的救贖之美。藝術救不了我們，但可以指向救贖之美。","pts":["金凱德想畫出沒有墮落的世界","他的人生卻被墮落的現實所苦","迴避罪的藝術，如同想要不付代價的救贖","越界藝術以墮落為榮","濫情藝術以廉價的美迴避破碎","濫情若成為超越之美的替代品就危險","基督教藝術應包含創造、墮落、救贖、更新","福音的光正因黑暗的深重而更顯恢宏","藝術救不了我們，卻能指向救贖之美"],"mm":{"c":"繞開墮落的美","b":[["金凱德",["光之畫家","沒有墮落的世界","悲劇人生"]],["兩個極端",["越界藝術","濫情藝術"]],["媚俗",["斯克魯頓","信仰的疾病","不必真感受"]],["救贖之美",["四重故事","不抹去也不沉溺"]],["例子",["罪與罰","聖多馬的懷疑","帶傷痕的光"]],["結論",["藝術救不了人","指向超越的美"]]]},"fw":[["人物","金凱德的願景與人生"],["問題","迴避墮落的藝術"],["兩極","越界與濫情"],["標準","滿足人心的美"],["範例","被福音塑造的藝術"],["結論","指向救贖之美"]],"q":["想迴避罪惡現實的藝術，就像想要一種不付十字架代價的救贖。","福音的光，正因為黑暗如此深重而更顯恢宏。","我們塗抹不掉墮落，卻可以創作指向救贖的作品。"],"fb":null},{"id":22829,"slug":"ai-impressive-not-transcendent","title":"AI 固然驚人，卻絕非超越","date":"2026-07-06","author":"Clayton Chancey","cats":["文化与艺术"],"tags":["技術","偶像","神的形像","人工智能","AI"],"sum":"一篇AI論文把「超越」定義為模型輸出勝過訓練數據的平均水準，這個承載千年屬靈渴望的詞被掏空成技術術語，也透露出AGI競賽背後的意識形態——學者稱之為TESCREAL（超人類主義、奇點主義、長期主義等），它有自己的末世論與救贖論，卻不承認自己是宗教。作者以以賽亞書44章為鏡：同一塊木頭一半拿來烤火，一半雕成神像跪拜，差別只在人怎麼用。人是神的形像，AI則是「人的形像」，是破損形像的破損形像；能力勝過人，不等於本性勝過人。詩篇115篇說造偶像的要和它一樣，而今天的偶像甚至會回話，因此更具誘惑。拜偶像就是向非神之物尋求唯神能給的。技術專家們的渴望（不死、全知、護理）本身是好的，只是方向錯了；真正的超越在基督裡——祂是神本體的真像。作者呼籲科技界的基督徒在研究室與董事會中發聲：善用AI為工具，卻不把它當神敬拜。","pts":["「超越」被AI研究者重新定義為技術指標","TESCREAL意識形態有末世論與救贖論，卻不自認宗教","麥克盧漢：人會迷戀自身的延伸","伊里奇：工具越過臨界點，人便開始服侍工具","以賽亞書44章：同一塊木頭，一半燒火一半成神","AI是「人的形像」，放大我們的破碎","偶像的錯不在能力不足，而在它是受造之物","技術專家的渴望是對的，方向卻錯了","真正的超越在基督裡","科技界需要有神學根基的基督徒聲音"],"mm":{"c":"AI驚人卻非超越","b":[["詞語被掏空",["超越的分類學","技術術語"]],["新宗教",["TESCREAL","奇點末世論","技術救贖"]],["古老批判",["賽44章","一半燒火一半為神","詩115篇"]],["人的形像",["神的形像vs人的形像","能力不等本性","放大破碎"]],["錯置的渴望",["追尋復活","追尋全知","追尋護理"]],["真正超越",["基督是神的真像","以弗所銀匠","科技界的見證"]]]},"fw":[["引子","一篇論文的標題"],["意識形態","AI信徒"],["聖經","以賽亞書的反諷"],["神學","神的形像與人的形像"],["機理","拜技術偶像的徵兆"],["同情","正確的渴望、錯誤的方向"],["答案","在基督裡的超越"],["呼召","新銀匠時代的見證"]],"q":["AI或許能在表現上勝過它的源頭，卻無法在存在上勝過它。","能力更強的偶像，並不因此少幾分偶像的本質。","他們是在朝著天堂挖地洞。"],"fb":null},{"id":22827,"slug":"250-years-later-canada-america-and-the-gift-of-difference","title":"250 年後：美加之別，天賜之禮","date":"2026-07-05","author":"Andrew Noble","cats":["社会与时事"],"tags":["自由","身份","歸屬"],"sum":"加拿大兩位政治領袖各講一套建國故事，卻都刻意避開美國。值此美國建國250年，作者以加拿大基督徒身份反思兩國之別。1776年北方沒有人簽署《獨立宣言》，數萬效忠派北遷，塑造了加拿大忠誠、不好爭鬥、有禮的性情。他認為美國立國於理念（如無代表不納稅），良莠並存；加拿大則立國於技術——卑詩省因一條橫貫鐵路而加入聯邦，加拿大也因此產生麥克盧漢、格蘭特等技術思想家。借用楚曼的說法，美國把自由放首位，加拿大把歸屬放首位，兩者都合乎聖經，唯有在基督的身體裡才能兼得。兩國起點都充滿罪惡，不該美化過去；傑斐遜把「神聖不可否認」改為「不言而喻」，提醒我們別忘了這些價值的真正源頭。差異是一份禮物，彼此能看見對方的盲點。","pts":["加拿大身份部分來自對美國革命的拒絕","效忠派北遷塑造了加拿大的性情","美加的差異對雙方都有益","美國立國於理念，加拿大立國於技術","加拿大孕育出重要的技術思想家","美國偏重自由，加拿大偏重歸屬","獨立本身不是美德，人受造是為了歸屬","兩國的起點都罪惡猖獗，不必美化","平等、生命、自由並非不言而喻，而源於基督信仰"],"mm":{"c":"美加之別","b":[["起源故事",["卡尼與博勵治","都避開美國"]],["拒絕革命",["效忠派北遷","我不是美國人"]],["理念vs技術",["無代表不納稅","橫貫鐵路","麥克盧漢"]],["自由vs歸屬",["楚曼","獨立非美德","在基督裡兼得"]],["真正的源頭",["不美化過去","不言而喻的錯覺","認出賜予者"]]]},"fw":[["背景","兩套建國敘事"],["歷史","加拿大拒絕革命"],["對比","理念與技術"],["神學","自由與歸屬"],["提醒","別忘了真正的起源"],["禱告","為兩國求福"]],"q":["差異是一份禮物：別人的眼睛最能看見我們的盲點。","我們受造，是為了歸屬於神，也歸屬於彼此。","我們暢遊在基督教文化的益處裡，卻渾然不覺自己是濕的。"],"fb":null},{"id":22821,"slug":"love-gen-z-employees","title":"愛你的Z世代員工（也與他們好好共事）","date":"2026-07-03","author":"Sarah Eekhoff Zylstraã€Erica Roth","cats":["信仰与工作"],"tags":["職場","建議","Z世代"],"sum":"媒體說Z世代是職場「迷失的一代」：較少打工經驗、求學多在線上、依賴AI，被認為缺乏主動性與溝通能力。工程公司招聘主管埃麗卡·羅斯接受訪談，說明每一代都有學習曲線，但Z世代確實不同：他們重視工作與生活平衡、較不願加班，公司以補休輪班因應；他們期待有明確的職涯路徑、反饋與帶教，公司因此訓練主管成為導師。他們擅長數位溝通，卻怕打電話與面對衝突。她以「凡事相信」教員工對他人作善意解讀，帶著好奇提問、修復關係。給Z世代的建議：不懂就問、觀察他人、主動求反饋、建立關係；給年長同事的建議：講清楚期望與溝通偏好，說明反饋是幫助成長的禮物，並享受新世代帶來的新視角。","pts":["Z世代被貼上準備不足的標籤","每一代進入職場都有學習曲線","Z世代重視工作與生活平衡","他們想要明確的路徑、反饋與帶教","擅長數位溝通，卻怕電話與衝突","衝突時我們常給對方安上動機","凡事相信：作善意的解讀","不懂就問，主動求反饋","年長同事要說清期望，把反饋當禮物"],"mm":{"c":"與Z世代員工共事","b":[["標籤",["迷失的一代","缺乏主動"]],["差異",["工作生活平衡","不願加班","少打工經驗"]],["需求",["職涯路徑","反饋","帶教"]],["溝通",["數位擅長","怕衝突","善意解讀"]],["給Z世代",["不懂就問","觀察","求反饋","建立關係"]],["給年長者",["講清期望","反饋是禮物","享受新視角"]]]},"fw":[["背景","媒體對Z世代的評價"],["分析","世代差異"],["摩擦","加班與界限"],["培訓","管理者成為導師"],["衝突","以神學眼光修復關係"],["建議","給新人與資深同事"]],"q":["我們替別人安上動機的那一刻，罪就悄悄進來了。","冰冷的文字裡容易讀出諷刺，也同樣有機會讀出善意。","反饋是一份幫助你成長的禮物。"],"fb":null},{"id":22819,"slug":"kids-faith-simpler","title":"信心中養育兒女，比你想像的要簡單","date":"2026-07-03","author":"Joe Carter","cats":["社会与时事"],"tags":["養育兒女","家庭","爲人父母"],"sum":"社會學家的新報告發現，決定孩子成年後是否持守信仰的最大因素是父母，而非教會、青年團契或同儕。美國信仰衰退主要是代際性的：每一代進入成年時都比上一代更不信，因此衰退會越來越快；信仰常不是被拒絕，而是被擠出生活。父母每週上教會、每天禱告、看重信仰，孩子延續的比例明顯更高；最有力的預測因素是主動、說出口的信仰——一起禱告、飯前謝恩、每週多次談論信仰的家庭，孩子成年後委身的可能性是兩倍多。父親的參與、穩定的婚姻、親子關係與教會群體也很重要。作者指出許多父母因怕說教而沉默，孩子卻把沉默解讀為信仰不重要。在開車、看網路新聞時自然談論信仰，坦然面對難題。即便如此也無保證，父母只是園丁，生長唯獨屬聖靈。","pts":["父母是孩子信仰最大的影響因素","信仰衰退是代際性的，會越來越快","信仰常被忙碌擠出生活，而非被拒絕","父母的信仰習慣大幅提高孩子延續的比例","最有力的是說出口的信仰：一起禱告、談論","每週多次談論信仰，孩子委身率高出一倍多","父親的參與格外重要","父母的沉默被孩子解讀為信仰不重要","父母是園丁，使人生長的是聖靈"],"mm":{"c":"在信心中養育兒女","b":[["報告",["薪火相傳","父母最關鍵"]],["衰退",["代際性","雪崩加速","被擠出生活"]],["數據",["每週聚會","每天禱告","看重信仰"]],["關鍵做法",["一起禱告","飯前謝恩","每週談論"]],["其他因素",["父親","婚姻","親子關係","教會第二層巢"]],["盼望",["不必說教","坦承不知","園丁與聖靈"]]]},"fw":[["發現","父母是最大因素"],["背景","信仰的代際衰退"],["數據","父母行為的影響"],["誤區","用力太輕"],["實踐","自然地談論信仰"],["信靠","生長屬於聖靈"]],"q":["孩子沒有把父母的沉默解讀為尊重，而是解讀為信仰不重要。","信仰常常不是被拒絕，而是被擠出了生活。","我們是園丁，使之生長的唯有聖靈。"],"fb":null},{"id":22813,"slug":"are-you-filled-spirit","title":"你真的被聖靈充滿了嗎？","date":"2026-07-02","author":"Guy Waters","cats":["圣经与神学","卡森神学更新中心"],"tags":["使徒","聖靈"],"sum":"作者大學時被問「你被聖靈充滿了嗎」而答不出來，如今從聖經整理答案。誰被聖靈充滿？使徒行傳中五旬節的眾信徒、受審的彼得、禱告的教會、保羅都被聖靈充滿；五旬節前的施洗約翰與他的父母也是；以弗所書5:18更吩咐歷世歷代的信徒都要被聖靈充滿。它不是少數成熟信徒的特殊等級，但只有聖靈內住的基督徒才能被充滿。什麼意思？是聖靈持續裝備信徒，賜下遵行神命令所需的恩典，在路加著作中尤其指向放膽傳講基督的救贖。如何被充滿？保羅以醉酒對比——不被酒掌管，而被聖靈掌管；被充滿的生命表現為一同唱詩讚美、凡事感謝、在家庭與教會中按神的次序生活，對照歌羅西書，就是讓基督的道豐豐富富存在心裡。","pts":["聖靈充滿不只屬於使徒，也見於五旬節之前","以弗所書5:18是給所有信徒的命令","聖靈充滿不是少數人的高級祝福","唯有聖靈內住的基督徒能被充滿","聖靈充滿是持續裝備人遵行神的命令","在使徒行傳中常與放膽傳道相連","不被酒掌管，而被聖靈掌管","表現為唱詩、感謝、在關係中順服","被聖靈充滿就是讓基督的道豐富住在心裡"],"mm":{"c":"被聖靈充滿","b":[["誰被充滿",["使徒與眾信徒","施洗約翰一家","歷代信徒"]],["前提",["聖靈內住","非特殊等級"]],["意義",["持續裝備","遵行命令","放膽傳道"]],["如何",["弗5:18","不被酒掌管","西3:16"]],["表現",["唱詩讚美","凡事感謝","關係中順服"]]]},"fw":[["問題","你被聖靈充滿了嗎？"],["問題一","誰被充滿"],["問題二","是什麼意思"],["問題三","如何追求"],["應用","平凡日子中的應許與命令"]],"q":["被聖靈充滿，就是讓基督的道豐豐富富住在心裡。","不被酒所掌管，而被聖靈所掌管。","救主已將我們所需的一切賜給我們。"],"fb":null},{"id":22810,"slug":"shincheonji-the-cult-of-lee-man-hee-spreads-in-africa","title":"新天地異端正在非洲蔓延","date":"2026-07-02","author":"Herman Muhumuza N.","cats":["社会与时事"],"tags":["異端","邪教","新天地"],"sum":"韓國李萬熙1984年創立的「新天地」正在非洲至少17國擴張，常以免費聖經課程吸引無力就讀神學院的牧師與信徒。其手法包括偽裝成普通基督徒、滲透教會與小組、透過社群與交友軟體招募、與牧師簽合作備忘錄以「換招牌」，並要求成員投入大量時間、威脅離開者；他們把對人撒謊美化為「隱藏的智慧」。教義上，新天地否認三位一體、否認基督身體復活與可見再來（稱已於1966年無形發生），把李萬熙抬高到與基督同坐寶座，宣稱唯有加入新天地、接受其解經才能得救。作者以聖經回應：救恩唯獨藉恩典與信心，教會的根基是基督。建議信徒深入認識真耶穌、委身健康教會、持守唯獨恩典的福音，並以溫柔挽回受迷惑的人。","pts":["新天地以免費課程吸引缺乏資源的牧者","成員偽裝身份滲透教會與小組","與牧師簽協議，意圖奪取教會","把欺騙美化為屬靈智慧","否認三位一體","否認基督身體復活與可見再來","把李萬熙抬高到與基督同等","宣稱唯有加入新天地才能得救","最好的防範是深入認識真耶穌"],"mm":{"c":"新天地異端","b":[["背景",["李萬熙","1984年","非洲17國"]],["手法",["偽裝","滲透","合作備忘錄","控制"]],["欺騙",["隱藏的智慧","神恨惡謊言"]],["錯謬教義",["否認三一","否認復活再來","高舉李萬熙"]],["救恩",["加入才得救","違背唯獨恩典"]],["回應",["認識真耶穌","健康團契","溫柔挽回"]]]},"fw":[["現象","免費聖經課程的誘惑"],["介紹","新天地與李萬熙"],["手法","為真理撒謊"],["神學","上帝、耶穌與李萬熙"],["教會論","唯一真教會？"],["救恩論","從信基督到信個人"],["回應","警醒並扎根真道"]],"q":["辨認贗品最好的方法，是深入認識真品。","任何在基督之外另加中保的體系，都否定了十字架的完全。","對策不是疑神疑鬼，而是屬靈的分辨力。"],"fb":null},{"id":22805,"slug":"5-myths-about-the-book-of-romans","title":"對《羅馬書》的五種迷思","date":"2026-07-01","author":"Brian Rosner","cats":["圣经与神学","五种迷思"],"tags":["羅馬書","新約","迷思"],"sum":"作者澄清讀羅馬書常見的五種迷思。一、寫作目的不清？其實開頭與結尾已說明：宣教（盼望羅馬教會支持他往西班牙）、護教（為自己與所傳的福音辯護）、牧養（用福音堅固信徒）。二、救恩等於稱義？稱義是要義，但救恩還包括赦罪、算為義、收納為兒女、與神和好、脫離罪的轄制；基督的死既是代贖性的，也是代表性與榜樣性的。三、保羅逐題論述？許多主題貫穿全書，要像滾雪球而非打保齡球般閱讀，例如「心意」一題層層遞進。四、少提耶穌生平？其實勾勒出從先存、降生、受死、埋葬、復活、升天到再來的輪廓。五、倫理延到12–16章？前半部的稱義、救贖、自由、收養、與基督聯合正是順服的根基；1–3章對罪的描述本身就是道德教導。","pts":["羅馬書兼具宣教、護教與牧養目的","福音也是用來堅固信徒的","救恩不只稱義，還包括收養、和好、自由","基督的死是代贖、代表與榜樣","羅馬書要像滾雪球般閱讀","「心意」主題貫穿全書","羅馬書勾勒出耶穌從先存到再來的生平","教義與倫理緊密交織","羅1–3章對罪的描述本身就是道德教導"],"mm":{"c":"羅馬書五迷思","b":[["目的",["宣教","護教","牧養"]],["救恩",["稱義","收養","和好","自由"]],["結構",["滾雪球","心意主題"]],["耶穌生平",["先存","受死復活","再來"]],["倫理",["前半為根基","羅6:12","1–3章的教導"]]]},"fw":[["迷思一","目的不清"],["迷思二","救恩＝稱義"],["迷思三","逐題論述"],["迷思四","少提耶穌生平"],["迷思五","倫理只在後半"]],"q":["福音不只是給未信者的信息，也是神堅固信徒的工具。","讀羅馬書要像滾雪球，不要像打保齡球。","不要容罪在你必死的身上作王。"],"fb":null},{"id":22800,"slug":"queue-video-curriculum","title":"在按下錄製鍵之前，請先思考這三個問題","date":"2026-07-01","author":"Matt Boga","cats":["教会事工"],"tags":["技術","查經","裝備","培訓","位格"],"sum":"許多教會開始把自己牧者的教導錄成視頻或播客，分發給小組觀看再討論。作者認為這是「好、更好、最好」的智慧抉擇，而非對錯問題，並提出三個問題幫助分辨：一、所選方法是否把面對面服事放在優先？三一神道成肉身、聖靈內住，祂的服事是親密而位格性的；約翰寫信卻盼望面對面相見。二、什麼方法最適合我的處境？聖經書信本身是處境性的，事工也有季節，例如唯一的牧師面對龐大庶務時，錄製或許有益。三、我是否願意放慢車速？如同中央谷地的濃霧，事工有看不清的時候就要減速；門訓不是賽跑，技術上做得到不代表應該做。耶穌花三年陪伴十二個人，看似低效，卻改變了世界。","pts":["許多牧養決定屬於智慧而非道德判斷","視頻教學過去是輔助，如今成為主流模式","錄製的動機複雜：重複、品質、跟風","神的服事是親密而位格性的","約翰寫信，仍盼望面對面","事工是處境性的，要看季節","門訓不是賽跑","能錄製不代表應該錄製","耶穌用三年陪伴十二人改變世界"],"mm":{"c":"錄製教學前三問","b":[["背景",["錄製牧者教導","動機複雜"]],["問題一",["面對面優先","道成肉身","約翰的盼望"]],["問題二",["處境性","事工季節","唯一的牧師"]],["問題三",["放慢車速","濃霧比喻","門訓非賽跑"]],["榜樣",["耶穌與十二門徒","低效卻改變世界"]]]},"fw":[["原則","好、更好、最好的智慧"],["現象","視頻門訓的興起"],["問題一","位格性的服事"],["問題二","處境與季節"],["問題三","願意慢下來"],["榜樣","耶穌的慢方法"]],"q":["技術上能錄製，不代表你應該這樣做。","最美好的牧養時刻，常常誕生於現場那個當下。","耶穌用看似低效的方式，改變了整個世界。"],"fb":null},{"id":22793,"slug":"agentic-ai-pastor-church","title":"代理型 AI 能替你牧養教會嗎？","date":"2026-06-30","author":"Sebastian Y. Kim","cats":["教会事工"],"tags":["牧養","人工智能","AI","AI代理"],"sum":"代理型AI不需步步下指令，只要吩咐一次就能自主完成任務，例如每週自動寫好講章，甚至讀取牧師的筆記、訊息與照片做出比本人更像本人的私人定製內容。作者指出四大挑戰：預備——牧師可以主日早上才看講章，卻失去親自領受話語的過程；牧養——AI能以牧師名義發訊息、甚至以克隆的聲音打電話，最後只剩代理對代理；默想——研究顯示頻繁用AI降低批判思考與記憶，智慧眼鏡將侵蝕獨立思考與清教徒式的默想；降維打擊——有AI加持的教會與沒有的之間鴻溝擴大，未來甚至可能出現站上講台的AGI機器人。他提出四項回應：把AI放在最後，先自己思考與解經；親自與羊同在，在場無法外包；祈求聖靈恩膏，因為改變人心的是恩典而非修辭；每天放下設備，用紙本聖經親近基督。","pts":["代理型AI可自主完成整個任務","它能讀取私人資料做出私人定製講章","不付代價預備，牧者會失去什麼？","AI可冒充牧師關懷會友","牧養必須源於面對面的連接","頻繁用AI會削弱思考與記憶","AI設備讓深度默想成為失傳的藝術","有無AI的教會之間鴻溝擴大","把AI放在最後，先自己思考","在場無法外包，改變人心的是聖靈"],"mm":{"c":"代理型AI與牧養","b":[["什麼是代理型AI",["一次指令","自主完成","私人定製"]],["挑戰",["預備","牧養","默想","降維打擊"]],["未來",["AGI","人形機器人站講台"]],["回應一二",["AI放最後","與羊同在"]],["回應三四",["聖靈恩膏","親近基督"]]]},"fw":[["現象","牧養的自動化"],["挑戰一","講章預備"],["挑戰二","牧養關懷"],["挑戰三","默想能力"],["挑戰四","事工鴻溝"],["回應","四條實踐建議"]],"q":["真正的講章預備，預備的是你內心的整全。","算法不會禱告，但人會。","牧養的第一課，就是親自到場。"],"fb":null},{"id":22791,"slug":"god-wait-prayer-answered","title":"在等候神回應禱告的過程中，神在做什麼？","date":"2026-06-29","author":"Courtney Reissig","cats":["基督徒生活"],"tags":["禱告","苦難","等候"],"sum":"一首流行歌唱出「感謝神沒有應允我的禱告」，但作者指出新約中神喜愛並總是回應祂子民的求告，只是回應未必如我們所求。司布真提醒，未蒙應允的祈求神都存記在冊，神的時間比我們的更好；神有祂不慌不忙的節奏，所以等候往往比預想的更長更難。作者以詩篇5篇提供等候中的三個方向：一、不住地禱告——像詩人一早醒來就向神陳明心意，並儆醒盼望，而不是先抓手機、急著自己掌控；二、融入屬靈群體——詩人進入神的殿，與神的子民一同等候，如同待產的母親被其他母親陪伴；三、以神為避難所——先傾倒禱告與抱怨，再學習在神裡面安息，因為倚靠其他人事物只會讓焦慮加劇。","pts":["新約中神喜愛並總是回應祂子民的禱告","回應未必是我們所求的那一個","未蒙應允的禱告，神都存記","神有祂不慌不忙的節奏","詩篇是等候中信徒的禱告書","一早先禱告，再儆醒盼望","不要獨自等候，要與神的子民一起","傾訴之後，學習在神裡面安息","倚靠神以外的事物只會加深焦慮"],"mm":{"c":"等候禱告的回應","b":[["誤解",["流行歌","石沉大海？"]],["真理",["神總是回應","時間表不同","司布真"]],["不住禱告",["早晨陳明","儆醒盼望"]],["屬靈群體",["進入神的殿","同擔憂愁"]],["避難所",["傾訴後安息","唯神穩固"]]]},"fw":[["引子","未蒙應允的禱告"],["真理","神總是回應"],["處境","漫長的等候"],["方向一","不住地禱告"],["方向二","融入群體"],["方向三","以神為避難所"]],"q":["沒有未蒙回應的禱告，只有不照我們時間表的回應。","在雙腳落地、手抓手機之前，先來到神面前。","有人與我們一同等候，這陪伴本身就是恩典。"],"fb":null},{"id":22789,"slug":"discipleship-wedding-prep","title":"預備新婦，迎候新郎","date":"2026-06-29","author":"Justin Jackson","cats":["基督徒生活"],"tags":["門訓","婚禮"],"sum":"作者回憶新娘凌晨就起床、花幾個小時精心打扮，不是為了贏得他的愛，而是為了讓新郎歡喜。他以啟示錄19章羔羊婚筵為框架，說門訓就是在籌備婚禮——幫助基督的新婦預備好迎見新郎。這個比喻帶來四點：一、為門訓定下喜樂而非責任的基調；二、連結神的主權與人的努力——新婦「自己預備」，也「蒙恩得穿」，就像慈愛的父親為婚紗買單；三、釐清門訓的範圍——心思、行為、婚姻、教養、性觀念都要預備好，細麻衣由聖徒的義行織成，善行不能救人，卻是婚紗上的絲線；四、帶來緊迫感，因為婚禮即將開始，新郎快要來了。","pts":["新娘精心打扮，是為了讓新郎歡喜","門訓的核心是喜樂","啟示錄19章：新婦預備好了","門訓就是在籌備婚禮","新婦自己預備，也蒙恩得穿","生命每個角落都要預備迎見新郎","善行不能救人，卻是婚紗上的絲線","婚禮將至，門訓有緊迫性"],"mm":{"c":"門訓是籌備婚禮","b":[["比喻",["新娘的預備","為新郎歡喜"]],["經文",["啟19:6-8","羔羊婚筵","細麻衣"]],["喜樂基調",["不是責任","樂在其中"]],["主權與努力",["自己預備","蒙恩得穿"]],["範圍",["全人生命","義行為絲線"]],["緊迫",["婚禮將至","不可浪費時間"]]]},"fw":[["回憶","婚禮那天的新娘"],["經文","羔羊婚娶的時候到了"],["定義","門訓是婚禮籌備"],["意義一二","喜樂與主權"],["意義三四","範圍與緊迫"]],"q":["新娘精心預備，不是為了贏得愛，而是因為被愛。","善行不能救我們，卻是織進婚紗的絲線。","音樂即將奏響，新郎即將來到。"],"fb":null},{"id":22786,"slug":"pressure-christian-movie-review","title":"《諾曼底 72 小時》：生死攸關的天氣預報","date":"2026-06-28","author":"Brett McCracken","cats":["文化与艺术"],"tags":["真理","領袖","科學","影評","二戰","主權"],"sum":"《諾曼底72小時》講述盟軍首席氣象官斯塔格如何預報1944年6月5日的惡劣天氣，促使艾森豪威爾把登陸延後一天，很可能挽救了無數生命。電影以對白與作戰室場景為主，片名Pressure既指氣壓也指決策壓力。作者從中看見兩種領導力：艾森豪威爾在不確定中果斷決策並擔起責任——他預先寫好失敗聲明，承認責任全在自己；斯塔格則堅持數據與真相、不討好上級，也展現平凡人的盡職。片中斯塔格在教堂外看見風暴來臨的一幕，作者認為並非科學與信仰對立，而是提醒天氣屬於神的主權，人能研究預測卻無法掌控，這兩者都激勵人讚美創造主。","pts":["登陸行動唯一能推遲的因素是天氣","斯塔格的預報打亂計劃，卻可能挽救無數人","片名同時指氣壓與決策壓力","真正的領袖在不確定中果斷決定","艾森豪威爾預先承擔失敗的全部責任","好領袖探尋真相，而非迎合上意","英勇常體現在盡職的平凡事中","天氣屬於神的主權，人能預測卻不能掌控"],"mm":{"c":"《諾曼底72小時》","b":[["背景",["霸王行動","6月5日","天氣決定一切"]],["艾森豪威爾",["果斷決策","沒有確定性","責任全在我"]],["斯塔格",["只看數據","不討好人","平凡的英勇"]],["真理",["面對可怕事實","選擇現實而非粉飾"]],["神的主權",["教堂外的風暴","人無法掌控","讚美創造主"]]]},"fw":[["背景","最重要的天氣預報"],["電影","以對白推動的張力"],["領導一","艾森豪威爾的擔當"],["領導二","斯塔格的真誠"],["神學","神的主權與人的科學"]],"q":["確定性是領袖永遠無法享有的奢侈品。","真正的領袖不推諉，承擔決定的所有後果。","天氣掌控我們的生活，我們卻無法掌控天氣。"],"fb":null},{"id":22781,"slug":"lord-flies-netflix-christian-review","title":"熱帶天堂如何淪爲地獄？從《蠅王》看驚心動魄的人性墜落","date":"2026-06-28","author":"Brett McCracken","cats":["文化与艺术"],"tags":["影評","人性","名著","反烏托邦"],"sum":"Netflix新版《蠅王》由《混沌少年時》編劇打造，四集各從一位男孩視角展開。故事講二戰時一群英國學童墜機困在荒島，起初試圖維持秩序，最後墮入野蠻。劇集以強烈的前後對比呈現墮落：唱詩班禮袍變成部落油彩，讚美詩變成殺戮的吶喊，伊甸般的美景變成地獄般的血紅。作者指出這呼應耶利米書17:9——邪惡是人與生俱來的本相；但人有高於野獸的尊嚴，生命不只是求生。劇集為每個男孩加入背景故事，讓角色更有血有肉，豬崽子之死尤其令人心碎；但用創傷與父愛缺失解釋行為，可能削弱戈爾丁「人性全然敗壞」的洞見。西蒙帶有基督的影子。結尾應讓我們既同情這些男孩，也為人裡面的罪哀慟，並仰望能逆轉咒詛的救贖主。","pts":["《蠅王》描繪文明迅速墮落為野蠻","劇集以視覺對比呈現純真的喪失","邪惡是人與生俱來的本相","去除文明約束，人就淪為求生的野獸","人的尊嚴不只在於生存","背景故事讓角色更立體","以創傷解釋行為可能削弱罪的教義","西蒙帶有基督的影子","有一位救贖主能把罪人變為聖徒"],"mm":{"c":"《蠅王》與罪的螺旋","b":[["故事",["荒島學童","秩序崩塌"]],["視覺對比",["禮袍到油彩","讚美到殺戮","伊甸到地獄"]],["神學",["耶17:9","人性敗壞","蠅王即別西卜"]],["改編",["每集一視角","背景故事","心理化解釋"]],["人物",["豬崽子","傑克","西蒙似基督"]],["盼望",["為罪哀慟","救贖主逆轉咒詛"]]]},"fw":[["引言","高中讀過的經典"],["主題","從文明到野蠻"],["手法","前後呼應的畫面"],["人物","鮮活的男孩"],["評析","創傷還是罪性"],["結論","哀慟與盼望"]],"q":["邪惡不是後天學來的，而是我們與生俱來的本相。","人的生命意義，絕不僅止於求生。","正是罪，把每一個天堂都變成了噩夢。"],"fb":null},{"id":22775,"slug":"witness-army-buddy","title":"帶我走向基督的海軍陸戰隊員弟兄","date":"2026-06-27","author":"Luke Mansfield","cats":["信仰与工作"],"tags":["恩典","見證","軍人"],"sum":"作者是前軍用直升機飛行員，訓練結束打開手機才得知最好的朋友瑞安在阿富汗墜機殉職。他從小在教會長大、禱告接受耶穌無數次，卻驕傲地遠離信仰；遇見同中隊的瑞安後，兩人如大衛與約拿單般深相契合，瑞安毫不掩飾地談論信仰，一再邀他去教會。瑞安被派往阿富汗，五週後犧牲。悲痛的一年後，神打碎他的驕傲，帶他進入弟兄查經班細讀福音書，他看見自己的罪，也經歷恩典翻轉生命。他反思三件事：不完美的見證也能對神國產生非凡影響；愛能敲開緊閉的心門；男人也是為敬虔的弟兄情誼而造，而這指向與基督更深的親密。","pts":["從小在教會長大，不等於與主同行","驕傲讓他把教會看作壓抑無趣","瑞安毫不掩飾地談論信仰","兩人的友誼如大衛與約拿單","朋友的犧牲讓他陷入最黑暗的日子","弟兄查經班引導他細讀福音書","得救不只是脫離地獄，而是得著神","不完美的見證也能結出長久的果子","愛使人願意聆聽"],"mm":{"c":"帶我歸主的戰友","b":[["過去",["教會長大","驕傲遠離"]],["瑞安",["優秀戰友","公開信仰","邀我去教會"]],["失去",["阿富汗墜機","雨中葬禮"]],["歸信",["驕傲被打碎","弟兄查經","恩典翻轉"]],["反思",["不完美的見證","愛敲開心門","弟兄情誼"]]]},"fw":[["事件","噩耗傳來"],["過去","預備的恩典"],["轉折","無法抗拒的恩典"],["反思","恩典的默想"],["邀請","別小看你的影響"]],"q":["我願意聽他一次次的懇求，只因為我知道他愛我。","神常藉著不完美的人和不完美的傳講成就祂的工作。","天堂與地獄，有時懸於一段友誼之間。"],"fb":null},{"id":22773,"slug":"ai-and-the-deformation-of-the-students-soul","title":"外包思考，扭曲靈魂","date":"2026-06-27","author":"David M. Shaw","cats":["信仰与工作"],"tags":["人工智能","AI","寫作","美德","靈性塑造","創意"],"sum":"作者回應一篇關於寫作課學生使用AI的文章：老師拒絕為「不存在的作者」投入心血，一位學生哭著承認自己用AI是因為怕寫得爛被批評，她明知不對卻停不下來，像成癮一樣；其他學生則問用AI執筆和找編輯有何不同。原作者說這是教學法問題而非道德問題，作者不同意：學生的反應本身就說明這是道德問題，更是關乎何以為人的問題。寫作作業的價值在於創作過程中人的改變，學習是一種屬靈操練；把思考外包給機器就是去人性化，讓靈魂萎縮。一位讀者說得好：把效率奉為神明、以絕不犯錯為標準時，我們就把自己降低為較次等的存在。","pts":["寫作的價值在於創作過程中人的改變","學習是AI無法複製的屬靈操練","學生因害怕被批評而依賴AI","依賴AI的心理歷程近似成癮","每個人心裡都在為走捷徑找藉口","這不只是教學法問題，而是道德問題","把思考外包是去人性化的行為","效率被奉為神明時，人就自我降格"],"mm":{"c":"外包思考，扭曲靈魂","b":[["課堂事件",["不為不存在的作者投入","學生哭著坦白"]],["學生的疑問",["用自己想法就好？","和編輯有何不同？"]],["作者回應",["道德問題","人性問題"]],["寫作的意義",["塑造靈魂","掙扎找字句"]],["代價",["靈魂萎縮","效率成神明"]]]},"fw":[["引文","一篇關於AI寫作的文章"],["事件","課堂上的坦白"],["分歧","教學問題還是道德問題"],["論點","寫作塑造靈魂"],["結論","AI的靈性代價"]],"q":["沒有刻苦的努力，人就無法真正蛻變。","把思考外包給機器，是一種去人性化的行為。","我想看見你的思考，而不是機器的產物。"],"fb":null},{"id":22770,"slug":"giants-baseball-hats-bible","title":"「巨人」的宣告：棒球帽、聖經經文與符號之爭","date":"2026-06-27","author":"Brian Smith","cats":["社会与时事"],"tags":["見證","LGBTQ","護教","體育"],"sum":"舊金山巨人隊驕傲之夜，三位投手戴著球隊發放的彩虹帽上場，但在帽上寫了「創世記9:12–16」；另一位投手選擇戴普通球帽。聯盟以違反制服規定提出警告，球隊向LGBT群體道歉，輿論兩極。作者建議先問「在此處境中愛神愛人是什麼樣子」，而非只問對錯。他以但以理為例：在巴比倫穿朝服、坐宴席，卻不吃使他污穢的王膳——既不同化也不退出，而是「有所堅持的參與」。這三人平靜、恭敬地表明彩虹在聖經中是神立約、信實憐憫的記號，賽後也溫和說明信念，近似彼得前書3:15。作者坦言符號承載歷史，教會對LGBT群體有傷害的過往，他們的方式也會讓人受傷；但唯一錯誤的選擇是出於懼怕人。他們展現了神學、實際、關係與溝通上的預備，而這些都在幕後長期的門訓中形成。","pts":["符號沒有舉世公認的定義","先問愛神愛人在此處境是什麼樣子","但以理：既不同化，也不抽離","有所堅持的參與","彩虹在聖經中是神立約的記號","以溫柔敬畏回答盼望的緣由","符號承載歷史，可能觸及他人的傷痛","最錯誤的選擇是出於懼怕人","公開的預備來自幕後長期的門訓"],"mm":{"c":"棒球帽與符號之爭","b":[["事件",["驕傲之夜","帽上寫經文","聯盟警告"]],["正確問題",["愛神愛人","而非只問對錯"]],["但以理",["朝服與宴席","不吃王膳","積極參與"]],["彩虹",["創9:12-16","神的信實","不同群體的意義"]],["反思",["教會的劣跡","懼怕人","非唯一正解"]],["預備",["神學","實際","關係","溝通"]]]},"fw":[["背景","體育場上的符號"],["事件","巨人隊投手的選擇"],["框架","從愛出發"],["榜樣","但以理在巴比倫"],["評析","是否最好的做法"],["應用","四種預備"]],"q":["面對符號之爭，先問愛神愛人在這裡是什麼樣子。","唯一真正錯誤的選擇，是出於懼怕人而行事。","公開的勇氣，來自無人看見時長期的塑造。"],"fb":null},{"id":22765,"slug":"does-jesus-suffer-heaven","title":"耶穌的獻祭是在十字架上，還是在天上？","date":"2026-06-26","author":"Brandon D. Crowe","cats":["圣经与神学","卡森神学更新中心"],"tags":["希伯來書","贖罪","祭司","挽回祭"],"sum":"近年部分學者主張：根據希伯來書，耶穌的贖罪獻祭不是在十字架上，而是在升天後把復活的身體與血呈獻在天上聖所；理由是8:4說耶穌在地上不是祭司，且贖罪日的重點在於血的處置。作者肯定強調基督天上大祭司職分的價值（改革宗傳統早已如此），但提出七個理由堅持十字架是獻祭：一、基督之死是希伯來書贖罪神學的核心，贖罪日的祭牲是真實被宰殺；二、他的死是挽回祭，平息神的忿怒；三、應區分降卑與升高兩種狀態，獻上身體的順服發生在地上；四、8:4應從特定意義理解，基督在地上也行祭司的事；五、他是麥基洗德式而非利未式的祭司；六、不可混淆詞語與概念，教父們也說基督在地上作祭司；七、新約整體見證都以十字架為中心。好消息是：基督已在十字架上一次獻上，如今又在天上為我們代求。","pts":["新觀點主張贖罪發生在天上而非十字架","理由：耶穌在地上不是利未祭司，以及血的處置","基督之死是希伯來書贖罪神學的核心","挽回祭需要祭牲真實地死去","須區分基督的降卑與升高狀態","8:4是特定意義的否定","基督是麥基洗德式的祭司","詞語未出現，不代表概念不存在","新約整體見證以十字架為中心"],"mm":{"c":"十字架上還是天上？","b":[["新觀點",["天上獻祭","來8:4","重在血的處置"]],["回應一二",["死亡的中心地位","挽回祭"]],["回應三四",["降卑與升高","地上也作祭司"]],["回應五六",["麥基洗德等次","詞語與概念"]],["回應七",["新約整體見證"]],["好消息",["一次獻上","天上代求","靈魂的錨"]]]},"fw":[["問題","希伯來書的贖罪在哪裡成就"],["學術動態","新近的天上獻祭說"],["肯定","天上大祭司職分"],["七個理由","堅持十字架的獻祭"],["結論","地上與天上的好消息"]],"q":["挽回祭需要祭牲真實地死去。","不必在基督祭司職分的時間與地點上二選一。","祂已在十字架上一次獻上，如今又在天上為我們代求。"],"fb":null},{"id":22748,"slug":"nancy-guthrie-reformation","title":"南希·葛絲瑞：改革姊妹事工的先鋒","date":"2026-06-25","author":"Sarah Eekhoff Zylstra","cats":["教会事工"],"tags":["女性","姊妹事工","BSF","教導聖經"],"sum":"這是南希·葛絲瑞的人物特寫。她生於敬虔的美南浸信會家庭，少年時就在青年歸主中作見證，後在話語出版社做公關，親身經歷福音派出版的黃金時代，也看見其中的貪婪與醜聞。工作與育兒使她靈命枯竭，直到參加BSF研經團契，被樸實而深刻的教導改變，立志一生教導聖經。後來她的女兒霍普與兒子蓋博都因罕見的澤爾韋格綜合徵在週歲前離世，苦難驅使她在改革宗神學中尋找神主權的答案。她從靈修式寫作轉向以基督為中心的查經，曾因早期作品受學者批評而更努力學習，最終完成神學碩士。她寫下在舊約中看見基督的系列查經，帶動姊妹事工從情感導向轉向嚴謹釋經；福音聯盟姊妹大會從2012年的三千多人成長到如今八千多人，講員人選已不虞匱乏。","pts":["2008年的姊妹事工多以名人、故事與情感為主","BSF讓她規律浸潤在神的話語中","樸實而深刻的教導勝過講員魅力","喪失兩個孩子使她深入探索神的主權","改革宗作家對苦難給出清楚的聖經答案","她從靈修小品轉向以基督為中心的查經","受批評成為她更認真學習的轉折點","她帶領姊妹回到古老的讀經方式","姊妹事工的浪潮正在翻轉"],"mm":{"c":"南希·葛絲瑞","b":[["成長",["美南浸信會","青年歸主","話語出版社"]],["轉變",["靈命枯竭","BSF","立志教導聖經"]],["苦難",["霍普","蓋博","神的主權"]],["歸正",["派博與凱勒","聖經預表","神學碩士"]],["事工",["舊約中看見基督","播客","工作坊"]],["影響",["姊妹大會","釋經講員增多","浪潮翻轉"]]]},"fw":[["開場","給科林的一封沒寄出的信"],["背景","敬虔的浸信會家庭"],["事業","基督教出版的黃金時代"],["更新","扎根神的話語"],["苦難","失去兩個孩子"],["歸正","學習改革宗神學"],["影響","姊妹事工的改革"]],"q":["我想像不出還有什麼比教導聖經更值得用一生去做。","我不是發明新讀經法，只是帶大家回到傳統。","她以神的話語為樂，也邀請所有人同享這喜樂。"],"fb":null},{"id":22742,"slug":"dont-use-ai-as-your-pastor","title":"不要把 AI 當成你的牧者","date":"2026-06-24","author":"Joshua Hsieh","cats":["基督徒生活"],"tags":["牧養","人工智能","AI","答案"],"sum":"作者以一位姊妹問AI如何回擊關心她缺席聚會的人為例，指出AI隨時在線、語氣溫柔、會引經文、會說「交託給主」，因此很容易讓人誤以為得到了屬靈幫助。他歸納AI在牧養話題上的五個陷阱：一、絕對化感受，把複雜的屬靈問題包裝成情緒管理；二、個人幸福優先，以「你快樂嗎」取代「你是否忠心」；三、忽略悔改與成聖，提供無督責的陪伴；四、天然偏向反權柄，容易把順服看成危險；五、迎合提問中已含的結論，犯「未曾聽完先回答」的錯。建議改用能引向光照的問法，例如「我可能有哪些看不到的罪」。但神沒有呼召AI牧養你：它不為靈魂儆醒、不必交帳，也不能真正禱告。所有AI的回答都要以聖經、禱告與牧者及成熟肢體來驗證。","pts":["AI看起來很屬靈，正是風險所在","陷阱一：把感受絕對化","陷阱二：個人幸福優先於順服","陷阱三：只有安慰，沒有悔改","陷阱四：天然偏向反權柄","陷阱五：迎合提問中已含的結論","先訴情由的似乎有理","改問能帶來光照的問題","神沒有呼召AI牧養你的靈魂"],"mm":{"c":"不要把AI當牧者","b":[["吸引力",["隨時在線","溫柔回應","屬靈用語"]],["五個陷阱",["絕對化感受","幸福優先","忽略悔改","反權柄","迎合結論"]],["更好的問法",["我有什麼罪看不見","聖經怎麼說","該整理哪些事實"]],["神的恩典管道",["聖經","禱告","牧者與肢體"]],["檢驗標準",["更愛基督？","更願悔改？","更遠離教會？"]]]},"fw":[["案例","一段AI對話"],["原因","AI為何顯得有幫助"],["陷阱","五個結構性缺陷"],["對策","換一種提問方式"],["結論","神沒有呼召AI牧養你"]],"q":["一個很快回應你的工具，容易讓人誤以為得到了屬靈幫助。","你得到的，可能只是被你的輸入塑造出的鏡像回音。","AI不會為你的靈魂儆醒，也不會在你犯罪時因愛你而責備你。"],"fb":null},{"id":22738,"slug":"whos-bad-moral-evasion-michael","title":"《邁克爾·傑克遜：巨星之路》如何迴避道德拷問","date":"2026-06-23","author":"Brett McCracken","cats":["文化与艺术"],"tags":["道德","影評","AI","流行音樂","明星"],"sum":"作者評論邁克爾·傑克遜傳記片，認為它刻意迴避道德拷問：片中把他塑造成被專橫父親壓榨的天才與受害者，對多名指控者所述的兒童性侵完全不提，結尾還留下模糊的「故事仍在繼續」。電影借用流行的「創傷敘事」，暗示即使他後來成了加害者，也只是童年創傷所致，而非一個需負責的罪人。作者提出更深的問題：藝術與藝術家能分開看嗎？我們還能欣賞道德有虧之人的作品嗎？AI生成的作品看似能繞開這難題，卻引出「是否出自人手還重要嗎」的新問題。一部誠實呈現矛盾的電影不會賣座，但基督徒應追求不加粉飾的真相；連傑克遜的女兒也公開表示自己把誠實置於金錢之上。","pts":["電影把傑克遜塑造成純粹的受害者","對性侵指控隻字不提","以創傷敘事解釋惡行，迴避個人責任","一部誠實的傳記應同時呈現成就與罪","神話化的明星難以容納醜陋真相","藝術與藝術家能否分開是艱難的問題","AI讓這個老問題更加複雜","基督徒應追求不加粉飾的真相","誠實高過金錢"],"mm":{"c":"傳記片的道德迴避","b":[["電影手法",["受害者形象","專橫父親","模糊結尾"]],["隱藏的黑暗",["性侵指控","紀錄片被下架"]],["創傷敘事",["被誤解的惡人","迴避罪責"]],["藝術與藝術家",["能否分開","#MeToo","AI的新問題"]],["真相",["不加粉飾","誠實高過金錢"]]]},"fw":[["結尾","一句模糊的收場"],["問題","刻意迴避的黑暗"],["手法","創傷與受害者敘事"],["延伸","藝術與藝術家"],["結論","追求不加粉飾的真相"]],"q":["他想醫治世界的光，伴隨著長期被掩藏的黑暗。","真相勝過金錢，也勝過我們但願如此的敘事。","藝術家可能創作出輝煌作品，本人卻行徑駭人。"],"fb":null},{"id":22736,"slug":"values-ai-suggests","title":"AI 背後的價值觀","date":"2026-06-23","author":"Marc Sims","cats":["文化与艺术"],"tags":["人論","人工智能","AI","美德"],"sum":"作者指出技術從不價值中立，每種技術都帶著某種「暗示」。生成式AI至少暗示五種價值：一、速度——承諾做得更多更快，但研究發現AI反而加重工作量；韓炳哲說「能夠」取代「應當」後，無邊界的自由帶來倦怠，基督徒應以有限受造物的身份使用AI。二、仿真——AI虛構書單、以假亂真的影音帶來認識論危機，要警惕數位證據並看重有形的真實生活。三、垃圾資訊——像吃不飽又無限供應的零食，AI垃圾內容劫持注意力，需培養審美分辨並設界限。四、諂媚——AI傾向討好與附和，甚至引發「AI精神病」，不可把它當諮商師或仲裁者。五、懶惰——只把捨得丟掉的技能交給機器，因為不用的能力會消失。AI也有真實益處，是否利大於弊，是一個關乎智慧的問題。","pts":["沒有任何技術是價值中立的","AI承諾更快，實際上可能加重工作量","「能夠」沒有邊界，帶來倦怠與抑鬱","以有限受造物的身份使用AI","AI仿真帶來「何為真實」的危機","AI垃圾內容像無限供應的零食","我們終將成為我們所凝視之物","AI諂媚會強化既有偏見","只把捨得丟掉的技能交給機器","AI的益處是否抵得過隱憂，是智慧問題"],"mm":{"c":"AI背後的價值觀","b":[["速度",["做更多更快","倦怠社會","有限受造物"]],["仿真",["虛構書單","以假亂真","看重實體生活"]],["垃圾資訊",["注意力被劫持","審美分辨","設立界限"]],["諂媚",["討好用戶","強化偏見","AI精神病"]],["懶惰",["技能退化","保留人之為人的能力"]],["積極面",["創造","協作","需要智慧"]]]},"fw":[["前提","技術自帶暗示"],["一","速度"],["二","仿真"],["三","垃圾資訊"],["四","諂媚"],["五","懶惰"],["平衡","AI的積極之處"]],"q":["我們終將成為我們所凝視的事物。","只把你捨得丟掉的技能交給機器。","該問的不是能產出多少，而是如何像有限的受造物那樣使用它。"],"fb":null},{"id":22734,"slug":"rushing-our-quiet-times","title":"靈修時光，何必匆匆","date":"2026-06-22","author":"Jo Gibbs","cats":["信仰与工作"],"tags":["靈修","禱告"],"sum":"作者坐在家族農場門廊上休息，反思現代人的「匆忙症」如何侵蝕靈修。許多人在通勤路上匆匆翻十分鐘聖經，選用三分鐘、五分鐘靈修書，把便捷放在深度之前，靈修成了待辦事項而非與神親密的時光。每天跳讀不同經文、缺乏上下文，使人如雅各書所說照鏡後隨即忘記；這種屬靈快餐難以生出詩篇119篇那種對神話語的喜樂。靈修沒有固定時長，原則是「不讓自己感到匆忙」，好讓神的話有時間改變我們。作者自己每天早起留一小時，只讀少量經文、配合註釋與串珠、背經並寫下禱告；時間不夠的日子就重溫熟悉的經文，或每週抽兩小時深讀一段再慢慢消化。匆忙會破壞關係，與神的關係也無法速成。","pts":["現代生活被「匆忙症」籠罩","靈修變成要打卡的任務","便捷取代了深度","跳讀缺乏上下文，讀過即忘","屬靈快餐無法使人滿足","靈修沒有固定時長，但不要趕","慢下來，讓神的話有時間改變我們","時間少時，回到熟悉的經文深化理解","匆忙會破壞關係，包括與神的關係"],"mm":{"c":"靈修何必匆匆","b":[["問題",["匆忙症","速成靈修書","打卡心態"]],["後果",["浮於表面","讀過即忘","缺乏喜樂"]],["原則",["不設時長","不讓自己匆忙","品味默想"]],["作者的節奏",["早起一小時","一卷書讀數月","背經","寫禱告"]],["時間有限時",["重溫經文","每週兩小時深讀"]]]},"fw":[["處境","匆忙的現代生活"],["問題","浮於表面的靈修"],["原則","不必匆忙"],["實踐","作者的靈修節奏"],["變通","時間有限時怎麼辦"],["結語","與神的關係無法速成"]],"q":["靈修沒有固定時長，只有一個原則：不要匆忙。","在匆忙的土壤裡，很難長出對神話語的喜樂。","與神深度的相交和真實的情誼一樣，無法用微波爐加熱。"],"fb":null},{"id":22732,"slug":"new-improved-tgc-church-directory","title":"用福音聯盟教會目錄找教會","date":"2026-06-22","author":"TGC","cats":["社会与时事"],"tags":["美國","找教會","目錄"],"sum":"《大離教潮》一書指出，搬家是基督徒離開教會的常見原因：到了新地方找不到合適的教會，便漸漸脫離群體。為此福音聯盟推出升級版教會目錄。過去目錄收錄超過一萬間自行申報認同福音聯盟理念的教會，規模擴大卻使可靠性存疑。2026年起，所有教會須重新申請，回答更具針對性的問題並接受較嚴格審核，之後也會定期更新資料；為支付行政成本，參與教會每年繳交100美元。列名教會可獲得曝光與信譽背書、無限次職缺發佈、領導力線上聚會、會議與培訓九折，以及與當地理念相近教會的連結。福音聯盟認為提供可信賴的找教會工具是其使命的一部分。","pts":["搬家是許多人離開教會的原因","與其靠搜尋引擎或AI，不如用可信賴的目錄","舊目錄收錄過萬間教會，可靠性下降","2026年全面重新審核","每年收取100美元行政費","列名教會可發佈職缺與獲得曝光","提供領導力洞見與培訓折扣","有助地區教會彼此連結","引導人回到以福音為中心的教會生活"],"mm":{"c":"福音聯盟教會目錄","b":[["問題",["大離教潮","搬家後失聯"]],["歷史",["線上目錄","逾萬間教會","可信度下降"]],["2.0版",["重新申請","嚴格審核","定期更新","年費100美元"]],["好處",["曝光背書","職缺發佈","領導力聚會","培訓折扣","教會連結"]],["使命",["健康教會","福音更新"]]]},"fw":[["問題","搬家導致離開教會"],["回應","推出升級目錄"],["歷史","舊目錄的局限"],["更新","更嚴格的審核"],["權益","加入目錄的好處"],["邀請","歡迎教會申請"]],"q":["許多基督徒搬家後找不到教會，便漸漸脫離了群體。","不必依賴搜尋引擎或聊天機器人來找教會。","可信賴的找教會工具，是使命不可或缺的一部分。"],"fb":null},{"id":22730,"slug":"africa-needs-theological-resources-help-us-to-publish-them","title":"非洲的神學資源，等你來助","date":"2026-06-22","author":"Graham Heslop","cats":["社会与时事"],"tags":["神學","奉獻","非洲","支持"],"sum":"非洲福音聯盟主編指出，西方擁有豐富的神學資源（他光是研究尼采的書就有七本），非洲卻嚴重匱乏。非洲不是後基督教社會，但非洲信徒需要扎根歷史信仰、又回應本地處境的公共神學，而這類資源無法從西方進口，必須由非洲人自己來寫。造成匱乏的原因包括書籍昂貴且難以取得、本地出版商面臨發行困難，西方資源的充斥反而壓抑了本地寫作。線上出版可以繞過這些障礙，把忠於聖經又切合處境的內容帶給數百萬信徒。預計到2030年非洲將擁有全球三分之一以上的青年，他們不只塑造非洲，也將塑造世界，因此建立可信賴的免費神學資源庫至關重要，作者呼籲讀者支持。","pts":["西方神學資源極為豐富","非洲信徒需要處境化的公共神學","這類資源必須由非洲人親自書寫","書價昂貴、取得困難","本地出版商發行艱難","西方資源充斥反而阻礙本地寫作","線上出版能繞過重重障礙","2030年非洲將有全球三分之一青年","支持建立免費開放的資源庫"],"mm":{"c":"非洲的神學資源","b":[["對比",["西方資源充足","非洲嚴重匱乏"]],["需要",["公共神學","扎根歷史信仰","回應本地挑戰"]],["障礙",["書價昂貴","發行困難","西方資源壓抑本地"]],["解方",["線上出版","非洲人為非洲寫"]],["未來",["三分之一青年","塑造世界"]],["呼籲",["奉獻支持","免費資源庫"]]]},"fw":[["對比","西方的豐富"],["需要","非洲的公共神學"],["使命","非洲人為非洲寫作"],["障礙","資源匱乏的原因"],["機會","線上出版"],["呼籲","請支持這項事工"]],"q":["這類資源不會從西方輸入，需要非洲人自己來寫。","非洲人不只將塑造自己的社會，也將塑造整個世界。","線上出版能把切合處境的神學帶給數百萬信徒。"],"fb":null},{"id":22724,"slug":"should-christians-flip-tables-like-jesus","title":"基督徒可以像耶穌一樣掀桌子嗎？","date":"2026-06-21","author":"Andrew Noble","cats":["圣经与神学"],"tags":["謙卑","憤怒","效法基督","柔和"],"sum":"效法耶穌是否意味著我們也該罵人「毒蛇的種類」、掀翻聖殿的桌子？作者借學者本納馬的研究指出，效法是動態、參與、需要先思考的道德推理過程，不是照抄耶穌的每個舉動，而是表達他行動背後的心意與品格。他承認在某些情況下，憤怒與強硬是正當的，例如大聲喝止女兒拿湯匙伸向插座；但這必須以愛、剛毅與智慧來衡量，而不是抽象地推崇「憤怒」。他整理新約所有效法耶穌的經文，發現沒有一處要我們效法他的怒氣或激烈言辭，幾乎全都關於捨己、洗腳、彼此相愛、接納、饒恕與忍受苦難。因此掀桌子是「允許的」，卻不該被「鼓勵」。聖經沒有給出窮盡的規條，基督徒要靠聖靈、聖經與敬虔榜樣在智慧中成長；多些服事，少些怒氣。","pts":["「效法耶穌」不能當作萬用答案","效法是先反思、再行動的道德推理","效法的是心意與品格，不是照抄動作","某些情況下的憤怒是正當的","評判標準是愛、剛毅與智慧","新約從未要我們效法耶穌的怒氣","效法經文幾乎都關於捨己、愛與饒恕","生氣是允許的，但不被鼓勵","智慧不在檢查清單裡"],"mm":{"c":"可以像耶穌掀桌子嗎","b":[["問題",["毒蛇的種類","掀桌子","咒詛無花果樹"]],["什麼是效法",["道德推理","表達心意","不是抄作業"]],["正當的憤怒",["喝止女兒","愛與剛毅","智慧"]],["新約效法經文",["捨己","洗腳","彼此相愛","忍受苦難"]],["結論",["允許但不鼓勵","多服事少怒氣","聖靈引導的智慧"]]]},"fw":[["問題","要效法耶穌的憤怒嗎？"],["定義","效法是什麼"],["承認","憤怒有時是對的"],["經文","新約效法命令的內容"],["分類","三類效法經文"],["應用","多些服事，少些怒氣"]],"q":["我們要效法的，是耶穌願意讓我們效法的那一面。","掀桌子是允許的，但不該被鼓勵。","我們不必模仿他的每個舉動，也能忠心跟隨他。"],"fb":null},{"id":22721,"slug":"four-kinds-of-churches","title":"四種類型的教會","date":"2026-06-20","author":"Darryl Dash","cats":["教会事工"],"tags":["改革宗","聖靈","正統","靈恩派"],"sum":"以「聖經—聖靈」兩軸劃分，教會可分四類。第一類兩者皆無，是靈性死亡、根本算不上教會的群體。第二類高舉聖靈、輕看聖經，如極端靈恩運動，以個人啟示和主觀經歷凌駕聖經，卻忘了正是聖靈默示了聖經。第三類是「死寂的正統」：教義純正、講道無誤，卻沒有生命與活力；鐘馬田稱之為福音派最大的危險，因為它帶來自滿、自義與防衛心態，人到教會不期待神會做什麼。它常是對極端靈恩的反彈，結果從一個錯誤走到另一個錯誤。理想的第四類教會同時看重聖經與聖靈，像帖前1:5所說，福音不獨在乎言語，也在乎權能與聖靈。關鍵是同時持守「凡事規規矩矩按次序」與「不要消滅聖靈的感動」兩條命令的張力。","pts":["以聖經與聖靈兩軸區分四種教會","兩者皆無的教會是靈性死亡","只重聖靈的教會以經驗取代啟示","死寂的正統持守教義卻沒有生命","鐘馬田：死寂正統是最大的危險","對錯誤的反彈可能走向另一個錯誤","理想是聖經與聖靈兼備","福音不獨在乎言語，也在乎權能","要在規矩次序與不消滅聖靈之間保持張力"],"mm":{"c":"四種教會","b":[["靈性死亡",["無聖經","無聖靈","應當遠離"]],["火熱失根",["極端靈恩","經驗高過啟示"]],["死寂正統",["教義正確","缺乏活力","自滿自義"]],["理想教會",["聖經與聖靈","帖前1:5"]],["關鍵張力",["林前14:40","帖前5:19–20"]]]},"fw":[["框架","聖經—聖靈四象限"],["第一類","靈性死亡"],["第二類","只重聖靈"],["第三類","死寂的正統"],["第四類","兩者兼備"],["方法","持守兩條命令的張力"]],"q":["我們在對錯誤的反應中，走到了另一個同樣錯誤的位置。","死寂的正統，是我們最大的威脅。","既認真對待聖經，又在事奉中尋求聖靈的大能。"],"fb":null},{"id":22719,"slug":"4-ways-we-misunderstand-short-term-missions","title":"對短宣的四種誤解","date":"2026-06-20","author":"Angie Velasquez Thornton","cats":["教会事工"],"tags":["跨文化","短宣"],"sum":"作者十六歲立志宣教，學生時代幾乎每年暑假參加短宣，足跡遍佈各國，充滿熱情。後來與丈夫到塞內加爾長期宣教，才發現長宣不是拉長版的短宣，並分享四點誤解。一、打理日常生活本身就耗盡精力：短宣時食宿醫療都有人安排，長期駐守還要照顧家人、應付熱帶疾病與陌生文化中的瑣事。二、要選擇可持續的生活方式：短宣的艱苦是冒險，一家四口卻需要一定的舒適才能長期堅守。三、留出過渡時間：學語言、融入文化、建立信任需要數年，一到就全力衝刺只會燒盡並傷害他人。四、重新定義果效：短宣被設計成在最短時間塞進最多活動，長期處境不能用同一標準衡量。她無意叫人灰心，只盼有心跨文化服事的人有所預備，並倚靠主「常與你們同在」的應許。","pts":["短宣很有價值，也可能帶來錯誤期待","長宣不是拉長版的短宣","打理日常生活本身就需要大量精力","照顧家人與健康是長期挑戰","需要可持續的生活方式","長期果效需要語言、文化與信任","剛到工場要留出過渡期","短宣的產出模式不適用於長期處境","遇到落差是正常的"],"mm":{"c":"對短宣的四種誤解","b":[["背景",["十六歲立志","多次短宣","塞內加爾長宣"]],["日常生活",["食宿自理","熱帶疾病","照顧家人"]],["可持續",["短宣的冒險","家庭需要舒適"]],["過渡期",["學語言","融入文化","建立信任"]],["果效",["短宣塞滿活動","長宣重新衡量"]],["盼望",["主常同在","有所預備"]]]},"fw":[["經歷","熱忱的短宣歲月"],["落差","長宣大不相同"],["一","日常生活耗精力"],["二","可持續的生活"],["三","留出過渡時間"],["四","重新定義果效"],["鼓勵","預備前方的路"]],"q":["短期宣教和長期宣教，根本是兩回事。","兩週內行得通的方式，不適用於長期處境。","遭遇落差是正常的，主常與你同在。"],"fb":null},{"id":22716,"slug":"why-loving-people-isnt-the-same-as-liking-them","title":"愛他，不等於喜歡他","date":"2026-06-19","author":"Matthew Ruttan","cats":["基督徒生活"],"tags":["愛","捨己","愛仇敵"],"sum":"總有些人讓我們咬緊牙關，而我們也同樣讓別人咬緊牙關。耶穌一再命令我們彼此相愛，但愛不等於喜歡：喜歡是基於共同興趣或性格合拍的正面感覺，愛卻不同。作者從新約的agape定義愛：「承認他人是按神形像所造，並為他人追求神所賜的益處，而這往往需要捨己。」第一，每個人都是神的形像承載者，理應受到尊重；第二，愛是行動導向的「追求」，不靠感覺，而且要追求神認為最好的，而非對方自以為最好的——例如不能幫朋友偷勞力士——這需要認真研讀聖經才能分辨；第三，照基督的樣式去愛，往往要付上時間、精力甚至生命的代價，而這受苦的愛是勝過邪惡的唯一力量。要警惕只愛「愛人」這個想法，卻不真的愛人。唯靠神的恩典，定睛於為我們捨命的主。","pts":["每個人都會讓別人咬緊牙關","愛不等於喜歡","愛是承認人是神的形像","愛是為人追求神所賜的益處","愛是行動，不取決於感覺","要追求神認為最好的，不是對方以為最好的","分辨何為愛需要認識聖經","基督的愛是捨己的愛","警惕只愛「愛人」的想法"],"mm":{"c":"愛不等於喜歡","b":[["處境",["讓人抓狂的人","我們也讓人抓狂"]],["喜歡",["正面感覺","共同興趣","性格合拍"]],["神的形像",["尊嚴","尊重"]],["追求益處",["行動導向","神眼中最好","需要聖經"]],["捨己",["時間精力","十字架","勝過邪惡"]],["提醒",["別只愛愛人的想法","唯靠恩典"]]]},"fw":[["問題","如何面對讓人抓狂的人"],["區分","愛與喜歡"],["定義","愛的三個要素"],["一","承認神的形像"],["二","追求神所賜的益處"],["三","捨己"],["回應","唯靠神的恩典"]],"q":["愛一個人，不等於喜歡一個人。","愛是為他人追求神所賜的益處，而這往往需要捨己。","要警惕你愛的是「愛人」的想法，而不是真的愛人。"],"fb":null},{"id":22713,"slug":"when-feelings-become-authority-the-pathway-to-compromise","title":"當感覺成爲權威：妥協之路","date":"2026-06-19","author":"Rob Godard","cats":["基督徒生活"],"tags":["權威","塑造","感覺","妥協"],"sum":"我們的時代問的已不是「什麼是真的」，而是「我感覺如何」；當感覺凌駕神的話語，教會就會慢慢偏離。作者從創世記3章歸納妥協之路的四步：一、刪減神的話——蛇以「神豈是真說」溫和地重新詮釋，使誡命變成建議；二、增添神的話——夏娃加上「也不可摸」，讓神顯得更嚴苛，律法主義與放縱同樣動搖人對神話語的信任；三、懷疑神的良善與公義——「你們不一定死」，暗示神有所保留、不會審判，否認審判就否認了神的聖潔，也錯過十字架上震怒與慈愛的交匯；四、感覺成為權威——果子看起來好、感覺對，就摘下吃了，正如今天「跟隨己心」的文化語言。答案不是壓抑感覺，而是讓感覺順服真理；耶穌在曠野靠神口裡的話勝過試探。加拿大教會必須不增不減地認識、順服神的話，信靠祂的屬性，並在動盪文化中站穩。","pts":["感覺正日益成為權威","妥協不是從公開悖逆開始，而是溫和的重新詮釋","第一步：刪減神的話","第二步：增添神的話，讓神顯得嚴苛","律法主義與放縱都動搖對神話語的信任","第三步：懷疑神的良善與公義","否認審判就否認神的聖潔，也錯過十字架","第四步：感覺取代神的話","讓感覺順服真理，而非壓抑感覺"],"mm":{"c":"妥協之路","b":[["時代",["我感覺如何","教會偏離"]],["刪減",["神豈是真說","重新詮釋"]],["增添",["也不可摸","律法主義"]],["懷疑",["你們不一定死","否認審判","失落福音"]],["感覺為王",["悅人眼目","跟隨己心","人心詭詐"]],["更好的路",["耶穌信靠神的話","感覺順服真理","站穩腳跟"]]]},"fw":[["處境","感覺成為權威"],["經文","創世記3:1–7"],["第一步","刪減神的話"],["第二步","增添神的話"],["第三步","懷疑神的屬性"],["第四步","感覺掌權"],["出路","耶穌的順服"],["呼召","在動盪文化中站穩"]],"q":["偏離往往不是從公開悖逆開始，而是從溫和的重新詮釋開始。","感覺是真實的，卻不是可靠的真理嚮導。","答案不是壓抑感覺，而是讓感覺順服於真理。"],"fb":null},{"id":22710,"slug":"forgotten-how-stay-convicted","title":"爲何熱點快評是信念的大敵","date":"2026-06-17","author":"Joe Carter","cats":["社会与时事"],"tags":["政治","熱點","新聞","AI","算法"],"sum":"作者本想寫最近的爭議，卻意識到文章刊出時大家早已轉向下一件事。我們每天熱烈關注新事件，熱度剛好夠形成一個看法，之後就失去興趣；我們把「有觀點」當成「有立場」，又把「有立場」當成「做了事」，成了觀點最多、信念最薄的一代。「費勒加速論」指出新聞週期越來越快，觀點能以資訊流的速度生產，信念卻不能——信念是從頭腦進入生命的確信，體現在行事曆與銀行帳單上；例如羅伊案推翻後，才發現許多人只有反墮胎的觀點而非信念。作者診斷我們的病是acedia（靈性倦怠）：不是累了，而是
