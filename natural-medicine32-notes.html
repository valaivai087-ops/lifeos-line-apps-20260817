<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自然醫學筆記解析</title>
<style>
:root{
  --bg:#f6f4ef; --panel:#fff; --ink:#24302b; --muted:#6b756f; --line:#e3ded3;
  --accent:#2f7a5b; --accent-soft:#e3f1ea; --mark:#ffe58a;
  --c1:#2f7a5b; --c2:#c26a2e; --c3:#3d6fb0; --c4:#9a4d8f; --c5:#b0882a; --c6:#4f8c8c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161a18; --panel:#1f2522; --ink:#e6ebe8; --muted:#9aa49f; --line:#323a36;
    --accent:#5cc196; --accent-soft:#233a30; --mark:#7a6420;
    --c1:#5cc196; --c2:#e39256; --c3:#79a6e6; --c4:#cf86c3; --c5:#d9b45a; --c6:#7cc0c0;
  }
}
:root[data-theme="dark"]{
  --bg:#161a18; --panel:#1f2522; --ink:#e6ebe8; --muted:#9aa49f; --line:#323a36;
  --accent:#5cc196; --accent-soft:#233a30; --mark:#7a6420;
  --c1:#5cc196; --c2:#e39256; --c3:#79a6e6; --c4:#cf86c3; --c5:#d9b45a; --c6:#7cc0c0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:1200px;margin:0 auto}
h1{font-size:18px;margin:0;white-space:nowrap}
#q{flex:1;min-width:200px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);font-size:15px}
#q:focus{outline:2px solid var(--accent);border-color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap;max-width:1200px;margin:10px auto 0}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{display:grid;grid-template-columns:300px 1fr;gap:16px;max-width:1200px;margin:0 auto;padding:16px}
#list{position:sticky;top:120px;max-height:calc(100vh - 136px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.item{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover{background:var(--accent-soft)}
.item.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.item b{display:block;font-size:14px;font-weight:600;line-height:1.45}
.item small{color:var(--muted);font-size:12px}
.count{padding:8px 14px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}
article{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 24px;min-width:0}
.meta{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cat{background:var(--accent-soft);color:var(--accent);padding:1px 10px;border-radius:999px;font-weight:600}
article h2{font-size:22px;margin:6px 0 14px;line-height:1.4}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.nav a{font-size:13px;color:var(--accent);text-decoration:none;border:1px solid var(--line);padding:2px 10px;border-radius:6px}
section{margin-top:22px}
section h3{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
section h3::before{content:"";width:6px;height:18px;border-radius:3px;background:var(--accent)}
.simple p{margin:0 0 8px;padding:10px 14px;background:var(--accent-soft);border-radius:10px}
/* mind map */
.mm{display:flex;align-items:center;gap:0;overflow-x:auto;padding:6px 0}
.mm-c{flex:none;background:var(--accent);color:#fff;font-weight:700;padding:12px 16px;border-radius:14px;max-width:160px;text-align:center;line-height:1.4}
.mm-bs{position:relative;padding-left:28px;margin-left:16px;display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.mm-bs::before{content:"";position:absolute;left:0;top:18px;bottom:18px;border-left:2px solid var(--line)}
.mm-b{position:relative;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mm-b::before{content:"";position:absolute;left:-28px;top:50%;width:26px;border-top:2px solid var(--line)}
.mm-bl{flex:none;border:2px solid var(--bc);color:var(--bc);font-weight:700;padding:4px 12px;border-radius:10px;background:var(--panel);font-size:14px}
.mm-k{display:flex;flex-wrap:wrap;gap:6px}
.mm-k span{font-size:13px;padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--bc) 14%,transparent);border:1px solid color-mix(in srgb,var(--bc) 35%,transparent)}
/* frame */
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.fs{flex:1 1 140px;display:flex;align-items:stretch;gap:8px}
.fbox{flex:1;border:1px solid var(--line);border-top:4px solid var(--fc);border-radius:10px;padding:10px 12px;background:var(--panel)}
.fbox b{display:block;color:var(--fc);font-size:14px}
.fbox span{font-size:13px;color:var(--muted)}
.arrow{align-self:center;color:var(--muted);font-size:18px}
.layers{display:flex;flex-direction:column;gap:6px;align-items:center}
.layer{border-radius:10px;padding:8px 14px;color:#fff;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.layer b{font-size:14px;white-space:nowrap}
.layer span{font-size:13px;opacity:.95}
.ftitle{font-size:13px;color:var(--muted);margin:-4px 0 10px}
.ctools{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 10px}
.ctools button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer}
.ctools button:hover{border-color:var(--accent);color:var(--accent)}
.ctools button.line{background:#06c755;border-color:#06c755;color:#fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#24302b;color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
/* products */
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.prod{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.prod b{display:block;margin-bottom:4px}
.pid{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:2px}
.pid span{color:var(--c2);font-weight:700;font-size:13px}
.prod .lab{font-size:12px;color:var(--accent);font-weight:700}
.prod p{margin:2px 0 0;font-size:14px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px}
summary{cursor:pointer;font-weight:600}
.orig{white-space:pre-wrap;font-size:15px;margin-top:10px}
.tags{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:12px;color:var(--muted)}
mark{background:var(--mark);color:inherit;border-radius:2px}
.empty{color:var(--muted);padding:30px;text-align:center}
.tbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
@media (max-width:820px){
  main{grid-template-columns:1fr;padding:12px 16px}
  #list{position:static;max-height:240px}
  article{padding:16px}
  .mm{flex-direction:column;align-items:stretch}
  .mm-c{max-width:none}
  .mm-bs{margin-left:12px;margin-top:10px}
  .fs{flex-basis:100%}
  .arrow{transform:rotate(90deg)}
}
@media print{header,#list,.nav{display:none} main{display:block} article{border:0}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>🌿 自然醫學生 Yilin 筆記解析</h1>
    <input id="q" type="search" placeholder="搜尋標題、內容、產品或編號（例：魚油、GABA、091）">
    <button class="tbtn" id="theme" title="切換深淺色">◐</button>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main>
  <nav id="list"></nav>
  <article id="view"></article>
</main>
<div id="toast"></div>
<script>
const NOTES = [{"id": 1, "title": "4 個美國醫學生常用工具，建立臨床知識庫", "date": "2025/11/10", "tags": ["自然醫學", "自然療法", "美國醫學生", "美國讀醫", "醫學生必備app", "學習工具"], "body": "iHuman Patients\n這個軟體是一套模擬真實病人就診場景的臨床推理系統。對於練習臨床思維訓練真的很有用。它可以模擬真實病人，包括讓你聽心肺、做基礎身體檢查等。從問診、體格檢查、開化驗單，到最後做出診斷和治療計劃，每一步都像在真實就診一樣。你需要與病人互動，問臨床問題、判斷哪句病史有價值、決定哪些體檢要做。它迫使你動腦做 Differential Diagnosis（鑑別診斷），並以 SOAP note的形式輸出結果。每跑完一個案例，都是一次臨床實戰訓練。這個軟體雖然比較貴，但對於臨床訓練真的非常實用\n\nMDCalc\n這是美國臨床醫師最常用的醫療決策工具之一。醫生很多時候做決定不只是靠感覺和經驗，更是靠臨床評分。MDCalc 收錄了幾乎所有醫學評分系統，只要輸入病人的症狀或資料，它就會幫你快速計算並給出對應的臨床建議。其中最常用之一就是 Centor Score（鏈球菌性咽炎評分）：醫生透過 4–5 個簡單指標（如發燒、有無咳嗽、扁桃體分泌物、頸部淋巴結壓痛等）來判斷：\n這個咽喉痛是病毒感染還是細菌感染？\n需不需要做咽拭子？\n是否需要用抗生素？\n這是幾乎每個美國醫生必用的網站！\n\nNotion\n它並不是簡單的只幫你記筆記，而是一個幫你整理大腦的工具，很多以學生用它做醫療臨床筆記。它可以把所有的知識、病例、任務、計劃都集中在同一個空間裡，你可以用資料庫、標籤、連結，把散亂的資訊自動連線成系統。隨著內容不斷累積，你會看到自己的知識網路越來越清晰，不用再翻找、切換 app、到處複製貼上。Notion 的強大在於，它用你自己的方式組織你的思維，讓知識視覺化、結構化，並最終成為你個人的智慧系統。\n\nNotability\n這是我每天在用的App，這個在iPad上用的軟體真的讓繁雜的醫學筆記化繁為簡，實現了無紙化學習。醫學資訊量龐大、圖表多、更新快，與其堆滿紙張，不如把所有知識集中在一個裝置。Notability 的手寫+ 標註功能，讓你可以直接在 PPT 和 PDF 上做筆記。老師講課時，錄音會自動與筆記同步，複習時點一下就能跳回當時的講解重點。Goodnote也有類似的功能，但我個人一直在用Notability。", "cat": "學習工具", "simple": ["這篇在介紹 4 個美國醫學生天天用的「讀書小幫手」。", "iHuman 像一個「看病電玩」：電腦裡有假病人，你要問問題、聽心跳、決定做什麼檢查，最後猜出他生什麼病。", "MDCalc 像「醫生的計算機」：把病人的狀況輸入，它幫你算分數，告訴你喉嚨痛是病毒還是細菌、要不要吃抗生素。", "Notion 像「大腦的收納櫃」，把筆記、病例、計畫分門別類放好；Notability 是 iPad 上的「電子筆記本」，可以邊錄音邊寫字，複習時點一下就回到老師講的那一段。"], "mind": {"c": "4 個醫學生工具", "b": [["iHuman 模擬病人", ["問診練習", "身體檢查", "鑑別診斷", "寫 SOAP 病歷"]], ["MDCalc 臨床評分", ["輸入症狀算分數", "Centor 喉嚨痛評分", "決定要不要抗生素"]], ["Notion 知識庫", ["資料庫", "標籤連結", "知識網絡"]], ["Notability 筆記", ["PDF 上手寫", "錄音同步", "無紙化"]]]}, "frame": {"type": "flow", "title": "建立臨床知識庫的流程", "steps": [["練習", "用 iHuman 模擬看病"], ["判斷", "用 MDCalc 算評分輔助決定"], ["記錄", "用 Notability 上課筆記＋錄音"], ["整理", "用 Notion 串成自己的知識網"]]}, "products": [["001", "防藍光護目鏡", 200, "長時間盯 iPad、電腦跑模擬病例時，過濾部分高能藍光，幫助減輕眼睛的疲勞與乾澀感。"], ["042", "清思油滴（迷迭香精油＋EPA魚油）", 450, "迷迭香香氣常被用來提神醒腦；EPA 魚油幫助維持腦部與細胞膜健康，適合整理筆記、建知識庫的用腦時段。"], ["049", "加強B群", 520, "B 群是把食物轉成能量的輔酶，幫助維持長時間學習的精神與體力。"]]}, {"id": 2, "title": "風靡美國醫療圈的AI神器 OpenEvidence", "date": "2025/10/13", "tags": ["自然醫學", "美國讀醫", "自然醫學博士", "學醫", "醫藥", "讀博日常", "美國醫學生", "醫學AI", "AI神器", "ai"], "body": "在醫學院裡，資訊量大到讓人窒息。我們每天需要花大量的時間查詢專業資料，而大部分的研究報告都很長、很繁雜，還要考慮到專業性和精準度的問題。\n\n近幾個月，美國醫學界最火的AI神器非Open Evidence莫屬了，這是專為醫學生設計的 AI 學習平臺，它可以幫你把複雜的醫學知識自動整理、總結，把多篇研究報告整合並且分類對比。Open Evidence是歷史上第一個在美國醫師執照考試（USMLE）中平均取得90%以上成績的人工智慧。\n\nOpenEvidence 與美國醫學會雜誌（JAMA）和新英格蘭醫學雜誌（The New England Journal of Medicine）簽署了內容合作協議，也確定了醫療相關資訊的專業性和準確性。\n\nOpenEvidence其實是一個隨時可諮詢的醫學助理，能回答醫學問題、推薦實驗專案、總結研究、甚至比較治療方案。它的回答都是基於真實研究文獻給出的分析與引用，幫你快速找到權威答案，節省查閱文獻的時間，讓學習和臨床判斷更加高校和精準。\n\n美國的以學生，用學校的郵箱地址註冊賬號，可以免交會員費。\n\n如果你有自己的診所或從事醫療相關事業，它可以幫助你做患者的就診記錄，寫SOAP，做charting。\n\n美國的醫療系統非常重視患者隱私保護，OpenEvidenc已經透過了 HIPAA（醫療隱私保護法案）的合規認證，意味著平臺在處理患者資料時能嚴格遵守美國醫療隱私標準。如果診所和醫療機構要使用患者管理的功能，只需要和 OpenEvidence 簽署一份BAA（商業合作協議），這些功能就能在完全符合 HIPAA 隱私規範的前提下安全使用。", "cat": "學習工具", "simple": ["OpenEvidence 是一個專門給醫生和醫學生用的 AI 小助理。", "醫學文章又多又長，它可以幫你把很多篇研究讀完、整理、比較，再用重點回答你，而且會告訴你答案是從哪篇研究來的。", "它跟有名的醫學期刊合作，所以資料比較可靠；美國醫學生用學校信箱註冊還能免費。", "它也遵守美國的病人隱私法（HIPAA），診所簽約後就能安全地用它寫病歷。"], "mind": {"c": "OpenEvidence", "b": [["是什麼", ["醫學專用 AI", "USMLE 考試 90% 以上"]], ["可信度", ["和 JAMA 合作", "和新英格蘭醫學期刊合作", "答案附文獻引用"]], ["能做什麼", ["回答醫學問題", "總結研究", "比較治療方案", "寫 SOAP 病歷"]], ["隱私安全", ["通過 HIPAA", "簽 BAA 協議"]], ["費用", ["醫學生學校信箱免費"]]]}, "frame": {"type": "flow", "title": "用 AI 查醫學資料的步驟", "steps": [["提問", "輸入臨床或學習問題"], ["整合", "AI 讀取多篇研究文獻"], ["回答", "給出重點＋引用來源"], ["查證", "自己點開原文確認"], ["應用", "用在學習或病歷"]]}, "products": [["050", "銀杏複方（銀杏＋巴西蘑菇＋色氨酸＋防風＋玉米黃質）", 510, "銀杏幫助維持末梢與腦部循環；玉米黃質保護眼睛黃斑部；色氨酸是血清素原料，適合長時間讀文獻、用腦又用眼的人。"], ["001", "防藍光護目鏡", 200, "查資料、看螢幕時間長，幫助減少藍光刺激與眼睛疲勞。"]]}, {"id": 3, "title": "阿育吠陀療癒體驗｜喚醒身體的自癒機制", "date": "2025/10/10", "tags": ["自然醫學", "身心療愈", "療愈", "阿育吠陀", "尼泊爾阿育吠陀", "自然療法", "尼泊爾", "加德滿都", "阿育吠陀療愈"], "body": "9月份的尼泊爾之行，我親身體驗了三天阿育吠陀療癒。Ayurveda Health Home這個療癒中心位於加德滿都城外的山裡，綠樹環繞、空氣清新，是當地一所阿育吠陀醫院兼療癒中心。\n\nAyurveda Health Home在當地非常有口碑，位於加德滿都市區外大約 30 分鐘車程處。這裡由尼泊爾與德國的阿育吠陀專家共同創立，自 1995 年起便以傳統方式為世界各地的人提供療癒與休養服務。\n\n中心的特色是結合古老的阿育吠陀智慧與現代醫學管理。在入住的第一天，每位客人都會由資深阿育吠陀醫生進行體質（Dosha）評估與脈診，再根據個體差異制定專屬療程，包括藥浴、草藥油按摩、蒸療、排毒（Panchakarma）以及冥想、瑜伽和飲食調養等。\n\n這裡同時是一所獲尼泊爾政府認可的阿育吠陀醫院，配備藥房、實驗室和訓練有素的理療師。飲食以健康素食為主，所有藥油與草藥均由中心自制或由認證藥廠供應。整個療癒過程強調身體、心靈與自然的重新連結，讓人從忙碌與壓力中緩慢回到平衡。\n\n三天共有多個療癒專案，包括：\n清晨舒展瑜伽\n鼻腔淨化療程：呼吸調息法 和鼻腔清潔\n眼部清洗\n油漱與含油\n全身放鬆熱油按摩\n全身淨化按摩\n草藥去角質按摩\n草藥蒸汽浴\nSitz Bath坐浴（下半身草藥泡浴）\n脊椎療程：脊椎油按摩 ，草藥敷療30分鐘\n草藥敷療\n頭部油按摩\n面部美容護理\nSirodhara滴油療法\nChakra Basti 脈輪草藥油療\nOil Bath油浴\n草藥浴缸泡浴\n\n每天飲食也是健康的素食，醫生會根據每個人的體質安排特殊食譜。第一天身體就啟動清潔機制，療癒最後感覺整個身體都輕盈了。如果你想體驗真正的阿育吠陀療癒，這裡不僅是度假的地方，更像是一段回到自然、自我淨化的旅程。", "cat": "傳統醫學", "simple": ["作者去尼泊爾的山上，體驗了三天的阿育吠陀（印度傳統醫學）療癒。", "第一天醫生會先幫你「看體質」和把脈，再幫你排專屬的療程。", "療程很多都是用溫熱的草藥油按摩、蒸氣浴、泡澡，還有瑜伽、冥想和洗鼻子、油漱口。", "每天吃健康的素食。作者說第一天身體就開始「大掃除」，三天後覺得全身變輕盈。"], "mind": {"c": "尼泊爾阿育吠陀療癒", "b": [["地點", ["加德滿都郊外山上", "1995 年創立", "政府認可醫院"]], ["第一天評估", ["體質 Dosha 評估", "脈診", "專屬療程"]], ["淨化療程", ["鼻腔清潔", "油漱口", "草藥蒸氣浴", "坐浴"]], ["油療按摩", ["全身熱油按摩", "頭部油按摩", "Sirodhara 滴油", "脊椎油療"]], ["身心調養", ["晨間瑜伽", "冥想", "體質素食"]]]}, "frame": {"type": "flow", "title": "阿育吠陀療癒流程", "steps": [["評估", "醫生看體質、把脈"], ["規劃", "依體質排專屬療程"], ["淨化", "洗鼻、油漱、蒸浴、排毒"], ["滋養", "草藥油按摩、滴油療法"], ["平衡", "瑜伽、冥想、素食，身心變輕盈"]]}, "products": [["019", "滋碩鼻炎舒寧｜鼻部護理液", 250, "對應阿育吠陀的鼻腔淨化：清潔鼻腔、帶走灰塵與分泌物，幫助維持呼吸道清爽。"], ["029", "口腔淨化養護精油組", 1200, "對應「油漱與含油」：用油品含漱幫助清潔口腔、維持口氣清新。"], ["026", "薑黃亮白磨砂膏150g", 120, "對應「草藥去角質按摩」：薑黃是阿育吠陀經典香料，磨砂顆粒溫和帶走老廢角質，讓肌膚觸感更細緻。"], ["040", "迷迭香滾珠瓶10ml", 150, "對應頭部油按摩與芳香放鬆：塗抹在太陽穴、頸肩按摩，在家也能營造療癒氛圍。"]]}, {"id": 4, "title": "負面情緒正在危害你的健康，如何有效管理？", "date": "2025/9/30", "tags": ["自然醫學", "自然療法", "負能量釋放", "控制情緒", "情緒管理", "告別負能量", "情緒的力量"], "body": "普通人每天大約有 6000 個念頭；其中肯定有一些是負面的，並且會讓許多人產生負面情緒。這些思想和情緒都會對我們的健康產生影響。\n\n情緒對健康的影響具有明確的生理基礎，已被大量醫學研究證實！\n\n情緒反應由大腦邊緣系統主導，尤其是杏仁核在感知威脅時啟用下丘腦-垂體-腎上腺（HPA）軸，進而引發應激激素（如皮質醇、腎上腺素）的大量釋放。這種反應雖然在短期內有助於應對危機，但若長期處於慢性壓力或負面情緒狀態，會導致自主神經系統紊亂，促發持續的低度炎症反應、免疫抑制、血糖與血壓升高，以及神經內分泌功能失調。\n\n長期情緒壓抑與焦慮可增加心血管疾病、胃腸道功能障礙、抑鬱症、自身免疫病及代謝綜合徵的發病風險。因此，情緒並非單純心理層面的現象，而是全身系統性健康的重要調節因子。\n\n負面情緒也會引發 慢性壓力，加速端粒縮短，進而縮短壽命。端粒是 DNA 末端的「保護帽」，隨著年齡縮短，身體也逐漸衰老。\n\n長期壓抑情緒或缺乏管理，會增加多種疾病風險：高血壓、心血管病、消化問題、感染等。身體也會自然回應情緒，比如緊張焦慮時出現心跳加快、血壓升高。\n\n如何管理壓力和負面情緒？\n學會對別人說「不」\n很多壓力來自我們不想參與卻勉強答應的事情。你有多少次對不必要的要求說了「好」？學會為自己設立界限是完全可以的。\n\n放鬆自己，嘗試冥想\n找一個放鬆的環境，花些時間內觀自己，與自己的內在小孩對話。\n\n規律運動\n有氧運動會促使身體釋放內啡肽，這是一種讓人感覺愉快、積極的化學物質。\n\n心理治療\n談論你的感受本身就是一種釋放壓力的方法。心理治療能幫助你找到壓力的來源，並透過識別原因更有效地消除壓力。\n\n學會感恩\n我們常常忽視生活中讓我們開心的小事。試著把注意力放在積極的事上。常常心懷感恩更容易感到快樂，也比沉浸在負面的人睡得更好。\n\n接納你當下的感受\n學會接受當下的負面情緒，想法只是想法，它們不必定義你的價值或未來。\n\n打破反芻迴圈\n當腦海裡不斷重複某件負面事情時，試著做點轉移注意力的動作：散步、運動、聽音樂。讓大腦有機會「換頻道」。\n\n藉助社交與傾訴\n把感受說出來，不論是和朋友聊，還是寫下來，都是釋放負面情緒的好方法。", "cat": "身心壓力", "simple": ["我們每天大約有 6000 個想法，難免有些是不開心的。", "當大腦覺得「有危險」，就會叫身體放出壓力荷爾蒙（皮質醇、腎上腺素），讓心跳變快、血壓變高。偶爾一下沒關係，但如果天天都這樣，身體就會發炎、免疫力變差、血糖血壓升高。", "長期壓力還會讓染色體尾巴的「保護帽」（端粒）變短，人老得比較快。", "好方法有：學會說「不」、冥想、運動、找人聊天或看心理師、感恩、接受自己的心情、去散步轉換頻道。"], "mind": {"c": "負面情緒與健康", "b": [["身體怎麼反應", ["杏仁核感到威脅", "HPA 軸啟動", "皮質醇、腎上腺素升高"]], ["長期的傷害", ["慢性發炎", "免疫力下降", "血糖血壓升高", "端粒變短"]], ["相關疾病", ["心血管病", "腸胃問題", "憂鬱症", "代謝症候群"]], ["管理方法", ["說不、設界線", "冥想、運動", "心理治療、傾訴", "感恩、接納", "散步打破反芻"]]]}, "frame": {"type": "flow", "title": "情緒 → 身體的連鎖反應", "steps": [["負面念頭", "壓力、焦慮、擔心"], ["大腦警報", "杏仁核 → HPA 軸"], ["荷爾蒙", "皮質醇、腎上腺素大量釋放"], ["長期後果", "發炎、免疫差、老化加快"], ["打斷循環", "運動、冥想、傾訴、感恩"]]}, "products": [["054", "GABA（膠囊）", 540, "GABA 是大腦主要的「煞車型」神經傳導物質，幫助緊繃情緒放鬆、穩定。"], ["091", "甘氨酸鎂複方粉包", 1350, "長期壓力會消耗鎂；鎂幫助神經與肌肉放鬆，甘胺酸也有安定、助眠的作用。"], ["062", "酶菌醣體（益生菌＋Beta多醣體＋波羅酵素＋茶胺酸）", 720, "茶胺酸幫助產生放鬆的 α 腦波；益生菌透過腸腦軸支持情緒；Beta 多醣體幫助維持壓力下的防護力。"], ["002", "EPA+DHA複方粉包", 1350, "EPA 可轉成身體的「消炎訊號」，幫助維持情緒與發炎平衡，對應文中提到的慢性低度發炎。"]]}, {"id": 5, "title": "阿育吠陀 Ayurveda｜穿越千年的生命科學", "date": "2025/9/16", "tags": ["阿育吠陀", "自然醫學", "整體醫學", "Ayurveda", "冥想", "自然療愈力", "療愈", "自然療法"], "body": "阿育吠陀（Ayurveda）起源於五千多年前的古印度，是世界上最古老的整體醫學體系之一。其名稱源自梵文「Āyus」（生命）與「Veda」（知識或科學），意為「生命的科學」。\n\n阿育吠陀的智慧最初由印度聖賢在深度冥想中領悟，並以口傳形式流傳，後來被記錄在《吠陀經》尤其是《阿闥婆吠陀》中。它不僅涵蓋疾病的預防與治療，還強調了人類與自然和諧共生、遵循季節與個人體質的生活方式。阿育吠陀深刻影響了南亞及周邊地區的醫學傳統，並在現代以整體健康理念重新受到全球關注。\n\n美國很多人熱衷瑜伽和冥想，人們對阿育吠陀這種自然療法體系的接受程度也大幅提升。它提供的養生理念和生活方式，不僅對西方醫學做了補充，更像是一種可持續的健康選擇。\n\n阿育吠陀認為人體與宇宙由同樣的五大元素：空間、空氣、火、水和地構成，這些元素的不同組合形成了三種基本體質型別：多沙（Doshas）- Vata、Pitta 和 Kapha\n\n阿育吠陀五大元素（Panchamahabhutas）：\n在阿育吠陀醫學裡，五大元素構成了整個宇宙\nAkasha/空間：微妙、清澈、擴充套件\nVayu/空氣：粗糙、乾燥、輕盈、流動\nAgni 或 Tejas/火：熾熱、銳利\nAap/水：流動、溼潤、柔軟、遲緩\nPrithvi/地：沉重、靜止、堅硬、緻密\n\n這五大元素的組合形成了三種多沙（Doshas）：\nVata 由空間和空氣組成\nPitta 由火和水組成\nKapha 由水和地組成\n\n我們每個人體內都含有三種多沙的不同組合比例。這種組合在受孕時就已確定，並受到父母體質和環境因素的影響。Pakriti 是我們每個人獨特的體質構成。多沙是可能失衡的因素，失衡可能導致疾病。\n\n阿育吠陀注重透過飲食、生活方式、草藥、瑜伽、冥想等方法，維持多沙的平衡，從而促進身心健康與預防疾病。它不僅是一種治療體系，更是一種融合自然規律與個體差異的生活哲學。阿育吠陀強調療癒不僅是治療症狀，更是喚醒身體自癒力，讓人迴歸身心靈的和諧狀態。", "cat": "傳統醫學", "simple": ["阿育吠陀是 5000 多年前印度的古老醫學，名字的意思是「生命的科學」。", "它認為宇宙和身體都由五種元素組成：空間、空氣、火、水、土。", "這五種元素組合成三種體質：Vata（空間＋空氣，像風）、Pitta（火＋水，像火）、Kapha（水＋土，像大地）。", "每個人三種比例不同，失去平衡就容易生病，所以要用飲食、作息、草藥、瑜伽、冥想把它調回平衡。"], "mind": {"c": "阿育吠陀", "b": [["起源", ["5000 多年前古印度", "梵文：生命的科學", "記載在吠陀經"]], ["五大元素", ["空間", "空氣", "火", "水", "土"]], ["三種體質 Dosha", ["Vata＝空間＋空氣", "Pitta＝火＋水", "Kapha＝水＋土"]], ["調理方法", ["飲食", "生活作息", "草藥", "瑜伽", "冥想"]], ["核心觀念", ["個人體質 Prakriti", "平衡＝健康", "喚醒自癒力"]]]}, "frame": {"type": "layers", "title": "從宇宙到個人的三層結構", "steps": [["第一層：五大元素", "空間、空氣、火、水、土構成萬物"], ["第二層：三種 Dosha", "元素兩兩組合成 Vata、Pitta、Kapha"], ["第三層：個人體質", "每人比例不同，出生就決定（Prakriti）"], ["調回平衡", "飲食、作息、草藥、瑜伽、冥想"]]}, "products": [["041", "薑黃素＋胡椒鹼提取物（膠囊）", 620, "薑黃是阿育吠陀最重要的香料；薑黃素幫助調節發炎路徑，胡椒鹼（黑胡椒）提升吸收率，正是阿育吠陀傳統的搭配。"], ["070", "辣木粉", 450, "辣木是印度傳統常用植物，富含植物性蛋白、礦物質與抗氧化物，可加入飲食中補充天然營養。"], ["026", "薑黃亮白磨砂膏150g", 120, "把阿育吠陀的薑黃帶進日常保養，溫和去角質。"]]}, {"id": 6, "title": "從職場到醫學院｜跨行讀醫第一年的真實體會", "date": "2025/8/30", "tags": ["自然醫學", "自然醫學博士", "美國讀醫", "美國醫學生", "醫學院", "美國醫學院", "讀博日常", "轉行"], "body": "2024年我從非醫學專業轉行讀醫，第一年的學業剛剛結束，回望這一年的日日夜夜，心裡充滿了感慨。\n\n跨領域的學習真的不容易，尤其是讀醫。讀醫的這四年裡，除了全力應對學業，還要在學習與生活間找到平衡。學習專業知識固然重要，但適度運動、保持健康的飲食和生活節奏、培養興趣、與家人和朋友相聚都同樣重要。\n\n在這期間，還要抽出時間參與講座、社團、學術會議和能拓展人脈，爭取實習機會、志願服務或跟診等，把知識與臨床實踐相結合。\n\n我很慶幸在這條路上，不是一個人孤單前行，而是和一群志同道合的夥伴共同經歷這段難忘的日子。我們這一屆不到50人，來自完全不同的學術和專業背景，不同的年齡、不同的人生階段，卻因為同一個目標聚在一起。過去一年裡，我們並肩走過無數個課堂、實驗、考試與生活的時刻，也一起分享喜悅、挫折與成長。\n\n如果你也在考慮在美國讀醫，請先讓自己有足夠的心理準備，因為這是一段漫長而充滿挑戰的旅程，不僅需要學術上的投入，更需要情緒與生活的平衡。你會面對龐雜的知識體系、高強度的學習節奏，還可能有跨領域的適應過程，同時還要積累臨床實踐的經驗，尋找自己想走的專業方向，建立人脈等等。\n\n但與此同時，你也會遇到一群同樣懷揣理想的人，在彼此的鼓勵與支援中，一起走過艱難的時刻。到最後，你會發現，這不僅是一段成為醫生的過程，更是一段認識自己、塑造自己和自我療癒的旅程。\n\n這條路雖然辛苦，但這是我用心選擇的道路，它承載著我的理想與使命，也讓我更堅定地走向未來。\n\n如果你也還在猶豫是否學醫，或者想了解美國自然醫學，可以找我聊聊哦！", "cat": "醫學生日常", "simple": ["作者原本不是學醫的，2024 年轉行去讀醫學院，這篇是第一年的心得。", "讀醫很辛苦，除了讀書，也要記得運動、吃好、睡好、和家人朋友相處。", "還要參加講座、社團、志工、跟診，把書本知識和真實看病連起來。", "班上不到 50 人，大家背景、年紀都不同，但互相打氣一起撐過來。作者說，這不只是變成醫生的路，也是認識自己、療癒自己的旅程。"], "mind": {"c": "轉行讀醫第一年", "b": [["挑戰", ["跨領域學習", "知識量龐大", "高強度節奏"]], ["要平衡的事", ["運動", "健康飲食", "興趣", "家人朋友"]], ["課外累積", ["講座社團", "學術會議", "志工跟診", "建立人脈"]], ["支持系統", ["不到 50 人的同學", "不同背景互相鼓勵"]], ["收穫", ["認識自己", "自我療癒", "更堅定使命"]]]}, "frame": {"type": "flow", "title": "讀醫之路的心理準備", "steps": [["決定", "想清楚為什麼要讀醫"], ["準備", "做好心理與生活的準備"], ["投入", "學業＋臨床經驗＋人脈"], ["平衡", "照顧身體、情緒與關係"], ["成長", "成為醫生，也更認識自己"]]}, "products": [["087", "超級B群（膠囊）", 520, "轉換跑道、課業繁重時，B 群幫助能量代謝，支持精神與體力。"], ["047", "刺五加（膠囊）", 495, "刺五加是傳統「適應原」草本，幫助身體面對壓力、對抗疲勞，維持耐力。"], ["062", "酶菌醣體（益生菌＋Beta多醣體＋波羅酵素＋茶胺酸）", 720, "益生菌照顧壓力大時容易不適的腸胃，茶胺酸幫助放鬆，Beta 多醣體支持防護力。"]]}, {"id": 7, "title": "自然醫學管理ADHD全攻略", "date": "2025/8/25", "tags": ["自然醫學", "提升注意力", "ADHD", "多動症", "兒童ADHD", "ADHD兒童"], "body": "注意力缺陷/多動障礙（ADHD）在全球的兒童與青少年中，患病率約為 8.0%。男性兒童的患病率約為女性的2倍。成年人中，持續性成人ADHD患病率為約 2.58%。全球目前約有超過1億兒童和1.4億成年人受到ADHD影響。\n\nADHD 是一種神經發育性障礙，常見表現包括注意力不集中、容易分心，活動過度、坐立不安，衝動行為，缺乏條理或難以完成任務等。儘管常規治療多采用藥物干預，越來越多的個人和家庭開始探索更整合性的自然療法。\n\nADHD常常會持續到成年。其成因有很多種，一般認為遺傳、環境和營養因素的共同作用。根據美國疾病控制與預防中心（CDC），遺傳特徵與早期生活經歷都可能影響 ADHD 的發生。\n\n自然醫學認為，每位 ADHD 患者的治療都是個體化的。除了必要時的轉診，醫生還可能結合營養、生活方式輔導、草本療法和身心練習等方式，幫助提升注意力、情緒調節和行為表現。\n\n生活方式與行為策略\n幫助患者建立有結構、可持續的日常安排開始，以提升情緒與認知功能：規律運動， 穩定的睡眠作息，正念呼吸與冥想，視覺化工具，減少螢幕時間，戶外活動\n\n營養最佳化\n富含營養的天然食物有助於穩定能量、減少炎症、增強認知。均衡飲食，避免加工食品、人工色素與新增糖，補充鋅、鎂、鐵、維生素B群，有需要時可進行實驗室檢測，確定是否需補充特定營養素，補充Omega-3 脂肪酸，尤其是 EPA 與 DHA。\n\n腸道健康與食物敏感\n腸腦軸在 ADHD 中尤為關鍵。研究顯示，ADHD 患者的腸道菌群構成與常人不同，可能影響炎症水平與神經發育。自然醫學中的腸道干預包括：排除飲食法，找出敏感食物，益生菌食物與補充劑，營養策略減少腸道炎症並修復腸黏膜\n\n草本與營養補充劑\n在營養與生活方式打好基礎後，可進一步使用天然草藥和補充劑來支援認知與情緒平衡：\n常用的草本配方：婆婆納，銀杏，紅景天，香蜂草\n\n所有補充劑的使用都應由專業醫生評估與指導，尤其對兒童或服藥者更需謹慎。\n\n環境與毒素意識\n部分 ADHD 患者可能對環境毒素更敏感，如重金屬與家用化學品。自然療法醫生可能評估暴露風險，並根據需要採用營養與草本方式溫和排毒。", "cat": "營養飲食", "simple": ["ADHD（注意力不足過動症）是大腦發展上的特質，常見表現是不專心、坐不住、衝動、做事沒條理。全世界小孩大約每 100 人有 8 人。", "原因有遺傳、環境、營養等很多種。自然醫學會依每個人的狀況，量身設計照顧方式。", "方法包括：規律作息和運動、少看螢幕、多去戶外；吃天然食物、少吃加工食品和人工色素；補充鋅、鎂、鐵、B 群和魚油。", "腸道和大腦是好朋友（腸腦軸），所以也要照顧腸道；並少接觸重金屬等環境毒素。任何補充品都要先問醫生，尤其是小孩。"], "mind": {"c": "自然醫學管理 ADHD", "b": [["認識 ADHD", ["不專心", "過動坐不住", "衝動", "兒童約 8%"]], ["生活方式", ["規律運動與睡眠", "正念呼吸", "少螢幕多戶外", "視覺化工具"]], ["營養", ["避開人工色素、添加糖", "鋅、鎂、鐵、B 群", "Omega-3（EPA/DHA）"]], ["腸道健康", ["腸腦軸", "排除飲食法", "益生菌"]], ["草本與環境", ["銀杏、紅景天、香蜂草", "減少重金屬與化學品"]]]}, "frame": {"type": "layers", "title": "由下往上的照顧順序", "steps": [["地基：生活方式", "作息、運動、睡眠、少螢幕"], ["第二層：營養", "天然食物＋補足缺乏的營養素"], ["第三層：腸道", "找出敏感食物、補充好菌"], ["第四層：草本補充", "在醫師評估下使用"], ["外圍：環境", "減少毒素暴露"]]}, "products": [["002", "EPA+DHA複方粉包", 1350, "文中特別提到補充 EPA 與 DHA：DHA 是腦神經細胞膜的重要成分，EPA 幫助調節發炎，支持專注與情緒穩定。粉包形式也方便孩子使用。"], ["017", "酵母鋅＋核酸", 550, "文中建議補鋅：鋅參與多巴胺等神經傳導物質的代謝，也幫助維持免疫；酵母鋅屬溫和好吸收的型態。"], ["091", "甘氨酸鎂複方粉包", 1350, "文中建議補鎂：鎂幫助神經放鬆、支持穩定的睡眠作息。"], ["096", "孢子益生菌（加亞麻仁渣）", 650, "對應「腸腦軸」：孢子型益生菌較耐胃酸，幫助維持腸道菌相平衡；亞麻仁渣提供纖維當好菌的食物。"], ["050", "銀杏複方（銀杏＋巴西蘑菇＋色氨酸＋防風＋玉米黃質）", 510, "文中列出的草本之一是銀杏，幫助維持腦部循環與專注；兒童使用前務必先問醫師。"]]}, {"id": 8, "title": "警惕皮質醇「壓力荷爾蒙」過高的5個訊號", "date": "2025/8/13", "tags": ["自然醫學", "自然療法", "整體醫學", "自然醫學博士", "功能醫學", "內分泌平衡", "抗壓能力差", "皮質醇", "皮質醇管理", "皮質醇高"], "body": "什麼是皮質醇？\n皮質醇（cortisol），常被稱為「壓力荷爾蒙」，其實是我們身體運轉的重要調節員，由腎上腺皮質分泌。它不僅負責應對壓力，更在代謝、免疫、睡眠和炎症控制中扮演關鍵角色。沒有皮質醇，我們撐不過驚嚇、挫折和壓力帶來的挑戰。\n\n▸ 皮質醇有哪些功能？\n幫助身體在壓力或危急狀態下動員能量，維持血糖、血壓與代謝穩定\n抑制炎症反應，調控免疫系統避免過度活躍造成傷害\n維繫睡眠-覺醒節律（早晨是皮質醇喚醒高峰）\n短期壓力時分泌的皮質醇，對身體其實是種保護機制。但如果長期高壓不恢復，慢性應激就會讓身體維持在過度警覺狀態，慢慢透支健康。\n\n▸ 皮質醇過高帶來的健康風險：\n高血壓、血糖異常、脂肪囤積（尤其肚子）\n認知功能下降、記憶障礙，甚至大腦萎縮風險\n睡眠質量差、慢性疲勞、易焦慮、身體恢復慢\n\n▸ 皮質醇對抗慢性壓力：\n壓力或許不會燒壞你的腎上腺，也不會真正耗盡身體的皮質醇儲備，但它帶來的影響是真實存在的。大量研究文獻已經明確指出，高壓力水平與健康受損之間存在密切關聯。\n\n例如，那些經歷過多種童年逆境（ACEs）的人，更容易罹患多種健康問題，包括情緒障礙、肥胖、甚至中風。壓力還可能誘發或加重許多其他疾病，影響身體多個系統的正常功能。\n\n▸ 如何合理管理皮質醇平衡？\n▸ 保證 7–9 小時優質睡眠，避免晚間高壓刺激\n▸ 適量運動，避免過度訓練或節食式運動（過度會短暫升高皮質醇，但長期效果不佳）\n▸ 使用呼吸練習／冥想／瑜伽等方式，有效降低皮質醇水平，改善情緒和記憶力\n▸ 飲食規律：不宜錯過早餐、避免過度戒食、高糖飲食等，「血糖波動」 也會刺激皮質醇升高\n▸ 日常補充劑：我在準備考試前壓力大，會在睡前吃一顆Cortisol Manager，我會用的品牌是Therapeutic Alliance\n\n如果你的症狀已經影響到生活質量，建議儘早就醫瞭解更多資訊。內分泌醫生可以幫助排除腎上腺相關的問題，並識別其他可能出現相似症狀的狀況。", "cat": "身心壓力", "simple": ["皮質醇叫做「壓力荷爾蒙」，是腎上腺做出來的，它其實是身體的好幫手。", "它會在壓力來時幫你提供能量、穩住血糖血壓、壓下發炎，早上也是它叫你起床。", "但如果壓力一直不停，皮質醇一直很高，就會：血壓血糖變高、肚子變胖、記憶力變差、睡不好、很累又容易焦慮。", "怎麼辦？睡滿 7 到 9 小時、適量運動不要過度、做呼吸或瑜伽、三餐規律別亂節食；作者考試壓力大時睡前會吃 Cortisol Manager。症狀嚴重要看醫生。"], "mind": {"c": "皮質醇", "b": [["它的工作", ["提供能量", "穩定血糖血壓", "抑制發炎", "早上叫你起床"]], ["過高的信號", ["血壓血糖高", "肚子囤脂肪", "記憶力下降", "睡不好、疲勞、焦慮"]], ["原因", ["長期慢性壓力", "童年逆境 ACEs", "血糖大起大落"]], ["平衡方法", ["睡 7–9 小時", "適量運動", "呼吸冥想瑜伽", "三餐規律", "補充品＋就醫"]]]}, "frame": {"type": "flow", "title": "皮質醇的好與壞", "steps": [["短期壓力", "皮質醇上升 → 保護身體"], ["壓力不停", "一直處在警戒狀態"], ["過高信號", "肚子胖、睡不好、記性差"], ["調整", "睡眠、運動、呼吸、規律飲食"], ["回到節律", "早上高、晚上低的自然曲線"]]}, "products": [["054", "GABA（膠囊）", 540, "幫助大腦踩煞車、放鬆緊繃，作者考前壓力大時的思路就是「睡前放鬆」，GABA 適合同一情境。"], ["091", "甘氨酸鎂複方粉包", 1350, "壓力會消耗鎂；睡前補充幫助肌肉與神經放鬆，支持文中強調的 7–9 小時好睡眠。"], ["047", "刺五加（膠囊）", 495, "傳統適應原草本，幫助身體調節對壓力的反應、維持體力，與皮質醇調節的概念相呼應。"], ["062", "酶菌醣體（益生菌＋Beta多醣體＋波羅酵素＋茶胺酸）", 720, "茶胺酸幫助放鬆不昏沉；益生菌照顧壓力下的腸胃。"]]}, {"id": 9, "title": "西方世界如何理解「氣」（Qi）?", "date": "2025/8/6", "tags": ["自然醫學", "自然療法", "功能醫學", "氣", "氣功", "自然醫學博士", "東西方文明", "東西方文化結合", "能量", "小紅書醫療健康內容創作倡議"], "body": "東方中醫常講的「氣」，西方人是怎麼理解的？很多西方人把「氣」 （Qi）當作古老東方模糊的靈性概念，但其實在西方自然醫學裡，「氣」的概念已經有了很好的解釋，可以理解為物理學裡的「生命能量」（vital energy），是宇宙萬物的物質基礎。\n\n中國古代哲人透過陰陽、五行來解釋「氣」，強調整體與平衡；西方科學體系強調量化、實驗證據與物理實體。雖兩者表達方式不同，但都是在解釋物質現實層面的機制。\n\n「氣」好比人體內部的能量流，現代醫學可以透過研究它的流動、堵塞、轉換來解釋針灸、氣功等方法的療效。在西方醫學裡，「氣」類比為一種生理能量，它維持體溫、推動血液迴圈、影響免疫反應，甚至可以用生物電、細胞代謝來解釋。當我們說一個人「氣色好」，其實是在說TA的能量迴圈很順暢，代謝平衡，神清氣爽。\n\n▸ 中醫對「氣」的理解：「氣」是維持生命的根本能量，貫穿全身經絡，影響臟腑功能、情緒與健康；其平衡狀態決定一個人的健康水平。「氣」能受到呼吸、飲食和情緒等因素的影響。氣的執行失衡或阻滯是疾病發生的原因。中醫師會透過針灸、中草藥等方法來調和氣的流動，恢復身體的平衡與健康。\n\n▸ 西醫對「氣」的理解：「氣」是人體的能量代謝、線粒體功能等概念之間的潛在聯絡。它更關注可觀察、可量化的生物和化學過程，例如細胞功能、器官系統和生化途徑。當中醫描述「氣」的失衡時，西醫可能將其理解為新陳代謝、血液迴圈或免疫反應等身體系統的紊亂。\n\n也許「氣」無法用顯微鏡看到，也沒有明確的化學式，但它卻真實地影響著我們的呼吸、情緒與睡眠。在中西醫學不斷對話與融合的今天，我們不必非要用一種語言去否定另一種認知，而是可以換一個角度去理解身體運作的奧秘。", "cat": "傳統醫學", "simple": ["中醫常說的「氣」，西方人怎麼看？西方自然醫學把它想成「生命能量」。", "中醫說：氣是維持生命的能量，在經絡裡流動，氣順就健康，氣卡住就生病，用針灸、中藥來調。", "西醫說：氣可能就是身體的能量代謝、細胞裡的「發電廠」粒線體、血液循環和免疫系統在運作。", "說一個人「氣色好」，就是他的能量循環很順。兩種說法不用互相否定，可以換個角度一起理解身體。"], "mind": {"c": "「氣」的東西方理解", "b": [["中醫觀點", ["生命根本能量", "在經絡流動", "陰陽五行", "針灸中藥調氣"]], ["西醫觀點", ["能量代謝", "粒線體功能", "血液循環", "生物電"]], ["影響氣的因素", ["呼吸", "飲食", "情緒", "睡眠"]], ["共同點", ["都在解釋身體機制", "重視平衡", "中西對話融合"]]]}, "frame": {"type": "layers", "title": "中西醫對照表", "steps": [["語言", "中醫：陰陽五行 ｜ 西醫：量化實驗"], ["能量", "中醫：氣 ｜ 西醫：代謝、粒線體 ATP"], ["通道", "中醫：經絡 ｜ 西醫：血液循環、神經"], ["失衡", "中醫：氣滯氣虛 ｜ 西醫：代謝、循環、免疫紊亂"], ["調整", "中醫：針灸中藥 ｜ 西醫：營養、生活方式"]]}, "products": [["060", "Q10（10:1）（膠囊）", 580, "Q10 是粒線體製造能量（ATP）的必要成分，正好對應文中西醫對「氣」的解釋：粒線體功能與能量代謝。"], ["061", "NMN複方（膠囊）", 570, "NMN 是 NAD+ 的前驅物，NAD+ 參與細胞能量代謝，幫助維持細胞活力。"], ["090", "人參皂苷複方（膠囊）", 560, "人參是中醫代表性的「補氣」藥材；人參皂苷幫助對抗疲勞、維持精神與體力。"]]}, {"id": 10, "title": "環境毒素是慢性病的最大元兇！如何排毒？", "date": "2025/8/1", "tags": ["自然醫學", "美國讀醫", "人體免疫力", "環境健康", "排毒", "改善人體微迴圈", "健康", "慢性病", "小紅書醫療健康內容創作倡議"], "body": "現在慢性病為什麼越來越多？糖尿病、心臟病、不孕不育、注意力缺陷、免疫失調，出了遺傳因素，很多人認為是飲食不對，缺乏運動，或生活不規律造成的。\n\n自然醫學教父 Dr. Joe Pizzorno 揭示：環境毒素才是慢性病的最大元兇！\n\nDr. Joe Pizzorno 是美國巴斯蒂爾大學的創校校長。他是《自然醫學教科書》的主編之一，並曾擔任白宮自然健康政策顧問。他從事自然醫學超過50年，始終站在自然醫學研究和教育的最前線，被譽為「自然醫學現代化的奠基人」。\n\n以下是在臨床上最常見、危害最嚴重的十大環境毒素，上圖有詳細說明：\n砷Arsenic\n鉛Lead\n有機氯類農藥OCPs/DDT\n有機磷農藥Organophosphates\n多環芳烴PAHs\n多氯聯苯PCBs\n汞Mercury\n鎘Cadmium\n鄰苯二甲酸酯Phthalates\n雙酚類Bisphenols\n\n很多環境毒素不可避免，我們該怎麼辦？主動排毒，降低體內毒素負擔。\n\n流汗！\n運動、蒸桑拿、和紅外線桑拿可有效排出重金屬和氯化農藥殘留。某些毒素血液或尿液中檢測不到，但汗液中能測出。\n一項芬蘭的研究表明，桑拿能有效排出很多尿液檢測不到的氯化農藥，一週桑拿4次以上，痴呆症風險可降低65%。排毒時也會流失銅、錳等微量元素，記得補充電解質。\n注意：PFAS無法透過流汗排出\n\n食物選擇很關鍵。\n避吃的食物：非有機的草莓、菠菜、蘋果、葡萄、甜椒，因為農藥殘留超高。有機或自家種植的可以吃。\n乾淨食物推薦：牛油果、洋蔥、玉米、芒果、菠蘿\n主要是用有機替代化學種植，可降低9倍有害農藥暴露！\n\n日常習慣小改變：\n進門脫鞋，避免把除草劑和農藥帶入家中，可減少高達86%的毒塵暴露\n過濾飲用水\n選擇低汞魚類：沙丁魚、小鮭魚、鳳尾魚\n更換無毒護膚&清潔用品\n\n減少毒素暴露的 3 個關鍵策略：\n避免接觸：少用塑膠、遠離農藥加工食品和有毒化妝品\n支援身體排毒通道：運動出汗、養肝護腸\n從源頭改變：關注環保，支援無毒產品和政策改革\n\n預防才是最好的治療！\n如果你經常覺得疲倦、腦霧、情緒差，常吃外食、接觸化妝品、住在居住密集的城市裡，你真的該給自己一個深度的排毒療癒！", "cat": "排毒環境", "simple": ["為什麼慢性病越來越多？自然醫學大師 Dr. Joe Pizzorno 說：環境毒素是最大元凶！", "十大常見毒素有：砷、鉛、汞、鎘等重金屬，農藥，塑膠裡的塑化劑和雙酚 A 等。", "怎麼排毒？流汗！運動、三溫暖可以把重金屬和農藥從汗排出（但 PFAS 排不掉），流汗後要補電解質。", "生活小改變：吃有機或乾淨的蔬果、進門脫鞋、喝過濾水、選小型低汞魚（沙丁魚、鯷魚）、換無毒保養和清潔用品。"], "mind": {"c": "環境毒素與排毒", "b": [["十大毒素", ["重金屬：砷鉛汞鎘", "農藥：有機氯、有機磷", "工業：PAHs、PCBs", "塑膠：塑化劑、雙酚"]], ["流汗排毒", ["運動", "三溫暖、紅外線", "補充電解質", "PFAS 排不掉"]], ["吃得乾淨", ["有機草莓菠菜蘋果", "乾淨蔬果：酪梨洋蔥", "低汞小魚"]], ["生活習慣", ["進門脫鞋", "過濾飲用水", "無毒保養清潔"]], ["三大策略", ["避免接觸", "支持排毒通道", "從源頭改變"]]]}, "frame": {"type": "flow", "title": "減少毒素負擔三步驟", "steps": [["認識", "知道毒素從哪來：食物、水、空氣、用品"], ["避免", "有機飲食、脫鞋、濾水、少塑膠"], ["排出", "運動流汗、三溫暖、養肝護腸"], ["補充", "補回電解質與微量元素"], ["預防", "支持無毒產品與環保"]]}, "products": [["085", "NAC複方（膠囊）", 530, "NAC 幫助身體製造穀胱甘肽，是肝臟處理毒素時最重要的抗氧化物之一，對應「支持身體排毒通道」。"], ["072", "蝦紅素200mcg＋硒200mcg（錠）", 530, "硒是抗氧化酵素的核心礦物質，也能和汞等重金屬結合；蝦紅素提供強力抗氧化保護。"], ["033", "亞麻仁籽渣（2包一組）", 198, "豐富的膳食纖維幫助排便順暢，讓經由膽汁排到腸道的物質跟著排出，對應「養肝護腸」。"], ["043", "鹼能活（檸檬酸／檸檬酸鉀／檸檬草／肌酸／肉鹼）", 520, "文中提醒流汗排毒後要補電解質；檸檬酸鉀幫助補充流失的鉀、維持水分平衡。"]]}, {"id": 11, "title": "親身體驗分享｜地中海飲食和生活方式", "date": "2025/7/29", "tags": ["自然醫學", "美國讀醫", "自然醫學博士", "地中海生活方式", "地中海飲食", "地中海生活", "健康飲食", "抗炎", "抗炎飲食"], "body": "暑假期間我前往義大利盧卡（Lucca）小鎮，親身感受地中海的美食與生活方式。\n\n每天的飲食都是典型的 farm-to-table，從當地農場直送到餐桌，新鮮、簡單卻營養豐富。新採摘的番茄、橄欖油、手工麵包和香草調味，搭配悠閒的用餐節奏，飲食不只是為了填飽肚子，更是一種人與自然、人與人之間深層連線的方式。\n\n地中海飲食和和生活方式是在地中海地區，歷經百年自然形成的生活規律，有著其他地區不可替代的文化和歷史背景。近些年來，很多其他地區也開始流行這種生活方式，被很多西方醫療推崇。\n\n許多科學研究證明，地中海飲食和生活方式不僅包括營養豐富的食物結構，還包含了身體活動、社交連結、生活節奏與文化傳統等元素，這種生活方式整體的支援了身體健康和心理幸福感。\n\n飲食結構\n以橄欖油為主要脂肪來源\n高比例攝入蔬菜、水果、全穀物、豆類和堅果\n適量攝入魚類與家禽，低紅肉與加工食品攝入\n適度飲用紅酒，多在用餐時與親友同享\n這種飲食結構具有抗氧化、抗炎、調節血糖與血脂的作用。\n\n身體活動\n地中海生活方式將身體活動自然融入生活，如走路、園藝、烹飪、做家務等。這種無意識的運動，更容易持續且對健康有益。\n\n社交連結\n食物不僅是營養來源，更是人與人情感聯結的媒介。日常與親朋好友共餐、節慶活動、鄰里互動等，都能提升心理健康與幸福感。很多研究證實，良好的社會關係和歸屬感能降低抑鬱、焦慮和慢性病的風險。\n\n生活節奏與心理健康\n強調生活的慢節奏、晝夜規律、充足睡眠與陽光暴露。人們通常有更規律的生活節奏與更低的壓力水平。\n\n文化與價值觀\n地中海生活方式還體現了一種深層的價值觀：尊重自然、重視家庭、節制生活、活在當下。這些文化理念使人們更易持續健康行為，並獲得心靈滿足。\n地中海生活方式是一種多層面整合健康的模式，它結合了營養、運動、社交與心理平衡，不僅能延年益壽，更能提高生活質量。這種生活方式超越了單一的飲食推薦，而是支援個體在現代社會中重建有意義的生活節奏與人際關係。", "cat": "營養飲食", "simple": ["作者暑假去義大利小鎮盧卡，親身體驗地中海飲食和生活。", "吃的都是農場直送的新鮮食物：番茄、橄欖油、手工麵包、香草，慢慢吃。", "飲食原則：用橄欖油當主要的油，多吃蔬菜水果、全穀、豆子、堅果，適量吃魚和雞，少吃紅肉和加工食品。", "不只是吃，還包括：生活中自然地動（走路、做家事）、常和家人朋友一起吃飯、生活慢一點、睡飽曬太陽。這樣能抗發炎、穩血糖，也更快樂長壽。"], "mind": {"c": "地中海生活方式", "b": [["飲食結構", ["橄欖油為主", "蔬果全穀豆堅果", "適量魚和家禽", "少紅肉加工食品"]], ["身體活動", ["走路", "園藝", "煮飯做家事"]], ["社交連結", ["和親友共餐", "節慶活動", "鄰里互動"]], ["生活節奏", ["慢節奏", "規律作息", "充足睡眠", "曬太陽"]], ["價值觀", ["尊重自然", "重視家庭", "活在當下"]]]}, "frame": {"type": "layers", "title": "地中海飲食金字塔（由下往上）", "steps": [["底層：每天", "生活中多走動、和親友共餐"], ["每天大量", "蔬菜、水果、全穀、豆類、堅果、橄欖油"], ["每週數次", "魚類、海鮮"], ["適量", "雞肉、蛋、起司、優格"], ["少量", "紅肉、甜點、加工食品"]]}, "products": [["097", "亞麻仁油（500cc×2瓶）", 780, "富含植物性 Omega-3（α-次亞麻油酸），可像橄欖油一樣用來涼拌、淋沙拉，是地中海式「好油」的另一個選擇（不適合高溫烹調）。"], ["002", "EPA+DHA複方粉包", 1350, "地中海飲食重視吃魚；吃魚不夠時，EPA/DHA 幫助維持血脂與發炎平衡。"]]}, {"id": 12, "title": "避雷｜如何辨別真正的自然醫學醫生ND？", "date": "2025/7/16", "tags": ["自然醫學", "美國讀醫", "美國讀博", "自然醫學博士", "自然療法", "整體醫學", "功能醫學"], "body": "如果你想找合適的自然醫學醫生（ND）做你的家庭醫生，一定要仔細檢視醫生的資質，避免踩雷。美國的醫療是被非常嚴格監管的系統，你在選擇對的醫生時，也一定要記得保護自己和家人。\n\n在美國，很多人稱自己為「自然醫生」（Natural Doctor），如果他們的個人名字後面沒有ND（Doctor in Naturopathic Medicine），專注於功能醫學的MD/DO，或者中醫師，那他們就不是受過正統教育的自然醫生。真正的ND必須透過正規醫學院教育，透過執照考試。而傳統自然療法師通常沒有醫學學位或執照，很多人只是參加了2到4周的短期認證課程。\n\n如何確認ND的執照和資質？\n他們必須擁有4年全日制自然醫學學院頒發的自然醫學博士學位\n他們必須透過國家專業機構AANMC認證程式獲得執照\n\n持牌ND接受的基礎醫學教育與西醫MD相同，同時還學習整體和無毒性的療法，重點關注疾病預防和健康最佳化。\n\n以確保你的醫生有足夠的資質，你可以透過美國自然醫學醫師協會AANMC提供的自然醫學醫生目錄查詢ND並驗證他們的資質。並非每個州都對自然醫學進行監管，建議檢視持牌或申請持牌地區的地圖，確認你的州是否有監管。\n\n也可以檢視他們是否畢業於北美以下幾所獲得認證的自然醫學院：\n1. Bastyr University\n2. National University of Natural Medicine\n3. National University of Health Sciences\n4. Sonoran University of Health Sciences\n5. University of Bridgeport\n6. Canadian College of Naturopathic Medicine\n\n選擇合適的ND至關重要，因為ND能提供創新的解決方案，幫助解決傳統西醫難以應對的問題。他們會在制定治療方案前，深入查詢病因。ND能幫助你避免濫用傷害性治療，比如過度開麻醉性藥物或不必要的手術，同時注重與患者建立長期、信任的關係，持續跟進治療進展，幫助你透過飲食、生活方式、物理調理、營養補充等自然療法，從根本上改善健康狀態。", "cat": "ND 職涯", "simple": ["想找自然醫學醫生（ND）當家庭醫生？一定要先看清楚資格，避免踩雷！", "在美國很多人自稱「自然醫生」，但名字後面沒有 ND 頭銜的，可能只上過 2 到 4 週的短期課程。", "真正的 ND 要：讀完 4 年全日制的自然醫學博士、通過執照考試。他們學的基礎醫學和西醫一樣。", "可以用 AANMC 的醫生目錄查詢，或看他是不是從北美 6 所認證學校畢業（例如 Bastyr 大學）。"], "mind": {"c": "辨別真正的 ND", "b": [["假的特徵", ["名字後沒有 ND", "只上 2–4 週課程", "沒有執照"]], ["真的條件", ["4 年自然醫學博士", "通過執照考試", "基礎醫學同 MD"]], ["怎麼查", ["AANMC 醫生目錄", "確認州是否監管"]], ["認證學校", ["Bastyr", "NUNM", "Sonoran", "CCNM 等"]], ["ND 的好處", ["找根本原因", "避免過度用藥", "長期信任關係"]]]}, "frame": {"type": "flow", "title": "選擇 ND 的檢查清單", "steps": [["看頭銜", "名字後有沒有 ND"], ["查學歷", "是否 4 年認證學校畢業"], ["查執照", "AANMC 目錄驗證"], ["查州法規", "你的州有沒有監管 ND"], ["建立關係", "長期追蹤、找出根本原因"]]}, "products": [["081", "5R腸胃營養素（6g×30包）", 750, "5R 是功能醫學與 ND 常用的腸道修復架構（移除、補充、再植入、修復、再平衡），對應合格 ND「深入找病因」的照顧方式。"], ["062", "酶菌醣體（益生菌＋Beta多醣體＋波羅酵素＋茶胺酸）", 720, "益生菌＋酵素幫助消化與腸道平衡，是自然醫學打好健康基礎的常見第一步。"]]}, {"id": 13, "title": "吃出抗炎體質，這些食物廚房必須有！", "date": "2025/6/24", "tags": ["自然醫學", "自然醫學博士", "可持續飲食", "完整性食物", "健康的飲食習慣", "自然療法", "整體醫學", "用天然食物療愈身心", "吃出健健康"], "body": "炎症是身體對受傷或感染的自然反應，但當炎症變為慢性時，就會引發多種疾病，包括關節炎、心臟病和消化系統問題。在自然醫學中，食物被視為健康的基礎，食物本身就是最有效的「藥」。很多抗炎食材其實早就在你家廚房裡，吃再多的營養補充劑，不如改變一些小生活中的小習慣。\n\n這些日常常備食物，能在你不經意間，幫助減緩慢性炎症，支援身體的自然修復力。\n\n▸  薑黃\n薑黃的抗炎功效我們都知道，但是如何更有效的把它加到我們的飲食中呢？\n廚房小貼士：薑黃粉加到湯、奶昔、酸奶、蔬菜薩拉、或者燕麥粥裡。如果你喜歡喝拿鐵，在奶泡上撒一點。\n\n▸  生薑\n生薑是很多中式菜餚的經典配料，用於溫暖身體和促進消化。補充生薑可顯著降低炎症和氧化應激指標。\n廚房小貼士：中餐用生薑炒菜和煲湯很普遍，習慣西餐的朋友可以早上空腹喝杯薑茶（茶包也行）\n\n▸  橄欖油\n特級初榨橄欖油是地中海飲食中的抗炎核心成分，含有一種名為「油橄欖苦苷」（Oleocanthal）的成分，其效果類似非甾體類抗炎藥。\n廚房小貼士：做沙拉醬或淋在烤蔬菜上。有些可烹飪的橄欖油，我會直接將普通的食用油換成可烹飪的橄欖油。\n\n▸  綠葉蔬菜\n菠菜、羽衣甘藍和瑞士甜菜等蔬菜富含抗氧化物、纖維和植物營養素。綠葉蔬菜等植物性食物與降低炎症指標相關，有助於身體自然排毒。\n\n▸  漿果類\n藍莓、草莓、黑莓等富含花青素，這是一種能抵抗氧化應激和炎症的植物化合物。有助於降低炎症，改善心血管和代謝健康。\n\n▸  富含脂肪的魚類\n如三文魚、沙丁魚和鯖魚，富含歐米伽3脂肪酸，被證明有助於減少炎症、保護心血管健康。歐米伽-3脂肪酸透過改善血脂和調節炎症通路，起到抗炎作用。建議每週吃2-3次野生脂肪魚。\n\n需要避免加劇炎症的食物\n精製糖、加工食品和反式脂肪被證明會提高炎症指標，建議根據個人計劃減少或避免攝入。過量攝入高糖和反式脂肪的超加工食品，會促進慢性低度炎症。減少或去除這些食物，有助於改善整體健康哦！", "cat": "營養飲食", "simple": ["發炎本來是身體在保護自己，但如果一直慢慢地發炎（慢性發炎），就容易得關節炎、心臟病、腸胃病。", "自然醫學說：食物就是最好的藥！廚房裡就有很多抗發炎的好東西。", "像是：薑黃（撒在湯、燕麥、拿鐵裡）、生薑（煮湯、早上喝薑茶）、特級初榨橄欖油、綠色蔬菜、莓果、鮭魚和沙丁魚這些油油的魚（每週 2 到 3 次）。", "要少吃的是：精製糖、加工食品、反式脂肪，它們會讓身體更容易發炎。"], "mind": {"c": "抗發炎飲食", "b": [["香料", ["薑黃：加湯、燕麥、拿鐵", "生薑：煮湯、薑茶"]], ["好油", ["特級初榨橄欖油", "橄欖油刺激醛"]], ["蔬果", ["菠菜、羽衣甘藍", "藍莓、草莓、黑莓", "花青素、纖維"]], ["魚類", ["鮭魚、沙丁魚、鯖魚", "Omega-3", "每週 2–3 次"]], ["要避免", ["精製糖", "加工食品", "反式脂肪"]]]}, "frame": {"type": "flow", "title": "打造抗發炎廚房", "steps": [["清掉", "減少糖、加工食品、反式脂肪"], ["換油", "一般食用油換成橄欖油"], ["加料", "每天加薑黃、生薑"], ["多吃", "綠葉菜、莓果天天吃"], ["每週", "吃 2–3 次油脂魚"]]}, "products": [["041", "薑黃素＋胡椒鹼提取物（膠囊）", 620, "文中第一個抗炎食材就是薑黃；薑黃素幫助調節發炎路徑，胡椒鹼大幅提升吸收，比只撒薑黃粉更方便足量。"], ["002", "EPA+DHA複方粉包", 1350, "文中建議每週吃 2–3 次油脂魚；EPA/DHA 可轉變為「消炎訊號分子」，幫助發炎收尾、維持心血管健康。"], ["097", "亞麻仁油（500cc×2瓶）", 780, "植物性 Omega-3 來源，適合涼拌，幫助調整飲食中 Omega-6 過多的比例。"], ["038", "EGCG複方（茶多酚＋EGCG＋積雪草）", 560, "茶多酚與 EGCG 是強力抗氧化物，和文中的莓果花青素一樣，幫助對抗氧化壓力。"], ["072", "蝦紅素200mcg＋硒200mcg（錠）", 530, "蝦紅素是鮭魚呈紅色的來源，抗氧化力強，幫助保護細胞免受自由基傷害。"]]}, {"id": 14, "title": "針灸在美國熱度飆升，主流醫學怎麼看？", "date": "2025/6/3", "tags": ["自然醫學", "自然療法", "美國讀醫", "自然醫學博士", "針灸", "美國中醫", "美國針灸", "整體醫學", "美國醫療", "美國醫學生"], "body": "在美國長大，雖然對中醫和針灸的瞭解有限，但我發現一個我身邊很有趣的現象：最熱衷中醫針灸的，反而不是中國人。我認識的華人裡，真正去做針灸的很少，反而白人特別多，甚至遇到過不少白人針灸師。一開始我也納悶，為什麼華人反而不太相信中醫和針灸的好處？後來想想，或許正因為這是我們熟悉的東西，反而容易忽視它的價值。\n\n而西方人，儘管未必能完全理解中醫背後的文化哲學和智慧，但他們願意相信這種自然療法，甚至深入的研究它，真的讓我感到非常欣慰\n\n哈佛醫學院的神經科學家們的研究發現，針灸不僅僅是傳統醫學的遺產，更基於紮實的生物學基礎。它不僅有助於我們更好地理解針灸的機制，也為其在抗炎、調節免疫等方面的應用開闢了新的可能性。\n\n如今在美國，針灸已經成為美國主流醫學的一部分。尤其在過去二十年，針灸在美國經歷了從好奇到認可的蛻變：\n▸ 權威認證：美國國家衛生研究院（NIH）早在1997年便承認針灸對慢性疼痛、噁心等病症的療效，並持續資助相關研究。\n\n▸ 醫保覆蓋：聯邦醫療保險（Medicare）及超過半數商業保險計劃已涵蓋針灸治療，尤其針對慢性疼痛和術後康復。2020年，美國醫療保險和醫療補助服務中心首次將針灸納入慢性背痛的醫保範圍，標誌著針灸在美國醫療體系中的接受度顯著提升。\n\n▸ 醫院整合：全美頂尖醫療機構如梅奧診所、克利夫蘭醫學中心紛紛設立針灸門診，與西醫協作提升患者療效。\n\n針灸是一種安全、有效的自然療法，在美國正在被越來越多的醫療專業人士和患者使用。\n\n隨著各州立法擴大針灸師執業範圍，針灸不再只是「輔助療法」，而是預防醫學、疼痛管理和慢性病護理和治療中不可或缺的一環。\n\n傳統醫學與現代科學並非對立，而是可以相輔相成。針灸，這一古老的療法，正在被現代主流醫學重新認識和應用。", "cat": "傳統醫學", "simple": ["作者發現，在美國最愛針灸的反而不是華人，而是很多白人，甚至有很多白人針灸師。", "哈佛醫學院的研究發現，針灸背後有真實的生物學道理，可以幫助抗發炎、調整免疫。", "美國國家衛生研究院（NIH）1997 年就承認針灸對慢性疼痛、噁心有幫助；2020 年起，美國醫保也給付慢性背痛的針灸。", "梅約診所、克里夫蘭醫學中心這些頂尖醫院都有針灸門診。傳統醫學和現代科學不是敵人，可以互相幫忙。"], "mind": {"c": "針灸在美國", "b": [["有趣現象", ["白人比華人更愛", "很多白人針灸師"]], ["科學研究", ["哈佛神經科學研究", "抗發炎", "調節免疫"]], ["權威認可", ["NIH 1997 承認", "慢性疼痛、噁心"]], ["保險給付", ["Medicare 給付", "2020 慢性背痛納保"]], ["醫院整合", ["梅約診所", "克里夫蘭醫學中心"]]]}, "frame": {"type": "flow", "title": "針灸從好奇到主流", "steps": [["好奇", "西方人開始嘗試"], ["研究", "哈佛等找到生物學機制"], ["認可", "NIH 1997 承認療效"], ["給付", "醫保、商業保險涵蓋"], ["整合", "頂尖醫院設針灸門診"]]}, "products": [["091", "甘氨酸鎂複方粉包", 1350, "鎂幫助肌肉放鬆、緩和緊繃，和針灸一起照顧慢性痠痛的身體。"], ["041", "薑黃素＋胡椒鹼提取物（膠囊）", 620, "文中提到針灸的抗發炎機制；薑黃素從飲食面幫助調節發炎，支持關節與肌肉的舒適。"], ["069", "發熱襪", 25, "保暖幫助末梢血液循環，對應針灸常強調的「溫通」，怕冷、手腳冰冷的人適用。"]]}, {"id": 15, "title": "醫學生的Final周生存指南", "date": "2025/6/3", "tags": ["final周", "美國讀醫", "final", "final季", "讀博", "博士生日常", "學醫", "留學生", "留學", "讀醫"], "body": "別再熬夜苦讀了！高強度、高效率的學習，是靠穩定和健康的身心狀態來支撐的。\n\n醫學院第一年就快結束了，這學期讀18門課，馬上到來的Final周連考10門。成功的完成幾個學期後，總結出了幾個既不透支身體，又能維持腦力和能量的小習慣。這些日常的方法非常簡單，只要你願意開始改變。\n如果你也在奔跑的路上，希望這些方法也能幫到你！\n\n腦力飲食\n雞蛋\n牛油果 – 含有健康脂肪、維生素E，滋養大腦、穩定血糖。\n菠菜和羽衣甘藍 - 葉酸、維K、抗氧化，支援腦細胞修復。\n三文魚或深海魚 - 歐米伽-3脂肪酸，提升專注力、穩定情緒\n草飼牛肉 - 富含鐵、鋅、維生素B12，補腦微量營養素\n水果：藍莓、香蕉\n堅果：核桃含有植物型歐米伽-3和維生素E，支援神經系統\n\n充足水分\n身體缺水時，先受影響的就是專注力和記憶力，也就是我們說的「腦霧」。適當讓身體補水可以提升思考清晰度、穩定情緒、預防疲勞，讓大腦時刻保持清醒。高強度學習/工作者每天需要2000～2500ml（大腦代謝高更需要水）\n咖啡不算水，每喝一杯咖啡，請喝回一杯水！\n\n睡眠充足\n你在睡覺時，大腦正在把你學的東西整理歸檔。尤其是深睡期，正是大腦鞏固記憶、整合資訊的高效時段。對正在備考、學習密集期的你來說，睡夠了，比多看一頁更重要。我每天保持至少7小時睡眠，偶爾也會午睡半小時。\n\nCortisol Manager皮質醇調節劑\n我每天在吃的營養補充素，它透過調節皮質醇節律，緩解因長期壓力引起的焦慮和睡眠問題，幫助身體恢復自然的壓力應對能力\n\n清晨日光下赤腳踩地\n每天花30分鐘，到戶外曬太陽、踩草地或泥土地，接受自然的能量。與大地接觸能釋放多餘電荷、降低焦慮與炎症。\n\n真正的自我護理，就是聆聽身體的聲音。餓了就吃，困了就睡，累了就歇一歇，不要總是硬撐著往前趕。事緩則圓，身體被照顧好了，才有能量去面對挑戰！\n\nFinal Week，我們一起加油吧！", "cat": "醫學生日常", "simple": ["期末考週不要再熬夜了！讀書效率靠的是穩定健康的身體。作者這學期 18 門課，期末連考 10 科。", "吃對食物：雞蛋、酪梨、菠菜、鮭魚、草飼牛肉、藍莓香蕉、核桃，幫大腦加油。", "多喝水：缺水會讓腦袋霧霧的，每天要喝 2000 到 2500 毫升；喝一杯咖啡就要補一杯水。", "睡飽：睡覺時大腦在幫你整理記憶，至少睡 7 小時。作者也會吃皮質醇調節補充品，早上去曬太陽、赤腳踩草地放鬆。"], "mind": {"c": "期末週生存指南", "b": [["補腦飲食", ["雞蛋、酪梨", "菠菜羽衣甘藍", "鮭魚、草飼牛", "藍莓香蕉、核桃"]], ["充足水分", ["每天 2000–2500ml", "咖啡不算水", "預防腦霧"]], ["睡眠", ["至少 7 小時", "深睡鞏固記憶", "午睡半小時"]], ["壓力管理", ["Cortisol Manager", "清晨曬太陽", "赤腳踩地"]], ["自我照顧", ["餓了就吃", "累了就休息"]]]}, "frame": {"type": "layers", "title": "考試戰力四根柱子", "steps": [["吃", "補腦食物：好油、蛋白質、莓果"], ["喝", "每天 2000ml 以上水分"], ["睡", "7 小時，讓大腦歸檔記憶"], ["放鬆", "曬太陽、接地、調節皮質醇"], ["結果", "不透支也能維持腦力"]]}, "products": [["002", "EPA+DHA複方粉包", 1350, "對應文中的「三文魚、深海魚」：DHA 支持大腦細胞膜，幫助專注與情緒穩定。"], ["042", "清思油滴（迷迭香精油＋EPA魚油）", 450, "迷迭香香氣常被用來提神、幫助專注；搭配 EPA，適合期末衝刺讀書時使用。"], ["054", "GABA（膠囊）", 540, "對應作者睡前調節壓力的習慣：GABA 幫助放鬆，讓大腦在睡眠中好好整理記憶。"], ["043", "鹼能活（檸檬酸／檸檬酸鉀／檸檬草／肌酸／肉鹼）", 520, "文中強調多喝水防腦霧：電解質幫助身體留住水分；肌酸與肉鹼也參與腦部與肌肉的能量供應。"], ["014", "健康接地枕頭套", 599, "對應文中「赤腳踩地」的接地習慣：沒時間到戶外時，作為睡眠中的接地方式（需搭配有確實接地的插座）。"]]}, {"id": 16, "title": "自然醫學實證｜決定肌肉骨骼健康的5大營養素", "date": "2025/5/17", "tags": ["自然醫學", "自然療法", "美國讀醫", "營養均衡", "營養素"], "body": "說起肌肉骨骼健康，你一定先想到補鈣。其實沒那麼簡單，維生素D、蛋白質、鎂、維生素K等營養素，都是讓骨骼結實、肌肉有力的重要營養因素。尤其是隨著年齡增長，骨量和肌肉量都會慢慢流失，如果不注意日常飲食，容易埋下健康隱患。長期堅持補充營養有助於保持骨密度、預防骨折，維持良好的肌肉力量。\n\n這裡列出了幾個重點營養素及其推薦劑量、最佳形式和作用，一起來看看👇：\n\n▸ 維生素D（1000-2000 IU/天）\n最佳形式：D3\n它幫助鈣吸收，維持骨骼強壯和肌肉力量，還能調節免疫系統，特別適合孕期或骨質疏鬆風險人群。\n\n▸ 鈣（1000-1200 mg/天）\n最佳形式：檸檬酸鈣或羥基磷灰石\n鈣是強健骨骼和牙齒的基礎，還支援神經傳導和肌肉功能。與維生素D、K2和鎂搭配效果更好。\n\n▸ 維生素K2（90-180 mcg/天）\n最佳形式：MK-7\n能提高骨密度、減少骨折風險，還能抑制動脈鈣化、改善血管彈性。建議和維生素D/鈣一起服用。\n\n▸  鎂（200-400 mg/天）\n最佳形式：甘氨酸鎂、檸檬酸鎂\n鎂不僅啟用維生素D，還能防止軟組織過度鈣化，保護骨骼健康。\n\n▸  蛋白質（約20克/天）\n最佳來源：乳清蛋白或植物蛋白\n蛋白質維持肌肉質量，支援骨骼健康，幫助血糖穩定，增加飽腹感。\n\n除了補充營養素，日常的飲食健康也很重要，這8種超實用的護骨強肌食物，推薦給你：\n\n奶製品\n經典的鈣來源，含有豐富的鈣質和蛋白質，幫助維持骨密度和肌肉功能。\n\n深綠色蔬菜\n羽衣甘藍、西蘭花和瑞士甜菜，富含鈣、鎂和維生素K，有助於骨骼健康。\n\n豆腐和豆類\n豆腐、毛豆、白豆等都是植物性飲食中護骨強肌的好幫手。\n\n三文魚\n富含維生素D和鈣，三文魚鈣含量特別高，還提供優質蛋白\n\n堅果和種子\n比如杏仁、芝麻和南瓜籽，富含鎂、鈣和健康脂肪，能增強骨密度和肌肉修復。\n\n雞蛋\n蛋黃含有少量維生素D，整個雞蛋也是優質蛋白的來源，幫助維持肌肉力量。\n\n植物奶\n杏仁奶、豆奶等植物奶通常會額外新增鈣，是乳糖不耐受者的好選擇。\n\n全穀物\n燕麥、糙米等全穀物富含鎂和B族維生素，這些營養素對肌肉功能和骨骼代謝都很重要。\n\n堅持均衡飲食，多樣化攝入這些營養豐富的食物，讓你的骨骼和肌肉更健康有力！", "cat": "營養飲食", "simple": ["想要骨頭硬、肌肉有力，不是只有補鈣那麼簡單！年紀越大骨頭和肌肉會慢慢流失。", "五大營養素：維生素 D3（幫鈣吸收）、鈣（骨頭的磚塊）、維生素 K2（把鈣送到骨頭、不要卡在血管）、鎂（啟動維生素 D）、蛋白質（維持肌肉）。", "它們要一起合作才有效，就像蓋房子要磚塊、水泥和工人一起。", "好食物有：奶製品、深綠色蔬菜、豆腐豆類、鮭魚、堅果種子、雞蛋、加鈣植物奶、全穀類。"], "mind": {"c": "骨骼肌肉 5 大營養素", "b": [["維生素 D3", ["1000–2000 IU", "幫鈣吸收", "支持肌力免疫"]], ["鈣", ["1000–1200 mg", "檸檬酸鈣", "骨骼牙齒基礎"]], ["維生素 K2", ["90–180 mcg", "MK-7", "鈣進骨頭不進血管"]], ["鎂", ["200–400 mg", "甘胺酸鎂", "活化維生素 D"]], ["蛋白質", ["約 20 克", "乳清或植物蛋白", "維持肌肉量"]], ["護骨食物", ["奶製品、深綠蔬菜", "豆腐、鮭魚", "堅果、雞蛋、全穀"]]]}, "frame": {"type": "flow", "title": "鈣從吃進去到變成骨頭", "steps": [["吃進鈣", "食物或檸檬酸鈣"], ["D3 幫吸收", "讓腸道把鈣吸進血液"], ["鎂來啟動", "把維生素 D 轉成活性型"], ["K2 當導航", "把鈣送進骨頭、遠離血管"], ["蛋白質＋運動", "撐起骨架、維持肌力"]]}, "products": [["094", "D3（2000IU＋A＋E）（錠）", 580, "文中建議維生素 D 每天 1000–2000 IU：D3 幫助腸道吸收鈣、維持骨骼與肌肉力量。"], ["091", "甘氨酸鎂複方粉包", 1350, "文中推薦的最佳形式正是甘胺酸鎂：活化維生素 D、參與骨骼形成，也幫助肌肉放鬆。"], ["034", "胺基酸可可粉包（30包）", 780, "對應「蛋白質維持肌肉」：補充胺基酸（蛋白質的組成單位），支持肌肉合成與維持。"]]}, {"id": 17, "title": "順勢療法｜自然醫學的瑰寶", "date": "2025/5/6", "tags": ["自然醫學", "美國讀醫", "自然療法", "生命科學", "美國讀博"], "body": "順勢療法（Homeopathy），也被叫做「和療」，是一種起源於200多年前自然療法體系，由德國醫生Samuel Hahnemann博士在18世紀末創立。順勢療法認為，透過使用極微量稀釋的植物和礦物，可以促進身體自我修復，激發自身的療癒能力。\n\n在歐洲，順勢療法非常普遍，尤其在法國、德國和英國，很多人把它視為日常健康管理的一部分。法國有不少藥房專門出售順勢療法產品，甚至部分醫生會將其作為輔助治療推薦，順勢療法在歐洲有著穩定的使用群體和文化基礎。\n\n它基於兩個非傳統理論：\n▸ 「以毒攻毒」\n▸ 「小劑量法則」\n\n很多順勢療法的藥物稀釋到幾乎不含原始物質的分子。順勢療法透過極高倍數稀釋的植物、礦物或動物提取物，來激發人體自癒能力。\n\n這種療法常用於緩解感冒、流感、過敏、頭痛、焦慮、失眠、關節炎、腸胃不適以及輕微的皮膚問題等。雖然它不能取代急性或重症醫療，但在慢性病和輕度不適的調理中，它有非常好的輔助作用。\n\n順勢治療強調個體化，即根據每個人的不同情況量身定製治療方案。即使是相同的疾病，不同患者可能會得到不同的治療。\n\n常見的順勢療法藥物包括：\n▸ 山金車（Arnica montana）：用於緩解跌打損傷、瘀青、肌肉痠痛和扭傷\n▸ 顛茄（Belladonna）：主要用於處理突發高熱、喉嚨痛、偏頭痛等急性發作性炎症，尤其是在症狀表現為紅、熱、腫、痛時常用。\n▸ 洋蔥（Allium cepa）：用於緩解打噴嚏、流鼻涕、流淚等類似感冒或過敏性鼻炎的症狀，尤其是流出的分泌物刺激性強時。\n▸ 砷化物（Arsenicum album）：常用於治療腹瀉、食物中毒、焦慮、虛弱等症狀，尤其是那種因吃壞東西引發的胃腸道反應。\n▸ 蕁麻（Urtica urens）：常用於皮膚瘙癢、溼疹、蕁麻疹、蟲咬等，尤其是帶有燒灼感的皮膚症狀。\n\n這些藥物通常製成糖丸、滴劑或軟膏，服用時講究個體化方案，強調針對每個人不同的體質和症狀來選擇合適的藥物。\n\n如今，越來越多的科研專案正在關注順勢療法。新的實驗不僅探索它的成分，還在測試它對身體的真實影響。雖然爭議一直存在，但這些研究讓順勢療法越來越透明，也幫助我們更放心地選擇適合自己的自然療法！", "cat": "傳統醫學", "simple": ["順勢療法是 200 多年前德國醫生 Hahnemann 發明的自然療法。", "它有兩個特別的想法：「以毒攻毒」（會讓人出現某症狀的東西，極微量時反而能幫忙），和「小劑量」（把植物礦物稀釋非常非常多倍）。", "在歐洲（法國、德國、英國）很普遍，常用在感冒、過敏、頭痛、失眠、輕微皮膚問題等，但不能取代急症和重症治療。", "常見的有：山金車（瘀青扭傷）、顛茄（突然發燒）、洋蔥（流鼻水打噴嚏）、砷化物（吃壞肚子）、蕁麻（皮膚癢）。目前科學上仍有爭議。"], "mind": {"c": "順勢療法", "b": [["起源", ["德國 Hahnemann", "18 世紀末", "200 多年歷史"]], ["兩大原則", ["以毒攻毒", "小劑量法則", "高倍稀釋"]], ["常用情況", ["感冒過敏", "頭痛失眠", "輕微皮膚問題"]], ["常見藥材", ["山金車：瘀青", "顛茄：高燒", "洋蔥：流鼻水", "蕁麻：皮膚癢"]], ["注意", ["個體化選擇", "不取代重症醫療", "科學仍有爭議"]]]}, "frame": {"type": "flow", "title": "順勢療法的思考方式", "steps": [["觀察症狀", "看每個人的體質和症狀"], ["找相似物", "選會引起類似症狀的物質"], ["高倍稀釋", "稀釋到極微量"], ["做成劑型", "糖丸、滴劑、藥膏"], ["個人化使用", "同病不同方"]]}, "products": [["020", "韓麗熙HANLIXI紫草膏", 69, "和文中的山金車、蕁麻一樣屬於天然外用草本：紫草傳統上用於舒緩蚊蟲叮咬、輕微皮膚不適。"], ["018", "抗鼻腔過敏凝膠", 120, "對應文中洋蔥（Allium cepa）處理的鼻子症狀：在鼻腔形成保護膜，幫助減少過敏原接觸。"], ["068", "蜂膠提取物（膠囊）", 520, "對應文中常見的感冒、季節不適：蜂膠富含類黃酮，幫助維持防護力。"]]}, {"id": 18, "title": "美國自然醫學到底在學什麼？", "date": "2025/5/6", "tags": ["自然醫學", "自然療法", "整體醫學", "美國讀博", "美國讀醫", "健康養生", "讀博日常"], "body": "經常有人問我：自然醫學博士學位到底在學些什麼？和普通的醫學院有哪些不同？\n\n我真心希望能有更多人認識自然醫學ND這個專業和系統。我見過的每一位自然醫學醫生都是充滿熱情、充滿大愛的人。他們非常熱愛自己的事業，因為自然醫學真的能幫助到很多人！\n\n我也只想用自己小小的力量，讓更多人知道，Naturopathic Medicine是什麼，我們都學些什麼，未來如何能貢獻和補足現代醫療系統？\n我們的教育體系非常系統化，前兩年學習和傳統醫學院一樣嚴謹的基礎醫學課程，同時，我們還深入學習自然醫學的理論體系和各種自然療法。\n\n下面大概介紹我們學校課程涵蓋的方向和學分的要求：\n\n基礎醫學\n第一年：人體各個系統的解剖學、組織學、胚胎學、生物化學和生理學\n第二年：病理學、免疫學和傳染病學原理\n\n行為醫學\n患者與醫生之間的療癒關係，生活方式改變與行為生物學基礎，慢性疾病的心理社會因素，健康的社會文化決定因素，以及心理、生理學與身心醫學的相關知識\n\n植物醫學\n植物識別與命名、藥用植物學、治療作用、提取原理、劑量考量、禁忌症、毒理學、草藥與藥物相互作用、臨床應用及治療方案設計\n\n臨床科學\n各專科領域（肺病學、胃腸病學、神經學等）的臨床診斷，飲食與營養治療、植物藥配方、臨床藥理學、診斷檢測與影像學、以及以問題為導向的身體檢查技能。\n\n順勢醫學\n順勢療法的基本原理與哲學、常用順勢藥物的藥材學、順勢療法索引工具的使用、順勢醫學的問診方法以及病例分析。\n\n營養學\n食物與健康的關係、飲食評估、宏量與微量營養素，以及針對自然醫學常見問題的飲食與營養治療。\n\n物理醫學\n課程內容涵蓋多種治療手段，包括水療、電療、骨骼與軟組織手法、運動醫學及治療康復運動。\n\n畢業學分要求：自然醫學博士要求修滿300個學分，包括238.5個核心課程學分、8個選修學分和53.5個臨床學分\n\n讀書的過程非常辛苦，但這種忙碌帶來的是一種對生活的掌控感和重新理解健康的充實感。對我來說，這種不斷學習、靠近生命本質的過程，本身就是一場自我療癒。\n\n希望未來，有更多人能認識自然醫學，也相信自然的力量，迴歸醫療的初心！", "cat": "ND 職涯", "simple": ["很多人問：自然醫學博士到底學什麼？", "前兩年和一般醫學院一樣，學解剖、生理、生化、病理、免疫這些基礎醫學。", "另外還要學自然醫學特有的課：植物醫學（草藥）、營養學、順勢醫學、物理醫學（水療、手法、運動復健）、行為醫學（醫病關係、身心醫學）。", "畢業要修滿 300 學分，其中 53.5 學分是臨床實習。作者說辛苦，但也是一種自我療癒。"], "mind": {"c": "自然醫學課程", "b": [["基礎醫學", ["解剖、組織、胚胎", "生化、生理", "病理、免疫、傳染病"]], ["自然療法", ["植物醫學", "營養學", "順勢醫學", "物理醫學"]], ["臨床科學", ["各科診斷", "臨床藥理", "檢驗影像", "身體檢查"]], ["行為醫學", ["醫病療癒關係", "身心醫學", "社會文化因素"]], ["畢業要求", ["300 學分", "核心 238.5", "臨床 53.5"]]]}, "frame": {"type": "layers", "title": "四年課程架構", "steps": [["第一年", "人體系統：解剖、組織、胚胎、生化、生理"], ["第二年", "病理、免疫、傳染病"], ["貫穿四年", "植物、營養、順勢、物理、行為醫學"], ["後兩年", "臨床科學＋臨床實習"], ["畢業", "修滿 300 學分，考執照"]]}, "products": [["002", "EPA+DHA複方粉包", 1350, "支持大腦神經細胞，幫助長期高強度學習時的專注。"], ["087", "超級B群（膠囊）", 520, "幫助能量代謝，支撐 300 學分課程的精神體力。"], ["070", "辣木粉", 450, "對應「植物醫學」課程：辣木是全球傳統醫學常用的營養植物，富含礦物質與抗氧化物。"]]}, {"id": 19, "title": "功能醫學 vs. 中醫｜不同起源、智慧相通", "date": "2025/4/28", "tags": ["自然醫學", "美國讀醫", "自然療法", "整體醫學", "美國醫療", "功能醫學", "中西結合", "營養", "中醫", "中西結合"], "body": "功能醫學是很多自然醫生在使用的治療方式，它是一個融合了現代科學、生理學、營養學、心理學與生活方式干預的醫學模式。注重人體完整系統的健康，從飲食、睡眠、壓力、腸道菌群、荷爾蒙、營養缺乏到毒素暴露，全都考慮在內。它不只是治療疾病，而是幫助身體回到平衡、自我修復的狀態。\n\n功能醫學中會透過營養干預、微生態調節、荷爾蒙平衡、壓力管理等手段，恢復身體的自我調節能力。\n\n中醫起源於幾千年前的東方哲學，講求陰陽平衡和五臟調和，透過整體觀察和辨證論治來調養身體。\n\n功能醫學和中醫，起源不同，但他們都相信人體是有自我療癒能力的。注重身體系統之間的整體的關係，人與環境的關係，人與自然萬物的關係。\n\n中醫講調五臟、通經絡\n功能醫學講調荷爾蒙、修腸道、補微量營養素\n\n很多人稱功能醫學是「西醫裡的中醫」。但是功能醫學和中醫最大的區別是，功能醫學非常注重科學和認證，像是用現代醫學的語言講述整體健康觀、辨證觀和平衡調和。\n\n在美國，很多自然醫學醫生ND、西醫醫生MD、營養師正在把中醫的智慧與功能醫學結合，比如講針灸、草藥、經絡調理等方式加入到治療中，形成Integrative Medicine（整合醫學），幫助患者從多個維度實現真正的療癒。\n\n這兩種醫學體系在美國實現了很好的互補與融合。在西方國家，各類醫療方式若要被廣泛認可，往往需要具備明確的科學依據和研究支援。功能醫學在傳承傳統自然醫學智慧的基礎上，進一步結合現代科研方法，對機制、資料和療效進行了更系統、深入的探索，也因此更容易被現代醫學界和公眾所接受。\n\n我們不一定非中即西，關鍵是要找到真正適合你的療癒方式！", "cat": "傳統醫學", "simple": ["功能醫學是很多自然醫生在用的方法，它用現代科學看「整個人」：吃什麼、睡得好不好、壓力、腸道細菌、荷爾蒙、缺什麼營養、有沒有接觸毒素。", "中醫是幾千年前的東方智慧，講陰陽平衡、五臟調和、辨證論治。", "中醫講「調五臟、通經絡」；功能醫學講「調荷爾蒙、修腸道、補營養素」。", "兩者都相信身體會自己修復。差別是功能醫學很重視科學證據。在美國很多醫生把兩者結合成「整合醫學」。"], "mind": {"c": "功能醫學 vs 中醫", "b": [["功能醫學", ["現代科學", "調荷爾蒙", "修腸道", "補微量營養素"]], ["中醫", ["東方哲學", "陰陽平衡", "調五臟", "通經絡"]], ["共同點", ["身體會自癒", "整體觀", "人與自然關係"]], ["差異", ["功能醫學重科學驗證", "中醫重辨證經驗"]], ["整合醫學", ["ND、MD、營養師", "針灸草藥＋功能醫學"]]]}, "frame": {"type": "layers", "title": "兩種醫學對照", "steps": [["起源", "功能醫學：現代科學 ｜ 中醫：古代東方哲學"], ["看身體", "系統互相影響 ｜ 陰陽五行整體觀"], ["方法", "營養、腸道、荷爾蒙 ｜ 針灸、草藥、經絡"], ["證據", "重研究數據 ｜ 重臨床經驗"], ["交會", "整合醫學：多維度療癒"]]}, "products": [["081", "5R腸胃營養素（6g×30包）", 750, "文中說功能醫學講「修腸道」：5R 就是功能醫學的腸道修復架構，幫助維持腸黏膜與消化功能。"], ["096", "孢子益生菌（加亞麻仁渣）", 650, "幫助維持腸道菌相平衡，對應功能醫學中的「微生態調節」。"], ["090", "人參皂苷複方（膠囊）", 560, "對應中醫：人參是補氣代表藥材，幫助維持精神與體力，是中西整合的好例子。"]]}, {"id": 20, "title": "自然醫學｜科學與靈性的相遇", "date": "2025/4/26", "tags": ["自然醫學", "美國讀醫", "自然療法", "美國讀博", "AI醫療", "科技與人性", "自然醫學博士", "整體醫學"], "body": "今天的西方醫療正面對著很多的挑戰，例如AI技術的不斷更新，讓醫療更加「非人性」。隨著人們對身心健康的需求越來越強，我們該對「人」存在的本身有更深層次的認知，因為作為人，我們不會把生命或生死這樣的重大決定交給機器。未來的醫生，只掌握醫療知識和技術是遠遠不夠的，而更應該是懂得和尊重生命內在的靈性與活力的療癒者。\n\n「靈性」是什麼？\n靈性，是我們人與自己、與他人、與生命本質之間的連線，是在與萬物之間的各種關係中達到平衡的狀態。\n\n一個人的靈性，不一定和玄學相關，每個生命都具有這樣的靈性。這是一種迴歸本我、感知當下、保持內心平靜和安定的能力。而這種穩定感，正是我們每個人健康的復甦，和能量流動的基礎。\n\n傳統西醫的治療中，靈性常被視為與醫療無關的領域，僅在末期病患或危機時刻才被觸及。其實靈性（精神+心靈）對一個人健康的影響，甚至高於身體本身。很多身體的問題，其實是精神和心靈的表達和釋放。\n\n未來的醫學不該僅僅是科學，更應該是一種找回靈性的活力的實踐。真正的康復，是源於內心的覺醒、與本我的連線，以及精神和信念的重建。\n\n自然醫生在面對病人時，會觀察病人的精神狀態與內心世界。許多慢性病的根源，不只是來自生理上的失調，而是長時間被忽視的情緒壓力、心理創傷，或內在失衡。\n\n真正的療癒，始於看見一個人最真實的靈性狀態。", "cat": "身心壓力", "simple": ["現在 AI 越來越厲害，醫療也可能變得「沒有人情味」。作者覺得未來的醫生，不能只會技術，還要懂得尊重人的「靈性」。", "靈性不是怪力亂神，而是：你和自己、和別人、和生命之間的連結，是一種內心平靜、安定的能力。", "很多身體的問題，其實是心裡的壓力、情緒、創傷沒有被看見。", "自然醫生看病時，也會觀察病人的精神和內心。真正的療癒，從看見一個人真實的內心開始。"], "mind": {"c": "科學與靈性", "b": [["時代挑戰", ["AI 讓醫療非人性", "人更需要被理解"]], ["什麼是靈性", ["與自己連結", "與他人連結", "內心平靜安定"]], ["靈性與健康", ["身體問題反映心靈", "情緒壓力、創傷"]], ["自然醫生做法", ["觀察精神狀態", "了解內心世界"]], ["真正療癒", ["內心覺醒", "重建信念"]]]}, "frame": {"type": "flow", "title": "身心靈療癒的路徑", "steps": [["看見", "觀察一個人真實的狀態"], ["連結", "與自己、他人、生命建立連結"], ["釋放", "處理被忽略的情緒和壓力"], ["安定", "找回內心平靜"], ["療癒", "身心靈一起恢復活力"]]}, "products": [["040", "迷迭香滾珠瓶10ml", 150, "冥想、靜心時塗抹，香氣經嗅覺影響大腦情緒中心，幫助回到當下、安定內心。"], ["054", "GABA（膠囊）", 540, "幫助緊繃的神經放鬆，支持文中說的「內心平靜和安定」。"]]}, {"id": 21, "title": "醫學生的時間管理實戰筆記", "date": "2025/4/23", "tags": ["自然醫學", "美國讀醫", "整體醫學", "自然醫學博士", "學醫", "醫學博士", "效率神器", "讀博日常", "美國醫學生", "醫學生日常"], "body": "如果你有在讀醫的朋友， 突然一段時間他們不怎麼回資訊，忘記你的生日，忘記某個節日，或突然emo，請一定要原諒他們！因為除了吃飯和睡覺，他們其餘時間都在學習和思考。\n\n5個小tips，教你在高強度學習中，高效時間管理：\n\n1️⃣找到你的「黃金時段」\n每個人專注力最強的時間段不同，有人早上頭腦最清醒，有人晚上反而效率高。找到自己最能沉浸式學習的那段時間，Prioritize最難學的課在那段時間。一旦注意力開始分散，給自己20-30分鐘時間休息或者運動。\n\n2️⃣碎片時間用來休息\n碎片時間包括：開車、走路、逛超市、課間休息、飯後消化時犯困的半小時，做深呼吸、閉眼放鬆、拉伸身體、聽音樂、或者處理一些瑣事，讓大腦暫且休息。還有一種休息是和家人朋友通話聊天。精神和情緒支援非常關鍵。我每天會用這些時間和家人通個電話，跟閨蜜聊聊天，哪怕只是小小的抱怨，也是種釋放。有這些溫暖的連線，真的可以讓你多堅持一下。\n\n3️⃣堅決不犧牲7小時睡眠時間\n睡眠不足會讓你注意力渙散、記憶力下降，反而拖慢學習的進度，影響你的整體狀態。對於醫學生來說，持久線上的記憶力和時刻清醒的大腦真的太重要了！\n\n4️⃣懂得取捨\n讀醫就像一場漫長的馬拉松，身體和精神要時刻保持在奔跑，這也是種身心的修行。不想透支自己，就要願意短暫的犧牲，捨棄一些不必要的社交、購物和娛樂，把注意力放在那些真正滋養自己的小事上：運動、聽音樂、在家看電影、冥想。清理情緒垃圾很重要，越少干擾，越能讓大腦保持清醒。\n\n5️⃣給自己設立獎罰機制\n人是需要激勵的，適當要給自己「談條件」。\n比如：今天完成8小時的課程的複習，就可以獎勵自己看2小時綜藝；相反，如果偷懶划水了，效率不高，罰自己2小時不碰手機。\n\n道理都懂，但是如何保持自律？\n首先找到你的痛點在哪裡，你忙碌的意義和目的在哪裡？\n\n作為醫學生，每次撐不下去的時候，就想想自己這些年付出的時間、錯過的經濟和機會成本，掉的頭髮，和住在海邊卻錯過了大半年的日落。然後再默默的在給自己打一波雞血，憧憬拿到從醫執照的那一刻…", "cat": "醫學生日常", "simple": ["醫學生超忙，如果他們很久沒回訊息、忘記你生日，請原諒他們！", "五個時間管理小撇步：一、找到自己最專心的「黃金時段」，拿來讀最難的課；二、零碎時間拿來休息，深呼吸、伸展、跟家人朋友聊天。", "三、絕對不犧牲 7 小時睡眠；四、懂得取捨，少一點不必要的社交和購物；五、給自己設獎勵和處罰。", "想自律，就要想清楚自己為什麼這麼努力，想像拿到醫生執照的那一刻！"], "mind": {"c": "時間管理 5 招", "b": [["黃金時段", ["找最專心的時間", "讀最難的課", "分心就休息 20–30 分"]], ["碎片時間", ["深呼吸伸展", "聽音樂", "和家人朋友聊天"]], ["睡眠", ["堅持 7 小時", "記憶力關鍵"]], ["取捨", ["少不必要社交", "少購物娛樂", "清理情緒垃圾"]], ["獎懲機制", ["完成就獎勵", "偷懶就罰不碰手機"]], ["自律來源", ["想清楚意義", "想像拿到執照"]]]}, "frame": {"type": "flow", "title": "一天的高效安排", "steps": [["找時段", "黃金時段讀最難的"], ["休息", "分心就休息或運動"], ["碎片", "零碎時間放鬆、聯絡家人"], ["獎勵", "完成目標給自己獎勵"], ["睡覺", "7 小時，隔天再戰"]]}, "products": [["062", "酶菌醣體（益生菌＋Beta多醣體＋波羅酵素＋茶胺酸）", 720, "茶胺酸幫助在「黃金時段」放鬆又專注；益生菌照顧久坐、壓力大的腸胃。"], ["091", "甘氨酸鎂複方粉包", 1350, "睡前幫助放鬆，守住文中堅持的 7 小時好睡眠。"], ["049", "加強B群", 520, "早上補充，幫助能量代謝、開啟一天的學習精神。"]]}, {"id": 22, "title": "美國醫學生都在用的6大學習神器", "date": "2025/4/19", "tags": ["自然醫學", "美國讀醫", "整體醫學", "自然醫學博士", "學醫", "醫學博士", "效率神器", "讀博日常", "美國醫學生", "醫學生日常"], "body": "學醫之路充滿挑戰，但高效的學習工具能讓學習事半功倍。美國醫學生依靠這些實用的學習工具來最佳化學習流程，整理複雜知識點和高效記憶，更聰明地學習。\n\n作為醫學生，一學期（10周）要學18門課，能提升學習效率的工具真的太重要了！經過長期使用和篩選，這6款工具是我日常學習的得力助手，他們真的能切實解決醫學生在學習中的各種痛點。\n\nAnki：醫學生沒時間浪費在重複低效複習上，Anki 用演算法幫你精準複習該記的內容，盯著你常錯的知識點反覆考，適用於任何科目。\n\nOsmosis：用動畫影片把醫學知識講得又清楚又生動，還有搭配記憶卡、測驗和重點筆記。\n\nKenhub：這是我最經常用的教學影片，提供超過 500 個影片教程、5000 多張高質量解剖影象，可自定義的測驗，覆蓋從基礎解剖到神經解剖、放射和組織學等多個領域。\n\nHuman Anatomy Atlas：在 iPad上用的解剖學App，有互動式的 3D 模型。涵蓋全身各系統，支援放大、旋轉、剖切等操作。提供包括中文在內的多種語言介面，方便不同背景的學生使用。\n\nCoconote：專為學生設計的 AI 筆記工具，可以自動將課上的講座內容轉化為結構清晰的筆記、閃卡和考題。有些課2小時講100多頁slides，考試點還不在slides裡，主要靠課上演講的內容，這個App是我們的保命神器。\n\nYoutube影片：這兩個教學的頻道，比professor講得好太多了！\nSam Webster 解剖學和胚胎學的影片超實用，他結合了清晰的講解和實際的解剖模型演示。他個人對醫學也極具熱情。\n\nNinja Nerd 是一個專注於醫學教育的頻道。各個系統的生理學，生物化學，藥理學等課程的邏輯和結構講得深入且清晰。\n\n當然還有很多AI工具（注：當前醫學相關的內容，ChatGPT 的準確率約在75-80%，考慮到醫學對精確性的高要求，我更相信這些經過驗證的專業工具）\n\n送給正在讀醫的你：一定要相信，你熬過的夜、啃過的書，都將成為你未來的底氣。祝你考試All Pass！", "cat": "學習工具", "simple": ["醫學生一學期（10 週）要讀 18 門課，好工具超重要！", "Anki：會算出你什麼時候快忘記了，就叫你複習，常錯的題目一直考你。", "Osmosis：用動畫影片把醫學講清楚；Kenhub：有超過 500 支解剖影片和 5000 多張圖；Human Anatomy Atlas：iPad 上的 3D 人體模型，可以轉、放大、切開看。", "Coconote：AI 把老師上課講的話變成筆記、閃卡和考題。YouTube 頻道 Sam Webster（解剖）和 Ninja Nerd（生理、藥理）也很推薦。"], "mind": {"c": "6 大學習神器", "b": [["記憶複習", ["Anki 間隔重複", "Coconote AI 筆記閃卡"]], ["影片學習", ["Osmosis 動畫", "Kenhub 解剖影片", "YouTube 頻道"]], ["3D 解剖", ["Human Anatomy Atlas", "旋轉放大剖切"]], ["YouTube 推薦", ["Sam Webster 解剖", "Ninja Nerd 生理藥理"]], ["提醒", ["ChatGPT 醫學準確率約 75–80%", "優先用驗證過的工具"]]]}, "frame": {"type": "flow", "title": "一門課的學習循環", "steps": [["預習", "Osmosis／Ninja Nerd 影片"], ["上課", "Coconote 錄音轉筆記"], ["看結構", "Kenhub、3D Atlas 看解剖"], ["記憶", "Anki 間隔複習"], ["考試", "All Pass！"]]}, "products": [["001", "防藍光護目鏡", 200, "整天看 Kenhub、Osmosis 影片和 iPad 3D 解剖，幫助減少藍光刺激與眼睛疲勞。"], ["050", "銀杏複方（銀杏＋巴西蘑菇＋色氨酸＋防風＋玉米黃質）", 510, "玉米黃質保護眼睛黃斑部；銀杏幫助維持腦部循環，適合用眼又用腦的讀書族。"], ["042", "清思油滴（迷迭香精油＋EPA魚油）", 450, "迷迭香香氣幫助提神專注，EPA 支持腦部健康，搭配 Anki 複習時段使用。"]]}, {"id": 23, "title": "美國自然醫學 | 各州執業範圍指南", "date": "2025/4/15", "tags": ["第二人生夢想家", "自然醫學", "美國讀醫", "美國讀博", "美國醫療", "醫療", "自然療法", "整體醫學", "美國醫生"], "body": "如果你想成為自然醫學醫生（ND），一定要先了解你想從業的州是否對ND有執照監管和該州的執業範圍，因為每個州的規定差別挺大的。\n\n在加州，我們CNDA的會員每年4月都會前往州政府參加Lobby Day，與州議員直接對話，推動自然醫學在加州執業範圍的更新與擴充套件，為患者爭取更全面的自然療法選擇。\n\n華盛頓州、俄勒岡州很支援自然醫學，ND已經可以納入Medicaid醫保了，還有很多商業保險也會覆蓋自然療法。現在越來越多的州開始重視ND，大家對自然醫學的認同感也在提升，這個職業的路也越來越清晰了。\n\nND的主要執業範圍包括：\n自然療法\n開藥物處方和管制類藥物\n開常規和影像檢查\n可要求抽血化驗\n提供婦科服務\n進行靜脈注射\n小型手術\n\n以下是目前對ND給予執照和明確執業範圍的州：\n\n1. 亞利桑那州 Arizona\n2. 加利福尼亞州 California\n3. 科羅拉多州 Colorado\n4. 康涅狄格州 Connecticut\n5. 特拉華州 Delaware\n6. 夏威夷州 Hawaii\n7. 堪薩斯州 Kansas\n8. 緬因州 Maine\n9. 馬薩諸塞州 Massachusetts\n10. 明尼蘇達州 Minnesota\n11. 蒙大拿州 Montana\n12. 新罕布什爾州 New Hampshire\n13. 新澤西州 New Jersey\n14. 新墨西哥州 New Mexico\n15. 俄勒岡州 Oregon\n16. 羅德島州 Rhode Island\n17. 猶他州 Utah\n18. 佛蒙特州 Vermont\n19. 華盛頓州 Washington\n20. 北達科他州 North Dakota\n21. 密歇根州 Michigan\n22. 內華達州 Nevada\n23. 弗吉尼亞州 Virginia\n24. 哥倫比亞特區 District of Columbia\n25. 波多黎各 Puerto Rico\n26. 美屬維京群島 U.S. Virgin Islands\n\n各州對自然醫生的執業許可權差異很大，選擇前一定要先做好功課，瞭解清楚再出發哦！", "cat": "ND 職涯", "simple": ["想當自然醫學醫生，要先知道你想工作的州有沒有 ND 執照，以及可以做哪些事，每州差很多。", "在加州，作者和協會成員每年 4 月去州政府「遊說日」，跟議員爭取擴大 ND 的工作範圍。", "華盛頓州、奧勒岡州很支持 ND，已經可以用醫療補助保險（Medicaid）。", "ND 可以做：自然療法、開處方、開檢查和抽血、婦科服務、打點滴、小手術。目前有 26 個地區發 ND 執照。"], "mind": {"c": "美國各州 ND 執業", "b": [["執業範圍", ["自然療法", "開處方藥", "開檢查、抽血", "婦科、靜脈注射", "小手術"]], ["支持的州", ["華盛頓州", "奧勒岡州", "加州"]], ["倡議行動", ["加州 CNDA", "每年 4 月 Lobby Day"]], ["保險", ["Medicaid 給付", "商業保險"]], ["執照地區", ["26 個州與地區", "每州規定不同"]]]}, "frame": {"type": "flow", "title": "選擇執業州的步驟", "steps": [["查清單", "該州是否發 ND 執照"], ["看範圍", "能不能開藥、做檢查"], ["看保險", "是否納入醫保"], ["看環境", "當地接受度與協會"], ["決定", "選擇適合的州執業"]]}, "products": [["087", "超級B群（膠囊）", 520, "忙碌的執業與倡議行程中，幫助能量代謝、維持精神。"], ["096", "孢子益生菌（加亞麻仁渣）", 650, "幫助維持腸道與免疫平衡，出差奔波時也照顧消化。"]]}, {"id": 24, "title": "自然醫學｜美國醫療的新趨勢", "date": "2025/4/13", "tags": ["第二人生夢想家", "自然醫學", "自然療法", "療愈", "生命科學", "醫療資源與醫療自由", "解鎖健康新方式", "工作與健康", "恢復精神平衡的自然療法"], "body": "在美國做自然醫生（ND），意味著你必須準備好面對來自傳統西醫體系的質疑與阻力。\n\n你會被反覆問起：什麼是自然醫生？你們能治病嗎？\n\n那些質疑都來自不瞭解，甚至從未真正接觸過ND的人。但也正是在這些質疑中，你會一次次回望自己的初心，思考為什麼走上這條路。這不是一條好走的路，它需要你有堅定的信念，也需要你內在足夠清晰、強大，能夠不被外界的標準定義自己的價值。\n\n在美國真正知道和了解自然醫生這個行業的人並不多，但我希望在這裡讓更多人認識和了解ND，因為自然醫學是美國乃至世界醫療的未來，我們彌補了傳統西醫在日常健康、慢性疾病治療和疾病預防等方面的缺陷。有不少聲音源於擔憂，因為在美國很多州，這個專業正在撼動原有醫療體系的結構與經濟利益。\n\n而最近看到的一篇論文提到，自從ND在很多州獲得並擴充套件了執業範圍，部分傳統西醫界開始將ND視為對行業的「disruption」。但對於一個蒸蒸日上的行業來講，disruption並不是負面的詞，反而是創新、進步、系統更新的象徵。ND被視為一種對行業的「撼動」，說明我們正在真正的影響這個行業，正在推動人們重新思考：什麼才是有效的醫療？什麼才是以人為本的治療觀念？\n\n入學那天，教授們重複最多的詞不是「診斷」或「治療」，而是「同理心」。在自然醫學裡，我們未來對抗的不只是疾病，而是每一個來自不同背景、環境、故事、有情緒、有選擇的人。\n\n我們不會「取代」，而是「補全」。其實，在美國的中醫師和整骨醫生也正在經歷同樣的挑戰與誤解。我們並不是在反對傳統西醫，而是在努力找回醫療本應有的，以人為本的初心與價值。", "cat": "ND 職涯", "simple": ["在美國當自然醫生，常常會被質疑：「你們能治病嗎？」", "那些質疑多半來自不了解。作者說要有堅定的信念，不讓別人來定義自己的價值。", "自然醫學補上了西醫在日常保健、慢性病、預防上的不足。有論文說 ND 正在「撼動」醫療業，但這代表創新和進步。", "入學第一天教授最常說的詞是「同理心」。ND 不是要取代西醫，而是「補全」，找回以人為本的醫療。"], "mind": {"c": "自然醫學新趨勢", "b": [["面對質疑", ["什麼是 ND？", "能治病嗎？", "來自不了解"]], ["ND 的價值", ["日常保健", "慢性病", "疾病預防"]], ["Disruption", ["撼動舊體系", "代表創新進步"]], ["核心精神", ["同理心", "以人為本"]], ["定位", ["不取代而是補全", "與中醫、整骨醫師同路"]]]}, "frame": {"type": "flow", "title": "從被質疑到被看見", "steps": [["質疑", "大眾不了解 ND"], ["堅持", "回到初心，信念清晰"], ["補位", "補足慢性病與預防的缺口"], ["撼動", "推動醫療系統更新"], ["共好", "與西醫互補，以人為本"]]}, "products": [["092", "D3（5000IU）（錠）", 580, "文中說 ND 補足「預防」的缺口：多數人日曬不足，D3 支持骨骼、免疫與情緒（高劑量建議先驗血再使用）。"], ["002", "EPA+DHA複方粉包", 1350, "預防保健的基礎營養，幫助維持心血管與發炎平衡。"]]}, {"id": 25, "title": "美國自然醫學｜執照獲取全流程解析", "date": "2025/4/9", "tags": ["自然醫學", "海外留學", "生物醫學科研", "留學申請季", "美國讀博", "美國讀醫", "自然醫學博士", "整合醫學", "醫學博士", "自然療愈", "博士留學"], "body": "最近好多小夥伴問我，在美國做自然醫生有哪些要求，在哪讀書，非醫療專業能不能讀，需要哪些執照之類的問題。\n\n在美國成為一名執業的自然療法醫生（Naturopathic Doctor, ND），需要完成以下步驟：\n\n完成本科預修課程： 包括生物學、化學、物理學、心理學、微積分等科目，具體要求因學校而異。 如果大學不是讀醫學預科或從其他行業轉行，要用自己的時間讀完預修課程並達到要求的成績才能申請學校。我的本科和研究生沒有讀醫學專業，在申請學校之前，我花了一年半的時間，在非常忙碌的full time工作的同時，讀完8門預修課程。之後會分享一篇學校的申請流程和注意事項。\n\n讀四年的自然醫學博士學位（ND）： 在獲得美國教育部認可的機構認證的自然醫學院，完成四年制的博士級課程。目前北美（美國和加拿大）有7所CNME機構認證的自然醫學院校。\n\n透過NPLEX考試： 這個考試分為兩次考，第一次是在完成第二年學業後考，第二部分是在畢業後考。透過由自然醫學醫生考試委員會（NABNE）管理的自然醫生執照考試，該考試涵蓋基礎科學、診斷和治療學科以及臨床科學等科目。\n\n滿足所在州的執照要求： 美國的不同州對自然醫生的執業要求和執業範圍有不同的規定，包括透過法律法規考試、背景調查和每年的繼續教育等。\n\n請注意，並非所有州都對自然療法醫生進行執照管理，因此在選擇執業地點時，需確認當地的法律法規。畢竟這是一條很長的路，需要考慮你在這四年的時間分配、生活狀態、經濟支撐等現實的問題。\n\n如果你想了解ND和MD的區別，或未來就業的方向，請看之前的筆記，或者在留言區提問。", "cat": "ND 職涯", "simple": ["要在美國成為自然醫學醫生（ND），有四個步驟。", "第一，讀完大學的先修課：生物、化學、物理、心理、微積分。作者不是讀醫的，一邊全職工作一邊花一年半讀完 8 門課。", "第二，讀 4 年自然醫學博士（北美有 7 所認證學校）；第三，通過 NPLEX 執照考試（二年級後考第一部分，畢業後考第二部分）。", "第四，符合你要執業那一州的規定，像法規考試、背景調查、每年繼續教育。要好好想清楚時間、生活和經濟。"], "mind": {"c": "ND 執照全流程", "b": [["1 先修課", ["生物化學物理", "心理、微積分", "作者花 1.5 年讀 8 門"]], ["2 讀博士", ["4 年 ND 課程", "北美 7 所認證學校", "CNME 認證"]], ["3 執照考", ["NPLEX Part I：二年級後", "NPLEX Part II：畢業後", "NABNE 管理"]], ["4 州規定", ["法規考試", "背景調查", "繼續教育"]], ["現實考量", ["時間", "生活", "經濟"]]]}, "frame": {"type": "flow", "title": "成為 ND 的四階段", "steps": [["先修課程", "補齊理科與心理基礎"], ["申請入學", "CNME 認證的 ND 學校"], ["四年學習", "第二年後考 NPLEX I"], ["畢業考照", "通過 NPLEX II"], ["州執照", "法規考試、背景調查後執業"]]}, "products": [["049", "加強B群", 520, "作者一邊全職工作一邊讀先修課：B 群幫助能量代謝，支撐雙重忙碌。"], ["054", "GABA（膠囊）", 540, "NPLEX 考前幫助放鬆、穩住情緒。"], ["002", "EPA+DHA複方粉包", 1350, "支持大腦長期學習與記憶。"]]}, {"id": 26, "title": "飲食療癒｜這些碳水讓你越吃越聰明！", "date": "2025/4/7", "tags": ["自然醫學", "自然療法", "食療", "碳水化合物", "健康的飲食習慣", "完整性食物", "用天然食物療愈身心", "碳水", "你是吃出來的", "食物的力量", "食物與情緒", "控糖"], "body": "我們的大腦雖僅佔體重的2%，卻消耗每日約20%的能量。很多人因為減肥不願意吃碳水，但很多碳水對我們大腦有直接的能量供應。其實，你的大腦超愛碳水！但吃對很重要。碳水可以吃，根據身體的需求適時適量的吃，不僅不會胖，反而會提升大腦工作的效率。\n\n什麼是低血糖指數的碳水化合物？它們是不會讓血糖迅速飆升的碳水，在體內被消化和吸收得較慢，能帶來更穩定的能量釋放。我們的大腦喜歡穩定供糖而不是快速供糖。血糖快速升高，胰島素快速增加，緊接著血糖又快速下降。這種波動會讓你感到疲勞，無法集中注意力，情緒波動大，長期下來甚至影響記憶力和認知功能。\n\nGI = Glycemic Index（血糖生成指數）\nGI值指的是食物讓血糖上升的速度，數值越高，血糖波動越大。\n\n低血糖指數（GI ≤ 55）：可以經常吃，不僅對大腦健康有益，還不會發胖\n水果（蘋果、奇異果、莓果類），綠葉蔬菜、胡蘿蔔，豆類（扁豆、黑豆、紅豆、鷹嘴豆），糙米、藜麥、全麥意麵，低脂牛奶、優格，堅果類（杏仁、核桃等）\n\n中等血糖指數（GI 56–69）：每天至少加入一餐，尤其是白米飯，一拳頭的量就足夠，真的會讓你變聰明！\n白薯和紅薯、玉米、青豆、白米、小米、蒸粗麥和一些早餐穀物（奶油小麥）\n\n高血糖指數（GI ≥ 70）：如果想控制體重，每週可以選擇吃一次，會讓你心情好。如果做需要體力的戶外運動，可以吃，能在短時間內為你增加能量。\n白麵包、米餅、餅乾、蛋糕、甜甜圈、羊角麵包，以及各種精加工早餐穀物。\n\n搭配碳水和蛋白質、脂肪一起吃也可以幫助降低整餐GI值，例如我最愛的大腦能量早餐：全麥吐司+雞蛋+牛油果。\n\n碳水不是不好，而是你需要吃對。低GI食物是穩定的能量補給站，讓你的大腦、情緒和專注力都更有韌性。吃對了，不只不胖，還可能越吃越聰明，越吃越情緒約越穩定！", "cat": "營養飲食", "simple": ["大腦只占體重 2%，卻吃掉每天約 20% 的能量，大腦其實超愛碳水！但要吃對。", "GI 值就是食物讓血糖上升的速度。血糖衝太快又掉太快，人會累、不專心、情緒起伏大。", "低 GI（55 以下）可以常吃：蘋果、奇異果、莓果、蔬菜、豆類、糙米、藜麥、堅果、優格。中 GI 每天一餐，例如一拳頭白飯、地瓜、玉米。高 GI（白麵包、蛋糕、甜甜圈）一週一次就好。", "碳水搭配蛋白質和好油一起吃，能讓血糖更穩，例如：全麥吐司＋雞蛋＋酪梨。"], "mind": {"c": "吃對碳水變聰明", "b": [["大腦需要能量", ["占體重 2%", "耗能 20%", "喜歡穩定供糖"]], ["低 GI ≤55", ["莓果、蘋果、奇異果", "豆類、糙米、藜麥", "堅果、優格"]], ["中 GI 56–69", ["白飯一拳頭", "地瓜、玉米", "每天一餐"]], ["高 GI ≥70", ["白麵包、蛋糕", "甜甜圈", "一週一次"]], ["搭配技巧", ["碳水＋蛋白質＋好油", "全麥吐司＋蛋＋酪梨"]]]}, "frame": {"type": "layers", "title": "碳水紅綠燈", "steps": [["綠燈：低 GI", "天天吃：蔬果、豆類、全穀、堅果"], ["黃燈：中 GI", "每天一餐：白飯、地瓜、玉米"], ["紅燈：高 GI", "一週一次：白麵包、甜點"], ["組合技", "加蛋白質和好油，降低整餐 GI"], ["結果", "血糖穩 → 專注好、情緒穩"]]}, "products": [["084", "黃連素／小蘗鹼（膠囊）", 560, "小蘗鹼可活化細胞的能量感應器 AMPK，幫助細胞利用葡萄糖、維持飯後血糖平穩，對應文中「大腦喜歡穩定供糖」。（服用降血糖藥者請先問醫師）"], ["083", "苦瓜皂甘複方", 540, "苦瓜皂苷是苦瓜中的植物成分，傳統上用於幫助維持血糖穩定。"], ["033", "亞麻仁籽渣（2包一組）", 198, "高纖維加在早餐或飯前，讓醣類吸收變慢、降低整餐 GI，和文中「碳水搭配蛋白質、好油」的道理相同。"]]}, {"id": 27, "title": "醫學生第一次解剖是什麼感受？", "date": "2025/4/6", "tags": ["自然醫學", "醫學生日常", "美國醫學院", "醫學院", "解刨", "讀博", "讀博日常", "美國讀醫", "解刨學"], "body": "都說解剖是醫學生要跨過的第一道坎兒。開學的第二週就開始解刨實踐課了，我的內心還是有點恐懼的，因為從沒接觸過。\n那天我表面很平靜，因為人多而且氣氛活躍，大家一直試圖在說笑，其實是在掩蓋內心的忐忑。這是我第一次這麼近距離的面對死亡，也是第一次這麼真實地直視人體內部的結構與真相。\n我當時心裡告訴自己：「我可以的，我準備好了。」\n但生理的反應還是誠實的。那天晚上我一點食慾都沒有，胃一直在翻騰…\n\n轉眼間第二個學期結束了，我已經習慣了每週在解剖室呆5個多小時的日子。\n\n每學期結束時，我們都會寫一篇 journal，記錄我們對捐贈者的特定系統（如心血管系統，消化系統、呼吸系統等）的觀察和思考。透過組織的結構、顏色、質地，我們往往能推測出捐贈者生前的身體狀態、生活習慣，甚至可能經歷過的疾病。\n\n這已不再只是一個學習的過程，更像是一種深層的聆聽。讓我對生命有了更深的敬重，也更加重視健康。當我親眼看到肺部因為長期吸菸而變黑、肝臟因慢性疾病而變硬、動脈因為高脂飲食而鈣化，我才真正明白，很多我們以為還好的生活習慣，其實身體都默默替我們記著。\n\n健康是生活中一點一滴的選擇與累積。感謝這些捐贈者，他們的奉獻是一種沉默但有力的提醒 — 我們該如何更好地活著！", "cat": "醫學生日常", "simple": ["大體解剖是醫學生的第一道關卡。開學第二週就要上解剖課，作者其實很害怕。", "第一次那天表面很平靜，但晚上完全吃不下飯。後來慢慢習慣，每週在解剖室待 5 個多小時。", "從器官的樣子可以看出捐贈者生前的生活：抽菸的人肺是黑的、慢性病讓肝變硬、吃太油讓血管鈣化。", "作者明白：健康是每天一點一滴的選擇。感謝大體老師，他們用沉默提醒我們該怎麼好好活著。"], "mind": {"c": "第一次大體解剖", "b": [["心情", ["害怕忐忑", "同學說笑掩飾", "晚上吃不下"]], ["適應", ["每週 5 小時以上", "學期寫觀察日誌"]], ["從器官看生活", ["抽菸 → 肺變黑", "慢性病 → 肝變硬", "高脂飲食 → 血管鈣化"]], ["領悟", ["敬重生命", "健康靠日常累積"]], ["感謝", ["大體老師的奉獻"]]]}, "frame": {"type": "flow", "title": "從恐懼到敬重", "steps": [["恐懼", "第一次面對死亡"], ["適應", "每週固定上解剖課"], ["觀察", "從器官推測生活習慣"], ["反思", "身體默默記住每個習慣"], ["行動", "珍惜並好好照顧健康"]]}, "products": [["085", "NAC複方（膠囊）", 530, "對應文中看到的「被菸燻黑的肺、變硬的肝」：NAC 幫助製造穀胱甘肽，支持肺與肝的抗氧化保護。"], ["002", "EPA+DHA複方粉包", 1350, "對應「動脈因高脂飲食鈣化」：EPA/DHA 幫助維持血脂與血管健康。"], ["072", "蝦紅素200mcg＋硒200mcg（錠）", 530, "強力抗氧化，幫助保護血管與細胞免受氧化傷害。"]]}, {"id": 28, "title": "在美國讀醫有多難？", "date": "2025/4/2", "tags": ["自然醫學", "美國讀醫", "整體醫學", "醫學生日常", "女博士", "自然療法", "醫學院日常", "美國醫學生"], "body": "讀醫的第一個學期，用「水深火熱」四個字形容，一點都不誇張。\n還記得入學那天的 orientation，我們這屆有60人，大家輪流介紹自己的背景和從醫的初心，眼裡都閃著光。才一個學期過去，就只剩下 49人了。這條路上，不是誰不夠優秀，而是真的太不容易了。\n\n有人問我：「你覺得讀醫學院是什麼感受？」\n我只想說，原來人類的腦子可以在這麼短的時間內塞進那麼多知識。。。\n\n第一學期修23.5個學分，Quarter制的學期只有10周，讀14門課，課程的緊密程度讓人無法喘息。第一年要讀的基礎課包括生理學、生物化學、組織學、胚胎學、解刨學等。作為自然醫學生，我們還要額外讀自然醫學理論課、醫患關係和病例分析。還有最具挑戰的解刨實踐課和臨床實踐課。\n\n回頭看，這學期真的經歷了太多「第一次」…\n第一次穿上白袍，第一次拿起聽診器，第一次進解刨室…\n第一次連上12小時課後，還要趕在凌晨前考2小時的網試\n第一次聽教授說：「睡前記得看一眼筆記，大腦在你睡覺時會繼續幫你記憶」\n第一次即使自己也在撐著走，還是願意伸出手，去拉一把身邊同樣掙扎的同學。\n簡單說，這段時間除了吃飯和睡覺，都在學習…\n\n幾乎每個人都曾在某個瞬間接近崩潰和自我懷疑。但也正是那些低谷，讓我門學會了找突破口，重新相信自己，然後繼續往前走。\n\n如果你也在讀醫的路上，或者正在走一條看不到盡頭的路，希望你知道：只要不放棄，你就已經很勇敢了！\n\n這大半年一路摸索下來，我也總結出了一些在高強度學習中照顧好身體的方法，之後會陸續分享給大家～", "cat": "醫學生日常", "simple": ["讀醫第一學期，用「水深火熱」形容一點也不誇張。", "開學時 60 人，一學期後只剩 49 人。一學期只有 10 週，卻要讀 14 門課、23.5 學分。", "有好多「第一次」：第一次穿白袍、拿聽診器、進解剖室、上完 12 小時課還要考試。", "每個人都曾想放棄，但也學會互相拉一把。只要不放棄，你就已經很勇敢了！"], "mind": {"c": "在美國讀醫有多難", "b": [["數字", ["60 人 → 49 人", "10 週 14 門課", "23.5 學分"]], ["課程", ["生理、生化、組織", "胚胎、解剖", "自然醫學理論"]], ["很多第一次", ["穿白袍", "拿聽診器", "進解剖室", "12 小時課＋考試"]], ["低谷與成長", ["崩潰與自我懷疑", "找到突破口", "互相扶持"]]]}, "frame": {"type": "flow", "title": "第一學期的心路歷程", "steps": [["興奮", "開學眼裡閃著光"], ["衝擊", "課量爆炸、同學離開"], ["低谷", "崩潰、自我懷疑"], ["突破", "找方法、互相拉一把"], ["勇敢", "不放棄就是勇敢"]]}, "products": [["087", "超級B群（膠囊）", 520, "10 週 14 門課的高強度，B 群幫助能量代謝、支持體力精神。"], ["091", "甘氨酸鎂複方粉包", 1350, "教授說「睡前看一眼筆記，大腦睡覺時幫你記」：鎂幫助放鬆好眠，讓睡眠記憶整理更順利。"], ["047", "刺五加（膠囊）", 495, "適應原草本，幫助在壓力期維持耐力、對抗疲勞。"]]}, {"id": 29, "title": "美國自然醫生 vs 傳統西醫，區別是什麼？", "date": "2025/4/1", "tags": ["自然醫學", "naturalmedicine", "自然療法", "整體醫學", "美國讀博", "美國讀醫", "大健康", "整合醫學", "美國醫療"], "body": "最明顯的區別就是對疾病的治療的順序 - Therapeutic Order\n\n自然醫學治療順序的核心邏輯是：從最低的干預強度開始，先從改善生活方式、支援身體自癒力出發，一步步深入外在干預的程度。如果非要用藥物或手術，那一定是已經在其他方式都嘗試過的情況下。這個療癒順序在疑難雜症和慢性病的調理中起到決定性的效果。而西醫往往傾向於快速見效，但有時候會忽略疾病產生的根源，比如高血壓、糖尿病，一確診就用藥控制症狀。而自然醫學更希望從生活方式下手，找出根源，逐層修復。\n\n簡單總結一下Therapeutic Order的七個層級：\n\nLevel 1\n建立健康的基礎: 改變生活方式、飲食、睡眠、壓力、情緒等，先把阻礙療癒的因素移開。這些是患者自己可以在醫生的專業指導下完成。\n\nLevel 2\n激發身體的自癒力: 用溫和的方法刺激身體本身的療癒能力，如順勢療法、針灸、水療、呼吸等。\n\nLevel 3\n強化衰退或損壞的系統: 當某些器官或功能太弱，只靠刺激不夠，就需要營養補充、草藥、特定療法去「補回來」。\n\nLevel 4\n調整結構完整性：用手法、運動或體態訓練幫助身體恢復結構上的平衡，比如骨盆歪斜、脊椎壓力等。\n\nLevel 5\n針對病理使用自然干預: 這時候會用到比較強力的天然療法，例如高劑量營養素、植物提取物或功能醫學手段，直接針對病灶。\n\nLevel 6\n使用藥物阻止病情發展: 必須時才會介入藥物治療，這個階段屬於「高強度干預」，但在合理運用下仍有其必要性。\n\nLevel 7\n抑制病理或手術: 在嚴重情況，如腫瘤、器官損傷、危急狀態下，使用手術或強效藥物介入。\n\n越少干預的的治療方式，越靠近健康本源。這不是說用藥不好，而是我們希望先給身體一個自己修復的機會，再做更強的介入。自然醫學中的「療癒」是一場迴歸，一種尊重身體、尊重自然的過程。", "cat": "自然醫學入門", "simple": ["自然醫生和西醫最大的不同，是「治療的順序」（Therapeutic Order）。", "自然醫學從最溫和的方法開始：先改生活習慣，再一步步加強。真的需要時才用藥或開刀。", "七個層級：1 打好健康地基（飲食、睡眠、壓力）→ 2 喚醒自癒力（針灸、水療、呼吸）→ 3 補強衰弱的系統（營養、草藥）→ 4 調整結構（手法、運動）→ 5 用自然方法針對病灶 → 6 用藥阻止惡化 → 7 手術或強效藥。", "不是說用藥不好，而是先給身體自己修復的機會。"], "mind": {"c": "自然醫學治療順序", "b": [["核心邏輯", ["從最低干預開始", "找根本原因", "逐層修復"]], ["溫和層 1–2", ["健康地基：飲食睡眠壓力", "喚醒自癒：針灸水療呼吸"]], ["支持層 3–4", ["營養草藥補強", "手法運動調結構"]], ["強化層 5–7", ["高劑量自然療法", "藥物", "手術"]], ["與西醫比較", ["西醫快速控制症狀", "ND 先修根源"]]]}, "frame": {"type": "layers", "title": "Therapeutic Order 七層階梯（由溫和到強力）", "steps": [["1 建立健康基礎", "生活方式、飲食、睡眠、情緒"], ["2 激發自癒力", "順勢、針灸、水療、呼吸"], ["3 強化衰弱系統", "營養補充、草藥"], ["4 調整結構", "手法、運動、體態"], ["5 自然療法針對病理", "高劑量營養素、植物萃取"], ["6 藥物阻止惡化", "必要時用藥"], ["7 手術或強效介入", "危急、嚴重情況"]]}, "products": [["096", "孢子益生菌（加亞麻仁渣）", 650, "第 1 層「建立健康基礎」：照顧腸道與飲食，是自然醫學治療順序的起點。"], ["091", "甘氨酸鎂複方粉包", 1350, "第 1 層：改善睡眠與壓力，先移除阻礙療癒的因素。"], ["087", "超級B群（膠囊）", 520, "第 3 層「強化衰退的系統」：用營養補充把不足的部分補回來。"], ["041", "薑黃素＋胡椒鹼提取物（膠囊）", 620, "第 5 層「自然干預」：較高劑量的植物萃取，針對發炎等問題。"]]}, {"id": 30, "title": "那些千年以前的醫學智慧，如今仍在影響我們", "date": "2025/3/31", "tags": ["自然醫學", "傳統醫學", "大健康", "自然療法", "美國讀醫"], "body": "在西醫出現之前，過去的世界都用什麼方式治病？\n\n在這裡，我希望能客觀的介紹世界古老的自然醫學。自然醫學在人類發展數千年，每種都有它獨特的哲學、療法與靈魂。歷經千年的傳統醫學智慧如今並沒有被西醫取代，而是滲入到人們的思想和生活方式中，潛移默化的影響著人們的健康。\n\n古埃及醫學 Egyptian Medicine\n世界最古老的醫療是從非洲開始的，被認為影響了此後出現的所有醫學體系。強調身、心、靈之間的平衡。實踐了世界最早的外科手術與整骨療法。\n\n古巴比倫醫學 Babylonian Medicine\n透過占卜或儀式來辨別疾病的成因，運用草藥、祈禱的方式療癒，認為疾病可能是神的懲罰。巴比倫醫療建立了最早期的醫療倫理概念\n\n古希臘醫學 Greek Medicine\n強調健康靠「四體液」（血、痰、黑膽、黃膽）的平衡。\nHippocrates（希波克拉底）：現代醫學之父，確立了醫學倫理原則，並提出疾病源於自然原因的概念。\n\n傳統中醫 Traditional Chinese Medicine\n中醫的精髓在於順應自然、調和陰陽，追求身心靈的整體平衡。中醫是至今保留最完整的傳統自然醫學，希望以後在我的臨床實踐中也融入中醫的智慧。\n\n藏傳醫學 Tibetan Medicine\n將佛教哲學與醫學相結合，基礎為Lung（風）、Tripa（膽汁）、Beken（痰）能量的平衡。藏醫特別強調健康的精神層面，病的根源常是心理與情緒。\n\n阿育吠陀 Ayurveda\n印度傳統醫學，疾病都源於風、火、水三種能量的失衡。療法包括草藥、瑜伽、冥想、排毒等療程。其療法強調因人制宜，影響了現代整合醫學中的個體化治療理念。\n\n尤納尼醫學 Unani-Tibb Medicine\n源自希臘，融合中東和印度療癒的智慧。強調體質與生活方式管理，制定早期的飲食與禁食規定，解析氣候條件對健康的影響。\n\n非洲傳統醫學 African Traditional Medicine\n強調人與自然、祖先、社群的連線。以群體療癒、植物療法和精神療法為主。\n\n美洲土著醫學 Native American Medicine\n以儀式、鼓聲和汗蒸治療疾病的方式，結合本土的植物和草藥。至今在中南美地區仍被採用。\n\n這些古老醫學系統，雖然語言和文化不同，但都強調人與自然的平衡關係，我們的身體有自我療癒的能力，而醫生的角色是喚醒、引導並支援這股內在的力量！", "cat": "傳統醫學", "simple": ["在西醫出現以前，世界各地都有自己的傳統醫學。", "古埃及有最早的手術和整骨；古巴比倫建立最早的醫療倫理；古希臘講「四種體液」平衡，希波克拉底是醫學之父。", "中醫講陰陽平衡；藏醫講風、膽、痰三種能量，也重視心理；阿育吠陀講三種能量和個人體質；尤納尼醫學重視飲食和氣候。", "非洲和美洲原住民醫學重視社區、祖先、植物和汗蒸。它們都相信：身體會自我療癒，醫生的角色是喚醒這股力量。"], "mind": {"c": "世界古老醫學", "b": [["古代文明", ["古埃及：最早手術", "古巴比倫：醫療倫理", "古希臘：四體液、希波克拉底"]], ["亞洲", ["中醫：陰陽", "藏醫：風膽痰", "阿育吠陀：三種能量"]], ["中東", ["尤納尼醫學", "飲食與氣候"]], ["原住民", ["非洲：社區祖先", "美洲：儀式、汗蒸"]], ["共同點", ["人與自然平衡", "身體會自癒", "醫生喚醒內在力量"]]]}, "frame": {"type": "layers", "title": "各醫學的「平衡」概念", "steps": [["古希臘", "血、痰、黑膽、黃膽四體液"], ["中醫", "陰陽、五行"], ["藏醫", "風 Lung、膽 Tripa、痰 Beken"], ["阿育吠陀", "Vata、Pitta、Kapha"], ["共同核心", "平衡＝健康，失衡＝生病"]]}, "products": [["041", "薑黃素＋胡椒鹼提取物（膠囊）", 620, "阿育吠陀數千年的經典香料，薑黃素幫助調節發炎，胡椒鹼幫助吸收。"], ["090", "人參皂苷複方（膠囊）", 560, "傳統中醫的補氣代表藥材，幫助維持精神與體力。"], ["048", "大蒜素（膠囊）", 450, "大蒜在古埃及、古希臘等許多古老醫學中都被使用；大蒜素幫助維持防護力與心血管健康。"], ["070", "辣木粉", 450, "印度與非洲傳統醫學常用的營養植物，富含礦物質與抗氧化物。"]]}, {"id": 31, "title": "美國的自然醫生都能做些什麼？職業方向解析！", "date": "2025/3/30", "tags": ["自然醫學", "自然療法", "自然醫學博士", "美國醫療", "美國讀醫", "健康生活", "自然與健康", "整體醫學", "記錄讀博", "讀博日常"], "body": "在美國，ND(Naturopathic Doctor)是接受正規醫學訓練、擁有執照(NPLEX)的醫生。ND的職業發展也非常多元，涵蓋了醫療、教育、研究、健康產業等多個領域。以下介紹幾個比較普遍的從業方向：\n\n全科醫生或家庭醫生 Primary Care\n很多的ND會成為全科醫生或家庭醫生，獨立開辦診所，或加入已有的診所做合夥人。越來越多人將年度健康檢查從普通的診所換成ND的診所。\n\n科研\n參與自然醫學的臨床研究、功能醫學課題，自然醫藥研發等，或為醫藥企業或醫療政策機構提供自然醫學方面的專業建議。\n\n健康產業顧問與品牌創業者\n我認識的很多ND，在從事臨床的同時，也會自己創辦自然藥品的品牌，也有一些為企業做健康顧問。\n\n公共健康\n有些ND投身社群醫療，為弱勢社群服務、非營利組織或政府健康專案服務\n\n自然醫藥政策推動及倡導\n很多ND在臨床一段時間後，也會進行寫作，對自己專業的領域進行更深入的研究和經驗分享，之後在世界各地進行演講，讓更多人認識並受益於自然醫學的智慧。\n\n高校教師\n很多ND畢業後會留校擔任教授和臨床導師，或在自然醫學/傳統醫學機構任教，培養下一代自然醫學療癒者。\n⸻\n\n很多ND兼備多重身份，雖然美國很多洲對ND的瞭解和接受程度有限，甚至稱之為「另類醫生」，但ND依然在美國主流健康領域高速的發展，而且被更多的人認可。只有你真正見過ND，才知道我們與MD的不同！\n\nND在美國經歷很漫長的專業性演變，也彌補了現在西方醫療中很多的不足，尤其是針對慢性病。這個行業發展到今天離不開很多前輩在過去上百年的努力，從不放棄，正如Dr. Bastyr所說，The truth of our medicine will always win out, the truth of what we are doing will always survive.\n\n如果你對ND職業感興趣，或正在考慮未來在健康產業的發展路徑，歡迎留言或私信交流哦～", "cat": "ND 職涯", "simple": ["在美國，ND 是受過正規醫學訓練、有執照的醫生，可以走的路很多元。", "1 家庭醫生：自己開診所或當合夥人；2 科研：做自然醫學研究、研發；3 健康產業顧問或創立自然產品品牌。", "4 公共衛生：服務社區和弱勢族群；5 政策倡議：寫作、演講推廣；6 大學教師：培養下一代。", "很多 ND 同時有好幾個身份。Dr. Bastyr 說：自然醫學的真理終將勝出。"], "mind": {"c": "ND 職業方向", "b": [["臨床", ["家庭醫生", "開診所", "合夥人"]], ["研究", ["臨床研究", "功能醫學", "藥品研發"]], ["產業", ["健康顧問", "自創品牌"]], ["社會", ["公共衛生", "社區醫療", "政策倡議"]], ["教育", ["大學教授", "臨床導師", "寫作演講"]]]}, "frame": {"type": "flow", "title": "ND 的多元發展路徑", "steps": [["取得執照", "通過 NPLEX"], ["臨床起步", "家庭醫生累積經驗"], ["延伸專長", "研究、產業、教學"], ["多重身份", "醫生＋創業＋倡議"], ["影響力", "推廣自然醫學"]]}, "products": [["087", "超級B群（膠囊）", 520, "多重身份的忙碌生活中，幫助能量代謝、維持精神。"], ["096", "孢子益生菌（加亞麻仁渣）", 650, "幫助維持消化與免疫平衡。"]]}, {"id": 32, "title": "在美國學自然醫學，是一種怎樣的體驗？", "date": "2025/4/30", "tags": ["自然醫學", "自然療法", "自然醫學博士", "美國讀博", "美國讀醫", "健康生活", "自然與健康", "整體醫學", "記錄讀博", "讀博日常", "學生"], "body": "大家好，我是Yilin，正在美國攻讀自然醫學博士。一年前，我從私募基金行業轉行到自然醫學的世界，這對我來說不僅是職業的改變，更是一段重新認識「健康」與自我療癒的旅程。\n\n開始讀自然醫學（Naturopathic Doctor, 簡稱ND）以來，越來越多朋友問我，這和他們熟悉的西醫（MD）有什麼不同？\n簡單來說，ND和傳統醫學最大的不同在於 —— 我們更關注「人」，而不僅僅是「病」。\n自然醫學把人體是為一個整體，相信人體本身存在的生命力，並有一定程度自癒能力。在傳統西醫體系裡，醫生的角色是找出疾病、對症治療；但ND的思維是：「你的身體為什麼會失衡？為什麼會生病？」 比如你經常頭痛，ND不會只給你止痛藥，而是會深入瞭解你的飲食、睡眠、壓力、荷爾蒙狀態，甚至你呼吸的方式，找出問題的根源，並且激發身體的自癒能力。\n\nND的未來在美國其實很有前景：\n隨著越來越多的人開始重視整體健康、預防為主的理念，自然醫療醫生（ND）這個職業在美國的發展也越來越受到關注。除了已經有26個州建立了完善的ND執照和管理制度，還有22個州正在積極推動相關立法，希望未來也能設立自己的執照系統，規範並支援更多專業的自然醫療從業者。\n在加州、西雅圖、亞利桑那這些地方，ND的合法執業範圍相當廣泛，很多家庭都有自己的「ND家庭醫生」，幫助處理慢性病管理、女性荷爾蒙調理、兒童健康、營養指導、壓力管理等等。\n不過也要提醒一下，很多自稱\"自然醫生\"(natural doctor)的人，其實並沒有真正的ND執照。在選擇醫生時一定要注意分辨，真正的ND是經過正規四年制自然醫學博士課程訓練並持有執照的醫生，地位上與MD是等同的。而其他沒有ND頭銜卻自稱自然醫生的人，大家在選擇時就要格外小心了。\n在四年的課程中，我們要學習傳統醫生需要學的全部基礎課程，同時我們也要學各種有效的自然療法，並且要學習如何和病人進行深入的溝通和觀察他們的生活習慣，協助病人尋找病因。 真正接受過ND治療的人，普遍認為，ND是美國最有溫度的醫生！\n\n總的來說，ND在美國的未來非常有前景，我們也希望越來越多人可以瞭解這個專業！\n\n我會在這裡記錄我的讀醫之路，也會分享一點真實的學習感受和對健康管理的理念，希望能為你們開啟另一個看待健康的視角！", "cat": "自然醫學入門", "simple": ["作者 Yilin 原本在私募基金工作，一年前轉行讀自然醫學博士。", "ND 和西醫最大的不同：ND 更關心「人」，不只是「病」。例如你常頭痛，ND 不只給止痛藥，還會問你吃什麼、睡得好不好、壓力、荷爾蒙，找出真正的原因。", "美國有 26 個州有 ND 執照制度，還有 22 個州在推動。在加州、西雅圖、亞利桑那，很多家庭有自己的 ND 家庭醫生。", "真正的 ND 讀過 4 年博士並有執照，和 MD 地位相同；要小心自稱「自然醫生」卻沒有執照的人。"], "mind": {"c": "在美國學自然醫學", "b": [["作者背景", ["私募基金轉行", "攻讀 ND 博士"]], ["ND 核心", ["關注人不只病", "相信自癒力", "找根本原因"]], ["頭痛例子", ["不只止痛藥", "看飲食睡眠", "看壓力荷爾蒙"]], ["發展前景", ["26 州有執照", "22 州推動中", "ND 家庭醫生"]], ["分辨真假", ["4 年博士＋執照", "與 MD 同等"]]]}, "frame": {"type": "flow", "title": "ND 看診的思考方式", "steps": [["症狀", "例如經常頭痛"], ["提問", "你的身體為什麼失衡？"], ["深入了解", "飲食、睡眠、壓力、荷爾蒙、呼吸"], ["找根源", "找出真正原因"], ["激發自癒", "從根本改善"]]}, "products": [["091", "甘氨酸鎂複方粉包", 1350, "對應文中「經常頭痛」的例子：鎂不足常和緊繃、頭痛、睡不好有關，補鎂幫助肌肉與神經放鬆。"], ["053", "神經營養素（B1＋B3＋B6）", 540, "B1、B3、B6 是神經與能量代謝的重要維生素，幫助維持神經系統健康。"], ["060", "Q10（10:1）（膠囊）", 580, "支持粒線體能量製造；ND 找頭痛根源時，也常把能量代謝列入考量。"]]}];
const COLORS = ['--c1','--c2','--c3','--c4','--c5','--c6'];
let cat = '全部', q = '', cur = NOTES[0] && NOTES[0].id;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl = s => {
  const e = esc(s);
  if (!q) return e;
  const k = esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return e.replace(new RegExp(k, 'gi'), m => '<mark>' + m + '</mark>');
};
const textOf = n => [n.title, n.body, n.cat, n.tags.join(' '), n.simple.join(' '),
  JSON.stringify(n.mind), JSON.stringify(n.frame), n.products.map(p => p.join(' ')).join(' ')].join(' ').toLowerCase();
NOTES.forEach(n => n._t = textOf(n));

function chips(){
  const cats = ['全部', ...new Set(NOTES.map(n => n.cat))];
  $('#chips').innerHTML = cats.map(c => `<button class="chip${c===cat?' on':''}" data-c="${c}">${c}</button>`).join('');
}
function filtered(){
  const k = q.toLowerCase();
  return NOTES.filter(n => (cat==='全部' || n.cat===cat) && (!k || n._t.includes(k)));
}
function list(){
  const f = filtered();
  if (f.length && !f.some(n => n.id===cur)) cur = f[0].id;
  $('#list').innerHTML = `<div class="count">共 ${f.length} / ${NOTES.length} 篇</div>` +
    (f.map(n => `<div class="item${n.id===cur?' on':''}" data-id="${n.id}"><b>${n.id}. ${hl(n.title)}</b><small>${n.cat} · ${n.date}</small></div>`).join('') || '<div class="empty">找不到符合的筆記</div>');
  view(f.length ? NOTES.find(n => n.id===cur) : null);
}
function mind(m){
  return `<div class="mm"><div class="mm-c">${hl(m.c)}</div><div class="mm-bs">` +
    m.b.map((b,i) => `<div class="mm-b" style="--bc:var(${COLORS[i%6]})"><span class="mm-bl">${hl(b[0])}</span><div class="mm-k">${b[1].map(k=>`<span>${hl(k)}</span>`).join('')}</div></div>`).join('') +
    `</div></div>`;
}
function frame(f){
  const t = `<div class="ftitle">${hl(f.title)}</div>`;
  if (f.type === 'layers'){
    const n = f.steps.length;
    return t + `<div class="layers">` + f.steps.map((s,i) =>
      `<div class="layer" style="width:${Math.round(100 - (n-1-i)*(40/Math.max(n-1,1)))}%;background:var(${COLORS[i%6]})"><b>${hl(s[0])}</b><span>${hl(s[1])}</span></div>`).join('') + `</div>`;
  }
  return t + `<div class="flow">` + f.steps.map((s,i) =>
    `<div class="fs"><div class="fbox" style="--fc:var(${COLORS[i%6]})"><b>${i+1}. ${hl(s[0])}</b><span>${hl(s[1])}</span></div>${i<f.steps.length-1?'<span class="arrow">➜</span>':''}</div>`).join('') + `</div>`;
}
function view(n){
  if (!n){ $('#view').innerHTML = '<div class="empty">沒有可顯示的筆記</div>'; return; }
  $('#view').innerHTML = `
    <div class="meta"><span class="cat">${n.cat}</span><span>第 ${n.id} 篇</span><span>${n.date}</span></div>
    <h2>${hl(n.title)}</h2>
    <div class="nav"><a href="#s1">白話解析</a><a href="#s2">心智圖</a><a href="#s3">框架圖</a><a href="#s4">團購產品</a><a href="#s5">原文</a></div>
    <section id="s1" class="simple"><h3>🧒 國小白話解析</h3>${n.simple.map(p=>`<p>${hl(p)}</p>`).join('')}</section>
    <section id="s2"><h3>🧠 心智圖</h3>${tools('mind')}${mind(n.mind)}</section>
    <section id="s3"><h3>🧩 框架圖</h3>${tools('frame')}${frame(n.frame)}</section>
    <section id="s4"><h3>🛒 對應團購產品與正面機制</h3>
      <div class="prods">${n.products.map(p=>`<div class="prod"><div class="pid">#${p[0]}<span>NT$${p[2].toLocaleString()}</span></div><b>${hl(p[1])}</b><div class="lab">正面機制</div><p>${hl(p[3])}</p></div>`).join('')}</div>
      <div class="note">※ 屬日常營養補充與生活用品，只提供資訊整理，不取代專業評估；孕哺期、兒童、慢性病、服藥或手術前後，請先詢問合格專業人員。下單前請再核對實際包裝、成分、數量、庫存與價格。</div>
    </section>
    <section id="s5"><details${q && n.body.toLowerCase().includes(q.toLowerCase())?' open':''}><summary>📄 筆記原文（繁體）</summary>
      <div class="orig">${hl(n.body)}</div>
      <div class="tags">${n.tags.map(t=>`<span>#${hl(t)}</span>`).join('')}</div></details></section>`;
}
/* ---------- 複製到 LINE ---------- */
const DOTS = ['🟢','🟠','🔵','🟣','🟡','🩵'];
const NUMS = ['1️⃣','2️⃣','3️⃣','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣','9️⃣'];
const IMG = {bg:'#ffffff', ink:'#24302b', muted:'#6b756f', line:'#d9d3c7', accent:'#2f7a5b',
  cs:['#2f7a5b','#c26a2e','#3d6fb0','#9a4d8f','#b0882a','#4f8c8c']};
const FONT = '"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif';
const curNote = () => NOTES.find(n => n.id === cur);

function tools(kind){
  return `<div class="ctools"><button class="line" data-act="text" data-k="${kind}">📋 複製文字（貼 LINE）</button>` +
    `<button data-act="img" data-k="${kind}">🖼️ 複製圖片</button><button data-act="dl" data-k="${kind}">⬇️ 下載圖片</button></div>`;
}
function mindText(n){
  const m = n.mind;
  return `🧠 心智圖｜${m.c}\n（${n.title}）\n\n` +
    m.b.map((b,i) => `${DOTS[i%6]} ${b[0]}\n` + b[1].map(k => `　・${k}`).join('\n')).join('\n\n');
}
function frameText(n){
  const f = n.frame, s = f.steps;
  const body = s.map((x,i) => `${NUMS[i] || (i+1)+'.'} ${x[0].replace(/^\d+\s*/, '')}\n　${x[1]}`).join(f.type === 'layers' ? '\n\n' : '\n　⬇️\n');
  return `🧩 框架圖｜${f.title}\n（${n.title}）\n\n${body}`;
}
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }
async function copyText(s){
  try { await navigator.clipboard.writeText(s); return true; }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = s; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(_){}
    ta.remove(); return ok;
  }
}
function wrap(ctx, text, maxW){
  const lines = []; let line = '';
  for (const ch of String(text)){
    if (ctx.measureText(line + ch).width > maxW && line){ lines.push(line); line = ch; } else line += ch;
  }
  if (line) lines.push(line);
  return lines;
}
function rrect(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
// 畫圖用兩階段：draw=false 先量高度，draw=true 再真正畫
function paintMind(ctx, n, W, draw){
  const m = n.mind, P = 32; let y = P;
  ctx.font = `bold 34px ${FONT}`;
  const cl = wrap(ctx, m.c, W - P*2 - 40);
  const ch = cl.length * 46 + 28;
  if (draw){ ctx.fillStyle = IMG.accent; rrect(ctx, P, y, W - P*2, ch, 18); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textBaseline = 'top'; cl.forEach((l,i) => ctx.fillText(l, P + 20, y + 16 + i*46)); }
  y += ch;
  const trunkX = P + 24, trunkTop = y; let lastMid = y;
  m.b.forEach((b,i) => {
    y += 22;
    const c = IMG.cs[i%6], bx = trunkX + 30;
    ctx.font = `bold 26px ${FONT}`;
    const bw = Math.min(ctx.measureText(b[0]).width + 32, W - bx - P), bh = 44;
    if (draw){
      ctx.strokeStyle = IMG.line; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(trunkX, y + bh/2); ctx.lineTo(bx, y + bh/2); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.strokeStyle = c; ctx.lineWidth = 3; rrect(ctx, bx, y, bw, bh, 12); ctx.fill(); ctx.stroke();
      ctx.fillStyle = c; ctx.fillText(b[0], bx + 16, y + 8);
    }
    lastMid = y + bh/2; y += bh + 10;
    ctx.font = `22px ${FONT}`;
    let cx = bx + 12; const chH = 36;
    b[1].forEach(k => {
      const kw = Math.min(ctx.measureText(k).width + 26, W - bx - P - 12);
      if (cx + kw > W - P){ cx = bx + 12; y += chH + 8; }
      if (draw){ ctx.fillStyle = c + '22'; ctx.strokeStyle = c + '66'; ctx.lineWidth = 1.5; rrect(ctx, cx, y, kw, chH, 18); ctx.fill(); ctx.stroke();
        ctx.fillStyle = IMG.ink; ctx.fillText(k, cx + 13, y + 6); }
      cx += kw + 8;
    });
    y += chH;
  });
  if (draw){ ctx.strokeStyle = IMG.line; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(trunkX, trunkTop); ctx.lineTo(trunkX, lastMid); ctx.stroke(); }
  return y + 20;
}
function paintFrame(ctx, n, W, draw){
  const f = n.frame, P = 32, steps = f.steps, N = steps.length; let y = P;
  ctx.font = `bold 30px ${FONT}`; ctx.textBaseline = 'top';
  const tl = wrap(ctx, '🧩 ' + f.title, W - P*2);
  if (draw){ ctx.fillStyle = IMG.ink; tl.forEach((l,i) => ctx.fillText(l, P, y + i*42)); }
  y += tl.length * 42 + 16;
  steps.forEach((s,i) => {
    const c = IMG.cs[i%6];
    const full = W - P*2, w = f.type === 'layers' ? full - (N-1-i) * (full*0.3/Math.max(N-1,1)) : full, x = (W - w)/2;
    ctx.font = `bold 26px ${FONT}`; const t = wrap(ctx, (f.type==='layers' ? '' : (i+1) + '. ') + s[0], w - 40);
    ctx.font = `22px ${FONT}`; const d = wrap(ctx, s[1], w - 40);
    const h = 20 + t.length*36 + d.length*32 + 16;
    if (draw){
      if (f.type === 'layers'){ ctx.fillStyle = c; rrect(ctx, x, y, w, h, 14); ctx.fill(); }
      else { ctx.fillStyle = '#fff'; ctx.strokeStyle = IMG.line; ctx.lineWidth = 2; rrect(ctx, x, y, w, h, 14); ctx.fill(); ctx.stroke();
        ctx.fillStyle = c; rrect(ctx, x, y, 10, h, [14,0,0,14]); ctx.fill(); }
      const tc = f.type === 'layers' ? '#fff' : c, dc = f.type === 'layers' ? '#ffffffee' : IMG.muted;
      ctx.font = `bold 26px ${FONT}`; ctx.fillStyle = tc; t.forEach((l,j) => ctx.fillText(l, x + 24, y + 18 + j*36));
      ctx.font = `22px ${FONT}`; ctx.fillStyle = dc; d.forEach((l,j) => ctx.fillText(l, x + 24, y + 20 + t.length*36 + j*32));
    }
    y += h;
    if (i < N-1){
      if (f.type === 'layers') y += 8;
      else { if (draw){ ctx.fillStyle = IMG.muted; ctx.beginPath(); ctx.moveTo(W/2 - 12, y + 8); ctx.lineTo(W/2 + 12, y + 8); ctx.lineTo(W/2, y + 24); ctx.fill(); } y += 32; }
    }
  });
  return y + 20;
}
function makeCanvas(kind){
  const n = curNote(), W = 900, S = 2;
  const paint = kind === 'mind' ? paintMind : paintFrame;
  const probe = document.createElement('canvas').getContext('2d');
  let H = paint(probe, n, W, false) + 40;
  const cv = document.createElement('canvas'); cv.width = W*S; cv.height = H*S;
  const ctx = cv.getContext('2d'); ctx.scale(S, S);
  ctx.fillStyle = IMG.bg; ctx.fillRect(0, 0, W, H);
  paint(ctx, n, W, true);
  ctx.font = `18px ${FONT}`; ctx.fillStyle = IMG.muted; ctx.textBaseline = 'top';
  ctx.fillText(`${n.id}. ${n.title}`.slice(0, 44), 32, H - 44);
  return cv;
}
const toBlob = cv => new Promise(r => cv.toBlob(r, 'image/png'));
function download(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
$('#view').addEventListener('click', async e => {
  const b = e.target.closest('.ctools button'); if (!b) return;
  const n = curNote(), kind = b.dataset.k, label = kind === 'mind' ? '心智圖' : '框架圖';
  if (b.dataset.act === 'text'){
    const ok = await copyText(kind === 'mind' ? mindText(n) : frameText(n));
    toast(ok ? `已複製${label}文字，到 LINE 貼上即可` : '複製失敗，請改用下載圖片');
    return;
  }
  const blob = await toBlob(makeCanvas(kind)), name = `第${n.id}篇_${label}.png`;
  if (b.dataset.act === 'img'){
    try { await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]); toast(`已複製${label}圖片，到 LINE 電腦版按 Ctrl+V 貼上`); }
    catch(err){ download(blob, name); toast('瀏覽器不支援複製圖片，已改為下載'); }
  } else { download(blob, name); toast(`已下載 ${name}`); }
});
$('#chips').onclick =e => { const c = e.target.dataset.c; if (c){ cat = c; chips(); list(); } };
$('#list').onclick = e => { const it = e.target.closest('.item'); if (it){ cur = +it.dataset.id; list(); $('#view').scrollIntoView({behavior:'smooth',block:'start'}); } };
$('#q').oninput = e => { q = e.target.value.trim(); list(); };
$('#theme').onclick = () => {
  const r = document.documentElement, dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const now = r.dataset.theme || (dark ? 'dark' : 'light');
  r.dataset.theme = now === 'dark' ? 'light' : 'dark';
};
chips(); list();
</script>
</body>
