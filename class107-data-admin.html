    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .container { max-width: 1400px; margin: 0 auto; }
        .page { display: none; }
        .page.active { display: block; }
        
        .home-page { background: white; border-radius: 15px; padding: 40px; text-align: center; }
        .home-page h1 { color: #d32f2f; margin-bottom: 10px; font-size: 36px; }
        .home-page p { color: #999; margin-bottom: 30px; font-size: 16px; font-weight: bold; }
        .warning-box { background: #ffebee; border-left: 4px solid #d32f2f; padding: 15px; margin-bottom: 30px; border-radius: 8px; color: #c62828; font-weight: bold; }
        
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin: 40px 0; }
        .stat-card { background: linear-gradient(135deg, #d32f2f 0%, #f57c00 100%); color: white; padding: 25px; border-radius: 12px; }
        .stat-card .number { font-size: 36px; font-weight: bold; }
        .stat-card .label { font-size: 14px; margin-top: 8px; opacity: 0.9; }
        
        .menu-btn { padding: 15px 30px; background: #d32f2f; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; margin: 10px; }
        .menu-btn:hover { background: #f57c00; }
        
        .query-page { background: white; border-radius: 15px; padding: 30px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid #d32f2f; flex-wrap: wrap; gap: 15px; }
        .header h2 { color: #d32f2f; flex: 1; }
        .back-btn { padding: 10px 20px; background: #ddd; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        .search-box { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .search-box input { padding: 10px 15px; border: 2px solid #ddd; border-radius: 5px; font-size: 14px; flex: 1; min-width: 200px; }
        .search-box button { padding: 10px 20px; background: #d32f2f; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        .table-wrapper { overflow-x: auto; margin: 20px 0; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th { background: #d32f2f; color: white; padding: 10px; text-align: left; font-weight: bold; white-space: nowrap; }
        td { padding: 8px; border: 1px solid #e0e6ed; }
        tr:nth-child(even) { background: #f9f9f9; }
        tr:hover { background: #ffe0b2; }
        
        .export-btn { padding: 10px 20px; background: #3c3; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .copy-toast { position: fixed; bottom: 20px; right: 20px; background: #3c3; color: white; padding: 15px 25px; border-radius: 8px; display: none; z-index: 1000; }
        .copy-toast.show { display: block; animation: slideIn 0.3s; }
        @keyframes slideIn { from { transform: translateX(400px); } to { transform: translateX(0); } }
        
        .version-badge { display: inline-block; background: #d32f2f; color: white; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-left: 10px; }
