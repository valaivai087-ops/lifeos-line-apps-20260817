<style>
:root{--bg:#f6efe3;--card:#fffaf2;--ink:#3b2f25;--mute:#8d7c6a;--line:#eadcc6;--acc:#c8693a}
@media (prefers-color-scheme:dark){:root{--bg:#1c1814;--card:#26211c;--ink:#f1e7d9;--mute:#b1a08c;--line:#3c342b;--acc:#f0a868}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 "Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}

main{max-width:1100px;margin:0 auto;padding:16px}

.cv canvas{width:100%;height:auto;border-radius:8px;display:block}
.cv button{margin-top:8px;font-size:14px;padding:6px 12px}
.post{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:20px;white-space:pre-wrap;font-size:16px;line-height:1.95}
h2{font-size:18px;margin:24px 0 8px}
.hidden{display:none}
.mute{color:var(--mute);font-size:14px}

<header><div class="wrap">
<h1>📘 臉書圖文｜你那麼努力愛每一個人，為什麼最累的，總是你自己？</h1>
<div class="bar"><input id="q" type="search" placeholder="搜尋圖卡文字…"><button id="all">⬇ 下載全部圖卡</button><button class="g" id="copy">📋 複製貼文文字</button></div>

<div class="mute">圖卡尺寸 1080×1350（臉書直式 4:5）。點「下載」存成 PNG，依編號順序上傳。</div>

<script>
const POST=`你那麼努力愛每一個人，為什麼最累的，總是你自己？

晚上十點，辦公室的燈只剩一盞。
同事臨走前把資料推過來：「妳比較厲害，幫我看一下。」
她笑著說好。
笑容很穩，心卻在往下沉。

回到家，鞋還沒脫，孩子就喊：「媽，我明天的東西還沒準備！」
她放下包包，彎腰翻找。
在公司，她是最可靠的人；在家裡，她是最不能倒的人。
可是，誰來問一句——她自己，還好嗎？

睡前，朋友傳來訊息：「明天能陪我一下嗎？」
她打了一個「好」，大拇指停在送出鍵上，停了很久。
那一刻，她想答應，也想拒絕；想被需要，也想被放過。

我們總以為，累，是因為事情太多。
可是，事情真的是自己長腳走過來的嗎？
如果每一次都說「好」，世界怎麼學會對你說「沒關係」？
如果你從不把自己放進計畫裡，又怎能怪別人把你忘了？

也許，困住我們的從來不是事情，
而是我們看事情的方式。

一、你怎麼說自己，就會怎麼活成自己
「我不做，就沒人做。」這句話聽起來像責任，住久了，卻像一座牢。
「全部都靠我」，是一座山；
「這星期有三個人請我幫忙」，只是三塊石頭。
山，只能被壓著；石頭，可以一塊一塊搬開。
語言一模糊，人生就沉重；語言一清楚，路就出現。

二、責任若沒有邊界，愛就會變成消耗
你是媽媽，不是孩子人生的代筆人；
你是同事，不是所有工作的備胎；
你是朋友，不是每一場風雨的屋簷。
替他收好書包，是一時的愛；讓他學會自己收，是一輩子的愛。
真正的愛，不是什麼都替他做，而是相信他也做得到。

三、你越快答應，世界就越快習慣
不是別人故意依賴你，是你一次又一次的「好」，替他們鋪好了路。
答應得越多，請求就越多；請求越多，你就越停不下來。
這不是你不夠努力，而是你的努力，正在餵養那個讓你疲憊的圈。
有些問題越用力越嚴重——不是力氣不夠，是方向錯了。

四、習慣不是命運，只是走熟了的路
工作時這樣，在家這樣，跟朋友也這樣。
你說：「我天生就是勞碌命。」
可是，真的是天生嗎？
還是那條路你走得太熟，熟到忘了旁邊還有別的路？
看見老路的那一刻，就是新路開始的那一刻。

五、自由，不是改變一切，而是改變一件事
你不必一夜之間學會拒絕所有人。
你只需要有一次，說出不一樣的話：
「我願意幫忙，但我們先討論哪一件先做，好嗎？」
我們最害怕的拒絕，很多時候，從來沒有發生；
我們以為會斷的關係，很多時候，只是輕輕轉了個彎。

今天的小練習
下一次有人需要你，先不說好，也不說不好。
只說一句：「我先看看時間，等等回你。」
這短短幾分鐘，不是冷漠，
是你走回自己身邊的路。

後來，朋友又傳來訊息。
她的大拇指停在送出鍵上——這一次，她刪掉了「好」。
她慢慢打下：「我先看看明天的時間，晚點回你喔。」
朋友回：「好啊，不急。」

原來，天沒有塌。
原來，關係沒有斷。
原來，她不必扛起所有人，才值得被愛。

願你在照顧全世界之前，
先照顧那個，
一直在等你回頭的自己。

#人生覺醒 #討好 #界線 #自我照顧 #LifeOS`;

const CARDS=[
{th:"warm",label:"人生覺醒",items:[["h","你那麼努力\n愛每一個人，\n為什麼最累的，\n總是你自己？",1.25],["q","人不是被事情困住，\n而是被看事情的方式困住。"]]},
{label:"情境｜晚上十點",items:[["p","辦公室的燈只剩一盞。\n同事把資料推過來：\n「妳比較厲害，幫我看一下。」\n她笑著說好——\n笑容很穩，心卻往下沉。"],["h","在公司，她是最可靠的人；\n在家裡，她是最不能倒的人。"],["q","可是誰來問一句：\n她自己，還好嗎？"]]},
{label:"情境｜送出鍵",items:[["p","睡前，朋友傳來：\n「明天能陪我一下嗎？」\n她打了一個「好」，\n大拇指停在送出鍵上，\n停了很久。"],["h","她想答應，也想拒絕；\n想被需要，也想被放過。"]]},
{th:"dark",label:"反問",items:[["h","事情，真的是\n自己長腳走過來的嗎？"],["p","如果每一次都說「好」，\n世界怎麼學會對你說「沒關係」？\n如果你從不把自己放進計畫，\n又怎能怪別人把你忘了？"],["q","也許困住我們的，從來不是事情，\n而是看事情的方式。"]]},
{label:"命題一",items:[["h","你怎麼說自己，\n就會怎麼活成自己。"],["p","「全部都靠我」，是一座山；\n「這星期有三個人請我幫忙」，\n只是三塊石頭。\n山，只能被壓著；\n石頭，可以一塊一塊搬開。"],["q","語言一模糊，人生就沉重；\n語言一清楚，路就出現。"]]},
{label:"命題二",items:[["h","責任若沒有邊界，\n愛就會變成消耗。"],["p","你是媽媽，不是孩子人生的代筆人；\n你是同事，不是所有工作的備胎；\n你是朋友，不是每場風雨的屋簷。"],["q","替他收好書包，是一時的愛；\n讓他學會自己收，是一輩子的愛。"]]},
{label:"命題三",items:[["h","你越快答應，\n世界就越快習慣。"],["p","答應得越多，請求就越多；\n請求越多，你就越停不下來。\n不是你不夠努力，\n是你的努力，正在餵養\n那個讓你疲憊的圈。"],["q","有些問題越用力越嚴重——\n不是力氣不夠，是方向錯了。"]]},
{label:"命題四",items:[["h","習慣不是命運，\n只是走熟了的路。"],["p","工作時這樣，在家這樣，\n跟朋友也這樣。\n你說：「我天生勞碌命。」\n真的是天生嗎？\n還是路走得太熟，\n熟到忘了旁邊還有別的路？"],["q","看見老路的那一刻，\n就是新路開始的那一刻。"]]},
{label:"命題五",items:[["h","自由，不是改變一切，\n而是改變一件事。"],["p","不必一夜學會拒絕所有人，\n只要有一次，說出不一樣的話：\n「我願意幫忙，\n但我們先討論哪件先做，好嗎？」"],["q","我們最害怕的拒絕，\n很多時候，從來沒有發生。"]]},
{th:"warm",label:"今天的小練習",items:[["p","下一次有人需要你，\n先不說好，也不說不好。\n只說一句："],["h","「我先看看時間，\n等等回你。」",1.15],["q","這短短幾分鐘，不是冷漠，\n是你走回自己身邊的路。"]]},
{th:"dark",label:"後來",items:[["p","這一次，她刪掉了「好」，\n打下：「我先看看時間，晚點回你。」\n朋友回：「好啊，不急。」"],["h","原來天沒有塌。\n原來關係沒有斷。\n原來她不必扛起所有人，\n才值得被愛。"],["q","願你在照顧全世界之前，\n先照顧那個\n一直在等你回頭的自己。"]]}
];

const W=1080,H=1350,PADX=120;
const SERIF='"Noto Serif TC","Source Han Serif TC","PMingLiU","MingLiU",serif';
const SANS='"Microsoft JhengHei","Noto Sans TC",sans-serif';
const THEMES={
 light:{bg1:"#fbf4e8",bg2:"#f3e6d0",ink:"#3b2f25",soft:"#6e5d4c",acc:"#c8693a",line:"#e3cfb0"},
 warm:{bg1:"#f7dcc0",bg2:"#efc39a",ink:"#3a261a",soft:"#5e4331",acc:"#a94a1f",line:"#e0a877"},
 dark:{bg1:"#2f2a26",bg2:"#1f1b18",ink:"#f6ecdf",soft:"#d6c6b2",acc:"#f0a868",line:"#4a4038"}
};
const NOBREAK="，。、；：？！」』）…—";
function wrap(ctx,text,maxW){const out=[];for(const para of text.split("\n")){let line="";for(const ch of para){const t=line+ch;if(ctx.measureText(t).width>maxW&&line&&!NOBREAK.includes(ch)){out.push(line);line=ch}else line=t}out.push(line)}return out}
function layout(ctx,card,s){
 const blocks=[];let h=0;
 card.items.forEach(([type,text,mul],i)=>{
  let size,font,lh,indent=0;
  if(type==="h"){size=64*s*(mul||1);font=`700 ${size}px ${SERIF}`;lh=1.5}
  else if(type==="q"){size=42*s;font=`600 ${size}px ${SERIF}`;lh=1.6;indent=36}
  else{size=42*s;font=`400 ${size}px ${SERIF}`;lh=1.65}
  ctx.font=font;const ls=wrap(ctx,text,W-PADX*2-indent);
  const bh=ls.length*size*lh;const gap=i?70*s:0;
  blocks.push({type,font,size,lh,ls,indent,y:h+gap,bh});h+=gap+bh;
 });
 return {blocks,h};
}
function draw(cv,card,idx){
 const ctx=cv.getContext("2d");const T=THEMES[card.th||"light"];
 const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,T.bg1);g.addColorStop(1,T.bg2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.strokeStyle=T.line;ctx.lineWidth=3;ctx.strokeRect(48,48,W-96,H-96);
 // 標籤
 ctx.font=`700 32px ${SANS}`;const lw=ctx.measureText(card.label).width+48;
 ctx.fillStyle=T.acc;roundRect(ctx,PADX,110,lw,58,29);ctx.fill();
 ctx.fillStyle=card.th==="dark"?"#2f2a26":"#fff";ctx.textBaseline="middle";ctx.fillText(card.label,PADX+24,140);
 // 內容（自動縮放＋垂直置中）
 const top=230,bottom=H-190;let s=1,L=layout(ctx,card,s);
 while(L.h>bottom-top&&s>0.6){s-=0.04;L=layout(ctx,card,s)}
 const y0=top+Math.max(0,(bottom-top-L.h)/2);ctx.textBaseline="top";
 L.blocks.forEach(b=>{
  ctx.font=b.font;ctx.fillStyle=b.type==="p"?T.soft:T.ink;
  if(b.type==="q"){ctx.fillStyle=T.acc;ctx.fillRect(PADX,y0+b.y+6,8,b.bh-b.size*(b.lh-1)-6);ctx.fillStyle=T.ink}
  b.ls.forEach((l,i)=>ctx.fillText(l,PADX+b.indent,y0+b.y+i*b.size*b.lh+b.size*(b.lh-1)/2));
 });
 // 頁尾
 ctx.font=`400 28px ${SANS}`;ctx.fillStyle=T.soft;ctx.textBaseline="alphabetic";
 ctx.fillText("LifeOS｜七把魔法鑰匙",PADX,H-100);
 const p=`${idx+1} / ${CARDS.length}`;ctx.fillText(p,W-PADX-ctx.measureText(p).width,H-100);
}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function dl(cv,i){cv.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`臉書圖卡_${String(i+1).padStart(2,"0")}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)},"image/png")}

const grid=document.getElementById("grid");
const canvases=CARDS.map((c,i)=>{const d=document.createElement("div");d.className="cv";d.dataset.text=c.label+c.items.map(x=>x[1]).join("");
 const cv=document.createElement("canvas");cv.width=W;cv.height=H;const b=document.createElement("button");b.textContent=`⬇ 下載第 ${i+1} 張`;b.onclick=()=>dl(cv,i);
 d.append(cv,b);grid.append(d);return cv});
const render=()=>CARDS.forEach((c,i)=>draw(canvases[i],c,i));
render();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);

document.getElementById("all").onclick=()=>canvases.forEach((cv,i)=>setTimeout(()=>dl(cv,i),i*400));
document.getElementById("post").textContent=POST;
document.getElementById("copy").onclick=async()=>{try{await navigator.clipboard.writeText(POST);alert("已複製貼文文字")}catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById("post"));const s=getSelection();s.removeAllRanges();s.addRange(r);alert("請按 Ctrl+C 複製")}};
document.getElementById("q").addEventListener("input",e=>{const k=e.target.value.trim();document.querySelectorAll(".cv").forEach(d=>d.classList.toggle("hidden",!!k&&!d.dataset.text.includes(k)))});
</script>
