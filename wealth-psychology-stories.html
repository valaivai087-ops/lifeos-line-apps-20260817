螺絲釘。", "借力打力，四兩也能撥千斤。", "看懂人性，就看懂了商業。"]}, "p": "商業的底層邏輯就是借力打力：你學不會整合別人，就只能被別人整合一生。", "f": ["外賣借懶惰、直播借孤獨、網貸借焦慮、平台借才藝、老闆借夢想、銀行借存款、資本借慾望", "商業本質是借力打力", "撬動多少資源就擁有多大財富", "不要只當被消耗的螺絲釘", "想清楚你的價值與能整合誰"], "pain": "只會埋頭苦幹，自己的情緒與積蓄成為別人的盈利籌碼", "m": "人性需求被整合成商業模式；整合者獲利，被整合者被消耗", "a": "寫下：你有什麼可被利用的核心價值？你能整合誰的價值？", "c": ["商業的底層邏輯，說穿了就是借力打力。", "你又能去整合誰的價值？", "看清、定位、整合。", "看懂人性，就看懂了商業。"]}, {"t": "💯一顆土豆，讓你懂財富三級跳", "b": "菜市場 1 塊錢一斤的土豆，炸成薯片身價翻 75 倍，發酵蒸餾貼個標籤，直接變身千元級伏特加，前後身價翻了上千倍 同一份原料，只是換了變現邏輯，人和人的差距就這麼悄悄拉開了。\n\n第一層：賣土豆 = 賣體力賣時間 門檻低到人人可替代，你不幹有的是人排隊幹。在完全競爭市場裡，你的勤奮只會被市場均價化，收入天花板入行那天就定死了，再怎麼努力也只是 “把土豆擦得更亮”。\n第二層：賣薯片 = 賣技能賣手藝 會設計、程式設計、剪輯、看病，相當於掌握了加工工藝，身價立刻翻十倍二十倍。但本質還是手停口停，一天只有 24 小時，時間永遠是技能階層的牢籠，幹得再猛產出也有明確上限。\n第三層：賣伏特加 = 賣認知賣稀缺 真正的高手賣的從來不是產品本身，是標籤、社交貨幣、身份認同。就像茅臺、可口可樂，物料成本可以忽略，值錢的是認知差、稀缺感和信任資產，這才是能睡著覺還在賺錢的真正護城河。\n\n三個靈魂拷問，幫你精準定位： ▫️我現在做的事，換個人能不能立刻上手？ ▫️我有沒有可複製的作品、觀點這類資產？ ▫️我有沒有在自己的圈子裡積累信任？\n\n這個時代最可惜的，從來不是不夠努力，是把所有力氣都花在了打磨原料上。別再按斤賤賣你的時間，每天釀一滴酒，一年後你也會擁有屬於自己的酒窖✨\n#個人成長 #財富思維 #認知 #搞錢 #底層邏輯\n06-17", "q": {"哲": ["這個時代最可惜的，是把力氣全花在打磨原料上。", "時間，是技能階層的牢籠。", "真正的護城河，是認知差、稀缺感與信任資產。", "每天釀一滴酒，一年後你也會擁有自己的酒窖。"], "排": ["賣土豆、賣薯片、賣伏特加。", "賣體力，賣技能，賣認知。", "標籤、社交貨幣、身份認同。", "可替代嗎？可複製嗎？有信任嗎？"], "對": ["勤奮在完全競爭市場裡，只會被均價化。", "技能讓你翻十倍，但手停口停。", "物料成本可以忽略，值錢的是信任。", "擦亮土豆，不如釀成酒。"], "反": ["你現在做的事，換個人能不能立刻上手？", "你有沒有可複製的作品或觀點？", "你在圈子裡累積信任了嗎？", "你是在賣土豆，還是在釀酒？"], "衝": ["你在市場賣土豆，再勤快也只能多賺幾塊錢。", "你學會了剪輯，接案收入翻倍，卻每天剪到凌晨。", "一位博主只分享觀點，卻靠信任賣出年薪百萬的課程。"], "翻": ["同樣的原料，不同的邏輯。", "努力不是問題，按斤賣時間才是。", "稀缺不是天生的，是累積的。", "信任，是最貴的資產。"], "遞": ["先賣體力，再賣技能，最後賣認知。", "從土豆，到薯片，到伏特加。", "一滴酒，一桶酒，一座酒窖。"], "詩": ["每天釀一滴酒，一年後你也會擁有屬於自己的酒窖。", "願你的時間，不再按斤賤賣。", "認知是最好的發酵，讓平凡變得珍貴。", "換一種邏輯，土豆也能成為佳釀。"]}, "p": "別再按斤賤賣你的時間；同樣的原料，換一種變現邏輯就差上千倍。", "f": ["一塊錢土豆", "薯片翻 75 倍", "伏特加翻上千倍", "三層：賣體力、賣技能、賣認知稀缺", "三個靈魂拷問定位自己", "每天釀一滴酒"], "pain": "所有力氣都花在打磨原料上，收入天花板早已定死", "m": "可替代的體力→均價化；技能→倍數但受時間限制；認知、稀缺、信任→睡著也賺錢的護城河", "a": "自問：換個人能否立刻上手？有沒有可複製的作品？有沒有累積信任？", "c": ["時間，是技能階層的牢籠。", "賣土豆、賣薯片、賣伏特加。", "你在圈子裡累積信任了嗎？", "願你的時間，不再按斤賤賣。"]}, {"t": "別拿學習自我感動，搞錢才是最快的成長", "b": "別再死磕學歷、攢證書騙自己了。[捂臉R]\n很多人寒窗苦讀二十年，收入反而不如踩中風口的人一年賺得多。\n不是學習沒用，是學不能變現的東西，本質是在用努力自我內耗，熬到最後只會變成一顆好用的螺絲釘。\n\n搞錢先搞透本質： 打工從來不是賣時間，是賣勞動成果。\n你能創造多少價值、能不能精準命中需求、有沒有不可替代的競爭力，才是你真正的換錢資本。\n\n成長不靠死學靠試錯： “清華北大不如膽子大” 話糙理不糙。[點贊R]\n市場規律、人性洞察、落地執行力，從來不是書本背出來的，是一次次踩坑覆盤練出來的。\n只學不落地，只會越學越焦慮。\n\n用搞錢思維倒逼成長： 記住路徑：找對標→模仿→最佳化。\n先學能直接變現的技能，小成本試水市場，跟著有結果的人學，別拿空泛理論當逃避現實的避風港。\n真正的成長，是學一點、用一點、賺一點，迴圈向前，財富才會真的向你靠近。\n#學習和搞錢 #個人成長 #認知 #心理學 #思維\nJun 15", "q": {"哲": ["打工從來不是賣時間，是賣勞動成果。", "只學不落地，只會越學越焦慮。", "市場規律與人性洞察，從來不是背出來的。", "理論可以是工具，也可以是逃避現實的避風港。"], "排": ["找對標，模仿，優化。", "創造多少價值，命中多少需求，有多少不可替代。", "學一點，用一點，賺一點。", "踩坑、覆盤、再踩坑、再覆盤。"], "對": ["死學是自我感動，試錯是真實成長。", "攢證書成螺絲釘，搞錢倒逼成全才。", "清華北大不如膽子大，話糙理不糙。", "學習是輸入，搞錢是輸出。"], "反": ["你學的東西，能變現嗎？", "你是在學習，還是在用學習逃避行動？", "你跟著學的人，有結果嗎？", "你上一次真正踩坑覆盤，是什麼時候？"], "衝": ["你考了十張證書，薪水卻和三年前一樣。", "同學大學輟學做電商，一年收入超過你十年。", "你上了一堆課，卻從沒有接過一個案子。"], "翻": ["學習沒有錯，學不能變現的東西才是內耗。", "搞錢，才是最快的成長。", "試錯不是失敗，是學費。", "成長不是知道多少，而是做到多少。"], "遞": ["先找對標，再模仿，再優化，最後超越。", "從學，到用，到賺，到再學。", "小成本試水，跟對人學，循環向前。"], "詩": ["真正的成長，是學一點、用一點、賺一點。", "願你的每一份學習，都能變成價值。", "在市場裡摸爬滾打，才是最好的學校。", "財富，會向循環前進的人靠近。"]}, "p": "真正的成長，是學一點、用一點、賺一點，循環向前。", "f": ["死磕學歷證書自我感動", "學不能變現的東西是內耗", "打工賣的是勞動成果", "成長靠試錯不靠死學", "找對標、模仿、優化"], "pain": "寒窗苦讀二十年，收入不如踩中風口的人", "m": "可變現技能＋小成本試錯＋向有結果的人學→學用賺循環→持續成長", "a": "找一個已有成果的對標對象，模仿他的一個方法並小成本試水", "c": ["只學不落地，只會越學越焦慮。", "找對標，模仿，優化。", "學習是輸入，搞錢是輸出。", "財富，會向循環前進的人靠近。"]}, {"t": "怎麼建立“本金意思”", "b": "攢到人生第一筆 10w/20w 的姐妹聽我一句！這筆錢千萬別隨便亂花，它才是你走向長期富足的關鍵起點✨\n很多人都賺到過第一桶金，卻沒能一直守住財富，本質都栽在了「本金意識」這一關。這些財商邏輯課本里不會教，長輩也很少講透，能刷到這條筆記，說明你的財富認知正在悄悄覺醒。\n\n不少人會覺得，十萬塊存銀行利息沒多少，根本算不上什麼資本。但這筆錢真正的價值從來不是那點利息，而是承載了兩樣最珍貴的東西：本金思維的建立，和抓住機遇的底氣。\n\n什麼是本金意識？就是把錢當成「種子」，而不是隨手消耗的果實。 普通人拿到收入先想著消費：一頓大餐、一件新衣、一場說走就走的旅行，相當於直接把種子煮熟吃掉。 而長期主義的財富思維，是先思考如何讓錢保值增值，這份認知上的轉變，比本金本身要值錢太多。\n\n手裡留有不動的核心本金，遇到優質機會、週期低谷時，你才有能力從容接住。過往幾次市場波動裡，很多人明明看清了趨勢，卻因為手裡沒有餘錢只能錯過；留有備用金的人穩步佈局，慢慢就拉開了差距。\n不是勸你當守財奴，只是調換一下花錢的順序： 普通人賺多少花多少，本金始終攢不住；清醒的做法是先留住核心本金，靠本金產生被動收益，日常只花利潤部分，讓本金一直留在那裡持續生息。\n\n當你守住一筆本金、經歷一次增值後，心態會慢慢蛻變：不再為小額得失內耗，視角從消費者切換成投資者，對財富的敏感度也會越來越高。\n剛攢下第一桶金的話，建議把核心資金單獨存好，日常開銷靠工資覆蓋。等本金有了穩定收益，再用收益改善生活，這才是長久富足的開始\n#財富思維 #心理 #財商 #認知 #底層邏輯 #本金\n06-15", "q": {"哲": ["本金是種子，不是果實。", "認知上的轉變，比本金本身值錢太多。", "手裡有不動的本金，機會來時才接得住。", "不是當守財奴，而是調換花錢的順序。"], "排": ["一頓大餐、一件新衣、一場旅行，種子被煮熟吃掉。", "先留本金，再產收益，再花利潤。", "不為小額得失內耗，從消費者變投資者，對財富越來越敏感。", "本金思維的建立，抓住機遇的底氣。"], "對": ["普通人賺多少花多少，清醒的人只花利潤。", "十萬的利息不多，十萬的意義很大。", "看清趨勢卻沒餘錢，等於沒看清。", "消費者看價格，投資者看價值。"], "反": ["你的第一筆十萬，是種子還是果實？", "如果明天有好機會，你有本金可以接嗎？", "你的花錢順序，是先花還是先存？", "你還在為小額得失內耗嗎？"], "衝": ["你看準了市場低谷，卻因為手上沒錢只能錯過。", "存到十萬那天你很興奮，一週後就花掉了一半。", "朋友只花本金產生的收益，生活一樣舒適，本金還在增長。"], "翻": ["本金意識，比本金本身更值錢。", "不亂花不是摳門，是長期主義。", "被動收益，才是改善生活的正確來源。", "你的財富認知，正在悄悄覺醒。"], "遞": ["先存本金，再產收益，再用收益改善生活。", "從消費者，到儲蓄者，到投資者。", "存下、守住、生息。"], "詩": ["讓本金一直留在那裡，持續生息。", "願你守住第一桶金，迎來長久富足。", "種子不吃，春天就會來。", "這才是長久富足的開始。"]}, "p": "本金意識，是把錢當成種子而不是果實，只花利潤不動本金。", "f": ["第一筆十萬二十萬別亂花", "守不住財富是因為沒有本金意識", "十萬的價值是本金思維與抓機會的底氣", "調換花錢順序：先留本金、只花收益", "視角從消費者切換成投資者"], "pain": "賺多少花多少，本金始終攢不住，機會來時沒有餘錢", "m": "核心本金不動→被動收益→只花收益；週期低谷時有本金可佈局", "a": "把核心資金單獨存放，日常開銷只用工資覆蓋", "c": ["本金是種子，不是果實。", "消費者看價格，投資者看價值。", "本金意識，比本金本身更值錢。", "種子不吃，春天就會來。"]}, {"t": "\"90% 的內耗，都源於這件事！", "b": "你是不是也在被別人控制情緒？現在很多人都得了一種病 —— 情緒外包。\n\n你的喜怒哀樂，自己說了不算。老闆一個臉色，你惴惴不安一整天；同事一句評價，你翻來覆去想半夜；就連朋友圈的點贊數，都能決定你當天的心情。別人一句肯定，你覺得世界都亮了；別人一句否定，你瞬間覺得天塌地陷。\n\n你把人生最寶貴的情緒遙控器，交到了無數路人手裡，這樣活，不內耗才怪。\n想要徹底擺脫內耗，你必須建立自己的 \"情緒金本位\"。\n很多人的情緒就像濫發的紙幣：被誇兩句就飄上天，被罵兩句就跌入谷底。根本原因，是你的自我價值沒有穩固的錨點。\n\n而真正清醒的人，會把自我價值錨定在自己身上。堅持讀書、堅持運動、打磨專業、提升認知，每一次自我精進，都是在為自己增加 \"黃金儲備\"。這些刻進骨子裡的成長，任何人都拿不走。\n當你有了足夠的內在黃金，外界的廉價誇讚和惡意詆譭，就都變成了廢紙。無論別人怎麼說、怎麼看，你的核心價值始終穩定不變。\n\n記住，你的價值從來不需要別人來定義。專注自身成長，你才能成為自己人生真正的主人。\n#個人成長 #人生感悟 #自我提升 #底層邏輯 #情緒\n06-14", "q": {"哲": ["你的價值，從來不需要別人來定義。", "把情緒遙控器交給路人，不內耗才怪。", "每一次自我精進，都是在增加黃金儲備。", "刻進骨子裡的成長，任何人都拿不走。"], "排": ["讀書、運動、打磨專業、提升認知。", "老闆一個臉色，同事一句評價，朋友圈一個讚數。", "被誇就飄上天，被罵就跌入谷底。", "錨定自己，穩定自己，成為自己。"], "對": ["情緒像濫發的紙幣，價值才會暴漲暴跌。", "有了內在黃金，廉價誇讚與惡意詆譭都成了廢紙。", "外包情緒的人隨風搖擺，錨定自己的人穩如磐石。", "別人的評價是天氣，你的價值是氣候。"], "反": ["你的喜怒哀樂，自己說了算嗎？", "你的自我價值，錨定在哪裡？", "一個讚數，憑什麼決定你一天的心情？", "你的黃金儲備，今天增加了嗎？"], "衝": ["老闆開會時沒看你一眼，你忐忑了一整天。", "同事一句「你這樣不行」，你翻來覆去想到半夜。", "貼文只有三個讚，你開始懷疑自己是不是很失敗。"], "翻": ["內耗不是你太敏感，是價值沒有錨點。", "穩定的情緒，來自穩定的價值。", "別人的評價，不是你的匯率。", "擺脫內耗，從收回遙控器開始。"], "遞": ["先收回情緒遙控器，再錨定自我價值，最後穩定內在。", "從情緒外包，到情緒自主，到人生自主。", "精進、儲備、穩定、自由。"], "詩": ["專注自身成長，你才能成為自己人生真正的主人。", "願你的心，有自己的金本位。", "風再大，錨定的船也不會漂走。", "你的價值，由你自己發行。"]}, "p": "90% 的內耗源於情緒外包；建立自己的「情緒金本位」，你才是人生的主人。", "f": ["喜怒哀樂由別人決定", "情緒遙控器交給路人", "情緒像濫發的紙幣", "把自我價值錨定在自身成長", "內在黃金足夠，外界評價皆成廢紙"], "pain": "老闆一個臉色、同事一句評價、朋友圈點讚數，都能左右一整天心情", "m": "自我價值無錨點→情緒隨外界波動；持續自我精進→內在黃金儲備→情緒穩定", "a": "每天做一件累積「黃金儲備」的事：讀書、運動或精進專業", "c": ["你的自我價值，錨定在哪裡？", "別人的評價，不是你的匯率。", "精進、儲備、穩定、自由。", "你的價值，由你自己發行。"]}, {"t": "世界盃心流!普通人如何開啟無敵專注模式？", "b": "看世界盃別光顧著看球！德布勞內的神仙傳球、門將的極限撲救，背後其實是一套大腦的“超級心流”（Hyper-Flow）機制：讓負責焦慮和自我懷疑的腦區暫時“斷電”，完全由高效率的直覺接管。\n\n把這套機制搬到你的書桌或辦公桌上，工作和複習效率直接降維打擊！\n1. 鎖定“4%黃金難度區” 心流只發生在挑戰比現有技能高出【4%】的微妙區間。\n❌ 任務太難（如萬字報告）： 大腦因恐懼而拖延。➡️【微調降級】：在20分鐘內不顧質量，只敲出大綱框架。\n❌ 任務太枯燥（如背單詞）： ➡️【主動升級】：引入時間壓力，“限時15分鐘挑戰50個詞”，用競賽感逼出多巴胺！\n\n2. 打造“1秒即時反饋” 球場上進球或失誤0.1秒見分曉，所以讓人瘋狂上頭。\n❌ 別說： “我今天下午要複習。”（目標模糊，大腦容易犯困）\n✅ 改成： “刷3張卷子裡的20道大題，做完一題立刻對答案改錯！”把任務拆成非黑即白的閉環，讓大腦清晰看到“比分上漲”，直接變身續航燃料！\n\n3. 復刻C羅的“賽前儀式” C羅罰球前量步點、深呼吸、叉腰，是精密的心理錨定。 為你自己設計一個心流開關：手機扔隔壁房間 ➡️ 戴上降噪耳機（認知關閉） ➡️ 3次深呼吸。兩週後形成條件反射，這套動作一做，大腦秒進“比賽模式”！\n\n#心流 #高效學習法 #自律 #時間管理 #職場成長 #備考乾貨 #世界盃冷知識 #個人成長\nJun 13", "q": {"哲": ["心流，發生在挑戰比技能高出一點點的地方。", "讓焦慮斷電，讓直覺接管。", "清晰的反饋，是大腦最好的燃料。", "儀式不是迷信，是心理錨定。"], "排": ["鎖定難度，打造反饋，設計儀式。", "太難就降級，太無聊就升級，剛剛好就進入心流。", "手機放隔壁，戴上耳機，三次深呼吸。", "做完一題，對答案，改錯，再下一題。"], "對": ["目標模糊讓大腦犯睏，閉環任務讓大腦上頭。", "萬字報告讓你拖延，二十分鐘大綱讓你啟動。", "背單詞很枯燥，限時挑戰很刺激。", "C 羅罰球前的動作，不是習慣，是開關。"], "反": ["你的任務，是太難還是太無聊？", "你能在一秒內看到自己的進度嗎？", "你有沒有一個屬於自己的專注開關？", "為什麼你看球能專注九十分鐘，工作卻撐不過十分鐘？"], "衝": ["你面對一份萬字報告，從早上拖到晚上一個字沒寫。", "你說今天下午要複習，結果在書桌前睡著了。", "你一戴上耳機深呼吸，兩週後這個動作就讓你秒進狀態。"], "翻": ["專注不是靠意志力，是靠設計。", "拖延不是懶，是任務難度不對。", "無聊的任務，加上時間壓力就變遊戲。", "儀式感，是專注的啟動鍵。"], "遞": ["先調難度，再設反饋，最後建立儀式。", "從拖延，到啟動，到心流，到高效。", "降級、升級、閉環、錨定。"], "詩": ["把球場上的心流，搬到你的書桌上。", "願你每一次專注，都像進入一場比賽。", "當焦慮斷電，直覺會帶你飛。", "心流，是時間消失、自己出現的地方。"]}, "p": "心流不是天賦，而是一套可複製的機制：4% 難度、即時反饋、儀式錨定。", "f": ["世界盃球星的超級心流", "焦慮腦區斷電、直覺接管", "鎖定 4% 黃金難度區", "打造一秒即時反饋", "復刻賽前儀式", "大腦秒進比賽模式"], "pain": "工作或複習時拖延、分心、犯睏，無法專注", "m": "挑戰略高於技能→進入心流；任務拆成閉環→即時反饋→多巴胺續航；固定儀式→條件反射", "a": "設計一個三步心流開關：手機放隔壁、戴耳機、三次深呼吸", "c": ["儀式不是迷信，是心理錨定。", "儀式感，是專注的啟動鍵。", "降級、升級、閉環、錨定。", "當焦慮斷電，直覺會帶你飛。"]}, {"t": "賺錢是為了買回我們“拒絕別人的自由”", "b": "每天上班像上墳，為了碎銀幾兩忍氣吞聲，最後錢沒賺到多少，精神先內耗崩潰了？ 其實，賺錢這件事本身並不累，累的是你承載了太多“別人的課題”。\n今天用阿德勒心理學，幫所有現代打工人做一次“精神斷舍離”！\n阿德勒心理學核心觀點：一切人際關係的矛盾，都源於對別人課題的妄加干涉，或者自己的課題被別人干涉。\n放在職場和賺錢上，我們可以把所有事簡單粗暴地劃分為兩類：\n1.我的課題：我付出了多少勞動、我的技能有沒有提升、我拿到了多少回報。\n2.他人的課題：老闆滿不滿意、同事怎麼看我、公司會不會倒閉、客戶配不配合。\n\n❌ 3個典型的“職場課題混淆”\n看看你中了幾個？\n情緒內耗：“老闆今天開會沒直視我，是不是對我有意見？”\n課題分離：你是否完成了工作，是你的課題；老闆高不高興、怎麼評價你，是老闆的課題。\n過度負責：“這個專案沒做好，雖然不是我的主責，但我好愧疚。”\n課題分離：盡心盡力是你的課題；專案最終的成敗和公司的命運，是管理層的課題。\n自尊綁架：“為了這點工資天天被客戶挑刺，我活得太沒尊嚴了。”\n課題分離：你出賣專業技能換取報酬，這是商業交易（你的課題）；對方專業度低、態度差，那是對方的素質課題，不需要用來定義你的人格。\n\n搞錢的最高境界，是把自己當成一家“一人公司”。\n1. 建立“乙方心態” 把老闆和公司當成你的“大客戶”。客戶付錢，你提供服務。服務時間內保持職業化，下班直接切斷連結。“我不是來這裡找家人的，我是來提供資產、置換現金的。”\n2. 停止為他人的情緒買單 職場上 90% 的指責和PUA，其實都源於對方自身的焦慮和無能。分清界限：“你可以罵我，但那是你的情緒宣洩，我不負責吸收。”\n3. 聚焦於“自我課題”的增值 把精力從“研究人際關係”轉移到“提升核心資產”上。今天多學了一個技能、多攢了一個案例、多領了一個月的薪水，這些才是你真正賺到的。\n\n✨ 財富心理學結語\n賺錢真的只是為了錢嗎？ 不，賺錢是為了買回我們“拒絕別人的自由”。\n當你學會把“賺錢”當作純粹的課題分離，你會發現：工作再也傷不到你，因為你只是一臺無情的無形資產增值機器。\n#阿德勒心理學 #課題分離 #職場內耗 #搞錢腦 #搞錢女孩 #職場成長 #財富心理局 #心理學乾貨 #認知覺醒 #一人公司\n06-12", "q": {"哲": ["一切人際矛盾，都源於干涉他人課題或被干涉。", "賺錢這件事本身不累，累的是承載了別人的課題。", "你出賣專業技能換報酬，不需要用對方的態度定義你的人格。", "搞錢的最高境界，是把自己當成一家一人公司。"], "排": ["我付出多少勞動，我的技能有沒有提升，我拿到多少回報。", "老闆滿不滿意，同事怎麼看，公司會不會倒，客戶配不配合。", "建立乙方心態，停止為他人情緒買單，聚焦自我課題增值。", "多學一個技能，多攢一個案例，多領一個月薪水。"], "對": ["完成工作是你的課題，老闆高不高興是他的課題。", "盡心盡力是你的事，專案成敗是管理層的事。", "你可以罵我，但我不負責吸收。", "我不是來找家人的，我是來置換現金的。"], "反": ["讓你內耗的，是你的課題還是別人的課題？", "老闆沒看你一眼，真的代表他對你有意見嗎？", "你在為誰的情緒買單？", "你今天真正賺到的，是什麼？"], "衝": ["老闆開會沒直視你，你猜了一整天他是不是不滿意。", "不是你主責的專案失敗了，你卻愧疚得睡不著。", "客戶天天挑剔，你覺得自己活得毫無尊嚴。"], "翻": ["工作再也傷不到你，因為你只是一台資產增值機器。", "職場九成的指責，源於對方的焦慮與無能。", "課題分離不是冷漠，是清醒。", "賺錢買的不是東西，是說不的自由。"], "遞": ["先分清課題，再停止內耗，最後聚焦增值。", "從情緒內耗，到課題分離，到一人公司。", "劃界、專注、增值、自由。"], "詩": ["賺錢，是為了買回我們拒絕別人的自由。", "願你只負責自己的課題，把其餘的還給世界。", "做一家安靜而強大的一人公司。", "分清界限的那一刻，你就自由了。"]}, "p": "賺錢不是為了錢，而是為了買回「拒絕別人的自由」。", "f": ["上班像上墳、精神內耗", "累的是承載太多別人的課題", "阿德勒課題分離：我的課題 vs 他人的課題", "三種職場課題混淆", "把自己當一人公司：乙方心態、不為他人情緒買單、聚焦自我增值"], "pain": "為老闆臉色、同事評價、專案成敗與客戶態度內耗", "m": "課題分離→只負責自己的勞動、成長與回報→情緒不被他人綁架→專注資產增值", "a": "遇到內耗時問：「這是我的課題，還是他的課題？」", "c": ["你可以罵我，但我不負責吸收。", "你在為誰的情緒買單？", "劃界、專注、增值、自由。", "做一家安靜而強大的一人公司。"]}];

const $=s=>document.querySelector(s);
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const hl=s=>{s=esc(s);if(!kw)return s;return s.split(esc(kw)).join('<mark>'+esc(kw)+'</mark>')};
const allText=d=>d.t+d.b+(d.p||'')+Object.values(d.q).flat().join('');
function list(){const ids=D.map((d,i)=>i).filter(i=>!kw||allText(D[i]).includes(kw));
$('#nav').innerHTML=ids.map(i=>`<a data-i="${i}" class="${i===cur?'on':''}"><small>${i+1}</small>${hl(D[i].t)}</a>`).join('')||'<a>查無結果</a>';
$('#sel').innerHTML=ids.map(i=>`<option value="${i}" ${i===cur?'selected':''}>${i+1}．${esc(D[i].t)}</option>`).join('');return ids}
function post(d){let s=d.t+'\n\n';if(d.p)s+='「'+d.p+'」\n\n';for(const k in QN){if(d.q[k].length)s+=d.q[k].join('\n')+'\n\n'}return s.trim()}
function art(){const d=D[cur];const f=d.f||[];
$('#main').innerHTML=`<div class="card"><h2>${cur+1}．${hl(d.t)}</h2></div>
${d.p?`<div class="prop"><small>核心命題</small>${hl(d.p)}</div>`:''}
<div class="card"><h3>臉書金句圖卡（${d.c.length} 句・${d.c.join('').length} 字）</h3>
<div class="cardwrap"><img id="cimg" alt="金句圖卡"><div class="cardtxt">${d.c.map(x=>`<p>${hl(x)}</p>`).join('')}
<div class="cardbtns"><button class="btn" id="cdl">下載圖卡 PNG</button><button class="btn" id="ccp">複製圖卡文字</button></div></div></div></div>
<div class="card"><h3>框架圖</h3><div class="flow">${f.map((x,j)=>(j?'<span class="arr">➜</span>':'')+`<div class="node"><i>${FL[j]||'步驟'+(j+1)}</i>${esc(x)}</div>`).join('')}</div>
<div class="mech"><div><b>觸發痛點</b>${esc(d.pain)}</div><div><b>運作機制</b>${esc(d.m)}</div><div><b>落地行動</b>${esc(d.a)}</div></div></div>
<div class="card"><h3>臉書圖文金句（${Object.values(d.q).flat().length} 句） <button class="btn" id="cp">複製整篇貼文</button></h3>
<div class="qbox">${Object.values(d.q).flat().map(x=>`<p>${hl(x)}</p>`).join('')}</div></div>
<div class="card"><details ${kw&&(d.t+d.b).includes(kw)?'open':''}><summary>原文（繁體）</summary><div class="raw">${hl(d.b)}</div></details></div>`;
$('#cp').onclick=()=>{navigator.clipboard.writeText(post(d)).then(()=>{$('#cp').textContent='已複製 ✓'})};
const url=drawCard(d);$('#cimg').src=url;
$('#cdl').onclick=()=>{const a=document.createElement('a');a.href=url;a.download=`${NAME}_${cur+1}_${d.t.slice(0,12).replace(/[\\/:*?"<>|｜]/g,'')}.png`;a.click()};
$('#ccp').onclick=()=>{navigator.clipboard.writeText(d.c.join('\n')).then(()=>{$('#ccp').textContent='已複製 ✓'})};scrollTo(0,0)}
const NAME=document.querySelector('h1').textContent;
function wrap(x,s,w){const out=[];let line='';for(const ch of s){if(x.measureText(line+ch).width>w&&line){out.push(line);line=ch}else line+=ch}if(line)out.push(line);return out}
function drawCard(d){const S=1080,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');
const g=x.createLinearGradient(0,0,S,S);g.addColorStop(0,'#2b2622');g.addColorStop(1,'#6b4430');x.fillStyle=g;x.fillRect(0,0,S,S);
x.strokeStyle='rgba(232,196,150,.55)';x.lineWidth=3;x.strokeRect(50,50,S-100,S-100);
const F='"Noto Serif TC","PMingLiU","Microsoft JhengHei",serif';
x.fillStyle='#e8c496';x.font=`600 34px ${F}`;x.textAlign='center';x.fillText('「 '+(d.t.length>22?d.t.slice(0,22)+'…':d.t)+' 」',S/2,150);
x.font=`600 62px ${F}`;let lines=[];d.c.forEach((s,i)=>{if(i)lines.push('');lines.push(...wrap(x,s,S-220))});
let fs=62;while(lines.length*fs*1.5>680&&fs>40){fs-=4;x.font=`600 ${fs}px ${F}`;lines=[];d.c.forEach((s,i)=>{if(i)lines.push('');lines.push(...wrap(x,s,S-220))})}
const lh=fs*1.5;let y=S/2-(lines.length*lh)/2+fs*0.9;x.fillStyle='#fff8ee';
for(const l of lines){if(l)x.fillText(l,S/2,y);y+=l?lh:lh*0.45}
x.fillStyle='#e8c496';x.font=`400 30px ${F}`;x.fillText('— '+NAME+' —',S/2,S-110);return c.toDataURL('image/png')}
function table(ids){$('#main').innerHTML=`<div class="card"><h3>每篇機制一頁總表（${ids.length} 篇）</h3><div class="tblwrap"><table><tr><th>#</th><th>標題</th><th>核心命題</th><th>觸發痛點</th><th>運作機制</th><th>落地行動</th><th>框架</th></tr>
${ids.map(i=>{const d=D[i];return `<tr><td class="n">${i+1}</td><td><a data-go="${i}">${hl(d.t)}</a></td><td>${hl(d.p)}</td><td>${esc(d.pain)}</td><td>${esc(d.m)}</td><td>${esc(d.a)}</td><td>${esc((d.f||[]).join(' → '))}</td></tr>`}).join('')}</table></div></div>`}
function render(){const ids=list();if(view==='a'){if(!ids.includes(cur)&&ids.length)cur=ids[0];list();art()}else table(ids)}
$('#nav').onclick=e=>{const a=e.target.closest('a[data-i]');if(a){cur=+a.dataset.i;view='a';tab();render()}};
$('#main').onclick=e=>{const a=e.target.closest('a[data-go]');if(a){cur=+a.dataset.go;view='a';tab();render()}};
$('#sel').onchange=e=>{cur=+e.target.value;view='a';tab();render()};
$('#q').oninput=e=>{kw=e.target.value.trim();render()};
function tab(){$('#t1').classList.toggle('on',view==='a');$('#t2').classList.toggle('on',view==='t')}
$('#t1').onclick=()=>{view='a';tab();render()};$('#t2').onclick=()=>{view='t';tab();render()};
render();
</script>
</body>
</html>
