<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人格工程 APP — Personality Operating System</title>
<style>
  :root {
    --bg: #FFFFFF;
    --bg-soft: #F8F9FF;
    --bg-card: #FFFFFF;
    --navy: #0D1B3E;
    --teal: #006B7D;
    --gold: #B8860B;
    --gold-light: #E8A020;
    --accent: #E83E3E;
    --text: #1A1A2E;
    --text-mid: #3A3A5C;
    --text-soft: #6B6B8A;
    --border: #E8EAF6;
    --pill: #EEF2FF;
    --shadow: 0 2px 16px rgba(13,27,62,0.08);
    --shadow-hover: 0 6px 28px rgba(13,27,62,0.16);
    --radius: 16px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-soft);
    color: var(--text);
    font-family: 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif;
    font-size: 17px;
    line-height: 1.7;
    min-height: 100vh;
  }

  /* ── TOP NAV ── */
  .topnav {
    background: var(--bg);
    border-bottom: 2px solid var(--border);
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 6px;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(13,27,62,0.06);
  }
  .topnav-logo { font-size: 20px; font-weight: 900; color: var(--navy); letter-spacing: -0.5px; flex: 1; }
  .topnav-logo span { color: var(--gold-light); }
  .topnav-tab {
    padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: 700;
    cursor: pointer; border: none; background: transparent; color: var(--text-soft);
    transition: all 0.2s;
  }
  .topnav-tab.active { background: var(--navy); color: #fff; }
  .topnav-tab:hover:not(.active) { background: var(--pill); color: var(--navy); }

  /* ── SCREENS ── */
  .screen { display: none; padding: 20px; max-width: 480px; margin: 0 auto; }
  .screen.active { display: block; }

  /* ── HERO SCORES ── */
  .hero {
    background: linear-gradient(135deg, var(--navy) 0%, #1a3a6e 100%);
    border-radius: var(--radius);
    padding: 24px 20px;
    color: #fff;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '🧠';
    position: absolute; right: 16px; top: 16px;
    font-size: 60px; opacity: 0.15;
  }
  .hero-title { font-size: 13px; font-weight: 700; letter-spacing: 2px; opacity: 0.7; margin-bottom: 4px; }
  .hero-name { font-size: 24px; font-weight: 900; margin-bottom: 16px; }
  .score-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .score-box { background: rgba(255,255,255,0.1); border-radius: var(--radius-sm); padding: 10px 8px; text-align: center; }
  .score-box .val { font-size: 26px; font-weight: 900; color: #FFD700; line-height: 1; }
  .score-box .lbl { font-size: 11px; opacity: 0.85; margin-top: 3px; line-height: 1.3; }
  .score-box.main { background: rgba(232,160,32,0.25); border: 1px solid rgba(232,160,32,0.4); }
  .hero-btn {
    display: block; width: 100%; margin-top: 16px; padding: 12px;
    background: linear-gradient(90deg, #E8A020, #FFD700);
    color: var(--navy); font-weight: 900; font-size: 16px;
    border: none; border-radius: var(--radius-sm); cursor: pointer;
    letter-spacing: 0.5px;
  }

  /* ── MODULE CARDS ── */
  .section-title {
    font-size: 18px; font-weight: 900; color: var(--navy);
    margin: 20px 0 12px; display: flex; align-items: center; gap: 8px;
  }
  .section-title::after {
    content: ''; flex: 1; height: 2px;
    background: linear-gradient(90deg, var(--gold-light), transparent);
  }

  .mod-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
  .mod-card {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 16px 14px;
    cursor: pointer;
    box-shadow: var(--shadow);
    border: 1.5px solid transparent;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .mod-card:hover, .mod-card.active {
    border-color: var(--gold-light);
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px);
  }
  .mod-card .icon { font-size: 28px; margin-bottom: 8px; }
  .mod-card .mod-name { font-size: 15px; font-weight: 900; color: var(--navy); }
  .mod-card .mod-sub { font-size: 12px; color: var(--text-soft); margin-top: 3px; }
  .mod-card .mod-num {
    position: absolute; top: 10px; right: 12px;
    font-size: 11px; font-weight: 700; color: var(--gold-light);
    background: #FFF8E7; padding: 2px 6px; border-radius: 20px;
  }

  /* ── MODULE DETAIL ── */
  .mod-detail {
    background: var(--bg-card); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .mod-detail-head {
    display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px;
    padding-bottom: 14px; border-bottom: 2px solid var(--border);
  }
  .mod-detail-icon { font-size: 40px; flex-shrink: 0; }
  .mod-detail-title { font-size: 20px; font-weight: 900; color: var(--navy); }
  .mod-detail-desc { font-size: 14px; color: var(--text-soft); margin-top: 4px; }

  .formula-chain {
    background: var(--bg-soft); border-radius: var(--radius-sm);
    padding: 14px; margin: 12px 0;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .formula-item {
    background: var(--bg-card); border: 1.5px solid var(--border);
    border-radius: 8px; padding: 7px 20px; font-weight: 700; font-size: 15px;
    color: var(--navy); min-width: 120px; text-align: center;
  }
  .formula-arrow { font-size: 16px; color: var(--gold-light); font-weight: 900; }

  /* ── QUOTES ── */
  .quotes-list { display: flex; flex-direction: column; gap: 10px; }
  .quote-card {
    background: var(--bg-card);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    box-shadow: 0 1px 8px rgba(13,27,62,0.06);
    border-left: 4px solid var(--gold-light);
    font-size: 16px; font-weight: 700; color: var(--navy);
    line-height: 1.6;
  }
  .quote-card .q-num { font-size: 11px; color: var(--text-soft); font-weight: 400; margin-bottom: 4px; }

  /* ── NUTRIENTS ── */
  .nutrient-card {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 18px 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    border-top: 4px solid var(--teal);
  }
  .nutrient-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .nutrient-icon { font-size: 28px; }
  .nutrient-name { font-size: 17px; font-weight: 900; color: var(--navy); }
  .nutrient-eng { font-size: 12px; color: var(--text-soft); margin-top: 2px; }
  .nutrient-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .tag {
    font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 20px;
    background: var(--pill); color: var(--navy);
  }
  .tag.brain { background: #EEF0FF; color: #3730A3; }
  .tag.stress { background: #FFF7ED; color: #C2410C; }
  .tag.energy { background: #ECFDF5; color: #065F46; }
  .tag.neuro { background: #F5F3FF; color: #6D28D9; }
  .tag.hormone { background: #FFF1F2; color: #BE123C; }
  .mechanism-box {
    background: var(--bg-soft); border-radius: var(--radius-sm);
    padding: 12px 14px; font-size: 14px; color: var(--text-mid);
    line-height: 1.75; margin-bottom: 10px;
  }
  .mechanism-box strong { color: var(--teal); }
  .effect-list { list-style: none; }
  .effect-list li {
    font-size: 14px; color: var(--text-mid); padding: 4px 0;
    display: flex; align-items: flex-start; gap: 6px;
  }
  .effect-list li::before { content: '✅'; font-size: 13px; flex-shrink: 0; margin-top: 2px; }
  .buy-btn {
    display: block; width: 100%; margin-top: 12px;
    padding: 11px 16px;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    color: #fff; font-weight: 900; font-size: 15px;
    border: none; border-radius: var(--radius-sm);
    cursor: pointer; text-align: center; text-decoration: none;
    letter-spacing: 0.3px; box-shadow: 0 2px 8px rgba(184,134,11,0.3);
  }
  .buy-btn:hover { filter: brightness(1.08); }

  /* ── DIAGNOSIS ── */
  .quiz-card {
    background: var(--bg-card); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .quiz-progress { margin-bottom: 16px; }
  .progress-bar-bg {
    background: var(--border); border-radius: 20px; height: 8px; overflow: hidden;
  }
  .progress-bar { background: linear-gradient(90deg, var(--teal), var(--gold-light)); height: 100%; border-radius: 20px; transition: width 0.4s; }
  .progress-label { font-size: 13px; color: var(--text-soft); margin-top: 5px; }
  .q-text { font-size: 17px; font-weight: 700; color: var(--navy); margin-bottom: 16px; line-height: 1.5; }
  .q-options { display: flex; flex-direction: column; gap: 8px; }
  .q-opt {
    padding: 13px 16px; border-radius: var(--radius-sm);
    border: 2px solid var(--border); background: var(--bg-card);
    font-size: 15px; color: var(--text); cursor: pointer;
    transition: all 0.18s; font-weight: 600; text-align: left;
  }
  .q-opt:hover { border-color: var(--gold-light); background: #FFFBEF; }
  .q-opt.selected { border-color: var(--navy); background: var(--navy); color: #fff; }
  .q-nav { display: flex; gap: 10px; margin-top: 16px; }
  .q-btn {
    flex: 1; padding: 12px; border-radius: var(--radius-sm);
    font-size: 15px; font-weight: 700; cursor: pointer; border: none;
  }
  .q-btn.prev { background: var(--border); color: var(--text-mid); }
  .q-btn.next { background: var(--navy); color: #fff; }
  .q-btn:disabled { opacity: 0.4; cursor: default; }

  /* ── RESULT ── */
  .result-box {
    background: linear-gradient(135deg, var(--navy), #1a3a6e);
    border-radius: var(--radius); padding: 24px 20px; color: #fff; margin-bottom: 16px;
    text-align: center;
  }
  .result-type { font-size: 13px; opacity: 0.7; margin-bottom: 6px; letter-spacing: 2px; }
  .result-name { font-size: 26px; font-weight: 900; color: #FFD700; margin-bottom: 8px; }
  .result-desc { font-size: 15px; opacity: 0.9; line-height: 1.7; }
  .result-scores { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin: 16px 0; }
  .rscore { background: rgba(255,255,255,0.1); border-radius: 10px; padding: 10px 6px; text-align: center; }
  .rscore .rv { font-size: 22px; font-weight: 900; color: #FFD700; }
  .rscore .rl { font-size: 11px; opacity: 0.8; margin-top: 3px; }

  .rec-section { margin-top: 16px; }
  .rec-title { font-size: 16px; font-weight: 900; color: var(--navy); margin-bottom: 10px; }
  .rec-card {
    background: var(--bg-card); border-radius: var(--radius-sm);
    padding: 12px 14px; margin-bottom: 8px; border-left: 4px solid var(--teal);
    font-size: 14px; color: var(--text-mid);
  }
  .rec-card strong { color: var(--navy); font-size: 15px; display: block; margin-bottom: 4px; }

  /* ── UPGRADE CARDS ── */
  .upgrade-card {
    background: var(--bg-card); border-radius: var(--radius);
    overflow: hidden; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .upgrade-old {
    background: #FFF1F2; padding: 14px 16px; border-bottom: 2px solid #FCA5A5;
  }
  .upgrade-new {
    background: #ECFDF5; padding: 14px 16px;
  }
  .upg-label {
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .upg-label.old { color: #DC2626; }
  .upg-label.new { color: #065F46; }
  .upg-text { font-size: 15px; font-weight: 700; color: var(--navy); line-height: 1.5; }
  .upgrade-arrow {
    text-align: center; padding: 4px; background: var(--border);
    font-size: 16px; color: var(--gold-light); font-weight: 900;
  }

  /* ── FLOATING CTA ── */
  .float-cta {
    position: fixed; bottom: 20px; right: 20px; z-index: 200;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: #fff; padding: 12px 20px; border-radius: 30px;
    font-weight: 900; font-size: 14px; box-shadow: 0 4px 16px rgba(184,134,11,0.4);
    cursor: pointer; border: none; text-decoration: none;
    display: flex; align-items: center; gap: 6px;
  }

  /* ── AI COACH BOX ── */
  .ai-box {
    background: linear-gradient(135deg, #0D1B3E, #1a3a6e);
    border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
    color: #fff;
  }
  .ai-box-title { font-size: 15px; font-weight: 900; color: #FFD700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
  .ai-input {
    width: 100%; padding: 11px 14px; border-radius: var(--radius-sm);
    background: rgba(255,255,255,0.1); border: 1.5px solid rgba(255,255,255,0.2);
    color: #fff; font-size: 15px; margin-bottom: 10px; outline: none;
    font-family: inherit;
  }
  .ai-input::placeholder { color: rgba(255,255,255,0.4); }
  .ai-input:focus { border-color: #FFD700; }
  .ai-response {
    background: rgba(255,255,255,0.08); border-radius: var(--radius-sm);
    padding: 12px 14px; font-size: 15px; color: rgba(255,255,255,0.9);
    min-height: 60px; line-height: 1.7; display: none;
    white-space: pre-wrap;
  }
  .ai-response.visible { display: block; }
  .ai-send {
    width: 100%; padding: 11px; background: linear-gradient(90deg, #E8A020, #FFD700);
    color: var(--navy); font-weight: 900; font-size: 15px;
    border: none; border-radius: var(--radius-sm); cursor: pointer;
  }

  .disclaimer { font-size: 12px; color: var(--text-soft); text-align: center; padding: 20px 0 40px; }

  /* scroll helper */
  .pb80 { padding-bottom: 80px; }
</style>
</head>

// ── Quiz
let qIdx = 0;
let answers = {};

function renderQuestion() {
  const q = QUIZ_QUESTIONS[qIdx];
  const pct = Math.round(((qIdx+1)/QUIZ_QUESTIONS.length)*100);
  document.getElementById('prog-bar').style.width = pct+'%';
  document.getElementById('prog-label').textContent = `第 ${qIdx+1} 題 / 共 ${QUIZ_QUESTIONS.length} 題`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('q-options').innerHTML = q.opts.map((o,i) => `
    <button class="q-opt${answers[qIdx]===i?' selected':''}" onclick="selectOpt(${i})">${o}</button>
  `).join('');
  document.getElementById('btn-prev').disabled = qIdx===0;
  document.getElementById('btn-next').textContent = qIdx===QUIZ_QUESTIONS.length-1 ? '查看結果 →' : '下一題';
  document.getElementById('btn-next').disabled = answers[qIdx]===undefined;
}

function selectOpt(i) {
  answers[qIdx] = i;
  document.querySelectorAll('.q-opt').forEach((b,j)=>b.classList.toggle('selected',j===i));
  document.getElementById('btn-next').disabled = false;
}

function quizPrev() { if(qIdx>0){qIdx--;renderQuestion();} }
function quizNext() {
  if(answers[qIdx]===undefined) return;
  if(qIdx<QUIZ_QUESTIONS.length-1){ qIdx++; renderQuestion(); }
  else { showResult(); }
}

function showResult() {
  const total = Object.values(answers).reduce((s,v)=>s+v,0);
  const type = RESULT_TYPES.find(t=>total>=t.min && total<=t.max) || RESULT_TYPES[2];
  const scores = {
    '信念升級度': Math.min(100, 60 + (answers[9]||0)*10 + (answers[2]||0)*5),
    '情緒穩定度': Math.min(100, 55 + (answers[4]||0)*10 + (answers[0]||0)*5),
    '身份一致性': Math.min(100, 50 + (answers[5]||0)*10 + (answers[7]||0)*8),
    '人格成熟度': Math.min(100, 50 + (answers[11]||0)*12 + (answers[1]||0)*6),

    '複利潛能':   Math.min(100, 45 + (answers[10]||0)*12 + (answers[8]||0)*8),
  };
  const scoreHtml = Object.entries(scores).map(([k,v])=>
    `<div class="rscore"><div class="rv">${v}</div><div class="rl">${k}</div></div>`
  ).join('');
  document.getElementById('quiz-area').style.display='none';

    <div class="result-box">

      <div class="rec-title">🧭 AI 建議你的升級路徑</div>
      <div class="rec-card"><strong>優先模組：信念工程 ＋ 情緒工程</strong>從覺察限制性信念開始，配合情緒辨識系統，建立人格升級的雙引擎。</div>
      <div class="rec-card"><strong>黑科技配套：PS ＋ GABA ＋ Omega-3</strong>提供信念重建所需的神經可塑性支援，加速覺察與情緒穩定。</div>

  `;
}

function restartQuiz() {
  qIdx=0; answers={};
  document.getElementById('quiz-area').style.display='block';
  document.getElementById('quiz-result').style.display='none';

}

// ── Nutrients
function renderNutrients() {
  document.getElementById('nutrients-list').innerHTML = NUTRIENTS.map(n => `
    <div class="nutrient-card">
      <div class="nutrient-top">
        <div class="nutrient-icon">${n.icon}</div>

      </div>
      <div class="nutrient-tags">${n.tags.map(t=>`<span class="tag ${t}">${{brain:'大腦神經',stress:'壓力調節',energy:'細胞能量',neuro:'神經可塑性',hormone:'荷爾蒙'}[t]||t}</span>`).join('')}</div>
      <div class="mechanism-box"><strong>【作用機制】</strong> ${n.mechanism}</div>

    </div>
  `).join('');
}

// ── AI Coach
async function askCoach(suffix) {
  const input = document.getElementById('ai-input-'+suffix);
  const resp  = document.getElementById('ai-response-'+suffix);
  const text  = input.value.trim();
  if(!text) return;
  resp.classList.add('visible');
  resp.textContent = '🧠 AI 人格教練思考中…';
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: `你是「人格工程APP」的AI人格教練。你的角色是從系統論角度分析用戶的人格模式，給出精準、深刻、激勵的洞察。

核心框架：信念→預測→決策→行動→習慣→人格→命運
你要：1) 找出信念根源 2) 指出防衛機制或人生腳本 3) 給出升級路徑 4) 推薦1-2個對應的模組

語言風格：精簡有力、直指核心、充滿力量感。繁體中文。每段不超過3行。結尾給一句升級金句。

最後可以提示：搭配對應的黑科技營養素可以加速神經可塑性，支援人格升級。`,
        messages: [{role:'user', content: text}]
      })
    });
    const data = await r.json();
    const msg = data.content?.find(c=>c.type==='text')?.text || '請稍後再試';
    resp.textContent = msg;
  } catch(e) {
    resp.textContent = '⚠️ 連線異常，請稍後再試。\n\n人格工程提示：你的困境，就是你的升級素材。';
  }
}

renderHomeQuotes();

var P=[{"page": "人格診斷中心｜優勢 × 限制 × 防衛", "t": "你最大的優點，可能也是你最常卡住的地方", "tags": "#人格診斷 #優勢與限制 #防衛模式 #LifeOS", "s": ["她是團隊裡最負責的人，什麼事交給她都能放心。可是同樣的特質，也讓她很難把工作交出去：她總覺得別人做不好，最後所有事都攬在自己身上，累到半夜還在改別人的報告。年度考核時，主管寫下兩句話：「責任感極強。需要學習信任團隊。」她盯著那兩句話看了很久，才發現它們說的，其實是同一件事。", "如果優點只有好處，為什麼我們常常被自己的優點拖累？如果缺點只是缺點，為什麼有些缺點，背後藏著我們最在乎的東西？我們一直在努力發揚優點、改掉缺點，可是，有沒有想過，它們可能是同一棵樹上的兩根枝條？", "一個人的人格，可以從三個面向來看：優勢人格，是你最自然、最有力量的樣子；限制人格，是那些讓你一再卡住的模式；防衛模式，是你在感到威脅時，用來保護自己的方式。而在它們底下，是一組核心信念。很多時候，優勢用過了頭，就變成限制；限制被碰觸，就啟動防衛。", "只看優點的人說：「我就是很負責。」看見全貌的人說：「我很負責，所以我也容易放不下控制。」只看缺點的人說：「我太敏感了。」看見全貌的人說：「我很敏感，所以我也很能體貼別人。」一個把自己切成好與壞，一個看見自己是一個完整的系統。", "負責的人，要學會信任；體貼的人，要學會說不；有主見的人，要學會傾聽；謹慎的人，要學會冒一點險；樂觀的人，要學會看見風險；熱情的人，要學會留一點力氣給自己。每一個優點，都需要一個溫柔的煞車，才能走得長遠。", "我們以為成長是把缺點改掉，其實真正的成長，是讓優點不再過度。最深的翻轉是：你不必否定自己最強的那一面，你只需要知道它的邊界在哪裡。當你看懂了自己的優勢、限制和防衛怎麼連在一起，你就不再只是被性格推著走，而是能開始選擇，什麼時候用哪一面。", "這週，替自己寫一張小小的人格地圖：三個優勢、三個常卡住的地方、一個最常用的防衛方式。然後在每個優勢旁邊，寫下它用過頭時會變成什麼。第一次寫，你會覺得有點刺痛；第二次看，你開始理解自己為什麼會這樣；一個月後，當你又卡住時，你能很快地認出：哦，是我的那個優點，又用過頭了。", "刀刃越鋒利，越需要一個好的刀鞘，不是為了讓它不鋒利，而是讓它在需要的時候，才拿出來用。願你珍惜自己身上那些鋒利的優點；願你也替它們準備好一個溫柔的刀鞘；願你在認識完整的自己之後，活得更有力量，也更柔軟。"], "q": [["每一個優點，都需要一個溫柔的煞車。", "Every strength needs a gentle brake."], ["在每個優勢旁邊，寫下它用過頭時會變成什麼。", "Next to each strength, write what it becomes when overused."]]}, {"page": "人格生成系統｜10大模型全解析", "t": "人格不是天生的形狀，是一套一直在運轉的生成系統", "tags": "#人格生成 #信念情緒習慣身份 #世界觀 #LifeOS", "s": ["老同學聚會，大家說起十年前的他：那個怕生、上課從不舉手、被點名就臉紅的男孩。現在的他，卻是一家公司的業務主管，在台上侃侃而談。有人問他怎麼變的，他想了想說：「沒有哪一天突然變了。只是有一年，我開始逼自己每週跟一個陌生人說話，後來慢慢地，就不覺得自己是那個怕生的人了。」", "如果人格是天生的，為什麼有些人十年後，像是換了一個人？如果性格決定命運，那性格本身，又是被什麼決定的？我們總說「江山易改，本性難移」，可是，所謂的本性，真的是一塊不會變的石頭嗎？", "人格不是一個固定的形狀，而是一套持續運轉的生成系統。它至少由幾個模型組成：信念模型，決定你怎麼解讀世界；情緒模型，決定你怎麼感受與反應；習慣模型，決定你每天自動做什麼；身份模型，決定你認為自己是誰；世界觀模型，決定你看得多遠。當這些模型被更新，人格就會被重新生成。", "固定的人格觀說：「我天生就是這樣。」生成的人格觀說：「我是由很多正在運轉的模型組成的。」一個把性格當成判決書，一個把性格當成一份可以修改的程式；一個等待自己哪天自然變好，一個知道從哪一個模型開始動手；一個說本性難移，一個說本性，也是被一天一天練出來的。", "改一個信念，你看世界的眼光就不一樣；改一個情緒反應，你和人相處的方式就不一樣；改一個習慣，你每天的生活就不一樣；改一個身份，你對自己的期待就不一樣；改一個世界觀，你看見的可能性就不一樣。五個模型，五個入口，任何一個都可以是起點。", "我們以為改變人格需要一次很大的轉變，其實人格的改變，常常是很多個小模型，悄悄地一起更新。最深的翻轉是：你不需要變成另一個人，你只需要替自己的系統，一次換掉一個過時的零件。換得夠多，有一天回頭看，你會發現自己已經是一個新的版本了。", "這週，從五個模型裡挑一個最想更新的：信念、情緒、習慣、身份或世界觀。然後只設計一個小練習，每天做一次。像那個怕生的男孩，每週跟一個陌生人說一句話。第一週，你會很不習慣；第一個月，你發現沒有那麼難；一年後，別人看見的你，已經是一個你自己都會微笑的樣子。", "河床不是一天被刻出來的，是水日復一日流過，慢慢地沖出了形狀。人格也是。願你不再把自己的形狀當成永遠；願你選擇讓什麼樣的水，每天流過你的生命；願你在很多年後，看見那條被你自己溫柔沖刷出來的河，寬闊、清澈，而且一直在流動。"], "q": [["人格不是固定的形狀，而是一套一直在運轉的系統。", "Personality isn't a fixed shape; it's a system that keeps running."], ["從五個模型裡選一個，每天做一個小練習。", "Choose one of the five models and practice it a little each day."]]}, {"page": "信念工程｜升級你的預言系統", "t": "你的信念，是一個會自己實現的預言", "tags": "#信念工程 #豐盛信念 #自我實現預言 #LifeOS", "s": ["他一直相信「錢很難賺，有錢人都很壞」。所以每次有加薪的機會，他總是不好意思爭取；有朋友找他合作副業，他第一個念頭是「一定是想騙我」；看到別人的收入成長，他嘴上不屑，心裡卻很不是滋味。二十年過去，他的經濟狀況，剛好完全符合他的那句信念：錢，真的很難賺。", "如果信念只是想法，為什麼它會一步一步，變成我們真實的人生？如果我們心裡相信什麼就會發生什麼，那我們到底是在預測未來，還是在製造未來？我們每天活在自己的信念裡，可是我們有沒有檢查過，那些預言，是誰替我們寫下的？", "信念是你的預言系統。你相信什麼，就會注意到什麼；注意到什麼，就會怎麼行動；怎麼行動，就會得到什麼結果；而結果，又回頭證明你的信念是對的。這就是自我實現的預言。信念大致有四類值得檢查：限制性的信念、成長型的信念、豐盛的信念，以及關於價值的信念。", "限制性的信念說：「我不可能。」成長型的信念說：「我可以學。」匱乏的信念說：「機會很少，資源不夠，別人多一點我就少一點。」豐盛的信念說：「價值可以被創造，合作可以讓大家都更多。」一個讓人緊抓不放，一個讓人敢於分享；一個預言失敗，一個預言可能。", "「錢很難賺」可以升級成「錢是我創造價值後的回饋」；「好人沒好報」可以升級成「長期的善良需要搭配清楚的界線」；「我沒有天分」可以升級成「天分是被持續練習放大的」；「我太老了」可以升級成「我累積的經驗，是年輕時沒有的資產」。每一句新信念，都是一個新預言。", "我們以為信念是看見事實之後得出的結論，其實很多信念，是在我們還沒有能力判斷的時候，就被別人放進來的。最深的翻轉是：你不必等到看見證據才換信念，因為新的信念，會讓你開始看見原本看不見的證據。預言改了，未來就有機會跟著改。", "這週，寫下一個你關於金錢、關係或能力的核心信念，問三個問題：這句話是誰教我的？它這些年替我帶來了什麼結果？如果換一句更有可能性的話，會是什麼？然後每天替新信念找一個小證據。第一週，證據很少；第一個月，你開始注意到以前忽略的機會；半年後，你的人生，開始照著新的預言，慢慢展開。", "占卜的人說出預言，聽的人就照著那條路走，最後真的走到了預言的地方。可是如果握著筆的人，是你自己呢？願你拿回替自己寫預言的筆；願你寫下的每一句，都充滿可能；願你在很多年後，讀著自己的人生，發現那正是你曾經，勇敢預言過的樣子。"], "q": [["你的信念，是一個會自己實現的預言。", "Your beliefs are prophecies that fulfill themselves."], ["每天替新的信念，找一個小小的證據。", "Find one small piece of evidence for your new belief each day."]]}, {"page": "情緒工程｜辨識 × 管理 × 轉譯 × 修復", "t": "會管理情緒不稀奇，會修復情緒造成的傷，才是真本事", "tags": "#情緒工程 #情緒修復 #情緒轉譯 #LifeOS", "s": ["那天早上，她因為孩子拖拖拉拉，在出門前大吼了一聲：「你到底要我說幾次！」孩子嚇得哭著上車，一路沒說話。她在公司坐了一整天，心裡很難受，可是她告訴自己：情緒都已經發出去了，說什麼也來不及了。那天晚上，她沒有提起這件事，孩子也沒有。只是從那天起，孩子早上變得很安靜，安靜得讓她心疼。", "如果情緒已經失控了，是不是一切就來不及了？如果我們沒辦法每一次都控制好自己，那我們還能做什麼？我們花了很多力氣學習怎麼不生氣，可是，有沒有人教過我們，生氣之後，要怎麼把關係修回來？", "情緒工程有四個環節：辨識，是知道自己現在是什麼情緒；管理，是在情緒來時，不讓它直接變成傷人的行為；轉譯，是把情緒翻譯成需求，說出真正想說的話；修復，是在情緒造成傷害之後，主動回去修補關係。沒有人能每一次都管理好情緒，所以修復，是最被低估、卻最重要的能力。", "不會修復的人說：「都過去了，不要再提了。」會修復的人說：「早上我吼你，是我沒有處理好自己的著急，對不起。」一個讓傷口自己結痂，一個主動替傷口上藥；一個讓孩子學會壓抑，一個讓孩子學會，犯錯之後也可以被原諒、也可以修補；一個讓關係留下疤，一個讓關係變得更有韌性。", "辨識：「我現在很著急，也很生氣。」管理：「我先深呼吸，等一下再說。」轉譯：「我著急，是因為我很怕我們遲到，我需要你幫忙快一點。」修復：「剛剛我太大聲了，嚇到你了，對不起，我們下次一起想辦法早點出門好嗎？」四句話，就是一套完整的情緒工程。", "我們以為好的父母、好的伴侶，就是從不發脾氣；其實沒有人能做到從不失控。最深的翻轉是：讓關係更緊密的，不是從不受傷，而是受傷之後，有人願意回來修補。研究親子關係的人常說，關係的破裂和修復，本身就是信任長出來的過程。一句真誠的對不起，有時候比一百次完美的忍耐更有力量。", "這週，練習一次完整的修復：想一件最近你情緒失控、傷到人的事，主動回去說三件事：我看見我做了什麼；我當時真正的感受和需要是什麼；我很抱歉，下次我想怎麼做。第一次說，你會很尷尬；說完之後，你會發現對方的表情鬆了下來；慢慢地，你們之間的空氣，比以前更輕、更安全。", "瓷器碎了，日本有一種修補的方法，用金漆把裂縫填起來，修好的碗，反而比原來更美。願你不再害怕關係裡的裂縫；願你每一次失控之後，都有勇氣拿起那支金漆的筆；願你們的關係，在一次又一次溫柔的修補裡，閃閃發光。"], "q": [["讓關係更緊密的，不是從不受傷，而是受傷之後有人願意回來修補。", "What strengthens a bond isn't never getting hurt, but someone coming back to repair it."], ["主動回去說：我看見我做了什麼，我很抱歉。", "Go back and say: I see what I did, and I'm sorry."]]}, {"page": "習慣工程｜重複行為塑造人格", "t": "你每天重複做的事，正在悄悄決定你會成為誰", "tags": "#習慣工程 #微習慣 #觸發與獎勵 #LifeOS", "s": ["整理房子時，她在抽屜裡翻出一本十年前的日記，裡面寫滿了夢想：要學鋼琴、要去旅行、要寫一本書。她翻著翻著，有點想哭，十年過去，一件都沒有開始。可是她也發現另一件事：那十年裡，她每天睡前都會滑一個小時的手機，從來沒有中斷過。她忽然明白，不是她沒有毅力，而是她把毅力，全都用在了另一件事情上。", "如果我們都很想改變，為什麼每天做的，還是同樣的事？如果人格是由想法決定的，為什麼想了那麼多年，生活卻一點都沒變？我們總以為自己是誰，決定了我們做什麼；可是，有沒有可能，剛好相反？", "你每天重複做的事，會慢慢塑造你的人格。習慣由四個部分組成：微小的起點、行為的設計、觸發的提示，以及獎勵的系統。習慣的力量不在於某一次做得多好，而在於它不斷地重複，重複到不必思考，重複到成為你。你的人格，常常就是你所有習慣加總之後的樣子。", "靠決心的人說：「從明天起，我要每天練琴一小時。」靠設計的人說：「我先把琴放在客廳，每天吃完晚餐彈五分鐘。」一個用大目標嚇自己，一個用小起點騙過大腦；一個等心情好才開始，一個讓提示替自己開始；一個做完覺得是苦差事，一個做完給自己一個小小的獎勵。", "把起點縮小，小到不可能失敗；把提示放在看得見的地方，讓環境提醒你；把新習慣接在舊習慣後面，例如刷完牙就讀一頁書；把獎勵安排在行為之後，讓大腦記住這種好感覺；把壞習慣的門檻提高，讓它變得麻煩一點。設計對了，習慣就會自己長大。", "我們以為改變需要很強的意志力，其實改變更需要很好的設計。最深的翻轉是：你不是沒有毅力的人，你每天都在很有毅力地重複某些事；你要做的，只是把那份毅力，搬到你真正想要的地方。人格不是被下定的決心改變的，而是被每天的重複，一點一點雕刻的。", "這週，把一個夢想縮小成一個五分鐘的行為，並且把它接在一個你每天一定會做的事情後面。例如：每天倒完咖啡，就彈五分鐘琴；每天坐上捷運，就寫三行字。在月曆上，每做一次就打一個勾。第一週，你只打了五個勾；第一個月，二十五個；一年後，你翻開新的日記，寫下的不再是夢想，而是你已經做到的事。", "一滴水的力量很小，可是日日夜夜落在同一塊石頭上，就能滴出一個洞。願你選擇讓什麼樣的水滴，每天落在你的生命裡；願你每一天都替那個想成為的自己，多滴一滴；願你在很多年後回頭，看見那塊石頭上，刻著你親手完成的夢想。"], "q": [["人格不是被決心改變的，而是被每天的重複雕刻出來的。", "Personality isn't changed by resolutions; it's carved by daily repetition."], ["把一個夢想縮小成五分鐘，接在每天必做的事後面。", "Shrink a dream to five minutes and attach it to something you do every day."]]}, {"page": "身份工程｜先成為，再做到", "t": "不是做到了才變成那種人，而是先成為那種人，才會做到", "tags": "#身份工程 #先成為再做到 #身份與行為 #LifeOS", "s": ["兩個人都想戒菸。有人遞菸給他們，第一個人說：「不用了，我正在戒菸。」第二個人說：「不用了，我不抽菸。」兩句話只差幾個字，可是一年後，第一個人已經破戒了好幾次，第二個人則再也沒有碰過。第一個人一直在跟菸對抗，第二個人，早就不覺得那是屬於自己的東西了。", "如果改變是靠一次一次地忍住，為什麼忍得越久的人，越容易在某一天崩潰？如果行為改變了，人就會改變，為什麼很多人改了行為，最後還是回到原點？我們一直在努力「做到」，可是，有沒有想過，我們其實還沒有「成為」？", "身份工程的核心是：先成為，再做到。人格的生成有一條鏈：我是誰，決定我相信什麼；我相信什麼，決定我想成為誰；我想成為誰，決定我的行為；行為累積成結果，結果又回頭強化我是誰。當身份改變，行為就不再需要靠意志力撐著，因為那只是「像我會做的事」。", "從行為開始的人說：「我要努力不遲到。」從身份開始的人說：「我是一個尊重別人時間的人。」一個每次都在掙扎，一個每次都在確認自己是誰；一個把失誤當成失敗，一個把失誤當成「這不像我，下次調整」；一個靠目標驅動，一個靠身份引導。", "想運動，先成為一個重視身體的人；想閱讀，先成為一個好奇的人；想理財，先成為一個對自己未來負責的人；想好好說話，先成為一個尊重別人的人；想成為好父母，先成為一個願意持續學習的人。每一個「想做到」，背後都需要一個「我是」。", "我們以為要先有證據，才能相信自己是那樣的人；其實是先選擇相信，再用一個個小行動，去替它收集證據。最深的翻轉是：你不需要等到變好了，才有資格說自己是那樣的人。你今天就可以選擇，然後讓今天的一個小行動，成為第一份證據。", "這週，寫下一句「我是一個……的人」，選一個你真正想成為的身份。每天做一個完全符合這個身份的小行動，做完之後在心裡說一句：「這就是我會做的事。」第一週，你會覺得自己在演戲；第一個月，你開始覺得自然；半年後，別人問你怎麼做到的，你會說：沒什麼，這就是我。", "一顆種子不會因為還沒開花，就懷疑自己不是一朵花。它只是每天往下扎根、往上生長，因為它知道自己是什麼。願你也知道自己想成為什麼；願你每天都用一點點的行動，替那個身份澆水；願你在某一個早晨醒來，發現自己已經，開成了那朵你一直相信的花。"], "q": [["先成為那種人，才會做到那種事。", "Become that person first, and the actions will follow."], ["每天做一件小事，然後說：「這就是我會做的事。」", "Do one small thing daily, then say: \"This is what I do.\""]]}, {"page": "價值觀工程｜決策的演算法", "t": "你說最重要的是家人，可是你的行事曆，說的是另一回事", "tags": "#價值觀 #人生排序 #時間就是答案 #LifeOS", "s": ["每次有人問他人生最重要的是什麼，他都毫不猶豫地說：「家人。」可是那天，他打開手機裡的行事曆，從頭看到尾：一整個月，三十場會議、八次應酬、四次出差，和家人一起吃晚餐，只有兩次。他坐在辦公室裡，久久沒有說話。他一直以為自己很清楚什麼最重要，原來他說的價值觀，和他活出來的價值觀，是兩回事。", "如果我們都知道什麼最重要，為什麼我們的時間，總是花在別的地方？如果價值觀是我們心裡的信念，為什麼它在每一個需要選擇的時刻，總是輸給眼前的急事？我們說出口的價值觀，和我們真正用來做決定的，真的是同一套嗎？", "價值觀是決策的演算法。它表現在三種排序裡：人生排序，你認為什麼最重要；選擇排序，當兩件事衝突時，你選了哪一個；時間排序，你實際把時間花在哪裡。真實的價值觀，不是你說了什麼，而是你在選擇與時間裡，反覆做出的排序。時間，是價值觀最誠實的證人。", "說出來的價值觀說：「健康最重要。」活出來的價值觀說：「這個月我睡了幾個小時？」說出來的價值觀說：「我很重視朋友。」活出來的價值觀說：「我上一次主動聯絡朋友是什麼時候？」一個是心裡的願望，一個是生活的事實；一個讓人安心，一個讓人清醒。", "把行事曆拿出來看一次，看你的時間說了什麼；把最近三次重要的決定拿出來想一次，看你最後選了什麼；把讓你最後悔的事拿出來想一次，看你犧牲了什麼；把讓你最驕傲的事拿出來想一次，看你守住了什麼。答案，都已經寫在你的生活裡。", "我們以為價值觀是要想清楚的東西，其實價值觀更是要活出來的東西。最深的翻轉是：當你發現說出來的和活出來的不一樣時，不必責怪自己，那正是一個重新排序的機會。你不必一次改變全部，只要在下一次選擇的時候，讓真正重要的那件事，排在前面一次。", "這週，做一次價值觀審計：先寫下你心中最重要的三件事，再看看過去一週，你在這三件事上各花了多少時間。如果差距很大，就只做一個小調整：每週替最重要的那件事，固定保留一個時段，像會議一樣寫進行事曆。第一週，你會覺得很難擠出時間；第一個月，你開始習慣；半年後，你的行事曆和你的心，終於說著同一種語言。", "羅盤指著北方，可是如果你每天都往南走，再準確的羅盤，也帶不了你回家。願你常常停下來，看看自己的腳步和羅盤，是不是同一個方向；願你在每一次選擇的時候，都記得什麼最重要；願你的時間，最後都花在那些，你真正捨不得錯過的人和事上。"], "q": [["時間，是價值觀最誠實的證人。", "Time is the most honest witness of your values."], ["替最重要的那件事，每週固定保留一個時段。", "Reserve a fixed slot each week for what matters most."]]}, {"page": "依附工程｜關係模式重建", "t": "你在愛裡的樣子，常常是你小時候學會被愛的方式", "tags": "#依附模式 #安全型依附 #關係重建 #LifeOS", "s": ["每一段感情，她都很快就投入，也很快就不安。對方晚回訊息，她就胡思亂想；對方想要一點自己的時間，她就覺得被拋棄。她的男友正好相反：只要關係變得太親密，他就想逃，忙工作、玩手機、找理由不見面。兩個人都很愛對方，可是一個越追，一個越躲。後來他們才知道，自己在愛裡的樣子，都是很久以前學會的。", "如果我們長大了，為什麼在愛裡，還是會像個害怕被丟下的孩子？如果我們真的想靠近，為什麼一靠近，身體就想逃？我們在關係裡反覆出現的焦慮與距離，到底是因為眼前這個人，還是因為心裡那個很早以前，就已經寫好的劇本？", "依附模式，是我們早年在照顧關係中，學會的「怎麼和重要的人連結」的方式。常見的描述有四種：安全型，能親近，也能獨立；焦慮型，很渴望親近，也很怕被拋棄；逃避型，習慣保持距離，靠近時會不自在；混亂型，既渴望又害怕，常在靠近與推開之間擺盪。依附模式不是標籤，也不是判決，它可以在安全的關係裡，慢慢被重建。", "焦慮的依附說：「你是不是不愛我了？」安全的依附說：「我有點不安，你可以陪我一下嗎？」逃避的依附說：「我需要空間，你不要管我。」安全的依附說：「我需要一點時間整理自己，晚一點我會回來找你。」一個用猜測和距離保護自己，一個用說清楚來靠近彼此。", "焦慮的人，可以練習在不安時先安撫自己，再說出需要；逃避的人，可以練習在想逃時，先說一句「我需要休息一下，但我不是要離開」；混亂的人，可以找一段穩定的關係或專業的陪伴，慢慢學會信任；每一個人，都可以練習讓自己成為一個比較安全的對象。", "我們以為要找到一個完美的人，才能得到安全的愛；其實安全感，很多時候是兩個人一起練習出來的。最深的翻轉是：你小時候學會的愛的方式，不必是你一輩子的方式。當你遇到一個願意穩定回應你的人，或者你自己學會穩定地回應自己，那份古老的恐懼，就會一點點地被新的經驗改寫。", "這週，觀察自己在關係裡最常出現的反應：是追、是躲，還是又追又躲？下一次這個反應出現時，試著說出它，而不是做出它。例如：「我現在有點不安，想確認你還在不在乎我。」或者：「我現在有點想逃，但我想試著留下來。」第一次說，你會很緊張；說多了，你會發現，原來被好好回應的感覺，可以這麼安心。如果早年的傷痕很深，也很值得找專業的人陪你一起整理。", "一棵在強風裡長大的樹，枝幹會向一邊傾斜；可是移到一個有陽光、有支撐的地方，它也會慢慢地，往上長直。願你知道，自己的傾斜不是錯，那是你曾經努力活下來的痕跡；願你遇見讓你安心的陽光，也學會成為別人的支撐；願你在愛裡，終於可以既靠近，又自由。"], "q": [["你小時候學會的愛的方式，不必是你一輩子的方式。", "The way you learned to love as a child doesn't have to be the way you love forever."], ["下次想追或想逃時，先說出它，而不是做出它。", "Next time you want to chase or run, say it instead of doing it."]]}, {"page": "防衛機制工程｜找出人格盲區", "t": "你保護得最用力的地方，往往是你最需要被看見的地方", "tags": "#防衛機制 #合理化投射否認 #人格盲區 #LifeOS", "s": ["每次被指出問題，他都有很好的理由：時間不夠、資料不全、別人沒配合、環境太差。他的理由都很合理，每一個聽起來都說得通。可是三年下來，他的同事都升遷了，他還在原地。有一天，一位老朋友對他說：「你知道嗎？你從來沒有說過一次『是我沒做好』。」他想反駁，卻突然發現，自己腦中已經準備好了下一個理由。", "如果我們的理由都很合理，為什麼人生還是一直卡在同一個地方？如果我們看得清楚別人的問題，為什麼總是看不清自己的？我們用來保護自己的那些方法，到底是在保護我們，還是在擋住我們，不讓我們看見真正需要改變的地方？", "防衛機制，是心理在感到威脅時，自動啟動的保護方式。常見的有五種：合理化，替自己的行為找一個好聽的理由；投射，把自己不想承認的感受，看成是別人的；否認，假裝問題不存在；逃避，離開讓人不舒服的情境；補償，在別的地方用力，掩蓋內心的不足。防衛本身不是壞事，它曾經保護過我們；可是用得太久，它就成了人格的盲區。", "被防衛控制的人說：「這不是我的問題。」看見防衛的人說：「我注意到，我又在找理由了。」一個把批評全部擋在外面，一個讓一點點回饋進來；一個說「他就是嫉妒我」，一個問「我是不是也有一點這樣的感覺」；一個假裝沒事，一個承認自己也會害怕。", "當你急著解釋，停下來問：我在保護什麼？當你看別人特別不順眼，停下來問：他身上有沒有我不想承認的自己？當你說「沒事」，停下來問：我是不是不想面對？當你很想逃開，停下來問：我在害怕什麼？當你在某件事上特別用力，停下來問：我在補償什麼？", "我們以為防衛讓我們更堅強，其實防衛常常讓我們更孤單，因為它擋住了傷害，也擋住了幫助。最深的翻轉是：你最需要被看見的，往往就藏在你最用力保護的地方。當你願意放下一點點防衛，你不會因此變得脆弱，你只是終於讓真實的自己，有機會被理解。", "這週，選一個你最常用的防衛方式，當它出現時，不急著阻止它，只是在心裡說一句：「我看見你了。」然後問自己，它想保護什麼。第一次，你可能要事後才發現；第五次，你在當下就發現了；一個月後，你開始能在防衛之後，補上一句「不過，我也有需要改進的地方」。那一句話，會替你打開很多扇門。", "城牆能擋住敵人，也能擋住春天。牆築得越高，城裡的人越安全，卻也越看不見外面的花開了。願你謝謝那些曾經保護過你的城牆；願你有勇氣，在牆上開一扇窗；願你從那扇窗看出去，發現外面的世界，其實比你想像的，更溫柔一些。"], "q": [["你最需要被看見的，往往藏在你最用力保護的地方。", "What most needs to be seen often hides where you guard hardest."], ["防衛出現時，在心裡說一句：「我看見你了。」", "When your defenses rise, say inside: \"I see you.\""]]}, {"page": "人生腳本工程｜重寫你的劇本", "t": "你一直在演同一個角色，因為從來沒有人告訴你，劇本可以改", "tags": "#人生腳本 #受害者拯救者英雄 #成長者 #LifeOS", "s": ["她是家裡的老大，從小就是那個照顧所有人的人：替爸媽調解吵架，替弟妹收拾殘局。長大後，她在公司是那個替所有人善後的人，在感情裡總是愛上需要被拯救的人。她累得要命，卻停不下來，因為只要有人需要幫忙，她就覺得自己有價值。直到有一天她生病了，躺在床上，她第一次問自己：如果我不再拯救任何人，我還是誰？", "如果我們的人生是自己選的，為什麼總是遇到同樣的人，演出同樣的戲？如果我們想改變，為什麼一回到熟悉的場景，就又自動穿上了那套戲服？我們以為那是命運的安排，可是，會不會只是一份我們很早就背熟了，卻從來沒有重新讀過的劇本？", "人生腳本，是我們很早就在心裡寫下的，關於「我是誰、別人是誰、人生會怎樣」的故事。常見的有幾種：受害者劇本，覺得自己總是被傷害、無能為力；拯救者劇本，靠照顧別人來證明自己的價值；英雄劇本，覺得一切都要靠自己扛；成長者劇本，則是在每一次經歷裡學習，讓自己和別人都慢慢變好。", "受害者的台詞是：「為什麼總是我？」拯救者的台詞是：「沒有我不行。」英雄的台詞是：「我一個人就可以。」成長者的台詞是：「這次我學到了什麼？下一步我要怎麼做？」前三種劇本都很辛苦，因為它們讓人困在一個固定的角色裡；成長者的劇本，則讓人可以自由地，在不同的場景裡選擇不同的自己。", "受害者可以練習問：「這裡面，有哪一部分是我可以選擇的？」拯救者可以練習問：「這是我的責任，還是他的？」英雄可以練習問：「我可以請誰幫忙？」每個人都可以練習問：「如果這是一部電影，我希望主角接下來怎麼做？」每一個問題，都是在替劇本，加上一行新的台詞。", "我們以為演好自己的角色，就是盡責；其實很多時候，我們只是演得太熟練，熟練到忘了自己還能換角色。最深的翻轉是：你不必拯救所有人，也不必一直當受害者，更不必一個人扛起全世界。你可以把舊劇本輕輕放下，拿起筆，替自己寫一個，可以被幫助、也可以去幫助，可以跌倒、也可以成長的新故事。", "這週，想一想你在家裡、工作和感情裡，最常演的角色是哪一個。然後選一個熟悉的場景，試著演一句不一樣的台詞。像那位總是拯救別人的大姐，第一次對同事說：「這件事你可以自己處理，有需要再找我。」第一次說，你的心會跳得很快；第三次，你發現大家都還好好的；慢慢地，你的人生，開始出現了新的劇情。", "舞台上的燈光會換，佈景會換，連對手演員都會換，唯一可以決定主角下一句台詞的，是你自己。願你不再被舊的劇本困住；願你有勇氣，在下一幕裡說出一句新的話；願你的人生故事，從此不只是重演，而是一部一直在長出新章節的成長之書。"], "q": [["你不必拯救所有人，也不必一個人扛起全世界。", "You don't have to save everyone or carry the whole world alone."], ["在熟悉的場景裡，試著說一句新的台詞。", "In a familiar scene, try saying one new line."]]}, {"page": "人格重建工程｜更新人生作業系統", "t": "舊人格不是被打敗的，是被一次次的覺察，溫柔地更新掉的", "tags": "#人格重建 #覺察誤差修正 #更新作業系統 #LifeOS", "s": ["四十歲那年，他經歷了一場很大的失敗：事業垮了，婚姻也出現了裂痕。他第一次被迫停下來，看看自己。他發現，過去二十年，他一直用同一套方式在生活：不服輸、硬撐、不求助、不認錯。這套方式曾經讓他成功，如今也讓他失去了很多。他問一位前輩：「我是不是要變成另一個人？」前輩說：「不用，你只要更新。」", "如果過去的自己讓我們走到了這裡，為什麼它沒辦法帶我們走向下一段？如果人格要改變，是不是代表我們要否定過去的一切？我們害怕改變，是因為改變太難，還是因為我們以為，改變就等於承認過去的自己是錯的？", "人格重建，是一套更新人生作業系統的流程：舊人格，是過去有效的運作方式；覺察，是看見它現在帶來的結果；誤差，是發現它和現實之間的落差；修正，是嘗試新的回應方式；更新，是讓新的方式穩定下來；最後，形成新人格。舊人格不必被打敗，它只需要被感謝，然後被更新。", "拒絕更新的人說：「我以前這樣做都沒問題。」願意更新的人說：「以前有效，不代表現在還有效。」一個把失敗當成世界的錯，一個把失敗當成系統的誤差報告；一個在舊版本裡越來越卡，一個安裝新的版本，讓自己重新順暢；一個害怕改變會失去自己，一個知道更新之後，自己會更完整。", "從舊人格，到覺察：看見自己一直在用什麼方式活著；從覺察，到誤差：承認這個方式現在讓我付出了什麼；從誤差，到修正：試一次不一樣的反應；從修正，到更新：重複到它變得自然；從更新，到新人格：有一天，你發現自己已經不需要提醒，就這樣活著了。", "我們以為改變人格，是要和過去的自己決裂；其實真正的重建，是帶著過去的自己一起前進。最深的翻轉是：那個硬撐、不服輸的你，曾經保護你走過最艱難的路；現在你不必丟掉他，只需要告訴他：謝謝你，接下來，我想試試看另一種方式。更新不是背叛過去，而是讓過去的努力，有了新的出口。", "這週，選一個過去對你很有幫助、現在卻讓你很累的模式，走一次小小的更新流程：寫下它曾經幫你什麼，現在讓你付出什麼代價，然後設計一個新的小反應，在下一次機會時試一試。第一次，你會很不習慣；第十次，新的反應變得順手；半年後，你回頭看，會發現自己雖然還是自己，卻是一個更新得很好的版本。", "蛇每長大一次，就要蛻一次皮。蛻皮的時候很辛苦，舊皮很緊，新皮很嫩，可是不蛻，牠就長不大。願你在每一次被卡住的時候，都明白那可能是一次蛻皮的開始；願你溫柔地脫下那層已經太緊的舊皮；願你在新的自己裡，自在地伸展，繼續長大。"], "q": [["更新不是背叛過去，而是讓過去的努力有了新的出口。", "Renewal isn't betraying your past; it gives your past efforts a new way out."], ["謝謝那個舊模式，然後設計一個新的小反應。", "Thank the old pattern, then design one small new response."]]}, {"page": "人格複利工程｜每天1%×365天", "t": "每天進步1%，一年後是37倍；每天退步1%，一年後只剩一點點", "tags": "#複利 #每天1% #閱讀信念習慣健康 #LifeOS", "s": ["兩個大學同學，畢業時差不多。一個人每天下班後讀二十頁書，週末去爬山，每個月學一個新技能，沒有一天是驚天動地的；另一個人覺得反正還年輕，下班就追劇，週末就補眠。五年後再見面，兩個人都說不出對方哪一天突然改變了，可是他們之間的距離，已經大到像是活在兩個不同的世界。", "如果每天的差別那麼小，為什麼幾年後的差距會那麼大？如果一天不讀書、不運動好像也沒什麼，為什麼一年、五年、十年之後，代價卻那麼明顯？我們總是低估每天一點點的力量，可是，人生到底是被那些大事件決定的，還是被每天那些看不見的小選擇決定的？", "複利，是人生最安靜也最強大的力量。如果每天進步百分之一，一年後大約是原來的三十七倍；如果每天退步百分之一，一年後只剩下原來的百分之三左右。人格也有複利：閱讀的複利、信念的複利、習慣的複利、健康的複利，甚至財富的複利。每一個複利，都從一個很小、很容易被忽略的每天開始。", "追求爆發的人說：「我要一次改變很多。」相信複利的人說：「我每天只要好一點點。」一個在一開始就用盡力氣，一個在一開始就準備走很遠；一個在第三週放棄，一個在第三年收穫；一個看不起百分之一，一個知道百分之一乘上時間，就是奇蹟。", "每天讀十頁書，一年就是好幾本書；每天替一個舊信念找一個反例，一年就換了一副眼光；每天做一個好習慣，一年就養成一種新的性格；每天走三十分鐘，一年後身體會謝謝你；每天存下一點點，十年後會替你撐起一份選擇權。複利不在於多，而在於不中斷。", "我們以為改變人生需要一個轉捩點，其實大部分的轉捩點，都是很多個平凡日子累積起來的。最深的翻轉是：複利最可怕的地方，不是它的威力，而是它在前期幾乎看不見任何成果，所以大多數人，都在它開始發揮作用之前就放棄了。能走到後面的人，不是最有天分的人，而是最能忍受「還看不到結果」的人。", "這週，選一個你想讓它產生複利的領域：閱讀、信念、習慣、健康或財富，替它設計一個每天只需要十分鐘的動作，並且承諾自己，先做一百天，中間不評估成果。第一個月，你會覺得沒什麼變化；第二個月，你開始注意到一點點不同；一百天後，你會驚訝地發現，那一點點，已經悄悄地長成了一大片。", "竹子種下的前幾年，地面上幾乎看不見它長高，可是它的根，一直在地底下默默地延伸；等到根夠深了，它可以在很短的時間裡，長得又高又直。願你不因為看不見成果就停下來；願你每天都替自己的根，多往下扎一點；願你在某一個季節，看見自己長成一片，誰也擋不住的竹林。"], "q": [["能走到後面的人，是最能忍受「還看不到結果」的人。", "Those who go the distance are those who can bear \"no results yet.\""], ["替一個領域設計每天十分鐘的動作，先做一百天。", "Design a ten-minute daily action for one area, and keep it for a hundred days."]]}];
var cur=0,hide=false;
function g(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var QL=[['心靈雞湯｜Soul Soup',''],['激勵｜Motivation','act']];
function qtext(p){return p.q?'\n\n'+p.q.map(function(x,k){return '【'+QL[k][0]+'】\n'+x[0]+'\n'+x[1]}).join('\n\n'):''}
function qhtml(p){return p.q?'<div class="lfb-qs">'+p.q.map(function(x,k){return '<div class="lfb-q '+QL[k][1]+'"><small>'+QL[k][0]+'</small><b>'+esc(x[0])+'</b><i lang="en">'+esc(x[1])+'</i></div>'}).join('')+'</div>':''}
function text(p){return '【'+p.t+'】\n\n'+p.s.join('\n\n')+qtext(p)+'\n\n'+p.tags}
function list(){
  var q=g('lfbQ').value.trim().toLowerCase();
  g('lfbList').innerHTML=P.map(function(p,i){
    if(q&&(p.page+' '+text(p)).toLowerCase().indexOf(q)<0)return '';
    return '<button type="button" data-i="'+i+'" class="'+(i===cur?'cur':'')+'"><small>第 '+(i+1)+' 頁｜'+esc(p.page)+'</small>'+esc(p.t)+'</button>';
  }).join('')||'<p style="padding:8px;font-size:14px">沒有符合的圖文</p>';
}
function show(i){
  cur=i;var p=P[i];
  g('lfbPost').innerHTML='<div class="lfb-eye">第 '+(i+1)+' / '+P.length+' 頁｜'+esc(p.page)+'</div><h2>'+esc(p.t)+'</h2><div class="lfb-meta">約 '+p.s.join('').replace(/\s/g,'').length+' 字 · 八種手法 · 文中情境為示例</div><div id="lfbBody" class="'+(hide?'notag':'')+'">'+p.s.map(function(x,k){return '<div class="lfb-part"><span class="lfb-tag">'+TAG[k]+'</span><p>'+esc(x)+'</p></div>'}).join('')+'</div>'+qhtml(p)+'<div class="lfb-tags">'+esc(p.tags)+'</div><div class="lfb-act"><button type="button" class="pri" id="lfbCopy">複製貼文</button><button type="button" id="lfbHide">'+(hide?'顯示':'隱藏')+'手法標籤</button><span class="lfb-st" id="lfbSt" role="status"></span></div>';
  g('lfbPost').scrollTop=0;list();
}
function copy(){
  var t=text(P[cur]),st=g('lfbSt');
  function fall(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();st.textContent=ok?'已複製，可直接貼到臉書。':'無法自動複製，請手動選取內文。'}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){st.textContent='已複製，可直接貼到臉書。'},fall)}else fall();
}
g('lfbOpen').onclick=function(){g('lfb').classList.add('on');show(cur);g('lfbQ').focus()};
g('lfbClose').onclick=function(){g('lfb').classList.remove('on');g('lfbOpen').focus()};
g('lfb').addEventListener('click',function(e){
  if(e.target===g('lfb'))g('lfbClose').onclick();
  var b=e.target.closest&&e.target.closest('[data-i]');if(b)show(+b.getAttribute('data-i'));
  if(e.target.id==='lfbCopy')copy();
  if(e.target.id==='lfbHide'){hide=!hide;show(cur)}
});
g('lfbQ').addEventListener('input',list);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&g('lfb').classList.contains('on'))g('lfbClose').onclick()});
})();
</script>
