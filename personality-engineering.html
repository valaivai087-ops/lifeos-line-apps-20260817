<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人格工程 APP — Personality Operating System</title>
<style>
  :root {
    --bg: #FFFFFF;
    --bg-soft: #F8F9FF;
    --bg-card: #FFFFFF;
    --navy: #0D1B3E;
    --teal: #006B7D;
    --gold: #B8860B;
    --gold-light: #E8A020;
    --accent: #E83E3E;
    --text: #1A1A2E;
    --text-mid: #3A3A5C;
    --text-soft: #6B6B8A;
    --border: #E8EAF6;
    --pill: #EEF2FF;
    --shadow: 0 2px 16px rgba(13,27,62,0.08);
    --shadow-hover: 0 6px 28px rgba(13,27,62,0.16);
    --radius: 16px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-soft);
    color: var(--text);
    font-family: 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif;
    font-size: 17px;
    line-height: 1.7;
    min-height: 100vh;
  }

  /* ── TOP NAV ── */
  .topnav {
    background: var(--bg);
    border-bottom: 2px solid var(--border);
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 6px;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(13,27,62,0.06);
  }
  .topnav-logo { font-size: 20px; font-weight: 900; color: var(--navy); letter-spacing: -0.5px; flex: 1; }
  .topnav-logo span { color: var(--gold-light); }
  .topnav-tab {
    padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: 700;
    cursor: pointer; border: none; background: transparent; color: var(--text-soft);
    transition: all 0.2s;
  }
  .topnav-tab.active { background: var(--navy); color: #fff; }
  .topnav-tab:hover:not(.active) { background: var(--pill); color: var(--navy); }

  /* ── SCREENS ── */
  .screen { display: none; padding: 20px; max-width: 480px; margin: 0 auto; }
  .screen.active { display: block; }

  /* ── HERO SCORES ── */
  .hero {
    background: linear-gradient(135deg, var(--navy) 0%, #1a3a6e 100%);
    border-radius: var(--radius);
    padding: 24px 20px;
    color: #fff;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '🧠';
    position: absolute; right: 16px; top: 16px;
    font-size: 60px; opacity: 0.15;
  }
  .hero-title { font-size: 13px; font-weight: 700; letter-spacing: 2px; opacity: 0.7; margin-bottom: 4px; }
  .hero-name { font-size: 24px; font-weight: 900; margin-bottom: 16px; }
  .score-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .score-box { background: rgba(255,255,255,0.1); border-radius: var(--radius-sm); padding: 10px 8px; text-align: center; }
  .score-box .val { font-size: 26px; font-weight: 900; color: #FFD700; line-height: 1; }
  .score-box .lbl { font-size: 11px; opacity: 0.85; margin-top: 3px; line-height: 1.3; }
  .score-box.main { background: rgba(232,160,32,0.25); border: 1px solid rgba(232,160,32,0.4); }
  .hero-btn {
    display: block; width: 100%; margin-top: 16px; padding: 12px;
    background: linear-gradient(90deg, #E8A020, #FFD700);
    color: var(--navy); font-weight: 900; font-size: 16px;
    border: none; border-radius: var(--radius-sm); cursor: pointer;
    letter-spacing: 0.5px;
  }

  /* ── MODULE CARDS ── */
  .section-title {
    font-size: 18px; font-weight: 900; color: var(--navy);
    margin: 20px 0 12px; display: flex; align-items: center; gap: 8px;
  }
  .section-title::after {
    content: ''; flex: 1; height: 2px;
    background: linear-gradient(90deg, var(--gold-light), transparent);
  }

  .mod-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
  .mod-card {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 16px 14px;
    cursor: pointer;
    box-shadow: var(--shadow);
    border: 1.5px solid transparent;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .mod-card:hover, .mod-card.active {
    border-color: var(--gold-light);
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px);
  }
  .mod-card .icon { font-size: 28px; margin-bottom: 8px; }
  .mod-card .mod-name { font-size: 15px; font-weight: 900; color: var(--navy); }
  .mod-card .mod-sub { font-size: 12px; color: var(--text-soft); margin-top: 3px; }
  .mod-card .mod-num {
    position: absolute; top: 10px; right: 12px;
    font-size: 11px; font-weight: 700; color: var(--gold-light);
    background: #FFF8E7; padding: 2px 6px; border-radius: 20px;
  }

  /* ── MODULE DETAIL ── */
  .mod-detail {
    background: var(--bg-card); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .mod-detail-head {
    display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px;
    padding-bottom: 14px; border-bottom: 2px solid var(--border);
  }
  .mod-detail-icon { font-size: 40px; flex-shrink: 0; }
  .mod-detail-title { font-size: 20px; font-weight: 900; color: var(--navy); }
  .mod-detail-desc { font-size: 14px; color: var(--text-soft); margin-top: 4px; }

  .formula-chain {
    background: var(--bg-soft); border-radius: var(--radius-sm);
    padding: 14px; margin: 12px 0;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .formula-item {
    background: var(--bg-card); border: 1.5px solid var(--border);
    border-radius: 8px; padding: 7px 20px; font-weight: 700; font-size: 15px;
    color: var(--navy); min-width: 120px; text-align: center;
  }
  .formula-arrow { font-size: 16px; color: var(--gold-light); font-weight: 900; }

  /* ── QUOTES ── */
  .quotes-list { display: flex; flex-direction: column; gap: 10px; }
  .quote-card {
    background: var(--bg-card);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    box-shadow: 0 1px 8px rgba(13,27,62,0.06);
    border-left: 4px solid var(--gold-light);
    font-size: 16px; font-weight: 700; color: var(--navy);
    line-height: 1.6;
  }
  .quote-card .q-num { font-size: 11px; color: var(--text-soft); font-weight: 400; margin-bottom: 4px; }

  /* ── NUTRIENTS ── */
  .nutrient-card {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 18px 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    border-top: 4px solid var(--teal);
  }
  .nutrient-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .nutrient-icon { font-size: 28px; }
  .nutrient-name { font-size: 17px; font-weight: 900; color: var(--navy); }
  .nutrient-eng { font-size: 12px; color: var(--text-soft); margin-top: 2px; }
  .nutrient-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .tag {
    font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 20px;
    background: var(--pill); color: var(--navy);
  }
  .tag.brain { background: #EEF0FF; color: #3730A3; }
  .tag.stress { background: #FFF7ED; color: #C2410C; }
  .tag.energy { background: #ECFDF5; color: #065F46; }
  .tag.neuro { background: #F5F3FF; color: #6D28D9; }
  .tag.hormone { background: #FFF1F2; color: #BE123C; }
  .mechanism-box {
    background: var(--bg-soft); border-radius: var(--radius-sm);
    padding: 12px 14px; font-size: 14px; color: var(--text-mid);
    line-height: 1.75; margin-bottom: 10px;
  }
  .mechanism-box strong { color: var(--teal); }
  .effect-list { list-style: none; }
  .effect-list li {
    font-size: 14px; color: var(--text-mid); padding: 4px 0;
    display: flex; align-items: flex-start; gap: 6px;
  }
  .effect-list li::before { content: '✅'; font-size: 13px; flex-shrink: 0; margin-top: 2px; }
  .buy-btn {
    display: block; width: 100%; margin-top: 12px;
    padding: 11px 16px;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    color: #fff; font-weight: 900; font-size: 15px;
    border: none; border-radius: var(--radius-sm);
    cursor: pointer; text-align: center; text-decoration: none;
    letter-spacing: 0.3px; box-shadow: 0 2px 8px rgba(184,134,11,0.3);
  }
  .buy-btn:hover { filter: brightness(1.08); }

  /* ── DIAGNOSIS ── */
  .quiz-card {
    background: var(--bg-card); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .quiz-progress { margin-bottom: 16px; }
  .progress-bar-bg {
    background: var(--border); border-radius: 20px; height: 8px; overflow: hidden;
  }
  .progress-bar { background: linear-gradient(90deg, var(--teal), var(--gold-light)); height: 100%; border-radius: 20px; transition: width 0.4s; }
  .progress-label { font-size: 13px; color: var(--text-soft); margin-top: 5px; }
  .q-text { font-size: 17px; font-weight: 700; color: var(--navy); margin-bottom: 16px; line-height: 1.5; }
  .q-options { display: flex; flex-direction: column; gap: 8px; }
  .q-opt {
    padding: 13px 16px; border-radius: var(--radius-sm);
    border: 2px solid var(--border); background: var(--bg-card);
    font-size: 15px; color: var(--text); cursor: pointer;
    transition: all 0.18s; font-weight: 600; text-align: left;
  }
  .q-opt:hover { border-color: var(--gold-light); background: #FFFBEF; }
  .q-opt.selected { border-color: var(--navy); background: var(--navy); color: #fff; }
  .q-nav { display: flex; gap: 10px; margin-top: 16px; }
  .q-btn {
    flex: 1; padding: 12px; border-radius: var(--radius-sm);
    font-size: 15px; font-weight: 700; cursor: pointer; border: none;
  }
  .q-btn.prev { background: var(--border); color: var(--text-mid); }
  .q-btn.next { background: var(--navy); color: #fff; }
  .q-btn:disabled { opacity: 0.4; cursor: default; }

  /* ── RESULT ── */
  .result-box {
    background: linear-gradient(135deg, var(--navy), #1a3a6e);
    border-radius: var(--radius); padding: 24px 20px; color: #fff; margin-bottom: 16px;
    text-align: center;
  }
  .result-type { font-size: 13px; opacity: 0.7; margin-bottom: 6px; letter-spacing: 2px; }
  .result-name { font-size: 26px; font-weight: 900; color: #FFD700; margin-bottom: 8px; }
  .result-desc { font-size: 15px; opacity: 0.9; line-height: 1.7; }
  .result-scores { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin: 16px 0; }
  .rscore { background: rgba(255,255,255,0.1); border-radius: 10px; padding: 10px 6px; text-align: center; }
  .rscore .rv { font-size: 22px; font-weight: 900; color: #FFD700; }
  .rscore .rl { font-size: 11px; opacity: 0.8; margin-top: 3px; }

  .rec-section { margin-top: 16px; }
  .rec-title { font-size: 16px; font-weight: 900; color: var(--navy); margin-bottom: 10px; }
  .rec-card {
    background: var(--bg-card); border-radius: var(--radius-sm);
    padding: 12px 14px; margin-bottom: 8px; border-left: 4px solid var(--teal);
    font-size: 14px; color: var(--text-mid);
  }
  .rec-card strong { color: var(--navy); font-size: 15px; display: block; margin-bottom: 4px; }

  /* ── UPGRADE CARDS ── */
  .upgrade-card {
    background: var(--bg-card); border-radius: var(--radius);
    overflow: hidden; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .upgrade-old {
    background: #FFF1F2; padding: 14px 16px; border-bottom: 2px solid #FCA5A5;
  }
  .upgrade-new {
    background: #ECFDF5; padding: 14px 16px;
  }
  .upg-label {
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .upg-label.old { color: #DC2626; }
  .upg-label.new { color: #065F46; }
  .upg-text { font-size: 15px; font-weight: 700; color: var(--navy); line-height: 1.5; }
  .upgrade-arrow {
    text-align: center; padding: 4px; background: var(--border);
    font-size: 16px; color: var(--gold-light); font-weight: 900;
  }

  /* ── FLOATING CTA ── */
  .float-cta {
    position: fixed; bottom: 20px; right: 20px; z-index: 200;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: #fff; padding: 12px 20px; border-radius: 30px;
    font-weight: 900; font-size: 14px; box-shadow: 0 4px 16px rgba(184,134,11,0.4);
    cursor: pointer; border: none; text-decoration: none;
    display: flex; align-items: center; gap: 6px;
  }

  /* ── AI COACH BOX ── */
  .ai-box {
    background: linear-gradient(135deg, #0D1B3E, #1a3a6e);
    border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
    color: #fff;
  }
  .ai-box-title { font-size: 15px; font-weight: 900; color: #FFD700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
  .ai-input {
    width: 100%; padding: 11px 14px; border-radius: var(--radius-sm);
    background: rgba(255,255,255,0.1); border: 1.5px solid rgba(255,255,255,0.2);
    color: #fff; font-size: 15px; margin-bottom: 10px; outline: none;
    font-family: inherit;
  }
  .ai-input::placeholder { color: rgba(255,255,255,0.4); }
  .ai-input:focus { border-color: #FFD700; }
  .ai-response {
    background: rgba(255,255,255,0.08); border-radius: var(--radius-sm);
    padding: 12px 14px; font-size: 15px; color: rgba(255,255,255,0.9);
    min-height: 60px; line-height: 1.7; display: none;
    white-space: pre-wrap;
  }
  .ai-response.visible { display: block; }
  .ai-send {
    width: 100%; padding: 11px; background: linear-gradient(90deg, #E8A020, #FFD700);
    color: var(--navy); font-weight: 900; font-size: 15px;
    border: none; border-radius: var(--radius-sm); cursor: pointer;
  }

  .disclaimer { font-size: 12px; color: var(--text-soft); text-align: center; padding: 20px 0 40px; }

  /* scroll helper */
  .pb80 { padding-bottom: 80px; }
</style>
</head>

// ── Quiz
let qIdx = 0;
let answers = {};

function renderQuestion() {
  const q = QUIZ_QUESTIONS[qIdx];
  const pct = Math.round(((qIdx+1)/QUIZ_QUESTIONS.length)*100);
  document.getElementById('prog-bar').style.width = pct+'%';
  document.getElementById('prog-label').textContent = `第 ${qIdx+1} 題 / 共 ${QUIZ_QUESTIONS.length} 題`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('q-options').innerHTML = q.opts.map((o,i) => `
    <button class="q-opt${answers[qIdx]===i?' selected':''}" onclick="selectOpt(${i})">${o}</button>
  `).join('');
  document.getElementById('btn-prev').disabled = qIdx===0;
  document.getElementById('btn-next').textContent = qIdx===QUIZ_QUESTIONS.length-1 ? '查看結果 →' : '下一題';
  document.getElementById('btn-next').disabled = answers[qIdx]===undefined;
}

function selectOpt(i) {
  answers[qIdx] = i;
  document.querySelectorAll('.q-opt').forEach((b,j)=>b.classList.toggle('selected',j===i));
  document.getElementById('btn-next').disabled = false;
}

function quizPrev() { if(qIdx>0){qIdx--;renderQuestion();} }
function quizNext() {
  if(answers[qIdx]===undefined) return;
  if(qIdx<QUIZ_QUESTIONS.length-1){ qIdx++; renderQuestion(); }
  else { showResult(); }
}

function showResult() {
  const total = Object.values(answers).reduce((s,v)=>s+v,0);
  const type = RESULT_TYPES.find(t=>total>=t.min && total<=t.max) || RESULT_TYPES[2];
  const scores = {
    '信念升級度': Math.min(100, 60 + (answers[9]||0)*10 + (answers[2]||0)*5),
    '情緒穩定度': Math.min(100, 55 + (answers[4]||0)*10 + (answers[0]||0)*5),
    '身份一致性': Math.min(100, 50 + (answers[5]||0)*10 + (answers[7]||0)*8),
    '人格成熟度': Math.min(100, 50 + (answers[11]||0)*12 + (answers[1]||0)*6),
    '關係品質':   Math.min(100, 55 + (answers[2]||0)*12 + (answers[3]||0)*8),
    '複利潛能':   Math.min(100, 45 + (answers[10]||0)*12 + (answers[8]||0)*8),
  };
  const scoreHtml = Object.entries(scores).map(([k,v])=>
    `<div class="rscore"><div class="rv">${v}</div><div class="rl">${k}</div></div>`
  ).join('');
  document.getElementById('quiz-area').style.display='none';
  document.getElementById('quiz-result').style.display='block';
  document.getElementById('quiz-result').innerHTML = `
    <div class="result-box">
      <div class="result-type">你的人格發展階段</div>
      <div class="result-name">${type.name}</div>
      <div class="result-desc">${type.desc}</div>
      <div class="result-scores">${scoreHtml}</div>
    </div>
    <div class="rec-section">
      <div class="rec-title">🧭 AI 建議你的升級路徑</div>
      <div class="rec-card"><strong>優先模組：信念工程 ＋ 情緒工程</strong>從覺察限制性信念開始，配合情緒辨識系統，建立人格升級的雙引擎。</div>
      <div class="rec-card"><strong>黑科技配套：PS ＋ GABA ＋ Omega-3</strong>提供信念重建所需的神經可塑性支援，加速覺察與情緒穩定。</div>
      <div class="rec-card"><strong>每日微習慣：覺察日誌 ×3分鐘</strong>記錄一個觸發點 → 情緒 → 背後信念，持續更新人格作業系統。</div>
    </div>
    <button class="hero-btn" style="margin-top:12px;" onclick="restartQuiz()">🔄 重新診斷</button>
    <button class="hero-btn" style="margin-top:8px;background:linear-gradient(90deg,var(--teal),#009BB5);" onclick="showTab('nutrients')">🔬 查看對應黑科技</button>
  `;
}

function restartQuiz() {
  qIdx=0; answers={};
  document.getElementById('quiz-area').style.display='block';
  document.getElementById('quiz-result').style.display='none';
  renderQuestion();
}

// ── AI Coach
async function askCoach(suffix) {
  const input = document.getElementById('ai-input-'+suffix);
  const resp  = document.getElementById('ai-response-'+suffix);
  const text  = input.value.trim();
  if(!text) return;
  resp.classList.add('visible');
  resp.textContent = '🧠 AI 人格教練思考中…';
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: `你是「人格工程APP」的AI人格教練。你的角色是從系統論角度分析用戶的人格模式，給出精準、深刻、激勵的洞察。

核心框架：信念→預測→決策→行動→習慣→人格→命運
你要：1) 找出信念根源 2) 指出防衛機制或人生腳本 3) 給出升級路徑 4) 推薦1-2個對應的模組

語言風格：精簡有力、直指核心、充滿力量感。繁體中文。每段不超過3行。結尾給一句升級金句。

最後可以提示：搭配對應的黑科技營養素可以加速神經可塑性，支援人格升級。`,
        messages: [{role:'user', content: text}]
      })
    });
    const data = await r.json();
    const msg = data.content?.find(c=>c.type==='text')?.text || '請稍後再試';
    resp.textContent = msg;
  } catch(e) {
    resp.textContent = '⚠️ 連線異常，請稍後再試。\n\n人格工程提示：你的困境，就是你的升級素材。';
  }
}
