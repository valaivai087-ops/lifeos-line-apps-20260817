<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>學測字根王 — 發音 × 搭配詞 × 搜尋</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070C17;--s1:#0D1525;--s2:#131D30;--card:#18243A;--bdr:#1F2E48;
  --txt:#E4EAF5;--dim:#627A9A;--gold:#F2C14E;--gold2:#D4A020;
  --ok:#34D399;--bad:#F87171;--blue:#5B9BD5;--purple:#9B7FE8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:'Space Grotesk','Noto Sans TC',sans-serif;min-height:100vh;}

/* ── TOP BAR ── */
.topbar{
  position:sticky;top:0;z-index:200;
  background:var(--s1);border-bottom:1px solid var(--bdr);
  padding:12px 20px;display:flex;align-items:center;gap:14px;
  backdrop-filter:blur(14px);
}
.logo{font-size:20px;font-weight:800;color:var(--gold);letter-spacing:-0.5px;flex-shrink:0;}
.logo span{color:var(--txt);font-weight:500;}

/* Search bar */
.search-wrap{flex:1;max-width:440px;position:relative;}
.search-wrap input{
  width:100%;padding:9px 40px 9px 14px;
  background:var(--card);border:1.5px solid var(--bdr);
  border-radius:10px;color:var(--txt);font-size:14px;font-family:inherit;
  transition:.2s;outline:none;
}
.search-wrap input:focus{border-color:var(--gold);}
.search-wrap input::placeholder{color:var(--dim);}
.search-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--dim);pointer-events:none;}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--dim);cursor:pointer;display:none;background:none;border:none;color:var(--dim);}
.search-results{
  display:none;position:absolute;top:calc(100% + 8px);left:0;right:0;
  background:var(--s2);border:1px solid var(--bdr);border-radius:12px;
  max-height:380px;overflow-y:auto;z-index:300;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
}
.sr-item{padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--bdr);transition:.15s;display:flex;align-items:center;gap:12px;}
.sr-item:last-child{border-bottom:none;}
.sr-item:hover{background:rgba(242,193,78,.06);}
.sr-word{font-size:15px;font-weight:600;}
.sr-meta{font-size:11px;color:var(--dim);margin-top:2px;}
.sr-zh{font-size:13px;color:var(--gold);}
.sr-root-tag{font-size:10px;font-weight:700;border-radius:5px;padding:2px 7px;flex-shrink:0;}
.hstats{margin-left:auto;display:flex;gap:10px;flex-shrink:0;}
.hpill{background:var(--card);border:1px solid var(--bdr);border-radius:18px;padding:5px 12px;font-size:11px;color:var(--dim);}
.hpill b{color:var(--gold);}

/* ── NAV ── */
.nav{display:flex;background:var(--s1);border-bottom:1px solid var(--bdr);overflow-x:auto;scrollbar-width:none;}
.nav::-webkit-scrollbar{display:none;}
.nb{flex:none;padding:11px 18px;font-size:13px;font-weight:600;border:none;background:none;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;transition:.2s;white-space:nowrap;font-family:inherit;}
.nb.on{color:var(--gold);border-bottom-color:var(--gold);}

/* ── LAYOUT ── */
.page{display:none;padding:20px;max-width:1040px;margin:0 auto;}
.page.on{display:block;}

/* ── SECTION TITLE ── */
.stitle{font-size:17px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

/* ── ROOT CARDS GRID ── */
.root-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:6px;}
.rc{background:var(--card);border:1.5px solid var(--bdr);border-radius:12px;padding:13px;cursor:pointer;transition:.2s;position:relative;overflow:hidden;}
.rc::after{content:'';position:absolute;inset:0;background:rgba(242,193,78,.06);opacity:0;transition:.2s;}
.rc:hover::after,.rc.sel::after{opacity:1;}
.rc.sel{border-color:var(--gold);}
.rc-label{font-size:17px;font-weight:800;margin-bottom:2px;}
.rc-mean{font-size:11px;color:var(--dim);}
.rc-preview{font-size:10px;color:var(--txt);opacity:.6;margin-top:5px;}
.rc-bar{height:2px;background:var(--bdr);border-radius:2px;margin-top:8px;}
.rc-fill{height:100%;border-radius:2px;transition:.4s;}
.rc-stat{font-size:9px;color:var(--dim);margin-top:3px;}

/* ── WORD TABLE ── */
.wtable{width:100%;border-collapse:collapse;margin-top:16px;}
.wtable th{background:var(--s1);color:var(--dim);font-size:10px;font-weight:700;padding:8px 12px;text-align:left;border-bottom:1px solid var(--bdr);text-transform:uppercase;letter-spacing:.5px;}
.wtable td{padding:12px 12px;border-bottom:1px solid rgba(31,46,72,.6);vertical-align:middle;}
.wtable tr:hover td{background:rgba(242,193,78,.03);}
.td-word{font-size:16px;font-weight:700;white-space:nowrap;}
.td-ipa{font-size:11px;color:var(--dim);font-style:italic;margin-top:2px;}
.td-zh{color:var(--gold);font-size:13px;font-weight:600;}
.td-collocations{display:flex;flex-wrap:wrap;gap:4px;}
.ctag{font-size:11px;background:var(--bg);border:1px solid var(--bdr);border-radius:5px;padding:2px 8px;color:var(--dim);}
.ctag b{color:var(--blue);}
.speak-btn{background:none;border:none;cursor:pointer;font-size:18px;padding:4px 6px;border-radius:7px;transition:.15s;line-height:1;}
.speak-btn:hover{background:rgba(242,193,78,.15);}
.speak-btn.speaking{animation:pulse .6s ease infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── FLASHCARD ── */
.sbar{display:flex;gap:14px;background:var(--s1);border:1px solid var(--bdr);border-radius:11px;padding:12px 16px;margin-bottom:16px;align-items:center;flex-wrap:wrap;gap:12px;}
.sb-i{display:flex;flex-direction:column;align-items:center;}
.sb-lbl{font-size:10px;color:var(--dim);}
.sb-v{font-size:20px;font-weight:700;color:var(--gold);}
.mla{margin-left:auto;display:flex;gap:7px;}
.btn{padding:9px 20px;border-radius:9px;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:inherit;transition:.2s;}
.btng{background:var(--gold);color:#060C17;}
.btng:hover{background:var(--gold2);}
.btns{background:var(--card);color:var(--txt);border:1px solid var(--bdr);}
.btns:hover{border-color:var(--gold);color:var(--gold);}
.btn-ok{background:rgba(52,211,153,.15);color:var(--ok);border:1px solid var(--ok);}
.btn-bad{background:rgba(248,113,113,.15);color:var(--bad);border:1px solid var(--bad);}
.btn-ok:hover{background:rgba(52,211,153,.28);}
.btn-bad:hover{background:rgba(248,113,113,.28);}
.pbar{height:4px;background:var(--bdr);border-radius:3px;margin-bottom:12px;}
.pbar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:3px;transition:.4s;}
.fc-ctr{font-size:11px;color:var(--dim);text-align:center;margin-bottom:12px;}
.fc-wrap{perspective:1100px;max-width:500px;margin:0 auto;}
.fc{width:100%;height:290px;position:relative;transform-style:preserve-3d;transition:.5s cubic-bezier(.4,0,.2,1);cursor:pointer;}
.fc.flip{transform:rotateY(180deg);}
.face{position:absolute;inset:0;border-radius:18px;padding:28px 32px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;text-align:center;border:1px solid var(--bdr);}
.front{background:var(--card);}
.back{background:linear-gradient(135deg,var(--card),#1A2840);transform:rotateY(180deg);}
.fc-badge{font-size:10px;font-weight:700;border-radius:5px;padding:3px 9px;margin-bottom:10px;text-transform:uppercase;letter-spacing:.4px;}
.fc-word{font-size:46px;font-weight:800;letter-spacing:-1.5px;margin-bottom:6px;}
.fc-ipa{font-size:14px;color:var(--dim);font-style:italic;margin-bottom:8px;}
.fc-hint{font-size:12px;color:var(--dim);}
.fc-speak{margin-bottom:8px;cursor:pointer;font-size:22px;background:none;border:none;}
.fc-zh{font-size:22px;font-weight:700;color:var(--gold);margin-bottom:12px;}
.fc-collocs{display:flex;flex-direction:column;gap:5px;width:100%;}
.fc-colloc{background:var(--bg);border:1px solid var(--bdr);border-radius:7px;padding:7px 12px;font-size:12px;text-align:left;color:var(--txt);}
.fc-colloc b{color:var(--blue);}
.fc-btns{display:none;flex;gap:10px;justify-content:center;margin-top:14px;}
.fc-tap{font-size:11px;color:var(--dim);text-align:center;margin-top:8px;}

/* ── QUIZ ── */
.qbadge{display:inline-block;font-size:10px;font-weight:700;border-radius:5px;padding:3px 10px;margin-bottom:10px;text-transform:uppercase;letter-spacing:.4px;background:rgba(91,155,213,.15);color:var(--blue);}
.qQ{font-size:21px;font-weight:700;text-align:center;margin-bottom:6px;line-height:1.4;}
.qIpa{font-size:13px;color:var(--dim);text-align:center;margin-bottom:22px;font-style:italic;}
.qopts{display:grid;gap:8px;}
.qopt{background:var(--card);border:1.5px solid var(--bdr);border-radius:11px;padding:13px 18px;font-size:14px;cursor:pointer;text-align:left;color:var(--txt);font-family:inherit;transition:.2s;}
.qopt:hover:not(:disabled){border-color:var(--gold);background:rgba(242,193,78,.04);}
.qopt.ok{border-color:var(--ok);background:rgba(52,211,153,.1);color:var(--ok);}
.qopt.bad{border-color:var(--bad);background:rgba(248,113,113,.1);color:var(--bad);}
.qexplain{background:var(--card);border:1px solid var(--bdr);border-radius:11px;padding:14px 16px;margin-top:12px;font-size:14px;line-height:1.7;display:none;}
.qexplain.show{display:block;}
.qexplain b{color:var(--gold);}
.qexplain .colloc-list{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px;}
.qnext{text-align:center;margin-top:12px;display:none;}
.result-box{text-align:center;padding:36px;background:var(--card);border-radius:18px;border:1px solid var(--bdr);}
.result-stars{font-size:32px;letter-spacing:4px;margin-bottom:6px;}
.result-score{font-size:58px;font-weight:800;color:var(--gold);}
.result-msg{font-size:15px;color:var(--dim);margin-bottom:20px;}

/* ── PROGRESS ── */
.prog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.pg{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:14px;}
.pg-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.pg-label{font-size:14px;font-weight:700;}
.pg-bar{height:4px;background:var(--bdr);border-radius:2px;}
.pg-fill{height:100%;border-radius:2px;transition:.4s;}
.pg-nums{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-top:4px;}

/* ── OVERLAY ── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:400;display:none;align-items:center;justify-content:center;padding:16px;}
.ov.on{display:flex;}
.ovbox{background:var(--s1);border:1px solid var(--bdr);border-radius:18px;padding:22px;max-width:600px;width:100%;max-height:80vh;overflow-y:auto;}
.ovtitle{font-size:15px;font-weight:700;margin-bottom:14px;}
.selgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;}
.sc{background:var(--card);border:1.5px solid var(--bdr);border-radius:9px;padding:10px;cursor:pointer;transition:.2s;}
.sc:hover,.sc.on{border-color:var(--gold);}
.sc-lbl{font-size:13px;font-weight:700;}
.sc-sub{font-size:10px;color:var(--dim);}

/* ── COMBO ── */
.combo{display:none;position:fixed;top:72px;right:14px;background:var(--gold);color:#060C17;font-weight:800;font-size:14px;border-radius:10px;padding:8px 14px;z-index:500;animation:cpop .5s ease;}
@keyframes cpop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}

/* ── WORD DETAIL MODAL ── */
.wdov{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:500;display:none;align-items:center;justify-content:center;padding:16px;}
.wdov.on{display:flex;}
.wdbox{background:var(--s1);border:1px solid var(--bdr);border-radius:20px;padding:28px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;}
.wd-word{font-size:40px;font-weight:800;letter-spacing:-1px;margin-bottom:4px;}
.wd-ipa{font-size:15px;color:var(--dim);font-style:italic;margin-bottom:6px;}
.wd-zh{font-size:20px;font-weight:700;color:var(--gold);margin-bottom:16px;}
.wd-root{font-size:12px;background:rgba(242,193,78,.12);color:var(--gold);border-radius:6px;padding:4px 12px;display:inline-block;margin-bottom:16px;}
.wd-section{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.wd-collocs{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.wd-ctag{background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:9px 14px;font-size:14px;}
.wd-ctag b{color:var(--blue);}
.wd-close{position:absolute;top:20px;right:20px;background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--txt);font-family:inherit;}
.wdbox{position:relative;}

@media(max-width:560px){
  .root-grid{grid-template-columns:repeat(2,1fr);}
  .fc-word{font-size:34px;}
  .fc{height:270px;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">字根<span>王</span></div>

  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="搜尋單字、字根、中文..." autocomplete="off" oninput="handleSearch()" onfocus="showResults()" />
    <span class="search-icon" id="searchIcon">🔍</span>
    <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
    <div class="search-results" id="searchResults"></div>
  </div>

  <div class="hstats">
    <div class="hpill">練習 <b id="hdStudied">0</b></div>
    <div class="hpill">連線 <b id="hdStreak">0</b>天</div>
  </div>
</div>

<div class="nav">
  <button class="nb on" onclick="gp('browse',this)">📖 字根瀏覽</button>
  <button class="nb" onclick="gp('flash',this)">🃏 閃卡</button>
  <button class="nb" onclick="gp('quiz',this)">🧠 測驗</button>
  <button class="nb" onclick="gp('prog',this)">📊 進度</button>
</div>

<div id="comboBadge" class="combo"></div>

<!-- ── BROWSE ── -->
<div class="page on" id="page-browse">
  <div class="stitle" style="margin-bottom:10px;"><span class="dot" style="background:var(--gold)"></span>40 字根 · 400 單字</div>
  <div class="root-grid" id="rootGrid"></div>
  <div id="browseDetail"></div>
</div>

<!-- ── FLASH ── -->
<div class="page" id="page-flash">
  <div class="sbar">
    <div class="sb-i"><div class="sb-lbl">已看</div><div class="sb-v" id="fcSeen">0</div></div>
    <div class="sb-i"><div class="sb-lbl">✅</div><div class="sb-v" id="fcOK">0</div></div>
    <div class="sb-i"><div class="sb-lbl">❌</div><div class="sb-v" id="fcNG">0</div></div>
    <div class="mla">
      <button class="btn btns" style="padding:7px 11px;font-size:12px;" onclick="openSel()">選字根</button>
      <button class="btn btns" style="padding:7px 11px;font-size:12px;" onclick="startFC()">🔀</button>
    </div>
  </div>
  <div class="pbar"><div class="pbar-fill" id="fcBar"></div></div>
  <div class="fc-ctr" id="fcCtr"></div>
  <div class="fc-wrap">
    <div class="fc" id="fcCard" onclick="flipFC()">
      <div class="face front">
        <div class="fc-badge" id="fcBadge" style="background:rgba(242,193,78,.12);color:var(--gold)"></div>
        <div class="fc-word" id="fcWord">—</div>
        <div class="fc-ipa" id="fcIpa"></div>
        <button class="fc-speak" id="fcSpeak" onclick="event.stopPropagation();speakWord(document.getElementById('fcWord').textContent)">🔊</button>
        <div class="fc-hint">點擊翻面 → 看中文 + 搭配詞</div>
      </div>
      <div class="face back">
        <div class="fc-badge" id="fcBadge2" style="background:rgba(242,193,78,.12);color:var(--gold)"></div>
        <div style="font-size:26px;font-weight:800;margin-bottom:3px;" id="fcWord2"></div>
        <div class="fc-zh" id="fcZh"></div>
        <div class="fc-collocs" id="fcCollocs"></div>
      </div>
    </div>
  </div>
  <div class="fc-tap">翻面後選 ✅ 記得 / ❌ 再看</div>
  <div class="fc-btns" id="fcBtns">
    <button class="btn btn-bad" onclick="markFC(false)">❌ 再看</button>
    <button class="btn btns" style="padding:9px 14px;" onclick="skipFC()">⏭</button>
    <button class="btn btn-ok" onclick="markFC(true)">✅ 記得</button>
  </div>
  <div id="fcResult" style="display:none;margin-top:26px;">
    <div class="result-box">
      <div class="result-stars" id="fcStars"></div>
      <div class="result-score" id="fcScore"></div>
      <div class="result-msg" id="fcMsg"></div>
      <button class="btn btng" onclick="startFC()" style="margin-top:14px;">再來一輪</button>
    </div>
  </div>
</div>

<!-- ── QUIZ ── -->
<div class="page" id="page-quiz">
  <div class="sbar">
    <div class="sb-i"><div class="sb-lbl">第</div><div class="sb-v" id="qzN">1</div></div>
    <div class="sb-i"><div class="sb-lbl">✅</div><div class="sb-v" id="qzOK">0</div></div>
    <div class="sb-i"><div class="sb-lbl">❌</div><div class="sb-v" id="qzNG">0</div></div>
    <div class="mla">
      <button class="btn btns" style="padding:7px 11px;font-size:12px;" onclick="openSel('qz')">選字根</button>
      <button class="btn btng" style="padding:7px 11px;font-size:12px;" onclick="startQuiz()">重開</button>
    </div>
  </div>
  <div class="pbar"><div class="pbar-fill" id="qzBar"></div></div>
  <div id="quizArea">
    <div class="qbadge" id="qzType">中翻英</div>
    <div class="qQ" id="qzQ"></div>
    <div class="qIpa" id="qzIpa"></div>
    <div class="qopts" id="qzOpts"></div>
    <div class="qexplain" id="qzExplain"></div>
    <div class="qnext" id="qzNext"><button class="btn btng" onclick="nextQuiz()">下一題 →</button></div>
  </div>
  <div id="quizResult" style="display:none;margin-top:26px;">
    <div class="result-box">
      <div class="result-stars" id="qzStars"></div>
      <div class="result-score" id="qzScore"></div>
      <div class="result-msg" id="qzMsg"></div>
      <button class="btn btng" onclick="startQuiz()" style="margin-top:14px;">再測一次</button>
    </div>
  </div>
</div>

<!-- ── PROGRESS ── -->
<div class="page" id="page-prog">
  <div class="stitle"><span class="dot" style="background:var(--gold)"></span>字根掌握進度</div>
  <div class="prog-grid" id="progGrid"></div>
</div>

<!-- ── SELECT OVERLAY ── -->
<div class="ov" id="selOv" onclick="closeOv(event)">
  <div class="ovbox">
    <div class="ovtitle">選擇要練習的字根</div>
    <div style="display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap;">
      <button class="btn btng" style="padding:6px 11px;font-size:11px;" onclick="selAll()">全選</button>
      <button class="btn btns" style="padding:6px 11px;font-size:11px;" onclick="selNone()">清空</button>
    </div>
    <div class="selgrid" id="selGrid"></div>
    <div style="text-align:center;margin-top:14px;"><button class="btn btng" onclick="applySel()">確認</button></div>
  </div>
</div>

<!-- ── WORD DETAIL MODAL ── -->
<div class="wdov" id="wdOv" onclick="closeWd(event)">
  <div class="wdbox" id="wdBox">
    <button class="wd-close" onclick="document.getElementById('wdOv').classList.remove('on')">關閉 ✕</button>
    <div id="wdContent"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
// COLLOCATION DATABASE
// ═══════════════════════════════════════════════════
const COLLOCS = {
  // spect
  "inspect":["inspect the building","inspect the damage","inspect closely"],
  "respect":["show respect","earn respect","respect others"],
  "aspect":["positive aspect","key aspect","consider every aspect"],
  "suspect":["suspect foul play","prime suspect","suspect someone of"],
  "spectator":["sports spectator","spectator sport","spectator stands"],
  "spectacle":["make a spectacle","stunning spectacle","wear spectacles"],

let S={sel:ROOTS.map(r=>r.id),browseRoot:null,fcWords:[],fcIdx:0,fcOK:0,fcNG:0,fcFlipped:false,qzWords:[],qzIdx:0,qzOK:0,qzNG:0,qzAnsed:false,prog:{},studied:0,_selFor:'fc'};
function wi(w){return WORDINFO[w]||{ipa:'',zh:'—'};}
function wc(w){return COLLOCS[w]||[];}
function rootOf(w){return ROOTS.find(r=>r.words.includes(w));}
function allWords(){return ROOTS.filter(r=>S.sel.includes(r.id)).flatMap(r=>r.words.map(w=>({w,root:r})));}
function shuffle(a){return [...a].sort(()=>Math.random()-.5);}
function ls(){try{const d=JSON.parse(localStorage.getItem('roots2')||'{}');S.prog=d.prog||{};S.studied=d.studied||0;}catch{}}
function sv(){localStorage.setItem('roots2',JSON.stringify({prog:S.prog,studied:S.studied}));}

window.onload=()=>{ls();renderRootGrid();renderProg();startFC();startQuiz();document.getElementById('hdStudied').textContent=S.studied;};

function speakWord(word){
  if(!word||word==='—')return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(word);
  u.lang='en-US';u.rate=0.9;
  window.speechSynthesis.speak(u);
}

function handleSearch(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  document.getElementById('searchClear').style.display=q?'block':'none';
  document.getElementById('searchIcon').style.display=q?'none':'block';
  if(!q){document.getElementById('searchResults').style.display='none';return;}
  const res=[];
  ROOTS.forEach(r=>{
    r.words.forEach(w=>{
      const info=wi(w);
      if(w.toLowerCase().includes(q)||info.zh.includes(q)||r.id.toLowerCase().includes(q)||r.mean.includes(q)){
        res.push({w,root:r,info});
      }
    });
  });
  const sr=document.getElementById('searchResults');
  if(!res.length){sr.innerHTML='<div class="sr-item"><span style="color:var(--dim);font-size:13px;">找不到結果</span></div>';sr.style.display='block';return;}
  sr.innerHTML=res.slice(0,12).map(r=>
    `<div class="sr-item" onclick="openWordDetail('${r.w}')">
      <div style="flex:1">
        <div class="sr-word" style="color:${r.root.color}">${r.w}</div>
        <div class="sr-meta">${r.info.ipa} · ${r.info.zh}</div>
      </div>
      <div>
        <span class="sr-root-tag" style="background:${r.root.color}22;color:${r.root.color}">${r.root.id}=${r.root.mean}</span>
      </div>
    </div>`).join('');
  sr.style.display='block';
}
function showResults(){if(document.getElementById('searchInput').value)handleSearch();}
function clearSearch(){document.getElementById('searchInput').value='';document.getElementById('searchResults').style.display='none';document.getElementById('searchClear').style.display='none';document.getElementById('searchIcon').style.display='block';}
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))document.getElementById('searchResults').style.display='none';});

function openWordDetail(w){
  document.getElementById('searchResults').style.display='none';
  const info=wi(w);
  const r=rootOf(w);
  const collocs=wc(w);
  document.getElementById('wdContent').innerHTML=`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">
      <div class="wd-word" style="color:${r?r.color:'var(--gold)'}">${w}</div>
      <button onclick="speakWord('${w}')" style="background:none;border:none;cursor:pointer;font-size:24px;padding:4px;">🔊</button>
    </div>
    <div class="wd-ipa">${info.ipa}</div>
    <div class="wd-zh">${info.zh}</div>
    ${r?`<div class="wd-root">字根：${r.id} = ${r.mean}</div>`:''}
    <div class="wd-section">搭配詞 Collocations</div>
    <div class="wd-collocs">${collocs.length?collocs.map(c=>{
      const idx=c.toLowerCase().indexOf(w.toLowerCase());
      if(idx>=0){
        const hl='<b style="color:var(--blue)">'+c.slice(idx,idx+w.length)+'</b>';
        return `<div class="wd-ctag">${c.slice(0,idx)}${hl}${c.slice(idx+w.length)}</div>`;
      }
      return `<div class="wd-ctag"><b style="color:var(--blue)">${w}</b> — ${c}</div>`;
    }).join(''):'<div style="color:var(--dim);font-size:13px;">暫無搭配詞資料</div>'}</div>
  `;
  document.getElementById('wdOv').classList.add('on');
}
function closeWd(e){if(e.target===document.getElementById('wdOv'))document.getElementById('wdOv').classList.remove('on');}

function renderRootGrid(){
  document.getElementById('rootGrid').innerHTML=ROOTS.map(r=>{
    const kn=r.words.filter(w=>(S.prog[r.id+'_'+w]||{}).known).length;
    const pct=Math.round(kn/r.words.length*100);
    return `<div class="rc${S.browseRoot===r.id?' sel':''}" onclick="selectRoot('${r.id}')" id="rc-${r.id}" style="border-color:${S.browseRoot===r.id?r.color:'var(--bdr)'}">
      <div class="rc-label" style="color:${r.color}">${r.id}</div>
      <div class="rc-mean">= ${r.mean}</div>
      <div class="rc-preview">${r.words.slice(0,2).join(' · ')}</div>
      <div class="rc-bar"><div class="rc-fill" style="background:${r.color};width:${pct}%"></div></div>
      <div class="rc-stat">${r.words.length}字 · 掌握${kn}</div>
    </div>`;
  }).join('');
}
function selectRoot(id){
  S.browseRoot=id;
  document.querySelectorAll('.rc').forEach(c=>c.classList.remove('sel'));
  const el=document.getElementById('rc-'+id);
  if(el){el.classList.add('sel');el.style.borderColor=ROOTS.find(r=>r.id===id).color;}
  const r=ROOTS.find(x=>x.id===id);
  document.getElementById('browseDetail').innerHTML=`
    <div class="stitle" style="margin-top:16px;"><span class="dot" style="background:${r.color}"></span>
      <span style="color:${r.color};font-size:20px;">${r.id}</span> = ${r.mean}
    </div>
    <table class="wtable">
      <thead><tr><th></th><th>單字</th><th>發音</th><th>中文</th><th>搭配詞</th></tr></thead>
      <tbody>${r.words.map(w=>{
        const info=wi(w);
        const cols=wc(w);
        return `<tr>
          <td><button class="speak-btn" onclick="speakWord('${w}')">🔊</button></td>
          <td><div class="td-word" style="color:${r.color};cursor:pointer;" onclick="openWordDetail('${w}')">${w}</div><div class="td-ipa">${info.ipa}</div></td>
          <td></td>
          <td class="td-zh">${info.zh}</td>
          <td><div class="td-collocations">${cols.slice(0,3).map(c=>{
            const idx=c.toLowerCase().indexOf(w.toLowerCase());
            if(idx>=0){const hl='<b>'+c.slice(idx,idx+w.length)+'</b>';return `<span class="ctag">${c.slice(0,idx)}${hl}${c.slice(idx+w.length)}</span>`;}
            return `<span class="ctag"><b>${w}</b> ${c}</span>`;
          }).join('')}</div></td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;
  document.getElementById('browseDetail').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function startFC(){
  S.fcWords=shuffle(allWords());S.fcIdx=0;S.fcOK=0;S.fcNG=0;S.fcFlipped=false;
  document.getElementById('fcResult').style.display='none';
  document.getElementById('fcCard').style.display='';
  document.getElementById('fcBtns').style.display='none';
  document.getElementById('fcCard').classList.remove('flip');
  renderFC();
}
function renderFC(){
  if(S.fcIdx>=S.fcWords.length){showFCResult();return;}
  const {w,root}=S.fcWords[S.fcIdx];
  const info=wi(w);
  const cols=wc(w);
  const pct=S.fcIdx/S.fcWords.length*100;
  document.getElementById('fcBar').style.width=pct+'%';
  document.getElementById('fcCtr').textContent=`第 ${S.fcIdx+1} / ${S.fcWords.length} 張`;
  document.getElementById('fcSeen').textContent=S.fcIdx;
  document.getElementById('fcOK').textContent=S.fcOK;
  document.getElementById('fcNG').textContent=S.fcNG;
  document.getElementById('fcBadge').textContent=root.id+'='+root.mean;
  document.getElementById('fcBadge2').textContent=root.id+'='+root.mean;
  document.getElementById('fcWord').textContent=w;
  document.getElementById('fcWord2').textContent=w;
  document.getElementById('fcIpa').textContent=info.ipa;
  document.getElementById('fcZh').textContent=info.zh;
  document.getElementById('fcCollocs').innerHTML=cols.slice(0,3).map(c=>{
    const idx=c.toLowerCase().indexOf(w.toLowerCase());
    if(idx>=0){const hl='<b>'+c.slice(idx,idx+w.length)+'</b>';return `<div class="fc-colloc">${c.slice(0,idx)}${hl}${c.slice(idx+w.length)}</div>`;}
    return `<div class="fc-colloc"><b>${w}</b> — ${c}</div>`;
  }).join('');
  document.getElementById('fcCard').classList.remove('flip');
  S.fcFlipped=false;
  document.getElementById('fcBtns').style.display='none';
}
function flipFC(){
  document.getElementById('fcCard').classList.toggle('flip');
  S.fcFlipped=!S.fcFlipped;
  document.getElementById('fcBtns').style.display=S.fcFlipped?'flex':'none';
  if(S.fcFlipped)speakWord(document.getElementById('fcWord').textContent);
}
function markFC(ok){
  const {w,root}=S.fcWords[S.fcIdx];const key=root.id+'_'+w;
  if(!S.prog[key])S.prog[key]={known:0,seen:0};
  S.prog[key].seen++;
  if(ok){S.prog[key].known++;S.fcOK++;}else{S.fcNG++;S.fcWords.push(S.fcWords[S.fcIdx]);}
  S.fcIdx++;S.studied++;sv();document.getElementById('hdStudied').textContent=S.studied;renderFC();
}
function skipFC(){S.fcIdx++;renderFC();}
function showFCResult(){
  document.getElementById('fcResult').style.display='block';document.getElementById('fcCard').style.display='none';
  const pct=S.fcOK/(S.fcOK+S.fcNG)*100||0;
  document.getElementById('fcStars').textContent=pct>=90?'⭐⭐⭐':pct>=70?'⭐⭐':'⭐';
  document.getElementById('fcScore').textContent=`記住 ${S.fcOK} 個`;
  document.getElementById('fcMsg').textContent=pct>=90?'字根全制霸！學測無敵！':pct>=70?'很好！繼續衝高！':'字根要多複習，記得聽發音！';
}

// ═══════════════════════════════════════════════════
let qzData=[],qzAnsed=false,comboN=0;
const QZTYPES=['zh2en','en2zh','colloc','root_mean'];
function startQuiz(){
  const ws=allWords();
  if(ws.length<4){document.getElementById('quizArea').innerHTML='<p style="text-align:center;color:var(--dim);padding:40px">請選擇字根</p>';return;}
  qzData=shuffle(ws).slice(0,Math.min(20,ws.length));
  S.qzIdx=0;S.qzOK=0;S.qzNG=0;qzAnsed=false;comboN=0;
  document.getElementById('quizResult').style.display='none';
  document.getElementById('quizArea').style.display='';
  renderQz();
}
function renderQz(){
  if(S.qzIdx>=qzData.length){showQzResult();return;}
  qzAnsed=false;
  const allW=allWords();const {w,root}=qzData[S.qzIdx];
  const info=wi(w);const type=QZTYPES[S.qzIdx%QZTYPES.length];
  document.getElementById('qzN').textContent=S.qzIdx+1;
  document.getElementById('qzOK').textContent=S.qzOK;
  document.getElementById('qzNG').textContent=S.qzNG;
  document.getElementById('qzBar').style.width=(S.qzIdx/qzData.length*100)+'%';
  document.getElementById('qzExplain').classList.remove('show');
  document.getElementById('qzNext').style.display='none';
  let q,correct,opts,badge;
  if(type==='zh2en'){
    badge='中翻英';q=`「${info.zh}」英文是？`;correct=w;
    opts=shuffle([{w,info},...shuffle(allW.filter(x=>x.w!==w)).slice(0,3)]).map(x=>({label:x.w,val:x.w}));
  } else if(type==='en2zh'){
    badge='英翻中';q=w;document.getElementById('qzIpa').textContent=info.ipa;correct=info.zh;
    opts=shuffle([{w,info},...shuffle(allW.filter(x=>x.w!==w)).slice(0,3)]).map(x=>({label:wi(x.w).zh,val:wi(x.w).zh}));
  } else if(type==='colloc'){
    badge='搭配詞辨認';
    const cols=wc(w);
    if(cols.length>0){
      const col=cols[0];q=`"<b style='color:var(--gold)'>${w}</b>" 最常用的搭配詞是？`;correct=col;
      const distractors=shuffle(allW.filter(x=>x.w!==w&&wc(x.w).length>0)).slice(0,3).map(x=>wc(x.w)[0]);
      opts=shuffle([col,...distractors]).map(v=>({label:v,val:v}));
    } else {
      badge='英翻中';q=w;correct=info.zh;opts=shuffle([{w,info},...shuffle(allW.filter(x=>x.w!==w)).slice(0,3)]).map(x=>({label:wi(x.w).zh,val:wi(x.w).zh}));
    }
  } else {
    badge='字根判斷';q=`"${w}" 包含的字根 <b style='color:${root.color}'>${root.id}</b> 意思是？`;correct=root.mean;
    const otherRoots=shuffle(ROOTS.filter(r=>r.id!==root.id)).slice(0,3).map(r=>r.mean);
    opts=shuffle([root.mean,...otherRoots]).map(v=>({label:v,val:v}));
  }
  document.getElementById('qzType').textContent=badge;
  document.getElementById('qzQ').innerHTML=q;
  if(type!=='en2zh')document.getElementById('qzIpa').textContent='';
  const cols2=wc(w);
  document.getElementById('qzOpts').innerHTML=opts.map(o=>{
    const es=o.val.replace(/'/g,"\\'");const ec=correct.replace(/'/g,"\\'");
    const ew=w.replace(/'/g,"\\'");const ez=info.zh.replace(/'/g,"\\'");
    const ec2=cols2.length?cols2.slice(0,2).join(' / ').replace(/'/g,"\\'"):'';
    return `<button class="qopt" onclick="ansQz(this,'${es}','${ec}','${ew}','${ez}','${ec2}')">${o.label}</button>`;
  }).join('');
}
function ansQz(btn,chosen,correct,word,zh,cols){
  if(qzAnsed)return;qzAnsed=true;
  const ok=chosen===correct;
  document.querySelectorAll('.qopt').forEach(b=>{b.disabled=true;if(b===btn)b.classList.add(ok?'ok':'bad');else if(b.textContent.trim()===correct)b.classList.add('ok');});
  if(ok){S.qzOK++;comboN++;showCombo();}else{S.qzNG++;comboN=0;}
  const expl=document.getElementById('qzExplain');
  expl.innerHTML=`<b style="color:var(--gold)">${word}</b>（${zh}）<br>${cols?`搭配詞：${cols.split(' / ').map(c=>`<span class="ctag"><b>${word}</b> — ${c}</span>`).join('')}`:''}`;
  expl.classList.add('show');
  document.getElementById('qzNext').style.display='block';
  speakWord(word);S.studied++;sv();document.getElementById('hdStudied').textContent=S.studied;
}
let comboTimer=null;
function showCombo(){
  if(comboN<3)return;
  const b=document.getElementById('comboBadge');
  b.textContent=`🔥 ${comboN}連！`;b.style.display='block';
  clearTimeout(comboTimer);comboTimer=setTimeout(()=>b.style.display='none',1400);
}
function nextQuiz(){S.qzIdx++;renderQz();}
function showQzResult(){
  document.getElementById('quizResult').style.display='block';document.getElementById('quizArea').style.display='none';
  const pct=S.qzOK/(S.qzOK+S.qzNG)*100||0;
  document.getElementById('qzStars').textContent=pct>=90?'⭐⭐⭐':pct>=70?'⭐⭐':'⭐';
  document.getElementById('qzScore').textContent=`${S.qzOK}/${S.qzOK+S.qzNG}`;
  document.getElementById('qzMsg').textContent=pct>=90?'字根全搞定！🎉':pct>=70?'不錯！繼續衝！':'多練幾次，字根越記越快！';
}

// ═══════════════════════════════════════════════════
// PROGRESS
// ═══════════════════════════════════════════════════
function renderProg(){
  document.getElementById('progGrid').innerHTML=ROOTS.map(r=>{
    const kn=r.words.filter(w=>(S.prog[r.id+'_'+w]||{}).known).length;
    const pct=Math.round(kn/r.words.length*100);
    return `<div class="pg">
      <div class="pg-head"><span class="dot" style="background:${r.color}"></span><span class="pg-label" style="color:${r.color}">${r.id}</span><span style="font-size:11px;color:var(--dim);margin-left:4px;">= ${r.mean}</span></div>
      <div class="pg-bar"><div class="pg-fill" style="background:${r.color};width:${pct}%"></div></div>
      <div class="pg-nums"><span>掌握 ${kn}/${r.words.length}</span><span>${pct}%</span></div>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════
// SELECTION
// ═══════════════════════════════════════════════════
function openSel(mode='fc'){
  S._selFor=mode;
  document.getElementById('selGrid').innerHTML=ROOTS.map(r=>`<div class="sc${S.sel.includes(r.id)?' on':''}" id="sc-${r.id}" onclick="toggleSel('${r.id}',this)">
    <div class="sc-lbl" style="color:${r.color}">${r.id}</div>
    <div class="sc-sub">${r.mean} · ${r.words.length}字</div>
  </div>`).join('');
  document.getElementById('selOv').classList.add('on');
}
function toggleSel(id,el){if(S.sel.includes(id))S.sel=S.sel.filter(x=>x!==id);else S.sel.push(id);el.classList.toggle('on');}
function selAll(){S.sel=ROOTS.map(r=>r.id);document.querySelectorAll('[id^="sc-"]').forEach(el=>el.classList.add('on'));}
function selNone(){S.sel=[];document.querySelectorAll('[id^="sc-"]').forEach(el=>el.classList.remove('on'));}
function applySel(){
  if(!S.sel.length)S.sel=[ROOTS[0].id];
  document.getElementById('selOv').classList.remove('on');
  if(S._selFor==='fc')startFC();else startQuiz();
}
function closeOv(e){if(e.target===document.getElementById('selOv'))document.getElementById('selOv').classList.remove('on');}
</script>
