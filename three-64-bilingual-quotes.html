<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三大64系統雙語金句</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#22201c;--sub:#6b665d;--line:#e4dfd4;--acc:#8a5a14;--acc2:#2f6b5a;--chip:#f1ebdf;--mark:#ffe59a;--speak:#e6f3ee}
@media (prefers-color-scheme:dark){:root{--bg:#16150f;--card:#211f19;--ink:#ece7dc;--sub:#a59f92;--line:#36322a;--acc:#e0b061;--acc2:#7fc7ad;--chip:#2c2921;--mark:#6b5414;--speak:#1d3a31}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px 8px}
.bar{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:18px;margin:0 8px 0 0;white-space:nowrap}
h1 small{font-weight:400;color:var(--sub);font-size:12px;margin-left:6px}
#q{flex:1 1 220px;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:15px}
select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer}
button:hover{border-color:var(--acc)}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--sub)}
#voice{max-width:190px}
.tabs{max-width:1100px;margin:8px auto 0;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{white-space:nowrap;border-radius:999px;font-size:14px}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tab .c{font-size:11px;opacity:.8;margin-left:4px}
main{max-width:1100px;margin:0 auto;padding:14px 16px 60px}
.info{color:var(--sub);font-size:13px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.grp{grid-column:1/-1;margin:10px 0 0;font-size:16px;color:var(--acc);border-bottom:1px dashed var(--line);padding-bottom:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card.flash{outline:3px solid var(--acc)}
.card header{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
.num{font-weight:700;color:var(--acc);font-size:13px;padding-top:3px;min-width:20px}
.glyph{font-size:34px;line-height:1;color:var(--acc2)}
.card h3{margin:0;font-size:16px}
.card header .en{margin:0;color:var(--sub);font-size:13px}
.card header .hd{flex:1}
.row{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.lab{font-size:12px;background:var(--chip);border-radius:6px;padding:2px 6px;align-self:start;text-align:center;line-height:1.35}
.lab em{display:block;font-style:normal;color:var(--sub);font-size:10.5px}
.txt p{margin:0}
.txt .en{color:var(--acc2);font-size:14px;margin-top:2px}
.say{border:none;background:none;padding:0 4px 0 0;font-size:14px}
.speaking{background:var(--speak);border-radius:6px}
.note{font-size:12.5px;color:var(--sub);border-top:1px dashed var(--line);margin-top:4px;padding-top:6px}
mark{background:var(--mark);color:inherit;border-radius:3px}
body.m-zh .en:not(.keep),body.m-zh .lab em{display:none}
body.m-en .zh{display:none}
.empty{color:var(--sub);text-align:center;padding:40px}
@media (max-width:520px){.grid{grid-template-columns:1fr}h1 small{display:none}.row{grid-template-columns:52px 1fr}}
</style>
</head>
<body>
<div class="top">
 <div class="bar">
  <h1>三大64系統<small>192法則 × 576句 · Bilingual</small></h1>
  <input id="q" type="search" placeholder="搜尋中文或英文… Search">
 </div>
 <div class="bar ctl" style="margin-top:6px">
  顯示 <select id="mode"><option value="both">中英對照</option><option value="zh">只看中文</option><option value="en">English only</option></select>
  語音 <select id="voice"></select>
  速度 <input id="rate" type="range" min="0.6" max="1.3" step="0.05" value="0.9" style="width:80px"><span id="rv">0.9</span>
  <button id="stop" title="停止朗讀">⏹ 停止</button>
  <button id="rand" title="隨機一張">🎲 隨機</button>
 </div>
 <nav class="tabs" id="tabs"></nav>
</div>
<main><p class="info" id="info"></p><div class="grid" id="grid"></div></main>
<script>
// [中文名, English, 本質zh, en, 智慧zh, en, 行動zh, en]
const U=[
["吸引力法則","Law of Attraction","你持續關注的事，會影響你看見哪些機會。","What you keep focusing on shapes which opportunities you notice.","不要只期待好事發生，要讓自己具備接住機會的能力。","Don't just hope good things happen; build the ability to catch opportunities when they come.","每天主動創造一次有價值的連結。","Create one valuable connection on your own initiative every day."],
["振動法則","Law of Vibration","人的情緒與行為狀態，會影響互動品質。","Your emotional and behavioral state affects the quality of your interactions.","改變狀態不是提高神秘頻率，而是調整身心與行動。","Changing your state isn't about raising a mystical frequency; it's about adjusting body, mind and action.","情緒不穩時，先整理呼吸與思緒再決策。","When your emotions are unstable, steady your breathing and thoughts before deciding."],
["能量法則","Law of Energy","人的時間、體力與注意力都是有限資源。","Time, physical energy and attention are all limited resources.","真正的強大，是把有限資源投入重要事情。","True strength is investing limited resources in what matters.","每天保留一段不受干擾的專注時間。","Reserve one block of uninterrupted focus time every day."],
["對應法則","Law of Correspondence","個人的習慣會影響他與外在環境的互動。","Personal habits affect how you interact with the world around you.","外在結果不一定反映內心，但行為模式值得檢查。","Outer results don't always mirror your inner world, but your behavior patterns are worth examining.","找出一個經常重複的問題與自己的應對習慣。","Identify one recurring problem and your habitual response to it."],
["循環法則","Law of Cycles","許多生命與社會現象存在週期性變化。","Many natural and social phenomena change in cycles.","低潮不是永久狀態，高峰也需要維護。","A low point is not permanent, and a peak needs maintenance.","記錄自己的學習與情緒週期。","Track your own learning and mood cycles."],
["因果法則","Law of Cause and Effect","結果通常來自多種條件共同作用。","Outcomes usually come from many conditions acting together.","不要只找一個原因，要理解整個因果網絡。","Don't look for just one cause; understand the whole web of causes.","分析問題時至少列出三個可能因素。","When analyzing a problem, list at least three possible factors."],
["頻率法則","Law of Frequency","重複行動會逐漸塑造習慣。","Repeated actions gradually shape habits.","比起偶爾爆發，穩定練習更容易累積能力。","Steady practice builds ability more reliably than occasional bursts.","每天固定練習一項核心技能。","Practice one core skill at a set time every day."],
["共振法則","Law of Resonance","共同目標可能促進人際協調。","Shared goals can foster coordination between people.","真正的同頻不是想法完全相同，而是能夠合作。","Being truly in sync doesn't mean thinking exactly alike; it means being able to work together.","尋找一位願意互相督促的夥伴。","Find a partner willing to keep each other accountable."],
["顯化法則","Law of Manifestation","想法可以成為計畫的起點。","Ideas can be the starting point of a plan.","願望本身不會保證結果，執行與回饋才會推動改變。","Wishing alone guarantees nothing; execution and feedback are what drive change.","把一個願望拆成今天能完成的第一步。","Break one wish into a first step you can finish today."],
["信念法則","Law of Belief","信念會影響你對資訊與機會的判斷。","Beliefs influence how you judge information and opportunities.","好的信念不是永遠正確，而是願意接受修正。","A good belief isn't one that's always right, but one that's open to correction.","檢查一個限制自己的舊觀念。","Examine one old belief that limits you."],
["平衡法則","Law of Balance","不同需求會競爭有限的時間與資源。","Different needs compete for limited time and resources.","平衡不是平均，而是根據重要性動態調整。","Balance isn't splitting things equally; it's adjusting dynamically by importance.","重新分配學習、睡眠與休息時間。","Reallocate your time for study, sleep and rest."],
["專注法則","Law of Focus","注意力越分散，完成複雜任務通常越困難。","The more scattered your attention, the harder complex tasks usually become.","專注的第一步不是增加努力，而是減少干擾。","The first step to focus isn't more effort; it's fewer distractions.","完成一次25分鐘無手機學習。","Complete one 25-minute study session without your phone."],
["意圖法則","Law of Intention","清楚的目的能改善行動選擇。","A clear purpose improves your choice of actions.","沒有目標的忙碌，容易變成低效率消耗。","Busyness without a goal easily turns into inefficient drain.","每天寫下最重要的一個成果。","Write down your single most important outcome each day."],
["無限法則","Law of Infinity","人的能力可以成長，但仍受到現實條件限制。","Human abilities can grow, but are still bound by real-world conditions.","突破限制需要學習與資源，而非相信自己無所不能。","Breaking limits takes learning and resources, not believing you can do anything.","挑戰一件目前尚不熟練的小事。","Take on one small thing you're not yet good at."],
["光明法則","Law of Light","清楚的資訊能提高判斷品質。","Clear information improves the quality of judgment.","真正的光明，是願意看見不符合期待的事實。","True light is the willingness to see facts that don't match your expectations.","對重要問題尋找可靠證據。","Look for reliable evidence on important questions."],
["直覺法則","Law of Intuition","直覺是經驗與快速判斷形成的訊號。","Intuition is a signal formed by experience and quick judgment.","直覺值得聆聽，但重大決策需要驗證。","Intuition is worth listening to, but major decisions need verification.","記錄一次直覺及最後的實際結果。","Record one intuition and what actually happened."],
["觀察法則","Law of Observation","沒有觀察，就難以知道真正的問題。","Without observation, it's hard to know the real problem.","先描述現象，再推測原因。","Describe the phenomenon first, then guess at the cause.","用三句話記錄一件事實。","Record one fact in three sentences."],
["結構法則","Law of Structure","元素之間的關係，會影響系統整體表現。","The relationships between elements shape how the whole system performs.","不要只修補個人努力，要改善支持行動的結構。","Don't just patch personal effort; improve the structure that supports action.","重新設計一個低效率流程。","Redesign one inefficient process."],
["維度法則","Law of Dimensions","不同視角可能揭露不同問題。","Different perspectives may reveal different problems.","換角度不代表升到神秘維度，而是增加解釋能力。","Changing perspective isn't rising to a mystical dimension; it's gaining explanatory power.","用三種角色分析同一件事。","Analyze the same situation from three different roles."],
["全息法則","Law of Holography","局部與整體可能存在相互關聯。","Parts and the whole may be interconnected.","看見局部線索，不代表已掌握整體真相。","Seeing a local clue doesn't mean you've grasped the whole truth.","分析一個問題對其他環節的影響。","Analyze how one problem affects other parts of the system."],
["連接法則","Law of Connection","資訊、資源與人際關係透過連結產生流動。","Information, resources and relationships flow through connections.","連結數量不如連結品質重要。","The quality of connections matters more than their number.","維護一段有互信的合作關係。","Maintain one cooperative relationship built on mutual trust."],
["三位一體法則","Law of Trinity","複雜目標需要多個條件共同支持。","Complex goals need several conditions supporting them together.","只有想法沒有能力，只有能力沒有行動，都難以完成目標。","Ideas without ability, or ability without action, rarely reach a goal.","檢查目標、資源與行動是否一致。","Check whether your goals, resources and actions are aligned."],
["成長法則","Law of Growth","能力會在練習與回饋中逐步改變。","Abilities change gradually through practice and feedback.","成長不是永遠向上，而是能從退步中修正。","Growth isn't always upward; it's being able to correct course after setbacks.","每天記錄一個進步或錯誤。","Record one improvement or mistake every day."],
["純粹法則","Law of Purity","減少干擾，有助於辨識真正重要的需求。","Reducing distractions helps you identify what truly matters.","簡單不是逃避複雜，而是保留核心。","Simplicity isn't avoiding complexity; it's keeping the core.","移除一項不必要的生活負擔。","Remove one unnecessary burden from your life."],
["定位法則","Law of Positioning","清楚自己的能力與處境，才能選擇適當策略。","Knowing your abilities and situation lets you choose the right strategy.","自我認識不是貼標籤，而是建立可更新的能力地圖。","Self-knowledge isn't labeling yourself; it's building an updatable map of your abilities.","列出三項優勢與一項瓶頸。","List three strengths and one bottleneck."],
["積累法則","Law of Accumulation","可保留的成果經過時間可能產生複利。","Results you can keep may compound over time.","重複不一定是成長，必須累積有效經驗。","Repetition isn't always growth; you must accumulate effective experience.","建立一份可持續更新的學習筆記。","Start a learning notebook you can keep updating."],
["層級法則","Law of Levels","不同發展階段需要不同工具。","Different stages of development need different tools.","不要用高手的方法，忽略初學者真正的瓶頸。","Don't copy experts' methods while ignoring a beginner's real bottleneck.","選擇符合目前程度的下一個挑戰。","Choose a next challenge that fits your current level."],
["路徑法則","Law of Path","目標可以相同，抵達的方法可以不同。","The goal can be the same while the way there differs.","當道路失效，改路不等於放棄。","When a road fails, changing routes doesn't mean giving up.","替重要目標準備一個替代方案。","Prepare a backup plan for an important goal."],
["節奏法則","Law of Rhythm","持續行動需要配合恢復與負荷。","Sustained action requires balancing load and recovery.","不是每天都要衝刺，而是建立可持續的速度。","You don't need to sprint every day; build a sustainable pace.","安排專注與休息交替的學習節奏。","Set a study rhythm that alternates focus and rest."],
["感恩法則","Law of Gratitude","感謝能表達對他人貢獻的看見。","Gratitude shows that you see others' contributions.","真正的感恩不是否認困難，而是記得支持與資源。","True gratitude doesn't deny hardship; it remembers support and resources.","具體感謝一位曾幫助自己的人。","Specifically thank someone who has helped you."],
["保護法則","Law of Protection","重要資源需要風險管理。","Important resources need risk management.","保護自己不是拒絕挑戰，而是控制不可承受的損失。","Protecting yourself isn't refusing challenges; it's controlling losses you can't afford.","為一項重要決策設定停損條件。","Set a stop-loss condition for one important decision."],
["方向法則","Law of Direction","方向決定努力如何配置。","Direction determines how effort is allocated.","方向不必永遠固定，但需要定期檢查。","Direction needn't be fixed forever, but it needs regular checking.","確認今天的行動是否接近長期目標。","Check whether today's actions move you toward your long-term goal."],
["流動法則","Law of Flow","資源流動能支持系統運作。","The flow of resources keeps a system running.","囤積不等於安全，流動也需要界線。","Hoarding isn't safety, and flow also needs boundaries.","讓一份有用知識成為可分享的資源。","Turn one piece of useful knowledge into a shareable resource."],
["釋放法則","Law of Release","過度負荷會降低系統彈性。","Overload reduces a system's flexibility.","放下無效負擔，才能保留重要能力。","Let go of useless burdens to preserve important capacities.","停止一項不再有價值的承諾。","Drop one commitment that no longer has value."],
["蛻變法則","Law of Transformation","環境改變時，舊模式可能失效。","When the environment changes, old patterns may stop working.","真正的蛻變不是換外表，而是更新底層策略。","Real transformation isn't a new look; it's updating your underlying strategy.","替一項反覆失敗的任務設計新方法。","Design a new method for a task that keeps failing."],
["重生法則","Law of Rebirth","失敗後仍可能建立新的發展路徑。","After failure, a new path of development is still possible.","重生不是抹除過去，而是把經驗轉成新能力。","Rebirth doesn't erase the past; it turns experience into new ability.","從一次挫折中提取一項可用教訓。","Extract one usable lesson from a setback."],
["挑戰法則","Law of Challenge","挑戰會暴露能力與資源的限制。","Challenges expose the limits of your abilities and resources.","困難不一定使人成長，正確的支持與修正才有幫助。","Hardship doesn't automatically make you grow; the right support and correction do.","選擇一個有難度且能獲得回饋的任務。","Choose a difficult task that gives you feedback."],
["目標法則","Law of Goals","可衡量的目標能提供回饋基準。","Measurable goals provide a baseline for feedback.","只有遠大夢想，沒有下一步，就很難持續。","Big dreams without a next step are hard to sustain.","將一個目標轉成兩週任務。","Turn one goal into a two-week task."],
["成就法則","Law of Achievement","成果是能力、條件、行動與機會共同作用。","Results come from ability, conditions, action and opportunity working together.","不要只崇拜成果，要研究產生成果的過程。","Don't just worship results; study the process that produces them.","分析一次成功的可重複因素。","Analyze the repeatable factors behind one success."],
["奇蹟法則","Law of Miracles","低機率的好結果仍可能發生。","Unlikely good outcomes can still happen.","不要把偶然成功當成必然規律。","Don't mistake a lucky success for a reliable rule.","用長期準備提高接住機會的能力。","Use long-term preparation to improve your ability to catch opportunities."],
["整合法則","Law of Integration","不同資源需要協調才能形成整體價值。","Different resources need coordination to create overall value.","整合不是堆疊，而是減少衝突與重複。","Integration isn't stacking; it's reducing conflict and duplication.","整合兩種能互相支持的學習方法。","Combine two learning methods that support each other."],
["互補法則","Law of Complementarity","不同能力可以彌補彼此不足。","Different abilities can make up for each other's gaps.","真正的合作不是所有人都一樣，而是差異能互補。","True cooperation isn't everyone being the same; it's differences complementing each other.","與一位優勢不同的同學合作。","Team up with a classmate whose strengths differ from yours."],
["公正法則","Law of Fairness","公平需要一致規則與適當程序。","Fairness requires consistent rules and proper procedures.","公平不代表每個人結果相同，而是尊重合理差異。","Fairness doesn't mean equal outcomes for everyone; it means respecting reasonable differences.","處理衝突時先確認事實與規則。","When handling conflict, confirm the facts and rules first."],
["合作法則","Law of Cooperation","合作能降低重複成本並整合能力。","Cooperation reduces duplicated costs and combines abilities.","合作不是把責任推給別人，而是共同承擔。","Cooperation isn't pushing responsibility onto others; it's sharing it.","在團隊中主動完成一項具體貢獻。","Make one concrete contribution to your team on your own initiative."],
["社群法則","Law of Community","社群透過信任、互動與共享資源形成價值。","Communities create value through trust, interaction and shared resources.","人數不是社群品質的唯一指標。","Headcount is not the only measure of a community's quality.","分享一項能真正幫助成員的資訊。","Share one piece of information that genuinely helps members."],
["溝通法則","Law of Communication","溝通是減少資訊落差的過程。","Communication is the process of reducing information gaps.","說得多不等於溝通好，理解與確認更重要。","Talking more isn't communicating better; understanding and confirming matter more.","重要對話後重述彼此的共識。","After an important conversation, restate what you both agreed on."],
["根基法則","Law of Foundation","任何成長都需要基本條件支持。","All growth needs basic conditions to support it.","忽略睡眠與健康，再好的計畫也可能失去持續性。","Neglect sleep and health, and even the best plan may lose its staying power.","優先改善一項基本生活習慣。","Improve one basic daily habit first."],
["知識法則","Law of Knowledge","知識是可以被檢查與應用的理解。","Knowledge is understanding that can be checked and applied.","知道很多不等於真正會用。","Knowing a lot isn't the same as being able to use it.","把今天學到的知識應用一次。","Apply something you learned today at least once."],
["智慧法則","Law of Wisdom","智慧是根據情境選擇適當方法的能力。","Wisdom is the ability to choose the right method for the situation.","背誦答案不如理解答案何時失效。","Memorizing answers is less valuable than knowing when an answer stops working.","為一個觀念列出適用條件。","List the conditions under which one idea applies."],
["探索法則","Law of Exploration","探索能擴大已知世界的邊界。","Exploration expands the boundaries of the known world.","好奇心需要方法，才能從疑問走向發現。","Curiosity needs method to move from questions to discoveries.","針對一個問題尋找新的可靠資料。","Find new, reliable sources on one question."],
["實驗法則","Law of Experimentation","實驗能協助比較不同假設。","Experiments help compare different hypotheses.","不要只爭論哪個方法好，先設計小規模測試。","Don't just argue about which method is better; design a small test first.","用七天比較兩種學習策略。","Compare two learning strategies over seven days."],

["核心定位","以第一張圖的64法則為主軸，對應《周易》64卦的圖案、卦義與人生策略。","Using the 64 laws of Image 1 as the main axis, matched to the symbols, meanings and life strategies of the 64 hexagrams of the Zhou Yi."],
["重要說明","以下是現代概念與古代卦義的創意配對，不是《易經》原典所訂的64法則對照。","These are creative pairings of modern concepts and ancient hexagram meanings, not a mapping defined by the I Ching itself."],
["本版修正","採用64個不同的易經卦，避免前版重複與遺漏。","Uses 64 different hexagrams to avoid the repetitions and omissions of the earlier version."],
["陽爻","━━━｜完整的一條線，象徵陽。","━━━ | A solid line, symbolizing yang."],
["陰爻","━　━｜中間斷開的線，象徵陰。","━ ━ | A line broken in the middle, symbolizing yin."],
["組成","每一卦由六條陰陽爻組成，三條構成下卦，三條構成上卦。","Each hexagram has six yin or yang lines: three form the lower trigram and three the upper."],
["讀卦順序","由下往上讀，最下面是初爻，最上面是上爻。","Read from bottom to top: the bottom is the first line and the top is the top line."],
["八卦圖案","乾☰天、坤☷地、震☳雷、巽☴風、坎☵水、離☲火、艮☶山、兌☱澤。","Qian ☰ Heaven, Kun ☷ Earth, Zhen ☳ Thunder, Xun ☴ Wind, Kan ☵ Water, Li ☲ Fire, Gen ☶ Mountain, Dui ☱ Lake."],
["符號","以下使用Unicode六十四卦符號，並標示上下卦，方便直接複製到LINE。","Unicode hexagram symbols are used, with the upper and lower trigrams marked, so they're easy to copy into LINE."]]],
["法則×卦象｜LifeOS最高整合","Laws × Hexagrams · LifeOS Integration",[
["本體層","64卦是描述變化的古代符號系統，64法則則是現代概念的集合。","The 64 hexagrams are an ancient symbol system describing change; the 64 laws are a collection of modern concepts."],
["結構層","卦象可以協助辨識情境、關係、阻礙、資源與時機。","Hexagrams can help identify situations, relationships, obstacles, resources and timing."],
["機制層","觀察→理解→假設→行動→回饋→修正。","Observe → understand → hypothesize → act → get feedback → revise."],
["行動層","每天選一卦，將卦義轉化為一個可以驗證的小行動。","Each day, pick one hexagram and turn its meaning into a small, verifiable action."],
["最高智慧","不要把卦象當成不可改變的命運，而要把它當成幫助自己理解處境與調整行動的思考工具。","Don't treat hexagrams as unchangeable fate; use them as thinking tools to understand your situation and adjust your actions."],
["終極閉環","變化→辨識→選擇→行動→結果→誤差修正→新智慧。","Change → recognition → choice → action → result → error correction → new wisdom."]]]
];

// ===== APP =====
const TRI={乾:["☰","天","Qian","Heaven"],坤:["☷","地","Kun","Earth"],震:["☳","雷","Zhen","Thunder"],巽:["☴","風","Xun","Wind"],坎:["☵","水","Kan","Water"],離:["☲","火","Li","Fire"],艮:["☶","山","Gen","Mountain"],兌:["☱","澤","Dui","Lake"]};
const hx=n=>String.fromCodePoint(0x4DC0+n-1);
const pad=n=>String(n).padStart(2,"0");
const L3=[["本質","Essence"],["智慧","Wisdom"],["行動","Action"]];
const three=(d,o)=>L3.map((l,k)=>({lab:l[0],labEn:l[1],zh:d[o+k*2],en:d[o+k*2+1]}));
const rowsOf=(labs,d,o)=>labs.map((l,k)=>({lab:l[0],labEn:l[1],zh:d[o+k*2],en:d[o+k*2+1]}));
const TABS=[
 {zh:"宇宙64法則",en:"Universal Laws",info:"宇宙64法則 × 三種金句（本質｜智慧｜行動）。現代靈性概念集合，非科學定律。",
  cards:U.map((d,i)=>({num:pad(i+1),title:d[0],titleEn:d[1],rows:three(d,2)}))},
 {zh:"易經64卦",en:"I Ching",info:"易經64卦 × 三種金句。金句為現代生活應用，不是古籍原文。",
  cards:I.map((d,i)=>({num:pad(i+1),glyph:hx(i+1),title:d[0]+"｜"+d[1],titleEn:d[2],rows:three(d,3)}))},
 {zh:"社會生存64法則",en:"Social Survival",info:"社會生存64法則 × 三種金句。思考工具，不宜視為絕對定律。",
  cards:S.map((d,i)=>({num:pad(i+1),title:d[0],titleEn:d[1],rows:three(d,2)}))},
 {zh:"64圖案解析",en:"64 Symbols",info:"第一張圖：64法則 × 圖案 × 象徵 × 智慧 × 行動。",
  cards:P.map((d,i)=>({num:pad(i+1),title:U[i][0],titleEn:U[i][1],rows:rowsOf([["圖案","Pattern"],["象徵","Symbol"],["智慧","Wisdom"],["行動","Action"]],d,0)}))},
 {zh:"法則×卦象",en:"Laws × Hexagrams",info:"宇宙64法則 × 易經64卦：現代概念與古代卦義的創意配對（由下往上讀卦）。",
  cards:C.map((d,i)=>{const h=d[0],g=hx(h),up=TRI[d[1][0]],lo=TRI[d[1][1]],ic=I[h-1];
   const rows=[{lab:"圖案",labEn:"Symbol",zh:`${g}｜上${d[1][0]}${up[0]}${up[1]}，下${d[1][1]}${lo[0]}${lo[1]}。`,en:`Upper ${up[2]} ${up[0]} ${up[3]}, lower ${lo[2]} ${lo[0]} ${lo[3]}.`}]
    .concat(rowsOf([["卦象","Image"],["原典意義","Meaning"],["人生智慧","Wisdom"],["最小行動","Action"]],d,2));
   return {num:pad(i+1),glyph:g,group:i%8===0?CG[i/8]:null,title:`${U[i][0]} × ${ic[0]}${h}｜${ic[1]}`,titleEn:`${U[i][1]} × ${ic[2]} (No. ${h})`,rows,note:d[10]?[d[10],d[11]]:null};})},
 {zh:"總覽說明",en:"Overview",info:"架構說明、八卦基礎、八大LifeOS能力與終極整合。",
  cards:OV.map(d=>({title:d[0],titleEn:d[1],rows:d[2].map(r=>({lab:r[0],zh:r[1],en:r[2]}))}))}
];
TABS.forEach(t=>t.cards.forEach(c=>{c.blob=[c.title,c.titleEn,...c.rows.flatMap(r=>[r.lab,r.labEn||"",r.zh,r.en]),...(c.note||[])].join(" ").toLowerCase();}));

const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem("l64_"+k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem("l64_"+k,v)}catch(e){}}};
let cur=+store.get("tab",0)||0, q="";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hl=s=>{s=esc(s);if(!q)return s;const t=esc(q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return s.replace(new RegExp(t,"gi"),m=>`<mark>${m}</mark>`);};
const match=c=>!q||c.blob.includes(q.toLowerCase());

function renderTabs(){
 $("#tabs").innerHTML=TABS.map((t,i)=>{const n=q?t.cards.filter(match).length:t.cards.length;
  return `<button class="tab${i===cur?" on":""}" data-t="${i}">${t.zh}<span class="c">${n}</span></button>`}).join("");
}
function card(c,ti,ci){
 return `<article class="card" id="c${ti}_${ci}" data-t="${ti}" data-c="${ci}"><header>${c.num?`<span class="num">${c.num}</span>`:""}${c.glyph?`<span class="glyph">${c.glyph}</span>`:""}<div class="hd"><h3 class="keep">${hl(c.title)}</h3><p class="en keep">${hl(c.titleEn)}</p></div><button class="say-all" title="朗讀整張卡的英文 Read all">🔊</button></header>`+
 c.rows.map((r,ri)=>`<div class="row" data-r="${ri}">${r.lab||r.labEn?`<span class="lab">${hl(r.lab)}${r.labEn?`<em>${r.labEn}</em>`:""}</span>`:`<span></span>`}<div class="txt"><p class="zh">${hl(r.zh)}</p><p class="en"><button class="say" title="朗讀英文">🔈</button>${hl(r.en)}</p></div></div>`).join("")+
 (c.note?`<div class="note"><p class="zh">${hl(c.note[0])}</p><p class="en">${hl(c.note[1])}</p></div>`:"")+`</article>`;
}
function render(){
 renderTabs();const t=TABS[cur];let h="",n=0;
 t.cards.forEach((c,i)=>{if(c.group&&!q)h+=`<h2 class="grp">${c.group[0]}<span class="en" style="font-size:13px;margin-left:8px;color:var(--sub)">${c.group[1]}</span></h2>`;if(match(c)){h+=card(c,cur,i);n++;}});
 $("#grid").innerHTML=n?h:`<div class="empty">找不到「${esc(q)}」 · No results</div>`;
 $("#info").textContent=(q?`搜尋「${q}」：本頁 ${n} 筆（分頁數字為各頁符合數）｜`:"")+t.info+` ｜ ${t.en}`;
}

// ===== Speech =====
const synth=window.speechSynthesis;let voices=[],voice=null;
const clean=s=>String(s).replace(/[─-╿☀-⛿䷀-䷿　]/g," ").replace(/→/g,", then ").replace(/[|｜]/g,", ").replace(/①|②|③/g,"").replace(/\s+/g," ").trim();
function loadVoices(){
 if(!synth)return;voices=synth.getVoices().filter(v=>/^en/i.test(v.lang));
 const saved=store.get("voice","");
 voices.sort((a,b)=>(/natural|online/i.test(b.name)-/natural|online/i.test(a.name))||((b.lang==="en-US")-(a.lang==="en-US")));
 $("#voice").innerHTML=voices.length?voices.map((v,i)=>`<option value="${i}">${esc(v.name.replace(/Microsoft |Online |\(Natural\)/g,"").trim())} · ${v.lang}</option>`).join(""):`<option>（無英文語音）</option>`;
 let idx=voices.findIndex(v=>v.name===saved);if(idx<0)idx=0;voice=voices[idx]||null;$("#voice").value=idx;
}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices;}
function clearHl(){document.querySelectorAll(".speaking").forEach(e=>e.classList.remove("speaking"));}
function speakQueue(items){
 if(!synth){alert("此瀏覽器不支援語音朗讀，請用 Edge 或 Chrome。");return;}
 synth.cancel();clearHl();
 items.forEach(([text,el])=>{const u=new SpeechSynthesisUtterance(clean(text));u.lang=voice?voice.lang:"en-US";if(voice)u.voice=voice;u.rate=+$("#rate").value;
  u.onstart=()=>{clearHl();el&&el.classList.add("speaking")};u.onend=()=>el&&el.classList.remove("speaking");synth.speak(u);});
}
function cardOf(el){const a=el.closest(".card");return [a,TABS[+a.dataset.t].cards[+a.dataset.c]];}

// ===== Events =====
document.addEventListener("click",e=>{
 const tb=e.target.closest(".tab");if(tb){cur=+tb.dataset.t;store.set("tab",cur);render();window.scrollTo(0,0);return;}
 const s=e.target.closest(".say");if(s){const row=s.closest(".row"),[a,c]=cardOf(s);const r=row?c.rows[+row.dataset.r]:{en:c.note[1]};speakQueue([[r.en,row||s.parentNode]]);return;}
 const sa=e.target.closest(".say-all");if(sa){const [a,c]=cardOf(sa);const rows=a.querySelectorAll(".row");
  speakQueue([[c.titleEn,a.querySelector("header")]].concat(c.rows.map((r,i)=>[(r.labEn?r.labEn+". ":"")+r.en,rows[i]])));}
});
let tmr;$("#q").addEventListener("input",e=>{clearTimeout(tmr);tmr=setTimeout(()=>{q=e.target.value.trim();
 if(q&&!TABS[cur].cards.some(match)){const k=TABS.findIndex(t=>t.cards.some(match));if(k>=0)cur=k;}render();},150);});
$("#mode").addEventListener("change",e=>{document.body.className=e.target.value==="both"?"":"m-"+e.target.value;store.set("mode",e.target.value);});
$("#rate").addEventListener("input",e=>{$("#rv").textContent=e.target.value;store.set("rate",e.target.value);});
$("#voice").addEventListener("change",e=>{voice=voices[+e.target.value]||null;if(voice)store.set("voice",voice.name);});
$("#stop").addEventListener("click",()=>{synth&&synth.cancel();clearHl();});
$("#rand").addEventListener("click",()=>{const els=[...document.querySelectorAll("#grid .card")];if(!els.length)return;
 const el=els[Math.floor(Math.random()*els.length)];el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1600);});
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement!==$("#q")){e.preventDefault();$("#q").focus();}if(e.key==="Escape"){synth&&synth.cancel();clearHl();}});

const m=store.get("mode","both");$("#mode").value=m;if(m!=="both")document.body.className="m-"+m;
const rt=store.get("rate","0.9");$("#rate").value=rt;$("#rv").textContent=rt;
if(cur>=TABS.length)cur=0;render();
</script>
</body>
</html>
