<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大腦十八環節</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#222;--sub:#666;--line:#e3ded3;--acc:#2f6f5e;--acc2:#e8f1ee;--mark:#ffe58a}
@media (prefers-color-scheme:dark){:root{--bg:#1b1c1e;--card:#25272a;--ink:#e8e6e1;--sub:#a3a09a;--line:#3a3c40;--acc:#7cc4ad;--acc2:#2c3a36;--mark:#6b5a12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;line-height:1.7}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 8px}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:18px;margin:0 0 8px}
h1 small{font-weight:normal;color:var(--sub);font-size:12px;margin-left:6px}
#q{width:100%;padding:9px 12px;font-size:15px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.tabs,.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tabs button,.chips button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:4px 11px;border-radius:999px;font-size:13px;cursor:pointer;font-family:inherit}
.tabs button.on,.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tabs .n{opacity:.7;font-size:11px;margin-left:3px}
main{padding:12px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.card h3{margin:0;font-size:15px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.card h3 .no{color:var(--acc);font-weight:bold}
.card h3 .en{color:var(--sub);font-weight:normal;font-size:12px}
.q0{color:var(--sub);font-size:13px;margin-top:2px}
.det{display:none;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;font-size:14px}
.card.open .det{display:block}
.row{display:grid;grid-template-columns:5.5em 1fr;gap:6px;margin:3px 0}
.row b{color:var(--acc);font-weight:normal}
.gold{background:var(--acc2);border-radius:6px;padding:6px 10px;margin:8px 0}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px;margin:2px 3px 0 0;color:var(--sub)}
.stage{font-size:13px;color:var(--sub);margin:16px 0 6px}
.stage b{color:var(--ink)}
.post p{margin:3px 0}
.post .t{font-weight:bold;margin-bottom:6px}
.btn{font-size:12px;padding:2px 10px;float:right}
.ql{list-style:none;padding:0;margin:6px 0}
.ql li{padding:5px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.ql li:last-child{border:0}
.ql li:hover{color:var(--acc)}
.sec h2{font-size:16px;margin:0 0 6px}
.sec p{margin:3px 0;font-size:14px}
mark{background:var(--mark);color:inherit;border-radius:2px}
.empty{color:var(--sub);text-align:center;padding:30px}
.note{font-size:12px;color:var(--sub)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;padding:6px 14px;border-radius:999px;font-size:13px;display:none}
#rand{font-size:16px;line-height:1.8}
</style>
</head>

<header><div class="wrap">
<h1>大腦十八環節 <small>v1.3｜LifeOS 智慧生成</small></h1>

</div></header>

["01","A","生理狀態","Body State","我的身體目前處於什麼狀態？","大腦持續整合飢餓、疲勞、疼痛、呼吸、心跳與其他內感受訊號。","同一句批評，睡眠充足時可能平靜面對，極度疲勞時可能更容易煩躁。","把身體疲勞造成的敏感，全部解讀為別人故意針對自己。","先辨認身體狀態，再判斷事件意義。","每天三次用0～10分記錄疲勞、壓力與精神。","你以為自己正在判斷世界，其實身體狀態也在參與判斷。","學生今天睡眠不足，容易疲倦。","身體提醒我們照顧自己。","身體不是思考的旁觀者，而是理解世界的重要參與者。"],
["02","A","目標設定","Goal Setting","我現在真正想完成什麼？","當前需求、長期價值與任務要求會影響注意力及行動選擇。","想提高英文成績的學生，會特別注意文章中的高頻單字與句型。","沒有明確目標，卻不斷增加活動與資訊。","把模糊願望轉換成可觀測的完成條件。","每天寫下一項最重要的任務及完成標準。","目標不清楚，注意力就容易被環境接管。","學生希望獲得老師認可。","目標提醒我們辨認方向。","目標不是讓你更忙，而是幫助你辨認值得投入的方向。"],
["03","A","記憶喚起","Memory Retrieval","過去哪些經驗正在影響現在？","大腦利用情境線索喚起過去經驗、知識、情緒與關係記憶。","曾被老師公開責備的學生，可能對老師的嚴肅表情特別敏感。","把過去經驗當成現在必然發生的結果。","區分過去事件、目前證據與尚未驗證的推測。","寫出「過去我經歷了什麼」與「現在實際發生什麼」。","記憶可以提供參考，但不應自動取得現實的解釋權。","過去曾被公開責備。","記憶提醒我們理解過去。","記憶不是命運，而是可以重新理解的過去。"],
["04","A","先驗預測","Prior Prediction","我預期接下來會發生什麼？","大腦根據既有模型、身體狀態與情境形成可能結果的預測。","學生看到老師拿出考卷，可能立即預期要考試。","把預測當成已經發生的事實。","用可能性取代絕對化判斷。","遇到不確定事件時，提出至少三種可能解釋。","預測是用來準備未來，不是用來宣判未來。","預期老師可能再次否定自己。","預測提醒我們準備未來。","預測不是事實，而是等待現實檢驗的假設。"],
["05","B","感官輸入","Sensory Input","現實提供了哪些可觀測訊號？","視覺、聽覺、觸覺、內感受與本體感受持續提供資訊。","朋友沒有回覆訊息，真正觀察到的只是尚未收到回覆。","把「沒有回覆」直接等同「他討厭我」。","區分觀察與解釋。","用一句話描述事實，不加入動機推測。","你看到的是訊號，你理解的是模型。","老師說：「這題需要重新檢查。」","感官提醒我們尊重事實。","感官提供訊號，解釋需要證據。"],
["06","B","神經編碼","Neural Encoding","感官訊號如何變成可處理的資訊？","感覺系統將刺激轉換成神經活動，並在不同網絡中形成特徵表徵。","閱讀英文文章時，大腦處理字母形狀、單字形式與句子資訊。","把辨識不清楚的訊號當成完整資訊。","增加訊號品質，避免過早解讀。","遇到不清楚的文字或訊息，先重新確認原始內容。","訊號品質不足時，再精密的推理也可能建立在錯誤輸入上。","辨識語句、聲調與臉部表情。","編碼提醒我們確認資訊。","資訊不完整時，判斷應該保留彈性。"],
["07","B","預測比較","Prediction Comparison","現實和我的預期相差多少？","預測處理模型利用預測與輸入之間的差異，描述部分神經系統如何進行失配處理。","預期考試會考80分，實際得到60分。","只感到失望，沒有分析差異來源。","將結果差異轉換成可以檢查的問題。","寫下預期結果、實際結果及兩者差距。","誤差不是失敗的證明，而是檢驗模型的入口。","老師的嚴肅語氣符合部分既有預期。","比較提醒我們發現差異。","誤差不是羞辱，而是模型修正的入口。"],
["08","C","精確度加權","Precision Weighting","這個差異值得相信嗎？","系統對不同訊號的不確定性進行估計，讓可靠資訊取得不同的處理權重。","十次正式模擬考成績，比一次偶然猜對的成績更能提供穩定的能力估計。","把單次事件當成普遍規律。","檢查資料來源、重複性與測量品質。","為重要判斷標註高、中、低三種證據可信度。","不是所有訊號，都有資格改寫你的世界觀。","學生可能過度相信威脅相關線索。","加權提醒我們辨認可信度。","不是每個聲音，都值得取得相同的信任權重。"],
["09","C","注意力調配","Attention Allocation","我應該把有限注意力放在哪裡？","目標導向注意與刺激驅動注意相互競爭、協調。","準備學測時，手機通知不斷搶走閱讀理解所需的注意資源。","把注意力被吸引的事情，誤認為最重要的事情。","依目標重新分配注意力。","每天安排一段25分鐘無通知的專注時間。","注意力決定哪些資訊有機會參與你的世界模型。","注意力集中在老師的語氣，而非解題建議。","注意提醒我們珍惜資源。","注意力有限，必須優先交給重要的事情。"],
["10","C","知覺形成","Perception Formation","我認為現在發生了什麼？","大腦結合感官證據、先驗與情境，形成對外部隱藏狀態的估計。","同一個皺眉表情，有人解讀為生氣，有人解讀為專心思考。","認為自己的第一印象就是唯一真相。","提出其他合理解釋，並尋找可以區分它們的證據。","每天挑選一件誤會，練習寫出兩種替代解釋。","你看見的世界，包含現實訊號，也包含自己的解釋模型。","把糾正解讀為老師不喜歡自己。","知覺提醒我們保持開放。","觀點可以幫助理解世界，也可能限制理解世界。"],
["11","D","情緒與價值評估","Emotion and Valuation","這件事對我的需求與目標意味著什麼？","身體狀態、情境評估、記憶與行動準備共同參與情緒經驗。","收到主管邀請談話，有人感到期待，有人感到焦慮。","把情緒強度當成事件真實性的證據。","辨認情緒、身體訊號與背後的事件解釋。","使用「我感到___，因為我目前推測___」描述情緒。","情緒值得被理解，但情緒不必直接成為事實判決。","出現緊張、羞愧或不安。","情緒提醒我們理解需求。","情緒值得傾聽，卻不必成為唯一的決策依據。"],
["12","D","意識與工作記憶","Consciousness and Working Memory","哪些資訊進入我能清楚思考與操作的範圍？","部分資訊進入可報告的意識經驗，工作記憶則短暫維持任務所需資訊。","學生解英文長句時，需要暫時保留主詞、動詞、子句與前後文。","同時處理過多資訊，導致遺漏重要條件。","降低工作記憶負擔，將複雜內容外部化。","把一個複雜問題拆成三個可以逐一處理的小問題。","智慧不是同時裝進更多資訊，而是讓重要資訊能被有效操作。","心中出現「我是不是很差」的想法。","意識提醒我們整理思緒。","思考需要空間，整理資訊就是創造認知空間。"],
["13","E","未來模擬","Future Simulation","不同選擇可能帶來什麼結果？","系統利用記憶、情境模型與目標預測可能的未來狀態。","學生考慮每天背20個單字，或每週集中背140個單字。","只想像理想結果，忽略時間成本與執行限制。","比較不同策略的收益、風險及可持續性。","對重要決策列出A、B兩方案及各自可能後果。","高品質決策不是只看見一條路，而是能比較多個未來。","預想繼續回答可能再次被糾正。","模擬提醒我們比較未來。","未來充滿不確定，智慧在於比較可能的道路。"],
["14","E","行動選擇","Action Selection","在有限資源下，哪個行動最值得執行？","系統整合期望結果、風險、資訊價值、習慣及行動成本。","英文閱讀能力不足時，先改善核心單字與句構辨識，而非同時購買大量教材。","選擇看起來努力、卻無法解決瓶頸的活動。","尋找影響目標最大的可改變因素。","每天選擇一項能直接改善瓶頸的行動。","有效行動不是做最多，而是優先改變最關鍵的限制。","選擇沉默或迴避。","選擇提醒我們辨認瓶頸。","行動不在於數量，而在於是否改善關鍵瓶頸。"],
["15","E","行動執行","Action Execution","如何把選擇轉換成實際改變？","運動控制、自主神經調節與環境回饋共同支持行動。","學生知道應該複習英文，但只有真正開始練習才能取得新的學習回饋。","把理解、計畫或想像誤認為已經完成行動。","將抽象策略轉換成具體、可測量的操作。","設定一個五分鐘內可以開始的動作。","模型提供方向，行動讓模型接受現實檢驗。","停止舉手回答。","行動提醒我們開始實踐。","理解需要透過行動，才能取得新的現實回饋。"],

[["不是所有聲音都值得相信，也不是所有批評都具有相同的證據重量。","陌生人的一句否定，不必推翻多年努力；一次偶然的失敗，不必定義全部能力。","成熟不是拒絕不同意見，而是能夠判斷哪些資訊可靠、哪些只是雜訊。","如果每個路過的人都能修改你的世界觀，你的人生還剩下多少自主判斷？","真正的智慧，是讓證據決定信念的權重，而不是讓聲量決定真理的位置。"],"收到批評時，檢查對方的資訊來源、具體證據與判斷範圍。"],
[["注意力不是無限資源，你關注什麼，就可能讓什麼在生命中取得更大的影響力。","注意缺點，容易忽略進步；注意比較，容易失去滿足；注意恐懼，容易錯過機會。","最吵的事情，不一定最重要；最急的事情，也不一定最值得投入。","為什麼你總說沒有時間完成夢想，卻有時間反覆關注讓自己焦慮的訊息？","真正的自我管理，不只是安排時間，而是重新取得注意力的選擇權。"],"每天安排25分鐘，不看手機，只處理一件重要任務。"],
[["你看見的世界，不只有外在訊號，也包含過去經驗與當下情境共同形成的理解。","同一句提醒，有人聽見關心，有人聽見否定；同一場失敗，有人看見結束，有人看見修正方向。","觀點不是世界本身，而是理解世界的一種方式。","如果你的第一個解釋可能出錯，為什麼不允許自己重新看一次？","真正的智慧，不是擁有永遠正確的視角，而是能在新證據出現時，重新調整看世界的角度。"],"選一件讓自己不舒服的事，提出兩種不同的合理解釋。"],
[["情緒不是生命的故障，而是身體、記憶、需求與情境共同形成的重要訊號。","憤怒可能提醒界線，悲傷可能提醒珍惜，焦慮可能提醒不確定，但它們不會自動告訴你全部真相。","真正的成熟，不是壓抑所有感受，也不是讓所有感受直接決定行動。","你現在如此憤怒，是因為事情本身，還是事情碰觸了你長期重視卻未被滿足的需要？","當你能從情緒辨認需求，再從需求重新選擇行動，情緒就可能成為理解自己的入口。"],"情緒升高時，寫下「我感到什麼、我重視什麼、我需要什麼」。"],
[["真正消耗思考能力的，有時不是問題太困難，而是太多問題同時爭奪有限的工作記憶。","把事情全部放在腦中，不代表更負責；把問題清楚分類，反而更容易做出好決定。","智慧不是同時承受更多混亂，而是建立讓資訊有序流動的結構。","如果你的大腦一直忙著記住所有事情，還剩下多少空間真正思考？","當你把混亂寫成文字，把文字整理成結構，原本沉重的問題就開始有了可以處理的形狀。"],"把腦中最困擾的三件事寫下來，分別設定下一步。"],
[["人生不是只有一條已經寫好的道路，而是由許多選擇與環境回饋共同展開的可能。","選擇沉默，可能減少眼前衝突；選擇溝通，可能增加理解；選擇改變，可能開啟新的生活。","真正的遠見，不是只看眼前得到什麼，而是同時評估長期成本、風險與機會。","如果今天的舒服會換來明天更大的代價，你還認為它是最好的選擇嗎？","智慧不是預知未來，而是讓自己在不確定的世界裡，仍能比較不同未來並保留選擇。"],"重要決策前，列出兩個方案及短期、長期的可能結果。"],
[["人生最大的浪費，不一定是沒有努力，而是把大量努力投入無法改變核心問題的地方。","讀很多書，不等於能力提升；買很多課程，不等於完成學習；做很多事情，不等於接近目標。","真正有效的行動，不是平均用力，而是優先改善最關鍵的限制。","如果你每天都很忙，結果卻始終相同，是否應該重新檢查努力的方向？","當你找對瓶頸，一個小小的改變，也可能比十次沒有方向的努力更有價值。"],"找出目前目標最大的障礙，今天只改善其中一個環節。"],
[["知道是認知的開始，做到才讓認知有機會接受現實檢驗。","你知道運動重要，卻沒有運動；你知道溝通重要，卻沒有開口；你知道學習重要，卻一直等待明天。","真正的轉變，不是收集更多道理，而是把一個道理轉換成可以執行的動作。","如果理解已經足夠，為什麼你的生活仍然沒有出現不同的結果？","人生的改變，往往不是從偉大的宣言開始，而是從今天願意完成的一個微小行動開始。"],"挑一件拖延的事，立刻執行五分鐘。"],
[["努力值得尊重，但努力的方向是否有效，仍需要現實回饋檢驗。","老師講得很多，不代表學生學會；父母付出很多，不代表孩子理解；產品介紹很多，不代表顧客得到需要的資訊。","真正的利他，不是只看自己給了多少，而是觀察對方實際得到了什麼。","如果結果一次又一次沒有改善，你要繼續增加投入，還是重新理解對方真正的需要？","當你願意讓現實回饋修正自己的方法，善意才更有機會轉化為真正有效的幫助。"],"今天詢問一個人：「我做的哪件事，對你真正有幫助？」"],
[["經驗不會自動變成智慧，只有經過整理、練習與回饋的經驗，才更有機會改變未來表現。","讀過不代表理解，理解不代表記得，記得不代表能在新情境中運用。","真正的學習，不是讓資訊反覆經過大腦，而是讓能力在不同情境中逐漸穩定。","如果同樣的錯誤已經發生十次，你得到的是十次經驗，還是一次都沒有完成的模型更新？","當錯誤被辨認，方法被修正，能力被重新測試，過去的經驗才可能轉化為未來的智慧。"],"每天挑三個曾經答錯或做錯的地方，重新練習並確認結果。"],
[["真正的智慧，不是永遠相信自己正確，而是願意讓新的證據改變舊的理解。","曾經有效的方法，不一定永遠有效；曾經相信的觀點，不一定永遠適用；曾經熟悉的身份，不一定是未來唯一的可能。","成長不是否定過去，而是保留有效經驗，修正失準權重，重新建立更適合現實的模型。","如果世界持續改變，你為什麼要求自己永遠停留在同一個版本？","願你像河流一樣，不被過去的河道困住，卻始終保有流向更寬廣世界的能力。"],"每週選一個舊觀念，檢查它是否仍符合現在的證據與生活需求。"]
];
Q.forEach((q,i)=>{S[i].quotes=q[0];S[i].qact=q[1]});

// 架構與練習
const SEC=[
["核心命題",["大腦不是被動接收世界，而是利用既有模型預測世界，透過感覺與行動取得回饋，再調整對世界的理解。","教學總公式｜身體狀態→目標→記憶→預測→感覺→編碼→比對→加權→注意→知覺→情緒→意識→模擬→選擇→行動→回饋→學習→更新。","重要提醒｜十八環節是方便教學的功能拆解，實際運作是並行、雙向、循環的，不是十八道固定流水線。"]],
["四層表徵",["第一套｜知識內容四層","概念｜我把它稱為什麼？","知識｜這些概念如何形成關係？","觀點｜我特別重視哪些關係？","世界觀｜我如何整體理解世界及自己？","第二套｜階層推論四層","L1｜感覺特徵｜我接收到哪些特徵？","L2｜物體事件｜這可能是什麼事件？","L3｜情境關係｜這件事在目前情境代表什麼？","L4｜抽象規則與自我模型｜我通常如何理解這類事情？","兩套四層是不同的分析維度，不應一一等同。","四層表徵主要參與記憶、預測、編碼、知覺、模擬與學習，也受到情緒、注意與行動回饋影響。"]],
["教學案例：學生被老師糾正",S.map(s=>s.n+"｜"+s.name+"｜"+s.stu).concat(["四層表徵拆解","概念｜糾正、失敗、認可。","知識｜被糾正不必然代表能力不足。","觀點｜從「被否定」改為「獲得修正資訊」。","世界觀｜學習環境可以是持續試錯與成長的地方。","最小行動｜下一次被糾正時，先問：「老師，我最需要修改的是哪個部分？」"])],
["LifeOS 十大錯誤診斷",ERR.map(e=>e[0]+"｜"+e[1]+"｜"+e[2]).concat(["※ 這是 LifeOS 的教學診斷映射，不代表上述錯誤類型是神經科學的標準分類。"])],
["六個日常智慧問題",["01｜我的身體與目標目前是什麼狀態？","02｜我觀察到什麼，哪些只是我的預測？","03｜這個差異可靠嗎，值得我注意嗎？","04｜我正在使用哪個觀點理解事情？","05｜我可以採取什麼最小行動驗證判斷？","06｜結果如何，我需要更新哪一層模型？"]],
["每日練習表",["早晨｜檢查身體狀態與今日目標。","事件發生｜區分感官事實與既有預測。","出現情緒｜辨認情緒背後的解釋與價值。","需要決策｜提出兩個以上的可能行動。","採取行動｜設定最小行動與觀察指標。","晚上回顧｜記錄預測、結果、差異及下一次調整。","每週複測｜比較新舊模型在相似情境中的表現。"]],
["模型驗證與版本治理",["本體檢查｜模型是否清楚區分世界、觀測與內部表徵？","結構檢查｜四層表徵與十八環節是否保留雙向關係？","機制檢查｜能否區分預測誤差、注意力、情緒及學習？","行動檢查｜是否有可執行、可測量、可複測的行動？","證據檢查｜是否將研究支持的現象與尚待驗證的理論分開？","更新檢查｜新模型是否比舊模型更能預測未見情境？","熵的檢查｜資訊是否因缺少分類、回饋與版本管理而持續混亂？","自由的檢查｜面對新證據時，是否仍能修正原有信念？"]],
["最終命題",["大腦不只是在尋找答案，也在持續建立、檢驗與更新答案背後的模型。","智慧不是沒有預測誤差，而是知道哪些誤差值得學習。","成熟不是永遠相信自己的第一個解釋，而是能在現實回饋中重新調整權重。","自由不是沒有過去，而是不讓過去的模型壟斷未來。","LifeOS 的訓練目標，是將十八環節轉化為可觀察、可練習、可回饋、可複測的智慧生成能力。"]],
["系列總結｜智慧生成的十八道生命練習",S.map(s=>s.les).concat(["最終金句｜人生真正的升級，不是讓世界永遠符合自己的預測，而是讓自己始終擁有重新理解世界的能力。"])],
["LifeOS｜十八環節最終總結",S.map(s=>s.n+"｜"+s.sum).concat(["終極金句｜生命真正的升級，不是讓世界永遠符合自己的預測，而是讓自己始終擁有重新理解世界、重新選擇行動、重新創造未來的能力。"])]
];

const TABS=[["steps","十八環節"],["posts","臉書貼文"],["quotes","90金句"],["frame","架構與練習"]];
let tab="steps",stage="",kw="";
try{tab=localStorage.getItem("brain18tab")||"steps"}catch(e){}
const $=id=>document.getElementById(id);
const esc=t=>t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const terms=()=>kw.trim().toLowerCase().split(/\s+/).filter(Boolean);
const hit=txt=>{const t=terms(),l=txt.toLowerCase();return t.every(w=>l.includes(w))};
function hl(t){t=esc(t);const ws=terms();if(!ws.length)return t;const re=new RegExp("("+ws.map(w=>esc(w).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gi");return t.replace(re,"<mark>$1</mark>")}
const stepText=s=>[s.n,s.name,s.en,s.q,s.mech,s.cs,s.err,s.strat,s.act,s.gold,s.stu,s.errs.join(" "),STAGES[s.st][0]].join(" ");
const postText=s=>[s.n,s.name,s.post.title,s.post.body.join(""),s.post.gold,s.post.act].join(" ");
function toast(m){const t=$("toast");t.textContent=m||"已複製";t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",1200)}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast()).catch(()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();toast()})}

function counts(){
  return {steps:S.filter(s=>(!stage||s.st===stage)&&hit(stepText(s))).length,
    posts:S.filter(s=>(!stage||s.st===stage)&&hit(postText(s))).length,
    quotes:S.filter(s=>!stage||s.st===stage).reduce((n,s)=>n+s.quotes.filter(q=>hit(s.n+s.name+q)).length,0),
    frame:SEC.reduce((n,x)=>n+(hit(x[0])?x[1].length:x[1].filter(hit).length),0)};
}
function render(){
  const c=counts();
  $("tabs").innerHTML=TABS.map(t=>`<button data-t="${t[0]}" class="${t[0]===tab?"on":""}">${t[1]}${kw?`<span class="n">${c[t[0]]}</span>`:""}</button>`).join("");
  $("chips").innerHTML=tab==="frame"?"":`<button data-s="" class="${stage?"":"on"}">全部</button>`+Object.keys(STAGES).map(k=>`<button data-s="${k}" class="${stage===k?"on":""}">${k}｜${STAGES[k][0]}</button>`).join("");
  $("out").innerHTML=({steps:rSteps,posts:rPosts,quotes:rQuotes,frame:rFrame})[tab]()||`<div class="empty">找不到符合「${esc(kw)}」的內容</div>`;
}
function grouped(list,fn){let h="",cur="";list.forEach(s=>{if(s.st!==cur){cur=s.st;h+=`<div class="stage"><b>${cur}｜${STAGES[cur][0]}</b>　${STAGES[cur][1]}</div>`}h+=fn(s)});return h}
function rSteps(){
  const L=S.filter(s=>(!stage||s.st===stage)&&hit(stepText(s)));
  return grouped(L,s=>`<div class="card${kw?" open":""}"><h3><span class="no">${s.n}</span>${hl(s.name)}<span class="en">${hl(s.en)}</span></h3><div class="q0">${hl(s.q)}</div><div class="det">
<div class="row"><b>運作機制</b><span>${hl(s.mech)}</span></div>
<div class="row"><b>生活案例</b><span>${hl(s.cs)}</span></div>
<div class="row"><b>常見誤差</b><span>${hl(s.err)}</span></div>
<div class="row"><b>更新策略</b><span>${hl(s.strat)}</span></div>
<div class="row"><b>最小行動</b><span>${hl(s.act)}</span></div>
<div class="gold">${hl(s.gold)}</div>
<div class="row"><b>學生案例</b><span>${hl(s.stu)}</span></div>
<div class="row"><b>錯誤診斷</b><span>${s.errs.map(e=>`<span class="tag">${hl(e)}</span>`).join("")||"—"}</span></div>
</div></div>`);
}
function postStr(s){return `【${s.n}｜${s.name}：${s.post.title}】\n${s.post.body.join("\n")}\n金句｜${s.post.gold}\n最小行動｜${s.post.act}`}
function rPosts(){
  const L=S.filter(s=>(!stage||s.st===stage)&&hit(postText(s)));
  return grouped(L,s=>`<div class="card post"><button class="btn" data-copy="${s.n}">複製</button><div class="t">${s.n}｜${hl(s.name)}：${hl(s.post.title)}</div>${s.post.body.map(l=>`<p>${hl(l)}</p>`).join("")}<div class="gold">金句｜${hl(s.post.gold)}</div><p class="note">最小行動｜${hl(s.post.act)}</p></div>`);
}
function rQuotes(){
  const L=S.filter(s=>!stage||s.st===stage);
  let h=kw?"":`<div class="card"><button class="btn" id="rb">換一句</button><div class="note">隨機金句</div><div id="rand"></div></div>`;
  let any=false;
  h+=grouped(L.filter(s=>s.quotes.some(q=>hit(s.n+s.name+q))),s=>{any=true;return `<div class="card"><h3><span class="no">${s.n}</span>${hl(s.name)}</h3><ul class="ql">${s.quotes.map((q,i)=>hit(s.n+s.name+q)?`<li data-q="${esc(q)}" title="點一下複製">金句${String(i+1).padStart(2,"0")}｜${hl(q)}</li>`:"").join("")}</ul><p class="note">最小行動｜${hl(s.qact)}</p></div>`});
  return any?h:"";
}
function rFrame(){
  return SEC.map(x=>{const L=hit(x[0])?x[1]:x[1].filter(hit);return L.length?`<div class="card sec"><h2>${hl(x[0])}</h2>${L.map(l=>`<p>${hl(l)}</p>`).join("")}</div>`:""}).join("");
}
function rand(){const r=$("rand");if(!r)return;const s=S[Math.floor(Math.random()*18)];const q=s.quotes[Math.floor(Math.random()*5)];r.innerHTML=`${esc(q)}<div class="note">— ${s.n}｜${s.name}</div>`;r.dataset.q=q}

$("q").addEventListener("input",e=>{kw=e.target.value;render();rand()});
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-t]");if(t){tab=t.dataset.t;try{localStorage.setItem("brain18tab",tab)}catch(_){}render();rand();scrollTo(0,0);return}
  const s=e.target.closest("[data-s]");if(s){stage=s.dataset.s;render();rand();return}
  const c=e.target.closest("[data-copy]");if(c){copy(postStr(S.find(x=>x.n===c.dataset.copy)));return}
  const q=e.target.closest("[data-q]");if(q){copy(q.dataset.q);return}
  if(e.target.id==="rb"){rand();return}
  if(e.target.id==="rand"||e.target.parentNode.id==="rand"){copy($("rand").dataset.q);return}
  const h=e.target.closest(".card h3");if(h&&tab==="steps")h.parentNode.classList.toggle("open");
});
render();rand();
</script>
</body>
</html>
