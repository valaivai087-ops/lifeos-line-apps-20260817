<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>12個身體訊號｜讀懂生命的作業系統</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif;background:#071520;min-height:100vh;color:#fff;}

/* HERO */
.hero{background:linear-gradient(160deg,#071520 0%,#0d2535 55%,#071520 100%);border-bottom:1px solid rgba(0,200,150,0.2);padding:2.5rem 1.5rem 2rem;text-align:center;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% -10%,rgba(0,200,150,0.1) 0%,transparent 65%);pointer-events:none;}
.hero-badge{display:inline-block;font-size:11px;letter-spacing:2px;color:#00C896;border:1px solid rgba(0,200,150,0.35);padding:4px 18px;border-radius:100px;margin-bottom:1rem;position:relative;}
.hero-title{font-size:24px;font-weight:700;color:#fff;letter-spacing:2px;margin-bottom:6px;position:relative;}
.hero-title em{color:#00C896;font-style:normal;}
.hero-sub{font-size:13px;color:rgba(255,255,255,0.45);letter-spacing:1px;margin-bottom:1.25rem;position:relative;}
.hero-divider{width:80px;height:1px;background:linear-gradient(90deg,transparent,#00C896,transparent);margin:0 auto 1.25rem;}
.hero-formula{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;position:relative;}
.hero-tag{font-size:11px;padding:5px 14px;border-radius:100px;background:rgba(0,200,150,0.08);border:1px solid rgba(0,200,150,0.2);color:#00C896;}
.prog-bar{background:rgba(255,255,255,0.05);border-radius:100px;height:3px;margin:1.5rem 1.5rem 0;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,#00C896,#B8860B);border-radius:100px;transition:width 0.6s ease;width:0%;}

/* OS MODEL */
.os-model{display:flex;gap:0;margin-bottom:1.5rem;flex-wrap:wrap;}
.os-step{flex:1;min-width:90px;background:rgba(0,200,150,0.04);border:1px solid rgba(0,200,150,0.12);padding:10px 6px;text-align:center;position:relative;}
.os-step:first-child{border-left-color:rgba(0,200,150,0.5);border-top-color:rgba(0,200,150,0.5);border-bottom-color:rgba(0,200,150,0.5);border-radius:10px 0 0 10px;}
.os-step:last-child{border-right-color:rgba(184,134,11,0.4);border-radius:0 10px 10px 0;}
.os-icon{font-size:18px;display:block;margin-bottom:4px;}
.os-name{font-size:10px;color:rgba(255,255,255,0.5);font-weight:600;}
.os-desc{font-size:9px;color:rgba(255,255,255,0.3);margin-top:2px;}

/* CONTENT */
.content{max-width:760px;margin:0 auto;padding:1.5rem 1rem;}
.phase{display:none;}.phase.active{display:block;}
.slabel{font-size:10px;font-weight:700;letter-spacing:2px;color:#00C896;margin-bottom:1rem;display:flex;align-items:center;gap:8px;text-transform:uppercase;}
.slabel::after{content:'';flex:1;height:0.5px;background:rgba(0,200,150,0.2);}

/* SIGNAL GRID */
.signal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:1.25rem;}
.sig-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px 12px;cursor:pointer;transition:all 0.2s;text-align:center;position:relative;}
.sig-card:hover{border-color:rgba(0,200,150,0.4);background:rgba(0,200,150,0.04);}
.sig-card.picked{border-color:#00C896;background:rgba(0,200,150,0.07);}
.sig-card.picked::after{content:'✓';position:absolute;top:8px;right:10px;font-size:11px;color:#00C896;font-weight:700;}
.sig-icon{font-size:26px;margin-bottom:6px;display:block;}
.sig-name{font-size:13px;font-weight:700;color:#fff;margin-bottom:2px;}
.sig-role{font-size:11px;color:#00C896;margin-bottom:4px;}
.sig-q{font-size:10px;color:rgba(255,255,255,0.35);line-height:1.4;}

/* PICK HINT */
.pick-hint{text-align:center;font-size:12px;color:rgba(255,255,255,0.3);margin-bottom:1rem;}
.pick-count{display:inline-block;background:rgba(0,200,150,0.1);color:#00C896;font-size:12px;padding:3px 12px;border-radius:100px;margin-left:6px;font-weight:600;}

/* SYSTEM TABS (FILTER) */
.sys-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem;}
.sys-tab{padding:6px 14px;border:1px solid rgba(255,255,255,0.1);border-radius:100px;font-size:11px;color:rgba(255,255,255,0.4);cursor:pointer;background:transparent;font-family:inherit;transition:all 0.2s;}
.sys-tab:hover{border-color:rgba(0,200,150,0.4);color:#00C896;}
.sys-tab.active{background:rgba(0,200,150,0.1);border-color:#00C896;color:#00C896;font-weight:600;}

/* QUESTION */
.q-block{margin-bottom:1.5rem;}
.q-sig-header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(0,200,150,0.06);border:1px solid rgba(0,200,150,0.18);border-radius:12px;margin-bottom:10px;}
.q-sig-icon{font-size:22px;}
.q-sig-name{font-size:14px;font-weight:700;color:#fff;flex:1;}
.q-sig-role{font-size:11px;color:#00C896;}
.q-list{display:flex;flex-direction:column;gap:8px;}
.q-item{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:11px;padding:12px 14px;}
.q-text{font-size:13px;color:rgba(255,255,255,0.8);margin-bottom:9px;line-height:1.6;}
.q-opts{display:flex;gap:7px;flex-wrap:wrap;}
.q-opt{padding:6px 12px;border:1px solid rgba(255,255,255,0.12);border-radius:100px;font-size:11px;cursor:pointer;color:rgba(255,255,255,0.5);background:transparent;transition:all 0.15s;font-family:inherit;}
.q-opt:hover{border-color:#00C896;color:#00C896;}
.q-opt.sel{background:rgba(0,200,150,0.12);border-color:#00C896;color:#00C896;font-weight:600;}

/* RESULT */
.result-hero{background:linear-gradient(135deg,#071520,#102030);border:1px solid rgba(0,200,150,0.25);border-radius:18px;padding:2rem;text-align:center;margin-bottom:1.5rem;}
.rh-ring{width:110px;height:110px;margin:0 auto 1rem;position:relative;}
.rh-ring svg{width:110px;height:110px;}
.rh-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px;font-weight:700;color:#00C896;}
.rh-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:6px;}
.rh-desc{font-size:13px;color:rgba(255,255,255,0.45);}

/* THREE SYSTEMS SUMMARY */
.three-sys{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:1.5rem;}
.ts-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:12px 10px;text-align:center;}
.ts-title{font-size:11px;font-weight:700;color:#00C896;margin-bottom:6px;letter-spacing:0.5px;}
.ts-items{font-size:10px;color:rgba(255,255,255,0.45);line-height:1.8;}

/* SIGNAL RESULT CARD */
.sig-result-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:16px;overflow:hidden;margin-bottom:14px;}
.src-header{display:flex;align-items:center;gap:12px;padding:14px 16px;}
.src-icon{font-size:24px;}
.src-info{flex:1;}
.src-name{font-size:15px;font-weight:700;color:#fff;}
.src-role{font-size:11px;color:#00C896;margin-top:2px;}
.src-score-area{text-align:right;}
.src-score-num{font-size:18px;font-weight:700;}
.src-bar-wrap{width:80px;height:4px;background:rgba(255,255,255,0.08);border-radius:100px;margin-top:5px;overflow:hidden;}
.src-bar{height:100%;border-radius:100px;transition:width 1s ease;}
.s-hi{background:#1a7a2a;}.s-md{background:#B8860B;}.s-lo{background:#A32D2D;}

/* TABS */
.rtabs{display:flex;gap:0;border:1px solid rgba(255,255,255,0.08);border-radius:10px;overflow:hidden;margin:0 16px 12px;}
.rtab{flex:1;padding:10px;font-size:11px;font-weight:600;text-align:center;cursor:pointer;background:transparent;color:rgba(255,255,255,0.3);border:none;transition:all 0.2s;font-family:inherit;}
.rtab.active{background:rgba(0,200,150,0.1);color:#00C896;}
.tab-panel{display:none;padding:0 16px 16px;}.tab-panel.active{display:block;}

/* EDU PANEL */
.essence-box{background:rgba(0,200,150,0.06);border:1px solid rgba(0,200,150,0.2);border-radius:12px;padding:14px;margin-bottom:10px;}
.essence-label{font-size:10px;color:#00C896;font-weight:700;letter-spacing:1px;margin-bottom:5px;}
.essence-text{font-size:14px;color:#fff;font-weight:600;line-height:1.6;}
.formula-box{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
.formula-title{font-size:10px;color:rgba(255,255,255,0.35);font-weight:700;letter-spacing:1px;margin-bottom:8px;}
.formula-steps{display:flex;flex-direction:column;gap:3px;}
.fs-step{font-size:12px;color:rgba(255,255,255,0.6);display:flex;align-items:center;gap:8px;}
.fs-step:first-child{color:#00C896;font-weight:600;}
.fs-arr{font-size:10px;color:rgba(255,255,255,0.2);}
.spectrum-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.spec-card{border-radius:10px;padding:12px;}
.spec-low{background:rgba(163,45,45,0.08);border:1px solid rgba(163,45,45,0.2);}
.spec-high{background:rgba(184,134,11,0.08);border:1px solid rgba(184,134,11,0.2);}
.spec-title{font-size:10px;font-weight:700;margin-bottom:6px;}
.spec-low .spec-title{color:#E87070;}
.spec-high .spec-title{color:#D4A017;}
.spec-item{font-size:11px;color:rgba(255,255,255,0.55);padding:2px 0;display:flex;gap:6px;}
.spec-item::before{content:'·';color:rgba(255,255,255,0.25);}
.optimal-box{background:rgba(0,200,150,0.05);border-left:3px solid #00C896;padding:10px 14px;border-radius:0 10px 10px 0;margin-bottom:10px;}
.optimal-title{font-size:10px;color:rgba(0,200,150,0.8);font-weight:700;letter-spacing:0.5px;margin-bottom:4px;}
.optimal-text{font-size:12px;color:rgba(255,255,255,0.7);line-height:1.6;}
.insight-grid{display:flex;flex-direction:column;gap:8px;}
.insight-card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:10px 12px;}
.insight-title{font-size:11px;font-weight:700;color:#00C896;margin-bottom:4px;}
.insight-text{font-size:12px;color:rgba(255,255,255,0.6);line-height:1.6;}

/* METHOD PANEL */
.method-steps{display:flex;flex-direction:column;gap:10px;}
.ms-card{display:flex;gap:12px;background:rgba(0,200,150,0.04);border:1px solid rgba(0,200,150,0.1);border-radius:12px;padding:12px 14px;}
.ms-num{width:24px;height:24px;border-radius:50%;background:rgba(0,200,150,0.15);border:1px solid rgba(0,200,150,0.3);font-size:11px;font-weight:700;color:#00C896;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ms-body{flex:1;}
.ms-title{font-size:13px;font-weight:700;color:#fff;margin-bottom:4px;}
.ms-desc{font-size:12px;color:rgba(255,255,255,0.55);line-height:1.6;}
.wisdom-box{background:rgba(184,134,11,0.06);border-left:3px solid #B8860B;padding:10px 14px;border-radius:0 10px 10px 0;margin-top:12px;}
.wb-title{font-size:10px;color:#8B6508;font-weight:700;letter-spacing:0.5px;margin-bottom:3px;}
.wb-text{font-size:13px;color:rgba(255,255,255,0.75);line-height:1.6;font-style:italic;}

/* NUTRIENT PANEL */
.nut-list{display:flex;flex-direction:column;gap:9px;}
.nut-card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:12px;overflow:hidden;}
.nut-top{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;transition:background 0.15s;}
.nut-top:hover{background:rgba(0,200,150,0.04);}
.nut-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.nut-info{flex:1;min-width:0;}
.nut-name{font-size:13px;font-weight:700;color:#fff;}
.nut-mech{font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;}
.nut-price{font-size:12px;color:#B8860B;font-weight:700;margin-top:3px;}
.nut-exp{font-size:11px;color:rgba(255,255,255,0.2);flex-shrink:0;}
.nut-cta{padding:7px 13px;background:linear-gradient(135deg,#B8860B,#D4A017);color:#071520;border:none;border-radius:100px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;text-decoration:none;display:inline-block;font-family:inherit;}
.nut-detail{display:none;padding:0 14px 14px;border-top:1px solid rgba(255,255,255,0.05);}
.nut-detail.open{display:block;}
.nut-mbox{background:rgba(255,255,255,0.03);border-radius:10px;padding:10px 12px;margin:10px 0;}
.nut-mt{font-size:10px;letter-spacing:1px;color:rgba(255,255,255,0.25);font-weight:700;margin-bottom:5px;}
.nut-mb{font-size:12px;color:rgba(255,255,255,0.65);line-height:1.7;}
.nut-why{background:rgba(0,200,150,0.05);border-left:2px solid #00C896;padding:8px 12px;border-radius:0 8px 8px 0;margin-bottom:10px;}
.nut-wt{font-size:10px;color:rgba(0,200,150,0.7);font-weight:700;margin-bottom:3px;letter-spacing:0.5px;}
.nut-wb{font-size:12px;color:rgba(255,255,255,0.65);line-height:1.6;}
.buy-block{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(184,134,11,0.05);border:1px solid rgba(184,134,11,0.18);border-radius:10px;}
.bb-info{flex:1;}
.bb-name{font-size:12px;font-weight:700;color:#fff;margin-bottom:2px;}
.bb-price{font-size:16px;font-weight:700;color:#D4A017;}
.bb-spec{font-size:10px;color:rgba(255,255,255,0.3);margin-top:1px;}
.bb-store{font-size:10px;color:#B8860B;margin-top:2px;font-weight:600;}
.btn-buy-full{padding:10px 18px;background:linear-gradient(135deg,#B8860B,#D4A017);color:#071520;border:none;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;white-space:nowrap;flex-shrink:0;font-family:inherit;}

/* BUTTONS */
.btn-primary{width:100%;padding:16px;background:linear-gradient(135deg,#007A60,#00C896);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:1px;transition:opacity 0.2s,transform 0.1s;margin-top:1rem;font-family:inherit;}
.btn-primary:hover{opacity:0.9;transform:translateY(-1px);}
.btn-primary:disabled{opacity:0.2;cursor:not-allowed;transform:none;}
.nav-row{display:flex;gap:10px;margin-top:1rem;}
.btn-back{flex:1;padding:14px;background:transparent;border:1px solid rgba(255,255,255,0.12);border-radius:12px;font-size:14px;color:rgba(255,255,255,0.4);cursor:pointer;font-family:inherit;transition:all 0.2s;}
.btn-back:hover{border-color:rgba(0,200,150,0.4);color:#00C896;}
.btn-restart{display:block;width:100%;padding:14px;background:transparent;border:1px solid rgba(255,255,255,0.08);border-radius:12px;font-size:14px;color:rgba(255,255,255,0.3);cursor:pointer;text-align:center;margin-top:1.5rem;transition:all 0.2s;font-family:inherit;}
.btn-restart:hover{border-color:rgba(0,200,150,0.3);color:#00C896;}
.footer{text-align:center;font-size:11px;color:rgba(255,255,255,0.15);padding:1.5rem 1rem;line-height:1.8;}

@media(max-width:480px){
  .signal-grid{grid-template-columns:1fr 1fr;}
  .spectrum-grid{grid-template-columns:1fr 1fr;}
  .three-sys{grid-template-columns:1fr;}
  .os-model{flex-direction:column;}
  .os-step:first-child,.os-step:last-child{border-radius:10px;}
  .buy-block{flex-direction:column;align-items:flex-start;}
  .btn-buy-full{width:100%;text-align:center;}
}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-badge">Life Operating System</div>
  <div class="hero-title">12個<em>身體訊號</em></div>
  <div class="hero-divider"></div>
  <div class="hero-sub">讀懂生命的作業系統 · 診斷 · 教育 · 修復</div>
  <div class="hero-formula">
    <span class="hero-tag">穩定</span>
    <span class="hero-tag">差異</span>
    <span class="hero-tag">糾錯</span>
    <span class="hero-tag">更新</span>
    <span class="hero-tag">進化</span>
  </div>
  <div class="prog-bar"><div class="prog-fill" id="prog"></div></div>
</div>

<div class="content">

<!-- PHASE 1: SELECT -->
<div class="phase active" id="p1">
  <div class="slabel">生命的底層作業系統</div>
  <div class="os-model">
    <div class="os-step"><span class="os-icon">⚖️</span><span class="os-name">穩定</span><span class="os-desc">維持基準</span></div>
    <div class="os-step"><span class="os-icon">📡</span><span class="os-name">差異</span><span class="os-desc">偵測偏離</span></div>
    <div class="os-step"><span class="os-icon">🔧</span><span class="os-name">糾錯</span><span class="os-desc">啟動訊號</span></div>
    <div class="os-step"><span class="os-icon">🔄</span><span class="os-name">更新</span><span class="os-desc">整合資訊</span></div>
    <div class="os-step"><span class="os-icon">🚀</span><span class="os-name">進化</span><span class="os-desc">更強適應</span></div>
  </div>

  <div class="slabel" style="margin-top:1.5rem">選擇最困擾你的身體訊號（可多選）</div>

  <div class="signal-grid" id="sig-grid"></div>
  <button class="btn-primary" id="btn-next" disabled>進入訊號診斷 →</button>
</div>

<!-- PHASE 2: QUESTIONS -->
<div class="phase" id="p2">
  <div id="q-body"></div>
  <div class="nav-row">
    <button class="btn-back" onclick="go(1)">← 重新選擇</button>
    <button class="btn-primary" style="flex:2;margin-top:0" onclick="showResult()">查看我的修復方案 →</button>
  </div>
</div>

<!-- PHASE 3: RESULT -->
<div class="phase" id="p3">
  <div id="result-body"></div>
  <button class="btn-restart" onclick="restart()">↺ 重新診斷</button>
</div>

</div>

<div class="footer">
  資訊僅供參考，不能用來診斷和治療任何形式的身體不適。如有不適請線下及時就醫。<br>
  購買連結：7-11 賣貨便 · 安全取貨付款
</div>

       det:'鎂是催產素受體正常運作的必要輔因子。長期壓力大量消耗鎂，而缺鎂讓催產素受體敏感度下降，即使身處關係中也感受不到連結。補鎂讓催產素的「連結訊號」真正被細胞接收。',
       why:'有連結的人卻感受不到溫暖，可能是催產素受體系統受損。鎂幫助受體重新敏感，讓連結被真實感受到。',
       price:'NT$1,350',spec:'粉包 一袋30包'},
      {n:'丁酸鈉複合包',ico:'🧱',bg:'rgba(184,134,11,0.15)',mech:'腸腦軸催產素調節',
       det:'催產素不只在大腦分泌，腸道也有催產素受體，腸道健康直接影響催產素系統的效率。丁酸鈉修復腸壁完整性，降低腸漏，同時調控Treg免疫細胞，減少影響催產素系統的慢性發炎。',
       why:'腸道是「第二大腦」，也是催產素系統的重要節點。修復腸道，讓連結訊號的傳遞更清晰有力。',
       price:'NT$890',spec:'一包6克 / 一袋30包'},
      {n:'亞麻仁油',ico:'🌿',bg:'rgba(0,150,100,0.15)',mech:'細胞膜流動催產素受體',
       det:'催產素受體嵌在細胞膜上，需要充足的Omega-3維持細胞膜流動性，讓受體保持靈活和敏感。Omega-3缺乏時細胞膜僵化，催產素的訊號傳遞效率降低，連結感因此難以被感受。',
       why:'讓催產素訊號真正被細胞接收，需要健康的細胞膜。Omega-3是讓這個接收天線保持靈敏的關鍵。',
       price:'NT$780',spec:'2瓶一組各500CC'},
    ]
  },
];

const SYSTEMS=['全部','驅動系統','調節系統','連結系統'];
let picked=[],answers={},phase=1;

function initTabs(){
  const ct=document.getElementById('sys-tabs');
  SYSTEMS.forEach((s,i)=>{
    const btn=document.createElement('button');
    btn.className='sys-tab'+(i===0?' active':'');
    btn.textContent=s; btn.dataset.sys=s;
    btn.onclick=()=>{
      document.querySelectorAll('.sys-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderGrid(s);
    };
    ct.appendChild(btn);
  });
}

function renderGrid(sys){
  const g=document.getElementById('sig-grid'); g.innerHTML='';
  const list=sys==='全部'?SIGNALS:SIGNALS.filter(s=>s.sys===sys.replace('系統',''));
  list.forEach(s=>{
    const card=document.createElement('div');
    card.className='sig-card'+(picked.includes(s.id)?' picked':'');
    card.dataset.id=s.id;
    card.innerHTML=`<span class="sig-icon">${s.icon}</span><div class="sig-name">${s.name}</div><div class="sig-role">${s.role}</div><div class="sig-q">「${s.q}」</div>`;
    card.onclick=()=>toggleSig(s.id,card);
    g.appendChild(card);
  });
}

function toggleSig(id,card){
  const idx=picked.indexOf(id);
  if(idx===-1){picked.push(id);card.classList.add('picked');}
  else{picked.splice(idx,1);card.classList.remove('picked');}
  document.getElementById('pcount').textContent=picked.length+' 已選';
  document.getElementById('btn-next').disabled=picked.length===0;
  updateProg();
}

function go(n){
  document.querySelectorAll('.phase').forEach(p=>p.classList.remove('active'));
  document.getElementById('p'+n).classList.add('active');
  phase=n; updateProg();
  window.scrollTo({top:0,behavior:'smooth'});
}
function updateProg(){
  const p=phase===1?8:phase===2?48:100;
  document.getElementById('prog').style.width=p+'%';
}

document.getElementById('btn-next').onclick=()=>{buildDiag();go(2);};

function buildDiag(){
  const body=document.getElementById('q-body'); body.innerHTML='';
  picked.forEach(id=>{
    const s=SIGNALS.find(x=>x.id===id);
    const blk=document.createElement('div'); blk.className='q-block';
    blk.innerHTML=`<div class="q-sig-header"><span class="q-sig-icon">${s.icon}</span><span class="q-sig-name">${s.name}｜${s.role}</span><span class="q-sig-role">「${s.q}」</span></div>`;
    const ql=document.createElement('div'); ql.className='q-list';
    s.qs.forEach((q,qi)=>{
      const key=id+'_'+qi;
      const item=document.createElement('div'); item.className='q-item';
      const opts=q.opts.map((o,oi)=>`<button class="q-opt" onclick="pickOpt(this,'${key}',${oi})">${o}</button>`).join('');
      item.innerHTML=`<div class="q-text">${q.q}</div><div class="q-opts">${opts}</div>`;
      ql.appendChild(item);
    });
    blk.appendChild(ql); body.appendChild(blk);
  });
}

function pickOpt(btn,key,val){
  btn.closest('.q-opts').querySelectorAll('.q-opt').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel'); answers[key]=val;
}

function calcScore(id){
  const s=SIGNALS.find(x=>x.id===id);
  let t=0,c=0;
  s.qs.forEach((_,qi)=>{const k=id+'_'+qi;if(answers[k]!==undefined){t+=answers[k];c++;}});
  if(!c)return 72;
  return Math.round(100-(t/c/3)*78);
}

function showResult(){
  const body=document.getElementById('result-body'); body.innerHTML='';
  const scores=picked.map(id=>({id,score:calcScore(id)}));
  const avg=Math.round(scores.reduce((s,x)=>s+x.score,0)/scores.length);
  const doff=Math.round(251*(1-avg/100));
  const sc=avg>=72?'#1a7a2a':avg>=45?'#B8860B':'#A32D2D';
  const lbl=avg>=72?'生命系統運作良好':avg>=45?'部分訊號需要修復':'多個訊號需要重設';
  const desc=avg>=72?'你的身體訊號系統有一定穩定性，以下方案幫你持續優化':avg>=45?'部分訊號偏離最佳區間，及早介入效果最好':'多個訊號需要系統性修復，穩定×差異×糾錯×更新×進化';

  body.innerHTML=`
    <div class="result-hero">
      <div class="rh-ring">
        <svg viewBox="0 0 90 90"><circle cx="45" cy="45" r="40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="5"/><circle cx="45" cy="45" r="40" fill="none" stroke="${sc}" stroke-width="5" stroke-dasharray="251" stroke-dashoffset="${doff}" stroke-linecap="round" transform="rotate(-90 45 45)"/></svg>
        <div class="rh-num">${avg}</div>
      </div>
      <div class="rh-title">${lbl}</div>
      <div class="rh-desc">${desc}</div>
    </div>
    <div class="slabel">三大子系統分佈</div>
    <div class="three-sys">
      <div class="ts-card"><div class="ts-title">⚡ 驅動系統</div><div class="ts-items">多巴胺・腎上腺素<br>皮質醇・睪固酮・內啡肽<br>讓你出發、行動、撐住</div></div>
      <div class="ts-card"><div class="ts-title">🎛 調節系統</div><div class="ts-items">甲狀腺素・胰島素<br>生長激素・褪黑激素<br>讓你跑對速度、修復升級</div></div>
      <div class="ts-card"><div class="ts-title">🤝 連結系統</div><div class="ts-items">血清素・催產素・雌激素<br>讓你安全、信任、合作</div></div>
    </div>
    <div class="slabel">你的訊號診斷結果</div>
    <div id="sig-results"></div>
  `;

  const container=document.getElementById('sig-results');
  const sorted=[...scores].sort((a,b)=>a.score-b.score);
  sorted.forEach(({id,score})=>{
    const s=SIGNALS.find(x=>x.id===id);
    const bc=score>=72?'s-hi':score>=45?'s-md':'s-lo';
    const nc=score>=72?'#1a7a2a':score>=45?'#B8860B':'#A32D2D';
    const urg=score<45?'需要重設':score<72?'需要修復':'維持優化';

    const card=document.createElement('div'); card.className='sig-result-card';
    card.innerHTML=`
      <div class="src-header">
        <span class="src-icon">${s.icon}</span>
        <div class="src-info">
          <div class="src-name">${s.name}</div>
          <div class="src-role">${s.role} · 「${s.q}」</div>
        </div>
        <div class="src-score-area">
          <div style="font-size:10px;background:rgba(${score<45?'163,45,45':score<72?'184,134,11':'26,122,42'},0.12);padding:2px 8px;border-radius:100px;color:${nc};font-weight:700;margin-bottom:3px;text-align:right">${urg}</div>
          <div class="src-score-num" style="color:${nc}">${score}<span style="font-size:12px;opacity:0.4">/100</span></div>
          <div class="src-bar-wrap"><div class="src-bar ${bc}" style="width:0%" data-w="${score}%"></div></div>
        </div>
      </div>
      <div style="padding:0 16px 4px">
        <div class="rtabs" id="tabs_${id}">
          <button class="rtab active" onclick="sw('${id}','edu',this)">📖 教育</button>
          <button class="rtab" onclick="sw('${id}','meth',this)">🛠 方法</button>
          <button class="rtab" onclick="sw('${id}','nut',this)">⚗️ 修復</button>
        </div>
      </div>
      <div class="tab-panel active" id="edu_${id}">
        <div class="essence-box"><div class="essence-label">一句話本質</div><div class="essence-text">${s.essence}</div></div>
        <div class="formula-box">
          <div class="formula-title">運作公式</div>
          <div class="formula-steps">
            ${s.formula.map((f,i)=>`<div class="fs-step">${i>0?'<span class="fs-arr">↓</span>':''}<span>${f}</span></div>`).join('')}
          </div>
        </div>
        <div class="spectrum-grid">
          <div class="spec-card spec-low">
            <div class="spec-title">⚠ 訊號缺乏時</div>
            ${s.low_traits.map(t=>`<div class="spec-item">${t}</div>`).join('')}
          </div>
          <div class="spec-card spec-high">
            <div class="spec-title">🔺 訊號過高時</div>
            ${s.high_traits.map(t=>`<div class="spec-item">${t}</div>`).join('')}
          </div>
        </div>
        <div class="optimal-box"><div class="optimal-title">最佳區間</div><div class="optimal-text">${s.optimal}</div></div>
      </div>
      <div class="tab-panel" id="meth_${id}">
        <div class="method-steps">
          ${s.methods.map((m,i)=>`
            <div class="ms-card">
              <div class="ms-num">${i+1}</div>
              <div class="ms-body"><div class="ms-title">${m.t}</div><div class="ms-desc">${m.d}</div></div>
            </div>
          `).join('')}
        </div>
        <div class="wisdom-box"><div class="wb-title">終極智慧</div><div class="wb-text">${s.wisdom}</div></div>
      </div>
      <div class="tab-panel" id="nut_${id}">
        <div class="nut-list" id="nuts_${id}"></div>
      </div>
    `;
    container.appendChild(card);

    const nutContainer=card.querySelector('#nuts_'+id);
    s.nutrients.forEach((n,ni)=>{
      const nid=id+'_n'+ni;
      const nc2=document.createElement('div'); nc2.className='nut-card';
      nc2.innerHTML=`
        <div class="nut-top" onclick="toggleNut('${nid}')">
          <div class="nut-ico" style="background:${n.bg}">${n.ico}</div>
          <div class="nut-info">
            <div class="nut-name">${n.n}</div>
            <div class="nut-mech">${n.mech}</div>
            <div class="nut-price">${n.price} · ${n.spec}</div>
          </div>
          <span class="nut-exp" id="exp_${nid}">▾</span>
          <a class="nut-cta" href="${SHOP}" target="_blank" rel="noopener" onclick="event.stopPropagation()">購買</a>
        </div>
        <div class="nut-detail" id="${nid}">
          <div class="nut-mbox"><div class="nut-mt">作用機制</div><div class="nut-mb">${n.det}</div></div>
          <div class="nut-why"><div class="nut-wt">為什麼你的訊號系統現在需要它</div><div class="nut-wb">${n.why}</div></div>
          <div class="buy-block">
            <div class="bb-info">
              <div class="bb-name">${n.n}</div>
              <div class="bb-price">${n.price}</div>
              <div class="bb-spec">${n.spec}</div>
              <div class="bb-store">📦 7-11 賣貨便取貨付款</div>
            </div>
            <a class="btn-buy-full" href="${SHOP}" target="_blank" rel="noopener">立即購買 →</a>
          </div>
        </div>
      `;
      nutContainer.appendChild(nc2);
    });
  });

  go(3);
  setTimeout(()=>{
    document.querySelectorAll('.src-bar').forEach(b=>{
      b.style.transition='width 1s ease';
      b.style.width=b.dataset.w;
    });
  },300);
}

function sw(id,tab,btn){
  ['edu','meth','nut'].forEach(t=>document.getElementById(t+'_'+id).classList.toggle('active',t===tab));
  document.querySelectorAll('#tabs_'+id+' .rtab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function toggleNut(id){
  const el=document.getElementById(id);
  el.classList.toggle('open');
  const exp=document.getElementById('exp_'+id);
  if(exp)exp.textContent=el.classList.contains('open')?'▴':'▾';
}
function restart(){
  picked=[];answers={};
  document.querySelectorAll('.sig-card').forEach(c=>c.classList.remove('picked'));
  document.getElementById('pcount').textContent='0 已選';
  document.getElementById('btn-next').disabled=true;
  go(1);
}

initTabs();
renderGrid('全部');
</script>
</body>
</html>
