<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>能力診斷系統 — 癌友+大眾</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 50px 30px;
            text-align: center;
        }
        .header h1 { font-size: 36px; margin-bottom: 12px; font-weight: 800; }
        .header .subtitle { font-size: 16px; opacity: 0.95; line-height: 1.8; }
        .content { padding: 40px 30px; min-height: 600px; }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* 路線卡片 */
        .route-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin: 40px 0; }
        .route-card {
            padding: 40px;
            border: 4px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        .route-card:hover {
            border-color: #667eea;
            box-shadow: 0 12px 36px rgba(102, 126, 234, 0.25);
            transform: translateY(-5px);
        }
        .route-card h3 { font-size: 26px; font-weight: 800; color: #333; margin-bottom: 15px; }
        .route-card p { font-size: 16px; color: #666; line-height: 1.8; }
        
        /* 導航標籤 */
        .nav-tabs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            margin-bottom: 30px;
        }
        .nav-tab {
            padding: 14px;
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            text-align: center;
            font-weight: 700;
            transition: all 0.2s;
        }
        .nav-tab:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }
        .nav-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }
        
        /* 問題區塊 */
        .question-block {
            margin-bottom: 25px;
            padding: 24px;
            background: #f9f9f9;
            border-left: 6px solid #667eea;
            border-radius: 8px;
        }
        .question-id { font-size: 13px; color: #999; font-weight: 700; background: #e8e8e8; padding: 4px 10px; border-radius: 3px; display: inline-block; }
        .question-title { font-size: 18px; font-weight: 700; color: #333; margin: 10px 0; }
        .quote-box {
            background: white;
            padding: 16px;
            border-left: 4px solid #f5576c;
            border-radius: 6px;
            margin: 12px 0;
            font-size: 15px;
            color: #555;
            font-style: italic;
            line-height: 1.8;
            font-weight: 600;
        }
        .comparison-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 14px 0;
        }
        .error-box {
            background: #fff3cd;
            padding: 14px;
            border-left: 4px solid #ffc107;
            border-radius: 6px;
            font-size: 14px;
            color: #664d03;
            line-height: 1.7;
            font-weight: 500;
        }
        .error-box strong { display: block; margin-bottom: 6px; }
        .updated-box {
            background: #d4edda;
            padding: 14px;
            border-left: 4px solid #28a745;
            border-radius: 6px;
            font-size: 14px;
            color: #155724;
            line-height: 1.7;
            font-weight: 500;
        }
        .updated-box strong { display: block; margin-bottom: 6px; }
        .limitation-leverage {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 14px 0;
        }
        .limitation-item {
            background: #fff0f3;
            padding: 14px;
            border-radius: 6px;
            font-size: 14px;
            color: #c5192d;
            line-height: 1.7;
            font-weight: 500;
        }
        .limitation-item strong { display: block; margin-bottom: 6px; }
        .leverage-item {
            background: #d1f3d1;
            padding: 14px;
            border-radius: 6px;
            font-size: 14px;
            color: #206b20;
            line-height: 1.7;
            font-weight: 500;
        }
        .leverage-item strong { display: block; margin-bottom: 6px; }
        .capability-badge {
            display: inline-block;
            padding: 7px 14px;
            background: #e3f2fd;
            color: #1976d2;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 10px;
        }
        
        /* 按鈕 */
        .button-group {
            display: flex;
            gap: 15px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        button {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            min-width: 120px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(102, 126, 234, 0.35);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #e0e0e0;
            font-weight: 700;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        /* 社群區塊 */
        .community-block {
            margin-top: 50px;
            padding: 40px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 12px;
            text-align: center;
            color: white;
        }
        .community-block h2 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 15px;
        }
        .community-block p {
            font-size: 16px;
            margin-bottom: 25px;
            line-height: 1.8;
            font-weight: 500;
        }
        .community-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: center;
            margin: 20px 0;
        }
        
        /* 響應式 */
        @media (max-width: 768px) {
            .content { padding: 25px 15px; }
            .header { padding: 35px 15px; }
            .header h1 { font-size: 26px; }
            .header .subtitle { font-size: 14px; }
            .route-grid,
            .comparison-grid,
            .limitation-leverage,
            .nav-tabs { grid-template-columns: 1fr; }
            .button-group { flex-direction: column; }
            button { width: 100%; }
            .question-title { font-size: 16px; }
            .quote-box { font-size: 14px; }
            .community-block {
                padding: 25px;
                margin-top: 30px;
            }
            .community-block h2 {
                font-size: 22px;
            }
            .community-block p {
                font-size: 14px;
            }
            .community-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>

                </div>

                <div style="margin-top: 50px; padding: 40px; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); border-radius: 12px; text-align: center; color: white;">

                        每週有專業醫療人員駐診，有問題可直接提問
                    </p>
                    
                    <a href="https://line.me/R/ti/g/4-yfOVEEh6" target="_blank" style="display: inline-block; padding: 20px 50px; background: white; color: #f5576c; border-radius: 10px; font-size: 20px; font-weight: 800; text-decoration: none; transition: all 0.3s; cursor: pointer; margin-bottom: 20px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);">

            <!-- 癌友診斷頁 -->
            <div id="cancer-page" class="page">
                <h2 style="font-size: 24px; color: #333; margin-bottom: 25px; font-weight: 800;">🏥 癌友100題</h2>
                <div class="nav-tabs" id="cancer-nav"></div>
                <div id="cancer-questions"></div>
                <div class="button-group">
                    <button class="btn-secondary" onclick="goHome()">返回首頁</button>

            <!-- 大眾診斷頁 -->
            <div id="wellness-page" class="page">
                <h2 style="font-size: 24px; color: #333; margin-bottom: 25px; font-weight: 800;">🌈 大眾生活版</h2>
                <div class="nav-tabs" id="wellness-nav"></div>
                <div id="wellness-questions"></div>
                <div class="button-group">
                    <button class="btn-secondary" onclick="goHome()">返回首頁</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== 癌友版題庫（簡化版本） ==========
        const cancerTopics = {
            'A': { title: '剛確診 01-10', questions: [
                { id: 'A01', title: '大腦當機', quote: '先穩住自己，不用一天搞懂全部。', wrong: '我必須立刻搞清楚所有癌症的事', right: '先知道病是什麼、下一步要做什麼就好', stuck: '恐慌', key: '確定下一步', skill: '穩住心神' },
                { id: 'A02', title: '資訊爆炸', quote: '看得越多，反而越不知道信誰。', wrong: '看越多資訊就越安全', right: '先看跟自己決定有關的就夠', stuck: '被資訊淹沒', key: '挑有用的資訊', skill: '分辨資訊' },

                { id: 'A10', title: '什麼都控制不了', quote: '控制不了全部，不代表什麼都做不了。', wrong: '癌症來了我什麼都沒辦法', right: '把注意力放在自己真的能做的事', stuck: '無力感', key: '專注能控制的事', skill: '找到自己能做的' }

        // 全局狀態
        let currentRoute = null;
        let currentCategory = null;

        // 開始診斷
        function startDiagnosis(route) {
            currentRoute = route;
            document.getElementById('landing-page').classList.remove('active');
            
            if (route === 'cancer') {
                document.getElementById('cancer-page').classList.add('active');
                renderCancerNav();
                renderCancerQuestions('A');
            } else {
                document.getElementById('wellness-page').classList.add('active');
                renderWellnessNav();
                renderWellnessQuestions('W1');
            }
        }

        // 癌友版
        function renderCancerNav() {
            const cats = Object.keys(cancerTopics);
            let html = '';
            cats.forEach(cat => {
                html += `<div class="nav-tab ${cat === 'A' ? 'active' : ''}" data-cat="${cat}" onclick="handleCancerNav(this)">${cancerTopics[cat].title}</div>`;
            });
            document.getElementById('cancer-nav').innerHTML = html;
        }

        function handleCancerNav(el) {
            const cat = el.getAttribute('data-cat');
            document.querySelectorAll('#cancer-nav .nav-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            renderCancerQuestions(cat);
        }

        function renderCancerQuestions(cat) {
            currentCategory = cat;
            const qs = cancerTopics[cat].questions;
            let html = '';
            qs.forEach(q => {
                html += `<div class="question-block">
                    <div style="margin-bottom: 10px;">
                        <span class="question-id">${q.id}</span>
                        <span class="question-title" style="margin-left: 12px;">${q.title}</span>
                    </div>
                    <div class="quote-box">💬 "${q.quote}"</div>
                    <div class="comparison-grid">
                        <div class="error-box"><strong>我原本以為</strong><br>${q.wrong}</div>
                        <div class="updated-box"><strong>後來發現</strong><br>${q.right}</div>
                    </div>
                    <div class="limitation-leverage">
                        <div class="limitation-item"><strong>卡住的地方</strong><br>${q.stuck}</div>
                        <div class="leverage-item"><strong>改變的關鍵</strong><br>${q.key}</div>
                    </div>
                    <span class="capability-badge">${q.skill}</span>
                </div>`;
            });
            document.getElementById('cancer-questions').innerHTML = html;
        }
