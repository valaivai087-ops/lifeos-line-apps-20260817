<aside><a class="brand" href="#library"><span class="brandmark">W<span>°</span></span><span>智慧生成 OS<small>WISDOM IN PRACTICE</small></span></a><div class="side-label">你的智慧練習室 · YOUR STUDIO</div><nav id="nav"></nav><div class="side-bottom"><div class="mini-orbit">✳</div><p>讓理解，成為行動。<small>Let understanding become action.</small></p><div class="progressline"><i id="sideProgress"></i></div><span id="sideCount"></span></div></aside>

<div id="toast" role="status"></div><script>window.DATA={"items": [{"id": 1, "zh": "觀察力", "wisdom": "看見實際發生的事", "action": "記錄三個事實", "group": 0, "essayTitle": "你看見的世界，未必是真正的世界", "essay": "人最大的盲點，不是沒有眼睛，而是太相信自己的眼睛。\n我們看見表情，卻看不見心事；看見行為，卻忽略處境；看見結果，卻不知道過程。\n當孩子考不好，你看見的是懶惰，還是他努力後仍然不懂？\n真正的觀察，不是急著解釋世界，而是允許世界修正自己。\n當你停止用偏見觀看，真相才有機會慢慢顯現。\n最小行動｜今天記錄三個事實，不加入任何評價。", "en": "Observation", "wisdomEn": "See what actually happens.", "actionEn": "Record three facts.", "essayTitleEn": "The world you see may not be the world as it is.", "essayEn": "Our greatest blind spot is trusting our eyes too much. We see expressions but miss feelings, actions but overlook circumstances, results but miss the process. When a child struggles at school, do you see laziness or effort without understanding? Observation means allowing the world to revise your view before rushing to explain it. Set prejudice aside so truth can emerge. Small action: record three facts today without judging them."}, {"id": 2, "zh": "注意力", "wisdom": "把心思放在重要事情", "action": "專心五分鐘", "group": 0, "essayTitle": "你把目光放在哪裡，人生就往哪裡生長", "essay": "人生最稀缺的資源，不一定是金錢，而是注意力。\n你注意缺點，世界就充滿缺陷；你注意機會，世界便開始出現道路。\n同樣一天，有人用來抱怨，有人用來創造。\n你以為自己被生活困住，是否其實是注意力被雜訊綁架？\n自由不是沒有干擾，而是能夠重新選擇焦點。\n把目光交給真正重要的事，生命才會長出自己的方向。\n最小行動｜每天選一件重要事情，專注五分鐘。", "en": "Attention", "wisdomEn": "Focus on what matters.", "actionEn": "Concentrate for five minutes.", "essayTitleEn": "Life grows toward whatever receives your attention.", "essayEn": "Our scarcest resource may be attention rather than money. Attend to flaws and the world fills with defects; attend to possibilities and paths appear. Some spend the same day complaining, others creating. Is life trapping you, or has noise captured your attention? Freedom includes choosing your focus again. Give your attention to what matters and let life find its direction. Small action: focus on one important task for five minutes daily."}, {"id": 3, "zh": "細節力", "wisdom": "看見容易忽略的訊號", "action": "找出一個小差異", "group": 0, "essayTitle": "命運的轉折，常藏在微小訊號裡", "essay": "真正的洞察，往往不是發現驚天動地的大事，而是看見別人忽略的小事。\n一句突然減少的問候，一次不同以往的沉默，一個反覆出現的錯誤。\n粗心的人只看結果，細心的人開始尋找變化。\n為什麼有些問題爆發時，我們才說早知道？\n因為訊號一直存在，只是我們沒有留意。\n智慧不是事後驚訝，而是事前願意看見。\n最小行動｜今天找出一個與平常不同的小變化。", "en": "Attention to detail", "wisdomEn": "Notice easily overlooked signals.", "actionEn": "Find one small difference.", "essayTitleEn": "Turning points often hide in small signals.", "essayEn": "Insight often means seeing small things others overlook: a greeting that disappears, an unfamiliar silence, a recurring mistake. Some only see outcomes; others notice changes. Why do we say we should have known only after trouble erupts? The signals were there, but we missed them. Wisdom is a willingness to notice beforehand. Small action: find one small change from the usual today."}, {"id": 4, "zh": "辨識力", "wisdom": "分清不同資訊", "action": "區分事實與猜測", "group": 0, "essayTitle": "真正困住你的，不是事實，而是你對事實的解釋", "essay": "別人沒有回訊息，是事實；他不重視你，是猜測。\n孩子考試失敗，是事實；他沒有前途，是推論。\n我們常把猜測當真相，把情緒當證據，把一次事件當成永恆命運。\n可是，你真的知道事情的全部嗎？\n成熟不是不再判斷，而是知道判斷可能出錯。\n當事實與想像重新分開，內心就多了一條自由的路。\n最小行動｜把今天一個煩惱分成「事實」與「猜測」。", "en": "Discernment", "wisdomEn": "Distinguish different kinds of information.", "actionEn": "Separate facts from guesses.", "essayTitleEn": "What traps you may be your interpretation of a fact.", "essayEn": "An unanswered message is a fact; being unimportant to someone is a guess. A failed exam is a fact; having no future is an inference. We turn guesses into truth, feelings into evidence, and one event into destiny. Do you know the whole situation? Maturity means knowing your judgments can be mistaken. Separate events from imagination and another path to freedom opens. Small action: divide one worry into facts and guesses."}, {"id": 5, "zh": "篩選力", "wisdom": "留下真正有用的資訊", "action": "刪除一項雜訊", "group": 0, "essayTitle": "真正的清醒，不是知道更多，而是留下重要的", "essay": "資訊愈多，未必代表智慧愈高。\n你可以每天閱讀一百篇文章，卻仍不知道下一步該做什麼。\n有些資訊讓你清醒，有些資訊只是讓你焦慮。\n有些聲音提供方向，有些聲音只是不斷消耗注意力。\n難道把所有資訊裝進腦袋，就叫成長嗎？\n真正的智慧，是讓重要訊號穿過雜訊，抵達行動。\n最小行動｜今天刪除一項沒有幫助的資訊干擾。", "en": "Filtering", "wisdomEn": "Keep information that is useful.", "actionEn": "Remove one source of noise.", "essayTitleEn": "Clarity means keeping what matters.", "essayEn": "More information does not necessarily mean more wisdom. You can read a hundred articles and still not know your next step. Some information brings clarity; some brings anxiety. Some voices offer direction; others drain attention. Is filling your mind with everything really growth? Let meaningful signals pass through noise and reach action. Small action: remove one unhelpful information distraction today."}, {"id": 6, "zh": "閱讀力", "wisdom": "讀懂內容與重點", "action": "用一句話摘要", "group": 1, "essayTitle": "讀懂一本書，不如讓一本書改變一個選擇", "essay": "閱讀的目的，不是收藏別人的智慧，而是更新自己的世界。\n有人讀完一本書，只記住金句；有人讀完一頁，便重新理解人生。\n前者增加知識，後者改變模型。\n如果讀了那麼多道理，遇到衝突仍然只會責怪別人，究竟讀懂了什麼？\n真正的閱讀，是讓文字走出紙張，進入生活。\n當知識開始改變行動，書才真正被讀完。\n最小行動｜閱讀一段文字，用一句話寫出可實踐的重點。", "en": "Reading", "wisdomEn": "Understand meaning and key points.", "actionEn": "Summarize in one sentence.", "essayTitleEn": "Let a book change a choice.", "essayEn": "Reading aims to renew your world, not simply collect another person's wisdom. Some finish a book remembering quotations; others read a page and rethink life. One accumulates knowledge; the other revises a model. If reading never changes how you handle conflict, what have you understood? Let words leave the page and enter life. A book becomes fully read when knowledge changes action. Small action: summarize one passage as a practical point."}, {"id": 7, "zh": "聆聽力", "wisdom": "理解別人真正說什麼", "action": "先重述對方意思", "group": 1, "essayTitle": "你聽見的是聲音，還是一個人的世界？", "essay": "很多對話之所以失敗，不是因為沒有人說話，而是沒有人真正聆聽。\n孩子說不想上學，你聽成叛逆；伴侶說很累，你聽成抱怨。\n我們急著回答，急著糾正，急著證明自己理解。\n可是，你真的知道對方想表達什麼嗎？\n聆聽不是放棄立場，而是先讓對方的世界有機會被理解。\n有時候，一個人需要的不是答案，而是終於有人聽懂。\n最小行動｜回應之前，先用一句話重述對方的意思。", "en": "Listening", "wisdomEn": "Understand what someone means.", "actionEn": "Restate their meaning first.", "essayTitleEn": "Do you hear a sound or another person's world?", "essayEn": "Many conversations fail because no one truly listens. A child dislikes school and you hear rebellion; a partner feels tired and you hear complaint. We hurry to answer, correct, and demonstrate understanding. But do you know what they mean? Listening gives another person's world room to be understood. Sometimes people need understanding before answers. Small action: restate their meaning in one sentence before responding."}, {"id": 8, "zh": "分類力", "wisdom": "把相似資訊放一起", "action": "整理三個類別", "group": 1, "essayTitle": "混亂不是事情太多，而是事情沒有找到位置", "essay": "當所有問題混在一起，再聰明的人也容易疲憊。\n工作、家庭、情緒、金錢、健康，每件事情都在腦海裡爭奪位置。\n你以為自己沒有能力，其實可能只是缺少分類。\n分類不是把世界切碎，而是讓不同問題找到適合的處理方式。\n當情緒不再冒充事實，當急事不再冒充要事，秩序便開始生成。\n真正的清楚，是讓每件事回到它應在的位置。\n最小行動｜把今天的煩惱整理成三個類別。", "en": "Classification", "wisdomEn": "Put similar information together.", "actionEn": "Create three categories.", "essayTitleEn": "Confusion may mean things have no place.", "essayEn": "When every problem mixes together, anyone can feel exhausted. Work, family, emotions, money, and health compete for space. What feels like inability may be missing categories. Classification gives different problems suitable ways of being handled. When feelings stop posing as facts and urgency stops posing as importance, order emerges. Clarity lets each thing find its place. Small action: sort today's worries into three categories."}, {"id": 9, "zh": "比較力", "wisdom": "找出相同與不同", "action": "比較兩種方法", "group": 1, "essayTitle": "沒有比較的選擇，往往只是習慣", "essay": "你以為自己正在選擇，其實可能只是在重複。\n因為熟悉，所以繼續；因為害怕，所以不變；因為大家都做，所以跟隨。\n但熟悉就代表適合嗎？\n比較不是為了證明誰比較好，而是辨認不同選項的代價與邊界。\n當你願意把兩條道路放在眼前，原本唯一的答案就不再唯一。\n智慧從來不是盲目堅持，而是看見選擇的空間。\n最小行動｜比較今天兩種做法，各寫一項優點與限制。", "en": "Comparison", "wisdomEn": "Identify similarities and differences.", "actionEn": "Compare two methods.", "essayTitleEn": "A choice without comparison may be a habit.", "essayEn": "You may think you are choosing while simply repeating: continuing because something is familiar, avoiding change through fear, following because everyone does. Does familiar mean suitable? Comparison reveals each option's costs and limits. Put two paths before you and the supposedly only answer becomes one among several. Wisdom sees room for choice. Small action: compare two approaches and write one advantage and limitation for each."}, {"id": 10, "zh": "查證力", "wisdom": "確認資訊是否可靠", "action": "查核一項來源", "group": 1, "essayTitle": "不要把相信，誤認成知道", "essay": "最危險的錯誤，不一定來自無知，而是來自過度確信。\n一篇文章寫得動人，不代表內容正確；一個人說得自信，不代表證據充分。\n我們容易相信符合期待的消息，排斥挑戰信念的資料。\n可是，真相有義務符合你的喜好嗎？\n真正的查證，是讓自己的判斷接受外部世界的檢驗。\n願意修正相信的事，才有機會更接近真實。\n最小行動｜今天選一個重要說法，查核原始來源。", "en": "Verification", "wisdomEn": "Check whether information is reliable.", "actionEn": "Check one original source.", "essayTitleEn": "Do not mistake belief for knowledge.", "essayEn": "Dangerous mistakes can arise from certainty rather than ignorance. Moving prose need not be accurate; confident speech need not have evidence. We welcome news that fits our hopes and reject material that challenges belief. Must truth suit your preferences? Verification lets the outside world examine your judgment. A willingness to revise belief can bring you closer to reality. Small action: check the original source of one important claim."}, {"id": 11, "zh": "提問力", "wisdom": "發現值得問的問題", "action": "提出一個為什麼", "group": 2, "essayTitle": "答案讓思考停止，問題讓智慧開始", "essay": "一個人最可惜的，不是沒有答案，而是失去提問的能力。\n學生問怎麼考高分，卻不問自己為何學不會。\n大人問怎麼賺更多，卻不問自己究竟想過什麼生活。\n我們不停追逐答案，卻很少檢查問題本身。\n如果問題問錯了，再努力回答又有什麼用？\n智慧的起點，不是急著解決，而是先問出真正值得解決的事。\n最小行動｜今天對一個習以為常的現象提出「為什麼」。", "en": "Questioning", "wisdomEn": "Find a question worth asking.", "actionEn": "Ask why once.", "essayTitleEn": "Questions let wisdom begin.", "essayEn": "Losing the ability to question can matter more than lacking answers. Students ask how to score higher without asking why learning is difficult. Adults ask how to earn more without asking what life they want. We chase answers while overlooking the questions. What is the value of answering the wrong question? Wisdom begins by identifying what deserves attention. Small action: ask why about something you usually take for granted."}, {"id": 12, "zh": "追問力", "wisdom": "繼續尋找深層原因", "action": "連續追問三次", "group": 2, "essayTitle": "真正的問題，常藏在第一個答案後面", "essay": "孩子不寫作業，因為懶惰？\n為什麼懶惰？可能因為不會。\n為什麼不會？可能因為基礎缺口一直沒有補上。\n如果停在第一個答案，我們只會責備；如果繼續追問，才可能找到方法。\n追問不是無止境地懷疑，而是逐步檢查解釋是否充分。\n當問題一層層打開，責怪便可能轉化為理解。\n真正的洞察，從不滿足於最方便的答案。\n最小行動｜針對一個問題連續追問三次，並檢查證據。", "en": "Follow-up questioning", "wisdomEn": "Look for deeper reasons.", "actionEn": "Ask three follow-up questions.", "essayTitleEn": "The real problem may lie beyond the first answer.", "essayEn": "A child avoids homework because of laziness? Ask again: perhaps they cannot do it. Why not? Perhaps foundations were never repaired. Stop at the first answer and blame follows; continue asking and a useful approach may appear. Follow-up questions examine whether an explanation is sufficient. As layers open, blame can turn into understanding. Insight looks beyond the most convenient answer. Small action: ask three follow-up questions and check the evidence."}, {"id": 13, "zh": "質疑力", "wisdom": "檢查習以為常的答案", "action": "問一次真的嗎", "group": 2, "essayTitle": "你最需要懷疑的，可能是最熟悉的答案", "essay": "有些觀念陪伴我們太久，久到忘了它們也可能出錯。\n努力一定成功嗎？忍耐一定值得嗎？多做一定比較好嗎？\n這些話或許曾經有用，卻未必適合所有情境。\n如果一套方法不再有效，你還要用多少失敗證明忠誠？\n質疑不是反對一切，而是拒絕讓舊答案永久掌權。\n真正成熟的人，敢讓自己的信念接受檢驗。\n最小行動｜找出一句自己常說的話，問一次「真的總是如此嗎」。", "en": "Critical questioning", "wisdomEn": "Examine familiar answers.", "actionEn": "Ask whether it is really true.", "essayTitleEn": "Question your most familiar answers.", "essayEn": "Some beliefs stay so long that we forget they may be wrong. Does effort always succeed? Is endurance always worthwhile? Is doing more always better? These sayings can help in some situations without fitting all. If a method no longer works, how many failures must prove your loyalty? Questioning keeps old answers open to review. Maturity lets beliefs be examined. Small action: ask whether one familiar saying is always true."}, {"id": 14, "zh": "反問力", "wisdom": "換個問題重新思考", "action": "提出一個反向問題", "group": 2, "essayTitle": "換一個問題，可能就換了一個人生", "essay": "當你問「為什麼沒有人幫我」，注意力便停在缺少什麼。\n當你改問「我還能建立什麼資源」，行動空間便開始出現。\n同樣的困境，不同的提問，可能導向完全不同的道路。\n你要繼續問誰應該負責，還是開始問自己能改變什麼？\n反問不是否定痛苦，而是重新尋找可控制的變數。\n當問題轉向可能性，人生便不必停在原地。\n最小行動｜把今天一個抱怨改寫成可行動的問題。", "en": "Reversing a question", "wisdomEn": "Rethink through a different question.", "actionEn": "Ask one reverse question.", "essayTitleEn": "Change a question and a path may change.", "essayEn": "Ask why nobody helps and your attention stays on what is missing. Ask what resources you could build and room for action appears. Different questions can lead the same difficulty toward different paths. Will you only ask who is responsible, or also what you can change? Reversing a question acknowledges pain while seeking influence. Possibility allows movement. Small action: turn one complaint into an actionable question."}, {"id": 15, "zh": "重構問題力", "wisdom": "找出真正需要解決的事", "action": "重寫原本的問題", "group": 2, "essayTitle": "你以為要解決的，可能根本不是問題", "essay": "孩子成績不好，你想增加考卷。\n員工效率低，你想增加監督。\n伴侶不願溝通，你想增加說服。\n可是，如果真正的瓶頸是方法、信任或需求不一致呢？\n用錯問題設計答案，只會讓努力變成新的消耗。\n重構問題，是從表面症狀重新尋找真正的限制。\n有時候，人生最大的突破，不是找到新答案，而是終於問對問題。\n最小行動｜把一個困境重新寫成「真正需要改善的是什麼」。", "en": "Problem reframing", "wisdomEn": "Identify what needs to be solved.", "actionEn": "Rewrite the original problem.", "essayTitleEn": "What you are solving may not be the real problem.", "essayEn": "Poor grades prompt more worksheets; slow work prompts more supervision; a quiet partner prompts more persuasion. But what if the constraint is a method, trust, or mismatched needs? Answers built around the wrong problem can create more exhaustion. Reframing looks beneath symptoms for what limits change. A breakthrough can come from finally asking the right question. Small action: rewrite a difficulty as what truly needs improvement."}, {"id": 16, "zh": "推理力", "wisdom": "由證據形成結論", "action": "寫出理由與結論", "group": 3, "essayTitle": "結論不是智慧，知道結論如何形成才是", "essay": "有人說孩子不努力，因為成績下降。\n有人說市場會上漲，因為昨天上漲。\n有人說對方不愛自己，因為一次冷淡。\n但這些結論，真的能從證據推出來嗎？\n推理不是把想法說得漂亮，而是讓每一步都有理由。\n當理由不足，就保留不確定；當證據改變，就調整判斷。\n真正有力量的思考，不怕別人追問「你怎麼知道」。\n最小行動｜寫下一個判斷，以及支持它的兩項證據。", "en": "Reasoning", "wisdomEn": "Build conclusions from evidence.", "actionEn": "Write the reasons and conclusion.", "essayTitleEn": "Understand how a conclusion is formed.", "essayEn": "Lower grades become proof of poor effort, yesterday's market rise predicts another, one cold response becomes proof of lost love. Do those conclusions follow? Reasoning gives each step a reason. Where reasons are weak, retain uncertainty; when evidence changes, revise judgment. Strong thinking welcomes the question of how you know. Small action: write one judgment and two pieces of supporting evidence."}, {"id": 17, "zh": "因果辨識力", "wisdom": "不把同時發生當成因果", "action": "找一種其他解釋", "group": 3, "essayTitle": "一起發生，不代表彼此造成", "essay": "成功的人每天早起，所以早起一定成功嗎？\n有人補充營養後感覺改善，所以改善一定來自補充品嗎？\n世界充滿同時變動的因素，卻不會自動告訴我們誰造成誰。\n把相關當因果，容易讓人迷信方法，也容易錯怪他人。\n真正的智慧，是願意尋找其他解釋，並檢查時間、條件與證據。\n看見關聯只是開始，理解機制才是更深的功課。\n最小行動｜對今天一個因果判斷，提出另一種可能解釋。", "en": "Causal discernment", "wisdomEn": "Avoid confusing co-occurrence with cause.", "actionEn": "Find another explanation.", "essayTitleEn": "Happening together does not establish causation.", "essayEn": "If successful people wake early, must early waking ensure success? If someone feels better after a supplement, must it explain the improvement? Many factors change together without revealing which produced which. Confusing association with cause can turn methods into superstition or blame the wrong person. Seek other explanations and examine timing, conditions, and evidence. Connections are a beginning. Small action: propose another explanation for one causal judgment."}, {"id": 18, "zh": "假設辨識力", "wisdom": "找出沒有說出口的前提", "action": "寫下一個隱藏假設", "group": 3, "essayTitle": "困住人的，往往是沒有說出口的前提", "essay": "「我一定要讓所有人滿意」，背後可能藏著「不被喜歡就沒有價值」。\n「孩子一定要第一名」，背後可能藏著「成績決定人生」。\n我們以為自己在追求目標，其實可能正在服從隱藏假設。\n如果前提從未被檢查，努力是否只是讓枷鎖更加牢固？\n真正的自由，是把看不見的信念帶到光下。\n當假設可以被修正，人生便有重新選擇的可能。\n最小行動｜寫下今天一個強烈想法背後的隱藏前提。", "en": "Assumption awareness", "wisdomEn": "Find unstated premises.", "actionEn": "Write one hidden assumption.", "essayTitleEn": "Unspoken premises can become a cage.", "essayEn": "Needing everyone to be pleased may hide a belief that being disliked removes your worth. Demanding top grades may hide a belief that scores determine life. Apparent goals may obey assumptions. If the premise is never examined, does effort tighten the cage? Bring hidden beliefs into the light. Revisable assumptions reopen choice. Small action: identify the hidden premise behind one strong thought today."}, {"id": 19, "zh": "矛盾辨識力", "wisdom": "發現說法與結果的落差", "action": "指出一個不一致", "group": 3, "essayTitle": "真正的成長，從看見自己不一致開始", "essay": "我們說重視健康，卻總是犧牲睡眠。\n我們說尊重孩子，卻不允許孩子有不同想法。\n我們說想要自由，卻害怕任何改變。\n矛盾不是用來羞辱自己的證據，而是模型需要更新的訊號。\n如果言語與行動長期分離，究竟哪一個才代表真正的選擇？\n看見不一致，不必急著自責。\n讓矛盾成為入口，人生才有重新整合的機會。\n最小行動｜找出一件「我說重要，卻沒有實踐」的事。", "en": "Contradiction awareness", "wisdomEn": "Notice gaps between claims and results.", "actionEn": "Name one inconsistency.", "essayTitleEn": "Growth begins by seeing your inconsistencies.", "essayEn": "We say health matters while sacrificing sleep, respect children while excluding disagreement, and want freedom while fearing change. Contradictions offer a place to revise understanding rather than a reason for humiliation. When words and actions diverge, what shows the actual choice? Notice the gap without rushing into blame. It may open a way to reintegrate life. Small action: find something you call important but have not practiced."}, {"id": 20, "zh": "反例思考力", "wisdom": "檢查結論是否總成立", "action": "尋找一個反例", "group": 3, "essayTitle": "一個反例，就能打開封閉的世界", "essay": "「沒有人值得信任」，真的嗎？\n「失敗的人永遠不會成功」，真的嗎？\n「我就是沒有能力」，真的嗎？\n當一句話使用永遠、一定、全部，我們便可能把複雜世界壓縮成單一結論。\n反例不是為了否定經驗，而是提醒經驗仍有邊界。\n只要存在另一種可能，人生就不必被一個故事完全定義。\n真正的清醒，是讓例外成為更新的起點。\n最小行動｜找出一個能挑戰自己絕對化信念的例子。", "en": "Counterexample thinking", "wisdomEn": "Check whether a conclusion always holds.", "actionEn": "Find one counterexample.", "essayTitleEn": "One exception can open a closed world.", "essayEn": "Nobody can be trusted? Failure lasts forever? You have no ability? Always, certainly, and everyone can squeeze a complex world into one conclusion. Counterexamples acknowledge the limits of experience. If another possibility exists, one story need not define your entire life. Clarity lets an exception become a point of renewal. Small action: find an example that challenges one absolute belief."}, {"id": 21, "zh": "表徵力", "wisdom": "把問題描述清楚", "action": "畫出問題簡圖", "group": 4, "essayTitle": "說不清的問題，往往也很難解決", "essay": "腦海裡的煩惱像一團線，愈想愈亂。\n你說自己壓力很大，但壓力究竟來自時間、關係、金錢，還是期待？\n當問題沒有形狀，我們只能反覆感受它。\n當問題被畫成圖、寫成句、拆成節點，新的關係便可能浮現。\n表徵不是替現實貼標籤，而是建立可以檢查的理解工具。\n把混亂放到紙上，思考才有機會找到入口。\n最小行動｜把一個煩惱畫成三個相連的方框。", "en": "Representation", "wisdomEn": "Describe a problem clearly.", "actionEn": "Draw a simple problem diagram.", "essayTitleEn": "An unclear problem is difficult to solve.", "essayEn": "Worries can feel like tangled thread. You feel stressed, but is the source time, relationships, money, or expectations? A shapeless problem can only be felt repeatedly. Draw it, write it, or divide it into parts and unseen connections may emerge. Representation offers a tool for examining understanding. Put confusion on paper so thought can find an entrance. Small action: draw one worry as three connected boxes."}, {"id": 22, "zh": "抽象力", "wisdom": "從個別事情找共同特徵", "action": "寫出一個共同規則", "group": 4, "essayTitle": "高手看見規則，而不只看見事件", "essay": "今天和同事衝突，明天和家人爭執，後天又與朋友誤會。\n你以為是三件不同的事，卻可能藏著同一個溝通模式。\n只記住事件的人，容易重複事件。\n能抽取共同特徵的人，才可能改變模式。\n為什麼相似的困境總是換個人物重新上演？\n抽象不是遠離生活，而是從生活中找到可以遷移的理解。\n看見規則，才能不再被每一次表象牽著走。\n最小行動｜找出兩件不同事件背後的一個共同模式。", "en": "Abstraction", "wisdomEn": "Find shared features across cases.", "actionEn": "Write one shared pattern.", "essayTitleEn": "Notice patterns beyond individual events.", "essayEn": "Conflict with a colleague, an argument at home, and a misunderstanding with a friend may share one communication pattern. Remember only the incidents and they may repeat; find their shared features and the pattern may change. Why does the same difficulty return with different people? Abstraction finds understanding that can travel between situations. Seeing patterns reduces dependence on appearances. Small action: find one shared pattern in two events."}, {"id": 23, "zh": "類比力", "wisdom": "用熟悉的事理解新問題", "action": "想一個生活比喻", "group": 4, "essayTitle": "智慧，是讓熟悉的世界照亮陌生的問題", "essay": "學習像種樹，不能每天挖開根部檢查。\n關係像存款，不能只提款卻從不投入。\n人生像導航，走錯路時需要重新定位，而不是責怪地圖。\n類比讓抽象變得可理解，也讓複雜問題找到入口。\n但比喻終究不是事實，不能拿相似當成完全相同。\n真正的智慧，是借用熟悉的光，卻不忘檢查陌生世界的模樣。\n最小行動｜用一個生活比喻解釋今天學到的新概念。", "en": "Analogy", "wisdomEn": "Use the familiar to approach the unfamiliar.", "actionEn": "Create an everyday metaphor.", "essayTitleEn": "Let familiar experience illuminate unfamiliar problems.", "essayEn": "Learning resembles growing a tree: do not dig up its roots daily. Relationships resemble accounts: withdrawals need contributions. Life resembles navigation: a wrong turn calls for repositioning. Analogies make complexity approachable. Yet a metaphor is not a fact, and resemblance is not identity. Borrow familiar light while checking the unfamiliar world's actual shape. Small action: explain one new concept with an everyday metaphor."}, {"id": 24, "zh": "概念整合力", "wisdom": "連接分散的知識", "action": "連接兩個概念", "group": 4, "essayTitle": "知識的價值，在於彼此連接", "essay": "有人懂心理學，卻不懂溝通；懂管理，卻不懂人性；懂健康，卻忽略生活。\n知識若彼此孤立，遇到真實問題便容易失去方向。\n世界不是按照課本章節運作，人生也不會只出一道單選題。\n當情緒連上決策，決策連上資源，資源連上環境，理解才開始立體。\n智慧不是收藏更多碎片，而是讓碎片形成可以更新的地圖。\n最小行動｜把今天兩個不同領域的概念連接起來。", "en": "Concept integration", "wisdomEn": "Connect scattered knowledge.", "actionEn": "Connect two concepts.", "essayTitleEn": "Knowledge gains value through connection.", "essayEn": "Knowing psychology without communication, management without people, or health without daily life can leave knowledge isolated. The world does not follow textbook chapters or offer only single-choice problems. Connect emotion to decisions, decisions to resources, and resources to circumstances. Understanding gains depth when fragments become a revisable map. Small action: connect two concepts from different fields today."}, {"id": 25, "zh": "模型建構力", "wisdom": "建立可以檢驗的解釋", "action": "寫出如果就會", "group": 4, "essayTitle": "真正的理解，應該能接受現實檢驗", "essay": "你說自己了解孩子，能預測他在什麼情境下需要幫助嗎？\n你說自己了解市場，能說出判斷失效的條件嗎？\n如果一個解釋永遠不可能被證明有錯，它可能只是故事，而不是可檢驗模型。\n模型不是現實本身，而是暫時幫助我們理解現實的工具。\n好的模型不需要永遠正確，只需要能從錯誤中變得更好。\n最小行動｜寫下一句「如果發生A，我預期會出現B」。", "en": "Model building", "wisdomEn": "Create an explanation open to examination.", "actionEn": "Write an if-then expectation.", "essayTitleEn": "Understanding should meet experience.", "essayEn": "If you understand a child, can you anticipate when help is needed? If you understand a market, can you state when your judgment would fail? An explanation that can never be wrong may remain a story. A model is a temporary tool for approaching reality. Its value includes improving through mistakes. Small action: write an expectation in the form if A happens, I expect B."}, {"id": 26, "zh": "關係辨識力", "wisdom": "看見誰影響誰", "action": "畫三個連結", "group": 5, "essayTitle": "世界不是孤立的點，而是互相影響的網", "essay": "一個學生不交作業，可能牽涉能力、時間、家庭與同儕。\n一段關係持續衝突，可能牽涉期待、溝通、界線與信任。\n只盯著一個人，容易忽略整個系統。\n只責怪一個行為，可能錯過真正的連結。\n智慧不是否認個人責任，而是看見責任如何存在於關係網絡。\n當連結被看見，改善便不再只能依靠責備。\n最小行動｜畫出一個問題涉及的三個重要關係。", "en": "Relationship awareness", "wisdomEn": "See who influences whom.", "actionEn": "Draw three connections.", "essayTitleEn": "The world is a web of relations.", "essayEn": "Missing homework may involve ability, time, family, and peers. Repeated conflict may involve expectations, communication, boundaries, and trust. Fixating on one person can hide the surrounding relations; blaming one action can miss a crucial connection. Responsibility exists within a network. See those links and improvement can involve more than blame. Small action: draw three important relationships within one problem."}, {"id": 27, "zh": "位置辨識力", "wisdom": "理解自己的角色與處境", "action": "寫出目前位置", "group": 5, "essayTitle": "先知道自己在哪裡，才能知道如何前進", "essay": "同一句建議，對不同位置的人可能產生不同結果。\n剛開始學習的人需要基礎，熟練的人需要突破。\n資源不足的人需要穩定，資源充足的人可能需要探索。\n如果連自己所在的位置都不清楚，怎能判斷下一步？\n定位不是限制自己，而是避免用別人的地圖走自己的道路。\n真正的前進，不是盲目追逐遠方，而是從當下的位置開始。\n最小行動｜寫下自己目前的資源、限制與下一個目標。", "en": "Situational awareness", "wisdomEn": "Understand your role and circumstances.", "actionEn": "Describe your present position.", "essayTitleEn": "Know where you are before moving forward.", "essayEn": "The same advice can affect people differently. Beginners may need foundations while experienced learners need a new challenge. Limited resources can call for stability; abundance may permit exploration. Without locating yourself, how can you choose a next step? Positioning avoids using another person's map for your journey. Begin from the circumstances you actually inhabit. Small action: list your present resources, limits, and next goal."}, {"id": 28, "zh": "權重判斷力", "wisdom": "知道哪個因素更重要", "action": "排出前三因素", "group": 5, "essayTitle": "不是所有問題，都值得同樣用力", "essay": "一天只有二十四小時，注意力與精力都有邊界。\n有人把大量時間花在小事，卻讓真正重要的問題持續惡化。\n努力若沒有權重判斷，可能只是高效率地消耗生命。\n什麼事情一旦改善，其他問題也會跟著鬆動？\n真正的智慧，不是把每件事都做到完美，而是找出最有影響力的變數。\n把力量放對位置，微小行動也可能撬動巨大改變。\n最小行動｜列出三個影響結果的因素，排出優先順序。", "en": "Weighting factors", "wisdomEn": "Judge which factors matter more.", "actionEn": "Rank the top three factors.", "essayTitleEn": "Different problems deserve different amounts of effort.", "essayEn": "A day has twenty-four hours, and attention and energy have limits. Time spent on minor matters can let important problems worsen. Without judging importance, effort can efficiently consume a life. Which change might loosen several problems at once? Wisdom finds the most influential factors rather than perfecting everything. Well-placed small actions can matter greatly. Small action: rank three factors that influence one result."}, {"id": 29, "zh": "邊界辨識力", "wisdom": "知道方法何時不適用", "action": "列出一個限制", "group": 5, "essayTitle": "任何有效的方法，都有不適用的地方", "essay": "堅持是一種能力，但錯誤方向上的堅持可能只是消耗。\n信任是一種美德，但沒有界線的信任可能增加風險。\n努力值得尊重，但努力不能保證所有結果。\n為什麼一個曾經成功的方法，後來卻可能失敗？\n因為情境、資源與條件已經改變。\n成熟不是放棄原則，而是理解原則的適用邊界。\n真正的智慧，知道何時使用，也知道何時停止。\n最小行動｜替一個常用方法寫下一項不適用條件。", "en": "Boundary awareness", "wisdomEn": "Know when a method does not apply.", "actionEn": "List one limitation.", "essayTitleEn": "Every useful method has limits.", "essayEn": "Persistence in a mistaken direction can drain resources. Trust without boundaries can increase exposure. Effort deserves respect without guaranteeing results. Why might yesterday's successful method fail today? Circumstances, resources, and conditions may have changed. Maturity recognizes where a principle applies. Wisdom includes knowing when to use a method and when to stop. Small action: write one condition where a familiar method is unsuitable."}, {"id": 30, "zh": "瓶頸洞察力", "wisdom": "找出最需要改善的地方", "action": "圈出最大阻礙", "group": 5, "essayTitle": "真正的突破，不是全面用力，而是找到卡點", "essay": "水桶能裝多少水，常受最短的木板限制。\n學生背了很多單字，卻可能因為句型理解不足而失分。\n團隊增加人手，卻可能因為流程混亂而更加低效。\n如果沒有找到瓶頸，增加資源是否只是增加浪費？\n真正的高手，不是每個地方都用力，而是先找出限制整體表現的關鍵。\n當卡點鬆動，系統才有機會重新流動。\n最小行動｜圈出今天最妨礙目標的一個瓶頸。", "en": "Bottleneck insight", "wisdomEn": "Find the part most in need of change.", "actionEn": "Circle the greatest obstacle.", "essayTitleEn": "Find the point that blocks progress.", "essayEn": "A bucket's shortest plank offers one image of limitation. A student may know vocabulary yet struggle with sentence structure. A team may add people while confused processes slow everyone down. Without finding the constraint, extra resources can become extra waste. Find what limits the whole undertaking so work can flow again. Small action: circle the one bottleneck most obstructing today's goal."}, {"id": 31, "zh": "耦合理解力", "wisdom": "看見連鎖影響", "action": "寫出一條影響鏈", "group": 6, "essayTitle": "你以為只改變一件事，其實可能牽動整個系統", "essay": "睡眠不足，可能影響專注；專注下降，可能增加錯誤；錯誤增加，又可能帶來壓力。\n一個小變化，可能沿著關係網不斷擴散。\n因此，改善人生不能只看單一事件，也要觀察連鎖效應。\n你正在解決的問題，會不會同時製造另一個問題？\n真正的系統智慧，是理解局部與整體如何相互牽動。\n最小行動｜寫下一條「A影響B，B再影響C」的連鎖關係。", "en": "Understanding coupling", "wisdomEn": "Notice connected consequences.", "actionEn": "Write one chain of influence.", "essayTitleEn": "Changing one thing can affect a wider whole.", "essayEn": "Poor sleep can reduce attention, reduced attention can increase errors, and errors can bring stress. A small change can spread through relationships. Look beyond the isolated event and notice consequences along the chain. Could solving one problem create another? Wisdom attends to how local changes and the wider situation influence one another. Small action: describe a chain in which A affects B and B affects C."}, {"id": 32, "zh": "回饋迴路辨識力", "wisdom": "看見問題如何反覆發生", "action": "畫一個循環", "group": 6, "essayTitle": "有些困境不是偶然，而是不斷自我強化", "essay": "愈害怕失敗，愈不敢嘗試；愈不嘗試，能力愈難提升；能力停滯，又讓恐懼增加。\n這不是單一事件，而是一個反覆運作的循環。\n你以為問題一直回來，是命運在捉弄你嗎？\n也許真正需要改變的，是讓問題重複發生的回饋機制。\n打破循環，不一定需要巨大力量。\n有時只要改變其中一個環節，人生就可能開始轉向。\n最小行動｜畫出一個反覆困境的三步循環。", "en": "Feedback-loop awareness", "wisdomEn": "Recognize how problems recur.", "actionEn": "Draw one loop.", "essayTitleEn": "Some difficulties keep reinforcing themselves.", "essayEn": "Fear of failure prevents trying; less practice slows improvement; stalled ability increases fear. This is a recurring loop rather than an isolated event. Is fate repeating the problem, or does a relationship in the loop need to change? Breaking the cycle may not require tremendous force. Altering one part can create a new direction. Small action: draw a three-step loop behind one recurring difficulty."}, {"id": 33, "zh": "時間動態力", "wisdom": "理解事情隨時間變化", "action": "比較前後差異", "group": 6, "essayTitle": "今天正確的答案，明天未必仍然正確", "essay": "人會改變，環境會改變，需求與資源也會改變。\n年輕時適合衝刺的方法，中年後可能需要重新配置。\n昨天有效的策略，今天可能因為條件不同而失效。\n如果世界一直變動，為什麼我們期待一套方法永遠適用？\n智慧不是抓住不變的答案，而是辨識什麼正在改變。\n真正的穩定，不是停止變化，而是擁有調整的能力。\n最小行動｜比較一件事情一個月前與現在的差異。", "en": "Temporal awareness", "wisdomEn": "Understand how things change over time.", "actionEn": "Compare before and after.", "essayTitleEn": "Today's answer may not fit tomorrow.", "essayEn": "People, surroundings, needs, and resources change. A method suited to youth may need adjustment later. Yesterday's strategy can fail under today's conditions. Why expect one answer to fit forever when life keeps changing? Wisdom notices what is changing. Stability can mean retaining the capacity to adjust. Small action: compare one situation now with the same situation a month ago."}, {"id": 34, "zh": "臨界點辨識力", "wisdom": "找出局勢可能轉變的條件", "action": "設定一個警戒值", "group": 6, "essayTitle": "真正的危機，往往在爆發前已經累積", "essay": "關係不會總在一次爭吵後破裂。\n健康問題也不一定在第一次不舒服時才開始。\n許多變化可能長期累積，直到某個條件出現，系統才突然轉向。\n為什麼我們常在事情失控後，才發現早有徵兆？\n因為我們習慣看事件，卻忽略累積與門檻。\n智慧不是預知所有未來，而是提前辨認值得留意的訊號。\n最小行動｜替一個重要目標設定一項需要重新評估的警戒條件。", "en": "Threshold awareness", "wisdomEn": "Notice conditions for a turning point.", "actionEn": "Set one review threshold.", "essayTitleEn": "A crisis may accumulate before it becomes visible.", "essayEn": "Relationships do not always break from one argument, and difficulties with health may begin before the first discomfort. Changes can accumulate until a condition shifts the situation. Why do we recognize signs only after losing control? We notice events while overlooking accumulation and thresholds. Wisdom identifies signals worth attention without claiming to foresee everything. Small action: set one condition that prompts reassessment of an important goal."}, {"id": 35, "zh": "情境推演力", "wisdom": "想像不同選擇的後果", "action": "列出三種可能", "group": 6, "essayTitle": "真正的準備，不是相信未來只有一種", "essay": "如果考試順利，你要怎麼做？\n如果結果不如預期，你還有什麼選擇？\n如果原本依靠的資源突然消失，你能否重新配置？\n只準備一種未來的人，容易被意外困住。\n能推演多種情境的人，不一定能避免風險，卻更可能保有行動空間。\n智慧不是控制未來，而是在不確定中建立選擇。\n最小行動｜替今天一個決策列出最好、普通、最差三種情境。", "en": "Scenario exploration", "wisdomEn": "Imagine consequences of different choices.", "actionEn": "List three possibilities.", "essayTitleEn": "Prepare for more than one future.", "essayEn": "If an exam goes well, what next? If results disappoint, what other options remain? If a key resource disappears, can you rearrange things? Preparing for only one future can leave you trapped by surprise. Exploring alternatives preserves room for action without eliminating uncertainty. Wisdom builds choices within an uncertain future. Small action: outline best, ordinary, and worst scenarios for one decision."}, {"id": 36, "zh": "情緒辨識力", "wisdom": "知道自己現在的感受", "action": "說出情緒名稱", "group": 7, "essayTitle": "能說出自己的情緒，才有機會理解自己的反應", "essay": "你以為自己在生氣，可能其實是在害怕。\n你以為自己很失望，可能背後藏著沒有被理解的期待。\n情緒不是敵人，也不是必須服從的命令。\n它更像一個訊號，提醒我們某些需求或判斷正在被觸動。\n如果連自己正在感受什麼都不知道，又如何選擇回應？\n真正的自我理解，從替內在經驗找到名字開始。\n最小行動｜今天說出一種情緒，以及它可能連結的需求。", "en": "Emotion recognition", "wisdomEn": "Name your present feeling.", "actionEn": "Name one emotion.", "essayTitleEn": "Naming feelings opens understanding.", "essayEn": "What seems like anger may include fear. Disappointment may hide an expectation of being understood. An emotion can be a signal of touched needs or judgments rather than an enemy or command. Without knowing what you feel, how can you choose a response? Understanding yourself begins by giving inner experience a name. Small action: name one emotion and a need it may connect with."}, {"id": 37, "zh": "需求辨識力", "wisdom": "知道自己真正需要什麼", "action": "寫下一項需求", "group": 7, "essayTitle": "你真正想要的，可能不是你正在追逐的", "essay": "你拼命工作，可能真正想要的是安全感。\n你不斷要求孩子進步，可能真正害怕的是他的未來失去選擇。\n你希望別人認同，可能真正渴望的是被理解。\n表面目標與深層需求，有時並不是同一件事。\n如果一直追錯目標，再努力也可能無法滿足自己。\n智慧不是否定欲望，而是看清欲望背後真正重要的東西。\n最小行動｜問自己一次「我真正希望得到的是什麼」。", "en": "Need recognition", "wisdomEn": "Find what you actually need.", "actionEn": "Write down one need.", "essayTitleEn": "What you seek may differ from what you need.", "essayEn": "Intense work may seek security; demands for a child's progress may reflect concern for future choices; the wish for approval may seek understanding. Surface goals and deeper needs can differ. Chasing a mismatched goal can leave effort unsatisfying. Wisdom looks beneath desire to what matters within it. Small action: ask yourself what you truly hope to receive."}, {"id": 38, "zh": "信念覺察力", "wisdom": "發現自己深信的想法", "action": "寫下一句我相信", "group": 7, "essayTitle": "最牢固的牢籠，可能是你深信不疑的想法", "essay": "「我不能失敗。」\n「我必須照顧所有人。」\n「別人不滿意，就是我做得不好。」\n這些句子可能早已變成內在規則，默默控制每天的選擇。\n可是，誰規定你必須永遠如此？\n信念可以提供方向，也可能限制自由。\n真正的成長，不是沒有信念，而是讓信念保有接受檢驗的空間。\n最小行動｜寫下一句「我一直相信……」，再檢查它是否總成立。", "en": "Belief awareness", "wisdomEn": "Notice ideas you take for granted.", "actionEn": "Write one statement beginning I believe.", "essayTitleEn": "A deeply trusted thought can become a prison.", "essayEn": "I cannot fail. I must care for everyone. Someone's dissatisfaction means I did badly. These sentences can become inner rules governing daily choices. But who decided they must always apply? Beliefs offer direction and can also limit freedom. Growth leaves room for them to be examined. Small action: write one long-held belief and consider whether it always holds."}, {"id": 39, "zh": "偏誤覺察力", "wisdom": "察覺自己可能看錯", "action": "找一個相反證據", "group": 7, "essayTitle": "最難發現的錯誤，是自己最想相信的答案", "essay": "喜歡一個人，就容易忽略他的缺點。\n討厭一個人，就容易放大他的失誤。\n相信某個方法有效，就可能只記住成功案例。\n我們以為自己在看事實，卻可能正在尋找支持原有信念的證據。\n如果所有資訊都只證明你正確，你是否真的檢查過其他可能？\n智慧不是沒有偏誤，而是願意主動尋找修正偏誤的線索。\n最小行動｜找出一項與自己目前看法相反的可靠證據。", "en": "Bias awareness", "wisdomEn": "Notice how you might be mistaken.", "actionEn": "Find evidence against your view.", "essayTitleEn": "The hardest error to see may be the answer you want.", "essayEn": "Affection can hide flaws, dislike can magnify mistakes, and faith in a method can make successes easier to remember. What feels like observing facts may be searching for support for prior belief. If everything confirms your view, have you examined alternatives? Wisdom actively seeks opportunities to revise bias. Small action: find one reliable piece of evidence against your current view."}, {"id": 40, "zh": "自我反省力", "wisdom": "理解行為與結果的關係", "action": "寫下今天一個反省", "group": 7, "essayTitle": "反省不是責怪自己，而是重新理解自己", "essay": "今天做錯一件事，你可以不斷罵自己，也可以重新檢查決策過程。\n自責只會重播痛苦，反省則有機會產生新的方法。\n你當時看見什麼？忽略什麼？相信什麼？又能改變什麼？\n真正有價值的反省，不是證明自己多糟糕，而是找出下次可以調整的地方。\n當錯誤成為資訊，而不是身分標籤，成長才真正開始。\n最小行動｜寫下一個今天可以改善的行為，不批判人格。", "en": "Self-reflection", "wisdomEn": "Connect actions with outcomes.", "actionEn": "Write one reflection today.", "essayTitleEn": "Reflection means understanding yourself again.", "essayEn": "After a mistake, you can insult yourself repeatedly or review how you decided. Blame replays pain; reflection may produce another way. What did you notice, miss, believe, and have power to change? Useful reflection identifies an adjustment rather than proving you are bad. Growth becomes possible when errors become information rather than identity. Small action: name one behavior to improve without judging your personality."}, {"id": 41, "zh": "情緒調節力", "wisdom": "情緒強烈時仍能選擇", "action": "先停十秒", "group": 8, "essayTitle": "真正的力量，不是沒有情緒，而是不被情緒駕駛", "essay": "生氣時想反擊，害怕時想逃避，委屈時想證明自己。\n情緒來得很快，後果卻可能停留很久。\n如果每一次情緒升起，都直接變成行動，我們還剩多少選擇？\n調節不是壓抑感受，而是在刺激與反應之間創造空間。\n能停下來的人，不一定比較不痛苦，卻可能更有能力保護重要的關係與目標。\n最小行動｜情緒強烈時先停十秒，再決定是否回應。", "en": "Emotion regulation", "wisdomEn": "Keep room for choice in strong feelings.", "actionEn": "Pause for ten seconds.", "essayTitleEn": "Strength includes choosing while emotions are present.", "essayEn": "Anger urges retaliation, fear urges escape, and hurt urges self-defense. Emotions rise quickly while consequences can last. If each feeling directly becomes action, how much choice remains? Regulation creates room between an encounter and a response. Pausing may not remove pain, but can help protect relationships and goals. Small action: wait ten seconds during strong emotion before deciding how to respond."}, {"id": 42, "zh": "壓力管理力", "wisdom": "辨識並調整壓力來源", "action": "減少一個壓力源", "group": 8, "essayTitle": "真正的堅強，不是無限承受", "essay": "你可以一直告訴自己再撐一下。\n再多接一份工作，再少睡一個小時，再承擔別人的期待。\n但如果壓力來源始終不變，忍耐是否只是在延後崩潰？\n管理壓力，不是證明自己能承受多少，而是辨認哪些負荷可以減少、哪些資源需要補充。\n成熟不是把自己耗盡，而是建立能夠長期運作的生活系統。\n最小行動｜今天減少一項不必要的壓力來源。", "en": "Stress management", "wisdomEn": "Identify and adjust sources of pressure.", "actionEn": "Reduce one source of pressure.", "essayTitleEn": "Strength does not mean carrying endless burdens.", "essayEn": "You can tell yourself to endure another job, another lost hour of sleep, another expectation. But if the burden stays unchanged, is endurance simply postponing collapse? Managing pressure means noticing loads that can be reduced and resources that need replenishment. Maturity builds a life that can continue rather than exhausting it. Small action: reduce one unnecessary source of pressure today."}, {"id": 43, "zh": "挫折承受力", "wisdom": "失敗後仍願意再試", "action": "修改方法再做一次", "group": 8, "essayTitle": "失敗不是終點，拒絕更新才可能讓失敗重複", "essay": "考試失敗，不代表沒有能力。\n創業受挫，不代表沒有價值。\n一次關係破裂，也不能定義整個人生。\n可是，如果每次失敗後只剩下自責，方法又怎麼改變？\n挫折的價值，不在於痛苦本身，而在於我們能否從中取得可用資訊。\n真正的韌性，不是永遠不倒，而是跌倒後重新理解道路。\n最小行動｜選一個失敗經驗，修改一項方法再試一次。", "en": "Resilience after setbacks", "wisdomEn": "Remain willing to try after failure.", "actionEn": "Change a method and try again.", "essayTitleEn": "Failure need not be an ending.", "essayEn": "An exam result does not define ability, a business setback does not erase worth, and a broken relationship cannot define a whole life. If failure brings only blame, how can a method change? A setback's value lies in usable understanding rather than pain itself. Resilience includes reinterpreting the path after falling. Small action: change one approach from a failed experience and try again."}, {"id": 44, "zh": "延遲滿足力", "wisdom": "為長期目標暫緩誘惑", "action": "延後滑手機十分鐘", "group": 8, "essayTitle": "自由不是想做什麼就做什麼", "essay": "手機一響就查看，心情不好就購物，遇到困難就想逃避。\n即時滿足很容易，長期成果卻需要等待。\n如果每個當下的衝動都能決定行動，究竟是你在選擇，還是刺激在選擇？\n延遲滿足不是禁止快樂，而是讓短期慾望不再壟斷長期人生。\n真正的自由，是有能力為更重要的未來保留今天的選擇。\n最小行動｜把一次非必要的滑手機延後十分鐘。", "en": "Delayed gratification", "wisdomEn": "Postpone temptation for a longer goal.", "actionEn": "Delay phone use by ten minutes.", "essayTitleEn": "Freedom includes holding an impulse open.", "essayEn": "A notification prompts checking, a bad mood prompts shopping, and difficulty prompts escape. Immediate relief is easy; lasting results may require waiting. If every impulse determines action, who is choosing? Delaying satisfaction leaves short-term desire unable to monopolize the future. Freedom keeps today's choices available for what matters later. Small action: postpone one unnecessary phone check by ten minutes."}, {"id": 45, "zh": "心理彈性力", "wisdom": "情況改變時能調整", "action": "提出另一個做法", "group": 8, "essayTitle": "真正的穩定，是變動時仍能重新站穩", "essay": "計畫被打亂，並不代表人生失敗。\n期待沒有實現，也不代表努力全部白費。\n有人一遇到變化，就認為世界背叛自己；有人重新評估條件，尋找新的可能。\n如果道路改變，你是否也允許方法改變？\n心理彈性不是沒有原則，而是讓方法服務價值，而不是讓價值被方法困住。\n像水一樣保有方向，也保有轉彎的能力。\n最小行動｜替今天一件不順利的事提出另一種做法。", "en": "Psychological flexibility", "wisdomEn": "Adjust when circumstances change.", "actionEn": "Propose another approach.", "essayTitleEn": "Stability can mean finding your footing again.", "essayEn": "A disrupted plan does not equal a failed life, and unmet expectations do not erase effort. Some experience change as betrayal; others reconsider conditions and seek possibilities. If the road changes, may your method change too? Flexibility lets methods serve values. Like water, retain direction and the ability to turn. Small action: find another approach to one thing that went poorly today."}, {"id": 46, "zh": "同理力", "wisdom": "理解他人的處境", "action": "問對方最困難的是什麼", "group": 9, "essayTitle": "真正的理解，是知道別人的世界不等於自己的世界", "essay": "你覺得簡單的事，對別人可能非常困難。\n你認為理所當然的選擇，對別人可能需要很大勇氣。\n我們常用自己的經驗衡量別人的處境，再用自己的標準判斷對錯。\n可是，你真的走過對方走過的路嗎？\n同理不是認同所有行為，而是願意理解行為發生的背景。\n當理解先於評價，關係才有可能從對立走向對話。\n最小行動｜問一個人「這件事對你最困難的地方是什麼」。", "en": "Empathy", "wisdomEn": "Understand another person's situation.", "actionEn": "Ask what is hardest for them.", "essayTitleEn": "Another person's world differs from yours.", "essayEn": "What feels simple to you may be difficult for someone else; an obvious choice to you may demand courage from them. We judge other circumstances with our own experience and standards. Have you walked their path? Empathy seeks the background of conduct without endorsing everything. Understanding before evaluation can open dialogue. Small action: ask someone what is most difficult about their situation."}, {"id": 47, "zh": "動機辨識力", "wisdom": "探索行為背後的需求", "action": "提出兩種可能動機", "group": 9, "essayTitle": "不要只看一個人做了什麼，也要理解他想得到什麼", "essay": "有人沉默，是因為不在乎，也可能因為害怕衝突。\n有人不願合作，可能是缺乏信任，也可能是利益安排不清楚。\n只看行為，我們容易快速貼標籤。\n看見可能的動機，才有機會設計更有效的回應。\n但猜測不是讀心，理解仍需要對話與驗證。\n真正的人性智慧，是保持多種解釋，而不急著把任何一種當成真相。\n最小行動｜替一個難以理解的行為提出兩種可能動機。", "en": "Motivation awareness", "wisdomEn": "Explore needs behind behavior.", "actionEn": "Propose two possible motivations.", "essayTitleEn": "Ask what a person may be seeking.", "essayEn": "Silence may mean indifference or fear of conflict. Refusing cooperation may reflect distrust or unclear arrangements. Behavior alone tempts us to label quickly. Considering motives can help us respond, but guessing is not mind reading: conversation and examination still matter. Keep several explanations open. Small action: propose two possible motives for one puzzling behavior."}, {"id": 48, "zh": "換位思考力", "wisdom": "從不同立場看事情", "action": "替對方說明一次", "group": 9, "essayTitle": "世界不只有你的視角", "essay": "老師看見學生不交作業，學生可能看見自己怎麼努力都學不會。\n父母看見孩子沉迷手機，孩子可能看見現實中難以取得的成就感。\n同一件事，站在不同位置，就可能出現不同意義。\n如果只允許自己的視角存在，溝通如何開始？\n換位思考不是放棄判斷，而是增加理解的維度。\n當你能看見別人的地圖，才更有機會找到共同的道路。\n最小行動｜用對方的立場重新描述一次今天的衝突。", "en": "Perspective taking", "wisdomEn": "View events from another position.", "actionEn": "Explain the other person's view.", "essayTitleEn": "Your perspective is one among many.", "essayEn": "A teacher sees missing homework; a student may see effort that never leads to understanding. Parents see phone use; a child may find achievement absent elsewhere. The same event gains different meanings from different positions. If only your view is allowed, how can communication begin? Perspective taking broadens judgment. Seeing another map can reveal shared paths. Small action: describe today's conflict from the other person's position."}, {"id": 49, "zh": "信任評估力", "wisdom": "依行動與時間判斷可靠性", "action": "檢查一項承諾", "group": 9, "essayTitle": "真正的信任，不靠承諾，而靠長期一致", "essay": "有人說得動聽，行動卻總是落空。\n有人不擅長表達，卻一次次完成承諾。\n你要相信對方描繪的未來，還是觀察他已經展現的行為？\n信任不是一次決定，而是隨著證據持續調整的判斷。\n真正可靠的關係，不需要靠盲目相信維持，也不需要靠無限懷疑生存。\n讓時間與行動說話，信任才有穩固的根。\n最小行動｜檢查一項承諾是否與實際行動一致。", "en": "Trust assessment", "wisdomEn": "Assess reliability through actions over time.", "actionEn": "Check one promise.", "essayTitleEn": "Trust grows through lasting consistency.", "essayEn": "Some speak beautifully and fail to follow through; others speak awkwardly and repeatedly keep promises. Will you rely on an imagined future or observe actual conduct? Trust is a judgment revised with experience. Reliable relationships need neither blind belief nor endless suspicion. Let time and actions give trust its roots. Small action: compare one promise with what actually happened."}, {"id": 50, "zh": "界線建立力", "wisdom": "知道什麼可以接受", "action": "說清楚一項界線", "group": 9, "essayTitle": "善良不是讓所有人都能消耗你", "essay": "你可以理解別人的困難，卻不必承擔所有責任。\n你可以願意幫忙，卻不代表必須無限付出。\n沒有界線的善意，可能逐漸變成委屈；沒有尊重的關係，可能逐漸變成控制。\n如果一段關係只能靠你不斷退讓維持，那真的是合作嗎？\n界線不是拒絕愛，而是讓愛不必以自我耗損為代價。\n真正成熟的善良，既看見別人，也不遺忘自己。\n最小行動｜清楚說出一件自己可以接受與不能接受的事。", "en": "Boundary setting", "wisdomEn": "Know what you can accept.", "actionEn": "State one boundary clearly.", "essayTitleEn": "Kindness can include a boundary.", "essayEn": "Understanding another person's difficulty does not require taking every responsibility. Offering help does not require unlimited giving. Kindness without boundaries can become resentment; relationships without respect can become control. If a relationship requires endless surrender, is it cooperation? Boundaries protect care from self-exhaustion. Mature kindness sees others without forgetting oneself. Small action: clearly name one acceptable and one unacceptable condition."}, {"id": 51, "zh": "清楚表達力", "wisdom": "把想法說得明白", "action": "用三句話說重點", "group": 10, "essayTitle": "說得很多，不代表真正被理解", "essay": "有些人說了十分鐘，別人仍不知道重點。\n有些人只說三句話，就讓問題、需求與下一步變得清楚。\n表達不是把腦中的所有想法倒出來，而是幫助對方建立正確理解。\n如果聽的人始終不明白，你是否需要重新整理自己的語言？\n真正的表達能力，不是聲音最大，而是讓重要訊息準確抵達。\n讓語言成為橋，而不是新的迷霧。\n最小行動｜用三句話說清楚問題、需求與希望的行動。", "en": "Clear expression", "wisdomEn": "Make your meaning understandable.", "actionEn": "State the point in three sentences.", "essayTitleEn": "Speaking at length does not ensure understanding.", "essayEn": "One person speaks for ten minutes without clarity; another uses three sentences to make the problem, need, and next step clear. Expression helps someone understand rather than emptying every thought. If a listener stays confused, could you reorganize your words? Let language deliver what matters accurately and become a bridge. Small action: explain a problem, a need, and a requested action in three sentences."}, {"id": 52, "zh": "精準提問力", "wisdom": "問出有助於理解的問題", "action": "提出一個具體問題", "group": 10, "essayTitle": "問得越準，越可能找到真正有用的答案", "essay": "「我該怎麼辦？」是一個問題。\n「我目前有兩個選項，最大的風險差異是什麼？」也是問題。\n前者可能得到安慰，後者更容易得到可比較的資訊。\n問題愈模糊，答案愈容易漂浮。\n如果連想知道什麼都沒有界定，如何判斷回答是否有用？\n精準提問，是替思考設定清楚的搜尋方向。\n最小行動｜把一個模糊問題改寫成包含情境與目標的具體問題。", "en": "Precise questioning", "wisdomEn": "Ask questions that clarify.", "actionEn": "Ask one specific question.", "essayTitleEn": "A precise question can lead to a useful answer.", "essayEn": "What should I do? differs from asking how two options differ in risk. One may invite comfort; the other invites comparison. A vague question can leave answers floating. Without defining what you want to know, how can you assess usefulness? Precision gives inquiry direction. Small action: rewrite one vague question with a specific situation and goal."}, {"id": 53, "zh": "傾聽回應力", "wisdom": "先理解再回答", "action": "重述後再回應", "group": 10, "essayTitle": "回應之前，先確認自己真的聽懂", "essay": "一個人說自己很累，你立刻告訴他應該更努力。\n一個人說自己很難過，你急著提供十個方法。\n你以為自己正在幫助，對方卻可能感覺更加孤單。\n因為真正的回應，不是最快給出答案，而是先確認問題。\n聽懂需求，再選擇語言；理解情境，再提供建議。\n有時候，最好的回答不是一段大道理，而是一句「我理解得對嗎」。\n最小行動｜先重述對方的意思，再提出自己的回應。", "en": "Responsive listening", "wisdomEn": "Understand before answering.", "actionEn": "Restate, then respond.", "essayTitleEn": "Check your understanding before responding.", "essayEn": "Someone says they are tired and you tell them to work harder; someone feels sad and you offer ten methods. Intended help can leave them lonelier. A good response starts by understanding the need and circumstances. Sometimes the most helpful words ask whether you understood correctly. Small action: restate the person's meaning before offering your response."}, {"id": 54, "zh": "衝突溝通力", "wisdom": "討論問題而非羞辱人", "action": "使用我訊息", "group": 10, "essayTitle": "關係真正需要解決的，是問題，不是對方", "essay": "「你總是這樣！」\n「你根本不在乎！」\n「你從來不改變！」\n當語言開始攻擊人格，問題便容易變成權力對抗。\n你真正想要的是改善關係，還是證明對方錯誤？\n成熟的溝通，不是壓下自己的需要，而是把指責轉化為具體描述。\n讓雙方看見問題，而不是把彼此變成敵人。\n最小行動｜把一句「你總是」改成「當這件事發生，我感到……我希望……」。", "en": "Conflict communication", "wisdomEn": "Discuss problems without humiliating people.", "actionEn": "Use an I statement.", "essayTitleEn": "Address the problem while keeping the person in view.", "essayEn": "You always do this. You do not care. You never change. When words attack character, a problem can turn into a struggle for power. Do you want to improve the relationship or prove fault? Mature conversation keeps needs visible and turns accusations into specific descriptions. Small action: replace you always with when this happens, I feel, and I hope."}, {"id": 55, "zh": "說服與協商力", "wisdom": "尋找可接受的共同方案", "action": "提出一個雙贏選項", "group": 10, "essayTitle": "真正的合作，不是讓別人輸給你", "essay": "如果每次討論都要有人認輸，關係就容易累積新的對抗。\n你想要效率，對方可能需要安全感。\n你想要改變，對方可能擔心失去控制。\n如果只強調自己的利益，如何期待對方真心合作？\n協商不是犧牲原則，而是理解彼此需求、底線與可交換的資源。\n真正高明的說服，不是讓對方閉嘴，而是找到雙方願意執行的方案。\n最小行動｜提出一個兼顧雙方重要需求的具體選項。", "en": "Persuasion and negotiation", "wisdomEn": "Seek a mutually acceptable option.", "actionEn": "Offer one shared-gain option.", "essayTitleEn": "Cooperation seeks a workable agreement.", "essayEn": "If every discussion needs a loser, resistance can accumulate. You may want efficiency while the other person seeks security; you may seek change while they fear loss of control. How can cooperation grow if only one person's interests count? Negotiation understands needs, limits, and resources that can be exchanged. Seek an option both can carry out. Small action: propose one concrete option that meets an important need on each side."}, {"id": 56, "zh": "角色辨識力", "wisdom": "知道誰負責什麼", "action": "列出角色分工", "group": 11, "essayTitle": "合作失敗，未必是誰不努力", "essay": "一個團隊裡，大家都很忙，事情卻始終沒完成。\n有人以為別人會做，有人不知道自己該負責什麼。\n最後互相責怪，卻沒有人檢查分工。\n如果角色不清楚，再多熱情能維持多久？\n真正的合作，需要讓責任、權限與交付結果彼此對齊。\n當每個人知道自己的位置，努力才有機會形成共同成果。\n最小行動｜替一項合作任務寫出負責人、工作內容與完成標準。", "en": "Role awareness", "wisdomEn": "Know who is responsible for what.", "actionEn": "List roles and responsibilities.", "essayTitleEn": "Failed cooperation can arise from unclear roles.", "essayEn": "Everyone is busy yet nothing finishes. Some assume another person will act; others do not know their responsibilities. Blame grows without anyone reviewing the division of work. How long can enthusiasm compensate for unclear roles? Cooperation aligns responsibility, authority, and expected outcomes. Small action: name an owner, a task, and a completion standard for one shared activity."}, {"id": 57, "zh": "誘因分析力", "wisdom": "理解各方為何選擇", "action": "寫下各方想得到什麼", "group": 11, "essayTitle": "理解人性，不是只聽他說什麼", "essay": "有人口頭支持改革，實際卻不願改變。\n有人說重視合作，制度卻只獎勵個人競爭。\n當宣稱的價值與實際誘因不同，行為究竟會往哪裡走？\n人會受到需求、風險、資源與制度共同影響。\n真正的策略，不是一直要求別人變好，而是檢查什麼選擇正在被獎勵。\n當誘因改變，合作才可能變得容易。\n最小行動｜寫下合作中各方最在乎的利益與擔憂。", "en": "Incentive awareness", "wisdomEn": "Understand why each party chooses.", "actionEn": "Write what each party hopes to gain.", "essayTitleEn": "Look at what choices are rewarded.", "essayEn": "People may support reform in words without changing. A workplace may praise cooperation while rewarding only individual competition. When declared values and actual incentives diverge, which way will behavior go? Needs, risks, resources, and arrangements interact. Review what choices receive rewards rather than endlessly asking people to improve. Small action: list each participant's interests and concerns in a collaboration."}, {"id": 58, "zh": "策略預測力", "wisdom": "思考別人可能怎麼回應", "action": "列出兩種反應", "group": 11, "essayTitle": "做決策之前，先想別人會怎麼回應", "essay": "你降低價格，競爭者可能跟進。\n你增加規定，學生可能配合，也可能尋找漏洞。\n你提出要求，對方可能接受，也可能反抗。\n如果只計算自己的行動，不考慮別人的反應，策略就只完成一半。\n世界不是單人遊戲，而是彼此預測、彼此調整的動態互動。\n真正的策略智慧，是把他人的選擇也放進模型。\n最小行動｜替一項決策列出對方可能的兩種反應。", "en": "Strategic anticipation", "wisdomEn": "Consider how others may respond.", "actionEn": "List two possible responses.", "essayTitleEn": "Consider another person's next move.", "essayEn": "A price cut may prompt a competitor's response. More rules may lead to cooperation or loopholes. A request may lead to acceptance or resistance. A strategy that considers only your action remains incomplete. Shared life involves mutual anticipation and adjustment. Put other people's possible choices into your picture. Small action: list two possible responses to one decision."}, {"id": 59, "zh": "合作設計力", "wisdom": "建立公平可行的規則", "action": "寫下一項共同約定", "group": 11, "essayTitle": "好的關係，不只靠善意，也靠好的規則", "essay": "一開始大家說互相信任，後來卻為分工與利益爭吵。\n不是每個人都變壞了，也可能是原本的約定太模糊。\n誰負責？誰決定？成果怎麼分配？出現問題如何處理？\n如果這些問題沒有答案，善意能承受多少誤解？\n真正成熟的合作，是把期待轉化成透明、可執行、可修正的規則。\n讓規則保護信任，而不是讓信任代替規則。\n最小行動｜替一項合作寫下一條清楚的共同約定。", "en": "Cooperation design", "wisdomEn": "Build fair and workable agreements.", "actionEn": "Write one shared agreement.", "essayTitleEn": "Trust benefits from clear agreements.", "essayEn": "People begin with goodwill and later argue over work and rewards. This need not mean everyone changed character; expectations may have been vague. Who acts, who decides, how are results divided, and what happens when trouble arises? Cooperation turns expectations into transparent, workable, revisable agreements. Let agreements protect trust. Small action: write one clear rule for a shared task."}, {"id": 60, "zh": "進退判斷力", "wisdom": "知道何時繼續或退出", "action": "設定停止條件", "group": 11, "essayTitle": "智慧不只知道如何堅持，也知道何時離開", "essay": "有人把堅持當成美德，卻從不檢查方向。\n有人因為已經投入太多時間，便不敢停止錯誤的選擇。\n可是，過去付出的代價，真的能證明未來值得繼續嗎？\n前進需要勇氣，退出同樣需要判斷。\n真正的成熟，不是永不放棄，而是清楚知道什麼值得守護、什麼需要調整。\n有時候，轉身不是失敗，而是把生命還給更重要的方向。\n最小行動｜替一項長期投入設定繼續與停止的條件。", "en": "Knowing when to continue", "wisdomEn": "Judge when to continue or withdraw.", "actionEn": "Set a stopping condition.", "essayTitleEn": "Wisdom includes knowing when to leave.", "essayEn": "Some praise persistence without reviewing direction. Others keep making a poor choice because so much time is already invested. Does a past cost prove future effort is worthwhile? Continuing takes courage; withdrawing takes judgment too. Maturity knows what deserves protection and what needs adjustment. Turning can restore life to a more meaningful direction. Small action: define conditions for continuing and stopping one long-term effort."}, {"id": 61, "zh": "目標設定力", "wisdom": "知道真正想改善什麼", "action": "寫下一個可衡量目標", "group": 12, "essayTitle": "沒有方向的努力，只會讓疲憊變得合理", "essay": "每天忙碌，不代表每天前進。\n完成很多任務，不代表接近真正想要的生活。\n如果連目標都說不清楚，怎麼知道自己正在進步？\n有人追逐成績，卻忘了學習能力；有人追逐收入，卻失去健康與關係。\n目標不是用來綁架人生，而是幫助資源找到方向。\n真正的智慧，是讓目標符合價值，也能接受現實檢驗。\n最小行動｜寫下一個可以衡量、具有期限的改善目標。", "en": "Goal setting", "wisdomEn": "Name what you want to improve.", "actionEn": "Write one observable goal.", "essayTitleEn": "Effort needs a direction.", "essayEn": "Daily busyness does not ensure progress, and many completed tasks need not bring the life you want closer. Without a clear goal, what counts as improvement? Scores can displace learning, and income can displace health and relationships. Goals help resources find a direction. Align them with values and leave them open to experience. Small action: write one improvement goal with a deadline and a way to recognize progress."}, {"id": 62, "zh": "優先排序力", "wisdom": "把重要事情放前面", "action": "選出今日前三件", "group": 12, "essayTitle": "人生的品質，取決於你先處理什麼", "essay": "重要的事不一定緊急，緊急的事也不一定重要。\n手機通知總是先響，長期夢想卻從不催促。\n如果每天都被眼前的聲音帶走，真正重要的事何時才能開始？\n優先排序不是把所有事情做完，而是接受時間有限的現實。\n當你願意先選擇最重要的事，生活才不再只是被動回應。\n真正的自由，從重新安排自己的順序開始。\n最小行動｜今天只選三件最重要的事情，先完成第一件。", "en": "Prioritization", "wisdomEn": "Put important things first.", "actionEn": "Choose today's top three tasks.", "essayTitleEn": "What comes first shapes a life.", "essayEn": "Important things need not be urgent; urgent things need not be important. Notifications call loudly while long-term dreams remain quiet. If immediate demands always lead, when will meaningful work begin? Prioritizing accepts limited time rather than promising to finish everything. Choosing what matters first makes life more intentional. Small action: choose three important tasks today and complete the first one before the rest."}, {"id": 63, "zh": "利弊權衡力", "wisdom": "比較選擇的好處與代價", "action": "列出兩個選項優缺點", "group": 12, "essayTitle": "每個選擇，都有看得見與看不見的代價", "essay": "換工作可能增加收入，也可能減少陪伴家人的時間。\n繼續進修可能提升能力，也需要投入金錢與精力。\n沒有代價的選擇很少，沒有取捨的人生也很難存在。\n如果只看眼前好處，是否忽略了長期成本？\n真正的決策，不是尋找完美選項，而是比較不同選擇的收益、風險與可逆性。\n看懂代價，選擇才會更接近自由。\n最小行動｜替兩個選項各寫出一項好處與一項代價。", "en": "Weighing trade-offs", "wisdomEn": "Compare benefits and costs.", "actionEn": "List pros and cons for two options.", "essayTitleEn": "Every choice includes visible and hidden costs.", "essayEn": "A new job may increase income and reduce family time. Further study may build ability while costing money and energy. Few choices have no cost. If you see only immediate benefits, what longer costs disappear? Decision making compares gains, risks, and reversibility rather than seeking perfection. Understanding costs can make choice freer. Small action: name one benefit and one cost for each of two options."}, {"id": 64, "zh": "風險評估力", "wisdom": "先想可能的損失", "action": "寫出最壞情況", "group": 12, "essayTitle": "真正的勇敢，不是相信壞事不會發生", "essay": "投資之前只想獲利，合作之前只想成功，出發之前只想順利。\n這樣的樂觀，可能讓人忽略必要的準備。\n如果結果不如預期，你能承受多少損失？\n風險評估不是悲觀，而是讓希望擁有邊界。\n真正成熟的人，不需要把所有未知變成恐懼，也不會把所有可能當成保證。\n能看見風險，才能為重要的未來留下退路。\n最小行動｜替一項決策寫出最壞情況與可承受的損失。", "en": "Risk awareness", "wisdomEn": "Consider possible losses.", "actionEn": "Describe the worst case.", "essayTitleEn": "Courage can include preparing for difficulty.", "essayEn": "Before investing, partnering, or departing, optimism can focus only on gains, success, or smooth travel. What can you bear if expectations fail? Considering risk gives hope boundaries. Unknowns need not all become fears, and possibilities need not become guarantees. Seeing risk leaves a way back for what matters. Small action: describe a worst case and an acceptable loss for one decision."}, {"id": 65, "zh": "決斷力", "wisdom": "資訊足夠時願意選擇", "action": "決定下一步", "group": 12, "essayTitle": "等待完美答案，也是一種選擇", "essay": "有人一直蒐集資料，卻從不開始。\n有人不斷詢問別人，卻不願承擔決定。\n看似謹慎，實際可能是害怕錯誤。\n可是，資訊永遠可能不完整，人生也不會永遠等待。\n決斷不是衝動，而是在風險可控、資訊足夠時願意採取下一步。\n真正的智慧，不是保證每次選對，而是讓選擇能被檢驗與修正。\n最小行動｜為一件已評估的小事設定決定期限。", "en": "Decisiveness", "wisdomEn": "Choose when you have enough information.", "actionEn": "Decide on the next step.", "essayTitleEn": "Waiting for a perfect answer is also a choice.", "essayEn": "Some keep collecting information without starting; others keep asking for advice without deciding. Apparent caution can conceal fear of error. Yet information may always remain incomplete and life keeps moving. Decisiveness takes a next step when understanding is sufficient and risk is manageable. Make choices that can be examined and revised. Small action: set a decision deadline for one small matter you have already reviewed."}, {"id": 66, "zh": "時間管理力", "wisdom": "把時間留給重要事情", "action": "安排二十分鐘", "group": 13, "essayTitle": "你如何使用時間，就是你如何塑造人生", "essay": "每個人一天都只有二十四小時，但生活的方向可以完全不同。\n有人把時間交給通知，有人把時間留給創造。\n有人每天處理別人的緊急事件，卻始終沒有經營自己的長期目標。\n如果時間永遠被外界安排，你還能決定人生的方向嗎？\n時間管理不是塞滿行程，而是讓有限的時間服務真正重要的價值。\n最小行動｜今天保留二十分鐘，不受干擾地完成重要任務。", "en": "Time management", "wisdomEn": "Make time for what matters.", "actionEn": "Reserve twenty minutes.", "essayTitleEn": "How you use time shapes your life.", "essayEn": "Everyone has twenty-four hours, but days take very different directions. Some surrender time to notifications; others protect it for creation. Constantly handling others' urgent matters can leave personal long-term goals unattended. If the outside world always schedules your time, how can you choose a direction? Let limited time serve meaningful values. Small action: reserve twenty undisturbed minutes for one important task."}, {"id": 67, "zh": "精力管理力", "wisdom": "配合自己的精神狀態做事", "action": "把難事放在清醒時", "group": 13, "essayTitle": "不是每個時刻，都適合做同樣的事", "essay": "精神清醒時處理瑣事，疲憊不堪時才開始思考重要問題。\n這不是不努力，而是資源配置可能出了問題。\n人的專注、體力與情緒狀態會隨時間變動。\n如果忽略自己的節律，為什麼期待每個時段都有相同效率？\n真正的精力管理，是讓任務與狀態更合理地配合。\n不是逼自己永遠高效，而是讓有限能量產生更好的成果。\n最小行動｜把今天最需要思考的工作安排在較清醒的時段。", "en": "Energy management", "wisdomEn": "Match tasks to your present capacity.", "actionEn": "Do demanding work when alert.", "essayTitleEn": "Different moments suit different tasks.", "essayEn": "Doing small chores while clearheaded and important thinking while exhausted may reflect poor arrangement rather than lack of effort. Attention, physical capacity, and emotional experience vary over time. Why expect identical work from every period? Matching tasks to your state can help limited energy support meaningful results. Small action: schedule today's most demanding thinking for a time when you tend to feel alert."}, {"id": 68, "zh": "財務規劃力", "wisdom": "理解收入支出與風險", "action": "記錄一筆支出", "group": 13, "essayTitle": "金錢真正的價值，是增加人生的選擇", "essay": "有人收入增加，焦慮卻沒有減少。\n有人努力存錢，卻不知道自己真正想保護什麼。\n金錢可以購買資源，卻不能自動帶來方向。\n如果每一次消費都只是回應當下慾望，未來還剩多少自由？\n財務規劃不是只追求更多數字，而是讓收入、支出、風險與生活價值彼此對齊。\n當資源有了秩序，選擇才有更大的空間。\n最小行動｜記錄今天一筆支出，判斷它是否符合自己的優先目標。", "en": "Financial planning", "wisdomEn": "Understand income, spending, and uncertainty.", "actionEn": "Record one expense.", "essayTitleEn": "Money can widen life's choices.", "essayEn": "More income may not reduce anxiety, and saving may lack a clear purpose. Money buys resources without supplying direction. If each purchase simply answers an immediate desire, what freedom remains later? Planning aligns income, expenses, uncertainty, and values. Order in resources can create room for choice. Small action: record one expense and consider whether it serves a priority."}, {"id": 69, "zh": "工具運用力", "wisdom": "選擇適合的工具", "action": "試用一項工具", "group": 13, "essayTitle": "真正的高手，不是什麼都自己做", "essay": "有人花三小時重複整理資料，有人利用適合的工具縮短流程。\n有人把工具當成威脅，有人把工具當成能力延伸。\n但工具愈多，就一定愈有效率嗎？\n如果沒有清楚目標，再強大的工具也可能增加混亂。\n真正的工具智慧，是知道什麼應該交給工具，什麼仍需要人的判斷。\n讓工具減少重複，讓自己保留思考。\n最小行動｜找一項重複工作，試用工具簡化其中一個步驟。", "en": "Tool use", "wisdomEn": "Choose tools suited to the task.", "actionEn": "Try one suitable tool.", "essayTitleEn": "Skill includes knowing what to entrust to a tool.", "essayEn": "One person spends hours sorting repeated material while another shortens the process with a tool. Some see tools as threats; others as extensions of ability. Do more tools always improve work? Without a clear purpose, powerful tools can add confusion. Decide what a tool can do and what still needs human judgment. Small action: use a tool to simplify one step of a repeated task."}, {"id": 70, "zh": "槓桿辨識力", "wisdom": "用較少資源改善關鍵問題", "action": "找一個可重複流程", "group": 13, "essayTitle": "努力的最高境界，是讓一次努力產生多次價值", "essay": "每天重複回答相同問題，為什麼不建立一份常見問題庫？\n每次重新製作教材，為什麼不建立可更新的內容母體？\n每次遇到錯誤都從頭處理，為什麼不累積修正紀錄？\n槓桿不是投機取巧，而是讓有效的方法可以重複使用。\n真正的智慧，不只是把事情做好一次，而是讓好的成果能持續產生價值。\n最小行動｜把今天一項重複任務整理成三步流程。", "en": "Leverage awareness", "wisdomEn": "Use resources at a useful point.", "actionEn": "Find a reusable process.", "essayTitleEn": "Let one effort create repeated value.", "essayEn": "Why repeatedly answer the same question without a question library, rebuild teaching material without reusable content, or restart error handling without records? Leverage lets effective approaches be reused. Wisdom includes enabling good results to keep creating value. Small action: turn one repeated task into a three-step process today."}, {"id": 71, "zh": "任務拆解力", "wisdom": "把大事情拆成小步驟", "action": "拆成三步", "group": 14, "essayTitle": "真正困住你的，可能不是事情太難，而是第一步太大", "essay": "你想寫一本書，卻不知道從哪裡開始。\n你想改善健康，卻覺得生活必須全部重來。\n你想開發一個APP，卻被龐大功能嚇退。\n如果目標大到無法開始，為什麼不把它拆小？\n任務拆解不是降低夢想，而是讓夢想獲得可以執行的形狀。\n每一個巨大的成果，都需要找到能夠開始的入口。\n最小行動｜把一個大目標拆成三個可以執行的小步驟。", "en": "Task decomposition", "wisdomEn": "Break large work into small steps.", "actionEn": "Divide one task into three steps.", "essayTitleEn": "The first step may be too large.", "essayEn": "You want to write a book but cannot start, improve health but imagine rebuilding everything, or build an app but fear its many features. If a goal is too large to begin, why not divide it? Smaller tasks give a dream an actionable shape. Large outcomes need an entrance. Small action: divide one large goal into three manageable steps."}, {"id": 72, "zh": "開始行動力", "wisdom": "不等完美才開始", "action": "做兩分鐘", "group": 14, "essayTitle": "你不需要準備好全部，才能開始第一步", "essay": "有人等待完美時機，有人等待充足信心，有人等待所有條件到位。\n於是一天過去，一個月過去，夢想仍停留在腦海。\n如果信心需要透過行動累積，為什麼一定要先有信心才能開始？\n行動不是保證成功，而是讓想法第一次接受現實檢驗。\n真正的開始，不必盛大。\n有時候，只需要兩分鐘，人生便從想像進入現實。\n最小行動｜現在選一件重要小事，立刻做兩分鐘。", "en": "Beginning action", "wisdomEn": "Start before everything is perfect.", "actionEn": "Act for two minutes.", "essayTitleEn": "You can begin before everything is ready.", "essayEn": "Some wait for the right moment, confidence, or every condition to align. Days and months pass while a dream stays imagined. If confidence grows through action, why must it always come first? Action allows an idea to encounter reality. A beginning can be small: two minutes can carry life from imagination into practice. Small action: work on one important small task for two minutes now."}, {"id": 73, "zh": "持續執行力", "wisdom": "讓好行動重複發生", "action": "連做三天", "group": 14, "essayTitle": "改變人生的，往往不是一次爆發", "essay": "一天讀完一本書很令人興奮，但每天閱讀十分鐘可能更容易持續。\n一次運動三小時很有成就感，但建立穩定習慣可能更重要。\n我們常迷戀強烈的開始，卻忽略平凡的重複。\n如果一個方法只能維持三天，它真的適合長期生活嗎？\n持續不是靠意志力無限燃燒，而是建立容易重複的環境與節奏。\n讓微小行動持續發生，時間才有機會成為盟友。\n最小行動｜選一項兩分鐘習慣，連續執行三天。", "en": "Consistent action", "wisdomEn": "Make helpful actions repeatable.", "actionEn": "Repeat for three days.", "essayTitleEn": "Change often grows from ordinary repetition.", "essayEn": "Reading a book in one day is exciting; ten minutes daily may last longer. A three-hour workout feels impressive; a steady habit may be more sustainable. We admire dramatic starts while overlooking repetition. If a method lasts only three days, does it fit everyday life? Build a setting and rhythm that support small repeated actions. Small action: repeat one two-minute habit for three days."}, {"id": 74, "zh": "應變力", "wisdom": "遇到變化能調整方法", "action": "準備一個備案", "group": 14, "essayTitle": "計畫真正的價值，是幫助你面對變化", "essay": "考試範圍改變，工作突然增加，合作夥伴臨時退出。\n如果現實不照計畫進行，你要責怪世界，還是重新安排？\n沒有計畫容易混亂，只有一套計畫也可能脆弱。\n真正的應變，不是隨便改變方向，而是在目標不變時調整方法。\n當原本的道路暫時封閉，智慧會開始尋找新的入口。\n最小行動｜替一件重要任務準備一個簡單備案。", "en": "Adaptability", "wisdomEn": "Adjust methods when conditions change.", "actionEn": "Prepare one alternative plan.", "essayTitleEn": "A plan helps you meet change.", "essayEn": "An exam scope changes, work suddenly increases, or a partner withdraws. Will you blame the world or rearrange your approach? No plan can bring confusion, while only one plan can be fragile. Adaptation adjusts methods while keeping a purpose in view. A blocked road invites another entrance. Small action: prepare a simple backup for one important task."}, {"id": 75, "zh": "完成交付力", "wisdom": "把想法做成可使用成果", "action": "完成一件小作品", "group": 14, "essayTitle": "想法再美，沒有成果仍只是可能", "essay": "你可以擁有一百個計畫、一千個靈感、無數個偉大願景。\n但如果沒有任何一件事真正完成，世界如何感受到它的價值？\n完成不代表完美，交付也不代表停止改善。\n真正的創造，是讓想法走出腦海，成為別人可以使用、檢查與回饋的成果。\n與其永遠等待最好的版本，不如先完成一個能夠更新的版本。\n最小行動｜今天完成並交付一件小作品。", "en": "Completion and delivery", "wisdomEn": "Turn an idea into a usable result.", "actionEn": "Finish one small piece of work.", "essayTitleEn": "An idea becomes useful through delivery.", "essayEn": "Hundreds of plans and thousands of inspirations remain possibilities if nothing is finished. How can others experience their value? Completion need not mean perfection or an end to improvement. Creation lets ideas become things people can use, examine, and respond to. Finish a version that can be renewed. Small action: complete and deliver one small piece of work today."}, {"id": 76, "zh": "自主學習力", "wisdom": "自己找出學習方向", "action": "設定今日學習題", "group": 15, "essayTitle": "真正的教育，是讓人不再永遠依賴老師", "essay": "老師可以提供答案，卻不能替學生思考一輩子。\n課程可以安排進度，卻不能保證學習者永遠保持好奇。\n如果一個人離開教室就停止學習，教育究竟完成了什麼？\n自主學習不是拒絕指導，而是逐步建立自己發現問題、尋找資源與檢查成果的能力。\n真正的學習自由，是即使沒有人安排，也知道如何繼續前進。\n最小行動｜今天自己提出一個學習問題，找出一項可靠資源。", "en": "Self-directed learning", "wisdomEn": "Choose your own learning direction.", "actionEn": "Choose today's learning question.", "essayTitleEn": "Education can lead toward learning independently.", "essayEn": "Teachers offer answers without thinking for students forever. Courses organize progress without guaranteeing curiosity. If learning ends outside the classroom, what has education achieved? Self-direction gradually develops the ability to notice questions, find resources, and review results. Learning freedom includes moving forward without someone arranging everything. Small action: pose your own learning question and find one reliable resource."}, {"id": 77, "zh": "記憶提取力", "wisdom": "不看答案也能回想", "action": "閉書說出三點", "group": 15, "essayTitle": "看過很多次，不代表真正學會", "essay": "你看著課本，覺得每一句都很熟悉。\n考試時合上書，卻突然什麼都想不起來。\n熟悉感很容易被誤認成掌握感。\n如果沒有答案提示，你還能自己說出重點嗎？\n真正的學習，不只是讓資訊進入眼睛，而是讓知識能在需要時被提取。\n與其反覆確認自己看懂，不如練習證明自己能想起。\n最小行動｜合上書本，憑記憶說出今天學到的三個重點。", "en": "Retrieval", "wisdomEn": "Recall without looking at an answer.", "actionEn": "Close the book and name three points.", "essayTitleEn": "Familiarity is different from being able to recall.", "essayEn": "Every sentence looks familiar with the textbook open, yet an exam can leave you unable to remember. Familiarity can feel like mastery. Can you explain the key points without prompts? Learning includes having understanding available when needed. Practice recalling instead of only checking whether a page feels familiar. Small action: close the book and recall three things learned today."}, {"id": 78, "zh": "刻意練習力", "wisdom": "專練不熟的部分", "action": "練習一個弱點", "group": 15, "essayTitle": "進步不是練得多，而是知道該練哪裡", "essay": "一個學生每天寫很多題，卻總是錯在相同觀念。\n一個人每天練習說話，卻始終沒有改善表達的盲點。\n重複可以帶來熟悉，但不一定帶來突破。\n如果每次都只練自己已經會的部分，能力如何升級？\n真正有效的練習，是辨認弱點、設計挑戰、取得回饋，再修正方法。\n進步不是累積辛苦，而是縮小能力缺口。\n最小行動｜今天只挑一個最常犯的錯誤，集中練習五分鐘。", "en": "Focused practice", "wisdomEn": "Practice a part you find difficult.", "actionEn": "Practice one weak point.", "essayTitleEn": "Progress includes knowing what to practice.", "essayEn": "A student completes many exercises but misses the same idea. Someone practices speaking without noticing a recurring blind spot. Repetition can build familiarity without changing the difficulty. If you only practice what you already know, where can growth begin? Notice a weakness, choose a challenge, seek feedback, and adjust. Small action: spend five minutes on one common mistake."}, {"id": 79, "zh": "錯誤診斷力", "wisdom": "找出錯在哪一類", "action": "替錯題分類", "group": 15, "essayTitle": "錯誤不是敵人，而是系統發出的訊號", "essay": "同樣考錯一題，可能是單字不會、句型誤解、推理失誤，也可能是時間不足。\n如果所有錯誤都只被叫作粗心，下一次要改變什麼？\n沒有診斷的努力，容易反覆浪費。\n真正的學習，不是把錯題藏起來，而是替錯誤找到正確位置。\n當錯誤能被分類，修正才有方向。\n每一道錯題，都可能是一張通往能力升級的地圖。\n最小行動｜替今天一個錯誤標記具體原因。", "en": "Error diagnosis", "wisdomEn": "Locate the kind of mistake.", "actionEn": "Classify one error.", "essayTitleEn": "An error can become a useful signal.", "essayEn": "A wrong answer can arise from vocabulary, misunderstood structure, reasoning, or limited time. If every error is called carelessness, what should change next? Effort without diagnosis can repeat waste. Learning gives mistakes a useful place rather than hiding them. Once categorized, they can guide revision. Small action: assign a specific possible cause to one mistake today."}, {"id": 80, "zh": "遷移應用力", "wisdom": "把學會的方法用到新地方", "action": "換一題型再試", "group": 15, "essayTitle": "真正學會，是離開原本情境仍然能用", "essay": "學生會做課本例題，換個題目卻不會。\n大人讀懂溝通技巧，回到家庭仍然只會爭吵。\n如果知識只能停留在原來的情境，究竟學會了多少？\n遷移不是機械複製，而是辨認不同情境中的共同結構。\n當你能把課堂上的方法用在生活，把生活中的洞察用在工作，知識才開始流動。\n最小行動｜把今天學到的一個原則用在不同情境。", "en": "Transfer", "wisdomEn": "Use learning in a new situation.", "actionEn": "Try the method in another context.", "essayTitleEn": "Understanding travels beyond its first setting.", "essayEn": "A student solves a textbook example but struggles with a variation. An adult reads communication advice but still argues at home. How much has been learned if understanding cannot leave its first setting? Transfer recognizes shared structure rather than copying mechanically. Let classroom methods enter life and everyday insight enter work. Small action: use one principle learned today in a different context."}, {"id": 81, "zh": "好奇探索力", "wisdom": "對未知保持興趣", "action": "研究一個新問題", "group": 16, "essayTitle": "智慧從承認自己還不知道開始", "essay": "孩子問天空為什麼是藍色，大人可能說不要問那麼多。\n學生問規則為什麼如此，老師可能說考試就是這樣。\n久而久之，我們學會接受答案，卻忘記探索未知。\n如果一切都只求快速結束，新的理解從哪裡誕生？\n好奇不是幼稚，而是願意讓世界超越既有想像。\n真正的成長，始於一句真誠的「我還想知道」。\n最小行動｜今天研究一個自己原本不懂的小問題。", "en": "Curiosity", "wisdomEn": "Stay interested in the unknown.", "actionEn": "Explore one new question.", "essayTitleEn": "Wisdom begins by admitting what is unknown.", "essayEn": "A child asks about the sky and is told to stop asking. A student asks about a rule and is told it is on the test. We learn to accept answers while forgetting exploration. If everything must close quickly, where can new understanding arise? Curiosity lets the world exceed our expectations. Growth begins with wanting to know more. Small action: explore one small question you do not yet understand."}, {"id": 82, "zh": "跨域連結力", "wisdom": "連接不同領域的方法", "action": "找兩個領域的共通點", "group": 16, "essayTitle": "創新常發生在兩個世界相遇的地方", "essay": "教育可以借鏡遊戲設計，健康管理可以借鏡回饋控制，人生決策可以借鏡策略互動。\n不同領域看似遙遠，卻可能共享相似結構。\n如果永遠只用同一套語言理解問題，如何看見新的可能？\n跨域不是把名詞堆在一起，而是找到可以檢驗的共同機制。\n當不同知識彼此照亮，原本封閉的問題便可能出現新的入口。\n最小行動｜找出兩個不同領域的一項共同原理與一項差異。", "en": "Cross-domain connection", "wisdomEn": "Connect approaches across fields.", "actionEn": "Find a similarity between two fields.", "essayTitleEn": "Innovation can emerge where worlds meet.", "essayEn": "Education can learn from games, health management from feedback practices, and life decisions from strategic interaction. Distant fields may share patterns. If only one language frames every problem, how can new possibilities appear? Connecting fields means finding meaningful, examinable links rather than piling up terms. Different forms of understanding can illuminate each other. Small action: find one shared principle and one difference across two fields."}, {"id": 83, "zh": "逆向思考力", "wisdom": "從相反方向尋找可能", "action": "問如果反過來", "group": 16, "essayTitle": "當所有人都往前看，不妨從終點往回走", "essay": "你想提高效率，可以先問什麼事情最浪費時間。\n你想建立信任，可以先問什麼行為最容易破壞信任。\n你想讓學生進步，可以先問什麼教學方式讓他們更不敢學習。\n為什麼一定要從增加開始，不能先從減少開始？\n逆向思考不是故意唱反調，而是讓熟悉的問題出現另一個入口。\n有時候，最有效的改變，是先停止製造原本的阻礙。\n最小行動｜對一個目標提出「怎樣會讓它更糟」的反向問題。", "en": "Reverse thinking", "wisdomEn": "Explore from the opposite direction.", "actionEn": "Ask what happens if you reverse it.", "essayTitleEn": "Try looking backward from an outcome.", "essayEn": "To improve efficiency, ask what wastes time. To build trust, ask what destroys it. To support learning, ask what makes students afraid to learn. Why begin only by adding rather than removing? Reversal gives a familiar problem another entrance. Sometimes the best change is to stop creating an obstacle. Small action: ask what would make one goal harder to reach."}, {"id": 84, "zh": "方案生成力", "wisdom": "不只想一個答案", "action": "提出三種方案", "group": 16, "essayTitle": "只有一個答案的人，最容易被答案困住", "essay": "遇到問題時，我們常急著選擇第一個想到的方法。\n但第一個答案，可能只是最熟悉的答案。\n如果這條路走不通，是否代表沒有其他道路？\n真正的創造力，不是立刻找到完美方案，而是先增加可能性，再評估限制。\n當選項從一個變成三個，思考便從被迫接受走向主動選擇。\n智慧不是永遠有答案，而是知道如何生成新答案。\n最小行動｜為一個困境提出三種不同做法。", "en": "Generating options", "wisdomEn": "Create more than one answer.", "actionEn": "Propose three approaches.", "essayTitleEn": "One answer can trap its owner.", "essayEn": "The first approach that comes to mind may simply be the most familiar. If that path closes, are there really no others? Creativity expands possibilities before evaluating limits. Three options turn forced acceptance toward active choice. Wisdom includes knowing how to generate new answers. Small action: propose three different approaches to one difficulty."}, {"id": 85, "zh": "原型測試力", "wisdom": "先做小版本檢查", "action": "完成一個簡易樣本", "group": 16, "essayTitle": "不要用一年幻想，取代一天測試", "essay": "你想開發課程，卻一直等待所有內容完整。\n你想創業，卻不敢先詢問真正的顧客需求。\n你想建立APP，卻遲遲沒有做出第一個可使用畫面。\n如果想法從未接受現實檢驗，怎麼知道它是否有價值？\n原型不是粗糙的失敗品，而是低成本取得回饋的工具。\n先讓一個小版本活在現實裡，再讓回饋決定下一次更新。\n最小行動｜把一個想法做成最簡單的可測試樣本。", "en": "Prototyping", "wisdomEn": "Examine an idea through a small version.", "actionEn": "Make a simple sample.", "essayTitleEn": "Give an idea an early encounter with use.", "essayEn": "You want a course but wait for all material, a business but avoid asking customers, or an app but delay its first usable screen. How can you discover value without an encounter with reality? A prototype is a way to gain feedback at low cost. Let a small version exist, then use experience to guide revision. Small action: make the simplest usable sample of one idea."}, {"id": 86, "zh": "價值澄清力", "wisdom": "知道什麼對自己重要", "action": "寫下三個價值", "group": 17, "essayTitle": "最可怕的迷失，是成功後才發現走錯方向", "essay": "你努力賺錢，卻失去陪伴重要之人的時間。\n你追求成就，卻忘了健康與自由。\n你得到別人的掌聲，卻不知道自己是否真正快樂。\n如果目標不是來自自己的價值，再大的成功能帶來多少滿足？\n價值澄清不是尋找標準答案，而是辨認什麼值得長期投入。\n當方向清楚，選擇才不必永遠被外界的聲音左右。\n最小行動｜寫下自己最重要的三項價值。", "en": "Value clarification", "wisdomEn": "Identify what matters to you.", "actionEn": "Write your three core values.", "essayTitleEn": "Success can arrive in the wrong direction.", "essayEn": "Earning more can reduce time with loved ones. Achievement can displace health and freedom. Applause need not bring fulfillment. If goals do not reflect your values, how satisfying can success be? Clarification identifies what deserves sustained attention. A clearer direction leaves choices less dependent on outside voices. Small action: name your three most important values."}, {"id": 87, "zh": "責任承擔力", "wisdom": "承認自己能負責的部分", "action": "完成一項承諾", "group": 17, "essayTitle": "成熟不是把所有錯誤都攬在身上", "essay": "有些人遇到問題，只會責怪別人。\n有些人遇到問題，卻把所有責任都變成自己的罪。\n這兩種反應，看似相反，卻都可能忽略真正的責任邊界。\n你能控制什麼？能影響什麼？又有哪些事情不是你能決定的？\n真正的負責，不是無限自責，而是承擔自己可以改善的部分。\n把責任放回正確位置，行動才有力量。\n最小行動｜找出一件自己能負責的事，完成一項具體承諾。", "en": "Responsibility", "wisdomEn": "Accept the part you can answer for.", "actionEn": "Keep one commitment.", "essayTitleEn": "Maturity locates responsibility carefully.", "
