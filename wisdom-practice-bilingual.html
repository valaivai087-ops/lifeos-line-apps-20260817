essayEn": "Some blame everyone else; others turn every problem into personal guilt. Both can miss the actual boundaries of responsibility. What can you control, influence, or not determine? Responsibility includes improving your part rather than endless self-accusation. Place it appropriately so action gains strength. Small action: identify something you can be responsible for and fulfill one concrete promise."}, {"id": 88, "zh": "公平判斷力", "wisdom": "考慮各方合理權益", "action": "檢查分配是否公平", "group": 17, "essayTitle": "公平不是每個人得到一模一樣的東西", "essay": "一個團隊裡，有人投入很多，有人投入很少。\n如果成果完全相同，是否公平？\n一個班級裡，有人需要更多協助，有人已經能獨立完成。\n如果資源完全平均，是否真正照顧到需求？\n公平不是只有一把尺，而是需要檢查貢獻、需求、權利與規則。\n真正的公平，不是讓所有人感覺舒服，而是讓分配有清楚且可檢驗的理由。\n最小行動｜檢查一項分配決定是否兼顧規則與不同需求。", "en": "Fairness", "wisdomEn": "Consider legitimate interests on all sides.", "actionEn": "Review one distribution.", "essayTitleEn": "Fairness can involve more than equal shares.", "essayEn": "If team members contribute differently, is an identical reward fair? If students need different support, does an even resource split meet their needs? Fairness involves contribution, need, rights, and agreements. It seeks understandable, examinable reasons rather than universal comfort. Small action: review whether one allocation considers both shared rules and different needs."}, {"id": 89, "zh": "尊重差異力", "wisdom": "不因不同就否定別人", "action": "理解一種不同觀點", "group": 17, "essayTitle": "別人的不同，不等於你的世界受到威脅", "essay": "有人重視穩定，有人喜歡探索。\n有人需要獨處，有人透過交流獲得力量。\n有人用理性整理問題，有人先從情緒理解經驗。\n為什麼別人的生活方式不同，就一定需要被糾正？\n尊重不是放棄判斷，也不是接受傷害。\n它是承認人可以擁有不同的需求與選擇。\n當我們不再急著把所有人變成自己，關係才可能真正自由。\n最小行動｜今天理解一個與自己不同的觀點，不急著反駁。", "en": "Respect for difference", "wisdomEn": "Do not dismiss someone for being different.", "actionEn": "Understand one different perspective.", "essayTitleEn": "Difference need not threaten your world.", "essayEn": "Some seek stability, others exploration; some need solitude, others connection; some begin with reasoning, others with feelings. Why must a different way of living be corrected? Respect can retain judgment and boundaries against harm while accepting varied needs and choices. Relationships can become freer when we stop trying to make everyone resemble ourselves. Small action: understand one different viewpoint without immediately arguing."}, {"id": 90, "zh": "長期利他力", "wisdom": "幫助他人增加自主能力", "action": "教會對方一個方法", "group": 17, "essayTitle": "最高層次的幫助，是讓對方逐漸不需要你", "essay": "你可以替孩子完成作業，也可以教他如何找到答案。\n你可以一直替別人解決問題，也可以協助他建立解決問題的能力。\n前者帶來立即成果，後者可能創造長期自主。\n如果幫助讓對方越來越依賴，這真的是最好的幫助嗎？\n真正的利他，不是讓自己永遠不可取代，而是讓更多人有能力選擇自己的道路。\n最小行動｜今天教會一個人一項可以獨立使用的方法。", "en": "Long-term generosity", "wisdomEn": "Help others become more independent.", "actionEn": "Teach a reusable method.", "essayTitleEn": "Help can grow another person's independence.", "essayEn": "You can do a child's homework or teach how to find an answer. You can keep solving someone's problems or help them develop that ability. One gives immediate results; the other may build autonomy. Is increasing dependence the best help? Generosity lets more people choose their own paths. Small action: teach someone a method they can use independently today."}, {"id": 91, "zh": "預測力", "wisdom": "事先說出可能結果", "action": "寫下一項預測", "group": 18, "essayTitle": "智慧不是事後解釋，而是事前願意接受檢驗", "essay": "事情發生後，我們總能找到很多理由。\n成功了，說自己早就知道；失敗了，說環境本來就不確定。\n但如果從未事先留下預測，怎麼知道模型究竟準不準？\n預測不是算命，而是把理解轉化為可以比較的期待。\n當你願意記錄自己可能看錯的地方，學習才真正開始。\n真正的智慧，不是永遠猜中，而是逐步改善判斷。\n最小行動｜寫下一項明確預測、期限與預期結果。", "en": "Prediction", "wisdomEn": "State an expected result in advance.", "actionEn": "Write one prediction.", "essayTitleEn": "Let expectations be open to later review.", "essayEn": "After an event, explanations are easy: success was obvious and failure was uncertainty. Without an earlier record, how can you assess your understanding? Prediction turns an interpretation into an expectation that can be compared with experience. Recording where you may be mistaken opens learning. Wisdom gradually improves judgment. Small action: write one clear prediction, a deadline, and an expected outcome."}, {"id": 92, "zh": "測量力", "wisdom": "用適當指標記錄結果", "action": "記錄一個數字", "group": 18, "essayTitle": "沒有紀錄的進步，很容易變成感覺", "essay": "你說自己變得更專注，但每天真正專注多久？\n你說學生進步很多，但哪些題型的錯誤減少了？\n你說工作效率提高，但完成相同任務需要多少時間？\n感覺很重要，卻不一定足以判斷變化。\n測量不是把人生變成數字，而是替重要的改變留下可檢查的痕跡。\n當數字與經驗彼此對照，理解才更有根據。\n最小行動｜替一項目標選擇一個簡單、可重複記錄的指標。", "en": "Measurement", "wisdomEn": "Record outcomes with a suitable indicator.", "actionEn": "Record one number.", "essayTitleEn": "Keep a trace of meaningful change.", "essayEn": "You feel more focused, but for how long each day? Students improve, but which mistakes diminish? Work feels faster, but how long does the same task take? Feelings matter without always establishing change. Recording an indicator leaves a trace that can be reviewed alongside experience. Small action: choose one simple, repeatable indicator for a goal."}, {"id": 93, "zh": "回饋分析力", "wisdom": "比較預期與實際", "action": "寫出一個差異", "group": 18, "essayTitle": "現實不是來證明你正確，而是幫助你更新", "essay": "你以為學生已經聽懂，測驗結果卻顯示大量誤解。\n你以為顧客需要更多產品，回饋卻指出他們更需要清楚說明。\n你可以責怪結果，也可以重新檢查原本的判斷。\n如果現實與期待不同，真正值得問的是什麼？\n不是誰讓我失望，而是哪個假設需要修正。\n當回饋不再只是評價，便能成為智慧生成的燃料。\n最小行動｜比較今天一項預期與實際結果，寫出差異。", "en": "Feedback analysis", "wisdomEn": "Compare expectations with experience.", "actionEn": "Write down one difference.", "essayTitleEn": "Experience offers an invitation to revise.", "essayEn": "You think students understand, yet their work reveals confusion. You think customers need more products, yet they ask for clearer guidance. You can blame the result or reconsider your judgment. When reality differs from expectation, which assumption needs review? Feedback can become material for wisdom. Small action: compare one expected outcome with what actually happened today."}, {"id": 94, "zh": "誤差歸因力", "wisdom": "找出偏差可能來自哪裡", "action": "辨識一種錯誤", "group": 18, "essayTitle": "找到錯誤的位置，比急著責怪自己更重要", "essay": "結果不好，可能是觀察不足、理解錯誤、權重失準，也可能是行動時機不對。\n如果每次都只說自己不夠努力，真正的問題怎麼被找到？\n努力是資源，不是萬能解釋。\n真正的誤差歸因，是檢查問題發生在哪個環節，而不是替失敗尋找一個可以責怪的人。\n當錯誤找到位置，修正才可能精準。\n最小行動｜把一次失誤歸入觀察、理解、判斷、行動或測量其中一類。", "en": "Error attribution", "wisdomEn": "Locate a possible source of a discrepancy.", "actionEn": "Identify one kind of error.", "essayTitleEn": "Locate an error before blaming yourself.", "essayEn": "A poor result may involve missing observations, misunderstood meaning, misplaced importance, or timing. If every failure means insufficient effort, how will the actual difficulty be found? Effort is a resource rather than an explanation for everything. Review where a discrepancy arose rather than searching for someone to blame. Small action: place one error under observation, understanding, judgment, action, or measurement."}, {"id": 95, "zh": "模型更新力", "wisdom": "根據證據修正理解", "action": "修改一項假設", "group": 18, "essayTitle": "真正的成長，是允許昨天的自己被今天修正", "essay": "曾經有效的方法，可能不再適用。\n曾經相信的觀念，可能需要重新檢查。\n曾經害怕的事情，也可能因為能力提升而不再相同。\n如果一個人永遠不能改變想法，知識再多又有什麼用？\n模型更新不是否定過去，而是讓過去的經驗成為新版本的材料。\n真正的自由，不是沒有歷史，而是不必永遠活在舊版本裡。\n最小行動｜根據一項新證據，修改一個原本的判斷。", "en": "Model revision", "wisdomEn": "Revise understanding with new evidence.", "actionEn": "Change one assumption.", "essayTitleEn": "Let today's experience revise yesterday's self.", "essayEn": "A useful method may become unsuitable, a trusted idea may need review, and an old fear may change as ability grows. What is knowledge worth if thought can never change? Revision lets past experience become material for a new version. Freedom includes not having to remain inside an old interpretation. Small action: revise one judgment using a new piece of evidence."}, {"id": 96, "zh": "知識壓縮力", "wisdom": "把複雜內容整理成重點", "action": "濃縮成五句", "group": 19, "essayTitle": "真正理解複雜的人，往往能把它說得簡單", "essay": "有人講了一個小時，聽眾仍不知道重點。\n有人只用五句話，就讓複雜問題有了清楚輪廓。\n簡單不是刪除重要差異，而是保留最有解釋力的結構。\n如果無法說清核心關係，是否代表自己還沒有真正整理好？\n知識壓縮不是讓思想變淺，而是讓重要資訊更容易被使用。\n真正的高手，能把複雜收進簡潔，卻不犧牲必要的深度。\n最小行動｜把今天學到的一個複雜概念濃縮成五句話。", "en": "Knowledge compression", "wisdomEn": "Distill complex material into essentials.", "actionEn": "Summarize in five sentences.", "essayTitleEn": "Depth can find a simple expression.", "essayEn": "One person speaks for an hour without conveying the point; another gives complexity a clear shape in five sentences. Simplicity preserves meaningful structure without erasing necessary differences. If key relations remain unclear, might understanding need more work? Compression makes important information more usable without sacrificing depth. Small action: express one complex concept in five sentences."}, {"id": 97, "zh": "知識解壓力", "wisdom": "把抽象原則用在生活", "action": "舉一個生活案例", "group": 19, "essayTitle": "懂得大道理，不代表能處理眼前的小事", "essay": "你知道尊重很重要，卻不知道如何回應孩子的頂嘴。\n你知道界線很重要，卻不知道如何拒絕不合理的要求。\n你知道模型更新很重要，卻不知道明天要改變哪個行動。\n如果一個道理無法進入生活，它還缺少什麼？\n缺少的是從抽象原則走向具體情境的橋樑。\n真正的智慧，不只會說大道理，也能設計小行動。\n最小行動｜替一個抽象原則寫出具體生活情境與對話句。", "en": "Knowledge expansion", "wisdomEn": "Bring an abstract principle into daily life.", "actionEn": "Give one everyday example.", "essayTitleEn": "A principle needs a bridge into the situation.", "essayEn": "You value respect but cannot respond to a child's sharp words. You value boundaries but cannot decline a demand. You value revision but cannot name tomorrow's changed action. What is missing when a principle cannot enter life? A bridge from abstraction to a concrete situation. Wisdom can design small actions. Small action: give one abstract principle an everyday example and a line of dialogue."}, {"id": 98, "zh": "世界模型整合力", "wisdom": "把人、事、物與規則連起來", "action": "畫一張關係圖", "group": 19, "essayTitle": "你不是活在事件裡，而是活在自己理解事件的方式裡", "essay": "同樣一次失敗，有人看見能力不足，有人看見方法需要調整。\n同樣一段衝突，有人只看見敵意，有人開始檢查需求與界線。\n事件不會自動告訴我們全部意義。\n我們透過記憶、語言、信念與經驗建立世界模型。\n如果模型永遠不更新，新的世界也可能被解讀成舊故事。\n真正的智慧，是讓理解保持開放，讓現實持續參與修正。\n最小行動｜畫出一件事件涉及的人、環境、信念與行動關係。", "en": "World-model integration", "wisdomEn": "Connect people, events, things, and rules.", "actionEn": "Draw a relationship map.", "essayTitleEn": "We live through our understanding of events.", "essayEn": "One person reads failure as inability, another as a need to change methods. One sees hostility in conflict, another examines needs and boundaries. Events do not supply all their meaning. Memory, language, belief, and experience shape interpretation. An unchanged model can turn a new world into an old story. Keep understanding open to revision. Small action: map the people, setting, beliefs, and actions within one event."}, {"id": 99, "zh": "元認知力", "wisdom": "知道自己怎麼想與怎麼學", "action": "檢查一個思考習慣", "group": 19, "essayTitle": "最高級的學習，是知道自己如何學習", "essay": "有人背書很久，卻不知道自己為何記不住。\n有人反覆犯錯，卻從不檢查思考習慣。\n有人相信自己很理性，卻沒有發現情緒如何影響判斷。\n如果你只能觀察世界，卻不能觀察自己的思考，智慧是否仍有盲點？\n元認知讓我們不只處理問題，也能檢查處理問題的方法。\n當思考開始理解自己，學習便有了更新的入口。\n最小行動｜今天回顧一個判斷，檢查自己用了什麼思考方式。", "en": "Metacognition", "wisdomEn": "Notice how you think and learn.", "actionEn": "Examine one thinking habit.", "essayTitleEn": "Learning can observe its own way of learning.", "essayEn": "Some memorize without asking why recall fails, repeat mistakes without reviewing thought habits, or assume reason is untouched by emotion. If you can observe the world but cannot examine your thinking, what remains unseen? Metacognition reviews how you approach a problem as well as the problem itself. Self-understanding opens revision. Small action: review one judgment and identify the approach you used."}, {"id": 100, "zh": "持續進化力", "wisdom": "反覆學習、驗證與更新", "action": "每週做一次模型回顧", "group": 19, "essayTitle": "人生最高的智慧，不是成為完美的人", "essay": "你不需要永遠正確，不需要永遠強大，也不需要一次解決所有問題。\n你需要的是看見、理解、提問、選擇、行動與更新的能力。\n當世界改變，你能重新學習；當方法失效，你能重新設計；當預測出錯，你能重新校準。\n真正的自由，不是掌握所有答案，而是不再被任何舊答案永久困住。\n願你像一條流動的河，不執著昨日的形狀，卻始終奔向更寬廣的海。\n最小行動｜每週回顧一次：我看錯什麼、學會什麼、下週更新什麼。", "en": "Continuing growth", "wisdomEn": "Keep learning, examining, and revising.", "actionEn": "Review your understanding each week.", "essayTitleEn": "Wisdom does not require becoming perfect.", "essayEn": "You need not always be right or strong, or solve every problem at once. You can cultivate noticing, understanding, questioning, choosing, acting, and revising. When life changes, learn again; when a method fails, redesign it; when an expectation fails, reconsider. Freedom need not hold every answer; it can escape permanent captivity to old ones. Like a river, keep moving beyond yesterday's shape toward a wider sea. Small action: review each week what you misread, learned, and will revise next."}], "groups": ["觀察感知力", "資訊理解力", "提問追問力", "邏輯思辨力", "認知建模力", "結構洞察力", "系統動態力", "自我覺察力", "情緒調節力", "人際理解力", "溝通表達力", "合作博弈力", "目標決策力", "資源配置力", "行動執行力", "學習成長力", "創新創造力", "倫理價值力", "驗證修正力", "智慧整合力"], "sourceA": "# 智慧生成 OS｜100項能力 × 智慧 × 最小行動\n\n核心命題：智慧不是知道多少答案，而是能夠觀察世界、提出問題、理解關係、辨識矛盾、做出選擇、採取行動，並根據結果持續更新自己。\n\n以下整合「五部古典智慧 × 七套科學 × 天道模型15要素 × LifeOS」，整理成20大能力模組、100項可練習能力。\n\n## 一｜智慧生成總心智圖\n\n智慧生成 OS\n\n看見 → 理解 → 提問 → 判斷 → 行動 → 更新\n\n01 感知\n\n觀察、注意、辨識、篩選\n\n02 提問\n\n提問、追問、質疑、重構\n\n03 認知\n\n表徵、分類、比較、抽象\n\n04 洞察\n\n矛盾、假設、關係、機制\n\n05 系統\n\n權重、耦合、邊界、動態\n\n06 人性\n\n同理、動機、溝通、合作\n\n07 決策\n\n目標、風險、策略、配置\n\n08 自控\n\n情緒、專注、習慣、界線\n\n09 行動\n\n計畫、執行、測試、應變\n\n10 更新\n\n回饋、歸因、修正、遷移\n\n每一次現實回饋，都可以重新調整能力與世界模型\n\n## 二｜100項能力 × 智慧 × 最小行動\n\n以下是完整的操作型能力清單，並非聲稱學術界只有這100種能力。\n\n收合全部\n\n共100項能力｜目前符合搜尋：100項\n\n01｜觀察感知力\n\n|   |\n| - |\n\n能力\n\n|   |\n| - |\n\n智慧\n\n|   |\n| - |\n\n最小行動\n\n|   |\n| - |\n\n001｜觀察力\n\n|   |\n| - |\n\n看見實際發生的事\n\n|   |\n| - |\n\n記錄三個事實\n\n|   |\n| - |\n\n002｜注意力\n\n|   |\n| - |\n\n把心思放在重要事情\n\n|   |\n| - |\n\n專心五分鐘\n\n|   |\n| - |\n\n003｜細節力\n\n|   |\n| - |\n\n看見容易忽略的訊號\n\n|   |\n| - |\n\n找出一個小差異\n\n|   |\n| - |\n\n004｜辨識力\n\n|   |\n| - |\n\n分清不同資訊\n\n|   |\n| - |\n\n區分事實與猜測\n\n|   |\n| - |\n\n005｜篩選力\n\n|   |\n| - |\n\n留下真正有用的資訊\n\n|   |\n| - |\n\n刪除一項雜訊\n\n02｜資訊理解力\n\n|   |\n| - |\n\n能力\n\n|   |\n| - |\n\n智慧\n\n|   |\n| - |\n\n最小行動\n\n|   |\n| - |\n\n006｜閱讀力\n\n|   |\n| - |\n\n讀懂內容與重點\n\n|   |\n| - |\n\n用一句話摘要\n\n|   |\n| - |\n\n007｜聆聽力\n\n|   |\n| - |\n\n理解別人真正說什麼\n\n|   |\n| - |\n\n先重述對方意思\n\n|   |\n| - |\n\n008｜分類力\n\n|   |\n| - |\n\n把相似資訊放一起\n\n|   |\n| - |\n\n整理三個類別\n\n|   |\n| - |\n\n009｜比較力\n\n|   |\n| - |\n\n找出相同與不同\n\n|   |\n| - |\n\n比較兩種方法\n\n|   |\n| - |\n\n010｜查證力\n\n|   |\n| - |\n\n確認資訊是否可靠\n\n|   |\n| - |\n ｜選擇真正重要的方向。行動：排出前三優先。\\\n14｜資源配置力｜把時間與力量用在重要地方。行動：安排二十分鐘。\\\n15｜行動執行力｜把想法變成結果。行動：立刻開始兩分鐘。\\\n16｜學習成長力｜從練習與錯誤中進步。行動：修正一個弱點。\\\n17｜創新創造力｜從舊問題找到新方法。行動：提出三個方案。\\\n18｜倫理價值力｜讓能力符合責任與尊重。行動：檢查一項選擇是否公平。\\\n19｜驗證修正力｜讓結果檢查想法。行動：比較預測與現實。\\\n20｜智慧整合力｜把經驗累積成可更新的世界模型。行動：每週回顧一次。\\\n【五大核心金句】\\\n① 知識讓你知道答案，提問讓你發現未知。\\\n② 觀察讓你看見現象，追問讓你理解結構。\\\n③ 洞察讓你找到瓶頸，決策讓你選擇方向。\\\n④ 行動讓想法接受現實檢驗，回饋讓錯誤成為學習材料。\\\n⑤ 真正的智慧，不是永遠正確，而是能夠持續改善自己的理解與行動。\\\n【每日五問】\\\n今天我看見什麼？\\\n我發現什麼問題？\\\n真正的原因可能是什麼？\\\n我可以採取什麼小行動？\\\n結果告訴我應該如何更新？\n\n這100項可以作為 LifeOS「智慧生成能力 BANK V1.0」的初始分類，每項再連結古典認知節點、科學機制、生活情境、練習題、回饋指標與複測紀錄。\n\n核心原則是：不是要求一個人同時具備100種能力，而是先找出當下最需要改善的能力，透過最小行動逐步建立。\n\n\n\n100個能力 做成 哲學命題、排比句、對比句、反問句、情境衝突、認知翻轉、層層遞進與詩性收束的臉書貼文(大概100字)", "sourceB": "# 智慧生成OS｜100項能力 × 100篇哲學臉書短文\n創作架構｜哲學命題 → 排比句 → 對比句 → 反問句 → 情境衝突 → 認知翻轉 → 層層遞進 → 詩性收束。\n每篇約100字，結合生活情境、認知升維與最小行動。\n核心精神｜智慧不是擁有永遠正確的答案，而是擁有不斷更新答案的能力。\n【01｜觀察力：你看見的世界，未必是真正的世界】\n人最大的盲點，不是沒有眼睛，而是太相信自己的眼睛。\n我們看見表情，卻看不見心事；看見行為，卻忽略處境；看見結果，卻不知道過程。\n當孩子考不好，你看見的是懶惰，還是他努力後仍然不懂？\n真正的觀察，不是急著解釋世界，而是允許世界修正自己。\n當你停止用偏見觀看，真相才有機會慢慢顯現。\n最小行動｜今天記錄三個事實，不加入任何評價。\n【02｜注意力：你把目光放在哪裡，人生就往哪裡生長】\n人生最稀缺的資源，不一定是金錢，而是注意力。\n你注意缺點，世界就充滿缺陷；你注意機會，世界便開始出現道路。\n同樣一天，有人用來抱怨，有人用來創造。\n你以為自己被生活困住，是否其實是注意力被雜訊綁架？\n自由不是沒有干擾，而是能夠重新選擇焦點。\n把目光交給真正重要的事，生命才會長出自己的方向。\n最小行動｜每天選一件重要事情，專注五分鐘。\n【03｜細節力：命運的轉折，常藏在微小訊號裡】\n真正的洞察，往往不是發現驚天動地的大事，而是看見別人忽略的小事。\n一句突然減少的問候，一次不同以往的沉默，一個反覆出現的錯誤。\n粗心的人只看結果，細心的人開始尋找變化。\n為什麼有些問題爆發時，我們才說早知道？\n因為訊號一直存在，只是我們沒有留意。\n智慧不是事後驚訝，而是事前願意看見。\n最小行動｜今天找出一個與平常不同的小變化。\n【04｜辨識力：真正困住你的，不是事實，而是你對事實的解釋】\n別人沒有回訊息，是事實；他不重視你，是猜測。\n孩子考試失敗，是事實；他沒有前途，是推論。\n我們常把猜測當真相，把情緒當證據，把一次事件當成永恆命運。\n可是，你真的知道事情的全部嗎？\n成熟不是不再判斷，而是知道判斷可能出錯。\n當事實與想像重新分開，內心就多了一條自由的路。\n最小行動｜把今天一個煩惱分成「事實」與「猜測」。\n【05｜篩選力：真正的清醒，不是知道更多，而是留下重要的】\n資訊愈多，未必代表智慧愈高。\n你可以每天閱讀一百篇文章，卻仍不知道下一步該做什麼。\n有些資訊讓你清醒，有些資訊只是讓你焦慮。\n有些聲音提供方向，有些聲音只是不斷消耗注意力。\n難道把所有資訊裝進腦袋，就叫成長嗎？\n真正的智慧，是讓重要訊號穿過雜訊，抵達行動。\n最小行動｜今天刪除一項沒有幫助的資訊干擾。\n【06｜閱讀力：讀懂一本書，不如讓一本書改變一個選擇】\n閱讀的目的，不是收藏別人的智慧，而是更新自己的世界。\n有人讀完一本書，只記住金句；有人讀完一頁，便重新理解人生。\n前者增加知識，後者改變模型。\n如果讀了那麼多道理，遇到衝突仍然只會責怪別人，究竟讀懂了什麼？\n真正的閱讀，是讓文字走出紙張，進入生活。\n當知識開始改變行動，書才真正被讀完。\n最小行動｜閱讀一段文字，用一句話寫出可實踐的重點。\n【07｜聆聽力：你聽見的是聲音，還是一個人的世界？】\n很多對話之所以失敗，不是因為沒有人說話，而是沒有人真正聆聽。\n孩子說不想上學，你聽成叛逆；伴侶說很累，你聽成抱怨。\n我們急著回答，急著糾正，急著證明自己理解。\n可是，你真的知道對方想表達什麼嗎？\n聆聽不是放棄立場，而是先讓對方的世界有機會被理解。\n有時候，一個人需要的不是答案，而是終於有人聽懂。\n最小行動｜回應之前，先用一句話重述對方的意思。\n【08｜分類力：混亂不是事情太多，而是事情沒有找到位置】\n當所有問題混在一起，再聰明的人也容易疲憊。\n工作、家庭、情緒、金錢、健康，每件事情都在腦海裡爭奪位置。\n你以為自己沒有能力，其實可能只是缺少分類。\n分類不是把世界切碎，而是讓不同問題找到適合的處理方式。\n當情緒不再冒充事實，當急事不再冒充要事，秩序便開始生成。\n真正的清楚，是讓每件事回到它應在的位置。\n最小行動｜把今天的煩惱整理成三個類別。\n【09｜比較力：沒有比較的選擇，往往只是習慣】\n你以為自己正在選擇，其實可能只是在重複。\n因為熟悉，所以繼續；因為害怕，所以不變；因為大家都做，所以跟隨。\n但熟悉就代表適合嗎？\n比較不是為了證明誰比較好，而是辨認不同選項的代價與邊界。\n當你願意把兩條道路放在眼前，原本唯一的答案就不再唯一。\n智慧從來不是盲目堅持，而是看見選擇的空間。\n最小行動｜比較今天兩種做法，各寫一項優點與限制。\n【10｜查證力：不要把相信，誤認成知道】\n最危險的錯誤，不一定來自無知，而是來自過度確信。\n一篇文章寫得動人，不代表內容正確；一個人說得自信，不代表證據充分。\n我們容易相信符合期待的消息，排斥挑戰信念的資料。\n可是，真相有義務符合你的喜好嗎？\n真正的查證，是讓自己的判斷接受外部世界的檢驗。\n願意修正相信的事，才有機會更接近真實。\n最小行動｜今天選一個重要說法，查核原始來源。\n【11｜提問力：答案讓思考停止，問題讓智慧開始】\n一個人最可惜的，不是沒有答案，而是失去提問的能力。\n學生問怎麼考高分，卻不問自己為何學不會。\n大人問怎麼賺更多，卻不問自己究竟想過什麼生活。\n我們不停追逐答案，卻很少檢查問題本身。\n如果問題問錯了，再努力回答又有什麼用？\n智慧的起點，不是急著解決，而是先問出真正值得解決的事。\n最小行動｜今天對一個習以為常的現象提出「為什麼」。\n【12｜追問力：真正的問題，常藏在第一個答案後面】\n孩子不寫作業，因為懶惰？\n為什麼懶惰？可能因為不會。\n為什麼不會？可能因為基礎缺口一直沒有補上。\n如果停在第一個答案，我們只會責備；如果繼續追問，才可能找到方法。\n追問不是無止境地懷疑，而是逐步檢查解釋是否充分。\n當問題一層層打開，責怪便可能轉化為理解。\n真正的洞察，從不滿足於最方便的答案。\n最小行動｜針對一個問題連續追問三次，並檢查證據。\n【13｜質疑力：你最需要懷疑的，可能是最熟悉的答案】\n有些觀念陪伴我們太久，久到忘了它們也可能出錯。\n努力一定成功嗎？忍耐一定值得嗎？多做一定比較好嗎？\n這些話或許曾經有用，卻未必適合所有情境。\n如果一套方法不再有效，你還要用多少失敗證明忠誠？\n質疑不是反對一切，而是拒絕讓舊答案永久掌權。\n真正成熟的人，敢讓自己的信念接受檢驗。\n最小行動｜找出一句自己常說的話，問一次「真的總是如此嗎」。\n【14｜反問力：換一個問題，可能就換了一個人生】\n當你問「為什麼沒有人幫我」，注意力便停在缺少什麼。\n當你改問「我還能建立什麼資源」，行動空間便開始出現。\n同樣的困境，不同的提問，可能導向完全不同的道路。\n你要繼續問誰應該負責，還是開始問自己能改變什麼？\n反問不是否定痛苦，而是重新尋找可控制的變數。\n當問題轉向可能性，人生便不必停在原地。\n最小行動｜把今天一個抱怨改寫成可行動的問題。\n【15｜重構問題力：你以為要解決的，可能根本不是問題】\n孩子成績不好，你想增加考卷。\n員工效率低，你想增加監督。\n伴侶不願溝通，你想增加說服。\n可是，如果真正的瓶頸是方法、信任或需求不一致呢？\n用錯問題設計答案，只會讓努力變成新的消耗。\n重構問題，是從表面症狀重新尋找真正的限制。\n有時候，人生最大的突破，不是找到新答案，而是終於問對問題。\n最小行動｜把一個困境重新寫成「真正需要改善的是什麼」。\n【16｜推理力：結論不是智慧，知道結論如何形成才是】\n有人說孩子不努力，因為成績下降。\n有人說市場會上漲，因為昨天上漲。\n有人說對方不愛自己，因為一次冷淡。\n但這些結論，真的能從證據推出來嗎？\n推理不是把想法說得漂亮，而是讓每一步都有理由。\n當理由不足，就保留不確定；當證據改變，就調整判斷。\n真正有力量的思考，不怕別人追問「你怎麼知道」。\n最小行動｜寫下一個判斷，以及支持它的兩項證據。\n【17｜因果辨識力：一起發生，不代表彼此造成】\n成功的人每天早起，所以早起一定成功嗎？\n有人補充營養後感覺改善，所以改善一定來自補充品嗎？\n世界充滿同時變動的因素，卻不會自動告訴我們誰造成誰。\n把相關當因果，容易讓人迷信方法，也容易錯怪他人。\n真正的智慧，是願意尋找其他解釋，並檢查時間、條件與證據。\n看見關聯只是開始，理解機制才是更深的功課。\n最小行動｜對今天一個因果判斷，提出另一種可能解釋。\n【18｜假設辨識力：困住人的，往往是沒有說出口的前提】\n「我一定要讓所有人滿意」，背後可能藏著「不被喜歡就沒有價值」。\n「孩子一定要第一名」，背後可能藏著「成績決定人生」。\n我們以為自己在追求目標，其實可能正在服從隱藏假設。\n如果前提從未被檢查，努力是否只是讓枷鎖更加牢固？\n真正的自由，是把看不見的信念帶到光下。\n當假設可以被修正，人生便有重新選擇的可能。\n最小行動｜寫下今天一個強烈想法背後的隱藏前提。\n【19｜矛盾辨識力：真正的成長，從看見自己不一致開始】\n我們說重視健康，卻總是犧牲睡眠。\n我們說尊重孩子，卻不允許孩子有不同想法。\n我們說想要自由，卻害怕任何改變。\n矛盾不是用來羞辱自己的證據，而是模型需要更新的訊號。\n如果言語與行動長期分離，究竟哪一個才代表真正的選擇？\n看見不一致，不必急著自責。\n讓矛盾成為入口，人生才有重新整合的機會。\n最小行動｜找出一件「我說重要，卻沒有實踐」的事。\n【20｜反例思考力：一個反例，就能打開封閉的世界】\n「沒有人值得信任」，真的嗎？\n「失敗的人永遠不會成功」，真的嗎？\n「我就是沒有能力」，真的嗎？\n當一句話使用永遠、一定、全部，我們便可能把複雜世界壓縮成單一結論。\n反例不是為了否定經驗，而是提醒經驗仍有邊界。\n只要存在另一種可能，人生就不必被一個故事完全定義。\n真正的清醒，是讓例外成為更新的起點。\n最小行動｜找出一個能挑戰自己絕對化信念的例子。\n【21｜表徵力：說不清的問題，往往也很難解決】\n腦海裡的煩惱像一團線，愈想愈亂。\n你說自己壓力很大，但壓力究竟來自時間、關係、金錢，還是期待？\n當問題沒有形狀，我們只能反覆感受它。\n當問題被畫成圖、寫成句、拆成節點，新的關係便可能浮現。\n表徵不是替現實貼標籤，而是建立可以檢查的理解工具。\n把混亂放到紙上，思考才有機會找到入口。\n最小行動｜把一個煩惱畫成三個相連的方框。\n【22｜抽象力：高手看見規則，而不只看見事件】\n今天和同事衝突，明天和家人爭執，後天又與朋友誤會。\n你以為是三件不同的事，卻可能藏著同一個溝通模式。\n只記住事件的人，容易重複事件。\n能抽取共同特徵的人，才可能改變模式。\n為什麼相似的困境總是換個人物重新上演？\n抽象不是遠離生活，而是從生活中找到可以遷移的理解。\n看見規則，才能不再被每一次表象牽著走。\n最小行動｜找出兩件不同事件背後的一個共同模式。\n【23｜類比力：智慧，是讓熟悉的世界照亮陌生的問題】\n學習像種樹，不能每天挖開根部檢查。\n關係像存款，不能只提款卻從不投入。\n人生像導航，走錯路時需要重新定位，而不是責怪地圖。\n類比讓抽象變得可理解，也讓複雜問題找到入口。\n但比喻終究不是事實，不能拿相似當成完全相同。\n真正的智慧，是借用熟悉的光，卻不忘檢查陌生世界的模樣。\n最小行動｜用一個生活比喻解釋今天學到的新概念。\n【24｜概念整合力：知識的價值，在於彼此連接】\n有人懂心理學，卻不懂溝通；懂管理，卻不懂人性；懂健康，卻忽略生活。\n知識若彼此孤立，遇到真實問題便容易失去方向。\n世界不是按照課本章節運作，人生也不會只出一道單選題。\n當情緒連上決策，決策連上資源，資源連上環境，理解才開始立體。\n智慧不是收藏更多碎片，而是讓碎片形成可以更新的地圖。\n最小行動｜把今天兩個不同領域的概念連接起來。\n【25｜模型建構力：真正的理解，應該能接受現實檢驗】\n你說自己了解孩子，能預測他在什麼情境下需要幫助嗎？\n你說自己了解市場，能說出判斷失效的條件嗎？\n如果一個解釋永遠不可能被證明有錯，它可能只是故事，而不是可檢驗模型。\n模型不是現實本身，而是暫時幫助我們理解現實的工具。\n好的模型不需要永遠正確，只需要能從錯誤中變得更好。\n最小行動｜寫下一句「如果發生A，我預期會出現B」。\n【26｜關係辨識力：世界不是孤立的點，而是互相影響的網】\n一個學生不交作業，可能牽涉能力、時間、家庭與同儕。\n一段關係持續衝突，可能牽涉期待、溝通、界線與信任。\n只盯著一個人，容易忽略整個系統。\n只責怪一個行為，可能錯過真正的連結。\n智慧不是否認個人責任，而是看見責任如何存在於關係網絡。\n當連結被看見，改善便不再只能依靠責備。\n最小行動｜畫出一個問題涉及的三個重要關係。\n【27｜位置辨識力：先知道自己在哪裡，才能知道如何前進】\n同一句建議，對不同位置的人可能產生不同結果。\n剛開始學習的人需要基礎，熟練的人需要突破。\n資源不足的人需要穩定，資源充足的人可能需要探索。\n如果連自己所在的位置都不清楚，怎能判斷下一步？\n定位不是限制自己，而是避免用別人的地圖走自己的道路。\n真正的前進，不是盲目追逐遠方，而是從當下的位置開始。\n最小行動｜寫下自己目前的資源、限制與下一個目標。\n【28｜權重判斷力：不是所有問題，都值得同樣用力】\n一天只有二十四小時，注意力與精力都有邊界。\n有人把大量時間花在小事，卻讓真正重要的問題持續惡化。\n努力若沒有權重判斷，可能只是高效率地消耗生命。\n什麼事情一旦改善，其他問題也會跟著鬆動？\n真正的智慧，不是把每件事都做到完美，而是找出最有影響力的變數。\n把力量放對位置，微小行動也可能撬動巨大改變。\n最小行動｜列出三個影響結果的因素，排出優先順序。\n【29｜邊界辨識力：任何有效的方法，都有不適用的地方】\n堅持是一種能力，但錯誤方向上的堅持可能只是消耗。\n信任是一種美德，但沒有界線的信任可能增加風險。\n努力值得尊重，但努力不能保證所有結果。\n為什麼一個曾經成功的方法，後來卻可能失敗？\n因為情境、資源與條件已經改變。\n成熟不是放棄原則，而是理解原則的適用邊界。\n真正的智慧，知道何時使用，也知道何時停止。\n最小行動｜替一個常用方法寫下一項不適用條件。\n【30｜瓶頸洞察力：真正的突破，不是全面用力，而是找到卡點】\n水桶能裝多少水，常受最短的木板限制。\n學生背了很多單字，卻可能因為句型理解不足而失分。\n團隊增加人手，卻可能因為流程混亂而更加低效。\n如果沒有找到瓶頸，增加資源是否只是增加浪費？\n真正的高手，不是每個地方都用力，而是先找出限制整體表現的關鍵。\n當卡點鬆動，系統才有機會重新流動。\n最小行動｜圈出今天最妨礙目標的一個瓶頸。\n【31｜耦合理解力：你以為只改變一件事，其實可能牽動整個系統】\n睡眠不足，可能影響專注；專注下降，可能增加錯誤；錯誤增加，又可能帶來壓力。\n一個小變化，可能沿著關係網不斷擴散。\n因此，改善人生不能只看單一事件，也要觀察連鎖效應。\n你正在解決的問題，會不會同時製造另一個問題？\n真正的系統智慧，是理解局部與整體如何相互牽動。\n最小行動｜寫下一條「A影響B，B再影響C」的連鎖關係。\n【32｜回饋迴路辨識力：有些困境不是偶然，而是不斷自我強化】\n愈害怕失敗，愈不敢嘗試；愈不嘗試，能力愈難提升；能力停滯，又讓恐懼增加。\n這不是單一事件，而是一個反覆運作的循環。\n你以為問題一直回來，是命運在捉弄你嗎？\n也許真正需要改變的，是讓問題重複發生的回饋機制。\n打破循環，不一定需要巨大力量。\n有時只要改變其中一個環節，人生就可能開始轉向。\n最小行動｜畫出一個反覆困境的三步循環。\n【33｜時間動態力：今天正確的答案，明天未必仍然正確】\n人會改變，環境會改變，需求與資源也會改變。\n年輕時適合衝刺的方法，中年後可能需要重新配置。\n昨天有效的策略，今天可能因為條件不同而失效。\n如果世界一直變動，為什麼我們期待一套方法永遠適用？\n智慧不是抓住不變的答案，而是辨識什麼正在改變。\n真正的穩定，不是停止變化，而是擁有調整的能力。\n最小行動｜比較一件事情一個月前與現在的差異。\n【34｜臨界點辨識力：真正的危機，往往在爆發前已經累積】\n關係不會總在一次爭吵後破裂。\n健康問題也不一定在第一次不舒服時才開始。\n許多變化可能長期累積，直到某個條件出現，系統才突然轉向。\n為什麼我們常在事情失控後，才發現早有徵兆？\n因為我們習慣看事件，卻忽略累積與門檻。\n智慧不是預知所有未來，而是提前辨認值得留意的訊號。\n最小行動｜替一個重要目標設定一項需要重新評估的警戒條件。\n【35｜情境推演力：真正的準備，不是相信未來只有一種】\n如果考試順利，你要怎麼做？\n如果結果不如預期，你還有什麼選擇？\n如果原本依靠的資源突然消失，你能否重新配置？\n只準備一種未來的人，容易被意外困住。\n能推演多種情境的人，不一定能避免風險，卻更可能保有行動空間。\n智慧不是控制未來，而是在不確定中建立選擇。\n最小行動｜替今天一個決策列出最好、普通、最差三種情境。\n【36｜情緒辨識力：能說出自己的情緒，才有機會理解自己的反應】\n你以為自己在生氣，可能其實是在害怕。\n你以為自己很失望，可能背後藏著沒有被理解的期待。\n情緒不是敵人，也不是必須服從的命令。\n它更像一個訊號，提醒我們某些需求或判斷正在被觸動。\n如果連自己正在感受什麼都不知道，又如何選擇回應？\n真正的自我理解，從替內在經驗找到名字開始。\n最小行動｜今天說出一種情緒，以及它可能連結的需求。\n【37｜需求辨識力：你真正想要的，可能不是你正在追逐的】\n你拼命工作，可能真正想要的是安全感。\n你不斷要求孩子進步，可能真正害怕的是他的未來失去選擇。\n你希望別人認同，可能真正渴望的是被理解。\n表面目標與深層需求，有時並不是同一件事。\n如果一直追錯目標，再努力也可能無法滿足自己。\n智慧不是否定欲望，而是看清欲望背後真正重要的東西。\n最小行動｜問自己一次「我真正希望得到的是什麼」。\n【38｜信念覺察力：最牢固的牢籠，可能是你深信不疑的想法】\n「我不能失敗。」\n「我必須照顧所有人。」\n「別人不滿意，就是我做得不好。」\n這些句子可能早已變成內在規則，默默控制每天的選擇。\n可是，誰規定你必須永遠如此？\n信念可以提供方向，也可能限制自由。\n真正的成長，不是沒有信念，而是讓信念保有接受檢驗的空間。\n最小行動｜寫下一句「我一直相信……」，再檢查它是否總成立。\n【39｜偏誤覺察力：最難發現的錯誤，是自己最想相信的答案】\n喜歡一個人，就容易忽略他的缺點。\n討厭一個人，就容易放大他的失誤。\n相信某個方法有效，就可能只記住成功案例。\n我們以為自己在看事實，卻可能正在尋找支持原有信念的證據。\n如果所有資訊都只證明你正確，你是否真的檢查過其他可能？\n智慧不是沒有偏誤，而是願意主動尋找修正偏誤的線索。\n最小行動｜找出一項與自己目前看法相反的可靠證據。\n【40｜自我反省力：反省不是責怪自己，而是重新理解自己】\n今天做錯一件事，你可以不斷罵自己，也可以重新檢查決策過程。\n自責只會重播痛苦，反省則有機會產生新的方法。\n你當時看見什麼？忽略什麼？相信什麼？又能改變什麼？\n真正有價值的反省，不是證明自己多糟糕，而是找出下次可以調整的地方。\n當錯誤成為資訊，而不是身分標籤，成長才真正開始。\n最小行動｜寫下一個今天可以改善的行為，不批判人格。\n【41｜情緒調節力：真正的力量，不是沒有情緒，而是不被情緒駕駛】\n生氣時想反擊，害怕時想逃避，委屈時想證明自己。\n情緒來得很快，後果卻可能停留很久。\n如果每一次情緒升起，都直接變成行動，我們還剩多少選擇？\n調節不是壓抑感受，而是在刺激與反應之間創造空間。\n能停下來的人，不一定比較不痛苦，卻可能更有能力保護重要的關係與目標。\n最小行動｜情緒強烈時先停十秒，再決定是否回應。\n【42｜壓力管理力：真正的堅強，不是無限承受】\n你可以一直告訴自己再撐一下。\n再多接一份工作，再少睡一個小時，再承擔別人的期待。\n但如果壓力來源始終不變，忍耐是否只是在延後崩潰？\n管理壓力，不是證明自己能承受多少，而是辨認哪些負荷可以減少、哪些資源需要補充。\n成熟不是把自己耗盡，而是建立能夠長期運作的生活系統。\n最小行動｜今天減少一項不必要的壓力來源。\n【43｜挫折承受力：失敗不是終點，拒絕更新才可能讓失敗重複】\n考試失敗，不代表沒有能力。\n創業受挫，不代表沒有價值。\n一次關係破裂，也不能定義整個人生。\n可是，如果每次失敗後只剩下自責，方法又怎麼改變？\n挫折的價值，不在於痛苦本身，而在於我們能否從中取得可用資訊。\n真正的韌性，不是永遠不倒，而是跌倒後重新理解道路。\n最小行動｜選一個失敗經驗，修改一項方法再試一次。\n【44｜延遲滿足力：自由不是想做什麼就做什麼】\n手機一響就查看，心情不好就購物，遇到困難就想逃避。\n即時滿足很容易，長期成果卻需要等待。\n如果每個當下的衝動都能決定行動，究竟是你在選擇，還是刺激在選擇？\n延遲滿足不是禁止快樂，而是讓短期慾望不再壟斷長期人生。\n真正的自由，是有能力為更重要的未來保留今天的選擇。\n最小行動｜把一次非必要的滑手機延後十分鐘。\n【45｜心理彈性力：真正的穩定，是變動時仍能重新站穩】\n計畫被打亂，並不代表人生失敗。\n期待沒有實現，也不代表努力全部白費。\n有人一遇到變化，就認為世界背叛自己；有人重新評估條件，尋找新的可能。\n如果道路改變，你是否也允許方法改變？\n心理彈性不是沒有原則，而是讓方法服務價值，而不是讓價值被方法困住。\n像水一樣保有方向，也保有轉彎的能力。\n最小行動｜替今天一件不順利的事提出另一種做法。\n【46｜同理力：真正的理解，是知道別人的世界不等於自己的世界】\n你覺得簡單的事，對別人可能非常困難。\n你認為理所當然的選擇，對別人可能需要很大勇氣。\n我們常用自己的經驗衡量別人的處境，再用自己的標準判斷對錯。\n可是，你真的走過對方走過的路嗎？\n同理不是認同所有行為，而是願意理解行為發生的背景。\n當理解先於評價，關係才有可能從對立走向對話。\n最小行動｜問一個人「這件事對你最困難的地方是什麼」。\n【47｜動機辨識力：不要只看一個人做了什麼，也要理解他想得到什麼】\n有人沉默，是因為不在乎，也可能因為害怕衝突。\n有人不願合作，可能是缺乏信任，也可能是利益安排不清楚。\n只看行為，我們容易快速貼標籤。\n看見可能的動機，才有機會設計更有效的回應。\n但猜測不是讀心，理解仍需要對話與驗證。\n真正的人性智慧，是保持多種解釋，而不急著把任何一種當成真相。\n最小行動｜替一個難以理解的行為提出兩種可能動機。\n【48｜換位思考力：世界不只有你的視角】\n老師看見學生不交作業，學生可能看見自己怎麼努力都學不會。\n父母看見孩子沉迷手機，孩子可能看見現實中難以取得的成就感。\n同一件事，站在不同位置，就可能出現不同意義。\n如果只允許自己的視角存在，溝通如何開始？\n換位思考不是放棄判斷，而是增加理解的維度。\n當你能看見別人的地圖，才更有機會找到共同的道路。\n最小行動｜用對方的立場重新描述一次今天的衝突。\n【49｜信任評估力：真正的信任，不靠承諾，而靠長期一致】\n有人說得動聽，行動卻總是落空。\n有人不擅長表達，卻一次次完成承諾。\n你要相信對方描繪的未來，還是觀察他已經展現的行為？\n信任不是一次決定，而是隨著證據持續調整的判斷。\n真正可靠的關係，不需要靠盲目相信維持，也不需要靠無限懷疑生存。\n讓時間與行動說話，信任才有穩固的根。\n最小行動｜檢查一項承諾是否與實際行動一致。\n【50｜界線建立力：善良不是讓所有人都能消耗你】\n你可以理解別人的困難，卻不必承擔所有責任。\n你可以願意幫忙，卻不代表必須無限付出。\n沒有界線的善意，可能逐漸變成委屈；沒有尊重的關係，可能逐漸變成控制。\n如果一段關係只能靠你不斷退讓維持，那真的是合作嗎？\n界線不是拒絕愛，而是讓愛不必以自我耗損為代價。\n真正成熟的善良，既看見別人，也不遺忘自己。\n最小行動｜清楚說出一件自己可以接受與不能接受的事。\n【51｜清楚表達力：說得很多，不代表真正被理解】\n有些人說了十分鐘，別人仍不知道重點。\n有些人只說三句話，就讓問題、需求與下一步變得清楚。\n表達不是把腦中的所有想法倒出來，而是幫助對方建立正確理解。\n如果聽的人始終不明白，你是否需要重新整理自己的語言？\n真正的表達能力，不是聲音最大，而是讓重要訊息準確抵達。\n讓語言成為橋，而不是新的迷霧。\n最小行動｜用三句話說清楚問題、需求與希望的行動。\n【52｜精準提問力：問得越準，越可能找到真正有用的答案】\n「我該怎麼辦？」是一個問題。\n「我目前有兩個選項，最大的風險差異是什麼？」也是問題。\n前者可能得到安慰，後者更容易得到可比較的資訊。\n問題愈模糊，答案愈容易漂浮。\n如果連想知道什麼都沒有界定，如何判斷回答是否有用？\n精準提問，是替思考設定清楚的搜尋方向。\n最小行動｜把一個模糊問題改寫成包含情境與目標的具體問題。\n【53｜傾聽回應力：回應之前，先確認自己真的聽懂】\n一個人說自己很累，你立刻告訴他應該更努力。\n一個人說自己很難過，你急著提供十個方法。\n你以為自己正在幫助，對方卻可能感覺更加孤單。\n因為真正的回應，不是最快給出答案，而是先確認問題。\n聽懂需求，再選擇語言；理解情境，再提供建議。\n有時候，最好的回答不是一段大道理，而是一句「我理解得對嗎」。\n最小行動｜先重述對方的意思，再提出自己的回應。\n【54｜衝突溝通力：關係真正需要解決的，是問題，不是對方】\n「你總是這樣！」\n「你根本不在乎！」\n「你從來不改變！」\n當語言開始攻擊人格，問題便容易變成權力對抗。\n你真正想要的是改善關係，還是證明對方錯誤？\n成熟的溝通，不是壓下自己的需要，而是把指責轉化為具體描述。\n讓雙方看見問題，而不是把彼此變成敵人。\n最小行動｜把一句「你總是」改成「當這件事發生，我感到……我希望……」。\n【55｜說服與協商力：真正的合作，不是讓別人輸給你】\n如果每次討論都要有人認輸，關係就容易累積新的對抗。\n你想要效率，對方可能需要安全感。\n你想要改變，對方可能擔心失去控制。\n如果只強調自己的利益，如何期待對方真心合作？\n協商不是犧牲原則，而是理解彼此需求、底線與可交換的資源。\n真正高明的說服，不是讓對方閉嘴，而是找到雙方願意執行的方案。\n最小行動｜提出一個兼顧雙方重要需求的具體選項。\n【56｜角色辨識力：合作失敗，未必是誰不努力】\n一個團隊裡，大家都很忙，事情卻始終沒完成。\n有人以為別人會做，有人不知道自己該負責什麼。\n最後互相責怪，卻沒有人檢查分工。\n如果角色不清楚，再多熱情能維持多久？\n真正的合作，需要讓責任、權限與交付結果彼此對齊。\n當每個人知道自己的位置，努力才有機會形成共同成果。\n最小行動｜替一項合作任務寫出負責人、工作內容與完成標準。\n【57｜誘因分析力：理解人性，不是只聽他說什麼】\n有人口頭支持改革，實際卻不願改變。\n有人說重視合作，制度卻只獎勵個人競爭。\n當宣稱的價值與實際誘因不同，行為究竟會往哪裡走？\n人會受到需求、風險、資源與制度共同影響。\n真正的策略，不是一直要求別人變好，而是檢查什麼選擇正在被獎勵。\n當誘因改變，合作才可能變得容易。\n最小行動｜寫下合作中各方最在乎的利益與擔憂。\n【58｜策略預測力：做決策之前，先想別人會怎麼回應】\n你降低價格，競爭者可能跟進。\n你增加規定，學生可能配合，也可能尋找漏洞。\n你提出要求，對方可能接受，也可能反抗。\n如果只計算自己的行動，不考慮別人的反應，策略就只完成一半。\n世界不是單人遊戲，而是彼此預測、彼此調整的動態互動。\n真正的策略智慧，是把他人的選擇也放進模型。\n最小行動｜替一項決策列出對方可能的兩種反應。\n【59｜合作設計力：好的關係，不只靠善意，也靠好的規則】\n一開始大家說互相信任，後來卻為分工與利益爭吵。\n不是每個人都變壞了，也可能是原本的約定太模糊。\n誰負責？誰決定？成果怎麼分配？出現問題如何處理？\n如果這些問題沒有答案，善意能承受多少誤解？\n真正成熟的合作，是把期待轉化成透明、可執行、可修正的規則。\n讓規則保護信任，而不是讓信任代替規則。\n最小行動｜替一項合作寫下一條清楚的共同約定。\n【60｜進退判斷力：智慧不只知道如何堅持，也知道何時離開】\n有人把堅持當成美德，卻從不檢查方向。\n有人因為已經投入太多時間，便不敢停止錯誤的選擇。\n可是，過去付出的代價，真的能證明未來值得繼續嗎？\n前進需要勇氣，退出同樣需要判斷。\n真正的成熟，不是永不放棄，而是清楚知道什麼值得守護、什麼需要調整。\n有時候，轉身不是失敗，而是把生命還給更重要的方向。\n最小行動｜替一項長期投入設定繼續與停止的條件。\n【61｜目標設定力：沒有方向的努力，只會讓疲憊變得合理】\n每天忙碌，不代表每天前進。\n完成很多任務，不代表接近真正想要的生活。\n如果連目標都說不清楚，怎麼知道自己正在進步？\n有人追逐成績，卻忘了學習能力；有人追逐收入，卻失去健康與關係。\n目標不是用來綁架人生，而是幫助資源找到方向。\n真正的智慧，是讓目標符合價值，也能接受現實檢驗。\n最小行動｜寫下一個可以衡量、具有期限的改善目標。\n【62｜優先排序力：人生的品質，取決於你先處理什麼】\n重要的事不一定緊急，緊急的事也不一定重要。\n手機通知總是先響，長期夢想卻從不催促。\n如果每天都被眼前的聲音帶走，真正重要的事何時才能開始？\n優先排序不是把所有事情做完，而是接受時間有限的現實。\n當你願意先選擇最重要的事，生活才不再只是被動回應。\n真正的自由，從重新安排自己的順序開始。\n最小行動｜今天只選三件最重要的事情，先完成第一件。\n【63｜利弊權衡力：每個選擇，都有看得見與看不見的代價】\n換工作可能增加收入，也可能減少陪伴家人的時間。\n繼續進修可能提升能力，也需要投入金錢與精力。\n沒有代價的選擇很少，沒有取捨的人生也很難存在。\n如果只看眼前好處，是否忽略了長期成本？\n真正的決策，不是尋找完美選項，而是比較不同選擇的收益、風險與可逆性。\n看懂代價，選擇才會更接近自由。\n最小行動｜替兩個選項各寫出一項好處與一項代價。\n【64｜風險評估力：真正的勇敢，不是相信壞事不會發生】\n投資之前只想獲利，合作之前只想成功，出發之前只想順利。\n這樣的樂觀，可能讓人忽略必要的準備。\n如果結果不如預期，你能承受多少損失？\n風險評估不是悲觀，而是讓希望擁有邊界。\n真正成熟的人，不需要把所有未知變成恐懼，也不會把所有可能當成保證。\n能看見風險，才能為重要的未來留下退路。\n最小行動｜替一項決策寫出最壞情況與可承受的損失。\n【65｜決斷力：等待完美答案，也是一種選擇】\n有人一直蒐集資料，卻從不開始。\n有人不斷詢問別人，卻不願承擔決定。\n看似謹慎，實際可能是害怕錯誤。\n可是，資訊永遠可能不完整，人生也不會永遠等待。\n決斷不是衝動，而是在風險可控、資訊足夠時願意採取下一步。\n真正的智慧，不是保證每次選對，而是讓選擇能被檢驗與修正。\n最小行動｜為一件已評估的小事設定決定期限。\n【66｜時間管理力：你如何使用時間，就是你如何塑造人生】\n每個人一天都只有二十四小時，但生活的方向可以完全不同。\n有人把時間交給通知，有人把時間留給創造。\n有人每天處理別人的緊急事件，卻始終沒有經營自己的長期目標。\n如果時間永遠被外界安排，你還能決定人生的方向嗎？\n時間管理不是塞滿行程，而是讓有限的時間服務真正重要的價值。\n最小行動｜今天保留二十分鐘，不受干擾地完成重要任務。\n【67｜精力管理力：不是每個時刻，都適合做同樣的事】\n精神清醒時處理瑣事，疲憊不堪時才開始思考重要問題。\n這不是不努力，而是資源配置可能出了問題。\n人的專注、體力與情緒狀態會隨時間變動。\n如果忽略自己的節律，為什麼期待每個時段都有相同效率？\n真正的精力管理，是讓任務與狀態更合理地配合。\n不是逼自己永遠高效，而是讓有限能量產生更好的成果。\n最小行動｜把今天最需要思考的工作安排在較清醒的時段。\n【68｜財務規劃力：金錢真正的價值，是增加人生的選擇】\n有人收入增加，焦慮卻沒有減少。\n有人努力存錢，卻不知道自己真正想保護什麼。\n金錢可以購買資源，卻不能自動帶來方向。\n如果每一次消費都只是回應當下慾望，未來還剩多少自由？\n財務規劃不是只追求更多數字，而是讓收入、支出、風險與生活價值彼此對齊。\n當資源有了秩序，選擇才有更大的空間。\n最小行動｜記錄今天一筆支出，判斷它是否符合自己的優先目標。\n【69｜工具運用力：真正的高手，不是什麼都自己做】\n有人花三小時重複整理資料，有人利用適合的工具縮短流程。\n有人把工具當成威脅，有人把工具當成能力延伸。\n但工具愈多，就一定愈有效率嗎？\n如果沒有清楚目標，再強大的工具也可能增加混亂。\n真正的工具智慧，是知道什麼應該交給工具，什麼仍需要人的判斷。\n讓工具減少重複，讓自己保留思考。\n最小行動｜找一項重複工作，試用工具簡化其中一個步驟。\n【70｜槓桿辨識力：努力的最高境界，是讓一次努力產生多次價值】\n每天重複回答相同問題，為什麼不建立一份常見問題庫？\n每次重新製作教材，為什麼不建立可更新的內容母體？\n每次遇到錯誤都從頭處理，為什麼不累積修正紀錄？\n槓桿不是投機取巧，而是讓有效的方法可以重複使用。\n真正的智慧，不只是把事情做好一次，而是讓好的成果能持續產生價值。\n最小行動｜把今天一項重複任務整理成三步流程。\n【71｜任務拆解力：真正困住你的，可能不是事情太難，而是第一步太大】\n你想寫一本書，卻不知道從哪裡開始。\n你想改善健康，卻覺得生活必須全部重來。\n你想開發一個APP，卻被龐大功能嚇退。\n如果目標大到無法開始，為什麼不把它拆小？\n任務拆解不是降低夢想，而是讓夢想獲得可以執行的形狀。\n每一個巨大的成果，都需要找到能夠開始的入口。\n最小行動｜把一個大目標拆成三個可以執行的小步驟。\n【72｜開始行動力：你不需要準備好全部，才能開始第一步】\n有人等待完美時機，有人等待充足信心，有人等待所有條件到位。\n於是一天過去，一個月過去，夢想仍停留在腦海。\n如果信心需要透過行動累積，為什麼一定要先有信心才能開始？\n行動不是保證成功，而是讓想法第一次接受現實檢驗。\n真正的開始，不必盛大。\n有時候，只需要兩分鐘，人生便從想像進入現實。\n最小行動｜現在選一件重要小事，立刻做兩分鐘。\n【73｜持續執行力：改變人生的，往往不是一次爆發】\n一天讀完一本書很令人興奮，但每天閱讀十分鐘可能更容易持續。\n一次運動三小時很有成就感，但建立穩定習慣可能更重要。\n我們常迷戀強烈的開始，卻忽略平凡的重複。\n如果一個方法只能維持三天，它真的適合長期生活嗎？\n持續不是靠意志力無限燃燒，而是建立容易重複的環境與節奏。\n讓微小行動持續發生，時間才有機會成為盟友。\n最小行動｜選一項兩分鐘習慣，連續執行三天。\n【74｜應變力：計畫真正的價值，是幫助你面對變化】\n考試範圍改變，工作突然增加，合作夥伴臨時退出。\n如果現實不照計畫進行，你要責怪世界，還是重新安排？\n沒有計畫容易混亂，只有一套計畫也可能脆弱。\n真正的應變，不是隨便改變方向，而是在目標不變時調整方法。\n當原本的道路暫時封閉，智慧會開始尋找新的入口。\n最小行動｜替一件重要任務準備一個簡單備案。\n【75｜完成交付力：想法再美，沒有成果仍只是可能】\n你可以擁有一百個計畫、一千個靈感、無數個偉大願景。\n但如果沒有任何一件事真正完成，世界如何感受到它的價值？\n完成不代表完美，交付也不代表停止改善。\n真正的創造，是讓想法走出腦海，成為別人可以使用、檢查與回饋的成果。\n與其永遠等待最好的版本，不如先完成一個能夠更新的版本。\n最小行動｜今天完成並交付一件小作品。\n【76｜自主學習力：真正的教育，是讓人不再永遠依賴老師】\n老師可以提供答案，卻不能替學生思考一輩子。\n課程可以安排進度，卻不能保證學習者永遠保持好奇。\n如果一個人離開教室就停止學習，教育究竟完成了什麼？\n自主學習不是拒絕指導，而是逐步建立自己發現問題、尋找資源與檢查成果的能力。\n真正的學習自由，是即使沒有人安排，也知道如何繼續前進。\n最小行動｜今天自己提出一個學習問題，找出一項可靠資源。\n【77｜記憶提取力：看過很多次，不代表真正學會】\n你看著課本，覺得每一句都很熟悉。\n考試時合上書，卻突然什麼都想不起來。\n熟悉感很容易被誤認成掌握感。\n如果沒有答案提示，你還能自己說出重點嗎？\n真正的學習，不只是讓資訊進入眼睛，而是讓知識能在需要時被提取。\n與其反覆確認自己看懂，不如練習證明自己能想起。\n最小行動｜合上書本，憑記憶說出今天學到的三個重點。\n【78｜刻意練習力：進步不是練得多，而是知道該練哪裡】\n一個學生每天寫很多題，卻總是錯在相同觀念。\n一個人每天練習說話，卻始終沒有改善表達的盲點。\n重複可以帶來熟悉，但不一定帶來突破。\n如果每次都只練自己已經會的部分，能力如何升級？\n真正有效的練習，是辨認弱點、設計挑戰、取得回饋，再修正方法。\n進步不是累積辛苦，而是縮小能力缺口。\n最小行動｜今天只挑一個最常犯的錯誤，集中練習五分鐘。\n【79｜錯誤診斷力：錯誤不是敵人，而是系統發出的訊號】\n同樣考錯一題，可能是單字不會、句型誤解、推理失誤，也可能是時間不足。\n如果所有錯誤都只被叫作粗心，下一次要改變什麼？\n沒有診斷的努力，容易反覆浪費。\n真正的學習，不是把錯題藏起來，而是替錯誤找到正確位置。\n當錯誤能被分類，修正才有方向。\n每一道錯題，都可能是一張通往能力升級的地圖。\n最小行動｜替今天一個錯誤標記具體原因。\n【80｜遷移應用力：真正學會，是離開原本情境仍然能用】\n學生會做課本例題，換個題目卻不會。\n大人讀懂溝通技巧，回到家庭仍然只會爭吵。\n如果知識只能停留在原來的情境，究竟學會了多少？\n遷移不是機械複製，而是辨認不同情境中的共同結構。\n當你能把課堂上的方法用在生活，把生活中的洞察用在工作，知識才開始流動。\n最小行動｜把今天學到的一個原則用在不同情境。\n【81｜好奇探索力：智慧從承認自己還不知道開始】\n孩子問天空為什麼是藍色，大人可能說不要問那麼多。\n學生問規則為什麼如此，老師可能說考試就是這樣。\n久而久之，我們學會接受答案，卻忘記探索未知。\n如果一切都只求快速結束，新的理解從哪裡誕生？\n好奇不是幼稚，而是願意讓世界超越既有想像。\n真正的成長，始於一句真誠的「我還想知道」。\n最小行動｜今天研究一個自己原本不懂的小問題。\n【82｜跨域連結力：創新常發生在兩個世界相遇的地方】\n教育可以借鏡遊戲設計，健康管理可以借鏡回饋控制，人生決策可以借鏡策略互動。\n不同領域看似遙遠，卻可能共享相似結構。\n如果永遠只用同一套語言理解問題，如何看見新的可能？\n跨域不是把名詞堆在一起，而是找到可以檢驗的共同機制。\n當不同知識彼此照亮，原本封閉的問題便可能出現新的入口。\n最小行動｜找出兩個不同領域的一項共同原理與一項差異。\n【83｜逆向思考力：當所有人都往前看，不妨從終點往回走】\n你想提高效率，可以先問什麼事情最浪費時間。\n你想建立信任，可以先問什麼行為最容易破壞信任。\n你想讓學生進步，可以先問什麼教學方式讓他們更不敢學習。\n為什麼一定要從增加開始，不能先從減少開始？\n逆向思考不是故意唱反調，而是讓熟悉的問題出現另一個入口。\n有時候，最有效的改變，是先停止製造原本的阻礙。\n最小行動｜對一個目標提出「怎樣會讓它更糟」的反向問題。\n【84｜方案生成力：只有一個答案的人，最容易被答案困住】\n遇到問題時，我們常急著選擇第一個想到的方法。\n但第一個答案，可能只是最熟悉的答案。\n如果這條路走不通，是否代表沒有其他道路？\n真正的創造力，不是立刻找到完美方案，而是先增加可能性，再評估限制。\n當選項從一個變成三個，思考便從被迫接受走向主動選擇。\n智慧不是永遠有答案，而是知道如何生成新答案。\n最小行動｜為一個困境提出三種不同做法。\n【85｜原型測試力：不要用一年幻想，取代一天測試】\n你想開發課程，卻一直等待所有內容完整。\n你想創業，卻不敢先詢問真正的顧客需求。\n你想建立APP，卻遲遲沒有做出第一個可使用畫面。\n如果想法從未接受現實檢驗，怎麼知道它是否有價值？\n原型不是粗糙的失敗品，而是低成本取得回饋的工具。\n先讓一個小版本活在現實裡，再讓回饋決定下一次更新。\n最小行動｜把一個想法做成最簡單的可測試樣本。\n【86｜價值澄清力：最可怕的迷失，是成功後才發現走錯方向】\n你努力賺錢，卻失去陪伴重要之人的時間。\n你追求成就，卻忘了健康與自由。\n你得到別人的掌聲，卻不知道自己是否真正快樂。\n如果目標不是來自自己的價值，再大的成功能帶來多少滿足？\n價值澄清不是尋找標準答案，而是辨認什麼值得長期投入。\n當方向清楚，選擇才不必永遠被外界的聲音左右。\n最小行動｜寫下自己最重要的三項價值。\n【87｜責任承擔力：成熟不是把所有錯誤都攬在身上】\n有些人遇到問題，只會責怪別人。\n有些人遇到問題，卻把所有責任都變成自己的罪。\n這兩種反應，看似相反，卻都可能忽略真正的責任邊界。\n你能控制什麼？能影響什麼？又有哪些事情不是你能決定的？\n真正的負責，不是無限自責，而是承擔自己可以改善的部分。\n把責任放回正確位置，行動才有力量。\n最小行動｜找出一件自己能負責的事，完成一項具體承諾。\n【88｜公平判斷力：公平不是每個人得到一模一樣的東西】\n一個團隊裡，有人投入很多，有人投入很少。\n如果成果完全相同，是否公平？\n一個班級裡，有人需要更多協助，有人已經能獨立完成。\n如果資源完全平均，是否真正照顧到需求？\n公平不是只有一把尺，而是需要檢查貢獻、需求、權利與規則。\n真正的公平，不是讓所有人感覺舒服，而是讓分配有清楚且可檢驗的理由。\n最小行動｜檢查一項分配決定是否兼顧規則與不同需求。\n【89｜尊重差異力：別人的不同，不等於你的世界受到威脅】\n有人重視穩定，有人喜歡探索。\n有人需要獨處，有人透過交流獲得力量。\n有人用理性整理問題，有人先從情緒理解經驗。\n為什麼別人的生活方式不同，就一定需要被糾正？\n尊重不是放棄判斷，也不是接受傷害。\n它是承認人可以擁有不同的需求與選擇。\n當我們不再急著把所有人變成自己，關係才可能真正自由。\n最小行動｜今天理解一個與自己不同的觀點，不急著反駁。\n【90｜長期利他力：最高層次的幫助，是讓對方逐漸不需要你】\n你可以替孩子完成作業，也可以教他如何找到答案。\n你可以一直替別人解決問題，也可以協助他建立解決問題的能力。\n前者帶來立即成果，後者可能創造長期自主。\n如果幫助讓對方越來越依賴，這真的是最好的幫助嗎？\n真正的利他，不是讓自己永遠不可取代，而是讓更多人有能力選擇自己的道路。\n最小行動｜今天教會一個人一項可以獨立使用的方法。\n【91｜預測力：智慧不是事後解釋，而是事前願意接受檢驗】\n事情發生後，我們總能找到很多理由。\n成功了，說自己早就知道；失敗了，說環境本來就不確定。\n但如果從未事先留下預測，怎麼知道模型究竟準不準？\n預測不是算命，而是把理解轉化為可以比較的期待。\n當你願意記錄自己可能看錯的地方，學習才真正開始。\n真正的智慧，不是永遠猜中，而是逐步改善判斷。\n最小行動｜寫下一項明確預測、期限與預期結果。\n【92｜測量力：沒有紀錄的進步，很容易變成感覺】\n你說自己變得更專注，但每天真正專注多久？\n你說學生進步很多，但哪些題型的錯誤減少了？\n你說工作效率提高，但完成相同任務需要多少時間？\n感覺很重要，卻不一定足以判斷變化。\n測量不是把人生變成數字，而是替重要的改變留下可檢查的痕跡。\n當數字與經驗彼此對照，理解才更有根據。\n最小行動｜替一項目標選擇一個簡單、可重複記錄的指標。\n【93｜回饋分析力：現實不是來證明你正確，而是幫助你更新】\n你以為學生已經聽懂，測驗結果卻顯示大量誤解。\n你以為顧客需要更多產品，回饋卻指出他們更需要清楚說明。\n你可以責怪結果，也可以重新檢查原本的判斷。\n如果現實與期待不同，真正值得問的是什麼？\n不是誰讓我失望，而是哪個假設需要修正。\n當回饋不再只是評價，便能成為智慧生成的燃料。\n最小行動｜比較今天一項預期與實際結果，寫出差異。\n【94｜誤差歸因力：找到錯誤的位置，比急著責怪自己更重要】\n結果不好，可能是觀察不足、理解錯誤、權重失準，也可能是行動時機不對。\n如果每次都只說自己不夠努力，真正的問題怎麼被找到？\n努力是資源，不是萬能解釋。\n真正的誤差歸因，是檢查問題發生在哪個環節，而不是替失敗尋找一個可以責怪的人。\n當錯誤找到位置，修正才可能精準。\n最小行動｜把一次失誤歸入觀察、理解、判斷、行動或測量其中一類。\n【95｜模型更新力：真正的成長，是允許昨天的自己被今天修正】\n曾經有效的方法，可能不再適用。\n曾經相信的觀念，可能需要重新檢查。\n曾經害怕的事情，也可能因為能力提升而不再相同。\n如果一個人永遠不能改變想法，知識再多又有什麼用？\n模型更新不是否定過去，而是讓過去的經驗成為新版本的材料。\n真正的自由，不是沒有歷史，而是不必永遠活在舊版本裡。\n最小行動｜根據一項新證據，修改一個原本的判斷。\n【96｜知識壓縮力：真正理解複雜的人，往往能把它說得簡單】\n有人講了一個小時，聽眾仍不知道重點。\n有人只用五句話，就讓複雜問題有了清楚輪廓。\n簡單不是刪除重要差異，而是保留最有解釋力的結構。\n如果無法說清核心關係，是否代表自己還沒有真正整理好？\n知識壓縮不是讓思想變淺，而是讓重要資訊更容易被使用。\n真正的高手，能把複雜收進簡潔，卻不犧牲必要的深度。\n最小行動｜把今天學到的一個複雜概念濃縮成五句話。\n【97｜知識解壓力：懂得大道理，不代表能處理眼前的小事】\n你知道尊重很重要，卻不知道如何回應孩子的頂嘴。\n你知道界線很重要，卻不知道如何拒絕不合理的要求。\n你知道模型更新很重要，卻不知道明天要改變哪個行動。\n如果一個道理無法進入生活，它還缺少什麼？\n缺少的是從抽象原則走向具體情境的橋樑。\n真正的智慧，不只會說大道理，也能設計小行動。\n最小行動｜替一個抽象原則寫出具體生活情境與對話句。\n【98｜世界模型整合力：你不是活在事件裡，而是活在自己理解事件的方式裡】\n同樣一次失敗，有人看見能力不足，有人看見方法需要調整。\n同樣一段衝突，有人只看見敵意，有人開始檢查需求與界線。\n事件不會自動告訴我們全部意義。\n我們透過記憶、語言、信念與經驗建立世界模型。\n如果模型永遠不更新，新的世界也可能被解讀成舊故事。\n真正的智慧，是讓理解保持開放，讓現實持續參與修正。\n最小行動｜畫出一件事件涉及的人、環境、信念與行動關係。\n【99｜元認知力：最高級的學習，是知道自己如何學習】\n有人背書很久，卻不知道自己為何記不住。\n有人反覆犯錯，卻從不檢查思考習慣。\n有人相信自己很理性，卻沒有發現情緒如何影響判斷。\n如果你只能觀察世界，卻不能觀察自己的思考，智慧是否仍有盲點？\n元認知讓我們不只處理問題，也能檢查處理問題的方法。\n當思考開始理解自己，學習便有了更新的入口。\n最小行動｜今天回顧一個判斷，檢查自己用了什麼思考方式。\n【100｜持續進化力：人生最高的智慧，不是成為完美的人】\n你不需要永遠正確，不需要永遠強大，也不需要一次解決所有問題。\n你需要的是看見、理解、提問、選擇、行動與更新的能力。\n當世界改變，你能重新學習；當方法失效，你能重新設計；當預測出錯，你能重新校準。\n真正的自由，不是掌握所有答案，而是不再被任何舊答案永久困住。\n願你像一條流動的河，不執著昨日的形狀，卻始終奔向更寬廣的海。\n最小行動｜每週回顧一次：我看錯什麼、學會什麼、下週更新什麼。\n【智慧生成OS｜五大終極哲學命題】\n① 知識是世界留給我們的痕跡，智慧是我們重新理解世界的能力。\n② 愚昧不是不知道，而是不知道自己可能不知道。\n③ 真正的自由，不是永遠不受限制，而是能夠辨認限制、調整模型、重新選擇。\n④ 真正的利他，不是讓別人依賴自己的答案，而是協助別人生成自己的智慧。\n⑤ 人生最值得累積的，不只是成功經驗，而是一套能夠從成功與失敗中持續更新的生命系統。\n【LifeOS｜智慧生成閉環】\n觀察現實 → 提出問題 → 辨認假設 → 理解關係 → 找出瓶頸 → 評估策略 → 採取最小行動 → 測量結果 → 分析預測誤差 → 更新世界模型 → 再次測試。\n【每日智慧生成五問】\n今天我真正看見了什麼？\n今天我有哪些判斷可能只是舊模型？\n今天哪個問題最值得優先改善？\n今天我能採取什麼最小行動？\n今天的現實回饋，要求我更新什麼？\n【總結金句】\n真正的智慧，不是把自己訓練成永遠不會犯錯的人，而是讓每一次錯誤，都有機會成為下一次看得更清楚、愛得更成熟、選得更自由的起點。"};</script><script>window.EXTRA={

map:[['感知','Perception','觀察、注意、辨識、篩選','Observation, attention, discernment, filtering'],['提問','Inquiry','提問、追問、質疑、重構','Questions, follow-up, critical inquiry, reframing'],['認知','Cognition','表徵、分類、比較、抽象','Representation, classification, comparison, abstraction'],['洞察','Insight','矛盾、假設、關係、機制','Contradictions, assumptions, relationships, processes'],['系統','Systems','權重、耦合、邊界、動態','Weighting, coupling, boundaries, dynamics'],['人性','Human understanding','同理、動機、溝通、合作','Empathy, motives, communication, cooperation'],['決策','Decisions','目標、風險、策略、配置','Goals, risks, strategies, allocation'],['自控','Self-direction','情緒、專注、習慣、界線','Emotions, focus, habits, boundaries'],['行動','Action','計畫、執行、測試、應變','Planning, execution, exploration, adaptation'],['更新','Revision','回饋、歸因、修正、遷移','Feedback, attribution, revision, transfer']],
stages:[['看見','Notice','觀察、辨識、注意','Observation, discernment, attention','發生了什麼？','What happened?'],['看懂','Understand','分類、提問、追問','Classification, questions, deeper inquiry','為什麼會這樣？','Why might this be happening?'],['看透結構','See relationships','關係、權重、邊界、矛盾','Relationships, importance, boundaries, contradictions','真正的瓶頸在哪裡？','Where is the real constraint?'],['做出改變','Make a change','決策、合作、執行、測試','Decisions, cooperation, action, exploration','下一步做什麼？','What is the next step?'],['持續進化','Keep growing','回饋、誤差、修正、遷移','Feedback, discrepancies, revision, transfer','下次如何做得更好？','What can improve next time?']],
line:[['先看清事實。行動：記錄三個觀察。','See what happened. Action: record three observations.'],['從資訊找到重點。行動：用一句話摘要。','Find what matters in information. Action: summarize in one sentence.'],['從問題找到深層問題。行動：連問三次為什麼。','Look beneath the first question. Action: ask why three times.'],['檢查推論與假設。行動：尋找一個反例。','Examine inferences and assumptions. Action: find one counterexample.'],['把事情整理成可理解的模型。行動：畫一張簡圖。','Give a situation an understandable shape. Action: draw a simple diagram.'],['看見關係、權重與瓶頸。行動：圈出最重要因素。','Notice relationships, importance, and constraints. Action: circle the most important factor.'],['理解事情如何互相影響。行動：畫一條連鎖反應。','Understand mutual influence. Action: draw a chain of consequences.'],['理解自己的情緒與信念。行動：記錄一次內在反應。','Notice your emotions and beliefs. Action: record one inner response.'],['讓情緒不自動決定行動。行動：先停十秒。','Leave room for choice within feelings. Action: pause for ten seconds.'],['理解需求、動機與界線。行動：先聽再回應。','Understand needs, motives, and boundaries. Action: listen before responding.'],['讓別人真正理解你的意思。行動：用三句話說清楚。','Help another person understand your meaning. Action: explain it in three sentences.'],['思考彼此的選擇與回應。行動：列出兩種可能反應。','Consider mutual choices and responses. Action: list two possible responses.'],['選擇真正重要的方向。行動：排出前三優先。','Choose a meaningful direction. Action: rank your top three priorities.'],['把時間與力量用在重要地方。行動：安排二十分鐘。','Give time and energy to what matters. Action: reserve twenty minutes.'],['把想法變成結果。行動：立刻開始兩分鐘。','Bring ideas into practice. Action: begin for two minutes now.'],['從練習與錯誤中進步。行動：修正一個弱點。','Learn through practice and mistakes. Action: work on one weak point.'],['從舊問題找到新方法。行動：提出三個方案。','Find a new approach to an old problem. Action: propose three options.'],['讓能力符合責任與尊重。行動：檢查一項選擇是否公平。','Practice abilities with responsibility and respect. Action: review the fairness of one choice.'],['讓結果檢查想法。行動：比較預測與現實。','Let experience examine an idea. Action: compare expectation with reality.'],['把經驗累積成可更新的世界模型。行動：每週回顧一次。','Build revisable understanding from experience. Action: review once a week.']],
quotes:[['知識讓你知道答案，提問讓你發現未知。','Knowledge offers answers; questions reveal the unknown.'],['觀察讓你看見現象，追問讓你理解結構。','Observation reveals events; deeper questions reveal relationships.'],['洞察讓你找到瓶頸，決策讓你選擇方向。','Insight locates a constraint; decisions choose a direction.'],['行動讓想法接受現實檢驗，回饋讓錯誤成為學習材料。','Action brings ideas into contact with reality; feedback turns mistakes into learning material.'],['真正的智慧，不是永遠正確，而是能夠持續改善自己的理解與行動。','Wisdom includes continually improving understanding and action.']],
ultimate:[['知識是世界留給我們的痕跡，智慧是我們重新理解世界的能力。','Knowledge is a trace the world leaves with us; wisdom is the ability to understand the world anew.'],['愚昧不是不知道，而是不知道自己可能不知道。','Ignorance deepens when we cannot recognize what we may not know.'],['真正的自由，不是永遠不受限制，而是能夠辨認限制、調整模型、重新選擇。','Freedom includes recognizing limits, revising understanding, and choosing again.'],['真正的利他，不是讓別人依賴自己的答案，而是協助別人生成自己的智慧。','Generosity helps others develop wisdom of their own rather than dependence on our answers.'],['人生最值得累積的，不只是成功經驗，而是一套能夠從成功與失敗中持續更新的生命系統。','Life can cultivate a way of growing through both success and failure, beyond collecting successful experiences.']],
daily:[['今天我真正看見了什麼？','What did I actually notice today?'],['今天我有哪些判斷可能只是舊模型？','Which judgments today might simply reflect an old interpretation?'],['今天哪個問題最值得優先改善？','Which problem most deserves attention today?'],['今天我能採取什麼最小行動？','What small action can I take today?'],['今天的現實回饋，要求我更新什麼？','What does today’s experience invite me to revise?']],
dailyShort:[['今天我看見什麼？','What did I notice today?'],['我發現什麼問題？','What question did I find?'],['真正的原因可能是什麼？','What might lie behind it?'],['我可以採取什麼小行動？','What small action can I take?'],['結果告訴我應該如何更新？','What does the outcome suggest I revise?']],
loop:['觀察現實 → 提出問題 → 辨認假設 → 理解關係 → 找出瓶頸 → 評估策略 → 採取最小行動 → 測量結果 → 分析預測誤差 → 更新世界模型 → 再次測試。','Observe reality → Ask a question → Notice assumptions → Understand relationships → Locate constraints → Consider approaches → Take a small action → Record outcomes → Review differences from expectations → Revise understanding → Explore again.'],
closing:['真正的智慧，不是把自己訓練成永遠不會犯錯的人，而是讓每一次錯誤，都有機會成為下一次看得更清楚、愛得更成熟、選得更自由的起點。','Wisdom gives each mistake a chance to become a beginning: to see more clearly, care more maturely, and choose more freely next time.'],
architecture:['哲學命題 → 排比句 → 對比句 → 反問句 → 情境衝突 → 認知翻轉 → 層層遞進 → 詩性收束。','Philosophical proposition → Parallel phrases → Contrast → Rhetorical question → Situational conflict → Reframing → Gradual deepening → Poetic close.'],
lenses:[['維根斯坦 · 語言與使用','Wittgenstein · Language in use','閱讀時先問：這個詞在此刻如何被使用？把「我不行」改寫成具體情境、對話與可做的下一步。此為本 App 的閱讀提案，不是原文引句。','Reading invitation: ask how a word is being used in this situation. Turn “I cannot” into a specific context, a conversation, and a possible next step. This is an interpretive prompt written for this app, not a quotation.'],['海德格 · 處境與可能','Heidegger · Situation and possibility','閱讀時先問：我身處什麼關係與日常之中？讓能力回到生活現場，辨認自己在乎什麼，以及願意承擔哪一種可能。此為閱讀提案，不是原文引句。','Reading invitation: ask what relationships and everyday circumstances you inhabit. Bring an ability into lived experience, notice what matters, and choose a possibility you are willing to take up. This is an interpretive prompt, not a quotation.'],['前沿研究提問 · 具身與生成','Research questions · Embodiment and generation','以具身認知、主動推論與複雜適應系統作為探索方向：觀察身體、環境、預期與行動如何彼此牽動。這是延伸研究入口，不宣稱本清單已由這些理論驗證。','Explore embodiment, active inference, and complex adaptive systems as research directions: attend to relations among bodily experience, surroundings, expectations, and action. These are invitations to further inquiry, not a claim that the list has been validated by these theories.']],
notes:[['本清單是操作型初始分類，並非宣稱能力只有100種；不必同時練習所有項目，先選當下最需要的一項。','This is an initial practical classification, not a claim that only 100 abilities exist. Begin with the one most relevant to your present situation.'],['兩份中文原稿完整保留。英文為本 App 編譯版本；哲學閱讀視角是另外標示的延伸提案。原稿中的「五部古典智慧、七套科學、天道模型15要素」僅有名稱，未提供定義。','Both Chinese source documents are preserved in full. English passages are app renderings; philosophical perspectives are separately marked reading invitations. The original names “five classical wisdom traditions,” “seven sciences,” and “15 elements of the Tiandao model” are not defined in the supplied material.'],['能力 BANK V1.0 可作為後續連結生活情境、練習題、回饋指標與複測紀錄的起點。本版以處境、語言使用與具體行動作為練習入口。','Ability Bank V1.0 can become a starting point for connecting everyday situations, exercises, feedback indicators, and review records. This edition approaches practice through situations, language in use, and concrete action.']]
};
</script><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let storageOK=true;function read(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{storageOK=false;toast('此瀏覽器無法保存紀錄 / Storage unavailable')}}
let state={view:'library',lang:read('w-language','both'),group:-1,query:'',page:1,filter:'all'},favorites=read('w-favorites',[]),completed=read('w-completed',[]),notes=read('w-notes',{}),current=0,lens=0;
const navs=[['library','▦','探索能力','Ability library'],['essays','▤','哲學短文','100 reflections'],['system','◎','智慧地圖','Wisdom map'],['journal','✎','每日練習','Daily practice'],['favorites','♡','我的收藏','Saved for you'],['sources','▧','完整資料館','Source archive']];
const bi=(z,e,cls='')=>`<span class="zh ${cls}">${esc(z)}</span><span class="en pair-en ${cls}">${esc(e)}</span>`;
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').style.display='none',3200)}
function setLang(l){state.lang=['zh','en','both'].includes(l)?l:'both';document.body.classList.toggle('hide-zh',l==='en');document.body.classList.toggle('hide-en',l==='zh');document.documentElement.lang=l==='en'?'en':'zh-Hant';$$('[data-lang]').forEach(b=>b.classList.toggle('selected',b.dataset.lang===l));save('w-language',l)}
function updateProgress(){$('#sideCount').textContent=`${completed.length} / 100 已練習 · practiced`;$('#sideProgress').style.width=completed.length+'%'}
function renderNav(){$('#nav').innerHTML=navs.map(n=>`<button data-view="${n[0]}" class="${state.view===n[0]?'active':''}"><span class="navicon">${n[1]}</span><span>${bi(n[2],n[3])}</span></button>`).join('');$$('[data-view]').forEach(b=>b.onclick=()=>navigate(b.dataset.view));$('#breadcrumb').textContent=navs.find(n=>n[0]===state.view).slice(2).join(' / ').toUpperCase();updateProgress()}
function navigate(view){stopSpeech();state.view=view;state.page=1;state.query='';state.group=-1;state.filter='all';history.replaceState(null,'','#'+view);render();window.scrollTo({top:0,behavior:'smooth'})}
function hero(z,e,description){return `<section class="hero"><div><div class="eyebrow">A PRACTICE OF BECOMING · 智慧生成 OS</div><h1>${bi(z,e)}</h1><p>${description||bi('智慧，從一個更好的問題開始。選一項能力，讓今天有一點不同。','Begin with a better question. Choose one ability. Make a small difference today.')}</p><div class="stats"><div><b>100</b><span>${bi('可練習能力','abilities')}</span></div><div><b>20</b><span>${bi('能力模組','modules')}</span></div><div><b>100</b><span>${bi('哲學短文','reflections')}</span></div></div></div><div class="orbit-art" aria-hidden="true"><div class="orbit-ring"></div><div class="orbit-core"></div><div class="orbit-dot"></div><small>ALWAYS BECOMING</small></div></section>`}
function todaysItem(){const d=new Date();return DATA.items[Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)%100]}
function dailyBanner(){const t=todaysItem();return `<section class="daily"><div><div class="eyebrow">TODAY’S SMALL STEP / 今日最小行動</div><h2>${bi(t.zh+'：'+t.action,t.en+': '+t.actionEn)}</h2><p>${bi('不必一次改變全部，先從這一步開始。','You do not need to change everything. Start here.')}</p></div><button data-open="${t.id}">${state.lang==='en'?'Explore today’s practice':'開始今日練習'} ↗</button></section>`}
function render(){renderNav();const m=$('#main');if(['library','essays','favorites'].includes(state.view)){
 const essay=state.view==='essays',fav=state.view==='favorites';m.innerHTML=hero(fav?'留住，值得再想的事。':essay?'讓文字，走進生活。':'每天一小步，智慧慢慢生長。',fav?'Ideas worth returning to.':essay?'Words that enter your life.':'Small steps. Deeper understanding.')+(fav?'':dailyBanner())+`<div class="section-head"><div><h2>${bi(fav?'我的收藏':essay?'100 篇哲學短文':'能力圖書館',fav?'Your collection':essay?'100 philosophical reflections':'The ability library')}</h2><small>${bi('看見 → 理解 → 提問 → 判斷 → 行動 → 更新','Notice → Understand → Question → Judge → Act → Revise')}</small></div><label class="search"><span>⌕</span><input id="search" aria-label="搜尋 / Search" placeholder="${state.lang==='en'?'Search abilities, actions, ideas…':'搜尋能力、行動、短文…'}"></label></div><div class="filters"><button data-group="-1" class="active">${state.lang==='en'?'All abilities':'全部能力'}</button>${DATA.groups.map((g,i)=>`<button data-group="${i}">${String(i+1).padStart(2,'0')} ${state.lang==='en'?EXTRA.groups[i]:g}</button>`).join('')}</div><div class="tools"><span id="resultCount" role="status"></span><select id="statusFilter" aria-label="Filter by practice status"><option value="all">${state.lang==='en'?'All practice states':'所有練習狀態'}</option><option value="done">${state.lang==='en'?'Practiced':'已練習'}</option><option value="todo">${state.lang==='en'?'Not yet practiced':'尚未練習'}</option></select></div><div class="grid" id="cards"></div><div class="pager" id="pager"></div>`;
 $('#search').value=state.query;$('#search').oninput=e=>{state.query=e.target.value;state.page=1;renderCards()};$('#statusFilter').onchange=e=>{state.filter=e.target.value;state.page=1;renderCards()};$$('[data-group]').forEach(b=>b.onclick=()=>{state.group=Number(b.dataset.group);state.page=1;$$('[data-group]').forEach(x=>x.classList.toggle('active',x===b));renderCards()});renderCards();bindOpen();
 }else if(state.view==='system')renderSystem();else if(state.view==='journal')renderJournal();else renderSources();setLang(state.lang)}
function renderCards(){let list=DATA.items.filter(x=>(state.view!=='favorites'||favorites.includes(x.id))&&(state.group===-1||x.group===state.group)&&(state.filter==='all'||completed.includes(x.id)===(state.filter==='done'))&&Object.values(x).join(' ').toLowerCase().includes(state.query.toLowerCase()));let max=Math.max(1,Math.ceil(list.length/12));state.page=Math.min(max,state.page);$('#resultCount').textContent=state.lang==='en'?`${list.length} abilities · page ${state.page} of ${max}`:`共 ${list.length} 項 · 第 ${state.page} / ${max} 頁`;
 $('#cards').innerHTML=list.slice((state.page-1)*12,state.page*12).map(x=>`<article class="card"><div class="cardtop"><span class="number">${String(x.id).padStart(3,'0')}</span><span class="tag">${state.lang==='en'?EXTRA.groups[x.group]:DATA.groups[x.group]}</span></div><h3>${bi(x.zh,x.en)}</h3><div class="english-name ${state.lang==='both'?'en':'hidden'}" style="display:none"></div><p>${bi(state.view==='essays'?x.essayTitle:x.wisdom,state.view==='essays'?x.essayTitleEn:x.wisdomEn)}</p><div class="action"><small>↳ ${state.lang==='en'?'SMALL ACTION':'最小行動 / SMALL ACTION'}</small>${bi(x.action,x.actionEn)}</div><div class="cardbottom"><button class="bookmark ${favorites.includes(x.id)?'bookmarked':''}" data-fav="${x.id}" aria-label="${favorites.includes(x.id)?'取消收藏 Remove bookmark':'收藏 Bookmark'}" aria-pressed="${favorites.includes(x.id)}">${favorites.includes(x.id)?'♥':'♡'}</button><button data-speak="${x.id}" aria-label="Read English for ${esc(x.en)}">◖)) EN</button>${completed.includes(x.id)?'<span class="done">✓</span>':''}<button class="open" data-open="${x.id}">${state.lang==='en'?'Read reflection':'閱讀短文'} ↗</button></div></article>`).join('')||`<div class="empty">${bi('這裡還沒有結果。試試其他關鍵字，或收藏一項能力。','No results yet. Try another search or save an ability.')}</div>`;
 $('#pager').innerHTML=`<button id="prev" ${state.page<=1?'disabled':''}>← ${state.lang==='en'?'Previous':'上一頁'}</button><span>${state.page} / ${max}</span><button id="next" ${state.page>=max?'disabled':''}>${state.lang==='en'?'Next':'下一頁'} →</button>`;$('#prev').onclick=()=>{state.page--;renderCards();$('#cards').scrollIntoView({behavior:'smooth',block:'start'})};$('#next').onclick=()=>{state.page++;renderCards();$('#cards').scrollIntoView({behavior:'smooth',block:'start'})};bindOpen();$$('[data-fav]').forEach(b=>b.onclick=()=>toggleFavorite(+b.dataset.fav));$$('[data-speak]').forEach(b=>b.onclick=()=>{const x=DATA.items[+b.dataset.speak-1];speak(`${x.en}. ${x.wisdomEn} Small action: ${x.actionEn}`,x.en)});}
function bindOpen(){$$('[data-open]').forEach(b=>b.onclick=()=>openItem(+b.dataset.open))}
function toggleFavorite(id){favorites=favorites.includes(id)?favorites.filter(n=>n!==id):[...favorites,id];save('w-favorites',favorites);if($('#cards'))renderCards();if($('#reader').open&&current===id){$('#modalFav').textContent=favorites.includes(id)?'♥ 已收藏 / Saved':'♡ 收藏 / Save';$('#modalFav').setAttribute('aria-pressed',favorites.includes(id))}}
function openItem(id){current=id;const x=DATA.items[id-1];$('#readerContent').innerHTML=`<div class="reader-head"><span class="mono-label">${String(id).padStart(3,'0')} / 100 · ${esc(DATA.groups[x.group])}</span><button id="closeReader" aria-label="Close reader">✕</button></div><h2 class="reader-title">${bi(x.zh+'｜'+x.essayTitle,x.en+' · '+x.essayTitleEn)}</h2><div class="reader-tools"><button id="readEssay">◖)) ${state.lang==='en'?'Listen in English':'英文朗讀'}</button><button id="modalFav" aria-pressed="${favorites.includes(id)}">${favorites.includes(id)?'♥ 已收藏 / Saved':'♡ 收藏 / Save'}</button><button id="copyEssay">${state.lang==='en'?'Copy text':'複製短文'} ↗</button></div><section class="reader-section"><div class="reading-pair"><div class="zh">${esc(x.essay)}</div><div class="en">${esc(x.essayEn)}</div></div><p class="smallnote">${bi('中文為提供的原文；英文為本 App 編譯。','Chinese: supplied original. English: app rendering.')}</p></section><div class="read-action"><div class="eyebrow">WISDOM → PRACTICE</div><p>${bi(x.wisdom,x.wisdomEn)}</p><strong>${bi(x.action,x.actionEn)}</strong></div><section class="reader-section"><div class="mono-label">READING INVITATION / 哲學閱讀視角</div><div class="lensbar">${EXTRA.lenses.map((l,i)=>`<button data-lens="${i}" class="${i===lens?'active':''}">${state.lang==='en'?l[1]:l[0]}</button>`).join('')}</div><div id="lensText"></div></section><section class="reader-section"><label for="itemNote">${bi('我的處境與下一步','My situation and next step')}</label><textarea class="note" id="itemNote" placeholder="${state.lang==='en'?'What does this mean in your life?':'這項能力，如何進入你今天的生活？'}">${esc(notes[id]||'')}</textarea><button class="primary" id="markDone">${completed.includes(id)?'✓ 已練習 · Practiced':'✓ 記錄一次練習 · Mark practiced'}</button><span class="smallnote"> ${bi('筆記自動儲存在此裝置','Notes save automatically on this device')}</span></section><div class="reader-tools"><button id="prevItem" ${id===1?'disabled':''}>← ${state.lang==='en'?'Previous':'上一篇'}</button><button id="nextItem" ${id===100?'disabled':''}>${state.lang==='en'?'Next':'下一篇'} →</button></div>`;
 $('#closeReader').onclick=()=>$('#reader').close();$('#readEssay').onclick=()=>speak(x.en+'. '+x.essayTitleEn+'. '+x.essayEn,x.en);$('#modalFav').onclick=()=>toggleFavorite(id);$('#copyEssay').onclick=()=>copyText(state.lang==='en'?x.en+'\n'+x.essayTitleEn+'\n'+x.essayEn:state.lang==='zh'?x.zh+'\n'+x.essayTitle+'\n'+x.essay:x.zh+' / '+x.en+'\n'+x.essay+'\n\n'+x.essayEn);$('#itemNote').oninput=e=>{notes[id]=e.target.value;save('w-notes',notes)};$('#markDone').onclick=()=>{completed=completed.includes(id)?completed.filter(n=>n!==id):[...completed,id];save('w-completed',completed);updateProgress();$('#markDone').textContent=completed.includes(id)?'✓ 已練習 · Practiced':'✓ 記錄一次練習 · Mark practiced';if($('#cards'))renderCards()};$$('[data-lens]').forEach(b=>b.onclick=()=>{lens=+b.dataset.lens;setLens()});$('#prevItem').onclick=()=>{stopSpeech();openItem(id-1)};$('#nextItem').onclick=()=>{stopSpeech();openItem(id+1)};setLens();if(!$('#reader').open)$('#reader').showModal();$('#reader').scrollTop=0;}
function setLens(){const l=EXTRA.lenses[lens];$('#lensText').innerHTML=`<p style="line-height:1.9">${bi(l[2],l[3])}</p>`;$$('[data-lens]').forEach(b=>b.classList.toggle('active',+b.dataset.lens===lens))}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('已複製 / Copied')}catch{toast('瀏覽器未允許複製，請選取文字複製 / Select the text to copy')}}
function block(title,en,content,speech){return `<section class="panel"><div class="section-head" style="margin:0 0 18px"><h2>${bi(title,en)}</h2>${speech?`<button data-extra-speech="${esc(speech)}" aria-label="Read English">◖)) EN</button>`:''}</div>${content}</section>`}
function renderSystem(){let h=hero('看見關係，打開可能。','A map for a growing mind.',bi(...EXTRA.core));h+=block('智慧生成總心智圖','The wisdom map',`<div class="flow">${['看見','理解','提問','判斷','行動','更新'].map((s,i)=>`<span>${bi(s,['Notice','Understand','Question','Judge','Act','Revise'][i])}</span>`).join('')}</div><div class="two-col">${EXTRA.map.map((x,i)=>`<div><h3>${String(i+1).padStart(2,'0')} ${bi(x[0],x[1])}</h3><p>${bi(x[2],x[3])}</p></div>`).join('')}</div><p>${bi('每一次現實回饋，都可以重新調整能力與世界模型。','Every encounter with reality can invite a revision of your abilities and understanding.')}</p>`,EXTRA.core[1]+' '+EXTRA.map.map(x=>x[1]+': '+x[3]).join('. '));
 h+=block('智慧成長的五個階段','Five stages of growth',EXTRA.stages.map((x,i)=>`<div class="panel"><span class="number">0${i+1}</span><h3>${bi(x[0],x[1])}</h3><p>${bi(x[2],x[3])}</p><strong>${bi(x[4],x[5])}</strong></div>`).join(''),EXTRA.stages.map(x=>x[1]+'. '+x[3]+'. '+x[5]).join(' '));
 h+=block('哲學閱讀的三個入口','Three reading invitations',EXTRA.lenses.map(x=>`<h3>${bi(x[0],x[1])}</h3><p>${bi(x[2],x[3])}</p>`).join(''),EXTRA.lenses.map(x=>x[1]+'. '+x[3]).join(' '));
 h+=block('LINE 版：20 大智慧能力與每日最小行動','20 modules · A compact daily guide',EXTRA.line.map((x,i)=>`<h3>${String(i+1).padStart(2,'0')} ${bi(DATA.groups[i],EXTRA.groups[i])}</h3><p>${bi(x[0],x[1])}</p>`).join(''),EXTRA.line.map((x,i)=>EXTRA.groups[i]+'. '+x[1]).join(' '));
 h+=block('五大核心金句','Five core reflections',EXTRA.quotes.map(x=>`<p class="quote">${bi(...x)}</p>`).join(''),EXTRA.quotes.map(x=>x[1]).join(' '));h+=block('五大終極哲學命題','Five philosophical propositions',EXTRA.ultimate.map(x=>`<p class="quote">${bi(...x)}</p>`).join(''),EXTRA.ultimate.map(x=>x[1]).join(' '));
 h+=block('LifeOS：智慧生成閉環','The LifeOS learning loop',`<p>${bi(...EXTRA.loop)}</p>`,EXTRA.loop[1]);h+=block('短文創作架構','The reflection-writing architecture',`<p>${bi(...EXTRA.architecture)}</p><p>${bi('每篇結合生活情境、認知升維與最小行動。核心精神：擁有不斷更新答案的能力。','Each reflection connects everyday situations, reframing, and a small action. The guiding spirit is the ability to keep renewing answers.')}</p>`,EXTRA.architecture[1]);h+=block('總結金句','A closing reflection',`<p class="quote">${bi(...EXTRA.closing)}</p>`,EXTRA.closing[1]);h+=EXTRA.notes.map(x=>`<p class="smallnote">${bi(...x)}</p>`).join('');$('#main').innerHTML=h;bindExtraSpeech()}
function bindExtraSpeech(){$$('[data-extra-speech]').forEach(b=>b.onclick=()=>speak(b.dataset.extraSpeech,'Wisdom OS · English'))}
function localDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function renderJournal(){let date=localDate(),entries=read('w-journal',{});$('#main').innerHTML=hero('把今天，寫成下一步。','Turn today into a next step.')+dailyBanner()+block('每日智慧生成五問','Five daily questions',`<div class="journal"><label for="journalDate">${bi('練習日期','Practice date')}</label><input type="date" id="journalDate" value="${date}" style="margin:15px 0 25px;padding:9px;border:1px solid #dbe0d3;border-radius:7px;display:block"><div id="questions"></div><button class="primary" id="saveJournal">${state.lang==='en'?'Save reflection':'儲存今日練習'}</button> <span class="journal-saved" id="journalStatus" role="status"></span><p class="smallnote">${bi('紀錄僅儲存在這個瀏覽器；你可以匯出備份。','Records stay in this browser. Export a backup to keep a copy.')}</p></div>`,EXTRA.daily.map(x=>x[1]).join(' '))+block('LINE 版每日五問','Compact daily questions',EXTRA.dailyShort.map(x=>`<p>${bi(...x)}</p>`).join(''),EXTRA.dailyShort.map(x=>x[1]).join(' '))+`<div class="panel"><h3>${bi('我的練習足跡','My practice trail')}</h3><p>${bi('已練習 '+completed.length+' 項能力 · 已收藏 '+favorites.length+' 項','Practiced '+completed.length+' abilities · Saved '+favorites.length)}</p><p id="entryCount"></p><button id="export">${state.lang==='en'?'Export all records':'匯出全部紀錄'} ↓</button><label style="display:inline-block;margin-left:12px"><span>${state.lang==='en'?'Import backup':'匯入備份'}</span> <input id="import" type="file" accept="application/json" style="max-width:190px"></label></div>`;
 function showQuestions(){date=$('#journalDate').value||localDate();let v=entries[date]||[];$('#questions').innerHTML=EXTRA.daily.map((x,i)=>`<label for="q${i}">${i+1}. ${bi(...x)}</label><textarea id="q${i}">${esc(v[i]||'')}</textarea>`).join('');$('#journalStatus').textContent=entries[date]?'已載入 / Loaded':'';$('#entryCount').textContent=Object.keys(entries).length+' 天紀錄 / recorded days'}showQuestions();$('#journalDate').onchange=showQuestions;$('#saveJournal').onclick=()=>{entries[date]=EXTRA.daily.map((_,i)=>$('#q'+i).value);save('w-journal',entries);$('#journalStatus').textContent=storageOK?'✓ 已儲存 / Saved':'未能儲存 / Not saved';$('#entryCount').textContent=Object.keys(entries).length+' 天紀錄 / recorded days'};$('#export').onclick=exportRecords;$('#import').onchange=importRecords;bindOpen();bindExtraSpeech()}
function download(name,text,type='text/plain'){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportRecords(){download('wisdom-os-backup-'+localDate()+'.json',JSON.stringify({version:1,favorites,completed,notes,journal:read('w-journal',{})},null,2),'application/json')}
async function importRecords(e){const file=e.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());const validIds=a=>Array.isArray(a)&&a.every(x=>Number.isInteger(x)&&x>=1&&x<=100);if(d.version!==1||!validIds(d.favorites)||!validIds(d.completed)||!d.notes||typeof d.notes!=='object'||!d.journal||typeof d.journal!=='object'||Object.values(d.notes).some(x=>typeof x!=='string')||Object.entries(d.journal).some(([k,v])=>!/^\d{4}-\d{2}-\d{2}$/.test(k)||!Array.isArray(v)||v.length!==5||v.some(x=>typeof x!=='string')))throw Error();favorites=[...new Set([...favorites,...d.favorites])];completed=[...new Set([...completed,...d.completed])];notes={...d.notes,...notes};const journal={...d.journal,...read('w-journal',{})};save('w-favorites',favorites);save('w-completed',completed);save('w-notes',notes);save('w-journal',journal);render();toast('已合併備份，保留現有筆記 / Backup merged')}catch{toast('無法讀取此備份 / Invalid backup file')}}
function sourceEnglish(which){if(which===0)return 'WISDOM GENERATION OS | 100 ABILITIES, WISDOM, SMALL ACTIONS\n\n'+EXTRA.core[1]+'\n\nThe original proposes 20 practical modules and 100 abilities, naming five classical wisdom traditions, seven sciences, a 15-element Tiandao model, and LifeOS, without supplying definitions. This app preserves that provenance and offers separately labeled philosophical reading invitations.\n\nTHE WISDOM MAP\nNotice → Understand → Question → Judge → Act → Revise\n'+EXTRA.map.map(x=>x[1]+': '+x[3]).join('\n')+'\nEach encounter with reality can invite revision.\n\n100 PRACTICAL ABILITIES\nThis is a practical classification, not an exhaustive academic taxonomy.\n'+DATA.items.map(x=>`${String(x.id).padStart(3,'0')} ${x.en}\nWisdom: ${x.wisdomEn}\nSmall action: ${x.actionEn}`).join('\n\n')+'\n\nFIVE STAGES\n'+EXTRA.stages.map(x=>x[1]+' | '+x[3]+' | '+x[5]).join('\n')+'\n\nCOMPACT GUIDE TO 20 MODULES\n'+EXTRA.line.map((x,i)=>EXTRA.groups[i]+': '+x[1]).join('\n')+'\n\nFIVE CORE REFLECTIONS\n'+EXTRA.quotes.map(x=>x[1]).join('\n')+'\n\nDAILY QUESTIONS\n'+EXTRA.dailyShort.map(x=>x[1]).join('\n')+'\n\nAbility Bank V1.0 is a starting point for connecting cognitive nodes, explanatory approaches, situations, exercises, feedback indicators, and review records. Choose the ability most needed now rather than practicing all 100 at once.\n\nWRITING BRIEF\nCreate approximately 100-character philosophical posts using propositions, parallelism, contrast, rhetorical questions, situational conflict, reframing, gradual deepening, and poetic closure.';
 return 'WISDOM GENERATION OS | 100 ABILITIES, 100 PHILOSOPHICAL REFLECTIONS\n\n'+EXTRA.architecture[1]+'\nEach original short post combines everyday situations, reframing, and a small action. The guiding spirit is the ability to keep renewing answers.\n\n'+DATA.items.map(x=>`${String(x.id).padStart(3,'0')} ${x.en}: ${x.essayTitleEn}\n${x.essayEn}`).join('\n\n')+'\n\nFIVE PHILOSOPHICAL PROPOSITIONS\n'+EXTRA.ultimate.map(x=>x[1]).join('\n')+'\n\nLIFEOS LOOP\n'+EXTRA.loop[1]+'\n\nFIVE DAILY QUESTIONS\n'+EXTRA.daily.map(x=>x[1]).join('\n')+'\n\nCLOSING REFLECTION\n'+EXTRA.closing[1]}
function renderSources(){let which=0;$('#main').innerHTML=hero('完整保留，每一個起點。','Every source, kept in view.',bi('兩份提供資料的完整中文原稿與英文編譯，可閱讀、朗讀及下載。','Read, listen to, and download both complete Chinese originals and English renderings.'))+`<div class="source-select"><button id="sourceA" class="primary">01 ${state.lang==='en'?'Ability bank':'能力 × 智慧 × 最小行動'}</button><button id="sourceB">02 ${state.lang==='en'?'100 reflections':'100 篇哲學短文'}</button><button id="downloadSource">↓ ${state.lang==='en'?'Download both languages':'下載雙語資料'}</button><button id="speakSource">◖)) ${state.lang==='en'?'Read English source':'朗讀英文資料'}</button></div><p class="smallnote">${bi(...EXTRA.notes[1])}</p><div class="panel"><div class="reading-pair"><div class="raw zh" id="sourceZh"></div><div class="raw en" id="sourceEn"></div></div></div>`;function show(){stopSpeech();$('#sourceZh').textContent=which===0?DATA.sourceA:DATA.sourceB;$('#sourceEn').textContent=sourceEnglish(which);$('#sourceA').classList.toggle('primary',which===0);$('#sourceB').classList.toggle('primary',which===1)}$('#sourceA').onclick=()=>{which=0;show()};$('#sourceB').onclick=()=>{which=1;show()};$('#downloadSource').onclick=()=>download('wisdom-os-source-'+(which+1)+'.txt',(which===0?DATA.sourceA:DATA.sourceB)+'\n\n—— ENGLISH RENDERING ——\n\n'+sourceEnglish(which));$('#speakSource').onclick=()=>speak(sourceEnglish(which),'Source '+(which+1)+' · English');show()}
let voices=[],speechQueue=[],speaking=false,paused=false,speechToken=0,lastText='',lastTitle='';
function populateVoices(){if(!('speechSynthesis'in window))return;const prior=$('#voice').value;voices=speechSynthesis.getVoices().filter(v=>/^en\b/i.test(v.lang));$('#voice').innerHTML=voices.length?voices.map((v,i)=>`<option value="${i}">${esc(v.name)} (${esc(v.lang)})</option>`).join(''):'<option value="">Device default English</option>';if(prior&&voices[+prior])$('#voice').value=prior}
function stopSpeech(){speechToken++;if('speechSynthesis'in window)speechSynthesis.cancel();speechQueue=[];speaking=false;paused=false;$('#pause').textContent='Ⅱ';$('#player').classList.remove('visible')}
function speak(text,title){if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){toast('此瀏覽器不支援語音朗讀 / Speech is unavailable in this browser');return}stopSpeech();($('#reader').open?$('#reader'):document.body).appendChild($('#player'));lastText=text;lastTitle=title;const token=speechToken;speechQueue=text.match(/[^.!?\n]+[.!?]?/g)?.flatMap(s=>{let chunks=[];while(s.length>230){let n=s.lastIndexOf(' ',220);if(n<1)n=220;chunks.push(s.slice(0,n));s=s.slice(n).trim()}if(s.trim())chunks.push(s.trim());return chunks})||[text];$('#playingTitle').textContent=title;$('#player').classList.add('visible');speaking=true;let done=0,total=speechQueue.length;
 function next(){if(token!==speechToken)return;let chunk=speechQueue.shift();if(!chunk){$('#speechStatus').textContent='朗讀完成 / Finished';speaking=false;return}const u=new SpeechSynthesisUtterance(chunk);window.activeUtterance=u;u.lang='en-US';const v=voices[+$('#voice').value];if(v)u.voice=v;u.rate=+$('#rate').value;u.onstart=()=>{$('#speechStatus').textContent=`朗讀中 / Reading · ${done+1} / ${total}`};u.onend=()=>{done++;next()};u.onerror=e=>{if(token!==speechToken||e.error==='interrupted'||e.error==='canceled')return;$('#speechStatus').textContent='無法播放 / '+e.error;speaking=false;toast('英文語音無法播放，請確認裝置有英文語音 / Check the device English voice')};speechSynthesis.speak(u)}next()}
$('#pause').onclick=()=>{if(!speaking){if(lastText)speak(lastText,lastTitle);return}paused=!paused;if(paused)speechSynthesis.pause();else speechSynthesis.resume();$('#pause').textContent=paused?'▶':'Ⅱ';$('#speechStatus').textContent=paused?'已暫停 / Paused':'朗讀中 / Reading'};$('#stop').onclick=stopSpeech;$('#voice').onchange=()=>{if(speaking)speak(lastText,lastTitle)};$('#rate').onchange=()=>{if(speaking)speak(lastText,lastTitle)};
$('#reader').addEventListener('close',stopSpeech);$('#reader').addEventListener('click',e=>{if(e.target===$('#reader')){const r=$('#reader').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#reader').close()}});$$('[data-lang]').forEach(b=>b.onclick=()=>{setLang(b.dataset.lang);render();if($('#reader').open)openItem(current)});if('speechSynthesis'in window){populateVoices();speechSynthesis.addEventListener('voiceschanged',populateVoices)}window.addEventListener('pagehide',stopSpeech);const initial=location.hash.slice(1);if(navs.some(n=>n[0]===initial))state.view=initial;render();

</script></body></html>
