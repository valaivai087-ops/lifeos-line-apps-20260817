<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {

}
header {

  color: white;

  text-align: center;
}
header h1 { font-size: clamp(26px, 5vw, 42px); font-weight: 900; }
header h1 span { color: var(--gold-light); }
header p { color: rgba(255,255,255,0.72); font-size: 15px; margin-top: 6px; }
nav {
  background: var(--white);
  border-bottom: 2px solid var(--gray);
  overflow-x: auto;
  white-space: nowrap;
  position: sticky;
  top: 0;
  z-index: 100;
}
.nav-inner { display: inline-flex; min-width: 100%; }
.tab-btn {
  background: none;
  border: none;
  cursor: pointer;
  padding: 16px 18px;
  font-size: 13px;
  font-weight: 700;
  color: var(--gray-mid);
  border-bottom: 3px solid transparent;
  transition: all .2s;
  white-space: nowrap;
}
.tab-btn:hover { color: var(--navy); background: var(--off-white); }
.tab-btn.active { color: var(--navy); border-bottom-color: var(--gold); }
main { max-width: 1000px; margin: 0 auto; padding: 32px 16px 64px; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
.model-header {
  background: linear-gradient(135deg, var(--navy), #0D1A3F);
  color: white;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 20px;
  text-align: center;
}
.model-title { font-size: 24px; font-weight: 900; margin-bottom: 4px; }
.model-title-en { font-size: 14px; color: var(--gold-light); font-weight: 600; letter-spacing: 1px; }
.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.summary-card {
  background: linear-gradient(135deg, var(--navy), #0D1A3F);
  color: white;
  padding: 16px;
  border-radius: 10px;
  text-align: center;
}
.summary-num { font-size: 28px; font-weight: 900; color: var(--gold-light); }
.summary-label { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 4px; }
.search-box { margin-bottom: 16px; }
.search-box input {
  width: 100%;
  padding: 12px;
  border: 1.5px solid var(--gray);
  border-radius: 8px;
  font-size: 14px;
}
.search-box input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(10, 122, 114, 0.1); }
.model-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
@media (max-width: 768px) { .model-container { grid-template-columns: 1fr; } }
.model-section {
  background: var(--white);
  border-radius: 14px;
  padding: 24px;
  border: 1.5px solid var(--gray);
}
.model-section h3 {
  font-size: 20px;
  font-weight: 800;
  color: var(--navy);
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--gray);
}
.model-section h3.wisdom { border-bottom-color: var(--gold); }
.model-section h3.skill { border-bottom-color: var(--teal); }
.item-list { display: flex; flex-direction: column; gap: 10px; max-height: 600px; overflow-y: auto; }
.item-list::-webkit-scrollbar { width: 6px; }
.item-list::-webkit-scrollbar-track { background: var(--gray); border-radius: 3px; }
.item-list::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }
.item {
  background: var(--off-white);
  padding: 12px 14px;
  border-radius: 8px;
  cursor: pointer;
  border: 1px solid var(--gray);
  transition: all .2s;
}
.item:hover { border-color: var(--teal); box-shadow: 0 2px 8px rgba(26,43,95,0.08); }
.item-zh { font-size: 14px; font-weight: 700; color: var(--navy); }
.item-en { font-size: 12px; color: var(--teal); margin-top: 2px; display: none; }
.item.open .item-en { display: block; }
.item-detail { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--gray); font-size: 13px; color: #3A4060; }
.item.open .item-detail { display: block; }
.tts-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--navy);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 11px;
  cursor: pointer;
  margin-top: 6px;
  transition: background .2s;
}
.tts-btn:hover { background: var(--teal); }
</style>

let currentModel = '高維思維';

function speakEn(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
  }
}

function switchModel(e, model) {
  currentModel = model;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  renderModel(model);
}

function toggleItem(el) {
  el.classList.toggle('open');
}

function filterItems() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  document.querySelectorAll('.item').forEach(item => {
    const zh = item.querySelector('.item-zh').textContent.toLowerCase();
    const en = item.querySelector('.item-en').textContent.toLowerCase();
    item.style.display = zh.includes(query) || en.includes(query) ? 'block' : 'none';
  });
}

function parseItem(line) {
  const match = line.match(/(.+?)｜(.+)/);
  return match ? { zh: match[1].trim(), en: match[2].trim() } : null;
}

function renderModel(model) {
  const content = document.getElementById('content');
  const data = DATA[model];
  
  const wisdom = data.wisdom.map(parseItem).filter(Boolean);
  const skills = data.skills.map(parseItem).filter(Boolean);

  let html = `
    <div class="model-header">
      <div class="model-title">${model}</div>
      <div class="model-title-en">${data.en}</div>
    </div>

    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-num">${wisdom.length}</div>
        <div class="summary-label">核心智慧</div>
      </div>
      <div class="summary-card">
        <div class="summary-num">${skills.length}</div>
        <div class="summary-label">核心能力</div>
      </div>
      <div class="summary-card">
        <div class="summary-num">${wisdom.length + skills.length}</div>
        <div class="summary-label">提升維度</div>
      </div>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜尋... Search..." onkeyup="filterItems()">
    </div>

    <div class="model-container">
      <div class="model-section">
        <h3 class="wisdom">💡 ${wisdom.length}個核心智慧</h3>
        <div class="item-list">
  `;

  wisdom.forEach((item, idx) => {
    html += `
      <div class="item" onclick="toggleItem(this)">
        <div class="item-zh">#${idx+1} ${item.zh}</div>
        <div class="item-en">${item.en}</div>
        <div class="item-detail">
          <button class="tts-btn" onclick="event.stopPropagation(); speakEn('${item.en.replace(/'/g, "\\'")}')">
            🔊 Speak
          </button>
        </div>
      </div>
    `;
  });

  html += `
        </div>
      </div>

      <div class="model-section">
        <h3 class="skill">⚡ ${skills.length}項核心能力</h3>
        <div class="item-list">
  `;

  skills.forEach((item, idx) => {
    html += `
      <div class="item" onclick="toggleItem(this)">
        <div class="item-zh">#${idx+1} ${item.zh}</div>
        <div class="item-en">${item.en}</div>
        <div class="item-detail">
          <button class="tts-btn" onclick="event.stopPropagation(); speakEn('${item.en.replace(/'/g, "\\'")}')">
            🔊 Speak
          </button>
        </div>
      </div>
    `;
  });

  html += `
        </div>
      </div>
    </div>
  `;

  content.innerHTML = html;
}

window.addEventListener('load', () => renderModel('高維思維'));
</script>

function hash(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
var day=Math.floor(Date.now()/864e5),off={};

// ── 雞湯卡 ──
function fill(card){
  var id=card.getAttribute('data-sp'),q=quotesOf(id);if(!q.length)return;
  // 每天預設先出該分頁的專屬句，按「換一碗」再輪到其他句
  var i=((day+hash(id))%specOf(id).length+(off[id]||0))%q.length;
  card.querySelector('.sp-q').textContent=q[i];
  card.querySelector('.sp-n').textContent=(i+1)+' / '+q.length;
  card.querySelector('[data-a=n]').style.display=q.length>1?'':'none';
  card.querySelector('[data-a=f]').textContent=favs().indexOf(q[i])>=0?'♥ 已收藏':'♡ 收藏';
}
function say(text){
  if(!('speechSynthesis' in window)){toast('這個瀏覽器不支援朗讀');return;}
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=0.9;speechSynthesis.speak(u);
}
// 存成 1080×1080 圖卡（PNG），可直接貼到臉書 / LINE
function saveImage(text){
  var S=1080,cv=document.createElement('canvas');cv.width=cv.height=S;
  var x=cv.getContext('2d'),g=x.createLinearGradient(0,0,S,S);
  g.addColorStop(0,'#1A2B5F');g.addColorStop(1,'#0A7A72');x.fillStyle=g;x.fillRect(0,0,S,S);
  x.strokeStyle='rgba(240,192,64,.55)';x.lineWidth=4;x.strokeRect(48,48,S-96,S-96);
  var F='"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif';
  x.textAlign='center';x.textBaseline='middle';
  x.fillStyle='#F0C040';x.font='bold 40px '+F;x.fillText('心靈雞湯',S/2,150);
  var size=text.length>60?50:text.length>32?58:68,lh=size*1.6,max=S-240,lines=[];
  x.font='bold '+size+'px '+F;
  text.split('\n').forEach(function(par){
    var line='';
    for(var i=0;i<par.length;i++){
      var ch=par[i],keep=/[，。！？、；：」』）]/.test(ch);   // 標點不放行首
      if(line&&!keep&&x.measureText(line+ch).width>max){lines.push(line);line=ch;}else line+=ch;
    }
    if(line)lines.push(line);
  });
  x.fillStyle='#fff';
  var y=S/2-(lines.length-1)*lh/2;
  lines.forEach(function(l,i){x.fillText(l,S/2,y+i*lh);});
  x.fillStyle='rgba(255,255,255,.7)';x.font='32px '+F;
  x.fillText(C.brand||document.title.split(/[｜|]/)[0].trim(),S/2,S-140);
  cv.toBlob(function(b){
    var a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='心靈雞湯_'+text.replace(/[\s\\/:*?"<>|，。！？、]/g,'').slice(0,10)+'.png';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
    toast('圖卡已下載 ✓');
  },'image/png');
}
function toast(m){
  var t=document.getElementById('spToast');if(!t)return;
  t.textContent=m;t.classList.add('on');clearTimeout(toast.t);
  toast.t=setTimeout(function(){t.classList.remove('on');},1300);
}
function copy(text){
  function fb(){var a=document.createElement('textarea');a.value=text;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');}catch(e){}a.remove();}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).catch(fb);else fb();
  toast('已複製 ✓');
}
function makeCard(id){
  var d=document.createElement('div');d.className='sp-card';d.setAttribute('data-sp',id);
  d.innerHTML='<div class="sp-h"><span>🍲 心靈雞湯</span><span class="sp-n"></span></div><div class="sp-q"></div><div class="sp-b"><button type="button" data-a="n">換一碗</button><button type="button" data-a="f">♡ 收藏</button><button type="button" data-a="c">複製</button><button type="button" data-a="s">朗讀</button><button type="button" data-a="i">存圖卡</button></div>';
  d.addEventListener('click',function(e){
    e.stopPropagation();
    var a=e.target.getAttribute&&e.target.getAttribute('data-a'),t=d.querySelector('.sp-q').textContent;
    if(a==='n'){off[id]=(off[id]||0)+1;fill(d);}
    else if(a==='c'){copy(t);}
    else if(a==='s'){say(t);}
    else if(a==='i'){saveImage(t);}
    else if(a==='f'){
      var f=favs(),k=f.indexOf(t);
      if(k>=0)f.splice(k,1);else f.unshift(t);
      setFavs(f);fill(d);toast(k>=0?'已取消收藏':'已收藏 ♥（按 🔍 可看全部收藏）');
    }
  });
  fill(d);return d;
}
function ensure(){
  panels().forEach(function(p){
    if(!p||!p.el)return;
    var host=p.host||p.el,ex=null;
    for(var c=host.firstElementChild;c;c=c.nextElementSibling){if(c.classList.contains('sp-card')){ex=c;break;}}
    if(ex){if(ex.getAttribute('data-sp')===p.id)return;ex.remove();}
    if(!quotesOf(p.id).length)return;
    var card=makeCard(p.id);
    if(p.after&&p.after.parentNode===host)host.insertBefore(card,p.after.nextSibling);
    else host.insertBefore(card,host.firstChild);
  });
}

// ── 搜尋 ──
var SKIP='script,style,noscript,nav,.nav,.nav-tabs,.sp-card,.sp-ov,.sp-fab,.sp-note,#spToast,.fbx-b,.fbx-fab,#fbxMask';
var cache=null;
function blocks(){
  var out=[],seen=new Set(),w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,null),n;
  while((n=w.nextNode())){
    var el=n.parentElement;
    if(!el||!n.nodeValue.trim()||el.closest(SKIP)||(C.skip&&el.closest(C.skip)))continue;
    while(el.parentElement&&el.parentElement!==document.body&&/^(B|I|EM|STRONG|SPAN|A|U|SMALL|CODE|SUP|SUB)$/.test(el.tagName))el=el.parentElement;
    if(seen.has(el))continue;seen.add(el);
    var t=el.textContent.replace(/\s+/g,' ').trim();
    if(t.length>=2)out.push({el:el,t:t});
  }
  return out;
}
function tabOf(el){
  if(C.tabs===false)return -1;
  var ps=panels();
  for(var i=0;i<ps.length;i++)if(ps[i].el&&ps[i].el.contains(el))return i;
  return -1;
}
function labelOf(el,ti){
  if(C.label)return C.label(el)||'';
  var nv=navs();return ti>=0&&nv[ti]?nv[ti].textContent.trim():'';
}
function snippet(t,k,len){
  var s=Math.max(0,k-18);
  return (s>0?'…':'')+t.substr(s,len)+(t.length>s+len?'…':'');
}
function domSearch(q){
  var ql=q.toLowerCase(),hit=[],bs=cache||(cache=blocks());
  for(var i=0;i<bs.length&&hit.length<300;i++){
    var k=bs[i].t.toLowerCase().indexOf(ql);
    if(k>=0)hit.push({el:bs[i].el,t:snippet(bs[i].t,k,72)});
  }
  // 只留最內層，避免同一段文字重複出現
  hit=hit.filter(function(a){return !hit.some(function(b){return b!==a&&a.el.contains(b.el);});});
  return hit.slice(0,40).map(function(h){var ti=tabOf(h.el);return{el:h.el,t:h.t,ti:ti,label:labelOf(h.el,ti)};});
}
function flash(el){
  setTimeout(function(){
    var t=el;if(!t||!document.body.contains(t))return;
    while(t&&t!==document.body&&t.offsetParent===null)t=t.parentElement;
    if(!t||t===document.body)return;
    t.scrollIntoView({block:'center',behavior:'smooth'});
    t.classList.add('sp-hit');setTimeout(function(){t.classList.remove('sp-hit');},1800);
  },140);
}
function reveal(r){
  var el=r.el;
  if(r.go){el=r.go()||el;}
  else if(C.reveal){C.reveal(el);}
  else{var nv=navs();if(r.ti>=0&&nv[r.ti])nv[r.ti].click();}
  flash(el);
}

  var top=document.createElement('button');top.type='button';top.className='sp-fab sp-ft';top.title='回到頂端';top.textContent='↑';

  window.addEventListener('scroll',function(){top.style.display=window.scrollY>500?'block':'none';},{passive:true});

  // 字體大小：標準 → 大 → 特大
  var Z=[1,1.15,1.3],zi=+lsGet('zoom')||0,zb=document.createElement('button');
  zb.type='button';zb.className='sp-fab sp-fz';zb.title='字體大小';zb.textContent='字';
  function zoom(){document.documentElement.style.zoom=Z[zi]===1?'':Z[zi];}
  zb.onclick=function(){zi=(zi+1)%Z.length;lsSet('zoom',String(zi));zoom();toast(['標準字體','大字體','特大字體'][zi]);};
  zoom();document.body.appendChild(zb);

  var fb=document.createElement('button');fb.type='button';fb.className='sp-fab sp-fs';fb.title='搜尋（按 / 開啟）';fb.textContent='🔍';
  var ov=document.createElement('div');ov.className='sp-ov';
  ov.innerHTML='<div class="sp-box"><div class="sp-row"><input type="search" placeholder="搜尋本 APP 內容…（Esc 關閉）"><button type="button" title="關閉">✕</button></div><div class="sp-r"></div></div>';
  document.body.appendChild(fb);document.body.appendChild(ov);
  var inp=ov.querySelector('input'),box=ov.querySelector('.sp-r'),res=[];
  function close(){ov.classList.remove('on');}
  function open(){cache=null;ov.classList.add('on');inp.focus();inp.select();render();}
  function render(){
    var q=inp.value.trim();
    if(!q){
      res=[];var f=favs();
      box.innerHTML='<div class="sp-em">輸入關鍵字，搜尋所有分頁的內容</div>'+(f.length
        ?'<div class="sp-fh">♥ 我的收藏（'+f.length+'）· 點一下複製</div>'+f.map(function(t,i){return '<div class="sp-it" data-f="'+i+'">'+esc(t)+'<span class="sp-x" data-x="'+i+'" title="移除">✕</span></div>';}).join('')
        :'<div class="sp-em">按雞湯卡上的「♡ 收藏」，喜歡的句子會存在這裡</div>');
      return;
    }
    res=(C.search?C.search(q):domSearch(q))||[];
    if(!res.length){box.innerHTML='<div class="sp-em">找不到「'+esc(q)+'」</div>';return;}
    var re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
    box.innerHTML=res.map(function(r,i){
      return '<div class="sp-it" data-i="'+i+'">'+(r.label?'<span class="sp-tag">'+esc(r.label)+'</span>':'')+esc(r.t).replace(re,function(m){return '<mark>'+m+'</mark>';})+'</div>';
    }).join('');
  }
  fb.onclick=open;
  inp.addEventListener('input',render);
  ov.querySelector('.sp-row button').onclick=close;
  ov.addEventListener('click',function(e){
    if(e.target===ov){close();return;}
    var xi=e.target.getAttribute('data-x');
    if(xi!==null){var f=favs();f.splice(+xi,1);setFavs(f);render();$$('.sp-card').forEach(fill);return;}
    var it=e.target.closest('.sp-it');if(!it)return;
    if(it.hasAttribute('data-f')){copy(favs()[+it.getAttribute('data-f')]||'');return;}
    var r=res[+it.getAttribute('data-i')];close();if(r)reveal(r);
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){close();return;}
    if(e.key==='/'&&!/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||''))&&!e.target.isContentEditable){e.preventDefault();open();}
  });
}

// ── 離線教練（取代需要連網 / API 的版本）──
var STOP={};'我很 我的 我想 我是 我不 我會 我要 怎麼 什麼 如何 可以 覺得 不知 知道 自己 沒有 是不 不是 為什 麼辦 還是 因為 所以 但是 一直 有點 的人 的時 時候 開始 想要 要怎 麼做 是否 已經 可能 真的 好像 這樣 那樣 的事 一個 現在'.split(' ').forEach(function(g){STOP[g]=1;});
var SYN=['害怕 恐懼 擔心 焦慮 不安 緊張','希望 絕望 無望 放棄 沒救','累 疲勞 疲倦 沒力 能量 精神 活力','睡 失眠 睡眠 熬夜 休息','吵架 衝突 爭吵 溝通 冷戰','孤單 孤獨 寂寞 連結 陪伴','生氣 憤怒 情緒 委屈','目標 方向 迷茫 意義 使命','學習 讀書 記憶 專注 理解','錢 財富 收入 賺錢 金錢','幫助 貢獻 付出 給予 成全','復發 修復 恢復 重建','癌 病人 疾病 治療 症狀','壓力 放鬆 呼吸 緊繃','吃 飲食 營養 血糖 代謝','運動 走路 步行 肌肉','痛 疼痛 發炎 不舒服','信任 背叛 安全感 界線','孩子 小孩 親子 教養','伴侶 另一半 婚姻 夫妻 親密','漸行漸遠 疏遠 距離 連結 陪伴','胖 體重 腰圍 減重','身份 身分 角色 定義'].map(function(s){return s.split(' ');});
var AD=/DHA|EPA|GABA|NMN|Q10|鎂|鋅|益生菌|補充|營養素|保健|生技|購買|團購|下單|膠囊|魚油|維生素|維他命|毫克|mg/i;
function coach(){
  if(!C.coach||typeof window.addMsg!=='function')return;
  var inp=document.getElementById('aiInput');if(!inp)return;
  var row=inp.parentElement,note=document.createElement('div');
  note.className='sp-note';note.textContent='離線教練：不連網、不需 API，回覆整理自本 APP 的內容。';
  row.parentNode.insertBefore(note,row.nextSibling);
  var skip=C.coach.skip||'#pg-ai,#pg-quiz,#pg-flash,#pg-diag,.hero,.nt-card,.nt-grid,.tech-card,.tech-row,.bb';
  function rnd(a){return a[Math.floor(Math.random()*a.length)];}
  window.sendAI=function(){
    var msg=inp.value.trim();if(!msg)return;
    inp.value='';window.addMsg('user',esc(msg));
    var g={};
    msg.replace(/[\s，。！？、,.!?「」『』（）()：:；;～~…]+/g,' ').split(' ').forEach(function(w){
      if(/^[\x00-\x7f]+$/.test(w)){if(w.length>1)g[w.toLowerCase()]=1;}
      else for(var i=0;i<w.length-1;i++){var b=w.substr(i,2);if(!STOP[b])g[b]=1;}
    });
    // 同義詞擴充：使用者說「害怕」，也找「恐懼」「擔心」的內容
    SYN.forEach(function(grp){
      if(grp.some(function(w){return msg.indexOf(w)>=0;}))grp.forEach(function(w){if(w.length>1)g[w]=1;});
    });
    var keys=Object.keys(g),seen={},cand=[];
    blocks().forEach(function(b){
      // 只取完整句子（有標點），略過標籤、編號這類短字
      // 也略過產品 / 補充品段落：教練只給觀念和行動，不推薦產品
      if(b.t.length<8||b.t.length>160||seen[b.t]||!/[，。；！？：,]/.test(b.t)||AD.test(b.t)||b.el.closest(skip))return;
      var tl=b.t.toLowerCase(),sc=0;
      keys.forEach(function(k){if(tl.indexOf(k)>=0)sc++;});
      if(sc>0){seen[b.t]=1;cand.push({el:b.el,t:b.t,sc:sc});}
    });
    cand=cand.filter(function(a){return !cand.some(function(b){return b!==a&&a.el.contains(b.el);});});
    cand.sort(function(a,b){return b.sc-a.sc||a.t.length-b.t.length;});
    var top=[],h='';
    cand.forEach(function(c){
      if(top.length<3&&!top.some(function(t){return t.t.indexOf(c.t)>=0||c.t.indexOf(t.t)>=0;}))top.push(c);
    });
    if(top.length){
      h+='<b>【相關重點】</b><br>'+top.map(function(x){
        var lb=labelOf(x.el,tabOf(x.el));
        return '• '+(lb?'〔'+esc(lb)+'〕':'')+esc(x.t);
      }).join('<br>')+'<br><br>';
    }else{
      h+='這個問題在 APP 裡沒有直接對應的段落，可以換個關鍵字，或用右下角 🔍 搜尋。先給你一個方向：<br><br>';
    }
    var qs=quotesOf('pg-ai');
    if(C.coach.steps&&C.coach.steps.length)h+='<b>【今日一小步】</b><br>'+esc(rnd(C.coach.steps))+'<br><br>';
    if(qs.length)h+='<b>【心靈雞湯】</b><br>'+esc(rnd(qs));
    setTimeout(function(){window.addMsg('bot',h);},300);
  };
}

// ── 每日任務：記住今天勾過的項目 + 連續打卡天數 ──
function tasks(){
  var td;try{td=taskDone;}catch(e){return;}
  if(!Array.isArray(td)||typeof window.toggleTask!=='function')return;
  var today=new Date().toDateString(),yest=new Date(Date.now()-864e5).toDateString(),s=null,orig=window.toggleTask;
  try{s=JSON.parse(lsGet('tasks'));}catch(e){}
  s=s||{date:'',done:[],streak:0,last:''};
  if(s.date===today&&s.done.length===td.length){
    s.done.forEach(function(d,i){if(d&&!td[i])orig(i);});
    var cb=document.getElementById('comboBadge');if(cb)setTimeout(function(){cb.style.display='none';},0);
  }
  window.toggleTask=function(i){
    orig(i);
    s.date=today;s.done=taskDone.slice();
    if(taskDone[i]&&s.last!==today){
      s.streak=s.last===yest?s.streak+1:1;s.last=today;
      toast('今日打卡 ✓ 連續 '+s.streak+' 天');
    }
    lsSet('tasks',JSON.stringify(s));
  };
}

function init(){
  ui();ensure();remember();coach();tasks();
  if(C.init)try{C.init();}catch(e){}
  ensure();
  var pend=false;
  function later(){if(pend)return;pend=true;setTimeout(function(){pend=false;ensure();},60);}
  new MutationObserver(later).observe(document.body,{childList:true,subtree:true});
  document.addEventListener('click',later,true);
}
if(document.readyState==='complete')setTimeout(init,0);
else window.addEventListener('load',function(){setTimeout(init,0);});
})();

// ── 臉書文圖：每一欄、每個項目都能產生臉書貼文 + 圖卡（共用模組，完全離線）──
(function(){
var F=window.FBX||{},S=window.SOUP||{};
var ITEM=F.items||'',GROUP=F.groups||'',QUOTE=F.quote||'',PAIR=F.pair||null;
var ALL=[ITEM,GROUP].filter(Boolean).join(',');
var ZH='"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif';
var THEMES=[{c:'#1A2B5F',t:'#E8ECF7'},{c:'#0A7A72',t:'#E2F4F1'},{c:'#C2416B',t:'#FCE9EF'},{c:'#B4690E',t:'#FBF0DC'},{c:'#5B3FA8',t:'#EEE9FA'},{c:'#1F7A3A',t:'#E4F4E8'}];
var K='fbx:'+(S.key||'app')+':';
function $$(s,r){return s?Array.prototype.slice.call((r||document).querySelectorAll(s)):[];}
function $(id){return document.getElementById(id);}
function is(el,sel){return !!sel&&el.matches(sel);}
function hash(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
function cut(s,n){s=String(s);return s.length>n?s.slice(0,n-1)+'…':s;}
function lsGet(k){try{return localStorage.getItem(K+k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(K+k,v);}catch(e){}}

// ── 從畫面上的項目取出文字 ──
var PIC=/^(?:[←-⯿〰〽㊗㊙️‍]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|\uD83E[\uDC00-\uDFFF]|\s)+/;
var DROP=/^(點擊複製|已複製.*|點擊翻面.*|tap to flip.*|speak|發音|例句\s*#?\d+|vol\s*\d+)$/i;
var LABEL=/^(低維|高維)\s*(low|high)?$/i;
function word(s){return /[A-Za-z一-鿿]/.test(s);}
function tidy(s){return s.replace(/[⭐★]+/g,'').replace(/\s+/g,' ').trim();}
function bare(s){return tidy(s.replace(PIC,''));}
function grab(el){
  var raw=[],cur='',subs=[];
  function flush(){var s=tidy(cur);if(s)raw.push(s);cur='';}
  (function walk(n){
    for(var c=n.firstChild;c;c=c.nextSibling){
      if(c.nodeType===3){cur+=c.nodeValue;continue;}
      if(c.nodeType!==1)continue;
      if(/^(BUTTON|SCRIPT|STYLE|INPUT|SELECT|TEXTAREA|CANVAS|A)$/.test(c.tagName)||c.classList.contains('sp-card'))continue;
      if(c.tagName==='BR'){flush();continue;}
      if(is(c,ALL)){flush();var t=titleOf(c);if(t)subs.push(t);continue;}
      var inl=/^inline/.test(getComputedStyle(c).display);
      if(!inl)flush();
      walk(c);
      if(!inl)flush();
    }
  })(el);
  flush();
  var lines=[],pre='';
  raw.forEach(function(s){
    if(DROP.test(s))return;
    if(!word(s)){if(!lines.length&&!pre&&PIC.test(s)&&!/\d/.test(s))pre=s.split(' ')[0];return;}
    // 「標籤：」接下一行
    if(lines.length&&/[:：]$/.test(lines[lines.length-1]))lines[lines.length-1]+=s;else lines.push(s);
  });
  return {lines:lines,subs:subs,pre:pre};
}
function noNum(s){return s.replace(/^#?\d+\s*[·.、:：\-]?\s*/,'');}
function titleOf(el){
  if(PAIR&&is(el,PAIR.sel)){
    var t=PAIR.title&&el.querySelector(PAIR.title),lo=el.querySelector(PAIR.low);
    return bare(t?t.textContent:lo?part(lo)[0]||'':'');
  }
  var g=grab(el);if(!g.lines.length)return '';
  if(is(el,QUOTE))return g.lines.slice().sort(function(a,b){return b.length-a.length;})[0];
  return noNum(bare(g.lines[0]))||g.lines[0];
}
function part(el){return grab(el).lines.filter(function(s){return !LABEL.test(s);}).map(bare);}

function panels(){
  if(S.panels)return S.panels()||[];
  return $$(S.panel||'.pg').map(function(el){return{el:el,id:el.id,host:(S.host&&el.querySelector(S.host))||el};});
}
function shown(el){return !!(el&&el.getClientRects().length);}
function navText(){
  var b=$$(S.nav).filter(function(x){return /(^|\s)(on|active)(\s|$)/.test(x.className);})[0];
  return b?tidy(b.textContent):'';
}
function panelFor(el){
  var ps=panels(),hit=null;
  ps.forEach(function(p){if(p&&p.el&&p.el.contains(el)&&(!hit||hit.el.contains(p.el)))hit=p;});
  return hit;
}
function labelFor(p){
  var t=navText(),h=p&&p.after;
  if(h&&/^H[1-4]$/.test(h.tagName))t+=(t?'｜':'')+tidy(h.textContent);
  return t;
}
function quotesFor(p){
  var q=(p&&S.soups&&S.soups[p.id])||[];
  return q.length?q:(S.common||S.extra||[]);
}

function entry(el){
  var p=panelFor(el),g=grab(el),e={el:el,tab:labelFor(p),quotes:quotesFor(p),pre:g.pre,subs:g.subs,lines:g.lines};
  if(PAIR&&is(el,PAIR.sel)){
    var lo=part(el.querySelector(PAIR.low)||el),hi=part(el.querySelector(PAIR.high)||el);
    e.kind='pair';e.title=titleOf(el)||lo[0]||'';
    e.low=lo[0]||'';e.high=hi[0]||'';e.lowEn=lo[1]||'';e.highEn=hi[1]||'';
    var used=lo.concat(hi,[e.title]);
    e.lines=g.lines.filter(function(s){var b=bare(s);return !LABEL.test(s)&&used.indexOf(b)<0&&used.indexOf(noNum(b))<0&&!/^#\d+/.test(s);});
  }else if(is(el,QUOTE)){
    e.kind='quote';e.title=titleOf(el);
    e.lines=g.lines.filter(function(s){return s!==e.title;}).map(function(s){return noNum(s);}).filter(Boolean);
  }else{
    e.kind=is(el,GROUP)?'group':'item';
    e.title=titleOf(el);e.lines=g.lines.slice(1);
  }
  return e;
}
function tabEntry(p){
  var raw=labelFor(p)||F.brand||'',m=raw.match(PIC),seen={},heads=[],subs=[];
  $$('h1,h2,h3,.sec-h,.sec-s,.hero-p,.section-title,.model-title,.subtitle',p.el).forEach(function(h){
    if(h.closest('.sp-card')||(ALL&&h.closest(ALL))||heads.length>=4)return;
    var t=tidy(h.textContent);
    if(t.length>3&&t.length<90&&!seen[t]){seen[t]=1;heads.push(t);}
  });
  $$(ALL,p.el).forEach(function(el){
    if(ALL&&el.parentElement.closest(ALL)&&p.el.contains(el.parentElement.closest(ALL)))return;
    var t=titleOf(el);if(t&&!seen[t]){seen[t]=1;subs.push(t);}
  });
  return {kind:'tab',p:p,el:p.el,tab:F.brand||'',title:bare(raw)||raw,pre:m?tidy(m[0]).split(' ')[0]:'',lines:heads,subs:subs,quotes:quotesFor(p)};
}

// ── 貼文 ──
var HOOK=[
 function(t){return '你有沒有發現，「'+t+'」這件事，其實每天都在影響你？';},
 function(t){return '今天想跟你分享一個小重點：「'+t+'」。';},
 function(t){return '很多時候我們卡住，不是不夠努力，而是還沒看懂「'+t+'」。';},
 function(t){return '如果今天只記得一件事，就記這個——「'+t+'」。';}
];
var HOOKL=['這一段，想送給今天的你。','看到這裡，先停三秒，慢慢讀。','有些話，早一點知道，就少走一點冤枉路。','今天的小提醒，留給正在努力的你。'];
var TURN=['看懂了，就不會只是硬撐。知道原理，才知道力氣要用在哪裡。','不用一次全部做到。先懂一點、做一點，改變就開始了。','這不是要你更用力，而是換一個更省力的方向。','知道，是第一步；願意試一次，是第二步。'];
var TURNP=['語言不只是在描述事情，它也在決定你接下來怎麼想、怎麼做。同一件事換一個說法，眼前就多一條路。','不是要你假裝沒事，而是把「我完了」換成「我還可以做什麼」。','一句話說久了會變成信念，信念久了會變成人生。先從換一句話開始。','低維的說法把門關上，高維的說法把門打開。你值得多一扇門。'];
var ASK=[
 function(t){return '我在哪個情境，最需要「'+t+'」？';},
 function(t){return '如果今天就用上它，第一步會是什麼？';},
 function(t){return '我身邊誰把這件事做得很好？他是怎麼做的？';},
 function(t){return '一個月後回頭看，我希望這件事有什麼不同？';}
];
var ASKQ=['這句話，讓你想到誰？','今天哪一刻，最需要這句話？','如果把這句話送給一個人，你會送給誰？','這句話裡，哪幾個字最打動你？'];
var STEP=['今天只挑一個重點，寫下來，貼在看得到的地方。','把這一段講給一個人聽，講得出來才是真的懂。','選一件五分鐘內做得到的小事，現在就做。','睡前花一分鐘，想想今天哪裡用上了它。'];
var CLOSE=['把這篇留給今天的自己，也分享給那個正在努力的人。','慢慢來，比較快；一點點，就很多。','有共鳴的話，留言告訴我你的想法。','覺得有幫助，就分享給需要的朋友吧。'];
function pick(a,k){return a[k%a.length];}
function build(e,v){
  var T=e.title,k=hash(T)+(v||0),L=[],card,tab=e.kind==='tab';
  var steps=(F.steps&&F.steps.length?F.steps:(S.coach&&S.coach.steps)||[]).concat(STEP);
  var q=e.quotes.length?pick(e.quotes,k):'';
  function sec(h,arr,n){
    if(!arr.length)return;
    L.push('▍'+h);arr.slice(0,n).forEach(function(s){L.push('・'+cut(s,140));});
    if(arr.length>n)L.push('…共 '+arr.length+' 項');L.push('');
  }
  if(e.kind==='pair'){
    L.push('【換句話說｜'+T+'】','你是不是也常這樣說、這樣想？','');
    L.push('✗ 低維：「'+e.low+'」');if(e.lowEn)L.push('　'+e.lowEn);
    L.push('✓ 高維：「'+e.high+'」');if(e.highEn)L.push('　'+e.highEn);L.push('');
    sec('補充說明',e.lines,4);
    L.push('▍為什麼要換一句話',pick(TURNP,k),'');
    card={kind:'pair',head:T===e.low?'換句話說':T,low:e.low,high:e.high,quote:q};
  }else if(e.kind==='quote'){
    L.push('「'+T+'」','',pick(HOOKL,k),'');
    L.push('▍想一想','・'+pick(ASKQ,k),'・'+pick(ASKQ,k+1),'');
    L.push('▍換個角度看',pick(TURN,k),'');
    card={kind:'quote',quote:T,sub:e.lines[0]||''};
  }else{
    L.push('【'+(tab&&F.brand?F.brand+'｜':'')+(e.pre?e.pre+' ':'')+T+'】',T.length>16?pick(HOOKL,k):pick(HOOK,k)(T),'');
    sec(tab?'這一欄在說什麼':'重點整理',e.lines,tab?4:7);
    sec(tab?'這一欄的項目':'裡面有這些重點',e.subs,10);
    if(tab&&e.quotes.length){L.push('▍三句心靈雞湯');e.quotes.slice(0,3).forEach(function(s){L.push('「'+s+'」');});L.push('');}
    if(!tab&&e.lines.length<3)L.push('▍想一想','・'+pick(ASK,k)(T),'・'+pick(ASK,k+1)(T),'');
    L.push('▍換個角度看',pick(TURN,k),'');
    card={kind:'item',head:(e.pre?e.pre+' ':'')+T,lines:(e.lines.length?e.lines:e.subs).slice(0,tab?5:4).map(function(s){return cut(s,46);}),quote:q};
  }
  L.push('🌱 今天的小步｜'+pick(steps,k),'');
  if(q&&e.kind!=='quote'&&!tab)L.push('🍲 「'+q+'」','');
  L.push(pick(CLOSE,k),'');
  var body=L.join('\n');
  if(F.note&&(!F.noteRe||new RegExp(F.noteRe).test(body)))L.push(F.note,'');
  var tt=T.replace(/[^A-Za-z0-9一-鿿]/g,'');
  L.push([F.tags||'',e.kind!=='quote'&&tt.length>1&&tt.length<=10&&!/^\d/.test(tt)?'#'+tt:'','#心靈雞湯 #自我成長 #LifeOS'].filter(Boolean).join(' '));
  card.tab=[F.brand,e.tab!==F.brand?bare(e.tab):''].filter(Boolean).join(' · ');
  return {text:L.join('\n'),card:card};
}

// ── 圖卡（1080×1350）──
function wrap(x,text,maxW){
  var tk=String(text).match(/[A-Za-z0-9'’\-]+[.,!?;:]?\s?|\s+|[^\sA-Za-z0-9]/g)||[],noHead='，。！？、；：」』）)…—',out=[],cur=[];
  function push(){var s=cur.join('').trim();if(s)out.push(s);}
  tk.forEach(function(w){
    if(cur.join('').trim()&&x.measureText(cur.join('')+w).width>maxW){
      var carry=[];if(noHead.indexOf(w)>=0&&cur.length>1)carry.unshift(cur.pop());   // 標點不放行首
      push();cur=carry.concat(w.replace(/^\s+/,''));
    }else cur.push(w);
  });
  push();return out;
}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
function draw(cv,c,th){
  var W=1080,H=1350,X=84,MW=W-168,x=cv.getContext('2d');cv.width=W;cv.height=H;
  function lay(s,paint,off){
    function f(px,wt){x.font=(wt||'')+' '+Math.round(px*s)+'px '+ZH;}
    function put(arr,a,y,lh,col){if(paint){x.fillStyle=col;arr.forEach(function(l,i){x.fillText(l,a,y+i*lh);});}return y+arr.length*lh;}
    function box(arr,y,lh,bg,bar,col,label){
      var h=arr.length*lh+(label?104:64)*s;
      if(paint){x.fillStyle=bg;rr(x,X-20,y,MW+40,h,28);x.fill();x.fillStyle=bar;x.fillRect(X-20,y+24,10,h-48);}
      if(label){f(28,'bold');put([label],X+32,y+30*s,40*s,bar);}
      f(c.kind==='pair'?48:36,c.kind==='pair'?'bold':'');
      put(arr,X+32,y+(label?78:34)*s,lh,col);
      return y+h;
    }
    x.textBaseline='top';x.textAlign='left';
    f(58,'bold');var head=c.head?wrap(x,c.head,MW):[];
    var hh=Math.round(150+(head.length?head.length*78*s+50:0));
    if(paint){
      x.fillStyle='#FAF6EF';x.fillRect(0,0,W,H);x.fillStyle=th.c;x.fillRect(0,0,W,hh);
      x.font='30px '+ZH;x.fillStyle='rgba(255,255,255,.85)';var tb=c.tab;while(tb.length>4&&x.measureText(tb).width>MW)tb=tb.slice(0,-2)+'…';x.fillText(tb,X,64);
    }
    f(58,'bold');put(head,X,124,78*s,'#fff');
    var y=hh+70*s+off;
    if(c.kind==='pair'){
      f(48,'bold');var lo=wrap(x,c.low,MW-90),hi=wrap(x,c.high,MW-90);
      y=box(lo,y,68*s,'#FBE7EA','#B4233C','#5A1622','✗ 低維｜舊說法');
      f(54,'bold');if(paint){x.fillStyle=th.c;x.fillText('↓',W/2-16*s,y+14*s);}y+=92*s;
      y=box(hi,y,68*s,th.t,th.c,'#1F2937','✓ 高維｜新說法')+56*s;
    }else if(c.kind==='quote'){
      f(70,'bold');y=put(wrap(x,'「'+c.quote+'」',MW),X,y,102*s,'#2B2622')+30*s;
      if(c.sub){f(34,'');y=put(wrap(x,'— '+c.sub,MW),X,y,50*s,'#8A7F76');}
    }else if(c.lines.length){
      f(36,'');var bl=[];c.lines.forEach(function(l){wrap(x,'・'+l,MW-90).forEach(function(w){bl.push(w);});});
      y=box(bl,y,58*s,th.t,th.c,'#3A332E')+56*s;
    }
    if(c.quote&&c.kind!=='quote'){
      f(27,'bold');var pw=x.measureText('心靈雞湯').width+48,ph=54*s;
      if(paint){x.fillStyle=th.c;rr(x,X,y,pw,ph,ph/2);x.fill();x.fillStyle='#fff';x.fillText('心靈雞湯',X+24,y+(ph-27*s)/2-2);}
      y+=ph+22*s;f(40,'bold');y=put(wrap(x,'「'+c.quote+'」',MW),X,y,62*s,'#2B2622');
    }
    return y;
  }
  var s=1.25;while(s>0.5&&lay(s,false,0)>H-170)s-=0.03;
  lay(s,true,Math.max(0,Math.min(150,(H-170-lay(s,false,0))/2)));
  x.fillStyle='#E4DAD0';x.fillRect(X,H-130,MW,3);
  x.textBaseline='top';x.font='bold 32px '+ZH;x.fillStyle=th.c;x.fillText(cut(F.brand||'LifeOS',22),X,H-96);
  x.font='28px '+ZH;x.fillStyle='#8A7F76';var tg='#心靈雞湯';x.fillText(tg,W-X-x.measureText(tg).width,H-94);
}

var cur=null,ver=0,list=[],ti=parseInt(lsGet('theme'),10);
if(!(ti>=0&&ti<THEMES.length))ti=F.theme||0;
function toast(b,t){var o=b.textContent;b.textContent=t;setTimeout(function(){b.textContent=o;},1200);}

function fname(){return ((F.brand||'LifeOS')+'_'+cur.title).replace(/[\\/:*?"<>|\s，。！？、]+/g,'_').slice(0,40);}
function count(t){return (t.match(/[一-鿿]/g)||[]).length+(t.match(/[A-Za-z][A-Za-z'’\-]*/g)||[]).length;}
function show(){
  var r=build(cur,ver);
  $('fbxTitle').textContent='📘 '+(cur.kind==='tab'?'本頁：':'')+cut(cur.title,28);
  $('fbxText').value=r.text;$('fbxCnt').textContent='約 '+count(r.text)+' 字';
  draw($('fbxCanvas'),r.card,THEMES[ti]);
}
function chips(){
  var kw=$('fbxSearch').value.trim().toLowerCase(),box=$('fbxList');box.innerHTML='';
  list.forEach(function(it){
    if(kw&&it.find.indexOf(kw)<0)return;
    var b=document.createElement('button');b.type='button';b.textContent=(it.tab?'📄 本頁｜':'')+cut(it.title,18);
    if(cur&&it.el===cur.el&&!!it.tab===(cur.kind==='tab'))b.className='on';
    b.onclick=function(){open(it.tab?tabEntry(it.p):entry(it.el));};box.appendChild(b);
  });
  if(!box.firstChild)box.innerHTML='<span style="opacity:.6;padding:4px">找不到符合的項目</span>';
}
function scan(){
  list=[];
  panels().forEach(function(p){
    if(!p||!shown(p.el))return;
    list.push({tab:1,p:p,el:p.el,title:bare(labelFor(p))||F.brand||'本頁',find:''});
    $$(ALL,p.el).forEach(function(el){
      var t=titleOf(el);if(t)list.push({el:el,title:t,find:el.textContent.toLowerCase()});
    });
  });
}
function open(e){
  if(!e||!e.title)return;
  cur=e;ver=0;scan();$('fbxMask').classList.add('on');chips();show();
  var on=$('fbxList').querySelector('.on');if(on)on.scrollIntoView({block:'nearest'});
}
function close(){$('fbxMask').classList.remove('on');}
function ui(){
  var st=document.createElement('style');
  st.textContent='.fbx-b{display:inline-flex;align-items:center;gap:4px;margin:8px 0 0 auto;padding:4px 11px;border-radius:999px;border:1px solid rgba(24,119,242,.45);background:rgba(24,119,242,.1);color:#1877F2;font:700 11px/1.4 '+ZH+';cursor:pointer;white-space:nowrap;flex:none;align-self:center;width:auto;height:auto;letter-spacing:0;text-transform:none}'+
  '.sp-dark .fbx-b{color:#7DB4FF;border-color:rgba(125,180,255,.45);background:rgba(125,180,255,.1)}.fbx-b:hover{background:#1877F2;color:#fff}'+
  '.fbx-g{display:flex;margin:0 0 12px}.fbx-fab{bottom:216px;background:#1877F2!important;color:#fff!important}'+
  '#fbxMask{position:fixed;top:0;left:0;right:0;bottom:0;z-index:1200;background:rgba(20,16,12,.6);display:none;align-items:center;justify-content:center;padding:12px}#fbxMask.on{display:flex}'+
  '#fbxBox{background:#FAF6EF;color:#2B2622;width:min(1040px,100%);max-height:94vh;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font:14px/1.6 '+ZH+';text-align:left}'+
  '#fbxTop{display:flex;gap:8px;align-items:center;padding:12px 14px;background:#1877F2;color:#fff}#fbxTop b{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}'+
  '#fbxSearch{flex:0 1 260px;min-width:110px;padding:7px 12px;border:0;border-radius:999px;font:14px '+ZH+';color:#2B2622;background:#fff;outline:none}'+
  '#fbxX{background:none;border:0;color:#fff;font-size:22px;cursor:pointer;line-height:1;padding:0 4px}'+
  '#fbxList{max-height:118px;overflow-y:auto;flex:none;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid #E4DAD0;background:#fff}'+
  '#fbxList button{border:1px solid #E4DAD0;background:#FAF6EF;color:#2B2622;border-radius:999px;padding:3px 10px;font:12px '+ZH+';cursor:pointer}#fbxList button.on{background:#1877F2;color:#fff;border-color:#1877F2}'+
  '#fbxMain{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;padding:14px;overflow:auto}'+
  '#fbxText{width:100%;height:52vh;min-height:240px;box-sizing:border-box;padding:12px;border:1px solid #E4DAD0;border-radius:12px;background:#fff;color:#2B2622;font:14px/1.75 '+ZH+';resize:vertical}'+
  '#fbxCanvas{width:100%;height:auto;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.15);display:block}'+
  '#fbxBar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}#fbxBar button{padding:7px 13px;border-radius:999px;border:1px solid #1877F2;background:#1877F2;color:#fff;font:700 13px/1.2 '+ZH+';cursor:pointer}#fbxBar button.g{background:#fff;color:#1877F2}'+
  '#fbxCnt{font-size:12px;color:#8A7F76;margin-left:auto}#fbxTip{font-size:12px;color:#8A7F76;margin-top:8px}'+
  '@media(max-width:760px){#fbxMain{grid-template-columns:minmax(0,1fr)}#fbxText{height:34vh}#fbxCanvas{max-width:280px;margin:0 auto}}'+
  '@media print{.fbx-b,.fbx-fab,#fbxMask{display:none!important}}';
  document.head.appendChild(st);
  var fab=document.createElement('button');fab.type='button';fab.className='sp-fab fbx-fab';fab.title='臉書文圖';fab.textContent='📘';
  fab.onclick=function(){scan();if(list[0])open(tabEntry(list[0].p));};
  document.body.appendChild(fab);
  var m=document.createElement('div');m.id='fbxMask';
  m.innerHTML='<div id="fbxBox"><div id="fbxTop"><b id="fbxTitle"></b><input id="fbxSearch" type="search" placeholder="搜尋本頁項目…"><button id="fbxX" type="button" title="關閉">×</button></div>'+
   '<div id="fbxList"></div><div id="fbxMain"><div><textarea id="fbxText" spellcheck="false"></textarea><div id="fbxBar">'+
   '<button type="button" id="fbxCopy">📋 複製貼文</button><button type="button" id="fbxPng">🖼️ 下載圖卡</button>'+
   '<button type="button" class="g" id="fbxNext">🔄 換一版</button><button type="button" class="g" id="fbxTheme">🎨 換配色</button>'+
   '<button type="button" class="g" id="fbxTxt">💾 存成 TXT</button><span id="fbxCnt"></span></div>'+
   '<div id="fbxTip">貼文可以直接在框裡修改。到臉書發文：貼上文字，再加入下載的圖卡。</div></div>'+
   '<div><canvas id="fbxCanvas"></canvas></div></div></div>';
  document.body.appendChild(m);
  m.addEventListener('click',function(e){if(e.target===m)close();});
  $('fbxX').onclick=close;
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
  $('fbxSearch').addEventListener('input',chips);
  $('fbxNext').onclick=function(){ver++;show();};
  $('fbxTheme').onclick=function(){ti=(ti+1)%THEMES.length;lsSet('theme',String(ti));draw($('fbxCanvas'),build(cur,ver).card,THEMES[ti]);};
  $('fbxCopy').onclick=function(){
    var t=$('fbxText'),b=this;function fb(){t.select();try{document.execCommand('copy');}catch(e){}}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).catch(fb);else fb();
    toast(b,'✅ 已複製');
  };
  $('fbxPng').onclick=function(){$('fbxCanvas').toBlob(function(b){save(b,fname()+'.png');},'image/png');};
  $('fbxTxt').onclick=function(){save(new Blob(['﻿'+$('fbxText').value],{type:'text/plain;charset=utf-8'}),fname()+'.txt');};
}
function btn(text,fn){
  var b=document.createElement('button');b.type='button';b.className='fbx-b';b.textContent=text;
  b.addEventListener('click',function(e){e.stopPropagation();e.preventDefault();fn();});
  return b;
}
function own(el,cls){for(var c=el.firstElementChild;c;c=c.nextElementSibling)if(c.classList.contains(cls))return c;return null;}
function decorate(){
  $$(ALL).forEach(function(el){
    if(own(el,'fbx-b')||el.closest('.sp-card,.sp-ov,#fbxMask')||el.textContent.trim().length<4)return;
    var b=btn('📘 臉書文圖',function(){open(entry(el));});
    if(is(el,GROUP)&&el.firstElementChild){b.classList.add('fbx-g');el.insertBefore(b,el.firstElementChild.nextSibling);}
    else el.appendChild(b);
  });
  $$('.sp-card .sp-b').forEach(function(bar){
    if(own(bar,'fbx-b'))return;
    var b=btn('📘 本頁臉書文圖',function(){var p=panelFor(bar);if(p)open(tabEntry(p));});
    b.style.cssText='margin:0;opacity:1';bar.appendChild(b);
  });
}
function init(){
  ui();decorate();
  var pend=false;
  new MutationObserver(function(){if(pend)return;pend=true;setTimeout(function(){pend=false;decorate();},90);}).observe(document.body,{childList:true,subtree:true});
}
if(document.readyState==='complete')setTimeout(init,60);
else window.addEventListener('load',function(){setTimeout(init,60);});
})();
</script>
