            <div id="dvcount" class="text">共 ${doubledVocabBank.length} 組</div>
            <div id="dvlist">`;
            html+=doubledVocabBank.map((x,i)=>`<div class="qcard dvrow"><b>${i+1}. ${x.word}｜${x.zh}</b><span class="badge">${x.theme}</span><br>
            <div class="text">延伸｜${x.related.map(r=>`${r[0]}＝${r[1]}`).join('　｜　')}</div></div>`).join('');
            html+='</div>';
            content.innerHTML=html;
            const input=document.getElementById('dvsearch');
            input.oninput=()=>{
                const q=input.value.trim().toLowerCase(); let n=0;
                document.querySelectorAll('.dvrow').forEach(el=>{const ok=!q||el.textContent.toLowerCase().includes(q);el.style.display=ok?'':'none';if(ok)n++;});
                document.getElementById('dvcount').textContent=`找到 ${n} 組`;
            };
        }

            };

        function renderMorph500(kind) {
            const content=document.getElementById('content');
            const sets={prefix:prefix500Data,root:root500Data,suffix:suffix500Data};
            const labels={prefix:'字首 Prefix',root:'字根 Root',suffix:'字尾 Suffix'};
            let data = kind==='all' ? [
              ...prefix500Data.map(x=>({...x,kind:'字首',unit:x.prefix})),
              ...root500Data.map(x=>({...x,kind:'字根',unit:x.root})),
              ...suffix500Data.map(x=>({...x,kind:'字尾',unit:x.suffix}))
            ] : sets[kind].map(x=>({...x,kind:labels[kind],unit:x[kind]}));
            content.innerHTML=`<div class="header">${kind==='all'?'構詞系統｜1500學習卡':labels[kind]+'｜500學習卡'}</div>
            <div class="key-point"><b>5倍量不是背500個孤立規則。</b><br>每張卡都用：構詞單位 → 核心意思 → 英文例字 → 中文 → 拆字預測。<br>
            SOP｜先拆字 → 猜方向 → 判詞性 → 放回句子 → 用上下文修正。</div>
            <input id="morph500q" placeholder="搜尋：un- / bio / -tion / 預測 / 生物..." style="width:100%;padding:12px;border:1px solid #bbb;border-radius:8px;margin:8px 0">
            <div class="text">共 <b id="morph500count">${data.length}</b> 張學習卡</div>
            <div id="morph500list">${data.map((x,i)=>`<div class="qcard morph500row"><b>${i+1}. ${x.unit}｜${x.meaning}</b><span class="badge">${x.kind}</span><br>
            <div class="text"><b>${x.word}</b>＝${x.zh}<br>拆解｜${x.unit} → ${x.meaning} → ${x.word} → ${x.zh}</div></div>`).join('')}</div>`;
            const q=document.getElementById('morph500q');
            q.oninput=()=>{const s=q.value.trim().toLowerCase();let n=0;document.querySelectorAll('.morph500row').forEach(el=>{const ok=!s||el.textContent.toLowerCase().includes(s);el.style.display=ok?'':'none';if(ok)n++;});document.getElementById('morph500count').textContent=n;};
        }

        function renderSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = '';
            menuStructure.forEach(section => {
                const h3 = document.createElement('h3');
                h3.textContent = section.title;
                sidebar.appendChild(h3);
                section.items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'menu-item';
                    div.textContent = item.name;
                    div.onclick = () => switchSection(item.id, div);
                    sidebar.appendChild(div);
                });
            });
        }

        function switchSection(id, element) {
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            element.classList.add('active');
            if (id === 'word-prefix-500') { renderMorph500('prefix');
            } else if (id === 'word-root-500') { renderMorph500('root');
            } else if (id === 'word-suffix-500') { renderMorph500('suffix');
            } else if (id === 'word-morph-all') { renderMorph500('all');
            } else if (id.startsWith('quiz5-')) { renderQuiz500(id.replace('quiz5-',''));
            } else if (id.startsWith('error-')) {
                renderErrorDetail(id.replace('error-', ''));
            } else if (id === 'vocab-double-zh') {
                renderDoubledVocabBank();
            } else if (id === 'vocab-3000-all') {
                renderVocab3000('all');
            } else if (id === 'vocab-3000-shape') {
                renderVocab3000('shape');
            } else if (id === 'vocab-3000-sound') {
                renderVocab3000('sound');
            } else if (id === 'vocab-3000-meaning') {
                renderVocab3000('meaning');
            } else if (id === 'vocab-3000-family') {
                renderVocab3000('family');
            } else if (id === 'vocab-confusables') {
                renderConfusables();
            } else if (id === 'vocab-family') {
                renderFamily();
            } else if (id === 'vocab-collocation') {
                renderCollocation();
            } else if (id === 'vocab-prep') {
                renderPrepBank();
            } else if (id === 'vocab-multimeaning') {
                renderMultimeaning();
            } else if (id === 'word-prefix-100') {
                renderPrefix();
            } else if (id === 'word-root-100') {
                renderRoot();
            } else if (id === 'word-suffix-100') {
                renderSuffix();
            } else if (id.startsWith('quiz-')) {
                renderQuiz(id.replace('quiz-part', ''));
            }
        }

                html += `<tr><td><strong>${item.word}</strong></td><td><div class="bilingual-cell"><span class="en">${item.m1.split(' ')[0]}</span><span class="zh">${item.m1.split(' ').slice(1).join(' ')}</span></div></td><td><div class="bilingual-cell"><span class="en">${item.m2.split(' ')[0]}</span><span class="zh">${item.m2.split(' ').slice(1).join(' ')}</span></div></td><td><div class="bilingual-cell"><span class="en">${item.m3.split(' ')[0]}</span><span class="zh">${item.m3.split(' ').slice(1).join(' ')}</span></div></td></tr>`;
            });
            html += '</table>';
            content.innerHTML = html;
        }

        function renderPrefix() {
            const content = document.getElementById('content');
            let html = '<div class="header">字首 Prefix (100個 - 雙語)</div><table><tr><th style="width:10%">#</th><th style="width:20%">Prefix</th><th style="width:35%">Example 例字</th><th style="width:35%">中文</th></tr>';
            prefixData.forEach((item, idx) => {
                const [en, zh] = item.ex.split('/');
                html += `<tr><td>${idx + 1}</td><td><strong>${item.prefix}</strong></td><td><span class="en">${en}</span></td><td><span class="zh">${zh}</span></td></tr>`;
            });
            html += '</table>';
            content.innerHTML = html;
        }

        function renderRoot() {
            const content = document.getElementById('content');
            let html = '<div class="header">字根 Root (100+個 - 雙語)</div><table><tr><th style="width:10%">#</th><th style="width:15%">Root</th><th style="width:37%">Example 例字</th><th style="width:38%">中文</th></tr>';
            rootData.forEach((item, idx) => {
                const [en, zh] = item.ex.split('/');

            });

        function renderSuffix() {
            const content = document.getElementById('content');
            let html = '<div class="header">字尾 Suffix (100個 - 雙語)</div><table><tr><th style="width:10%">#</th><th style="width:15%">Suffix</th><th style="width:37%">Example 例字</th><th style="width:38%">中文</th></tr>';
            suffixData.forEach((item, idx) => {
                const [en, zh] = item.ex.split('/');
                html += `<tr><td>${idx + 1}</td><td><strong>${item.suf}</strong></td><td><span class="en">${en}</span></td><td><span class="zh">${zh}</span></td></tr>`;
            });
            html += '</table>';
            content.innerHTML = html;
        }

        function renderQuiz(part) {
            const content = document.getElementById('content');
            const quizzes = generateQuizzes()[`part${part}`] || [];
            let html = `<div class="header">診斷測驗 - PART ${part}</div>`;
            quizzes.forEach(q => {
                html += `<div class="quiz-q"><div class="quiz-num">${q.n}. ${q.t}</div><div>${q.o.map(opt => `<div class="option">${opt}</div>`).join('')}</div><div class="key-point" style="margin-top: 8px;">💡 ${q.e}</div></div>`;
            });
            content.innerHTML = html;
        }

        init();
    </script>
