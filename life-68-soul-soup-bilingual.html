<style>

body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;line-height:1.75;-webkit-text-size-adjust:100%}

.empty{text-align:center;color:var(--muted);padding:40px 0}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 30px}
@media (max-width:520px){.grid,.pgrid{grid-template-columns:1fr}.row{grid-template-columns:72px 1fr}.seg button{padding:7px 9px}}

[`自我|Self`,`#c96f4a`],[`關係|Relationship`,`#d0788f`],[`情緒|Emotion`,`#8f78c4`],[`學習|Learning`,`#4f8fbf`],
[`決策|Decision`,`#3f9b8a`],[`資源|Resource`,`#c49a2e`],[`健康|Health`,`#6aa35a`],[`世界|World`,`#7a8794`]];
const LAB={w:`智慧|Wisdom`,st:`結構|Structure`,on:`舊→新|From → To`,nd:`節點|Key Moment`,lv:`槓桿|Gentle Lever`,lm:`限制|Honest Limit`,ab:`能力|You Gain`,q:`實作提問|Ask Yourself`,a:`最小行動|Tiny Step`};
// [cat, name, 智慧, 結構, 舊, 新, 節點, 槓桿, 限制, 能力, 實作提問, 最小行動]
const M=[
[0,`童年|Childhood`,`過去可以解釋你，但不必再控制你。|Your past can explain you — it no longer gets to control you.`,`小時候的經歷教會你一套保護自己的方法，它曾守護小小的你，如今仍會在某些時刻自動啟動。|Early experiences taught you a way to stay safe. It once protected the little you, and it still switches on by itself.`,`童年時有用的，現在一定也有用。|What worked in childhood must still work now.`,`溫柔地重新驗證：今天的我，也許有更好的方式。|Gently re-test it: today's you may have better ways.`,`那個讓你瞬間緊繃的觸發點。|The trigger that makes you tense up in an instant.`,`輕聲告訴自己：「現在不是以前了。」|Whisper to yourself: "Now is not then."`,`熟悉的感覺，常常被誤認為安全。|Familiar can easily be mistaken for safe.`,`看見自己的覺察力。|Self-awareness — the gift of seeing yourself.`,`我現在的反應，是此刻真的需要，還是以前為了生存學會的？如果今天的我已經擁有更多能力，還需要用同一種方式保護自己嗎？|Is this reaction what I need now, or a survival skill learned long ago? If today's me has more strength, do I still need to protect myself the same way?`,`寫下最近一個讓你反應很大的事件，再寫：「以前我需要＿＿保護自己；現在我可以改用＿＿。」|Write down a recent event that triggered you, then: "Back then I needed ___ to stay safe; now I can try ___."`],
[0,`依附|Attachment`,`愛不是抓住，而是在連結中，依然保有自己。|Love isn't holding on tight — it's staying yourself while staying connected.`,`當你靠近一個人，心會先預測安不安全，再決定你如何依附。|When you draw close to someone, your heart predicts whether it's safe, and that shapes how you attach.`,`害怕失去，所以緊緊抓住。|Afraid of losing, so holding on tight.`,`能親近，也能獨立。|Able to be close, and able to stand alone.`,`分離時湧上的焦慮。|The anxiety that rises when you're apart.`,`把安全感種在自己心裡。|Plant your sense of safety inside yourself.`,`很容易把「需要」誤認成「愛」。|It's easy to mistake need for love.`,`穩定而溫暖的連結。|Steady, warm connection.`,`我是真的需要這個人，還是害怕失去帶來的不安全感？如果對方暫時離開，我能不能依然好好照顧自己？|Do I truly need this person, or do I fear the insecurity of losing them? If they step away for a while, can I still take good care of myself?`,`焦慮時先別急著聯絡對方，給自己10分鐘，做一件能讓自己安定下來的事。|When anxious, don't reach out right away. Give yourself 10 minutes to do one thing that settles you.`],
[0,`身份|Identity`,`身份是一個模型，不是一座牢籠。|Your identity is a model, not a cage.`,`經驗變成標籤，標籤決定「我是誰」，也悄悄畫出你敢走的範圍。|Experiences become labels; labels decide "who I am" and quietly draw the borders of where you dare to go.`,`我就是這樣的人。|This is just who I am.`,`我是「目前」這個版本，而我還在更新。|I'm the current version — and I'm still updating.`,`你貼在自己身上的標籤。|The labels you stick on yourself.`,`在句子裡加上「目前」兩個字。|Add the word "currently" to the sentence.`,`身份會本能地抗拒反證。|Identity instinctively resists counter-evidence.`,`柔軟而有彈性的自我。|A flexible, resilient sense of self.`,`當我說「我就是這種人」，有什麼證據？這是永久的身份，還是目前的版本？|When I say "I'm just this kind of person," what's the evidence? Is it a permanent identity, or just the current version?`,`把「我就是＿＿的人」改寫成「我目前還不擅長＿＿」。|Rewrite "I'm just a ___ person" as "I'm currently not yet good at ___."`],
[0,`自我價值|Self-Worth`,`結果可以被評價，但你不必被一次結果定義。|An outcome can be judged — but you are not defined by a single outcome.`,`外在的成績，常被拿來為自己打分，再決定你今天的心情。|External results often become your self-score, which then decides your mood.`,`表現好，我才有價值。|I'm worthy only when I perform well.`,`表現只是回饋，不是我的價值。|Performance is feedback, not my worth.`,`你的價值感從哪裡來。|Where your sense of worth comes from.`,`把「結果」和「我是誰」分開。|Separate the result from who you are.`,`社會比較不會完全消失，也不必完全消失。|Social comparison never fully disappears — and it doesn't have to.`,`穩定的自尊。|Steady self-esteem.`,`如果今天沒有人稱讚我，我是否仍然知道自己的價值？我能不能把「這件事沒做好」和「我不好」分開？|If no one praises me today, do I still know my worth? Can I separate "this didn't go well" from "I'm not good"?`,`今天記下一件「沒有人看到，但我仍然做得不錯」的事。|Today, note one thing you did well that no one saw.`],
[0,`信念|Belief`,`最危險的信念，是你不知道自己正在相信它。|The most dangerous belief is the one you don't know you're holding.`,`經驗形成假設，假設決定你注意什麼，而你注意到的，又回頭強化了信念。|Experience forms assumptions, assumptions steer your attention, and what you notice reinforces the belief.`,`我相信的就是真相。|What I believe is the truth.`,`信念是一個可以被測試的假設。|A belief is a hypothesis I can test.`,`藏在心底的那個假設。|The assumption hidden deep inside.`,`溫柔地尋找一個反例。|Gently look for one counter-example.`,`確認偏誤會讓你只看見想看的。|Confirmation bias shows you only what you want to see.`,`讓想法持續更新的能力。|The ability to keep your thinking updated.`,`我現在相信的，是事實還是假設？什麼證據出現，我願意承認自己的信念需要更新？|Is what I believe a fact or an assumption? What evidence would make me willing to update it?`,`找一個支持自己信念的證據，再勇敢地找一個反例。|Find one piece of evidence for your belief — then bravely find one against it.`],
[0,`敘事|Narrative`,`你無法改寫發生過的事，但可以收回它對未來的控制權。|You can't rewrite what happened, but you can take back its power over your future.`,`事件發生後，你挑選記憶、編成故事，故事又慢慢變成了你。|After events, you select memories and weave a story — and the story slowly becomes you.`,`我是受害者，我是失敗者。|I'm a victim; I'm a failure.`,`這件事給了我什麼資訊？|What information did this event give me?`,`你如何解釋這個故事。|How you interpret the story.`,`重新敘說，讓故事更完整。|Retell it, more completely.`,`重新敘事不是否認真實的傷害。|Retelling never means denying real hurt.`,`在傷痕中重新找到意義。|Finding meaning again within the scars.`,`我一直怎麼講這段人生故事？在不否認事實的前提下，還有沒有另一種更完整的解釋？|How have I been telling this story of my life? Without denying the facts, is there a fuller explanation?`,`在「這件事害了我」後面，多補一句：「但它也讓我學會＿＿。」|After "this hurt me," add: "but it also taught me ___."`],
[0,`安全感|Security`,`安全不是沒有未知，而是你有能力面對未知。|Safety isn't the absence of the unknown — it's knowing you can handle it.`,`面對未知，大腦預測威脅，於是啟動防衛。|Facing the unknown, your mind predicts threat and raises its defenses.`,`未知就是危險。|Unknown means danger.`,`未知只是還沒取得的資訊。|Unknown is simply information not yet gathered.`,`不確定的那一刻。|The moment of uncertainty.`,`小小地、安全地探索一步。|Take one small, safe step of exploration.`,`真正的危險，仍然值得你好好防禦。|Real danger still deserves real protection.`,`容納不確定的從容。|The calm to hold uncertainty.`,`我現在是真的有危險，還是只是不知道接下來會怎樣？我需要的是逃開，還是取得更多資訊？|Am I really in danger, or just not knowing what's next? Do I need to escape, or to learn more?`,`別再繼續想像，直接取得一項能降低未知的資訊。|Stop imagining — go get one piece of information that shrinks the unknown.`],
[0,`控制|Control`,`力量不是控制世界，而是有效地介入世界。|Agency isn't controlling the world — it's stepping into it effectively.`,`事情發生，控制的需要升起，你便想插手。|Something happens, the urge to control rises, and you want to step in.`,`我要控制所有結果。|I must control every outcome.`,`找到真正能動的那個變數。|Find the one variable you can actually move.`,`可控與不可控之間的那條線。|The line between what you can and can't control.`,`只動你能動的。|Move only what's yours to move.`,`結果通常由許多因素共同決定。|Outcomes usually have many causes.`,`恰到好處的掌控感。|A well-calibrated sense of control.`,`這件事哪些是我能控制的？哪些不是？今天最值得改變的一個變數是什麼？|What here can I control? What can't I? Which one variable is most worth changing today?`,`畫兩欄「可控／不可控」，今天只處理可控欄的第一項。|Draw two columns — "can control / can't" — and today handle only the first item in the first column.`],
[0,`完美|Perfectionism`,`完成第一版，才會有第二版。|Only a finished first draft makes a second one possible.`,`高標準帶來害怕犯錯，害怕讓你一再延後出發。|High standards breed fear of mistakes, and fear keeps delaying your start.`,`要完美才能開始。|Start only when it's perfect.`,`先做，再慢慢變好。|Start now, improve as you go.`,`開始的那道門檻。|The threshold of starting.`,`最小可行的一步。|The minimum viable action.`,`高風險的工作，仍然需要高標準。|High-stakes work still deserves high standards.`,`一次次迭代的勇氣。|The courage to iterate.`,`我是不是因為怕做不好，所以乾脆不開始？現在可以完成的60分版本是什麼？|Am I not starting because I fear doing it badly? What's the 60-point version I can finish now?`,`做一個60分版本，限時10分鐘完成第一版。|Make a 60% version — finish the first draft in 10 minutes.`],
[0,`比較|Comparison`,`比較最美的用途不是排名，而是發現方法。|The best use of comparison isn't ranking — it's discovering strategies.`,`看見別人的表現，你換算出自己的位置，再給自己打分。|Seeing others perform, you calculate your place and grade yourself.`,`他很強，代表我很差。|They're strong, so I'm weak.`,`他很強，代表有值得學的資料。|They're strong, so there's data to learn from.`,`比較之後，你怎麼解釋。|How you interpret after comparing.`,`問一句：「他做對了什麼？」|Ask: "What are they doing right?"`,`你看到的比較樣本，可能已經失真。|What you compare against may be distorted.`,`向標竿學習的能力。|The skill of benchmarking.`,`看到比我強的人，我是在否定自己，還是在取得資料？他有哪些方法值得我直接學？|When I see someone better, am I rejecting myself or gathering data? Which of their methods can I learn directly?`,`選一個比你強的人，只偷學他一個具體方法。|Pick someone ahead of you and borrow just one specific method.`],

[1,`關係|Relationships`,`熟悉，不等於適合。|Familiar doesn't mean right for you.`,`內心的需求決定你選擇誰，互動再帶來回饋。|Your needs shape whom you choose; interaction brings the feedback.`,`被喜歡最重要。|Being liked matters most.`,`適配、互惠、尊重更重要。|Fit, reciprocity and respect matter more.`,`你選人的標準。|Your criteria for choosing people.`,`看長期的行為，而不只是話語。|Watch long-term actions, not just words.`,`人是會改變的。|People change.`,`看清關係的判斷力。|Clear judgment in relationships.`,`這段關係長期讓彼此變得更好，還是持續消耗？我要看對方說了什麼，還是長期做了什麼？|Does this relationship make us both better over time, or keep draining us? Should I watch what they say, or what they do over time?`,`寫下最近三次互動後自己的狀態：＋、0、－。|Record how you felt after the last three interactions: +, 0, or −.`],
[1,`界線|Boundaries`,`健康的關係，需要清楚而溫柔的邊界。|Healthy relationships need clear, kind boundaries.`,`面對一個需求，你判斷責任歸誰，再決定接受或拒絕。|Facing a request, you decide whose responsibility it is, then accept or decline.`,`拒絕就是自私。|Saying no is selfish.`,`界線，是讓責任清清楚楚。|A boundary makes responsibility clear.`,`責任的邊界。|The edge of responsibility.`,`分清「我的、你的、我們共同的」。|Sort out "mine, yours, ours."`,`界線不是用來控制別人的。|Boundaries aren't for controlling others.`,`守護自己的界線感。|The ability to hold your boundaries.`,`這件事到底是我的責任、對方的責任，還是共同的責任？如果我不自動補位，真正該負責的是誰？|Is this mine, theirs, or shared? If I don't automatically step in, who should truly own it?`,`今天遇到想立刻補位的事，先停10分鐘，確認責任歸屬。|Today, when you want to jump in, pause 10 minutes and clarify who owns it.`],
[1,`衝突|Conflict`,`衝突，揭露的是系統裡需要調整的地方。|Conflict reveals where the system is out of tune.`,`差異出現，被解讀成威脅，於是開始攻與防。|A difference appears, gets read as a threat, and attack and defense begin.`,`衝突就是要分出誰對誰錯。|Conflict is about who's wrong.`,`衝突是關於差異的珍貴資訊。|Conflict is precious information about differences.`,`你如何解讀對方。|How you interpret what's happening.`,`先找出彼此真正的需要。|First, find each other's real needs.`,`不是所有衝突都能協商。|Not every conflict can be negotiated.`,`協商與和解的能力。|The ability to negotiate.`,`我們真正不同的是立場、需要、資訊，還是利益？這次衝突正在暴露哪個系統問題？|Do we differ in positions, needs, information, or interests? What system problem is this conflict revealing?`,`把「你怎麼可以……」改成「我需要的是＿＿，你需要的是＿＿。」|Change "How could you…" into "What I need is ___; what you need is ___."`],
[1,`家庭|Family`,`家不能只靠愛，也需要好的制度。|A family can't run on love alone — it also needs good structure.`,`角色、責任、資源與互動，一起織成家的循環。|Roles, responsibilities, resources and interactions weave the family's cycle.`,`家人就應該……|Family should just…`,`每個人都是獨立的系統，一起協作。|Each person is their own system, collaborating together.`,`角色與分工。|Roles and division of labor.`,`把責任說得具體。|Make responsibilities concrete.`,`歷史上的角色，黏性很高。|Old family roles are sticky.`,`經營家庭的智慧。|The wisdom to govern a home.`,`家裡是不是一直靠某一個人過度付出才能運作？哪一項責任最需要重新分配？|Does our home run only because one person over-gives? Which responsibility most needs redistributing?`,`列出一項反覆發生的家務，指定「事情＋負責人＋頻率」。|List one recurring chore and assign "task + owner + frequency."`],
[1,`父母|Parent`,`好的父母，最後會讓孩子越來越不需要依賴父母做決定。|Good parents gradually make their children less reliant on parents' decisions.`,`因為愛，所以擔心；因為擔心，所以介入孩子的決定。|Love brings worry; worry leads to stepping into the child's decisions.`,`替孩子選。|Choose for the child.`,`教孩子怎麼選。|Teach the child how to choose.`,`決定權在誰手上。|Who owns the decision.`,`用提問，代替答案。|Replace answers with questions.`,`攸關安全的重大事件，仍需要你出手。|Serious safety matters still need you to step in.`,`讓孩子長出力量。|Empowering your child.`,`我現在是在幫孩子思考，還是替孩子決定？我可以少給一個答案、多問哪一個問題？|Am I helping my child think, or deciding for them? Which question can I ask instead of giving one answer?`,`今天孩子問問題時，少給一個答案，多問一句：「妳覺得有哪些選擇？」|When your child asks today, give one less answer and ask: "What choices do you see?"`],
[1,`教養|Upbringing`,`保護孩子最好的方式之一，是增加他修正錯誤的能力。|One of the best ways to protect a child is to grow their ability to fix mistakes.`,`孩子犯錯，父母的反應決定孩子學到什麼。|A child errs; the parent's response shapes what the child learns.`,`避免孩子犯錯。|Prevent the child from making mistakes.`,`讓孩子犯可以修正的錯。|Let the child make mistakes that can be fixed.`,`錯誤的代價。|The cost of the mistake.`,`安全的試錯空間。|A safe space to try and fail.`,`不可逆的高風險，不能拿來試。|Irreversible, high-risk things are not for experiments.`,`自主學習的能力。|Self-directed learning.`,`這個錯誤真的不能發生嗎？還是它其實是一次低成本的學習機會？|Must this mistake truly be prevented, or is it a low-cost chance to learn?`,`選一件低風險的事，讓孩子自己決定並承擔結果。|Pick one low-risk matter and let the child decide and own the outcome.`],
[1,`愛|Love`,`真正的愛，讓彼此更有能力，而不是更加依賴。|True love grows each other's strength, not each other's dependence.`,`需要引發付出，付出帶著期待，期待影響互動。|Need leads to giving, giving carries expectation, expectation shapes interaction.`,`愛就是犧牲，或是控制。|Love means sacrifice, or control.`,`愛是支持、自主與互惠。|Love is support, autonomy and reciprocity.`,`你付出的目的。|The purpose behind your giving.`,`尊重對方的選擇權。|Respect their right to choose.`,`愛不能取代責任。|Love can't replace responsibility.`,`成熟的親密。|Mature intimacy.`,`我現在的付出，是讓對方能力增加，還是依賴增加？如果沒有控制與犧牲，我還能怎麼表達愛？|Is my giving increasing their ability or their dependence? Without control or sacrifice, how else can I express love?`,`今天少替對方完成一件事，改成陪他自己完成。|Today, do one less thing for them — and do it alongside them instead.`],
[1,`責任|Responsibility`,`過度負責，也可能讓別人失去負責的機會。|Over-responsibility can take away someone else's chance to be responsible.`,`事情發生，你判定責任，然後承擔。|Something happens, you assign responsibility, and you carry it.`,`看到問題就接手。|See a problem, take it over.`,`先確認這是誰的責任。|First confirm whose it is.`,`誰擁有這件事。|Who owns this.`,`停止自動補位。|Stop automatically filling the gap.`,`緊急時刻，可能還是得先處理。|In emergencies, you may still need to act first.`,`恰當配置責任。|Allocating responsibility well.`,`如果我不接手，這件事原本該由誰承擔？我是在負責，還是在過度負責？|If I don't take it on, who should? Am I being responsible, or over-responsible?`,`今天拒絕一次不屬於你的自動補位。|Today, decline one automatic rescue that isn't yours.`],
[1,`助人|Helping`,`最好的幫助，會讓對方越來越不需要幫助者。|The best help makes the helper less and less needed.`,`他人的問題，遇見你的介入，改變了對方的能力。|Someone's problem meets your help, and their ability changes.`,`替他解決。|Solve it for them.`,`讓他更能自己解決。|Help them solve it themselves.`,`你介入的方式。|How you step in.`,`給工具、方法與回饋。|Offer tools, methods and feedback.`,`對方必須願意參與。|They must be willing to take part.`,`賦能他人。|Empowering others.`,`我是在替他解決問題，還是在增加他解決問題的能力？我可以提供什麼工具，而不是直接給答案？|Am I solving it for them, or growing their ability? What tool could I offer instead of the answer?`,`對方求助時，先問：「你已經試過哪兩個方法？」|When someone asks for help, first ask: "Which two things have you already tried?"`],
[1,`社會|Society`,`不盲從，也不為反對而反對。|Don't follow blindly — and don't oppose just to oppose.`,`群體規範帶來從眾壓力，推動你的行動。|Group norms create pressure to conform, driving your actions.`,`大家都這樣，所以我也應該這樣。|Everyone does it, so I should too.`,`理解規則之後，自主選擇。|Understand the rules, then choose freely.`,`群體的壓力。|Group pressure.`,`問自己：「如果沒人看見，我還會這樣選嗎？」|Ask: "If no one were watching, would I still choose this?"`,`社會規範也有真實的代價。|Social norms carry real costs.`,`獨立判斷。|Independent judgment.`,`如果沒有人知道我的選擇，我還會這樣做嗎？我是理解規則後選擇遵守，還是只是怕和別人不一樣？|If no one knew my choice, would I still make it? Do I follow because I understand, or because I fear being different?`,`今天做一個符合自己價值、而不是為了被認同的小選擇。|Today, make one small choice that fits your values, not your need for approval.`],

[2,`情緒|Emotion`,`感受需要被聽見，但不一定要被服從。|Feelings deserve to be heard — not necessarily obeyed.`,`事件引發預測，預測帶來身體與情緒的變化，情緒催促你行動。|Events trigger predictions, predictions stir body and emotion, and emotion urges action.`,`感覺就是命令。|A feeling is a command.`,`感覺是一個訊號。|A feeling is a signal.`,`想要立刻行動的衝動。|The urge to act right now.`,`暫停一下。|Pause.`,`情緒無法被完全理性化。|Emotions can't be fully rationalized.`,`調節情緒的能力。|Emotional regulation.`,`我現在感受到什麼？這份情緒正在傳遞什麼訊號？我需要聽見它，還是立刻服從它？|What am I feeling? What signal is it sending? Do I need to hear it, or obey it right now?`,`情緒升高時先命名：「我現在是＿＿，它可能在提醒我＿＿。」再決定行動。|When emotions rise, name it: "I'm feeling ___; it may be reminding me of ___." Then decide.`],
[2,`焦慮|Anxiety`,`焦慮可以提醒你去查證，但不能替你下判決。|Anxiety can remind you to check — it can't deliver the verdict.`,`不確定引發最壞的預測，讓你進入警戒。|Uncertainty triggers worst-case predictions and puts you on alert.`,`焦慮代表危險即將發生。|Anxiety means danger is coming.`,`焦慮是大腦的威脅預測。|Anxiety is my brain's threat prediction.`,`腦中那個最壞的劇本。|The worst-case script in your head.`,`把「事實」和「預測」分開。|Separate facts from predictions.`,`有些焦慮，確實對應真實的風險。|Some anxiety does point to real risk.`,`辨識風險的能力。|Risk awareness.`,`我的大腦現在正在預測什麼最壞的結果？這是事實，還是威脅預測？|What worst case is my brain predicting? Is it a fact, or a threat prediction?`,`寫兩行：「我擔心＿＿會發生／目前真正已經發生的是＿＿。」|Write two lines: "I'm worried ___ will happen / What has actually happened is ___."`],
[2,`失敗|Failure`,`失敗最珍貴的部分，是它帶來的誤差資訊。|The most precious part of failure is the error information it brings.`,`結果不如預期，你開始解釋自己。|When results fall short, you start explaining yourself.`,`失敗代表我不行。|Failure means I'm not good enough.`,`失敗代表模型需要調整。|Failure means my model doesn't fit yet.`,`你把原因歸到哪裡。|Where you place the cause.`,`問：「哪裡預測錯了？」|Ask: "Where did my prediction go wrong?"`,`失敗仍然有真實的代價。|Failure still has real costs.`,`重新站起來的韌性。|Resilience.`,`這次到底是哪件事失敗，而不是「我這個人失敗」？這個結果暴露了哪一個模型的錯誤？|What exactly failed — not "me as a person"? Which model error did this reveal?`,`把「我不行」改寫成「這次＿＿方法沒有得到預期結果」。|Rewrite "I can't" as "This time, the ___ method didn't get the expected result."`],
[2,`錯誤|Mistakes`,`錯誤不可怕，不更新才昂貴。|Mistakes aren't scary — not updating is what's costly.`,`你預測，現實給出結果，兩者之間出現落差。|You predict, reality answers, and a gap appears.`,`錯誤要藏起來。|Hide the mistake.`,`錯誤要拿出來分析。|Bring the mistake into the light and study it.`,`預測與現實的落差。|The gap between prediction and reality.`,`寫一本錯誤日誌。|Keep an error log.`,`同樣的錯誤，不能無限重複。|The same mistake can't repeat forever.`,`快速學習。|Fast learning.`,`我原本預測什麼？實際發生了什麼？兩者的差異可以教我什麼？|What did I predict? What actually happened? What can the difference teach me?`,`記一筆錯誤日誌：預測＿＿／結果＿＿／下次修改＿＿。|Log one error: predicted ___ / got ___ / next time I'll change ___.`],
[2,`壓力|Stress`,`不是所有壓力都要消除，而是要校準負荷。|Not all stress must go — it's about calibrating the load.`,`面對要求，你評估自己的資源，壓力反應隨之而來。|Facing demands, you assess your resources, and stress responds.`,`壓力是敵人。|Stress is the enemy.`,`壓力是負荷的訊號。|Stress is a signal of load.`,`要求與能力之間的差距。|The gap between demand and capacity.`,`減少負荷，或增加能力。|Lower the load or raise the capacity.`,`長期過載會傷害身心功能。|Chronic overload harms how you function.`,`管理負荷的能力。|Load management.`,`現在是要求太高，還是我的能力不足？我要降低哪個負荷，或增加哪個能力？|Is the demand too high, or my capacity too low? Which load can I lower, or which capacity can I raise?`,`今天只做一件事：刪除一項負荷，或增加一項支援。|Today, do just one thing: remove one load or add one support.`],
[2,`痛苦|Pain`,`痛苦本身不是老師，反思與更新才讓學習發生。|Pain itself isn't the teacher — reflection and updating are what bring learning.`,`失去或威脅帶來痛苦，你在痛苦中建構意義。|Loss or threat brings pain, and within it you build meaning.`,`痛苦必須立刻消滅。|Pain must be eliminated at once.`,`先辨認它帶來的訊息與需要。|First, recognize the message and need it carries.`,`痛苦的來源。|The source of the pain.`,`分清可以改變的與不能改變的。|Separate what can change from what can't.`,`痛苦不必被浪漫化。|Pain doesn't need to be romanticized.`,`承受並調整的力量。|The strength to endure and adjust.`,`這份痛苦正在告訴我失去了什麼、需要什麼、不能接受什麼？其中哪些可以改變？哪些需要接受？|What is this pain telling me I lost, need, or can't accept? What can change, and what must be accepted?`,`寫下：「我現在痛苦，是因為我失去／需要／害怕＿＿。」|Write: "I hurt right now because I lost / need / fear ___."`],
[2,`幸福|Happiness`,`幸福更像動態的平衡，而不是永遠的高潮。|Happiness is a dynamic balance, not a permanent high.`,`需要帶來體驗，你適應之後，又再度追求。|Needs bring experiences; you adapt, and chase again.`,`越多越幸福。|More means happier.`,`平衡、關係、意義、投入與恢復。|Balance, relationships, meaning, engagement and rest.`,`你真正的需要。|Your real needs.`,`減少無效的追逐。|Reduce the pointless chasing.`,`幸福不是一種固定狀態。|Happiness isn't a fixed state.`,`調節生活的智慧。|The art of tuning your life.`,`我一直在追求更多，但它真的讓生活更好嗎？什麼狀態能讓我的生活更穩定、投入、有意義？|I keep chasing more — does it really make life better? What state would make my life steadier, more engaged, more meaningful?`,`今天增加一件真正讓你恢復的活動，同時減少一件無意識的消耗。|Today, add one truly restoring activity and cut one mindless drain.`],
[2,`不確定性|Uncertainty`,`成熟不是知道全部，而是在不知道全部時，仍能前進。|Maturity isn't knowing everything — it's moving forward without knowing everything.`,`未知形成預測的缺口，缺口帶來焦慮。|The unknown leaves a gap in prediction, and the gap breeds anxiety.`,`不知道就是危險。|Not knowing is dangerous.`,`不知道只是資訊的缺口。|Not knowing is just an information gap.`,`未知本身。|The unknown itself.`,`輕輕地試探一下。|Send a small probe.`,`資訊永遠不會完整。|Information will never be complete.`,`在不確定中做決定。|Deciding under uncertainty.`,`我是真的沒有答案，還是資訊還不夠？下一個最便宜的試探是什麼？|Do I truly have no answer, or just not enough information? What's the cheapest next probe?`,`找一個人、查一份資料或做一次小測試，只補一個資訊缺口。|Ask one person, check one source, or run one small test — fill just one gap.`],
[2,`堅持|Persistence`,`堅持目標，不必迷信同一種方法。|Stay loyal to the goal, not to one strategy.`,`目標帶來投入，投入換來回饋，回饋決定你繼續或調整。|Goals invite effort, effort brings feedback, and feedback decides whether you continue or adjust.`,`永不放棄。|Never give up.`,`讓證據決定是否繼續。|Let evidence decide whether to continue.`,`回饋。|Feedback.`,`事先設定檢視點。|Set review points in advance.`,`太快退出，會錯過複利。|Quitting too soon forfeits compounding.`,`有策略的毅力。|Strategic grit.`,`我是在堅持目標，還是在固守已經失效的方法？什麼回饋出現，我就應該調整？|Am I committed to the goal, or clinging to a failed strategy? What feedback would tell me to adjust?`,`保留目標，只更換一個方法，測試一週。|Keep the goal; change one method and test it for a week.`],
[2,`退出|Letting Go`,`懂得開始很重要，懂得停止同樣重要。|Knowing how to start matters; knowing how to stop matters just as much.`,`投入、回報、替代方案與退出成本，一起決定去留。|Investment, return, alternatives and exit costs decide whether to stay.`,`退出就是失敗。|Quitting is failure.`,`退出可能是資源的重新配置。|Quitting can be a reallocation of resources.`,`未來的價值。|Future value.`,`問：「如果今天重新選，我還會加入嗎？」|Ask: "If I chose again today, would I still join?"`,`別把逃避包裝成更新。|Don't disguise avoidance as updating.`,`懂得停損。|Knowing when to cut losses.`,`如果今天完全沒有過去的投入，我還會選擇加入嗎？退出是在逃避短期的不舒服，還是在重新配置資源？|Without any past investment, would I still choose this? Is leaving an escape from short-term discomfort, or a reallocation?`,`設定一個明確的檢視日與停止規則，在那天之前只收集資料。|Set a clear review date and stop rule; until then, just gather data.`],

[3,`學習|Learning`,`學習不在於讀了多少，而在於能提取多少。|Learning isn't how much you take in — it's how much you can pull back out.`,`輸入、編碼、提取、回饋、遷移，一步步把知識變成你的。|Input, encoding, retrieval, feedback and transfer turn knowledge into yours.`,`讀很久就是會了。|Studying long means I know it.`,`能提取、能應用，才是真的會。|Only when I can recall and apply it do I know it.`,`提取的那一刻。|The moment of retrieval.`,`考考自己。|Quiz yourself.`,`測驗的品質，會影響回饋的品質。|The quality of the test shapes the quality of feedback.`,`真正有效的學習。|Effective learning.`,`我是真的會了，還是只是看起來很熟？不看答案，我能不能自己說出來、寫出來、做出來？|Do I truly know it, or does it just look familiar? Without the answer, can I say it, write it, do it?`,`闔上書，用3分鐘寫出剛剛學到的內容。|Close the book and write what you just learned in 3 minutes.`],
[3,`智力|Intelligence`,`別用一個總標籤，遮住那些可以被訓練的小能力。|Don't let one big label hide the small skills you can train.`,`天生差異、技能、策略與練習，共同構成你的能力。|Innate differences, skills, strategies and practice together make your ability.`,`我不聰明。|I'm not smart.`,`是哪一個子能力還不足？|Which sub-skill is still lacking?`,`把能力拆開來看。|Breaking skills down.`,`拆解能力。|Decompose the skill.`,`個體差異確實存在。|Individual differences are real.`,`一塊塊建構能力。|Building ability piece by piece.`,`不要說「我不會」，我到底是哪個子能力不會？這個能力可以拆成哪三個小技能？|Instead of "I can't," which sub-skill am I missing? What three small skills make it up?`,`把「我不會」拆成3個小技能，今天只練第一個。|Break "I can't" into 3 small skills and practice only the first today.`],
[3,`記憶|Memory`,`想得起來，比看起來很熟更重要。|Being able to recall matters more than feeling familiar.`,`編碼、鞏固、提取，然後遺忘，是記憶的自然旅程。|Encoding, consolidating, retrieving and forgetting — memory's natural journey.`,`一再重讀。|Rereading again and again.`,`主動提取，加上間隔複習。|Active recall plus spaced review.`,`提取。|Retrieval.`,`拉開複習的間隔。|Spacing.`,`理解不足時，光靠背誦不夠。|Without understanding, memorizing isn't enough.`,`長期的記憶。|Long-term memory.`,`如果現在把書闔起來，我能回想多少？下一次應該隔多久再回想？|If I close the book now, how much can I recall? When should I recall it next?`,`讀完一頁，立刻闔上書，回想5個重點。|After one page, close the book and recall 5 key points.`],
[3,`注意力|Attention`,`別一直要求意志力，去做環境設計就能完成的工作。|Don't keep asking willpower to do what environment design can do.`,`目標與各種刺激競爭，決定你的注意力流向。|Goals compete with stimuli to decide where your attention flows.`,`靠忍耐來專心。|Focus by forcing it.`,`設計環境。|Design the environment.`,`干擾的入口。|The doorway of distraction.`,`移除高誘惑的刺激。|Remove the most tempting triggers.`,`注意力本身是有限的。|Attention itself is limited.`,`管理專注力。|Managing focus.`,`什麼東西一直偷走我的注意力？我能不能直接改變環境，而不是一直逼自己忍耐？|What keeps stealing my attention? Can I change the environment instead of forcing myself to endure?`,`開始工作前，把最大的干擾源移出視線25分鐘。|Before working, move your biggest distraction out of sight for 25 minutes.`],
[3,`知識|Knowledge`,`孤立的資訊不是智慧，關係才形成模型。|Isolated facts aren't wisdom — connections form a model.`,`事實連成關係，關係組成框架，框架讓知識可以遷移。|Facts connect into relations, relations form schemas, and schemas let knowledge transfer.`,`知道很多。|Knowing a lot.`,`能連結、能遷移。|Connecting and transferring.`,`知識之間的關係。|The relationships between ideas.`,`用自己的話解釋，或教給別人。|Explain it in your own words, or teach it.`,`錯誤的框架會放大錯誤。|A wrong schema amplifies errors.`,`讓知識長出結構。|Structured knowledge.`,`這個知識和我已經知道的什麼有關？我能不能用自己的話教給別人？|How does this connect to what I already know? Can I teach it in my own words?`,`選一個概念，用自己的話講60秒。|Pick one concept and explain it in your own words for 60 seconds.`],
[3,`AI|AI`,`AI最美好的角色不是神諭，而是陪你推演的夥伴。|AI's best role isn't an oracle — it's a partner for thinking things through.`,`你的目標化為提問，AI給出回應，你驗證後再整合。|Your goal becomes a prompt, AI responds, and you verify and integrate.`,`讓AI替我想。|Let AI think for me.`,`讓AI擴大我的探索與回饋。|Let AI widen my exploration and feedback.`,`驗證。|Verification.`,`請AI產生反例與測試。|Ask AI for counter-examples and tests.`,`AI會出錯，也不能取代你的責任。|AI makes mistakes and can't replace your responsibility.`,`思考的槓桿。|Cognitive leverage.`,`我是在讓AI替我完成，還是讓AI幫我看見更多可能？AI的答案，我驗證了嗎？|Am I letting AI do it for me, or helping me see more possibilities? Have I verified its answer?`,`先自己回答，再請AI找漏洞、反例與改進點。|Answer first yourself, then ask AI for gaps, counter-examples and improvements.`],
[3,`教育|Education`,`教育的終點，是學生慢慢能教自己。|The end of education is when students can teach themselves.`,`目標引導學習活動，測量帶來回饋。|Goals guide learning activities; measurement brings feedback.`,`老師教完，學生就學會了。|Taught means learned.`,`學生能獨立完成，才算真正掌握。|Mastery is when students can do it on their own.`,`學生的產出。|The student's output.`,`換題再測。|Retest with a new problem.`,`考試無法測量所有能力。|Tests can't measure everything.`,`一套學習的作業系統。|A learning operating system.`,`學生是真的學會，還是老師只是教完？如果現在換一道題，他能獨立完成嗎？|Did the student really learn, or did the teacher just finish teaching? With a new problem, can they do it alone?`,`教完後立刻換一道新題，讓學生不看答案獨立完成。|Right after teaching, give a new problem to solve without looking at answers.`],
[3,`成長|Growth`,`成長，就是更快發現自己錯在哪裡，並溫柔地修正。|Growth is finding where you're wrong faster — and gently correcting it.`,`挑戰帶來錯誤，錯誤帶來回饋，回饋帶來更新與能力。|Challenges bring errors, errors bring feedback, feedback brings updates and ability.`,`看起來更強。|Looking stronger.`,`模型更準，能力更廣。|A more accurate model, a broader ability.`,`更新的速度。|The speed of updating.`,`縮短回饋的距離。|Shorten the feedback loop.`,`不是所有東西都能快速改善。|Not everything improves quickly.`,`自我進化。|Self-evolution.`,`最近哪一個預測誤差讓我真正更新了？三個月前做不到、現在做得到的是什麼？|Which recent prediction error truly updated me? What can I do now that I couldn't three months ago?`,`每天記一條：「今天的預測誤差→明天我改＿＿。」|Each day, note: "Today's prediction error → tomorrow I'll change ___."`],

[4,`決策|Decision`,`好的決定不保證好結果，但會保留修正的能力。|A good decision doesn't guarantee a good outcome, but it keeps the power to correct.`,`目標、選項、證據，帶來決定與結果。|Goals, options and evidence lead to decisions and outcomes.`,`一次就要選對。|Get it right the first time.`,`持續校準。|Keep calibrating.`,`檢視點。|The review point.`,`允許自己更新。|Allow yourself to update.`,`有些決定是不可逆的。|Some decisions are irreversible.`,`動態決策。|Dynamic decision-making.`,`我是不是一直想找到「絕對不會錯」的決定？這個決定未來能不能根據新證據更新？|Am I searching for a decision that can never be wrong? Can this decision be updated with new evidence later?`,`為現在的選擇設一個檢視日，而不是要求它永遠正確。|Set a review date for your current choice instead of demanding it be right forever.`],
[4,`選擇|Choice`,`很多內耗，來自假的二選一。|Much inner struggle comes from a false either-or.`,`選項、標準、取捨，最後成為選擇。|Options, criteria and trade-offs become a choice.`,`只有唯一正解。|There's only one right answer.`,`比較多個選項。|Compare many options.`,`選項本身。|The options themselves.`,`多想一個第三選項。|Add a third option.`,`選項太多，也會增加成本。|Too many options add cost too.`,`設計方案的能力。|Designing options.`,`我是不是把自己困在A或B？第三、第四個選項是什麼？|Am I trapped between A and B? What are options C and D?`,`任何重大的二選一，先逼自己寫出選項C。|For any big either-or, first make yourself write option C.`],
[4,`沉沒成本|Sunk Cost`,`過去無法回收，但未來仍能重新配置。|The past can't be recovered, but the future can still be reallocated.`,`過去的付出引發情感依附，依附拉著你繼續投入。|Past costs create emotional attachment, which pulls you into further investment.`,`已經投入了，所以要繼續。|I've invested, so I must continue.`,`只比較未來的成本與價值。|Compare only future costs and value.`,`未來的價值。|Future value.`,`假設今天是第一次選。|Imagine you're choosing for the first time today.`,`轉換本身也有成本。|Switching has its own cost.`,`停損的勇氣。|The courage to cut losses.`,`如果今天第一次遇到這個選項，我還會選它嗎？從現在往後繼續投入，未來的價值還值得嗎？|If I met this option for the first time today, would I choose it? Is the future value worth continued investment?`,`暫時不計算過去投入，只寫「繼續／停止」各自未來的成本與收益。|Set aside past investment; write only the future costs and benefits of continuing vs stopping.`],
[4,`風險|Risk`,`不是追求零風險，而是避開承受不起的風險。|Don't chase zero risk — avoid the risks you can't afford.`,`機率 × 影響 × 暴露程度 × 可逆性。|Probability × impact × exposure × reversibility.`,`害怕風險。|Fear risk.`,`管理風險。|Manage risk.`,`影響有多大。|How big the impact is.`,`降低不可逆的損失。|Reduce irreversible losses.`,`機率永遠只是估計。|Probabilities are always estimates.`,`風險管理。|Risk management.`,`最可能發生什麼？最嚴重會怎樣？機率多大？影響多大？這個結果我承受得起嗎？|What's most likely? What's the worst? How probable? How big the impact? Can I bear it?`,`寫下「最可能／最糟／最可承受」三種結果。|Write three outcomes: most likely / worst / most bearable.`],
[4,`時間|Time`,`行事曆，比口頭上的「重要」更誠實。|Your calendar is more honest than the word "important."`,`每天24小時，經過優先順序的配置，變成結果。|24 hours, allocated by priorities, become results.`,`我沒時間。|I don't have time.`,`我沒有把時間配置給它。|I haven't allocated time to it.`,`優先順序。|Priorities.`,`刪除低價值的活動。|Delete low-value activities.`,`時間無法儲存。|Time can't be stored.`,`配置資源的能力。|Allocating resources.`,`我是真的沒有時間，還是它沒有排進前面的順位？我的時間實際流去哪裡了？|Do I truly lack time, or is it just not a priority? Where does my time actually go?`,`今天記錄3個最大的時間流向，刪掉其中價值最低的一項15分鐘。|Track your 3 biggest time sinks today and cut 15 minutes from the lowest-value one.`],
[4,`目標|Goals`,`目標決定方向，系統決定你抵達的機率。|Goals set direction; systems decide your odds of arriving.`,`目標、系統、行動、指標與回饋，串成一條路。|Goal, system, action, metric and feedback form one path.`,`有目標就努力。|Have a goal, work hard.`,`建立一個可以運作的系統。|Build a system that runs.`,`系統。|The system.`,`固定的行為加上回饋。|Fixed behaviors plus feedback.`,`目標錯了，效率反而是反效果。|With the wrong goal, efficiency backfires.`,`目標管理。|Goal management.`,`我的目標到底是什麼？每天哪個系統會讓我更接近它？我要用什麼回饋知道自己有沒有前進？|What is my goal, really? What daily system brings me closer? What feedback shows I'm progressing?`,`把一個目標，轉成一個每天固定可以執行的行為。|Turn one goal into one fixed daily behavior.`],
[4,`行動|Action`,`行動會帶來思考無法給你的新資料。|Action brings new data that thinking alone can't give.`,`意圖跨過啟動門檻，成為行動與回饋。|Intention crosses the activation threshold to become action and feedback.`,`等有動力再開始。|Wait for motivation.`,`降低啟動的門檻。|Lower the threshold to start.`,`第一步。|The first step.`,`最小的行動。|The minimum action.`,`小行動最終仍需要累積。|Small actions still need to add up.`,`啟動力。|The power to begin.`,`我是不是一直在等「有感覺」才開始？現在五分鐘內能做的最小行動是什麼？|Am I waiting to "feel like it"? What's the smallest action I can do within five minutes?`,`設一個5分鐘計時器，立刻開始第一步。|Set a 5-minute timer and start the first step now.`],
[4,`High Agency|High Agency`,`不能控制全部，不代表什麼都不能改。|You can't control everything — but that doesn't mean you can change nothing.`,`面對限制，找到可控變數，行動並取得回饋。|Facing constraints, find the control variable, act and get feedback.`,`等環境改變。|Wait for circumstances to change.`,`主動介入可以控制的變數。|Actively move the variables you can control.`,`可控的變數。|The control variable.`,`最小而有效的介入。|The minimum effective intervention.`,`主動力不等於萬能的控制。|Agency isn't omnipotent control.`,`主動創造。|Proactive creation.`,`這件事裡，我不能控制什麼？我仍然能控制什麼？哪一個變數最值得先動？|What can't I control here? What can I still control? Which variable is most worth moving first?`,`不要先改變整個世界，只改一個你今天能控制的變數。|Don't change the whole world first — change one variable you control today.`],
[4,`自由|Freedom`,`自由不是沒有規則，而是不被失效的規則永遠綁住。|Freedom isn't having no rules — it's not being bound forever by rules that no longer work.`,`你的模型決定你看見哪些選項，選擇之後再更新。|Your model decides which options you see; you choose, then update.`,`沒有限制才是自由。|Freedom means no limits.`,`能看見並更新自己的限制模型。|Seeing and updating my own model of limits.`,`對自己模型的覺察。|Awareness of your own model.`,`保留退出與更新的權利。|Keep the right to exit and update.`,`自由永遠存在於現實的限制中。|Freedom always lives within real constraints.`,`自主性。|Autonomy.`,`現在真正限制我的，是外在現實，還是我仍然相信的舊模型？如果不再需要遵守這個舊規則，我多了哪些選項？|What limits me now — outer reality, or an old model I still believe? Without that old rule, what options open up?`,`寫下：「我一直以為我必須＿＿。」再補：「如果不必，我還可以＿＿。」|Write: "I always thought I had to ___." Then: "If I didn't have to, I could ___."`],
[4,`命運|Destiny`,`許多看似命運的重複，其實只是一個穩定的迴路。|Much of what looks like fate is just a stable loop.`,`模型帶來重複的行動，行動形成回饋迴路，迴路塑造長期結果。|Models drive repeated actions, actions form feedback loops, and loops shape long-term outcomes.`,`事情注定如此。|It's meant to be.`,`找到可以介入的迴路。|Find a loop you can step into.`,`迴路。|The loop.`,`改變一個反覆出現的節點。|Change one recurring node.`,`不是所有結果都由個人控制。|Not every outcome is in one person's control.`,`介入系統的能力。|System intervention.`,`我人生中有哪一種結果一直重複？它前面是不是一直出現相同的「模型→決定→行動」？這個回饋迴路最早可以在哪裡切斷？|What outcome keeps repeating in my life? Is it always preceded by the same model → decision → action? Where's the earliest point to break the loop?`,`找最近3次相似的事件，圈出第一個重複出現的節點，下一次只改這一點。|Look at 3 similar recent events, circle the first recurring node, and next time change only that.`],

[5,`金錢|Money`,`財富，首先是一個配置的問題。|Wealth is, first of all, a matter of allocation.`,`收入、支出、儲蓄、投資與風險，構成金錢的流動。|Income, spending, saving, investing and risk make up money's flow.`,`有錢就花。|Spend when you have it.`,`先配置，再使用。|Allocate first.`,`現金流。|Cash flow.`,`自動分配。|Automatic allocation.`,`收入與突發支出都有現實的邊界。|Income and emergencies have real limits.`,`財務管理。|Financial management.`,`我的錢現在流去哪裡？每一筆收入進來之前，我有沒有先決定如何配置？|Where is my money going? Before income arrives, have I decided how to allocate it?`,`今天把所有支出只分成「必要／選擇／投資未來」三類。|Today, sort all spending into three groups: essential / optional / investing in the future.`],
[5,`消費|Spending`,`每一次購買，都同時放棄了另一種可能。|Every purchase quietly gives up another possibility.`,`想要引發購買，購買帶來效用，也帶來機會成本。|Wanting leads to buying; buying brings utility and opportunity cost.`,`想要就是需要。|Want equals need.`,`比較價值與機會成本。|Compare value and opportunity cost.`,`購買之前。|The moment before buying.`,`延遲決定。|Delay the decision.`,`價值包含主觀的喜悅。|Value includes subjective joy.`,`消費判斷力。|Spending judgment.`,`這是需要還是想要？買它得到什麼？同一筆錢因此放棄了什麼？|Is this a need or a want? What do I gain? What does the same money give up?`,`非必要的購買，延遲24小時再決定。|Delay non-essential purchases by 24 hours.`],
[5,`投資|Investing`,`先學會活下來，再追求報酬。|First make sure you survive, then pursue returns.`,`投資假設、風險、配置、報酬，再回頭平衡。|Thesis, risk, allocation, return, then rebalance.`,`漲就追，跌就怕。|Chase rises, fear falls.`,`假設、配置，加上再平衡。|Thesis, allocation and rebalancing.`,`部位大小。|Position size.`,`配置風險。|Allocate risk.`,`市場無法被精準預測。|Markets can't be predicted precisely.`,`投資紀律。|Investment discipline.`,`我買進的理由是什麼？什麼證據出現代表原本的假設錯了？如果判斷錯，我承受得起嗎？|What's my thesis for buying? What evidence would prove it wrong? If I'm wrong, can I bear it?`,`每筆投資寫一句「我為什麼持有＋什麼條件下重新評估」。|For each holding, write one line: "Why I hold it + when I'll re-evaluate."`],
[5,`工作|Work`,`最好的工作回報，不只有本月的薪水。|The best return on work isn't just this month's paycheck.`,`時間換來產出，產出換來收入、技能、人脈與選擇權。|Time becomes output; output becomes income, skills, network and options.`,`只換薪水。|Trade time for salary only.`,`同時累積能力與選擇權。|Also accumulate skills and options.`,`可以累積的資產。|Assets that accumulate.`,`選擇會複利的技能。|Choose skills that compound.`,`工作仍然有現實的交換關係。|Work is still a real exchange.`,`職業資本。|Career capital.`,`這份工作除了薪水，還在幫我累積什麼？一年後我的能力、人脈與選擇權會增加嗎？|Beyond salary, what is this job building for me? In a year, will my skills, network and options grow?`,`今天選一個能留下來的技能、作品或流程，投入15分鐘。|Today, spend 15 minutes on a skill, piece of work or process that will last.`],
[5,`職涯|Career`,`職稱可能消失，但能力可以帶著走。|Titles may disappear, but abilities travel with you.`,`能力遇見機會，化為選擇，累積成你的組合。|Ability meets opportunity, becomes choice, and builds your portfolio.`,`選一個職業做到底。|Pick one career for life.`,`建立一組能力組合。|Build a portfolio of abilities.`,`可轉移的技能。|Transferable skills.`,`累積跨場景的能力。|Build cross-context abilities.`,`轉換有成本，也有門檻。|Transitions have costs and barriers.`,`職涯適應力。|Career adaptability.`,`如果現在的職稱消失，我還剩下哪些能帶走的能力？下一個最值得累積的可轉移技能是什麼？|If my title vanished, which abilities would I keep? What transferable skill is most worth building next?`,`列出5項可轉移的能力，選最弱的一項開始補強。|List 5 transferable abilities and start strengthening the weakest.`],
[5,`商業|Business`,`商業不是做得最多，而是解決值得付費的問題。|Business isn't doing the most — it's solving problems worth paying for.`,`需求、價值、信任、成交、留存、推薦，一條完整的價值鏈。|Need, value, trust, conversion, retention, referral — a complete value chain.`,`產品好，自然有人買。|A good product sells itself.`,`顧好整條價值鏈。|Tend the whole value chain.`,`真正的需求。|The real need.`,`找到漏斗中最大的瓶頸。|Find the biggest bottleneck in the funnel.`,`市場與競爭持續在變。|Markets and competition keep changing.`,`創造價值。|Value creation.`,`客戶真正願意付錢解決的是什麼問題？目前最大的瓶頸在需求、信任、成交還是留存？|What problem will customers truly pay to solve? Is the biggest bottleneck in demand, trust, conversion or retention?`,`今天只找一位客戶問：「你現在最想解決的問題是什麼？」|Today, ask just one customer: "What problem do you most want solved right now?"`],
[5,`價值|Value`,`努力是成本，不會自動等於價值。|Effort is a cost; it doesn't automatically equal value.`,`問題、解方、對方感受到的好處，最後成為交換。|Problem, solution, perceived benefit — then exchange.`,`我做很多，價值就高。|I do a lot, so my value is high.`,`對方得到的改善，才是價值。|Value is the improvement the other person receives.`,`結果。|The outcome.`,`從對方的需要反推。|Work backward from their needs.`,`價值會隨情境而變。|Value depends on context.`,`設計價值。|Value design.`,`我做了很多，對方到底因此得到什麼改善？哪些工作只是讓我很忙，卻沒有增加價值？|I've done so much — what improvement did they actually get? Which tasks keep me busy without adding value?`,`刪除一項「很忙但沒有明確結果」的工作。|Delete one task that's busy but has no clear outcome.`],
[5,`槓桿|Leverage`,`先確認方向，再放大力量。|Confirm the direction first, then amplify the force.`,`投入經過槓桿點，放大成產出。|Input passes through a leverage point and becomes amplified output.`,`增加工時。|Work more hours.`,`找到高影響的節點。|Find the high-impact node.`,`槓桿點。|The leverage point.`,`系統、工具、AI、內容、資本與人才。|Systems, tools, AI, content, capital and people.`,`錯誤也會被槓桿放大。|Leverage amplifies mistakes too.`,`放大效能。|Amplified effectiveness.`,`哪20%的行動，正在產生80%的結果？什麼可以標準化、自動化、AI化、授權或刪除？|Which 20% of actions produce 80% of results? What can be standardized, automated, AI-assisted, delegated or deleted?`,`今天找一件重複的工作，第一次把它模板化、自動化、AI化或交給別人。|Today, take one repetitive task and, for the first time, template, automate, AI-assist or delegate it.`],

[6,`健康|Health`,`單一時刻的感覺，不如長期趨勢完整。|A single moment's feeling is less complete than a long-term trend.`,`基準、暴露、行為、指標與症狀，匯成長期的趨勢。|Baseline, exposure, behavior, biomarkers and symptoms form a trend.`,`不舒服才處理。|Act only when unwell.`,`持續觀察與預防。|Monitor and prevent continuously.`,`趨勢。|The trend.`,`可持續的生活習慣，加上必要的醫療。|Sustainable habits plus necessary medical care.`,`健康無法被完全掌控。|Health can't be fully controlled.`,`健康管理。|Health management.`,`我的基準是什麼？最近的趨勢往哪裡走？做了調整之後，什麼時候再測？|What's my baseline? Where is the trend heading? After an intervention, when will I retest?`,`選一項真正有意義、適合自己的健康指標，開始固定記錄；有異常或症狀，就依需要尋求專業評估。|Choose one meaningful health metric that suits you and track it regularly; if something seems off, seek professional evaluation as needed.`],
[6,`飲食|Diet`,`別讓單一種食物，承擔整個健康的故事。|Don't let a single food carry the whole story of your health.`,`飲食模式、份量與情境，決定身體的反應。|Eating patterns, dose and context shape your body's response.`,`食物分好與壞。|Foods are good or bad.`,`看整體模式、份量與個人差異。|Look at the overall pattern, amount and individual differences.`,`整體的飲食模式。|The overall eating pattern.`,`每天高頻率的小選擇。|Frequent everyday choices.`,`每個人的疾病與需要都不同。|Everyone's conditions and needs differ.`,`調節飲食的能力。|Nutritional self-regulation.`,`不只問「這個食物好不好」，而是問：我的整體飲食模式、頻率、份量與個人需要是什麼？|Instead of "Is this food good?", ask: what's my overall pattern, frequency, amount and personal need?`,`先不大改飲食，只記錄今天一整天實際吃了什麼，取得基準。|Don't overhaul anything — just record what you actually eat today to get a baseline.`],
[6,`運動|Exercise`,`訓練不是把自己耗盡，而是讓身體有能力變強。|Training isn't draining yourself — it's giving your body the ability to grow stronger.`,`刺激、疲勞、恢復，然後適應。|Stimulus, fatigue, recovery, then adaptation.`,`越累越有效。|The more exhausted, the more effective.`,`刺激與恢復共同決定適應。|Stimulus and recovery together create adaptation.`,`恢復。|Recovery.`,`適量而漸進。|Moderate and progressive.`,`傷病與個體差異。|Injuries and individual differences.`,`身體的適應力。|Physical adaptation.`,`這次訓練給了足夠的刺激嗎？我的睡眠、恢復與身體功能有沒有跟上？|Did this session provide enough stimulus? Are my sleep, recovery and function keeping up?`,`今天運動後記錄「強度／疲勞／恢復感」各0–10分。|After exercise today, rate intensity / fatigue / recovery from 0–10.`],
[6,`睡眠|Sleep`,`恢復不是浪費時間，而是持續發光的基礎。|Rest isn't wasted time — it's the foundation of lasting output.`,`睡眠壓力、晝夜節律與環境，決定睡眠，也決定恢復。|Sleep pressure, circadian rhythm and environment shape sleep and recovery.`,`忙就少睡。|Sleep less when busy.`,`睡眠是核心系統。|Sleep is a core system.`,`規律。|Regularity.`,`固定作息與舒適的睡眠環境。|A fixed schedule and a good sleep environment.`,`失眠與疾病可能需要專業協助。|Insomnia and illness may need professional help.`,`恢復管理。|Recovery management.`,`最近的睡眠問題，是時間不足、節律、環境、壓力，還是其他因素？哪個可以改變的變數最值得先試？|Is my sleep issue about time, rhythm, environment, stress or something else? Which changeable variable should I test first?`,`選一個低風險的睡眠習慣固定執行一週，例如固定起床時間，再觀察趨勢。|Keep one low-risk sleep habit for a week — like a fixed wake time — and watch the trend.`],
[6,`老化|Aging`,`接受不可逆的，積極照顧可逆的。|Accept what's irreversible; actively care for what's reversible.`,`時間、基因、環境與行為，一起改變身體功能。|Time, genes, environment and behavior together change how the body functions.`,`老了就只能退化。|Aging means only decline.`,`分清不可逆與可以改善的功能。|Distinguish irreversible from improvable functions.`,`身體的功能能力。|Functional capacity.`,`活動、營養、睡眠、醫療與社交。|Activity, nutrition, sleep, medical care and social connection.`,`老化無法被取消。|Aging can't be cancelled.`,`健康地老去。|Healthy aging.`,`哪些改變可能是不可逆的？哪些功能仍然可以透過訓練、生活調整或適當醫療改善？|Which changes may be irreversible? Which functions can still improve through training, lifestyle or proper care?`,`選一項重要的功能建立基準，例如日常活動能力，再依個人狀況規劃安全的改善方式。|Set a baseline for one important function, like daily mobility, then plan safe improvements for your situation.`],
[6,`疾病|Disease`,`複雜的疾病，通常無法用一個單一原因的故事解釋。|Complex illness rarely fits a single-cause story.`,`易感性、暴露、時間、行為與機運，共同形成疾病風險。|Susceptibility, exposure, time, behavior and chance together form disease risk.`,`找唯一的原因。|Look for the one cause.`,`用多因素的風險模型來看。|See it through a multi-factor risk model.`,`可以調整的風險。|Modifiable risks.`,`證據充分、又能改變的因素。|Well-evidenced, changeable factors.`,`相關不等於因果，介入也需考慮風險。|Correlation isn't causation; interventions carry risk too.`,`風險管理。|Risk management.`,`我是不是正在尋找一個「唯一原因」？目前有哪些已知風險、保護因素、時間因素與可修改的變數？哪些需要專業醫療評估？|Am I searching for one single cause? What known risks, protective factors, timing and modifiable variables exist? What needs professional medical assessment?`,`把「我為什麼會生病？」改成「目前已知哪些因素值得處理？」並把需要醫療判斷的部分，帶給合適的醫療專業人員。|Change "Why did I get sick?" into "Which known factors are worth addressing?" and bring medical questions to the right professional.`],

[7,`權威|Authority`,`尊重專業，但不把任何人當成不可更新的真理。|Respect expertise, but treat no one as un-updatable truth.`,`權威提出主張，主張贏得信任，信任引導行動。|Authority makes a claim, the claim earns trust, and trust guides action.`,`專家說的就是真的。|If an expert said it, it's true.`,`專業＋證據＋適用範圍。|Expertise + evidence + scope.`,`主張本身。|The claim itself.`,`問證據，也問不確定性。|Ask for evidence and uncertainty.`,`自己也可能沒有判讀專業資料的能力。|You may lack the expertise to judge the data yourself.`,`校準知識。|Calibrated knowledge.`,`這個人是誰？他的專業範圍是什麼？他提出的是證據、詮釋，還是意見？|Who is this person? What's their field? Is this evidence, interpretation or opinion?`,`重要的決定，至少查看一個原始資料、正式指引或第二個可靠來源。|For important decisions, check at least one original source, official guideline or second reliable source.`],
[7,`資訊|Information`,`資訊不是越多越好，而是訊號越清楚越好。|More information isn't better — a clearer signal is.`,`來源、主張、證據、脈絡，決定你的信心。|Source, claim, evidence and context set your confidence.`,`看到就相信。|Seeing is believing.`,`為來源與證據分級。|Grade sources and evidence.`,`來源與證據。|Source and evidence.`,`交叉驗證。|Cross-check.`,`資訊過多，本身也會帶來混亂。|Too much information creates its own chaos.`,`判讀資訊的能力。|Information literacy.`,`來源在哪裡？證據是什麼？脈絡是什麼？有沒有其他可靠來源得到不同的結論？|Where's the source? What's the evidence? What's the context? Do other reliable sources conclude differently?`,`轉傳任何重要資訊之前，先找到原始來源。|Before forwarding anything important, find the original source.`],
[7,`真相|Truth`,`高品質的信念，一定保留被現實修改的入口。|A high-quality belief always leaves a door open for reality to revise it.`,`觀察、假設、預測、測試、修正。|Observe, hypothesize, predict, test, revise.`,`找到永遠的答案。|Find the eternal answer.`,`建立目前最好的解釋。|Build the best current explanation.`,`可以被推翻的可能。|Falsifiability.`,`主動尋找可能推翻自己的證據。|Actively seek evidence that could prove you wrong.`,`有些問題無法被完全驗證。|Some questions can't be fully verified.`,`求真。|Truth-seeking.`,`什麼證據會讓我承認自己錯了？如果沒有任何證據能改變我的看法，它還是一個可以被測試的模型嗎？|What evidence would make me admit I'm wrong? If nothing could change my view, is it still a testable model?`,`主動搜尋一次與自己立場相反、但品質高的證據。|Seek out one piece of high-quality evidence against your own position.`],
[7,`世界觀|Worldview`,`地圖，不是領土。|The map is not the territory.`,`經驗形成世界模型，模型產生預測，預測影響詮釋。|Experience forms a world model; the model predicts; predictions color interpretation.`,`世界應該符合我。|The world should fit me.`,`我的模型應該符合世界。|My model should fit the world.`,`預測誤差。|Prediction error.`,`與現實核對。|A reality check.`,`任何世界觀都只是一種壓縮。|Every worldview is only a compression.`,`認知彈性。|Cognitive flexibility.`,`現在是現實錯了，還是我的世界模型不夠完整？最近哪個現象是我的模型解釋不了的？|Is reality wrong, or is my world model incomplete? What recent phenomenon can't my model explain?`,`每週記一件「原本以為＿＿，結果其實＿＿」。|Each week, note one "I thought ___, but actually ___."`],
[7,`智慧|Wisdom`,`真正高階的知識，包含它自己的適用邊界。|Truly advanced knowledge includes its own boundaries.`,`知識＋情境＋限制＋經驗＋回饋，形成判斷。|Knowledge + context + constraints + experience + feedback form judgment.`,`知道答案就是智慧。|Knowing the answer is wisdom.`,`知道何時用、何時不用、何時更新。|Knowing when to use it, when not to, and when to update.`,`情境。|Context.`,`跨情境比較。|Compare across contexts.`,`智慧無法完全脫離經驗。|Wisdom can't be fully separated from experience.`,`判斷力。|Judgment.`,`這個方法在什麼情況有效？什麼情況無效？它的限制與適用邊界在哪裡？|When does this method work? When doesn't it? Where are its limits and boundaries?`,`任何重要規則後面都補一句：「適用於＿＿；不適用於＿＿。」|After any important rule, add: "Applies to ___; not to ___."`],
[7,`人生|Life`,`人生不是找到標準答案，而是在限制中，持續長出更適合自己的版本。|Life isn't about finding the standard answer — it's about growing, within limits, a version that fits you better.`,`身份、目標、決定、行動、回饋，交織成意義。|Identity, goals, decisions, actions and feedback weave meaning.`,`找到唯一正確的人生。|Find the one right life.`,`持續生成、測試、修正。|Keep generating, testing, revising.`,`模型更新。|Model update.`,`定期重新問：「這仍是我要的嗎？」|Regularly ask again: "Is this still what I want?"`,`生命有限，有些選擇不可逆。|Life is finite; some choices are irreversible.`,`設計人生。|Life design.`,`我現在過的生活，還是我要的嗎？如果今天重新設計，我會保留什麼、停止什麼、開始什麼？我下一個最值得測試的人生版本是什麼？|Is the life I'm living still the one I want? If I redesigned it today, what would I keep, stop and start? What's the next version of my life worth testing?`,`今天只寫三行：繼續一件事。停止一件事。開始一件事。|Today, write just three lines: Continue one thing. Stop one thing. Start one thing.`]
];

// 心法
const P=[
{t:`人生的大循環|The Great Loop of Life`,intro:`親愛的，你今天經歷的一切，都在同一條溫柔的路上流動：|Dear one, everything you live through today flows along one gentle path:`,
 flow:[`輸入|Input`,`感知|Perception`,`模型|Model`,`預測|Prediction`,`情緒|Emotion`,`決定|Decision`,`行動|Action`,`結果|Outcome`,`回饋|Feedback`,`預測誤差|Prediction Error`,`模型更新|Model Update`],
 outro:`人生的結果，不是命運寫好的劇本，而是這個循環一次又一次轉動後的樣子。|Life's outcomes aren't a script written by fate — they're what this loop becomes as it turns, again and again.`},
{t:`每碗湯的九種滋味|Nine Flavors in Every Bowl`,list:[
 `<b>結構</b>　這個模型由哪些變數慢慢形成。|<b>Structure</b> — the variables that quietly shape this model.`,
 `<b>舊→新</b>　那個曾經有效、如今失效的想法，如何溫柔地更新。|<b>From → To</b> — how an idea that once worked, and now fails, gently updates.`,
 `<b>節點</b>　最值得你停下來觀察的關鍵位置。|<b>Key Moment</b> — the place most worth pausing to notice.`,
 `<b>槓桿</b>　改動最少、影響最大的那一點。|<b>Gentle Lever</b> — the smallest change with the biggest effect.`,
 `<b>限制</b>　這個模型最容易失效的地方。|<b>Honest Limit</b> — where this model most easily fails.`,
 `<b>能力</b>　更新之後，你會長出的力量。|<b>You Gain</b> — the strength you grow after updating.`,
 `<b>智慧</b>　最後可以壓縮、收藏一生的規律。|<b>Wisdom</b> — the pattern you can compress and keep for life.`,
 `<b>實作提問</b>　把抽象的模型，化為此刻就能回答、能行動、能取得回饋的問題。|<b>Ask Yourself</b> — turning an abstract model into questions you can answer, act on and learn from right now.`,
 `<b>最小行動</b>　今天能做、5–15分鐘能啟動、能帶來新資料的一小步。|<b>Tiny Step</b> — something you can do today, start in 5–15 minutes, and learn from.`]},
{t:`實作提問的小路|The Path of Practical Questions`,intro:`每一個模型，都可以沿著同一條小路走：|Every model can walk the same little path:`,
 flow:[`發生什麼？|What happened?`,`我怎麼解釋？|How do I explain it?`,`我預測什麼？|What do I predict?`,`證據是什麼？|What's the evidence?`,`真正卡在哪？|Where am I really stuck?`,`我能控制什麼？|What can I control?`,`最小實驗是什麼？|What's the smallest experiment?`,`什麼結果出現就更新？|What result would update me?`]},
{t:`七個溫柔的診斷問題|Seven Gentle Diagnostic Questions`,intro:`68個模型，共用這七個觀察點：|All 68 models share these seven checkpoints:`,list:[
 `<b>模型</b>　我現在用什麼模型解釋這件事？|<b>MODEL</b> — What model am I using to explain this?`,
 `<b>預測</b>　這個模型讓我預測什麼？|<b>PREDICTION</b> — What does this model make me predict?`,
 `<b>誤差</b>　現實哪裡和我的預測不同？|<b>ERROR</b> — Where does reality differ from my prediction?`,
 `<b>瓶頸</b>　真正卡住的節點在哪裡？|<b>BOTTLENECK</b> — Where is the real sticking point?`,
 `<b>槓桿</b>　改哪一個變數最省力、影響最大？|<b>LEVERAGE</b> — Which variable is easiest to change with the biggest effect?`,
 `<b>行動</b>　現在最小可以測試什麼？|<b>ACTION</b> — What's the smallest thing I can test now?`,
 `<b>回饋</b>　什麼結果出現，我就更新模型？|<b>FEEDBACK</b> — What result would make me update my model?`]},
{t:`六個溫柔的提醒鈴|Six Gentle Alarm Bells`,intro:`當這些鈴聲響起，不是責備，而是邀請你停下來看看：|When these bells ring, it's not blame — it's an invitation to pause and look:`,list:[
 `一直得到相同的壞結果——也許你的模型還沒有更新。|The same bad result keeps coming — maybe your model hasn't updated yet.`,
 `證據已經改變，想法卻沒有動——信念可能僵化了。|The evidence changed but your view didn't — the belief may have hardened.`,
 `投入越來越多，結果卻沒有改善——方法可能失效了。|More and more effort, no better results — the strategy may have stopped working.`,
 `只想得到二選一——你的選項還不夠多。|Only two choices in sight — you need more options.`,
 `所有問題都怪自己，或都怪別人——你看系統的視野太窄了。|Blaming everything on yourself, or on others — your view of the system is too narrow.`,
 `沒有設定回饋與停止規則——行動很容易變成慣性。|No feedback or stop rule — action easily slides into autopilot.`]},
{t:`智慧是這樣長出來的|How Wisdom Grows`,steps:[
 `事件發生——不急著立刻反應。|An event happens — no rush to react.`,
 `先辨認：是哪個模型在運作？|First, recognize which model is running.`,
 `模型產生預測。|The model makes a prediction.`,
 `讓預測接受現實的檢驗。|Let the prediction meet reality.`,
 `預測≠現實，誤差出現了。|Prediction ≠ reality — an error appears.`,
 `誤差不是用來自責的。|The error is not for self-blame.`,
 `誤差，轉成資料。|The error becomes data.`,
 `資料，幫你找到瓶頸。|Data helps you find the bottleneck.`,
 `瓶頸，指向槓桿點。|The bottleneck points to the leverage point.`,
 `槓桿點，化為最小行動。|The leverage point becomes a minimum action.`,
 `行動，帶回回饋。|Action brings back feedback.`,
 `回饋，更新模型。|Feedback updates the model.`,
 `模型更新，長出能力。|The update grows capability.`,
 `能力跨情境反覆有效，成為智慧。|Capability that works again and again across situations becomes wisdom.`,
 `智慧被壓縮成可重複使用的規則，成為新的LifeOS。|Wisdom compressed into reusable rules becomes your new LifeOS.`]},
{t:`心的高度|The Heights of the Heart`,list:[
 `<b>低階</b>　事情發生，我反應。|<b>Basic</b> — something happens, I react.`,
 `<b>中階</b>　事情發生，我選擇。|<b>Middle</b> — something happens, I choose.`,
 `<b>高階</b>　事情發生，我看見自己的模型，再重新選擇。|<b>Higher</b> — something happens, I see my model, and choose again.`,
 `<b>更高階</b>　我發現模型反覆失效，於是修改它。|<b>Higher still</b> — I notice my model keeps failing, so I revise it.`,
 `<b>High Agency</b>　我主動設計實驗，取得回饋。|<b>High Agency</b> — I design experiments to get feedback.`,
 `<b>智慧</b>　我知道哪些模型值得保留，哪些需要更新。|<b>Wisdom</b> — I know which models to keep and which to update.`,
 `<b>自由</b>　我不必永遠服從昨天形成的模型。|<b>Freedom</b> — I don't have to obey yesterday's model forever.`],
 outro:`所以，68個模型真正要練的，不是68個答案，而是同一個最高能力：看見模型→測試模型→修正模型→再次走進世界。|So what the 68 models truly train isn't 68 answers, but one highest ability: see the model → test it → revise it → step back into the world.`},
{t:`最終公式|The Final Formula`,flow:[`8大母體|8 Domains`,`68模型|68 Models`,`節點|Nodes`,`限制|Constraints`,`預測|Prediction`,`行動|Action`,`回饋|Feedback`,`預測誤差|Prediction Error`,`瓶頸|Bottleneck`,`槓桿|Leverage`,`模型更新|Model Update`,`能力|Capability`,`智慧|Wisdom`,`自由|Freedom`],
 outro:`人生真正的升級，不是讓自己永遠不犯錯；而是讓每一次錯誤更快變成資料，讓資料更快變成能力，讓能力更快壓縮成智慧，最後，讓自己擁有越來越寬廣的選擇空間。|Life's true upgrade isn't never making mistakes. It's letting every mistake turn into data faster, data into ability faster, ability into wisdom faster — until you have an ever wider space of choices.`},
{t:`統一8問・好背8句|The 8 Questions・8 Easy Lines`,intro:`任何問題，都可以輕輕跑過這8題：|Any problem can gently run through these 8:`,list:[
 `<b>模型</b>　我現在用什麼模型看這件事？——我怎麼看？|<b>MODEL</b> — What model am I using? — How do I see it?`,
 `<b>預測</b>　這個模型讓我預測什麼？——我以為會怎樣？|<b>PREDICTION</b> — What does it make me predict? — What did I expect?`,
 `<b>證據</b>　事實與證據是什麼？——事實是什麼？|<b>EVIDENCE</b> — What are the facts and evidence? — What's true?`,
 `<b>誤差</b>　現實跟我的預測差在哪裡？——哪裡猜錯？|<b>ERROR</b> — Where does reality differ from my prediction? — Where did I guess wrong?`,
 `<b>瓶頸</b>　真正卡住我的節點是什麼？——真正卡哪裡？|<b>BOTTLENECK</b> — What's truly blocking me? — Where am I stuck?`,
 `<b>槓桿</b>　哪一個變數最值得先改？——先改哪一點？|<b>LEVERAGE</b> — Which variable is most worth changing first? — What first?`,
 `<b>實驗</b>　我今天可以做什麼最小實驗？——先試什麼？|<b>EXPERIMENT</b> — What smallest experiment can I run today? — What to try?`,
 `<b>更新</b>　看到什麼回饋，我願意更新模型？——結果告訴我什麼？|<b>UPDATE</b> — What feedback would make me update? — What did the result tell me?`]},
{t:`遇到難題時的溫柔路徑|A Gentle Path Through Any Problem`,flow:[`問題|Problem`,`不急著找答案|No rush for answers`,`選出相關模型|Pick the relevant model`,`實作提問|Ask yourself`,`找預測|Find the prediction`,`找證據|Find the evidence`,`找預測誤差|Find the error`,`找瓶頸|Find the bottleneck`,`找槓桿點|Find the leverage point`,`最小行動|Minimum action`,`取得回饋|Get feedback`,`模型更新|Update the model`,`能力增加|Capability grows`,`跨情境再測|Retest elsewhere`,`壓縮成智慧|Compress into wisdom`],
 intro:`未來要練的，不是「記住68個模型」，而是在任何事情發生時，都能問：|What to practice isn't memorizing 68 models, but being able to ask, whenever anything happens:`,
 list:[`現在是哪個模型正在控制我的預測？|Which model is steering my prediction right now?`,`它還有效嗎？|Does it still work?`,`我可以怎麼測？|How can I test it?`,`什麼結果會讓我更新？|What result would make me update?`],
 outro:`當你開始能問出這四個問題，你就從「被模型控制」，走向「可以更新模型」。這就是68模型真正想送給你的禮物——High Agency。|When you can ask these four questions, you move from being controlled by your models to being able to update them. That is the real gift of the 68 models — High Agency.`},
{t:`最小行動原則|The Principle of the Tiny Step`,intro:`不是一次解決所有問題，而是做一個最小、低成本、可逆、能帶來回饋的行動。|Don't solve everything at once. Take one small, low-cost, reversible action that brings feedback.`,
 flow:[`提問|Question`,`最小行動|Minimum Action`,`回饋|Feedback`,`預測誤差|Prediction Error`,`模型更新|Model Update`],
 list:[`<b>小</b>　小到現在就可以開始。|<b>Small</b> — small enough to start right now.`,`<b>快</b>　最好5–15分鐘就能啟動。|<b>Quick</b> — ideally started within 5–15 minutes.`,`<b>低風險</b>　錯了也容易回頭。|<b>Low-risk</b> — easy to undo if wrong.`,`<b>可觀察</b>　做完能看到回饋。|<b>Observable</b> — you can see feedback afterward.`,`<b>可更新</b>　結果能告訴你下一步。|<b>Updatable</b> — the result tells you the next step.`],
 outro:`別再問「我要怎麼一次把人生改好？」改問：「哪一個最小行動，可以讓我今天多得到一點真實的資料？」|Stop asking "How do I fix my whole life at once?" Ask instead: "Which tiny action could give me a little more real data today?"`},
{t:`行動的十二個台階|Twelve Steps of Action`,intro:`每一個模型，最後都不要停在「我懂了」，一定繼續往下走：|Never stop at "I get it" — keep walking down:`,steps:[
 `<b>問</b>　提出問題。|<b>Ask</b> — pose the question.`,`<b>選</b>　找到相關的模型。|<b>Select</b> — find the relevant model.`,`<b>拆</b>　找到節點。|<b>Break down</b> — find the node.`,`<b>找</b>　找到瓶頸。|<b>Locate</b> — find the bottleneck.`,`<b>動</b>　做最小行動。|<b>Move</b> — take the minimum action.`,`<b>看</b>　看見回饋。|<b>See</b> — notice the feedback.`,`<b>比</b>　比較預測與現實。|<b>Compare</b> — prediction vs reality.`,`<b>改</b>　更新模型。|<b>Revise</b> — update the model.`,`<b>練</b>　反覆練習。|<b>Practice</b> — repeat.`,`<b>成</b>　長成能力。|<b>Become</b> — it becomes capability.`,`<b>遷</b>　遷移到新情境。|<b>Transfer</b> — carry it to new situations.`,`<b>悟</b>　領悟成智慧。|<b>Realize</b> — it ripens into wisdom.`]},
{t:`極簡版・8問＋1動|The Essentials: 8 Questions + 1 Move`,list:[
 `我怎麼看？|How do I see it?`,`我預測什麼？|What do I predict?`,`事實是什麼？|What are the facts?`,`哪裡猜錯？|Where did I guess wrong?`,`真正卡哪？|Where am I truly stuck?`,`哪裡最有槓桿？|Where's the most leverage?`,`我能先測什麼？|What can I test first?`,`結果告訴我什麼？|What does the result tell me?`,
 `<b>＋ 現在立刻做哪一個最小行動？</b>|<b>+ Which minimum action will I do right now?</b>`]},
{t:`最高階公式|The Highest Formula`,flow:[`模型|Model`,`預測|Prediction`,`提問|Question`,`最小行動|Minimum Action`,`現實|Reality`,`回饋|Feedback`,`預測誤差|Prediction Error`,`模型更新|Model Update`,`新的行動|New Action`,`能力|Capability`,`智慧|Wisdom`,`自由|Freedom`],
 intro:`真正的High Agency，不是什麼問題都知道答案，而是：|True High Agency isn't knowing every answer. It's this:`,
 list:[`不知道→我會問。|Don't know → I ask.`,`不確定→我會測。|Unsure → I test.`,`做錯→我會看回饋。|Got it wrong → I look at the feedback.`,`模型失效→我會更新。|Model fails → I update it.`,`事情太大→我會縮成最小行動。|Too big → I shrink it into a tiny step.`,`不能控制全部→我會找到可控變數。|Can't control it all → I find the variable I can.`],
 outro:`所以人生每天可以練的，不是「不要犯錯」，而是：每天找到一個模型，問一個好問題，做一個最小行動，拿到一個真實回饋，完成一次模型更新。這，就是最小的智慧生成循環。|So what you can practice every day isn't "never make mistakes." It's this: find one model, ask one good question, take one tiny step, get one real piece of feedback, and complete one model update. That is the smallest loop that grows wisdom.`}
];

const $=s=>document.querySelector(s);
let lang='both',tab='models',cat=-1,query='';
try{lang=localStorage.getItem('soup68-lang')||'both'}catch(e){}
const sp=s=>{const i=s.indexOf('|');return i<0?[s,s]:[s.slice(0,i),s.slice(i+1)]};
function T(s,lines){let[z,e]=sp(s);if(lines){z=z.replace(/？(?!$)/g,'？<br>').replace(/。(?!$)/g,'。<br>');e=e.replace(/\? (?=[A-Z"])/g,'?<br>')}
 if(lang==='zh')return z;if(lang==='en')return e;return`<span class="zh">${z}</span><span class="en">${e}</span>`}
const strip=s=>s.replace(/<[^>]+>/g,'').toLowerCase();
const pad=n=>String(n).padStart(2,'0');
function mName(m){const[z,e]=sp(m[1]);return`${z}模型|${e} Model`}
function mText(m,i){return strip([pad(i+1),String(i+1),CATS[m[0]][0],...m.slice(1)].join(' '))}

function card(m,i,open){
 const c=CATS[m[0]][1],[oz,oe]=sp(m[4]),[nz,ne]=sp(m[5]);
 const on=`<span class="old">${oz}</span> → <b>${nz}</b>|<span class="old">${oe}</span> → <b>${ne}</b>`;
 const row=(k,v)=>`<div class="row"><div class="lab">${T(LAB[k])}</div><div>${T(v)}</div></div>`;
 return`<details class="card" id="m${i+1}" style="--c:${c}"${open?' open':''}><summary><span class="num">${pad(i+1)}</span><div><div class="cat">${T(CATS[m[0]][0])}</div><div class="name">${T(mName(m))}</div><div class="wis">${T(m[2])}</div></div></summary>
 <div class="body">${row('st',m[3])}${row('on',on)}${row('nd',m[6])}${row('lv',m[7])}${row('lm',m[8])}${row('ab',m[9])}
 <div class="box q"><span class="lab">${T(LAB.q)}</span>${T(m[10],1)}</div>
 <div class="box a"><span class="lab">${T(LAB.a)}</span>${T(m[11])}</div></div></details>`}

function pcard(p){
 let h=`<div class="pcard"><h3>${T(p.t)}</h3>`;
 if(p.intro)h+=`<p>${T(p.intro)}</p>`;
 if(p.flow)h+=`<div class="flow">${p.flow.map(f=>`<span class="f">${T(f)}</span>`).join('<i>→</i>')}</div>`;
 if(p.list)h+=`<ul class="plist">${p.list.map(x=>`<li>${T(x)}</li>`).join('')}</ul>`;
 if(p.steps)h+=`<ol class="steps">${p.steps.map(x=>`<li>${T(x)}</li>`).join('')}</ol>`;
 if(p.outro)h+=`<p>${T(p.outro)}</p>`;
 return h+'</div>'}
const pText=p=>strip([p.t,p.intro||'',p.outro||'',...(p.flow||[]),...(p.list||[]),...(p.steps||[])].join(' '));

let todayIdx=(()=>{const d=new Date();return Math.floor((d-new Date(d.getFullYear(),0,0))/864e5)%68})();
function renderToday(){
 if(query||cat>=0){$('#today').innerHTML='';return}
 const m=M[todayIdx];
 $('#today').innerHTML=`<div class="today"><div class="tag">${T('今日一碗湯|TODAY\'S BOWL')}</div>
 <h2>${pad(todayIdx+1)}・${T(mName(m))}</h2><div class="big">${T(m[2])}</div>
 <div class="box q"><span class="lab" style="color:var(--accent)">${T(LAB.q)}</span>${T(m[10],1)}</div>
 <div class="box a"><span class="lab" style="color:var(--accent)">${T(LAB.a)}</span>${T(m[11])}</div>
 <div class="btns"><button class="btn fill" id="another">${T('換一碗|Another bowl')}</button><button class="btn" id="goto">${T('看完整內容|Read in full')}</button></div></div>`;
 $('#another').onclick=()=>{let n;do{n=Math.floor(Math.random()*68)}while(n===todayIdx);todayIdx=n;renderToday()};
 $('#goto').onclick=()=>{const el=$('#m'+(todayIdx+1));if(el){el.open=true;el.scrollIntoView({behavior:'smooth',block:'start'})}};
}
function render(){
 document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 $('#models').hidden=tab!=='models';$('#principles').hidden=tab!=='principles';
 $('#chips').innerHTML=`<button class="chip${cat<0?' on':''}" data-c="-1">${T('全部|All')}</button>`+CATS.map((c,i)=>`<button class="chip${cat===i?' on':''}" data-c="${i}" style="--c:${c[1]}">${T(c[0])}</button>`).join('');
 const q=query.trim().toLowerCase();
 const ms=M.map((m,i)=>[m,i]).filter(([m,i])=>(cat<0||m[0]===cat)&&(!q||mText(m,i).includes(q)));
 const ps=P.filter(p=>!q||pText(p).includes(q));
 $('#grid').innerHTML=ms.length?ms.map(([m,i])=>card(m,i,!!q)).join(''):`<div class="empty">${T('找不到符合的湯，換個關鍵字試試。|No bowls found — try another word.')}</div>`;
 $('#pgrid').innerHTML=ps.length?ps.map(pcard).join(''):`<div class="empty">${T('找不到符合的心法。|No principles found.')}</div>`;
 $('#count').innerHTML=T(`共 ${ms.length} 碗|${ms.length} bowls`);
 $('#c1').textContent=q?`(${ms.length})`:'';$('#c2').textContent=q?`(${ps.length})`:'';
 renderToday();
}
$('#q').addEventListener('input',e=>{query=e.target.value;render()});
$('#lang').addEventListener('click',e=>{const l=e.target.dataset.l;if(!l)return;lang=l;try{localStorage.setItem('soup68-lang',l)}catch(_){}render()});
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;render()});
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;cat=+b.dataset.c;render()});
render();
</script>
</body>
</html>
