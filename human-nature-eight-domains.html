# ① 人性八大Domain操作表
我把它做成「不是拿來讀，而是遇到事情可以直接跑一次」的版本。每個Domain都統一成：辨識→診斷→Prediction Error→槓桿→最小行動→回饋→更新，也能直接接天道母體、Soul OS、商業、管理、談判與關係系統。
核心目的｜把「懂人性」從知識變成可操作能力。
總流程｜Reality→Fact→8 Domain Scan→Bottleneck→Generator→Prediction→Minimum Action→Feedback→Prediction Error→Model Update→Retest。
## 一｜八大Domain一頁操作總表
| Domain | 核心問題 | 快速辨識 | 常見失衡 | 第一診斷問題 | 核心槓桿 | 最小行動 | 回饋指標 |
|---|---|---|---|---|---|---|---|
| D1 Survival｜生存 | 我安全嗎？ | 怕、躲、僵、攻擊 | 過度警報、防衛 | 我到底怕失去什麼？ | 降低真實風險 | 把威脅寫成具體事件 | 警報是否下降？ |
| D2 Need｜需求 | 我要什麼？ | 想要、爭取、不滿 | 貪婪、匱乏、短視 | 我真正需要的是什麼？ | Need／Value排序 | 找最高Weight需求 | 選擇是否更清楚？ |
| D3 Self｜自我 | 我是誰？ | 自尊、防衛、證明 | 身份僵化 | 哪個身份正在被威脅？ | Self Distancing | 把「我是」改成「我現在」 | 防衛是否下降？ |
| D4 Social｜群體 | 別人怎麼看我？ | 比較、嫉妒、從眾 | 被群體綁架 | 如果沒人看，我還會選嗎？ | Reference Reset | 換比較基準 | 自主性是否提高？ |
| D5 Relationship｜關係 | 我能相信你嗎？ | 依附、討好、衝突 | 控制、依賴、失信 | 這是愛、需要、恐懼還是交換？ | Boundary＋Repair | 說清一個需求／界線 | 信任是否改善？ |
| D6 Power｜權力 | 我有選擇嗎？ | 控制、依賴、無力 | 權力不對稱 | 誰掌握資源與退出權？ | Options | 增加一個替代方案 | Choice Space是否增加？ |
| D7 Cognition｜認知 | 我看對了嗎？ | 絕對化、合理化、偏誤 | 把Model當Reality | 還有第二種解釋嗎？ | Second Representation | 生成3個解釋 | 預測是否更準？ |
| D8 Evolution｜更新 | 我願意改嗎？ | 否認、重複、甩鍋 | 模型僵化 | Reality在哪裡不同意我？ | Prediction Error | 改一個Node再測 | 新模型是否更準？ |
## 二｜D1 SURVIVAL｜生存／避害／安全
核心Node｜Survival／Threat／Fear／Safety／Loss／Scarcity／Defense。
生成鏈｜Signal→Threat Prediction→Predicted Loss→Fear→Attention Narrowing→Defense→Action。
### 看到這些訊號就啟動D1
我很怕。
我一定要趕快處理。
不能失去。
事情一定會很糟。
我要逃。
我要反擊。
我腦中一直想最壞結果。
### 七步操作
① FACT｜現在真正發生什麼？
② THREAT｜真正威脅是什麼？
③ LOSS｜我預測會失去什麼？
④ PROBABILITY｜真的發生機率是多少？
⑤ CAPACITY｜即使發生，我有哪些資源？
⑥ ACTION｜現在最小可控行動是什麼？
⑦ FEEDBACK｜做完後Risk真的下降嗎？
### Prediction Error
Prediction｜「如果X發生，我就完了。」
Reality｜X真的發生後，可能只是造成部分損失。
Update｜Threat存在≠全面崩潰。
### 核心槓桿
降低Uncertainty。
增加Information。
增加Resource Buffer。
增加Options。
增加Recovery Capacity。
### 能力
Threat Detection。
Risk Assessment。
Uncertainty Tolerance。
Safety Building。
Adaptive Capacity。
### 金句
安全感的最高階，不是確定壞事永遠不發生，而是知道發生變化後自己仍有能力應對。
## 三｜D2 NEED／VALUE｜需求／慾望／利益
核心Node｜Need／Desire／Value／Interest／Reward／Self-interest／Altruism／Reciprocity。
生成鏈｜Need→Value→Weight→Reward Prediction→Priority→Choice。
### 看到這些訊號就啟動D2
我就是想要。
為什麼都是他得到？
這樣對我有什麼好處？
我付出這麼多。
為什麼沒有人回報？
### 七步操作
① WANT｜我表面想要什麼？
② NEED｜底層真正需要什麼？
③ VALUE｜這代表什麼價值？
④ WEIGHT｜重要性0～10？
⑤ COST｜我要付什麼成本？
⑥ ALTERNATIVE｜還有其他滿足方式嗎？
⑦ LONG TERM｜這個選擇三個月／三年後仍值得嗎？
### 需求拆解
我要錢→可能是Safety／Freedom／Status。
我要被稱讚→可能是Recognition／Self Value。
我要對方聽話→可能是Control／Certainty。
我要成交→可能是Income／Achievement／Validation。
### Prediction Error
Prediction｜「得到X，我就會滿足。」
Reality｜得到X後仍然空缺。
Update｜表面Want≠核心Need。
### 核心槓桿
Need Clarification。
Value Ranking。
Delayed Reward。
Mutual Value。
Incentive Alignment。
### 能力
Need Detection。
Value Mapping。
Cost-Benefit Analysis。
Long-term Optimization。
Value Creation。
### 金句
成熟不是沒有慾望，而是知道哪一個需求值得被放大、哪一個需求不能掌握方向盤。
## 四｜D3 SELF｜身份／自尊／自我模型
核心Node｜Identity／Self-esteem／Self Model／World Model／Value Model／Meaning。
生成鏈｜Experience→Memory→Belief→Self Model→Identity→Prediction→Behavior。
### 看到這些訊號就啟動D3
我就是不行。
我一直都是這樣。
他看不起我。
我不能輸。
我一定要證明自己。
如果我做不到，我就沒有價值。
### 七步操作
① EVENT｜到底發生什麼？
② IDENTITY｜我把事件解讀成「我是什麼人」？
③ EVIDENCE｜證據真的足夠嗎？
④ STATE｜這是Identity還是Temporary State？
⑤ ALTERNATIVE｜還有哪些Self Representation？
⑥ ACTION｜哪個小行動可以產生新Evidence？
⑦ UPDATE｜新Evidence是否足以更新Self Model？
### 語言轉換
我是失敗者→這次結果沒有達標。
我英文很差→目前某些英文Node還沒掌握。
我沒能力→目前缺某項Skill。
沒人愛我→這段關係目前沒有提供我需要的連結。
### Prediction Error
舊Model｜「我做不到。」
Action｜完成一個小任務。
Reality｜做到了。
Error｜Self Model過度負面。
Update｜「我不是不行，我有尚未建立的能力。」
### 核心槓桿
Self Distancing。
Evidence。
Identity Flexibility。
Capability Building。
### 能力
Identity Awareness。
Belief Updating。
Value Clarification。
Self Reconstruction。
### 金句
你不是你的舊模型；你是那個能看見模型、測試模型、更新模型的人。
## 五｜D4 SOCIAL｜比較／地位／歸屬／群體
核心Node｜Comparison／Jealousy／Status／Belonging／Conformity／Authority／Norm。
生成鏈｜Social Input→Reference Point→Comparison→Status／Belonging Prediction→Emotion→Behavior。
### 看到這些訊號就啟動D4
大家都有。
別人會怎麼看？
為什麼他比我好？
老師都這樣說。
大家都這樣做。
我怕被排擠。
### 七步操作
① REFERENCE｜我正在跟誰比較？
② DIMENSION｜比較哪一個維度？
③ FAIRNESS｜比較條件相同嗎？
④ VALUE｜嫉妒透露我重視什麼？
⑤ NORM｜這真的是我的Value，還是群體Norm？
⑥ INDEPENDENT TEST｜如果沒有人知道，我還會選嗎？
⑦ RESET｜換一個更合理Reference。
### Prediction Error
Prediction｜「大家都這樣，所以一定是對的。」
Reality｜群體也可能集體判斷錯誤。
Update｜Social Evidence≠Truth。
### 嫉妒轉換
嫉妒
→不要先羞辱自己
→問「他擁有什麼是我也重視的？」
→Hidden Value
→Skill Gap
→Learning Target。
### 核心槓桿
Reference Reset。
Norm Awareness。
Independent Verification。
### 能力
Social Signal Reading。
Comparison Calibration。
Group Pressure Resistance。
Independent Judgment。
### 金句
不要讓別人的位置決定你的價值；讓別人的結果成為你理解條件與可能性的資料。
## 六｜D5 RELATIONSHIP｜依附／信任／愛／界線
核心Node｜Attachment／Trust／Love／Reciprocity／Boundary／Conflict／Repair。
生成鏈｜Need→Expectation→Prediction→Interaction→Feedback→Trust／Distrust→Pattern→Attractor。
### 看到這些訊號就啟動D5
為什麼他不懂我？
我為他做這麼多。
我怕他離開。
我不敢拒絕。
每次最後都變成這樣。
### 七步操作
① FACT｜他實際做了什麼？
② NEED｜我真正需要什麼？
③ EXPECTATION｜我原本期待什麼？
④ BOUNDARY｜哪些是我的責任？哪些是他的？
⑤ TRUST｜長期Behavior Evidence如何？
⑥ PATTERN｜這是一次事件還是重複模式？
⑦ REPAIR｜雙方有沒有修復能力？
### 信任公式
Trust≈Ability＋Integrity＋Consistency＋Repair。
### 關係四分法
有愛＋有界線→健康連結。
有愛＋無界線→容易依賴／耗竭。
無愛＋有界線→功能性關係。
無愛＋無界線→高風險混亂。
### Prediction Error
Prediction｜「只要我付出更多，他就會改。」
Reality｜更多付出可能反而強化原Pattern。
Update｜Love≠Unlimited Responsibility。
### 核心槓桿
Clear Need。
Boundary。
Reciprocity。
Trust Calibration。
Repair。
### 能力
Attachment Awareness。
Boundary Setting。
Conflict Repair。
Trust Calibration。
Co-evolution。
### 金句
好的關係不是永遠沒有Prediction Error，而是雙方有能力利用Difference修復彼此的模型。
## 七｜D6 POWER｜資源／控制／依賴／制度
核心Node｜Resource／Information／Dependency／Control／Power／Options／Exit／Institution。
生成鏈｜Resource Asymmetry→Dependency→Power→Choice Constraint→Behavior。
### 看到這些訊號就啟動D6
我沒有辦法。
只能聽他的。
他掌握所有資訊。
我不敢拒絕。
離開的成本太高。
### 七步操作
① RESOURCE｜誰掌握關鍵資源？
② INFORMATION｜誰知道得更多？
③ DEPENDENCY｜誰更依賴誰？
④ OPTION｜我有哪些替代方案？
⑤ EXIT｜如果退出，成本是多少？
⑥ BOUNDARY｜最低可接受條件？
⑦ BUILD｜如何增加自己的選擇權？
### 權力公式
Power≈Resources＋Information＋Alternatives＋Credibility＋Exit Capacity。
### 降低依賴五法
增加資訊。
增加能力。
增加資源。
增加支持網絡。
增加替代方案。
### Prediction Error
Prediction｜「我完全沒有選擇。」
Reality｜可能只是目前Options太少。
Update｜無力感≠零選項。
### 核心槓桿
Information。
Resources。
BATNA。
Exit Option。
Institution。
Accountability。
### 能力
Power Mapping。
Negotiation。
Boundary Enforcement。
Resource Building。
Institution Design。
### 金句
真正的自由不只是敢說不，而是建立說不之後仍能活下去的能力與選項。
## 八｜D7 COGNITION｜表徵／語言／偏誤／預測
核心Node｜Attention／Representation／Language／Evidence／Bias／Rationalization／Prediction。
生成鏈｜Reality→Observation→Representation→Language→Attention→Evidence Selection→Prediction。
### 看到這些訊號就啟動D7
一定是這樣。
他就是故意的。
永遠都不會變。
大家都針對我。
我早就知道。
### 七步操作
① FACT｜攝影機會拍到什麼？
② REPRESENTATION｜我如何解釋？
③ ALTERNATIVE｜至少生成3個可能解釋。
④ EVIDENCE｜每個解釋有哪些支持／反證？
⑤ PROBABILITY｜不要用一定，改成機率。
⑥ PREDICTION｜如果模型正確，下一步應看到什麼？
⑦ TEST｜讓Reality判定。
### 語言Compiler
他就是自私→這個行為目前讓他自己的利益優先。
他不愛我→目前哪些Behavior讓我產生這個Prediction？
我一定會失敗→依目前Evidence，我估計成功率是多少？
他故意傷害我→故意是一個Hypothesis，需要Evidence。
### Prediction Error
Prediction｜「他一定會拒絕。」
Reality｜他接受。
Error｜舊Model錯。
錯誤反應｜找理由維護舊Model。
高階反應｜降低舊Model Weight。
### 核心槓桿
Second Representation。
Probabilistic Language。
Evidence Testing。
Counterexample。
### 能力
Representation Fluidity。
Bias Detection。
Probabilistic Thinking。
Prediction Calibration。
### 金句
不要把第一個表徵當Reality；真正的自由從第二個可能解釋開始。
## 九｜D8 EVOLUTION｜回饋／誤差／更新／High Agency
核心Node｜Feedback／Difference／Prediction Error／Diagnosis／Reweight／Model Update／Retest／High Agency。
生成鏈｜Prediction→Action→Reality→Feedback→Error→Update→Retest。
### 看到這些訊號就啟動D8
怎麼又發生一樣的事？
明明都是別人的問題。
我知道，但是我做不到。
以前就是這樣。
沒有必要改。
### 七步操作
① PREDICTION｜我原本預測什麼？
② REALITY｜實際發生什麼？
③ DIFFERENCE｜差多少？
④ LOCALIZE｜哪個Node猜錯？
⑤ REWEIGHT｜哪個舊信念權重太高？
⑥ UPDATE｜新模型是什麼？
⑦ RETEST｜下一次如何驗證？
### Prediction Error四級
L1｜看不到Error。
L2｜看到但怪別人。
L3｜看到自己的Model Error。
L4｜主動設計Experiment找Error。
### High Agency公式
Reality≠Prediction
→不崩潰
→不否認
→找Difference
→更新Model
→生成New Action。
### 核心槓桿
Feedback Speed。
Error Visibility。
Small Experiment。
Retest。
### 能力
Error Detection。
Error Localization。
Model Updating。
Action Generation。
High Agency。
### 金句
模型可以錯，但更新機制不能死。
## 十｜八大Domain真正的操作順序
不是每次都八個全部處理。
先Scan。
D1｜現在有真實安全威脅嗎？
↓
沒有重大威脅
D2｜真正Need是什麼？
↓
D3｜是否碰到Identity？
↓
D4｜是否受到Comparison／Group影響？
↓
D5｜是否是Relationship Pattern？
↓
D6｜是否存在Power／Dependency問題？
↓
D7｜我的Representation準嗎？
↓
D8｜Reality提供什麼Error？
這形成：
Safety
→Need

# ③ Human Influence OS｜人性×銷售×說服×管理×影響×談判
這六個主題其實不該分成六套零散技巧；把人性母體放在最上游後，可以統一成一個「Human Influence OS」：人性解釋行為，銷售完成價值交換，說服改變表徵與判斷，影響累積長期權重，談判重組利益與選項，管理則設計整個行為環境。
核心命題｜這六個領域表面不同，底層其實都在研究同一件事：人在什麼條件下，會改變Attention、Representation、Prediction、Choice與Behavior？
因此不要把它們分別背成六套話術。
應該建立一套共同的人類行為母體。
總鏈｜Human Nature→Need→Value→Representation→Trust→Prediction→Choice→Behavior→Feedback→Model Update。
## 一｜六大系統到底差在哪裡？

### 最重要的差異

## 三｜Human Nature｜人性是所有系統的上游
人性不是一套「如何看穿別人」的黑話。
更精準的定義是：
Human Behavior＝State×Need×Model×Environment×Incentive×Constraint×Feedback。
看到Behavior不要直接跳到Character。
先逆推：
他現在處於什麼State？

他害怕失去什麼？

有哪些Options？

01｜Need｜他需要什麼？
02｜Fear｜他怕失去什麼？
03｜Value｜什麼對他權重最高？
04｜Identity｜他正在保護什麼身份？
05｜Prediction｜他預測會發生什麼？
06｜Power｜他有哪些／沒有什麼選項？

理解這七題，後面五個系統才有基礎。
## 四｜SALES｜銷售不是把東西塞給別人，而是完成價值交換
低階銷售問：
怎麼讓他買？
高階銷售問：
他的Problem與我的Solution真的Match嗎？
核心鏈｜Problem→Need→Desired Outcome→Value→Trust→Risk→Friction→Decision→Exchange→Outcome。
### 銷售八個Node
01｜Problem｜真正問題。
02｜Need｜真正需求。
03｜Outcome｜想得到的結果。
04｜Value｜結果有多重要。
05｜Trust｜相信你嗎？
06｜Risk｜怕什麼？
07｜Friction｜什麼阻礙行動？
08｜Timing｜為什麼現在行動？
成交不是「話術夠強」。
可以先用診斷式假設表示：
Purchase Probability≈Need Fit×Value×Trust×Readiness÷Risk÷Friction。
### 銷售最重要能力
不是Talking。
而是Diagnosis。
差的業務一直介紹產品。
好的業務一直理解問題。
更好的業務甚至會告訴不適合的人：
「這個目前可能不適合你。」
短期少一筆成交。
長期增加Trust。
### 銷售Prediction Error
你以為｜價格太高。
Reality｜客戶其實不相信結果。
你以為｜產品功能不夠。
Reality｜客戶根本看不懂價值。
你以為｜需要折扣。
Reality｜真正缺的是Trust。
所以沒有成交不是答案。
沒有成交只是Feedback。
## 五｜PERSUASION｜說服的本質是Representation Update
低階說服＝把我的答案塞進你的腦。
高階說服＝讓你看到原本沒有看到的Evidence、Perspective與Option。
核心鏈｜Current Representation→New Evidence→Alternative Representation→Prediction Update→Choice。
例如：
舊表徵｜「這個APP又要叫我做更多題。」
新表徵｜「它不是增加題量，而是減少你浪費在已經會的題目上的時間。」
Reality沒變。
Representation改變。
Value Perception因此改變。
### 說服七個Node
01｜Attention｜先讓重要資訊被看到。
02｜Understanding｜先理解對方模型。
03｜Frame｜他現在如何表徵問題？
04｜Evidence｜缺少什麼證據？
05｜Alternative｜能否產生第二表徵？
06｜Autonomy｜保留拒絕權。
07｜Update｜讓對方自己形成新判斷。
### 低階vs高階
低階｜證明你錯。
高階｜增加你可以看見的Evidence。
低階｜製造Fear。
高階｜降低Uncertainty。
低階｜隱藏反證。
高階｜說明Boundary。
低階｜逼迫Yes。
高階｜提高Decision Quality。
真正穩定的說服不是讓對方「輸掉辯論」。
而是讓Model得到更好的Information。
## 六｜INFLUENCE｜影響不是一次說服，而是長期Weight形成
說服可能發生一次。
影響通常是Time Series。
你長期說什麼。
你長期做什麼。
你如何處理錯誤。
你是否一致。
你是否真的產生成果。
最後決定別人給你的訊息多高Weight。
核心鏈｜Consistency→Credibility→Trust→Weight→Influence。
### 影響力七個來源
01｜Expertise｜專業能力。
02｜Integrity｜誠信。
03｜Consistency｜一致性。
04｜Outcome｜實際成果。
05｜Relationship｜關係。
06｜Identification｜價值／身份認同。
07｜Network｜社會證據。
所以：
Followers≠Influence。
曝光≠Influence。
聲量≠Influence。
真正Influence＝你的訊息進入對方決策模型時，被賦予多少可信權重。
### 最高階影響力
不是讓別人越來越需要你。
而是讓別人因為你的影響，Decision Quality與Agency提高。
## 七｜NEGOTIATION｜談判不是打敗對方，而是重新設計交換結構
表面談判：
你要100。
我只給60。
底層談判其實包含：
Interest。
Constraint。
Priority。
Alternative。
Information。
Time。
Risk。
Power。
Relationship。
核心區分：
Position＝我要什麼。
Interest＝為什麼我要。
只談Position容易形成零和。
找到Interest才可能創造新Option。
### 談判八個Node
01｜Position｜表面要求。
02｜Interest｜真正利益。
03｜Priority｜哪些最重要？
04｜Constraint｜什麼不能做？
05｜BATNA｜談不成時最佳替代方案。
06｜Reservation Point｜最低可接受邊界。
07｜Option｜還有哪些交換組合？
08｜Relationship｜這是一次交易還是長期合作？
### 談判核心鏈
Position
↓
Interest
↓
Priority
↓
Constraint
↓
BATNA
↓
Options
↓
Trade-offs
↓
Agreement／Exit。
### 談判最重要的人性能力
不要只聽「我要什麼」。
要聽「為什麼這件事對他重要」。
價格背後可能是公平。
拒絕背後可能是Risk。
強硬背後可能是Identity。
拖延背後可能是Uncertainty。
要求控制背後可能是Fear。
找到Generator，Option Space才會增加。
### Power核心
談判力不只是聲音大。
Negotiation Power≈Alternatives＋Information＋Resources＋Time＋Credibility＋Exit Capacity。
所以最好的談判準備之一不是學一句厲害話術。
而是增加BATNA。
## 八｜MANAGEMENT｜管理不是控制人，而是設計Behavior Environment
這是六個系統中最容易被誤解的一個。
低階管理：
盯人。
催人。
罵人。
獎懲。
高階管理：
Goal。
Role。
Information。
Resource。
Incentive。
Feedback。
Boundary。
Correction。
Environment。
管理者真正管理的不是「人格」。
而是讓好行為更容易發生的Structure。
### 管理八個Node
01｜Goal｜目標清楚嗎？
02｜Role｜誰負責什麼？
03｜Capability｜他會做嗎？
04｜Resource｜有資源嗎？
05｜Incentive｜誘因是否對齊？
06｜Friction｜什麼讓正確行動變困難？
07｜Feedback｜多久知道做得對不對？
08｜Correction｜錯了如何修正？
### 員工不做，不要立刻判斷懶
可能是：
不知道要做。
不知道怎麼做。
沒有時間。
沒有資源。
優先順序衝突。
做了沒有回饋。
KPI獎勵錯誤行為。
害怕犯錯。
權責不對稱。
認為做了沒有意義。
這就是Character Judgment→Structural Diagnosis。
## 九｜六大系統放在同一個案例就非常清楚
假設：
「學生不願意使用英文學習APP。」
人性｜他為什麼不想用？
可能是怕失敗、覺得麻煩、沒有立即獎賞。
說服｜他現在怎麼Represent APP？
「又多一份功課。」
重新表徵：
「幫你少做不必要的題目。」
影響｜為什麼相信老師？
來自長期公平、一致、能力與實際幫助。
銷售｜即使學生沒有付錢，也存在Value Exchange。
學生付出時間與Attention。
系統必須回報足夠Learning Value。
談判｜學生想要自由，老師想要練習。
可以重新設計：
完成核心Minimum Task後，後面保留選擇權。
管理｜如何不用每天追？
建立：
固定入口→明確任務→即時Feedback→進度可見→錯題補強→Retest。
這時「學生不使用APP」就從人格問題變成System Design Problem。

## 十二｜六種人最容易犯的錯
只懂人性的人｜容易變成犬儒，什麼都解釋成利益。
只懂銷售的人｜容易過度追求成交。
只懂說服的人｜容易把每件事變成辯論。
只懂影響的人｜容易追求聲量與權威。
只懂談判的人｜容易把所有關係理解成博弈。
只懂管理的人｜容易把人當成流程零件。
真正成熟是六者互相制衡。
理解人性，但不失去善意。
懂銷售，但不賣不適合的東西。
懂說服，但保留對方拒絕權。
有影響力，但不製造依賴。
懂談判，但不破壞長期信任。
會管理，但不剝奪人的Agency。

## 十四｜共同診斷八問
遇到任何「為什麼他不做我要的事？」時，不要先加大說服力。
先問：
01｜STATE｜他現在處於什麼狀態？
02｜NEED｜他真正需要什麼？
03｜VALUE｜什麼對他權重最高？
04｜MODEL｜他如何理解現在的Reality？
05｜TRUST｜他相信誰、相信什麼Evidence？
06｜INCENTIVE｜目前什麼行為對他最划算？

08｜FEEDBACK｜什麼結果正在強化他的行為？
八題問完，通常問題已經比「他為什麼不聽我的」清楚很多。

如果「看懂但不相信」。
→查Evidence／Trust。

## 十七｜影響別人的最高槓桿不是話術
第一層｜改Language。

第三層｜改Evidence。
第四層｜改Incentive。
第五層｜改Options。

越往下越接近Structure。
因此：

讓Feedback快速可見＝更高槓桿。
讓人自己建立能力＝最高階之一。
## 十八｜Influence Ethics｜影響力邊界
所有六個領域都要通過五個檢查。
Truth｜資訊是否真實？
Transparency｜重要資訊是否透明？
Autonomy｜對方是否可以自由拒絕？
Value｜對方是否真正得到價值？
Reversibility｜如果角色互換，我是否仍認為公平？
五題有任何一題嚴重不成立，就可能已經從Influence滑向Manipulation。

Influence｜增加Capability。
Manipulation｜只追求我的Outcome。
Influence｜尋找Mutual Value。
Manipulation｜不允許Prediction被Reality推翻。

## 二十二｜最終母體
Human Nature是地基。
Sales是價值交換。
Persuasion是表徵更新。
Influence是信任權重。
Negotiation是利益與選項重組。
Management是行為環境設計。
Feedback是Reality回來說話。
Prediction Error是系統發現自己猜錯。
Model Update是智慧真正發生的地方。
所以六大領域最後可以壓縮成：
Understand Human
→Understand Need
→Understand Model
→Create Value
→Build Trust
→Improve Representation
→Align Incentives
→Expand Options
→Negotiate Fair Exchange
→Design Environment
→Enable Action
→Observe Feedback
→Detect Error
→Update Model
→Retest。
### 最終公式
Human Influence＝Understanding×Trust×Value×Clarity×Agency×Structure×Feedback。
如果Understanding＝0，再強的話術都可能說錯問題。
如果Trust＝0，資訊很難取得足夠Weight。
如果Value＝0，成交只能依賴壓力。
如果Clarity＝0，對方不知道為何行動。
如果Agency＝0，影響容易滑向控制。
如果Structure＝0，行為難以持續。
如果Feedback＝0，整套系統不知道自己到底有沒有用。
### 最高階智慧
最低階的問題是：「我要怎麼讓他聽我的？」
再高一層是：「我要怎麼說服他？」
再高一層是：「他真正需要什麼？」
再高一層是：「他的Model為什麼產生現在的選擇？」
再高一層是：「我們能不能重新設計Structure，讓雙方都得到更好的Outcome？」
最高階則是：「Reality回來之後，如果證明我的人性判斷、銷售假設、說服方式、管理制度、影響策略或談判模型錯了，我能不能更新？」
真正的高手不是永遠能說服別人。
而是理解人性、創造價值、建立信任、尊重自主、設計結構，並且永遠保留讓Reality推翻自己模型的能力。

65～80｜結構相對完整｜開始尋找Scaling Bottleneck。

不要八個Domain一起改。
先找最低分。

公式｜Lowest Domain→Bottleneck Node→Minimum Action→Metric→Feedback→Update。

## 最高階判準
不要問「我的行銷夠不夠厲害？」
問「我的Prediction準不準？」
不要問「為什麼客戶不買？」
問「Value、Trust、Risk、Clarity、Friction，哪個Node出了問題？」
不要問「怎麼控制客戶？」
問「怎麼讓客戶在充分資訊與自由選擇下仍然認為這筆交換值得？」
不要問「怎麼讓會員離不開？」
問「怎麼讓會員即使有能力離開，仍然因為持續得到Value而選擇留下？」
不要把Conversion當終點。
Conversion只是一次Prediction成功。
Retention證明Value可能存在。
Outcome證明產品真的有效。
Referral證明Value高到客戶願意承擔自己的信用替你傳播。
真正強大的商業不是最懂操控人性。
而是最懂人性，因此最能建立「客戶得到結果、企業得到利潤、信任持續累積、系統可以更新」的正向飛輪。
# ⑤ 為何越懂人性，越懂商業？
因為商業表面上是在賣產品。
更底層其實是在處理「人的需求如何轉化成選擇」。
產品只是載體。
價格只是交換條件。
行銷只是資訊介面。
成交只是Behavior。
真正的上游是Human Nature。
所以更完整的商業鏈不是「產品→廣告→成交」。
而是「人性→需求→價值權重→痛點／渴望→預測→信任→選擇→交換→體驗→回購→推薦」。
懂人性，不代表學會操控人。
真正高階的懂人性，是更準確地知道「人真正需要什麼、害怕什麼、重視什麼、為什麼相信、為什麼不行動」。
## 一｜本體層｜商業的本質其實是價值交換
沒有人的需求，就沒有市場。
沒有價值差異，就沒有交換。
沒有交換，就沒有商業。
所以商業最底層不是產品。
而是Value Exchange。
一個人願意付錢，是因為他主觀預測：
「得到這個東西之後的價值＞我要付出的成本。」
因此：
購買＝Predicted Value＞Predicted Cost。
這裡的Cost也不只是錢。
時間是Cost。
學習是Cost。
麻煩是Cost。
風險是Cost。
不確定性是Cost。
害怕被騙是Cost。
改變習慣也是Cost。
所以有時候不是產品不好。
而是Customer Friction太高。
## 二｜結構層｜人性八大Domain，其實都直接對應商業
### D1｜SURVIVAL｜人想降低什麼風險？
保險賣的是風險降低。
健康商品賣的是健康風險管理。
資安賣的是資料安全。
防曬賣的是傷害降低。
商業問題｜客戶害怕失去什麼？
### D2｜NEED／VALUE｜人真正想得到什麼？
省錢。
省時間。
方便。
漂亮。
健康。
成就。
自由。
收入。
能力。
陪伴。
商業問題｜客戶真正買的是什麼結果？
### D3｜SELF｜這個產品讓我成為誰？
精品不只是包包。
健身不只是肌肉。
課程不只是知識。
教育APP不只是題目。
人可能同時在購買一個Identity。
「我是重視健康的人。」
「我是願意投資孩子教育的父母。」
「我是有能力進步的學生。」
商業問題｜使用這個產品之後，客戶如何重新定義自己？
### D4｜SOCIAL｜別人怎麼看我？
評價。
排行榜。
見證。
銷量。
社群。
朋友推薦。
KOL。
都在降低Social Uncertainty。
商業問題｜有哪些可信的Social Evidence？
### D5｜RELATIONSHIP｜我相信誰？
人不是只買產品。
人也在買Trust。
所以同樣產品，不同的人介紹，成交率可能完全不同。
IP商業真正累積的是：
Consistency→Trust→Lower Perceived Risk→Exchange。
商業問題｜為什麼客戶願意相信你？
### D6｜POWER｜客戶有沒有選擇權？
低階商業利用資訊不對稱。
高階商業降低資訊不對稱。
低階商業讓客戶依賴。
高階商業增加客戶能力。
因此長期品牌不能只問：
「如何讓他離不開我？」
更好的問題是：
「如何讓他因為真的得到價值，所以主動回來？」
### D7｜COGNITION｜客戶如何理解產品？
再好的產品，如果Representation錯了，也賣不出去。
專業名稱不等於客戶理解。
功能不等於價值。
成分不等於結果。
因此商業需要做一個重要轉譯：
Feature→Mechanism→Benefit→Life Outcome。
不要只說「這裡有1000題」。
要讓學生理解：
「你不用再猜自己哪裡不會，系統會幫你找到最值得補的一個洞。」
Representation一變，Value Perception就變。
### D8｜EVOLUTION｜買完之後真的有效嗎？
這是商業最容易被忽略的一層。
第一次成交靠Prediction。
第二次成交開始靠Feedback。
客戶原本預測「這會幫助我」。
使用後Reality回傳Feedback。
如果Reality＞Prediction，就容易形成驚喜。
如果Reality≈Prediction，就形成穩定信任。
如果Reality＜Prediction，就產生負向Prediction Error。
所以長期商業不是把Expectation拉到最高。
而是讓Reality持續匹配甚至超越合理Expectation。
## 三｜機制層｜為什麼懂人性的人比較容易看懂商業？
因為他看到的不是「商品」。
他看到的是商品背後的Behavior Generator。
別人看到健身房。
他看到健康、外貌、身份、社交與自我效能。
別人看到補習班。
他看到焦慮、競爭、未來、安全感與父母責任。
別人看到精品。
他看到身份、稀缺、地位、審美與Social Signal。
別人看到遊戲。
他看到即時Feedback、成就、挑戰、進度與掌控感。
別人看到短影音。
他看到Novelty、Variable Reward、Attention與Social Validation。
別人看到AI。
他看到降低認知成本、提高產出速度與擴張Agency。
所以高手不是問：
「這個產品有什麼功能？」
而是問：
「這個產品接上了人性的哪一個Node？」
## 四｜同一個產品，其實可以接不同人性Node
以英文學測APP為例。
如果只從產品思維看：
題庫很多。
單字很多。
有解析。
有測驗。
但從人性思維看：
D1｜降低「考不好怎麼辦」的不確定性。
D2｜滿足「我想提高分數」。
D3｜從「我英文很爛」更新成「我其實可以進步」。
D4｜看到自己的相對進度。
D5｜得到老師與系統支持。
D6｜學生擁有自主學習選擇權。
D7｜知道自己真正錯在哪一個Node。
D8｜作答→Feedback→Error→補強→Retest。
這時你賣的已經不是「題庫APP」。
你提供的是：
「把不知道自己哪裡不會，變成知道下一步該練什麼。」
這就是商業價值的升維。
## 五｜痛點為什麼有效？
因為Pain會提高Attention Weight。
但這裡有一條非常重要的界線。
低階行銷：
放大恐懼→製造焦慮→逼迫成交。
高階行銷：
辨識真實問題→精準命名→提供可驗證解法。
所以真正好的痛點文案不是：
「你再不買就完了。」
而是：
「你可能不是不努力，而是一直在錯的Node上用力。」
前者利用Threat。
後者降低Model Error。
## 六｜為什麼「信任」比流量更值錢？
流量只是Attention。
Attention不等於Trust。
Trust不等於Purchase。
Purchase也不等於Retention。
完整鏈條應該是：
Attention→Understanding→Relevance→Trust→Trial→Experience→Outcome→Retention→Referral。
所以100萬陌生流量未必比1000個高度信任你的會員有價值。
因為Trust會降低交易摩擦。
Trust↑→Perceived Risk↓→Decision Cost↓→Trial Probability↑。
但信任不是靠一直說「相信我」。
信任來自：
承諾與結果一致。
資訊透明。
不誇大。
承認邊界。
長期穩定。
出錯願意修正。
## 七｜為什麼懂「利益」就懂合作？
因為合作不能只建立在善意。
真正穩定的合作通常需要：
A得到價值。
B得到價值。
客戶得到價值。
系統仍然能持續運作。
這叫Incentive Alignment。
最差的商業模式是：
公司贏、客戶輸。
這種模式短期可能賺錢，但熵會持續增加。
客訴增加。
信任下降。
流失增加。
獲客成本上升。
品牌耗損。
比較好的模式是：
公司贏＋客戶贏。
更高階是：
公司贏＋客戶贏＋合作夥伴贏＋系統總價值增加。
這就是高維利他可以與商業真正接上的地方。
## 八｜為什麼懂「身份」就懂品牌？
商品回答：
「你買了什麼？」
品牌更深層回答：
「你是哪一種人？」
Apple早期不是只在賣電腦。
Nike也不只是鞋。
品牌強大的地方，在於商品逐漸與Identity綁定。
因此品牌公式可以理解成：
Product Value＋Meaning＋Identity＋Community＋Repeated Experience→Brand。
小型IP也是如此。
真正的IP不是一直曝光自己。
而是讓某一群人看到你，就知道：
「這裡代表某一套價值與解決問題的方法。」
## 九｜為什麼懂「摩擦」就懂成交？
很多人以為：
沒有成交＝客戶不想要。
其實可能只是Friction太高。
不知道怎麼買。
不知道怎麼付款。
不知道適不適合自己。
資訊太多。
選項太多。
步驟太多。
害怕買錯。
害怕被騙。
不知道下一步。
所以成交優化不一定是增加說服。
有時候只是減少摩擦。
公式：
Conversion≈Value×Trust÷Friction。
## 十｜為什麼懂「獎賞」就懂產品黏性？
人喜歡知道：
「我有沒有進步？」
因此優秀產品通常都有Feedback。
進度條。
連續登入。
完成率。
積分。
等級。
測驗結果。
前後比較。
但真正高品質的設計不是讓人上癮。
而是讓Feedback協助使用者建立能力。
低階黏性＝讓人一直回來消耗Attention。
高階黏性＝讓人一直回來完成Growth Loop。
## 十一｜為什麼懂「預測誤差」就懂產品迭代？
企業最大的錯誤之一是相信自己的想像。
「客戶一定需要這個。」
這只是Prediction。
真正的商業需要Reality Test。
Prediction｜客戶應該喜歡A。
Action｜推出A。
Feedback｜客戶很少使用。
Prediction Error｜我們猜錯了。
Model Update｜也許真正需要的是B。
Retest｜推出最小版本B。
所以創業本身就是：
Hypothesis→Experiment→Feedback→Error→Update。
真正危險的企業不是產品第一次做錯。
而是Reality已經告訴它錯了，它還不更新。
## 十二｜因此，人性其實是商業的上游母體
Human Nature。
↓
Need。
↓
Pain／Desire。
↓
Value。
↓
Attention。
↓
Representation。
↓
Trust。
↓
Prediction。
↓
Decision。
↓
Exchange。
↓
Experience。
↓
Feedback。
↓
Retention。
↓
Referral。
這就是為什麼越懂人性，通常越容易理解商業。
因為商業最後不是企業跟市場交易。
而是一群人的Need、Prediction、Trust與Value在進行交換。
## 十三｜但真正高階的商業，不是「拿捏人性」
「拿捏人性」仍然停留在控制論的低階版本。
它的目標是：
如何讓別人做我要他做的事？
更高階的問題是：
如何讓Customer Value與Business Value對齊？
低階商業｜利用弱點。
中階商業｜滿足需求。
高階商業｜解決問題。
更高階商業｜增加能力。
最高階商業｜讓客戶、企業與生態系統共同增加價值。
因此：
Manipulation→短期Conversion。
Value Creation→長期Compounding。
## 十四｜你的人性八大Domain可以直接變成Business OS八問
D1 Survival｜客戶怕失去什麼？
D2 Need｜客戶真正想得到什麼？
D3 Self｜客戶想成為什麼樣的人？
D4 Social｜誰影響他的選擇？
D5 Relationship｜他為什麼相信你？
D6 Power｜誰掌握資訊、資源與選擇權？
D7 Cognition｜他現在如何理解這個問題？
D8 Evolution｜使用後是否真的得到可觀察的改善？
只要一個商業模式能回答這八題，通常已經比只研究「怎麼寫廣告」高很多層。
## 十五｜Human Nature→Business總公式
Human Nature→Need。
Need→Value。
Value→Attention。
Attention→Representation。
Representation→Prediction。
Prediction＋Trust→Decision。
Decision→Exchange。
Exchange→Experience。
Experience→Feedback。
Feedback→Trust Update。
Trust Update→Retention／Exit。
Retention＋Outcome→Referral。
Referral→Network Effect。
Network Effect→Brand。
Brand→Lower Acquisition Friction。
最後形成正向飛輪。
## 十六｜商業真正的High Agency
不是問：
「我要怎麼讓更多人買？」
而是連續問：
「我正在解決什麼真實問題？」
「客戶真正的Bottleneck在哪裡？」
「哪個需求的Weight最高？」
「客戶為什麼現在沒有行動？」
「是Value不足、Trust不足，還是Friction太高？」
「我的Solution真的改善Reality了嗎？」
「什麼Feedback證明我的模型是錯的？」
「下一輪要更新哪一個Node？」
這時商業就不再只是銷售技巧。
而是一套持續提高Prediction Accuracy的系統。
## 十七｜最終結論
越懂人性，不一定越會賺錢。
真正的中間變數是：
懂人性→更準確辨識需求→更準確創造價值→更低摩擦地傳遞價值→建立信任→取得Feedback→持續更新→形成複利。
所以不是：
懂人性＝會操控＝會賺錢。
而是：
Human Understanding→Better Prediction→Better Value Creation→Better Product→Better Communication→Better Trust→Better Exchange→Better Feedback→Better Business Model。
商業最高階不是讓人買更多。
而是更精準地找到「人真正需要的改變」，並建立一個企業有利潤、客戶有成果、關係有信任、系統能持續的交換結構。
懂人性的人，看見需求。
懂結構的人，看見交換。
懂機制的人，看見槓桿。
懂回饋的人，看見誤差。
懂更新的人，才能穿越市場變化。
所以真正值得追求的不是「最會拿捏人性」。
而是「最能理解人性，又最能把理解轉化成長期共同價值」。

## DOMAIN 1｜SURVIVAL｜生存・避害・安全系統
核心問題｜當人感受到威脅、匱乏與損失時，人性如何改變？
本體｜生命系統首先必須維持自身存在。
結構｜威脅→恐懼→避害→安全需求→資源保護→行為收縮。
核心Node｜生存、避害、恐懼、安全感、損失、匱乏、資源、不確定性。
對應原55節｜03生存、09恐懼、10安全感、13損失厭惡、37防禦人性的惡。
核心機制｜Threat↑→Attention Narrowing↑→Short-term Survival Weight↑→Long-term Value Weight↓。
人在安全時與危險時可能呈現完全不同的行為。
因此不能把壓力狀態下的Behavior直接等同完整人格。
但理解Threat Mechanism不等於取消責任。
理解機制是為了提高Prediction Accuracy。
界線則是為了降低Risk。
舊模式｜他怎麼突然變壞了？
新模式｜目前什麼Threat正在改變他的Value Weight？
舊模式｜不要害怕。
新模式｜恐懼正在預測什麼Loss？
舊模式｜我要得到永遠的安全。
新模式｜我要提高面對不確定性的Adaptive Capacity。
能力｜Threat Detection、Risk Assessment、Loss Mapping、Uncertainty Tolerance、Safety Building、Resource Buffer、Adaptive Capacity。
智慧｜真正的安全不是世界永遠不變，而是世界改變時我仍有能力重新組織自己。
金句｜恐懼不是敵人，而是系統對未來損失的預測。
金句｜匱乏會縮小人的時間尺度。
金句｜安全感的最高形式不是Certainty，而是Adaptability。
DOMAIN 1公式｜Threat→Predicted Loss→Fear→Protection Strategy→Behavior→Feedback。
## DOMAIN 2｜NEED｜需求・慾望・利益・獎賞系統
核心問題｜人到底想得到什麼？
本體｜行為背後通常存在某種Value Seeking。
結構｜Need→Value→Reward Prediction→Incentive→Choice→Behavior。
核心Node｜需求、慾望、獎賞、利益、自利、利他、互惠、公平、價值交換。
對應原55節｜04自利、05利益、06價值交換、07利己→利他、08利他vs討好、47 Altruism OS。
核心機制｜人會保護自己主觀認為重要的Value。
Value不只是金錢。
安全是Value。
面子是Value。
身份是Value。
關係是Value。
孩子是Value。
自由是Value。
信念也是Value。
因此看似不理性的Behavior，在當事人的Value Function中可能具有內部合理性。
真正識人的方法不是只聽Reason。
而是觀察他願意為什麼付Cost。
Words＝低成本訊號。
Choices＝中成本訊號。
Sacrifice＝高成本訊號。
Repeated Costly Behavior＝高可信度訊號。
舊模式｜人就是自私。
新模式｜他目前正在最佳化哪個Value？
舊模式｜利己與利他互相衝突。
新模式｜時間尺度改變後，合作與利他可能成為更高階利己。
舊模式｜幫助別人就是善良。
新模式｜真正的利他應提高對方能力，而不是增加依賴。
能力｜Need Detection、Value Mapping、Incentive Analysis、Cost Signal Reading、Reciprocity Design、Value Creation、Long-term Optimization。
智慧｜不要只問一個人說自己重視什麼，要看他願意為什麼付代價。
金句｜行為會暴露真正的權重。
金句｜利他讓別人更強，討好讓自己更空。
金句｜低階自利搶價值，中階自利交換價值，高階自利創造價值。
DOMAIN 2公式｜Need→Value→Weight→Reward Prediction→Incentive→Choice。
## DOMAIN 3｜SELF｜身份・自尊・內在模型系統
核心問題｜「我是誰」如何生成我的人性？
本體｜人不只保護生命與利益，也保護自己的Self Model。
結構｜Experience→Self Model→Identity→Value Weight→Prediction→Behavior。
核心Node｜Identity、Self Model、Self-esteem、Meaning、Belief、Identity Threat、Consistency、Self Protection。
對應原55節｜14身份、29 Self Model、30 World Model、31 Value Model、25原生家庭。
核心機制｜Evidence一旦威脅Identity，人可能先防衛再處理Evidence。
很多爭論表面上在爭Facts。
底層其實在保護Self Model。
「我是失敗者。」
「我是不值得被愛的人。」
「我是不能犯錯的人。」
「我一定要照顧所有人。」
這些都可能從描述逐漸凝固成Identity。
Identity一旦僵化，就會改變Attention。
Attention再選擇支持Identity的Evidence。
最後形成Self-reinforcing Loop。
舊模式｜我就是這樣的人。
新模式｜這是我目前使用的Self Model。
舊模式｜別人不同意我就是否定我。
新模式｜Idea與Identity可以分離。
舊模式｜我要證明自己是對的。
新模式｜我要提高模型與Reality的一致度。
能力｜Identity Awareness、Self Distancing、Belief Updating、Value Clarification、Identity Flexibility、Evidence Tolerance、Self Reconstruction。
智慧｜真正成熟的身份不是永遠不變，而是具有核心穩定性與邊界可更新性。
金句｜你不是你的模型，你是可以更新模型的人。
金句｜很多人不是在保護真相，而是在保護「我是誰」。
金句｜自由不是沒有身份，而是不被舊身份囚禁。
DOMAIN 3公式｜Self Model→Attention→Evidence Selection→Prediction→Behavior→Self-confirmation／Update。
## DOMAIN 4｜SOCIAL｜比較・地位・歸屬・群體系統
核心問題｜別人如何進入我的大腦？
本體｜人類是高度社會化的預測系統。
結構｜Reference→Comparison→Status→Belonging→Norm→Conformity→Behavior。
核心Node｜比較、嫉妒、地位、歸屬、從眾、權威、Social Norm、Reference Point。
對應原55節｜11比較、12嫉妒、17從眾、18權威、38鬼谷子識人術。
核心機制｜人會把別人當成Reference Point。
Reference改變→主觀Value改變。
因此收入沒變也可能突然覺得自己很窮。
能力沒變也可能突然覺得自己很差。
嫉妒也可以被重新理解為Value Detector。
「他擁有什麼，是我其實很在乎的？」
從眾則是一種Social Prediction Shortcut。
「大家都這樣做」會被系統當成安全訊號。
權威則是External Model Borrowing。
人在不確定時會借用專家的Prediction降低運算成本。
舊模式｜不要跟別人比較。
新模式｜先看自己用了哪個Reference。
舊模式｜嫉妒很壞。
新模式｜嫉妒正在暴露哪個Hidden Value？
舊模式｜不要相信權威。
新模式｜可以借用權威，但必須保留Reality Verification。
能力｜Reference Awareness、Social Signal Reading、Norm Detection、Status Awareness、Independent Verification、Group Pressure Resistance、Social Calibration。
智慧｜成熟不是脫離群體，而是不把群體訊號誤認成Reality本身。
金句｜比較不可怕，無意識地選錯參照點才可怕。
金句｜嫉妒可能是尚未被承認的願望。
金句｜真正獨立不是拒絕所有權威，而是保留驗證權。
DOMAIN 4公式｜Social Input→Reference→Comparison→Status Prediction→Emotion→Behavior。
## DOMAIN 5｜RELATIONSHIP｜依附・信任・交換・愛・界線系統
核心問題｜兩個人的人性如何形成一個新的系統？
本體｜關係不是兩個固定人格相加，而是兩個Feedback System互相耦合。
結構｜Need→Expectation→Prediction→Interaction→Feedback→Trust→Pattern→Attractor。
核心Node｜依附、信任、愛、互惠、交換、界線、衝突、修復、Relationship Pattern。
對應原55節｜21信任、22人格、23關係、24愛情、25原生家庭、43 Relationship OS。
核心機制｜A的Behavior成為B的Input。
B的Response再成為A下一輪Input。
反覆循環最後形成Relationship Attractor。
追的人越追。
逃的人越逃。
控制的人越控制。
沉默的人越沉默。
最後雙方都以為「對方本來就是這樣」。
其實部分Behavior是Relationship System共同生成的。
Trust也不是一句「相信我」。
Trust≈Ability＋Integrity＋Consistency＋Repair。
舊模式｜找一個永遠不讓我失望的人。
新模式｜找一個失望發生後仍具有Repair Capacity的人。
舊模式｜愛就是沒有界線。
新模式｜成熟的愛需要Connection＋Boundary。
舊模式｜關係不好就是誰有問題。
新模式｜先找Interaction Loop。

不要問：怎麼讓他照我的意思做？
要問：怎麼讓他的好處，和我的好處，走在同一邊？

懂人的需要，所以做得出他要的東西。

願意更新的人，才走得過每一次變化。

=
送給想變厲害的你
拿捏得了一時，拿捏不了一世。
算計得了別人，算計不了人心。
真心換不到的，手段也留不住。
懂人性，不是為了占便宜。
是為了把價值，送到真正需要的人手上。
賺錢，是你做對事情之後的結果。
做一個讓人放心的人，生意自己會來。

<script>
const $=s=>document.querySelector(s);
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='人性八域OS';
let store={};try{store=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};

// 解析：# 文件、## 節、### 小標
const docs=[];let d,s;
for(const l0 of $('#raw').textContent.split('\n')){
  const l=l0.trimEnd();if(!l.trim())continue;
  if(l.startsWith('# ')){d={t:l.slice(2),s:[]};docs.push(d);s=null}
  else if(l.startsWith('## ')){s={t:l.slice(3),l:[]};d.s.push(s)}
  else{if(!s){s={t:'導言',l:[]};d.s.push(s)}s.l.push(l)}
}
let cur=0;

// 貼文：@文件-節 開頭，= 分隔圖卡，每張圖卡第一行是標題
const posts={};{let p,c;
for(const l0 of $('#posts').textContent.split('\n')){
  const l=l0.trim();if(!l)continue;
  if(l[0]=='@'){p=posts[l.slice(1).trim()]=[];c=null}
  else if(l=='=')c=null;
  else{if(!c){c=[];p.push(c)}c.push(l)}
}}
const ptext=id=>(posts[id]||[]).map(c=>c.join('\n')).join('\n\n');
function postHtml(id){
  const P=posts[id];
  return `<div class="pt"><button data-copy="${id}">複製全文</button><button data-dl="${id}">下載圖卡PNG</button><span class="info">${P.length} 張圖卡・約 ${P.flat().join('').length} 字</span></div><div class="cards">`+
    P.map((c,i)=>`<div class="card${i?'':' cv'}"><b>${esc(c[0])}</b>${c.slice(1).map(x=>`<p>${esc(x)}</p>`).join('')}<i>${i+1}/${P.length}</i></div>`).join('')+'</div>';
}
function draw(c,i,n,title){
  const W=1080,H=1350,M=90,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const x=cv.getContext('2d'),g=x.createLinearGradient(0,0,W,H),F='"Microsoft JhengHei","PingFang TC",sans-serif';
  g.addColorStop(0,i?'#fbf6ee':'#9a5b2c');g.addColorStop(1,i?'#f1e3d0':'#5e3414');x.fillStyle=g;x.fillRect(0,0,W,H);
  const ink=i?'#2b2622':'#fff',acc=i?'#9a5b2c':'#ffe2c2';
  const wrap=(t,font)=>{x.font=font;const o=[];let s='';for(const ch of t){if(x.measureText(s+ch).width>W-2*M){o.push(s);s=ch}else s+=ch}o.push(s);return o};
  let fs=56,hl,bl;
  do{fs-=2;hl=wrap(c[0],`bold ${fs*1.5}px ${F}`);bl=c.slice(1).map(t=>wrap(t,`${fs}px ${F}`))}
  while(hl.length*fs*2.1+fs+bl.reduce((a,b)=>a+b.length*fs*1.6+fs*.5,0)>H-2*M-110&&fs>22);
  let y=M+fs*1.5;x.fillStyle=acc;x.font=`bold ${fs*1.5}px ${F}`;hl.forEach(l=>{x.fillText(l,M,y);y+=fs*2.1});
  y+=fs*.4;x.fillStyle=ink;x.font=`${fs}px ${F}`;bl.forEach(b=>{b.forEach(l=>{x.fillText(l,M,y);y+=fs*1.6});y+=fs*.5});
  x.fillStyle=acc;x.font=`28px ${F}`;x.fillText(title.slice(0,28),M,H-60);x.textAlign='right';x.fillText((i+1)+' / '+n,W-M,H-60);
  return cv;
}
function copy(t){
  const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()};
  try{navigator.clipboard.writeText(t).catch(fb)}catch(e){fb()}
}

function sec(di,si,q){
  const S=docs[di].s[si],L=S.l,id=di+'-'+si;let n=0,i=0,quote=false,h='';
  const T=t=>{
    t=esc(t);
    if(q)t=t.replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>'<mark>'+m+'</mark>');
    return t.replace(/________|__\/80|__(?=\/10)|D__/g,m=>{
      if(m=='__/80')return '<output class="sum">0</output>/80';
      const k=id+'-'+n++,v=esc(store[k]||'');
      if(m=='________')return `<input class="f" data-k="${k}" value="${v}">`;
      if(m=='D__')return `D<input class="n" data-k="${k}" value="${v}">`;
      return `<input class="n" type="number" min="0" max="10" data-k="${k}" value="${v}">`;
    });
  };
  while(i<L.length){
    const l=L[i];
    if(l.startsWith('### ')){quote=l.includes('金句');h+='<div><h3>'+T(l.slice(4))+'</h3></div>';i++}
    else if(l=='```'){const b=[];i++;while(L[i]!='```')b.push(L[i++]);i++;h+='<pre>'+esc(b.join('\n'))+'</pre>'}
    else if(l[0]=='|'){
      const r=[];while(i<L.length&&L[i][0]=='|')r.push(L[i++]);
      h+='<div class="tw"><table>'+r.filter(x=>!/^\|\s*-/.test(x)).map((x,j)=>'<tr>'+x.replace(/^\||\|$/g,'').split('|').map(c=>j?`<td>${T(c.trim())}</td>`:`<th>${T(c.trim())}</th>`).join('')+'</tr>').join('')+'</table></div>';
    }
    else if(l=='↓'){h+='<div class="ar">↓</div>';i++}
    else{
      const m=l.indexOf('｜');let c=quote?'q':'';
      if(l[0]=='→'||l[0]=='＋'||l[0]=='＝')c+=' ch';
      if(m>0&&m<=28){
        const k=l.slice(0,m);if(/金句|智慧$/.test(k))c='q';
        h+=`<p class="kv ${c}"><b>${T(k)}</b>${T(l.slice(m+1))}</p>`;
      }else h+=`<p class="${c}">${T(l)}</p>`;
      i++;
    }
  }
  const P=posts[id],open=q&&P&&ptext(id).toLowerCase().includes(q.toLowerCase());
  return `<section id="s${id}">`+(q?`<div class="from" data-d="${di}" data-s="${si}">${esc(docs[di].t)} ›</div>`:'')+
    (P?`<button class="pb" data-p="${id}">📣 貼文圖卡</button>`:'')+`<h2>${T(S.t)}</h2>${h}`+
    (P?`<div class="post" id="p${id}"${open?'':' hidden'}>${open?postHtml(id):''}</div>`:'')+`</section>`;
}

function nav(){
  $('#nav').innerHTML=docs.map((d,i)=>`<a class="d${i==cur?' on':''}" data-d="${i}">${esc(d.t)}</a>`+(i==cur?d.s.map((s,j)=>`<a class="s" data-s="${j}">${esc(s.t)}</a>`).join(''):'')).join('');
}
function show(){
  const q=$('#q').value.trim();let h='';
  if(q){
    const lq=q.toLowerCase();let c=0;
    docs.forEach((d,i)=>d.s.forEach((s,j)=>{if((s.t+'\n'+s.l.join('\n')+'\n'+ptext(i+'-'+j)).toLowerCase().includes(lq)){c++;h+=sec(i,j,q)}}));
    h=`<p class="info">「${esc(q)}」共找到 ${c} 節</p>`+h;
  }else h=`<h1>${esc(docs[cur].t)}</h1>`+docs[cur].s.map((s,j)=>sec(cur,j)).join('');
  $('#main').innerHTML=h;sums();
}
function sums(){
  document.querySelectorAll('output.sum').forEach(o=>{
    let t=0;o.closest('section').querySelectorAll('input.n[type=number]').forEach(x=>t+=+x.value||0);o.textContent=t;
  });
}
function go(di,si){
  cur=di;$('#q').value='';nav();show();document.body.classList.remove('open');
  if(si==null)scrollTo(0,0);else document.getElementById('s'+di+'-'+si).scrollIntoView();
}
$('#nav').onclick=e=>{
  const a=e.target.closest('a');if(!a)return;
  if(a.dataset.d!=null)go(+a.dataset.d);else go(cur,+a.dataset.s);
};
$('#main').addEventListener('click',e=>{
  const t=e.target,f=t.closest('.from');if(f)return go(+f.dataset.d,+f.dataset.s);
  if(t.dataset.p){const b=document.getElementById('p'+t.dataset.p);if(!b.innerHTML)b.innerHTML=postHtml(t.dataset.p);b.hidden=!b.hidden}
  else if(t.dataset.copy){copy(ptext(t.dataset.copy));t.textContent='已複製 ✓'}
  else if(t.dataset.dl){
    const id=t.dataset.dl,P=posts[id],[a,b]=id.split('-'),title=docs[a].s[b].t;
    P.forEach((c,i)=>setTimeout(()=>draw(c,i,P.length,title).toBlob(bl=>{
      const l=document.createElement('a');l.href=URL.createObjectURL(bl);l.download=title.replace(/[\\/:*?"<>|]/g,'_')+'-'+(i+1)+'.png';l.click();
    }),i*350));
  }
});
$('#main').addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;store[k]=e.target.value;save();sums()});
$('#q').oninput=()=>{show();scrollTo(0,0)};
$('#mb').onclick=()=>document.body.classList.toggle('open');
$('#clr').onclick=()=>{if(confirm('確定清除所有填寫內容與評分？')){store={};save();show()}};
nav();show();
</script>
</body>
</html>
