                    return;
                }
                const btn = e.target.closest('.fbk-btn');
                if (!btn) return;
                const key = btn.closest('.fbk-box').dataset.fbk, p = POSTS[key];
                if (btn.dataset.fbkCopy) {
                    const m = btn.dataset.fbkCopy;
                    copy(m === 'zh' ? p.zh : m === 'en' ? p.en : p.zh + '\n\n———\n\n' + p.en, btn);
                } else if (btn.dataset.fbkDl) {
                    const cv = btn.parentElement.querySelector('canvas');
                    cv.toBlob(b => {
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(b);
                        a.download = `圖卡_${p.t.replace(/[\\/:*?"<>|]/g, '')}_${+btn.dataset.fbkDl + 1}.png`;
                        a.click();
                        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
                    });
                }
            });

            return {
                html,
                mountAfter(el, key) { if (el) el.insertAdjacentHTML('afterend', html(key)); }
            };
        })();
    </script>

    <script>
        const topicsData = JSON.parse(document.getElementById("topicsData").textContent);

        const app = {
            init() {
                this.attachEventListeners();
                this.renderTopics();
            },

            attachEventListeners() {
                document.getElementById("searchBox").addEventListener("input", (e) => {
                    const query = e.target.value.toLowerCase();
                    document.querySelectorAll(".topic-card").forEach(card => {
                        const title = card.querySelector(".topic-header").textContent.toLowerCase();
                        card.style.display = query === "" || title.includes(query) ? "block" : "none";
                    });
                });

                document.getElementById("expandAllBtn").addEventListener("click", () => {
                    document.querySelectorAll(".topic-card").forEach(card => card.classList.add("expanded"));
                });

                document.getElementById("collapseAllBtn").addEventListener("click", () => {
                    document.querySelectorAll(".topic-card").forEach(card => card.classList.remove("expanded"));
                });

                document.getElementById("topicsContainer").addEventListener("click", (e) => {
                    const header = e.target.closest(".topic-header");
                    if (header) {
                        header.closest(".topic-card").classList.toggle("expanded");
                    }
                    if (e.target.classList.contains("tts-btn")) {
                        this.speak(e.target);
                    }
                });
            },

            speak(button) {
                const text = button.dataset.text;
                if (!text) return;
                if (window.speechSynthesis.speaking) {
                    window.speechSynthesis.cancel();
                    button.classList.remove("playing");
                    return;
                }
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = "en-US";
                utterance.rate = 0.85;
                button.classList.add("playing");
                utterance.onend = () => button.classList.remove("playing");
                window.speechSynthesis.speak(utterance);
            },

            renderTopics() {
                const container = document.getElementById("topicsContainer");
                
                topicsData.forEach(topic => {
                    const card = document.createElement("div");
                    card.className = "topic-card";

                    const title = topic.title || "Untitled";
                    const titleEn = topic.title_en || title;
                    const content = topic.content || "";
                    const contentEn = topic.content_en || "";
                    const charCount = topic.char_count || 0;
                    const lineCount = topic.line_count || 0;

                    const contentForTTS = contentEn.substring(0, 400);

                    card.innerHTML = `
                        <div class="topic-header">
                            <span>#${topic.index} ${this.escapeHtml(title.substring(0, 50))}</span>
                            <span class="toggle-icon">▼</span>
                        </div>
                        <div class="topic-content">
                            <div class="content-inner">
                                <h3>${this.escapeHtml(titleEn)}</h3>
                                ${window.FBK ? FBK.html("t" + topic.index) : ""}
                                <p>${this.escapeHtml(content)}</p>
                                <p style="color: var(--gold); font-style: italic; margin-top: 15px; margin-bottom: 10px;">English Translation:</p>
                                <p>${this.escapeHtml(contentEn)}</p>
                                <button class="tts-btn" data-text="${this.escapeHtml(contentForTTS)}">🔊 English</button>
                            </div>
                            <div class="meta">Characters: ${charCount} | Lines: ${lineCount}</div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            },

            escapeHtml(text) {
                const div = document.createElement("div");
                div.textContent = String(text);
                return div.innerHTML;
            }
        };

        document.addEventListener("DOMContentLoaded", () => app.init());
        window.addEventListener("beforeunload", () => {
            if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
        });
    </script>
</body>
</html>
