<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>苦難文章整理</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#2b2a27;--mute:#77736a;--line:#e3ded3;--acc:#8a5a2b;--acc2:#3f6b5e;--soft:#f1ebe0;--hl:#fff3c4}
@media (prefers-color-scheme:dark){:root{--bg:#1c1b19;--card:#262522;--ink:#ece8df;--mute:#a49e92;--line:#3a3833;--acc:#d9a86c;--acc2:#7fb8a6;--soft:#302d28;--hl:#5a4a18}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:20px;margin:0 0 8px}
h1 small{font-weight:normal;color:var(--mute);font-size:13px;margin-left:8px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
#q{flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:16px}
select{padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{padding:16px}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--acc);transform:translateY(-1px)}
.card h3{margin:0 0 4px;font-size:16px;line-height:1.4}
.meta{color:var(--mute);font-size:12.5px}
.card p{margin:6px 0 0;font-size:14px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.count{color:var(--mute);font-size:13px;margin-bottom:10px}
mark{background:var(--hl);color:inherit}
#detail{display:none}
.back{border:none;background:none;color:var(--acc);cursor:pointer;font-size:15px;padding:0;margin-bottom:8px}
.dh{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.dh h2{margin:0 0 4px;font-size:22px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tab{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:14px}
.tab.on{background:var(--acc2);color:#fff;border-color:var(--acc2)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h4{margin:0 0 8px;color:var(--acc)}
.panel ul{margin:0;padding-left:20px}
.panel li{margin:4px 0}
.sum{font-size:16px;margin:0 0 16px}
.mm{width:100%;overflow-x:auto}
.mm svg{display:block;margin:0 auto;max-width:100%;height:auto}
.flow{display:flex;flex-direction:column;align-items:center;gap:0}
.fq,.fa{max-width:640px;width:100%;text-align:center;padding:12px 16px;border-radius:12px;font-weight:bold}
.fq{background:var(--acc);color:#fff}
.fa{background:var(--acc2);color:#fff}
.fs{max-width:520px;width:100%;text-align:center;padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--soft)}
.fs b{color:var(--acc);margin-right:6px}
.arr{color:var(--mute);font-size:20px;line-height:1.4}
.qt{border-left:4px solid var(--acc);background:var(--soft);padding:12px 16px;border-radius:0 10px 10px 0;margin:10px 0;font-size:17px}
.vs{display:flex;gap:6px;flex-wrap:wrap}
.vs span{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-size:14px}
.fbp{white-space:pre-wrap;font-size:16px;line-height:1.9;background:var(--soft);border-radius:10px;padding:16px}
.cardwrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-bottom:20px;padding-bottom:20px;border-bottom:1px dashed var(--line)}.cardctl{flex:1;min-width:220px;display:flex;flex-direction:column;gap:10px}.cardctl label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mute)}.cardctl select{width:100%}#cv{width:min(100%,460px);height:auto;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.15)}
.note{color:var(--mute);font-size:12.5px;margin-top:12px}
.allq .qt{font-size:15px}
.allq .src{color:var(--mute);font-size:12.5px;cursor:pointer}
.nav2{display:flex;justify-content:space-between;margin-top:12px}
.nav2 button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 12px;cursor:pointer}
@media(max-width:600px){h1{font-size:18px}.dh h2{font-size:19px}}
</style>
</head>

<header><div class="wrap">
<h1>苦難 · 文章整理<small>福音聯盟「苦難」主題共 <span id="tot"></span> 篇｜心智圖・框架圖・金句・重點摘要・臉書貼文與圖卡</small></h1>
<div class="bar">
<input id="q" type="search" placeholder="搜尋標題、作者、摘要、重點、金句、經文…（例：約伯、抑鬱、羅 8:28）">

</div></header>
<main class="wrap">

<script>
const D=[];

D.push(
{i:0,t:"媽媽的記憶一點點消逝",au:"Tim Thornborough",d:"2026-10-18",c:"基督徒生活",tags:["失智","喪親","詩歌"],
sum:"作者探望患阿爾茨海默病的母親，看著她的記憶倒退回 1943 年。在安養院裡，一位認不得自己的老人仍唱著從小熟悉的詩歌，讓作者明白：平日反覆吟唱、默想的福音真理，會在記憶崩塌時仍托住人心。他因此更珍惜主日唱詩，並為母親禱告能經歷詩篇 23 篇的應許。",
pts:["失智症像一趟沒有回程票的時光倒流，家人在對方仍活著時就開始哀傷。","病人可能失去認知、幽默與體面，但福音能深植在記憶最底層。","主日唱詩不只是當下的感動，也是神為將來死蔭幽谷預備的幫助。","陪伴本身就是安慰：握手、親吻額頭，回報母親當年的愛。"],
mind:{c:"記憶消逝中的福音",b:[["殘酷的病",["時光倒流","重複對話","提前哀傷"]],["不變的性情",["北方式幽默","溫情仍在","終將失去"]],["深藏心底的詩歌",["耶穌愛我","奇異恩典","主仍握住他"]],["作者的回應",["珍惜主日唱詩","陪伴握手","為母禱告"]]]},
frame:{q:"當記憶一點點被奪走，信仰還剩下什麼？",s:["觀察：母親活在過去","哀傷：人還在卻已失去","轉折：老人唱出詩歌","領悟：真理比記憶更深","行動：唱詩、陪伴、禱告"],a:"神放進心裡的真理，比我們的記憶更長久。"},
q:["失智像倒退的列車，沒有回程票。","記憶可能全部失去，主的手卻沒有鬆開。","今天唱的詩歌，是明天走過幽谷的糧食。"],
v:["詩 23:6"]},
{i:1,t:"基督徒，你不會白白受苦",au:"Alan Noble",d:"2026-10-10",c:"基督徒生活",tags:["苦難的意義","盼望","約伯"],
sum:"最難熬的苦，是那些既非為義受苦、也非罪有應得的「純粹受苦」，因為它看似毫無意義。作者指出，忍耐需要相信苦難終會帶來美善；神藉苦難使我們能安慰別人（林後 1），並藉患難生忍耐、老練、盼望（羅 5）。我們未必看懂每一步，但神知道，祂信實，苦難必不徒然。",
pts:["苦難若沒有意義會加倍難熬；人因此用酒精、色情、螢幕麻痺自己。","忍耐是勇氣的表現，需要以「苦難終會帶來美善」的盼望為根基。","苦難使我們能用從基督領受的安慰去安慰別人。","患難生忍耐、老練、盼望；但成聖不是拿來與痛苦相抵的算術題。","約伯至死不知原因；我們不需看懂，只需知道神慈愛、掌權、信實。"],
mind:{c:"苦難不徒然",b:[["無意義的苦",["非為義","非罪有應得","最易絕望"]],["安慰別人",["林後 1:3-5","經歷過的人最有力","苦不只關乎自己"]],["生出盼望",["羅 5:3-5","忍耐→老練→盼望","聖靈同在"]],["奧祕與信實",["羅 8:28","不必看懂","神知道就夠"]]]},
frame:{q:"說不出理由的苦，到底有沒有意義？",s:["承認：有些苦純粹是苦","危險：無意義導致絕望","果效一：安慰他人","果效二：品格與盼望","根基：神慈愛、掌權、信實"],a:"我們不明白其中奧祕，不等於它沒有意義。"},
q:["苦難若沒有意義，就會加倍難熬。","你不必看懂每一步，只要知道神沒有浪費任何一滴眼淚。","成聖不是算術題，不是拿益處抵銷痛苦。"],
v:["羅 8:28","林後 1:3-5","羅 5:3-5","伯 3:23","啟 21:5"]},
{i:2,t:"我不明白 9·11，但我仍舊讚美神",au:"Collin Hansen",d:"2026-09-24",c:"社會與時事",tags:["邪惡的問題","護理","9·11"],
sum:"9·11 二十五週年，作者回顧這場襲擊如何被新無神論者用來指控「宗教毒害一切」。他承認不明白神為何容許邪惡，但指出我們常用神賜的善惡標準審判神，卻從不數算神攔阻了多少本可能發生的災禍。我們每天能安然邁步，全靠神的護理托住。",
pts:["9·11 塑造了今日世界，也讓「宗教毒害一切」的論調得勢。","批評背後的預設：只要神容許任何邪惡，祂就不可能良善。","聖經同時肯定：邪惡真實、死亡必然、神掌權、神良善——我們很少明白如何並存。","我們看不見神攔阻了多少「想像中的災禍」。","感恩：禱告蒙垂聽，同樣的災難沒有再發生。"],
mind:{c:"不明白卻仍讚美",b:[["9·11 的遺產",["新無神論","宗教毒害一切","對神良善的質疑"]],["約伯式回答",["伯 38:4","神不解釋","人的有限"]],["看不見的護理",["被攔阻的邪惡","來 1:3","每一步被托住"]],["回應",["感恩","繼續禱告","盡力防惡"]]]},
frame:{q:"神若良善，為何容許 9·11？",s:["事件與恐懼","文化指控：宗教毒害一切","聖經的四個肯定","反問：神攔阻了多少惡？","感恩與禱告"],a:"不明白神的理由，不妨礙我們讚美祂的良善。"},
q:["我們用神給的善惡標準，反過來審判神。","有多少災禍沒有發生，只有主知道。","能安然邁步，是因護理像引力一樣托住我們。"],
v:["伯 38:4","來 1:3"]},
{i:3,t:"學會好好悲傷",au:"Bob Cutillo",d:"2026-09-13",c:"基督徒生活",tags:["悲傷","喪偶","群體"],
sum:"身為醫生的作者在妻子確診胃癌晚期後經歷了失去。他把悲傷比作屋中的一個房間，人人都有。基督徒不必像沒有指望的人那樣憂傷，並提出五種好好悲傷的方式：坦誠、耐心、在群體中、懷著感恩、懷抱盼望。這樣悲傷會使我們更像「常經憂患」的耶穌。",
pts:["悲傷是每個人家裡的一個房間，只是大小和位置不同。","坦誠：轉身面向黑暗，新的一天從那裡開始。","耐心：悲傷沒有時間表，人會一直帶著悲傷的印記。","群體：先向神傾吐，再向人敞開脆弱。","感恩與盼望：失去的本是禮物；神靠近傷心的人（詩 34:18）。"],
mind:{c:"好好悲傷",b:[["坦誠",["不掩埋","不逃跑","面向黑暗"]],["耐心",["沒有時間表","允許別的顏色","帶著印記前行"]],["群體",["先向神傾吐","敞開脆弱","一同禱告"]],["感恩",["畫中的一抹藍","所失本是禮物"]],["盼望",["受苦的救主","詩 34:18","應許是纜繩"]]]},
frame:{q:"失去來臨時，怎樣悲傷才是好的？",s:["坦誠面對","耐心同行","進入群體","懷著感恩","抓住盼望"],a:"好好悲傷，使我們更像常經憂患的耶穌。"},
q:["活得越久失去越多；愛得越深悲傷越重。","想迎向光明，得先轉身面對黑暗。","我們失去的，原本就是一份陪伴一程的禮物。"],
v:["帖前 4:13","伯 5:7","可 4:35-41","詩 34:18","賽 53:3"]},
{i:4,t:"蟑螂教我學會安息",au:"Gracie MacCaughelty",d:"2026-08-28",c:"信仰與工作",tags:["偶像","安息","掌控感"],
sum:"新婚夫妻剛佈置好的公寓爆發德國蟑螂，被迫搬回娘家，接著生病、祖父過世、車子故障接踵而來。熱愛秩序的作者在禱告日誌中發現：她把安穩的居所當成偶像，以為「安定下來」才能快樂。神藉失去掌控感，顯明祂才是安息的源頭，並藉家人和教會供應所需。",
pts:["不如意接二連三，讓喜愛秩序的人焦慮不堪。","真正的問題：把可預測性與舒適當成偶像。","約 16:33：在世有苦難，但在基督裡有平安。","每天都面對兩扇門：絕望掌控，或信靠感恩。","困境成為日後回望神信實的里程碑。"],
mind:{c:"從蟑螂到安息",b:[["失序",["蟑螂爆發","搬家","疾病與喪親"]],["顯明偶像",["居所","秩序","可預測性"]],["真正安息",["約 16:33","箴 3:5","腓 4:11-13"]],["看見供應",["父母接納","三天成交","教會幫忙"]]]},
frame:{q:"當生活完全失控，安息在哪裡？",s:["事件：家被蟑螂佔領","連鎖打擊","禱告日誌中認罪","選擇第二扇門","回顧神的供應"],a:"安息不在安穩的家，而在基督裡。"},
q:["我以為要先安定下來才能快樂。","每天都有兩扇門：一扇通往焦慮，一扇通往信靠。","神拿走掌控感，好讓我們找到真正的安息。"],
v:["約 16:33","箴 3:5","腓 4:11-13"]},
{i:5,t:"服侍受創傷的人",au:"Kelly Simpson",d:"2026-08-17",c:"教會事工",tags:["創傷","陪伴","共情疲勞"],
sum:"兒科職能治療師分享：面對他人創傷，人常有兩種不健康反應——關上心門只處理實際問題，或被痛苦吞沒導致共情疲勞。耶穌示範第三條路：「創傷管家」。祂道成肉身走進痛苦、為拉撒路哭，卻從不被悲傷吞沒，會退去禱告休息。我們陪伴、傾聽、溫柔傳遞真理，也承認有限，把重擔卸給主。",
pts:["反應一：關閉心門、說套話，等於抹殺對方的神形像。","反應二：被痛苦吞沒，導致共情疲勞與職業倦怠。","第三條路：做創傷的忠心管家——智慧照管，不據為己有。","耶穌既走進痛苦（約 11:35），也退去禱告休息（路 5:16）。","實踐：同在的服侍、回應性傾聽、尊重故事、知道何時退後。"],
mind:{c:"創傷管家",b:[["兩種錯誤",["關上心門","被痛苦吞沒"]],["耶穌的榜樣",["道成肉身","為朋友流淚","退去禱告"]],["實踐",["同在的服侍","複述感受","問誰在支持你"]],["界限",["我是受造者","彼前 5:7","聖靈是保惠師"]]]},
frame:{q:"如何陪伴受創的人，又不被壓垮？",s:["辨識：冷漠 vs 吞沒","模範：基督的第三條路","陪伴：同哭、傾聽","尊重：神的形像與故事","退後：休息、交託"],a:"做創傷的管家：靠近痛苦，卻把重擔交給主。"},
q:["管家是智慧照管，不是據為己有。","耶穌從不迴避痛苦，也從不被痛苦吞沒。","我不能永遠背負重擔，我只是受造之人。"],
v:["加 6:2","約 11:33-35","可 6:30-34","羅 12:15","彼前 5:7","羅 8:26-27"]},
{i:6,t:"苦難並不總是因為你的過錯",au:"Scott W. Kay",d:"2026-08-01",c:"基督徒生活",tags:["約伯","因果報應","分辨"],
sum:"「種什麼收什麼」順境時像嘉許，逆境時卻像定罪。作者指出約伯的朋友正是用簡單因果律論斷他，但約伯受苦恰恰因為他沒做錯。生來瞎眼的人、十字架上的耶穌也是如此。這原則是普遍原則而非絕對定律。若因罪受苦，聖靈會讓我們知道；若查不出原因，神可能正在顯明信心的真實。",
pts:["錯誤假設：好事是獎賞，壞事一定是懲罰或功課。","約伯是魔鬼攻擊的目標，而非神不悅的對象。","苦難像火煉金，證明信心是真的（彼前 1:6-7）。","「種什麼收什麼」是普遍原則，不是絕對因果律。","若因罪受苦，聖靈會指證；否則可能是神託付的任務。"],
mind:{c:"我做錯了什麼？",b:[["錯誤因果",["善有善報","約伯的朋友","伯 8:20"]],["因善受苦",["約伯","生來瞎眼","十字架"]],["分辨",["聖靈指證罪","查不出則非管教","彼前 4:19"]],["盼望",["詩 126:5","被壓碎的葡萄","早晨必歡呼"]]]},
frame:{q:"受苦一定是我犯錯的後果嗎？",s:["加 6:7 的雙重感受","約伯朋友的錯誤","因善受苦的例子","普遍原則 vs 絕對定律","如何分辨"],a:"眼淚未必是管教的記號，可能是喜樂收割的種子。"},
q:["約伯受苦，恰恰因為他沒有做錯。","種什麼收什麼是原則，不是公式。","如果是罪，神會讓你知道，不會叫你一直猜。"],
v:["加 6:7","伯 1-2","約 9:2-3","彼前 1:6-7","彼前 4:19","詩 126:5","詩 30:5","來 12:2"]},
{i:7,t:"繞開墮落的美，還是美嗎？",au:"Ryan Currie",d:"2026-07-07",c:"文化與藝術",tags:["藝術","墮落","美學"],
sum:"「光之畫家」金凱德想描繪沒有墮落的世界，生命卻深受破碎所苦。作者指出藝術有兩個極端：以墮落為榮的越界藝術，和迴避邪惡的濫情藝術（媚俗）。後者等於要不付十字架代價的救贖。基督徒藝術應涵蓋創造、墮落、救贖、更新，既畫光也畫暗，最終指向超越的真善美。",
pts:["金凱德畫中的寧靜與他動盪的一生形成強烈矛盾。","越界藝術美化醜陋；濫情藝術用廉價的美迴避救贖代價。","斯克魯頓：媚俗是信仰的疾病，讓人不必真正感受愛與悲傷。","基督教藝術應包含創造—墮落—救贖—更新四重格局。","例：《罪與罰》燭光讀經、卡拉瓦喬《聖多馬的懷疑》。"],
mind:{c:"救贖之美",b:[["兩極端",["越界藝術","濫情藝術/媚俗"]],["金凱德",["光之畫家","沒有墮落的世界","破碎的人生"]],["福音美學",["創造","墮落","救贖","更新"]],["範例",["罪與罰","卡拉瓦喬","電影《大衛》"]]]},
frame:{q:"基督徒藝術可以忽略墮落嗎？",s:["金凱德的矛盾","越界與濫情兩極","媚俗是信仰疾病","四重救贖格局","光暗並存的作品"],a:"藝術救不了我們，但可以指向救贖之美。"},
q:["迴避罪的藝術，是想要不付十字架代價的救贖。","光之所以動人，是因為照亮了黑暗。","我們塗抹不掉墮落，卻能描繪救贖。"],
v:["約 8:12"]},
{i:8,t:"在等候神回應禱告的過程中，神在做什麼？",au:"Courtney Reissig",d:"2026-06-29",c:"基督徒生活",tags:["禱告","等候","詩篇"],
sum:"世上沒有未蒙回應的禱告，只是神有祂不慌不忙的節奏，回應未必是我們所求的。司布真說神珍藏每一句呼求、每一滴眼淚。作者以詩篇 5 篇為指引：清晨先禱告、融入屬靈群體一同等候、在傾訴後以神為避難所。",
pts:["神總會回應，只是時間與方式未必如我們預期。","神的時刻表與我們不同（賽 55:8）。","不住禱告：早晨先向神陳明心意（詩 5:3）。","融入群體：同擔憂愁本身就是安慰（詩 5:7）。","以神為避難所：傾訴之後在祂裡面安息（詩 5:11）。"],
mind:{c:"等候中的禱告",b:[["神的回應",["不慌不忙","未必如所求","總是最好"]],["不住禱告",["詩 5:3","起床先禱告","儆醒盼望"]],["屬靈群體",["詩 5:7","像待產母親","同行的恩典"]],["避難所",["詩 5:11","放下掌控幻覺","神聽見每聲嘆息"]]]},
frame:{q:"禱告遲遲沒有回應，我該怎麼辦？",s:["重新理解：沒有落空的禱告","早晨禱告","與群體同等","傾訴後安息"],a:"神聽見每一句呼求，祂的時刻比我們的更美。"},
q:["沒有落空的禱告，只有神不慌不忙的節奏。","在手抓起手機之前，先把心交給神。","有人陪我們等，本身就是恩典。"],
v:["太 6:10","賽 55:8","帖前 5:17","詩 5:3","詩 5:7","詩 5:11"]},
{i:9,t:"病榻上的省思",au:"Bob Kauflin",d:"2026-04-18",c:"基督徒生活",tags:["疾病","事奉","陪伴"],
sum:"敬拜音樂人考夫林七十歲時立志迎接最多產的十年，卻雙腿股四頭肌肌腱斷裂住院。他記下九個功課：神定義何為結果子；耶穌承擔我們的痛苦；聖靈不受軟弱限制；詩歌是恩典的媒介；陪伴是最好的禮物；教會一同受苦；信仰不是修補而是復活；忙碌不等於有效；他依然配不上妻子。",
pts:["帶著呼求主名忍受苦難，本身可能就是神預備的善工。","在劇痛中求耶穌背負，祂確實承擔。","病床上的福音機會比過去三個月還多。","最好的禮物是親身在場的陪伴；教會的使命包括一同受苦。","基督教不是物理治療式的修補，而是死人復活。"],
mind:{c:"病榻九功課",b:[["重新定義",["善工由神定義","忙碌≠有效"]],["神的同在",["耶穌背負重擔","聖靈不受限","詩歌是恩典"]],["群體",["陪伴是禮物","教會一同受苦","妻子的愛"]],["福音",["不是修補","而是復活","信心在神手中"]]]},
frame:{q:"計劃被打斷時，神在教我什麼？",s:["宏大計劃","兩次摔斷","病床上的領悟","九個功課","交出定義善工的權柄"],a:"我們的信心不落空，因為我們在神良善的手中。"},
q:["善工不一定驚天動地，忍受苦難時呼求主名也是善工。","我們需要的不是治療，而是復活。","四處奔波，不等於完成實事。"],
v:["弗 2:10","詩 68:19","林前 12:26"]}
);

D.push(
{i:10,t:"天堂的淚水（《詩篇》56 篇）",au:"Angie Velasquez Thornton",d:"2026-03-29",c:"聖經與神學",tags:["詩篇","眼淚","信靠"],
sum:"撒但最陰險的謊言是：神在苦難中離棄了你。詩篇 56 篇是大衛逃亡迦特時所寫，他被仇敵終日追逼、扭曲言語，卻仍說「我倚靠神」。神記數他的流離、把眼淚裝在皮袋、記在冊上——意思是神記念、在乎、不忘記。大衛甚至在得救前就預備感謝祭。新約中羅 8:31-32 呼應此應許，聖餐則是我們記念祂的受苦。",
pts:["大衛三次說「終日」：仇敵不讓他安歇，他的恐懼是真實的。","他不否認恐懼，而是面對恐懼並宣告信靠。","神的應許與神自己密不可分，愛聖經就是愛它的作者。","「皮袋裝眼淚」是記念的象徵：沒有一滴眼淚白流。","大衛在拯救來臨前就預先獻上讚美；我們以活祭回應（羅 12:1-2）。"],
mind:{c:"神收藏我的眼淚",b:[["被追逼",["終日吞吃","扭曲言語","真實恐懼"]],["信靠",["我倚靠你","讚美祂的話","人能把我怎樣"]],["神的記念",["記數流離","皮袋裝淚","冊子記錄"]],["新約呼應",["羅 8:31-32","聖餐記念","活祭"]]]},
frame:{q:"神真的看見我的眼淚嗎？",s:["逃亡處境（撒上 21）","雖被踐踏仍信靠（1-7）","流離與記念（8）","神幫助我（9-11）","預先的感謝祭（12-13）"],a:"神記數我們的流離，所以不必懼怕，全然信靠。"},
q:["仇敵跟蹤腳步是為了撲殺，神記數腳步是為了施愛。","我們最悲慟的時刻，常也是與神最親近的時刻。","在拯救來臨前就預備感恩，這就是信心。"],
v:["詩 56","撒上 21","啟 21:4","羅 8:31-32","來 10:10","羅 12:1-2"]},
{i:11,t:"福分：或許不是你想的那樣",au:"Sarah Phillips",d:"2025-11-06",c:"基督徒生活",tags:["蒙福","成功神學","苦難"],
sum:"我們常把房子、工作、健康稱為「蒙福」，但這可能暗示失業、生病的人沒有蒙福。聖經的福分始於罪得赦免，核心是親近、倚靠、尋求神本身；八福更把福分和哀慟、貧窮、逼迫連在一起。作者的朋友 18 歲罹癌、長年慢性疼痛，卻因與神親密而極其蒙福。神更在乎塑造我們的心，而不是讓我們舒服。",
pts:["只把順利的事稱為福分，會讓受苦者誤以為自己不蒙神祝福。","福分始於罪得赦免（羅 4:7-8）。","詩篇中的福分都與神相連：倚靠、投靠、尋求祂。","八福把福分與哀慟、貧窮、受逼迫連在一起。","苦難本身不是福分，但神常在熔爐中塑造我們——這是福分。"],
mind:{c:"真正的福分",b:[["常見誤解",["房子工作","健康孩子","缺少即不蒙福"]],["聖經定義",["罪得赦免","親近神","神自己最大"]],["與苦難相連",["八福","雅 1:12","朋友的見證"]],["神的目的",["拆除自恃","在熔爐塑造","重賜予者過於禮物"]]]},
frame:{q:"失去好事的人，還算蒙福嗎？",s:["檢視日常用語","福分始於赦罪","福分在於神自己","福分常伴苦難","禱告：願我更認識你"],a:"屬世的恩賜會過去，真正的福分存到永遠。"},
q:["神賜下美物，但祂自己才是最大的福分。","凡促使我們禱告的，都是福分。（司布真）","我渴求神的禮物，卻忘了那位比禮物更寶貴的賜予者。"],
v:["羅 4:7-8","詩 32","詩 84:12","詩 34:8","詩 119:2","詩 94:12","路 6","雅 1:12"]},
{i:12,t:"慢性病患者的屬靈功課：軟弱處的恩典印記",au:"Jess Habib",d:"2025-10-27",c:"基督徒生活",tags:["慢性病","服事","軟弱"],
sum:"作者患慢性前庭性偏頭痛後，無法再做過去熱衷的教會服事。她指出神看重的是內心而非服事數量，並鼓勵病友問：神給了我什麼？——多出的彈性時間、一對一陪伴、從苦難而來的同理心、謙卑接受幫助、被迫更多禱告。若連這些都做不到也沒關係，單單信靠就有永恆價值；要「在黑暗中相信你在光明中所見過的」。",
pts:["神喜愛憐恤，不喜愛祭祀：重點在心，而非服事量。","別陷入「等我病好了才能……」，現在的處境就是服事的舞台。","慢性病帶來的獨特機會：一對一、同理心、接受幫助、禱告。","真的什麼都做不了時，信靠本身就榮耀神（弗 2:10）。","黑暗中用經文禱告：林後 12:9、詩 42-43、羅 8:26-27。"],
mind:{c:"帶病榮耀神",b:[["先看心",["何 6:6","窮寡婦","求神的國"]],["盤點恩賜",["彈性時間","一對一","同理心","接受幫助","禱告"]],["什麼都做不了",["沒關係","不必比較","信靠即榮耀"]],["黑暗中的真理",["林後 12:9","詩 42-43","羅 8:26"]]]},
frame:{q:"身體衰敗時，還能怎樣服事神？",s:["失去原有服事","重新定義：神看心","發掘病中恩賜","接納全然軟弱","抓住真理"],a:"在黑暗中，仍相信你在光明中所見過的。"},
q:["你現在的處境，就是神呼召你服事的舞台。","禱告是唯一不受病情限制的服事。","讓別人幫助你，往往也是祝福他們。"],
v:["羅 12:1-2","何 6:6","路 21:2-4","林前 7:17","弗 2:10","林後 12:9-10","詩 42-43","羅 8:26-27"]},
{i:13,t:"《箴言》的應許是否言過其實？",au:"Jim Davis",d:"2025-10-08",c:"聖經與神學",tags:["箴言","成功神學","管教"],
sum:"作者的妻子 29 歲罹癌，有人說是她信心不夠。箴言 3 章的富足健康應許，只是「大概率」嗎？作者認為應許都以「倚靠、敬畏、尊榮耶和華」為前提，是關係性的。應許看似落空時有兩種可能：神的管教（愛的記號），或神呼召人進入透過苦難才得的更高祝福——祂更深的同在。箴言的應許是最低標準，在基督裡必完全實現。",
pts:["把箴言看成大概率指南有道理，但忽略了與神的關係。","可能一：管教——耶和華所愛的祂必責備。","路易斯：抱怨苦難，等於求更少的愛。","可能二：被揀選經歷更高的祝福——神更深的同在（林後 4:17）。","成功神學的錯誤：以為蒙福就是沒有痛苦。"],
mind:{c:"箴言的應許",b:[["表面問題",["箴 3:1-12","現實不符","成功神學"]],["不只是概率",["倚靠","敬畏","尊榮"]],["落空的解釋",["管教是愛","更高的祝福"]],["最低標準",["神必成就","在基督裡實現","林後 1:20"]]]},
frame:{q:"箴言應許的富足健康，為何常常沒發生？",s:["誤解：信心不夠","部分正確：大概率","關鍵：關係前提","解釋一：管教","解釋二：更高祝福","結論：最低標準"],a:"所有應許在基督裡都是「是的」，我們無所失去。"},
q:["管教不是被拒絕的記號，而是被愛的記號。","蒙福的人生，不等於沒有痛苦的人生。","箴言設定的是基督徒可期待的最低標準。"],
v:["箴 3:1-12","箴 3:11-12","林後 4:17","詩 73:3","林後 1:20","腓 1:6"]},
{i:14,t:"絕境重生：一場致命空難如何帶來屬靈豐收",au:"Sarah Eekhoff Zylstra",d:"2025-08-21",c:"社會與時事",tags:["空難","門訓","神的主權"],
sum:"2023 年德州一架小飛機墜毀，機上五人來自孟菲斯豐收教會，只有牧師肯農·沃恩奇蹟生還。長期的門訓文化使教會在哀慟中彼此扶持；導師蘇普一句「祂要麼是全能的主宰，要麼根本不存在」把肯農從自責中拉出。主刀醫生、牧場主人夫婦相繼尋求信仰；兩年後在墜機牧場舉辦的佈道會吸引近四千人，一百多人決志。",
pts:["肯農的屬靈成長來自蘇普一對一的門訓，後創立傳承事工。","墜機時他感到平安；生存機率被判定為零，卻活了下來。","多年門訓的「小額存款」在危機時被全額支取：長老、會眾立刻接手照顧。","我們不能解釋神為何容許某些悲劇，但知道祂永不撇棄。","初熟果子：醫生、牧場主人、佈道會的豐收；門訓小組至今仍在遺孀家聚會。"],
mind:{c:"空難後的豐收",b:[["門訓之根",["蘇普的榜樣","傳承事工","豐收教會"]],["墜機",["90G 撞擊","唯一生還","深深的平安"]],["教會回應",["長老分工照顧","彼此扶持","遺孀見證"]],["主權",["全能或不存在","不解釋為什麼","永不撇棄"]],["果子",["醫生","牧場主人","四千人佈道會"]]]},
frame:{q:"一場奪走四人的空難，神如何使用？",s:["門訓文化的建立","行程與墜機","生還與搶救","教會的哀慟與承擔","自責與主權之問","初熟與豐收的果子"],a:"神不浪費任何苦難；他們的信心像種子一樣播下。"},
q:["祂要麼是全能的主宰，要麼根本不存在。","平日門訓的小額存款，會在危機時被全額支取。","我們會問為什麼，但並不真的需要答案。"],
v:["腓 1:21-23","羅 8:28","賽 49:13"]}
);

D.push(
{i:15,t:"邪惡伸向孩童時，神在哪裡？",au:"Betsy Childs Howard",d:"2025-08-18",c:"社會與時事",tags:["邪惡的問題","兒童","公義"],
sum:"一位英國政治人物因讀到一名女子被父親囚禁 24 年的案件而離開信仰。作者回應：我們會對虐童感到義憤，正顯明普遍恩典與人按神形像受造的道德感。許多人要公義卻只要「適可而止的公義」，但神的公義從不打折，耶穌對傷害孩子的人發出最嚴厲警告，並應許以賽亞 11 章那沒有掠食者的國度。我們要拒絕「世界本就如此」的謊言。",
pts:["「神若良善為何容許苦難」在涉及孩子時最尖銳。","我們能判斷不公，代表有一把公義的直尺（路易斯）。","神的公義不打折：寧願讓聖子受死，也不讓罪逍遙。","耶穌：使小子跌倒的，不如拴上磨石沉在海裡（太 18:6）。","以賽亞 11 章：孩童在毒蛇洞口玩耍也不受害的新國度。"],

frame:{q:"孩子受虐時，神在哪裡？",s:["真實案件與棄信","問題本身揭露道德感","神的公義不打折","審判是平安的前提","做盼望的號角"],a:"怒斥殘暴、呼喚公義、仰望應許的拯救。"},
q:["會為不公憤怒，證明我們心裡有一把公義的尺。","人們想要的常是適可而止的公義。","惡人想吹熄盼望的燭火，因為絕望的人最好操控。"],

{i:16,t:"保羅真的應許了我肯定要受苦嗎？",au:"Lauren Lockhart-Collins",d:"2025-07-31",c:"聖經與神學",tags:["帖撒羅尼迦後書","以賽亞書","末世盼望"],
sum:"長期患慢性病的作者研究帖後 1:3-12 發現：保羅確實說信徒會受苦，但這苦難不是神棄絕的記號，反而是「配得神國」的明證。保羅多處呼應以賽亞 66 章：受逼迫的義人終被伸冤，逼迫者受審判。保羅的苦難神學不只限於外在逼迫，也包括疾病與失喪；無論何種苦難，基督再來時必帶來安息與釋放。",
pts:["帖後 1:5：患難是神公義判斷的明證，顯明信徒配得神國。","苦難從「被棄絕的記號」翻轉為「蒙悅納的記號」。","保羅呼應賽 66：神在火焰中顯現，審判不聽從的人。","伸冤、脫離苦難、安息在主再來時實現，非今生必然。","保羅用詞同時包含逼迫與各樣患難，適用於疾病等苦難。"],
mind:{c:"受苦與盼望",b:[["帖後 1",["堅忍與信心","配得神國","主再來"]],["翻轉意義",["非棄絕","蒙悅納記號"]],["以賽亞 66",["火中審判","義人被伸冤","耶和華得榮耀"]],["適用範圍",["逼迫","疾病","失喪"]]]},
frame:{q:"聖經真的說基督徒一定會受苦？",s:["個人慢性病處境","帖後 1:3-5 解讀","與賽 66 的呼應","苦難的多種形式","終極安息"],a:"義人的苦難不是無意義的，而是將來得救盼望的依據。"},
q:["苦難不是被神棄絕的記號，反倒是被神悅納的記號。","保羅沒有應許今生必脫離苦難，卻應許苦難不會白受。","每個人跟隨主的代價不同，但盼望相同。"],
v:["帖後 1:3-12","賽 66:4-5","賽 66:15-16"]},
{i:17,t:"跳水事故五十週年的感悟",au:"Joni Eareckson Tada",d:"2025-07-21",c:"基督徒生活",tags:["癱瘓","主權","喜樂"],
sum:"瓊尼 17 歲跳水致四肢癱瘓，曾絕望到想結束生命。朋友們沒有對她說教，而是用陪伴輸送愛，讓她學會說「我的輪椅」、與困境為友。她研讀神的主權，認識苦難是一面鏡子，照出自己的驕傲與抱怨，也推她走向十字架。一句話改變她一生：神允許祂所憎惡的事，為要成就祂所喜悅的事。五十年後，她為輪椅感謝神。",
pts:["真正的憐憫是與人一同受苦，而不是灌輸真理。","與困境為友：從「那張輪椅」到「我的輪椅」。","苦難最重要的意義是一面鏡子，照出真實的自己。","苦難沒奪走喜樂，反而越脫離罪越喜樂。","神允許祂所憎惡的事，為要成就祂所喜悅的事（創 50:20）。"],
mind:{c:"五十年的恩典",b:[["絕望",["撞牆","酒精麻醉","想結束生命"]],["朋友",["同受苦難","不說教","我的輪椅"]],["苦難如鏡",["驕傲被擊落","腓 2:14","詩 119:71"]],["喜樂",["屬靈爭戰","證明撒但錯了"]],["使命",["瓊尼與朋友們","世界輪椅事工"]]]},
frame:{q:"五十年癱瘓後，如何看當年的意外？",s:["給新傷者寫信","絕望的青春","朋友的陪伴","研讀主權","苦難如鏡","一句改變人生的話","服事特殊需要家庭"],a:"恩典撫平舊傷的棱角，讓我們注目永恆。"},
q:["我寧願坐輪椅而認識耶穌，也不願站立卻沒有祂。","苦難是一面鏡子，照出我不是自以為的那個好人。","神允許祂所憎惡的，為要成就祂所喜悅的。"],
v:["林後 1:6","詩 119:71","羅 8:28-29","腓 2:14","腓 3:14","創 50:20"]},
{i:18,t:"保羅所說的「補滿基督患難的缺欠」是什麼意思？",au:"Wyatt Graham",d:"2025-05-29",c:"聖經與神學",tags:["歌羅西書","教會","與基督聯合"],
sum:"西 1:24 說保羅要在肉身上補滿基督患難的缺欠，難道十架救贖不完全？作者用兩個真理解釋：一、大馬士革路上耶穌說「你為什麼逼迫我」，教會就是基督的身體；二、頭與身體不可分，大貴格利指出基督的受苦透過教會延續。「缺欠」不是救贖不足，而是身體還要與頭一同受苦。我們的苦難因此成為參與基督持續工作的管道。",
pts:["西 1:24 的困惑：基督的救贖還有缺欠嗎？","逼迫教會就是逼迫耶穌（徒 9:4-5）。","頭與身體聯合：頭已受苦，身體仍要受苦。","「缺欠」指身體與頭一同受苦，不是救贖不足。","苦難是基督在我們裡面運用大能的方式（西 1:29）。"],
mind:{c:"補滿基督患難",b:[["困惑",["西 1:24","十架已成"]],["身體",["徒 9:4-5","教會是基督身體","羅 12、林前 12"]],["頭與身體",["弗 5:32","大貴格利","苦難延續"]],["意義",["參與基督工作","西 1:29","在苦難中喜樂"]]]},
frame:{q:"基督的患難怎麼會有缺欠？",s:["經文難題","真理一：教會是基督身體","真理二：頭與身體聯合","解答：身體一同受苦","應用：苦難的意義"],a:"我們的苦難不貶低十架，而是參與基督在地上的持續工作。"},
q:["逼迫基督徒，就是逼迫基督。","頭已在十架受苦，身體仍在地上同受。","苦難不是跟隨耶穌的副作用，而是祂大能運行的管道。"],
v:["西 1:24","徒 9:4-5","徒 9:16","弗 5:23","弗 5:32","西 1:29"]},
{i:19,t:"一型糖尿病患者的生活",au:"Ryley Heppner",d:"2025-04-28",c:"基督徒生活",tags:["慢性病","孤獨","聖經"],
sum:"作者 27 歲確診一型糖尿病，經歷恐懼、崩潰、疲憊與孤獨。他回想年輕時在加拿大北方鑽井平台被欺凌、最孤獨的日子，那時只有聖經，卻成為最平安喜樂、信心奠基的時期。神透過話語揭示看不見的真實：祂一直同在。正如彭柯麗所說，當基督成為你唯一所有，你才明白祂就是你所需的一切。",
pts:["慢性病帶來恐懼、疲憊、無止境的照護與孤獨。","完全的解脫要等到神擦去一切眼淚（啟 21:4）。","鑽井平台上無處可逃，只有聖經：工作、讀經、工作、讀經。","不是文字有魔力，而是神藉話語揭示祂的同在。","苦難是信心成長的催化劑（林後 1:9）。"],
mind:{c:"病中的盼望",b:[["病的重量",["恐懼","疲憊","孤獨"]],["鑽井平台",["被欺凌","只有聖經","最喜樂的時光"]],["真理",["詩 34:18","林後 12:9","林後 1:9"]],["基督是一切",["彭柯麗","八福","幸運的傢伙"]]]},
frame:{q:"恐懼、疲憊、孤獨中如何有盼望？",s:["確診與恐懼","日常的耗損","找不到理解者","回憶鑽井平台","在話語中遇見神","基督成為一切"],a:"苦難把你帶到讓基督成為一切的地方，那就是最好的地方。"},
q:["我以為信仰成長需要安逸，其實苦難才是催化劑。","我以為需要離開困境，其實只需要耶穌。","你在最該在的地方：讓基督成為你的一切。"],
v:["啟 21:4","詩 34:18","林後 12:9","林後 1:9","太 5:3-4"]},
{i:20,t:"如何為洛杉磯森林火災提供幫助",au:"Brett McCracken",d:"2025-01-13",c:"社會與時事",tags:["災難","禱告","奉獻"],
sum:"2025 年洛杉磯山火造成重大死傷與上萬建築損毀。當地牧師分享：災難中普遍恩典顯現，陌生人彼此安慰，各教會聯合禱告；人們看見世物短暫，渴望不能震動的國。作者列出具體幫助方式：七個禱告方向（安慰、保護、供應、教會、領袖、天氣、復興）以及透過當地教會與基督教救援機構奉獻。",
pts:["山火規模驚人，許多家庭流離失所。","災難中普遍恩典顯現：鄰里互助、教會聯合。","災難讓人看見地上事物的短暫。","七個禱告方向：安慰、保護、供應、教會、領袖、降雨、復興。","透過可信任的地方教會與救援機構奉獻。"],
mind:{c:"為山火災民",b:[["災情",["死傷","建築損毀","撤離"]],["神在動工",["普遍恩典","教會聯合禱告","渴望永恆"]],["禱告",["安慰","保護","供應","復興"]],["奉獻",["地方教會基金","救援機構"]]]},
frame:{q:"遠方的我們能為災區做什麼？",s:["了解災情","聽在地牧者的分享","具體禱告","經濟奉獻"],a:"在災難中，教會成為城市的光與避難所。"},
q:["災難讓人看見地上一切多麼短暫。","在灰燼中，教會比以往更像隊友。","我們現在看到的，只是神作為的一小部分。"],
v:["來 12:28"]},
{i:21,t:"加爾文主義幫助我安然經過癌症的試煉",au:"Jenna Diprima",d:"2023-07-25",c:"基督徒生活",tags:["癌症","主權","改革宗"],
sum:"35 歲、有三個年幼孩子的作者確診三期乳癌。她說改革宗神學（「偉大的神」神學）是她的生命線，並分享三個真理：一、神在祂子民的苦難中得榮耀；二、神使萬事互相效力，叫選民得益處——這是要信而非要看見的應許；三、神必保守選民到底，沒有任何事能使我們與神的愛隔絕。在陽光下學神學，是為了黑暗來臨時。",
pts:["神若對我的癌症沒有主權，「神掌權」就只是陳詞濫調。","當我們在神裡面最滿足時，神在我們身上最得榮耀。","羅 8:28 是給我們信心，不是讓我們看見的應許。","神賜下的都是我們需要的；祂留下的都是不必要的（牛頓）。","沒有任何事能使我與神的愛隔絕（羅 8:31-39）。"],
mind:{c:"大神學托住癌症",b:[["神得榮耀",["詩 139:13","神不震驚","在祂裡最滿足"]],["萬事效力",["羅 8:28","信而非看見","可能的益處"]],["保守到底",["腓 1:6","羅 8:31-39","不取決於戰勝癌症"]],["深根教義",["生命線","黑暗中的燈"]]]},
frame:{q:"確診癌症時，哪些教義能托住我？",s:["確診","真理一：神的榮耀","真理二：萬事效力","真理三：保守到底","在陽光下預備"],a:"當所有燈都熄滅，主權的神學仍是一盞燈。"},
q:["如果神對我的癌症沒有主權，「神掌權」只是一句空話。","你不需要了解神怎麼安排，只需要相信祂是為你安排。","在陽光下學神學，是為了靈魂將進入的黑暗。"],
v:["詩 139:13","路 12:7","羅 8:28","林後 1:4","腓 1:6","羅 8:31-39"]},
{i:22,t:"苦難並不總是為了給你功課",au:"Blake Glosson",d:"2023-06-28",c:"聖經與神學",tags:["約伯","成功神學","陪伴"],
sum:"「神想透過這件事教你什麼？」常是好問題，但把苦難簡化為「功課」有五個危險：一、不合聖經（約伯與耶穌受苦的目的都不只是功課）；二、不公正地譴責受苦者；三、成為一種軟性成功神學（學會功課就得祝福）；四、高估人理解神的能力；五、扭曲神的形像，彷彿祂扣住同在直到你破解密碼。耶穌是進入苦難洪流成為避難所的救主。",
pts:["約伯受苦源於撒但控告；若要糾正，該被糾正的是撒但。","所有苦難都源自罪，但不是所有苦難都是個人犯罪的後果。","「我學會功課，然後得到祝福」不是聖經的普遍應許。","不知道神為何允許苦難，不代表你做錯——代表你不是神。","神不是把你關進密室要你破解密碼的父親。"],
mind:{c:"苦難≠功課",b:[["不合聖經",["約伯","耶穌","彼前 3:18"]],["譴責受苦者",["暗示是你的錯","約 9:2-3"]],["軟性成功神學",["學會功課→得祝福","盼望錯置"]],["高估自己",["賽 55:8-9","我們不是神"]],["扭曲神",["密室破解","耶穌是避難所"]]]},
frame:{q:"苦難只是神給我的功課嗎？",s:["肯定：功課有價值","危險一至五","陪伴者的角色","耶穌的心"],a:"神在苦難中的目的，遠比一門功課更大。"},
q:["你不明白神為何允許，不是因為你做錯，而是因為你不是神。","神沒有扣住祂的同在，等你交出功課報告。","陪伴者的工作不是解釋一切，而是同在。"],
v:["雅 1:2-4","伯 1:1-12","彼前 3:18","來 5:8","羅 5:12","約 9:2-3","賽 55:8-9"]},
{i:23,t:"用盼望活出今生的祕訣",au:"Matt McCullough",d:"2023-06-20",c:"基督徒生活",tags:["死亡","榮耀","應許"],
sum:"世上的思慮常把道擠住（太 13:22）。借用凱勒的比喻：生活問題像影片，神的應許像背景音訊，總是影片抓住注意力。作者提出，誠實面對死亡反而是盟友：看清問題比想像更嚴重，才看見耶穌是更偉大的救主。保羅在林後 4:17 用天平比較：苦楚至暫至輕，榮耀極重永遠——不是輕看痛苦，而是放大榮耀。",
pts:["世上的思慮讓福音顯得遙遠不真實。","問題是「影片」、應許是「音訊」；要讓應許成為影片。","死亡意識能成為盟友，幫我們準確診斷問題。","林後 4:17 天平：苦楚輕而暫，榮耀重而永。","保羅不是淡化痛苦，而是讓我們感受榮耀之重。"],
mind:{c:"面對死亡的盼望",b:[["思慮",["太 13:22","把道擠住"]],["影片與音訊",["問題搶焦點","應許成背景"]],["死亡",["真實診斷","更大救主"]],["天平",["林後 4:16-18","至暫至輕","極重永遠"]]]},
frame:{q:"如何讓神的應許勝過眼前的問題？",s:["診斷：思慮擠住道","比喻：影片 vs 音訊","盟友：死亡意識","比較：苦難 vs 榮耀","定睛：所不見的"],a:"不是問題變小了，而是榮耀被看得更重了。"},
q:["我們的問題比想像中嚴重，耶穌也比想像中偉大。","保羅沒有把痛苦說輕，而是把榮耀說重。","顧念所不見的，像新郎盯著還沒到手的鑽戒。"],
v:["太 13:22","哀 3:23","林後 4:16-18"]},
{i:24,t:"苦難與榮耀：飛機失事後的講道",au:"Sarah Eekhoff Zylstra",d:"2023-01-26",c:"社會與時事",tags:["空難","講道","羅馬書 8"],
sum:"豐收教會四位領袖空難喪生後的第一個主日，遺孀凱西·塔克仍上台領唱。牧師傑米·特魯塞爾稱會眾一週的彼此相愛是最深刻的講章，並以羅 8:18-22 講苦難與榮耀的張力：將來的榮耀遠超現在的痛苦；受造之物嘆息如同產難，痛苦將催生新生命；在那日之前，聖靈用說不出的嘆息為我們代求。",
pts:["遺孀主日照常敬拜領唱，帶出眼淚與笑聲。","會眾一週的相愛是最深刻的講章（約 13:35）。","羅 8:18：將來的榮耀遠超現在的苦楚。","產難比喻：今天的痛苦會催生榮耀的新生命。","聖靈接住我們說不出的嘆息（羅 8:26）。"],
mind:{c:"空難後的主日",b:[["敬拜",["遺孀領唱","眼淚與詩歌"]],["彼此相愛",["約 13:35","最深的講章"]],["羅 8",["苦難與榮耀","受造之物嘆息","產難"]],["聖靈",["代求","平安與盼望"]]]},
frame:{q:"失去四位領袖後，教會如何聚集？",s:["照常敬拜","感謝愛的支持","紀念四位弟兄","羅 8:18-22 講道","聖靈的代求"],a:"苦難與榮耀並行，直到我們也飛回天家。"},
q:["我還能在主日去哪裡？當然是教會。","你們彼此相愛，就是我最需要的講章。","今天的痛苦，像產痛一樣會生出新的東西。"],
v:["約 13:35","羅 8:18-22","羅 8:26"]},
{i:25,t:"基督徒如何看待苦難",au:"Matt Smethurst",d:"2022-10-27",c:"聖經與神學",tags:["卡森","神義論","框架"],
sum:"整理卡森的講座「超越陳詞濫調」，提出基督徒苦難觀的六根支柱：一、故事的開端：美好的創造與墮落；二、故事的結局：萬物更新，避免天真的烏托邦；三、無辜者受苦的空間：神要我們的信心多過理解；四、護理的奧祕（相容論）；五、道成肉身與十字架的中心；六、背起十字架，向受逼迫教會學習。這些應在邪惡日子來臨前預先思考。",
pts:["所有苦難都是我們活在死亡權勢下的表現（路 13）。","結局：萬物終將被糾正；不要指望政治造出完美世界。","約伯 42 與啟示錄 21-22：正義必得伸張。","神絕對掌權，人仍負完全責任（相容論）。","唯有基督教的神親身進入苦難；十架是寶座。"],
mind:{c:"苦難觀六支柱",b:[["開端",["美好創造","創 3 之後","路 13:1-5"]],["結局",["羅 8:18-25","萬物更新","拒絕烏托邦"]],["無辜受苦",["約伯","信心多過理解"]],["護理奧祕",["相容論","人仍負責"]],["十字架",["徒 2:23","帶傷的神"]],["背十架",["受逼迫教會","彼前 2:21"]]]},
frame:{q:"建立穩固的苦難神學需要哪些支柱？",s:["創造與墮落","萬物更新","無辜者的位置","護理的奧祕","道成肉身與十架","背起十字架"],a:"在邪惡日子來到之前，預先建好這六根支柱。"},
q:["神要我們的信心，多過要我們的理解。","唯有基督教的神，帶著傷痕向我們說話。","危機中先給同情與水，神學框架留待之後。"],
v:["創 3","路 13:1-5","羅 8:18-25","伯 13:15","伯 42","啟 21-22","徒 2:23","徒 4:27-28","彼前 2:21"]}
);

D.push(
{i:26,t:"邪惡的問題關乎每個人",au:"Gavin Ortlund",d:"2022-10-26",c:"聖經與神學",tags:["神義論","護教","虛無主義"],
sum:"神義論是反對神存在最大的論據，但陪伴受苦者時應先用眼淚、沉默、禱告而非說教。作者指出：道金斯稱車禍為「悲劇」，本身就預設了道德標準；就像沒有直線就說不出曲線（路易斯）。若只有物競天擇，種族滅絕與鯊魚吃海豹無本質差別。所以邪惡是每個人的問題：有神論要解釋惡，無神論要解釋善。基督徒在空墳墓中有盼望，每條彎線終將被拉直。",
pts:["陪伴受苦者：羅 8:28 在羅 12:15 之前，但陪伴順序應相反。","稱某事為「悲劇」需要一個道德標準。","沒有直線，就說不出曲線（路易斯）。","虛無主義解釋不了人對死亡的悲劇感。","基督徒要面對惡的問題，懷疑論者要面對善的問題。"],
mind:{c:"彎線與直線",b:[["牧養先行",["眼淚","沉默","羅 12:15"]],["道金斯",["無意義悲劇","道德詞彙從哪來"]],["虛無主義",["電影《灰色》","不要溫和走入良夜","悲劇感無解"]],["基督徒答案",["創造與墮落","十字架","空墳墓"]]]},
frame:{q:"世上的惡，是否否定了神？",s:["先陪伴，後解釋","從問題旁邊切入","道德判斷的來源","虛無主義的矛盾","惡的問題 vs 善的問題","十架與復活"],a:"每條彎曲的線，終將被拉直。"},
q:["說一條線彎，你心中得先有一條直線。","有神論要解釋惡，無神論要解釋善。","陪伴受苦者，先哭再講道理。"],
v:["羅 8:28","羅 12:15","太 27:46"]},
{i:27,t:"我從宣教士遺孀那裡學到的功課",au:"Grace Thornton",d:"2022-05-18",c:"教會事工",tags:["宣教","喪偶","見證"],
sum:"格洛麗亞在墨西哥海邊失去溺水的丈夫和女兒，當場向圍觀人群傳講生命短暫與永生；贊比亞宣教士遺孀斯塔西在丈夫死於胰臟癌後，發現當地人更願意聽她說話。作者學到：受苦是跟隨耶穌的一部分；苦難讓人得著被傾聽的機會；神不浪費苦難——格洛麗亞留下，那裡建立了教會。",
pts:["作者曾有隱藏的成功福音：走在神的路上必得地上祝福。","在最深的失去中，你會知道什麼最重要。","苦難成為橋樑：同受苦難的人更願傾聽。","伊麗莎白·艾略特：神不浪費苦難。","我們未必知道苦難的果子，但知道神有目的。"],
mind:{c:"遺孀的功課",b:[["格洛麗亞",["海灘溺水","當場傳福音","建立教會"]],["斯塔西",["丈夫病逝","贊比亞","失去成為橋樑"]],["艾略特",["留在部落","神不浪費苦難"]],["功課",["受苦是跟隨的一部分","得傾聽的機會","林後 4:17"]]]},
frame:{q:"宣教士遺孀教了我什麼？",s:["海灘上的見證","拆除成功福音","苦難帶來傾聽","苦難大有用處"],a:"神不浪費苦難，祂也可能用它把別人帶進榮耀。"},
q:["最深的失去，讓你看清什麼最重要。","同樣的話，從墳前說出來，分量完全不同。","背起十字架，需要張開雙手放下其他東西。"],
v:["腓 3:7-10","雅 1:2","林後 4:17"]},
{i:28,t:"度過苦難的四種忍耐動力",au:"Kristen Wetherell",d:"2022-04-28",c:"基督徒生活",tags:["忍耐","雅各書","約伯"],
sum:"以懷孕最後一個月的難熬比喻基督徒在世的等候。雅各書提供四種忍耐的動力：一、神會使用你的苦難（雅 1:2-4）；二、神會終結你的苦難（雅 1:12、啟 21:4）；三、神會在苦難中顯明自己——約伯因此更認識救贖主（雅 5:11）；四、神會在苦難中接納你的哀哭（伯 1:20-22）。最後，如同母親抱著嬰孩說「值得」，教會也將在主面前說祂配得。",
pts:["試煉本身不愉快，但神在其中的作為令人喜樂。","苦難有期限，不會永遠持續。","約伯對苦難認識少，對救贖主的認識也會少。","可以把眼淚與疑問帶到神面前；悲傷不是罪。","如同分娩，為了前面的喜樂堅持下去。"],
mind:{c:"四種忍耐動力",b:[["神使用",["雅 1:2-4","信心成熟"]],["神終結",["雅 1:12","啟 21:4","生命冠冕"]],["神顯明",["雅 5:11","伯 19:25","憐憫慈悲"]],["神接納",["伯 1:20-22","哀哭被接納"]]]},
frame:{q:"苦難中靠什麼堅持下去？",s:["懷孕的比喻","動力一：神使用","動力二：神終結","動力三：神顯明","動力四：神接納","為喜樂前行"],a:"像產婦抱著孩子說「值得」，我們也將對主說祂配得。"},
q:["沒有分娩就沒有新生兒，沒有試煉就沒有真信心。","苦難有期限，它不會永遠持續。","越認識苦難，越認識救贖主。"],
v:["雅 1:2-4","雅 1:12","林後 4:17","啟 21:4","雅 5:11","伯 19:25","伯 1:20-22","啟 4:11"]},
{i:29,t:"受苦時有可能在基督裡喜樂嗎？",au:"Randy Alcorn",d:"2022-04-14",c:"聖經與神學",tags:["喜樂","感恩","永恆視角"],
sum:"神從未應許基督徒生活更容易，但聖經的喜樂不否認現實。喜樂扎根於不變的神，而非變動的處境；我們不為惡事本身喜樂，卻相信神使萬事效力。作者在與妻子抗癌期間默想神的屬性，發現越認識神越喜樂。感恩是可靠的鑰匙，而且苦難必將終結，並為我們成就永遠的榮耀。",
pts:["喜樂圍繞的是不變的神，不是變動的處境。","不為惡事本身喜樂，而是相信神在其中效力（羅 8:28）。","對神軟弱或錯誤的看法，會毒害喜樂的源頭。","選擇感恩從不困難，而感恩總能激發喜樂。","求神把永恆印在我們的眼球上。"],
mind:{c:"苦中之樂",b:[["根基",["腓 4:4","不變的神","不否認現實"]],["主權與慈愛",["詩 115:3","箴 16:9","默想屬性"]],["感恩",["弗 5:20","帖前 5:18","取消旅行的例子"]],["永恆",["羅 8:18","林後 4:17-18","苦難會終結"]]]},
frame:{q:"受苦時還能真正喜樂嗎？",s:["承認苦難是常態","喜樂扎根於神","認識神的屬性","選擇感恩","永恆的視角"],a:"新天新地最平凡的一天，也勝過今生最好的一天。"},
q:["越認識神的屬性，在困境中的喜樂儲備就越深。","讓自己快樂很難，但選擇感恩從不困難。","神啊，請將永恆印在我的眼球上。"],
v:["提後 3:12","彼前 4:12","腓 4:4","弗 5:18-20","帖前 5:18","羅 8:28","詩 115:3","羅 8:18","林後 4:17-18"]},
{i:30,t:"對新的一年，也要期待一成不變",au:"Elliot Clark",d:"2021-12-15",c:"基督徒生活",tags:["盼望","新年","詩篇"],
sum:"年終時，我們隱藏的真實故事——慢性病、空房間、無法掙脫的罪——常讓現實主義者滑向悲觀。詩篇顯示兩個現實：苦難會重演，神的拯救常姍姍來遲。大衛反覆問「主啊，還要多久？」蘇丹受逼迫的牧師也這樣禱告。事情在今世可能不會改變，但基督徒擁有彼得所說的活潑盼望——一種超越今生、定睛基督顯現的永恆樂觀。",
pts:["每個人都有不想被看見、卻希望有人揭開的真實故事。","失去盼望比悲觀更糟；有盼望則勝過一切樂觀。","神的僕人常經歷低谷與遲來的拯救，不一定是缺乏信心。","「主啊，還要多久？」要到復活時才有完整答案。","新的一年需要的是對新天新地的終末盼望。"],
mind:{c:"一成不變中的盼望",b:[["真實故事",["病痛","失落","重複的罪"]],["詩篇現實",["苦難重演","拯救遲來"]],["還要多久",["大衛","蘇丹牧師"]],["永恆樂觀",["彼前 1","新天新地"]]]},
frame:{q:"如果新的一年還是老樣子呢？",s:["現實主義的滑坡","隱藏的生命故事","為何神不立刻拯救","還要多久的禱告","終末盼望"],a:"盼望是一種超越這個世界的永恆樂觀。"},
q:["失去盼望，比悲觀更糟。","事情在今世可能不會改變，但這不是故事的結局。","「還要多久」要等到復活才有完整答案。"],
v:["詩 13","彼前 1:3-13"]},
{i:31,t:"思念這些事：凡是公義的",au:"Emma Scrivener",d:"2021-12-13",c:"基督徒生活",tags:["公義","腓立比書 4:8","十字架"],
sum:"母親常聽孩子喊「不公平」，也發現自己心裡同樣這樣喊——意思是「我應得更好的」。但若堅持要神給我們應得的，其實是在簽署自己的死刑令。神的公義遠大於公平：基督在十架上擔當審判，使罪人稱義；祂不折斷壓傷的蘆葦，卻要使驕傲的降卑。思念公義，就是思念那將要更新一切、公義作王的國度。",
pts:["「不公平」的抱怨背後是：我應得更好的。","如果神給我們應得的，我們都要被定罪。","神的公義在十架上彰顯：罪被責罰，罪人稱義（羅 3）。","基督以公義而溫柔待壓傷的蘆葦（賽 42:3）。","終局：公義作王直到永遠（賽 9:7）。"],
mind:{c:"凡是公義的",b:[["不公平",["孩子的哭喊","我的心聲","我應得更好"]],["神的公義",["申 32:4","詩 89:14","糾正世界"]],["十字架",["賽 53:5","羅 3","羅 8:1"]],["將來",["賽 42:1-4","賽 9:7","萬物歸正"]]]},
frame:{q:"覺得不公平時，該思念什麼？",s:["日常的不公平","若要應得的——死","神的公義與十架","溫柔的審判者","公義作王"],a:"基督拿走我應得的刑罰，賜下祂的公義。"},
q:["要求神給我應得的，等於簽下自己的判決書。","神的公義帶來的不只是公平，而是新天新地。","祂不折斷壓傷的蘆葦，卻要降卑驕傲的人。"],
v:["腓 4:8","申 32:4","詩 89:14","賽 42:1-4","賽 53:5","羅 3:25-26","羅 8:1","賽 9:7"]},
{i:32,t:"一位阿富汗基督徒談苦難",au:"Luke Anwari",d:"2021-10-12",c:"社會與時事",tags:["逼迫","阿富汗","宣教"],
sum:"曾因信仰被監禁、流放的阿富汗基督徒指出：苦難使教會成聖，篩出假信徒，真信徒卻在深度和人數上增長。他提出三種敬畏神的回應：像約瑟一樣在不公中信靠神（創 50:20）；像早期教會分散時仍傳福音；像彼得約翰在威脅下堅忍見證。基督是我們受苦的榜樣（彼前 2:21），苦難短暫，榮耀在前。",
pts:["逼迫來臨時，動機不純的人會離開。","真信徒會害怕，但不會放棄基督。","回應一：在苦難中信靠神的美意。","回應二：被分散時仍傳揚福音。","回應三：靠聖靈在威嚇中堅忍見證。"],
mind:{c:"阿富汗信徒談苦難",b:[["苦難篩選",["假信徒離開","真信徒增長"]],["三種回應",["信靠（約瑟）","傳福音（安提阿）","堅忍（彼得約翰）"]],["經文",["彼前 2:21","彼前 1:6-7"]],["神的目的",["榮耀","建立教會","成聖"]]]},
frame:{q:"受逼迫的教會如何回應苦難？",s:["苦難使教會成聖","以信心忍受","分散中傳福音","堅忍作見證","仰望榮耀"],a:"無論如何都不否認主，並向世界宣揚福音。"},
q:["苦難把真信徒和假信徒分開。","真信徒會害怕，但不會放棄基督。","被迫離鄉，人生目標仍是耶穌。"],
v:["創 50:20","徒 14:26","徒 4:17-22","彼前 2:21","彼前 1:6-7"]},
{i:33,t:"耶穌不懼怕我的苦難和問題",au:"Bethany Barnard",d:"2021-09-08",c:"文化與藝術",tags:["強迫症","抑鬱","詩歌創作"],
sum:"作者被診斷出嚴重強迫症與抑鬱。過去她認為吃藥代表信心不足，停藥兩天就放棄；後來在喪父、疫情與一連串危機中崩潰，才開始接受治療與藥物。她在約伯記、哀歌、詩篇中找到誠實的提問，並把問題寫成專輯。她發現：誠實的提問不會趕走耶穌；創傷、懷疑與心理健康掙扎，不使人失去基督徒資格。",
pts:["曾以為吃藥代表信心不夠。","一連串危機讓她把臉埋在地毯裡呼喊。","約伯記等經卷讓她看到聖經容許殘酷誠實的問題。","她把問題寫成歌：憤怒、悲傷、耶穌同哭。","黑暗之處趕不走耶穌；衝突與問題也可能是健康的表現。"],
mind:{c:"帶著問題來到耶穌",b:[["診斷",["強迫症","抑鬱","PTSD"]],["誤解",["吃藥=沒信心","必須撐住"]],["資源",["約伯記","詩篇","好書與講道"]],["創作",["把問題寫成歌","約 11 同哭"]],["領悟",["問題不趕走耶穌","真實關係"]]]},
frame:{q:"心理疾病與疑問，會讓我失去信仰資格嗎？",s:["診斷與逃避","完美風暴","接受治療","在經文中找到提問者","寫成音樂","福音觸及心理健康"],a:"黑暗之處趕不走耶穌，反而顯明祂的心。"},
q:["誠實的問題，不會把耶穌趕走。","真實的關係需要比社群貼文更多的東西。","我的掙扎沒有取消我作基督徒的資格。"],

{i:34,t:"阿富汗牧師如何思想上帝的主權",au:"Mark Morris",d:"2021-08-17",c:"教會事工",tags:["阿富汗","主權","逼迫"],
sum:"塔利班重掌阿富汗之際，一群阿富汗牧師剛正式登記為基督徒，為下一代能公開跟隨耶穌。退修會中傳來威脅信、少女被擄的消息；眾人研讀出埃及記中法老的剛硬、羅馬書 9 章陶匠與泥土，相信神甚至稱尼布甲尼撒為「我的僕人」。他們總結：面對苦難要相信神的主權、謙卑、記得苦難彰顯恩典的榮耀，並且苦難是完成大使命計劃的一部分。",
pts:["牧師們冒險登記信仰，為下一代鋪路。","邪惡逼近時，眾人仍在神的主權中尋求理解。","神稱尼布甲尼撒為「我的僕人」（耶 27:6）。","羅 9：神是陶匠，我們是泥土。","唱「堅固保障」時傳來政權易手的消息。"],

frame:{q:"邪惡征服國家時，神仍掌權嗎？",s:["為下一代登記信仰","退修會中的壞消息","法老與尼布甲尼撒","陶匠與泥土","面對苦難五原則"],a:"陶匠正在為祂的目的製作祂的器皿。"},
q:["總得有人付代價，讓下一代能公開跟隨耶穌。","連最邪惡的王，神也稱為「我的僕人」。","陶匠正在為祂的目的塑造器皿。"],
v:["出 7-11","出 33:19","耶 27:6","耶 43:10","羅 9","賽 8","賽 28","羅 10"]},
{i:35,t:"優秀的屬靈書籍是苦難中的禮物",au:"Nancy Guthrie",d:"2021-08-16",c:"基督徒生活",tags:["屬靈書籍","陶恕","成聖"],
sum:"艱難的狂風來襲時，我們需要拴住自己的堅固之物；論述神在苦難中作為的好書正是如此。作者摘錄陶恕的一段文字：盧瑟福為鐵錘、銼刀、火爐讚美神，因為它們都是同一位工匠手中的工具。若釘子記得錘子在木匠手中，怨恨便消失。這個時代把救恩看成逃避不愉快的方便之門，但成聖之路需要神手中的工具。",
pts:["好書闡明的聖經真理，是風暴中腳下的堅實基礎。","鐵錘、銼刀、火爐都是同一位主人手中的工具。","釘子若記得錘子在木匠手中，就不再怨恨。","這個時代把基督教當作無痛系統。","成聖的苦難多是內在的；神用艱難環境潔淨兒女。"],
mind:{c:"錘子、銼刀、火爐",b:[["好書",["錨定靈魂","古今作者"]],["三個工具",["鐵錘","銼刀","火爐"]],["關鍵",["同一位工匠","主人的心意"]],["時代病",["無痛宗教","逃避十架"]],["成聖",["內在爭戰","感謝熔爐"]]]},
frame:{q:"為什麼能為痛苦的工具感謝神？",s:["風暴需要錨","鐵錘：釘子的視角","銼刀：被塑造","火爐：被煉淨","愛那位工匠"],a:"愛那位握著工具的主，就能在錘下順服。"},
q:["錘子、銼刀和火爐，都在同一位工匠手中。","我們把救恩當成逃避不愉快的方便之門。","沒有經歷神手的創傷，很難領受神的深福。"],
v:["來 12:10-11"]},
{i:36,t:"為耶穌而穿著",au:"Clarissa Moll",d:"2021-08-09",c:"基督徒生活",tags:["喪偶","敬拜","偶像"],
sum:"丈夫意外過世後，獨自帶四個孩子的作者放棄了主日早晨的「穿衣大戰」，只請孩子穿上自己「最好的衣服」。這小小的投降揭露了她內心的「敬拜大戰」：以體面外表在神面前稱義、在意別人眼光、以外表評斷人。孩子從穿黑衣到穿新衣，也讓她看見神將喜樂代替哀傷。我們真正的衣裳，是基督的義。",
pts:["悲傷迫使她承認精力有限，放下週日的穿衣戰爭。","穿著體面暗示了在神面前靠自己稱義的心。","擔心別人眼光，揭露了重外表輕內心的偶像。","獻給神最好的是悔改、饒恕與溫柔安靜的心（彼前 3:4）。","從黑衣到新衣：神以喜樂代替哀傷。"],
mind:{c:"為耶穌穿上什麼",b:[["改變起因",["丈夫過世","獨自養育","放下穿衣戰"]],["整潔",["自義","羅 3:10","髒衣如心"]],["外觀",["怕人評判","彼前 3:4"]],["新衣",["喪服到新衣","基督的義"]]]},
frame:{q:"主日要穿最好的衣服，是為了誰？",s:["過去的堅持","喪偶後的投降","揭露自義","揭露重外表","從哀傷到喜樂"],a:"我主耶穌是我的義，也是我的錦衣。"},
q:["放棄穿衣戰爭，卻揭露了我的敬拜戰爭。","人看外表，神看內心。","神以喜樂的衣裳，代替哀傷的衣裳。"],
v:["羅 3:10","撒上 16:7","彼前 3:4","賽 61:3"]},
{i:37,t:"夜鶯，你怎麼能說自己沒事呢？",au:"Angela Davis",d:"2021-07-29",c:"文化與藝術",tags:["癌症","盼望","流行文化"],
sum:"歌手「夜鶯」在三次抗癌、婚姻破裂後登上《美國達人秀》，唱出原創歌曲令評審落淚。她的盼望來自神：神可以瞬間醫治，但也不會留下任何美善不給她。她說神不是拿走痛苦，而是加上光、水與同在；她在浴室地板上遇見神。作者也曾在初為人母時罹癌。十字架就是人類的浴室地板——神在最卑微處與我們相遇。",
pts:["夜鶯的藝名來自夢中在黑暗裡唱歌的鳥。","神若過早拿走困難，也會拿走祂在屬靈上成就的神蹟。","神通常不拿走痛苦，而是加上光明、水和同在。","痛苦之處往往是離神最近之處。","十字架是人類的浴室地板，神在那裡與我們相遇。"],
mind:{c:"黑暗中的歌",b:[["夜鶯",["三次抗癌","婚姻破裂","達人秀"]],["她的盼望",["神能醫治","不缺美善","黑夜之鳥"]],["神的方式",["加添而非拿走","浴室地板"]],["十字架",["道成肉身","最卑微處","苦中喜樂"]]]},
frame:{q:"絕症中怎能說「沒事的」？",s:["夜鶯的故事","盼望的來源","不糖衣的掙扎","作者的共鳴","十字架上的相遇"],a:"當沒有別的可依靠時，盼望往往最清晰。"},
q:["神不是拿走黑暗，而是加上光。","我想做那隻在黑暗中仍唱歌的鳥。","十字架就是人類的浴室地板。"],
v:["出 16","申 8:4"]}
);

{i:38,t:"如何愛病中的弟兄姊妹",au:"Kathryn Butler",d:"2021-05-14",c:"基督徒生活",tags:["探病","陪伴","醫院"],
sum:"作者的朋友大衛在病榻上害怕自己不能進天堂。住院把人從熟悉的屬靈節奏中拉開：藥物讓人讀不了經、疼痛讓神顯得遙遠。這時基督的身體要成為他的眼睛和耳朵。作者提出五種方式：記住並提醒神的愛；持續為他禱告；操練陪伴而非解決問題；每次探訪帶入簡短經文與詩歌；重申他在基督裡的身份。大衛離世前說，神讓他看見祂何等靠近。",
pts:["住院打亂屬靈生活，神的應許可能顯得遙遠。","彼此相愛要有犧牲代價，不是賀卡式的感傷。","陪伴：跟隨他的需要，把他當弟兄而非專案。","帶入短句經文、詩歌，或留下有聲聖經。","像生病前一樣待他，重申他在基督裡的身份。"],
mind:{c:"愛病中的肢體",b:[["處境",["讀不了經","神顯得遙遠","害怕"]],["五種方式",["記住神的愛","禱告","陪伴","帶入經文","重申身份"]],["身體的功能",["成為眼睛","成為耳朵","羅 12:4-5"]],["結果",["羅 8:38-39","神何等靠近"]]]},
frame:{q:"朋友住院時，我能怎樣愛他？",s:["病房裡的恐懼","基督身體的角色","五種具體幫助","忍耐的盼望"],a:"當他能力衰退時，讓教會成為他的視覺與聽覺。"},
q:["當姊妹看不清時，我們要成為她的眼睛。","陪伴他，是因為愛他，不是因為他是一個專案。","像他生病前一樣待他，因為疾病沒有改變他是誰。"],
v:["約 13:34","羅 12:4-5","出 34:6","弗 2:4-5","帖前 5:17","啟 21:5","弗 4:15","羅 8:38-39"]},
{i:39,t:"不要做那個比勒達",au:"John Beeson",d:"2021-05-01",c:"基督徒生活",tags:["約伯","安慰","陪伴"],
sum:"約伯的朋友成了「叫人愁煩的安慰者」。我們也常說「神有更好的」「他在更好的地方」這類切斷悲傷的話。作者提出五個原則：不給陳腐答案而是陪伴；不替人總結功課而是憐憫與禱告；不設悲傷時間表；不要求對方前後一致，容許真實；不淡化神學，也不替神發言。我們能做的，是牽著受苦者的手，帶他到聖潔、慈愛、掌權的神面前。",
pts:["陳腐的安慰話常是在切斷對方的悲傷。","神如母親安慰兒子（賽 66:13）：抱著、讓他哭。","不要試圖解釋隱祕的事，要憐憫與禱告。","悲傷沒有時間表，有人帶著它直到見主。","不要淡化主權神學，也不要代神發表聲明。"],
mind:{c:"好的安慰者",b:[["反例",["約伯的妻子","比勒達","陳腔濫調"]],["五個不要",["陳腐答案","總結功課","時間表","要求一致","淡化神學"]],["要做",["陪伴","憐憫禱告","同步同行","容許真實"]],["約伯的信心",["伯 13:15","帶到神面前"]]]},
frame:{q:"如何避免成為叫人愁煩的安慰者？",s:["撒但的拉攏","愁煩安慰的例子","五個原則","約伯的信心宣告"],a:"握住受苦者的手，把他帶到神面前。"},
q:["「他在更好的地方」可能逼人否認自己的悲傷。","我們無法為朋友的悲傷排時間表。","不要急著撕掉創可貼。"],
v:["伯 1-2","伯 16:2","賽 66:13","伯 19:21","伯 18:2","羅 12:15","伯 3:3-4","雅 5:15","來 12:3-8","伯 13:15"]},
{i:40,t:"撒但對你的苦難有何目的？",au:"John Beeson",d:"2021-04-09",c:"基督徒生活",tags:["屬靈爭戰","孤立","抱怨"],
sum:"苦難的打擊常讓人說「我受夠神了」「沒人能理解我」。作者提醒：撒但如吼叫的獅子，像狼追蹤受傷的獵物一樣徘徊在受苦者周圍。牠的目的有二：孤立你——切斷你與神和教會的連結，說沒人懂你；使你抱怨——一旦在一件事上苦毒，就對所有事都失去感恩。認清仇敵的意圖，就看見反方向的路：更深信靠神、親近神的子民、找到感恩的深井。",
pts:["撒但從你的苦難中有利可圖。","牠想孤立你：遠離禱告、聖經和教會。","「沒有人能理解你」是牠最愛的謊言之一。","牠想讓你抱怨：苦毒會蔓延到一切。","問題不是會不會受苦，而是跟隨誰的劇本。"],
mind:{c:"撒但的劇本",b:[["獅子與狼",["彼前 5:8-9","追蹤受傷者"]],["孤立",["切斷禱告","離開教會","沒人懂你"]],["抱怨",["伊甸園","曠野以色列","苦毒蔓延"]],["抵擋",["信靠神","親近肢體","感恩深井"]]]},
frame:{q:"仇敵想怎樣利用我的苦難？",s:["受苦者常說的話","目的一：孤立","目的二：抱怨","反向路線圖"],a:"選擇按神而不是撒但的旨意度過苦難。"},
q:["撒但像狼一樣，追蹤受傷的獵物。","一旦在一件事上苦毒，就會對一切失去感恩。","仇敵的意圖，正好畫出了抵擋的路線圖。"],
v:["伯 1","彼前 5:8-9","民 11","民 14","詩 23:4"]},
{i:41,t:"我的生活支離破碎，但聖經不會",au:"Vaneetha Rendall Risner",d:"2021-01-28",c:"基督徒生活",tags:["讀經","離婚","喪子"],
sum:"作者經歷喪子、小兒麻痺後遺症、丈夫離去。她曾覺得讀經像嚼硬紙板，寧可找雞湯文、講道或大會快速振作。司布真說：生活不夠破碎的人，常覺得聖經破碎。婚姻破裂後，她開始系統、有規律、有意識地讀經，寫筆記、用經文禱告（詩 119:25、賽 30:19-21），靈修從打卡變成帶來生命的對話。神的話語變得比蜜更甜，平凡的每日讀經改變了她。",
pts:["痛苦中我們想要快速見效的東西，讀經顯得遙遠。","悲嘆詩篇在無話可說時給了她話語。","系統讀經、寫日記、用經文禱告，讓靈修成為對話。","聖靈照亮經文，使我們心裡火熱（路 24:32）。","戲劇性的屬靈經歷不持久，每日平凡的話語才改變生命。"],
mind:{c:"不破碎的聖經",b:[["破碎人生",["喪子","疾病","丈夫離去"]],["錯誤尋求",["雞湯","大會","快速見效"]],["轉向話語",["系統讀","寫日記","用經文禱告"]],["果效",["耶 15:16","申 8:3","詩 119:103"]]]},
frame:{q:"人生崩塌時，真正能撐住我的是什麼？",s:["痛苦中的錯誤尋求","司布真的提醒","三段試煉中的經文","有系統的讀經","真正的滋養"],a:"每天平凡地吃神的話，是在風暴中生存的祕訣。"},
q:["生活不夠破碎的人，常覺得聖經破碎。","嗎哪一開始平淡無奇，後來卻比蜜更甜。","華麗的屬靈高潮不持久，平凡的話語卻改變生命。"],
v:["詩 119:25","賽 30:19-21","路 24:32","耶 15:16","申 8:3","詩 119:103"]},
{i:42,t:"如果我的上司很腐敗，我該怎麼辦？",au:"Will Sorrell",d:"2021-01-27",c:"信仰與工作",tags:["職場倫理","舉報","為義受苦"],
sum:"讀者問：上司誠信有問題，人事部正在調查，我有可靠證據，但怕作證後被報復。作者先區分問題的嚴重程度，再指出基督徒有責任與力量說誠實話（羅 8:15、提後 1:7）。愛鄰舍需要權衡，但若不信成功神學，就可以不顧名聲去愛神愛人。早期教會的中間路線：不主動尋求受苦，也不逃避受苦。神必保守你和你的家。",
pts:["先釐清「誠信問題」的嚴重性，決定回應的嚴肅程度。","聖靈賜的不是膽怯的心，要大膽說誠實話。","要謙卑考慮：哪一個鄰舍要優先保護？","被貼上「吹哨人」標籤，值得為基督背負。","早期教會：不主動尋求殉道，也不逃避受苦。"],
mind:{c:"面對腐敗上司",b:[["釐清",["違規","違法","騷擾"]],["責任",["說誠實話","羅 8:15","提後 1:7"]],["權衡",["家人","同事","上司"]],["受苦觀",["拒絕成功神學","中間道路","太 25:21"]]]},
frame:{q:"說真話可能付代價，我該作證嗎？",s:["釐清嚴重性","基督徒的責任","愛鄰舍的權衡","接受烙印的自由","選擇受苦的歷史"],a:"用愛心說誠實話，把後果交給顧念你的主。"},
q:["你職業的堡壘，從來不是無堅不摧的。","不必為保護自己操心，因為神會保守你。","不主動尋求受苦，也不逃避受苦。"],
v:["羅 8:15","提後 1:7","約 4:23","林前 6:19-20","彌 6:8","腓 1:21","太 25:21"]},
{i:43,t:"危機面前，我們該講什麼樣的道？",au:"Phil A. Newton",d:"2020-11-03",c:"教會事工",tags:["講道","解經","危機"],
sum:"9·11 後的主日，一位牧師暫停系列講道講詩篇 46 篇，下週又回到原系列。作者主張逐卷解經講道是常態：它傳講全備的啟示、教會眾解讀聖經、建立能應用到生活的聖經神學框架。危機時可以短暫偏離，但先自問：是否開了追逐新聞的先例？是否研究時事多過研究經文？事件對會眾影響多大？偏離可以，但不要太久。",
pts:["牧者首要責任是「餵養」羊群（斯托得）。","逐卷解經會讓所有必要的題目自然被觸及。","解經講道培養會眾讀經與釋經的習慣。","危機時可暫停一兩篇，但要避免被新聞主導講台。","按聖經解讀疫情，而不是按疫情解讀聖經。"],
mind:{c:"危機中的講台",b:[["常態",["逐卷解經","全備啟示","釋經習慣","神學框架"]],["自問",["開先例？","研究時事多於經文？","影響多大？"]],["短暫偏離",["詩 46","一兩篇"]],["回歸",["穩定信心","按聖經讀時局"]]]},
frame:{q:"重大危機時，講台要改講時事嗎？",s:["9·11 的例子","三個指導原則","偏離前的三個問題","可以偏離但不要久"],a:"讓會眾按聖經解讀現況，而非按現況解讀聖經。"},
q:["主導講台的應是聖經的敘事，不是最新新聞。","偏離可以，但不要太久。","按聖經讀疫情，而不是按疫情讀聖經。"],
v:["詩 46","徒 20:27"]},
{i:44,t:"流產可能會讓我們難以區分悲傷與罪",au:"Jamie Carlson",d:"2020-10-23",c:"基督徒生活",tags:["流產","悲傷","嫉妒"],
sum:"流產後，作者在社群媒體上看到懷孕喜訊時同時感到喜悅、悲傷和試探，漸漸在罪與悲傷的泥沼中分不清兩者，屬靈上癱瘓。透過禱告與團契，神幫她辨認出三個掙扎：貶低別人的喜樂、不義的惱怒、想讓自己的悲傷蓋過別人喜悅的嫉妒。根源是不信神的主權與良善。但神的恩典更多：我們的罪，連苦難帶出的罪，全都已釘在十架上。",
pts:["悲傷與罪常糾纏，強烈情緒讓人難以分辨。","掙扎一：刻意貶低別人的喜樂來減輕自己的失落。","掙扎二：對他人喜訊的惱怒與苦毒。","掙扎三：嫉妒別人得到的關注與喜悅。","在基督裡，苦難帶出的罪也不定義你的人生。"],
mind:{c:"分辨悲傷與罪",b:[["處境",["流產","懷孕喜訊","躲避人群"]],["三個掙扎",["貶低喜樂","惱怒","嫉妒"]],["根源",["不信主權","不信良善","詩 84:11"]],["恩典",["弗 2:4-7","罪釘十架","詩 34:18"]]]},
frame:{q:"悲傷時，如何辨認裡面混雜的罪？",s:["詩歌中的困惑","流產後的雙重爭戰","墮入深淵","辨認三個掙扎","超大的恩典"],a:"我的罪全部釘在十字架上，不再由我背負。"},
q:["悲傷是真的，但悲傷中的罪也是真的。","我想讓自己的悲傷，蓋過別人的喜樂。","你的罪，即使是苦難帶出的，也不會決定你的人生。"],
v:["詩 34:17-18","詩 84:11","弗 2:4-7","羅 12:15"]},
{i:45,t:"流產之痛能結出什麼果子？",au:"Rebekah Hannah",d:"2020-10-09",c:"基督徒生活",tags:["流產","同理心","恨惡罪"],
sum:"一位懷孕 36 週卻得知胎兒停止發育的母親，聽到朋友懷孕的消息時流下喜悅的淚水。作者看見：在信心中悲傷會結出果子。流產使人更讚歎神在母腹中保守生命的手、能與喜樂的人同樂；使人更有同理心與哀哭的人同哭；讓人更恨惡帶來死亡的罪，並仰望勝過罪的主；最終釋放人去愛其他受苦者。",
pts:["在信心與盼望中悲傷，才會結出公義的果子。","每個平安出生的孩子都是神蹟，值得敬拜保守生命的神。","帶著盼望的悲傷，使我們更能與哀哭的人同哭。","流產讓人親身經歷咒詛的恐怖，更恨惡罪。","苦難可以釋放我們去愛其他受苦的人。"],
mind:{c:"悲傷的果子",b:[["一幕",["流產的母親","朋友懷孕","喜極而泣"]],["同樂",["讚歎生命","詩 139:13"]],["同哭",["羅 12:15","林後 1:4","約 11:35"]],["恨罪",["伯 12:10","弗 4:22-24","啟 21:5"]],["愛人",["釋放去愛"]]]},
frame:{q:"流產的痛，能結出什麼果子？",s:["兩位母親的相遇","在信心中悲傷","與喜樂的人同樂","與哀哭的人同哭","恨惡罪","愛其他受苦者"],a:"在痛苦中敬拜，就是悲傷結出的美麗果子。"},
q:["一個預備再次失去孩子的母親，為別人的生命喜極而泣。","當我們陪人哭泣時，我們就是在愛。","我不想珍惜那殺死我孩子的東西。"],
v:["詩 139:13","羅 12:15","林後 1:4","約 11:35","伯 12:10","弗 4:22-24","啟 21:5"]},
{i:46,t:"神為什麼容許新冠病毒害我破產？",au:"Dave Harvey",d:"2020-06-18",c:"信仰與工作",tags:["疫情","失業","羞恥"],
sum:"史蒂夫在單親貧困家庭長大，發誓讓家人永不匱乏。疫情讓他的生意崩潰，他憤怒地問「為什麼」，又因無法供應家庭而羞恥。作者指出三件事：懷疑會來，但「為什麼」像原地打轉的旋轉木馬，答案是信心（來 11:6）；歡迎軟弱，當他向妻子敞開，福音除去羞恥；記住林後 1:3-4 的應許，神安慰我們，好讓我們安慰人。公司最終關閉，但他變得更謙卑透明，開始服事其他企業主。",
pts:["失去事業不只是財務問題，也侵蝕自我價值。","「為什麼」的旋轉木馬偷走時間，最後把人送回原地。","答案不是解釋，而是扎根於神話語的信心。","承認軟弱與羞恥，讓夫妻在福音中更親密。","神的安慰使我們能安慰別人（林後 1:3-4）。"],
mind:{c:"疫情中的破產",b:[["背景",["童年匱乏","供應的誓言","生意崩潰"]],["懷疑",["為什麼","旋轉木馬","來 11:6"]],["軟弱",["羞恥","向妻子敞開","來 12:2"]],["應許",["林後 1:3-4","安慰別人","新的服事"]]]},
frame:{q:"事業被疫情摧毀時，神在哪裡？",s:["史蒂夫的故事","懷疑與憤怒","承認軟弱","牢記應許","比為什麼更好的"],a:"沒有答案時，我們仍能得著神同在的安慰。"},
q:["「為什麼」是一座只會原地打轉的旋轉木馬。","承認軟弱，反而帶來新的自由。","我們領受的安慰，是為了傳遞出去。"],
v:["來 11:6","來 12:2","林後 1:3-4"]},
{i:47,t:"如果你二十多歲的生活和你想像的不一樣……",au:"Jackie Knapp",d:"2020-05-25",c:"基督徒生活",tags:["青年","期待落空","教會"],
sum:"作者和朋友談到不孕、分手、婚姻衝突、被裁員、離開宣教禾場，共同心聲是：沒想到二十多歲這麼辛苦。他們在基督教流行文化中長大，被鼓勵改變世界、期待完美婚姻，卻沒人教他們耶穌如何面對苦難。作者呼籲：為破碎的夢悲傷、接受失望，放棄對完美人生的期待；同時期待神以新的方式出現，向長輩學習，並讓教會成為誠實的地方。",
pts:["我們以為苦難是中老年人的專利。","基督教流行文化暗示：做好本分，神就給美好生活。","不要扮演受害者，要對自己的幻想負責。","學會為破碎的夢悲傷，在無解中信靠神。","渴望教會更誠實，並向老一輩學習如何受苦。"],
mind:{c:"不如預期的二十歲",b:[["現實",["不孕","分手","失業","衝突"]],["錯誤期待",["改變世界","完美婚姻","成功神學"]],["學習受苦",["為夢悲傷","接受失望","無解仍信"]],["新的期待",["神的新作為","向長輩學習","誠實的教會"]]]},
frame:{q:"年輕時就遭遇苦難，怎麼辦？",s:["朋友們的故事","錯誤的期待從哪來","不推卸責任","學會悲傷","提高新的期待"],a:"神能從破碎的期待中創造新的東西。"},
q:["沒人告訴我們，學習耶穌如何受苦有多重要。","我們需要為破碎的夢想悲傷。","即使是最好的年歲，也會有心痛。"],
v:["代上 4:10","林後 4:17"]},
{i:48,t:"對疫情的神學反思",au:"Brian Tabb",d:"2020-05-06",c:"聖經與神學",tags:["疫情","疾病","偶像"],
sum:"新冠疫情促使我們從聖經看疾病：疾病是罪進入世界後的咒詛，是死亡的前奏；神有權柄損傷與醫治，但疾病不總與個人罪有關；基督的醫治指向十架上更深的醫治。疾病也是比喻——罪才是真正的大流行病。疾病粉碎安全、繁榮、健康三大偶像。基督徒的回應：面對恐懼、在病中尋求神（希西家而非亞撒）、視之為信心的試驗並活出盼望。",
pts:["疾病是罪所帶來的咒詛的一部分，不是道德中立的。","經文不總把疾病連結到特定的罪（路 13、約 9）。","罪才是最根本、致命的大流行病。","疾病粉碎安全、繁榮、健康的偶像。","回應：轉恐懼為關愛、病中尋求神、在試煉中顯出盼望。"],
mind:{c:"疫情的神學反思",b:[["聖經看疾病",["創 3 咒詛","申 32:39","基督醫治"]],["疾病是比喻",["賽 1:5","耶 17:9","罪是大流行"]],["粉碎偶像",["安全","繁榮","健康"]],["歷史回應",["黑死病","悔改","省察"]],["我們的回應",["面對恐懼","尋求神","試驗信心"]]]},
frame:{q:"如何從神學角度看待疫情？",s:["疫情背景","聖經中的疾病","疾病是罪的比喻","疾病破除偶像","教會歷史的回應","三種基督徒回應"],a:"疾病揭露懼怕、暴露偶像、催逼我們尋求神。"},
q:["罪才是那個最根本的大流行病。","最強的軍力也擋不住看不見的病毒。","耶穌的平安不使我們免於災害，而是在災害中仍有平安。"],
v:["創 1:31","羅 5:12","羅 8:20","申 32:39","出 15:26","路 13:1-5","約 9:1-3","彼前 2:24","啟 21:1-4","詩 90:10-12","代下 16:12","代下 32:24","代下 20","詩 46:1","彼前 1:6-7"]},
{i:49,t:"三天寫就的國際暢銷書",au:"Mindy Belz",d:"2020-04-15",c:"文化與藝術",tags:["逼迫","經典","魏恩波"],
sum:"介紹經典《為主受苦》與作者魏恩波：一個無神論猶太孤兒，因一對老木匠夫婦的禱告與聖經信主。二戰中救助猶太孩童；共產政權下，他在宗教大會上公開高舉基督，之後坐牢 14 年、遭酷刑，身上留下 18 道傷疤。他移民後創立「殉道者之聲」。這本書三天寫成，譯成 65 種語言，成功祕訣是「用筆和淚」寫成，並提醒教會關注受逼迫的弟兄姊妹。",
pts:["老木匠夫婦長年為一位猶太人信主禱告。","在眾牧師向政權妥協時，他站起來高舉基督。","多年牢獄與酷刑，仍向士兵和掌權者作見證。","歸信只是一半，歸信者必須成為救人靈魂的人。","講述受苦故事，不迴避細節，也不假裝敬虔。"],
mind:{c:"為主受苦",b:[["無神論者",["孤兒","老木匠的禱告","信主"]],["基督徒",["救助猶太孩童","高舉基督","被捕"]],["辯護者",["國會作證","殉道者之聲"]],["遺產",["65 種語言","地下教會","用筆和淚"]]]},
frame:{q:"一本薄書為何影響半世紀？",s:["作者背景","信主經過","反抗納粹與共產","牢獄十餘年","創立事工","對今日的意義"],a:"它是用筆和淚寫成的。"},
q:["那本聖經是用禱告點燃的愛寫成的。","歸信只是事工的一半。","在世上最糟的生活與基督裡最美的生命之間保持張力。"],
v:["來 13:3"]}
);

D.push(
{i:50,t:"新冠病毒將我們指向福音的五種方式",au:"Paul Tripp",d:"2020-04-10",c:"社會與時事",tags:["疫情","依靠","感恩"],
sum:"免疫系統有缺陷、隔離在閣樓的作者反思疫情如何指向福音：一、人的獨立自足是假象，恩典使人從獨立走向更依靠神；二、人失控時，神的主權更顯明；三、最大的瘟疫是罪，而福音提供解藥；四、雖與人隔離，沒有什麼能使我們與神的愛隔絕；五、我們不孤單，要逃向神而非逃離神。感恩是對抗恐懼最有力的防禦。",
pts:["一個病毒就足以讓城市癱瘓，顯明人受造是要依靠神。","成長不是從依靠走向獨立，而是從獨立走向依靠神。","罪是比新冠更致命的瘟疫，基督是解藥。","懷疑神的良善最致命，因為人不會向不信任的對象求助。","讓讚美覆蓋抱怨，讓感恩使怨言消聲。"],
mind:{c:"疫情指向福音",b:[["依靠",["自足是假象","從獨立到依靠"]],["主權",["神不驚訝","不軟弱"]],["罪的瘟疫",["人人感染","基督是解藥"]],["不隔絕",["羅 8:38-39","神親近"]],["不孤單",["逃向神","感恩防禦","約 16:33"]]]},
frame:{q:"疫情教我們看見什麼福音真理？",s:["自足的假象","失控中的主權","真正的瘟疫","不被隔絕的愛","不孤單的應許","以感恩抵擋恐懼"],a:"不要專注在「如果」，要思想將來榮耀的應許。"},
q:["恩典使我們從獨立，走向更深的依靠。","不要逃離神，要逃向神。","你越感恩，就越少被「如果」綁架。"],
v:["羅 8:38-39","太 11:28","約 16:33","詩 121:4"]},
{i:51,t:"什麼令我這個新牧師措手不及？",au:"Ray Ortlund",d:"2020-04-08",c:"教會事工",tags:["牧者","苦難","喜樂"],
sum:"保羅說「我為你們受苦倒覺歡樂」（西 1:24）：苦難與歡樂兩股能力交匯於他的事工。作者剛當牧師時只預備好得著喜樂，沒預備好受苦，尤其被人拒絕時，覺得自己不該受這種對待。但主早已在經文中說明：差你們如羊進入狼群。當我們明白為主受苦是恩典與榮耀，就會說「我不配得這樣的優待」。事工的收穫就是耶穌自己。",
pts:["長久結果子的事工，需要苦難與喜樂交織。","牧者要在受苦中拒絕自憐、怨恨與抱怨。","主呼召我們時沒有欺哄我們，早已說明前路。","為主受苦是祂所賜的恩典、優待與榮耀。","事工不是萬能，唯有耶穌是一切。"],
mind:{c:"牧者的苦與樂",b:[["保羅",["西 1:24","受苦倒覺歡樂"]],["我的盲點",["只預備喜樂","被拒絕","我不該受此"]],["經文",["路 10:3","約 16:2","加 2:20","彼前 4:12"]],["收穫",["耶穌自己","十二位忠信者"]]]},
frame:{q:"新牧師最缺乏哪種預備？",s:["保羅的模式","我的錯誤期待","經文早已說明","苦難是優待","耶穌是一切"],a:"事工不是萬能的，唯有主耶穌是一切。"},
q:["我只準備好歡樂，卻沒準備好受苦。","主呼召我們時並沒有欺哄我們。","為主受苦，是我不配得的優待。"],
v:["西 1:24","來 12:2","路 10:3","約 16:2","加 2:20","彼前 4:12"]},
{i:52,t:"路易斯論新冠病毒",au:"Matt Smethurst",d:"2020-03-24",c:"文化與藝術",tags:["路易斯","恐懼","死亡"],
sum:"編者提醒新冠是嚴重疫情、要做好防護，但引用路易斯 1948 年談「核彈時代」的文章，把核彈換成病毒同樣適用：別誇大我們處境的新異——人類一直活在瘟疫、戰亂、疾病之中，死亡本就是定命。第一步是打起精神：若災難來臨，讓它發現我們正在禱告、工作、讀書、陪孩子、與朋友相聚，而不是像受驚的羊擠成一團。它能毀壞身體，卻不必主宰心靈。",
pts:["新冠是需要認真防護的疾病，但死亡威脅並不新異。","過去世代活在黑死病、戰亂與各樣疾病中。","人本就被判了「死刑」，死亡不是偶然而是定命。","要繼續做明智、合乎人性的事：禱告、工作、讀書、陪家人。","病毒可能摧毀身體，但不必主宰心靈。"],
mind:{c:"路易斯的提醒",b:[["前提",["嚴重疫情","必要防護"]],["不新異",["黑死病","維京入侵","癌症車禍"]],["定命",["人人會死","麻醉劑之別"]],["打起精神",["禱告工作","陪伴家人","不要像受驚羊群"]]]},
frame:{q:"面對致命疫情，心該如何安放？",s:["認真防護","歷史比較","接受死亡是定命","照常過有意義的生活"],a:"它可以摧毀身體，但不必主宰心靈。"},
q:["別誇大我們處境的新異。","讓災難來時，看見我們正在做有意義的事。","病毒可能毀壞身體，卻不必主宰心靈。"],
v:["來 9:27","詩 90:12"]},
{i:53,t:"艱難時，你可以唱這25首詩歌",au:"Matt Merker",d:"2020-03-18",c:"文化與藝術",tags:["詩歌","敬拜","疫情"],
sum:"疫情使許多教會無法聚會，但基督徒仍應歌唱。作者推薦 25 首適合會眾唱的詩歌，分四類：神的主權、護理與大能（如〈堅固保障〉〈千古保障〉〈上帝作為奇妙深奧〉）；等候、哀傷和忍耐（如〈偕我同住〉〈我靈鎮靜〉〈基督是錨〉）；信靠和委身（如〈靠主膀臂〉〈耶穌領我〉〈我神所定盡都美善〉）；盼望與新天新地（如〈在約旦河邊我遙望〉〈玉漏沙殘時將盡〉）。",
pts:["凡事有定期：哭有時、笑有時（傳 3）。","詩歌能表達懼怕、焦慮與向神的提問。","不能聚會時，基督徒仍不該沉默。","四大類：主權、等候哀傷、信靠委身、永恆盼望。","藉詩歌把重擔卸在基督腳前，宣告福音的得勝。"],
mind:{c:"艱難時的詩歌",b:[["主權大能",["堅固保障","千古保障","讚美全能真神"]],["等候哀傷",["偕我同住","我靈鎮靜","基督是錨"]],["信靠委身",["靠主膀臂","耶穌領我","我的牧者"]],["永恆盼望",["約旦河邊","玉漏沙殘","基督永遠屬我"]]]},
frame:{q:"不確定的時代，我們該唱什麼？",s:["傳道書的時節","不能聚會仍要唱","選曲原則","四類詩歌清單"],a:"救主已給我們不會搖動的盼望，因此我們仍要歌唱。"},
q:["不能聚會，不等於要保持沉默。","詩歌讓我們把重擔卸在基督腳前。","哭有時，笑有時，但歌唱永遠合時。"],
v:["傳 3:1-5","來 4:16","西 3:16"]},
{i:54,t:"如何與孩子們談論新冠病毒",au:"Cameron Cole",d:"2020-03-17",c:"基督徒生活",tags:["兒童","疫情","死亡"],
sum:"危機也是與孩子進行有意義對話的機會。作者和一位一年級學生談了三個問題：一、為什麼基督徒不必怕死？因為基督已勝過死亡，死了也有益處；二、為什麼仍要負責任、有安全意識？因為生命是神的禮物，要做好管家並尊重別人的生命；三、為什麼能在危險世界中不懼怕？因為神既掌權又良善。",
pts:["疫情讓孩子無法迴避死亡的現實，正是談福音的時機。","基督徒可以嘲笑死亡：死啊，你的毒鉤在哪裡？","不怕死不等於魯莽，要遵行衛生建議。","照顧自己和他人的健康，是尊重神的形像。","神既有主權又良善，所以我們能得平安。"],
mind:{c:"與孩子談疫情",b:[["不怕死",["林前 15:55","腓 1:21","基督得勝"]],["負責任",["生命是禮物","好管家","保護他人"]],["不懼怕",["神掌權","神良善","內心平安"]]]},
frame:{q:"孩子害怕疫情時，可以談什麼？",s:["把危機當對話機會","問題一：死亡","問題二：責任","問題三：恐懼"],a:"引導孩子認識主的良善與主權，也為將來的磨練預備。"},
q:["基督徒對死亡的結局沒有恐懼。","不怕死，不代表可以像傻瓜一樣行事。","神既掌權又良善，我們就有平安。"],
v:["林前 15:55","腓 1:21","創 1:27"]},
{i:55,t:"從約伯記受益的五個讀經建議",au:"Bill Kynes",d:"2020-02-27",c:"聖經與神學",tags:["約伯記","讀經","詩歌體"],
sum:"約伯記難讀：主題沉重、沒有給出我們想要的答案、大部分是朋友的錯誤言論、九成以上是詩歌、篇幅長且重複。作者提出五個建議：欣賞詩歌體裁、讓它觸及心；不要讀太快，因為悲傷需要時間；留意其戲劇結構（三個朋友、28 章智慧詩、以利戶）；以同理心讀約伯的哀嘆；親自面對核心問題——你敬拜神是為了好處，還是因祂配得？",
pts:["約伯記關注真實苦難中與神的關係，而非抽象哲學。","42 章的長度反映真實悲傷需要的時間。","注意戲劇結構與人物的細微區別。","約伯言詞尖刻，卻仍在追尋神，最終被神稱許。","核心問題：我能否信靠神的智慧多過自己的？"],
mind:{c:"讀約伯記",b:[["為何難讀",["苦難主題","無答案","朋友錯誤","詩歌體","篇幅長"]],["五個建議",["欣賞體裁","不要太快","留意戲劇","以同理心","親自面對"]],["核心問題",["為好處敬拜？","信靠神的智慧"]],["收穫",["仰望神的榮耀","同理受苦者"]]]},
frame:{q:"如何讀懂這卷難讀的書？",s:["承認難讀","建議一至五","核心問題","不安中的安全感"],a:"約伯記使人不安，卻也讓人在困惑中仰望神的榮耀。"},
q:["你不能冷漠地讀約伯記，還期待收穫它的信息。","約伯更在乎與神的關係，而非問題的答案。","你敬拜神，是為了好處，還是因為祂配得？"],
v:["提後 3:16-17","伯 1:21","伯 2:10","伯 28","伯 32-37","伯 38-42","雅 5:11"]},
{i:56,t:"受苦會有什麼益處？",au:"Vaneetha Rendall Risner",d:"2020-02-27",c:"基督徒生活",tags:["以賽亞書30章","偶像","神的同在"],
sum:"常有人說「神從不願祂的孩子受苦」，但聖經顯示神使用苦難成就我們永恆的喜樂。以賽亞 30:19-22 說神雖以艱難當餅、困苦當水，卻應許：祂聽並回答我們的呼求；祂不再隱藏，賜下特別的同在；祂給我們清晰的方向（「這是正路」）；祂幫助我們拋棄偶像。作者說困難成了她生命中無可比擬的禮物。",
pts:["神可能以艱難當餅，但伴隨著特別的應許。","神聽見並回答：可以、不可以、或等一等。","受苦時神挪去面紗，讓人經歷不尋常的同在。","痛苦讓人對神的聲音更敏感，尤其透過聖經。","失去心中偶像時，喜樂開始扎根於神。"],
mind:{c:"苦難的四個禮物",b:[["賽 30:19-22",["艱難當餅","困苦當水"]],["垂聽回答",["可以","不可以","等一等"]],["神的同在",["挪去面紗","生命的錨"]],["清晰方向",["這是正路","透過聖經"]],["摧毀偶像",["結 14:3","讚賞成功","家庭"]]]},
frame:{q:"受苦能帶來什麼好處？",s:["質疑流行說法","賽 30 的應許","四個禮物","值得嗎？絕對值得"],a:"困難成了我生命中無可比擬的禮物。"},
q:["神也許給我們艱難的餅，但同時給了更特別的應許。","我在苦難中經歷的神同在，至今仍是生命的錨。","當偶像被拿走，它們的力量也就消失。"],
v:["賽 30:19-22","結 14:3"]},
{i:57,t:"為跳蚤而感謝上帝",au:"Christine Hoover",d:"2020-02-07",c:"文化與藝術",tags:["密室","彭柯麗","饒恕"],
sum:"重溫經典《密室》：彭柯麗一家在納粹佔領荷蘭時藏匿猶太人，被出賣後與姐姐碧茜被送進集中營。碧茜在滿是跳蚤的床鋪上感謝神，柯麗起初做不到；後來她們發現正因跳蚤，衛兵不進營房，她們才能讀經聚會。碧茜死於營中，柯麗獲釋後走遍世界見證神的信實，甚至饒恕了前納粹衛兵。作者學到：信心要有行為、要與冷漠爭戰、神的話在黑暗中最明亮。",
pts:["在人性最敗壞處，仍看見神的良善。","柯麗的誠實掙扎，讓讀者更能共鳴。","戰後她選擇饒恕來求饒恕的前衛兵。","集中營最致命的疾病是對他人苦難的冷漠。","偷藏的聖經在黑暗中越讀越明亮：我們已經得勝有餘。"],
mind:{c:"密室與跳蚤",b:[["故事",["藏匿猶太人","被出賣","集中營"]],["跳蚤",["碧茜感恩","柯麗抗拒","衛兵不進來"]],["饒恕",["前衛兵","選擇忽略感受"]],["功課",["信心有行為","對抗冷漠","話語的能力"]]]},
frame:{q:"一本老書為何仍適合今天？",s:["初讀印象","故事概要","真信心的實踐","與冷漠爭戰","黑暗中的話語"],a:"無論黑暗如何，神的光總是照耀。"},
q:["就連神也不能叫我為跳蚤感恩——後來祂做到了。","最致命的疾病，是對別人苦難的冷漠。","周圍越黑，神的話燃燒得越明亮。"],
v:["羅 8:37","來 11","雅 2:17","帖前 5:18"]},
{i:58,t:"約沙法王與冠狀病毒",au:"Jason Seville",d:"2020-02-06",c:"社會與時事",tags:["疫情","禱告","約沙法"],
sum:"疫情爆發時留在中國牧會的作者，以約沙法的禱告「我們不知道怎樣行，眼目單仰望你」（代下 20:12）為指引，提出五方面信靠：在懼怕中信靠神（承認軟弱）；鼓勵他人信靠神（帶領眾人尋求）；向神呼求（靠神的性情與應許）；牢記神的救恩（這場仗不在乎你們）；敬拜（在得勝前讚美）。最大的問題——不信——會在敬拜中被解決。",
pts:["約沙法也會懼怕，信靠是一再做出的選擇。","在眾人恐慌時，提醒彼此神的慈愛與權能。","承認無力自救，單單仰望主。","生命的意義不是躲過死亡，而是榮耀神、以祂為樂。","敬拜是對神過去、現在、將來作為的回應。"],
mind:{c:"約沙法的禱告",b:[["懼怕中信靠",["代下 20:3","承認軟弱"]],["鼓勵他人",["全國禁食","腓 4:6-7","彼前 3:15"]],["呼求",["代下 20:9","代下 20:12"]],["記得救恩",["戰爭在乎神","羅 5:8"]],["敬拜",["代下 20:22","解決不信"]]]},
frame:{q:"疫情中不知怎麼辦，該怎麼禱告？",s:["處境：留在中國","懼怕中信靠","帶領他人","呼求神","記得救恩","敬拜"],a:"你最大的問題——不信——會在敬拜中被解決。"},
q:["我們不知道怎樣行，眼目單單仰望你。","信靠是一再要做的選擇。","生命的意義不是躲過死亡，而是預備好榮耀神。"],
v:["代下 20:3-4","代下 20:9","代下 20:12","代下 20:15-17","代下 20:22","詩 91","腓 4:6-7","羅 5:8","約 3:16"]},
{i:59,t:"四十年後重讀《一個嚴苛的恩典》",au:"Russ Ramsey",d:"2019-12-26",c:"文化與藝術",tags:["經典","喪偶","偶像"],
sum:"作者在面對自身可能的死亡時重讀范瑙肯的《一個嚴苛的恩典》。范與珍熱戀，以「光輝的屏障」守護他們排他的愛，視愛為最高榮耀。在牛津認識路易斯等人後信主，基督打破了屏障；范甚至嫉妒起耶穌。珍不久病逝，路易斯寫信說：他把愛本身當成偶像，珍的死是一個嚴苛的恩典。作者指出，基督信仰的中心是在十架上合而為一的嚴苛與恩典。",
pts:["經歷會產生問題，迫使我們的預設面對真理。","范與珍把人類的愛當作偶像與最高榮耀。","信仰必須壓倒性地重要，否則壓根不是信仰。","路易斯：你看見自己在嫉妒神，這是嚴苛的恩典。","基督徒用永久的結局來審視苦難（羅 8:28、啟 21）。"],
mind:{c:"嚴苛的恩典",b:[["愛情",["光輝的屏障","愛為偶像"]],["歸信",["牛津","路易斯","基督打破屏障"]],["失去",["嫉妒耶穌","珍病逝","與神摔跤"]],["意義",["嚴苛卻是恩典","十架合一","永恆結局"]]]},
frame:{q:"失去最愛時，怎能稱之為恩典？",s:["重讀的緣由","愛情故事","歸信與張力","珍的離世","路易斯的書信","基督徒的苦難觀"],a:"不是沒有嚴苛的恩典，而是在十架上合一的嚴苛與恩典。"},
q:["信仰必須壓倒性地重要，否則壓根不是信仰。","基督打破了他們光輝的屏障。","嚴苛如死，卻單純如恩慈。"],
v:["賽 55:8-9","啟 21:1-5","羅 8:28","林前 10:31","詩 73:24-26","來 12:1-2"]},
{i:60,t:"喪子卻不喪信心",au:"Sarah Eekhoff Zylstra",d:"2019-11-22",c:"基督徒生活",tags:["喪子","罕見疾病","教會支持"],
sum:"吉爾澤曼夫婦的兩個女兒都罹患致命的巴登氏症，6 歲的米拉離世。他們倚靠世代傳承的信仰根基與禱告的祖父母；外公說神的主權與人的責任同樣真實，不明白時就信靠。他們堅持每週參加主日崇拜；跨四間教會的「G 團隊」三年來每週供餐、照顧、籌款。一本以他們家為藍本的繪本《星星王國之旅》也安慰了許多喪子家庭。",
pts:["「我不知道你怎麼做到的」——其實沒有別的選擇。","世代傳承的信仰根基在危機時顯出價值。","主權與責任都是真的，看不懂時就信靠。","再難也把主日敬拜擺在優先，相信神在那裡。","「G 團隊」示範教會如何長期托住受苦家庭。"],
mind:{c:"喪子不喪信",b:[["診斷",["巴登氏症","兩個女兒","米拉離世"]],["根基",["父母信仰","祖父母禱告","主權與責任"]],["教會",["每週主日","G 團隊","一對一照護"]],["繪本",["星星王國之旅","安慰他人"]]]},
frame:{q:"失去孩子時，什麼托住信心？",s:["診斷與照顧","世代信仰的根基","堅持敬拜","群體的托住","故事安慰他人"],a:"這是祂的故事，而我們相信祂。"},
q:["你沒得選，就像不倒谷片孩子就不會吃。","神在我們還不知道的時候，就預備了我們。","看不見主權與責任怎麼相合時，我們就信靠。"],
v:["羅 8:28","詩 23:4"]},
{i:61,t:"牧養臨終病人的七個建議",au:"Phil A. Newton",d:"2019-11-09",c:"教會事工",tags:["臨終關懷","牧養","癌症"],
sum:"作者自己正接受不可治癒的淋巴瘤治療，從新角度寫如何牧養臨終者。七個建議：以你希望被牧養的方式牧養；以憐恤、眼神接觸、溫柔和觸摸服事；以福音真理安慰；引導他們著眼永恆；幫助他們確認救恩；讓他們因在神手中而喜樂（啟 5、羅 8）；以經文禱告、詩歌、聖徒故事牧養。不要害怕待在臨終者身邊，幫助他們跨越到生命另一邊。",
pts:["我們全都是「末期病人」，只是時間不同。","不要說「一切都會好」，要誠實面對現實。","克服不適，專注、握手、溫柔說話。","撒但會在臨終時猛烈攻擊，要幫助確認得救。","在床邊讀經、唱詩、講聖徒得勝的故事。"],
mind:{c:"牧養臨終者",b:[["態度",["如己所願","憐恤","眼神與觸摸"]],["內容",["福音真理","著眼永恆","確認救恩"]],["主權",["啟 5","羅 8:28-39"]],["方式",["經文禱告","詩歌","天路歷程"]]]},
frame:{q:"如何陪伴罹患絕症的弟兄姊妹？",s:["作者自身處境","七個建議","最後一次探訪的見證"],a:"永不害怕待在臨終者身邊，幫助他們跨越到另一邊。"},

D.push(
{i:62,t:"成聖的悲傷：改革宗神學如何幫助我們面對死亡",au:"Christopher Catherwood",d:"2019-11-01",c:"基督徒生活",tags:["喪偶","主權","約伯"],
sum:"作者妻子寶莉與帕金森症奮戰八年後在 65 歲離世。他說相信神的主權並不減少痛苦，但讓悲傷有不同的質地。他回顧 1982 年博士答辯被不公對待、學術生涯看似完蛋，卻在 24 年後取得博士學位——神早知道結局。約伯從沒得到解釋，神給的答案就是祂自己。正確的神學並不抽象，它幫助他活在此刻。",
pts:["相信主權不等於沒有痛苦，而是主權在別處彰顯。","許多事今生不會明白原因，但神知道。","1982 年的絕望，在 1997、2006 年才看見神的安排。","約伯沒得到解釋，神給的答案就是祂自己的屬性。","改革宗神學不能帶回寶莉，卻幫助我活在此刻。"],
mind:{c:"成聖的悲傷",b:[["失去",["寶莉離世","帕金森症","鰥夫"]],["生命奧祕",["無子女","博士之路","神早知道"]],["約伯",["沒有解釋","神就是答案"]],["主權之愛",["活在此刻","將來再見","向主禱告"]]]},
frame:{q:"主權神學如何幫助面對喪偶？",s:["妻子離世","相信主權不減痛苦","回顧過去的奧祕","約伯的答案","活在此刻"],a:"當年作王的主，今天仍然作王。"},
q:["我可能永不明白原因，但我知道神知道。","神給約伯的答案，就是祂自己。","正確的神學不抽象，它幫我活過今天。"],
v:["伯 38-42","箴 31","太 10:29"]},
{i:63,t:"有的時候哭是好事",au:"Sarah Phillips",d:"2019-10-18",c:"基督徒生活",tags:["眼淚","軟弱","群體"],
sum:"愛哭的作者發現人們常為眼淚道歉。眼淚顯露軟弱，但福音釋放我們不必證明自己很好，基督的能力在軟弱上顯得完全；眼淚承認世界的破碎，但基督徒的悲傷有盼望（帖前 4:13）；耶穌也為耶路撒冷、為拉撒路哭；為罪哭泣是合宜的（詩 51:17）；在群體中哭泣也是好的——父親過世後，朋友摟著她同哭、為她禱告。",
pts:["文化把哭視為尷尬，因為它暴露我們的軟弱。","承認軟弱正是我們當行的（林後 12:9）。","不必假裝生活總是美好，因為知道終將美好。","耶穌的眼淚提醒：死亡是要被打敗的敵人。","教會中有人陪哭、傾聽、禱告，不急著「修復」眼淚。"],
mind:{c:"眼淚的價值",b:[["顯露軟弱",["羞於流淚","林後 12:9"]],["承認破碎",["帖前 4:13","啟 21:4"]],["耶穌的淚",["路 19","約 11"]],["為罪哭",["詩 51:17","太 26:75","約壹 1:9"]],["群體中",["同哭","禱告","來 4:16"]]]},
frame:{q:"基督徒該怎樣看待眼淚？",s:["為何羞於哭","眼淚顯露軟弱","眼淚承認破碎","耶穌也哭","為罪哭泣","在群體中哭"],a:"有一天，祂會把我們的眼淚變為喜樂的頌歌。"},
q:["眼淚暴露我們的軟弱，而承認軟弱正是我們該做的。","我們不必假裝生活總很好，因為知道它終將美好。","不要急著去修復別人的眼淚。"],
v:["林後 12:9","帖前 4:13-14","啟 21:4-5","路 19:41","約 11:35","詩 51:17","太 26:75","約壹 1:9","來 4:16"]},
{i:64,t:"在絕望中遇見耶穌",au:"Vaneetha Rendall Risner",d:"2019-10-15",c:"基督徒生活",tags:["殘疾","約翰福音9章","喪子"],
sum:"七歲的作者因小兒麻痺被同學推倒、丟石頭，從此認定生活不公平、神若存在就是祂的錯。十六歲時她隨意翻到約翰福音 9 章：瞎眼不是誰犯了罪，而是要顯出神的作為——她因此信主。後來婚姻危機、兩個月大的兒子因醫療疏失過世、確診小兒麻痺後遺症、丈夫離去。她在絕境中發現：神是她所擁有的一切，而且絕對足夠。",
pts:["童年的霸凌讓她認定生活不公平，並怪罪神。","約 9：苦難不一定是懲罰，而是要顯出神的作為。","信主後以為神會讓人生輕鬆成功，卻接連遭遇重創。","在絕境中，神是她唯一的依靠，且絕對足夠。","神即使在生活看似正常時，也是我們的一切。"],
mind:{c:"絕望中遇見耶穌",b:[["童年",["小兒麻痺","被霸凌","怪罪神"]],["信主",["約 9","顯出神的作為","十六歲"]],["接連苦難",["婚姻危機","喪子","後遺症","丈夫離去"]],["發現",["神是一切","絕對足夠","離耶穌最近"]]]},
frame:{q:"殘疾與失去，如何把人帶到耶穌面前？",s:["七歲的傷","十六歲的相遇","以為神欠我好日子","兒子之死","癱瘓與離婚","神是一切"],a:"我不會和任何人交換人生，因為這裡離耶穌最近。"},
q:["我到底做錯了什麼，才受這樣的懲罰？","我們都曾是迷失的，直到耶穌尋到了我們。","當神成為我所擁有的一切，我發現祂絕對足夠。"],
v:["約 9:1-3"]},
{i:65,t:"發現那些隱藏在教會中的創傷",au:"Jenn Kintner",d:"2019-09-24",c:"教會事工",tags:["創傷","收養","家暴","性侵"],
sum:"一位養父抱著受過虐待的嬰孩反覆說「你是安全的，你是被愛的」。教會應當成為這樣接納受創者的家。作者從神美好的創造被扭曲來談三類隱藏創傷：破碎的家庭（虐待、遺棄、收養背後的失去、婚姻暴力）；濫用的權力（職場不公、屬靈操控）；性侵。教會要相信受害者、優先保障安全、傾聽、同哭，並長期耐心陪伴。",
pts:["每次收養都發生在失去之後，要給孩子悲傷的空間。","家暴受害者脫離危險，不代表心靈創傷就消失。","權力本為服事，被濫用時使人難以再信任權威。","面對性侵受害者，要相信他們、避免帶羞辱的提問。","教會要長期自我犧牲，持續提醒：你是安全的，你是被愛的。"],
mind:{c:"隱藏的創傷",b:[["破碎家庭",["父母失職","收養的失去","婚姻暴力"]],["濫用權力",["屬世領導","屬靈侮辱","太 20:25-26"]],["性侵",["神的禮物被扭曲","相信受害者","羅 12:15"]],["教會回應",["安全優先","傾聽","長期陪伴"]]]},
frame:{q:"教會如何看見並陪伴受創的人？",s:["養父的安慰","破碎的家庭","濫用的權力","性侵","效法基督的長期服事"],a:"你是安全的；你是被愛的。"},
q:["淤青消失了，傷痛還在心裡。","脫離身體的危險，不代表心靈的創傷就消失。","教會要一再說：你是安全的，你是被愛的。"],
v:["路 15:11-32","林前 8:6","弗 5:25-33","太 20:25-26","彼前 5:2-4","約 10:11","弗 5:31-32","羅 12:15"]},
{i:66,t:"想要得到更多傳福音機會嗎？那就得擁抱敵意",au:"Steve McAlpine",d:"2019-09-04",c:"教會事工",tags:["世俗化","福音機會","逼迫"],
sum:"蘇格蘭的朋友說：這裡從未如此抵擋福音，也從未如此開放福音。世俗化帶來對基督教的敵意，但無限的選擇權並未帶來意義，焦慮抑鬱創新高，人們開始尋找目標。作者問：你願意以更多敵意換取更多福音機會嗎？沒有敵意又完全開放的狀態在聖經中不存在；非信徒反而被基督徒在敵意中的冷靜堅定所吸引。",
pts:["蘇格蘭的現在，可能是其他西方國家的未來。","只追求「有選擇」而不問「選什麼」，帶來意義的缺失。","失去超越性，只剩當下，撐不起人生意義。","非信徒被基督徒在逆境中的冷靜與謙卑吸引。","你願意為更多福音機會而受苦嗎？"],
mind:{c:"敵意與開放",b:[["現象",["蘇格蘭","敵意上升","興趣增加"]],["原因",["選擇過剩","意義缺失","焦慮抑鬱"]],["基督徒",["不躲藏","冷靜堅定","謙卑吸引"]],["抉擇",["舒適 vs 福音","為福音受苦"]]]},
frame:{q:"福音的敵意與開放，有什麼關係？",s:["蘇格蘭的觀察","世俗的幸災樂禍","選擇權的空虛","敵意中的機會","你的選擇"],a:"若忠心，沒有敵意的福音豐收在聖經中並不存在。"},
q:["這裡從未如此抵擋福音，也從未如此開放。","把「有選擇」當目標，最後失去了意義。","你願意放棄舒適，換取某些人歸信嗎？"],
v:["太 5:11-12","彼前 3:15"]},
{i:67,t:"你的情緒既不是最重要的，也不是最不重要的",au:"Alasdair Groves",d:"2019-05-27",c:"聖經與神學",tags:["情緒","斯多葛主義","詩篇"],
sum:"情緒不會比我們在基督裡的身份更深地定義我們，但情緒揭露我們所愛與所敬拜的。文化中有兩種錯誤：「吐出來」——情緒就是一切，連教會也追求情緒高峰；「吞下去」——斯多葛式地認為情緒無關緊要，甚至把負面情緒視為信心不足。作者主張第三條路：重視情緒卻不把生命鑰匙交給它，像耶穌一樣深切地喜樂與哀傷。",
pts:["情緒不定義我們的身份，卻揭露我們的忠誠。","情緒主義：感覺是最高的善，連敬拜都以感覺評價。","斯多葛主義：把負面情緒當罪，要人在苦中強顏歡笑。","負面情緒也是神的禮物，詩篇中充滿虔敬的負面情緒。","耶穌流淚、發怒、在客西馬尼憂傷——示範第三條路。"],
mind:{c:"情緒的位置",b:[["雙重真理",["不定義身份","揭露所愛"]],["吐出來",["情緒至上","敬拜追感覺"]],["吞下去",["斯多葛","負面=小信","強顏歡笑"]],["第三條路",["詩 62:8","羅 12:15","像耶穌"]]]},
frame:{q:"基督徒該如何看待情緒？",s:["情緒定義我嗎？","文化一：情緒至上","文化二：情緒無關","第三條路：以基督為模範"],a:"重視情緒，卻不把生命的鑰匙交給它。"},
q:["情緒不定義你是誰，但它揭露你愛什麼。","負面情緒也可以成為與神連結的機會。","不要以神的主權為由，禁止人有悲傷。"],
v:["太 5:11-12","彼前 4:12-14","徒 5:40-42","耶 2:20","羅 12:15","詩 62:8","來 12:2"]},
{i:68,t:"電影《使徒保羅》很好看，卻有瑕疵",au:"Patrick Schreiner",d:"2019-04-22",c:"文化與藝術",tags:["電影評論","保羅","逼迫"],
sum:"評論電影《使徒保羅》：聚焦保羅晚年在羅馬監獄的軟弱與苦難，路加探監，羅馬信徒在尼祿逼迫下拒絕報復、選擇愛敵人——這是全片最有力的信息。歷史上有些安排值得商榷（路加寫作時間、亞居拉百基拉所在地）。藝術上光影出色，但常犯基督教電影「說得太多」的毛病。結尾保羅赴刑場的獨白有力地呈現受苦與盼望。",
pts:["評價聖經電影：是否有效達成其目的？","電影刻畫保羅的虛弱與痛苦，而非活力。","最強信息：基督徒在逼迫中選擇愛與不報復。","部分歷史安排可議，例如路加與亞居拉的位置。","缺點是說得太多，缺乏含蓄的深度。"],
mind:{c:"《使徒保羅》",b:[["主題",["受苦的保羅","不報復","愛敵人"]],["歷史",["兩次入獄","路加寫作時間","亞居拉位置"]],["優點",["光影","震撼場面"]],["缺點",["說得太多","對白刻意"]],["高潮",["提後 4:7","跑盡當跑的路"]]]},
frame:{q:"這部聖經電影成功嗎？",s:["評價標準","故事三線","歷史準確性","藝術效果","結尾高潮"],a:"基督的榮耀不是逃避痛苦，而是承受痛苦。"},
q:["基督徒被火燒、被毆打，仍選擇愛而不還手。","聖經電影常犯的錯：說得太多。","當跑的路已經跑盡，所信的道已經守住。"],
v:["太 5:44","提後 4:7","提後 4:11","提後 4:22","西 4:14"]},
{i:69,t:"如果你不喜歡去上班……",au:"Gaye Clark",d:"2019-03-11",c:"信仰與工作",tags:["工作","喪偶","護理"],
sum:"作者一直夢想辭去護士工作當家庭主婦。丈夫離世後她反而回到全職工作，覺得活在「次好的計劃」。直到一位年輕護士向她請教，她才重新在工作中發現樂趣，開始帶領新人、把錯誤化為經驗。三十多年後她辭職去陪孫子，卻在辭職信中流淚感謝醫院。她學到：工作不只是尋找意義，更是為他人獻上生命的呼召。",
pts:["她曾把工作只當作到達終點的手段。","丈夫要她承諾：即使他早逝，也不可自憐怨恨。","在 50 多歲回到職場，覺得活在 B 計劃。","與年輕護士一起工作，重新在工作中笑出來。","工作是為他人捨己的呼召，正如基督為我們捨命。"],
mind:{c:"不喜歡上班時",b:[["過去",["夢想當主婦","工作是手段"]],["轉折",["丈夫離世","回到職場","計劃外的計劃"]],["改變",["年輕護士","帶領新人","經驗變政策"]],["領悟",["林後 12:9","弗 2:10","為他人捨己"]]]},
frame:{q:"討厭工作時，神可能在做什麼？",s:["勉強的上班族","丈夫的承諾","次好的計劃","在工作中重拾喜樂","辭職信"],a:"回頭看，那是比我所想更好的 A 計劃。"},
q:["我一直以為自己活在次好的計劃裡。","成就一名護士的，是這份呼召中的苦難與憂傷。","工作是一個為別人獻上生命的呼召。"],
v:["林後 12:9","弗 2:10","羅 12:18","羅 8:28"]},
{i:70,t:"伊麗莎白·艾略特：你經歷的苦難永不落空",au:"Elisabeth Elliot",d:"2019-03-04",c:"基督徒生活",tags:["宣教士遺孀","悖論","兩個國度"],
sum:"唯有在十字架上，苦難與愛的衝突才開始調和。登山寶訓充滿悖論，因為有可見與不可見兩個國度；喜樂不是沒有苦難，而是有神同在。1956 年丈夫吉姆在厄瓜多爾殉道，神的同在並沒有改變她守寡的現實，卻催逼她仰望神。她無法解釋每一個苦難，但羅 8:18-19 給她盼望：受造界將得自由。苦難是理解「神是神」不可替代的媒介。",
pts:["除非理解神的愛，否則無法解釋苦難。","兩個國度的視角解開登山寶訓的悖論。","喜樂不是沒有苦難，而是有神的同在（詩 23:4）。","神的同在沒有改變現實，卻使她轉向神。","苦難永不落空：現在的苦楚不足與將來的榮耀相比。"],
mind:{c:"苦難永不落空",b:[["悖論",["登山寶訓","兩個國度","西 1:24"]],["同在",["詩 23:4","賽 43:2"]],["吉姆之死",["守寡","同在不改現實","仰望神"]],["奧祕",["無法解釋","羅 8:18-19","被殺的羔羊"]]]},
frame:{q:"苦難與神的愛如何並存？",s:["十字架是鑰匙","兩個國度","神的同在","我的失去","苦難的奧祕"],a:"苦難是讓我們明白「神是神」不可替代的媒介。"},
q:["喜樂不是沒有苦難，而是有神同在。","神與我同在，但吉姆沒有——這是可怕的現實。","我無法回答你的問題，但聖經可以。"],
v:["太 5","西 1:24","詩 23:4","賽 43:2","羅 8:18-19"]},
{i:71,t:"不要讓任何特殊需要阻礙福音的傳播",au:"Sarah Eekhoff Zylstra",d:"2019-02-27",c:"教會事工",tags:["殘疾事工","自閉症","家庭"],
sum:"估計八成以上的教會沒有任何殘疾事工。報導介紹學院教堂的 STARS 項目、吉爾之家的喘息服務等例子。專家指出：小教會常自然地以家庭方式關懷，不一定需要專門部門；殘疾既有功能面也有社會面，唯有聖經能整合兩者。起步可以從一個孩子、一位倡導者、分享美好故事開始。志願者不需特殊學位；別忘了照顧精疲力竭的父母。",
pts:["智力或發展障礙者也需要聽見福音。","殘疾事工是關係性的，按下教會的「福音刷新鍵」。","聖經觀：在一個不正常的世界中，殘疾是正常生活的一部分。","志願者不需特殊技能，像當父母一樣陪伴。","殘疾兒童父母壓力極高，一夜喘息就能大幅減壓。"],
mind:{c:"殘疾事工",b:[["現況",["八成教會缺乏","隱形少數"]],["案例",["STARS","吉爾之家"]],["神學",["功能面","社會面","靈性殘疾"]],["起步",["找出需要","一個倡導者","分享故事"]],["五階段",["無知","憐憫","同情","友誼","同工"]],["家庭",["父母支持","喘息服務"]]]},
frame:{q:"教會如何接納有特殊需要的人？",s:["一個孩子的故事","兩個成功案例","聖經的殘疾觀","如何開始","志願者與五階段","照顧家庭"],a:"我們的主是願意冒險的主。"},
q:["如果不明白自己的靈性殘疾，就不明白福音。","知識會取代恐懼。","我不會治腦癱，但靠恩典能降低父母的壓力。"],
v:["林前 12","路 14:21"]},
{i:72,t:"面對抑鬱：基督徒的愛何以重要",au:"Kathryn Butler",d:"2019-02-25",c:"基督徒生活",tags:["抑鬱症","醫學","教會"],
sum:"身為醫生的作者第一次走進教堂時正與輕生衝動搏鬥。抑鬱是隱藏的殘疾，常被教會誤解為信心不足。作者說明重度抑鬱症的診斷標準與腦部變化，它不同於從神而來的哀傷，無法靠意志「振作」；且常復發、治療緩慢不完全。詩篇與基督在客西馬尼顯示信心者也會絕望。教會的角色是以愛相伴：邀請、聆聽、擁抱、具體禱告。",
pts:["「真基督徒不會抑鬱」的誤解讓患者更孤立。","重度抑鬱症與正常哀傷不同，涉及大腦的變化。","抑鬱常復發，治療常是部分緩解而非根治。","大衛與基督都曾經歷深切的痛苦。","教會不能治癒，但能以愛撐住，指引專業幫助。"],
mind:{c:"教會與抑鬱",b:[["隱藏殘疾",["看不見","每十人一人"]],["誤解",["信心不足","多禱告就好"]],["醫學",["診斷標準","大腦變化","常復發"]],["屬靈",["詩 13、22、42","客西馬尼"]],["教會的愛",["邀請","聆聽","具體禱告","轉介專業"]]]},
frame:{q:"教會應如何回應抑鬱的弟兄姊妹？",s:["親身經歷","普遍性","誤解的傷害","醫學真相","終生的負擔","屬靈影響","基督之愛"],a:"他們沒有趕走黑暗，卻讓我在怒海中不至沉沒。"},
q:["抑鬱是一種隱藏的殘疾。","我們的責備，必定在傷口上撒鹽。","他們沒有治好我，卻成了我的夥伴。"],
v:["彌 6:8","加 6:2","可 12:31","約 13:34-35","伯 3","詩 13:1-3","詩 22:1-2","詩 42","約 11:33-36","太 26:38","約 3:16"]},
{i:73,t:"在全職事奉中堅忍一生的七個步驟",au:"Collin Hansen",d:"2019-02-20",c:"教會事工",tags:["牧者","堅忍","教會歷史"],
sum:"若以「我能幫助人、被人看重」辨認呼召，那是以自我為中心。牧者要以基督虛己的心為心（腓 2）並預備受苦。作者從《十二位忠信者》歸納七步：在簡歷中誇軟弱（保羅）；承認你的計劃不一定是神的（加爾文）；在黑暗中仰望基督（班揚）；被拒絕時不自憐（愛德華茲）；被反對不等於不忠心（西緬、盧伍姆）；在不知神在哪時仍等候（司布真）；即使太晚也要做對的事（王明道）。",
pts:["牧者是好牧人手下的牧人，要為人倒空自己。","誇軟弱，好讓人看見是聖靈在工作。","愛德華茲被教會解僱後，寫出最重要的著作。","西緬寧可受苦，不願擅自做主。","堅忍一生的關鍵是記住：我們為耶穌、為永恆而活。"],
mind:{c:"堅忍一生",b:[["呼召",["腓 2:3-8","彼前 4:12-13"]],["七步",["誇軟弱","非我計劃","黑暗中仰望","不自憐","反對≠不忠","等候神","做對的事"]],["人物",["保羅","加爾文","班揚","愛德華茲","西緬","司布真","王明道"]],["根基",["來 12:1-2","林後 6:3-10"]]]},
frame:{q:"如何在牧養事工中堅持到底？",s:["檢視呼召動機","七個步驟與七位榜樣","他們偉大在哪"],a:"一生堅忍的關鍵，是記住我們為耶穌、為永恆而活。"},
q:["我寧可受苦，也不願擅自做主。（西緬）","你可以殺了我們，但你不能傷害我們。（遊斯丁）","不要在週一思考你的職業前途。"],
v:["腓 2:3-8","彼前 4:12-13","太 5:10-12","林後 11:23-30","林後 4:16-18","林後 4:8-11","來 5:8","來 12:1-2","林後 6:3-10"]},
{i:74,t:"在疼痛中工作",au:"Kara Bettis",d:"2019-02-01",c:"信仰與工作",tags:["慢性疼痛","工作","接納"],
sum:"露絲因兩次意外導致 28 年慢性疼痛與疲勞，無法再全職工作。美國近半成人有慢性病，常伴隨抑鬱與經濟壓力，照顧自己就像全職工作。輔導員引用保羅身上的刺，鼓勵病人在盼望中接納病痛；醫師提醒神或許改變了你服事的方式，卻沒拿走服事的能力。露絲以陪伴與禱告服事人，凱蒂以營養食譜幫助病友，因神的作為而非事業或病痛定位自己。",
pts:["慢性病帶來醫療費、關係、情緒等多重壓力。","放慢腳步、調整節奏，與追求效率的文化背道而馳。","保羅先求醫治，後在軟弱中誇口（林後 12:9-10）。","神可能改變你的服事方式，卻沒拿走服事的能力。","不以事業、也不以病痛定義自己，而以神的作為定位。"],
mind:{c:"帶病工作",b:[["處境",["意外","慢性疼痛","意識模糊"]],["壓力",["經濟","關係","抑鬱"]],["接納",["林後 12:9-10","放慢節奏"]],["新呼召",["陪伴禱告","營養食譜","需要更多恩典"]]]},
frame:{q:"長期病痛時，還能如何工作與服事？",s:["露絲的故事","慢性病的普遍","接納的過程","重新定義服事","需要恩典"],a:"神不犯錯，你的所在之處，正是祂要你在的地方。"},
q:["神改變了你的服事方式，但沒有拿走服事的能力。","我不再以事業或病痛定位自己。","帶病工作不是因為疲憊而更難，而是需要更多恩典。"],
v:["林後 12:9-10"]},
{i:75,t:"癌症臨到教會時，該如何伸出援手",au:"Marissa Henley",d:"2019-01-31",c:"基督徒生活",tags:["癌症","教會關懷","實務"],
sum:"作者確診罕見癌症時，整個教會就像一起得了癌症。她提出三方面的幫助：情感需要——以同理心進入不確定，提醒神不變的應許，並讓病人知道沒有被遺忘；身體需要——指定一位統籌者，動員更大的網絡送餐、接送、照顧孩子（她八個月收到近百頓飯）；屬靈需要——發簡短的經文與詩歌、說「不必回覆，我在為你禱告」，並防範錯誤的苦難神學。",
pts:["確診帶來大量沒有答案的問題，先傾聽再提醒應許。","探訪、訊息、卡片讓病人知道沒有被遺忘。","指定統籌者，替病人家庭安排各種幫助。","化療讓人難以讀經，簡短經文與詩歌最有幫助。","小心「你有未認的罪」「信心夠就得醫治」等錯誤說法。"],
mind:{c:"教會如何陪伴癌症病人",b:[["情感",["進入不確定","不被遺忘"]],["身體",["統籌者","送餐輪值","接送育兒"]],["屬靈",["不必回覆的禱告","經文詩歌","防錯誤神學"]],["結果",["羅 5:3-5","教會更堅定"]]]},
frame:{q:"弟兄姊妹得癌症時，教會可以怎麼做？",s:["整個教會得了癌症","情感需要","身體需要","屬靈需要"],a:"倚靠那位憂患之子、完美的朋友的信實。"},
q:["那天，整個教會都確診了癌症。","你不必回覆，我只想讓你知道我在為你禱告。","分久不一定情疏。"],
v:["加 6:2","羅 5:3-5","賽 53:3","啟 21:4"]}
);

{i:76,t:"我們的世界一團糟，但我們的未來是光明的",au:"Owen Strachan",d:"2019-01-24",c:"基督徒生活",tags:["死亡","盼望","愛德華茲"],
sum:"儘管醫療與壽命大幅進步，苦難與死亡仍無法終結。愛德華茲寫信給遠方重病的女兒以斯帖：雖然我們看不見、到不了你，但你永遠在神無限仁慈的手中。這位行動派神學家也承認自己的有限——他無法帶任何家人渡過約旦河。我們在地上對未來的確定性最少，對天家的確定性卻最多；在亞當裡事情沒變好，在基督裡未來無比光明。",
pts:["進步再多，也找不到結束苦難和死亡的方法。","愛德華茲深深掛慮女兒，卻承認自己無能為力。","我們這些在基督裡的人永遠在神手中（約 10:27-29）。","救贖從父的旨意開始、在子的死裡成就、由聖靈扎根。","河岸雖有風暴，我們已能看見對岸。"],
mind:{c:"一團糟卻光明",b:[["現實",["進步有限","死亡陰影"]],["愛德華茲",["給女兒的信","在神手中","承認有限"]],["確據",["約 10:27","羅 8:31-39","約壹 5:13"]],["未來",["新天新地","約 19:30","渡過約旦河"]]]},
frame:{q:"世界不會變好時，盼望在哪？",s:["承認苦難仍在","父親的有限","在神手中","救贖的鎖鏈","看見對岸"],a:"不論發生什麼，我們永永遠遠都在神的手中。"},
q:["在地上我們對未來最不確定，對天家卻最確定。","在亞當裡萬事沒變好，在基督裡未來無比光明。","我們不能帶任何家人渡過約旦河，但神能。"],
v:["約 10:27-29","羅 8:31-39","雅 4:13-17","約壹 5:13-15","來 12:18-29","弗 1:15-20","約 19:30"]},
{i:77,t:"真實與虛幻的彼岸：對癡呆患者的愛",au:"Kathryn Butler",d:"2019-01-23",c:"信仰與工作",tags:["失智","照護倫理","誠實"],
sum:"失智的至親哭著要找早已過世的丈夫，該說實話讓她重新悲痛，還是說個「治療性謊言」？有人以此問：尊嚴與快樂何者重要？作者主張福音提供第三條路：人格不因認知衰退而減損，尊敬與憐憫同出一源。系統性欺騙會傷害信任；輕度者可溫和重新導向，重度者則要進入他們的世界，辨認背後的需要（被愛、安全），以擁抱和「我愛你」回應。",
pts:["失智者的人格與神形像不因記憶喪失而減少。","刻意營造的假環境可能加重混亂、破壞信任。","用愛心說誠實話：查看話語背後的需要。","輕度失智：牽手、翻相簿，溫和地重新導向。","重度失智：不必反駁也不必說謊，回應深層需要。"],
mind:{c:"愛失智的鄰舍",b:[["兩難",["說實話","治療性謊言","尊嚴 vs 快樂"]],["福音觀",["神的形像","尊敬與憐憫同源"]],["風險",["假環境","信任受損"]],["實踐",["重新導向","辨認需要","我愛你"]],["盼望",["基督再來","記憶歸位"]]]},
frame:{q:"失智者活在過去時，該說實話還是善意謊言？",s:["真實的兩難","治療性謊言的爭議","福音的第三條路","輕度：重新導向","重度：回應需要"],a:"不是在真實與虛幻之間二選一，而是尊敬與憐憫並行。"},
q:["敬重與憐憫，是同一棵葡萄樹的枝子。","問自己：他們真正在找的是什麼？","上帝與活在過去的他們同在，也與活在當下的我同在。"],
v:["太 22:39","創 1:26","可 12:30-31","弗 4:15","弗 4:29","利 19:11"]},
{i:78,t:"幫助受苦之人時要避免的錯誤",au:"Gavin Ortlund",d:"2018-12-15",c:"基督徒生活",tags:["約伯","安慰","陪伴"],
sum:"約伯的損失用兩章交代，朋友的控告卻嗡嗡響了 35 章。他們的問題不是異端，而是因果報應的世界觀。作者列出四個要避免的錯誤：太快搬出神的主權（約瑟是事後才說神意原是好的）；講你自己的苦難故事；淡化造成苦難的罪惡；只強調品格塑造而忽略安慰與同情。如同《魔法師的外甥》中流淚的阿斯蘭，基督親近傷心的人。",
pts:["苦難像磁鐵，把我們真正的神學吸出來。","「神的意思原是好的」是約瑟受苦多年後才說的。","分享自己的故事，要問是滿足我還是滿足他。","不要說「他們是好意」「沒那麼糟」來淡化罪惡。","受傷的朋友需要愛與陪伴，多過解釋。"],
mind:{c:"四個錯誤",b:[["太快講主權",["羅 8:28","先同哭 羅 12:15","創 50:20"]],["講自己的故事",["每人不同","聆聽細節"]],["淡化罪惡",["承認邪惡","伯 42:7"]],["只講成長",["雅 1:2-4","安慰同情"]],["基督",["詩 34:18","流淚的阿斯蘭"]]]},
frame:{q:"安慰受苦者時，最常見的錯誤是什麼？",s:["約伯朋友的問題","錯誤一至四","阿斯蘭的眼淚","終極的受苦者"],a:"願我們少像約伯的朋友，多像耶穌基督。"},
q:["約伯的朋友會用聖經經文傷害你。","與其解釋痛苦，不如陪他在其中。","「我知道」這幾個字蘊含了整個安慰的世界。"],
v:["伯 1-2","伯 3-37","羅 8:28","創 50:20","羅 12:15","伯 42:7","羅 5:3-5","伯 4:2","詩 34:18","詩 147:3","賽 61:1"]},
{i:79,t:"絕境是神仁慈的恩賜",au:"Jon Bloom",d:"2018-12-07",c:"基督徒生活",tags:["興旺","依靠神","禱告"],
sum:"一位在福音最少傳到之地建立教會的宣教士，描述會眾每週面臨暴力與搶奪，卻因此迫切呼求神。相較之下，美國基督徒生活在史上最繁榮的國家，興旺不知不覺地消減熱心，像屬靈的麻風病使人感受不到腐敗。因此要為受苦的弟兄姊妹禱告，也要禱告神救我們脫離興旺的弊病。任何驅使我們依賴神的事，都可能是更大的恩慈。",
pts:["患難逼人看見自己極度需要神。","興旺的腐蝕不明顯：娛樂、事業、保障……","缺乏「不抓住神就活不下去」的意識是致命的。","對世界的愛像屬靈麻風，讓人感覺不到衰敗。","讓你不斷到神面前的痛苦，可能是大恩慈。"],
mind:{c:"絕境的恩賜",b:[["受苦教會",["暴力","迫切呼求"]],["興旺之害",["太 13:22","消減熱心","屬靈麻風"]],["禱告",["為受苦者","為脫離興旺"]],["絕境",["林後 12:7","來 5:7","來 3:13"]]]},
frame:{q:"為什麼絕境可能是恩典？",s:["宣教士的見證","興旺的致命力","兩種禱告","擁抱驅使我們依靠神的事"],a:"任何驅使我們依賴神的事，都成了蒙恩的途徑。"},
q:["興旺可以讓信心死一千次。","感受到自己需要神，本身就是無價的恩賜。","不要抱怨那把你一再趕到神面前的刺。"],
v:["來 10:32","太 13:22","林後 12:7","來 5:7","來 3:13"]},
{i:80,t:"神如何改變我們對苦難的態度",au:"Justin Taylor",d:"2018-11-22",c:"教會事工",tags:["鮑力生","為什麼是我","基督"],
sum:"摘錄鮑力生的默想：受苦時我們先問「為什麼是我？為什麼這樣？為什麼是現在？」但當我們看見神在基督裡道成肉身、進入我們的苦難，問題就轉向外：「主啊，為什麼是祢？」這引出感恩（詩 103）。最後我們甚至能問：「為什麼不是我？」——若我的受苦能彰顯救主、安慰他人、使我成聖，像基督一樣學順從、同情軟弱、向世界顯出信望愛。",
pts:["第一個問題：為什麼是我？","神不是遠處給建議，而是親自進入你的苦難。","問題轉為：為什麼是祢？為何為我受苦？","於是生出感恩：不可忘記祂的一切恩惠。","最後：如果受苦能彰顯基督，為什麼不是我？"],
mind:{c:"三個問題",b:[["為什麼是我",["向內看","困惑"]],["為什麼是祢",["道成肉身","為愛受苦","詩 103:2-5"]],["為什麼不是我",["彰顯救主","安慰他人","太 26:39"]],["像基督",["學順從","同情軟弱","顯出信望愛"]]]},
frame:{q:"苦難中的問題如何被轉化？",s:["為什麼是我？","看見基督進入苦難","為什麼是祢？","感恩","為什麼不是我？"],a:"如果神應許的一切都要成就，那麼為什麼不是我？"},
q:["宇宙不再圍著你轉，但你並非無關緊要。","祂不是在遠處給意見，而是走進你的苦難。","如果我的受苦能彰顯救主，為什麼不是我？"],
v:["詩 103:2-5","太 26:39","來 5:7-8","西 1:24"]},
{i:81,t:"在挫折感中沒有未來：學習在我們的苦難當中喜樂",au:"D. A. Carson",d:"2018-11-19",c:"聖經與神學",tags:["羅馬書5章","稱義","苦難哲學"],
sum:"卡森遇見罹患帕金森症、無法說話的「坦桑尼亞的使徒」，問他如何面對自覺無用的試探，對方吃力寫下：在挫折感中沒有未來。卡森以羅 5:1-5 說明：因信稱義、與神和好、以盼望神的榮耀誇口，也以患難誇口——患難生忍耐、忍耐生老練、老練生盼望，聖靈把神的愛澆灌在心裡。連耶穌也因受苦學了順從（來 5:8），我們豈能免除？",
pts:["稱義是進入基督徒生命的入口，帶來與神和好。","「盼望」在此是確定的遠景，不是可能性。","苦難與信心交織時才生出忍耐，否則可能生怨。","老練意謂經火煉而被證實；盼望因此堅固不羞恥。","耶穌也因受苦學了順從；保羅渴望在祂的苦上有份。"],
mind:{c:"苦難中的喜樂",b:[["主教",["帕金森","挫折無未來"]],["羅 5:1-2",["稱義","與神和好","盼望榮耀"]],["羅 5:3-5",["忍耐","老練","盼望","神的愛"]],["基督",["來 5:7-9","來 4:15"]],["保羅",["腓 3:8-11","與祂同受苦"]]]},
frame:{q:"如何在苦難中喜樂而不陷入挫折？",s:["一位主教的回答","稱義與和好","盼望神的榮耀","患難的鏈條","耶穌也學順從","在祂苦上有份"],a:"在挫折感裡沒有未來——但在基督裡有美好的未來。"},
q:["在挫折感裡沒有未來。","有一種成熟，只有經過苦難的磨練才能達到。","若連耶穌都因受苦學順從，我們豈能假設可以免除？"],
v:["羅 3:26","羅 5:1-5","弗 3:14-21","來 5:7-9","來 4:15","腓 3:8-11"]},
{i:82,t:"司布真最好的講道",au:"Alistair Begg",d:"2018-10-23",c:"基督徒生活",tags:["司布真","抑鬱","傳記"],
sum:"司布真死時，倫敦十萬人送葬。他 15 歲在暴風雪中躲進循道會小教堂而歸信，19 歲到倫敦牧會，一生向千萬人講道。但他也飽受同代人的惡毒批評、一次講道時的踩踏慘劇所造成的長期憂鬱，以及痛風等疾病。作者認為，他最有意義的講道是用生命所傳的：在苦難中仍信靠慈愛而不動搖、掌管一切的神。",
pts:["他寧可成為傻瓜的笑柄，只要更能服事主。","出身平凡、教育有限，卻有極大學習渴慕。","惡毒批評與踩踏慘劇讓他長期陷入憂鬱。","痛風等疾病常讓他臥床數週。","他最後的講道見證：主總在爭戰最危急處。"],
mind:{c:"司布真",b:[["出身",["牧師之子","暴風雪中歸信","男孩佈道家"]],["影響",["千萬聽眾","十萬人送葬"]],["苦難",["惡毒批評","踩踏慘劇","憂鬱","痛風"]],["見證",["神掌管一切","主背最重十架"]]]},
frame:{q:"司布真最好的講道是哪一篇？",s:["盛大的喪禮","歸信與崛起","批評與憂鬱","疾病","信心中的最後講道"],a:"他用信心面對苦難的一生，就是最好的講道。"},
q:["若成為傻瓜的笑柄更能服事主，我寧願如此。","他的靈陷得極深，像孩子一樣哭卻不知為何。","主總是背著最沉重的十字架。"],
v:["林後 12:9"]},
{i:83,t:"免受逼迫的兩種必殺技",au:"Tim Challies",d:"2018-10-20",c:"基督徒生活",tags:["逼迫","世界","鹽與光"],
sum:"基督徒應料到受逼迫，因為神無罪的兒子尚且受逼迫。諷刺地說，有兩種「必勝」方法能免受逼迫：一是離開世界、與世隔絕，代價是世人想不到我們的救主；二是活在世界中卻像世界一樣，代價是生活與信仰自相矛盾。斯托得說：一群人藉離開世界躲逼迫，一群人藉被同化躲逼迫。神呼召我們作鹽作光，扎根世上卻活得不同。",
pts:["主受逼迫，跟隨祂的人也會受逼迫。","方法一：與世隔絕——世人也就想不到你的救主。","方法二：被世界同化——生活否認了信仰。","神不呼召我們走任何一種極端。","作鹽作光：在眾目睽睽下活出不同的生命。"],
mind:{c:"逃避逼迫？",b:[["前提",["約 15:20","入世不屬世"]],["隔絕",["不受苦","沒人想到基督"]],["同化",["不受苦","信仰矛盾"]],["呼召",["鹽與光","太 5:13-16","料到逼迫"]]]},
frame:{q:"基督徒能不能避開逼迫？",s:["逼迫是預期中的","方法一：離開世界","方法二：變得像世界","第三條路：鹽與光"],a:"逼迫會臨到忠心的人，我們只需料到這一點。"},
q:["離開世界，世界就想不到你的救主。","活得像世界，就沒有什麼值得被逼迫。","在眾目睽睽之下，扎根世上卻活得不同。"],
v:["約 15:20","約 17:15-16","太 5:13-16","提後 3:12"]},
{i:84,t:"神給你的，要超過你能承受的",au:"Mitch Chase",d:"2018-10-18",c:"基督徒生活",tags:["常見誤解","林前10:13","依靠神"],
sum:"「神給你的不會超過你能承受的」是把林前 10:13 關於試探的應許誤用在一般苦難上。這說法有兩個錯：它建立在文化的「公平」觀上，但神早已不按我們的罪待我們；它把受苦者指向自己的能力，聖經卻指向神（詩 46、賽 40:29）。保羅在亞西亞被壓太重、力不能勝，是為了叫他不靠自己，只靠叫死人復活的神。",
pts:["林前 10:13 講的是試探，不是一般苦難。","「公平」不是衡量神作為的標準。","這說法讓人看自己，聖經叫人看神。","神會給你超過你能承受的，但不超過祂能承受的。","保羅被壓太重，為要不靠自己只靠神（林後 1:8-9）。"],
mind:{c:"超過能承受的",b:[["誤用經文",["林前 10:13","試探≠試煉"]],["錯誤一",["公平觀","太 5:45"]],["錯誤二",["看自己","詩 46:1-3","賽 40:29"]],["真理",["林後 1:8-9","林後 4:17","詩 121:1-2"]]]},
frame:{q:"「神不會給你超過能承受的」對嗎？",s:["一句常見安慰","試探與試煉之分","錯在公平觀","錯在指向自己","保羅的經歷"],a:"苦難超過你能承受，好讓你依靠叫死人復活的神。"},
q:["神要給你的會超過你能承受的，但不會超過祂能承受的。","真誠是不夠的，約伯的朋友也很真誠。","保羅不是把你的苦難說小，而是把你的視野放大。"],
v:["林前 10:13","創 4:7","太 5:45","詩 46:1-3","賽 40:29","詩 121:1-2","林後 1:8-9","林後 4:17"]},
{i:85,t:"沒有無痛針能減除養育兒女之痛",au:"Nancy Guthrie",d:"2018-10-18",c:"基督徒生活",tags:["養育","福音","禱告"],
sum:"「你生產兒女必多受苦楚」不只指分娩，更是養育在罪惡世界中的兒女所經歷的心碎。但伊甸園也宣告了福音的應許。作者曾以為以福音為中心的養育是「讓孩子相信福音」，後來明白是「我在孩子面前活得像把一切盼望放在福音上」：坦承自己的罪、相信神而非自己的手段，持守最重要的事——孩子與基督的聯結，並真正地禱告。",
pts:["養育的痛是折骨、碎心、破夢的痛。","伊甸園中，審判裡已有福音的盼望（創 3:15）。","以福音為中心：我是否活得像把盼望放在福音上？","可以向孩子承認自己的罪，展示福音是赦免而非完美。","不靠工具箱與焦慮，而是真正地禱告。"],
mind:{c:"養育之痛",b:[["痛",["創 3:16","罪的世界"]],["盼望",["創 3:15","夏娃之名"]],["福音中心",["承認罪","信靠神工作"]],["最重要",["與基督聯結","核心問題"]],["禱告",["認識基督","讀經","同伴","腓 1:6"]]]},
frame:{q:"養育兒女的痛，福音如何回應？",s:["無法免除的痛","伊甸園的應許","重新理解福音中心","持守最重要的事","以禱告代替操控"],a:"那在孩子心裡動了善工的，必成全這工。"},
q:["沒有一種無痛針能減除養育兒女的痛。","我曾以為孩子比我更需要福音。","別急著打開教養工具箱，先真正地禱告。"],
v:["創 3:15-16","創 3:20","腓 1:6"]},
{i:86,t:"為什麼是我",au:"Justin Taylor",d:"2018-10-18",c:"基督徒生活",tags:["阿瑟·阿什","鮑力生","感恩"],
sum:"網球名將阿瑟·阿什因輸血感染愛滋病，有人問他是否問過「為什麼是我？」他說從沒問過：若苦難時要問，贏得溫布頓冠軍時也該問。作者再引鮑力生的默想：當看見神在基督裡進入我們的苦難，「為什麼是我」轉為「為什麼是祢」，生出感恩，最後能說「為什麼不能是我？」——若我的受苦能顯明救主、使人得盼望。",
pts:["阿什：得福時不問「為何是我」，受苦時也不問。","神不是遠處觀望，而是進入我們的苦難。","「為什麼是祢」讓我們驚訝於基督的愛。","罪和苦難都已落在慈愛之下，所以能感恩。","像基督一樣，在苦難中學順從，向世界顯出信望愛。"],
mind:{c:"為什麼是我？",b:[["阿瑟·阿什",["愛滋","溫布頓","不問為何"]],["鮑力生",["為什麼是我","為什麼是祢","為什麼不是我"]],["感恩",["詩 103","慈愛之下"]],["效法基督",["學順從","同情軟弱","夜燈"]]]},
frame:{q:"受苦時，該不該問「為什麼是我」？",s:["阿什的回答","鮑力生的三個問題","從內向到外向","感恩與甘願"],a:"如果我的受苦能讓人看見救主，為什麼不能是我？"},
q:["得勝時沒問「為什麼是我」，受苦時也不該問。","我的信心若能成為黑暗世界的夜燈，為什麼不能是我？","罪和苦難，現在都已落在慈愛之下。"],
v:["詩 103:1-5","太 26:39","來 5:7-8","西 1:24"]},
{i:87,t:"救救我！社交媒體使我筋疲力盡",au:"Stephen Altrogge",d:"2018-10-17",c:"基督徒生活",tags:["社交媒體","呼召","界限"],
sum:"社交媒體讓作者在情感上透支：癌症、災難、暴力、募款、憤怒。他找到三個原因：它讓我超出自己的呼召——嫉妒別人看似精彩的事奉，輕看自己平凡的崗位；超出我的力量——把全世界的重擔扛在身上，而本該擔的是身邊肢體的擔子；超出我的地界——讓我像神一樣全知，卻不像神一樣全能。解方是少低頭看手機，多注意身邊的人。",
pts:["社交媒體像一碗抑鬱濃湯，讓人透支。","你的呼召不是我的；嫉妒別人的呼召會讓人遊蕩一生。","加 6:2 的擔子主要在本地教會與身邊關係。","我不是神，無法背負全宇宙的重擔。","它給人全知的錯覺，卻顯出我們的無能。"],
mind:{c:"社交媒體疲勞",b:[["超出呼召",["嫉妒他人","平凡無聊","加爾文的崗哨"]],["超出力量",["加 6:2","重擔太多"]],["超出地界",["似全知","不全能"]],["解方",["少低頭","多環視","服事身邊人"]]]},
frame:{q:"為什麼滑手機讓人精疲力盡？",s:["透支的經驗","超出呼召","超出力量","超出地界","回到身邊"],a:"我把全世界的重擔都裝進了口袋。"},
q:["你的呼召不是我的呼召。","我不是神，只能出現在一個地方。","社交媒體讓我像神一樣全知，卻不像神一樣全能。"],
v:["加 6:2","林前 7:17"]},
{i:88,t:"給我的孩子們：我希望你們的生命更好",au:"Kathryn Maack",d:"2018-10-15",c:"基督徒生活",tags:["父母罪疚","離婚","福音"],
sum:"作者對母親說「父母離婚不是你的錯」，母親痛哭說多年來一直需要聽見這句話。作者發現自己也懷著對兒女「不夠好」的罪疚。父母容易以為兒女的成敗在於自己，但我們的責任是信靠基督，把基督指給兒女。她回顧自己正是在家庭破碎的黑暗中，經歷神只能在黑暗中照亮的豐盛。像施洗約翰說：我不是基督，耶穌才是。",
pts:["父母常為自己沒給孩子理想的家而暗自憂傷。","不完美與錯誤判斷確實會影響孩子。","我們的主要角色是作門徒，並把孩子指向基督。","家庭的破碎反而讓她認識自己需要耶穌。","對孩子說：我不能滿足你，但祂能。"],
mind:{c:"父母的罪疚",b:[["罪疚",["離婚","不夠好","單親"]],["錯誤假設",["成敗在我","必須完美"]],["黑暗的豐盛",["逆境塑造","在黑暗中看見神"]],["盼望之光",["指向基督","我不是基督"]]]},
frame:{q:"覺得給不了孩子更好生活時，怎麼辦？",s:["母親的眼淚","共同的罪疚","黑暗中的豐盛","把基督指給孩子"],a:"我不能滿足你，但祂能。"},
q:["這都不是你的錯。","神在混亂中彰顯祂的榮美，那是順境中會錯過的。","我不是基督，耶穌才是基督。"],
v:["約 1:20","約 3:30"]},
{i:89,t:"來受死",au:"Jared C. Wilson",d:"2018-10-11",c:"基督徒生活",tags:["門徒的代價","提摩太後書","十字架"],
sum:"徵兵廣告只展示閃亮武器和健壯士兵，從不出現傷兵。保羅卻不粉飾：「你要和我同受苦難，好像基督耶穌的精兵」（提後 2:3）。士兵、運動員、農夫都要堅持不懈，為了不是立即兌現的獎賞。作者借沙克頓南極探險的招募廣告，把「若成功將得尊榮」改為「保證得尊榮」：基督呼召人來受死，也帶人得著真正的生命。",
pts:["保羅的「徵兵口號」是：同受苦難。","士兵、運動員、農夫：每日勞苦，為將來的獎賞。","計算代價，好叫苦難來時不以為奇怪。","潘霍華：基督呼召一個人，就是呼召他來受死。","但在基督裡，尊榮與生命是有保證的。"],
mind:{c:"來受死",b:[["保羅的口號",["提後 2:3","同受苦難"]],["三比喻",["士兵","運動員","農夫"]],["計算代價",["彼前 4:12","提後 2:10"]],["沙克頓廣告",["危險旅程","保證尊榮"]]]},
frame:{q:"跟隨基督的「招募廣告」該怎麼寫？",s:["現代徵兵廣告","保羅不粉飾","三個比喻","計算代價","重寫招募廣告"],a:"來受死，就得生命。"},
q:["保羅的徵兵廣告寫著：同受苦難。","跟從基督，這是惹麻煩的。","危險不斷，報酬微薄，尊榮保證。"],
v:["提後 2:3-10","彼前 4:12","路 14:28","太 16:24-25"]},
{i:90,t:"當基督徒的安慰帶來的傷痛多於幫助",au:"Gaye Clark",d:"2018-10-11",c:"基督徒生活",tags:["喪偶","安慰","寬容"],
sum:"作者丈夫過世後，朋友幫忙收拾遺物時問：「經過這一切，神在教你什麼？」這像是一場屬靈考試。苦難常沒有答案，神不是用苦難教寓意，而是帶我們到祂面前。當別人說錯話時，作者提出五個回應：往好處想；坦承你的軟弱；一起禱告；選擇說話時用愛心說誠實話；選擇沉默時以愛遮掩過錯。兩個罪人都需要同一位救主。",
pts:["「神在教你什麼？」在錯的時機像宗教審問。","神子民不是走向故事的寓意，而是走向神的同在。","假定對方是好意：她冒險靠近，而非談天氣。","朋友抱著她禱告，承認自己像約伯的朋友。","說或不說都要出於愛（弗 4:15、彼前 4:8）。"],
mind:{c:"被安慰刺傷時",b:[["傷人的問題",["神在教你什麼","屬靈測試"]],["苦難的本質",["常無答案","走向神"]],["五個回應",["往好處想","承認軟弱","一起禱告","用愛說話","用愛沉默"]],["救主",["兩個罪人","來 4:16"]]]},
frame:{q:"被好心的安慰刺傷時，怎樣回應？",s:["收拾遺物的一幕","問題從何而來","時機的問題","五個福音式回應","兩個罪人一位救主"],a:"沒有基督，我們不能給予、也不能領受真正的安慰。"},
q:["我需要的是同情，不是屬靈測試。","安慰受苦的人，有時像擁抱一隻刺蝟。","兩個人都需要救主，一起來到施恩座前。"],
v:["詩 34:18","林後 12:9","弗 4:2","弗 4:15","彼前 4:8","來 4:16"]}
);

D.push(
{i:91,t:"以「死了就有益處」的心志去宣教",au:"John Piper",d:"2018-09-27",c:"聖經與神學",tags:["宣教","殉道","西1:24"],
sum:"派博以教會的使命宣言開場：大使命必定成就，因為神已應許（太 24:14），基督已用血買贖各族之人（啟 5:9）。苦難是代價：殉道有定數（啟 6:11），沒有「關閉的國門」；美國式追求安全舒適的優先次序必須翻轉。苦難也是途徑：西 1:24 的「補滿缺欠」，意指親自把基督的愛呈現給萬民（參腓 2:30 以巴弗提）。力量從何而來？來自對更美長存家業的信心（來 10:34）。",
pts:["大使命必定成就：要麼參與分享勝利，要麼虛度人生。","苦難是完成使命的代價，也是使命推進的途徑。","「補滿基督患難的缺欠」＝把基督的受苦親自呈現給萬民。","退休不是用來打高爾夫，而是可以投入宣教。","力量來自信靠將來的恩典：知道自己有更美長存的家業。"],
mind:{c:"死了就有益處",b:[["確定的應許",["太 24:14","啟 5:9","羅 15:8-9"]],["代價",["啟 6:11","沒有關閉的國門","翻轉優先次序"]],["途徑",["西 1:24","腓 2:30","腳起水泡的佈道者"]],["力量",["來 10:32-34","羅 8:36-39","路 21:16-18"]]]},
frame:{q:"如何以「死了就有益處」的心志宣教？",s:["使命必然成就","苦難是代價","苦難是途徑","晚年也能投入","信靠將來的恩典"],a:"一切包括死亡，都為你的益處效力；死了就有益處。"},
q:["沒有所謂「關閉的國門」，只有不願付代價的教會。","苦難不只是使命的代價，更是使命的途徑。","你可以被殺害，卻連一根頭髮也不會損壞。"],
v:["太 24:14","啟 5:9-10","啟 6:11","來 13:13","西 1:24","腓 2:30","來 10:32-34","來 13:5-6","羅 8:36-39","路 21:12-19","腓 1:21"]},
{i:92,t:"一個基督徒為何要選擇受難?",au:"John Piper",d:"2018-09-25",c:"基督徒生活",tags:["選擇受苦","愛","順服"],
sum:"派博簡短回答：選擇受難不是去做試探神的蠢事（如從殿頂跳下、玩蛇），那是罪。而是選擇一種關愛的生活方式，這種生活幾乎必然帶來苦難；或在被逼否認基督時寧死不屈。基督徒這樣選擇，是為了順服、為了自身的純潔，也為了耶穌的榮耀，並深信掌權而慈愛的神會使苦難成為自己與教會的益處。",
pts:["故意冒險試探神，不是選擇受苦，而是罪。","被逼否認主時，不受苦就等於悖逆。","選擇愛的生活方式，幾乎必然包含苦難。","神會把預知的苦難轉為我們與教會的益處。","為了順服、純潔與基督的榮耀，甘冒愛的風險。"],
mind:{c:"為何選擇受苦",b:[["不是",["試探神","魯莽冒險"]],["而是",["寧死不否認主","選擇愛人"]],["根據",["神掌權","神慈愛","苦難轉為益處"]],["目的",["順服","純潔","基督的榮耀"]]]},
frame:{q:"基督徒為何會主動選擇受苦？",s:["排除錯誤的選擇","不受苦即悖逆時","為愛人而冒風險","相信神會轉為益處"],a:"為順服、純潔與耶穌的榮耀，去面對愛的風險。"},
q:["不要從聖殿頂跳下，用蠢事試探神。","我們選擇的是愛，苦難只是愛的代價。","神會把你所預知的苦難，轉為你的好處。"],
v:["太 4:5-7","羅 5:3-5","羅 8:28"]},
{i:93,t:"為完成基督患難的目標，被呼召去受苦和喜樂",au:"John Piper",d:"2018-09-10",c:"聖經與神學",tags:["西1:24","宣教","系列講道"],
sum:"系列講道第三篇。派博逆向解讀西 1:24-29：保羅勞苦是要把每個人在基督裡完全引到神面前，宣揚「基督在你們心裡成了榮耀的盼望」這奧祕。「補滿缺欠」不是增加十架的價值，而是把它延伸、親自送達萬民——正如以巴弗提補足腓立比人愛心的不足。神的計劃是藉祂子民的受苦，讓世人看見基督的受苦。故事：腳起水泡的印度佈道者、三次被鞭打仍回村的馬賽族約瑟、賣馬奉獻的海地人。",
pts:["基督的苦難在價值上毫無缺欠，缺的是萬民還不認識。","以巴弗提的例子說明「補滿缺欠」的意思（腓 2:30）。","基督的十字架是為挽回；我們的十字架是為傳揚（曾約瑟）。","福音傳到人群中，常需要某種程度的捨命（可 8:35）。","各各他的路是苦路，卻也是最喜樂的路。"],
mind:{c:"補滿基督患難",b:[["經文脈絡",["西 1:24-29","榮耀的盼望","引到神面前"]],["釋義",["非加添價值","延伸送達","腓 2:30"]],["原則",["可 8:35","挽回 vs 傳揚"]],["故事",["印度佈道者","馬賽族約瑟","海地奉獻者"]]]},
frame:{q:"「補滿基督患難的缺欠」是什麼意思？",s:["從 29 節回溯","奧祕與盼望","缺欠的真正意思","藉受苦呈現基督","喜樂的苦路"],a:"基督受苦是為了完成救恩；我們受苦是為了傳揚救恩。"},
q:["基督的十字架為挽回，我們的十字架為傳揚。","苦路，卻是極其幸福的道路。","人們在我們的傷痕上，看見基督的傷痕。"],
v:["西 1:24-29","腓 2:30","可 8:35","賽 58:11","路 21:4"]},
{i:94,t:"被呼召去受苦和喜樂：為那永恆極重的榮耀",au:"John Piper",d:"2018-09-10",c:"聖經與神學",tags:["林後4章","不喪膽","榮耀"],
sum:"人人都想不喪膽、內心一天新似一天（林後 4:16）。派博把這節比作三角形頂點，由兩條邊支撐。第一邊（7-15 節）：神的能力在軟弱中顯明；生命藉我們的苦流向教會；神支撐我們不被打倒；我們必與耶穌一同復活。第二邊（17-18 節）：苦楚是暫時的；苦楚是輕的；苦楚正在為我們成就極重無比永遠的榮耀；我們注目所不見的。",
pts:["「所以」與「因為」兩個詞支撐了不喪膽的經歷。","寶貝放在瓦器裡，顯明能力出於神。","死在我們身上發動，生命卻在你們身上發動。","苦楚不只是黎明前的黑暗，而是在製造榮耀。","榮耀再大，若不注目它，對你也毫無幫助。"],
mind:{c:"不喪膽的八個理由",b:[["第一邊 7-15",["神的能力顯明","生命流向教會","神支撐我們","一同復活"]],["頂點 16",["不喪膽","一天新似一天"]],["第二邊 17-18",["苦楚暫時","苦楚輕微","成就榮耀","注目不見的"]]]},
frame:{q:"外體毀壞時，如何內心更新？",s:["人人渴望的經歷","三角形結構","7-15 節的四理由","17-18 節的四理由","注目觀看"],a:"相信神的話，注目所不見的，內心就天天更新。"},
q:["苦楚不只是黎明前的黑暗，它正在製造榮耀。","與將來的榮耀相比，苦楚如同天平上的羽毛。","神把宇宙的榮耀給你，你不注目也無益。"],
v:["林後 4:7-18","林後 11:23-28","羅 8:18","林前 2:9"]},
{i:95,t:"為聖潔和盼望，被呼召去受苦和喜樂",au:"John Piper",d:"2018-09-10",c:"聖經與神學",tags:["羅5章","聖潔","系列講道"],
sum:"系列講道第一篇。全球殉道人數攀升，西方社會對信仰也越來越敵視；宣教從來要付代價（尼日利亞宣教士孩子的墳墓）。羅馬尼亞牧師問安德烈弟兄：你們如何處理提後 3:12？派博提出苦難的四個目的：道德、親密、宣教、榮耀。本篇講道德目的：患難生忍耐、忍耐生老練、老練生盼望；神在拯救失喪者的同時，也在提升祂子民的盼望與聖潔。",
pts:["殉道者的血是教會的種子（特土良）。","我們已把敬虔「馴服」成中產階級的道德修養。","苦難四目的：道德、親密、宣教、榮耀。","忍耐使人看見自己委身的深度（可 4:16-17）。","老練是信心被驗證如精金；被試煉的人盼望最堅定。"],
mind:{c:"苦難的道德目的",b:[["處境",["殉道人數","社會敵意","宣教代價"]],["提後 3:12",["敬虔度日必受逼迫","安德烈弟兄"]],["四目的",["道德","親密","宣教","榮耀"]],["羅 5:3-4",["忍耐","老練","盼望"]]]},
frame:{q:"苦難如何塑造我們的聖潔與盼望？",s:["為受苦預備","大使命的代價","提後 3:12 的挑戰","苦難的四目的","患難的三重果效"],a:"在患難中仍歡歡喜喜盼望神的榮耀。"},
q:["上帝也把祂的兒子埋葬在宣教工場上。","我們把敬虔馴服成無關痛癢的道德修養。","最熱切渴慕榮耀的，是被苦難剝奪了世上安逸的人。"],
v:["羅 5:1-8","太 24:9","約 15:20","提後 3:12","彼前 4:19","可 4:16-17"]},
{i:96,t:"為要得著基督，被呼召去受苦和喜樂",au:"John Piper",d:"2018-09-07",c:"聖經與神學",tags:["腓3章","認識基督","系列講道"],
sum:"系列講道第二篇：苦難的親密目的。聖經應許神的子民必受苦（徒 14:22、彼前 4:12）。約伯在苦難後說「從前風聞，如今親眼看見」，司提反殉道前看見神的榮耀。保羅藉著翻轉價值觀預備受苦：把從前的「收益」都改寫為「虧損」，只寫下基督。成為門徒就是把一切所有都標上虧損（太 13:44、路 14:33）。這樣，當失去來臨時，我們會更多得著基督。",
pts:["與基督同受苦的人，往往最深刻地認識祂。","約伯：從風聞到親眼看見（伯 42:5）。","保羅把身份、熱心、律法的義都改記為虧損。","以基督為至寶，就預備好面對失去。","受苦的目標是得著基督、認識祂、與祂同受苦。"],
mind:{c:"苦難中的親密",b:[["見證",["布里奇斯","伯納","約伯","司提反"]],["預備",["價值翻轉","收益→虧損","太 13:44"]],["經歷",["丟棄萬事","看作糞土"]],["目標",["得著基督","認識祂","同受苦","復活"]]]},
frame:{q:"苦難如何讓我們更親近基督？",s:["聖經應許受苦","受苦者更認識神","保羅的預備","保羅的經歷","保羅的目標"],a:"失去許多寶貴的東西，卻得著更寶貴的基督。"},
q:["在安逸中認識的神是「風聞」，在苦難中是「親眼看見」。","在收益欄只寫下一個名字：基督。","失去世上的東西，不會失去我的寶藏，因為基督是一切。"],
v:["徒 14:22","約 15:20","彼前 4:12-14","提後 3:12","伯 42:5","徒 7:55","腓 3:1-14","太 13:44","路 14:33"]},
{i:97,t:"約伯：在苦難中上帝啟示自己",au:"John Piper",d:"2018-08-21",c:"聖經與神學",tags:["約伯記38-42","主權","順服"],
sum:"約伯記系列第四篇。上帝從旋風中對約伯說話，連番發問：立地根基時你在哪裡？海、晨光、雪雹、星宿、獅子、野山羊、野驢、鴕鳥、戰馬、鷹——約伯對這一切都無知且無力。上帝不是說「強權即公理」，而是說：運作世界涉及你無法想像的因素；且祂的權能有目的——降卑驕傲的、賜福謙卑的。約伯降服：承認神萬事都能、自己所說的是不明白的、從風聞到親眼看見。",
pts:["神沒有解釋苦難的原因，而是展示祂的智慧與權能。","人連一隻野山羊何時生產都不知道，怎能評判神？","神的主權不是任意的，而是有降卑驕傲、高舉謙卑的目的。","約伯三個順服的行動：承認全能、承認無知、悔改。","慕勒喪妻後說：我要親吻那施給我苦楚的手。"],
mind:{c:"旋風中的啟示",b:[["神的發問",["地與海","晨光雨雪","星宿"]],["動物世界",["獅子烏鴉","野山羊野驢","鴕鳥戰馬鷹"]],["神的公義",["非任意","降卑驕傲","賜福謙卑"]],["約伯降服",["神萬事都能","我所說不明白","親眼看見"]]]},
frame:{q:"神如何回應約伯的質問？",s:["約伯的怨言","朋友的膚淺神學","以利戶的預備","神的連番發問","約伯的降服","四個功課"],a:"欣然接受上帝聖潔的旨意，而不發怨言。"},
q:["你立大地根基時在哪裡？","不了解世界千萬事的關聯，怎能評判神的智慧？","我要親吻那施給我苦楚的手。（慕勒）"],
v:["伯 13:23-24","伯 19:25-27","伯 38-41","伯 40:2-14","伯 42:1-6","詩 84:11"]},
{i:98,t:"約伯：在苦難中被斥責",au:"John Piper",d:"2018-08-21",c:"聖經與神學",tags:["以利戶","煉淨","約伯記32-37"],
sum:"約伯記系列第三篇。約伯駁倒了三個朋友「受苦必因犯罪」的神學，卻沒有找到答案。年輕的以利戶提出新觀點：義人受苦不是神恨的記號，而是愛的標記；不是懲罰，而是煉淨殘餘的驕傲。派博提出五個理由說明以利戶的話值得重視（他不贊同雙方、篇幅長、約伯不反駁、神沒責備他、提出新見解）。對神的兒女而言，苦難是偉大醫生量身定做的手術。",
pts:["約伯證明了報應論不成立，卻沒有其他答案。","以利戶：神藉夢與疾病說話，為救人脫離驕傲與死亡。","義人不等於無罪的完全人，仍有殘餘的罪需要被暴露。","苦難開通義人的耳朵（伯 36:10、15）。","基督已擔當刑罰；神兒女的苦是醫治，不是懲罰。"],
mind:{c:"以利戶的斥責",b:[["僵局",["朋友：受苦因罪","約伯：神與我為敵"]],["五個理由",["新的開始","六章篇幅","約伯沉默","神未責備","新見解"]],["核心",["伯 33:14-19","伯 36:8-15","煉淨驕傲"]],["應用",["彼前 1:6-7","來 12:10-11","雅 1:2-4"]]]},
frame:{q:"義人為何受苦？以利戶怎麼說？",s:["朋友的理論失敗","約伯也沒有答案","以利戶登場","斥責約伯的驕傲","苦難是醫治","最寶貴的功課"],a:"苦難是神親手為我們做的專家治療，使我們成聖。"},
