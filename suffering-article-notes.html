P[0]=`人是由記憶組成的嗎？如果是，那麼當記憶一片片剝落，人還剩下什麼？

想像這樣一個下午：你走進安養院，媽媽抬頭看你，笑了，卻問你是不是住在她媽媽家。你耐心回答，她點點頭；五分鐘後，她又問一次。你回答第二次、第三次、第十次。窗外陽光很好，你的心卻像被誰一點一點掏空。她還在呼吸，你卻已經開始哀悼。

這是失智最殘酷的地方——它不是一次奪走一個人，而是一天偷走一點點。
今天偷走孫子的名字，
明天偷走回家的路，
後天偷走她最愛講的那個笑話。

可是，就在你以為一切都要被清空的時候，角落裡有位老人顫抖著開口唱歌。他不記得家人，不記得自己，卻記得「耶穌愛我」，記得「奇異恩典」。走調、沙啞，卻一字不差。

那一刻，你忽然明白：
記憶會遺失，但福音不住在記憶裡；
腦細胞會凋零，但真理扎根在比腦更深的地方。
我們以為是自己抓住了神，其實，是神一直抓住我們。

難道我們每個主日唱詩，只是為了當下的感動嗎？
不。我們唱，是在替將來的自己存糧；
我們唱，是在黑夜來臨前，先把燈點上；
我們唱，是讓有一天什麼都忘了的時候，靈魂仍記得回家的方向。

所以，親愛的，下次站在會眾中間，別只是跟著螢幕念歌詞。把每一句都唱進骨頭裡。也許你現在覺得不過是一首老歌，但總有一天，它會是你走過死蔭幽谷時，唯一還會唱的那首歌。

而如果你正陪著一位漸漸遺忘的家人，請記得：你不需要讓他想起一切。握住他的手，親吻他的額頭，就像很多年前，他曾這樣親吻還是嬰孩的你。愛，有時就是把對方曾經給你的，原封不動地還回去。

他也許忘了你的名字，
但恩惠慈愛沒有忘記他。
他也許走不出那個房間，
但他正走在回天家的路上。

記憶會散場，
恩典不散場。
當一切都被拿走，
剩下的那一位——
仍緊緊握著你。

#失智 #陪伴 #詩歌的力量 #詩篇23 #恩典不散場`;
P[1]=`最難承受的苦，不是最痛的苦，而是「說不出理由」的苦。

為了理想受苦，人會咬牙撐著；犯了錯受苦，人至少知道該承擔。可是有一種苦，沒有英雄的光環，也沒有罪有應得的解釋——孩子突然生病、公司突然裁員、心理忽然失控、所愛的人忽然離開。你坐在床邊，淚流滿面，只想問一句：為什麼？

而回答你的，常常只有更多的苦。

這時候，人最危險的不是痛，而是懷疑：如果這些苦毫無意義，我為什麼還要忍？於是有人用酒精、用螢幕、用各種方式把自己麻醉。可是麻醉退去，痛還在原地等著。

親愛的，請聽我說：
你看不懂的苦，不等於沒有意義；
你說不出的答案，不等於神沒有答案。

約伯到死都不知道自己為什麼受苦。神沒給他一份報告，卻給了他自己。我們以為我們需要解釋，其實我們需要的是那位知道一切的神。

你的苦，至少不是白受的——
它讓你學會用領受過的安慰，去安慰另一個流淚的人；
它讓忍耐長出老練，讓老練長出盼望；
它讓你在最黑的夜裡，認出那位一直坐在你床邊的主。

但請別把這當成算術題，別拿「我成長了多少」去抵銷「我痛了多少」。成聖不是交易，信心也不是收支表。我們只知道一件事：那位差愛子為我們受苦、受死的神，不會浪費任何一滴眼淚。

難道祂會讓祂兒女的眼淚，掉進虛空裡嗎？
難道那位數算麻雀的主，會漏數你的嘆息嗎？

不會的。

所以今晚，如果你還坐在床沿，還想不通，那就先不要想通。允許自己哭，允許自己問，然後把頭靠在那句應許上：萬事互相效力，叫愛神的人得益處。

你不必看懂整幅畫，
只要信那位執筆的手。
你不必知道明天的路，
只要知道祂已經走在前面。

苦依然是苦，
但它不再是虛空的苦。
淚依然是淚，
但每一滴，都被記在祂的冊子上。

P[2]=`我們總習慣數算災難，卻很少數算那些「沒有發生的災難」。

二十五年前，雙子星大樓倒下的那一天，世界彷彿也一起塌了。人們從高樓一躍而下，辦公室變成火海。那時有個年輕人被派去荒野守儲水塔，手裡只有一盞提燈，等著不知道會不會來的恐怖分子。今天我們聽這段故事會笑，正因為我們害怕的事——最後沒有發生。

那場悲劇之後，有人站出來大聲說：宗教毒害一切；神若良善，就不該容許這樣的事。

這質問很有力。可是讓我們反問一句：
我們用來審判神的那把「善惡的尺」，是從哪裡來的？
如果世上沒有絕對的善，我們憑什麼說這是「惡」？

我們看見神容許了某些事，就怪祂；
我們卻從沒看見神攔阻了多少事，也從沒謝過祂。

每天早上你開車出門，一個酒駕的人就可能毀掉一切；
每天晚上你闔眼入睡，一場地震就可能改寫人生。
但你仍然出門，仍然入睡，仍然把孩子送到學校。
為什麼？因為你心裡其實知道：這世界不是無人看管的。

神的護理像地心引力，你感覺不到它，卻每一步都踩在它上面。

我不明白神為什麼容許那天發生。
我不明白為什麼悲劇之後，褻慢的聲音反而更響。
我不明白為什麼期待中的復興沒有來。
但我更不明白——如果沒有神托住，這個世界為什麼還沒有崩潰得更徹底？

約伯問了很多為什麼，神只回他一句：我立大地根基的時候，你在哪裡？這不是冷漠，而是提醒：你看見的是一個角落，祂看見的是整片宇宙。

所以，我選擇兩件事同時做：
為那些死去的人哀哭，
也為那些活下來的日子感恩。
為發生的惡祈求公義，
也為沒發生的惡獻上讚美。

不明白，不妨礙敬拜；
看不懂，不妨礙信靠。
在一切我解釋不了的事情底下，
有一雙我看不見的手，
一直，一直，
托住這個搖搖欲墜的世界。

P[3]=`每個人心裡都有一個悲傷的房間，差別只在於：它在一樓客廳，還是地下室深處。

有人每天進出都要經過它；有人偶爾上樓坐一坐；也有人把它鎖在最底層，鑰匙丟進黑暗，假裝它不存在。

可是房間不會因為你不開門就消失。

一位醫生在妻子被宣告只剩六個月時才發現：懂醫學，不等於懂得怎麼送別。作為醫生，他知道每個數據；作為丈夫，他像被丟進大海。

我們的文化一直告訴我們：要堅強、要正面、要快點走出來。可是聖經從不這樣說。聖經說，耶穌也哭；聖經說，人生在世必有患難。活得越久，失去越多；愛得越深，痛得越真。

那麼，基督徒的悲傷和別人有什麼不同？不是不悲傷，而是——不像沒有指望的人那樣悲傷。

好好悲傷，是一門功課。

第一，要誠實。別再往西追著落日跑，轉身面對東方的黑暗吧，因為新的一天，正是從那裡升起。
第二，要耐心。悲傷沒有時刻表，它會慢慢讓別的顏色滲進來，但你可能一輩子都帶著那道印記，這沒有錯。
第三，要走進群體。先對神傾倒，再對人敞開；你不是要別人可憐你，你是要和別人一起軟弱。
第四，要感恩。就算暴風雨的畫裡，天空仍有一角藍。你失去的，本來就是借給你一段路的禮物。
第五，要抓住盼望。因為絕望像禿鷹，總在受傷的人上空盤旋。

你說，這太難了？
是的，很難。可是比起把悲傷鎖進地下室、讓它在暗處發霉，哪一個更難？

奇妙的是，那些好好悲傷過的人，往往變得更柔軟、更有憐憫、更像那位「常經憂患」的主。悲傷沒有把他們變小，反而把他們的心撐大了。

所以，今天如果你的房間門正半開著，不用急著關上。
讓光照進去一點，
讓朋友走進去一點，
讓主坐進去一點。

悲傷是愛的回音，
眼淚是思念的語言，
而盼望——
是在最黑的那一面牆上，
主親手開的一扇窗。

P[4]=`我們以為自己愛的是神，直到神拿走我們的「安定」，才發現原來我們更愛安定。

一對新婚夫妻，花了好多心思把小公寓佈置成夢想中的家：掛窗簾、釘畫框、邀朋友來吃飯。然後某一天晚上，他們拉開冰箱——牆裡爬滿了蟑螂。

那一刻，家就不再是家。

接下來的幾週像骨牌一樣倒下：搬回娘家、生病、祖父過世、車子拋錨、又生病。每天早上醒來第一個念頭是：今天又是什麼？

對一個熱愛秩序的人來說，這比任何災難都可怕。
行事曆亂了，
錢亂了，
生活節奏亂了，
連心都亂了。

她開始寫禱告日記，想找回一點平安。沒想到，神在紙頁上照出的是她的罪：她一直把「穩定的住所」當成快樂的前提——好像非得要先安頓好，才有資格喜樂。

這不就是我們很多人嗎？
「等我換了工作，我就會輕鬆。」
「等孩子長大，我就能好好讀經。」
「等這件事過去，我再來信靠神。」

我們把平安放在「等」的後面，卻忘了主說：在世上你們有苦難，但在我裡面有平安。不是在房子裡，不是在計畫裡，是在祂裡面。

每一天，她面前都有兩扇門。
一扇通往焦慮、掌控、和失去掌控之後的沮喪；
另一扇通往信靠、順服、感恩。
有時她走進第二扇，轉頭又溜回第一扇。但靠著恩典，她大部分的日子都定睛在主身上。

然後她看見了：父母張開雙臂接她回家；三天內就買到房子；教會的人來幫忙粉刷打包。那些蟑螂，竟成了神恩典的引路人。

你說，神為什麼不讓一切順利就好？
因為順利的時候，我們常以為是自己有本事；
只有當我們什麼都抓不住，才終於願意被抓住。

親愛的，如果你的生活也被「蟲子」攪亂了，別急著逃。
也許神正在拆除一座你以為是家的偶像，
好讓你住進一個真正的家——
那裡沒有門鎖，不怕蟲蛀，
那個家的名字，
叫做「在祂裡面」。

#安息 #偶像 #約翰福音16章33節 #失去掌控 #兩扇門`;
P[5]=`面對別人的傷口，我們通常只有兩種反應：要嘛關上門，要嘛整個人掉進去。

一位兒科治療師每天看著最糟的畫面：一場意外毀掉一個孩子的未來；一紙診斷書偷走一個童年。

有時她選擇關門。只處理看得見的問題，只說安全的套話，把情緒擋在門外，假裝這樣就能保護自己。
有時她選擇淹沒。整夜睡不著，吃不下，所有空閒都在想怎麼救他們，直到自己被燒乾，像那些一個接一個離開醫療和教會服事崗位的人一樣。

兩條路都很像愛，其實都不是。

關上門，是抹去對方身上神的形像；
被淹沒，是忘記神才是那位掌權的。
前者太少盼望在他人身上，後者太少盼望在神身上。

有沒有第三條路？

有。看看耶穌。
祂沒有站在遠處給建議，祂道成肉身，走進這個滿是傷口的世界；
祂在拉撒路墳前哭了，也溫柔地說：這不是故事的結局；
祂憐憫像羊沒有牧人的群眾，卻也常常退到曠野禱告；
祂在船上睡覺，即使風浪正大。

祂既沒有逃開痛苦，也沒有被痛苦吞沒。

P[42]=`說真話的代價，常常比說謊高；但不說真話的代價，往往更高。

一位讀者寫信問：我的主管誠信有問題，人資部門正在調查。我手上剛好有可靠的資訊，可是如果我站出來、最後卻沒什麼改變，我的下場可想而知。身為基督徒，我要怎麼說誠實話、榮耀基督，同時又保護自己？

這問題太真實了。我們都希望兩全其美：既做對的事，又不付代價。

先別急著回答。第一步，是釐清「誠信有問題」到底多嚴重：是不合理的要求？是灰色地帶？是違法？還是騷擾、暴力？問題越嚴重，回應就該越嚴肅。

比這更值得？

P[43]=`在危機時刻，教會最需要聽的，不一定是最新的新聞，而是最老的真理。

這個小小的選擇，裡面藏著大大的智慧。

世界每一週都在崩塌：戰爭、海嘯、颶風、地震、暴動、疫情。如果牧者每週都追著頭條改講題，講台很快就會變成新聞台。會眾聽見的，就不再是神的故事，而是二十四小時跑馬燈。

它傳講神全備的旨意，讓所有該碰的題目，最終都會被碰到；
它訓練會眾怎麼讀經，讓教會成為驗證解經的實驗室；
它建立一個聖經神學的框架，讓人懂得在生命每個角落應用真理。

我是不是在開一個先例，讓講台以後常常跟著輿論跑？

這件事對會眾的影響，真的大到需要暫停嗎？

頭條會換，

唯有主的話，

 if(last){let L=(paras[paras.length-1]||'').split('\n').map(s=>s.trim()).filter(Boolean);
  if(L.length>7){let st=-1;for(let k=L.length-7;k<L.length-2;k++){if(/[。！？；——]$/.test(L[k-1])){st=k;break}}L=L.slice(st>=0?st:L.length-6)}
  o.push(['臉書文最後金句：'+L.join('').slice(0,20)+'…',L.join('\n')]);}
 o.push(['開場金句：'+opening.slice(0,22)+(opening.length>22?'…':''),opening]);
 a.q.forEach((q,k)=>o.push(['金句'+(k+1)+'：'+q.slice(0,22),q]));
 return o;
}
const PUNC=/[，。、；：？！」』）》〉,.;:?!)]/;
function wrapClauses(ctx,text,maxW){
 const out=[];
 for(const seg of text.split('\n')){
  const cl=seg.match(/[^，、；：。？！,;:?!]+[，、；：。？！,;:?!」』）]*/g)||[seg];let line='';
  for(const c of cl){if(ctx.measureText(c).width>maxW)return null;if(ctx.measureText(line+c).width>maxW){out.push(line);line=c}else line+=c}
  if(line)out.push(line)}
 return out;
}
function wrapCanvas(ctx,text,maxW){
 const out=[];
 text.split('\n').forEach(seg=>{let line='';for(const ch of seg){const t=line+ch;if(ctx.measureText(t).width>maxW&&line){if(PUNC.test(ch)){line=t;continue}
  let cut=-1;for(let k=line.length-1;k>=Math.floor(line.length*0.45);k--){if(/[，、；：,;]/.test(line[k])){cut=k;break}}
  if(cut>=0){out.push(line.slice(0,cut+1));line=line.slice(cut+1)+ch}else{out.push(line);line=ch}}else line=t}if(line)out.push(line)});
 return out;
}
function drawCard(a){
 const cv=document.getElementById('cv');if(!cv)return;const ctx=cv.getContext('2d');
 const th=THEMES[+document.getElementById('ctheme').value],txt=cardOpts(a)[+document.getElementById('ctext').value][1];
 const W=1080,F='"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif';
 const g=ctx.createLinearGradient(0,0,W,W);g.addColorStop(0,th.g[0]);g.addColorStop(1,th.g[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,W);
 const rg=ctx.createRadialGradient(780,250,20,780,250,520);rg.addColorStop(0,th.glow);rg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,W,W);
 ctx.globalAlpha=.08;ctx.fillStyle=th.acc;ctx.beginPath();ctx.arc(140,960,260,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
 ctx.strokeStyle=th.acc;ctx.globalAlpha=.55;ctx.lineWidth=2;ctx.strokeRect(48,48,W-96,W-96);ctx.globalAlpha=1;
 ctx.fillStyle=th.acc;ctx.fillRect(W/2-3,110,6,64);ctx.fillRect(W/2-22,128,44,6);
 ctx.textAlign='center';ctx.fillStyle=th.acc;ctx.font=`600 30px ${F}`;ctx.fillText('苦 難 中 的 盼 望',W/2,232);
 const top=290,bot=820,maxW=820;let fs=78,lines,lh;
 let ok=false;
 for(fs=78;fs>=48;fs-=2){ctx.font=`bold ${fs}px ${F}`;lines=wrapClauses(ctx,txt,maxW);lh=fs*1.55;if(lines&&lines.length*lh<=bot-top){ok=true;break}}
 if(!ok)for(fs=78;fs>=34;fs-=2){ctx.font=`bold ${fs}px ${F}`;lines=wrapCanvas(ctx,txt,maxW);lh=fs*1.55;if(lines.length*lh<=bot-top)break}
 ctx.fillStyle=th.ink;ctx.font=`bold ${fs}px ${F}`;const y0=top+(bot-top-lines.length*lh)/2+fs;
 lines.forEach((l,k)=>ctx.fillText(l,W/2,y0+k*lh));
 ctx.fillStyle=th.acc;ctx.font=`bold 90px Georgia,serif`;ctx.globalAlpha=.35;ctx.fillText('“',150,top+40);ctx.fillText('”',W-150,bot+20);ctx.globalAlpha=1;
 ctx.fillStyle=th.acc;ctx.fillRect(W/2-60,860,120,3);
 ctx.fillStyle=th.ink;ctx.font=`500 32px ${F}`;ctx.globalAlpha=.85;
 let tt='《'+a.t+'》';while(ctx.measureText(tt).width>880&&tt.length>4)tt=tt.slice(0,-2)+'…》';
 ctx.fillText(tt,W/2,918);ctx.globalAlpha=1;
 if(a.v&&a.v[0]){ctx.fillStyle=th.acc;ctx.font=`500 28px ${F}`;ctx.fillText('經文｜'+a.v.slice(0,2).join('、'),W/2,966)}
}
function panel(a){
 if(curTab==='sum')return `<p class="sum">${esc(a.sum)}</p><h4>重點整理</h4><ul>${a.pts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
 if(curTab==='mind')return `<div class="mm">${mindSVG(a.mind)}</div>`;
 if(curTab==='frame')return `<div class="flow"><div class="fq">❓ ${esc(a.frame.q)}</div>${a.frame.s.map((x,k)=>`<div class="arr">▼</div><div class="fs"><b>${k+1}</b>${esc(x)}</div>`).join('')}<div class="arr">▼</div><div class="fa">✔ ${esc(a.frame.a)}</div></div>`;
 if(curTab==='quote')return a.q.map(x=>`<div class="qt">${esc(x)}</div>`).join('')+`<p class="note">金句為依文章內容提煉的精簡語句，非逐字摘錄。</p>`;
 if(curTab==='fb'){const p=P[a.i]||'';const op=cardOpts(a);return `<div class="cardwrap"><div class="cardctl"><h4 style="margin:0 0 8px">貼文圖卡（1080×1080）</h4>
 <label>圖卡文字<select id="ctext">${op.map((o,k)=>`<option value="${k}">${esc(o[0])}</option>`).join('')}</select></label>
 <label>配色<select id="ctheme">${THEMES.map((t,k)=>`<option value="${k}" ${k===a.i%THEMES.length?'selected':''}>${t.n}</option>`).join('')}</select></label>
 <button class="tab on" id="cdl">下載圖卡 PNG</button><p class="note">可換文字與配色後再下載，圖卡和貼文一起發到臉書。</p></div>
 <canvas id="cv" width="1080" height="1080"></canvas></div>
 <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h4 style="margin:0">臉書心靈貼文（約 ${p.replace(/\s/g,'').length} 字）</h4><button class="tab on" id="cpy">複製貼文</button></div><div class="fbp">${esc(p)}</div><p class="note">依本篇內容另行創作的貼文，可直接複製到臉書。</p>`;}
 if(curTab==='verse')return `<h4>文中提到的經文</h4><div class="vs">${a.v.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`;
}
const TABS=[['sum','重點摘要'],['mind','心智圖'],['frame','框架圖'],['quote','金句'],['verse','相關經文'],['fb','臉書貼文']];
function open(i){
 if(cur===null)scrollY0=window.scrollY;
 cur=i;const a=D.find(x=>x.i===i),r=filtered(),pos=r.findIndex(x=>x.i===i);
 $('#home').style.display='none';const d=$('#detail');d.style.display='block';
 d.innerHTML=`<button class="back">← 返回列表</button><div class="dh"><h2>${esc(a.t)}</h2><div class="meta">${esc(a.au)}｜${a.d}｜${esc(a.c)}｜${a.tags.map(esc).join('・')}</div></div>
 <div class="tabs">${TABS.map(t=>`<button class="tab ${t[0]===curTab?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>
 <div class="panel">${panel(a)}</div>
 <div class="nav2"><button data-go="${pos>0?r[pos-1].i:''}" ${pos>0?'':'disabled'}>← 上一篇</button><button data-go="${pos>=0&&pos<r.length-1?r[pos+1].i:''}" ${pos>=0&&pos<r.length-1?'':'disabled'}>下一篇 →</button></div>`;
 d.querySelector('.back').onclick=()=>{cur=null;render();window.scrollTo(0,scrollY0)};
 d.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{curTab=b.dataset.t;open(i)});
 d.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{if(b.dataset.go!=='')open(+b.dataset.go)});
 const cb=d.querySelector('#cpy');if(cb)cb.onclick=()=>{const txt=P[a.i];const done=()=>{cb.textContent='已複製 ✓';setTimeout(()=>cb.textContent='複製貼文',1500)};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,()=>fallback())}else fallback();function fallback(){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}ta.remove()}};
 if(curTab==='fb'){drawCard(a);['ctext','ctheme'].forEach(id=>d.querySelector('#'+id).onchange=()=>drawCard(a));
  d.querySelector('#cdl').onclick=()=>{const l=document.createElement('a');l.download=String(a.i+1).padStart(3,'0')+'_'+a.t.replace(/[\\/:*?"<>|？：「」]/g,'').slice(0,20)+'.png';l.href=document.getElementById('cv').toDataURL('image/png');document.body.appendChild(l);l.click();l.remove()};}
 window.scrollTo(0,0);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&cur!==null){cur=null;render();window.scrollTo(0,scrollY0)}});
render();
</script>
