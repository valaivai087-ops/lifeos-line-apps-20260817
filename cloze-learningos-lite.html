el more secure. A checklist reminded everyone that safety came before speed. Students then practiced slowly to avoid making careless errors.", "zh": "講師要求學生戴護目鏡，並建議使用設備前把長髮綁好。規則讓大家更安心。清單提醒所有人安全優先於速度。學生接著慢慢練習，避免粗心錯誤。"}]}, {"word": "resembled", "meanings": ["類似"], "pos": ["V"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P103", "title": "博物館裡的空白標籤", "blank": 3, "level": 5, "type": "尚待確認", "evidence": "She examined the box and found a mark that resembled a maker's symbol in an old catalog.", "why": "similarity 回扣 resembled，並非完全相同。", "en": "A small museum received a wooden box from a local family. No document explained its origin. The donors believed it had belonged to a traveling merchant, but this account came from a story repeated over several generations. The curator did not reject the story; she simply distinguished it from a verified fact. She examined the box and found a mark that resembled a maker's symbol in an old catalog. The similarity offered a useful clue, not a complete answer. A later search revealed that several workshops had used comparable marks. The team therefore kept the label tentative. Instead of inventing a precise date, it explained what was known and what remained uncertain. Some visitors found the incomplete story frustrating. Others appreciated being invited into the process of investigation. The museum added a display describing how evidence is compared and claims are revised. Months later, a visitor supplied a photograph showing a similar box in a shop. This new material did not solve every question, but it helped narrow the search. The exhibit ultimately became less about a single object's mystery and more about the responsibility of presenting knowledge honestly.", "zh": "小博物館收到當地家庭捐贈的木盒，沒有文件交代來源。捐贈者相信它曾屬旅行商人，但說法來自世代口傳。館員沒有否定故事，只把它與核實事實分開。她找到似乎與舊型錄製作者符號相近的記號。相似性是有用線索，而非完整答案。後來查出多間工坊用相近記號，因此標籤保持暫定。館方不編造精確日期，而說明已知與未知。部分訪客感到挫折，另一些欣賞能參與調查過程。館方加設展示，說明如何比較證據與修正主張。數月後，訪客提供商店中相似盒子的照片。新資料未解決一切，但縮小搜尋範圍。展覽最後更關乎誠實呈現知識的責任，而不只是一件物品的謎。"}]}, {"word": "responded", "meanings": ["回應了"], "pos": ["V"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P124", "title": "為新生安排路線", "blank": 3, "level": 3, "type": "介系詞搭配", "evidence": "Volunteers also responded to questions about transport.", "why": "responded to questions 配合過去式敘事；原形 reply 在此不能接 also 作過去述語。", "en": "The orientation team was responsible for guiding new students. Its map focused mainly on buildings used in the first week. Volunteers also responded to questions about transport. Their advice was based on incomplete personal experience, so they checked uncertain details. Students could then rely on the final guide for accurate directions.", "zh": "迎新團隊負責引導新生。地圖主要著重第一週使用的建築。志工也回應交通問題。建議基於不完整的個人經驗，因此會查證不確定細節。學生便能仰賴完成版指南獲得正確方向。"}]}, {"word": "responsibility", "meanings": ["責任"], "pos": ["N"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P103", "title": "博物館裡的空白標籤", "blank": 10, "level": 5, "type": "尚待確認", "evidence": "The exhibit ultimately became less about a single object's mystery and more about the responsibility of presenting knowledge honestly.", "why": "全文由物件轉向知識呈現的 responsibility。", "en": "A small museum received a wooden box from a local family. No document explained its origin. The donors believed it had belonged to a traveling merchant, but this account came from a story repeated over several generations. The curator did not reject the story; she simply distinguished it from a verified fact. She examined the box and found a mark that resembled a maker's symbol in an old catalog. The similarity offered a useful clue, not a complete answer. A later search revealed that several workshops had used comparable marks. The team therefore kept the label tentative. Instead of inventing a precise date, it explained what was known and what remained uncertain. Some visitors found the incomplete story frustrating. Others appreciated being invited into the process of investigation. The museum added a display describing how evidence is compared and claims are revised. Months later, a visitor supplied a photograph showing a similar box in a shop. This new material did not solve every question, but it helped narrow the search. The exhibit ultimately became less about a single object's mystery and more about the responsibility of presenting knowledge honestly.", "zh": "小博物館收到當地家庭捐贈的木盒，沒有文件交代來源。捐贈者相信它曾屬旅行商人，但說法來自世代口傳。館員沒有否定故事，只把它與核實事實分開。她找到似乎與舊型錄製作者符號相近的記號。相似性是有用線索，而非完整答案。後來查出多間工坊用相近記號，因此標籤保持暫定。館方不編造精確日期，而說明已知與未知。部分訪客感到挫折，另一些欣賞能參與調查過程。館方加設展示，說明如何比較證據與修正主張。數月後，訪客提供商店中相似盒子的照片。新資料未解決一切，但縮小搜尋範圍。展覽最後更關乎誠實呈現知識的責任，而不只是一件物品的謎。"}]}, {"word": "responsible", "meanings": ["負責的"], "pos": ["Adj"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P124", "title": "為新生安排路線", "blank": 1, "level": 3, "type": "介系詞搭配", "evidence": "The orientation team was responsible for guiding new students.", "why": "be responsible for V-ing 為負責做事；responsibility 是名詞。", "en": "The orientation team was responsible for guiding new students. Its map focused mainly on buildings used in the first week. Volunteers also responded to questions about transport. Their advice was based on incomplete personal experience, so they checked uncertain details. Students could then rely on the final guide for accurate directions.", "zh": "迎新團隊負責引導新生。地圖主要著重第一週使用的建築。志工也回應交通問題。建議基於不完整的個人經驗，因此會查證不確定細節。學生便能仰賴完成版指南獲得正確方向。"}]}, {"word": "restore", "meanings": ["恢復"], "pos": ["V"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P075", "title": "信任的重建", "blank": 2, "level": 4, "type": "上下文方向", "evidence": "Over time, transparent reporting helped restore trust, though full confidence returned only gradually.", "why": "透明報告是回應修補，restore trust；destroy 會與後文信心回來矛盾。", "en": "After a misleading advertisement, customers became skeptical of the company. It responded by publishing independent test results. Over time, transparent reporting helped restore trust, though full confidence returned only gradually.", "zh": "誤導廣告之後，顧客對公司起疑。公司以公布獨立測試結果回應。透明報告逐漸幫助恢復信任，但完整信心只慢慢回來。"}]}, {"word": "restored", "meanings": ["復育完成的"], "pos": ["V-en"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P119", "title": "復育尚未結束", "blank": 2, "level": 4, "type": "全文一致", "evidence": "Declaring the stream completely restored would go beyond the evidence.", "why": "completely restored 是全文認為過度的描述，注意 would go beyond。", "en": "The opening section reports that more fish have returned to the stream. Later, the article notes that pollution still enters after heavy rain. A consistent conclusion must recognize both recovery and continuing risk. Declaring the stream completely restored would go beyond the evidence. The final paragraph instead calls for regular monitoring. This recommendation matches the unresolved problem and avoids a contradiction between the ending and the earlier details.", "zh": "開頭說溪流魚變多，後文提醒大雨後仍有污染流入。一致的結論須兼顧復原和持續風險。宣稱已完全復育會超出證據。末段改為要求定期監測，與未解決問題一致，避免結尾和前文矛盾。"}]}, {"word": "results", "meanings": ["結果"], "pos": ["N"], "tags": ["Global", "Semantics", "POS"], "examples": [{"pid": "P031", "title": "食堂剩食方案", "blank": 2, "level": 3, "type": "文章組織", "evidence": "Next, it reports the results of a month-long trial.", "why": "試办之後呈現觀察結果 results。", "en": "The article opens by describing food waste in a cafeteria. It then presents a solution: smaller default portions with free seconds. Next, it reports the results of a month-long trial. The final paragraph discusses limitations, including the trial's short duration.", "zh": "文章先描述食堂剩食，再提出解方：預設份量較小，可免費續餐。接著報告一個月試辦的結果。末段討論限制，包括試辦時間太短。"}, {"pid": "P122", "title": "街坊物資調查", "blank": 2, "level": 3, "type": "詞性判斷", "evidence": "The results will help identify gaps in preparation.", "why": "The results 作主詞表示調查結果。", "en": "Volunteers will survey residents about emergency supplies. The results will help identify gaps in preparation. Rather than store everything in one building, the group plans several smaller depots. A local shop has already offered space for one of them. The plan will benefit households far from the central station.", "zh": "志工將調查居民的緊急物資。結果能找出準備不足處。團隊不打算把所有東西存一棟樓，而規劃幾個小據點。一家在地商店已提供空間。計畫將使遠離中央站的住戶受益。"}]}, {"word": "retain", "meanings": ["保留"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P132", "title": "給投稿者的正式回信", "blank": 4, "level": 3, "type": "語域不合", "evidence": "The message asked her to provide a short biography and to retain a copy of the original file.", "why": "retain a copy 表保留副本；ditch 不但口語，且意思相反。", "en": "The journal thanked the writer for her submission. It explained that the article would undergo editorial review. The message asked her to provide a short biography and to retain a copy of the original file. Its language was courteous and professional, matching a formal exchange between an editor and an author.", "zh": "期刊感謝作者投稿，說明文章將經編輯審閱。訊息請她提供簡歷並保留原檔副本。用語禮貌專業，符合編輯與作者的正式往來。"}]}, {"word": "return", "meanings": ["歸還"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P067", "title": "誰借給誰", "blank": 3, "level": 1, "type": "易混淆字詞", "evidence": "She promised to return it after painting her room.", "why": "until Sunday 設歸還期限，return 符合承諾；keep 不表歸還。", "en": "Jia asked to borrow a ladder from her neighbor. He was happy to lend it to her until Sunday. She promised to return it after painting her room.", "zh": "佳向鄰居借梯子。鄰居很樂意借給她用到週日。她答應粉刷完房間就歸還。"}]}, {"word": "returned", "meanings": ["歸還"], "pos": ["V-en"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P016", "title": "失物招領牆", "blank": 3, "level": 2, "type": "句間銜接", "evidence": "Within a month, most umbrellas had been returned.", "why": "辨認失主後應 returned；discarded 與設失物牆的目的不合。", "en": "Students often left umbrellas in classrooms. To address this problem, the office created a photo wall of lost items. The new system let owners identify their belongings before visiting the office. Within a month, most umbrellas had been returned.", "zh": "學生常把傘留在教室。為處理這個問題，辦公室設立失物照片牆。新制度讓失主先辨認物品再到辦公室。一個月內，大多數雨傘已歸還。"}]}, {"word": "reusable", "meanings": ["可重複使用的"], "pos": ["Adj"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P088", "title": "重新使用包裝", "blank": 1, "level": 1, "type": "構詞判斷", "evidence": "The shop chose reusable boxes that customers could return and use again.", "why": "re- 與 use again 相應；unusable 的 un- 表不能使用。", "en": "The shop chose reusable boxes that customers could return and use again. This reduced the need for disposable packaging. The change was not cost-free, but it made unnecessary waste more avoidable.", "zh": "商店選用顧客可歸還再用的盒子，減少一次性包裝需求。改變並非零成本，卻讓不必要的浪費更能避免。"}]}, {"word": "revealed", "meanings": ["顯示了"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P106", "title": "走廊的溫度地圖", "blank": 2, "level": 3, "type": "文法骨架", "evidence": "A map of the readings revealed several hot spots.", "why": "A map 是主詞，of the readings 不改主幹，revealed 後接 hot spots。", "en": "The students, equipped with handheld sensors, measured temperatures around the school. A map of the readings revealed several hot spots. The corridor beside the kitchen, despite its open windows, was warmer than expected. Trees planted near the west wall provided shade in the afternoon. These observations, together with maintenance records, helped the principal decide where to add fans.", "zh": "學生帶著手持感測器測量校園溫度。讀值地圖顯示數個熱點。廚房旁走廊雖開著窗，仍比預期熱。西牆旁種的樹在午後提供遮蔭。這些觀察和維護紀錄協助校長決定增設風扇的位置。"}]}, {"word": "review", "meanings": ["審閱"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P132", "title": "給投稿者的正式回信", "blank": 2, "level": 3, "type": "語域不合", "evidence": "It explained that the article would undergo editorial review.", "why": "editorial review 為編輯審查流程。", "en": "The journal thanked the writer for her submission. It explained that the article would undergo editorial review. The message asked her to provide a short biography and to retain a copy of the original file. Its language was courteous and professional, matching a formal exchange between an editor and an author.", "zh": "期刊感謝作者投稿，說明文章將經編輯審閱。訊息請她提供簡歷並保留原檔副本。用語禮貌專業，符合編輯與作者的正式往來。"}]}, {"word": "revise", "meanings": ["修正"], "pos": ["V"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P021", "title": "舊照片的日期", "blank": 3, "level": 4, "type": "時間線", "evidence": "This discovery led them to revise the date in the archive.", "why": "新證據推翻1950，應 revise；preserve 原日期會矛盾。", "en": "At first, the photo was believed to show the town in 1950. Researchers subsequently noticed a bridge built in 1962. The image therefore had to be taken after that year. This discovery led them to revise the date in the archive.", "zh": "起初人們認為照片呈現1950年的小鎮。研究者後來注意到一座1962年建成的橋。因此影像必須拍攝於該年之後。這個發現使他們修正檔案日期。"}]}, {"word": "revised", "meanings": ["修正"], "pos": ["V-en"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P103", "title": "博物館裡的空白標籤", "blank": 8, "level": 5, "type": "尚待確認", "evidence": "The museum added a display describing how evidence is compared and claims are revised.", "why": "新資料使 claims revised，不保證原說法永不變。", "en": "A small museum received a wooden box from a local family. No document explained its origin. The donors believed it had belonged to a traveling merchant, but this account came from a story repeated over several generations. The curator did not reject the story; she simply distinguished it from a verified fact. She examined the box and found a mark that resembled a maker's symbol in an old catalog. The similarity offered a useful clue, not a complete answer. A later search revealed that several workshops had used comparable marks. The team therefore kept the label tentative. Instead of inventing a precise date, it explained what was known and what remained uncertain. Some visitors found the incomplete story frustrating. Others appreciated being invited into the process of investigation. The museum added a display describing how evidence is compared and claims are revised. Months later, a visitor supplied a photograph showing a similar box in a shop. This new material did not solve every question, but it helped narrow the search. The exhibit ultimately became less about a single object's mystery and more about the responsibility of presenting knowledge honestly.", "zh": "小博物館收到當地家庭捐贈的木盒，沒有文件交代來源。捐贈者相信它曾屬旅行商人，但說法來自世代口傳。館員沒有否定故事，只把它與核實事實分開。她找到似乎與舊型錄製作者符號相近的記號。相似性是有用線索，而非完整答案。後來查出多間工坊用相近記號，因此標籤保持暫定。館方不編造精確日期，而說明已知與未知。部分訪客感到挫折，另一些欣賞能參與調查過程。館方加設展示，說明如何比較證據與修正主張。數月後，訪客提供商店中相似盒子的照片。新資料未解決一切，但縮小搜尋範圍。展覽最後更關乎誠實呈現知識的責任，而不只是一件物品的謎。"}]}, {"word": "rise", "meanings": ["上升"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P068", "title": "水位的變化", "blank": 1, "level": 2, "type": "易混淆字詞", "evidence": "Heavy rain caused the river to rise overnight.", "why": "river 自身水位上升為 rise；arise 用於問題或情況出現。", "en": "Heavy rain caused the river to rise overnight. Workers had to raise the temporary barrier to keep the road dry. They watched the water level closely until the storm passed.", "zh": "大雨使河流水位一夜上升。工人必須提高臨時障礙物以保持道路乾燥。他們密切觀察水位，直到暴風雨過去。"}]}, {"word": "routine", "meanings": ["例行工作"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P108", "title": "兩個借書箱", "blank": 4, "level": 3, "type": "指涉連貫", "evidence": "This routine kept the collection usable.", "why": "This routine 概括每週檢查和修書，不只回指單一本書。", "en": "The village placed a blue book box near the pier and a yellow one by the school. The first mainly served fishers, while the latter attracted children. Volunteers checked both boxes each Friday. If a book was damaged, they removed it for repair. This routine kept the collection usable. The villagers soon regarded the boxes as shared resources rather than private property.", "zh": "村莊在碼頭旁設藍色借書箱，學校旁設黃色箱。前者主要服務漁民，後者吸引兒童。志工每週五檢查兩個箱子。若有書損壞，就取出修補。這項例行工作維持館藏可用，村民也逐漸視箱子為共有資源而非私產。"}]}, {"word": "run", "meanings": ["進行／跑"], "pos": ["V"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P123", "title": "準備社區演出", "blank": 3, "level": 3, "type": "搭配判斷", "evidence": "Before rehearsal, they would run a sound test.", "why": "run a test 是進行測試，不是字面奔跑。", "en": "To organize the concert, the students first drew up a schedule. They agreed to share responsibility for equipment checks. Before rehearsal, they would run a sound test. Everyone was asked to keep track of borrowed items. These habits helped the group meet its deadline without a last-minute rush.", "zh": "學生為籌辦音樂會，先擬定時程，並同意分擔設備檢查責任。彩排前進行音效測試。大家要追蹤借來的物品。這些習慣幫團隊按期完成，不必最後一刻趕工。"}]}, {"word": "saves", "meanings": ["節省"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P005", "title": "屋頂雨水", "blank": 3, "level": 3, "type": "文法骨架", "evidence": "This simple system, despite its small size, saves the school hundreds of liters each month.", "why": "system 是 saves 的主詞；despite 片語不改變主幹。", "en": "A tank installed on the roof collects rainwater. The water stored inside it is used to clean the playground. This simple system, despite its small size, saves the school hundreds of liters each month.", "zh": "裝在屋頂的水箱收集雨水。儲存在裡面的水被用來清洗操場。這套簡單系統雖然不大，每月仍替學校省下數百公升的水。"}]}, {"word": "seek", "meanings": ["尋求"], "pos": ["V"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P080", "title": "提醒天氣", "blank": 2, "level": 3, "type": "中文直譯", "evidence": "If a storm approached, they should seek shelter rather than stay under a tree.", "why": "seek shelter 表尋求避難處；search shelter 指搜索該處，找尋遮蔽要 search for shelter。", "en": "The teacher told students to pay attention to the forecast. If a storm approached, they should seek shelter rather than stay under a tree. Following this advice could reduce the risk of injury.", "zh": "老師提醒學生注意天氣預報。若暴風雨接近，應尋找遮蔽處，不要留在樹下。遵循建議可降低受傷風險。"}]}, {"word": "sensitive", "meanings": ["敏感／體察的"], "pos": ["Adj"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P060", "title": "習慣新的步調", "blank": 3, "level": 3, "type": "介系詞搭配", "evidence": "The change also made her more sensitive to the needs of pedestrians at dangerous crossings.", "why": "sensitive to needs 是體察需求的搭配，符合自己步行後的改變。", "en": "After moving, Hana became accustomed to walking to school. She no longer insisted on taking a taxi. The change also made her more sensitive to the needs of pedestrians at dangerous crossings.", "zh": "搬家後，花奈習慣走路上學。她不再堅持搭計程車。這項改變也讓她更留意危險路口行人的需求。"}]}, {"word": "sequence", "meanings": ["順序"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P019", "title": "種子的等待", "blank": 3, "level": 2, "type": "時間線", "evidence": "The students recorded each stage so that next year's class could follow the same sequence.", "why": "each stage 的時間記錄構成 sequence。", "en": "The children planted beans on Monday. Two days later, tiny roots appeared. By Friday, the first leaves had emerged. The students recorded each stage so that next year's class could follow the same sequence.", "zh": "孩子們週一種下豆子。兩天後長出細根。到了週五，第一批葉子已冒出。學生記錄每個階段，讓明年的班級能追蹤同樣的順序。"}]}, {"word": "setback", "meanings": ["挫敗"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P045", "title": "失敗後的突破", "blank": 2, "level": 5, "type": "全文一致", "evidence": "The ending should acknowledge both the initial setback and the eventual success.", "why": "initial setback 呼應 early tests failed。", "en": "Early tests of the boat failed because its frame was too heavy. Engineers then reduced its weight, and the final trial succeeded. A summary claiming that the team made no progress would contradict the account. The ending should acknowledge both the initial setback and the eventual success.", "zh": "船隻早期測試因框架太重而失敗。工程師之後減重，最後試驗成功。若摘要宣稱團隊毫無進展，就會與敘事矛盾。結尾應同時承認最初的挫敗與最終成功。"}]}, {"word": "setting", "meanings": ["場域／背景"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P114", "title": "留住一座市場的理由", "blank": 3, "level": 4, "type": "全文主題", "evidence": "Architecture provides the setting, but relationships give the place its meaning.", "why": "Architecture 是互動發生的 setting，不是文章唯一中心。", "en": "Visitors photographed the old market's colorful signs. Residents, however, valued more than its appearance. Vendors remembered customers' names, neighbors exchanged news, and newcomers learned local customs. These details reveal the market's social role. The article's central concern is the preservation of community connections. Architecture provides the setting, but relationships give the place its meaning. A summary focused only on decoration would miss the broader theme.", "zh": "遊客拍攝老市場彩色招牌，但居民看重的不只是外觀。攤販記得客人姓名，鄰居交換消息，新居民學習地方習俗。細節揭示市場的社會角色。文章關心保存社區連結；建築提供場域，人際關係賦予意義。只談裝飾的摘要會錯失更廣主題。"}]}, {"word": "settle", "meanings": ["沉積"], "pos": ["V"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P018", "title": "修補步道", "blank": 3, "level": 4, "type": "句間銜接", "evidence": "These structures slowed runoff and helped soil settle behind them.", "why": "水速減慢有助土壤 settle；accelerate 與 slowed 的作用方向相反。", "en": "Heavy rain washed soil off the hillside. This erosion exposed the roots of nearby trees. To limit further damage, workers added small barriers. These structures slowed runoff and helped soil settle behind them.", "zh": "大雨沖走山坡土壤。這種侵蝕使附近樹根外露。工人加設小障礙物以限制更多損害。這些結構減慢逕流，讓土壤在後方沉積。"}]}, {"word": "share", "meanings": ["分擔"], "pos": ["V"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P123", "title": "準備社區演出", "blank": 2, "level": 3, "type": "搭配判斷", "evidence": "They agreed to share responsibility for equipment checks.", "why": "share responsibility 表分擔責任，與分工相合。", "en": "To organize the concert, the students first drew up a schedule. They agreed to share responsibility for equipment checks. Before rehearsal, they would run a sound test. Everyone was asked to keep track of borrowed items. These habits helped the group meet its deadline without a last-minute rush.", "zh": "學生為籌辦音樂會，先擬定時程，並同意分擔設備檢查責任。彩排前進行音效測試。大家要追蹤借來的物品。這些習慣幫團隊按期完成，不必最後一刻趕工。"}]}, {"word": "shared", "meanings": ["共有的"], "pos": ["Adj"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P108", "title": "兩個借書箱", "blank": 5, "level": 3, "type": "指涉連貫", "evidence": "The villagers soon regarded the boxes as shared resources rather than private property.", "why": "rather than private property 支持 shared resources。", "en": "The village placed a blue book box near the pier and a yellow one by the school. The first mainly served fishers, while the latter attracted children. Volunteers checked both boxes each Friday. If a book was damaged, they removed it for repair. This routine kept the collection usable. The villagers soon regarded the boxes as shared resources rather than private property.", "zh": "村莊在碼頭旁設藍色借書箱，學校旁設黃色箱。前者主要服務漁民，後者吸引兒童。志工每週五檢查兩個箱子。若有書損壞，就取出修補。這項例行工作維持館藏可用，村民也逐漸視箱子為共有資源而非私產。"}]}, {"word": "shop", "meanings": ["商店"], "pos": ["N"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P122", "title": "街坊物資調查", "blank": 4, "level": 3, "type": "詞性判斷", "evidence": "A local shop has already offered space for one of them.", "why": "a local shop 指商店，local 後要名詞；store 則已在前格作存放動詞。", "en": "Volunteers will survey residents about emergency supplies. The results will help identify gaps in preparation. Rather than store everything in one building, the group plans several smaller depots. A local shop has already offered space for one of them. The plan will benefit households far from the central station.", "zh": "志工將調查居民的緊急物資。結果能找出準備不足處。團隊不打算把所有東西存一棟樓，而規劃幾個小據點。一家在地商店已提供空間。計畫將使遠離中央站的住戶受益。"}]}, {"word": "shortage", "meanings": ["短缺"], "pos": ["N"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P078", "title": "缺貨的原因", "blank": 2, "level": 4, "type": "上下文邏輯", "evidence": "Because both factors could explain the shortage, she checked order records before reaching a conclusion.", "why": "sold out 與供應不足是 shortage，非 surplus。", "en": "The shop sold out after a festival, but the manager did not immediately blame rising demand. A delivery had also been delayed. Because both factors could explain the shortage, she checked order records before reaching a conclusion.", "zh": "店家節慶後售罄，但店長未立刻歸因於需求上升。另有一批送貨延遲。因兩因素都能解釋短缺，她先查訂貨紀錄再下結論。"}]}, {"word": "shorter", "meanings": ["更短的"], "pos": ["Adj"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P073", "title": "排隊縮短了", "blank": 1, "level": 2, "type": "上下文方向", "evidence": "Average queues became shorter, and complaints declined.", "why": "reduce waiting 與正面總評支持 shorter；longer 方向相反。", "en": "The clinic introduced appointments to reduce waiting. Average queues became shorter, and complaints declined. The staff viewed these changes as an improvement, although busy days remained difficult.", "zh": "診所導入預約以減少等待。平均隊伍變短，抱怨減少。工作人員將變化視為改善，儘管忙碌日子仍有困難。"}]}, {"word": "signal", "meanings": ["訊號"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P097", "title": "先保留作答理由", "blank": 1, "level": 3, "type": "尚待確認", "evidence": "The teacher treated the error as a signal, not a diagnosis.", "why": "not a diagnosis 明確排除 verdict，只能是 signal。", "en": "A student chose a word that did not fit the passage but could not explain the choice. The teacher treated the error as a signal, not a diagnosis. She requested more evidence and planned a different passage to check whether the difficulty would recur.", "zh": "學生選了不合篇章的字，卻無法說明理由。老師把錯誤當訊號，而非診斷。她要求更多證據，並安排不同文章觀察困難是否再出現。"}]}, {"word": "significantly", "meanings": ["顯著地"], "pos": ["Adv"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P001", "title": "校園花園", "blank": 3, "level": 1, "type": "詞形", "evidence": "Students are actively involved in watering them, and their interest in science has grown significantly.", "why": "修飾 has grown 的程度要用 significantly；significant 是形容詞。", "en": "Our school turned an empty yard into a garden. A variety of vegetables now grows there. Students are actively involved in watering them, and their interest in science has grown significantly.", "zh": "學校把空院子改成花園，現在裡面種著各式蔬菜。學生積極參與澆水，他們對科學的興趣也顯著提升。"}]}, {"word": "silence", "meanings": ["安靜"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P008", "title": "無聲提醒", "blank": 3, "level": 3, "type": "局部精確語意", "evidence": "The light is bright enough to be noticeable, but it does not interrupt the silence students need.", "why": "does not interrupt 指保留原有安靜；noise 反而是應減少的聲響。", "en": "During exams, the library uses lamps instead of bells. A visual signal tells readers when the room will close. The light is bright enough to be noticeable, but it does not interrupt the silence students need.", "zh": "考試期間，圖書館用燈取代鈴聲。視覺訊號提醒讀者即將閉館。燈光亮得足以被注意，卻不打破學生需要的安靜。"}]}, {"word": "since", "meanings": ["自從"], "pos": ["Prep"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P042", "title": "腳印與雨水", "blank": 1, "level": 5, "type": "推論", "evidence": "Someone must have used it since the rain stopped.", "why": "雨後平整而現在有腳印，限定在雨停後 since；before 的腳印應已被平整雨面抹除。", "en": "Investigators found footprints on a path that had been smooth after last night's rain. Someone must have used it since the rain stopped. The prints alone cannot reveal the person's identity. They support a limited claim about the timing of a visit.", "zh": "調查者在步道發現腳印，而昨夜雨後路面原本平整。一定有人在雨停後走過。單靠腳印不能揭露身分，只能支持到訪時間的有限判斷。"}]}, {"word": "site", "meanings": ["地點"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P024", "title": "洞穴新發現", "blank": 2, "level": 4, "type": "新舊資訊", "evidence": "The newly found site contained wall markings.", "why": "newly found site 重述剛介紹的 cave。", "en": "A team discovered a small cave beneath the hill. Until then, its existence had been unknown to local residents. The newly found site contained wall markings. These traces raised fresh questions about who had visited it.", "zh": "團隊在山丘下發現小洞穴。在那之前，當地居民不知道它的存在。這個新發現的地點有壁面刻痕。這些痕跡引出新的問題：誰曾到訪？"}]}, {"word": "skeptical", "meanings": ["懷疑的"], "pos": ["Adj"], "tags": ["Logic", "Semantics", "Global", "Grammar", "Collocation", "Cohesion", "POS"], "examples": [{"pid": "P075", "title": "信任的重建", "blank": 1, "level": 4, "type": "上下文方向", "evidence": "After a misleading advertisement, customers became skeptical of the company.", "why": "misleading advertisement 引起 skeptical，trusting 方向相反。", "en": "After a misleading advertisement, customers became skeptical of the company. It responded by publishing independent test results. Over time, transparent reporting helped restore trust, though full confidence returned only gradually.", "zh": "誤導廣告之後，顧客對公司起疑。公司以公布獨立測試結果回應。透明報告逐漸幫助恢復信任，但完整信心只慢慢回來。"}, {"pid": "P100", "title": "一條河的兩種任務", "blank": 4, "level": 5, "type": "全文一致", "evidence": "Some residents remained skeptical, fearing that vegetation would slow the water.", "why": "fearing… 表疑慮，不是支持。", "en": "For decades, a concrete channel carried rainwater quickly through the town. Engineers had designed it to prevent flooding, and many residents considered it a success. Yet its steep walls left little room for plants or animals. When the town proposed a redesign, the debate was not simply about beauty. It concerned how one place could serve multiple purposes. The new plan kept a deep central channel but added planted shelves along the sides. These features created habitats without blocking the main flow. Some residents remained skeptical, fearing that vegetation would slow the water. The team therefore ran tests before construction. The results suggested that the design could work under ordinary conditions; they did not guarantee safety in every possible storm. Officials described the evidence as promising, rather than final. After the first section opened, volunteers began to record water levels and wildlife sightings. Their observations would guide later adjustments. The project thus treated restoration as an ongoing process, not a single finished event. Its broader lesson was that public spaces require both careful design and continued attention.", "zh": "數十年來，水泥渠道讓雨水快速流過小鎮。工程師原先設計它是為防洪，许多居民認為很成功。但陡峭壁面使動植物幾乎無處生存。小鎮提出改造時，辯論不只關乎美觀，更涉及同一空間如何兼顧多項用途。新計畫保留深中央水道，在兩側增植栽平台。這些設計創造棲地，又不阻擋主流。部分居民仍懷疑，擔心植被減慢水流。因此團隊施工前先測試。結果暗示設計在一般條件下可行，卻不保證每場可能的暴雨都安全。官員稱證據有希望，而非已定論。首段開放後，志工開始記錄水位與野生動物。觀察將引導後續調整。修復因此是持續過程，而非一次完成的事件。更廣泛的啟示是公共空間既需周密設計，也需持續關注。"}]}, {"word": "social", "meanings": ["社會的"], "pos": ["Adj"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P114", "title": "留住一座市場的理由", "blank": 1, "level": 4, "type": "全文主題", "evidence": "These details reveal the market's social role.", "why": "姓名、消息、習俗共同指 social role；cosmetic 只抓招牌外觀。", "en": "Visitors photographed the old market's colorful signs. Residents, however, valued more than its appearance. Vendors remembered customers' names, neighbors exchanged news, and newcomers learned local customs. These details reveal the market's social role. The article's central concern is the preservation of community connections. Architecture provides the setting, but relationships give the place its meaning. A summary focused only on decoration would miss the broader theme.", "zh": "遊客拍攝老市場彩色招牌，但居民看重的不只是外觀。攤販記得客人姓名，鄰居交換消息，新居民學習地方習俗。細節揭示市場的社會角色。文章關心保存社區連結；建築提供場域，人際關係賦予意義。只談裝飾的摘要會錯失更廣主題。"}]}, {"word": "solution", "meanings": ["解決方案"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P031", "title": "食堂剩食方案", "blank": 1, "level": 3, "type": "文章組織", "evidence": "It then presents a solution: smaller default portions with free seconds.", "why": "問題後的 smaller portions 是 solution，不是在考據 origin。", "en": "The article opens by describing food waste in a cafeteria. It then presents a solution: smaller default portions with free seconds. Next, it reports the results of a month-long trial. The final paragraph discusses limitations, including the trial's short duration.", "zh": "文章先描述食堂剩食，再提出解方：預設份量較小，可免費續餐。接著報告一個月試辦的結果。末段討論限制，包括試辦時間太短。"}]}, {"word": "some", "meanings": ["部分"], "pos": ["Det"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P025", "title": "問卷的邊界", "blank": 1, "level": 2, "type": "作用範圍", "evidence": "Their replies describe some students' preferences, not everyone's.", "why": "not everyone's 限制範圍只能是 some；all 過度概括。", "en": "Only twenty students answered the survey. Their replies describe some students' preferences, not everyone's. The results may be useful for planning a small trial, but they cannot justify a claim about the entire school.", "zh": "只有二十位學生填問卷。回覆描述的是部分學生的偏好，不是每個人。結果可能對規劃小型試辦有用，但不能用來宣稱全校都如此。"}]}, {"word": "sources", "meanings": ["資料來源"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P037", "title": "審慎的書評", "blank": 3, "level": 3, "type": "作者態度", "evidence": "She recommends it for beginners, while advising advanced readers to consult additional sources.", "why": "unsupported claims 需 additional sources 補強，與審慎立場一致。", "en": "The reviewer praises the book's clear diagrams but notes several unsupported claims. Her overall tone is qualified: she sees strengths as well as weaknesses. She recommends it for beginners, while advising advanced readers to consult additional sources.", "zh": "評論者稱讚書中的清楚圖表，但指出數項缺乏支持的主張。她整體持保留態度，兼看優缺點。她推薦初學者閱讀，也建議進階讀者參照更多資料來源。"}]}, {"word": "stable", "meanings": ["穩固的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P107", "title": "為夜讀設計的燈", "blank": 2, "level": 3, "type": "局部精確語意", "evidence": "A stable base would keep it from tipping over.", "why": "keep…from tipping over 是底座 stable 的證據；fragile 與穩固不同。", "en": "Rui needed a lamp for a tiny shared room. Its arm had to be adjustable so she could direct light away from her roommate. A stable base would keep it from tipping over. She chose a model with a dimmer, which let her lower the brightness. It also used very little electricity, making it efficient. A portable design meant she could carry it to the study room.", "zh": "瑞需要適合狹小合住房間的燈。燈臂須可調整，才能讓光避開室友；穩固底座能避免傾倒。她選了有調光器的款式，可降低亮度。它耗電少，效率高；可攜式設計也讓她能帶到自習室。"}]}, {"word": "standards", "meanings": ["標準"], "pos": ["N"], "tags": ["Logic", "Semantics", "Grammar", "Collocation", "Cohesion", "Global", "POS"], "examples": [{"pid": "P104", "title": "校園新聞的查證", "blank": 9, "level": 5, "type": "作用範圍", "evidence": "Responsible reporting, it argued, requires the same standards when describing one's own success as when investigating someone else's story.", "why": "same standards 要求對己對人同樣嚴謹。", "en": "An image of a locked gate spread through the school chat group. Its caption claimed that the library would close permanently. Many students forwarded it before checking the date. The student newspaper decided to verify the message. First, reporters located the original image. It had been taken during repairs two years earlier. Next, they contacted the librarian, who explained that the current closure would last only one afternoon. The image itself was real, but its new context made it misleading. The team published a correction and included links to the relevant notices. They avoided accusing individual students of deliberate dishonesty because careless sharing did not prove intent. Instead, the article described a simple checking procedure: locate the source, inspect the date, and compare the claim with current information. A follow-up survey found that some readers had changed their sharing habits. The editors welcomed this response but did not call it universal. Only a fraction of students had answered. The final article therefore balanced a positive outcome with a clear statement of its limits. Responsible reporting, it argued, requires the same standards when describing one's own success as when investigating someone else's story. Accuracy is a continuing practice, not a badge earned once.", "zh": "一張上鎖校門照片在校群傳播，圖說宣稱圖書館永久關閉。許多人未查日期便轉傳。校刊決定查證，先找原圖，發現拍於兩年前修繕期間；再聯絡館員，得知本次只關一下午。照片真實，新脈絡卻使它誤導。團隊刊更正並附公告連結，避免指控個別學生蓄意不誠實，因為粗心分享不等於證明意圖。文章介紹查核程序：找來源、查日期、與當前資訊比對。後續調查發現部分讀者改變分享習慣。編輯肯定成果，卻不稱人人都如此，因只有小部分學生作答。文章因此平衡正面成果與清楚限制，主張描述自身成功和調查他人故事應用相同標準。準確是持續實踐，而非一次取得的徽章。"}]}, {"word": "stationary", "meanings": ["靜止的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P120", "title": "展覽的文具清單", "blank": 2, "level": 2, "type": "字形相似", "evidence": "The supply cart remained stationary while students unloaded it.", "why": "remained stationary 為保持靜止，注意 -ary。", "en": "Before the art fair, the class bought pens and other stationery. The supply cart remained stationary while students unloaded it. Each student gave the organizer a description of a planned display. The organizer checked that the labels would complement the artwork rather than distract from it. She later offered a compliment on the team's careful preparation.", "zh": "美術展前，班上買筆與其他文具。學生卸貨時，推車保持不動。每人向主辦者描述預計展出內容。主辦者確認標籤能補充作品而非搶焦點，後來也稱讚團隊準備細心。"}]}, {"word": "stationery", "meanings": ["文具"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P120", "title": "展覽的文具清單", "blank": 1, "level": 2, "type": "字形相似", "evidence": "Before the art fair, the class bought pens and other stationery.", "why": "pens and other stationery 為文具，注意 -ery。", "en": "Before the art fair, the class bought pens and other stationery. The supply cart remained stationary while students unloaded it. Each student gave the organizer a description of a planned display. The organizer checked that the labels would complement the artwork rather than distract from it. She later offered a compliment on the team's careful preparation.", "zh": "美術展前，班上買筆與其他文具。學生卸貨時，推車保持不動。每人向主辦者描述預計展出內容。主辦者確認標籤能補充作品而非搶焦點，後來也稱讚團隊準備細心。"}]}, {"word": "stiff", "meanings": ["拘謹的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P084", "title": "朋友的簡訊", "blank": 3, "level": 4, "type": "語域不合", "evidence": "A phrase like \"request your attendance\" would sound unnecessarily stiff in that exchange.", "why": "request your attendance 和好友簡訊語域不合，故 stiff；不是 relaxed。", "en": "In a text to a close friend, Eli wrote, \"Want to grab lunch after class?\" The casual invitation matched their familiar relationship. A phrase like \"request your attendance\" would sound unnecessarily stiff in that exchange.", "zh": "伊萊傳簡訊給好友：「下課要不要去吃午餐？」隨性的邀請符合熟識關係。「請求您出席」在這次互動中會顯得過度拘謹。"}]}, {"word": "store", "meanings": ["存放／商店"], "pos": ["V/N"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P122", "title": "街坊物資調查", "blank": 3, "level": 3, "type": "詞性判斷", "evidence": "Rather than store everything in one building, the group plans several smaller depots.", "why": "Rather than store… 中 store 是動詞；storage 是名詞。", "en": "Volunteers will survey residents about emergency supplies. The results will help identify gaps in preparation. Rather than store everything in one building, the group plans several smaller depots. A local shop has already offered space for one of them. The plan will benefit households far from the central station.", "zh": "志工將調查居民的緊急物資。結果能找出準備不足處。團隊不打算把所有東西存一棟樓，而規劃幾個小據點。一家在地商店已提供空間。計畫將使遠離中央站的住戶受益。"}]}, {"word": "stream", "meanings": ["溪流"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P012", "title": "河流巡守", "blank": 3, "level": 4, "type": "指涉連貫", "evidence": "This decision allowed fish to return to the polluted stream.", "why": "the polluted stream 指先前兩條中的另一條；不能指志工。", "en": "The volunteers mapped two streams before testing them for pollution. One was clean; the other contained waste from a workshop. The owner agreed to stop the discharge. This decision allowed fish to return to the polluted stream.", "zh": "志工先畫出兩條溪流的位置，再檢測它們的污染。一條乾淨，另一條有工坊排出的廢水。業主同意停止排放。這項決定讓魚回到受污染的溪流。"}]}, {"word": "stress", "meanings": ["壓力"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P093", "title": "保留生物的距離", "blank": 3, "level": 4, "type": "語意判斷", "evidence": "Keeping space allowed people to enjoy the animals without causing unnecessary stress.", "why": "without causing unnecessary stress 呼應保持距離的保護目的。", "en": "Visitors were told to observe the seals from a distance. Approaching them could disturb their rest. Keeping space allowed people to enjoy the animals without causing unnecessary stress.", "zh": "遊客被告知應遠距觀察海豹。靠近可能打擾牠們休息。保持距離能讓人欣賞動物，同時不造成不必要壓力。"}]}, {"word": "structure", "meanings": ["結構"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P115", "title": "一則公共提案的結構", "blank": 5, "level": 4, "type": "文章組織", "evidence": "This problem-to-response structure helps readers follow the argument.", "why": "problem-to-response structure 為組織架構，不是 decoration。", "en": "The report begins with a description of overcrowded bus stops. It then identifies the main causes, including uneven arrival times. The next section proposes a scheduling reform. A trial supplies evidence about whether the proposal works. The final section weighs benefits against costs before making a recommendation. This problem-to-response structure helps readers follow the argument.", "zh": "報告先描述公車站擁擠，再辨識主要成因，如到站時間不均。下一節提出班表改革。試辦提供方案效果的證據。末節權衡效益和成本，再給建議。從問題走向回應的結構讓讀者容易跟上論證。"}]}, {"word": "structures", "meanings": ["結構物"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P018", "title": "修補步道", "blank": 2, "level": 4, "type": "句間銜接", "evidence": "These structures slowed runoff and helped soil settle behind them.", "why": "These structures 回接 small barriers，而非樹根。", "en": "Heavy rain washed soil off the hillside. This erosion exposed the roots of nearby trees. To limit further damage, workers added small barriers. These structures slowed runoff and helped soil settle behind them.", "zh": "大雨沖走山坡土壤。這種侵蝕使附近樹根外露。工人加設小障礙物以限制更多損害。這些結構減慢逕流，讓土壤在後方沉積。"}]}, {"word": "submission", "meanings": ["投稿"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P132", "title": "給投稿者的正式回信", "blank": 1, "level": 3, "type": "語域不合", "evidence": "The journal thanked the writer for her submission.", "why": "期刊收到的稿件為 submission，符合正式用語。", "en": "The journal thanked the writer for her submission. It explained that the article would undergo editorial review. The message asked her to provide a short biography and to retain a copy of the original file. Its language was courteous and professional, matching a formal exchange between an editor and an author.", "zh": "期刊感謝作者投稿，說明文章將經編輯審閱。訊息請她提供簡歷並保留原檔副本。用語禮貌專業，符合編輯與作者的正式往來。"}]}, {"word": "submit", "meanings": ["提交"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P082", "title": "正式申請", "blank": 1, "level": 2, "type": "語域不合", "evidence": "The notice asks applicants to submit all documents by Friday.", "why": "正式申請通知用 submit documents；chuck 指隨手扔，既不合語域也不合提交程序。", "en": "The notice asks applicants to submit all documents by Friday. Incomplete applications will not be processed. Anyone needing assistance should contact the office during business hours.", "zh": "通知要求申請者週五前提交所有文件。不完整的申請不予處理。需要協助者請在辦公時間聯絡辦公室。"}]}, {"word": "subsequently", "meanings": ["後來"], "pos": ["Adv"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P021", "title": "舊照片的日期", "blank": 1, "level": 4, "type": "時間線", "evidence": "Researchers subsequently noticed a bridge built in 1962.", "why": "At first 後才出現新發現，subsequently 承接先後；previously 會把發現放在原判斷之前。", "en": "At first, the photo was believed to show the town in 1950. Researchers subsequently noticed a bridge built in 1962. The image therefore had to be taken after that year. This discovery led them to revise the date in the archive.", "zh": "起初人們認為照片呈現1950年的小鎮。研究者後來注意到一座1962年建成的橋。因此影像必須拍攝於該年之後。這個發現使他們修正檔案日期。"}]}, {"word": "subset", "meanings": ["子群"], "pos": ["N"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P113", "title": "閱讀調查的限定詞", "blank": 1, "level": 4, "type": "作用範圍", "evidence": "Its findings therefore describe a subset of the school population.", "why": "only library users 代表 subset，不是全校。", "en": "The survey reached only students who used the school library. Its findings therefore describe a subset of the school population. They cannot represent everyone. Some respondents preferred paper books, but that does not mean they never read on screens. The report carefully separated a general preference from an absolute rule. Its conclusion remained limited to the group actually surveyed.", "zh": "調查只接觸使用圖書館的學生，因此發現描述的是全校群體中的子群，不能代表所有人。部分受訪者偏好紙本，卻不表示從不看螢幕。報告區分一般偏好和絕對規則，結論限於實際受訪群體。"}]}, {"word": "substitute", "meanings": ["替代品"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P039", "title": "新工具的期待", "blank": 3, "level": 5, "type": "作者態度", "evidence": "She welcomes the tool's potential without treating it as a complete substitute for human judgment.", "why": "without treating…as a complete substitute 限定她沒有主張可完全取代人。", "en": "The columnist believes the translation tool could help travelers. Yet she warns that errors remain common in sensitive conversations. Her position is cautiously positive. She welcomes the tool's potential without treating it as a complete substitute for human judgment.", "zh": "專欄作家認為翻譯工具可能幫助旅人，但警告在敏感對話中仍常出錯。她的態度是審慎樂觀，肯定工具潛力，卻不把它視為完全替代人類判斷的東西。"}]}, {"word": "success", "meanings": ["成功"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P045", "title": "失敗後的突破", "blank": 3, "level": 5, "type": "全文一致", "evidence": "The ending should acknowledge both the initial setback and the eventual success.", "why": "eventual success 呼應 final trial succeeded；failure 會推翻已明示的結果。", "en": "Early tests of the boat failed because its frame was too heavy. Engineers then reduced its weight, and the final trial succeeded. A summary claiming that the team made no progress would contradict the account. The ending should acknowledge both the initial setback and the eventual success.", "zh": "船隻早期測試因框架太重而失敗。工程師之後減重，最後試驗成功。若摘要宣稱團隊毫無進展，就會與敘事矛盾。結尾應同時承認最初的挫敗與最終成功。"}]}, {"word": "successful", "meanings": ["成功的"], "pos": ["Adj"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P105", "title": "校園堆肥的改變", "blank": 5, "level": 2, "type": "詞形", "evidence": "What began as a small experiment became a successful part of daily school life.", "why": "a successful part 需要形容詞；success 是名詞，不是此處表成功性質的形式。", "en": "The school began collecting fruit peels for compost. At first, students showed little interest in the project. A teacher explained how food scraps could become valuable material for the garden. After seeing the results, students separated their waste more carefully. The amount sent to the landfill fell considerably. What began as a small experiment became a successful part of daily school life.", "zh": "學校開始收集果皮製作堆肥。起初學生對計畫興趣不大。老師解釋廚餘如何成為花園的珍貴材料。看到成果後，學生更仔細分類垃圾，送往掩埋場的量大幅減少。小實驗成了校園日常中成功的一環。"}]}, {"word": "suggested", "meanings": ["建議", "暗示"], "pos": ["V"], "tags": ["Grammar", "Semantics", "Global", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P062", "title": "練習演說", "blank": 2, "level": 2, "type": "句型判斷", "evidence": "She suggested practicing in front of a mirror and reminded him that pauses could help listeners follow the message.", "why": "suggested practicing 接動名詞；不是 suggested 人 to V。", "en": "The coach encouraged Lian to speak more slowly. She suggested practicing in front of a mirror and reminded him that pauses could help listeners follow the message.", "zh": "教練鼓勵連放慢說話速度，建議對鏡練習，並提醒他停頓能幫聽眾跟上內容。"}, {"pid": "P100", "title": "一條河的兩種任務", "blank": 5, "level": 5, "type": "全文一致", "evidence": "The results suggested that the design could work under ordinary conditions; they did not guarantee safety in every possible storm.", "why": "普通條件測試無法保證一切，suggested 保留推論強度。", "en": "For decades, a concrete channel carried rainwater quickly through the town. Engineers had designed it to prevent flooding, and many residents considered it a success. Yet its steep walls left little room for plants or animals. When the town proposed a redesign, the debate was not simply about beauty. It concerned how one place could serve multiple purposes. The new plan kept a deep central channel but added planted shelves along the sides. These features created habitats without blocking the main flow. Some residents remained skeptical, fearing that vegetation would slow the water. The team therefore ran tests before construction. The results suggested that the design could work under ordinary conditions; they did not guarantee safety in every possible storm. Officials described the evidence as promising, rather than final. After the first section opened, volunteers began to record water levels and wildlife sightings. Their observations would guide later adjustments. The project thus treated restoration as an ongoing process, not a single finished event. Its broader lesson was that public spaces require both careful design and continued attention.", "zh": "數十年來，水泥渠道讓雨水快速流過小鎮。工程師原先設計它是為防洪，许多居民認為很成功。但陡峭壁面使動植物幾乎無處生存。小鎮提出改造時，辯論不只關乎美觀，更涉及同一空間如何兼顧多項用途。新計畫保留深中央水道，在兩側增植栽平台。這些設計創造棲地，又不阻擋主流。部分居民仍懷疑，擔心植被減慢水流。因此團隊施工前先測試。結果暗示設計在一般條件下可行，卻不保證每場可能的暴雨都安全。官員稱證據有希望，而非已定論。首段開放後，志工開始記錄水位與野生動物。觀察將引導後續調整。修復因此是持續過程，而非一次完成的事件。更廣泛的啟示是公共空間既需周密設計，也需持續關注。"}]}, {"word": "suggests", "meanings": ["暗示／顯示可能"], "pos": ["V"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P040", "title": "空掉的餵食器", "blank": 1, "level": 3, "type": "推論", "evidence": "The evidence suggests that birds ate at least some of the seeds.", "why": "拍到到訪只能支持 suggests，不能用 proves 宣稱已排除其他原因。", "en": "A bird feeder was full at sunrise and empty by noon. A camera showed several birds visiting it. The evidence suggests that birds ate at least some of the seeds. It does not establish the exact amount each bird consumed or rule out every other explanation.", "zh": "餵鳥器日出時是滿的，中午已空。攝影機拍到幾隻鳥到訪。證據暗示鳥至少吃掉部分種子，卻無法確定每隻鳥吃的精確量，也不能排除所有其他解釋。"}]}, {"word": "support", "meanings": ["支持／協助", "支持"], "pos": ["V/N", "V"], "tags": ["POS", "Semantics", "Global", "Grammar", "Collocation", "Logic", "Cohesion"], "examples": [{"pid": "P053", "title": "相互支持", "blank": 1, "level": 2, "type": "詞性判斷", "evidence": "Older students support younger readers during weekly meetings.", "why": "Older students 後需要動詞 support。support 在此作動詞。", "en": "Older students support younger readers during weekly meetings. This assistance makes difficult books less frightening. The school measures the program's success through reading progress, not the number of meetings alone.", "zh": "高年級學生在每週聚會中支持年幼讀者。這份支持讓難書不再那麼可怕。學校以閱讀進步衡量成效，不單看聚會次數。"}, {"pid": "P102", "title": "城市夜色中的昆蟲", "blank": 10, "level": 5, "type": "推論", "evidence": "Scientific inquiry, they learned, depends on adjusting claims to match what observations actually support.", "why": "claims match observations support，主張依證據而定。", "en": "When a city replaced its streetlights, residents welcomed the brighter roads. A biology teacher asked a different question: how would the change affect insects? Her students placed observation sheets near several lamps and counted visits at fixed times. To keep the comparison fair, they used the same procedure at every location. They found more insects around some lamps than others. This difference was interesting, but its cause was not immediately clear. The locations also varied in temperature and nearby vegetation. The teacher therefore reminded the class that a pattern was not automatically an explanation. During a second trial, the students compared two lamp types in the same area. Their new records provided stronger evidence about the role of light. Even so, the findings applied only to the conditions they had tested. The class resisted the temptation to claim that one lamp was best everywhere. In their report, they described both the results and the limitations. The city agreed to consider a smaller trial rather than replace every light at once. For the students, the most valuable lesson was not a simple answer but a more careful way of asking questions. Scientific inquiry, they learned, depends on adjusting claims to match what observations actually support.", "zh": "城市更換路燈時，居民歡迎更明亮道路。生物老師問：改變如何影響昆蟲？學生在幾座燈旁設觀察表，固定時間計數到訪。為公平比較，各處程序一致。他們發現某些燈邊昆蟲更多，差異有趣，原因卻未明：各地溫度、植被也不同。老師提醒模式不自動等於解釋。第二次試驗在同區比較兩款燈，新紀錄提供更強證據。不過發現只適用受測條件。學生避免宣稱某款燈處處最佳，報告同時說明結果與限制。市府同意先做較小試辦，不一次換掉所有燈。學生最有價值的收穫不是簡單答案，而是更審慎提問。科學探究需調整主張，使之符合觀察實際能支持的範圍。"}]}, {"word": "survey", "meanings": ["調查"], "pos": ["V"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P122", "title": "街坊物資調查", "blank": 1, "level": 3, "type": "詞性判斷", "evidence": "Volunteers will survey residents about emergency supplies.", "why": "will 後用動詞 survey。", "en": "Volunteers will survey residents about emergency supplies. The results will help identify gaps in preparation. Rather than store everything in one building, the group plans several smaller depots. A local shop has already offered space for one of them. The plan will benefit households far from the central station.", "zh": "志工將調查居民的緊急物資。結果能找出準備不足處。團隊不打算把所有東西存一棟樓，而規劃幾個小據點。一家在地商店已提供空間。計畫將使遠離中央站的住戶受益。"}]}, {"word": "survive", "meanings": ["存活／度過"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P091", "title": "替樹留空間", "blank": 3, "level": 2, "type": "語意判斷", "evidence": "The change helped the tree survive the dry season.", "why": "取得水分幫樹 survive，和乾季壓力構成因果。", "en": "The roots needed room to spread, so workers removed several paving stones. Rain could then penetrate the exposed soil. The change helped the tree survive the dry season.", "zh": "樹根需要擴展空間，因此工人移除幾塊鋪面石。雨水因而能滲入露出的土壤。改變幫樹度過乾季存活。"}]}, {"word": "system", "meanings": ["制度"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P016", "title": "失物招領牆", "blank": 2, "level": 2, "type": "句間銜接", "evidence": "The new system let owners identify their belongings before visiting the office.", "why": "new system 以較概括的詞重述 photo wall 的運作方式。", "en": "Students often left umbrellas in classrooms. To address this problem, the office created a photo wall of lost items. The new system let owners identify their belongings before visiting the office. Within a month, most umbrellas had been returned.", "zh": "學生常把傘留在教室。為處理這個問題，辦公室設立失物照片牆。新制度讓失主先辨認物品再到辦公室。一個月內，大多數雨傘已歸還。"}]}, {"word": "take", "meanings": ["承擔", "參與〔搭 part in〕", "拍攝／拿取", "承擔／照管〔搭 care〕"], "pos": ["V"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P055", "title": "做決定的時刻", "blank": 2, "level": 1, "type": "搭配判斷", "evidence": "Members agreed to take responsibility for checking the weather.", "why": "take responsibility for 表承擔責任。", "en": "The club had to make a decision about its trip. Members agreed to take responsibility for checking the weather. They would also pay attention to warnings from local guides.", "zh": "社團必須對旅行做決定。社員同意負責查天氣，也會注意當地嚮導的警告。"}, {"pid": "P079", "title": "參加哪一種活動", "blank": 3, "level": 2, "type": "中文直譯", "evidence": "She would also attend its weekly meetings and take part in the city tournament.", "why": "take part in 是整體詞塊；participate in 可用，但不能填成 participate part in。", "en": "Nora decided to join the chess club. She would also attend its weekly meetings and take part in the city tournament. Each activity gave her a different way to practice.", "zh": "諾拉決定加入西洋棋社，也會出席每週聚會並參加城市賽。每種活動提供不同練習方式。"}, {"pid": "P081", "title": "拍照留念", "blank": 1, "level": 4, "type": "中文直譯", "evidence": "At the village, students asked permission to take photographs of local crafts.", "why": "take photographs 是此處普通拍照搭配；do photographs 不合此處拍照的慣用搭配。", "en": "At the village, students asked permission to take photographs of local crafts. They then kept in touch with the makers by email. The exchange helped them gain a deeper understanding of the work.", "zh": "在村莊裡，學生先徵求同意再拍當地工藝品的照片。之後他們以電子郵件和製作者保持聯絡。交流幫他們對工藝有更深理解。"}, {"pid": "P131", "title": "把中文想法換成英文", "blank": 4, "level": 3, "type": "中文直譯", "evidence": "Students would also take care of the tables after the event.", "why": "take care of 表照管，需整組讀。", "en": "To prepare the charity sale, students had to make arrangements with local shops. They wanted to give people a hand without creating extra waste. One shop agreed to offer reusable bags at cost. Students would also take care of the tables after the event. Their teacher reminded them that helping the community meant putting ideas into practice, not merely discussing them.", "zh": "學生為準備義賣，需與店家協調安排，希望幫助人又不增加垃圾。一家店同意以成本價供應可重用袋。學生也會在活動後整理照管桌子。老師提醒幫助社區是把想法付諸實踐，不只是討論。"}]}, {"word": "teamwork", "meanings": ["團隊合作"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P030", "title": "看不見的工作", "blank": 1, "level": 5, "type": "全文主題", "evidence": "These examples highlight the importance of teamwork.", "why": "多種幕後角色的共同意義是 teamwork，非追求 fame。", "en": "A concert depends on more than the singer. Technicians test microphones, cleaners prepare the hall, and ushers guide the audience. These examples highlight the importance of teamwork. Public attention may focus on one performer, but success relies on many people's contributions.", "zh": "演唱會不只靠歌手。技術人員測試麥克風，清潔人員整理場地，引導員帶觀眾入場。這些例子凸顯團隊合作的重要。大眾目光可能集中在一位表演者身上，成功卻仰賴許多人的貢獻。"}]}, {"word": "tentative", "meanings": ["暫定的"], "pos": ["Adj"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P103", "title": "博物館裡的空白標籤", "blank": 5, "level": 5, "type": "尚待確認", "evidence": "The team therefore kept the label tentative.", "why": "多工坊使用記號，標籤應 tentative。", "en": "A small museum received a wooden box from a local family. No document explained its origin. The donors believed it had belonged to a traveling merchant, but this account came from a story repeated over several generations. The curator did not reject the story; she simply distinguished it from a verified fact. She examined the box and found a mark that resembled a maker's symbol in an old catalog. The similarity offered a useful clue, not a complete answer. A later search revealed that several workshops had used comparable marks. The team therefore kept the label tentative. Instead of inventing a precise date, it explained what was known and what remained uncertain. Some visitors found the incomplete story frustrating. Others appreciated being invited into the process of investigation. The museum added a display describing how evidence is compared and claims are revised. Months later, a visitor supplied a photograph showing a similar box in a shop. This new material did not solve every question, but it helped narrow the search. The exhibit ultimately became less about a single object's mystery and more about the responsibility of presenting knowledge honestly.", "zh": "小博物館收到當地家庭捐贈的木盒，沒有文件交代來源。捐贈者相信它曾屬旅行商人，但說法來自世代口傳。館員沒有否定故事，只把它與核實事實分開。她找到似乎與舊型錄製作者符號相近的記號。相似性是有用線索，而非完整答案。後來查出多間工坊用相近記號，因此標籤保持暫定。館方不編造精確日期，而說明已知與未知。部分訪客感到挫折，另一些欣賞能參與調查過程。館方加設展示，說明如何比較證據與修正主張。數月後，訪客提供商店中相似盒子的照片。新資料未解決一切，但縮小搜尋範圍。展覽最後更關乎誠實呈現知識的責任，而不只是一件物品的謎。"}]}, {"word": "tested", "meanings": ["測試"], "pos": ["V-en"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P102", "title": "城市夜色中的昆蟲", "blank": 6, "level": 5, "type": "推論", "evidence": "Even so, the findings applied only to the conditions they had tested.", "why": "only 限制至已 tested 的條件。", "en": "When a city replaced its streetlights, residents welcomed the brighter roads. A biology teacher asked a different question: how would the change affect insects? Her students placed observation sheets near several lamps and counted visits at fixed times. To keep the comparison fair, they used the same procedure at every location. They found more insects around some lamps than others. This difference was interesting, but its cause was not immediately clear. The locations also varied in temperature and nearby vegetation. The teacher therefore reminded the class that a pattern was not automatically an explanation. During a second trial, the students compared two lamp types in the same area. Their new records provided stronger evidence about the role of light. Even so, the findings applied only to the conditions they had tested. The class resisted the temptation to claim that one lamp was best everywhere. In their report, they described both the results and the limitations. The city agreed to consider a smaller trial rather than replace every light at once. For the students, the most valuable lesson was not a simple answer but a more careful way of asking questions. Scientific inquiry, they learned, depends on adjusting claims to match what observations actually support.", "zh": "城市更換路燈時，居民歡迎更明亮道路。生物老師問：改變如何影響昆蟲？學生在幾座燈旁設觀察表，固定時間計數到訪。為公平比較，各處程序一致。他們發現某些燈邊昆蟲更多，差異有趣，原因卻未明：各地溫度、植被也不同。老師提醒模式不自動等於解釋。第二次試驗在同區比較兩款燈，新紀錄提供更強證據。不過發現只適用受測條件。學生避免宣稱某款燈處處最佳，報告同時說明結果與限制。市府同意先做較小試辦，不一次換掉所有燈。學生最有價值的收穫不是簡單答案，而是更審慎提問。科學探究需調整主張，使之符合觀察實際能支持的範圍。"}]}, {"word": "that", "meanings": ["那些／關係代名詞"], "pos": ["Pron"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P095", "title": "被風打倒的樹", "blank": 2, "level": 2, "type": "句法判斷", "evidence": "Workers removed branches that might fall on visitors.", "why": "先行詞 branches 已存在，that 引導修飾子句；what 不能再接既有先行詞。", "en": "The tree damaged by the storm stood beside a busy path. Workers removed branches that might fall on visitors. After the area was cleared, the park reopened to the public.", "zh": "受暴風雨損傷的樹立在繁忙步道旁。工人移除可能掉落砸到遊客的枝條。區域清理後，公園重新開放。"}]}, {"word": "them", "meanings": ["它們"], "pos": ["Pron"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P012", "title": "河流巡守", "blank": 1, "level": 4, "type": "指涉連貫", "evidence": "The volunteers mapped two streams before testing them for pollution.", "why": "them 回指 two streams；單數 it 不合。", "en": "The volunteers mapped two streams before testing them for pollution. One was clean; the other contained waste from a workshop. The owner agreed to stop the discharge. This decision allowed fish to return to the polluted stream.", "zh": "志工先畫出兩條溪流的位置，再檢測它們的污染。一條乾淨，另一條有工坊排出的廢水。業主同意停止排放。這項決定讓魚回到受污染的溪流。"}]}, {"word": "theme", "meanings": ["主題"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P114", "title": "留住一座市場的理由", "blank": 5, "level": 4, "type": "全文主題", "evidence": "A summary focused only on decoration would miss the broader theme.", "why": "broader theme 概括保留市場的社會理由。", "en": "Visitors photographed the old market's colorful signs. Residents, however, valued more than its appearance. Vendors remembered customers' names, neighbors exchanged news, and newcomers learned local customs. These details reveal the market's social role. The article's central concern is the preservation of community connections. Architecture provides the setting, but relationships give the place its meaning. A summary focused only on decoration would miss the broader theme.", "zh": "遊客拍攝老市場彩色招牌，但居民看重的不只是外觀。攤販記得客人姓名，鄰居交換消息，新居民學習地方習俗。細節揭示市場的社會角色。文章關心保存社區連結；建築提供場域，人際關係賦予意義。只談裝飾的摘要會錯失更廣主題。"}]}, {"word": "then", "meanings": ["接著"], "pos": ["Adv"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P020", "title": "劇場復原", "blank": 2, "level": 3, "type": "時間線", "evidence": "They first replaced the roof and then restored the seats.", "why": "first 與 then 標示施工順序。", "en": "The theater had been closed for a decade before volunteers began repairs. They first replaced the roof and then restored the seats. By the time the doors reopened, the team had completed every safety check.", "zh": "劇院在志工開始修繕前已關閉十年。他們先換屋頂，再修復座椅。大門重新開啟時，團隊已完成每項安全檢查。"}]}, {"word": "Therefore", "meanings": ["因此"], "pos": ["Adv"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P014", "title": "遮陽實驗", "blank": 1, "level": 3, "type": "句間邏輯", "evidence": "Therefore, the school expanded the trial.", "why": "擴大試驗是降溫效果的結果，不只是同時發生的 Meanwhile。", "en": "Two classrooms received the same amount of sunlight. One installed external shades; the other did not. The shaded room stayed cooler. Therefore, the school expanded the trial. Nevertheless, it kept temperature records because one week of data was insufficient.", "zh": "兩間教室日照量相同，其中一間裝外遮陽，另一間沒有。裝遮陽的教室較涼。因此學校擴大試驗。不過，學校仍持續記錄溫度，因為一週資料並不足夠。"}]}, {"word": "these", "meanings": ["這些"], "pos": ["Det"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P010", "title": "蝙蝠的服務", "blank": 1, "level": 2, "type": "指涉連貫", "evidence": "Researchers explained that these animals eat insects that damage crops.", "why": "these animals 回指複數 bats；this 不能修飾複數 animals。", "en": "Farmers once feared the bats near their fields. Researchers explained that these animals eat insects that damage crops. This natural pest control reduces the need for chemicals. Its economic value has led farmers to protect the bats and their habitats.", "zh": "農民原本害怕田邊的蝙蝠。研究者說明這些動物會吃危害作物的昆蟲。這種天然病蟲害防治減少化學藥劑需求。它的經濟價值促使農民保護蝙蝠及其棲地。"}]}, {"word": "timing", "meanings": ["發生時間"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P042", "title": "腳印與雨水", "blank": 3, "level": 5, "type": "推論", "evidence": "They support a limited claim about the timing of a visit.", "why": "雨提供時間界線 timing，沒有提供造訪 intention。", "en": "Investigators found footprints on a path that had been smooth after last night's rain. Someone must have used it since the rain stopped. The prints alone cannot reveal the person's identity. They support a limited claim about the timing of a visit.", "zh": "調查者在步道發現腳印，而昨夜雨後路面原本平整。一定有人在雨停後走過。單靠腳印不能揭露身分，只能支持到訪時間的有限判斷。"}]}, {"word": "transcripts", "meanings": ["逐字稿"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P110", "title": "口述故事的保存", "blank": 2, "level": 3, "type": "句間銜接", "evidence": "The spoken material was then turned into written transcripts.", "why": "spoken 轉 written，成果為 transcripts。", "en": "The team recorded memories of a closed railway station. These interviews captured details missing from official records. The spoken material was then turned into written transcripts. This conversion made the stories easier to search. To preserve the speakers' voices as well, the archive also kept the original recordings. Together, the two formats offered complementary ways to explore the past.", "zh": "團隊錄下人們對已關閉車站的回憶。訪談捕捉官方紀錄缺少的細節，口述材料再轉成逐字稿。這種轉換讓故事更容易搜尋。為同時保留受訪者聲音，檔案館也留下原錄音。兩種格式提供互補的歷史探索方式。"}]}, {"word": "trend", "meanings": ["趨勢"], "pos": ["N"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P074", "title": "鹽分的累積", "blank": 3, "level": 3, "type": "上下文方向", "evidence": "Farmers needed to reverse this trend before the soil became unusable.", "why": "reverse this trend 指扭轉前述惡化走向。", "en": "For years, poor drainage trapped irrigation water in the field. As the water evaporated, salt levels increased. Crop yields then fell. Farmers needed to reverse this trend before the soil became unusable.", "zh": "多年來排水不良使灌溉水滯留。水蒸發後，鹽分濃度增加，作物產量隨後下降。農民必須在土壤無法使用前扭轉趨勢。"}]}, {"word": "uncertain", "meanings": ["不確定的"], "pos": ["Adj"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P099", "title": "換文後再觀察", "blank": 3, "level": 5, "type": "尚待確認", "evidence": "If the evidence remained weak, the result stayed uncertain.", "why": "if evidence weak 則 uncertain；不能因第二次錯就改成 certain。", "en": "In a new passage, the learner again missed a contrast clue. This repeated pattern justified closer review, but not an automatic label. The teacher discussed the student's reasoning before confirming a category. If the evidence remained weak, the result stayed uncertain.", "zh": "在新文章中，學生再次漏看轉折線索。重複模式值得進一步檢視，但不宜自動貼標籤。老師先討論作答推理，再確認類別。若證據仍弱，結果維持不確定。"}, {"pid": "P103", "title": "博物館裡的空白標籤", "blank": 6, "level": 5, "type": "尚待確認", "evidence": "Instead of inventing a precise date, it explained what was known and what remained uncertain.", "why": "known and uncertain 對照已知與未定。", "en": "A small museum received a wooden box from a local family. No document explained its origin. The donors believed it had belonged to a traveling merchant, but this account came from a story repeated over several generations. The curator did not reject the story; she simply distinguished it from a verified fact. She examined the box and found a mark that resembled a maker's symbol in an old catalog. The similarity offered a useful clue, not a complete answer. A later search revealed that several workshops had used comparable marks. The team therefore kept the label tentative. Instead of inventing a precise date, it explained what was known and what remained uncertain. Some visitors found the incomplete story frustrating. Others appreciated being invited into the process of investigation. The museum added a display describing how evidence is compared and claims are revised. Months later, a visitor supplied a photograph showing a similar box in a shop. This new material did not solve every question, but it helped narrow the search. The exhibit ultimately became less about a single object's mystery and more about the responsibility of presenting knowledge honestly.", "zh": "小博物館收到當地家庭捐贈的木盒，沒有文件交代來源。捐贈者相信它曾屬旅行商人，但說法來自世代口傳。館員沒有否定故事，只把它與核實事實分開。她找到似乎與舊型錄製作者符號相近的記號。相似性是有用線索，而非完整答案。後來查出多間工坊用相近記號，因此標籤保持暫定。館方不編造精確日期，而說明已知與未知。部分訪客感到挫折，另一些欣賞能參與調查過程。館方加設展示，說明如何比較證據與修正主張。數月後，訪客提供商店中相似盒子的照片。新資料未解決一切，但縮小搜尋範圍。展覽最後更關乎誠實呈現知識的責任，而不只是一件物品的謎。"}]}, {"word": "uncertainty", "meanings": ["不確定感"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P112", "title": "新設的修鞋攤", "blank": 4, "level": 3, "type": "新舊資訊", "evidence": "Once people understood the process, their initial uncertainty faded.", "why": "unfamiliar 對應初始 uncertainty；不能把不熟悉解作 certainty。", "en": "A cobbler opened a stall near the station. The business was unfamiliar to many younger residents. To introduce the service, she displayed a damaged boot beside its repaired counterpart. This comparison showed what customers could expect. Once people understood the process, their initial uncertainty faded. The stall gradually developed a regular clientele.", "zh": "一位修鞋師在車站旁設攤。許多年輕居民不熟悉這門生意。她把一隻壞靴和修好的對應靴並列以介紹服務。比較讓顧客看見預期成果。理解流程後，起初的不確定逐漸消退，攤位也建立固定客群。"}]}, {"word": "unconvinced", "meanings": ["未被說服的"], "pos": ["Adj"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P038", "title": "公園改建評論", "blank": 3, "level": 4, "type": "作者態度", "evidence": "The quoted praise belongs to the developers, not to the writer, who remains unconvinced.", "why": "要求替代方案表示 unconvinced，和 current proposal 的批評一致。", "en": "Developers call the plan a great improvement. The writer, however, questions why mature trees must be removed and demands a less damaging alternative. Her attitude toward the current proposal is critical. The quoted praise belongs to the developers, not to the writer, who remains unconvinced.", "zh": "開發者稱計畫為重大改善。然而作者質疑為何必須移除成熟樹木，並要求損害更小的替代方案。她對現有提案持批判態度。引述的稱讚屬於開發者，不是仍未被說服的作者。"}]}, {"word": "understand", "meanings": ["理解"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P092", "title": "找回聲音", "blank": 2, "level": 3, "type": "語意判斷", "evidence": "People at the back could finally understand the instructions.", "why": "people 是理解指示的主體，understand 合乎角色。", "en": "After the loudspeaker failed, the guide used a portable amplifier to project her voice. People at the back could finally understand the instructions. Clear communication helped prevent confusion during the evacuation drill.", "zh": "擴音設備故障後，嚮導用攜帶式擴音器把聲音傳遠。後方的人終於聽懂指示。清楚溝通有助防止疏散演練中的混亂。"}]}, {"word": "understanding", "meanings": ["理解"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P029", "title": "慢速旅行", "blank": 3, "level": 4, "type": "全文主題", "evidence": "For her, travel is less about collecting destinations than about gaining local understanding.", "why": "接觸居民帶來 understanding；ignorance 與整篇方向相反。", "en": "The writer walks through small towns instead of rushing between landmarks. She talks with shopkeepers and returns to the same café. Her journey emphasizes connection over speed. For her, travel is less about collecting destinations than about gaining local understanding.", "zh": "作者步行穿過小鎮，不急著趕景點。她與店主聊天，重訪同一家咖啡館。旅程重視連結勝過速度。對她來說，旅行較不在於蒐集目的地，而在於深入理解地方。"}]}, {"word": "universal", "meanings": ["普遍的"], "pos": ["Adj"], "tags": ["Logic", "Semantics", "Grammar", "Collocation", "Cohesion", "Global", "POS"], "examples": [{"pid": "P104", "title": "校園新聞的查證", "blank": 7, "level": 5, "type": "作用範圍", "evidence": "The editors welcomed this response but did not call it universal.", "why": "some 與 fraction 限制成果非 universal。", "en": "An image of a locked gate spread through the school chat group. Its caption claimed that the library would close permanently. Many students forwarded it before checking the date. The student newspaper decided to verify the message. First, reporters located the original image. It had been taken during repairs two years earlier. Next, they contacted the librarian, who explained that the current closure would last only one afternoon. The image itself was real, but its new context made it misleading. The team published a correction and included links to the relevant notices. They avoided accusing individual students of deliberate dishonesty because careless sharing did not prove intent. Instead, the article described a simple checking procedure: locate the source, inspect the date, and compare the claim with current information. A follow-up survey found that some readers had changed their sharing habits. The editors welcomed this response but did not call it universal. Only a fraction of students had answered. The final article therefore balanced a positive outcome with a clear statement of its limits. Responsible reporting, it argued, requires the same standards when describing one's own success as when investigating someone else's story. Accuracy is a continuing practice, not a badge earned once.", "zh": "一張上鎖校門照片在校群傳播，圖說宣稱圖書館永久關閉。許多人未查日期便轉傳。校刊決定查證，先找原圖，發現拍於兩年前修繕期間；再聯絡館員，得知本次只關一下午。照片真實，新脈絡卻使它誤導。團隊刊更正並附公告連結，避免指控個別學生蓄意不誠實，因為粗心分享不等於證明意圖。文章介紹查核程序：找來源、查日期、與當前資訊比對。後續調查發現部分讀者改變分享習慣。編輯肯定成果，卻不稱人人都如此，因只有小部分學生作答。文章因此平衡正面成果與清楚限制，主張描述自身成功和調查他人故事應用相同標準。準確是持續實踐，而非一次取得的徽章。"}]}, {"word": "unnoticed", "meanings": ["未被察覺的"], "pos": ["Adj"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P129", "title": "漏水修好以後", "blank": 5, "level": 3, "type": "上下文方向", "evidence": "Still, she continued checking the meter so that another leak would not go unnoticed.", "why": "continue checking 為防漏水 unnoticed，不是說漏水已不存在。", "en": "A hidden pipe had been wasting water for months. After repairs, daily consumption dropped. The monthly bill became lower, even though the number of residents stayed the same. This change reduced pressure on the building's budget. The manager viewed the result as positive. Still, she continued checking the meter so that another leak would not go unnoticed.", "zh": "暗管漏水數月。修好後日用水量下降，即使住戶數相同，月費也降低。改變減輕大樓預算壓力，管理者視為正面成果。她仍查水表，避免另一次漏水未被察覺。"}]}, {"word": "unobserved", "meanings": ["未被觀察的"], "pos": ["Adj"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P118", "title": "夜間足跡的限度", "blank": 3, "level": 4, "type": "推論", "evidence": "Other animals may have used the area unobserved.", "why": "鏡頭未涵蓋整岸，其他動物可能 unobserved。", "en": "Fresh tracks appeared near a pond after a snowy evening. A camera recorded a fox passing at midnight, but it did not cover the entire shore. The image establishes the fox's presence. It does not prove that the fox made all the tracks. Other animals may have used the area unobserved. The investigator therefore described the fox as a possible source. Identifying every footprint would require additional evidence.", "zh": "雪夜後，池邊有新足跡。攝影機拍到狐狸午夜經過，但未涵蓋整岸。影像確立狐狸曾在場，不能證明所有足跡都是牠留下。其他動物可能在未被觀察時使用該處。因此調查者稱狐狸為可能來源；辨認每個腳印仍需更多證據。"}]}, {"word": "unseen", "meanings": ["未被看見的"], "pos": ["Adj"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P089", "title": "看不見的墨水", "blank": 3, "level": 2, "type": "構詞判斷", "evidence": "The activity showed that something unseen may still be present.", "why": "unseen 與 still present 區分未見和不存在。", "en": "The ink was initially invisible on the white paper. Gentle heat made the writing appear. Students could then decode the message by replacing each symbol with a letter. The activity showed that something unseen may still be present.", "zh": "墨水起初在白紙上看不見，輕微加熱後字跡出現。學生再把符號替換成字母以解碼。活動顯示看不見的事物仍可能存在。"}]}, {"word": "use", "meanings": ["使用"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P006", "title": "夜間公車", "blank": 2, "level": 4, "type": "文法骨架", "evidence": "Workers who finish late use it regularly.", "why": "who finish late 修飾複數 Workers；use 才是主句動詞。", "en": "The new bus route, requested by residents for years, connects the station with the hospital. Workers who finish late use it regularly. The change in the timetable has made their journeys safer.", "zh": "居民要求多年的新公車路線連接車站與醫院。晚下班的工作者固定搭乘。時刻表的改變使他們的通勤更安全。"}]}, {"word": "useful", "meanings": ["有用的"], "pos": ["Adj"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P025", "title": "問卷的邊界", "blank": 2, "level": 2, "type": "作用範圍", "evidence": "The results may be useful for planning a small trial, but they cannot justify a claim about the entire school.", "why": "may be…for planning a small trial 保留局部用途，不能推為 useless。", "en": "Only twenty students answered the survey. Their replies describe some students' preferences, not everyone's. The results may be useful for planning a small trial, but they cannot justify a claim about the entire school.", "zh": "只有二十位學生填問卷。回覆描述的是部分學生的偏好，不是每個人。結果可能對規劃小型試辦有用，但不能用來宣稱全校都如此。"}]}, {"word": "valuable", "meanings": ["有價值的"], "pos": ["Adj"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P105", "title": "校園堆肥的改變", "blank": 2, "level": 2, "type": "詞形", "evidence": "A teacher explained how food scraps could become valuable material for the garden.", "why": "material 前用 valuable 說明材料的價值。", "en": "The school began collecting fruit peels for compost. At first, students showed little interest in the project. A teacher explained how food scraps could become valuable material for the garden. After seeing the results, students separated their waste more carefully. The amount sent to the landfill fell considerably. What began as a small experiment became a successful part of daily school life.", "zh": "學校開始收集果皮製作堆肥。起初學生對計畫興趣不大。老師解釋廚餘如何成為花園的珍貴材料。看到成果後，學生更仔細分類垃圾，送往掩埋場的量大幅減少。小實驗成了校園日常中成功的一環。"}]}, {"word": "value", "meanings": ["價值"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P010", "title": "蝙蝠的服務", "blank": 2, "level": 2, "type": "指涉連貫", "evidence": "Its economic value has led farmers to protect the bats and their habitats.", "why": "Its 回指 pest control，其經濟價值促成保護行動。", "en": "Farmers once feared the bats near their fields. Researchers explained that these animals eat insects that damage crops. This natural pest control reduces the need for chemicals. Its economic value has led farmers to protect the bats and their habitats.", "zh": "農民原本害怕田邊的蝙蝠。研究者說明這些動物會吃危害作物的昆蟲。這種天然病蟲害防治減少化學藥劑需求。它的經濟價值促使農民保護蝙蝠及其棲地。"}]}, {"word": "variety", "meanings": ["多樣種類"], "pos": ["N"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P001", "title": "校園花園", "blank": 1, "level": 1, "type": "詞形", "evidence": "A variety of vegetables now grows there.", "why": "a variety of 是名詞片語；various 不能直接放在 a 與 of 之間。", "en": "Our school turned an empty yard into a garden. A variety of vegetables now grows there. Students are actively involved in watering them, and their interest in science has grown significantly.", "zh": "學校把空院子改成花園，現在裡面種著各式蔬菜。學生積極參與澆水，他們對科學的興趣也顯著提升。"}]}, {"word": "verification", "meanings": ["驗證"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P137", "title": "兩次錯誤之間", "blank": 5, "level": 4, "type": "尚待確認", "evidence": "Another unfamiliar passage would provide an opportunity for verification.", "why": "另一陌生篇提供 verification 的機會，不保證一定獲得 certainty。", "en": "A learner missed a grammar clue on Monday and a similar clue on Friday. The repetition deserved attention, but the teacher still asked how each answer had been chosen. One error came from a hurried guess; the other involved a misunderstood sentence. The explanations were not identical. The teacher recorded the evidence before making a classification. When the cause remained unclear, she kept the diagnosis provisional. Another unfamiliar passage would provide an opportunity for verification.", "zh": "學生週一漏看文法線索，週五又漏看相似線索。重複值得注意，但老師仍問每次如何作答。一錯來自急著猜，另一錯是誤解句子，理由不相同。老師先記錄證據再分類。原因未明時，診斷保持暫定；另一篇陌生文章提供驗證機會。"}]}, {"word": "verify", "meanings": ["查證"], "pos": ["V"], "tags": ["Logic", "Semantics", "Grammar", "Collocation", "Cohesion", "Global", "POS"], "examples": [{"pid": "P104", "title": "校園新聞的查證", "blank": 2, "level": 5, "type": "作用範圍", "evidence": "The student newspaper decided to verify the message.", "why": "後文找原圖、問館員屬 verify。", "en": "An image of a locked gate spread through the school chat group. Its caption claimed that the library would close permanently. Many students forwarded it before checking the date. The student newspaper decided to verify the message. First, reporters located the o
