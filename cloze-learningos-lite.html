es.", "zh": "感測器每分鐘記錄溫度。如此頻繁的測量有助於栽種者發現突變。他們需要精確讀值，因為兩度誤差就可能傷害幼苗。備用電池讓感測器在停電時仍能運作。"}]}, {"word": "frustration", "meanings": ["挫折／不滿"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P086", "title": "引號中的準時", "blank": 3, "level": 3, "type": "語氣／含意", "evidence": "The remark expresses frustration, not genuine approval.", "why": "晚40分鐘又 muttered，支持 frustration；非 gratitude。", "en": "The bus arrived forty minutes late. \"Perfectly punctual, as usual,\" a passenger muttered. The mismatch between words and events signals irony. The remark expresses frustration, not genuine approval.", "zh": "公車晚了四十分鐘。一位乘客低聲說：「一如往常，真準時。」言語與事件的落差表示反諷。這話表達挫折與不滿，而非真心贊同。"}]}, {"word": "further", "meanings": ["進一步的"], "pos": ["Adj"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P043", "title": "仍待改善的市場", "blank": 2, "level": 3, "type": "全文一致", "evidence": "The final paragraph calls for further action, keeping the conclusion consistent with the remaining challenge.", "why": "尚有問題，所以需要 further action。", "en": "The market reduced plastic bags but still used disposable food boxes. Its waste problem was therefore only partly solved. The final paragraph calls for further action, keeping the conclusion consistent with the remaining challenge.", "zh": "市場減少塑膠袋，卻仍使用一次性餐盒。因此垃圾問題只解決一部分。末段要求進一步行動，讓結論與仍存在的挑戰保持一致。"}]}, {"word": "gain", "meanings": ["獲得"], "pos": ["V"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P081", "title": "拍照留念", "blank": 3, "level": 4, "type": "中文直譯", "evidence": "The exchange helped them gain a deeper understanding of the work.", "why": "gain an understanding 表加深理解，不用競爭義 win。", "en": "At the village, students asked permission to take photographs of local crafts. They then kept in touch with the makers by email. The exchange helped them gain a deeper understanding of the work.", "zh": "在村莊裡，學生先徵求同意再拍當地工藝品的照片。之後他們以電子郵件和製作者保持聯絡。交流幫他們對工藝有更深理解。"}]}, {"word": "garment", "meanings": ["衣物"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P135", "title": "讓舊衣延長壽命", "blank": 5, "level": 3, "type": "語意判斷", "evidence": "The work turned a possible discard into a usable garment.", "why": "coat 是 garment，回扣物件語意類別。", "en": "A tailor examined the coat before deciding how to repair it. The lining was torn, but the outer fabric remained intact. Replacing only the damaged layer would preserve the coat's useful parts. The customer agreed because she wanted to extend its life. The work turned a possible discard into a usable garment.", "zh": "裁縫檢查外套再決定如何修補。內裡破了，但外層布仍完整。只換壞層可保留可用部分。顧客同意，因她想延長衣服壽命。修補讓原本可能被丟的衣物重新可穿。"}]}, {"word": "give", "meanings": ["給予"], "pos": ["V"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P131", "title": "把中文想法換成英文", "blank": 2, "level": 3, "type": "中文直譯", "evidence": "They wanted to give people a hand without creating extra waste.", "why": "give people a hand 表幫忙，不是字面送手。", "en": "To prepare the charity sale, students had to make arrangements with local shops. They wanted to give people a hand without creating extra waste. One shop agreed to offer reusable bags at cost. Students would also take care of the tables after the event. Their teacher reminded them that helping the community meant putting ideas into practice, not merely discussing them.", "zh": "學生為準備義賣，需與店家協調安排，希望幫助人又不增加垃圾。一家店同意以成本價供應可重用袋。學生也會在活動後整理照管桌子。老師提醒幫助社區是把想法付諸實踐，不只是討論。"}]}, {"word": "grab", "meanings": ["隨意去吃／抓取"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P084", "title": "朋友的簡訊", "blank": 1, "level": 4, "type": "語域不合", "evidence": "In a text to a close friend, Eli wrote, \"Want to grab lunch after class?\" The casual invitation matched their familiar relationship.", "why": "grab lunch 是朋友間自然口語；procure lunch 太正式且偏取得食物。", "en": "In a text to a close friend, Eli wrote, \"Want to grab lunch after class?\" The casual invitation matched their familiar relationship. A phrase like \"request your attendance\" would sound unnecessarily stiff in that exchange.", "zh": "伊萊傳簡訊給好友：「下課要不要去吃午餐？」隨性的邀請符合熟識關係。「請求您出席」在這次互動中會顯得過度拘謹。"}]}, {"word": "gradually", "meanings": ["逐漸地"], "pos": ["Adv"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P075", "title": "信任的重建", "blank": 3, "level": 4, "type": "上下文方向", "evidence": "Over time, transparent reporting helped restore trust, though full confidence returned only gradually.", "why": "over time 與 only 表慢慢恢復，gradually。", "en": "After a misleading advertisement, customers became skeptical of the company. It responded by publishing independent test results. Over time, transparent reporting helped restore trust, though full confidence returned only gradually.", "zh": "誤導廣告之後，顧客對公司起疑。公司以公布獨立測試結果回應。透明報告逐漸幫助恢復信任，但完整信心只慢慢回來。"}]}, {"word": "guarantee", "meanings": ["保證"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P064", "title": "值得花費的價格", "blank": 3, "level": 2, "type": "近義詞混淆", "evidence": "A high price does not always guarantee durability.", "why": "does not always guarantee 表高價不必然保證耐久。", "en": "The jacket was expensive, but its price was not the only concern. Students also asked whether the fabric would last through several winters. A high price does not always guarantee durability.", "zh": "外套很昂貴，但價格不是唯一考量。學生也問布料是否能耐用好幾個冬天。高價不一定保證耐久。"}]}, {"word": "guess", "meanings": ["猜測"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P098", "title": "猜對不等於理解", "blank": 1, "level": 4, "type": "尚待確認", "evidence": "One identified a clear clue; the other admitted it was a guess.", "why": "admitted 對比 clear clue，guess 表無據選擇；不是 proof。", "en": "Two students selected the correct word. One identified a clear clue; the other admitted it was a guess. Their scores matched, but their reasoning was different. The teacher therefore avoided making the same judgment about both learners.", "zh": "兩名學生選對單字，一人找出清楚線索，另一人承認是猜的。分數相同，推理卻不同。因此老師避免對兩人的理解做相同判斷。"}]}, {"word": "guides", "meanings": ["引導"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P004", "title": "圖書館導師", "blank": 2, "level": 2, "type": "文法骨架", "evidence": "Each volunteer guides a small group.", "why": "Each volunteer 是單數主詞，guides 表帶領小組。", "en": "The reading program, which began last spring, enables children to borrow books without paying a fee. Each volunteer guides a small group. The stories selected by the librarian remain available online after the meetings.", "zh": "去年春天開始的閱讀計畫讓孩子免費借書。每位志工帶領一個小組。館員挑選的故事在聚會後仍可在線上閱讀。"}]}, {"word": "habitats", "meanings": ["棲地"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P010", "title": "蝙蝠的服務", "blank": 3, "level": 2, "type": "指涉連貫", "evidence": "Its economic value has led farmers to protect the bats and their habitats.", "why": "their 指 bats，保護棲地能保護牠們；保護牠們的掠食者不符合此因果。", "en": "Farmers once feared the bats near their fields. Researchers explained that these animals eat insects that damage crops. This natural pest control reduces the need for chemicals. Its economic value has led farmers to protect the bats and their habitats.", "zh": "農民原本害怕田邊的蝙蝠。研究者說明這些動物會吃危害作物的昆蟲。這種天然病蟲害防治減少化學藥劑需求。它的經濟價值促使農民保護蝙蝠及其棲地。"}]}, {"word": "has", "meanings": ["已經〔完成式助動詞〕"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P006", "title": "夜間公車", "blank": 3, "level": 4, "type": "文法骨架", "evidence": "The change in the timetable has made their journeys safer.", "why": "主詞核心是單數 change，故用 has made；不是看附近的 timetable 或 journeys。", "en": "The new bus route, requested by residents for years, connects the station with the hospital. Workers who finish late use it regularly. The change in the timetable has made their journeys safer.", "zh": "居民要求多年的新公車路線連接車站與醫院。晚下班的工作者固定搭乘。時刻表的改變使他們的通勤更安全。"}]}, {"word": "hear", "meanings": ["聽到"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P066", "title": "聽見與傾聽", "blank": 1, "level": 4, "type": "近義詞混淆", "evidence": "From her room, Mei could hear music in the courtyard even with the window closed.", "why": "could hear 指感官接收到音樂；hearing 是名詞或分詞，不能接在 could 後作原形動詞。", "en": "From her room, Mei could hear music in the courtyard even with the window closed. She opened it to listen carefully to the melody. The sound gradually became fainter as the musicians walked away.", "zh": "即使窗戶關著，美在房裡仍聽得到院子音樂。她開窗仔細聆聽旋律。樂手走遠時，聲音逐漸變微弱。"}]}, {"word": "heavily", "meanings": ["大量地"], "pos": ["Adv"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P059", "title": "城市的影響", "blank": 3, "level": 2, "type": "介系詞搭配", "evidence": "A school therefore invested heavily in soundproof windows to reduce the disturbance.", "why": "invest heavily in 是大量投資，副詞修飾 invested。", "en": "Noise can interfere with concentration. Children living near busy roads may be exposed to it for hours each day. A school therefore invested heavily in soundproof windows to reduce the disturbance.", "zh": "噪音可能干擾專注。住繁忙道路旁的孩子可能每天接觸噪音數小時。因此學校大量投資隔音窗以減少干擾。"}]}, {"word": "helped", "meanings": ["幫助了"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P106", "title": "走廊的溫度地圖", "blank": 5, "level": 3, "type": "文法骨架", "evidence": "These observations, together with maintenance records, helped the principal decide where to add fans.", "why": "These observations 是 helped 的主詞；together with… 為附加資訊。", "en": "The students, equipped with handheld sensors, measured temperatures around the school. A map of the readings revealed several hot spots. The corridor beside the kitchen, despite its open windows, was warmer than expected. Trees planted near the west wall provided shade in the afternoon. These observations, together with maintenance records, helped the principal decide where to add fans.", "zh": "學生帶著手持感測器測量校園溫度。讀值地圖顯示數個熱點。廚房旁走廊雖開著窗，仍比預期熱。西牆旁種的樹在午後提供遮蔭。這些觀察和維護紀錄協助校長決定增設風扇的位置。"}]}, {"word": "his", "meanings": ["他的〔所有代名詞〕"], "pos": ["Pron"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P011", "title": "共享工具箱", "blank": 1, "level": 3, "type": "指涉連貫", "evidence": "Mina lent her drill to Omar because his was broken.", "why": "his 替代 Omar's drill；her 不能單獨表示「她的電鑽」，且借用因果也不合。", "en": "Mina lent her drill to Omar because his was broken. He repaired a shelf and returned the borrowed tool the next day. This small exchange inspired them to create a shared toolbox. It now serves twelve households in their building.", "zh": "米娜把電鑽借給歐瑪，因為他的壞了。他修好架子，隔天歸還借來的工具。這次小小的交換啟發他們建立共享工具箱，目前服務大樓中的十二戶住家。"}]}, {"word": "households", "meanings": ["家庭／住戶"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P011", "title": "共享工具箱", "blank": 3, "level": 3, "type": "指涉連貫", "evidence": "It now serves twelve households in their building.", "why": "twelve 後用複數 households，指工具箱服務的住戶。", "en": "Mina lent her drill to Omar because his was broken. He repaired a shelf and returned the borrowed tool the next day. This small exchange inspired them to create a shared toolbox. It now serves twelve households in their building.", "zh": "米娜把電鑽借給歐瑪，因為他的壞了。他修好架子，隔天歸還借來的工具。這次小小的交換啟發他們建立共享工具箱，目前服務大樓中的十二戶住家。"}]}, {"word": "However", "meanings": ["然而"], "pos": ["Adv"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P013", "title": "手機禁用日", "blank": 1, "level": 2, "type": "句間邏輯", "evidence": "However, they ended up talking more than usual.", "why": "預期無聊與實際交談更多相反，需 However；Similarly 無法表達反差。", "en": "Students expected a phone-free lunch to be boring. However, they ended up talking more than usual. Several discovered shared interests. Consequently, the class decided to repeat the experiment; moreover, another class asked to join.", "zh": "學生原以為不用手機的午餐會很無聊。然而，他們說的話反而比平常多，有些人發現共同興趣。因此，班上決定再試一次；此外，另一班也想加入。"}, {"pid": "P015", "title": "紙本與電子書", "blank": 1, "level": 4, "type": "句間邏輯", "evidence": "Printed books, however, do not need batteries.", "why": "電子書與紙本各有不同優點，however 轉換比較面向；紙本不用電池不是電子書易攜的結果。", "en": "Electronic books are easy to carry. Printed books, however, do not need batteries. Neither format is best in every situation. Instead, readers should choose according to their needs. For travelers, for example, luggage weight may matter most.", "zh": "電子書方便攜帶，然而紙本書不需電池。沒有一種形式適合所有情況。讀者應改為依需求選擇。例如，對旅人而言，行李重量可能最重要。"}, {"pid": "P109", "title": "午休的短暫步行", "blank": 2, "level": 4, "type": "句間邏輯", "evidence": "However, she noticed that heavy rain made outdoor walks impractical.", "why": "先有益處，再提雨天限制，However 為轉折。", "en": "A class expected a short walk after lunch to waste study time. Instead, many students returned feeling more alert. The teacher repeated the activity for a week. However, she noticed that heavy rain made outdoor walks impractical. She therefore offered an indoor route as an alternative. The class kept both options, because the aim was movement rather than a particular location. The final plan was flexible rather than rigid.", "zh": "班上原以為午餐後散步浪費讀書時間，實際卻有許多學生精神更好。老師重複活動一週，但發現大雨使戶外步行難以實行。因此她提供室內路線作替代方案。兩種選項都保留，因為目標是活動身體而非限定地點。最後計畫有彈性而不僵化。"}]}, {"word": "identical", "meanings": ["相同的"], "pos": ["Adj"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P137", "title": "兩次錯誤之間", "blank": 2, "level": 4, "type": "尚待確認", "evidence": "The explanations were not identical.", "why": "猜題與誤解不同，not identical；不能把表面同錯當同因。", "en": "A learner missed a grammar clue on Monday and a similar clue on Friday. The repetition deserved attention, but the teacher still asked how each answer had been chosen. One error came from a hurried guess; the other involved a misunderstood sentence. The explanations were not identical. The teacher recorded the evidence before making a classification. When the cause remained unclear, she kept the diagnosis provisional. Another unfamiliar passage would provide an opportunity for verification.", "zh": "學生週一漏看文法線索，週五又漏看相似線索。重複值得注意，但老師仍問每次如何作答。一錯來自急著猜，另一錯是誤解句子，理由不相同。老師先記錄證據再分類。原因未明時，診斷保持暫定；另一篇陌生文章提供驗證機會。"}]}, {"word": "identity", "meanings": ["身分"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P042", "title": "腳印與雨水", "blank": 2, "level": 5, "type": "推論", "evidence": "The prints alone cannot reveal the person's identity.", "why": "腳印只證有人經過，無法確定 identity。", "en": "Investigators found footprints on a path that had been smooth after last night's rain. Someone must have used it since the rain stopped. The prints alone cannot reveal the person's identity. They support a limited claim about the timing of a visit.", "zh": "調查者在步道發現腳印，而昨夜雨後路面原本平整。一定有人在雨停後走過。單靠腳印不能揭露身分，只能支持到訪時間的有限判斷。"}]}, {"word": "illustration", "meanings": ["例示"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P036", "title": "故事作為開場", "blank": 1, "level": 5, "type": "段落功能", "evidence": "The opening story functions as an illustration of the broader issue.", "why": "開場個案引出全市議題，功能是 illustration；結論應總結論述。", "en": "The article begins with a child struggling to cross a busy road. The next paragraphs examine pedestrian safety across the city. The opening story functions as an illustration of the broader issue. It draws readers' attention before the writer turns to statistical evidence.", "zh": "文章先寫一位孩子難以穿越繁忙道路，再檢視全市行人安全。開場故事是較廣泛議題的具體例示，先吸引讀者注意，作者接著轉向統計證據。"}]}, {"word": "improvement", "meanings": ["改善", "改進"], "pos": ["N"], "tags": ["Logic", "Semantics", "Global"], "examples": [{"pid": "P073", "title": "排隊縮短了", "blank": 3, "level": 2, "type": "上下文方向", "evidence": "The staff viewed these changes as an improvement, although busy days remained difficult.", "why": "remaining difficult 是保留，不抹除整體 improvement。", "en": "The clinic introduced appointments to reduce waiting. Average queues became shorter, and complaints declined. The staff viewed these changes as an improvement, although busy days remained difficult.", "zh": "診所導入預約以減少等待。平均隊伍變短，抱怨減少。工作人員將變化視為改善，儘管忙碌日子仍有困難。"}, {"pid": "P117", "title": "一篇有保留的展覽評論", "blank": 5, "level": 4, "type": "作者態度", "evidence": "Her criticism expressed a desire for improvement, rather than a demand to close the show.", "why": "改進建議反映 improvement，不等於主張取消展覽。", "en": "The critic admired the exhibition's ambitious topic but questioned its lack of local voices. She called the photographs powerful while describing the captions as incomplete. Her response was therefore mixed, not wholly negative. The word \"ambitious\" did not signal unconditional approval. Instead, she urged the museum to include more perspectives. Her criticism expressed a desire for improvement, rather than a demand to close the show.", "zh": "評論者欣賞展覽題目有企圖心，卻質疑缺乏地方聲音。她稱照片有力量，但說圖說不完整。因此態度是褒貶並存，不是全然負面。「有企圖心」不代表無條件贊同。她要求納入更多觀點，批評意在改進而非關展。"}]}, {"word": "improvements", "meanings": ["改良"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P033", "title": "一項發明的誕生", "blank": 2, "level": 5, "type": "文章組織", "evidence": "Failed tests appear before later improvements, helping readers understand how each problem shaped the next version.", "why": "失敗引出 later improvements，符合逐次發展。", "en": "The essay traces a filter from an early sketch to a working device. Its main organizing principle is chronology. Failed tests appear before later improvements, helping readers understand how each problem shaped the next version.", "zh": "文章追溯濾器從早期草圖到可運作裝置的歷程。主要組織原則是時間順序。失敗測試先於後來的改良，讓讀者明白每個問題如何形塑下一個版本。"}]}, {"word": "include", "meanings": ["納入"], "pos": ["V"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P117", "title": "一篇有保留的展覽評論", "blank": 4, "level": 4, "type": "作者態度", "evidence": "Instead, she urged the museum to include more perspectives.", "why": "缺少地方聲音故應 include；exclude 方向相反。", "en": "The critic admired the exhibition's ambitious topic but questioned its lack of local voices. She called the photographs powerful while describing the captions as incomplete. Her response was therefore mixed, not wholly negative. The word \"ambitious\" did not signal unconditional approval. Instead, she urged the museum to include more perspectives. Her criticism expressed a desire for improvement, rather than a demand to close the show.", "zh": "評論者欣賞展覽題目有企圖心，卻質疑缺乏地方聲音。她稱照片有力量，但說圖說不完整。因此態度是褒貶並存，不是全然負面。「有企圖心」不代表無條件贊同。她要求納入更多觀點，批評意在改進而非關展。"}]}, {"word": "incomplete", "meanings": ["不完整的"], "pos": ["Adj"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P124", "title": "為新生安排路線", "blank": 4, "level": 3, "type": "介系詞搭配", "evidence": "Their advice was based on incomplete personal experience, so they checked uncertain details.", "why": "based on 是基於；uncertain details 顯示個人經驗仍 incomplete，需查證補足。", "en": "The orientation team was responsible for guiding new students. Its map focused mainly on buildings used in the first week. Volunteers also responded to questions about transport. Their advice was based on incomplete personal experience, so they checked uncertain details. Students could then rely on the final guide for accurate directions.", "zh": "迎新團隊負責引導新生。地圖主要著重第一週使用的建築。志工也回應交通問題。建議基於不完整的個人經驗，因此會查證不確定細節。學生便能仰賴完成版指南獲得正確方向。"}]}, {"word": "increased", "meanings": ["增加"], "pos": ["V"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P074", "title": "鹽分的累積", "blank": 1, "level": 3, "type": "上下文方向", "evidence": "As the water evaporated, salt levels increased.", "why": "水蒸發留下鹽，濃度 increased；decreased 與累積機制相反。", "en": "For years, poor drainage trapped irrigation water in the field. As the water evaporated, salt levels increased. Crop yields then fell. Farmers needed to reverse this trend before the soil became unusable.", "zh": "多年來排水不良使灌溉水滯留。水蒸發後，鹽分濃度增加，作物產量隨後下降。農民必須在土壤無法使用前扭轉趨勢。"}]}, {"word": "indicate", "meanings": ["顯示"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P083", "title": "學術摘要", "blank": 2, "level": 3, "type": "語域不合", "evidence": "Its findings indicate a relationship between distance and transport choice.", "why": "findings indicate 為審慎陳述證據的用法。", "en": "The abstract states that the study will examine patterns of urban travel. Its findings indicate a relationship between distance and transport choice. The author avoids slang to maintain a formal register.", "zh": "摘要指出研究將檢視城市交通模式。發現顯示距離與交通選擇之間的關係。作者避免俚語以維持正式語域。"}]}, {"word": "information", "meanings": ["資訊"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P022", "title": "新來的蜂箱", "blank": 2, "level": 2, "type": "新舊資訊", "evidence": "With this new information, residents began to view the hive as an asset.", "why": "this new information 承接剛解釋的授粉作用。", "en": "A beekeeper placed a hive near the orchard. At first, this addition worried the neighbors. The beekeeper then explained how the bees pollinated fruit trees. With this new information, residents began to view the hive as an asset.", "zh": "養蜂人在果園旁放了一個蜂箱。起初，這個新增物讓鄰居擔心。養蜂人接著解釋蜜蜂如何幫果樹授粉。有了這項新資訊，居民開始把蜂箱視為助益。"}]}, {"word": "initial", "meanings": ["起初的"], "pos": ["Adj"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P077", "title": "相關不等於原因", "blank": 3, "level": 3, "type": "上下文邏輯", "evidence": "To test the club's effect, researchers need a suitable comparison group and information about students' initial abilities.", "why": "already 與原有差異要求 initial abilities；只看 final 無法分辨進步與起點。", "en": "Students who joined the club reported higher reading scores. However, they may already have been eager readers. The link is a correlation, not proof of causation. To test the club's effect, researchers need a suitable comparison group and information about students' initial abilities.", "zh": "加入社團的學生回報較高閱讀分數，但他們可能原本就熱愛閱讀。此關係是相關，並非因果證明。要測試社團效果，需要適當比較組及學生起初能力的資訊。"}]}, {"word": "insisted", "meanings": ["堅持"], "pos": ["V"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P060", "title": "習慣新的步調", "blank": 2, "level": 3, "type": "介系詞搭配", "evidence": "She no longer insisted on taking a taxi.", "why": "insist on V-ing 是堅持；demanded 不用 on taking 此結構。", "en": "After moving, Hana became accustomed to walking to school. She no longer insisted on taking a taxi. The change also made her more sensitive to the needs of pedestrians at dangerous crossings.", "zh": "搬家後，花奈習慣走路上學。她不再堅持搭計程車。這項改變也讓她更留意危險路口行人的需求。"}]}, {"word": "inspection", "meanings": ["檢查"], "pos": ["N"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P101", "title": "工具圖書館的考驗", "blank": 3, "level": 5, "type": "文章組織", "evidence": "Borrowers needed clear instructions, and returned tools required inspection.", "why": "損壞電線風險需要 inspection。", "en": "A neighborhood library began lending tools as well as books. The idea seemed practical: most people needed a drill only a few times a year. Sharing could reduce both household spending and unnecessary purchases. At first, however, the staff focused mainly on collecting equipment. They soon discovered that ownership was only one part of the problem. Borrowers needed clear instructions, and returned tools required inspection. One damaged cable could make the next loan unsafe. To address these concerns, the library trained volunteers and introduced a checklist. Each item was checked before it went back onto the shelf. The system also recorded late returns, but the director warned against treating every delay as carelessness. Illness or transport problems could be involved. Instead of imposing the same response in every case, staff considered the circumstances. Six months later, the service had many regular users. That popularity was encouraging, although it did not by itself prove that the project saved resources overall. The library still needed to compare the costs of repair and transport with the purchases it had replaced. Its experience showed that a generous idea becomes sustainable through careful management.", "zh": "社區圖書館除了書也開始借工具。想法看來實用：多數人一年只用幾次電鑽。共享能減少家庭支出與不必要購買。但員工起初主要忙著收集設備，很快發現有工具只是問題的一部分。借用者需要清楚說明，歸還工具需要檢查；一條損壞電線就可能讓下一次借用不安全。圖書館為處理疑慮培訓志工並設清單。每件物品回架前都先檢查。系統也記錄晚還，但館長提醒不能把每次延誤都當粗心，可能涉及疾病或交通問題。員工考量個別情況，而非一律回應。半年後，服務已有許多固定使用者，令人鼓舞，但受歡迎本身並不能證明整體省資源。仍需比較維修、運輸成本和取代的購買。經驗顯示，慷慨構想需靠細心管理才能持續。"}]}, {"word": "Instead", "meanings": ["改為／反而", "反而"], "pos": ["Adv"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P015", "title": "紙本與電子書", "blank": 2, "level": 4, "type": "句間邏輯", "evidence": "Instead, readers should choose according to their needs.", "why": "Instead 以依需求選擇取代找唯一最佳格式。", "en": "Electronic books are easy to carry. Printed books, however, do not need batteries. Neither format is best in every situation. Instead, readers should choose according to their needs. For travelers, for example, luggage weight may matter most.", "zh": "電子書方便攜帶，然而紙本書不需電池。沒有一種形式適合所有情況。讀者應改為依需求選擇。例如，對旅人而言，行李重量可能最重要。"}, {"pid": "P109", "title": "午休的短暫步行", "blank": 1, "level": 4, "type": "句間邏輯", "evidence": "Instead, many students returned feeling more alert.", "why": "預期浪費與實際清醒反向，Instead；Similarly 會錯說結果相同。", "en": "A class expected a short walk after lunch to waste study time. Instead, many students returned feeling more alert. The teacher repeated the activity for a week. However, she noticed that heavy rain made outdoor walks impractical. She therefore offered an indoor route as an alternative. The class kept both options, because the aim was movement rather than a particular location. The final plan was flexible rather than rigid.", "zh": "班上原以為午餐後散步浪費讀書時間，實際卻有許多學生精神更好。老師重複活動一週，但發現大雨使戶外步行難以實行。因此她提供室內路線作替代方案。兩種選項都保留，因為目標是活動身體而非限定地點。最後計畫有彈性而不僵化。"}]}, {"word": "insufficient", "meanings": ["不足的"], "pos": ["Adj"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P014", "title": "遮陽實驗", "blank": 3, "level": 3, "type": "句間邏輯", "evidence": "Nevertheless, it kept temperature records because one week of data was insufficient.", "why": "仍須收集資料表明原資料 insufficient；conclusive 與後續需求衝突。", "en": "Two classrooms received the same amount of sunlight. One installed external shades; the other did not. The shaded room stayed cooler. Therefore, the school expanded the trial. Nevertheless, it kept temperature records because one week of data was insufficient.", "zh": "兩間教室日照量相同，其中一間裝外遮陽，另一間沒有。裝遮陽的教室較涼。因此學校擴大試驗。不過，學校仍持續記錄溫度，因為一週資料並不足夠。"}]}, {"word": "intact", "meanings": ["完整無損的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P135", "title": "讓舊衣延長壽命", "blank": 2, "level": 3, "type": "語意判斷", "evidence": "The lining was torn, but the outer fabric remained intact.", "why": "but 對比內裡破與外層 intact。", "en": "A tailor examined the coat before deciding how to repair it. The lining was torn, but the outer fabric remained intact. Replacing only the damaged layer would preserve the coat's useful parts. The customer agreed because she wanted to extend its life. The work turned a possible discard into a usable garment.", "zh": "裁縫檢查外套再決定如何修補。內裡破了，但外層布仍完整。只換壞層可保留可用部分。顧客同意，因她想延長衣服壽命。修補讓原本可能被丟的衣物重新可穿。"}]}, {"word": "intentional", "meanings": ["刻意的"], "pos": ["Adj"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P044", "title": "不同的讀者", "blank": 2, "level": 4, "type": "全文一致", "evidence": "Its simplicity is intentional and fits the needs of its intended audience.", "why": "開头已定義設計對象，簡單是 intentional，不是 accidental。", "en": "The opening warns that the guide is designed for beginners. Later chapters explain basic terms and avoid advanced mathematics. The conclusion should describe the book as introductory, not exhaustive. Its simplicity is intentional and fits the needs of its intended audience.", "zh": "開頭提醒指南為初學者設計。後續章節解釋基本術語，避開高階數學。結論應稱它是入門書而非詳盡大全。它的簡單是刻意的，符合目標讀者需求。"}]}, {"word": "interest", "meanings": ["興趣"], "pos": ["N"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P105", "title": "校園堆肥的改變", "blank": 1, "level": 2, "type": "詞形", "evidence": "At first, students showed little interest in the project.", "why": "showed little interest 中 little 限定不可數名詞 interest。", "en": "The school began collecting fruit peels for compost. At first, students showed little interest in the project. A teacher explained how food scraps could become valuable material for the garden. After seeing the results, students separated their waste more carefully. The amount sent to the landfill fell considerably. What began as a small experiment became a successful part of daily school life.", "zh": "學校開始收集果皮製作堆肥。起初學生對計畫興趣不大。老師解釋廚餘如何成為花園的珍貴材料。看到成果後，學生更仔細分類垃圾，送往掩埋場的量大幅減少。小實驗成了校園日常中成功的一環。"}]}, {"word": "interfere", "meanings": ["干擾"], "pos": ["V"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P059", "title": "城市的影響", "blank": 1, "level": 2, "type": "介系詞搭配", "evidence": "Noise can interfere with concentration.", "why": "interfere with 是干擾；interrupt 為及物動詞，不用 with 接 concentration。", "en": "Noise can interfere with concentration. Children living near busy roads may be exposed to it for hours each day. A school therefore invested heavily in soundproof windows to reduce the disturbance.", "zh": "噪音可能干擾專注。住繁忙道路旁的孩子可能每天接觸噪音數小時。因此學校大量投資隔音窗以減少干擾。"}]}, {"word": "international", "meanings": ["國際的"], "pos": ["Adj"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P090", "title": "跨國合作", "blank": 1, "level": 3, "type": "構詞判斷", "evidence": "Researchers from several countries formed an international team.", "why": "inter- 表之間，several countries 對應 international；national 只涉及一國。", "en": "Researchers from several countries formed an international team. They planned to recheck earlier measurements after discovering a faulty sensor. Repeating the tests would help prevent misinterpretation of the original results.", "zh": "多國研究者組成國際團隊。發現感測器故障後，他們計畫重新檢查先前測量。重做測試有助避免誤解原始結果。"}]}, {"word": "interviews", "meanings": ["訪談"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P110", "title": "口述故事的保存", "blank": 1, "level": 3, "type": "句間銜接", "evidence": "These interviews captured details missing from official records.", "why": "These interviews 承接前句蒐集人們回憶的訪談活動。", "en": "The team recorded memories of a closed railway station. These interviews captured details missing from official records. The spoken material was then turned into written transcripts. This conversion made the stories easier to search. To preserve the speakers' voices as well, the archive also kept the original recordings. Together, the two formats offered complementary ways to explore the past.", "zh": "團隊錄下人們對已關閉車站的回憶。訪談捕捉官方紀錄缺少的細節，口述材料再轉成逐字稿。這種轉換讓故事更容易搜尋。為同時保留受訪者聲音，檔案館也留下原錄音。兩種格式提供互補的歷史探索方式。"}]}, {"word": "introductory", "meanings": ["入門的"], "pos": ["Adj"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P044", "title": "不同的讀者", "blank": 1, "level": 4, "type": "全文一致", "evidence": "The conclusion should describe the book as introductory, not exhaustive.", "why": "beginners 與 basic terms 全文一致支持 introductory；advanced 矛盾。", "en": "The opening warns that the guide is designed for beginners. Later chapters explain basic terms and avoid advanced mathematics. The conclusion should describe the book as introductory, not exhaustive. Its simplicity is intentional and fits the needs of its intended audience.", "zh": "開頭提醒指南為初學者設計。後續章節解釋基本術語，避開高階數學。結論應稱它是入門書而非詳盡大全。它的簡單是刻意的，符合目標讀者需求。"}]}, {"word": "investigation", "meanings": ["調查"], "pos": ["N"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P103", "title": "博物館裡的空白標籤", "blank": 7, "level": 5, "type": "尚待確認", "evidence": "Others appreciated being invited into the process of investigation.", "why": "比證據找來源屬 investigation。", "en": "A small museum received a wooden box from a local family. No document explained its origin. The donors believed it had belonged to a traveling merchant, but this account came from a story repeated over several generations. The curator did not reject the story; she simply distinguished it from a verified fact. She examined the box and found a mark that resembled a maker's symbol in an old catalog. The similarity offered a useful clue, not a complete answer. A later search revealed that several workshops had used comparable marks. The team therefore kept the label tentative. Instead of inventing a precise date, it explained what was known and what remained uncertain. Some visitors found the incomplete story frustrating. Others appreciated being invited into the process of investigation. The museum added a display describing how evidence is compared and claims are revised. Months later, a visitor supplied a photograph showing a similar box in a shop. This new material did not solve every question, but it helped narrow the search. The exhibit ultimately became less about a single object's mystery and more about the responsibility of presenting knowledge honestly.", "zh": "小博物館收到當地家庭捐贈的木盒，沒有文件交代來源。捐贈者相信它曾屬旅行商人，但說法來自世代口傳。館員沒有否定故事，只把它與核實事實分開。她找到似乎與舊型錄製作者符號相近的記號。相似性是有用線索，而非完整答案。後來查出多間工坊用相近記號，因此標籤保持暫定。館方不編造精確日期，而說明已知與未知。部分訪客感到挫折，另一些欣賞能參與調查過程。館方加設展示，說明如何比較證據與修正主張。數月後，訪客提供商店中相似盒子的照片。新資料未解決一切，但縮小搜尋範圍。展覽最後更關乎誠實呈現知識的責任，而不只是一件物品的謎。"}]}, {"word": "invisible", "meanings": ["看不見的"], "pos": ["Adj"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P089", "title": "看不見的墨水", "blank": 1, "level": 2, "type": "構詞判斷", "evidence": "The ink was initially invisible on the white paper.", "why": "in- 否定 visible，加熱後才 appear，故 invisible。", "en": "The ink was initially invisible on the white paper. Gentle heat made the writing appear. Students could then decode the message by replacing each symbol with a letter. The activity showed that something unseen may still be present.", "zh": "墨水起初在白紙上看不見，輕微加熱後字跡出現。學生再把符號替換成字母以解碼。活動顯示看不見的事物仍可能存在。"}]}, {"word": "irony", "meanings": ["反諷"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P086", "title": "引號中的準時", "blank": 2, "level": 3, "type": "語氣／含意", "evidence": "The mismatch between words and events signals irony.", "why": "mismatch signals irony，不宜只按表面褒義讀。", "en": "The bus arrived forty minutes late. \"Perfectly punctual, as usual,\" a passenger muttered. The mismatch between words and events signals irony. The remark expresses frustration, not genuine approval.", "zh": "公車晚了四十分鐘。一位乘客低聲說：「一如往常，真準時。」言語與事件的落差表示反諷。這話表達挫折與不滿，而非真心贊同。"}]}, {"word": "is", "meanings": ["是／被"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P005", "title": "屋頂雨水", "blank": 2, "level": 3, "type": "文法骨架", "evidence": "The water stored inside it is used to clean the playground.", "why": "water 是不可數主詞，搭配 is used；are 的主詞一致不合。", "en": "A tank installed on the roof collects rainwater. The water stored inside it is used to clean the playground. This simple system, despite its small size, saves the school hundreds of liters each month.", "zh": "裝在屋頂的水箱收集雨水。儲存在裡面的水被用來清洗操場。這套簡單系統雖然不大，每月仍替學校省下數百公升的水。"}]}, {"word": "it", "meanings": ["它"], "pos": ["Pron"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P108", "title": "兩個借書箱", "blank": 3, "level": 3, "type": "指涉連貫", "evidence": "If a book was damaged, they removed it for repair.", "why": "a book 單數，remove it；them 會回指複數而非受損的那本書。", "en": "The village placed a blue book box near the pier and a yellow one by the school. The first mainly served fishers, while the latter attracted children. Volunteers checked both boxes each Friday. If a book was damaged, they removed it for repair. This routine kept the collection usable. The villagers soon regarded the boxes as shared resources rather than private property.", "zh": "村莊在碼頭旁設藍色借書箱，學校旁設黃色箱。前者主要服務漁民，後者吸引兒童。志工每週五檢查兩個箱子。若有書損壞，就取出修補。這項例行工作維持館藏可用，村民也逐漸視箱子為共有資源而非私產。"}]}, {"word": "join", "meanings": ["加入"], "pos": ["V"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P079", "title": "參加哪一種活動", "blank": 1, "level": 2, "type": "中文直譯", "evidence": "Nora decided to join the chess club.", "why": "join the club 是加入團體；中文「參加」要依受詞選字。", "en": "Nora decided to join the chess club. She would also attend its weekly meetings and take part in the city tournament. Each activity gave her a different way to practice.", "zh": "諾拉決定加入西洋棋社，也會出席每週聚會並參加城市賽。每種活動提供不同練習方式。"}]}, {"word": "judgment", "meanings": ["判斷"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P098", "title": "猜對不等於理解", "blank": 3, "level": 4, "type": "尚待確認", "evidence": "The teacher therefore avoided making the same judgment about both learners.", "why": "不能只用分數做相同 judgment，需要過程證據。", "en": "Two students selected the correct word. One identified a clear clue; the other admitted it was a guess. Their scores matched, but their reasoning was different. The teacher therefore avoided making the same judgment about both learners.", "zh": "兩名學生選對單字，一人找出清楚線索，另一人承認是猜的。分數相同，推理卻不同。因此老師避免對兩人的理解做相同判斷。"}]}, {"word": "jump", "meanings": ["跳躍／遽然行動"], "pos": ["V"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P057", "title": "研究討論會", "blank": 2, "level": 3, "type": "搭配判斷", "evidence": "Members were careful not to jump to conclusions after seeing one unusual result.", "why": "jump to conclusions 為遽下定論，not 表避免。", "en": "The team gathered to draw conclusions from the data. Members were careful not to jump to conclusions after seeing one unusual result. They agreed to conduct another experiment before publishing their report.", "zh": "團隊聚集，從資料歸納結論。成員謹慎避免只看到一個異常結果就遽下定論，同意發表報告前再做一次實驗。"}]}, {"word": "keep", "meanings": ["保持"], "pos": ["V"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P123", "title": "準備社區演出", "blank": 4, "level": 3, "type": "搭配判斷", "evidence": "Everyone was asked to keep track of borrowed items.", "why": "keep track of 表追蹤記錄，不用 catch track。", "en": "To organize the concert, the students first drew up a schedule. They agreed to share responsibility for equipment checks. Before rehearsal, they would run a sound test. Everyone was asked to keep track of borrowed items. These habits helped the group meet its deadline without a last-minute rush.", "zh": "學生為籌辦音樂會，先擬定時程，並同意分擔設備檢查責任。彩排前進行音效測試。大家要追蹤借來的物品。這些習慣幫團隊按期完成，不必最後一刻趕工。"}]}, {"word": "kept", "meanings": ["保持"], "pos": ["V"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P081", "title": "拍照留念", "blank": 2, "level": 4, "type": "中文直譯", "evidence": "They then kept in touch with the makers by email.", "why": "kept in touch 為保持聯絡的詞塊。", "en": "At the village, students asked permission to take photographs of local crafts. They then kept in touch with the makers by email. The exchange helped them gain a deeper understanding of the work.", "zh": "在村莊裡，學生先徵求同意再拍當地工藝品的照片。之後他們以電子郵件和製作者保持聯絡。交流幫他們對工藝有更深理解。"}]}, {"word": "laid", "meanings": ["放置〔lay 的過去式〕"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P069", "title": "躺下休息", "blank": 2, "level": 3, "type": "易混淆字詞", "evidence": "First, he laid his backpack on a bench.", "why": "有受詞 backpack 且敘事為過去，放置 lay 的過去式是 laid；lay 作躺的過去式不能帶此受詞。", "en": "After the hike, Bo wanted to lie down in the shade. First, he laid his backpack on a bench. The rest helped him recover before the journey home.", "zh": "健行後，博想躺在樹蔭下。他先把背包放上長椅。休息幫他在返程前恢復體力。"}]}, {"word": "large", "meanings": ["大的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P126", "title": "報名人數的變化", "blank": 1, "level": 3, "type": "近義詞混淆", "evidence": "The festival attracted a large number of visitors, but ticket sales were lower than expected.", "why": "a large number 是大量；biggest 是最高級且 a biggest number 不合此語境。", "en": "The festival attracted a large number of visitors, but ticket sales were lower than expected. Many people came only to the free outdoor events. The organizers needed to distinguish attendance from paid participation. They could estimate total crowds from photographs, but sales records gave an exact count of tickets. This distinction made their evaluation more precise. A popular event was not necessarily a profitable one.", "zh": "節慶吸引很多人，票房卻比預期低。許多人只參加免費戶外活動。主辦方需區分到場和付費參與。照片可估計總人數，售票紀錄則有精確票數。區分使評估更精準；活動熱門不一定獲利。"}]}, {"word": "last", "meanings": ["持續／耐用"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P064", "title": "值得花費的價格", "blank": 2, "level": 2, "type": "近義詞混淆", "evidence": "Students also asked whether the fabric would last through several winters.", "why": "fabric last through winters 是能耐用多久；persist 多描述情況或人堅持，不適合布料耐用性。", "en": "The jacket was expensive, but its price was not the only concern. Students also asked whether the fabric would last through several winters. A high price does not always guarantee durability.", "zh": "外套很昂貴，但價格不是唯一考量。學生也問布料是否能耐用好幾個冬天。高價不一定保證耐久。"}]}, {"word": "later", "meanings": ["之後"], "pos": ["Adv"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P019", "title": "種子的等待", "blank": 1, "level": 2, "type": "時間線", "evidence": "Two days later, tiny roots appeared.", "why": "先種植再發根，two days later；earlier 會倒置流程。", "en": "The children planted beans on Monday. Two days later, tiny roots appeared. By Friday, the first leaves had emerged. The students recorded each stage so that next year's class could follow the same sequence.", "zh": "孩子們週一種下豆子。兩天後長出細根。到了週五，第一批葉子已冒出。學生記錄每個階段，讓明年的班級能追蹤同樣的順序。"}, {"pid": "P111", "title": "候鳥追蹤器", "blank": 1, "level": 3, "type": "時間線", "evidence": "Three weeks later, the birds began their northward journey.", "why": "March 裝設在先，遷徙在後，later；earlier 會倒置流程。", "en": "In March, scientists attached trackers to several birds. Three weeks later, the birds began their northward journey. By the time they reached the wetlands, they had crossed two mountain ranges. Researchers compared the new route with data collected the previous year. Only after the birds returned did the team recover the devices. The full analysis was therefore postponed until autumn.", "zh": "三月，科學家替幾隻鳥裝追蹤器。三週後，鳥開始北遷。到濕地時，牠們已越過兩條山脈。研究者拿新路線與前一年資料比較。直到鳥返回後，團隊才收回裝置，因此完整分析延到秋天。"}]}, {"word": "latter", "meanings": ["後者"], "pos": ["Pron"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P108", "title": "兩個借書箱", "blank": 1, "level": 3, "type": "指涉連貫", "evidence": "The first mainly served fishers, while the latter attracted children.", "why": "latter 回指後提到的黃色箱；former 指藍箱，與 first 已指同物會破壞對比。", "en": "The village placed a blue book box near the pier and a yellow one by the school. The first mainly served fishers, while the latter attracted children. Volunteers checked both boxes each Friday. If a book was damaged, they removed it for repair. This routine kept the collection usable. The villagers soon regarded the boxes as shared resources rather than private property.", "zh": "村莊在碼頭旁設藍色借書箱，學校旁設黃色箱。前者主要服務漁民，後者吸引兒童。志工每週五檢查兩個箱子。若有書損壞，就取出修補。這項例行工作維持館藏可用，村民也逐漸視箱子為共有資源而非私產。"}]}, {"word": "lead", "meanings": ["帶領"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P070", "title": "免費導覽", "blank": 2, "level": 2, "type": "多義判斷", "evidence": "Volunteers lead small groups through the galleries and explain the background of selected objects.", "why": "lead groups 表帶領，lead 在此不是金屬鉛。", "en": "The museum does not charge visitors for its guided tours. The service is free, although donations are welcome. Volunteers lead small groups through the galleries and explain the background of selected objects.", "zh": "博物館導覽不向遊客收費。服務免費，但歡迎捐款。志工帶小團體走過展廳，解釋部分物件的背景。"}]}, {"word": "leaking", "meanings": ["漏出"], "pos": ["V-ing"], "tags": ["Semantics"], "examples": [{"pid": "P007", "title": "可折疊水杯", "blank": 3, "level": 2, "type": "局部精確語意", "evidence": "Its tight lid prevents water from leaking.", "why": "tight lid 防的是液體漏出 leaking；沒有加熱證據可支持 boiling。", "en": "Hikers wanted cups that would fit inside small pockets. A designer created a foldable model that becomes flat when empty. It weighs very little, so it is also lightweight. Its tight lid prevents water from leaking.", "zh": "健行者想要能放進小口袋的杯子。設計師做出可折疊款式，空杯可壓平。它很輕，因此也方便攜帶；緊密的杯蓋能防止漏水。"}]}, {"word": "lend", "meanings": ["借出"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P067", "title": "誰借給誰", "blank": 2, "level": 1, "type": "易混淆字詞", "evidence": "He was happy to lend it to her until Sunday.", "why": "He 是梯子主人，lend it to her 指借出。", "en": "Jia asked to borrow a ladder from her neighbor. He was happy to lend it to her until Sunday. She promised to return it after painting her room.", "zh": "佳向鄰居借梯子。鄰居很樂意借給她用到週日。她答應粉刷完房間就歸還。"}]}, {"word": "lengthy", "meanings": ["冗長的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P133", "title": "一句話裡的保留", "blank": 3, "level": 4, "type": "語氣／含意", "evidence": "In context, it hinted that the proposal might be too lengthy.", "why": "更簡短的要求暗示 too lengthy；too concise 與修改方向相反。", "en": "After reading a long proposal, the manager said, \"It is certainly detailed.\" She then asked whether the main idea could be expressed more briefly. Her first remark was not necessarily straightforward praise. In context, it hinted that the proposal might be too lengthy. The request for a shorter version made the implication clearer. A reader should therefore consider the whole exchange before deciding on the speaker's attitude.", "zh": "經理看完長提案說：「確實很詳細。」隨後問主旨能否更簡短表達。首句未必是單純稱讚，語境暗示提案可能過長。要求縮短使暗示更清楚。因此須讀完整互動才能判斷態度。"}]}, {"word": "lie", "meanings": ["躺"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P069", "title": "躺下休息", "blank": 1, "level": 3, "type": "易混淆字詞", "evidence": "After the hike, Bo wanted to lie down in the shade.", "why": "wanted to 後為原形 lie，且不帶受詞。", "en": "After the hike, Bo wanted to lie down in the shade. First, he laid his backpack on a bench. The rest helped him recover before the journey home.", "zh": "健行後，博想躺在樹蔭下。他先把背包放上長椅。休息幫他在返程前恢復體力。"}]}, {"word": "life", "meanings": ["生命／活力"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P128", "title": "修復唱片的價值", "blank": 5, "level": 3, "type": "多義判斷", "evidence": "The project gave new life to material that had spent decades in storage.", "why": "give new life to 為使材料重獲活力，不是真正生物復活。", "en": "The archive held a rare record of a local singer's first performance. Dust covered its surface, so a specialist cleaned it with great care. The work carried no charge because a donor covered the cost. Once restored, the music brought an almost forgotten voice back into circulation. The project gave new life to material that had spent decades in storage.", "zh": "檔案館保存一張在地歌手初次演出的珍貴唱片。表面覆塵，專家細心清潔。捐贈者負擔費用，因此工作不收費。修復後，音樂讓幾乎被遺忘的聲音重新流傳，也讓存放數十年的材料重獲生命。"}]}, {"word": "lightweight", "meanings": ["輕量的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P007", "title": "可折疊水杯", "blank": 2, "level": 2, "type": "局部精確語意", "evidence": "It weighs very little, so it is also lightweight.", "why": "weighs very little 直接限定為 lightweight，與是否易碎無關。", "en": "Hikers wanted cups that would fit inside small pockets. A designer created a foldable model that becomes flat when empty. It weighs very little, so it is also lightweight. Its tight lid prevents water from leaking.", "zh": "健行者想要能放進小口袋的杯子。設計師做出可折疊款式，空杯可壓平。它很輕，因此也方便攜帶；緊密的杯蓋能防止漏水。"}]}, {"word": "limitation", "meanings": ["限制"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P116", "title": "好消息後的一段保留", "blank": 1, "level": 4, "type": "段落功能", "evidence": "This section introduces a limitation.", "why": "still lack…指出 limitation，不是新增成功例。", "en": "The first paragraphs celebrate a town's new recycling program. A later paragraph explains that several apartment blocks still lack collection points. This section introduces a limitation. It qualifies the earlier praise rather than canceling every achievement. By drawing attention to unequal access, it explains why further work is necessary. Its function is to prevent an overly optimistic conclusion.", "zh": "前幾段肯定小鎮的新回收計畫。後一段說明數棟公寓仍無回收點。此段引入限制，為先前讚揚加上保留，而非否定全部成果。它指出可近性不均，說明仍需改善，避免結論過度樂觀。"}]}, {"word": "limitations", "meanings": ["限制"], "pos": ["N"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P031", "title": "食堂剩食方案", "blank": 3, "level": 3, "type": "文章組織", "evidence": "The final paragraph discusses limitations, including the trial's short duration.", "why": "including short duration 是限制 limitations，不是讚美 praise。", "en": "The article opens by describing food waste in a cafeteria. It then presents a solution: smaller default portions with free seconds. Next, it reports the results of a month-long trial. The final paragraph discusses limitations, including the trial's short duration.", "zh": "文章先描述食堂剩食，再提出解方：預設份量較小，可免費續餐。接著報告一個月試辦的結果。末段討論限制，包括試辦時間太短。"}, {"pid": "P102", "title": "城市夜色中的昆蟲", "blank": 8, "level": 5, "type": "推論", "evidence": "In their report, they described both the results and the limitations.", "why": "both results and limitations 表結果與限制並陳。", "en": "When a city replaced its streetlights, residents welcomed the brighter roads. A biology teacher asked a different question: how would the change affect insects? Her students placed observation sheets near several lamps and counted visits at fixed times. To keep the comparison fair, they used the same procedure at every location. They found more insects around some lamps than others. This difference was interesting, but its cause was not immediately clear. The locations also varied in temperature and nearby vegetation. The teacher therefore reminded the class that a pattern was not automatically an explanation. During a second trial, the students compared two lamp types in the same area. Their new records provided stronger evidence about the role of light. Even so, the findings applied only to the conditions they had tested. The class resisted the temptation to claim that one lamp was best everywhere. In their report, they described both the results and the limitations. The city agreed to consider a smaller trial rather than replace every light at once. For the students, the most valuable lesson was not a simple answer but a more careful way of asking questions. Scientific inquiry, they learned, depends on adjusting claims to match what observations actually support.", "zh": "城市更換路燈時，居民歡迎更明亮道路。生物老師問：改變如何影響昆蟲？學生在幾座燈旁設觀察表，固定時間計數到訪。為公平比較，各處程序一致。他們發現某些燈邊昆蟲更多，差異有趣，原因卻未明：各地溫度、植被也不同。老師提醒模式不自動等於解釋。第二次試驗在同區比較兩款燈，新紀錄提供更強證據。不過發現只適用受測條件。學生避免宣稱某款燈處處最佳，報告同時說明結果與限制。市府同意先做較小試辦，不一次換掉所有燈。學生最有價值的收穫不是簡單答案，而是更審慎提問。科學探究需調整主張，使之符合觀察實際能支持的範圍。"}]}, {"word": "limited", "meanings": ["有限制的", "受限制的"], "pos": ["Adj"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P026", "title": "有條件的免費", "blank": 1, "level": 3, "type": "作用範圍", "evidence": "This limited offer does not apply to adults.", "why": "年齡與展覽皆有限制，limited；universal 誤把局部優惠擴至全部。", "en": "The museum offers free entry to children under twelve. This limited offer does not apply to adults. It also excludes special exhibitions, so not every gallery is free. Families should check the conditions before booking.", "zh": "博物館讓十二歲以下兒童免費入場。這項有限優惠不適用成人，也排除特展，因此不是每個展廳都免費。家庭應在訂票前查看條件。"}, {"pid": "P113", "title": "閱讀調查的限定詞", "blank": 5, "level": 4, "type": "作用範圍", "evidence": "Its conclusion remained limited to the group actually surveyed.", "why": "actually surveyed 限定 limited；universal 過度擴張。", "en": "The survey reached only students who used the school library. Its findings therefore describe a subset of the school population. They cannot represent everyone. Some respondents preferred paper books, but that does not mean they never read on screens. The report carefully separated a general preference from an absolute rule. Its conclusion remained limited to the group actually surveyed.", "zh": "調查只接觸使用圖書館的學生，因此發現描述的是全校群體中的子群，不能代表所有人。部分受訪者偏好紙本，卻不表示從不看螢幕。報告區分一般偏好和絕對規則，結論限於實際受訪群體。"}]}, {"word": "listen", "meanings": ["聆聽"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P066", "title": "聽見與傾聽", "blank": 2, "level": 4, "type": "近義詞混淆", "evidence": "She opened it to listen carefully to the melody.", "why": "listen to 為主動專注聆聽，hear 不接 to the melody。", "en": "From her room, Mei could hear music in the courtyard even with the window closed. She opened it to listen carefully to the melody. The sound gradually became fainter as the musicians walked away.", "zh": "即使窗戶關著，美在房裡仍聽得到院子音樂。她開窗仔細聆聽旋律。樂手走遠時，聲音逐漸變微弱。"}]}, {"word": "living", "meanings": ["居住的"], "pos": ["V-ing"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P094", "title": "關係子句的線索", "blank": 2, "level": 1, "type": "句法判斷", "evidence": "People living on either side use it daily.", "why": "People living… 中 living 修飾人，主句動詞已是 use；live 會多出沒有連接的限定動詞。", "en": "The bridge, which was built by local workers, links two villages. People living on either side use it daily. Although narrow, it provides a safe crossing during the rainy season.", "zh": "這座由當地工人興建的橋連接兩個村莊。住兩側的人每天使用。橋雖窄，卻在雨季提供安全通道。"}]}, {"word": "log", "meanings": ["紀錄"], "pos": ["N"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P052", "title": "記錄河水", "blank": 2, "level": 1, "type": "詞性判斷", "evidence": "Their written log helps scientists identify seasonal changes.", "why": "Their written log 中 log 是名詞，不能以表示人的 recorder 代替資料。", "en": "Students record the river level every morning. Their written log helps scientists identify seasonal changes. To keep the data reliable, they use the same measuring method each day.", "zh": "學生每天早上記錄河流水位。書面紀錄協助科學家辨認季節變化。為使資料可靠，他們每天使用相同測量方法。"}]}, {"word": "lower", "meanings": ["更低的"], "pos": ["Adj"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P129", "title": "漏水修好以後", "blank": 2, "level": 3, "type": "上下文方向", "evidence": "The monthly bill became lower, even though the number of residents stayed the same.", "why": "省水使費用 lower，higher 方向相反。", "en": "A hidden pipe had been wasting water for months. After repairs, daily consumption dropped. The monthly bill became lower, even though the number of residents stayed the same. This change reduced pressure on the building's budget. The manager viewed the result as positive. Still, she continued checking the meter so that another leak would not go unnoticed.", "zh": "暗管漏水數月。修好後日用水量下降，即使住戶數相同，月費也降低。改變減輕大樓預算壓力，管理者視為正面成果。她仍查水表，避免另一次漏水未被察覺。"}]}, {"word": "made", "meanings": ["使"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P125", "title": "實驗課的規則", "blank": 3, "level": 3, "type": "句型判斷", "evidence": "The rules made the class feel more secure.", "why": "made the class feel 為使役動詞接原形 feel。", "en": "The instructor required students to wear goggles. She recommended tying back long hair before using the equipment. The rules made the class feel more secure. A checklist reminded everyone that safety came before speed. Students then practiced slowly to avoid making careless errors.", "zh": "講師要求學生戴護目鏡，並建議使用設備前把長髮綁好。規則讓大家更安心。清單提醒所有人安全優先於速度。學生接著慢慢練習，避免粗心錯誤。"}]}, {"word": "mainly", "meanings": ["主要地"], "pos": ["Adv"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P124", "title": "為新生安排路線", "blank": 2, "level": 3, "type": "介系詞搭配", "evidence": "Its map focused mainly on buildings used in the first week.", "why": "focus mainly on 表聚焦主要使用建築，mainly 修飾 focused。", "en": "The orientation team was responsible for guiding new students. Its map focused mainly on buildings used in the first week. Volunteers also responded to questions about transport. Their advice was based on incomplete personal experience, so they checked uncertain details. Students could then rely on the final guide for accurate directions.", "zh": "迎新團隊負責引導新生。地圖主要著重第一週使用的建築。志工也回應交通問題。建議基於不完整的個人經驗，因此會查證不確定細節。學生便能仰賴完成版指南獲得正確方向。"}]}, {"word": "maintenance", "meanings": ["維修保養"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P065", "title": "借用與租用", "blank": 3, "level": 3, "type": "近義詞混淆", "evidence": "The different arrangements reflect the cost of maintenance.", "why": "cost of maintenance 指保養支出，承接不同器材的維護成本。", "en": "Visitors may borrow umbrellas from the hotel at no charge. Bicycles, however, must be rented for an hourly fee. The different arrangements reflect the cost of maintenance.", "zh": "旅客可免費向旅館借傘，腳踏車則需按小時付費租用。兩種安排不同，反映維修保養成本。"}]}, {"word": "make", "meanings": ["做出", "做出／安排"], "pos": ["V"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P055", "title": "做決定的時刻", "blank": 1, "level": 1, "type": "搭配判斷", "evidence": "The club had to make a decision about its trip.", "why": "make a decision 是固定搭配，不能用 do a decision。", "en": "The club had to make a decision about its trip. Members agreed to take responsibility for checking the weather. They would also pay attention to warnings from local guides.", "zh": "社團必須對旅行做決定。社員同意負責查天氣，也會注意當地嚮導的警告。"}, {"pid": "P131", "title": "把中文想法換成英文", "blank": 1, "level": 3, "type": "中文直譯", "evidence": "To prepare the charity sale, students had to make arrangements with local shops.", "why": "make arrangements 為做安排；do arrangements 不合普通搭配。", "en": "To prepare the charity sale, students had to make arrangements with local shops. They wanted to give people a hand without creating extra waste. One shop agreed to offer reusable bags at cost. Students would also take care of the tables after the event. Their teacher reminded them that helping the community meant putting ideas into practice, not merely discussing them.", "zh": "學生為準備義賣，需與店家協調安排，希望幫助人又不增加垃圾。一家店同意以成本價供應可重用袋。學生也會在活動後整理照管桌子。老師提醒幫助社區是把想法付諸實踐，不只是討論。"}]}, {"word": "management", "meanings": ["管理"], "pos": ["N"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P101", "title": "工具圖書館的考驗", "blank": 10, "level": 5, "type": "文章組織", "evidence": "Its experience showed that a generous idea becomes sustainable through careful management.", "why": "培訓、檢查與個案處理共同指 management。", "en": "A neighborhood library began lending tools as well as books. The idea seemed practical: most people needed a drill only a few times a year. Sharing could reduce both household spending and unnecessary purchases. At first, however, the staff focused mainly on collecting equipment. They soon discovered that ownership was only one part of the problem. Borrowers needed clear instructions, and returned tools required inspection. One damaged cable could make the next loan unsafe. To address these concerns, the library trained volunteers and introduced a checklist. Each item was checked before it went back onto the shelf. The system also recorded late returns, but the director warned against treating every delay as carelessness. Illness or transport problems could be involved. Instead of imposing the same response in every case, staff considered the circumstances. Six months later, the service had many regular users. That popularity was encouraging, although it did not by itself prove that the project saved resources overall. The library still needed to compare the costs of repair and transport with the purchases it had replaced. Its experience showed that a generous idea becomes sustainable through careful management.", "zh": "社區圖書館除了書也開始借工具。想法看來實用：多數人一年只用幾次電鑽。共享能減少家庭支出與不必要購買。但員工起初主要忙著收集設備，很快發現有工具只是問題的一部分。借用者需要清楚說明，歸還工具需要檢查；一條損壞電線就可能讓下一次借用不安全。圖書館為處理疑慮培訓志工並設清單。每件物品回架前都先檢查。系統也記錄晚還，但館長提醒不能把每次延誤都當粗心，可能涉及疾病或交通問題。員工考量個別情況，而非一律回應。半年後，服務已有許多固定使用者，令人鼓舞，但受歡迎本身並不能證明整體省資源。仍需比較維修、運輸成本和取代的購買。經驗顯示，慷慨構想需靠細心管理才能持續。"}]}, {"word": "matches", "meanings": ["符合"], "pos": ["V"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P119", "title": "復育尚未結束", "blank": 4, "level": 4, "type": "全文一致", "evidence": "This recommendation matches the unresolved problem and avoids a contradiction between the ending and the earlier details.", "why": "監測建議 matches 未解問題；ignores 會反向。", "en": "The opening section reports that more fish have returned to the stream. Later, the article notes that pollution still enters after heavy rain. A consistent conclusion must recognize both recovery and continuing risk. Declaring the stream completely restored would go beyond the evidence. The final paragraph instead calls for regular monitoring. This recommendation matches the unresolved problem and avoids a contradiction between the ending and the earlier details.", "zh": "開頭說溪流魚變多，後文提醒大雨後仍有污染流入。一致的結論須兼顧復原和持續風險。宣稱已完全復育會超出證據。末段改為要求定期監測，與未解決問題一致，避免結尾和前文矛盾。"}]}, {"word": "meaning", "meanings": ["意義"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P114", "title": "留住一座市場的理由", "blank": 4, "level": 4, "type": "全文主題", "evidence": "Architecture provides the setting, but relationships give the place its meaning.", "why": "relationships 賦予地方 meaning，承接居民重視人際互動。", "en": "Visitors photographed the old market's colorful signs. Residents, however, valued more than its appearance. Vendors remembered customers' names, neighbors exchanged news, and newcomers learned local customs. These details reveal the market's social role. The article's central concern is the preservation of community connections. Architecture provides the setting, but relationships give the place its meaning. A summary focused only on decoration would miss the broader theme.", "zh": "遊客拍攝老市場彩色招牌，但居民看重的不只是外觀。攤販記得客人姓名，鄰居交換消息，新居民學習地方習俗。細節揭示市場的社會角色。文章關心保存社區連結；建築提供場域，人際關係賦予意義。只談裝飾的摘要會錯失更廣主題。"}]}, {"word": "measured", "meanings": ["測量了"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P106", "title": "走廊的溫度地圖", "blank": 1, "level": 3, "type": "文法骨架", "evidence": "The students, equipped with handheld sensors, measured temperatures around the school.", "why": "equipped… 是修飾語，主句仍需 measured；measuring 不能單獨完成過去式述語。", "en": "The students, equipped with handheld sensors, measured temperatures around the school. A map of the readings revealed several hot spots. The corridor beside the kitchen, despite its open windows, was warmer than expected. Trees planted near the west wall provided shade in the afternoon. These observations, together with maintenance records, helped the principal decide where to add fans.", "zh": "學生帶著手持感測器測量校園溫度。讀值地圖顯示數個熱點。廚房旁走廊雖開著窗，仍比預期熱。西牆旁種的樹在午後提供遮蔭。這些觀察和維護紀錄協助校長決定增設風扇的位置。"}]}, {"word": "meet", "meanings": ["滿足／會面", "達成／滿足"], "pos": ["V"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P056", "title": "災後援助", "blank": 1, "level": 2, "type": "搭配判斷", "evidence": "Volunteers worked to meet the urgent needs of displaced families.", "why": "meet needs 為滿足需求；achieve 通常搭目標，不直接搭 needs。", "en": "Volunteers worked to meet the urgent needs of displaced families. Local shops agreed to provide supplies, while students helped raise funds. Together, these efforts made the relief center possible.", "zh": "志工努力滿足流離失所家庭的迫切需求。當地商店同意提供物資，學生則協助募款。這些努力共同促成救助中心成立。"}, {"pid": "P123", "title": "準備社區演出", "blank": 5, "level": 3, "type": "搭配判斷", "evidence": "These habits helped the group meet its deadline without a last-minute rush.", "why": "meet a deadline 為如期完成，不能逐字理解成與期限見面。", "en": "To organize the concert, the students first drew up a schedule. They agreed to share responsibility for equipment checks. Before rehearsal, they would run a sound test. Everyone was asked to keep track of borrowed items. These habits helped the group meet its deadline without a last-minute rush.", "zh": "學生為籌辦音樂會，先擬定時程，並同意分擔設備檢查責任。彩排前進行音效測試。大家要追蹤借來的物品。這些習慣幫團隊按期完成，不必最後一刻趕工。"}]}, {"word": "method", "meanings": ["方法"], "pos": ["N"], "tags": ["Global", "Semantics", "POS"], "examples": [{"pid": "P035", "title": "量測前的說明", "blank": 1, "level": 4, "type": "段落功能", "evidence": "This paragraph describes the method.", "why": "位置與記錄頻率是研究 method；資料數值才屬 result。", "en": "Before presenting the findings, the researcher explains where the sensors were placed and how often they recorded data. This paragraph describes the method. Its purpose is to make the study reproducible, rather than to announce the final conclusion.", "zh": "在呈現發現之前，研究者解釋感測器放在哪裡以及記錄頻率。這一段描述方法，目的是讓研究能被重做，而非宣告最後結論。"}, {"pid": "P052", "title": "記錄河水", "blank": 3, "level": 1, "type": "詞性判斷", "evidence": "To keep the data reliable, they use the same measuring method each day.", "why": "same measuring method 表固定方法，以確保可比較性。", "en": "Students record the river level every morning. Their written log helps scientists identify seasonal changes. To keep the data reliable, they use the same measuring method each day.", "zh": "學生每天早上記錄河流水位。書面紀錄協助科學家辨認季節變化。為使資料可靠，他們每天使用相同測量方法。"}]}, {"word": "misinterpretation", "meanings": ["誤解"], "pos": ["N"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P090", "title": "跨國合作", "blank": 3, "level": 3, "type": "構詞判斷", "evidence": "Repeating the tests would help prevent misinterpretation of the original results.", "why": "防止的是因故障導致的 misinterpretation，非阻止一切 interpretation。", "en": "Researchers from several countries formed an international team. They planned to recheck earlier measurements after discovering a faulty sensor. Repeating the tests would help prevent misinterpretation of the original results.", "zh": "多國研究者組成國際團隊。發現感測器故障後，他們計畫重新檢查先前測量。重做測試有助避免誤解原始結果。"}]}, {"word": "misunderstanding", "meanings": ["誤解"], "pos": ["N"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P134", "title": "可逆的展示設計", "blank": 4, "level": 3, "type": "構詞判斷", "evidence": "Clear instructions prevented misunderstanding during installation.", "why": "mis- 表錯誤理解，clear instructions 防 misunderstanding。", "en": "The museum needed labels that could be removed without damaging the walls. Designers chose a removable adhesive. Because future exhibitions would differ, the layout had to be reconfigurable. Workers could reassemble the panels in new arrangements. Clear instructions prevented misunderstanding during installation. The system made later changes less costly.", "zh": "博物館需要能移除又不傷牆的標籤，因此選可移除黏著劑。未來展覽不同，配置須能重新組合。工人可把面板重組成新排列。清楚說明避免安裝誤解，也降低之後修改成本。"}]}, {"word": "mixed", "meanings": ["褒貶並存的"], "pos": ["Adj"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P117", "title": "一篇有保留的展覽評論", "blank": 2, "level": 4, "type": "作者態度", "evidence": "Her response was therefore mixed, not wholly negative.", "why": "優點加缺點組成 mixed；hostile 過強且忽略欣賞。", "en": "The critic admired the exhibition's ambitious topic but questioned its lack of local voices. She called the photographs powerful while describing the captions as incomplete. Her response was therefore mixed, not wholly negative. The word \"ambitious\" did not signal unconditional approval. Instead, she urged the museum to include more perspectives. Her criticism expressed a desire for improvement, rather than a demand to close the show.", "zh": "評論者欣賞展覽題目有企圖心，卻質疑缺乏地方聲音。她稱照片有力量，但說圖說不完整。因此態度是褒貶並存，不是全然負面。「有企圖心」不代表無條件贊同。她要求納入更多觀點，批評意在改進而非關展。"}]}, {"word": "mixing", "meanings": ["混合"], "pos": ["V-ing"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P136", "title": "從海岸帶回的資料", "blank": 5, "level": 4, "type": "句法判斷", "evidence": "This allowed comparisons without mixing material from different habitats.", "why": "without 後 mixing 動名詞，不另加限定動詞。", "en": "The samples collected during low tide were stored in sealed containers. The researcher who supervised the trip checked every label. Students noted the places where each sample had been found. Because the locations differed, the team kept the groups separate. This allowed comparisons without mixing material from different habitats.", "zh": "退潮時收集的樣本存於密封容器。督導行程的研究者檢查標籤。學生記下各樣本發現位置。因地點不同，團隊分組保存，讓比較時不會混入不同棲地材料。"}]}, {"word": "monitoring", "meanings": ["監測"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P119", "title": "復育尚未結束", "blank": 3, "level": 4, "type": "全文一致", "evidence": "The final paragraph instead calls for regular monitoring.", "why": "仍有污染需要 monitoring，不能 neglect。", "en": "The opening section reports that more fish have returned to the stream. Later, the article notes that pollution still enters after heavy rain. A consistent conclusion must recognize both recovery and continuing risk. Declaring the stream completely restored would go beyond the evidence. The final paragraph instead calls for regular monitoring. This recommendation matches the unresolved problem and avoids a contradiction between the ending and the earlier details.", "zh": "開頭說溪流魚變多，後文提醒大雨後仍有污染流入。一致的結論須兼顧復原和持續風險。宣稱已完全復育會超出證據。末段改為要求定期監測，與未解決問題一致，避免結尾和前文矛盾。"}]}, {"word": "moreover", "meanings": ["此外"], "pos": ["Adv"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P013", "title": "手機禁用日", "blank": 3, "level": 2, "type": "句間邏輯", "evidence": "Consequently, the class decided to repeat the experiment; moreover, another class asked to join.", "why": "另一班加入是額外進展，用 moreover；Instead 會誤說它取代本班再辦。", "en": "Students expected a phone-free lunch to be boring. However, they ended up talking more than usual. Several discovered shared interests. Consequently, the class decided to repeat the experiment; moreover, another class asked to join.", "zh": "學生原以為不用手機的午餐會很無聊。然而，他們說的話反而比平常多，有些人發現共同興趣。因此，班上決定再試一次；此外，另一班也想加入。"}]}, {"word": "multiple", "meanings": ["多個的"], "pos": ["Adj"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P100", "title": "一條河的兩種任務", "blank": 2, "level": 5, "type": "全文一致", "evidence": "It concerned how one place could serve multiple purposes.", "why": "防洪與生態不只一項用途，multiple。", "en": "For decades, a concrete channel carried rainwater quickly through the town. Engineers had designed it to prevent flooding, and many residents considered it a success. Yet its steep walls left little room for plants or animals. When the town proposed a redesign, the debate was not simply about beauty. It concerned how one place could serve multiple purposes. The new plan kept a deep central channel but added planted shelves along the sides. These features created habitats without blocking the main flow. Some residents remained skeptical, fearing that vegetation would slow the water. The team therefore ran tests before construction. The results suggested that the design could work under ordinary conditions; they did not guarantee safety in every possible storm. Officials described the evidence as promising, rather than final. After the first section opened, volunteers began to record water levels and wildlife sightings. Their observations would guide later adjustments. The project thus treated restoration as an ongoing process, not a single finished event. Its broader lesson was that public spaces require both careful design and continued attention.", "zh": "數十年來，水泥渠道讓雨水快速流過小鎮。工程師原先設計它是為防洪，许多居民認為很成功。但陡峭壁面使動植物幾乎無處生存。小鎮提出改造時，辯論不只關乎美觀，更涉及同一空間如何兼顧多項用途。新計畫保留深中央水道，在兩側增植栽平台。這些設計創造棲地，又不阻擋主流。部分居民仍懷疑，擔心植被減慢水流。因此團隊施工前先測試。結果暗示設計在一般條件下可行，卻不保證每場可能的暴雨都安全。官員稱證據有希望，而非已定論。首段開放後，志工開始記錄水位與野生動物。觀察將引導後續調整。修復因此是持續過程，而非一次完成的事件。更廣泛的啟示是公共空間既需周密設計，也需持續關注。"}]}, {"word": "narrow", "meanings": ["縮小"], "pos": ["V"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P103", "title": "博物館裡的空白標籤", "blank": 9, "level": 5, "type": "尚待確認", "evidence": "This new material did not solve every question, but it helped narrow the search.", "why": "新照片提供方向，narrow the search。", "en": "A small museum received a wooden box from a local family. No document explained its origin. The donors believed it had belonged to a traveling merchant, but this account came from a story repeated over several generations. The curator did not reject the story; she simply distinguished it from a verified fact. She examined the box and found a mark that resembled a maker's symbol in an old catalog. The similarity offered a useful clue, not a complete answer. A later search revealed that several workshops had used comparable marks. The team therefore kept the label tentative. Instead of inventing a precise date, it explained what was known and what remained uncertain. Some visitors found the incomplete story frustrating. Others appreciated being invited into the process of investigation. The museum added a display describing how evidence is compared and claims are revised. Months later, a visitor supplied a photograph showing a similar box in a shop. This new material did not solve every question, but it helped narrow the search. The exhibit ultimately became less about a single object's mystery and more about the responsibility of presenting knowledge honestly.", "zh": "小博物館收到當地家庭捐贈的木盒，沒有文件交代來源。捐贈者相信它曾屬旅行商人，但說法來自世代口傳。館員沒有否定故事，只把它與核實事實分開。她找到似乎與舊型錄製作者符號相近的記號。相似性是有用線索，而非完整答案。後來查出多間工坊用相近記號，因此標籤保持暫定。館方不編造精確日期，而說明已知與未知。部分訪客感到挫折，另一些欣賞能參與調查過程。館方加設展示，說明如何比較證據與修正主張。數月後，訪客提供商店中相似盒子的照片。新資料未解決一切，但縮小搜尋範圍。展覽最後更關乎誠實呈現知識的責任，而不只是一件物品的謎。"}]}, {"word": "necessarily", "meanings": ["必然地"], "pos": ["Adv"], "tags": ["Semantics"], "examples": [{"pid": "P126", "title": "報名人數的變化", "blank": 5, "level": 3, "type": "近義詞混淆", "evidence": "A popular event was not necessarily a profitable one.", "why": "not necessarily 表不必然；熱門未保證獲利。", "en": "The festival attracted a large number of visitors, but ticket sales were lower than expected. Many people came only to the free outdoor events. The organizers needed to distinguish attendance from paid participation. They could estimate total crowds from photographs, but sales records gave an exact count of tickets. This distinction made their evaluation more precise. A popular event was not necessarily a profitable one.", "zh": "節慶吸引很多人，票房卻比預期低。許多人只參加免費戶外活動。主辦方需區分到場和付費參與。照片可估計總人數，售票紀錄則有精確票數。區分使評估更精準；活動熱門不一定獲利。"}]}, {"word": "necessary", "meanings": ["必要的"], "pos": ["Adj"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P116", "title": "好消息後的一段保留", "blank": 4, "level": 4, "type": "段落功能", "evidence": "By drawing attention to unequal access, it explains why further work is necessary.", "why": "尚缺設施，further work necessary。", "en": "The first paragraphs celebrate a town's new recycling program. A later paragraph explains that several apartment blocks still lack collection points. This section introduces a limitation. It qualifies the earlier praise rather than canceling every achievement. By drawing attention to unequal access, it explains why further work is necessary. Its function is to prevent an overly optimistic conclusion.", "zh": "前幾段肯定小鎮的新回收計畫。後一段說明數棟公寓仍無回收點。此段引入限制，為先前讚揚加上保留，而非否定全部成果。它指出可近性不均，說明仍需改善，避免結論過度樂觀。"}]}, {"word": "needed", "meanings": ["需要的"], "pos": ["V-en"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P041", "title": "延長開放的線索", "blank": 3, "level": 4, "type": "推論", "evidence": "Further comparison would be needed.", "why": "還有其他可能因素，所以進一步比較 needed；unnecessary 過早定論。", "en": "After the library extended its evening hours, more students borrowed books at night. This pattern is consistent with improved access. However, a simultaneous reading campaign means the increase cannot be attributed solely to longer hours. Further comparison would be needed.", "zh": "圖書館延長晚間開放後，更多學生夜間借書。這個趨勢與可近性改善相符。然而同期有閱讀推廣活動，因此不能把增加完全歸因於延長時間，仍需進一步比較。"}]}, {"word": "never", "meanings": ["從不"], "pos": ["Adv"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P113", "title": "閱讀調查的限定詞", "blank": 3, "level": 4, "type": "作用範圍", "evidence": "Some respondents preferred paper books, but that does not mean they never read on screens.", "why": "偏好紙本不等於 never read on screens；always 會變成不同且不構成此排他陷阱的主張。", "en": "The survey reached only students who used the school library. Its findings therefore describe a subset of the school population. They cannot represent everyone. Some respondents preferred paper books, but that does not mean they never read on screens. The report carefully separated a general preference from an absolute rule. Its conclusion remained limited to the group actually surveyed.", "zh": "調查只接觸使用圖書館的學生，因此發現描述的是全校群體中的子群，不能代表所有人。部分受訪者偏好紙本，卻不表示從不看螢幕。報告區分一般偏好和絕對規則，結論限於實際受訪群體。"}]}, {"word": "Nevertheless", "meanings": ["儘管如此"], "pos": ["Adv"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P014", "title": "遮陽實驗", "blank": 2, "level": 3, "type": "句間邏輯", "evidence": "Nevertheless, it kept temperature records because one week of data was insufficient.", "why": "有好結果仍持續記錄是保留與讓步，故 Nevertheless。", "en": "Two classrooms received the same amount of sunlight. One installed external shades; the other did not. The shaded room stayed cooler. Therefore, the school expanded the trial. Nevertheless, it kept temperature records because one week of data was insufficient.", "zh": "兩間教室日照量相同，其中一間裝外遮陽，另一間沒有。裝遮陽的教室較涼。因此學校擴大試驗。不過，學校仍持續記錄溫度，因為一週資料並不足夠。"}]}, {"word": "noticeable", "meanings": ["容易注意到的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P008", "title": "無聲提醒", "blank": 2, "level": 3, "type": "局部精確語意", "evidence": "The light is bright enough to be noticeable, but it does not interrupt the silence students need.", "why": "bright enough to be 限定燈光能被看見，故 noticeable。", "en": "During exams, the library uses lamps instead of bells. A visual signal tells readers when the room will close. The light is bright enough to be noticeable, but it does not interrupt the silence students need.", "zh": "考試期間，圖書館用燈取代鈴聲。視覺訊號提醒讀者即將閉館。燈光亮得足以被注意，卻不打破學生需要的安靜。"}]}, {"word": "observe", "meanings": ["觀察"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P093", "title": "保留生物的距離", "blank": 1, "level": 4, "type": "語意判斷", "evidence": "Visitors were told to observe the seals from a distance.", "why": "from a distance 可以 observe，無法 embrace，兩者行為條件不同。", "en": "Visitors were told to observe the seals from a distance. Approaching them could disturb their rest. Keeping space allowed people to enjoy the animals without causing unnecessary stress.", "zh": "遊客被告知應遠距觀察海豹。靠近可能打擾牠們休息。保持距離能讓人欣賞動物，同時不造成不必要壓力。"}]}, {"word": "offer", "meanings": ["提供"], "pos": ["V"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P131", "title": "把中文想法換成英文", "blank": 3, "level": 3, "type": "中文直譯", "evidence": "One shop agreed to offer reusable bags at cost.", "why": "offer bags at cost 表按成本供應。", "en": "To prepare the charity sale, students had to make arrangements with local shops. They wanted to give people a hand without creating extra waste. One shop agreed to offer reusable bags at cost. Students would also take care of the tables after the event. Their teacher reminded them that helping the community meant putting ideas into practice, not merely discussing them.", "zh": "學生為準備義賣，需與店家協調安排，希望幫助人又不增加垃圾。一家店同意以成本價供應可重用袋。學生也會在活動後整理照管桌子。老師提醒幫助社區是把想法付諸實踐，不只是討論。"}]}, {"word": "operational", "meanings": ["可運作的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P009", "title": "溫室測量", "blank": 3, "level": 4, "type": "局部精確語意", "evidence": "A backup battery keeps the sensor operational during power failures.", "why": "備用電池的用途是維持運作 operational，不是增加裝飾性 decorative。", "en": "The sensor records temperature every minute. Such frequent measurements help growers notice sudden changes. They need accurate readings because an error of two degrees can damage seedlings. A backup battery keeps the sensor operational during power failures.", "zh": "感測器每分鐘記錄溫度。如此頻繁的測量有助於栽種者發現突變。他們需要精確讀值，因為兩度誤差就可能傷害幼苗。備用電池讓感測器在停電時仍能運作。"}]}, {"word": "optimistic", "meanings": ["樂觀的"], "pos": ["Adj"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P116", "title": "好消息後的一段保留", "blank": 5, "level": 4, "type": "段落功能", "evidence": "Its function is to prevent an overly optimistic conclusion.", "why": "避免把局部成功說成全面成功，防止 overly optimistic；不是防止悲觀結論。", "en": "The first paragraphs celebrate a town's new recycling program. A later paragraph explains that several apartment blocks still lack collection points. This section introduces a limitation. It qualifies the earlier praise rather than canceling every achievement. By drawing attention to unequal access, it explains why further work is necessary. Its function is to prevent an overly optimistic conclusion.", "zh": "前幾段肯定小鎮的新回收計畫。後一段說明數棟公寓仍無回收點。此段引入限制，為先前讚揚加上保留，而非否定全部成果。它指出可近性不均，說明仍需改善，避免結論過度樂觀。"}]}, {"word": "origin", "meanings": ["來源"], "pos": ["N"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P103", "title": "博物館裡的空白標籤", "blank": 1, "level": 5, "type": "尚待確認", "evidence": "No document explained its origin.", "why": "缺文件及後文追溯所有人，是 origin。", "en": "A small museum received a wooden box from a local family. No document explained its origin. The donors believed it had belonged to a traveling merchant, but this account came from a story repeated over several generations. The curator did not reject the story; she simply distinguished it from a verified fact. She examined the box and found a mark that resembled a maker's symbol in an old catalog. The similarity offered a useful clue, not a complete answer. A later search revealed that several workshops had used comparable marks. The team therefore kept the label tentative. Instead of inventing a precise date, it explained what was known and what remained uncertain. Some visitors found the incomplete story frustrating. Others appreciated being invited into the process of investigation. The museum added a display describing how evidence is compared and claims are revised. Months later, a visitor supplied a photograph showing a similar box in a shop. This new material did not solve every question, but it helped narrow the search. The exhibit ultimately became less about a single object's mystery and more about the responsibility of presenting knowledge honestly.", "zh": "小博物館收到當地家庭捐贈的木盒，沒有文件交代來源。捐贈者相信它
