 in the science fair submitted a project. Their active {participation} made the event lively. Teachers hoped that even more students would {participate} the following year.", "zh": "每位科展參與者都提交作品。他們積極的參與讓活動熱鬧。老師希望明年有更多學生參加。", "bank": [{"word": "participate", "zh": "參加", "pos": "V"}, {"word": "participatory", "zh": "參與式的", "pos": "Adj"}, {"word": "participating", "zh": "參與中的", "pos": "V-ing"}, {"word": "participant", "zh": "參與者", "pos": "N"}, {"word": "participation", "zh": "參與", "pos": "N"}], "answers": ["participant", "participation", "participate"], "why": ["Every 後指提交作品的人，要 participant。", "Their active 後指參與這件事，participation；不是參與者。", "would 後要原形動詞 participate；participating 不合助動詞句型。"], "evidence": ["Every {participant} in the science fair submitted a project.", "Their active {participation} made the event lively.", "Teachers hoped that even more students would {participate} the following year."], "type": 16, "level": 1, "tags": ["POS", "Semantics"], "slot": 0}, {"id": "P050", "title": "應徵工作坊", "en": "The workshop helps each {applicant} prepare for an interview. Students first complete an {application} and then practice explaining their skills. The advice is {applicable} to many entry-level jobs, not just one company.", "zh": "工作坊協助每位應徵者準備面試。學生先完成申請表，再練習說明技能。建議適用於許多初階工作，不只一家公司的職位。", "bank": [{"word": "application", "zh": "申請／申請表", "pos": "N"}, {"word": "applied", "zh": "應用的／已施用的", "pos": "Adj/V-en"}, {"word": "applicable", "zh": "適用的", "pos": "Adj"}, {"word": "applicant", "zh": "申請人", "pos": "N"}, {"word": "apply", "zh": "申請／應用", "pos": "V"}], "answers": ["applicant", "application", "applicable"], "why": ["each 後是需要面試的人，applicant。", "complete an application 是完成申請表，不是完成申請人。", "is applicable to 是適用於；applied to 表已被施用於，並不表一般適用性。"], "evidence": ["The workshop helps each {applicant} prepare for an interview.", "Students first complete an {application} and then practice explaining their skills.", "The advice is {applicable} to many entry-level jobs, not just one company."], "type": 16, "level": 2, "tags": ["POS", "Semantics"], "slot": 1}, {"id": "P051", "title": "高效率農園", "en": "The farm increased its {production} of tomatoes without adding land. Better irrigation made workers more {productive}. The resulting gain in {productivity} meant that each hour of labor yielded more food.", "zh": "農場沒有增加土地，卻提高番茄產量。更好的灌溉讓工作者更有效率。生產力的提升表示每一工時能產出更多食物。", "bank": [{"word": "production", "zh": "生產／產量", "pos": "N"}, {"word": "producer", "zh": "生產者", "pos": "N"}, {"word": "product", "zh": "產品", "pos": "N"}, {"word": "productive", "zh": "有生產效率的", "pos": "Adj"}, {"word": "productivity", "zh": "生產力", "pos": "N"}], "answers": ["production", "productive", "productivity"], "why": ["its production of tomatoes 表生產量；producer 指人或組織。", "made workers more productive，受詞後補語要形容工作者特性。", "each hour…more food 明確定義投入產出效率 productivity，不是單一 product。"], "evidence": ["The farm increased its {production} of tomatoes without adding land.", "Better irrigation made workers more {productive}.", "The resulting gain in {productivity} meant that each hour of labor yielded more food."], "type": 16, "level": 3, "tags": ["POS", "Semantics"], "slot": 2}, {"id": "P052", "title": "記錄河水", "en": "Students {record} the river level every morning. Their written {log} helps scientists identify seasonal changes. To keep the data reliable, they use the same measuring {method} each day.", "zh": "學生每天早上記錄河流水位。書面紀錄協助科學家辨認季節變化。為使資料可靠，他們每天使用相同測量方法。", "bank": [{"word": "recorded", "zh": "已記錄的", "pos": "V-en"}, {"word": "record", "zh": "記錄", "pos": "V"}, {"word": "log", "zh": "紀錄", "pos": "N"}, {"word": "method", "zh": "方法", "pos": "N"}, {"word": "recorder", "zh": "記錄者／錄音機", "pos": "N"}], "answers": ["record", "log", "method"], "why": ["Students 後缺主要動詞，record 在此是動作。同字可兼類，但此格需動詞。", "Their written log 中 log 是名詞，不能以表示人的 recorder 代替資料。", "same measuring method 表固定方法，以確保可比較性。"], "evidence": ["Students {record} the river level every morning.", "Their written {log} helps scientists identify seasonal changes.", "To keep the data reliable, they use the same measuring {method} each day."], "type": 17, "level": 1, "tags": ["POS", "Semantics"], "slot": 0}, {"id": "P053", "title": "相互支持", "en": "Older students {support} younger readers during weekly meetings. This {assistance} makes difficult books less frightening. The school measures the program's success through reading {progress}, not the number of meetings alone.", "zh": "高年級學生在每週聚會中支持年幼讀者。這份支持讓難書不再那麼可怕。學校以閱讀進步衡量成效，不單看聚會次數。", "bank": [{"word": "support", "zh": "支持／協助", "pos": "V/N"}, {"word": "progressive", "zh": "漸進的", "pos": "Adj"}, {"word": "supportive", "zh": "支持性的", "pos": "Adj"}, {"word": "assistance", "zh": "協助", "pos": "N"}, {"word": "progress", "zh": "進步", "pos": "N"}], "answers": ["support", "assistance", "progress"], "why": ["Older students 後需要動詞 support。support 在此作動詞。", "This assistance 是名詞主語；supportive 是形容詞，不能單獨作這裡的核心。", "through reading progress 需要名詞；progressive 是形容詞且不能表示閱讀成果。"], "evidence": ["Older students {support} younger readers during weekly meetings.", "This {assistance} makes difficult books less frightening.", "The school measures the program's success through reading {progress}, not the number of meetings alone."], "type": 17, "level": 2, "tags": ["POS", "Semantics"], "slot": 1}, {"id": "P054", "title": "預算與計畫", "en": "The group will {plan} a festival within a fixed budget. Its final {proposal} must include a rain policy. Members also need to {budget} for equipment repairs instead of spending everything on decorations.", "zh": "團隊會在固定預算內規劃節慶。最後的計畫必須含雨天辦法。成員也需要編列設備維修預算，而非把錢全花在裝飾上。", "bank": [{"word": "proposal", "zh": "提案", "pos": "N"}, {"word": "planned", "zh": "已規劃的", "pos": "V-en"}, {"word": "financial", "zh": "財務的", "pos": "Adj"}, {"word": "budget", "zh": "編預算／預算", "pos": "V/N"}, {"word": "plan", "zh": "規劃／計畫", "pos": "V/N"}], "answers": ["plan", "proposal", "budget"], "why": ["will 後用原形動詞 plan。plan 在此作動詞。", "Its final proposal 需要名詞核心；planned 是分詞，不能單獨表示提案。", "need to budget for 是為某項目編預算；financial 是形容詞，不能接在 to 後作動詞。"], "evidence": ["The group will {plan} a festival within a fixed budget.", "Its final {proposal} must include a rain policy.", "Members also need to {budget} for equipment repairs instead of spending everything on decorations."], "type": 17, "level": 3, "tags": ["POS", "Semantics"], "slot": 2}, {"id": "P055", "title": "做決定的時刻", "en": "The club had to {make} a decision about its trip. Members agreed to {take} responsibility for checking the weather. They would also {pay} attention to warnings from local guides.", "zh": "社團必須對旅行做決定。社員同意負責查天氣，也會注意當地嚮導的警告。", "bank": [{"word": "pay", "zh": "付出／給予", "pos": "V"}, {"word": "spend", "zh": "花費", "pos": "V"}, {"word": "do", "zh": "做", "pos": "V"}, {"word": "make", "zh": "做出", "pos": "V"}, {"word": "take", "zh": "承擔", "pos": "V"}], "answers": ["make", "take", "pay"], "why": ["make a decision 是固定搭配，不能用 do a decision。", "take responsibility for 表承擔責任。", "pay attention to 是注意；spend attention 不合慣用搭配。"], "evidence": ["The club had to {make} a decision about its trip.", "Members agreed to {take} responsibility for checking the weather.", "They would also {pay} attention to warnings from local guides."], "type": 18, "level": 1, "tags": ["Collocation", "Semantics"], "slot": 0}, {"id": "P056", "title": "災後援助", "en": "Volunteers worked to {meet} the urgent needs of displaced families. Local shops agreed to {provide} supplies, while students helped {raise} funds. Together, these efforts made the relief center possible.", "zh": "志工努力滿足流離失所家庭的迫切需求。當地商店同意提供物資，學生則協助募款。這些努力共同促成救助中心成立。", "bank": [{"word": "meet", "zh": "滿足／會面", "pos": "V"}, {"word": "rise", "zh": "上升", "pos": "V"}, {"word": "raise", "zh": "募集／提高", "pos": "V"}, {"word": "achieve", "zh": "達成", "pos": "V"}, {"word": "provide", "zh": "提供", "pos": "V"}], "answers": ["meet", "provide", "raise"], "why": ["meet needs 為滿足需求；achieve 通常搭目標，不直接搭 needs。", "provide supplies 是提供物資，和商店角色相合。", "raise funds 是募款且 raise 為及物動詞；rise 不能直接接受詞 funds。"], "evidence": ["Volunteers worked to {meet} the urgent needs of displaced families.", "Local shops agreed to {provide} supplies, while students helped {raise} funds.", "Local shops agreed to {provide} supplies, while students helped {raise} funds."], "type": 18, "level": 2, "tags": ["Collocation", "Semantics"], "slot": 1}, {"id": "P057", "title": "研究討論會", "en": "The team gathered to {draw} conclusions from the data. Members were careful not to {jump} to conclusions after seeing one unusual result. They agreed to {conduct} another experiment before publishing their report.", "zh": "團隊聚集，從資料歸納結論。成員謹慎避免只看到一個異常結果就遽下定論，同意發表報告前再做一次實驗。", "bank": [{"word": "conduct", "zh": "進行", "pos": "V"}, {"word": "draw", "zh": "推導／畫", "pos": "V"}, {"word": "commit", "zh": "犯下／承諾", "pos": "V"}, {"word": "jump", "zh": "跳躍／遽然行動", "pos": "V"}, {"word": "paint", "zh": "繪畫", "pos": "V"}], "answers": ["draw", "jump", "conduct"], "why": ["draw conclusions from data 為歸納結論，paint 不具有此搭配義。", "jump to conclusions 為遽下定論，not 表避免。", "conduct an experiment 為進行實驗；commit 不能用在這個中性研究活動搭配。"], "evidence": ["The team gathered to {draw} conclusions from the data.", "Members were careful not to {jump} to conclusions after seeing one unusual result.", "They agreed to {conduct} another experiment before publishing their report."], "type": 18, "level": 3, "tags": ["Collocation", "Semantics"], "slot": 2}, {"id": "P058", "title": "雨水的依賴", "en": "The village used to {depend} on a single well. After several dry seasons, residents became {aware} of the risks. They now {contribute} to a fund for a second water source.", "zh": "村莊過去仰賴一口井。經過幾次乾季，居民意識到風險。他們現在捐款給開發第二水源的基金。", "bank": [{"word": "depend", "zh": "依賴", "pos": "V"}, {"word": "aware", "zh": "察覺的", "pos": "Adj"}, {"word": "reliance", "zh": "依賴", "pos": "N"}, {"word": "unaware", "zh": "未察覺的", "pos": "Adj"}, {"word": "contribute", "zh": "貢獻／捐助", "pos": "V"}], "answers": ["depend", "aware", "contribute"], "why": ["used to 後需要原形 depend，depend on 表依賴；reliance 是名詞。", "aware of 指察覺風險，後文籌措第二水源即證據；unaware 與行動原因矛盾。", "contribute to a fund 表捐助基金，符合共同建水源的語境。"], "evidence": ["The village used to {depend} on a single well.", "After several dry seasons, residents became {aware} of the risks.", "They now {contribute} to a fund for a second water source."], "type": 19, "level": 1, "tags": ["Collocation", "Semantics"], "slot": 0}, {"id": "P059", "title": "城市的影響", "en": "Noise can {interfere} with concentration. Children living near busy roads may be {exposed} to it for hours each day. A school therefore invested {heavily} in soundproof windows to reduce the disturbance.", "zh": "噪音可能干擾專注。住繁忙道路旁的孩子可能每天接觸噪音數小時。因此學校大量投資隔音窗以減少干擾。", "bank": [{"word": "exposure", "zh": "暴露", "pos": "N"}, {"word": "interrupt", "zh": "打斷", "pos": "V"}, {"word": "interfere", "zh": "干擾", "pos": "V"}, {"word": "heavily", "zh": "大量地", "pos": "Adv"}, {"word": "exposed", "zh": "暴露的", "pos": "V-en"}], "answers": ["interfere", "exposed", "heavily"], "why": ["interfere with 是干擾；interrupt 為及物動詞，不用 with 接 concentration。", "be exposed to 表暴露於；exposure 是名詞，不能組成 be exposure to。", "invest heavily in 是大量投資，副詞修飾 invested。"], "evidence": ["Noise can {interfere} with concentration.", "Children living near busy roads may be {exposed} to it for hours each day.", "A school therefore invested {heavily} in soundproof windows to reduce the disturbance."], "type": 19, "level": 2, "tags": ["Collocation", "Semantics"], "slot": 1}, {"id": "P060", "title": "習慣新的步調", "en": "After moving, Hana became {accustomed} to walking to school. She no longer {insisted} on taking a taxi. The change also made her more {sensitive} to the needs of pedestrians at dangerous crossings.", "zh": "搬家後，花奈習慣走路上學。她不再堅持搭計程車。這項改變也讓她更留意危險路口行人的需求。", "bank": [{"word": "sensitive", "zh": "敏感／體察的", "pos": "Adj"}, {"word": "familiar", "zh": "熟悉的", "pos": "Adj"}, {"word": "accustomed", "zh": "習慣的", "pos": "Adj"}, {"word": "insisted", "zh": "堅持", "pos": "V"}, {"word": "demanded", "zh": "要求", "pos": "V"}], "answers": ["accustomed", "insisted", "sensitive"], "why": ["accustomed to walking 表習慣做某事；familiar 通常用 with 表熟悉，不能在此接 to walking 表本人習慣。", "insist on V-ing 是堅持；demanded 不用 on taking 此結構。", "sensitive to needs 是體察需求的搭配，符合自己步行後的改變。"], "evidence": ["After moving, Hana became {accustomed} to walking to school.", "She no longer {insisted} on taking a taxi.", "The change also made her more {sensitive} to the needs of pedestrians at dangerous crossings."], "type": 19, "level": 3, "tags": ["Collocation", "Semantics"], "slot": 2}, {"id": "P061", "title": "參觀規則", "en": "The museum {allows} visitors to take photographs without flash. It asks them to {avoid} touching fragile objects. These rules help {protect} the collection while keeping the visit enjoyable.", "zh": "博物館允許遊客不用閃光燈拍照，並請大家避免觸摸脆弱物品。規則既保護館藏，也維持參觀樂趣。", "bank": [{"word": "avoid", "zh": "避免", "pos": "V"}, {"word": "protect", "zh": "保護", "pos": "V"}, {"word": "allows", "zh": "允許", "pos": "V"}, {"word": "lets", "zh": "讓", "pos": "V"}, {"word": "prevent", "zh": "防止", "pos": "V"}], "answers": ["allows", "avoid", "protect"], "why": ["allow visitors to take；let visitors take 不用 to，故 lets 不合。", "avoid 後直接接 touching；prevent 需要受詞或不同結構。", "help protect the collection 是保護館藏；help 後可接原形動詞。"], "evidence": ["The museum {allows} visitors to take photographs without flash.", "It asks them to {avoid} touching fragile objects.", "These rules help {protect} the collection while keeping the visit enjoyable."], "type": 20, "level": 1, "tags": ["Grammar", "Semantics"], "slot": 0}, {"id": "P062", "title": "練習演說", "en": "The coach {encouraged} Lian to speak more slowly. She {suggested} practicing in front of a mirror and {reminded} him that pauses could help listeners follow the message.", "zh": "教練鼓勵連放慢說話速度，建議對鏡練習，並提醒他停頓能幫聽眾跟上內容。", "bank": [{"word": "made", "zh": "使", "pos": "V"}, {"word": "said", "zh": "說", "pos": "V"}, {"word": "reminded", "zh": "提醒", "pos": "V"}, {"word": "suggested", "zh": "建議", "pos": "V"}, {"word": "encouraged", "zh": "鼓勵", "pos": "V"}], "answers": ["encouraged", "suggested", "reminded"], "why": ["encouraged 人 to speak 合法；made 人 speak 不加 to。", "suggested practicing 接動名詞；不是 suggested 人 to V。", "reminded him that 接人與子句；said him that 不合句型，需 said to him 或 told him。"], "evidence": ["The coach {encouraged} Lian to speak more slowly.", "She {suggested} practicing in front of a mirror and {reminded} him that pauses could help listeners follow the message.", "She {suggested} practicing in front of a mirror and {reminded} him that pauses could help listeners follow the message."], "type": 20, "level": 2, "tags": ["Grammar", "Semantics"], "slot": 1}, {"id": "P063", "title": "山路警告", "en": "The ranger {warned} hikers not to leave the marked path. Thick fog {prevented} them from seeing the cliff edge. Rather than continuing, they {decided} to wait at a shelter.", "zh": "巡山員警告健行者不要離開標示路徑。濃霧使他們看不見懸崖邊緣。他們決定在避難處等候，不再前進。", "bank": [{"word": "avoided", "zh": "避免", "pos": "V"}, {"word": "warned", "zh": "警告", "pos": "V"}, {"word": "suggested", "zh": "建議", "pos": "V"}, {"word": "prevented", "zh": "阻止／使無法", "pos": "V"}, {"word": "decided", "zh": "決定", "pos": "V"}], "answers": ["warned", "prevented", "decided"], "why": ["warn 人 not to V 表警告不要做；suggested 不接受這個人加不定詞結構。", "prevented 人 from V-ing；avoided them from seeing 不成立。", "decided to wait 接不定詞；避免或建議要用不同補語形式。"], "evidence": ["The ranger {warned} hikers not to leave the marked path.", "Thick fog {prevented} them from seeing the cliff edge.", "Rather than continuing, they {decided} to wait at a shelter."], "type": 20, "level": 3, "tags": ["Grammar", "Semantics"], "slot": 2}, {"id": "P064", "title": "值得花費的價格", "en": "The jacket was {expensive}, but its price was not the only concern. Students also asked whether the fabric would {last} through several winters. A high price does not always {guarantee} durability.", "zh": "外套很昂貴，但價格不是唯一考量。學生也問布料是否能耐用好幾個冬天。高價不一定保證耐久。", "bank": [{"word": "guarantee", "zh": "保證", "pos": "V"}, {"word": "expensive", "zh": "昂貴的", "pos": "Adj"}, {"word": "high", "zh": "高的", "pos": "Adj"},  "V"}, {"word": "fainter", "zh": "更微弱的", "pos": "Adj"}, {"word": "hearing", "zh": "聽力", "pos": "N"}], "answers": ["hear", "listen", "fainter"], "why": ["could hear 指感官接收到音樂；hearing 是名詞或分詞，不能接在 could 後作原形動詞。", "listen to 為主動專注聆聽，hear 不接 to the melody。", "walked away 使音量更微弱 fainter；louder 方向相反。"], "evidence": ["From her room, Mei could {hear} music in the courtyard even with the window closed.", "She opened it to {listen} carefully to the melody.", "The sound gradually became {fainter} as the musicians walked away."], "type": 21, "level": 4, "tags": ["Semantics"], "slot": 2}, {"id": "P067", "title": "誰借給誰", "en": "Jia asked to {borrow} a ladder from her neighbor. He was happy to {lend} it to her until Sunday. She promised to {return} it after painting her room.", "zh": "佳向鄰居借梯子。鄰居很樂意借給她用到週日。她答應粉刷完房間就歸還。", "bank": [{"word": "lend", "zh": "借出", "pos": "V"}, {"word": "return", "zh": "歸還", "pos": "V"}, {"word": "rent", "zh": "付費租用", "pos": "V"}, {"word": "keep", "zh": "留下", "pos": "V"}, {"word": "borrow", "zh": "借入", "pos": "V"}], "answers": ["borrow", "lend", "return"], "why": ["from her neighbor 表佳是借入者 borrow；lend 是提供方的動作。", "He 是梯子主人，lend it to her 指借出。", "until Sunday 設歸還期限，return 符合承諾；keep 不表歸還。"], "evidence": ["Jia asked to {borrow} a ladder from her neighbor.", "He was happy to {lend} it to her until Sunday.", "She promised to {return} it after painting her room."], "type": 22, "level": 1, "tags": ["Semantics"], "slot": 0}, {"id": "P068", "title": "水位的變化", "en": "Heavy rain caused the river to {rise} overnight. Workers had to {raise} the temporary barrier to keep the road dry. They watched the water level {closely} until the storm passed.", "zh": "大雨使河流水位一夜上升。工人必須提高臨時障礙物以保持道路乾燥。他們密切觀察水位，直到暴風雨過去。", "bank": [{"word": "rise", "zh": "上升", "pos": "V"}, {"word": "raise", "zh": "提高", "pos": "V"}, {"word": "arise", "zh": "發生／出現", "pos": "V"}, {"word": "closely", "zh": "密切地", "pos": "Adv"}, {"word": "nearly", "zh": "幾乎", "pos": "Adv"}], "answers": ["rise", "raise", "closely"], "why": ["river 自身水位上升為 rise；arise 用於問題或情況出現。", "raise 為及物動詞，直接接 barrier；rise 不能如此用。", "watched closely 表密切關注，nearly 只是差一點，不表觀察方式。"], "evidence": ["Heavy rain caused the river to {rise} overnight.", "Workers had to {raise} the temporary barrier to keep the road dry.", "They watched the water level {closely} until the storm passed."], "type": 22, "level": 2, "tags": ["Semantics"], "slot": 1}, {"id": "P069", "title": "躺下休息", "en": "After the hike, Bo wanted to {lie} down in the shade. First, he {laid} his backpack on a bench. The rest helped him {recover} before the journey home.", "zh": "健行後，博想躺在樹蔭下。他先把背包放上長椅。休息幫他在返程前恢復體力。", "bank": [{"word": "lay", "zh": "放置／躺的過去式", "pos": "V"}, {"word": "laid", "zh": "放置〔lay 的過去式〕", "pos": "V"}, {"word": "recovery", "zh": "恢復", "pos": "N"}, {"word": "recover", "zh": "恢復", "pos": "V"}, {"word": "lie", "zh": "躺", "pos": "V"}], "answers": ["lie", "laid", "recover"], "why": ["wanted to 後為原形 lie，且不帶受詞。", "有受詞 backpack 且敘事為過去，放置 lay 的過去式是 laid；lay 作躺的過去式不能帶此受詞。", "helped him recover 需動詞；recovery 是名詞。"], "evidence": ["After the hike, Bo wanted to {lie} down in the shade.", "First, he {laid} his backpack on a bench.", "The rest helped him {recover} before the journey home."], "type": 22, "level": 3, "tags": ["Semantics"], "slot": 2}, {"id": "P070", "title": "免費導覽", "en": "The museum does not {charge} visitors for its guided tours. The service is free, although donations are welcome. Volunteers {lead} small groups through the galleries and explain the {background} of selected objects.", "zh": "博物館導覽不向遊客收費。服務免費，但歡迎捐款。志工帶小團體走過展廳，解釋部分物件的背景。", "bank": [{"word": "background", "zh": "背景", "pos": "N"}, {"word": "foreground", "zh": "前景", "pos": "N"}, {"word": "accuse", "zh": "指控", "pos": "V"}, {"word": "charge", "zh": "收費／充電", "pos": "V"}, {"word": "lead", "zh": "帶領", "pos": "V"}], "answers": ["charge", "lead", "background"], "why": ["free 與 donations 限定 charge 是收費義，不是充電；accuse 用 of 指控，不用 for 表收費。", "lead groups 表帶領，lead 在此不是金屬鉛。", "explain background 指歷史脈絡；foreground 是空間前景。"], "evidence": ["The museum does not {charge} visitors for its guided tours.", "Volunteers {lead} small groups through the galleries and explain the {background} of selected objects.", "Volunteers {lead} small groups through the galleries and explain the {background} of selected objects."], "type": 23, "level": 2, "tags": ["Semantics"], "slot": 0}, {"id": "P071", "title": "提出疑慮", "en": "During the meeting, a resident {raised} a concern about traffic noise. The chair agreed to {address} the issue before approving the plan. A written {record} of the discussion would be sent to everyone.", "zh": "會議中，一位居民提出交通噪音疑慮。主席同意核准計畫前處理此事。討論的書面紀錄將寄給所有人。", "bank": [{"word": "raised", "zh": "提出／提高", "pos": "V"}, {"word": "lifted", "zh": "抬起", "pos": "V"}, {"word": "envelope", "zh": "信封", "pos": "N"}, {"word": "record", "zh": "紀錄", "pos": "N"}, {"word": "address", "zh": "處理／地址", "pos": "V/N"}], "answers": ["raised", "address", "record"], "why": ["raise a concern 是提出疑慮，非物理 lifted。", "address the issue 是處理議題，不能把 address 只解作地址。", "written record 指討論文字紀錄；envelope 是容器，不能表示內容本身。"], "evidence": ["During the meeting, a resident {raised} a concern about traffic noise.", "The chair agreed to {address} the issue before approving the plan.", "A written {record} of the discussion would be sent to everyone."], "type": 23, "level": 3, "tags": ["Semantics"], "slot": 1}, {"id": "P072", "title": "清楚的論點", "en": "The speaker's main {point} was that convenience can create hidden waste. To make it {clear}, she compared two lunch habits. The example gave her argument more {weight} than a list of slogans would have.", "zh": "講者重點是便利可能造成隱藏垃圾。為說清楚，她比較兩種午餐習慣。這個例子比一串口號更能增加論點分量。", "bank": [{"word": "spot", "zh": "地點", "pos": "N"}, {"word": "weight", "zh": "分量／說服力", "pos": "N"}, {"word": "point", "zh": "重點／點", "pos": "N"}, {"word": "mass", "zh": "質量", "pos": "N"}, {"word": "clear", "zh": "清楚的", "pos": "Adj"}], "answers": ["point", "clear", "weight"], "why": ["main point 在演說中指論點，不是位置 spot。", "make it clear 表讓意思清楚，不是在描述透明材質。", "argument weight 是說服分量，比喻义；mass 不能如此慣用表論據強度。"], "evidence": ["The speaker's main {point} was that convenience can create hidden waste.", "To make it {clear}, she compared two lunch habits.", "The example gave her argument more {weight} than a list of slogans would have."], "type": 23, "level": 4, "tags": ["Semantics"], "slot": 2}, {"id": "P073", "title": "排隊縮短了", "en": "The clinic introduced appointments to reduce waiting. Average queues became {shorter}, and complaints {declined}. The staff viewed these changes as an {improvement}, although busy days remained difficult.", "zh": "診所導入預約以減少等待。平均隊伍變短，抱怨減少。工作人員將變化視為改善，儘管忙碌日子仍有困難。", "bank": [{"word": "shorter", "zh": "更短的", "pos": "Adj"}, {"word": "declined", "zh": "減少", "pos": "V"}, {"word": "longer", "zh": "更長的", "pos": "Adj"}, {"word": "improvement", "zh": "改善", "pos": "N"}, {"word": "increased", "zh": "增加", "pos": "V"}], "answers": ["shorter", "declined", "improvement"], "why": ["reduce waiting 與正面總評支持 shorter；longer 方向相反。", "抱怨隨等待減少而 declined；increased 需額外轉折證據。", "remaining difficult 是保留，不抹除整體 improvement。"], "evidence": ["Average queues became {shorter}, and complaints {declined}.", "Average queues became {shorter}, and complaints {declined}.", "The staff viewed these changes as an {improvement}, although busy days remained difficult."], "type": 24, "level": 2, "tags": ["Logic", "Semantics"], "slot": 0}, {"id": "P074", "title": "鹽分的累積", "en": "For years, poor drainage trapped irrigation water in the field. As the water evaporated, salt levels {increased}. Crop yields then {fell}. Farmers needed to reverse this {trend} before the soil became unusable.", "zh": "多年來排水不良使灌溉水滯留。水蒸發後，鹽分濃度增加，作物產量隨後下降。農民必須在土壤無法使用前扭轉趨勢。", "bank": [{"word": "trend", "zh": "趨勢", "pos": "N"}, {"word": "decreased", "zh": "減少", "pos": "V"}, {"word": "rose", "zh": "上升", "pos": "V"}, {"word": "fell", "zh": "下降", "pos": "V"}, {"word": "increased", "zh": "增加", "pos": "V"}], "answers": ["increased", "fell", "trend"], "why": ["水蒸發留下鹽，濃度 increased；decreased 與累積機制相反。", "土壤逐漸 unusable，產量 fell，不是 rose。", "reverse this trend 指扭轉前述惡化走向。"], "evidence": ["As the water evaporated, salt levels {increased}.", "Crop yields then {fell}.", "Farmers needed to reverse this {trend} before the soil became unusable."], "type": 24, "level": 3, "tags": ["Logic", "Semantics"], "slot": 1}, {"id": "P075", "title": "信任的重建", "en": "After a misleading advertisement, customers became {skeptical} of the company. It responded by publishing independent test results. Over time, transparent reporting helped {restore} trust, though full confidence returned only {gradually}.", "zh": "誤導廣告之後，顧客對公司起疑。公司以公布獨立測試結果回應。透明報告逐漸幫助恢復信任，但完整信心只慢慢回來。", "bank": [{"word": "destroy", "zh": "摧毀", "pos": "V"}, {"word": "gradually", "zh": "逐漸地", "pos": "Adv"}, {"word": "restore", "zh": "恢復", "pos": "V"}, {"word": "skeptical", "zh": "懷疑的", "pos": "Adj"}, {"word": "trusting", "zh": "信任的", "pos": "Adj"}], "answers": ["skeptical", "restore", "gradually"], "why": ["misleading advertisement 引起 skeptical，trusting 方向相反。", "透明報告是回應修補，restore trust；destroy 會與後文信心回來矛盾。", "over time 與 only 表慢慢恢復，gradually。"], "evidence": ["After a misleading advertisement, customers became {skeptical} of the company.", "Over time, transparent reporting helped {restore} trust, though full confidence returned only {gradually}.", "Over time, transparent reporting helped {restore} trust, though full confidence returned only {gradually}."], "type": 24, "level": 4, "tags": ["Logic", "Semantics"], "slot": 2}, {"id": "P076", "title": "雨天備案", "en": "The fair can take place outdoors only if the ground is dry. If rain continues, the organizers will {relocate} it to the gym. This backup plan {depends} on the gym being available, so the team must {confirm} the booking first.", "zh": "園遊會只有地面乾燥時才能在戶外辦。若持續下雨，主辦方會把活動移至體育館。備案取決於場館可用，因此團隊必須先確認預訂。", "bank": [{"word": "ignore", "zh": "忽略", "pos": "V"}, {"word": "relocate", "zh": "遷移", "pos": "V"}, {"word": "depends", "zh": "取決於", "pos": "V"}, {"word": "cancel", "zh": "取消", "pos": "V"}, {"word": "confirm", "zh": "確認", "pos": "V"}], "answers": ["relocate", "depends", "confirm"], "why": ["it to the gym 是移動活動，relocate；cancel it to 不合且不表替代場地。", "備案成立條件是場館 available，depends on。", "必須先 confirm booking 才能確保前提，ignore 會破壞安排。"], "evidence": ["If rain continues, the organizers will {relocate} it to the gym.", "This backup plan {depends} on the gym being available, so the team must {confirm} the booking first.", "This backup plan {depends} on the gym being available, so the team must {confirm} the booking first."], "type": 25, "level": 2, "tags": ["Logic", "Semantics"], "slot": 0}, {"id": "P077", "title": "相關不等於原因", "en": "Students who joined the club reported higher reading scores. However, they may already have been eager readers. The link is a {correlation}, not proof of causation. To test the club's effect, researchers need a suitable {comparison} group and information about students' {initial} abilities.", "zh": "加入社團的學生回報較高閱讀分數，但他們可能原本就熱愛閱讀。此關係是相關，並非因果證明。要測試社團效果，需要適當比較組及學生起初能力的資訊。", "bank": [{"word": "comparison", "zh": "比較", "pos": "N"}, {"word": "initial", "zh": "起初的", "pos": "Adj"}, {"word": "correlation", "zh": "相關", "pos": "N"}, {"word": "cause", "zh": "原因", "pos": "N"}, {"word": "final", "zh": "最後的", "pos": "Adj"}], "answers": ["correlation", "comparison", "initial"], "why": ["may already have…提供選擇差異，僅能說 correlation；cause 超出證據。", "comparison group 可對照社團之外的情況。", "already 與原有差異要求 initial abilities；只看 final 無法分辨進步與起點。"], "evidence": ["The link is a {correlation}, not proof of causation.", "To test the club's effect, researchers need a suitable {comparison} group and information about students' {initial} abilities.", "To test the club's effect, researchers need a suitable {comparison} group and information about students' {initial} abilities."], "type": 25, "level": 3, "tags": ["Logic", "Semantics"], "slot": 1}, {"id": "P078", "title": "缺貨的原因", "en": "The shop sold out after a festival, but the manager did not immediately blame rising demand. A delivery had also been {delayed}. Because both factors could explain the {shortage}, she checked order records before reaching a {conclusion}.", "zh": "店家節慶後售罄，但店長未立刻歸因於需求上升。另有一批送貨延遲。因兩因素都能解釋短缺，她先查訂貨紀錄再下結論。", "bank": [{"word": "conclusion", "zh": "結論", "pos": "N"}, {"word": "surplus", "zh": "過剩", "pos": "N"}, {"word": "delayed", "zh": "延遲的", "pos": "V-en"}, {"word": "accelerated", "zh": "加快的", "pos": "V-en"}, {"word": "shortage", "zh": "短缺", "pos": "N"}], "answers": ["delayed", "shortage", "conclusion"], "why": ["另一可解釋缺貨的因素是送貨 delayed；accelerated 通常增加供應，方向相反。", "sold out 與供應不足是 shortage，非 surplus。", "先查紀錄再 reaching a conclusion，避免單因推斷。"], "evidence": ["A delivery had also been {delayed}.", "Because both factors could explain the {shortage}, she checked order records before reaching a {conclusion}.", "Because both factors could explain the {shortage}, she checked order records before reaching a {conclusion}."], "type": 25, "level": 4, "tags": ["Logic", "Semantics"], "slot": 2}, {"id": "P079", "title": "參加哪一種活動", "en": "Nora decided to {join} the chess club. She would also {attend} its weekly meetings and {take} part in the city tournament. Each activity gave her a different way to practice.", "zh": "諾拉決定加入西洋棋社，也會出席每週聚會並參加城市賽。每種活動提供不同練習方式。", "bank": [{"word": "enter", "zh": "進入／報名", "pos": "V"}, {"word": "join", "zh": "加入", "pos": "V"}, {"word": "take", "zh": "參與〔搭 part in〕", "pos": "V"}, {"word": "participate", "zh": "參與", "pos": "V"}, {"word": "attend", "zh": "出席", "pos": "V"}], "answers": ["join", "attend", "take"], "why": ["join the club 是加入團體；中文「參加」要依受詞選字。", "attend meetings 是出席會議；不能把加入社員團體的關係原封搬來。", "take part in 是整體詞塊；participate in 可用，但不能填成 participate part in。"], "evidence": ["Nora decided to {join} the chess club.", "She would also {attend} its weekly meetings and {take} part in the city tournament.", "She would also {attend} its weekly meetings and {take} part in the city tournament."], "type": 26, "level": 2, "tags": ["Collocation", "Semantics"], "slot": 0}, {"id": "P080", "title": "提醒天氣", "en": "The teacher told students to {pay} attention to the forecast. If a storm approached, they should {seek} shelter rather than stay under a tree. Following this advice could {reduce} the risk of injury.", "zh": "老師提醒學生注意天氣預報。若暴風雨接近，應尋找遮蔽處，不要留在樹下。遵循建議可降低受傷風險。", "bank": [{"word": "search", "zh": "搜尋", "pos": "V"}, {"word": "reduce", "zh": "降低", "pos": "V"}, {"word": "pay", "zh": "給予〔搭 attention〕", "pos": "V"}, {"word": "rise", "zh": "上升", "pos": "V"}, {"word": "seek", "zh": "尋求", "pos": "V"}], "answers": ["pay", "seek", "reduce"], "why": ["pay attention 是注意的詞塊，不能逐字把「注意」拆成任意動詞。", "seek shelter 表尋求避難處；search shelter 指搜索該處，找尋遮蔽要 search for shelter。", "reduce the risk 表降低風險；rise 不及物，不能接 risk，方向也相反。"], "evidence": ["The teacher told students to {pay} attention to the forecast.", "If a storm approached, they should {seek} shelter rather than stay under a tree.", "Following this advice could {reduce} the risk of injury."], "type": 26, "level": 3, "tags": ["Collocation", "Semantics"], "slot": 1}, {"id": "P081", "title": "拍照留念", "en": "At the village, students asked permission to {take} photographs of local crafts. They then {kept} in touch with the makers by email. The exchange helped them {gain} a deeper understanding of the work.", "zh": "在村莊裡，學生先徵求同意再拍當地工藝品的照片。之後他們以電子郵件和製作者保持聯絡。交流幫他們對工藝有更深理解。", "bank": [{"word": "win", "zh": "贏得", "pos": "V"}, {"word": "do", "zh": "做", "pos": "V"}, {"word": "take", "zh": "拍攝／拿取", "pos": "V"}, {"word": "kept", "zh": "保持", "pos": "V"}, {"word": "gain", "zh": "獲得", "pos": "V"}], "answers": ["take", "kept", "gain"], "why": ["take photographs 是此處普通拍照搭配；do photographs 不合此處拍照的慣用搭配。", "kept in touch 為保持聯絡的詞塊。", "gain an understanding 表加深理解，不用競爭義 win。"], "evidence": ["At the village, students asked permission to {take} photographs of local crafts.", "They then {kept} in touch with the makers by email.", "The exchange helped them {gain} a deeper understanding of the work."], "type": 26, "level": 4, "tags": ["Collocation", "Semantics"], "slot": 2}, {"id": "P082", "title": "正式申請", "en": "The notice asks applicants to {submit} all documents by Friday. Incomplete applications will not be {processed}. Anyone needing assistance should {contact} the office during business hours.", "zh": "通知要求申請者週五前提交所有文件。不完整的申請不予處理。需要協助者請在辦公時間聯絡辦公室。", "bank": [{"word": "chuck", "zh": "隨手扔", "pos": "V"}, {"word": "processed", "zh": "處理", "pos": "V-en"}, {"word": "ghost", "zh": "不回應／突然斷聯", "pos": "V"}, {"word": "contact", "zh": "聯絡", "pos": "V"}, {"word": "submit", "zh": "提交", "pos": "V"}], "answers": ["submit", "processed", "contact"], "why": ["正式申請通知用 submit documents；chuck 指隨手扔，既不合語域也不合提交程序。", "applications processed 為行政處理。", "needing assistance 應 contact；ghost office 是不回應，目的與場合均不合。"], "evidence": ["The notice asks applicants to {submit} all documents by Friday.", "Incomplete applications will not be {processed}.", "Anyone needing assistance should {contact} the office during business hours."], "type": 27, "level": 2, "tags": ["Semantics"], "slot": 0}, {"id": "P083", "title": "學術摘要", "en": "The abstract states that the study will {examine} patterns of urban travel. Its findings {indicate} a relationship between distance and transport choice. The author avoids slang to maintain a {formal} register.", "zh": "摘要指出研究將檢視城市交通模式。發現顯示距離與交通選擇之間的關係。作者避免俚語以維持正式語域。", "bank": [{"word": "examine", "zh": "檢視", "pos": "V"}, {"word": "chatty", "zh": "閒聊式的", "pos": "Adj"}, {"word": "eyeball", "zh": "粗略目測", "pos": "V"}, {"word": "indicate", "zh": "顯示", "pos": "V"}, {"word": "formal", "zh": "正式的", "pos": "Adj"}], "answers": ["examine", "indicate", "formal"], "why": ["摘要需有系統 examine，eyeball 為隨意目測，與研究語域不合。", "findings indicate 為審慎陳述證據的用法。", "avoids slang 支持 formal，chatty 方向相反。"], "evidence": ["The abstract states that the study will {examine} patterns of urban travel.", "Its findings {indicate} a relationship between distance and transport choice.", "The author avoids slang to maintain a {formal} register."], "type": 27, "level": 3, "tags": ["Semantics"], "slot": 1}, {"id": "P084", "title": "朋友的簡訊", "en": "In a text to a close friend, Eli wrote, \"Want to {grab} lunch after class?\" The casual invitation matched their familiar {relationship}. A phrase like \"request your attendance\" would sound unnecessarily {stiff} in that exchange.", "zh": "伊萊傳簡訊給好友：「下課要不要去吃午餐？」隨性的邀請符合熟識關係。「請求您出席」在這次互動中會顯得過度拘謹。", "bank": [{"word": "grab", "zh": "隨意去吃／抓取", "pos": "V"}, {"word": "stiff", "zh": "拘謹的", "pos": "Adj"}, {"word": "procure", "zh": "取得〔正式〕", "pos": "V"}, {"word": "relationship", "zh": "關係", "pos": "N"}, {"word": "relaxed", "zh": "輕鬆的", "pos": "Adj"}], "answers": ["grab", "relationship", "stiff"], "why": ["grab lunch 是朋友間自然口語；procure lunch 太正式且偏取得食物。", "familiar relationship 解釋口語選擇。", "request your attendance 和好友簡訊語域不合，故 stiff；不是 relaxed。"], "evidence": ["In a text to a close friend, Eli wrote, \"Want to {grab} lunch after class?\" The casual invitation matched their familiar {relationship}.", "In a text to a close friend, Eli wrote, \"Want to {grab} lunch after class?\" The casual invitation matched their familiar {relationship}.", "A phrase like \"request your attendance\" would sound unnecessarily {stiff} in that exchange."], "type": 27, "level": 4, "tags": ["Semantics"], "slot": 2}, {"id": "P085", "title": "客氣的保留", "en": "Asked whether he liked the film, Jun said, \"The scenery was lovely.\" He said nothing about the acting or story. His selective {praise} may imply a reservation. It should not automatically be read as an {enthusiastic} endorsement of the {whole} film.", "zh": "被問是否喜歡電影時，俊說：「景色很漂亮。」他沒提演技或故事。選擇性稱讚可能暗示保留，不應自動解作對整部電影的熱烈肯定。", "bank": [{"word": "enthusiastic", "zh": "熱烈的", "pos": "Adj"}, {"word": "criticism", "zh": "批評", "pos": "N"}, {"word": "certain", "zh": "確定的", "pos": "Adj"}, {"word": "whole", "zh": "整部的", "pos": "Adj"}, {"word": "praise", "zh": "稱讚", "pos": "N"}], "answers": ["praise", "enthusiastic", "whole"], "why": ["lovely 是 praise，表面不是 criticism；保留是語用推測，故 may。", "not automatically…endorsement 警惕把局部稱讚當 enthusiastic 支持。", "只提 scenery，不能擴至 whole film。"], "evidence": ["His selective {praise} may imply a reservation.", "It should not automatically be read as an {enthusiastic} endorsement of the {whole} film.", "It should not automatically be read as an {enthusiastic} endorsement of the {whole} film."], "type": 28, "level": 2, "tags": ["Semantics"], "slot": 0}, {"id": "P086", "title": "引號中的準時", "en": "The bus arrived forty minutes late. \"Perfectly {punctual}, as usual,\" a passenger muttered. The mismatch between words and events signals {irony}. The remark expresses {frustration}, not genuine approval.", "zh": "公車晚了四十分鐘。一位乘客低聲說：「一如往常，真準時。」言語與事件的落差表示反諷。這話表達挫折與不滿，而非真心贊同。", "bank": [{"word": "irony", "zh": "反諷", "pos": "N"}, {"word": "gratitude", "zh": "感激", "pos": "N"}, {"word": "frustration", "zh": "挫折／不滿", "pos": "N"}, {"word": "delayed", "zh": "延誤的", "pos": "Adj"}, {"word": "punctual", "zh": "準時的", "pos": "Adj"}], "answers": ["punctual", "irony", "frustration"], "why": ["late 與 perfectly punctual 相反才構成後句說的反諷；delayed 就是字面描述。", "mismatch signals irony，不宜只按表面褒義讀。", "晚40分鐘又 muttered，支持 frustration；非 gratitude。"], "evidence": ["\"Perfectly {punctual}, as usual,\" a passenger muttered.", "The mismatch between words and events signals {irony}.", "The remark expresses {frustration}, not genuine approval."], "type": 28, "level": 3, "tags": ["Semantics"], "slot": 1}, {"id": "P087", "title": "婉拒邀約", "en": "Sara replied, \"I'd love to help, but my schedule is full this week.\" The phrase before but softens a {refusal}. Her message is {polite}, yet it does not amount to a {commitment} to join the project.", "zh": "莎拉回覆：「我很想幫忙，但我這週行程已滿。」but 前面的語句緩和拒絕。訊息很有禮貌，卻不等於承諾參與計畫。", "bank": [{"word": "commitment", "zh": "承諾", "pos": "N"}, {"word": "polite", "zh": "有禮貌的", "pos": "Adj"}, {"word": "refusal", "zh": "拒絕", "pos": "N"}, {"word": "hostile", "zh": "敵意的", "pos": "Adj"}, {"word": "acceptance", "zh": "接受", "pos": "N"}], "answers": ["refusal", "polite", "commitment"], "why": ["but my schedule is full 指無法答應，refusal；不能只讀 I'd love 當 acceptance。", "緩和拒絕是 polite，沒有 hostile 證據。", "does not amount to a commitment 防止把客氣意願當實際承諾。"], "evidence": ["Sara replied, \"I'd love to help, but my schedule is full this week.\" The phrase before but softens a {refusal}.", "Her message is {polite}, yet it does not amount to a {commitment} to join the project.", "Her message is {polite}, yet it does not amount to a {commitment} to join the project."], "type": 28, "level": 4, "tags": ["Semantics"], "slot": 2}, {"id": "P088", "title": "重新使用包裝", "en": "The shop chose {reusable} boxes that customers could return and use again. This reduced the need for {disposable} packaging. The change was not cost-free, but it made unnecessary waste more {avoidable}.", "zh": "商店選用顧客可歸還再用的盒子，減少一次性包裝需求。改變並非零成本，卻讓不必要的浪費更能避免。", "bank": [{"word": "reusable", "zh": "可重複使用的", "pos": "Adj"}, {"word": "avoidable", "zh": "可避免的", "pos": "Adj"}, {"word": "disposable", "zh": "用完即丟的", "pos": "Adj"}, {"word": "unusable", "zh": "無法使用的", "pos": "Adj"}, {"word": "unavoidable", "zh": "不可避免的", "pos": "Adj"}], "answers": ["reusable", "disposable", "avoidable"], "why": ["re- 與 use again 相應；unusable 的 un- 表不能使用。", "disposable 指用後丟棄，為可重用盒所取代。", "改變減少浪費使之 avoidable；unavoidable 表無法避免，方向相反。"], "evidence": ["The shop chose {reusable} boxes that customers could return and use again.", "This reduced the need for {disposable} packaging.", "The change was not cost-free, but it made unnecessary waste more {avoidable}."], "type": 29, "level": 1, "tags": ["POS", "Semantics"], "slot": 0}, {"id": "P089", "title": "看不見的墨水", "en": "The ink was initially {invisible} on the white paper. Gentle heat made the writing appear. Students could then {decode} the message by replacing each symbol with a letter. The activity showed that something {unseen} may still be present.", "zh": "墨水起初在白紙上看不見，輕微加熱後字跡出現。學生再把符號替換成字母以解碼。活動顯示看不見的事物仍可能存在。", "bank": [{"word": "unseen", "zh": "未被看見的", "pos": "Adj"}, {"word": "invisible", "zh": "看不見的", "pos": "Adj"}, {"word": "decode", "zh": "解碼", "pos": "V"}, {"word": "encode", "zh": "編碼", "pos": "V"}, {"word": "visible", "zh": "可見的", "pos": "Adj"}], "answers": ["invisible", "decode", "unseen"], "why": ["in- 否定 visible，加熱後才 appear，故 invisible。", "把符號還原成字母是 decode，encode 方向相反。", "unseen 與 still present 區分未見和不存在。"], "evidence": ["The ink was initially {invisible} on the white paper.", "Students could then {decode} the message by replacing each symbol with a letter.", "The activity showed that something {unseen} may still be present."], "type": 29, "level": 2, "tags": ["POS", "Semantics"], "slot": 1}, {"id": "P090", "title": "跨國合作", "en": "Researchers from several countries formed an {international} team. They planned to {recheck} earlier measurements after discovering a faulty sensor. Repeating the tests would help prevent {misinterpretation} of the original results.", "zh": "多國研究者組成國際團隊。發現感測器故障後，他們計畫重新檢查先前測量。重做測試有助避免誤解原始結果。", "bank": [{"word": "misinterpretation", "zh": "誤解", "pos": "N"}, {"word": "international", "zh": "國際的", "pos": "Adj"}, {"word": "interpretation", "zh": "解釋", "pos": "N"}, {"word": "national", "zh": "國家的", "pos": "Adj"}, {"word": "recheck", "zh": "重新檢查", "pos": "V"}], "answers": ["international", "recheck", "misinterpretation"], "why": ["inter- 表之間，several countries 對應 international；national 只涉及一國。", "re- 表再一次，earlier measurements 需要 recheck。", "防止的是因故障導致的 misinterpretation，非阻止一切 interpretation。"], "evidence": ["Researchers from several countries formed an {international} team.", "They planned to {recheck} earlier measurements after discovering a faulty sensor.", "Repeating the tests would help prevent {misinterpretation} of the original results."], "type": 29, "level": 3, "tags": ["POS", "Semantics"], "slot": 2}, {"id": "P091", "title": "替樹留空間", "en": "The roots needed room to spread, so workers {removed} several paving stones. Rain could then {penetrate} the exposed soil. The change helped the tree {survive} the dry season.", "zh": "樹根需要擴展空間，因此工人移除幾塊鋪面石。雨水因而能滲入露出的土壤。改變幫樹度過乾季存活。", "bank": [{"word": "survive", "zh": "存活／度過", "pos": "V"}, {"word": "removed", "zh": "移除", "pos": "V"}, {"word": "added", "zh": "增加", "pos": "V"}, {"word": "penetrate", "zh": "滲入", "pos": "V"}, {"word": "evaporate", "zh": "蒸發", "pos": "V"}], "answers": ["removed", "penetrate", "survive"], "why": ["needed room 與 exposed soil 指移除 removed，不是 added。", "雨水進入土壤用 penetrate；evaporate 是變成氣體，不能在此接受詞 soil。", "取得水分幫樹 survive，和乾季壓力構成因果。"], "evidence": ["The roots needed room to spread, so workers {removed} several paving stones.", "Rain could then {penetrate} the exposed soil.", "The change helped the tree {survive} the dry season."], "type": 30, "level": 2, "tags": ["Semantics"], "slot": 0}, {"id": "P092", "title": "找回聲音", "en": "After the loudspeaker failed, the guide used a portable amplifier to {project} her voice. People at the back could finally {understand} the instructions. Clear communication helped {prevent} confusion during the evacuation drill.", "zh": "擴音設備故障後，嚮導用攜帶式擴音器把聲音傳遠。後方的人終於聽懂指示。清楚溝通有助防止疏散演練中的混亂。", "bank": [{"word": "swallow", "zh": "吞下", "pos": "V"}, {"word": "create", "zh": "造成", "pos": "V"}, {"word": "understand", "zh": "理解", "pos": "V"}, {"word": "project", "zh": "傳送／投射", "pos": "V"}, {"word": "prevent", "zh": "防止", "pos": "V"}], "answers": ["project", "understand", "prevent"], "why": ["amplifier 用來 project voice，使聲音傳遠；swallow voice 不合此事件目的。", "people 是理解指示的主體，understand 合乎角色。", "clear communication 減少混亂，prevent；create 方向相反。"], "evidence": ["After the loudspeaker failed, the guide used a portable amplifier to {project} her voice.", "People at the back could finally {understand} the instructions.", "Clear communication helped {prevent} confusion during the evacuation drill."], "type": 30, "level": 3, "tags": ["Semantics"], "slot": 1}, {"id": "P093", "title": "保留生物的距離", "en": "Visitors were told to {observe} the seals from a distance. Approaching them could {disturb} their rest. Keeping space allowed people to enjoy the animals without causing unnecessary {stress}.", "zh": "遊客被告知應遠距觀察海豹。靠近可能打擾牠們休息。保持距離能讓人欣賞動物，同時不造成不必要壓力。", "bank": [{"word": "observe", "zh": "觀察", "pos": "V"}, {"word": "embrace", "zh": "擁抱", "pos": "V"}, {"word": "disturb", "zh": "打擾", "pos": "V"}, {"word": "stress", "zh": "壓力", "pos": "N"}, {"word": "comfort", "zh": "安慰／舒適", "pos": "V/N"}], "answers": ["observe", "disturb", "stress"], "why": ["from a distance 可以 observe，無法 embrace，兩者行為條件不同。", "靠近的風險是 disturb rest，非 comfort。", "without causing unnecessary stress 呼應保持距離的保護目的。"], "evidence": ["Visitors were told to {observe} the seals from a distance.", "Approaching them could {disturb} their rest.", "Keeping space allowed people to enjoy the animals without causing unnecessary {stress}."], "type": 30, "level": 4, "tags": ["Semantics"], "slot": 2}, {"id": "P094", "title": "關係子句的線索", "en": "The bridge, {which} was built by local workers, links two villages. People {living} on either side use it daily. Although narrow, it {provides} a safe crossing during the rainy season.", "zh": "這座由當地工人興建的橋連接兩個村莊。住兩側的人每天使用。橋雖窄，卻在雨季提供安全通道。", "bank": [{"word": "live", "zh": "居住", "pos": "V"}, {"word": "living", "zh": "居住的", "pos": "V-ing"}, {"word": "that", "zh": "那／關係代名詞", "pos": "Pron"}, {"word": "provides", "zh": "提供", "pos": "V"}, {"word": "which", "zh": "它／該物〔關係代名詞〕", "pos": "Pron"}], "answers": ["which", "living", "provides"], "why": ["逗號後非限定關係子句用 which，不用 that。", "People living… 中 living 修飾人，主句動詞已是 use；live 會多出沒有連接的限定動詞。", "it 是主詞，Although narrow 為讓步省略結構，provides 完成主句。"], "evidence": ["The bridge, {which} was built by local workers, links two villages.", "People {living} on either side use it daily.", "Although narrow, it {provides} a safe crossing during the rainy season."], "type": 31, "level": 1, "tags": ["Grammar", "Semantics"], "slot": 0}, {"id": "P095", "title": "被風打倒的樹", "en": "The tree {damaged} by the storm stood beside a busy path. Workers removed branches {that} might fall on visitors. After the area was cleared, the park {reopened} to the public.", "zh": "受暴風雨損傷的樹立在繁忙步道旁。工人移除可能掉落砸到遊客的枝條。區域清理後，公園重新開放。", "bank": [{"word": "damaged", "zh": "受損的", "pos": "V-en"}, {"word": "reopened", "zh": "重新開放", "pos": "V"}, {"word": "that", "zh": "那些／關係代名詞", "pos": "Pron"}, {"word": "what", "zh": "什麼／所…的事物", "pos": "Pron"}, {"word": "damaging", "zh": "造成傷害的", "pos": "V-ing"}], "answers": ["damaged", "that", "reopened"], "why": ["tree 是被暴風雨損害，用 damaged 被動分詞；damaging 會指樹主動造成傷害。", "先行詞 branches 已存在，that 引導修飾子句；what 不能再接既有先行詞。", "After 子句後主句 the park reopened，表示事件後續。"], "evidence": ["The tree {damaged} by the storm stood beside a busy path.", "Workers removed branches {that} might fall on visitors.", "After the area was cleared, the park {reopened} to the public."], "type": 31, "level": 2, "tags": ["Grammar", "Semantics"], "slot": 1}, {"id": "P096", "title": "雖然下雨", "en": "{Although} the rain was heavy, the indoor workshop continued. The participants, {whose} outdoor plans had changed, learned to weave baskets. The instructor kept everyone {engaged} by giving each person a task.", "zh": "雖然雨很大，室內工作坊仍繼續。戶外計畫改變的參與者學編籃。講師分派任務給每個人，讓大家持續投入。", "bank": [{"word": "who", "zh": "誰／關係代名詞", "pos": "Pron"}, {"word": "engaged", "zh": "投入的", "pos": "Adj/V-en"}, {"word": "Although", "zh": "雖然", "pos": "Conj"}, {"word": "Despite", "zh": "儘管", "pos": "Prep"}, {"word": "whose", "zh": "其／…的〔關係詞〕", "pos": "Pron"}], "answers": ["Although", "whose", "engaged"], "why": ["空格後完整子句 the rain was heavy，需要 Although；Despite 後要名詞或動名詞。", "whose outdoor plans 表參與者的計畫；who 後不能直接接名詞 outdoor plans 作所有關係。", "keep everyone engaged 為受詞補語，表示使每個人維持投入狀態。"], "evidence": ["{Although} the rain was heavy, the indoor workshop continued.", "The participants, {whose} outdoor plans had changed, learned to weave baskets.", "The instructor kept everyone {engaged} by giving each person a task."], "type": 31, "level": 3, "tags": ["Grammar", "Semantics"], "slot": 2}, {"id": "P097", "title": "先保留作答理由", "en": "A student chose a word that did not fit the passage but could not explain the choice. The teacher treated the error as a {signal}, not a diagnosis. She requested more {evidence} and planned a different passage to check whether the difficulty would {recur}.", "zh": "學生選了不合篇章的字，卻無法說明理由。老師把錯誤當訊號，而非診斷。她要求更多證據，並安排不同文章觀察困難是否再出現。", "bank": [{"word": "recur", "zh": "再出現", "pos": "V"}, {"word": "vanish", "zh": "消失", "pos": "V"}, {"word": "evidence", "zh": "證據", "pos": "N"}, {"word": "signal", "zh": "訊號", "pos": "N"}, {"word": "verdict", "zh": "定論", "pos": "N"}], "answers": ["signal", "evidence", "recur"], "why": ["not a diagnosis 明確排除 verdict，只能是 signal。", "more evidence 是教師複核需要的資料。", "whether difficulty recur 表觀察同困難是否重現；不是先假定一定持續。"], "evidence": ["The teacher treated the error as a {signal}, not a diagnosis.", "She requested more {evidence} and planned a different passage to check whether the difficulty would {recur}.", "She requested more {evidence} and planned a different passage to check whether the difficulty would {recur}."], "type": 32, "level": 3, "tags": ["Global", "Semantics"], "slot": 0}, {"id": "P098", "title": "猜對不等於理解", "en": "Two students selected the correct word. One identified a clear clue; the other admitted it was a {guess}. Their scores matched, but their reasoning was {different}. The teacher therefore avoided making the same {judgment} about both learners.", "zh": "兩名學生選對單字，一人找出清楚線索，另一人承認是猜的。分數相同，推理卻不同。因此老師避免對兩人的理解做相同判斷。", "bank": [{"word": "proof", "zh": "證明", "pos": "N"}, {"word": "identical", "zh": "相同的", "pos": "Adj"}, {"word": "guess", "zh": "猜測", "pos": "N"}, {"word": "judgment", "zh": "判斷", "pos": "N"}, {"word": "different", "zh": "不同的", "pos": "Adj"}], "answers": ["guess", "different", "judgment"], "why": ["admitted 對比 clear clue，guess 表無據選擇；不是 proof。", "but 對比分數相同與推理 different；identical 不合。", "不能只用分數做相同 judgment，需要過程證據。"], "evidence": ["One identified a clear clue; the other admitted it was a {guess}.", "Their scores matched, but their reasoning was {different}.", "The teacher therefore avoided making the same {judgment} about both learners."], "type": 32, "level": 4, "tags": ["Global", "Semantics"], "slot": 1}, {"id": "P099", "title": "換文後再觀察", "en": "In a new passage, the learner again missed a contrast clue. This repeated {pattern} justified closer review, but not an automatic label. The teacher discussed the student's reasoning before {confirming} a category. If the evidence remained weak, the result stayed {uncertain}.", "zh": "在新文章中，學生再次漏看轉折線索。重複模式值得進一步檢視，但不宜自動貼標籤。老師先討論作答推理，再確認類別。若證據仍弱，結果維持不確定。", "bank": [{"word": "certain", "zh": "確定的", "pos": "Adj"}, {"word": "confirming", "zh": "確認", "pos": "V-ing"}, {"word": "proving", "zh": "證明", "pos": "V-ing"}, {"word": "pattern", "zh": "模式", "pos": "N"}, {"word": "uncertain", "zh": "不確定的", "pos": "Adj"}], "answers": ["pattern", "confirming", "uncertain"], "why": ["again 與 repeated 表重複 pattern，但文中否定自動分類。", "discussed…before confirming 表經複核確認，不是宣称 proving 類別為絕對真相。", "if evidence weak 則 uncertain；不能因第二次錯就改成 certain。"], "evidence": ["This repeated {pattern} justified closer review, but not an automatic label.", "The teacher discussed the student's reasoning before {confirming} a category.", "If the evidence remained weak, the result stayed {uncertain}."], "type": 32, "level": 5, "tags": ["Global", "Semantics"], "slot": 2}, {"id": "P100", "title": "一條河的兩種任務", "en": "For decades, a concrete channel carried rainwater quickly through the town. Engineers had designed it to {prevent} flooding, and many residents considered it a success. Yet its steep walls left little room for plants or animals. When the town proposed a redesign, the debate was not simply about beauty. It concerned how one place could serve {multiple} purposes. The new plan kept a deep central channel but added planted shelves along the sides. These {features} created habitats without blocking the main flow. Some residents remained {skeptical}, fearing that vegetation would slow the water. The team therefore ran tests before construction. The results {suggested} that the design could work under ordinary conditions; they did not guarantee safety in every possible storm. Officials described the evidence as {promising}, rather than final. After the first section opened, volunteers began to {record} water levels and wildlife sightings. Their observations would guide later {adjustments}. The project thus treated restoration as an ongoing {process}, not a single finished event. Its broader lesson was that public spaces require both careful design and continued {attention}.", "zh": "數十年來，水泥渠道讓雨水快速流過小鎮。工程師原先設計它是為防洪，许多居民認為很成功。但陡峭壁面使動植物幾乎無處生存。小鎮提出改造時，辯論不只關乎美觀，更涉及同一空間如何兼顧多項用途。新計畫保留深中央水道，在兩側增植栽平台。這些設計創造棲地，又不阻擋主流。部分居民仍懷疑，擔心植被減慢水流。因此團隊施工前先測試。結果暗示設計在一般條件下可行，卻不保證每場可能的暴雨都安全。官員稱證據有希望，而非已定論。首段開放後，志工開始記錄水位與野生動物。觀察將引導後續調整。修復因此是持續過程，而非一次完成的事件。更廣泛的啟示是公共空間既需周密設計，也需持續關注。", "bank": [{"word": "features", "zh": "特徵／設施", "pos": "N"}, {"word": "attention", "zh": "關注", "pos": "N"}, {"word": "adjustments", "zh": "調整", "pos": "N"}, {"word": "process", "zh": "過程", "pos": "N"}, {"word": "suggested", "zh": "暗示", "pos": "V"}, {"word": "promising", "zh": "有希望的", "pos": "Adj"}, {"word": "record", "zh": "記錄", "pos": "V"}, {"word": "skeptical", "zh": "懷疑的", "pos": "Adj"}, {"word": "multiple", "zh": "多個的", "pos": "Adj"}, {"word": "prevent", "zh": "防止", "pos": "V"}], "answers": ["prevent", "multiple", "features", "skeptical", "suggested", "promising", "record", "adjustments", "process", "attention"], "why": ["防洪是渠道原始目的，prevent flooding。", "防洪與生態不只一項用途，multiple。", "These features 回指植栽平台。", "fearing… 表疑慮，不是支持。", "普通條件測試無法保證一切，suggested 保留推論強度。", "rather than final 表有希望但未定論，promising。", "begin to 後原形 record，同時表示蒐集監測資料。", "observations guide later adjustments 指根據觀測改良。", "ongoing 與非一次完成呼應 process。", "continued attention 呼應持續監測，而非建完即止。"], "evidence": ["Engineers had designed it to {prevent} flooding, and many residents considered it a success.", "It concerned how one place could serve {multiple} purposes.", "These {features} created habitats without blocking the main flow.", "Some residents remained {skeptical}, fearing that vegetation would slow the water.", "The results {suggested} that the design could work under ordinary conditions; they did not guarantee safety in every possible storm.", "Officials described the evidence as {promising}, rather than final.", "After the first section opened, volunteers began to {record} water levels and wildlife sightings.", "Their observations would guide later {adjustments}.", "The project thus treated restoration as an ongoing {process}, not a single finished event.", "Its broader lesson was that public spaces require both careful design and continued {attention}."], "type": 14, "level": 5, "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "slot": 3}, {"id": "P101", "title": "工具圖書館的考驗", "en": "A neighborhood library began lending tools as well as books. The idea seemed {practical}: most people needed a drill only a few times a year. Sharing could reduce both household spending and unnecessary purchases. At first, however, the staff focused mainly on collecting {equipment}. They soon discovered that ownership was only one part of the problem. Borrowers needed clear instructions, and returned tools required {inspection}. One damaged cable could make the next loan unsafe. To {address} these concerns, the library trained volunteers and introduced a checklist. Each item was checked {before} it went back onto the shelf. The system also recorded late returns, but the director warned against treating every delay as {carelessness}. Illness or transport problems could be involved. Instead of imposing the same response in every case, staff considered the {circumstances}. Six months later, the service had many regular users. That popularity was {encouraging}, although it did not by itself prove that the project saved resources overall. The library still needed to compare the costs of repair and transport with the purchases it had {replaced}. Its experience showed that a generous idea becomes sustainable through careful {management}.", "zh": "社區圖書館除了書也開始借工具。想法看來實用：多數人一年只用幾次電鑽。共享能減少家庭支出與不必要購買。但員工起初主要忙著收集設備，很快發現有工具只是問題的一部分。借用者需要清楚說明，歸還工具需要檢查；一條損壞電線就可能讓下一次借用不安全。圖書館為處理疑慮培訓志工並設清單。每件物品回架前都先檢查。系統也記錄晚還，但館長提醒不能把每次延誤都當粗心，可能涉及疾病或交通問題。員工考量個別情況，而非一律回應。半年後，服務已有許多固定使用者，令人鼓舞，但受歡迎本身並不能證明整體省資源。仍需比較維修、運輸成本和取代的購買。經驗顯示，慷慨構想需靠細心管理才能持續。", "bank": [{"word": "practical", "zh": "實用的", "pos": "Adj"}, {"word": "carelessness", "zh": "粗心", "pos": "N"}, {"word": "equipment", "zh": "設備", "pos": "N"}, {"word": "before", "zh": "之前", "pos": "Conj"}, {"word": "inspection", "zh": "檢查", "pos": "N"}, {"word": "circumstances", "zh": "情況", "pos": "N"}, {"word": "encouraging", "zh": "令人鼓舞的", "pos": "Adj"}, {"word": "replaced", "zh": "取代", "pos": "V-en"}, {"word": "management", "zh": "管理", "pos": "N"}, {"word": "address", "zh": "處理", "pos": "V"}], "answers": ["practical", "equipment", "inspection", "address", "before", "carelessness", "circumstances", "encouraging", "replaced", "management"], "why": ["一年只用數次的工具適合共享，practical。", "collecting equipment 指先備工具，下一句反思只擁有不夠。", "損壞電線風險需要 inspection。", "address concerns 是處理疑慮，非地址義。", "上架供人再借前檢查，before。", "館長避免把所有晚還歸因 carelessness，後文給替代原因。", "疾病與交通是個別 circumstances。", "受歡迎是 encouraging，但不等於證明省資源。", "共享取代了原本購買，replaced。", "培訓、檢查與個案處理共同指 management。"], "evidence": ["The idea seemed {practical}: most people needed a drill only a few times a year.", "At first, however, the staff focused mainly on collecting {equipment}.", "Borrowers needed clear instructions, and returned tools required {inspection}.", "To {address} these concerns, the library trained volunteers and introduced a checklist.", "Each item was checked {before} it went back onto the shelf.", "The system also recorded late returns, but the director warned against treating every delay as {carelessness}.", "Instead of imposing the same response in every case, staff considered the {circumstances}.", "That popularity was {encouraging}, although it did not by itself prove that the project saved resources overall.", "The library still needed to compare the costs of repair and transport with the purchases it had {replaced}.", "Its experience showed that a generous idea becomes sustainable through careful {management}."], "type": 10, "level": 5, "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "slot": 3}, {"id": "P102", "title": "城市夜色中的昆蟲", "en": "When a city replaced its streetlights, residents welcomed the brighter roads. A biology teacher asked a different question: how would the change {affect} insects? Her students placed observation sheets near several lamps and counted visits at fixed times. To keep the comparison {fair}, they used the same procedure at every location. They found more insects around some lamps than others. This {difference} was interesting, but its cause was not immediately clear. The locations also varied in temperature and nearby vegetation. The teacher therefore reminded the class that a pattern was not automatically an {explanation}. During a second trial, the students compared two lamp types in the same area. Their new records provided stronger {evidence} about the role of light. Even so, the findings applied only to the conditions they had {tested}. The class resisted the temptation to claim that one lamp was best {everywhere}. In their report, they described both the results and the {limitations}. The city agreed to consider a smaller trial rather than replace every light at once. For the students, the most valuable lesson was not a simple answer but a more {careful} way of asking questions. Scientific inquiry, they learned, depends on adjusting claims to match what observations actually {support}.", "zh": "城市更換路燈時，居民歡迎更明亮道路。生物老師問：改變如何影響昆蟲？學生在幾座燈旁設觀察表，固定時間計數到訪。為公平比較，各處程序一致。他們發現某些燈邊昆蟲更多，差異有趣，原因卻未明：各地溫度、植被也不同。老師提醒模式不自動等於解釋。第二次試驗在同區比較兩款燈，新紀錄提供更強證據。不過發現只適用受測條件。學生避免宣稱某款燈處處最佳，報告同時說明結果與限制。市府同意先做較小試辦，不一次換掉所有燈。學生最有價值的收穫不是簡單答案，而是更審慎提問。科學探究需調整主張，使之符合觀察實際能支持的範圍。", "bank": [{"word": "affect", "zh": "影響", "pos": "V"}, {"word": "explanation", "zh": "解釋", "pos": "N"}, {"word": "support", "zh": "支持", "pos": "V"}, {"word": "evidence", "zh": "證據", "pos": "N"}, {"word": "careful", "zh": "審慎的", "pos": "Adj"}, {"word": "limitations", "zh": "限制", "pos": "N"}, {"word": "fair", "zh": "公平的", "pos": "Adj"}, {"word": "difference", "zh": "差異", "pos": "N"}, {"word": "everywhere", "zh": "各處", "pos": "Adv"}, {"word": "tested", "zh": "測試", "pos": "V-en"}], "answers": ["affect", "fair", "difference", "explanation", "evidence", "tested", "everywhere", "limitations", "careful", "support"], "why": ["would 後用動詞 affect，指路燈對昆蟲作用。", "same procedure 是維持 fair comparison。", "more…than others 是 difference 的指涉。", "模式未排除其他因素，不自動成因果 explanation。", "控制區域後證據 evidence 較強。", "only 限制至已 tested 的條件。", "resisted claim best everywhere，避免無限擴大適用範圍。", "both results and limitations 表結果與限制並陳。", "比較、控制與保留表 careful 方法。", "claims match observations support，主張依證據而定。"], "evidence": ["A biology teacher asked a different question: how would the change {affect} insects?", "To keep the comparison {fair}, they used the same procedure at every location.", "This {difference} was interesting, but its cause was not immediately clear.", "The teacher therefore reminded the class that a pattern was not automatically an {explanation}.", "Their new records provided stronger {evidence} about the role of light.", "Even so, the findings applied only to the conditions they had {tested}.", "The class resisted the temptation to claim that one lamp was best {everywhere}.", "In their report, they described both the results and the {limitations}.", "For the students, the most valuable lesson was not a simple answer but a more {careful} way of asking questions.", "Scientific inquiry, they learned, depends on adjusting claims to match what observations actually {support}."], "type": 13, "level": 5, "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "slot": 3}, {"id": "P103", "title": "博物館裡的空白標籤", "en": "A small museum received a wooden box from a local family. No document explained its {origin}. The donors believed it had belonged to a traveling merchant, but this account came from a story repeated over several generations. The curator did not {reject} the story; she simply distinguished it from a verified fact. She examined the box and found a mark that {resembled} a maker's symbol in an old catalog. The similarity offered a useful {clue}, not a complete answer. A later search revealed that several workshops had used comparable marks. The team therefore kept the label {tentative}. Instead of inventing a precise date, it explained what was known and what remained {uncertain}. Some visitors found the incomplete story frustrating. Others appreciated being invited into the process of {investigation}. The museum added a display describing how evidence is compared and claims are {revised}. Months later, a visitor supplied a photograph showing a similar box in a shop. This new material did not solve every question, but it helped {narrow} the search. The exhibit ultimately became less about a single object's mystery and more about the {responsibility} of presenting knowledge honestly.", "zh": "小博物館收到當地家庭捐贈的木盒，沒有文件交代來源。捐贈者相信它曾屬旅行商人，但說法來自世代口傳。館員沒有否定故事，只把它與核實事實分開。她找到似乎與舊型錄製作者符號相近的記號。相似性是有用線索，而非完整答案。後來查出多間工坊用相近記號，因此標籤保持暫定。館方不編造精確日期，而說明已知與未知。部分訪客感到挫折，另一些欣賞能參與調查過程。館方加設展示，說明如何比較證據與修正主張。數月後，訪客提供商店中相似盒子的照片。新資料未解決一切，但縮小搜尋範圍。展覽最後更關乎誠實呈現知識的責任，而不只是一件物品的謎。", "bank": [{"word": "clue", "zh": "線索", "pos": "N"}, {"word": "origin", "zh": "來源", "pos": "N"}, {"word": "revised", "zh": "修正", "pos": "V-en"}, {"word": "investigation", "zh": "調查", "pos": "N"}, {"word": "narrow", "zh": "縮小", "pos": "V"}, {"word": "reject", "zh": "否定", "pos": "V"}, {"word": "tentative", "zh": "暫定的", "pos": "Adj"}, {"word": "responsibility", "zh": "責任", "pos": "N"}, {"word": "uncertain", "zh": "不確定的", "pos": "Adj"}, {"word": "resembled", "zh": "類似", "pos": "V"}], "answers": ["origin", "reject", "resembled", "clue", "tentative", "uncertain", "investigation", "revised", "narrow", "responsibility"], "why": ["缺文件及後文追溯所有人，是 origin。", "did not reject 表未否定口傳，只分清證據層級。", "similarity 回扣 resembled，並非完全相同。", "not a complete answer 限定為 clue。", "多工坊使用記號，標籤應 tentative。", "known and uncertain 對照已知與未定。", "比證據找來源屬 investigation。", "新資料使 claims revised，不保證原說法永不變。", "新照片提供方向，narrow the search。", "全文由物件轉向知識呈現的 responsibility。"], "evidence": ["No document explained its {origin}.", "The curator did not {reject} the story; she simply distinguished it from a verified fact.", "She examined the box and found a mark that {resembled} a maker's symbol in an old catalog.", "The similarity offered a useful {clue}, not a complete answer.", "The team therefore kept the label {tentative}.", "Instead of inventing a precise date, it explained what was known and what remained {uncertain}.", "Others appreciated being invited into the process of {investigation}.", "The museum added a display describing how evidence is compared and claims are {revised}.", "This new material did not solve every question, but it helped {narrow} the search.", "The exhibit ultimately became less about a single object's mystery and more about the {responsibility} of presenting knowledge honestly."], "type": 32, "level": 5, "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "slot": 3}, {"id": "P104", "title": "校園新聞的查證", "en": "An image of a locked gate spread through the school chat group. Its caption {claimed} that the library would close permanently. Many students forwarded it before checking the date. The student newspaper decided to {verify} the message. First, reporters located the original image. It had been taken during repairs two years {earlier}. Next, they contacted the librarian, who explained that the current closure would last only one afternoon. The image itself was real, but its new {context} made it misleading. The team published a correction and included links to the relevant notices. They avoided {accusing} individual students of deliberate dishonesty because careless sharing did not prove intent. Instead, the article described a simple checking {procedure}: locate the source, inspect the date, and compare the claim with current information. A follow-up survey found that some readers had changed their sharing habits. The editors welcomed this response but did not call it {universal}. Only a fraction of students had answered. The final article therefore balanced a positive {outcome} with a clear statement of its limits. Responsible reporting, it argued, requires the same {standards} when describing one's own success as when investigating someone else's story. Accuracy is a continuing {practice}, not a badge earned once.", "zh": "一張上鎖校門照片在校群傳播，圖說宣稱圖書館永久關閉。許多人未查日期便轉傳。校刊決定查證，先找原圖，發現拍於兩年前修繕期間；再聯絡館員，得知本次只關一下午。照片真實，新脈絡卻使它誤導。團隊刊更正並附公告連結，避免指控個別學生蓄意不誠實，因為粗心分享不等於證明意圖。文章介紹查核程序：找來源、查日期、與當前資訊比對。後續調查發現部分讀者改變分享習慣。編輯肯定成果，卻不稱人人都如此，因只有小部分學生作答。文章因此平衡正面成果與清楚限制，主張描述自身成功和調查他人故事應用相同標準。準確是持續實踐，而非一次取得的徽章。", "bank": [{"word": "verify", "zh": "查證", "pos": "V"}, {"word": "earlier", "zh": "更早", "pos": "Adv"}, {"word": "context", "zh": "脈絡", "pos": "N"}, {"word": "standards", "zh": "標準", "pos": "N"}, {"word": "universal", "zh": "普遍的", "pos": "Adj"}, {"word": "practice", "zh": "實踐", "pos": "N"}, {"word": "claimed", "zh": "宣稱", "pos": "V"}, {"word": "procedure", "zh": "程序", "pos": "N"}, {"word": "outcome", "zh": "成果", "pos": "N"}, {"word": "accusing", "zh": "指控", "pos": "V-ing"}], "answers": ["claimed", "verify", "earlier", "context", "accusing", "procedure", "universal", "outcome", "standards", "practice"], "why": ["caption claimed 是轉述，並不代表作者認同。", "後文找原圖、問館員屬 verify。", "had been taken two years earlier 為過去事件前兩年。", "同真照片放新 context 可誤導。", "avoid 後 accusing，accuse 人 of 行為，且不推測意圖。", "冒號後列操作順序，procedure。", "some 與 fraction 限制成果非 universal。", "positive outcome 指部分人改善習慣。", "same standards 要求對己對人同樣嚴謹。", "continuing practice 對比一次徽章，表持續行動。"], "evidence": ["Its caption {claimed} that the library would close permanently.", "The student newspaper decided to {verify} the message.", "It had been taken during repairs two years {earlier}.", "The image itself was real, but its new {context} made it misleading.", "They avoided {accusing} individual students of deliberate dishonesty because careless sharing did not prove intent.", "Instead, the article described a simple checking {procedure}: locate the source, inspect the date, and compare the claim with current information.", "The editors welcomed this response but did not call it {universal}.", "The final article therefore balanced a positive {outcome} with a clear statement of its limits.", "Responsible reporting, it argued, requires the same {standards} when describing one's own success as when investigating someone else's story.", "Accuracy is a continuing {practice}, not a badge earned once."], "type": 8, "level": 5, "tags": ["Logic", "Semantics", "Grammar", "Collocation", "Cohesion", "Global", "POS"], "slot": 3}, {"id": "P105", "title": "校園堆肥的改變", "en": "The school began collecting fruit peels for compost. At first, students showed little {interest} in the project. A teacher explained how food scraps could become {valuable} material for the garden. After seeing the results, students separated their waste more {carefully}. The amount sent to the landfill fell {considerably}. What began as a small experiment became a {successful} part of daily school life.", "zh": "學校開始收集果皮製作堆肥。起初學生對計畫興趣不大。老師解釋廚餘如何成為花園的珍貴材料。看到成果後，學生更仔細分類垃圾，送往掩埋場的量大幅減少。小實驗成了校園日常中成功的一環。", "bank": [{"word": "success", "zh": "成功", "pos": "N"}, {"word": "carefully", "zh": "仔細地", "pos": "Adv"}, {"word": "careful", "zh": "仔細的", "pos": "Adj"}, {"word": "valuable", "zh": "有價值的", "pos": "Adj"}, {"word": "interest", "zh": "興趣", "pos": "N"}, {"word": "successful", "zh": "成功的", "pos": "Adj"}, {"word": "considerably", "zh": "相當大幅地", "pos": "Adv"}], "answers": ["interest", "valuable", "carefully", "considerably", "successful"], "why": ["showed little interest 中 little 限定不可數名詞 interest。", "material 前用 valuable 說明材料的價值。", "separated 是動作，需 carefully 修飾方式；careful 是形容詞。", "fell considerably 表下降幅度；本格並非說垃圾仔細地下落。", "a successful part 需要形容詞；success 是名詞，不是此處表成功性質的形式。"], "evidence": ["At first, students showed little {interest} in the project.", "A teacher explained how food scraps could become {valuable} material for the garden.", "After seeing the results, students separated their waste more {carefully}.", "The amount sent to the landfill fell {considerably}.", "What began as a small experiment became a {successful} part of daily school life."], "type": 0, "level": 2, "tags": ["POS", "Semantics"], "slot": 4}, {"id": "P106", "title": "走廊的溫度地圖", "en": "The students, equipped with handheld sensors, {measured} temperatures around the school. A map of the readings {revealed} several hot spots. The corridor beside the kitchen, despite its open windows, {was} warmer than expected. Trees planted near the west wall {provided} shade in the afternoon. These observations, together with maintenance records, {helped} the principal decide where to add fans.", "zh": "學生帶著手持感測器測量校園溫度。讀值地圖顯示數個熱點。廚房旁走廊雖開著窗，仍比預期熱。西牆旁種的樹在午後提供遮蔭。這些觀察和維護紀錄協助校長決定增設風扇的位置。", "bank": [{"word": "helped", "zh": "幫助了", "pos": "V"}, {"word": "was", "zh": "是〔過去式單數〕", "pos": "V"}, {"word": "were", "zh": "是〔過去式複數〕", "pos": "V"}, {"word": "revealed", "zh": "顯示了", "pos": "V"}, {"word": "provided", "zh": "提供了", "pos": "V"}, {"word": "measuring", "zh": "測量中的", "pos": "V-ing"}, {"word": "measured", "zh": "測量了", "pos": "V"}], "answers": ["measured", "revealed", "was", "provided", "helped"], "why": ["equipped… 是修飾語，主句仍需 measured；measuring 不能單獨完成過去式述語。", "A map 是主詞，of the readings 不改主幹，revealed 後接 hot spots。", "核心 corridor 單數，故 was；不能受複數 windows 干擾選 were。", "Trees 後 planted… 是被動修飾，provided 才是主要動詞。", "These observations 是 helped 的主詞；together with… 為附加資訊。"], "evidence": ["The students, equipped with handheld sensors, {measured} temperatures around the school.", "A map of the readings {revealed} several hot spots.", "The corridor beside the kitchen, despite its open windows, {was} warmer than expected.", "Trees planted near the west wall {provided} shade in the afternoon.", "These observations, together with maintenance records, {helped} the principal decide where to add fans."], "type": 1, "level": 3, "tags": ["Grammar", "Semantics"], "slot": 4}, {"id": "P107", "title": "為夜讀設計的燈", "en": "Rui needed a lamp for a tiny shared room. Its arm had to be {adjustable} so she could direct light away from her roommate. A {stable} base would keep it from tipping over. She chose a model with a {dimmer}, which let her lower the brightness. It also used very little electricity, making it {efficient}. A {portable} design meant she could carry it to the study room.", "zh": "瑞需要適合狹小合住房間的燈。燈臂須可調整，才能讓光避開室友；穩固底座能避免傾倒。她選了有調光器的款式，可降低亮度。它耗電少，效率高；可攜式設計也讓她能帶到自習室。", "bank": [{"word": "dimmer", "zh": "調光器", "pos": "N"}, {"word": "efficient", "zh": "高效率的", "pos": "Adj"}, {"word": "stable", "zh": "穩固的", "pos": "Adj"}, {"word": "fragile", "zh": "易碎的", "pos": "Adj"}, {"word": "adjustable", "zh": "可調整的", "pos": "Adj"}, {"word": "portable", "zh": "可攜帶的", "pos": "Adj"}, {"word": "decorative", "zh": "裝飾性的", "pos": "Adj"}], "answers": ["adjustable", "stable", "dimmer", "efficient", "portable"], "why": ["direct light away 需能改變方向，adjustable；decorative 只描述美觀，不能保證方向可調。", "keep…from tipping over 是底座 stable 的證據；fragile 與穩固不同。", "which let her lower brightness 定義 dimmer 的功能。", "very little electricity 支持能源 efficient，不是單指容易移動。", "carry it to… 明確限定 portable，不能以一般正向形容詞替代。"], "evidence": ["Its arm had to be {adjustable} so she could direct light away from her roommate.", "A {stable} base would keep it from tipping over.", "She chose a model with a {dimmer}, which let her lower the brightness.", "It also used very little electricity, making it {efficient}.", "A {portable} design meant she could carry it to the study room."], "type": 2, "level": 3, "tags": ["Semantics"], "slot": 4}, {"id": "P108", "title": "兩個借書箱", "en": "The village placed a blue book box near the pier and a yellow one by the school. The first mainly served fishers, while the {latter} attracted children. Volunteers checked {both} boxes each Friday. If a book was damaged, they removed {it} for repair. This {routine} kept the collection usable. The villagers soon regarded the boxes as {shared} resources rather than private property.", "zh": "村莊在碼頭旁設藍色借書箱，學校旁設黃色箱。前者主要服務漁民，後者吸引兒童。志工每週五檢查兩個箱子。若有書損壞，就取出修補。這項例行工作維持館藏可用，村民也逐漸視箱子為共有資源而非私產。", "bank": [{"word": "shared", "zh": "共有的", "pos": "Adj"}, {"word": "them", "zh": "它們", "pos": "Pron"}, {"word": "both", "zh": "兩者都", "pos": "Det"}, {"word": "routine", "zh": "例行工作", "pos": "N"}, {"word": "former", "zh": "前者", "pos": "Pron"}, {"word": "latter", "zh": "後者", "pos": "Pron"}, {"word": "it", "zh": "它", "pos": "Pron"}], "answers": ["latter", "both", "it", "routine", "shared"], "why": ["latter 回指後提到的黃色箱；former 指藍箱，與 first 已指同物會破壞對比。", "已介紹恰好兩箱，用 both boxes。", "a book 單數，remove it；them 會回指複數而非受損的那本書。", "This routine 概括每週檢查和修書，不只回指單一本書。", "rather than private property 支持 shared resources。"], "evidence": ["The first mainly served fishers, while the {latter} attracted children.", "Volunteers checked {both} boxes each Friday.", "If a book was damaged, they removed {it} for repair.", "This {routine} kept the collection usable.", "The villagers soon regarded the boxes as {shared} resources rather than private property."], "type": 3, "level": 3, "tags": ["Cohesion", "Semantics"], "slot": 4}, {"id": "P109", "title": "午休的短暫步行", "en": "A class expected a short walk after lunch to waste study time. {Instead}, many students returned feeling more alert. The teacher repeated the activity for a week. {However}, she noticed that heavy rain made outdoor walks impractical. She therefore offered an indoor route as an {alternative}. The class kept both options, {because} the aim was movement rather than a particular location. The final plan was flexible {rather} than rigid.", "zh": "班上原以為午餐後散步浪費讀書時間，實際卻有許多學生精神更好。老師重複活動一週，但發現大雨使戶外步行難以實行。因此她提供室內路線作替代方案。兩種選項都保留，因為目標是活動身體而非限定地點。最後計畫有彈性而不僵化。", "bank": [{"word": "alternative", "zh": "替代方案", "pos": "N"}, {"word": "rather", "zh": "而不是〔搭 than〕", "pos": "Adv"}, {"word": "Similarly", "zh": "同樣地", "pos": "Adv"}, {"word": "although", "zh": "雖然", "pos": "Conj"}, {"word": "Instead", "zh": "反而", "pos": "Adv"}, {"word": "However", "zh": "然而", "pos": "Adv"}, {"word": "because", "zh": "因為", "pos": "Conj"}], "answers": ["Instead", "However", "alternative", "because", "rather"], "why": ["預期浪費與實際清醒反向，Instead；Similarly 會錯說結果相同。", "先有益處，再提雨天限制，However 為轉折。", "indoor route 在戶外不能走時取代之，為 alternative。", "後句解釋保留兩案的原因，用 because；不是和保留方案相反的 although。", "rather than rigid 表用彈性取代僵化的對比。"], "evidence": ["{Instead}, many students returned feeling more alert.", "{However}, she noticed that heavy rain made outdoor walks impractical.", "She therefore offered an indoor route as an {alternative}.", "The class kept both options, {because} the aim was movement rather than a particular location.", "The final plan was flexible {rather} than rigid."], "type": 4, "level": 4, "tags": ["Logic", "Semantics"], "slot": 4}, {"id": "P110", "title": "口述故事的保存", "en": "The team recorded memories of a closed railway station. These {interviews} captured details missing from official records. The spoken material was then turned into written {transcripts}. This {conversion} made the stories easier to search. To preserve the speakers' voices as well, the archive also kept the original {recordings}. Together, the two formats offered {complementary} ways to explore the past.", "zh": "團隊錄下人們對已關閉車站的回憶。訪談捕捉官方紀錄缺少的細節，口述材料再轉成逐字稿。這種轉換讓故事更容易搜尋。為同時保留受訪者聲音，檔案館也留下原錄音。兩種格式提供互補的歷史探索方式。", "bank": [{"word": "contradictory", "zh": "矛盾的", "pos": "Adj"}, {"word": "interviews", "zh": "訪談", "pos": "N"}, {"word": "transcripts", "zh": "逐字稿", "pos": "N"}, {"word": "complementary", "zh": "互補的", "pos": "Adj"}, {"word": "conversion", "zh": "轉換", "pos": "N"}, {"word": "destruction", "zh": "毀壞", "pos": "N"}, {"word": "recordings", "zh": "錄音", "pos": "N"}], "answers": ["interviews", "transcripts", "conversion", "recordings", "complementary"], "why": ["These interviews 承接前句蒐集人們回憶的訪談活動。", "spoken 轉 written，成果為 transcripts。", "This conversion 指口述轉文字；不是 destruction。", "preserve voices 需保留 recordings，不能只留文字。", "搜尋文字和聽見聲音各補足不同需求，complementary；未提供互相矛盾證據。"], "evidence": ["These {interviews} captured details missing from official records.", "The spoken material was then turned into written {transcripts}.", "This {conversion} made the stories easier to search.", "To preserve the speakers' voices as well, the archive also kept the original {recordings}.", "Together, the two formats offered {complementary} ways to explore the past."], "type": 5, "level": 3, "tags": ["Cohesion", "Semantics"], "slot": 4}, {"id": "P111", "title": "候鳥追蹤器", "en": "In March, scientists attached trackers to several birds. Three weeks {later}, the birds began their northward journey. By the time they reached the wetlands, they had {crossed} two mountain ranges. Researchers compared the new route with data collected the {previous} year. Only {after} the birds returned did the team recover the devices. The full analysis was therefore {postponed} until autumn.", "zh": "三月，科學家替幾隻鳥裝追蹤器。三週後，鳥開始北遷。到濕地時，牠們已越過兩條山脈。研究者拿新路線與前一年資料比較。直到鳥返回後，團隊才收回裝置，因此完整分析延到秋天。", "bank": [{"word": "earlier", "zh": "之前", "pos": "Adv"}, {"word": "postponed", "zh": "延後的", "pos": "V-en"}, {"word": "after", "zh": "在…之後", "pos": "Conj"}, {"word": "crossed", "zh": "越過", "pos": "V-en"}, {"word": "later", "zh": "之後", "pos": "Adv"}, {"word": "previous", "zh": "前一個的", "pos": "Adj"}, {"word": "following", "zh": "接下來的", "pos": "Adj"}], "answers": ["later", "crossed", "previous", "after", "postponed"], "why": ["March 裝設在先，遷徙在後，later；earlier 會倒置流程。", "By the time…had crossed 表到達濕地前已越山。",
