riginal image. It had been taken during repairs two years earlier. Next, they contacted the librarian, who explained that the current closure would last only one afternoon. The image itself was real, but its new context made it misleading. The team published a correction and included links to the relevant notices. They avoided accusing individual students of deliberate dishonesty because careless sharing did not prove intent. Instead, the article described a simple checking procedure: locate the source, inspect the date, and compare the claim with current information. A follow-up survey found that some readers had changed their sharing habits. The editors welcomed this response but did not call it universal. Only a fraction of students had answered. The final article therefore balanced a positive outcome with a clear statement of its limits. Responsible reporting, it argued, requires the same standards when describing one's own success as when investigating someone else's story. Accuracy is a continuing practice, not a badge earned once.", "zh": "一張上鎖校門照片在校群傳播，圖說宣稱圖書館永久關閉。許多人未查日期便轉傳。校刊決定查證，先找原圖，發現拍於兩年前修繕期間；再聯絡館員，得知本次只關一下午。照片真實，新脈絡卻使它誤導。團隊刊更正並附公告連結，避免指控個別學生蓄意不誠實，因為粗心分享不等於證明意圖。文章介紹查核程序：找來源、查日期、與當前資訊比對。後續調查發現部分讀者改變分享習慣。編輯肯定成果，卻不稱人人都如此，因只有小部分學生作答。文章因此平衡正面成果與清楚限制，主張描述自身成功和調查他人故事應用相同標準。準確是持續實踐，而非一次取得的徽章。"}]}, {"word": "version", "meanings": ["版本"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P033", "title": "一項發明的誕生", "blank": 3, "level": 5, "type": "文章組織", "evidence": "Failed tests appear before later improvements, helping readers understand how each problem shaped the next version.", "why": "next version 是裝置迭代；ancestor 不能表示裝置的下一版。", "en": "The essay traces a filter from an early sketch to a working device. Its main organizing principle is chronology. Failed tests appear before later improvements, helping readers understand how each problem shaped the next version.", "zh": "文章追溯濾器從早期草圖到可運作裝置的歷程。主要組織原則是時間順序。失敗測試先於後來的改良，讓讀者明白每個問題如何形塑下一個版本。"}]}, {"word": "visual", "meanings": ["視覺的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P008", "title": "無聲提醒", "blank": 1, "level": 3, "type": "局部精確語意", "evidence": "A visual signal tells readers when the room will close.", "why": "lamps instead of bells 指視覺，audible 指聽覺。", "en": "During exams, the library uses lamps instead of bells. A visual signal tells readers when the room will close. The light is bright enough to be noticeable, but it does not interrupt the silence students need.", "zh": "考試期間，圖書館用燈取代鈴聲。視覺訊號提醒讀者即將閉館。燈光亮得足以被注意，卻不打破學生需要的安靜。"}]}, {"word": "warned", "meanings": ["警告"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P063", "title": "山路警告", "blank": 1, "level": 3, "type": "句型判斷", "evidence": "The ranger warned hikers not to leave the marked path.", "why": "warn 人 not to V 表警告不要做；suggested 不接受這個人加不定詞結構。", "en": "The ranger warned hikers not to leave the marked path. Thick fog prevented them from seeing the cliff edge. Rather than continuing, they decided to wait at a shelter.", "zh": "巡山員警告健行者不要離開標示路徑。濃霧使他們看不見懸崖邊緣。他們決定在避難處等候，不再前進。"}]}, {"word": "was", "meanings": ["是〔過去式單數〕"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P106", "title": "走廊的溫度地圖", "blank": 3, "level": 3, "type": "文法骨架", "evidence": "The corridor beside the kitchen, despite its open windows, was warmer than expected.", "why": "核心 corridor 單數，故 was；不能受複數 windows 干擾選 were。", "en": "The students, equipped with handheld sensors, measured temperatures around the school. A map of the readings revealed several hot spots. The corridor beside the kitchen, despite its open windows, was warmer than expected. Trees planted near the west wall provided shade in the afternoon. These observations, together with maintenance records, helped the principal decide where to add fans.", "zh": "學生帶著手持感測器測量校園溫度。讀值地圖顯示數個熱點。廚房旁走廊雖開著窗，仍比預期熱。西牆旁種的樹在午後提供遮蔭。這些觀察和維護紀錄協助校長決定增設風扇的位置。"}]}, {"word": "weight", "meanings": ["分量／說服力"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P072", "title": "清楚的論點", "blank": 3, "level": 4, "type": "多義判斷", "evidence": "The example gave her argument more weight than a list of slogans would have.", "why": "argument weight 是說服分量，比喻义；mass 不能如此慣用表論據強度。", "en": "The speaker's main point was that convenience can create hidden waste. To make it clear, she compared two lunch habits. The example gave her argument more weight than a list of slogans would have.", "zh": "講者重點是便利可能造成隱藏垃圾。為說清楚，她比較兩種午餐習慣。這個例子比一串口號更能增加論點分量。"}]}, {"word": "where", "meanings": ["…的地方〔關係副詞〕"], "pos": ["Adv"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P136", "title": "從海岸帶回的資料", "blank": 3, "level": 4, "type": "句法判斷", "evidence": "Students noted the places where each sample had been found.", "why": "places where… 表發現的地點，子句主受詞已完整。", "en": "The samples collected during low tide were stored in sealed containers. The researcher who supervised the trip checked every label. Students noted the places where each sample had been found. Because the locations differed, the team kept the groups separate. This allowed comparisons without mixing material from different habitats.", "zh": "退潮時收集的樣本存於密封容器。督導行程的研究者檢查標籤。學生記下各樣本發現位置。因地點不同，團隊分組保存，讓比較時不會混入不同棲地材料。"}]}, {"word": "which", "meanings": ["它／該物〔關係代名詞〕"], "pos": ["Pron"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P094", "title": "關係子句的線索", "blank": 1, "level": 1, "type": "句法判斷", "evidence": "The bridge, which was built by local workers, links two villages.", "why": "逗號後非限定關係子句用 which，不用 that。", "en": "The bridge, which was built by local workers, links two villages. People living on either side use it daily. Although narrow, it provides a safe crossing during the rainy season.", "zh": "這座由當地工人興建的橋連接兩個村莊。住兩側的人每天使用。橋雖窄，卻在雨季提供安全通道。"}]}, {"word": "who", "meanings": ["…的人〔關係代名詞〕"], "pos": ["Pron"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P136", "title": "從海岸帶回的資料", "blank": 2, "level": 4, "type": "句法判斷", "evidence": "The researcher who supervised the trip checked every label.", "why": "researcher 為人，who 在關係子句作主詞。", "en": "The samples collected during low tide were stored in sealed containers. The researcher who supervised the trip checked every label. Students noted the places where each sample had been found. Because the locations differed, the team kept the groups separate. This allowed comparisons without mixing material from different habitats.", "zh": "退潮時收集的樣本存於密封容器。督導行程的研究者檢查標籤。學生記下各樣本發現位置。因地點不同，團隊分組保存，讓比較時不會混入不同棲地材料。"}]}, {"word": "whole", "meanings": ["整部的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P085", "title": "客氣的保留", "blank": 3, "level": 2, "type": "語氣／含意", "evidence": "It should not automatically be read as an enthusiastic endorsement of the whole film.", "why": "只提 scenery，不能擴至 whole film。", "en": "Asked whether he liked the film, Jun said, \"The scenery was lovely.\" He said nothing about the acting or story. His selective praise may imply a reservation. It should not automatically be read as an enthusiastic endorsement of the whole film.", "zh": "被問是否喜歡電影時，俊說：「景色很漂亮。」他沒提演技或故事。選擇性稱讚可能暗示保留，不應自動解作對整部電影的熱烈肯定。"}]}, {"word": "whose", "meanings": ["其／…的〔關係詞〕"], "pos": ["Pron"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P096", "title": "雖然下雨", "blank": 2, "level": 3, "type": "句法判斷", "evidence": "The participants, whose outdoor plans had changed, learned to weave baskets.", "why": "whose outdoor plans 表參與者的計畫；who 後不能直接接名詞 outdoor plans 作所有關係。", "en": "Although the rain was heavy, the indoor workshop continued. The participants, whose outdoor plans had changed, learned to weave baskets. The instructor kept everyone engaged by giving each person a task.", "zh": "雖然雨很大，室內工作坊仍繼續。戶外計畫改變的參與者學編籃。講師分派任務給每個人，讓大家持續投入。"}]}];
let contextState={q:'',ability:''};
function contextRows(){return CONTEXT_BANK.filter(r=>(!contextState.ability||r.tags.includes(contextState.ability))&&[r.word,...r.meanings,...r.pos,...r.examples.map(e=>e.why)].join(' ').toLowerCase().includes(contextState.q.trim().toLowerCase()))}
function contextPanel(){return `<section class="card section"><h2>全篇章語境詞庫</h2><p>從137篇現有文意選填整合而來，按字詞合併；保留不同語境的解題證據。這是既有題庫的學習索引，不另外算成新題。</p><div class="row"><input id="contextSearch" aria-label="搜尋語境詞庫" placeholder="搜尋字詞、中文或解題證據" value="${esc(contextState.q)}"><select id="contextAbility" aria-label="語境能力"><option value="">全部能力</option>${Object.entries(SUPP_ABILITIES).map(([k,v])=>`<option value="${k}" ${contextState.ability===k?'selected':''}>${v}</option>`).join('')}</select></div><p id="contextCount"></p><div style="overflow:auto"><table style="min-width:680px;width:100%;text-align:left"><thead><tr><th>字詞與詞性</th><th>中文與能力</th><th>真實篇章中的用法、證據與解析</th></tr></thead><tbody id="contextRows"></tbody></table></div></section>`}
function updateContext(){const rows=contextRows();document.getElementById('contextCount').textContent=`${CONTEXT_BANK.length}個不重複字詞｜${CONTEXT_BANK.reduce((n,r)=>n+r.examples.length,0)}個原題語境｜目前顯示${rows.length}個字詞`;document.getElementById('contextRows').innerHTML=rows.map(r=>`<tr><td style="padding:14px;border-top:1px solid #ddd;vertical-align:top"><b>${esc(r.word)}</b><br>${esc(r.pos.join(' / '))}</td><td style="padding:14px;border-top:1px solid #ddd;vertical-align:top">${esc(r.meanings.join('；'))}<p>${r.tags.map(k=>`<span class="pill">${SUPP_ABILITIES[k]||k}</span>`).join(' ')}</p></td><td style="padding:14px;border-top:1px solid #ddd">${r.examples.map(e=>`<details><summary>${esc(e.title)} · 第${e.blank}格 · L${e.level} · ${esc(e.type)}</summary><blockquote>${esc(e.evidence)}</blockquote><p><b>解題證據：</b>${esc(e.why)}</p><p><b>英文全文：</b>${esc(e.en)}</p><p><b>繁中全文：</b>${esc(e.zh)}</p>${typeof filters!=='undefined'?`<button data-contextpractice="${e.pid}">開啟這篇練習</button>`:''}</details>`).join('')}</td></tr>`).join('')||'<tr><td colspan="3">沒有符合項目。</td></tr>';document.querySelectorAll('[data-contextpractice]').forEach(b=>b.onclick=()=>openPractice(b.dataset.contextpractice,'repair'))}
function bindContext(){updateContext();document.getElementById('contextSearch').oninput=e=>{contextState.q=e.target.value;updateContext()};document.getElementById('contextAbility').onchange=e=>{contextState.ability=e.target.value;updateContext()}}
function evidencePanel(){if(!DATA.passages[0].questions)return '';return `<section class="card section"><h2>16類閱讀能力｜原題證據與選項改寫 BANK</h2><p>完整索引現有${DATA.passages.reduce((n,p)=>n+p.questions.length,0)}題的關鍵證據，按16類能力整理；不另計新增題數。每筆含原文、繁中全文、正解與全部干擾項理由。</p><label>能力 <select id="evidenceSkill"><option value="">全部16類</option>${SKILLS.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select></label><div id="evidenceRows"></div></section>`}
function bindEvidence(){if(!document.getElementById('evidenceSkill'))return;const draw=()=>{const v=document.getElementById('evidenceSkill').value;document.getElementById('evidenceRows').innerHTML=DATA.passages.flatMap(p=>p.questions.filter(q=>v===''||q.skill===+v).map(q=>`<details class="section"><summary>${esc(skill(q.skill).name)}｜${esc(p.title)}｜${esc(q.zh)}</summary><blockquote>${esc(q.quote)}</blockquote>${answerHTML(q,null)}<details><summary>完整中英篇章</summary>${passageHTML(p)}</details><button data-start="${p.id}">練習本篇</button></details>`)).join('')};draw();document.getElementById('evidenceSkill').onchange=draw}

const READING_LEXICON=[[0, "according to the passage", "根據本文", "題幹要求明示資訊；先定位原文，不加入常識。", "According to the passage, why was the service suspended?", "根據本文，服務為何暫停？", "不要把自己知道的原因當成文中原因。"], [0, "NOT mentioned / EXCEPT", "未提及／除了", "圈出否定詞；逐一核對哪些選項有文本支持。", "Which benefit is NOT mentioned in the passage?", "文中未提及哪項好處？", "未提及不等於作者明確否定。"], [1, "primarily concerned with", "主要探討", "概括各段共同焦點，排除只涵蓋單一例子的選項。", "The passage is primarily concerned with reducing food waste.", "本文主要探討減少食物浪費。", "看到熟悉關鍵字不代表涵蓋全文。"], [1, "aim to illustrate / persuade", "旨在說明／說服", "分辨作者是在解釋現象，還是要讀者接受立場。", "The author aims to illustrate how habits develop.", "作者旨在說明習慣如何形成。", "談到一項政策不一定是在支持政策。"], [2, "explicitly states", "明確指出", "找可直接對照的句子，核對主體、動作與對象。", "The notice explicitly states that registration closes on Friday.", "公告明確指出報名於週五截止。", "別把活動日期與截止日期混為一談。"], [2, "prior to / following", "在……之前／之後", "按時間標記排列事件，回到原文核對先後。", "Participants completed a survey prior to the workshop.", "參與者在工作坊之前填寫問卷。", "先後次序不能只靠文章提及順序猜測。"], [3, "at least / no more than", "至少／不超過", "保留數量界線；at least 含下限，no more than 含上限。", "Each group needs at least three members and no more than six.", "每組至少三人，最多六人。", "至少三人不等於恰好三人。"], [3, "eligible / restricted to", "符合資格／限於", "確認年齡、身分、地點或期間條件是否同時成立。", "The discount is restricted to residents aged sixty or above.", "折扣僅限六十歲以上的居民。", "不可只符合年齡卻漏看居民身分。"], [4, "novel approach", "新穎的方法", "novel 修飾 approach 時是形容詞，不是小說。", "The team tested a novel approach to water storage.", "團隊測試了一種新穎的儲水方法。", "不可固定套用最熟悉的名詞詞義。"], [4, "maintain a claim / maintain equipment", "堅持主張／維護設備", "用受詞與上下文決定 maintain 的意思。", "The author maintains that small changes can matter.", "作者堅持認為小改變也能有影響。", "此處不是維修或維護物品。"], [5, "the former / the latter", "前者／後者", "列出前文兩個對象，按提及次序對應。", "We compared cycling and driving. The former produced less noise.", "我們比較騎車與開車；前者產生較少噪音。", "former 不一定指距離最近的名詞。"], [5, "this shift / such a practice", "這項轉變／這種做法", "回找前文完整變化或行動，不只找單一物件。", "People began repairing items. This shift reduced replacement purchases.", "人們開始修理物品；這項轉變減少了替換新品的購買。", "this shift 指行為轉變，不是物品本身。"], [6, "be unlikely to / have little chance of", "不太可能／機會很小", "辨認機率相近的改寫，保留不確定程度。", "The plan is unlikely to succeed without local support.", "若沒有地方支持，計畫不太可能成功。", "不太可能不能改成絕對不可能。"], [6, "enable / make it possible for", "使能夠／讓……成為可能", "核對誰獲得能力、能做什麼及條件是否保留。", "The grant enabled the team to buy equipment.", "補助讓團隊得以購買設備。", "得以購買不代表已完成所有研究。"], [7, "nevertheless / even so", "然而／即使如此", "找前句形成的預期與後句的逆向結果。", "The trial was expensive. Even so, the team continued.", "試驗成本很高；即使如此，團隊仍繼續。", "不能誤讀成因為昂貴所以繼續。"], [7, "as a consequence / thereby", "因此／藉此而", "辨認前項行動與後項結果，核對邏輯方向。", "The town added bus routes, thereby improving access.", "鎮上新增公車路線，藉此改善交通可及性。", "結果不能反過來當成前項原因。"], [8, "a case in point", "一個恰當的例子", "判斷本段例子支援哪個較廣泛的主張。", "The village library is a case in point.", "村裡的圖書館就是一個例子。", "例子通常不是整篇文章唯一主題。"], [8, "acknowledge a limitation", "承認一項侷限", "本段可能限制前述結論，而非完全推翻它。", "The final paragraph acknowledges a limitation of the survey.", "最後一段承認調查的一項侷限。", "承認限制不等於研究毫無價值。"], [9, "problem–solution", "問題—解決方式", "標記問題、方法、結果的段落分工。", "The article identifies a problem before proposing a solution.", "文章先指出問題，再提出解決方式。", "勿把方法段的例子誤當另一個主問題。"], [9, "chronological / thematic", "按時間／按主題", "判斷段落依事件先後，還是依不同面向分組。", "The account is organized chronologically rather than by topic.", "這篇敘述按時間，而非按主題組織。", "出現時間詞不表示所有段落都按年代排列。"], [10, "reasonably infer", "合理推論", "把至少一項明示證據與最小必要推論連結。", "We can reasonably infer that some visitors learned new skills.", "我們可以合理推論，有些訪客學到新技能。", "不可擴大成所有訪客都已精通。"], [10, "suggest but not establish", "暗示但未確立", "辨認文章支持的可能性，不補上尚未證實的結論。", "The results suggest, but do not establish, a lasting benefit.", "結果暗示可能有長期好處，但尚未確立。", "有跡象不等於已獲定論。"], [11, "confounding factor", "干擾因素", "找可能同時影響原因與結果的其他因素。", "Income may be a confounding factor in the observed relationship.", "收入可能是觀察到的關係中的干擾因素。", "不能忽略替代解釋就宣稱因果。"], [11, "reverse causation", "反向因果", "檢查是否也可能是 B 影響 A。", "The study cannot rule out reverse causation.", "這項研究無法排除反向因果。", "A 與 B 相關，不代表方向必定是 A 到 B。"], [12, "relative to / on the same basis", "相對於／依相同基準", "統一基期、單位和母體後再比較。", "Costs fell relative to last year when measured on the same basis.", "以相同基準衡量時，成本較去年下降。", "金額與百分比不能直接當成同一比較量。"], [12, "whereas both / in both cases", "而兩者都／在兩種情況下", "跨段整理共同點與差異，避免只讀其中一段。", "Both programs improved access, whereas only one reduced costs.", "兩項方案都改善可及性，但只有一項降低成本。", "不能把其中一方的特點套到雙方。"], [13, "all / solely / invariably", "全部／僅僅／總是", "檢查選項是否把有限敘述絕對化。", "The passage says some users benefited, not that all users invariably did.", "本文說有些使用者受益，並非所有使用者總是受益。", "絕對詞是核對訊號，不是看到就必錯。"], [13, "true but irrelevant", "雖正確但不相關", "即使選項有原文支持，仍要回答題幹要求。", "The date is correct but irrelevant to the question about purpose.", "日期正確，但與詢問目的的題目無關。", "在文章找得到，不代表就是本題答案。"], [14, "anecdotal evidence", "個案或軼事證據", "辨認個案能支持的範圍，不當成普遍證明。", "One successful case provides anecdotal evidence, not a general guarantee.", "單一成功案例提供個案證據，不是普遍保證。", "感人的個案不能直接代表全部族群。"], [14, "sample size / representative sample", "樣本數／具代表性的樣本", "同時檢查數量與抽樣對象是否適合推論母體。", "A large sample is not necessarily representative.", "大型樣本不一定具代表性。", "人數多不能自動消除選樣偏差。"], [15, "consistent with / contradict", "與……一致／矛盾", "把候選答案放回各段，核對主旨、限制與態度。", "The conclusion is consistent with both the benefits and the limits described.", "結論同時符合文中描述的好處與限制。", "局部句子通順，仍可能與其他段落矛盾。"], [15, "qualified conclusion", "有限定的結論", "結語應保留全文的條件與不確定性。", "The author offers a qualified conclusion: the approach may help in some settings.", "作者提出有限定的結論：這種方法在某些情境可能有幫助。", "不可改寫成任何情況下都有效。"]];
let readingLexState={skill:'',q:''};
function readingLexPanel(){return `<section class="card"><h1>閱讀測驗｜16類能力詞彙與片語 BANK</h1><p>新增 ${READING_LEXICON.length} 筆閱讀專用用語，每類2筆。高頻片語頁與補充詞彙頁共用同一份資料，不重複計數。</p><div class="row"><input id="readingLexSearch" placeholder="搜尋英文、中文、陷阱或用法" aria-label="搜尋閱讀詞彙" value="${esc(readingLexState.q)}"><select id="readingLexSkill" aria-label="閱讀16類篩選"><option value="">全部16類</option>${SKILLS.map(t=>`<option value="${t.id}" ${readingLexState.skill===String(t.id)?'selected':''}>${String(t.id+1).padStart(2,'0')} ${t.name}（2筆）</option>`).join('')}</select><button id="readingLexClear">清除篩選</button></div><p id="readingLexCount"></p><div style="overflow:auto"><table style="width:100%;min-width:760px;text-align:left"><thead><tr><th>錯誤類型</th><th>核心用語</th><th>用法、解題動作與中英例句</th><th>易錯提醒／練習</th></tr></thead><tbody id="readingLexRows"></tbody></table></div></section>`}
function updateReadingLex(){const rows=READING_LEXICON.filter(r=>(readingLexState.skill===''||r[0]===+readingLexState.skill)&&r.slice(1).join(' ').toLowerCase().includes(readingLexState.q.toLowerCase()));document.getElementById('readingLexCount').textContent=`顯示 ${rows.length}／${READING_LEXICON.length} 筆｜涵蓋16／16類｜一頁完整呈現`;document.getElementById('readingLexRows').innerHTML=rows.map(r=>`<tr>${[`${skill(r[0]).name}<p>${skill(r[0]).plain}</p>`,`<b>${esc(r[1])}</b><p>${esc(r[2])}</p>`,`${esc(r[3])}<blockquote>${esc(r[4])}</blockquote><p>${esc(r[5])}</p>`,`${esc(r[6])}<p><button data-filter="${r[0]}">本類閱讀題庫</button></p>`].map(v=>`<td style="vertical-align:top;padding:15px;border-top:1px solid #ddd">${v}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="4">沒有符合條件的用語。</td></tr>'}
function bindReadingLex(){updateReadingLex();document.getElementById('readingLexSkill').onchange=e=>{readingLexState.skill=e.target.value;updateReadingLex()};document.getElementById('readingLexSearch').oninput=e=>{readingLexState.q=e.target.value;updateReadingLex()};document.getElementById('readingLexClear').onclick=()=>{readingLexState={skill:'',q:''};document.getElementById('readingLexSearch').value='';document.getElementById('readingLexSkill').value='';updateReadingLex()}}
function supplement(){return DATA.passages[0].questions?readingLexPanel()+`<details class="section"><summary>展開通用詞彙與七項基礎能力延伸庫</summary>${generalSupplement()}</details>`:generalSupplement()}
function bindSupplement(){bindGeneralSupplement();if(DATA.passages[0].questions)bindReadingLex()}
function phraseBank(){return DATA.passages[0].questions?readingLexPanel()+`<details class="section"><summary>展開通用高頻片語與原題證據索引</summary>${generalPhraseBank()}</details>`:generalPhraseBank()}
function bindPhraseBank(){bindGeneralPhraseBank();if(DATA.passages[0].questions)bindReadingLex()}


const DATA={"types": [{"id": 0, "name": "詞形", "tag": "POS", "plain": "知道字義，卻沒配合空格需要的字形。", "mistake": "把名詞放進修飾動詞的位置，或忽略單複數。", "task": "先標空格詞性，再比對字尾與數。", "tip": "Position Before Meaning｜先看位置再看意思。", "action": "空格位置→形式→回填讀句"}, {"id": 1, "name": "文法骨架", "tag": "Grammar", "plain": "長句看懂零碎單字，卻沒找出主詞與主要動詞。", "mistake": "把修飾語當主要述語，或漏看動詞後的受詞。", "task": "括起修飾語，圈主詞、動詞、受詞或補語。", "tip": "Skeleton First｜先保住句子的主幹。", "action": "縮句→辨識缺位→還原長句"}, {"id": 2, "name": "局部精確語意", "tag": "Semantics", "plain": "大概意思對，卻不符合這一句的精確限制。", "mistake": "看到相關主題就選，忽略數量、程度或用途。", "task": "圈出限定答案的最小片語。", "tip": "Smallest Sufficient Evidence｜用足以排除對手的最小證據。", "action": "找限制詞→比較差異→代入"}, {"id": 3, "name": "指涉連貫", "tag": "Cohesion", "plain": "沒追出代名詞或替代詞指向的人事物。", "mistake": "只選離代名詞最近的名詞，沒檢查單複數和語意。", "task": "把代名詞換回候選先行詞再讀。", "tip": "Referent Check｜先行詞要同時符合形式與意思。", "action": "找指涉→替換→跨句核對"}, {"id": 4, "name": "句間邏輯", "tag": "Logic", "plain": "兩句都懂，但把它們之間的關係看反。", "mistake": "把讓步讀成因果，或把例子當成結果。", "task": "先用中文標示因果、轉折、補充或例證。", "tip": "Direction Before Vocabulary｜先定邏輯方向。", "action": "讀兩句→命名關係→檢查連接詞"}, {"id": 5, "name": "句間銜接", "tag": "Cohesion", "plain": "忽略把下一句接到前一句的語言線索。", "mistake": "只看空格所在句，漏掉前句的名詞重現與承接詞。", "task": "圈前句舊詞與後句的替代說法。", "tip": "Bridge Words｜沿同義重現與承接線索讀。", "action": "前句焦點→後句承接→連讀"}, {"id": 6, "name": "時間線", "tag": "Cohesion", "plain": "沒有把事件的先後順序排好。", "mistake": "把已發生的事當成未來計畫，或倒置原因和後果。", "task": "在紙上排三個事件，標之前、當時、之後。", "tip": "Timeline First｜時間副詞不是裝飾。", "action": "列事件→排序→檢查時態"}, {"id": 7, "name": "新舊資訊", "tag": "Cohesion", "plain": "沒分清第一次提出的概念與已知資訊。", "mistake": "漏看首次介紹、後續定指與共同背景。", "task": "標出第一次出現的名詞，再追後文重提。", "tip": "Given to New｜從已知資訊接到新資訊。", "action": "首提→重提→新增內容"}, {"id": 8, "name": "作用範圍", "tag": "Logic", "plain": "看懂否定或程度詞，卻讓它管到錯誤的範圍。", "mistake": "把部分學生理解成全部學生，或把不一定讀成完全不會。", "task": "框出 only、some、not 等詞真正限制的成分。", "tip": "Scale Trap｜留意部分、全部、可能與必然。", "action": "圈量詞→定範圍→找反例"}, {"id": 9, "name": "全文主題", "tag": "Global", "plain": "抓住某個例子，卻錯把細節當整篇中心。", "mistake": "看到科技字就認定文章支持所有科技。", "task": "用一句中文概括各段共同在回答的問題。", "tip": "Topic Anchor｜答案必須服務整篇重點。", "action": "每段一句→找交集→回填"}, {"id": 10, "name": "文章組織", "tag": "Global", "plain": "沒有看出作者如何安排整篇論述。", "mistake": "把問題、方法、結果、限制的角色混在一起。", "task": "標每段的工作，畫出結構順序。", "tip": "Structure Map｜先辨問題與回應。", "action": "分段標記→接成架構→定位空格"}, {"id": 11, "name": "段落功能", "tag": "Global", "plain": "知道段落內容，卻不知道它在文章中做什麼。", "mistake": "把反例誤認成支持例，或把限制當結論。", "task": "問這段刪掉後，前後論證少了什麼。", "tip": "Function over Facts｜先看段落在做的工作。", "action": "回看主張→判斷功能→核對後文"}, {"id": 12, "name": "作者態度", "tag": "Global", "plain": "把作者轉述的看法當成作者自己的立場。", "mistake": "只憑一個褒義字判定全篇樂觀，忽略保留語。", "task": "區分誰說的，圈評價詞與保留詞。", "tip": "Voice Check｜分清引述與作者聲音。", "action": "辨聲音→找評價→估強度"}, {"id": 13, "name": "推論", "tag": "Global", "plain": "答案超出文章能支持的範圍。", "mistake": "把可能推成一定，把個案推成所有情況。", "task": "寫下證據能支持的最低限度結論。", "tip": "Evidence > Memory｜文本證據優先於常識。", "action": "摘證據→最小推論→刪過度結論"}, {"id": 14, "name": "全文一致", "tag": "Global", "plain": "每格單看順，但回填後前後矛盾。", "mistake": "前段說未解決，後段卻填成完全成功。", "task": "填完後只讀關鍵主張，檢查人物、時間與立場。", "tip": "Local + Global Fit｜局部與全文都要相容。", "action": "全文回填→追同一主張→修正衝突"}, {"id": 15, "name": "字形相似", "tag": "Semantics", "plain": "被相似拼字吸引，沒有核對實際字義。", "mistake": "混淆 adopt/adapt、desert/dessert 等。", "task": "圈差異字母，說出兩字各自的中文與搭配。", "tip": "Look Twice｜相似字先做對照。", "action": "拆拼字→辨字義→看搭配"}, {"id": 16, "name": "詞族混淆", "tag": "POS", "plain": "認得共同字根，卻把同家族不同功能混用。", "mistake": "把人、過程、結果或性質的詞當成同一個字。", "task": "畫字族樹：動作、人物、事物、形容、副詞。", "tip": "Family Is Not Function｜同字根不等於可互換。", "action": "字根→字族角色→句法核對"}, {"id": 17, "name": "詞性判斷", "tag": "POS", "plain": "沒有判定候選字在此句中的實際詞性。", "mistake": "看到 record 就只當名詞，忽略可作動詞。", "task": "同時標字典可能詞性與本句需要詞性。", "tip": "POS Elimination｜只淘汰確定不合的詞性。", "action": "列可能詞性→看位置→保留兼類字"}, {"id": 18, "name": "搭配判斷", "tag": "Collocation", "plain": "單字意思合，但英文慣用組合不成立。", "mistake": "用中文逐字拼出不自然的動詞與名詞組合。", "task": "把空格與左右詞一起當一個單位讀。", "tip": "Chunk｜記搭配，不只記孤立單字。", "action": "擴成詞塊→比較候選→回句驗證"}, {"id": 19, "name": "介系詞搭配", "tag": "Collocation", "plain": "忘記動詞、形容詞或名詞要求的介系詞。", "mistake": "把 depend on 誤當 depend of，或漏看 to 後是名詞。", "task": "圈空格前後的介系詞與支配它的詞。", "tip": "Partner Check｜介系詞前後都要看。", "action": "找支配詞→查固定搭配→核對意思"}, {"id": 20, "name": "句型判斷", "tag": "Grammar", "plain": "沒認出動詞或連接詞要求的補語句型。", "mistake": "把 allow 人 to V 與 avoid V-ing 混用。", "task": "把可接受的句型寫成簡短骨架。", "tip": "Pattern Lock｜句型會限制候選動詞。", "action": "動詞→補語形式→回填"}, {"id": 21, "name": "近義詞混淆", "tag": "Semantics", "plain": "近義詞都翻成相似中文，卻有使用條件差異。", "mistake": "忽略對象、正式程度、主動被動或可數性。", "task": "把兩個近義詞放進同一語境逐項比較。", "tip": "Contrast Pair｜找兩字不能互換的地方。", "action": "共同義→不同限制→排除"}, {"id": 22, "name": "易混淆字詞", "tag": "Semantics", "plain": "把發音、形式或中文翻譯相近的詞混為一談。", "mistake": "例如把借入與借出、上升與提高搞反。", "task": "標出動作方向、主受詞與詞性。", "tip": "Direction of Action｜誰對誰做什麼。", "action": "畫角色箭頭→辨及物性→回填"}, {"id": 23, "name": "多義判斷", "tag": "Semantics", "plain": "只記住一個熟悉字義，忽略文章使用的另一義。", "mistake": "看見 charge 只想到充電，沒看出費用或指控。", "task": "先由句子用途推義，再比對熟字。", "tip": "Context Override｜上下文可推翻第一個直覺字義。", "action": "讀情境→暫忘首義→重新配義"}, {"id": 24, "name": "上下文方向", "tag": "Logic", "plain": "沒判斷情境朝改善、惡化、支持或反對發展。", "mistake": "前文問題變少，卻選表示增加的字。", "task": "畫正負或增減箭頭，圈轉折位置。", "tip": "Direction Before Vocabulary｜先判斷增減與正負。", "action": "畫方向→找轉折→比字義"}, {"id": 25, "name": "上下文邏輯", "tag": "Logic", "plain": "只找附近關鍵字，忽略整段的因果條件。", "mistake": "把相關當因果，或忽略 if、unless 的條件。", "task": "把條件、原因、結果分別寫出。", "tip": "Condition Check｜結果成立需要哪些前提。", "action": "列前提→接結果→檢查反例"}, {"id": 26, "name": "中文直譯", "tag": "Collocation", "plain": "把中文慣用說法逐字搬進英文。", "mistake": "看到參加就任意用 join，不看後接活動還是團體。", "task": "先找英文語塊，再用中文確認整體意思。", "tip": "Translate the Chunk｜翻整塊，不逐字換。", "action": "辨情境→找英文搭配→整句翻譯"}, {"id": 27, "name": "語域不合", "tag": "Semantics", "plain": "詞義相近，但不適合文章的正式程度或使用場合。", "mistake": "在正式通知填入聊天俚語，或用過度學術詞破壞語境。", "task": "辨作者、讀者、用途與文體。", "tip": "Audience Check｜用詞要符合場合。", "action": "辨場合→比較正式度→核對語氣"}, {"id": 28, "name": "語氣／含意", "tag": "Semantics", "plain": "只讀表面字義，漏掉暗示、保留或諷刺。", "mistake": "把客氣婉拒當答應，把有限稱讚當全盤肯定。", "task": "圈引號、情境落差與程度修飾語。", "tip": "Read the Signal｜語氣由情境與用字共同決定。", "action": "讀表面→找落差→判含意"}, {"id": 29, "name": "構詞判斷", "tag": "POS", "plain": "沒有利用字首、字根、字尾辨義與詞性。", "mistake": "把 un-、re-、-less 等訊號漏掉，或以為拆字能取代語境。", "task": "拆出可辨認的詞素，再回句檢查。", "tip": "Morphology + Context｜構詞只提供假設。", "action": "拆詞素→預測→語境驗證"}, {"id": 30, "name": "語意判斷", "tag": "Semantics", "plain": "沒確認候選字和句中人物、事物及事件相容。", "mistake": "只靠主題聯想，不看誰執行動作、接受什麼。", "task": "把每個候選字代入，說出完整中文事件。", "tip": "Meaning Check｜合理聯想不等於文本答案。", "action": "辨角色→整句翻譯→對照限制"}, {"id": 31, "name": "句法判斷", "tag": "Grammar", "plain": "沒有辨認子句邊界與修飾關係。", "mistake": "把關係代名詞當連接詞，或讓分詞修飾錯誤對象。", "task": "框子句，畫修飾箭頭，檢查主句是否完整。", "tip": "Boundary Check｜先找子句邊界。", "action": "分子句→定位修飾→檢查完整性"}, {"id": 32, "name": "尚待確認", "tag": "Global", "plain": "目前證據不足，還不能可靠判斷錯因。", "mistake": "只憑選錯一格就貼標籤，忽略猜題、粗心或不熟字義。", "task": "保留作答、證據與信心，換文觀察並由教師複核。", "tip": "Signal Is Not Diagnosis｜一次錯誤只是訊號。", "action": "記錄→詢問理由→換文→複核"}], "passages": [{"id": "P001", "title": "校園花園", "en": "Our school turned an empty yard into a garden. A {variety} of vegetables now grows there. Students are {actively} involved in watering them, and their interest in science has grown {significantly}.", "zh": "學校把空院子改成花園，現在裡面種著各式蔬菜。學生積極參與澆水，他們對科學的興趣也顯著提升。", "bank": [{"word": "variety", "zh": "多樣種類", "pos": "N"}, {"word": "significantly", "zh": "顯著地", "pos": "Adv"}, {"word": "significant", "zh": "顯著的", "pos": "Adj"}, {"word": "various", "zh": "各種的", "pos": "Adj"}, {"word": "actively", "zh": "積極地", "pos": "Adv"}], "answers": ["variety", "actively", "significantly"], "why": ["a variety of 是名詞片語；various 不能直接放在 a 與 of 之間。", "修飾 involved 的參與方式要用副詞 actively。", "修飾 has grown 的程度要用 significantly；significant 是形容詞。"], "evidence": ["A {variety} of vegetables now grows there.", "Students are {actively} involved in watering them, and their interest in science has grown {significantly}.", "Students are {actively} involved in watering them, and their interest in science has grown {significantly}."], "type": 0, "level": 1, "tags": ["POS", "Semantics"], "slot": 0}, {"id": "P002", "title": "修復舊腳踏車", "en": "A repair club opened after school. Its members developed {practical} skills by fixing old bicycles. They worked {carefully} to check each brake. The project also increased their {confidence} in solving unfamiliar problems.", "zh": "課後成立了修車社。社員透過修理舊腳踏車培養實用技能，仔細檢查每個煞車。這項計畫也增強他們解決陌生問題的信心。", "bank": [{"word": "practical", "zh": "實用的", "pos": "Adj"}, {"word": "carefully", "zh": "仔細地", "pos": "Adv"}, {"word": "confident", "zh": "有信心的", "pos": "Adj"}, {"word": "practice", "zh": "練習", "pos": "N/V"}, {"word": "confidence", "zh": "信心", "pos": "N"}], "answers": ["practical", "carefully", "confidence"], "why": ["skills 前要能形容技能的 practical；practice skills 會變成「練習技能」，不合本句所述。", "worked 要由副詞 carefully 說明工作方式。", "their 後需要名詞 confidence；confident 不能作 increased 的受詞核心。"], "evidence": ["Its members developed {practical} skills by fixing old bicycles.", "They worked {carefully} to check each brake.", "The project also increased their {confidence} in solving unfamiliar problems."], "type": 0, "level": 2, "tags": ["POS", "Semantics"], "slot": 1}, {"id": "P003", "title": "社區音樂夜", "en": "The town invited young musicians to perform. Their {creative} arrangements surprised the audience. Even beginners played {confidently} after weeks of practice. The evening showed how regular rehearsal can improve musical {ability}.", "zh": "小鎮邀請年輕樂手演出。他們有創意的編曲讓觀眾驚喜；連初學者在練習數週後也演奏得有自信。這晚顯示定期排練能提升音樂能力。", "bank": [{"word": "creative", "zh": "有創意的", "pos": "Adj"}, {"word": "able", "zh": "有能力的", "pos": "Adj"}, {"word": "creativity", "zh": "創造力", "pos": "N"}, {"word": "ability", "zh": "能力", "pos": "N"}, {"word": "confidently", "zh": "有自信地", "pos": "Adv"}], "answers": ["creative", "confidently", "ability"], "why": ["arrangements 前需要形容其特質的 creative；creativity 是抽象名詞。", "played 後以 confidently 修飾演奏方式。", "musical 後接名詞 ability；able 無法作 improve 的受詞。"], "evidence": ["Their {creative} arrangements surprised the audience.", "Even beginners played {confidently} after weeks of practice.", "The evening showed how regular rehearsal can improve musical {ability}."], "type": 0, "level": 3, "tags": ["POS", "Semantics"], "slot": 2}, {"id": "P004", "title": "圖書館導師", "en": "The reading program, which began last spring, {enables} children to borrow books without paying a fee. Each volunteer {guides} a small group. The stories selected by the librarian {remain} available online after the meetings.", "zh": "去年春天開始的閱讀計畫讓孩子免費借書。每位志工帶領一個小組。館員挑選的故事在聚會後仍可在線上閱讀。", "bank": [{"word": "remaining", "zh": "剩餘的〔分詞〕", "pos": "V-ing"}, {"word": "remain", "zh": "仍然是", "pos": "V"}, {"word": "enables", "zh": "使能夠", "pos": "V"}, {"word": "enabling", "zh": "使能夠〔分詞〕", "pos": "V-ing"}, {"word": "guides", "zh": "引導", "pos": "V"}], "answers": ["enables", "guides", "remain"], "why": ["主句 The reading program 缺限定動詞；enables 接 children to borrow，enabling 不能獨立作述語。", "Each volunteer 是單數主詞，guides 表帶領小組。", "主詞是複數 stories；selected by… 是修飾語，remain 才是主句動詞。"], "evidence": ["The reading program, which began last spring, {enables} children to borrow books without paying a fee.", "Each volunteer {guides} a small group.", "The stories selected by the librarian {remain} available online after the meetings."], "type": 1, "level": 2, "tags": ["Grammar", "Semantics"], "slot": 0}, {"id": "P005", "title": "屋頂雨水", "en": "A tank installed on the roof {collects} rainwater. The water stored inside it {is} used to clean the playground. This simple system, despite its small size, {saves} the school hundreds of liters each month.", "zh": "裝在屋頂的水箱收集雨水。儲存在裡面的水被用來清洗操場。這套簡單系統雖然不大，每月仍替學校省下數百公升的水。", "bank": [{"word": "saves", "zh": "節省", "pos": "V"}, {"word": "are", "zh": "是／被〔複數〕", "pos": "V"}, {"word": "collects", "zh": "收集", "pos": "V"}, {"word": "is", "zh": "是／被", "pos": "V"}, {"word": "collecting", "zh": "正在收集〔分詞〕", "pos": "V-ing"}], "answers": ["collects", "is", "saves"], "why": ["A tank 是主詞，installed… 是修飾語；collects 才能完成述語。", "water 是不可數主詞，搭配 is used；are 的主詞一致不合。", "system 是 saves 的主詞；despite 片語不改變主幹。"], "evidence": ["A tank installed on the roof {collects} rainwater.", "The water stored inside it {is} used to clean the playground.", "This simple system, despite its small size, {saves} the school hundreds of liters each month."], "type": 1, "level": 3, "tags": ["Grammar", "Semantics"], "slot": 1}, {"id": "P006", "title": "夜間公車", "en": "The new bus route, requested by residents for years, {connects} the station with the hospital. Workers who finish late {use} it regularly. The change in the timetable {has} made their journeys safer.", "zh": "居民要求多年的新公車路線連接車站與醫院。晚下班的工作者固定搭乘。時刻表的改變使他們的通勤更安全。", "bank": [{"word": "use", "zh": "使用", "pos": "V"}, {"word": "connecting", "zh": "連接〔分詞〕", "pos": "V-ing"}, {"word": "has", "zh": "已經〔完成式助動詞〕", "pos": "V"}, {"word": "have", "zh": "已經〔複數主詞用〕", "pos": "V"}, {"word": "connects", "zh": "連接", "pos": "V"}], "answers": ["connects", "use", "has"], "why": ["requested… 為過去分詞修飾；主句仍需要 connects，不能只填 connecting。", "who finish late 修飾複數 Workers；use 才是主句動詞。", "主詞核心是單數 change，故用 has made；不是看附近的 timetable 或 journeys。"], "evidence": ["The new bus route, requested by residents for years, {connects} the station with the hospital.", "Workers who finish late {use} it regularly.", "The change in the timetable {has} made their journeys safer."], "type": 1, "level": 4, "tags": ["Grammar", "Semantics"], "slot": 2}, {"id": "P007", "title": "可折疊水杯", "en": "Hikers wanted cups that would fit inside small pockets. A designer created a {foldable} model that becomes flat when empty. It weighs very little, so it is also {lightweight}. Its tight lid prevents water from {leaking}.", "zh": "健行者想要能放進小口袋的杯子。設計師做出可折疊款式，空杯可壓平。它很輕，因此也方便攜帶；緊密的杯蓋能防止漏水。", "bank": [{"word": "lightweight", "zh": "輕量的", "pos": "Adj"}, {"word": "boiling", "zh": "沸騰", "pos": "V-ing"}, {"word": "fragile", "zh": "易碎的", "pos": "Adj"}, {"word": "leaking", "zh": "漏出", "pos": "V-ing"}, {"word": "foldable", "zh": "可折疊的", "pos": "Adj"}], "answers": ["foldable", "lightweight", "leaking"], "why": ["becomes flat 是能折疊的具體證據；fragile 只說易碎，不能解釋變平收納。", "weighs very little 直接限定為 lightweight，與是否易碎無關。", "tight lid 防的是液體漏出 leaking；沒有加熱證據可支持 boiling。"], "evidence": ["A designer created a {foldable} model that becomes flat when empty.", "It weighs very little, so it is also {lightweight}.", "Its tight lid prevents water from {leaking}."], "type": 2, "level": 2, "tags": ["Semantics"], "slot": 0}, {"id": "P008", "title": "無聲提醒", "en": "During exams, the library uses lamps instead of bells. A {visual} signal tells readers when the room will close. The light is bright enough to be {noticeable}, but it does not interrupt the {silence} students need.", "zh": "考試期間，圖書館用燈取代鈴聲。視覺訊號提醒讀者即將閉館。燈光亮得足以被注意，卻不打破學生需要的安靜。", "bank": [{"word": "audible", "zh": "聽得見的", "pos": "Adj"}, {"word": "silence", "zh": "安靜", "pos": "N"}, {"word": "visual", "zh": "視覺的", "pos": "Adj"}, {"word": "noticeable", "zh": "容易注意到的", "pos": "Adj"}, {"word": "noise", "zh": "噪音", "pos": "N"}], "answers": ["visual", "noticeable", "silence"], "why": ["lamps instead of bells 指視覺，audible 指聽覺。", "bright enough to be 限定燈光能被看見，故 noticeable。", "does not interrupt 指保留原有安靜；noise 反而是應減少的聲響。"], "evidence": ["A {visual} signal tells readers when the room will close.", "The light is bright enough to be {noticeable}, but it does not interrupt the {silence} students need.", "The light is bright enough to be {noticeable}, but it does not interrupt the {silence} students need."], "type": 2, "level": 3, "tags": ["Semantics"], "slot": 1}, {"id": "P009", "title": "溫室測量", "en": "The sensor records temperature every minute. Such {frequent} measurements help growers notice sudden changes. They need {accurate} readings because an error of two degrees can damage seedlings. A backup battery keeps the sensor {operational} during power failures.", "zh": "感測器每分鐘記錄溫度。如此頻繁的測量有助於栽種者發現突變。他們需要精確讀值，因為兩度誤差就可能傷害幼苗。備用電池讓感測器在停電時仍能運作。", "bank": [{"word": "operational", "zh": "可運作的", "pos": "Adj"}, {"word": "occasional", "zh": "偶爾的", "pos": "Adj"}, {"word": "accurate", "zh": "精確的", "pos": "Adj"}, {"word": "decorative", "zh": "裝飾性的", "pos": "Adj"}, {"word": "frequent", "zh": "頻繁的", "pos": "Adj"}], "answers": ["frequent", "accurate", "operational"], "why": ["every minute 支持 frequent，occasional 頻率相反。", "不能有兩度誤差，故要 accurate；頻率高不保證精確。", "備用電池的用途是維持運作 operational，不是增加裝飾性 decorative。"], "evidence": ["Such {frequent} measurements help growers notice sudden changes.", "They need {accurate} readings because an error of two degrees can damage seedlings.", "A backup battery keeps the sensor {operational} during power failures."], "type": 2, "level": 4, "tags": ["Semantics"], "slot": 2}, {"id": "P010", "title": "蝙蝠的服務", "en": "Farmers once feared the bats near their fields. Researchers explained that {these} animals eat insects that damage crops. This natural pest control reduces the need for chemicals. Its economic {value} has led farmers to protect the bats and their {habitats}.", "zh": "農民原本害怕田邊的蝙蝠。研究者說明這些動物會吃危害作物的昆蟲。這種天然病蟲害防治減少化學藥劑需求。它的經濟價值促使農民保護蝙蝠及其棲地。", "bank": [{"word": "these", "zh": "這些", "pos": "Det"}, {"word": "predators", "zh": "掠食者", "pos": "N"}, {"word": "habitats", "zh": "棲地", "pos": "N"}, {"word": "this", "zh": "這個", "pos": "Det"}, {"word": "value", "zh": "價值", "pos": "N"}], "answers": ["these", "value", "habitats"], "why": ["these animals 回指複數 bats；this 不能修飾複數 animals。", "Its 回指 pest control，其經濟價值促成保護行動。", "their 指 bats，保護棲地能保護牠們；保護牠們的掠食者不符合此因果。"], "evidence": ["Researchers explained that {these} animals eat insects that damage crops.", "Its economic {value} has led farmers to protect the bats and their {habitats}.", "Its economic {value} has led farmers to protect the bats and their {habitats}."], "type": 3, "level": 2, "tags": ["Cohesion", "Semantics"], "slot": 0}, {"id": "P011", "title": "共享工具箱", "en": "Mina lent her drill to Omar because {his} was broken. He repaired a shelf and returned the borrowed tool the next day. This small {exchange} inspired them to create a shared toolbox. It now serves twelve {households} in their building.", "zh": "米娜把電鑽借給歐瑪，因為他的壞了。他修好架子，隔天歸還借來的工具。這次小小的交換啟發他們建立共享工具箱，目前服務大樓中的十二戶住家。", "bank": [{"word": "exchange", "zh": "交換", "pos": "N"}, {"word": "households", "zh": "家庭／住戶", "pos": "N"}, {"word": "her", "zh": "她的／她", "pos": "Det/Pron"}, {"word": "dispute", "zh": "爭執", "pos": "N"}, {"word": "his", "zh": "他的〔所有代名詞〕", "pos": "Pron"}], "answers": ["his", "exchange", "households"], "why": ["his 替代 Omar's drill；her 不能單獨表示「她的電鑽」，且借用因果也不合。", "This 回指借出與歸還的互動，exchange 有證據；沒有爭執 dispute。", "twelve 後用複數 households，指工具箱服務的住戶。"], "evidence": ["Mina lent her drill to Omar because {his} was broken.", "This small {exchange} inspired them to create a shared toolbox.", "It now serves twelve {households} in their building."], "type": 3, "level": 3, "tags": ["Cohesion", "Semantics"], "slot": 1}, {"id": "P012", "title": "河流巡守", "en": "The volunteers mapped two streams before testing {them} for pollution. One was clean; the other contained waste from a workshop. The owner agreed to stop the {discharge}. This decision allowed fish to return to the polluted {stream}.", "zh": "志工先畫出兩條溪流的位置，再檢測它們的污染。一條乾淨，另一條有工坊排出的廢水。業主同意停止排放。這項決定讓魚回到受污染的溪流。", "bank": [{"word": "stream", "zh": "溪流", "pos": "N"}, {"word": "them", "zh": "它們", "pos": "Pron"}, {"word": "volunteer", "zh": "志工", "pos": "N"}, {"word": "it", "zh": "它", "pos": "Pron"}, {"word": "discharge", "zh": "排放", "pos": "N"}], "answers": ["them", "discharge", "stream"], "why": ["them 回指 two streams；單數 it 不合。", "the owner 的決定是停止工坊排放 discharge，與上句廢水相接。", "the polluted stream 指先前兩條中的另一條；不能指志工。"], "evidence": ["The volunteers mapped two streams before testing {them} for pollution.", "The owner agreed to stop the {discharge}.", "This decision allowed fish to return to the polluted {stream}."], "type": 3, "level": 4, "tags": ["Cohesion", "Semantics"], "slot": 2}, {"id": "P013", "title": "手機禁用日", "en": "Students expected a phone-free lunch to be boring. {However}, they ended up talking more than usual. Several discovered shared interests. {Consequently}, the class decided to repeat the experiment; {moreover}, another class asked to join.", "zh": "學生原以為不用手機的午餐會很無聊。然而，他們說的話反而比平常多，有些人發現共同興趣。因此，班上決定再試一次；此外，另一班也想加入。", "bank": [{"word": "Similarly", "zh": "同樣地", "pos": "Adv"}, {"word": "Consequently", "zh": "因此", "pos": "Adv"}, {"word": "moreover", "zh": "此外", "pos": "Adv"}, {"word": "Instead", "zh": "反而／取而代之", "pos": "Adv"}, {"word": "However", "zh": "然而", "pos": "Adv"}], "answers": ["However", "Consequently", "moreover"], "why": ["預期無聊與實際交談更多相反，需 However；Similarly 無法表達反差。", "因活動有效而決定再辦，是結果 Consequently。", "另一班加入是額外進展，用 moreover；Instead 會誤說它取代本班再辦。"], "evidence": ["{However}, they ended up talking more than usual.", "{Consequently}, the class decided to repeat the experiment; {moreover}, another class asked to join.", "{Consequently}, the class decided to repeat the experiment; {moreover}, another class asked to join."], "type": 4, "level": 2, "tags": ["Logic", "Semantics"], "slot": 0}, {"id": "P014", "title": "遮陽實驗", "en": "Two classrooms received the same amount of sunlight. One installed external shades; the other did not. The shaded room stayed cooler. {Therefore}, the school expanded the trial. {Nevertheless}, it kept temperature records because one week of data was {insufficient}.", "zh": "兩間教室日照量相同，其中一間裝外遮陽，另一間沒有。裝遮陽的教室較涼。因此學校擴大試驗。不過，學校仍持續記錄溫度，因為一週資料並不足夠。", "bank": [{"word": "Nevertheless", "zh": "儘管如此", "pos": "Adv"}, {"word": "insufficient", "zh": "不足的", "pos": "Adj"}, {"word": "Meanwhile", "zh": "同時", "pos": "Adv"}, {"word": "Therefore", "zh": "因此", "pos": "Adv"}, {"word": "conclusive", "zh": "足以定論的", "pos": "Adj"}], "answers": ["Therefore", "Nevertheless", "insufficient"], "why": ["擴大試驗是降溫效果的結果，不只是同時發生的 Meanwhile。", "有好結果仍持續記錄是保留與讓步，故 Nevertheless。", "仍須收集資料表明原資料 insufficient；conclusive 與後續需求衝突。"], "evidence": ["{Therefore}, the school expanded the trial.", "{Nevertheless}, it kept temperature records because one week of data was {insufficient}.", "{Nevertheless}, it kept temperature records because one week of data was {insufficient}."], "type": 4, "level": 3, "tags": ["Logic", "Semantics"], "slot": 1}, {"id": "P015", "title": "紙本與電子書", "en": "Electronic books are easy to carry. Printed books, {however}, do not need batteries. Neither format is best in every situation. {Instead}, readers should choose according to their needs. For travelers, for {example}, luggage weight may matter most.", "zh": "電子書方便攜帶，然而紙本書不需電池。沒有一種形式適合所有情況。讀者應改為依需求選擇。例如，對旅人而言，行李重量可能最重要。", "bank": [{"word": "example", "zh": "例子", "pos": "N"}, {"word": "therefore", "zh": "因此", "pos": "Adv"}, {"word": "Instead", "zh": "改為／反而", "pos": "Adv"}, {"word": "however", "zh": "然而", "pos": "Adv"}, {"word": "contrast", "zh": "對比", "pos": "N"}], "answers": ["however", "Instead", "example"], "why": ["電子書與紙本各有不同優點，however 轉換比較面向；紙本不用電池不是電子書易攜的結果。", "Instead 以依需求選擇取代找唯一最佳格式。", "for example 引出旅人的具體情境；for contrast 不是此處的慣用例證語。"], "evidence": ["Printed books, {however}, do not need batteries.", "{Instead}, readers should choose according to their needs.", "For travelers, for {example}, luggage weight may matter most."], "type": 4, "level": 4, "tags": ["Logic", "Semantics"], "slot": 2}, {"id": "P016", "title": "失物招領牆", "en": "Students often left umbrellas in classrooms. To address this {problem}, the office created a photo wall of lost items. The new {system} let owners identify their belongings before visiting the office. Within a month, most umbrellas had been {returned}.", "zh": "學生常把傘留在教室。為處理這個問題，辦公室設立失物照片牆。新制度讓失主先辨認物品再到辦公室。一個月內，大多數雨傘已歸還。", "bank": [{"word": "solution", "zh": "解決辦法", "pos": "N"}, {"word": "discarded", "zh": "丟棄", "pos": "V-en"}, {"word": "problem", "zh": "問題", "pos": "N"}, {"word": "system", "zh": "制度", "pos": "N"}, {"word": "returned", "zh": "歸還", "pos": "V-en"}], "answers": ["problem", "system", "returned"], "why": ["this problem 承接遺留雨傘；solution 是照片牆，尚未在前句提出。", "new system 以較概括的詞重述 photo wall 的運作方式。", "辨認失主後應 returned；discarded 與設失物牆的目的不合。"], "evidence": ["To address this {problem}, the office created a photo wall of lost items.", "The new {system} let owners identify their belongings before visiting the office.", "Within a month, most umbrellas had been {returned}."], "type": 5, "level": 2, "tags": ["Cohesion", "Semantics"], "slot": 0}, {"id": "P017", "title": "從訪談到展覽", "en": "The class interviewed older residents about local shops. These {accounts} revealed how the street had changed. Drawing on the stories, students prepared an {exhibition}. Visitors could then compare the past with the {present}.", "zh": "班上訪問年長居民，詢問當地店家。這些敘述呈現街道的變化。學生根據故事籌備展覽，讓參觀者比較過去與現在。", "bank": [{"word": "exhibition", "zh": "展覽", "pos": "N"}, {"word": "future", "zh": "未來", "pos": "N"}, {"word": "invoices", "zh": "發票", "pos": "N"}, {"word": "present", "zh": "現在", "pos": "N"}, {"word": "accounts", "zh": "敘述", "pos": "N"}], "answers": ["accounts", "exhibition", "present"], "why": ["These accounts 指前句訪談敘述；不是商店開的 invoices。", "後文有 Visitors 且能比較歷史，exhibition 承接整理故事的公開呈現。", "訪談呈現街道「已經如何改變」，比較 past 與 present；未提供未來預測。"], "evidence": ["These {accounts} revealed how the street had changed.", "Drawing on the stories, students prepared an {exhibition}.", "Visitors could then compare the past with the {present}."], "type": 5, "level": 3, "tags": ["Cohesion", "Semantics"], "slot": 1}, {"id": "P018", "title": "修補步道", "en": "Heavy rain washed soil off the hillside. This {erosion} exposed the roots of nearby trees. To limit further damage, workers added small barriers. These {structures} slowed runoff and helped soil {settle} behind them.", "zh": "大雨沖走山坡土壤。這種侵蝕使附近樹根外露。工人加設小障礙物以限制更多損害。這些結構減慢逕流，讓土壤在後方沉積。", "bank": [{"word": "structures", "zh": "結構物", "pos": "N"}, {"word": "irrigation", "zh": "灌溉", "pos": "N"}, {"word": "settle", "zh": "沉積", "pos": "V"}, {"word": "accelerate", "zh": "加速", "pos": "V"}, {"word": "erosion", "zh": "侵蝕", "pos": "N"}], "answers": ["erosion", "structures", "settle"], "why": ["This erosion 將沖走土壤概括為侵蝕；irrigation 是供水灌溉。", "These structures 回接 small barriers，而非樹根。", "水速減慢有助土壤 settle；accelerate 與 slowed 的作用方向相反。"], "evidence": ["This {erosion} exposed the roots of nearby trees.", "These {structures} slowed runoff and helped soil {settle} behind them.", "These {structures} slowed runoff and helped soil {settle} behind them."], "type": 5, "level": 4, "tags": ["Cohesion", "Semantics"], "slot": 2}, {"id": "P019", "title": "種子的等待", "en": "The children planted beans on Monday. Two days {later}, tiny roots appeared. By Friday, the first leaves had {emerged}. The students recorded each stage so that next year's class could follow the same {sequence}.", "zh": "孩子們週一種下豆子。兩天後長出細根。到了週五，第一批葉子已冒出。學生記錄每個階段，讓明年的班級能追蹤同樣的順序。", "bank": [{"word": "emerged", "zh": "出現", "pos": "V-en"}, {"word": "vanished", "zh": "消失", "pos": "V-en"}, {"word": "earlier", "zh": "之前", "pos": "Adv"}, {"word": "sequence", "zh": "順序", "pos": "N"}, {"word": "later", "zh": "之後", "pos": "Adv"}], "answers": ["later", "emerged", "sequence"], "why": ["先種植再發根，two days later；earlier 會倒置流程。", "first leaves 配生長時間線，為 emerged；vanished 指消失。", "each stage 的時間記錄構成 sequence。"], "evidence": ["Two days {later}, tiny roots appeared.", "By Friday, the first leaves had {emerged}.", "The students recorded each stage so that next year's class could follow the same {sequence}."], "type": 6, "level": 2, "tags": ["Cohesion", "Semantics"], "slot": 0}, {"id": "P020", "title": "劇場復原", "en": "The theater had been closed for a decade {before} volunteers began repairs. They first replaced the roof and {then} restored the seats. By the time the doors reopened, the team had {completed} every safety check.", "zh": "劇院在志工開始修繕前已關閉十年。他們先換屋頂，再修復座椅。大門重新開啟時，團隊已完成每項安全檢查。", "bank": [{"word": "then", "zh": "接著", "pos": "Adv"}, {"word": "completed", "zh": "完成", "pos": "V-en"}, {"word": "before", "zh": "在…之前", "pos": "Conj"}, {"word": "postponed", "zh": "延後", "pos": "V-en"}, {"word": "after", "zh": "在…之後", "pos": "Conj"}], "answers": ["before", "then", "completed"], "why": ["關閉十年是開始修繕前的背景，before 符合 had been closed。", "first 與 then 標示施工順序。", "重開前檢查完成才符合敘述流程；postponed 只表示延後，與 every safety check 的完成線索不同。"], "evidence": ["The theater had been closed for a decade {before} volunteers began repairs.", "They first replaced the roof and {then} restored the seats.", "By the time the doors reopened, the team had {completed} every safety check."], "type": 6, "level": 3, "tags": ["Cohesion", "Semantics"], "slot": 1}, {"id": "P021", "title": "舊照片的日期", "en": "At first, the photo was believed to show the town in 1950. Researchers {subsequently} noticed a bridge built in 1962. The image therefore had to be taken {after} that year. This discovery led them to {revise} the date in the archive.", "zh": "起初人們認為照片呈現1950年的小鎮。研究者後來注意到一座1962年建成的橋。因此影像必須拍攝於該年之後。這個發現使他們修正檔案日期。", "bank": [{"word": "preserve", "zh": "保留", "pos": "V"}, {"word": "revise", "zh": "修正", "pos": "V"}, {"word": "subsequently", "zh": "後來", "pos": "Adv"}, {"word": "after", "zh": "在…之後", "pos": "Prep"}, {"word": "previously", "zh": "先前", "pos": "Adv"}], "answers": ["subsequently", "after", "revise"], "why": ["At first 後才出現新發現，subsequently 承接先後；previously 會把發現放在原判斷之前。", "照片含已建成的橋，拍攝時間須在建橋之後；此處 after 接年份。", "新證據推翻1950，應 revise；preserve 原日期會矛盾。"], "evidence": ["Researchers {subsequently} noticed a bridge built in 1962.", "The image therefore had to be taken {after} that year.", "This discovery led them to {revise} the date in the archive."], "type": 6, "level": 4, "tags": ["Cohesion", "Semantics"], "slot": 2}, {"id": "P022", "title": "新來的蜂箱", "en": "A beekeeper placed a hive near the orchard. At first, this {addition} worried the neighbors. The beekeeper then explained how the bees pollinated fruit trees. With this new {information}, residents began to view the hive as an {asset}.", "zh": "養蜂人在果園旁放了一個蜂箱。起初，這個新增物讓鄰居擔心。養蜂人接著解釋蜜蜂如何幫果樹授粉。有了這項新資訊，居民開始把蜂箱視為助益。", "bank": [{"word": "addition", "zh": "新增物", "pos": "N"}, {"word": "asset", "zh": "有用的資產／助益", "pos": "N"}, {"word": "tradition", "zh": "傳統", "pos": "N"}, {"word": "information", "zh": "資訊", "pos": "N"}, {"word": "obstacle", "zh": "障礙", "pos": "N"}], "answers": ["addition", "information", "asset"], "why": ["a hive 首次引入，this addition 回接剛新增的蜂箱；未提多年 tradition。", "this new information 承接剛解釋的授粉作用。", "知道益處後態度轉正，asset 合理；obstacle 延續負面，與轉變不合。"], "evidence": ["At first, this {addition} worried the neighbors.", "With this new {information}, residents began to view the hive as an {asset}.", "With this new {information}, residents began to view the hive as an {asset}."], "type": 7, "level": 2, "tags": ["Cohesion", "Semantics"], "slot": 0}, {"id": "P023", "title": "街角飲水站", "en": "The city installed a drinking fountain outside the station. The {facility} was the first of its kind in the area. A nearby sign explains its {purpose}: reducing disposable bottles. That goal has encouraged shops to offer free {refills}.", "zh": "市府在車站外裝設飲水台。這項設施是該區首座。附近告示說明其用途：減少一次性瓶子。這個目標鼓勵商店提供免費續水。", "bank": [{"word": "purpose", "zh": "用途", "pos": "N"}, {"word": "facility", "zh": "設施", "pos": "N"}, {"word": "receipts", "zh": "收據", "pos": "N"}, {"word": "history", "zh": "歷史", "pos": "N"}, {"word": "refills", "zh": "續裝／續水", "pos": "N"}], "answers": ["facility", "purpose", "refills"], "why": ["The facility 以定指概括前句首次介紹的 fountain。", "冒號後 reducing disposable bottles 提供用途 purpose，非過往 history。", "That goal 回指減少瓶子，提供 refills 才可讓同一容器再用；receipts 無此關係。"], "evidence": ["The {facility} was the first of its kind in the area.", "A nearby sign explains its {purpose}: reducing disposable bottles.", "That goal has encouraged shops to offer free {refills}."], "type": 7, "level": 3, "tags": ["Cohesion", "Semantics"], "slot": 1}, {"id": "P024", "title": "洞穴新發現", "en": "A team discovered a small cave beneath the hill. Until then, its {existence} had been unknown to local residents. The newly found {site} contained wall markings. These traces raised fresh {questions} about who had visited it.", "zh": "團隊在山丘下發現小洞穴。在那之前，當地居民不知道它的存在。這個新發現的地點有壁面刻痕。這些痕跡引出新的問題：誰曾到訪？", "bank": [{"word": "answers", "zh": "答案", "pos": "N"}, {"word": "site", "zh": "地點", "pos": "N"}, {"word": "existence", "zh": "存在", "pos": "N"}, {"word": "questions", "zh": "問題", "pos": "N"}, {"word": "reputation", "zh": "名聲", "pos": "N"}], "answers": ["existence", "site", "questions"], "why": ["until then 與 discovered 表明原先不知存在；reputation 預設已知道地方且有評價。", "newly found site 重述剛介紹的 cave。", "刻痕讓人問 who，產生 questions，未直接給出 answers。"], "evidence": ["Until then, its {existence} had been unknown to local residents.", "The newly found {site} contained wall markings.", "These traces raised fresh {questions} about who had visited it."], "type": 7, "level": 4, "tags": ["Cohesion", "Semantics"], "slot": 2}, {"id": "P025", "title": "問卷的邊界", "en": "Only twenty students answered the survey. Their replies describe {some} students' preferences, not everyone's. The results may be {useful} for planning a small trial, but they cannot justify a claim about the {entire} school.", "zh": "只有二十位學生填問卷。回覆描述的是部分學生的偏好，不是每個人。結果可能對規劃小型試辦有用，但不能用來宣稱全校都如此。", "bank": [{"word": "some", "zh": "部分", "pos": "Det"}, {"word": "entire", "zh": "整個的", "pos": "Adj"}, {"word": "all", "zh": "所有", "pos": "Det"}, {"word": "useful", "zh": "有用的", "pos": "Adj"}, {"word": "useless", "zh": "無用的", "pos": "Adj"}], "answers": ["some", "useful", "entire"], "why": ["not everyone's 限制範圍只能是 some；all 過度概括。", "may be…for planning a small trial 保留局部用途，不能推為 useless。", "cannot justify 限定無法代表 entire school；注意否定的是全校推論。"], "evidence": ["Their replies describe {some} students' preferences, not everyone's.", "The results may be {useful} for planning a small trial, but they cannot justify a claim about the {entire} school.", "The results may be {useful} for planning a small trial, but they cannot justify a claim about the {entire} school."], "type": 8, "level": 2, "tags": ["Logic", "Semantics"], "slot": 0}, {"id": "P026", "title": "有條件的免費", "en": "The museum offers free entry to children under twelve. This {limited} offer does not apply to adults. It also excludes special exhibitions, so not {every} gallery is free. Families should check the conditions {before} booking.", "zh": "博物館讓十二歲以下兒童免費入場。這項有限優惠不適用成人，也排除特展，因此不是每個展廳都免費。家庭應在訂票前查看條件。", "bank": [{"word": "before", "zh": "在…之前", "pos": "Prep"}, {"word": "after", "zh": "在…之後", "pos": "Prep"}, {"word": "universal", "zh": "普遍適用的", "pos": "Adj"}, {"word": "every", "zh": "每個", "pos": "Det"}, {"word": "limited", "zh": "有限制的", "pos": "Adj"}], "answers": ["limited", "every", "before"], "why": ["年齡與展覽皆有限制，limited；universal 誤把局部優惠擴至全部。", "not every 表不是每個；其否定範圍不等於所有展廳都收費。", "訂票前查條件才能做決定，before；after 已錯過訂票判斷時點。"], "evidence": ["This {limited} offer does not apply to adults.", "It also excludes special exhibitions, so not {every} gallery is free.", "Families should check the conditions {before} booking."], "type": 8, "level": 3, "tags": ["Logic", "Semantics"], "slot": 1}, {"id": "P027", "title": "藥草試驗的措辭", "en": "The report says the tea may help some people sleep. The word may expresses {possibility}, not certainty. Nor does some mean {everyone}. Readers should avoid turning a cautious statement into an {absolute} promise.", "zh": "報告說這種茶可能幫助部分人睡眠。may 表可能而非確定；some 也不表示每個人。讀者應避免把審慎陳述變成絕對承諾。", "bank": [{"word": "possibility", "zh": "可能性", "pos": "N"}, {"word": "absolute", "zh": "絕對的", "pos": "Adj"}, {"word": "temporary", "zh": "暫時的", "pos": "Adj"}, {"word": "everyone", "zh": "每個人", "pos": "Pron"}, {"word": "certainty", "zh": "確定性", "pos": "N"}], "answers": ["possibility", "everyone", "absolute"], "why": ["not certainty 明確對比可能性 possibility。", "some 的範圍小於 everyone；Nor does…mean 否定等同關係。", "前兩句都談語氣及範圍，不談持續時間，故 absolute 而非 temporary。此為語言判讀練習，非療效主張。"], "evidence": ["The word may expresses {possibility}, not certainty.", "Nor does some mean {everyone}.", "Readers should avoid turning a cautious statement into an {absolute} promise."], "type": 8, "level": 4, "tags": ["Logic", "Semantics"], "slot": 2}, {"id": "P028", "title": "修理文化", "en": "One neighbor fixes lamps; another repairs torn bags. Their skills differ, but both keep useful objects out of the trash. The shared principle is {repair}. It challenges a culture of constant {replacement} and encourages people to value what they already {own}.", "zh": "一位鄰居修燈，另一位補袋子。技能不同，卻都讓有用物品免於被丟棄。共同原則是修理。它挑戰不斷汰換的文化，鼓勵人們珍惜已擁有的東西。", "bank": [{"word": "repair", "zh": "修理", "pos": "N"}, {"word": "own", "zh": "擁有", "pos": "V"}, {"word": "replacement", "zh": "替換", "pos": "N"}, {"word": "borrow", "zh": "借入", "pos": "V"}, {"word": "decoration", "zh": "裝飾", "pos": "N"}], "answers": ["repair", "replacement", "own"], "why": ["fixes 與 repairs 的共同主題是 repair，不是物件外觀 decoration。", "keep…out of trash 對抗不斷 replacement 的消費方式。", "already own 指現有物品；文中兩例未建立向他人 borrow 的關係。"], "evidence": ["The shared principle is {repair}.", "It challenges a culture of constant {replacement} and encourages people to value what they already {own}.", "It challenges a culture of constant {replacement} and encourages people to value what they already {own}."], "type": 9, "level": 3, "tags": ["Global", "Semantics"], "slot": 0}, {"id": "P029", "title": "慢速旅行", "en": "The writer walks through small towns instead of rushing between landmarks. She talks with shopkeepers and returns to the same café. Her journey emphasizes {connection} over speed. For her, travel is less about collecting {destinations} than about gaining local {understanding}.", "zh": "作者步行穿過小鎮，不急著趕景點。她與店主聊天，重訪同一家咖啡館。旅程重視連結勝過速度。對她來說，旅行較不在於蒐集目的地，而在於深入理解地方。", "bank": [{"word": "connection", "zh": "連結", "pos": "N"}, {"word": "competition", "zh": "競爭", "pos": "N"}, {"word": "destinations", "zh": "目的地", "pos": "N"}, {"word": "ignorance", "zh": "無知", "pos": "N"}, {"word": "understanding", "zh": "理解", "pos": "N"}], "answers": ["connection", "destinations", "understanding"], "why": ["聊天與重訪共同指向 connection；沒有和他人 competition 的線索。", "collecting destinations 概括趕景點式旅行，與理解地方對比。", "接觸居民帶來 understanding；ignorance 與整篇方向相反。"], "evidence": ["Her journey emphasizes {connection} over speed.", "For her, travel is less about collecting {destinations} than about gaining local {understanding}.", "For her, travel is less about collecting {destinations} than about gaining local {understanding}."], "type": 9, "level": 4, "tags": ["Global", "Semantics"], "slot": 1}, {"id": "P030", "title": "看不見的工作", "en": "A concert depends on more than the singer. Technicians test microphones, cleaners prepare the hall, and ushers guide the audience. These examples highlight the importance of {teamwork}. Public attention may focus on one {performer}, but success relies on many people's {contributions}.", "zh": "演唱會不只靠歌手。技術人員測試麥克風，清潔人員整理場地，引導員帶觀眾入場。這些例子凸顯團隊合作的重要。大眾目光可能集中在一位表演者身上，成功卻仰賴許多人的貢獻。", "bank": [{"word": "fame", "zh": "名氣", "pos": "N"}, {"word": "teamwork", "zh": "團隊合作", "pos": "N"}, {"word": "performer", "zh": "表演者", "pos": "N"}, {"word": "contributions", "zh": "貢獻", "pos": "N"}, {"word": "disagreements", "zh": "分歧", "pos": "N"}], "answers": ["teamwork", "performer", "contributions"], "why": ["多種幕後角色的共同意義是 teamwork，非追求 fame。", "one performer 呼應前句 singer 與公眾焦點。", "列出的都是協助成功的 contributions；沒有 disagreements 的證據。"], "evidence": ["These examples highlight the importance of {teamwork}.", "Public attention may focus on one {performer}, but success relies on many people's {contributions}.", "Public attention may focus on one {performer}, but success relies on many people's {contributions}."], "type": 9, "level": 5, "tags": ["Global", "Semantics"], "slot": 2}, {"id": "P031", "title": "食堂剩食方案", "en": "The article opens by describing food waste in a cafeteria. It then presents a {solution}: smaller default portions with free seconds. Next, it reports the {results} of a month-long trial. The final paragraph discusses {limitations}, including the trial's short duration.", "zh": "文章先描述食堂剩食，再提出解方：預設份量較小，可免費續餐。接著報告一個月試辦的結果。末段討論限制，包括試辦時間太短。", "bank": [{"word": "origin", "zh": "起源", "pos": "N"}, {"word": "solution", "zh": "解決方案", "pos": "N"}, {"word": "limitations", "zh": "限制", "pos": "N"}, {"word": "praise", "zh": "讚美", "pos": "N"}, {"word": "results", "zh": "結果", "pos": "N"}], "answers": ["solution", "results", "limitations"], "why": ["問題後的 smaller portions 是 solution，不是在考據 origin。", "試办之後呈現觀察結果 results。", "including short duration 是限制 limitations，不是讚美 praise。"], "evidence": ["It then presents a {solution}: smaller default portions with free seconds.", "Next, it reports the {results} of a month-long trial.", "The final paragraph discusses {limitations}, including the trial's short duration."], "type": 10, "level": 3, "tags": ["Global", "Semantics"], "slot": 0}, {"id": "P032", "title": "自行車道比較", "en": "The first section describes the old road layout. The second introduces a protected bicycle lane. Rather than telling one continuous story, the article uses {comparison}. It evaluates the two designs against the same safety {criteria} before offering a {recommendation}.", "zh": "第一節描述舊道路配置，第二節介紹受保護的自行車道。文章不是講述一條連續故事，而是使用比較。它依相同安全標準評估兩種設計，再提出建議。", "bank": [{"word": "comparison", "zh": "比較", "pos": "N"}, {"word": "criteria", "zh": "標準", "pos": "N"}, {"word": "recommendation", "zh": "建議", "pos": "N"}, {"word": "rumor", "zh": "傳聞", "pos": "N"}, {"word": "chronology", "zh": "時間順序", "pos": "N"}], "answers": ["comparison", "criteria", "recommendation"], "why": ["two designs against the same… 是比較架構；chronology 只排時間，未表達此評估。", "same safety criteria 是共同比較標準。", "評估後提供有根據的 recommendation；rumor 不符合分析文結構。"], "evidence": ["Rather than telling one continuous story, the article uses {comparison}.", "It evaluates the two designs against the same safety {criteria} before offering a {recommendation}.", "It evaluates the two designs against the same safety {criteria} before offering a {recommendation}."], "type": 10, "level": 4, "tags": ["Global", "Semantics"], "slot": 1}, {"id": "P033", "title": "一項發明的誕生", "en": "The essay traces a filter from an early sketch to a working device. Its main organizing principle is {chronology}. Failed tests appear before later {improvements}, helping readers understand how each problem shaped the next {version}.", "zh": "文章追溯濾器從早期草圖到可運作裝置的歷程。主要組織原則是時間順序。失敗測試先於後來的改良，讓讀者明白每個問題如何形塑下一個版本。", "bank": [{"word": "ancestor", "zh": "祖先", "pos": "N"}, {"word": "improvements", "zh": "改良", "pos": "N"}, {"word": "version", "zh": "版本", "pos": "N"}, {"word": "chronology", "zh": "時間順序", "pos": "N"}, {"word": "contrast", "zh": "對比", "pos": "N"}], "answers": ["chronology", "improvements", "version"], "why": ["from early sketch to working device 加上 before later 構成 chronology；不是以兩案差異為主的 contrast。", "失敗引出 later improvements，符合逐次發展。", "next version 是裝置迭代；ancestor 不能表示裝置的下一版。"], "evidence": ["Its main organizing principle is {chronology}.", "Failed tests appear before later {improvements}, helping readers understand how each problem shaped the next {version}.", "Failed tests appear before later {improvements}, helping readers understand how each problem shaped the next {version}."], "type": 10, "level": 5, "tags": ["Global", "Semantics"], "slot": 2}, {"id": "P034", "title": "線上學習的反例", "en": "The opening paragraph claims that online lessons save everyone time. The next describes a student with an unreliable connection. This case serves as a {counterexample}, showing that the claim needs {qualification}. It does not prove that all online learning is a {failure}.", "zh": "首段主張線上課程節省每個人的時間。下一段描述一位網路不穩的學生。這個案例是反例，顯示主張需要加上限制；它並未證明所有線上學習都失敗。", "bank": [{"word": "counterexample", "zh": "反例", "pos": "N"}, {"word": "confirmation", "zh": "證實", "pos": "N"}, {"word": "qualification", "zh": "限定／保留條件", "pos": "N"}, {"word": "failure", "zh": "失敗", "pos": "N"}, {"word": "certainty", "zh": "確定性", "pos": "N"}], "answers": ["counterexample", "qualification", "failure"], "why": ["網路不穩會推翻 everyone 的絕對主張，故 counterexample 而非 confirmation。", "反例要求主張 qualification，不是增加 certainty。", "not prove…all 限定反例不能證明所有情況 failure。"], "evidence": ["This case serves as a {counterexample}, showing that the claim needs {qualification}.", "This case serves as a {counterexample}, showing that the claim needs {qualification}.", "It does not prove that all online learning is a {failure}."], "type": 11, "level": 3, "tags": ["Global", "Semantics"], "slot": 0}, {"id": "P035", "title": "量測前的說明", "en": "Before presenting the findings, the researcher explains where the sensors were placed and how often they recorded data. This paragraph describes the {method}. Its purpose is to make the study {reproducible}, rather than to announce the final {conclusion}.", "zh": "在呈現發現之前，研究者解釋感測器放在哪裡以及記錄頻率。這一段描述方法，目的是讓研究能被重做，而非宣告最後結論。", "bank": [{"word": "conclusion", "zh": "結論", "pos": "N"}, {"word": "secret", "zh": "祕密的", "pos": "Adj"}, {"word": "reproducible", "zh": "可重現的", "pos": "Adj"}, {"word": "result", "zh": "結果", "pos": "N"}, {"word": "method", "zh": "方法", "pos": "N"}], "answers": ["method", "reproducible", "conclusion"], "why": ["位置與記錄頻率是研究 method；資料數值才屬 result。", "公開步驟使人能重做，reproducible；secret 意思相反。", "rather than 指此段尚未提出 final conclusion。"], "evidence": ["This paragraph describes the {method}.", "Its purpose is to make the study {reproducible}, rather than to announce the final {conclusion}.", "Its purpose is to make the study {reproducible}, rather than to announce the final {conclusion}."], "type": 11, "level": 4, "tags": ["Global", "Semantics"], "slot": 1}, {"id": "P036", "title": "故事作為開場", "en": "The article begins with a child struggling to cross a busy road. The next paragraphs examine pedestrian safety across the city. The opening story functions as an {illustration} of the broader issue. It draws readers' {attention} before the writer turns to statistical {evidence}.", "zh": "文章先寫一位孩子難以穿越繁忙道路，再檢視全市行人安全。開場故事是較廣泛議題的具體例示，先吸引讀者注意，作者接著轉向統計證據。", "bank": [{"word": "conclusion", "zh": "結論", "pos": "N"}, {"word": "illustration", "zh": "例示", "pos": "N"}, {"word": "evidence", "zh": "證據", "pos": "N"}, {"word": "attention", "zh": "注意力", "pos": "N"}, {"word": "fiction", "zh": "虛構故事", "pos": "N"}], "answers": ["illustration", "attention", "evidence"], "why": ["開場個案引出全市議題，功能是 illustration；結論應總結論述。", "draw readers' attention 表故事引起注意的功能。", "statistical evidence 與前面個案互補；未說統計是 fiction。"], "evidence": ["The opening story functions as an {illustration} of the broader issue.", "It draws readers' {attention} before the writer turns to statistical {evidence}.", "It draws readers' {attention} before the writer turns to statistical {evidence}."], "type": 11, "level": 5, "tags": ["Global", "Semantics"], "slot": 2}, {"id": "P037", "title": "審慎的書評", "en": "The reviewer praises the book's clear diagrams but notes several unsupported claims. Her overall tone is {qualified}: she sees strengths as well as weaknesses. She {recommends} it for beginners, while advising advanced readers to consult additional {sources}.", "zh": "評論者稱讚書中的清楚圖表，但指出數項缺乏支持的主張。她整體持保留態度，兼看優缺點。她推薦初學者閱讀，也建議進階讀者參照更多資料來源。", "bank": [{"word": "sources", "zh": "資料來源", "pos": "N"}, {"word": "recommends", "zh": "推薦", "pos": "V"}, {"word": "uncritical", "zh": "不加批判的", "pos": "Adj"}, {"word": "qualified", "zh": "有保留的", "pos": "Adj"}, {"word": "rejects", "zh": "拒絕／否定", "pos": "V"}], "answers": ["qualified", "recommends", "sources"], "why": ["有稱讚也有批評是 qualified；uncritical 忽略指出的弱點。", "for beginners 與另給進階建議顯示有條件 recommends，不是 rejects。", "unsupported claims 需 additional sources 補強，與審慎立場一致。"], "evidence": ["Her overall tone is {qualified}: she sees strengths as well as weaknesses.", "She {recommends} it for beginners, while advising advanced readers to consult additional {sources}.", "She {recommends} it for beginners, while advising advanced readers to consult additional {sources}."], "type": 12, "level": 3, "tags": ["Global", "Semantics"], "slot": 0}, {"id": "P038", "title": "公園改建評論", "en": "Developers call the plan a great improvement. The writer, however, questions why mature trees must be removed and demands a less damaging alternative. Her attitude toward the current proposal is {critical}. The quoted praise belongs to the {developers}, not to the writer, who remains {unconvinced}.", "zh": "開發者稱計畫為重大改善。然而作者質疑為何必須移除成熟樹木，並要求損害更小的替代方案。她對現有提案持批判態度。引述的稱讚屬於開發者，不是仍未被說服的作者。", "bank": [{"word": "critical", "zh": "批判的", "pos": "Adj"}, {"word": "enthusiastic", "zh": "熱切支持的", "pos": "Adj"}, {"word": "residents", "zh": "居民", "pos": "N"}, {"word": "developers", "zh": "開發者", "pos": "N"}, {"word": "unconvinced", "zh": "未被說服的", "pos": "Adj"}], "answers": ["critical", "developers", "unconvinced"], "why": ["questions 與 demands an alternative 表 critical；不能把引述的 improvement 當作者 enthusiastic。", "開頭明確由 Developers call 提供 praise 的發話者。", "要求替代方案表示 unconvinced，和 current proposal 的批評一致。"], "evidence": ["Her attitude toward the current proposal is {critical}.", "The quoted praise belongs to the {developers}, not to the writer, who remains {unconvinced}.", "The quoted praise belongs to the {developers}, not to the writer, who remains {unconvinced}."], "type": 12, "level": 4, "tags": ["Global", "Semantics"], "slot": 1}, {"id": "P039", "title": "新工具的期待", "en": "The columnist believes the translation tool could help travelers. Yet she warns that errors remain common in sensitive conversations. Her position is {cautiously} positive. She welcomes the tool's {potential} without treating it as a complete {substitute} for human judgment.", "zh": "專欄作家認為翻譯工具可能幫助旅人，但警告在敏感對話中仍常出錯。她的態度是審慎樂觀，肯定工具潛力，卻不把它視為完全替代人類判斷的東西。", "bank": [{"word": "potential", "zh": "潛力", "pos": "N"}, {"word": "cautiously", "zh": "審慎地", "pos": "Adv"}, {"word": "substitute", "zh": "替代品", "pos": "N"}, {"word": "unreservedly", "zh": "毫無保留地", "pos": "Adv"}, {"word": "certainty", "zh": "確定性", "pos": "N"}], "answers": ["cautiously", "potential", "substitute"], "why": ["could 與 warns 都有保留，cautiously；unreservedly 忽略限制。", "未來可能幫助是 potential，不是保證效益的 certainty。", "without treating…as a complete substitute 限定她沒有主張可完全取代人。"], "evidence": ["Her position is {cautiously} positive.", "She welcomes the tool's {potential} without treating it as a complete {substitute} for human judgment.", "She welcomes the tool's {potential} without treating it as a complete {substitute} for human judgment."], "type": 12, "level": 5, "tags": ["Global", "Semantics"], "slot": 2}, {"id": "P040", "title": "空掉的餵食器", "en": "A bird feeder was full at sunrise and empty by noon. A camera showed several birds visiting it. The evidence {suggests} that birds ate at least some of the seeds. It does not establish the {exact} amount each bird consumed or rule out every other {explanation}.", "zh": "餵鳥器日出時是滿的，中午已空。攝影機拍到幾隻鳥到訪。證據暗示鳥至少吃掉部分種子，卻無法確定每隻鳥吃的精確量，也不能排除所有其他解釋。", "bank": [{"word": "explanation", "zh": "解釋", "pos": "N"}, {"word": "suggests", "zh": "暗示／顯示可能", "pos": "V"}, {"word": "approximate", "zh": "大約的", "pos": "Adj"}, {"word": "proves", "zh": "證明", "pos": "V"}, {"word": "exact", "zh": "精確的", "pos": "Adj"}], "answers": ["suggests", "exact", "explanation"], "why": ["拍到到訪只能支持 suggests，不能用 proves 宣稱已排除其他原因。", "does not establish 指不能精確分配每隻鳥的量，exact；文中沒有可供估計分量的資料。", "rule out every other explanation 限制推論，不把單一情境當唯一原因。"], "evidence": ["The evidence {suggests} that birds ate at least some of the seeds.", "It does not establish the {exact} amount each bird consumed or rule out every other {explanation}.", "It does not establish the {exact} amount each bird consumed or rule out every other {explanation}."], "type": 13, "level": 3, "tags": ["Global", "Semantics"], "slot": 0}, {"id": "P041", "title": "延長開放的線索", "en": "After the library extended its evening hours, more students borrowed books at night. This pattern is {consistent} with improved access. However, a simultaneous reading campaign means the increase cannot be {attributed} solely to longer hours. Further comparison would be {needed}.", "zh": "圖書館延長晚間開放後，更多學生夜間借書。這個趨勢與可近性改善相符。然而同期有閱讀推廣活動，因此不能把增加完全歸因於延長時間，仍需進一步比較。", "bank": [{"word": "consistent", "zh": "相符的", "pos": "Adj"}, {"word": "needed", "zh": "需要的", "pos": "V-en"}, {"word": "unnecessary", "zh": "不必要的", "pos": "Adj"}, {"word": "incompatible", "zh": "不相容的", "pos": "Adj"}, {"word": "attributed", "zh": "歸因", "pos": "V-en"}], "answers": ["consistent", "attributed", "needed"], "why": ["夜間借閱增加與改善可近性相符，consistent；不是 incompatible。", "attributed solely to 表單一歸因，cannot 與同期活動限制因果推論。", "還有其他可能因素，所以進一步比較 needed；unnecessary 過早定論。"], "evidence": ["This pattern is {consistent} with improved access.", "However, a simultaneous reading campaign means the increase cannot be {attributed} solely to longer hours.", "Further comparison would be {needed}."], "type": 13, "level": 4, "tags": ["Global", "Semantics"], "slot": 1}, {"id": "P042", "title": "腳印與雨水", "en": "Investigators found footprints on a path that had been smooth after last night's rain. Someone must have used it {since} the rain stopped. The prints alone cannot reveal the person's {identity}. They support a limited claim about the {timing} of a visit.", "zh": "調查者在步道發現腳印，而昨夜雨後路面原本平整。一定有人在雨停後走過。單靠腳印不能揭露身分，只能支持到訪時間的有限判斷。", "bank": [{"word": "timing", "zh": "發生時間", "pos": "N"}, {"word": "identity", "zh": "身分", "pos": "N"}, {"word": "intention", "zh": "意圖", "pos": "N"}, {"word": "before", "zh": "在…之前", "pos": "Prep"}, {"word": "since", "zh": "自從", "pos": "Prep"}], "answers": ["since", "identity", "timing"], "why": ["雨後平整而現在有腳印，限定在雨停後 since；before 的腳印應已被平整雨面抹除。", "腳印只證有人經過，無法確定 identity。", "雨提供時間界線 timing，沒有提供造訪 intention。"], "evidence": ["Someone must have used it {since} the rain stopped.", "The prints alone cannot reveal the person's {identity}.", "They support a limited claim about the {timing} of a visit."], "type": 13, "level": 5, "tags": ["Global", "Semantics"], "slot": 2}, {"id": "P043", "title": "仍待改善的市場", "en": "The market reduced plastic bags but still used disposable food boxes. Its waste problem was therefore only {partly} solved. The final paragraph calls for {further} action, keeping the conclusion consistent with the remaining {challenge}.", "zh": "市場減少塑膠袋，卻仍使用一次性餐盒。因此垃圾問題只解決一部分。末段要求進一步行動，讓結論與仍存在的挑戰保持一致。", "bank": [{"word": "celebration", "zh": "慶祝", "pos": "N"}, {"word": "completely", "zh": "完全地", "pos": "Adv"}, {"word": "further", "zh": "進一步的", "pos": "Adj"}, {"word": "challenge", "zh": "挑戰", "pos": "N"}, {"word": "partly", "zh": "部分地", "pos": "Adv"}], "answers": ["partly", "further", "challenge"], "why": ["餐盒仍在使用，不能說 completely solved，故 partly。", "尚有問題，所以需要 further action。", "remaining challenge 回接餐盒垃圾；celebration 無法承接尚未解決的問題。"], "evidence": ["Its waste problem was therefore only {partly} solved.", "The final paragraph calls for {further} action, keeping the conclusion consistent with the remaining {challenge}.", "The final paragraph calls for {further} action, keeping the conclusion consistent with the remaining {challenge}."], "type": 14, "level": 3, "tags": ["Global", "Semantics"], "slot": 0}, {"id": "P044", "title": "不同的讀者", "en": "The opening warns that the guide is designed for beginners. Later chapters explain basic terms and avoid advanced mathematics. The conclusion should describe the book as {introductory}, not exhaustive. Its simplicity is {intentional} and fits the needs of its intended {audience}.", "zh": "開頭提醒指南為初學者設計。後續章節解釋基本術語，避開高階數學。結論應稱它是入門書而非詳盡大全。它的簡單是刻意的，符合目標讀者需求。", "bank": [{"word": "introductory", "zh": "入門的", "pos": "Adj"}, {"word": "audience", "zh": "讀者／受眾", "pos": "N"}, {"word": "accidental", "zh": "意外的", "pos": "Adj"}, {"word": "intentional", "zh": "刻意的", "pos": "Adj"}, {"word": "advanced", "zh": "進階的", "pos": "Adj"}], "answers": ["introductory", "intentional", "audience"], "why": ["beginners 與 basic terms 全文一致支持 introductory；advanced 矛盾。", "開头已定義設計對象，簡單是 intentional，不是 accidental。", "intended audience 指文章前面已說的初學者。"], "evidence": ["The conclusion should describe the book as {introductory}, not exhaustive.", "Its simplicity is {intentional} and fits the needs of its intended {audience}.", "Its simplicity is {intentional} and fits the needs of its intended {audience}."], "type": 14, "level": 4, "tags": ["Global", "Semantics"], "slot": 1}, {"id": "P045", "title": "失敗後的突破", "en": "Early tests of the boat failed because its frame was too heavy. Engineers then reduced its weight, and the final trial succeeded. A summary claiming that the team made no {progress} would contradict the account. The ending should acknowledge both the initial {setback} and the eventual {success}.", "zh": "船隻早期測試因框架太重而失敗。工程師之後減重，最後試驗成功。若摘要宣稱團隊毫無進展，就會與敘事矛盾。結尾應同時承認最初的挫敗與最終成功。", "bank": [{"word": "setback", "zh": "挫敗", "pos": "N"}, {"word": "success", "zh": "成功", "pos": "N"}, {"word": "stability", "zh": "穩定性", "pos": "N"}, {"word": "failure", "zh": "失敗", "pos": "N"}, {"word": "progress", "zh": "進展", "pos": "N"}], "answers": ["progress", "setback", "success"], "why": ["由失敗到成功是 progress；不能用 no progress 概括。", "initial setback 呼應 early tests failed。", "eventual success 呼應 final trial succeeded；failure 會推翻已明示的結果。"], "evidence": ["A summary claiming that the team made no {progress} would contradict the account.", "The ending should acknowledge both the initial {setback} and the eventual {success}.", "The ending should acknowledge both the initial {setback} and the eventual {success}."], "type": 14, "level": 5, "tags": ["Global", "Semantics"], "slot": 2}, {"id": "P046", "title": "領養後的適應", "en": "The family decided to {adopt} a dog from a shelter. The animal needed time to {adapt} to its new home. To help it feel safe, they kept its daily routine {consistent}.", "zh": "這家人決定從收容所領養一隻狗。狗需要時間適應新家。他們維持一致的日常作息，幫助牠安心。", "bank": [{"word": "adopt", "zh": "領養／採用", "pos": "V"}, {"word": "consistent", "zh": "一致的", "pos": "Adj"}, {"word": "contradictory", "zh": "互相矛盾的", "pos": "Adj"}, {"word": "adapt", "zh": "適應／調整", "pos": "V"}, {"word": "adept", "zh": "熟練的", "pos": "Adj"}], "answers": ["adopt", "adapt", "consistent"], "why": ["從 shelter 接狗回家是 adopt，不是適應 adapt。", "adapt to 表適應新環境；adopt 不接 to 表此義。", "routine consistent 表作息模式一致；contradictory 表互相矛盾，與固定作息幫助安心的目的相反。"], "evidence": ["The family decided to {adopt} a dog from a shelter.", "The animal needed time to {adapt} to its new home.", "To help it feel safe, they kept its daily routine {consistent}."], "type": 15, "level": 1, "tags": ["Semantics"], "slot": 0}, {"id": "P047", "title": "沙漠裡的甜點", "en": "After crossing the {desert}, the travelers reached a small inn. Dinner ended with a sweet {dessert} made from dates. The host explained that these fruits were an important local {crop}.", "zh": "旅人穿越沙漠後抵達小旅館。晚餐以椰棗做的甜點收尾。主人解釋這些水果是當地重要作物。", "bank": [{"word": "crop", "zh": "作物", "pos": "N"}, {"word": "corpse", "zh": "屍體", "pos": "N"}, {"word": "deserted", "zh": "被遺棄的", "pos": "Adj"}, {"word": "desert", "zh": "沙漠", "pos": "N"}, {"word": "dessert", "zh": "甜點", "pos": "N"}], "answers": ["desert", "dessert", "crop"], "why": ["crossing the desert 是穿越地形；dessert 是吃的甜點。", "sweet 且晚餐收尾，故 dessert，注意雙 s。", "dates 是可種植的 crop；corpse 拼字局部相近但意思完全不合。"], "evidence": ["After crossing the {desert}, the travelers reached a small inn.", "Dinner ended with a sweet {dessert} made from dates.", "The host explained that these fruits were an important local {crop}."], "type": 15, "level": 2, "tags": ["Semantics"], "slot": 1}, {"id": "P048", "title": "校長的原則", "en": "The {principal} announced a new recycling rule. Its central {principle} was simple: use fewer materials before worrying about disposal. The school would begin with reusable lunch {containers}.", "zh": "校長宣布新的回收規定。核心原則很簡單：在煩惱如何丟棄之前，先減少材料使用。學校將從可重複使用的午餐容器開始。", "bank": [{"word": "principal", "zh": "校長", "pos": "N"}, {"word": "contents", "zh": "內容物", "pos": "N"}, {"word": "principle", "zh": "原則", "pos": "N"}, {"word": "principally", "zh": "主要地", "pos": "Adv"}, {"word": "containers", "zh": "容器", "pos": "N"}], "answers": ["principal", "principle", "containers"], "why": ["announced 的人物主詞為 principal；principle 不是校長。", "central principle 是核心原則；同音字不可互換。", "reusable lunch containers 是可重用容器，contents 是裡面的食物，不能如此描述重複使用。"], "evidence": ["The {principal} announced a new recycling rule.", "Its central {principle} was simple: use fewer materials before worrying about disposal.", "The school would begin with reusable lunch {containers}."], "type": 15, "level": 3, "tags": ["Semantics"], "slot": 2}, {"id": "P049", "title": "科展參與者", "en": "Every {participant}
