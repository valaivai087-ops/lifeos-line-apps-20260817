omplementary ways to explore the past.", "why": "搜尋文字和聽見聲音各補足不同需求，complementary；未提供互相矛盾證據。", "en": "The team recorded memories of a closed railway station. These interviews captured details missing from official records. The spoken material was then turned into written transcripts. This conversion made the stories easier to search. To preserve the speakers' voices as well, the archive also kept the original recordings. Together, the two formats offered complementary ways to explore the past.", "zh": "團隊錄下人們對已關閉車站的回憶。訪談捕捉官方紀錄缺少的細節，口述材料再轉成逐字稿。這種轉換讓故事更容易搜尋。為同時保留受訪者聲音，檔案館也留下原錄音。兩種格式提供互補的歷史探索方式。"}]}, {"word": "completed", "meanings": ["完成"], "pos": ["V-en"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P020", "title": "劇場復原", "blank": 3, "level": 3, "type": "時間線", "evidence": "By the time the doors reopened, the team had completed every safety check.", "why": "重開前檢查完成才符合敘述流程；postponed 只表示延後，與 every safety check 的完成線索不同。", "en": "The theater had been closed for a decade before volunteers began repairs. They first replaced the roof and then restored the seats. By the time the doors reopened, the team had completed every safety check.", "zh": "劇院在志工開始修繕前已關閉十年。他們先換屋頂，再修復座椅。大門重新開啟時，團隊已完成每項安全檢查。"}]}, {"word": "compliment", "meanings": ["稱讚"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P120", "title": "展覽的文具清單", "blank": 5, "level": 2, "type": "字形相似", "evidence": "She later offered a compliment on the team's careful preparation.", "why": "offer a compliment on 準備工作，是稱讚，不是和誰競爭。", "en": "Before the art fair, the class bought pens and other stationery. The supply cart remained stationary while students unloaded it. Each student gave the organizer a description of a planned display. The organizer checked that the labels would complement the artwork rather than distract from it. She later offered a compliment on the team's careful preparation.", "zh": "美術展前，班上買筆與其他文具。學生卸貨時，推車保持不動。每人向主辦者描述預計展出內容。主辦者確認標籤能補充作品而非搶焦點，後來也稱讚團隊準備細心。"}]}, {"word": "conclusion", "meanings": ["結論"], "pos": ["N"], "tags": ["Global", "Semantics", "Logic"], "examples": [{"pid": "P035", "title": "量測前的說明", "blank": 3, "level": 4, "type": "段落功能", "evidence": "Its purpose is to make the study reproducible, rather than to announce the final conclusion.", "why": "rather than 指此段尚未提出 final conclusion。", "en": "Before presenting the findings, the researcher explains where the sensors were placed and how often they recorded data. This paragraph describes the method. Its purpose is to make the study reproducible, rather than to announce the final conclusion.", "zh": "在呈現發現之前，研究者解釋感測器放在哪裡以及記錄頻率。這一段描述方法，目的是讓研究能被重做，而非宣告最後結論。"}, {"pid": "P078", "title": "缺貨的原因", "blank": 3, "level": 4, "type": "上下文邏輯", "evidence": "Because both factors could explain the shortage, she checked order records before reaching a conclusion.", "why": "先查紀錄再 reaching a conclusion，避免單因推斷。", "en": "The shop sold out after a festival, but the manager did not immediately blame rising demand. A delivery had also been delayed. Because both factors could explain the shortage, she checked order records before reaching a conclusion.", "zh": "店家節慶後售罄，但店長未立刻歸因於需求上升。另有一批送貨延遲。因兩因素都能解釋短缺，她先查訂貨紀錄再下結論。"}]}, {"word": "conditions", "meanings": ["條件"], "pos": ["N"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P130", "title": "雨量與報名率", "blank": 3, "level": 4, "type": "上下文邏輯", "evidence": "She compared later weeks with different prices and weather conditions.", "why": "不同天氣為 weather conditions，與價格一起作比較條件。", "en": "More people joined the indoor class during a rainy week. The organizer suspected that bad weather had increased demand. Yet a discounted fee had been introduced at the same time. Because these changes coincided, their effects were difficult to separate. She compared later weeks with different prices and weather conditions. This approach helped test competing explanations. It avoided treating the first observed link as a proven cause.", "zh": "雨週有更多人報名室內課。主辦者懷疑壞天氣增加需求，但同期也開始折扣。兩改變同時發生，效果難分。她比較後續價格、天氣條件不同的週次，檢驗競爭解釋，避免把初見關聯當已證明原因。"}]}, {"word": "conduct", "meanings": ["進行"], "pos": ["V"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P057", "title": "研究討論會", "blank": 3, "level": 3, "type": "搭配判斷", "evidence": "They agreed to conduct another experiment before publishing their report.", "why": "conduct an experiment 為進行實驗；commit 不能用在這個中性研究活動搭配。", "en": "The team gathered to draw conclusions from the data. Members were careful not to jump to conclusions after seeing one unusual result. They agreed to conduct another experiment before publishing their report.", "zh": "團隊聚集，從資料歸納結論。成員謹慎避免只看到一個異常結果就遽下定論，同意發表報告前再做一次實驗。"}]}, {"word": "confidence", "meanings": ["信心"], "pos": ["N"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P002", "title": "修復舊腳踏車", "blank": 3, "level": 2, "type": "詞形", "evidence": "The project also increased their confidence in solving unfamiliar problems.", "why": "their 後需要名詞 confidence；confident 不能作 increased 的受詞核心。", "en": "A repair club opened after school. Its members developed practical skills by fixing old bicycles. They worked carefully to check each brake. The project also increased their confidence in solving unfamiliar problems.", "zh": "課後成立了修車社。社員透過修理舊腳踏車培養實用技能，仔細檢查每個煞車。這項計畫也增強他們解決陌生問題的信心。"}]}, {"word": "confidently", "meanings": ["有自信地"], "pos": ["Adv"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P003", "title": "社區音樂夜", "blank": 2, "level": 3, "type": "詞形", "evidence": "Even beginners played confidently after weeks of practice.", "why": "played 後以 confidently 修飾演奏方式。", "en": "The town invited young musicians to perform. Their creative arrangements surprised the audience. Even beginners played confidently after weeks of practice. The evening showed how regular rehearsal can improve musical ability.", "zh": "小鎮邀請年輕樂手演出。他們有創意的編曲讓觀眾驚喜；連初學者在練習數週後也演奏得有自信。這晚顯示定期排練能提升音樂能力。"}]}, {"word": "confirm", "meanings": ["確認"], "pos": ["V"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P076", "title": "雨天備案", "blank": 3, "level": 2, "type": "上下文邏輯", "evidence": "This backup plan depends on the gym being available, so the team must confirm the booking first.", "why": "必須先 confirm booking 才能確保前提，ignore 會破壞安排。", "en": "The fair can take place outdoors only if the ground is dry. If rain continues, the organizers will relocate it to the gym. This backup plan depends on the gym being available, so the team must confirm the booking first.", "zh": "園遊會只有地面乾燥時才能在戶外辦。若持續下雨，主辦方會把活動移至體育館。備案取決於場館可用，因此團隊必須先確認預訂。"}]}, {"word": "confirming", "meanings": ["確認"], "pos": ["V-ing"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P099", "title": "換文後再觀察", "blank": 2, "level": 5, "type": "尚待確認", "evidence": "The teacher discussed the student's reasoning before confirming a category.", "why": "discussed…before confirming 表經複核確認，不是宣称 proving 類別為絕對真相。", "en": "In a new passage, the learner again missed a contrast clue. This repeated pattern justified closer review, but not an automatic label. The teacher discussed the student's reasoning before confirming a category. If the evidence remained weak, the result stayed uncertain.", "zh": "在新文章中，學生再次漏看轉折線索。重複模式值得進一步檢視，但不宜自動貼標籤。老師先討論作答推理，再確認類別。若證據仍弱，結果維持不確定。"}]}, {"word": "connection", "meanings": ["連結"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P029", "title": "慢速旅行", "blank": 1, "level": 4, "type": "全文主題", "evidence": "Her journey emphasizes connection over speed.", "why": "聊天與重訪共同指向 connection；沒有和他人 competition 的線索。", "en": "The writer walks through small towns instead of rushing between landmarks. She talks with shopkeepers and returns to the same café. Her journey emphasizes connection over speed. For her, travel is less about collecting destinations than about gaining local understanding.", "zh": "作者步行穿過小鎮，不急著趕景點。她與店主聊天，重訪同一家咖啡館。旅程重視連結勝過速度。對她來說，旅行較不在於蒐集目的地，而在於深入理解地方。"}]}, {"word": "connections", "meanings": ["連結"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P114", "title": "留住一座市場的理由", "blank": 2, "level": 4, "type": "全文主題", "evidence": "The article's central concern is the preservation of community connections.", "why": "社區互動為 connections，非 isolation。", "en": "Visitors photographed the old market's colorful signs. Residents, however, valued more than its appearance. Vendors remembered customers' names, neighbors exchanged news, and newcomers learned local customs. These details reveal the market's social role. The article's central concern is the preservation of community connections. Architecture provides the setting, but relationships give the place its meaning. A summary focused only on decoration would miss the broader theme.", "zh": "遊客拍攝老市場彩色招牌，但居民看重的不只是外觀。攤販記得客人姓名，鄰居交換消息，新居民學習地方習俗。細節揭示市場的社會角色。文章關心保存社區連結；建築提供場域，人際關係賦予意義。只談裝飾的摘要會錯失更廣主題。"}]}, {"word": "connects", "meanings": ["連接"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P006", "title": "夜間公車", "blank": 1, "level": 4, "type": "文法骨架", "evidence": "The new bus route, requested by residents for years, connects the station with the hospital.", "why": "requested… 為過去分詞修飾；主句仍需要 connects，不能只填 connecting。", "en": "The new bus route, requested by residents for years, connects the station with the hospital. Workers who finish late use it regularly. The change in the timetable has made their journeys safer.", "zh": "居民要求多年的新公車路線連接車站與醫院。晚下班的工作者固定搭乘。時刻表的改變使他們的通勤更安全。"}]}, {"word": "Consequently", "meanings": ["因此"], "pos": ["Adv"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P013", "title": "手機禁用日", "blank": 2, "level": 2, "type": "句間邏輯", "evidence": "Consequently, the class decided to repeat the experiment; moreover, another class asked to join.", "why": "因活動有效而決定再辦，是結果 Consequently。", "en": "Students expected a phone-free lunch to be boring. However, they ended up talking more than usual. Several discovered shared interests. Consequently, the class decided to repeat the experiment; moreover, another class asked to join.", "zh": "學生原以為不用手機的午餐會很無聊。然而，他們說的話反而比平常多，有些人發現共同興趣。因此，班上決定再試一次；此外，另一班也想加入。"}]}, {"word": "considerably", "meanings": ["相當大幅地"], "pos": ["Adv"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P105", "title": "校園堆肥的改變", "blank": 4, "level": 2, "type": "詞形", "evidence": "The amount sent to the landfill fell considerably.", "why": "fell considerably 表下降幅度；本格並非說垃圾仔細地下落。", "en": "The school began collecting fruit peels for compost. At first, students showed little interest in the project. A teacher explained how food scraps could become valuable material for the garden. After seeing the results, students separated their waste more carefully. The amount sent to the landfill fell considerably. What began as a small experiment became a successful part of daily school life.", "zh": "學校開始收集果皮製作堆肥。起初學生對計畫興趣不大。老師解釋廚餘如何成為花園的珍貴材料。看到成果後，學生更仔細分類垃圾，送往掩埋場的量大幅減少。小實驗成了校園日常中成功的一環。"}]}, {"word": "consistent", "meanings": ["相符的", "一致的"], "pos": ["Adj"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P041", "title": "延長開放的線索", "blank": 1, "level": 4, "type": "推論", "evidence": "This pattern is consistent with improved access.", "why": "夜間借閱增加與改善可近性相符，consistent；不是 incompatible。", "en": "After the library extended its evening hours, more students borrowed books at night. This pattern is consistent with improved access. However, a simultaneous reading campaign means the increase cannot be attributed solely to longer hours. Further comparison would be needed.", "zh": "圖書館延長晚間開放後，更多學生夜間借書。這個趨勢與可近性改善相符。然而同期有閱讀推廣活動，因此不能把增加完全歸因於延長時間，仍需進一步比較。"}, {"pid": "P046", "title": "領養後的適應", "blank": 3, "level": 1, "type": "字形相似", "evidence": "To help it feel safe, they kept its daily routine consistent.", "why": "routine consistent 表作息模式一致；contradictory 表互相矛盾，與固定作息幫助安心的目的相反。", "en": "The family decided to adopt a dog from a shelter. The animal needed time to adapt to its new home. To help it feel safe, they kept its daily routine consistent.", "zh": "這家人決定從收容所領養一隻狗。狗需要時間適應新家。他們維持一致的日常作息，幫助牠安心。"}]}, {"word": "contact", "meanings": ["聯絡"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P082", "title": "正式申請", "blank": 3, "level": 2, "type": "語域不合", "evidence": "Anyone needing assistance should contact the office during business hours.", "why": "needing assistance 應 contact；ghost office 是不回應，目的與場合均不合。", "en": "The notice asks applicants to submit all documents by Friday. Incomplete applications will not be processed. Anyone needing assistance should contact the office during business hours.", "zh": "通知要求申請者週五前提交所有文件。不完整的申請不予處理。需要協助者請在辦公時間聯絡辦公室。"}]}, {"word": "containers", "meanings": ["容器"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P048", "title": "校長的原則", "blank": 3, "level": 3, "type": "字形相似", "evidence": "The school would begin with reusable lunch containers.", "why": "reusable lunch containers 是可重用容器，contents 是裡面的食物，不能如此描述重複使用。", "en": "The principal announced a new recycling rule. Its central principle was simple: use fewer materials before worrying about disposal. The school would begin with reusable lunch containers.", "zh": "校長宣布新的回收規定。核心原則很簡單：在煩惱如何丟棄之前，先減少材料使用。學校將從可重複使用的午餐容器開始。"}]}, {"word": "context", "meanings": ["脈絡"], "pos": ["N"], "tags": ["Logic", "Semantics", "Grammar", "Collocation", "Cohesion", "Global", "POS"], "examples": [{"pid": "P104", "title": "校園新聞的查證", "blank": 4, "level": 5, "type": "作用範圍", "evidence": "The image itself was real, but its new context made it misleading.", "why": "同真照片放新 context 可誤導。", "en": "An image of a locked gate spread through the school chat group. Its caption claimed that the library would close permanently. Many students forwarded it before checking the date. The student newspaper decided to verify the message. First, reporters located the original image. It had been taken during repairs two years earlier. Next, they contacted the librarian, who explained that the current closure would last only one afternoon. The image itself was real, but its new context made it misleading. The team published a correction and included links to the relevant notices. They avoided accusing individual students of deliberate dishonesty because careless sharing did not prove intent. Instead, the article described a simple checking procedure: locate the source, inspect the date, and compare the claim with current information. A follow-up survey found that some readers had changed their sharing habits. The editors welcomed this response but did not call it universal. Only a fraction of students had answered. The final article therefore balanced a positive outcome with a clear statement of its limits. Responsible reporting, it argued, requires the same standards when describing one's own success as when investigating someone else's story. Accuracy is a continuing practice, not a badge earned once.", "zh": "一張上鎖校門照片在校群傳播，圖說宣稱圖書館永久關閉。許多人未查日期便轉傳。校刊決定查證，先找原圖，發現拍於兩年前修繕期間；再聯絡館員，得知本次只關一下午。照片真實，新脈絡卻使它誤導。團隊刊更正並附公告連結，避免指控個別學生蓄意不誠實，因為粗心分享不等於證明意圖。文章介紹查核程序：找來源、查日期、與當前資訊比對。後續調查發現部分讀者改變分享習慣。編輯肯定成果，卻不稱人人都如此，因只有小部分學生作答。文章因此平衡正面成果與清楚限制，主張描述自身成功和調查他人故事應用相同標準。準確是持續實踐，而非一次取得的徽章。"}]}, {"word": "contradiction", "meanings": ["矛盾"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P119", "title": "復育尚未結束", "blank": 5, "level": 4, "type": "全文一致", "evidence": "This recommendation matches the unresolved problem and avoids a contradiction between the ending and the earlier details.", "why": "ending 與 earlier details 不一致會成 contradiction。", "en": "The opening section reports that more fish have returned to the stream. Later, the article notes that pollution still enters after heavy rain. A consistent conclusion must recognize both recovery and continuing risk. Declaring the stream completely restored would go beyond the evidence. The final paragraph instead calls for regular monitoring. This recommendation matches the unresolved problem and avoids a contradiction between the ending and the earlier details.", "zh": "開頭說溪流魚變多，後文提醒大雨後仍有污染流入。一致的結論須兼顧復原和持續風險。宣稱已完全復育會超出證據。末段改為要求定期監測，與未解決問題一致，避免結尾和前文矛盾。"}]}, {"word": "contribute", "meanings": ["貢獻／捐助"], "pos": ["V"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P058", "title": "雨水的依賴", "blank": 3, "level": 1, "type": "介系詞搭配", "evidence": "They now contribute to a fund for a second water source.", "why": "contribute to a fund 表捐助基金，符合共同建水源的語境。", "en": "The village used to depend on a single well. After several dry seasons, residents became aware of the risks. They now contribute to a fund for a second water source.", "zh": "村莊過去仰賴一口井。經過幾次乾季，居民意識到風險。他們現在捐款給開發第二水源的基金。"}]}, {"word": "contribution", "meanings": ["貢獻"], "pos": ["N"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P121", "title": "地方科學競賽", "blank": 4, "level": 3, "type": "詞族混淆", "evidence": "One team's water filter made a useful contribution to the discussion.", "why": "made a useful contribution 指貢獻成果，不能用原形 contribute。", "en": "Each competitor brought a model to the hall. The annual competition encouraged students to solve local problems. Judges valued original thinking more than a fiercely competitive attitude. One team's water filter made a useful contribution to the discussion. Its youngest contributor explained the design with surprising clarity.", "zh": "每位參賽者帶模型到會場。年度競賽鼓勵學生解決地方問題。評審重視原創思考，勝過強烈競爭態度。一隊濾水器對討論有實用貢獻。最年輕的貢獻者解說設計格外清楚。"}]}, {"word": "contributions", "meanings": ["貢獻"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P030", "title": "看不見的工作", "blank": 3, "level": 5, "type": "全文主題", "evidence": "Public attention may focus on one performer, but success relies on many people's contributions.", "why": "列出的都是協助成功的 contributions；沒有 disagreements 的證據。", "en": "A concert depends on more than the singer. Technicians test microphones, cleaners prepare the hall, and ushers guide the audience. These examples highlight the importance of teamwork. Public attention may focus on one performer, but success relies on many people's contributions.", "zh": "演唱會不只靠歌手。技術人員測試麥克風，清潔人員整理場地，引導員帶觀眾入場。這些例子凸顯團隊合作的重要。大眾目光可能集中在一位表演者身上，成功卻仰賴許多人的貢獻。"}]}, {"word": "contributor", "meanings": ["貢獻者"], "pos": ["N"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P121", "title": "地方科學競賽", "blank": 5, "level": 3, "type": "詞族混淆", "evidence": "Its youngest contributor explained the design with surprising clarity.", "why": "youngest contributor 指能解說的人；contribution 不能指最年輕者。", "en": "Each competitor brought a model to the hall. The annual competition encouraged students to solve local problems. Judges valued original thinking more than a fiercely competitive attitude. One team's water filter made a useful contribution to the discussion. Its youngest contributor explained the design with surprising clarity.", "zh": "每位參賽者帶模型到會場。年度競賽鼓勵學生解決地方問題。評審重視原創思考，勝過強烈競爭態度。一隊濾水器對討論有實用貢獻。最年輕的貢獻者解說設計格外清楚。"}]}, {"word": "conversion", "meanings": ["轉換"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P110", "title": "口述故事的保存", "blank": 3, "level": 3, "type": "句間銜接", "evidence": "This conversion made the stories easier to search.", "why": "This conversion 指口述轉文字；不是 destruction。", "en": "The team recorded memories of a closed railway station. These interviews captured details missing from official records. The spoken material was then turned into written transcripts. This conversion made the stories easier to search. To preserve the speakers' voices as well, the archive also kept the original recordings. Together, the two formats offered complementary ways to explore the past.", "zh": "團隊錄下人們對已關閉車站的回憶。訪談捕捉官方紀錄缺少的細節，口述材料再轉成逐字稿。這種轉換讓故事更容易搜尋。為同時保留受訪者聲音，檔案館也留下原錄音。兩種格式提供互補的歷史探索方式。"}]}, {"word": "correlation", "meanings": ["相關"], "pos": ["N"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P077", "title": "相關不等於原因", "blank": 1, "level": 3, "type": "上下文邏輯", "evidence": "The link is a correlation, not proof of causation.", "why": "may already have…提供選擇差異，僅能說 correlation；cause 超出證據。", "en": "Students who joined the club reported higher reading scores. However, they may already have been eager readers. The link is a correlation, not proof of causation. To test the club's effect, researchers need a suitable comparison group and information about students' initial abilities.", "zh": "加入社團的學生回報較高閱讀分數，但他們可能原本就熱愛閱讀。此關係是相關，並非因果證明。要測試社團效果，需要適當比較組及學生起初能力的資訊。"}]}, {"word": "costly", "meanings": ["昂貴的"], "pos": ["Adj"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P134", "title": "可逆的展示設計", "blank": 5, "level": 3, "type": "構詞判斷", "evidence": "The system made later changes less costly.", "why": "less costly 指減少費用，-ly 在 costly 中構成形容詞，不是方式副詞。", "en": "The museum needed labels that could be removed without damaging the walls. Designers chose a removable adhesive. Because future exhibitions would differ, the layout had to be reconfigurable. Workers could reassemble the panels in new arrangements. Clear instructions prevented misunderstanding during installation. The system made later changes less costly.", "zh": "博物館需要能移除又不傷牆的標籤，因此選可移除黏著劑。未來展覽不同，配置須能重新組合。工人可把面板重組成新排列。清楚說明避免安裝誤解，也降低之後修改成本。"}]}, {"word": "counterexample", "meanings": ["反例"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P034", "title": "線上學習的反例", "blank": 1, "level": 3, "type": "段落功能", "evidence": "This case serves as a counterexample, showing that the claim needs qualification.", "why": "網路不穩會推翻 everyone 的絕對主張，故 counterexample 而非 confirmation。", "en": "The opening paragraph claims that online lessons save everyone time. The next describes a student with an unreliable connection. This case serves as a counterexample, showing that the claim needs qualification. It does not prove that all online learning is a failure.", "zh": "首段主張線上課程節省每個人的時間。下一段描述一位網路不穩的學生。這個案例是反例，顯示主張需要加上限制；它並未證明所有線上學習都失敗。"}]}, {"word": "counterpart", "meanings": ["對應物"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P112", "title": "新設的修鞋攤", "blank": 2, "level": 3, "type": "新舊資訊", "evidence": "To introduce the service, she displayed a damaged boot beside its repaired counterpart.", "why": "its repaired counterpart 指與壞靴對應的修好版本。", "en": "A cobbler opened a stall near the station. The business was unfamiliar to many younger residents. To introduce the service, she displayed a damaged boot beside its repaired counterpart. This comparison showed what customers could expect. Once people understood the process, their initial uncertainty faded. The stall gradually developed a regular clientele.", "zh": "一位修鞋師在車站旁設攤。許多年輕居民不熟悉這門生意。她把一隻壞靴和修好的對應靴並列以介紹服務。比較讓顧客看見預期成果。理解流程後，起初的不確定逐漸消退，攤位也建立固定客群。"}]}, {"word": "creative", "meanings": ["有創意的"], "pos": ["Adj"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P003", "title": "社區音樂夜", "blank": 1, "level": 3, "type": "詞形", "evidence": "Their creative arrangements surprised the audience.", "why": "arrangements 前需要形容其特質的 creative；creativity 是抽象名詞。", "en": "The town invited young musicians to perform. Their creative arrangements surprised the audience. Even beginners played confidently after weeks of practice. The evening showed how regular rehearsal can improve musical ability.", "zh": "小鎮邀請年輕樂手演出。他們有創意的編曲讓觀眾驚喜；連初學者在練習數週後也演奏得有自信。這晚顯示定期排練能提升音樂能力。"}]}, {"word": "criteria", "meanings": ["標準"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P032", "title": "自行車道比較", "blank": 2, "level": 4, "type": "文章組織", "evidence": "It evaluates the two designs against the same safety criteria before offering a recommendation.", "why": "same safety criteria 是共同比較標準。", "en": "The first section describes the old road layout. The second introduces a protected bicycle lane. Rather than telling one continuous story, the article uses comparison. It evaluates the two designs against the same safety criteria before offering a recommendation.", "zh": "第一節描述舊道路配置，第二節介紹受保護的自行車道。文章不是講述一條連續故事，而是使用比較。它依相同安全標準評估兩種設計，再提出建議。"}]}, {"word": "critical", "meanings": ["批判的"], "pos": ["Adj"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P038", "title": "公園改建評論", "blank": 1, "level": 4, "type": "作者態度", "evidence": "Her attitude toward the current proposal is critical.", "why": "questions 與 demands an alternative 表 critical；不能把引述的 improvement 當作者 enthusiastic。", "en": "Developers call the plan a great improvement. The writer, however, questions why mature trees must be removed and demands a less damaging alternative. Her attitude toward the current proposal is critical. The quoted praise belongs to the developers, not to the writer, who remains unconvinced.", "zh": "開發者稱計畫為重大改善。然而作者質疑為何必須移除成熟樹木，並要求損害更小的替代方案。她對現有提案持批判態度。引述的稱讚屬於開發者，不是仍未被說服的作者。"}]}, {"word": "crop", "meanings": ["作物"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P047", "title": "沙漠裡的甜點", "blank": 3, "level": 2, "type": "字形相似", "evidence": "The host explained that these fruits were an important local crop.", "why": "dates 是可種植的 crop；corpse 拼字局部相近但意思完全不合。", "en": "After crossing the desert, the travelers reached a small inn. Dinner ended with a sweet dessert made from dates. The host explained that these fruits were an important local crop.", "zh": "旅人穿越沙漠後抵達小旅館。晚餐以椰棗做的甜點收尾。主人解釋這些水果是當地重要作物。"}]}, {"word": "crossed", "meanings": ["越過"], "pos": ["V-en"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P111", "title": "候鳥追蹤器", "blank": 2, "level": 3, "type": "時間線", "evidence": "By the time they reached the wetlands, they had crossed two mountain ranges.", "why": "By the time…had crossed 表到達濕地前已越山。", "en": "In March, scientists attached trackers to several birds. Three weeks later, the birds began their northward journey. By the time they reached the wetlands, they had crossed two mountain ranges. Researchers compared the new route with data collected the previous year. Only after the birds returned did the team recover the devices. The full analysis was therefore postponed until autumn.", "zh": "三月，科學家替幾隻鳥裝追蹤器。三週後，鳥開始北遷。到濕地時，牠們已越過兩條山脈。研究者拿新路線與前一年資料比較。直到鳥返回後，團隊才收回裝置，因此完整分析延到秋天。"}]}, {"word": "damaged", "meanings": ["受損的"], "pos": ["V-en"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P095", "title": "被風打倒的樹", "blank": 1, "level": 2, "type": "句法判斷", "evidence": "The tree damaged by the storm stood beside a busy path.", "why": "tree 是被暴風雨損害，用 damaged 被動分詞；damaging 會指樹主動造成傷害。", "en": "The tree damaged by the storm stood beside a busy path. Workers removed branches that might fall on visitors. After the area was cleared, the park reopened to the public.", "zh": "受暴風雨損傷的樹立在繁忙步道旁。工人移除可能掉落砸到遊客的枝條。區域清理後，公園重新開放。"}]}, {"word": "decided", "meanings": ["決定"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P063", "title": "山路警告", "blank": 3, "level": 3, "type": "句型判斷", "evidence": "Rather than continuing, they decided to wait at a shelter.", "why": "decided to wait 接不定詞；避免或建議要用不同補語形式。", "en": "The ranger warned hikers not to leave the marked path. Thick fog prevented them from seeing the cliff edge. Rather than continuing, they decided to wait at a shelter.", "zh": "巡山員警告健行者不要離開標示路徑。濃霧使他們看不見懸崖邊緣。他們決定在避難處等候，不再前進。"}]}, {"word": "declined", "meanings": ["減少"], "pos": ["V"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P073", "title": "排隊縮短了", "blank": 2, "level": 2, "type": "上下文方向", "evidence": "Average queues became shorter, and complaints declined.", "why": "抱怨隨等待減少而 declined；increased 需額外轉折證據。", "en": "The clinic introduced appointments to reduce waiting. Average queues became shorter, and complaints declined. The staff viewed these changes as an improvement, although busy days remained difficult.", "zh": "診所導入預約以減少等待。平均隊伍變短，抱怨減少。工作人員將變化視為改善，儘管忙碌日子仍有困難。"}]}, {"word": "decode", "meanings": ["解碼"], "pos": ["V"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P089", "title": "看不見的墨水", "blank": 2, "level": 2, "type": "構詞判斷", "evidence": "Students could then decode the message by replacing each symbol with a letter.", "why": "把符號還原成字母是 decode，encode 方向相反。", "en": "The ink was initially invisible on the white paper. Gentle heat made the writing appear. Students could then decode the message by replacing each symbol with a letter. The activity showed that something unseen may still be present.", "zh": "墨水起初在白紙上看不見，輕微加熱後字跡出現。學生再把符號替換成字母以解碼。活動顯示看不見的事物仍可能存在。"}]}, {"word": "delayed", "meanings": ["延遲的"], "pos": ["V-en"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P078", "title": "缺貨的原因", "blank": 1, "level": 4, "type": "上下文邏輯", "evidence": "A delivery had also been delayed.", "why": "另一可解釋缺貨的因素是送貨 delayed；accelerated 通常增加供應，方向相反。", "en": "The shop sold out after a festival, but the manager did not immediately blame rising demand. A delivery had also been delayed. Because both factors could explain the shortage, she checked order records before reaching a conclusion.", "zh": "店家節慶後售罄，但店長未立刻歸因於需求上升。另有一批送貨延遲。因兩因素都能解釋短缺，她先查訂貨紀錄再下結論。"}]}, {"word": "demand", "meanings": ["需求"], "pos": ["N"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P130", "title": "雨量與報名率", "blank": 1, "level": 4, "type": "上下文邏輯", "evidence": "The organizer suspected that bad weather had increased demand.", "why": "more joined 對應 demand 增加。", "en": "More people joined the indoor class during a rainy week. The organizer suspected that bad weather had increased demand. Yet a discounted fee had been introduced at the same time. Because these changes coincided, their effects were difficult to separate. She compared later weeks with different prices and weather conditions. This approach helped test competing explanations. It avoided treating the first observed link as a proven cause.", "zh": "雨週有更多人報名室內課。主辦者懷疑壞天氣增加需求，但同期也開始折扣。兩改變同時發生，效果難分。她比較後續價格、天氣條件不同的週次，檢驗競爭解釋，避免把初見關聯當已證明原因。"}]}, {"word": "depend", "meanings": ["依賴"], "pos": ["V"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P058", "title": "雨水的依賴", "blank": 1, "level": 1, "type": "介系詞搭配", "evidence": "The village used to depend on a single well.", "why": "used to 後需要原形 depend，depend on 表依賴；reliance 是名詞。", "en": "The village used to depend on a single well. After several dry seasons, residents became aware of the risks. They now contribute to a fund for a second water source.", "zh": "村莊過去仰賴一口井。經過幾次乾季，居民意識到風險。他們現在捐款給開發第二水源的基金。"}]}, {"word": "depends", "meanings": ["取決於"], "pos": ["V"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P076", "title": "雨天備案", "blank": 2, "level": 2, "type": "上下文邏輯", "evidence": "This backup plan depends on the gym being available, so the team must confirm the booking first.", "why": "備案成立條件是場館 available，depends on。", "en": "The fair can take place outdoors only if the ground is dry. If rain continues, the organizers will relocate it to the gym. This backup plan depends on the gym being available, so the team must confirm the booking first.", "zh": "園遊會只有地面乾燥時才能在戶外辦。若持續下雨，主辦方會把活動移至體育館。備案取決於場館可用，因此團隊必須先確認預訂。"}]}, {"word": "description", "meanings": ["描述"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P120", "title": "展覽的文具清單", "blank": 3, "level": 2, "type": "字形相似", "evidence": "Each student gave the organizer a description of a planned display.", "why": "planned display 的內容說明為 description；prescription 是處方。", "en": "Before the art fair, the class bought pens and other stationery. The supply cart remained stationary while students unloaded it. Each student gave the organizer a description of a planned display. The organizer checked that the labels would complement the artwork rather than distract from it. She later offered a compliment on the team's careful preparation.", "zh": "美術展前，班上買筆與其他文具。學生卸貨時，推車保持不動。每人向主辦者描述預計展出內容。主辦者確認標籤能補充作品而非搶焦點，後來也稱讚團隊準備細心。"}]}, {"word": "desert", "meanings": ["沙漠"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P047", "title": "沙漠裡的甜點", "blank": 1, "level": 2, "type": "字形相似", "evidence": "After crossing the desert, the travelers reached a small inn.", "why": "crossing the desert 是穿越地形；dessert 是吃的甜點。", "en": "After crossing the desert, the travelers reached a small inn. Dinner ended with a sweet dessert made from dates. The host explained that these fruits were an important local crop.", "zh": "旅人穿越沙漠後抵達小旅館。晚餐以椰棗做的甜點收尾。主人解釋這些水果是當地重要作物。"}]}, {"word": "dessert", "meanings": ["甜點"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P047", "title": "沙漠裡的甜點", "blank": 2, "level": 2, "type": "字形相似", "evidence": "Dinner ended with a sweet dessert made from dates.", "why": "sweet 且晚餐收尾，故 dessert，注意雙 s。", "en": "After crossing the desert, the travelers reached a small inn. Dinner ended with a sweet dessert made from dates. The host explained that these fruits were an important local crop.", "zh": "旅人穿越沙漠後抵達小旅館。晚餐以椰棗做的甜點收尾。主人解釋這些水果是當地重要作物。"}]}, {"word": "destinations", "meanings": ["目的地"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P029", "title": "慢速旅行", "blank": 2, "level": 4, "type": "全文主題", "evidence": "For her, travel is less about collecting destinations than about gaining local understanding.", "why": "collecting destinations 概括趕景點式旅行，與理解地方對比。", "en": "The writer walks through small towns instead of rushing between landmarks. She talks with shopkeepers and returns to the same café. Her journey emphasizes connection over speed. For her, travel is less about collecting destinations than about gaining local understanding.", "zh": "作者步行穿過小鎮，不急著趕景點。她與店主聊天，重訪同一家咖啡館。旅程重視連結勝過速度。對她來說，旅行較不在於蒐集目的地，而在於深入理解地方。"}]}, {"word": "detailed", "meanings": ["詳細的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P133", "title": "一句話裡的保留", "blank": 1, "level": 4, "type": "語氣／含意", "evidence": "After reading a long proposal, the manager said, \"It is certainly detailed.\" She then asked whether the main idea could be expressed more briefly.", "why": "long proposal 與後面希望更短，detailed 為表面稱述，不能直接當全盤讚揚。", "en": "After reading a long proposal, the manager said, \"It is certainly detailed.\" She then asked whether the main idea could be expressed more briefly. Her first remark was not necessarily straightforward praise. In context, it hinted that the proposal might be too lengthy. The request for a shorter version made the implication clearer. A reader should therefore consider the whole exchange before deciding on the speaker's attitude.", "zh": "經理看完長提案說：「確實很詳細。」隨後問主旨能否更簡短表達。首句未必是單純稱讚，語境暗示提案可能過長。要求縮短使暗示更清楚。因此須讀完整互動才能判斷態度。"}]}, {"word": "developers", "meanings": ["開發者"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P038", "title": "公園改建評論", "blank": 2, "level": 4, "type": "作者態度", "evidence": "The quoted praise belongs to the developers, not to the writer, who remains unconvinced.", "why": "開頭明確由 Developers call 提供 praise 的發話者。", "en": "Developers call the plan a great improvement. The writer, however, questions why mature trees must be removed and demands a less damaging alternative. Her attitude toward the current proposal is critical. The quoted praise belongs to the developers, not to the writer, who remains unconvinced.", "zh": "開發者稱計畫為重大改善。然而作者質疑為何必須移除成熟樹木，並要求損害更小的替代方案。她對現有提案持批判態度。引述的稱讚屬於開發者，不是仍未被說服的作者。"}]}, {"word": "difference", "meanings": ["差異"], "pos": ["N"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P102", "title": "城市夜色中的昆蟲", "blank": 3, "level": 5, "type": "推論", "evidence": "This difference was interesting, but its cause was not immediately clear.", "why": "more…than others 是 difference 的指涉。", "en": "When a city replaced its streetlights, residents welcomed the brighter roads. A biology teacher asked a different question: how would the change affect insects? Her students placed observation sheets near several lamps and counted visits at fixed times. To keep the comparison fair, they used the same procedure at every location. They found more insects around some lamps than others. This difference was interesting, but its cause was not immediately clear. The locations also varied in temperature and nearby vegetation. The teacher therefore reminded the class that a pattern was not automatically an explanation. During a second trial, the students compared two lamp types in the same area. Their new records provided stronger evidence about the role of light. Even so, the findings applied only to the conditions they had tested. The class resisted the temptation to claim that one lamp was best everywhere. In their report, they described both the results and the limitations. The city agreed to consider a smaller trial rather than replace every light at once. For the students, the most valuable lesson was not a simple answer but a more careful way of asking questions. Scientific inquiry, they learned, depends on adjusting claims to match what observations actually support.", "zh": "城市更換路燈時，居民歡迎更明亮道路。生物老師問：改變如何影響昆蟲？學生在幾座燈旁設觀察表，固定時間計數到訪。為公平比較，各處程序一致。他們發現某些燈邊昆蟲更多，差異有趣，原因卻未明：各地溫度、植被也不同。老師提醒模式不自動等於解釋。第二次試驗在同區比較兩款燈，新紀錄提供更強證據。不過發現只適用受測條件。學生避免宣稱某款燈處處最佳，報告同時說明結果與限制。市府同意先做較小試辦，不一次換掉所有燈。學生最有價值的收穫不是簡單答案，而是更審慎提問。科學探究需調整主張，使之符合觀察實際能支持的範圍。"}]}, {"word": "different", "meanings": ["不同的"], "pos": ["Adj"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P098", "title": "猜對不等於理解", "blank": 2, "level": 4, "type": "尚待確認", "evidence": "Their scores matched, but their reasoning was different.", "why": "but 對比分數相同與推理 different；identical 不合。", "en": "Two students selected the correct word. One identified a clear clue; the other admitted it was a guess. Their scores matched, but their reasoning was different. The teacher therefore avoided making the same judgment about both learners.", "zh": "兩名學生選對單字，一人找出清楚線索，另一人承認是猜的。分數相同，推理卻不同。因此老師避免對兩人的理解做相同判斷。"}]}, {"word": "dimmer", "meanings": ["調光器"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P107", "title": "為夜讀設計的燈", "blank": 3, "level": 3, "type": "局部精確語意", "evidence": "She chose a model with a dimmer, which let her lower the brightness.", "why": "which let her lower brightness 定義 dimmer 的功能。", "en": "Rui needed a lamp for a tiny shared room. Its arm had to be adjustable so she could direct light away from her roommate. A stable base would keep it from tipping over. She chose a model with a dimmer, which let her lower the brightness. It also used very little electricity, making it efficient. A portable design meant she could carry it to the study room.", "zh": "瑞需要適合狹小合住房間的燈。燈臂須可調整，才能讓光避開室友；穩固底座能避免傾倒。她選了有調光器的款式，可降低亮度。它耗電少，效率高；可攜式設計也讓她能帶到自習室。"}]}, {"word": "discharge", "meanings": ["排放"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P012", "title": "河流巡守", "blank": 2, "level": 4, "type": "指涉連貫", "evidence": "The owner agreed to stop the discharge.", "why": "the owner 的決定是停止工坊排放 discharge，與上句廢水相接。", "en": "The volunteers mapped two streams before testing them for pollution. One was clean; the other contained waste from a workshop. The owner agreed to stop the discharge. This decision allowed fish to return to the polluted stream.", "zh": "志工先畫出兩條溪流的位置，再檢測它們的污染。一條乾淨，另一條有工坊排出的廢水。業主同意停止排放。這項決定讓魚回到受污染的溪流。"}]}, {"word": "disposable", "meanings": ["用完即丟的"], "pos": ["Adj"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P088", "title": "重新使用包裝", "blank": 2, "level": 1, "type": "構詞判斷", "evidence": "This reduced the need for disposable packaging.", "why": "disposable 指用後丟棄，為可重用盒所取代。", "en": "The shop chose reusable boxes that customers could return and use again. This reduced the need for disposable packaging. The change was not cost-free, but it made unnecessary waste more avoidable.", "zh": "商店選用顧客可歸還再用的盒子，減少一次性包裝需求。改變並非零成本，卻讓不必要的浪費更能避免。"}]}, {"word": "distinguish", "meanings": ["區分"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P126", "title": "報名人數的變化", "blank": 2, "level": 3, "type": "近義詞混淆", "evidence": "The organizers needed to distinguish attendance from paid participation.", "why": "distinguish A from B 表辨明兩種衡量對象。", "en": "The festival attracted a large number of visitors, but ticket sales were lower than expected. Many people came only to the free outdoor events. The organizers needed to distinguish attendance from paid participation. They could estimate total crowds from photographs, but sales records gave an exact count of tickets. This distinction made their evaluation more precise. A popular event was not necessarily a profitable one.", "zh": "節慶吸引很多人，票房卻比預期低。許多人只參加免費戶外活動。主辦方需區分到場和付費參與。照片可估計總人數，售票紀錄則有精確票數。區分使評估更精準；活動熱門不一定獲利。"}]}, {"word": "disturb", "meanings": ["打擾"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P093", "title": "保留生物的距離", "blank": 2, "level": 4, "type": "語意判斷", "evidence": "Approaching them could disturb their rest.", "why": "靠近的風險是 disturb rest，非 comfort。", "en": "Visitors were told to observe the seals from a distance. Approaching them could disturb their rest. Keeping space allowed people to enjoy the animals without causing unnecessary stress.", "zh": "遊客被告知應遠距觀察海豹。靠近可能打擾牠們休息。保持距離能讓人欣賞動物，同時不造成不必要壓力。"}]}, {"word": "draw", "meanings": ["推導／畫"], "pos": ["V"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P057", "title": "研究討論會", "blank": 1, "level": 3, "type": "搭配判斷", "evidence": "The team gathered to draw conclusions from the data.", "why": "draw conclusions from data 為歸納結論，paint 不具有此搭配義。", "en": "The team gathered to draw conclusions from the data. Members were careful not to jump to conclusions after seeing one unusual result. They agreed to conduct another experiment before publishing their report.", "zh": "團隊聚集，從資料歸納結論。成員謹慎避免只看到一個異常結果就遽下定論，同意發表報告前再做一次實驗。"}]}, {"word": "drew", "meanings": ["擬定／畫〔過去式〕"], "pos": ["V"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P123", "title": "準備社區演出", "blank": 1, "level": 3, "type": "搭配判斷", "evidence": "To organize the concert, the students first drew up a schedule.", "why": "draw up a schedule 是擬定時程；paint up 無此搭配。", "en": "To organize the concert, the students first drew up a schedule. They agreed to share responsibility for equipment checks. Before rehearsal, they would run a sound test. Everyone was asked to keep track of borrowed items. These habits helped the group meet its deadline without a last-minute rush.", "zh": "學生為籌辦音樂會，先擬定時程，並同意分擔設備檢查責任。彩排前進行音效測試。大家要追蹤借來的物品。這些習慣幫團隊按期完成，不必最後一刻趕工。"}]}, {"word": "dropped", "meanings": ["下降了"], "pos": ["V"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P129", "title": "漏水修好以後", "blank": 1, "level": 3, "type": "上下文方向", "evidence": "After repairs, daily consumption dropped.", "why": "修漏後消耗 dropped，前提住戶數未增加。", "en": "A hidden pipe had been wasting water for months. After repairs, daily consumption dropped. The monthly bill became lower, even though the number of residents stayed the same. This change reduced pressure on the building's budget. The manager viewed the result as positive. Still, she continued checking the meter so that another leak would not go unnoticed.", "zh": "暗管漏水數月。修好後日用水量下降，即使住戶數相同，月費也降低。改變減輕大樓預算壓力，管理者視為正面成果。她仍查水表，避免另一次漏水未被察覺。"}]}, {"word": "earlier", "meanings": ["更早"], "pos": ["Adv"], "tags": ["Logic", "Semantics", "Grammar", "Collocation", "Cohesion", "Global", "POS"], "examples": [{"pid": "P104", "title": "校園新聞的查證", "blank": 3, "level": 5, "type": "作用範圍", "evidence": "It had been taken during repairs two years earlier.", "why": "had been taken two years earlier 為過去事件前兩年。", "en": "An image of a locked gate spread through the school chat group. Its caption claimed that the library would close permanently. Many students forwarded it before checking the date. The student newspaper decided to verify the message. First, reporters located the original image. It had been taken during repairs two years earlier. Next, they contacted the librarian, who explained that the current closure would last only one afternoon. The image itself was real, but its new context made it misleading. The team published a correction and included links to the relevant notices. They avoided accusing individual students of deliberate dishonesty because careless sharing did not prove intent. Instead, the article described a simple checking procedure: locate the source, inspect the date, and compare the claim with current information. A follow-up survey found that some readers had changed their sharing habits. The editors welcomed this response but did not call it universal. Only a fraction of students had answered. The final article therefore balanced a positive outcome with a clear statement of its limits. Responsible reporting, it argued, requires the same standards when describing one's own success as when investigating someone else's story. Accuracy is a continuing practice, not a badge earned once.", "zh": "一張上鎖校門照片在校群傳播，圖說宣稱圖書館永久關閉。許多人未查日期便轉傳。校刊決定查證，先找原圖，發現拍於兩年前修繕期間；再聯絡館員，得知本次只關一下午。照片真實，新脈絡卻使它誤導。團隊刊更正並附公告連結，避免指控個別學生蓄意不誠實，因為粗心分享不等於證明意圖。文章介紹查核程序：找來源、查日期、與當前資訊比對。後續調查發現部分讀者改變分享習慣。編輯肯定成果，卻不稱人人都如此，因只有小部分學生作答。文章因此平衡正面成果與清楚限制，主張描述自身成功和調查他人故事應用相同標準。準確是持續實踐，而非一次取得的徽章。"}]}, {"word": "effect", "meanings": ["影響／效果"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P127", "title": "訪客的通知單", "blank": 3, "level": 3, "type": "易混淆字詞", "evidence": "Its purpose was to reduce the effect of delays on the tour.", "why": "the effect of 是名詞片語；affect 不能當這裡的影響名詞。", "en": "Visitors were advised to arrive before nine. The notice explained that late arrival could affect the entire group's schedule. Its purpose was to reduce the effect of delays on the tour. The guide would accept reasonable requests for assistance. Everyone was welcome except those without a reservation, because places were limited.", "zh": "訪客被建議九點前到達。通知說明遲到可能影響整團時程，目的是減少延誤對行程的影響。導遊會接受合理協助請求。除了未預約者外都歡迎，因名額有限。"}]}, {"word": "efficient", "meanings": ["高效率的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P107", "title": "為夜讀設計的燈", "blank": 4, "level": 3, "type": "局部精確語意", "evidence": "It also used very little electricity, making it efficient.", "why": "very little electricity 支持能源 efficient，不是單指容易移動。", "en": "Rui needed a lamp for a tiny shared room. Its arm had to be adjustable so she could direct light away from her roommate. A stable base would keep it from tipping over. She chose a model with a dimmer, which let her lower the brightness. It also used very little electricity, making it efficient. A portable design meant she could carry it to the study room.", "zh": "瑞需要適合狹小合住房間的燈。燈臂須可調整，才能讓光避開室友；穩固底座能避免傾倒。她選了有調光器的款式，可降低亮度。它耗電少，效率高；可攜式設計也讓她能帶到自習室。"}]}, {"word": "emerged", "meanings": ["出現"], "pos": ["V-en"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P019", "title": "種子的等待", "blank": 2, "level": 2, "type": "時間線", "evidence": "By Friday, the first leaves had emerged.", "why": "first leaves 配生長時間線，為 emerged；vanished 指消失。", "en": "The children planted beans on Monday. Two days later, tiny roots appeared. By Friday, the first leaves had emerged. The students recorded each stage so that next year's class could follow the same sequence.", "zh": "孩子們週一種下豆子。兩天後長出細根。到了週五，第一批葉子已冒出。學生記錄每個階段，讓明年的班級能追蹤同樣的順序。"}]}, {"word": "enables", "meanings": ["使能夠"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P004", "title": "圖書館導師", "blank": 1, "level": 2, "type": "文法骨架", "evidence": "The reading program, which began last spring, enables children to borrow books without paying a fee.", "why": "主句 The reading program 缺限定動詞；enables 接 children to borrow，enabling 不能獨立作述語。", "en": "The reading program, which began last spring, enables children to borrow books without paying a fee. Each volunteer guides a small group. The stories selected by the librarian remain available online after the meetings.", "zh": "去年春天開始的閱讀計畫讓孩子免費借書。每位志工帶領一個小組。館員挑選的故事在聚會後仍可在線上閱讀。"}]}, {"word": "encouraged", "meanings": ["鼓勵"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P062", "title": "練習演說", "blank": 1, "level": 2, "type": "句型判斷", "evidence": "The coach encouraged Lian to speak more slowly.", "why": "encouraged 人 to speak 合法；made 人 speak 不加 to。", "en": "The coach encouraged Lian to speak more slowly. She suggested practicing in front of a mirror and reminded him that pauses could help listeners follow the message.", "zh": "教練鼓勵連放慢說話速度，建議對鏡練習，並提醒他停頓能幫聽眾跟上內容。"}]}, {"word": "encouraging", "meanings": ["令人鼓舞的"], "pos": ["Adj"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P101", "title": "工具圖書館的考驗", "blank": 8, "level": 5, "type": "文章組織", "evidence": "That popularity was encouraging, although it did not by itself prove that the project saved resources overall.", "why": "受歡迎是 encouraging，但不等於證明省資源。", "en": "A neighborhood library began lending tools as well as books. The idea seemed practical: most people needed a drill only a few times a year. Sharing could reduce both household spending and unnecessary purchases. At first, however, the staff focused mainly on collecting equipment. They soon discovered that ownership was only one part of the problem. Borrowers needed clear instructions, and returned tools required inspection. One damaged cable could make the next loan unsafe. To address these concerns, the library trained volunteers and introduced a checklist. Each item was checked before it went back onto the shelf. The system also recorded late returns, but the director warned against treating every delay as carelessness. Illness or transport problems could be involved. Instead of imposing the same response in every case, staff considered the circumstances. Six months later, the service had many regular users. That popularity was encouraging, although it did not by itself prove that the project saved resources overall. The library still needed to compare the costs of repair and transport with the purchases it had replaced. Its experience showed that a generous idea becomes sustainable through careful management.", "zh": "社區圖書館除了書也開始借工具。想法看來實用：多數人一年只用幾次電鑽。共享能減少家庭支出與不必要購買。但員工起初主要忙著收集設備，很快發現有工具只是問題的一部分。借用者需要清楚說明，歸還工具需要檢查；一條損壞電線就可能讓下一次借用不安全。圖書館為處理疑慮培訓志工並設清單。每件物品回架前都先檢查。系統也記錄晚還，但館長提醒不能把每次延誤都當粗心，可能涉及疾病或交通問題。員工考量個別情況，而非一律回應。半年後，服務已有許多固定使用者，令人鼓舞，但受歡迎本身並不能證明整體省資源。仍需比較維修、運輸成本和取代的購買。經驗顯示，慷慨構想需靠細心管理才能持續。"}]}, {"word": "engaged", "meanings": ["投入的"], "pos": ["Adj/V-en"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P096", "title": "雖然下雨", "blank": 3, "level": 3, "type": "句法判斷", "evidence": "The instructor kept everyone engaged by giving each person a task.", "why": "keep everyone engaged 為受詞補語，表示使每個人維持投入狀態。", "en": "Although the rain was heavy, the indoor workshop continued. The participants, whose outdoor plans had changed, learned to weave baskets. The instructor kept everyone engaged by giving each person a task.", "zh": "雖然雨很大，室內工作坊仍繼續。戶外計畫改變的參與者學編籃。講師分派任務給每個人，讓大家持續投入。"}]}, {"word": "enthusiastic", "meanings": ["熱烈的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P085", "title": "客氣的保留", "blank": 2, "level": 2, "type": "語氣／含意", "evidence": "It should not automatically be read as an enthusiastic endorsement of the whole film.", "why": "not automatically…endorsement 警惕把局部稱讚當 enthusiastic 支持。", "en": "Asked whether he liked the film, Jun said, \"The scenery was lovely.\" He said nothing about the acting or story. His selective praise may imply a reservation. It should not automatically be read as an enthusiastic endorsement of the whole film.", "zh": "被問是否喜歡電影時，俊說：「景色很漂亮。」他沒提演技或故事。選擇性稱讚可能暗示保留，不應自動解作對整部電影的熱烈肯定。"}]}, {"word": "entire", "meanings": ["整個的"], "pos": ["Adj"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P025", "title": "問卷的邊界", "blank": 3, "level": 2, "type": "作用範圍", "evidence": "The results may be useful for planning a small trial, but they cannot justify a claim about the entire school.", "why": "cannot justify 限定無法代表 entire school；注意否定的是全校推論。", "en": "Only twenty students answered the survey. Their replies describe some students' preferences, not everyone's. The results may be useful for planning a small trial, but they cannot justify a claim about the entire school.", "zh": "只有二十位學生填問卷。回覆描述的是部分學生的偏好，不是每個人。結果可能對規劃小型試辦有用，但不能用來宣稱全校都如此。"}]}, {"word": "equipment", "meanings": ["設備"], "pos": ["N"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P101", "title": "工具圖書館的考驗", "blank": 2, "level": 5, "type": "文章組織", "evidence": "At first, however, the staff focused mainly on collecting equipment.", "why": "collecting equipment 指先備工具，下一句反思只擁有不夠。", "en": "A neighborhood library began lending tools as well as books. The idea seemed practical: most people needed a drill only a few times a year. Sharing could reduce both household spending and unnecessary purchases. At first, however, the staff focused mainly on collecting equipment. They soon discovered that ownership was only one part of the problem. Borrowers needed clear instructions, and returned tools required inspection. One damaged cable could make the next loan unsafe. To address these concerns, the library trained volunteers and introduced a checklist. Each item was checked before it went back onto the shelf. The system also recorded late returns, but the director warned against treating every delay as carelessness. Illness or transport problems could be involved. Instead of imposing the same response in every case, staff considered the circumstances. Six months later, the service had many regular users. That popularity was encouraging, although it did not by itself prove that the project saved resources overall. The library still needed to compare the costs of repair and transport with the purchases it had replaced. Its experience showed that a generous idea becomes sustainable through careful management.", "zh": "社區圖書館除了書也開始借工具。想法看來實用：多數人一年只用幾次電鑽。共享能減少家庭支出與不必要購買。但員工起初主要忙著收集設備，很快發現有工具只是問題的一部分。借用者需要清楚說明，歸還工具需要檢查；一條損壞電線就可能讓下一次借用不安全。圖書館為處理疑慮培訓志工並設清單。每件物品回架前都先檢查。系統也記錄晚還，但館長提醒不能把每次延誤都當粗心，可能涉及疾病或交通問題。員工考量個別情況，而非一律回應。半年後，服務已有許多固定使用者，令人鼓舞，但受歡迎本身並不能證明整體省資源。仍需比較維修、運輸成本和取代的購買。經驗顯示，慷慨構想需靠細心管理才能持續。"}]}, {"word": "erosion", "meanings": ["侵蝕"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P018", "title": "修補步道", "blank": 1, "level": 4, "type": "句間銜接", "evidence": "This erosion exposed the roots of nearby trees.", "why": "This erosion 將沖走土壤概括為侵蝕；irrigation 是供水灌溉。", "en": "Heavy rain washed soil off the hillside. This erosion exposed the roots of nearby trees. To limit further damage, workers added small barriers. These structures slowed runoff and helped soil settle behind them.", "zh": "大雨沖走山坡土壤。這種侵蝕使附近樹根外露。工人加設小障礙物以限制更多損害。這些結構減慢逕流，讓土壤在後方沉積。"}]}, {"word": "estimate", "meanings": ["估計"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P126", "title": "報名人數的變化", "blank": 3, "level": 3, "type": "近義詞混淆", "evidence": "They could estimate total crowds from photographs, but sales records gave an exact count of tickets.", "why": "照片給估計 estimate，與後句 exact records 對比。", "en": "The festival attracted a large number of visitors, but ticket sales were lower than expected. Many people came only to the free outdoor events. The organizers needed to distinguish attendance from paid participation. They could estimate total crowds from photographs, but sales records gave an exact count of tickets. This distinction made their evaluation more precise. A popular event was not necessarily a profitable one.", "zh": "節慶吸引很多人，票房卻比預期低。許多人只參加免費戶外活動。主辦方需區分到場和付費參與。照片可估計總人數，售票紀錄則有精確票數。區分使評估更精準；活動熱門不一定獲利。"}]}, {"word": "every", "meanings": ["每個"], "pos": ["Det"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P026", "title": "有條件的免費", "blank": 2, "level": 3, "type": "作用範圍", "evidence": "It also excludes special exhibitions, so not every gallery is free.", "why": "not every 表不是每個；其否定範圍不等於所有展廳都收費。", "en": "The museum offers free entry to children under twelve. This limited offer does not apply to adults. It also excludes special exhibitions, so not every gallery is free. Families should check the conditions before booking.", "zh": "博物館讓十二歲以下兒童免費入場。這項有限優惠不適用成人，也排除特展，因此不是每個展廳都免費。家庭應在訂票前查看條件。"}]}, {"word": "everyone", "meanings": ["每個人"], "pos": ["Pron"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P027", "title": "藥草試驗的措辭", "blank": 2, "level": 4, "type": "作用範圍", "evidence": "Nor does some mean everyone.", "why": "some 的範圍小於 everyone；Nor does…mean 否定等同關係。", "en": "The report says the tea may help some people sleep. The word may expresses possibility, not certainty. Nor does some mean everyone. Readers should avoid turning a cautious statement into an absolute promise.", "zh": "報告說這種茶可能幫助部分人睡眠。may 表可能而非確定；some 也不表示每個人。讀者應避免把審慎陳述變成絕對承諾。"}, {"pid": "P113", "title": "閱讀調查的限定詞", "blank": 2, "level": 4, "type": "作用範圍", "evidence": "They cannot represent everyone.", "why": "cannot represent everyone 指抽樣邊界。", "en": "The survey reached only students who used the school library. Its findings therefore describe a subset of the school population. They cannot represent everyone. Some respondents preferred paper books, but that does not mean they never read on screens. The report carefully separated a general preference from an absolute rule. Its conclusion remained limited to the group actually surveyed.", "zh": "調查只接觸使用圖書館的學生，因此發現描述的是全校群體中的子群，不能代表所有人。部分受訪者偏好紙本，卻不表示從不看螢幕。報告區分一般偏好和絕對規則，結論限於實際受訪群體。"}]}, {"word": "everywhere", "meanings": ["各處"], "pos": ["Adv"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P102", "title": "城市夜色中的昆蟲", "blank": 7, "level": 5, "type": "推論", "evidence": "The class resisted the temptation to claim that one lamp was best everywhere.", "why": "resisted claim best everywhere，避免無限擴大適用範圍。", "en": "When a city replaced its streetlights, residents welcomed the brighter roads. A biology teacher asked a different question: how would the change affect insects? Her students placed observation sheets near several lamps and counted visits at fixed times. To keep the comparison fair, they used the same procedure at every location. They found more insects around some lamps than others. This difference was interesting, but its cause was not immediately clear. The locations also varied in temperature and nearby vegetation. The teacher therefore reminded the class that a pattern was not automatically an explanation. During a second trial, the students compared two lamp types in the same area. Their new records provided stronger evidence about the role of light. Even so, the findings applied only to the conditions they had tested. The class resisted the temptation to claim that one lamp was best everywhere. In their report, they described both the results and the limitations. The city agreed to consider a smaller trial rather than replace every light at once. For the students, the most valuable lesson was not a simple answer but a more careful way of asking questions. Scientific inquiry, they learned, depends on adjusting claims to match what observations actually support.", "zh": "城市更換路燈時，居民歡迎更明亮道路。生物老師問：改變如何影響昆蟲？學生在幾座燈旁設觀察表，固定時間計數到訪。為公平比較，各處程序一致。他們發現某些燈邊昆蟲更多，差異有趣，原因卻未明：各地溫度、植被也不同。老師提醒模式不自動等於解釋。第二次試驗在同區比較兩款燈，新紀錄提供更強證據。不過發現只適用受測條件。學生避免宣稱某款燈處處最佳，報告同時說明結果與限制。市府同意先做較小試辦，不一次換掉所有燈。學生最有價值的收穫不是簡單答案，而是更審慎提問。科學探究需調整主張，使之符合觀察實際能支持的範圍。"}]}, {"word": "evidence", "meanings": ["證據"], "pos": ["N"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P036", "title": "故事作為開場", "blank": 3, "level": 5, "type": "段落功能", "evidence": "It draws readers' attention before the writer turns to statistical evidence.", "why": "statistical evidence 與前面個案互補；未說統計是 fiction。", "en": "The article begins with a child struggling to cross a busy road. The next paragraphs examine pedestrian safety across the city. The opening story functions as an illustration of the broader issue. It draws readers' attention before the writer turns to statistical evidence.", "zh": "文章先寫一位孩子難以穿越繁忙道路，再檢視全市行人安全。開場故事是較廣泛議題的具體例示，先吸引讀者注意，作者接著轉向統計證據。"}, {"pid": "P097", "title": "先保留作答理由", "blank": 2, "level": 3, "type": "尚待確認", "evidence": "She requested more evidence and planned a different passage to check whether the difficulty would recur.", "why": "more evidence 是教師複核需要的資料。", "en": "A student chose a word that did not fit the passage but could not explain the choice. The teacher treated the error as a signal, not a diagnosis. She requested more evidence and planned a different passage to check whether the difficulty would recur.", "zh": "學生選了不合篇章的字，卻無法說明理由。老師把錯誤當訊號，而非診斷。她要求更多證據，並安排不同文章觀察困難是否再出現。"}, {"pid": "P102", "title": "城市夜色中的昆蟲", "blank": 5, "level": 5, "type": "推論", "evidence": "Their new records provided stronger evidence about the role of light.", "why": "控制區域後證據 evidence 較強。", "en": "When a city replaced its streetlights, residents welcomed the brighter roads. A biology teacher asked a different question: how would the change affect insects? Her students placed observation sheets near several lamps and counted visits at fixed times. To keep the comparison fair, they used the same procedure at every location. They found more insects around some lamps than others. This difference was interesting, but its cause was not immediately clear. The locations also varied in temperature and nearby vegetation. The teacher therefore reminded the class that a pattern was not automatically an explanation. During a second trial, the students compared two lamp types in the same area. Their new records provided stronger evidence about the role of light. Even so, the findings applied only to the conditions they had tested. The class resisted the temptation to claim that one lamp was best everywhere. In their report, they described both the results and the limitations. The city agreed to consider a smaller trial rather than replace every light at once. For the students, the most valuable lesson was not a simple answer but a more careful way of asking questions. Scientific inquiry, they learned, depends on adjusting claims to match what observations actually support.", "zh": "城市更換路燈時，居民歡迎更明亮道路。生物老師問：改變如何影響昆蟲？學生在幾座燈旁設觀察表，固定時間計數到訪。為公平比較，各處程序一致。他們發現某些燈邊昆蟲更多，差異有趣，原因卻未明：各地溫度、植被也不同。老師提醒模式不自動等於解釋。第二次試驗在同區比較兩款燈，新紀錄提供更強證據。不過發現只適用受測條件。學生避免宣稱某款燈處處最佳，報告同時說明結果與限制。市府同意先做較小試辦，不一次換掉所有燈。學生最有價值的收穫不是簡單答案，而是更審慎提問。科學探究需調整主張，使之符合觀察實際能支持的範圍。"}, {"pid": "P115", "title": "一則公共提案的結構", "blank": 3, "level": 4, "type": "文章組織", "evidence": "A trial supplies evidence about whether the proposal works.", "why": "trial supplies evidence，從提案轉到效果檢驗。", "en": "The report begins with a description of overcrowded bus stops. It then identifies the main causes, including uneven arrival times. The next section proposes a scheduling reform. A trial supplies evidence about whether the proposal works. The final section weighs benefits against costs before making a recommendation. This problem-to-response structure helps readers follow the argument.", "zh": "報告先描述公車站擁擠，再辨識主要成因，如到站時間不均。下一節提出班表改革。試辦提供方案效果的證據。末節權衡效益和成本，再給建議。從問題走向回應的結構讓讀者容易跟上論證。"}]}, {"word": "exact", "meanings": ["精確的"], "pos": ["Adj"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P040", "title": "空掉的餵食器", "blank": 2, "level": 3, "type": "推論", "evidence": "It does not establish the exact amount each bird consumed or rule out every other explanation.", "why": "does not establish 指不能精確分配每隻鳥的量，exact；文中沒有可供估計分量的資料。", "en": "A bird feeder was full at sunrise and empty by noon. A camera showed several birds visiting it. The evidence suggests that birds ate at least some of the seeds. It does not establish the exact amount each bird consumed or rule out every other explanation.", "zh": "餵鳥器日出時是滿的，中午已空。攝影機拍到幾隻鳥到訪。證據暗示鳥至少吃掉部分種子，卻無法確定每隻鳥吃的精確量，也不能排除所有其他解釋。"}]}, {"word": "examine", "meanings": ["檢視"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P083", "title": "學術摘要", "blank": 1, "level": 3, "type": "語域不合", "evidence": "The abstract states that the study will examine patterns of urban travel.", "why": "摘要需有系統 examine，eyeball 為隨意目測，與研究語域不合。", "en": "The abstract states that the study will examine patterns of urban travel. Its findings indicate a relationship between distance and transport choice. The author avoids slang to maintain a formal register.", "zh": "摘要指出研究將檢視城市交通模式。發現顯示距離與交通選擇之間的關係。作者避免俚語以維持正式語域。"}]}, {"word": "example", "meanings": ["例子"], "pos": ["N"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P015", "title": "紙本與電子書", "blank": 3, "level": 4, "type": "句間邏輯", "evidence": "For travelers, for example, luggage weight may matter most.", "why": "for example 引出旅人的具體情境；for contrast 不是此處的慣用例證語。", "en": "Electronic books are easy to carry. Printed books, however, do not need batteries. Neither format is best in every situation. Instead, readers should choose according to their needs. For travelers, for example, luggage weight may matter most.", "zh": "電子書方便攜帶，然而紙本書不需電池。沒有一種形式適合所有情況。讀者應改為依需求選擇。例如，對旅人而言，行李重量可能最重要。"}]}, {"word": "except", "meanings": ["除了"], "pos": ["Prep"], "tags": ["Semantics"], "examples": [{"pid": "P127", "title": "訪客的通知單", "blank": 5, "level": 3, "type": "易混淆字詞", "evidence": "Everyone was welcome except those without a reservation, because places were limited.", "why": "except 排除未預約者，不是動詞 accept。", "en": "Visitors were advised to arrive before nine. The notice explained that late arrival could affect the entire group's schedule. Its purpose was to reduce the effect of delays on the tour. The guide would accept reasonable requests for assistance. Everyone was welcome except those without a reservation, because places were limited.", "zh": "訪客被建議九點前到達。通知說明遲到可能影響整團時程，目的是減少延誤對行程的影響。導遊會接受合理協助請求。除了未預約者外都歡迎，因名額有限。"}]}, {"word": "exchange", "meanings": ["交換"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P011", "title": "共享工具箱", "blank": 2, "level": 3, "type": "指涉連貫", "evidence": "This small exchange inspired them to create a shared toolbox.", "why": "This 回指借出與歸還的互動，exchange 有證據；沒有爭執 dispute。", "en": "Mina lent her drill to Omar because his was broken. He repaired a shelf and returned the borrowed tool the next day. This small exchange inspired them to create a shared toolbox. It now serves twelve households in their building.", "zh": "米娜把電鑽借給歐瑪，因為他的壞了。他修好架子，隔天歸還借來的工具。這次小小的交換啟發他們建立共享工具箱，目前服務大樓中的十二戶住家。"}]}, {"word": "exhibition", "meanings": ["展覽"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P017", "title": "從訪談到展覽", "blank": 2, "level": 3, "type": "句間銜接", "evidence": "Drawing on the stories, students prepared an exhibition.", "why": "後文有 Visitors 且能比較歷史，exhibition 承接整理故事的公開呈現。", "en": "The class interviewed older residents about local shops. These accounts revealed how the street had changed. Drawing on the stories, students prepared an exhibition. Visitors could then compare the past with the present.", "zh": "班上訪問年長居民，詢問當地店家。這些敘述呈現街道的變化。學生根據故事籌備展覽，讓參觀者比較過去與現在。"}]}, {"word": "existence", "meanings": ["存在"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P024", "title": "洞穴新發現", "blank": 1, "level": 4, "type": "新舊資訊", "evidence": "Until then, its existence had been unknown to local residents.", "why": "until then 與 discovered 表明原先不知存在；reputation 預設已知道地方且有評價。", "en": "A team discovered a small cave beneath the hill. Until then, its existence had been unknown to local residents. The newly found site contained wall markings. These traces raised fresh questions about who had visited it.", "zh": "團隊在山丘下發現小洞穴。在那之前，當地居民不知道它的存在。這個新發現的地點有壁面刻痕。這些痕跡引出新的問題：誰曾到訪？"}]}, {"word": "expensive", "meanings": ["昂貴的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P064", "title": "值得花費的價格", "blank": 1, "level": 2, "type": "近義詞混淆", "evidence": "The jacket was expensive, but its price was not the only concern.", "why": "物品 jacket is expensive；price is high。high 不直接表示此處外套售價高。", "en": "The jacket was expensive, but its price was not the only concern. Students also asked whether the fabric would last through several winters. A high price does not always guarantee durability.", "zh": "外套很昂貴，但價格不是唯一考量。學生也問布料是否能耐用好幾個冬天。高價不一定保證耐久。"}]}, {"word": "explanation", "meanings": ["解釋"], "pos": ["N"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P040", "title": "空掉的餵食器", "blank": 3, "level": 3, "type": "推論", "evidence": "It does not establish the exact amount each bird consumed or rule out every other explanation.", "why": "rule out every other explanation 限制推論，不把單一情境當唯一原因。", "en": "A bird feeder was full at sunrise and empty by noon. A camera showed several birds visiting it. The evidence suggests that birds ate at least some of the seeds. It does not establish the exact amount each bird consumed or rule out every other explanation.", "zh": "餵鳥器日出時是滿的，中午已空。攝影機拍到幾隻鳥到訪。證據暗示鳥至少吃掉部分種子，卻無法確定每隻鳥吃的精確量，也不能排除所有其他解釋。"}, {"pid": "P102", "title": "城市夜色中的昆蟲", "blank": 4, "level": 5, "type": "推論", "evidence": "The teacher therefore reminded the class that a pattern was not automatically an explanation.", "why": "模式未排除其他因素，不自動成因果 explanation。", "en": "When a city replaced its streetlights, residents welcomed the brighter roads. A biology teacher asked a different question: how would the change affect insects? Her students placed observation sheets near several lamps and counted visits at fixed times. To keep the comparison fair, they used the same procedure at every location. They found more insects around some lamps than others. This difference was interesting, but its cause was not immediately clear. The locations also varied in temperature and nearby vegetation. The teacher therefore reminded the class that a pattern was not automatically an explanation. During a second trial, the students compared two lamp types in the same area. Their new records provided stronger evidence about the role of light. Even so, the findings applied only to the conditions they had tested. The class resisted the temptation to claim that one lamp was best everywhere. In their report, they described both the results and the limitations. The city agreed to consider a smaller trial rather than replace every light at once. For the students, the most valuable lesson was not a simple answer but a more careful way of asking questions. Scientific inquiry, they learned, depends on adjusting claims to match what observations actually support.", "zh": "城市更換路燈時，居民歡迎更明亮道路。生物老師問：改變如何影響昆蟲？學生在幾座燈旁設觀察表，固定時間計數到訪。為公平比較，各處程序一致。他們發現某些燈邊昆蟲更多，差異有趣，原因卻未明：各地溫度、植被也不同。老師提醒模式不自動等於解釋。第二次試驗在同區比較兩款燈，新紀錄提供更強證據。不過發現只適用受測條件。學生避免宣稱某款燈處處最佳，報告同時說明結果與限制。市府同意先做較小試辦，不一次換掉所有燈。學生最有價值的收穫不是簡單答案，而是更審慎提問。科學探究需調整主張，使之符合觀察實際能支持的範圍。"}]}, {"word": "explanations", "meanings": ["解釋"], "pos": ["N"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P130", "title": "雨量與報名率", "blank": 4, "level": 4, "type": "上下文邏輯", "evidence": "This approach helped test competing explanations.", "why": "下雨與降價都是可能 explanations，不是已驗證唯一因素。", "en": "More people joined the indoor class during a rainy week. The organizer suspected that bad weather had increased demand. Yet a discounted fee had been introduced at the same time. Because these changes coincided, their effects were difficult to separate. She compared later weeks with different prices and weather conditions. This approach helped test competing explanations. It avoided treating the first observed link as a proven cause.", "zh": "雨週有更多人報名室內課。主辦者懷疑壞天氣增加需求，但同期也開始折扣。兩改變同時發生，效果難分。她比較後續價格、天氣條件不同的週次，檢驗競爭解釋，避免把初見關聯當已證明原因。"}]}, {"word": "exposed", "meanings": ["暴露的"], "pos": ["V-en"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P059", "title": "城市的影響", "blank": 2, "level": 2, "type": "介系詞搭配", "evidence": "Children living near busy roads may be exposed to it for hours each day.", "why": "be exposed to 表暴露於；exposure 是名詞，不能組成 be exposure to。", "en": "Noise can interfere with concentration. Children living near busy roads may be exposed to it for hours each day. A school therefore invested heavily in soundproof windows to reduce the disturbance.", "zh": "噪音可能干擾專注。住繁忙道路旁的孩子可能每天接觸噪音數小時。因此學校大量投資隔音窗以減少干擾。"}]}, {"word": "extend", "meanings": ["延長"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P135", "title": "讓舊衣延長壽命", "blank": 4, "level": 3, "type": "語意判斷", "evidence": "The customer agreed because she wanted to extend its life.", "why": "顧客要增加使用年限，extend；shorten 方向相反。", "en": "A tailor examined the coat before deciding how to repair it. The lining was torn, but the outer fabric remained intact. Replacing only the damaged layer would preserve the coat's useful parts. The customer agreed because she wanted to extend its life. The work turned a possible discard into a usable garment.", "zh": "裁縫檢查外套再決定如何修補。內裡破了，但外層布仍完整。只換壞層可保留可用部分。顧客同意，因她想延長衣服壽命。修補讓原本可能被丟的衣物重新可穿。"}]}, {"word": "facility", "meanings": ["設施"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P023", "title": "街角飲水站", "blank": 1, "level": 3, "type": "新舊資訊", "evidence": "The facility was the first of its kind in the area.", "why": "The facility 以定指概括前句首次介紹的 fountain。", "en": "The city installed a drinking fountain outside the station. The facility was the first of its kind in the area. A nearby sign explains its purpose: reducing disposable bottles. That goal has encouraged shops to offer free refills.", "zh": "市府在車站外裝設飲水台。這項設施是該區首座。附近告示說明其用途：減少一次性瓶子。這個目標鼓勵商店提供免費續水。"}]}, {"word": "failure", "meanings": ["失敗"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P034", "title": "線上學習的反例", "blank": 3, "level": 3, "type": "段落功能", "evidence": "It does not prove that all online learning is a failure.", "why": "not prove…all 限定反例不能證明所有情況 failure。", "en": "The opening paragraph claims that online lessons save everyone time. The next describes a student with an unreliable connection. This case serves as a counterexample, showing that the claim needs qualification. It does not prove that all online learning is a failure.", "zh": "首段主張線上課程節省每個人的時間。下一段描述一位網路不穩的學生。這個案例是反例，顯示主張需要加上限制；它並未證明所有線上學習都失敗。"}]}, {"word": "fainter", "meanings": ["更微弱的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P066", "title": "聽見與傾聽", "blank": 3, "level": 4, "type": "近義詞混淆", "evidence": "The sound gradually became fainter as the musicians walked away.", "why": "walked away 使音量更微弱 fainter；louder 方向相反。", "en": "From her room, Mei could hear music in the courtyard even with the window closed. She opened it to listen carefully to the melody. The sound gradually became fainter as the musicians walked away.", "zh": "即使窗戶關著，美在房裡仍聽得到院子音樂。她開窗仔細聆聽旋律。樂手走遠時，聲音逐漸變微弱。"}]}, {"word": "fair", "meanings": ["公平的"], "pos": ["Adj"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P102", "title": "城市夜色中的昆蟲", "blank": 2, "level": 5, "type": "推論", "evidence": "To keep the comparison fair, they used the same procedure at every location.", "why": "same procedure 是維持 fair comparison。", "en": "When a city replaced its streetlights, residents welcomed the brighter roads. A biology teacher asked a different question: how would the change affect insects? Her students placed observation sheets near several lamps and counted visits at fixed times. To keep the comparison fair, they used the same procedure at every location. They found more insects around some lamps than others. This difference was interesting, but its cause was not immediately clear. The locations also varied in temperature and nearby vegetation. The teacher therefore reminded the class that a pattern was not automatically an explanation. During a second trial, the students compared two lamp types in the same area. Their new records provided stronger evidence about the role of light. Even so, the findings applied only to the conditions they had tested. The class resisted the temptation to claim that one lamp was best everywhere. In their report, they described both the results and the limitations. The city agreed to consider a smaller trial rather than replace every light at once. For the students, the most valuable lesson was not a simple answer but a more careful way of asking questions. Scientific inquiry, they learned, depends on adjusting claims to match what observations actually support.", "zh": "城市更換路燈時，居民歡迎更明亮道路。生物老師問：改變如何影響昆蟲？學生在幾座燈旁設觀察表，固定時間計數到訪。為公平比較，各處程序一致。他們發現某些燈邊昆蟲更多，差異有趣，原因卻未明：各地溫度、植被也不同。老師提醒模式不自動等於解釋。第二次試驗在同區比較兩款燈，新紀錄提供更強證據。不過發現只適用受測條件。學生避免宣稱某款燈處處最佳，報告同時說明結果與限制。市府同意先做較小試辦，不一次換掉所有燈。學生最有價值的收穫不是簡單答案，而是更審慎提問。科學探究需調整主張，使之符合觀察實際能支持的範圍。"}]}, {"word": "features", "meanings": ["特徵／設施"], "pos": ["N"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P100", "title": "一條河的兩種任務", "blank": 3, "level": 5, "type": "全文一致", "evidence": "These features created habitats without blocking the main flow.", "why": "These features 回指植栽平台。", "en": "For decades, a concrete channel carried rainwater quickly through the town. Engineers had designed it to prevent flooding, and many residents considered it a success. Yet its steep walls left little room for plants or animals. When the town proposed a redesign, the debate was not simply about beauty. It concerned how one place could serve multiple purposes. The new plan kept a deep central channel but added planted shelves along the sides. These features created habitats without blocking the main flow. Some residents remained skeptical, fearing that vegetation would slow the water. The team therefore ran tests before construction. The results suggested that the design could work under ordinary conditions; they did not guarantee safety in every possible storm. Officials described the evidence as promising, rather than final. After the first section opened, volunteers began to record water levels and wildlife sightings. Their observations would guide later adjustments. The project thus treated restoration as an ongoing process, not a single finished event. Its broader lesson was that public spaces require both careful design and continued attention.", "zh": "數十年來，水泥渠道讓雨水快速流過小鎮。工程師原先設計它是為防洪，许多居民認為很成功。但陡峭壁面使動植物幾乎無處生存。小鎮提出改造時，辯論不只關乎美觀，更涉及同一空間如何兼顧多項用途。新計畫保留深中央水道，在兩側增植栽平台。這些設計創造棲地，又不阻擋主流。部分居民仍懷疑，擔心植被減慢水流。因此團隊施工前先測試。結果暗示設計在一般條件下可行，卻不保證每場可能的暴雨都安全。官員稱證據有希望，而非已定論。首段開放後，志工開始記錄水位與野生動物。觀察將引導後續調整。修復因此是持續過程，而非一次完成的事件。更廣泛的啟示是公共空間既需周密設計，也需持續關注。"}]}, {"word": "fell", "meanings": ["下降"], "pos": ["V"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P074", "title": "鹽分的累積", "blank": 2, "level": 3, "type": "上下文方向", "evidence": "Crop yields then fell.", "why": "土壤逐漸 unusable，產量 fell，不是 rose。", "en": "For years, poor drainage trapped irrigation water in the field. As the water evaporated, salt levels increased. Crop yields then fell. Farmers needed to reverse this trend before the soil became unusable.", "zh": "多年來排水不良使灌溉水滯留。水蒸發後，鹽分濃度增加，作物產量隨後下降。農民必須在土壤無法使用前扭轉趨勢。"}]}, {"word": "foldable", "meanings": ["可折疊的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P007", "title": "可折疊水杯", "blank": 1, "level": 2, "type": "局部精確語意", "evidence": "A designer created a foldable model that becomes flat when empty.", "why": "becomes flat 是能折疊的具體證據；fragile 只說易碎，不能解釋變平收納。", "en": "Hikers wanted cups that would fit inside small pockets. A designer created a foldable model that becomes flat when empty. It weighs very little, so it is also lightweight. Its tight lid prevents water from leaking.", "zh": "健行者想要能放進小口袋的杯子。設計師做出可折疊款式，空杯可壓平。它很輕，因此也方便攜帶；緊密的杯蓋能防止漏水。"}]}, {"word": "formal", "meanings": ["正式的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P083", "title": "學術摘要", "blank": 3, "level": 3, "type": "語域不合", "evidence": "The author avoids slang to maintain a formal register.", "why": "avoids slang 支持 formal，chatty 方向相反。", "en": "The abstract states that the study will examine patterns of urban travel. Its findings indicate a relationship between distance and transport choice. The author avoids slang to maintain a formal register.", "zh": "摘要指出研究將檢視城市交通模式。發現顯示距離與交通選擇之間的關係。作者避免俚語以維持正式語域。"}]}, {"word": "frequent", "meanings": ["頻繁的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P009", "title": "溫室測量", "blank": 1, "level": 4, "type": "局部精確語意", "evidence": "Such frequent measurements help growers notice sudden changes.", "why": "every minute 支持 frequent，occasional 頻率相反。", "en": "The sensor records temperature every minute. Such frequent measurements help growers notice sudden changes. They need accurate readings because an error of two degrees can damage seedlings. A backup battery keeps the sensor operational during power failur
