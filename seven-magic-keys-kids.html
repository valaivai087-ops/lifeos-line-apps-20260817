<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>七把魔法鑰匙</title>
<style>
:root{--bg:#fff8ec;--card:#fff;--ink:#3a3128;--mute:#8a7d6e;--line:#f0e2c8;--acc:#e8833a;--accs:#fdebd6;--g:#3f9a5b;--gs:#e5f4e8;--y:#c98a12;--ys:#fbf0d5;--r:#d0553f;--rs:#fbe3dd;--hl:#ffe27a}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.8 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
header{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:2px dashed var(--line);padding:10px 16px 6px}
.wrap{max-width:1000px;margin:0 auto}
h1{font-size:21px;margin:0 0 8px}
h1 small{font-weight:400;color:var(--mute);font-size:14px;margin-left:6px}
.sbar{display:flex;gap:8px}

nav button .n{font-size:12px;margin-left:4px}
main{max-width:1000px;margin:0 auto;padding:16px}
.pane{display:none}.pane.on{display:block}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px 18px;margin-bottom:16px}
h2{font-size:20px;margin:0 0 8px}
h3{font-size:17px;margin:14px 0 6px;color:var(--acc)}
.mute{color:var(--mute);font-size:15px}

.box{border:2px solid var(--line);border-radius:16px;padding:10px 14px}
.box b.t{display:block;color:var(--mute);font-size:14px}
.key{border:2px solid var(--line);border-radius:18px;padding:12px 14px;cursor:pointer;background:var(--card)}

.story{border-bottom:2px dashed var(--line);padding:10px 0}
.story:last-child{border-bottom:0}
.story .no{display:inline-block;min-width:34px;font-weight:700;color:var(--acc)}
.row{display:flex;gap:8px;margin-top:2px}

.th{background:var(--ys);color:var(--y)}.do{background:var(--gs);color:var(--g)}
.old{color:var(--r)}.new{color:var(--g)}
.pair{padding:8px 0;border-bottom:1px dashed var(--line)}
.pair:last-child{border-bottom:0}
.abc{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:8px}
.A,.B,.C{border-radius:16px;padding:10px 14px}
.A{background:var(--gs)}.B{background:var(--ys)}.C{background:var(--rs)}
.A>b{color:var(--g)}.B>b{color:var(--y)}.C>b{color:var(--r)}
.safe{background:var(--rs);border-radius:16px;padding:10px 14px}
ol,ul{margin:4px 0;padding-left:24px}
.dl{display:grid;grid-template-columns:6.5em 1fr;gap:4px 12px}
.dl dt{color:var(--mute);font-size:15px}.dl dd{margin:0}
label{display:block;font-size:15px;color:var(--mute);margin:10px 0 3px}
input[type=date],select,textarea{width:100%;padding:8px 10px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
textarea{min-height:50px;resize:vertical}
.btn{border:0;background:var(--acc);color:#fff;border-radius:14px;padding:8px 18px;font-size:16px;cursor:pointer;margin:12px 6px 0 0}
.btn.g{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 14px}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.moods button{font-size:26px;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:2px 8px;cursor:pointer}
.moods button.on{border-color:var(--acc);background:var(--accs)}
.log{border-top:2px dashed var(--line);padding:10px 0}
.empty{color:var(--mute);text-align:center;padding:30px 0}
.hidden{display:none!important}
mark{background:var(--hl);color:inherit;border-radius:3px}
.stars{display:flex;gap:4px;flex-wrap:wrap}
.stars button{font-size:15px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:3px 9px;cursor:pointer}
.stars button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.score{font-size:30px;font-weight:700;color:var(--acc)}
@media (max-width:600px){.dl{grid-template-columns:1fr}.dl dt{margin-top:6px}h1 small{display:block;margin:0}}
</style>
</head>

<header><div class="wrap">
<h1>🗝️ 七把魔法鑰匙<small>遇到困難時，帶著這七把鑰匙慢慢打開</small></h1>
<div class="sbar"><input id="q" type="search" placeholder="🔍 找找看：手機、吵架、拒絕、考試、休息…"><button id="clr">清除</button></div>
<nav id="nav"></nav>
</div></header>
<main id="main"></main>

{e:"💬",t:"換一句話說，事情就不一樣",who:"維根斯坦（一位研究「語言」的哲學家）",core:"同一件事，用不同的話來說，我們就會想到不同的辦法。",w:"你對自己說的話，會變成你看見的路。",c:`考試考不好|說「我好笨」，會讓你以為自己永遠學不會。|問自己：「我是單字、文法，還是閱讀錯最多？」

{e:"🔮",t:"我們的腦袋很會「猜」，但有時候猜錯",who:"預測處理模型（科學家研究大腦怎麼猜下一步）",core:"大腦會用以前的經驗猜接下來會怎樣。猜錯的時候，正好可以學到新東西。",w:"長大不是每次都猜對，而是猜錯時願意改一改。",c:`看到英文長文章就害怕|還沒讀就覺得「我一定看不懂」，會讓人不想試。|先讀第一段，看看自己其實懂多少。

{e:"🕸️",t:"很多小事連在一起，變成大事",who:"複雜系統（研究很多東西互相影響的學問）",core:"一件事的結果，常常是好幾個原因一起造成的，不只一個。",w:"真正厲害的人，會去改變讓問題一直出現的地方。",c:`英文一直沒有進步|單字、讀的速度、理解、考試方法，都會互相影響。|先找出：哪一個地方讓我錯最多？

想變健康卻一直失敗|吃的、動的、睡的、環境，都會影響身體。|先記錄兩個星期的生活習慣。

好多問題一起出現|時間、錢、身體、人際關係會互相拉扯。|先改善一個「改好了，其他也會變輕鬆」的問題。`},
{e:"🌀",t:"為什麼我總是回到老樣子？",who:"吸引子理論（研究東西為什麼會一直回到同一個狀態）",core:"就像球會滾回碗底，習慣也會一直把我們拉回老樣子。",note:"這只是拿來比喻，不是說人的習慣真的是數學公式喔。",w:"改變不只是離開老習慣一次，而是布置好不容易被拉回去的環境。",c:`每次吵架都變成不說話|兩個人一直重複同樣的吵法。|先約好：生氣時暫停，冷靜後再談。

 <div class="chips">${NODES.map(n=>`<a class="chip" href="#B${n.id}">${n.e} ${n.k}</a>`).join("")}</div>`;
 NODES.forEach(n=>{const s=n.sc;
  h+=`<div class="card grp" id="B${n.id}"><h2>${n.e} ${n.k}</h2>
  <div class="item"><b>情況：</b>${s.s}<br><b>我先說：</b>「${s.start}」</div>
  <div class="abc">${[["A","🤝 願意"],["B","🙅 說不要"],["C","🌋 很生氣"]].map(([k,t])=>`<div class="${k} item"><b>${t}</b><br>對方：「${s[k][0]}」<br>我說：「${s[k][1]}」<div class="mute">👉 ${s[k][2]}</div></div>`).join("")}</div>
  <p class="warm item">${s.w}</p></div>`;
 });
 h+=`<div class="card"><p class="warm">好好說話，不是讓每個人都滿意，而是不管對方怎麼反應，我都能想清楚、守住界線，再選一個好方法。</p></div>`;
 return h;
}

function pMei(){
 let h=`<div class="card grp hero"><div class="big">👩</div><h2>小美的故事</h2>
 <p class="item">小美是一位很認真的媽媽，也在公司上班。<br>同事常找她幫忙，家人也什麼事都找她。<br>她每天好累，幾乎沒有時間休息。</p>
 <p class="item">她常說：「<b>如果我不做，就沒有人做了。</b>」</p>
 <p class="item mute">她希望：工作穩定、和大家感情好，而且每個星期多三個小時休息。</p></div>`;
 NODES.forEach((n,i)=>{const m=n.mei;
  h+=`<div class="card grp"><h2>${n.e} 第${CN[i]}把鑰匙：${n.k}</h2><dl class="dl item">
  <dt>原本想法</dt><dd class="old">${m.o}</dd><dt>🤔 問問她</dt><dd>${m.ask}</dd><dt>小美說</dt><dd>${m.ans}</dd>
  <dt>✋ 小行動</dt><dd>${m.a}</dd><dt>🎉 結果</dt><dd>${m.f}</dd><dt>新的想法</dt><dd class="new">${m.n}</dd></dl></div>`;
 });
 h+=`<div class="card grp"><h2>🌈 小美學到了什麼？</h2><dl class="dl">
 <dt>以前</dt><dd class="item">有人請求 → 馬上答應 → 事情變多 → 沒時間休息。</dd>
 <dt>現在</dt><dd class="item">先問清楚誰負責、什麼先做，再決定怎麼幫忙。</dd>
 <dt>成果</dt><dd class="item">成功討論了一次，也留下30分鐘給自己休息。</dd>
 <dt>還要觀察</dt><dd class="item">新方法能不能一直做下去？在家裡、在朋友面前也有用嗎？</dd></dl>
 <p class="warm">人生不用一下子全部改變。找到一個小地方，做一次不一樣的事，新的路就開始了。</p></div>`;
 return h;
}

function pStar(){
 const r=store.get("kid7_rate",{});
 return `<div class="card hero"><div class="big">⭐</div><h2>我的星星表</h2><p>每一把鑰匙，看看自己現在走到哪裡了。<br><span class="mute">這不是考試，也不是說你好不好，只是看見自己的成長。</span></p></div>
 <div class="card grp">${NODES.map(n=>`<div class="item" style="margin-bottom:14px"><b>${n.e} ${n.k}</b>
 <div class="stars" data-node="${n.id}">${LEVELS.map((l,i)=>`<button data-v="${i}" class="${(r[n.id]|0)===i?"on":""}">${l}</button>`).join("")}</div>
 <div class="mute">${["",...n.lv][r[n.id]|0]||"還沒開始也沒關係，種子正在長大。"}</div></div>`).join("")}
 <p>我的星星：<span class="score" id="tot">0</span> / 28</p><p class="warm" id="cheer"></p></div>
 <div class="card grp"><h2>🌱 星星等級</h2>${LEVELS.map((l,i)=>`<div class="item">${l}：${["只覺得卡住，還看不出原因。","看了例子，可以跟著做。","有人提醒，就能找到重點。","不用提醒，自己就會用。","在學校、家裡、朋友之間都會用，還會自己修正。"][i]}</div>`).join("")}</div>`;
}

const DF=[["what","📝 今天發生什麼事？","只寫真的發生的事"],["think","💭 我原本怎麼想？","我心裡的猜測"],["new","🌈 換個想法","還有什麼可能？"],["act","✋ 我要試的小行動","小小的、做得到的"],["guess","🔮 我猜會怎樣？","先猜猜看"],["real","👀 結果真的怎樣？","做完再寫"],["learn","🌟 下次我會…","我學到了什麼？"]];
function pDiary(){
 const t=new Date(),d=`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;
 return `<div class="card"><h2>📔 今天的心情日記</h2><div class="mute">日記只存在這台電腦裡，可以按「存成檔案」備份。</div>
 <div class="f2"><div><label>📅 日期</label><input type="date" id="d_date" value="${d}"></div>
 <div><label>🗝️ 今天用哪一把鑰匙？</label><select id="d_key">${NODES.map(n=>`<option value="${n.id}">${n.e} ${n.k}</option>`).join("")}</select></div></div>
 <label>😊 今天的心情</label><div class="moods" id="moods">${MOODS.map(m=>`<button type="button" data-m="${m}">${m}</button>`).join("")}</div>
 <p class="mute" id="d_hint"></p>
 <div class="f2">${DF.map(f=>`<div><label>${f[1]}</label><textarea id="d_${f[0]}" placeholder="${f[2]}"></textarea></div>`).join("")}</div>
 <button class="btn" id="saveD">💾 存下來</button><button class="btn g" id="clearD">清空</button><button class="btn g" id="expD">📤 存成檔案</button></div>
 <div class="card grp"><h2>我的日記本 <span class="mute" id="dCount"></span></h2><div id="dList"></div></div>`;
}
let mood="";
function drawDiary(){
 const L=store.get("kid7_diary",[]);$("#dCount").textContent=`（${L.length} 篇）`;
 $("#dList").innerHTML=L.length?L.slice().reverse().map(x=>{const n=NODES.find(k=>k.id===x.key)||NODES[0];
  return `<div class="log item"><b>${esc(x.date)}</b> ${x.mood||""} ${keyTag(n)}<dl class="dl" style="margin-top:4px">${DF.filter(f=>x[f[0]]).map(f=>`<dt>${f[1]}</dt><dd>${esc(x[f[0]]).replace(/\n/g,"<br>")}</dd>`).join("")}</dl><button class="btn g" data-del="${x.t}">刪除</button></div>`}).join("")
  :`<div class="empty">📖 日記本還是空的。<br>今天試一個小行動，回來寫下發生了什麼吧！</div>`;
 applySearch();
}
function hint(){const n=NODES.find(k=>k.id===$("#d_key").value);$("#d_hint").innerHTML=`${n.e} 問問自己：${n.q}<br>說說看：「${n.tpl}」`}

/* ========== 組裝 ========== */
const R={home:pHome,keys:pKeys,stories:pStories,talk:pTalk,abc:pABC,mei:pMei,star:pStar,diary:pDiary};
$("#nav").innerHTML=TABS.map(t=>`<button data-tab="${t[0]}">${t[1]}<span class="n"></span></button>`).join("");
$("#main").innerHTML=TABS.map(t=>`<section class="pane" id="p_${t[0]}">${R[t[0]]()}<div class="empty hidden nores">這一頁沒有找到喔，看看其他頁籤的數字 👆</div></section>`).join("");
function show(tab){document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",p.id==="p_"+tab));document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));store.set("kid7_tab",tab)}
function jump(id){const t=document.getElementById(id);if(t)window.scrollTo({top:t.getBoundingClientRect().top+scrollY-$("header").offsetHeight-8,behavior:"smooth"})}
$("#nav").addEventListener("click",e=>{const b=e.target.closest("button");if(b){show(b.dataset.tab);scrollTo(0,0)}});
document.addEventListener("click",e=>{
 const a=e.target.closest("a.chip");if(a){e.preventDefault();jump(a.getAttribute("href").slice(1));return}
 const k=e.target.closest("[data-go]");if(k){show("keys");jump(k.dataset.go);return}
 const s=e.target.closest(".stars button");if(s){const r=store.get("kid7_rate",{});r[s.parentNode.dataset.node]=+s.dataset.v;store.set("kid7_rate",r);const p=$("#p_star");p.innerHTML=pStar()+'<div class="empty hidden nores"></div>';calc();return}
 const m=e.target.closest("#moods button");if(m){mood=m.dataset.m;document.querySelectorAll("#moods button").forEach(b=>b.classList.toggle("on",b===m));return}
 const d=e.target.dataset.del;if(d&&confirm("確定要刪除這篇日記嗎？")){store.set("kid7_diary",store.get("kid7_diary",[]).filter(x=>String(x.t)!==d));drawDiary()}
});
function calc(){const r=store.get("kid7_rate",{});const t=NODES.reduce((s,n)=>s+(r[n.id]|0),0);$("#tot").textContent=t;
 $("#cheer").textContent=t===0?"每一顆種子，都是從土裡慢慢長出來的。":t<14?"你已經開始了，這就很了不起！":t<21?"你越來越會用鑰匙了，繼續加油！":t<28?"好厲害！你已經能自己打開很多扇門了！":"太棒了！你已經能把七把鑰匙帶到任何地方！"}
calc();

/* 搜尋 */
function unmark(el){el.querySelectorAll("mark").forEach(m=>m.replaceWith(m.textContent));el.normalize()}
function markIn(el,kw){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),hits=[];let t;
 while(t=w.nextNode())if(t.nodeValue.toLowerCase().includes(kw))hits.push(t);
 hits.forEach(t=>{const s=t.nodeValue,low=s.toLowerCase(),f=document.createDocumentFragment();let i=0,j;
  while((j=low.indexOf(kw,i))>-1){f.append(s.slice(i,j));const m=document.createElement("mark");m.textContent=s.slice(j,j+kw.length);f.append(m);i=j+kw.length}f.append(s.slice(i));t.replaceWith(f)})}
function applySearch(){const kw=$("#q").value.trim().toLowerCase();
 document.querySelectorAll(".pane").forEach(p=>{let c=0;unmark(p);
  p.querySelectorAll(".item").forEach(it=>{const ok=!kw||it.textContent.toLowerCase().includes(kw);it.classList.toggle("hidden",!ok);if(ok&&kw){c++;markIn(it,kw)}});
  p.querySelectorAll(".grp").forEach(g=>g.classList.toggle("hidden",!!kw&&!g.querySelector(".item:not(.hidden)")));
  const nr=p.querySelector(".nores");if(nr)nr.classList.toggle("hidden",!kw||c>0);
  document.querySelector(`nav button[data-tab="${p.id.slice(2)}"] .n`).textContent=kw?c:""});
 if(kw){const cur=$(".pane.on");if(!cur.querySelector(".item:not(.hidden)")){const f=[...document.querySelectorAll(".pane")].find(p=>p.querySelector(".item:not(.hidden)"));if(f)show(f.id.slice(2))}}}
let tm;$("#q").addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(applySearch,180)});
$("#clr").onclick=()=>{$("#q").value="";applySearch();$("#q").focus()};

/* 日記 */
$("#d_key").addEventListener("change",hint);hint();
function clearD(){DF.forEach(f=>$("#d_"+f[0]).value="");mood="";document.querySelectorAll("#moods button").forEach(b=>b.classList.remove("on"))}
$("#saveD").onclick=()=>{const x={t:Date.now(),date:$("#d_date").value,key:$("#d_key").value,mood};DF.forEach(f=>x[f[0]]=$("#d_"+f[0]).value.trim());
 if(!x.what&&!x.act){alert("至少寫一下「今天發生什麼事」或「小行動」喔！");return}
 const L=store.get("kid7_diary",[]);L.push(x);store.set("kid7_diary",L);clearD();drawDiary()};
$("#clearD").onclick=clearD;
$("#expD").onclick=()=>{const L=store.get("kid7_diary",[]);if(!L.length){alert("日記本還是空的喔");return}
 const txt=L.map(x=>{const n=NODES.find(k=>k.id===x.key)||NODES[0];return [`【${x.date}】${x.mood||""} ${n.e}${n.k}`,...DF.filter(f=>x[f[0]]).map(f=>`${f[1]}：${x[f[0]]}`)].join("\n")}).join("\n\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+txt],{type:"text/plain;charset=utf-8"}));a.download="我的心情日記.txt";a.click()};
drawDiary();
show(store.get("kid7_tab","home"));
</script>
</body>
</html>
