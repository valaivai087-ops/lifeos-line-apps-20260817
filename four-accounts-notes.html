0句話每天說", 0], ["哲學命題", "\"你今天主動幫了別人，真是個善良的孩子\"", 0], ["排比句", "你誇他善良，他就善良；|你說他堅強，他就堅強。", 1], ["排比句", "原來，孩子是會長大的——你誇他善良，他就真的善良；|你說他堅強，他就真的堅強；|你說他是家裡的\"小幫手\"，他就真的主動承擔家務…", 0], ["對比句", "罵孩子笨的父母養出自卑，|誇孩子棒的父母養出自信。", 1], ["反問句", "你每天對孩子說的話，|是在暗示什麼？", 1], ["反問句", "各位寶爸寶媽，你們平時是怎麼誇孩子的？", 0], ["情境衝突", "班裡最自信的孩子，|背後都有會說話的父母。", 1], ["認知翻轉", "暗示的力量，|會讓孩子成為那個人。", 1], ["層層遞進", "先看見優點，再說出來，|最後孩子成為它。", 1], ["詩性收束", "一句好話，|就是一顆種子。", 1], ["詩性收束", "養孩子，真的不需要吼。", 0], ["詩性收束", "你嘴上說什麼，孩子就會長成什麼。", 0], ["詩性收束", "每天花1分鐘，用語言給孩子種下好種子，|比報10個興趣班都管用！", 0]]], [123, "活了30年，終於被人說透了：有些人，你對他好，他背後捅刀。", "B", "笑面虎笑時眼睛不動→三種識人術", ["今天把三條識人術分享給大家，看完你會回來謝我。", "第一種：笑面虎", "這種人見誰都熱情，但你仔細觀察——他笑的時候眼睛不動。你以為他是在跟你親近，其實他在判斷你有什麼用。", "我之前就吃過這虧，把專案底牌全盤托出，結果轉頭他就去找領導邀功了。關鍵資訊永遠留一手，這是自保，不是腹黑。", "笑著相處，但不笑著交心。", "第二種：愛吹牛", "“我認識那個誰誰誰”“這事我一句話就能搞定”——話說得比誰都漂亮，事辦得比誰都爛。", "遇到這種人千萬別當面拆穿，你拆穿他只會恨你一輩子。讓他吹，但別信。看什麼？看結果。嘴上跑火車的人，行動永遠跟不上嘴巴。", "聽他說，看他做。結果才是唯一的試金石。", "第三種：急性子", "這種人一點就炸，你還沒開口他就已經急了。你跟他講道理，他跟你講情緒；你跟他講情緒，他開始摔東西。", "記住：他急你不急。誰先失控誰就輸了。遇到這種人，我的經驗是——讓他說完，然後用資料和事實回應，不接他的情緒茬。", "你急我不急，情緒不對情緒，事實說話。", "最後說句掏心窩的：", "人活一世，會遇到各種各樣的人。不是所有人都值得你真心相待，也不是所有人都配得上你的善良。", "核心就一句話：看透不說透，拿捏不拿捏。", "看清一個人，不用翻臉。保持距離，各守邊界，這是成年人的體面。", "你們身邊有這三種人嗎？來評論區聊聊👇#小說人物性格 #小說人物描寫 #成語接龍 #那些美得不可方物的雅稱 #成語積累 #反義詞 #小說情節套路 #描寫人物神態 #古代對事物的雅稱 #文手", "5月4日"], [["哲學命題", "有些人，|你對他好，他背後捅刀。", 1], ["哲學命題", "關鍵資訊永遠留一手，這是自保，不是腹黑。", 0], ["哲學命題", "嘴上跑火車的人，行動永遠跟不上嘴巴。", 0], ["哲學命題", "今天把三條識人術分享給大家，看完你會回來謝我。", 0], ["哲學命題", "這種人見誰都熱情，但你仔細觀察——他笑的時候眼睛不動。", 0], ["排比句", "笑面虎，|兩面派，|白眼狼。", 1], ["對比句", "不懂識人的人吃虧，|看透的人自保。", 1], ["反問句", "那個對你很熱情的人，|眼睛有沒有在笑？", 1], ["反問句", "你們身邊有這三種人嗎？", 0], ["情境衝突", "把專案底牌全盤托出，|轉頭他就去找了老闆。", 1], ["情境衝突", "我之前就吃過這虧，把專案底牌全盤托出，|結果轉頭他就去找領導邀功了。", 0], ["情境衝突", "結果才是唯一的試金石。", 0], ["認知翻轉", "識人術，|是保護自己的盾。", 1], ["認知翻轉", "你以為他是在跟你親近，其實他在判斷你有什麼用。", 0], ["層層遞進", "先觀察，再判斷，|最後保持距離。", 1], ["詩性收束", "看清了，|就不會再受傷。", 1], ["詩性收束", "核心就一句話：看透不說透，拿捏不拿捏。", 0], ["詩性收束", "看清一個人，不用翻臉。", 0], ["詩性收束", "保持距離，各守邊界，這是成年人的體面。", 0]]], [124, "活了30年才明白：我們拼命買買買，卻從沒學會\"拿捏\"它們！", "F", "辨本質→順其性→融於行→變其用，13條馭物法則", ["今天讀到一套馭物法則，讓我徹底破防了——", "> 辨本質，明規律，少踩坑", "> 順其性，借其力，事功倍", "> 融於行，馭於物，自掌控", "> 變其用，拓其能，煥新生", "13條法則，每一條都是教訓換來的：", "1. 辨 — 摸清規律再操作，別瞎折騰", "2. 順 — 順勢而為，不逆著來", "3. 護 — 愛惜養護，用得久才是真省錢", "4. 控 — 掌控邊界，不被物綁架（手機刷到停不下來？說的就是你）", "5. 用 — 物盡其用，別讓它在角落吃灰", "6. 擇 — 按需選擇，不被慾望裹挾", "7. 舍 — 斷舍離，給生活騰空間", "8. 理 — 收納整理，取用隨心不抓狂", "9. 修 — 耐心修繕，舊物也能煥新生", "10. 敬 — 心懷敬畏，不隨意糟蹋", "11. 知 — 知其然更知所以然", "12. 變 — 一物多用，腦洞大開", "13. 融 — 融入生活，不被物定義", "最戳我的是最後四個字——", "馭物者，不被物馭", "對照一下，這13條你做到了幾條？我先坦白：5和7做得最差😅", "評論區聊聊，你是被物拿捏，還是拿捏著物？", "#迴圈再利用 #生存法則 #新物質主義 #事物發展規律 #自然規律的生存法則 #生活更有條理 #反者道之動弱者道之用 #自我防禦機制 #物質決定意識 #不被限制的思維", "May 3"], [["哲學命題", "我們拼命買買買，|卻從沒學會拿捏它們。", 1], ["哲學命題", "今天讀到一套馭物法則，讓我徹底破防了——", 0], ["排比句", "辨本質，順其性，|融於行，變其用。", 1], ["對比句", "被物品控制的人亂，|駕馭物品的人自在。", 1], ["反問句", "你擁有的東西，|是你在用它，還是它在用你？", 1], ["反問句", "控—掌控邊界，不被物綁架（手機刷到停不下來？", 0], ["反問句", "對照一下，這13條你做到了幾條？", 0], ["情境衝突", "買了一堆東西，|卻從沒真正用好。", 1], ["認知翻轉", "駕馭物品，|是一門學問。", 1], ["層層遞進", "先辨本質，再順其性，|最後變其用。", 1], ["詩性收束", "物盡其用，|人才自在。", 1]]], [125, "在人際交往裡，掌握一些拿捏人心的策略太重要了。真正厲害的人，都懂一些“拿捏術”。", "B", "晾著不服者、誇傲氣者、挫高傲者→拿捏人心策略", ["比如遇到不服管、擺架子的人，晾著他就行，重用聽話的人，等他慌了就會低頭；對有本事但傲氣的人，多誇誇他，滿足其虛榮心，他幹活會更賣力；心高氣傲的人，給他高難度任務挫挫銳氣，碰壁時你再幫忙，他就服你了。", "同時，自己也要有點心計。別輕易展露全部底牌，保持神秘感，說話留餘地，避免被人看透利用；也別做無底線的老好人，堅守自己的底線，這樣才能在人際交往中遊刃有餘，不被人隨意拿捏。#提升人格魅力 #看人識人的技巧 #識人術 #社交魅力學 #九型人格 #人格魅力能量學 #識人就是力量 #識人術讓你看人更透徹 #為人處世的方法 #為人處事的小智慧", "5月4日"], [["哲學命題", "真正厲害的人，|都懂拿捏術。", 1], ["哲學命題", "同時，自己也要有點心計。", 0], ["排比句", "晾著不服的，|誇誇傲氣的，|挫挫高傲的。", 1], ["對比句", "一刀切的人搞不定人，|拿捏得準的人收服人心。", 1], ["反問句", "面對不服管的人，|你是硬碰，還是晾著？", 1], ["情境衝突", "心高氣傲的人，|碰壁時你再幫，他就服了。", 1], ["認知翻轉", "拿捏人心，|是一門功夫。", 1], ["層層遞進", "先看清性格，再對症，|最後收服。", 1], ["詩性收束", "拿捏得當，|人心自然歸。", 1]]], [126, "活了30年才明白：真正厲害的人，從來不是多麼強勢，而是把\"分寸\"二字刻進了骨子裡。", "B", "凡事緩一緩、話留三分→13條分寸處世法則", ["今天讀到13條處世法則，句句扎心，看完果斷收藏：", "1️⃣ 凡事緩一緩，別急著表態", "2️⃣ 說話留三分，別把話說滿", "3️⃣ 對人真誠，但別掏心掏肺", "4️⃣ 遇事柔和，以柔克剛", "5️⃣ 多觀察少發言，看清局勢再行動", "6️⃣ 保持和氣，別輕易得罪人", "7️⃣ 能容人處且容人，格局大一點", "8️⃣ 保持謙卑，別鋒芒畢露", "9️⃣ 心態要穩，遇事不慌", "🔟 知禮守節，把握好分寸", "1️⃣1️⃣ 藏好底牌，別讓人看透", "1️⃣2️⃣ 進退有度，不越界", "1️⃣3️⃣ 修心悟道，通透自圓融", "說白了，處世的最高境界就六個字：拿捏好分寸。", "緩一步，留餘地；存真誠，換真心；守柔和，化干戈；多觀察，知進退；修心性，拓格局。", "正如左宗棠那句話：\"發上等願，結中等緣，享下等福；擇高處立，尋平處住，向寬處行。\"", "你認同哪條法則？評論區聊聊👇#生存法則 #為人處事思維格局 #為人處世的方法 #為人處事圓滑 #學點心裡學 #拓展人際關係 #提升人際關係 #提升人格魅力 #提升自我意識 #個人成長提升", "5月4日"], [["哲學命題", "真正厲害的人，|把分寸刻進骨子裡。", 1], ["哲學命題", "說白了，處世的最高境界就六個字：拿捏好分寸。", 0], ["排比句", "凡事緩一緩，|說話留三分，|真誠但不掏心。", 1], ["對比句", "強勢的人樹敵，|有分寸的人聚人。", 1], ["反問句", "你說話，|留餘地了嗎？", 1], ["情境衝突", "把話說滿，|最後收不回來。", 1], ["認知翻轉", "分寸，|是最高階的處世。", 1], ["層層遞進", "先緩一緩，再留三分，|最後以柔克剛。", 1], ["詩性收束", "有分寸的人，|走到哪都受歡迎。", 1], ["詩性收束", "正如左宗棠那句話：發上等願，結中等緣，享下等福；|擇高處立，尋平處住，向寬處行。", 0]]], [127, "做了8年市場分析，我見過太多人第一步就做錯了！", "E", "宏觀環境→行業→競品…六步市場分析法", ["很多人拿到專案就急著去調研競品，結果呢？方向跑偏，資料白採，還被老闆罵了一頓😤", "後來我總結出一套六步分析法，從宏觀到微觀，從分析到決策，環環相扣：", "第一步：宏觀環境剖析", "政治、經濟、社會、技術四個維度，先把大方向搞清楚", "第二步：行業態勢洞察", "市場規模、生命週期、競爭結構，搞懂你在哪個賽道", "第三步：目標市場定位", "使用者畫像、需求分析、細分市場，找準你的目標客戶", "第四步：競爭分析", "識別對手、調研特徵、評估優劣勢，知己知彼百戰不殆", "第五步：商業模式構建", "資源成本、產業價值、渠道通路，想清楚怎麼賺錢", "第六步：結論分析", "機會威脅、戰略調整、結論評估，形成可執行的方案", "核心就一句話：從宏觀到微觀，從分析到決策，六步閉環。", "這套方法幫我避開了至少3次重大決策失誤。你做市場分析有沒有什麼心得？踩過哪些坑？#文化數字化 #設計思路和理念 #視覺化設計 #品牌定位 #價值觀排序 #文化影響力 #策略與智慧 #企業文化價值觀 #企業戰略定位 #行業分析", "5月4日"], [["哲學命題", "分析，|第一步不能錯。", 1], ["哲學命題", "市場規模、生命週期、競爭結構，搞懂你在哪個賽道", 0], ["哲學命題", "方向跑偏，資料白採，還被老闆罵了一頓😤", 0], ["哲學命題", "政治、經濟、社會、技術四個維度，先把大方向搞清楚", 0], ["哲學命題", "使用者畫像、需求分析、細分市場，找準你的目標客戶", 0], ["排比句", "宏觀環境，行業，|競品，使用者，自身，決策。", 1], ["對比句", "急著調研競品的人跑偏，|從宏觀開始的人環環相扣。", 1], ["反問句", "你拿到專案，|第一步做什麼？", 1], ["反問句", "很多人拿到專案就急著去調研競品，結果呢？", 0], ["反問句", "你做市場分析有沒有什麼心得？", 0], ["情境衝突", "資料白採，|還被老闆罵了一頓。", 1], ["認知翻轉", "方向對了，|資料才有用。", 1], ["層層遞進", "先看宏觀，再看行業，|最後做決策。", 1], ["層層遞進", "後來我總結出一套六步分析法，|從宏觀到微觀，從分析到決策，環環相扣", 0], ["層層遞進", "核心就一句話：從宏觀到微觀，從分析到決策，六步閉環。", 0], ["詩性收束", "從大到小，|每一步都踩在點上。", 1], ["詩性收束", "資源成本、產業價值、渠道通路，想清楚怎麼賺錢", 0], ["詩性收束", "機會威脅、戰略調整、結論評估，形成可執行的方案", 0], ["詩性收束", "這套方法幫我避開了至少3次重大決策失誤。", 0]]], [128, "當了8年管理，我發現帶團隊其實就10個字：", "A", "先管自己（律、聽…5字）→再管團隊→10字管理口訣", ["先管自己，再管團隊。", "自己做不到的，別指望團隊能做到。", "分享一套壓箱底的管理口訣，收藏起來慢慢看：", "一、先管自己（5條）", "1. 律 — 注重自律", "管理者先控制自己、以身作則才能服眾", "2. 聽 — 學會傾聽", "冷靜傾聽刺耳話、警惕奉承之言。聽真話才能做對決策", "3. 思 — 懂得覆盤", "經常回顧總結、從錯誤中提煉經驗。不復盤的管理者，永遠在原地打轉", "4. 導 — 明確導向", "給團隊方向和目標。方向不清，團隊必散", "5. 勵 — 做好激勵", "用認可和獎勵激發動力。會激勵的領導，帶出來的隊伍嗷嗷叫", "二、再管團隊（5條）", "1. 盯 — 時時緊盯", "緊盯工作確保完成。不盯=不重視，員工就會鬆懈", "2. 練 — 鍛鍊能力", "給下屬機會歷練。不給機會練，永遠出不了將", "3. 逼 — 挖掘潛力", "適當施壓讓人突破舒適區。優秀都是逼出來的", "4. 想 — 勤于思考", "提前預判風險。管理者不想，團隊就要遭殃", "5. 批 — 批評藉口", "對推諉行為零容忍。藉口多了，執行力就死了", "你做到了幾條？評論區說說👇", "#打造高效團隊 #領導力 #自我管理意識 #增強工作能力 #提升管理能力 #領導力發展 #團隊管理 #管理思維 #提高團隊凝聚力 #職場向上管理秘籍", "5月3日"], [["哲學命題", "帶團隊，|就十個字。", 1], ["哲學命題", "自己做不到的，別指望團隊能做到。", 0], ["哲學命題", "冷靜傾聽刺耳話、警惕奉承之言。", 0], ["哲學命題", "經常回顧總結、從錯誤中提煉經驗。", 0], ["排比句", "先管自己，|再管團隊。", 1], ["對比句", "自己做不到的，|別指望團隊做到。", 1], ["反問句", "你要求團隊做的，|自己做到了嗎？", 1], ["情境衝突", "要求下屬準時，|自己卻天天遲到。", 1], ["認知翻轉", "以身作則，|是管理的根本。", 1], ["層層遞進", "先律己，再聽人，|最後帶團隊。", 1], ["層層遞進", "先管自己，再管團隊。", 0], ["詩性收束", "管好自己，|團隊就跟上了。", 1], ["詩性收束", "用認可和獎勵激發動力。", 0], ["詩性收束", "適當施壓讓人突破舒適區。", 0]]], [129, "為什麼你明明很努力，結果卻總是不盡人意？", "F", "先計劃再行動、先求同再求異→8條做事的正確順序", ["不是能力不行，可能是你把順序搞反了。", "看看這8條顛覆認知的做事法則：", "1️⃣ 做事：先計劃，再行動", "→ 很多人上來就開幹，結果三天打魚兩天曬網", "2️⃣ 溝通：先求同，再求異", "→ 一開口就反駁，對方直接關掉耳朵", "3️⃣ 成長：先紮根，再結果", "→ 總想彎道超車的人，往往翻車最快", "4️⃣ 改變：先認知，再行動", "→ 認知沒到位，行動就是蠻幹", "5️⃣ 情緒：先處理情緒，再處理事情", "→ 帶著情緒做決策，決策全是錯的", "6️⃣ 共情：先理解，再建議", "→ 上來就給方案，對方只想要被看見", "7️⃣ 執行：先完成，再完美", "→ 追求完美的人，90%連完成都做不到", "8️⃣ 感情：先愛己，再愛人", "→ 卑微到塵埃裡，開不出花來", "扎心嗎？做事順序對了，結果自然對。順序反了，努力白費。", "順序不對，努力白費。", "你覺得自己最容易把哪條順序搞反？評論區聊聊👇", "#提升格局改變思維 #開啟思維格局 #認知格局覺醒 #提升認知能力 #突破思維侷限 #學習的格局 #個人能力提升 #人生掌控力 #認知覺醒掌控人生 #格局決定高度", "5月3日"], [["哲學命題", "你努力了，|結果不如意，可能是順序反了。", 1], ["哲學命題", "不是能力不行，可能是你把順序搞反了。", 0], ["哲學命題", "順序反了，努力白費。", 0], ["哲學命題", "順序不對，努力白費。", 0], ["排比句", "先計劃再行動，|先求同再求異，|先付出再收穫。", 1], ["對比句", "亂了順序的人三天打魚，|對了順序的人一路向前。", 1], ["反問句", "你做事，|順序對了嗎？", 1], ["反問句", "你覺得自己最容易把哪條順序搞反？", 0], ["情境衝突", "一上來就開幹，|三天打魚兩天曬網。", 1], ["情境衝突", "很多人上來就開幹，結果三天打魚兩天曬網", 0], ["情境衝突", "做事順序對了，結果自然對。", 0], ["認知翻轉", "不是能力不行，|是順序搞反了。", 1], ["層層遞進", "先計劃，再行動，|最後收穫。", 1], ["詩性收束", "順序對了，|一切都對了。", 1]]], [130, "扎心了！看完這個\"學習九層樓\"，我發現自己一直住在一樓……", "F", "接觸→瀏覽→記憶→理解→搭體系…學習九層樓", ["原來學習不只是\"看書\"那麼簡單，它分了九個層次：", "第一層\"接觸\"，隨手翻翻看兩眼就走；", "第二層\"瀏覽\"，大概看了一遍知道講什麼；", "第三層\"記憶\"，能記住關鍵概念；", "第四層\"理解\"，能用自己的話解釋；", "第五層\"搭建體系\"，把零散知識連成網路；", "第六層\"應用\"，能用到實際問題中；", "第七層\"思辨\"，能發現其中的侷限；", "第八層\"創新\"，能提出新觀點；", "第九層\"內化\"，變成自己的思維方式，不知不覺就用上了。", "扎心的是，很多人（包括以前的我）一直停在第二層，覺得\"看過=學會\"。", "真正的高手，都在第六層以上——他們不只是學知識，更是把知識變成能力。", "你目前在哪一層？歡迎對號入座👇", "#我的學習進化論 #搭建個人知識體系 #思維模型 #系統性思維 #自我覺察和探索 #自我覺察力 #自我探索自我覺察 #目標導向思維 #潛意識探索 #研究的方法", "5月3日"], [["哲學命題", "學習，|有九層樓。", 1], ["哲學命題", "真正的高手，都在第六層以上——他們不只是學知識，|更是把知識變成能力。", 0], ["哲學命題", "\"內化\"，變成自己的思維方式，不知不覺就用上了。", 0], ["排比句", "接觸，瀏覽，記憶，|理解，搭建體系，輸出。", 1], ["對比句", "住在一樓的人以為在學習，|住在九樓的人在創造。", 1], ["反問句", "你的學習，|住在第幾層？", 1], ["情境衝突", "看了很多書，|卻一直住在一樓。", 1], ["認知翻轉", "學習不只是看書，|它有九個層次。", 1], ["認知翻轉", "原來學習不只是\"看書\"那麼簡單，它分了九個層次", 0], ["認知翻轉", "扎心的是，很多人（包括以前的我）一直停在第二層，|覺得\"看過=學會\"。", 0], ["層層遞進", "先接觸，再理解，|最後創新。", 1], ["詩性收束", "一層一層往上爬，|風景越來越好。", 1]]], [131, "老祖宗留下的這12條人生守則，我35歲才真正讀懂！", "C", "父母條件就是命…老祖宗12條人生守則逐條解讀", ["小時候總覺得\"一命二運三風水\"是迷信，是老一輩人用來算命的。直到這些年經歷了太多事，才恍然大悟——這哪是算命？分明是老祖宗幾千年總結出來的人生智慧啊！", "來，我逐條給你解讀：", "\"父母條件就是命\" —— 有人含著金湯匙出生，有人在泥地裡摸爬滾打。原生家庭給的起點，確實不一樣。但這不代表終點。", "\"時代經濟就是運\" —— 80年代下海、00年買房、10年做網際網路……順週期的人豬都能飛，逆週期的再努力也吃力。個人的努力在時代浪潮面前，真的很渺小。", "\"所處環境就是風水\" —— 孟母三遷不是傻，是真懂。圈子決定眼界，環境塑造思維。", "後面還有9條，每一條都是至理名言：", "四積功德五讀書，六名七相八敬神，九交貴人十養生，十一擇業擇偶，十二趨吉避凶。", "老祖宗用最樸素的語言，把人一輩子的變數都說透了。讀書改變認知，交友改變圈子，養生決定續航……", "你發現沒有？這12條裡，沒有一條是抱怨出身的，全是教你如何在現有條件下做得更好。", "所以別再說\"我命不好\"了。命是爹媽給的，運是自己造的。", "評論區說說，這12條裡，你最認同哪一條？👇#人的命運天註定 #國學傳承 #易學智慧改變人生 #人生的使命 #選擇決定命運 #知識決定命運 #生命的準則 #國學智慧 #人生的方向 #國學知識", "5月3日"], [["哲學命題", "一命二運三風水，|不是迷信。", 1], ["哲學命題", "小時候總覺得\"一命二運三風水\"是迷信，|是老一輩人用來算命的。", 0], ["哲學命題", "分明是老祖宗幾千年總結出來的人生智慧啊！", 0], ["哲學命題", "父母條件就是命——有人含著金湯匙出生，|有人在泥地裡摸爬滾打。", 0], ["哲學命題", "原生家庭給的起點，確實不一樣。", 0], ["排比句", "父母條件是命，|學習是運，|環境是風水。", 1], ["對比句", "當成算命的人看不懂，|當成智慧的人受益。", 1], ["反問句", "這十二條守則，|你讀懂了嗎？", 1], ["反問句", "直到這些年經歷了太多事，才恍然大悟——這哪是算命？", 0], ["情境衝突", "小時候覺得是迷信，|長大了才懂是智慧。", 1], ["認知翻轉", "老祖宗的話，|是幾千年的總結。", 1], ["層層遞進", "先懂命，再改運，|最後轉風水。", 1], ["詩性收束", "讀懂了，|命就在自己手裡。", 1], ["詩性收束", "這12條裡，沒有一條是抱怨出身的，|全是教你如何在現有條件下做得更好。", 0], ["詩性收束", "所以別再說\"我命不好\"了。", 0], ["詩性收束", "命是爹媽給的，運是自己造的。", 0]]], [132, "活了35年，今天才整理出這12條人生守則，每一條都是用教訓換來的！", "F", "做事、做人、理財分項立規→12條自我人生守則", ["30歲之前，我活得稀裡糊塗：做事沒計劃、做人沒底線、理財全靠感覺。結果呢？工作頻繁換、朋友越來越少、存款永遠見底💔", "後來痛定思痛，總結了這份人生守則：", "做事：有計劃、有目標、不拖拉、不敷衍", "做人：懂感恩、知尊重、守誠信、有擔當", "學習：多思考、勤總結、能堅持、善創新", "健康：常鍛鍊、保睡眠、慎飲食、重衛生", "心態：要樂觀、能抗壓、不自卑、不自傲", "社交：會傾聽、善分享、懂包容、守邊界", "理財：明收支、懂儲蓄、慎消費、善規劃", "家庭：多關心、常陪伴、互尊重、共成長", "目標：早規劃、常修正、分階段、可達成", "溝通：講禮貌、有條理、表意清、會傾聽", "規則：明底線、守規矩、不逾矩、有敬畏", "情緒：能覺察、善調控、不衝動、常平和", "寫下來才發現，原來我踩過的每一個坑，都是因為少了一條守則。", "你們還知道哪些人生守則是用教訓換來的？評論區說說👇#一人定律 #人生關鍵詞 #人生的起跑線 #人生四個階段 #人生必修課 #人生不同階段 #人生奮鬥目標 #生命密碼 #瞭解自己 #人生三重境界", "5月3日"], [["哲學命題", "人生守則，|是用教訓換來的。", 1], ["哲學命題", "歲之前，我活得稀裡糊塗：做事沒計劃、做人沒底線、理財全靠感覺。", 0], ["排比句", "做事有計劃，|做人懂感恩，|理財有紀律。", 1], ["對比句", "稀里糊塗的人工作頻換，|有守則的人一路向上。", 1], ["反問句", "你的人生，|有守則嗎？", 1], ["反問句", "你們還知道哪些人生守則是用教訓換來的？", 0], ["情境衝突", "做事沒計劃，做人沒底線，|存款永遠見底。", 1], ["情境衝突", "工作頻繁換、朋友越來越少、存款永遠見底💔", 0], ["認知翻轉", "痛定思痛，|才有守則。", 1], ["認知翻轉", "寫下來才發現，原來我踩過的每一個坑，|都是因為少了一條守則。", 0], ["層層遞進", "先定規則，再踐行，|最後成習慣。", 1], ["詩性收束", "守則在，|人生就不會亂。", 1]]], [133, "活了30年，今天才知道富人和窮人想的東西根本不是一回事！", "E", "富人研究戰略政策、窮人操心打工→財富思維對比圖", ["看完一張思維對比圖，我整個人都愣住了。", "富人每天在研究什麼？戰略、國家政策、行業前景、商業模式、資源整合、投資金融、股權法律……還有人性——策略、馭人術、格局、破局、反脆弱。", "窮人每天在操心什麼？打工、送外賣、擺攤、學技術、開車、開店、調休、補貼……還有技能——考證、話術、手藝、短期回報、股票、債務。", "扎心嗎？我第一反應是覺得扎心。", "但仔細想想，這不是在貶低誰，而是兩種完全不同的人生劇本在同時上演。", "窮人把時間賣給出勤卡，富人把時間用在佈局上。窮人研究怎麼把一件事做好，富人研究怎麼讓一群人把事做好。窮人看眼前三步，富人看行業十年。", "我不是要製造焦慮，我只是覺得：思維決定選擇，選擇決定命運。", "你覺得呢？你現在是在\"窮人思維\"裡打轉，還是已經在往\"富人思維\"靠近了？", "#窮人與富人的區別 #如何擺脫貧窮 #富人和窮人的區別 #認知決定財富 #富人與窮人 #財富思維 #富人 #財富思維改變認知 #有錢人的思維 #怎樣變得富有", "May 1"], [["哲學命題", "富人和窮人，|想的根本不是一回事。", 1], ["哲學命題", "我不是要製造焦慮，我只是覺得：思維決定選擇，|選擇決定命運。", 0], ["哲學命題", "看完一張思維對比圖，我整個人都愣住了。", 0], ["哲學命題", "戰略、國家政策、行業前景、商業模式、資源整合、投資金融、股權法律…", 0], ["哲學命題", "還有人性——策略、馭人術、格局、破局、反脆弱。", 0], ["排比句", "富人研究戰略，|研究政策，|研究人性。", 1], ["對比句", "窮人操心打工，|富人研究模式。", 1], ["對比句", "但仔細想想，這不是在貶低誰，|而是兩種完全不同的人生劇本在同時上演 接納不完美的自己。", "現在我終於明白，人這輩子最重要的事，不是見多少世面，而是學會和自己和解。你們說呢？#美文美句 #古文的魅力 #分享好句 #好句 #修身養性陶冶情操 #腹有詩書氣 #腹有書詩氣自華 #美句摘抄 #用文字啟迪心靈智慧 #腹有詩書自芳華", "5月2日"], [["哲學命題", "見天地，|才知道自己的渺小。", 1], ["哲學命題", "見眾生，才學會真正的寬容。", 0], ["哲學命題", "見自己，才找到真正的歸宿。", 0], ["哲學命題", "見天地，才知道自己的渺小。", 0], ["排比句", "見天地知渺小，|見眾生學慈悲，|見自己得自在。", 1], ["排比句", "見過外賣小哥在暴雨裡狂奔，見過凌晨3點還在擺攤的老人，|見過衣著光鮮的人背後也有不為人知的苦。", 0], ["對比句", "自以為了不起的人栽跟頭，|知道渺小的人心裡踏實。", 1], ["對比句", "想明白這點，反而心裡踏實了，不再為一點小事跟人較勁。", 0], ["對比句", "現在我終於明白，人這輩子最重要的事，|不是見多少世面，而是學會和自己和解。", 0], ["反問句", "站在海邊看日出時，|你的焦慮還在嗎？", 1], ["情境衝突", "年輕時覺得別人都不行，|吃了虧才明白。", 1], ["認知翻轉", "天大地大，|人只是一粒塵埃。", 1], ["認知翻轉", "走了半生才懂：唯有平視，|才能看清腳下的路，也才能接納不完美的自己。", 0], ["層層遞進", "先見天地，再見眾生，|最後見自己。", 1], ["詩性收束", "看見了渺小，|就不再為小事較勁。", 1], ["詩性收束", "天大地大，人只是一粒塵埃。", 0], ["詩性收束", "你不再輕易評價誰，因為你知道，每個人都有自己的難處。", 0], ["詩性收束", "年輕時低頭走路，總覺得自己不夠好；|抬頭看別人，又覺得自己太差。", 0]]], [136, "活了30年，今天才知道這8句老話被誤傳了！", "C", "「貧養兒子富養女」等8句被誤傳的老話", ["我一直拿這些俗語當人生信條，結果今天刷到一個帖子，直接把我看懵了——", "比如\"窮養兒子富養女\"，原話根本不是這意思！原文是\"貧養兒子富養女\"，\"貧\"和\"窮\"意思完全不同。\"貧\"是指在物質上刻意剋扣，讓孩子學會吃苦；而\"窮\"是走投無路的意思。你品品，這差距有多大？", "還有\"男戴觀音女戴佛\"，完全是商家編出來的營銷話術！原話是\"男戴官印女戴佛\"，圖的是個吉利寓意，跟觀音菩薩和佛祖沒半毛錢關係😅", "最離譜的是\"量小非君子，無毒不丈夫\"——人家原話是\"無度不丈夫\"，這個\"度\"是氣度的意思！結果不知道哪個缺德的，把\"度\"改成了\"毒\"，害得多少人心甘情願當狠人……", "還有\"女子無才便是德\"，我查了半天，真正的出處早已失傳，但很多人認為這是清朝才被人故意扭曲的。", "所以啊，老話不一定都對，傳著傳著就變味了。你們還知道哪些被篡改的俗語？評論區扒一扒#古人智慧 #古代傳統文化 #國學裡的迴響 #老祖宗的智慧 #細品古人的智慧 #格局炸裂的千古名句 #古文 #謀略古人的智慧 #古文的魅力 #國學傳承", "5月2日"], [["哲學命題", "有些老話，|被誤傳了。", 1], ["哲學命題", "還有\"女子無才便是德\"，我查了半天，|真正的出處早已失傳，但很多人認為這是清朝才被人故意扭曲的。", 0], ["哲學命題", "比如\"窮養兒子富養女\"，原話根本不是這意思！", 0], ["哲學命題", "原文是\"貧養兒子富養女\"，|\"貧\"和\"窮\"意思完全不同。", 0], ["哲學命題", "貧是指在物質上刻意剋扣，讓孩子學會吃苦；|而窮是走投無路的意思。", 0], ["排比句", "貧養兒子富養女，|不是窮養，|是刻意磨練。", 1], ["對比句", "誤傳的話誤人一生，|讀懂原話的人少走彎路。", 1], ["反問句", "你一直奉為信條的話，|原話是這樣嗎？", 1], ["反問句", "你品品，這差距有多大？", 0], ["反問句", "你們還知道哪些被篡改的俗語？", 0], ["情境衝突", "拿著俗語當人生信條，|結果發現被誤傳了。", 1], ["情境衝突", "我一直拿這些俗語當人生信條，|結果今天刷到一個帖子，直接把我看懵了——", 0], ["情境衝突", "結果不知道哪個缺德的，把\"度\"改成了\"毒\"，|害得多少人心甘情願當狠人…", 0], ["認知翻轉", "一字之差，|意思完全不同。", 1], ["層層遞進", "先查原話，再理解，|最後踐行 其中", "13.精誠所至，金石為開", "14.鞠躬盡瘁，死而後已", "15.君子之交，淡如水", "你最認同哪一句？或者還有哪些你特別喜歡的人生格言？評論區聊聊#格局炸裂的千古名句 #國學經典 #弘揚中華傳統文 #傳承中華文化 #國學知識 #中華傳統文化 #弘揚國學經典文化 #謀略古人的智慧 #古人智慧 #中國文字的魅力", "5月1日"], [["哲學命題", "八字成語，|句句是人生大智慧。", 1], ["哲學命題", "小時候背成語，只覺得朗朗上口。", 0], ["哲學命題", "看人看事，真的不能只看表面。", 0], ["哲學命題", "反而是幾個平時不聯絡的知己，關鍵時刻二話不說就幫忙。", 0], ["排比句", "尺有所短，寸有所長；|失之東隅，收之桑榆。", 1], ["對比句", "小看別人的人吃虧，|懂得長短的人受益。", 1], ["反問句", "你小看過的那個同事，|後來怎麼樣了？", 1], ["反問句", "或者還有哪些你特別喜歡的人生格言？", 0], ["情境衝突", "總覺得同事不如自己，|後來才發現他是銷售高手。", 1], ["情境衝突", "比如\"兼聽則明，偏信則闇\"——上次買房子沒聽老婆勸，|結果多花了十幾萬😭事實證明，枕邊風有時真得聽。", 0], ["認知翻轉", "小時候背的成語，|全是人生真諦。", 1], ["認知翻轉", "直到三十歲後踩了無數坑，|才發現小時候背的那些話，全是人生真諦。", 0], ["認知翻轉", "比如\"尺有所短，寸有所長\"——剛工作時總覺得同事小張不如自己，|後來才發現人家做銷售是一把好手，而我連Excel都玩不轉。", 0], ["認知翻轉", "最戳我的是\"君子之交，淡如水\"——人到中年才發現，|那些酒肉朋友真遇到事跑得比誰都快。", 0], ["層層遞進", "先背，再懂，|最後用。", 1], ["詩性收束", "一句成語，|一段人生。", 1], ["詩性收束", "還有\"金玉其外，敗絮其中\"——我有個朋友開公司，|表面光鮮亮麗，實際上早就入不敷出了。", 0]]], [139, "你有沒有發現，身邊有些人好像突然就變厲害了？", "F", "不躲人、多掙錢、多運動…真正變強的9件事", ["我觀察了很久，發現真正變強的人，都悄悄做到了這9件事👇", "1. 不躲人", "越害怕社交越要逼自己走出去。我以前見人就緊張，後來硬著頭皮參加各種聚會，現在發現：自信真的是練出來的。", "2. 多掙錢", "錢不是萬能，但錢能給你底氣。當你不用為生活費發愁時，說話都硬氣三分。", "3. 積人脈", "別等到需要幫忙才想起聯絡人。平時多走動，關鍵時刻才有人拉你一把。", "4. 清目的", "每天列清單的人效率高3倍。目標清晰的人，根本沒時間內耗。", "5. 會保密", "有些人就是管不住嘴。記住了：嘴巴不嚴的人，走到哪裡都不被信任。", "6. 會繞路", "直路走不通就繞一下。死磕的人最傻，聰明人都在找捷徑。", "7. 會斟酌", "做事之前多想三步。衝動決策的人，十有八九會後悔。", "8. 會警惕", "防人之心不可無。別人對你太好時，先想想為什麼。", "9. 重視有價值的東西", "把時間花在刀刃上。遠離消耗你的人和事，聚焦能讓你成長的地方。", "看完這9條，你做到了幾條？我先坦白：第5條我以前經常踩坑😭", "#社交的本質 #創造自己的價值 #自我價值的實現 #圈子決定命運 #認知升級突破自我 #突破圈層提升自己 #格局和眼界  #財富的本質 #關注內心拒絕無用社交", "5月1日"], [["哲學命題", "真正變強的人，|都悄悄做了這九件事。", 1], ["哲學命題", "有些人就是管不住嘴。", 0], ["哲學命題", "我觀察了很久，發現真正變強的人，|都悄悄做到了這9件事👇", 0], ["哲學命題", "錢不是萬能，但錢能給你底氣。", 0], ["哲學命題", "當你不用為生活費發愁時，說話都硬氣三分。", 0], ["排比句", "不躲人，多掙錢，|多運動，多讀書。", 1], ["對比句", "害怕社交的人原地，|逼自己走出去的人變強。", 1], ["反問句", "你身邊突然變厲害的人，|做了什麼？", 1], ["反問句", "看完這9條，你做到了幾條？", 0], ["情境衝突", "見人就緊張，|硬著頭皮參加聚會後自信了。", 1], ["情境衝突", "越害怕社交越要逼自己走出去。", 0], ["認知翻轉", "自信，|是練出來的。", 1], ["認知翻轉", "我以前見人就緊張，後來硬著頭皮參加各種聚會，|現在發現：自信真的是練出來的。", 0], ["層層遞進"  "3. 創意內容類 適合有表達欲、有審美、會觀察人、能持續輸出的人。 比如AIGC內容策劃、AI影片創作者、品牌創意策略師、UI/UX設計師、知識產品設計師。", "AI不會消滅真正的創意。 它會淘汰粗糙重複的內容，但會放大有觀點、有審美、有情緒感知的人。", "4. 產業升級類 適合願意進入真實行業、解決具體問題的人。 比如智慧製造工程師、供應鏈最佳化分析師、新能源工程師、可持續發展顧問。", "很多穩定機會，不一定在最熱鬧的網際網路裡， 而是在製造、能源、供應鏈、醫療這些長期賽道里。", "5. 高信任服務類 適合有專業判斷、能建立信任、願意長期積累的人。 比如醫療資料分析師、網路安全與隱私合規專家、數字健康產品經理、心理健康科技相關崗位。", "越是AI時代，人越需要可信任的人。 因為工具能生成答案，但不一定能承擔責任。", "所以我越來越覺得： 選職業，不要只看哪裡熱，而要看哪裡長期適合你。", "AI時代最可怕的不是被替代， 而是一直在不適合自己的地方硬耗。", "先認識自己，再決定怎麼努力。 這件事，真的會改變很多人的職業命運。", "#職業規劃  #大學生職業規劃 #職場成長 #自我提升 #認知提升 #普通人逆襲 #找工作 #職業方向 #個人成長", "6月10日"], [["哲學命題", "AI時代，|真正值錢的是你的優勢。", 1], ["哲學命題", "不會消滅真正的創意。", 0], ["哲學命題", "這件事，真的會改變很多人的職業命運。", 0], ["哲學命題", "我發現，很多人一聽到AI，就會陷入兩種極端", 0], ["哲學命題", "一種是焦慮：覺得所有工作都要被替代，|自己再努力也沒用。", 0], ["排比句", "技術研發，商業增長，|創意內容，高信任服務。", 1], ["排比句", "比如AI工程師、機器學習工程師、資料科學家、MLOps工程師、AI安全工程師。", 0], ["排比句", "另一種是盲目：看到什麼崗位火，|就立刻想轉AI、轉資料、轉產品、轉自媒體。", 0], ["排比句", "比如AIGC內容策劃、AI影片創作者、品牌創意策略師、UI/UX設計師、知識產品設計師。", 0], ["排比句", "比如智慧製造工程師、供應鏈最佳化分析師、新能源工程師、可持續發展顧問。", 0], ["對比句", "追熱門的人焦慮，|找優勢的人安心。", 1], ["對比句", "時代最可怕的不是被替代，|而是一直在不適合自己的地方硬耗。", 0], ["反問句", "你的優勢，|最適合被AI放大到哪裡？", 1], ["反問句", "最近很多人問我：AI時代，到底什麼工作還值得做？", 0], ["反問句", "但真正的問題不是：哪個職業最火？", 0], ["反問句", "而是：你的優勢，最適合被AI放大到哪裡？", 0], ["情境衝突", "看到什麼火，|就想轉什麼。", 1], ["情境衝突", "不是所有人都適合純技術，|但哪怕你不做工程師，技術理解力也會越來越重要。", 0], ["情境衝突", "時代最稀缺的，不只是會用工具的人，|而是能把AI真正用到業務結果裡的人。", 0], ["情境衝突", "所以我越來越覺得：選職業，|不要只看哪裡熱，而要看哪裡長期適合你。", 0], ["認知翻轉", "工具能生成答案，|但不能承擔責任。", 1], ["層層遞進", "先認識優勢，再選賽道，|最後被AI放大。", 1], ["層層遞進", "先認識自己，再決定怎麼努力。", 0], ["詩性收束", "選職業不看哪裡熱，|看哪裡長期適合你。", 1], ["詩性收束", "比如醫療資料分析師、網路安全與隱私合規專家、數字健康產品經理、心理健康科技相關崗位。", 0], ["詩性收束", "越是AI時代，人越需要可信任的人。", 0], ["詩性收束", "因為工具能生成答案，但不一定能承擔責任。", 0]]], [8, "花一個晚上，把自己梳理清楚", "A", "白天很忙晚上很空→花一個晚上梳理→離自己近一點", ["你覺得你離自己近，還是遠？", "有段時間我發現，很多人不是不努力，也不是不清醒。 只是每天都在處理訊息、任務、關係、焦慮、選擇…… 時間久了，人會慢慢變成一種狀態：", "白天很忙，晚上很空。 看了很多內容，卻越來越不知道自己想要什麼。 做了很多事情，卻不知道哪一件真的屬於自己。", "所以這期想做一個很簡單的主題： 花一個晚上，把自己梳理清楚。", "不需要很複雜。 也不用逼自己立刻找到人生答案。 你只需要拿一張紙，一支筆，找一個安靜的晚上，誠實地問自己幾個問題。", "先把情緒放下來： 我最近到底在煩什麼？ 我真正害怕的是什麼？ 我一直在硬撐什麼？   let h = "";
  if(accs.length===1){ const a=accs[0];
    h += `<button class="chip ${!st.cat?"on":""}" data-c="">全部欄位</button>` + keys(a).map(c=>`<button class="chip ${st.cat===c?"on":""}" data-c="${c}" style="border-left:4px solid ${col(a,c)[0]}">${esc(a.cats[c][0])}</button>`).join("");
  }
  $("#chips").innerHTML = h;
}
$("#chips").onclick = e => { const b=e.target.closest(".chip"); if(!b) return;
  if("c" in b.dataset){ st.cat=b.dataset.c||null; st.art=0; } if("t" in b.dataset) st.tech=b.dataset.t||null; render(); };

function card(a, x, id, q){ // x = [技法, 文字, 1創作/0原文]
  const [t, txt, g] = x; const [c1,c2]=col(a, x.cat);
  return `<div class="card"><div class="img" style="--c:${c1};--c2:${c2}"><p>${txt.split("|").map(s=>hl(s,q)).join("<br>")}</p><div class="s"><span>${esc(a.cats[x.cat][0])}</span><span>${esc(a.name)}</span></div></div>
  <div class="act"><button data-cp="${id}">複製</button><button data-dl="${id}">下載圖</button></div></div>`;
}
const REG = {}, POSTS = {}; let rid = 0;
// 圖卡只放金句：自己寫的全收；原文句只收短句、無冒號、無數字清單
const isQuote = x => x[2] || (() => { const s = x[1].replace(/\|/g,""); return s.length >= 10 && s.length <= 30 && !/[\u{1F300}-\u{1FAFF}☀-➿]/u.test(s) && /[。！？!?…]$/.test(s) && !/[：:＝=→“”"（(]/.test(s) && !/\d/.test(s) && (s.match(/、/g)||[]).length < 2
  && !/^(而|但|更|不然|其實|可以|你就|剩餘|所以|因為|並|還|也|就|才|讓我們|這|那|它|他們|比如|例如|同時|另外|然後|最後|首先)/.test(s)
  && !/[圖\/]|這篇|這組|分享|整理|收藏|方法|步驟|小妙招/.test(s); })();
// 臉書貼文：用本篇的創作句串成一篇文，不出現任何技法名稱
const POST_ORDER = ["情境衝突","反問句","認知翻轉","哲學命題","對比句","排比句","層層遞進","詩性收束"];
function postText(a, r){
  const own = {}; r[5].forEach(x=>{ if(x[2] && !own[x[0]]) own[x[0]] = x[1].split("|").join("\n"); });
  const head = r[1].length <= 32 ? r[1].replace(/^[^一-鿿A-Za-z0-9「]+/,"") : "";
  const body = [own["情境衝突"], own["反問句"], own["認知翻轉"], own["哲學命題"], own["對比句"], own["排比句"], own["層層遞進"], own["詩性收束"]].filter(Boolean);
  const tags = ["#"+a.name.replace(/\s/g,""), "#"+a.cats[r[2]][0], "#人間清醒", "#自我成長"].join(" ");
  return [head ? "【"+head+"】" : "", ...body, tags].filter(Boolean).join("\n\n");
}
function reg(a, x, cat){ const id = "c"+(rid++); REG[id] = {a, t:x[0], txt:x[1], cat}; return id; }

function fw(a){
  const cnt = c => a.rows.filter(r=>r[2]===c).length;
  return `<div class="core">${esc(a.core)}<small>${esc(a.name)}｜${esc(a.sub)}｜${a.rows.length} 篇 → ${keys(a).length} 大欄位</small></div><div class="down">▼</div>
  <div class="fw">${keys(a).map(c=>{const [n,p,m,r]=a.cats[c];
    return `<div class="col" style="--c:${col(a,c)[0]}"><h3>${esc(n)}<span>${cnt(c)} 篇</span></h3>
      <div class="step"><b>起點・痛點</b>${esc(p)}</div><div class="arr">▼</div>
      <div class="step mid"><b>核心機制</b>${esc(m)}</div><div class="arr">▼</div>
      <div class="step"><b>結果・轉化</b>${esc(r)}</div></div>`}).join("")}</div>`;
}

function reader(a, q){
  const list = a.rows.filter(r=>(!st.cat||r[2]===st.cat) && (!q || rowText(a,r).includes(q)));
  if(!list.length){
    const other = DATA.map((b,i)=>[b,i,b.rows.filter(r=>!q||rowText(b,r).includes(q)).length]).filter(x=>x[0]!==a&&x[2]);
    return `<div class="empty">這個帳號沒有符合的篇章${other.length?"，其他帳號有：<br><br>"+other.map(([b,i,n])=>`<button class="tab" data-i="${i}">${esc(b.name)}（${n} 篇）</button>`).join(" "):""}</div>`;
  }
  if(!list.some(r=>r[0]===st.art)) st.art = list[0][0];
  const r = a.rows[st.art-1], i = list.indexOf(r);
  const [c1] = col(a, r[2]); const cat = a.cats[r[2]];
  const steps = r[3].split("→").map(s=>s.trim()).filter(Boolean);
  const lab = (k,n) => k===0 ? "起點" : k===n-1 ? "結果" : "機制 "+k;
  const qs = r[5].filter(isQuote);
  let h = `<div class="rd"><div class="list">${list.map(x=>`<button class="li ${x[0]===st.art?"on":""}" data-a="${x[0]}"><small>${x[0]}.</small>${hl(x[1].length>40?x[1].slice(0,40)+"…":x[1],q)}</button>`).join("")}</div><div class="art">`;
  h += `<div class="ah"><span class="tag" style="--c:${c1}">${esc(cat[0])}</span> <span class="acc">第 ${r[0]} 篇／共 ${a.rows.length} 篇</span>
    <h2>${hl(r[1],q)}</h2>
    <div class="chain" style="--c:${c1}">${steps.map((s,k)=>`${k?'<span class="na">→</span>':""}<div class="node ${k===steps.length-1?"end":""}"><b>${lab(k,steps.length)}</b>${hl(s,q)}</div>`).join("")}</div>
    <div class="ctx"><span>欄位痛點：${esc(cat[1])}</span><span>欄位機制：${esc(cat[2])}</span><span>欄位結果：${esc(cat[3])}</span></div></div>`;
  const pid = "p"+r[0]; POSTS[pid] = postText(a, r);
  h += `<div class="sec"><b>臉書貼文</b><span class="acc">可直接複製貼上</span><button class="cpb" data-post="${pid}">複製整篇貼文</button></div>`;
  h += `<div class="post">${POSTS[pid].split("\n\n").map(p=>`<p>${p.split("\n").map(s=>hl(s,q)).join("<br>")}</p>`).join("")}</div>`;
  h += `<div class="sec"><b>臉書圖卡</b><span class="acc">本篇 ${qs.length} 張，可單張下載 1080×1080</span></div>`;
  h += `<div class="cards">${qs.map(x=>card(a, Object.assign([...x],{cat:r[2]}), reg(a,x,r[2]), q)).join("")}</div>`;
  h += `<div class="sec"><b>原文（繁體）</b></div><details class="orig" open><summary>${esc(r[1].slice(0,30))}…</summary>${r[4].map(p=>`<p class="${p.startsWith("#")?"h":""}">${hl(p,q)}</p>`).join("")}</details>`;
  h += `<div class="nav"><button data-go="${i>0?list[i-1][0]:""}" ${i>0?"":"disabled"}>← 上一篇</button><button data-go="${i<list.length-1?list[i+1][0]:""}" ${i<list.length-1?"":"disabled"}>下一篇 →</button></div></div></div>`;
  return h;
}

function view(){
  const q = Q(); rid = 0; for(const k in REG) delete REG[k]; for(const k in POSTS) delete POSTS[k];
  const accs = st.acc===-1 ? DATA : [DATA[st.acc]];
  chips(accs);
  let h = "";
  if(st.sub==="rd"){ h = reader(accs[0], q); }
  else if(st.sub==="fw"){
    h = accs.map(a=>fw(a)).join('<div style="height:28px"></div>') +
      `<p class="hint" style="margin-top:18px">八大金句技法：每一篇都有 8 句創作（每種技法 1 句），再加上原文裡符合技法的句子。</p><div class="tech">${Object.entries(TECH).map(([k,v])=>`<div><b>${k}</b>${v}</div>`).join("")}</div>`;
  } else if(st.sub==="q"){
    let items = [];
    accs.forEach(a=>a.quotes.forEach(x=>{ if(st.cat&&x[1]!==st.cat) return;
      if(q && !(x[2]+a.cats[x[1]][0]+a.name).includes(q)) return; items.push([a,x]); }));
    h = `<p class="hint">帳號層級的精選金句，共 ${items.length} 張。</p>` + (items.length ? `<div class="cards">${items.map(([a,x])=>card(a, Object.assign([x[0],x[2],1],{cat:x[1]}), reg(a,[x[0],x[2]],x[1]), q)).join("")}</div>` : `<div class="empty">沒有符合的金句</div>`);
  } else {
    let rows = [];
    accs.forEach(a=>a.rows.forEach(r=>{ if(st.cat&&r[2]!==st.cat) return; if(q && !rowText(a,r).includes(q)) return; rows.push([a,r]); }));
    const multi = accs.length>1;
    h = `<p class="hint">共 ${rows.length} 篇。點任一列可開啟該篇；Ctrl+P 可列印成一頁總表。</p>`;
    h += rows.length ? `<div class="tw"><table><thead><tr><th>#</th>${multi?"<th>帳號</th>":""}<th>篇名</th><th>欄位</th><th>運作機制</th></tr></thead><tbody>${rows.map(([a,r])=>
      `<tr data-open="${DATA.indexOf(a)}-${r[0]}"><td class="n">${r[0]}</td>${multi?`<td class="acc">${esc(a.name)}</td>`:""}<td class="t">${hl(r[1].length>48?r[1].slice(0,48)+"…":r[1],q)}</td><td><span class="tag" style="--c:${col(a,r[2])[0]}">${esc(a.cats[r[2]][0])}</span></td><td class="m">${hl(r[3],q).replace(/→/g,'<span class="a">→</span>')}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">沒有符合的篇章</div>`;
  }
  $("#view").innerHTML = h;
}
function render(){ tabs(); view(); }
let tmr; $("#q").addEventListener("input", ()=>{ clearTimeout(tmr); tmr=setTimeout(()=>{ if(st.sub==="fw") st.sub="rd"; if(st.sub==="rd"&&st.acc===-1) st.acc=0; render(); },200); });
$("#view").addEventListener("click", e=>{
  const tb = e.target.closest(".tab[data-i]"); if(tb){ st.acc=+tb.dataset.i; st.cat=null; st.art=0; render(); return; }
  const li = e.target.closest("[data-a]"); if(li){ st.art=+li.dataset.a; view(); window.scrollTo({top:0}); return; }
  const go = e.target.closest("[data-go]"); if(go && go.dataset.go){ st.art=+go.dataset.go; view(); window.scrollTo({top:0}); return; }
  const tr = e.target.closest("[data-open]"); if(tr){ const [ai,n]=tr.dataset.open.split("-").map(Number); st.acc=ai; st.art=n; st.sub="rd"; st.cat=null; $("#q").value=""; render(); window.scrollTo({top:0}); return; }
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.post){ const txt = POSTS[b.dataset.post];
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>toast("貼文已複製"),()=>{ prompt("複製以下文字：",txt); }); return; }
  const id = b.dataset.cp || b.dataset.dl; if(!id || !REG[id]) return; const c = REG[id];
  if(b.dataset.cp){ const txt = c.txt.split("|").join("\n");
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>toast("已複製"),()=>{ prompt("複製以下文字：",txt); });
  } else draw(c);
});
function draw(c){
  const S=1080, cv=document.createElement("canvas"); cv.width=cv.height=S; const g=cv.getContext("2d");
  const [c1,c2]=col(c.a,c.cat); const gr=g.createLinearGradient(0,0,S,S); gr.addColorStop(0,c1); gr.addColorStop(1,c2); g.fillStyle=gr; g.fillRect(0,0,S,S);
  const F='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  g.fillStyle="#fff"; const maxW=S-160; let size=64, lines;
  const wrap = sz => { g.font=`bold ${sz}px ${F}`; const out=[]; c.txt.split("|").forEach(p=>{ let l=""; for(const ch of p){ if(g.measureText(l+ch).width>maxW){ out.push(l); l=ch; } else l+=ch; } out.push(l); }); return out; };
  do { lines=wrap(size); size-=4; } while(lines.length*size*1.7>S-360 && size>32);
  size+=4; const lh=size*1.7; let y=(S-lines.length*lh)/2+size;
  g.font=`bold ${size}px ${F}`; lines.forEach(l=>{ g.fillText(l,80,y); y+=lh; });
  g.fillStyle="rgba(255,255,255,.8)"; g.font=`30px ${F}`; g.fillText(c.a.cats[c.cat][0],80,S-80);
  g.textAlign="right"; g.fillText(c.a.name,S-80,S-80);
  const link=document.createElement("a"); link.download=`${c.a.name}_${c.txt.replace(/\|/g,"").slice(0,10)}.png`; link.href=cv.toDataURL("image/png"); link.click();
}
render();
</script>
