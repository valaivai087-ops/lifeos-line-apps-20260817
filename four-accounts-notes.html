<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>四帳號金句機制總表</title>
<style>
:root{--bg:#f6f4ef;--panel:#fff;--ink:#22201c;--muted:#6f6a61;--line:#e4dfd5;--accent:#8a5a2b;--chip:#efe9dd}
@media (prefers-color-scheme:dark){:root{--bg:#17161a;--panel:#211f24;--ink:#ece8e1;--muted:#a29c92;--line:#35323a;--accent:#d9a86a;--chip:#2c2930}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:1280px;margin:0 auto}
h1{font-size:18px;margin:0;font-weight:700}
#q{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font-size:15px}
.tabs,.sub,.chips{display:flex;gap:6px;flex-wrap:wrap}
.tabs,.sub{max-width:1280px;margin:8px auto 0}
button{font:inherit;cursor:pointer}
.tab,.chip,.stab{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:14px}
.tab.on,.stab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stab{border-radius:8px}
.chip{font-size:13px;padding:2px 10px;background:var(--chip)}
.chip.on{outline:2px solid var(--accent)}
main{max-width:1280px;margin:0 auto;padding:14px 16px 40px}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px}
.core{background:var(--ink);color:var(--bg);border-radius:14px;padding:16px;text-align:center;font-size:19px;font-weight:700}
.core small{display:block;font-weight:400;font-size:13px;opacity:.75;margin-top:4px}
.down{text-align:center;color:var(--muted);font-size:18px;line-height:1;margin:6px 0}
.fw{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.col{background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:12px;padding:10px}
.col h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;gap:6px}
.col h3 span{font-size:12px;color:var(--muted);font-weight:400;white-space:nowrap}
.step{border-radius:8px;padding:7px 9px;font-size:13px;background:var(--chip)}
.step b{display:block;font-size:11px;color:var(--muted);font-weight:600}
.step.mid{background:color-mix(in srgb,var(--c) 18%,var(--panel))}
.arr{text-align:center;color:var(--c);font-size:14px;line-height:1.2}
.tech{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tech div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px;color:var(--muted)}
.tech b{display:block;color:var(--ink);font-size:14px}
/* reader */
.rd{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-height:calc(100vh - 170px);overflow:auto;position:sticky;top:150px}
.li{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);padding:8px 10px;font-size:13.5px;line-height:1.45}
.li small{color:var(--muted);margin-right:4px}
.li.on{background:var(--chip);box-shadow:inset 4px 0 var(--accent)}
.art{min-width:0}
.ah{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.ah h2{margin:6px 0 10px;font-size:19px;line-height:1.45}
.chain{display:flex;flex-wrap:wrap;align-items:stretch;gap:4px}
.node{flex:1 1 120px;background:color-mix(in srgb,var(--c) 15%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));border-radius:9px;padding:7px 9px;font-size:13.5px}
.node b{display:block;font-size:11px;color:var(--muted)}
.node.end{background:var(--c);color:#fff;border-color:var(--c)}.node.end b{color:rgba(255,255,255,.8)}
.na{align-self:center;color:var(--c);font-weight:700}
.ctx{display:flex;gap:8px;margin-top:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.ctx span{background:var(--chip);border-radius:6px;padding:2px 8px}
.sec{margin:16px 0 8px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{border-radius:12px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.img{aspect-ratio:1/1;padding:24px 20px;display:flex;flex-direction:column;justify-content:center;color:#fff;background:linear-gradient(150deg,var(--c),var(--c2));position:relative}
.img.src{background:linear-gradient(150deg,color-mix(in srgb,var(--c) 70%,#333),color-mix(in srgb,var(--c2) 80%,#111))}
.img .t{font-size:12px;opacity:.9;position:absolute;top:12px;left:16px;letter-spacing:1px}
.img .k{font-size:11px;position:absolute;top:12px;right:14px;background:rgba(255,255,255,.2);border-radius:999px;padding:0 8px}
.img p{margin:0;font-size:17px;font-weight:700;line-height:1.6;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.img .s{position:absolute;bottom:10px;left:16px;right:16px;font-size:11px;opacity:.8;display:flex;justify-content:space-between;gap:6px}
.act{display:flex;gap:6px;padding:7px}
.act button{flex:1;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:4px;font-size:13px}
.post{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;font-size:15.5px;line-height:1.9;max-width:640px}
.post p{margin:0 0 14px}.post p:last-child{color:var(--accent);margin:0}
.cpb{margin-left:auto;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:4px 12px;font-size:13px}
.orig{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:14.5px;line-height:1.85}
.orig summary{cursor:pointer;font-weight:700}
.orig p{margin:6px 0}.orig .h{color:var(--muted);font-size:13px}
.nav{display:flex;justify-content:space-between;margin-top:12px;gap:8px}
.nav button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px}
/* table */
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--chip);font-size:12.5px}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--chip)}
td.n{color:var(--muted);width:36px}
td.t{min-width:180px;max-width:300px}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;color:#fff;background:var(--c);white-space:nowrap}
.m .a{color:var(--accent);font-weight:700;padding:0 2px}
.acc{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);padding:20px;text-align:center}
mark{background:#f5d76e;color:#000;border-radius:3px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
@media print{header,.chips,.act,.hint,.list,.nav{display:none}body{background:#fff;color:#000}.rd{display:block}table{font-size:9.5px}th,td{padding:2px 4px}.tw{border:0}}
@media (max-width:760px){.rd{grid-template-columns:1fr}.list{position:static;max-height:240px}h1{font-size:16px}.img p{font-size:16px}}
</style>
</head>

</header>
<main>

況下成長最快？", "D", "無懼於未知、無愧於過往→允許發生活在當下→成長最快", ["情緒穩定的本質是無懼與無愧。無懼於未知，允許一切發生，不做過多假設；無愧過往，坦然接受已發生的，把後悔的時間用來解決問題，活在當下便好。", "當事態不利，靜為吉，心不能亂。事出有因，別和自己死磕，緩一緩、冷靜思考，從長計議更有效。記住審時度勢，事緩則圓，人緩則安，沉著冷靜方能得福。", "內耗多源於有點聰明卻不夠多，總高估自己的“觀眾”。其實在意或討厭你的人沒幾個，不必太在乎他人評價，找到自己的節奏就好。眼下得不到，要麼時機未到，要麼還不配，慢慢來總會有恰到好處的時機。", "能量高的人都不糾纏，不與是非、舊人、傷害自己的人事交集，不把能量耗在無意義的事上，不讓爛人爛事影響自己。", "生活中得罪人、做錯事不可怕，一輩子委曲求全才可怕。人生是長線，不會因某一刻毀掉。習慣取悅自己，自然會有人來取悅你。", "心態很重要，練習心態會越來越通透，告別內耗。要明白“得之我命，失之我幸”：得到的是應得的，有配得感；失去的是老天幫你避坑，坦然放下，當下擁有的就是最好的。", "想變得厲害，要學會鈍感力、遮蔽力，與自己和解，從自卑、社恐、內耗中走出。結束敏感，不被情緒左右，多講“我可以”，勇敢去做去改變，為自己活一次。", "人生本無意義，本質是體驗。萬物不為我所有，但體驗和情緒是自己的。接受平庸、不完美，允許犯錯、看錯人，帶著遺憾去體驗。人生是曠野，專注享受當下，活著就是最大意義。", "別被負面觀念、詞語圍繞，哪怕事不順，也從正面看待，比如“我現在沒能力，但終將拿下”。言語有力量，多說積極的話，會帶來更多好運。", "#個人成長 #女性成長 #身心靈和諧 #成長與智慧 #內在成長 #娜迦療癒 #自我提升 #心靈的成長 #自我成長 #內心力量提升", "8/7/2025"], [["哲學命題", "情緒穩定的本質，|是無懼與無愧。", 1], ["哲學命題", "情緒穩定的本質是無懼與無愧。", 0], ["哲學命題", "人生是長線，不會因某一刻毀掉。", 0], ["哲學命題", "人生本無意義，本質是體驗。", 0], ["哲學命題", "無懼於未知，允許一切發生，不做過多假設；|無愧過往，坦然接受已發生的，|把後悔的時間用來解決問題，活在當下便好。", 0], ["排比句", "不懼未知，不愧過往，|活在當下。", 1], ["排比句", "能量高的人都不糾纏，不與是非、舊人、傷害自己的人事交集，|不把能量耗在無意義的事上，不讓爛人爛事影響自己。", 0], ["對比句", "後悔的人困在昨天，|成長的人活在今天。", 1], ["反問句", "把後悔的時間，|拿來解決問題，好嗎？", 1], ["情境衝突", "事情不順，|還和自己死磕。", 1], ["情境衝突", "內耗多源於有點聰明卻不夠多，總高估自己的“觀眾”。", 0], ["情境衝突", "心態很重要，練習心態會越來越通透，告別內耗。", 0], ["認知翻轉", "允許一切發生，|就是成長最快的時候。", 1], ["認知翻轉", "其實在意或討厭你的人沒幾個，|不必太在乎他人評價，找到自己的節奏就好。", 0], ["層層遞進", "先靜下來，再想清楚，|最後從長計議。", 1], ["詩性收束", "心不亂，|路就不會亂。", 1], ["詩性收束", "人生是曠野，專注享受當下，活著就是最大意義。", 0], ["詩性收束", "別被負面觀念、詞語圍繞，哪怕事不順，|也從正面看待，比如“我現在沒能力，但終將拿下”。", 0], ["詩性收束", "言語有力量，多說積極的話，會帶來更多好運。", 0]]], [74, "大事要靜，急事要緩，難事要變", "D", "大事要靜、急事要緩、難事要變→三種應對之道", ["01每臨大事，先有靜氣", "“ 靜而後能安，安而後能慮，慮而後能得。”遇到大事時，越是急，越容易被情緒左右，心靜下來，反而更能看清局面。", "冷靜，能讓我們捋清思路，權衡利弊。避免被表象擾亂判斷，看清深藏在表面下的變化與走向，做出有分寸、顧全大局的決策。", "這是一份靜水深流的智慧，也是一種敢於擔責的擔當。因真正成熟的人，不是沒有情緒，而是懂得先穩住自己，再處理事情。靜下來，才有餘力見招拆招，也能在複雜局面裡留出轉園餘地。", "要相信，凡事發生皆有利於我。", "02事急則變，事緩則圓", "越急的事，越要緩著來。急躁，只會讓自己陷進情緒和壓力裡，像無頭蒼蠅一樣亂撞，失了方寸，反而添麻煩，得不償失，還得為自己的衝動和不成熟懊悔不已。", "急，是因力沒底氣，總怕晚一步出亂子。", "但急於求成、急於邀功、急於辯解、急於完成任務，只會讓簡單的問題變複 讓自己有價值→再讓別人有利可圖→長久站穩腳跟", ["搞錢越久越明白，能長久站穩腳跟的賺錢邏輯，從來都不是投機蹭風口。", "很多人總想著找捷徑、碰紅利，盯著短期收益挖空心思，甚至不惜消耗自身口碑，反而越走越偏。其實商業最樸素的底層邏輯，從來都很簡單：先讓自己有價值，再讓別人有利可圖。", "讓自己有價值，是安身立命的根本。你的專業能力、解決問題的本事、不可替代的核心競爭力，是任何人都拿不走的底氣。你能為他人創造多少真實價值、解決多大的實際問題，就配得上多大的回報，這是最公平的商業法則。", "讓別人有利可圖，是把路走寬的智慧。只想著獨吞利益、事事佔盡好處的人，沒人願意長久同行。懂得給合作方留足空間，讓身邊的人都能拿到實在的收益，才能攢下口碑與人脈，吸引越來越多的資源向你靠攏。", "你能成就多少人，就能成就多大的事。沉下心打磨自己，做個有價值也有格局的人，財富自會水到渠成。", "#搞錢思維  #商業認知  #自我成長  #財富思維  #職場成長", "07-11"], [["哲學命題", "先讓自己有價值，|再讓別人有利。", 1], ["哲學命題", "讓自己有價值，是安身立命的根本。", 0], ["哲學命題", "讓別人有利可圖，是把路走寬的智慧。", 0], ["哲學命題", "只想著獨吞利益、事事佔盡好處的人，沒人願意長久同行。", 0], ["哲學命題", "你的專業能力、解決問題的本事、不可替代的核心競爭力，|是任何人都拿不走的底氣。", 0], ["排比句", "不投機，不蹭風口，|不消耗口碑。", 1], ["對比句", "找捷徑的人越走越偏，|建價值的人越走越穩。", 1], ["對比句", "很多人總想著找捷徑、碰紅利，盯著短期收益挖空心思，|甚至不惜消耗自身口碑，反而越走越偏。", 0], ["反問句", "你想長久站穩，|還是短期撈一把？", 1], ["情境衝突", "盯著短期收益，|卻把口碑賠光了。", 1], ["情境衝突", "搞錢越久越明白，能長久站穩腳跟的賺錢邏輯，|從來都不是投機蹭風口。", 0], ["情境衝突", "懂得給合作方留足空間，讓身邊的人都能拿到實在的收益，|才能攢下口碑與人脈，吸引越來越多的資源向你靠攏。", 0], ["認知翻轉", "商業最樸素的邏輯，|最長久。", 1], ["層層遞進", "先有價值，再讓利，|最後站穩。", 1], ["層層遞進", "其實商業最樸素的底層邏輯，|從來都很簡單：先讓自己有價值，再讓別人有利可圖。", 0], ["詩性收束", "價值在，|腳跟就在。", 1], ["詩性收束", "你能為他人創造多少真實價值、解決多大的實際問題，|就配得上多大的回報，這是最公平的商業法則。", 0], ["詩性收束", "你能成就多少人，就能成就多大的事。", 0], ["詩性收束", "沉下心打磨自己，做個有價值也有格局的人，|財富自會水到渠成。", 0]]], [25, "輕資產整合才是低成本破局思路", "B", "中介不建房、電商不產貨→整合供需→輕資產低成本破局", ["✨普通人搞錢開竅｜輕資產整合才是低成本破局思路", "很多人一聽到 “資源整合” 就覺得是投機取巧，其實這才是普通人最低風險的搞錢邏輯。 你看房產中介不建房、婚慶公司不自帶攝影化妝團隊、電商平臺不生產一件貨品，本質都是整合供需兩端，靠匹配價值賺取收益，這都是經過市場驗證的成熟商業模式。", "普通人最容易踩的思維誤區，就是預設 “想賺錢必須先砸錢”：開店先租門面、創業先囤貨，還沒見到收益就先扛上全部風險。但搞錢的逆向思維恰恰是 —— 先鎖定真實需求，再匹配對應資源，先拿到訂單，再產生成本。", "比如想做水果生意，先在小區群徵集團購需求，湊夠單再去市場拿貨，零庫存不壓貨；想接企業宣傳單，不用先買裝置學剪輯，先談好客戶需求和預算，再對接專業團隊落地，靠品控和對接賺服務費。", "核心從來不是投機取巧：你解決了供需的資訊差，替客戶省了試錯成本與時間精力，幫資源方拿到穩定訂單，這份連線與品控的價值，就是你賺錢的底氣。", "新手起步四步法：", "1️⃣ 從熟悉的場景挖掘真實需求", "2️⃣ 積累靠譜的服務商資源庫", "3️⃣ 永遠先拿訂單再對接資源", "4️⃣ 把控交付質量積累口碑", "從小單開始跑通模式，穩步複製迭代，慢慢就能搭建起屬於自己的輕資產小事業。", "#商業思維  #搞錢  #輕資產創業  #認知提升  #個人成長", "07-10"], [["哲學命題", "不建房的中介，|不產貨的平臺。", 1], ["哲學命題", "普通人搞錢開竅｜輕資產整合才是低成本破局思路", 0], ["哲學命題", "你看房產中介不建房、婚慶公司不自帶攝影化妝團隊、電  0], ["詩性收束", "早點建系統，|晚年才有底氣。", 1], ["詩性收束", "練出稀缺技能：別做隨時可替代的螺絲釘，|深耕賽道讓單位時間增值，攢下第一桶金。", 0], ["詩性收束", "你可以繼續工作，但不再為生存焦慮；|可以安心陪家人，可以大膽試熱愛的事。", 0], ["詩性收束", "這條路或許漫長，但終點不是疲憊的富翁，|是能從容掌控自己時間的自由人。", 0]]], [27, "普通人拉開差距的關鍵", "B", "體力、腦力、錢生錢各配對應心態→年入過億者的底層思維", ["年入過億大佬的底層思維｜普通人拉開差距的關鍵", "被一位年入過億的前輩點醒了！悟透這兩點，普通人搞錢路上真的能少踩很多坑。", "首先，不同賺錢模式，要擺對對應的心態：靠體力賺錢就踏實本分，靠腦力賺錢就靈活變通，靠錢賺錢就果斷有魄力，靠資源賺錢就懂人情世故，靠人賺錢就心胸豁達。找準自己的賽道，匹配對心態，路才能越走越順。", "最核心的差距，是做事邏輯完全相反。普通人信奉 “有多少資源，做多大事”，永遠在等萬事俱備：攢人脈、湊本金、等時機，總覺得條件全齊了才能成功，一輩子都停在 “準備階段”。", "而富人永遠先定目標，再反向匹配資源。定好目標就層層拆解，把大目標拆成一個個可落地的小動作，越拆越細，再難的目標也能輕鬆執行。缺人就找人，缺錢就籌錢，邊做邊補全條件，哪怕是曾經的對手，也能為了目標達成雙贏，全程在實戰裡 “以戰養戰”。", "其實貧富差距的起點從來不是本金，而是思維。你當下有沒有錢不重要，擁有目標前置、邊做邊完善的思維，早晚能跑出自己的節奏。", "別等 “完全準備好” 再出發，先上路，再最佳化，就是最快的成長。 大家最有共鳴的是哪一點？評論區聊聊～", "#個人成長 #思路決定出路 #底層邏輯 #年輕人搞錢 #財富思維 #財商", "07-08"], [["哲學命題", "不同的錢，|要配不同的心態。", 1], ["哲學命題", "普通人信奉“有多少資源，做多大事”，永遠在等萬事俱備：攢人脈、湊本金、等時機，|總覺得條件全齊了才能成功，一輩子都停在“準備階段”。", 0], ["哲學命題", "年入過億大佬的底層思維｜普通人拉開差距的關鍵", 0], ["哲學命題", "被一位年入過億的前輩點醒了！", 0], ["哲學命題", "悟透這兩點，普通人搞錢路上真的能少踩很多坑。", 0], ["排比句", "體力錢要踏實，|腦力錢要靈活，|錢生錢要魄力。", 1], ["排比句", "首先，不同賺錢模式，要擺對對應的心態：靠體力賺錢就踏實本分，|靠腦力賺錢就靈活變通，靠錢賺錢就果斷有魄力，靠資源賺錢就懂人情世故，靠人賺錢就心胸豁達。", 0], ["對比句", "心態錯配的人踩坑，|心態對了的人少走彎路。", 1], ["對比句", "其實貧富差距的起點從來不是本金，而是思維。", 0], ["反問句", "你賺的是哪一種錢，|用的是哪一種心態？", 1], ["反問句", "大家最有共鳴的是哪一點？", 0], ["情境衝突", "用體力錢的心態做投資，|結果虧得一塌糊塗。", 1], ["情境衝突", "找準自己的賽道，匹配對心態，路才能越走越順。", 0], ["情境衝突", "定好目標就層層拆解，把大目標拆成一個個可落地的小動作，|越拆越細，再難的目標也能輕鬆執行。", 0], ["認知翻轉", "年入過億的人，|先懂的是心態。", 1], ["層層遞進", "先分清錢的型別，再調心態，|最後拉開差距。", 1], ["層層遞進", "而富人永遠先定目標，再反向匹配資源。", 0], ["層層遞進", "別等“完全準備好”再出發，|先上路，再最佳化，就是最快的成長。", 0], ["詩性收束", "心態對了，|錢就對了。", 1], ["詩性收束", "最核心的差距，是做事邏輯完全相反。", 0], ["詩性收束", "缺人就找人，缺錢就籌錢，邊做邊補全條件，|哪怕是曾經的對手，也能為了目標達成雙贏，全程在實戰裡“以戰養戰”。", 0], ["詩性收束", "你當下有沒有錢不重要，擁有目標前置、邊做邊完善的思維，|早晚能跑出自己的節奏。", 0]]], [28, "18-25 歲黃金期｜普通人完成原始積累", "A", "18-25歲試錯成本最低→按年齡拆解→完成原始積累", ["18-25 歲黃金期｜普通人完成原始積累的成長時間表✨", "18-25 歲是人生試錯成本最低、回報率最高的七年，怎麼走直接決定 30 歲後的生活底氣。整理了按年齡拆解的成長路徑，想搞錢攢底氣的可以碼住！", "18 歲別信 “大學只該讀書”，學習賺錢兩不誤，家教、剪輯、自媒體都能試；丟掉 “等靠要” 思維，主動找機會；每月強制 划走，四步拆透：賣什麼產品、精準受眾是誰、戳中什麼情緒痛點、完整成交路徑。甚至可以模擬客戶走完全流程，等於白嫖一套市場驗證過的商業方案。", "2️⃣ 拆解生意 看到火爆的門店別急著消費，算清原料成本、單品毛利、日銷體量，疊加房租人工估算回本週期。更要多看瀕臨倒閉的店，失敗的原因從不摻水，看懂門店生死邏輯，能少踩 90% 的創業坑。", "3️⃣ 抱怨裡挖金礦 機會從來不在風口榜單裡，藏在人群的吐槽聲中。帶娃疲憊、失眠焦慮、通勤麻煩…… 每句抱怨都是未被滿足的真實需求。把情緒吐槽翻譯成可落地的產品或服務，就是最穩的切入點。", "4️⃣ 練 “厚臉皮” 太多人困在 “不好意思” 裡：不好意思談錢、不好意思展示自己。放下面子是成事第一步，敢開口、敢爭取、敢公開表達，機會才會主動找到你。", "90 天後你會養成本能：看廣告自動拆模式，看店鋪自動算盈虧。沒有背景不可怕，沒有商業思維才可怕。", "#商業思維  #自我提升  #認知覺醒  #普通人創業 #底層邏輯 #商業洞察力", "06-23"], [["哲學命題", "從消費者，|到商人。", 1], ["哲學命題", "抱怨裡挖金礦機會從來不在風口榜單裡，|藏在人群的吐槽聲中。", 0], ["哲學命題", "把情緒吐槽翻譯成可落地的產品或服務，|就是最穩的切入點。", 0], ["哲學命題", "拆解廣告別把廣告當騷擾，|能持續投流的都是跑通閉環的現成案例。", 0], ["哲學命題", "刷到別划走，四步拆透：賣什麼產品、精準受眾是誰、戳中什麼情緒痛點、完整成交路徑。", 0], ["排比句", "別人看熱鬧，|你看門道；|別人看消費，你看模式。", 1], ["排比句", "放下面子是成事第一步，敢開口、敢爭取、敢公開表達，|機會才會主動找到你。", 0], ["對比句", "消費者花錢，|商人賺錢。", 1], ["反問句", "你逛街時，|是在買東西，還是在看模式？", 1], ["情境衝突", "沒人帶路，|也能翻身。", 1], ["情境衝突", "家裡沒做生意的長輩帶路、沒人手把手教你拿結果，|真的不耽誤你翻身。", 0], ["認知翻轉", "商人視角，|不是天生，是練出來的。", 1], ["層層遞進", "先換視角，再練習，|最後翻身。", 1], ["詩性收束", "九十天，|換一雙看世界的眼睛。", 1], ["詩性收束", "練“厚臉皮”太多人困在“不好意思”裡：不好意思談錢、不好意思展示自己。", 0], ["詩性收束", "天後你會養成本能：看廣告自動拆模式，|看店鋪自動算盈虧。", 0], ["詩性收束", "沒有背景不可怕，沒有商業思維才可怕。", 0]]], [43, "死磕 5 件事 60 天練出商人視角", "B", "從小沒人教用商人的眼睛看世界→死磕5件事60天練成", ["真的沒有人天生會做生意！ 總覺得自己沒商業頭腦、看不到商機，根本不是你笨 —— 是從小到大沒人教過你用商人的眼睛看世界。我們從小被灌輸 “好好讀書找份穩工作”，這套認知只會讓你做個消費者，永遠錯過身邊的機會。 商人視角從來不是天賦，是練出來的肌肉記憶。死磕這 5 件事，2 個月大腦自動換頻道。", "1️⃣ 看利潤而非價格，消費時別隻想 “貴不貴”，多琢磨成本多少、中間分幾層利潤。不用算精準，練的是利潤感知，兩週就能形成本能反應。", "2️⃣ 找供需缺口而非跟風，看到生意火爆彆著急入局，多盯 “沒被滿足的需求”。去家附近最火的店坐 20 分鐘，顧客抱怨、將就的地方，就是藏著機會的缺口。", "3️⃣ 想 “誰會付錢” 而非 “好不好” ，別用自己的喜好判斷市場，產品再好沒人買單都是自嗨。每天拆解 3 件日常用品的付費動機，練出使用者思維才是賺錢底層能力。", "4️⃣ 追蹤錢的流向而非數字，差距不在收入多少，而在錢花去了哪。把賬單分成消耗型和資產型支出，看懂錢在哪增值、在哪消失，你就超過了 90% 的人。", "5️⃣ 把資訊變成判斷而非收藏，刷再多幹貨不做判斷等於白看。看完任何內容逼自己 30 秒出結論，判斷力都是在一次次決策裡練出來的。", "認識個倉庫管理員，發現廠區貨車司機吃飯難，牽線盒飯攤主做分銷，零成本每月多賺 4k，只是換了個視角看待了 3 年的地方。", "不用有錢有資源，這 5 件事今天就能開始練。等你走在路上會本能拆解生意模型時，就知道大腦已經換了一套賺錢的作業系統✨", "#商業思維  #財富認知  #搞錢  #認知提升  #經商思維  #自我成長", "06-22"], [["哲學命題", "沒人天生|會做生意。", 1], ["哲學命題", "商人視角從來不是天賦，是練出來的肌肉記憶。", 0], ["哲學命題", "去家附近最火的 。這不是玄學，是頂級富人都在踐行的「財富預設定律」—— 不是擁有了才相信，而是相信了才擁有。", "神經科學的映象神經元效應早已證實：大腦想象一件事和真實經歷時，啟用的是同一區域。你越逼真地沉浸在富足狀態裡，潛意識就越會主動幫你捕捉賺錢機遇。", "軟銀孫正義創業初期一無所有，辦公室連像樣的桌子都沒有，他卻每天站在蘋果箱上大聲宣告 “要做世界第一的公司”。員工覺得他異想天開紛紛離職，他卻毫不動搖。他不是畫餅，是在日復一日給潛意識程式設計，最終締造了全球頂尖的投資帝國。", "想把 “貧窮訊號” 切換成 “富足頻率”，試試這 5 個實操方法：", "1️⃣ 身份重述：別再定義自己是 “窮人”，改成 “暫時沒變現的富人”。標籤固化人生，狀態只是階段", "2️⃣ 場景侵入：去高階商場、五星酒店大堂逛逛，不用消費，讓身體記住被優質服務包圍的感受", "3️⃣ 語言調頻：把 “太貴了” 換成 “暫時不需要”，“我不行” 換成 “我可以試試”，語言是思維的開關", "4️⃣ 預言日記：每天寫一句 “我正在成為年入百萬的人”，再完成一件匹配這個身份的小事", "5️⃣ 能量嫁接：主動靠近優秀的人，觀察他們的思維與金錢觀，環境會悄悄重塑你", "核心不是裝富，是提前進入富足狀態。狀態對了，行動才精準；行動到位，財富自然向你靠攏。", "所有白手起家的人，都不是有錢了才篤定，而是一無所有時就堅信自己值得。別讓貧窮思維困住你，從今天起，給自己換一套財富思維繫統", "#財富 #認知 #心理 #底層邏輯 #人性", "06-20"], [["哲學命題", "不是擁有了才相信，|是相信了才擁有。", 1], ["哲學命題", "記住有錢的感覺，你就會越有錢。", 0], ["哲學命題", "你越逼真地沉浸在富足狀態裡，|潛意識就越會主動幫你捕捉賺錢機遇。", 0], ["哲學命題", "他不是畫餅，是在日復一日給潛意識程式設計，|最終締造了全球頂尖的投資帝國。", 0], ["哲學命題", "神經科學的映象神經元效應早已證實：大腦想象一件事和真實經歷時，|啟用的是同一區域。", 0], ["排比句", "記住有錢的感覺，|想像有錢的生活，|成為有錢的人。", 1], ["對比句", "匱乏的人想著缺，|富足的人想著有。", 1], ["對比句", "這不是玄學，是頂級富人都在踐行的「財富預設定律」——不是擁有了才相信，|而是相信了才擁有。", 0], ["對比句", "所有白手起家的人，都不是有錢了才篤定，|而是一無所有時就堅信自己值得。", 0], ["反問句", "你心裡，|住著一個富人還是窮人？", 1], ["情境衝突", "嘴上想要錢，|心裡全是缺錢的畫面。", 1], ["情境衝突", "軟銀孫正義創業初期一無所有，辦公室連像樣的桌子都沒有，|他卻每天站在蘋果箱上大聲宣告“要做世界第一的公司”。", 0], ["情境衝突", "員工覺得他異想天開紛紛離職，他卻毫不動搖。", 0], ["認知翻轉", "財富預設定律：|大腦會把想像當真。", 1], ["層層遞進", "先相信，再想像，|最後擁有。", 1], ["詩性收束", "記住有錢的感覺，|錢就認得你。", 1], ["詩性收束", "核心不是裝富，是提前進入富足狀態。", 0], ["詩性收束", "狀態對了，行動才精準；|行動到位，財富自然向你靠攏。", 0], ["詩性收束", "別讓貧窮思維困住你，|從今天起，給自己換一套財富思維繫統", 0]]], [46, "3 個心法搞懂財富底層邏輯", "D", "賺錢不是「掙」是「換」→換的是心性與福德", ["總覺得賺錢很累？追著風口、盯著機會來回跑，好不容易賺了點錢，轉眼又留不住？其實很多人從根上就搞錯了：賺錢本質不是 “掙”，而是 “換”，換的是你的心性與福德。這些道理課本里不會教，多數人摸爬滾打一輩子也未必悟透。", "錢本身是一種能量[錢袋R]，本質是用來試煉人貪、嗔、痴的心性。過不了心性這一關，哪怕靠運氣賺到錢，最終也會憑實力虧掉。你越拼命追著錢跑，在能量層面就越成了金錢的附庸 —— 你追逐什麼，能量就低於什麼，財富自然會遠離你。", "修行人掌握的核心法則，就是佈施：不向外追逐財富，而是主動輸出價值、積攢福報。福報攢夠了，財富自然會主動流向你。", "分享三個可落地的心法：", "✅ 轉換心態：把 “我能得到什麼” 換成 “我能給予什麼”。凡事先想能提供什麼價值，放下索取與算計，一句鼓勵、一次分享、舉手之勞的幫助都是佈施，焦慮內耗會少一大半。", "✅ 穩住能量場：修心先修情緒穩定。遇事不急躁、不抱怨、不內耗，內心越安定，承載財富的容器就越大。心浮氣躁、滿心怨氣的人，財運很難長久。", "✅ 做事以人為本：做事初心 糊，大腦容易犯困）", "✅ 改成： “刷3張卷子裡的20道大題，做完一題立刻對答案改錯！”把任務拆成非黑即白的閉環，讓大腦清晰看到“比分上漲”，直接變身續航燃料！", "3. 復刻C羅的“賽前儀式” C羅罰球前量步點、深呼吸、叉腰，是精密的心理錨定。 為你自己設計一個心流開關：手機扔隔壁房間 ➡️ 戴上降噪耳機（認知關閉） ➡️ 3次深呼吸。兩週後形成條件反射，這套動作一做，大腦秒進“比賽模式”！", "#心流 #高效學習法 #自律 #時間管理 #職場成長 #備考乾貨 #世界盃冷知識 #個人成長", "Jun 13"], [["哲學命題", "心流，|是專注的最高境界。", 1], ["哲學命題", "看世界盃別光顧著看球！", 0], ["哲學命題", "把這套機制搬到你的書桌或辦公桌上，|工作和複習效率直接降維打擊！", 0], ["哲學命題", "鎖定“4%黃金難度區”心流只發生在挑戰比現有技能高出【4%】的微妙區間。", 0], ["哲學命題", "任務太難（如萬字報告）：大腦因恐懼而拖延。", 0], ["排比句", "關掉焦慮，|關掉懷疑，|讓直覺接管。", 1], ["對比句", "想太多的人卡住，|進入心流的人無敵。", 1], ["反問句", "你上一次完全專注，|是什麼時候？", 1], ["情境衝突", "坐在書桌前，|腦子卻一直在焦慮。", 1], ["認知翻轉", "高手的秘密，|是讓焦慮的腦區斷電。", 1], ["層層遞進", "先清空雜念，再專注一件事，|最後進入心流。", 1], ["詩性收束", "在心流裡，|時間會消失，你會發光。", 1], ["詩性收束", "復刻C羅的“賽前儀式”C羅罰球前量步點、深呼吸、叉腰，|是精密的心理錨定。", 0], ["詩性收束", "為你自己設計一個心流開關：手機扔隔壁房間➡️戴上降噪耳機（認知關閉）➡️3次深呼吸。", 0], ["詩性收束", "兩週後形成條件反射，|這套動作一做，大腦秒進“比賽模式”！", 0]]], [53, "賺錢是為了買回我們“拒絕別人的自由”", "E", "阿德勒課題分離→不背別人的課題→賺錢是買回拒絕的自由", ["每天上班像上墳，為了碎銀幾兩忍氣吞聲，最後錢沒賺到多少，精神先內耗崩潰了？ 其實，賺錢這件事本身並不累，累的是你承載了太多“別人的課題”。", "今天用阿德勒心理學，幫所有現代打工人做一次“精神斷舍離”！", "阿德勒心理學核心觀點：一切人際關係的矛盾，都源於對別人課題的妄加干涉，或者自己的課題被別人干涉。", "放在職場和賺錢上，我們可以把所有事簡單粗暴地劃分為兩類：", "1.我的課題：我付出了多少勞動、我的技能有沒有提升、我拿到了多少回報。", "2.他人的課題：老闆滿不滿意、同事怎麼看我、公司會不會倒閉、客戶配不配合。", "❌ 3個典型的“職場課題混淆”", "看看你中了幾個？", "情緒內耗：“老闆今天開會沒直視我，是不是對我有意見？”", "課題分離：你是否完成了工作，是你的課題；老闆高不高興、怎麼評價你，是老闆的課題。", "過度負責：“這個專案沒做好，雖然不是我的主責，但我好愧疚。”", "課題分離：盡心盡力是你的課題；專案最終的成敗和公司的命運，是管理層的課題。", "自尊綁架：“為了這點工資天天被客戶挑刺，我活得太沒尊嚴了。”", "課題分離：你出賣專業技能換取報酬，這是商業交易（你的課題）；對方專業度低、態度差，那是對方的素質課題，不需要用來定義你的人格。", "搞錢的最高境界，是把自己當成一家“一人公司”。", "1. 建立“乙方心態” 把老闆和公司當成你的“大客戶”。客戶付錢，你提供服務。服務時間內保持職業化，下班直接切斷連結。“我不是來這裡找家人的，我是來提供資產、置換現金的。”", "2. 停止為他人的情緒買單 職場上 90% 的指責和PUA，其實都源於對方自身的焦慮和無能。分清界限：“你可以罵我，但那是你的情緒宣洩，我不負責吸收。”", "3. 聚焦於“自我課題”的增值 把精力從“研究人際關係”轉移到“提升核心資產”上。今天多學了一個技能、多攢了一個案例、多領了一個月的薪水，這些才是你真正賺到的。", "✨ 財富心理學結語", "賺錢真的只是為了錢嗎？ 不，賺錢是為了買回我們“拒絕別人的自由”。", "當你學會把“賺錢”當作純粹的課題分離，你會發現：工作再也傷不到你，因為你只是一臺無情的無形資產增值機器。", "#阿德勒心理學 #課題分離 #職場內耗 #搞錢腦 #搞錢女孩 #職場成長 #財富心理局 #心理學乾貨 #認知覺醒 #一人公司", "06-12"], [["哲學命題", "賺錢，|是為了買回拒絕的自由。", 1], ["哲學命題", "阿德勒心理學核心觀點：一切人際 突", "很多人以為加價60%就是60%毛利，|結果賣著賣著就虧了。", 0], ["認知翻轉", "虧錢不是生意難，|是帳算錯了。", 1], ["層層遞進", "先算成本，再算毛利，|最後算保本線。", 1], ["詩性收束", "三道題算明白，|才配推開那扇門。", 1], ["詩性收束", "正確答案：(160-100)÷160×100%=37.5%", 0], ["詩性收束", "定價公式：定價=成本÷(1-毛利率%)", 0], ["詩性收束", "算不明白的生意，最好別做。", 0]]], [2, "以前總覺得人生不順是運氣不好，看完老祖宗留下的這套\"七情六慾五毒八苦\"，才發現——不是命不好，是心沒修好。", "C", "五毒、八苦、七情六欲→不是命不好，是心沒修好", ["五毒最扎心：", "貪，讓你永遠在追；嗔，讓你不順心就炸；痴，讓你鑽牛角尖；慢，讓你聽不進人話；疑，讓你活成孤島。哪一個不是在折磨自己？", "八苦最清醒：", "生老病死是命，愛別離、怨憎會、求不得，哪個不是心裡過不去的坎？最難的是\"五陰熾盛\"——被自己的慾望和煩惱纏住，逃都逃不掉。", "老祖宗早就看透了：七情是天性，六慾是本能，但五毒八苦是修行的考卷。", "人這輩子，修的不是無慾無求，而是知止知足。貪嗔痴慢疑，放下一個，就輕一分；生老病死苦，看透一分，就活得更明白一點。", "你覺得自己被哪一\"毒\"困得最深？", "#弘揚中華傳統 #國學知識 #五臟六腑的功能 #古人對萬物的雅稱 #易經 #性格分析 #老人言 #小說人物性格 #國學 #易學智慧改變人生", "Apr 15"], [["哲學命題", "不是命不好，|是心沒修好。", 1], ["哲學命題", "最難的是\"五陰熾盛\"——被自己的慾望和煩惱纏住，|逃都逃不掉。", 0], ["哲學命題", "老祖宗早就看透了：七情是天性，|六慾是本能，但五毒八苦是修行的考卷。", 0], ["哲學命題", "貪嗔痴慢疑，放下一個，就輕一分；|生老病死苦，看透一分，就活得更明白一點。", 0], ["排比句", "貪讓你一直追，|嗔讓你一點就炸，|痴讓你鑽牛角尖。", 1], ["排比句", "貪，讓你永遠在追；|嗔，讓你不順心就炸；|痴，讓你鑽牛角尖；|慢，讓你聽不進人話；|疑，讓你活成孤島。", 0], ["對比句", "怪命的人越活越苦，|修心的人越活越順。", 1], ["對比句", "人這輩子，修的不是無慾無求，而是知止知足。", 0], ["反問句", "五毒之中，|哪一個正在折磨你？", 1], ["反問句", "哪一個不是在折磨自己？", 0], ["反問句", "生老病死是命，愛別離、怨憎會、求不得，|哪個不是心裡過不去的坎？", 0], ["反問句", "你覺得自己被哪一\"毒\"困得最深？", 0], ["情境衝突", "明明什麼都有，|心裡卻一刻不得安寧。", 1], ["認知翻轉", "苦不在命裡，|在心裡。", 1], ["層層遞進", "先認識五毒，再看懂八苦，|最後修好心。", 1], ["詩性收束", "心修好了，|命就順了。", 1]]], [3, "90% 的管理者每天忙得腳不沾地，團隊還是一團亂；只有 10% 的人輕鬆得像\"在散步\"，團隊卻越跑越快。", "A", "能力地圖5大維度＋動作清單→管理的底層心法", ["差別在哪？底層心法。", "會管的人，腦子裡都裝著一張\"能力地圖\"+\"動作清單\"——", "🔶 先修內功：管理能力的 5 大維度", "①解決問題：碰到事，能不能拆得開、扛得住、收得住尾。", "②溝通協調：上對老闆、下對員工、橫對部門，話能不能講到對方心裡去。", "③承受壓力：業績壓頂、客戶罵街、團隊炸鍋，你的情緒能不能穩得住。", "④準確辨識：人靠不靠譜、事重不重要、方向對不對，眼力要毒。", "⑤制定和把控計劃：從戰略拆解到落地節奏，從月到天到事，你能不能盯得住。", "這 5 項缺一個，團隊就會在那個位置漏水。", "🔷 再分層次：管理者的\"三層心法\"", "✅ 高層做正確的事——方向：方向大致正確，比所有努力都管用。", "✅ 中層正確的做事——方法：方法貫徹到底，比頻繁換招更見效。", "✅ 基層把事做正確——執行：執行要有閉環，沒有閉環就沒有結果。", "很多人累，是因為用基層的方式幹高層的活，或者用高層的態度做基層的事——位置錯了，越努力越擰巴。", "🔥 最後落地：管員工不累的 7 招", "①立規矩：有情的領導+無情的管理+絕情的制度。", "②用對人：選對人做對事，企業的成敗說到底就是用人的成敗。", "③放點權：有能力的人給點權，要麼讓他蓋章，要麼讓他簽字。", "④抓細節：把失誤鎖在責任的籠子裡。", "⑤拼效益：短期長期利益都得有，激勵員工良性競爭。", "⑥有檢查：員工不做你要求的事，只做你檢查的事。", "⑦明獎罰：獎要獎得心花怒放，罰要罰得膽戰心驚。", "—— 這 5+3+7 = 15 個管理動作，每一個都是過來人踩出來的血淚經驗。", "管者，理也；理順了，自然不累。", "🔥 你身邊那個\"看起來很閒，團隊卻最能打\"的領導，他做對了哪幾件？評論區聊聊👇", "Jun 30"], [["哲學命題", "會管的人，|腦子裡有一張能力地圖。", 1], ["哲學命題", "用對人：選對人做對事，|企業的成敗說到底就是用人的成敗。", 0], ["哲學命題", "會管的人，腦子裡都裝著一張\"能力地圖\"+\"動作清單\"——", 0], ["哲學命題", "解決問題：碰到事，能不能拆得開、扛得住、收得住尾。", 0], ["哲學命題", "溝通協調：上對老闆、下對員工、橫對部門，|話能不能講到對方心裡去。", 0], ["排比句", "解決問題，溝通協調，|用對人，帶好團隊。", 1], ["對比句", "亂忙的人沒有地圖，|輕鬆的人照圖施工。", 1], ["反問句", "你每天忙得腳不沾地，|團隊為什麼還是亂？", 1], ["反問句", "你身邊那個\"看起來很閒，|團隊卻最能打\"的領導，他做對了哪幾件？", 0], ["情境衝突", "事事親力親為，|團隊卻越帶越散。", 1], ["情境衝突", "基層把事做正確——執行：執行要有閉環，|沒有閉環就沒有結果。", 0], ["情境衝突", "很多人累，是因為用基層的方式幹高層的活，|或者用高層的態度做基層的事——位置錯了，越努力越擰巴。", 0], ["認知翻轉", "差別不在能力，|在底層心法。", 1], ["層層遞進", "先修內功，再列動作，|最後照著做。", 1], ["層層遞進", "制定和把控計劃：從戰略拆解到落地節奏，|從月到天到事，你能不能盯得住。", 0], ["詩性收束", "理順了，|管理就像散步。", 1], ["詩性收束", "明獎罰：獎要獎得心花怒放，罰要罰得膽戰心驚。", 0], ["詩性收束", "這5+3+7=15個管理動作，|每一個都是過來人踩出來的血淚經驗。", 0], ["詩性收束", "管者，理也；|理順了，自然不累。", 0]]], [4, "為什麼有的管理者每天忙到飛起團隊卻散漫，有的管理者按部就班團隊卻跑得比誰都快？", "A", "建流程、定制度、抓目標→管事不管人→團隊越跑越快", ["我觀察了 100+ 團隊，最後發現：差的不是能力，是思維框架。", "會管的人，從不\"管人\",他們只做兩件事——", "🔶 把事管清楚（三件事）", "1️⃣ 建流程：流程是協作的軌道。流程清，扯皮少；流程亂，再勤奮的人也是白忙。", "2️⃣ 定績效：目標是動力的源頭。績效定得清楚，員工知道\"什麼是對的事\"，自然朝同一個方向使勁。", "3️⃣ 作計劃：策略是落地的橋樑。計劃做到位，員工知道\"如何把事情做正確\"，不用領導天天追屁股。", "🔷 把人理明白（三件事）", "1️⃣ 建團隊：人崗匹配。事事有人做、人人有事做，比所謂\"激勵\"管用一百倍。", "2️⃣ 做團建：氛圍出戰鬥力。員工帶著情緒上班，做出來的活也帶情緒；帶著熱情上班，連加班都不覺得苦。", "3️⃣ 鑄文化：文化是團隊的靈魂。制度管行為，文化管人心，這才是真正的核心競爭力。", "—— 把這 6 件事一件件理順，你會發現：", "事理順了，人就歸位了。", "那些天天加班\"管人\"的領導，不是太負責，是沒搞清楚一件事——管事是術，管人是道；術是表，道才是裡。", "老一輩講得更狠一句話：用制度管人，用流程管事。把制度和流程立住了，管理者就能從\"救火隊員\"變成\"擺棋人\"。", "🔥 你身邊有沒有那種\"看起來很輕鬆，團隊卻一直在贏\"的領導？評論區聊聊他是怎麼做的#手寫筆記 #思維導圖 #筆記分享 #考研筆記 #基礎知識 #名詞解釋 #勤思心理學考研 #歷史筆記 #學習筆記 #共貫與多元", "Jun 29"], [["哲學命題", "會管的人，|從不管人。", 1], ["哲學命題", "制度管行為，文化管人心，這才是真正的核心競爭力。", 0], ["哲學命題", "那些天天加班\"管人\"的領導，|不是太負責，是沒搞清楚一件事——管事是術，管人是道；|術是表，道才是裡。", 0], ["哲學命題", "我觀察了100+團隊，|最後發現：差的不是能力，是思維框架。", 0], ["哲學命題", "會管的人，從不\"管人\",他們只做兩件事——", 0], ["排比句", "建流程，定製度，|抓目標 💨 後來一位老前輩點醒我：", "\"員工不是不願意幹，是你沒給他幹事的'軌道'。\"", "我整理了團隊裡 7 類高頻抱怨，背後全是同一個真相👇", "1️⃣ 不知道幹什麼 → 缺目標", "2️⃣ 做事毫無頭緒 → 缺計劃", "3️⃣ 做事不流暢 → 缺流程", "4️⃣ 能力得不到提升 → 缺培訓", "5️⃣ 不知道怎麼做 → 缺方法", "6️⃣ 做好做壞都一樣 → 缺獎懲", "7️⃣ 付出回報不成正比 → 缺考核", "看明白沒？員工的 7 個痛點，全都不是\"人\"的問題，而是\"事\"沒設計好。", "更扎心的是——員工的成長根本不靠管理者催，而靠 5 層結構托起來：", "① 員工自己要有成長規劃 → ② 團隊提供資源 → ③ 領導提供指導和壓力 → ④ 個人能力隨之提升 → ⑤ 最終抓住屬於自己的機會。", "少一層，員工就在原地打轉；五層齊全，根本不用管，他自己就跑得飛快。", "所以真正的管理智慧只有一句話：", "管事是術，理順了事，人就不必再管。", "帶團隊累的朋友，可以對照檢查一下：你的團隊，缺的是\"管人\"還是\"理事\"？評論區聊聊，你卡在第幾層👇#自我管理意識 #團隊管理 #個人領導力 #職場管理領導力 #向上管理的藝術 #高層管理者 #個人目標管理 #領導力 #人生效率體系 #J人的生活", "Jun 24"], [["哲學命題", "真正高階的管理者，|只管事。", 1], ["哲學命題", "真正高階的管理者，從來不\"管人\"——只\"管事\"。", 0], ["哲學命題", "員工不是不願意幹，是你沒給他幹事的'軌道'。", 0], ["哲學命題", "我整理了團隊裡7類高頻抱怨，背後全是同一個真相👇", 0], ["排比句", "給軌道，給方法，|給支援。", 1], ["對比句", "追著員工問進度的人累，|給軌道的人輕。", 1], ["對比句", "員工的7個痛點，全都不是\"人\"的問題，|而是\"事\"沒設計好。", 0], ["反問句", "你的員工，|有幹事的軌道嗎？", 1], ["反問句", "帶團隊累的朋友，可以對照檢查一下：你的團隊，|缺的是\"管人\"還是\"理事\"？", 0], ["情境衝突", "查態度、摳細節，|團隊怨氣衝天。", 1], ["認知翻轉", "員工不是不願幹，|是你沒給他軌道。", 1], ["認知翻轉", "以前我也是天天追在員工屁股後面問進度、查態度、摳細節，|結果團隊怨氣沖天，自己累成狗😮‍💨後來一位老前輩點醒我", 0], ["層層遞進", "先鋪軌道，再放手，|最後看結果。", 1], ["層層遞進", "員工自己要有成長規劃→②團隊提供資源→③領導提供指導和壓力→④個人能力隨之提升→⑤最終抓住屬於自己的機會。", 0], ["詩性收束", "軌道鋪好了，|團隊自己就跑起來了。", 1], ["詩性收束", "更扎心的是——員工的成長根本不靠管理者催，|而靠5層結構托起來", 0], ["詩性收束", "少一層，員工就在原地打轉；|五層齊全，根本不用管，他自己就跑得飛快。", 0], ["詩性收束", "管事是術，理順了事，人就不必再管。", 0]]], [7, "幹了8年管理，從一線主管做到部門負責人，我才悟出一個扎心的真相：很多管理者每天累成狗，團隊卻越帶越散，根本不是能力不行，而是搞反了\"管人\"和\"管事\"的順序。", "A", "流程管事→制度管人→文化管心，順序對了效率翻倍", ["以前我也是事必躬親型，每天追著員工屁股後面查進度，結果呢？我累得吐血，下屬還嫌我管太寬😮‍💨直到老領導一句話點醒我：", "\"用流程管事，用制度管人，用文化管心。\"", "後來我把這套真正落地，團隊效率翻了一倍，離職率降了一半。今天把核心方法掏心窩子分享出來：", "1️⃣ 流程管事——讓事自己跑起來", "事情靠人盯，永遠盯不完；靠流程跑，才能自動閉環。", "做好三步：梳理關鍵節點→明確每步責任人→設定質量卡點。流程一旦跑順，你不在場，事也照樣推進。", "2️⃣ 制度管人——讓規則替你說話", "最忌諱的就是\"看心情管理\"，今天寬明天嚴，下屬根本摸不準你。", "制度的三步法：有規矩可循→有標準可依→有獎懲兌現。規則一旦立起來，管理者就不用天天當惡人。", "3️⃣ 管理核心：穩人準事", "管人要\"穩\"——穩情緒、穩預期、穩節奏，人心不慌團隊不散；", "管事要\"準\"——準目標、準節點、準覆盤，事事可控結果可期。", "最深的體會是：真正高階的管理者，不是最忙的那個人，而是最閒的那個人。因為他把流程立好了，制度跑通了，自己反而可以抬頭看路。", "你們身邊那些帶團隊厲害的人，是不是也這樣？評論區聊 、事→以「效」為中心整合資源", ["做了10年管理才明白，真正的高手根本不是天天盯著人罵，而是抓住這6個核心物件，以\"效\"為中心整合所有資源。", "第一，管人——但不是管手腳，是管思想和行為。一個人的思想跑偏了，再怎麼努力都是南轅北轍，效率自然上不去。", "第二，管事——把虛的願景落地。先轉成可衡量的目標，再拆成可執行的計劃，最後變成每個人的具體行動，閉環才叫管理。", "第三，管物——抓效能不抓數量。裝置能不能發揮最大價值？產品質量穩不穩定？物資能不能精準受控？這才是降本的關鍵。", "第四，管資——資金、資本、資產三位一體。不是看賬上有多少錢，而是看每一分錢的週轉效率和產出效益。", "第五，管時——不是打卡考勤。把時間轉化為目標、計劃、結果，用過程保結果，用結果保目標，時間才是最貴的成本。", "第六，管效——這才是核心！前面5個都是手段，透過管理活動把人、事、物、資、時整合起來，發揮最大價值，最終實現效率提升。", "一句話：以效為綱，五目俱張。你們覺得管理最難管的是哪個？評論區聊聊👇#資本結構最佳化 #財富管理 #資金流動性 #企業經營 #資產與負債 #投資人 #個人投資者 #順應時代趨勢 #企業融資 #財務規劃", "5月28日"], [["哲學命題", "管理說穿了，|就是管六件事。", 1], ["哲學命題", "管效——這才是核心！", 0], ["哲學命題", "管人——但不是管手腳，是管思想和行為。", 0], ["哲學命題", "一個人的思想跑偏了，再怎麼努力都是南轅北轍，|效率自然上不去。", 0], ["哲學命題", "管事——把虛的願景落地。", 0], ["排比句", "管人，管財，管物，|管時，管資訊，管事。", 1], ["對比句", "天天盯著人罵的人累，|以效為中心的人輕。", 1], ["對比句", "做了10年管理才明白，真正的高手根本不是天天盯著人罵，|而是抓住這6個核心物件，以\"效\"為中心整合所有資源。", 0], ["對比句", "不是看賬上有多少錢，|而是看每一分錢的週轉效率和產出效益。", 0], ["反問句", "你管的是人的手腳，|還是人的思想？", 1], ["反問句", "裝置能不能發揮最大價值？", 0], ["反問句", "物資能不能精準受控？", 0], ["反問句", "你們覺得管理最難管的是哪個？", 0], ["情境衝突", "人人都很努力，|卻南轅北轍。", 1], ["情境衝突", "把時間轉化為目標、計劃、結果，|用過程保結果，用結果保目標，時間才是最貴的成本。", 0], ["認知翻轉", "以效為中心，|整合所有資源。", 1], ["層層遞進", "先管人的思想，再管資源，|最後管出效率。", 1], ["層層遞進", "先轉成可衡量的目標，再拆成可執行的計劃，|最後變成每個人的具體行動，閉環才叫管理。", 0], ["詩性收束", "六件事理清了，|效率自然上來了。", 1], ["詩性收束", "管時——不是打卡考勤。", 0], ["詩性收束", "前面5個都是手段，透過管理活動把人、事、物、資、時整合起來，|發揮最大價值，最終實現效率提升。", 0], ["詩性收束", "一句話：以效為綱，五目俱張。", 0]]], [24, "學了那麼多管理，最後還得回到最基礎的5個職能！", "A", "計劃、組織、指揮、協調、控制→法約爾5大管理職能", ["做管理十幾年，看過各種新潮的管理理論、聽過無數大咖的分享，回過頭才發現：真正管用的，還是100多年前法約爾提出的這5大職能。經典永不過時，說的就是這個道理。", "給大家拆解一下，其實每個管理者每天都在做這5件事：", "計劃——定目標、找路徑。沒有計劃的團隊就是無頭蒼蠅，再忙也是瞎忙。這是所有管理的前提。", "組織——搭班子、分任務。誰做什麼、資源怎麼配，把合適的人放在合適的位置，這是管理的基礎。", "指揮——帶隊伍、鼓士氣。不是發號施令，而是指導方向、激勵人心，讓大家願意跟著你幹，這是管理的關鍵。", "協調——擰成繩、聚合力。部門之間扯皮、員工之間有矛盾，把大家的勁兒往一處使，這是管理的紐帶。", "控制——盯過程、糾偏差。不是盯著人不放，而是盯著目標走偏了及時拉回來，這是管理的保障。", "就這麼簡單：計劃定方向、組織打地基、指揮拿結果、協調聚人心、控制保落地。", "管理越複雜，越要回歸本質。你們覺得管理最難的是哪個職能？👇#提升管理能力 #卓越領導力 #生產計劃和管理 #向上管理的藝術 #人才管理戰略 #人力資源戰略 #管理制度 #專案管理 #企業組織形式 #高層管理者", "5月27日"], [["哲學命題", "經典，|永不過時。", 1], ["哲學命題 WhereHowHowMuch，|問題解剖刀，一刀一個準", 0], ["詩性收束", "看完這九條，我只想說：不是管理難，|是你還沒掌握正確方法。", 0]]], [31, "幸虧我學會了\"排序\"，不然每天忙成狗月底一覆盤全是瞎忙！", "F", "先定目標→吃掉那隻青蛙→學會排序效率翻倍", ["用了《吃掉那隻青蛙》這套方法3個月，我的效率直接翻倍。今天把最狠的7條分享出來，看完照做你也會感謝我👇", "第一條：先定目標再行動", "很多人一天忙到晚，最後發現做的事跟目標沒半毛錢關係。每天早上花5分鐘問自己：今天最重要的一件事是什麼？寫下來，再開始。", "第二條：80/20法則", "你80%的成果其實只來自20%的事。找到那20%，死死盯住，其他能砍就砍。", "第三條：ABCDE排序法", "每天列清單，給任務標ABCDE：", "A類：不做會死的", "B類：做了更好的", "C類：做了沒壞處的", "D類：可以委託別人的", "E類：直接刪掉的", "第四條：聚焦3件事", "每天只鎖定3件最重要的事，做完再碰其他的。貪多嚼不爛，這條救了我。", "第五條：學會說\"不\"", "對低價值的事果斷拒絕。你的時間很貴，別浪費在不值得的人身上。", "第六條：大任務切片", "一個大任務看著嚇人？拆成小塊！一口吃不成胖子，但一口一口吃可以。", "第七條：自設deadline", "別等別人催，自己給自己設截止時間。壓力就是動力，沒壓力就沒效率。", "看完這7條，你是不是也該重新審視一下自己的日程表了？", "你平時最頭疼的\"時間殺手\"是什麼？是怎麼解決拖延的？評論區聊聊👇#自我管理 #提升管理能力 #職場時間管理 #時間四象限管理法則 #向上管理 #精力管理 #時間管理者 #職場提升自己 #合理利用時間 #微習慣", "5月25日"], [["哲學命題", "先吃掉那隻青蛙。", 1], ["哲學命題", "壓力就是動力，沒壓力就沒效率。", 0], ["哲學命題", "用了《吃掉那隻青蛙》這套方法3個月，|我的效率直接翻倍。", 0], ["哲學命題", "今天把最狠的7條分享出來，看完照做你也會感謝我👇", 0], ["哲學命題", "很多人一天忙到晚，最後發現做的事跟目標沒半毛錢關係。", 0], ["排比句", "先定目標，再排序，|最後專注做最重要的事。", 1], ["對比句", "忙成狗的人沒排序，|效率翻倍的人先吃青蛙。", 1], ["反問句", "今天最重要的那件事，|你做了嗎？", 1], ["反問句", "每天早上花5分鐘問自己：今天最重要的一件事是什麼？", 0], ["反問句", "一個大任務看著嚇人？", 0], ["反問句", "看完這7條，你是不是也該重新審視一下自己的日程表了？", 0], ["情境衝突", "一天忙到晚，|做的事和目標沒半毛錢關係。", 1], ["認知翻轉", "效率的秘密，|是排序。", 1], ["認知翻轉", "你80%的成果其實只來自20%的事。", 0], ["層層遞進", "先定目標，再排序，|最後執行。", 1], ["詩性收束", "吃掉最大的青蛙，|剩下的都是小事。", 1], ["詩性收束", "一口吃不成胖子，但一口一口吃可以。", 0], ["詩性收束", "別等別人催，自己給自己設截止時間。", 0], ["詩性收束", "你平時最頭疼的\"時間殺手\"是什麼？", 0]]], [32, "活了30年才明白，人這輩子最該管好的不是錢包，是這6件事！", "F", "先解決情緒再解決問題→人這輩子該管好的6件事", ["這些年踩過太多坑，終於總結出一套\"人生成長方法論\"，句句扎心，看完少走10年彎路👇", "關於情緒——", "\"先解決情緒，再解決問題\"這句話價值百萬。多少人毀在情緒上頭時說了不該說的話、做了不該做的決定。生氣時，先深呼吸，冷靜3分鐘，你會發現很多事根本不值得發火。", "關於健康——", "運動是唯一穩賺不賠的投資。它能改變你的樣貌、提升你的快樂、讓你變得自律。不信你試試，堅持3個月，整個人脫胎換骨。", "關於說話——", "學會\"想三秒、慢三秒、誇三秒\"。開口前先想清楚，語速慢下來，多夸人少損人，你會發現自己人緣越來越好。", "關於時間——", "瑣事學會斷舍離！把時間留給真正重要的人、真正重要的事。你每天忙得腳不沾地，可能只是在瞎忙。", "關於精力——", "重要的事要用重精力。別拿碎片時間去處理關鍵問題，精力管理比時間管理更重要。", "關於知識——", "讀書得智慧，實踐得經驗，思考得認知。最重要的是\"聯結自我\"，學到的知識要內化於心、應用到行，否則讀再多也是白搭。", "這6大模組管好了，人生想不好都難。", "你覺得自己現在最需要管好哪一塊？評論區告訴我👇#自定義人生故事 #人生關鍵詞 #提升認知能力 #人生效率體系 #如何找到人生目標 #全方位成長 #成長與提升 #個人能力提升 #認知升級突破自我 #搭建個人知識體系", "5月25日"], [["哲學命題", "人這輩子，|最該管好的不是錢包。", 1], ["哲學命題", "這6大模組管好了，人生想不好都難。", 0], ["哲學命題", "這些年踩過太多坑，終於總結出一套\"人生成長方法論\"，|句句扎心，看完少走10年彎路👇", 0], ["哲學命題", "多少人毀在情緒上頭時說了不該說的話、做了不該做的決定。", 0], ["哲學命題", "生氣時，先深呼吸，冷靜3分鐘，|你會發現很多事根本不值得發火。", 0], ["排比句", "管情緒，管身體，|管時間，管關係。", 1], ["對比句", "毀在情緒上的人很多，|管好情緒的人很少。", 1], ["反問句", "你上一次後悔的決定，|是不是在情緒上頭時做的？", 1], ["反問句", "你覺得自己現在最需要管好哪一塊？", 0], ["情境衝突", "生氣時說了不該說的話，|後悔了一輩子。", 1], ["情境衝突", "開口前先想清楚，語速慢下來，|多夸人少損人，你會發現自己人緣越來越好。", 0], ["認知翻轉", "先解決情緒，|再解決問題。", 1], ["層層遞進", "先管情緒，再管身體，|最後管好人生。", 1], ["層層遞進", "先解決情緒，再解決問題這句話價值百萬。", 0], ["詩性收束", "管好這六件事，|少走十年彎路。", 1], ["詩性收束", "別拿碎片時間去處理關鍵問題，|精力管理比時間管理更重要。", 0], ["詩性收束", "讀書得智慧，實踐得經驗，思考得認知。", 0], ["詩性收束", "最重要的是\"聯結自我\"，學到的知識要內化於心、應用到行，|否則讀再多也是白搭。", 0]]], [33, "當了5年管理者，踩過無數坑後才明白：管理能力根本不是“管人”，而是“成事”。", "A", "管理是「成事」→解決問題、讓每人發揮最大價值", ["真正厲害的管理者，從來不是權力最大的那個，而是能讓團隊每個人都發揮最大價值的那個。", "幹了這麼多年，我總結了5條硬核經驗，尤其最後一條，80%的人都沒做到：", "① 解決問題的能力", "遇到難題別躲，你躲了團隊就散了。能扛事的管理者才是團隊的定海神針。", "② 溝通協調的能力", "對上彙報要簡潔，對平協作要共贏，對下輔導要耐心。溝通不行，一切白搭。", "③ 承受壓力的能力", "團隊看你慌，他們更慌。關鍵時刻你穩得住，大家才跟著衝。", "④ 準確辨識的能力", "看見每個人的優勢，把人放對位置。比你自己幹十個小時都管用。", "⑤ 制定把控計劃的能力", "定目標、追過程、糾偏差。計劃不是寫出來的，是盯出來的。", "還有一條“三抓三放”原則，送給大家：", "抓： 方向、漏洞、效率", "放： 自己、權力、員工", "好的管理者，透過別人拿到結果，不是權力的炫耀，而是責任的擔當。", "你做到了幾條？評論區聊聊👇#提升管理能力 #職場核心競爭力 #增強工作能力 #職場管理領導力 #團隊管理 #管理思維 #高層管理者 #領導力 #提升領導力 #能力", "5月25日"], [["哲學命題", "管理能力，|不是管人，是成事。", 1], ["哲學命題", "能扛事的管理者才是團隊的定海神針。", 0], ["哲學命題", "溝通不行，一切白搭。", 0], ["哲學命題", "幹了這麼多年，我總結了5條硬核經驗，|尤其最後一條，80%的人都沒做到", 0], ["哲學命題", "遇到難題別躲，你躲了團隊就散了。", 0], ["排比句", "解決問題，扛得住事，|讓每個人發光。", 1], ["排比句", "對上彙報要簡潔，對平協作要共贏，對下輔導要耐心。", 0], ["對比句", "權力最大的人不一定厲害，|讓團隊發光的人才厲害。", 1], ["對比句", "真正厲害的管理者，從來不是權力最大的那個，|而是能讓團隊每個人都發揮最大價值的那個。", 0], ["對比句", "好的管理者，透過別人拿到結果，|不是權力的炫耀，而是責任的擔當。", 0], ["反問句", "遇到難題時，|你是躲，還是扛？", 1], ["情境衝突", "領導一躲，|團隊就散了。", 1], ["認知翻轉", "真正的管理者，|讓每個人發揮最大價值。", 1], ["層層遞進", "先扛事，再成事，|最後成人。", 1], ["詩性收束", "能扛事的人，|才帶得了隊。", 1], ["詩性收束", "看見每個人的優勢，把人放對位置。", 0], ["詩性收束", "比你自己幹十個小時都管用。", 0], ["詩性收束", "計劃不是寫出來的，是盯出來的。", 0]]], [34, "以前總覺得人生要拼命抓住所有東西，直到讀懂這七條老祖宗的智慧，我才發現：活得通透的人，都懂\"放下\"這二字的分量。", "C", "向死而生、離別是新開始→七條放下的老祖宗智慧", ["一、向死而生，才是真正的活法", "我們從小被教育要\"活著\"，卻沒人告訴我們：正視死亡，才能珍惜活著的每一天。那些活得通透的人，不是怕死，而是知道生命有限，才把每一天都當最後一天去燃燒。", "二、離別不是終點，是新的開始", "\"一別兩寬，各生歡喜\"——這八個字說出了離別的真諦。分手離婚、朋友散夥、親人離去……與其糾纏痛苦，不如祝福彼此。沒有誰離開誰活不下去，轉身是為了遇見更好的風景。", "三、愛情來了不狂喜，走了不挽留", "緣起緣滅，緣聚緣散。這八個字道破了所有感情的真諦。不強求、不執念、不糾纏。能在一起時好好珍惜，分開了就體面告別。執念越深，傷得越重。", "四、己所不欲，勿施於人", "這條說了兩千年，卻依然是最難做到的。多少人嘴上說著\"將心比心\"，做的卻是另一套？你討厭被欺騙，就別騙人；你討厭被忽視，就別冷落別人。推己及人，是最高階的善良。", "五、底線之上，始稱為人", "人和動物的區別，就在於那條看不見的底線。不傷害無辜、不落井下石、不為了利益出賣良心。一旦越過這條線，人就不再是人了。這不是雞湯，是做人的根基。", "六、取之有道，用之有度", "錢這東西，賺的時候別昧良心，花的時候別忘根本。有的人為了賺錢什麼都能做，花錢卻如流水；有的人窮得叮噹響，卻活得坦蕩蕩。財富觀不對，一切都白費。", "七、知行合一，才是真懂", "知道做不到，等於不知道。多少人天天刷手機學知識，轉身就忘得一乾二淨？讀一百本書不如把一條道理實踐到底。格物致知，不是為了炫耀，是為了改變。", "看完這七條，我沉默了很久。你呢？哪一條最戳中你？評論區聊聊👇#人生三境界 #國學經典 #人分三六九等 #聊聊人生觀 #正確的三觀 #國學裡的迴響 #弘揚國學經典文化 #三觀不同性格不合", "5月24日"], [["哲學命題", "活得通透的人，|都懂得放下。", 1], ["哲學命題", "財富觀不對，一切都白費。", 0], ["哲學命題", "一別兩寬，各生歡喜——這八個字說出了離別的真諦。", 0], ["哲學命題", "分手離婚、朋友散夥、親人離去…", 0], ["哲學命題", "沒有誰離開誰活不下去，轉身是為了遇見更好的風景。", 0], ["排比句", "向死而生，|離別是新的開始，|放下才能擁有。", 1], ["排比句", "不傷害無辜、不落井下石、不為了利益出賣良心。", 0], ["對比句", "抓住一切的人疲憊，|懂得放下的人通透。", 1], ["對比句", "那些活得通透的人，不是怕死，|而是知道生命有限，才把每一天都當最後一天去燃燒。", 0], ["對比句", "與其糾纏痛苦，不如祝福彼此。", 0], ["反問句", "你緊緊抓住的，|真的屬於你嗎？", 1], ["反問句", "多少人嘴上說著\"將心比心\"，做的卻是另一套？", 0], ["反問句", "多少人天天刷手機學知識，轉身就忘得一乾二淨？", 0], ["情境衝突", "拚命抓住所有東西，|最後兩手空空。", 1], ["情境衝突", "我們從小被教育要\"活著\"，|卻沒人告訴我們：正視死亡，才能珍惜活著的每一天。", 0], ["情境衝突", "執念越深，傷得越重。", 0], ["情境衝突", "這條說了兩千年，卻依然是最難做到的。", 0], ["情境衝突", "有的人為了賺錢什麼都能做，花錢卻如流水；|有的人窮得叮噹響，卻活得坦蕩蕩。", 0], ["認知翻轉", "放下，|是最難也最重要的功課。", 1], ["層層遞進", "先面對，再接受，|最後放下。", 1], ["詩性收束", "鬆開手，|才能接住新的禮物。", 1], ["詩性收束", "讀一百本書不如把一條道理實踐到底。", 0], ["詩性收束", "格物致知，不是為了炫耀，是為了改變。", 0], ["詩性收束", "看完這七條，我沉默了很久。", 0]]], [35, "以前總覺得中醫太玄乎，直到深入瞭解五臟之間的關係，才發現人體原來是個精密的“團隊”！", "G", "肝腎同源、心腎相交→五臟是相互協作的精密團隊", ["你可能不知道，我們的心、肝、脾、肺、腎並不是各自為戰，而是相互協作、彼此影響：", "① 肝腎是鐵哥們——肝藏血、腎藏精，倆人堪稱“精血同源”。熬夜傷肝，久了腎也遭殃，這就是為什麼養肝其實也在補腎。", "② 心腎是歡喜冤家——腎水要上去滋潤心陰，心火要下來溫暖腎陽。睡不著、容易上火？可能是心腎不交。", "③ 脾肺是後勤搭檔——脾負責把食物變成營養，肺負責把營養佈散全身。想皮膚好、免疫力強？這對CP得一起養。", "④ 氣血是總指揮——“氣為血之帥，氣行則血行”。氣推著血走，氣堵了血就瘀，所以養生先養氣。", "⑤ 五臟是個圈——肝→心→脾→肺→腎→肝，誰弱了都會拖累下一個。", "學完才發現，養生不是補這補那，而是維持五臟平衡。你們平時是怎麼養生的？評論區聊聊👇#五臟六腑的功能 #瞭解自己的身體 #心肝脾肺腎 #經絡 #中醫健康養生知識 #傳承中醫養生文化 #十二經脈循行 #中醫是中國的 #五色補五臟 #順應四季養生", "5月24日"], [["哲學命題", "人體，|是一個精密的團隊。", 1], ["哲學命題", "肝腎是鐵哥們——肝藏血、腎藏精，|倆人堪稱“精血同源”。", 0], ["哲學命題", "心腎是歡喜冤家——腎水要上去滋潤心陰，|心火要下來溫暖腎陽。", 0], ["哲學命題", "脾肺是後勤搭檔——脾負責把食物變成營養，|肺負責把營養佈散全身。", 0], ["排比句", "肝腎同源，|心腎相交，|脾肺相生。", 1], ["對比句", "各自為戰的身體會病，|相互協作的身體會好。", 1], ["對比句", "你可能不知道，我們的心、肝、脾、肺、腎並不是各自為戰，|而是相互協作、彼此影響", 0], ["對比句", "學完才發現，養生不是補這補那，而是維持五臟平衡。", 0], ["反問句", "你熬夜傷肝的時候，|知道腎也在受苦嗎？", 1], ["反問句", "想皮膚好、免疫力強？", 0], ["反問句", "你們平時是怎麼養生的？", 0], ["情境衝突", "以為只是一個器官的問題，|其實全身都在受影響。", 1], ["認知翻轉", "五臟不是各自為戰，|是彼此影響。", 1], ["認知翻轉", "熬夜傷肝，久了腎也遭殃，|這就是為什麼養肝其實也在補腎。", 0], ["層層遞進", "先懂關係，再養護，|最後整體平衡。", 1], ["層層遞進", "五臟是個圈——肝→心→脾→肺→腎→肝，|誰弱了都會拖累下一個。", 0], ["詩性收束", "養一臟，|就是在養全身。", 1], ["詩性收束", "氣血是總指揮——“氣為血之帥，氣行則血行”。", 0], ["詩性收束", "氣推著血走，氣堵了血就瘀，所以養生先養氣。", 0]]], [36, "幸虧我當年悟透了這7條人性規則，不然早被人坑慘了！", "B", "誰最窮誰話少、誰話多誰栽跟頭→7條人性規則", ["社會摸爬滾打十幾年，我發現有些規律你越早懂越好：", "朋友中，誰最窮，誰就話少。", "不是不想說，是說多了沒人聽。窮過的人才懂，尊嚴這玩意兒，得省著用。", "職場中，誰話多，誰栽跟頭多。", "開會時搶著表態的，往往最先被當槍使。聰明人都在臺下默默觀察，等時機到了才出手。", "感情中，誰主動，誰就被動。", "追得越用力，對方越不珍惜。人性就是這樣：太容易得到的東西，沒人會當回事。", "辦事中，誰儘量，誰就辦不成。", "你越客氣，人家越覺得你不急。做事狠一點，反而沒人敢糊弄你。", "借錢時，誰發誓，誰就不還錢。", "真還錢的人不用承諾，賴賬的人才把話說得比唱還好聽。", "體制內，誰圓滑，誰升得快。", "不是能力不行，是稜角太分明的人，領導用著不放心。", "交往中，誰甜言蜜語，誰最不靠譜。", "嘴上抹蜜的，往往腳底抹油。真正靠譜的人，話少但事穩。", "看完這7條，我沉默了——不是社會太現實，是人性本就如此。", "早點看清規則，才能少走彎路。", "你認同哪一條？有沒有親身經歷？評論區聊聊👇#社會就是人情世故 #人生領悟道理 #吃虧人常在 #為人處事學問 #會說話會辦事會做人 #做人的道理和為人處事 #人情世故要看透 #為人處事情商 #大實話說的句句在理 #為人處世的方法", "5月24日"], [["哲學命題", "有些規律，|越早懂越好。", 1], ["哲學命題", "人性就是這樣：太容易得到的東西，沒人會當回事。", 0], ["哲學命題", "朋友中，誰最窮，誰就話少。", 0], ["哲學命題", "不是不想說，是說多了沒人聽。", 0], ["哲學命題", "職場中，誰話多，誰栽跟頭多。", 0], ["排比句", "誰最窮誰話少，|誰話多誰栽跟頭，|誰最急誰先輸。", 1], ["對比句", "說多錯多，|話少的人保全自己。", 1], ["對比句", "做事狠一點，反而沒人敢糊弄你。", 0], ["反問句", "開會搶著表 其樂。", "錢不多、房不大，照樣能活得舒坦。多少人住著大房子卻一臉愁容？快樂這東西，從來不跟銀行餘額掛鉤。", "第三條：順境不驕，逆境不餒。", "得意時別飄，失意時別躺。見過太多人高光時刻目中無人，低谷時期一蹶不振。穩住，才能贏到最後。", "第四條：臨事不懼，處變不驚。", "遇到事別慌慌張張亂陣腳。你慌，問題不會消失；你穩，至少能看清路。", "第五條：不為外物所役，不為虛名所困。", "多少人活成了\"房奴\"\"車奴\"\"面子奴\"？別讓身外之物牽著你的鼻子走。", "第六條：不為情慾所牽，不為喧囂所擾。", "資訊爆炸時代，每天被各種訊息轟炸。學會遮蔽噪聲，守住內心那片淨土。", "第七條：上合天道，下應人心，忠守己身。", "說白了就是：做人有底線，做事有原則，做夢有方向。", "讀到最後一句\"聖賢不朽之道\"，我沉默了。", "古人的智慧穿越千年依然適用，不是沒有道理的。他們早就把人性看透了，把人生的起起落落摸清楚了。", "所以啊，別總覺得老祖宗的東西過時了。有些道理，真的是越活越懂。", "你們覺得哪一條最戳中你現在的狀態？#天之道損有餘而補不足 #修身養性陶冶情操 #大道至簡 #國學傳承 #止語是一種修行 #國學裡的迴響 #為學日益為道日損 #弘揚國學經典文化 #道德經 #弱者道之用", "5月23日"], [["哲學命題", "窮則獨善其身，|達則兼濟天下。", 1], ["哲學命題", "快樂這東西，從來不跟銀行餘額掛鉤。", 0], ["哲學命題", "他們早就把人性看透了，把人生的起起落落摸清楚了。", 0], ["哲學命題", "今天把《聖賢之道》重新讀了一遍，|挑出7條特別扎心的分享給大家——", 0], ["哲學命題", "窮則獨善其身，達則兼濟天下。", 0], ["排比句", "低谷顧自己，|高峰幫別人，|始終守本心。", 1], ["排比句", "說白了就是：做人有底線，做事有原則，做夢有方向。", 0], ["對比句", "低谷時亂折騰的人更慘，|低谷時顧好自己的人能翻身。", 1], ["反問句", "低谷的時候，|你在瞎折騰嗎？", 1], ["反問句", "多少人住著大房子卻一臉愁容？", 0], ["反問句", "多少人活成了\"房奴\"\"車奴\"\"面子奴\"？", 0], ["反問句", "你們覺得哪一條最戳中你現在的狀態？", 0], ["情境衝突", "被焦慮內耗折磨得睡不著，|才懂老祖宗的話。", 1], ["情境衝突", "有些道理，真的是越活越懂。", 0], ["認知翻轉", "聖賢之道，|不是雞湯，是生存智慧。", 1], ["層層遞進", "先顧好自己，再有能力，|最後幫別人。", 1], ["層層遞進", "不是鼓勵你當鹹魚，而是告訴你：低谷期先把自己顧好，|別瞎折騰；|有能力了再想著幫別人。", 0], ["詩性收束", "字字珠璣，|句句是路。", 1], ["詩性收束", "讀到最後一句\"聖賢不朽之道\"，我沉默了。", 0], ["詩性收束", "古人的智慧穿越千年依然適用，不是沒有道理的。", 0], ["詩性收束", "所以啊，別總覺得老祖宗的東西過時了。", 0]]], [39, "以前總覺得要把自己活成一座山，別人一眼就能看到你的高度。直到在職場摸爬滾打十年，我才突然明白：真正厲害的人，往往活得像一片海——表面平靜，卻深不可測。", "B", "活成一片海：情緒穩、不戳破、話少→處世鐵律", ["身邊有個前輩，永遠情緒穩定，你氣得跳腳他也能笑著說\"慢慢來\"；他看透了你的算計卻從不當面戳破，反而給你留了臺階；他話不多，但句句說到點上；他從不爭強好勝，反而總能贏到最後。", "我想了很久，總結出幾條處世鐵律：", "第一，情緒極穩，喜怒不形於色。", "別人急你冷靜，別人躁你淡定。這不是沒脾氣，而是明白情緒失控只會讓事情更糟。", "第二，看透不說透，凡事留餘地。", "即使知道別人在耍心眼，也不當眾揭穿。給別人留面子，就是給自己留後路。", "第三，懂得示弱，不逞一時之強。", "不是真弱，而是把鋒芒藏起來。硬碰硬是莽夫，四兩撥千斤才是高手。", "第四，話少心明，言多必失。", "與其說十句廢話，不如說一句有用的。沉默的人，往往是最清醒的人。", "第五，恩怨有度，不記仇也不濫善。", "該原諒的原諒，該翻臉的翻臉。別人對你好，你記住；別人傷你，你放下。", "第六，懂得藏拙，不顯山不露水。", "真正厲害的人，從來不會把自己的底牌亮出來。讓人猜不透你，才能永遠掌控局面。", "藏鋒守拙，方得始終。人生最高的境界，不是讓別人仰望你，而是讓別人不敢小看你。", "你覺得哪一條最戳中你？評論區聊聊👇#弘揚國學經典文化 #格局炸 量瞬間凝聚的結果。那些靈感爆發的時刻，本質上是你接收到了宇宙能量。", "第二條：念頭生出想法", "念頭一閃就過了，但如果你反覆想、持續琢磨，它就變成了想法。這個階段最關鍵，因為想法是有\"續航能力\"的。", "第三條：想法生出物質", "這就是最震撼的部分！你的想法會反向凝聚能量，最終顯化成物質——你的房子、你的事業、你的人際關係，都是你內在想法的\"投影\"。", "第四條：物質生出能量", "最後，物質世界又產生新的能量。你擁有的東西會塑造你的思維，你所處的圈子會影響你的能量頻率，形成新的念頭。", "這個閉環的核心只有四個字：順者昌，逆者亡。", "順應規律——想法純粹、念頭乾淨、能量正向，財富健康自然來。", "逆著來——負能量→負面念頭→消極想法→糟糕現實，惡性迴圈永不停止。", "天道、地道、人道、物道，最終都歸到這四個字。", "你卡在哪個環節了？是念頭太多太亂，還是想法持久不了，或者物質顯化總是不如人意？", "評論區告訴我：你的能量閉環，現在在哪個節點？#意識決定物質 #順逆皆宜的人生 #物質決定意識 #改變命運 #事物發展規律 #看透萬物的本質 #超越二元對立 #生存法則 #意識創造一切 #意識能量層級", "5月22日"], [["哲學命題", "道生一，一生二，|二生三，三生萬物。", 1], ["哲學命題", "能量無形無相，看不見摸不著，|但它才是宇宙真正的\"原材料\"。", 0], ["哲學命題", "那些靈感爆發的時刻，本質上是你接收到了宇宙能量。", 0], ["哲學命題", "這就是最震撼的部分！", 0], ["哲學命題", "而我們普通人每天都在和這個規律打交道，只是渾然不覺", 0], ["排比句", "能量生念頭，|念頭生行動，|行動生命運。", 1], ["排比句", "天道、地道、人道、物道，最終都歸到這四個字。", 0], ["排比句", "你的想法會反向凝聚能量，最終顯化成物質——你的房子、你的事業、你的人際關係，|都是你內在想法的\"投影\"。", 0], ["對比句", "不懂規律的人被命運推著走，|懂規律的人創造命運。", 1], ["反問句", "你的命運，|是從哪個念頭開始的？", 1], ["反問句", "是念頭太多太亂，還是想法持久不了，|或者物質顯化總是不如人意？", 0], ["情境衝突", "一個念頭0.3秒，|卻改變了一生。", 1], ["情境衝突", "你突然想創業、想辭職、想追一個人——都是能量瞬間凝聚的結果。", 0], ["認知翻轉", "老祖宗說的道，|其實就是能量。", 1], ["認知翻轉", "老祖宗說的道，其實就是能量。", 0], ["層層遞進", "先看念頭，再看行動，|最後看命運。", 1], ["層層遞進", "逆著來——負能量→負面念頭→消極想法→糟糕現實，|惡性迴圈永不停止。", 0], ["詩性收束", "掌握了念頭，|就掌握了命運。", 1], ["詩性收束", "你擁有的東西會塑造你的思維，|你所處的圈子會影響你的能量頻率，形成新的念頭。", 0], ["詩性收束", "這個閉環的核心只有四個字：順者昌，逆者亡。", 0], ["詩性收束", "順應規律——想法純粹、念頭乾淨、能量正向，|財富健康自然來。", 0]]], [42, "真沒想到！一個人真正的能量層次，居然不是靠拼命努力就能提升的……", "D", "能力→…四層能量金字塔→拼命努力不等於能量提升", ["我以前總覺得，只要拼命學習、提升技能、多賺錢，就能越來越有能量。但看了這個四層能量金字塔模型後，我徹底破防了。", "這個模型把人的能量從低到高分成了四層：", "第一層，也是最底層，是能力——專業技能、知識積累、經驗沉澱。這是最容易獲得的，花時間學就能有。", "第二層，是業力——行為模式、心理狀態、原生家庭的影響。這層很多人意識不到，你的過去、你的原生家庭，一直在暗暗操控你。", "第三層，是心力——情緒管理、抗壓能力、自我驅動。這層決定了你能扛多少事、能走多遠。", "第四層，最頂層，是願力——人生使命、價值追求、堅定信仰。這才是真正的發動機！", "扎心的事實是：大多數人一輩子都卡在第一層，不斷學技能、不斷努力，但如果沒有上面的三層支撐，能力再強也會內耗枯竭。", "這就像一輛車，能力是車輪，業力是底盤，心力是發動機，願力才是方向盤。沒有方向盤，車再強也可能是往錯誤的方向狂奔。", "所以真正的能量建設，不是單點突破，而是四層同時升級。你們的能量，現在卡在哪一層了？#內在力量建設 #念力的力量 #力量與智慧 #如何在生活中獲取你的力量 #意識能量層級 #願力改變人生 #智慧與力量 #財富與內心雙重增長 #探索內在力量 #激發內在動力", "5月22日"], [["哲學命題", "能量層次，|不是拚命努力就能提升。", 1], ["哲學命題", "最頂層，是願力——人生使命、價值追求、堅定信仰。", 0], ["哲學命題", "這才是真正的發動機！", 0], ["哲學命題", "這就像一輛車，能力是車輪，|業力是底盤，心力是發動機，願力才是方向盤。", 0], ["哲學命題", "但看了這個四層能量金字塔模型後，我徹底破防了。", 0], ["排比句", "能力、認知、|格局、心性。", 1], ["對比句", "只提升能力的人卡在底層，|修煉心性的人登上頂端。", 1], ["對比句", "所以真正的能量建設，不是單點突破，而是四層同時升級。", 0], ["反問句", "你拚命努力，|為什麼還是沒能量？", 1], ["反問句", "你們的能量，現在卡在哪一層了？", 0], ["情境衝突", "學了很多技能，|卻越來越累。", 1], ["認知翻轉", "能量金字塔，|最底層才是能力。", 1], ["認知翻轉", "我以前總覺得，只要拼命學習、提升技能、多賺錢，|就能越來越有能量。", 0], ["層層遞進", "先有能力，再升認知，|最後修心性。", 1], ["層層遞進", "這個模型把人的能量從低到高分成了四層", 0], ["詩性收束", "往上走一層，|世界就大一圈。", 1], ["詩性收束", "這層決定了你能扛多少事、能走多遠。", 0], ["詩性收束", "扎心的事實是：大多數人一輩子都卡在第一層，|不斷學技能、不斷努力，但如果沒有上面的三層支撐，能力再強也會內耗枯竭。", 0], ["詩性收束", "沒有方向盤，車再強也可能是往錯誤的方向狂奔。", 0]]], [43, "你有沒有算過，這輩子欠了多少人的恩情？", "C", "生養、教誨、知遇…人生八種恩情", ["昨天深夜刷到一個影片：一位老人躺在病床上，子女都不在身邊，只有老伴一直握著她的手。配文寫著：\"這輩子最對不起的人，是陪了我40年的她。\"", "看完鼻子一酸。", "仔細想想，人生這八種恩情，你還記得清嗎？", "生養之恩——父母從你呱呱墜地那天起，就把一生都押在了你身上。他們省吃儉用，供你讀書、給你買房、幫你帶娃，從不求回報。這份恩情，是這輩子欠得最多的。", "救命之恩——危難時拉你一把的人，你還記得嗎？可能是救你於水火的陌生人，也可能是關鍵時刻踹你一腳讓你躲過危險的摯友。這份恩情，此生難報。", "幫扶之恩——當你跌入谷底、落魄無助時，是誰願意雪中送炭？那個不嫌棄你窮、不怕被你連累的人，值得你記一輩子。", "知己之恩——這年頭，酒肉朋友遍地都是，真正懂你的人卻鳳毛麟角。如果遇到一個知道你沉默背後藏著什麼的人，請珍惜。", "伴侶之恩——吵過那麼多架，鬧過那麼多次離婚，最後還是攜手走完了半生。回頭看看，枕邊人的那份不離不棄，才是最珍貴的。", "陪伴之恩——那些在你最難的年份依然陪在身邊的人，不是因為你有多好，而是他們捨不得放下這份情誼。", "看完這些，你想對誰說一聲\"謝謝\"？", "人到中年才明白：最大的遺憾不是沒能出人頭地，而是那些想報答的恩情，再也來不及了。", "你心裡最放不下的，是哪份恩？#感恩的心態 #創造有意義的人生 #感恩日記 #人生轉折點 #感恩 #人生的態度 #心懷感恩與愛同行 #祝福的力量 #願力改變人生 #該有的人生態度", "May 20"], [["哲學命題", "你有沒有算過，|欠了多少人的恩情？", 1], ["哲學命題", "回頭看看，枕邊人的那份不離不棄，才是最珍貴的。", 0], ["哲學命題", "配文寫著：這輩子最對不起的人，是陪了我40年的她。", 0], ["哲學命題", "生養之恩——父母從你呱呱墜地那天起，|就把一生都押在了你身上。", 0], ["哲學命題", "他們省吃儉用，供你讀書、給你買房、幫你帶娃，|從不求回報。", 0], ["排比句", "生養之恩，教誨之恩，|知遇之恩，陪伴之恩。", 1], ["對比句", "忘恩的人越走越孤單，|記恩的人越走越溫暖。", 1], ["對比句", "陪伴之恩——那些在你最難的年份依然陪在身邊的人，|不是因為你有多好，而是他們捨不得放下這份情誼。", 0], ["對比句", "人到中年才明白：最大的遺憾不是沒能出人頭地，|而是那些想報答的恩情，再也來不及了。", 0], ["反問句", "陪你最久的那個人，|你對他說過謝謝嗎？", 1], ["反問句", "仔細想想，人生這八種恩情，你還記得清嗎？", 0], ["反問句", "救命之恩——危難時拉你一把的人，你還記得嗎？", 0], ["反問句", "幫扶之恩——當你跌入谷底、落魄無助時，|是誰願意雪中  "多少人天天算命問卦，卻不願意把手頭的事做好？結果呢，越算越慌，越燒越窮。", "真正的道理其實很簡單：做好分內事，不需要鬼神賜良方。", "最讓我破防的是最後一段——", "\"人生一半在於我，另外一半在於天。都是黃泉預約客，何苦為難每一天。\"", "你我都是黃泉路上的過客，遲早都要下車。那還爭什麼呢？", "所以啊，放過自己吧。", "與其糾結\"為什麼是我\"，不如想想\"接下來怎麼辦\"。", "你最近被什麼事困住了？說出來，咱們一起聊聊。#天道有輪迴蒼天繞過誰 #大道至簡 #天道有輪迴 #萬法皆空因果不空 #天道無親常與善人 #人生就是場修行 #道法自然隨緣自在 #修身養性禪語人生 #天之道損有餘而補不足 #道家文化", "5月20日"], [["哲學命題", "大多數的痛苦，|都是自己給的枷鎖。", 1], ["哲學命題", "還有一句更扎心——窮算命運富燒香，顛顛倒倒問陰陽。", 0], ["哲學命題", "人生一半在於我，另外一半在於天。", 0], ["哲學命題", "昨天讀到王陽明心學的幾句詩，讓我愣在原地好久——", 0], ["哲學命題", "躲天意避因果，諸般枷鎖困真我。", 0], ["排比句", "躲天意，避因果，|困真我。", 1], ["對比句", "越躲越焦慮，|越順越自在。", 1], ["對比句", "與其糾結\"為什麼是我\"，不如想想\"接下來怎麼辦\"。", 0], ["反問句", "你一直在躲的，|是命運，還是自己？", 1], ["反問句", "多少人天天算命問卦，卻不願意把手頭的事做好？", 0], ["反問句", "你最近被什麼事困住了？", 0], ["情境衝突", "總想逃避，|結果越逃越迷茫。", 1], ["認知翻轉", "順天意成因果，|今日方知我是我。", 1], ["認知翻轉", "以前總覺得命運不公，總想躲、想避、想逃。", 0], ["認知翻轉", "直到我讀懂這句話：不是老天在為難你，|是你自己在為難自己。", 0], ["認知翻轉", "真正的道理其實很簡單：做好分內事，不需要鬼神賜良方。", 0], ["層層遞進", "先停止躲避，再順應，|最後成為自己。", 1], ["層層遞進", "越躲越焦慮，越避越迷茫。", 0], ["層層遞進", "結果呢，越算越慌，越燒越窮。", 0], ["詩性收束", "開啟枷鎖的鑰匙，|在你自己手裡。", 1], ["詩性收束", "你我都是黃泉路上的過客，遲早都要下車。", 0], ["詩性收束", "所以啊，放過自己吧。", 0], ["詩性收束", "說出來，咱們一起聊聊。", 0]]], [46, "\"苦才是人生\"——這話我聽了二十幾年，直到35歲才發現自己被騙了。", "B", "苦只是開胃菜→「謙」才拉開差距→藏鋒守穩", ["苦只是人生的開胃菜，真正拉開差距的，是\"謙\"這個字。", "年輕人總覺得能熬夜、能加班、能扛事就是本事，殊不知真正厲害的人，早就把姿態放低了。越有本事，越懂得藏鋒。", "你以為累死累活是努力？錯了，職場最稀缺的能力是\"穩\"。遇事不慌、不甩鍋、能兜底，才是一個人真正的底氣。", "還有句話扎心又真實——\"舍才是得到\"。捨不得的人，往往什麼都抓不住。那些人脈廣的人，不是天生會交際，而是懂一個道理：先給予，再索取。", "最後一條最扎心：放才是心態。你有沒有發現，越想抓住什麼，越容易失去什麼？學會放下執念，反而能走得更遠。", "這10條處世智慧，每一條都是用教訓換來的。不信你對照看看，自己中了幾條？#處世智慧 #處事智慧 #處事之道人生感悟 #做人的道理和為人處事 #為人處世生活感悟 #為人處世的方法 #思維格局處事智慧 #不斷提升自己的格局和見識 #為人處世的智慧 #思路決定出路格局決定結局", "5月20日"], [["哲學命題", "苦，|只是人生的開胃菜。", 1], ["哲學命題", "苦只是人生的開胃菜，真正拉開差距的，是\"謙\"這個字。", 0], ["哲學命題", "遇事不慌、不甩鍋、能兜底，才是一個人真正的底氣。", 0], ["哲學命題", "還有句話扎心又真實——\"舍才是得到\"。", 0], ["哲學命題", "年輕人總覺得能熬夜、能加班、能扛事就是本事，|殊不知真正厲害的人，早就把姿態放低了。", 0], ["排比句", "謙虛、低調、|藏鋒、穩重。", 1], ["對比句", "能熬夜能加班不是本事，|懂得謙卑才是本事。", 1], ["對比句", "學會放下執念，反而能走得更遠。", 0], ["反問句", "你以為累死累活|就是努力嗎？", 1], ["反問句", "你以為累死累活是努力？", 0], ["反問句", "你有 、苦過的人，|什麼委屈都能嚥下，什麼臉面都能放下。", 0], ["詩性收束", "所以別輕易看不起那些\"不要臉\"的人，|他們只是被生活逼到了牆角。", 0], ["詩性收束", "老話不老，句句是教訓。", 0]]], [50, "很多人混了大半輩子，才突然發現——酒局、茶局、飯局、牌局，局局不簡單，處處皆修行。", "B", "酒局聽真話、茶局看格局、飯局飯局…局局皆修行", ["以前總覺得酒局就是喝酒喝到吐，後來才明白：酒局不是為了喝酒，而是聽真心話。幾杯下肚，平時端著的人突然卸下面具，那些藏在心底的話才敢往外說。真正聰明的人，不是在酒桌上逞能，而是善於在別人的醉話裡聽門道。", "你以為茶局是品茗閒聊？太天真了。茶局不是為了喝茶，而是商量謀事。真正的大事，往往不在會議室裡敲定，而是在一壺好茶的清香裡，你來我往地試探底線、敲定細節。茶是媒介，話才是主角。", "飯局更不是單純吃飯。飯局不是為了吃飯，而是分配價值。誰坐主位、誰先動筷子、誰敬酒時說什麼話——這些都是訊號。能在飯局上讀懂這些訊號的人，要麼是規則的制定者，要麼是規則的適應者。", "至於牌局？表面是消遣娛樂，實際上是性格照妖鏡。打牌時人是急躁還是沉穩，是計較還是灑脫，幾圈下來一清二楚。看透一個人，打一場牌就夠了。", "看透局，才能破局。人生的修行，不在書本里，不在雞湯裡，就在這一個又一個局裡。", "你同意嗎？來聊聊你經歷過的那些“局”。#開啟眼界和格局 #人生四個階段 #人生不同階段 #格局和眼界 #格局決定結局 #思路決定出路格局決定結局 #拒絕酒桌職場 #不斷提升自己的格局和見識 #謀局做局破局 #開啟思維格局", "5月19日"], [["哲學命題", "局局不簡單，|處處皆修行。", 1], ["哲學命題", "茶是媒介，話才是主角。", 0], ["哲學命題", "人生的修行，不在書本里，|不在雞湯裡，就在這一個又一個局裡。", 0], ["哲學命題", "真正的大事，往往不在會議室裡敲定，|而是在一壺好茶的清香裡，你來我往地試探底線、敲定細節。", 0], ["哲學命題", "幾杯下肚，平時端著的人突然卸下面具，|那些藏在心底的話才敢往外說。", 0], ["排比句", "酒局聽真話，|茶局看格局，|飯局看人品。", 1], ["排比句", "誰坐主位、誰先動筷子、誰敬酒時說什麼話——這些都是訊號。", 0], ["對比句", "把酒局當喝酒的人醉了，|把酒局當修行的人醒了。", 1], ["對比句", "以前總覺得酒局就是喝酒喝到吐，|後來才明白：酒局不是為了喝酒，而是聽真心話。", 0], ["對比句", "真正聰明的人，不是在酒桌上逞能，|而是善於在別人的醉話裡聽門道。", 0], ["對比句", "茶局不是為了喝茶，而是商量謀事。", 0], ["對比句", "飯局不是為了吃飯，而是分配價值。", 0], ["反問句", "你在酒桌上，|是逞能，還是在聽？", 1], ["反問句", "你以為茶局是品茗閒聊？", 0], ["情境衝突", "喝到吐的人，|什麼都沒聽到。", 1], ["認知翻轉", "每一個局，|都是看人的機會。", 1], ["層層遞進", "先觀察，再傾聽，|最後讀懂人心。", 1], ["詩性收束", "在醉話裡，|聽出門道。", 1], ["詩性收束", "打牌時人是急躁還是沉穩，|是計較還是灑脫，幾圈下來一清二楚。", 0], ["詩性收束", "看透一個人，打一場牌就夠了。", 0], ["詩性收束", "來聊聊你經歷過的那些“局”。", 0]]], [51, "混跡職場二十年，我見過太多人死於\"不會站隊\"四個字。", "B", "團結、拉攏、放棄、孤立、打擊、利用→站隊六策", ["政治的本質，從來不是什麼高深莫測的東西，就是六件事：團結、拉攏、放棄、孤立、打擊、利用。把這六策用明白，你就是高手；用不明白，處處被動。", "團結：把朋友搞得多多的，敵人搞得少少的。這是戰略總基調，是首要問題。誰是你的基本盤？先把這些人攏住。", "拉攏：對中間派或潛在盟友，靠利益交換與妥協來爭取。沒有永恆的敵人，只有永恆的利益。給夠籌碼，敵人也能變朋友。", "放棄：理性捨棄難以爭取或價值低的群體。精力資源有限，當斷不斷，反受其亂。別在不值得的人身上浪費感情。", "孤立：使對手陷於道義或力量上的孤立。讓他的朋友越來越少，呼應越來越弱。把敵人陷於汪洋大海之中。", "打擊：對核心威脅或頑固對手，堅決壓制，不留後患。宜將剩勇追窮寇，不可沽名學霸王。", "利用：對臨時盟友或可用力量，暫借其力達成階段性目標，用後視情處置。不管黑貓白貓，抓住老鼠就是好貓。", "總結一句話：權謀的本質，就是分清敵我，用好六策。", "你在 你一起慢慢變老，|把日子過成詩。", 0]]], [53, "老一輩常說\"嘴上沒規矩，腳下沒根\"，這話我活了30年才真正聽懂。", "C", "客不坐東、茶倒七分滿→規矩裡的人情社會密碼", ["小時候不懂，為什麼爺爺每次端茶倒水都要\"七分滿\"，為什麼家裡來客人他非要坐北朝南，後來才明白——這些規矩裡，藏著幾千年中國人情社會的密碼。", "① 客不坐東，主不朝北", "東邊是上首，留給最尊貴的客人；主人不朝北坐，是謙卑。你要是大大咧咧往主位一坐，老輩人嘴上不說，心裡已經給你打了低分。", "② 茶七飯八，酒滿敬人", "倒茶七分滿，是怕燙著客人，也留三分餘地；盛飯八分滿，是給人留夾菜的空間；唯獨酒要倒滿，這是規矩——酒不滿，心不誠。", "③ 紅事不請不去，白事不請自來", "喜事你不去，主人家可能只是客氣；但白事你不請自來，那是\"給面子\"。喪事面前，街坊鄰居自動到場幫忙，這是老祖宗留下的集體溫情。", "④ 窮不走親，富不還鄉", "窮的時候去走親戚，人家為難，你也尷尬；富了回鄉炫耀，只會讓曾經幫過你的人心裡不是滋味。人情這東西，比錢難算得多。", "⑤ 借物按時還，再借不難言", "借了東西主動還，這是信用；拖拖拉拉讓人催，下次再借？門都沒有。人和人的信任，就是在這些小事上一分一分攢起來的。", "⑥ 敲門敲三下，不敲四五下", "敲門敲三下是規矩，敲四五下顯得急躁、不穩重。老一輩說\"敲門見人品\"，不是沒有道理。", "⑦ 三歲不進廟，六歲不上墳，清晨不借錢，下午不探病", "這些聽著迷信，細想都是人情智慧——清晨借錢讓人一天不安，下午探病顯得像是\"催命\"。", "看完這些規矩，我最大的感觸是：規矩不是束縛，是前人踩過的坑。", "你還記得家裡長輩教過你哪些\"老規矩\"？評論區說說，看誰家規矩最多👇#老規矩不能忘 #為人處世生活感悟 #老祖宗留下來的規矩 #老祖宗的智慧 #規矩就是規矩 #不聽老人言吃虧在眼前 #謀略古人的智慧 #為人處世人情世故 #為人處世的方法 #處世智慧", "5月19日"], [["哲學命題", "嘴上沒規矩，|腳下沒根。", 1], ["哲學命題", "人和人的信任，就是在這些小事上一分一分攢起來的。", 0], ["哲學命題", "這些聽著迷信，細想都是人情智慧——清晨借錢讓人一天不安，|下午探病顯得像是\"催命\"。", 0], ["哲學命題", "東邊是上首，留給最尊貴的客人；|主人不朝北坐，是謙卑。", 0], ["哲學命題", "你要是大大咧咧往主位一坐，|老輩人嘴上不說，心裡已經給你打了低分。", 0], ["排比句", "客不坐東，|主不朝北，|茶倒七分滿。", 1], ["排比句", "倒茶七分滿，是怕燙著客人，也留三分餘地；|盛飯八分滿，是給人留夾菜的空間；|唯獨酒要倒滿，這是規矩——酒不滿，心不誠。", 0], ["對比句", "不懂規矩的人處處失禮，|懂規矩的人處處得體。", 1], ["反問句", "你知道爺爺倒茶，|為什麼只倒七分滿嗎？", 1], ["反問句", "借了東西主動還，這是信用；|拖拖拉拉讓人催，下次再借？", 0], ["反問句", "你還記得家裡長輩教過你哪些\"老規矩\"？", 0], ["情境衝突", "小時候不懂規矩，|長大了才知道是密碼。", 1], ["認知翻轉", "規矩裡，|藏著人情社會的密碼。", 1], ["認知翻轉", "小時候不懂，為什麼爺爺每次端茶倒水都要\"七分滿\"，|為什麼家裡來客人他非要坐北朝南，後來才明白——這些規矩裡，藏著幾千年中國人情社會的密碼。", 0], ["層層遞進", "先學規矩，再懂意義，|最後得體。", 1], ["詩性收束", "七分滿的茶，|三分留給情。", 1], ["詩性收束", "老一輩說\"敲門見人品\"，不是沒有道理。", 0], ["詩性收束", "三歲不進廟，六歲不上墳，清晨不借錢，下午不探病", 0], ["詩性收束", "看完這些規矩，我最大的感觸是：規矩不是束縛，|是前人踩過的坑。", 0]]], [54, "以前總覺得\"日久見人心\"這話太老套，直到在社會摸爬滾打這些年，才明白這句話是真道理。", "B", "對父母不孝其心必冷→日久見人心的7條看人法", ["有些人，你風光時圍著你轉，你落難了跑得比誰都快。", "有人對你落井下石，有人對你輕諾寡信，有人稱兄道弟卻翻臉不認人。", "其實看清一個人，只需記住這7條就夠了：", "對父母不孝不敬的人，其心必冷——連生養之恩都能辜負，你還能指望他什麼？", "對弱者凌弱畏強的人，其性必卑——欺負弱小卻對權貴點頭哈腰，這種人脊樑早就彎了。", "對承諾輕諾寡信的人，其言必虛——話說得越漂亮的人，往往越不靠譜。" 標清晰）", "② 為什麼做這個？（意義明確）", "③ 具體怎麼幹？（流程方法步驟）", "④ 我需要哪些資源支援？", "⑤ 遇到卡點找誰解決？", "這5條想清楚，一天的工作就成功了一半。", "晚上下班前，再問自己5個問題：", "① 今天目標完成了多少？", "② 做對了哪幾件事？", "③ 哪裡還能做得更好？", "④ 同樣的問題下次怎麼辦？", "⑤ 怎麼調整才能達到預期結果？", "覆盤不是自我批判，是迭代最佳化的開始。", "帶團隊記住這個口訣：盯、練、逼、想、批。", "講過了的事情——盯，緊盯進度和結果；", "不會做的事情——練，多給鍛鍊機會別怕犯錯；", "覺得不可能的事——逼，逼一把才能激發潛能；", "真的沒辦法時——想，辦法總比困難多；", "遇到甩鍋扯皮的——批，必須狠批，不能讓壞風氣傳染。", "盯練逼想批，缺一不可。", "很多新手管理者問我：為什麼員工總是不推不動？我說，因為你只佈置不跟進，只安排不檢查，只原諒不追責。", "管理不是當好人，是當有結果的人。", "你是管理者嗎？來評論區說說，你踩過哪些管理坑？#提升管理能力 #高層管理者 #團隊管理 #職場向上管理秘籍 #打造高效團隊 #領導力發展 #領導力 #向上管理 #提升團隊凝聚力 #管理", "5月18日"], [["哲學命題", "不會佈局的leader，|只能被事情推著走。", 1], ["哲學命題", "這5條想清楚，一天的工作就成功了一半。", 0], ["哲學命題", "覆盤不是自我批判，是迭代最佳化的開始。", 0], ["哲學命題", "帶團隊記住這個口訣：盯、練、逼、想、批。", 0], ["哲學命題", "不會做的事情——練，多給鍛鍊機會別怕犯錯", 0], ["排比句", "今天做什麼，為什麼做，|怎麼做，需要什麼，卡在哪。", 1], ["對比句", "不佈局的人被動，|不復盤的人重複摔跤。", 1], ["反問句", "早上到公司，|你先問自己什麼？", 1], ["反問句", "我需要哪些資源支援？", 0], ["反問句", "今天目標完成了多少？", 0], ["反問句", "同樣的問題下次怎麼辦？", 0], ["情境衝突", "每天被事情推著走，|月底一團亂。", 1], ["情境衝突", "怎麼調整才能達到預期結果？", 0], ["情境衝突", "管理不是當好人，是當有結果的人。", 0], ["認知翻轉", "佈局和復盤，|是管理的日常。", 1], ["層層遞進", "先佈局，再執行，|最後復盤。", 1], ["詩性收束", "早上佈局，晚上復盤，|團隊就穩了。", 1], ["詩性收束", "盯練逼想批，缺一不可。", 0], ["詩性收束", "很多新手管理者問我：為什麼員工總是不推不動？", 0], ["詩性收束", "我說，因為你只佈置不跟進，|只安排不檢查，只原諒不追責。", 0]]], [60, "人到中年才明白：真正的成長，不是一路狂奔，而是學會放手。", "D", "放下面子、放下消極、放下執念→學會放手才是成長", ["以前總覺得要扛住一切才算厲害，現在才發現，放下才是最難的選擇。", "放下面子，是成熟的開始。 死撐著那點可憐的自尊，不肯低頭請教，結果繞了多少彎路。後來想通了，面子這東西，不能當飯吃，但教訓可以。", "放下消極，是生活的向陽。 抱怨天氣不好、抱怨領導偏心、抱怨命運不公……消極的人看什麼都是灰色。其實陽光一直都在，是你自己閉上了眼睛。", "放下攀比，是內心的釋然。 別人家換了新車、買了新房、孩子上了名校……比來比去，比掉了自己的快樂。日子是自己的，不是過給別人看的。", "放下懶惰，是行動的覺醒。 想一萬遍不如做一遍，躺著永遠到不了遠方。最怕的不是慢，是連邁出第一步的勇氣都沒有。", "放下自卑，是自我的接納。 總覺得自己不夠好、不夠優秀、不配擁有。可你不知道，在你羨慕別人的時候，也許有人正在羨慕你。", "放下執念，是心靈的解脫。 有些事不是你不夠努力，而是註定不屬於你。學會放手，不是認輸，而是給自己一條活路。", "人這一輩子，就是一個不斷放下的過程。放下那些不該背的包袱，才能輕裝上陣。", "你放下了什麼？一起來聊聊。#放下過去放過自己 #學會放過自己 #放下執念學會釋然 #心靈的成長 #放下心中執念 #找回內心平靜 #自我成長與修煉 #放下 #放下該放下的 #真正的放下", "5月17日"], [["哲學命題", "真正的成長，|是學會放手。", 1], ["哲學命題", "想一萬遍不如做一遍，躺著永遠到不了遠方。", 0], ["哲學命題", "人這一輩子，就是一個不斷放下的過程。", 0], ["哲學命題", "放下面子，是成熟的開始。 靠運氣，財富靠風口，做事靠人脈，機會靠運氣，競爭靠關係……", "F", "只做一件事、不斷試錯→第一性原理5法則→死磕本質", ["但你仔細觀察那些真正厲害的人，會發現他們做對了一件事：找到本質，然後死磕本質。", "今天聊聊\"第一性原理\"的5條核心法則，看完你會和我一樣後背發涼——", "關於成功", "別人都在追求多線操作、全面發展，他卻只做一件事：試錯。失敗了就總結，成功了就複製。真正的高手從不貪多，他們只做一件事：把一件事做到極致，然後複製。", "關於財富", "別人追熱點、跟風口、炒概念，他卻在默默積累：積累技能、積累認知、積累信任。財富的本質不是今天賺多少，而是你值多少。當你的能力配得上財富，財富自然會來。", "關於做事", "你什麼都想做，最後什麼都做不成。真正的高手都懂一個道理：聚焦，不是放棄其他，而是把80%的精力放在20%最重要的事上。 少即是多，慢即是快。", "關於機會", "別人在跟風，他卻在洞察。風口來了豬都能飛，但風停了才知道誰在裸泳。真正能抓住機會的人，不是在機會出現時才準備，而是在機會出現前就已經在準備了。", "關於競爭", "你跟別人硬剛、拼價格、拼資源，結果兩敗俱傷。真正聰明的人早就跳出了對抗的思維：與其更好，不如不同。 找到你的差異化，找到你的不可替代性。", "看完這5條，你會發現一個規律：真正的高手，都在找本質，而不是追表象。", "萬事歸一。找到那個最本質的\"一\"，然後做到極致。", "你們覺得呢？認同的扣1，有其他想法的評論區聊聊👇#系統性思維 #提高認知維度 #人生四個階段 #成功者的思維方式 #思維模型 #探索人生可能性 #自我中心思維  #人生關鍵詞 #熱點 #開啟人生第二曲線", "5月17日"], [["哲學命題", "找到本質，|然後死磕本質。", 1], ["哲學命題", "真正的高手從不貪多，他們只做一件事：把一件事做到極致，|然後複製。", 0], ["哲學命題", "少即是多，慢即是快。", 0], ["哲學命題", "看完這5條，你會發現一個規律：真正的高手，|都在找本質，而不是追表象。", 0], ["哲學命題", "但你仔細觀察那些真正厲害的人，|會發現他們做對了一件事：找到本質，然後死磕本質。", 0], ["排比句", "只做一件事，|不斷試錯，|死磕到底。", 1], ["排比句", "別人追熱點、跟風口、炒概念，|他卻在默默積累：積累技能、積累認知、積累信任。", 0], ["對比句", "追求多線的人分散，|死磕本質的人突破。", 1], ["對比句", "財富的本質不是今天賺多少，而是你值多少。", 0], ["對比句", "真正的高手都懂一個道理：聚焦，|不是放棄其他，而是把80%的精力放在20%最重要的事上。", 0], ["對比句", "真正能抓住機會的人，不是在機會出現時才準備，|而是在機會出現前就已經在準備了。", 0], ["反問句", "你成功靠運氣，|還是靠本質？", 1], ["情境衝突", "什麼都想做，|什麼都沒做好。", 1], ["情境衝突", "別人都在追求多線操作、全面發展，|他卻只做一件事：試錯。", 0], ["情境衝突", "別人在跟風，他卻在洞察。", 0], ["情境衝突", "你跟別人硬剛、拼價格、拼資源，結果兩敗俱傷。", 0], ["認知翻轉", "第一性原理，|是看穿一切的眼睛。", 1], ["層層遞進", "先找本質，再死磕，|最後突破。", 1], ["詩性收束", "抓住本質的人，|一通百通。", 1], ["詩性收束", "真正聰明的人早就跳出了對抗的思維：與其更好，|不如不同。", 0], ["詩性收束", "找到你的差異化，找到你的不可替代性。", 0], ["詩性收束", "找到那個最本質的\"一\"，然後做到極致。", 0]]], [63, "讀懂《史記》才明白，古人早就把人性寫透了！", "C", "人性不分好壞只分利弊→《史記》寫透的底層邏輯", ["今天翻了一遍《史記》，發現司馬遷早就把社會的底層邏輯說清楚了，而且說得特別直白，一點都不繞彎子。", "第一條，人性從來不分好壞，只分利弊。", "別人對你好，很可能不是因為你有多值得，而是因為你現在對他有用。等哪天你沒用了，你看誰還理你。", "第二條，權力越大，人情越薄。", "當官的越高，朋友越少。不是別人變了，是你站的位置決定了你能擁有什麼。", "第三條，真話往往沒人愛聽。", "說真話的人往往得罪人，圓滑的人反而左右逢源。這就是現實。", "第四條，忠臣未必有好下場。", "岳飛精忠報國，結果呢？反而被自己人害了。歷史上這樣的例子太多了。", "第五條，會說話比會做事重要。", "同樣的事情，會說話 才是最大的立威。", 1], ["認知翻轉", "後來我才明白：新官上任，別急著燒火。", 0], ["層層遞進", "先觀察，再瞭解，|最後立規。", 1], ["詩性收束", "沉得住氣的人，|才坐得穩位置。", 1], ["詩性收束", "天之內，整個團隊都在背後議論我。", 0], ["詩性收束", "上任前7天，我只做一件事：看、只聽、不說、不決策。", 0], ["詩性收束", "一句話總結：用制度立威，用人格服人。", 0]]], [68, "在職場摸爬滾打10年，我發現一個扎心的真相：領導真正喜歡的員工，往往不是最聰明的，而是最懂事的。", "B", "勤匯報、帶方案、守分寸→領導真正喜歡的8條懂事", ["什麼叫懂事？就是知道什麼該做、什麼不該做，什麼該說、什麼不該說。", "我見過太多能力超強但就是升不上去的人，也見過能力一般但領導就是離不開的人。差距就在這8條：", "1. 勤彙報", "別等領導問你才說。主動彙報工作進度，帶著方案去請示，做完及時說結果。彙報是讓領導有掌控感，不是給他添麻煩。", "2. 執行力強", "答應的事一定要做到。節點意識很重要，什麼時間交付、什麼標準完成，說到就要做到，形成工作閉環。", "3. 能抗事不甩鍋", "出了問題第一時間想解決方案，別急著找責任人。領導要的是能解決問題的人，不是會推卸責任的人。", "4. 懂得低調", "有功勞要學會分享，感謝團隊的配合、領導的栽培。木秀於林風必摧之，太張揚的人走不遠。", "5. 不站隊", "職場政治複雜，但聰明人都保持中立。對工作負責比對人負責更重要，誰上臺你都能站穩。", "6. 精業務", "讓自己變得不可替代。專業度是你在職場最硬的底牌，持續學習、深耕領域，做那個離了你就轉不動的人。", "7. 眼裡有活", "別等著被安排。主動預判下一步，提前準備，等領導想到黃花菜都涼了。", "8. 不愚忠", "基於專業判斷，敢提不同意見。領導也需要有人幫他把關，一味附和的人價值有限。", "這8條不是讓你卑微討好，而是讓你在職場上走得更穩。你們覺得還有哪些？#增強工作能力 #行知領導力 #職場發言不怯場 #個人領導力 #職場智慧與成長 #提升管理能力 #領導力 #職場管理領導力 #領導力發展 #提升領導力", "5月16日"], [["哲學命題", "領導喜歡的，|往往不是最聰明的。", 1], ["哲學命題", "我見過太多能力超強但就是升不上去的人，|也見過能力一般但領導就是離不開的人。", 0], ["哲學命題", "彙報是讓領導有掌控感，不是給他添麻煩。", 0], ["哲學命題", "答應的事一定要做到。", 0], ["哲學命題", "節點意識很重要，什麼時間交付、什麼標準完成，|說到就要做到，形成工作閉環。", 0], ["排比句", "勤匯報，帶方案，|守分寸，懂進退。", 1], ["排比句", "就是知道什麼該做、什麼不該做，什麼該說、什麼不該說。", 0], ["對比句", "能力超強升不上去的人不懂事，|能力一般卻離不開的人懂事。", 1], ["對比句", "這8條不是讓你卑微討好，而是讓你在職場上走得更穩。", 0], ["反問句", "你知道什麼該說，|什麼不該說嗎？", 1], ["情境衝突", "能力很強，|卻怎麼也升不上去。", 1], ["情境衝突", "主動彙報工作進度，帶著方案去請示，做完及時說結果。", 0], ["認知翻轉", "懂事，|是職場最被低估的能力。", 1], ["層層遞進", "先勤匯報，再帶方案，|最後懂分寸。", 1], ["詩性收束", "懂事的人，|走到哪都被需要。", 1], ["詩性收束", "主動預判下一步，提前準備，等領導想到黃花菜都涼了。", 0], ["詩性收束", "基於專業判斷，敢提不同意見。", 0], ["詩性收束", "領導也需要有人幫他把關，一味附和的人價值有限。", 0]]], [69, "當了十年主管我才明白：管人最難的不是做事，是對付人。", "B", "新人晾著、玻璃心少批、骨幹給舞台→對症的馭人術", ["剛帶團隊時，新人不服我硬壓，結果人家直接擺爛；玻璃心我使勁批評，最後人家提了離職；骨幹傲我想壓一壓，結果核心骨幹跑了。", "後來遇到一個老前輩，教了我一套\"馭人術\"，我照著做，團隊氛圍徹底變了——", "1⃣ 新人不服？晾著。別急著立威，先讓他碰碰壁，比你訓一百句管用。", "2⃣ 玻璃心？少批評。不是護著他，而是換種方式說話，批評前先肯定，他反而聽得進去。", "3⃣ 擺爛人？劃紅線。底線一清二楚，觸線就走人，沒得商量。", "4⃣ 拉幫結派？拆開。小團體不拆，早晚反噬你。調崗、換專案，物理隔離最有效。", "5⃣ 自私鬼？分利益。別講情懷，把利益說清楚，他自然跟你幹。", "6⃣ 骨幹傲？給小權。傲氣的人要的是認可，給他一個\"小山頭\"，他反而死心塌地。", "7⃣ 焦慮包？給方案。別說什麼\"別緊張\"，直接告訴他第一步做什麼，焦慮立刻降一半。", "這46條馭人訣，條條都是血淚換來的。記住一句話：管人不是管事，是管心。對症下藥，才能藥到病除。", "你在管理中遇到過什麼難搞的人？評論區說說，我幫你支招👇#識人與用人 #為人處事不犯難 #做人的道理和為人處事 #為人處事學問 #為人處事方式態度 #識人術 #人分三六九等 #拓展人際關係 #人性化細節 #為人處事的小智慧", "5月16日"], [["哲學命題", "管人最難的，|不是做事，是對付人。", 1], ["哲學命題", "後來遇到一個老前輩，教了我一套\"馭人術\"，|我照著做，團隊氛圍徹底變了——", 0], ["哲學命題", "別急著立威，先讓他碰碰壁，比你訓一百句管用。", 0], ["哲學命題", "底線一清二楚，觸線就走人，沒得商量。", 0], ["哲學命題", "小團體不拆，早晚反噬你。", 0], ["排比句", "新人晾著，|玻璃心少批，|骨幹給舞臺。", 1], ["對比句", "一刀切的人人都跑，|對症下藥的人人都服。", 1], ["對比句", "不是護著他，而是換種方式說話，|批評前先肯定，他反而聽得進去。", 0], ["對比句", "傲氣的人要的是認可，|給他一個\"小山頭\"，他反而死心塌地。", 0], ["反問句", "你對每種人，|用的是同一招嗎？", 1], ["反問句", "你在管理中遇到過什麼難搞的人？", 0], ["情境衝突", "新人不服就硬壓，|結果人家直接擺爛。", 1], ["情境衝突", "剛帶團隊時，新人不服我硬壓，結果人家直接擺爛；|玻璃心我使勁批評，最後人家提了離職；|骨幹傲我想壓一壓，結果核心骨幹跑了。", 0], ["認知翻轉", "駕馭人，|要因人施策。", 1], ["層層遞進", "先看人，再對症，|最後收心。", 1], ["詩性收束", "對症了，|團隊氛圍就變了。", 1], ["詩性收束", "這46條馭人訣，條條都是血淚換來的。", 0], ["詩性收束", "記住一句話：管人不是管事，是管心。", 0], ["詩性收束", "對症下藥，才能藥到病除。", 0]]], [70, "女領導越往上走，越要提升自己的承載能力。", "A", "承載人性之私、委屈、壓力→女領導的十大承載力", ["很多人以為，職位越高，權力越大，越輕鬆。", "其實正好相反，職位越高，責任越大，需要承載的東西越多。", "今天分享10個維度，告訴你女領導需要提升哪些承載能力。", "十大承載能力", "一、承載人性之私", "接納下屬搶功、甩鍋等私心，不被情緒裹挾，做情緒穩定的\"容器\"。", "二、承載權力之孤", "接受領導身份帶來的孤獨，剋制情緒與脆弱，學會獨處。", "三、承載委屈", "默默消化不被理解的付出，穩住自身才能穩住團隊。", "四、承載不確定性", "不等100%清晰，在資訊、把握不足時果斷決策、推進工作。", "五、承載失敗的代價", "坦然面對專案失敗、人員流失等損失，覆盤後繼續推進。", "六、承載系統之混沌", "高位無清晰指令，在市場、政策等不確定性中穩住團隊，主動破局。", "七、承載髒活", "主動處理棘手、不討好的事務，為團隊兜底，當好\"惡人\"。", "八、承載別人的投射", "區分下屬情緒與自身問題，不被他人情緒影響，保持內心穩定。", "九、承載被討厭", "接受有人不滿意、不認可，聚焦自身價值，而非討好他人。", "十、承載成長的撕裂", "接受晉升帶來的角色轉變與煎熬，在突破中提升自身容量。", "深度解析", "為什麼說承載能力是女領導的核心競爭力？", "1️⃣ 女性的優勢在於共情能力，但容易被情緒裹挾", "提升承載能力，就是在保持共情的同時，擁有理性的底線", "2️⃣ 職場對女領導的要求更高，需要更強大的內心", "不僅要做好事，還要當好\"容器\"，承載所有喜怒哀樂", "3️⃣ 晉升的本質是承擔更多責任", "職位越高，需要承載的東西越多，能力邊界需要不斷拓展", "實踐建議", "如何提升自己的承載能力？", "1️⃣ 保持自我覺察", "意識到自己的情緒，不被情緒控制，而是控制情緒", "2️⃣ 擴大認知邊界", "學習管理知識、心理學知識，提升看問題的維度", "3️⃣ 主動承擔責任", "不要回避困難，主動處理棘手問題，在實踐中成長", "4️⃣ 找到情緒出口", "運動、冥想、傾訴，釋放負面情緒，保持內心穩定", "5️⃣ 持續自我成長", "讀書、學習、反思，不斷提升自己的認知和能力", "#遊戲TA來訪企劃 #人生效率體系 #九型人格 #能力 #能力提升 #個人核心競爭力 #凝聚力提升 #職場核心競爭力 #思維模型 #決策力和行動力", "5月15日"], [["哲學命題", "職位越高，|越要提升承載能力。", 1], ["哲學命題", "提升承載能力，就是在保持共情的同時，擁有理性的底線", 0], ["哲學命題", "今天分享10個維度，|告訴你女領導需要提升哪些承載能力。", 0], ["哲學命題", "接納下屬搶功、甩鍋等私心，|不被情緒裹挾，做情緒穩定的\"容器\"。", 0], ["哲學命題", "接受領導身份帶來的孤獨，剋制情緒與脆弱，學會獨處。", 0], ["排比句", "承載人性之私，|承載委屈，|承載壓力。", 1], ["對比句", "職位越高越輕鬆的想法，|恰恰相反。", 1], ["反問句", "你的承載力，|撐得起你的位置嗎？", 1], ["反問句", "為什麼說承載能力是女領導的核心競爭力？", 0], ["反問句", "如何提升自己的承載能力？", 0], ["情境衝突", "下屬搶功甩鍋，|你卻被情緒左右。", 1], ["認知翻轉", "責任越大，|需要承載的越多。", 1], ["認知翻轉", "其實正好相反，職位越高，|責任越大，需要承載的東西越多。", 0], ["層層遞進", "先承載私心，再承載委屈，|最後承載壓力。", 1], ["層層遞進", "很多人以為，職位越高，權力越大，越輕鬆。", 0], ["詩性收束", "能承載多少，|就能走多高。", 1], ["詩性收束", "不要回避困難，主動處理棘手問題，在實踐中成長", 0], ["詩性收束", "運動、冥想、傾訴，釋放負面情緒，保持內心穩定", 0], ["詩性收束", "讀書、學習、反思，不斷提升自己的認知和能力", 0]]], [71, "在人際交往裡，二十陽謀堪稱收服人心的利器。像推恩令，若想對付抱團的人，別硬剛，把利益分給其身邊人。比如小組組長有拿獎金的活兒，提議細化任務讓組員參與，按貢獻分獎金，組員得了好處就會向你，他們內部也會產生分歧。", "B", "推恩令分利、二桃殺三士、正向強化→二十陽謀收人心", ["還有二桃殺三士，面對互相幫襯的三人，丟擲有限利益。如公司兩個晉升名額從三人裡選，明確標準和好處，他們就會為搶名額互相拆臺。另外正向強化術也實用，把“別遲到”換成“你上次提前到場特別專業”，強化對方好行為，讓其向期待方向靠攏。掌握這些陽謀，在人際中能更遊刃有餘。#領導者思維 #職場智慧與成長 #職場管理領導力 #職場為人處世 #領導與下屬 #領導力發展 #如何和領導相處 #管理思維 #提升領導力 #職場生存之道", "5月15日"], [["哲學命題", "陽謀，|是收服人心的利器。", 1], ["哲學命題", "還有二桃殺三士，面對互相幫襯的三人，丟擲有限利益。", 0], ["哲學命題", "如公司兩個晉升名額從三人裡選，|明確標準和好處，他們就會為搶名額互相拆臺。", 0], ["哲學命題", "掌握這些陽謀，在人際中能更遊刃有餘。", 0], ["排比句", "推恩令分利，|二桃殺三士，|正向強化術。", 1], ["對比句", "硬剛抱團的人兩敗俱傷，|分利身邊人的人不戰而勝。", 1], ["反問句", "面對抱團的人，|你是硬剛，還是分化？", 1], ["情境衝突", "三個人互相幫襯，|你無從下手。", 1], ["認知翻轉", "陽謀不是陰謀，|是看懂利益。", 1], ["層層遞進", "先分利，再強化，|最後收心。", 1], ["詩性收束", "用好利益，|人心自然歸。", 1], ["詩性收束", "另外正向強化術也實用，把“別遲到”換成“你上次提前到場特別專業”，|強化對方好行為，讓其向期待方向靠攏。", 0]]], [72, "在人際交往裡，二十陽謀堪稱收服人心的利器。像推恩令，若想對付抱團的人，別硬剛，把利益分給其身邊人。比如小組組長有拿獎金的活兒，提議細化任務讓組員參與，按貢獻分獎金，組員得了好處就會向你，他們內部也會產生分歧。", "B", "（重複篇）推恩令＋二桃殺三士＋正向強化術", ["還有二桃殺三士，面對互相幫襯的三人，丟擲有限利益。如公司兩個晉升名額從三人裡選，明確標準和好處，他們就會為搶名額互相拆臺。另外正向強化術也實用，把“別遲到”換成“你上次提前到場特別專業”，強化對方好行為，讓其向期待方向靠攏。掌握這些陽謀，在人際中能更遊刃有餘。#格局炸裂的千古名句 #基礎知識 #歷史知識 #中國上下五千年文化 #歷史筆記 #中國歷史 #古代對事物的雅稱 #中國漢字 #野史", "5月15日"], [["哲學命題", "用利益，|化解抱團。", 1], ["哲學命題", "還有二桃殺三士，面對互相幫襯的三人，丟擲有限利益。", 0], ["哲學命題", "如公司兩個晉升名額從三人裡選，|明確標準和好處，他們就會為搶名額互相拆臺。", 0], ["哲學命題", "掌握這些陽謀，在人際中能更遊刃有餘。", 0], ["排比句", "推恩分利，|有限利益，|正向強化。", 1], ["對比句", "把「別遲到」換成「你上次很專業」，|結果完全不同。", 1], ["反問句", "你強化的，|是好行為，還是壞行為？", 1], ["情境衝突", "小組長抱團，|組員都向著他。", 1], ["認知翻轉", "分配利益，|就是分配人心。", 1], ["層層遞進", "先分利，再丟擲有限利益，|最後正向強化。", 1], ["詩性收束", "好行為被看見，|就會被重複。", 1], ["詩性收束", "另外正向強化術也實用，把“別遲到”換成“你上次提前到場特別專業”，|強化對方好行為，讓其向期待方向靠攏。", 0]]], [73, "很多老闆不知道，真正賺錢的副業，根本不是你想象中需要投入幾十萬。", "E", "技能變現、內容、電商、服務→4條低門檻副業路", ["上週見了個老朋友，大廠996月薪3萬，去年被裁後大半年找不到工作。他嘆氣：\"早知道當初搞個副業。\"", "這讓我意識到——很多人不是不想做副業，而是不知道從哪裡開始。", "今天把副業賽道整理成4條最實用的路：", "技能變現（最適合普通人）", "設計剪輯、文案寫作、程式設計技術、翻譯配音", "自媒體流量（爆發力強）", "圖文賬號、短影片、知識付費、賬號運營", "輕任務躺賺（零門檻）", "線上問卷、試玩測評、掛機收益、素材售賣", "電商賣貨（離錢近）", "無貨源、二手倒賣、直播帶貨、小眾私域", "看完你會發現，副業沒那麼難。難的是邁出第一步，選對賽道深耕下去。", "你現在在做哪類副業？評論區聊聊👇#副業探索者 #誰還沒有副業 #副業變主業 #副業計劃 #下班做副業 #賺錢的副業 #實際一點的副業 #副業可以這麼做 #副業新篇章 #時間自由副業", "5月15日"], [["哲學命題", "真正賺錢的副業，|不需要幾十萬。", 1], ["哲學命題", "上週見了個老朋友，大廠996月薪3萬，|去年被裁後大半年找不到工作。", 0], ["哲學命題", "他嘆氣：早知道當初搞個副業。", 0], ["哲學命題", "設計剪輯、文案寫作、程式設計技術、翻譯配音", 0], ["哲學命題", "圖文賬號、短影片、知識付費、賬號運營", 0], ["排比句", "技能變現，內容變現，|電商變現，服務變現。", 1], ["對比句", "等裁員才想副業的人晚了，|早早佈局的人安心。", 1], ["對比句", "這讓我意識到——很多人不是不想做副業，|而是不知道從哪裡開始。", 0], ["反問句", "你被裁了，|有第二條路嗎？", 1], ["反問句", "你現在在做哪類副業？", 0], ["情境衝突", "大廠月薪三萬，|被裁後半年找不到工作。", 1], ["認知翻轉", "很多人不是不想做，|是不知道從哪開始。", 1], ["層層遞進", "先找技能，再變現，|最後多元化。", 1], ["詩性收束", "多一條路，|就多一份底氣。", 1], ["詩性收束", "無貨源、二手倒賣、直播帶貨、小眾私域", 0], ["詩性收束", "看完你會發現，副業沒那麼難。", 0], ["詩性收束", "難的是邁出第一步，選對賽道深耕下去。", 0]]], [74, "人這一輩子，到底要吃多少苦，才能苦盡甘來？", "D", "讀書、感情、工作、人生四道苦→熬過去就是福", ["我以前總覺得\"苦盡甘來\"是騙人的，直到這兩年經歷了太多，才慢慢明白——人生真的有四道坎，熬過去就是福。", "一苦，讀書的苦。寒窗十年無人問，誰不是咬著牙熬過來的？可你若不吃讀書的苦，生活就會教你什麼叫寸步難行。", "二苦，感情的苦。愛而不得是常態，學會放下是修行。這句話說起來容易，做起來太難太難。", "三苦，尊嚴的苦。低頭不是認輸，能屈能伸方為大丈夫。成年人的世界，面子真的不值錢，放下身段才能扛起生活。", "四苦，自律的苦。自律的苦輕如鴻毛，後悔的苦重如泰山。這句話戳中了我——現在不吃自律的苦，將來就會吃平庸的苦。", "熬過這四苦，方得四福。", "你，正在經歷哪一苦？#苦盡甘來懂人生 #人生是一本書 #先苦後甜才是人生 #人生三重境界 #人生就像一本書 #讀書感悟人生 #牛人會吃苦 #感悟人生道理 #什麼是吃苦 #人生感悟致自己", "5月15日"], [["哲學命題", "苦盡，|才會甘來。", 1], ["哲學命題", "可你若不吃讀書的苦，生活就會教你什麼叫寸步難行。", 0], ["哲學命題", "愛而不得是常態，學會放下是修行。", 0], ["哲學命題", "這句話說起來容易，做起來太難太難。", 0], ["哲學命題", "低頭不是認輸，能屈能伸方為大丈夫。", 0], ["排比句", "讀書的苦，感情的苦，|工作的苦，人生的苦。", 1], ["對比句", "不吃讀書的苦，|就吃生活的苦。", 1], ["反問句", "你熬過|幾道坎了？", 1], ["反問句", "寒窗十年無人問，誰不是咬著牙熬過來的？", 0], ["反問句", "你，正在經歷哪一苦？", 0], ["情境衝突", "以為苦盡甘來是騙人的，|經歷了才明白。", 1], ["認知翻轉", "人生有四道坎，|熬過去就是福。", 1], ["認知翻轉", "我以前總覺得\"苦盡甘來\"是騙人的，直到這兩年經歷了太多，|才慢慢明白——人生真的有四道坎，熬過去就是福。", 0], ["層層遞進", "先吃讀書的苦，再吃工作的苦，|最後甘來。", 1], ["詩性收束", "熬過的每一道坎，|都會變成臺階。", 1], ["詩性收束", "自律的苦輕如鴻毛，後悔的苦重如泰山。", 0], ["詩性收束", "這句話戳中了我——現在不吃自律的苦，|將來就會吃平庸的苦。", 0], ["詩性收束", "熬過這四苦，方得四福。", 0]]], [75, "真沒想到！曾經拼命想走捷徑的我，如今才明白：慢慢來，反而最快。", "F", "三年入行、五年懂行、十年稱王→慢慢來反而最快", ["剛入行時總想著彎道超車、一夜暴富。看著別人三年升職加薪，自己卻原地踏步，焦慮得整夜睡不著。", "直到看到一句話才徹底醒悟——", "\"三年入行，五年懂行，十年稱王。熬得住就出眾，熬不住就出局。\"", "這不就是所有厲害的人的共同特質嗎？", "那個默默寫了十年無人問津的作者，因為一篇爆款一炮而紅；那個蹲了十幾年的研究員，終於攻克了世界級難題。", "他們不是幸運，是把\"沉澱\"這件事做到了極致。", "所以別急，事緩則圓，人緩則安。步調不用邁太大，日有寸進就好。心慌難擇路，欲速則不達。時機未到時，就韜光養晦、蟄伏隱藏，悄悄發光。", "十年磨劍無人知，一朝出鞘驚天下。", "願我們都能耐住寂寞，守住繁華。你們有沒有那麼一個瞬間，突然想通了什麼？#邪修過年 #一切唯心造 #人生是一種修行 #止語是一種修行 #人生處處是修行 #人生就是場修行 #修身養性禪悟人生 #忠言逆耳利於行 #人無遠慮必有近憂 #大道至簡", "5月14日"], [["哲學命題", "慢慢來，|反而最快。", 1], ["哲學命題", "剛入行時總想著彎道超車、一夜暴富。", 0], ["哲學命題", "三年入行，五年懂行，十年稱王。", 0], ["哲學命題", "熬得住就出眾，熬不住就出局。", 0], ["哲學命題", "他們不是幸運，是把\"沉澱\"這件事做到了極致。", 0], ["排比句", "三年入行，|五年懂行，|十年稱王。", 1], ["對比句", "想走捷徑的人原地踏步，|慢慢來的人後來居上。", 1], ["反問句", "你在焦慮別人|升職加薪嗎？", 1], ["反問句", "這不就是所有厲害的人的共同特質嗎？", 0], ["反問句", "你們有沒有那麼一個瞬間，突然想通了什麼？", 0], ["情境衝突", "想彎道超車，|卻原地踏步。", 1], ["情境衝突", "看著別人三年升職加薪，|自己卻原地踏步，焦慮得整夜睡不著。", 0], ["認知翻轉", "熬得住就出眾，|熬不住就出局。", 1], ["層層遞進", "先入行，再懂行，|最後稱王。", 1], ["詩性收束", "時間，|會獎賞每一個熬得住的人。", 1], ["詩性收束", "時機未到時，就韜光養晦、蟄伏隱藏，悄悄發光。", 0], ["詩性收束", "十年磨劍無人知，一朝出鞘驚天下。", 0], ["詩性收束", "願我們都能耐住寂寞，守住繁華。", 0]]], [76, "以前總覺得嘴笨是性格問題，直到被社會毒打3年後才發現——處世原來有訣竅。", "B", "先送禮再開口→求人辦事講順序→處世的訣竅", ["昨天陪朋友去求人辦事，見證了一個讓我愣住的場景：", "朋友帶了兩瓶好酒先送給對方，說：\"聽說您愛喝這個，先給您嚐嚐鮮。\"對方笑著說\"太客氣了\"，然後朋友才開口說正事。結果你猜怎麼著？對方不但答應幫忙，還主動多說了幾個注意事項。", "朋友事後告訴我一個秘密：求人，先送其需再言其請。先把好處擺上去，再說請求，別人才願意聽。", "這讓我想起踩過的坑：以前直接開口求人，被拒絕後還覺得人家不近人情。其實不是人家無情，是我太笨。", "分享3條讓我後悔沒早知道的處世鐵律：", "① 勸人：先順其意再導其行", "別一上來就否定對方，先說\"我懂你的意思\"，等他情緒穩定了再引導。", "② 求人：先送其需再言其請", "把對方需要的好處先給出去，再提請求，成功率翻倍。", "③ 動人：先通其情再達其理", "別急著講道理，先說\"我理解你的感受\"，等他冷靜了再分析。", "我花了10年才悟出這3條，你們呢？學會了幾條？#識人與用人 #為人處事圓滑 #識人術 #個人性格探索 #學點心裡學 #為人處世的方法 #人際交往 #為人處事不犯難 #觀點分享為人處事", "5月14日"], [["哲學命題", "處世，|有訣竅。", 1], ["哲學命題", "昨天陪朋友去求人辦事，見證了一個讓我愣住的場景", 0], ["哲學命題", "朋友帶了兩瓶好酒先送給對方，|說：聽說您愛喝這個，先給您嚐嚐鮮。", 0], ["哲學命題", "對方笑著說\"太客氣了\"，然後朋友才開口說正事。", 0], ["排比句", "先送禮，再開口，|最後謝。", 1], ["對比句", "直接開口的人碰壁，|懂順序的人事成。", 1], ["反問句", "你求人辦事時，|先做的是什麼？", 1], ["反問句", "我花了10年才悟出這3條，你們呢？", 0], ["情境衝突", "朋友先送兩瓶酒，|對方不但答應還多幫了忙。", 1], ["認知翻轉", "嘴笨不是性格問題，|是不懂訣竅。", 1], ["認知翻轉", "這讓我想起踩過的坑：以前直接開口求人，|被拒絕後還覺得人家不近人情。", 0], ["認知翻轉", "其實不是人家無情，是我太笨。", 0], ["層層遞進", "先送心意，再說正事，|最後感謝。", 1], ["層層遞進", "朋友事後告訴我一個秘密：求人，先送其需再言其請。", 0], ["層層遞進", "先把好處擺上去，再說請求，別人才願意聽。", 0], ["層層遞進", "別一上來就否定對方，先說\"我懂你的意思\"，|等他情緒穩定了再引導。", 0], ["詩性收束", "懂順序的人，|事半功倍。", 1], ["詩性收束", "對方不但答應幫忙，還主動多說了幾個注意事項。", 0], ["詩性收束", "把對方需要的好處先給出去，再提請求，成功率翻倍。", 0], ["詩性收束", "別急著講道理，先說\"我理解你的感受\"，|等他冷靜了再分析。", 0]]], [77, "掙大錢不是靠拼命，是靠把\"道法術器\"這四層都研究透！", "E", "道（政策）→法（模式）→術（營銷）→器（工具），四層賺大錢", ["很多老闆不知道，同樣是做生意，為什麼有人年入百萬，有人卻苦苦掙扎？", "那些真正賺大錢的人，不是比誰更努力，而是他們在研究這四個層次：", "道——看懂國家政策，順勢而為；", "法——摸清商業模式，設計盈利路徑；", "術——掌握定價、營銷、人力這些實操方法；", "器——經營人脈、形象、口才這些資源槓桿。", "問題是，大多數人卡在哪一層？", "👉 有人只研究\"術\"和\"器\"，天天學技巧，結果越學越焦慮，越努力越窮；", "👉 有人只研究\"道\"和\"法\"，滿嘴趨勢賽道，結果落地一塌糊塗。", "真正的高手，是把四層打通：", "順著國家政策選賽道，用商業模式設計架構，靠定價和營銷落地，再用人脈資源放大規模。", "有道無術道不顯，有術無道術不精。", "那些悶聲發大財的人，從來不是比誰更拼命，而是比誰把這四層都研究透了。", "你目前卡在哪一層？評論區聊聊👇#認知決定財富 #商業的底層邏輯 #商業認知格局 #財富思維 #提升賺錢思維 #財富管理 #如何財富自由 #如何擺脫貧窮 #商業大佬思維 #思路決定出路", "5月14日"], [["哲學命題", "掙大錢，|不是靠拼命。", 1], ["哲學命題", "術——掌握定價、營銷、人力這些實操方法", 0], ["哲學命題", "器——經營人脈、形象、口才這些資源槓桿。", 0], ["哲學命題", "有道無術道不顯，有術無道術不精。", 0], ["排比句", "道看政策，法看模式，|術看營銷，器看工具。", 1], ["對比句", "拼命的人苦苦掙扎，|研究四層的人年入百萬。", 1], ["對比句", "那些真正賺大錢的人，不是比誰更努力，|而是他們在研究這四個層次", 0], ["對比句", "那些悶聲發大財的人，從來不是比誰更拼命，|而是比誰把這四層都研究透了。", 0], ["反問句", "你研究的，|是哪一層？", 1], ["反問句", "很多老闆不知道， 養生從今天開始！", 0]]], [79, "以前總覺得\"心計\"是個貶義詞，直到我在社會上摔了無數跟頭才明白：心計不是陰謀，是保護自己的智慧。", "B", "適時翻臉、警惕捧殺→心計是保護自己的智慧", ["這20條處世策略，我精選了最扎心的6條分享給你：", "1. 翻臉，是解決人際矛盾的最佳方式", "有些人你越忍他越得寸進尺。適時翻臉，不是情緒化，是告訴別人：我有底線。", "2. 捧殺，是毀掉一個人最溫柔也最狠的手段", "天天誇你、吹捧你的人，往往是第一個看你笑話的。保持清醒，別被甜言蜜語捧殺。", "3. 藏拙，是避免嫉妒的自保之計", "你太優秀，身邊的人就會不舒服。學會藏拙，是成年人的必修課。", "4. 示弱，是麻痺對手的巧妙策略", "真正的高手從不高調。適當示弱，讓對手放鬆警惕，你才能找到突破口。", "5. 洞察，是看清本質的必備能力", "很多人說話只聽表面，但高手看的是動機。洞察力，是人與人之間最大的差距。", "6. 守密，是保護自身安全的重要原則", "你的秘密說出來就不是秘密了。看一個人能不能深交，就看他能不能守住秘密。", "這20條心計，有人說太腹黑，我卻覺得這是成年人的生存法則。你認同嗎？#事物發展規律 #成語積累 #抓住主要矛盾 #人生關鍵詞 #策略與智慧 #思維模型 #積累 #戒掉弱者思維 #發散性思維 #突破思維侷限", "5月14日"], [["哲學命題", "心計，|不是陰謀，是保護自己的智慧。", 1], ["哲學命題", "真正的高手從不高調。", 0], ["哲學命題", "這20條處世策略，我精選了最扎心的6條分享給你", 0], ["哲學命題", "適時翻臉，不是情緒化，是告訴別人：我有底線。", 0], ["哲學命題", "捧殺，是毀掉一個人最溫柔也最狠的手段", 0], ["排比句", "適時翻臉，|警惕捧殺，|守住底線。", 1], ["對比句", "一味忍讓的人被欺負，|懂得翻臉的人被尊重。", 1], ["反問句", "你一直忍著的那個人，|得寸進尺了嗎？", 1], ["情境衝突", "越忍他越得寸進尺。", 1], ["情境衝突", "有些人你越忍他越得寸進尺。", 0], ["情境衝突", "這20條心計，有人說太腹黑，|我卻覺得這是成年人的生存法則。", 0], ["認知翻轉", "適時翻臉，|是告訴別人：我有底線。", 1], ["層層遞進", "先忍，再看清，|最後翻臉。", 1], ["詩性收束", "有底線的善良，|才不會被欺負。", 1], ["詩性收束", "洞察力，是人與人之間最大的差距。", 0], ["詩性收束", "你的秘密說出來就不是秘密了。", 0], ["詩性收束", "看一個人能不能深交，就看他能不能守住秘密。", 0]]], [80, "以前總覺得厲害靠天賦，直到被社會狠狠教訓了一通，我才明白——真正的高手，都在默默修煉這幾種力量。", "F", "早起讀書復盤、不內耗、執行力強→高手修煉的幾種力量", ["前公司有個同事，學歷一般、背景普通，但三年連升兩級。跟他聊過才知道，人家每天早起讀書覆盤，遇到爛人爛事從不內耗，執行力強到今天佈置的任務明天就要結果。", "他說了一句話讓我記到現在： \"人和人的差距，不在起點，在轉彎處。\"", "後來我觀察那些真正厲害的人，發現他們都懂這六種力量：", "腦力——別人看熱鬧，他們看門道。分析、判斷、權衡，決定一個人能不能抓住機會。", "情緒力——高手不是沒有脾氣，是懂得把情緒轉化成動力。控制、調節、轉化，是成年人的必修課。", "行動力——想一萬遍不如做一遍。拖延症晚期的人，永遠只能看別人吃肉。", "受挫力——玻璃心碎一地，鑽石心才能扛住壓力。承受、恢復、成長，才是真正的強者基因。", "心力——信念強的人，運氣都不會太差。意志堅定的人，走到最後的往往都是他們。", "思維力——邏輯清晰、系統思考、戰略佈局，這決定一個人能走多高、看多遠。", "知行合一，格物致知。修煉好這幾種力量，你也可以成為自己的主人。", "你修煉哪一種力量最久？評論區說說👇#自定義人生故事 #自我中心思維 #人生關鍵詞 #創造性思維 #自我覺察力 #自我驅動力 #自我能力提升 #瞭解自己 #人生掌控力 #自我管理", "5月13日"], [["哲學命題", "人和人的差距，|不在起點，在轉彎處。", 1], ["哲學命題", "拖延症晚期的人，永遠只能看別人吃肉。", 0], ["哲學命題", "承受、恢復、成長，才是真正的強者基因。", 0], ["哲學命題", "前公司有個同事，學歷一般、背景普通，但三年連升兩級。", 0], ["哲學命題", "他說了一句話讓我記到現在：人和人的差距，| 慢慢背。", "各位易學愛好者，你學到哪一步了？還有哪些內容#國學知識 #拒絕封建迷信相信科學 #易經 #弘揚中華傳統文化 #周易 #國學傳承 #易學智慧改變人生 #弘揚國學經典文化 #吉人自有天相 #拒絕迷信傳播正能量 覺得難懂的？評論區聊聊👇", "5月9日"], [["哲學命題", "易經入門，|從天干地支開始。", 1], ["哲學命題", "這十五大類就是易經的基礎框架，|搞清楚這些，看古籍才不會懵。", 0], ["哲學命題", "拿起一本古籍，滿眼都是\"甲乙丙丁\"、\"子醜寅卯\"，|根本看不懂在講什麼。", 0], ["哲學命題", "十二地支：子、醜、寅、卯、辰、巳、午、未、申、酉、戌、亥", 0], ["哲學命題", "天干所屬：甲乙屬木、丙丁屬火、戊己屬土、庚辛屬金、壬癸屬水", 0], ["排比句", "十天干，十二地支，|八卦五行。", 1], ["排比句", "地支相害：子未害、醜午害、寅巳害、卯辰害、申亥害、酉戌害", 0], ["排比句", "地支六沖：子午衝、醜未衝、寅申衝、卯酉衝、辰戌衝、巳亥衝", 0], ["排比句", "天干相沖：甲庚衝、乙辛衝、丙壬衝、丁癸衝", 0], ["排比句", "地支三合：申子辰合水局、亥卯未合木局、寅午戌合火局、巳酉醜合金局", 0], ["對比句", "一上來看古籍的人看不懂，|從基礎開始的人能入門。", 1], ["反問句", "你被甲乙丙丁，|繞暈了嗎？", 1], ["反問句", "易經小白最頭疼的是什麼？", 0], ["反問句", "各位易學愛好者，你學到哪一步了？", 0], ["反問句", "還有哪些內容覺得難懂的？", 0], ["情境衝突", "拿起古籍，|滿眼看不懂的字。", 1], ["認知翻轉", "十年所學，|整理成一份清單。", 1], ["層層遞進", "先學天干地支，再學八卦，|最後讀古籍。", 1], ["詩性收束", "基礎打好了，|易經就開啟了。", 1], ["詩性收束", "五行方位：東方木、南方火、中央土、西方金、北方水", 0], ["詩性收束", "五行相生：木生火、火生土、土生金、金生水、水生木", 0], ["詩性收束", "五行相剋：木克土、土克水、水克火、火克金、金克木", 0]]], [104, "以前總覺得這些都是老一套，年輕人不愛聽，直到自己過了不惑之年，我才突然明白——", "C", "嫖賭一世窮、小時偷針大了偷金→老祖宗15條忠告", ["老祖宗用血淚換來的15條忠告，句句扎心：", "\"吃不窮，穿不窮，嫖賭一世窮\"", "——多少人敗在了賭和色上，家底再厚也經不起折騰", "\"小時偷針，大了偷金\"", "——孩子的事，再小也是大事，三歲看小七歲看老", "\"四十不多欲，五十不多情\"", "——中年危機，毀掉一個人只需兩個字：放縱", "\"家和萬事興，家衰口不停\"", "——多少家，散在了一張嘴上", "\"人無遠慮，必有近憂\"", "——居安思危，才能行穩致遠", "\"病從口入，禍從口出\"", "——管住嘴，是一輩子的修行", "\"近朱者赤，近墨者黑\"", "——跟錯人，走錯路，一輩子就毀了", "\"善有善報，惡有惡報\"", "——不是不報，時候未到", "\"害人之心不可有，防人之心不可無\"", "——善良要有底線，防備不是冷漠", "\"滿招損，謙受益\"", "——驕傲自滿的人，走不遠", "\"路遙知馬力，日久見人心\"", "——真心假意，時間會給你答案", "\"不怕慢，就怕站\"", "——只要在走，慢一點也沒關係", "\"樹欲靜而風不止，子欲養而親不待\"", "——盡孝要趁早，別等到來不及", "這些話不是空話，是無數人用一輩子驗證過的真相。", "年輕時總覺得自己不一樣，不聽勸；", "中年時才追悔莫及，可惜世上沒有後悔藥。", "你，聽過幾句？記住了幾條？#老規矩不能忘 #老人言 #國學經典 #古人智慧 #老祖宗的智慧 #國學傳承 #不聽老人言吃虧在眼前 #國學裡的迴響 #謀略古人的智慧 #好詞好句分享", "5月8日"], [["哲學命題", "老祖宗用血淚換來的，|十五條忠告。", 1], ["哲學命題", "老祖宗用血淚換來的15條忠告，句句扎心", 0], ["哲學命題", "多少人敗在了賭和色上，家底再厚也經不起折騰", 0], ["哲學命題", "孩子的事，再小也是大事，三歲看小七歲看老", 0], ["排比句", "嫖賭一世窮，|小時偷針大偷金，|四十不多欲。", 1], ["對比句", "不聽的人敗了家，|聽進去的人守住了家。", 1], ["反問句", "你聽過這些話嗎？", 1], ["情境衝突", "家底再厚，|也經不起賭和色。", 1], ["認知翻轉", "十五條忠告，|句句扎心。", 1], ["層層遞進", "先聽，再懂，|最後守。", 1], ["詩性收束", "老話不老，|是過日子的根本。", 1], ["詩性收束", "中年危機，毀掉一個人只需兩個字：放縱", 0], ["詩性收束", "這些話不是空話，是無數人用一輩子驗證過的真相。", 0], ["詩性收束", "中年時才追悔莫及，可惜世上沒有後悔藥。", 0]]], [105, "你知道\"白馬非馬\"這個說法嗎？兩千年前有人為它爭論不休，至今還讓人拍案叫絕！", "C", "白馬非馬→名實之辯→公孫龍的思想革命", ["戰國時期的公孫龍，絕對是中國歷史上最會\"抬槓\"的哲學家。他提出的\"白馬非馬\"論，可不是無理取鬧，而是一場關於\"名\"與\"實\"的思想革命。", "他的四大核心理論，每一個都讓人腦洞大開：", "名實之辯——名字是固定的，事物是變化的。搞清楚名實關係，才能看清本質。", "白馬非馬——\"白\"是顏色，\"馬\"是形狀，\"白馬\"是二者的結合，怎麼能等同於單純的\"馬\"？這不是在玩文字遊戲，而是告訴我們：事物的定義，決定了它的邊界。", "離堅白——一塊白石頭，眼睛看到的是\"白\"，手摸到的是\"堅\"，你能同時感知到兩者嗎？公孫龍說，不能。所以事物的各種屬性是相互分離的。", "邏輯思辨——這才是公孫龍的看家本領。他的論證嚴密到讓對手啞口無言，靠的不是雄辯，而是純粹的邏輯力量。", "看完這些，我突然明白：古人不是在鑽牛角尖，而是在用思辨的方式，追問一個永恆的問題——什麼才是真相？", "各位朋友，你們覺得\"白馬非馬\"有道理嗎？歡迎在評論區聊聊你的看法👇", "#審馬積累 #語言與思維 #多角度思維 #中國哲學 #拓寬眼界和思維 #知其白守其黑 #成語積累 #文化素養積累 #知識面拓展 #事物發展規律", "5月8日"], [["哲學命題", "白馬，|非馬。", 1], ["哲學命題", "搞清楚名實關係，才能看清本質。", 0], ["哲學命題", "邏輯思辨——這才是公孫龍的看家本領。", 0], ["哲學命題", "戰國時期的公孫龍，絕對是中國歷史上最會\"抬槓\"的哲學家。", 0], ["哲學命題", "他的四大核心理論，每一個都讓人腦洞大開", 0], ["排比句", "名實之辯，|堅白之辯，|指物之論。", 1], ["對比句", "抬槓的人無理取鬧，|思辨的人改變思想。", 1], ["對比句", "他提出的\"白馬非馬\"論，可不是無理取鬧，|而是一場關於\"名\"與\"實\"的思想革命。", 0], ["對比句", "這不是在玩文字遊戲，而是告訴我們：事物的定義，|決定了它的邊界。", 0], ["對比句", "他的論證嚴密到讓對手啞口無言，|靠的不是雄辯，而是純粹的邏輯力量。", 0], ["反問句", "一匹白馬，|到底是不是馬？", 1], ["反問句", "白馬非馬——\"白\"是顏色，\"馬\"是形狀，|\"白馬\"是二者的結合，怎麼能等同於單純的\"馬\"？", 0], ["反問句", "離堅白——一塊白石頭，眼睛看到的是\"白\"，|手摸到的是\"堅\"，你能同時感知到兩者嗎？", 0], ["反問句", "看完這些，我突然明白：古人不是在鑽牛角尖，|而是在用思辨的方式，追問一個永恆的問題——什麼才是真相？", 0], ["情境衝突", "兩千年前的爭論，|至今還讓人拍案叫絕。", 1], ["認知翻轉", "名字是固定的，|事物是變化的。", 1], ["層層遞進", "先辨名，再辨實，|最後明理。", 1], ["詩性收束", "思想的革命，|從一匹白馬開始。", 1], ["詩性收束", "名實之辯——名字是固定的，事物是變化的。", 0], ["詩性收束", "所以事物的各種屬性是相互分離的。", 0], ["詩性收束", "各位朋友，你們覺得\"白馬非馬\"有道理嗎？", 0]]], [106, "鬼谷子說：真正厲害的人，都懂得這四種處世智慧！", "C", "捭闔、揣摩、飛箝、轉丸→鬼谷子縱橫家四大智慧", ["說起鬼谷子，可能很多人只知道他是個傳說中的人物。但你知道嗎？這位戰國時期的傳奇人物，培養出了蘇秦、張儀、孫臏、龐涓等改變歷史格局的頂尖人才。他的思想放到今天，依然是職場晉升、人際交往的至勝法寶。", "今天給大家分享縱橫家四大核心思想，看看你用得上幾個：", "一、縱橫捭闔", "\"捭之者，開也，言也，陽也；闔之者，閉也，默也，陰也。\"", "簡單說，就是該進則進、該退則退。真正的高手，從不一條道走到黑，而是審時度勢、靈活應變。職場中遇阻時，學會以退為進，往往比硬碰硬更有效。", "二、合縱連橫", "\"合縱\"是聯合弱國抗強國，\"連橫\"是強國拉攏分化弱國。", "核心就一句話：合則強，分則弱。現在的職場和商場，單打獨鬥越來越難，懂得借勢借力、整合資源的人，才是真正的贏家。", "三、權謀遊說", "\"說之者，資而說之，取也。\"", "說服別人靠的不是口才，而是洞悉人心。鬼谷子講究\"揣情摩意\"——先摸清對方想要什麼，再對症下藥。沒有說服不了的人，只有沒找對方法的說客。", "四、審時度勢", "\"時者，動之隙；勢者，利之器。\"", "時機不到，蓄勢待發；時機一到，當機立斷。真正有大智慧的人，從不逆勢而行，而是學會借勢而為，順勢而成。", "看完這四點，我不禁感慨：老祖宗的智慧，放在2000多年後的今天，依然字字珠璣。", "各位朋友，你們在職場或生活中，最常用到哪一條智慧？歡迎在評論區聊聊！#謀略古人的智慧 #策略與智慧 #謀略 #國學知識 #謀局做局破局 #中國哲學 #老祖宗的智慧 #古人智慧 #國學傳承 #孫子兵法", "5月8日"], [["哲學命題", "鬼谷子的智慧，|至今是職場法寶。", 1], ["哲學命題", "簡單說，就是該進則進、該退則退。", 0], ["哲學命題", "說起鬼谷子，可能很多人只知道他是個傳說中的人物。", 0], ["哲學命題", "他的思想放到今天，依然是職場晉升、人際交往的至勝法寶。", 0], ["哲學命題", "這位戰國時期的傳奇人物，培養出了蘇秦、張儀、孫臏、龐涓等改變歷史格局的頂尖人才。", 0], ["排比句", "捭闔，揣摩，|飛箝，轉丸。", 1], ["對比句", "不懂縱橫的人被動，|懂縱橫的人掌握主動。", 1], ["對比句", "說服別人靠的不是口才，而是洞悉人心。", 0], ["反問句", "你知道蘇秦張儀，|師從何人嗎？", 1], ["反問句", "各位朋友，你們在職場或生活中，最常用到哪一條智慧？", 0], ["情境衝突", "一個傳說中的人物，|培養出改變歷史的人才。", 1], ["情境衝突", "現在的職場和商場，單打獨鬥越來越難，|懂得借勢借力、整合資源的人，才是真正的贏家。", 0], ["認知翻轉", "縱橫家的四大智慧，|依然管用。", 1], ["層層遞進", "先捭闔，再揣摩，|最後轉丸。", 1], ["層層遞進", "真正的高手，從不一條道走到黑，|而是審時度勢、靈活應變。", 0], ["層層遞進", "鬼谷子講究\"揣情摩意\"——先摸清對方想要什麼，|再對症下藥。", 0], ["詩性收束", "讀懂鬼谷子，|就讀懂了人心。", 1], ["詩性收束", "時機不到，蓄勢待發；|時機一到，當機立斷。", 0], ["詩性收束", "真正有大智慧的人，從不逆勢而行，|而是學會借勢而為，順勢而成。", 0], ["詩性收束", "看完這四點，我不禁感慨：老祖宗的智慧，|放在2000多年後的今天，依然字字珠璣。", 0]]], [107, "很多人覺得《孫子兵法》是打仗的事，跟自己沒關係。", "C", "知己知彼、謀略制勝、百戰不殆→《孫子兵法》五句做人做事", ["但你仔細看，這五句話哪一條不是在教我們做人做事？", "知己知彼——你看職場上有的人明明能力不差，卻總被排擠。問題出在哪？不懂看清自己，也看不懂別人。", "謀略制勝——高手做事從來不靠蠻力，而是在動手之前就已經把棋盤看透了。", "百戰不殆——真正厲害的人，不是每次都能贏，而是永遠讓自己立於不敗之地。", "慎戰善謀——真正的高手，不輕易出手。一旦出手，就是碾壓式的勝利。", "奇正相生——規則要守，但也要留一手變化。這才是活得通透的人。", "這五條，我研究了十幾年，每一條都能在生活裡用上。", "你們覺得，哪一條對你影響最大？", "#弘揚國學經典文化 #國學經典 #弘揚中華傳統文 #為學日益為道日損 #國學傳承 #格局炸裂的千古名句 #道德經 #文言文 #文化素養積累 #國學裡的迴響", "5月8日"], [["哲學命題", "孫子兵法，|教的是做人做事。", 1], ["哲學命題", "謀略制勝——高手做事從來不靠蠻力，|而是在動手之前就已經把棋盤看透了。", 0], ["哲學命題", "慎戰善謀——真正的高手，不輕易出手。", 0], ["哲學命題", "一旦出手，就是碾壓式的勝利。", 0], ["哲學命題", "不懂看清自己，也看不懂別人。", 0], ["排比句", "知己知彼，|謀略制勝，|百戰不殆。", 1], ["對比句", "靠蠻力的人輸，|靠謀略的人贏。", 1], ["對比句", "百戰不殆——真正厲害的人，|不是每次都能贏，而是永遠讓自己立於不敗之地。", 0], ["反問句", "你看清自己了嗎？|看懂別人了嗎？", 1], ["反問句", "但你仔細看，這五句話哪一條不是在教我們做人做事？", 0], ["反問句", "你們覺得，哪一條對你影響最大？", 0], ["情境衝突", "能力不差，|卻總被排擠。", 1], ["情境衝突", "知己知彼——你看職場上有的人明明能力不差，|卻總被排擠。", 0], ["認知翻轉", "兵法不是打仗的事，|是做人的事。", 1], ["層層遞進", "先知己，再知彼，|最後百戰不殆。", 1], ["詩性收束", "高手在動手之前，|已經看透了棋盤。", 1], ["詩性收束", "奇正相生——規則要守，但也要留一手變化。", 0], ["詩性收束", "這才是活得通透的人。", 0], ["詩性收束", "這五條，我研究了十幾年，每一條都能在生活裡用上。", 0]]], [108, "讀懂法家六大核心思想，才明白以法治國的千年智慧！", "C", "法、術、勢等法家六大核心→以法治國的千年智慧", ["春秋戰國百家爭鳴，法家為何能助秦一統天下？因為它講的不是空泛道理，而是實實在在的治國方略！", "法：法令如山，賞罰分明。商鞅立木取信，重賞之下必有勇夫。沒有規矩不成方圓，法律面前人人平等，這是治國的根基。", "術：御臣之術，察奸辨偽。韓非子說，君主必須明辨忠奸，術是制衡百官的權謀。馭人之道，在於知人善任，更在於防微杜漸。", "勢：權勢威嚴，令行禁止。猛虎在山林，猴子不敢不走。勢是威信、是執行力，沒有權威的政令，不過是一紙空文。", "以法治國：王子犯法與庶民同罪，這話2000年前就有人說了。法律不是統治工具，而是社會契約。", "富國強兵：興農重戰，國富然後兵強。經濟是基礎，軍事是保障，兩者相輔相成，缺一不可。", "嚴明法度：法令嚴明，不徇私情。法外開恩是對規則的破壞，是對公正的褻瀆。", "法家思想或許嚴苛，但它揭示了一個真理：治理大國如烹小鮮，既要有溫度，更要有尺度。", "各位讀友，您覺得依法治國最重要的是什麼？評論區聊聊👇", "#文化常識 #公基常識 #孫子兵法 #文化素養積累 #文言文 #中國哲學 #法考筆記 #道法 #常識 #中國古代史", "5月8日"], [["哲學命題", "法家，|助秦一統天下。", 1], ["哲學命題", "法：法令如山，賞罰分明。", 0], ["哲學命題", "商鞅立木取信，重賞之下必有勇夫。", 0], ["哲學命題", "沒有規矩不成方圓，法律面前人人平等，這是治國的根基。", 0], ["哲學命題", "術：御臣之術，察奸辨偽。", 0], ["排比句", "法，術，勢，|賞，罰，信。", 1], ["對比句", "空談道理的人治不了國，|實實在在的方略可以。", 1], ["對比句", "因為它講的不是空泛道理，而是實實在在的治國方略！", 0], ["對比句", "法律不是統治工具，而是社會契約。", 0], ["反問句", "法家為何能助秦一統？", 1], ["反問句", "春秋戰國百家爭鳴，法家為何能助秦一統天下？", 0], ["反問句", "各位讀友，您覺得依法治國最重要的是什麼？", 0], ["情境衝突", "商鞅立木取信，|重賞之下必有勇夫。", 1], ["認知翻轉", "沒有規矩，|不成方圓。", 1], ["層層遞進", "先立法，再用術，|最後造勢。", 1], ["詩性收束", "法令如山，|賞罰分明。", 1], ["詩性收束", "嚴明法度：法令嚴明，不徇私情。", 0], ["詩性收束", "法外開恩是對規則的破壞，是對公正的褻瀆。", 0], ["詩性收束", "法家思想或許嚴苛，但它揭示了一個真理：治理大國如烹小鮮，|既要有溫度，更要有尺度。", 0]]], [109, "你知道嗎？中國歷史上有一群人，他們不空談仁義，而是真正用行動詮釋什麼叫\"俠之大者\"——他們就是墨家。", "C", "兼愛、非攻、尚賢等→墨家九大實幹思想", ["墨子，這位兩千多年前的智者，創立了中華文明史上最具實幹精神的學派。他留下的九大思想，至今讀來依然振聾發聵：", "兼愛——不分親疏遠近，無差別地關愛每一個人；", "非攻——反對一切不義戰爭，以和平為貴守護蒼生；", "尚賢——不看出身門第，唯才是舉任人唯賢；", "尚同——追求思想統一，天下大同齊心協力；", "節用——節儉使用資源，反對奢侈浪費；", "節葬——簡化喪葬儀式，反對厚葬靡費；", "非樂——反對沉溺享樂，倡導節制自律；", "天志——相信天的意志，順應天理行正道；", "明鬼——明辨鬼神之事，敬畏而不迷信。", "很多人只知道儒家道家，卻不知道墨家。但讀懂了墨子，你會發現：真正的聖人，不是坐在書齋
