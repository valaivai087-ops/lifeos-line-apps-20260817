<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>情緒溯源</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#22252b;--sub:#6a707c;--line:#e2e0d8;--acc:#b4532a;--acc2:#2f6f6a;--soft:#f3e9e2;--ok:#2e7d4f;--bad:#b3352f}
@media(prefers-color-scheme:dark){:root{--bg:#17191d;--card:#20242a;--ink:#e8e6e1;--sub:#9aa1ad;--line:#333941;--acc:#e58a5c;--acc2:#6fc2ba;--soft:#2c2622;--ok:#6fcf97;--bad:#ef7d76}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.top{display:flex;gap:12px;align-items:center;max-width:1100px;margin:0 auto}
h1{font-size:18px;margin:0;white-space:nowrap}
h1 small{font-weight:400;color:var(--sub);font-size:12px;margin-left:6px}
#q{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
nav{display:flex;gap:4px;max-width:1100px;margin:8px auto 0;overflow-x:auto}
nav button{border:0;background:none;color:var(--sub);padding:6px 12px;border-radius:8px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--acc);color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{font-size:17px;margin:22px 0 8px}
h2:first-child{margin-top:0}
h3{font-size:15px;margin:0 0 4px}
p{margin:6px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.grid .card{margin:0}
.sub{color:var(--sub);font-size:13px}
.chain{display:flex;flex-wrap:wrap;gap:4px 2px;align-items:center}
.chain span{background:var(--soft);border-radius:6px;padding:1px 8px;font-size:13px}
.chain i{color:var(--acc);font-style:normal;font-size:12px}
.tag{display:inline-block;font-size:12px;padding:0 8px;border-radius:20px;background:var(--soft);color:var(--acc);margin-right:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:2px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px}
dt{color:var(--sub);white-space:nowrap}
dd{margin:0}
.num{color:var(--acc);font-weight:700;margin-right:6px;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:8px;padding:6px 14px;font:inherit;cursor:pointer}
.btn.ghost{background:none;color:var(--acc)}
.btn.sm{padding:2px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
summary{cursor:pointer;padding:10px 14px;font-weight:700}
summary .sub{font-weight:400;margin-left:8px}
.ab{display:flex;gap:8px;padding:6px 14px;border-top:1px solid var(--line);align-items:flex-start}
.ab input{margin-top:7px}
.ab.done .t{color:var(--sub)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 12px}
.bar b{display:block;height:100%;background:var(--acc2)}
label.f{display:block;margin:14px 0 4px;font-weight:700}
label.f small{font-weight:400;color:var(--sub);margin-left:6px}
textarea,select,input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:58px;resize:vertical}
.hint{font-size:13px;color:var(--sub);margin:0 0 4px}
.two{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.side{position:sticky;top:110px}
@media(max-width:800px){.two{grid-template-columns:1fr}.side{position:static}}
mark{background:#ffe08a;color:#222;border-radius:2px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.rate{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.rate:first-of-type{border:0}
.rate .l{flex:1}
.rate label{font-size:13px;cursor:pointer}
blockquote{margin:8px 0;padding:6px 14px;border-left:3px solid var(--acc);background:var(--soft);border-radius:0 8px 8px 0}
a{color:var(--acc2)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>情緒溯源<small>Emotion Debugging</small></h1>
    <input id="q" type="search" placeholder="搜尋情緒、能力、紀錄…（例：羞恥、Prediction、界線）" oninput="setQ(this.value)">
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<div id="toast"></div>

<script>
/* ================= 資料 ================= */
// [中文, 英文, 源頭, 核心落差, 舊模型, 更新方向, 補充]
const EMO=[
['焦慮','Anxiety','系統預測「未來可能出問題」，但無法精準估計何時、如何發生。','Prediction的不確定性過高。','不知道會發生什麼，所以一定很危險。','把模糊威脅拆成可驗證的小預測。','焦慮研究特別強調不確定性、威脅預期以及威脅模型未能適當更新。'],
['恐懼','Fear','系統預測「威脅即將發生，而且我可能無法應付」。','Safety Prediction安全預測被破壞。','危險來了，我沒有能力。','辨認真實威脅、發生機率與自己的應對能力。'],
['憤怒','Anger','Reality嚴重偏離「事情應該如此」的高權重模型。','Expectation／Fairness／Boundary被違反。','他不應該這樣。','分辨「界線真的被侵犯」與「Reality沒有服從我的模型」。'],
['悲傷','Sadness','系統判定某個高價值的人、關係、身分、機會或未來已經失去。','Expected Future與Available Future之間出現巨大差距。','原本存在的未來，現在不存在了。','重新建立失去之後仍可生成的新未來。'],
['失望','Disappointment','Reality低於原本期待。','Expected Outcome > Actual Outcome。','我以為會更好。','重新校準Prediction，而不是否定整個Reality。'],
['挫折','Frustration','目標存在，但目前策略反覆無法降低與目標的距離。','Goal－Current State長期無法縮小。','我一直做，為什麼還沒有用？','不要只增加努力，先更換Strategy。'],
['無助','Helplessness','系統預測「不管我做什麼，結果都不會改變」。','Action→Outcome的控制感崩解。','我的行動沒有用。','尋找最小仍可控制的變數。'],
['絕望','Hopelessness','系統不只認為現在很差，而且預測未來也沒有改善路徑。','Future Model失去可行路徑。','以後都會這樣。','不要一次證明人生會變好，只找一條可以被Reality驗證的小路徑。'],
['羞恥','Shame','負面事件被模型從「我做錯事情」升級成「我這個人有問題」。','Ideal Self－Perceived Self。','不是事情失敗，是我很差。','把Identity與Event重新拆開。','羞恥與罪惡感都是複雜的自我意識情緒，但兩者涉及不同的社會認知與神經處理，不宜視為同一盞燈。'],
['罪惡感','Guilt','自己的行為偏離內在價值或道德標準。','Actual Behavior－Moral Model。','我做了不符合自己價值的事。','Repair修復、道歉、補償、改變下一次行為。'],
['尷尬','Embarrassment','系統偵測到自己的表現偏離群體期待，而且正在被別人觀察。','Presented Self－Expected Social Self。','大家都看到我出錯了。','重新估計別人的注意力與事件真正的重要程度。'],
['嫉妒','Jealousy','系統預測重要關係或資源可能被第三者取代。','Expected Security－Perceived Relational Threat。','我可能失去這個重要位置。','檢查真正威脅、依附安全與關係證據。'],
['羨慕','Envy','比較系統發現「別人擁有我重視、但目前沒有的東西」。','Desired State－Current State。','他有，我沒有。','把比較訊號轉成「我真正重視什麼」的資訊。'],
['孤獨','Loneliness','實際連結低於系統需要的連結。','Desired Connection－Perceived Connection。','沒有人真正理解我。','區分「沒有人」與「目前缺少足夠高品質連結」。'],
['被拒絕感','Rejection','系統原本預測「我會被接納」，Reality卻出現排除訊號。','Expected Belonging－Actual Response。','他不要我＝我沒有價值。','把對方的選擇與自己的整體價值拆開。'],
['委屈','Grievance','系統判斷自己的投入、善意或犧牲沒有得到應有回報。','Expected Reciprocity－Actual Reciprocity。','我付出這麼多，你怎麼可以這樣？','重新檢查交換規則、界線與未說出口的期待。'],
['怨恨','Resentment','長期未修復的不公平Prediction Error被持續保存。','Fairness Model長期與Reality不符。','這筆帳還沒有被修復。','修復、重談規則、建立界線或退出失衡交換。'],
['後悔','Regret','現在的自己重新模擬過去，生成「另一個選擇可能更好」的反事實世界。','Actual Outcome－Counterfactual Outcome。','如果當時選另一條路就好了。','把Counterfactual轉成下一次Decision Rule。'],
['自責','Self-blame','系統把負面結果過度歸因給自己。','Responsibility Model失真。','都是我的錯。','重新分配自己、他人、環境與隨機性的因果權重。'],
['自卑','Inferiority','自我模型長期預測「我的能力或價值低於比較群體」。','Ideal／Social Standard－Self Model。','別人比我好，所以我比較差。','從Identity Ranking轉向Specific Skill Gap。'],
['不安','Insecurity','系統無法確定重要資源、關係、能力或身分是否穩定。','需要穩定，但模型的Confidence太低。','它隨時可能消失。','找出真正不穩定的是哪個Node。'],
['擔心','Worry','系統反覆模擬未來負面Scenario，希望藉由思考提高控制力。','Unknown Future＋High Importance。','再想一下，也許就能避免危險。','區分可以Action的問題與目前不可控制的不確定性。'],
['煩躁','Irritation','大量小型Prediction Error持續累積，系統調節容量下降。','小干擾很多＋可用資源不足。','怎麼什麼都不順？','先降低負荷，再處理事件。'],
['厭惡','Disgust','系統把某刺激表徵為污染、有害、排斥或需要保持距離。','刺激與Safety／Purity Model衝突。','我要離它遠一點。','先分辨生物性危險、學習形成的厭惡與價值判斷。'],
['失落','Sense of Loss','原本存在於World Model中的重要可能性突然消失。','Expected Possibility－Current Possibility。','我以為我還擁有那個未來。','允許舊模型退場，再重新生成可能性空間。'],
['空虛','Emptiness','系統仍在運作，但高權重Goal／Meaning／Connection不足。','Activity存在，但Meaning不足。','我每天都在做事，卻不知道為什麼。','不是塞更多刺激，而是重建Value→Goal→Action的連結。'],
['無聊','Boredom','目前環境提供的資訊量、挑戰度或新奇度低於系統需要。','Prediction太容易、Difference Information太少。','沒有值得注意的新東西。','提高挑戰、探索或重新設定任務。'],
['壓力','Stress','系統預測環境要求可能超過目前可調度資源。','Demand > Perceived Capacity。','事情太多，我可能處理不了。','降低Demand、增加Capacity、提高控制度或重新排序權重。'],
['內疚／虧欠','Indebtedness','交換模型偵測「別人給我的多於我目前回饋的」。','Received Value > Returned Value。','我欠他。','確認是真實責任、健康互惠，還是被操控形成的虧欠感。'],
['痛苦','Distress','高權重需求、價值、身分或安全模型與Reality產生巨大而持續的落差，同時系統暫時找不到降低誤差的方法。','High Prediction Error＋High Precision＋Low Perceived Control。','Reality一定要改，我才能好起來。','同時檢查Reality、Representation、Prediction、Weight與Action，而不是只攻擊情緒。']
].map((a,i)=>({i:i+1,n:a[0],e:a[1],s:a[2],g:a[3],o:a[4],u:a[5],x:a[6]||''}));

const GAPS=[
['Threat Gap','威脅落差',['焦慮','恐懼','擔心','不安']],
['Goal Gap','目標落差',['挫折','失望','煩躁']],
['Loss Gap','失去落差',['悲傷','失落','孤獨','絕望']],
['Social Gap','社會連結落差',['被拒絕感','尷尬','嫉妒']],
['Self Gap','自我模型落差',['羞恥','自卑','自責']],
['Moral Gap','價值落差',['罪惡感','內疚／虧欠']],
['Fairness Gap','公平交換落差',['憤怒','委屈','怨恨']],
['Meaning／Control Gap','意義與控制落差',['空虛','無助','壓力','無聊']]
].map((a,i)=>({i:i+1,en:a[0],zh:a[1],emo:a[2]}));
EMO.forEach(e=>{const g=GAPS.find(g=>g.emo.includes(e.n));e.gap=g?g.i:0});

const NODES=[
['Prediction','我原本預測什麼？'],
['Representation','我把這件事情表徵成什麼？'],
['Value／Need','什麼對我很重要？'],
['Precision／Weight','我給這個訊號多大的可信度與權重？'],
['World Model','我相信自己、別人與世界應該如何運作？']];

const CHAIN_GEN='Reality現實→Sensory/Input輸入→Representation表徵：「我把這件事看成什麼？」→World Model世界模型：「世界應該怎麼運作？」→Prediction預測：「接下來應該發生什麼？」→Reality Feedback現實回饋→Difference差異→Prediction Error預測誤差→Value／Need判定：「這個差異對我重要嗎？」→Emotion Signal情緒警示→Attention注意力重新配置→Action Tendency行動傾向→Model Update模型更新，或舊模型持續維持';
const CHAIN_TRACE='Emotion→Body State→Trigger→Attention→Representation→Meaning→Prediction→Prediction Error→Need→Value→Rule→Belief→World Model→Identity Model→Past Learning→Action Tendency→Feedback→Model Update→Retest';
const CHAIN_SHORT='情緒→Difference→Prediction→Representation→World Model→Evidence→Model Update→Retest';
const CHAIN_TRAIN='Emotion→Body→Trigger→Fact→Representation→Prediction→Prediction Error→Need／Value→Old Model→Second Model→Experiment→Feedback→Model Update→Retest';
const CHAIN_FINAL='Trigger→Body State→Attention→Representation→Meaning→Prediction→Reality→Prediction Error→Need／Value→Emotion→Action Tendency→Behavior→Feedback→Evidence→Alternative Representation→Model Update→New Prediction→Retest→Calibration→Capability→Freedom';

const LEVELS=[
['初階','我很生氣，所以一定是你錯。'],
['進階','我很生氣，所以我的系統偵測到重要落差。'],
['再進階','到底是哪一個Prediction與Reality不一致？'],
['高階','這個Prediction又是哪個Representation、Rule與World Model生成的？'],
['更高階','我的模型有多少Evidence？還有哪些Alternative Models？'],
['成熟','設計一個小實驗，讓Reality決定哪個模型比較準。'],
['自由','即使情緒很強，我仍然保留更新Representation、Prediction與Action的能力。']];

const ABIL=`
#SIGNAL｜先讀懂燈號
情緒辨識能力｜我現在到底是生氣、害怕、羞恥、失望，還是混合情緒？
情緒命名能力｜把「我很不舒服」提高解析度成精準詞彙。
情緒強度辨識｜現在是2分、5分還是9分？
情緒混合辨識｜表面是憤怒，底下是否同時有害怕與受傷？
主次情緒辨識｜哪一個是第一情緒？哪一個是後來生成的第二情緒？
情緒時間辨識｜它是剛剛生成，還是已經累積三天？
情緒頻率辨識｜這個訊號偶爾出現，還是每天重複？
情緒持續度辨識｜刺激消失後，系統多久才能回到Baseline？
情緒情境辨識｜它只在特定人、地方、時間或任務出現嗎？
情緒比例辨識｜現在的反應強度與事件本身是否大致匹配？
#BODY｜先排除身體狀態
身體訊號辨識｜心跳、胸悶、胃縮、肩頸緊、發熱、顫抖在哪裡？
疲勞辨識｜我是真的生氣，還是睡眠不足讓神經系統容錯率下降？
飢餓辨識｜低能量是否正在放大威脅訊號？
睡眠辨識｜今天的World Model是否被睡眠不足扭曲？
疼痛辨識｜慢性疼痛是否正在提高負面訊號權重？
刺激負荷辨識｜聲音、訊息、人群、工作是否已超過系統容量？
生理喚醒辨識｜這是心理威脅，還是身體先進入高喚醒狀態？
恢復能力辨識｜真正問題可能不是刺激太大，而是Recovery太慢。
#TRIGGER｜找到觸發點
事件辨識｜情緒出現前30秒發生了什麼？
人物辨識｜是哪一類人最容易觸發這個反應？
語句辨識｜對方究竟說了哪一句話？
表情辨識｜是不是一個眼神就啟動了舊模型？
場景辨識｜哪些環境會讓同一模式反覆出現？
記憶觸發辨識｜現在的事件是否只是按到過去經驗的按鈕？
象徵觸發辨識｜真正刺激我的不是事件，而是事件「代表了什麼」？
#FACT｜把Reality與Story拆開
事實分離能力｜攝影機真正拍得到什麼？
推論辨識能力｜哪些內容其實是我推測的？
評價辨識能力｜「他很自私」是Fact還是Judgment？
讀心辨識能力｜「他就是看不起我」有多少Evidence？
意圖辨識能力｜我是不是把結果直接推論成對方的意圖？
因果辨識能力｜A發生在B之前，不代表A就是B的唯一原因。
證據辨識能力｜支持我的解釋有哪些證據？
反證搜尋能力｜什麼Evidence會證明我的解釋可能不完整？
未知辨識能力｜哪些地方其實應該標記Unknown？
#ATTENTION｜檢查注意力如何選擇Reality
注意力偏差辨識｜我是不是只看到負面訊號？
威脅放大辨識｜系統是不是正在優先掃描危險？
確認偏誤辨識｜我是不是只收集支持舊模型的Evidence？
負面過濾辨識｜十件好事加一件壞事，我是否只記得壞事？
顯著性辨識｜這件事情真的重要，還是只是非常刺眼？

function abRow(a){return `<label class="ab ${S.done[a.n]?'done':''}"><input type="checkbox" ${S.done[a.n]?'checked':''} onchange="tog(${a.n},this)"><span class="t"><span class="num">${String(a.n).padStart(3,'0')}</span>${a.t?'<b>'+hl(a.t)+'</b>｜':''}${hl(a.d)}</span></label>`}
function tog(n,el){if(el.checked)S.done[n]=1;else delete S.done[n];save();el.parentNode.classList.toggle('done',el.checked);const c=Object.keys(S.done).length;const p=$('#prog');if(p){p.textContent=c;$('#progb').style.width=c/TOTAL*100+'%'}}

const V={};
V.home=()=>`
<h2>核心觀念｜情緒儀表板＝系統警示燈</h2>
<div class="card">
<p>最重要的觀念不是「負面情緒不好」，而是「情緒正在回報系統目前偵測到哪一種落差」。</p>
<p>在預測處理框架裡，大腦會持續產生Prediction，Reality與Prediction不一致時產生Prediction Error，再依訊號可信度與重要性決定要不要更新模型。</p>
<p>所以不要只問：「我要怎麼讓這個情緒消失？」</p>
<blockquote>更高槓桿的問題是：「這盞燈背後，是哪個Prediction、Representation、Need、Value或World Model正在與Reality發生落差？」</blockquote>
<p class="sub"><b>科學邊界：</b>Prediction Error不是每種情緒唯一的「底層原因」，情緒是身體狀態、過去經驗、情境、概念、注意力與預測共同建構的結果；不同神經狀態甚至可能生成相似情緒。Prediction Error的功能不是宣判「你錯了」，而是提供可用來更新模型的Difference Information；情緒經驗本身則是分散、動態且受情境影響的建構過程。<br>
參考：<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9074371/" target="_blank" rel="noopener">PMC9074371</a>・<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4329228/" target="_blank" rel="noopener">PMC4329228</a>・<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4276319/" target="_blank" rel="noopener">PMC4276319</a>・<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10136704/" target="_blank" rel="noopener">PMC10136704</a></p>
</div>

<h2>總生成鏈</h2><div class="card">${chain(CHAIN_GEN)}</div>

<h2>30種Dashboard Signal → 8種Difference → 5個核心Node</h2>
<div class="card"><p>不是「30種情緒＝30個問題」，而是「30種情緒＝30種Dashboard Signal」。Dashboard Signal往上追，可以壓縮成8種Difference；8種Difference再往上追，可以壓縮成5個核心Node。</p></div>
<div class="grid">${GAPS.map(g=>`<div class="card"><h3><span class="num">${'①②③④⑤⑥⑦⑧'[g.i-1]}</span>${g.en}</h3><div class="sub">${g.zh}</div><div class="chips">${g.emo.map(n=>`<button class="chip" onclick="showEmo('${n}')">${n}</button>`).join('')}</div></div>`).join('')}</div>
<p class="sub">原文的8個Source Node未列入：${EMO.filter(e=>!e.gap).map(e=>e.n).join('、')}（仍可在「30種情緒」查看）。</p>
<div class="card" style="margin-top:12px"><h3>5個核心Node</h3>
${NODES.map((n,i)=>`<p><span class="num">${'①②③④⑤'[i]}</span><b>${n[0]}</b>｜${n[1]}</p>`).join('')}</div>

<h2>情緒溯源能力</h2>
<div class="card">
<p>真正值得訓練的能力不是「情緒控制」，而是「情緒溯源能力」。</p>
${chain(CHAIN_SHORT)}
<p style="margin-top:10px"><b>核心定義｜</b>情緒溯源能力＝Emotion出現後，不急著相信、不急著壓制、不急著行動，而是沿著生成鏈逆向追蹤訊號來源。</p>
<p><b>核心鏈｜</b></p>${chain(CHAIN_TRACE)}
<p style="margin-top:10px">真正的情緒成熟，不是情緒越來越少，而是情緒出現後，越來越快找到它從哪裡生成。</p>
</div>

<h2>範例｜考卷只有58分</h2>
<div class="card">
<p><b>舊系統</b></p>${chain('58分→「我英文很爛」→羞恥→逃避')}
<p style="margin-top:10px"><b>新系統</b></p>${chain('58分→情緒亮燈→「哪個Prediction錯了？」→「我以為背過等於會做」→Evidence顯示換句子就不會→Model Update：「真正學會＝換題＋隔天仍能答對」→重新練習→Retest')}
</div>

<h2>最高階能力不是Emotion Control，而是Emotion Debugging</h2>
<div class="card">${LEVELS.map(l=>`<p><span class="tag">${l[0]}</span>${l[1]}</p>`).join('')}</div>

<h2>訓練鏈（本APP的練習流程）</h2>
<div class="card">${chain(CHAIN_TRAIN)}
<p class="sub" style="margin-top:8px">最終目標不是「情緒變少」，而是逐步形成「情緒一出現→自動開始Debug→產生第二模型→向Reality取樣→更新模型」的能力。</p>
<p><button class="btn" onclick="go('trace')">開始一次溯源</button></p></div>

<h2>最終總公式</h2><div class="card">${chain(CHAIN_FINAL)}</div>

<div class="card">
<p>情緒不是最後答案。情緒比較像「請打開系統紀錄」的通知。</p>
<p>情緒不是命令。情緒不是Reality。情緒甚至不是錯誤。<br>情緒是系統對「目前狀態＋目前模型＋目前Reality」所產生的一組高資訊量訊號。</p>
<blockquote>不要砸掉警示燈。不要跪拜警示燈。讀懂警示燈。<br>沿著線路向上Debug。最後修改真正需要修改的Node。</blockquote>
<p>真正的智慧不是把儀表板的燈拔掉，而是沿著燈號往上追，找到產生誤差的模型。</p>
<p>真正的自由也不是永遠沒有負面情緒，而是：情緒出現時，我不再自動被舊模型接管，而有能力產生第二個Representation、第二個Prediction與第二條Action Path。</p>
<p><b>成長</b>＝Prediction Accuracy提高。<br><b>智慧</b>＝知道什麼時候不相信自己的第一個Representation。<br><b>韌性</b>＝Prediction Error出現後仍然可以重新建模。<br><b>自由</b>＝舊模型啟動時，我仍然有能力選擇不讓它直接變成下一個行為。</p>
</div>`;

<div class="chips"><button class="chip ${!gapF?'on':''}" onclick="gapF=0;render()">全部</button>${GAPS.map(g=>`<button class="chip ${gapF===g.i?'on':''}" onclick="gapF=${g.i};render()">${g.zh}</button>`).join('')}</div>

V.trace=()=>{const d=S.draft;return `<h2>溯源訓練｜${d.id?'編輯紀錄':'新的一次Debug'}</h2>
${chain(CHAIN_TRAIN)}
<div class="two" style="margin-top:12px"><div class="card">

${STEPS.map(s=>`<label class="f">${s[1]}</label><p class="hint">${s[2]}</p><textarea placeholder="${esc(s[3])}" oninput="setD('${s[0]}',this.value)">${esc(d[s[0]])}</textarea>${

  s[0]==='error'?`<label class="f">Need｜哪個需求正在亮燈？<small>可複選</small></label><div class="chips">${NEEDS.map(n=>`<button class="chip ${d.needs.includes(n)?'on':''}" onclick="togNeed('${n}',this)">${n}</button>`).join('')}</div>`:''}`).join('')}

</div>
<div class="side"><div class="card" id="hint"></div>
<div class="card"><h3>高階情緒溯源七問</h3>${LAYERS[26].items.map(a=>`<p class="sub" style="margin:2px 0">${a.d}</p>`).join('')}</div></div></div>`};
function hintHTML(){const e=EMO.find(e=>e.n===S.draft.emo);if(!e)return '<h3>溯源地圖</h3><p class="sub">選擇情緒後，這裡會顯示它的源頭、核心落差、常見舊模型與更新方向。</p>';
  const g=GAPS[e.gap-1];return `<h3>${e.n} <span class="sub">${e.e}</span></h3>${g?`<span class="tag">${g.en}｜${g.zh}</span>`:''}<dl><dt>源頭</dt><dd>${e.s}</dd><dt>落差</dt><dd>${e.g}</dd><dt>舊模型</dt><dd>「${e.o}」</dd><dt>更新</dt><dd>${e.u}</dd></dl>`}
function hint(){const h=$('#hint');if(h)h.innerHTML=hintHTML()}
function setD(k,v){S.draft[k]=v;save()}
function togNeed(n,el){const a=S.draft.needs,i=a.indexOf(n);i<0?a.push(n):a.splice(i,1);el.classList.toggle('on');save()}
function startTrace(n){S.draft=blank();S.draft.emo=n;save();go('trace')}
function newRec(){S.draft=blank();save();render();scrollTo(0,0)}
function scen(){const s=SCEN[Math.floor(Math.random()*SCEN.length)];S.draft=blank();S.draft.trigger='（練習情境）'+s;save();render();toast('已帶入練習情境')}
function saveRec(){const d=S.draft;if(!d.emo&&!d.trigger&&!d.fact){toast('至少選一個情緒或寫下觸發點');return}
  const now=Date.now();if(!d.id){d.id=now;d.created=now}d.updated=now;
  const i=S.records.findIndex(r=>r.id===d.id);const c=JSON.parse(JSON.stringify(d));i<0?S.records.push(c):S.records[i]=c;save();toast('已儲存')}

V.test=()=>{const L=LAYERS.slice(0,26),n=Object.keys(rate).length;

function exportJSON(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'情緒溯源',exported:new Date().toISOString(),records:S.records,assess:S.assess,done:S.done},null,2)],{type:'application/json'}));

Turn the counterfactual into a decision rule for next time.

When something goes wrong, your first thought is always, "It's all my fault."
有一部分是我的。
有一部分是別人的。
有一部分是環境與運氣的。
Part of it is mine.
Part of it belongs to others.
Part of it belongs to circumstance and chance.
把不屬於你的責任還回去，也是一種負責。
自責很用力，但不等於在解決問題。
Taking responsibility doesn't mean claiming every cause as your own.
Handing back what isn't yours is also responsible.
Self-blame is intense, but it is not the same as solving the problem.
"It's all my fault."
Redistribute the causal weight among myself, others, the environment, and randomness.

You always feel everyone is better than you, so you make yourself small.
不要問「我比誰差」。
要問「我差在哪一項」。
再問「這一項，怎麼練」。
Don't ask "who am I worse than."
Ask "which skill am I behind in."
Then ask "how do I train that one."
排名會讓你縮小，差距會讓你前進。
你看見的是別人的成果，沒看見的是他的過程。
You're not inferior; there is simply a gap in one specific skill.
Rankings shrink you; gaps move you forward.
You see others' results, not their process.
"Others are better, so I'm worse."
Shift from ranking your identity to naming a specific skill gap.

Everything is fine right now, yet you feel the good things could vanish at any moment.
是關係不穩，還是我不敢相信？
是能力不夠，還是我看不見自己？
是真的會失去，還是我習慣了害怕？
Is the relationship unstable, or do I not dare to trust?
Is my ability lacking, or can I not see myself?
Will I really lose it, or am I just used to being afraid?
不安不是直覺很準，是信心太低。
抓得住的不是保證，是當下的證據。
Find the one point that's truly unstable, and the rest need not shake with it.
Insecurity isn't sharp intuition; it's low confidence.
What you can hold isn't a guarantee, but the evidence of now.
"It could disappear at any time."
Find out which node is actually unstable.

You thought thinking it over again would make you safer. It only made you more tired.
能做的，寫下來去做。
不能做的，寫下來放著。
分不清的，先問：這一步在我手上嗎？
What you can act on, write down and do.
What you can't, write down and set aside.
If you can't tell, ask: is this step in my hands?
擔心看起來像在準備，其實是在原地繞圈。
想一百遍，不如做一小步。
Act where you can; where you can't, more thinking won't make you safer.
Worry looks like preparing but is really circling in place.
One small step beats a hundred rounds of thinking.
"If I think a bit more, maybe I can prevent the danger."
Separate problems you can act on from uncertainty you can't control right now.

No one provoked you. You've simply run out of battery today.
少一則訊息。
少一件雜事。
多一口氣，多一點空白。
One less message.
One less chore.
One more breath, a little more blank space.
小事變大，通常是容量變小。
脾氣不好之前，常常是休息不夠。
Lighten your load first, then deal with the issue.
When small things feel big, your capacity has usually shrunk.
Before the bad temper, there was usually too little rest.
"Why is nothing going right?"
Reduce the load first, then handle the event.

Some people and things make you want to back away the moment you get close.
有的是身體在保護你。
有的是過去教會你的。
有的是你的價值在說「不」。
Some of it is your body protecting you.
Some of it is what the past taught you.
Some of it is your values saying "no."
想遠離並不可恥，但值得弄清楚原因。
厭惡畫出了你的邊界，也可能畫出了你的偏見。
First ask: is it truly harmful, or an aversion I learned?
Wanting distance is nothing to be ashamed of, but it is worth understanding.
Disgust draws your boundary, and sometimes your bias.
"I need to stay away from it."
Tell biological danger, learned aversion, and value judgment apart.

You thought that future was still there. You turned around and found it gone.
謝謝它曾經存在。
承認它已經離開。
然後，替新的可能留一個位置。
Thank it for having existed.
Admit that it has left.
Then leave a place for something new.
空出來的地方不是洞，是空間。
失落是告別的儀式，不是終點。
Let the old possibility leave the stage so a new one has room to grow.
The emptied place is not a hole; it is space.
A sense of loss is a ritual of farewell, not the end.
"I thought I still had that future."
Allow the old model to retire, then regenerate the space of possibilities.

You're busy every day, and you don't know what you're busy for.
行程很滿，心卻很空。
事情很多，意義卻很少。
一直在做，卻沒有一件是為了自己在乎的事。
A full schedule, an empty heart.
Many tasks, little meaning.
Always doing, yet nothing for what you care about.
填不滿的不是時間，是意義。
先問我在乎什麼，再問我要做什麼。
Emptiness doesn't need more stimulation; it needs action reconnected to what you care about.
What can't be filled is not time, but meaning.
Ask what I care about before asking what I should do.
"I do things every day and don't know why."
Don't add stimulation; rebuild the link from value to goal to action.

Nothing excites you. You're not lazy; there's just nothing new here.
把難度調高一點。
把範圍走遠一點。
把問題問深一點。
Turn the difficulty up a little.
Walk a little farther out.
Ask the question a little deeper.
太容易的日子，也會讓人枯萎。
無聊不是沒事做，是沒有值得學的事。
Boredom is your system saying: I'm ready for a bigger challenge.
Days that are too easy can wither a person too.
Boredom isn't having nothing to do; it's having nothing worth learning.
"There's nothing new worth noticing."
Raise the challenge, explore, or redefine the task.

One thing after another piles on, and you feel you're about to give way.
可以減少的，刪掉。
可以求助的，開口。
可以延後的，排到明天。
What can be cut, cut.
Where help exists, ask.
What can wait, move to tomorrow.
你不需要變成超人，只需要重新排序。
撐住不是唯一的選項，調整也是。
Stress doesn't mean you're not strong enough; demand has temporarily outgrown resources.
You don't need to be superhuman; you need to re-prioritize.
Holding on is not the only option; adjusting is one too.
"There's too much. I may not be able to handle it."
Lower the demand, add capacity, increase control, or re-rank the priorities.

Someone is kind to you, and all you feel is "I owe them."
真心的給予，不會附帳單。
健康的關係，不會一直算帳。
讓你喘不過氣的恩情，值得停下來看一看。
A sincere gift comes with no invoice.
A healthy relationship doesn't keep a running bill.
A kindness that leaves you breathless deserves a second look.
接受善意，也是一種能力。
感謝可以說出口，不必用一輩子還。
First ask: is this reciprocity, or a debt that binds me?
Receiving kindness is also a skill.
Gratitude can be spoken; it needn't be repaid for a lifetime.
"I owe them."
Check whether it is real responsibility, healthy reciprocity, or indebtedness created by manipulation.

You keep waiting for the world to change first so that you can feel better.
看看現實，哪些真的能改。
看看解釋，哪些只是其中一種。
看看期待，哪些抓得太緊。
Look at reality: what can really be changed.
Look at your interpretation: which is only one of many.
Look at your expectations: which are held too tightly.
痛是真的，但「只能這樣」不一定是真的。
你不必先不痛，才開始往前。
When it hurts, don't only attack the emotion; go back and check your model.
The pain is real; "this is the only way" may not be.
You don't have to stop hurting before you start moving.
"Reality must change before I can get better."
Check reality, representation, prediction, weight, and action together instead of only attacking the emotion.

You say "I feel bad." But do you know exactly which feeling it is?
是生氣，還是受傷？
是害怕，還是失望？
是今天才有，還是累積了很久？
Is it anger, or hurt?
Is it fear, or disappointment?
Did it start today, or has it been building for a long time?
「不舒服」是模糊的，「委屈」才找得到出口。
情緒的解析度越高，人就越不容易被淹沒。
Only an emotion you can name is an emotion you can work with.
"Uncomfortable" is vague; "wronged" has somewhere to go.
The higher the resolution of your emotions, the harder it is to be flooded.

You think you're angry. You may just be short on sleep.
餓的時候，世界比較可惡。
累的時候，問題比較巨大。
痛的時候，人比較難相處。
When you're hungry, the world looks meaner.
When you're tired, problems look bigger.
When you're in pain, people look harder to bear.
很多心事，睡一覺就縮小一半。
身體沒電的時候，不要替人生下結論。
Take care of the body first, then trust the conclusion your emotion draws.
Many troubles shrink by half after a night's sleep.
Don't draw conclusions about life on an empty battery.

The same kind of person, the same sentence, and you explode in an instant.
是哪一句話？
是哪一個眼神？
是哪一段，其實早就發生過的記憶？
Which sentence was it?
Which look?
Which memory that actually happened long ago?
引爆你的常常不是現在，是過去。
看得見引信，就來得及不爆。
Find where the button is, and you won't have to be pushed every time.
What sets you off is often not the present, but the past.
If you can see the fuse, there's time not to explode.

What hurts is often not what happened, but the story you tell yourself about it.
事實是：他沒有回。
推論是：他不在乎。
評價是：他很自私。
Fact: he didn't reply.
Inference: he doesn't care.
Judgment: he's selfish.
不知道的地方，就誠實地寫上「不知道」。
先有事實，才有資格下結論。
Keep what the camera recorded apart from what the mind made up.
Where you don't know, honestly write "unknown."
Facts first; conclusions have to earn their place.

Ten compliments and one criticism, and all night you remember only the one.
你盯著缺口，就看不見完整。
你盯著危險，就看不見安全。
你盯著那一句，就聽不見其他九句。
Stare at the gap and you miss the whole.
Stare at the danger and you miss the safety.
Stare at that one line and you can't hear the other nine.
刺眼，不等於重要。
注意力放在哪裡，世界就長成哪個樣子。
What you see is not all of reality, only what attention picked for you.
Glaring doesn't mean important.
Where your attention goes, your world takes that shape.

The same event: someone laughs it off, and you hurt for three days.
把「全部」縮回「這一次」。
把「永遠」改成「目前」。
把「我就是這樣」改成「我現在是這樣」。
Shrink "everything" back to "this time."
Change "always" to "for now."
Change "that's who I am" to "that's how I am right now."
第一個解釋最快，但不一定最準。
換一個看法不是自欺，是多一種可能。
It's not the event that hurts; it's what you took it to be.
The first interpretation is the fastest, not necessarily the most accurate.
A second view is not self-deception; it's one more possibility.

He just didn't reply, and you read it as "he doesn't love me anymore."
58分，只是58分。
沒回訊息，只是沒回訊息。
一次失敗，只是一次失敗。
58 points is just 58 points.
No reply is just no reply.
One failure is just one failure.
小心那個自動翻譯的聲音。
你可以重新翻譯一次。
Events carry no meaning by themselves; meaning is your translation.
Watch out for the voice that translates automatically.
You can translate it again.

The unspoken "it's supposed to be this way" is exactly where you got hurt.
我以為努力就會成功。
我以為付出就會被珍惜。
我以為愛我的人就該懂我。
I assumed effort meant success.
I assumed giving meant being cherished.
I assumed those who love me should just understand me.
沒說出口的期待，最容易變成失望。
找到「我以為」，就找到了情緒的源頭。
Behind every emotion is a prediction that didn't come true.
Unspoken expectations turn into disappointment most easily.
Find the "I assumed," and you've found the source of the emotion.

Reality didn't go the way you pictured, so the whole world feels wrong.
差在哪裡？
差了多少？
是世界變了，還是我本來就猜錯了？
Where is the gap?
How big is it?
Did the world change, or was my guess wrong from the start?
落差是資訊，不是羞辱。
看得越準，痛得越短。
A gap is not a verdict that you are wrong; it shows you where to update.
A gap is information, not humiliation.
The more precisely you see it, the shorter it hurts.

You were never arguing about that small thing, but about a need no one saw.
有時候你要的是安全。
有時候你要的是尊重。
有時候你要的，只是好好休息。
Sometimes what you need is safety.
Sometimes it's respect.
Sometimes all you need is real rest.
說得出需要，就不必用脾氣表達。
被看見的需要，才有機會被滿足。
Emotion is the gatekeeper of need; ask what it is guarding.
When you can name the need, you no longer have to express it through temper.
Only a need that is seen has a chance to be met.

If you truly didn't care, it wouldn't hurt this much.
這是我的價值，還是別人給我的？
這是現在的我要的，還是十年前的我要的？
這件事，值得排在第一位嗎？
Is this my value, or one handed to me?
Is this what I want now, or what I wanted ten years ago?
Does it deserve first place?
情緒是價值的影子。
看重的東西太多，就什麼都保護不了。
Where it hurts is where you care the most.
Emotion is the shadow of value.
Value too many things and you can protect none of them.

"Must." "Have to." "Should." These words are strangling you.
好人，不一定不能拒絕。
努力，不一定不會失敗。
相愛，不一定什麼都懂。
Good people may still say no.
Hard work may still fail.
Loving each other doesn't mean understanding everything.
每一個「應該」，都值得問一句：誰說的？
規則是用來幫你的，不是用來罰你的。
Change "always" to "usually," and the heart gains a little room.
Every "should" deserves one question: says who?
Rules are there to help you, not to punish you.

It's not that bad things keep happening. You keep believing "I'm just not good enough."
失敗是資訊，不是判決。
拒絕是不合，不是不配。
衝突是協商，不是結束。
Failure is information, not a verdict.
Rejection is a mismatch, not unworthiness.
Conflict is negotiation, not the end.
你相信什麼，就會看見什麼。
舊信念不必打倒，只要給它新的證據。
A belief that has been around a long time is not thereby true.
You see what you believe.
An old belief needn't be defeated; just give it new evidence.

You keep feeling life "shouldn't be this way," and so you keep suffering.
人，不一定公平。
付出，不一定有回報。
成功，不一定是一條直線。
People are not always fair.
Giving is not always returned.
Success is not always a straight line.
你看到的不是世界，是你對世界的模型。
地圖錯了就改地圖，不要罵路。
The world never promised to run by your model.
What you see is not the world, but your model of it.
If the map is wrong, fix the map; don't curse the road.

One failure, and you label yourself "a failure."
我失敗了，不是我是失敗者。
我現在焦慮，不是我是焦慮的人。
有人不喜歡我，不是我不值得被愛。
I failed; I am not a failure.
I'm anxious now; I am not an anxious person.
Someone dislikes me; I am not unlovable.
標籤貼得很快，撕下來要練習。
你是一個正在更新的版本，不是定稿。
"I can't do it yet" is not "I have no ability."
Labels stick fast; peeling them off takes practice.
You are a version still updating, not the final draft.

Your reaction today may be your ten-year-old self deciding for you.
那時候不能犯錯，現在可以。
那時候不能拒絕，現在可以。
那時候沒有選擇，現在有了。
Back then you couldn't make mistakes; now you can.
Back then you couldn't say no; now you can.
Back then you had no choice; now you do.
舊反應不是你的錯，但更新是你的權利。
謝謝小時候的自己，然後把方向盤拿回來。
What protected you then may be limiting you now.
The old reaction isn't your fault, but updating it is your right.
Thank your younger self, then take back the wheel.

Why can one criticism drown out a hundred words of praise?
說這句話的人，了解我嗎？
這句話，有證據嗎？
這句話，值得我想三天嗎？
Does the person who said it know me?
Is there evidence for it?
Is it worth three days of my thoughts?
九成的確信，要有九成的證據。
把音量調小不是否認，是校準。
Not every voice deserves that much weight.
Ninety percent certainty needs ninety percent evidence.
Turning the volume down isn't denial; it's calibration.

What exhausts you most is trying to change someone who isn't yours to manage.
我能決定怎麼說，不能決定他怎麼聽。
我能決定怎麼做，不能決定結果如何。
我能決定我的界線，不能決定他的心。
I decide how I say it, not how they hear it.
I decide what I do, not how it turns out.
I decide my boundaries, not their heart.
分清楚你的和他的，心就輕了一半。
放手不是放棄，是把力氣用在對的地方。
Put your energy back into the process you control, and release the outcome you don't.
Sort what's yours from what's theirs, and the heart is half as heavy.
Letting go isn't giving up; it's spending strength in the right place.

You regretted the words the moment they left your mouth, but you couldn't stop.
憤怒叫你攻擊。
焦慮叫你逃開。
害怕失去，叫你委屈自己。
Anger tells you to attack.
Anxiety tells you to flee.
Fear of loss tells you to give yourself up.
在衝動和行動之間，留三秒。
一直想，不等於在解決。
Emotion can call you to act, but you decide whether to obey.
Leave three seconds between the impulse and the action.
Thinking about it endlessly is not solving it.

Different people, different places. Why do you keep meeting the same problem?
越焦慮越追問，越追問對方越退。
越害怕越不做，越不做越害怕。
越怕失敗越拖延，越拖延越失敗。
The more anxious, the more you chase; the more you chase, the more they withdraw.
The more afraid, the less you do; the less you do, the more afraid.
The more you fear failing, the more you delay; the more you delay, the more you fail.
看見循環，就已經站在循環外面一步。
改掉其中一個環節，整個圈就會鬆開。
What repeats is not luck, but a loop not yet seen.
To see the loop is already to stand one step outside it.
Change one link, and the whole circle loosens.

The emotion you keep trying to drive away has been protecting you all along.
它在提醒你什麼？
它在保護你什麼？
它現在的代價，又是什麼？
What is it reminding you of?
What is it protecting?
And what does it cost you now?
沒有多餘的情緒，只有還沒讀懂的訊號。
過期的保護，可以溫柔地退役。
Thank it for protecting you, then ask whether you still need it.
There are no useless emotions, only signals not yet understood.
Protection that has expired can be gently retired.

You decided "he did it on purpose," and the whole world became your enemy.
除了故意，還可能是疏忽。
除了我的錯，還有別的原因。
除了最壞的結果，還有很多種明天。
Besides intent, it could be carelessness.
Besides my fault, there are other causes.
Besides the worst outcome, there are many kinds of tomorrow.
不是「一定是」，而是「有幾成可能」。
讓三個解釋同時存在，你就自由了一點。
One more explanation is one more road.
Not "it must be," but "how likely is it."
Let three explanations exist at once, and you are a little freer.

You understand all the reasoning, and next time it happens again.
不必刪掉信念，只要降低音量。
不必否定自己，只要修改策略。
不必一次到位，只要比上次準一點。
No need to delete the belief; just lower its volume.
No need to reject yourself; just revise the strategy.
No need to get it all at once; just be a little more accurate than last time.
懂了不算，做出不同的下一步才算。
願意修改，是最高級的自信。
Growth is not overturning your whole life; it is updating the one faulty node.
Understanding doesn't count until the next step is different.
Willingness to revise is the highest form of confidence.

You've played out a hundred endings in your head and never once actually asked.
與其猜他會拒絕，不如提一次小請求。
與其猜他不在乎，不如說一次真需要。
與其說我不行，不如換一題再試。
Rather than guess they'll refuse, make one small request.
Rather than guess they don't care, state one real need.
Rather than say I can't, try one more problem.
腦內劇場不收門票，但很花人生。
小實驗的成本，遠低於一輩子的猜測。
Don't guess. Try once, and let reality give you the answer.
The theater in your head sells no tickets, but it costs a lot of life.
A small experiment costs far less than a lifetime of guessing.

The thing you feared: did it actually happen?
我猜對了嗎？
我高估了什麼？
我低估了什麼？
Did I guess right?
What did I overestimate?
What did I underestimate?
不對答案的人，會一直用同一個錯的公式。
每一次回饋，都讓下一次的判斷更準一點。
Check the answer, and you learn whether you overrated the danger or underrated yourself.
Those who never check keep using the same wrong formula.
Each round of feedback makes the next judgment a little more accurate.

You are not your emotion. You are the one who sees it.
我正在生氣，不是我就是憤怒。
我有這個念頭，不是這就是事實。
我用這個模型看世界，不是世界就是這樣。
I am feeling anger; I am not anger.
I have this thought; that doesn't make it fact.
I see the world through this model; that doesn't make the world so.
可以暫時不知道答案，是一種力量。
發現自己錯了不是失敗，是校準成功。
Having a thought does not mean I am that thought.
Being able to not know for a while is a strength.
Finding you were wrong is not failure; it is calibration succeeding.

Swept away the moment emotion hits? Save these seven questions.
不急著相信。
不急著壓下去。
不急著做什麼。
No rush to believe it.
No rush to push it down.
No rush to do anything.
問題問得準，情緒就鬆了。
會提問的人，不容易被情緒綁架。
By the end of seven questions, you are already halfway out of the emotion.
Ask precisely, and the emotion loosens.
Those who know how to ask are hard for emotion to hijack.

Thirty seconds is enough to sort a tangle of emotion into sentences you can read.
先寫事實，再寫故事。
先寫預測，再寫落差。
先寫需要，再寫下一步。
Facts first, then the story.
Prediction first, then the gap.
Need first, then the next step.
寫下來的情緒，就不再是整個你。

['智慧，是知道什麼時候不相信自己的第一個解釋。','Wisdom is knowing when not to trust your first interpretation.'],
['韌性，是落差出現之後，仍然可以重新建模。','Resilience is being able to rebuild the model after the gap appears.'],

28:['Emotion: Right now I feel ___.','Fact: What the camera actually recorded is ___.','Story: My mind is explaining it as ___.','Prediction: I had assumed ___.','Difference: But reality turned out to be ___.','Need: So my need for ___ is lighting up.','Old Model: The old model behind it may be ___.','Alternative: At least one other explanation is ___.','Evidence: The evidence I still need is ___.','Action: The smallest step I can control now is ___.','Retest: Afterwards, I will observe ___ again.',"Update: If reality doesn't support the old model, I update it to ___."]};
const LAYER_EN={27:'Seven Questions',28:'30-Second Emotion Compiler'};
const POSTS=[];
const star=a=>a.map(g=>'✦ '+g);
EMO.forEach((e,i)=>{const b=XB[i],c=CLOSE[i%6],id='e'+e.i,nt=NOTE[id];

  p.text=[p.hook,p.hookEn,'',...p.par,'',`【${e.n} ${e.e}】${HEADS[i%3]}`,'源頭｜'+e.s,'落差｜'+e.g,'舊模型｜「'+e.o+'」','更新方向｜'+e.u,'',...star(p.gold),'',c[0],...(nt?['',nt[0]]:[]),'','———','',e.e,'',...p.parEn,'','Old model: '+b[12],'Update: '+b[13],'',...star(p.goldEn),'',c[1],...(nt?['',nt[1]]:[]),'',`#情緒溯源 #${e.n.replace('／','')} #${e.e.replace(/[^A-Za-z]/g,'')} #EmotionDebugging #讀懂警示燈`].join('\n');

LAYERS.forEach((l,i)=>{const b=XB[30+i],c=CLOSE[(i+3)%6],k=l.i===27?7:l.i===28?12:3,en=l.en||LAYER_EN[l.i];

  const p={id:'l'+l.i,kind:'l',label:'第'+CN[i]+'層｜'+(l.en?l.en+'｜':'')+l.zh,labelEn:'Layer '+l.i+' | '+en,hook:LH[i][0],hookEn:b[0],par:b.slice(1,4),parEn:b.slice(4,7),gold:[LH[i][1],b[7],b[8]],goldEn:b.slice(9,12),close:c,color:PAL[1+i%8]};

  POSTS.push(p)});
let cardMode='bi';
function postThumb(p){return `<div class="card" style="background:${p.color};color:#fff;border:0;cursor:pointer" onclick="selPost('${p.id}')"><div style="font-size:12px;opacity:.8">${hl(p.label)}</div><div style="font-size:17px;font-weight:700;line-height:1.5;margin:6px 0 2px">${hl(p.hook)}</div><div style="font-size:12px;opacity:.8;line-height:1.4;margin-bottom:8px">${hl(p.hookEn)}</div>${p.gold.map(g=>`<div style="font-size:13px;color:#ffe9c7">✦ ${hl(g)}</div>`).join('')}</div>`}
function wrapText(c,s,w){const tk=s.match(/[A-Za-z0-9'’]+|./g)||[],L=[];let cur='';
  tk.forEach(t=>{if(c.measureText(cur+t).width>w&&cur&&!'，。？！、」』）：；….,;:!?"'.includes(t)){L.push(cur);cur=t===' '?'':t}else cur+=t});if(cur.trim())L.push(cur);return L}
function drawCard(p){const cv=$('#cv');if(!cv)return;const c=cv.getContext('2d'),W=1080,H=1350,F='"Microsoft JhengHei","PingFang TC","Noto Sans TC","Segoe UI Symbol",sans-serif',m=cardMode;
  c.fillStyle=p.color;c.fillRect(0,0,W,H);const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(255,255,255,.10)');g.addColorStop(1,'rgba(0,0,0,.38)');c.fillStyle=g;c.fillRect(0,0,W,H);
  c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=3;c.strokeRect(40,40,W-80,H-80);
  const wh='#fff',cr='#ffe9c7',dim='rgba(255,255,255,.8)',crd='rgba(255,233,199,.82)';
  c.textBaseline='top';c.fillStyle=dim;c.font='32px '+F;c.fillText('情緒溯源｜Emotion Debugging',90,90);
  c.fillStyle=cr;c.font='bold 40px '+F;const ll=wrapText(c,m==='en'?p.labelEn:p.label,900);ll.forEach((l,i)=>c.fillText(l,90,150+i*54));
  c.font='28px '+F;const fl=wrapText(c,p.close[m==='en'?1:0],900),fy=H-85-fl.length*40;
  const y0=150+ll.length*54+40,avail=fy-40-y0;

  const B=[];
  if(m!=='en')B.push([p.hook,66,1,wh,m==='bi'?12:44]);

  p.gold.forEach((t,i)=>{if(m!=='en')B.push(['✦ '+t,38,0,cr,m==='bi'?4:20]);if(m!=='zh')B.push([(m==='en'?'✦ ':'')+p.goldEn[i],m==='en'?34:26,0,m==='en'?cr:crd,24])});
  let s=1.05,lay,h;do{s-=.05;h=0;lay=B.map(b=>{if(!b){h+=56*s;return null}c.font=(b[2]?'bold ':'')+Math.round(b[1]*s)+'px '+F;const L=wrapText(c,b[0],900);h+=L.length*b[1]*s*1.4+b[4]*s;return L})}while(h>avail&&s>.5);
  let y=y0+Math.max(0,(avail-h)/2);
  B.forEach((b,i)=>{if(!b){c.fillStyle=cr;c.fillRect(90,y+10*s,120,5);y+=56*s;return}
    c.font=(b[2]?'bold ':'')+Math.round(b[1]*s)+'px '+F;c.fillStyle=b[3];lay[i].forEach(l=>{c.fillText(l,90,y);y+=b[1]*s*1.4});y+=b[4]*s});
  c.fillStyle=dim;c.font='28px '+F;fl.forEach((l,i)=>c.fillText(l,90,fy+i*40))}
let postSel='',postF='';
V.post=()=>{const p=POSTS.find(p=>p.id===postSel);
return `<h2>臉書貼文＋圖卡｜30種情緒＋28層能力，共${POSTS.length}組</h2>

${p?`<div class="card"><div class="row" style="align-items:flex-start;gap:16px"><div style="width:340px;max-width:100%"><canvas id="cv" width="1080" height="1350" style="width:100%;border-radius:8px"></canvas><div class="chips">${[['bi','雙語圖卡'],['zh','中文圖卡'],['en','English']].map(m=>`<button class="chip ${cardMode===m[0]?'on':''}" onclick="cardMode='${m[0]}';render()">${m[1]}</button>`).join('')}</div></div>
<div style="flex:1;min-width:260px"><h3>${p.label}</h3><textarea id="ptx" style="min-height:480px;margin-top:6px">${esc(p.text)}</textarea>

<div class="grid">${POSTS.filter(p=>!postF||p.kind===postF).map(postThumb).join('')}</div>`};
