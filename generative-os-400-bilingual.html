let currentFilter = 'all';
let expandedItems = new Set();

function getGroup(num) {
    if (num <= 100) return 'group1';
    if (num <= 200) return 'group2';
    if (num <= 300) return 'group3';
    return 'group4';
}

function renderNav() {
    const nav = document.getElementById('navContainer');
    nav.innerHTML = '';
    
    const groups = [
        {title: '第一組 Group 1', range: [1, 100], filter: 'group1'},
        {title: '第二組 Group 2', range: [101, 200], filter: 'group2'},
        {title: '第三組 Group 3', range: [201, 300], filter: 'group3'},
        {title: '第四組 教育 Education', range: [301, 400], filter: 'group4'}
    ];
    
    groups.forEach(group => {
        const section = document.createElement('div');
        section.className = 'nav-section';
        
        const title = document.createElement('div');
        title.className = 'nav-section-title';
        title.textContent = group.title;
        section.appendChild(title);
        
        for (let i = group.range[0]; i <= group.range[1]; i += 10) {
            const item = document.createElement('div');
            item.className = 'nav-item';
            item.textContent = `#${i}-${Math.min(i+9, group.range[1])}`;
            item.onclick = () => {
                filterGroup(group.filter);
                const elem = document.querySelector(`[data-item="${i}"]`);
                if (elem) elem.scrollIntoView({behavior: 'smooth'});
            };
            section.appendChild(item);
        }
        
        nav.appendChild(section);
    });
}

function toggleItem(num) {
    const item = document.querySelector(`[data-item="${num}"]`);
    if (expandedItems.has(num)) {
        expandedItems.delete(num);
        item.classList.remove('expanded');
    } else {
        expandedItems.add(num);
        item.classList.add('expanded');
    }
}

function renderItems() {
    const container = document.getElementById('contentArea');
    container.innerHTML = '';
    
    for (let i = 1; i <= 400; i++) {
        const groupKey = getGroup(i);
        if (currentFilter !== 'all' && currentFilter !== groupKey) continue;
        
        const [oldZh, newZh, oldEn, newEn] = CONTRASTS[i];
        const item = document.createElement('div');
        item.className = 'item' + (expandedItems.has(i) ? ' expanded' : '');
        item.setAttribute('data-item', i);
        item.onclick = () => toggleItem(i);
        
        item.innerHTML = `
            <div class="item-header">
                <div style="display: flex; align-items: center; flex: 1;">
                    <span class="item-num">${i}</span>
                    <span class="item-old">${oldZh}</span>
                </div>
                <span class="toggle-icon">▼</span>
            </div>
            <div class="item-content">
                <div class="content-pair">
                    <div class="lang-label">中文 Chinese</div>
                    <div class="lang-col">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <div style="flex: 1;">
                                <div class="old-text">舊: ${oldZh}</div>
                                <div class="new-text">新: ${newZh}</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="content-pair">
                    <div class="lang-label">English 英文 <button class="tts-btn" data-t="${oldEn} becomes ${newEn}" onclick="speakText(this.dataset.t, event)">🔊</button></div>
                    <div class="lang-col">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <div style="flex: 1;">
                                <div class="old-text">Old: ${oldEn}</div>
                                <div class="new-text">New: ${newEn}</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        container.appendChild(item);
    }
}

function filterGroup(group) {
    currentFilter = group;
    expandedItems.clear();
    renderItems();
    
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    
    document.getElementById('contentArea').scrollIntoView({behavior: 'smooth'});
}

function speakText(text, event) {
    event.stopPropagation();
    const btn = event.target;
    
    if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        
        btn.classList.add('playing');
        utterance.onend = () => btn.classList.remove('playing');
        
        speechSynthesis.speak(utterance);
    }
}

// Search functionality
document.getElementById('searchInput').addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase();
    const items = document.querySelectorAll('[data-item]');
    
    items.forEach(item => {
        const text = item.textContent.toLowerCase();
        item.classList.toggle('hidden', !text.includes(query));
    });
});

// Init
renderNav();
renderItems();

// Show scroll hint on load
setTimeout(() => {
    document.getElementById('scrollHint').classList.add('show');
    setTimeout(() => {
        document.getElementById('scrollHint').classList.remove('show');
    }, 3000);
}, 500);

<script>
(function () {
    var CFG = window.HAS_CFG || {};
    var DATA = [], VIEW = [], cur = null, style = 0, theme = 0, size = 0, loaded = false;
    var $ = function (id) { return document.getElementById(id); };
    var STYLES = ['雙語金句排句', '故事共鳴', '新舊對比', '提問互動'];
    // 排比句庫：[中文三句, 英文三句]，依痛點文字固定輪替
    var PARALLEL = [
        [['不是你不夠努力，是方法還沒更新；', '不是你不夠聰明，是路徑還沒找到；', '不是你不夠好，是你還沒看見新的選擇。'],
         ['It is not that you lack effort; the method has not been updated.', 'It is not that you lack talent; the path has not been found.', 'It is not that you are not enough; you have not yet seen a new choice.']],
        [['換一個想法，就換一種情緒；', '換一種說法，就換一段關係；', '換一個做法，就換一種人生。'],
         ['Change one thought, and you change a feeling;', 'change one sentence, and you change a relationship;', 'change one action, and you change a life.']],
        [['痛，是提醒，不是懲罰；', '錯，是資料，不是判決；', '慢，是節奏，不是失敗。'],
         ['Pain is a reminder, not a punishment;', 'a mistake is data, not a verdict;', 'slow is a rhythm, not a failure.']],
        [['今天改一句話，', '明天改一個習慣，', '有一天，你會改寫自己的故事。'],
         ['Change one sentence today,', 'one habit tomorrow,', 'and one day you will rewrite your own story.']]
    ];
    var THEMES = [
        { n: '深藍金', bg: ['#1A2B5F', '#0D1B3E'], fg: '#FFFFFF', ac: '#E8B923', mu: 'rgba(255,255,255,.6)' },
        { n: '青綠', bg: ['#0A7A72', '#064B46'], fg: '#FFFFFF', ac: '#FFE08A', mu: 'rgba(255,255,255,.65)' },
        { n: '暖米', bg: ['#FBF3E4', '#F1DFC0'], fg: '#1A2B5F', ac: '#B07D05', mu: 'rgba(26,43,95,.55)' },
        { n: '墨黑', bg: ['#1B1B1F', '#000000'], fg: '#F5F5F5', ac: '#C9960C', mu: 'rgba(255,255,255,.55)' }
    ];
    var SIZES = [{ n: '直式 4:5', w: 1080, h: 1350 }, { n: '方形 1:1', w: 1080, h: 1080 }];
    var FONT = '"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif';

    function sign() {
        return $('hasSign').value.trim() || CFG.sign || '王欣蓉 Anne Wang';
    }

    function buildPost(it, s) {
        var skill = it.skill || '一種可以練出來的能力';
        var tips = (it.tips && it.tips.length) ? '\n\n📌 可以從這幾件小事開始：\n' + it.tips.map(function (t) { return '・' + t; }).join('\n') : '';
        var en = it.en ? '\n\n🌍 ' + it.en : '';
        var tail = '\n\n— ' + sign() + '\n#HighAgency #' + (CFG.tag || '人生智慧') + ' #心靈雞湯 #每日一句';
        if (s === 0) {
            var hash = 0;
            for (var i = 0; i < it.pain.length; i++) hash += it.pain.charCodeAt(i);
            var par = PARALLEL[hash % PARALLEL.length];
            return '✨ 今日金句｜Golden Line\n「' + it.wisdom + '」' + (it.wEn ? '\n“' + it.wEn + '”' : '') +
                '\n\n你是不是也常卡在這裡？\n「' + it.pain + '」' + (it.pEn ? '\nDo you get stuck here too?\n“' + it.pEn + '”' : '') +
                '\n\n' + par[0].join('\n') + '\n\n' + par[1].join('\n') +
                '\n\n從今天起——\n少一點「' + it.pain + '」，\n多一點「' + it.wisdom + '」。\nStarting today: a little less of the old line, a little more of the new one.' +
                '\n\n🔑 能力｜Skill：' + skill + (it.skillEn ? '｜' + it.skillEn : '') +
                '\n\n— ' + sign() + '\n#HighAgency #' + (CFG.tag || '人生智慧') + ' #心靈雞湯 #金句 #雙語 #DailyQuote';
        }
        if (s === 2) {
            return '❌ 舊版本：' + it.pain + '\n✅ 新版本：' + it.wisdom +
                '\n\n兩句話之間的距離，就是「' + skill + '」。\n\n舊版本讓人卡在原地，\n新版本讓事情可以往下走。' + tips +
                '\n\n先存起來，下次卡住的時候拿出來看。' + en + tail;
        }
        if (s === 3) {
            return '如果今天只能改變一件事，你會選哪一件？\n\n很多人卡在：\n「' + it.pain + '」\n\n換個角度，可以是：\n「' + it.wisdom + '」\n\n這不是天分，是練得出來的「' + skill + '」。' + tips +
                en + '\n\n💬 這句話你想送給誰？留言或標記他。' + tail;
        }
        return '你是不是也這樣？\n\n「' + it.pain + '」\n\n' + (CFG.lead ? CFG.lead + '\n' : '') +
            '其實，不是你不夠好，\n只是還在用舊的方式，面對同一件事。\n\n💡 換一個版本試試看：\n' + it.wisdom +
            '\n\n🔑 這在練的能力是：' + skill + tips +
            '\n\n今天只要練一次就好。\n不求完美，只求比昨天更靠近真實一點。' + en +
            '\n\n👉 你最常卡在哪裡？留言告訴我。' + tail;
    }

    function wrap(x, text, maxW) {
        var tokens = String(text).match(/[A-Za-z0-9'’.%\-]+|\s+|./gsu) || [], lines = [], line = '';
        tokens.forEach(function (t) {
            var hang = /^[，。！？、；：」』）】…]$/.test(t);
            if (!hang && line && x.measureText(line + t).width > maxW) {
                lines.push(line.replace(/\s+$/, ''));
                line = t.replace(/^\s+/, '');
            } else {
                line += t;
            }
        });
        if (line) lines.push(line);
        return lines;
    }

    // 由大到小找出能塞進 maxH 的字級
    function fit(x, text, maxW, maxH, start, min, weight) {
        for (var s = start; s >= min; s -= 4) {
            x.font = weight + ' ' + s + 'px ' + FONT;
            var lines = wrap(x, text, maxW);
            if (lines.length * s * 1.45 <= maxH || s - 4 < min) return { size: s, lines: lines };
        }
    }

    function pill(x, px, py, w, h) {
        var r = h / 2;
        x.beginPath();
        x.moveTo(px + r, py);
        x.arcTo(px + w, py, px + w, py + h, r);
        x.arcTo(px + w, py + h, px, py + h, r);
        x.arcTo(px, py + h, px, py, r);
        x.arcTo(px, py, px + w, py, r);
        x.closePath();
        x.fill();
    }

    function draw() {
        var c = $('hasCanvas'), S = SIZES[size], T = THEMES[theme], x = c.getContext('2d');
        c.width = S.w; c.height = S.h;
        var g = x.createLinearGradient(0, 0, S.w, S.h);
        g.addColorStop(0, T.bg[0]); g.addColorStop(1, T.bg[1]);
        x.fillStyle = g; x.fillRect(0, 0, S.w, S.h);
        x.globalAlpha = .08; x.fillStyle = T.ac;
        x.beginPath(); x.arc(S.w - 120, 140, 260, 0, 7); x.fill();
        x.beginPath(); x.arc(90, S.h - 90, 180, 0, 7); x.fill();
        x.globalAlpha = 1;
        x.strokeStyle = T.ac; x.lineWidth = 4; x.strokeRect(40, 40, S.w - 80, S.h - 80);
        if (!cur) return;

        var pad = 110, W = S.w - pad * 2, y = 130, footY = S.h - 150;
        x.textBaseline = 'top'; x.textAlign = 'left';
        if (cur.skill) {
            x.font = 'bold 34px ' + FONT;
            var label = wrap(x, cur.skill, W - 56)[0];
            x.fillStyle = T.ac; pill(x, pad, y, x.measureText(label).width + 56, 64);
            x.fillStyle = T.bg[0]; x.fillText(label, pad + 28, y + 13);
        }
        y += 120;

        x.fillStyle = T.mu;
        var p = fit(x, '「' + cur.pain + '」', W, S.h * 0.2, 50, 30, 'normal');
        p.lines.forEach(function (l) { x.fillText(l, pad, y); y += p.size * 1.45; });

        y += 30; x.fillStyle = T.ac; x.fillRect(pad, y, 90, 6); y += 50;

        var enLines = [], enSize = 34;
        if (cur.wEn) { x.font = 'italic ' + enSize + 'px ' + FONT; enLines = wrap(x, cur.wEn, W).slice(0, 4); }
        var enH = enLines.length ? enLines.length * enSize * 1.4 + 24 : 0;
        var w = fit(x, cur.wisdom, W, footY - y - 30 - enH, 84, 36, 'bold');
        x.fillStyle = T.fg;
        w.lines.forEach(function (l) { x.fillText(l, pad, y); y += w.size * 1.45; });
        if (enLines.length) {
            y += 24; x.font = 'italic ' + enSize + 'px ' + FONT; x.fillStyle = T.ac;
            enLines.forEach(function (l) { x.fillText(l, pad, y); y += enSize * 1.4; });
        }

        x.font = '30px ' + FONT; x.fillStyle = T.mu; x.fillText(sign(), pad, footY + 20);
        x.textAlign = 'right'; x.fillStyle = T.ac; x.font = 'bold 30px ' + FONT;
        x.fillText('High Agency', S.w - pad, footY + 20);
    }

    function chips(boxId, names, get, set) {
        var box = $(boxId);
        box.innerHTML = '';
        names.forEach(function (n, i) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'has-chip' + (i === get() ? ' on' : '');
            b.textContent = n;
            b.onclick = function () { set(i); chips(boxId, names, get, set); };
            box.appendChild(b);
        });
    }

    function select(it) {
        cur = it;
        $('hasEmpty').style.display = 'none';
        $('hasMain').style.display = 'block';
        $('hasPain').textContent = '「' + it.pain + '」';
        $('hasNote').textContent = [it.cat, it.note].filter(Boolean).join('｜');
        $('hasWis').textContent = it.wisdom;
        $('hasEn').textContent = it.wEn || it.en || '';
        $('hasSkill').textContent = '🎯 ' + (it.skill || '能力');
        $('hasPost').value = buildPost(it, style);
        draw();
        renderList();
    }

    function renderList() {
        var q = $('hasQ').value.trim().toLowerCase(), cat = $('hasCat').value, box = $('hasList');
        VIEW = DATA.filter(function (it) {
            if (cat && it.cat !== cat) return false;
            return !q || [it.pain, it.wisdom, it.skill, it.cat, it.en, it.pEn, it.wEn].join(' ').toLowerCase().indexOf(q) > -1;
        });
        $('hasCount').textContent = '共 ' + VIEW.length + ' 則（全部 ' + DATA.length + ' 則）';
        box.innerHTML = '';
        VIEW.forEach(function (it) {
            var b = document.createElement('button'), t = document.createElement('b'), s = document.createElement('span'), k = document.createElement('i');
            b.type = 'button';
            b.className = 'has-row' + (it === cur ? ' on' : '');
            t.textContent = it.pain; s.textContent = '→ ' + it.wisdom; k.textContent = [it.cat, it.skill].filter(Boolean).join('・');
            b.appendChild(t); b.appendChild(s); b.appendChild(k);
            b.onclick = function () { select(it); };
            box.appendChild(b);
        });
    }

    function load() {
        if (loaded) return;
        loaded = true;
        try { DATA = (CFG.load ? CFG.load() : []) || []; } catch (e) { DATA = []; console.error(e); }
        var cats = [], sel = $('hasCat');
        DATA.forEach(function (it) { if (it.cat && cats.indexOf(it.cat) < 0) cats.push(it.cat); });
        sel.innerHTML = '';
        [''].concat(cats).forEach(function (c) {
            var o = document.createElement('option');
            o.value = c; o.textContent = c || '全部分類';
            sel.appendChild(o);
        });
        try { $('hasSign').value = localStorage.getItem('has_sign') || ''; } catch (e) {}
        chips('hasStyles', STYLES, function () { return style; }, function (i) { style = i; if (cur) $('hasPost').value = buildPost(cur, style); });
        chips('hasThemes', THEMES.map(function (t) { return t.n; }), function () { return theme; }, function (i) { theme = i; draw(); });
        chips('hasSizes', SIZES.map(function (s) { return s.n; }), function () { return size; }, function (i) { size = i; draw(); });
        renderList();
        draw();
    }

    function toggle(on) {
        $('hasWrap').classList.toggle('on', on);
        document.body.style.overflow = on ? 'hidden' : '';
        if (on) { load(); $('hasQ').focus(); }
    }

    $('hasFab').onclick = function () { toggle(true); };
    $('hasClose').onclick = function () { toggle(false); };
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') toggle(false); });
    $('hasQ').oninput = renderList;
    $('hasCat').onchange = renderList;
    $('hasRand').onclick = function () {
        var pool = VIEW.length ? VIEW : DATA;
        if (pool.length) select(pool[Math.floor(Math.random() * pool.length)]);
    };
    $('hasSign').oninput = function () {
        try { localStorage.setItem('has_sign', $('hasSign').value); } catch (e) {}
        if (cur) $('hasPost').value = buildPost(cur, style);
        draw();
    };
    $('hasCopy').onclick = function () {
        var ta = $('hasPost'), btn = $('hasCopy');
        var done = function () { btn.textContent = '✅ 已複製'; setTimeout(function () { btn.textContent = '📋 複製貼文'; }, 1500); };
        var fallback = function () { ta.select(); document.execCommand('copy'); done(); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, fallback);
        else fallback();
    };
    $('hasDl').onclick = function () {
        if (!cur) return;
        $('hasCanvas').toBlob(function (blob) {
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = '心靈雞湯_' + (cur.skill || '圖文').replace(/[\\/:*?"<>|\s#]/g, '') + '_' + Date.now() + '.png';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
        });
    };
})();
</script>

</body>
</html>
