<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>靈魂 × 母體｜200句新舊語言</title>
<style>
:root{
  --bg:#fbf6ee; --card:#fffdf9; --ink:#3b322b; --soft:#7a6c60; --line:#eadfce;
  --main:#c2684a; --main-d:#a5553a; --sage:#6f8f72; --gold:#c9972e; --old:#9a8f85; --tint:#f6ebdc;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;line-height:1.75;font-size:16px}
header{position:sticky;top:0;z-index:20;background:rgba(251,246,238,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 0 8px}
.brand{font-weight:800;font-size:18px;color:var(--main-d);white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--soft);margin-top:-4px}
#q{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:16px;color:var(--ink);outline:none}
#q:focus{border-color:var(--main)}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px}
nav button{flex:none;border:1px solid var(--line);background:#fff;color:var(--soft);padding:7px 14px;border-radius:999px;font-size:15px;cursor:pointer;font-family:inherit}
nav button.on{background:var(--main);border-color:var(--main);color:#fff;font-weight:700}
main{padding:20px 0 80px}
h1{font-size:26px;line-height:1.4;margin:6px 0 8px}
h2{font-size:20px;margin:28px 0 10px;color:var(--main-d)}
h3{font-size:17px;margin:0 0 6px}
p{margin:0 0 10px}
.soup{background:var(--tint);border-left:4px solid var(--gold);border-radius:10px;padding:14px 16px;margin:10px 0 16px;color:#5a4a3c}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px;box-shadow:0 1px 3px rgba(120,90,60,.06)}
.lab{display:inline-block;font-size:12px;font-weight:700;color:var(--soft);letter-spacing:.05em;margin-right:6px}
.orig{color:var(--soft);font-size:14px;border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.btn{border:1px solid var(--main);background:#fff;color:var(--main-d);padding:6px 12px;border-radius:999px;font-size:14px;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--main);color:#fff}
.btn.fill{background:var(--main);color:#fff}
.btn.fill:hover{background:var(--main-d)}
.btn.gray{border-color:var(--line);color:var(--soft)}
.btn.gray:hover{background:var(--tint);color:var(--ink)}
.badge{display:inline-block;background:var(--sage);color:#fff;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700}
.no{font-weight:800;color:var(--gold);font-size:14px;margin-right:8px}
.old{color:var(--old);text-decoration:line-through;text-decoration-color:#d8cbbb}
.new{font-weight:700;font-size:17px;color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:#fff;color:var(--soft);padding:4px 12px;border-radius:999px;font-size:14px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--sage);border-color:var(--sage);color:#fff;font-weight:700}
.chain{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:15px;color:#5a4a3c;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{cursor:pointer}
.tile:hover{border-color:var(--main)}
.tile b{display:block;font-size:17px;color:var(--main-d)}
.hero{background:linear-gradient(135deg,#f3dcc6,#f8ecd9);border-radius:18px;padding:24px 20px;margin-bottom:16px}
.hero p{color:#5a4a3c}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}
.stat div{font-size:14px;color:var(--soft)}
.stat b{font-size:24px;color:var(--main-d);display:block;line-height:1.2}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--soft);font-size:13px}
.tw{overflow-x:auto}
.warn{background:#fdf0ea;border:1px solid #efc7b6;border-radius:12px;padding:12px 16px;color:#7c3f28;margin:12px 0}
.count{color:var(--soft);font-size:14px}
.gh{margin:22px 0 4px;font-weight:800;color:var(--main-d);font-size:17px}
.gp{color:var(--soft);font-size:15px;margin-bottom:10px}
#mask{position:fixed;inset:0;background:rgba(50,38,28,.5);display:none;z-index:50;align-items:flex-end;justify-content:center}
#mask.show{display:flex}
#modal{background:var(--card);width:100%;max-width:760px;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
@media(min-width:800px){#mask{align-items:center}#modal{border-radius:18px}}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.mh b{flex:1;font-size:17px}
#pbody{overflow:auto;flex:1}
#pimgs{display:flex;gap:10px;overflow-x:auto;padding:14px 18px 4px}
#pimgs a{flex:none;display:block;text-align:center;font-size:12px;color:var(--soft);text-decoration:none}
#pimgs img{display:block;width:150px;height:auto;border-radius:8px;border:1px solid var(--line);margin-bottom:4px}
#ptext{padding:12px 18px 16px;white-space:pre-wrap;word-break:break-word;font-size:16px;line-height:1.85}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mf .count{flex:1;min-width:160px}
footer{color:var(--soft);font-size:13px;text-align:center;padding:20px 16px 40px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">靈魂 × 母體<small>LifeOS｜200句新舊語言</small></div>
      <input id="q" type="search" placeholder="🔍 搜尋：編號、舊話、新話、理論、能力…（例：已讀不回、界線、037）" autocomplete="off">
    </div>
    <nav id="nav"></nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer>本工具依《LifeOS｜靈魂 × 母體 × 七大理論 × 200句新舊語言》整合本製作。內容為生活與自我成長參考，不能取代醫療、心理或法律等專業協助。</footer>

<div id="mask">
  <div id="modal" role="dialog" aria-modal="true">
    <div class="mh"><b id="ptitle">臉書貼文</b><button class="btn gray" id="pclose">關閉</button></div>
    <div id="pbody">
      <div id="pimgs"></div>
      <div id="ptext"></div>
    </div>
    <div class="mf">
      <span class="count" id="pcount"></span>
      <button class="btn gray" id="pshuf">換一種寫法</button>
      <button class="btn" id="pdl">下載全部圖片</button>
      <button class="btn fill" id="pcopy">複製貼文</button>
    </div>
  </div>
</div>

<script>
/* ============ 七大能力（每個能力一套雞湯素材） ============ */
const AB = {
"語":{name:"精確表徵",theory:"維根斯坦｜語言哲學",q:"這是事實，還是我的說法？",upd:"把「貼標籤」更新成「說事實」",wis:"把事實和猜測分開",
 bd:"這是哲學的看法，幫我們整理語言，並不是大腦的因果定律。",
 para:"「精確表徵」聽起來很學術，白話講就是：把看到的，和猜到的，分開放。哲學家維根斯坦提醒我們，語言就像一副眼鏡，你用什麼詞形容世界，世界就長成什麼樣子。當你說「他不在乎我」，心裡立刻下起雨；當你說「他還沒回訊息」，天空其實只是多雲。事情沒有變，變的是你給它貼的那張標籤。很多時候，傷我們最深的不是發生了什麼，而是我們替它寫下的那句旁白。所以，在難過之前，先問自己一句：這是事實，還是我的說法？",
 pai:"少一個標籤，就多一分看見；\n少一句斷言，就多一點空間；\n少一次腦補，就多一份平靜。\n把「你總是」換成「這一次」，把「我就是」換成「我現在」，把「一定是」換成「有可能」。",
 steps:"① 先寫下一句攝影機拍得到的事實。\n② 再寫下腦中自動冒出的那句解讀。\n③ 在兩句中間畫一條線，問自己：線的右邊，有多少是我自己加上去的？",
 quotes:["話說得準，心就不亂。","事實很輕，是猜測讓它變重。","換一個詞，就是換一種活法。"],
 en:{name:"Precise Description",upd:"from labeling to stating facts",wis:"Separate facts from guesses.",
  para:"Precise description simply means: keep what you saw and what you guessed in two separate boxes. Wittgenstein reminds us that language works like a pair of glasses — the words you choose shape the world you see. Say 'he doesn't care' and it rains inside; say 'he hasn't replied yet' and the sky is only cloudy. The event is the same. The label is what changed.",
  lines:"Fewer labels, more seeing. Fewer verdicts, more room. Fewer guesses, more peace.\n✨ Say it accurately, and the heart settles.\n✨ Facts are light; guesses make them heavy."}},
"境":{name:"情境理解",theory:"海德格｜處境理解",q:"我忽略了什麼生活處境？",upd:"把「只看行為」更新成「看見處境」",wis:"理解處境，也保留界線",
 bd:"這是存在哲學的生活化說法，是一種看事情的角度，不是標準答案。",
 para:"「情境理解」白話講就是：每個人都不是活在真空裡。哲學家海德格說，人永遠是「在處境中」的人——有牽掛、有限制、有今天剛發生的事。那個沉默的家人，可能不是冷淡，而是累了一整天；那個發脾氣的孩子，可能不是叛逆，而是心裡有說不出的害怕；那個做不到的自己，可能不是懶，而是已經撐了太久。當我們只看行為，就容易生氣；當我們看見處境，心就會變軟。理解處境，不是替誰找藉口，而是先看清全貌，再決定怎麼回應。",
 pai:"看見疲憊，就少一點指責；\n看見壓力，就多一點耐心；\n看見需求，就找到一條出路。\n理解不等於同意，體諒不等於退讓，溫柔不等於沒有界線。",
 steps:"① 先停三秒，問：他（或我）今天經歷了什麼？\n② 再問：這件事對他（或我）為什麼重要？\n③ 最後才決定：我要怎麼回應，同時守住自己的界線。",
 quotes:["先懂處境，再談對錯。","每個反應的背後，都有一段沒說出口的故事。","體諒別人，也別忘了體諒自己。"],
 en:{name:"Understanding Context",upd:"from judging behavior to seeing the situation",wis:"Understand the situation, and keep your boundaries.",
  para:"Understanding context means: nobody lives in a vacuum. Heidegger said we are always 'in a situation' — with cares, limits, and whatever happened today. The silent family member may be exhausted, not cold. The you who couldn't do it may be worn out, not lazy. Seeing the situation isn't making excuses. It is seeing the whole picture before choosing how to respond.",
  lines:"See the tiredness, and blame softens. See the pressure, and patience grows. See the need, and a way opens.\n✨ Understand the situation first, then talk about right and wrong.\n✨ Be kind to others, and to yourself too."}},
"預":{name:"預測校準",theory:"預測處理｜認知科學",q:"期待與結果，差在哪裡？",upd:"把「我以為」更新成「我來確認」",wis:"期待不是現實的保證",
 bd:"情緒不只來自期待落差，身體、關係與環境也都有影響。",
 para:"「預測校準」白話講就是：大腦是一台很愛預測的機器。它會拿過去的經驗，偷偷替未來寫好劇本——他應該記得、這次應該成功、事情應該照我想的走。當現實沒照劇本演，我們就失望、生氣、受傷。可是請記得：期待不是合約，劇本不是事實。落差出現的時候，不是世界在跟你作對，而是在提醒你：預測該更新了。成熟不是不再期待，而是願意拿新的證據，溫柔地修改舊的想像。會校準的人，不會被同一顆石頭絆倒太多次。",
 pai:"期待落空，不必急著定罪；\n結果不如預期，不必急著否定自己；\n直覺很強烈，不必急著當成答案。\n先看證據，再下結論；先比較差距，再調整下一步。",
 steps:"① 寫下：我原本以為會怎樣？\n② 寫下：實際發生了什麼？\n③ 問：中間的差距，是資訊不夠、期待太高，還是條件變了？然後只改一個地方，再試一次。",
 quotes:["期待不是現實的保證。","落差不是打擊，是導航在重新規劃路線。","敢修正的人，才走得遠。"],
 en:{name:"Calibrating Expectations",upd:"from 'I assumed' to 'let me check'",wis:"Expectation is no guarantee of reality.",
  para:"Calibrating expectations means: your brain is a prediction machine. It quietly writes a script for the future — he should remember, this should work. When reality goes off-script, we feel hurt. But an expectation is not a contract. A gap is not the world against you; it is a reminder that the prediction needs updating. Maturity isn't expecting nothing. It is gently revising old pictures with new evidence.",
  lines:"A missed expectation is not a verdict. A poor result is not your worth. A strong hunch is not the answer.\n✨ A gap is just the GPS recalculating the route.\n✨ Those who dare to revise go far."}},
"探":{name:"主動探索",theory:"主動推論｜認知模型",q:"我可以怎麼取得新資訊？",upd:"把「反覆猜測」更新成「小步驗證」",wis:"適當的行動，可以帶來新的資訊",
 bd:"不是所有情況都該追問；請尊重對方的節奏，也顧好自己的安全。",
 para:"「主動探索」白話講就是：與其在腦袋裡猜一百次，不如在現實裡問一次。我們常常把自己關在想像的房間裡，反覆推敲、越想越怕，卻忘了門其實沒有鎖。認知科學裡的「主動推論」告訴我們：不確定的時候，一個小小的行動，就能換來新的資訊。傳一句關心、試一個小實驗、跨出最小的一步——答案往往不在想裡，而在做裡。你不必一次走完整條路，只要先點亮眼前的一盞燈。當然，探索也要看時機，有些時候，先給彼此一點空間，也是一種行動。",
 pai:"想不通，就去問；\n看不清，就去試；\n走不動，就先跨一小步。\n小問題換來大安心，小實驗換來大方向，小行動換來大改變。",
 steps:"① 寫下你最想知道的一件事。\n② 設計一個成本最小、風險最低的行動（問一句、試一天、做五分鐘）。\n③ 做完之後，記下你多知道了什麼，再決定下一步。",
 quotes:["猜一百次，不如問一次。","路不是想出來的，是走出來的。","最小的一步，也是往前。"],
 en:{name:"Active Exploration",upd:"from endless guessing to small tests",wis:"A fitting action brings new information.",
  para:"Active exploration means: instead of guessing a hundred times in your head, ask once in real life. We lock ourselves in a room of imagination and forget the door was never locked. When things are uncertain, one small action — a caring message, a tiny experiment, the smallest step — brings new information. You don't have to walk the whole road. Just light the next lamp. And sometimes, giving space is the action.",
  lines:"Can't figure it out? Ask. Can't see clearly? Try. Can't move? Take one small step.\n✨ The road isn't thought into being; it is walked.\n✨ The smallest step is still forward."}},
"系":{name:"系統診斷",theory:"複雜系統｜回饋迴路",q:"哪個循環一直在重複？",upd:"把「找戰犯」更新成「找卡點」",wis:"改變循環，比重複責怪更有力量",
 bd:"遇到暴力、威脅或控制，責任並不對等，請先保護自己。",
 para:"「系統診斷」白話講就是：問題常常不在某一個人身上，而在一直重複的那個圈圈裡。你越追問，他越沉默；他越沉默，你越焦慮；你越焦慮，就追問得更急。沒有誰是壞人，只是兩個人一起被困在同一個迴圈。複雜系統的觀點提醒我們：一件事的結果，是很多環節互相影響出來的——時間、資源、習慣、環境、彼此的反應。與其問「是誰的錯」，不如問「是哪一環卡住了」。找到那一環，輕輕轉動它，整個循環就有機會不一樣。",
 pai:"不怪人，先看流程；\n不貼標籤，先找卡點；\n不比誰對，先換一種互動。\n改一個環節，勝過罵十次；調一個習慣，勝過下十次決心。",
 steps:"① 把事情畫成一條線：誰做了什麼 → 對方怎麼回 → 接著發生什麼。\n② 圈出重複最多次的那一段。\n③ 只挑一個你做得到的小環節，換個做法試一週。",
 quotes:["改變循環，比重複責怪更有力量。","不是你不好，是方法該換了。","找到卡住的那一環，路就通了。"],
 en:{name:"System Diagnosis",upd:"from finding who's to blame to finding where it's stuck",wis:"Changing the loop is stronger than repeating the blame.",
  para:"System diagnosis means: the problem is often not in one person, but in the loop that keeps repeating. The more you press, the quieter they get; the quieter they get, the more anxious you feel. Nobody is the villain — two people are stuck in one circle. So instead of asking 'whose fault is it?', ask 'which link is jammed?' Turn that one link gently, and the whole loop can change.",
  lines:"Don't blame the person; look at the process. Don't label; find the sticking point. Don't fight over who's right; change the dance.\n✨ You're not bad. The method just needs changing.\n✨ Find the jammed link, and the road opens."}},
"練":{name:"技能練習",theory:"神經可塑性｜學習",q:"哪個新反應需要練習？",upd:"把「我就是這樣」更新成「我正在練習」",wis:"習慣不是命運",
 bd:"覺得自己進步了很珍貴，但那不等於已經直接量到大腦的改變。",
 para:"「技能練習」白話講就是：你不是改不了，你只是還沒練夠。大腦像一片草地，常走的路會越踩越明顯；舊反應之所以那麼快，是因為它被重複了幾千次。神經可塑性帶來的好消息是：新的路，也可以一步一步踩出來。第一次很彆扭，第十次比較順，第一百次就成了自然。所以別再說「我就是這樣的人」，你只是「目前習慣這樣反應」。把大目標切成小練習，把小練習放進每一天，時間會替你完成剩下的事。",
 pai:"今天練一句，明天順一點；\n這週改一題，下週穩一點；\n這個月多一次停頓，這一年就多一種選擇。\n不求一步到位，只求每天到位。",
 steps:"① 選定一個你最想換掉的舊反應。\n② 寫好一句替代的新說法，貼在看得到的地方。\n③ 每天至少用一次，晚上花一分鐘記錄：今天我練了嗎？感覺如何？",
 quotes:["習慣不是命運。","慢慢來，比較快。","你重複什麼，就會成為什麼。"],
 en:{name:"Skill Practice",upd:"from 'that's just who I am' to 'I'm practicing'",wis:"Habit is not destiny.",
  para:"Skill practice means: it's not that you can't change — you just haven't practiced enough yet. The brain is like a meadow; the path you walk most becomes the clearest. Your old reaction is fast because it was repeated thousands of times. The good news: a new path can be walked in, step by step. Awkward the first time, smoother the tenth, natural the hundredth.",
  lines:"Practice one sentence today, smoother tomorrow. Fix one item this week, steadier next week.\n✨ Slow is fast.\n✨ You become what you repeat."}},

 bd:"心理彈性不是壓抑情緒，更不是忍受傷害。",
 para:"「心理彈性」白話講就是：情緒可以上車，但方向盤在你手上。生氣、難過、害怕，都不是壞東西，它們只是訊號，不是命令。接納與承諾療法（ACT）教我們：不必趕走情緒，也不必被情緒帶走；先覺察它、替它留個位子，再問自己——我真正重視的是什麼？然後朝那個方向，跨出一小步。有彈性的人，不是沒有風浪，而是風浪來的時候，依然記得自己要去哪裡。你可以帶著不安前進，也可以含著眼淚，做對的事。",

 steps:"① 說出情緒的名字：「我現在很＿＿」。\n② 深呼吸三次，對自己說：「這是感受，不是命令。」\n③ 問：依照我重視的價值，現在最小的一步是什麼？然後去做。",
 quotes:["有情緒，仍有選擇。","界線不是牆，是讓愛走得更久的門。","溫柔而堅定，是最美的力量。"],
 en:{name:"Values-Guided Action",upd:"from being pushed by emotion to choosing with emotion on board",wis:"With emotions, you still have a choice.",
  para:"Psychological flexibility means: emotions can ride in the car, but the steering wheel stays in your hands. Anger, sadness, and fear are signals, not commands. You don't have to chase them away or be carried off by them. Notice them, make room, then ask: what do I truly value? And take one small step that way. You can move forward while still feeling uneasy.",
  lines:"You can be angry without hurting. You can be sad without quitting. You can be afraid without stopping.\n✨ A boundary is not a wall; it's a door that lets love last longer.\n✨ Gentle and firm — the most beautiful strength."}}

11:{n:"認識自己",zh:"我們總以為最了解自己的人就是自己，可是，心也會替自己編故事。腦中那個很肯定的聲音，有時只是習慣，不是真相。願意對自己說「我可能還沒看清楚」，不是沒自信，而是一種很深的誠實。",en:"We think we know ourselves best, yet the mind writes stories too. Saying 'I may not see it clearly yet' is not weakness; it's deep honesty."},

c1:{zh:"「靈魂」和「母體」聽起來很玄，在這裡其實很生活：靈魂，是那個會感受、會在乎、會想變更好的你；母體，是你身邊的人、環境、資訊和限制。兩個都只是幫我們整理人生的工具，不是已經被科學證實的神祕力場。",en:"Here, 'soul' is the you who feels, cares, and wants to grow; 'matrix' is the people, environment, and limits around you. Both are thinking tools, not proven mystical fields."},
c2:{zh:"七個生活的提醒，就像七副看世界的眼鏡。每一副都很好用，卻也都有看不到的地方，所以每一個提醒的後面，都老實地寫上了它的限制。會用工具的人很厲害，知道工具有限的人，更有智慧。",en:"Seven reminders are like seven pairs of glasses. Each is useful, and each has blind spots — so every one comes with an honest limit."},

CORE[2].pp="「靈魂」和「母體」這兩個詞，只是幫我們整理生活的小工具，就像地圖不是土地本身。它們不代表真的有人證實了什麼神祕的力量。把話老實說清楚，路才走得安心。";
CORE[3].pt="人生是一圈一圈變好的";
CORE[4].pt="感受是真的，故事要查證";
CORE[5].pt="再有名的說法，也只是一種看法";
CORE[5].pp="一百多年前，有兩位很有名的心理學家，原本情同父子，後來卻因為看法不同而分道揚鑣。一位相信，人的煩惱藏在心裡看不見的角落；一位相信，人一生都在學著成為完整的自己。他們的故事很精彩，卻也提醒我們：再有名的人說的話，也只是一種看法，不是誰已經證明的定論。";
CORE[6].pt="相信感受，也相信證據";
CORE[6].pp="研究人心的學問沒有過時，它一直在往前走，而且越來越講求「拿得出證據」。這給我們一個很好的示範：相信自己的感受，也願意看看事實怎麼說，兩個都要。";
CAUSE[3].pt="把零散的自己，一片一片拼回來";
CAUSE[3].pp="有三個認識自己的小方法。第一，把故事裡的角色當成鏡子，問問自己：我像誰？我想成為誰？第二，溫柔地看看自己不太想承認的那一面——愛計較的、會嫉妒的、很害怕的自己，他們也是你。第三，把這些零零散散的自己，一片一片拼回來。人不是變完美才完整，而是願意接納全部的自己，才完整。";
CAUSE[4].pt="考差了，不是罵自己笨";
CAUSE[5].pt="七級階梯，通往自由選擇";
FORM[3].pt="事情不順時，先別急著怪誰";
FORM[3].pp="事情不順的時候，不必急著怪自己，也不必急著怪別人。先問問：是不是看漏了什麼？是不是話說得不夠準？是不是時間點不對、做法不合適，或者目標本身該調整了？一項一項看，就能找到真正該修的地方。";
FORM[4].pt="三個少一點，三個多一點";

poem:["茶涼了，又添了一次。","話說了，又多說了一些。","原來愛一直都在，","只是它需要一條路，","才走得到對方心裡。"]},

{key:"cause",ch:"第三章",type:"經典轉譯",theme:"原因與判決",pain:"把一切怪到童年和命",
title:"都是童年害的嗎？一百年前的「影子」，給了另一種答案",
prop:"原因，是為了讓人走出去，不是為了讓人住下來。",
open:`雅婷三十五歲，每次男朋友晚回訊息，她就慌得手心冒汗。她讀了很多文章，終於得出結論：「因為我小時候爸媽常吵架，所以我沒有安全感。」說完，她鬆了一口氣——終於找到兇手了。可是下一秒，她更絕望了：童年已經過去，兇手抓不到，案子也翻不了。

志明開店失敗了兩次。朋友安慰他：「可能你心裡其實害怕成功吧。」這句話像一句安慰，又像一道符咒。從此，他再也不敢試第三次。`,
ask:`找到原因，本來應該讓人更自由，為什麼反而讓人更走不動？
是原因找錯了嗎？還是，我們找到的根本不是原因，而是一張判決書？
如果人生的原因不只一個，那我們是不是太早，就替自己的人生結了案？`,
secs:[
{h:"一、老觀念：每個人心裡都有一個「影子」",t:"一百多年前，心理學家榮格說：每個人心裡，都住著一個不願被看見的自己——會嫉妒的、愛計較的、很害怕的那一面。他叫它「影子」。他的意思不是「你有影子，所以你不好」，而是：你越假裝它不存在，它越會在你不注意的時候，替你說話。",q:"看見影子，不是放縱它，是終於能和它說話。"},
{h:"二、今天的處境：我們太愛一個答案",t:"單一的答案，像一顆止痛藥：吞下去很快，藥效過了更痛。雅婷的慌，可能來自小時候，也可能來自最近每天只睡五小時，來自工作壓力，來自男朋友真的常常說話不算話。少看一個原因，就少一個能改變的地方。",q:"人生不是一條線，是一張網。"},
{h:"三、翻轉：原因是地圖，不是判決書",t:"同一盞燈，可以照亮路，也可以照得人睜不開眼。「影子」本來是一盞燈，幫你看見自己；拿它來宣判「我就是這樣」，燈就變成了鎖。志明需要的，不是一句「你怕成功」，而是一張檢查表：目標清楚嗎？錢夠嗎？手藝到位嗎？時機對嗎？",q:"判決讓人停下，地圖讓人出發。"},
{h:"四、從找原因，到拼回完整的自己",t:"榮格還說，人一輩子都在學著成為完整的自己。完整，不是沒有裂縫，而是把驕傲的、羞愧的、勇敢的、膽小的自己，都放進同一個人生。難道要先變完美，才配被愛嗎？",q:"不完美的你，也是完整的你。"}],
practice:"找一件你一直怪罪給過去的事，在紙上寫：「除了過去，還有哪些可能？」至少寫五個：身體、睡眠、現在的關係、環境、心裡的期待。然後圈出一個今天就能動一動的。",
close:"雅婷寫下那五個可能，發現自己已經很久沒有好好睡覺。她先試著早一小時上床。一個月後，男朋友晚回訊息，她還是會慌，只是慌得沒那麼久了。",
poem:["童年是一條回不去的河，","可是今天，是一座還能走的橋。","你不必改寫上游，","只要在此刻，","選一個新的方向，","讓水慢慢流向海。"]},

{key:"s4",ch:"第四章",type:"生活覺醒",theme:"對自己說的話",pain:"自我否定、怕不完美",
title:"「我就是失敗者」——你對自己說的話，比任何人都狠",
prop:"人不是被失敗打倒的，是被自己對失敗的說法打倒的。",
open:`早上七點，佩珊站在鏡子前。報告被主管退回了，理由只有一行字。她對鏡子裡的人說：「妳就是這麼沒用。」鏡子裡的人沒有回嘴，只是眼眶紅了。昨天晚上，她還在安慰失戀的同事：「這不是妳的錯，妳已經很好了。」對別人，她是最溫柔的人；對自己，她是最嚴厲的法官。

小宇段考考了五十八分，把考卷塞進書包最底層。媽媽還沒開口，他已經替自己判了刑：「我很笨，我天生就不是讀書的料。」

五十五歲的阿珍，電腦班的報名表填了一半又放下：「這麼老了，來不及了啦。」她笑著說，笑得有點苦。`,
ask:`這三個人，有誰被別人罵了嗎？沒有。最狠的那句話，是他們自己說的。
為什麼我們能原諒全世界，卻不能原諒自己？
是因為我們相信，罵自己會讓自己變好嗎？
如果罵了這麼多年，人並沒有變得更好——那錯的，會不會不是我們，而是罵的方法？`,
secs:[
{h:"一、一次的結果，不是你的名字",t:"「我失敗了」和「我是失敗者」，只差一個字，卻隔著兩個世界。前一句說的是一件事，後一句判的是一個人；事情可以修，人一旦被判了刑，連修的力氣都沒了。佩珊被退回的，是一份報告，不是她這個人。",q:"失敗是一件事，不是你的名字。"},
{h:"二、翻轉：罵自己，其實是一種逃避",t:"聽起來很奇怪，卻是真的。說「我就是笨」，比坐下來看錯在哪裡，輕鬆多了；一句總結，就可以不必面對那些細節。小宇如果把考卷攤開，一題一題看，也許會發現：他不是笨，是單字背不熟、閱讀題看太慢。",q:"把「我不行」拆成「哪一步不行」，山就變成了石頭。"},
{h:"三、完美，是最溫柔的牢籠",t:"完美看起來像目標，其實像一扇只有入口的門：走進去的人，再也走不出來。剛學寫字的孩子，第一個字總是歪歪扭扭，可是有誰因為那個歪掉的字，就說他不會寫字？我們對孩子那麼寬容，為什麼對自己就不行？",q:"不完美的開始，勝過完美的等待。"},
{h:"四、只要還在路上，就不算晚",t:"「來不及」，到底是跟誰比？跟二十歲的人比，當然晚；跟昨天的自己比，今天開始，就是早。社區電腦班裡，有一位七十二歲的阿伯，每次都坐第一排，筆記抄得比誰都認真。",q:"人生沒有截止日，只有下一步。"}],
practice:"找出一句你最常對自己說的狠話，把它翻成一個問句：「我就是失敗者」→「這次沒成功，我要調整哪一步？」「我什麼都不會」→「我目前最需要補強哪一項？」寫在便利貼上，貼在鏡子旁邊。",
close:"隔天早上，佩珊又站在鏡子前。黑眼圈還在，報告也還沒改完。她看了看便利貼，小聲地說：「這次沒過，我要改哪一段？」說完，她發現自己沒有那麼想哭了。",
poem:["鏡子裡的人沒有變，","變的是對她說話的那個聲音。","從法官，變成朋友；","從判決，變成提問。","原來溫柔不只能給別人，","也能，留一點給自己。"]},

{key:"s5",ch:"第五章",type:"數字清單",theme:"對家人與孩子說的話",pain:"好意變成傷害",
title:"五句以愛為名的話，正在把你愛的人推遠",
prop:"傷人最深的話，往往不是出於恨，而是出於急著去愛。",
open:`女兒哭著說被同學排擠。媽媽一邊切菜一邊說：「妳就是太敏感了，不要想那麼多。」刀聲沒有停，女兒的話停了。她回到房間，輕輕關上門。媽媽以為事情結束了，其實，是一扇門關上了。

兒子數學考了四十分，爸爸把考卷拍在桌上：「你怎麼這麼笨？別人都會，你為什麼不會？」爸爸心裡想的是「我好擔心你」，嘴裡說出來的，卻是「你讓我丟臉」。

朋友失戀，在電話裡哭了半小時。你說：「好了啦，想開一點。」電話那頭安靜了，然後說：「嗯，我知道了。」`,
ask:`這些話的出發點，都是愛。那為什麼，聽的人反而離我們更遠？
是對方太脆弱嗎？還是我們說話的時候，其實更急著讓自己安心？
如果安慰的目的，是讓對方好過一點——那我們有沒有先問過，他需要的是什麼？
其實，很多傷人的話都不是故意的，只是太快了：快到心還沒到，話就先到了。`,
secs:[
{h:"一、「你太敏感」",t:"舊習慣：用一句話，把對方的感受打發掉。\n新理解：你說的是「別在意」，他聽到的是「你的痛不算數」。\n具體行動：「這件事，讓你最在意的是什麼？」",q:"先接住感受，再談道理。"},
{h:"二、「你怎麼這麼笨」",t:"舊習慣：用評價代替陪伴。\n新理解：「笨」是一個句點，孩子只能低頭；提問是一個逗點，孩子還能抬頭。\n具體行動：「這題，從哪一步開始不懂？」",q:"一句提問，讓孩子重新抬起頭。"},
{h:"三、「別人都會，你為什麼不會」",t:"舊習慣：拿別人當尺。\n新理解：比較讓人看見自己的不足，卻看不見自己的路。起跑點都不一樣，怎麼能比終點？\n具體行動：「跟上次比，你已經進步在哪裡？」",q:"被看見進步的人，才有力氣繼續進步。"},
{h:"四、「想開一點就好」",t:"舊習慣：急著把人拉出難過。\n新理解：難過的人不是想不開，是還沒走完。感冒都要好幾天才會好，心裡的傷，難道一句話就能好？\n具體行動：「現在，你最需要什麼樣的支持？」",q:"陪伴，有時候就是什麼都不急。"},
{h:"五、「我都是為你好」",t:"舊習慣：把自己的答案塞給對方。\n新理解：沒有問過的好意，是一份壓力；問過的好意，才是一份禮物。\n具體行動：「你需要的是建議、陪伴，還是實際的幫忙？」",q:"問一句，比猜十次更溫柔。"}],
practice:"在你最常對家人說的話裡，找出一句「評價」，換成一句「提問」。問完之後，什麼都不必補充，只要安靜地聽。",
close:"那天晚上，媽媽敲了敲女兒的房門，端著一盤切好的水果進去。她沒有再說「妳太敏感」，只是問：「今天那件事，最讓妳難過的是哪一部分？」女兒愣了很久，然後一邊哭，一邊說了好多好多。",
poem:["原來她要的，","從來不是答案，","是一雙願意停下來的耳朵。","刀聲停了，","門開了，","愛，終於走了進去。"]},

{key:"s6",ch:"第六章",type:"哲學與AI",theme:"第一個念頭可信嗎",pain:"太相信直覺和第一反應",
title:"你的直覺，也會像AI一樣「很有自信地說錯」",
prop:"確信是一種感覺，真實是一件事情；兩者常常一起出現，卻不是同一回事。",
open:`文華的群組裡，每天都有人貼賺錢的截圖。理智說：「再看看吧。」心跳說：「再不買就來不及了！」那天晚上，心跳贏了，他把一半的存款投了進去。

惠玲最近常常失眠。她很確定：「一定是我想太多。」於是她買了好幾本教人放鬆的書，讀到凌晨兩點，卻從沒想過，也許該去看醫生、檢查一下身體。

還有你。也許某天早上抽到一張牌、做了一個夢，心裡一震：「這一定是在告訴我什麼。」`,
ask:`這些念頭有一個共同點：來得很快，而且非常篤定。
可是，篤定，就等於正確嗎？
一個念頭重複了一百次，它是變得更真了，還是只是變得更熟了？
如果連機器都會很有自信地說錯，我們憑什麼確定，自己腦中的聲音從不出錯？`,
secs:[
{h:"一、想像一下：如果你的腦袋，是一台很會聊天的機器",t:"你問一台很會說話的機器：「明天會下雨嗎？」它用很肯定的語氣說：「會，而且是大雨。」你會怎麼做？你會打開窗看看天，或者查一下氣象。因為你知道，說得流暢，不代表說得準確。那為什麼，我們對自己腦中的聲音，從來不查？",q:"說得很肯定，不等於說得對。"},
{h:"二、熟悉，不是真實",t:"一則謠言被轉傳一千次，它還是謠言；一個念頭被想了一千次，它還是念頭。熟悉讓人安心，真實讓人清醒；熟悉靠重複，真實靠查證。文華覺得「不買就虧了」，是因為群組每天都在重複，不是因為他真的算過。",q:"重複出現的念頭，不等於證據變多了。"},
{h:"三、AI 是一面鏡子：它會一本正經地說錯，我們也會",t:"現在的 AI 很厲害，卻有一個出名的毛病：有時會把不存在的事，說得頭頭是道。因為它是照著「最像答案的樣子」說話，而不是照著事實說話。人的直覺也很像：它從過去的經驗裡，拼出一個「最像真的」故事。大部分時候很好用，偶爾，也會很有自信地說錯。",q:"我們會檢查 AI 的答案，為什麼不檢查自己的？"},
{h:"四、回到生活：直覺是敲門聲，不是判決書",t:"這不是要你不信直覺。直覺像煙霧警報器——它響了，值得去看一看；但不是每次響，都代表失火。惠玲的失眠，也許和壓力有關，也許和身體有關；看一次醫生，就多一分安心。",q:"聽見敲門聲，先開門看看，再決定要不要逃。"}],
practice:"當心裡出現「一定是……」的念頭時，停下來問三句話：我有什麼證據？有沒有別的可能？如果我錯了，代價是什麼？問完再決定，大概只要一杯水的時間。",
close:"三個月後，文華那支股票跌了一半。他沒有責怪自己太久，只在筆記本上寫：「下次，先問自己能承受多少損失。」惠玲做了檢查，醫生幫她調整了作息，她終於一覺睡到天亮。",
poem:["直覺還是會來，","聲音還是很大。","只是現在，他們學會了——","在相信之前，","先溫柔地問一句：","「真的嗎？」"]},

{key:"s7",ch:"第七章",type:"生活覺醒",theme:"陪伴生病的家人",pain:"想照顧卻說錯話",
title:"「你要堅強」——為什麼這句話，讓生病的人更孤單？",
prop:"真正的陪伴，不是要對方變好，而是讓對方不再一個人。",
open:`病房裡，阿玉看著化療後掉了一把頭髮的姊姊，心裡一酸：「妳一定會好起來的！要堅強喔！」姊姊笑了笑，把臉轉向窗戶。阿玉以為自己給了力量，姊姊卻覺得，自己連害怕都不被允許了。

志偉的爸爸有糖尿病，卻常常偷吃甜點。志偉氣得大吼：「你到底要不要命？醫生講的你都不聽！」爸爸放下叉子，一整晚沒有說話。一個人在怕失去，一個人在怕被管；兩個人都在怕，卻吵成了一場架。

還有一位熱心的朋友，拿了一瓶保健食品給生病的親戚：「這個很有效，吃了就不用一直跑醫院。」`,
ask:`每一句話，都是出於關心。可是為什麼，聽的人好像更孤單了？
是不是因為，這些話都在說「你應該怎樣」，卻沒有人問「你現在怎樣」？
如果照顧的目的，是讓他不再一個人面對——那我們說出口的話，是把他拉近，還是推遠？`,
secs:[
{h:"一、「要堅強」，有時候是不准他軟弱",t:"我們說「要堅強」，他聽到的是「不准哭」。堅強不是不掉眼淚，而是掉眼淚的時候，旁邊有人。\n可以改說：「你現在最難受的是什麼？我可以怎麼陪你？」",q:"允許脆弱，才是真正的支持。"},
{h:"二、翻轉：責罵，是著急穿錯了衣服",t:"志偉吼的是「你不聽話」，心裡喊的卻是「我好怕失去你」。可是人被罵的時候，只會築牆，不會開門。\n可以改說：「最近哪些習慣最難維持？我們一起想辦法。」然後一起把甜點換成水果，一起去散步。",q:"每一句兇巴巴的話底下，都藏著一句「我好怕」。"},
{h:"三、太美的承諾，反而不誠實",t:"「一定會好」「吃了就有效」，聽起來很溫暖，可是誰能保證？承諾一旦落空，他失去的不只是希望，還有對你的信任。任何產品，都只能是照顧的一小部分，不能取代醫生的診斷和治療。\n可以改說：「我們先問問醫生，再看看什麼方法真的適合你。」",q:"誠實的溫柔，走得比美麗的保證更遠。"},
{h:"四、照顧別人的人，也需要被照顧",t:"一直撐著的人，也會累，也會崩潰。如果連你都倒下了，誰來陪他？請別人幫忙，不是失敗，是讓這份愛可以走得更久。",q:"先戴好自己的氧氣面罩，才有力氣扶住別人。"}],
practice:"去看望或打一通電話給生病的家人，不給任何建議，只問一句：「今天身體還好嗎？最讓你不舒服的是什麼？」然後安靜地聽完，不急著回答。",
close:"第二天，阿玉帶了一頂柔軟的毛帽去病房。她沒有再說「要堅強」，只是幫姊姊戴上帽子：「今天會怕嗎？我在這裡。」姊姊點點頭，眼淚掉下來，輕輕握住了她的手。",

淑惠陪國中的兒子讀書，一個晚上吼了三次。兒子哭著睡著之後，她坐在書桌前，看著一桌子的教養書。書上的道理她都畫了重點，可是吼出來的那一刻，一句也想不起來。`,

{h:"二、今天的處境：我們很會回答，卻很少提問",t:"手機裡有無數答案，心裡卻很少有一個好問題。吵架時，我們急著回嘴；挫折時，我們急著下結論。冠宇那句「為什麼每次都這樣」，其實是個好問題，只是他問完就丟了，沒有往下問。",q:"答案讓人停下來，問題讓人走下去。"},

/* ============ 圖卡（1080×1350，臉書直式） ============ */
const FONT='"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif';
const NOHEAD="，。、；：！？」』）】…—,.!?";
function wrapText(ctx,text,maxW){
  const out=[];
  String(text).split("\n").forEach(par=>{
    let line="";
    for(const ch of par){
      const t=line+ch;
      if(ctx.measureText(t).width>maxW && line && !NOHEAD.includes(ch)){ out.push(line); line=ch; }
      else line=t;
    }
    out.push(line);
  });
  return out;
}
function drawCard(c){
  const W=1080,H=1350,cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const x=cv.getContext("2d"), dark=c.style==="quote";
  const g=x.createLinearGradient(0,0,W,H);
  if(dark){ g.addColorStop(0,"#6f5a4a"); g.addColorStop(1,"#3b322b"); }
  else if(c.style==="poem"){ g.addColorStop(0,"#e9efe6"); g.addColorStop(1,"#f8f4ec"); }
  else { g.addColorStop(0,"#f3dcc6"); g.addColorStop(1,"#fbf3e8"); }
  x.fillStyle=g; x.fillRect(0,0,W,H);
  x.strokeStyle=dark?"rgba(255,240,220,.35)":"rgba(194,104,74,.35)"; x.lineWidth=3; x.strokeRect(48,48,W-96,H-96);
  const ink=dark?"#fbf3e8":"#3b322b", soft=dark?"#e7cfb5":"#8a6f5c", acc=dark?"#f0b98f":"#c2684a";
  x.textBaseline="top";
  x.fillStyle=acc; x.font="bold 34px "+FONT; x.fillText(c.label||"LifeOS",100,100);
  const blocks=[]; // [文字,字級,顏色,粗體,段距,特效]
  if(c.title) blocks.push([c.title,c.tsize||64,ink,true,30]);
  if(c.old) blocks.push([c.old,48,soft,false,24,"strike"]);
  if(c.big) blocks.push([c.big,c.bsize||72,ink,true,36]);
  if(c.mid) blocks.push([c.mid,c.msize||40,soft,false,24]);
  if(c.lines) c.lines.forEach(l=>blocks.push([l,c.lsize||50,ink,false,10]));
  const maxW=W-200; let total=0; const laid=[];
  blocks.forEach(b=>{ x.font=(b[3]?"bold ":"")+b[1]+"px "+FONT; const ls=wrapText(x,b[0],maxW); laid.push([b,ls]); total+=ls.length*b[1]*1.5+b[4]; });
  let y=Math.max(200,(H-total)/2-20);
  if(dark){ x.fillStyle="rgba(240,185,143,.45)"; x.font="bold 220px Georgia,serif"; x.fillText("“",86,Math.max(150,y-190)); }
  laid.forEach(([b,ls])=>{
    x.font=(b[3]?"bold ":"")+b[1]+"px "+FONT; x.fillStyle=b[2];
    ls.forEach(l=>{
      const lw=x.measureText(l).width, lx=c.center?(W-lw)/2:100;
      x.fillText(l,lx,y);
      if(b[5]==="strike") x.fillRect(lx,y+b[1]*0.6,lw,4);
      y+=b[1]*1.5;
    });
    y+=b[4];
  });
  x.fillStyle=soft; x.font="28px "+FONT;
  x.fillText("LifeOS｜換一句話，心就多一條路",100,H-120);
  if(c.page){ x.fillText(c.page,W-100-x.measureText(c.page).width,H-120); }
  return cv.toDataURL("image/png");
}
function cardsOf(cfg){
  if(cfg.art){
    const a=cfg.art, n=a.secs.length+3, L=a.ch+"｜"+a.type;
    const cs=[{label:L,title:a.title,tsize:70,mid:"「"+a.prop+"」",msize:44}];
    a.secs.forEach(s=>cs.push({label:L,style:"quote",mid:s.h.replace(/^[一二三四五六七八九十]+、/,""),msize:38,big:s.q,bsize:68}));
    cs.push({label:"今天的小練習",title:"今天，試一件小事",tsize:58,mid:a.practice,msize:40});
    cs.push({label:L,style:"poem",lines:a.poem,lsize:50,center:true});
    cs.forEach((c,i)=>c.page=(i+1)+" / "+n);
    return cs;
  }
  const A=AB[cfg.ab], P=PLAIN[cfg.ab];
  if(cfg.sent){ const e=cfg.sent; return [{label:"舊話換新話・第 "+e.no+" 句",old:e.old,big:e.nw,bsize:70,mid:"✦ "+P.prop,msize:38}]; }
  return [{label:"LifeOS",title:cfg.tag,tsize:60,mid:"「"+P.prop+"」",msize:42,lines:["✦ "+A.quotes[0]],lsize:46}];
}

  sec("七大理論",THEORY.map((t,i)=>has(t.name,t.field,t.chain,t.cs,t.say,t.wis,t.abn,t.bd,t.p,t.ab)?theoryCard(t,i):"").filter(Boolean));
  sec("核心觀念",CORE.map((b,i)=>has(b.t,b.o,b.p,b.en)?blockCard(b,i,T.c1,"第一章"):"").filter(Boolean));
  sec("因果更新",CAUSE.map((b,i)=>has(b.t,b.o||"",b.p,b.old||"",b.nw||"",b.chain||"")?blockCard(b,i,T.c3,"第三章"):"").filter(Boolean));
  sec("臉書長文",ARTS.filter(a=>has(a.title,a.body,a.theme,a.pain,a.type,a.ch)).map(artCard));
  sec("速查公式",FORM.map((b,i)=>has(b.t,b.o,b.p,b.chain||"",b.ten?TEN.join(" "):"",b.nine?NINE.join(" "):"")?blockCard(b,i,T.c8,"第八章"):"").filter(Boolean));
  if(has(SAFETY_O,"安全界線")){ h+='<h2>安全界線</h2>'+safetyCard(); n++; }
  return '<h1>搜尋「'+esc(st.q)+'」</h1><p class="count">找到 '+n+' 筆。'+(n?"慢慢看，挑一句最有感的就好。":"換個字試試看，例如：界線、期待、手機、原諒。")+'</p>'+h;
}
function render(){
  POSTS.length=0;
  $("nav").innerHTML=TABS.map(t=>'<button data-tab="'+t[0]+'" class="'+(!st.q&&st.tab===t[0]?"on":"")+'">'+t[1]+'</button>').join("");
  const v=st.q.trim()?vSearch():({home:vHome,core:vCore,theory:vTheory,cause:vCause,s:vS,quick:vQuick,arts:vArts}[st.tab])();
  $("app").innerHTML=v;
}
function go(tab){ st.tab=tab; st.q=""; $("q").value=""; render(); window.scrollTo(0,0); }

/* 貼文視窗 */
let cur=null, shift=0;
function showPost(){
  const t=cur.art?artText(cur.art):buildPost(cur,shift), c=countWords(t);
  $("ptitle").textContent=cur.title;
  $("ptext").textContent=t; $("pbody").scrollTop=0;
  const base=(cur.art?cur.art.ch:(cur.sent?"No"+cur.sent.no:"LifeOS"))+"_圖卡";
  $("pimgs").innerHTML=cardsOf(cur).map((c,i)=>{ const u=drawCard(c); return '<a href="'+u+'" download="'+base+"_"+(i+1)+'.png" title="點一下下載這張圖"><img src="'+u+'" alt="圖卡 '+(i+1)+'">第 '+(i+1)+' 張</a>'; }).join("");
  $("pshuf").style.display=cur.art?"none":"";
  $("pcount").textContent=cur.art?("臉書長文｜"+cur.art.type+"｜中文約 "+c.zh+" 字"):("約 "+c.total+" 字（中文 "+c.zh+" 字＋英文 "+c.en+" words）");
}
async function copyText(t,btn){
  const old=btn.textContent;
  try{ await navigator.clipboard.writeText(t); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(_){} ta.remove(); }
  btn.textContent="已複製 ✓"; setTimeout(()=>btn.textContent=old,1400);
}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-tab],[data-go],[data-post],[data-copy],[data-ch],[data-ab],#again");
  if(!b) return;
  if(b.dataset.tab) return go(b.dataset.tab);
  if(b.dataset.go) return go(b.dataset.go);
  if(b.dataset.post!==undefined){ cur=POSTS[+b.dataset.post]; shift=0; showPost(); $("mask").classList.add("show"); return; }
  if(b.dataset.copy!==undefined) return copyText(b.dataset.copy,b);
  if(b.dataset.ch!==undefined){ st.ch=+b.dataset.ch; return render(); }
  if(b.dataset.ab!==undefined){ st.ab=b.dataset.ab; return render(); }
  if(b.id==="again"){ st.daily=Math.floor(Math.random()*200); return render(); }
});
$("q").addEventListener("input",e=>{ st.q=e.target.value; render(); });
$("pclose").onclick=()=>$("mask").classList.remove("show");
$("mask").addEventListener("click",e=>{ if(e.target.id==="mask") $("mask").classList.remove("show"); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") $("mask").classList.remove("show"); });
$("pshuf").onclick=()=>{ shift++; showPost(); };
$("pdl").onclick=()=>{ [...$("pimgs").querySelectorAll("a")].forEach((a,i)=>setTimeout(()=>a.click(),i*350)); };
$("pcopy").onclick=e=>copyText($("ptext").textContent,e.target);
render();
</script>
</body>
</html>
