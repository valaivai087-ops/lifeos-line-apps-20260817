        }
        
        :root {

            --teal: #0A7A72;
            --bg: #ffffff;
            --text: #1A1A1A;
            --border: #e8e8e8;
        }
        
        body {

            background: var(--bg);
            color: var(--text);

            font-size: 18px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 50px;
            border-bottom: 3px solid var(--gold);
            padding-bottom: 30px;
        }
        
        h1 {
            font-size: 42px;
            color: var(--navy);
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 24px;
            color: var(--teal);
            margin-bottom: 20px;
        }
        
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .nav-tabs button {
            background: var(--border);
            border: 2px solid var(--border);
            padding: 12px 20px;
            cursor: pointer;
            font-family: 'Microsoft JhengHei', sans-serif;
            font-size: 16px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        
        .nav-tabs button:hover {
            background: var(--gold);
            color: white;
            border-color: var(--gold);
        }
        
        .nav-tabs button.active {
            background: var(--navy);
            color: white;
            border-color: var(--navy);
        }
        
        .upgrade-section {
            display: none;
        }
        
        .upgrade-section.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .upgrade-title {
            font-size: 32px;
            color: var(--navy);
            margin-bottom: 15px;
        }
        
        .core-diff {
            background: #f5f5f5;
            border-left: 4px solid var(--gold);
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 4px;
        }
        
        .core-diff-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 15px;
        }
        
        .core-diff-item {
            padding: 10px;
        }
        
        .core-diff-item strong {
            color: var(--navy);
        }
        
        .core-diff-item:last-child {
            margin-bottom: 0;
        }
        
        .differences-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        
        .diff-card {
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .diff-card:hover {
            border-color: var(--gold);
            box-shadow: 0 4px 12px rgba(201, 150, 12, 0.1);
        }
        
        .diff-header {
            background: linear-gradient(135deg, var(--navy) 0%, var(--teal) 100%);
            color: white;
            padding: 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }
        
        .diff-header:hover {
            background: linear-gradient(135deg, var(--teal) 0%, var(--navy) 100%);
        }
        
        .diff-number {
            background: rgba(201, 150, 12, 0.3);
            padding: 4px 12px;
            border-radius: 4px;
            margin-right: 10px;
            min-width: 50px;
            text-align: center;
        }
        
        .expand-icon {
            font-size: 20px;
            transition: transform 0.3s ease;
        }
        
        .diff-card.open .expand-icon {
            transform: rotate(180deg);
        }
        
        .diff-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        
        .diff-card.open .diff-content {
            max-height: 500px;
        }
        
        .diff-body {
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        
        .diff-column {
            padding-right: 15px;
            border-right: 2px solid var(--border);
        }
        
        .diff-column:last-child {
            border-right: none;
            padding-right: 0;
        }
        
        .diff-column h4 {
            color: var(--navy);
            font-size: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .diff-column p {
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 12px;
        }
        
        .text-with-tts {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }
        
        .text-content {
            flex: 1;
        }
        
        .lang-label {
            font-size: 13px;
            color: #999;
            margin-bottom: 6px;
        }

            background: var(--teal);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Microsoft JhengHei', sans-serif;
            font-size: 14px;
            margin-top: 8px;
            transition: all 0.2s ease;
        }
        
        .tts-button:hover {
            background: var(--navy);
            transform: scale(1.05);
        }
        
        .tts-button.playing {
            background: var(--gold);
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

            background: linear-gradient(135deg, var(--navy) 0%, var(--teal) 100%);
            color: white;
            padding: 30px;
            margin-top: 30px;
            border-radius: 6px;
            text-align: center;
            font-size: 20px;
            line-height: 1.8;
        }
        
        .quote-section .tts-button {
            background: var(--gold);
            margin-top: 15px;
        }
        
        .controls {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .controls button {
            background: var(--navy);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Microsoft JhengHei', sans-serif;
            font-size: 16px;
            transition: all 0.2s ease;
        }
        
        .controls button:hover {
            background: var(--teal);
        }
        
        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 10px;
            border: 2px solid var(--border);
            border-radius: 4px;
            font-family: 'Microsoft JhengHei', sans-serif;
            font-size: 16px;
        }
        
        .stats {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 4px;
            text-align: center;
            margin-bottom: 30px;
            font-size: 16px;
        }

            h1 {

            }

                font-size: 18px;
            }

            }
            
            .diff-column {
                border-right: none;
                border-bottom: 2px solid var(--border);
                padding-right: 0;
                padding-bottom: 15px;
            }
            
            .nav-tabs {
                flex-direction: column;
            }
            
            .nav-tabs button {
                width: 100%;
            }
        }

        // Initialize
        function init() {
            renderNavTabs();
            renderFirstUpgrade();
            setupEventListeners();
            updateStats();
            loadVoices();
        }
        
        function renderNavTabs() {
            const navTabs = document.getElementById('navTabs');
            navTabs.innerHTML = '';
            upgrades.forEach((upgrade, index) => {
                const btn = document.createElement('button');
                btn.textContent = upgrade.title;
                btn.className = index === 0 ? 'active' : '';
                btn.onclick = () => switchUpgrade(index);
                navTabs.appendChild(btn);
            });
        }
        
        function renderFirstUpgrade() {
            switchUpgrade(0);
        }
        
        function switchUpgrade(index) {
            document.querySelectorAll('.upgrade-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-tabs button').forEach((b, i) => {
                b.classList.toggle('active', i === index);
            });
            renderUpgrade(upgrades[index]);
        }
        
        function renderUpgrade(upgrade) {
            const content = document.getElementById('content');
            let html = `<div class="upgrade-section active">
                <h2 class="upgrade-title">${upgrade.title} | ${upgrade.englishTitle}</h2>
                <div class="core-diff">
                    <div class="core-diff-row">
                        <div class="core-diff-item">
                            <strong style="color:var(--navy);">${upgrade.title}</strong>
                            <p>${upgrade.coreCH}</p>
                            <button class="tts-button" onclick="speakText('${upgrade.coreEN.replace(/'/g, "\\'")}', event)">🔊 ${upgrade.coreEN}</button>
                        </div>
                        <div class="core-diff-item">
                            <strong style="color:var(--teal);">${upgrade.englishTitle}</strong>
                            <p>${upgrade.coreEN}</p>
                            <button class="tts-button" onclick="speakText('${upgrade.coreEN.replace(/'/g, "\\'")}', event)">🔊 Speak</button>
                        </div>
                    </div>
                    <div class="core-diff-row">
                        <div class="core-diff-item">
                            <p>${upgrade.coreCH2}</p>
                            <button class="tts-button" onclick="speakText('${upgrade.coreEN2.replace(/'/g, "\\'")}', event)">🔊 ${upgrade.coreEN2}</button>
                        </div>
                        <div class="core-diff-item">
                            <p>${upgrade.coreEN2}</p>
                            <button class="tts-button" onclick="speakText('${upgrade.coreEN2.replace(/'/g, "\\'")}', event)">🔊 Speak</button>
                        </div>
                    </div>
                </div>
                <div class="differences-grid" id="diffs"></div>
                <div class="quote-section">
                    <p>💡 ${upgrade.quote}</p>
                    <button class="tts-button" onclick="speakText('${upgrade.quoteEN.replace(/'/g, "\\'")}', event)">🔊 Speak Quote</button>
                    <p style="font-size: 18px; margin-top: 15px; margin-bottom: 10px;">${upgrade.quoteEN}</p>
                </div>
            </div>`;
            
            content.innerHTML = html;
            
            const diffsContainer = document.getElementById('diffs');
            upgrade.differences.forEach((diff, idx) => {
                const card = document.createElement('div');
                card.className = 'diff-card';
                card.innerHTML = `
                    <div class="diff-header" onclick="toggleCard(this)">
                        <div style="display: flex; align-items: center; flex: 1; gap: 15px;">
                            <span class="diff-number">${diff.num}</span>
                            <div style="flex: 1;">
                                <div style="font-size: 14px; color: #666; margin-bottom: 2px;">舊框架</div>
                                <span>${diff.time}</span>
                            </div>
                            <div style="width: 2px; height: 30px; background: var(--border);"></div>
                            <div style="flex: 1;">
                                <div style="font-size: 14px; color: #666; margin-bottom: 2px;">新框架</div>
                                <span>${diff.value}</span>
                            </div>
                        </div>
                        <span class="expand-icon">▼</span>
                    </div>
                    <div class="diff-content">
                        <div class="diff-body">
                            <div class="diff-column">
                                <h4>中文 🇹🇼</h4>
                                <div class="text-with-tts">
                                    <div class="text-content">
                                        <div class="lang-label">舊框架</div>
                                        <p>${diff.time}</p>
                                    </div>
                                </div>
                                <div class="text-with-tts">
                                    <div class="text-content">
                                        <div class="lang-label">新框架</div>
                                        <p>${diff.value}</p>
                                    </div>
                                </div>
                            </div>
                            <div class="diff-column">
                                <h4>English 🇺🇸</h4>
                                <div class="text-with-tts">
                                    <div class="text-content">
                                        <div class="lang-label">Old thinking</div>
                                        <p>${diff.timeEN}</p>
                                    </div>
                                    <button class="tts-button" onclick="speakText('${diff.timeEN.replace(/'/g, "\\'")}', event)">🔊</button>
                                </div>
                                <div class="text-with-tts">
                                    <div class="text-content">
                                        <div class="lang-label">New thinking</div>
                                        <p>${diff.valueEN}</p>
                                    </div>
                                    <button class="tts-button" onclick="speakText('${diff.valueEN.replace(/'/g, "\\'")}', event)">🔊</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                diffsContainer.appendChild(card);
            });
        }
        
        function toggleCard(header) {
            const card = header.closest('.diff-card');
            card.classList.toggle('open');
        }
        
        function setupEventListeners() {
            document.getElementById('searchBox').addEventListener('input', filterDifferences);
        }
        
        function filterDifferences() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            document.querySelectorAll('.diff-card').forEach(card => {
                const text = card.textContent.toLowerCase();
                card.style.display = text.includes(query) ? 'block' : 'none';
            });
        }
        
        function expandAll() {
            document.querySelectorAll('.diff-card').forEach(card => {
                card.classList.add('open');
            });
        }
        
        function collapseAll() {
            document.querySelectorAll('.diff-card').forEach(card => {
                card.classList.remove('open');
            });
        }
        
        function updateStats() {
            const totalDiffs = upgrades.reduce((sum, u) => sum + u.differences.length, 0);
            document.getElementById('stats').textContent = `共 ${upgrades.length} 組思維升級 | ${totalDiffs} 個具體差異 | Total: ${upgrades.length} Upgrades | ${totalDiffs} Specific Differences`;
        }
        
        let voices = [];
        
        function loadVoices() {
            if (window.speechSynthesis.getVoices().length > 0) {
                voices = window.speechSynthesis.getVoices();
            } else {
                window.speechSynthesis.onvoiceschanged = () => {
                    voices = window.speechSynthesis.getVoices();
                };
                setTimeout(() => {
                    voices = window.speechSynthesis.getVoices();
                }, 500);
            }
        }
        
        function speakText(text, event) {
            if (event) {
                event.stopPropagation();
                const btn = event.target.closest('.tts-button');
                if (btn) {
                    btn.classList.add('playing');
                }
            }
            
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            
            utterance.onend = () => {
                if (event) {
                    const btn = event.target.closest('.tts-button');
                    if (btn) {
                        btn.classList.remove('playing');
                    }
                }
            };
            
            utterance.onerror = () => {
                if (event) {
                    const btn = event.target.closest('.tts-button');
                    if (btn) {
                        btn.classList.remove('playing');
                    }
                }
            };
            
            const enVoice = voices.find(v => v.lang.startsWith('en-US'));
            if (enVoice) utterance.voice = enVoice;
            
            window.speechSynthesis.speak(utterance);
        }
        
        window.addEventListener('load', init);
    </script>
