Adjust: Morning light, walking, gradual exercise, layered clothing, regular sleep.
See a doctor if: Lasting fever, wheezing, chest pain, or clear allergy or breathing symptoms. Don't just call it "the season".`,
H:`Transition: Cold to warm.
Common mistake: Dropping layers quickly and suddenly exercising more.
Sweat: Sweating more after returning to exercise is normal; sweat alone does not show weakness.
Diet: Drink at the temperature that feels comfortable; hot drinks are not required.
Ability: Adapting to cold and heat.`,
I:`Carried over: Less movement, short daylight and an inward winter life.
Likely to surface: Feeling cold, fatigue, a sensitive nose, stiff neck and shoulders.
Build now: Sleep, morning light and the ability to move.
For next term: Better tolerance for the damp and temperature swings of Rain Water.
Key line: Don't sprint; slowly wake up the resources you saved in winter.`,
J:`Nature's signal: Longer daylight and milder weather. The first "begin".
When reserve is low: Spring arrives but you still feel tired and flat.
Defense: Manage temperature swings, wash hands, ventilate, keep a regular routine.
Body–mind task: Activate, and be willing to begin.
Key line: Don't order yourself to cheer up; check what winter left you to start with.`,
K:`Task: Turn reserve into activation.
Five-element ability: Wood: generating, adapting, sense of direction.
Nourish: Move and stretch muscles and joints.
Recharge: Sleep.
Refuel: Balanced breakfast, protein, whole grains, seeds and nuts.
Key line: Inner reserve is not "I will surely succeed this year"; it is "I am able to begin".`,
L:`Action: Open a new channel for receiving.
Keep: New information that truly helps you grow.
Release: Fear of missing out, comparison, other people's expectations.
Boundary: Open no more than one to three new plans at first.
Key line: Don't open every door; decide which door is worth opening this year.`,
M:`Awake to: What I truly want to begin.
Old to new: From starting because others start, to choosing for myself.
Ask yourself: Is this my goal, or someone else's expectation?
Different pace: Others may run fast; I can walk steadily first.
Ability: Self-direction.`},
{A:`Focus: Nourish the lungs and secure kidney energy.
Points & meridians: Yunmen, Yuji, Taiyuan; elbow crease, armpit, back of the knee; ears, Yaoyan, Yongquan.
Essential oils: Tea tree with vetiver.
In plain words: The air turns moist; look after breathing and adaptation.`,
B:`Nature: More rain and changing humidity.
Body: It handles lingering cold and rising damp at the same time.
Prone to imbalance: Weak digestion, little movement, easy fatigue or sensitive airways.
Emotion: On rainy days some people move less and feel lower.
Strategy: Keep moving, ventilate and dehumidify, sleep regularly.
Meaning: Moisture is not stagnation; after water comes in, the system still needs to flow.`,
C:`Reminder: Not all growth comes from effort; some comes from letting yourself be supported.
Self: Do I only know how to give, and not how to receive?
People: A healthy relationship is not one-way sacrifice; it flows both ways.
Opportunity: Some chances are not chased; you can only catch them when you are ready.
Things: Material things are resources, not identity.
Key line: Giving is an ability. Receiving is an ability too.`,
D:`Archetype: The Nurturer.
Gift: Empathy, care, tolerance, softness.
Shadow: Over-giving, people-pleasing, absorbing others' emotions, blurry boundaries.
Lesson: Learn to receive and let resources flow back.
Key line: I can love others gently without proving my love by draining myself.`,
E:`Direction: From dry to moist; from independence to receiving.
Who struggles: People who carry everything alone and dislike asking for help.
Imbalance: Exhausted yet refusing help; always giving, never receiving.
Compensation: Practice accepting help and rest, and notice who deserves a place in your system.
Ability: Receiving capacity.
Key line: True nourishment is knowing what to take in and what not to.`,
F:`Base energy: Water nourishes wood.
Imbalance hypothesis: Too much damp brings heaviness and stagnation.
Life signal: Taking in many resources without turning them into action.
Food: Warm cooked food, beans, Chinese yam, as you tolerate.
Compensation: Receive, digest, then act.`,
G:`Weather: More rain and humidity; temperature still unstable.
Old weak spots: Nasal discomfort, skin, digestion, fatigue.
Amplifiers: Long sitting, damp rooms, too many cold drinks, poor sleep.
Adjust: Dehumidify, ventilate, move moderately, eat at regular times.
Reminder: Deal with "damp plus stillness" first, then meet the Awakening of Insects.`,
H:`Transition: Cold plus damp.
Signals: Heaviness, digestive discomfort, nasal symptoms, skin changes.
Common mistake: Long sitting, a damp room and poor sleep together.
Food: Whole foods such as Chinese yam, beans and grains.
Ability: Keeping things flowing.`,
I:`Environment: More rain and humidity; temperature still unstable.
Likely to surface: Indigestion, fatigue, nose or skin symptoms.
Build now: Movement, a drier room and regular meals.
For next term: Get ready for the stronger movement of the Awakening of Insects.
Key line: The task is not to fear damp, but not to let yourself stagnate.`,
J:`Nature's signal: More rain and humidity. From waking to nourishing.
Signals: Appetite, digestion, skin, nose, fatigue; laziness and low drive.
Regulate: Ventilate, dehumidify, move.
Body–mind task: Flow, and accept support.
Key line: Don't only receive nourishment; turn it into living activity.`,
K:`Task: Turn resources into nourishment.
Five-element ability: Water feeding wood.
Nourish: Water intake and a comfortable environment.
Recharge: Sleep.
Refuel: Whole grains, beans, vegetables.
Key line: Inner reserve is knowing that life does not have to be carried alone.`,
L:`Action: Receive real nourishment.
Keep: People who support your growth.
Release: Dependent relationships that take away your autonomy.
Strategy: Reduce information noise.
Key line: True nourishment makes you stronger, not more unable to leave.`,
M:`Awake to: What nourishment I need.
Old to new: From taking every kind of support, to recognizing what truly fits me.
Ask yourself: What restores me? What makes me more dependent?
Different pace: Someone else's supply is not necessarily mine.
Ability: Awareness in receiving.`},
{A:`Focus: Care for the gut and nourish the liver.
Points: Tianshu.
Essential oils: Lemon, grapefruit, black pepper, coriander seed, with rosemary verbenone.
Yoga: Gut-cleansing sequence.
In plain words: Everything starts moving; the body leaves its slow winter mode.`,
B:`Nature: Temperatures rise and living things become active.
Body: Activity, diet, sleep and metabolism clearly change pace.
Prone to imbalance: Irregular winter habits are exposed once activity increases.
Emotion: Needs, plans and conflicts held down for long come back up.
Strategy: Return to exercise, tidy your diet, watch bowel habits and sleep, handle what you postponed.
Meaning: What should wake up wakes up, and problems may wake up with it.`,
C:`Reminder: Problems you avoided, needs you pressed down and decisions you delayed deserve a fresh look.
Self: What exactly am I avoiding?
People: What needs to be said clearly? Which boundaries were never set?
Opportunity: Don't wait until you are fully ready; once awake, take the first step.
Things: Find the things you bought to become "someone, someday" but never used.
Key line: Awakening is not suddenly knowing the truth; it is finally being willing to see.`,
D:`Archetype: The Awakener.
Gift: Awareness, breakthrough, waking others up, seeing problems.
Shadow: Haste, criticism, treating disagreement as others being asleep.
Lesson: Awareness is not truth; let reality test it.
Key line: I am not here to prove I see most clearly, but to stay able to see a little more clearly.`,
E:`Direction: From sleep to activity; from hidden to visible.
Who struggles: People who avoid conflict, fear change and shelve problems.
Imbalance: Agitation, and wanting to solve everything at once.
Compensation: Name the one thing that truly needs handling now.
Ability: Awareness.
Key line: Waking up is not solving life in one go; it is no longer pretending the problem is not there.`,
F:`Base energy: Wood moves and thunder sounds.
Imbalance hypothesis: Too strong means haste and conflict; too weak means knowing you should move but not moving.
Life signal: Criticizing old systems a lot without offering an alternative.
Food: Vegetables, water, regular meals. No single food is a liver cure.
Compensation: Awareness, one priority, one action.`,
G:`Weather: Warm, damp and fast-changing.
Old weak spots: Allergy, sleep, digestion and stress.
Amplifiers: Suddenly getting busy and sleeping late.
Adjust: Fixed sleep and wake times, return to exercise, tidy your diet.
Reminder: Don't make permanent decisions in a wave of emotion; discomfort is a signal, not an identity.`,
H:`Transition: From stillness to movement.
Core: Can the body keep up with more activity?
Sweat: When sweating increases, look first at intensity, temperature, humidity and fitness.
Adjust: Increase exercise week by week; no need to force sweat at once.
Ability: Gradual adaptation.`,
I:`Environment: Warming speeds up.
Likely to surface: Allergy, unsettled sleep, stress, sore muscles.
Amplifiers: Adding back exercise, work and social life all at once.
Build now: Gradual activity plus recovery.
For next term: The Spring Equinox needs dynamic balance.
Key line: What truly needs waking is not impulse, but adaptability.`,
J:`Nature's signal: Spring thunder, nature's alarm clock.
Core: Winter sleep, nutrition and activity shape how well you start in spring.
Emotion model: Low reserve plus a changing environment raises uncertainty, so small changes feel like big threats.
Calming ritual: Jasmine tea can be a relaxing ritual; it is not a medicine for anxiety or insomnia.
Defense: Wash hands often, ventilate, stay away from others when sick, wear a mask when needed.
Traditional foods: The damp-clearing trio: millet porridge, four-herb soup, winter melon and barley soup.
Correction: "No thunder means drought" is an old folk symbol, not a weather forecast.
Key line: Staying calm in change does not mean nothing changes; it means your inner regulation can find stability again.`,
K:`Task: Turn reserve into activation.
Five-element ability: Wood: adapting.
Nourish: The movement system.
Recharge: Fixed sleep and wake times.
Refuel: Steady meals.
Key line: Inner reserve is knowing my next step when the world suddenly changes.`,
L:`Action: Wake up as the outside world gets louder.
Keep: Real signals.
Release: Noise. "I hear it" does not mean "I must react".
Boundary: Cut down notifications, social media and news.
Key line: The world is noisy, yet I still know which voice deserves a reply.`,
M:`Awake to: What deserves my reaction.
Old to new: From being startled, to choosing my response.
Ask yourself: Does this really need me to handle it now?
Different pace: The world is in a hurry; I don't have to be.
Ability: Choosing a response.`},
{A:`Focus: Inner balance, immune regulation and sleep.
Points & meridians: Triple Burner meridian, Xuehai, Neiguan.
Essential oils: Sweet orange, basil, true lavender.
In plain words: Day and night are equal; find your own balance again.`,
B:`Nature: Day and night are nearly equal.
Body: It moves from the winter–spring switch into a steadier spring state.
Prone to imbalance: The gap between too much activity and too little recovery begins to show.
Emotion: Notice whether emotions keep pulling you in one direction.
Strategy: Check the ratio of work to rest, activity to recovery, input to output.
Meaning: Balance is not two equal sides forever; it is being able to come back after tilting.`,
C:`Reminder: Balance is not stopping; it is adjusting while moving forward. The direction is outward.
Self: Accept strengths and shortcomings; don't wait to be perfect before starting.
People: Learn to cooperate without losing yourself.
Opportunity: Don't close every door because of one failure.
Things: Put resources where growth is happening.
Key line: Balance is not standing still; it is going out and still finding yourself.`,
D:`Archetype: The Expanding Balancer.
Gift: Coordinating, integrating, fairness, building cooperation.
Shadow: Hesitation, too much compromise, fear of conflict.
Lesson: After balance, you still have to choose.
Key line: Balance is not avoiding choice; it is seeing both sides and still daring to walk your own way.`,
E:`Direction: From balance to outward expansion.
Who struggles: People who are contracting, tired or in need of solitude.
Imbalance: Over-socializing, over-studying and opening new plans just to keep up.
Compensation: Use study and new skills as a safe way to expand.
Ability: Expansion with a center.
Key line: Don't rush out; stand firm, then grow outward.`,
F:`Base energy: Wood is strong and seeks balance.
Imbalance hypothesis: Too much wood expands everywhere; too much metal means harsh self-criticism and fear of opening up.
Life signal: See whether you are expanding too little or too much.
Food: Whole plant foods, protein, a variety of fruit and vegetables.
Compensation: Learn, make something, and test it in the real world.`,
G:`Weather: Equal day and night, but spring still swings.
Old weak spots: Imbalance between work and rest, activity and recovery.
Amplifiers: Over-expanding as soon as energy returns.
Adjust: Check four balances: work and rest, input and output, solitude and company, activity and recovery.
Reminder: You may expand, but confirm your center first.`,
H:`Transition: A balance test between cold and warm.
Observe: Sleep, fatigue, exercise recovery, how cold or hot you feel.
Adjust: Don't define your constitution by "I fear cold" or "I fear heat"; record the situation.
Ability: Dynamic regulation.
Key line: Not never cold or hot, but able to readjust when the environment changes.`,
I:`Environment: Equal day and night, the first system balance check of spring.
Likely to surface: Imbalance between work and rest, activity and recovery.
Amplifiers: Mistaking expansion for "the busier the better".
Build now: Balance and boundaries.
For next term: Pure Brightness brings a more active outdoor environment.
Key line: Don't stop at balance; stand firm and then grow outward.`,
J:`Nature's signal: Balanced day and night. Recalibrate after waking.
Core question: After waking, are you over-expanding?
Regulate: Rebalance work and rest, company and solitude.
Body–mind task: Balance, and expand with a center.
Key line: The Awakening of Insects wakes you; the Spring Equinox keeps you from running wild.`,
K:`Task: Bring your strength back to the center.
Five-element ability: Wood plus metal: generating with boundaries.
Nourish, recharge, refuel: Movement, rest, steady nutrition.
With reserve: You dare to expand and dare to say no.
Key line: Real balance is not staying still; it is moving and still being able to return.`,
L:`Action: Balance openness and boundaries.
Keep: Openness with edges.
Release: People-pleasing. Empathy is not carrying someone else's life.
Boundary: Understand first, then decide whether to step in.
Key line: Don't tear down the wall; learn when to open the door.`,
M:`Awake to: Balance does not mean sameness.
Old to new: From "fair means everyone is the same", to "different can also be balanced".
Reminder: Different people need different speeds, rest, methods and boundaries.
Ability: Dynamic balance.`},
{A:`Focus: Clear heat; care for liver, gut and lungs.
Points: Taichong, Tianshu, Chize, Hegu.
Essential oils: Bergamot, spearmint, eucalyptus, clove.
Yoga: Half-lotus side stretch, cobra pose.`,
B:`Nature: Warmer, more rain, plants grow fast.
Body: More outdoor activity and exposure.
Prone to imbalance: Pollen, air quality, temperature swings and poor sleep raise symptoms in sensitive people.
Emotion: A cultural time of remembering and missing.
Strategy: Go outdoors, move, tidy your space, and tidy unfinished feelings and matters.
Meaning: Clearing is not denying the past; it is not letting the past fill the present.`,
C:`Reminder: Some of the past deserves honoring, some only needs understanding. Remembering is not living there forever.
Self: Which old stories still define me today?
People: Thank those who walked with you, and accept that some only walk one stretch.
Opportunity: A lost chance can leave wisdom, not lifelong regret.
Things: When an object brings someone to mind, thank it for the memory, then decide whether to keep it.
Key line: Remember the past, but don't hand it the steering wheel.`,
D:`Archetype: The Memory Keeper.
Gift: Gratitude, deep feeling, a sense of history, understanding life's context.
Shadow: Rumination, nostalgia, glorifying the past, trouble saying goodbye.
Lesson: Memory is not destiny.
Key line: I keep my memories, but I don't let memories keep me.`,
E:`Direction: From mixed to clear; from piling up to sorting.
Who struggles: People who are nostalgic, find it hard to let go, or tie identity to the past.
Imbalance: Replaying the past; old relationships occupy attention.
Compensation: Tidy space, relationships and promises; keep the meaning, lower the weight of old events.
Ability: Re-weighting memory.
Key line: Don't throw the past away; just stop letting it decide today.`,
F:`Base energy: Strong wood turns clear; growth now includes pruning.
Imbalance hypothesis: Growing without trimming means more and more to handle.
Life signal: Old relationships, objects and promises take up your new life.
Food: Light meals, varied fruit and vegetables, enough water.
Compensation: Delete, merge, re-weight. Grow through pruning.`,
G:`Weather: Warm, damp, more allergens and outdoor exposure.
Old weak spots: Seasonal nose and eye symptoms, sensitive skin, poor sleep.
Amplifiers: Late nights and outdoor exposure without recovery.
Adjust: Reduce exposure by air quality and pollen, clean, sleep, drink water.
See a doctor if: Severe wheezing, whole-body allergy, or symptoms that keep worsening.`,
H:`Transition: Warm and damp, with more outside exposure.
Signals: Skin, nose, eyes, airways.
Easy misread: Calling every sneeze "expelling cold"; also consider pollen, dust mites and infection.
Adjust: Clean, ventilate, adjust outdoor time by air quality.
Key line: When the body reacts, find the cause before giving the symptom a nice name.`,
I:`Environment: Warm, damp and more exposure; the body's barriers are tested.
Likely to surface: Sensitive nose, eyes, skin and airways.
Amplifiers: Late nights, high stress and allergens.
Build now: Sleep, a managed environment and barrier care.
For next term: Prepare for the rising damp and warmth of Grain Rain.
Key line: Tidy the environment, and the past that keeps draining the present.`,
J:`Nature's signal: Plants grow and people go out. The outside world pours in.
Outside load: Allergens, air quality, temperature and humidity.
Defense: Adjust exposure to real allergens and air quality.
Body–mind task: Barriers, and tidying the past.
Key line: Know what is worth letting into your body and your life.`,
K:`Task: Clear off unneeded weight.
Five-element ability: Metal enters: selecting.
Recharge: Leave blank space.
Refuel: The people and things that truly matter.
Key line: Inner reserve is remembering the past and still being able to live in the present.`,
L:`Action: Clear the signals the past left behind.
Keep: Experience and love.
Release: Repeated self-blame and old roles.
Strategy: Memory, then evidence, then re-weighting.
Key line: What needs clearing is not memory, but the wrong weight memory still holds over today.`,
M:`Awake to: The past is not the present.
Old to new: From "I fell, so I am a failure", to "an event is evidence, not identity".
Ask yourself: "I once failed" does not equal "I am a failure".
Ability: Re-weighting memory.`},
{A:`Focus: Liver heat, circulation and active metabolism.
Points: Neiguan, Taichong, Yongquan, Fengshi.
Essential oils: Petitgrain with cypress.
Exercise: Standing meditation and gate pose.`,
B:`Nature: More rain; spring is completing.
Body: It turns from spring sprouting to summer growing.
Prone to imbalance: Unhandled sleep, stress and diet problems show more in summer.
Emotion: Wanting to do many things in spring leads to overexertion.
Strategy: Review your spring baselines: sleep, activity, stress, digestion.
Meaning: Growth is not endless; after growing comes sorting.`,
C:`Reminder: Important changes first happen where they cannot be seen.
Self: Don't deny yourself because results are slow.
People: Relationships need time to build evidence.
Opportunity: Don't dig up the seed every day to check on it.
Things: Resources should water what truly matters.
Key line: Not seeing it yet does not mean it is not happening.`,
D:`Archetype: The Cultivator.
Gift: Nurturing, companionship, long-term thinking, patience.
Shadow: Sunk cost and over-endurance.
Lesson: Tell a seed from a dead end.
Key line: Patience is not waiting forever; it is knowing what is worth waiting for.`,
E:`Direction: From sprouting to accumulating.
Who struggles: People who want quick results and instant feedback.
Imbalance: "I did it, so why isn't it working yet?"
Compensation: Set a baseline, two-week feedback and progress markers, so patience rests on evidence.
Ability: Delayed reward.
Key line: Wait, and watch whether the seed is really growing.`,
F:`Base energy: Wood turns toward fire.
Imbalance hypothesis: Sowing all the time without narrowing direction.
Life signal: Many plans, scattered attention, wanting to do everything.
Food: Steady meals and water as temperatures rise.
Compensation: Narrow ten directions down to three.`,
G:`Weather: Rain and temperature gradually increase.
Old weak spots: Unhandled fatigue, digestion and sleep carry into summer.
Amplifiers: Opening too many plans in spring.
Adjust: Review the spring: which habits worked and which did not?
Key line: Decide which seeds are worth taking into summer.`,
H:`Transition: From damp to heat.
Core: Prepare to move into summer cooling mode.
Signals: Appetite, sleep, skin, tolerance for activity.
Adjust: Set up your summer plan for water, exercise and sleep.
Ability: Summer readiness.`,
I:`Role: The last stop of spring: spring summary and summer preparation.
Core question: Is my body ready for summer?
Observe as damp rises: Skin, digestion, energy and focus, mouth and throat, urinary and genital area, skin of the feet.
Traditional five elements: Liver wood, spleen earth, heart fire: care for digestion in spring to protect the heart in summer.
Emotion and gut: Stress affects sleep, appetite and gut feelings, but not every gut problem is emotional.
Reserve to build: A steady gut, sleep, water, nutrition, ability to move, stress regulation.
Medical correction: "Weak digestion causes heart failure" is not medical fact. Chest pain, breathlessness, leg swelling, fainting or palpitations need a doctor.
Key line: Don't walk into the summer load carrying sleep debt, gut trouble and fatigue.`,
J:`Nature's signal: Rain, humidity and warmth rise. The last sorting of spring.
Signals: Digestion, skin, energy, sleep.
Regulate: First put sleep, digestion and fitness in order.
Body–mind task: Build a summer reserve, and narrow your direction.
Key line: Not more sprouting; check whether you are ready for summer.`,
K:`Task: The last supply station of spring.
Check: Enough sleep? Steady digestion? Enough strength? Has stress piled up?
Nourish, recharge, refuel: Water, sleep, complete nutrition.
Key line: Summer has not come, yet you are already ready for it.`,
L:`Action: The last selection of spring.
Ask yourself: What is worth carrying into summer?
Strategy: Keep, merge or delete.
Key line: Not adding more; deciding which seeds deserve more water.`,
M:`Awake to: What is worth carrying into the next season.
Old to new: From keeping everything you started, to choosing your seeds.
Ask yourself: Is this still worth watering?
Key line: Not every seed has to become a big tree.`},
{A:`Focus: Digestion, and easing the spine and nerves.
Points: Zusanli, Shangjuxu, Xiajuxu.
Essential oils: Sichuan pepper for digestion, true lavender for the spine.
Yoga: Cat stretch.`,
B:`Nature: Daylight and temperature keep rising.
Body: More need for cooling, activity and water.
Prone to imbalance: Poor sleep, unsteady digestion, too much heat exposure.
Emotion: Always busy, forgetting to recover.
Strategy: Drink water, eat regularly, avoid sudden hard exercise, protect sleep.
Meaning: More energy does not mean endless spending.`,
C:`Reminder: Don't ask "what do I lack"; ask "what do I already have that I can start using".
Self: Let your abilities leave the inside.
People: Add real connection, not just more contacts.
Opportunity: A time to act, not only to plan.
Things: A tool has value only when it is used.
Key line: Preparation matters, but action is what changes a life.`,
D:`Archetype: The Expresser.
Gift: Expression, charisma, action, creation.
Shadow: Needing applause, over-spending energy, fear of being ignored.
Lesson: Expression is not a request for approval.
Key line: I can shine without needing other eyes to prove I exist.`,
E:`Direction: From inside to outside.
Who struggles: People who fear exposure and hide in preparation.
Imbalance: The other extreme is needing applause too much.
Compensation: Turn knowledge into work and ability into action.
Ability: Expression.
Key line: Not being seen by everyone, but bringing ability into the world.`,
F:`Base energy: Fire begins to rise.
Imbalance hypothesis: Too little fire means little expression; too much means over-socializing, overwork and excitement.
Life signal: Needing outside attention and approval.
Food: Water, fruit and vegetables, enough electrolytes.
Compensation: Expression plus recovery.`,
G:`Weather: More heat and daylight; heat is the new variable.
Old weak spots: Sleep, heart load, digestion, hydration.
Amplifiers: Late nights, heat exposure, too little water.
Adjust: Drink water, eat on time, cool the bedroom.
Reminder: When energy rises, it is easiest to overestimate your capacity.`,
H:`Transition: Constant switching between outdoor heat and indoor air conditioning.
Modern reading: The body keeps regulating temperature; air conditioning is not "cold stored in the organs".
Signals: Discomfort with temperature, dry skin, nasal symptoms, sleep.
Adjust: Don't set the air conditioner too low, avoid direct cold air, move moderately.
Ability: Adapting to hot and cold switches.`,
I:`Role: Check whether spring prepared you enough. The first stress test.
Signals: Sleep, appetite, thirst, exercise tolerance.
Build now: Water, sleep and a steady gut.
For next term: The heat and damp of Grain Buds.
Key line: Not a fresh start, but a review of your spring preparation.`,
J:`Nature's signal: More heat, light and activity. The accelerator.
Signals: Thirst, sleep, appetite, fatigue.
Defense: Water, cooling, sleep.
Body–mind task: Cool down, and express.
Key line: Not full speed ahead; learn to manage a higher output.`,
K:`Task: Dare to show yourself.
Five-element ability: Fire: expressing, showing, interacting.
Nourish, recharge, refuel: Water, sleep, enough nutrition.
Without reserve: Over-performing, seeking approval, restlessness.
Key line: I can shine without burning myself out.`,
L:`Action: Open the channel of expression.
Keep: Honest expression.
Release: Proving yourself.
Boundary: Not every idea has to be understood by everyone.
Key line: Dare to shine, without forcing others to look.`,
M:`Awake to: Expression is not proof.
Old to new: From needing applause to confirm myself, to expressing without proving.
Different pace: Others' disapproval does not mean I must stop.
Ability: Authentic expression.`},
{A:`Focus: Clear damp.
Points: Yinlingquan.
Essential oils: Patchouli.
Yoga: Table pose.`,
B:`Nature: Rain and heat increase.
Body: A heavier load for cooling and handling humidity.
Prone to imbalance: Stuffiness, heaviness, fatigue, digestive discomfort.
Emotion: Many things to do, and a full mind.
Strategy: Dehumidify, exercise, eat light, schedule less.
Meaning: No need to be completely full; a little space allows renewal.`,
C:`Reminder: Full, but not completely full. Space and the unknown let the system update.
Self: You don't need a perfect score to deserve approval.
People: Don't ask one person to fill all your needs.
Opportunity: Receive some, and accept not getting it all.
Things: Enough is freer than the most.
Key line: Real completeness has room for your own incompleteness.`,
D:`Archetype: The Enough One.
Gift: Gratitude, moderation, a feel for living, contentment.
Shadow: Perfectionism dressed up as contentment.
Lesson: Enoughness, and leaving blank space.
Key line: Life need not be filled up; blank space is part of being whole.`,
E:`Direction: From increasing to nearly full.
Who struggles: Perfectionists who want to maximize everything.
Imbalance: "Just a little short" always becomes "I am not enough".
Compensation: Define "good enough" first.
Ability: Enoughness.
Key line: There is still room, yet you already know gratitude.`,
F:`Base energy: Fire is filling up.
Imbalance hypothesis: "Still more"; desire keeps raising the baseline.
Money signal: Income rises and spending rises with it.
Food: Light meals and water; fewer sugary drinks.
Compensation: Set an "enough" rule.`,
G:`Weather: Heat and damp build; the system nears full load.
Old weak spots: Skin, digestion, sleep and fatigue worsen in muggy weather.
Amplifiers: Icy sweet drinks, late nights, long sitting.
Adjust: Dehumidify, ventilate, move, drink water.
Key line: Leave a margin before you reach full load.`,
H:`Transition: Three variables: heat, humidity and air conditioning.
Sweat: In high humidity sweat does not evaporate well, so you sweat a lot yet don't feel cool.
Adjust: Dehumidifying is often as important as cooling.
Diet: Don't replace water with lots of sugary cold drinks.
Ability: Managing damp heat.`,
I:`Environment: Heat and damp begin to stack.
Likely to surface: Skin, digestion, sleep, fatigue.
Amplifiers: Sugary drinks, air conditioning, long sitting, late nights.
Build now: Water, room humidity and regular activity.

H:`Role: The key period for judging "expelling cold and damp".

Sweat is not damp: Sweat regulates temperature; "damp" is a traditional pattern. Sweating a lot does not mean damp is gone.
Exercise: Watch intensity, heat, humidity, heart rate, fatigue and recovery. Go low, then moderate, check feedback, adapt, then increase.
A healing reaction?: Cough, blocked nose, phlegm, worse eczema or peeling, weeping toes are not proof of "expelling cold". They may be infection, allergy, asthma, eczema or fungus. Observe, and see a doctor when needed.
Low-risk practices: Some sun on the back, the Eight Brocades "two hands hold up the sky", warm hands on the lower back, less fried food and sweets.
Food: Yam, corn and onion soup; red date and sticky rice porridge.
Real signs of improvement: Better sleep, a more comfortable gut, steady stools, fewer skin and airway symptoms, better exercise tolerance, faster recovery.
Key line: Expelling cold means gradually improving how the body regulates and recovers when cold, heat, damp, activity and diet change.`,

M:`Role: The term of clarity: yang gathers and yin grows; sunrise comes later and sunset earlier.

Intuition: Body sensing, emotional awareness and pattern recognition. Intuition can suggest; reality must test.

Key line: Clarity frees us both. I don't need the world in step with me to keep my own rhythm.`},

Reminder: "Emotions directly damage organs and form tumors" is a traditional saying, not medical fact.
Meaning: Not never being off balance, but recalibrating while it is obvious, before winter.`,
C:`Reminder: Truths you did not want to see now deserve to be faced. Those who can face them are the same inside and out.

Self: Admit shortcomings without shame; admit strengths without pride.
People: Stop keeping false relationships by pleasing. Feel sad about "no going back" for a few minutes, then be free.

L:`Role: The core term of "separating clear from turbid".

{t:'醫療邊界提醒',h:`<ul>
<li>五行、經絡、濕氣、陽氣屬傳統養生語言；不等同現代醫學因果。</li>
<li>症狀變多不是「排寒／排毒有效」的證據；舊疾復發先找原因，持續或加重就治療。</li>
<li>流汗不等於排濕；大量出汗不是健康成績。</li>
<li>感染（黴菌、泌尿道、咽喉）各有病原，不能只歸因濕氣。</li>
<li>立即就醫：胸痛胸悶、呼吸困難、暈厥、意識改變、下肢明顯水腫、持續發燒、便血、嚴重皮疹、疑似帶狀疱疹、熱傷害警訊。</li>
<li>四物、八珍、十全大補是中藥方劑，需專業評估體質。營養品不取代治療。</li>
<li>節氣日期為約略日，每年前後差一天。</li></ul>`}

function fig(v,list,all){let s='<svg class="fig" viewBox="-34 0 268 440" role="img" aria-label="'+(v==='F'?'正面':'背面')+'穴位圖">'+body(v);
list.forEach(n=>{const m=MR[n];if(m&&m[0]===v)s+='<path class="mer" d="'+m[1]+'"><title>'+n+'</title></path>'});
if(all)for(const n in PT)PT[n][0].forEach(k=>{if(k[0]===v&&!list.includes(n))s+='<circle class="dot" data-p="'+n+'" cx="'+k[1]+'" cy="'+k[2]+'" r="3"><title>'+n+'</title></circle>'});
list.forEach(n=>{const p=PT[n];if(p)p[0].forEach((k,j)=>{if(k[0]!==v)return;const L=p[2];
s+='<circle class="on" data-p="'+n+'" cx="'+k[1]+'" cy="'+k[2]+'" r="4.5"/>'+(n==='三窩'&&0?'':'<text x="'+(k[1]+(L?-7:7))+'" y="'+(k[2]+4)+'"'+(L?' text-anchor="end"':'')+'>'+(n==='三窩'?['腋窩','肘窩','膝窩'][j]:n)+'</text>')})});
return s+'</svg>'}
function figs(list,both){const need=v=>both||list.some(n=>PT[n]?PT[n][0].some(k=>k[0]===v):MR[n][0]===v);

function pchips(list,cur){return '<div class="chips" style="margin:10px 0 0">'+list.map(n=>'<button class="chip'+(n===cur?' on':'')+'" data-p="'+n+'">'+n+'</button>').join('')+'</div>'}

const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function nowIdx(){const d=new Date(),v=(d.getMonth()+1)*100+d.getDate();let best=21,bv=-1;
T.forEach((t,i)=>{const tv=t.d[0]*100+t.d[1];if(tv<=v&&tv>bv){bv=tv;best=i}});return best}
const NOW=nowIdx();
let st={m:'term',i:NOW,l:'*',L:'A',q:'',en:true};
function hl(s){s=esc(s);if(!st.q)return s;const q=esc(st.q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return s.replace(new RegExp(q,'gi'),m=>'<mark>'+m+'</mark>')}
const SAY='<button class="sayall" title="朗讀這張卡的全部英文">🔊 全部</button>';
function enl(e){return e?'<div class="en" title="點一下朗讀"><span class="sp">🔊</span><span class="et">'+hl(e)+'</span></div>':''}
function rows(zh,en){if(typeof zh==='string')zh=zh.split('\n');if(typeof en==='string')en=en.split('\n');en=en||[];
return zh.map((x,j)=>{const k=x.indexOf('｜');const a=x.slice(0,k),b=x.slice(k+1);
return '<div class="row"><b>'+hl(a)+'</b><div><div'+(a==='金句'?' class="gold"':'')+'>'+hl(b)+'</div>'+enl(en[j])+'</div></div>'}).join('')}
let VOICE=null;const TTS='speechSynthesis' in window;
function pickV(){const vs=speechSynthesis.getVoices();VOICE=vs.find(v=>/en[-_]US/i.test(v.lang)&&/Natural|Google|Aria|Jenny/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
if(TTS){pickV();speechSynthesis.onvoiceschanged=pickV}
function say(list){if(!TTS)return;speechSynthesis.cancel();list.forEach(t=>{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(VOICE)u.voice=VOICE;u.rate=.92;speechSynthesis.speak(u)})}
function grid(){return '<div class="grid">'+T.map((t,i)=>'<button class="t'+(i===st.i&&st.m==='term'?' on':'')+(i===NOW?' now':'')+'" style="--c:'+SC[t.s]+'" data-i="'+i+'">'+t.n+'<small>'+t.d[0]+'/'+t.d[1]+(i===NOW?' ・現在':'')+'</small></button>').join('')+'</div>'}
function chips(cur,all){return '<div class="chips">'+(all?'<button class="chip'+(cur==='*'?' on':'')+'" data-l="*">全部</button>':'')+LENS.map(l=>'<button class="chip'+(cur===l[0]?' on':'')+'" data-l="'+l[0]+'">'+l[1]+'</button>').join('')+'</div>'}
function vTerm(){const t=T[st.i];
return grid()+'<div class="hero" style="--c:'+SC[t.s]+'"><h2>'+t.n+'｜'+t.k+'</h2>'+enl(TN[st.i]+' — '+KW[st.i])+'<p>'+SEASON[t.s]+'季・約 '+t.d[0]+' 月 '+t.d[1]+' 日'+(st.i===NOW?'・目前節氣':'')+'</p></div>'+chips(st.l,true)+
LENS.filter(l=>st.l==='*'||st.l===l[0]).map(l=>'<div class="card"><h3>'+l[1]+' <span>'+l[2]+'・'+LE[l[0]]+'</span> '+SAY+'</h3>'+rows(t[l[0]],EN[st.i][l[0]])+(l[0]==='A'||l[0]==='N'?aFig(t[l[0]]):'')+'</div>').join('')}
function vMap(){const p=st.p,isP=p&&PT[p],info=p?(isP?PT[p][1]:MR[p][2]):'';
const use=p?T.map((t,i)=>names(t.A+t.N).includes(p)?i:-1).filter(i=>i>=0):[];
return '<div class="card"><h3>穴位</h3>'+pchips(Object.keys(PT),p)+'<h3 style="margin-top:12px">經絡</h3>'+pchips(Object.keys(MR),p)+'</div>'+
'<div class="card">'+(p?'<h3>'+p+' <span>'+(isP?'穴位':'經絡走向')+'</span></h3><div class="row"><b>'+(isP?'位置':'走向')+'</b><div>'+info+enl(PE[p][0]+'. '+PE[p][1])+'</div></div>'+
(use.length?'<div class="row"><b>用到的節氣</b><div class="chips" style="margin:0">'+use.map(i=>'<button class="chip" data-i="'+i+'">'+T[i].n+'</button>').join('')+'</div></div>':''):'<h3>點上方名稱，或直接點圖上的圓點</h3>')+
figs(p?[p]:[],true)+'<p class="note" style="margin:8px 0 0">示意圖，位置為約略標示，實際取穴以文字描述與專業人員指導為準。1 寸約為自己拇指的寬度。</p></div>'}
function vLens(){const l=LENS.find(x=>x[0]===st.L);
return chips(st.L,false)+'<div class="hero" style="--c:var(--acc)"><h2>'+l[1]+'</h2>'+enl(LE[l[0]])+'<p>'+l[2]+'・24 節氣對照</p></div>'+
T.map((t,i)=>'<div class="card" style="border-left:4px solid '+SC[t.s]+'"><h3 data-i="'+i+'">'+t.n+' <span>'+SEASON[t.s]+'・'+t.d[0]+'/'+t.d[1]+'・'+TN[i]+'</span> '+SAY+'</h3>'+rows(t[l[0]],EN[i][l[0]])+(l[0]==='A'||l[0]==='N'?aFig(t[l[0]]):'')+'</div>').join('')}
function vOver(){return OVER.map((o,j)=>'<div class="card"><h3>'+o.t+'</h3>'+enl(OE[j])+o.h+'</div>').join('')}
function vSearch(){const q=st.q.toLowerCase();let out='',n=0;
T.forEach((t,i)=>{LENS.forEach(l=>{const zh=t[l[0]].split('\n'),en=EN[i][l[0]].split('\n');
let ix=zh.map((x,j)=>j).filter(j=>zh[j].toLowerCase().includes(q)||(en[j]||'').toLowerCase().includes(q));
const nameHit=t.n.includes(st.q)||TN[i].toLowerCase().includes(q);
if(ix.length||(nameHit&&l[0]==='B')){if(!ix.length)ix=[0,1];n++;out+='<div class="card hit" data-i="'+i+'" data-l="'+l[0]+'"><h3>'+hl(t.n)+' <span>'+hl(TN[i])+'</span> <span class="tag">'+l[1]+'</span></h3>'+rows(ix.map(j=>zh[j]),ix.map(j=>en[j]))+'</div>'}})});
[...Object.keys(PT).map(k=>[k,PT[k][1],'穴位圖']),...Object.keys(MR).map(k=>[k,MR[k][2],'經絡圖'])].forEach(a=>{const e=PE[a[0]][0]+'. '+PE[a[0]][1];if((a[0]+a[1]+e).toLowerCase().includes(q)){n++;out+='<div class="card hit" data-p="'+a[0]+'"><h3>'+hl(a[0])+' <span class="tag">'+a[2]+'</span></h3><div>'+hl(a[1])+'</div>'+enl(e)+'</div>'}});
OVER.forEach((o,j)=>{const tx=o.h.replace(/<[^>]+>/g,' ')+OE[j];if((o.t+tx).toLowerCase().includes(q)){n++;out+='<div class="card hit" data-o="1"><h3>'+hl(o.t)+' <span class="tag">總覽</span></h3></div>'}});
return '<p class="note" style="margin:0 0 10px">找到 '+n+' 筆「'+esc(st.q)+'」</p>'+(out||'<div class="card">沒有符合的內容，換個關鍵字試試。</div>')}
function render(){document.querySelectorAll('.tabs button[data-m]').forEach(b=>b.classList.toggle('on',!st.q&&b.dataset.m===st.m));
document.body.classList.toggle('noen',!st.en);$('#ent').textContent=st.en?'英文：開':'英文：關';$('#ent').classList.toggle('on',st.en);
$('#app').innerHTML=(st.q?vSearch():st.m==='term'?vTerm():st.m==='lens'?vLens():st.m==='map'?vMap():vOver())+'<p class="note">資料來源：個人節氣養生筆記整合。內容為生活與自我覺察參考，不能取代醫療診斷與治療。</p>'}
function clearQ(){st.q='';$('#q').value=''}
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;
if(b.id==='ent'){st.en=!st.en;if(TTS)speechSynthesis.cancel();render();return}clearQ();st.m=b.dataset.m;render();scrollTo(0,0)};
$('#q').oninput=e=>{st.q=e.target.value.trim();render()};
$('#app').onclick=e=>{const sa=e.target.closest('.sayall');
if(sa){if(TTS&&speechSynthesis.speaking&&sa.classList.contains('on')){speechSynthesis.cancel();sa.classList.remove('on');return}
document.querySelectorAll('.sayall.on').forEach(x=>x.classList.remove('on'));sa.classList.add('on');say([...sa.closest('.card').querySelectorAll('.et')].map(x=>x.textContent));return}
const en=e.target.closest('.en');if(en){say([en.querySelector('.et').textContent]);return}
const pp=e.target.closest('[data-p]');
if(pp){const top=st.m!=='map'||st.q;clearQ();st.p=pp.dataset.p;st.m='map';render();if(top)scrollTo(0,0);return}
const hit=e.target.closest('.hit');
if(hit){if(hit.dataset.o){clearQ();st.m='over'}else{st.i=+hit.dataset.i;st.l=hit.dataset.l;st.m='term';clearQ()}render();scrollTo(0,0);return}
const c=e.target.closest('.chip[data-l]');if(c){if(st.m==='lens')st.L=c.dataset.l;else st.l=c.dataset.l;render();return}
const t=e.target.closest('[data-i]');if(t){st.i=+t.dataset.i;st.m='term';st.l='*';render();scrollTo(0,0)}};
render();
</script>
</body>
</html>
