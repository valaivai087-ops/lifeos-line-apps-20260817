["你的價值，從來不在那張成績單上。\n但你的努力，值得用一個不那麼可怕的方式開始。\n願你打開書的時候，心裡不再是恐懼，而是：我今天練這一塊就好。","Your worth was never on that report card.\nBut your effort deserves a less frightening way to begin.\nMay you open the book not with dread, but with: today I only need to practice this one piece."]
]};

P.N31={h:["學了這麼多，為什麼腦袋還是一盤散沙？因為你一直在收集，卻沒有在連結。","You have learned so much, so why does it feel like loose sand? Because you keep collecting and never connecting."],
q:["知識的力量不在多，而在連得起來。","The power of knowledge lies not in how much, but in how well it connects."],
tags:"#LifeOS #知識碎片化 #節點關係圖 #連結的力量 #心靈雞湯 #ConnectTheDots",
b:[
["你存了好多文章，買了好多課，筆記軟體裡有幾千則筆記。\n每一則當下都覺得好有道理。\n可是真的要用的時候，一則也想不起來。","You have saved so many articles, bought so many courses, and filled your note app with thousands of entries.\nEach one felt so right in the moment.\nBut when you actually need one, none comes to mind."],
["你覺得自己像一個倉庫管理員。\n東西越堆越多，卻找不到要的那一樣。\n於是你更焦慮，又去收集更多。","You feel like a warehouse keeper.\nThings pile higher, yet you cannot find the one you need.\nSo you grow more anxious and go collect even more."],
["其實你一點都不缺知識。\n你缺的是一個很關鍵的差異：\n知道很多個點，不等於擁有一張網。\n散開的點，風一吹就散；連起來的點，才撐得住重量。","In truth you are not short of knowledge at all.\nWhat you are missing is one key difference:\nknowing many points is not the same as having a web.\nScattered points blow away in the wind; connected points can bear weight."],
["一顆一顆的珠子，放在抽屜裡，只是一堆珠子。\n用一條線串起來，才是一條項鍊。\n你不需要更多珠子，你需要那一條線。","Beads lying loose in a drawer are only a heap of beads.\nStrung on a thread, they become a necklace.\nYou do not need more beads. You need the thread."],
["所以換一個看法吧。\n不是「我學得還不夠多」，而是「我學的東西，還沒有彼此認識」。\n新的知識，要去跟舊的知識握手，才會留下來。","So see it differently.\nNot: I have not learned enough. But: the things I have learned have not yet met each other.\nNew knowledge stays only after it shakes hands with what you already know."],
["把權重調一下。\n今天又學了多少新東西，放輕一點。\n今天把哪兩樣東西連起來，放重一點。\n筆記的數量，放輕一點。\n筆記之間的關係，放重一點。","Adjust the weights.\nHow many new things I learned today: lighter.\nWhich two things I connected today: heavier.\nThe number of notes: lighter.\nThe relationships between notes: heavier."],
["這就是建立節點關係的能力。\n每學到一個新觀念，問三個問題：\n它跟我已經知道的哪件事很像？\n它跟哪件事相反？\n它是哪件事的原因，或是哪件事的結果？","This is the ability to build relationships between nodes.\nFor each new idea, ask three questions:\nWhat that I already know is it like?\nWhat is it the opposite of?\nWhat does it cause, or what causes it?"],
["然後，拿一張紙把它畫出來。\n中間寫主題，旁邊寫相關的觀念，用線連起來，線上寫關係。\n畫得醜沒關係，畫出來，它就是你的了。","Then take a sheet of paper and draw it.\nPut the topic in the center, related ideas around it, link them with lines, and write the relationship on each line.\nIt need not be pretty. Once drawn, it is yours."],
["收集讓你覺得富有，連結才讓你真的有力量。\n記得住的不是資料，是關係。\n一個連得起來的人，學十樣，勝過別人學一百樣。","Collecting makes you feel rich; connecting gives you real power.\nWhat we remember is not data, but relationships.\nOne who connects gains more from ten things than others do from a hundred."],
["今天的小練習：\n挑一個你最近學的主題，寫下五個相關的觀念。\n用線把它們連起來，每一條線上寫一個詞：因為、所以、例如、相反、屬於。\n畫完之後，試著看著圖，把整個主題講一遍。","Today's small practice:\nPick a topic you studied recently and write down five related ideas.\nConnect them with lines and label each: because, therefore, for example, opposite, part of.\nWhen done, look at the map and explain the whole topic aloud."],
["你不是學得不夠，你是學得太散。\n停下來，把已經有的串起來。\n願你腦中的每一顆珠子，都找到它的線。","You have not learned too little. You have learned too scattered.\nPause, and string together what you already have.\nMay every bead in your mind find its thread."]
]};

P.N32={h:["例題都會，考題一換就不會？你學會的是那一題，還沒學會那個方法。","You can do every example, but not the exam version? You learned that one problem, not yet the method."],
q:["真正學會，是換了題目、換了場景，你依然用得出來。","True learning means you can still use it when the question and the setting change."],
tags:"#LifeOS #遷移不足 #跨情境應用 #活用所學 #心靈雞湯 #TransferYourLearning",
b:[
["老師講的時候，你聽得懂。\n課本的例題，你也都會算。\n可是考卷上，同樣的觀念換了一個包裝，你就像沒學過一樣。","When the teacher explains, you follow.\nYou can do every example in the textbook.\nBut on the test, the same concept in new packaging looks like something you never studied."],
["你很挫折：我明明會啊，為什麼考試就不會？\n老師說：這題上課教過類似的。\n你心裡想：哪裡類似？我完全看不出來。","You are frustrated: I do know it, so why not on the test?\nThe teacher says: we did a similar one in class.\nYou think: similar how? I cannot see it at all."],
["這不是你笨，也不是你不用功。\n只是有一個差異，需要被看見：\n在熟悉的題目裡會，不等於在新的情境裡會。\n把學到的東西搬到新地方用，這本身是一種需要練習的能力。","This is not being dumb, nor lacking effort.\nThere is simply a difference to be seen:\nbeing able in a familiar problem is not being able in a new situation.\nCarrying what you learned to a new place is itself a skill that needs practice."],
["如果每次練的都是長得一樣的題目，大腦記住的是外表。\n數字換了，敘述換了，圖形轉了一個方向，它就認不出來。\n你認得的是那件衣服，不是穿衣服的那個人。","If every practice problem looks the same, the brain remembers the surface.\nChange the numbers, the wording, or rotate the figure, and it fails to recognize it.\nYou recognize the clothes, not the person wearing them."],
["所以換一個看法吧。\n不是「我只會簡單的」，而是「我還沒有在夠多不同的情境裡練過這個方法」。\n方法要離開原來的題目，去別的地方走一走，才會真的長大。","So see it differently.\nNot: I can only do the easy ones. But: I have not yet practiced this method in enough different situations.\nA method must leave its original problem and travel elsewhere to truly grow."],
["把權重調一下。\n同一種題目寫很多遍，放輕一點。\n不同樣子的題目各寫幾題，放重一點。\n記住這題怎麼解，放輕一點。\n說出這題用了什麼方法，放重一點。","Adjust the weights.\nMany repetitions of one problem type: lighter.\nA few each of differently shaped problems: heavier.\nRemembering how this one is solved: lighter.\nNaming the method this one uses: heavier."],
["這就是跨情境應用的能力。\n每做完一題，多問自己三句：\n這一題用的核心方法是什麼？\n如果條件改掉一個，我還會嗎？\n這個方法，在別的科目或生活裡，哪裡也用得到？","This is the ability to apply across contexts.\nAfter each problem, ask yourself three more things:\nWhat is the core method here?\nIf one condition changed, could I still do it?\nWhere else, in another subject or in life, does this method apply?"],
["會解一題，是學會了一條魚。\n看得出方法，是學會了釣魚。\n能把方法帶到新的池塘，才是真的會釣魚的人。","Solving one problem is having one fish.\nSeeing the method is learning to fish.\nCarrying the method to a new pond is what makes a real angler."],
["活用，不是天分，是練出來的。\n題目會變，方法不變。\n看得見不變的人，就不怕變。","Flexible use is not talent; it is trained.\nQuestions change; methods do not.\nThose who see what stays the same do not fear what changes."],
["今天的小練習：\n挑一題你已經會的題目，自己動手改它：換數字、換情境、把問題反過來問。\n試著解你自己改出來的題目。\n解得出來，這個方法才真的是你的。","Today's small practice:\nTake one problem you can already do and alter it yourself: change the numbers, the setting, or ask it in reverse.\nTry to solve your own altered version.\nIf you can, the method is truly yours."],
["你不是只會例題的人。\n你只是需要帶著方法，多去幾個地方。\n願你學到的每一樣本事，走到哪裡都用得上。","You are not someone who can only do examples.\nYou simply need to take the method to more places.\nMay every skill you learn be usable wherever you go."]
]};

function wrap(c,t,x,y,w,lh){
  let line='';
  (t.match(/[A-Za-z0-9'’,.\-!?;:]+\s*|[\s\S]/g)||[]).forEach(k=>{
    if(c.measureText(line+k).width>w&&line){c.fillText(line.trimEnd(),x,y);y+=lh;line=k.trimStart()}else line+=k});
  if(line){c.fillText(line.trimEnd(),x,y);y+=lh}
  return y;
}

function copy(t,btn){

}
$('#cpL').onclick=e=>copy(`人生路徑更新練習 ${boxes.filter(b=>b.checked).length}/8\n`+CH.map((c,i)=>`${boxes[i].checked?'✅':'⬜'} Ch${i+1}｜${c.chk}`).join('\n'),e.target);
const all=f=>DOM.filter(d=>NODES[d.k]&&NODES[d.k].some(f)).map(d=>`【${d.k}｜${d.n} ${d.r}】\n`+NODES[d.k].map(f).filter(Boolean).join('\n')).join('\n\n');
$('#cpN').onclick=e=>copy(all(n=>`${n.id}｜${n.t}：${n.old} → ${n.nw}`),e.target);
$('#cpS').onclick=e=>copy(all(n=>n.st?`${n.id}｜${n.t}（${n.old} → ${n.nw}）\n  策略① ${n.st[0]}\n  策略② ${n.st[1]}`:''),e.target);
</script>
</body>
</html>
