    {name:'透明質酸鈉',icon:'💧',iconBg:'rgba(24,95,165,0.12)',mechanism:'組織保水',detail:'透明質酸是細胞外基質的主要成分，能結合自身重量1000倍的水分。關節液、皮膚、眼球都依賴透明質酸維持功能。修復組織時，提供充足的透明質酸是保持組織彈性和功能的關鍵。',why:'組織修復不只是補充蛋白質，保水性是讓新生組織正常運作的隱形支柱。',price:'NT$530',spec:'錠劑 約320粒'},
    {name:'酵母鋅+核酸',icon:'🔩',iconBg:'rgba(59,109,17,0.12)',mechanism:'傷口修復',detail:'鋅參與超過300種酶的功能，在傷口修復中特別關鍵：調節炎症反應、促進細胞增殖、加速上皮化。核酸提供DNA合成原料，雙重加速修復。',why:'沒有鋅，修復工程就像工人拿到圖紙但沒有工具——什麼都做不了。',price:'NT$550',spec:'膠囊 一瓶'},
    {name:'5R腸胃營養素',icon:'⚙️',iconBg:'rgba(24,95,165,0.12)',mechanism:'細胞再生',detail:'系統性的細胞再生支持方案，涵蓋細胞膜修復、粒線體功能恢復、DNA修復支持。不只是補充原料，而是啟動細胞的自我修復程序。',why:'真正的修復不是被動補充，而是主動啟動細胞的再生機制。',price:'NT$750',spec:'一包6g / 30包一袋'},
    {name:'潤節晶',icon:'🦴',iconBg:'rgba(24,95,165,0.12)',mechanism:'結締組織修復',detail:'針對關節、韌帶、軟骨等結締組織的修復配方，提供膠原蛋白合成所需的關鍵營養素，同時支持透明質酸的生成，維持關節液的黏度和潤滑功能。',why:'關節和結締組織的修復需要長期穩定的營養支持，潤節晶是最直接的靶向方案。',price:'NT$580',spec:'膠囊 一瓶150粒'},
  ],
};

let selectedSystems=[],diagAnswers={},currentPhase='select';

function initGrid(){
  const grid=document.getElementById('sys-grid');
  SYSTEMS.forEach(sys=>{
    const card=document.createElement('div');
    card.className='sys-card';card.dataset.id=sys.id;
    card.innerHTML=`<span class="sys-icon">${sys.icon}</span><div class="sys-name">${sys.name}</div><div class="sys-tagline">${sys.tagline}</div>`;
    card.onclick=()=>toggleSystem(sys.id,card);
    grid.appendChild(card);
  });
}

function toggleSystem(id,card){
  const idx=selectedSystems.indexOf(id);
  if(idx===-1){selectedSystems.push(id);card.classList.add('selected');}
  else{selectedSystems.splice(idx,1);card.classList.remove('selected');}
  document.getElementById('sel-count').textContent=selectedSystems.length+' / 10';
  document.getElementById('btn-to-diag').disabled=selectedSystems.length===0;
  updateProgress();
}

function updateProgress(){
  const pct=currentPhase==='select'?10:currentPhase==='diag'?50:100;
  document.getElementById('progress').style.width=pct+'%';
}

function goPhase(phase){
  document.querySelectorAll('.phase').forEach(p=>p.classList.remove('active'));
  document.getElementById('phase-'+phase).classList.add('active');
  currentPhase=phase;updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
}

document.getElementById('btn-to-diag').onclick=()=>{buildDiagForm();goPhase('diag');};

function buildDiagForm(){
  const container=document.getElementById('diag-content');container.innerHTML='';
  selectedSystems.forEach(sysId=>{
    const sys=SYSTEMS.find(s=>s.id===sysId);
    const qs=QUESTIONS[sysId];
    const sec=document.createElement('div');sec.className='diag-section';
    sec.innerHTML=`<div class="diag-sys-header"><span style="font-size:20px">${sys.icon}</span><span class="diag-sys-name">${sys.name}</span><span class="diag-sys-formula">${sys.formula}</span></div>`;
    const qList=document.createElement('div');qList.className='questions-list';
    qs.forEach((q,qi)=>{
      const key=sysId+'_'+qi;
      const item=document.createElement('div');item.className='q-item';
      const opts=q.opts.map((opt,oi)=>`<button class="q-opt" onclick="selectOpt(this,'${key}',${oi})">${opt}</button>`).join('');
      item.innerHTML=`<div class="q-text">${q.q}</div><div class="q-options">${opts}</div>`;
      qList.appendChild(item);
    });
    sec.appendChild(qList);container.appendChild(sec);
  });
}

function selectOpt(btn,key,val){
  btn.closest('.q-options').querySelectorAll('.q-opt').forEach(b=>b.classList.remove('selected-opt'));
  btn.classList.add('selected-opt');diagAnswers[key]=val;
}

function calcScore(sysId){
  const qs=QUESTIONS[sysId];let total=0,count=0;
  qs.forEach((q,qi)=>{const key=sysId+'_'+qi;if(diagAnswers[key]!==undefined){total+=diagAnswers[key];count++;}});
  if(count===0)return 75;
  return Math.round(100-(total/count/3)*75);
}

function showResult(){
  const container=document.getElementById('result-content');container.innerHTML='';
  const scores=selectedSystems.map(id=>({id,score:calcScore(id)}));
  const avgScore=Math.round(scores.reduce((a,b)=>a+b.score,0)/scores.length);
  const dashOffset=Math.round(226*(1-avgScore/100));
  const scoreColor=avgScore>=75?'#3B6D11':avgScore>=50?'#B8860B':'#A32D2D';
  const scoreLabel=avgScore>=75?'狀態良好':avgScore>=50?'需要關注':'需要修復';
  const scoreDesc=avgScore>=75?'整體狀態不錯，以下方案幫你維持巔峰':avgScore>=50?'部分系統出現訊號，及早干預效果最好':'多個系統需要支持，系統性修復方案如下';

  container.innerHTML=`
    <div class="result-header">
      <div class="result-score-ring">
        <svg viewBox="0 0 90 90"><circle cx="45" cy="45" r="36" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/><circle cx="45" cy="45" r="36" fill="none" stroke="${scoreColor}" stroke-width="6" stroke-dasharray="226" stroke-dashoffset="${dashOffset}" stroke-linecap="round" transform="rotate(-90 45 45)"/></svg>
        <div class="result-score-num">${avgScore}</div>
      </div>
      <div class="result-title">${scoreLabel}</div>
      <div class="result-desc">${scoreDesc}</div>
    </div>
    <div id="sys-scores"></div>
    <div id="reco-list"></div>
  `;

  const grid=document.createElement('div');grid.className='system-result-grid';
  scores.forEach(({id,score})=>{
    const sys=SYSTEMS.find(s=>s.id===id);
    const barClass=score>=75?'bar-good':score>=50?'bar-warn':'bar-danger';
    const status=score>=75?'✓ 狀態穩定':score>=50?'⚠ 需要關注':'⚡ 優先修復';
    const statusColor=score>=75?'#3B6D11':score>=50?'#B8860B':'#A32D2D';
    const card=document.createElement('div');card.className='sys-result-card';
    card.innerHTML=`<div class="sys-result-label"><span>${sys.icon}</span>${sys.name}</div><div class="sys-result-score">${score}<span style="font-size:13px;color:#999;font-weight:400">/100</span></div><div class="sys-result-bar-wrap"><div class="sys-result-bar ${barClass}" style="width:0%" data-score="${score}"></div></div><div class="sys-result-status" style="color:${statusColor}">${status}</div>`;
    grid.appendChild(card);
  });
  document.getElementById('sys-scores').appendChild(grid);

  const recoContainer=document.getElementById('reco-list');
  const sortedScores=[...scores].sort((a,b)=>a.score-b.score);
  sortedScores.forEach(({id,score})=>{
    const sys=SYSTEMS.find(s=>s.id===id);
    const nutrients=NUTRIENTS[id]||[];
    const urgency=score<50?'優先修復':score<75?'重點補充':'日常維持';
    const urgClass=score<50?'urg-critical':score<75?'urg-important':'urg-support';
    const sec=document.createElement('div');sec.className='reco-section';
    sec.innerHTML=`<div class="reco-sys-header"><span>${sys.icon}</span>${sys.name} 修復方案<span class="urgency-badge ${urgClass}">${urgency}</span></div><div class="nutrient-cards"></div>`;
    const cards=sec.querySelector('.nutrient-cards');
    nutrients.forEach((nut,ni)=>{
      const cardId=id+'_nut_'+ni;
      const card=document.createElement('div');card.className='nutrient-card';
      card.innerHTML=`
        <div class="nutrient-card-top" onclick="toggleDetail('${cardId}')">
          <div class="nut-icon" style="background:${nut.iconBg}">${nut.icon}</div>
          <div class="nut-info">
            <div class="nut-name">${nut.name}</div>
            <div class="nut-mechanism">${nut.mechanism}</div>
            <div class="nut-price-tag">${nut.price} · ${nut.spec}</div>
          </div>
          <span class="expand-hint">▾</span>
        </div>
        <div class="nutrient-detail" id="${cardId}">
          <div class="mech-box"><div class="mech-title">作用機制</div><div class="mech-text">${nut.detail}</div></div>
          <div class="why-need"><div class="why-title">為什麼你現在需要它</div><div class="why-text">${nut.why}</div></div>
          <div class="buy-block">
            <div class="buy-info">
              <div class="buy-product-name">${nut.name}</div>
              <div class="buy-price">${nut.price}</div>
              <div class="buy-spec">${nut.spec}</div>
              <div class="buy-store">📦 7-11 賣貨便取貨付款</div>
            </div>
            <a class="btn-buy" href="${SHOP_URL}" target="_blank" rel="noopener">立即購買 →</a>
          </div>
        </div>`;
      cards.appendChild(card);
    });
    recoContainer.appendChild(sec);
  });

  goPhase('result');
  setTimeout(()=>{
    document.querySelectorAll('.sys-result-bar').forEach(bar=>{
      bar.style.width=bar.dataset.score+'%';
    });
  },300);
}

function toggleDetail(id){
  const el=document.getElementById(id);
  el.classList.toggle('open');
  const hint=el.previousElementSibling.querySelector('.expand-hint');
  if(hint)hint.textContent=el.classList.contains('open')?'▴':'▾';
}

function restart(){
  selectedSystems=[];diagAnswers={};
  document.querySelectorAll('.sys-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('sel-count').textContent='0 / 10';
  document.getElementById('btn-to-diag').disabled=true;
  goPhase('select');
}

initGrid();updateProgress();
</script>
</body>
</html>
