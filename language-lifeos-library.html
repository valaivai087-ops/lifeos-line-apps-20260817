# 【LifeOS｜語言改變命運】八大BANK｜語言更新實戰版
核心原則：
改變語言→更新認知→改變選擇→採取行動→驗證結果→更新人生模式。

## 01｜找出真正問題｜系統瓶頸辨識BANK
核心問題：真正卡住我的是什麼？
舊語言：我就是沒用。
新語言：目前哪個環節需要改善？
智慧：問題不等於人格。
能力：問題定義力、根因分析力。
策略：停止自責，找出最大瓶頸。
行動：寫出「現況→目標→最大差距」。
驗證：是否找到一個可改善的關鍵問題？

## 02｜把知道變成做到｜能力遷移驗證BANK
核心問題：學到的道理能不能實際使用？
舊語言：我已經知道很多。
新語言：我能在現實中做到嗎？
智慧：知道不等於能力。
能力：知行轉化力、實踐力。
策略：每學一個原理，就做一次實驗。
行動：在新情境應用一項知識。
驗證：能否不靠提示，獨立完成？

## 03｜失敗後重新開始｜系統恢復力BANK
核心問題：中斷後如何重新啟動？
舊語言：我又失敗了，乾脆放棄。
新語言：現在可以重新開始哪一步？
智慧：中斷不等於結束。
能力：情緒調節力、恢復力。
策略：建立五分鐘重啟機制。
行動：立即完成一個五分鐘任務。
驗證：重新開始的時間是否縮短？

## 04｜先控制風險｜決策可逆性BANK
核心問題：能不能先安全地測試？
舊語言：我絕對不能失敗。
新語言：如何降低試錯成本？
智慧：重要決策要保留調整空間。
能力：決策力、風險管理力。
策略：先設定損失上限與退出條件。
行動：設計一個低風險的小實驗。
驗證：是否在可承受的風險內取得資訊？

## 05｜淘汰錯誤信念｜認知模型淘汰BANK
核心問題：我相信的事情真的正確嗎？
舊語言：我一直都是這樣。
新語言：什麼證據能改變我的看法？
智慧：信念可以修正，不必固守。
能力：元認知力、批判思考力。
策略：尋找反證，檢查舊信念。
行動：修正一個不符合證據的想法。
驗證：是否因新證據改變判斷？

## 06｜看見背後的系統｜跨系統連鎖反應BANK
核心問題：哪些因素共同影響結果？
舊語言：事情就是突然變成這樣。
新語言：背後有哪些因果與回饋關係？
智慧：不要只看單一事件。
能力：系統思維力、因果分析力。
策略：找出影響最大的關鍵節點。
行動：畫出「語言→情緒→決策→行動→結果」。
驗證：是否找到值得優先改善的節點？

## 07｜讓行動更容易｜注意力摩擦管理BANK
核心問題：如何看得更全面、開始得更容易？
舊語言：我只看到失敗，根本做不到。
新語言：我忽略了什麼？第一步怎麼做？
智慧：注意力不等於全部真相。
能力：注意力調節力、執行力。
策略：補充反證、移除行動阻力。
行動：找出一項被忽略的資訊，移除一個干擾。
驗證：開始行動是否更快？

## 08｜建立長期複利｜人生系統維護成本BANK
核心問題：什麼方法能長期維持？
舊語言：我要一次改變全部人生。
新語言：今天能累積哪個小進步？
智慧：持續的小進步比短暫熱情更可靠。
能力：習慣設計力、長期整合力。
策略：保留高價值、低負擔的行動。
行動：每天改寫一句話，完成一個小任務。
驗證：14天後是否仍能持續？

06｜看系統：不要只看單點，分析連鎖。
07｜減阻力：不要硬撐，改善環境。
08｜能持續：不要貪多，累積小進步。

## 最終核心金句
「不要用語言替自己判刑，要用語言幫自己找出下一步。」
「語言更新不是否認現實，而是讓自己更有能力面對現實。」

# 《語言就是命運》｜LifeOS 認知更新系統｜一頁式核心總覽
**核心命題：語言影響認知，認知影響行動；持續更新語言與行動，可能逐步改變人生軌跡。**

## 一、四大認知迴路
### 01｜語言輸出
本質：自我描述與信念表達。
風險：負面標籤變成固定身分。
智慧：描述事實，不定義人格。
能力：語言覺察力。
行動：把「我沒用」改成「這次哪裡沒做好？」
### 02｜注意力鎖定
本質：信念影響注意力分配。
風險：只注意失敗、拒絕與批評。
智慧：注意力不等於全部真相。
能力：注意力調節力。
行動：尋找一個被忽略的事實。
### 03｜證據篩選
本質：確認偏誤與選擇性解釋。
風險：只接受支持舊信念的證據。
智慧：反證是認知更新的入口。
能力：證據評估力。
行動：找出一個反例或替代解釋。
### 04｜模型強化
本質：反覆解釋可能強化原有信念。
風險：固定思維、逃避行動。
智慧：信念需要接受現實驗證。
能力：模型更新力。

↓ 07 習慣｜哪些行動被反覆強化

最重要的不是「說好話就會有好命」，而是「說出更準確、更有行動可能性的話，讓自己更容易做出有效選擇」。
例如：「我英文很爛」可能讓人迴避練習。改成「我目前閱讀速度慢，先練每天10分鐘」，就把問題從固定身分轉成可改善的能力。當練習真的產生成果，新的信念才有更穩固的證據支持。

## 四、改變語言最有槓桿的八大方法
### 01｜身分語言 → 行為語言
舊：我就是沒用。 新：我這次沒有達成目標，需要調整方法。
最小行動：把「我是……」改成「我這次做了……」。｜生成能力：自我認知、情緒調節
### 02｜絕對語言 → 機率語言
舊：我永遠不會成功。 新：我目前還沒有成功，需要找出阻礙。

### 03｜抱怨語言 → 問題語言
舊：事情真的很糟。 新：目前最大的問題是什麼？

舊：我完全沒有辦法。 新：在現有限制下，我能控制哪一步？
最小行動：區分可控制、可影響、不可控制。｜生成能力：自主決策、界線管理
### 05｜恐懼語言 → 準備語言

舊：我怎麼又犯錯？ 新：這次錯誤提供了什麼資訊？

### 07｜空泛鼓勵 → 行動語言
舊：我要變得更好。 新：今天晚上完成15分鐘練習。
最小行動：寫出時間、地點、動作、完成標準。｜生成能力：執行力、習慣設計
### 08｜固定信念 → 更新語言
舊：我一直認為這是對的。 新：目前證據支持到什麼程度？
最小行動：每週檢查一個舊信念。｜生成能力：元認知、貝葉斯更新

## 五、語言改變命運的三個層次
第一層｜改變語句：不再使用過度絕對、否定人格、無法驗證的說法。
第二層｜改變認知模型：重新理解問題、證據、原因、選擇與責任。
第三層｜改變現實行動：練習新行為、獲得新回饋、建立新習慣。
例如，學生從「我英文不好」改成「我每天練五個易混字」，真正改變成績的不是語句本身，而是語句讓學習任務變得具體，促成有效練習與修正。

## 九、20句可以反覆練習的核心金句
以下是依據圖檔理念重新創作的行動金句，不是原作者引言。
01｜語言是認知的入口，行動才是現實的出口。
02｜不要用一次失敗，替整個人生下定義。

07｜情緒值得被理解，但不必替代事實。
08｜你的想法可以被尊重，也可以被證據修正。
09｜把「永遠」改成「目前」，把「沒救」改成「下一步」。

18｜新語言需要新證據，新證據需要新實踐。

20｜最高階的語言智慧，是說出更接近事實、也更有助於行動的話。

## 十、最後總結｜改變命運的真正公式
**語言 → 認知 → 選擇 → 行動 → 習慣 → 人生軌跡**
最重要的三個轉變：舊標籤 → 新描述｜舊信念 → 新證據｜舊反應 → 新行動
改變語言，不等於立刻改變命運；但當語言改變了你理解現實的方式，讓你開始採取不同的行動，並持續用證據修正自己，就有可能逐步改變人生的方向。

06｜我就是失敗者 → 我曾經失敗，但那不是我的全部。

### 02｜絕對化BANK｜永遠、全部、一定 → 有範圍的事實
07｜我永遠做不到 → 我目前還沒做到。
08｜每個人都討厭我 → 我與某些人的關係需要釐清。

### 06｜過度自責BANK｜全部怪自己 → 合理責任
31｜都是我的錯 → 我要釐清每個因素與責任。
32｜別人不開心就是我不好 → 別人的情緒不完全由我負責。
33｜我不該犯錯 → 我可以犯錯，也需要學習修正。

智慧：行動不必完美，但需要可執行。｜能力：啟動力、執行力、持續改善。｜最小行動：完成一件五分鐘內可做的小事。

# 【LifeOS｜語言重構 × 14種模式】
歷史資料回收版｜語言重塑 × 認知更新 × 人格成長 × 行動驗證
已找回你在2026年5月確認、8月再次沿用的14種語言重構模式。另外，2026年3月曾使用另一套NLP換框分類；以下以你後來確認的版本為主，避免混用兩套名稱。
核心理念：語言不只是表達想法，也會影響我們如何分類問題、理解事件、預測未來與選擇行動。

## 一、14種模式完整總表
| 模式 | 本質與最大槓桿 | 舊語言 → 新語言 |
| 01 意圖重構 | 區分行為與可能意圖 | 他在批評我 → 他可能在指出可改善之處 |

| 04 因果重構 | 從單一歸因轉向因果分析 | 都是他害的 → 還有哪些因素影響結果？ |
| 05 時間框 | 區分暫時狀態與永久結論 | 我永遠做不到 → 我目前還做不到 |
| 06 視角轉換 | 從單一立場走向多角度 | 他怎麼這麼討厭 → 他可能如何理解這件事？ |
| 07 反例破框 | 用反證檢查絕對信念 | 我每次都失敗 → 有沒有一次比較成功？ |
| 08 類比重構 | 用熟悉經驗理解困難 | 這太難了 → 像學騎車，需要分階段練習 |
| 09 條件拆解 | 將模糊問題拆成具體條件 | 我很差 → 我是哪一項能力需要補強？ |
| 10 可能性擴展 | 增加可選方案 | 沒有辦法 → 還有哪些方法可以試？ |
| 11 權重調整 | 重新排列價值與優先順序 | 這件事最重要 → 它比長期健康更重要嗎？ |
| 12 身分升級 | 從固定標籤走向可發展身分 | 我不是這種人 → 我可以逐步培養這種能力 |
| 13 責任回收 | 找回自己可控制的部分 | 都是環境問題 → 我能調整哪一個部分？ |
| 14 資源轉換 | 從資源不足轉向資源創造 | 我沒有資源 → 我可以向誰求助或如何取得？ |
總公式：舊語言 → 換框 → 新理解 → 新選擇 → 最小行動 → 現實回饋 → 模型更新。

## 二、14種模式｜智慧、能力、策略、最小行動
### 01｜意圖重構
智慧：不把別人的行為直接等同惡意。｜能力：理解他人、降低防衛。
策略：區分事實、行為、可能意圖。｜行動：提出兩種可能解釋，再確認事實。
### 02｜重新定義
智慧：一次結果不等於整個人的價值。｜能力：認知彈性、經驗轉化。
策略：把人格標籤改成可分析的事件。｜行動：寫出這次失敗提供的一項資訊。
### 03｜結果框架
智慧：只描述不想要的事，還不足以找到方向。｜能力：目標設定、解題。
策略：把抱怨改成具體期待。｜行動：完成「我真正想達成的是＿＿」。
### 04｜因果重構
智慧：複雜結果通常不只一個原因。｜能力：系統分析、因果辨識。
策略：區分可控、不可控與尚未確認的因素。｜行動：列出三項可能原因，找證據驗證。
### 05｜時間框
智慧：現在的狀態，不等於永久的命運。｜能力：長期思考、耐心。
策略：加入「目前、這一次、下一階段」。｜行動：把一個「永遠」改成有時間範圍的描述。
### 06｜視角轉換
智慧：理解不同立場，不代表必須認同。｜能力：同理、溝通、界線。
策略：同時檢查自己與對方的視角。｜行動：寫出對方可能看見、自己沒看見的資訊。
### 07｜反例破框
智慧：一個反例就能挑戰「永遠、全部、一定」。｜能力：批判思考、證據檢查。
策略：尋找不符合原信念的事實。｜行動：找出一個例外，修正絕對化語句。
### 08｜類比重構
智慧：陌生困難可透過熟悉經驗理解。｜能力：類比、知識遷移。
策略：找出相似結構及不同限制。｜行動：用一個生活例子解釋目前的困難。
### 09｜條件拆解
智慧：模糊問題很難解，具體問題才容易處理。｜能力：問題拆解、精準學習。
策略：拆成知識、技能、環境、資源等條件。｜行動：選出一個最優先補強的缺口。
### 10｜可能性擴展
智慧：第一個方法失敗，不代表沒有其他選項。｜能力：創造力、方案設計。
策略：至少產生三個可行方案。｜行動：選一個成本低、風險可控的方法測試。
### 11｜權重調整
智慧：重要的事，也需要排序。｜能力：優先決策、價值判斷。
策略：比較短期收益與長期代價。｜行動：寫下今天最值得投入的一件事。
### 12｜身分升級
智慧：人格標籤不必限制未來的能力發展。｜能力：自我成長、角色轉換。
策略：把「我是誰」連結到可培養的行為。｜行動：做一件符合目標身分的小事。
### 13｜責任回收
智慧：負責不等於自責，更不等於替別人承擔過錯。｜能力：自主性、界線、行動力。
策略：找回自己真正能影響的部分。｜行動：列出一項可控制的下一步。
### 14｜資源轉換
智慧：資源不只有金錢，也包括時間、知識、人脈與支持。｜能力：資源整合、求助。
策略：盤點現有資源與缺口。｜行動：提出一個具體求助或資源交換請求。

## 三、14種模式互動練習
（可到「實作工具」頁的「14種模式練習」選模式、看範例並填寫）
參考範例｜01 意圖重構：舊：他在批評我。新：他可能在指出需要改善的地方，但我要先確認他的意思。行動：詢問對方希望我具體調整什麼。

## 四、與你過去「語言重構母模型」整合
你後來又將14種換框提升為更完整的認知更新系統：
事件 → 語言命名 → 分類 → 解讀 → 預測 → 情緒 → 選擇 → 行動 → 現實回饋 → 預測誤差 → 重新分類 → 模型更新。
其中最重要的進步，是不再停留於「把負面句子改成正面句子」，而是要求新語言必須：
- 符合事實，不否認真實困難。
- 增加理解，不只是安慰自己。
- 創造選項，不停留於口號。
- 引導行動，能在現實中測試。
- 接受回饋，必要時修正甚至淘汰舊模型。
一句話總結：**語言重構不是把困難說成美好，而是把困難說得更準確，讓自己看見原本忽略的選擇。**
這14種模式可作為整套「語言重塑命運與造就生命OS」的核心技巧庫，再延伸到高中生學習、癌友心理支持、家庭關係與造就人的話語。

## 四、語言重塑的科學與信仰邊界
過去你使用過「語言編程大腦」「語言生成現實」「改寫命運機率」等概念。這些適合作為教學比喻，但應與經過研究的心理機制區分。
目前研究支持：自我對話方式可能影響壓力調節；認知重評與心理恢復力具有正向關聯；語言與認知控制也存在關係。但這些研究不能證明語言能直接控制外界事件、疾病結果或命運。（來源：PubMed 等）
因此，整套LifeOS最適合採用的核心表述是：
> 「語言是認知與行動的調節工具，不是決定所有現實的魔法。」

# "Language Is Destiny" | A Complete Analysis from Language Loops to Life Change
Core proposition: The language you use repeatedly affects how you see yourself, what you notice, how you interpret events and what you do next. Over time, these choices may change the course of your life.
But first we must be clear: language is not magic, and one sentence alone cannot decide destiny. What truly has the power to change is language guiding cognition, cognition affecting action, and action continually changing reality.

## 1. The Diagram Explained | Four Cognitive Loops
The diagram shows a cycle:
01 | Language output: "Nobody likes me anyway; I'm just useless."
↓ 02 | Attention lock: Paying special attention to signs of rejection, criticism and failure
↓ 03 | Evidence filtering: Remembering what supports the negative belief and ignoring evidence that doesn't fit
↓ 04 | Model reinforcement: "See? I really am that kind of person."
↺ The same language is produced again, forming a self-reinforcing loop
The most valuable point of this diagram is the reminder that language doesn't only describe what has happened; it may also help shape the next round of cognition and choice.
However, the four steps are an inspiring integrative model, not a fixed neuroscience law that everyone must follow.
### The Essence of the Four Nodes
| Node | Underlying Cognitive Mechanism | Biggest Risk | Change Strategy |
| 01 Language output | Self-talk, cognitive appraisal | Defining one failure as a permanent identity | Rewrite it as a specific, correctable description |
| 02 Attention lock | Selective attention | Noticing only threats and shortcomings | Actively seek complete information |
| 03 Evidence filtering | Confirmation bias, interpretation bias | Accepting only evidence that supports the original belief | Look for counter-examples and alternative explanations |
| 04 Model reinforcement | Belief updating, habit learning | Making negative beliefs more rigid | Re-verify with new actions and results |

## 2. Why Changing Language May Change Destiny
01 Language | How I describe myself and the world
↓ 02 Cognition | Which explanations I believe
↓ 03 Attention | Which signals I notice
↓ 04 Emotion | How I feel about and evaluate events
↓ 05 Decision | What choices I think I have
↓ 06 Action | What I actually do
↓ 07 Habit | Which actions are repeatedly reinforced
↓ 08 Result | What changes gradually appear in reality
The most important thing isn't "say nice words and you'll have a good life," but "say more accurate, more actionable words so it's easier to make effective choices."
For example: "My English is terrible" may lead someone to avoid practice. Changing it to "My reading speed is slow right now, so I'll practice 10 minutes a day" turns the problem from a fixed identity into an improvable skill. When practice really produces results, the new belief has firmer evidence behind it.

function highlight(root,term){if(!term)return;const tl=term.toLowerCase();const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
 nodes.forEach(n=>{const t=n.nodeValue,lo=t.toLowerCase();if(!lo.includes(tl))return;const f=document.createDocumentFragment();let p=0,k;while((k=lo.indexOf(tl,p))>-1){f.appendChild(document.createTextNode(t.slice(p,k)));const mk=document.createElement('mark');mk.textContent=t.slice(k,k+tl.length);f.appendChild(mk);p=k+tl.length}f.appendChild(document.createTextNode(t.slice(p)));n.parentNode.replaceChild(f,n)})}

function render(){
 const term=q.value.trim();drawNav();
 if(term){
  const terms=term.toLowerCase().split(/\s+/);let html='',n=0;
  DOCS.forEach(d=>{const hits=d.secs.filter(s=>terms.every(t=>s.low.includes(t)));if(!hits.length)return;n+=hits.length;
   html+='<div class="doc"><div class="doctitle">'+esc(d.title)+'｜'+esc(ENT[d.id])+'｜'+hits.length+'</div>'+hits.map(s=>md(s.pairs)).join('<hr>')+'</div>'});
  main.innerHTML=html||'<div class="empty">找不到「'+esc(term)+'」 No results.</div>';
  hint.textContent=n?'共找到 '+n+' 個段落 Found '+n+' sections（多個關鍵字用空白分隔 separate keywords with spaces）':'';
  terms.forEach(t=>highlight(main,t));return}
 hint.textContent='';
 if(active==='tools'){renderTools();return}
 const d=DOCS.find(x=>x.id===active);
 main.innerHTML='<div class="doc">'+md(d.pairs)+'</div>';
}
let tm;q.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(render,150)});
document.addEventListener('keydown',e=>{const tg=document.activeElement.tagName;if(e.key==='/'&&tg!=='INPUT'&&tg!=='TEXTAREA'&&tg!=='SELECT'){e.preventDefault();q.focus()}if(e.key==='Escape'){stopSpeak();if(document.activeElement===q){q.value='';render()}}});

// theme & display mode
const th=store.get('theme','');if(th)document.documentElement.dataset.theme=th;
$('#theme').onclick=()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;const v=dark?'light':'dark';document.documentElement.dataset.theme=v;store.set('theme',v)};
const modeSel=$('#mode');modeSel.value=store.get('mode','bi');
const applyMode=()=>{document.body.classList.remove('m-zh','m-en');if(modeSel.value!=='bi')document.body.classList.add('m-'+modeSel.value);store.set('mode',modeSel.value)};
modeSel.onchange=applyMode;applyMode();

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function copy(text){const ok=()=>toast('已複製 Copied');if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(ok,()=>fb())}else fb();function fb(){const a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('複製失敗 Copy failed')}a.remove()}}

// ---------- English speech (built-in browser voices, no API) ----------
const synth=window.speechSynthesis;const rateSel=$('#rate'),voiceSel=$('#voice');
rateSel.value=String(store.get('rate','1'));rateSel.onchange=()=>store.set('rate',rateSel.value);
let voices=[];
function loadVoices(){if(!synth)return;voices=synth.getVoices().filter(v=>/^en/i.test(v.lang));const saved=store.get('voice','');
 voiceSel.innerHTML=voices.length?voices.map(v=>'<option value="'+esc(v.name)+'"'+(v.name===saved?' selected':'')+'>'+esc(v.name.replace(/Microsoft |Google /,''))+' ('+v.lang+')</option>').join(''):'<option>預設英文聲音 Default</option>';
 if(!saved){const us=voices.findIndex(v=>v.lang==='en-US');if(us>-1)voiceSel.selectedIndex=us}}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices}else{['readAll','voice','rate'].forEach(id=>$('#'+id).disabled=true);$('#readAll').textContent='此瀏覽器不支援朗讀 Speech not supported'}
voiceSel.onchange=()=>store.set('voice',voiceSel.value);
function clean(t){return t.replace(/[→↓↺]/g,', ').replace(/≠/g,' is not ').replace(/ × /g,', ').replace(/[｜|]/g,', ').replace(/_{2,}/g,' blank ').replace(/[①②③④⑤⑥⑦⑧□☐☑]/g,' ').replace(/\s+/g,' ').trim()}
let queue=[],cur=null;
function stopSpeak(){queue=[];if(synth)synth.cancel();if(cur)cur.classList.remove('speaking');cur=null}
function speakEl(el,next){if(!synth)return;if(cur)cur.classList.remove('speaking');cur=el;el.classList.add('speaking');
 const u=new SpeechSynthesisUtterance(clean(el.textContent));u.lang='en-US';u.rate=+rateSel.value;const v=voices.find(x=>x.name===voiceSel.value);if(v)u.voice=v;
 u.onend=u.onerror=()=>{el.classList.remove('speaking');if(cur===el)cur=null;if(next)next()};synth.speak(u)}
function playQueue(){const el=queue.shift();if(!el)return;el.scrollIntoView({block:'center',behavior:'smooth'});speakEl(el,playQueue)}
main.addEventListener('click',e=>{const el=e.target.closest('.en');if(!el||e.target.closest('a'))return;stopSpeak();speakEl(el)});
$('#readAll').onclick=()=>{stopSpeak();if(document.body.classList.contains('m-zh')){toast('請先切換到雙語或英文 Switch to bilingual/English first');return}queue=[...main.querySelectorAll('.en')].filter(x=>x.offsetParent);if(!queue.length){toast('本頁沒有英文 No English here');return}playQueue()};
$('#stop').onclick=stopSpeak;

// ---------- tools ----------
const MODES=[['01 意圖重構 Intention reframing','他在批評我 He\'s criticizing me','他可能在指出需要改善的地方，但我要先確認他的意思。He may be pointing out something I need to improve, but I\'ll confirm what he means first.','詢問對方希望我具體調整什麼。Ask what specifically he\'d like me to adjust.'],['02 重新定義 Redefinition','我失敗了 I failed','我發現一個無效方法。I discovered a method that doesn\'t work.','寫出這次失敗提供的一項資訊。Write down one piece of information this failure gave you.'],['03 結果框架 Outcome frame','我就是不行 I just can\'t do it','我想建立哪項能力？Which ability do I want to build?','完成「我真正想達成的是＿＿」。Complete "What I really want to achieve is ___."'],['04 因果重構 Causal reframing','都是他害的 It\'s all his fault','還有哪些因素影響結果？What other factors affected the result?','列出三項可能原因，找證據驗證。List three possible causes and look for evidence.'],['05 時間框 Time frame','我永遠做不到 I\'ll never be able to do it','我目前還做不到。I can\'t do it yet.','把一個「永遠」改成有時間範圍的描述。Change one "always" into a description with a time range.'],['06 視角轉換 Perspective shift','他怎麼這麼討厭 Why is he so annoying','他可能如何理解這件事？How might he understand this?','寫出對方可能看見、自己沒看見的資訊。Write down what the other person may see that you don\'t.'],['07 反例破框 Counter-example breakout','我每次都失敗 I fail every time','有沒有一次比較成功？Was there a time it went better?','找出一個例外，修正絕對化語句。Find one exception and correct the absolute statement.'],['08 類比重構 Analogy reframing','這太難了 This is too hard','像學騎車，需要分階段練習。It\'s like learning to ride a bike; it takes stages.','用一個生活例子解釋目前的困難。Explain the difficulty with an everyday example.'],['09 條件拆解 Breaking down conditions','我很差 I\'m bad','我是哪一項能力需要補強？Which ability do I need to strengthen?','選出一個最優先補強的缺口。Choose the gap to strengthen first.'],['10 可能性擴展 Expanding possibilities','沒有辦法 There\'s no way','還有哪些方法可以試？What other methods can I try?','選一個成本低、風險可控的方法測試。Test one low-cost, controlled-risk method.'],['11 權重調整 Re-weighting','這件事最重要 This is the most important thing','它比長期健康更重要嗎？Is it more important than long-term health?','寫下今天最值得投入的一件事。Write down the one thing most worth investing in today.'],['12 身分升級 Identity upgrade','我不是這種人 I\'m not that kind of person','我可以逐步培養這種能力。I can gradually develop this ability.','做一件符合目標身分的小事。Do one small thing that fits your target identity.'],['13 責任回收 Reclaiming responsibility','都是環境問題 It\'s all the environment\'s fault','我能調整哪一個部分？Which part can I adjust?','列出一項可控制的下一步。List one next step you can control.'],['14 資源轉換 Resource conversion','我沒有資源 I have no resources','我可以向誰求助或如何取得？Who can I ask for help, or how can I get them?','提出一個具體求助或資源交換請求。Make one specific request for help or exchange.']];
const DAYS=[['記錄最常出現的三句自我對話','Record the three things you say to yourself most often'],['找出一句過度絕對的話','Find one overly absolute sentence'],['把人格標籤改成具體行為','Change a personality label into a specific behavior'],['辨識這句話引起的情緒','Identify the emotion this sentence triggers'],['找出支持與反對的證據','Find supporting and opposing evidence'],['寫出一個替代解釋','Write one alternative explanation'],['將新語言轉成一個最小行動','Turn the new language into one smallest action'],['在真實情境實踐','Practice it in a real situation'],['記錄行動結果','Record the result of the action'],['觀察注意力是否改變','Notice whether your attention has changed'],['辨識舊模式再次出現的情境','Identify situations where the old pattern shows up again'],['練習新的界線或選擇','Practice a new boundary or choice'],['比較原本預測與實際結果','Compare your original prediction with the actual result'],['建立自己的新語言與行動規則','Create your own new language and action rules']];
const FORMS={
 daily:{title:'LifeOS｜語言重塑每日實作卡 Daily Language Reshaping Card',fields:[['情境 Situation','text'],['01 事件：實際發生什麼？ Event: What actually happened?'],['02 舊語言：我原本怎麼說？ Old language: What did I originally say?'],['03 語言辨識 Language type','chips',['自我否定 Self-negation','絕對化 Absolute','宿命論 Fatalism','災難化 Catastrophizing','受害者語言 Victim','過度自責 Self-blame','匱乏語言 Scarcity','討好語言 People-pleasing','情緒壓抑 Suppression','停滯語言 Stagnation','責怪 Blaming','模糊 Vague']],['04 事實檢查：有哪些證據？有哪些反例？ Fact check: evidence and counter-examples?'],['05 新語言：如何說得更準確、更造就人？ New language: more accurate and life-building?'],['06 最小行動：現在可以做什麼？ Smallest action: what can I do now?'],['07 成果驗證：實際發生什麼改變？ Result: what actually changed?'],['08 模型更新 Model update','radio',['保留 Keep','調整 Adjust','繼續驗證 Keep testing','淘汰 Retire']]]},
 faith:{title:'LifeOS｜信仰語言更新卡 Faith Language Renewal Card',fields:[['01 今日事件 Today\'s event'],['02 我原本的想法或話語 My original thoughts or words'],['03 我的情緒與需要 My emotions and needs'],['04 對應經文與上下文 Scripture and its context'],['05 新的信仰語言 New faith language'],['06 今天的最小行動 Today\'s smallest action'],['07 實際結果與生命省察 Result and life reflection']]},
 relation:{title:'LifeOS｜關係與人格BANK｜語言重構紀錄 Relationship Reframing Record',fields:[['應用場景 Situation','radio',['師生溝通 Teacher–student','家庭關係 Family','伴侶溝通 Partners','癌友心理支持 Cancer support','團隊管理 Team','自我對話 Self-talk']],['事件 Event'],['原本想說的話 What I wanted to say'],['具體觀察 Specific observation'],['感受、需要與界線 Feelings, needs and boundaries'],['造就人的新語言與下一步 New life-building language and next step'],['六項品質檢核 Six quality checks','chips',['保留人格尊嚴 Preserves dignity','降低不必要的防衛 Lowers defensiveness','增加可驗證的資訊 Adds verifiable info','清楚表達責任與界線 States responsibility and boundaries','提供可行下一步 Offers a next step','允許回饋與修正 Allows feedback']]]},
 mode:{title:'LifeOS｜14種模式練習紀錄 14 Modes Practice',fields:[['重構模式 Reframing mode','select',MODES.map(m=>m[0])],['我的舊語言 My old language'],['重新改寫的語言 My rewritten language'],['下一個最小行動 Next smallest action']]}
};
function formHTML(key){const f=FORMS[key];const draft=store.get('draft-'+key,{});
 return '<div class="tool" data-form="'+key+'"><h2>'+esc(f.title)+'</h2>'+(key==='mode'?'<div id="modeEx" class="log"></div>':'')+f.fields.map((x,i)=>{const [lab,type,opts]=x;const v=draft[i];
  if(type==='chips'||type==='radio'){const arr=Array.isArray(v)?v:(v?[v]:[]);return '<label>'+esc(lab)+(type==='chips'?' <span style="font-weight:400;color:var(--sub)" data-cnt="'+i+'"></span>':'')+'</label><div class="chips">'+opts.map(o=>'<label><input type="'+(type==='chips'?'checkbox':'radio')+'" name="'+key+i+'" value="'+esc(o)+'" data-i="'+i+'"'+(arr.includes(o)?' checked':'')+'> '+esc(o)+'</label>').join('')+'</div>'}
  if(type==='select')return '<label>'+esc(lab)+'</label><select data-i="'+i+'" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit">'+opts.map(o=>'<option'+(v===o?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
  if(type==='text')return '<label>'+esc(lab)+'</label><input type="text" data-i="'+i+'" value="'+esc(v||'')+'">';
  return '<label>'+esc(lab)+'</label><textarea data-i="'+i+'">'+esc(v||'')+'</textarea>'}).join('')+
  '<button class="btn" data-act="copy">複製紀錄 Copy</button><button class="btn ghost" data-act="save">儲存 Save</button><button class="btn ghost" data-act="clear">清空 Clear</button><div class="logs"></div></div>'}
function readForm(el){const key=el.dataset.form,f=FORMS[key],vals={};f.fields.forEach((x,i)=>{const [,type]=x;if(type==='chips')vals[i]=[...el.querySelectorAll('input[data-i="'+i+'"]:checked')].map(c=>c.value);else if(type==='radio'){const c=el.querySelector('input[data-i="'+i+'"]:checked');vals[i]=c?c.value:''}else{const c=el.querySelector('[data-i="'+i+'"]');vals[i]=c?c.value:''}});return vals}
function toText(key,vals){const f=FORMS[key];const d=new Date();return '【'+f.title+'】\n日期 Date：'+d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+'\n'+f.fields.map((x,i)=>{const v=vals[i];return x[0]+'：'+(Array.isArray(v)?(key==='relation'?v.length+'/6 ':'')+v.join('、'):v)}).join('\n')}
function drawLogs(el){const key=el.dataset.form;const logs=store.get('logs-'+key,[]);el.querySelector('.logs').innerHTML=logs.length?'<h4>已儲存紀錄 Saved（'+logs.length+'）</h4>'+logs.map((t,i)=>'<div class="log">'+esc(t)+'\n<button class="btn ghost" style="margin-top:6px;padding:4px 10px;font-size:13px" data-del="'+i+'">刪除 Delete</button> <button class="btn ghost" style="margin-top:6px;padding:4px 10px;font-size:13px" data-cp="'+i+'">複製 Copy</button></div>').join(''):''}
function updateExtras(el){const key=el.dataset.form;if(key==='mode'){const s=el.querySelector('select').value;const m=MODES.find(x=>x[0]===s);el.querySelector('#modeEx').innerHTML='參考範例 Example｜'+esc(m[0])+'<br>舊 Old：'+esc(m[1])+'<br>新 New：'+esc(m[2])+'<br>行動 Action：'+esc(m[3])}
 el.querySelectorAll('[data-cnt]').forEach(c=>{const n=el.querySelectorAll('input[data-i="'+c.dataset.cnt+'"]:checked').length;c.textContent=key==='relation'?n+'/6 符合判準 criteria met':''})}

function renderTools(){
 const done=store.get('days',[]);
 main.innerHTML='<div class="tool"><h2><span class="zh">14天認知語言更新</span><span class="en">14-Day Cognitive Language Update</span></h2><div id="prog"></div><div class="bar"><i id="pbar"></i></div>'+DAYS.map((t,i)=>'<label class="day'+(done.includes(i)?' done':'')+'"><input type="checkbox" data-day="'+i+'"'+(done.includes(i)?' checked':'')+'><span><span class="zh">D'+(i+1)+'｜'+esc(t[0])+'</span><span class="en">Day '+(i+1)+': '+esc(t[1])+'</span></span></label>').join('')+
  '<button class="btn" id="cpDays">複製LINE訓練表 Copy for LINE</button><button class="btn ghost" id="rsDays">重新開始 Reset</button><p style="font-size:14px;margin-top:10px"><span class="zh" style="color:var(--sub)">兩週回饋：哪一句舊語言最常出現？哪一句新語言最有幫助？哪個行動真的改變了？哪項結果可以被驗證？下一輪要保留、修正或淘汰什麼？</span><span class="en">Two-week feedback: Which old sentence appeared most often? Which new sentence helped most? Which action really changed? Which result can be verified? What will you keep, revise or retire next round?</span></p></div>'+
  formHTML('daily')+formHTML('mode')+formHTML('relation')+formHTML('faith');
 const prog=()=>{const d=store.get('days',[]);$('#prog').textContent=d.length+'/14 已完成 completed';$('#pbar').style.width=(d.length/14*100)+'%'};prog();
 main.querySelectorAll('[data-day]').forEach(c=>c.onchange=()=>{let d=store.get('days',[]);const i=+c.dataset.day;d=c.checked?[...new Set(d.concat(i))]:d.filter(x=>x!==i);store.set('days',d);c.closest('.day').classList.toggle('done',c.checked);prog()});
 $('#cpDays').onclick=()=>{const d=store.get('days',[]);copy('【14天認知語言更新 14-Day Language Update】'+d.length+'/14\n'+DAYS.map((t,i)=>(d.includes(i)?'☑':'☐')+' D'+(i+1)+'｜'+t[0]+' / '+t[1]).join('\n'))};
 $('#rsDays').onclick=()=>{if(confirm('清除14天打勾紀錄？ Clear all 14-day checks?')){store.set('days',[]);renderTools()}};
 main.querySelectorAll('[data-form]').forEach(el=>{const key=el.dataset.form;updateExtras(el);drawLogs(el);
  el.addEventListener('input',()=>{store.set('draft-'+key,readForm(el));updateExtras(el)});
  el.addEventListener('change',()=>{store.set('draft-'+key,readForm(el));updateExtras(el)});
  el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const logs=store.get('logs-'+key,[]);
   if(b.dataset.act==='copy')copy(toText(key,readForm(el)));
   else if(b.dataset.act==='save'){logs.unshift(toText(key,readForm(el)));store.set('logs-'+key,logs.slice(0,100));drawLogs(el);toast('已儲存 Saved')}
   else if(b.dataset.act==='clear'){if(confirm('清空這張卡片的內容？ Clear this card?')){store.set('draft-'+key,{});renderTools()}}
   else if(b.dataset.del!=null){if(confirm('刪除這筆紀錄？ Delete this record?')){logs.splice(+b.dataset.del,1);store.set('logs-'+key,logs);drawLogs(el)}}
   else if(b.dataset.cp!=null)copy(logs[+b.dataset.cp])})});
}
render();
})();
</script>
