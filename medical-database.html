<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>醫學資料庫</title>
<style>
:root{
  --bg:#f6f4ef; --panel:#fffdf9; --ink:#22282b; --muted:#6c7377; --line:#e2ddd2;
  --accent:#0f766e; --accent-soft:#d9efec; --mark:#ffe58a; --pre:#f0ede4; --head:#14323a;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14181a; --panel:#1b2023; --ink:#e4e6e3; --muted:#949c9f; --line:#2e3538;
    --accent:#4fc4b7; --accent-soft:#1d3a38; --mark:#7a6412; --pre:#20272a; --head:#cfeee9;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.75 "Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
header h1{font-size:18px;margin:0;color:var(--head);white-space:nowrap;letter-spacing:.05em;cursor:pointer}
#menu{display:none;border:1px solid var(--line);background:none;font-size:18px;line-height:1;padding:7px 10px;border-radius:8px}
.search{position:relative;flex:1;max-width:560px}
#q{width:100%;padding:9px 34px 9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px;outline:none}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:18px;padding:4px 8px;display:none}
.wrap{flex:1;display:flex;min-height:0}
aside{width:330px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;border:0;background:none;padding:10px 0;font-size:14px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--accent);font-weight:700;border-bottom-color:var(--accent)}
nav{flex:1;overflow-y:auto;padding:6px 0 40px}
main{flex:1;overflow-y:auto;min-width:0}
article{max-width:880px;margin:0 auto;padding:28px 24px 80px}
.dom{display:flex;width:100%;align-items:center;gap:8px;text-align:left;border:0;background:none;padding:9px 16px;font-size:15px;font-weight:700;color:var(--head)}
.dom:hover,.un:hover,.tp:hover,.grp:hover{background:var(--accent-soft)}
.dom i{font-style:normal;color:var(--muted);font-size:11px;width:10px;transition:transform .15s}
.dom.open i{transform:rotate(90deg)}
.dom span{margin-left:auto;font-size:12px;font-weight:400;color:var(--muted)}
.grp{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 16px 3px 34px;font-size:13px;color:var(--accent);font-weight:600;line-height:1.45}
.un{display:block;width:100%;text-align:left;border:0;background:none;font-size:13.5px;line-height:1.5;padding:5px 16px 5px 46px;border-left:3px solid transparent}
.un small,.tag{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:6px;line-height:1.5;white-space:nowrap}
.un.on,.tp.on{border-left-color:var(--accent);color:var(--accent);font-weight:700;background:var(--accent-soft)}
.cat{font-size:12px;color:var(--muted);letter-spacing:.15em;padding:14px 18px 4px}
.tp{display:block;width:100%;text-align:left;border:0;background:none;font-size:14px;padding:6px 18px 6px 26px;border-left:3px solid transparent}
.count{padding:12px 18px 6px;font-size:13px;color:var(--muted)}
.hit{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;font-size:13.5px;line-height:1.55;padding:9px 18px}
.hit:hover{background:var(--accent-soft)}
.hit small{display:block;color:var(--accent);font-size:12px;margin-bottom:2px}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
.crumb a{color:var(--accent);cursor:pointer}
h2.title{font-size:26px;line-height:1.4;margin:0 0 10px;color:var(--head)}
.sib{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px;line-height:1.5;text-align:left}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip b{font-weight:400;color:var(--muted);margin-left:4px;font-size:12px}
article h3{font-size:20px;margin:34px 0 10px;padding:8px 14px;background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;color:var(--head);line-height:1.5}
article h4{font-size:17px;margin:26px 0 6px;color:var(--accent);line-height:1.5}
article h4.sub{font-size:16px;margin:18px 0 4px}
article h5{font-size:15px;margin:30px 0 10px;color:var(--muted);letter-spacing:.12em;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:6px}
article p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
article p.arrow{color:var(--accent);line-height:1.2;padding-left:.2em}
article p.flow{padding-left:1em}
article p.long{margin:8px 0}
article p.lead{color:var(--muted);margin-bottom:18px;white-space:normal}
article hr{border:0;border-top:1px solid var(--line);margin:22px 0}
article pre{background:var(--pre);border-radius:10px;padding:14px 16px;margin:12px 0;overflow-x:auto;font:14px/1.5 "Cascadia Mono",Consolas,"Microsoft JhengHei",monospace;white-space:pre}
.tw{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;font-size:14px;line-height:1.6;width:100%}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;min-width:120px;overflow-wrap:anywhere}
th:last-child,td:last-child{border-right:0}
tr:last-child td{border-bottom:0}
th{background:var(--accent-soft);color:var(--head);white-space:nowrap}
td.full{min-width:0}
td.full.sec{font-weight:700;color:var(--accent);background:var(--pre)}
.flash{animation:flash 2s ease-out}
@keyframes flash{0%,40%{background:var(--mark)}100%{background:transparent}}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:48px;border-top:1px solid var(--line);padding-top:18px}
.pager button{border:1px solid var(--line);background:var(--panel);font-size:14px;padding:9px 14px;border-radius:10px;max-width:48%;text-align:left}
.pager button:hover{border-color:var(--accent);color:var(--accent)}
.pager button:last-child{text-align:right;margin-left:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin:8px 0 10px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px 16px;text-align:left;display:block;width:100%}
.card:hover{border-color:var(--accent)}
.card strong{display:block;font-size:17px;color:var(--head)}
.card em{display:block;font-style:normal;font-size:13px;color:var(--muted);margin:2px 0 8px;line-height:1.5}
.card span{font-size:12px;color:var(--accent)}
.bars{margin:6px 0 4px}
.bar{display:grid;grid-template-columns:11em 1fr 3.2em;gap:10px;align-items:center;font-size:13px;line-height:2}
.bar div{height:9px;background:var(--pre);border-radius:5px;overflow:hidden}
.bar div i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar span:last-child{text-align:right;color:var(--muted)}
details{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:8px 0}
summary{padding:9px 14px;cursor:pointer;font-size:14.5px;line-height:1.5}
summary small{color:var(--muted);font-size:12px;margin-left:6px}
details[open] summary{border-bottom:1px solid var(--line);color:var(--accent);font-weight:700}
details .body{padding:10px 16px 14px}
details .body h4:first-child{margin-top:4px}
.go{border:0;background:none;color:var(--accent);font-size:13px;padding:6px 0 0}
.ulist{display:flex;flex-direction:column;gap:2px}
.ulist button{display:flex;gap:8px;align-items:baseline;border:0;background:none;text-align:left;padding:5px 8px;border-radius:8px;font-size:14px;line-height:1.5}
.ulist button:hover{background:var(--accent-soft)}
.ulist button b{margin-left:auto;font-weight:400;color:var(--muted);font-size:12px;white-space:nowrap}
@media (max-width:820px){
  #menu{display:block}
  header h1{display:none}
  aside{position:fixed;z-index:5;top:57px;bottom:0;left:0;width:min(88vw,350px);transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.2)}
  body.open aside{transform:none}
  article{padding:20px 16px 70px}
  h2.title{font-size:22px}
  .bar{grid-template-columns:8em 1fr 3em}
}
</style>
</head>

別診斷 → 避免漏掉危險的病\n│  ├─ 檢驗與影像 → 把「猜測」變成「確定」\n│  ├─ 依治療指引用藥 → 控制或治癒已確診的疾病\n│  ├─ 手術與介入治療 → 處理藥物解決不了的結構問題\n│  ├─ 急重症支持 → 先保命，爭取治療時間\n│  ├─ 追蹤監測 → 及早發現復發或副作用\n│  ├─ 復健 → 恢復功能與生活能力\n│  ├─ 病人衛教 → 提高配合度、減少錯誤用藥\n│  ├─ 多專科團隊 → 減少各看各的\n│  └─ 緩和與支持照護 → 改善生活品質\n├─ 新舊差異\n│  ├─ 舊：靠權威與個人經驗決定治療 ⇒ 新：靠大型研究的證據（實證醫學）\n│  ├─ 舊：醫師決定、病人照做 ⇒ 新：醫病一起討論、共同決定\n│  ├─ 舊：等病很明顯才處理 ⇒ 新：篩檢、早期發現、預防併發症\n│  └─ 舊：一種病一種標準治療 ⇒ 新：依基因、標記分型，走向精準治療\n├─ 最高槓桿\n│  └─ 對已確診的疾病，找到有證據的治療。\n├─ 測量與指標\n│  ├─ 生命徵象（體溫\n│  ├─ 脈搏\n│  ├─ 呼吸\n│  ├─ 血壓）\n│  ├─ 血液與尿液檢驗\n│  ├─ 影像\n│  ├─ 病理報告\n│  └─ 存活率與併發症率\n└─ 限制\n   ├─ 病名不一定能解釋每個人的差異；單一次檢查可能看不到變化趨勢。但不能誤解成「西醫只治症狀」。\n   ├─ 很多慢性不適找不到明確病名\n   ├─ 分科很細，容易各看各的、缺少整合\n   ├─ 門診時間短，生活型態常被略過\n   └─ 藥物與處置都有副作用與過度醫療的可能","s核心節點",["T",[["節點","白話","出問題會怎樣"],["病因","讓人生病的起點（細菌、基因、外傷…）","找不到病因時只能先處理症狀"],["病理變化","組織和細胞實際壞掉的樣子","決定病有多嚴重、會不會好"],["症狀與徵象","病人感覺到的＋醫師檢查到的","是診斷的入口，但同一症狀可能來自很多病"],["診斷","幫問題取一個正確的名字","診斷錯，後面全錯"],["分期與嚴重度","病走到哪一步","決定治療要多積極"],["治療","藥物、手術、支持療法","有效也有副作用，要權衡"],["預後與追蹤","之後會怎樣、要怎麼看著","沒追蹤就不知道有沒有復發"]]],"s機制","p病因 → 致病過程 → 病理變化 → 器官功能受損 → 症狀與徵象 → 診斷 → 治療 → 結果","p先有原因讓細胞或組織受傷，受傷累積到器官功能出問題，人才感覺不舒服。醫師反過來從症狀一路往回找到病因，再針對它治療。","s回饋迴路",["T",[["迴路","怎麼轉","怎麼打斷或利用"],["診斷—治療迴路","症狀 → 檢查 → 診斷 → 治療 → 觀察反應 → 修正診斷","治療沒效就回頭重新診斷，這是臨床最重要的修正機制"],["惡化迴路","器官受損 → 代償用力 → 負擔更重 → 損傷更多","及早治療，打斷在代償還撐得住的時候"],["抗藥性迴路","用藥 → 殺掉敏感的 → 留下抗藥的 → 藥效變差","正確選藥、用足療程"]]],"s所有策略 × 功效 × 團購產品（11 項）",["T",[["策略","怎麼做","功效","對應團購產品"],["問診＋理學檢查","問清楚症狀、時間、病史，再動手檢查","縮小可能的病因範圍","—"],["鑑別診斷","把所有可能的病列出來，一個一個排除","避免漏掉危險的病","—"],["檢驗與影像","用抽血、影像、切片確認","把「猜測」變成「確定」","—"],["依治療指引用藥","照有大型研究支持的標準流程給藥","控制或治癒已確診的疾病","—"],["手術與介入治療","切除、修補、打通、置換","處理藥物解決不了的結構問題","—"],["急重症支持","維持呼吸、循環、腎功能","先保命，爭取治療時間","—"],["追蹤監測","定期回診、複查數值","及早發現復發或副作用","—"],["復健","物理、職能、語言治療","恢復功能與生活能力","—"],["病人衛教","說明疾病、用藥與警訊","提高配合度、減少錯誤用藥","—"],["多專科團隊","不同科一起討論複雜個案","減少各看各的","—"],["緩和與支持照護","處理疼痛與不適","改善生活品質","—"]]],"s新舊差異",["T",[["舊模式","新模式"],["靠權威與個人經驗決定治療","靠大型研究的證據（實證醫學）"],["醫師決定、病人照做","醫病一起討論、共同決定"],["等病很明顯才處理","篩檢、早期發現、預防併發症"],["一種病一種標準治療","依基因、標記分型，走向精準治療"]]],"s最高槓桿","p對已確診的疾病，找到有證據的治療。","s測量與指標","p生命徵象（體溫、脈搏、呼吸、血壓）、血液與尿液檢驗、影像、病理報告、存活率與併發症率","s限制","p・病名不一定能解釋每個人的差異；單一次檢查可能看不到變化趨勢。但不能誤解成「西醫只治症狀」。\n・很多慢性不適找不到明確病名\n・分科很細，容易各看各的、缺少整合\n・門診時間短，生活型態常被略過\n・藥物與處置都有副作用與過度醫療的可能","s團購產品對應說明","p這一門負責「診斷與治療」，沒有任何團購產品可以對應或取代。有症狀請先就醫，產品只能放在醫療之外的日常保養。","h原文整理（白話中文）","p核心探究：","p疾病／病理。","p主要問題：","p「你現在到底得了什麼病？」","p結構：","p症狀","p→徵象","p→檢驗","p→影像檢查","p→病理","p→診斷","p→分期","p→治療","p→結果。","p最強：","p急症。","p感染。","p癌症。","p外傷。","p手術。","p器官衰竭。","p明確疾病。","p國小版：","p「房子已經冒煙了，先找哪裡失火並把火滅掉。」","p母體位置：","p★★★★★ 外在表現。","p★★★★ 器官。","p但現代醫學研究本身也能一路深入基因組，因此不能說西醫只有末端。","s本質","p疾病／以病理為中心的醫學。\n把疾病轉成可以定義、測量、鑑別、治療、追蹤的臨床疾病單位。","s核心結構","p病因→致病過程→病理→病理生理→徵象／症狀→診斷→分期／嚴重度→治療→結果。","s經典學說","p病原學說。\n細胞病理學。\n實證醫學。\n隨機對照試驗。\n臨床流行病學。","s代表經典","p《哈里遜內科學》。\n《Robbins病理學》。\n《Guyton生理學》。\nDavid Sackett等｜實證醫學。","s主要用途","p急救。\n感染。\n手術。\n癌症。\n器官疾病。\n藥物治療。\n明確診斷。","s策略","p症狀→鑑別診斷→檢查→診斷→治療指引→治療→追蹤監測。","s最高槓桿","p對已知疾病找到有證據的治療。","s限制","p病名標籤可能不足以解釋個體差異。\n單一時間點可能忽略變化軌跡。\n但不能誤解成「西醫只治症狀」。\n現代主流醫學本身也包含預防、基因體、系統生物學與生活型態醫學。"]},{"t":"02｜預防醫學","d":0,"g":"25 個醫學系統","s":"","b":["p對應依據：你《團購產品和節點》文件裡每項產品的「生命節點」與產品名稱。代表「屬於這個方向」，不代表已證實療效；標「間接」的關聯更弱。產品不能取代診斷與治療，孕哺期、慢性病或用藥者請先問醫師或藥師。","s本質","p把重點從「治病」移到「不要生病」；用族群資料找出風險，在疾病發生前或剛發生時就處理。","s主要問題","p你未來容易得什麼病？怎麼提早擋下來？","s國小版","p不要等失火才救火，先檢查電線、瓦斯和滅火器。","s完整結構樹","d預防醫學\n├─ 本質\n│  └─ 把重點從「治病」移到「不要生病」；用族群資料找出風險，在疾病發生前或剛發生時就處理。\n├─ 結構\n│  ├─ 族群（先看一大群人）\n│  ├─ 危險因子\n│  │  ├─ 血壓／血糖／血脂／體重\n│  │  ├─ 菸、酒\n│  │  └─ 家族史\n│  ├─ 風險分層（誰的風險高）\n│  ├─ 初段預防（還沒生病就預防）\n│  │  ├─ 疫苗\n│  │  ├─ 戒菸、飲食、運動\n│  │  └─ 環境與職業防護\n│  ├─ 次段預防（早期發現）\n│  │  ├─ 篩檢\n│  │  └─ 早期治療\n│  ├─ 三段預防（已生病，防惡化）\n│  │  ├─ 控制併發症\n│  │  └─ 復健\n│  ├─ 結果（發生率、死亡率）\n│  └─ 兩種策略\n│     ├─ 高風險策略（找出風險高的人重點處理）\n│     └─ 族群策略（讓所有人的風險都降一點）\n├─ 核心節點\n│  ├─ 危險因子：讓生病機率變高的東西\n│  ├─ 保護因子：讓生病機率變低的東西\n│  ├─ 絕對風險：你實際會生病的機率\n│  ├─ 篩檢：在沒症狀時找出疾病\n│  ├─ 潛伏期：病已開始但還沒症狀的時間\n│  └─ 族群分布：一整群人的風險曲線\n├─ 機制（怎麼一步步發生）\n│  ├─ 暴露於危險因子\n│  ├─ → 身體出現變化但沒症狀\n│  ├─ → 早期疾病\n│  ├─ → 有症狀的疾病\n│  ├─ → 併發症\n│  └─ → 失能或死亡\n├─ 回饋迴路\n│  ├─ 風險累 部歸因於生活方式。"]},{"t":"04｜功能醫學","d":0,"g":"25 個醫學系統","s":"","b":["p對應依據：你《團購產品和節點》文件裡每項產品的「生命節點」與產品名稱。代表「屬於這個方向」，不代表已證實療效；標「間接」的關聯更弱。產品不能取代診斷與治療，孕哺期、慢性病或用藥者請先問醫師或藥師。","s本質","p不只問「得了什麼病」，而是問「哪些生理功能失衡了、為什麼、彼此怎麼連動」；用系統的角度看一個人，找出可以改變的上游因素。","s主要問題","p為什麼你的身體功能會失衡？哪些系統互相拖累？","s國小版","p不只問「哪裡壞了」，還問「為什麼一直壞」。","s完整結構樹","d功能醫學\n├─ 本質\n│  └─ 不只問「得了什麼病」，而是問「哪些生理功能失衡了、為什麼、彼此怎麼連動」；用系統的角度看一個人，找出可以改變的上游因素。\n├─ 結構\n│  ├─ 時間軸（把一生的事件排出來）\n│  │  ├─ 前置因素（體質、遺傳、早年經歷）\n│  │  ├─ 誘發因素（感染、壓力事件、毒物）\n│  │  └─ 持續因素（一直讓問題好不了的原因）\n│  ├─ 七大功能（功能醫學矩陣）\n│  │  ├─ 消化吸收（消化、吸收、腸道菌相）\n│  │  ├─ 防禦與修復（免疫、發炎、感染）\n│  │  ├─ 能量（粒線體、能量調節）\n│  │  ├─ 生物轉化與排除（肝臟解毒、排泄）\n│  │  ├─ 運輸（心血管、淋巴）\n│  │  ├─ 溝通（荷爾蒙、神經傳導、免疫訊號）\n│  │  └─ 結構完整（細胞膜到骨骼肌肉）\n│  ├─ 可調整的生活因素\n│  │  ├─ 睡眠與放鬆\n│  │  ├─ 運動與活動\n│  │  ├─ 營養\n│  │  ├─ 壓力\n│  │  └─ 人際關係\n│  ├─ 介入 → 再測 → 更新判斷\n│  ├─ 評估工具\n│  │  ├─ 時間軸\n│  │  ├─ 功能醫學矩陣\n│  │  └─ 前置／誘發／持續因素\n│  └─ 治療順序（常見）\n│     ├─ 先顧生活基礎（睡眠、飲食、活動、壓力）\n│     ├─ 再處理腸道\n│     └─ 再處理能量、解毒、荷爾蒙\n├─ 核心節點\n│  ├─ 消化吸收：吃進去的東西能不能拆開、吸收\n│  ├─ 防禦與修復：免疫系統與發炎\n│  ├─ 能量：粒線體產生能量\n│  ├─ 生物轉化與排除：肝臟解毒、腸腎排泄\n│  ├─ 運輸：血液與淋巴循環\n│  ├─ 溝通：荷爾蒙、神經傳導、免疫訊號\n│  ├─ 結構完整：從細胞膜到骨骼肌肉\n│  └─ 心理情緒與靈性：想法、情緒、意義感\n├─ 機制（怎麼一步步發生）\n│  ├─ 前置因素（體質、遺傳、早年）＋ 誘發因素（感染、壓力、毒物）\n│  ├─ → 一個或多個功能失衡\n│  ├─ → 持續因素讓它好不了\n│  ├─ → 多系統連動\n│  └─ → 症狀與疾病\n├─ 回饋迴路\n│  ├─ 腸道—免疫迴路：腸道屏障受損 → 免疫被刺激 → 發炎 → 屏障更差\n│  ├─ 壓力—腸道迴路：壓力 → 消化變差、菌相改變 → 不舒服與發炎 → 壓力更大\n│  ├─ 發炎—能量迴路：慢性發炎 → 粒線體效率下降 → 疲勞、少動 → 代謝變差 → 發炎更多\n│  ├─ 血糖—荷爾蒙迴路：血糖起伏大 → 壓力荷爾蒙上升 → 睡不好、想吃甜 → 血糖更不穩\n│  └─ 再測回饋：介入 → 4–8 週後再評估 → 保留有效的\n├─ 策略\n│  ├─ 畫時間軸 → 看出問題從哪裡開始、被什麼觸發\n│  ├─ 腸道 5R → 改善消化吸收與腸道屏障\n│  ├─ 免疫與發炎調節 → 讓免疫「該打就打、該停就停」\n│  ├─ 能量與粒線體支持 → 改善疲勞與體力\n│  ├─ 解毒與生物轉化支持 → 幫身體處理並排出不需要的物質\n│  ├─ 氧化還原平衡 → 保護細胞不被過度氧化傷害\n│  ├─ 循環與運輸 → 讓養分送得到、廢物帶得走\n│  ├─ 荷爾蒙與神經傳導平衡 → 改善情緒、睡眠、專注與代謝\n│  ├─ 結構支持 → 維持活動力與支撐\n│  ├─ 再測與調整 → 留下有效的，拿掉沒用的\n│  ├─ 排除飲食試驗 → 找出會引發不適的食物\n│  ├─ 營養狀態補足 → 讓各項功能有足夠原料\n│  ├─ 睡眠與壓力處方 → 這兩項沒顧好，其他介入效果會打折\n│  └─ 排序與分階段 → 避免花費過多又看不出誰有效\n├─ 新舊差異\n│  ├─ 舊：你得了什麼病？ ⇒ 新：為什麼是你、為什麼是現在、哪些功能失衡？\n│  ├─ 舊：一個病對一種藥 ⇒ 新：一個人有一張失衡地圖 \n結構完整。","s經典框架","p功能醫學矩陣。\n前置／誘發／持續因素｜前置因素／誘發因素／持續因素。\n系統導向的臨床思考。","s代表教材","p曾強《功能醫學概論》。\nIFM功能醫學教材。","s用途","p整理複雜慢性問題。\n把生活型態、環境、生理放進同一張臨床地圖。","s策略","p外在表現→時間軸→矩陣→可能的功能失衡→可改變因素→介入→再測。","s槓桿","p瓶頸／持續因素。\n不是一定找「最深原因」，而是找持續讓問題存在且可改的因素。","s限制","p功能醫學內不同檢測與療法的證據差異很大。\n「根本原因」不能被誤解成每個慢性病都有唯一根因。"]},{"t":"05｜整合醫學","d":0,"g":"25 個醫學系統","s":"","b":["p對應依據：你《團購產品和節點》文件裡每項產品的「生命節點」與產品名稱。代表「屬於這個方向」，不代表已證實療效；標「間接」的關聯更弱。產品不能取代診斷與治療，孕哺期、慢性病或用藥者請先問醫師或藥師。","s本質","p以常規醫療為基礎，加上有證據、安全的輔助方法，照顧「整個人」——身體、心理、社會與意義感。","s主要問題","p怎麼把常規醫療和有證據的輔助方法，一起用在「整個人」身上？","s國小版","p醫院治療是主菜，其他有幫助又安全的方法是配菜。","s完整結構樹","d整合醫學\n├─ 本質\n│  └─ 以常規醫療為基礎，加上有證據、安全的輔助方法，照顧「整個人」——身體、心理、社會與意義感。\n├─ 結構\n│  ├─ 常規醫療（基礎）\n│  ├─ 有證據參考的輔助方法\n│  │  ├─ 營養與補充品\n│  │  ├─ 身心技巧（呼吸、冥想、瑜伽）\n│  │  ├─ 草本\n│  │  ├─ 針灸、按摩、推拿\n│  │  └─ 芳香與溫熱\n│  ├─ 全人\n│  │  ├─ 身體\n│  │  ├─ 心理\n│  │  ├─ 社會關係\n│  │  └─ 意義與靈性\n│  ├─ 醫病關係（一起做決定）\n│  └─ 選擇輔助方法的三個問題\n│     ├─ 安全嗎？\n│     ├─ 有證據嗎？\n│     └─ 會不會和現在的治療衝突？\n├─ 核心節點\n│  ├─ 常規醫療：醫院的標準診斷與治療\n│  ├─ 輔助方法：營養、身心技巧、草本、針灸等\n│  ├─ 證據等級：這個方法被研究得多清楚\n│  ├─ 安全性與交互作用：會不會傷害、會不會和藥打架\n│  ├─ 全人：身、心、社會、靈性\n│  └─ 醫病關係：被傾聽、一起決定\n├─ 機制（怎麼一步步發生）\n│  ├─ 常規診斷\n│  ├─ → 評估整個人的需求\n│  ├─ → 篩選安全且有證據的輔助方法\n│  ├─ → 與常規治療協調\n│  └─ → 追蹤效果與安全\n├─ 回饋迴路\n│  ├─ 身心迴路：壓力與焦慮 → 疼痛與症狀更明顯 → 更焦慮\n│  ├─ 信任迴路：被傾聽 → 願意說出自己在用什麼 → 醫師能把關安全 → 更信任\n│  └─ 安全回饋：加入新方法 → 觀察反應與檢驗 → 有問題就停\n├─ 策略\n│  ├─ 安全第一 → 避免輔助方法反而造成傷害\n│  ├─ 營養與補充品輔助 → 支持整體營養狀態\n│  ├─ 身心技巧 → 減壓、改善睡眠與情緒\n│  ├─ 草本與適應原 → 支持體力與適應壓力的能力\n│  ├─ 芳香與按摩 → 放鬆、提神、舒緩緊繃\n│  ├─ 溫熱與物理舒緩 → 促進局部循環與舒適感\n│  ├─ 睡眠與恢復 → 幫助身體修復\n│  ├─ 列出完整清單 → 抓出重複與交互作用\n│  ├─ 針灸與推拿 → 部分疼痛與噁心有研究支持\n│  └─ 飲食型態調整 → 多數慢性病的基礎\n├─ 新舊差異\n│  ├─ 舊：常規醫療與另類療法互相排斥 ⇒ 新：以證據為準，能幫助病人的就整合進來\n│  ├─ 舊：只治療疾病 ⇒ 新：照顧生病的「人」\n│  ├─ 舊：病人私下自己用，不告訴醫師 ⇒ 新：公開討論、一起檢查交互作用\n│  └─ 舊：自然的就是安全的 ⇒ 新：自然也有劑量、有副作用、有交互作用\n├─ 最高槓桿\n│  └─ 安全、有證據、而且病人願意持續做的方法。\n├─ 測量與指標\n│  ├─ 症狀與生活品質量表\n│  ├─ 疼痛分數\n│  ├─ 睡眠與情緒\n│  ├─ 用藥與補充品清單\n│  └─ 相關檢驗\n└─ 限制\n   ├─ 「自然」不等於安全；輔助方法不能取代必要的常規治療。\n   ├─ 各種輔助方法的證據強弱差很多\n   ├─ 市面產品品質不一\n   ├─ 可能讓人延誤必要的常規治療\n   └─ 費用多半自付","s核心節點",["T", 質。\n支持性照護。","s策略","p安全第一→標準照護→可整合方法→證據／交互作用檢查→結果。","s槓桿","p讓不同治療方法互補而不是互斥。","s限制","p整合≠全部療法都有證據。\n「整合」不能成為降低證據標準的理由。"]},{"t":"06｜系統醫學","d":0,"g":"25 個醫學系統","s":"","b":["p對應依據：你《團購產品和節點》文件裡每項產品的「生命節點」與產品名稱。代表「屬於這個方向」，不代表已證實療效；標「間接」的關聯更弱。產品不能取代診斷與治療，孕哺期、慢性病或用藥者請先問醫師或藥師。","s本質","p把人看成一個由很多零件互相影響的動態系統；疾病是整個系統的狀態改變，不是單一零件壞掉。","s主要問題","p整個身體這個「系統」是怎麼運作、怎麼出狀況的？","s國小版","p不是看一顆螺絲，而是看整台機器怎麼轉。","s完整結構樹","d系統醫學\n├─ 本質\n│  └─ 把人看成一個由很多零件互相影響的動態系統；疾病是整個系統的狀態改變，不是單一零件壞掉。\n├─ 結構\n│  ├─ 節點（基因、蛋白質、細胞、器官）\n│  ├─ 關係（誰影響誰）\n│  ├─ 回饋迴路\n│  │  ├─ 負回饋（拉回原位）\n│  │  └─ 正回饋（越來越強）\n│  ├─ 動態（隨時間變化）\n│  ├─ 擾動（外來的刺激）\n│  ├─ 整體表現（從互動中冒出來的結果）\n│  ├─ 資料來源\n│  │  ├─ 多體學（基因、蛋白質、代謝物）\n│  │  ├─ 臨床數據\n│  │  └─ 穿戴裝置\n│  └─ 系統的四個基本性質\n│     ├─ 整體大於部分總和\n│     ├─ 有邊界（什麼算系統內）\n│     ├─ 有層級（分子、細胞、器官、人、環境）\n│     └─ 會自我調節\n├─ 核心節點\n│  ├─ 節點：系統裡的一個因素（基因、蛋白質、器官、習慣）\n│  ├─ 關係：誰影響誰、方向與強度\n│  ├─ 回饋迴路：結果回頭影響原因\n│  ├─ 狀態：系統現在停在哪裡\n│  ├─ 擾動：外來的刺激\n│  ├─ 湧現：整體才有、零件沒有的性質\n│  └─ 延遲：原因和結果之間隔了一段時間\n├─ 機制（怎麼一步步發生）\n│  ├─ 多個節點 ＋ 彼此的關係 ＋ 回饋迴路\n│  ├─ → 系統的動態\n│  ├─ → 穩定在某個狀態\n│  └─ → 表現成健康或疾病\n├─ 回饋迴路\n│  ├─ 負回饋（穩定）：偏離 → 偵測 → 修正 → 回到原位\n│  ├─ 正回饋（放大）：一點變化 → 引發更多同方向變化\n│  ├─ 延遲造成的過度修正：介入 → 還沒看到效果 → 加碼 → 過頭\n│  └─ 模型更新迴路：預測 → 介入 → 測量 → 比對誤差 → 修改模型\n├─ 策略\n│  ├─ 定義系統 → 避免什麼都想管\n│  ├─ 畫節點與關係 → 看見全貌\n│  ├─ 找回饋迴路 → 知道為什麼問題會自己維持下去\n│  ├─ 多體學資料整合 → 找到單一檢查看不到的模式\n│  ├─ 小擾動觀察反應 → 分辨真正有效的介入\n│  ├─ 預測 → 測量 → 更新模型 → 讓判斷越來越準\n│  ├─ 找最卡的瓶頸 → 把力氣用在最有效的地方\n│  ├─ 給足反應時間 → 避免因延遲而誤判\n│  └─ 記錄時間序列 → 看到單次量測看不到的變化\n├─ 新舊差異\n│  ├─ 舊：把東西拆到最小來研究（化約） ⇒ 新：研究零件之間的互動與整體\n│  ├─ 舊：一個原因造成一個結果 ⇒ 新：多個原因、互相影響、還有回饋\n│  ├─ 舊：看某一個時間點 ⇒ 新：看隨時間的變化\n│  └─ 舊：找壞掉的零件 ⇒ 新：找讓系統卡住的結構\n├─ 最高槓桿\n│  └─ 能改變整個系統動態的控制點。\n├─ 測量與指標\n│  ├─ 多體學資料\n│  ├─ 長期追蹤的臨床數值\n│  ├─ 穿戴裝置資料\n│  └─ 介入前後的變化\n└─ 限制\n   ├─ 模型再漂亮，也要回到真實數據驗證。\n   ├─ 模型很複雜，需要大量資料\n   ├─ 很多關係還不清楚，模型可能是錯的\n   ├─ 離日常臨床應用還有距離\n   └─ 「什麼都有關」容易變成什麼都說不清楚","s核心節點",["T",[["節點","白話","出問題會怎樣"],["節點","系統裡的一個因素（基因、蛋白質、器官、習慣）","單看一個節點常看不出問題"],["關係","誰影響誰、方向與強度","關係改變，結果就改變"],["回饋迴路","結果回頭影響原因","負回饋失靈會失控，正回饋會形成惡性循環"],["狀態","系統現在停在哪裡","可能卡在不健康但穩定的狀態"],["擾動","外來的刺激","同樣的刺激，不同狀態反應不同"],["湧現","整體才有、零件沒有的性質","所以拆開研究會漏掉重點"],["延遲","原因和結果之間隔了一段時間","讓人誤判什麼有效、什麼沒效"]]],"s機制","p多個節點 ＋ 彼此的關係 ＋ 回饋迴路 → 系統的動態 → 穩定在某個狀態 → 表現成健康或疾病","p健康和疾病都是「穩定狀態」。要離開生病的狀態，常常不是修一個零件，而是改變讓它穩在那裡的迴路。","s回饋迴路",["T",[["迴路","怎麼轉","怎麼打斷或利用"],["負回饋（穩定）","偏離 → 偵測 → 修正 → 回到原位","像冷氣的溫控；失靈時數值就失控"],["正回饋（放大）","一點變化 → 引發更多同方向變化","是惡性循環也是良性循環的來源"],["延遲造成的過度修正","介入 → 還沒看到效果 → 加碼 → 過頭","給系統足夠的反應時間再判斷"],["模型更新迴路","預測 → 介入 → 測量 → 比對誤差 → 修改模型","這是系統醫學的核心工作方式"]]],"s所有策略 × 功效 × 團購產品（9 項）",["T",[["策略","怎麼做","功效","對應團購產品"],["定義系統","先說清楚要看的範圍與目標","避免什麼都想管","—"],["畫節點與關係","列出重要因素與彼此影響","看見全貌","—"],["找回饋迴路","找出惡性循環與穩定機制","知道為什麼問題會自己維持下去","—"],["多體學資料整合","把不同層次的檢驗資料放在一起看","找到單一檢查看不到的模式","—"],["小擾動觀察反應","一次只改一件事，看系統怎麼反應","分辨真正有效的介入","—"],["預測 → 測量 → 更新模型","先說預期會怎樣，再用數據對答案","讓判斷越來越準","—"],["找最卡的瓶頸","問「哪一關卡住了整個流程」","把力氣用在最有效的地方","—"],["給足反應時間","改變後等 2–8 週再評估","避免因延遲而誤判","—"],["記錄時間序列","固定時間量測、畫成趨勢","看到單次量測看不到的變化","—"]]],"s新舊差異",["T",[["舊模式","新模式"],["把東西拆到最小來研究（化約）","研究零件之間的互動與整體"],["一個原因造成一個結果","多個原因、互相影響、還有回饋"],["看某一個時間點","看隨時間的變化"],["找壞掉的零件","找讓系統卡住的結構"]]],"s最高槓桿","p能改變整個系統動態的控制點。","s測量與指標","p多體學資料、長期追蹤的臨床數值、穿戴裝置資料、介入前後的變化","s限制","p・模型再漂亮，也要回到真實數據驗證。\n・模型很複雜，需要大量資料\n・很多關係還不清楚，模型可能是錯的\n・離日常臨床應用還有距離\n・「什麼都有關」容易變成什麼都說不清楚","s團購產品對應說明","p沒有直接對應的產品。這一門是「排順序的方法」：先找瓶頸節點，一次只加一項產品，2–4 週後再評估。","h原文整理（白話中文）","p這一個與你的「母體」非常重要。","p核心：","p疾病不是單一零件故障，","p而是動態系統狀態改變。","p研究：","p節點。","p關係。","p網路。","p回饋迴路。","p動態。","p多體學。","p環境。","p外在表現。","p公式：","p基因組","p↔轉錄體","p↔蛋白質體","p↔代謝體","p↔細胞網路","p↔器官網路","p↔環境","p→外在表現。","p母體位置：","p★★★★★。","p這其實比「功能醫學」更接近你現在建立的正式科學版母體架構。","s本質","p生命不是零件集合。\n生命＝會互相影響的動態系統。","s核心結構","p節點。\n連線／關係。\n權重。\n網路。\n回饋。\n狀態。\n動態。\n湧現（整體冒出新性質）。\n擾動。\n吸引子（系統容易停留的狀態）。","s經典學說","p一般系統論。\n控制論。\n複雜系統。\n系統生物學。","s代表經典","pLudwig von Bertalanffy｜《一般系統論》。\nNorbert Wiener｜控制論。\nUri Alon｜《系統生物學導論》。","s用途","p複雜疾病。\n跨器官疾病。\n多體學整合。\n疾病機制建模。","s策略","p定義系統→畫出節點→畫出關係→權重→回饋→擾動→預測反應。","s槓桿","p不是最大節點。\n而可能是：樞紐。\n瓶頸。\n回饋迴路。\n控制點。","s限制","p模型愈複雜不代表愈正確。\n大量相關不等於因果。"]},{"t":"07｜網路醫學","d":0,"g":"25 個醫學系統","s":"","b":["p對應依據：你《團購產品和節點》文件裡每項產品的「生命節點」與產品名稱。代表「屬於這個方向」，不代表已證實療效；標「間接」的關聯更弱。產品不能取代診斷與治療，孕哺期、慢性病或用藥者請先問醫師或藥師。","s本質","p把人體的分子畫成一張互相連結的網路；疾病是網路裡某一區（疾病模組）出問題，不是單一基因。","s主要問題","p疾病在人體的分子網路裡，占了哪一塊？","s國小版","p疾病不是一顆壞掉的燈泡，而是一整區電路出問題。","s完整結構樹","d網路醫學\n├─ 本質\n│  └─ 把人體的分子畫成一張互相連結的網路；疾病是網路裡某一區（疾病模組）出問題，不是單一基因。\n├─ 結構\n│  ├─ 節點（基因、蛋白質、代謝物）\n│  ├─ 連線（交互作用）\n│  ├─ 樞紐（連線特別多的節點）\n│  ├─ 瓶頸（訊息一定會經過的節點）\n│  ├─ 疾病模組（跟某個病有關的一群節點）\n│  ├─ 共病（不同疾病共用的節點）\n│  ├─ 藥物標靶在網路中的位置\n│  └─ 網路的常見性質\n│     ├─ 少數樞紐、多數小節點\n│     ├─ 小世界（任兩點距離很短）\n│     └─ 模組化（一群一群）\n├─ 核心節點\n│  ├─ 節點：基因、蛋白質、代謝物\n│  ├─ 連線：兩個分子之間有交互作用\n│  ├─ 樞紐：連線特別多的節點\n│  ├─ 瓶頸：很多訊息一定要經過的節點\n│  ├─ 疾病模組：跟同一個病有關、彼此相連的一群節點\n│  └─ 網路距離：兩群節點在網路上離多遠\n├─ 機制（怎麼一步步發生）\n│  ├─ 基因或環境造成某些節點異常\n│  ├─ → 影響沿連線擴散\n│  ├─ → 在網路中形成一個受擾動的區域（疾病模組）\n│  ├─ → 細胞與器官功能改變\n│  └─ → 疾病\n├─ 回饋迴路\n│  ├─ 擴散迴路：一個節點異常 → 鄰居受影響 → 再影響鄰居的鄰居\n│  ├─ 代償：一條路被擋住 → 網路改走別條路\n│  └─ 共病迴路：疾病 A 的模組受擾動 → 波及重疊的疾病 B 模組\n├─ 策略\n│  ├─ 建立交互作用網路 → 得到一張可以分析的地圖\n│  ├─ 找疾病模組 → 不再只盯著單一基因\n│  ├─ 找樞紐與瓶頸 → 找出可能的高槓桿位置\n│  ├─ 老藥新用 → 加快找到可用的治療\n│  ├─ 共病分析 → 解釋為什麼某些病常一起出現\n│  ├─ 實驗與臨床驗證 → 確認不是只有電腦上好看\n│  ├─ 多標靶組合 → 減少網路繞路造成的失效\n│  ├─ 依網路重新分類疾病 → 讓同一群病人更相似\n│  └─ 預測副作用 → 事先知道可能影響哪些功能\n├─ 新舊差異\n│  ├─ 舊：一個基因對一種病 ⇒ 新：一群節點（模組）對一種病\n│  ├─ 舊：疾病依器官與症狀分類 ⇒ 新：疾病依共用的分子網路重新分類\n│  ├─ 舊：一個藥打一個標靶 ⇒ 新：考慮整個網路的反應，甚至多標靶\n│  └─ 舊：副作用是意外 ⇒ 新：副作用是藥物在網路中擴散的可預期結果\n├─ 最高槓桿\n│  └─ 疾病模組中的樞紐與瓶頸。\n├─ 測量與指標\n│  ├─ 基因與蛋白質交互作用資料\n│  ├─ 基因表現資料\n│  ├─ 共病統計\n│  └─ 網路中心性指標\n└─ 限制\n   ├─ 中心性高不等於臨床上重要；網路預測需要實驗與臨床驗證。\n   ├─ 目前的人體交互作用網路還不完整\n   ├─ 網路是靜態的地圖，身體是動態的\n   ├─ 計算出來重要，不代表臨床上有用\n   └─ 還很少直接用在一般病人身上","s核心節點",["T",[["節點","白話","出問題會怎樣"],["節點","基因、蛋白質、代謝物","一個節點出錯，影響會沿著連線傳出去"],["連線","兩個分子之間有交互作用","連線斷了或多了，功能就變"],["樞紐","連線特別多的節點","壞掉影響很大，但也常是生存必需、不能亂動"],["瓶頸","很多訊息一定要經過的節點","是可能的控制點"],["疾病模組","跟同一個病有關、彼此相連的一群節點","模組重疊的病容易一起出現"],["網路距離","兩群節點在網路上離多遠","藥物標靶離疾病模組越近，越可能有效"]]],"s機制","p基因或環境造成某些節點異常 → 影響沿連線擴散 → 在網路中形成一個受擾動的區域（疾病模組）→ 細胞與器官功能改變 → 疾病","p同一個病，不同病人壞的節點可能不同，但都落在同一個模組裡。這解釋了為什麼病一樣、基因卻不一樣。","s回饋迴路",["T",[["迴路","怎麼轉","怎 醫學相關研究與《網路科學》。","s用途","p疾病共病。\n藥物標靶。\n致病基因。\n路徑。\n老藥新用。","s策略","p疾病節點→交互作用體→模組→樞紐／瓶頸→標靶→網路反應。","s槓桿","p高中心性或高控制力節點。","s限制","p中心性≠臨床重要性。\n網路預測仍須實驗／臨床驗證。"]},{"t":"08｜分子醫學","d":0,"g":"25 個醫學系統","s":"","b":["p對應依據：你《團購產品和節點》文件裡每項產品的「生命節點」與產品名稱。代表「屬於這個方向」，不代表已證實療效；標「間接」的關聯更弱。產品不能取代診斷與治療，孕哺期、慢性病或用藥者請先問醫師或藥師。","s本質","p在分子的層次解釋疾病：哪個基因、哪個蛋白質、哪條訊號路徑出錯，再針對它設計診斷與治療。","s主要問題","p是哪個分子、哪條路徑出了問題？","s國小版","p把身體拆到最小的零件，看哪個零件卡住。","s完整結構樹","d分子醫學\n├─ 本質\n│  └─ 在分子的層次解釋疾病：哪個基因、哪個蛋白質、哪條訊號路徑出錯，再針對它設計診斷與治療。\n├─ 結構\n│  ├─ 基因\n│  ├─ RNA\n│  ├─ 蛋白質\n│  │  ├─ 受體（接收訊號）\n│  │  └─ 酵素（加速反應）\n│  ├─ 訊號路徑\n│  ├─ 細胞功能\n│  ├─ 組織功能\n│  └─ 分子層次的常見錯誤\n│     ├─ 基因突變\n│     ├─ 表現量太多或太少\n│     ├─ 蛋白質折疊錯誤\n│     └─ 訊號一直開著或打不開\n├─ 核心節點\n│  ├─ 基因：製造蛋白質的指令\n│  ├─ RNA：指令的抄本\n│  ├─ 蛋白質：真正做事的分子\n│  ├─ 受體：細胞上接收訊號的天線\n│  ├─ 酵素：加速化學反應的工人\n│  ├─ 訊號路徑：訊息在細胞內的傳遞鏈\n│  └─ 輔因子：酵素工作需要的小幫手（維生素、礦物質）\n├─ 機制（怎麼一步步發生）\n│  ├─ DNA\n│  ├─ → RNA\n│  ├─ → 蛋白質\n│  ├─ → 訊號路徑與代謝反應\n│  ├─ → 細胞功能\n│  └─ → 組織與器官功能\n├─ 回饋迴路\n│  ├─ 產物抑制：產物夠多 → 回頭抑制製造它的酵素\n│  ├─ 受體調降：訊號一直太強 → 細胞減少受體 → 變得不敏感\n│  └─ 訊號放大：一個訊號分子 → 啟動很多下游分子\n├─ 策略\n│  ├─ 找分子致病過程 → 知道真正卡住的步驟\n│  ├─ 分子診斷 → 更精確地分類疾病\n│  ├─ 標靶藥物 → 更準、副作用可能更少\n│  ├─ 酵素輔因子營養 → 讓代謝反應順利進行\n│  ├─ 基因與細胞治療 → 處理某些遺傳與血液疾病\n│  └─ 小分子與抗體藥物 → 精準阻斷或啟動某條路徑\n├─ 新舊差異\n│  ├─ 舊：依症狀與器官分類疾病 ⇒ 新：依分子機制分類疾病\n│  ├─ 舊：藥物是試出來的 ⇒ 新：先找到標靶，再設計藥物\n│  └─ 舊：一種癌症一種治法 ⇒ 新：依腫瘤的分子變異選藥\n├─ 最高槓桿\n│  └─ 推動疾病的關鍵分子標靶。\n├─ 測量與指標\n│  ├─ 基因檢測\n│  ├─ 蛋白質與酵素活性檢驗\n│  └─ 分子病理報告\n└─ 限制\n   ├─ 只看單一分子容易忽略整體；體外實驗有效不等於人體有效。\n   ├─ 分子清楚了，不代表整個人的病就清楚了\n   ├─ 細胞與動物實驗的結果常無法在人身上重現\n   ├─ 標靶治療會出現抗藥性\n   └─ 只看分子容易忽略環境與生活","s核心節點",["T",[["節點","白話","出問題會怎樣"],["基因","製造蛋白質的指令","指令錯了，產品就錯"],["RNA","指令的抄本","抄多抄少、抄錯都會影響蛋白質"],["蛋白質","真正做事的分子","太多、太少、形狀不對都會出問題"],["受體","細胞上接收訊號的天線","太敏感或失靈，細胞就誤判"],["酵素","加速化學反應的工人","缺了或太活躍，代謝就亂"],["訊號路徑","訊息在細胞內的傳遞鏈","一直開著可能導致癌症，關掉可能導致功能不足"],["輔因子","酵素工作需要的小幫手（維生素、礦物質）","不足時酵素效率下降"]]],"s機制","pDNA → RNA → 蛋白質 → 訊號路徑與代謝反應 → 細胞功能 → 組織與器官功能","p任何一步出錯，後面都會受影響。分子醫學就是找出「錯在哪一步」。","s回饋迴路",["T",[["迴路","怎麼轉","怎麼打斷或利用"],["產物抑制","產物夠多 → 回頭抑制製造它的酵素", 表已證實療效；標「間接」的關聯更弱。產品不能取代診斷與治療，孕哺期、慢性病或用藥者請先問醫師或藥師。","s本質","p讀取一個人的整套 DNA，用來了解疾病風險、診斷遺傳病、選擇藥物；DNA 設定了範圍，但不是命運。","s主要問題","p你的 DNA 帶來哪些限制與可能性？","s國小版","pDNA 是出廠說明書，寫了可能性，但不是命運。","s完整結構樹","d基因體醫學\n├─ 本質\n│  └─ 讀取一個人的整套 DNA，用來了解疾病風險、診斷遺傳病、選擇藥物；DNA 設定了範圍，但不是命運。\n├─ 結構\n│  ├─ DNA 序列\n│  ├─ 基因變異\n│  │  ├─ 單基因（一個基因決定）\n│  │  └─ 多基因（很多小影響加起來）\n│  ├─ 應用\n│  │  ├─ 遺傳疾病與罕見疾病\n│  │  ├─ 癌症基因體\n│  │  ├─ 藥物基因體（基因影響藥效）\n│  │  └─ 多基因風險評估\n│  ├─ 基因檢測 → 變異判讀 → 臨床上能不能行動\n│  └─ 檢測種類\n│     ├─ 單一基因\n│     ├─ 基因套組\n│     ├─ 全外顯子／全基因組\n│     ├─ 腫瘤基因檢測\n│     └─ 藥物基因檢測\n├─ 核心節點\n│  ├─ 基因變異：你和別人 DNA 不同的地方\n│  ├─ 單基因疾病：一個基因壞掉就會生病\n│  ├─ 多基因風險：很多小變異加起來的風險\n│  ├─ 外顯率：帶有變異的人真的發病的比例\n│  ├─ 藥物基因：影響藥物代謝與反應的基因\n│  └─ 腫瘤基因：癌細胞後天產生的突變\n├─ 機制（怎麼一步步發生）\n│  ├─ DNA 變異\n│  ├─ → 蛋白質的量或功能改變\n│  ├─ → 細胞與器官功能受影響\n│  ├─ → 加上環境與生活\n│  └─ → 疾病風險或藥物反應\n├─ 回饋迴路\n│  ├─ 基因—環境交互：同一個基因變異 → 在不同環境下 → 風險高低不同\n│  ├─ 家族回饋：一人驗出 → 家人知道自己可能帶因 → 提早檢查\n│  └─ 知識更新：變異意義不明 → 研究累積 → 重新判讀\n├─ 策略\n│  ├─ 家族史 → 判斷是否需要基因檢測\n│  ├─ 適當的基因檢測 → 避免無意義的焦慮\n│  ├─ 變異判讀 → 分辨有意義與意義不明的變異\n│  ├─ 藥物基因體 → 提高藥效、減少副作用\n│  ├─ 癌症基因檢測 → 選擇對應的標靶治療\n│  ├─ 遺傳諮詢 → 做出知情的決定\n│  ├─ 依基因差異調整營養 → 研究仍在發展中\n│  ├─ 新生兒與產前篩檢 → 及早發現可處理的遺傳病\n│  ├─ 帶因者篩檢 → 了解下一代的風險\n│  └─ 依風險加強監測 → 及早發現\n├─ 新舊差異\n│  ├─ 舊：基因決定命運 ⇒ 新：基因給的是機率與範圍\n│  ├─ 舊：一次只驗一個基因 ⇒ 新：一次讀整套基因組\n│  ├─ 舊：所有人用同樣的藥與劑量 ⇒ 新：依基因調整藥物\n│  └─ 舊：只有罕見病才需要 ⇒ 新：逐漸用在常見病的風險評估與用藥\n├─ 最高槓桿\n│  └─ 有明確臨床行動方案的基因變異。\n├─ 測量與指標\n│  ├─ 基因檢測報告\n│  ├─ 家族史\n│  ├─ 多基因風險分數\n│  └─ 藥物基因檢測\n└─ 限制\n   ├─ 帶有基因不等於會發病；有關聯不等於因果。\n   ├─ 大多數常見病的基因預測力有限\n   ├─ 很多變異的意義還不清楚\n   ├─ 研究資料多來自歐洲族群，其他族群準確度較低\n   └─ 涉及隱私、保險與心理負擔","s核心節點",["T",[["節點","白話","出問題會怎樣"],["基因變異","你和別人 DNA 不同的地方","大部分無害，少數影響很大"],["單基因疾病","一個基因壞掉就會生病","影響大、但很少見"],["多基因風險","很多小變異加起來的風險","每個影響都很小，受環境影響大"],["外顯率","帶有變異的人真的發病的比例","不是 100%，所以帶因不等於會病"],["藥物基因","影響藥物代謝與反應的基因","同樣劑量，有人沒效、有人中毒"],["腫瘤基因","癌細胞後天產生的突變","決定能不能用標靶藥"]]],"s機制","pDNA 變異 → 蛋白質的量或功能改變 → 細胞與器官功能受影響 → 加上環境與生活 → 疾病風險或藥物反應","p基因像食譜，環境像廚師。同一份食譜，煮出來的菜可以差很多。","s回饋迴路",["T",[["迴路","怎麼轉","怎麼打斷或利用"],["基因—環境交互","同一個基因變異 → 在不同環境下 → 風險高低 用藥者請先問醫師或藥師。","s本質","p把一個人從出生到現在接觸過的所有非基因因素加總起來看；基因解釋不了的疾病風險，很大一部分在這裡。","s主要問題","p你一輩子接觸到的東西，累積起來對身體做了什麼？","s國小版","p每天吸的空氣、喝的水、照的光，都像一點一點滴進杯子裡的水。","s完整結構樹","d暴露體學\n├─ 本質\n│  └─ 把一個人從出生到現在接觸過的所有非基因因素加總起來看；基因解釋不了的疾病風險，很大一部分在這裡。\n├─ 結構\n│  ├─ 外在暴露\n│  │  ├─ 空氣\n│  │  ├─ 水與食物\n│  │  ├─ 化學物質\n│  │  ├─ 光與輻射\n│  │  ├─ 噪音\n│  │  ├─ 職業\n│  │  └─ 社會情境\n│  ├─ 體內暴露\n│  │  ├─ 發炎\n│  │  ├─ 氧化壓力\n│  │  ├─ 代謝產物\n│  │  └─ 菌相\n│  ├─ 三個關鍵\n│  │  ├─ 劑量\n│  │  ├─ 持續時間\n│  │  └─ 發生的時機\n│  └─ 接觸途徑\n│     ├─ 吸入\n│     ├─ 吃入\n│     ├─ 皮膚接觸\n│     └─ 胎盤與母乳\n├─ 核心節點\n│  ├─ 外在特定暴露：空氣污染、化學物質、輻射、感染、菸酒、飲食\n│  ├─ 外在一般環境：社會經濟、居住、氣候、壓力\n│  ├─ 體內環境：發炎、氧化壓力、荷爾蒙、菌相、代謝\n│  ├─ 劑量：接觸了多少\n│  ├─ 時機：人生哪個階段接觸\n│  └─ 排除能力：身體處理與排出的能力\n├─ 機制（怎麼一步步發生）\n│  ├─ 環境中的來源\n│  ├─ → 接觸（吸入、吃入、皮膚）\n│  ├─ → 體內劑量\n│  ├─ → 身體反應（發炎、氧化壓力、荷爾蒙干擾）\n│  ├─ → 長期累積\n│  └─ → 疾病風險\n├─ 回饋迴路\n│  ├─ 氧化—發炎迴路：暴露 → 氧化壓力 → 發炎 → 更多氧化壓力\n│  ├─ 累積迴路：持續暴露 ＞ 排除速度 → 體內累積 → 負擔加重\n│  └─ 社會迴路：環境條件差 → 暴露多、資源少 → 健康差 → 更難改善環境\n├─ 策略\n│  ├─ 找出並減少暴露來源 → 從源頭降低負擔\n│  ├─ 光暴露管理 → 減少眼睛疲勞\n│  ├─ 呼吸道防護 → 降低呼吸道刺激\n│  ├─ 肝臟解毒支持 → 幫助身體代謝與排出\n│  ├─ 抗氧化 → 緩衝暴露造成的氧化壓力\n│  ├─ 皮膚清潔與屏障 → 維持皮膚這道防線\n│  ├─ 居家用電安全 → 降低居家風險\n│  ├─ 飲食選擇 → 降低吃入的暴露\n│  ├─ 室內空氣 → 降低吸入的暴露\n│  ├─ 充足飲水與纖維 → 支持腎臟與腸道的正常排除\n│  └─ 職業防護 → 降低工作中的暴露\n├─ 新舊差異\n│  ├─ 舊：疾病主要看基因 ⇒ 新：基因之外的環境累積同樣重要\n│  ├─ 舊：一次研究一種污染物 ⇒ 新：看一生所有暴露的總和與交互作用\n│  ├─ 舊：有超過標準才有問題 ⇒ 新：低劑量長期、多種混合也要注意\n│  └─ 舊：只看現在的環境 ⇒ 新：也要看過去，特別是生命早期\n├─ 最高槓桿\n│  └─ 高劑量、長時間、又可以改變的暴露。\n├─ 測量與指標\n│  ├─ 居住與職業史\n│  ├─ 空氣品質\n│  ├─ 飲水來源\n│  ├─ 菸酒紀錄\n│  └─ 特定物質的血液或尿液檢測\n└─ 限制\n   ├─ 暴露很難完整測量；很多因果關係仍不確定。\n   ├─ 一生的暴露幾乎不可能完整測量\n   ├─ 混合暴露的效應很難研究\n   ├─ 多數結論來自觀察研究，因果難定\n   ├─ 「排毒」產品多半缺乏證據\n   └─ 很多暴露個人無法控制","s核心節點",["T",[["節點","白話","出問題會怎樣"],["外在特定暴露","空氣污染、化學物質、輻射、感染、菸酒、飲食","劑量夠、時間長就可能造成傷害"],["外在一般環境","社會經濟、居住、氣候、壓力","決定你會碰到哪些特定暴露"],["體內環境","發炎、氧化壓力、荷爾蒙、菌相、代謝","是暴露在體內留下的痕跡"],["劑量","接觸了多少","決定毒性的第一要素"],["時機","人生哪個階段接觸","胎兒與兒童期特別敏感"],["排除能力","身體處理與排出的能力","因人而異，影響實際傷害"]]],"s機制","p環境中的來源 → 接觸（吸入、吃入、皮膚）→ 體內劑量 → 身體反應（發炎、氧化壓力、荷爾蒙干擾）→ 長期累積 → 疾病風險","p重要的不是「有沒有接觸」，而是「多少、多久、什麼 病風險。\n├─ 結構\n│  ├─ 時間\n│  │  ├─ 孕前\n│  │  ├─ 懷孕期\n│  │  ├─ 嬰幼兒期\n│  │  ├─ 兒童與青少年\n│  │  └─ 成年後的風險\n│  ├─ 影響因素\n│  │  ├─ 營養\n│  │  ├─ 壓力\n│  │  ├─ 毒物\n│  │  └─ 感染\n│  ├─ 機制\n│  │  ├─ 發育時期的設定\n│  │  └─ 表觀遺傳\n│  ├─ 關鍵期／敏感期\n│  └─ 所謂「生命最初一千天」\n│     ├─ 懷孕期（約 270 天）\n│     ├─ 出生後第一年\n│     └─ 出生後第二年\n├─ 核心節點\n│  ├─ 關鍵期：器官形成、設定被寫入的時間\n│  ├─ 胎兒營養：胎兒得到的營養多寡與品質\n│  ├─ 母體壓力與健康：媽媽的壓力荷爾蒙、血糖、體重\n│  ├─ 發育可塑性：胎兒依環境調整自己\n│  ├─ 表觀設定：早期留下的基因開關狀態\n│  └─ 追趕生長：出生小、之後長很快\n├─ 機制（怎麼一步步發生）\n│  ├─ 早期環境訊號（營養、壓力、毒物）\n│  ├─ → 胎兒與嬰兒調整發育方向\n│  ├─ → 器官結構與代謝設定被寫入\n│  ├─ → 成年後遇到不同環境\n│  └─ → 疾病風險改變\n├─ 回饋迴路\n│  ├─ 預測—不匹配迴路：胎兒期營養少 → 身體設定成節省模式 → 出生後食物充足 → 容易肥胖與代謝病\n│  ├─ 跨代迴路：媽媽的健康 → 影響孩子 → 孩子長大再影響下一代\n│  └─ 補救迴路：早期不利 → 之後良好的營養與環境 → 部分風險下降\n├─ 策略\n│  ├─ 孕前與孕期營養 → 支持胎兒正常發育\n│  ├─ 避免菸酒與毒物 → 降低發育風險\n│  ├─ 產檢與母體健康 → 改善母嬰結果\n│  ├─ 哺乳與嬰幼兒營養 → 支持成長與免疫\n│  ├─ 兒童期活動與飲食 → 建立一生的基礎\n│  ├─ 成年後的補強 → 早期設定不是命運，仍可以改善\n│  ├─ 孕前健康 → 設定從受孕前就開始\n│  ├─ 父親的健康 → 不只是母親的責任\n│  └─ 適當的成長速度 → 降低日後代謝風險\n├─ 新舊差異\n│  ├─ 舊：成人病是成年後的生活造成的 ⇒ 新：風險從出生前就開始累積\n│  ├─ 舊：基因＋成年生活型態 ⇒ 新：基因＋早期設定＋一生的環境\n│  └─ 舊：胎兒被完全保護、不受外界影響 ⇒ 新：胎兒會對環境訊號做出長期調整\n├─ 最高槓桿\n│  └─ 關鍵期與敏感期。\n├─ 測量與指標\n│  ├─ 出生體重\n│  ├─ 成長曲線\n│  ├─ 孕期體重與血糖\n│  └─ 兒童期體位\n└─ 限制\n   ├─ 早期影響不等於一輩子註定；不應用來責怪父母。\n   ├─ 多來自觀察研究與動物實驗，因果難確定\n   ├─ 追蹤需要幾十年\n   ├─ 容易變成對母親的責怪\n   └─ 早期影響可以被後來的環境部分修正","s核心節點",["T",[["節點","白話","出問題會怎樣"],["關鍵期","器官形成、設定被寫入的時間","這時受影響，之後很難完全改回來"],["胎兒營養","胎兒得到的營養多寡與品質","太少或太多都會改變代謝設定"],["母體壓力與健康","媽媽的壓力荷爾蒙、血糖、體重","會傳遞訊號給胎兒"],["發育可塑性","胎兒依環境調整自己","預測錯了（出生後環境不同）就變成風險"],["表觀設定","早期留下的基因開關狀態","可能維持很多年"],["追趕生長","出生小、之後長很快","與之後的代謝風險有關"]]],"s機制","p早期環境訊號（營養、壓力、毒物）→ 胎兒與嬰兒調整發育方向 → 器官結構與代謝設定被寫入 → 成年後遇到不同環境 → 疾病風險改變","p胎兒會依媽媽傳來的訊號「預測」未來的世界並提早準備。如果出生後的世界和預測不一樣，原本的準備就變成負擔。","s回饋迴路",["T",[["迴路","怎麼轉","怎麼打斷或利用"],["預測—不匹配迴路","胎兒期營養少 → 身體設定成節省模式 → 出生後食物充足 → 容易肥胖與代謝病","出生後避免過度餵養"],["跨代迴路","媽媽的健康 → 影響孩子 → 孩子長大再影響下一代","改善一代，受益不只一代"],["補救迴路","早期不利 → 之後良好的營養與環境 → 部分風險下降","早期不是命運"]]],"s所有策略 × 功效 × 團購產品（9 項）",["T",[["策略","怎麼做","功效","對應團購產品"],["孕前與孕期營養","葉酸、碘、鐵、DHA 等，依醫囑","支持胎兒正常發育","間接：002 E  天擇：留下最能生存繁殖的特徵\n│  ├─ 權衡：一個好處常伴隨一個代價\n│  ├─ 不匹配：身體適應的是過去的環境\n│  ├─ 防禦反應：發燒、咳嗽、疼痛、嘔吐\n│  ├─ 共同演化：人和病原互相競爭\n│  └─ 限制：演化只能改舊設計，不能重新設計\n├─ 機制（怎麼一步步發生）\n│  ├─ 過去的環境\n│  ├─ → 天擇塑造身體\n│  ├─ → 留下權衡與限制\n│  ├─ → 現代環境快速改變\n│  ├─ → 不匹配\n│  └─ → 現代常見疾病\n├─ 回饋迴路\n│  ├─ 軍備競賽：人體防禦 → 病原演化出對策 → 人體再演化\n│  ├─ 不匹配迴路：高熱量食物隨手可得 → 天生的「看到就吃」機制 → 過量 → 肥胖\n│  └─ 過度衛生假說：接觸微生物太少 → 免疫訓練不足 → 過敏與自體免疫增加\n├─ 策略\n│  ├─ 問「為什麼會有這個弱點」 → 理解疾病更深的原因\n│  ├─ 修正不匹配 → 讓現代生活靠近身體原本的設計\n│  ├─ 尊重防禦反應 → 不干擾身體的保護機制\n│  ├─ 抗藥性管理 → 減緩病原演化出抗藥性\n│  ├─ 設計環境 → 順著人性而不是對抗人性\n│  ├─ 接觸自然 → 支持免疫與節律\n│  └─ 規律活動 → 人體本來就設計成經常活動\n├─ 新舊差異\n│  ├─ 舊：只問「怎麼壞的」 ⇒ 新：也問「為什麼會有這個弱點」\n│  ├─ 舊：症狀都是壞的，要消除 ⇒ 新：有些症狀是有用的防禦\n│  ├─ 舊：身體是精密完美的設計 ⇒ 新：身體是充滿妥協的修修補補\n│  └─ 舊：疾病是異常 ⇒ 新：有些是正常機制遇到異常環境\n├─ 最高槓桿\n│  └─ 環境與身體設計之間的不匹配。\n├─ 測量與指標\n│  └─ 沒有專屬檢查；主要是提出假說，再用流行病學與實驗檢驗\n└─ 限制\n   ├─ 容易變成「想當然耳的故事」；需要可檢驗的假說。\n   ├─ 很難用實驗直接驗證\n   ├─ 容易編出聽起來合理的故事\n   ├─ 能解釋「為什麼」，不一定能告訴你「怎麼治」\n   └─ 「回到原始生活」的推論常過度簡化","s核心節點",["T",[["節點","白話","出問題會怎樣"],["天擇","留下最能生存繁殖的特徵","它不在乎你老了以後健不健康"],["權衡","一個好處常伴隨一個代價","例如強免疫伴隨自體免疫風險"],["不匹配","身體適應的是過去的環境","現代的飲食、久坐、光線讓身體出錯"],["防禦反應","發燒、咳嗽、疼痛、嘔吐","不舒服但有用，壓掉不一定好"],["共同演化","人和病原互相競爭","病原演化得比人快"],["限制","演化只能改舊設計，不能重新設計","所以留下一些不合理的構造"]]],"s機制","p過去的環境 → 天擇塑造身體 → 留下權衡與限制 → 現代環境快速改變 → 不匹配 → 現代常見疾病","p很多現代病不是身體「壞了」，而是身體在不熟悉的環境裡「照舊運作」。","s回饋迴路",["T",[["迴路","怎麼轉","怎麼打斷或利用"],["軍備競賽","人體防禦 → 病原演化出對策 → 人體再演化","所以沒有一勞永逸的抗生素"],["不匹配迴路","高熱量食物隨手可得 → 天生的「看到就吃」機制 → 過量 → 肥胖","改環境比靠意志力有效"],["過度衛生假說","接觸微生物太少 → 免疫訓練不足 → 過敏與自體免疫增加","適度接觸自然環境"]]],"s所有策略 × 功效 × 團購產品（7 項）",["T",[["策略","怎麼做","功效","對應團購產品"],["問「為什麼會有這個弱點」","在問「怎麼壞的」之外多問一層","理解疾病更深的原因","—"],["修正不匹配","多活動、多纖維、白天有光、晚上變暗","讓現代生活靠近身體原本的設計","間接：001 防藍光護目鏡、033 亞麻仁籽渣"],["尊重防禦反應","輕微的發燒、咳嗽不一定要立刻壓下來（依醫囑）","不干擾身體的保護機制","—"],["抗藥性管理","正確使用抗生素","減緩病原演化出抗藥性","—"],["設計環境","把不健康的選擇變得不方便","順著人性而不是對抗人性","—"],["接觸自然","戶外活動、接觸多樣環境","支持免疫與節律","—"],["規律活動","把活動放回日常","人體本來就設計成經常活動","—"]]],"s新舊差異",["T",[["舊模式","新模式"],["只問「怎麼壞的」","也問「為什麼會有這個弱點」"],["症狀都是壞的，要消除","有些症狀是有用的防禦"],["身體是精密完美的設計","身體是充滿妥協的修修補補"],["疾病是異常"," （Vikriti）→傳統評估→生活型態／飲食調整→重新評估。","s槓桿","p每日作息＋情境。","s限制","p三種身體能量（Dosha）≠基因。\n消化之火（Agni）≠粒線體。\n未消化殘留（Ama）≠現代醫學的毒素。\n傳統概念不能因為「很像」就直接宣稱是現代生物學實體。"]},{"t":"母體模型｜不要修結果，要找產生結果的上游系統","d":1,"g":"核心模型","s":"","b":["p你這個方向可以再精準一步：","p「母體」不是某一個基因。","p「母體」比較適合作為「產生Phenotype的多層生成系統」這個概念。","p最完整的生命生成鏈可以寫成：","pGenome｜基因組","p＝你有哪些DNA原始資訊","p↓","pEpigenome｜表觀基因組","p＝哪些基因比較容易被打開或關閉","p↓","pTranscriptome｜轉錄體","p＝目前真正轉錄出了哪些RNA","p↓","pProteome｜蛋白質體","p＝目前真正製造出了哪些蛋白質","p↓","pMetabolome｜代謝體","p＝細胞現在正在進行哪些代謝反應","p↓","pCellular Network｜細胞網路","p＝細胞彼此如何訊號傳遞、合作與調節","p↓","pTissue／Organ Network｜組織／器官網路","p＝不同器官如何互相影響","p↓","pEnvironment｜環境","p＝營養、活動、睡眠、壓力、毒物、微生物、社會環境等外部條件","p↓","pPhenotype｜表型","p＝最後真正看得到、量得到的身體狀態。","s國小版","pGenome＝總食譜。","pEpigenome＝今天哪些食譜可以翻開。","pTranscriptome＝今天抄出了哪些食譜。","pProteome＝真的做出了哪些工具。","pMetabolome＝廚房現在正在做哪些化學反應。","pCellular Network＝廚房裡的人怎麼合作。","pOrgan Network＝不同廚房怎麼合作。","pEnvironment＝食材、溫度、時間與外部條件。","pPhenotype＝最後端上桌的菜。","p所以：","p「菜不好吃」","p不一定只是菜本身的問題。","p你要一路往回找：","p菜","p←烹調","p←廚師合作","p←工具","p←工作單","p←食譜開關","p←總食譜","p＋外部環境。","p這就是：","pPhenotype","p↓反向追蹤","pGenerative Mechanism｜生成機制。","s傳統下游思維","p看到Phenotype。","p↓","p處理Phenotype。","p例如：","p血糖高→只盯血糖數字。","p發炎高→只盯發炎結果。","p肌力下降→只盯肌肉表現。","p這叫：","pOutput Intervention｜輸出端干預。","s上游生成思維","p看到Phenotype。","p↓","p問：","p「什麼系統正在持續產生這個結果？」","p↓","pOrgan Network","p↓","pCellular Network","p↓","pMetabolome","p↓","pProteome","p↓","pTranscriptome","p↓","pEpigenome","p↓","pGenome","p↕","pEnvironment。","p這叫：","pGenerative Mechanism Search｜生成機制搜尋。","s真正的重點","p不是：","p「越上游一定越好。」","p而是：","p「找到真正具有因果槓桿、可以安全改變、而且改變後能改善下游結果的Node。」","p因為有時問題就在下游。","p有時問題在代謝。","p有時問題在蛋白質。","p有時問題在基因調控。","p有時問題主要來自環境。","p所以不能看到所有疾病都直接跳到：","p「我要改基因。」","p真正高階的做法是：","pPhenotype","p→Backward Trace｜向上追蹤","p→Candidate Nodes｜找候選節點","p→Mechanism｜確認機制","p→High-weight Node｜找高權重節點","p→Intervention｜干預","p→Prediction｜事先預測結果","p→Measurement｜測量","p→Prediction Error｜比較預測與Reality","p→Model Update｜更新模型。","s因此「直達母體」可以正式定義","p直達母體","p≠","p神秘地喚醒沉睡基因。","p直達母體","p＝","p從Output Interventio 析。\n01｜本體：它認為「疾病／健康」到底是什麼？02｜單位：主要看疾病、器官、細胞、分子、網路、模式還是環境？03｜結構：核心節點有哪些？04｜機制：節點如何互相產生結果？05｜經典學說：最具代表性的理論是什麼？06｜代表書籍：哪些作品建立這套思想？07｜功能｜功效／用途：它最擅長解決什麼問題？08｜策略：實際怎麼判斷、怎麼介入？09｜槓桿：改哪裡通常最有價值？10｜限制：最容易在哪裡推論過頭？","r","s二｜01 西方主流臨床醫學","s本質","p疾病／以病理為中心的醫學。\n把疾病轉成可以定義、測量、鑑別、治療、追蹤的臨床疾病單位。","s核心結構","p病因→致病過程→病理→病理生理→徵象／症狀→診斷→分期／嚴重度→治療→結果。","s經典學說","p病原學說。\n細胞病理學。\n實證醫學。\n隨機對照試驗。\n臨床流行病學。","s代表經典","p《哈里遜內科學》。\n《Robbins病理學》。\n《Guyton生理學》。\nDavid Sackett等｜實證醫學。","s主要用途","p急救。\n感染。\n手術。\n癌症。\n器官疾病。\n藥物治療。\n明確診斷。","s策略","p症狀→鑑別診斷→檢查→診斷→治療指引→治療→追蹤監測。","s最高槓桿","p對已知疾病找到有證據的治療。","s限制","p病名標籤可能不足以解釋個體差異。\n單一時間點可能忽略變化軌跡。\n但不能誤解成「西醫只治症狀」。\n現代主流醫學本身也包含預防、基因體、系統生物學與生活型態醫學。","r","s三｜02 預防醫學","s本質","p不要等疾病出現才處理。\n核心＝風險管理。","s結構","p族群→危險因子→風險分層→初段預防→篩檢→早期發現→次段預防→結果。","s經典學說","p初段／次段／三段預防。\n流行病學。\n危險因子模型。\n族群預防。","s代表經典","pGeoffrey Rose｜《預防醫學的策略》。\n《Gordis流行病學》。","s用途","p疫苗。\n癌症篩檢。\n戒菸。\n血壓／血脂管理。\n職業健康。\n公共衛生。","s策略","p找風險→估絕對風險→分層→介入→追蹤發生率／死亡率。","s槓桿","p疾病發生之前。","s限制","p族群風險≠個人命運。\n過度篩檢可能造成偽陽性、過度診斷與過度治療。","r","s四｜03 生活型態醫學","s本質","p行為＝生物輸入。","s六大核心","p營養。\n身體活動。\n有恢復力的睡眠。\n壓力管理。\n正向社會連結。\n避免有害物質。","s結構","p每日行為→反覆暴露→生理→代謝→風險→外在表現。","s經典思想","p調整生活型態危險因子。\n行為改變。\n社會決定因素。","s代表書籍","p生活型態醫學相關臨床教材與ACLM體系教材。","s用途","p心血管風險。\n第二型糖尿病。\n肥胖。\n睡眠。\n慢性病預防與管理。","s策略","p基準值→選1–2個影響最大的行為→降低環境阻力→持續執行→生物標記／結果追蹤。","s槓桿","p頻率 × 持續時間。\n每天做的小事因為重複數千次，可以形成巨大累積效應。","s限制","p生活型態不是萬能治療。\n不能把癌症、感染、遺傳疾病、器官衰竭等全部歸因於生活方式。","r","s五｜04 功能醫學","s本質","p疾病之外再尋找功能失衡＋可改變的促成因素。","s核心結構","p時間軸。\n前置因素。\n誘發因素。\n持續因素／持續因素。\n七大矩陣節點：消化吸收。\n防禦／修復。\n能量。\n生物轉化（解毒）／排除。\n運輸。\n溝通。\n結構完整。","s經典框架","p功能醫學矩陣。\n前置／誘發／持續因素｜前置因素／誘發因素／持續因素。\n系統導向的臨床思考。","s代表教材","p曾強《功能醫學概論》。\nIFM功能醫學教材。","s用途","p整理複雜慢性問題。\n把生活型態、環境、生理放進同一張臨床地圖。","s策略","p外在表現→時間軸→矩陣→可能的功能失衡→可改變因素→介入→再測。","s槓桿","p瓶頸／持續因素。\n不是一定找「最深原因」，而是找持續讓問題存在且可改的因素。","s限制","p功能醫學內不同檢測與療法的證據差異很大。\n「根本原因」不能被誤解成每個慢性病都有唯一根因。","r","s六｜05 整合醫學","s本質","p治療整合。\n不是另一套分子生物學。","s結構","p常規醫療＋生活型態＋身心＋有證據參考的輔助方法→全人照護。","s經典思想","p全人醫學。\n以病人為中心的照護。\n醫病關係。","s代表人物／教材","pAndrew Weil等整合醫學體系教材。","s用途","p慢性病。\n疼痛。\n症狀管理。\n生活品質。\n支持性照護。","s策略","p安全第一→標準照護→可整合方法→證據／交互作用檢查→結果。","s槓桿","p讓不同治療方法互補而不是互斥。","s限制","p整合≠全部療法都有證據。\n「整合」不能成為降低證據標準的理由。","r","s七｜06 系統生物學／系統醫學","s本質","p生命不是零件集合。\n生命＝會互相影響的動態系統。","s核心結構","p節點。\n連線／關係。\n權重。\n網路。\n回饋。\n狀態。\n動態。\n湧現（整體冒出新性質）。\n擾動。\n吸引子（系統容易停留的狀態）。","s經典學說","p一般系統論。\n控制論。\n複雜系統。\n系統生物學。","s代表經典","pLudwig von Bertalanffy｜《一般系統論》。\nNorbert Wiener｜控制論。\nUri Alon｜《系統生物學導論》。","s用途","p複雜疾病。\n跨器官疾病。\n多體學整合。\n疾病機制建模。","s策略","p定義系統→畫出節點→畫出關係→權重→回饋→擾動→預測反應。","s槓桿","p不是最大節點。\n而可能是：樞紐。\n瓶頸。\n回饋迴路。\n控制點。","s限制","p模型愈複雜不代表愈正確。\n大量相關不等於因果。","r","s八｜07 網路醫學","s本質","p疾病＝網路擾動。","s核心","p節點。\n連線。\n樞紐。\n模組。\n疾病模組。\n網路距離。\n瓶頸。","s經典理論","p網路生物學。\n無尺度網路。\n疾病模組。\n交互作用體。","s代表經典","pAlbert-László Barabási等網路醫學相關研究與《網路科學》。","s用途","p疾病共病。\n藥物標靶。\n致病基因。\n路徑。\n老藥新用。","s策略","p疾病節點→交互作用體→模組→樞紐／瓶頸→標靶→網路反應。","s槓桿","p高中心性或高控制力節點。","s限制","p中心性≠臨床重要性。\n網路預測仍須實驗／臨床驗證。","r","s九｜08 分子醫學","s本質","p把疾病拆到分子。","s核心","pDNA。\nRNA。\n蛋白質。\n受體。\n酵素。\n訊號路徑。\n代謝物。","s經典學說","p中心法則。\n分子致病過程。\n訊號傳遞。","s代表經典","p《細胞分子生物學》｜Alberts等。\n《基因分子生物學》｜Watson等。","s用途","p癌症標靶。\n遺傳疾病。\n生物標誌。\n藥物機制。","s策略","p外在表現→分子路徑→標靶→擾動→反應。","s槓桿","p推動疾病的分子標靶。","s限制","p化約論（拆到最小看）。\n找到一個分子異常，不代表它就是整個疾病的原因。","r","s十｜09 基因體醫學","s本質","p基因組＝限制＋可能性。","s結構","p基因變異→基因→調控→路徑→風險／疾病。","s經典學說","p孟德爾遺傳學。\n族群遺傳學。\n全基因組關聯研究。\n多基因風險。\n藥物基因體學。","s代表經典","p《醫學遺傳學與基因體學》。","s用途","p罕見疾病。\n遺傳疾病。\n癌症基因體學。\n藥物基因體學。","s策略","p外在表現→家族史→適當的基因檢測→變異判讀→臨床上能不能採取行動。","s槓桿","p可採取行動的變異。","s限制","p帶有某基因≠外在表現。\n風險基因變異≠命運。\n關聯≠因果機制。","r","s十一｜10 表觀基因體學","s本質","p同樣DNA可以具有不同調控狀態。","s結構","pDNA甲基化。\n組蛋白修飾。\n染色質重塑。\n染色質開放程度。\n調控元件。\n轉錄因子結合。","s經典學說","p表觀遺傳調控。\n染色質生物學。\n發育表觀遺傳學。","s代表經典","pConrad Waddington｜表觀遺傳地景思想。\n現代表觀遺傳學教材。","s用途","p發育。\n癌症。\n老化。\n細胞身分。\n疾病研究。","s策略","p調控狀態→基因表現→細胞狀態→外在表現。","s槓桿","p可修改而又真正具有因果性的調控節點。","s限制","p表觀遺傳變化≠一定可逆。\n生活型態≠可以任意改寫DNA。\n相關非常容易被誤說成因果。","r","s十二｜11 轉錄體學","s本質","p不是問「有哪些基因」。\n而是問：「現在有哪些基因正在表現？」","s結構","pmRNA。\nmiRNA。\nlncRNA。\n選擇性剪接。\nRNA穩定度。\n單細胞轉錄體。","s經典基礎","p中心法則。\n基因調控。\nRNA生物學。","s用途","p細胞狀態。\n腫瘤分類。\n免疫狀態。\n單細胞生物學。","s策略","p組織／細胞→RNA全貌→表 在於：把功能醫學＋一般系統論＋心血管疾病放在一起。\n作者試圖從系統觀點重新討論：冠心病。\n高血壓。\n心肌缺血。\n心理因素。\n心血管疾病共同機制。\n疾病生成模型。\n它甚至提出建立「統一的功能醫學臨床模型」。\n所以對你的母體特別有價值。\n因為它不是：Disease→Drug。\n而比較接近：System Structure→Functional Disturbance→Shared Mechanism→Phenotype→Disease。\n清華大學出版社版本資料可確認2018年出版。","r","sB級｜2026中國大陸出版的重要功能醫學翻譯書","p05｜《功能医学：全面战胜慢性病的健康圣经》作者｜Jeffrey S. Bland｜杰弗里·S.布兰德。\n譯者｜王树岩。\n出版社｜北京科学技术出版社。\n中國大陸版｜2026年。\nISBN｜9787571451257。\n原著｜The Disease Delusion。\n這一本非常重要。\n因為Jeffrey Bland是現代功能醫學發展史的核心人物之一。\n中國大陸直到2026年才出版這個簡體中文版本。\n全書最重要的不是疾病分類。\n而是「七大核心生理過程」：01｜Assimilation & Elimination｜吸收與排泄。\n02｜Detoxification｜解毒。\n03｜Defense｜防禦。\n04｜Cellular Communication｜細胞溝通。\n05｜Cellular Transport｜細胞運輸。\n06｜Energy｜能量轉換與利用。\n07｜Structural Integrity｜結構完整性。\n這七個Domain幾乎就是你現在32 Node母體的上位分類之一。\n北京科技出版社版本資料顯示，本書於2026年出版，並以七大核心生理功能解釋慢性病的系統性失衡。","r","s作者地圖｜最值得追的中國功能醫學人物","p李绍清→中國本土功能醫學早期推廣與著書人物。\n→《功能医学》。\n→《功能医学概论：新的医学模式》。\n→偏向功能醫學＋系統觀＋中國本土化。\n中國功能醫學研究院自己的資料亦稱其較早進行中國功能醫學教育，並編寫相關教材；這屬機構自述，應與出版社、學術資料分開看待。\n曾强→《功能医学概论》主編。\n→偏向醫療專業教材化。\n→適合建立Clinical Functional Medicine臨床功能醫學母體。\n王树岩→《功能医学概论》參編者之一。\n→Jeffrey Bland《功能医学》中國大陸版譯者。\n→中國大陸功能醫學教育與傳播的重要人物之一。\nFMC官方資料稱王树岩為中國大陸第一位取得IFM認證者，並於2014年建立Functional MediC功能醫學平台；這同樣屬該機構官方自述。\n黄开斌→與李绍清共同編寫《功能医学概论：新的医学模式》。\n→偏向功能醫學整體醫學模型。\n耿世钊→《功能医学新思维破解心血管病难题》。\n→特色是Systems Theory一般系統論＋Functional Medicine功能醫學＋Cardiovascular Disease心血管疾病。","r","s如果按照你的32 Node母體，我會這樣排閱讀優先級","p第一順位｜曾强《功能医学概论》。\n用途＝建立中國功能醫學完整Domain骨架。\n第二順位｜李绍清《功能医学》。\n用途＝補Environment＋Gut＋Immune＋Hormone＋Mitochondria＋Mind–Body。\n第三順位｜Jeffrey Bland《功能医学》。\n用途＝建立國際功能醫學七大核心生理系統。\n第四順位｜李绍清、黄开斌《功能医学概论：新的医学模式》。\n用途＝建立Functional Medicine的思維方式與診斷框架。\n第五順位｜耿世钊《功能医学新思维破解心血管病难题》。\n用途＝學習如何把Systems Theory真正套到單一疾病群。","r","s把五本書疊起來，會形成一個很漂亮的中國功能醫學母體","pJeffrey Bland→國際功能醫學原始Framework。\n↓李绍清→中國本土化。\n↓曾强→教材化＋臨床化。\n↓王树岩→IFM系統導入＋教育傳播。\n↓耿世钊→系統論＋疾病專科應用。\n最後可以整合成：Genome｜基因＋Epigenome｜表觀調控＋Environment｜環境＋Nutrition｜營養＋Lifestyle｜生活型態＋Microbiome｜菌相＋Gut｜腸道＋Immune｜免疫＋Inflammation｜發炎＋Detoxification｜解毒＋Hormone｜荷爾蒙＋Neurotransmitter｜神經傳導＋Mitochondria｜粒線體＋Redox｜氧化還原＋Mind–Body｜身心↓Functional Imbalance｜功能失衡↓Network Disturbance｜系統網路失衡↓Phenotype｜表型↓Symptoms｜症狀↓Disease｜疾病。\n這其實正好支持你現在的核心方向：不要只從「疾病名稱」建立資料庫。\n應該反過來建立：Disease←Phenotype←Functional Imbalance←Pathway←Organ←Cell←Molecule←Environment／Lifestyle／Nutrition／Genome。\n換句話說：「病名」應該是母體的下游Node。\n「生成病名的系統」才應該是母體的上游Node。\n這五本書最有價值的地方，就是可以拿來與你現在的「功能醫學32 Node」逐Node交叉比對。\n下一階段最值得做的是：5本核心書×32 Node×器官×細胞×Pathway×Biomarker檢查指標×Symptoms×Disease×Intervention×你的團購產品＝「中國功能醫學32 Node MAX母體」。"]},{"t":"中國功能醫學五本核心書｜一頁比較表","d":3,"g":"書目與五書比較","s":"","b":[["T",[["書籍","作者／主編","年份","核心定位","核心內容","最值得學","對應32 Node重點","適合用途"],["①《功能医学》","李绍清","2014","中國本土功能醫學早期系統書","環境、營養、腸道、免疫、炎症、解毒、荷爾蒙、神經傳導、氧化壓力、粒線體、身心、老化","人體為何從功能失衡走向疾病","Gut腸道｜Immune免疫｜Inflammation發炎｜Detox解毒｜Hormone荷爾蒙｜Mitochondria粒線體｜Redox氧化還原｜Mind–Body身心","建立「功能失衡→疾病」母體"],["②《功能医学概论》","曾强主編","2016","中國功能醫學教材型總論","消化吸收、菌群、免疫炎症、解毒、生物轉化、荷爾蒙、神經傳導、氧化還原、粒線體、基因、營養、老化、慢病、臨床干預","最完整的中國功能醫學Domain骨架","幾乎橫跨32 Node，可作總索引","最適合當32 Node母教材"],["③《功能医学概论：新的医学模式》","李绍清、黄开斌","2016","功能醫學「思維模型」","生命本質、功能醫學模式、病史、體檢、系統思考、個體化分析","不是只問得什麼病，而是問為什麼這個人形成這個狀態","Observation觀察｜Pattern模式｜Root Cause根源｜System系統｜Diagnosis判讀｜Intervention介入","建立「診斷OS／思考OS」"],["④《功能医学新思维破解心血管病难题》","耿世钊","2018","功能醫學＋系統論＋心血管實戰","冠心病、高血壓、心肌缺血、心理因素、共同機制、系統模型","示範如何從Node網路重新理解一種疾病","Vascular血管｜Inflammation發炎｜Metabolism代謝｜Stress壓力｜Neuroendocrine神經內分泌","建立「疾病→機制網路」案例"],["⑤《功能医学：全面战胜慢性病的健康圣经》","Jeffrey S. Bland｜王树岩譯","2026簡中版","國際功能醫學核心框架","Assimilation吸收排泄｜Detoxification解毒｜Defense防禦｜Communication細胞溝通｜Transport運輸｜Energy能量｜Structural Integrity結構完整性","七大核心生理系統＋慢病網路模型","可作32 Node的「上位Domain」","建立國際版母體，與中國教材交叉驗證"],["【五本書最好背的差異】"],["①李绍清《功能医学》＝失衡了什麼？"],["②曾强《功能医学概论》＝人體有哪些功能系統？"],["③李绍清＋黄开斌＝功能醫學怎麼思考？"],["④耿世钊＝怎麼把系統模型套進疾病？"],["⑤Jeffrey Bland＝國際功能醫學的上位框架是什麼？"],["【五本書不是五套知識，而是五個層級】"],["⑤Bland｜Framework母體框架"],["↓"],["②曾强｜Domain系統分類"],["↓"],["①李绍清｜Mechanism功能失衡機制"],["↓"],["③李绍清＋黄开斌｜Diagnosis臨床判讀方法"],["↓"],["④耿世钊｜Disease Application疾病實戰"],["【整合後的功能醫學生成鏈】"],["Genome基因"],["→Environment環境"],["→Nutrition營養"],["→Lifestyle生活型態"],["→Microbiome菌相"],["→Gut腸道"],["→Immune免疫"],["→Inflammation發炎"],["→Detoxification解毒"],["→Hormone荷爾蒙"],["→Neurotransmitter神經傳導"],["→Redox氧化還原"],["→Mitochondria粒線體"],["→Metabolism代謝"],["→Cellular Communication細胞溝通"],["→Organ Function器官功能"],["→Functional Imbalance功能失衡"],["→Phenotype表型"],["→Symptoms症狀"],["→Disease疾病。"],["【與你32 Node母體最重要的整合方式】"],["不要按照「一本書＝一套系統」建立五套資料。"],["應該建立一套Canonical 32 Node。"],["每一本書都只是Evidence Source｜證據來源。"],["同一個Node同時吸收五本書的不同視角。"],["例如："],["N｜Mitochondria粒線體"],["→曾强＝基礎系統架構。"],["→李绍清＝功能失衡與慢病。"],["→Bland＝Energy能量Domain。"],["→耿世钊＝心血管疾病應用。"],["→李绍清＋黄开斌＝臨床判讀方法。"],["最後形成："],["5 Books"],["→去重"],["→Canonical 32 Nodes"],["→Mechanism機制"],["→Pathway路徑"],["→Organ器官"],["→Cell細胞"],["→Biomarker檢查指標"],["→Symptoms症狀"],["→Disease疾病"],["→Intervention介入"],["→Feedback回饋"],["→Retest複測。"],["【閱讀優先順序】"],["第一本｜曾强《功能医学概论》＝先搭骨架。"],["第二本｜Jeffrey Bland《功能医学》＝補國際上位框架。"],["第三本｜李绍清《功能医学》＝補失衡機制。"],["第四本｜李绍清、黄开斌＝補臨床思維。"],["第五本｜耿世钊＝學疾病實戰。"],["【一句話記住五本】"],["曾强搭「骨架」→Bland定「母體」→李绍清補「機制」→黄开斌補「判讀」→耿世钊做「疾病實戰」。"],["【最終母體】"],["不要建立「功能醫學書庫」。"],["建立「人體生成疾病的系統模型」。"],["書只是Source。"],["Node才是Knowledge Unit。"],["Relation才產生結構。"],["Mechanism才產生解釋。"],["Biomarker才讓模型可以被Reality檢驗。"],["Intervention＋Retest才形成真正可以持續更新的Functional Medicine OS。"]]]]},{"t":"曾強《功能醫學概論》｜營養素使用策略×機制總整理","d":3,"g":"曾強《功能醫學概論》","s":"","b":["s資料邊界","p《功能醫學概論》不是一本單純「營養素字典」。\n全書真正的結構是「七大生理失衡＋內環境＋基因＋營養＋慢病臨床應用」，營養素只是用來調節上游功能網路的工具。\n人民衛生出版社也明確把本書定位為從消化吸收、免疫炎症、解毒生物轉化、激素神經遞質、氧化還原、粒線體等系統展開干預。\n因此最重要的讀法不是「某病吃什麼」。\n而是：Assessment評估→找到Functional Imbalance功能失衡→找到Mechanism機制→判斷Nutrient Need營養需求→Diet First飲食優先→Targeted Nutrients針對性營養素→Retest複測。\n以下分成「書中公開內容可核實」與「依書中功能框架歸類」；不能把後者誤稱為逐字原書處方。","r","s一｜全書營養干預的總公式","p不是：Disease疾病→Supplement補充品。\n而是：Antecedent前置因素＋Trigger誘發因素＋Mediator媒介因素↓Functional Imbalance功能失衡↓Biochemical Pathway生化路徑異常↓Nutrient Demand營養需求改變↓Food＋Nutrients飲食與營養介入↓Function Restoration功能恢復。\n書中甚至把功能營養學的核心問題濃縮為：「何為害？」「以何利？」也就是先移除造成系統失衡的輸入，再增加支持系統恢復的輸入。","r","s二｜Vitamin A｜維生素A","p本質｜脂溶性維生素；Retinol視黃醇及相關活性物質。\n核心機制｜視覺循環＋上皮分化＋黏膜完整性＋免疫功能＋細胞分化。\n功能醫學定位｜Barrier屏障＋Immune免疫＋Cell Differentiation細胞分化。\n策略｜先判斷飲食攝取、吸收能力與脂肪消化狀況，再考慮補充。\n食物來源｜動物來源Retinol；植物β-carotene可轉換為Vitamin A。\n重要Error｜β-carotene與預形成Vitamin A不能完全視為相同。\n風險｜Vitamin A屬脂溶性維生素，長期過量具有毒性。\n原書第十一章確實單獨介紹Vitamin A，並說明Retinol與β-carotene來源差異。","r","s三｜Vitamin D｜維生素D","p本質｜不只是維生素，也具有Hormone-like signaling類荷爾蒙訊號功能。\n核心機制｜Calcium Homeostasis鈣恆定＋Bone骨代謝＋Immune Regulation免疫調節＋Gene Expression基因表達調節。\n功能醫學定位｜Bone骨骼＋Immune免疫＋Inflammation發炎＋Hormone荷爾蒙。\n策略｜不是「看到D就補」，而是：25-OH-D檢測→判斷不足程度→補充→複測。\n全書甚至另外設置「維生素D的臨床意義」專節，依序處理來源、吸收代謝、缺乏原因、危害、D3預防性應用、實驗室檢測、建議補充量與過量問題。\n重要Error｜Vitamin D是典型「不能只談功效、不談血中濃度」的營養素。","r","s四｜Vitamin E｜維生素E","p本質｜脂溶性抗氧化維生素。\n核心機制｜保護細胞膜脂質，降低Lipid Peroxidation脂質過氧化鏈式反應。\n功能醫學定位｜Redox氧化還原＋Membrane細胞膜＋Cardiovascular心血管。\n策略｜放在整體抗氧化網路理解，而不是孤立理解。\n核心鏈：ROS↑→Membrane Lipid Oxidation↑→Cell Damage↑。\nVitamin E→降低脂質氧化鏈式反應。","r","s五｜Vitamin C｜維生素C","p本質｜Water-soluble Antioxidant水溶性抗氧化營養素。\n核心機制｜電子供體＋抗氧化＋Collagen膠原形成＋支持部分酵素反應。\n功能醫學定位｜Redox＋Detox＋Connective Tissue。\n書中解毒章公開內容明確將Vitamin C列為提高／支持Glutathione抗氧化與解毒網路的重要營養素，並討論其護肝及解毒支持。\n所以不是：Vitamin C＝「防感冒」。\n而應理解成：Vitamin C→Redox Network→Glutathione Network→Detoxification Capacity。","r","s六｜B Vitamins｜B群","p核心本質｜不是單一「提神營養素」。\nB群更像Metabolic Cofactor Network｜代謝輔酶網路。\nB1｜Thiamine｜硫胺素。\n主要連結｜Carbohydrate Metabolism醣類代謝＋Energy能量。\nB2｜Riboflavin｜核黃素。\n主要連結｜FAD/FMN＋Redox＋Energy。\nB3｜Niacin｜菸鹼酸。\n主要連結｜NAD/NADP＋能量＋氧化還原。\nB5｜Pantothenic Acid｜泛酸。\n主要連結｜Coenzyme A輔酶A＋脂質／能量代謝。\nB6｜Pyridoxine｜維生素B6。\n主要連結｜Amino Acid Metabolism胺基酸代謝＋Neurotransmitter神經傳導物質＋Homocysteine同型半胱胺酸。\nB7｜Biotin｜生物素。\n主要連結｜Carboxylase羧化酶＋代謝。\nB9｜Folate｜葉酸。\n主要連結｜One-carbon Metabolism一碳代謝＋DNA合成＋Methylation甲基化＋Homocysteine。\nB12｜Cobalamin｜鈷胺素。\n主要連結｜Methylation＋神經功能＋紅血球＋Homocysteine。\n總公式：B群→Cofactors輔酶→Metabolic Flux代謝流→ATP／Methylation／Neurotransmitter／DNA。","r","s七｜Folate＋B6＋B12｜同型半胱胺酸策略","p這是書中非常重要的一個「不要看單一營養素，要看Pathway」案例。\nMethionine甲硫胺酸→Homocysteine同型半胱胺酸→Remethylation再甲基化／Transsulfuration轉硫化→Methionine或Cysteine。\nFolate＋B12→支持Remethylation。\nB6→支持Transsulfuration。\n所以：Hcy↑不能簡化成→「缺葉酸」。\n而要問：Folate？B12？B6？Methylation？Genetics？Kidney？Lifestyle？書中第十六章把Homocysteine獨立成一節，處理其與慢病關係、升高因素以及降低Hcy的功能醫學干預。","r","s八｜Glutathione｜谷胱甘肽GSH","p這是全書非常值得放進你32 Node核心的營養網路。\n本質｜主要細胞內Non-enzymatic Antioxidant非酵素抗氧化系統之一。\n核心機制①｜中和內源與外源Peroxides過氧化物。\n核心機制②｜參與Phase II Detoxification第二階段解毒。\n核心機制③｜與部分外源性化合物結合，協助生物轉化與排除。\n核心機制④｜維持Cellular Redox細胞氧化還原環境。\n原書還特別談到GST｜Glutathione S-transferase谷胱甘肽S轉移酶多態性與環境毒素易感性的關係。\n功能醫學真正的策略不是：GSH低→只補GSH。\n而是：Precursor前驅物＋Cofactor輔因子＋Synthesis合成＋Recycling再生＋Oxidative Load氧化負荷一起看。\n原書公開內容也指出普通口服GSH存在吸收限制，因此強調前驅物或促進自身合成的策略。","r","s九｜NAC／Cysteine Strategy｜半胱胺酸前驅策略","p放進書的GSH框架理解最清楚。\nNAC→Cysteine availability↑→GSH synthesis substrate↑→Glutathione Network↑→Redox／Detox支持。\n所以NAC的上位Node不是「化痰」。\n在功能醫學母體裡更重要的位置是：NAC→Cysteine→GSH→Redox→Detoxification。\n這也是為什麼「前驅物策略」有時比單純把終產物塞進去更符合系統思考。","r","s十｜Selenium｜硒","p本質｜Trace Element微量元素。\n核心機制｜Glutathione Peroxidase等Selenoproteins硒蛋白的功能元素。\n核心鏈：Selenium→GPx功能→Peroxide reduction→Redox Balance。\n功能醫學定位｜Antioxidant Network＋Thyroid＋Immune。\n它與GSH不是競爭關係。\n而是：GSH＝還原底物系統。\nGPx＝酵素。\nSelenium＝部分GPx功能所需元素。\n這就是Network Thinking。","r","s十一｜Zinc｜鋅","p本質｜大量酵素與轉錄調節蛋白所需微量元素。\n核心機制｜Enzyme Cofactor＋Immune＋Barrier＋DNA／Protein Synthesis。\n功能醫學定位｜Immune＋Gut Barrier＋Repair＋Gene Regulation。\n策略｜缺乏時補充有意義，但不能把「鋅參與很多功能」推論成「越高越好」。\n長期高量還必須注意Copper銅平衡。","r","s十二｜Magnesium｜鎂","p本質｜重要細胞內礦物質與酵素輔因子。\n核心機制｜ATP相關反應＋神經肌肉調節＋葡萄糖代謝＋電解質平衡。\n真正重要的結構：ATP並不是單獨裸露工作。\n大量ATP相關反應實際涉及Mg-ATP複合體。\n所以：Magnesium→ATP-dependent enzymes→Energy／Muscle／Nerve／Metabolism。\n功能醫學定位｜Energy＋Stress＋Glucose＋Neuromuscular。","r","s十三｜Calcium｜鈣","p核心機制｜Bone Mineralization＋Muscle Contraction＋Cell Signaling＋神經傳導。\n但功能醫學不能做：Calcium＝骨頭→大量補鈣。\n而應該看：Calcium↔Vitamin D↔Magnesium↔PTH↔Kidney↔Bone Remodeling。\n也就是「Node Network」而不是單一Node。","r","s十四｜Iron｜鐵","p核心機制｜Hemoglobin＋Myoglobin＋Electron Transport Chain。\n所以鐵同時連到：Oxygen Transport氧運輸＋Mitochondria粒線體＋Energy能量。\n但鐵也是Redox-active metal。\n過量可能增加氧化壓力。\n所以功能醫學策略應該是：CBC＋Ferritin＋Iron indices→判斷狀態→再決定是否補。\n而不是「疲勞→補鐵」。","r","s十五｜Omega-3 Fatty Acids｜Omega-3脂肪酸","pEPA｜Eicosapentaenoic Acid｜二十碳五烯酸。\nDHA｜Docosahexaenoic Acid｜二十二碳六烯酸。\n核心機制｜Cell Membrane細胞膜脂質組成＋Eicosanoid／Lipid Mediator脂質介質網路。\n功能醫學定位｜Inflammation＋Cardiovascular＋Brain＋Membrane。\n策略不是：Omega-3＝單純「消炎藥」。\n而是：Fatty-acid input→Membrane composition→Lipid mediator substrate pool→Inflammatory signaling pattern。\n書中特別把「攝取正確脂質」放在心血管功能營養的重要位置。","r","s十六｜Coenzyme Q10｜輔酶Q10","p本質｜Electron Transport Chain電子傳遞鏈的重要分子，同時參與抗氧化網路。\n核心機制：Nutrients→NADH/FADH₂→ETC→Proton Gradient→ATP。\nCoQ10參與電子傳遞。\n所以功能醫學定位不是只有「心臟保健」。\n而是：Mitochondria→Electron Transport→ATP Production→Energy Reserve。\n最適合掛：Mitochondria Node＋Cardiac Energy Node。","r","s十七｜Alpha-Lipoic Acid｜α-硫辛酸ALA","p本質｜與粒線體能量代謝及Redox Network相關。\n核心機制｜參與粒線體酵素系統＋氧化還原循環。\n功能定位：Mitochondria＋Glucose Metabolism＋Antioxidant Network。\n不要把ALA只理解成「抗氧化劑」。\n更好的理解：ALA→Mitochondrial Cofactor Network→Redox Recycling→Energy Metabolism。","r","s十八｜植物營養素｜Phytonutrients","p這是第十一章很重要的一整個上位類別。\n原書把植物營養素直接放入核心飲食計畫，並按顏色討論其功能與個體化飲食方案。\n主要不是：某一植物＝治某病。\n而是：Plant Diversity→Phytochemical Diversity→Multiple Signaling Pathways→Redox／Inflammation／Detox／Vascular Function。\n所以「彩虹飲食」真正的系統意義是：增加分子輸入的多樣性。","r","s十九｜Polyphenols｜多酚","p上位機制｜Cell Signaling＋Redox Regulation＋Inflammatory Pathways。\n功能醫學策略｜不是追求單一「超級抗氧化食物」。\n而是增加不同植物來源與不同植物化學物質。\n這與Complex System概念高度一致：Diversity↑→Functional Redundancy↑→Resilience↑。","r","s二十｜Carotenoids｜類胡蘿蔔素","p代表｜β-Carotene、Lutein、Zeaxanthin等。\n功能定位｜植物色素＋Redox＋視覺／組織保護。\n其中β-Carotene還涉及Vitamin A前驅路徑。\n因此不能把所有Carotenoids視為完全相同功能。","r","s二十一｜Flavonoids｜類黃酮","p功能定位｜植物訊號分子＋Redox／Inflammatory signaling調節。\n策略｜優先從多樣化蔬果、香料、植物性食物建立輸入。\n不是把所有效益簡化成ORAC「抗氧化數字」。","r","s二十二｜Sulfur-containing Phytochemicals｜含硫植物化學物","p主要來源概念｜十字花科、蔥蒜類等。\n核心功能定位｜Biotransformation生物轉化＋Detox Enzyme Network。\n這與第四章Phase I／Phase II解毒架構直接相連。\n原書的解毒模型明確區分Phase I功能化反應與Phase II結合反應，並強調氧化壓力與抗氧化防禦的耦合。","r","s二十三｜Amino Acids｜胺基酸策略","p不要把胺基酸只理解成「長肌肉」。\n它們還是：Neurotransmitter precursors。\nGlutathione precursors。\nDetox conjugation substrates。\nProtein repair substrates。\nEnergy substrates。\n所以：Protein Digestion→Amino Acid Pool→Protein／Enzyme／Neurotransmitter／Detox／Energy。\n這就是為什麼第二章「消化吸收」其實在營養素介入之前。\n如果吸收Node壞掉：吃進去≠吸收到。\n吸收到≠送進細胞。\n送進細胞≠成功利用。","r","s二十四｜Protein｜蛋白質","p策略不是單純算克數。\n先看：Digestion消化→Absorption吸收→Amino Acid Availability胺基酸可用性→Protein Synthesis蛋白合成→Repair修復。\n如果胃酸、胰酶、腸道、吸收有問題：Supplement Input↑不一定等於Cellular Availability↑。\n這正是功能醫學與「只看攝取量」最大的結構差異之一。","r","s二十五｜Fiber｜膳食纖維","p核心定位｜Gut Ecology腸道生態。\n路徑：Fiber→Microbial Fermentation→Metabolites→Colonocyte／Barrier／Immune signaling。\n所以纖維不只是「幫助排便」。\n它是：Diet→Microbiome→Metabolome→Host Physiology的重要橋梁。","r","s二十六｜Prebiotic Strategy｜益生元策略","p本質｜不是直接「補菌」。\n而是提供特定腸道微生物可利用底物。\n策略：Substrate→Microbial Selection→Community Structure→Metabolites→Host Response。\n因此：Probiotic＝加入微生物。\nPrebiotic＝改變微生物的生態資源。\n兩者不是同一Node。","r","s二十七｜Probiotic Strategy｜益生菌策略","p應放在第二章Gut／Microbiome框架，而不是萬用補充品。\n書中第二章依序處理消化吸收、腸道屏障、菌群與5R干預。\n真正的功能醫學邏輯：Remove→Replace→Reinoculate→Repair→Rebalance。\n也就是著名的5R框架。\n不是：腸胃不好→永遠補益生菌。","r","s二十八｜Detox Nutrient Network｜解毒營養網路","p這是最容易被錯誤簡化的地方。\n人體解毒不是「喝某個排毒產品」。\n而是：Phase I→Intermediate metabolites→Phase II Conjugation→Transport→Elimination。\n同時需要：Antioxidant Defense＋Amino Acids＋Micronutrient Cofactors＋Glutathione Network＋Gut／Bile／Kidney／Stool output。\n原書明確把Cytochrome P450、Phase I、Phase II、抗氧化防禦與GSH放在同一生物轉化架構中。","r","s二十九｜Mitochondrial Nutrient Network｜粒線體營養網路","p不要問：「哪一顆營養素增加粒線體？」應問：Fuel是否充足？Cofactors是否充足？ETC是否正常？Redox是否失衡？Oxidative Damage是否過高？Mitochondrial DNA是否受損？書中粒線體章確實依序討論糖、脂肪、胺基酸燃料、營養素、氧化壓力、粒線體損傷與介入。\n母體可寫成：Glucose／Fatty Acids／Amino Acids＋B Vitamins＋Minerals＋CoQ10＋Redox Network→TCA→ETC→ATP。","r","s三十｜Anti-inflammatory Nutrient Network｜抗炎營養網路","p原書第三章不是把慢性發炎視為一個單一開關。\n而是：Trigger→Innate Immune Activation→Inflammatory Mediators→Self-amplifying Loop→Chronic Inflammation。\n並且把「避免誘發因素＋生活方式＋功能營養素」並列為炎症管理。\n所以營養策略應是：Remove Trigger＋Gut Repair＋Fatty-acid Balance＋Phytonutrients＋Micronutrient Sufficiency＋Lifestyle。\n不是找一顆「抗炎神物」。","r","s三十一｜Methylation Nutrient Network｜甲基化營養網路","p核心Node：Folate。\nB12。\nB6。\nB2。\nMethionine。\nCholine／Betaine等一碳代謝來源。\n最重要概念：Methylation不是越高越好。\n而是Flux與Balance。\n功能醫學真正關心：Input→Enzyme→Cofactor→Genetic variation→Metabolite→Output。\n這也把第十章Nutrigenomics營養基因體學與第十六章Homocysteine連接起來。","r","s三十二｜營養基因體學策略","p全書非常重要但常被忽略的一層。\n同樣營養素：Person A≠Person B。\n因為：Genome＋SNP＋Epigenome＋Environment＋Diet＋Microbiome→Biochemical Individuality。\n書中第十章明確包含Nutrigenomics營養基因體學、飲食影響基因的機制以及Biochemical Individuality生化個體差異。\n所以功能醫學最高階的營養策略不是：「大家都吃同一套。」而是：Same Nutrient＋Different System State→Different Response。","r","s真正的一頁使用策略","p第一層｜先移除Damage Input。\n過敏／不耐食物｜過量精製糖｜不適合脂肪結構｜酒精｜毒物暴露｜其他個體誘發因素。\n第二層｜修復Digestion／Absorption。\n胃腸功能｜消化酵素｜膽汁｜腸道屏障｜菌群。\n第三層｜補足Basic Nutrients。\nProtein｜Essential Fatty Acids｜Vitamins｜Minerals。\n第四層｜修復Pathway。\nMethylation｜Redox｜Detox｜Mitochondria｜Inflammation｜Neurotransmitter。\n第五層｜針對High-weight Node。\n例如：GSH不足路徑→前驅物＋輔因子＋降低氧化負荷。\nHcy↑→Folate／B12／B6＋相關原因判讀。\nMitochondria低功能→Fuel＋Cofactors＋ETC＋Redox。\nInflammation↑→Trigger＋Gut＋Fatty acids＋Phytonutrients。\n第六層｜Biochemical Individuality。\n年齡｜飲食｜藥物｜吸收｜基因｜疾病｜腎肝功能｜生活方式全部改變需求。\n第七層｜Measurement。\n不要靠「吃了感覺很好」完成閉環。\nBaseline→Intervention→Symptoms＋Biomarkers→Retest→Dose／Strategy Update。","r","s曾強功能營養真正的母體公式","p不是：營養素→治疾病。\n而是：Environment環境＋Diet飲食＋Lifestyle生活型態＋Genome基因＋Microbiome菌相↓Biochemical Individuality生化個體差異↓Digestion／Absorption消化吸收↓Nutrient Availability營養素可用性↓Cofactor Network輔因子網路↓Metabolic Pathway代謝路徑↓Redox／Detox／Methylation／Mitochondria／Immune／Hormone↓Functional State功能狀態↓Phenotype表型↓Disease Risk疾病風險。\n所以真正值得灌進你的「32 Node功能醫學母體」的不是一張「疾病→營養素」表。\n而是建立：","sNutrient→Target Node→Pathway→Mechanism→Biomarker→Indication→Contraindication→Interaction→Dose Logic→Retest","p這樣你的團購產品之後也不應寫成：「Q10＝心臟。」「NAC＝抗氧化。」「B群＝精神。」而應升級成：Q10→ETC電子傳遞→ATP→Mitochondrial Node。\nNAC→Cysteine→GSH synthesis→Redox＋Detox Node。\nB2／B3／B5→Cofactor Network→Energy Metabolism Node。\nB6／B9／B12→One-carbon／Homocysteine Network→Methylation Node。\nEPA／DHA→Membrane Lipids→Lipid Mediators→Inflammation Node。\nVitamin D→VDR Signaling→Gene Regulation＋Immune／Bone Node。\n這才是《功能醫學概論》最值得轉成你Functional Medicine OS的部分。","s重要安全邊界","p以上不是個人補充劑處方。\n脂溶性Vitamin A、D等可因過量產生毒性，原書本身也特別提醒脂溶性維生素的累積與過量問題。\n真正進入個人使用時應再加入：劑量、型態、藥物交互作用、肝腎功能、孕期／疾病狀態與實驗室檢測，不能從「機制合理」直接跳成「越多越有效」。"]},{"t":"第一順位｜曾強《功能醫學概論》× 生命母體模型｜完整對應圖","d":3,"g":"曾強《功能醫學概論》","s":"","b":["s一｜先看整本書的總結構","p《功能醫學概論》","p│","p├─PART 1｜第一章｜功能醫學總論","p│  ├─起源","p│  ├─功能醫學是什麼","p│  ├─與臨床醫學關係","p│  ├─與中醫關係","p│  └─診療思維＋方法＋工具","p│","p├─PART 2｜第二～八章｜七大生理功能失衡","p│  ├─02 消化／吸收／菌群失衡","p│  ├─03 免疫／炎症失衡","p│  ├─04 解毒／生物轉化失衡","p│  ├─05 內分泌／激素失衡","p│  ├─06 氧化還原／粒線體失衡","p│  ├─07 循環運輸失衡／血脂異常","p│  └─08 結構性失衡","p│","p├─PART 3｜第九～十一章｜三大基礎條件","p│  ├─09 內環境穩態","p│  ├─10 整合基因組學","p│  └─11 功能營養學","p│","p└─PART 4｜第十二～十七章｜臨床Phenotype應用","d├─12 抗衰老\n├─13 慢性代謝性疾病\n├─14 女性性激素相關疾病\n├─15 兒童4-A相關問題\n├─16 其他慢性疾病\n└─17 病例分析","r","s二｜把曾強的書放進你的「母體模型」","p你的母體模型：","pGenome","p↕","pEpigenome","p↕","pTranscriptome","p↕","pProteome","p↕","pMetabolome","p↕","pCellular Network","p↕","pOrgan Network","p↕","pEnvironment","p＋Time","p↓","pPhenotype。","p《功能醫學概論》主要切入的位置是：","s上游條件","p第09章｜Environment＋Homeostasis","p第10章｜Genome＋Epigenome","p第11章｜Nutrition／Environment","p↓","s中游功能網路","p第02章｜Assimilation／Gut","p第03章｜Immune／Inflammation","p第04章｜Biotransformation","p第05章｜Hormonal Communication","p第06章｜Redox／Mitochondria／Energy","p第07章｜Transport","p第08章｜Structural Integrity","p↓","s下游Phenotype","p第12～16章","p老化","p代謝症候群","p糖尿病","p高血壓","p肥胖","p女性荷爾蒙相關問題","p兒童相關問題","p甲狀腺問題","p慢性疲勞等","p↓","sFeedback／Model Update","p第17章病例","pTimeline","p＋Matrix","p＋Testing","p＋Functional Analysis","p＋Intervention","p＋Follow-up。","r","s三｜七大生理失衡＝曾強版的核心Node群","p01｜消化／吸收／菌群","p↓","p主要母體位置：","pEnvironment","p→Gut／Organ Network","p→Cellular Network","p→Metabolome。","p白話：","p「東西吃進來之後，能不能消化、吸收，而且腸道生態是否正常？」","p核心Node：","pDigestion｜消化。","pAbsorption｜吸收。","pGut Barrier｜腸道屏障。","pMicrobiota｜菌群。","pGI Function｜胃腸功能。","p書中還進一步放入：","p生活方式干預＋5R等。","r","p02｜Immune／Inflammation｜免疫／炎症","p↓","p主要母體位置：","pEnvi
