更像：「功能醫學醫師的大腦作業系統」。","r","s三｜全書公開目錄主架構","p01｜生命的本質。\n02｜功能醫學的誕生。\n03｜什麼是功能醫學。\n04｜功能醫學的思想方法。\n05｜如何進行功能醫學實踐。\n06｜病史收集和體格檢查。\n07｜血生化和尿液檢測報告解讀。\n08｜功能醫學檢測及影像學檢測概況。\n09｜為什麼要發展功能醫學。\n公開書目可確認前八章及第九章開頭；以下解析以這些可核實目錄為基礎，不把未取得的全文內容冒充逐頁摘要。","r","s四｜CH01生命的本質","p公開目錄：第一節｜生命與健康。\n第二節｜生命與疾病。\n第三節｜生命的出現。\n第四節｜生命的搖籃。","s本體","p先回答：什麼叫生命？什麼叫健康？什麼叫疾病？","s結構","p這一章的重要性在於：如果你的「疾病本體論」錯了，後面的治療策略就會跟著錯。\n舊模型容易是：疾病＝某個零件壞掉。\n新模型試圖轉向：人體＝Dynamic System動態系統。\n健康不是：「完全沒有病名」。\n而可以進一步理解為：系統維持、調節、適應與恢復功能的能力。","s最大策略","p不要只問：「你有沒有病？」改問：「哪些功能已經開始偏離？」","sLifeOS轉譯","pState不是Destiny。\n目前的身體狀態只是系統現在所在的位置。","r","s五｜CH02功能醫學的誕生","p公開目錄：基因。\n基因表達。\n遺傳營養工程學。\n分子生物學。\n飲食影響基因表達。\n功能醫學出現。","s核心轉變","p舊模型：Gene→Disease。\n新模型：Genome×Gene Expression×Nutrition×Environment×Lifestyle→Phenotype。","s最重要Node","pGenome｜基因組。\nGene Expression｜基因表達。\nNutrition｜營養。\nEnvironment｜環境。\nPhenotype｜表型。","s核心策略","p不要看到基因風險就說：「這就是命。」應問：「基因在什麼環境條件下被表達？」","s白話","pDNA像食譜。\n有食譜≠每一道菜每天都做。\n真正重要的是：哪些頁被翻開。\n什麼時候翻開。\n翻開多久。\n其他調控條件如何。","s最大價值","p從Genetic Determinism基因決定論→Gene–Environment Interaction基因×環境互動。\n但要保留邊界：生活方式可能影響部分基因表達與調控，不代表所有遺傳疾病都能靠營養逆轉。","r","s六｜CH03什麼是功能醫學","p公開目錄：什麼是功能醫學。\n人類基因與醫學的未來。\n功能醫學——未來醫學典範。","s本體","p功能醫學真正改變的是：Unit of Analysis｜分析單位。\n傳統Disease Model主要分析：「這是哪個Disease？」功能醫學更常追問：「這個人有哪些功能網路失衡？」","s核心鏈","pPatient→History→Environment→Lifestyle→Genetics→Physiology→Functional Imbalance→Symptoms→Disease。","s策略","pDiagnosis不是終點。\nDiagnosis只是入口。\n例如：同樣三個人都有Fatigue疲勞。\nA可能偏向Iron deficiency。\nB可能偏向Sleep disruption。\nC可能偏向Thyroid dysfunction。\n同一Phenotype≠同一Mechanism。\n所以：Same Disease／Symptom→Different Mechanism→Different Strategy。","r","s七｜CH04功能醫學的思想方法","p公開目錄：新的醫學指導思想。\n醫療思想亟待轉變。\n功能醫學的思維方式。\n網狀互聯：複雜的人類機體。","s這是全書最重要的一章之一","p關鍵詞：Network Interconnection｜網狀互聯。\n人體不是：A→B→C。\n更接近：A↔B↔C↔D↔E。\nGut↔Microbiome↔Immune↔Inflammation↔Metabolism↔Hormone↔Brain。","s舊模式","p一個症狀→找一個原因。","s更新模式","p一個Phenotype可能由多個Node共同生成。\n同一Node也可能同時影響多個Phenotype。\n這就是：Many-to-One。\nOne-to-Many。","s最大策略","p不要先找「唯一原因」。\n先建立Network。\n再找：High-weight Node｜高權重節點。\nHigh-leverage Node｜高槓桿節點。","r","s八｜CH05如何進行功能醫學實踐","p公開目錄：功能醫學在臨床中的主要角色。\n如何在臨床中使用功能醫學。\n學會使用矩陣圖。\n病史收集：臨床醫生思維開始的地方。\n建立有效醫患關係。\n幫助患者改變不健康行為。\n功能醫學臨床流程。","s這是全書最值得轉成APP的一章","p核心不是「知道很多營養素」。\n而是建立Clinical Workflow｜臨床流程。","s策略01｜Matrix矩陣","p不要：Symptoms→Disease。\n改成：Symptoms↓Functional Systems↓Possible Mechanisms↓Antecedents／Triggers／Mediators↓Intervention。","s策略02｜Timeline時間軸","p不是只問：「今天哪裡不舒服？」而是建立：Birth→Childhood→Environment→Diet→Stress→Infection→Medication→Major Event→Symptom onset→Disease progression。\n因為現在的Phenotype可能是多年累積結果。","s策略03｜病史","p這本書直接把病史收集定位為臨床思維開始的地方。\n也就是：History不是行政資料。\nHistory是Model Building。","s策略04｜行為改變","p知道正確答案≠系統會改變。\nKnowledge→Motivation→Environment→Behavior→Repetition→Feedback才可能形成穩定改變。","r","s九｜CH06病史收集與體格檢查","p公開目錄：病史收集。\n體格檢查與相關病理。","s核心策略","pObservation First。\n不要一看到症狀就急著Explanation。\n先分開：Observation｜看到了什麼。\nInterpretation｜我怎麼解釋。\nHypothesis｜可能機制。\nEvidence｜什麼證據支持。\nTest｜怎麼驗證。","sLifeOS對應","pReality→Observation→Representation→Hypothesis→Prediction→Test。\n最大的Error就是：Observation與Interpretation混在一起。\n例如：Observation＝最近三個月每天凌晨3點醒。\nInterpretation＝我的腎上腺壞掉了。\n兩者不是同一件事。","r","s十｜CH07血生化與尿液檢測","p公開目錄：血生化及檢測。\n尿液分析。","s核心策略","pLab不是Truth。\nLab是Observation Window｜觀察窗口。\n真正流程：Marker→Context→Pattern→Mechanism Hypothesis→Clinical Correlation。","s錯誤模型","p一個數字異常＝找到根因。","s更新模型","p一個Biomarker只是整個Network的一個投影。\n例如：Glucose↑。\n不能直接停止在：「血糖高。」還可以追：Insulin？Diet？Sleep？Stress？Liver？Muscle？Activity？Medication？所以：Biomarker→Node→Relation→Network。","r","s十一｜CH08功能醫學檢測＋影像學","p公開目錄：功能醫學檢測概況。\n影像學檢查概括。","s最大策略","p不同檢查回答不同問題。\nStructural Test｜結構檢查。\n回答：「東西長什麼樣？」Functional Test｜功能檢查。\n回答：「系統怎麼運作？」Biochemical Test｜生化檢查。\n回答：「目前有哪些分子／代謝訊號？」Genetic Test｜基因檢查。\n回答：「有哪些相對穩定的遺傳變異？」不能把四者混為一談。","s核心公式","pStructure≠Function。\nGenotype≠Phenotype。\nMarker≠Disease。\nAssociation≠Causation。","r","s十二｜CH09為什麼發展功能醫學","p公開資料可確認其第一節為：「功能醫學與慢性疾病管理模式」。\n這直接指出本書的主要問題意識：慢性疾病很難只用Single Cause Model理解。\n慢性病往往涉及：時間累積。\n多因素。\n多系統。\n生活方式。\n環境。\n遺傳差異。\n代謝狀態。\n行為。\n所以它需要：Longitudinal Model｜縱向模型。\nNetwork Model｜網路模型。\nPersonalized Model｜個體化模型。","r","s十三｜全書最重要的8個策略","p01｜Timeline Strategy｜時間軸策略。\n現在症狀→往前找形成歷史。\n02｜Matrix Strategy｜矩陣策略。\n症狀→功能系統→機制→上游因素。\n03｜Network Strategy｜網路策略。\n不要只找單因果→建立Node Relation。\n04｜Root-mechanism Strategy｜上游機制策略。\n不要只壓下游Phenotype→尋找可介入機制。\n05｜Individualization｜個體化策略。\nSame Diagnosis≠Same Biology。\n06｜Measurement Strategy｜測量策略。\nHistory＋Physical Exam＋Lab＋Functional Test＋Imaging。\n07｜Behavior-change Strategy｜行為改變策略。\nIntervention只有真正進入生活才會產生Feedback。\n08｜Iterative Strategy｜迭代策略。\nAssessment→Hypothesis→Intervention→Response→Reassessment。","r","s十四｜我會再替這本書補上一個更嚴謹的現代版本","p書中的「根因」語言很容易被市場誤用。\n複雜系統疾病通常不一定存在一個唯一Root Cause。\n更精準應寫：Root Cause↓Upstream Causal Network｜上游因果網路。\n所以不要問：「到底是哪一個原因造成？」改問：「目前哪些Node＋Relation＋Weight共同維持這個Phenotype？」公式：Phenotype＝f(Genome, Environment, Diet, Microbiome, Metabolism, Immune, Hormone, Behavior, Time...)。\n真正要找的是：High-weight Nodes。\nHigh-leverage Relations。\nModifiable Variables。","r","s十五｜這本書最大的五個功效","p功效01｜把「病名思維」升級成「系統思維」。\n功效02｜把「單因果」升級成「網路生成」。\n功效03｜把「現在症狀」放回「生命時間軸」。\n功效04｜把「檢驗值」放回人體Context解讀。\n功效05｜把「治療一次」改造成「評估→介入→回饋→再評估」循環。\n所以它最大的功效不是某個Supplement。\n而是：重新訓練「怎麼看一個人」。","r","s十六｜對應你現在32 Node固定欄位","p這本書最適合灌入的不是Nutrition欄。\n而是以下欄位：Definition｜它是什麼。\nInput｜什麼形成目前狀態。\nOutput｜它影響什麼。\nRelation｜Node怎麼互聯。\nDysfunction Pattern｜失衡型態。\nSymptoms｜表型。\nBiomarker｜如何觀測。\nIntervention｜如何介入。\nFeedback／Retest｜如何驗證。\nOld Model｜舊醫療模型。\nUpdated Model｜更新模型。\nCommon Error｜常見誤判。\nPrediction｜介入後應發生什麼。\nPrediction Error｜沒發生代表什麼。\nHigh-leverage Point｜最高槓桿在哪。\nMinimal Action｜下一步最小行動。","r","s十七｜可以直接變成你的Functional Medicine OS","pINPUT｜輸入。\n病史＋症狀＋生活＋飲食＋環境＋壓力＋藥物＋檢查。\n↓TIMELINE｜時間軸。\n什麼時候開始？開始以前發生什麼？什麼讓它變嚴重？什麼讓它改善？↓MATRIX｜矩陣。\n把資料放進不同Functional Domains。\n↓NODE｜節點。\n找出可能失衡Node。\n↓RELATION｜關係。\n建立Node→Node網路。\n↓WEIGHT｜權重。\n哪些Node最可能解釋目前Phenotype？↓HYPOTHESIS｜假說。\n建立可被推翻的Mechanism Model。\n↓PREDICTION｜預測。\n如果模型正確，改X應該看到Y。\n↓INTERVENTION｜介入。\n優先選可逆＋低風險＋高槓桿項目。\n↓FEEDBACK｜回饋。\n症狀＋功能＋Biomarker。\n↓PREDICTION ERROR｜預測誤差。\n結果與Prediction差多少？↓MODEL UPDATE｜模型更新。\nNode錯？Relation錯？Weight錯？Timing錯？Measurement錯？Intervention錯？↓RETEST｜重新測試。","r","s十八｜一頁心智圖","p《功能醫學概論：新的醫學模式》→生命是什麼→健康／疾病是什麼→基因不是唯一命運→環境＋營養＋生活進入系統→人體是Network→症狀只是下游Phenotype→病史建立Timeline→Matrix建立系統地圖→檢查提供Evidence→建立Mechanism Hypothesis→找High-weight Node→選High-leverage Intervention→觀察Response→產生Prediction Error→重新修正Model。","r","s十九｜全書最好記的一句","p不要只問「這個人得了什麼病」。\n要繼續問「什麼樣的生命歷史、環境輸入與功能網路，生成了這個人現在看到的表型」。","r","s二十｜與你現在母體最關鍵的融合","p你現在的32 Node其實可以把這本書再往前推一步：書＝Source。\n症狀＝Signal。\n檢查＝Observation。\n病名＝Phenotype Classification。\nNode＝System Variable。\nRelation＝Structure。\nWeight＝Importance。\nMechanism＝Explanation。\nPrediction＝模型真正的考試。\nIntervention＝Experiment。\nFeedback＝New Evidence。\nPrediction Error＝Difference。\nModel Update＝Learning。\n所以真正的「新的醫學模式」不是換一批營養素。\n如果只是：藥物A→營養素A。\n藥物B→營養素B。\n那仍然是舊模型，只是換了產品。\n真正的模式轉換是：Disease→System。\nResult→Generation Mechanism。\nSingle Cause→Network。\nStatic Diagnosis→Dynamic State。\nTreatment→Experiment。\nAuthority→Evidence。\nCertainty→Updateability。\n最終公式：Reality→Observation→Timeline→Matrix→Canonical Node→Relation→Weight→Mechanism→Prediction→Intervention→Feedback→Prediction Error→Model Update→Retest。\n這才是這本書對你的「功能醫學32 Node母體」最大的價值：它提供的不是另一批知識，而是一套把人體資料轉換成可更新模型的操作語法。"]},{"t":"李紹清《功能醫學》｜2014｜功能失衡→疾病母體解析","d":3,"g":"李紹清《功能醫學》／《新的醫學模式》","s":"","b":["s資料定位","p作者｜李紹清。\n書名｜《功能医学》。\n出版｜2014。\n定位｜中國本土較早以系統方式介紹功能醫學的著作之一。\n核心主題可整理為：Environment環境→Nutrition營養→Gut腸道→Immune免疫→Inflammation炎症→Detoxification生物轉化／解毒→Hormone荷爾蒙→Neurotransmitter神經傳導→Redox氧化還原→Mitochondria粒線體→Mind–Body身心→Aging老化→Chronic Disease慢性疾病。","s資料邊界","p以下以本書可確認的主題架構為骨架，再依現代功能醫學／生理學重新Canonicalize。\n「Node、Weight、Prediction Error、Leverage」屬我們為Functional Medicine OS增加的分析層，不應冒充作者原書術語。","r","s一｜全書一句話","p不要等Disease出現才問：「哪個器官壞了？」而要往前追：Environment＋Nutrition＋Lifestyle↓Functional Systems失衡↓Cellular Dysfunction↓Symptoms↓Disease。\n所以這本書最適合放在你的：","s功能失衡→疾病生成母體","p。","r","s二｜全書核心大綱｜可重組成12大模組","pM01｜Environment｜環境。\nM02｜Nutrition｜營養。\nM03｜Gut／Digestion｜腸道／消化吸收。\nM04｜Immune｜免疫。\nM05｜Inflammation｜炎症。\nM06｜Detoxification｜生物轉化／解毒。\nM07｜Hormone｜荷爾蒙。\nM08｜Neurotransmitter｜神經傳導。\nM09｜Redox｜氧化還原。\nM10｜Mitochondria｜粒線體。\nM11｜Mind–Body｜身心互動。\nM12｜Aging／Chronic Disease｜老化／慢性病。\n最好背：「環－營－腸－免－炎－解－荷－神－氧－粒－心－老。」","r","s三｜全書真正的生成鏈","pEnvironment＋Diet＋Lifestyle＋Stress＋Genetic Susceptibility↓Gut／Barrier／Microbiome↓Immune Regulation↓Inflammation↓Detoxification＋Redox↓Hormone＋Neurotransmitter Signaling↓Mitochondrial Energy↓Cellular Function↓Organ Function↓Functional Imbalance↓Symptoms↓Chronic Disease↓Aging／Loss of Reserve。\n注意：這不是固定單向因果鏈。\n真正模型應是Network：Gut↔Immune↔Inflammation↔Redox↔Mitochondria↔Hormone↔Brain。","r","s四｜M01 Environment｜環境","s本體","p身體不是封閉系統。\n每天都與外界交換物質、訊息與能量。","s核心Node","pExposure｜暴露。\nAir｜空氣。\nWater｜水。\nFood｜食物。\nChemical Exposure｜化學暴露。\nOccupation｜職業環境。\nLifestyle Environment｜生活環境。","s機制","pExternal Exposure→Absorption／Inhalation／Ingestion→Biological Interaction→Detox／Immune／Hormonal／Redox Load→Functional Response。","s策略","pExposure History｜暴露史。\nSource Identification｜找來源。\nReduce Avoidable Exposure｜降低可避免暴露。\n再談後續營養與生理支持。","s最大槓桿","pRemove／Reduce Driver。\n白話＝水龍頭還一直漏水，不要只忙著擦地板。","s果效","p降低持續進入系統的負荷。","s限制","p不能看到非特異症狀就宣稱「毒素累積」。\nExposure必須盡量具體化與可驗證。","r","s五｜M02 Nutrition｜營養","s本體","pNutrition不是「吃保健品」。\n它是人體所有代謝網路的重要Input。","s核心Node","pMacronutrients｜巨量營養素。\nMicronutrients｜微量營養素。\nPhytonutrients｜植物營養素。\nCofactors｜輔因子。\nEnergy Balance｜能量平衡。","s機制","pFood→Digestion→Absorption→Nutrient Pool→Enzyme／Cofactor→Metabolic Pathway→Cell Function。","s策略","pFood First。\nDietary Pattern First。\nCorrect Deficiency。\n再依Mechanism考慮Targeted Supplement。","s最大槓桿","pDiet Pattern。\n因為每天重複。","s果效","p一個飲食介入可能同時影響Gut、Metabolism、Inflammation、Redox、Mitochondria。","s限制","pMechanism成立≠補充高劑量就有臨床效果。","r","s六｜M03 Gut｜腸道","s本體","p腸道不是單純消化管。\n它同時涉及：Digestion。\nAbsorption。\nBarrier。\nMicrobiome。\nImmune Interface。\nElimination。","s核心Node","pDigestion｜消化。\nAbsorption｜吸收。\nGut Barrier｜腸屏障。\nMicrobiome｜菌相。\nMotility｜腸道蠕動。\nElimination｜排泄。","s機制","pDiet→Digestion→Microbial／Host Metabolism→Absorption→Barrier→Immune Signaling→Systemic Effects。","s策略","p判斷：Remove。\nReplace。\nReinoculate。\nRepair。\nRebalance。","s最大槓桿","pDiet＋Barrier＋Microbiome Ecology。","s果效","p改善營養可用性與腸道－免疫界面。","s限制","p不能把所有全身疾病都歸因於「腸漏」。","r","s七｜M04 Immune｜免疫","s本體","p免疫健康≠免疫越強越好。\n真正目標：Appropriate Defense＋Tolerance＋Resolution。","s核心Node","pInnate Immunity｜先天免疫。\nAdaptive Immunity｜適應性免疫。\nTolerance｜免疫耐受。\nBarrier Defense｜屏障防禦。","s機制","pThreat→Recognition→Immune Activation→Response→Resolution／Memory。","s策略","p找Trigger。\n維持Barrier。\n改善睡眠、營養、活動等免疫背景。\n針對真正疾病進行醫療處理。","s最大槓桿","pPersistent Trigger＋Immune Regulation。","s果效","p降低不必要的持續免疫活化。","s限制","p「調節免疫」不能取代感染、自體免疫疾病或免疫缺陷的正式診療。","r","s八｜M05 Inflammation｜炎症","s本體","pInflammation本來是保護與修復反應。\n問題不是：有沒有Inflammation。\n而是：能不能在任務完成後Resolution。","s核心Node","pTrigger。\nCytokines。\nInflammatory Signaling。\nResolution。\nRepair。","s機制","pTrigger→Immune Activation→Inflammatory Mediators→Defense／Repair→Resolution。\n若Trigger持續或Resolution失衡：→Chronic Inflammatory State。","s策略","p不要只找「抗炎產品」。\n先找：Trigger在哪？Adiposity？Smoking？Infection？Metabolic Dysfunction？Sleep？Diet？其他疾病？","s最大槓桿","pRemove Driver＋Restore Resolution。","s果效","p可能同時改善多個下游系統負荷。","s限制","pCRP等指標是Signal，不是單獨的根因證明。","r","s九｜M06 Detoxification｜生物轉化／解毒","s本體","p更精準名稱：Biotransformation＋Transport＋Elimination。","s核心Node","pExposure。\nPhase I。\nPhase II。\nGlutathione。\nLiver。\nKidney。\nBile。\nGut Elimination。","s機制","pCompound→Phase I modification→Intermediate→Phase II conjugation→Transport→Excretion。","s策略","p①降低暴露。\n②維持正常肝腎功能。\n③確保營養與蛋白質供應。\n④維持排便與膽汁／尿液排泄。\n⑤有臨床指徵才做特定介入。","s最大槓桿","pReduce Exposure。","s果效","p降低持續暴露並支持正常生物轉化。","s限制","p不能把Detox變成「排毒療法萬能論」。","r","s十｜M07 Hormone｜荷爾蒙","s本體","pHormone是Communication System。\n不能只看「高／低」。","s核心Node","pSignal。\nReceptor。\nSensitivity。\nRhythm。\nFeedback。\nHPA Axis。\nThyroid Axis。\nInsulin Signaling。\nSex Hormones。","s機制","pHormone→Receptor→Intracellular Signal→Cell Response→Negative／Positive Feedback。","s策略","pSignal→Receptor→Timing→Feedback→Target Tissue。\n全部一起看。","s最大槓桿","pFeedback Loop。","s果效","p從單一濃度判讀升級為內分泌調控網路。","s限制","p功能醫學不能依非標準推論自行診斷所謂「荷爾蒙耗竭」。","r","s十一｜M08 Neurotransmitter｜神經傳導","s本體","pBrain功能不是只有某一種神經傳導物「太少」。","s核心Node","pSerotonin｜血清素。\nDopamine｜多巴胺。\nGABA｜γ-胺基丁酸。\nGlutamate｜麩胺酸。\nNorepinephrine｜正腎上腺素。","s機制","pPrecursor→Synthesis→Storage→Release→Receptor Binding→Reuptake／Degradation。\n任何一段都可能改變Signal。","s策略","p先看：Sleep。\nStress。\nMedication。\nNutrition。\nPsychological Context。\nNeurological／Psychiatric Disease。\n再談特定營養支持。","s最大槓桿","pWhole Network＋Behavior。","s果效","p避免「一種情緒＝缺一種神經傳導物」的過度簡化。","s限制","p不能用尿液神經傳導物等單一非標準檢驗直接推定腦內濃度。","r","s十二｜M09 Redox｜氧化還原","s本體","pRedox不是：氧化＝壞。\n抗氧化＝好。\n真正目標是：Redox Balance。","s核心Node","pROS｜Reactive Oxygen Species｜活性氧。\nAntioxidant Defense｜抗氧化防禦。\nGSH｜Glutathione｜谷胱甘肽。\nSOD｜Superoxide Dismutase｜超氧化物歧化酶。\nGPx｜Glutathione Peroxidase｜谷胱甘肽過氧化酶。","s機制","pROS Production↔Antioxidant Capacity。\n失衡：ROS generation＞Defense／Repair capacity→Oxidative Damage。","s策略","p先降低ROS Driver。\n再確保內源抗氧化系統所需營養。","s最大槓桿","pReduce Oxidative Load＋Restore Endogenous Defense。","s果效","p保護Protein／Lipid／DNA與細胞功能。","s限制","p大量外源抗氧化劑≠一定更健康；ROS也具有正常Signal功能。","r","s十三｜M10 Mitochondria｜粒線體","s本體","p粒線體是能量轉換與細胞訊號的重要中心。","s核心Node","pFuel Metabolism。\nTCA Cycle。\nETC。\nATP。\nMitochondrial Redox。\nMitochondrial Quality Control。","s機制","pGlucose／Fat／Amino Acids→Acetyl-CoA→TCA→NADH／FADH₂→ETC→Proton Gradient→ATP。","s策略","pFuel。\nCofactors。\nMovement。\nSleep／Recovery。\n處理疾病。\n降低不必要氧化與代謝負荷。","s最大槓桿","pMovement＋Metabolic Health＋Recovery。","s果效","p改善Energy Capacity與Metabolic Flexibility。","s限制","p疲勞≠一定是「粒線體壞掉」。\n必須排除貧血、甲狀腺、睡眠、感染、藥物、心肺疾病等。","r","s十四｜M11 Mind–Body｜身心","s本體","p心理狀態可以透過可測量的生理路徑影響身體。","s核心Node","pPerception。\nThreat Prediction。\nANS。\nHPA Axis。\nSleep。\nBehavior。","s機制","pEvent→Representation→Threat Appraisal→ANS／HPA→Hormonal／Autonomic Response→Sleep／Behavior／Metabolism→Body State。","s策略","pStress Regulation。\nSleep。\nExercise。\nSocial Support。\nPsychological Intervention。\nBehavior Change。","s最大槓桿","pRepresentation＋Behavior＋Recovery。","s果效","p可能同時改變神經內分泌、睡眠、行為與代謝。","s限制","p不能把器質性疾病心理化。","r","s十五｜M12 Aging｜老化","s本體","pAging不是單一Node。\n它是多系統長時間累積後的Emergent Phenotype｜湧現表型。","s核心Node","pMitochondrial Function。\nInflammation。\nMetabolic Health。\nProtein／Structure。\nRepair。\nPhysical Reserve。\nCognitive／Social Function。","s機制","pTime＋Damage＋Repair Capacity＋Lifestyle＋Disease→Reserve下降→Frailty／Disease Risk上升。","s策略","p不是追求「抗老神物」。\n而是維持：Muscle。\nCardiorespiratory Fitness。\nMetabolic Health。\nNutrition。\nSleep。\nCognitive／Social Engagement。\n疾病風險管理。","s最大槓桿","pFunctional Reserve｜功能儲備。","s果效","p目標從「不老」改成：延長Healthspan｜健康壽命。","s限制","p沒有任何單一營養素可以停止生物老化。","r","s十六｜12模組一頁比較表",["T",[["模組","核心問題","High-weight Node","主要機制","第一策略","最大槓桿","最大果效","主要限制"],["M01 Environment","外界什麼一直進來？","Exposure","暴露→生物負荷","找來源","Reduce Exposure","降低上游負荷","不能泛化「毒素」"],["M02 Nutrition","原料夠不夠、對不對？","Nutrient Pattern","食物→代謝","Food First","Diet Pattern","多Node同步改善","補充≠治療"],["M03 Gut","能否消化吸收？","Barrier／Microbiome","腸→免疫／代謝","修復腸道功能","Diet＋Barrier","改善Input","腸漏非萬病之源"],["M04 Immune","敵我辨識正常嗎？","Regulation","Recognition→Response","找Trigger","Regulation","防禦平衡","不能只求Boost"],["M05 Inflammation","為何反應停不下來？","Trigger／Resolution","Trigger→Inflammation","去Driver","Break Loop","降低慢性負荷","Marker≠Cause"],["M06 Detox","怎麼處理外源物？","Exposure／Liver","Phase I→II→排泄","先減暴露","Exposure","降低處理負荷","Detox不能神化"],["M07 Hormone","訊號傳得對嗎？","Feedback","Signal→Receptor","看整個軸","Feedback","恢復調控","不能只看單值"],["M08 Neuro","腦訊號如何調節？","Network","合成→受體→回收","看睡眠壓力藥物","Network","神經調控","不能一情緒一分子"],["M09 Redox","氧化還原平衡嗎？","GSH／ROS","ROS↔Defense","降負荷","Endogenous Defense","保護細胞","抗氧化非越多越好"],["M10 Mitochondria","ATP怎麼產生？","ETC／ATP","Fuel→TCA→ETC","修復代謝背景","Movement","能量儲備","疲勞非等於粒線體病"],["M11 Mind–Body","心理如何進入身體？","ANS／HPA","Appraisal→Physiology","壓力＋睡眠＋行為","Recovery","多系統改善","不可心理化疾病"],["M12 Aging","為何儲備下降？","Functional Reserve","Damage↔Repair","維持儲備","Muscle＋Fitness","Healthspan","無單一抗老解法"],["━━━━━━━━━━━━━━━━━━"],["【十七｜這本書最大的六大策略】"],["S1｜Upstream First。"],["先找上游Driver。"],["S2｜Remove Before Add。"],["先降低持續傷害，再增加支持。"],["S3｜Food First。"],["先處理長期飲食Pattern，再談補充品。"],["S4｜Network Thinking。"],["Node不能單獨判讀。"],["S5｜Individualization。"],["Same Disease≠Same Mechanism。"],["S6｜Restore Function。"],["目標不只是讓症狀消失，而是恢復系統調節能力。"],["━━━━━━━━━━━━━━━━━━"],["【十八｜最大的六個果效】"],["①把Disease往前追到Functional Dysfunction。"],["②把器官問題升級成System Network。"],["③把單一症狀拆成多個Possible Mechanisms。"],["④把營養素從「產品」放回Biochemical Pathway。"],["⑤把慢病理解成長時間累積的Network State。"],["⑥把治療目標從Disease Control延伸到Functional Reserve。"],["━━━━━━━━━━━━━━━━━━"],["【十九｜最大的七個限制】"],["L1｜Functional Medicine Framework不是所有疾病已證實的因果模型。"],["L2｜Association不能自動升級成Causation。"],["L3｜Mechanistic Plausibility不能取代Clinical Outcome Evidence。"],["L4｜非特異症狀不能任意貼上「毒素、腸漏、粒線體失衡」。"],["L5｜更多Supplement不等於更好的Systems Medicine。"],["L6｜更多Lab不等於更多有效Information。"],["L7｜急症、感染、癌症、嚴重器官疾病等仍需依循標準醫療診斷與治療。"],["━━━━━━━━━━━━━━━━━━"],["【二十｜真正的Leverage公式】"],["Leverage"],["＝Causal Importance"],["×Modifiability"],["×Reach"],["×Expected Effect"],["÷Risk／Cost／Friction。"],["白話："],["真正高槓桿不是「最厲害的產品」。"],["而是："],["真的重要"],["＋真的改得動"],["＋一次影響很多Node"],["＋效果值得期待"],["＋風險成本合理。"],["━━━━━━━━━━━━━━━━━━"],["【二十一｜槓桿優先順序】"],["Level 1｜Safety。"],["先排除急症與重大疾病。"],["↓"],["Level 2｜Major Driver。"],["吸菸、酒精、重大暴露、嚴重睡眠不足、疾病等。"],["↓"],["Level 3｜Foundation。"],["Diet＋Exercise＋Sleep＋Stress＋Body Composition。"],["↓"],["Level 4｜System Dysfunction。"],["Gut＋Metabolism＋Immune＋Hormone＋Mitochondria等。"],["↓"],["Level 5｜Deficiency。"],["真正缺乏的營養素。"],["↓"],["Level 6｜Targeted Supplement。"],["有Target＋Mechanism＋Evidence才使用。"],["↓"],["Level 7｜Retest。"],["Reality決定是否繼續。"],["━━━━━━━━━━━━━━━━━━"],["【二十二｜最重要的新舊模式差異】"],["舊｜Disease是起點。"],["新｜Disease常是下游Phenotype。"],["舊｜一病找一因。"],["新｜Causal Network。"],["舊｜一症狀找一產品。"],["新｜Symptom→Node→Mechanism。"],["舊｜腸道只是消化。"],["新｜Gut＝Digestion＋Barrier＋Microbiome＋Immune Interface。"],["舊｜免疫越強越好。"],["新｜免疫需要Defense＋Tolerance＋Resolution。"],["舊｜炎症一定不好。"],["新｜正常炎症是防禦；問題是慢性持續與Resolution失衡。"],["舊｜Detox＝排毒產品。"],["新｜Exposure→Biotransformation→Elimination。"],["舊｜Hormone只看高低。"],["新｜Signal＋Receptor＋Rhythm＋Feedback。"],["舊｜抗氧化越多越好。"],["新｜Redox Balance。"],["舊｜疲勞＝缺能量。"],["新｜Fatigue是多機制Phenotype。"],["舊｜心理與身體分開。"],["新｜Mind→ANS／HPA→Behavior→Physiology。"],["舊｜老化只能接受。"],["新｜不能停止時間，但可管理Functional Reserve與Healthspan。"],["━━━━━━━━━━━━━━━━━━"],["【二十三｜對應你的32 Node母體】"],["這本書最適合做："],["「中層Mechanism母體」。"],["Bland七大Domain＝上位分類。"],["↓"],["李紹清12模組＝功能失衡機制層。"],["↓"],["Canonical 32 Nodes＝標準節點層。"],["↓"],["Cell／Molecule／Pathway＝機制層。"],["↓"],["Biomarker＝Reality觀測層。"],["↓"],["Disease＝下游Phenotype。"],["所以三本書其實可以直接疊起來："],["Bland"],["＝七大上位Domain。"],["↓"],["曾強"],["＝中國教材式系統分類。"],["↓"],["李紹清"],["＝功能失衡→疾病生成機制。"],["↓"],["32 Nodes"],["＝統一Canonical Knowledge Layer。"],["━━━━━━━━━━━━━━━━━━"],["【二十四｜最終母體】"],["Genome"],["＋Epigenome"],["＋Environment"],["＋Nutrition"],["＋Lifestyle"],["＋Stress"],["＋Microbiome"],["＋Time"],["↓"],["Gut"],["↔Immune"],["↔Inflammation"],["↔Detoxification"],["↔Hormone"],["↔Neurotransmission"],["↔Redox"],["↔Mitochondria"],["↔Mind–Body"],["↓"],["Cellular Function"],["↓"],["Organ Function"],["↓"],["Functional Reserve"],["↓"],["Phenotype"],["↓"],["Symptoms／Disease／Aging。"],["━━━━━━━━━━━━━━━━━━"],["【二十五｜最後再升級成LifeOS】"],["不要停在："],["「哪個Node失衡？」"],["繼續："],["Reality"],["→Observation"],["→12 Functional Modules"],["→32 Canonical Nodes"],["→Relation"],["→Mechanism"],["→Evidence"],["→Weight"],["→High-leverage Node"],["→Prediction"],["→Minimum Intervention"],["→Feedback"],["→Retest"],["→Prediction Error"],["→Reweight"],["→Model Update。"],["【全書最好記的一句】"],["不要只修疾病最後出現的結果。"],["沿著「環境→營養→腸道→免疫→炎症→解毒→荷爾蒙→神經→氧化還原→粒線體→身心→老化」一路往上游追，找到真正有證據、可修改、影響範圍最大的節點。"],["【國小版一句話】"],["身體不像一台只有一個零件壞掉的機器。"],["它比較像一座城市："],["腸道是海關。"],["免疫是警察。"],["發炎是消防隊。"],["肝腎解毒排泄是垃圾處理系統。"],["荷爾蒙和神經是通訊網。"],["血液是運輸系統。"],["粒線體是發電廠。"],["肌肉骨骼是建築結構。"],["真正的功能醫學不是看到哪裡冒煙就一直滅火，而是找出「哪個系統一直讓火重新燒起來」，先處理最高槓桿的地方。"]]]]},{"t":"《功能醫學新思維破解心血管病難題》｜耿世釗｜2018","d":3,"g":"耿世釗《功能醫學新思維破解心血管病難題》","s":"","b":["s一句話定位","p這本書最值得學的，不是「心血管病有哪些營養素可以吃」，而是示範如何把冠心病、高血壓、心肌缺血等「疾病名稱」重新拆成一個多節點、多回饋、多時間尺度的系統問題。","s資料邊界","p以下以可核實的公開書目與本書已公開的主題架構為骨架，再用系統醫學語言重新整理。\n沒有取得全書逐頁文字的部分，我不把推導內容冒充作者逐字主張。","r","s一｜本體層｜這本書到底在處理什麼？","p表面問題＝Cardiovascular Disease｜心血管疾病。\n真正問題＝為什麼不同生理、心理與環境變數最後會收斂成相似的心血管Phenotype。\n傳統分類容易變成：高血壓＝一種病。\n冠心病＝另一種病。\n心肌缺血＝另一種病。\n本書的系統視角則更接近：不同Disease Labels←可能共享部分Common Mechanisms←多個System Nodes長期互動。\n因此真正的分析單位從：Disease Name病名升級為：System State系統狀態。","r","s二｜全書核心大綱可壓成八大模組","pM01｜現代心血管疾病的困境。\n核心問題＝為什麼知道很多Risk Factors，心血管疾病仍然難以完全解決？M02｜功能醫學的新思維。\n核心問題＝疾病是否只是器官局部故障，還是整體功能網路的下游表現？M03｜General Systems Theory｜一般系統論。\n核心問題＝人體不同系統如何互相作用、形成回饋與整體行為？M04｜Cardiovascular Functional Network｜心血管功能網路。\n核心問題＝血管、心臟、代謝、神經、內分泌、心理等如何耦合？M05｜Coronary Heart Disease｜冠心病。\n核心問題＝不能只看到冠狀動脈狹窄，還要理解形成狹窄與事件風險的上游條件。\nM06｜Hypertension｜高血壓。\n核心問題＝血壓是系統輸出，不是單一器官變數。\nM07｜Myocardial Ischemia｜心肌缺血。\n核心問題＝供氧、需求、冠脈血流、微循環、心肌代謝等共同決定缺血表型。\nM08｜Psychological／System Factors｜心理與整體系統因素。\n核心問題＝心理壓力如何經自主神經、內分泌、睡眠與行為路徑進入心血管系統。","r","s三｜全書最重要的結構轉換","p舊模型：Risk Factor A→Disease。\n更新模型：Multiple Inputs→Network State→Functional Disturbance→Structural Change→Clinical Phenotype→Cardiovascular Event。\n白話就是：不要只問「哪一個東西害你生病」。\n要問「哪些因素一起把整個系統推進高風險狀態」。","r","s四｜Node 01｜Vascular｜血管","pDefinition｜血管不是單純水管，而是具有主動調節能力的活組織。\nCore Function｜調節血流、阻力、血壓、凝血與組織灌流。\n核心Node｜Endothelium｜內皮。\nMechanism｜Endothelial dysfunction→Vasodilation能力下降→血管張力改變→血流調控異常→心血管風險上升。\n另一條：Endothelial injury→Inflammatory signaling→Leukocyte adhesion→Plaque biology→Atherosclerotic progression。\n槓桿｜不要只看「血管有沒有塞」，還要看血管功能狀態。\n限制｜不能把所有心血管疾病全部簡化成「內皮功能障礙」。","r","s五｜Node 02｜Inflammation｜發炎","p本質｜發炎不是單純「壞東西」，而是防禦與修復系統的一部分。\n問題發生在：Trigger持續存在→Inflammatory signaling持續→Repair無法完整結束→慢性低度發炎環境。\n心血管鏈：Metabolic／Environmental／Behavioral Inputs→Inflammatory signaling→Endothelial activation→Plaque biology→Plaque instability／Thrombosis risk。\n策略｜不要追求「把發炎全部關掉」。\n更好的問題是：什麼Input持續讓Inflammatory Loop無法停止？槓桿｜找到Persistent Trigger。\n限制｜CRP等發炎指標具有非特異性；數值升高不能單獨證明心血管根因。","r","s六｜Node 03｜Metabolism｜代謝","p核心問題不是只有：血糖高不高？膽固醇高不高？而是：整個Energy Allocation與Substrate Handling是否失衡。\n核心鏈：Energy Surplus＋Low Activity＋Visceral Adiposity＋Genetic susceptibility→Insulin Resistance→Glucose／Lipid abnormalities→Vascular stress→Cardiovascular risk。\n槓桿｜代謝不是單一檢驗值，而是一組Pattern。\n應同時觀察：Glucose。\nHbA1c。\nTriglycerides。\nHDL-C。\nLDL相關指標。\nBlood Pressure。\nWaist／Body Composition。\nClinical Context。\n限制｜任何單一數值都不能代表完整代謝網路。","r","s七｜Node 04｜Stress｜壓力","p這是本書值得注意的特色。\n心理不是漂浮在身體之外的抽象概念。\nPsychological Stress可以透過具體生理路徑進入心血管系統：Perceived Threat→Sympathetic Activation→Catecholamines→Heart Rate／Vascular Tone→Blood Pressure／Cardiac Demand。\n另一條：Chronic Stress→Sleep disruption→Eating／Activity changes→Metabolic burden→Cardiovascular risk。\n所以不是：「想開一點→心臟就好了。」而是：Psychological Input→Neuroendocrine Signal→Autonomic Output→Behavior→Metabolism→Cardiovascular State。\n槓桿｜Stress Regulation＋Sleep＋Behavior。\n限制｜心理因素不能取代對器質性心血管疾病的診斷與治療。","r","s八｜Node 05｜Neuroendocrine｜神經內分泌","p核心角色：Autonomic Nervous System｜自主神經系統。\nSympathetic｜交感。\nParasympathetic｜副交感。\nHPA Axis｜下視丘－腦下垂體－腎上腺軸。\nCatecholamines｜兒茶酚胺。\nCortisol｜皮質醇。\n核心鏈：Stress→Brain appraisal→ANS／HPA→Hormonal／Neural Output→Heart／Vessel／Metabolism→Cardiovascular Phenotype。\n所以：Mind不是心血管系統外面的東西。\n它可以透過Neuroendocrine Interface進入身體。","r","s九｜Node 06｜Blood Pressure Regulation｜血壓調節","p最大的觀念更新：Blood Pressure是一個Output。\n不是一個獨立器官。\n基本關係可理解為：Blood Pressure≈Cardiac Output×Systemic Vascular Resistance。\n而Cardiac Output又受：Heart Rate。\nStroke Volume。\nBlood Volume。\n等影響。\nSystemic Vascular Resistance又受：Vascular Tone。\nAutonomic System。\nRAAS。\nEndothelial Signals。\n等影響。\n因此：Hypertension←Kidney＋Vessel＋ANS＋Hormones＋Metabolism＋Lifestyle＋Genetics。\n槓桿｜先判斷主要維持機制，而不是假設所有高血壓完全相同。\n限制｜功能醫學分析不能成為自行停用降壓藥的理由。","r","s十｜Node 07｜Coronary Circulation｜冠狀循環","p舊模型：冠狀動脈狹窄→缺血。\n更完整模型：Myocardial Oxygen SupplyvsMyocardial Oxygen Demand。\nSupply受到：Coronary blood flow。\nOxygen content。\nEpicardial coronary arteries。\nMicrocirculation。\nVascular tone。\n等影響。\nDemand受到：Heart rate。\nContractility。\nWall stress。\nWorkload。\n等影響。\n因此：Ischemia＝Supply–Demand mismatch。\n槓桿｜從「一條血管」升級成「供需系統」。","r","s十一｜Node 08｜Atherosclerosis｜動脈粥樣硬化","p不要把它理解成：「油卡在水管。」更合理的模型是：Atherogenic particles＋Endothelial biology＋Inflammatory processes＋Immune response＋Plaque remodeling＋Time→Atherosclerosis。\n這個更新非常重要。\n因為水管模型只會問：「塞了多少？」系統模型還會問：「Plaque為什麼形成？」「Plaque穩不穩？」「哪些因素仍然持續推動進程？」限制｜不能因此淡化LDL／ApoB等含ApoB脂蛋白在動脈粥樣硬化中的重要因果角色。","r","s十二｜策略01｜從Disease轉成Network","p不要：冠心病→找一個原因。\n改成：Coronary Disease←Lipids←Inflammation←Endothelium←Metabolism←Blood Pressure←Smoking←Sleep←Activity←Genetics←Time。\n最大果效｜減少Single-cause Error。","r","s十三｜策略02｜找Common Mechanism｜共同機制","p冠心病。\n高血壓。\n代謝異常。\n腦血管風險。\n可能共享部分Node。\n例如：Insulin Resistance。\nEndothelial Dysfunction。\nInflammatory signaling。\nAutonomic Dysregulation。\nSmoking exposure。\nVisceral adiposity。\n因此不要每增加一個Disease就重新建立一套Database。\n建立Canonical Nodes。\nDisease只是不同Node組合形成的Phenotype。","r","s十四｜策略03｜找Upstream Driver｜上游驅動因子","p例如：Blood Pressure↑。\n下游策略：只盯著BP數字。\n上游分析則可能檢查：Sodium／diet pattern。\nBody weight。\nAlcohol。\nSleep apnea。\nKidney disease。\nMedication。\nAutonomic activation。\nEndocrine causes。\nActivity。\nGenetics。\n這就是：Output←Mechanism←Driver。\n但必須保留一個重要邊界：「找上游」不是「拒絕控制下游」。\n如果血壓危險地高，下游風險本身就必須處理。","r","s十五｜策略04｜Biomarker Pattern｜指標組合","p不要：一個Marker→一個結論。\n應該：Marker A＋Marker B＋Symptoms＋History＋Physical Findings＋Medication＋Time→Pattern。\n例如心血管評估可能涉及：Blood Pressure。\nLipid Profile。\nLDL-C。\nHDL-C。\nTriglycerides。\nApoB。\nLp(a)。\nGlucose。\nHbA1c。\nKidney Function。\nInflammatory markers在適當情境下。\n以及醫師依風險選擇的ECG、Echo、CT或其他檢查。\n最大果效｜從Point Measurement升級成System State Estimation。","r","s十六｜策略05｜Timeline｜時間軸","p心血管疾病尤其需要Time Dimension。\n今天看到：Plaque。\nHypertension。\nDiabetes。\nObesity。\n不是今天突然生成。\n應建立：Genetics→Childhood／Environment→Diet／Activity→Smoking／Stress→Metabolic Change→Subclinical Dysfunction→Structural Disease→Clinical Event。\n槓桿｜越早找到可改變Node，通常可干預時間越長。","r","s十七｜策略06｜Feedback Loop｜回饋環","p真正的慢病常常不是線性鏈，而是Loop。\n例如：Stress↑→Sleep↓→Insulin Sensitivity↓→Energy／Mood↓→Activity↓→Metabolic Health↓→Stress↑。\n形成：Positive Feedback Loop｜正回饋惡化環。\n介入策略不是每一點平均用力。\n而是找：Loop-breaking Point｜斷環點。","r","s十八｜策略07｜High-leverage Node｜高槓桿節點","p高槓桿不是「最神奇的營養素」。\n高槓桿＝改一個Node，可以同時影響很多下游Node。\n典型候選包括：Smoking cessation｜戒菸。\nBlood-pressure control｜血壓控制。\nAtherogenic lipoprotein management｜致動脈粥樣硬化脂蛋白管理。\nPhysical activity｜活動。\nWeight／visceral adiposity management｜體重與內臟脂肪。\nGlycemic management｜血糖代謝。\nSleep｜睡眠。\nDietary pattern｜飲食型態。\nStress management｜壓力調節。\nMedication adherence｜必要藥物依從性。\n槓桿的權重必須依個人風險重新估計。","r","s十九｜策略08｜Lifestyle作為多Node Intervention","pExercise不是只減肥。\nExercise→Insulin Sensitivity→Endothelial Function→Cardiorespiratory Fitness→Blood Pressure→Autonomic Regulation→Body Composition→Mood／Sleep。\n所以Exercise是一個：Multi-target Intervention｜多靶點介入。\n同理：Sleep。\nDiet。\nSmoking cessation。\n都不是只作用一個Node。\n這就是系統介入比「一症狀一補充品」更重要的原因。","r","s二十｜策略09｜營養不是單品，而是Input Pattern","p低維問題：「吃什麼營養素保護心臟？」高維問題：「什麼Dietary Pattern長期改變整個代謝－血管－炎症網路？」因此優先級應是：Diet Pattern→Energy Balance→Food Quality→Fiber／Plant diversity→Fat quality→Sodium／Potassium context→Micronutrient adequacy→最後才是Targeted Supplement。\n不能倒過來變成：Supplement→Supplement→Supplement→飲食不變。","r","s二十一｜策略10｜心理介入","p心理因素真正的機制價值：Representation→Threat Prediction→Autonomic／Endocrine Response→Behavior→Physiology。\n所以心理介入的目標不是：「保持正能量。」而是降低長期不必要的Threat Load，同時改善睡眠、活動、飲食與治療遵從等下游行為。\n最大果效｜可能同時作用Stress＋ANS＋Sleep＋Behavior多個Node。\n限制｜心理介入不是冠心病、高血壓、心衰竭的替代治療。","r","s二十二｜最大果效01｜把疾病重新表徵","p舊Representation：「我的血管塞住了。」新Representation：「我的心血管風險是多個可測量、部分可修改Node共同形成。」Representation改變→Attention改變→Measurement改變→Action Space增加。","r","s二十三｜最大果效02｜增加可介入點","p單因果模型：1 Disease→1 Target。\nNetwork Model：1 Phenotype←10個甚至更多Nodes。\n因此不是讓治療更複雜而已。\n它也增加：Intervention Space｜可介入空間。","r","s二十四｜最大果效03｜找到共同上游","p如果五個症狀共享同一High-weight Node。\n處理一個上游Node可能同時改善多個下游Output。\n這就是：Leverage。\n不是：「一個營養素治五種病。」而是：「一個上游變數參與五條下游路徑。」兩句話看起來很像，科學意義完全不同。","r","s二十五｜最大果效04｜慢病管理從靜態變動態","p舊：Diagnosis→Treatment。\n新：Baseline→Risk Model→Intervention→Response→Retest→Residual Risk→Model Update。\n所以健康不是一次性的「正常／異常」。\n而是：Dynamic State Estimation｜動態狀態估計。","r","s二十六｜最大果效05｜提升Prediction","p模型真正有價值不是因為「聽起來完整」。\n而是它能不能預測：如果降低X，Y應該怎麼變？例如：若主要Driver真的是睡眠呼吸中止相關的交感活化，適當處理後某些血壓與睡眠相關指標應出現相應變化。\n若完全沒有，就必須重新估計：Node？Weight？Mechanism？Adherence？Timing？Measurement？這才是真正的Model Update。","r","s二十七｜本書思想最容易產生的Error","pError 01｜把「系統論」變成什麼都相關。\n什麼都相關＝模型沒有辨識力。\nError 02｜把Correlation當Causation。\n看到兩個Node一起變，不代表A造成B。\nError 03｜把Root Cause想成唯一原因。\n複雜疾病往往是Causal Network。\nError 04｜把營養素取代藥物。\n兩者不是同一層級的工具。\nError 05｜因為強調心理，就心理化器質性疾病。\n胸痛仍然可能是急症。\nError 06｜因為重視功能，就忽略結構。\n嚴重冠狀動脈疾病不是靠「調功能」就可以假設消失。\nError 07｜無限增加檢驗。\n更多Data不等於更好的Model。\nError 08｜無限增加Supplement。\n更多Input可能增加Interaction與不確定性。","r","s二十八｜最重要的醫療限制","p功能醫學／系統模型適合補充「怎麼理解個體差異與多因素網路」。\n但它不能取代具有明確臨床結果證據的心血管診療。\n已確診冠心病、高血壓、心律不整、心衰竭或急性冠心症者，不能因採用功能醫學框架自行停用降壓藥、降脂藥、抗血小板藥、抗凝血藥或其他處方。\n急性胸痛、呼吸困難、暈厥、疑似心肌梗塞等情況首先是Emergency Medicine問題，不是營養素最佳化問題。","r","s二十九｜系統論本身的限制","p系統模型最大的危險是：Model Complexity↑不一定代表Prediction Accuracy↑。\n如果建立：50 Nodes＋300 Relations卻沒有辦法測量Weight，那只得到一張漂亮的網路圖。\n所以必須增加：Evidence Weight。\nCausal Strength。\nModifiability。\nMeasurement Reliability。\nClinical Effect Size。\n才能真正排序。","r","s三十｜真正的槓桿公式","pLeverage≈Causal Importance×Modifiability×Effect Size×Reach÷Cost／Risk／Friction。\n白話：影響疾病很大。\n又真的改得動。\n改了效果夠大。\n一次能影響很多Node。\n成本與風險又合理。\n才叫高槓桿。\n不是「聽起來最前沿」就叫高槓桿。","r","s三十一｜心血管High-leverage判讀順序","p第一層｜Immediate Risk。\n現在有沒有急性危險？↓第二層｜Established Disease。\n是否已存在冠心病、心衰竭、心律問題、腦血管病等？↓第三層｜Major Causal Risk。\n血壓｜ApoB／LDL相關風險｜吸菸｜糖尿病｜腎功能｜Lp(a)等。\n↓第四層｜System Drivers。\n肥胖／內臟脂肪｜活動｜飲食｜睡眠｜壓力｜代謝。\n↓第五層｜Functional Modifiers。\n內皮｜自主神經｜發炎Pattern｜其他個體化機制。\n↓第六層｜Targeted Nutrition／Supplement。\n有明確缺乏、適應條件或合理Target時才加入。\n這個順序非常重要。\n不能倒過來從Supplement開始。","r","s三十二｜把全書壓成一個Mechanism Map","pGenes／Age＋Environment＋Diet＋Smoking＋Activity＋Sleep＋Stress↓Metabolism↔Adiposity↔Inflammation↔Neuroendocrine↔Autonomic Regulation↓Blood Pressure＋Endothelial Function＋Atherogenic Lipoproteins＋Glucose Regulation↓Vascular Biology↓Atherosclerosis／Vascular Dysfunction↓Coronary Flow／Cardiac Workload↓Ischemia↓Clinical Cardiovascular Disease。\n同時存在Feedback：Disease→Fear／Stress→Sleep／Activity↓→Metabolism惡化→Disease Burden↑。\n所以真正介入不是只有一條箭頭。\n而是：找Driver。\n找Loop。\n找Weight。\n找Leverage。","r","s三十三｜與你的32 Node固定欄位直接對接","pNode ID｜固定編號。\nCanonical Name｜統一名稱。\nDomain｜Vascular／Inflammation／Metabolism／Stress／Neuroendocrine等。\nDefinition｜它是什麼。\nCore Function｜正常負責什麼。\nAnatomy｜Heart／Vessel／Kidney／Brain等。\nCell｜Endothelial cell／Cardiomyocyte／Immune cell等。\nOrganelle｜Mitochondria等。\nMolecule｜NO／Insulin／Catecholamine等。\nPathway｜A→B→C。\nMechanism｜為什麼影響心血管。\nInput｜Diet／Stress／Smoking／Sleep等。\nOutput｜BP／Flow／Inflammation／Metabolism等。\nRelation｜Node↔Node。\nDysfunction Pattern｜失衡形式。\nSymptoms｜臨床訊號。\nDisease Association｜相關疾病。\nBiomarker｜Reality檢查窗口。\nNutrition｜營養輸入。\nFood｜飲食Pattern。\nIntervention｜醫療＋生活＋營養。\nSupplement Strategy｜有條件才使用。\nSafety Boundary｜安全界線。\nFeedback／Retest｜介入後驗證。\nNormal State｜正常動態。\nOld Model｜單病單因。\nUpdated Model｜Network。\nCommon Error｜把關聯當因果。\nPrediction｜如果模型對，什麼會改變。\nPrediction Error｜結果不符預期。\nHigh-leverage Point｜優先改哪裡。\nMinimal Action｜下一步最小可執行行動。","r","s三十四｜這本書真正值得灌進母體的不是內容，而是演算法","pDisease Label→Phenotype Decomposition→Canonical Nodes→Relations→Feedback Loops→Causal Evidence→Weight→High-leverage Node→Intervention→Prediction→Measurement→Prediction Error→Reweight→Model Update→Retest。","r","s三十五｜全書最好記的一句話","p不要只問「心血管哪裡壞了」。\n要問「哪些上游輸入、功能節點與回饋環，正在共同生成並維持現在的心血管狀態」。","s最終升級","p這本書真正能給你的，不是一套「功能醫學治心臟」的固定答案。\n它最有價值的是提供一個疾病→系統的Representation Shift。\n但系統思維還必須再加上Evidence Weight，否則很容易從「單因果過度簡化」跳到另一個極端——「萬物皆相關」。\n因此你的Functional Medicine OS可以比書再前進一步：Systems Theory＋Causal Network＋Evidence Weight＋Biomarker＋Prediction＋Prediction Error＋Model Update。\n最後不是追求「知道最多心血管因素」。\n而是追求：用最少但最有辨識力的Node，建立最能預測Reality的模型，找到風險最低而影響最大的槓桿，再讓Reality決定模型是否值得保留。"]},{"t":"《功能醫學新思維破解心血管病難題》｜八大模組一頁總覽表","d":3,"g":"耿世釗《功能醫學新思維破解心血管病難題》","s":"","b":[["T",[["模組","核心主題","本體｜到底在看什麼","核心Node","核心機制｜Mechanism","主要策略｜Strategy","高槓桿｜Leverage","預期果效｜Effect","限制／Error"],["M01｜疾病困境","Cardiovascular Disease｜心血管疾病為何難解","心血管病不是單一零件故障，而是長時間、多因素共同生成的Phenotype表型","Age年齡｜Genes基因｜Smoking吸菸｜BP血壓｜Lipids脂質｜Glucose血糖｜Lifestyle生活","Multiple Inputs→Functional Disturbance→Structural Chang "p所以這四本最基本的智慧，其實只有一句：","p生命不是「很多零件的清單」，而是很多零件彼此連結、互相回饋，在環境中持續調整所形成的整體。","p而且這批到這裡就停，不再往Attractor、Hysteresis、Network Centrality等更複雜概念擴張。先把 整體｜關係｜回饋｜結構｜延遲｜生物網路 這六個基本概念吃透，就已經得到這四本經典最值得帶走的骨架。"]},{"t":"第十五批｜網路醫學 × 複雜系統的基礎經典｜導讀","d":11,"g":"各批導讀・一頁總表・母體更新","s":"第十五批","b":["pBarabási → Human Disease Network → Network Medicine → Melanie Mitchell","p這批接在上一批 「系統 → 回饋 → 結構 → 生物網路」 後面，只回答一個更進一步的問題：","p如果基因、蛋白質、疾病彼此形成網路，那麼疾病還能只看成「一個基因壞掉」嗎？","p先背四句：","pBarabási《Network Science》","p＝網路本身有什麼基本規律？","pHuman Disease Network","p＝不同疾病為什麼會彼此有關？","pNetwork Medicine","p＝疾病在人體生物網路中占據什麼位置？","pMelanie Mitchell《Complexity》","p＝很多簡單單位互動後，為什麼會產生複雜行為？","p最好背：","p網路 → 疾病網路 → 網路醫學 → 複雜性"]},{"t":"第十五批｜真正一頁版","d":11,"g":"各批導讀・一頁總表・母體更新","s":"第十五批","b":[["T",[["經典","最基本問題","核心概念","最值得背的一句"],["Barabási《Network Science》","誰跟誰連在一起？","Node、Link、Degree、Hub、Module","有Node還不夠，Relation決定Network"],["Human Disease Network","疾病彼此有關嗎？","Shared Genes、Disease Link、Comorbidity","不同Disease可能共享部分生物基礎"],["Network Medicine","疾病在生物網路裡怎麼形成？","Disease Module、Pathway、Drug Target","複雜疾病常不能只找一個壞掉的分子"],["Mitchell《Complexity》","複雜行為怎麼產生？","Interaction、Emergence、Nonlinearity、Adaptation","簡單Parts互動，可以生成複雜Whole"]]],"p把第十四批＋第十五批接起來","p現在只需要記八步：","pBertalanffy","sSystem","p整體不能只看零件","p↓","pWiener","sFeedback","p系統會根據結果調節","p↓","pMeadows","sStructure","p反覆結果背後有結構","p↓","pAlon","sBiological Network","p基因／蛋白質形成調控網路","p↓","pBarabási","sNetwork Science","p研究Node與Link的結構","p↓","pHuman Disease Network","sDisease Network","p疾病彼此也可能形成關係","p↓","pNetwork Medicine","sDisease Module","p疾病可能涉及一群相互關聯的分子","p↓","pMitchell","sComplexity","p互動可以產生Emergence","p最後只背八個字","p整 → 回 → 構 → 生 → 網 → 病 → 模 → 湧","p整＝Whole。回＝Feedback。構＝Structure。生＝Biological Network。網＝Network。病＝Disease Network。模＝Disease Module。湧＝Emergence。","p最重要的是不要再往上堆概念。這批真正要學會的只有：","p人體不是「零件清單」；疾病也不一定是「單一零件故障」。但Network只是理解與產生假說的工具，最後仍然要回到實驗、人體研究與臨床結果。","p對，你要的是**「經典本身」**，不是我繼續把主題拆成 Human Disease Network、Network Medicine 這種研究領域。上一批偏掉了。","p從現在開始，我只按照：","p經典書／經典原著 → 作者 → 原書大綱 → 核心思想 → 經典策略 → 最大智慧 → 限制","p不再用「某個研究領域」冒充一本經典。"]},{"t":"下一批｜真正的「系統 × 複雜性」經典原著","d":11,"g":"各批導讀・一頁總表・母體更新","s":"下一批","b":["p先把真正值得逐本擷取的經典排好：",["T",[["順序","經典原著","作者","年代","最基本問題"],["01","《General System Theory》","Ludwig von Bertalanffy","1968","什麼叫System？"],["02","《Cybernetics》","Norbert Wiener","1948","系統如何靠Feedback控制？"],["03","《An Introduction to Cybernetics》","W. Ross Ashby","1956","系統如何維持穩定與適應？"],["04","《The Sciences of the Artificial》","Herbert A. Simon","1969","人造系統如何設計與解決問題？"],["05","《Order Out of Chaos》","Ilya Prigogine、Isabelle Stengers","1984","秩序如何從非平衡系統產生？"],["06","《The Origins of Order》","Stuart Kauffman","1993","複雜生命秩序如何自發形成？"],["07","《Hidden Order》","John H. Holland","1995","Complex Adaptive System如何適應？"],["08","《Thinking in Systems》","Donella H. Meadows","2008","系統為什麼反覆產生相同結果？"],["09","《Complexity: A Guided Tour》","Melanie Mitchell","2009","複雜性到底是什麼？"],["10","《Network Science》","Albert-László Barabási","2016","Network有哪些基本規律？"]]],"p這才是你要的「經典」。","p這10本又可以壓成一條經典演化線","pBertalanffy","p《General System Theory》","s系統","p整體不能只拆成零件","d↓","pWiener","p《Cybernetics》","s回饋","p系統如何控制與溝通","d↓","pAshby","p《An Introduction to Cybernetics》","s調節","p系統如何面對環境變化","d↓","pSimon","p《The Sciences of the Artificial》","s設計","p複雜問題如何被設計與解決","d↓","pPrigogine","p《Order Out of Chaos》","s非平衡","p秩序如何在變動中形成","d↓","pKauffman","p《The Origins of Order》","s自組織","p生命秩序如何湧現","d↓","pHolland","p《Hidden Order》","s適應","p複雜系統如何學習與適應","d↓","pMeadows","p《Thinking in Systems》","s結構","p什麼結構一直生成現在的結果","d↓","pMitchell","p《Complexity》","s複雜性","p局部互動如何產生整體行為","d↓","pBarabási","p《Network Science》","s網路","pNode與Link如何形成Network","p而且你要的「經典」不只這一組","p後面應該全部照真正原著往下挖：","p生命科學經典Darwin《On the Origin of Species》→ Schrödinger《What Is Life?》→ Watson等分子生物學經典→ Alberts → Lehninger。","p生理／醫學經典Claude Bernard《Introduction to the Study of Experimental Medicine》→ Cannon《The Wisdom of the Body》→ Guyton → Robbins → Harrison → Goodman & Gilman。","p遺傳／表觀遺傳經典Mendel原始論文 → Morgan → Waddington → Watson & Crick → Jacob & Monod → Allis《Epigenetics》。" <script>

  });

      h += '<button class="dom' + (op ? ' open' : '') + '" data-d="' + d + '"><i>▶</i>' + esc(dm[0]) + '<span>' + n + '</span></button>';
      if (!op) return;
      gs.forEach(g => {
        h += '<button class="grp" data-g="' + g.u[0] + '">' + esc(g.n) + '</button>';
        g.u.forEach(i => { h += '<button class="un' + (view.k === 'u' && view.i === i ? ' on' : '') + '" data-u="' + i + '">' + srcTag(U[i]) + esc(U[i].t) + '</button>'; });
      });
    });
  } else {
    let cat = '';
    TOP.forEach((t, i) => {
      if (t.cat !== cat){ cat = t.cat; h += '<div class="cat">' + esc(cat) + '</div>'; }
      h += '<button class="tp' + (view.k === 't' && view.i === i ? ' on' : '') + '" data-t="' + i + '">' + esc(t.n) + '</button>';
    });
  }
  nav.innerHTML = h;
  const on = nav.querySelector('.on'); if (on) on.scrollIntoView({block: 'nearest'});
}

/* ---------- views ---------- */
function highlight(root, re){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), list = [];
  while (w.nextNode()) list.push(w.currentNode);
  list.forEach(n => {
    re.lastIndex = 0; if (!re.test(n.nodeValue)) return; re.lastIndex = 0;
    const s = document.createElement('span');
    s.innerHTML = esc(n.nodeValue).replace(re, m => '<mark>' + m + '</mark>');
    n.replaceWith(...s.childNodes);
  });
}
function setHash(h){ if (location.hash !== h) history.pushState(null, '', h); try { localStorage.setItem('med.v', h); } catch (e) {} }

function showHome(){
  view = {k: 'home'};
  const blocks = U.reduce((a, u) => a + u.b.length, 0);
  let h = '<h2 class="title">醫學資料庫</h2><p class="lead">' + DOM.length + ' 個學科・' + U.length + ' 個單元・' + TOP.length + ' 個跨書主題。同一本書在不同批次的版本已併在同一組。</p><h5>學科分類</h5><div class="cards">';
  DOM.forEach((dm, d) => { const gs = groupsOf(d); h += '<button class="card" data-d="' + d + '"><strong>' + esc(dm[0]) + '</strong><em>' + esc(dm[1]) + '</em><span>' + gs.length + ' 組・' + gs.reduce((a, g) => a + g.u.length, 0) + ' 單元</span></button>'; });
  h += '</div>';
  let cat = '';
  TOP.forEach((t, i) => { if (t.cat !== cat){ h += (cat ? '</div>' : '') + '<h5>主題整合｜' + esc(t.cat) + '</h5><div class="sib">'; cat = t.cat; } h += '<button class="chip" data-t="' + i + '">' + esc(t.n) + '</button>'; });
  art.innerHTML = h + '</div>';
  main.scrollTop = 0; renderNav(); setHash('#home');
}

function showDomain(d){
  view = {k: 'd', i: d}; openDom.add(d); tab = 'C';
  let h = '<div class="crumb"><a data-home="1">總覽</a></div><h2 class="title">' + esc(DOM[d][0]) + '</h2><p class="lead">' + esc(DOM[d][1]) + '</p>';
  groupsOf(d).forEach(g => {
    h += '<h5>' + esc(g.n) + '</h5><div class="ulist">' + g.u.map(i => '<button data-u="' + i + '">' + srcTag(U[i]) + '<span>' + esc(U[i].t) + '</span><b>' + U[i].b.length + ' 段</b></button>').join('') + '</div>';
  });
  art.innerHTML = h; main.scrollTop = 0; renderNav(); setHash('#d' + d);
}

function showUnit(i, block, hl){
  if (!(i >= 0 && i < U.length)) return showHome();
  const u = U[i]; view = {k: 'u', i}; openDom.add(u.d); tab = 'C';
  const sib = U.map((x, j) => j).filter(j => U[j].d === u.d && U[j].g === u.g);
  let h = '<div class="crumb"><a data-home="1">總覽</a> › <a data-d="' + u.d + '">' + esc(DOM[u.d][0]) + '</a> › ' + esc(u.g) + '</div><h2 class="title">' + esc(u.t) + '</h2>';
  if (sib.length > 1) h += '<div class="sib">' + sib.map(j => '<button class="chip' + (j === i ? ' on' : '') + '" data-u="' + j + '">' + (U[j].s ? esc(U[j].s) + '｜' : '') + esc(U[j].t.length > 26 ? U[j].t.slice(0, 26) + '…' : U[j].t) + '</button>').join('') + '</div>';
  h += u.b.map(blockHtml).join('');
  h += '<div class="pager">' + (i > 0 ? '<button data-u="' + (i - 1) + '">← ' + esc(U[i - 1].t) + '</button>' : '') + (i < U.length - 1 ? '<button data-u="' + (i + 1) + '">' + esc(U[i + 1].t) + ' →</button>' : '') + '</div>';
  art.innerHTML = h;
  if (hl) highlight(art, hl);
  if (!terms.length) renderNav();
  setHash('#u' + i);
  if (block != null) jump(block); else main.scrollTop = 0;
}
function jump(b){
  const el = $('b' + b); if (!el) return;
  el.scrollIntoView({block: 'start'}); main.scrollTop -= 12;
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}

function showTopic(ti){
  const T = TOP[ti]; if (!T) return showHome();
  view = {k: 't', i: ti}; tab = 'T';
  const perDom = DOM.map(() => 0), perUnit = [], whole = [], secs = [], rows = [];
  U.forEach((u, ui) => {
    let n = 0;
    const isWhole = T.re.test(u.t) || T.re.test(u.g);
    u.b.forEach((b, bi) => {
      const m = blockText(b).match(T.reg); if (m) n += m.length;
      if (typeof b !== 'string'){
        const hit = b[1].filter((r, ri) => ri > 0 && r.length > 1 && T.re.test(r[0]));
        if (hit.length) rows.push({ui, bi, rows: [b[1][0]].concat(hit)});
      } else if (!isWhole && (b[0] === 'h' || b[0] === 's') && T.re.test(b.slice(1))){
        const L = level(b); let e = bi + 1;
        while (e < u.b.length && level(u.b[e]) > (L === 3 ? 8 : L)) e++;
        if (e - bi > 1 && !(secs.length && secs[secs.length - 1].ui === ui && secs[secs.length - 1].e >= e)) secs.push({ui, s: bi, e});
      }
    });
    if (n){ perDom[u.d] += n; perUnit.push([ui, n]); }
    if (isWhole) whole.push(ui);
  });
  const total = perDom.reduce((a, b) => a + b, 0), max = Math.max(1, ...perDom);
  let h = '<div class="crumb"><a data-home="1">總覽</a> › 主題整合 › ' + esc(T.cat) + '</div><h2 class="title">' + esc(T.n) + '</h2>';
  h += '<p class="lead">全資料庫共提及 ' + total + ' 次，分布在 ' + perUnit.length + ' 個單元。</p>';
  h += '<h5>各學科提及次數</h5><div class="bars">' + DOM.map((dm, d) => perDom[d] ? '<div class="bar"><span>' + esc(dm[0]) + '</span><div><i style="width:' + (perDom[d] / max * 100).toFixed(1) + '%"></i></div><span>' + perDom[d] + '</span></div>' : '').join('') + '</div>';
  if (whole.length) h += '<h5>專書・專章（' + whole.length + '）</h5><div class="ulist">' + whole.map(i => '<button data-u="' + i + '" data-hl="1">' + srcTag(U[i]) + '<span>' + esc(U[i].t) + '</span><b>' + esc(DOM[U[i].d][0]) + '</b></button>').join('') + '</div>';
  if (secs.length){
    h += '<h5>各書中的專論段落（' + secs.length + '）</h5>';
    let d = -1;
    secs.forEach((s, k) => {
      const u = U[s.ui];
      if (u.d !== d){ d = u.d; h += '<p class="crumb" style="margin:14px 0 4px">' + esc(DOM[d][0]) + '</p>'; }
      h += '<details data-k="' + k + '"><summary>' + esc(blockText(u.b[s.s])) + '<small>' + (u.s ? esc(u.s) + '・' : '') + esc(u.t.length > 34 ? u.t.slice(0, 34) + '…' : u.t) + '</small></summary><div class="body"></div></details>';
    });
  }
  if (rows.length){
    h += '<h5>比較表中的相關列（' + rows.length + ' 張表）</h5>';
    rows.forEach(r => { h += '<p class="crumb" style="margin:12px 0 0">' + esc(U[r.ui].t) + '</p>' + tableHtml(r.rows) + '<button class="go" data-u="' + r.ui + '" data-b="' + r.bi + '">看完整表格 →</button>'; });
  }
  perUnit.sort((a, b) => b[1] - a[1]);
  h += '<h5>提及最多的單元</h5><div class="ulist">' + perUnit.slice(0, 25).map(x => '<button data-u="' + x[0] + '" data-hl="1">' + srcTag(U[x[0]]) + '<span>' + esc(U[x[0]].t) + '</span><b>' + x[1] + ' 次</b></button>').join('') + '</div>';
  art.innerHTML = h;
  art.querySelectorAll('details').forEach(el => el.addEventListener('toggle', () => {
    const body = el.querySelector('.body'); if (!el.open || body.firstChild) return;
    const s = secs[+el.dataset.k], u = U[s.ui];
    body.innerHTML = u.b.slice(s.s + 1, s.e).map(b => blockHtml(b)).join('') + '<button class="go" data-u="' + s.ui + '" data-b="' + s.s + '">在原文中查看 →</button>';
    highlight(body, T.reg);
  }));
  main.scrollTop = 0; renderNav(); setHash('#t' + ti);
}

/* ---------- search ---------- */
function search(){
  const v = q.value.trim().toLowerCase();
  $('clear').style.display = q.value ? 'block' : 'none';
  terms = v ? v.split(/\s+/) : [];
  if (!terms.length){ renderNav(); return; }
  if (!low) low = U.map(u => u.b.map(b => blockText(b).toLowerCase()));
  let total = 0, h = ''; const MAX = 300, multi = terms.length > 1;
  const add = (ui, bi, raw) => {
    total++; if (total > MAX) return;
    const s = raw.toLowerCase(), at = Math.max(0, s.indexOf(terms[0]) - 24);
    let snip = esc((at > 0 ? '…' : '') + raw.slice(at, at + 90).replace(/\s+/g, ' ') + (raw.length > at + 90 ? '…' : ''));
    terms.forEach(t => { snip = snip.replace(new RegExp(rx(esc(t)), 'gi'), m => '<mark>' + m + '</mark>'); });
    h += '<button class="hit" data-u="' + ui + '" data-b="' + bi + '"><small>' + esc(DOM[U[ui].d][0]) + ' › ' + esc(U[ui].t) + '</small>' + snip + '</button>';
  };
  U.forEach((u, ui) => {
    const L = low[ui];
    if (!multi){ L.forEach((s, bi) => { if (s.includes(terms[0])) add(ui, bi, blockText(u.b[bi])); }); return; }
    let s0 = 0;
    for (let bi = 1; bi <= L.length; bi++){
      if (bi < L.length && level(u.b[bi]) > 3) continue;
      const seg = L.slice(s0, bi).join(' ');
      if (terms.every(t => seg.includes(t))){
        let first = s0; for (let k = s0; k < bi; k++) if (L[k].includes(terms[0])){ first = k; break; }
        add(ui, first, (level(u.b[s0]) < 9 ? blockText(u.b[s0]) + '｜' : '') + blockText(u.b[first]));
      }
      s0 = bi;
    }
  });
  nav.innerHTML = '<div class="count">' + (total ? '找到 ' + total + ' 筆' + (total > MAX ? '（顯示前 ' + MAX + ' 筆）' : '') + (multi ? '・同一小節內同時出現' : '') : '找不到符合的內容') + '</div>' + h;
  nav.scrollTop = 0; document.body.classList.add('open');
}
const termRe = () => new RegExp(terms.map(rx).join('|'), 'gi');

/* ---------- events ---------- */
function act(e){
  const el = e.target.closest('[data-u],[data-d],[data-t],[data-g],[data-home]'); if (!el) return;
  const ds = el.dataset;
  if (ds.home) showHome();
  else if (ds.u != null){
    const hl = terms.length && el.classList.contains('hit') ? termRe() : ds.hl && view.k === 't' ? TOP[view.i].reg : null;
    showUnit(+ds.u, ds.b != null ? +ds.b : null, hl); document.body.classList.remove('open');
  }
  else if (ds.t != null){ showTopic(+ds.t); document.body.classList.remove('open'); }
  else if (ds.g != null) showUnit(+ds.g);
  else if (ds.d != null){
    const d = +ds.d;
    if (el.classList.contains('dom') && openDom.has(d)){ openDom.delete(d); renderNav(); }
    else showDomain(d);
  }
}
nav.addEventListener('click', act); art.addEventListener('click', act);
$('home').addEventListener('click', showHome);
$('tabC').addEventListener('click', () => { tab = 'C'; q.value = ''; search(); });
$('tabT').addEventListener('click', () => { tab = 'T'; q.value = ''; search(); });
let timer;
q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 160); });
$('clear').addEventListener('click', () => { q.value = ''; search(); q.focus(); });
$('menu').addEventListener('click', () => document.body.classList.toggle('open'));
main.addEventListener('click', () => document.body.classList.remove('open'));
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== q){ e.preventDefault(); q.focus(); } });
function route(h){
  const k = (h || '')[1], n = parseInt((h || '').slice(2), 10);
  if (k === 'u' && n < U.length) showUnit(n); else if (k === 't') showTopic(n); else if (k === 'd' && n < DOM.length) showDomain(n); else showHome();
}
window.addEventListener('popstate', () => route(location.hash));
let start = location.hash;
if (!start){ try { start = localStorage.getItem('med.v'); } catch (e) {} }
route(start);
</script>
