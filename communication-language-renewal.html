<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LifeOS 語言更新系統</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#22231f;--sub:#6b6c66;--line:#e3e1da;--acc:#2f6f5e;--accbg:#e4f0ec;--old:#a8473a;--oldbg:#f8e9e6;--new:#2f6f5e;--mark:#ffe58a;--chip:#efeee8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161714;--card:#20221e;--ink:#e8e7e1;--sub:#9d9e96;--line:#34362f;--acc:#7cc4ad;--accbg:#22362f;--old:#e59384;--oldbg:#3a2522;--new:#7cc4ad;--mark:#6b5a12;--chip:#2a2c27}}
:root[data-theme="dark"]{--bg:#161714;--card:#20221e;--ink:#e8e7e1;--sub:#9d9e96;--line:#34362f;--acc:#7cc4ad;--accbg:#22362f;--old:#e59384;--oldbg:#3a2522;--new:#7cc4ad;--mark:#6b5a12;--chip:#2a2c27}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px 0}
.top{display:flex;gap:10px;align-items:center;max-width:1100px;margin:auto}
h1{font-size:17px;margin:0;white-space:nowrap}
#q{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:15px}
#theme{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer}
nav{display:flex;gap:4px;overflow-x:auto;max-width:1100px;margin:8px auto 0;scrollbar-width:none}
nav button{border:0;background:none;color:var(--sub);padding:8px 10px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-size:14px}
nav button.on{color:var(--acc);border-color:var(--acc);font-weight:600}
nav button small{background:var(--chip);border-radius:8px;padding:0 6px;margin-left:3px;font-size:11px}
main{max-width:1100px;margin:auto;padding:14px 16px 60px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:20px;padding:3px 11px;font-size:13px;cursor:pointer}
.chips button.on{background:var(--acc);color:var(--card);border-color:var(--acc)}
h2.g{font-size:15px;color:var(--acc);margin:22px 0 8px;padding-bottom:4px;border-bottom:1px dashed var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card h3{margin:0 0 6px;font-size:15px}
.no{display:inline-block;background:var(--accbg);color:var(--acc);border-radius:6px;padding:0 6px;font-size:12px;margin-right:6px;font-weight:700}
.old{background:var(--oldbg);color:var(--old);border-radius:8px;padding:4px 9px;margin:4px 0}
.new{background:var(--accbg);color:var(--new);border-radius:8px;padding:4px 9px;margin:4px 0;font-weight:600}
.f{margin:3px 0;font-size:14px}.f b{color:var(--sub);font-weight:500;margin-right:4px}
.say{display:flex;gap:6px;align-items:flex-start;border-left:3px solid var(--acc);padding:4px 8px;margin-top:6px;font-size:14px}
.say span{flex:1}
.mini{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:7px;padding:1px 7px;font-size:12px;cursor:pointer;white-space:nowrap}
.mini:hover{color:var(--acc);border-color:var(--acc)}
.acts{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
pre.t{white-space:pre-wrap;font:inherit;margin:0}
.wide{grid-column:1/-1}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:500}
.tw{overflow-x:auto}
mark{background:var(--mark);color:inherit;border-radius:3px}
.empty{color:var(--sub);text-align:center;padding:40px}
label{display:block;font-size:13px;color:var(--sub);margin-top:8px}
input.i,textarea,select{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:70px}
.btn{background:var(--acc);color:var(--card);border:0;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;margin-top:10px}
.btn.g2{background:var(--chip);color:var(--ink)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
.diff{font-size:13px;color:var(--sub)}
@media(max-width:560px){h1{display:none}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<div class="top"><h1>LifeOS｜語言更新</h1><input id="q" type="search" placeholder="搜尋：舊語言、句型、情境、節點… 空白分隔多關鍵字"><button id="theme" title="切換深淺色">◐</button></div>
<nav id="nav"></nav>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>

## 核心公式
舊語言 → 重新理解 → 新語言 → 有效行動 → 觀察回饋 → 更新溝通模型
診斷流程：原話 → 錯誤辨識 → 原因分析 → 語言更新 → 行動修正 → 回饋複測
十大能力：覺察 → 表徵 → 結構 → 權重 → 策略 → 目標 → 行動 → 回饋 → 成長 → 自由
自我對話：自我對話 → 精確表徵 → 結構理解 → 權重調整 → 行動選擇 → 現實回饋 → 模型更新 → 增加人生的可選擇性
## 命運重構｜核心命題
核心：命運不是固定劇本，而是既有結構、選擇、行動與回饋反覆形成的高機率路徑。
突破：銅板可以協助觀察偏好，選擇可能重新生成偏好，而反覆行動可能改變未來的人生路徑。
邊界：命理可作為象徵性自我探索工具，但尚不能視為已驗證的心理診斷或未來預測技術。
更新：從「命運已經決定」轉向「辨識現狀、重構條件、觀察回饋、更新生命路徑」。
## 命理與科學｜清楚分層
象徵層（命理、塔羅、銅板、共時性）：用途是引發提問與自我探索；不能當作預測證據。
詮釋層（維根斯坦、榮格、投射觀點）：用途是改變問題的描述與意義；改變語言不保證改變外部事件。
認知科學層（預測編碼、主動推論、量子認知）：用途是理解預期、誤差與判斷順序；不能推出意念控制物理事件。
系統層（吸引子動力學）：用途是分析重複模式與狀態轉換；翻轉點需要時間序列證據。
生物層（神經、內分泌、表觀遺傳）：長期行為改變可能伴隨生理變化，但認知更新≠表觀遺傳更新，需獨立生物證據。
## 四層之間的運作流程
L1 本體層（N01–N03）辨識現狀與需求 → 輸出：現狀假說＋個人需求＋初步偏好
↓
L2 結構層（N04–N08）找出表徵、位置、關係、權重與耦合 → 輸出：結構圖＋優先順序＋候選槓桿
↓
L3 機制層（N09–N11）建立目標、行動假說與翻轉條件 → 輸出：目標函數＋行動假說＋狀態轉換條件
↓
L4 行動層（N12）執行 → 測量 → 誤差分析 → 修正 → 複測 → 輸出：實際結果＋模型版本＋下一輪策略
↺ 反向更新：行動結果 → 修正機制（L3）→ 重構結構（L2）→ 更新自我理解（L1）
四層不是單向因果，而是持續回饋的動態系統。
## 六大跨層對應邏輯
01 L1→L2｜先釐清正在研究什麼，才能決定觀察哪些變項。例：「我天生英文差」→拆成單字、句構、閱讀速度、解題策略、時間管理。指標：可辨識因素數。
02 L1→L3｜需求清楚，才能建立符合需求的目標。例：擲幣留職卻失望→比較薪資、健康、發展與風險。指標：目標清晰度、偏好穩定度。
03 L2→L3｜找出關鍵變項，才能選擇有效介入。例：句構與閱讀速度是瓶頸→限時閱讀與句構分析。指標：正確率、完成時間。
04 L3→L4｜機制假說必須轉成可觀察行動。例：預測四週閱讀正確率60%→75%。指標：完成率、進步幅度。
05 L4→L2｜結果不符預測，回頭檢查結構假設。例：練習後仍60%→真正瓶頸可能是核心字彙。指標：預測誤差。
06 L4→L1｜反覆新證據改變自我定義。例：八週後60%→78%，「我不是固定能力不足」。指標：自我能力預測準確度。
## 六大理論｜統一命名與層級
【象徵層】榮格／共時性：象徵、原型與內在意義 → 自我探索與提問｜邊界：共時性不是已證實的預測機制
【詮釋層】維根斯坦：語言使用與意義 → 更新問題表徵｜邊界：改變語言不保證改變外部事件
【認知層】預測編碼：期待與預測誤差 → 修正認知模型｜邊界：不能推出意念控制物理事件
【認知層】主動推論：信念、行動與資訊探索 → 建立行動回饋閉環｜邊界：個案應用需要檢驗
【系統層】吸引子動力學：穩定狀態與狀態轉換 → 分析重複模式｜邊界：翻轉點需要時間序列證據
【決策層】量子認知：判斷順序與情境依賴 → 比較決策模型｜邊界：不等於量子意識或量子改命
補充：投射觀點可研究人如何把自身關切帶入象徵解讀，但不能把所有象徵經驗一律歸為投射。
## 銅板三大作用
①偏好顯影：原有偏好 → 隨機結果 → 情緒反應 → 發現重視項目。例：正面代表留下，出現正面卻失望。
②偏好生成：原本沒有明確偏好 → 想像未來 → 形成新的價值排序。例：銅板促使具體想像海外生活。
③權重重配：價值衝突 → 具體比較 → 重新排序 → 改變選擇。例：薪水排第一，重新比較後健康與家庭更重要。
三種機制可能同時存在，不能單憑一次情緒反應判定。銅板可以引發反思，但沒有證據證明它能讀取未來或受意念控制。
## 目標函數十層
目標 → 表徵 → 權重 → 預測 → 行動 → 環境 → 回饋 → 更新 → 長期生理調節 → 表觀遺傳（研究結果尚不一致）
目標函數不是只追求正向情緒，而是同時考量期望成果、代價、風險、資源與不可犧牲的底線。
## 命運重構｜10大錯誤診斷
E01 把象徵符合當成客觀預測成功。
E02 把當下情緒當成唯一真實偏好。
E03 把偏好改變誤認成原有偏好被發現。
E04 把權重、可信度與耦合強度混成同一概念。
E05 把積極期待當成結果必然實現。
E06 把自證預言理解成意識直接控制外部世界。
E07 把認知更新直接稱為表觀遺傳改變。
E08 把一次人生轉折認定為已驗證的吸引子翻轉。
E09 只記錄成功案例，忽略失敗與反例。
E10 用理論解釋所有結果，卻不允許理論被修正。
核心檢查：一套永遠不可能被現實反駁的解釋，不能直接視為可靠的預測模型。
## 跨層12大錯誤
本體錯誤：把暫時狀態當成永久身分｜表徵錯誤：用模糊標籤代替具體描述｜位置錯誤：混淆自己與他人的責任｜關係錯誤：忽略互動循環或責任不對稱｜權重錯誤：把短期情緒當成長期價值｜耦合錯誤：把相關性當成因果｜目標錯誤：設定無法測量或代價過高的目標｜預測錯誤：認為積極期待必然成功｜翻轉錯誤：把短期波動當成穩定轉換｜行動錯誤：一次改變太多變項｜測量錯誤：只記錄成功｜更新錯誤：結果不符仍拒絕修正
## 五大生活案例｜舊結構→新結構
學生考差｜我很笨 → 分析錯題 → 每天五題錯題分析 → 兩週後同類錯題率
孩子沉迷手機｜沒有自律 → 改善環境 → 25分鐘無手機學習 → 專注時間與親子衝突頻率
婚姻失衡｜只能忍耐 → 辨識界線與安全 → 整理界線、支持資源與安全計畫 → 界線是否被尊重（安全不能被當成實驗變項）
工作不順｜命不好 → 分析角色與限制 → 每週探索兩個工作機會 → 新選項數量與可行性
團購經營｜努力推銷 → 辨識會員需求 → 每週蒐集十則會員回饋 → 回購率、滿意度、退貨率與客訴
## 30天翻轉實驗
第01～03天｜建立現狀基準，記錄重複問題與情緒反應。
第04～07天｜分析表徵、位置、關係、權重與耦合。
第08～10天｜建立一個具體目標與不可犧牲的底線。
第11～14天｜設計並執行最小行動。
第15天｜第一次檢查預測與實際結果。
第16～21天｜根據回饋調整策略。
第22～28天｜在相似情境重複測試。
第29天｜比較舊模式頻率、新選擇次數與目標進度。
第30天｜建立下一版生命模型。
五大追蹤指標：舊模式出現率、新行動完成率、目標達成率、預測誤差與生活品質。
## 溝通六大能力
表徵：把模糊抱怨改成具體事實。｜理解：分清自己的解讀與對方的觀點。｜表達：清楚說出感受、需求與請求。｜界線：知道哪些責任屬於自己。｜行動：把語言轉成可以執行的下一步。｜更新：檢查對話結果，持續調整方法。
## 十大智慧金句
01 命運不是一張已經寫完的答案卷，而是一條仍受條件影響的路徑。
02 算命可以成為提問的起點，但不能取代現實驗證。
03 硬幣落下的是結果，內心浮現的是線索，真正改變未來的是後續行動。
04 你以為自己正在選擇，其實選擇也可能正在重新塑造你。
05 改變表徵，不是改寫事實，而是增加理解事實的可能方式。
06 權重決定注意力優先看見什麼，但不能決定所有外部事件。
07 成長不是永遠預測正確，而是預測錯誤後仍然願意更新。
08 真正的翻轉，不是突然相信奇蹟，而是讓新行動逐漸成為穩定模式。
09 認識自己讓目標有根，行動與回饋讓改變有路。
10 自由不是擁有控制一切的能力，而是不再只能依照舊模型生活。
## 最終智慧
語言不是魔法。說得溫柔，不代表別人一定會改變；說得清楚，不代表所有衝突都能解決。
但當你能分清事實、感受、需求、責任與界線，就能減少許多不必要的誤解。
真正的溝通高手，不是永遠說對話的人，而是能在不同情境中，選擇更準確、更尊重、更有效表達方式的人。
看見結構是覺察；重排權重是策略；改變行動是能力；持續更新是自由。
</script>

<script type="text/plain" id="d-post">
你每天對自己說的話，正在影響你的人生選擇

你有沒有發現？
同樣遇到失敗，有些人越想越絕望，有些人卻開始尋找方法。
差別可能不只是個性。
而是他們如何理解、命名與回應眼前的問題。
堀田秀吾《改變人生的自我對話法》，最值得學的不是每天對自己喊「我很棒」。
而是學會用更精確的語言理解自己。

01｜看見自己，是覺察。
舊語言：「我真的很糟。」
新語言：「我現在感到挫折，原因是什麼？」
智慧：情緒是真實的，但情緒不等於全部事實。

02｜重新命名，是表徵。
舊語言：「我就是沒有能力。」
新語言：「我目前缺少哪個具體技能？」
智慧：不要把可以改善的問題，變成永久的人格標籤。

03｜辨識關係，是結構。
舊語言：「都是他害的。」
新語言：「有哪些因素共同形成這個結果？」
智慧：看見系統，才有機會找到新的介入位置。

04｜調整優先，是權重。
舊語言：「我什麼都要顧好。」
新語言：「現階段哪三件事最值得優先？」
智慧：成熟不是什麼都抓住，而是知道什麼不能犧牲。

05｜找到槓桿，是策略。
舊語言：「我一定還不夠努力。」
新語言：「我是不是一直努力在錯誤的地方？」
智慧：找到瓶頸，比盲目增加投入更重要。

06｜建立目標，是方向。
舊語言：「我要變得更好。」
新語言：「我要在什麼期限內改善哪個指標？」
智慧：願望提供動機，明確目標才有助於設計行動。

07｜採取行動，是能力。
舊語言：「有一天我一定會開始。」
新語言：「如果晚上七點到了，我就先做十分鐘。」
智慧：行動不必等到情緒完美才開始。

08｜觀察結果，是回饋。
舊語言：「我覺得這樣應該有用。」
新語言：「實際結果與原本預測差多少？」
智慧：努力值得尊重，但效果仍需要驗證。

09｜修正預測，是成長。
舊語言：「我不能承認自己錯了。」
新語言：「這次結果讓我需要修正哪個假設？」
智慧：修正不是否定自己，而是讓理解更接近現實。

10｜不被舊模型綁架，是自由。
舊語言：「我一直都是這樣。」
新語言：「除了過去熟悉的做法，我還有哪些可行選擇？」
智慧：自由不是想什麼就會發生，而是在現實限制內增加選擇。

真正能改變人生的，不是永遠說好聽的話。
而是能夠把一句模糊的自我否定，轉成一個精確的問題。
把一個精確的問題，轉成可以執行的行動。
再用真實結果，修正下一次的選擇。

語言不是魔法。
語言是我們理解世界、組織知識與調整行動的重要工具。
真正的生命升級，不是用新的語言美化舊人生。
而是讓自己的每一句重要判斷，都保留被現實檢驗與更新的可能。
這就是 LifeOS 的語言更新能力。
</script>

<script type="text/plain" id="d-fbtpl">
你是一位融合莊子、維根斯坦、海德格與AI生成思維的思想型臉書作者。請把抽象思想寫成讀者能理解、能感受、能實踐的原創文章。

【本次設定】
主題：{主題}
讀者困境：{困境}
文章類型：{類型}
核心觀點：{觀點}
長度：{長度}

【核心任務】
從具體生活經驗出發，讓讀者認出自己的困境；透過哲學追問，改變他理解問題的方式；最後提供一個可以採取的新選擇。

【文章結構】
一、標題：寫出有張力、容易理解的標題。可使用提問、矛盾或數字，但不要誇大承諾。
二、生活開場：用兩至三個具體場景開頭。寫出人物的動作、心裡的話與難以說出口的感受。先讓讀者感到「這就是我的經驗」，再引入觀念。
三、提出問題：指出這些場景背後共同的困境。透過兩至三個逐步深入的問題，把讀者帶向核心觀點。轉折必須有理由，不要只靠漂亮句子。
四、分段展開：使用三至五個小節，小節標題本身要表達一個觀點。每節包含一個清楚的主張、一段哲學解釋、一個貼近日常的例子，以及一句簡潔、值得停下來思考的話。
依文章類型調整：
- 生活覺醒：場景 → 追問 → 重新理解 → 新的選擇。
- 數字清單：每項寫出舊習慣、新理解、具體行動。
- 經典轉譯：原典觀念 → 當代處境 → 解讀 → 練習。
- 哲學與AI：思想實驗 → 概念辨析 → AI類比 → 回到人的生活。
五、回到實踐：提供一個今天就能嘗試的小練習（例如：改寫一句自我評價、暫停一次慣性回應、重新提出一個問題）。行動要與文章的推理相連。
六、結尾：呼應開頭的場景，讓讀者看見新的可能性。用有餘韻的短段落收尾。只有提供書籍、訂閱或連結時，才加入延伸閱讀入口。{延伸}

【思想使用原則】
- 莊子：從成心、齊物、物化、逍遙等觀念選擇最相關的一個。
- 維根斯坦：觀察語言在具體情境中的使用，以及一句話如何影響我們理解自己。
- 海德格：探索人在日常角色、他人期待與自身可能性之間的處境。
- AI與前沿理論：只有與主題有實質關係時才使用；分清事實、推論與比喻。
- 每篇最多深入使用兩個思想來源，避免堆疊名詞。
- 不使用傳統科學作為論證框架，使用維根斯坦、海德格、前沿理論等適合題目的視角。
- 「靈魂、母體、生成、權重」若出現，須說明其含義或比喻用途。
- 不捏造哲學家引言、研究、數據或科學結論。

【語氣與排版】
- 溫柔、清醒、有思想力度，像與讀者進行一場深入對話。
- 以「你、我們」建立連結，但避免替所有人下判斷。
- 短句與中長句交替；每段一至三句，適度留白。
- 可以使用排比與對照，但不要每段都使用「不是……而是……」。
- 金句必須由前面的例子與推理支撐。
- 保留情境差異，避免把所有傷害都解釋成當事人自己的問題。
- 使用原創例子與措辭，避免複製特定作者的標誌性表達。

【輸出】
輸出一個標題與完整貼文，不附寫作分析。
完成前自行檢查：場景是否具體、觀念是否準確、轉折是否成立、行動是否可做、結尾是否呼應開頭。
{材料}
</script>

const POST=document.getElementById('d-post').textContent.trim();
SELF.push({g:'整合貼文｜Facebook／LINE 範例',txt:POST,html:()=>`<div class="card wide"><pre class="t">${hl(POST)}</pre><div class="acts"><button class="mini" data-copy="${esc(POST)}">複製全文</button>${toPost(POST)}</div></div>`});
SELF.push({g:'定位與統一公式',txt:'Language OS 自我對話更新模組 來源管理 書籍 原始觀點 分析衍生層',html:()=>`<div class="card wide">${hl('建議將本書歸入 Language OS／自我對話更新模組。來源分三層：書籍正式目錄與公開書介＝出版來源；過去的語言升維、善待自己、世界模型、Nina溝通等貼文＝原始觀點來源；12節點、差異表、生活案例與訓練指標＝分析衍生層。整合時先比對既有節點、保留原文、標示別名與來源，再加入關係、證據等級及模型版本。')}<div class="new" style="margin-top:8px">${hl('語言是認知模型的重要介面，不是能夠直接控制現實的魔法。')}</div></div>`});
const OV=[];{let cur=null;raw('d-ov').forEach(l=>{if(l.startsWith('## ')){cur={t:l.slice(3),b:[]};OV.push(cur)}else cur.b.push(l)});}
const OVI=OV.map(o=>({g:'',txt:o.t+' '+o.b.join(' '),html:()=>`<div class="card"><h3>${hl(o.t)}</h3><pre class="t">${hl(o.b.join('\n'))}</pre></div>`}));

/* ---- 練習工具 ---- */
const CARD=['今天我最想改善的對話','我原本想說的舊語言','這句話背後真正的需求','我可以使用的新語言','我希望對方理解的重點','我願意採取的最小行動','對方實際的反應','下一次我要調整的地方'];
const DIAG=['節點編號 E＿＿','原始對話','主要錯誤類型 D＿＿','已確認事實','我的解讀','我的情緒','真正需求','對方可能的需求','舊語言','新語言','最小行動','預測結果','實際結果','預測誤差','下一次修正','模型版本 V＿＿'];
const DAILY=['我現在遇到的真正問題是什麼？','我是否被舊語言限制？','哪些因素正在強化舊模式？','什麼事情被我賦予過高權重？','我希望創造什麼具體結果？','今天能改變的最小行動是什麼？','結果不如預期時，我要更新哪個模型？'];
const TEN=['覺察｜今天我是否把感受誤認成事實？','表徵｜今天我是否用更精確的語言描述問題？','結構｜今天我是否看見新的關係或影響因素？','權重｜今天我是否把時間留給真正重要的事？','策略｜今天我是否找到比盲目努力更有效的方法？','目標｜今天我是否知道行動要改善什麼？','行動｜今天我是否完成至少一項最小行動？','回饋｜今天我是否觀察到具體結果？','成長｜今天我是否根據新證據修正一個判斷？','自由｜今天我是否增加了一個安全可行的新選項？'];
const TENS=['事實：「我觀察到目前發生的是＿＿。」','表徵：「我原本把它理解成＿＿。」','結構：「可能影響結果的因素包括＿＿。」','權重：「我現在最重視的是＿＿。」','目標：「我真正希望改善的是＿＿。」','行動：「我今天願意先嘗試＿＿。」','預測：「我預期這樣做可能產生＿＿。」','回饋：「實際結果是＿＿。」','更新：「我發現需要修正的是＿＿。」','再測：「下一次我將改用＿＿，並觀察＿＿。」'];
const store={get(){try{return JSON.parse(localStorage.getItem('lifeos_lang_rec')||'[]')}catch(e){return[]}},set(v){try{localStorage.setItem('lifeos_lang_rec',JSON.stringify(v))}catch(e){}}};
function form(id,title,fields){return `<div class="card"><h3>${title}</h3>${fields.map((f,i)=>`<label>${esc(f)}</label><input class="i" id="${id}${i}">`).join('')}<button class="btn" data-save="${id}">儲存紀錄</button> <button class="btn g2" data-clear="${id}">清空</button></div>`}
function practiceHTML(){const recs=store.get();
 const list=recs.filter(r=>hit(r.title+' '+r.items.map(x=>x.join(' ')).join(' ')));
 return `<div class="grid">${form('c','每日溝通訓練卡',CARD)}${form('d','100節點統一診斷表單',DIAG)}
 <div class="card"><h3>每日七問</h3>${DAILY.map((d,i)=>`<div class="f"><b>0${i+1}</b>${hl(d)}</div>`).join('')}<h3 style="margin-top:12px">LifeOS 每日完整對話公式</h3>${TENS.map(say).join('')}</div>
 <div class="card"><h3>十大能力每日檢查</h3>${TEN.map((t,i)=>`<label style="color:var(--ink);margin:4px 0"><input type="checkbox" data-chk="${i}" ${chk()[i]?'checked':''}> ${hl(t)}</label>`).join('')}<div class="diff">今日完成 ${chk().filter(Boolean).length}/10（每天自動重置）</div></div>
 </div><h2 class="g">我的紀錄（${list.length}）</h2><div class="grid">${list.map(r=>`<div class="card"><h3>${esc(r.title)} <small class="diff">${esc(r.date)}</small></h3>${r.items.filter(x=>x[1]).map(x=>F(x[0],x[1])).join('')}<div class="acts"><button class="mini" data-copy="${esc(r.items.filter(x=>x[1]).map(x=>x[0]+'：'+x[1]).join('\n'))}">複製</button><button class="mini" data-del="${r.id}">刪除</button></div></div>`).join('')||'<div class="empty">尚無紀錄</div>'}</div>`}
function chk(){try{const o=JSON.parse(localStorage.getItem('lifeos_chk')||'{}');return o.d===new Date().toDateString()?o.v:[]}catch(e){return[]}}

/* ---- 臉書貼文 ---- */
const FBTPL=document.getElementById('d-fbtpl').textContent.trim();
let fb={主題:'',困境:'',類型:'自行選擇最適合的類型',觀點:'',長度:'繁體中文約1,000至1,500字',延伸:'',材料:''};
function fbHTML(){const types=['自行選擇最適合的類型','生活覺醒','數字清單','經典轉譯','哲學與AI論述'];
 return `<div class="grid"><div class="card"><h3>臉書貼文提示詞產生器</h3><div class="diff">填好後複製提示詞，貼到你習慣的 AI 對話中使用（本 APP 不連網）。在其他分頁按「📝 帶入貼文」可把卡片內容放進材料。</div>
 <label>主題</label><input class="i" data-fb="主題" value="${esc(fb.主題)}" placeholder="未填則請 AI 從材料提取">
 <label>讀者困境</label><input class="i" data-fb="困境" value="${esc(fb.困境)}" placeholder="未填則從材料辨識具體生活困境">
 <label>文章類型</label><select data-fb="類型">${types.map(t=>`<option ${t===fb.類型?'selected':''}>${t}</option>`).join('')}</select>
 <label>核心觀點</label><input class="i" data-fb="觀點" value="${esc(fb.觀點)}" placeholder="未填則提出與材料一致的觀點">
 <label>長度</label><input class="i" data-fb="長度" value="${esc(fb.長度)}">
 <label>延伸閱讀（書籍／訂閱／連結，可空白）</label><input class="i" data-fb="延伸" value="${esc(fb.延伸)}">
 <label>材料</label><textarea data-fb="材料" style="min-height:160px">${esc(fb.材料)}</textarea>
 <button class="btn" id="fbcopy">複製完整提示詞</button> <button class="btn g2" id="fbclr">清空材料</button></div>
 <div class="card"><h3>預覽</h3><pre class="t" id="fbpre" style="font-size:13px;max-height:70vh;overflow:auto">${esc(fbBuild())}</pre></div></div>`}
function fbBuild(){return FBTPL.replace('{主題}',fb.主題||'請從材料提取').replace('{困境}',fb.困境||'請從材料辨識具體生活困境').replace('{類型}',fb.類型).replace('{觀點}',fb.觀點||'請提出與材料一致的觀點').replace('{長度}',fb.長度||'繁體中文約1,000至1,500字').replace('{延伸}',fb.延伸?'\n延伸閱讀入口：'+fb.延伸:'').replace('{材料}',fb.材料?'\n【材料】\n'+fb.材料:'')}

/* ---- 分頁 ---- */
const TABS=[['ov','總覽',OVI],['lang','語言升級100',LANG],['err','錯誤診斷100',ERR],['node','12節點',NODE],['abl','十大能力',ABL],['self','自我對話整合',SELF],['prac','練習卡',null],['fb','臉書貼文',null]];
function renderNav(){$('#nav').innerHTML=TABS.map(([k,n,d])=>{const c=d&&Q.length?d.filter(x=>hit(x.txt)).length:'';return `<button data-tab="${k}" class="${k===TAB?'on':''}">${n}${c!==''?`<small>${c}</small>`:''}</button>`}).join('')}
function render(){renderNav();const t=TABS.find(x=>x[0]===TAB),m=$('#main');
 if(TAB==='prac'){m.innerHTML=practiceHTML();return}
 if(TAB==='fb'){m.innerHTML=fbHTML();return}
 const data=t[2],gs=[...new Set(data.map(x=>x.g))].filter(Boolean),sel=GRP[TAB]||'';
 const items=data.filter(x=>hit(x.txt)&&(!sel||x.g===sel));
 let h=gs.length>1?`<div class="chips"><button data-grp="" class="${!sel?'on':''}">全部 ${data.length}</button>${gs.map(g=>`<button data-grp="${esc(g)}" class="${g===sel?'on':''}">${esc(g.split('｜').pop().split('（')[0])}</button>`).join('')}</div>`:'';
 if(TAB==='ov')h+=`<div class="card wide" style="margin-bottom:10px"><b>使用方式：</b>上方搜尋欄可跨分頁搜尋（分頁旁數字＝符合筆數）。卡片可「複製」句型，或「📝 帶入貼文」把內容送到臉書貼文提示詞。</div>`;
 if(!items.length){m.innerHTML=h+'<div class="empty">找不到符合的內容，試試其他分頁（看分頁旁的數字）。</div>';return}
 let cur=null,out='';items.forEach(x=>{if(x.g!==cur){if(cur!==null)out+='</div>';cur=x.g;out+=(x.g?`<h2 class="g">${esc(x.g)}</h2>`:'')+'<div class="grid">'}out+=x.html()});out+='</div>';
 m.innerHTML=h+out}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1400)}
function copy(s){const ok=()=>toast('已複製');if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(s).then(ok,()=>fb2(s));else fb2(s);function fb2(s){const a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('複製失敗')}a.remove()}}
document.addEventListener('click',e=>{const b=e.target.closest('button,input[type=checkbox]');if(!b)return;const d=b.dataset;
 if(d.tab){TAB=d.tab;render();scrollTo(0,0)}
 else if(d.grp!==undefined){GRP[TAB]=d.grp;render()}
 else if(d.copy!==undefined)copy(d.copy);
 else if(d.post!==undefined){fb.材料=(fb.材料?fb.材料+'\n\n':'')+d.post;toast('已帶入臉書貼文材料')}
 else if(d.save){const fs=d.save==='c'?CARD:DIAG,items=fs.map((f,i)=>[f,$('#'+d.save+i).value.trim()]);if(!items.some(x=>x[1]))return toast('請先填寫內容');const r=store.get();r.unshift({id:Date.now(),title:d.save==='c'?'每日溝通訓練卡':'溝通錯誤診斷',date:new Date().toLocaleString('zh-TW'),items});store.set(r);toast('已儲存');render()}
 else if(d.clear){document.querySelectorAll(`[id^="${d.clear}"]`).forEach(i=>i.value='')}
 else if(d.del){if(confirm('刪除這筆紀錄？')){store.set(store.get().filter(r=>r.id!=d.del));render()}}
 else if(d.chk!==undefined){const v=chk().slice();v[d.chk]=b.checked;try{localStorage.setItem('lifeos_chk',JSON.stringify({d:new Date().toDateString(),v}))}catch(e){}render()}
 else if(b.id==='fbcopy')copy(fbBuild());
 else if(b.id==='fbclr'){fb.材料='';render()}
 else if(b.id==='theme'){const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('lifeos_theme',r.dataset.theme)}catch(e){}}
});
document.addEventListener('input',e=>{const k=e.target.dataset.fb;if(k){fb[k]=e.target.value;$('#fbpre').textContent=fbBuild()}});
document.addEventListener('change',e=>{const k=e.target.dataset.fb;if(k){fb[k]=e.target.value;$('#fbpre').textContent=fbBuild()}});
let tm;$('#q').addEventListener('input',e=>{clearTimeout(tm);tm=setTimeout(()=>{Q=e.target.value.trim().split(/\s+/).filter(Boolean);if(Q.length&&TABS.find(x=>x[0]===TAB)[2]&&!TABS.find(x=>x[0]===TAB)[2].some(x=>hit(x.txt))){const f=TABS.find(x=>x[2]&&x[2].some(y=>hit(y.txt)));if(f)TAB=f[0]}render()},150)});
try{const t=localStorage.getItem('lifeos_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
render();
</script>
</body>
</html>
