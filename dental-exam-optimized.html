<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>牙醫國考 Master OS｜精簡版</title>
<style>
:root{--ink:#182033;--muted:#667085;--bg:#f6f8fb;--panel:#fff;--soft:#f8fafc;--line:#d8dee8;--nav:#102033;--nav2:#183451;--teal:#0f8b8d;--tealbg:#e7f7f6;--bluebg:#eef6ff;--goldbg:#fff7e6;--okbg:#edfdf3;--ok:#2f9e56;--badbg:#fff1f0;--bad:#e5484d;--r:8px}
@media(prefers-color-scheme:dark){:root{--ink:#e6edf5;--muted:#9aa8ba;--bg:#0e1622;--panel:#16212f;--soft:#1b2838;--line:#2b3a4d;--nav:#0a121c;--nav2:#101c2b;--teal:#2fb5b7;--tealbg:#123536;--bluebg:#16293f;--goldbg:#3a2f14;--okbg:#12331f;--badbg:#3b1a1a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;line-height:1.65}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;overflow:auto;background:linear-gradient(180deg,var(--nav),var(--nav2));color:#eef6ff;padding:18px 12px}
.brand{padding:4px 10px 14px;border-bottom:1px solid rgba(255,255,255,.15);font-size:19px;font-weight:900}
.brand small{display:block;margin-top:4px;color:#bbcee4;font-size:12px;font-weight:400}
.nav-btn{width:100%;display:flex;gap:10px;align-items:center;padding:9px 10px;margin-top:4px;border-radius:var(--r);text-align:left}
.nav-btn.active,.nav-btn:hover{background:rgba(255,255,255,.13)}
.nav-btn i{width:20px;text-align:center;font-style:normal;opacity:.8}
.nav-btn b{margin-left:auto;font-size:12px;background:var(--bad);border-radius:99px;padding:0 7px}
main{min-width:0;padding:0 24px 60px}
.top{position:sticky;top:0;z-index:5;margin:0 -24px 18px;padding:12px 24px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.search{flex:1;max-width:720px;display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px}
.search:focus-within{border-color:var(--teal)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none}
#menu{display:none;font-size:20px;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
h1{font-size:28px;line-height:1.2;margin:0 0 6px}h2{font-size:21px;margin:0 0 10px}h3{font-size:16px;margin:0 0 6px}p{margin:0 0 6px}
.muted{color:var(--muted);font-size:14px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{display:block;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;scroll-margin-top:80px}
button.card:hover{border-color:var(--teal)}
.card.flash{outline:3px solid var(--teal)}
.card.known{background:var(--okbg)}
.badge{display:inline-block;padding:2px 9px;margin:0 4px 4px 0;border-radius:99px;background:var(--bluebg);font-size:12px;font-weight:700}
.badge.t{background:var(--tealbg)}.badge.g{background:var(--goldbg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{padding:6px 12px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:14px;font-weight:700}
.chip.active{background:var(--teal);border-color:var(--teal);color:#fff}
.btn{padding:8px 14px;border-radius:var(--r);background:var(--teal);color:#fff;font-weight:700}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.trap{border-left:3px solid #d9902a;background:var(--goldbg);padding:6px 9px;border-radius:0 6px 6px 0;font-size:14px;margin-top:6px}
.kn{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted);cursor:pointer}
.bar{height:8px;background:var(--soft);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;background:var(--teal)}
.steps{display:grid;gap:8px;counter-reset:s}
.steps div{counter-increment:s;display:flex;gap:10px;background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.steps div:before{content:counter(s);flex:0 0 26px;height:26px;display:grid;place-items:center;border-radius:50%;background:var(--teal);color:#fff;font-weight:900;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}th{background:var(--bluebg);white-space:nowrap}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--ink);font-weight:800}
.say{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;font-size:11px;vertical-align:middle;margin-right:6px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.opt{display:block;width:100%;margin-top:7px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--soft);text-align:left}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt:disabled{cursor:default}
.opt.pick{border-color:var(--teal);background:var(--tealbg);font-weight:700}
select{padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);max-width:100%}
.opt.ok{background:var(--okbg);border-color:var(--ok);font-weight:700}
.opt.no{background:var(--badbg);border-color:var(--bad)}
.exp{display:none;margin-top:10px;padding:9px 11px;border-left:4px solid var(--teal);background:var(--soft);font-size:14px}
.q.done .exp{display:block}
mark{background:#ffe58a;color:#182033;border-radius:3px;padding:0 1px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:fixed;z-index:20;inset:0 auto 0 0;width:250px;transform:translateX(-102%);transition:transform .2s}aside.open{transform:none}#menu{display:block}main{padding:0 14px 50px}.top{margin:0 -14px 14px;padding:10px 14px}.two{grid-template-columns:1fr}h1{font-size:23px}}
@media print{aside,.top,.kn,.btn{display:none!important}.app{display:block}}
</style>
</head>
<body>
<div class="app">
<aside id="aside"><div class="brand">牙醫國考 Master OS<small>一階打底・二階解題・測驗與錯題本</small></div><nav id="nav"></nav></aside>
<main>
<div class="top"><button id="menu" aria-label="選單">☰</button><label class="search">⌕<input id="search" type="search" autocomplete="off" placeholder="搜尋全部內容：考點、疾病、藥物、影像、英文縮寫（按 / 聚焦）"></label></div>
<div id="view"></div>
</main>
</div>
<script>
/* ===== 資料 ===== */
// [id, 階段, 名稱, 範圍, 考點: '標題|重點|陷阱']
const S=[
['anatomy',1,'口腔解剖胚胎組織','牙齒、牙周、顎骨、唾液腺、頭頸神經血管、牙胚發育',[
'三叉神經 V3|下齒槽神經經下顎孔入下顎管，支配下顎牙；舌神經負責舌前 2/3 一般感覺。|舌前 2/3 的味覺是顏面神經的鼓索（chorda tympani）搭舌神經便車，不是舌神經本身。',
'顏面神經 VII|支配表情肌；鼓索管舌前 2/3 味覺與頜下腺、舌下腺分泌。|腮腺分泌由舌咽神經（IX）經耳神經節支配；顏面神經只是穿過腮腺。',
'牙胚發育|蕾期→帽期→鐘期。造釉器形成琺瑯質；牙乳頭形成牙本質與牙髓；牙囊形成牙骨質、PDL、齒槽骨。|只有琺瑯質來自外胚層，其餘牙組織來自外胚間葉（神經脊）。',
'琺瑯質|約 96% 無機質，由造釉細胞形成，萌出後無細胞、不可再生；臨界 pH 約 5.5。|Retzius 線是生長線；Hunter-Schreger 帶是釉柱走向造成的光學現象。',
'牙本質|造牙本質細胞終生形成：原發、續發、第三（修復性／反應性）牙本質。敏感痛以流體動力學說解釋。|管周牙本質礦化度高於管間牙本質。',
'牙骨質與牙周膜|無細胞牙骨質在頸側 1/3 主司附著；有細胞牙骨質在根尖 1/3。Sharpey 纖維埋入牙骨質與骨。|PDL 主纖維以斜行纖維最多，負責抵抗咬合垂直力。',
'唾液腺|腮腺純漿液性（Stensen 管開口在上顎第二大臼齒對面）；頜下腺混合偏漿液（Wharton 管）；舌下腺混合偏黏液。|靜止時唾液主要來自頜下腺；刺激時腮腺比例才上升。',
'顳顎關節 TMJ|關節盤分上下腔：下腔轉動、上腔滑動。外翼肌附著於關節盤與髁頸。|關節面覆蓋的是纖維軟骨，不是透明軟骨。']],
['physio',1,'口腔生理與基礎醫學','咀嚼、吞嚥、唾液、疼痛、骨代謝、凝血、發炎與癒合',[
'唾液緩衝|主要是重碳酸鹽系統；流速越高，pH 與重碳酸鹽濃度越高。|Stephan 曲線：吃糖後數分鐘 pH 掉到 5.5 以下，約 30–60 分鐘才回升。',
'牙髓痛覺纖維|Aδ：快、銳痛、牙本質刺激；C：慢、鈍痛、持續，與不可逆性牙髓炎有關。|C 纖維耐缺氧，牙髓接近壞死時仍可能痛。',
'咀嚼肌|閉口：咬肌、顳肌、內翼肌；開口與前突：外翼肌。|顳肌後束負責下顎後縮。',
'吞嚥|口腔期（隨意）→咽期→食道期（不隨意）。|嬰兒型吞嚥（舌前推）持續存在與前牙開咬有關。',
'骨重塑|RANKL 促進破骨細胞分化，OPG 抑制；PTH 升血鈣，calcitonin 降血鈣。|矯正牙移動：壓力側骨吸收、張力側骨生成。',
'凝血檢查|外在路徑看 PT/INR（第 VII 因子）；內在路徑看 aPTT。warfarin 抑制維生素 K 依賴因子 II、VII、IX、X。|血友病 A 缺第 VIII 因子：aPTT 延長、PT 正常。',
'拔牙窩癒合|血塊→肉芽組織→編織骨→成熟骨。|血塊喪失會變成乾性齒槽炎，不是感染化膿。',
'味覺支配|舌前 2/3：VII；舌後 1/3：IX；會厭：X。|一般感覺與味覺的神經不同，題目常混在一起問。']],
['micro',1,'口腔微生物免疫','生物膜、齲齒菌、牙周致病菌、病毒黴菌與宿主免疫',[
'生物膜形成|獲得性薄膜→早期定殖菌（S. sanguinis、Actinomyces）→橋接菌 Fusobacterium nucleatum→晚期厭氧革蘭陰性菌。|獲得性薄膜（pellicle）是唾液醣蛋白，本身不含細菌。',
'Streptococcus mutans|用蔗糖經 glucosyltransferase 合成不溶性葡聚醣，產酸且耐酸，是齲齒起始主要菌。|Lactobacillus 與齲齒「進展」較相關，不是起始。',
'牙周致病菌|紅色複合體：P. gingivalis、T. forsythia、T. denticola。|A. actinomycetemcomitans 不在紅色複合體，與臼齒門齒型牙周炎相關，會產生 leukotoxin。',
'LPS 內毒素|革蘭陰性菌外膜成分，經 TLR4 引發 IL-1、TNF-α、PGE2，造成骨吸收。|牙周破壞大部分來自宿主發炎反應，不只是細菌直接破壞。',
'分泌型 IgA|唾液主要抗體，雙體，阻止細菌黏附。|牙齦溝液中主要抗體是 IgG。',
'中性球|牙齦溝第一線防禦。功能缺陷（LAD、Papillon-Lefèvre、Chédiak-Higashi）會早發嚴重牙周破壞。|看到兒童嚴重牙周破壞要想到全身性疾病。',
'口腔病毒|HSV-1：原發性皰疹性齦口炎，復發於唇與角化黏膜；Coxsackie A：皰疹性咽峽炎、手足口病；EBV：毛狀白斑。|復發性皰疹在角化黏膜，阿弗他潰瘍在非角化黏膜。',
'念珠菌|Candida albicans；偽膜型白膜可刮除。誘因：抗生素、吸入型類固醇、義齒、口乾、免疫低下。|「刮得掉」是與白斑最大的差別。']],
['path',1,'口腔病理','癌前病變、口腔癌、囊腫、齒源性腫瘤與黏膜疾病',[
'白斑 leukoplakia|刮不掉、無法歸類為其他疾病的白色斑塊，是排除性臨床診斷，需切片看有無上皮異生。|口底、舌腹側緣、軟顎是高風險部位。',
'紅斑 erythroplakia|鮮紅絨布狀斑塊，惡性轉化風險遠高於白斑。|多數切片時已是重度異生或原位癌。',
'口腔鱗狀細胞癌|最常見口腔惡性腫瘤。危險因子：菸、酒、檳榔；台灣頰黏膜與舌最常見。|潰瘍超過 2 週不癒合且有硬結就要切片。',
'根尖囊腫|最常見的顎骨囊腫，源自 Malassez 上皮殘留，病因牙牙髓已壞死。|牙髓有活性就不會是根尖囊腫。',
'含齒囊腫|包住未萌牙牙冠、附著於 CEJ，源自縮餘釉上皮；好發下顎第三大臼齒與上顎犬齒。|圍冠透亮也可能是 OKC 或單囊型成釉細胞瘤。',
'齒源性角化囊腫 OKC|源自牙板殘留；副角化上皮、表面波浪狀、基底層柵狀排列；復發率高。|沿骨髓腔前後向生長、膨隆不明顯；多發要想到 Gorlin 症候群。',
'成釉細胞瘤|良性但局部侵襲，好發下顎後部，多房性「肥皂泡」影像，需含安全邊緣切除。|單囊型多見於年輕人，預後較好。',
'扁平苔癬|雙側頰黏膜 Wickham 紋；T 細胞媒介，基底層液化變性、上皮下帶狀淋巴球浸潤。|糜爛型需長期追蹤。']],
['pharm',1,'牙科藥理與全身醫學','局麻、止痛、抗生素、抗凝血與內科病患風險',[
'局麻機轉|阻斷電壓依賴性鈉通道。未解離的鹼基型穿過神經膜，進入後以離子型作用。|發炎組織 pH 低，鹼基型變少，所以麻不起來。',
'Amide 與 Ester|Amide（lidocaine、articaine、mepivacaine、bupivacaine）肝代謝；Ester（procaine、benzocaine）由血漿酯酶代謝，過敏較多。|articaine 是 amide 但帶酯基，部分在血漿代謝，半衰期短。',
'Lidocaine 劑量|2% = 20 mg/mL，一支 1.8 mL 含 36 mg。含 epinephrine 上限約 7 mg/kg（不超過 500 mg）；Malamed 保守建議 4.4 mg/kg。|算題先把 % 換成 mg/mL：百分比 ×10。',
'血管收縮劑|1:100,000 = 0.01 mg/mL。心血管高風險病人上限 0.04 mg（約 2 支）。|與非選擇性 β 阻斷劑併用會血壓上升、反射性心搏過緩。',
'止痛藥|NSAID 抑制 COX，有腸胃、腎、出血風險；acetaminophen 無抗發炎作用，過量傷肝（解毒劑 N-acetylcysteine）。|牙科急性痛首選 NSAID，不是鴉片類。',
'抗生素選擇|牙源性感染首選 penicillin 類；過敏改 clindamycin 或 azithromycin；metronidazole 只對厭氧菌。|抗生素是輔助，去除病因與引流才是治療。',
'感染性心內膜炎預防|只給高風險者（人工瓣膜、曾患 IE、特定先天性心臟病、心臟移植後瓣膜病變）。術前 30–60 分鐘口服 amoxicillin 2 g（兒童 50 mg/kg）。|2021 AHA 已不建議以 clindamycin 作為替代藥。',
'抗凝血與抗骨吸收藥|warfarin 看 INR，在治療範圍內（多數指引 ≤3.5）簡單拔牙不停藥、加強局部止血。雙磷酸鹽與 denosumab 要評估 MRONJ 風險。|擅自停抗凝血藥的血栓風險大於拔牙出血風險。']],
['public',1,'公共衛生倫理法規','齲齒指數、氟化物、流行病學、感染控制與告知同意',[
'DMFT|恆牙齲蝕經驗指數（Decayed、Missing、Filled），只增不減；乳牙用 dmft／deft。|M 只計因齲齒而拔除的牙。',
'氟化物機轉|形成氟磷灰石使臨界 pH 降到約 4.5、促進再礦化、抑制細菌醣解。飲水加氟建議濃度 0.7 ppm。|主要效果來自萌出後的局部作用，不是全身性吸收。',
'氟中毒|可能中毒劑量（PTD）為 5 mg F/kg；氟斑牙發生在牙齒發育期（約 8 歲前）攝取過量。|急性誤食處置：給牛奶或鈣劑後送醫。',
'窩溝封填|對小窩裂溝齲最有效，成功關鍵是隔濕。|脫落的封填劑要補，否則邊緣更容易蛀。',
'篩檢指標|敏感度 = TP/(TP+FN)；特異度 = TN/(TN+FP)。|陽性預測值會隨盛行率上升；敏感度與特異度不受盛行率影響。',

['perio','關於抽菸對牙周的影響，下列何者正確？','抽菸者探診出血常較少，容易低估發炎程度','抽菸者的探診出血一定比非抽菸者多','抽菸不影響牙周治療效果','抽菸只影響牙齒染色，不影響骨喪失','尼古丁造成血管收縮並抑制中性球功能，掩蓋發炎徵象；抽菸者骨喪失更多、治療與植牙預後較差。'],

['prostho','根管治療後牙齒製作牙冠時，建議的 ferrule（箍效應）高度為何？','至少 1.5–2 mm 的健康齒質被牙冠環繞','0.5 mm 即足夠','必須 5 mm 以上','不需要，只要 post 夠長即可','足夠的 ferrule 是抗牙根斷裂最重要的因素，比 post 的種類更重要；不足時考慮牙冠增長術或矯正牽引。'],
['prostho','固定補綴牙體預備時，兼顧固位與可就位性的理想總聚合角度（taper）約為多少？','約 6 度','0 度（完全平行）','約 30 度','約 45 度','軸壁越接近平行固位越好，理論理想值約 6°；臨床實際多落在 10–20°。聚合角過大時固位力快速下降。'],
['prostho','藻膠（alginate）印模取下後應盡快灌模，主要原因為何？','會因離水（syneresis）與吸水（imbibition）而變形','會持續聚合並釋放乙醇','會與石膏發生化學反應而無法硬化','放置越久強度越高，會難以脫模','Alginate 為不可逆水膠體，含水量高、尺寸穩定性差，建議 10–15 分鐘內灌模。釋放乙醇的是縮合型矽膠。'],
['prostho','下列哪一種彈性印模材的尺寸穩定性最佳？','加成型矽膠（PVS）','藻膠（alginate）','縮合型矽膠','多硫化物（polysulfide）','PVS 聚合無副產物，可延後或重複灌模。注意乳膠手套中的硫化物會抑制其聚合。'],
['prostho','Ante’s law 的內容為何？','支台齒的牙周膜總面積應大於或等於被取代缺牙的牙周膜面積','支台齒數目應為缺牙數目的兩倍','牙橋長度不可超過三個牙位','支台齒冠根比必須為 1:2','用於評估固定牙橋支台齒是否足夠。理想冠根比 2:3，可接受的最低限為 1:1。'],
['prostho','上顎全口義齒的後腭封閉區（posterior palatal seal）應設定於何處？','顫動線（vibrating line）附近','切齒乳頭','硬腭中縫','上顎結節頰側','後緣放在硬軟腭交界、可動與不可動組織之間，可請病人發「啊」音或用 Valsalva 法定位，以補償樹脂收縮並維持邊緣封閉。'],
['prostho','全口義齒咬合垂直距離設定「過高」時，可能出現何種情形？','說話時牙齒碰撞、肌肉痠痛疲勞、息止間隙消失','口角下垂、口角炎、下顏面變短','咀嚼效率下降但非常舒適','發 s 音時上下牙間隙過大','過高：牙齒碰撞聲、肌肉疲勞、黏膜痠痛；過低：下顏面短、口角炎、顯老、咬合無力。'],
['prostho','活動局部義齒（RPD）中，主要提供「支持」（對抗朝向組織的咬合力）的組件為何？','支托（rest）','固位臂（retentive clasp arm）','小連接體','間接固位體','支持＝rest（與游離端的義齒基底）；固位＝固位臂尖端進入倒凹；穩定＝對抗臂、小連接體；間接固位體防止游離端翹起。'],
['prostho','關於中心關係（centric relation, CR），下列何者正確？','是髁頭與關節盤在關節窩前上位的顎位，與牙齒接觸無關且可重複','是上下牙最大咬頭嵌合的位置','是下顎完全前突的位置','會隨補綴物形態改變','CR 是骨對骨的關係，全口重建或無牙病人以此為參考；最大咬頭嵌合位（MIP／CO）是牙對牙的關係。'],
['prostho','兩支相鄰植體之間、以及植體與鄰近天然牙之間，建議至少保留多少距離？','植體間 3 mm；植體與天然牙 1.5 mm','植體間 1 mm；植體與天然牙 0.5 mm','植體間 7 mm；植體與天然牙 5 mm','兩者皆 0 mm 即可','距離不足會造成植體間骨嵴吸收與牙間乳頭喪失；頰側骨板建議至少保留約 2 mm。'],
['prostho','下列哪一種橋體（pontic）設計因組織面呈凹面、無法清潔而不建議使用？','鞍狀型（saddle / ridge lap）','衛生型（sanitary）','卵圓型（ovate）','改良蓋嵴型（modified ridge lap）','鞍狀型凹面包覆牙嵴，牙線無法清潔。後牙非美觀區可用衛生型；前牙美觀區用改良蓋嵴型或卵圓型。'],
['prostho','全口義齒通常採用哪一種咬合型式，以增加義齒穩定性？','雙側平衡咬合（bilateral balanced occlusion）','犬齒保護咬合','前牙引導並使後牙完全離開','單側群體功能咬合','側方與前突運動時工作側與平衡側同時接觸，可避免義齒翹動；天然齒列與固定補綴則偏好犬齒保護或群體功能。'],
['surgery','拔牙後第 3–5 天出現劇烈放射性疼痛，齒槽窩空虛、骨面裸露並有惡臭，但無明顯腫脹或化膿。最適當的處置為何？','溫和沖洗齒槽窩並置入鎮痛敷料，給予止痛','大範圍搔刮齒槽窩直到重新大量出血','以高劑量抗生素為主要治療','立即住院進行切開引流','此為乾性齒槽炎（alveolar osteitis），屬血塊溶解而非細菌感染為主，以症狀治療為原則；危險因子：抽菸、口服避孕藥、下顎智齒、手術創傷大。'],
['surgery','下顎第三大臼齒拔除手術最常造成哪一條神經的感覺異常？','下齒槽神經','顏面神經','舌下神經','頰神經','最常見為下齒槽神經，其次是舌神經。全景片上牙根變暗、管壁白線中斷或管道轉向等為高風險徵象，可加照 CBCT。'],
['surgery','下顎阻生第三大臼齒依 Winter 分類，最常見的型態為何？','近心傾斜型（mesioangular）','遠心傾斜型（distoangular）','水平型','垂直型','下顎以 mesioangular 最常見也相對容易；下顎最困難的是 distoangular（上顎則相反，mesioangular 最難）。'],
['surgery','Ludwig’s angina 侵犯哪些筋膜間隙？處置的第一優先為何？','雙側下頜下、舌下與頦下間隙；首要維持呼吸道','單側頰間隙；首要止痛','翼下頜間隙；首要改善張口','犬齒間隙；首要冰敷','此為快速擴散的蜂窩性組織炎，舌頭被抬高後推造成呼吸道阻塞，需確保呼吸道、靜脈抗生素、切開引流並去除病灶牙。'],
['surgery','Le Fort II 型骨折的骨折線型態為何？','錐形骨折，經鼻骨、眼眶內側與下緣至翼突板','水平骨折，位於上顎齒槽突上方','顱顏分離，經鼻額縫與顴額縫','僅顴骨弓骨折','Le Fort I：水平（floating palate）；II：錐形（floating maxilla）；III：顱顏分離（floating face）。三者皆涉及翼突板。'],
['surgery','藥物相關顎骨壞死（MRONJ）的診斷條件不包括下列何者？','曾接受頭頸部放射線治療','目前或曾經使用抗骨吸收或抗血管新生藥物','顎顏面區有暴露骨或可經瘻管探及骨，持續超過 8 週','無顎骨轉移性疾病','有頭頸部放療史者應歸為放射性骨壞死（ORN）。MRONJ 相關藥物包括雙磷酸鹽、denosumab 與抗血管新生藥。'],
['surgery','頭頸部放射線治療「之前」，對於預後不良的牙齒應如何處理？','放療開始前約 2–3 週完成拔除，讓傷口初步癒合','等放療結束後一個月再拔','放療期間同步拔除','不需處理，放療會使病灶消失','放療後骨組織低血管、低細胞、低氧，拔牙易引發放射性骨壞死；必須拔牙時考慮高壓氧與微創處理。'],
['surgery','口腔黏膜病灶直徑約 3 cm 且臨床懷疑惡性時，應採何種切片方式？','切取式切片（incisional biopsy），取具代表性區域','切除式切片，把整個病灶直接切除','只做刷取細胞學檢查即可','先觀察三個月再決定','小於約 1 cm 且看似良性者可切除式切片；大型或疑惡性病灶做切取式，避開壞死中心，深度要足夠。超過 2 週未癒的潰瘍即應切片。'],
['surgery','下齒槽神經阻斷麻醉後，病人同側出現無法閉眼、嘴角下垂。最可能原因為何？','針尖過於後方，將麻藥注入腮腺而麻醉顏面神經','麻藥注入血管內','麻藥過敏','針頭斷裂','此為暫時性顏面神經麻痺，藥效退後恢復；期間需保護角膜（閉眼貼護、人工淚液）。預防：針尖須先碰到骨再注射。'],
['surgery','拔除哪一顆牙最容易造成口竇相通（oroantral communication）？','上顎第一大臼齒','上顎犬齒','下顎第一大臼齒','上顎中門齒','上顎第一大臼齒牙根最貼近上顎竇底。小於 2 mm 多可自行癒合；較大者需以頰側推進瓣等關閉，並囑咐勿擤鼻、勿用吸管。'],
['surgery','病人在局部麻醉注射後臉色蒼白、冒冷汗、短暫失去意識。最可能的診斷與第一步處置為何？','血管迷走神經性暈厥；將病人放平並抬高雙腳','過敏性休克；立即口服抗組織胺','局麻藥中毒；立即給予 flumazenil','過度換氣；給予高流量氧氣','暈厥是牙科最常見急症，因腦血流不足；採仰臥抬腿、維持呼吸道、給氧並監測生命徵象。'],
['surgery','顳顎關節「可復位性關節盤前移位」的典型表現為何？','開口與閉口各有一聲彈響（reciprocal click），開口度正常','開口受限且開口時下顎偏向健側','完全沒有關節音且開口受限 <25 mm','開口末期卡住無法閉口','不可復位性前移位（closed lock）：無彈響、開口受限、開口偏向患側。開口後無法閉合則是髁頭脫臼。'],
['pedo','乳牙最典型的萌出順序為何？（A 中門齒、B 側門齒、C 犬齒、D 第一乳臼齒、E 第二乳臼齒）','A → B → D → C → E','A → B → C → D → E','A → D → B → C → E','D → A → B → C → E','第一乳臼齒早於乳犬齒萌出。下顎乳中門齒約 6 個月最先萌出，乳牙列約 2.5–3 歲完成，共 20 顆。'],
['pedo','乳牙牙髓切斷術（pulpotomy）的適應症為何？','齲蝕露髓但發炎侷限於冠髓，無自發痛、無瘻管或根尖病變','有自發性夜間痛且有牙齦瘻管','牙根已吸收超過三分之二','牙齒有病理性動搖與根分叉透射','去除冠髓後根髓止血良好才可進行，藥劑可用 MTA、硫酸鐵或 formocresol。根髓已發炎或壞死則做 pulpectomy 或拔除。'],
['pedo','乳臼齒接受牙髓治療後，或有多面大範圍齲齒時，首選的復形方式為何？','不鏽鋼牙冠（SSC）','大型複合樹脂填補','玻璃離子體填補','銀汞齊填補','SSC 耐用、失敗率最低，適用於牙髓治療後、多面齲、高齲齒風險或發育缺陷的乳臼齒。'],
['pedo','恆牙第一大臼齒尚未萌出時第二乳臼齒就提早喪失，應選用哪一種空間維持器？','Distal shoe','Band and loop','舌側弓（lingual arch）','Nance 裝置','Distal shoe 伸入牙齦下引導第一大臼齒萌出。單顆第一乳臼齒早失用 band and loop；下顎雙側用舌側弓（需待恆門齒萌出）；上顎雙側用 Nance 或 TPA。'],
['pedo','Leeway space 是指什麼？','乳犬齒與第一、第二乳臼齒的近遠心寬度總和，大於繼生恆犬齒與小臼齒的差值','乳門齒之間的生理性間隙','上顎乳側門齒與乳犬齒之間的間隙','息止時上下牙之間的距離','Leeway space 上顎每側約 1.5 mm、下顎每側約 2.5 mm，可用於緩解輕度擁擠並讓大臼齒近心移動。'],
['pedo','靈長類間隙（primate space）在上、下顎的位置分別為何？','上顎：乳側門齒與乳犬齒之間；下顎：乳犬齒與第一乳臼齒之間','上下顎皆在乳犬齒與第一乳臼齒之間','上顎：乳犬齒與第一乳臼齒之間；下顎：乳側門齒與乳犬齒之間','上下顎皆在兩顆乳中門齒之間','記憶法：上顎在乳犬齒近心、下顎在乳犬齒遠心。'],
['pedo','Frankl 行為量表中，Rating 1（− −）代表什麼？','絕對負向：拒絕治療、強烈哭鬧抗拒','負向：不情願、不合作但未強烈反抗','正向：接受治療但略顯謹慎','絕對正向：關係良好且樂在其中','Frankl 1–4 分：1 絕對負向、2 負向、3 正向、4 絕對正向，為兒牙紀錄行為最常用的量表。'],
['pedo','常用的 5% 氟化鈉氟漆，其氟離子濃度約為多少？','22,600 ppm','1,000 ppm','5,000 ppm','12,300 ppm','5% NaF ＝ 22,600 ppm F。1.23% APF 凝膠為 12,300 ppm；一般含氟牙膏約 1,000–1,500 ppm。'],
['pedo','乳門齒完全脫出（avulsion）時，處置原則為何？','不再植，以免傷害繼生恆牙胚','立即再植並固定 2 週','再植後立即做根管治療','再植並固定 3 個月','乳牙脫出不再植。乳牙嵌入（intrusion）若未傷及恆牙胚，多可觀察等待自行再萌出。'],
['pedo','早發性兒童齲齒（奶瓶性齲齒）的典型分布為何？','上顎乳門齒最先且最嚴重，下顎乳門齒通常不受侵犯','下顎乳門齒最先受侵犯','只侵犯第二乳臼齒','上下顎乳門齒同樣嚴重','下顎門齒受舌頭覆蓋與舌下腺、頜下腺唾液保護。與含奶瓶睡覺、夜間頻繁哺餵相關。'],
['pedo','乳牙列第二乳臼齒遠心面的終端平面關係，最常見的型態為何？','齊平終端平面（flush terminal plane）','近心階梯（mesial step）','遠心階梯（distal step）','三者機率相同','齊平型最常見，恆牙第一大臼齒先呈咬頭對咬頭，之後利用 leeway space 與下顎生長轉為 Class I；遠心階梯則發展為 Class II。'],
['pedo','依一般建議，3–6 歲兒童每次刷牙的含氟牙膏用量為何？','豌豆大小，使用含氟 1,000 ppm 以上的牙膏','擠滿整個刷頭','不應使用含氟牙膏','米粒大小、不含氟的牙膏','3 歲以下用薄薄一層（米粒大小），3–6 歲用豌豆大小，皆建議含氟 1,000 ppm 以上，並由家長協助、避免吞食。'],

let store={known:{},wrong:[],stats:{}};

const others=(list,me,n=3)=>shuffle([...new Set(list)].filter(x=>x!==me)).slice(0,n);
function speak(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}
const say=t=>`<button class="say" data-say="${esc(t)}" title="發音">▶</button>`;
const steps=a=>`<div class="steps">${a.map(x=>`<div><span>${x}</span></div>`).join('')}</div>`;

function mind(title,labels){const it=labels.slice(0,8);return `<svg viewBox="0 0 720 290" role="img" aria-label="${esc(title)}心智圖">${it.map((x,i)=>{const a=-Math.PI/2+i*Math.PI*2/it.length,x2=360+262*Math.cos(a),y2=145+108*Math.sin(a);return `<line x1="360" y1="145" x2="${x2}" y2="${y2}" stroke="var(--line)" stroke-width="2"/><rect x="${x2-86}" y="${y2-20}" width="172" height="40" rx="8" fill="var(--${i%2?'bluebg':'tealbg'})" stroke="var(--line)"/><text x="${x2}" y="${y2+5}" text-anchor="middle" font-size="14">${esc(x.length>11?x.slice(0,10)+'…':x)}</text>`}).join('')}<ellipse cx="360" cy="145" rx="98" ry="36" fill="var(--teal)"/><text x="360" y="151" text-anchor="middle" font-size="16" style="fill:#fff">${esc(title)}</text></svg>`}

<div class="grid">${s.pts.map((p,i)=>{const k=s.id+':'+i;return `<div class="card ${store.known[k]?'known':''}" id="p-${s.id}-${i}"><h3>${i+1}. ${esc(p[0])}</h3><p>${esc(p[1])}</p><div class="trap"><b>陷阱：</b>${esc(p[2])}</div><label class="kn"><input type="checkbox" data-known="${k}" ${store.known[k]?'checked':''}>已熟</label></div>`}).join('')}</div>`},
diseases(){
  return `<div class="sec"><h1>疾病速查</h1><p class="muted">定位→線索→處置，一張卡一個疾病。</p></div><div class="grid">${DIS.map((d,i)=>`<div class="card" id="d-${i}"><span class="badge t">${d[1]}</span><h3>${esc(d[0])}</h3><p><b>線索：</b>${esc(d[2])}</p><p><b>處置：</b>${esc(d[3])}</p></div>`).join('')}</div>`},
materials(){
  return `<div class="sec"><h1>牙材藥理</h1><p class="muted">用途與注意事項一起背。按 ▶ 聽英文發音。</p></div><div class="grid">${MAT.map((m,i)=>`<div class="card" id="m-${i}"><span class="badge g">${m[2]}</span><h3>${say(m[0])}${esc(m[0])}｜${esc(m[1])}</h3><p>${esc(m[3])}</p><div class="trap"><b>注意：</b>${esc(m[4])}</div></div>`).join('')}</div>`},
images(){
  return `<div class="sec"><h1>影像判讀</h1><p class="muted">判讀順序：位置→邊界→內部密度→對牙根與周圍構造的影響→配合臨床症狀。影像不能單獨下診斷。</p></div><div class="grid">${IMG.map((m,i)=>`<div class="card" id="i-${i}"><h3>${say(m[0])}${esc(m[1])}</h3><p class="muted">${esc(m[0])}</p><p>${esc(m[2])}</p></div>`).join('')}</div>`},
english(){
  return `<div class="sec"><h1>牙科英文</h1><p class="muted">按 ▶ 發音。</p></div>
<div class="sec"><h2>字根字首</h2>${ROOTS.map(r=>`<span class="badge">${r[0]} ${r[1]}</span>`).join('')}</div>
<div class="sec"><h2>專業名詞</h2><div class="grid">${TERMS.map((t,i)=>`<div class="card" id="t-${i}">${say(t[0])}<b>${t[0]}</b>｜${t[1]}<div class="muted">${t[2]}</div></div>`).join('')}</div></div>
<div class="sec"><h2>常考縮寫</h2><div class="grid">${Object.entries(ABBR).map(([k,v],i)=>`<div class="card" id="a-${i}"><b>${esc(k)}</b>｜${v}</div>`).join('')}</div></div>`},
quiz(a){
  const scope=a||'all';if(!quiz||quiz.scope!==scope)newRound(scope);
  const cnt=f=>Q.filter(f).length;
  const scopes=[['all','綜合（考題＋自動出題）'],['exam',`全部考題（${Q.length}）`],['s1',`第一階考題（${cnt(q=>subj(q[0]).stage===1)}）`],['s2',`第二階考題（${cnt(q=>subj(q[0]).stage===2)}）`],...S.map(s=>[s.id,`${s.name}（${cnt(q=>q[0]===s.id)}）`]),['terms','英文與縮寫'],['dis','疾病'],['mats','牙材藥理']];
  if(scope==='wrong')scopes.unshift(['wrong','錯題重做']);
  const sel=(id,label,opts,cur)=>`<select id="${id}" aria-label="${label}">${opts.map(x=>`<option value="${x[0]}" ${String(x[0])===String(cur)?'selected':''}>${x[1]}</option>`).join('')}</select>`;
  const pct=v=>v&&v[1]?Math.round(v[0]/v[1]*100)+'%':'—',any=Object.keys(store.stats).length;
  return `<div class="sec"><div class="row"><h1>測驗</h1><button class="btn" data-act="round">換一組</button></div><div class="chips">${sel('scope','出題範圍',scopes,scope)}${sel('qn','題數',[[10,'10 題'],[20,'20 題'],[50,'50 題'],[0,'全部']],cfg.n)}${sel('qmode','模式',[['practice','練習：答完立刻看解析'],['exam','模擬考：交卷後才看答案']],cfg.mode)}</div><p class="muted" id="score"></p></div>
${quiz.qs.length?quiz.qs.map((q,i)=>qHtml(q,i)).join(''):'<div class="sec">這個範圍沒有題目。</div>'}
${quiz.mode==='exam'&&quiz.qs.length?'<div class="sec" id="finbox"><button class="btn" data-act="finish">交卷</button> <span class="muted" id="warn"></span></div>':''}
<div class="sec"><div class="row"><h2>各科答對率</h2>${any?'<button class="btn ghost" data-act="resetstats">清除統計</button>':''}</div>${table(['階段','科目','題數','已作答','答對率'],S.map(s=>{const v=store.stats[s.id];return[s.stage===1?'一':'二',s.name,cnt(q=>q[0]===s.id),v?v[1]:0,pct(v)]}))}</div>`},
wrong(){
  if(!store.wrong.length)return `<div class="sec"><h1>錯題本</h1><p class="muted">目前沒有錯題。測驗時答錯的題目會自動收進來，答對後可以移除。</p><button class="btn" data-go="quiz">開始測驗</button></div>`;
  return `<div class="sec"><div class="row"><h1>錯題本（${store.wrong.length}）</h1><div><button class="btn" data-go="quiz|wrong">重做錯題</button> <button class="btn ghost" data-act="clear">全部清空</button></div></div><p class="muted">重做時答對會自動從錯題本移除。</p></div>
${store.wrong.map((w,i)=>`<div class="q"><span class="badge">${esc(w.sub)}</span><h3>${esc(w.stem)}</h3><p><b>正解：</b>${esc(w.opts[0])}</p>${w.exp?`<p class="muted">${esc(w.exp)}</p>`:''}<button class="btn ghost" data-act="rm" data-i="${i}">移除</button></div>`).join('')}`}
};

/* ===== 測驗 ===== */
let quiz=null,cfg={n:10,mode:'practice'};
const mkq=(sub,stem,ok,ds,exp)=>{const opts=shuffle([ok,...ds]),s=S.find(x=>x.name===sub);return{sub,sid:s?s.id:'',stem,opts,a:opts.indexOf(ok),raw:[ok,...ds],exp:exp||''}};
function pool(scope){
  if(scope==='wrong')return store.wrong.map(w=>mkq(w.sub,w.stem,w.opts[0],w.opts.slice(1),w.exp));
  const st=scope==='s1'?1:scope==='s2'?2:0;
  const cur=Q.filter(q=>scope==='all'||scope==='exam'||q[0]===scope||subj(q[0]).stage===st).map(q=>mkq(subj(q[0]).name,q[1],q[2],q.slice(3,6),q[6]));
  if(st||scope==='exam')return cur;
  const pt=s=>s.pts.map(p=>mkq(s.name,`「${p[1].split(p[0]).join('＿＿')}」說的是哪個考點？`,p[0],others(s.pts.map(x=>x[0]),p[0]),'陷阱：'+p[2]));
  const terms=()=>[...TERMS.map(t=>mkq('牙科英文',`${t[0]} 的中文是？`,t[1],others(TERMS.map(x=>x[1]),t[1]),t[2])),...Object.entries(ABBR).map(([k,v])=>mkq('縮寫',`縮寫 ${k} 代表？`,v,others(Object.values(ABBR),v)))];
  const dis=()=>DIS.map(d=>mkq('疾病',`臨床線索「${d[2]}」最可能是？`,d[0],others(DIS.map(x=>x[0]),d[0]),'處置：'+d[3]));
  const mats=()=>MAT.map(m=>mkq('牙材藥理',`「${m[3]}」描述的是？`,m[0]+'（'+m[1]+'）',others(MAT.map(x=>x[0]+'（'+x[1]+'）'),m[0]+'（'+m[1]+'）'),'注意：'+m[4]));
  if(scope==='terms')return terms();if(scope==='dis')return dis();if(scope==='mats')return mats();
  if(scope==='all')return [...cur,...S.flatMap(pt),...terms(),...dis(),...mats()];
  return subj(scope)?[...cur,...pt(subj(scope))]:[];
}
function newRound(scope){const seen=new Set(),all=shuffle(pool(scope)).filter(q=>!seen.has(q.stem)&&seen.add(q.stem));quiz={scope,mode:cfg.mode,right:0,done:0,fin:false,t0:Date.now(),secs:0,qs:cfg.n?all.slice(0,cfg.n):all}}
const qHtml=(q,i)=>`<div class="q" data-q="${i}"><span class="badge">${esc(q.sub)}</span><span class="badge g">第 ${i+1} 題</span><h3>${esc(q.stem)}</h3>${q.opts.map((o,k)=>`<button class="opt" data-opt="${k}">${'ABCD'[k]}. ${esc(o)}</button>`).join('')}<div class="exp"><b>答案 ${'ABCD'[q.a]}。</b>${esc(q.exp)}</div></div>`;
const fmt=s=>Math.floor(s/60)+' 分 '+(s%60)+' 秒';
function showScore(){
  const el=$('#score');if(!el||!quiz)return;const n=quiz.qs.length;
  if(quiz.mode==='exam'&&!quiz.fin){el.textContent=`模擬考・本組 ${n} 題・已作答 ${quiz.qs.filter(q=>q.pick!=null).length}・交卷後才顯示答案`;return}
  el.textContent=`本組 ${n} 題・已答 ${quiz.done}・答對 ${quiz.right}`+(quiz.done===n&&n?`・正確率 ${Math.round(quiz.right/n*100)}%`:'')+(quiz.fin?`・用時 ${fmt(quiz.secs)}`:'');
}
function grade(box,q,k){
  box.classList.add('done');box.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;b.classList.remove('pick');if(i===q.a)b.classList.add('ok');else if(i===k)b.classList.add('no')});
  quiz.done++;const ok=k===q.a,at=store.wrong.findIndex(w=>w.stem===q.stem);
  if(ok){quiz.right++;if(quiz.scope==='wrong'&&at>=0)store.wrong.splice(at,1)}
  else if(at<0)store.wrong.unshift({sub:q.sub,stem:q.stem,opts:q.raw,exp:q.exp});
  if(q.sid){const v=store.stats[q.sid]||(store.stats[q.sid]=[0,0]);v[1]++;if(ok)v[0]++}
}
function answer(box,k){
  const q=quiz.qs[+box.dataset.q];if(box.classList.contains('done'))return;
  if(quiz.mode==='exam'){q.pick=k;box.querySelectorAll('.opt').forEach((b,i)=>b.classList.toggle('pick',i===k));return showScore()}
  grade(box,q,k);save();showScore();renderNav('quiz');
}
function finish(){
  const left=quiz.qs.filter(q=>q.pick==null).length,w=$('#warn');
  if(left&&!quiz.warned){quiz.warned=true;w.textContent=`還有 ${left} 題沒作答，再按一次就交卷（未答算錯）`;return}
  document.querySelectorAll('#view .q').forEach(box=>{const q=quiz.qs[+box.dataset.q];grade(box,q,q.pick==null?-1:q.pick)});
  quiz.fin=true;quiz.secs=Math.round((Date.now()-quiz.t0)/1000);save();$('#finbox').remove();showScore();renderNav('quiz');scrollTo(0,0);
}

/* ===== 搜尋 ===== */
let INDEX=null;
function buildIndex(){
  INDEX=[];const add=(tag,title,text,go)=>INDEX.push({tag,title,text,go,hay:(tag+' '+title+' '+text).toLowerCase()});
  S.forEach(s=>{add('科目',s.name,s.focus,['subjects',s.id]);s.pts.forEach((p,i)=>add(s.name,p[0],p[1]+' 陷阱：'+p[2],['subjects',s.id,`p-${s.id}-${i}`]))});
  DIS.forEach((d,i)=>add('疾病',d[0],d[1]+'｜'+d[2]+'｜處置：'+d[3],['diseases','','d-'+i]));
  MAT.forEach((m,i)=>add('牙材藥理',m[0]+'｜'+m[1],m[2]+'｜'+m[3]+' 注意：'+m[4],['materials','','m-'+i]));
  IMG.forEach((m,i)=>add('影像',m[1]+'｜'+m[0],m[2],['images','','i-'+i]));
  TERMS.forEach((t,i)=>add('英文',t[0]+'｜'+t[1],t[2],['english','','t-'+i]));
  Object.entries(ABBR).forEach(([k,v],i)=>add('縮寫',k,v,['english','','a-'+i]));
  Q.forEach(q=>add('考題・'+subj(q[0]).name,q[1],'答案：'+q[2]+'｜'+q[6],['quiz',q[0]]));
}
function doSearch(raw){
  const ws=raw.toLowerCase().split(/\s+/).filter(Boolean);if(!ws.length)return render();
  if(!INDEX)buildIndex();
  const hits=INDEX.filter(x=>ws.every(w=>x.hay.includes(w)));
  const re=new RegExp('('+ws.map(w=>esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi'),hl=s=>esc(s).replace(re,'<mark>$1</mark>');
  view.innerHTML=`<div class="sec"><h2>搜尋「${esc(raw)}」</h2><p class="muted">${hits.length} 筆${hits.length>60?'，顯示前 60 筆，可加關鍵字縮小範圍（空白分隔）':''}</p></div><div class="grid">${hits.slice(0,60).map(h=>`<button class="card" data-go="${h.go.join('|')}"><span class="badge">${esc(h.tag)}</span><h3>${hl(h.title)}</h3><p class="muted">${hl(h.text)}</p></button>`).join('')||'<div class="card">找不到結果，換個關鍵字試試。</div>'}</div>`;
  scrollTo(0,0);
}

/* ===== 事件 ===== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-say],[data-opt],[data-act],#menu');if(!t)return;
  if(t.id==='menu')return aside.classList.toggle('open');
  if(t.dataset.say)return speak(t.dataset.say);
  if(t.dataset.go){const[v,a,an]=t.dataset.go.split('|');if(v==='quiz')quiz=null;return go(v,a,an)}
  if(t.dataset.opt)return answer(t.closest('.q'),+t.dataset.opt);
  const act=t.dataset.act;
  if(act==='round'){quiz=null;render()}
  if(act==='finish')finish();
  if(act==='resetstats'&&confirm('確定清除各科答對率統計？')){store.stats={};save();render()}
  if(act==='rm'){store.wrong.splice(+t.dataset.i,1);save();render()}
  if(act==='clear'&&confirm('確定清空全部錯題？')){store.wrong=[];save();render()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.known){if(t.checked)store.known[t.dataset.known]=1;else delete store.known[t.dataset.known];save();t.closest('.card').classList.toggle('known',t.checked)}
  if(t.id==='scope'){quiz=null;go('quiz',t.value==='all'?'':t.value)}
  if(t.id==='qn'){cfg.n=+t.value;quiz=null;render()}
  if(t.id==='qmode'){cfg.mode=t.value;quiz=null;render()}
});
let timer;searchBox.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>doSearch(searchBox.value.trim()),120)});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==searchBox){e.preventDefault();searchBox.focus()}if(e.key==='Escape'&&searchBox.value){searchBox.value='';render()}});
addEventListener('hashchange',render);
render();
</script>
</body>
