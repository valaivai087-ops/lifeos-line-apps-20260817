<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>博弈論整理筆記</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1f2328;--mute:#6b6f76;--line:#e4e1d8;--acc:#9a3412;--acc2:#fff3e8;--hl:#fde68a}
@media (prefers-color-scheme:dark){:root{--bg:#16181b;--card:#1f2226;--ink:#e8e6e1;--mute:#9aa0a6;--line:#2e3237;--acc:#fb923c;--acc2:#2a211a;--hl:#7c5a10}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--mute);font-size:13px}
.bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#q{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:15px}
#q:focus{outline:2px solid var(--acc);border-color:transparent}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#cnt{color:var(--mute);font-size:13px;align-self:center}
main{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:17px}
.tag{display:inline-block;font-size:12px;color:var(--acc);background:var(--acc2);border-radius:6px;padding:1px 8px;margin-right:6px;font-weight:600}
.core{background:var(--acc2);border-left:3px solid var(--acc);padding:8px 12px;border-radius:0 8px 8px 0;margin:8px 0}
ul,ol{margin:6px 0;padding-left:22px}
li{margin:3px 0}
.pg{color:var(--mute);font-size:12px;font-weight:normal}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow span{background:var(--acc2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:14px}
.flow i{color:var(--mute);font-style:normal}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.grid .card{margin:0}
table{width:100%;border-collapse:collapse;font-size:15px}
td{border-top:1px solid var(--line);padding:6px 8px;vertical-align:top}
td:first-child{white-space:nowrap;font-weight:600;color:var(--acc)}
details{border-top:1px solid var(--line);padding:6px 0}
details:first-of-type{border-top:none}
summary{cursor:pointer;font-weight:600}
details p{margin:6px 0}
details .body{padding:4px 0 8px 4px}
mark{background:var(--hl);color:inherit;border-radius:2px}
.hide{display:none!important}
.chk li{list-style:none;margin-left:-22px}
.chk label{cursor:pointer}
.chk input{margin-right:8px;accent-color:var(--acc)}
.post{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:18px;align-items:start}
.post canvas{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);display:block}
.post .txt{white-space:pre-wrap;font-size:15.5px;line-height:1.9}
.post .verse{color:var(--acc);font-weight:600;margin:4px 0 8px}
.post .tags{color:var(--mute);font-size:13px;margin-top:8px}
.btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.btns button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
.btns button:hover{border-color:var(--acc);color:var(--acc)}
details.fbp{margin-top:8px;border:1px solid var(--acc);border-radius:10px;padding:8px 12px;background:var(--acc2)}
details.fbp summary{color:var(--acc)}
details.fbp .post{margin-top:10px}
.ptoc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ptoc a{font-size:13px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;background:var(--card)}
@media (max-width:700px){.post{grid-template-columns:1fr}.post canvas{max-width:360px}}
.empty{color:var(--mute);text-align:center;padding:40px}
@media (max-width:600px){main{padding:12px}.card{padding:14px}td:first-child{white-space:normal}}
</style>
</head>
<body>
<header><div class="wrap">
<h1>博弈論 整理筆記</h1>
<div class="sub">《生命大數據》林文欣 · 博弈論篇（757 頁）｜序＋15 章＋總結</div>
<div class="bar">
<input id="q" type="search" placeholder="搜尋（例：BATNA、納許、訊號、承諾）" autocomplete="off">
<span id="cnt"></span>
</div>
<div class="bar"><nav id="tabs">
<button data-t="ov" class="on">總覽</button>
<button data-t="ch">章節重點</button>
<button data-t="ck">實用檢查表</button>
<button data-t="tm">概念詞典</button>
<button data-t="or">原文＋信仰圖文</button>
</nav></div>
</div></header>
<main><div class="wrap" id="app"></div></main>
<script>
const D={"notes": {"chapters": [{"n": "序", "t": "當你的選擇會改變別人的選擇，世界就不再只是決策", "p": 2, "core": "只要「我做了之後，別人會反應，我再回應他的反應」這個循環出現，你面對的就不是單純決策，而是博弈。", "pts": ["決策論問「我怎麼選」；博弈論問「我選了之後，整個局會怎麼動」。", "參與者本身就是會改變環境的變數：我預測你 → 你預測我 → 我再預測你的預測。", "個體理性，不保證系統理性（降價戰、夫妻冷戰）。", "「沒有人想要這個結果，卻沒有人願意單方面改變」——這是均衡問題，不是個性問題。", "博弈論不是教人算計，而是看懂：什麼結構正在生成這些行為？這個局值得繼續玩嗎？"]}, {"n": "01", "t": "博弈的本體：你的結果，不只由你決定", "p": 20, "core": "博弈不是「有競爭」才存在，只要彼此結果相互依賴就存在；最危險的錯誤是把會反應的人當成不會動的環境。", "pts": ["博弈五要素：玩家、策略、報酬、資訊、規則與順序。", "策略＝面對不同情況時預先定義的一整套行動規則，不只是「現在做什麼」。", "只要對方會學習，任何穩定策略都可能因被觀察而失效：策略 → 反策略 → 再策略。", "智慧不是猜對別人，而是持續修正對別人的模型：預測 → 行動 → 回饋 → 誤差 → 更新。", "看局（易經）→ 看人（鬼谷子）→ 出手（孫子）→ 對方反應 → 重新看局。"]}, {"n": "02", "t": "先不要猜人心：把博弈結構畫出來", "p": 42, "core": "先結構、後心理。把人先拿掉，把局畫出來：玩家 × 策略 × 報酬 × 資訊 × 順序 × 規則 × 退出。", "pts": ["先找真正的玩家：誰有能力改變結果？很多人一直在說服錯的人。", "列出每個玩家真正能做什麼（可行策略集合），不是想做什麼。", "不要信表面理由，找真正的報酬函數：他想得到什麼、怕失去什麼、不能接受什麼。", "資訊分布決定優勢：誰知道什麼，而且誰知道誰知道什麼。", "規則不是背景：不要看人說什麼，要看系統實際獎勵什麼（例：哭鬧有效 → 哭鬧成為策略）。", "案例：兩個部門合作不起來，是目標函數沒對齊——不要只修正人，要修正誘因。", "高階博弈者看「結構」不看「人格」：位置會塑造策略。"]}, {"n": "03", "t": "零和不是世界的常態：先判斷你到底在玩哪一種局", "p": 73, "core": "很多人不是輸在策略差，而是一開始就把遊戲類型判斷錯了。衝突，不等於零和。", "pts": ["零和：總價值固定，重點是分配；非零和：利益不必互相抵消。", "正和：互補資源、可信合作、共同規則、長期回饋，讓總價值變大。", "負和：最危險的不是輸，而是大家一起變差（內耗、熵增）。", "同一組人可在不同資源、時間、層級上同時處於不同遊戲（混合動機）。", "兩種失敗：把正和局玩成零和局；把真正的零和局幻想成正和局。", "高階問題：能不能改變博弈的總和？改規則、改資源、改邊界。"]}, {"n": "04", "t": "納許均衡：沒有人願意單方面改變的局", "p": 110, "core": "均衡不等於最優。穩定，不等於合理、幸福或最佳——很多壞結果是「穩定的錯誤」。", "pts": ["納許均衡：別人策略不變時，任何人單獨改變都不會更好。核心概念是「最佳反應」。", "優勢策略：不管別人怎麼選，我都比較想這樣做；個體最佳 ≠ 整體最佳。", "低品質穩定：改善需要協同變動，所以誰先動誰先吃虧（如全員過度加班）。", "「叫大家改變」通常沒用；要改變的是玩家的最佳反應。", "多重均衡：同一套規則可有高信任／低信任等不同穩定世界；協調問題要靠推過臨界點。", "制度的功能，就是把好行為變成最佳反應。", "資訊 → 信念 → 策略 → 均衡：改變資訊也能改變均衡。"]}, {"n": "05", "t": "囚徒困境：為什麼理性的人，會共同製造愚蠢結果", "p": 147, "core": "全局愚蠢，不需要任何人是愚蠢的。核心不是背叛，而是報酬結構讓背叛成為每個人的最佳反應。", "pts": ["局部最佳，生成全局次佳。", "公共財／搭便車／公地悲劇：收益私有化、成本社會化，系統就會被過度消耗。", "家庭（誰都不先示弱）、公司（藏資訊）、國際（安全困境、軍備競賽）都是同一結構。", "合作需要：可辨識行為、可追蹤歷史、未來互動、背叛有成本、合作有回報、修復機制。", "七種解法：改報酬、提高背叛成本、增加透明、拉長時間、建立聲譽、降低合作風險、設退出與懲罰。", "把合作從道德要求，轉成結構合理；先用低成本互動測試，再逐步擴大合作。"]}, {"n": "06", "t": "動態博弈：不要只看第一步，要看對方的下一步", "p": 187, "core": "真正的策略是推演「我這一步之後，對方怎麼動；他動完之後，我還剩哪些選擇」。", "pts": ["博弈樹＋逆向歸納：從終點往回算，先看最後行動者會怎麼選。", "未來行為取決於未來誘因，不是個性。", "重要的不是這一步賺多少，而是下一步剩什麼（選項價值）。", "先行者優勢 vs. 後動者資訊優勢，要看這個市場位置重要還是資訊重要。", "承諾：主動關掉某些選項，反而能改變對方策略（破釜沉舟）；但也降低更新能力。", "子博弈完美均衡：把「到那一步不會真的執行」的空話排除。", "每一次處理方式都在訓練對方的未來策略（家庭退讓、企業獎懲）。", "不必算無限步，找關鍵節點與不可逆點。"]}, {"n": "07", "t": "威脅、承諾與可信度", "p": 228, "core": "語言本身幾乎沒有力量；有力量的是對方相信：事情真的發生時，你仍有動機照做。", "pts": ["威脅＝未來行動函數「如果你做 X，我就做 Y」；關鍵是到時 Y 還是不是你的最佳反應。", "「寧可同歸於盡」通常是不可信威脅。", "承諾與威脅是同一結構的兩面；最難的是時間不一致問題。", "信用＝別人根據你過去行為建立的未來預測模型。", "高階承諾不是「我保證」，而是承諾裝置：讓自己未來很難反悔。", "失去選擇有時反而增加力量，但也可能被自己的承諾綁架——先寫清楚什麼條件下可重談。", "沉沒成本不該是繼續投入的理由，但不可逆投入可以創造可信度。", "規則說了卻不執行，是家庭與企業最大的信用危機。", "少說但做到：承諾少而清楚，執行高度一致。可信，但不僵化。"]}, {"n": "08", "t": "資訊不完全：最難的是不知道對方是哪一種人", "p": 271, "core": "不是知道真相後才行動，而是在不完整資訊下建立機率分布、持續更新信念。", "pts": ["影響策略的是對方的「類型」（偏好、能力、成本等私人資訊）。", "先驗 → 新證據 → 後驗更新：新證據不是答案，而是更新權重。", "貝氏博弈：行動對行動，也是信念對信念。", "私人資訊有策略價值，但合作也需要可信揭露。", "逆向選擇：好壞看起來一樣時，市場可能把好人趕走；可驗證資訊是逆熵結構。", "道德風險：行為看不見、成本被轉嫁時，簽約後行為會變。", "最危險的錯誤：把信念當事實。分清已知／高機率／低機率／純猜測。", "鬼谷子的現代接口：不是讀心，而是試探。資訊優勢在於更新得最快。"]}, {"n": "09", "t": "訊號與篩選：要看他願意付出什麼成本", "p": 321, "core": "重要的不是對方說了什麼，而是什麼行動只有某一類人比較做得出來。", "pts": ["語言常是廉價訊息（cheap talk）：先問發訊者有沒有誘因誤導你。", "好訊號不只是昂貴，而是對真類型便宜、對假類型昂貴（模仿成本不對稱）。", "分離均衡：不同類型做不同選擇；混同均衡：大家都一樣，訊號失去資訊量（訊號通膨）。", "訊號會被破解：一旦大家知道你看什麼，就會優化那個指標。", "有價值的訊號通常包含 skin in the game：說錯他自己也要付代價。", "訊號是有資訊的人發出；篩選是沒資訊的人設計選項，讓對方自己暴露類型。", "生活中最實用的篩選：不要問誠意，設計一個低成本、可退出的小承諾。", "不要被單一訊號綁架，用多訊號交叉驗證。"]}, {"n": "10", "t": "重複博弈：一次理性，不一定是長期理性", "p": 373, "core": "只要明天還會再見，今天的行為就會改變明天的世界（未來的陰影）。", "pts": ["聲譽＝別人對你未來策略的壓縮模型，是降低交易成本的資產。", "以牙還牙（Tit for Tat）：先合作、可反擊、反應清楚、可以恢復。", "無條件善良會讓背叛成為最佳策略；永不原諒（嚴厲觸發）會陷入永久敵對。", "原諒是降低誤差放大的控制機制，但必須有條件，否則失去訊號功能。", "好的合作結構：友善、可反擊、可修復、可辨識。", "折現率：越重視未來越願意合作；短期 KPI 壓縮時間尺度，製造長期問題。", "信任不是相信對方永不背叛，而是知道背叛後系統能處理。", "民間定理：只要未來夠重要，很多合作都能被維持；把一次性博弈轉成有記憶的重複博弈。"]}, {"n": "11", "t": "混合策略與不可預測性：規律本身就是弱點", "p": 427, "core": "如果對方能穩定預測你，你就可能被利用；用有結構的隨機化防止被剝削。", "pts": ["純策略完全可預測，報酬會因對手學習而下降。", "混合策略是機率化選擇，目的在讓對手無法偏向某一反應而穩定獲利。", "不可預測 ≠ 完全隨機：目標穩定，策略不固定。", "每次最後一刻讓步，對方就會等你；固定促銷會訓練客戶等待。", "人格與原則可預測，具體戰術不可完全預測：底層可信，表層靈活。", "成功策略會改變環境、摧毀自己成功的條件；要保留探索（探索與利用）。", "不該隨機化的：建立信用、法律制度、安全標準、合作基本原則。", "讓對手算不準，但讓自己算得清楚：核心穩定，戰術流動。"]}, {"n": "12", "t": "談判與權力：真正的權力，來自你有能力離開", "p": 476, "core": "替代方案決定底線，退出能力決定權力。一個不能離開的人，很難真正談判。", "pts": ["談判是分配合作產生的剩餘；雙方可接受區間沒有重疊就沒有交易。", "保留價值是結構，不是嘴上的數字：不成交時你真正能得到什麼。", "BATNA（談判破裂時的最佳替代方案）決定談判權力；要在談判前就建立。", "權力 ≈ 對方依賴你程度 − 你依賴對方程度；最大的風險是單點依賴。", "從單一價格升級為多變數交換：找雙方權重不同的變數，差異就是交易來源。", "時間是資源，期限是隱藏的價格；不要暴露時間壓力，不要太早暴露底線。", "第一個報價建立錨點；讓步要換到東西，讓步速度本身就是訊號。", "不可替代性太高會讓對方設法降低依賴；最好的談判是讓合作成為對方的最佳選擇。", "越害怕失去一段關係，談判權力越低；能離開卻選擇留下，才有真正的合作意義。"]}, {"n": "13", "t": "機制設計：最高階的博弈是改變遊戲規則", "p": 532, "core": "一般博弈：給定規則，推演結果；機制設計：先決定想要的結果，再反過來設計規則。", "pts": ["行為會追著誘因走：不要看制度寫什麼，要看它實際獎勵什麼。", "好制度把對整體好的行為變成個人的最佳反應（誘因對齊）。", "誘因相容：讓說真話對自己也比較有利；拍賣、稅、補貼、罰則都在改報酬函數。", "指標一旦成為目標，玩家就會博弈指標；好制度是被博弈後仍不易崩（抗博弈性）。", "目標函數錯了，機制越有效系統死得越快；局部最佳化是最常見的敵人。", "制度是塑造吸引子地形；人會反向適應你的控制。", "自我選擇：讓人自己分流；讓決策權靠近資訊。", "好機制四條件：可理解、可執行、可驗證、可更新；最高階是設計「更新規則」。", "能執行的簡單規則，通常比不能執行的完美規則更好。"]}, {"n": "14", "t": "演化博弈：策略是在環境中被淘汰出來的", "p": 593, "core": "很多行為不是被計算出來的，而是在競爭、模仿、淘汰中被環境篩選出來。問：什麼環境讓哪種策略變多？", "pts": ["演化不是進步，而是適配；適存度＝策略在當前環境能否持續存在擴張。", "複製者動態：報酬高於平均的策略比例會上升。", "頻率依賴：策略好不好取決於有多少人也在用（鷹鴿博弈）。", "演化穩定策略（ESS）：不是最好，而是不易被少數新策略入侵；低品質結構因此能活很久。", "組織文化是演化出來的，不是宣布出來的；KPI 是人工選擇壓力。", "模仿與路徑依賴：存在很久不代表最好，可能只是退出成本太高。", "太亂會崩、太整齊會死：核心有序＋邊緣多樣，保留變異。", "紅皇后效應：成長＝模型更新速度與環境變化速度的競賽。", "高階治理：不選完美策略，而是建立會淘汰錯誤策略的系統。"]}, {"n": "15", "t": "從博弈論回到華夏動態決策母體", "p": 656, "core": "三套華夏古典（易經、鬼谷子、孫子）× 七套現代科學，形成可持續感知、推演、決策、行動與更新的系統。", "pts": ["《易經》辨勢：現在是什麼局（狀態空間與轉換）。", "《鬼谷子》知人：人對自己理解的現實反應，資訊如何改變信念與策略。", "《孫子兵法》用勢：有限資源下如何行動。", "博弈論：對方不是棋子，是另一個會思考的系統；但不是把所有人當敵人。", "七套科學是七個運算器：預測編碼、自由能原理、複雜系統、控制論、自生成系統論、博弈論、決策科學。", "核心不是資料庫，而是「問題路由」：遇到問題該調用哪一套結構。", "八步循環：辨勢 → 建模 → 知人 → 推演 → 決策 → 行動 → 回饋 → 更新。", "AI 是認知加速器、策略推演器、模型誤差檢查器，不是答案機。"]}, {"n": "總結", "t": "要生成的不是答案，而是一個永遠能重新計算的人", "p": 707, "core": "博弈論教的不是算計，而是看懂互動世界的結構：我做什麼 → 別人怎麼反應 → 局勢怎麼改變 → 我再怎麼更新。", "pts": ["納許均衡：壞結果也可以非常穩定。", "囚徒困境：聰明人也會一起製造愚蠢系統。", "重複博弈：今天的行動會變成明天的環境。", "資訊不完全：永遠不可能完全看懂別人，所以要多假設、給權重、持續更新。", "訊號與篩選：不要一直問真相，設計能產生真相的互動。", "混合策略：成功模式也可能變成弱點。", "談判：權力來自替代路徑。機制設計：高階玩家會改規則。演化：規則會選出未來的人。", "自由不是沒有局，而是知道自己在哪個局，並有選擇、退出、重設結構的自由。"]}], "mainline": ["誰在局裡？", "每個人真正要什麼？", "大家有哪些策略？", "誰知道什麼？", "我動以後，他會怎麼動？", "這個互動會掉進什麼均衡？", "這個均衡品質好嗎？", "規則正在獎勵什麼？", "能不能改變遊戲規則？", "這套策略長期會演化成什麼？"], "loop": [["辨勢", "現在是什麼局？（易經）"], ["建模", "把玩家、策略、報酬、資訊、順序、規則畫出來"], ["知人", "對方的目標函數、資訊與信念（鬼谷子）"], ["推演", "我動之後他怎麼動？逆向歸納、找關鍵節點"], ["決策", "在可能結果、機率與風險之間選路"], ["行動", "配置有限資源（孫子兵法）"], ["回饋", "觀察結果與誤差"], ["更新", "修正模型，重新辨勢"]], "map": [["玩家", "誰真正能改變結果？"], ["策略", "每個人實際能做什麼？"], ["報酬", "他真正在最大化什麼、怕失去什麼？"], ["資訊", "誰知道什麼？誰知道誰知道什麼？"], ["順序", "誰先動？先動得到什麼、失去什麼？"], ["規則", "規則是誰定的？系統實際獎勵什麼？"], ["退出", "誰能離開？離開的代價是什麼？"]], "checklists": [{"ch": "03", "t": "判斷遊戲類型", "q": ["核心資源是否固定？", "雙方能不能共同創造新價值？", "互動是否讓總價值持續下降？", "是一次互動還是長期重複？", "不同層級是否存在不同遊戲？", "能不能改規則、改資源、改邊界？"]}, {"ch": "04", "t": "均衡診斷", "q": ["這個狀態是不是大家都不滿意？", "為什麼沒有人先改？", "誰如果先動，會受到懲罰？", "哪個規則正在維持這個均衡？", "要讓新均衡出現，哪些條件必須同時改？"]}, {"ch": "05", "t": "囚徒困境診斷", "q": ["每個人單獨看，現在的行動合理嗎？", "如果一個人先合作，他會不會被利用？", "背叛的短期收益是不是很高？", "未來互動重要嗎？", "過去行為會被記住嗎？", "資訊是否透明？", "能不能改變規則？"]}, {"ch": "06", "t": "動態博弈推演", "q": ["誰先動？", "每一步有哪些可行選項？", "走到最後一層，最後行動者會怎麼選？", "從終點往前推", "檢查威脅與承諾是否可信", "找出不可逆節點", "保留更新空間"]}, {"ch": "07", "t": "可信度檢查", "q": ["事情真的發生時，我還願意執行嗎？", "我有能力執行嗎？", "對方知道我有能力嗎？", "我的過去紀錄支持這個承諾嗎？", "有沒有機制讓我難以反悔？", "環境改變時，我是否仍保有必要的更新空間？", "這個承諾是在改變對方策略，還是只是滿足自己的情緒？"]}, {"ch": "08", "t": "資訊不完全分析", "q": ["列出可能類型", "給每個類型暫時權重", "分清已知與猜測", "找真正能區分不同類型的證據", "設計低成本試探", "觀察行為，而不是只聽語言", "收到新證據後重新更新", "保留錯判時的退出空間"]}, {"ch": "09", "t": "訊號辨識", "q": ["這個訊號誰都能發嗎？", "發出這個訊號需要付什麼成本？", "真類型和假類型的成本一樣嗎？", "如果訊號是假的，發訊者會承擔後果嗎？", "這個訊號和我要判斷的東西真的有關嗎？", "這個訊號可以長期維持嗎？", "還有其他訊號可以交叉驗證嗎？"]}, {"ch": "09", "t": "篩選設計", "q": ["我要辨識的真正差異是什麼？", "什麼行為會讓不同類型付出不同成本？", "能不能設計兩到三種不同選項？", "這個測試成本能不能保持很低？", "錯判後能不能退出？", "篩選是否會被學會與操弄？", "它測到的是我要的東西，還是代理指標？"]}, {"ch": "10", "t": "長期博弈判斷", "q": ["我們未來還會互動多久？", "今天的行為會不會被記住？", "背叛之後有沒有代價？", "合作能不能持續得到回報？", "偶發錯誤能不能被修復？", "我們有沒有清楚的反擊邊界？", "報復有沒有停止機制？", "今天的行動正在訓練什麼未來行為？"]}, {"ch": "11", "t": "不可預測性檢查", "q": ["對手是否能觀察我的歷史行為？", "他能不能利用我的固定模式？", "哪些部分必須保持可信與穩定？", "哪些部分可以變？", "我的隨機化有沒有明確目標？", "環境是否正在快速學習我？", "我有沒有持續測量策略被反制的程度？"]}, {"ch": "12", "t": "談判結構分析", "q": ["我的 BATNA 是什麼？", "對方的 BATNA 可能是什麼？", "我的保留價值是多少？", "對方的保留價值大概在哪裡？", "誰的時間成本比較高？", "有哪些不只價格的交換變數？", "哪些資訊應該保留？", "每一次讓步換到了什麼？", "這個交易能不能形成長期穩定結構？"]}, {"ch": "13", "t": "機制設計檢查", "q": ["真正想要的系統結果是什麼？", "現在玩家真正被獎勵的是什麼？", "目前的最佳反應，是否正在傷害整體？", "有哪些私人資訊需要被揭露？", "能不能讓玩家用自己的選擇揭露資訊？", "說真話是否對玩家有利？", "這套規則會不會被快速操弄？", "回饋夠快、夠準嗎？", "規則本身怎麼更新？"]}, {"ch": "14", "t": "演化博弈診斷", "q": ["現在有哪些主要策略？", "哪一種策略目前得到最高報酬？", "成功策略是不是正在被模仿？", "如果這個策略愈來愈普遍，它還會一樣有效嗎？", "哪些策略正在被淘汰？", "現在的穩定狀態是不是只是局部最佳？", "新策略能不能活下來？", "環境是否正在快速改變？", "系統有沒有保留足夠變異？"]}], "terms": [["博弈", "參與者的結果取決於其他參與者的選擇；彼此相互影響就存在，不一定要有競爭。", "01"], ["策略", "面對不同情況時預先定義的一整套行動規則。", "01"], ["報酬函數", "玩家真正想最大化的東西，常與表面理由不同。", "02"], ["共同知識", "大家都知道，而且知道彼此都知道的資訊。", "02"], ["零和／正和／負和", "總價值固定／可做大／一起變差；同一組人在不同層級可同時處於不同遊戲。", "03"], ["合作博弈", "研究聯盟能否形成及價值如何分配；與「友善」無關。", "03"], ["最佳反應", "在別人已做出某選擇時，我最適合採取的策略。", "04"], ["納許均衡", "其他人策略不變時，任何人單獨改變都不會更好的穩定狀態；不等於最優。", "04"], ["優勢策略", "不論別人怎麼做，對我都比較好的策略。", "04"], ["多重均衡", "同一套規則可能有多個穩定世界（高信任／低信任）。", "04"], ["協調問題", "大家利益不衝突，卻不知道別人會怎麼做，都在等臨界規模。", "04"], ["囚徒困境", "每人都背叛是最佳反應，結果所有人一起變差。", "05"], ["搭便車／公地悲劇", "收益私有化、成本社會化，公共資源被過度消耗。", "05"], ["安全困境", "我的防禦被對方解讀為威脅，引發軍備競賽。", "05"], ["博弈樹", "把各方依序選擇的所有可能路徑展開。", "06"], ["逆向歸納", "從終點往回推：先看最後行動者怎麼選，再推前一步。", "06"], ["子博弈完美均衡", "走到每個可能節點時，後續行動都仍然合理；排除空話威脅。", "06"], ["先行者優勢", "先動改變後來者的整個博弈結構；後動者則有資訊優勢。", "06"], ["承諾裝置", "用結構約束未來的自己，讓反悔成本變高，以提高可信度。", "07"], ["時間不一致", "現在承諾的事，到未來可能不再是最佳反應。", "07"], ["可信威脅", "到了未來節點，執行威脅仍符合自己利益。", "07"], ["沉沒成本", "不應作為繼續投入的理由，但不可逆投入可成為可信訊號。", "07"], ["類型", "影響玩家報酬、能力、偏好、成本的私人資訊。", "08"], ["先驗／後驗", "看到新證據前的判斷／依新證據調整後的權重。", "08"], ["貝氏博弈", "每個人不只選策略，也在猜別人的類型。", "08"], ["逆向選擇", "好壞看起來一樣時，市場把好的一起趕走（簽約前的資訊不對稱）。", "08"], ["道德風險", "簽約後行為不可完全觀察、成本被轉嫁，誘因改變。", "08"], ["廉價訊息 cheap talk", "幾乎沒有成本的語言，資訊量通常低。", "09"], ["訊號", "可觀察行動，用來推測不可觀察類型；好訊號對真類型便宜、假類型昂貴。", "09"], ["分離均衡／混同均衡", "不同類型做不同選擇／所有人做一樣的事，訊號失去資訊量。", "09"], ["篩選 Screening", "不知道對方類型的人設計選項，讓對方自己暴露類型。", "09"], ["Skin in the game", "說錯做錯時，發訊者自己也要付代價。", "09"], ["未來的陰影", "未來的互動會反過來約束今天的行為。", "10"], ["聲譽", "別人根據你過去行為，對你未來策略的壓縮模型。", "10"], ["以牙還牙 Tit for Tat", "先合作；對方上一輪怎麼對我，下一輪就怎麼回應。", "10"], ["嚴厲觸發 Grim Trigger", "對方背叛一次就永遠不再合作。", "10"], ["折現率", "你有多重視未來；越重視越願意合作。", "10"], ["民間定理 Folk Theorem", "未來夠重要時，很多合作結果都能成為穩定狀態。", "10"], ["純策略／混合策略", "固定選一個行動／按機率分布在多個行動間選擇。", "11"], ["探索與利用", "保留部分行動測試其他可能，而非全押當前最佳模型。", "11"], ["談判剩餘／可合作區間", "合作產生的額外價值；雙方可接受範圍的重疊部分。", "12"], ["保留價值", "低於什麼條件我寧可不成交。", "12"], ["BATNA", "Best Alternative to a Negotiated Agreement，談判破裂時的最佳替代方案。", "12"], ["錨定", "第一個報價影響對方對底線與類型的判斷。", "12"], ["依賴不對稱", "權力 ≈ 對方依賴你 − 你依賴對方。", "12"], ["機制設計", "先定想要的結果，再反向設計規則。", "13"], ["誘因相容", "讓說真話、選適合自己的方案成為對方的最佳反應。", "13"], ["直接機制", "讓玩家直接報告私人資訊，並減少說謊收益。", "13"], ["抗博弈性", "制度被玩家適應、找漏洞後，仍能維持基本功能。", "13"], ["自我選擇機制", "讓人自己分流，利用分散在玩家身上的私人資訊。", "13"], ["吸引子地形", "系統容易掉進的穩定狀態；制度就是在塑造它。", "13"], ["適存度", "策略在當前環境中取得足夠回報、持續存在與擴張的能力。", "14"], ["複製者動態", "報酬高於平均的策略，族群比例上升。", "14"], ["頻率依賴", "策略好壞取決於有多少人也在用。", "14"], ["鷹鴿博弈", "攻擊性策略太普遍時會削弱自身優勢。", "14"], ["演化穩定策略 ESS", "不容易被少數突變策略入侵的策略；不等於最佳。", "14"], ["路徑依賴", "早期小差異經正回饋放大，鎖定整個系統。", "14"], ["紅皇后效應", "你一直跑，可能只是為了留在原地。", "14"], ["預測編碼", "模型 → 預測 → 現實 → 誤差 → 更新。", "15"], ["自由能原理", "系統持續降低不可承受的不確定性，維持可存續狀態。", "15"], ["自生成系統論", "系統在適應外部時，持續再生自身核心結構。", "15"], ["問題路由", "遇到問題時，選擇該調用哪幾套模型交叉運算。", "15"], ["NODE00", "AI 先行教學：先建立最低必要模型，再用生活壓測。", "15"]]}, "orig": [{"t": "序", "p": 1, "s": [{"t": "導言", "p": 1, "x": ["", "人生中有一類問題，光靠「想清楚自己要什麼」是不夠的。", "你想加薪，老闆會判斷你是不是準備離職。", "你想降價搶市場，競爭者可能跟著降價。", "你想對一個人示好，對方可能因此更願意合作，也可能因此認為你沒有底線。", "你想在談判中退一步，對方可能把它理解成善意，也可能把它解讀成你還能再退。", "問題從來不只在於：", "<b>你做了什麼。</b>", "真正影響結果的是：", "<b>你做了什麼之後，別人會怎麼反應；而你又會如何回應他的反應。</b>", "只要這個循環出現，你面對的就不再是一個單純的決策問題。", "你進入了博弈。", "人們平常很容易把人生理解成一條單向因果鏈。", "我努力，所以我成功。", "我對你好，所以你應該對我好。", "產品比較便宜，所以市場會選我。", "公司提高獎金，所以員工應該更努力。", "但真實世界不是這樣運作的。", "因為世界裡存在其他會思考、會學習、會預測、會隱藏資訊、會改變策略的人。", "當你改變，他也改變。", "當你預測他，他也可能正在預測你。", "於是整個系統從：", "<b>刺激 → 反應</b>", "變成：", "<b>我預測你 → 你預測我 → 我再預測你的預測→ 雙方持續更新。</b>", "這就是博弈世界最根本的特徵：", "<b>參與者本身，就是會改變環境的變數。</b>", "這也是為什麼，很多看起來「很聰明」的決策，最後反而會失敗。", "一家公司發現降價可以增加銷量。", "如果只有它一家降價，這個策略可能有效。", "但競爭對手也會看到。", "於是對手也開始降價。", "接著第三家公司跟進。", "最後整個市場一起降價，銷量沒有明顯增加，利潤卻全面下降。", "如果只從單一公司的角度看：", "<b>降價很合理。</b>", "但從整個博弈結構看：", "所有人一起做出局部合理選擇，最後形成了一個全體都更差的結果。", "這就是博弈論第一個重要啟示：", "<b>個體理性，不保證系統理性。</b>", "很多家庭衝突也是如此。", "夫妻兩個人都不願意先道歉。", "因為每個人都覺得：", "「如果我先低頭，他以後就會更不尊重我。」", "所以兩個人都選擇防禦。", "從個人角度看，這是保護自己。", "但兩個人的防禦相互作用之後，整段關係進入冷戰。", "最後形成一個奇怪的結構：", "<b>沒有人真正想要這個結果，卻沒有人願意單方面改變。</b>", "這不是單純的個性問題。", "它是一個<b>均衡問題</b>。", "博弈論真正重要的地方，就在這裡。", "它不是教人算計。", "它真正研究的是：", "<b>當多個具有不同目標函數的行動者，同時存在於同一個系統中，彼此的選擇會如何互相改變？</b>", "因此，一個博弈至少存在幾個核心元素。", "有人。", "每個人都有可以採取的行動。", "每個人都想得到某些結果。", "每個人掌握的資訊可能不同。", "而每個人的最佳選擇，都可能取決於別人的選擇。", "把這些元素組合起來，就形成了一個<b>策略互動</b>", "<b>系統</b>。", "真正重要的，不再只是：", "「我應該選 A 還是 B？」", "而是：", "如果我選 A，他會怎麼做？", "如果他知道我會選 A，他是否會提前改變？", "如果我知道他會改變，我現在是不是又應該換另一個策略？", "這才是真正的動態決策。", "這也是博弈論與一般決策科學最重要的分界。", "決策科學主要處理的是：", "<b>我面對一個不確定世界，如何做出品質更高的選擇？</b>", "例如：", "我要不要換工作？", "我要不要投資？", "我要不要創業？", "我要不要接受這個方案？", "它關心機率、風險、效用、成本與選項。", "但博弈論多了一層。", "它問：", "<b>如果世界裡還有其他會根據我的行動改變自己策略的人，我應該怎麼決策？</b>", "所以兩者不能互相取代。", "決策科學處理的是：", "<b>選擇。</b>", "博弈論處理的是：", "<b>策略互動。</b>", "一個幫你判斷哪一個選項比較好。", "一個幫你理解：", "<b>你選了之後，整個局會怎麼動。</b>", "這也是為什麼，在《華夏動態決策母體》裡，博弈論是一個不能缺少的模組。", "《易經》可以幫我們理解狀態與變化。", "它會問：", "現在處於什麼位置？", "局勢正在往哪裡轉？", "什麼地方已經接近翻轉點？", "《鬼谷子》處理資訊、人心與互動。", "它會問：", "誰知道什麼？", "誰不知道什麼？", "誰在試探誰？", "誰在影響誰？", "《孫子兵法》處理競爭、資源與行動。", "它會問：", "資源應該放在哪裡？", "哪裡值得打？", "哪裡應該避開？", "什麼時候進？", "什麼時候退？", "而博弈論補上的，是另一個不可替代的問題：", "<b>當我採取行動之後，其他參與者會怎麼改變自己的策略？</b>", "這一層如果沒有補上，動態決策系統就還是不完整。", "因為真正的世界從來不是一張靜態地圖。", "它更像一個不斷重新計算的系統。", "你改變價格，市場改變。", "你改變態度，對方改變。", "你增加資源，競爭者改變。", "你公開一個訊息，所有人的信念都可能重新更新。", "所以局勢不是一個固定物體。", "它是一個：", "<b>多個行動者不斷預測彼此、回應彼此、修正彼此之後，持續生成的新狀態。</b>", "從控制論來看，這是一個多重回饋系統。", "你不是單純輸入一個命令，然後等待世界產生結果。", "你的行動進入環境。", "環境裡的其他人接收到你的行動。", "他們根據自己的模型重新判斷。", "然後採取新的行動。", "新的行動又回到你。", "你再修正。", "所以整個世界形成：", "<b>行動 → 對方反應 → 新資訊 → 模型修正→ 新行動</b>", "而且這個循環不是只有你在跑。", "每個人都在跑。", "這就使博弈系統成為一個高度動態、非線性、具有回饋的複雜系統。", "因此，真正成熟的博弈能力，不是「更會算計」。", "而是提高三種能力。", "第一個能力，是<b>辨識結構</b>。", "你要先知道：", "你現在到底在玩什麼遊戲？", "是零和？", "還是非零和？", "是一次性互動？", "還是長期重複？", "資訊是公開的？", "還是有人知道你不知道的東西？", "你們是在合作？", "還是在競爭？", "還是同時合作又競爭？", "如果連遊戲結構都判斷錯，再聰明的策略也會失效。", "第二個能力，是<b>預測反應</b>。", "真正的高手不只問：", "「我的策略好不好？」", "而會問：", "<b>如果所有人都知道我會這樣做，他們會怎麼調整？</b>", "這是一個非常重要的升維。", "因為低階決策只看自己。", "中階決策開始看別人。", "高階決策則開始看：", "<b>別人如何看自己。</b>", "再往上一層，甚至要處理：", "<b>我知道你知道我知道。</b>", "這就是策略推演逐漸展開的地方。", "第三個能力，是<b>改變結構</b>。", "這是博弈論最容易被忽略、卻也是最高階的部分。", "很多人進入一個壞局之後，只會問：", "「我要怎麼贏？」", "但有時真正的答案不是贏。", "而是：", "<b>不要再玩這個遊戲。</b>", "或者：", "<b>改變遊戲規則。</b>", "一家公司如果陷入價格戰，可以繼續研究如何比對手再便宜一點。", "但也可以重新設計產品、差異化市場、改變合作模式。", "一對伴侶如果每天都在計算誰付出比較多，可以繼續爭輸贏。", "也可以重新設計責任分配。", "一個組織如果每個部門都搶預算，可以繼續要求大家「要有團隊精神」。", "也可以改變績效指標。", "這就是從：", "<b>局中求勝</b>", "升級成：", "<b>重設遊戲。</b>", "這個升維非常重要。", "因為人生真正的自由，從來不只是：", "<b>我有沒有選擇。</b>", "而是：", "<b>我能不能改變自己的策略空間？</b>", "如果你永遠只能在兩個爛選項裡選一個，那不是真正的自由。", "如果你永遠只能接受別人設計好的規則，那也不是完整的自由。", "更高階的自由是：", "<b>看懂規則。</b>", "<b>看懂誘因。</b>", "<b>看懂其他人的策略。</b>", "然後找到新的路徑。", "所以這本書不會把博弈論寫成一堆數學公式。", "公式當然重要。", "策略矩陣重要。", "納許均衡重要。", "囚徒困境重要。", "混合策略重要。", "貝氏博弈重要。", "重複博弈重要。", "機制設計也重要。", "但真正值得帶走的，不是名詞。", "而是一套新的世界模型。", "這個模型告訴你：", "<b>世界不是由孤立個體組成的。</b>", "每個人的選擇都進入別人的模型。", "別人的反應又回頭改變你的世界。", "因此，真正的智慧不是只把自己算得更精準。", "而是開始理解：", "<b>自己正處在哪一個互動結構之中。</b>", "當你能看懂博弈，你會開始發現很多以前看似「人性很差」的問題，其實是結構問題。", "有些人不是特別壞。", "而是制度在獎勵那種行為。", "有些團隊不是沒有能力。", "而是每個人的誘因彼此衝突。", "有些關係不是沒有感情。", "而是雙方掉進了一個沒有人願意先改變的均衡。", "有些競爭不是非打不可。", "而是參與者沒有找到新的策略空間。", "這時候，問題的焦點就會從：", "<b>誰對？誰錯？</b>", "升級成：", "<b>什麼結構正在生成這些行為？</b>", "這就是博弈論真正強大的地方。", "而當你走到這一層，博弈論也就不再只是經濟學的一門工具。", "它開始變成：", "<b>人生決策學。</b>", "<b>企業治理學。</b>", "<b>人際互動學。</b>", "<b>競爭策略學。</b>", "甚至是一種理解文明如何運作的結構語言。", "因為任何存在多個行動者、不同利益、資訊不對稱與策略反應的地方，都存在博弈。", "因此，這本書真正要學的，不是：", "<b>如何贏過別人。</b>", "而是四件事。", "先看清自己在哪個局。", "再看清每個人的目標函數。", "再預測彼此的策略反應。", "最後判斷：", "<b>這個局值得繼續玩嗎？</b>", "如果值得，就找到更好的策略。", "如果不值得，就離開。", "如果無法離開，就改變規則。", "如果規則能改，就重新設計一個更好的結構。", "這才是博弈智慧真正的終點。", "不是把所有人變成敵人。", "而是提高自己對互動世界的預測精度。", "從被局勢推著走，走向看懂局勢。", "從看懂局勢，走向改變局勢。", "而當一個人開始有能力重新設計自己的策略空間，自由，也就真正開始出現。"]}]}, {"t": "01｜博弈的本體：你的結果，不只由你決定", "p": 20, "s": [{"t": "導言", "p": 20, "x": ["<b>博弈論真正研究的，不是「我要怎麼選」，而是「當我的選擇會改變別人的選擇，而別人的選擇又會反過來改變我時，整個系統最後會走到哪裡」。</b>", "這是一個非常重要的分界。", "假設今天出門，你看到天空可能下雨。", "你有兩個選擇：", "帶傘，或不帶傘。", "天氣不會因為你帶傘而改變。", "所以這是一個典型的<b>決策問題</b>。", "你只需要估計：", "下雨機率是多少？", "帶傘的成本是多少？", "淋雨的損失是多少？", "然後做出選擇。", "但如果今天不是下雨，而是談判加薪，問題立刻不同。", "你要求加薪。", "老闆會判斷：", "你是不是準備離職？", "你有沒有其他工作機會？", "如果拒絕你，你真的會走嗎？", "如果答應你，其他員工會不會跟進？", "於是你提出加薪這個動作，本身就改變了老闆的判斷。", "而老闆的反應，又會反過來改變你的下一步。", "這時候，問題已經從：", "<b>世界會怎麼變？</b>", "變成：", "<b>其他人會因為我而怎麼變？</b>", "這就是博弈的起點。"]}, {"t": "1. 博弈不是「有競爭」才存在，而是「彼此相互影響」就存在", "p": 22, "x": ["很多人第一次接觸博弈論，很容易把它理解成：", "戰爭。", "商業競爭。", "談判。", "政治鬥爭。", "這些當然都是博弈。", "但這個理解太窄。", "真正決定一個情境是不是博弈的，不是有沒有敵人。", "而是：", "<b>參與者的結果，是否取決於其他參與者的選擇。</b>", "只要答案是「是」，博弈結構就已經出現。", "例如夫妻討論週末去哪裡。", "先生想爬山。", "太太想看電影。", "如果兩個人各自活動，那只是兩個獨立決策。", "但如果兩個人希望一起度過週末，問題就變成博弈。", "因為先生的滿意度，不只取決於自己喜不喜歡爬山。", "還取決於太太願不願意一起去。", "太太也一樣。", "因此：", "<b>同一件事情，可以因為互動結構不同，而從決策問題變成博弈問題。</b>", "再看企業。", "一家公司考慮是否推出新產品。", "如果市場上沒有競爭者，只需要研究：", "成本、需求、售價、風險。", "這比較接近決策科學。", "可是如果市場上還有另一家公司。", "問題立即增加一層：", "如果我推出，他會不會跟進？", "如果我降價，他會不會降價？", "如果我先大量投資，他會退出，還是反而加碼？", "如果我公開技術路線，他會不會改變研發方向？", "此時，競爭者已經不是背景。", "他是一個<b>會學習、會預測、會反應的行動者</b>。", "這就是博弈論與一般決策分析最深的差異。"]}, {"t": "2. 博弈的基本單位不是「選擇」，而是策略相互依賴", "p": 24, "x": ["要看懂任何博弈，可以先把複雜的人際故事全部拿掉。", "只留下五個結構。", "<b>第一個：玩家 </b>", "誰能改變結果？", "玩家不一定是「人」。", "可以是：", "個人、企業、部門、政黨、國家、平台、組織。", "甚至同一家公司內部不同部門，也可能形成一個博弈系統。", "例如：", "業務部希望多接單。", "財務部希望降低風險。", "研發部希望增加預算。", "管理層希望提高整體利潤。", "四個部門雖然屬於同一家公司，但目標函數並不完全一致。", "因此，公司內部一樣存在博弈。", "<b>第二個：策略 </b>", "每一個玩家可以做什麼？", "例如談判時：", "接受。", "拒絕。", "還價。", "拖延。", "退出。", "隱藏資訊。", "提前承諾。", "這些都是策略。", "但策略不是單純的一個動作。", "更完整地說：", "<b>策略是面對不同情況時，預先定義的一整套行動規則。</b>", "例如：", "「對方如果降價，我就降價。」", "「對方如果不降，我維持價格。」", "這才是一套真正的策略。", "因此，博弈論的思考不是只有：", "<b>我現在要做什麼？</b>", "而是：", "<b>如果不同情況發生，我準備怎麼反應？</b>", "<b>第三個：報酬 </b>", "每個玩家到底要什麼？", "這裡是很多分析最容易出錯的地方。", "因為人們常常把「表面說出來的目的」，誤認成真正的目標函數。", "例如員工要求升遷。", "你以為他要的是薪水。", "但他的真正目標可能是：", "身份。", "權力。", "成就感。", "未來職涯選項。", "或者只是希望證明自己沒有被忽視。", "同樣是「升遷」，背後的報酬函數完全不同。", "所以分析博弈不能只問：", "他做了什麼？", "還要問：", "<b>他真正想最大化的是什麼？</b>", "這就是目標函數。", "如果目標函數判斷錯誤，後面的策略推演幾乎一定會失真。", "<b>第四個：資訊 </b>", "誰知道什麼？", "這一項非常重要。", "因為現實世界幾乎不存在所有人掌握完全相同資訊的情況。", "賣房子的人可能知道房子漏水。", "買方不知道。", "求職者知道自己手上還有兩個 offer。", "公司不知道。", "公司知道預算其實還可以往上加。", "求職者不知道。", "雙方於是開始：", "試探。", "隱藏。", "傳遞訊號。", "判斷真假。", "這就從單純的利益博弈，進一步變成了<b>資訊博</b>", "<b>弈</b>。", "這也是《鬼谷子》之所以會和博弈論形成重要交界的地方。", "《鬼谷子》大量處理：", "觀察。", "試探。", "辨人。", "說服。", "資訊揭露。", "資訊隱藏。", "但現代博弈論可以進一步把這些問題形式化成：", "<b>資訊結構、信念、訊號與策略反應。</b>", "兩者不是同一套理論。", "但它們處理的問題空間高度相鄰。", "<b>第五個：規則與順序 </b>", "誰先動？", "誰後動？", "能不能反悔？", "承諾是否可信？", "行動能不能被看見？", "這些看似小問題，往往會徹底改變結果。", "例如兩家公司都考慮是否進入一個新市場。", "如果兩家公司同時決策，是一種博弈。", "如果 A 公司先投入十億元建廠，B 公司看到後才決定是否進入，則完全是另一種博弈。", "因為先行者已經透過投資改變了後來者的策略空間。", "所以真正的策略高手，不只是選擇行動。", "他還會研究：", "<b>能不能改變出手順序？</b>", "<b>能不能讓某個承諾變成不可逆？</b>", "<b>能不能讓對方先暴露資訊？</b>", "這已經開始進入動態博弈。"]}, {"t": "3. 最危險的錯誤：把會反應的人，當成不會動的環境", "p": 31, "x": ["這可能是現實決策中最普遍的模型錯誤之一。", "人們經常做出這樣的推理：", "「只要我這樣做，就會得到那個結果。」", "但中間漏掉了一整層：", "<b>別人會反應。</b>", "例如一家公司發現：", "降價 10％ 可以增加市占率。", "於是建立模型：", "降價 → 市占率提高。", "如果競爭者不動，這個推理可能成立。", "但競爭者不是石頭。", "他也會重新計算。", "所以真正的模型應該是：", "我降價↓對手觀察↓對手重新評估↓對手跟著降價↓全市場價格下降", "↓原本預測的市占優勢消失↓雙方利潤一起下降第一個模型是：", "<b>線性因果模型。</b>", "第二個模型是：", "<b>策略回饋模型。</b>", "兩者的差距，就是博弈論存在的理由。", "家庭也一樣。", "父母想讓孩子認真讀書。", "於是增加監督。", "最初模型是：", "監督增加 → 讀書增加。", "但孩子會反應。", "孩子可能開始：", "假裝讀書。", "隱藏手機。", "偷偷玩遊戲。", "只在父母面前做出努力的樣子。", "父母發現效果不好，再增加監督。", "孩子再增加逃避技巧。", "於是最後形成：", "控制增加→ 規避增加→ 信任下降→ 更強控制→ 更高規避這已經不是單純的教育問題。", "它是一個典型的<b>動態博弈回饋迴路</b>。", "雙方都在適應。", "而每一次適應，又創造下一輪的新環境。", "這時候就能看見一個非常重要的系統原理：", "<b>只要系統裡的行動者具有學習能力，任何穩定策略都有可能因為被觀察而失效。</b>", "這在企業、投資、軍事、政治、人際關係中都非常常見。", "某個策略成功。", "其他人模仿。", "策略優勢下降。", "市場重新平衡。", "新的策略出現。", "新的反制又出現。", "所以博弈世界不是靜態最佳化。", "而是：", "<b>策略 → 反策略 → 再策略 → 再反策略。</b>", "這就是共演化。"]}, {"t": "4. 真正的智慧不是猜對別人，而是不斷修正對別人的模型", "p": 35, "x": ["理解博弈論之後，很容易走向另一個極端。", "開始覺得：", "我要看穿每個人。", "我要預測所有人的下一步。", "我要比別人多算三步。", "但這仍然是一種錯誤理解。", "因為人不是完全可預測的機器。", "而且你掌握的資訊永遠不完整。", "所以真正成熟的博弈能力，不是要求自己永遠猜對。", "而是建立：", "<b>可以持續更新的他人模型。</b>", "例如第一次談判，你判斷對方最在乎價格。", "於是壓低價格。", "但對方反應不如預期。", "這是一個模型誤差。", "不要急著說：", "「他很奇怪。」", "應該問：", "我的模型錯在哪裡？", "也許他真正重視的是交貨速度。", "也許他在乎長期合作。", "也許他需要向董事會交代。", "也許他根本沒有真正的決策權。", "新證據出現後，你更新模型。", "下一輪策略自然跟著改變。", "所以從預測編碼的角度來看，博弈其實就是一個持續的：", "<b>預測 → 行動 → 回饋 → 誤差 → 更新</b>", "循環。", "只不過這一次，你預測的不是一個靜態世界。", "而是：", "<b>另一個也正在預測你的系統。</b>", "這使博弈比一般環境預測更複雜。", "因為雙方都在更新。", "甚至可能出現：", "我知道你知道我在觀察你。", "再往上一層：", "我知道你知道我知道你會改變。", "這就是策略推演開始真正變深的地方。", "<b>從《易經》《鬼谷子》《孫子兵法》重新看這個問題 </b>", "到了這裡，《華夏動態決策母體》的三部古典開始出現清楚分工。", "《易經》先問：", "<b>現在是一個什麼局？</b>", "它處理狀態、位置、關係與變化。", "《鬼谷子》再問：", "<b>局中之人怎麼想？掌握什麼資訊？正在試探什麼？</b>", "它處理資訊、人心與互動。", "《孫子兵法》進一步問：", "<b>在這個局裡，資源應該放哪裡？什麼時候進？</b>", "<b>什麼時候退？</b>", "它處理競爭、資源與行動。", "博弈論則補上：", "<b>當我採取行動以後，其他行動者會如何改變？</b>", "這四個問題一接起來，就不再是一條線。", "而是一個循環：", "<b>看局 → 看人 → 出手 → 對方反應 → 局勢改變 → 重新看局。</b>", "這才是真正的動態決策。", "<b>總結｜別再只問「我應該怎麼做」 </b>", "博弈論第一章真正要建立的，不是一個公式。", "而是一個新的世界模型。", "過去你可能習慣問：", "我要怎麼做？", "現在應該多問幾個問題：", "<b>誰還在這個局裡？</b>", "<b>他們真正要的是什麼？</b>", "<b>他們知道什麼？</b>", "<b>他們不知道什麼？</b>", "<b>我改變之後，他們會怎麼改？</b>", "<b>他們的改變，又會怎麼改變我？</b>", "一旦開始這樣思考，你看到的世界就會完全不同。", "很多原本看似個人能力的問題，會變成結構問題。", "很多看似人格衝突的問題，會變成誘因問題。", "很多看似偶然失敗的決策，會變成策略互動問題。", "這就是博弈論真正的第一性原理：", "<b>你不是在一個靜止世界裡做選擇。</b>", "<b>你是在一個會因為你的選擇而重新計算的世界裡行動。</b>", "因此，智慧不只是選對。", "更重要的是：", "<b>看見別人也在選。</b>", "再進一步看見：", "<b>彼此的選擇正在共同生成下一個世界。</b>", "而真正的自由，也就不再只是「我想做什麼」。", "而是你開始有能力看懂：", "<b>自己正在參與什麼博弈、被什麼規則限制、有哪些策略空間，以及這個局，究竟能不能重新設計。</b>"]}]}, {"t": "02｜先不要猜人心：把博弈結構畫出來", "p": 42, "s": [{"t": "導言", "p": 42, "x": ["<b>很多人不是輸在不聰明，而是輸在太快開始猜別人在想什麼，卻沒有先把整個博弈結構看清楚。</b>", "一遇到衝突，人很容易立刻進入心理解讀：", "他是不是故意的？", "他是不是看不起我？", "他是不是想佔我便宜？", "他是不是準備背叛我？", "他是不是有別的目的？", "問題是：", "<b>心理猜測通常比結構資訊更不可靠。</b>", "你可能猜對。", "也可能只是把自己的恐懼、經驗與偏見投射到對方身上。", "所以博弈論第一個真正有用的方法，不是讀心。", "而是：", "<b>把人先拿掉，把局畫出來。</b>", "誰在局中？", "每個人能做什麼？", "每個人真正想得到什麼？", "誰掌握哪些資訊？", "誰先動？", "誰可以退出？", "誰可以改變規則？", "只要這些東西開始清楚，很多原本混亂的問題，會突然變得可以分析。"]}, {"t": "1. 第一件事：先找出真正的玩家", "p": 43, "x": ["很多博弈一開始就分析錯，是因為玩家找錯了。", "例如你和主管談升遷。", "表面上看：", "玩家只有你和主管。", "但實際上可能還有：", "人資。", "部門總監。", "財務部。", "另一位候選人。", "甚至公司總部。", "你的主管表面上坐在你對面。", "但他也可能沒有最終決策權。", "如果你把他當成唯一玩家，就會錯估整個局。", "再例如家庭裡。", "孩子要不要補習。", "表面玩家：", "父母與孩子。", "但真正可能還有：", "老師。", "同學。", "祖父母。", "升學制度。", "家庭經濟條件。", "甚至社會比較壓力。", "這些因素不一定全部都是「玩家」。", "但只要它們能主動改變策略與結果，就必須納入博弈模型。", "所以第一個問題不是：", "誰在跟我對抗？", "而是：", "<b>誰有能力改變這個結果？</b>", "這才是玩家。", "玩家辨識錯誤，會產生一個非常典型的模型誤差：", "<b>你一直在說服錯的人。</b>", "例如業務員一直努力說服窗口。", "但真正決定採購的是財務長。", "再多的說服都沒有用。", "又或者夫妻爭吵，兩個人以為問題是彼此。", "但真正影響兩人行為的，是婆媳關係、金錢壓力、工作時間與育兒責任。", "如果真正的玩家與結構沒有被找出來，最後就會變成：", "<b>一直改人，卻沒有改局。</b>"]}, {"t": "2. 第二件事：列出每個玩家真正能做什麼", "p": 46, "x": ["知道玩家之後，下一步就是策略集合。", "簡單說：", "<b>每個人有哪些可行選擇？</b>", "很多人會忽略這一步。", "因為人很容易把問題壓縮成：", "只有 A 或 B。", "例如：", "「我要不要離職？」", "看起來只有：", "離職。", "不離職。", "但實際策略可能包括：", "留下但要求調職。", "留下但降低投入。", "先找新工作再走。", "爭取遠距。", "與主管重新談條件。", "申請內部轉職。", "兼職測試市場。", "甚至暫時不動。", "一旦策略空間展開，整個問題就不同了。", "所以自由最直接的結構之一，就是：", "<b>你擁有多少可行策略。</b>", "策略越少，越容易被控制。", "策略越多，博弈能力越強。", "這裡也要注意一件事：", "策略不是「願望」。", "策略必須是：", "<b>你真的能採取的行動。</b>", "「我要讓他理解我。」", "不是策略。", "「我要讓市場接受我。」", "也不是策略。", "那是結果。", "真正的策略應該是可執行行動。", "例如：", "提供新證據。", "改變價格。", "延長交貨期。", "退出談判。", "增加替代方案。", "公開承諾。", "降低資訊揭露。", "找到另一個合作對象。", "所以分析博弈時，一定要把：", "<b>目標</b>", "和<b>策略</b>", "分開。", "目標是：", "我要去哪裡。", "策略是：", "我可以怎麼走。"]}, {"t": "3. 第三件事：不要相信表面理由，要找真正的報酬函數", "p": 49, "x": ["這是博弈分析最重要的一層。", "同樣一個選擇，不同的人可能追求完全不同的東西。", "例如兩個員工都要求升職。", "A 真正想要的是：", "薪資。", "B 真正想要的是：", "頭銜與地位。", "C 可能想要：", "更大的決策權。", "D 可能只是怕自己落後同儕。", "表面行為都一樣。", "但報酬函數不同。", "策略就會不同。", "博弈論裡，通常把每個玩家想得到的結果叫做：", "<b>報酬。</b>", "更精確地說，是效用。", "但現實世界的效用，不一定等於錢。", "一個人可能追求：", "金錢。", "安全。", "權力。", "面子。", "關係。", "身份。", "控制感。", "自由。", "長期機會。", "避免損失。", "避免羞辱。", "甚至只是：", "不想讓對方贏。", "最後這一種非常常見。", "有些博弈到了後期，已經不再追求原來的利益。", "而變成：", "<b>我可以輸，但你不能贏。</b>", "一旦目標函數從「創造利益」變成「阻止對方成功」，整個博弈就可能從正和走向負和。", "這就是為什麼很多公司內鬥到最後，所有人都受傷。", "因為目標函數已經漂移了。", "所以分析任何博弈，都應該問：", "<b>每個玩家真正正在最大化什麼？</b>", "以及：", "<b>他最不能接受什麼？</b>", "第二個問題有時更重要。", "因為人類決策並不只受利益驅動。", "很多時候更受損失厭惡、身份威脅與風險控制驅動。", "所以一個完整的玩家模型至少要分成：", "<b>想得到什麼。</b>", "<b>怕失去什麼。</b>", "<b>不能接受什麼。</b>", "這三個層次。"]}, {"t": "4. 第四件事：資訊分布決定誰真正有優勢", "p": 53, "x": ["同樣的資源，掌握不同資訊，結果可能完全不同。", "所以博弈不能只看：", "誰比較有錢。", "誰比較有權。", "誰資源比較多。", "還要看：", "<b>誰知道得比較多？</b>", "例如談判。", "你知道自己的底價。", "對方不知道。", "對方知道自己的底價。", "你不知道。", "這就形成資訊不對稱。", "如果你還知道：", "對方今天一定要成交。", "但對方不知道你知道。", "那又多一層優勢。", "所以資訊至少要拆成幾種：", "<b>公開資訊 </b>", "大家都知道。", "例如公開價格、政策、規則。", "<b>私人資訊 </b>", "只有特定玩家知道。", "例如成本、預算、底價、真實需求。", "<b>共同知識 </b>", "不只是大家知道。", "而且：", "大家知道大家都知道。", "這一點非常重要。", "例如市場都知道某家公司缺現金。", "如果只有你知道，是情報優勢。", "如果所有人都知道，而且大家知道彼此都知道，策略反應就會完全不同。", "所以真正的資訊結構不是：", "有沒有資料。", "而是：", "<b>誰知道什麼，而且誰知道誰知道什麼。</b>", "這就是為什麼在博弈世界裡，資訊不是附屬品。", "資訊本身就是資源。", "甚至常常比資金更重要。"]}, {"t": "5. 第五件事：順序會改變整個博弈", "p": 56, "x": ["很多人以為：", "只要參與者相同、利益相同，結果就差不多。", "不一定。", "<b>誰先動，常常會徹底改變結果。</b>", "例如兩家公司準備進入同一個市場。", "如果同時決策，雙方都不知道對方會不會進入。", "這是一種博弈。", "但如果 A 公司先花大筆資金蓋工廠，B 公司看到之後再決定，整個局就變了。", "因為 A 已經用行動發出一個強烈訊號：", "我已經投入了，我不容易退出。", "這就是先行承諾。", "但先行不一定永遠有利。", "有時候後動者反而更有優勢。", "因為後動者可以觀察：", "先行者犯了什麼錯。", "市場怎麼反應。", "哪些假設不成立。", "所以有些市場是：", "<b>先動優勢。</b>", "有些是：", "<b>後動優勢。</b>", "真正的問題不是：", "誰先誰贏。", "而是：", "<b>在這個結構裡，先動會增加什麼？又會失去什麼？</b>"]}, {"t": "6. 規則不是背景，它本身就是博弈的一部分", "p": 58, "x": ["很多人討論策略，只看參與者。", "卻忽略規則。", "但真正高階的博弈分析，一定會問：", "<b>這場遊戲的規則是誰定的？</b>", "例如公司績效制度。", "如果只獎勵個人業績，就可能鼓勵：", "搶客戶。", "搶功勞。", "隱藏資訊。", "不願意協作。", "然後管理者再責怪：", "「大家沒有團隊精神。」", "這其實是模型錯誤。", "因為系統正在獎勵個人競爭。", "所以員工的行為不是異常。", "反而是對誘因的正常反應。", "真正該改的不是人。", "而是規則。", "再例如家庭。", "如果每次孩子哭鬧，父母最後都讓步。", "久而久之，孩子就會學到：", "<b>哭鬧是有效策略。</b>", "這不是道德問題。", "而是系統在強化某種策略。", "只要一個行為持續得到回報，它就會被保留。", "所以博弈世界裡一個非常重要的原則是：", "<b>不要只看人說什麼，要看系統實際獎勵什麼。</b>", "因為真正塑造行為的，通常不是口號。", "而是報酬結構。"]}, {"t": "7. 把混亂事件壓縮成一張博弈地圖", "p": 60, "x": ["現在把前面的元素合起來。", "遇到一個複雜問題時，先不要分析誰對誰錯。", "先回答：", "<b>第一層：玩家 </b>", "誰能影響結果？", "<b>第二層：策略 </b>", "每個人有哪些真正可行的選項？", "<b>第三層：目標 </b>", "每個玩家正在最大化什麼？", "又最害怕失去什麼？", "<b>第四層：資訊 </b>", "誰知道什麼？", "哪些資訊不對稱？", "<b>第五層：順序 </b>", "誰先動？", "誰能觀察誰？", "誰能反應？", "<b>第六層：規則 </b>", "什麼行為會得到獎勵？", "什麼行為會被懲罰？", "<b>第七層：退出 </b>", "誰可以離開？", "離開的成本是多少？", "只要把這七層畫出來，一個原本像情緒泥沼的問題，通常就會開始變成：", "<b>可以計算的結構。</b>"]}, {"t": "8. 生活案例：兩個部門為什麼永遠合作不起來？", "p": 62, "x": ["假設公司裡有兩個部門：", "業務部。", "產品部。", "業務部抱怨：", "產品開發太慢。", "產品部抱怨：", "業務亂答應客戶需求。", "表面上看，兩邊個性不合。", "但如果把結構畫出來：", "<b>玩家 </b>", "業務部。", "產品部。", "管理層。", "<b>業務部目標 </b>", "增加成交量。", "縮短成交時間。", "<b>產品部目標 </b>", "控制開發成本。", "降低系統複雜度。", "維持產品品質。", "<b>報酬制度 </b>", "業務依成交量領獎金。", "產品依穩定度與開發時程考核。", "這時候就會發現：", "問題根本不是「溝通不足」。", "而是：", "<b>兩個部門的目標函數沒有對齊。</b>", "業務最合理的行動是：", "盡可能答應客戶。", "產品最合理的行動是：", "盡可能控制需求。", "於是雙方衝突不是偶然。", "而是制度自然生成。", "這時候如果管理者只辦：", "團隊共識營。", "溝通訓練。", "跨部門聚餐。", "效果通常有限。", "因為底層結構沒有變。", "真正要改的是：", "<b>報酬結構與共同目標。</b>", "例如讓兩邊共同承擔：", "收入。", "開發成本。", "客戶留存。", "這時候博弈結構才可能改變。", "這就是：", "<b>不要只修正人，要修正誘因。</b>"]}, {"t": "9. 從《鬼谷子》看資訊，從博弈論看結構", "p": 65, "x": ["到了這裡，就可以看見《鬼谷子》與博弈論的差異。", "《鬼谷子》很擅長處理：", "人心。", "試探。", "說服。", "進退。", "資訊。", "所以它經常讓你問：", "對方到底怎麼想？", "但博弈論會再補一層：", "<b>即使我不知道他內心真正怎麼想，我能不能只根據他的策略位置與誘因，預測他的行動？</b>", "這非常重要。", "因為現實中你永遠無法完全讀懂別人的內心。", "但你可以觀察：", "他的利益。", "他的選項。", "他的成本。", "他的風險。", "他的退出條件。", "這些東西往往比猜心理更穩定。", "例如一個供應商說：", "「這已經是最低價。」", "你不用立刻判斷：", "他是不是說謊。", "先看結構：", "他還有多少庫存？", "他有幾個買家？", "月底是否需要現金？", "替代客戶多不多？", "你有沒有替代供應商？", "如果他沒有其他買家，而且庫存壓力很大，那麼即使你完全不知道他的內心，你仍然可以判斷：", "他的策略空間受到限制。", "這就是：", "<b>從心理猜測，升級到結構推演。</b>"]}, {"t": "10. 從控制論看：結構地圖就是你的感測器", "p": 67, "x": ["控制論告訴我們：", "如果感測器失真，後面的控制一定失真。", "博弈也是一樣。", "如果你對整個局的感知錯誤，後面的策略再精密都沒有用。", "你以為只有兩個玩家。", "其實還有第三方。", "你以為對方追求價格。", "其實他追求時間。", "你以為他不能退出。", "其實他有替代方案。", "你以為自己很有選擇。", "其實你的退出成本極高。", "這些都是：", "<b>模型誤差。</b>", "所以畫博弈結構的本質，不是在做圖。", "而是在建立：", "<b>更高解析度的世界模型。</b>", "解析度越高，你越不容易被表面情緒綁架。"]}, {"t": "11. 高階博弈者看的是「結構」，不是「人格」", "p": 68, "x": ["這裡有一個非常重要的轉變。", "低階分析會說：", "他很自私。", "他很壞。", "他很難合作。", "高階分析會問：", "在什麼誘因下，他這樣做是合理的？", "這不是替任何人開脫。", "而是提高模型精度。", "因為如果一個行為主要由結構生成，只換一個人，同樣問題可能再次出現。", "例如一家公司每任主管都變得強勢。", "問題未必是：", "每任主管都人格有問題。", "可能是因為公司制度只獎勵短期績效。", "誰坐上那個位置，", "都會被結構推向同一種行為。", "這就是：", "<b>位置會塑造策略。</b>", "所以理解博弈後，你會慢慢從：", "「誰是壞人？」", "轉成：", "<b>什麼結構正在生成這種行為？</b>", "這就是模型升維。", "<b>總結｜先把局畫清楚，再談人心 </b>", "博弈論第二個核心原則是：", "<b>先結構，後心理。</b>", "面對複雜問題，先不要急著猜：", "誰愛誰。", "誰恨誰。", "誰真心。", "誰虛偽。", "先看：", "誰是玩家。", "誰有什麼策略。", "誰追求什麼。", "誰知道什麼。", "誰先動。", "誰能退出。", "規則在獎勵什麼。", "只要這些開始清楚，很多混亂就會下降。", "因為你開始從情緒投影，回到系統結構。", "最後真正要建立的，是一張：", "<b>玩家 × 策略 × 報酬 × 資訊 × 順序 × 規則 × 退出</b>", "的博弈地圖。", "而這張地圖的目的，不是讓你控制所有人。", "而是降低模型誤差。", "因為只有當你真正知道：", "<b>自己正在玩什麼遊戲，</b>", "你才有可能判斷：", "<b>該怎麼玩。</b>", "甚至進一步決定：", "<b>這個遊戲，還值不值得繼續玩。</b>"]}]}, {"t": "03｜零和不是世界的常態：先判斷你到底在玩哪一種局", "p": 73, "s": [{"t": "導言", "p": 73, "x": ["<b>很多人不是輸在策略差，而是一開始就把遊戲類型判斷錯了。</b>", "本來可以合作的局，被當成你死我活。", "本來就是資源爭奪的局，卻一直期待大家彼此體諒。", "本來可以創造新價值，卻只是在搶既有蛋糕。", "本來所有人都正在一起虧損，卻還在爭誰輸得比較少。", "所以博弈真正重要的第一步，不是問：", "<b>我要怎麼贏？</b>", "而是先問：", "<b>這到底是一個什麼局？</b>", "如果遊戲類型判斷錯了，後面的策略越努力，反而可能讓系統越糟。"]}, {"t": "1. 最常見的模型錯誤：把所有衝突都看成零和", "p": 74, "x": ["所謂零和，最簡單的意思是：", "<b>一方增加多少，另一方就必須減少多少。</b>", "總量固定。", "例如兩個人分一塊已經不能變大的蛋糕。", "你多拿一塊，我就少一塊。", "這是一個典型的零和結構。", "競技比賽也接近這種結構。", "冠軍只有一個。", "如果你拿到冠軍，我就不能同時拿同一個冠軍。", "所以在這種情況下，競爭是結構性的。", "不是雙方態度不好。", "而是目標彼此互斥。", "但真實人生中，很多情境根本不是純零和。", "例如兩家公司合作開發新市場。", "如果合作成功，市場本身可能變大。", "兩家公司都可以比合作前賺得更多。", "這時候就不是：", "你多我少。", "而是：", "<b>我們有沒有可能一起把總價值做大？</b>", "這就是非零和。", "家庭也一樣。", "夫妻在爭：", "「今天到底誰去接孩子？」", "如果只看這一個晚上，", "好像是一場資源分配：", "一個人付出時間，另一個人獲得自由。", "但如果把時間尺度拉長，問題可能變成：", "如何重新設計家庭分工，讓兩個人都減少疲勞，孩子也得到穩定照顧。", "原本的「誰贏誰輸」，就可能轉成一個新的結構設計問題。", "所以第一個重要原則是：", "<b>衝突，不等於零和。</b>", "有衝突，只代表目標目前沒有完全一致。", "它不代表雙方利益必然互相抵消。"]}, {"t": "2. 零和局：總價值固定，重點是分配", "p": 77, "x": ["零和博弈最容易理解。", "假設桌上有 100 元。", "兩個人分。", "A 多拿 10 元，B 就少 10 元。", "總和始終是 100。", "這種結構裡，你的核心問題通常是：", "<b>如何取得更大的分配份額？</b>", "所以零和博弈裡，常見的策略會聚焦在：", "資訊。", "位置。", "議價能力。", "速度。", "控制權。", "欺敵。", "資源優勢。", "例如某個單一職缺。", "只有一個名額。", "十個人競爭。", "這個名額本身就是稀缺資源。", "不可能十個人一起得到同一個位置。", "因此至少在「職缺分配」這個局部結構上，它具有高度零和特徵。", "再例如土地競標。", "一塊特定土地。", "只能賣給一個買家。", "競標者之間的利益就高度衝突。", "這時候如果你還一直期待：", "「我們大家一起共好。」", "就可能是錯誤模型。", "因為資源本身具有排他性。", "所以面對零和局，不能靠善意消除結構衝突。", "真正要做的是：", "<b>看清楚稀缺資源到底是什麼。</b>", "很多人以為自己在搶錢。", "其實搶的是：", "位置。", "注意力。", "時間。", "權力。", "市場入口。", "稀缺資格。", "只要核心資源不可同時共享，零和成分就會上升。"]}, {"t": "3. 非零和局：你的利益與我的利益不必互相抵消", "p": 80, "x": ["非零和博弈的核心是：", "<b>雙方報酬總和不是固定的。</b>", "可能一起增加。", "也可能一起減少。", "所以非零和世界，比零和更複雜。", "因為你不只需要思考：", "怎麼分。", "還要思考：", "<b>怎麼創造新的總價值。</b>", "例如供應商與品牌商合作。", "品牌商需要：", "穩定品質、快速交貨。", "供應商需要：", "穩定訂單、合理利潤。", "如果雙方只拚價格，可能互相壓榨。", "但如果共同改善生產流程，降低瑕疵與物流成本，就可能讓：", "品牌商成本下降。", "供應商利潤反而增加。", "這就是典型的非零和結構。", "價值不是固定的。", "結構改變後，總報酬可以上升。", "這裡有一個非常重要的升維：", "低階談判只問：", "誰多拿一點？", "高階談判會先問：", "<b>能不能讓可分配的總價值先變大？</b>", "前者是分配問題。", "後者是生成問題。", "這也是企業世界裡最常見的差距。", "低階競爭者一直盯著：", "現有市場份額。", "高階競爭者會問：", "能不能創造新市場？", "低階管理只想：", "如何從員工多拿一些產出？", "高階管理會問：", "如何改善工具與流程，讓員工更輕鬆，公司同時得到更多產出？", "這就是：", "<b>從搶蛋糕，升級成做大蛋糕。</b>"]}, {"t": "4. 正和局：所有人都可能比原來更好", "p": 83, "x": ["正和博弈不是一個嚴格到只有單一定義的日常分類詞，但作為理解結構非常有用。", "它指的是：", "<b>透過互動或合作，系統能生成比原本更高的總價值。</b>", "例如兩個人分工創業。", "A 擅長產品。", "B 擅長行銷。", "如果各自單打獨鬥，每個人都只能做到 50。", "合作後，可能產生 150。", "多出來的 50，不是從任何一方搶來的。", "而是由合作結構湧現。", "這就是正和的本質：", "<b>關係本身產生額外價值。</b>", "從複雜系統來看，這可以理解成：", "<b>系統整合之後產生湧現。</b>", "1＋1 不只是 2。", "新的連結，可能生成原本個體不存在的能力。", "例如：", "一個人有技術。", "另一個人有通路。", "單獨存在時價值有限。", "連結後，突然出現商業化能力。", "所以正和並不只是「大家友善」。", "它有非常具體的結構條件：", "<b>互補資源。</b>", "<b>可信合作。</b>", "<b>可分配剩餘。</b>", "<b>共同規則。</b>", "<b>長期回饋。</b>", "這些條件不存在，正和就不會自動發生。"]}, {"t": "5. 負和局：最危險的不是輸，而是大家一起變差", "p": 85, "x": ["很多人只知道：", "輸贏。", "但還有一種更糟的局：", "<b>大家都在消耗，最後總價值下降。</b>", "這就是負和結構。", "最典型的例子：", "價格戰。", "A 公司降價。", "B 公司跟。", "A 再降。", "B 再跟。", "最後：", "消費者短期受益。", "但公司利潤下降。", "服務品質下降。", "員工壓力提高。", "研發投資縮減。", "市場最後可能整體惡化。", "再例如夫妻冷戰。", "一開始只是某件小事。", "A 不說話。", "B 覺得被忽視，也不說話。", "A 覺得 B 更冷淡，於是更加防禦。", "最後：", "沒有人得到想要的結果。", "關係卻被持續消耗。", "這就是典型的：", "<b>負和回饋迴路。</b>", "很多組織內鬥也一樣。", "A 部門為了證明自己重要，隱藏資訊。", "B 部門因此失去信任，也開始保留資訊。", "結果：", "兩個部門都失去協作效率。", "公司整體變差。", "這時候如果兩邊還在問：", "「到底誰贏？」", "其實已經問錯了。", "真正應該問的是：", "<b>為什麼整個系統正在持續熵增？</b>", "這就是負和局最危險的地方。", "參與者可能還在計算相對輸贏，卻忽略：", "<b>整個母體正在失血。</b>"]}, {"t": "6. 正和、零和、負和，不一定是固定屬性", "p": 88, "x": ["這裡非常重要。", "不要把一場博弈永久貼上：", "零和。", "正和。", "負和。", "因為遊戲結構可能改變。", "例如兩家公司。", "在某個政府標案上，可能是高度零和：", "只有一家公司得標。", "但兩家公司在制定產業標準時，可能又有合作空間。", "如果共同建立新標準，整個市場都可能擴張。", "所以同一組玩家，在不同層級上可以同時存在：", "<b>競爭與合作。</b>", "這就是現實最常見的情況：", "<b>混合動機。</b>", "既競爭，又合作。", "例如兩家手機品牌。", "它們競爭消費者。", "但可能同時使用相同供應鏈。", "甚至共同推動某些產業標準。", "國家也是如此。", "兩國可能在軍事上競爭。", "在貿易上互相依賴。", "在氣候議題上合作。", "在科技上限制彼此。", "所以現實世界很少只有單一維度。", "這就是低維二元思考最容易失真的地方：", "朋友／敵人。", "合作／競爭。", "贏／輸。", "現實更接近：", "<b>同一組玩家，可以在不同資源、不同時間、不同層級上，同時處於不同博弈。</b>", "所以真正成熟的博弈分析，", "一定要先確定：", "<b>你正在分析哪一個層級。</b>"]}, {"t": "7. 合作博弈與非合作博弈，不是「友善」與「不友善」", "p": 91, "x": ["這裡要把一個常見誤解說清楚。", "正式博弈論裡的「合作博弈」與「非合作博弈」，並不是在判斷：", "大家感情好不好。", "合作博弈通常關心的是：", "<b>玩家能不能形成聯盟，以及聯盟產生的價值如何分配。</b>", "非合作博弈則著重：", "<b>各玩家在既定規則下，各自選擇策略後會形成什麼結果。</b>", "所以非合作博弈裡，一樣可能出現合作行為。", "例如重複囚徒困境。", "玩家沒有一個外在強制契約，卻可能因為未來互動而自發形成合作。", "這個差異很重要。", "因為真正值得研究的不是：", "大家有沒有「合作精神」。", "而是：", "<b>合作在這個結構裡能不能穩定存在？</b>", "如果合作一定會被背叛者利用，那麼一直喊合作沒有用。", "真正該問的是：", "怎麼重新設計：", "報酬。", "懲罰。", "聲譽。", "資訊。", "重複互動。", "讓合作變成一種穩定策略。", "所以成熟的系統不依靠：", "<b>大家都成為聖人。</b>", "而是建立：", "<b>即使每個人都有自己的利益，系統仍能讓合作成為合理選擇。</b>", "這就是制度設計真正高明的地方。"]}, {"t": "8. 最常見的失敗：把正和局玩成零和局", "p": 93, "x": ["這在人際關係中特別常見。", "例如夫妻收入分配。", "A 覺得：", "「我做比較多，所以我要證明我比較重要。」", "B 也開始計算：", "「我照顧家庭的時間更多。」", "最後雙方開始：", "記帳。", "比較。", "防衛。", "競爭。", "原本家庭可能是一個高度正和系統：", "兩個人合作，生活成本降低。", "育兒效率提高。", "情緒支持增加。", "長期資產累積。", "但只要雙方把關係重新定義成：", "<b>誰比較吃虧？</b>", "整個正和局就可能被逐步玩成零和甚至負和局。", "企業也一樣。", "兩個部門原本共同服務同一家公司。", "理論上，資訊共享應該提高整體效率。", "但如果績效制度只獎勵個別部門，就可能開始：", "搶客戶。", "搶預算。", "搶功勞。", "隱藏失敗。", "於是本來應該正和的內部合作，被錯誤制度改造成零和競爭。", "再繼續下去，甚至變成負和。", "所以不要以為遊戲類型只由外部環境決定。", "<b>規則本身，可以改變遊戲類型。</b>", "這是非常重要的。"]}, {"t": "9. 另一種失敗：把真正的零和局幻想成正和局", "p": 96, "x": ["反過來也一樣危險。", "有些人因為相信合作，就以為所有衝突都可以共贏。", "不一定。", "如果只有一個名額，兩個人都要，那麼至少這個名額本身就不能同時共享。", "如果資源具有不可分割性，競爭就是真實存在。", "這時候成熟不是假裝沒有衝突。", "而是：", "<b>承認衝突，再尋找是否存在第二層正和空間。</b>", "例如兩個人競爭同一個主管職位。", "職位是零和。", "但兩人的長期職涯未必是零和。", "一人得到主管。", "另一人可能轉到另一個部門，得到更好的發展。", "也就是說：", "第一層遊戲可能是零和。", "把邊界放大後，第二層可能變成非零和。", "這就是一個非常重要的能力：", "<b>改變遊戲邊界。</b>", "你以為只有一塊蛋糕。", "但也許真正的問題是：", "為什麼只能吃這一塊？", "這就是從：", "<b>局內最佳化</b>", "開始升級到：", "<b>重新定義策略空間。</b>"]}, {"t": "10. 時間尺度一變，遊戲類型也可能改變", "p": 98, "x": ["再看一個更重要的變數：", "<b>時間。</b>", "單次交易看起來可能是零和。", "例如談價格。", "買方少付 1 萬，賣方少賺 1 萬。", "但如果雙方未來要合作十年，現在多拿這 1 萬，可能破壞長期信任。", "於是短期零和，放到長期後，可能變成非零和。", "這就是為什麼真正高階的策略，不能只看：", "今天誰贏。", "而要看：", "<b>這個策略會如何改變下一輪遊戲？</b>", "如果一次占便宜，讓未來所有合作機會消失，短期看是贏。", "長期可能是輸。", "所以時間尺度，是博弈分類的一個關鍵維度。", "這也直接接到熵的問題。", "短期榨取，可能讓局部報酬上升。", "但如果因此破壞：", "信任。", "聲譽。", "合作網絡。", "制度穩定。", "那就是把未來秩序轉化成今天利益。", "短期看似增加收益。", "長期卻在增加系統熵。"]}, {"t": "11. 真正高階的問題：能不能改變博弈的總和？", "p": 100, "x": ["現在就來到更高一層。", "低階玩家問：", "在這個局裡，我怎麼拿最多？", "中階玩家問：", "我怎麼預測其他人的反應？", "高階玩家則開始問：", "<b>我能不能改變這個局本身？</b>", "例如兩家公司陷入價格戰。", "可以繼續：", "彼此降價。", "這是在既有局裡競爭。", "也可以改成：", "提高產品差異化。", "服務不同客群。", "改變商業模式。", "增加附加服務。", "這等於重新設計博弈。", "一旦差異化成功，原本的：", "<b>零和搶客戶</b>", "可能轉成：", "<b>各自服務不同市場。</b>", "也就是：", "<b>真正高階的策略，不一定是找到更好的招，而是改變遊戲的報酬結構。</b>", "這也是商業創新的本質之一。", "紅海市場裡：", "大家搶同一批客戶。", "新市場出現時：", "新的需求被創造。", "原本沒有的價值開始產生。", "這時候策略就從：", "分配既有價值，變成：", "生成新價值。"]}, {"t": "12. 從《孫子兵法》看：最高明的不是一直打", "p": 102, "x": ["到了這裡，就會看見《孫子兵法》與博弈論一個非常重要的交界。", "如果把《孫子兵法》粗暴理解成：", "如何打敗敵人。", "就太低維。", "它真正大量處理的是：", "何時值得競爭。", "何時避免高成本對抗。", "如何改變局勢。", "如何改變對手選項。", "如何讓對手不願意進入某個局。", "所以：", "<b>真正高階的競爭，不是把每一場遊戲都玩成零和。</b>", "如果能：", "不戰。", "改局。", "避實。", "擊虛。", "創造不對稱。", "就不需要每次都在正面資源消耗中決勝。", "《鬼谷子》則進一步處理：", "如何透過資訊與關係，改變對方對報酬與風險的判斷。", "《易經》則提醒：", "同一個結構不會永遠固定。", "今天是正和，條件改變後，明天可能變成零和。", "今天是合作，資源枯竭後，可能轉成競爭。", "所以真正的動態決策不是：", "給一場博弈永久貼標籤。", "而是持續判斷：", "<b>現在，這個局正在變成什麼？</b>"]}, {"t": "13. 一套實用的判斷方法", "p": 105, "x": ["遇到任何衝突，先不要急著找策略。", "先問六個問題。", "<b>第一個：核心資源是否固定？ </b>", "如果固定而且不能共享，零和程度提高。", "<b>第二個：雙方能不能共同創造新價值？ </b>", "如果可以，存在正和空間。", "<b>第三個：互動是否讓總價值持續下降？ </b>", "如果是，正在進入負和。", "<b>第四個：雙方是一次互動還是長期重複？ </b>", "時間尺度會改變策略。", "<b>第五個：不同層級是否存在不同遊戲？ </b>", "局部可能零和。", "整體可能非零和。", "<b>第六個：能不能改規則、改資源、改邊界？ </b>", "如果可以，你就不必永遠被原本的遊戲困住。", "<b>總結｜真正的高手，先辨識遊戲，再決定要不要贏 </b>", "博弈論第三個核心原則是：", "<b>不是所有局都該用同一種策略。</b>", "零和局，重點是分配與競爭。", "正和局，重點是合作與價值生成。", "負和局，最重要的通常不是勝負，而是：", "<b>停止內耗。</b>", "非零和局，則必須同時處理：", "競爭與合作。", "所以真正重要的不是：", "「我要不要競爭？」", "而是：", "<b>現在這個結構，究竟正在獎勵什麼？</b>", "也不是：", "「合作是不是比較善良？」", "而是：", "<b>合作在這個系統裡，能不能形成穩定結構？</b>", "再往上一層，真正的智慧是開始問：", "<b>這個局一定只能這樣玩嗎？</b>", "如果一個零和局可以重新設計成正和，", "那就不是策略優化。", "而是結構升維。", "如果一個負和局可以被停止，那不是認輸。", "而是阻止熵繼續上升。", "如果一個不可避免的零和局必須競爭，那就承認它，不要用虛假的和諧遮蔽真實結構。", "這才是博弈智慧真正成熟的地方：", "<b>該合作時合作。</b>", "<b>該競爭時競爭。</b>", "<b>該退出時退出。</b>", "<b>該改規則時改規則。</b>", "最後你真正學會的，不是如何永遠贏。", "而是看懂：", "<b>什麼局值得贏，什麼局不值得進，什麼局應該立刻停止，以及什麼局可以被重新設計。</b>", "這時候，博弈就不再只是輸贏。", "而成為一種對<b>結構、流動、熵、策略空間與更</b>", "<b>新能力</b>的完整判斷。"]}]}, {"t": "04｜納許均衡：沒有人願意單方面改變的局", "p": 110, "s": [{"t": "導言", "p": 110, "x": ["<b>納許均衡不是「最好的結果」，而是「在別人都不改變的前提下，任何一方都沒有動機單獨改變策略」的穩定狀態。</b>", "這個概念非常重要。", "因為現實世界裡，很多最難改變的問題，並不是沒有人知道現在很糟。", "而是：", "<b>每個人都知道很糟，但誰先改，誰可能先吃虧。</b>", "於是所有人一起停在一個低品質、低效率、甚至高內耗的穩定狀態。", "這就是納許均衡真正可怕的地方。", "它告訴我們：", "<b>穩定，不等於合理。</b>", "<b>穩定，不等於幸福。</b>", "<b>穩定，更不等於最佳。</b>"]}, {"t": "1. 什麼叫納許均衡？", "p": 111, "x": ["先用最簡單的方式理解。", "假設有兩個人：", "A 與 B。", "A 的最佳選擇，取決於 B 怎麼做。", "B 的最佳選擇，也取決於 A 怎麼做。", "如果最後來到一個狀態：", "A 看著 B 的選擇，覺得自己現在這個策略已經是最好的。", "B 看著 A 的選擇，也覺得自己現在這個策略已經是最好的。", "那麼這個狀態就是納許均衡。", "更精確地說：", "<b>在其他玩家策略固定不變時，任何一個玩家單獨改變自己的策略，都不會讓自己變得更好。</b>", "所以沒有人想先動。", "整個系統就穩定下來。", "例如兩家店都決定降價。", "A 想：", "如果 B 維持低價，而我自己漲價，客人會跑掉。", "所以我不能漲。", "B 也想：", "如果 A 維持低價，而我自己漲價，我也會失去客戶。", "所以 B 也不能漲。", "最後兩家公司都知道：", "價格太低。", "利潤太差。", "大家都不好過。", "但只要對方不先改，", "自己就不敢先改。", "於是：", "<b>低價競爭成為穩定狀態。</b>", "這就是一種納許均衡。", "不是因為大家喜歡。", "而是因為：", "<b>誰先離開這個狀態，誰可能先受傷。</b>"]}, {"t": "2. 最佳反應：納許均衡真正的核心", "p": 113, "x": ["要理解納許均衡，先要理解一個更基礎的概念：", "<b>最佳反應。</b>", "所謂最佳反應，就是：", "<b>在別人已經做出某個選擇的情況下，我最適合採取什麼策略？</b>", "例如兩家公司 A 與 B。", "B 如果定高價，", "A 可能選擇稍微降價，搶走市場。", "B 如果定低價，A 可能也被迫降價。", "所以 A 的策略不是固定的。", "它會根據 B 的策略改變。", "這就叫：", "<b>最佳反應函數。</b>", "B 也一樣。", "所以一場博弈裡，不是只有：", "A 的策略。", "B 的策略。", "而是：", "<b>A 對 B 的最佳反應，與 B 對 A 的最佳反應。</b>", "當兩邊的最佳反應剛好交會，納許均衡就出現了。", "這是一個非常重要的升維。", "因為我們平常太習慣問：", "哪一個策略最好？", "但博弈論會說：", "沒有脫離對方行為的「最好」。", "更精確的問題應該是：", "<b>在對方採取某個策略時，我的最佳反應是什麼？</b>", "這就是策略世界和單人決策最大的不同。"]}, {"t": "3. 優勢策略：不管別人怎麼選，我都比較想這樣做", "p": 115, "x": ["有些博弈裡，玩家會存在一種非常強的策略：", "<b>不論別人怎麼做，這個策略對我都比較好。</b>", "這叫：", "<b>優勢策略。</b>", "例如假設某個市場裡，不管對手高價或低價，我降價都能得到更高短期收益。", "那麼：", "降價就是我的優勢策略。", "如果兩家公司都有同樣結構，最後兩家都會降價。", "這時候均衡非常容易形成。", "但問題來了。", "兩家都降價，可能比兩家都維持合理價格更差。", "也就是：", "<b>每一個人都選擇了對自己最合理的策略，最後卻得到集體較差的結果。</b>", "這正是囚徒困境背後的結構。", "所以這裡先建立一個非常重要的觀念：", "<b>個體最佳策略，不等於整體最佳結果。</b>", "反過來，有些策略不論別人怎麼選，都比另一個策略差。", "這叫：", "<b>劣勢策略。</b>", "如果一個策略在所有情況下都更差，就可以先排除。", "這是一種非常實用的壓縮方法。", "因為很多複雜博弈，不需要一開始就算全部。", "先問：", "<b>有沒有明顯被支配的策略？</b>", "如果有，先拿掉。", "策略空間立刻縮小。"]}, {"t": "4. 均衡不等於最優：這是整章最重要的一句話", "p": 118, "x": ["很多人第一次聽到「均衡」，容易聯想到：", "平衡。", "穩定。", "合理。", "最佳狀態。", "但在博弈論裡，完全不是這個意思。", "納許均衡只表示：", "<b>任何人單獨改變，都不會讓自己更好。</b>", "它沒有保證：", "大家都幸福。", "社會有效率。", "資源配置合理。", "總報酬最大。", "甚至沒有保證：", "這個結果不是災難。", "想像一個辦公室。", "所有人都加班到晚上十點。", "每個人都知道：", "這樣效率低。", "身體差。", "家庭受影響。", "公司也不一定真的得到更多產出。", "但如果你一個人每天六點準時走，其他人都留下來，主管可能覺得：", "你不夠投入。", "於是每個人都留下來。", "不是因為每個人真的想留下。", "而是因為：", "<b>當其他人都留下時，自己先走的成本太高。</b>", "最後形成：", "<b>全員過度加班。</b>", "這就是一個典型的低品質均衡。", "再例如社群平台。", "每個人都知道：", "過度追求流量會讓內容越來越誇張。", "但如果所有競爭者都用聳動標題，你一個人完全不用，可能先失去注意力。", "所以每個人都跟著做。", "最後整個資訊環境變差。", "這也是一種均衡。", "所以不要再問：", "為什麼大家明知道不好還不改？", "更精準的問題是：", "<b>如果他單獨改變，他會付出什麼成本？</b>", "這才是納許均衡真正的分析角度。"]}, {"t": "5. 低品質穩定：很多人生困境其實不是不知道，而是改不動", "p": 121, "x": ["這個概念放到人生，會變得非常有力量。", "很多關係不是不知道有問題。", "而是雙方都在等對方先改。", "A 想：", "如果我先示好，B 會不會覺得我認輸？", "B 也想：", "如果我先示好，A 會不會覺得我比較需要這段關係？", "於是雙方都不動。", "最後形成冷戰。", "沒有人喜歡冷戰。", "但冷戰卻可能非常穩定。", "一家公司裡也是一樣。", "部門 A 不願意分享資訊。", "因為它不相信部門 B。", "部門 B 因為拿不到資訊，也更不願意分享自己的資料。", "最後雙方都建立高牆。", "所有人都知道：", "資訊不流通讓公司變慢。", "但任何一方先開放，都害怕被利用。", "所以：", "<b>封閉成為均衡。</b>", "這就是一個非常重要的系統論觀點：", "<b>很多壞結果不是因為沒有人想改善，而是因為改善需要協同變動。</b>", "單點更新無法突破。", "因為整個結構會把那個更新拉回去。"]}, {"t": "6. 這就是為什麼「叫大家改變」通常沒有用", "p": 123, "x": ["如果問題是均衡問題，那麼只做心理勸導，效果通常有限。", "例如企業管理者說：", "「大家要多合作。」", "沒用。", "如果制度仍然獎勵：", "個人績效。", "搶功。", "隱藏資訊。", "內部競爭。", "那麼合作就不是最佳反應。", "再例如家庭裡說：", "「大家不要吵架。」", "也沒用。", "如果每一次退讓的人都被視為弱勢，那麼誰都不願意先退。", "所以真正的改革不是：", "<b>要求玩家做更高尚的事。</b>", "而是：", "<b>改變玩家的最佳反應。</b>", "這句話非常重要。", "如果你能改變：", "報酬。", "成本。", "資訊。", "順序。", "聲譽。", "退出條件。", "那麼原本合理的策略可能不再合理。", "新的均衡才可能出現。"]}, {"t": "7. 多重均衡：同一套規則，可能有不只一個穩定世界", "p": 125, "x": ["不是每場博弈都只有一個納許均衡。", "有些系統會存在：", "<b>多個均衡。</b>", "這時候，真正的問題變成：", "<b>系統最後會停在哪一個均衡？</b>", "例如兩個人約見面。", "有兩個地點：", "甲地。", "乙地。", "雙方最重要的不是去哪裡，而是：", "要在同一個地方。", "如果兩個人都去甲地，很好。", "兩個人都去乙地，也可以。", "但如果一個去甲、一個去乙，結果最差。", "這時候就有：", "兩個可能均衡。", "現實世界更複雜。", "例如一個社會可能形成：", "<b>高信任均衡。</b>", "大家相信多數人會守規則。", "所以自己也願意守規則。", "因為大家守規則，信任又被強化。", "形成：", "信任 → 合作 → 好結果 → 更高信任另一個社會可能形成：", "<b>低信任均衡。</b>", "大家認為別人會鑽漏洞。", "所以自己也開始防範。", "增加監控。", "提高交易成本。", "更多人開始規避制度。", "又進一步證明：", "「果然不能相信別人。」", "形成：", "不信任 → 防禦 → 摩擦 → 更差結果 → 更低信任兩個世界都可能穩定。", "差別非常大。", "這就是多重均衡真正重要的地方：", "<b>歷史、文化、初始條件與偶然事件，都可能把系統推向不同穩定狀態。</b>", "所以不是所有結果都能用：", "「人性就是這樣」", "來解釋。", "很多時候，人性沒變。", "<b>均衡變了。</b>"]}, {"t": "8. 協調問題：有時大家不是利益衝突，而是不知道別人會怎麼做", "p": 128, "x": ["這是一類非常重要的博弈。", "很多失敗不是因為利益對立。", "而是：", "<b>彼此無法協調。</b>", "例如一個新技術。", "所有人都覺得它可能很好。", "但企業不願投資，因為不知道客戶會不會採用。", "客戶不願使用，因為不知道企業會不會長期支持。", "開發者也不願投入，因為不知道使用者會不會增加。", "結果：", "大家都等。", "技術無法起飛。", "這不是誰反對誰。", "而是：", "<b>大家都在等待別人先形成臨界規模。</b>", "這種情況下，", "真正需要的可能不是說服，而是：", "建立標準。", "提供保證。", "降低早期成本。", "增加可見承諾。", "創造第一批使用者。", "也就是：", "<b>把系統推過翻轉點。</b>", "從複雜系統來看，這很接近：", "臨界轉換。", "當足夠多節點採取新策略之後，原本不穩定的新模式，會突然變成新的穩定模式。", "這就是：", "<b>從一個均衡跳到另一個均衡。</b>"]}, {"t": "9. 均衡切換：真正的改變不是修補，而是換一個穩定點", "p": 131, "x": ["這裡就進入高階問題。", "如果一個系統已經困在低品質納許均衡，怎麼辦？", "不能只叫一個人改。", "因為一個人改，會被舊結構懲罰。", "真正需要的是：", "<b>讓多個關鍵條件同時改變。</b>", "例如公司要從：", "部門競爭轉成：", "跨部門協作。", "不能只發一封信說：", "「從今天開始大家要合作。」", "而要同步調整：", "績效指標。", "獎酬制度。", "資訊共享。", "決策權。", "共同目標。", "責任邊界。", "如果這些一起改，玩家的最佳反應才會改。", "新的均衡才會建立。", "這也是為什麼真正的組織轉型那麼難。", "因為真正的改革不是換口號。", "而是：", "<b>重新設計均衡。</b>"]}, {"t": "10. 制度的功能，就是把好行為變成最佳反應", "p": 133, "x": ["這句話非常重要。", "一個好的制度，不應該建立在：", "所有人都無私。", "所有人都自律。", "所有人都高尚。", "這種假設上。", "好的制度應該做到：", "<b>即使每個人都有自己的利益，合理自利最後仍然會把系統推向較好的結果。</b>", "例如交通規則。", "不是期待每個駕駛都是聖人。", "而是透過：", "規則。", "號誌。", "罰則。", "道路設計。", "讓守規則成為合理策略。", "好的企業制度也一樣。", "不是每天宣導：", "「公司第一。」", "而是讓：", "員工利益。", "團隊利益。", "公司利益。", "盡量形成結構對齊。", "如果制度讓：", "欺瞞數據的人得到升遷。", "提供真實壞消息的人被懲罰。", "那麼公司最後一定會得到：", "漂亮數據。", "錯誤現實。", "這不是員工道德突然下降。", "而是：", "<b>系統把說謊變成了最佳反應。</b>", "這就是博弈論對治理最大的啟示之一：", "<b>你真正要管理的不是人的口號，而是人的策略誘因。</b>"]}, {"t": "11. 納許均衡也可能非常脆弱", "p": 135, "x": ["還有另一個常見誤解。", "均衡很穩定，不代表它永遠不會改。", "因為均衡通常依賴一組條件。", "例如：", "價格。", "資訊。", "信任。", "成本。", "技術。", "規則。", "人口結構。", "只要其中關鍵條件改變，原本的最佳反應也可能跟著改變。", "那麼舊均衡就會崩掉。", "例如傳統零售市場。", "在電子商務出現以前，實體店的地理位置可能是一個穩定優勢。", "消費者選擇有限。", "零售商形成一套穩定競爭結構。", "但電商出現後，搜尋成本下降。", "價格透明度提高。", "物流改善。", "原本的均衡被破壞。", "新的均衡重新形成。", "所以從《易經》的變化視角來看：", "<b>任何均衡，都只是特定條件下的暫時穩定。</b>", "均衡不是終局。", "它只是：", "<b>一個當下可維持的狀態。</b>", "條件變，局就變。"]}, {"t": "12. 從控制論看：均衡其實是回饋迴路的固定點", "p": 137, "x": ["從控制論角度，納許均衡可以理解成：", "多個玩家透過反覆回應，", "最後停在一個彼此策略不再需要單獨修正的位置。", "可以簡化成：", "A 行動↓B 反應↓A 再調整↓B 再調整↓最後進入穩定狀態這個穩定狀態，就是某種策略固定點。", "但如果這個固定點品質很差，問題就不是：", "如何讓系統更穩。", "而是：", "<b>如何讓系統離開這個固定點？</b>", "這就變成控制問題。", "需要加入新的：", "外部擾動。", "規則改變。", "誘因改變。", "資訊改變。", "資源改變。", "讓原本的回饋迴路失去穩定性。", "然後引導系統進入新的狀態。", "這也就是為什麼：", "<b>有時候適度的不穩定，反而是更新的必要條件。</b>", "一個完全被鎖死的壞均衡，比短期混亂更危險。", "因為它沒有更新能力。"]}, {"t": "13. 從《孫子兵法》看：不是每次都要在對方的最佳反應裡硬打", "p": 140, "x": ["這裡就會和《孫子兵法》真正接上。", "如果你知道對手在目前結構下的最佳反應，最低階的方法是：", "正面硬碰。", "更高階的方法是：", "<b>改變對手的選項。</b>", "例如讓某條路成本變高。", "讓另一條路變得更有吸引力。", "改變資訊。", "改變時間。", "改變位置。", "讓對方原來的最佳反應不再是最佳。", "這才是策略真正高階的地方。", "不是一直問：", "「他會怎麼做？」", "而是進一步問：", "<b>我能不能改變他的最佳反應函數？</b>", "一旦做到，你其實已經開始改寫均衡。"]}, {"t": "14. 從《鬼谷子》看：資訊本身就能改變均衡", "p": 141, "x": ["人的策略不是直接由現實決定。", "而是由：", "<b>他相信的現實</b>", "決定。", "所以資訊非常重要。", "如果對方相信：", "你一定會退出。", "他的策略是一種。", "如果他相信：", "你不可能退出。", "策略又是另一種。", "因此：", "資訊揭露。", "訊號。", "試探。", "承諾。", "可信度。", "都會影響對方的信念。", "而信念一變，最佳反應就可能改變。", "最佳反應一變，均衡也可能改變。", "這就是：", "<b>資訊 → 信念 → 策略 → 均衡</b>", "的完整鏈條。"]}, {"t": "15. 一套生活化的均衡診斷方法", "p": 143, "x": ["遇到一個長期卡住的問題，可以先問五個問題。", "<b>第一個：這個狀態是不是大家都不滿意？ </b>", "如果是，繼續。", "<b>第二個：為什麼沒有人先改？ </b>", "找出單邊改變的成本。", "<b>第三個：誰如果先動，會受到懲罰？ </b>", "這通常是均衡鎖定點。", "<b>第四個：哪個規則正在維持這個均衡？ </b>", "可能是：", "獎懲。", "資訊。", "聲譽。", "退出成本。", "權力結構。", "<b>第五個：要讓新均衡出現，哪些條件必須同時改？ </b>", "這才是真正的轉型設計。", "<b>總結｜真正難改的，不是錯誤，而是穩定的錯誤 </b>", "納許均衡最重要的智慧，不是那個數學名稱。", "而是讓我們看見：", "<b>很多問題之所以長期存在，不是因為沒有人知道它不好，而是因為它已經形成穩定結構。</b>", "每一個人單獨改，都可能更糟。", "所以大家一起留在原地。", "這就是：", "<b>穩定的錯誤。</b>", "也可以說是：", "<b>低品質均衡。</b>", "因此真正的改革，不是叫一個人勇敢。", "不是叫大家善良。", "也不是喊：", "「我們一起改變。」", "而是要找出：", "<b>什麼結構正在讓舊策略持續成為最佳反應。</b>", "然後改變它。", "從這個角度來看，成長不是：", "努力做更多。", "而是：", "<b>讓舊的最佳反應不再最佳。</b>", "組織轉型不是：", "換一個口號。", "而是：", "<b>重新設計報酬、資訊、權力與回饋，使新的合作模式成為新的穩定點。</b>", "自由也不是：", "想怎麼做就怎麼做。", "而是：", "<b>你有能力離開舊均衡，不再被舊結構綁架。</b>", "真正高階的智慧，不是讓一個壞系統運作得更穩。", "而是知道：", "<b>什麼時候應該打破舊穩定，讓系統重新進入流動。</b>", "因為只有能夠離開錯誤均衡的系統，才真正具有更新能力。", "而只有能夠更新的系統，才有可能從低品質穩定，走向更高品質的秩序。"]}]}, {"t": "05｜囚徒困境：為什麼理性的人，會共同製造愚蠢結果", "p": 147, "s": [{"t": "導言", "p": 147, "x": ["<b>囚徒困境真正重要的地方，不是「人會不會背叛」，而是它揭露了一個更深的結構：當每個人都只按照自己的局部最佳反應行動時，整個系統可能一起走向更差的結果。</b>", "這就是：", "<b>個體理性，不等於集體理性。</b>", "而且這種情況不是少數。", "家庭、公司、產業、社會、國際關係，都大量存在這種結構。", "每個人都覺得：", "「我這樣做最合理。」", "最後卻一起得到：", "「大家都不想要的結果。」", "這就是囚徒困境最值得理解的地方。"]}, {"t": "1. 囚徒困境到底在說什麼？", "p": 148, "x": ["先看最經典的結構。", "有兩個嫌疑人。", "A 與 B。", "兩人分開審訊，彼此無法溝通。", "每個人都有兩個選擇：", "<b>合作</b>，也就是不背叛對方。", "或是：", "<b>背叛</b>，也就是出賣對方。", "如果兩個人都合作，兩人都只受到較輕處罰。", "如果一方背叛、一方合作，背叛者可能得到最好結果，合作的人得到最差結果。", "如果兩個人都背叛，兩人都受到較重處罰。", "結果會出現一個非常奇怪的結構。", "對 A 來說：", "如果 B 合作，A 背叛比較有利。", "如果 B 背叛，A 還是背叛比較不吃虧。", "所以：", "<b>不論 B 怎麼做，A 都有動機背叛。</b>", "B 也是一樣。", "最後：", "兩人都背叛。", "可是問題來了。", "兩人都背叛的結果，其實比：", "兩人都合作更差。", "所以整個系統形成：", "<b>每一個人都做了對自己合理的選擇，結果所有人一起變差。</b>", "這就是囚徒困境。"]}, {"t": "2. 真正的核心不是背叛，而是報酬結構", "p": 150, "x": ["很多人第一次看到囚徒困境，會把它理解成：", "人性自私。", "人不可信。", "大家都會背叛。", "這樣理解太低維。", "真正的問題不在「人性」。", "而在：", "<b>報酬結構讓背叛成為每個人的最佳反應。</b>", "也就是說，即使兩個人都不是壞人，只要結構設計成這樣，", "理性行動仍然可能把他們推向差的結果。", "這非常重要。", "因為如果你把問題理解成：", "人性不好，解法就會變成：", "教育。", "道德。", "勸善。", "但如果問題其實是：", "報酬結構錯誤，真正解法就應該是：", "<b>改變誘因。</b>", "這就是博弈論比一般道德敘事更強的地方。", "它不先問：", "誰好？", "誰壞？", "它先問：", "<b>這個系統在獎勵什麼？</b>"]}, {"t": "3. 為什麼每個人都合理，結果卻不合理？", "p": 152, "x": ["因為個體看到的，是局部目標。", "系統承受的，卻是所有局部行動疊加後的結果。", "例如兩家公司打價格戰。", "A 想：", "如果我不降價，B 降價，我的客戶會流失。", "所以我要降。", "B 也一樣。", "最後：", "兩家公司都降價。", "市場價格下降。", "利潤下降。", "服務品質下降。", "研發投資下降。", "所有人都變得更辛苦。", "每家公司單獨看：", "降價很合理。", "但兩家公司一起看：", "降價造成整體利潤崩掉。", "這就是：", "<b>局部最佳，生成全局次佳。</b>", "從複雜系統來看，這是一個非常重要的現象。", "系統結果不是由任何一個人單獨設計。", "而是由大量局部最佳化疊加後湧現。", "所以：", "<b>全局愚蠢，不需要任何人是愚蠢的。</b>", "這句話非常重要。", "很多制度問題，就是這樣形成的。"]}, {"t": "4. 公共財：大家都想享受，卻沒有人想付成本", "p": 154, "x": ["囚徒困境在社會裡最常見的一個形式，就是公共財問題。", "什麼叫公共財？", "簡單說：", "很多人都可以享受，但個人未必願意單獨承擔成本。", "例如：", "乾淨環境。", "公共安全。", "知識共享。", "團隊協作。", "基礎建設。", "公共衛生。", "每個人都希望這些東西存在。", "但問題是：", "如果我不出力，其他人出力，我可能還是可以享受成果。", "於是個體就會出現誘惑：", "<b>讓別人付成本，我來享受。</b>", "這就叫：", "<b>搭便車。</b>", "例如一個十人團隊。", "如果大家都願意分享資料，整體效率很高。", "但分享資料需要花時間整理。", "某個人可能想：", "別人都整理就好了。", "我直接拿來用。", "如果只有一個人這樣做，系統可能還能運作。", "但如果每個人都這樣想，最後：", "沒有人整理。", "資料失去品質。", "整個系統崩潰。", "這就是典型的：", "<b>公共財困境。</b>"]}, {"t": "5. 搭便車：不是單純懶惰，而是誘因錯位", "p": 156, "x": ["搭便車很容易被道德化。", "大家會說：", "這個人只想佔便宜。", "但博弈論會再往下問：", "<b>為什麼搭便車在這個系統裡是合理策略？</b>", "如果一個人：", "不付成本，還能得到同樣收益，那麼從個人報酬角度看，搭便車很自然。", "所以真正的制度設計不是每天喊：", "「大家要有責任感。」", "而是要改變：", "<b>成本與收益的對應關係。</b>", "例如：", "有貢獻的人得到更高分配。", "沒有貢獻的人無法取得全部成果。", "貢獻可以被追蹤。", "聲譽會累積。", "未來合作機會與過去行為相關。", "這些都會改變策略。", "所以高階治理的核心是：", "<b>讓合作行為不再只是道德選擇，而是合理策略。</b>"]}, {"t": "6. 公地悲劇：每個人多拿一點，最後大家一起失去", "p": 158, "x": ["囚徒困境另一個非常重要的版本，叫做：", "<b>公地悲劇。</b>", "想像一塊公共牧場。", "每個牧民都可以放羊。", "對單一牧民來說：", "多放一隻羊，收益是自己的。", "但草地被多吃掉一點，成本卻由所有人共同承擔。", "所以每個人都有誘因：", "多放一隻。", "再多放一隻。", "最後所有人都這樣做。", "結果：", "草地退化。", "牧場崩潰。", "所有人都失去。", "這種結構在現代社會到處都是。", "例如：", "過度捕魚。", "過度開採地下水。", "空氣污染。", "塞車。", "公共資源濫用。", "企業內部過度消耗共享部門。", "甚至注意力市場也是。", "每個平台都希望多搶一點使用者注意力。", "最後：", "通知越來越多。", "內容越來越刺激。", "資訊越來越碎片化。", "整體注意力環境越來越差。", "每個平台都在做對自己合理的事。", "整個認知生態卻一起熵增。", "這就是公地悲劇真正深的地方：", "<b>當收益私有化、成本社會化時，系統很容易被過度消耗。</b>"]}, {"t": "7. 家庭裡的囚徒困境：誰都不想先示弱", "p": 160, "x": ["再看一個生活化例子。", "夫妻吵架。", "A 心裡想：", "如果我先道歉，B 會不會覺得我理虧？", "B 也想：", "如果我先低頭，A 以後會不會更不尊重我？", "所以兩個人都選：", "不先示好。", "結果：", "冷戰。", "兩個人都痛苦。", "兩個人都知道：", "如果彼此一起放下防衛，關係會好很多。", "但誰都不願意單方面先做。", "這就是典型囚徒困境。", "真正的問題不是：", "誰比較愛誰。", "而是：", "<b>先合作的人，承擔了被利用的風險。</b>", "只要這個風險很高，合作就很難穩定。", "所以改善關係不能只說：", "「你們要多體諒。」", "而要建立：", "安全機制。", "例如：", "先示弱不被攻擊。", "說真話不被羞辱。", "承認錯誤不被永久利用。", "只要這些條件建立，合作才會成為合理選擇。"]}, {"t": "8. 公司裡的囚徒困境：大家都知道合作比較好，卻還是藏資訊", "p": 163, "x": ["想像兩個部門：", "業務部與產品部。", "業務掌握客戶資訊。", "產品掌握技術資訊。", "如果雙方完整共享，公司會更有效率。", "但問題是：", "業務怕：", "分享客戶關係後，自己的不可替代性下降。", "產品怕：", "分享內部資訊後，被業務拿來施壓。", "所以雙方都開始保留。", "結果：", "業務拿不到技術限制。", "產品拿不到真實市場需求。", "最後：", "錯誤承諾增加。", "開發方向失真。", "客戶滿意度下降。", "公司一起受傷。", "這就是：", "<b>資訊囚徒困境。</b>", "每個部門都想保護自己。", "結果卻削弱整體。", "如果管理者只說：", "「大家要透明。」", "沒用。", "真正要處理的是：", "<b>為什麼透明對個體來說有風險？</b>", "只要這個風險不下降，", "透明就不會穩定。"]}, {"t": "9. 國際關係裡的囚徒困境：安全困境", "p": 165, "x": ["國際關係中有一個非常典型的結構：", "<b>安全困境。</b>", "A 國增加軍備。", "理由是：", "保護自己。", "B 國看到後，卻可能解讀成：", "威脅增加。", "所以 B 也增加軍備。", "A 又看到 B 增加。", "於是進一步擴軍。", "最後：", "雙方都花更多錢。", "雙方都更緊張。", "雙方可能反而更不安全。", "這是一個典型回饋迴路：", "A 防禦↓B 感受到威脅↓B 防禦↓A 感受到威脅↓再升級每一步對單一國家來說都可能合理。", "但整體卻進入：", "<b>軍備競賽。</b>", "這就是囚徒困境式結構。", "所以安全問題不能只看：", "對方做了什麼。", "還要看：", "<b>對方如何解讀我做了什麼。</b>", "這就開始進入：", "博弈論＋資訊＋預測模型。"]}, {"t": "10. 這就是為什麼「相信大家會合作」遠遠不夠", "p": 167, "x": ["合作如果只建立在善意上，非常脆弱。", "因為只要背叛一次能得到很大收益，而且沒有代價，合作就很容易崩潰。", "所以真正穩定的合作需要結構條件。", "至少包括：", "<b>可辨識行為。</b>", "大家知道誰合作、誰背叛。", "<b>可追蹤歷史。</b>", "過去行為會影響未來。", "<b>有未來互動。</b>", "不是一次性交易。", "<b>背叛有成本。</b>", "不能永遠佔便宜。", "<b>合作有回報。</b>", "不是只有付出。", "<b>存在修復機制。</b>", "一次錯誤不至於永久崩潰。", "這些條件越完整，合作越可能形成穩定均衡。"]}, {"t": "11. 一次博弈與重複博弈，結果會完全不同", "p": 168, "x": ["這裡非常重要。", "如果兩個人只交易一次，背叛的誘惑通常更大。", "因為：", "今天佔完便宜，明天不再見。", "但如果兩個人未來還要合作一百次，事情就不一樣。", "你今天背叛，可能失去：", "未來九十九次合作。", "於是：", "<b>未來開始具有約束力。</b>", "這叫：", "<b>未來的陰影。</b>", "所以合作不是單純來自善良。", "還可能來自：", "長期互動。", "聲譽。", "互惠。", "報復成本。", "失去未來機會。", "這些結構共同讓合作變得合理。", "這裡有一個非常重要的結論：", "<b>長期關係本身，就是一種控制機制。</b>", "因為未來會回饋今天的行為。"]}, {"t": "12. 聲譽其實是一種跨時間的報酬函數", "p": 170, "x": ["為什麼商業世界重視信用？", "因為聲譽會把：", "今天的行為連接到：", "未來的機會。", "如果一家公司一次欺騙客戶，短期可能多賺。", "但如果市場知道，", "它可能失去未來訂單。", "那麼背叛成本就被放大。", "所以聲譽的本質是：", "<b>把未來報酬加入今天的決策函數。</b>", "這非常重要。", "如果一個系統完全沒有記憶，背叛會很容易。", "如果一個系統有記憶，過去行為會塑造未來選項。", "那麼合作就更可能穩定。", "這就是：", "<b>系統記憶。</b>", "從控制論來看，沒有記憶的系統，很難形成長期穩定控制。"]}, {"t": "13. 真正高階的解法：不是要求合作，而是重設合作條件", "p": 172, "x": ["如果一個系統反覆掉進囚徒困境，不要只責怪人。", "真正要做的是找出：", "<b>為什麼背叛比合作更有利？</b>", "然後改變。", "可以從幾個方向下手。", "<b>第一個：改變報酬 </b>", "讓合作得到更多回報。", "<b>第二個：增加背叛成本 </b>", "讓短期佔便宜不再划算。", "<b>第三個：增加透明度 </b>", "降低資訊不對稱。", "<b>第四個：拉長時間尺度 </b>", "讓未來收益進入計算。", "<b>第五個：建立聲譽機制 </b>", "讓歷史行為被記住。", "<b>第六個：降低合作風險 </b>", "讓先合作的人不會立即被利用。", "<b>第七個：建立退出與懲罰機制 </b>", "背叛者不能無限利用合作系統。", "這就是：", "<b>把合作從道德要求，轉成結構合理。</b>"]}, {"t": "14. 從《鬼谷子》看：合作之前，先處理資訊與信任", "p": 173, "x": ["《鬼谷子》很重要的一個面向，就是：", "不要假設對方說什麼就等於真實意圖。", "要觀察：", "訊號。", "反應。", "一致性。", "利益。", "位置。", "這對囚徒困境非常重要。", "因為合作最大的問題之一，就是：", "<b>我不知道你會不會背叛。</b>", "所以合作不是一句：", "「相信我。」", "就能成立。", "真正穩定的合作，需要訊號。", "需要試探。", "需要小規模驗證。", "需要逐步增加承諾。", "這可以理解成：", "<b>先用低成本互動測試模型，再逐步擴大合作。</b>", "這和預測編碼完全可以接上。", "不是一次相信到底。", "而是：", "<b>預測 → 小規模合作 → 觀察誤差 → 更新信任。</b>"]}, {"t": "15. 從《孫子兵法》看：不要把自己逼進只能互相消耗的局", "p": 175, "x": ["《孫子兵法》如果只被理解成打仗技巧，會漏掉很重要的一層。", "真正高階的策略，往往不是：", "如何在消耗戰中贏。", "而是：", "<b>如何不要進入高成本的負和局。</b>", "如果可以：", "避開正面消耗。", "改變戰場。", "改變資源結構。", "讓對方失去進攻誘因。", "甚至不戰而達成目的。", "那就比：", "大家一起消耗高很多。", "所以從《孫子兵法》的角度看，囚徒困境真正重要的問題不是：", "誰先背叛？", "而是：", "<b>能不能重設局，使雙方不必靠背叛來保護自己？</b>", "這才是高階策略。"]}, {"t": "16. 從《易經》看：合作與背叛都不是固定人格，而是狀態轉換", "p": 177, "x": ["《易經》提供另一個重要視角。", "不要把人永久分類成：", "合作型。", "背叛型。", "因為人在不同狀態下，策略可能完全不同。", "當：", "資源充足。", "信任高。", "未來明確。", "合作可能穩定。", "但當：", "資源縮減。", "資訊混亂。", "未來不確定。", "退出成本提高。", "原本合作的人也可能轉向防禦。", "所以真正的問題不是：", "他到底是不是好人？", "而是：", "<b>現在的局，正在把他推向哪一種策略？</b>", "這就是狀態轉換。", "如果系統條件持續惡化，合作均衡可能崩潰，快速轉進：", "互相防禦。", "資訊封閉。", "短期自保。", "最後進入高熵狀態。", "所以系統治理的核心，就是提前看見：", "<b>合作結構何時開始失穩。</b>"]}, {"t": "17. 從複雜系統看：囚徒困境其實是一個熵增機制", "p": 179, "x": ["這裡可以把整章再升一層。", "當所有人都開始：", "保護自己。", "隱藏資訊。", "增加防禦。", "降低信任。", "減少合作。", "系統會發生什麼？", "交易成本上升。", "監督成本上升。", "資訊流下降。", "預測誤差增加。", "資源浪費增加。", "這就是：", "<b>系統熵上升。</b>", "所以很多組織衰退，不是某個人突然犯了大錯。", "而是大量微小的自保策略累積。", "每個人都多藏一點。", "多防一點。", "少合作一點。", "少相信一點。", "最後整個組織變得：", "慢。", "僵。", "貴。", "不透明。", "這就是囚徒困境式熵增。"]}, {"t": "18. 真正的逆熵不是要求犧牲，而是創造可信合作", "p": 181, "x": ["逆熵不是：", "大家無私。", "大家犧牲。", "大家奉獻。", "這些要求通常無法長期穩定。", "真正的逆熵結構是：", "<b>讓資訊流動、利益對齊、合作可驗證、背叛有成本、長期價值高於短期套利。</b>", "當這些條件出現，合作不需要靠英雄。", "它會成為系統自然傾向。", "這才是真正成熟的制度。"]}, {"t": "19. 一套實用的囚徒困境診斷法", "p": 181, "x": ["如果一個問題反覆內耗，", "可以先問七個問題。", "<b>第一個：每個人單獨看，現在的行動合理嗎？ </b>", "如果合理，但整體結果很差，高度可能存在囚徒困境。", "<b>第二個：如果一個人先合作，他會不會被利用？ </b>", "如果會，合作不穩定。", "<b>第三個：背叛的短期收益是不是很高？ </b>", "如果是，需要提高背叛成本。", "<b>第四個：未來互動重要嗎？ </b>", "如果不重要，合作更難。", "<b>第五個：過去行為會被記住嗎？ </b>", "如果不會，", "聲譽機制失效。", "<b>第六個：資訊是否透明？ </b>", "如果不透明，猜疑會放大。", "<b>第七個：能不能改變規則？ </b>", "如果可以，真正解法通常不在勸人，而在改制度。", "<b>總結｜真正的愚蠢，往往是由很多合理選擇共同生成的 </b>", "囚徒困境最重要的智慧，不是提醒你：", "「不要相信別人。」", "也不是：", "「人性都是自私的。」", "真正的結論是：", "<b>一個錯誤的結構，可以讓理性的人持續做出對自己合理、對整體有害的選擇。</b>", "這就是為什麼：", "好人也可能製造壞系統。", "聰明人也可能一起走向愚蠢結果。", "努力的人也可能一起把組織拖進內耗。", "問題不一定出在人。", "很多時候，問題出在：", "<b>誘因。</b>", "<b>資訊。</b>", "<b>時間尺度。</b>", "<b>信任結構。</b>", "<b>回饋機制。</b>", "所以真正高階的智慧不是一直要求：", "大家合作。", "而是建立一個系統，", "讓：", "<b>合作值得。</b>", "<b>背叛昂貴。</b>", "<b>長期比短期更重要。</b>", "<b>資訊可以被驗證。</b>", "<b>信任可以逐步生成。</b>", "這時候，合作才不再是一種道德賭博。", "而是一種結構穩定。", "從這個角度看，自由也不是：", "我永遠選擇最有利自己的策略。", "真正的自由是：", "<b>我有能力看見，某些「對自己有利」的策略，</b>", "<b>其實正在把所有人一起鎖進低品質均衡。</b>", "然後不再被這個舊模型綁架。", "真正的智慧，", "不是在囚徒困境裡背叛得更快。", "而是：", "<b>看懂囚徒困境。</b>", "<b>重設誘因。</b>", "<b>重建信任。</b>", "<b>改變規則。</b>", "最後讓整個系統，從互相防禦的高熵狀態，重新回到可以合作、可以流動、可以更新的結構。"]}]}, {"t": "06｜動態博弈：不要只看第一步，要看對方的下一步", "p": 187, "s": [{"t": "導言", "p": 187, "x": ["<b>真正的策略，不是判斷「我現在做什麼最好」，而是推演「我做完這一步之後，對方會怎麼動；他動完之後，我又剩下哪些選擇」。</b>", "這就是動態博弈。", "很多人做決策，只算第一步。", "我要不要降價？", "我要不要先表態？", "我要不要先進市場？", "我要不要先離職？", "我要不要先讓步？", "但只看第一步，通常不夠。", "因為只要對方會反應，現在的最佳策略就不能只看眼前報酬。", "你真正要看的，是：", "<b>整條策略路徑最後會走到哪裡。</b>"]}, {"t": "1. 靜態博弈看「同時選擇」，動態博弈看「選擇順序」", "p": 188, "x": ["前面幾章談到的很多例子，可以先把玩家想像成同時做決定。", "A 不知道 B 此刻會怎麼選。", "B 也不知道 A 此刻會怎麼選。", "這比較接近靜態博弈。", "但真實世界大量存在另一種結構：", "<b>有人先動，有人後動。</b>", "而且後動者可以看到前面的行動。", "例如：", "一家公司先宣布進入新市場。", "競爭者看到後再決定要不要跟進。", "父母先提出規則。", "孩子再決定配合、拖延還是反抗。", "一方先提出談判條件。", "另一方再選擇接受、還價或離開。", "企業先投資。", "市場、競爭者、供應商再反應。", "這時候，行動順序本身就成為資訊。", "所以問題不能只寫成：", "A 選什麼？", "B 選什麼？", "而要變成：", "<b>A 先做什麼？ </b>", "<b>B 看見之後怎麼反應？ </b>", "<b>A 預先知道 B 會反應，又應該怎麼選？</b>", "這就是動態博弈。"]}, {"t": "2. 最典型的錯誤：只算自己，不算別人的最佳反應", "p": 189, "x": ["假設一家公司發現：", "如果降價 10％，短期可以搶走更多客戶。", "只看第一步：", "降價似乎很好。", "但真正的問題是：", "競爭者會不會跟？", "如果對手也降價 10％，原本的市占優勢可能消失。", "如果對手降 15％，你甚至可能被迫再降。", "所以真正的路徑不是：", "我降價 → 銷量增加。", "而是：", "我降價↓對手觀察↓對手反制↓我再次調整", "↓市場進入新均衡因此：", "<b>第一步看起來有利，不代表整條路徑有利。</b>", "這是動態博弈最基本的原理。"]}, {"t": "3. 博弈樹：把未來可能路徑展開", "p": 191, "x": ["動態博弈最重要的工具之一，就是：", "<b>博弈樹。</b>", "不要被名字嚇到。", "它其實很簡單。", "想像一個樹狀分叉。", "第一個節點：", "你先做選擇。", "例如：", "進入市場。", "不進入市場。", "如果你進入，競爭者又有兩個選擇：", "打價格戰。", "不打價格戰。", "如果對手打價格戰，你又可以：", "繼續。", "退出。", "如果對手不打，你可能：", "擴大投資。", "維持規模。", "整個局，就變成一條一條可能路徑。", "真正重要的是：", "<b>每一條路徑，都有不同的最終結果。</b>", "所以分析動態博弈時，", "不能只看第一個節點。", "要一路往後看到：", "<b>終點。</b>"]}, {"t": "4. 逆向歸納：不要從現在往前猜，要從終點往回算", "p": 193, "x": ["這是動態博弈最核心的技術之一。", "叫做：", "<b>逆向歸納。</b>", "簡單說：", "<b>先看最後一步的人會怎麼選，再往前推前一步的人應該怎麼做。</b>", "這個方法非常強。", "因為很多人習慣：", "從現在往未來想。", "但動態博弈常常更適合：", "從未來往現在推。", "假設 A 公司想進入一個市場。", "市場裡已經有 B 公司。", "如果 A 進入，B 可以選：", "發動價格戰。", "接受競爭。", "表面看起來，B 可能會威脅：", "「你敢進來，我一定打到底。」", "A 如果只聽這句話，可能被嚇退。", "但逆向歸納會問：", "<b>如果 A 真的已經進來了，到那時候 B 還願不願意打價格戰？</b>", "如果價格戰會讓 B 自己也虧很多，那麼等 A 真的進入之後，", "B 可能反而選擇：", "接受競爭。", "這時候 A 就會知道：", "B 現在的威脅可能不可信。", "所以 A 仍然選擇進入。", "這就是逆向歸納。"]}, {"t": "5. 真正的推演不是猜個性，而是算未來誘因", "p": 195, "x": ["這裡非常重要。", "低階推演會問：", "他狠不狠？", "他會不會報復？", "他是不是很愛面子？", "這些因素有時重要。", "但真正穩定的分析應該先看：", "<b>到了那個時間點，他的最佳反應是什麼？</b>", "因為很多今天的威脅，", "到了明天並不符合利益。", "很多今天的承諾，到了未來也未必還值得履行。", "所以真正的推演，不是靠想像對方人格。", "而是看：", "<b>到了那個節點，他的報酬結構是否改變。</b>", "例如：", "一家公司現在說：", "「我們絕對不會降價。」", "這句話沒有什麼意義。", "真正要問的是：", "如果競爭者降價 20％，到時候它還有沒有能力維持原價？", "如果維持原價會失去大量客戶，那麼它到時候就可能改變策略。", "所以：", "<b>未來行為取決於未來誘因。</b>", "而不是今天說過什麼。"]}, {"t": "6. 子博弈：每走一步，都會進入一個新的局", "p": 197, "x": ["動態博弈的一個重要觀念叫：", "<b>子博弈。</b>", "意思是：", "一個大型博弈走到某個節點後，後面剩下的那一段，本身又可以被當成一個新的博弈。", "例如：", "你先選擇是否創業。", "如果不創業，這個局結束。", "如果創業，下一個局開始：", "要不要募資？", "如果募資，又出現新局：", "接受哪個投資人？", "如果接受某個投資人，又出現：", "是否接受控制權條件？", "所以人生不是一個單一決策。", "而是：", "<b>決策進入新的狀態，再生成下一場博弈。</b>", "這非常接近《易經》的狀態轉換觀。", "每一步，不只是得到一個結果。", "更重要的是：", "<b>它改變了下一步的策略空間。</b>"]}, {"t": "7. 所以真正重要的不是「這一步賺多少」，而是「下一步剩什麼」", "p": 198, "x": ["這是動態決策裡非常重要的一個觀念。", "有些選擇短期收益很高，但會摧毀未來選項。", "例如：", "今天為了多拿一點利益，公開羞辱合作夥伴。", "短期可能贏了談判。", "但長期可能失去合作。", "所以今天的報酬增加，未來策略空間卻縮小。", "這未必是好決策。", "反過來，有些策略短期看起來吃虧，卻保留很多未來選項。", "例如：", "先小規模試合作。", "不一次押上全部資源。", "讓雙方都有退出空間。", "這可能短期比較慢。", "但保留：", "調整。", "修正。", "退出。", "升級合作。", "的選擇。", "這其實是在保存：", "<b>選項價值。</b>", "所以高階動態決策要問：", "<b>這一步會讓下一步更自由，還是更被鎖死？</b>", "這個問題非常重要。"]}, {"t": "8. 先行者優勢：先動可以改變別人的選擇", "p": 200, "x": ["有些時候，", "先動是一種優勢。", "因為先動者可以：", "占據位置。", "建立標準。", "取得資源。", "鎖定客戶。", "形成品牌。", "建立網絡。", "提高後來者進入成本。", "這叫：", "<b>先行者優勢。</b>", "例如一家公司先建立平台。", "使用者越多，開發者越多。", "開發者越多，使用者又越多。", "這形成網絡效應。", "後來者即使產品很好，也可能很難進入。", "所以先動不是只多拿一點時間。", "而是：", "<b>先動者可能改變後來者的整個博弈結構。</b>", "這就是動態博弈裡非常重要的：", "<b>路徑依賴。</b>", "早期小優勢，可能透過正回饋，變成後期巨大優勢。"]}, {"t": "9. 但先動不一定比較好：後動者也有資訊優勢", "p": 202, "x": ["不要把「先下手為強」當成永遠成立。", "後動也有優勢。", "因為後動者可以觀察：", "市場真正需求。", "先行者犯的錯。", "技術缺陷。", "客戶反應。", "成本結構。", "監管變化。", "所以先行者支付了：", "<b>探索成本。</b>", "後動者可以利用已經出現的資訊，降低預測誤差。", "例如新產品市場。", "第一家公司投入大量成本教育市場。", "第二家公司進來時，已經知道：", "使用者真正要什麼。", "什麼功能沒用。", "哪個價格可以接受。", "這時候後進反而可能有優勢。", "所以不能簡化成：", "先動＝好。", "真正要問：", "<b>這個市場裡，位置優勢重要，還是資訊優勢重要？</b>", "如果網絡效應、規模效應很強，先動可能重要。", "如果技術快速更新、需求高度不確定，後動可能更有利。", "這才是動態分析。"]}, {"t": "10. 承諾：有時候限制自己，反而可以改變對方策略", "p": 204, "x": ["這是一個非常違反直覺的概念。", "一般人覺得：", "選擇越多越自由。", "但在博弈裡，有時：", "<b>主動限制自己的選擇，反而可以增加策略力量。</b>", "例如談判。", "如果對方知道：", "你隨時可以再退，他就會繼續要求你退。", "但如果你已經公開承諾：", "「這是最後底線。」", "而且真的建立了無法輕易更改的機制，對方的判斷就會改變。", "這就是：", "<b>策略承諾。</b>", "承諾的本質是：", "<b>改變對方對你未來行動的預測。</b>", "只要對方相信：", "你真的不能再退，他就必須重新計算。", "所以有時候，真正的力量不是：", "我有一百個選項。", "而是：", "<b>我讓對方知道，某些選項已經被我自己關掉。</b>", "這就是策略性自我約束。"]}, {"t": "11. 為什麼「破釜沉舟」有時有效？", "p": 206, "x": ["這就是承諾機制的極端版本。", "如果一個人還有很多退路，對手可能判斷：", "壓力再大一點，他就會退出。", "但如果退路被切斷，對方可能重新評估：", "這個人真的會打到底。", "於是對手的最佳反應改變。", "但這裡一定要注意：", "<b>自我約束不是永遠高明。</b>", "如果把退路全部切掉，而你的模型判斷錯誤，損失可能非常大。", "所以高階策略不是鼓吹：", "孤注一擲。", "而是理解：", "<b>不可逆承諾會提高可信度，也同時降低更新能力。</b>", "這是一個非常重要的交換。", "承諾越強，彈性越低。", "所以必須平衡：", "<b>可信度</b>", "與<b>可更新性。</b>"]}, {"t": "12. 威脅：真正有用的威脅，必須在未來仍然合理", "p": 208, "x": ["現在看另一個概念：", "<b>威脅。</b>", "例如公司對競爭者說：", "「你進市場，我就價格戰到底。」", "這聽起來很強。", "但如果真正發生後，價格戰會讓自己損失巨大，", "那麼這個威脅可能沒有可信度。", "所以真正的威脅不是：", "聲音大。", "而是：", "<b>到了未來節點，執行威脅仍然符合自己的利益。</b>", "只有這樣，對方才會相信。", "如果想讓威脅可信，就可能需要提前改變結構。", "例如：", "先準備大量現金。", "先簽長期供應合約。", "先建立成本優勢。", "讓未來打價格戰真的有能力承受。", "這時候：", "威脅才從語言，變成結構。", "所以：", "<b>真正有力量的不是話，而是讓話背後的未來誘因變得可信。</b>"]}, {"t": "13. 子博弈完美均衡：把「空話」從策略中排除", "p": 210, "x": ["動態博弈裡有一個重要概念：", "<b>子博弈完美均衡。</b>", "它比一般納許均衡要求更高。", "簡單說：", "<b>不只整體策略看起來合理，而且走到每一個可能節點時，後續行動都必須真的合理。</b>", "它的價值就是：", "排除很多不可信的威脅。", "例如：", "A 說：", "「如果你進來，我一定犧牲自己也把你打死。」", "如果真的走到那個節點，A 明明不會這樣做，那這個威脅就不符合子博弈完美。", "所以從一開始，B 就不應該被這句話嚇住。", "這個概念放到人生非常實用。", "不要只聽：", "對方今天怎麼說。", "要問：", "<b>如果事情真的走到那一步，他還有動機照做嗎？</b>", "這比判斷語氣更重要。"]}, {"t": "14. 家庭中的動態博弈：一次退讓會不會改變下一輪規則？", "p": 212, "x": ["家庭裡也充滿動態博弈。", "例如孩子要求買玩具。", "父母先說：", "不行。", "孩子開始哭。", "父母最後讓步。", "短期結果是：", "孩子停止哭鬧。", "父母得到安靜。", "看起來問題解決。", "但下一輪呢？", "孩子學到：", "哭鬧 → 父母改變決定。", "所以這次讓步，不只是解決今天。", "它還改變了：", "<b>明天的博弈規則。</b>", "下一次孩子更可能哭。", "父母也更難守住規則。", "這就是動態博弈非常重要的一點：", "<b>每一次行動，同時也是對未來行為的訓練。</b>", "今天怎麼回應，會影響明天對方怎麼預測你。", "所以不要只看：", "現在能不能把事情處理掉。", "還要看：", "<b>這次處理方式，在訓練什麼未來策略？</b>"]}, {"t": "15. 企業治理也是一樣：今天的獎勵，就是明天的策略訊號", "p": 214, "x": ["例如一個員工為了達成業績，隱瞞風險。", "最後業績很好。", "公司不但沒有處罰，反而升遷。", "那麼整個組織會學到：", "隱瞞風險，是有效策略。", "下次更多人會模仿。", "所以管理者每一次：", "升遷。", "獎勵。", "懲罰。", "放過。", "都不只是處理一個人。", "而是在向整個系統發出：", "<b>策略訊號。</b>", "這就是為什麼治理不能只看：", "這次事件怎麼收尾。", "而要看：", "<b>這個處理方式會把組織帶進哪個未來均衡？</b>", "這就是動態博弈視角。"]}, {"t": "16. 從《孫子兵法》看：真正的高手不是多算一步，而是控制後續路徑", "p": 215, "x": ["《孫子兵法》的策略價值，很大一部分就在於：", "不是只看正面一次交鋒。", "而是看：", "勢。", "位置。", "資源。", "時機。", "可進可退。", "對手的反應空間。", "真正高階的策略不是：", "「我這一招多厲害。」", "而是：", "<b>我這一步下去之後，對手還剩什麼路？</b>", "如果你的策略能：", "縮小對方選項。", "提高對方某些行動成本。", "讓他自己走向你希望的路徑。", "那就比單純打贏一次更高階。", "所以真正的策略控制，不是控制別人的意志。", "而是：", "<b>控制策略空間。</b>", "這是非常重要的。"]}, {"t": "17. 從《鬼谷子》看：資訊會改變每一個節點的反應", "p": 217, "x": ["動態博弈不是只有行動序列。", "還有：", "<b>資訊序列。</b>", "例如你先發出某個訊號。", "對方根據這個訊號更新信念。", "再做選擇。", "所以：", "行動前的資訊，會改變行動後的路徑。", "例如談判。", "你如果一開始就暴露：", "自己很急。", "對方下一步可能更強硬。", "如果你讓對方相信：", "你有替代方案。", "他的報價可能改變。", "所以《鬼谷子》處理的：", "試探。", "隱藏。", "揭露。", "觀察。", "其實都會直接改變：", "<b>博弈樹上每個節點的機率與選擇。</b>", "這裡非常關鍵。", "動態博弈不是：", "行動 → 行動。", "而是：", "<b>資訊 → 信念 → 行動 → 新資訊 → 新信念→ 新行動。</b>", "這才是真實世界。"]}, {"t": "18. 從《易經》看：每一步都在改變狀態空間", "p": 219, "x": ["《易經》的價值在這裡更加清楚。", "它不是只問：", "現在是什麼狀態。", "更重要的是：", "<b>這個狀態往下一個狀態轉換時，條件有沒有改變？</b>", "在動態博弈裡，每一次行動都會：", "改變資源。", "改變關係。", "改變資訊。", "改變位置。", "改變信任。", "改變可行選項。", "所以：", "<b>每走一步，原本的局就已經不存在。</b>", "這就是為什麼不能用舊模型一直算新世界。", "模型必須更新。"]}, {"t": "19. 從控制論看：動態博弈其實是多主體閉迴路控制", "p": 220, "x": ["如果從控制論來看，動態博弈非常像多個控制器互相耦合。", "A 有目標。", "B 也有目標。", "A 行動。", "B 把 A 的行動當成輸入。", "B 再行動。", "A 又把 B 的反應當成回饋。", "形成：", "A 行動→ B 接收→ B 修正→ B 行動→ A 接收→ A 修正這是一個：", "<b>多主體閉迴路。</b>", "問題就在於：", "每個人都在控制環境。", "而環境裡，又有其他控制器。", "所以整個系統具有：", "高度非線性。", "回饋。", "延遲。", "誤差累積。", "策略共演化。", "這就是動態博弈真正複雜的原因。"]}, {"t": "20. 真正的高階推演：不是算無限步，而是找關鍵節點", "p": 222, "x": ["這裡也要避免另一個錯誤。", "有些人學到博弈後，開始想：", "我要算十步。", "二十步。", "一百步。", "這不現實。", "因為真實世界資訊不完整。", "計算也有限。", "所以高階推演不是：", "預測所有未來。", "而是找出：", "<b>哪些節點會真正改變後續結構。</b>", "例如：", "是否進入市場。", "是否公開承諾。", "是否接受第一輪讓步。", "是否切斷退路。", "是否公開底牌。", "是否簽長約。", "這些是：", "<b>關鍵節點。</b>", "一旦跨過，後面的策略空間會大幅改變。", "所以真正要花精力的是：", "<b>翻轉點。</b>", "不是每一小步。"]}, {"t": "21. 一套實用的動態博弈推演法", "p": 223, "x": ["遇到重要決策，可以先做七步。", "<b>第一步：誰先動？ </b>", "先確定順序。", "<b>第二步：每一步有哪些可行選項？ </b>", "建立博弈樹。", "<b>第三步：如果走到最後一層，最後行動者會怎麼選？ </b>", "先算終點。", "<b>第四步：從終點往前推 </b>", "使用逆向歸納。", "<b>第五步：檢查威脅與承諾是否可信 </b>", "不要被空話干擾。", "<b>第六步：找出不可逆節點 </b>", "哪些行動一旦做了，無法輕易回頭？", "<b>第七步：保留更新空間 </b>", "如果資訊不足，不要過早把自己鎖死。", "<b>總結｜真正的策略，不是走一步，而是看這一步會生成什麼下一步 </b>", "動態博弈最重要的智慧是：", "<b>你的每一次行動，都不只是得到一個結果，而是在改變下一輪的策略空間。</b>", "所以真正高階的決策不能只問：", "這一步有沒有利？", "而要問：", "<b>對方會怎麼反應？</b>", "<b>他的反應是否符合未來誘因？</b>", "<b>我這一步會不會把自己鎖死？</b>", "<b>這個承諾是否可信？</b>", "<b>這次退讓會不會改變未來規則？</b>", "<b>這個選擇會增加還是減少未來自由？</b>", "這就是從靜態決策，進入動態決策的真正分界。", "《易經》告訴我們：", "<b>狀態會變。</b>", "《鬼谷子》提醒：", "<b>資訊會改變人的信念。</b>", "《孫子兵法》處理：", "<b>如何改變位置、資源與對手選項。</b>", "博弈論則把它們進一步形式化成：", "<b>行動 → 反應 → 再行動 → 狀態轉換 → 新博弈。</b>", "真正的智慧不是永遠比別人多算三步。", "而是知道：", "<b>哪一步會改變整個後續結構。</b>", "真正的自由也不是永遠保留所有選項。", "而是懂得：", "<b>什麼時候應該承諾，什麼時候必須保留彈性，</b>", "<b>什麼時候不能讓自己過早進入不可逆狀態。</b>", "因為真正成熟的策略，從來不是只贏眼前這一步。", "而是讓今天的選擇，為明天留下更好的局。"]}]}, {"t": "07｜威脅、承諾與可信度：真正有力量的，不是你說什麼，而是別人是否相信你會做到", "p": 228, "s": [{"t": "導言", "p": 228, "x": ["<b>在博弈裡，語言本身幾乎沒有力量。真正有力量的是：對方相信，當未來真的走到那個節點時，你仍然有動機照你現在說的去做。</b>", "這就是：", "<b>可信度。</b>", "你可以說：", "「這是我的底線。」", "「你再降價，我就退出。」", "「你敢進市場，我一定跟你打到底。」", "「下次再犯，我一定處理。」", "但真正的問題從來不是：", "你現在講得多堅定。", "而是：", "<b>等事情真的發生，你還會不會這樣做？</b>", "如果答案是否定的，那麼再強硬的威脅，都只是噪音。", "如果答案是肯定的，甚至不需要說太多，對方也會重新計算。"]}, {"t": "1. 博弈世界裡，威脅不是情緒，而是一個未來行動函數", "p": 229, "x": ["很多人把威脅理解成：", "說狠話。", "提高音量。", "表現強勢。", "但博弈論不是這樣看。", "真正的威脅是一個條件式策略：", "<b>如果你做 X，我就做 Y。</b>", "例如：", "如果你降價，我就跟進。", "如果你違約，我就停止合作。", "如果你進入市場，我就擴大產能。", "如果你再遲交，我就換供應商。", "所以威脅的本質不是：", "情緒。", "而是：", "<b>條件 → 反應。</b>", "這就像控制系統裡的規則：", "如果誤差超過某個值，系統執行修正。", "但還少一個關鍵。", "不是所有「如果 X，我就 Y」都可信。", "因為真正到了 X 發生之後，Y 可能已經不再符合你的利益。", "所以判斷威脅，必須進一步問：", "<b>未來條件真的發生後，執行 Y 還是不是你的最佳反應？</b>", "如果不是，這個威脅就不可信。"]}, {"t": "2. 最典型的不可信威脅：我寧願自己一起死，也不讓你進來", "p": 231, "x": ["假設市場裡有一家既有公司 A。", "新公司 B 想進來。", "A 對 B 說：", "「你敢進來，我就立刻發動價格戰，打到你退出。」", "B 如果只聽表面，可能被嚇退。", "但真正的博弈分析要往後推。", "假設 B 已經真的進來了。", "這時 A 有兩個選擇：", "價格戰。", "或接受競爭。", "如果價格戰會讓 A 自己也損失巨大，而接受 B 存在反而還能維持利潤，那麼到了那一刻，A 最合理的策略可能不是打。", "也就是說：", "A 今天的威脅，到了明天並不符合 A 自己的利益。", "所以 B 如果看得夠遠，就會知道：", "<b>這只是一個不可信威脅。</b>", "這就是為什麼動態博弈裡，不能只聽：", "對方現在說什麼。", "要問：", "<b>到了那個節點，他還願不願意承擔代價？</b>", "這才是真正的可信度檢驗。"]}, {"t": "3. 可信威脅：到了未來，執行它仍然合理", "p": 233, "x": ["那什麼叫可信威脅？", "假設 A 公司說：", "「如果 B 進場，我會降價。」", "而且 A 本身：", "成本極低。", "現金充足。", "產能很大。", "短期虧損承受能力強。", "B 的成本則很高。", "那麼一旦 B 進場，A 降價真的可能是合理策略。", "這時候威脅就開始具有可信度。", "因為不是靠嘴。", "而是：", "<b>結構支持這個威脅。</b>", "所以威脅的可信度來自幾件事：", "你有沒有能力做？", "做了以後，你有沒有利益？", "你能不能承擔成本？", "對方知不知道你有能力？", "你有沒有過去紀錄？", "這些東西比語氣更重要。", "因此：", "<b>真正的威懾，不是讓對方怕你的情緒，而是讓對方相信你的未來反應是理性的。</b>"]}, {"t": "4. 承諾和威脅，是同一個結構的兩面", "p": 234, "x": ["威脅是：", "如果你做某件事，我會讓你付出代價。", "承諾則是：", "如果你做某件事，我會給你某種利益，或者我保證自己採取某種行動。", "例如：", "如果你完成目標，我給你獎金。", "如果你長期合作，我提供更好的條件。", "如果你現在投資，我承諾未來不任意改規則。", "兩者看似不同，但底層結構一樣：", "都是在嘗試改變對方現在的選擇。", "你現在說一句話，不是為了描述未來。", "而是希望：", "<b>對方相信你的未來行動，於是改變現在的決策。</b>", "所以承諾與威脅真正的核心都是：", "<b>可信度。</b>"]}, {"t": "5. 為什麼承諾最難？", "p": 236, "x": ["因為時間會改變誘因。", "這是整章最重要的一點之一。", "今天你可能真的有意願履行承諾。", "但等未來真的來到，你的利益可能已經變了。", "例如一家公司對投資人說：", "「只要你現在投資，我未來一定不稀釋你的權益。」", "但幾年後公司需要大量融資。", "這時候如果不增資，公司可能活不下去。", "於是原本的承諾，在新的狀態下變得難以維持。", "這就叫：", "<b>時間不一致問題。</b>", "今天看起來合理的承諾，到了未來，可能不再符合未來自己的利益。", "所以別人會問：", "<b>你現在說得很好，但我憑什麼相信未來的你？</b>", "這就是承諾問題。", "生活中也一樣。", "父母說：", "「下次再這樣，我一定不讓你玩手機。」", "但下次孩子真的哭鬧，父母覺得太麻煩，最後還是讓步。", "幾次之後，孩子學到：", "這個威脅不可信。", "於是規則失效。", "問題不是父母沒有說過。", "而是：", "<b>過去行為已經更新了孩子對父母的模型。</b>"]}, {"t": "6. 信用的本質：別人對你未來行為的預測模型", "p": 238, "x": ["這就開始接到預測編碼。", "所謂信用，其實可以理解成：", "<b>別人根據你過去行為，建立出的未來預測模型。</b>", "如果你十次承諾，九次做到，別人會提高：", "「你會做到」的機率。", "如果你十次說底線，", "最後十次都退，那麼對方會更新模型：", "你的底線只是起始報價。", "這就是信用形成。", "所以信用不是抽象道德。", "它是一種：", "<b>跨時間的可預測性。</b>", "這也解釋了：", "為什麼信用建立很慢，破壞卻很快。", "因為一個重大違約，可能讓對方重新估計：", "過去的穩定紀錄是否仍然代表未來。", "模型誤差突然變大，信任就會快速下降。", "所以從博弈角度看：", "<b>信用，就是你讓別人相信你的未來策略具有穩定性。</b>", "這是一種非常重要的策略資產。"]}, {"t": "7. 真正高階的承諾：不是「我保證」，而是讓自己未來也很難反悔", "p": 240, "x": ["如果光靠說話不夠，怎麼提高承諾可信度？", "答案是：", "<b>改變自己的未來策略空間。</b>", "這叫：", "<b>承諾裝置。</b>", "也就是設計一個機制，讓未來的自己：", "更難反悔。", "例如企業簽下長期合約。", "一旦違約，必須付出巨額賠償。", "這時候合作方就更相信：", "你不會輕易離開。", "為什麼？", "不是因為你比較善良。", "而是因為：", "<b>反悔成本變高了。</b>", "再例如一家公司公開宣布：", "某項政策三年不變。", "如果只是口頭宣布，可信度有限。", "如果進一步：", "寫進合約。", "建立第三方監督。", "設定違約補償。", "那麼承諾就變得更可信。", "這就是：", "<b>用結構約束未來的自己。</b>"]}, {"t": "8. 有時候，失去選擇反而增加力量", "p": 242, "x": ["這是一個很反直覺的博弈論智慧。", "一般人認為：", "選擇越多越有力量。", "但在某些博弈裡，選擇太多，反而讓你很難讓別人相信你。", "例如談判。", "如果對方知道：", "你其實什麼條件都可能接受，他就會持續壓價。", "因為他知道：", "你還能退。", "反過來，如果你真的被某個規則限制：", "低於某個價格不能成交。", "甚至你自己都無權改。", "那對方反而會知道：", "再壓也沒用。", "這時候你的談判位置可能變強。", "所以：", "<b>策略力量，有時來自可信的不可退讓性。</b>", "不是因為僵硬比較好。", "而是因為：", "對方的最佳反應改變了。"]}, {"t": "9. 但不可退讓也可能讓你自己被困死", "p": 243, "x": ["這裡一定要看到另一面。", "如果承諾裝置太強，也會降低更新能力。", "例如你為了表示決心，宣布：", "「不論發生什麼，我都不改。」", "短期確實增加可信度。", "但如果外部環境發生重大改變，你卻無法修正，那就會變成：", "<b>被自己的承諾綁架。</b>", "這就是承諾與自由之間的矛盾。", "承諾需要：", "降低未來彈性。", "智慧卻需要：", "保留模型更新能力。", "所以真正高階的設計不是：", "永遠不可改。", "而是：", "<b>把什麼不能改、什麼可以改、什麼條件下可以重新談，先寫清楚。</b>", "這才是好的承諾機制。", "例如合約可以寫：", "一般情況不可提前終止。", "但如果遇到：", "重大法規變更。", "不可抗力。", "成本超過某個臨界值。", "則重新協商。", "這就同時保留：", "可信度。", "與更新能力。"]}, {"t": "10. 沉沒成本：不是因為花了錢就該繼續，而是它有時能成為可信訊號", "p": 246, "x": ["這裡要非常小心。", "決策科學會告訴我們：", "<b>沉沒成本不應該成為繼續投入的理由。</b>", "已經花掉而無法回收的成本，不應該決定現在要不要繼續。", "這是正確的。", "但在博弈裡，某些不可回收的投入，可能具有另一個作用：", "<b>提高承諾可信度。</b>", "例如一家公司為了進入某市場，先建立專用工廠。", "這筆投入可能無法輕易轉作其他用途。", "競爭者看到後就知道：", "這家公司已經投入大量不可逆成本。", "所以它未來退出的門檻更高。", "這會改變競爭者對它的預測。", "因此要分清楚兩件事：", "<b>決策問題 </b>", "已經花掉的錢，不能成為未來繼續投入的理由。", "<b>博弈訊號 </b>", "某些不可逆投入，可以讓別人相信：", "你真的準備長期留下。", "兩者不能混在一起。", "這就是：", "<b>沉沒成本本身不創造未來價值，但不可逆投入可能創造策略可信度。</b>"]}, {"t": "11. 「破釜沉舟」真正的博弈結構", "p": 248, "x": ["很多人喜歡引用：", "破釜沉舟。", "背水一戰。", "好像沒有退路，人就一定更強。", "其實不能這樣簡化。", "真正重要的是：", "<b>沒有退路，會不會改變對手的判斷？</b>", "如果對手知道：", "你現在不能退，那麼他可能相信：", "你會投入更高強度。", "於是他重新評估：", "繼續逼迫你的成本。", "這就是戰略效果。", "但如果對手根本看不到你的承諾，或者你切斷退路後，對方仍然比你更強，那只是降低自己的選擇。", "不一定產生任何戰略優勢。", "所以：", "<b>自我限制只有在能夠改變別人策略時，才具有博弈價值。</b>", "否則只是自我傷害。"]}, {"t": "12. 訊號：可信度常常來自「你願意付出什麼成本」", "p": 249, "x": ["假設兩家公司都說：", "「我們非常重視這個市場。」", "單靠說話，幾乎沒有辨識度。", "因為任何人都可以這樣講。", "但如果其中一家公司：", "投入工廠。", "簽長約。", "增加員工。", "建立服務中心。", "這些行動都有成本。", "所以訊號變得更可信。", "這就引出一個非常重要的原則：", "<b>廉價訊號，資訊量通常比較低；高成本訊號，</b>", "<b>可能更有辨識力。</b>", "當然，不是所有高成本行動都是真實訊號。", "浪費錢也可能只是錯誤。", "但如果某個成本只有真正有意願的人才願意承擔，它就可能形成：", "<b>分離訊號。</b>", "這會在後面的訊號博弈再深入處理。"]}, {"t": "13. 家庭裡最大的信用危機：規則說了，卻從不執行", "p": 251, "x": ["家庭治理裡，最常見的問題之一就是：", "規則不可信。", "例如父母一直說：", "「功課沒完成不能玩遊戲。」", "但孩子一哭，最後還是能玩。", "久而久之，孩子不再把規則當規則。", "而把它理解成：", "<b>談判起點。</b>", "這時候父母會覺得：", "孩子越來越不聽話。", "但從博弈論看，孩子只是根據過去回饋，更新了最有效策略。", "如果哭鬧十次有八次成功，哭鬧就是高報酬策略。", "問題不是孩子不懂規矩。", "而是：", "<b>系統真的在獎勵哭鬧。</b>", "所以真正要修正的不是再說一次：", "「我這次是認真的。」", "而是：", "讓行動和規則重新一致。", "信用不是靠更大聲建立。", "而是靠：", "<b>一致回饋。</b>"]}, {"t": "14. 企業管理也是一樣：沒有執行的制度，最後只剩儀式", "p": 253, "x": ["公司也常發生同樣問題。", "規章說：", "數據造假會嚴格處理。", "但如果某個業績冠軍造假，最後因為「他很重要」而被放過，整個公司得到的訊號不是：", "數據造假不可接受。", "而是：", "<b>只要業績夠好，規則可以談。</b>", "這時候，", "公司真正建立的新均衡是：", "成果比誠信更重要。", "所以管理者每次破例，都不是只處理單一事件。", "而是在更新整個組織對規則的信念。", "這就是：", "<b>制度信用。</b>", "制度之所以有效，不是因為寫在手冊。", "而是因為大家預測：", "如果違反，真的會發生某種後果。", "所以治理本質上也是博弈。"]}, {"t": "15. 談判中的底線：不是你說多少，而是你能不能離開", "p": 255, "x": ["這裡會進入談判最重要的一個結構。", "很多人說：", "「這是我的底線。」", "但真正的問題是：", "<b>如果對方不接受，你能不能真的離開？</b>", "如果不能，你的底線就很弱。", "例如一個人談薪水。", "他說：", "低於八萬元不接受。", "但他沒有其他工作。", "存款只剩一個月。", "又急著就業。", "那麼公司如果知道這些資訊，", "就可能判斷：", "他的退出威脅不可信。", "另一個人同樣說：", "低於八萬元不接受。", "但他：", "手上還有兩個 offer。", "有六個月現金。", "可以繼續找。", "那麼他的退出威脅可信度高很多。", "所以真正的談判權力不是音量。", "而是：", "<b>替代方案。</b>", "也就是你真的能不能離開。"]}, {"t": "16. 自由其實是一種可信的退出能力", "p": 256, "x": ["這裡可以把概念再升一層。", "很多時候，自由不是：", "我想去哪就去哪。", "而是：", "<b>當某個局變得不可接受時，我有能力退出。</b>", "如果你完全不能退出，對方就知道：", "你的威脅有很大一部分只是表演。", "例如：", "只有一個客戶。", "只有一個收入來源。", "只有一個供應商。", "只有一條職涯路徑。", "這些都會降低博弈中的自由。", "因為：", "<b>策略空間太窄。</b>", "所以真正高階的自由建構，不是等到談判那一天才強硬。", "而是平常就建立：", "替代收入。", "替代合作方。", "替代技能。", "替代供應商。", "替代路徑。", "讓自己永遠不被單一節點完全鎖死。", "這就是：", "<b>選項結構。</b>"]}, {"t": "17. 《鬼谷子》看的是：對方信什麼，比你說什麼更重要", "p": 258, "x": ["到了這裡，《鬼谷子》的位置非常清楚。", "很多人把說服理解成：", "我怎麼把話說得漂亮。", "但真正的策略問題是：", "<b>對方最後形成了什麼信念？</b>", "你說：", "我很強。", "沒用。", "對方相信你很強，才有用。", "你說：", "這是最後條件。", "沒用。", "對方相信你真的不會再退，才有用。", "所以資訊互動的真正鏈條是：", "你發出訊號↓對方形成信念↓對方預測你的行為↓對方重新選擇策略這才是完整機制。", "因此：", "<b>溝通不是把訊息送出去。</b>", "而是：", "<b>改變對方的內部模型。</b>", "這正是《鬼谷子》與現代博弈論最值得交叉研究的地方。"]}, {"t": "18. 《孫子兵法》看的是：真正的威懾，要讓對方重新計算成本", "p": 260, "x": ["《孫子兵法》的高階策略，", "也不只是：", "我要比對手更強。", "而是：", "<b>讓對手判斷，某些行動不值得做。</b>", "這就是威懾。", "如果對方認為：", "攻擊你成本很低，他可能進攻。", "如果你改變結構，讓進攻成本高到不值得，很多戰鬥可能根本不會發生。", "所以最高階的勝利，不是：", "對方出手後把他打敗。", "而是：", "<b>讓對方在出手以前，就重新計算後選擇不出手。</b>", "這才是威脅與承諾的真正策略價值。"]}, {"t": "19. 《易經》看的是：承諾不能脫離時位", "p": 262, "x": ["但是再強的承諾，也不能脫離狀態變化。", "這就是《易經》非常重要的補充。", "今天合理的底線，明天可能因局勢改變而失效。", "今天適合進，明天可能應該退。", "如果把過去的承諾變成：", "永遠不能更新的身份，那就會從策略，變成束縛。", "所以真正成熟的承諾不是：", "永遠不變。", "而是：", "<b>在什麼條件成立時，我承諾不變；當哪些核心條件改變時，重新評估。</b>", "這就是：", "結構化承諾。", "它同時保留：", "穩定性。", "與更新能力。"]}, {"t": "20. 從控制論看：可信度就是讓控制訊號和實際執行一致", "p": 263, "x": ["控制論可以再提供一個很好的視角。", "如果控制器一直發出訊號：", "超過某值就修正。", "但每次真正超過時，系統都不動，那麼這個控制訊號最後就失去功能。", "因為系統已經學到：", "訊號與行動不一致。", "在人際、家庭、企業、制度裡都一樣。", "你說：", "這是規則。", "但你不執行。", "那它就不是規則。", "你說：", "這是底線。", "但每次都退。", "那它就不是底線。", "你說：", "違約有代價。", "但從不追究。", "那它就不是約束。", "所以：", "<b>可信度，就是訊號與未來行動長期一致所形成的預測穩定性。</b>"]}, {"t": "21. 真正高階的策略，不是多發威脅，而是少說但做到", "p": 265, "x": ["如果一個系統需要不停威脅，通常反而表示信用不足。", "真正穩定的結構，不需要每天提醒。", "紅燈不需要每天宣布：", "「今天闖紅燈還是會被罰。」", "因為大家已經形成預測。", "這就是制度成熟。", "所以真正高階的個人與組織，不是：", "威脅很多。", "而是：", "<b>承諾少而清楚，執行高度一致。</b>", "久而久之，別人會把這種一致性直接內建進自己的策略模型。", "這就是：", "<b>聲譽資本。</b>"]}, {"t": "22. 一套實用的可信度檢查法", "p": 266, "x": ["遇到一個威脅、承諾或底線，先問七個問題。", "<b>第一個：事情真的發生時，我還願意執行嗎？ </b>", "如果不願意，不要亂威脅。", "<b>第二個：我有能力執行嗎？ </b>", "沒有能力，威脅沒有意義。", "<b>第三個：對方知道我有能力嗎？ </b>", "能力不可見，威懾效果會下降。", "<b>第四個：我的過去紀錄支持這個承諾嗎？ </b>", "聲譽會影響可信度。", "<b>第五個：有沒有機制讓我難以反悔？ </b>", "合約、制度、公開承諾，都可能增加可信度。", "<b>第六個：如果環境改變，我是否仍保有必要的更新空間？ </b>", "不要把自己永久鎖死。", "<b>第七個：這個承諾是在改變對方策略，還是只是滿足自己的情緒？ </b>", "如果只是在發洩，那不是策略。", "<b>總結｜真正的力量，是讓別人能準確預測你 </b>", "威脅、承諾與可信度，最後都收束到同一件事：", "<b>你的未來行為，是否具有足夠穩定性，讓別人願意根據它重新計算。</b>", "所以真正強的人，不一定說話最狠。", "真正強的企業，也不一定規則最多。", "真正有力量的是：", "<b>說過的事情，能被結構支持。</b>", "<b>設定的底線，真的能執行。</b>", "<b>做出的承諾，未來仍符合自己的利益。</b>", "<b>遇到重大條件改變時，又保留必要的更新機制。</b>", "這才是成熟的可信度。", "從這個角度看，信用其實是一種：", "<b>長期累積的預測精度。</b>", "對方越能準確預測你的行為，合作成本越低。", "制度越能穩定執行，監控成本越低。", "承諾越可信，談判越不需要反覆拉扯。", "系統熵也就越低。", "所以博弈論真正要教的，不是如何說狠話。", "而是：", "<b>如何讓自己的行動、規則、資源、聲譽與未來誘因形成一致結構。</b>", "《鬼谷子》告訴我們：", "<b>對方相信什麼，會決定他怎麼動。</b>", "《孫子兵法》告訴我們：", "<b>真正的威懾，是讓對方認為某條路不值得走。</b>", "《易經》提醒我們：", "<b>所有承諾仍然必須服從條件與時位的變化。</b>", "博弈論則把這些問題壓縮成：", "<b>訊號 → 信念 → 預測 → 策略 → 行動。</b>", "真正的自由，也不是永遠不承諾。", "而是：", "<b>知道什麼值得承諾，什麼必須保留更新空間；</b>", "<b>既不被別人的威脅綁架，也不被自己過去的承諾永久綁架。</b>", "這才是：", "<b>可信，但不僵化。</b>", "<b>堅定，但可更新。</b>", "<b>有底線，也有模型修正能力。</b>", "而這正是高階策略真正需要的結構。"]}]}, {"t": "08｜資訊不完全：真正困難的博弈，不是不知道怎麼選，而是不知道對方是哪一種人", "p": 271, "s": [{"t": "導言", "p": 271, "x": ["<b>真實世界裡最難的博弈，往往不是策略太少，</b>", "<b>而是你根本不知道對方的真實狀態。</b>", "他是真的準備離職，還是在談條件？", "客戶是真的沒預算，還是在壓價？", "競爭者是真的成本很低，還是在虛張聲勢？", "合作夥伴是真的有誠意，還是只是想先取得你的資源？", "對方說：", "「這是最後價格。」", "問題不是這句話本身。", "真正的問題是：", "<b>你不知道這句話背後，對方到底是哪一種類型。</b>", "這就是資訊不完全博弈。", "也是博弈論真正開始接近現實世界的地方。"]}, {"t": "1. 完全資訊世界很乾淨，但現實世界不是這樣", "p": 272, "x": ["前面談博弈時，我們常常先假設一件事：", "大家大致知道彼此的報酬結構。", "例如：", "A 想賺錢。", "B 也想賺錢。", "雙方知道彼此有哪些策略。", "知道不同結果大致有什麼收益。", "這種情況稱為：", "<b>完全資訊博弈。</b>", "注意，完全資訊不代表：", "大家知道對方下一步一定會怎麼做。", "而是指：", "<b>大家知道這場遊戲的基本結構，包括彼此的報酬與類型。</b>", "但現實世界很少這麼乾淨。", "你和一家公司談合作。", "你不知道：", "它現金到底夠不夠。", "它還有沒有其他合作對象。", "它真的很需要你，還是只是備案。", "它真正的底價是多少。", "它的老闆是不是已經決定退出某個市場。", "這些資訊一旦不知道，你的問題就不再只是：", "他會選什麼？", "而是：", "<b>他到底是哪一種類型的玩家？</b>", "這就是資訊不完全。"]}, {"t": "2. 真正影響策略的，不只是行動，而是「類型」", "p": 274, "x": ["博弈論裡一個很重要的概念叫：", "<b>類型。</b>", "類型不是人格測驗。", "也不是貼標籤。", "它是指：", "<b>會影響一個玩家報酬、能力、偏好、成本或策略選擇的私人資訊。</b>", "例如賣家可能有兩種類型：", "成本低。", "成本高。", "買家不知道是哪一種。", "如果賣家成本低，他可以接受比較低的價格。", "如果成本高，他就不願意降太多。", "所以：", "<b>同一個報價，對不同類型的玩家，意義不同。</b>", "求職也是。", "一個求職者說：", "「低於八萬我不接受。」", "他可能是：", "真的還有三個 offer。", "也可能是：", "完全沒有備案，只是在試探。", "表面訊息相同。", "底層類型完全不同。", "所以你不能只分析：", "「他說了什麼。」", "你要分析：", "<b>什麼類型的人，最可能說出這句話？</b>", "這就是從表面訊息，進入隱藏狀態。"]}, {"t": "3. 資訊不完全的本質：你正在對一個看不見的狀態做決策", "p": 276, "x": ["這裡可以用控制論的語言來理解。", "假設你正在控制一台機器。", "但你看不到它內部真正溫度。", "只能看到幾個外部訊號。", "你就必須根據：", "感測值。", "歷史數據。", "異常反應。", "去推估內部狀態。", "這叫：", "<b>狀態估計。</
