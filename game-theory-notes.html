一樣。", "AI 的價值不應該被理解成：", "一次給出終極答案。", "真正更有價值的是：", "幫助人快速建立：", "假設。", "模型。", "推演。", "測試。", "比較。", "更新。", "讓策略演化速度提高。", "這才是認知加速器。", "<b>總結｜真正的競爭，不是誰現在最強，而是誰更能持續演化 </b>", "演化博弈真正要打穿的一件事是：", "<b>世界不是在挑選一次性的最佳策略，而是在持續篩選能適應當下環境的策略。</b>", "所以：", "今天成功，不等於明天成功。", "今天穩定，不等於永遠穩定。", "存在很久，也不等於全局最佳。", "因為所有策略都存在於：", "環境。", "族群。", "頻率。", "網絡。", "歷史。", "回饋。", "之中。", "一個策略改變，其他策略會跟著改。", "族群比例改變，報酬又會改。", "環境再改變，原來的穩定又可能瓦解。", "這就是：", "<b>共演化。</b>", "《易經》提醒我們：", "<b>沒有永遠固定的局，只有持續轉化的狀態。</b>", "《鬼谷子》提醒我們：", "<b>人心與策略都會隨位置、利益與互動而改變。</b>", "《孫子兵法》提醒我們：", "<b>對手會學習，所以任何優勢都必須持續更新。</b>", "複雜系統則告訴我們：", "<b>大量局部互動會湧現出沒有任何單一玩家完整設計的整體秩序。</b>", "機制設計進一步告訴我們：", "<b>如果想改變演化方向，就必須改變選擇壓力。</b>", "最後整個結構可以壓縮成：", "<b>策略變異 → 互動 → 報酬差異 → 模仿／淘汰 → 族群改變 → 環境改變 → 再次選擇。</b>", "這才是真正的動態世界。", "所以真正高階的智慧不是：", "找到一個永遠正確的策略。", "而是建立：", "<b>持續生成新策略的能力。</b>", "<b>持續淘汰錯誤策略的能力。</b>", "<b>持續保留有效結構的能力。</b>", "<b>持續感知環境翻轉的能力。</b>", "真正的成長，就是模型愈來愈能適應現實。", "真正的自由，就是不被上一輪成功的模型永久綁架。", "而真正具有生命力的系統，從來不是永遠不變的系統。", "而是：", "<b>能在變化裡持續重構自己的系統。</b>"]}]}, {"t": "15｜從博弈論回到華夏動態決策母體：真正的智慧，是讓十套母體開始一起運轉", "p": 656, "s": [{"t": "導言", "p": 656, "x": ["<b>博弈論加入之後，《華夏動態決策母體》才真正補上「別人也會思考、也會反應、也會更新」這一層。</b>", "《易經》可以看變化。", "《鬼谷子》可以看資訊、人心與互動。", "《孫子兵法》可以看競爭、資源與行動。", "但只要現實裡出現第二個有目標、有資訊、有策略、會根據你而改變的人，問題就不能再只靠單一主體分析。", "這時候必須加入博弈論：", "<b>我動之後，他會怎麼動？</b>", "但博弈論本身也不是完整答案。", "因為你還要知道：", "現在是什麼狀態？", "資訊是真的嗎？", "未來有哪些可能？", "風險多大？", "資源夠不夠？", "行動之後怎麼取得回饋？", "原模型錯了又怎麼改？", "因此，真正完整的結構不是：", "<b>《易經》＋博弈論。</b>", "也不是：", "<b>古典智慧＋現代科學。</b>", "而是：", "<b>三套華夏古典母體 × 七套現代科學母體，形成一個可以持續感知、推演、決策、行動與更新的動態系統。</b>", "這才是《華夏動態決策母體》真正要完成的東西。"]}, {"t": "1. 《易經》負責的，不是替你決定，而是辨識「現在是什麼局」", "p": 658, "x": ["任何決策以前，都有一個更早的問題：", "<b>現在到底發生了什麼？</b>", "如果連狀態判斷錯，後面所有策略都可能錯。", "《易經》的位置就在這裡。", "它不是替你預言：", "明天一定會發生什麼。", "更重要的是：", "辨識：", "目前狀態。", "位置關係。", "力量消長。", "內部矛盾。", "變化方向。", "轉折條件。", "例如一家企業營收還在成長。", "表面看：", "很好。", "但如果同時出現：", "獲客成本上升。", "核心員工流失。", "現金流惡化。", "市場競爭增加。", "那麼「營收成長」可能只是表象。", "真正狀態可能已經接近：", "由盛轉衰的翻轉點。", "所以《易經》真正提供的是：", "<b>狀態空間與狀態轉換。</b>", "先辨勢。", "再談策略。"]}, {"t": "2. 《鬼谷子》補上：同一個局，每個人看到的世界不一樣", "p": 660, "x": ["即使看清了局勢，還是不夠。", "因為局中的每一個人：", "知道的東西不同。", "想要的東西不同。", "害怕的東西不同。", "相信的東西不同。", "甚至連同一個訊號，都可能做出不同解讀。", "這就是《鬼谷子》的位置。", "它處理：", "資訊。", "人心。", "試探。", "說服。", "信念。", "關係。", "互動。", "例如公司正在重組。", "管理層認為：", "這是提高效率。", "員工可能理解成：", "公司準備裁員。", "同一件事，不同模型。", "接著員工開始找工作。", "關鍵人才流失。", "管理層看到流失，反而加速重組。", "原本只是效率改革，最後真的演化成組織危機。", "所以：", "<b>人不是直接對現實反應，而是對自己理解的現實反應。</b>", "這一層非常重要。", "因此《鬼谷子》進入整套母體後，真正要處理的是：", "<b>資訊如何改變信念，信念如何改變策略。</b>"]}, {"t": "3. 《孫子兵法》再往前一步：看懂之後，到底怎麼動？", "p": 662, "x": ["知道局。", "知道人。", "最後還是要行動。", "因為任何決策都受到：", "資源。", "時間。", "位置。", "成本。", "能力。", "風險。", "限制。", "約束。", "這就是《孫子兵法》的位置。", "真正高階的《孫子兵法》，不是：", "如何打贏每一場戰爭。", "而是：", "<b>如何用有限資源，在特定局勢中取得目標。</b>", "所以它關心：", "打不打。", "在哪裡打。", "什麼時候打。", "投入多少。", "保存多少。", "哪裡避開。", "哪裡集中。", "什麼情況應該退出。", "如果《易經》是：", "<b>辨勢。</b>", "《鬼谷子》是：", "<b>知人。</b>", "那《孫子兵法》就是：", "<b>用勢、用人、用資源。</b>", "這三套古典母體，已經形成一個非常完整的決策骨架。", "但還缺一層。"]}, {"t": "4. 博弈論補上的，是「對方不是棋子，而是另一個會思考的系統」", "p": 664, "x": ["這就是整本博弈論真正要補進來的位置。", "如果對方只是一個固定物體，那不需要博弈論。", "問題在於：", "對方會學。", "會算。", "會騙。", "會試探。", "會合作。", "會背叛。", "會觀察你的策略。", "甚至會預測：", "你正在預測他。", "所以：", "<b>你不是在操作環境，而是在和另一個控制系統互相耦合。</b>", "這也是為什麼：", "單純的線性因果會失效。", "你降價。", "對手跟進。", "你升級產品。", "對手模仿。", "你增加防禦。", "對手重新配置。", "你改變談判立場。", "對方重新估計你的底線。", "所以真正的結構是：", "<b>我的模型 → 我的行動 → 他的觀察 → 他的模型更新 → 他的行動 → 我的再更新。</b>", "這才是真正的人類互動世界。"]}, {"t": "5. 博弈論不是叫你把所有人都當敵人", "p": 666, "x": ["這點一定要說清楚。", "博弈不是戰爭的同義詞。", "只要：", "你的結果取決於別人的選擇，別人的結果也取決於你的選擇，就已經存在博弈。", "所以：", "夫妻合作是博弈。", "公司治理是博弈。", "供應鏈合作是博弈。", "人才管理是博弈。", "平台規則也是博弈。", "真正的問題不是：", "我要怎麼打敗你？", "而是：", "<b>我們現在處於什麼相互依賴結構？</b>", "可能是：", "競爭。", "合作。", "協調。", "談判。", "囚徒困境。", "多重均衡。", "重複互動。", "資訊不對稱。", "只有辨識正確，策略才有意義。"]}, {"t": "6. 這時候，決策科學才真正接進來", "p": 668, "x": ["博弈論告訴我們：", "別人會反應。", "但它沒有單獨回答：", "<b>我最後應該選哪一條路？</b>", "所以需要決策科學。", "決策科學主要處理：", "機率。", "風險。", "效用。", "不確定性。", "選項。", "決策偏誤。", "期望結果。", "例如你正在判斷：", "要不要進入一個新市場。", "《易經》看：", "市場現在處在什麼狀態。", "《鬼谷子》看：", "競爭者、消費者與合作夥伴怎麼想。", "《孫子兵法》看：", "資源怎麼配置。", "博弈論看：", "你進去後，對手會怎麼反應。", "接下來還要問：", "成功機率多少？", "失敗損失多少？", "最好結果多少？", "最壞情況能不能承受？", "是否有更好的替代方案？", "這就是：", "<b>決策科學。</b>", "所以可以非常清楚地分：", "<b>博弈論＝別人會怎麼動。</b>", "<b>決策科學＝在這些可能結果之間，我怎麼選。</b>", "兩者是互補，不是替代。"]}, {"t": "7. 預測編碼：所有策略，其實都建立在一個暫時模型上", "p": 671, "x": ["前面每一層都有一個共同問題：", "我們可能看錯。", "你以為：", "客戶在意價格。", "結果他在意速度。", "你以為：", "競爭者會價格戰。", "結果他直接退出。", "你以為：", "市場會成長。", "結果需求突然反轉。", "所以整套母體不能建立在：", "「我現在的判斷就是真相。」", "而必須建立在：", "<b>目前模型，只是目前最能解釋證據的版本。</b>", "這就是預測編碼的重要位置。", "可以壓縮成：", "<b>模型 → 預測 → 現實 → 誤差 → 更新。</b>", "真正的成長不是：", "證明自己原本是對的。", "而是：", "<b>模型誤差愈來愈小。</b>", "所以預測編碼不是另一個知識內容。", "它其實是整套母體的：", "<b>更新引擎之一。</b>"]}, {"t": "8. 自由能原理：真正的系統，不只要贏一次，還要能持續存在", "p": 672, "x": ["決策不能只追求：", "單次最大收益。", "因為生命、企業、組織都是持續存在的系統。", "如果一家公司今天為了：", "極大利潤耗盡：", "現金。", "人才。", "信用。", "供應鏈。", "那即使這一期數字很好，系統也可能走向崩潰。", "自由能原理可以提供一個更高層的視角：", "<b>系統必須持續降低不可承受的不確定性，維持自身可存續的狀態。</b>", "放進決策母體後，就會問：", "這個策略雖然收益高，會不會讓系統進入不可控制狀態？", "這個成長速度，會不會超過組織承受能力？", "這次冒險失敗後，系統還活不活得下來？", "這就是：", "<b>生存邊界。</b>", "所以高階決策不是：", "收益最大化。", "而是：", "<b>在不摧毀自身可持續性的前提下，提高長期目標函數。</b>"]}, {"t": "9. 複雜系統：真實世界不會按照線性比例反應", "p": 674, "x": ["你投入兩倍資源，不代表產生兩倍結果。", "你減少 10% 壓力，也不一定只改善 10%。", "因為真實世界存在：", "網絡效應。", "臨界點。", "正回饋。", "負回饋。", "湧現。", "路徑依賴。", "非線性。", "例如一個社群。", "從 100 人成長到 1,000 人，可能不只是規模乘十。", "互動關係可能增加更多。", "文化會改變。", "管理方式也必須改。", "所以複雜系統提醒整套母體：", "<b>不要把世界當成簡單機械。</b>", "很多變化在接近臨界值以前，看起來幾乎沒事。", "一跨過翻轉點，整體狀態可能突然改變。", "這就是為什麼《易經》的狀態轉換，和複雜系統的臨界轉換，可以形成非常重要的比較接口。", "不是說兩者相同。", "而是它們都提醒：", "<b>真正重要的不是單一事件，而是系統是否接近結構翻轉。</b>"]}, {"t": "10. 控制論：決策真正完成，不是在做出選擇，而是在取得回饋之後", "p": 676, "x": ["很多人以為：", "做完決定，事情就結束了。", "其實真正的決策系統才剛開始。", "因為任何行動都有可能和預測不同。", "所以真正完整的流程必須是：", "<b>目標 → 行動 → 感測 → 誤差 → 修正 →再行動。</b>", "這就是控制論。", "例如企業推出新產品。", "不是：", "推出。", "結束。", "而是：", "推出。", "看轉換率。", "看退貨率。", "看競爭者。", "看客戶反應。", "看成本。", "然後：", "重新定價。", "重新定位。", "改產品。", "改通路。", "甚至退出。", "所以真正高品質的決策，不是第一次就神準。", "而是：", "<b>修正速度夠快。</b>", "這就是控制論加入母體後的價值。"]}, {"t": "11. 自生成系統論：不是所有機會都值得追，先問「我是誰」", "p": 679, "x": ["這一層非常重要。", "如果只談適應，系統很容易陷入另一個問題：", "什麼有效就變什麼。", "最後失去自己的邊界。", "例如一家公司看到什麼市場賺錢，就做什麼。", "今天做電商。", "明天做金融。", "後天做 AI。", "再過一陣子做房地產。", "看起來很靈活。", "實際上可能已經沒有：", "核心能力。", "邊界。", "身份。", "內部一致性。", "自生成系統論提醒：", "<b>一個生命系統必須在適應外部的同時，持續再生自身的核心結構。</b>", "所以決策還要問：", "這個機會符合我們的核心能力嗎？", "這次調整會不會破壞自身邊界？", "我們是在更新，還是在解體？", "這就是：", "<b>適應</b>", "與<b>自我維持</b>", "之間的平衡。"]}, {"t": "12. 七套科學不是七本書，而是七個不同的運算器", "p": 681, "x": ["到了這裡，就可以把七套前沿科學真正壓縮。", "<b>預測編碼我的模型錯在哪？</b>", "<b>自由能原理這個系統如何在不確定世界中維持可存續狀態？</b>", "<b>複雜系統是否存在非線性、湧現、臨界點與連鎖反應？</b>", "<b>控制論行動後如何取得回饋、修正誤差？</b>", "<b>自生成系統論更新到什麼程度仍然保持自身邊界？</b>", "<b>博弈論別人會如何根據我的策略改變自己的策略？</b>", "<b>決策科學面對這些機率、風險與結果，我到底選哪一條路？</b>", "這七套不是互相重複。", "而是：", "<b>同一個動態決策問題的七個運算維度。</b>"]}, {"t": "13. 三套古典 × 七套科學，不是二十一格硬配對", "p": 682, "x": ["這裡非常重要。", "「3 × 7」不能被理解成：", "一定要把每一本古典和每一套科學全部強行對應。", "那會產生牽強。", "真正的意思是：", "<b>面對一個問題時，從三套古典母體與七套科學母體中，選擇真正有解釋力的模組交叉運算。</b>", "有些問題，《易經》＋複雜系統＋決策科學最重要。", "有些問題，《鬼谷子》＋博弈論＋預測編碼更重要。", "有些企業競爭，可能需要：", "《孫子兵法》＋博弈論＋控制論。", "所以母體不是：", "十套理論全部一起講一次。", "而是：", "<b>路由。</b>", "這就像工具箱。", "不是每次修理都拿十種工具一起敲。", "而是先辨識問題，再調用正確工具。"]}, {"t": "14. 所以真正的核心，不是資料庫，而是「問題路由」", "p": 684, "x": ["這是 AI 母體和普通知識庫最大的不同。", "普通資料庫回答：", "有什麼資料？", "真正的 AI 母體還要回答：", "<b>遇到這個問題，我應該調用哪一套結構？</b>", "例如學員問：", "「我和合夥人最近關係愈來愈差，要不要拆夥？」", "不能立刻講《易經》。", "也不能立刻講囚徒困境。", "系統應該先拆：", "現在狀態。", "雙方目標。", "資訊差。", "替代方案。", "長期互動。", "退出成本。", "權力不對稱。", "然後才路由到：", "《易經》：目前狀態是否已經進入結構性失衡？", "《鬼谷子》：雙方真正需求與資訊落差在哪？", "博弈論：現在是否陷入低品質均衡？", "決策科學：留下、重談、拆夥，各自風險與期望值？", "控制論：能不能先設計一輪可驗證的修正？", "這時候母體才真正開始運算。"]}, {"t": "15. NODE00 的位置：先讓 AI 教學，不要讓初學員直接掉進十套母體", "p": 685, "x": ["這也是《華夏動態決策母體》後來增加<b>NODE00</b> 的真正原因。", "不是每一個學員一開始都懂：", "納許均衡。", "預測誤差。", "複雜系統。", "目標函數。", "博弈樹。", "狀態轉換。", "如果直接叫他：", "「請使用十套母體分析你的問題。」", "他很可能連問題都不知道怎麼問。", "所以正式進入系統以前，先進：", "<b>NODE00｜AI 先行教學</b>", "AI 先教最基本的：", "這十套母體各自處理什麼？", "什麼叫狀態？", "什麼叫資訊差？", "什麼叫目標函數？", "什麼叫策略互動？", "什麼叫風險？", "什麼叫模型更新？", "這一層不是考試。", "而是先替學員建立：", "<b>最低必要知識結構。</b>", "然後再帶自己的真實問題進入後續節點。", "這樣學員不是在背理論。", "而是：", "<b>先建立初始模型，再用自己的生活去壓測模型。</b>", "這才是學習真正開始的地方。"]}, {"t": "16. 真正的學習，不是記住十套理論，而是能夠切換模型", "p": 687, "x": ["如果學完這些理論，只會說：", "這是博弈論。", "這是控制論。", "這是《孫子兵法》。", "其實還沒有形成智慧。", "真正的能力是：", "看到問題後，知道哪個模型有用。", "哪個模型暫時不用。", "例如有人問：", "「我要不要換工作？」", "如果只用博弈論，可能太複雜。", "因為問題首先可能是：", "個人風險決策。", "這時決策科學權重更高。", "但如果問題變成：", "「公司知道我要走，現在提出加薪留我，我該怎麼談？」", "博弈論、訊號、BATNA、資訊不完全的權重就上升。", "所以智慧不是：", "模型愈多愈好。", "而是：", "<b>模型選擇愈準愈好。</b>", "這就是高維結構的真正價值。"]}, {"t": "17. 一個完整案例：企業要不要發動價格戰？", "p": 689, "x": ["現在把十套母體真正跑一次。", "假設企業面對競爭者突然降價。", "第一個直覺是：", "跟著降。", "但不要急。", "<b>《易經》 </b>", "先看狀態：", "這是短期促銷？", "市場轉折？", "還是產業正式進入價格競爭？", "<b>《鬼谷子》 </b>", "看資訊與意圖：", "對手為什麼降？", "去庫存？", "現金流壓力？", "搶市占？", "還是測試我們反應？", "<b>《孫子兵法》 </b>", "看資源：", "我們成本結構能不能打？", "打多久？", "哪個市場值得守？", "是否應集中資源而不是全面迎戰？", "<b>博弈論 </b>", "看對方反應：", "我們跟降之後，他會不會再降？", "會不會形成負和價格戰？", "不跟降，他又會怎麼做？", "<b>決策科學 </b>", "建立幾個方案：", "跟降。", "局部跟降。", "維持價格。", "推出不同產品。", "退出部分市場。", "比較：", "成功機率。", "損失。", "期望值。", "尾部風險。", "<b>預測編碼 </b>", "先寫清楚我們的假設：", "「消費者主要看價格。」", "然後去驗證。", "如果客戶其實更重視服務，原模型要立即修正。", "<b>自由能原理 </b>", "即使打價格戰能贏，公司現金能不能撐？", "不要為了短期市占，讓整個系統進入不可存續狀態。", "<b>複雜系統 </b>", "看：", "價格戰會不會造成連鎖反應？", "其他競爭者會不會加入？", "供應商會不會被壓垮？", "產業會不會跨過某個臨界點？", "<b>控制論 </b>", "如果決定局部降價，先設定：", "觀察週期。", "市占指標。", "毛利警戒值。", "退出條件。", "根據回饋修正。", "<b>自生成系統論 </b>", "最後問：", "如果長期都靠低價競爭，我們還是不是原來那家公司？", "我們的品牌、能力與核心結構會不會被破壞？", "這才叫：", "<b>母體運算。</b>", "不是引用十套理論。", "而是十套模型一起降低：", "<b>決策盲點。</b>"]}, {"t": "18. 真正的動態決策循環，可以壓縮成八步", "p": 695, "x": ["到了這裡，整套系統其實可以壓縮得非常清楚。", "<b>第一步｜辨勢 </b>", "現在是什麼狀態？", "<b>第二步｜建模 </b>", "真正重要的節點、關係與限制是什麼？", "<b>第三步｜知人 </b>", "有哪些玩家？", "各自的目標、資訊與類型是什麼？", "<b>第四步｜推演 </b>", "我動之後，他怎麼動？", "還有哪些路徑？", "<b>第五步｜決策 </b>", "不同方案的機率、風險、成本與收益如何？", "<b>第六步｜行動 </b>", "如何配置資源並執行？", "<b>第七步｜回饋 </b>", "現實和預測差在哪裡？", "<b>第八步｜更新 </b>", "哪些權重、關係、假設與策略需要改？", "然後：", "<b>重新辨勢。</b>", "再次循環。", "這才是真正的：", "<b>華夏動態決策。</b>", "不是一次給答案。", "而是持續運算。"]}, {"t": "19. 所以母體最核心的產品，不是答案，而是「更新機制」", "p": 696, "x": ["如果一套系統只會：", "回答問題。", "它很快就會過時。", "因為世界一直變。", "真正有價值的母體必須知道：", "新證據來了怎麼辦？", "預測錯了怎麼辦？", "對手改策略怎麼辦？", "環境翻轉怎麼辦？", "原本成功方法失效怎麼辦？", "答案只有一個：", "<b>更新。</b>", "所以真正要內建的不是：", "永遠正確的答案。", "而是：", "<b>錯了以後怎麼改。</b>", "這也是整套系統最核心的智慧觀：", "<b>智慧不是沒有誤差，而是有能力修正誤差。</b>", "模型錯誤不可怕。", "不能更新才可怕。"]}, {"t": "20. 從熵的角度看：決策失敗往往不是資訊不足，而是結構無法重新組織", "p": 698, "x": ["世界本來就會產生：", "雜訊。", "不確定。", "衝突。", "新變數。", "這些都會增加系統熵。", "如果一個人面對新資訊只會：", "否認。", "防禦。", "合理化。", "維持舊模型。", "那麼新資訊無法被整合。", "內部矛盾就愈來愈多。", "企業也一樣。", "市場已經變。", "組織卻不改。", "表面還在運作。", "內部誤差不斷累積。", "最後可能突然崩潰。", "所以：", "<b>逆熵不是拒絕變化，而是把變化重新組織成新的秩序。</b>", "這就是更新的本質。"]}, {"t": "21. 從博弈論再看自由：真正的自由不是沒有別人，而是不被單一博弈鎖死", "p": 699, "x": ["人不可能離開所有互動。", "你永遠生活在：", "家庭。", "市場。", "公司。", "社會。", "制度。", "關係。", "之中。", "所以自由不可能等於：", "完全沒有規則。", "也不可能等於：", "沒有人影響我。", "更高階的自由是：", "<b>我知道自己正在參與什麼博弈，而且擁有改變策略、退出舊局或重設規則的能力。</b>", "如果你不知道遊戲規則，", "你會被規則控制。", "如果你只有一個選項，你會被位置控制。", "如果你不能更新模型，你會被過去控制。", "所以：", "<b>策略空間愈大，自由度愈高。</b>", "<b>模型更新能力愈強，自由度愈高。</b>"]}, {"t": "22. 從博弈論再看智慧：不是比別人多算幾步，而是能升維看整個系統", "p": 701, "x": ["低階玩家看：", "眼前動作。", "中階玩家看：", "對方反應。", "高階玩家看：", "整個均衡。", "再高一階：", "看規則。", "更高一階：", "看規則怎麼生成策略。", "最後：", "看整個系統如何演化與更新。", "所以智慧的層級可以寫成：", "<b>行動 → 反應 → 策略 → 均衡 → 機制 →演化 → 更新。</b>", "當你只看第一層，容易困在輸贏。", "當你開始看到後面幾層，問題會逐漸從：", "「我要怎麼贏他？」", "變成：", "<b>什麼結構，會讓整個系統產生更好的結果？</b>", "這才是真正的升維。"]}, {"t": "23. AI 在這套系統裡，不是答案機，而是推演工具", "p": 703, "x": ["到了 AI 時代，這套母體真正開始具有新的可能。", "因為一個人很難同時處理：", "大量資訊。", "多個玩家。", "多條路徑。", "不同機率。", "多輪反應。", "歷史案例。", "模型比較。", "AI 可以幫助：", "建立玩家模型。", "生成博弈樹。", "列出反例。", "模擬不同情境。", "比較策略。", "尋找遺漏變數。", "進行壓力測試。", "記錄預測。", "比較事後誤差。", "但 AI 不能被當成：", "本體真理。", "因為 AI 自己也只是：", "根據資料建立模型。", "所以真正正確的位置是：", "<b>AI＝認知加速器＋策略推演器＋模型誤差檢查器。</b>", "最終仍然需要：", "新證據。", "現實回饋。", "模型更新。"]}, {"t": "24. 所以第二個 AI 母體真正完成的，不是一套國學，而是一套決策作業系統", "p": 705, "x": ["走到這裡就很清楚了。", "這已經不是：", "學《易經》。", "學《鬼谷子》。", "學《孫子兵法》。", "也不是：", "多讀七套現代理論。", "真正要建立的是：", "<b>一個人進入複雜世界後，如何持續做出較高品質決策的作業系統。</b>", "它必須能夠：", "辨識狀態。", "讀取資訊。", "建立模型。", "辨識玩家。", "模擬反應。", "估計風險。", "配置資源。", "執行。", "感測。", "修正。", "再次推演。", "所以真正的結構不是：", "<b>知識庫。</b>", "而是：", "<b>智慧生成循環。</b>"]}]}, {"t": "總結《華夏動態決策母體》真正要生成的，不是答案，而是一個永遠能重新計算的人", "p": 707, "s": [{"t": "導言", "p": 707, "x": ["", "博弈論走到最後，真正教我們的不是：", "怎麼算計別人。", "而是看見：", "<b>你從來不是一個人在世界裡做決定。</b>", "你的行動會改變別人。", "別人會反過來改變你。", "你們共同改變環境。", "環境又反過來改變所有人。", "所以真正的世界不是：", "A 導致 B。", "而是：", "<b>狀態、資訊、策略、資源、回饋與多個行動者持續耦合的動態系統。</b>", "因此：", "《易經》負責看<b>狀態與變化</b>。", "《鬼谷子》負責看<b>資訊、人心與互動</b>。", "《孫子兵法》負責看<b>競爭、資源與行動</b>。", "預測編碼負責<b>模型誤差修正</b>。", "自由能原理負責<b>不確定性與可存續性</b>。", "複雜系統負責<b>非線性、湧現與臨界轉換</b>。", "控制論負責<b>回饋與修正</b>。", "自生成系統論負責<b>邊界、自我維持與持續生</b>", "<b>成</b>。", "博弈論負責<b>多主體策略互動</b>。", "決策科學負責<b>機率、風險與最終選擇</b>。", "最後全部匯聚成一條循環：", "<b>辨勢 → 知人 → 推演 → 決策 → 配置 →行動 → 回饋 → 更新 → 再辨勢。</b>", "這就是《華夏動態決策母體》。", "真正的成長，", "不是知道更多答案。", "而是：", "<b>預測愈來愈準。</b>", "真正的智慧，不是永遠不犯錯。", "而是：", "<b>錯了之後能更快更新。</b>", "真正的自由，不是沒有人、沒有規則、沒有局。", "而是：", "<b>你不再被任何一個舊模型、單一策略、錯誤均衡或過時規則永久綁架。</b>", "你可以重新看。", "重新算。", "重新選。", "重新配置。", "重新設計。", "重新開始。", "因為真正具有生命力的系統，從來不是一套永遠正確的答案。", "而是一個：", "<b>永遠可以根據新證據，重新生成下一個自己、下一個策略、下一個世界模型的智慧母體。</b>", "<b>總結｜博弈論真正教你的，不是算計，而是看懂互動世界的結構 </b>", "先給結論。", "<b>博弈論真正重要的，不是讓你變得更會贏，而是讓你知道：你所面對的世界，從來不是靜止的。</b>", "你做一件事。", "別人會反應。", "別人的反應會改變你的下一步。", "你的下一步又會改變他的判斷。", "於是：", "<b>世界不是「我做什麼，就得到什麼」。</b>", "真正的世界是：", "<b>我做什麼 → 別人怎麼反應 → 局勢怎麼改變→ 我再怎麼更新。</b>", "這就是博弈。", "也是這本書真正要建立的世界模型。"]}, {"t": "1. 人生真正複雜的地方，是別人也有自己的目標函數", "p": 711, "x": ["如果世界只有你一個人，決策相對簡單。", "你只需要知道：", "我要什麼？", "有哪些選項？", "風險多大？", "哪個方案期望值最高？", "這比較接近決策科學。", "但現實裡還有：", "伴侶。", "同事。", "主管。", "員工。", "客戶。", "競爭者。", "政府。", "平台。", "市場。", "每一個行動者都有自己的目標。", "所以：", "你的最佳答案，不一定是他的最佳答案。", "甚至：", "你希望他做的事，可能正好違反他的利益。", "這時候如果你只是一直要求：", "「他應該這樣。」", "就沒有真正進入博弈。", "真正要問的是：", "<b>在他的報酬結構裡，為什麼他現在會這樣選？</b>", "這個問題一出現，分析就從善惡判斷，進入了結構。"]}, {"t": "2. 博弈的第一個升維：不要只看行為，要看行為背後的結構", "p": 713, "x": ["一個人不合作。", "可能是：", "他自私。", "但也可能是：", "合作對他風險太高。", "一個部門不分享資料。", "可能是：", "主管沒有格局。", "但也可能是：", "分享資料會降低他的部門權力。", "一家企業打價格戰。", "可能是：", "老闆衝動。", "也可能是：", "目前報酬結構真的讓降價成為最佳反應。", "所以博弈論逼我們往下一層看：", "<b>玩家。</b>", "<b>策略。</b>", "<b>報酬。</b>", "<b>資訊。</b>", "<b>順序。</b>", "<b>規則。</b>", "只要這些變數沒有看清楚，直接評論人格，通常解析度太低。", "真正高階的問題永遠是：", "<b>什麼結構，正在生成這個行為？</b>", "這是整本書最重要的一條主線。"]}, {"t": "3. 納許均衡告訴我們：壞結果，也可以非常穩定", "p": 715, "x": ["人很容易以為：", "如果一個結果很差，大家自然會改。", "不一定。", "這正是納許均衡最重要的警告。", "可能所有人都知道：", "現在這樣不好。", "但任何一個人先改，自己反而吃虧。", "於是：", "所有人一起留在原地。", "例如：", "全員加班。", "價格戰。", "部門互不信任。", "夫妻冷戰。", "軍備競賽。", "每個人都不喜歡。", "卻沒有人敢先改。", "這就是：", "<b>低品質均衡。</b>", "所以改革真正困難的地方，", "不是：", "大家知不知道有問題。", "而是：", "<b>如何讓新的行為變成新的最佳反應。</b>", "這已經不是勸說。", "而是結構重建。"]}, {"t": "4. 囚徒困境告訴我們：聰明的人，也會一起製造愚蠢系統", "p": 717, "x": ["這可能是博弈論最反直覺的地方。", "每個人都可以很理性。", "最後整個系統卻很愚蠢。", "因為：", "<b>局部最佳，不等於全局最佳。</b>", "每家公司都降價。", "最後全產業利潤下降。", "每個部門都保護自己。", "最後公司資訊不流動。", "每個人都多使用一點公共資源。", "最後資源被耗盡。", "所以系統性錯誤不需要：", "壞人。", "甚至不需要：", "笨人。", "只需要：", "錯誤的誘因結構。", "這也意味著：", "真正高階的治理不能只要求個人：", "更有道德。", "更有責任感。", "更願意犧牲。", "而要問：", "<b>怎麼讓個體理性與系統理性重新對齊？</b>", "這才是制度問題。"]}, {"t": "5. 重複博弈告訴我們：今天的行動會變成明天的環境", "p": 719, "x": ["如果只做一次交易，短期利益權重很高。", "但如果未來還會再見，今天就不再只是今天。", "你今天背叛，會變成明天的聲譽。", "你今天合作，會變成明天的信任。", "你今天放任一次違規，也會變成下一輪行為的訓練。", "所以：", "<b>每一次互動，都同時在塑造下一次互動。</b>", "這就是為什麼長期關係真正重要的不是：", "這次誰贏。", "而是：", "<b>這次處理方式，正在強化什麼策略？</b>", "家庭如此。", "企業文化如此。", "商業信用如此。", "社會制度也是如此。", "所有重複互動，最後都會形成：", "記憶。", "聲譽。", "規則。", "預期。", "這些就是下一輪博弈的初始條件。"]}, {"t": "6. 資訊不完全告訴我們：你永遠不可能完全看懂別人", "p": 721, "x": ["這是現實世界不可避免的限制。", "你不知道：", "對方真正成本。", "真正底價。", "真正目的。", "真正能力。", "真正替代方案。", "所以任何策略都建立在：", "<b>不完整資訊。</b>", "真正成熟的人，不會因為不知道就停止思考。", "也不會因為想要確定感，就把猜測當真相。", "更好的方式是：", "<b>建立多個假設。</b>", "<b>給不同假設暫時權重。</b>", "<b>取得新證據。</b>", "<b>持續更新。</b>", "這就是貝氏思維。", "也是預測編碼真正可以接進來的地方。", "所以智慧不是：", "看穿所有人。", "而是：", "<b>不會被自己的第一個判斷綁死。</b>"]}, {"t": "7. 訊號與篩選告訴我們：不要一直問真相，要設計能產生真相的互動", "p": 722, "x": ["人會說話。", "也會隱藏。", "所以：", "「你是真的嗎？」", "通常不是很好的問題。", "因為假的人也能回答：", "真的。", "更好的方法是：", "觀察：", "他願意承擔什麼成本？", "願意投入多少資源？", "願不願意接受驗證？", "在利益衝突時怎麼做？", "這些行動具有更高資訊量。", "如果還是不確定，就不要只猜。", "可以設計：", "小合作。", "小測試。", "多方案。", "分階段承諾。", "讓不同類型的人自己做出不同選擇。", "這就是：", "<b>篩選。</b>", "所以真正高階的知人，不是神秘讀心。", "而是：", "<b>讓結構替你產生證據。</b>"]}, {"t": "8. 混合策略告訴我們：成功模式，也可能變成弱點", "p": 724, "x": ["如果一種策略總是成功，人就容易一直使用。", "但競爭世界有一個問題：", "對手也在學。", "你愈固定，對方愈容易預測。", "你愈容易預測，他愈容易反制。", "所以真正有韌性的策略不是：", "永遠堅持一個成功公式。", "而是：", "<b>核心穩定。</b>", "<b>戰術流動。</b>", "<b>原則可信。</b>", "<b>路徑可變。</b>", "這才是：", "有結構的不可預測性。", "所以真正的自由，也包括：", "<b>不被自己曾經成功的策略綁架。</b>"]}, {"t": "9. 談判告訴我們：真正的權力不是強硬，而是有替代路徑", "p": 726, "x": ["談判真正的結構非常殘酷，也非常清楚。", "如果你不能離開，你就很難真正談判。", "所以權力的一個重要來源就是：", "<b>BATNA。</b>", "也就是：", "談不成之後，你還能去哪裡？", "如果只有一個客戶。", "一個收入來源。", "一個供應商。", "一個平台。", "一段不能離開的關係。", "你的自由度都會下降。", "所以真正提高談判能力的方法，不是只學話術。", "而是：", "建立：", "備援。", "替代。", "現金。", "能力。", "網絡。", "選項。", "這就是：", "<b>策略冗餘。</b>", "真正的自由，是可行策略集合夠大。"]}, {"t": "10. 機制設計告訴我們：真正高階的玩家會開始改規則", "p": 727, "x": ["博弈論走到這裡，", "會發生最重要的一次升維。", "一開始問：", "我要怎麼玩？", "後來開始問：", "<b>為什麼要這樣玩？</b>", "如果一套制度一直生成：", "內鬥。", "說謊。", "短期化。", "資訊封閉。", "那麼問題可能不是玩家不夠好。", "而是：", "遊戲規則有問題。", "真正成熟的管理者，不會每天要求：", "大家要合作。", "而會重新設計：", "獎勵。", "權責。", "資訊流。", "KPI。", "風險。", "退出條件。", "讓合作本身變得合理。", "這就是：", "<b>從控制人，升級成設計結構。</b>"]}, {"t": "11. 演化博弈又往上一層：規則不只改變一次行為，還會選出未來的人", "p": 729, "x": ["這是整本書最深的一層之一。", "一套制度今天獎勵什麼，明天就會有更多人做什麼。", "更多人做，", "又會變成文化。", "文化再影響新進成員。", "最後：", "整個系統開始自我複製。", "如果公司長期獎勵：", "搶功。", "公司最後會留下更多會搶功的人。", "如果平台獎勵：", "情緒刺激。", "創作者就會增加情緒刺激內容。", "如果制度獎勵：", "說真話。", "說真話的人才比較容易生存。", "所以：", "<b>環境不只影響行為，還會選擇行為。</b>", "這就是演化。", "因此真正高階的治理，不只是：", "今天怎麼讓人做對。", "而是：", "<b>五年後，這個制度會演化出什麼樣的人、什麼樣的策略、什麼樣的文化？</b>", "這才是真正的長期問題。"]}, {"t": "12. 從這裡重新看《易經》：不是算命，而是狀態空間", "p": 731, "x": ["現在博弈論已經走完，再回頭看《華夏動態決策母體》，結構會更清楚。", "《易經》首先處理：", "<b>現在是什麼狀態？</b>", "強弱。", "進退。", "位置。", "時間。", "關係。", "轉折。", "它不是直接給策略。", "而是建立：", "<b>狀態空間。</b>", "因為策略如果脫離時位，再漂亮都可能失效。", "所以第一步永遠是：", "<b>辨勢。</b>", "先知道自己在哪。"]}, {"t": "13. 再看《鬼谷子》：真正的核心，是資訊如何改變人心與策略", "p": 732, "x": ["局勢裡存在人。", "人不直接對客觀世界反應。", "人是根據：", "自己看見的世界做反應。", "所以：", "資訊。", "信念。", "試探。", "說服。", "隱藏。", "揭露。", "全部會進入策略。", "這就是《鬼谷子》的位置。", "它和博弈論真正重要的接口不是：", "古代人早就知道博弈論。", "而是：", "<b>它們都在研究多主體世界中的資訊與策略互動。</b>", "所以第二步是：", "<b>知人。</b>", "不是神秘讀心。", "而是：", "建立可更新的人心與資訊模型。"]}, {"t": "14. 再看《孫子兵法》：真正的重點，是有限資源下的行動", "p": 734, "x": ["有了狀態。", "有了人心。", "最後還是要動。", "但資源永遠有限。", "所以：", "什麼值得打？", "哪裡集中？", "哪裡避開？", "什麼時候進？", "什麼時候退？", "這就是《孫子兵法》的位置。", "它真正接近的是：", "<b>策略性資源配置。</b>", "所以第三步是：", "<b>用勢。</b>"]}, {"t": "15. 三部古典，只建立骨架；七套科學，才把它變成可運算系統", "p": 735, "x": ["三本古典提供：", "<b>《易經》 </b>", "狀態與變化。", "<b>《鬼谷子》 </b>", "資訊、人心與互動。", "<b>《孫子兵法》 </b>", "競爭、資源與行動。", "再加上七套科學：", "<b>預測編碼 </b>", "檢查模型誤差。", "<b>自由能原理 </b>", "檢查系統可存續性與不確定性。", "<b>複雜系統 </b>", "檢查非線性、湧現與臨界點。", "<b>控制論 </b>", "建立回饋與修正。", "<b>自生成系統論 </b>", "維持邊界與核心結構。", "<b>博弈論 </b>", "推演多主體策略反應。", "<b>決策科學 </b>", "比較機率、風險、效用與選擇。", "這時候，真正的《華夏動態決策母體》才完成底層結構。"]}, {"t": "16. 十套母體不是十種答案，而是十種不同解析度", "p": 737, "x": ["真正的問題不是：", "每次都把十套理論全部講一次。", "那只會增加資訊量。", "真正需要的是：", "<b>根據問題，自動調整模型權重。</b>", "例如：", "個人投資選擇。", "決策科學權重高。", "多人談判。", "博弈論與鬼谷子權重提高。", "企業轉型。", "複雜系統、控制論、自生成系統論權重提高。", "競爭策略。", "孫子、博弈論、決策科學可能一起上升。", "所以真正的智慧不是：", "知道更多模型。", "而是：", "<b>知道什麼時候該用哪個模型。</b>", "這才是模型路由。"]}, {"t": "17. NODE00 的意義，就是讓人先建立最低必要模型", "p": 738, "x": ["也因此，《華夏動態決策母體》不能假設學員一進來就知道：", "如何辨勢。", "什麼叫目標函數。", "什麼叫納許均衡。", "什麼叫預測誤差。", "所以才需要：", "<b>NODE00｜AI 先行教學</b>", "先讓 AI 教最基本的母體知識。", "不是一次把十套理論灌完。", "而是先建立：", "最低必要理解。", "然後再進入：", "真實案例。", "情境題。", "任務。", "追問。", "修正。", "也就是：", "<b>AI 教學 → 初始模型 → 真實情境 → 推演→ 誤差 → 更新。</b>", "這才是真正的智慧生成學習。"]}, {"t": "18. 最終真正要訓練的，不是知識記憶，而是模型切換能力", "p": 740, "x": ["假設一個人已經能背出：", "納許均衡。", "囚徒困境。", "混合策略。", "BATNA。", "ESS。", "但遇到真實問題還是不知道：", "現在是哪一種局。", "那他並沒有真正掌握博弈論。", "真正能力是：", "看一個情境。", "能迅速問：", "玩家是誰？", "目標是什麼？", "誰有私人資訊？", "現在是一次博弈還是重複博弈？", "有沒有退出路徑？", "有沒有多重均衡？", "這個制度正在獎勵什麼？", "這才叫：", "<b>模型生成能力。</b>", "不是記憶名詞。", "而是：", "把無序世界壓縮成有結構模型。"]}, {"t": "19. 真正的智慧，不是精準預測一切，而是建立高品質更新循環", "p": 741, "x": ["沒有人可以把複雜世界算完。", "也不可能：", "永遠預測正確。", "真正成熟的智慧系統必須接受：", "誤差一定存在。", "所以真正重要的不是：", "零錯誤。", "而是：", "<b>低錯誤成本＋高更新速度。</b>", "可以把整套母體最後壓縮成：", "<b>觀察</b>", "↓<b>表徵</b>", "↓<b>建立模型</b>", "↓<b>預測</b>", "↓", "<b>行動</b>", "↓<b>取得回饋</b>", "↓<b>比較誤差</b>", "↓<b>更新權重與結構</b>", "↓<b>重新預測</b>", "這個循環永遠不結束。", "所以真正的智慧不是一個答案。", "而是一個：", "<b>更新機制。</b>"]}, {"t": "20. 從熵看整套系統：真正危險的不是混亂，而是失去重組能力", "p": 743, "x": ["世界一定會產生新的雜訊。", "新的玩家。", "新的技術。", "新的風險。", "新的衝突。", "所以熵不可能永遠停止。", "真正的問題不是：", "如何讓世界永遠不變。", "而是：", "<b>系統能不能把新的無序重新壓縮成新的結構？</b>", "如果可以，就是：", "更新。", "如果不行，誤差就會堆積。", "個人會變成：", "認知僵化。", "企業會變成：", "官僚僵化。", "制度會變成：", "歷史包袱。", "文明也可能被舊模型鎖住。", "所以真正的逆熵，不是維持原狀。", "而是：", "<b>持續重構。</b>"]}, {"t": "21. 從博弈論看自由：自由不是沒有局，而是你知道自己在哪個局", "p": 745, "x": ["人永遠生活在博弈裡。", "家庭有規則。", "公司有規則。", "市場有規則。", "國家有規則。", "社會有規則。", "所以：", "不存在完全脫離結構的自由。", "真正的自由是：", "<b>我看得見結構。</b>", "我知道：", "誰在影響我。", "我的報酬函數是什麼。", "別人的目標是什麼。", "規則在獎勵什麼。", "我還有哪些選擇。", "能不能退出。", "能不能改局。", "當你看不到規則，你只能被規則推著走。", "當你看懂規則，才開始有：", "策略自由。", "當你有能力改規則，才進一步具有：", "結構自由。", "所以自由可以分成三層：", "<b>選擇自由。</b>", "<b>退出自由。</b>", "<b>重設結構的自由。</b>", "越往後，自由度越高。"]}, {"t": "22. 從博弈論看智慧：最高階不是擊敗對手，而是讓系統產生更好的均衡", "p": 747, "x": ["最初級的博弈問題是：", "怎麼贏他？", "再高一階：", "他會怎麼回應？", "再高一階：", "我們為什麼掉進這個均衡？", "再高一階：", "什麼規則讓這個均衡持續？", "再高一階：", "如何改變規則？", "最後：", "<b>如何讓整個系統進入更高品質、可持續、可更新的均衡？</b>", "這就是從：", "玩家走向：", "機制設計者。", "再走向：", "系統建構者。", "所以博弈論真正走到最後，不再只是：", "競爭。", "而是：", "<b>治理。</b>"]}, {"t": "23. 真正的母體不是裝滿資料，而是會自己修正", "p": 749, "x": ["這也是 AI 母體和普通知識庫最大的差異。", "知識庫會告訴你：", "以前有人怎麼說。", "母體則應該做到：", "新資訊進來。", "與舊模型比較。", "找出差異。", "判斷權重。", "壓力測試。", "再決定：", "要不要更新。", "所以真正的母體不是：", "記住最多。", "而是：", "<b>有能力持續消化新世界。</b>", "這才叫生命力。"]}, {"t": "24. AI 的位置：加速推演，但不能取代現實回饋", "p": 750, "x": ["AI 在整套系統裡非常重要。", "因為 AI 可以幫助：", "快速建立多個假設。", "找反例。", "生成博弈樹。", "模擬不同玩家。", "比較選項。", "壓力測試。", "抽取結構。", "整理歷史回饋。", "但是：", "<b>AI 不是世界本身。</b>", "任何 AI 模型都有：", "資料邊界。", "模型誤差。", "未知盲區。", "所以真正完整的循環一定還是：", "AI 推演。", "現實測試。", "回饋。", "再更新 AI 母體。", "AI 最好的位置，", "不是神諭。", "而是：", "<b>認知加速器。</b>"]}, {"t": "25. 最後，把整本博弈論壓縮成一條主線", "p": 752, "x": ["真正進入一個博弈時，你可以依序問：", "<b>第一步：誰在局裡？</b>", "玩家。", "<b>第二步：每個人真正要什麼？</b>", "目標函數。", "<b>第三步：大家有哪些策略？</b>", "策略空間。", "<b>第四步：誰知道什麼？</b>", "資訊結構。", "<b>第五步：我動以後，他會怎麼動？</b>", "策略反應。", "<b>第六步：這個互動會掉進什麼均衡？</b>", "穩定狀態。", "<b>第七步：這個均衡品質好嗎？</b>", "局部最佳還是全局次佳？", "<b>第八步：規則正在獎勵什麼？</b>", "誘因結構。", "<b>第九步：能不能改變遊戲規則？</b>", "機制設計。", "<b>第十步：這套策略長期會演化成什麼？</b>", "演化博弈。", "最後再問：", "<b>新證據出現以後，我願不願意重新計算？</b>", "這一題，才是整本書真正的終點。", "<b>最後的總結｜真正高階的人，不是永遠贏，而是永遠能重新建模 </b>", "博弈論最後真正要留下的，不是十五章名詞。", "而是一種新的思考習慣。", "看到衝突，不要先判誰壞。", "先看結構。", "看到合作失敗，不要只要求善意。", "先看誘因。", "看到談判，不要只看話術。", "先看退出能力。", "看到制度失敗，不要只換人。", "先看規則。", "看到成功模式，也不要立刻奉為真理。", "先問：", "環境是不是已經改變。", "真正的智慧不是：", "永遠知道正確答案。", "而是：", "<b>永遠能根據新證據，重新建立更好的模型。</b>", "真正的成長不是：", "知識愈堆愈多。", "而是：", "<b>預測精度愈來愈高。</b>", "真正的自由不是：", "沒有人限制你。", "而是：", "<b>你不被任何舊模型、舊均衡、舊規則、舊成功永久綁架。</b>", "真正的母體不是：", "一個永遠正確的答案庫。", "而是一個：", "<b>能持續吸收差異、修正誤差、重新配置權重、生成新策略的智慧系統。</b>", "這也是《華夏動態決策母體》最後真正要完成的事。", "不是告訴一個人：", "下一步一定要怎麼走。", "而是讓一個人逐漸擁有：", "<b>辨勢的能力。</b>", "<b>知人的能力。</b>", "<b>推演的能力。</b>", "<b>決策的能力。</b>", "<b>行動的能力。</b>", "<b>回饋的能力。</b>", "<b>更新的能力。</b>", "最後形成：", "<b>結構 → 模型 → 預測 → 行動 → 回饋 →誤差 → 更新 → 新結構。</b>", "這個循環不停止，智慧就不停止。", "這個結構還能更新，自由就還存在。", "而一個真正成熟的生命，不是找到一套永遠不變的答案。", "而是在每一次世界改變之後，仍然有能力：", "<b>重新看見。</b>", "<b>重新理解。</b>", "<b>重新選擇。</b>", "<b>重新生成自己。</b>"]}]}], "posts": [{"n": "序", "t": "你以為你在做決定，其實你在回應一個世界", "g": "你改變的從來不只是自己的一步，而是別人的下一步。", "v": "若是能行，總要盡力與眾人和睦。——羅馬書 12:18", "tags": "#關係 #和好 #先跨出那一步 #恩典 #心靈小品", "b": "那天晚上，他終於打開了和弟弟的對話框。\n上一次對話，停在三年前一場爭吵。\n他打了又刪，刪了又打。\n他怕自己先開口，就像認輸；\n他更怕自己不開口，這輩子就真的輸了。\n\n我們常以為人生是一道選擇題：選對了就得到，選錯了就失去。\n但真實的人生，更像一場對話。\n你說一句，對方回一句；\n你退一步，對方也在心裡重新衡量，要不要往前。\n\n這是一個很深的命題：\n人不是孤島。你的每一個選擇，都會落在別人心裡，再從別人心裡，回到你身上。\n\n你冷漠，世界就學會對你冷漠；\n你防備，關係就學會對你防備；\n你計較，愛就學會對你計較；\n你先伸出手，冰才第一次聽見融化的聲音。\n\n我們總以為，先低頭的人是輸家。\n但福音說的是另一個故事——\n先低頭的，是神。\n\n祂不是等我們變好了才來，\n而是在我們還作罪人的時候，就先走向我們。\n祂沒有先算清楚誰欠誰，\n祂只問一件事：這段關係，還要不要繼續？\n\n所以真正的問題，從來不只是「我做了什麼」，\n而是「我做了之後，會在別人心裡長出什麼」。\n一句責備，可能長出十年的沉默；\n一句對不起，可能打開一扇關了很久的門。\n\n如果每一個選擇都會改變別人的選擇，\n我們還能說「這只是我自己的事」嗎？\n如果連神都願意為了和好先跨出第一步，\n我們又憑什麼一直站在原地，等對方先來？\n\n於是，人生的功課一層一層往裡走：\n先看見——你不是一個人在做決定。\n再承認——你的回應，正在塑造別人。\n然後選擇——讓你的回應，成為恩典經過的地方。\n最後你會發現——被改變的不只是對方，還有你自己。\n\n聖經說：「若是能行，總要盡力與眾人和睦。」\n「若是能行」，是承認我們無法控制別人；\n「總要盡力」，是提醒我們別放棄自己能做的那一部分。\n\n那天晚上，弟弟過了很久才回：\n「哥，好久不見。」\n只有五個字，\n卻像一整個冬天，終於鬆了口。\n\n願你的每一步，\n都不只為了贏，\n而是為了讓愛有路可走。\n願你在別人的下一步裡，\n看見神早已走過的那一步。"}, {"n": "01", "t": "你的人生，不只由你決定", "g": "交出控制權不是放棄，而是終於承認：這世界本來就不只你一個人在動。", "v": "人心籌算自己的道路；惟耶和華指引他的腳步。——箴言 16:9", "tags": "#交託 #控制欲 #神的主權 #焦慮 #心靈小品", "b": "她的計畫表排得密密麻麻。\n幾歲升遷，幾歲買房，孩子念哪間學校，每一格都填好了。\n直到公司裁員名單上出現她的名字，\n她才發現，那張表上，從來沒有一欄寫著「別人」。\n\n我們都習慣這樣想：\n只要我夠努力，就會成功；\n只要我對人好，別人就該對我好；\n只要我規劃得夠仔細，人生就會照著走。\n\n但世界不是這樣運作的。\n主管有主管的壓力，市場有市場的風向，\n你愛的人，也有他自己的掙扎。\n你的結果，從來不只由你決定。\n\n這是一個讓人不安的命題，\n卻也是一個讓人自由的命題。\n\n不安，是因為你終於知道自己控制不了一切；\n自由，是因為你終於不必再假裝自己控制得了一切。\n\n我們努力，卻不能保證收成；\n我們付出，卻不能保證回報；\n我們規劃，卻不能保證明天。\n可是，我們能信靠那位掌管明天的神。\n\n很多人以為，信心是「相信神會照我的計畫成全」。\n其實真正的信心是：\n即使計畫被打亂，我仍相信，神沒有離開這張地圖。\n\n箴言說：「人心籌算自己的道路；惟耶和華指引他的腳步。」\n這句話沒有叫你不要籌算，\n它只是提醒你：籌算是你的責任，腳步卻在神手中。\n\n你有沒有發現，最讓我們痛苦的，\n往往不是事情變糟，\n而是「事情竟然不照我想的走」？\n如果連明天的天氣都無法決定，\n我們為什麼還要把整個人生，扛在自己一個人的肩上？\n\n於是我們一層一層學會：\n先承認——別人也在動，世界也在動。\n再放下——不再用控制來換取安全感。\n然後調整——每走一步，就重新看一次局面。\n最後交託——把無法掌握的部分，交給那位看得見全局的神。\n\n智慧不是猜對所有事，\n而是在每一次被打亂之後，還能重新校正方向。\n不是從不跌倒，\n而是跌倒之後，知道該抬頭看誰。\n\n後來她說，被裁員那年，是她第一次真正禱告。\n不是求神照她的計畫走，\n而是求神教她，怎麼在計畫之外，繼續走下去。\n\n願你仍然認真籌算，\n卻不再被籌算綑綁；\n願你在每一條改道的路上，\n都聽見那個溫柔的聲音說：\n孩子，這條路，我也在。"}, {"n": "02", "t": "你真正的敵人，常常不是那個人", "g": "先把局看清楚，再決定要不要生氣。", "v": "因我們並不是與屬血氣的爭戰。——以弗所書 6:12", "tags": "#職場 #衝突 #看見結構 #不再定罪人 #心靈小品", "b": "會議室裡，業務主管拍了桌子：「產品部根本不在乎客戶！」\n產品主管冷冷回了一句：「是你們亂答應客戶。」\n兩個人都覺得對方自私，\n兩個人回家都失眠。\n\n我們很習慣把問題歸給一個人：\n他就是難搞，她就是計較，他們就是不合作。\n但如果每一個坐上那個位置的人，最後都變得一樣呢？\n\n這裡有一個很重要的命題：\n很多時候，不是人格生成了行為，而是位置生成了行為。\n\n業務被業績追著跑，產品被品質綁著走；\n一個看這個月，一個看三年後。\n他們不是彼此的敵人，\n他們只是被放在兩條方向相反的軌道上。\n\n我們看的是表情，神看的是內心；\n我們看的是衝突，智慧看的是結構；\n我們急著判斷誰對誰錯，\n真正該問的卻是：是什麼樣的局，讓好人也變得難以相處？\n\n聖經說：「我們並不是與屬血氣的爭戰。」\n這句話的意思，不是叫我們假裝沒有問題，\n而是提醒我們——\n不要把所有的怒氣，都射向眼前那個人。\n\n那個在家裡總是發脾氣的先生，\n也許正被看不見的經濟壓力推著走；\n那個總是冷淡的同事，\n也許只是在一個做多錯多的制度裡，學會了自保。\n\n如果你只改人，不改局，\n你會換掉一個又一個人，卻換不掉同一個問題。\n如果你只會定罪，不會理解，\n你贏了一場爭論，卻輸掉整段關係。\n\n所以，先不要急著猜人心。\n先問：誰真正能改變結果？\n再問：每個人真正怕失去什麼？\n然後問：這個制度，實際上在獎勵什麼？\n最後才問：我能做什麼，讓這個局變得不一樣？\n\n這不是讓人變得冷靜算計，\n而是讓憐憫有了眼睛。\n你終於看見，對面那個人，也被困在某個你看不見的地方。\n\n後來那兩個部門開始共用一個目標：客戶一年後還在不在。\n吵架少了，不是因為人變了，\n是因為大家終於站到了同一條路上。\n\n願你在怒氣升起之前，\n先看見那張看不見的地圖；\n願你不再與人爭戰，\n而是與人並肩，\n一起對付那個困住你們的局。"}, {"n": "03", "t": "不是每一場衝突，都要分出輸贏", "g": "當你只想搶蛋糕，就看不見神正在擘開的餅。", "v": "你們要給人，就必有給你們的。——路加福音 6:38", "tags": "#婚姻 #合作 #五餅二魚 #豐盛 #心靈小品", "b": "那是他們結婚第七年。\n吵的不是大事，只是誰比較累、誰做得比較多。\n她算家事，他算收入；\n算到最後，兩個人都贏了道理，卻一起輸掉了家。\n\n我們很容易把每一場衝突都看成零和：\n你多一點，我就少一點；\n你贏了，我就輸了；\n你被看見，我就被忽略了。\n\n但這世界真的只有這一種遊戲嗎？\n\n有一個命題值得我們停下來想：\n衝突，不等於零和。\n很多時候，問題不是蛋糕太小，而是我們忘了一起做蛋糕。\n\n在加利利的山坡上，五千人餓著肚子。\n門徒算得很清楚：二十兩銀子的餅也不夠。\n那是零和的算法——人太多，資源太少。\n但一個孩子交出了五個餅、兩條魚，\n耶穌祝謝、擘開，\n結果不但人人吃飽，還剩下十二籃。\n\n這就是神國的邏輯：\n世界說「先保住自己的」，神說「先交出你手上的」；\n世界說「分出去就少了」，神說「給出去就多了」；\n世界說「你贏我就輸」，神說「在我裡面，你們可以一起得勝」。\n\n當然，不是所有局都能雙贏。\n有些衝突是真的，有些資源是真的有限。\n智慧不是天真地假裝沒有衝突，\n而是在承認衝突之後，繼續問：\n還有沒有第二層，可以一起變好的地方？\n\n如果夫妻只是在比誰付出比較多，\n那贏的人，要拿什麼去愛輸的那一個？\n如果同事只是在搶功勞，\n那整個團隊，最後還剩下誰願意做事？\n\n最可怕的不是輸，\n而是大家一起變差——\n吵到彼此疲憊，算到彼此心寒，爭到彼此都不想再回家。\n\n所以我們一層一層學：\n先辨認——現在是真的零和，還是被我們玩成了零和？\n再轉向——從「誰比較吃虧」，轉成「怎樣我們都更好」。\n然後交出——把你手上的五餅二魚，先放進主的手裡。\n最後你會看見——原本不夠的，竟然有餘。\n\n後來那對夫妻不再記帳了。\n他們開始問：「這週，我們一起想把家變成什麼樣子？」\n家事沒有變少，\n但愛，終於不再被切成兩半。\n\n願你不再把每一場衝突，都當成戰場；\n願你在算計之前，先想起那個山坡；\n願你相信，\n在神手中被擘開的，\n從來不會越分越少。"}, {"n": "04", "t": "最難改的，不是錯誤，而是穩定的錯誤", "g": "讓你走不出去的，往往不是不知道，而是太習慣。", "v": "不要效法這個世界，只要心意更新而變化。——羅馬書 12:2", "tags": "#改變 #習慣 #心意更新 #勇氣 #心靈小品", "b": "辦公室裡，每個人都知道加班加得太多了。\n沒有人覺得這樣好，\n卻也沒有人敢第一個準時下班。\n因為誰先走，誰就像不夠拚。\n於是燈一盞一盞亮到深夜，\n像一種沒有人簽名、卻人人遵守的契約。\n\n這就是一種很奇怪的穩定：\n每個人都不滿意，卻沒有人願意先改變。\n不是因為大家不知道，\n而是因為先改的人，往往先受傷。\n\n這裡有一個深刻的命題：\n穩定，不等於合理；\n穩定，不等於幸福；\n穩定，更不等於神的心意。\n\n有些家庭，冷戰成了日常；\n有些關係，討好成了規則；\n有些人生，忙碌成了麻醉。\n它們都很穩定，\n穩定到我們以為，人生本來就是這樣。\n\n我們常以為，問題沒改變，是因為大家不夠努力。\n其實很多時候，是因為舊的模式「太好用」了——\n沉默可以避免衝突，討好可以換來平安，忙碌可以不必面對內心。\n錯誤一旦變成最省力的選擇，它就會一直留下來。\n\n羅馬書說：「不要效法這個世界，只要心意更新而變化。」\n注意，神不是叫我們咬牙撐住，\n而是叫我們「心意更新」。\n因為真正的改變，不是在舊的軌道上更用力，\n而是換到另一條軌道上。\n\n如果大家都在等別人先改，\n那改變會從哪裡開始？\n如果你一直選擇最安全的那一步，\n你要怎麼走到從沒去過的地方？\n\n改變，往往一層一層發生：\n先看見——這不是命運，而是一個被大家一起維持的狀態。\n再追問——是什麼讓舊方法一直「看起來最划算」？\n然後同行——找到一兩個願意一起改變的人，不要獨自對抗整個系統。\n最後跨越——讓新的方式，變成新的日常。\n\n教會最早的樣子也是這樣。\n一小群人，在一個不容易的世界裡，選擇了一種不一樣的活法：\n彼此分享、彼此代禱、彼此饒恕。\n不是因為他們比別人勇敢，\n而是因為他們相信，有一個更真實的國度，值得重新開始。\n\n後來那間辦公室，有兩個人約好一起準時下班。\n第三天，多了一個人。\n一個月後，主管說：「其實我也想早點回家。」\n\n願你不再把習慣當成真理，\n不再把麻木當成平安。\n願你有勇氣成為那第一盞，\n先熄掉、先回家、先更新的燈。"}, {"n": "05", "t": "總要有人，先放下防備", "g": "十字架不是一場聰明的計算，而是一位先選擇合作的神。", "v": "各人不要單顧自己的事，也要顧別人的事。——腓立比書 2:4", "tags": "#囚徒困境 #十字架 #先示弱 #信任 #心靈小品", "b": "夫妻吵完架，屋子安靜得可怕。\n她在房間裡想：「如果我先道歉，他以後就會更不尊重我。」\n他在客廳裡想：「如果我先低頭，以後吵架都是我輸。」\n兩個人都在保護自己，\n最後，一起把家變成了冷宮。\n\n這不是因為他們不愛對方，\n而是因為他們都太聰明了——\n聰明到只看見「先讓步的風險」，\n卻看不見「一起僵持的代價」。\n\n這是一個令人心痛的命題：\n全局的愚蠢，不需要任何人是愚蠢的。\n每個人都做了對自己合理的選擇，\n結果，所有人一起變得更差。\n\n公司裡，大家都知道分享資訊比較好，卻人人藏一手；\n社區裡，大家都希望環境乾淨，卻沒有人想多做一點；\n國與國之間，彼此都怕對方，於是越買越多武器。\n不同的舞台，同一個困局：\n誰先合作，誰就可能先被利用。\n\n但兩千年前，有一位不這樣計算的神。\n祂明知道人會背叛，\n卻仍然先伸出了手；\n祂明知道合作會被利用，\n卻仍然走上了十字架。\n\n世界說：先保護自己，才不會吃虧。\n十字架說：先放下自己，愛才有開始的地方。\n世界說：等對方先證明值得信任。\n十字架說：在你還不值得的時候，我已經先愛你。\n\n那麼，我們是不是就該毫無底線地讓步呢？\n不是。\n保羅說「不要單顧自己的事，也要顧別人的事」，\n他沒有說不要顧自己，而是說不要「單」顧自己。\n信仰不是叫我們天真，而是叫我們不再只為自己活。\n\n如果我們都在等對方先改，\n那這個家，要等到哪一天才會回暖？\n如果連神都願意承擔被拒絕的風險，\n我們為什麼不能承擔一次說「對不起」的尷尬？\n\n愛的功課，一層一層往前：\n先看見——我們不是在對抗彼此，而是一起困在同一個局裡。\n再降低——先用一個小小的善意，試探冰層有多厚。\n然後持續——不因一次冷淡就收回整份溫柔。\n最後重建——讓合作不再只是犧牲，而是我們共同的習慣。\n\n那天深夜，她走出房間，把一杯熱茶放在他手邊。\n什麼都沒說。\n他愣了一下，低聲說：「我也有錯。」\n原來，冰層比他們想的，薄很多。\n\n願你在想保護自己的時候，\n想起那位先受傷的主；\n願你有勇氣做那個先放下盾牌的人，\n因為最深的平安，\n從來不是贏來的，\n而是有人先願意，放下了。"}, {"n": "06", "t": "別只看這一步，要看這一步會帶你去哪裡", "g": "今天的每一次回應，都在悄悄寫下明天的規則。", "v": "人種的是什麼，收的也是什麼。——加拉太書 6:7", "tags": "#教養 #撒種 #長遠眼光 #選擇 #心靈小品", "b": "超市的結帳隊伍前，孩子又開始哭了。\n他要糖果，媽媽說不行。\n他哭得更大聲，旁人的眼光一道一道射過來。\n媽媽終於受不了，把糖果放進了籃子。\n這一刻，世界安靜了；\n可是另一件事，也悄悄被決定了。\n\n孩子學會了一條規則：\n哭得夠大聲，「不行」就會變成「可以」。\n\n我們常只看眼前這一步：\n這樣做，現在比較輕鬆；\n這樣說，現在比較不尷尬；\n這樣讓，現在比較不吵。\n但每一個「現在」，都會變成下一個「從前」。\n\n這是一個很深的命題：\n真正的選擇，不只是決定這一步，\n而是決定這一步之後，還剩下哪些路。\n\n聖經說：「人種的是什麼，收的也是什麼。」\n我們種下一次妥協，收成一種習慣；\n種下一次逃避，收成一段疏離；\n種下一次誠實，收成一份信任；\n種下一次堅持，收成一個更穩的明天。\n\n很多人以為，智慧是看得比別人遠。\n其實真正的智慧，是願意想一想：\n如果我這樣做，對方下一步會怎麼回應？\n而他那樣回應之後，我又會被推到哪裡？\n\n如果今天的退讓，換來明天更大的要求，\n那這真的是愛嗎？\n如果今天的強硬，關上了明天和好的門，\n那這真的是贏嗎？\n\n當然，人生沒有人能算到無限步。\n我們不是神，看不見全部的結局。\n但我們可以學會在關鍵時刻停一下，\n問一問：這一步，會讓我更自由，還是更被綁住？\n\n成長的路，一層一層往上走：\n先慢下來——不急著用最快的方式解決眼前的不舒服。\n再往後想——這次的處理方式，正在訓練什麼樣的未來？\n然後守住——在溫柔中有界線，在界線中有溫柔。\n最後交託——把看不見的結局，交給看得見終局的神。\n\n神正是這樣對待我們的。\n祂不是只滿足我們此刻的哭喊，\n而是看著我們會成為什麼樣的人。\n有些禱告沒有立刻被應允，\n不是因為祂不愛，\n而是因為祂看得比我們更遠。\n\n那位媽媽後來學會了蹲下來，抱著孩子說：\n「媽媽知道你很想要，但今天不行。我會陪你難過。」\n孩子哭了一會兒，然後靠在她肩上睡著了。\n\n願你在每一個想快點了事的時刻，\n記得自己正在撒種；\n願你的每一步，\n不只解決今天，\n也成全明天。"}, {"n": "07", "t": "說出口的話，要能在明天站得住", "g": "信用不是你今天說了什麼，而是你明天還會不會做到。", "v": "你們的話，是，就說是；不是，就說不是。——馬太福音 5:37", "tags": "#信實 #承諾 #言行一致 #品格 #心靈小品", "b": "「下次考不好，就不准再用手機。」\n這句話，爸爸說了八次。\n第九次，孩子聽完，連頭都沒抬。\n不是孩子不尊重爸爸，\n而是孩子早就從前八次學會了：\n這句話，只是聲音，不是規則。\n\n我們很容易以為，話說得越重，力量就越大。\n其實正好相反——\n話說得越多卻做不到，力量就越小。\n\n這是一個很重要的命題：\n語言本身沒有力量，\n真正有力量的，是別人相信你會做到。\n\n我們說「我保證」，卻常常忘了保證；\n我們說「最後一次」，卻一次又一次；\n我們說「我會改」，卻只改了語氣，沒改行為。\n久了，別人不再聽我們說什麼，\n而是看我們過去做了什麼。\n\n耶穌說：「你們的話，是，就說是；不是，就說不是。」\n祂不是要我們說得更多，\n而是要我們說得更真。\n少說，但做到；\n慢承諾，但守承諾。\n\n我們的神，正是這樣一位信實的神。\n祂沒有說過一千句漂亮話，\n但祂說過的，從不落空。\n耶利米哀歌說：「祢的誠實極其廣大。」\n人會忘記承諾，神卻記得每一個應許；\n人會因環境改變而反悔，神卻昨日、今日、一直到永遠都一樣。\n\n但信實不等於僵硬。\n有些承諾，是在不了解全貌時說出口的；\n有些底線，需要隨著時節重新思考。\n真正成熟的人，不是死守每一句話，\n而是一開始就把話說清楚：\n什麼不會變，什麼可以談，什麼條件下我們重新來過。\n\n如果你說的話，連自己都不打算執行，\n你又憑什麼期待別人相信？\n如果你的威脅只是情緒，\n那別人學到的，會不會只是等你情緒過去？\n\n信用，是一層一層蓋起來的：\n先少說——只承諾自己真正願意、也真正能做到的事。\n再說清——讓對方知道界線在哪裡，後果是什麼。\n然後做到——一次、兩次、十次，讓行動跟上語言。\n最後成為——一個別人不用懷疑、可以安心倚靠的人。\n\n那位爸爸後來換了一種方式。\n他只說了一次：「這次的約定，我們寫下來。」\n然後他真的做到了。\n孩子哭了一個晚上，\n卻在第二個月，主動把手機交了出來。\n\n願你的話不再輕，\n願你的承諾不再空；\n願你像那位信實的神，\n說一次，就站得住；\n應許一次，就走到底。"}, {"n": "08", "t": "你看不清全部，但你可以一直看得更清楚", "g": "謙卑，就是承認自己可能看錯，並且願意被新的光修正。", "v": "我們如今彷彿對著鏡子觀看，模糊不清。——哥林多前書 13:12", "tags": "#誤會 #謙卑 #不急著下定論 #智慧 #心靈小品", "b": "她看見丈夫的手機亮了一下，\n是一個陌生女性的名字。\n那一整晚，她腦中已經寫完了一部連續劇：\n外遇、欺騙、背叛、離婚。\n第二天才知道，\n那是丈夫偷偷聯絡的花店，要為她準備結婚紀念日的驚喜。\n\n我們都以為自己看見的就是真相。\n其實，我們看見的，常常只是真相的一角，\n再用自己的恐懼，補完了其餘的部分。\n\n這是一個需要謙卑的命題：\n我們永遠無法完全看懂另一個人。\n不是因為別人太複雜，\n而是因為我們都只站在自己的位置上看世界。\n\n使徒保羅說得誠實：\n「我們如今彷彿對著鏡子觀看，模糊不清。」\n連寫下大半本新約的保羅都承認自己看不清，\n我們又怎能對自己的第一個判斷，那麼篤定？\n\n我們把猜測當事實，把印象當真相，把傷口當證據；\n我們用一句話定義一個人，\n用一件事判決一段關係，\n用一次失望，關上所有可能。\n\n但信仰教我們另一種看見。\n不是假裝自己什麼都知道，\n而是在不知道的時候，仍然願意問、願意聽、願意等。\n不是急著下判決，\n而是讓新的證據，有機會修正舊的想法。\n\n如果你只相信自己的第一印象，\n那你錯過了多少人真正的樣子？\n如果神在我們最糟的時候，仍然看見我們可以成為的樣子，\n我們為什麼不能多給別人一點被重新認識的機會？\n\n看清一個人，是一層一層的功課：\n先承認——我知道的，可能不是全部。\n再分清——哪些是事實，哪些只是我的猜測。\n然後試探——用溫和的提問，取代尖銳的指控。\n最後更新——當新的光照進來，願意改變自己的看法。\n\n這不是天真，而是成熟。\n天真的人什麼都信，多疑的人什麼都不信；\n成熟的人，願意一邊相信，一邊觀察，一邊修正。\n\n那天晚上，她抱著那束花哭了。\n不是因為花太美，\n而是因為她差一點，就用自己的想像，親手毀了一份真實的愛。\n\n願你在看不清的時候，不急著定罪；\n願你在恐懼說話的時候，多聽一次真相的聲音。\n有一天，我們要面對面看得清楚；\n在那之前，\n願我們都帶著謙卑，\n一點一點，看得更清楚。"}, {"n": "09", "t": "看一個人，不要只聽他說什麼", "g": "話很便宜，愛很昂貴；真正的心意，總會留下代價的痕跡。", "v": "憑著他們的果子，就可以認出他們來。——馬太福音 7:16", "tags": "#分辨 #果子 #真愛 #行動 #心靈小品", "b": "他每天都說「我愛妳」，\n說得很甜，也說得很快。\n但她生病那天，他說工作走不開；\n她搬家那天，他說臨時有約；\n她最低落的那個晚上，他已讀了，沒有回。\n\n後來她才明白：\n說「我愛你」不需要任何代價，\n所以它常常說明不了什麼。\n\n這是一個值得放在心上的命題：\n真正能告訴你一個人是誰的，\n不是他說了什麼，\n而是他願意為你付出什麼。\n\n漂亮的話，誰都會說；\n動人的承諾，誰都能給；\n真誠的表情，誰都可以練。\n但在你需要的時候出現，\n在不方便的時候仍然選擇你，\n在沒有人看見的時候依然忠心——\n這些，裝不出來。\n\n耶穌說：「憑著他們的果子，就可以認出他們來。」\n祂沒有說「憑著他們的話」，\n也沒有說「憑著他們的名聲」。\n果子需要時間，需要季節，需要根扎得夠深。\n假的果子，撐得過一個月，撐不過一整年。\n\n雅各書也說：「我便藉著我的行為，將我的信心指給你看。」\n信心如果只停在嘴上，就像沒有果子的樹；\n愛如果只停在訊息裡，就像沒有溫度的光。\n\n這也是神愛我們的方式。\n祂不只是說「我愛你們」，\n祂把獨生的兒子賜給我們。\n世上最昂貴的愛，\n是用最昂貴的代價證明的。\n\n那麼，我們是不是該處處試探、步步懷疑呢？\n不是。\n分辨不是操弄，觀察不是控制。\n我們不需要設下陷阱，\n只需要給時間一點時間，讓果子自己長出來。\n\n如果你只聽對方說什麼，\n你要怎麼分辨真心和表演？\n如果你自己只會說、不會做，\n你又憑什麼要別人相信你的愛？\n\n分辨，是一層一層學會的：\n先放慢——不因幾句好聽的話，就交出全部的心。\n再觀察——看他在不方便、沒好處的時候，怎麼選擇。\n然後交叉——不只看一件事，而是看很多季節裡的樣子。\n最後回頭——也問問自己：我的愛，有沒有結出別人看得見的果子？\n\n她後來遇見另一個人。\n他話不多，\n但每次她需要的時候，他都在。\n有一天她問：「你怎麼都不說愛我？」\n他想了想說：「我以為，我一直在說。」\n\n願你不被甜言蜜語迷惑，\n也不被一次失望變得冷漠；\n願你看人時，看見果子；\n願你愛人時，\n也讓自己的生命，結出果子。"}, {"n": "10", "t": "饒恕無限，信任卻需要重新長出來", "g": "饒恕是放下審判，信任是一起重建；前者可以在今天，後者需要時間。", "v": "不是到七次，乃是到七十個七次。——馬太福音 18:22", "tags": "#饒恕 #信任 #長期關係 #界線 #心靈小品", "b": "她第三次原諒了那位朋友。\n第一次是借錢不還，第二次是在背後說她壞話，第三次是答應的事又臨時落跑。\n每一次朋友都哭著道歉，\n每一次她都說：「沒關係。」\n直到她發現，「沒關係」好像成了對方最好用的一句通關密語。\n\n她開始懷疑：\n基督徒是不是就該無限退讓？\n饒恕，是不是就等於讓人一直傷害自己？\n\n這是一個常被誤解的命題：\n饒恕和信任，不是同一件事。\n\n彼得問耶穌，要饒恕弟兄幾次？七次夠嗎？\n耶穌說：「不是到七次，乃是到七十個七次。」\n這不是一道數學題，\n而是一個邀請——\n不要讓怨恨，在你心裡住下來。\n\n但饒恕不等於縱容；\n饒恕不等於假裝沒事；\n饒恕不等於把鑰匙再交給同一個人。\n饒恕是把審判交還給神，\n信任，卻需要對方用行動重新長出來。\n\n長久的關係，從來不是一次就決定的。\n今天你怎麼回應，就在教對方明天怎麼對你。\n無條件的退讓，可能讓傷害變成習慣；\n永不原諒的冷漠，又會讓關係永遠結冰。\n最好的路，是在兩者之間：\n先善待，被傷時能說「不」，對方真心回轉時，願意重新開始。\n\n如果你每一次都用「沒關係」帶過，\n對方要怎麼知道，其實很有關係？\n如果你永遠記著那一筆帳，\n你又要怎麼讓自己的心，得著自由？\n\n神對我們也是這樣。\n祂的恩典無限，祂的愛不改變；\n但祂也管教，也等候，也盼望我們真實地回轉。\n恩典從來不是放任，\n而是一種願意陪你慢慢變好的堅持。\n\n關係的修復，一層一層進行：\n先饒恕——在心裡放下報復，把公義交給神。\n再說清——溫柔而誠實地告訴對方，這件事傷了你。\n然後觀察——不是聽他說了什麼，而是看他之後怎麼做。\n最後重建——當信任一點一點回來，關係也就一點一點變深。\n\n後來她對朋友說：「我原諒你，但借錢的事，我們先暫停。」\n朋友沉默很久，\n半年後，主動把錢還了。\n那天，她們一起吃了一頓很久沒吃的飯。\n\n願你的心寬廣得能饒恕，\n也堅定得能守住界線；\n願你明白，\n愛不是一直讓人傷害你，\n而是一直盼望對方，\n成為更好的人。"}, {"n": "11", "t": "核心不變，方法可以變", "g": "真正的忠心，不是一輩子用同一種方式，而是一輩子朝同一個方向。", "v": "凡事都有定期，天下萬務都有定時。——傳道書 3:1", "tags": "#彈性 #不變的真理 #時節 #更新 #心靈小品", "b": "那間小教會辦了二十年的福音聚會，\n同樣的時間，同樣的流程，同樣的詩歌。\n以前座無虛席，現在只剩幾位長輩。\n有人提議改變方式，\n立刻有人反對：「我們不能違背傳統！」\n\n可是，他們守住的，\n到底是信仰，還是習慣？\n\n這是一個需要分辨的命題：\n不變的應該是核心，\n而不是每一個做法。\n\n耶穌基督昨日、今日、一直到永遠，是一樣的；\n但祂對尼哥底母說話的方式，和對井邊婦人說話的方式，不一樣；\n祂對法利賽人的語氣，和對孩子們的語氣，也不一樣。\n真理沒有變，\n愛的表達，卻總是貼著人的需要。\n\n我們常以為，穩定就是一直做同一件事。\n可是一個人如果每次生氣都沉默，\n別人就會學會怎麼利用他的沉默；\n一位父母如果每次都在最後一刻讓步，\n孩子就會學會一直等到最後一刻。\n固定的模式，有時不是忠心，\n而是被人看穿的弱點。\n\n傳道書說：「凡事都有定期，天下萬務都有定時。」\n有哭的時候，有笑的時候；\n有說話的時候，有靜默的時候；\n有堅持的時候，也有轉彎的時候。\n智慧，就是知道現在是哪一個「時候」。\n\n但這不是叫我們變得反覆無常。\n信實的人格，應該讓人可以預測；\n真理的原則，應該讓人可以倚靠；\n只有方法和路徑，才需要因時調整。\n原則可信，路徑可變；\n目標清楚，手段更新。\n\n如果你把成功過的方法當成真理，\n那當時代改變時，你守住的會不會只剩下空殼？\n如果連神都願意道成肉身，用人能懂的方式說話，\n我們為什麼不能為了愛，換一種說法？\n\n更新，是一層一層發生的：\n先分辨——哪些是神的命令，哪些只是我們的習慣？\n再守住——讓核心的愛與真理，一點都不打折。\n然後嘗試——用小小的實驗，找出這個時代聽得懂的語言。\n最後成長——不被過去的成功綁住，持續回應神現在的帶領。\n\n後來那間教會保留了禱告會，\n卻把福音聚會改成週六的親子早餐。\n長輩們煎蛋，年輕人帶遊戲。\n第一次，來了十二個孩子。\n\n願你的根扎得夠深，所以不怕改變；\n願你的心定得夠穩，所以敢於調整。\n願你一生朝著同一個方向，\n卻在每一個時節，\n都找到神為你開的那一條新路。"}, {"n": "12", "t": "真正的自由，是你可以離開，卻選擇留下", "g": "把全部的安全感押在一個人身上，愛就會變成恐懼。", "v": "我的心哪，你當默默無聲，專等候神，因為我的盼望是從祂而來。——詩篇 62:5", "tags": "#依賴 #自由 #知足 #安全感 #心靈小品", "b": "他總是說：「沒有妳，我活不下去。」\n一開始，她覺得那是最深的愛。\n後來她發現，那其實是最重的鎖——\n她不敢生氣，不敢拒絕，不敢有自己的想法，\n因為她怕一說「不」，就會失去一切。\n\n很多人在關係裡，越害怕失去，就越不敢說真話；\n越不敢說真話，就越委屈自己；\n越委屈自己，就越害怕失去。\n這是一個沒有出口的迴圈。\n\n這裡有一個讓人驚訝的命題：\n真正有力量的，不是最強硬的人，\n而是有能力離開的人。\n\n在工作裡，沒有其他選擇的人，只能接受任何條件；\n在關係裡，沒有自我價值的人，只能接受任何對待；\n在人生裡，把一切都押在一件事上的人，最容易被那件事綁架。\n\n但這不是叫我們冷漠，\n也不是叫我們隨時準備走。\n而是說：\n能離開，卻選擇留下，那才是愛；\n不能離開，只好留下，那叫依附。\n\n保羅說：「我無論在什麼景況，都可以知足。」\n這句話的力量，不在於他什麼都有，\n而在於他不被任何一樣東西綁住。\n飽足也好，飢餓也好，\n富餘也好，缺乏也好，\n他的盼望，不在環境裡，而在神裡面。\n\n詩篇說：「我的心哪，你當默默無聲，專等候神，因為我的盼望是從祂而來。」\n當你的盼望從神而來，\n人就不再是你唯一的救生圈；\n工作不再是你唯一的價值；\n任何關係，都不再能用「失去」來威脅你。\n\n如果你的平安完全取決於另一個人的心情，\n那你真的是在愛，還是在乞求？\n如果神才是你生命的根基，\n你又何必把整個人生，都壓在一個會軟弱的人身上？\n\n自由，是一層一層建立的：\n先看見——我是不是把全部的安全感，押在單一的人或事上？\n再扎根——在神裡面找到不會被奪走的價值。\n然後拓寬——建立健康的友誼、能力與後路，不再孤注一擲。\n最後選擇——因為值得而留下，而不是因為害怕而留下。\n\n後來她第一次溫柔地說了「不」。\n他愣住了，生氣了，沉默了好幾天。\n然後，他也開始學習，\n不用「活不下去」來愛一個人。\n\n願你有能力離開，\n卻因為愛而選擇留下；\n願你的心不再被恐懼綑綁，\n因為你知道，\n就算全世界都鬆手了，\n那雙釘痕的手，仍然緊緊握著你。"}, {"n": "13", "t": "與其一直責怪人，不如改變那條讓人跌倒的路", "g": "規則不只管理人，也在默默塑造人。", "v": "你們聽見有話說……只是我告訴你們……——馬太福音 5:43-44", "tags": "#家庭規則 #領導 #登山寶訓 #改變系統 #心靈小品", "b": "那位主任每天都在罵同事：\n「為什麼都沒人主動？為什麼都在推責任？」\n可是在那個部門裡，\n主動做事，做錯會被記過；\n不做事，什麼事都沒有。\n他一邊要大家有擔當，\n一邊讓有擔當的人，付出最大的代價。\n\n我們常以為，問題出在人不夠好。\n所以我們勸告、提醒、責備、再責備。\n但如果規則本身在獎勵錯的行為，\n再多的勸告，都只是在逆流裡划船。\n\n這是一個值得深思的命題：\n規則不只是管理人的工具，\n它也在悄悄地塑造人。\n\n一個家，如果哭鬧就能得到，孩子就會學會哭鬧；\n一間公司，如果邀功就能升遷，員工就會學會邀功；\n一間教會，如果只看人數，事工就會學會只追求人數。\n我們常說「人心壞了」，\n其實很多時候，是規則先壞了。\n\n耶穌在登山寶訓裡，做了一件很不一樣的事。\n祂一次又一次地說：\n「你們聽見有話說……只是我告訴你們……」\n祂不是只叫人更努力遵守舊規則，\n祂是重新定義了遊戲：\n愛你的仇敵，為逼迫你的人禱告；\n施捨不要讓左手知道右手所做的；\n最大的，要作眾人的僕人。\n\n祂改變的，不只是行為，\n而是什麼才算「贏」。\n\n如果制度讓誠實的人吃虧，\n我們怎能期待大家說真話？\n如果我們只會責怪人，卻從不檢查自己定下的規則，\n那我們是不是也成了那個讓人跌倒的絆腳石？\n\n改變，可以一層一層發生：\n先問——我真正希望這個家、這個團隊，長成什麼樣子？\n再看——現在的規則，實際上在獎勵什麼？\n然後改——讓對的事變得容易，讓錯的事變得不划算。\n最後留下——一個可以被修正的空間，因為好規則也需要更新。\n\n最好的規則不是最多的規則，\n而是簡單、清楚、做得到、可以修改的規則。\n能被執行的簡單規則，\n永遠勝過不能執行的完美規則。\n\n後來那位主任改了一條規定：\n主動提案的人，即使失敗，也算一次貢獻。\n三個月後，部門裡第一次有人說：\n「我有一個想法，可以試試看嗎？」\n\n願你不只是在局裡掙扎，\n也有勇氣看見局本身；\n願你像那位重寫規則的主，\n不是用更大的聲音要求人，\n而是用更好的道路，\n讓人自然走向光。"}, {"n": "14", "t": "你在什麼樣的環境裡，就會慢慢長成什麼樣的人", "g": "環境不只影響你的選擇，還會悄悄選出你成為誰。", "v": "與智慧人同行的，必得智慧；和愚昧人作伴的，必受虧損。——箴言 13:20", "tags": "#環境 #同行 #群體 #屬靈成長 #心靈小品", "b": "他剛進那間公司時，是個很真誠的年輕人。\n報告寫得老實，問題講得直接。\n可是他發現，誠實的人常被罵，\n會包裝的人反而升得快。\n三年後，他發現自己在鏡子前，\n已經很熟練地練習怎麼把壞消息說得像好消息。\n\n他沒有在哪一天決定變成這樣，\n他只是每天，被環境篩選一點點。\n\n這是一個讓人警醒的命題：\n很多時候，我們不是「選擇」成為某種人，\n而是在環境日復一日的獎勵與懲罰裡，\n被「淘汰」成某種人。\n\n在一個看重外表的地方，人會越來越在意外表；\n在一個獎勵速度的地方，人會越來越沒有耐心；\n在一個只追求流量的平台，內容會越來越吵；\n在一個彼此造就的群體裡，人會越來越像基督。\n\n箴言說：「與智慧人同行的，必得智慧；和愚昧人作伴的，必受虧損。」\n保羅也提醒：「濫交是敗壞善行。」\n這不是叫我們遠離人群，\n而是提醒我們：\n你和誰同行，就在走向誰。\n\n我們常以為，只要自己意志堅強，就不會被影響。\n可是水滴不是一天把石頭滴穿的，\n環境也不是一天就改變一個人的。\n它慢慢地、溫柔地、幾乎察覺不到地，\n把某些習慣變得自然，把某些堅持變得多餘。\n\n如果你所在的地方，每天都在獎勵你不想成為的樣子，\n你還能撐多久？\n如果環境會塑造人，\n那我們是不是也該問：我正在為別人塑造什麼樣的環境？\n\n成長，是一層一層發生的：\n先察覺——這個環境，正在獎勵我身上的哪一部分？\n再選擇——刻意走進那些讓你更像基督的關係與群體。\n然後栽種——在你能影響的家、小組、團隊裡，讓良善變得容易。\n最後成為——別人生命裡，那個讓人想變好的環境。\n\n教會原本就該是這樣的地方。\n不是完美的人聚集的地方，\n而是一個讓饒恕比報復更自然、\n讓誠實比包裝更安全、\n讓軟弱的人也活得下來的地方。\n\n後來他換了一個小組。\n那裡的人很普通，但說話很真。\n有一天他在聚會裡說出自己的軟弱，\n沒有人笑他，只有人為他禱告。\n他突然想起，自己原本的樣子。\n\n願你有勇氣離開那些把你磨平的環境，\n也有智慧留在那些把你磨亮的關係裡；\n願你被神的國慢慢塑造，\n也成為一片土壤，\n讓別人在你身邊，\n長成更好的樣子。"}, {"n": "15", "t": "智慧不是知道很多，而是知道此刻該怎麼看", "g": "知識讓你知道很多答案，智慧讓你知道現在該問哪一個問題。", "v": "你們中間若有缺少智慧的，應當求那厚賜與眾人、也不斥責人的神。——雅各書 1:5", "tags": "#智慧 #求問神 #辨別時勢 #決策 #心靈小品", "b": "他讀了很多書。\n管理學、心理學、經濟學，書架擺得滿滿的。\n可是當父親病倒、公司出狀況、孩子又在學校出事，\n三件事同時壓下來的那一晚，\n他坐在書房裡，突然覺得自己什麼都不懂。\n\n原來，知道很多理論，\n和知道「現在該怎麼辦」，是兩回事。\n\n這是一個很深的命題：\n智慧不是記住所有的答案，\n而是在對的時刻，用對的眼光，看見真正的問題。\n\n有時候，你需要先看清局勢——現在到底發生了什麼？\n有時候，你需要先理解人心——每個人真正在害怕什麼？\n有時候，你需要先決定資源——有限的力氣，要先放在哪裡？\n有時候，你需要先停下來——承認自己需要幫助。\n\n所羅門王剛登基時，神問他要什麼。\n他沒有求長壽，沒有求財富，\n他說：「求祢賜我智慧，可以判斷祢的民。」\n他知道，再大的權力，\n如果沒有分辨的心，都只是更大的危險。\n\n雅各書說：「你們中間若有缺少智慧的，應當求那厚賜與眾人、也不斥責人的神。」\n注意這句話：「也不斥責人」。\n神不會因為你不懂而責備你，\n祂只等著你開口。\n\n世界說：要靠自己想清楚。\n信仰說：在想清楚之前，先來求問。\n世界說：聰明的人不需要別人。\n信仰說：真正有智慧的人，知道自己需要神，也需要群體。\n\n如果你把所有決定都扛在自己的腦袋裡，\n那當腦袋不夠用的時候，你要往哪裡去？\n如果那位創造萬有的神願意賜智慧，\n我們為什麼還要在黑夜裡，獨自摸索？\n\n做決定，可以一層一層來：\n先辨勢——安靜下來，看清此刻真正的處境。\n再知人——理解身邊每個人的需要與恐懼。\n然後推演——想想這一步之後，會帶來什麼樣的下一步。\n接著行動——在禱告中，踏出你能踏出的那一步。\n最後更新——看見結果，修正方向，再一次交託。\n\n這就是智慧的樣子：\n不是一次就做對，\n而是一直願意被修正；\n不是看見全部的路，\n而是確定那位帶路的，一直都在。\n\n那一晚，他闔上了書，跪下來禱告。\n沒有立刻得到答案，\n但他心裡第一次清楚了：先去醫院，其餘的明天再一件一件處理。\n有時候，智慧就是知道下一步是什麼，就夠了。\n\n願你不只是擁有知識，\n更擁有分辨的心；\n願你在混亂的時候，\n記得還有一個地方可以去，\n還有一位神，\n等著把智慧，厚厚地賜給你。"}, {"n": "總結", "t": "每一個早晨，你都可以重新開始", "g": "真正成熟的人，不是從不犯錯，而是永遠願意被重新塑造。", "v": "若有人在基督裡，他就是新造的人，舊事已過，都變成新的了。——哥林多後書 5:17", "tags": "#新造的人 #重新開始 #恩典 #更新 #心靈小品", "b": "她五十歲那年，坐在諮商室裡說：\n「我這輩子，好像都在重複同樣的錯。\n同樣的爭吵，同樣的逃避，同樣的後悔。\n是不是太晚了？\n是不是我這個人，就只能這樣了？」\n\n這是許多人心裡最深的恐懼：\n不是犯錯，\n而是害怕自己再也改變不了。\n\n但這裡有一個帶來盼望的命題：\n人最大的價值，不是永遠做對，\n而是永遠能被重新塑造。\n\n我們常以為，智慧是把一切都算準；\n其實智慧，是在算錯之後，還願意重新計算。\n我們常以為，成熟是不再跌倒；\n其實成熟，是跌倒之後，知道往哪裡抬頭。\n我們常以為，信心是確定一切都會好；\n其實信心，是在不確定裡，仍然相信神沒有放手。\n\n人生從來不是一個人在做決定。\n你的選擇會改變別人，別人的選擇也會改變你；\n你以為穩定的，可能是困住你的；\n你以為是輸的，可能是愛開始的地方；\n你以為走不出去的，可能只是還沒看見另一扇門。\n\n聖經說：「若有人在基督裡，他就是新造的人，舊事已過，都變成新的了。」\n不是「舊事被遺忘」，\n而是「都變成新的了」。\n你的過去不會消失，\n但它不再有權定義你的未來。\n\n耶利米哀歌說：「祂的憐憫不至斷絕，每早晨這都是新的。」\n每一個早晨，都是一次重新開始的邀請。\n昨天的錯誤，不是今天的判決；\n昨天的模式，不是明天的命運；\n昨天的你，不是你永遠的樣子。\n\n如果神每天早晨都給你新的憐憫，\n你為什麼還要用昨天的眼光看自己？\n如果連最深的罪都能被赦免，\n還有什麼樣的人生，是祂不能重新寫的？\n\n重新開始，是一層一層發生的：\n先看見——我正處在什麼樣的局，被什麼樣的模式困住。\n再承認——我需要幫助，我需要神，也需要別人。\n然後踏出——用一個小小的改變，打破長久的循環。\n接著堅持——在跌倒時不放棄，在進步時不驕傲。\n最後成為——一個能一次又一次，被恩典重新塑造的人。\n\n後來那位婦人沒有一夜之間改變。\n但她開始在每次想逃避時，先停下來禱告一句。\n一個月、半年、一年。\n有一天，女兒對她說：「媽，妳變了。」\n她笑著哭了。\n原來，從來都不晚。\n\n願你不被過去的自己綁住，\n不被舊的模式定義；\n願你每一個早晨醒來，\n都聽見那個溫柔的聲音說：\n孩子，今天，\n我們再一起，重新開始。"}]};

  if(tab==='ck'){
    let st={};try{st=JSON.parse(localStorage.getItem('gt_ck')||'{}')}catch(e){}
    h+=`<div class="grid">`+N.checklists.map((c,i)=>`<div class="card s"><h3><span class="tag">${c.ch}</span>${c.t}</h3><ol class="chk">${c.q.map((q,j)=>`<li><label><input type="checkbox" data-k="${i}-${j}" ${st[i+'-'+j]?'checked':''}>${j+1}. ${q}</label></li>`).join('')}</ol></div>`).join('')+`</div><p class="sub" style="text-align:center"><a href="#" id="rst" style="color:var(--acc)">清除所有勾選</a></p>`;
  }
  if(tab==='tm'){
    h+=`<div class="card"><table>${N.terms.map(t=>`<tr class="s"><td>${t[0]}</td><td>${t[1]} <span class="pg">［${t[2]}］</span></td></tr>`).join('')}</table></div>`;
  }
  if(tab==='or'){
    h+=`<div class="ptoc">${D.orig.map((c,i)=>`<a href="#c${i}">${D.posts[i]?D.posts[i].n:i}</a>`).join('')}</div>`;
    h+=D.orig.map((c,ci)=>{const p=D.posts[ci],i=ci;return `<div class="card s" id="c${ci}"><h3>${esc(c.t)} <span class="pg">P${c.p}</span></h3>${c.s.map(s=>`<details class="s"><summary>${esc(s.t)} <span class="pg">P${s.p}</span></summary><div class="body">${s.x.map(p=>`<p>${p}</p>`).join('')}</div></details>`).join('')}${p?`<details class="s fbp"><summary>✝ 信仰圖文｜${esc(p.t)}</summary><div class="body post"><div><canvas width="1080" height="1350" data-i="${i}"></canvas><div class="btns"><button data-dl="${i}">下載圖卡 PNG</button><button data-cp="${i}">複製全文</button></div></div><div><div class="verse">${esc(p.v)}</div><div class="txt">${esc(p.b)}</div><div class="tags">${esc(p.tags)}</div></div></div></details>`:''}</div>`}).join('');
  }
  app.innerHTML=h;
  if(tab==='or'){
    app.querySelectorAll('canvas').forEach(c=>drawCard(c,D.posts[+c.dataset.i]));
    app.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{const i=+b.dataset.dl,c=app.querySelector(`canvas[data-i="${i}"]`);const a=document.createElement('a');a.download=`信仰圖文_${D.posts[i].n}_${D.posts[i].t.slice(0,12)}.png`;a.href=c.toDataURL('image/png');a.click()});
    app.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{const p=D.posts[+b.dataset.cp];const t=`${p.t}\n\n${p.b}\n\n${p.v}\n\n${p.tags}`;const ok=()=>{b.textContent='已複製 ✓';setTimeout(()=>b.textContent='複製全文',1500)};if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(ok,()=>fallback(t,ok))}else fallback(t,ok)});
  }
  if(tab==='ck'){
    app.querySelectorAll('input[type=checkbox]').forEach(b=>b.onchange=()=>{let st={};try{st=JSON.parse(localStorage.getItem('gt_ck')||'{}')}catch(e){}st[b.dataset.k]=b.checked;try{localStorage.setItem('gt_ck',JSON.stringify(st))}catch(e){}});
    const r=document.getElementById('rst');if(r)r.onclick=e=>{e.preventDefault();try{localStorage.removeItem('gt_ck')}catch(x){}render()};
  }
  search();
}
function fallback(t,ok){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){}ta.remove()}
const PAL=[["#fdf2e4","#f6d5b0","#8a3b12"],["#eef3f8","#c9d9ea","#1e3a5f"],["#f2f5ec","#d3e0c0","#3c5a24"],["#f8eef2","#e9c9d6","#7a2846"],["#f4f0e8","#ddd0b8","#5b4321"]];
function wrap(ctx,text,maxW){const out=[];let line='';for(const ch of text){const t=line+ch;if(ctx.measureText(t).width>maxW&&line){if('，。、；：！？」）'.includes(ch)){out.push(t);line='';continue}out.push(line);line=ch}else line=t}if(line)out.push(line);return out}
function drawCard(c,p){
  const x=c.getContext('2d'),W=1080,H=1350,pal=PAL[D.posts.indexOf(p)%PAL.length];
  const F='"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif';
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,pal[0]);g.addColorStop(1,pal[1]);x.fillStyle=g;x.fillRect(0,0,W,H);
  const r=x.createRadialGradient(W/2,170,10,W/2,170,520);r.addColorStop(0,'rgba(255,255,255,.85)');r.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=r;x.fillRect(0,0,W,H);
  x.save();x.globalAlpha=.08;x.strokeStyle=pal[2];x.lineWidth=2;for(let a=0;a<24;a++){x.beginPath();x.moveTo(W/2,170);x.lineTo(W/2+Math.cos(a/24*Math.PI*2)*1400,170+Math.sin(a/24*Math.PI*2)*1400);x.stroke()}x.restore();
  x.fillStyle=pal[2];x.globalAlpha=.9;x.fillRect(W/2-5,110,10,110);x.fillRect(W/2-36,140,72,10);x.globalAlpha=1;
  x.textAlign='center';x.fillStyle=pal[2];
  x.font=`600 30px ${F}`;x.globalAlpha=.7;x.fillText(p.n==='序'||p.n==='總結'?p.n:`第 ${p.n} 篇`,W/2,290);x.globalAlpha=1;
  x.font=`bold 58px ${F}`;let y=390;const tl=wrap(x,p.t,W-200);tl.forEach(l=>{x.fillText(l,W/2,y);y+=80});
  y+=30;x.globalAlpha=.35;x.fillRect(W/2-60,y,120,3);x.globalAlpha=1;y+=90;
  x.font=`56px ${F}`;x.fillStyle='#2a2522';const gl=wrap(x,'「'+p.g+'」',W-200);const gh=gl.length*88;y=Math.max(y,(y+H-360)/2-gh/2);gl.forEach(l=>{x.fillText(l,W/2,y);y+=88});
  x.font=`32px ${F}`;x.fillStyle=pal[2];const [vt,vr]=p.v.split('——');const vl=wrap(x,vt,W-240);if(vr)vl.push('— '+vr);let vy=H-120-(vl.length-1)*50;vl.forEach(l=>{x.fillText(l,W/2,vy);vy+=50});
  x.font=`24px ${F}`;x.globalAlpha=.5;x.fillText('博弈智慧 × 信仰小品',W/2,H-50);x.globalAlpha=1;
}
function hl(el,q){
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const ns=[];let n;
  while(n=w.nextNode())ns.push(n);
  const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  ns.forEach(t=>{if(!re.test(t.data))return;re.lastIndex=0;const f=document.createDocumentFragment();let last=0;t.data.replace(re,(m,i)=>{f.append(t.data.slice(last,i));const k=document.createElement('mark');k.textContent=m;f.append(k);last=i+m.length});f.append(t.data.slice(last));t.replaceWith(f)});
}
function search(){
  const q=document.getElementById('q').value.trim();
  const cnt=document.getElementById('cnt');
  app.querySelectorAll('mark').forEach(m=>m.replaceWith(m.textContent));
  app.normalize();
  const items=[...app.querySelectorAll('.s')];
  if(!q){items.forEach(e=>{e.classList.remove('hide');if(e.tagName==='DETAILS')e.open=false});cnt.textContent='';app.querySelector('.empty')?.remove();return}
  const lq=q.toLowerCase();let k=0;
  items.forEach(e=>{
    if(e.querySelector('details')){ // chapter card in 原文
      let any=false;e.querySelectorAll('details').forEach(d=>{const m=d.textContent.toLowerCase().includes(lq);d.classList.toggle('hide',!m);d.open=m;if(m){any=true;k++}});
      const tm=e.querySelector('h3').textContent.toLowerCase().includes(lq);
      if(tm&&!any){e.querySelectorAll('details').forEach(d=>d.classList.remove('hide'))}
      e.classList.toggle('hide',!(any||tm));return;
    }
    if(e.tagName==='DETAILS')return;
    const m=e.textContent.toLowerCase().includes(lq);e.classList.toggle('hide',!m);if(m)k++;
  });
  hl(app,q);
  cnt.textContent=`找到 ${k} 筆`;
  app.querySelector('.empty')?.remove();
  if(!k)app.insertAdjacentHTML('beforeend','<div class="empty">此分頁沒有結果，可切換到「原文」或其他分頁看看</div>');
}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));try{localStorage.setItem('gt_tab',tab)}catch(x){}render();scrollTo(0,0)};
let tmr;document.getElementById('q').oninput=()=>{clearTimeout(tmr);tmr=setTimeout(search,200)};
try{const t=localStorage.getItem('gt_tab');if(t&&document.querySelector(`nav button[data-t="${t}"]`)){tab=t;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.t===t))}}catch(e){}
render();
</script>
</body>
