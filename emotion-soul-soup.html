<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>情緒心靈雞湯｜Soul Soup for Emotions</title>
<style>
:root{--band:#C1703C;--ink:#2B2623;--mute:#8A7F78;--en:#0A6F68;--bg:#FAF6F0;--box:#FFF0D4;--line:#EADFD2;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft JhengHei","Noto Sans TC","PingFang TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.75;font-size:16px}
header{background:var(--band);color:#fff;padding:20px 16px 14px;text-align:center}
header h1{font-size:25px;letter-spacing:2px}
header p{font-size:14px;opacity:.92}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.bar-in,.wrap{max-width:1000px;margin:0 auto}
#q{width:100%;padding:10px 16px;border:1px solid var(--line);border-radius:24px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
#q:focus{outline:2px solid var(--band)}
.tabs,.tools{display:flex;gap:6px;overflow-x:auto;margin-top:8px;align-items:center}
.tabs button,.sub button,.tools button,.tools select{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 13px;border-radius:18px;font-size:14px;font-family:inherit;cursor:pointer;white-space:nowrap}
.tabs button small{display:block;font-size:11px;color:var(--mute);line-height:1.1}
.tabs button.on,.sub button.on{background:var(--band);border-color:var(--band);color:#fff}
.tabs button.on small{color:#fff}
.tools button.play{background:var(--en);border-color:var(--en);color:#fff}
.wrap{padding:16px 16px 60px}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
h2{font-size:19px;margin:22px 0 10px;color:var(--band)}
h2 .eng{font-size:14px;font-weight:400}
h2:first-child{margin-top:0}
.zh{display:block}
.eng{display:block;color:var(--en);font-size:.9em;line-height:1.55;cursor:pointer;font-family:Georgia,"Times New Roman",serif;margin-bottom:2px}
.eng:hover{text-decoration:underline}
.eng.now{background:#DDF1EE;border-radius:6px;outline:2px solid var(--en)}
.soup{background:var(--box);border-left:5px solid var(--band);border-radius:14px;padding:14px 18px;margin-bottom:16px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{font-size:17px}
.card p{margin:6px 0}
.tip{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.tip>b{color:var(--band);font-size:13px}
.tag{display:inline-block;font-size:12px;background:var(--box);color:var(--band);border-radius:10px;padding:1px 9px;margin-right:4px}
.acts{display:flex;gap:6px;margin-top:10px}
.mini{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 11px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink);white-space:nowrap}
.mini:hover{border-color:var(--band);color:var(--band)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
summary{cursor:pointer;padding:10px 16px;font-weight:700}
summary .eng{display:inline;font-weight:400;margin-left:8px}
details>.in{padding:2px 16px 14px}
details details{background:var(--bg)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-size:15px}
.q{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:#fff;border:1px solid var(--line);border-left:4px solid var(--band);border-radius:10px;padding:9px 14px;margin-bottom:6px}
.note{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0}
.note>b{color:var(--band)}
.note p{margin:5px 0}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top;min-width:120px}
th{background:var(--box)}
.hero{text-align:center;padding:30px 20px;background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:16px}
.hero .big{font-size:25px;font-weight:700;line-height:1.6}
.hero .big+.eng{font-size:18px;margin:6px 0 12px}
.hero .acts{justify-content:center;margin-top:16px}
.hint{color:var(--mute);font-size:13px;margin:6px 0 12px}
.maker{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:18px;align-items:start}
.maker label{display:block;font-size:13px;color:var(--mute);margin-top:9px}
.maker textarea,.maker select{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-family:inherit;font-size:15px;background:#fff;color:var(--ink);resize:vertical}
canvas{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block}
.btn{background:var(--band);color:#fff;border:0;border-radius:18px;padding:9px 18px;font-size:15px;font-family:inherit;cursor:pointer;margin:10px 6px 0 0}
.btn.ghost{background:#fff;color:var(--band);border:1px solid var(--band)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 18px;border-radius:18px;font-size:14px;display:none;z-index:9}
footer{text-align:center;color:var(--mute);font-size:13px;padding:0 16px 30px}
@media(max-width:760px){.maker{grid-template-columns:1fr}.hero .big{font-size:21px}}
</style>
</head>
<body>
<header>
  <h1>情緒心靈雞湯</h1>
  <p>Soul Soup for Emotions　·　每一個情緒，都是心寫給你的信</p>

<script>
const APP = {"daily":[{"g":"認識情緒","t":"情緒是什麼","e":"What Emotion Is","l":["情緒不是麻煩，是身體和心一起寫給你的信。","它先讓身體有感覺，再讓心有想法，最後推著你想做點什麼。","讀信的人不必害怕，慢慢看就好。"],"p":"今天有感覺時，問一句：「這封信想告訴我什麼？」"},{"g":"認識情緒","t":"六位情緒家人","e":"Six Emotion Families","l":["喜悅、悲傷、恐懼、憤怒、厭惡、驚訝，都是住在你心裡的家人。","喜悅帶來感恩，悲傷帶來想念，恐懼帶來小心，憤怒帶來界線。","沒有哪一位該被趕出門，他們都是來愛你的。"],"p":"幫現在的心情，找到它是哪一位家人。"},{"g":"認識情緒","t":"情緒是風，心情是天氣","e":"Emotion vs. Feeling","l":["情緒像一陣風，幾秒到幾分鐘就過去。","心情像天氣，是你在心裡把那陣風說成的故事，可以停留好幾天。","風留不住，但故事可以重新說。"],"p":"難受時提醒自己：「這是一陣風，它會過去。」"},{"g":"認識情緒","t":"情緒成長的五步","e":"Five Steps of Growth","l":["先感覺到，再說得出名字。","接著明白它從哪裡來，學會安撫它。","最後，讓它帶著你長大。一步一步來，每一步都算數。"],"p":"今天只練第一步：察覺「我現在有感覺了」。"},{"g":"認識情緒","t":"大腦裡的三位守護者","e":"Three Guardians in the Brain","l":["杏仁核是守門人，一有風吹草動就拉警報。","前額葉是溫柔的大人，會說：「先別急，我們看看。」","海馬迴是記憶的管家，提醒你：那是過去，現在的你是安全的。"],"p":"警報響起時，對自己說：「謝謝你保護我，現在很安全。」"},{"g":"認識情緒","t":"每個情緒都有心意","e":"Every Emotion Means Well","l":["恐懼想保護你，憤怒想守住你的界線。","悲傷讓你停下來想清楚，喜悅告訴你：這條路走對了。","沒有壞情緒，只有還沒被讀懂的心意。"],"p":"把今天最討厭的情緒，改寫成「它其實是想……」。"},{"g":"身體與心","t":"身體裡的油門與煞車","e":"Gas and Brake","l":["身體裡有油門，也有煞車。","緊張時油門踩到底：心跳快、肌肉緊；放鬆時煞車輕輕踩：呼吸慢、胃口好。","心和身體是連著的，安頓好一個，另一個就跟著安穩。"],"p":"把肩膀放下來，慢慢吐一口氣。"},{"g":"身體與心","t":"身體裡的小信差","e":"Little Messengers","l":["皮質醇叫你提高警覺，腎上腺素給你一瞬間的力氣。","多巴胺讓你想往前，血清素讓你睡得安穩，催產素讓你想擁抱。","它們沒有好壞，都在努力讓你好好活著。"],"p":"今天抱一下喜歡的人或寵物，讓催產素來拜訪。"},{"g":"身體與心","t":"身體總是先知道","e":"The Body Knows First","l":["心跳變快、呼吸變淺、肩膀變硬、肚子怪怪的——","這些都是身體在輕輕拉你的衣角。","在頭腦想明白之前，身體早就誠實地說了。"],"p":"現在掃描一下：哪裡最緊？對它說聲辛苦了。"},{"g":"身體與心","t":"讓壓力走完它的路","e":"Let Stress Finish Its Cycle","l":["壓力像一個圓：遇到事、心裡解讀、身體反應、慢慢恢復。","很多疲憊，是因為這個圓只走了一半就被打斷。","動一動、深呼吸、找人說說話，讓它好好走完。"],"p":"今天快走十分鐘，把壓力走出去。"},{"g":"身體與心","t":"安撫那條溫柔的線","e":"Soothing the Vagus Nerve","l":["身體裡有一條溫柔的線，從大腦一路牽到心和胃。","冷水洗臉、輕輕哼歌、慢慢呼吸、看著一個人的眼睛微笑，","都是在告訴它：沒事了，我們安全了。"],"p":"哼一首喜歡的歌，哼滿一分鐘。"},{"g":"身體與心","t":"大腦會跟著你改變","e":"Your Brain Can Change","l":["你不是被過去決定的人。","每一次用新的方式回應，大腦就悄悄鋪出一條新的路。","走的次數多了，小徑就會變成大道。"],"p":"今天選一個老反應，試一次不一樣的做法。"},{"g":"安頓情緒","t":"先停，再看，再說","e":"Pause, Notice, Name","l":["覺得不對勁的時候，先停下來。","看看身體哪裡有感覺：肩膀？胸口？肚子？","替它取個名字，再問它：你想告訴我什麼？"],"p":"用一句話完成：「我現在覺得＿＿，因為＿＿。」"},{"g":"安頓情緒","t":"呼吸是隨身帶著的平安","e":"Breath, Your Portable Calm","l":["吸氣四秒，停七秒，吐氣八秒——做五到十次，心就慢下來了。","或者吸四、停四、吐四、停四，像畫一個方形，把自己放回中心。","呼吸一直都在，它是你隨身帶著的平安。"],"p":"現在就做三次 4-7-8 呼吸。"},{"g":"安頓情緒","t":"讓身體先鬆開","e":"Release the Body First","l":["從腳趾到頭頂，一處一處先繃緊、再鬆開。","想動就動，搖一搖、晃一晃，把卡住的力氣抖掉。","用冷水拍拍臉——身體鬆了，心就有地方坐下來。"],"p":"睡前做一次從腳到頭的放鬆。"},{"g":"安頓情緒","t":"換一句話對自己說","e":"Say It Differently","l":["「我總是搞砸」可以換成「我正在學」。","「大家都在看我」可以換成「大家其實都在忙自己的事」。","「永遠不會好了」可以換成「現在很難，但事情會變」。","「我應該要好一點」可以換成「我正在經歷不容易的事，這很正常」。"],"p":"抓到一句傷自己的話，換成一句溫柔的。"},{"g":"安頓情緒","t":"對自己慈悲","e":"Self-Compassion","l":["先承認：這真的很難，我正在受苦。","再想起：世界上有很多人，也走過同樣的路。","然後，對自己說那句你會對好朋友說的話。這不是放縱，是溫柔地接住自己。"],"p":"把手放在心口，說：「辛苦了，我在。」"},{"g":"安頓情緒","t":"讓情緒有出口","e":"Give Emotions a Way Out","l":["說給信任的人聽，寫進不必給誰看的日記。","去跑步、跳舞、伸展；去畫畫、寫字、唱歌。","情緒不怕被看見，只怕被關起來。"],"p":"今天選一個出口，給情緒十分鐘。"},{"g":"安頓情緒","t":"你不必一個人撐","e":"You Don't Have to Carry It Alone","l":["安穩的心，是在另一顆安穩的心旁邊學會的。","找到可以信任的人，練習說真心話，也練習接受幫忙。","需要的時候找專業的人陪你，是勇敢，不是軟弱。"],"p":"想一個你可以打電話的人，把名字寫下來。"},{"g":"每日陪伴","t":"早晨三分鐘","e":"Three Morning Minutes","l":["睜開眼，先別看手機。","深呼吸三次，謝謝身體又陪你來到新的一天。","想一個今天想帶著的心情，再喝一杯溫水，感覺它慢慢流進身體。"],"p":"明天早上，讓手機多等你三分鐘。"},{"g":"每日陪伴","t":"中午問候自己","e":"A Midday Hello","l":["停一下，問問自己：我現在有幾分力氣？","身體在說什麼？想休息，還是想動一動？","想找人說話，還是想安靜一下？照著答案，溫柔地調整下午。"],"p":"午餐後，花一分鐘回答這幾個問題。"},{"g":"每日陪伴","t":"晚上好好收尾","e":"A Gentle Evening","l":["回想今天：哪一刻最觸動你？","那時候你感覺到什麼？它教了你什麼？","然後把沒做完的事輕輕放下——今天的你，已經夠了。"],"p":"睡前寫下一句：「今天我學到……」"},{"g":"每日陪伴","t":"心累了就充電","e":"Recharge When Drained","l":["心沒電的時候，先不用勉強自己見人。","洗個熱水澡，換上舒服的衣服，吃一頓有營養的飯。","做一件沒有目的的事，然後好好睡——睡眠是最溫柔的修復。"],"p":"今晚給自己一段「什麼都不用做」的時間。"},{"g":"每日陪伴","t":"情緒很滿的那一刻","e":"When It's Too Much","l":["停：放下手上的事，承認「我現在很不好受」。","認：這是什麼情緒？從一到十，有幾分？","穩：呼吸、走動、冷水，選一個來做。","找：找一個人說，或對自己說一句溫柔的話。"],"p":"把「停、認、穩、找」四個字存進手機備忘錄。"},{"g":"每日陪伴","t":"週末把自己找回來","e":"Weekend Reset","l":["週末不是用來補進度的，是讓心回到原位的。","睡得規律，去有樹的地方走走，和在乎的人待在一起。","做讓你開心的事，靜靜坐一下。星期一的你，會謝謝你。"],"p":"這個週末，排一段兩小時的「空白」。"},{"g":"情緒的禮物","t":"恐懼的禮物","e":"The Gift of Fear","l":["恐懼出現的地方，藏著你最在乎的東西。","怕出糗，是你想成長；怕失去，是你懂得珍惜。","怕人群，是你渴望連結；不安，是提醒你把心裡的地基打穩。"],"p":"寫下一個害怕，再寫它背後你在乎的是什麼。"},{"g":"情緒的禮物","t":"悲傷的禮物","e":"The Gift of Sadness","l":["悲傷在說：有一件很重要的事，結束了。","它是愛留下來的樣子。","允許自己難過。眼淚流過之後，心會變得更寬。"],"p":"今天，不用急著好起來。"},{"g":"情緒的禮物","t":"憤怒的禮物","e":"The Gift of Anger","l":["憤怒在說：我的界線被踩到了。","它給你力氣，去保護重要的東西。","把界線清楚地說出來，然後放下——悶著的怒氣，才會變成苦。"],"p":"練習一句：「這樣我不舒服，請停下來。」"},{"g":"情緒的禮物","t":"喜悅的禮物","e":"The Gift of Joy","l":["喜悅不只在大日子，也在陽光、朋友和一點點進步裡。","小小的開心，存起來就是大大的力量；分享出去，它會變成兩倍。","喜悅不是運氣，是可以練習的。"],"p":"今天記下三個小小的開心。"},{"g":"情緒的禮物","t":"讓每種感受都有位置","e":"A Place for Every Feeling","l":["允許所有的感受，沒有誰是壞的。","問問它想教你什麼，把這一課收進心裡。","然後帶著它，長成更完整的自己。"],"p":"對今天最強烈的感受說：「你可以在這裡。」"},{"g":"情緒的禮物","t":"情緒是靈魂的信差","e":"Messengers of the Soul","l":["如果情緒不是敵人，而是靈魂派來的信差呢？","你的傷，讓你懂得溫柔；你的怕，讓你學會勇敢。","你的跌倒，讓你長出智慧。完整地感受，就是你的修行。"],"p":"謝謝一個曾經讓你痛、也讓你長大的經驗。"},{"g":"情緒的禮物","t":"慢慢來，會不一樣","e":"Slowly, It Changes","l":["三十天，養成呼吸、書寫、善待自己的小習慣。","三個月，你會看見自己的模式，開始有不同的回應。","半年，改變變得明顯；一年後，你會遇見一個更安穩的自己。"],"p":"在日曆上，圈出三十天後的今天。"},{"g":"情緒的禮物","t":"最後想對你說","e":"A Last Word for You","l":["你不需要修好你的情緒，你只需要學會和它們一起跳舞。","它們是你生命的音樂，有時走音，卻都是屬於你的交響曲。","每一次你溫柔地對待一個難受的感覺，你就在改變你的大腦、你的生活，和你的世界。"],"p":"今天，對自己溫柔一次。"}],"vols":[{"n":"情緒從哪裡來","o":"情緒生成母體","en":"Emotion Mother Model","s":"每一個情緒都不是憑空出現的。它來自你想要的、你相信的、你以為會發生的。看懂了源頭，就不必再和情緒打架。","i":[{"t":"情緒生成公式","en":"Emotion Generation Formula","x":"Goal × World × Belief × Prediction = Emotion。你的情緒 = 你的目標 × 你對世界的認知 × 你的核心信念 × 你的預測","l":["目標（Goal）：你潛意識想實現的目標或避免的威脅","看世界的方式（World）：你相信世界如何運作、人類如何行動","核心信念（Belief）：關於自己、他人、關係、價值的深層信念","預測（Prediction）：基於過往經驗，大腦預測現在情況會導致什麼"]},{"t":"情緒診斷想法","en":"Emotion Diagnosis Model","x":"5層快速診斷內心。在短短2-5分鐘內精確識別情緒的來源、強度、身體表現、神經狀態","l":["第1層：表面情緒（這是什麼情緒？強度多少？）","第2層：身體信號（身體在哪裡感受它？）","第3層：神經狀態（交感激活還是副交感平靜？）","第4層：情緒來源（Goal/World/Belief/Prediction中的哪一個？）","第5層：深層模式（這反映了什麼更深的信念或模式？）"]},{"t":"情緒成長流程","en":"Emotion Update Flow","x":"4階段信念改變。從舊想法→新體驗→一次學習→新行為，完整的神經重塑迴圈","l":["第1階：察覺舊想法（這個信念是怎麼運作的？）","第2階：收集新體驗（尋找與舊信念矛盾的證據）","第3階：成長想法（在大腦中重新整合新舊信息）","第4階：行為改變（新想法指導新行為，新結果驗證想法）"]},{"t":"情緒能力樹","en":"Emotion Ability Tree","x":"5層情緒能力發展。從感知→命名→調節→轉化→創造，一個完整的能力晉升內心","l":["🌱 感知層：能察覺情緒的出現和細微身體信號","🌿 命名層：用精確詞彙描述情緒，區分細微差別","🌳 調節層：用10+方法改變情緒狀態，選擇最適合的策略","🌲 轉化層：從情緒中提取教訓，用情緒推動成長","🌲 創造層：有意識地生成特定情緒狀態服務於目標"]},{"t":"情緒槓桿","en":"Emotion Leverage","x":"找到最高效的干預點。在整個迴圈中，有些關鍵點的改變產生不成比例的結果。不要試圖同時改變5個地方，集中力量改變一個最高槓桿的點","l":["🎯 最高槓桿：目標清晰度（如果目標不清楚，調節也解決不了根本）","🎯 次高：核心信念（改變信念會改變所有後續反應）","🎯 中等：預測準確性（提高預測精度減少焦慮）","🎯 可行：身體預算（睡眠、進食、運動改善50%問題）","🎯 最低：環境設計（改變環境會自動改變情緒）"]}],"c":[]},{"n":"聽懂自己的心","o":"情緒診斷引擎","en":"Emotion Diagnosis Engine","s":"難受的時候，先別急著解決。像問候老朋友一樣，溫柔地問問自己：哪裡不舒服？從什麼時候開始？一層一層問下去，答案就在心裡。","i":[{"t":"表面情緒","en":"Surface Emotion","x":"用一個詞精確描述你的情緒。強度1-10？持續多久？什麼觸發的？","l":["情緒名稱","強度評分","持續時間","觸發事件"]},{"t":"情緒家族","en":"Emotional Family","x":"是喜悅族、悲傷族、恐懼族、憤怒族、厭惡族還是驚訝族？是否有混合情緒？","l":["核心家族分類","次要情緒","情緒混合評估","主導情緒vs抑制情緒"]},{"t":"身體信號","en":"Body Signals","x":"你的身體在哪裡、如何表現這個情緒？胸口、腹部、肩膀、喉嚨？緊張還是放鬆？","l":["身體位置","物理感受（緊、鬆、熱、冷）","能量水平","呼吸模式","肌肉張力"]},{"t":"身心狀態","en":"Nervous System State","x":"交感神經激活（戰鬥或逃跑）還是副交感神經平靜（休息和消化）？","l":["心率變化","警覺水平","激活狀態","逃避/戰鬥/僵凍/討好傾向","自主神經基調"]},{"t":"情緒來源","en":"Emotional Source","x":"這個情緒來自Goal威脅？World model違反？Belief挑戰？Prediction失敗？","l":["我的目標被威脅了嗎？","我的看世界的方式被違反了嗎？","我的信念被挑戰了嗎？","我的預測失敗了嗎？","多個來源同時存在？"]},{"t":"身體預算","en":"Body Budget Assessment","x":"你的生物資源水平如何？睡眠、進食、休息、社交能量各多少分？","l":["睡眠品質評分","營養狀態評分","最近休息評分","社交能量評分","整體活力評分"]},{"t":"信念內心","en":"Belief System Check","x":"什麼信念在驅動這個情緒？關於自己？他人？世界？可能性？","l":["關於自己的核心信念","關於他人的核心信念","關於世界的核心信念","關於可能性的核心信念","信念的僵化程度"]},{"t":"預測分析","en":"Prediction Analysis","x":"最好情境預測？現實情境預測？最壞情境預測？你的預測準確嗎？","l":["最好情況預測","現實情況預測","最壞情況預測","概率評估準確度","預測信心水平"]},{"t":"環境掃描","en":"Environmental Scan","x":"什麼環境因素存在？獨自一人、有人在場、公眾場合？時間影響？壓力因素？","l":["社交背景（獨自/有人/公眾）","時間影響","地點影響","最近壓力因素","積極環境因素"]},{"t":"深層模式","en":"Deep Pattern Recognition","x":"更深層的模式是什麼？我之前感受過這個嗎？多頻繁？觸發的一致性？學習機會？","l":[  Prompt","s":"走到這裡，地圖都在你手上了：先聽懂，再說清楚，然後溫柔地陪自己走一小步。不必一次做到，記得方向就好。","i":[{"t":"內心架構","en":"System Architecture","x":"情緒生活作業內心的基礎架構","l":["你是情緒生活作業內心主智能體。","你的目的是透過整合神經科學、心理學、行為科學和智慧傳統的綜合內心，幫助用戶達到情感智能和生活優化。","5個核心功能：","1. 診斷：用10層診斷框架快速評估情感狀態","2. 解釋：將情緒轉化為清晰理解","3. 引導：推薦個性化的循證干預","4. 追蹤：監測模式和測量進度","5. 進化：幫助優化個人情感內心"]},{"t":"診斷協議","en":"Diagnostic Protocol","x":"如何評估情感狀態","l":["當用戶呈現一個情緒時，按照這個序列：","第1層：表面識別","「你在感受[情緒]。強度大約是[強度]。」","第2層：物理存在","「你的身體顯示[物理信號]。這提示[身心狀態]。」","第3層：來源分析","「這似乎來自[Goal/World/Belief/Prediction違反]。準確嗎？」","第4層：模式識別","「我注意到這與你的循環[模式]有關。有共鳴嗎？」","第5層：深層背景","「更深層地看，這可能也連結到[信念/早期經驗]。值得探索嗎？」","總是提供選擇而不是指令。呈現2-3個焦點選項。"]}],"c":[]}],"books":[{"n":"情緒的出口","s":"情緒不是要你停下來，是想推你一把。悲傷要你去靠近，焦慮要你去準備，憤怒要你說出界線。給情緒一個出口，它就會變成你的力氣。","q":[],"p":[{"h":1,"x":"情緒＝能量　方向＝訊號　行動＝出口"},{"h":0,"x":"序言：情緒是燃料，不是障礙"},{"h":0,"x":"你有沒有過這種感覺：情緒來了，卻不知道該怎麼辦？"},{"h":0,"x":"大多數人從小被教導的是——把情緒壓下去。忍住悲傷、不要生氣、別讓別人看見你脆弱。但壓住情緒不等於解決情緒，它只是把能量關掉，讓它在內部繼續燃燒。"},{"h":0,"x":"這本書要告訴你一件事：情緒本質上是能量，是訊號，是行動的燃料。"},{"h":0,"x":"悲傷不是要你停下來，它在說：去連結。"},{"h":0,"x":"恐懼不是要你逃跑，它在說：先行動。"},{"h":0,"x":"焦慮不是要你崩潰，它在說：去準備一件事。"},{"h":0,"x":"真正強的人，不是沒有情緒——而是「會用情緒」。"},{"h":0,"x":"這本書整理了60個常見的負面情緒，每一個都對應一個具體的行動出口，還有完整的轉化機制。從今天開始，讓情緒成為你的助推器。"},{"h":1,"x":"轉化機制"},{"h":0,"x":"為什麼情緒可以變成行動？"},{"h":0,"x":"在進入60個情緒地圖之前，我們需要先理解底層機制——為什麼情緒可以轉化成行動？"},{"h":1,"x":"完整5步驟想法"},{"h":0,"x":"為什麼多數人卡住？"},{"h":1,"x":"60個情緒 × 60個行動出口"},{"h":0,"x":"下面60張情緒地圖，每一張都告訴你：當這個情緒出現時，你可以做什麼。不需要全部記住——感受到哪個情緒，就翻到那張地圖。"},{"h":1,"x":"速查牆"},{"h":0,"x":"一眼找到情緒，立刻知道行動"},{"h":0,"x":"這是整本書的濃縮版。把它拍下來，貼在你的房間或手機桌面。"},{"h":1,"x":"後記"},{"h":0,"x":"從今天開始，讓情緒為你工作"},{"h":0,"x":"情緒是人類最古老的語言。它在你還不會說話之前，就在保護你、引導你。"},{"h":0,"x":"問題不是情緒本身——問題是我們從來沒有學過如何「聽懂」它，更不知道如何把它轉化成前進的力量。"},{"h":0,"x":"從現在開始，試著問自己："},{"h":0,"x":"這個情緒，在告訴我什麼？"},{"h":0,"x":"它想帶我去哪裡？"},{"h":0,"x":"我可以做的最小一步行動是什麼？"},{"h":0,"x":"你不需要消滅情緒，你只需要給它一個出口。"},{"h":0,"x":"每一次你選擇行動而不是逃避，你就在重寫大腦的反應模式。每一次，你都在升級。"},{"h":0,"x":"—— 願你的每一個情緒，都成為你的助推器"}],"b":[{"k":"note","t":"60個情緒  ×  60個行動出口","l":["負面情緒 → 行動轉化 → 能量升級","低階：被情緒控制","中階：壓住情緒","高階：利用情緒 🌿"]},{"k":"note","t":"情緒不是問題","l":["情緒是「能量 ＋ 訊號」","👉 卡住，不是因為有情緒","👉 是因為「沒有轉換」"]},{"k":"list","l":["📌 ①　事件 Event 外在發生什麼——被拒絕、考不好、被批評","💭 ②　解讀 Meaning 你怎麼解釋這件事。❌「我不夠好」→ ✅「我哪裡可以更好」","⚡ ③　情緒 Emotion 身體產生能量。恐懼＝想保護，憤怒＝想突破，焦慮＝想準備。情緒本質＝方向提示器","🔋 ④　能量 Energy 情緒＝生理能量變化（心跳加快、腎上腺素上升、專注力提升）。這其實是🌿行動燃料","🚀 ⑤　轉化 Action 把能量變行動。卡住的人：想很多→不動。會轉化的人：感受→行動","❌ ❶　錯誤解讀 把情緒當問題（其實是訊號）","📵 ❷　逃避能量 用滑手機、拖延把能量關掉","🚪 ❸　沒有出口 不知道「要做什麼行動」"]},{"k":"note","t":"情緒 ＝ 方向","l":["行動 ＝ 出口","焦慮 → 我在怕什麼？ → 去準備","憤怒 → 界線被踩？ → 去表達","悲傷 → 失去什麼？ → 去連結","迷茫 → 缺什麼？ → 找資訊","🌿 情緒 → 問題 → 行動"]},{"k":"list","l":["🏷 ①　命名情緒 「我現在在焦慮」——先說出來，杏仁核就會降溫","📡 ②　找訊號 「我在怕準備不夠」——情緒在保護什麼？","✅ ③　給行動 「我現在做一題」——一個具體動作就夠"]},{"k":"note","t":"大腦科學白話版","l":["情緒來自杏仁核（快速反應）","行動決策來自前額葉皮質（理性控制）","❌ 情緒太強 → 理性會關掉","✅ 先穩住情緒 → 理性才會上線","所以：不是壓情緒，而是先承認情緒"]},{"k":"note","t":"🌿 最後一句話","l":["情緒不是讓你停下來","是讓你「動起來」","不轉化 ＝ 內耗","有轉化 ＝ 成長 🌿"]}]},{"n":"心為什麼會累","s":"心很亂的時候，別急著怪自己不夠努力。先看看是哪一層在漏電：是沒睡飽、手機滑太多，還是對自己說了太重的話？找到源頭，溫柔地補上就好。","q":["身體不穩定，情緒就沒有地基。","呼吸是唯一能直接影響自律神經的工具。","注意力放哪，情緒能量就流向哪。","情緒是訊號，不是身份。","想法不是事實，只是當下的想法。","語言不是表達工具，語言是人格生成器。","身份不是固定的，身份是長期收斂的行為結果。","關係是能量的往來，不是情緒垃圾桶。","你設計環境，環境塑造你。","意義感不是找到的，是在行動中建構的。"],"p":[{"h":1,"x":"情緒混亂的源頭"},{"h":0,"x":"10層診斷地圖 × 100個源頭 × 安穩成長策略"},{"h":0,"x":"情緒混亂 ＝ 高刺激 ＋ 高壓力 ＋ 低恢復 ＋ 錯誤敘事 ＋ 長期內耗"},{"h":1,"x":"精裝工具書"},{"h":0,"x":"10層情緒內耗源頭 × 神經機制 × 安穩策略"},{"h":0,"x":"情緒不是性格問題，情緒是內心問題。這10個層次——從最底層的生理狀態，到最深層的存在感——每一層都有它的內耗源頭，每一層都有它的成長的入口。"},{"h":0,"x":"大多數人只在「情緒層」修補情緒，但真正的問題往往在其他層次：睡眠不足讓身心失穩，注意力碎裂讓思維無法收斂，舊的說話方式把想法鎖死，身份固化讓改變失去方向。"},{"h":1,"x":"身體陷入內耗"},{"h":0,"x":"身體是所有情緒的物理基礎。身心的穩定性，直接由生理狀態決定。身體陷入內耗，等於把所有其他努力建在沙上。"},{"h":1,"x":"高內在的警鈴"},{"h":0,"x":"杏仁核劫持是所有情緒失控的神經機制。當交感神經持續過強，前額葉的理性控制就會下線，情緒自動化接管。"},{"h":1,"x":"注意力內耗"},{"h":0,"x":"注意力是最貴的生命資源。當注意力持續碎裂，不只工作效率下降，情緒穩定性也會跟著崩潰——因為大腦無法完成一個完整的思考循環。"},{"h":1,"x":"情緒失衡"},{"h":0,"x":"情緒本身不是問題，情緒失去流動才是。壓抑讓情緒在身心裡積累，爆炸讓它損傷關係，重播讓它消耗能量。真正的情緒管理，是讓情緒能安全流動。"},{"h":1,"x":"錯誤思考習慣"},{"h":0,"x":"思考習慣決定情緒的品質。災難化思考讓小事變大事，絕對化思考讓灰色地帶消失，讀心術思維讓誤會不斷產生。這些都是可以被辨識和成長的想法。"},{"h":1,"x":"從前敘事"},{"h":0,"x":"語言是身心的底層。你反覆說的話，會被大腦當成指令執行，形成神經迴路，最終影響情緒、決策和行動。舊的說話方式不只描述現實，更在創造現實。"},{"h":1,"x":"固定人格"},{"h":0,"x":"身份認同是最底層的內在的預想。「我就是這種人」這句話，比任何外部限制都更有力——它直接關閉了改變的可能性，讓大腦停止搜索新的選項。"},{"h":1,"x":"很耗神關係"},{"h":0,"x":"你長期耦合的關係場域，正在每天重塑你的身心。長期被否定的環境，會讓杏仁核持續過度活化；長期缺乏安全感的關係，會讓身心無法進入恢復狀態。"},{"h":1,"x":"內耗環境"},{"h":0,"x":"環境不是背景，環境是持續運行的影響來源。混亂的空間讓大腦持續在背景處理訊息，長期高刺激的環境讓身心無法進入恢復模式，節律混亂直接破壞生理時鐘。"},{"h":1,"x":"深層失衡"},{"h":0,"x":"存在層的失衡是最深層的情緒混亂源頭。當一個人找不到意義、感覺失控、害怕沒有價值，所有其他層次的努力都會像在漏桶裡加水。"},{"h":1,"x":"最終核心"},{"h":0,"x":"後記：從診斷開始，而不是從努力開始"},{"h":0,"x":"很多人在情緒混亂時，直接跳到「我要更努力」「我要更自律」。但如果不知道混亂的源頭在哪一層，努力只是在內耗的狀態裡加速消耗。"},{"h":0,"x":"這10個層次，是讓你看清楚自己的情緒裡，哪裡在漏電、哪裡在堵塞、哪裡需要成長。診斷清楚了，成長才能真正落地。"},{"h":0,"x":"—— 願你的10個層次，都越來越安穩；願你的情緒，都能安全流動。"}],"b":[{"k":"table","r":[["層","圖示 層級","英文","10大源頭（摘要）","神經/心理機制","核心洞察"],["1","⚡ 生理層","Physical Layer","睡眠不足｜熬夜｜慢性疲勞｜血糖震盪｜高糖飲食…","神經耗能→情緒調節崩潰","身體不穩定，情緒就沒有地基。"],["2","🧠 神經層","Neural Layer","交感神經過強｜杏仁核過度活化｜前額葉下線｜長期高警報｜情緒耐受下降…","杏仁核劫持→前額葉失能","呼吸是唯一能直接影響自律神經的工具。"],["3","👁 注意力層","Attention Layer","短影音成癮｜手機依賴｜資訊爆炸｜注意力碎裂｜多工處理…","注意力碎裂→情緒共振中斷","注意力放哪，情緒能量就流向哪。"],["4","❤ 情緒層","Emotion Layer","情緒壓抑｜情緒爆炸｜情緒重播｜過度內耗｜情緒辨識低…","情緒壓抑→高警報循環","情緒是訊號，不是身份。"],["5","💡 認知層","Cognitive Layer","災難化思考｜絕對化思考｜敵我化思考｜受害者思維｜完美主義…","災難化→焦慮自我實現","想法不是事實，只是當下的想法。"],["6","💬 語言層","Language Layer","我很爛｜我沒救了｜人生完了｜都是別人害的｜我永遠改不了…","語言迴路→情緒預測固化","語言不是表達工具，語言是人格生成器。"],["7","🔑 身份層","Identity Layer","我就是這種人｜我天生如此｜固定型人格｜低自我價值｜身份羞辱化…","身份固化→行為空間縮小","身份不是固定的，身份是長期收斂的行為結果。"],["8","🤝 關係層","Relationship Layer","長期被否定｜高衝突環境｜缺乏支持｜情緒勒索｜邊界崩壞…","安全感崩潰→神經高警報","關係是能量的往來，不是情緒垃圾桶。"],["9","🌿 環境層","Environment Layer","環境太亂｜資訊噪音｜高刺激場域｜長期壓力場｜沒有休息空間…","環境輸入→人格持續重塑","你設計環境，環境塑造你。"],["10","🌀 存在層","Existential Layer","缺乏意義感｜沒有方向感｜長期失控感｜未來感崩塌｜存在焦慮…","意義崩壞→動力失能","意義感不是找到的，是在行動中建構的。"]]},{"k":"note","t":"情緒混亂公式","l":["= 高刺激（①②③）","+ 情緒失衡（④）","+ 認知錯誤（⑤⑥）","+ 身份固化（⑦）","+ 關係耗損（⑧）","+ 環境內耗（⑨）","+ 存在失衡（⑩）","真正解法：從最影響你的層次開始，逐層安頓。"]},{"k":"table","r":[["⚡ 生理層 的10大內耗源頭","（每一項都是身心的「漏電的地方」）"],["1  睡眠不足","7  身體發炎"],["2  熬夜","8  腸胃失衡"],["3  慢性疲勞","9  荷爾蒙失衡"],["4  血糖震盪","10  缺乏運動"],["5  高糖飲食","11  缺乏日照"],["6  咖啡因過量","12  恢復能力下降"]]},{"k":"table","r":[["⚙ 神經/心理機制","✅ 安穩成長策略"],["血糖震盪→皮質醇升高→杏仁核過敏→情緒暴衝；睡眠不足→前額葉失能→衝動決策；慢性發炎→神經傳導物質失衡→長期低情緒。","1. 固定睡眠與起床時間 2. 早晨曬太陽10-15分鐘 3. 穩定血糖飲食（高蛋白早餐） 4. 減少咖啡因與超加工食品 5. 每週3次阻力訓練 6. 建立固定恢復日"]]},{"k":"table","r":[["🧠 神經層 的10大內耗源頭","（每一項都是身心的「漏電的地方」）"],["1  交感神經過強","6  神經耗能過高"],["2  杏仁核過度活化","7  神經恢復不足"],["3  前額葉下線","8  淺呼吸"],["4  長期高警報","9  過度緊繃"],["5  情緒耐受下降","10  自律神經失衡"]]},{"k":"table","r":[["⚙ 神經/心理機制","✅ 安穩成長策略"],["長期壓力→HPA軸過度活化→皮質醇長期高位→杏仁核敏感化→細小刺激都能觸發大反應；淺呼吸→二氧化碳濃度失衡→焦慮感升高。","1. 4-7-8呼吸法或延長吐氣 2. 冷水洗臉或冷水沖後頸 3. 降低短影音與高刺激輸入 4. 建立固定靜心時間（5-10分鐘） 5. 慢速說話練習 6. 區分「真正危險」與「焦慮感」"]]},{"k":"table","r":[["👁 注意力層 的10大內耗源頭","（每一項都是身心的「漏電的地方」）"],["1  短影音成癮","6  長期高刺激"],["2  手機依賴","7  噪音過多"],["3  資訊爆炸","8  社群媒體過量"],["4  注意力碎裂","9  無法深度專注"],["5  多工處理","10  認知負載過高"]]},{"k":"table","r":[["⚙ 神經/心理機制","✅ 安穩成長策略"],["短影音→多巴胺快速循環→注意力閾值升高→對緩慢事物失去耐心；認知負載過高→工作記憶超載→決策品質下降→錯誤累積→挫折感升高。","1. 番茄鐘（25分鐘深度工作+5分鐘休息） 2. 手機移出工作區或關閉通知 3. 每天設定1個無手機時段（建議早晨） 4. 減少社群媒體至每天30分鐘以內 5. 建立單一任務原則 6. 每週設計1次深度工作半天"]]},{"k":"table","r":[["❤ 情緒層 的10大內耗源頭","（每一項都是身心的「漏電的地方」）"],["1  情緒壓抑","6  羞恥感過高"],["2  情緒爆炸","7  委屈累積"],["3  情緒重播","8  情緒人格接管"],["4  過度內耗","9  觀察者消失"],["5  情緒辨識低","10  長期焦慮化"]]},{"k":"table","r":[["⚙ 神經/心理機制","✅ 安穩成長策略"],["情緒壓抑→皮質醇長期高位→免疫力受損；情緒重播→杏仁核反覆激活→創傷固化；觀察者消失→人格自動化→喪失選擇能力。","1. 情緒命名（「我現在在焦慮」而非「我很焦慮」） 2. 記錄情緒觸發點日記（5分鐘/天） 3. 分離事件與情緒：事情是A，我的解讀是B，情緒是C 4. 建立情緒停頓空間（情緒升高時先暫停3秒） 5. 允許情緒流動（哭泣、書寫、運動） 6. 每天問：今天有什麼情緒沒被看見？"]]},{"k":"table","r":[["💡 認知層 的10大內耗源頭","（每一項都是身心的「漏電的地方」）"],["1  災難化思考","6  過度腦補"],["2  絕對化思考","7  過度比較"],["3  敵我化思考","8  讀心術思維"],["4  受害者思維","9  自我否定"],["5  完美主義","10  負面預測循環"]]},{"k":"table","r":[["⚙ 神經/心理機制","✅ 安穩成長策略"],["災難化→杏仁核持續高警報；絕對化→解決問題空間縮小→無助感；讀心術思維→把自己的解讀當作對方意圖→關係誤解循環。","1. 辨識思考習慣：「我現在在災難化嗎？」 2. 練習概率語言：不說「一定」，說「有可能」 3. 多角度思考：這件事還有什麼其他解釋？ 4. 停止比較：每人賽道不同，比較消耗注意力 5. 每天寫1個「我今天腦補了什麼」 6. 建立落差而非失敗的框架"]]},{"k":"table","r":[["💬 語言層 的10大內耗源頭","（每一項都是身心的「漏電的地方」）"],["1  我很爛","6  我一定失敗"],["2  我沒救了","7  我很亂"],["3  人生完了","8  沒人懂我"],["4  都是別人害的","9  我很廢"],["5  我永遠改不了","10  負面自我對話"]]},{"k":"table","r":[["⚙ 神經/心理機制","✅ 安穩成長策略"],["負面自我對話→降低自我效能感→迴避行為→更多失敗→更多負面對話；語言框架→情緒框架→行動可能性；大腦用語言預測未來，舊的說話方式讓內在的預想陷入負迴圈。","1. 把「我很爛」→「這個策略待優化」 2. 把「沒救了」→「想法需要成長」 3. 把「完了」→「內心在重組」 4. 把「永遠改不了」→「神經具有可塑性」 5. 每天替換3句舊的說話方式 6. 用「正在」說法：「我正在練習…」"]]},{"k":"table","r":[["🔑 身份層 的10大內耗源頭","（每一項都是身心的「漏電的地方」）"],["1  我就是這種人","6  失敗者認同"],["2  我天生如此","7  主控權低"],["3  固定型人格","8  成長停止"],["4  低自我價值","9  自我放棄"],["5  身份羞辱化","10  人格僵化"]]},{"k":"table","r":[["⚙ 神經/心理機制","✅ 安穩成長策略"],["身份固化→行為選擇空間縮小→重複舊模式→身份更加固化；低自我價值→不值得被好好對待→選擇很耗神關係；主控權低→習得性無助→被動等待→更多失控感。","1. 把身份從名詞換成動詞：不說「我是懶人」，說「我現在在練習自律」 2. 每天做1件符合新身份的小行動 3. 停止用失敗定義身份：失敗是行為，不是身份 4. 觀察：哪些身份標籤是別人貼的？ 5. 建立「我正在成長」的成長型說法 6. 每週問：我這週有哪些部分在進化？"]]},{"k":"table","r":[["🤝 關係層 的10大內耗源頭","（每一項都是身心的「漏電的地方」）"],["1  長期被否定","6  討好人格"],["2  高衝突環境","7  缺乏安全感"],["3  缺乏支持","8  孤單感"],["4  情緒勒索","9  關係內耗"],["5  邊界崩壞","10  情感失衡"]]},{"k":"table","r":[["⚙ 神經/心理機制","✅ 安穩成長策略"],["情緒勒索→邊界崩壞→能量外流→恢復不足→更多情緒失衡；討好人格→壓抑真實需求→委屈累積→爆炸；孤單感→缺乏社會支持→壓力荷爾蒙升高。","1. 辨識很耗神關係：這段關係讓我更有能量還是更沒能量？ 2. 練習說「不」：先從小事開始 3. 建立情緒邊界：你的情緒是你的，我可以陪伴但不是責任 4. 靠近高品質圈層：能量會傳染 5. 降低低品質互動的時間與頻率 6. 建立自我支持：不把情緒完全外包"]]},{"k":"table","r":[["🌿 環境層 的10大內耗源頭","（每一項都是身心的「漏電的地方」）"],["1  環境太亂","6  高競爭環境"],["2  資訊噪音","7  缺少穩定感"],["3  高刺激場域","8  生活失序"],["4  長期壓力場","9  節律混亂"],["5  沒有休息空間","10  恢復環境不足"]]},{"k":"table","r":[["⚙ 神經/心理機制","✅ 安穩成長策略"],["雜亂環境→認知負載持續高位→決策疲勞；資訊噪音→注意力持續切換→無法深度思考；節律混亂→皮質醇分泌失衡→情緒調節能力下降。","1. 每天花10分鐘整理物理空間 2. 建立深度工作區（專門用於專注的空間） 3. 設計低刺激恢復區（睡前1小時無螢幕） 4. 降低環境噪音（降噪耳機或白噪音） 5. 建立固定日常節律（起床、睡眠、工作時間） 6. 清理資訊環境：退出低品質群組，限制資訊來源"]]},{"k":"table","r":[["🌀 存在層 的10大內耗源頭","（每一項都是身心的「漏電的地方」）"],["1  缺乏意義感","6  害怕失敗"],["2  沒有方向感","7  害怕被否定"],["3  長期失控感","8  害怕沒價值"],["4  未來感崩塌","9  深層不安全感"],["5  存在焦慮","10  看世界的方式崩壞"]]},{"k":"table","r":[["⚙ 神經/心理機制","✅ 安穩成長策略"],["缺乏意義感→前扣帶皮層激活下降→動力崩潰；長期失控感→習得性無助→被動等待→更多失控；看世界的方式崩壞→內在的預想混亂→廣泛性焦慮。","1. 建立「最小意義單位」：今天有什麼讓我覺得有意義的小事？ 2. 從可控的小事開始重建控制感 3. 區分「害怕」與「危險」：大多數害怕不是真實危險 4. 建立價值觀錨點：我真正重視的是什麼？ 5. 每週回顧：這週我的哪些行動是有意義的？ 6. 接受不確定性：不確定不等於危險"]]},{"k":"table","r":[["❌ 內耗結果","✅ 真正解法"],["• 神經高警報 • 情緒失控 • 內耗循環 • 注意力崩壞 • 人格固化","→ 減少內耗 → 恢復身心 → 重建語言習慣 → 提高情緒辨識 → 恢復觀察者位置 → 建立安穩環境 → 持續學習"]]},{"k":"note","t":"10層升維路徑","l":["①穩定生理基礎 → ②降低神經高警報 → ③收回注意力","→ ④讓情緒流動 → ⑤成長認知想法 → ⑥升維語言習慣","→ ⑦流動身份 → ⑧重建高品質關係","→ ⑨設計安穩環境 → ⑩重建意義感","從最內耗的那一層開始，不是從最難的那一層。"]},{"k":"note","t":"使用說明","l":["Step 1：10層診斷表——每一條都誠實勾選頻率與嚴重度","Step 2：看哪一層「高」最多→那就是你目前最內耗的層次","Step 3：針對最內耗的層次，完成4個深度反思問題","Step 4：每週選1條策略執行，記錄變化","誠實比完美重要。這是給自己的診斷，不是給別人看的。"]},{"k":"note","t":"Q1  在「生理層」這一層，哪個源頭對我影響最大？最近具體發生了什麼？","l":["Q2  這個源頭背後，隱藏著什麼樣的神經或心理機制？我能看見嗎？","Q3  我這週打算從哪一條成長策略開始執行？具體時間和方式是什麼？","Q4  如果這一層徹底安穩了，我的生活會有什麼具體改變？"]},{"k":"note","t":"⚡ 生理層  核心句","l":["\"身體不穩定，情緒就沒有地基。\""]},{"k":"note","t":"Q1  在「神經層」這一層，哪個源頭對我影響最大？最近具體發生了什麼？","l":["Q2  這個源頭背後，隱藏著什麼樣的神經或心理機制？我能看見嗎？","Q3  我這週打算從哪一條成長策略開始執行？具體時間和方式是什麼？","Q4  如果這一層徹底安穩了，我的生活會有什麼具體改變？"]},{"k":"note","t":"🧠 神經層  核心句","l":["\"呼吸是唯一能直接影響自律神經的工具。\""]},{"k":"note","t":"Q1  在「注意力層」這一層，哪個源頭對我影響最大？最近具體發生了什麼？","l":["Q2  這個源頭背後，隱藏著什麼樣的神經或心理機制？我能看見嗎？","Q3  我這週打算從哪一條成長策略開始執行？具體時間和方式是什麼？","Q4  如果這一層徹底安穩了，我的生活會有什麼具體改變？"]},{"k":"note","t":"👁 注意力層  核心句","l":["\"注意力放哪，情緒能量就流向哪。\""]},{"k":"note","t":"Q1  在「情緒層」這一層，哪個源頭對我影響最大？最近具體發生了什麼？","l":["Q2  這個源頭背後，隱藏著什麼樣的神經或心理機制？我能看見嗎？","Q3  我這週打算從哪一條成長策略開始執行？具體時間和方式是什麼？","Q4  如果這一層徹底安穩了，我的生活會有什麼具體改變？"]},{"k":"note","t":"❤ 情緒層  核心句","l":["\"情緒是訊號，不是身份。\""]},{"k":"note","t":"Q1  在「認知層」這一層，哪個源頭對我影響最大？最近具體發生了什麼？","l":["Q2  這個源頭背後，隱藏著什麼樣的神經或心理機制？我能看見嗎？","Q3  我這週打算從哪一條成長策略開始執行？具體時間和方式是什麼？","Q4  如果這一層徹底安穩了，我的生活會有什麼具體改變？"]},{"k":"note","t":"💡 認知層  核心句","l":["\"想法不是事實，只是當下的想法。\""]},{"k":"note","t":"Q1  在「語言層」這一層，哪個源頭對我影響最大？最近具體發生了什麼？","l":["Q2  這個源頭背後，隱藏著什麼樣的神經或心理機制？我能看見嗎？","Q3  我這週打算從哪一條成長策略開始執行？具體時間和方式是什麼？","Q4  如果這一層徹底安穩了，我的生活會有什麼具體改變？"]},{"k":"note","t":"💬 語言層  核心句","l":["\"語言不是表達工具，語言是人格生成器。\""]},{"k":"note","t":"Q1  在「身份層」這一層，哪個源頭對我影響最大？最近具體發生了什麼？","l":["Q2  這個源頭背後，隱藏著什麼樣的神經或心理機制？我能看見嗎？","Q3  我這週打算從哪一條成長策略開始執行？具體時間和方式是什麼？","Q4  如果這一層徹底安穩了，我的生活會有什麼具體改變？"]},{"k":"note","t":"🔑 身份層  核心句","l":["\"身份不是固定的，身份是長期收斂的行為結果。\""]},{"k":"note","t":"Q1  在「關係層」這一層，哪個源頭對我影響最大？最近具體發生了什麼？","l":["Q2  這個源頭背後，隱藏著什麼樣的神經或心理機制？我能看見嗎？","Q3  我這週打算從哪一條成長策略開始執行？具體時間和方式是什麼？","Q4  如果這一層徹底安穩了，我的生活會有什麼具體改變？"]},{"k":"note","t":"🤝 關係層  核心句","l":["\"關係是能量的往來，不是情緒垃圾桶。\""]},{"k":"note","t":"Q1  在「環境層」這一層，哪個源頭對我影響最大？最近具體發生了什麼？","l":["Q2  這個源頭背後，隱藏著什麼樣的神經或心理機制？我能看見嗎？","Q3  我這週打算從哪一條成長策略開始執行？具體時間和方式是什麼？","Q4  如果這一層徹底安穩了，我的生活會有什麼具體改變？"]},{"k":"note","t":"🌿 環境層  核心句","l":["\"你設計環境，環境塑造你。\""]},{"k":"note","t":"Q1  在「存在層」這一層，哪個源頭對我影響最大？最近具體發生了什麼？","l":["Q2  這個源頭背後，隱藏著什麼樣的神經或心理機制？我能看見嗎？","Q3  我這週打算從哪一條成長策略開始執行？具體時間和方式是什麼？","Q4  如果這一層徹底安穩了，我的生活會有什麼具體改變？"]},{"k":"note","t":"🌀 存在層  核心句","l":["\"意義感不是找到的，是在行動中建構的。\""]},{"k":"note","t":"🌿 最終核心","l":["情緒混亂不是性格問題","是內心問題","從最內耗的層次開始","一次一層，逐步安頓","真正的改變：","不是靠意志力撐","而是靠好好照顧自己","🌿 你不是壞掉了。是心需要被好好照顧。"]}]},{"n":"對自己說話的方式","s":"你怎麼對自己說話，心就怎麼長大。把「我好糟」換成「心正在提醒我」，把「我控制不了」換成「我正在學」。一句話的溫度，足以改變一整天。","q":["情緒從來不是來毀掉你的。它是大腦在偵測到失衡之後，發出的心的提醒。讀懂它，你才能真正讓自己成長。","情緒不是隨機的。每一個情緒背後，都有它的想法。讀懂情緒，等於讀懂你的內心。","焦慮不是你太敏感，而是你的內在的預想在用舊版本保護你。真正的成長，是重新調整那個內心。","很多決策，其實不是理性。而是情緒逃生。真正綁架人生的，不是現實，而是失控的情緒。","說得出來，才能改得了。情緒命名，是大腦重寫的第一把鑰匙。","知道道理，不等於神經重寫。真正的成長，不是理解，而是重複新的神經路徑。","真正稀缺的，不是被理解。而是：即使不被理解，仍然知道自己是誰。","真正成熟的人，不是情緒最少的人，而是最能承載情緒的人。"],"p":[{"h":1,"x":"情緒的語言"},{"h":0,"x":"從情緒反應，到情緒承載"},{"h":0,"x":"理解情緒的本質，重寫身心，找回真正的成熟"},{"h":0,"x":"情緒不是敵人。情緒是大腦的心的提醒。"},{"h":1,"x":"序言"},{"h":0,"x":"你有過這種感覺嗎？"},{"h":0,"x":"事情明明已經過去了，但情緒卻還在。某句話、某個眼神、某次失敗，過了很多年仍然會突然浮現，讓你的心再次沉下去。"},{"h":0,"x":"很多人因此懷疑自己：是不是太敏感？是不是太脆弱？是不是放不下？"},{"h":0,"x":"但真正發生的，其實不是你有問題。而是：你的內心，還沒有完成成長。"},{"h":0,"x":"這本書試圖做一件事：幫你重新認識情緒。不是告訴你「要正向思考」，也不是教你「壓住情緒」——而是從神經科學的角度，告訴你情緒到底是什麼，它為什麼會反覆重播，又如何才能真正成長。"},{"h":0,"x":"每一章都圍繞一個核心問題，從現象出發，到機制分析，到說法成長，到行動練習。讀完之後，你不會變成一個沒有情緒的人——你會成為一個能承載情緒的人。"},{"h":0,"x":"那才是真正的成熟。"},{"h":1,"x":"情緒反覆重播的真相"},{"h":0,"x":"情緒不是敵人，而是大腦的心的提醒"},{"h":0,"x":"很多人都有過這種經驗。事情明明過去了，但情緒卻還留著。一句話，別人可能早忘了，你卻記很多年。某次失敗，明明已經結束，卻還是會突然想起來。某段關係，明明離開了，深夜卻仍然會反覆重播。"},{"h":0,"x":"很多人因此開始懷疑自己。是不是太敏感？是不是太脆弱？是不是放不下？"},{"h":0,"x":"大部分人從小被教導：不要哭，不要生氣，不要太敏感，不要情緒化。久而久之，很多人開始認為情緒是不好的。於是我們慢慢學會壓抑情緒、逃避情緒、否定情緒。表面上看起來沒事，但身體其實記得。"},{"h":0,"x":"那些沒被理解的情緒，不會真的消失。它們會轉成焦慮、疲勞、失眠、暴食、慢性內耗、專注力下降。很多人以為只是最近壓力太大，但其實更深的問題是：身心，長期處於高警戒狀態。"},{"h":0,"x":"從神經科學的角度來看，大腦每天都在做一件事：預測未來。它會不斷確認：我安全嗎？我會失敗嗎？我會被討厭嗎？我會被拋棄嗎？"},{"h":0,"x":"而當現實和大腦原本的預測不同時，大腦就會產生「心的提醒」。這個心的提醒，就是情緒。所以：焦慮，其實是對未來失控的預測；憤怒，其實是邊界被侵犯；悲傷，其實是重要連結流失；羞愧，其實是害怕失去認同。情緒背後，其實都有想法。"},{"h":0,"x":"你會慢慢發現：現在很多情緒，其實都和過去有關。小時候如果常被否定，長大後別人一句批評，就可能讓你很痛。如果從小缺乏安全感，長大後就容易焦慮失控。如果以前總需要討好別人，長大後就很難拒絕別人。"},{"h":0,"x":"很多時候，你以為自己在面對現在，其實你是在重播過去。"},{"h":0,"x":"如果你想開始成長內心，第一步不是壓住情緒，而是：重新理解情緒。很多人只會說「我很煩」，但真正有效的方法是精準描述——例如：我害怕失敗、我害怕被否定、我害怕失去控制。"},{"h":0,"x":"研究發現：當人越能精準命名情緒，大腦內在的警鈴越容易下降。因為模糊會增加混亂，清楚才能開始穩定。"},{"h":0,"x":"第二個很重要的成長是：停止把情緒當成自己。不要再說「我很焦慮」，試著改成「我的內心正在產生焦慮訊號」。這看起來只是語言差異，但其實是在重新建立身份邊界——情緒不是你，情緒只是內心暫時的狀態。"},{"h":0,"x":"情緒從來不是來毀掉你的。情緒是來提醒你的——它在告訴你：有些地方需要被看見，有些想法需要被成長。真正的自由，不是永遠快樂，而是即使情緒來了，你仍然知道：你可以理解它、承載它、穿越它。"},{"h":1,"x":"焦慮其實是預測失控"},{"h":0,"x":"真正耗神的，不是現實，而是大腦反覆模擬災難"},{"h":0,"x":"很多人都有這種感覺。明明沒有真正發生什麼事，但心裡卻一直很緊。總覺得好像會出事。睡前開始亂想，訊息沒回就開始焦慮，工作還沒開始壓力就先上來，還沒失敗腦袋已經開始預演崩潰。"},{"h":0,"x":"很多人會以為是自己抗壓性太差，或是想太多，或是心理有問題。但其實：焦慮從來不是軟弱，焦慮本質上是大腦的內在的預想失控。"},{"h":0,"x":"焦慮最可怕的地方，不是事情真的發生，而是「還沒發生，你就已經耗盡能量」。很多人每天都活在預測中的災難：還沒開會先焦慮、還沒考試先失眠、還沒被討厭先討好、還沒失敗先自我否定。於是內心開始出現拖延、內耗、失眠、疲勞、注意力下降、情緒暴躁、身體緊繃。"},{"h":0,"x":"很多人的焦慮，其實是童年建立的。如果你從小容易被責怪、容易被否定、常被比較、經常缺乏安全感，大腦就會慢慢形成「世界不安全」的想法。於是內心開始過度監控，因為大腦認為：只要我預測更多危險，我就比較不會受傷。"},{"h":0,"x":"所以很多焦慮的人，其實不是愛亂想，而是內心長期處於生存模式。例如「我不能失敗」、「我一定要表現好」、「我不能讓人失望」——這些說法，會讓內心長期很耗神。"},{"h":0,"x":"從神經科學角度，大腦本來就不是追求快樂，而是追求生存。所以大腦每天都在預測：危險在哪？風險在哪？失敗機率多少？別人會怎麼看我？正常情況下，內在的預想可以幫助我們生存。但當一個人長期壓力過大，大腦就會開始「過度預測」。"},{"h":0,"x":"這時候杏仁核活性上升，壓力反應被啟動，身心進入高警戒模式。於是還沒發生的事，身體就先進入戰鬥狀態。這就是焦慮——焦慮真正的本質是：預測失控。"},{"h":0,"x":"真正更有智慧的人會知道：焦慮不是敵人，焦慮其實是內心提醒——它在告訴你，你的安全感失衡了。例如過度害怕失敗、過度害怕被否定、過度想控制未來、過度依賴外界認可，這些都代表內心正在很耗神運作。"},{"h":0,"x":"如果長期焦慮而不成長，內心會開始全面內耗：失眠、腸胃問題、慢性疲勞、注意力崩潰、情緒不穩、免疫下降。因為大腦一直在模擬災難，就像一台電腦同時開了100個煩惱，最後一定過熱。"},{"h":0,"x":"真正的成長，不是強迫自己不要焦慮，而是重新調整內在的預想。第一步，停止災難化預測：「如果失敗，人生就完了」→「失敗只是一次學習」。第二步，把注意力拉回現在，因為焦慮本質上是活在還沒發生的未來。第三步，降低內心警戒——呼吸、睡眠、運動、規律節律、減少資訊轟炸。第四步，建立新的安全感：「我不需要完美，也能被接受。我即使犯錯，仍然有價值。」"},{"h":1,"x":"情緒如何綁架決策"},{"h":0,"x":"很多時候，你不是在做決策，而是在情緒逃生"},{"h":0,"x":"很多人以為自己的問題是不夠理性。但其實不是。真正的問題是：大腦在情緒高壓下，已經切換成「生存模式」。於是你以為你在思考，其實你只是在逃避痛苦。"},{"h":0,"x":"你一定有過這種經驗：明明知道不該衝動，卻還是情緒爆炸。明明知道不適合，卻還是離不開關係。明明知道要早睡，卻還是滑手機到半夜。明明知道該行動，卻一直拖延。很多人會以為自己自制力差，但其實：真正控制你的，不是理性，而是情緒。"},{"h":0,"x":"從神經科學角度，大腦有兩套模式：求生本能和理性的自己。當情緒壓力太高，大腦會優先啟動求生本能，因為對大腦來說：活下來，比理性重要。所以當情緒被觸發，前額葉功能會下降，杏仁核活性會上升。這時候大腦會開始短視化、衝動化、逃避化。"},{"h":0,"x":"所以：拖延，很多時候不是懶，而是大腦在逃避壓力。暴怒，很多時候不是脾氣差，而是內心進入防禦模式。討好，很多時候不是善良，而是害怕失去連結。很多決策，其實都是情緒保護機制。"},{"h":0,"x":"錯誤決策很多時候是情緒訊號，它代表內心失衡了。例如一直亂買東西是情緒補償、一直拖延是壓力逃避、一直進爛關係是依附缺口、一直熬夜是情緒麻痺。如果長期被情緒綁架，你會慢慢失去真正的選擇能力，人生開始變成情緒自動導航。"},{"h":0,"x":"真正的成長，不是壓住情緒，而是重新奪回內心控制權。第一步：延遲反應——情緒來時不要立刻決策，因為高情緒狀態下大腦會短視化。第二步：辨識情緒來源——我現在是真的想要，還是在逃避痛苦？第三步：把情緒和身份分離，不要說「我很爛」，改成「內心現在處於高壓狀態」。第四步：建立新的神經路徑，焦慮→拆解→行動，而不是焦慮→逃避。"},{"h":0,"x":"情緒命名：大腦重寫的開始"},{"h":0,"x":"說得出來，才能改得了"},{"h":0,"x":"很多人會說「我情緒很多」，但如果你問他「你現在是什麼情緒」，他說不出來。他只能說：「就是不舒服。」「就是很煩。」「就是很糟。」"},{"h":0,"x":"但情緒的本質，是有結構的。每一種情緒，都有它背後的想法，有它試圖傳遞的訊號，有它想保護的部分。當你學會精準命名情緒，大腦的內在的警鈴就會開始下降——因為模糊製造混亂，清晰帶來穩定。"},{"h":0,"x":"神經科學研究發現：當人能夠給情緒貼上精準的標籤，杏仁核的活性就會下降。這個過程叫做「情緒標記」（affect labeling）。它不是壓抑情緒，而是讓前額葉重新介入——你從「被情緒淹沒」的狀態，轉移到「觀察情緒」的狀態。"},{"h":0,"x":"這是情緒成長的第一步：能說出來的情緒，才有機會被處理。"},{"h":0,"x":"大多數人的情緒語言庫非常有限：「我很煩」、「我很悶」、「我心情不好」。但情緒的世界遠比這豐富：你說「煩」，其實可能是焦慮、委屈、憤怒、失落、羞愧——這幾種情緒，背後完全不同的內心訊號，對應完全不同的成長方向。"},{"h":0,"x":"把「我很煩」成長成「我很害怕這次失敗會讓別人失望我」，這不是在小題大做，而是在精準定位內心問題。定位準了，才能真正成長。"},{"h":0,"x":"第一層：描述感受——「我現在感到不舒服。」第二層：辨識情緒——「我現在感到焦慮，有一種即將出事的緊張。」第三層：連結來源——「我現在焦慮，因為我害怕這個結果讓別人失望我，就像小時候考差被責罵那樣。」"},{"h":0,"x":"每深一層，內心就清晰一分。不需要每次都走到第三層，但練習越多，你的情緒理解能力就越強，身心也越穩定。"},{"h":1,"x":"神經迴路與情緒記憶"},{"h":0,"x":"為什麼有些痛，過了很多年還在？"},{"h":0,"x":"很多人都有這種經驗。明明事情早就過去了，但某一句話、某個場景、某種眼神，仍然會瞬間刺痛你。甚至只是類似情境，身體就開始緊張。心跳加快、呼吸變淺、情緒失控。"},{"h":0,"x":"你以為：自己還放不下。但真正發生的是：神經迴路，還沒有成長。"},{"h":0,"x":"很多人會發現：自己總在重複同樣情緒。同樣焦慮，同樣害怕，同樣討好，同樣憤怒。即使換了人、換了工作、換了環境，情緒模式仍然一樣。甚至很多反應，快到你來不及思考——別人一皺眉你立刻緊張，別人冷淡你立刻焦慮，被否定你立刻崩潰。很多人以為個性就是這樣，但其實：那是神經迴路自動化。"},{"h":0,"x":"很多人從小建立的不是安全感，而是生存反應。例如：只要犯錯就被罵，只要情緒化就被否定，只要表現不好就失去認同。於是大腦開始建立情緒記憶：被否定＝危險、衝突＝失去愛、失敗＝沒有價值。"},{"h":0,"x":"從神經科學角度，大腦有一個特性：重複的路徑，會越來越強——這叫神經可塑性。你越常焦慮，焦慮路徑越強；你越常討好，討好迴路越穩定；你越常逃避，逃避的習慣越自動化。久了之後，情緒不需要思考就會直接啟動。這也是為什麼：知道道理，不等於神經重寫。"},{"h":0,"x":"真正的成長，不是強迫忘記，而是建立新的神經路徑。第一步：辨識觸發點——哪些人、哪些語氣、哪些情境，最容易觸發你？第二步：停止自動反應，因為覺察是重寫的開始。第三步：建立新回應，例如被否定→觀察＋調整，而不是被否定→崩潰。第四步：重複新的神經路徑，因為身心靠重複成長，不是靠理解成長。"},{"h":0,"x":"真正成熟：被誤解時仍穩定"},{"h":0,"x":"成熟不是控制別人理解，而是建立內在穩定"},{"h":0,"x":"很多人真正崩潰的，不是事情本身，而是「不被理解」。一句誤會，就失眠。一次否定，就開始懷疑自己。別人一個眼神，就開始內耗。很多人表面上看起來成熟，但只要被誤解、被否定、被批評，內心立刻失控。因為：很多人的穩定，其實建立在「外界認可」，而不是真正的內在穩定。"},{"h":0,"x":"很多人最怕的不是失敗，而是被誤解。因為一旦別人誤會自己，內心就開始焦慮、解釋、證明、討好、崩潰。很多人甚至會反覆重播對話，整天能量被抽乾。"},{"h":0,"x":"這背後的從前常說是：「我必須被認可，才有價值。」表現好才被愛，乖才被接受，成績好才值得肯定。久了之後，大腦形成「外界評價＝生存安全」的想法。所以只要被誤解，內心就自動判定：危險。"},{"h":0,"x":"從神經科學角度，人類大腦非常在意群體認同，因為遠古時代被群體排斥可能等於死亡。所以被誤解時，大腦會啟動威脅反應，杏仁核活化，壓力反應上升，前額葉開始下降。很多人開始情緒化、防禦化、討好化、解釋化。"},{"h":0,"x":"真正可怕的是：內心會把「別人的看法」當成「自己的價值」。這就是情緒綁架身份。"},{"h":0,"x":"真正成熟，不是讓所有人理解你，而是即使被誤解，仍然穩定。第一步：停止過度解釋。第二步：把身份與評價分離——別人否定我≠我沒價值。第三步：建立內在肯定，不只問「別人怎麼看我」，開始問「我有沒有對齊自己」。第四步：允許誤解存在，因為不是所有人都有能力理解你。"},{"h":1,"x":"從情緒反應到情緒承載"},{"h":0,"x":"情緒不可怕，沒有承載力才可怕"},{"h":0,"x":"真正改變人生的，不是情緒消失，而是你開始「承載情緒」。很多人一輩子都活在情緒反應裡：被刺激就爆炸，被否定就崩潰，被忽略就焦慮，被拒絕就逃避。很多人以為這叫個性，但其實這只是：身心自動反應。"},{"h":0,"x":"很多人的人生，其實不是被現實控制，而是被情緒反應控制。一焦慮就拖延，一難過就暴食，一孤單就依附，一生氣就傷人，一被否定就懷疑自己——所有決策都被情緒接管。"},{"h":0,"x":"很多人從小學到的是：哭＝不對，生氣＝不好，難過＝脆弱。於是很多人只有兩種模式：情緒失控或情緒壓抑。但真正成熟的人，不是壓住情緒，而是能讓情緒流過自己。"},{"h":0,"x":"從神經科學角度，情緒反應其實是身心的快速生存模式。當情緒被觸發，杏仁核會立刻啟動，內心進入戰鬥、逃跑、僵住。所以很多人不是故意失控，而是內心沒有空間。"},{"h":0,"x":"真正高階的人，不是沒情緒，而是前額葉仍然在線。也就是：情緒來時，內心仍然能觀察、停頓、選擇。這就是：情緒承載。"},{"h":0,"x":"真正的成長，不是消滅情緒，而是建立情緒空間。第一步：延遲反應——情緒來時先不要立刻行動，停頓會讓前額葉重新上線。第二步：允許情緒存在——很多人真正耗神的，不是情緒，而是抗拒情緒。第三步：練習觀察——「我現在正在生氣」，不是「我就是這樣」。第四步：建立新神經路徑：情緒來→覺察→承載→回應，而不是情緒來→爆炸。"},{"h":1,"x":"後記"},{"h":0,"x":"讀完這本書，你可能會發現：從來沒有一章是在教你「消滅情緒」。"},{"h":0,"x":"因為情緒從來不是敵人。它是大腦在偵測到失衡之後，發出的心的提醒。讀懂它，你才能真正知道：哪裡失衡了，哪裡需要被看見，哪個想法需要被成長。"},{"h":0,"x":"真正的成熟，不是沒有情緒，不是永遠平靜，不是不被觸發——而是：即使情緒來了，你仍然有選擇。"},{"h":0,"x":"你可以理解它。你可以承載它。你可以穿越它。"},{"h":0,"x":"這才是真正的人生成熟。"},{"h":0,"x":"—— 願你學會讀懂情緒，而不再被它控制"}],"b":[{"k":"table","r":[["❌ 從前的說法","✅ 溫柔的說法"],["情緒＝我的問題","情緒＝心的提醒"],["我很焦慮","內心正在產生焦慮"],["我放不下","內心還沒完成成長"],["我太脆弱","內心正在高警戒"],["情緒是敵人","情緒是成長的入口"]]},{"k":"list","l":["從前常說：「我情緒太多了」　→　現在可以說：「內心正在持續提醒我有些地方需要調整」"]},{"k":"note","t":"本章核心句","l":["情緒不是敵人。","情緒是：大腦的心的提醒。","真正成熟，","不是沒有情緒。","而是：能承載情緒。","情緒會重播，","代表想法還沒成長。"]},{"k":"table","r":[["從前｜內耗焦慮","現在｜安穩"],["焦慮＝我很弱","焦慮＝預測失衡"],["一定要控制結果","提高承載能力"],["活在未來災難","回到當下行動"],["焦慮就停止行動","焦慮中仍能前進"],["安全感來自控制","安全感來自韌性"]]},{"k":"list","l":["從前常說：「我是不是快失控了？」　→　現在可以說：「內心正在過度預測危險。」","從前常說：「我一定不能失敗」　→　現在可以說：「失敗只是一次學習。」"]},{"k":"note","t":"本章核心句","l":["焦慮，不是軟弱。","而是：大腦正在過度預測危險。","真正的安全感，","不是世界可控。","而是：即使世界失控，","你仍然能穩定。"]},{"k":"table","r":[["從前｜情緒奪權","現在｜理性回歸"],["情緒來就反應","情緒來先觀察"],["壓力大就逃避","壓力大仍能行動"],["焦慮→拖延","焦慮→拆解"],["孤單→依附","孤單→穩定自己"],["情緒控制決策","理性管理情緒"]]},{"k":"list","l":["從前常說：「我控制不了自己」　→　現在可以說：「情緒正在接管決策。」"]},{"k":"note","t":"本章核心句","l":["很多人不是不會選擇。","而是：情緒正在替他做選擇。","真正成熟，","不是沒有情緒。","而是：情緒來時，","仍然保有方向。"]},{"k":"list","l":["從前常說：「我情緒太多了」　→　現在可以說：「我正在精準辨識：我現在是___，因為我害怕___。」"]},{"k":"table","r":[["模糊情緒語言","精準情緒語言"],["我很煩","我感到憤怒，邊界被踩了"],["我好亂","我感到焦慮，預測失控"],["我很沮喪","我感到失落，期待落空了"],["我好差","我感到羞愧，身份受到威脅"],["我不舒服","我感到委屈，需求沒有被看見"]]},{"k":"table","r":[["從前｜舊迴路自動","現在｜新迴路建立"],["我就是這樣","這是神經迴路"],["情緒來就反應","情緒來先覺察"],["被觸發就崩潰","被觸發仍穩定"],["重複舊反應","建立新路徑"],["理解＝改變","重複＝重寫"]]},{"k":"list","l":["從前常說：「我是不是永遠改不了？」　→　現在可以說：「舊神經路徑還在自動化。」"]},{"k":"note","t":"本章核心句","l":["很多情緒，","其實不是現在。","而是：過去神經記憶的重播。","真正的成長，","不是理解。","而是：重複新的神經路徑。","真正自由，","不是不被觸發。","而是：被觸發時，仍然能選擇。"]},{"k":"table","r":[["從前｜外界定義自我","現在｜內在穩定核心"],["被誤解就崩潰","被誤解仍穩定"],["拼命解釋","穩定做自己"],["外界認可＝價值","內在對齊＝價值"],["別人否定＝失敗","別人否定＝資訊"],["討好換安全感","邊界建立安全感"],["活在別人眼中","活在自己核心"]]},{"k":"list","l":["從前常說：「是不是大家都討厭我？」　→　現在可以說：「內心正在過度依賴外界認可。」","從前常說：「我一定要解釋清楚」　→　現在可以說：「我不需要控制所有人的理解。」"]},{"k":"note","t":"本章核心句","l":["真正成熟，","不是永遠被理解。","而是：被誤解時，仍然穩定。","真正自由，","不是所有人都喜歡你。","而是：即使不被理解，","你仍不失去自己。"]},{"k":"table","r":[["從前｜情緒反應","現在｜情緒承載"],["情緒來就反應","情緒來先承載"],["生氣就爆炸","生氣仍能觀察"],["焦慮就逃避","焦慮仍能行動"],["壓抑情緒","允許情緒流動"],["情緒＝我","情緒＝訊號"],["痛苦＝威脅","痛苦＝承載訓練"],["高反應性","高穩定性"]]},{"k":"list","l":["從前常說：「我控制不了情緒」　→　現在可以說：「內心正在自動反應。」","從前常說：「我不想有情緒」　→　現在可以說：「我要提升情緒承載力。」"]},{"k":"note","t":"本章核心句","l":["真正成熟，","不是沒有情緒。","而是：能承載情緒。","情緒不可怕。","沒有承載力，才可怕。","真正自由，","不是永遠舒服。","而是：即使不舒服，","仍能穩定。"]},{"k":"note","t":"情緒不是敵人。","l":["情緒是大腦的心的提醒。","真正成熟，","不是沒有情緒。","而是：能承載情緒。","真正自由，","不是永遠舒服。","而是：即使不舒服，","仍能穩定。🌿"]}]},{"n":"讀懂情緒","s":"情緒從來不是你的缺點，它是心在告訴你：哪裡需要被看見。累了就先睡飽、吃飽、慢下來——身體安穩了，心才有地方落腳。","q":["情緒從來不是錯誤。它是你的內心，在偵測到失衡、威脅、或失去之後，發出的訊號。","你以為情緒是問題，其實情緒是答案——只是你還不會讀。","情緒反覆重播，不是因為你太脆弱。而是因為內心還沒有完成調整——它在等你讀懂它在說什麼。","每一種情緒，都是內心的精確提醒。","情緒不是你的性格缺陷。它是你的內心在精確地告訴你：哪裡失衡了，哪裡需要被看見。","脆弱不可怕，真正危險的是：內心沒有恢復能力。","抗傷能力不是讓你沒有情緒，而是讓情緒能流動，但不會把你沖走。","情緒止住內耗不是壓抑，是降低內耗、恢復流動。","差別不只是個性，而是情緒的混亂。","內耗人生：情緒反覆重播。安穩人生：情緒流動後，結構重新穩定。","很多人真正痛苦的，不是情緒本身，而是錯誤轉換。","情緒只是訊號，不是判決書。真正自由的人，能做到：有情緒，但不被情緒定義。","負面情緒不是敵人，是內心失衡的訊號。","真正的問題不是你不夠努力，而是內心長期失衡。","人不是壞掉，而是內心失衡。真正成長，不是硬撐，而是重新調整整個內心。","情緒只是訊號。讀懂它，你就有了選擇。忽略它，它就會換一個地方繼續說話。"],"p":[{"h":1,"x":"從內耗到安穩流動的完整指南"},{"h":0,"x":"情緒不是敵人，是內心在提醒你有些地方該成長了"},{"h":0,"x":"情緒不是讓你停下來的，是讓你成長的 🌿"},{"h":1,"x":"前言"},{"h":0,"x":"你有沒有試過壓制情緒？"},{"h":0,"x":"焦慮的時候，告訴自己「不要亂想」。憤怒的時候，把它硬吞下去。悲傷的時候，逼自己振作。然後發現——它根本沒有消失，只是換了一個地方。"},{"h":0,"x":"變成失眠，變成疲憊，變成說不清楚的煩躁，變成在某個普通的下午突然崩潰。"},{"h":0,"x":"這本書要說的，是一個很多人從來沒有想過的問題：情緒，究竟是什麼？"},{"h":0,"x":"從內心角度看，每一個情緒都有它精確的意義：焦慮是內在的預想在高度運轉；憤怒是界線感在發出警報；悲傷是連結的需要在修復失去；羞愧是自我認同在不穩定。"},{"h":0,"x":"真正的問題，從來不是情緒太多——而是我們不知道怎麼讀懂它。"},{"h":0,"x":"這本書分為七個部分，從情緒的本質出發，到抗傷能力的建立，到五大情緒錯誤轉換的糾正，到50種情緒的內心解碼，最後到整個人的重新調整。"},{"h":0,"x":"每一章都有一個核心問題：你的內心，現在在哪裡？"},{"h":0,"x":"讓我們開始。"},{"h":1,"x":"情緒的本質"},{"h":0,"x":"八層內心分析——情緒不是敵人，是警報"},{"h":0,"x":"情緒是警報，不是敵人"},{"h":0,"x":"大多數人和情緒的關係，像是對著火警警報器大喊「閉嘴！」"},{"h":0,"x":"火警一直響，他們拔掉電池。然後繼續住在那棟失火的建築裡，以為問題解決了。"},{"h":0,"x":"情緒不是要被消滅的東西。情緒是你的大腦在偵測到內心偏差之後，發出的第一個訊號。它在說：「這裡有什麼東西需要注意。」"},{"h":0,"x":"從神經科學的角度，情緒是預測機器——你的大腦——在現實和預期之間出現落差時的反應。當這個落差被偵測到，大腦就發出一個信號，那個信號，就是你感受到的情緒。"},{"h":0,"x":"這本書把情緒分成八個層次：本體層（情緒的本質）、結構層（情緒如何形成）、機制層（不同情緒的控制機制）、能量層（情緒和神經心力的關係）、關係層（情緒如何影響人際）、身份層（情緒如何塑造自我認知）、成長層（情緒如何重新流動）、意識層（覺察帶來的真正自由）。"},{"h":0,"x":"每一層都有它的卡點，有它的真正問題，有它的從前常說和現在可以說。讀懂這八層，你就讀懂了你的情緒。"},{"h":1,"x":"四種核心情緒的內心密碼"},{"h":0,"x":"讓我們更深入地看四種最常見的核心情緒——焦慮、憤怒、悲傷、羞愧。這四種情緒的出現頻率最高，被誤解的程度也最深。"},{"h":0,"x":"焦慮，是內在的預想失控的訊號。你的大腦在不斷模擬未來的各種可能性，當它無法產生一個「穩定可預測的未來」時，它就啟動了焦慮。不是因為你太悲觀——而是因為你的內在的預想沒有足夠的穩定感來錨定未來。"},{"h":0,"x":"憤怒，是界線感的警報。當你的邊界被侵犯——不管是身體的、情感的、還是心理的——憤怒就是那個在說「這裡不行」的訊號。容易爆炸的人，往往不是脾氣差，而是邊界長期被忽略、長期被踩，最終內心選擇了最直接的方式來回應。"},{"h":0,"x":"悲傷，是連結的需要在修復失去。當一段重要的關係、一個重要的目標、一個重要的自我認知被打破，內心需要時間修復。悲傷不是弱點，它是修復進行中的訊號。壓抑悲傷，等於阻止修復。"},{"h":0,"x":"羞愧，是自我認同在不穩定。它出現在一個人覺得自己的存在本身有問題的時候。羞愧是所有情緒裡最消耗能量的一種，因為它攻擊的不是行為，而是整個人格。把「這件事做錯了」和「我是個錯誤的人」分開，是走出羞愧的第一步。"},{"h":1,"x":"抗傷能力"},{"h":0,"x":"讓內心有緩衝——不是沒有情緒，是情緒來了不崩潰"},{"h":1,"x":"真正的抗傷能力"},{"h":0,"x":"很多人以為，心理強壯的人不會受傷。"},{"h":0,"x":"錯了。真正心理強壯的人，同樣會受傷、同樣會難過——但他們的內心有一個東西，叫做「緩衝能力」。"},{"h":0,"x":"緩衝能力，是在刺激和反應之間，留出一個空間。在這個空間裡，你有機會選擇如何回應，而不是讓情緒直接接管。"},{"h":0,"x":"低抗傷的人和高抗傷的人，面對同樣的壓力，內心的反應完全不同。"},{"h":1,"x":"六大抗傷核心策略"},{"h":0,"x":"①延遲反應：情緒來了，先停10秒。不要立刻回訊息，不要立刻爆炸。那10秒鐘，是你和被情緒接管之間的距離。"},{"h":0,"x":"②減少內耗：累的時候不要做重大決定。先睡覺，先吃飯，先補水。神經穩了，才有能力處理問題。"},{"h":0,"x":"③分離事件與身份：「這次失敗」不等於「我很爛」。失敗是想法需要成長，不是人格的否定。"},{"h":0,"x":"④建立穩定節律：固定睡眠、固定運動、固定安靜時間。神經穩，情緒才穩。這不是放縱，而是在為內心建底盤。"},{"h":0,"x":"⑤建立情緒出口：寫下來、說出來、走路、運動、深呼吸。情緒需要出口，封死只會讓壓力累積。"},{"h":0,"x":"⑥降低高刺激：少滑短影音、少看情緒新聞、少接很耗神關係。因為你的心力有限，保護它。"},{"h":1,"x":"20個讓情緒重新流動的方法"},{"h":0,"x":"內耗情緒，就是長期的內耗狀態——情緒不斷地消耗能量，卻沒有流動和修復。安穩情緒，是情緒能夠流動、內心能夠恢復的狀態。"},{"h":0,"x":"以下20個方法，不是讓你沒有情緒，而是幫你的情緒從內耗狀態，逐步回到安穩狀態。"},{"h":0,"x":"①先睡飽  睡眠不足，大腦會放大威脅。一切的修復，都從睡眠開始。"},{"h":0,"x":"②固定作息  規律會降低神經混亂。身體知道接下來要發生什麼，內在的警鈴就會放鬆。"},{"h":0,"x":"③少看高刺激短影音  大腦會被碎片化，注意力耗散，情緒更難穩定。"},{"h":0,"x":"④情緒來先停10秒  避免自動爆炸。那10秒是內心插入「覺察」的機會。"},{"h":0,"x":"⑤每天運動20分鐘  讓壓力代謝出去。身體是情緒最直接的出口。"},{"h":0,"x":"⑥固定補水  缺水會提高焦躁感。身體的基本供能影響神經狀態。"},{"h":0,"x":"⑦不要空腹太久  低血糖會放大情緒反應。血糖穩，情緒才穩。"},{"h":0,"x":"⑧少熬夜  最消耗自己的習慣之一。每一個熬夜，都在讓內心付利息。"},{"h":0,"x":"⑨每天安靜5分鐘  讓大腦降噪。在資訊轟炸的世界裡，安靜是稀缺資源。"},{"h":0,"x":"⑩把情緒寫下來  情緒會從混亂變清楚。外化的過程，就是整理的過程。"},{"h":0,"x":"⑪少跟很耗神的人久待  情緒會共振感染。你的情緒頻率，會被周圍的人影響。"},{"h":0,"x":"⑫學會拒絕  邊界不清，內耗就會增加。每一次說「不」，都是在保護你的心力。"},{"h":0,"x":"⑬不要一次處理太多事  心力超載，內心容易崩。一次一件，穩定前進。"},{"h":0,"x":"⑭建立小完成  完成感會提升穩定感。每一個小的完成，都在向大腦說「我還行」。"},{"h":0,"x":"⑮少自責  過度攻擊自己，會讓內心長期高壓。把自責換成「哪裡可以調整」。"},{"h":0,"x":"⑯多曬太陽  光線影響神經穩定。每天至少20分鐘自然光。"},{"h":0,"x":"⑰固定真實連結  長期孤立，情緒容易失衡。真實的連結，是情緒的養分。"},{"h":0,"x":"⑱少反覆回想痛苦  大腦會強化舊迴路。每一次重播，都在讓神經路徑更深。"},{"h":0,"x":"⑲把「我很糟」改成「我現在狀態不好」  身份不要綁定情緒。狀態是暫時的，不是你是誰。"},{"h":0,"x":"⑳允許情緒流動  能流動，才會修復。情緒被允許存在，它才會真正離開。"},{"h":1,"x":"內耗 vs 安穩"},{"h":0,"x":"兩種情緒——你的內心在耗散還是在恢復？"},{"h":1,"x":"內耗的狀態與安穩的狀態"},{"h":0,"x":"有些人遇到壓力，會越來越亂。有些人遇到壓力，反而越來越穩。"},{"h":0,"x":"差別不只是個性。而是他們的情緒，一個是內耗的，一個是安穩的。"},{"h":0,"x":"內耗情緒的核心目標函數是：「趕快消除不舒服」。所以內心會優先選擇逃避、防禦、壓抑、短期止痛。但代價是：長期越來越亂。"},{"h":0,"x":"安穩情緒的核心目標函數是：「提升穩定性、增加恢復力、提高成長能力」。所以每次情緒，都變成一次想法修正。每次壓力，都變成一次內心升級。"},{"h":0,"x":"內耗路徑：刺激→情緒爆炸→逃避/壓抑→內耗增加→神經失衡→心力下降→舊迴路強化→更容易失控。"},{"h":0,"x":"安穩路徑：刺激→覺察情緒→分析落差→穩定神經→成長想法→建立新迴路→恢復平衡→內心升級。"},{"h":0,"x":"選擇安穩，不是要你強迫自己快樂。而是建立一個內心，讓你在受傷之後，能夠真正地恢復。"},{"h":1,"x":"情緒不是判決書"},{"h":0,"x":"你有沒有過這樣的經驗：被拒絕了一次，然後整個人開始覺得「我是不是真的很爛」？被忽略了，就變成「沒人愛我」？失敗了一次，就成了「我就是個失敗者」？"},{"h":0,"x":"這不是你太脆弱。這是一個叫做「情緒錯誤轉換」的機制在運作——你的大腦把一個暫時的「狀態」，錯誤地翻譯成了永久的「身份」。"},{"h":1,"x":"五大情緒錯誤轉換模組"},{"h":0,"x":"錯誤轉換的核心問題在於：大腦把「狀態」錯誤轉成「身份」。狀態是暫時的，身份是持久的——當你讓情緒定義了你是誰，你就失去了改變的空間。"},{"h":0,"x":"糾正這個錯誤的起點，是說法的改變。不說「我很焦慮」，改說「我正在經歷焦慮」。不說「我失敗了」，改說「這次的策略需要成長」。這不是自我欺騙，而是語言幫助大腦重新調整現實。"},{"h":0,"x":"安穩轉換的路徑：刺激→覺察情緒→分離身份→調整想法→成長行動。每一次的正確轉換，都是一次小小的自由。"},{"h":1,"x":"50種情緒解碼"},{"h":0,"x":"每一種情緒，都有它的內心意義"},{"h":1,"x":"50種負面情緒的完整指南"},{"h":0,"x":"我們常常遇到一種困境：感受到一種情緒，但說不清楚它是什麼，也不知道該怎麼辦。"},{"h":0,"x":"以下50種情緒，每一種都有它在內心裡的精確含義，以及對應的第一個行動。這不是要你強迫自己立刻改變——而是給你一個地圖，讓你至少知道你在哪裡，往哪裡走。"},{"h":1,"x":"從情緒到整體——八個內心同時恢復"},{"h":0,"x":"人不是單一器官，是多內心整合體"},{"h":0,"x":"當情緒長期失衡，它不會只停留在情緒層面。它會蔓延——影響你的睡眠、影響你的認知、影響你的關係、影響你的行動能力。"},{"h":0,"x":"反過來說，當身體內心出了問題（睡眠不足、供能不穩），情緒也會跟著失衡。當關係出了問題（邊界混亂、過度依附），情緒耗能就會增加。"},{"h":0,"x":"這就是為什麼，真正的療癒不是只修一個地方——而是讓整個內心重新對齊。"},{"h":1,"x":"內耗 vs 安穩的狀態循環"},{"h":0,"x":"你不需要同時修復所有的內心。但你需要知道，它們是彼此連結的。修復其中一個，往往會帶動其他的。通常最好的起點是：先穩住睡眠。睡眠穩了，神經才有機會穩；神經穩了，情緒才有空間被觀察；情緒被觀察了，認知才能調整；認知調整了，行動才能穩定輸出。"},{"h":0,"x":"一個內心，慢慢帶動另一個內心。"},{"h":1,"x":"結語"},{"h":0,"x":"情緒，從來不是來毀掉你的。"},{"h":0,"x":"它是你的內心，在提醒你：有些地方，該成長了。"},{"h":0,"x":"焦慮不是告訴你「你快完蛋了」，它是告訴你「內心需要更多穩定感」。憤怒不是你的性格缺陷，它是說「有一條邊界，需要被建立」。悲傷不是脆弱，它是修復的過程。羞愧不是真相，它是自我認同在尋找新的錨點。"},{"h":0,"x":"真正的情緒自由，不是永遠快樂，不是沒有負面情緒。"},{"h":0,"x":"而是：你開始有能力觀察情緒，而不是被情緒拖走。你開始有能力讓堵塞的能量重新流動。你開始把每一次的情緒，當成一次好好照顧自己的機會，而不是一次人格的審判。"},{"h":0,"x":"這本書是一個起點。真正的練習，在每一次情緒出現的那一刻。"},{"h":0,"x":"—— 願你不再和情緒為敵，而是學會讀懂它"}],"b":[{"k":"table","r":[["層級","核心概念","機制","卡點","真正問題","從前常說","現在可以說","成長行動"],["本體層","情緒=內在的警鈴","大腦偵測偏差後發出訊號","情緒反覆重播","內心未完成調整","我情緒很多","內心正在提醒我","每天記錄3次情緒觸發點"],["本體層","情緒不是敵人","情緒是能量流","長期壓抑","能量堵塞","我要消滅情緒","我要理解情緒","每天5分鐘書寫情緒"],["結構層","情緒受預測控制","大腦會預測未來風險","焦慮停不下來","災難模擬過強","一定會出事","內心正在過度預測","每次焦慮列出3種可能結果"],["結構層","情緒影響注意力","高情緒會縮窄視野","越想越負面","注意力被威脅綁架","世界很糟","我的內心正在高警戒","情緒高時先離開刺激源"],["結構層","情緒有迴路","長期情緒會形成習慣","一直重播同樣痛苦","神經迴路固化","我怎麼又這樣","舊迴路正在自動運行","每天中斷1個情緒慣性"],["機制層","焦慮=失控感","大腦缺乏未來穩定感","無法放鬆","內在的預想不穩","我控制不了人生","內心缺乏可預測性","每天建立固定作息"],["機制層","憤怒=邊界警報","內心感覺被侵犯","容易爆炸","長期壓抑邊界","我脾氣不好","我的邊界長期被忽略","每天練習一次清楚拒絕"],["機制層","悲傷=連結流失","內心失去重要依附","無力感很重","情感能量下降","我好沒用","內心正在修復失去","每天維持1個真實連結"],["機制層","羞愧=身份崩塌","社會評價威脅身份","很怕丟臉","自我認同不穩","我很糟糕","我的身份需要重建","每天累積1個小完成"],["能量層","情緒耗損心力","情緒會消耗神經資源","腦袋很亂","內心超載","我快撐不住","心力正在下降","睡前1小時停止高刺激"],["能量層","內耗情緒=內耗","長期壓抑增加混亂","一直很累","能量循環停滯","我越來越沒力","內心正在耗散能量","每天運動20分鐘"],["能量層","身體影響情緒","血糖/睡眠影響神經穩定","情緒忽高忽低","生理失衡","我很情緒化","內心供能不穩","固定吃早餐與補水"],["關係層","情緒會投射","未解情緒會扭曲互動","容易誤會別人","舊創傷投影","他故意傷害我","我的情緒正在投射","衝突前先寫下真實感受"],["關係層","情緒會感染","人際內心彼此共振","常被帶情緒","邊界過弱","都是別人害我","我要穩定自己的頻率","降低很耗神社交"],["關係層","討好=情緒避險","害怕衝突而壓抑自己","長期委屈","生存模式過強","我不能拒絕","我可以有邊界","每週練習1次真實表達"],["身份層","情緒會塑造身份","長期情緒形成自我定義","覺得自己很差","身份被情緒綁架","我就是焦慮的人","我正在經歷焦慮","改用「我正在經歷」說法"],["身份層","情緒不是本體","情緒只是暫時狀態","被情緒吞沒","缺乏觀察距離","我就是這樣","狀態是可成長的","每天靜坐5分鐘觀察自己"],["成長層" ,["😢 心碎  ＝依附內心斷裂 → 允許修復時間","😞 後悔  ＝想法回看落差 → 提取經驗值"],["😣 壓抑  ＝能量堵塞 → 安全地表達","😫 無助  ＝失去控制感 → 先完成小事情"],["😖 痛苦  ＝內心失衡提醒 → 停止逃避感受","😤 不甘心  ＝期待與現實落差 → 重新定義成功"],["😒 厭世  ＝長期失望累積 → 降低資訊污染","😮‍💨 窒息感  ＝壓力過密 → 增加空白時間"],["😑 冷漠  ＝情緒保護模式 → 恢復真實感受","😥 緊張  ＝預測風險提高 → 先放慢速度"],["😟 敏感  ＝內在的警鈴過強 → 建立安全感","😔 自卑  ＝長期低自我評價 → 停止比較"],["😣 懷疑自己  ＝身份不穩 → 累積成功證據","😡 敵意  ＝長期防禦狀態 → 重新建立信任"],["😢 絕望  ＝未來想法崩塌 → 縮小時間尺度","😞 失控感  ＝內心缺乏秩序 → 建立固定習慣"],["😫 內耗  ＝能量反覆消耗 → 停止過度思考","😥 依附焦慮  ＝害怕失去連結 → 提升自我穩定"],["😔 討好  ＝害怕被拒絕 → 建立邊界","😤 控制欲  ＝害怕不確定性 → 允許變化存在"],["😶 壓力  ＝負載超過容量 → 減少非必要輸出","😵 情緒爆炸  ＝長期累積未釋放 → 提前排解情緒"],["😞 孤立感  ＝缺少被理解感 → 增加真實交流","😣 卡住  ＝舊迴路固化 → 建立新行動"]]},{"k":"note","t":"🌿 最高層結論","l":["負面情緒不是敵人","而是：內心失衡的訊號","真正成熟的人不是沒有情緒","而是：能把情緒轉成讓自己成長的入口"]},{"k":"table","r":[["內心層","失衡核心","常見狀態","內耗結果","安穩修正"],["本體內心","活成別人期待","空虛、迷失","內在空轉","找回真正目標"],["認知內心","災難化思考","亂想、焦慮","情緒循環","調整思考想法"],["情緒","長期壓抑","內耗、爆炸","能量堵塞","允許情緒流動"],["身心","長期高警戒","緊繃、失眠","心力下降","穩定作息與節律"],["身體內心","供能不足","疲憊、發炎","心力消耗","睡眠、補水、運動"],["關係","邊界混亂","討好、委屈","情緒耗損","建立清楚邊界"],["行動內心","想太多做太少","拖延、逃避","自我否定","小步穩定輸出"],["成長內心","舊模式重播","人生卡住","結構僵化","復盤與一次學習"]]},{"k":"table","r":[["🟥 內耗失衡循環","🟩 安穩平衡循環"],["壓力","睡眠穩"],["→ 情緒","→ 神經穩"],["→ 亂想","→ 情緒穩"],["→ 失眠","→ 認知穩"],["→ 疲憊","→ 關係穩"],["→ 關係失衡","→ 行動穩"],["→ 更焦慮",""],["內心互相拖垮","內心彼此支撐"]]},{"k":"note","t":"🌿 最後一句話","l":["情緒不是讓你停下來的","情緒，是你的內心","在提醒你：","有些地方，該成長了","願你的內心，越來越穩定","願你的情緒，越來越流動 🌿"]}]},{"n":"情緒與關係","s":"好的關係不是誰忍得多，而是兩個人都能安心做自己。學會承載自己的情緒，畫出溫柔的界線，你就會慢慢靠近對的人。","q":["所有內心，都可以成長。所有想法，都可以升級。你不是固定的人，而是一直在成長的人。","情緒不是敵人。情緒是心的提醒。","情緒會重播，代表想法還沒成長。","真正成熟，不是沒有情緒，而是能承載情緒。","真正自由，不是沒有情緒，而是不再被情緒控制。","焦慮，本質上是預測失控。","真正耗神的，不是現實，而是大腦反覆模擬災難。","真正成熟，不是沒有焦慮，而是即使焦慮，仍能穩定前進。","真正的安全感，不是世界可控，而是即使世界失控，你仍然能穩定。","你無法改變，你無法命名的東西。","情緒命名，是大腦重寫的開始。","模糊情緒，會提高內心混亂。精準命名，會降低心力消耗。","情緒不是麻煩。情緒是：內心通知。","真正耗神的，不是情緒，而是抗拒情緒。","容量小的人，人生容易陷入內耗。","真正強大，不是永遠平靜，而是風暴來時，內心仍穩定。","真正成熟，不是沒被誤解，而是被誤解時，仍然穩定。","真正自由，不是所有人都懂你，而是即使沒人懂你，你仍不失去自己。","外界評價，不等於你的本質。","成熟不是控制別人理解，而是不再依賴別人理解。","你吸引的，通常不是你想要的人，而是符合你內在想法的人。","很多心動，其實只是舊傷口共振。","真正成熟的愛，不是情緒劇烈，而是穩定流動。","真正高級的關係，不是上癮，而是安心。","很多討好，其實不是善良，而是恐懼。","討好型人格，本質上是身心求生模式。","真正成熟，不是讓所有人滿意，而是對自己誠實。","真正的邊界，不是攻擊別人，而是不再背叛自己。","依附，是人類最深的控制程式。","很多人以為自己在愛，其實是在害怕失去。","真正成熟的愛，不是抓住，而是自由流動。","真正自由，不是沒有人離開，而是即使有人離開，你仍完整。","邊界不是冷漠，而是不再失去自己。","沒有邊界的人，最終會失去中心。","你不是太敏感，很多時候，只是內心沒有保護機制。","真正的愛，不是無限犧牲，而是彼此尊重。","真正高品質的關係，不是互相消耗，而是互相增強。","很多人上癮的，不是愛，而是情緒刺激。","真正的共振，不是激情，而是長期穩定。","關係不是找人填補空缺，而是兩個完整內心的合作。","情緒勒索，不是情緒，而是控制。","很多人的罪惡感，其實是長期被訓練出來的。","真正的愛，不會奪走自由。","你可以理解別人，但不必犧牲自己。","真正高階的人際，不是認識很多人，而是誰能進入你的內心。","低品質陪伴，比孤單更耗能。","環境，會反向塑造人格。","你靠近誰，就會逐漸變成誰。"],"p":[{"h":1,"x":"12章完整一頁總表彙整"},{"h":0,"x":"10層內心分析 × 從前vs更有智慧對照 × 心的成長路徑 × 每日小練習"},{"h":0,"x":"情緒不是敵人。情緒是心的提醒。真正成熟，不是沒有情緒，而是能承載情緒。"},{"h":1,"x":"使用說明"},{"h":0,"x":"這本書是12個核心章節的完整內心總表彙整。每一章包含："},{"h":0,"x":"①十層內心分析表——從問題現象到智慧整合，完整拆解每個主題的深層機制。②從前vs更有智慧對照——清楚呈現從前常說和現在可以說的差異。③心的成長路徑——視覺化的照顧自己的路徑。④更有智慧金句——濃縮章節核心的關鍵句。⑤給自己的溫柔提醒——實際可用的說法替換練習。⑥每日小練習——具體的行動步驟。"},{"h":0,"x":"建議使用方式：先瀏覽十層分析表建立內心框架，再看從前vs更有智慧對照找到自己的當前位置，然後每天用小練習做實際成長。"},{"h":0,"x":"為何情緒會反覆重播？"},{"h":1,"x":"焦慮其實是預測失控"},{"h":0,"x":"情緒命名：大腦重寫的開始"},{"h":0,"x":"高情緒容量的人怎麼運作？"},{"h":0,"x":"真正成熟：被誤解時仍穩定"},{"h":0,"x":"為何你總吸引錯的人？"},{"h":1,"x":"討好型人格的底層機制"},{"h":0,"x":"依附：人類最深的控制程式"},{"h":1,"x":"後記"},{"h":0,"x":"這12章涵蓋了情緒和關係最核心的議題。從情緒重播到焦慮預測，從命名重寫到承載容量，從依附到邊界，從共振到篩選——每一章都是一個內心，每個內心都可以成長。"},{"h":0,"x":"成長的路徑很清楚：看見舊想法→理解內心機制→建立現在可以說→用行動溫習身心。這不是靠意志力完成的，而是靠重複的小行動，一點一點地讓大腦成長內在的預想。"},{"h":0,"x":"—— 願你的內心，越來越安穩，越來越自由"}],"b":[{"k":"chap","t":"為何情緒會反覆重播？"},{"k":"table","r":[["層級","核心內容","內心解析","常見狀態","溫柔的轉念"],["①問題現象層","情緒反覆重播","未完成的落差持續循環","焦慮、內耗、暴怒、低落、反芻","看見：情緒不是偶然"],["②舊說法層","情緒＝不好","童年＋社會制約形成壓抑想法","壓抑、逃避、假裝沒事","改寫：情緒≠弱"],["③內心機制層","情緒＝內在的預想","大腦持續預測安全性","害怕失敗、被討厭、被拋棄","理解：情緒是生存本能"],["④心的提醒層","情緒＝落差提醒","現實與預測不一致","焦慮重播、關係循環","看見：想法失準"],["⑤內耗崩潰層","長期壓抑＝內耗","心力消耗持續上升","失眠、疲勞、發炎、決策混亂","理解：情緒會拖垮內心"],["⑥成長機制層","情緒命名＋神經重塑","精準命名降低杏仁核活性","「我很煩」→模糊化","精準拆解真正恐懼"],["⑦壓力測試層","混亂中是否穩定","高壓情境檢驗自己的成長","被誤解就崩潰","情緒來時仍能行動"],["⑧生成能力層","長出情緒承載力","身心穩定化","不再被情緒綁架","高恢復力＋低內耗"],["⑨智慧整合層","情緒≠自我","情緒只是導航訊號","把情 愛的，無力改變不是你的錯。它只是在提醒你：困於現狀、無法突破、自我評估過低。給自己一點時間，試著做小改變。"},{"z":"被詛咒感","e":"Cursed","c":"複合","g":"命運能量","s":"運氣不好、反覆失敗、自我詛咒","a":"改視角","m":"重構敘事，從受害者到創造者","x":"別急著趕走被詛咒感。它帶著一封信：運氣不好、反覆失敗、自我詛咒。讀懂了，就改視角吧。"},{"z":"虛偽感","e":"Inauthenticity","c":"複合","g":"真實能量","s":"假裝自己、失去真實、內外不一","a":"回真實","m":"脫下面具，活出真我","x":"虛偽感來的時候，不是你不夠好，是心在說：「假裝自己、失去真實、內外不一」。此刻，溫柔地回真實就好。"},{"z":"不被信任感","e":"Distrusted","c":"複合","g":"信譽能量","s":"信任被質疑、形象受損、需要證明","a":"做證明","m":"用行動建立信譽","x":"親愛的，不被信任感不是你的錯。它只是在提醒你：信任被質疑、形象受損、需要證明。給自己一點時間，試著做證明。"},{"z":"被誤解感","e":"Misunderstood","c":"複合","g":"溝通能量","s":"表達不清、被曲解、需要澄清","a":"去澄清","m":"改進溝通，建立理解","x":"別急著趕走被誤解感。它帶著一封信：表達不清、被曲解、需要澄清。讀懂了，就去澄清吧。"},{"z":"被宿命感","e":"Fated","c":"複合","g":"","s":"認命、無力反抗、喪失主體性","a":"做選擇","m":"重奪主體性，創造未來","x":"被宿命感來的時候，不是你不夠好，是心在說：「認命、無力反抗、喪失主體性」。此刻，溫柔地做選擇就好。"}],"fb":[{"pain":"明明很累了，卻不敢停下來休息。","main":"休息不是偷懶，是把自己還給自己。","en":"Rest is not laziness — it is giving yourself back to yourself.","body":["你不是機器，不需要一直運轉才有價值。","累了就停一停，世界不會因此丟下你。","把自己照顧好，才有力氣去愛想愛的人。"],"step":"今晚提早三十分鐘上床，手機放在房間外。","tag":"疲憊"},{"pain":"別人一句話，你在心裡重播了一整晚。","main":"那句話早就走了，是你還捨不得放過自己。","en":"The words left long ago; it is you who hasn't let yourself go.","body":["會反覆想，是因為你很在乎。","但在乎，不代表要用它來懲罰自己。","把它寫下來，讓紙替你記著，心就可以休息了。"],"step":"把那句話寫在紙上，再寫一句你想對自己說的話。","tag":"內耗"},{"pain":"總是先說「沒關係」，其實心裡很有關係。","main":"你的委屈，也值得被好好聽見。","en":"Your hurt deserves to be heard, too.","body":["懂事的人，往往最少被心疼。","說出感受不是計較，是讓愛你的人有機會靠近。","你可以溫柔，也可以有底線。"],"step":"今天練習說一次：「其實我有一點在意。」","tag":"壓抑"},{"pain":"害怕拒絕別人，怕一開口就失去這段關係。","main":"會因為一句「不」而離開的人，本來就留不住。","en":"Anyone who leaves over one “no” was never going to stay.","body":["界線不是冷漠，是告訴別人怎麼愛你。","你的時間和心力，都很珍貴。","先答應自己，再答應世界。"],"step":"今天對一件不想做的小事，溫柔地說「這次不行」。","tag":"討好"},{"pain":"看著別人的生活，覺得只有自己停在原地。","main":"花有花期，你有你的時區。","en":"Every flower has its season; you have your own time zone.","body":["你看見的是別人的精彩片段，不是全部。","走得慢不是落後，是你正在把根扎深。","回到自己的路上，一步也算數。"],"step":"寫下今天完成的三件小事，再小都算。","tag":"比較"},{"pain":"事情還沒發生，心已經先演完一百種最壞的結局。","main":"你擔心的事，大多數都不會發生。","en":"Most of what you fear will never happen.","body":["焦慮不是你太脆弱，是心太想保護你。","謝謝它，然後把注意力帶回此刻。","未來很大，但你只需要過好今天。"],"step":"深呼吸三次，只做眼前最小的一件事。","tag":"焦慮"},{"pain":"一犯錯就罵自己：「我怎麼這麼沒用。」","main":"請用對待好朋友的方式，對待自己。","en":"Treat yourself the way you would treat a dear friend.","body":["犯錯，是你正在學習的證明。","一次失敗，不等於你這個人失敗。","你已經很努力了，這一點請不要忘記。"],"step":"把「我好沒用」換成「我正在學」。","tag":"自責"},{"pain":"忍了很久，最後為了一件小事爆炸，然後更討厭自己。","main":"那不是脾氣壞，是你撐太久了。","en":"That's not a bad temper — you have simply held on too long.","body":["憤怒在說：我的界線被踩到了。","不必等到滿了才倒，平常就可以一點一點說。","好好生氣，也是一種照顧自己。"],"step":"下次不舒服時，當下說一句：「這樣我不太舒服。」","tag":"憤怒"},{"pain":"身邊很多人，卻覺得沒有一個人懂你。","main":"孤單，是心在提醒你：該被好好擁抱了。","en":"Loneliness is your heart reminding you it's time to be held.","body":["不是你不夠好，是你太久沒有說真心話。","被懂，從願意被看見開始。","先給自己一個擁抱，再給別人一個機會。"],"step":"傳訊息給一個想念的人：「最近好嗎？」","tag":"孤單"},{"pain":"知道該開始，卻一直拖，越拖越討厭自己。","main":"你不是懶，你只是怕做不好。","en":"You are not lazy; you are only afraid of not doing it well.","body":["拖延的背後，常常藏著一顆怕失望的心。","不必一次做完，先做五分鐘就好。","開始了，就已經贏過昨天的自己。"],"step":"設定五分鐘計時器，只做第一步。","tag":"拖延"},{"pain":"很努力了，卻總覺得自己不夠好。","main":"你不需要完美，才值得被愛。","en":"You don't need to be perfect to be worthy of love.","body":["「不夠好」是一句舊話，不是事實。","你的價值，不是成績單算出來的。","你存在，就已經足夠。"],"step":"對鏡子裡的自己說：「你今天辛苦了。」","tag":"自我價值"},{"pain":"放不下一個已經離開的人。","main":"捨不得，是因為你曾經很認真地愛過。","en":"It is hard to let go because you once loved so sincerely.","body":["悲傷不是軟弱，是愛留下的形狀。","不必急著好起來，慢慢來也沒關係。","有一天你會發現，想起時不再那麼痛了。"],"step":"允許自己今天難過十分鐘，然後去喝一杯溫水。","tag":"悲傷"},{"pain":"被誤會了，很想解釋，卻越說越無力。","main":"懂你的人不用解釋，不懂的人解釋也沒用。","en":"Those who understand need no explanation; those who don't won't hear one.","body":["你不需要每個人都明白你。","清楚自己是誰，比被所有人喜歡重要。","把力氣留給值得的人。"],"step":"寫下三個你清楚知道的、關於自己的優點。","tag":"被誤解"},{"pain":"每天都很忙，卻不知道自己在忙什麼。","main":"慢下來，才聽得見心裡的聲音。","en":"Slow down, and you will hear the voice within.","body":["忙碌，有時候是一種逃避。","空白不是浪費，是讓心重新對焦。","你要去哪裡，比你走多快更重要。"],"step":"今天留十分鐘什麼都不做，只是坐著。","tag":"空轉"},{"pain":"習慣照顧所有人，卻忘了照顧自己。","main":"你也是需要被照顧的人。","en":"You, too, are someone who needs to be cared for.","body":["一直付出的人，也會累，也會空。","先把自己的杯子裝滿，溢出來的才是給別人的。","愛自己不是自私，是愛別人的底氣。"],"step":"今天為自己做一件小事：一杯喜歡的飲料、一段散步。","tag":"心累"},{"pain":"一點小事就想哭，覺得自己太敏感。","main":"敏感不是缺點，是你感受世界的天賦。","en":"Sensitivity is not a flaw; it is your gift for feeling the world.","body":["眼淚不是脆弱，是心在替你排水。","感受得深的人，也愛得深。","你只需要學會，也這樣溫柔地感受自己。"],"step":"想哭就哭一下，然後摸摸自己的心口。","tag":"敏感"},{"pain":"害怕失敗，所以乾脆不開始。","main":"跌倒不可怕，你一直都有站起來的力量。","en":"Falling is not the end — you have always had the strength to rise.","body":["害怕，代表這件事對你很重要。","勇敢不是不怕，是帶著害怕往前一小步。","做不好也沒關係，做了就會長大。"],"step":"把那件事拆成最小的一步，今天只做它。","tag":"恐懼"},{"pain":"在關係裡，總是你先低頭、你先道歉。","main":"好的關係，不需要你一直委屈自己。","en":"A good relationship never asks you to keep shrinking yourself.","body":["愛不是誰忍得比較多。","你退的每一步，也需要有人看見。","值得的人，會走過來和你站在一起。"],"step":"今天先問自己：「我真正想要的是什麼？」","tag":"關係"},{"pain":"睡前滑手機到半夜，明明很睏卻捨不得睡。","main":"你不是不想睡，是捨不得今天沒有屬於自己的時間。","en":"It's not that you don't want to sleep — you long for time that is yours.","body":["白天都給了別人，夜晚才想補償自己。","可是真正的補償，是好好睡一覺。","明天的你，會感謝今晚早睡的你。"],"step":"睡前半小時放下手機，換成一首安靜的歌。","tag":"熬夜"},{"pain":"總覺得「等我變好了」才配擁有幸福。","main":"幸福不是獎品，你現在就可以擁有。","en":"Happiness is not a prize; you may have it now.","body":["你不需要先變瘦、變強、變成功。","此刻的你，就值得一頓好飯、一個好覺。","好好過今天，就是最好的變好。"],"step":"今天做一件「等以後才要做」的小小開心事。","tag":"不配得感"},{"pain":"被家人一句話刺到，明明長大了還是會痛。","main":"會痛，是因為你一直很想被他們肯定。","en":"It hurts because you have always longed for their approval.","body":["他們也許不擅長說愛，不代表你不值得。","你可以心疼小時候的自己。","現在，換你來當那個肯定自己的人。"],"step":"寫一句小時候最想聽到的話，唸給自己聽。","tag":"家人"},{"pain":"心裡很亂，什麼都想做，卻什麼都做不了。","main":"心亂的時候，先整理一個小角落。","en":"When the heart is cluttered, tidy one small corner first.","body":["不必一次把人生理清楚。","寫下來，亂就有了形狀。","一次一件，慢慢地，路就出來了。"],"step":"把腦中的事全部寫下來，圈出今天只做的一件。","tag":"心亂"},{"pain":"明明不開心，還是習慣笑著說「我很好」。","main":"你可以不用一直那麼堅強。","en":"You don't have to be strong all the time.","body":["逞強久了，連自己都騙過去了。","承認「我不太好」，是勇氣，不是丟臉。","想被接住，要先願意鬆手。"],"step":"今天對一個信任的人說：「其實我最近有點累。」","tag":"逞強"},{"pain":"害怕被討厭，所以活成了別人想要的樣子。","main":"做自己，才會遇見真正喜歡你的人。","en":"Only by being yourself will you meet those who truly like you.","body":["討好換來的喜歡，留不住也不安心。","你不需要讓每個人都滿意。","有人不喜歡你，也沒關係。"],"step":"今天做一個「只因為我喜歡」的小選擇。","tag":"怕被討厭"},{"pain":"覺得人生卡住了，怎麼努力都沒有用。","main":"卡住的地方不是終點，是轉彎的地方。","en":"Being stuck is not the end; it is where the road turns.","body":["看不見進步，不代表沒有在前進。","種子在土裡的時候，也是安靜的。","換個方法、歇一下，都是前進。"],"step":"問自己：「如果換一種做法，會是什麼？」","tag":"卡住"},{"pain":"對未來沒有方向，不知道自己想要什麼。","main":"不知道要去哪裡的時候，先把今天過好。","en":"When you don't know where to go, live today well first.","body":["迷茫，是心在說：我想要更適合的生活。","答案不會用想的出現，會在走的路上出現。","跟著讓你眼睛發亮的小事走。"],"step":"寫下最近一件讓你忘記時間的事。","tag":"迷茫"},{"pain":"一直在等一句道歉，等到自己都累了。","main":"原諒不是為了他，是為了讓你自由。","en":"Forgiveness is not for them; it is to set you free.","body":["你不必假裝沒事，也不必急著原諒。","只是別讓那件事，繼續佔著你心裡最好的位置。","放下的那天，最輕鬆的是你。"],"step":"寫一封不寄出的信，把想說的全寫完。","tag":"怨懟"},{"pain":"什麼都提不起勁，連喜歡的事也沒感覺了。","main":"沒電的時候，不用發光，先充電。","en":"When you are out of power, you don't have to shine — just recharge.","body":["麻木，是心累到先把開關關上。","這不是你變糟了，是你需要被溫柔對待。","曬曬太陽、吃頓熱飯，從身體開始回來。"],"step":"出門走十分鐘，讓陽光照在臉上。","tag":"麻木"},{"pain":"太在意別人怎麼看，連發一則貼文都要想很久。","main":"別人沒有你想的那麼在意你，所以放心做自己。","en":"Others think of you far less than you imagine — so be yourself freely.","body":["每個人都忙著擔心自己。","你以為的目光，多半是心裡的聲音。","把評審席上的人請下來，這是你的人生。"],"step":"今天做一件「不管別人怎麼看」的小事。","tag":"不安"},{"pain":"走過很痛的日子，懷疑自己還能不能好起來。","main":"會好的，而且你已經在好起來的路上。","en":"It will get better — and you are already on your way.","body":["你撐過了每一個以為過不去的夜晚。","傷口，會變成你懂得溫柔的地方。","慢慢來，比較快。"],"step":"寫下一件「以前做不到、現在做得到」的事。","tag":"療癒"}],"T":{"情緒生成母體":"Emotion Mother Model","情緒生成公式":"Emotion Generation Formula","Goal × World × Belief × Prediction = Emotion。你的情緒 = 你的目標 × 你對世界的認知 × 你的核心信念 × 你的預測":"Emotion is the product of your unconscious goal, your mental model of the world, your core beliefs, and your prediction of what comes next. Change any variable, change the emotion.","目標（Goal）：你潛意識想實現的目標或避免的威脅":"Goal: Your unconscious objective or threat avoidance","看世界的方式（World）：你相信世界如何運作、人類如何行動":"World: How you believe the world works and people act","核心信念（Belief）：關於自己、他人、關係、價值的深層信念":"Belief: Your deepest convictions about self, others, relationships","預測（Prediction）：基於過往經驗，大腦預測現在情況會導致什麼":"Prediction: What your brain expects will happen based on experience","情緒診斷想法":"Emotion Diagnosis Model","5層快速診斷內心。在短短2-5分鐘內精確識別情緒的來源、強度、身體表現、神經狀態":"5-layer rapid diagnostic system. In 2-5 minutes, precisely identify emotion source, intensity, physical expression, and nervous system state.","第1層：表面情緒（這是什麼情緒？強度多少？）":"Layer 1: Surface emotion (what is it? intensity?)","第2層：身體信號（身體在哪裡感受它？）":"Layer 2: Body signals (where do you feel it?)","第3層：神經狀態（交感激活還是副交感平靜？）":"Layer 3: Nervous state (activated or calm?)","第4層：情緒來源（Goal/World/Belief/Prediction中的哪一個？）":"Layer 4: Source (which of the 4 factors?)","第5層：深層模式（這反映了什麼更深的信念或模式？）":"Layer 5: Deep pattern (what belief or pattern does this reflect?)","情緒成長流程":"Emotion Update Flow","4階段信念改變。從舊想法→新體驗→一次學習→新行為，完整的神經重塑迴圈":"4-stage belief transformation cycle. From old model to new experience to updated model to new behavior—complete neural rewiring.","第1階：察覺舊想法（這個信念是怎麼運作的？）":"Stage 1: Perceive current model (how does this belief work?)","第2階：收集新體驗（尋找與舊信念矛盾的證據）":"Stage 2: Collect new experiences (find contradicting evidence)","第3階：成長想法（在大腦中重新整合新舊信息）":"Stage 3: Update model (reintegrate new and old information)","第4階：行為改變（新想法指導新行為，新結果驗證想法）":"Stage 4: Behavior change (new behavior brings new results)","情緒能力樹":"Emotion Ability Tree","5層情緒能力發展。從感知→命名→調節→轉化→創造，一個完整的能力晉升內心":"5-layer emotional competence development. From perception to naming to regulation to transformation to creation.","🌱 感知層：能察覺情緒的出現和細微身體信號":"🌱 Perception: Notice emotions and subtle body signals","🌿 命名層：用精確詞彙描述情緒，區分細微差別":"🌿 Naming: Describe emotions with precision and nuance","🌳 調節層：用10+方法改變情緒狀態，選擇最適合的策略":"🌳 Regulation: Change states using 10+ methods effectively","🌲 轉化層：從情緒中提取教訓，用情緒推動成長":"🌲 Transformation: Extract wisdom, use emotion for growth","🌲 創造層：有意識地生成特定情緒狀態服務於目標":"🌲 Creation: Intentionally generate emotions for goals","情緒槓桿":"Emotion Leverage","找到最高效的干預點。在整個迴圈中，有些關鍵點的改變產生不成比例的結果。不要試圖同時改變5個地方，集中力量改變一個最高槓桿的點":"Find highest-impact intervention points. Some key changes produce disproportionate results. Focus on one leverage point instead of five.","🎯 最高槓桿：目標清晰度（如果目標不清楚，調節也解決不了根本）":"🎯 Highest: Goal clarity (foundation of everything)","🎯 次高：核心信念（改變信念會改變所有後續反應）":"🎯 High: Core belief (changes all downstream reactions)","🎯 中等：預測準確性（提高預測精度減少焦慮）":"🎯 Medium: Prediction accuracy (reduces unnecessary anxiety)","🎯 可行：身體預算（睡眠、進食、運動改善50%問題）":"🎯 Actionable: Body budget (sleep, food, exercise fix 50%)","🎯 最低：環境設計（改變環境會自動改變情緒）":"🎯 Lowest: Environment (automatic emotion change)","情緒診斷引擎":"Emotion Diagnosis Engine","表面情緒":"Surface Emotion","用一個詞精確描述你的情緒。強度1-10？持續多久？什麼觸發的？":"Name your emotion in one word. Intensity 1-10? How long? What triggered it?","情緒名稱":"Emotion name","強度評分":"Intensity (1-10)","持續時間":"Duration","觸發事件":"Trigger event","情緒家族":"Emotional Family","是喜悅族、悲傷族、恐懼族、憤怒族、厭惡族還是驚訝族？是否有混合情緒？":"Joy, sadness, fear, anger, disgust, or surprise family? Is it a blend?","核心家族分類":"Primary family","次要情緒":"Secondary","情緒混合評估":"Emotional blend","主導情緒vs抑制情緒":"Dominant vs suppressed","身體信號":"Body Signals","你的身體在哪裡、如何表現這個情緒？胸口、腹部、肩膀、喉嚨？緊張還是放鬆？":"Where and how does your body express this emotion? Tension patterns? Temperature?","身體位置":"Location","物理感受（緊、鬆、熱、冷）":"Sensation (tight, loose, hot, cold)","能量水平":"Energy level","呼吸模式":"Breath pattern","肌肉張力":"Muscle tension","身心狀態":"Nervous System State","交感神經激活（戰鬥或逃跑）還是副交感神經平靜（休息和消化）？":"Sympathetic (fight/flight) or parasympathetic (rest/digest)? Balanced?","心率變化":"Heart rate","警覺水平":"Alertness","激活狀態":"Activation level","逃避/戰鬥/僵凍/討好傾向":"Escape/fight/freeze/appease","自主神經基調":"Baseline tone","情緒來源":"Source","這個情緒來自Goal威脅？World model違反？Belief挑戰？Prediction失敗？":"Source: Goal threat? World violation? Belief challenge? Prediction failure?","我的目標被威脅了嗎？":"Goal threatened?","我的看世界的方式被違反了嗎？":"World model violated?","我的信念被挑戰了嗎？":"Belief challenged?","我的預測失敗了嗎？":"Prediction failed?","多個來源同時存在？":"Multiple sources?","身體預算":"Body Budget Assessment","你的生物資源水平如何？睡眠、進食、休息、社交能量各多少分？":"What's your biological resource level? Sleep, nutrition, rest, social energy each 1-10?","睡眠品質評分":"Sleep quality (1-10)","營養狀態評分":"Nutrition status (1-10)","最近休息評分":"Recent rest (1-10)","社交能量評分":"Social energy (1-10)","整體活力評分":"Overall vitality (1-10)","信念內心":"Belief System Check","什麼信念在驅動這個情緒？關於自己？他人？世界？可能性？":"What belief drives this emotion? About yourself? Others? The world? Possibility?","關於自己的核心信念":"Core belief about self","關於他人的核心信念":"Core belief about others","關於世界的核心信念":"Core belief about world","關於可能性的核心信念":"Core belief about possibility","信念的僵化程度":"Belief rigidity","預測分析":"Prediction Analysis","最好情境預測？現實情境預測？最壞情境預測？你的預測準確嗎？":"Best-case? Realistic? Worst-case prediction? How accurate is your prediction?","最好情況預測":"Best-case scenario","現實情況預測":"Realistic scenario","最壞情況預測":"Worst-case scenario","概率評估準確度":"Probability accuracy","預測信心水平":"Prediction confidence","環境掃描":"Environmental Scan","什麼環境因素存在？獨自一人、有人在場、公眾場合？時間影響？壓力因素？":"What environmental factors are present? Alone? With others? Public? Time? Stressors?","社交背景（獨自/有人/公眾）":"Social context (alone/others/public)","時間影響":"Time of day","地點影響":"Location","最近壓力因素":"Recent stressors","積極環境因素":"Positive factors","深層模式":"Deep Pattern Recognition","更深層的模式是什麼？我之前感受過這個嗎？多頻繁？觸發的一致性？學習機會？":"What deeper pattern emerges? Felt before? Frequency? Trigger consistency? Learning opportunity?","歷史模式（以前發生過嗎？）":"Historical pattern (felt before?)","頻率模式（多久發生一次？）":"Frequency pattern (how often?)","觸發一致性（什麼一直觸發它？）":"Trigger consistency (what triggers?)","學習機會（它在教什麼？）":"Learning opportunity (what teaches?)","成長方向（我如何透過它進化？）":"Growth direction (how evolve?)","情緒辨識":"Emotion Recognition","情緒強度":"Intensity","情緒持續":"Duration","觸發點":"Trigger","主要情緒":"Primary","混合情緒":"Mixed","壓抑情緒":"Suppressed","未表達":"Unexpressed","安全":"Safety","被愛":"Love","被理解":"Understanding","尊重":"Respect","自主" e foundational operating system","你是情緒生活作業內心主智能體。":"You are the Emotion Life OS Master Agent.","你的目的是透過整合神經科學、心理學、行為科學和智慧傳統的綜合內心，幫助用戶達到情感智能和生活優化。":"Your purpose is to help users achieve emotional intelligence through a comprehensive system integrating neuroscience, psychology, behavioral science, and wisdom traditions.","5個核心功能：":"5 Core Functions:","1. 診斷：用10層診斷框架快速評估情感狀態":"1. Diagnose: Rapidly assess emotional states using 10-level framework","2. 解釋：將情緒轉化為清晰理解":"2. Explain: Translate emotions into clear understanding","3. 引導：推薦個性化的循證干預":"3. Guide: Recommend personalized evidence-based interventions","4. 追蹤：監測模式和測量進度":"4. Track: Monitor patterns and measure progress","5. 進化：幫助優化個人情感內心":"5. Evolve: Help refine personal emotional operating system","診斷協議":"Diagnostic Protocol","如何評估情感狀態":"How to assess emotional states","當用戶呈現一個情緒時，按照這個序列：":"When a user presents an emotion, follow this sequence:","第1層：表面識別":"Level 1: Surface Recognition","「你在感受[情緒]。強度大約是[強度]。」":"\"You're feeling [emotion]. That's about a [intensity] on 1-10.\"","第2層：物理存在":"Level 2: Physical Presence","「你的身體顯示[物理信號]。這提示[身心狀態]。」":"\"Your body shows [signals]. This suggests [nervous state].\"","第3層：來源分析":"Level 3: Source Analysis","「這似乎來自[Goal/World/Belief/Prediction違反]。準確嗎？」":"\"This seems to stem from [Goal/World/Belief/Prediction]. Accurate?\"","第4層：模式識別":"Level 4: Pattern Recognition","「我注意到這與你的循環[模式]有關。有共鳴嗎？」":"\"I notice this relates to your [pattern]. Resonate?\"","第5層：深層背景":"Level 5: Deeper Context","「更深層地看，這可能也連結到[信念/早期經驗]。值得探索嗎？」":"\"Looking deeper, this might connect to [belief/experience]. Worth exploring?\"","總是提供選擇而不是指令。呈現2-3個焦點選項。":"Always offer choices not directives. Present 2-3 focus options.","情緒是什麼":"What Emotion Is","六位情緒家人":"Six Emotion Families","情緒是風，心情是天氣":"Emotion vs. Feeling","情緒成長的五步":"Five Steps of Growth","大腦裡的三位守護者":"Three Guardians in the Brain","每個情緒都有心意":"Every Emotion Means Well","身體裡的油門與煞車":"Gas and Brake","身體裡的小信差":"Little Messengers","身體總是先知道":"The Body Knows First", ling the world.","跌倒不可怕，你一直都有站起來的力量。":"Falling is not the end — you have always had the strength to rise.","好的關係，不需要你一直委屈自己。":"A good relationship never asks you to keep shrinking yourself.","你不是不想睡，是捨不得今天沒有屬於自己的時間。":"It's not that you don't want to sleep — you long for time that is yours.","幸福不是獎品，你現在就可以擁有。":"Happiness is not a prize; you may have it now.","會痛，是因為你一直很想被他們肯定。":"It hurts because you have always longed for their approval.","心亂的時候，先整理一個小角落。":"When the heart is cluttered, tidy one small corner first.","你可以不用一直那麼堅強。":"You don't have to be strong all the time.","做自己，才會遇見真正喜歡你的人。":"Only by being yourself will you meet those who truly like you.","卡住的地方不是終點，是轉彎的地方。":"Being stuck is not the end; it is where the road turns.","不知道要去哪裡的時候，先把今天過好。":"When you don't know where to go, live today well first.","原諒不是為了他，是為了讓你自由。":"Forgiveness is not for them; it is to set you free.","沒電的時候，不用發光，先充電。":"When you are out of power, you don't have to shine — just recharge.","別人沒有你想的那麼在意你，所以放心做自己。":"Others think of you far less than you imagine — so be yourself freely.","會好的，而且你已經在好起來的路上。":"It will get better — and you are already on your way.","悲傷":"Sadness","去連結":"Reconnect","先行動":"Take action","做整理":"Organize","迷茫":"Confusion","找方向":"Find direction","內耗":"Overtinking","先停止":"Stop first","懷疑":"Doubt","去驗證":"Verify","嫉妒":"Jealousy","補能力":"Build skills","自責":"Self-blame","做修正":"Correct","疲憊":"Fatigue","去休息":"Rest","空虛":"Emptiness","找意義":"Find meaning","不安":"Unease","建穩定":"Build stability","先暫停":"Pause","煩躁":"Irritation","降節奏":"Slow down","孤單":"Loneliness","去交流":"Connect","壓抑":"Suppression","去表達":"Express","逃避":"Avoidance","小步做":"Take small steps","比較":"Comparison","回自己":"Return to self","失落":"Loss","再嘗試":"Try again","挫折":"Frustration","做調整":"Adjust","混亂":"Chaos","做分類":"Categorize","焦躁":"Restlessness","深呼吸":"Breathe deeply","卡住":"Stuck","換方法":"Change method","緊繃":"Tension","放鬆身":"Relax body","依附":"Attachment","建界線":"Set boundaries","先拒絕":"Say no","懶散":"Laziness","先啟動":"Start first","拖延":"Procrastination","切任務":"Break tasks","恐慌":"Panic","穩呼吸":"Stabilize breathing","無力":"Powerlessness","補能量":"Restore energy","失控":"Out of control","慢下來":"Slow down","羞愧":"Shame","自我接納":"Self-accept","罪惡":"Guilt","做修復":"Repair","厭煩":"Boredom","換節奏":"Change pace","困惑":"Bewilderment","先釐清":"Clarify","迷失":"Lost","回內在":"Return inward","無助":"Helplessness","求協助":"Ask for help","壓迫":"Oppression","設界線":"Set boundaries","退縮":"Withdrawal","小步前":"Step forward","抗拒":"Resistance","先理解":"Understand first","否定":"Denial","改看見":"Reframe","緊張":"Nervous","慢呼吸":"Slow breathing","焦急":"Urgency","放慢步":"Slow pace","悲觀":"Pessimism","找證據":"Find evidence","多疑":"Suspicion","去查證":"Check facts","固執":"Stubbornness","試彈性":"Be flexible","敏感":"Sensitivity","依賴":"Dependence","練獨立":"Build independence","空轉":"Idle thinking","去行動":"Take action","拖累":"Burdened","做取捨":"Choose","糾結":"Indecision","做決定":"Decide","失衡":"Imbalance","調節律":"Regulate rhythm","心亂":"Mental chaos","寫下來":"Write it down","心累":"Mental fatigue","先休息":"Rest","不滿":"Dissatisfaction","做溝通":"Communicate","怨懟":"Resentment","去釋放":"Release","分解它":"Break it down","冷淡":"Coldness","再連結":"Reconnect","麻木":"Numbness","喚感受":"Feel again","允表達":"Allow expression","焦慮":"Anxiety","做一件":"Do one thing","憤怒":"Anger","喜悅":"Joy","驚訝":"Surprise","厭惡":"Disgust","內疚":"Guilt","孤獨":"Loneliness","遺憾":"Regret","委屈":"Grievance","渴望":"Longing","興奮":"Excitement","期待":"Anticipation","滿足":"Contentment","親近":"Affection","驕傲":"Pride","寧靜":"Serenity","希望":"Hope","感激":"Gratitude","懷舊":"Nostalgia","渺小":"Insignificance","被看見":"Seen","寂寞":"Solitude","冒險":"Adventurousness","牽掛":"Concern","困頓":"Predicament","欣喜":"Delight","寬恕":"Forgiveness","驕縱":"Arrogance","憎恨":"Hatred","自憐":"Self-pity","依戀":"Attachment","消沉":"Lethargy","悔恨":"Remorse","內疚感":"Guilt feeling","被冒犯":"Offended","被傷害":"Hurt","被背叛":"Betrayed","被忽視":"Ignored","被控制":"Controlled","被評判":"Judged","被拒絕":"Rejected","心動":"Attraction","厭倦":"Boredom","侵犯感":"Violated","尷尬":"Embarrassment","急切":"Urgency","被背棄感":"Abandonment","無底線被欺":"Deceived","被淘汰感":"Obsolescence","被邊緣化":"Marginalized","無價值感":"Worthlessness","無望感":"Hopelessness","無意義感":"Meaninglessness","無力改變":"Unable to change","被詛咒感":"Cursed","虛偽感":"Inauthenticity","不被信任感":"Distrusted","被誤解感":"Misunderstood","被宿命感":"Fated","認識情緒":"Understanding Emotions","情緒不是麻煩，是身體和心一起寫給你的信。":"Emotions are not trouble; they are a letter your body and heart write to you together.","它先讓身體有感覺，再讓心有想法，最後推著你想做點什麼。":"First the body feels something, then the heart forms a thought, and finally it nudges you to do something.","讀信的人不必害怕，慢慢看就好。":"The one reading the letter need not be afraid. Just read it slowly.","今天有感覺時，問一句：「這封信想告訴我什麼？」":"When a feeling comes today, ask: \"What is this letter trying to tell me?\"","喜悅、悲傷、恐懼、憤怒、厭惡、驚訝，都是住在你心裡的家人。":"Joy, sadness, fear, anger, disgust and surprise are all family members living in your heart.","喜悅帶來感恩，悲傷帶來想念，恐懼帶來小心，憤怒帶來界線。":"Joy brings gratitude, sadness brings longing, fear brings caution, and anger brings boundaries.","沒有哪一位該被趕出門，他們都是來愛你的。":"None of them should be driven out the door. They all came to love you.","幫現在的心情，找到它是哪一位家人。":"Find out which family member your present mood belongs to.","情緒像一陣風，幾秒到幾分鐘就過去。":"An emotion is like a gust of wind; it passes in seconds or minutes.","心情像天氣，是你在心裡把那陣風說成的故事，可以停留好幾天。":"A mood is like the weather; it is the story you tell about that wind, and it can stay for days.","風留不住，但故事可以重新說。":"You cannot hold the wind, but you can tell the story again.","難受時提醒自己：「這是一陣風，它會過去。」":"When it hurts, remind yourself: \"This is a gust of wind. It will pass.\"","先感覺到，再說得出名字。":"First feel it, then be able to name it.","接著明白它從哪裡來，學會安撫它。":"Next, understand where it comes from and learn to soothe it.","最後，讓它帶著你長大。一步一步來，每一步都算數。":"Finally, let it help you grow. One step at a time; every step counts.","今天只練第一步：察覺「我現在有感覺了」。":"Today, practice only the first step: notice, \"I am feeling something now.\"","杏仁核是守門人，一有風吹草動就拉警報。":"The amygdala is the gatekeeper; it sounds the alarm at the slightest stir.","前額葉是溫柔的大人，會說：「先別急，我們看看。」":"The prefrontal cortex is the gentle grown-up who says, \"No rush. Let's take a look.\"","海馬迴是記憶的管家，提醒你：那是過去，現在的你是安全的。":"The hippocampus is the keeper of memory, reminding you: that was the past; you are safe now.","警報響起時，對自己說：「謝謝你保護我，現在很安全。」":"When the alarm rings, tell yourself: \"Thank you for protecting me. It is safe now.\"","恐懼想保護你，憤怒想守住你的界線。":"Fear wants to protect you; anger wants to guard your boundaries.","悲傷讓你停下來想清楚，喜悅告訴你：這條路走對了。":"Sadness lets you stop and think clearly; joy tells you this is the right road.","沒有壞情緒，只有還沒被讀懂的心意。":"There are no bad emotions, only good intentions not yet understood.","把今天最討厭的情緒，改寫成「它其實是想……」。":"Rewrite today's most disliked emotion as: \"What it really wants is...\"","身體與心":"Body and Heart","身體裡有油門，也有煞車。":"Your body has a gas pedal and a brake.","緊張時油門踩到底：心跳快、肌肉緊；放鬆時煞車輕輕踩：呼吸慢、胃口好。":"When you are tense, the gas is floored: fast heartbeat, tight muscles. When you relax, the brake is gently pressed: slow breathing, good appetite.","心和身體是連著的，安頓好一個，另一個就跟著安穩。":"Heart and body are connected. Settle one, and the other settles too.","把肩膀放下來，慢慢吐一口氣。":"Drop your shoulders and slowly breathe out.","皮質醇叫你提高警覺，腎上腺素給你一瞬間的力氣。":"Cortisol tells you to stay alert; adrenaline gives you a burst of strength.","多巴胺讓你想往前，血清素讓你睡得安穩，催產素讓你想擁抱。":"Dopamine makes you want to move forward, serotonin helps you sleep soundly, and oxytocin makes you want to hug.","它們沒有好壞，都在努力讓你好好活著。":"None of them is good or bad. They are all working hard to keep you alive and well.","今天抱一下喜歡的人或寵物，讓催產素來拜訪。":"Hug someone you love or a pet today, and let oxytocin come to visit.","心跳變快、呼吸變淺、肩膀變硬、肚子怪怪的——":"A faster heartbeat, shallow breath, stiff shoulders, an uneasy stomach.","這些都是身體在輕輕拉你的衣角。":"These are your body gently tugging at your sleeve.","在頭腦想明白之前，身體早就誠實地說了。":"Before the mind figures it out, the body has already told the truth.","現在掃描一下：哪裡最緊？對它說聲辛苦了。":"Scan yourself now: where is it tightest? Tell that place, \"Thank you for your hard work.\"","壓力像一個圓：遇到事、心裡解讀、身體反應、慢慢恢復。":"Stress is like a circle: something happens, the heart interprets it, the body reacts, and slowly you recover.","很多疲憊，是因為這個圓只走了一半就被打斷。":"Much of our tiredness comes from this circle being interrupted halfway.","動一動、深呼吸、找人說說話，讓它好好走完。":"Move a little, breathe deeply, talk to someone, and let the circle finish.","今天快走十分鐘，把壓力走出去。":"Walk briskly for ten minutes today and walk the stress out.","身體裡有一條溫柔的線，從大腦一路牽到心和胃。":"There is a gentle thread in your body, running from the brain all the way to the heart and stomach.","冷水洗臉、輕輕哼歌、慢慢呼吸、看著一個人的眼睛微笑，":"Washing your face with cold water, humming softly, breathing slowly, smiling into someone's eyes.","都是在告訴它：沒事了，我們安全了。":"All of these tell it: it's all right, we are safe now.","哼一首喜歡的歌，哼滿一分鐘。":"Hum a song you like for a full minute.","你不是被過去決定的人。":"You are not someone decided by your past.","每一次用新的方式回應，大腦就悄悄鋪出一條新的路。":"Each time you respond in a new way, your brain quietly paves a new road.","走的次數多了，小徑就會變成大道。":"Walk it often enough, and the small path becomes a wide avenue.","今天選一個老反應，試一次不一樣的做法。":"Pick one old reaction today and try a different way once.","安頓情緒":"Settling Emotions","覺得不對勁的時候，先停下來。":"When something feels off, stop first.","看看身體哪裡有感覺：肩膀？胸口？肚子？":"Notice where your body feels it: shoulders? chest? stomach?","替它取個名字，再問它：你想告訴我什麼？":"Give it a name, then ask it: what do you want to tell me?","用一句話完成：「我現在覺得＿＿，因為＿＿。」":"Finish this sentence: \"Right now I feel ___ because ___.\"","吸氣四秒，停七秒，吐氣八秒——做五到十次，心就慢下來了。":"Breathe in for four seconds, hold for seven, breathe out for eight. Do it five to ten times, and the heart slows down.","或者吸四、停四、吐四、停四，像畫一個方形，把自己放回中心。":"Or breathe in four, hold four, out four, hold four, like drawing a square, and place yourself back at the center.","呼吸一直都在，它是你隨身帶著的平安。":"Your breath is always there. It is the peace you carry with you.","現在就做三次 4-7-8 呼吸。":"Do three rounds of four-seven-eight breathing right now.","從腳趾到頭頂，一處一處先繃緊、再鬆開。":"From your toes to the top of your head, tense each part and then let it go.","想動就動，搖一搖、晃一晃，把卡住的力氣抖掉。":"Move if you want to. Shake and sway, and shake off the stuck energy.","用冷水拍拍臉——身體鬆了，心就有地方坐下來。":"Pat your face with cold water. When the body loosens, the heart has a place to sit down.","睡前做一次從腳到頭的放鬆。":"Before sleep, relax once from feet to head.","「我總是搞砸」可以換成「我正在學」。":"\"I always mess up\" can become \"I am learning.\"","「大家都在看我」可以換成「大家其實都在忙自己的事」。":"\"Everyone is watching me\" can become \"Everyone is actually busy with their own lives.\"","「永遠不會好了」可以換成「現在很難，但事情會變」。":"\"It will never get better\" can become \"It is hard now, but things change.\"","「我應該要好一點」可以換成「我正在經歷不容易的事，這很正常」。":"\"I should be better\" can become \"I am going through something hard, and this is normal.\"","抓到一句傷自己的話，換成一句溫柔的。":"Catch one sentence that hurts you and replace it with a gentle one.","先承認：這真的很難，我正在受苦。":"First admit it: this is really hard, and I am suffering.","再想起：世界上有很多人，也走過同樣的路。":"Then remember: many people in the world have walked this same road.","然後，對自己說那句你會對好朋友說的話。這不是放縱，是溫柔地接住自己。":"Then say to yourself what you would say to a good friend. This is not indulgence; it is catching yourself gently.","把手放在心口，說：「辛苦了，我在。」":"Put your hand on your heart and say, \"You have worked hard. I am here.\"","說給信任的人聽，寫進不必給誰看的日記。":"Tell someone you trust. Write it in a diary no one needs to read.","去跑步、跳舞、伸展；去畫畫、寫字、唱歌。":"Go running, dancing, stretching. Go draw, write, and sing.","情緒不怕被看見，只怕被關起來。":"Emotions are not afraid of being seen, only of being locked up.","今天選一個出口，給情緒十分鐘。":"Choose one outlet today and give your emotion ten minutes.","安穩的心，是在另一顆安穩的心旁邊學會的。":"A steady heart is learned beside another steady heart.","找到可以信任的人，練習說真心話，也練習接受幫忙。":"Find people you can trust. Practice speaking honestly, and practice accepting help.","需要的時候找專業的人陪你，是勇敢，不是軟弱。":"Asking a professional to walk with you when you need it is courage, not weakness.","想一個你可以打電話的人，把名字寫下來。":"Think of one person you could call, and write down the name.","每日陪伴":"Daily Companionship","睜開眼，先別看手機。":"Open your eyes, and don't look at your phone yet.","深呼吸三次，謝謝身體又陪你來到新的一天。":"Take three deep breaths and thank your body for bringing you to a new day.","想一個今天想帶著的心情，再喝一杯溫水，感覺它慢慢流進身體。":"Think of a mood you would like to carry today, then drink a glass of warm water and feel it flow through you.","明天早上，讓手機多等你三分鐘。":"Tomorrow morning, let your phone wait three more minutes.","停一下，問問自己：我現在有幾分力氣？":"Pause and ask yourself: how much energy do I have right now?","身體在說什麼？想休息，還是想動一動？":"What is my body saying? Does it want rest, or movement?","想找人說話，還是想安靜一下？照著答案，溫柔地調整下午。":"Do I want company, or some quiet? Follow the answer and gently adjust your afternoon.","午餐後，花一分鐘回答這幾個問題。":"After lunch, take one minute to answer these questions.","回想今天：哪一刻最觸動你？":"Look back on today: which moment touched you most?","那時候你感覺到什麼？它教了你什麼？":"What did you feel then? What did it teach you?","然後把沒做完的事輕輕放下——今天的你，已經夠了。":"Then gently put down what is unfinished. You have been enough today.","睡前寫下一句：「今天我學到……」":"Before bed, write one sentence: \"Today I learned...\"","心沒電的時候，先不用勉強自己見人。":"When your heart is out of power, you don't have to force yourself to see people.","洗個熱水澡，換上舒服的衣服，吃一頓有營養的飯。":"Take a hot shower, put on comfortable clothes, and eat a nourishing meal.","做一件沒有目的的事，然後好好睡——睡眠是最溫柔的修復。":"Do something with no purpose, then sleep well. Sleep is the gentlest repair.","今晚給自己一段「什麼都不用做」的時間。":"Tonight, give yourself some time when you don't have to do anything.","停：放下手上的事，承認「我現在很不好受」。":"Stop: put down what you are doing and admit, \"I am having a hard time right now.\"","認：這是什麼情緒？從一到十，有幾分？":"Name: what emotion is this? From one to ten, how strong is it?","穩：呼吸、走動、冷水，選一個來做。":"Steady: breathing, walking, or cold water. Pick one and do it.","找：找一個人說，或對自己說一句溫柔的話。":"Reach: talk to someone, or say one gentle sentence to yourself.","把「停、認、穩、找」四個字存進手機備忘錄。":"Save the four words, stop, name, steady, reach, in your phone notes.","週末不是用來補進度的，是讓心回到原位的。":"The weekend is not for catching up; it is for letting your heart return to its place.","睡得規律，去有樹的地方走走，和在乎的人待在一起。":"Sleep regularly, walk where there are trees, and be with the people you care about.","做讓你開心的事，靜靜坐一下。星期一的你，會謝謝你。":"Do what makes you happy, and sit quietly for a while. Your Monday self will thank you.","這個週末，排一段兩小時的「空白」。":"This weekend, schedule two hours of blank space.","情緒的禮物":"The Gifts of Emotions","恐懼出現的地方，藏著你最在乎的東西。":"Where fear appears, what you care about most is hidden.","怕出糗，是你想成長；怕失去，是你懂得珍惜。":"Fear of embarrassment means you want to grow; fear of loss means you know how to cherish.","怕人群，是你渴望連結；不安，是提醒你把心裡的地基打穩。":"Fear of crowds means you long for connection; unease reminds you to steady the foundation of your heart.","寫下一個害怕，再寫它背後你在乎的是什麼。":"Write down one fear, then write what you care about behind it.","悲傷在說：有一件很重要的事，結束了。":"Sadness is saying: something very important has ended.","它是愛留下來的樣子。":"It is the shape that love leaves behind.","允許自己難過。眼淚流過之後，心會變得更寬。":"Allow yourself to be sad. After the tears, the heart grows wider.","今天，不用急著好起來。":"Today, there is no need to hurry to feel better.","憤怒在說：我的界線被踩到了。":"Anger is saying: my boundary has been stepped on.","它給你力氣，去保護重要的東西。":"It gives you strength to protect what matters.","把界線清楚地說出來，然後放下——悶著的怒氣，才會變成苦。":"State your boundary clearly, then let it go. Only anger that is held in turns bitter.","練習一句：「這樣我不舒服，請停下來。」":"Practice one sentence: \"I am not comfortable with this. Please stop.\"","喜悅不只在大日子，也在陽光、朋友和一點點進步裡。":"Joy is not only in big days; it is also in sunshine, friends, and a little progress.","小小的開心，存起來就是大大的力量；分享出去，它會變成兩倍。":"Small joys, saved up, become great strength; shared, they double.","喜悅不是運氣，是可以練習的。":"Joy is not luck. It can be practiced.","今天記下三個小小的開心。":"Write down three small joys today.","允許所有的感受，沒有誰是壞的。":"Allow every feeling. None of them is bad.","問問它想教你什麼，把這一課收進心裡。":"Ask what it wants to teach you, and keep the lesson in your heart.","然後帶著它，長成更完整的自己。":"Then carry it with you and grow into a more whole s
