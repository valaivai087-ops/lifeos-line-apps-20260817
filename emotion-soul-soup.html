ar of loss, and blurred boundaries","建立健康邊界，培養獨立性":"It sets healthy boundaries and grows independence.","犧牲能量":"Sacrificing energy","自我背棄、過度退讓、失去邊界":"betraying yourself, giving way too much, and losing your boundaries","恢復自我尊重，建立真實邊界":"It restores self-respect and sets real boundaries.","防禦能量":"Defensive energy","拒絕接納、自我保護過度、阻礙改變":"refusing to accept, protecting yourself too much, and blocking change","打開心扉，理解事物真相":"It opens the heart and lets you see things as they are.","逃避能量":"Avoiding energy","事實不可接納、虛實混淆、自欺欺人":"facts you cannot accept, confusing real and unreal, and fooling yourself","面對現實，成長認知":"It faces reality and lets your understanding grow.","凍結能量":"Frozen energy","過度傷害、自我保護、感受封閉":"too much hurt, self-protection, and closed-off feeling","解凍心理，恢復感知能力":"It thaws the heart and restores your ability to feel.","隔離能量":"Isolating energy","人際防禦、情感隔絕、關係距離":"guarding against people, cut-off feeling, and distance in relationships","重新開放心扉，恢復溫暖":"It reopens the heart and restores warmth.","鎖定能量":"Locked energy","情緒被壓制、需要表達、能量滯留":"emotions held down, a need to express, and energy that is stuck","安全表達，釋放滯留能量":"It expresses safely and releases stuck energy.","停滯能量":"Stalled energy","動力喪失、拖延行為、需要啟動":"lost drive, delaying, and a need to get started","啟動行動，克服慣性":"It starts action and overcomes inertia.","任務焦慮、完美主義、需要分解":"worry about a task, perfectionism, and a need to break it down","任務分解，降低心理阻力":"It breaks the task down and lowers resistance.","躁動能量":"Restless energy","過度興奮、無法放鬆、需要釋放":"too much excitement, being unable to relax, and a need for release","激活副交感神經，恢復平靜":"It wakes the calming nerves and restores peace.","收縮能量":"Tightening energy","肌肉緊張、心理警覺、過度防守":"tense muscles, a watchful mind, and guarding too much","肌肉放鬆，解除心理防禦":"It relaxes the muscles and lowers the mind's defenses.","下沉能量":"Sinking energy","失去動力、陷入低迷、希望減少":"lost drive, a low mood, and less hope","做點小事":"do one small thing","啟動正向循環，逐步恢復活力":"It starts a positive cycle and gradually restores vitality.","差異能量":"Energy of difference","期待未達、需求未滿足、需要調整":"hopes unmet, needs unfulfilled, and a need to adjust","清晰表達，協商調整":"It speaks clearly and negotiates a change.","積累能量":"Built-up energy","長期被冒犯、怒火積累、需要釋放":"long-term offense, anger piling up, and a need for release","安全表達，清理心理垃圾":"It expresses safely and clears out the clutter in the mind.","贖罪能量":"Atoning energy","真心悔改、願意改正、尋求寬恕":"sincere regret, willingness to change, and seeking forgiveness","付諸行動，修復關係":"It takes action and repairs the relationship.","自我懲罰":"Self-punishment","過度自責、不允許犯錯、自我攻擊":"too much self-blame, not allowing mistakes, and attacking yourself","自我原諒":"forgive yourself","停止自責，實踐自我同情":"It stops the self-blame and practices self-compassion.","道德能量":"Moral energy","違反道德準則、傷害他人、需要改正":"breaking a moral rule, hurting someone, and a need to make it right","做改正":"make it right","採取行動，恢復道德一致性":"It takes action and restores your integrity.","邊界被踩踏、尊嚴被冒犯、需要維護":"a boundary trampled, dignity offended, and a need to stand up for yourself","設邊線":"draw the line","清晰表達邊界，要求尊重":"It states the boundary clearly and asks for respect.","創傷能量":"Wounded energy","心理受創、信任被破壞、需要療愈":"a hurt mind, broken trust, and a need for healing","處理創傷，恢復信任":"It works through the wound and restores trust.","破裂能量":"Breaking energy","信任被打破、期待落空、關係崩裂":"trust broken, hopes dashed, and a relationship torn apart","處理背叛，重建世界觀":"It works through the betrayal and rebuilds your view of the world.","存在能量":"Energy of presence","感到不重要、被遺忘、存在感喪失":"feeling unimportant, forgotten, and unseen","清晰發聲，要求被看見":"It speaks up clearly and asks to be seen.","自由能量":"Energy of freedom","自主權喪失、被操縱、需要解脫":"lost autonomy, being manipulated, and a need to break free","恢復主體性，重奪控制權":"It restores your agency and takes back control.","自我能量":"Energy of self","受到批評、身份被質疑、需要證明":"being criticized, having your identity questioned, and a need to prove yourself","自我肯定":"affirm yourself","強化自信，不依賴外界評價":"It strengthens confidence without relying on outside judgment.","歸屬能量":"Belonging energy","被排斥、不被接納、身份威脅":"being excluded, not accepted, and a threat to identity","找歸屬":"find where you belong","尋找認同團體，恢復歸屬感":"It looks for a group that accepts you and restores belonging.","被吸引、渴望靠近、尋求親密":"being drawn to someone, longing to come near, and seeking closeness","表達感受，建立連結":"It expresses feelings and builds connection.","刺激能量":"Stimulating energy","缺乏新意、重複感、需要變化":"nothing new, a sense of repetition, and a need for change","引入新鮮刺激，重燃興趣":"It brings in something fresh and rekindles interest.","理解能量":"Understanding energy","信息混亂、無法理解、需要釐清":"muddled information, being unable to understand, and a need to clarify","收集信息，建立清晰認知":"It gathers information and builds a clear picture.","失去方向、人生目標模糊、需要指引":"a lost direction, hazy life goals, and a need for guidance","內在探索，找回真實自我":"It explores within and finds the real self again.","保護能量":"Protective energy","過度內向、社交隔離、需要平衡":"turning inward too much, social isolation, and a need for balance","逐步擴展舒適圈，建立連結":"It widens the comfort zone step by step and builds connection.","隱私被侵犯、人身邊界被侵害、需要保護":"privacy invaded, personal boundaries violated, and a need for protection","建立清晰邊界，保護自己":"It sets clear boundaries and protects you.","社交能量":"Social energy","社交失誤、形象受損、需要補救":"a social slip, a damaged image, and a need to make amends","放下完美主義，接納不完美":"It lets go of perfectionism and accepts imperfection.","時間能量":"Energy of time","時間緊張、需求急迫、需要加速":"too little time, pressing demands, and a need to speed up","調整節奏，優先級排序":"It adjusts the pace and sets priorities.","表現能量":"Performance energy","表現焦慮、擔心失敗、需要建立信心":"performance anxiety, worry about failing, and a need to build confidence","生理調節，激活副交感神經":"It regulates the body and wakes the calming nerves.","預期負面、信念消極、需要重塑信念":"expecting the worst, gloomy beliefs, and a need to reshape them","尋找反證，重建希望":"It looks for evidence to the contrary and rebuilds hope.","警惕能量":"Wary energy","信任受損、過度警覺、需要驗證":"damaged trust, too much watchfulness, and a need to check","收集事實，成長信念":"It gathers facts and lets beliefs grow.","評估能量":"Evaluating energy","自我貶低、他人優越感、需要回歸自己":"putting yourself down, seeing others as better, and a need to return to yourself","專注於自身成長，停止橫向對比":"It focuses on your own growth and stops comparing sideways.","堅持能量":"Persisting energy","過度堅持、拒絕改變、失去彈性":"holding on too hard, refusing change, and losing flexibility","開放心態，學習新觀點":"It keeps an open mind and learns new views.","感知能量":"Sensing energy","過度反應、邊界模糊、需要保護":"overreacting, blurred boundaries, and a need for protection","建立心理邊界，保護自己":"It sets boundaries of the mind and protects you.","自主能量":"Autonomy energy","過度依靠、喪失獨立、需要賦能":"leaning on others too much, lost independence, and a need for empowerment","逐步建立自主能力":"It builds your ability to stand on your own, step by step.","思維反覆、沒有行動、能量浪費":"thoughts going in circles, no action, and wasted energy","結束思考循環，付諸實踐":"It ends the loop of thought and puts things into practice.","承載過重、責任超負荷、需要取捨":"carrying too much, responsibility overloaded, and a need to choose","評估優先級，放下非本質":"It weighs priorities and puts down what is not essential.","決策能量":"Deciding energy","無法抉擇、猶豫不決、需要決定":"being unable to choose, hesitating, and a need to decide","啟動決策流程，承諾方向":"It starts the process of deciding and commits to a direction.","調和能量":"Harmonizing energy","系統失調、要素比例失當、需要重新配置":"being out of tune, parts out of proportion, and a need to rearrange","恢復內心平衡":"It restores balance in the heart.","整理能量":"Sorting energy","思緒混亂、心無所屬、需要梳理":"scattered thoughts, a heart with nowhere to rest, and a need to sort things through","外化思想，實現組織化":"It puts thoughts outside yourself and brings them into order.","心理耗盡、精神枯竭、需要補充":"a worn-out mind, a spirit run dry, and a need to refill","停止消耗，啟動恢復":"It stops the spending and starts recovery.","依附能量":"Attachment energy","被拋棄、關係終結、存在感威脅":"being abandoned, a relationship ending, and a threat to your sense of presence","處理喪失，修復自我認同":"It works through the loss and repairs your sense of self.","信任能量":"Trust energy","被欺騙、信任崩裂、現實扭曲":"being deceived, trust shattered, and a distorted reality","釐清真相":"find out the truth","恢復現實感，重建信念內心":"It restores a sense of reality and rebuilds what you believe.","價值能量":"Energy of worth","被取代、價值喪失、時代更新":"being replaced, a lost sense of value, and changing times","做升級":"level up","學習成長，適應變化":"It learns, grows, and adapts to change.","被排斥、群體隔絕、身份邊緣":"being excluded, cut off from the group, and pushed to the margins","尋社群":"look for community","尋找認同群體，恢復歸屬":"It looks for a group that accepts you and restores belonging.","自我否定、價值感喪失、自我厭棄":"rejecting yourself, a lost sense of worth, and disliking yourself","做肯定":"affirm yourself","識別價值，重建自信":"It recognizes your worth and rebuilds confidence.","未來能量":"Energy of the future","看不到出口、黑暗籠罩、放棄努力":"seeing no way out, darkness all around, and giving up","找光亮":"look for the light","尋找希望點，重燃生命火焰":"It looks for a point of hope and rekindles the flame of life.","生活虛無、目標缺失、精神崩潰":"an empty life, missing goals, and a broken spirit","尋意義":"look for meaning","連結人生目標，重建意義":"It reconnects you with your purpose and rebuilds meaning.","困於現狀、無法突破、自我評估過低":"being trapped where you are, unable to break through, and rating yourself too low","做小改變":"make one small change","啟動改變循環，逐步突破":"It starts a cycle of change and breaks through step by step.","命運能量":"Energy of fate","運氣不好、反覆失敗、自我詛咒":"bad luck, repeated failure, and cursing yourself","改視角":"change your point of view","重構敘事，從受害者到創造者":"It retells the story, from victim to creator.","真實能量":"Energy of authenticity","假裝自己、失去真實、內外不一":"pretending, losing what is real, and being one thing inside and another outside","回真實":"return to what is real","脫下面具，活出真我":"It takes off the mask and lives as the true self.","信譽能量":"Energy of credibility","信任被質疑、形象受損、需要證明":"trust questioned, a damaged image, and a need to prove yourself","做證明":"show it through action","用行動建立信譽":"It builds credibility through action.","溝通能量":"Communicating energy","表達不清、被曲解、需要澄清":"unclear expression, being misread, and a need to clarify","去澄清":"clarify","改進溝通，建立理解":"It improves communication and builds understanding.","認命、無力反抗、喪失主體性":"resignation, being powerless to resist, and lost agency","做選擇":"make a choice","重奪主體性，創造未來":"It takes back your agency and creates the future.","智慧能力":"Wisdom abilities","成長看世界的方式":"Growing how you see the world","成長內在的預想":"Growing your inner expectations","深層錯誤":"Deeper mistakes","深層反思":"Deeper reflection","大多數人只在「情緒層」修補情緒，但真正的問題往往在其他層次：睡眠不足讓身心失穩，注意力碎裂讓思維無法收斂，舊的說話方式把想法鎖死，身份固化讓改變失去方向。":"Most people try to mend emotions only at the emotion layer, but the real problem is often elsewhere: lack of sleep unsettles body and mind, scattered attention keeps thoughts from settling, old ways of speaking lock ideas in place, and a fixed identity leaves change without direction.","語言是身心的底層。你反覆說的話，會被大腦當成指令執行，形成神經迴路，最終影響情緒、決策和行動。舊的說話方式不只描述現實，更在創造現實。":"Language is the ground floor of body and mind. Words you repeat are carried out by the brain like instructions, forming neural circuits that shape your emotions, decisions and actions. Old ways of speaking do not only describe reality; they create it.","很多人在情緒混亂時，直接跳到「我要更努力」「我要更自律」。但如果不知道混亂的源頭在哪一層，努力只是在內耗的狀態裡加速消耗。":"When emotions are in chaos, many people jump straight to \"I must try harder\" or \"I must be more disciplined.\" But if you don't know which layer the chaos comes from, effort only burns you out faster.","負面自我對話→降低自我效能感→迴避行為→更多失敗→更多負面對話；語言框架→情緒框架→行動可能性；大腦用語言預測未來，舊的說話方式讓內在的預想陷入負迴圈。":"Negative self-talk lowers your belief in yourself, leads to avoidance, more failure, and more negative talk. The frame of your language becomes the frame of your emotions and of what you can do. The brain uses language to predict the future, and old ways of speaking trap your expectations in a negative loop.","1. 把「我很爛」→「這個策略待優化」 2. 把「沒救了」→「想法需要成長」 3. 把「完了」→「內心在重組」 4. 把「永遠改不了」→「神經具有可塑性」 5. 每天替換3句舊的說話方式 6. 用「正在」說法：「我正在練習…」":"1. Change \"I'm terrible\" to \"this approach can be improved.\" 2. Change \"I'm hopeless\" to \"my thinking needs to grow.\" 3. Change \"it's over\" to \"my heart is reorganizing.\" 4. Change \"I will never change\" to \"the brain can change.\" 5. Replace three old sentences every day. 6. Use \"I am\" in progress: \"I am practicing...\"","1. 辨識很耗神關係：這段關係讓我更有能量還是更沒能量？ 2. 練習說「不」：先從小事開始 3. 建立情緒邊界：你的情緒是你的，我可以陪伴但不是責任 4. 靠近高品質圈層：能量會傳染 5. 降低低品質互動的時間與頻率 6. 建立自我支持：不把情緒完全外包":"1. Recognize draining relationships: does this relationship give me energy or take it away? 2. Practice saying no, starting with small things. 3. Set emotional boundaries: your feelings are yours; I can keep you company, but they are not my responsibility. 4. Move closer to good company: energy is contagious. 5. Spend less time, less often, in poor-quality interactions. 6. Build your own support: don't hand all your emotions over to others.","→ 減少內耗 → 恢復身心 → 重建語言習慣 → 提高情緒辨識 → 恢復觀察者位置 → 建立安穩環境 → 持續學習":"Reduce the drain, restore body and mind, rebuild your language habits, improve emotional awareness, return to the observer's seat, build a steady environment, and keep learning.","從神經科學角度，大腦有兩套模式：求生本能和理性的自己。當情緒壓力太高，大腦會優先啟動求生本能，因為對大腦來說：活下來，比理性重要。所以當情緒被觸發，前額葉功能會下降，杏仁核活性會上升。這時候大腦會開始短視化、衝動化、逃避化。":"From the view of neuroscience, the brain has two modes: the survival instinct and the rational self. When emotional pressure is too high, the brain starts the survival instinct first, because to the brain, staying alive matters more than being rational. So when emotion is triggered, the prefrontal cortex does less and the amygdala does more. The brain becomes short-sighted, impulsive, and avoidant.","從神經科學角度，大腦有一個特性：重複的路徑，會越來越強——這叫神經可塑性。你越常焦慮，焦慮路徑越強；你越常討好，討好迴路越穩定；你越常逃避，逃避的習慣越自動化。久了之後，情緒不需要思考就會直接啟動。這也是為什麼：知道道理，不等於神經重寫。":"From the view of neuroscience, the brain has a trait: paths that are repeated grow stronger. This is neuroplasticity. The more often you are anxious, the stronger the anxiety path; the more you please, the steadier the pleasing circuit; the more you avoid, the more automatic the habit of avoiding becomes. In time, emotions start without thought. This is why knowing the reasoning is not the same as rewiring the nerves.","真正成熟，不是讓所有人理解你，而是即使被誤解，仍然穩定。第一步：停止過度解釋。第二步：把身份與評價分離——別人否定我≠我沒價值。第三步：建立內在肯定，不只問「別人怎麼看我」，開始問「我有沒有對齊自己」。第四步：允許誤解存在，因為不是所有人都有能力理解你。":"Real maturity is not having everyone understand you, but staying steady even when misunderstood. First, stop over-explaining. Second, separate identity from judgment: someone rejecting me does not mean I have no worth. Third, build inner affirmation: don't only ask \"What do others think of me?\" Begin asking \"Am I true to myself?\" Fourth, allow misunderstanding to exist, because not everyone is able to understand you.","情緒＝心的提醒":"Emotion equals a reminder from the heart","現在｜安穩":"Now: calm and steady","從內耗到安穩流動的完整指南":"A complete guide from inner drain to steady flow","這本書分為七個部分，從情緒的本質出發，到抗傷能力的建立，到五大情緒錯誤轉換的糾正，到50種情緒的內心解碼，最後到整個人的重新調整。":"This book has seven parts: from the nature of emotion, to building resilience, to correcting five wrong emotional conversions, to decoding fifty emotions, and finally to readjusting the whole person.","②減少內耗：累的時候不要做重大決定。先睡覺，先吃飯，先補水。神經穩了，才有能力處理問題。":"Two, reduce the drain: don't make big decisions when you are tired. Sleep first, eat first, drink water first. Only when the nerves are steady can you deal with the problem.","內耗的狀態與安穩的狀態":"The draining state and the steady state","內耗 vs 安穩的狀態循環":"The draining cycle versus the steady cycle","流動才能減少內耗":"Only flow reduces the inner drain","①十層內心分析表——從問題現象到智慧整合，完整拆解每個主題的深層機制。②從前vs更有智慧對照——清楚呈現從前常說和現在可以說的差異。③心的成長路徑——視覺化的照顧自己的路徑。④更有智慧金句——濃縮章節核心的關鍵句。⑤給自己的溫柔提醒——實際可用的說法替換練習。⑥每日小練習——具體的行動步驟。":"One, a ten-layer table of the heart, taking each theme apart from what we experience to wisdom. Two, a before-and-now comparison, showing clearly what I used to say and what I can say now. Three, the heart's path of growth, a picture of the way to care for yourself. Four, wise sayings, the key sentences of the chapter. Five, gentle reminders to yourself, phrases you can actually swap in. Six, a small daily practice with concrete steps.","成長的路徑很清楚：看見舊想法→理解內心機制→建立現在可以說→用行動溫習身心。這不是靠意志力完成的，而是靠重複的小行動，一點一點地讓大腦成長內在的預想。":"The path of growth is clear: see the old thought, understand how the heart works, find what you can say now, and practice it through action. It is not done by willpower, but by small repeated actions that, little by little, let the brain grow new expectations.","高壓情境檢驗自己的成長":"High-pressure moments test your growth","檢驗自己的成長成效":"Check how well your growth is going","肯定成熟度":"Check how mature the heart is","安穩":"Calm and steady","建立內在肯定":"Build inner affirmation","童年不穩定依附　→　愛是不穩定想法　→　長期高警戒　→　焦慮討好控制逃避　→　關係很耗神　→　辨識依附觸發　→　停止外包安全感　→　建立內在穩定　→　依附的成長　→　穩定親密能力生成":"Unstable attachment in childhood, the belief that love is unstable, long-term high alert, anxious pleasing, control and avoidance, and a draining relationship; then recognize the trigger, stop handing your safety to others, build inner steadiness, let your attachment grow, and the ability to be close and steady grows.","親愛的，悲傷不是你的錯。它只是在提醒你：失去、分離、需要陪伴。給自己一點時間，試著去連結。":"Dear one, sadness is not your fault. It is only reminding you of this: loss, separation, and a need for company. Give yourself a little time, and try to reconnect.","別急著趕走恐懼。它帶著一封信：危險、威脅、需要防禦。讀懂了，就先行動吧。":"Don't rush to chase fear away. It carries a letter: danger, threat, and a need to defend yourself. Once you have read it, take action.","憤怒來的時候，不是你不夠好，是心在說：「被侵犯、不公平、需要捍衛」。此刻，溫柔地做行動就好。":"When anger comes, it is not that you are not good enough. Your heart is saying: being invaded, unfairness, and a need to stand up for yourself. For now, just gently take action.","親愛的，喜悅不是你的錯。它只是在提醒你：目標達成、連結成功、獲得認可。給自己一點時間，試著去分享。":"Dear one, joy is not your fault. It is only reminding you of this: a goal reached, a connection made, and being recognized. Give yourself a little time, and try to share it.","別急著趕走驚訝。它帶著一封信：預測失誤、出現異常、需要重新評估。讀懂了，就暫停反應吧。":"Don't rush to chase surprise away. It carries a letter: a wrong prediction, something unusual, and a need to look again. Once you have read it, pause before you react.","厭惡來的時候，不是你不夠好，是心在說：「觸犯價值觀、接近有害物質、違反道德」。此刻，溫柔地做拒絕就好。":"When disgust comes, it is not that you are not good enough. Your heart is saying: values offended, something harmful nearby, or a moral line crossed. For now, just gently say no.","親愛的，焦慮不是你的錯。它只是在提醒你：未來失控感、預期威脅、不確定性。給自己一點時間，試著做準備。":"Dear one, anxiety is not your fault. It is only reminding you of this: a future that feels out of control, an expected threat, and uncertainty. Give yourself a little time, and try to prepare.","別急著趕走內疚。它帶著一封信：違反自己的標準、傷害他人、需要改正。讀懂了，就做修復吧。":"Don't rush to chase guilt away. It carries a letter: going against your own standards, hurting someone, and a need to make it right. Once you have read it, repair.","羞愧來的時候，不是你不夠好，是心在說：「身份威脅、被評判、自我否定」。此刻，溫柔地自我接納就好。":"When shame comes, it is not that you are not good enough. Your heart is saying: a threat to identity, being judged, and rejecting yourself. For now, just gently self-accept.","親愛的，嫉妒不是你的錯。它只是在提醒你：資源不足、被比較、需要提升。給自己一點時間，試著補能力。":"Dear one, jealousy is not your fault. It is only reminding you of this: too few resources, being compared, and a need to improve. Give yourself a little time, and try to build skills.","別急著趕走孤獨。它帶著一封信：被隔絕、缺乏歸屬感、內心空虛。讀懂了，就去交流吧。":"Don't rush to chase loneliness away. It carries a letter: being cut off, lacking belonging, and inner emptiness. Once you have read it, connect.","無助來的時候，不是你不夠好，是心在說：「失去控制、無法改變局面、需要幫助」。此刻，溫柔地求協助就好。":"When helplessness comes, it is not that you are not good enough. Your heart is saying: loss of control, being unable to change things, and a need for help. For now, just gently ask for help.","親愛的，內耗不是你的錯。它只是在提醒你：反覆糾結、自我對抗、陷入思維迴圈。給自己一點時間，試著先停止。":"Dear one, overtinking is not your fault. It is only reminding you of this: going round and round, fighting yourself, and being caught in a loop of thought. Give yourself a little time, and try to stop first.","別急著趕走空虛。它帶著一封信：失去目標、生活無意義、精神匱乏。讀懂了，就找意義吧。":"Don't rush to chase emptiness away. /* ---------- 臉書痛點圖卡 ---------- */
const THEMES = [
  {n: '暖陶', band: '#C1703C', bg: '#FAF6F0', box: '#FFF0D4'},
  {n: '湖水綠', band: '#3E8E84', bg: '#F3F8F6', box: '#DCEFEA'},
  {n: '藕紫', band: '#8B6FA8', bg: '#F8F5FA', box: '#EBE1F2'},
  {n: '晨霧藍', band: '#3F5F92', bg: '#F4F6FA', box: '#DEE6F3'},
  {n: '玫瑰', band: '#C2607A', bg: '#FCF5F6', box: '#F8DDE3'}];
let cur = {i: 0, th: 0, pain: '', main: '', en: '', body: '', step: '', tag: ''};
function loadFb(i) { const f = APP.fb[i]; cur = {i, th: i % THEMES.length, pain: f.pain, main: f.main, en: f.en, body: f.body.join('\n'), step: f.step, tag: f.tag}; }
loadFb(0);
function toCard(o) {
  cur = {i: -1, th: cur.th, pain: o.pain || '', main: o.main || '', en: o.en || E(o.main), body: (o.body || []).join('\n'), step: o.step || '', tag: ''};
  $('#q').value = ''; go('fb');
}
function vFb() {
  return `<p class="hint">選一張現成的痛點圖卡，或直接改下面的字。圖卡是 1080×1350（臉書／IG 直式），按「下載圖卡」存成 PNG；貼文文字為中英對照。</p>
  <div class="maker"><div>
    <label>現成的 30 張痛點圖卡 Ready-made cards</label>
    <select id="pick"><option value="-1">（自訂內容 Custom）</option>${APP.fb.map((f, i) => `<option value="${i}" ${i === cur.i ? 'selected' : ''}>${String(i + 1).padStart(2, '0')}｜${esc(f.tag)}｜${esc(f.pain)}</option>`).join('')}</select>
    <label>痛點 Pain point（上方色塊，可留空）</label><textarea id="f-pain" rows="2">${esc(cur.pain)}</textarea>
    <label>雞湯主句 Main line</label><textarea id="f-main" rows="2">${esc(cur.main)}</textarea>
    <label>英文副句 English line（可留空）</label><textarea id="f-en" rows="2">${esc(cur.en)}</textarea>
    <label>內文 Body（一行一句，可留空）</label><textarea id="f-body" rows="4">${esc(cur.body)}</textarea>
    <label>今天的小步 Today's small step（可留空）</label><textarea id="f-step" rows="2">${esc(cur.step)}</textarea>
    <label>配色 Color</label><select id="f-th">${THEMES.map((t, i) => `<option value="${i}" ${i === cur.th ? 'selected' : ''}>${t.n}</option>`).join('')}</select>
    <div><button class="btn" id="dl">下載圖卡</button><button class="btn ghost" id="cp">複製貼文文字</button><button class="btn ghost" id="sayc">🔊 唸英文</button><button class="btn ghost" id="prev">上一張</button><button class="btn ghost" id="nxt">下一張</button></div>
    <label>貼文文字預覽 Caption（中英對照）</label><textarea id="cap" rows="12" readonly></textarea>
  </div><div><canvas id="cv" width="1080" height="1350"></canvas></div></div>`;
}
function caption() {
  const a = [], two = z => { a.push(z); if (E(z)) a.push(E(z)); };
  if (cur.pain) { a.push('【' + cur.pain + '】'); if (E(cur.pain)) a.push(E(cur.pain)); a.push(''); }
  a.push(cur.main); if (cur.en) a.push(cur.en);
  const body = cur.body.split('\n').map(s => s.trim()).filter(Boolean);
  if (body.length) { a.push(''); body.forEach(two); }
  if (cur.step) { a.push('', '🌱 今天的小步：' + cur.step); if (E(cur.step)) a.push("🌱 Today's small step: " + E(cur.step)); }
  a.push('', '#心靈雞湯 #情緒 ' + (cur.tag ? '#' + cur.tag + ' ' : '') + '#自我成長 #療癒 #HealingWords #LifeOS');
  return a.join('\n');
}
function cardEnglish() {
  const body = cur.body.split('\n').map(s => s.trim()).filter(Boolean);
  return [E(cur.pain), cur.en].concat(body.map(E), [E(cur.step)]).filter(Boolean).join(' ');
}
const NOHEAD = '，。！？、；：」』）…—';
function wrap(ctx, text, maxW) {
  const out = [];
  String(text).split('\n').forEach(para => {
    let line = '';
    (para.match(/[A-Za-z0-9'’\-.,!?;:"“”()]+\s*|\s+|[^]/g) || []).forEach(tk => {
      if (line && ctx.measureText((line + tk).trimEnd()).width > maxW && NOHEAD.indexOf(tk[0]) < 0) { out.push(line.trimEnd()); line = tk.trimStart(); }
      else line += tk;
    });
    if (line.trim()) out.push(line.trimEnd());
  });
  return out;
}
function draw() {
  const cv = $('#cv'); if (!cv) return;
  const c = cv.getContext('2d'), W = 1080, H = 1350, pad = 80, th = THEMES[cur.th], ink = '#2B2623', mute = '#8A7F78';
  const zh = (w, px) => `${w} ${px}px "Microsoft JhengHei","Noto Sans TC","PingFang TC",sans-serif`;
  c.textBaseline = 'top'; c.textAlign = 'left';
  c.fillStyle = th.bg; c.fillRect(0, 0, W, H);
  // 上方痛點色塊
  let bandH = 150;
  c.font = zh(700, 50); const pl = cur.pain ? wrap(c, cur.pain, W - pad * 2) : [];
  if (pl.length) bandH = 80 + 34 + 28 + pl.length * 70 + 56;
  c.fillStyle = th.band; c.fillRect(0, 0, W, bandH);
  c.fillStyle = 'rgba(255,255,255,.85)'; c.font = zh(700, 32);
  c.fillText(pl.length ? '你是不是也這樣？' : '情緒心靈雞湯', pad, pl.length ? 80 : 56);
  c.fillStyle = '#fff'; c.font = zh(700, 50);
  pl.forEach((l, i) => c.fillText(l, pad, 80 + 34 + 28 + i * 70));
  // 先量好內容高度，放不下就縮字
  const body = cur.body.split('\n').map(s => s.trim()).filter(Boolean);
  let ms = 68, bs = 38, L;
  for (;;) {
    c.font = zh(700, ms); let ml = wrap(c, cur.main, W - pad * 2);
    if (ml.length > 1) { const tw = c.measureText(cur.main.replace(/\n/g, '')).width, m2 = wrap(c, cur.main, Math.min(W - pad * 2, tw / ml.length + ms * 1.6)); if (m2.length === ml.length) ml = m2; }  // 讓每行長度接近，不留孤字
    c.font = 'italic 30px Georgia,"Times New Roman",serif'; const el = cur.en ? wrap(c, cur.en, W - pad * 2) : [];
    c.font = zh(400, bs); const bl = []; body.forEach(b => wrap(c, b, W - pad * 2 - 80).forEach(x => bl.push(x)));
    c.font = zh(700, 34); const sl = cur.step ? wrap(c, cur.step, W - pad * 2) : [];
    const h = ml.length * ms * 1.42 + (el.length ? 20 + el.length * 44 : 0) + (bl.length ? 50 + 72 + bl.length * bs * 1.6 : 0) + (sl.length ? 50 + 52 + 18 + sl.length * 50 : 0);
    L = {ml, el, bl, sl, h};
    if (h <= H - bandH - 130 - 120 || ms <= 40) break;
    ms -= 4; if (bs > 30) bs -= 2;
  }
  let y = bandH + Math.max(60, (H - 130 - bandH - L.h) / 2);
  c.fillStyle = ink; c.font = zh(700, ms);
  L.ml.forEach(l => { c.fillText(l, pad, y); y += ms * 1.42; });
  if (L.el.length) { y += 20; c.fillStyle = mute; c.font = 'italic 30px Georgia,"Times New Roman",serif'; L.el.forEach(l => { c.fillText(l, pad, y); y += 44; }); }
  if (L.bl.length) {
    y += 50; const bh = 72 + L.bl.length * bs * 1.6;
    c.fillStyle = th.box; c.beginPath(); c.roundRect(pad - 20, y, W - pad * 2 + 40, bh, 28); c.fill();
    c.fillStyle = th.band; c.fillRect(pad - 20, y + 24, 10, bh - 48);
    c.fillStyle = ink; c.font = zh(400, bs);
    L.bl.forEach((l, i) => c.fillText(l, pad + 30, y + 36 + i * bs * 1.6 + bs * 0.15));
    y += bh;
  }
  if (L.sl.length) {
    y += 50; c.font = zh(700, 28); const lw = c.measureText('今天的小步').width + 44;
    c.fillStyle = th.band; c.beginPath(); c.roundRect(pad, y, lw, 52, 26); c.fill();
    c.fillStyle = '#fff'; c.fillText('今天的小步', pad + 22, y + 10);
    y += 52 + 18; c.fillStyle = ink; c.font = zh(700, 34);
    L.sl.forEach(l => { c.fillText(l, pad, y); y += 50; });
  }
  c.fillStyle = '#E3D9CC'; c.fillRect(pad, H - 130, W - pad * 2, 2);
  c.fillStyle = th.band; c.font = zh(700, 32); c.fillText('情緒心靈雞湯 LifeOS', pad, H - 96);
  c.fillStyle = mute; c.font = zh(400, 28); c.textAlign = 'right'; c.fillText('#心靈雞湯', W - pad, H - 92);
  const cap = $('#cap'); if (cap) cap.value = caption();
}
function bindFb() {
  ['pain', 'main', 'en', 'body', 'step'].forEach(k => $('#f-' + k).addEventListener('input', e => { cur[k] = e.target.value; draw(); }));
  $('#f-th').onchange = e => { cur.th = +e.target.value; draw(); };
  $('#pick').onchange = e => { const i = +e.target.value; if (i >= 0) { loadFb(i); render(); } };
  const step = d => { loadFb(((cur.i < 0 ? 0 : cur.i + d) + APP.fb.length) % APP.fb.length); render(); };
  $('#prev').onclick = () => step(-1); $('#nxt').onclick = () => step(1);
  $('#sayc').onclick = () => say(cardEnglish());
  $('#dl').onclick = () => { const a = document.createElement('a'); a.download = '情緒雞湯圖卡_' + (cur.i >= 0 ? String(cur.i + 1).padStart(2, '0') + '_' + cur.tag : '自訂') + '.png'; a.href = $('#cv').toDataURL('image/png'); a.click(); };
  $('#cp').onclick = () => { const t = $('#cap'); t.select(); const ok = () => toast('已複製貼文文字'); if (navigator.clipboard) navigator.clipboard.writeText(t.value).then(ok, () => { document.execCommand('copy'); ok(); }); else { document.execCommand('copy'); ok(); } };
  draw(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
}

/* ---------- 搜尋（中英文都能找） ---------- */
let IDX = null;
function index() {
  const a = [], add = (s, t, o, x) => a.push({s, t, o, x: x || ''});
  APP.fb.forEach(f => { add('痛點圖卡', f.main, f, f.pain + ' ' + f.tag + ' ' + E(f.pain)); f.body.forEach(b => add('痛點圖卡', b, {main: b}, f.tag)); });
  APP.daily.forEach(d => { d.l.forEach(l => add('情緒入門・' + d.t, l, {main: l, step: d.p}, d.e)); add('情緒入門・' + d.t, d.p, {main: d.p}, d.e); });
  APP.emos.forEach(e => add('108 情緒・' + e.z, e.x, {pain: e.s + '。', main: e.x, step: e.a + '——' + e.m}, e.e + ' ' + e.g + ' ' + e.m + ' ' + E(e.m)));
  APP.acts.forEach(x => add('情緒出口', x[1] + ' → ' + x[3], {main: x[1] + '的時候，試著「' + x[3] + '」。', en: x[2] + ': ' + x[4]}, x[2] + ' ' + x[4]));
  APP.vols.forEach(v => {
    v.i.forEach(it => { add(v.n, it.x, {main: it.x}, it.t + ' ' + it.en); it.l.forEach(l => add(v.n + '・' + it.t, l, {main: l})); });
    v.c.forEach(c => c.k.forEach(k => add(v.n + '・' + c.n, k[0], {main: k[0], en: k[1]}, k[1])));
  });
  APP.books.forEach(b => {
    b.q.forEach(q => add(b.n, q, {main: q}));
    b.p.forEach(p => { if (!p.h) add(b.n, p.x, {main: p.x}); });
    b.b.forEach(k => { if (k.k === 'table') k.r.slice(1).forEach(r => r.forEach(c => add(b.n, c, {main: c}))); else if (k.l) k.l.forEach(l => add(b.n, l, {main: l}, k.t)); });
  });
  const seen = {};
  return a.filter(r => { const k = r.s + r.t; if (seen[k]) return false; seen[k] = 1; r.k = (r.t + ' ' + E(r.t) + ' ' + r.x + ' ' + r.s).toLowerCase(); return true; });
}
function vSearch(q) {
  IDX = IDX || index();
  const ws = q.toLowerCase().split(/\s+/).filter(Boolean), hit = IDX.filter(r => ws.every(w => r.k.indexOf(w) >= 0));
  return `<p class="hint">找到 ${hit.length} 則${hit.length > 150 ? '，先顯示前 150 則' : ''}　Found ${hit.length}</p>` +
    (hit.slice(0, 150).map(r => `<div class="q"><div><span class="tag">${esc(r.s)}</span>${bi(r.t, r.o.en || E(r.t))}</div>${cardBtn(r.o)}</div>`).join('') || `<div class="soup">${bi('找不到這個詞，換個說法試試看——例如「累」「怕」「界線」。', 'Nothing found. Try another word, such as tired, afraid, or boundary.')}</div>`);
}

/* ---------- 英文發音 ---------- */
let VO = null, playing = false, queue = [], qi = 0;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const v = speechSynthesis.getVoices();
  VO = v.find(x => /^en[-_]US/i.test(x.lang) && /Natural|Google|Aria|Jenny|Samantha/i.test(x.name)) || v.find(x => /^en[-_]US/i.test(x.lang)) || v.find(x => /^en/i.test(x.lang)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(t, done) {
  if (!('speechSynthesis' in window)) return toast('這個瀏覽器不支援朗讀');
  speechSynthesis.cancel();
  // 去掉表情符號與箭頭，長句切成短句，避免瀏覽器唸到一半停住
  const parts = String(t).replace(/[→＝]/g, ', ').replace(/[^\x20-\x7E’‘“”—–]/g, ' ').replace(/\s+/g, ' ').trim().match(/[^.!?;:]+[.!?;:]*\s*/g) || [];
  if (!parts.length) { if (done) done(); return; }
  parts.forEach((p, i) => {
    const u = new SpeechSynthesisUtterance(p); u.lang = 'en-US'; if (VO) u.voice = VO; u.rate = +$('#rate').value;
    if (i === parts.length - 1 && done) { u.onend = done; u.onerror = done; }
    speechSynthesis.speak(u);
  });
}
function mark(el) { document.querySelectorAll('.eng.now').forEach(x => x.classList.remove('now')); if (el) el.classList.add('now'); }
function stopAll() { playing = false; if ('speechSynthesis' in window) speechSynthesis.cancel(); mark(null); }
function playNext() {
  if (!playing) return;
  if (qi >= queue.length) { stopAll(); toast('本頁英文已唸完'); return; }
  const el = queue[qi++]; if (!document.body.contains(el)) return stopAll();
  mark(el); el.scrollIntoView({block: 'center', behavior: 'smooth'});
  say(P[+el.dataset.s], () => setTimeout(playNext, 350));
}
function playAll() {
  stopAll();
  queue = [...document.querySelectorAll('#view .eng')].filter(e => e.offsetParent !== null);
  if (!queue.length) return toast('這一頁沒有可朗讀的英文');
  qi = 0; playing = true; playNext();
}

/* ---------- 共用 ---------- */
function toast(t) { const e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => e.style.display = 'none', 1600); }
function go(t) { tab = t; render(); window.scrollTo(0, 0); }
function render() {
  stopAll(); P = [];
  const q = $('#q').value.trim();
  $('#tabs').innerHTML = TABS.map(([k, n, e]) => `<button class="${!q && k === tab ? 'on' : ''}" data-t="${k}">${n}<small>${e}</small></button>`).join('');
  $('#view').innerHTML = q ? vSearch(q) : ({home: vHome, daily: vDaily, vols: vVols, books: vBooks, emos: vEmos, fb: vFb})[tab]();
  if (!q && tab === 'fb') bindFb();
}
document.addEventListener('click', e => {
  const s = e.target.closest('.eng');
  if (s && s.dataset.s) { e.preventDefault(); playing = false; mark(s); say(P[+s.dataset.s], () => mark(null)); return; }
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.t) { $('#q').value = ''; go(d.t); }
  else if (d.c) toCard(P[+d.c]);
  else if (d.b) { bookIdx = +d.b; render(); }
  else if (d.e) { emoCat = d.e; render(); }
  else if (b.id === 'next') { heroIdx++; render(); }
  else if (b.id === 'playall') playAll();
  else if (b.id === 'stop') stopAll();
  else if (b.id === 'openall' || b.id === 'closeall') document.querySelectorAll('#view details').forEach(x => x.open = b.id === 'openall');
});
$('#q').addEventListener('input', render);
render();
</script>
