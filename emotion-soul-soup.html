的不是行為，而是整個人格。把「這件事做錯了」和「我是個錯誤的人」分開，是走出羞愧的第一步。":"Shame is the sense of self becoming unsteady. It appears when a person feels that their very existence is wrong. Shame is the most draining of all emotions, because it attacks not a behavior but the whole person. Separating \"I did this wrong\" from \"I am a wrong person\" is the first step out of shame.","抗傷能力":"Resilience","讓內心有緩衝——不是沒有情緒，是情緒來了不崩潰":"Giving the heart a cushion: not having no emotions, but not collapsing when they come","真正的抗傷能力":"Real resilience","很多人以為，心理強壯的人不會受傷。":"Many people think that mentally strong people do not get hurt.","錯了。真正心理強壯的人，同樣會受傷、同樣會難過——但他們的內心有一個東西，叫做「緩衝能力」。":"That is wrong. Truly strong people get hurt and feel sad just the same, but their hearts have something called a buffer.","緩衝能力，是在刺激和反應之間，留出一個空間。在這個空間裡，你有機會選擇如何回應，而不是讓情緒直接接管。":"A buffer is a space left between stimulus and response. In that space, you have the chance to choose how to respond, instead of letting emotion take over directly.","低抗傷的人和高抗傷的人，面對同樣的壓力，內心的反應完全不同。":"Facing the same pressure, the heart of a person with low resilience and the heart of one with high resilience respond completely differently.","六大抗傷核心策略":"Six core strategies for resilience","①延遲反應：情緒來了，先停10秒。不要立刻回訊息，不要立刻爆炸。那10秒鐘，是你和被情緒接管之間的距離。":"One, delay your response: when emotion comes, stop for ten seconds. Don't reply at once; don't explode at once. Those ten seconds are the distance between you and being taken over by emotion.","②降安穩增：累的時候不要做重大決定。先睡覺，先吃飯，先補水。神經穩了，才有能力處理問題。":"Two, reduce the drain: don't make big decisions when you are tired. Sleep first, eat first, drink water first. Only when the nerves are steady can you deal with the problem.","③分離事件與身份：「這次失敗」不等於「我很爛」。失敗是想法需要成長，不是人格的否定。":"Three, separate the event from your identity: \"this failure\" does not equal \"I am terrible.\" A failure means a thought needs to grow, not that you as a person are rejected.","④建立穩定節律：固定睡眠、固定運動、固定安靜時間。神經穩，情緒才穩。這不是放縱，而是在為內心建底盤。":"Four, keep a steady rhythm: regular sleep, regular exercise, regular quiet time. When the nerves are steady, emotions are steady. This is not indulgence; it is laying a foundation for the heart.","⑤建立情緒出口：寫下來、說出來、走路、運動、深呼吸。情緒需要出口，封死只會讓壓力累積。":"Five, build outlets for emotion: write it down, say it aloud, walk, exercise, breathe deeply. Emotions need a way out; sealing them in only lets pressure build.","⑥降低高刺激：少滑短影音、少看情緒新聞、少接很耗神關係。因為你的心力有限，保護它。":"Six, lower high stimulation: fewer short videos, less emotional news, fewer draining relationships. Your energy is limited, so protect it.","20個讓情緒重新流動的方法":"Twenty ways to let emotions flow again","內耗情緒，就是長期的內耗狀態——情緒不斷地消耗能量，卻沒有流動和修復。安穩情緒，是情緒能夠流動、內心能夠恢復的狀態。":"Draining emotion is a long-term state of inner wear: emotion keeps using up energy without flowing or healing. Steady emotion is a state in which emotion can flow and the heart can recover.","以下20個方法，不是讓你沒有情緒，而是幫你的情緒從內耗狀態，逐步回到安穩狀態。":"The following twenty methods are not meant to leave you without emotions, but to help your emotions move step by step from draining back to steady.","①先睡飽  睡眠不足，大腦會放大威脅。一切的修復，都從睡眠開始。":"One, sleep enough first. Without enough sleep, the brain magnifies threats. All repair begins with sleep.","②固定作息  規律會降低神經混亂。身體知道接下來要發生什麼，內在的警鈴就會放鬆。":"Two, keep regular hours. Regularity calms the nerves. When the body knows what comes next, the inner alarm relaxes.","③少看高刺激短影音  大腦會被碎片化，注意力耗散，情緒更難穩定。":"Three, watch fewer high-stimulation short videos. They break the brain into fragments, scatter attention, and make emotions harder to steady.","④情緒來先停10秒  避免自動爆炸。那10秒是內心插入「覺察」的機會。":"Four, stop for ten seconds when emotion comes. This avoids an automatic explosion. Those ten seconds are the heart's chance to notice.","⑤每天運動20分鐘  讓壓力代謝出去。身體是情緒最直接的出口。":"Five, exercise twenty minutes a day. Let the body work the stress out. The body is the most direct outlet for emotion.","⑥固定補水  缺水會提高焦躁感。身體的基本供能影響神經狀態。":"Six, drink water regularly. Being short of water raises restlessness. The body's basic supply affects the state of the nerves.","⑦不要空腹太久  低血糖會放大情緒反應。血糖穩，情緒才穩。":"Seven, don't go hungry for too long. Low blood sugar magnifies emotional reactions. Steady blood sugar, steady emotions.","⑧少熬夜  最消耗自己的習慣之一。每一個熬夜，都在讓內心付利息。":"Eight, stay up late less. It is one of the most draining habits. Every late night makes the heart pay interest.","⑨每天安靜5分鐘  讓大腦降噪。在資訊轟炸的世界裡，安靜是稀缺資源。":"Nine, be quiet for five minutes a day. Let the brain turn down the noise. In a world flooded with information, quiet is a rare resource.","⑩把情緒寫下來  情緒會從混亂變清楚。外化的過程，就是整理的過程。":"Ten, write your emotions down. They go from tangled to clear. Putting them outside yourself is a way of sorting them.","⑪少跟很耗神的人久待  情緒會共振感染。你的情緒頻率，會被周圍的人影響。":"Eleven, spend less time with people who drain you. Emotions resonate and spread. Your emotional tone is affected by those around you.","⑫學會拒絕  邊界不清，內耗就會增加。每一次說「不」，都是在保護你的心力。":"Twelve, learn to say no. Unclear boundaries add to inner wear. Every \"no\" protects your energy.","⑬不要一次處理太多事  心力超載，內心容易崩。一次一件，穩定前進。":"Thirteen, don't handle too many things at once. When the load is too heavy, the heart breaks easily. One thing at a time, moving forward steadily.","⑭建立小完成  完成感會提升穩定感。每一個小的完成，都在向大腦說「我還行」。":"Fourteen, create small completions. A sense of finishing raises a sense of stability. Every small completion tells the brain, \"I'm doing all right.\"","⑮少自責  過度攻擊自己，會讓內心長期高壓。把自責換成「哪裡可以調整」。":"Fifteen, blame yourself less. Attacking yourself too much keeps the heart under long pressure. Replace self-blame with \"What can I adjust?\"","⑯多曬太陽  光線影響神經穩定。每天至少20分鐘自然光。":"Sixteen, get more sunlight. Light affects the steadiness of the nerves. At least twenty minutes of natural light a day.","⑰固定真實連結  長期孤立，情緒容易失衡。真實的連結，是情緒的養分。":"Seventeen, keep regular real connection. Long isolation easily unbalances emotions. Real connection is food for the emotions.","⑱少反覆回想痛苦  大腦會強化舊迴路。每一次重播，都在讓神經路徑更深。":"Eighteen, replay pain less. The brain strengthens old circuits. Every replay deepens the neural path.","⑲把「我很糟」改成「我現在狀態不好」  身份不要綁定情緒。狀態是暫時的，不是你是誰。":"Nineteen, change \"I am awful\" to \"I am not in a good state right now.\" Don't tie your identity to an emotion. A state is temporary; it is not who you are.","⑳允許情緒流動  能流動，才會修復。情緒被允許存在，它才會真正離開。":"Twenty, allow emotions to flow. Only what can flow can heal. When an emotion is allowed to exist, it can truly leave.","內耗 vs 安穩":"Draining versus steady","兩種情緒——你的內心在耗散還是在恢復？":"Two kinds of emotion: is your heart leaking away or recovering?","內耗內心與安穩內心":"The draining heart and the steady heart","有些人遇到壓力，會越來越亂。有些人遇到壓力，反而越來越穩。":"Under pressure, some people become more and more tangled. Others become steadier and steadier.","差別不只是個性。而是他們的情緒，一個是內耗的，一個是安穩的。":"The difference is not only personality. One person's emotions are draining; the other's are steady.","內耗情緒的核心目標函數是：「趕快消除不舒服」。所以內心會優先選擇逃避、防禦、壓抑、短期止痛。但代價是：長期越來越亂。":"The core aim of draining emotion is to get rid of discomfort quickly. So the heart chooses escape, defense, suppression, and short-term relief first. The price is growing chaos over time.","安穩情緒的核心目標函數是：「提升穩定性、增加恢復力、提高成長能力」。所以每次情緒，都變成一次想法修正。每次壓力，都變成一次內心升級。":"The core aim of steady emotion is to raise stability, recovery, and the ability to grow. So every emotion becomes a chance to revise a thought, and every pressure becomes a step up for the heart.","內耗路徑：刺激→情緒爆炸→逃避/壓抑→內耗增加→神經失衡→心力下降→舊迴路強化→更容易失控。":"The draining path: trigger, emotional explosion, escape or suppression, more inner wear, unbalanced nerves, less energy, a stronger old circuit, and losing control more easily.","安穩路徑：刺激→覺察情緒→分析落差→穩定神經→成長想法→建立新迴路→恢復平衡→內心升級。":"The steady path: trigger, noticing the emotion, looking at the gap, steadying the nerves, growing the thought, building a new circuit, restoring balance, and a stronger heart.","選擇安穩，不是要你強迫自己快樂。而是建立一個內心，讓你在受傷之後，能夠真正地恢復。":"Choosing steadiness does not mean forcing yourself to be happy. It means building a heart that can truly recover after being hurt.","情緒不是判決書":"An emotion is not a verdict","你有沒有過這樣的經驗：被拒絕了一次，然後整個人開始覺得「我是不是真的很爛」？被忽略了，就變成「沒人愛我」？失敗了一次，就成了「我就是個失敗者」？":"Have you had this experience: rejected once, and you start to feel, \"Am I really that bad?\" Ignored, and it becomes \"Nobody loves me\"? Failed once, and it becomes \"I am simply a failure\"?","這不是你太脆弱。這是一個叫做「情緒錯誤轉換」的機制在運作——你的大腦把一個暫時的「狀態」，錯誤地翻譯成了永久的「身份」。":"This is not you being too fragile. A mechanism called wrong emotional conversion is at work: your brain has mistranslated a temporary state into a permanent identity.","五大情緒錯誤轉換模組":"Five kinds of wrong emotional conversion","錯誤轉換的核心問題在於：大腦把「狀態」錯誤轉成「身份」。狀態是暫時的，身份是持久的——當你讓情緒定義了你是誰，你就失去了改變的空間。":"The core of wrong conversion is that the brain turns a state into an identity. A state is temporary; an identity lasts. When you let an emotion define who you are, you lose the room to change.","糾正這個錯誤的起點，是說法的改變。不說「我很焦慮」，改說「我正在經歷焦慮」。不說「我失敗了」，改說「這次的策略需要成長」。這不是自我欺騙，而是語言幫助大腦重新調整現實。":"Correcting this begins with changing how you say it. Instead of \"I am anxious,\" say \"I am going through anxiety.\" Instead of \"I failed,\" say \"This approach needs to grow.\" This is not fooling yourself; language helps the brain readjust reality.","安穩轉換的路徑：刺激→覺察情緒→分離身份→調整想法→成長行動。每一次的正確轉換，都是一次小小的自由。":"The steady path of conversion: trigger, notice the emotion, separate it from identity, adjust the thought, take a growing action. Every correct conversion is a small freedom.","50種情緒解碼":"Decoding fifty emotions","每一種情緒，都有它的內心意義":"Every emotion has its meaning for the heart","50種負面情緒的完整指南":"A complete guide to fifty difficult emotions","我們常常遇到一種困境：感受到一種情緒，但說不清楚它是什麼，也不知道該怎麼辦。":"We often meet this difficulty: we feel an emotion but cannot say what it is, nor what to do about it.","以下50種情緒，每一種都有它在內心裡的精確含義，以及對應的第一個行動。這不是要你強迫自己立刻改變——而是給你一個地圖，讓你至少知道你在哪裡，往哪裡走。":"Each of the fifty emotions below has a precise meaning in the heart and a matching first action. This is not to force you to change at once; it is a map, so that at least you know where you are and which way to go.","從情緒到整體——八個內心同時恢復":"From emotion to the whole person: eight areas recovering together","人不是單一器官，是多內心整合體":"A person is not a single organ, but many parts working as one","當情緒長期失衡，它不會只停留在情緒層面。它會蔓延——影響你的睡眠、影響你的認知、影響你的關係、影響你的行動能力。":"When emotions stay out of balance for long, they do not stay at the emotional level. They spread, affecting your sleep, your thinking, your relationships, and your ability to act.","反過來說，當身體內心出了問題（睡眠不足、供能不穩），情緒也會跟著失衡。當關係出了問題（邊界混亂、過度依附），情緒耗能就會增加。":"The reverse is also true: when the body is in trouble, with too little sleep or unsteady fuel, emotions lose balance too. When relationships are in trouble, with blurred boundaries or too much clinging, emotions cost more energy.","這就是為什麼，真正的療癒不是只修一個地方——而是讓整個內心重新對齊。":"This is why real healing is not fixing one spot, but bringing the whole heart back into line.","內耗 vs 安穩內心循環":"The draining cycle versus the steady cycle","你不需要同時修復所有的內心。但你需要知道，它們是彼此連結的。修復其中一個，往往會帶動其他的。通常最好的起點是：先穩住睡眠。睡眠穩了，神經才有機會穩；神經穩了，情緒才有空間被觀察；情緒被觀察了，認知才能調整；認知調整了，行動才能穩定輸出。":"You don't need to repair every area at once. But you need to know they are linked. Repairing one often lifts the others. Usually the best starting point is to steady your sleep. When sleep is steady, the nerves can settle; when the nerves settle, emotions have room to be observed; when emotions are observed, thinking can adjust; when thinking adjusts, action becomes steady.","一個內心，慢慢帶動另一個內心。":"One part of the heart slowly lifts another.","結語":"Closing words","情緒，從來不是來毀掉你的。":"Emotions never come to destroy you.","它是你的內心，在提醒你：有些地方，該成長了。":"They are your heart reminding you: some things are ready to grow.","焦慮不是告訴你「你快完蛋了」，它是告訴你「內心需要更多穩定感」。憤怒不是你的性格缺陷，它是說「有一條邊界，需要被建立」。悲傷不是脆弱，它是修復的過程。羞愧不是真相，它是自我認同在尋找新的錨點。":"Anxiety is not telling you \"you are finished\"; it is telling you \"the heart needs more steadiness.\" Anger is not a flaw in your character; it says \"a boundary needs to be set.\" Sadness is not weakness; it is the process of repair. Shame is not the truth; it is your sense of self looking for a new anchor.","真正的情緒自由，不是永遠快樂，不是沒有負面情緒。":"Real emotional freedom is not being happy forever, and not having no difficult emotions.","而是：你開始有能力觀察情緒，而不是被情緒拖走。你開始有能力讓堵塞的能量重新流動。你開始把每一次的情緒，當成一次好好照顧自己的機會，而不是一次人格的審判。":"It is this: you begin to be able to observe your emotions instead of being dragged away by them. You begin to let blocked energy flow again. You begin to treat each emotion as a chance to take good care of yourself, not as a trial of your character.","這本書是一個起點。真正的練習，在每一次情緒出現的那一刻。":"This book is a starting point. The real practice is in each moment an emotion appears.","—— 願你不再和情緒為敵，而是學會讀懂它":"May you no longer be at war with your emotions, but learn to read them.","層級":"Layer","核心概念":"Core idea","機制":"How it works","卡點":"Sticking point","真正問題":"The real issue","從前常說":"I used to say","現在可以說":"Now I can say","成長行動":"Growing action","本體層":"Layer of being","情緒=內在的警鈴":"Emotion is the inner alarm","大腦偵測偏差後發出訊號":"The brain sends a signal after detecting that something is off","情緒反覆重播":"Emotions replay again and again","內心未完成調整":"The heart has not finished adjusting","我情緒很多":"I have so many emotions","內心正在提醒我":"My heart is reminding me","每天記錄3次情緒觸發點":"Note three emotional triggers each day","情緒不是敵人":"Emotions are not enemies","情緒是能量流":"Emotion is a flow of energy","長期壓抑":"Long-term suppression","能量堵塞":"Blocked energy","我要消滅情緒":"I want to get rid of emotions","我要理解情緒":"I want to understand emotions","每天5分鐘書寫情緒":"Write about your emotions for five minutes a day","結構層":"Layer of structure","情緒受預測控制":"Emotion is guided by prediction","大腦會預測未來風險":"The brain predicts future risks","焦慮停不下來":"Anxiety that will not stop","災難模擬過強":"Imagining disaster too strongly","一定會出事":"Something will surely go wrong","內心正在過度預測":"My heart is over-predicting","每次焦慮列出3種可能結果":"Each time you are anxious, list three possible outcomes","情緒影響注意力":"Emotion affects attention","高情緒會縮窄視野":"Strong emotion narrows your view","越想越負面":"The more I think, the darker it gets","注 ion is inner wear","長期壓抑增加混亂":"Long suppression adds to the chaos","一直很累":"Always tired","能量循環停滯":"The energy cycle has stalled","我越來越沒力":"I have less and less strength","內心正在耗散能量":"My heart is leaking energy","每天運動20分鐘":"Exercise twenty minutes a day","身體影響情緒":"The body affects emotion","血糖/睡眠影響神經穩定":"Blood sugar and sleep affect the steadiness of the nerves","情緒忽高忽低":"Emotions swing up and down","生理失衡":"Physical imbalance","我很情緒化":"I am so emotional","內心供能不穩":"My heart's fuel supply is unsteady","固定吃早餐與補水":"Eat breakfast and drink water regularly","關係層":"Layer of relationship","情緒會投射":"Emotions are projected","未解情緒會扭曲互動":"Unresolved emotions distort how we interact","容易誤會別人":"Easily misreading others","舊創傷投影":"Projection of an old wound","他故意傷害我":"He hurt me on purpose","我的情緒正在投射":"My emotion is being projected","衝突前先寫下真實感受":"Before a conflict, write down what you truly feel","情緒會感染":"Emotions are contagious","人際內心彼此共振":"People's hearts resonate with each other","常被帶情緒":"Often pulled into others' moods","邊界過弱":"Boundaries too weak","都是別人害我":"It is all other people's fault","我要穩定自己的頻率":"I will steady my own tone","降低很耗神社交":"Reduce draining social time","討好=情緒避險":"People-pleasing is emotional risk-avoidance","害怕衝突而壓抑自己":"Holding yourself down out of fear of conflict","長期委屈":"Long-term grievance","生存模式過強":"Survival mode set too high","我不能拒絕":"I can't refuse","我可以有邊界":"I am allowed to have boundaries","每週練習1次真實表達":"Practice one honest expression each week","身份層":"Layer of identity","情緒會塑造身份":"Emotion shapes identity","長期情緒形成自我定義":"Long-held emotion becomes self-definition","覺得自己很差":"Feeling that I am not good","身份被情緒綁架":"Identity hijacked by emotion","我就是焦慮的人":"I am just an anxious person","我正在經歷焦慮":"I am going through anxiety","改用「我正在經歷」說法":"Switch to the phrase \"I am going through\"","情緒不是本體":"Emotion is not who you are","情緒只是暫時狀態":"Emotion is only a temporary state","被情緒吞沒":"Swallowed by emotion","缺乏觀察距離":"Lacking the distance to observe","狀態是可成長的":"A state can grow and change","每天靜坐5分鐘觀察自己":"Sit quietly for five minutes a day and observe yourself","成長層":"Layer of growth","情緒需要流動":"Emotions need to flow","流動才能降安穩增":"Only flow reduces the inner drain","長期堵塞":"Blocked for a long time","內心失去循環":"The heart has lost its circulation","我不能哭":"I must not cry","情緒流動才能修復":"Emotions heal only when they flow","每天允許自己表達一次":"Allow yourself to express once a day","情緒可重新訓練":"Emotions can be retrained","身心具有可塑性":"Body and mind can change","容易回到舊模式":"Easily slipping back into old patterns","成長頻率太低":"Practicing too rarely","我永遠改不了":"I will never change","神經路徑能重建":"Neural paths can be rebuilt","建立固定情緒復盤時間":"Set a regular time to review your emotions","意識層":"Layer of awareness","覺察=情緒自由":"Awareness is emotional freedom","能觀察才有選擇權":"Only when you can observe do you have a choice","情緒接管人生":"Emotion takes over life","缺乏意識距離":"Lacking the distance of awareness","我失控了":"I lost control","我正在被情緒拉扯":"I am being pulled by emotion","情緒來時先停10秒呼吸":"When emotion comes, stop and breathe for ten seconds","❌ 從前常說":"I used to say","✅ 現在可以說":"Now I can say","❌ 低復原力":"Low resilience","✅ 高復原力":"High resilience","遇到壓力 → 情緒爆炸":"Under pressure, emotions explode","遇到問題 → 先穩定內心":"Facing a problem, steady the heart first","遇到批評 → 全盤否定自己":"Criticized, I reject myself completely","遇到情緒 → 先觀察":"Facing an emotion, observe first","遇到失敗 → 覺得人生完了":"Having failed, I feel my life is over","遇到攻擊 → 分辨真假":"When attacked, tell true from false","遇到衝突 → 一直內耗":"In conflict, I wear myself down endlessly","遇到失敗 → 修正想法":"Having failed, revise the thought","內心特徵：情緒接管大腦":"Mark of this heart: emotion takes over the brain","內心特徵：情緒來了但不失控":"Mark of this heart: emotion comes, but control is not lost","🌿 最高層結論":"The highest conclusion","脆弱不可怕":"Being fragile is not frightening","真正危險的是：內心沒有恢復能力":"What is truly dangerous is a heart that cannot recover","內耗情緒 ＝ 長期內耗":"Draining emotion equals long-term inner wear","安穩情緒 ＝ 穩定流動":"Steady emotion equals stable flow","真正成熟的人不是沒有情緒":"A truly mature person is not without emotions","而是：內心能快速恢復":"It is that the heart can recover quickly","🟥 內耗情緒":"Draining emotion","🟩 安穩情緒":"Steady emotion","目標：逃避痛苦":"Goal: escape pain","目標：提升穩定與恢復力":"Goal: raise stability and recovery","刺激→情緒爆發→逃避壓抑":"Trigger, emotional outburst, escape and suppression","刺激→覺察→調整→成長→重建":"Trigger, notice, adjust, grow, rebuild","外部碰撞型：別人一句話就崩":"Driven from outside: one sentence from someone and I collapse","內部生成型：自己產生穩定性":"Generated from inside: I create my own steadiness","落差無法調整":"The gap cannot be adjusted","定向落差信號：情緒是提醒":"A directed signal: emotion is a reminder","能量消耗型：一直撐一直演":"Energy-consuming: always holding on, always performing","共振型：情緒流動能量回流":"Resonant: emotions flow and energy returns","結構僵化：反覆回到同樣模式":"Rigid structure: falling back into the same pattern","結構重組：每次痛苦變一次學習":"Rebuilt structure: every pain becomes a lesson","壓力一來：內心直接爆炸":"When pressure comes, the heart simply explodes","壓力來：確認哪裡需要補強":"When pressure comes, check what needs strengthening","能力不可遷移：今天能撐明天又崩":"Ability does not carry over: holding on today, collapsing tomorrow","能力可遷移：情緒穩關係穩行動穩":"Ability carries over: steady emotions, steady relationships, steady action","🌿 真正成熟的人":"A truly mature person","不是永遠不受傷":"is not someone who is never hurt","而是：內心受傷後，還能重新穩定":"It is that after the heart is hurt, it can become steady again","❌ 內耗錯誤轉換":"Draining, wrong conversion","✅ 安穩正確轉換":"Steady, right conversion","①情緒→身份：我很焦慮＝我就是焦慮的人":"One. Emotion into identity: \"I am anxious\" becomes \"I am an anxious person.\"","①情緒→狀態：我正在經歷焦慮（可成長的）":"One. Emotion into state: \"I am going through anxiety,\" which can grow and change.","②壓力→災難：一定會出事＝人生毀了":"Two. Pressure into disaster: \"Something will surely go wrong\" becomes \"My life is ruined.\"","②壓力→訊號：內心正在高警戒（可調整的）":"Two. Pressure into signal: \"My heart is on high alert,\" which can be adjusted.","③批評→否定：他討厭我＝我被看不起":"Three. Criticism into rejection: \"He dislikes me\" becomes \"I am looked down on.\"","③批評→回饋：內心收到外部評價（可分析的）":"Three. Criticism into feedback: \"My heart received an outside opinion,\" which can be examined.","④失敗→無能：我不行＝我沒救了":"Four. Failure into incompetence: \"I can't do it\" becomes \"I am hopeless.\"","④失敗→成長：方法需要成長（可改變的）":"Four. Failure into growth: \"The method needs to grow,\" which can be changed.","⑤情緒→真相：我現在痛苦＝世界很糟":"Five. Emotion into truth: \"I am in pain now\" becomes \"The world is terrible.\"","⑤情緒→資訊：我現在痛苦≠真實全貌":"Five. Emotion into information: \"I am in pain now\" is not the whole picture.","😰 焦慮  ＝未來失控感 → 先穩定作息":"Anxiety is a feeling that the future is out of control. First, steady your daily hours.","😨 恐懼  ＝內心感到威脅 → 降低過度刺激":"Fear is the heart sensing a threat. Reduce excess stimulation.","😢 悲傷  ＝重要連結流失 → 允許情緒流動":"Sadness is the loss of an important connection. Allow the emotion to flow.","😡 憤怒  ＝邊界被侵犯 → 練習清楚拒絕":"Anger is a boundary being crossed. Practice a clear refusal.","😣 羞愧  ＝身份不穩 → 累積小完成":"Shame is an unsteady sense of self. Build up small completions.","😞 失落  ＝期待落空 → 重新調整目標":"Disappointment is a hope that was not met. Readjust your goal.","😔 沮喪  ＝長期無力感 → 建立小進展":"Dejection is long-lasting powerlessness. Create small progress.","😩 疲憊  ＝能量長期耗散 → 先恢復睡眠":"Fatigue is energy leaking away for a long time. Restore your sleep first.","😫 崩潰  ＝心力超載 → 停止輸入刺激":"Breakdown is an overloaded heart. Stop taking in stimulation.","😤 煩躁  ＝神經高警戒 → 降低環境壓力":"Irritability is nerves on high alert. Lower the pressure around you.","😖 委屈  ＝需求長期被忽略 → 開始真實表達":"Feeling wronged is needs ignored for a long time. Begin to speak honestly.","😠 怨恨  ＝痛苦長期累積 → 停止反覆重播":"Resentment is pain piled up over time. Stop replaying it.","😒 嫉妒  ＝比較造成匱乏感 → 回到自己的節奏":"Jealousy is a sense of lack caused by comparing. Return to your own pace.","😓 自責  ＝過度攻擊自己 → 分離錯誤與身份":"Self-blame is attacking yourself too much. Separate the mistake from who you are.","😥 內疚  ＝違反內在價值 → 修正行動即可":"Guilt is going against your inner values. Correcting the action is enough.","😵 混亂  ＝訊號過多 → 減少同時處理":"Confusion is too many signals. Handle fewer things at once.","😶 空虛  ＝缺乏真實連結 → 建立有意義互動":"Emptiness is a lack of real connection. Create meaningful contact.","😑 麻木  ＝情緒長期壓抑 → 重新感受身體":"Numbness is emotion suppressed for a long time. Feel your body again.","😪 倦怠  ＝長期高壓輸出 → 增加恢復時間":"Burnout is long output under high pressure. Add recovery time.","😕 迷惘  ＝方向感不足 → 縮小下一步":"Feeling lost is not enough sense of direction. Make the next step smaller.","😬 尷尬  ＝社會評價壓力 → 降低自我監控":"Embarrassment is the pressure of social judgment. Watch yourself less closely.","😳 丟臉  ＝身份受到威脅 → 停止過度投射":"Losing face is a threat to identity. Stop over-projecting.","😟 不安  ＝缺乏穩定感 → 建立固定節律":"Unease is a lack of steadiness. Set a regular rhythm.","😧 慌張  ＝內心突然超載 → 先深呼吸":"Fluster is a sudden overload of the heart. Take a deep breath first.","😱 驚恐  ＝神經過度放電 → 回到當下感官":"Panic is the nerves over-firing. Return to your senses in the present.","😔 孤單  ＝缺少情感連結 → 主動接觸他人":"Loneliness is a lack of emotional connection. Reach out to others.","😢 心碎  ＝依附內心斷裂 → 允許修復時間":"Heartbreak is a broken attachment. Allow time for repair.","😞 後悔  ＝想法回看落差 → 提取經驗值":"Regret is the gap you see when looking back. Draw out the lesson.","😣 壓抑  ＝能量堵塞 → 安全地表達":"Suppression is blocked energy. Express it safely.","😫 無助  ＝失去控制感 → 先完成小事情":"Helplessness is a lost sense of control. Finish small things first.","😖 痛苦  ＝內心失衡提醒 → 停止逃避感受":"Pain is a reminder that the heart is out of balance. Stop running from the feeling.","😤 不甘心  ＝期待與現實落差 → 重新定義成功":"Not being able to accept it is the gap between hope and reality. Redefine success.","😒 厭世  ＝長期失望累積 → 降低資訊污染":"World-weariness is disappointment piled up over time. Reduce information pollution.","😮‍💨 窒息感  ＝壓力過密 → 增加空白時間":"A feeling of suffocation is pressure packed too tightly. Add blank time.","😑 冷漠  ＝情緒保護模式 → 恢復真實感受":"Coldness is emotional protection mode. Recover your real feelings.","😥 緊張  ＝預測風險提高 → 先放慢速度":"Nervousness is a higher predicted risk. Slow down first.","😟 敏感  ＝內在的警鈴過強 → 建立安全感":"Sensitivity is an inner alarm set too high. Build a sense of safety.","😔 自卑  ＝長期低自我評價 → 停止比較":"Inferiority is long-term low self-regard. Stop comparing.","😣 懷疑自己  ＝身份不穩 → 累積成功證據":"Self-doubt is an unsteady sense of self. Collect evidence of success.","😡 敵意  ＝長期防禦狀態 → 重新建立信任":"Hostility is a long state of defense. Rebuild trust.","😢 絕望  ＝未來想法崩塌 → 縮小時間尺度":"Despair is a collapsed picture of the future. Shorten your time horizon.","😞 失控感  ＝內心缺乏秩序 → 建立固定習慣":"Feeling out of control is a heart lacking order. Build steady habits.","😫 內耗  ＝能量反覆消耗 → 停止過度思考":"Inner wear is energy spent again and again. Stop over-thinking.","😥 依附焦慮  ＝害怕失去連結 → 提升自我穩定":"Attachment anxiety is fear of losing connection. Strengthen your own steadiness.","😔 討好  ＝害怕被拒絕 → 建立邊界":"People-pleasing is fear of rejection. Set boundaries.","😤 控制欲  ＝害怕不確定性 → 允許變化存在":"The urge to control is fear of uncertainty. Allow change to exist.","😶 壓力  ＝負載超過容量 → 減少非必要輸出":"Stress is a load beyond capacity. Cut down on what is not necessary.","😵 情緒爆炸  ＝長期累積未釋放 → 提前排解情緒":"An emotional explosion is a long build-up never released. Let emotions out earlier.","😞 孤立感  ＝缺少被理解感 → 增加真實交流":"Isolation is a lack of feeling understood. Add more real exchange.","😣 卡住  ＝舊迴路固化 → 建立新行動":"Being stuck is a hardened old circuit. Create a new action.","負面情緒不是敵人":"Difficult emotions are not enemies","而是：內心失衡的訊號":"They are signals that the heart is out of balance","而是：能把情緒轉成讓自己成長的入口":"It is being able to turn emotion into a doorway for your own growth","內心層":"Area of the heart","失衡核心":"Core imbalance","常見狀態":"Common state","內耗結果":"Result of inner drain","安穩修正":"Steadying correction","本體內心":"Sense of being","活成別人期待":"Living as others expect","空虛、迷失":"Empty, lost","內在空轉":"Spinning idly inside","找回真正目標":"Recover your real goal","認知內心":"Thinking","災難化思考":"Catastrophizing","亂想、焦慮":"Racing thoughts, anxiety","情緒循環":"An emotional loop","調整思考想法":"Adjust how you think","內耗、爆炸":"Inner wear, explosions","長期高警戒":"Long-term high alert","緊繃、失眠":"Tense, sleepless","心力下降":"Falling reserves","穩定作息與節律":"Steady hours and rhythm","身體內心":"Body","供能不足":"Not enough fuel","疲憊、發炎":"Tired, inflamed","心力消耗":"Reserves used up","睡眠、補水、運動":"Sleep, water, exercise","邊界混亂":"Blurred boundaries","討好、委屈":"Pleasing, feeling wronged","情緒耗損":"Emotional wear","建立清楚邊界":"Set clear boundaries","行動內心":"Action","想太多做太少":"Thinking too much, doing too little","拖延、逃避":"Delay, avoidance","自我否定":"Self-denial","小步穩定輸出":"Small, steady steps","成長內心":"Growth","舊模式重播":"Old patterns replaying","人生卡住":"Life is stuck","結構僵化":"A rigid structure","復盤與一次學習":"Review and learn one lesson","🟥 內耗失衡循環":"The draining cycle of imbalance","🟩 安穩平衡循環":"The steady cycle of balance","睡眠穩":"Steady sleep","→ 情緒":"leads to emotion","→ 神經穩":"leads to steady nerves","→ 亂想":"leads to racing thoughts","→ 情緒穩":"leads to steady emotions","→ 失眠":"leads to insomnia","→ 認知穩":"leads to steady thinking","→ 疲憊":"leads to fatigue","→ 關係穩":"leads to steady relationships","→ 關係失衡":"leads to unbalanced relationships","→ 行動穩":"leads to steady action","→ 更焦慮":"leads to more anxiety","內心互相拖垮":"The parts drag each other down","內心彼此支撐":"The parts support each other","情緒不是讓你停下來的":"Emotions are not here to stop you","情緒，是你的內心":"Emotion is your heart","在提醒你：":"reminding you:","有些地方，該成長了":"some things are ready to grow","願你的內心，越來越穩定":"May your heart grow steadier and steadier","願你的情緒，越來越流動 🌿":"May your emotions flow more and more freely","情緒與關係":"Emotions and Relationships","好的關係不是誰忍得多，而是兩個人都能安心做自己。學會承載自己的情緒，畫出溫柔的界線，你就會慢慢靠近對的人。":"A good relationship is not about who endures more, but about both people being able to be themselves in peace. Learn to hold your own emotions and draw gentle boundaries, and you will slowly draw near the right people.","所有內心，都可以成長。所有想法，都可以升級。你不是固定的人，而是一直在成長的人。":"Every heart can grow. Every thought can be lifted. You are not a fixed person, but a person who keeps growing.","情緒不是敵人。情緒是心的提醒。":"Emotions are not enemies. Emotions are the heart's reminders.","情緒會重播，代表想法還沒成長。":"When an emotion replays, it means the thought has not grown yet.","真正成熟，不是沒有情緒，而是能承載情緒。":"Real maturity is not having no emotions, but being able to hold them.","真正自由，不是沒有情緒，而是不再被情緒控制。":"Real freedom is not having no emotions, but no longer being ruled by them.","焦慮，本質上是預測失控。":"Anxiety is, in essence, prediction out of control.","真正耗神的，不是現實，而是大腦反覆模擬災難。":"What truly wears you out is not reality, but the brain rehearsing disaster again and again.","真正成熟，不是沒有焦慮，而是即使焦慮，仍能穩定前進。":"Real maturity is not having no anxiety, but moving steadily forward even when anxious.","真正的安全感，不是世界可控，而是即使世界失控，你仍然能穩定。":"A real sense of safety is not a world you can control, but staying steady even when the world is out of control.","你無法改變，你無法命名的東西。":"You cannot change what you cannot name.","情緒命名，是大腦重寫的開始。":"Naming an emotion is where rewriting the brain begins.","模糊情緒，會提高內心混亂。精準命名，會降低心力消耗。":"Vague emotions add to inner confusion. Precise naming saves your strength.","情緒不是麻煩。情緒是：內心通知。":"Emotion is not trouble. Emotion is a notice from the heart.","真正耗神的，不是情緒，而是抗拒情緒。":"What truly drains you is not the emotion, but resisting it.","容量小的人，人生容易陷入內耗。":"A person with small capacity easily falls into inner wear.","真正強大，不是永遠平靜，而是風暴來時，內心仍穩定。":"Real strength is not being calm forever, but a heart that stays steady when the storm comes.","真正成熟，不是沒被誤解，而是被誤解時，仍然穩定。":"Real maturity is not never being misunderstood, but staying steady when you are.","真正自由，不是所有人都懂你，而是即使沒人懂你，你仍不失去自己。":"Real freedom is not everyone understanding you, but not losing yourself even when no one does.","外界評價，不等於你的本質。":"Other people's judgment is not your essence.","成熟不是控制別人理解，而是不再依賴別人理解。":"Maturity is not making others understand you, but no longer depending on their understanding.","你吸引的，通常不是你想要的人，而是符合你內在想法的人。":"The people you attract are usually not the ones you want, but the ones who match what you believe inside.","很多心動，其實只是舊傷口共振。":"Many a fluttering heart is really an old wound resonating.","真正成熟的愛，不是情緒劇烈，而是穩定流動。":"Truly mature love is not intense emotion, but steady flow.","真正高級的關係，不是上癮，而是安心。":"A truly fine relationship is not addiction, but peace of mind.","很多討好，其實不是善良，而是恐懼。":"Much people-pleasing is not kindness, but fear.","討好型人格，本質上是身心求生模式。":"People-pleasing is, in essence, body and mind in survival mode.","真正成熟，不是讓所有人滿意，而是對自己誠實。":"Real maturity is not satisfying everyone, but being honest with yourself.","真正的邊界，不是攻擊別人，而是不再背叛自己。":"A real boundary is not attacking others, but no longer betraying yourself.","依附，是人類最深的控制程式。":"Attachment is the deepest program running in a human being.","很多人以為自己在愛，其實是在害怕失去。":"Many people think they are loving, when they are really afraid of losing.","真正成熟的愛，不是抓住，而是自由流動。":"Truly mature love is not holding on, but flowing freely.","真正自由，不是沒有人離開，而是即使有人離開，你仍完整。":"Real freedom is not that no one leaves, but that you remain whole even when someone does.","邊界不是冷漠，而是不再失去自己。":"A boundary is not coldness; it is no longer losing yourself.","沒有邊界的人，最終會失去中心。":"A person without boundaries eventually loses their center.","你不是太敏感，很多時候，只是內心沒有保護機制。":"You are not too sensitive; often your heart simply has no protection.","真正的愛，不是無限犧牲，而是彼此尊重。":"Real love is not endless sacrifice, but mutual respect.","真正高品質的關係，不是互相消耗，而是互相增強。":"A truly good relationship is not wearing each other down, but strengthening each other.","很多人上癮的，不是愛，而是情緒刺激。":"What many people are addicted to is not love, but emotional stimulation.","真正的共振，不是激情，而是長期穩定。":"Real resonance is not passion, but long-term steadiness.","關係不是找人填補空缺，而是兩個完整內心的合作。":"A relationship is not finding someone to fill a gap, but two whole hearts working together.","情緒勒索，不是情緒，而是控制。":"Emotional blackmail is not emotion; it is control.","很多人的罪惡感，其實是長期被訓練出來的。":"Many people's guilt was trained into them over a long time.","真正的愛，不會奪走自由。":"Real love does not take away your freedom.","你可以理解別人，但不必犧牲自己。":"You can understand others without sacrificing yourself.","真正高階的人際，不是認識很多人，而是誰能進入你的內心。":"The highest skill with people is not knowing many of them, but choosing who may enter your heart.","低品質陪伴，比孤單更耗能。":"Poor company drains you more than being alone.","環境，會反向塑造人格。":"Your environment shapes who you become.","你靠近誰，就會逐漸變成誰。":"Whoever you stay close to, you gradually come to resemble.","12章完整一頁總表彙整":"A one-page summary of all twelve chapters","10層內心分析 × 從前vs更有智慧對照 × 心的成長路徑 × 每日小練習":"Ten layers of the heart, before and now compared, the heart's path of growth, and a small daily practice","情緒不是敵人。情緒是心的提醒。真正成熟，不是沒有情緒，而是能承載情緒。":"Emotions are not enemies. Emotions are the heart's reminders. Real maturity is not having no emotions, but being able to hold them.","這本書是12個核心章節的完整內心總表彙整。每一章包含：":"This book is a complete summary of twelve core chapters. Each chapter includes:","①十層內心分析表——從問題現象到智慧整合，完整拆解每個主題的深層機制。②從前vs更有智慧對照——清楚呈現從前常說和現在可以說的差異。③心的成長路徑——視覺化的好好照顧自己路徑。④更有智慧金句——濃縮章節核心的關鍵句。⑤給自己的溫柔提醒——實際可用的說法替換練習。⑥每日小練習——具體的行動步驟。":"One, a ten-layer table of the heart, taking each theme apart from what we experience to wisdom. Two, a before-and-now comparison, showing clearly what I used to say and what I can say now. Three, the heart's path of growth, a picture of the way to care for yourself. Four, wise sayings, the key sentences of the chapter. Five, gentle reminders to yourself, phrases you can actually swap in. Six, a small daily practice with concrete steps.","建議使用方式：先瀏覽十層分析表建立內心框架，再看從前vs更有智慧對照找到自己的當前位置，然後每天用小練習做實際成長。":"Suggested use: first look through the ten-layer table to form a picture, then find where you are now in the before-and-now comparison, and then use the small practice each day to actually grow.","為何情緒會反覆重播？":"Why do emotions keep replaying?","高情緒容量的人怎麼運作？":"How do people with a large emotional capacity work?","為何你總吸引錯的人？":"Why do you keep attracting the wrong people?","討好型人格的底層機制":"What lies beneath people-pleasing","依附：人類最深的控制程式":"Attachment: the deepest program in a human being","這12章涵蓋了情緒和關係最核心的議題。從情緒重播到焦慮預測，從命名重寫到承載容量，從依附到邊界，從共振到篩選——每一章都是一個內心，每個內心都可以成長。":"These twelve chapters cover the most central themes of emotions and relationships. From emotional replay to anxious prediction, from naming to capacity, from attachment to boundaries, from resonance to choosing your people: each chapter is one part of the heart, and every part can grow.","成長的路徑很清楚：看見舊想法→理解內心機制→建立現在可以說→用用行動溫習身心。這不是靠意志力完成的，而是靠重複的小行動，一點一點地讓大腦成長內在的預想。":"The path of growth is clear: see the old thought, understand how the heart works, find what you can say now, and practice it through action. It is not done by willpower, but by small repeated actions that, little by little, let the brain grow new expectations.","—— 願你的內心，越來越安穩，越來越自由":"May your heart grow steadier and freer.","核心內容":"Core content","內心解析":"Reading the heart","溫柔的轉念":"A gentler way to see it","①問題現象層":"One. What we experience","未完成的落差持續循環":"An unfinished gap keeps cycling","焦慮、內耗、暴怒、低落、反芻":"Anxiety, inner wear, rage, low mood, rumination","看見：情緒不是偶然":"See it: emotion is not an accident","②舊說法層":"Two. The old way of saying it","情緒＝不好":"Emotion equals bad","童年＋社會制約形成壓抑想法":"Childhood and social conditioning form the habit of suppressing","壓抑、逃避、假裝沒事":"Suppressing, avoiding, pretending to be fine","改寫：情緒≠弱":"Rewrite: emotion does not equal weakness","③內心機制層":"Three. How the heart works","情緒＝內在的預想":"Emotion equals inner expectation","大腦持續預測安全性":"The brain keeps predicting how safe things are","害怕失敗、被討厭、被拋棄":"Fear of failing, of being disliked, of being abandoned","理解：情緒是生存本能":"Understand: emotion is a survival instinct","④心的提醒層":"Four. The heart's reminder","情緒＝落差提醒":"Emotion equals a reminder of a gap","現實與預測不一致":"Reality does not match the prediction","焦慮重播、關係循環":"Replaying anxiety, repeating relationship cycles","看見：想法失準":"See it: the thought is off the mark","⑤內耗崩潰層":"Five. Breakdown from inner wear","長期壓抑＝內耗":"Long suppression equals inner wear","心力消耗持續上升":"The cost to your reserves keeps rising","失眠、疲勞、發炎、決策混亂":"Insomnia, fatigue, inflammation, muddled decisions","理解：情緒會拖垮內心":"Understand: emotion can pull the heart down","⑥成長機制層":"Six. How growth happens","情緒命名＋神經重塑":"Naming emotions and reshaping the nerves","精準命名降低杏仁核活性":"Precise naming lowers amygdala activity","「我很煩」→模糊化":"\"I'm annoyed\" keeps it vague","精準拆解真正恐懼":"Take the real fear apart precisely","⑦壓力測試層":"Seven. The stress test","混亂中是否穩定":"Am I steady in the middle of chaos","高壓情境驗證好好照顧自己":"High-pressure moments test your growth","情緒來時仍能行動":"Still able to act when emotion comes","⑧生成能力層":"Eight. Growing new ability","長出情緒承載力":"Growing the capacity to hold emotion","身心穩定化":"Body and mind becoming steady","不再被情緒綁架":"No longer hijacked by emotion","高恢復力＋低內耗":"High recovery and low inner wear","⑨智慧整合層":"Nine. Bringing wisdom together","情緒≠自我":"Emotion is not the self","情緒只是導航訊號":"Emotion is only a navigation signal","把情緒當身份":"Treating emotion as identity","把情緒當資訊":"Treating emotion as information","⑩用行動溫習層":"Ten. Practicing through action","每日情緒紀錄":"A daily record of emotions","用行動溫習身心":"Practice through action for body and mind","情緒無意識重播":"Emotions replaying unconsciously","建立新內在的預想":"Build new inner expectations","❌ 從前的我":"The old me","✅ 溫柔的我":"The gentle me","焦慮＝我很糟":"Anxiety equals I am awful","解碼情緒":"Decoding the emotion","被情緒控制":"Ruled by emotion","承載情緒":"Holding emotion","痛苦＝懲罰":"Pain equals punishment","痛苦＝成長的入口":"Pain equals a doorway to growth","爆炸或逃避":"Exploding or escaping","流動與調整":"Flowing and adjusting","情緒耗能":"Emotion drains energy","情緒調整能量":"Emotion adjusts energy","心的成長路徑":"The heart's path of growth","情緒重播　→　預測失衡　→　心的提醒　→　覺察命名　→　神經重寫　→　新預測形成　→　內心穩定　→　情緒承載力生成":"Emotional replay, predictions out of balance, the heart's reminder, noticing and naming, rewiring the nerves, a new prediction forms, the heart steadies, and the capacity to hold emotion grows.","給自己的溫柔提醒":"Gentle reminders to yourself","❌ 從前常說：我情緒很多 ✅ 現在可以說：我的內心正在發送心的提醒":"I used to say: I have so many emotions. Now I can say: my heart is sending me a reminder.","❌ 從前常說：我是不是有問題？ ✅ 現在可以說：想法需要成長":"I used to say: is something wrong with me? Now I can say: a thought needs to grow.","每日小練習":"A small daily practice","① 發生什麼？ ② 我感受到什麼？ ③ 我真正害怕什麼？ ④ 我的舊想法是什麼？ ⑤ 新的、更溫柔的想法是什麼？":"One, what happened? Two, what did I feel? Three, what am I truly afraid of? Four, what is my old thought? Five, what is a new, gentler thought?","焦慮最可怕不是事情發生":"The most frightening thing about anxiety is not that something happens","而是還沒發生就耗盡能量":"but that you are exhausted before it happens","拖延、內耗、失眠、身體緊繃":"Procrastination, inner wear, insomnia, a tense body","看見：過度預測危險":"See it: over-predicting danger","焦慮＝童年生存想法":"Anxiety equals a childhood survival belief","世界不安全感形成":"The feeling that the world is unsafe takes shape","內心長期處於高警戒":"The heart stays on high alert for a long time","改寫：焦慮≠軟弱":"Rewrite: anxiety does not equal weakness","大腦追求生存而非快樂":"The brain seeks survival, not happiness","持續預測危險風險":"Constantly predicting danger and risk","杏仁核活性上升、高警戒":"A more active amygdala and high alert","理解：焦慮＝預測失控":"Understand: anxiety equals prediction out of control","焦慮＝安全感失衡":"Anxiety equals a sense of safety out of balance","內心正在很耗神運作":"The heart is working at great cost","過度害怕失敗被否定":"Too much fear of failing and of being rejected","看見：內在的預想過時":"See it: the inner expectation is out of date","長期焦慮＝全面內耗":"Long-term anxiety equals wearing down all over","內心持續耗損":"The heart keeps being worn away","失眠、免疫下降、注意力崩潰":"Insomnia, lowered immunity, collapsing attention","理解：焦慮最耗能是模擬災難":"Understand: what drains most in anxiety is rehearsing disaster","重新調整內在的預想":"Readjust your inner expectations","停止災難化＋回到當下":"Stop catastrophizing and return to the present","只能靠擔心求安全":"Able to seek safety only through worrying","建立新安全感":"Build a new sense of safety","不確定時仍穩定":"Still steady when things are uncertain","驗證好好照顧自己成效":"Check how well caring for yourself is working","未知出現就失控":"Losing control when the unknown appears","即使未知仍能前進":"Still able to move forward despite the unknown","長出高壓穩定能力":"Growing the ability to stay steady under pressure","身心重塑":"Reshaping body and mind","焦慮中仍能穩定前進":"Still moving steadily forward in anxiety","真正安全感＝內在韌性":"A real sense of safety equals inner resilience","不靠控制世界得安全":"Safety that does not depend on controlling the world","每日焦慮溫習":"A daily review of anxiety","焦慮無意識重播":"Anxiety replaying unconsciously","建立新預測迴路":"Build a new circuit of prediction","焦慮就停止":"Stopping whenever anxious","預測最壞結果":"Predicting the worst outcome","調整預測精度":"Adjusting how accurate the prediction is","擔心＝有用":"Worry equals useful","覺察＝更有用":"Awareness equals more useful","一直處於高警戒":"Always on high alert","穩定內心低耗能":"A steady heart at low cost","焦慮觸發　→　杏仁核啟動　→　災難化預測　→　內心很耗神　→　停止災難化　→　回到當下　→　預測調整　→　新安全感　→　高壓穩定能力生成":"Anxiety is triggered, the amygdala starts, disaster is predicted, the heart works at great cost; then stop catastrophizing, return to the present, adjust the prediction, find a new sense of safety, and the ability to stay steady under pressure grows.","❌ 從前常說：我是不是快失控了？ ✅ 現在可以說：內心正在過度預測危險。":"I used to say: am I about to lose control? Now I can say: my heart is over-predicting danger.","❌ 從前常說：我一定不能失敗 ✅ 現在可以說：失敗只是一次學習。":"I used to say: I must never fail. Now I can say: a failure is just one lesson.","每日焦慮小練習":"A small daily practice for anxiety","① 我現在在害怕什麼？ ② 最糟情況真的會發生嗎？ ③ 我的大腦正在預測什麼？ ④ 這是事實？還是災難化？ ⑤ 新的、更溫柔的想法是什麼？":"One, what am I afraid of right now? Two, will the worst really happen? Three, what is my brain predicting? Four, is this fact, or catastrophizing? Five, what is a new, gentler thought?","情緒混亂不清":"Emotions are tangled and unclear","情緒解析度過低":"Emotional resolution is too low","煩躁、內耗、爆炸、失眠":"Irritability, inner wear, explosions, insomnia","看見：不是情緒多，是辨識低":"See it: not too many emotions, but too little recognition","情緒不能存在":"Emotions are not allowed to exist","童年壓抑形成情緒斷裂":"Childhood suppression cuts you off from emotion","忍耐→爆炸循環":"A cycle of enduring, then exploding","改寫：情緒需要被理解":"Rewrite: emotions need to be understood","情緒命名＝神經調整":"Naming an emotion equals adjusting the nerves","前額葉活化、杏仁核下降":"The prefrontal cortex activates and the amygdala quiets","情緒模糊化":"Emotions kept vague","精準命名降低耗能":"Precise naming saves energy","情緒＝內心通知":"Emotion equals a notice from the heart","情緒提醒失衡位置":"Emotion points to where the balance was lost","焦慮、憤怒、空虛":"Anxiety, anger, emptiness","看見：情緒背後的需求":"See it: the need behind the emotion","無法辨識情緒":"Unable to recognize the emotion","長期很耗神運作":"Working at great cost for a long time","發炎、疲勞、暴食、成癮":"Inflammation, fatigue, overeating, addiction","理解：情緒會轉成身體":"Understand: emotion turns into the body","提高情緒解析度":"Raise your emotional resolution","情緒語言重建":"Rebuild your emotional language","「我很煩」式模糊表達":"Vague expressions like \"I'm annoyed\"","精準描述真正感受":"Describe the real feeling precisely","情緒來時能否辨識":"Can I recognize the emotion when it comes","驗證內心成熟度":"Check how mature the heart is","情緒一來就失控":"Losing control the moment emotion comes","情緒來時仍能覺察":"Still able to notice when emotion comes","長出情緒覺察力":"Growing emotional awareness","內心穩定性提升":"The heart becomes steadier","長期內耗":"Long-term inner wear","高解析度思考":"High-resolution thinking","情緒≠問題":"Emotion does not equal a problem","情緒是導航內心":"Emotion is the heart's navigation","情緒＝麻煩":"Emotion equals trouble","情緒＝成長的入口":"Emotion equals a doorway to growth","情緒命名紀錄":"A record of naming emotions","無意識情緒循環":"An unconscious emotional loop","建立更有智慧情緒想法":"Build wiser thoughts about emotion","我害怕被否定":"I am afraid of being rejected","我很累":"I am tired","我長期高警戒":"I have been on high alert for a long time","情緒=麻煩":"Emotion equals trouble","情緒=導航":"Emotion equals navigation","辨識情緒":"Recognizing the emotion","忍耐→爆炸":"Enduring, then exploding","覺察→流動":"Noticing, then flowing","情緒=我":"Emotion equals me","情緒=訊號":"Emotion equals a signal","情緒高解析":"Emotion in high resolution","情緒調整內心":"Emotion adjusts the heart","情緒混亂　→　內心很耗神　→　情緒模糊化　→　內耗與壓抑　→　情緒重播　→　精準命名　→　前額葉活化　→　杏仁核下降　→　身心調整　→　情緒覺察力生成":"Emotional confusion, the heart working at great cost, emotions kept vague, inner wear and suppression, emotional replay; then precise naming, the prefrontal cortex activates, the amygdala quiets, body and mind adjust, and emotional awareness gr 提早三十分鐘上床，手機放在房間外。":"Go to bed thirty minutes earlier tonight, and leave your phone outside the room.","別人一句話，你在心裡重播了一整晚。":"Someone said one sentence, and you replayed it in your heart all night.","會反覆想，是因為你很在乎。":"You keep thinking about it because you care.","但在乎，不代表要用它來懲罰自己。":"But caring does not mean using it to punish yourself.","把它寫下來，讓紙替你記著，心就可以休息了。":"Write it down and let the paper remember it for you, so your heart can rest.","把那句話寫在紙上，再寫一句你想對自己說的話。":"Write that sentence on paper, then write one sentence you want to say to yourself.","總是先說「沒關係」，其實心裡很有關係。":"You always say \"it's fine\" first, when in your heart it is not fine at all.","懂事的人，往往最少被心疼。":"The most understanding people are often the least comforted.","說出感受不是計較，是讓愛你的人有機會靠近。":"Saying how you feel is not being petty; it gives those who love you a chance to come closer.","你可以溫柔，也可以有底線。":"You can be gentle and still have a bottom line.","今天練習說一次：「其實我有一點在意。」":"Today, practice saying once: \"Actually, I do mind a little.\"","害怕拒絕別人，怕一開口就失去這段關係。":"You are afraid to refuse, afraid that speaking up will cost you the relationship.","界線不是冷漠，是告訴別人怎麼愛你。":"A boundary is not coldness; it tells others how to love you.","你的時間和心力，都很珍貴。":"Your time and your energy are precious.","先答應自己，再答應世界。":"Say yes to yourself first, then to the world.","今天對一件不想做的小事，溫柔地說「這次不行」。":"Today, gently say \"not this time\" to one small thing you don't want to do.","看著別人的生活，覺得只有自己停在原地。":"Watching other people's lives, you feel you alone are standing still.","你看見的是別人的精彩片段，不是全部。":"What you see are other people's highlights, not the whole.","走得慢不是落後，是你正在把根扎深。":"Going slowly is not falling behind; you are sending your roots deep.","回到自己的路上，一步也算數。":"Return to your own road; even one step counts.","寫下今天完成的三件小事，再小都算。":"Write down three small things you finished today, however small.","事情還沒發生，心已經先演完一百種最壞的結局。":"Nothing has happened yet, but your heart has already played out a hundred worst endings.","焦慮不是你太脆弱，是心太想保護你。":"Anxiety is not you being too fragile; your heart wants so much to protect you.","謝謝它，然後把注意力帶回此刻。":"Thank it, then bring your attention back to this moment.","未來很大，但你只需要過好今天。":"The future is vast, but you only need to live today well.","深呼吸三次，只做眼前最小的一件事。":"Take three deep breaths and do only the smallest thing in front of you.","一犯錯就罵自己：「我怎麼這麼沒用。」":"The moment you make a mistake, you scold yourself: \"How can I be so useless?\"","犯錯，是你正在學習的證明。":"A mistake is proof that you are learning.","一次失敗，不等於你這個人失敗。":"One failure does not make you a failure.","你已經很努力了，這一點請不要忘記。":"You have already worked very hard. Please don't forget that.","把「我好沒用」換成「我正在學」。":"Change \"I'm so useless\" to \"I am learning.\"","忍了很久，最後為了一件小事爆炸，然後更討厭自己。":"You held it in for so long, finally exploded over something small, and then disliked yourself even more.","不必等到滿了才倒，平常就可以一點一點說。":"You don't have to wait until the cup is full to pour; you can say a little at a time.","好好生氣，也是一種照顧自己。":"Being angry well is also a way of caring for yourself.","下次不舒服時，當下說一句：「這樣我不太舒服。」":"Next time you feel uncomfortable, say it in the moment: \"I'm not quite comfortable with this.\"","身邊很多人，卻覺得沒有一個人懂你。":"There are many people around you, yet you feel no one understands you.","不是你不夠好，是你太久沒有說真心話。":"It is not that you are not good enough; you have gone too long without speaking from the heart.","被懂，從願意被看見開始。":"Being understood begins with being willing to be seen.","先給自己一個擁抱，再給別人一個機會。":"Give yourself a hug first, then give others a chance.","傳訊息給一個想念的人：「最近好嗎？」":"Send a message to someone you miss: \"How have you been?\"","知道該開始，卻一直拖，越拖越討厭自己。":"You know you should start, yet you keep delaying, and the longer you delay, the more you dislike yourself.","拖延的背後，常常藏著一顆怕失望的心。":"Behind procrastination there is often a heart afraid of disappointment.","不必一次做完，先做五分鐘就好。":"You don't have to finish it all at once; just do five minutes.","開始了，就已經贏過昨天的自己。":"Once you begin, you have already done better than yesterday's you.","設定五分鐘計時器，只做第一步。":"Set a five-minute timer and do only the first step.","很努力了，卻總覺得自己不夠好。":"You have tried so hard, yet you always feel you are not good enough.","「不夠好」是一句舊話，不是事實。":"\"Not good enough\" is an old phrase, not a fact.","你的價值，不是成績單算出來的。":"Your worth is not calculated by a report card.","你存在，就已經足夠。":"That you exist is already enough.","對鏡子裡的自己說：「你今天辛苦了。」":"Say to yourself in the mirror: \"You worked hard today.\"","放不下一個已經離開的人。":"You cannot let go of someone who has already left.","悲傷不是軟弱，是愛留下的形狀。":"Sadness is not weakness; it is the shape love leaves behind.","不必急著好起來，慢慢來也沒關係。":"There is no need to hurry to feel better; slowly is all right.","有一天你會發現，想起時不再那麼痛了。":"One day you will find that remembering no longer hurts so much.","允許自己今天難過十分鐘，然後去喝一杯溫水。":"Allow yourself ten minutes of sadness today, then go and drink a glass of warm water.","被誤會了，很想解釋，卻越說越無力。":"You were misunderstood and wanted to explain, but the more you said, the weaker you felt.","你不需要每個人都明白你。":"You don't need everyone to understand you.","清楚自己是誰，比被所有人喜歡重要。":"Knowing who you are matters more than being liked by everyone.","把力氣留給值得的人。":"Save your strength for those who are worth it.","寫下三個你清楚知道的、關於自己的優點。":"Write down three good things you know for certain about yourself.","被誤解":"Misunderstood","每天都很忙，卻不知道自己在忙什麼。":"You are busy every day, yet you don't know what you are busy with.","忙碌，有時候是一種逃避。":"Busyness is sometimes a way of escaping.","空白不是浪費，是讓心重新對焦。":"Blank space is not waste; it lets the heart refocus.","你要去哪裡，比你走多快更重要。":"Where you are going matters more than how fast you walk.","今天留十分鐘什麼都不做，只是坐著。":"Leave ten minutes today to do nothing at all, just sit.","習慣照顧所有人，卻忘了照顧自己。":"You are used to taking care of everyone, but forgot to take care of yourself.","一直付出的人，也會累，也會空。":"People who keep giving also get tired and feel empty.","先把自己的杯子裝滿，溢出來的才是給別人的。":"Fill your own cup first; what overflows is for others.","愛自己不是自私，是愛別人的底氣。":"Loving yourself is not selfish; it is the ground you stand on to love others.","今天為自己做一件小事：一杯喜歡的飲料、一段散步。":"Do one small thing for yourself today: a drink you like, or a short walk.","一點小事就想哭，覺得自己太敏感。":"You want to cry over small things and feel you are too sensitive.","眼淚不是脆弱，是心在替你排水。":"Tears are not weakness; they are the heart draining the water for you.","感受得深的人，也愛得深。":"Those who feel deeply also love deeply.","你只需要學會，也這樣溫柔地感受自己。":"You only need to learn to feel yourself just as gently.","想哭就哭一下，然後摸摸自己的心口。":"If you want to cry, cry a little, then touch your chest softly.","害怕失敗，所以乾脆不開始。":"You are afraid of failing, so you simply don't begin.","害怕，代表這件事對你很重要。":"Being afraid means this matters to you.","勇敢不是不怕，是帶著害怕往前一小步。":"Courage is not being unafraid; it is taking one small step forward with the fear.","做不好也沒關係，做了就會長大。":"It is all right not to do it well; doing it will help you grow.","把那件事拆成最小的一步，今天只做它。":"Break it into the smallest step and do only that today.","在關係裡，總是你先低頭、你先道歉。":"In the relationship, you are always the first to bow your head and the first to apologize.","愛不是誰忍得比較多。":"Love is not about who endures more.","你退的每一步，也需要有人看見。":"Every step you give way also needs to be seen by someone.","值得的人，會走過來和你站在一起。":"A person who is worth it will walk over and stand with you.","今天先問自己：「我真正想要的是什麼？」":"Today, first ask yourself: \"What do I truly want?\"","睡前滑手機到半夜，明明很睏卻捨不得睡。":"You scroll on your phone until midnight, sleepy yet unwilling to sleep.","白天都給了別人，夜晚才想補償自己。":"The day was given to others, so at night you want to make it up to yourself.","可是真正的補償，是好好睡一覺。":"But the real making up is a good night's sleep.","明天的你，會感謝今晚早睡的你。":"Tomorrow's you will thank tonight's you for sleeping early.","睡前半小時放下手機，換成一首安靜的歌。":"Put your phone down half an hour before bed and play a quiet song instead.","熬夜":"Staying up late","總覺得「等我變好了」才配擁有幸福。":"You always feel you will deserve happiness only once you become better.","你不需要先變瘦、變強、變成功。":"You don't need to become thinner, stronger, or more successful first.","此刻的你，就值得一頓好飯、一個好覺。":"You, as you are right now, deserve a good meal and a good sleep.","好好過今天，就是最好的變好。":"Living today well is the best way of getting better.","今天做一件「等以後才要做」的小小開心事。":"Today, do one small happy thing you were saving for later.","不配得感":"Feeling undeserving","被家人一句話刺到，明明長大了還是會痛。":"One sentence from family stings you, and though you are grown, it still hurts.","他們也許不擅長說愛，不代表你不值得。":"They may not be good at saying love; that does not mean you are unworthy.","你可以心疼小時候的自己。":"You are allowed to feel tender toward your younger self.","現在，換你來當那個肯定自己的人。":"Now it is your turn to be the one who affirms you.","寫一句小時候最想聽到的話，唸給自己聽。":"Write the sentence you most wanted to hear as a child, and read it aloud to yourself.","家人":"Family","心裡很亂，什麼都想做，卻什麼都做不了。":"Your heart is a mess; you want to do everything and can do nothing.","不必一次把人生理清楚。":"You don't have to sort out your whole life at once.","寫下來，亂就有了形狀。":"Write it down, and the mess takes a shape.","一次一件，慢慢地，路就出來了。":"One thing at a time, and slowly the path appears.","把腦中的事全部寫下來，圈出今天只做的一件。":"Write down everything in your head and circle the one thing you will do today.","明明不開心，還是習慣笑著說「我很好」。":"You are clearly unhappy, yet out of habit you smile and say, \"I'm fine.\"","逞強久了，連自己都騙過去了。":"After putting on a brave face for so long, you have even fooled yourself.","承認「我不太好」，是勇氣，不是丟臉。":"Admitting \"I'm not doing so well\" is courage, not shame.","想被接住，要先願意鬆手。":"To be caught, you must first be willing to let go.","今天對一個信任的人說：「其實我最近有點累。」":"Today, tell someone you trust: \"Actually, I've been a bit tired lately.\"","逞強":"Putting on a brave face","害怕被討厭，所以活成了別人想要的樣子。":"Afraid of being disliked, you have lived as the person others wanted.","討好換來的喜歡，留不住也不安心。":"Liking that is won by pleasing does not last and brings no peace.","你不需要讓每個人都滿意。":"You don't need to satisfy everyone.","有人不喜歡你，也沒關係。":"It is all right if someone does not like you.","今天做一個「只因為我喜歡」的小選擇。":"Today, make one small choice simply because you like it.","怕被討厭":"Fear of being disliked","覺得人生卡住了，怎麼努力都沒有用。":"You feel your life is stuck, and no amount of effort helps.","看不見進步，不代表沒有在前進。":"Not seeing progress does not mean you are not moving.","種子在土裡的時候，也是安靜的。":"A seed is quiet too, while it is in the soil.","換個方法、歇一下，都是前進。":"Trying another way or resting a while is also moving forward.","問自己：「如果換一種做法，會是什麼？」":"Ask yourself: \"If I did it another way, what would that be?\"","對未來沒有方向，不知道自己想要什麼。":"You have no direction for the future and don't know what you want.","迷茫，是心在說：我想要更適合的生活。":"Confusion is the heart saying: I want a life that suits me better.","答案不會用想的出現，會在走的路上出現。":"The answer does not come by thinking; it appears on the road as you walk.","跟著讓你眼睛發亮的小事走。":"Follow the small things that make your eyes light up.","寫下最近一件讓你忘記時間的事。":"Write down one recent thing that made you lose track of time.","一直在等一句道歉，等到自己都累了。":"You have waited for an apology until you are worn out.","你不必假裝沒事，也不必急著原諒。":"You don't have to pretend all is well, nor hurry to forgive.","只是別讓那件事，繼續佔著你心裡最好的位置。":"Just don't let that matter keep the best place in your heart.","放下的那天，最輕鬆的是你。":"On the day you let go, the one who feels lightest is you.","寫一封不寄出的信，把想說的全寫完。":"Write a letter you will not send, and say everything you want to say.","什麼都提不起勁，連喜歡的事也沒感覺了。":"You have no energy for anything; even what you love leaves you unmoved.","麻木，是心累到先把開關關上。":"Numbness is a heart so tired that it switches itself off first.","這不是你變糟了，是你需要被溫柔對待。":"You have not become worse; you need to be treated gently.","曬曬太陽、吃頓熱飯，從身體開始回來。":"Sit in the sun, eat a warm meal, and come back starting with the body.","出門走十分鐘，讓陽光照在臉上。":"Go out and walk for ten minutes, and let the sun fall on your face.","太在意別人怎麼看，連發一則貼文都要想很久。":"You care so much about what others think that even one post takes you a long time.","每個人都忙著擔心自己。":"Everyone is busy worrying about themselves.","你以為的目光，多半是心裡的聲音。":"The eyes you imagine on you are mostly a voice in your own heart.","把評審席上的人請下來，這是你的人生。":"Ask the judges to step down from their seats; this is your life.","今天做一件「不管別人怎麼看」的小事。":"Today, do one small thing no matter what others think.","走過很痛的日子，懷疑自己還能不能好起來。":"You have walked through very painful days and wonder whether you can ever be well again.","你撐過了每一個以為過不去的夜晚。":"You made it through every night you thought you could not get through.","傷口，會變成你懂得溫柔的地方。":"A wound becomes the place where you learn tenderness.","慢慢來，比較快。":"Going slowly is the faster way.","寫下一件「以前做不到、現在做得到」的事。":"Write down one thing you could not do before and can do now.","療癒":"Healing","連結需求":"A need for connection","失去、分離、需要陪伴":"loss, separation, and a need for company","激活親密的連結，尋求支持和共鳴":"connect with someone","保護需求":"A need for protection","危險、威脅、需要防禦":"danger, threat, and a need to defend yourself","啟動應變的力量，準備應對威脅":"It starts your power to respond and prepares you to meet the threat.","邊界能量":"Boundary energy","被侵犯、不公平、需要捍衛":"being invaded, unfairness, and a need to stand up for yourself","做行動":"take action","激活保護自己的力量，保護自己的利益":"It wakes your power to protect yourself and what matters to you.","親和能量":"Warm, friendly energy","目標達成、連結成功、獲得認可":"a goal reached, a connection made, and being recognized","去分享":"share it","強化成功行為，促進社交連結":"It strengthens what worked and brings people closer.","警覺能量":"Alert energy","預測失誤、出現異常、需要重新評估":"a wrong prediction, something unusual, and a need to look again","暫停反應":"pause before you react","重置注意力，成長內部想法":"It resets your attention and lets your inner picture grow.","拒斥能量":"Rejecting energy","觸犯價值觀、接近有害物質、違反道德":"values offended, something harmful nearby, or a moral line crossed","做拒絕":"say no","啟動排斥反應，保護身心健康":"It starts a pushing-away response to protect body and mind.","預測能量":"Predicting energy","未來失控感、預期威脅、不確定性":"a future that feels out of control, an expected threat, and uncertainty","做準備":"prepare","激活內在的預想，進行心理預演":"It wakes your inner expectations and rehearses in the mind.","修復能量":"Repairing energy","違反自己的標準、傷害他人、需要改正":"going against your own standards, hurting someone, and a need to make it right","啟動改正程序，恢復道德一致性":"It starts the work of correction and restores your integrity.","退縮能量":"Withdrawing energy","身份威脅、被評判、自我否定":"a threat to identity, being judged, and rejecting yourself","評估社會地位，調整自我形象":"It weighs your place among others and adjusts your self-image.","競爭能量":"Competitive energy","資源不足、被比較、需要提升":"too few resources, being compared, and a need to improve","激發上進心，驅動自我提升":"It stirs ambition and drives you to improve.","連結渴望":"A longing for connection","被隔絕、缺乏歸屬感、內心空虛":"being cut off, lacking belonging, and inner emptiness","尋求社交連結，重建歸屬感":"It seeks connection with others and rebuilds belonging.","求救能量":"Energy that calls for help","失去控制、無法改變局面、需要幫助":"loss of control, being unable to change things, and a need for help","啟動依附內心，尋求外部支持":"It turns you toward others and seeks outside support.","消耗能量":"Draining energy","反覆糾結、自我對抗、陷入思維迴圈":"going round and round, fighting yourself, and being caught in a loop of thought","中斷反覆思考，轉向行動":"It breaks the loop of thinking and turns toward action.","尋義能量":"Meaning-seeking energy","失去目標、生活無意義、精神匱乏":"a lost goal, a life without meaning, and an empty spirit","重新連結人生目標，建構意義感":"It reconnects you with your purpose and builds meaning.","要求超載、資源不足、需要整理":"too many demands, too few resources, and a need to sort things out","優先級排序，資源重新配置":"It sets priorities and rearranges your resources.","方向能量":"Direction energy","目標不清、選擇困難、前路模糊":"unclear goals, hard choices, and a hazy road ahead","釐清價值觀，確定人生方向":"It clarifies your values and sets your direction.","驗證能量":"Verifying energy","信息不足、判斷不確定、需要確認":"too little information, uncertain judgment, and a need to confirm","收集信息，成長信念內心":"It gathers information and lets your beliefs grow.","調整能量":"Adjusting energy","節奏不適、受到干擾、節律失調":"an uncomfortable pace, being disturbed, and a rhythm out of tune","放慢速度，恢復內部節律":"It slows you down and restores your inner rhythm.","恢復能量":"Restoring energy","資源耗盡、能量枯竭、需要補充":"resources used up, energy run dry, and a need to refill","停止消耗，啟動恢復模式":"It stops the spending and starts recovery.","調適能量":"Adapting energy","期待落空、得失轉變、需要重新適應":"a hope unmet, a change of fortune, and a need to adapt again","處理喪失，建立新適應":"It works through the loss and builds a new balance.","目標受阻、路徑被堵、需要重新規劃":"a blocked goal, a closed path, and a need to plan again","重新評估策略，尋找替代方案":"It reviews your approach and looks for another way.","穩定能量":"Steadying energy","環境不可控、失去安全感、需要穩定":"an uncontrollable environment, lost safety, and a need for steadiness","建立安全感，增強控制感":"It builds a sense of safety and strengthens your sense of control.","學習能量":"Learning energy","過去決策有誤、錯失機會、需要反思":"a past decision that was wrong, a missed chance, and a need to reflect","做反思":"reflect","提取經驗教訓，優化決策想法":"It draws out the lesson and improves how you decide.","表達能量":"Expressive energy","被誤解、付出未得認可、需要理解":"being misunderstood, effort unrecognized, and a need to be understood","清晰溝通，修復理解":"It communicates clearly and repairs understanding.","驅動能量":"Driving energy","存在匱乏、目標吸引、需要追求":"something lacking, a goal that attracts you, and a need to pursue it","去追求":"pursue it","激發動力，指導行為目標":"It stirs motivation and guides you toward your goal.","行動能量":"Action energy","機會來臨、目標接近、需要付諸行動":"an opportunity arriving, a goal drawing near, and a need to act","激活執行內心，促進積極行為":"It wakes your will to carry things out and encourages positive action.","預設能量":"Anticipating energy","未來有利、值得期盼、需要準備":"a favorable future, something to look forward to, and a need to get ready","去準備":"get ready","前期計劃，為機會做準備":"It plans ahead and prepares for the opportunity.","現況可接納、需求被滿足、達成平衡":"a present you can accept, needs met, and balance reached","去感恩":"give thanks","鞏固成就，強化正向體驗":"It secures what you have achieved and deepens the good experience.","連結能量":"Connecting energy","他人吸引、建立親密、需要靠近":"being drawn to someone, closeness forming, and a need to come near","去交心":"open your heart to someone","深化關係，建立信任":"It deepens the relationship and builds trust.","自我確認":"Self-affirmation","能力展現、成就達成、身份確立":"ability shown, something achieved, and identity confirmed","去認可":"acknowledge yourself","強化自我形象，提升自信":"It strengthens your self-image and raises confidence.","整合能量":"Integrating energy","內外和諧、心智平靜、達成內在一致":"harmony inside and out, a calm mind, and inner agreement","去冥想":"meditate","深化覺知，實現內在平衡":"It deepens awareness and brings inner balance.","向前能量":"Forward energy","未來可能、困境有出口、需要堅持":"a possible future, a way out of difficulty, and a need to keep going","去堅持":"keep going","維持動力，渡過困難時期":"It sustains your drive and carries you through hard times.","獲得支持、被惠及、需要表達感謝":"support received, kindness shown to you, and a need to say thanks","去回報":"give something back","強化關係，建立互惠循環":"It strengthens the relationship and starts a circle of giving.","過去有意義、時光流逝、需要整合":"a meaningful past, time passing, and a need to bring it together","去整合":"bring it together","統合經驗，形成身份連續性":"It gathers your experiences into one continuous sense of self.","謙遜能量":"Humble energy","自我相對化、視野擴大、需要調整視角":"seeing yourself as small, a wider view, and a need to shift perspective","找連結":"look for connection","放下自我執著，體驗更大圖景":"It lets go of clinging to self and takes in the larger picture.","確認能量":"Confirming energy","被理解、被重視、內在被認可":"being understood, being valued, and being accepted within","深化人際連結，確認自我價值":"It deepens your bonds and confirms your worth.","內省能量":"Reflective energy","需要獨處、內在整理、自我療愈":"a need for solitude, inner sorting, and self-healing","去內觀":"look within","深化自我認識，恢復內在力量":"It deepens self-knowledge and restores inner strength.","探索能量":"Exploring energy","成長機會、突破邊界、需要嘗試":"a chance to grow, a boundary to cross, and a need to try","去嘗試":"give it a try","擴展能力邊界，開發新潛能":"It widens what you can do and opens new potential.","監測能量":"Watchful energy","環境變化、潛在威脅、需要關注":"a changing environment, a possible threat, and a need to pay attention","去觀察":"observe","增強感知，及時應對變化":"It sharpens your senses and lets you respond to change in time.","關切能量":"Caring energy","他人福祉、親密關係、需要行動":"another's well-being, a close relationship, and a need to act","表達關愛，強化親密連結":"It expresses care and strengthens cl
