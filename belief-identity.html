<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信念 × 身份｜重建人生OS診斷系統</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif;background:#070B14;min-height:100vh;color:#fff;}

/* ── HERO ── */
.hero{background:linear-gradient(160deg,#070B14 0%,#0C1828 55%,#070B14 100%);border-bottom:1px solid rgba(99,179,237,0.18);padding:2.5rem 1.5rem 2rem;text-align:center;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% -10%,rgba(99,179,237,0.1) 0%,transparent 65%);pointer-events:none;}
.hero-badge{display:inline-block;font-size:11px;letter-spacing:2px;color:#63B3ED;border:1px solid rgba(99,179,237,0.35);padding:4px 18px;border-radius:100px;margin-bottom:.9rem;position:relative;}
.hero-title{font-size:24px;font-weight:700;color:#fff;letter-spacing:2px;margin-bottom:5px;position:relative;}
.hero-title .hl{color:#63B3ED;font-style:normal;}
.hero-title .hl2{color:#F6AD55;}
.hero-sub{font-size:12px;color:rgba(255,255,255,0.4);letter-spacing:1px;margin-bottom:1.1rem;position:relative;}
.hero-div{width:80px;height:1px;background:linear-gradient(90deg,transparent,#63B3ED,transparent);margin:0 auto 1.1rem;}
.hero-tags{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;position:relative;}
.hero-tag{font-size:11px;padding:5px 14px;border-radius:100px;background:rgba(99,179,237,0.07);border:1px solid rgba(99,179,237,0.2);color:#63B3ED;}
.prog-bar{background:rgba(255,255,255,0.05);border-radius:100px;height:3px;margin:1.4rem 1.5rem 0;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,#63B3ED,#F6AD55);border-radius:100px;transition:width .6s ease;width:0%;}

/* ── LAYOUT ── */
.content{max-width:760px;margin:0 auto;padding:1.5rem 1rem;}
.phase{display:none;}.phase.active{display:block;}
.slabel{font-size:10px;font-weight:700;letter-spacing:2px;color:#63B3ED;margin-bottom:1rem;display:flex;align-items:center;gap:8px;text-transform:uppercase;}
.slabel::after{content:'';flex:1;height:.5px;background:rgba(99,179,237,0.18);}

/* ── ENTROPY METER ── */
.entropy-meter{display:grid;grid-template-columns:1fr auto 1fr;gap:0;margin-bottom:1.5rem;border:1px solid rgba(255,255,255,0.08);border-radius:14px;overflow:hidden;}
.em-col{padding:12px 10px;}
.em-red{background:rgba(163,45,45,0.08);}
.em-mid{background:rgba(255,255,255,0.03);display:flex;align-items:center;justify-content:center;border-left:1px solid rgba(255,255,255,0.07);border-right:1px solid rgba(255,255,255,0.07);}
.em-green{background:rgba(26,122,42,0.07);}
.em-title{font-size:10px;font-weight:700;margin-bottom:6px;letter-spacing:.5px;}
.em-red .em-title{color:#E87070;}
.em-green .em-title{color:#6BCF7F;}
.em-item{font-size:10px;color:rgba(255,255,255,0.45);padding:2px 0;line-height:1.4;}
.em-vs{font-size:18px;font-weight:700;color:rgba(255,255,255,0.2);}

/* ── FILTER TABS ── */
.f-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.2rem;}
.f-tab{padding:6px 14px;border:1px solid rgba(255,255,255,0.1);border-radius:100px;font-size:11px;color:rgba(255,255,255,0.4);cursor:pointer;background:transparent;font-family:inherit;transition:all .2s;}
.f-tab:hover{border-color:rgba(99,179,237,0.4);color:#63B3ED;}
.f-tab.active{background:rgba(99,179,237,0.1);border-color:#63B3ED;color:#63B3ED;font-weight:600;}

/* ── MODULE GRID ── */
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin-bottom:1.2rem;}
.mod-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px 12px;cursor:pointer;transition:all .2s;text-align:center;position:relative;}
.mod-card:hover{border-color:rgba(99,179,237,0.4);background:rgba(99,179,237,0.04);}
.mod-card.picked{border:1.5px solid #63B3ED;background:rgba(99,179,237,0.07);}
.mod-card.picked::after{content:'✓';position:absolute;top:8px;right:10px;font-size:11px;color:#63B3ED;font-weight:700;}
.mod-icon{font-size:26px;margin-bottom:6px;display:block;}
.mod-part{font-size:10px;color:#63B3ED;font-weight:600;margin-bottom:2px;letter-spacing:1px;}
.mod-name{font-size:13px;font-weight:700;color:#fff;margin-bottom:3px;}
.mod-desc{font-size:10px;color:rgba(255,255,255,0.35);line-height:1.4;}

.pick-hint{text-align:center;font-size:12px;color:rgba(255,255,255,0.3);margin-bottom:1rem;}
.pick-count{display:inline-block;background:rgba(99,179,237,0.1);color:#63B3ED;font-size:12px;padding:3px 12px;border-radius:100px;margin-left:6px;font-weight:600;}

/* ── QUESTION ── */
.q-block{margin-bottom:1.5rem;}
.q-mod-hdr{display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(99,179,237,0.06);border:1px solid rgba(99,179,237,0.18);border-radius:12px;margin-bottom:10px;}
.q-mod-icon{font-size:20px;}
.q-mod-name{font-size:14px;font-weight:700;color:#fff;flex:1;}
.q-mod-tag{font-size:11px;color:#63B3ED;}
.q-list{display:flex;flex-direction:column;gap:8px;}
.q-item{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:11px;padding:12px 14px;}
.q-text{font-size:13px;color:rgba(255,255,255,0.8);margin-bottom:9px;line-height:1.6;}
.q-opts{display:flex;gap:7px;flex-wrap:wrap;}
.q-opt{padding:6px 12px;border:1px solid rgba(255,255,255,0.12);border-radius:100px;font-size:11px;cursor:pointer;color:rgba(255,255,255,0.5);background:transparent;transition:all .15s;font-family:inherit;}
.q-opt:hover{border-color:#63B3ED;color:#63B3ED;}
.q-opt.sel{background:rgba(99,179,237,0.12);border-color:#63B3ED;color:#63B3ED;font-weight:600;}

/* ── RESULT HERO ── */
.res-hero{background:linear-gradient(135deg,#070B14,#0C1828);border:1px solid rgba(99,179,237,0.22);border-radius:18px;padding:2rem;text-align:center;margin-bottom:1.5rem;}
.rh-ring{width:110px;height:110px;margin:0 auto 1rem;position:relative;}
.rh-ring svg{width:110px;height:110px;}
.rh-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px;font-weight:700;color:#63B3ED;}
.rh-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:5px;}
.rh-desc{font-size:13px;color:rgba(255,255,255,0.45);}

/* ── ENTROPY SCORE BAR ── */
.entropy-gauge{display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:12px;margin-bottom:1rem;}
.eg-label{font-size:11px;color:rgba(255,255,255,0.4);width:60px;flex-shrink:0;}
.eg-bar-wrap{flex:1;height:6px;background:rgba(255,255,255,0.06);border-radius:100px;overflow:hidden;}
.eg-bar{height:100%;border-radius:100px;transition:width 1.2s ease;}
.eg-score{font-size:13px;font-weight:700;width:40px;text-align:right;flex-shrink:0;}

/* ── MODULE RESULT CARD ── */
.mrc{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:16px;overflow:hidden;margin-bottom:14px;}
.mrc-hdr{display:flex;align-items:center;gap:12px;padding:14px 16px;}
.mrc-icon{font-size:24px;}
.mrc-info{flex:1;}
.mrc-name{font-size:15px;font-weight:700;color:#fff;}
.mrc-tag{font-size:11px;color:#63B3ED;margin-top:2px;}
.mrc-score-area{text-align:right;}
.mrc-score-num{font-size:18px;font-weight:700;}
.mrc-bar-wrap{width:80px;height:4px;background:rgba(255,255,255,0.08);border-radius:100px;margin-top:5px;overflow:hidden;}
.mrc-bar{height:100%;border-radius:100px;transition:width 1s ease;}
.s-hi{background:#1a7a2a;}.s-md{background:#B8860B;}.s-lo{background:#A32D2D;}

/* ── TABS ── */
.rtabs{display:flex;border:1px solid rgba(255,255,255,0.08);border-radius:10px;overflow:hidden;margin:0 16px 12px;}
.rtab{flex:1;padding:10px;font-size:11px;font-weight:600;text-align:center;cursor:pointer;background:transparent;color:rgba(255,255,255,0.3);border:none;transition:all .2s;font-family:inherit;}
.rtab.active{background:rgba(99,179,237,0.1);color:#63B3ED;}
.tab-panel{display:none;padding:0 16px 16px;}.tab-panel.active{display:block;}

/* ── EDU PANEL ── */
.core-box{background:rgba(99,179,237,0.06);border:1px solid rgba(99,179,237,0.2);border-radius:12px;padding:14px;margin-bottom:10px;}
.core-lbl{font-size:10px;color:#63B3ED;font-weight:700;letter-spacing:1px;margin-bottom:5px;}
.core-txt{font-size:14px;color:#fff;font-weight:600;line-height:1.6;font-style:italic;}
.sci-box{background:rgba(30,58,138,0.1);border:1px solid rgba(30,58,138,0.25);border-left:4px solid rgba(99,179,237,0.5);border-radius:0 10px 10px 0;padding:12px 14px;margin-bottom:10px;}
.sci-lbl{font-size:10px;color:rgba(147,197,253,0.8);font-weight:700;margin-bottom:5px;letter-spacing:.5px;}
.sci-txt{font-size:12px;color:rgba(147,197,253,0.7);line-height:1.7;}
.path-box{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:14px;margin-bottom:10px;}
.path-lbl{font-size:10px;letter-spacing:1px;color:rgba(255,255,255,0.3);font-weight:700;margin-bottom:8px;}
.path-step{font-size:12px;color:rgba(255,255,255,0.6);display:flex;align-items:center;gap:8px;padding:3px 0;}
.path-step.ps-first{color:#E87070;font-weight:600;}
.path-step.ps-last{color:#6BCF7F;}
.path-arr{font-size:10px;color:rgba(255,255,255,0.2);}
.update-box{background:rgba(246,173,85,0.05);border-left:3px solid #F6AD55;padding:10px 14px;border-radius:0 10px 10px 0;margin-bottom:10px;}
.ub-lbl{font-size:10px;color:#8B6508;font-weight:700;margin-bottom:3px;letter-spacing:.5px;}
.ub-txt{font-size:13px;color:rgba(255,255,255,0.7);line-height:1.6;}
.vs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.vs-card{border-radius:10px;padding:10px 12px;}
.vs-bad{background:rgba(163,45,45,0.07);border:1px solid rgba(163,45,45,0.18);}
.vs-good{background:rgba(26,122,42,0.07);border:1px solid rgba(26,122,42,0.18);}
.vs-ttl{font-size:10px;font-weight:700;margin-bottom:6px;}
.vs-bad .vs-ttl{color:#E87070;}
.vs-good .vs-ttl{color:#6BCF7F;}
.vs-item{font-size:11px;color:rgba(255,255,255,0.5);padding:2px 0;line-height:1.4;}
.quote-box{background:rgba(99,179,237,0.04);border:1px solid rgba(99,179,237,0.13);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
.quote-txt{font-size:13px;color:rgba(147,197,253,0.8);line-height:1.7;font-style:italic;}
.entropy-table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px;}
.entropy-table th{background:rgba(99,179,237,0.1);color:#63B3ED;padding:8px 10px;text-align:left;font-size:10px;letter-spacing:.5px;}
.entropy-table td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.05);color:rgba(255,255,255,0.6);vertical-align:top;}
.entropy-table tr:last-child td{border-bottom:none;}
.entropy-table .td-high{color:rgba(232,112,112,0.8);}
.entropy-table .td-low{color:rgba(107,207,127,0.8);}

/* ── METHOD PANEL ── */
.method-steps{display:flex;flex-direction:column;gap:10px;}
.ms-card{display:flex;gap:12px;background:rgba(99,179,237,0.04);border:1px solid rgba(99,179,237,0.1);border-radius:12px;padding:12px 14px;}
.ms-num{width:24px;height:24px;border-radius:50%;background:rgba(99,179,237,0.15);border:1px solid rgba(99,179,237,0.3);font-size:11px;font-weight:700;color:#63B3ED;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ms-body{flex:1;}
.ms-title{font-size:13px;font-weight:700;color:#fff;margin-bottom:4px;}
.ms-desc{font-size:12px;color:rgba(255,255,255,0.55);line-height:1.6;}
.daily-box{background:rgba(26,122,42,0.05);border:1px solid rgba(26,122,42,0.15);border-left:3px solid rgba(26,122,42,0.5);border-radius:0 12px 12px 0;padding:12px 14px;margin-top:10px;}
.daily-ttl{font-size:11px;color:rgba(107,207,127,0.8);font-weight:700;margin-bottom:6px;}
.daily-item{font-size:12px;color:rgba(107,207,127,0.65);padding:3px 0;border-bottom:1px solid rgba(26,122,42,0.12);}
.daily-item:last-child{border-bottom:none;}

/* ── NUTRIENT PANEL ── */
.nut-list{display:flex;flex-direction:column;gap:9px;}
.nut-card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:12px;overflow:hidden;}
.nut-top{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;transition:background .15s;}
.nut-top:hover{background:rgba(99,179,237,0.04);}
.nut-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.nut-info{flex:1;min-width:0;}
.nut-name{font-size:13px;font-weight:700;color:#fff;}
.nut-mech{font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;}
.nut-price{font-size:12px;color:#B8860B;font-weight:700;margin-top:3px;}
.nut-exp{font-size:11px;color:rgba(255,255,255,0.2);flex-shrink:0;}
.nut-cta{padding:7px 13px;background:linear-gradient(135deg,#B8860B,#D4A017);color:#070B14;border:none;border-radius:100px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;text-decoration:none;display:inline-block;font-family:inherit;}
.nut-detail{display:none;padding:0 14px 14px;border-top:1px solid rgba(255,255,255,0.05);}
.nut-detail.open{display:block;}
.nut-mbox{background:rgba(255,255,255,0.03);border-radius:10px;padding:10px 12px;margin:10px 0;}
.nut-mt{font-size:10px;letter-spacing:1px;color:rgba(255,255,255,0.25);font-weight:700;margin-bottom:5px;}
.nut-mb{font-size:12px;color:rgba(255,255,255,0.65);line-height:1.7;}
.nut-why{background:rgba(246,173,85,0.05);border-left:2px solid #F6AD55;padding:8px 12px;border-radius:0 8px 8px 0;margin-bottom:10px;}
.nut-wt{font-size:10px;color:#8B6508;font-weight:700;margin-bottom:3px;letter-spacing:.5px;}
.nut-wb{font-size:12px;color:rgba(255,255,255,0.65);line-height:1.6;}
.buy-block{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(184,134,11,0.05);border:1px solid rgba(184,134,11,0.18);border-radius:10px;}
.bb-info{flex:1;}
.bb-name{font-size:12px;font-weight:700;color:#fff;margin-bottom:2px;}
.bb-price{font-size:16px;font-weight:700;color:#D4A017;}
.bb-spec{font-size:10px;color:rgba(255,255,255,0.3);}
.bb-store{font-size:10px;color:#B8860B;margin-top:2px;font-weight:600;}
.btn-buy-full{padding:10px 18px;background:linear-gradient(135deg,#B8860B,#D4A017);color:#070B14;border:none;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;white-space:nowrap;flex-shrink:0;font-family:inherit;}

/* ── BUTTONS ── */
.btn-primary{width:100%;padding:16px;background:linear-gradient(135deg,#2B6CB0,#63B3ED);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:1px;transition:opacity .2s,transform .1s;margin-top:1rem;font-family:inherit;}
.btn-primary:hover{opacity:.9;transform:translateY(-1px);}
.btn-primary:disabled{opacity:.2;cursor:not-allowed;transform:none;}
.nav-row{display:flex;gap:10px;margin-top:1rem;}
.btn-back{flex:1;padding:14px;background:transparent;border:1px solid rgba(255,255,255,0.12);border-radius:12px;font-size:14px;color:rgba(255,255,255,0.4);cursor:pointer;font-family:inherit;transition:all .2s;}
.btn-back:hover{border-color:rgba(99,179,237,0.4);color:#63B3ED;}
.btn-restart{display:block;width:100%;padding:14px;background:transparent;border:1px solid rgba(255,255,255,0.08);border-radius:12px;font-size:14px;color:rgba(255,255,255,0.3);cursor:pointer;text-align:center;margin-top:1.5rem;transition:all .2s;font-family:inherit;}
.btn-restart:hover{border-color:rgba(99,179,237,0.3);color:#63B3ED;}
.footer{text-align:center;font-size:11px;color:rgba(255,255,255,0.15);padding:1.5rem 1rem;line-height:1.8;}

@media(max-width:480px){
  .mod-grid{grid-template-columns:1fr 1fr;}
  .vs-grid{grid-template-columns:1fr;}
  .entropy-meter{grid-template-columns:1fr;} .em-mid{border-left:none;border-right:none;border-top:1px solid rgba(255,255,255,0.07);border-bottom:1px solid rgba(255,255,255,0.07);}
  .hero-title{font-size:20px;}
  .buy-block{flex-direction:column;align-items:flex-start;}
  .btn-buy-full{width:100%;text-align:center;}
}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-badge">Belief × Identity OS</div>
  <div class="hero-title"><em class="hl">信念</em> × <em class="hl2">身份</em>｜診斷系統</div>
  <div class="hero-div"></div>
  <div class="hero-sub">高熵信念讓人生重播 · 低熵身份讓人生演化</div>
  <div class="hero-tags">
    <span class="hero-tag">診斷</span>
    <span class="hero-tag">教育</span>
    <span class="hero-tag">抗熵方法</span>
    <span class="hero-tag">神經修復</span>
  </div>
  <div class="prog-bar"><div class="prog-fill" id="prog"></div></div>
</div>

<div class="content">

<!-- P1 SELECT -->
<div class="phase active" id="p1">
  <div class="slabel">高熵 vs 低熵：你在哪一側？</div>
  <div class="entropy-meter">
    <div class="em-col em-red">
      <div class="em-title">🟥 高熵身份</div>
      <div class="em-item">固定、防禦、怕修正</div>
      <div class="em-item">把情緒當真相</div>
      <div class="em-item">錯誤＝人格失敗</div>
      <div class="em-item">人生不斷重播</div>
      <div class="em-item">活在舊信念</div>
    </div>
    <div class="em-col em-mid"><span class="em-vs">VS</span></div>
    <div class="em-col em-green">
      <div class="em-title">🟩 低熵身份</div>
      <div class="em-item">流動、可更新、能校準</div>
      <div class="em-item">情緒＝訊號</div>
      <div class="em-item">錯誤＝修正資料</div>
      <div class="em-item">人生持續演化</div>
      <div class="em-item">永遠能更新</div>
    </div>
  </div>

  <div class="slabel" style="margin-top:1.5rem">選擇最困擾你的模組（可多選）</div>
  <div class="pick-hint">選你最有共鳴的模組 <span class="pick-count" id="pcount">0 已選</span></div>
  <div class="f-tabs" id="f-tabs"></div>
  <div class="mod-grid" id="mod-grid"></div>
  <button class="btn-primary" id="btn-next" disabled>開始診斷 →</button>
</div>

<!-- P2 QUESTIONS -->
<div class="phase" id="p2">
  <div id="q-body"></div>
  <div class="nav-row">
    <button class="btn-back" onclick="go(1)">← 重新選擇</button>
    <button class="btn-primary" style="flex:2;margin-top:0" onclick="showResult()">查看我的信念×身份報告 →</button>
  </div>
</div>

<!-- P3 RESULT -->
<div class="phase" id="p3">
  <div id="result-body"></div>
  <button class="btn-restart" onclick="restart()">↺ 重新診斷</button>
</div>

</div>

<div class="footer">
  資訊僅供參考，不能用來診斷和治療任何形式的身體不適。如有不適請線下及時就醫。<br>

</div>

const FILTERS=['全部','信念','身份','對照','抗熵','目標函數'];
let picked=[],answers={},phase=1;

function initFilters(){
  const ct=document.getElementById('f-tabs');
  FILTERS.forEach((f,i)=>{
    const btn=document.createElement('button');
    btn.className='f-tab'+(i===0?' active':'');
    btn.textContent=f; btn.dataset.f=f;
    btn.onclick=()=>{
      document.querySelectorAll('.f-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active'); renderGrid(f);
    };
    ct.appendChild(btn);
  });
}

function renderGrid(filter){
  const g=document.getElementById('mod-grid'); g.innerHTML='';
  const list=filter==='全部'?MODULES:MODULES.filter(m=>m.cat===filter);
  list.forEach(m=>{
    const card=document.createElement('div');
    card.className='mod-card'+(picked.includes(m.id)?' picked':'');
    card.dataset.id=m.id;
    card.innerHTML=`<span class="mod-icon">${m.icon}</span><div class="mod-part">${m.part}</div><div class="mod-name">${m.name}</div><div class="mod-desc">${m.desc}</div>`;
    card.onclick=()=>toggleMod(m.id,card);
    g.appendChild(card);
  });
}

function toggleMod(id,card){
  const idx=picked.indexOf(id);
  if(idx===-1){picked.push(id);card.classList.add('picked');}
  else{picked.splice(idx,1);card.classList.remove('picked');}
  document.getElementById('pcount').textContent=picked.length+' 已選';
  document.getElementById('btn-next').disabled=picked.length===0;
  updateProg();
}

function go(n){
  document.querySelectorAll('.phase').forEach(p=>p.classList.remove('active'));
  document.getElementById('p'+n).classList.add('active');
  phase=n; updateProg();
  window.scrollTo({top:0,behavior:'smooth'});
}
function updateProg(){
  const p=phase===1?8:phase===2?48:100;
  document.getElementById('prog').style.width=p+'%';
}
document.getElementById('btn-next').onclick=()=>{buildDiag();go(2);};

function buildDiag(){
  const body=document.getElementById('q-body'); body.innerHTML='';
  picked.forEach(id=>{
    const m=MODULES.find(x=>x.id===id);
    const blk=document.createElement('div'); blk.className='q-block';
    blk.innerHTML=`<div class="q-mod-hdr"><span class="q-mod-icon">${m.icon}</span><span class="q-mod-name">${m.name}</span><span class="q-mod-tag">${m.tag}</span></div>`;
    const ql=document.createElement('div'); ql.className='q-list';
    m.qs.forEach((q,qi)=>{
      const key=id+'_'+qi;
      const item=document.createElement('div'); item.className='q-item';
      const opts=q.opts.map((o,oi)=>`<button class="q-opt" onclick="pickOpt(this,'${key}',${oi})">${o}</button>`).join('');
      item.innerHTML=`<div class="q-text">${q.q}</div><div class="q-opts">${opts}</div>`;
      ql.appendChild(item);
    });
    blk.appendChild(ql); body.appendChild(blk);
  });
}

function pickOpt(btn,key,val){
  btn.closest('.q-opts').querySelectorAll('.q-opt').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel'); answers[key]=val;
}

function calcScore(id){
  const m=MODULES.find(x=>x.id===id);
  let t=0,c=0;
  m.qs.forEach((_,qi)=>{const k=id+'_'+qi;if(answers[k]!==undefined){t+=answers[k];c++;}});
  if(!c)return 70;
  return Math.round(100-(t/c/3)*78);
}

              <div class="bb-name">${n.n}</div>
              <div class="bb-price">${n.price}</div>
              <div class="bb-spec">${n.spec}</div>
              <div class="bb-store">📦 7-11 賣貨便取貨付款</div>
            </div>
            <a class="btn-buy-full" href="${SHOP}" target="_blank" rel="noopener">立即購買 →</a>
          </div>
        </div>
      `;
      nl.appendChild(nc2);
    });
  });

  go(3);
  setTimeout(()=>{
    document.querySelectorAll('.mrc-bar').forEach(b=>{
      b.style.transition='width 1s ease'; b.style.width=b.dataset.w;
    });
  },300);
}

function sw(id,tab,btn){
  ['edu','meth','nut'].forEach(t=>document.getElementById(t+'_'+id).classList.toggle('active',t===tab));
  document.querySelectorAll('#tabs_'+id+' .rtab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function toggleNut(id){
  const el=document.getElementById(id);
  el.classList.toggle('open');
  const exp=document.getElementById('exp_'+id);
  if(exp)exp.textContent=el.classList.contains('open')?'▴':'▾';
}
function restart(){
  picked=[];answers={};
  document.querySelectorAll('.mod-card').forEach(c=>c.classList.remove('picked'));
  document.getElementById('pcount').textContent='0 已選';
  document.getElementById('btn-next').disabled=true;
  go(1);
}

initFilters();
renderGrid('全部');
</script>
</body>
</html>
