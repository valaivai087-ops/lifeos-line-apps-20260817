<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif;background:#080C14;min-height:100vh;color:#fff;}

/* HERO */
.hero{background:linear-gradient(160deg,#080C14 0%,#0E1826 55%,#080C14 100%);border-bottom:1px solid rgba(138,100,180,0.2);padding:2.5rem 1.5rem 2rem;text-align:center;position:relative;overflow:hidden;}

.hero-badge{display:inline-block;font-size:11px;letter-spacing:2px;color:#9B72CF;border:1px solid rgba(138,100,180,0.35);padding:4px 18px;border-radius:100px;margin-bottom:1rem;position:relative;}
.hero-title{font-size:24px;font-weight:700;color:#fff;letter-spacing:2px;margin-bottom:6px;position:relative;}
.hero-title em{color:#B99AE0;font-style:normal;}
.hero-sub{font-size:13px;color:rgba(255,255,255,0.45);letter-spacing:1px;margin-bottom:1.25rem;position:relative;}
.hero-divider{width:80px;height:1px;background:linear-gradient(90deg,transparent,#9B72CF,transparent);margin:0 auto 1.25rem;}
.hero-tags{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;position:relative;}
.hero-tag{font-size:11px;padding:5px 14px;border-radius:100px;background:rgba(138,100,180,0.08);border:1px solid rgba(138,100,180,0.2);color:#B99AE0;}
.prog-bar{background:rgba(255,255,255,0.05);border-radius:100px;height:3px;margin:1.5rem 1.5rem 0;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,#9B72CF,#B8860B);border-radius:100px;transition:width 0.6s ease;width:0%;}

/* CONTENT */
.content{max-width:760px;margin:0 auto;padding:1.5rem 1rem;}
.phase{display:none;}.phase.active{display:block;}
.slabel{font-size:10px;font-weight:700;letter-spacing:2px;color:#9B72CF;margin-bottom:1rem;display:flex;align-items:center;gap:8px;text-transform:uppercase;}
.slabel::after{content:'';flex:1;height:0.5px;background:rgba(138,100,180,0.2);}

/* OS CHAIN */
.os-chain{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;padding:1rem;background:rgba(138,100,180,0.04);border:1px solid rgba(138,100,180,0.15);border-radius:14px;margin-bottom:1.5rem;}

.os-s-start{background:rgba(163,45,45,0.15);border:1px solid rgba(163,45,45,0.3);color:#E87070;}
.os-s-mid{background:rgba(138,100,180,0.1);border:1px solid rgba(138,100,180,0.25);color:#B99AE0;}
.os-s-end{background:rgba(26,122,42,0.12);border:1px solid rgba(26,122,42,0.25);color:#6BCF7F;}
.os-arr{font-size:12px;color:rgba(138,100,180,0.35);}

/* CHAPTER GRID */
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin-bottom:1.25rem;}
.ch-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px 12px;cursor:pointer;transition:all 0.2s;text-align:center;position:relative;}
.ch-card:hover{border-color:rgba(138,100,180,0.4);background:rgba(138,100,180,0.04);}
.ch-card.picked{border:1.5px solid #9B72CF;background:rgba(138,100,180,0.07);}
.ch-card.picked::after{content:'✓';position:absolute;top:8px;right:10px;font-size:11px;color:#9B72CF;font-weight:700;}
.ch-icon{font-size:26px;margin-bottom:6px;display:block;}
.ch-num{font-size:10px;color:#9B72CF;font-weight:600;margin-bottom:2px;letter-spacing:1px;}
.ch-name{font-size:13px;font-weight:700;color:#fff;margin-bottom:3px;}
.ch-desc{font-size:10px;color:rgba(255,255,255,0.35);line-height:1.4;}

/* FILTER */
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem;}
.f-tab{padding:6px 14px;border:1px solid rgba(255,255,255,0.1);border-radius:100px;font-size:11px;color:rgba(255,255,255,0.4);cursor:pointer;background:transparent;font-family:inherit;transition:all 0.2s;}
.f-tab:hover{border-color:rgba(138,100,180,0.4);color:#9B72CF;}
.f-tab.active{background:rgba(138,100,180,0.1);border-color:#9B72CF;color:#9B72CF;font-weight:600;}

/* PICK HINT */
.pick-hint{text-align:center;font-size:12px;color:rgba(255,255,255,0.3);margin-bottom:1rem;}
.pick-count{display:inline-block;background:rgba(138,100,180,0.1);color:#9B72CF;font-size:12px;padding:3px 12px;border-radius:100px;margin-left:6px;font-weight:600;}

/* QUESTION */
.q-block{margin-bottom:1.5rem;}
.q-ch-header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(138,100,180,0.06);border:1px solid rgba(138,100,180,0.18);border-radius:12px;margin-bottom:10px;}
.q-ch-icon{font-size:22px;}
.q-ch-name{font-size:14px;font-weight:700;color:#fff;flex:1;}
.q-ch-tag{font-size:11px;color:#9B72CF;}
.q-list{display:flex;flex-direction:column;gap:8px;}
.q-item{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:11px;padding:12px 14px;}
.q-text{font-size:13px;color:rgba(255,255,255,0.8);margin-bottom:9px;line-height:1.6;}
.q-opts{display:flex;gap:7px;flex-wrap:wrap;}
.q-opt{padding:6px 12px;border:1px solid rgba(255,255,255,0.12);border-radius:100px;font-size:11px;cursor:pointer;color:rgba(255,255,255,0.5);background:transparent;transition:all 0.15s;font-family:inherit;}
.q-opt:hover{border-color:#9B72CF;color:#9B72CF;}
.q-opt.sel{background:rgba(138,100,180,0.12);border-color:#9B72CF;color:#9B72CF;font-weight:600;}

/* RESULT */
.result-hero{background:linear-gradient(135deg,#080C14,#0E1826);border:1px solid rgba(138,100,180,0.25);border-radius:18px;padding:2rem;text-align:center;margin-bottom:1.5rem;}
.rh-ring{width:110px;height:110px;margin:0 auto 1rem;position:relative;}
.rh-ring svg{width:110px;height:110px;}
.rh-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px;font-weight:700;color:#B99AE0;}
.rh-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:6px;}
.rh-desc{font-size:13px;color:rgba(255,255,255,0.45);}

/* RESULT CARD */
.rc{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:16px;overflow:hidden;margin-bottom:14px;}
.rc-header{display:flex;align-items:center;gap:12px;padding:14px 16px;}
.rc-icon{font-size:24px;}
.rc-info{flex:1;}
.rc-name{font-size:15px;font-weight:700;color:#fff;}
.rc-tag{font-size:11px;color:#9B72CF;margin-top:2px;}
.rc-score-area{text-align:right;}
.rc-score-num{font-size:18px;font-weight:700;}
.rc-bar-wrap{width:80px;height:4px;background:rgba(255,255,255,0.08);border-radius:100px;margin-top:5px;overflow:hidden;}
.rc-bar{height:100%;border-radius:100px;transition:width 1s ease;}
.s-hi{background:#1a7a2a;}.s-md{background:#B8860B;}.s-lo{background:#A32D2D;}

/* TABS */
.rtabs{display:flex;gap:0;border:1px solid rgba(255,255,255,0.08);border-radius:10px;overflow:hidden;margin:0 16px 12px;}
.rtab{flex:1;padding:10px;font-size:11px;font-weight:600;text-align:center;cursor:pointer;background:transparent;color:rgba(255,255,255,0.3);border:none;transition:all 0.2s;font-family:inherit;}
.rtab.active{background:rgba(138,100,180,0.1);color:#9B72CF;}
.tab-panel{display:none;padding:0 16px 16px;}.tab-panel.active{display:block;}

/* EDU */
.core-box{background:rgba(138,100,180,0.06);border:1px solid rgba(138,100,180,0.2);border-radius:12px;padding:14px;margin-bottom:10px;}
.core-label{font-size:10px;color:#9B72CF;font-weight:700;letter-spacing:1px;margin-bottom:5px;}
.core-text{font-size:14px;color:#fff;font-weight:600;line-height:1.6;font-style:italic;}
.edu-box{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:14px;margin-bottom:10px;}
.edu-title{font-size:10px;letter-spacing:1px;color:rgba(255,255,255,0.3);font-weight:700;margin-bottom:8px;}
.edu-chain{display:flex;flex-direction:column;gap:3px;}

.sci-title{font-size:10px;color:rgba(130,170,220,0.8);font-weight:700;margin-bottom:5px;letter-spacing:0.5px;}
.sci-text{font-size:12px;color:rgba(130,170,220,0.7);line-height:1.7;}
.vs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.vs-card{border-radius:10px;padding:10px 12px;}
.vs-old{background:rgba(163,45,45,0.08);border:1px solid rgba(163,45,45,0.2);}
.vs-new{background:rgba(26,122,42,0.08);border:1px solid rgba(26,122,42,0.2);}
.vs-title{font-size:10px;font-weight:700;margin-bottom:6px;}
.vs-old .vs-title{color:#E87070;}
.vs-new .vs-title{color:#6BCF7F;}
.vs-item{font-size:11px;color:rgba(255,255,255,0.55);padding:3px 0;line-height:1.4;}
.update-box{background:rgba(184,134,11,0.05);border-left:3px solid #B8860B;padding:10px 14px;border-radius:0 10px 10px 0;margin-bottom:10px;}
.ub-title{font-size:10px;color:#8B6508;font-weight:700;margin-bottom:3px;letter-spacing:0.5px;}
.ub-text{font-size:13px;color:rgba(255,255,255,0.7);line-height:1.6;}
.quote-box{background:rgba(138,100,180,0.05);border:1px solid rgba(138,100,180,0.15);border-radius:10px;padding:12px 16px;margin-bottom:10px;}
.quote-text{font-size:13px;color:rgba(185,154,224,0.85);line-height:1.7;font-style:italic;}

/* METHOD */
.method-steps{display:flex;flex-direction:column;gap:10px;}
.ms-card{display:flex;gap:12px;background:rgba(138,100,180,0.04);border:1px solid rgba(138,100,180,0.1);border-radius:12px;padding:12px 14px;}
.ms-num{width:24px;height:24px;border-radius:50%;background:rgba(138,100,180,0.15);border:1px solid rgba(138,100,180,0.3);font-size:11px;font-weight:700;color:#9B72CF;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ms-body{flex:1;}
.ms-title{font-size:13px;font-weight:700;color:#fff;margin-bottom:4px;}
.ms-desc{font-size:12px;color:rgba(255,255,255,0.55);line-height:1.6;}
.daily-box{background:rgba(26,122,42,0.05);border:1px solid rgba(26,122,42,0.15);border-left:3px solid rgba(26,122,42,0.5);border-radius:0 12px 12px 0;padding:12px 14px;margin-top:10px;}
.daily-title{font-size:11px;color:rgba(107,207,127,0.8);font-weight:700;margin-bottom:6px;}
.daily-item{font-size:12px;color:rgba(107,207,127,0.65);padding:3px 0;border-bottom:1px solid rgba(26,122,42,0.12);}
.daily-item:last-child{border-bottom:none;}

/* NUTRIENT */
.nut-list{display:flex;flex-direction:column;gap:9px;}
.nut-card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:12px;overflow:hidden;}
.nut-top{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;transition:background 0.15s;}
.nut-top:hover{background:rgba(138,100,180,0.04);}
.nut-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.nut-info{flex:1;min-width:0;}
.nut-name{font-size:13px;font-weight:700;color:#fff;}
.nut-mech{font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;}
.nut-price{font-size:12px;color:#B8860B;font-weight:700;margin-top:3px;}
.nut-exp{font-size:11px;color:rgba(255,255,255,0.2);flex-shrink:0;}
.nut-cta{padding:7px 13px;background:linear-gradient(135deg,#B8860B,#D4A017);color:#080C14;border:none;border-radius:100px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;text-decoration:none;display:inline-block;font-family:inherit;}
.nut-detail{display:none;padding:0 14px 14px;border-top:1px solid rgba(255,255,255,0.05);}
.nut-detail.open{display:block;}
.nut-mbox{background:rgba(255,255,255,0.03);border-radius:10px;padding:10px 12px;margin:10px 0;}
.nut-mt{font-size:10px;letter-spacing:1px;color:rgba(255,255,255,0.25);font-weight:700;margin-bottom:5px;}
.nut-mb{font-size:12px;color:rgba(255,255,255,0.65);line-height:1.7;}
.nut-why{background:rgba(184,134,11,0.05);border-left:2px solid #B8860B;padding:8px 12px;border-radius:0 8px 8px 0;margin-bottom:10px;}
.nut-wt{font-size:10px;color:#8B6508;font-weight:700;margin-bottom:3px;letter-spacing:0.5px;}
.nut-wb{font-size:12px;color:rgba(255,255,255,0.65);line-height:1.6;}
.buy-block{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(184,134,11,0.05);border:1px solid rgba(184,134,11,0.18);border-radius:10px;}
.bb-info{flex:1;}

.bb-price{font-size:16px;font-weight:700;color:#D4A017;}

.footer{text-align:center;font-size:11px;color:rgba(255,255,255,0.15);padding:1.5rem 1rem;line-height:1.8;}

  .hero-title{font-size:20px;}
  .buy-block{flex-direction:column;align-items:flex-start;}
  .btn-buy-full{width:100%;text-align:center;}
}

const FILTERS=['全部','認識','語言','身份','世界觀','循環','修正'];
let picked=[],answers={},phase=1;

function initFilters(){
  const ct=document.getElementById('filters');
  FILTERS.forEach((f,i)=>{
    const btn=document.createElement('button');
    btn.className='f-tab'+(i===0?' active':'');
    btn.textContent=f; btn.dataset.f=f;
    btn.onclick=()=>{
      document.querySelectorAll('.f-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active'); renderGrid(f);
    };
    ct.appendChild(btn);
  });
}

function renderGrid(filter){
  const g=document.getElementById('ch-grid'); g.innerHTML='';
  const list=filter==='全部'?CHAPTERS:CHAPTERS.filter(c=>c.cat===filter);
  list.forEach(c=>{
    const card=document.createElement('div');
    card.className='ch-card'+(picked.includes(c.id)?' picked':'');
    card.dataset.id=c.id;
    card.innerHTML=`<span class="ch-icon">${c.icon}</span><div class="ch-num">${c.num}</div><div class="ch-name">${c.name}</div><div class="ch-desc">${c.desc}</div>`;
    card.onclick=()=>toggleCh(c.id,card);
    g.appendChild(card);
  });
}

function toggleCh(id,card){
  const idx=picked.indexOf(id);
  if(idx===-1){picked.push(id);card.classList.add('picked');}
  else{picked.splice(idx,1);card.classList.remove('picked');}
  document.getElementById('pcount').textContent=picked.length+' 已選';
  document.getElementById('btn-next').disabled=picked.length===0;
  updateProg();
}

function go(n){
  document.querySelectorAll('.phase').forEach(p=>p.classList.remove('active'));
  document.getElementById('p'+n).classList.add('active');
  phase=n; updateProg();
  window.scrollTo({top:0,behavior:'smooth'});
}
function updateProg(){
  const p=phase===1?8:phase===2?48:100;
  document.getElementById('prog').style.width=p+'%';
}

document.getElementById('btn-next').onclick=()=>{buildDiag();go(2);};

function buildDiag(){
  const body=document.getElementById('q-body'); body.innerHTML='';
  picked.forEach(id=>{
    const c=CHAPTERS.find(x=>x.id===id);
    const blk=document.createElement('div'); blk.className='q-block';
    blk.innerHTML=`<div class="q-ch-header"><span class="q-ch-icon">${c.icon}</span><span class="q-ch-name">${c.num}：${c.name}</span><span class="q-ch-tag">${c.tag}</span></div>`;
    const ql=document.createElement('div'); ql.className='q-list';
    c.qs.forEach((q,qi)=>{
      const key=id+'_'+qi;
      const item=document.createElement('div'); item.className='q-item';
      const opts=q.opts.map((o,oi)=>`<button class="q-opt" onclick="pickOpt(this,'${key}',${oi})">${o}</button>`).join('');
      item.innerHTML=`<div class="q-text">${q.q}</div><div class="q-opts">${opts}</div>`;
      ql.appendChild(item);
    });
    blk.appendChild(ql); body.appendChild(blk);
  });
}

function pickOpt(btn,key,val){
  btn.closest('.q-opts').querySelectorAll('.q-opt').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel'); answers[key]=val;
}

function calcScore(id){
  const c=CHAPTERS.find(x=>x.id===id);
  let t=0,ct=0;
  c.qs.forEach((_,qi)=>{const k=id+'_'+qi;if(answers[k]!==undefined){t+=answers[k];ct++;}});
  if(!ct)return 70;
  return Math.round(100-(t/ct/3)*78);
}

function showResult(){
  const body=document.getElementById('result-body'); body.innerHTML='';
  const scores=picked.map(id=>({id,score:calcScore(id)}));
  const avg=Math.round(scores.reduce((s,x)=>s+x.score,0)/scores.length);
  const doff=Math.round(251*(1-avg/100));
  const sc=avg>=72?'#1a7a2a':avg>=45?'#B8860B':'#A32D2D';
  const lbl=avg>=72?'人生OS基礎穩固':avg>=45?'人生OS需要升級':'人生OS需要重建';
  const desc=avg>=72?'你的信念系統有一定更新能力，以下方案幫你持續深化':avg>=45?'部分信念模組需要修正，及早介入效果最好':'多個核心信念需要系統性更新，從底層開始';

  body.innerHTML=`
    <div class="result-hero">
      <div class="rh-ring">
        <svg viewBox="0 0 90 90"><circle cx="45" cy="45" r="40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="5"/><circle cx="45" cy="45" r="40" fill="none" stroke="${sc}" stroke-width="5" stroke-dasharray="251" stroke-dashoffset="${doff}" stroke-linecap="round" transform="rotate(-90 45 45)"/></svg>
        <div class="rh-num">${avg}</div>
      </div>
      <div class="rh-title">${lbl}</div>
      <div class="rh-desc">${desc}</div>
    </div>
    <div class="slabel">你現在活在 vs 你可以開始活在</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1.5rem">
      <div style="background:rgba(163,45,45,0.08);border:1px solid rgba(163,45,45,0.2);border-radius:12px;padding:12px">
        <div style="font-size:10px;color:#E87070;font-weight:700;margin-bottom:8px">你曾經活在</div>
        ${['舊信念的自動播放','童年旁白的控制','低維語言的神經訓練','身份標籤的固化','痛苦作為懲罰','高熵循環的重播'].map(s=>`<div style="font-size:11px;color:rgba(255,255,255,0.5);padding:3px 0;border-bottom:1px solid rgba(163,45,45,0.1)">${s}</div>`).join('')}
      </div>
      <div style="background:rgba(26,122,42,0.08);border:1px solid rgba(26,122,42,0.2);border-radius:12px;padding:12px">
        <div style="font-size:10px;color:#6BCF7F;font-weight:700;margin-bottom:8px">你可以開始活在</div>
        ${['有意識的信念更新','成年後自己選擇的聲音','高維語言的神經重建','機制理解的流動','痛苦作為訊號的解讀','看見循環後的選擇'].map(s=>`<div style="font-size:11px;color:rgba(255,255,255,0.5);padding:3px 0;border-bottom:1px solid rgba(26,122,42,0.1)">${s}</div>`).join('')}
      </div>
    </div>
    <div class="slabel">你的信念系統診斷結果</div>
    <div id="ch-results"></div>
  `;

  const container=document.getElementById('ch-results');
  const sorted=[...scores].sort((a,b)=>a.score-b.score);
  sorted.forEach(({id,score})=>{
    const c=CHAPTERS.find(x=>x.id===id);
    const bc=score>=72?'s-hi':score>=45?'s-md':'s-lo';
    const nc=score>=72?'#1a7a2a':score>=45?'#B8860B':'#A32D2D';
    const urg=score<45?'需要重建':score<72?'需要升級':'持續深化';

    const card=document.createElement('div'); card.className='rc';
    card.innerHTML=`
      <div class="rc-header">
        <span class="rc-icon">${c.icon}</span>
        <div class="rc-info">
          <div class="rc-name">${c.num}：${c.name}</div>
          <div class="rc-tag">${c.tag}</div>
        </div>
        <div class="rc-score-area">
          <div style="font-size:10px;background:rgba(${score<45?'163,45,45':score<72?'184,134,11':'26,122,42'},0.12);padding:2px 8px;border-radius:100px;color:${nc};font-weight:700;margin-bottom:3px;text-align:right">${urg}</div>
          <div class="rc-score-num" style="color:${nc}">${score}<span style="font-size:12px;opacity:0.4">/100</span></div>
          <div class="rc-bar-wrap"><div class="rc-bar ${bc}" style="width:0%" data-w="${score}%"></div></div>
        </div>
      </div>
      <div style="padding:0 16px 4px">
        <div class="rtabs" id="tabs_${id}">
          <button class="rtab active" onclick="sw('${id}','edu',this)">📖 教育</button>
          <button class="rtab" onclick="sw('${id}','meth',this)">🛠 方法</button>
          <button class="rtab" onclick="sw('${id}','nut',this)">⚗️ 修復</button>
        </div>
      </div>
      <div class="tab-panel active" id="edu_${id}"></div>
      <div class="tab-panel" id="meth_${id}"></div>
      <div class="tab-panel" id="nut_${id}"></div>
    `;
    container.appendChild(card);

    // EDU
    const edu=card.querySelector('#edu_'+id);
    const vsHtml=c.old_new.map(([o,n])=>`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px">
        <div style="background:rgba(163,45,45,0.06);border:1px solid rgba(163,45,45,0.15);border-radius:8px;padding:8px 10px;font-size:11px;color:rgba(230,130,130,0.8)">${o}</div>
        <div style="background:rgba(26,122,42,0.06);border:1px solid rgba(26,122,42,0.15);border-radius:8px;padding:8px 10px;font-size:11px;color:rgba(107,207,127,0.8)">${n}</div>
      </div>`).join('');
    edu.innerHTML=`
      <div class="core-box"><div class="core-label">核心洞見</div><div class="core-text">${c.core}</div></div>
      <div class="sci-box"><div class="sci-title">🔬 神經科學基礎</div><div class="sci-text">${c.science}</div></div>
      <div class="edu-box">
        <div class="edu-title">功能失調路徑</div>
        <div class="edu-chain">
          ${c.disease_chain.map((s,i)=>`<div class="edu-chain-step ${i===0?'first-step':i===c.disease_chain.length-1?'last-step':''}">${i>0?'<span class="chain-arr">↓</span>':''}<span>${s}</span></div>`).join('')}
        </div>
      </div>
      <div class="update-box"><div class="ub-title">信念更新程式碼</div><div class="ub-text">${c.update}</div></div>
      <div class="edu-box"><div class="edu-title">舊信念 → 更新信念</div>${vsHtml}</div>
      <div class="quote-box"><div class="quote-text">${c.core_quote}</div></div>
    `;

    // METHOD
    const meth=card.querySelector('#meth_'+id);
    meth.innerHTML=`
      <div class="method-steps">
        ${c.methods.map((m,i)=>`<div class="ms-card"><div class="ms-num">${i+1}</div><div class="ms-body"><div class="ms-title">${m.t}</div><div class="ms-desc">${m.d}</div></div></div>`).join('')}
      </div>
      <div class="daily-box">
        <div class="daily-title">每日練習清單</div>
        ${c.daily.map(d=>`<div class="daily-item">✓ ${d}</div>`).join('')}
      </div>
    `;

    // NUT
    const nutP=card.querySelector('#nut_'+id);
    nutP.innerHTML='<div class="nut-list" id="nuts_'+id+'"></div>';
    const nl=nutP.querySelector('#nuts_'+id);
    c.nutrients.forEach((n,ni)=>{
      const nid=id+'_n'+ni;
      const nc2=document.createElement('div'); nc2.className='nut-card';
      nc2.innerHTML=`
        <div class="nut-top" onclick="toggleNut('${nid}')">
          <div class="nut-ico" style="background:${n.bg}">${n.ico}</div>
          <div class="nut-info">
            <div class="nut-name">${n.n}</div>
            <div class="nut-mech">${n.mech}</div>
            <div class="nut-price">${n.price} · ${n.spec}</div>
          </div>
          <span class="nut-exp" id="exp_${nid}">▾</span>
          <a class="nut-cta" href="${SHOP}" target="_blank" rel="noopener" onclick="event.stopPropagation()">購買</a>
        </div>
        <div class="nut-detail" id="${nid}">
          <div class="nut-mbox"><div class="nut-mt">作用機制</div><div class="nut-mb">${n.det}</div></div>
          <div class="nut-why"><div class="nut-wt">為什麼你的信念更新系統現在需要它</div><div class="nut-wb">${n.why}</div></div>
          <div class="buy-block">
            <div class="bb-info">
              <div class="bb-name">${n.n}</div>
              <div class="bb-price">${n.price}</div>
              <div class="bb-spec">${n.spec}</div>
              <div class="bb-store">📦 7-11 賣貨便取貨付款</div>
            </div>
            <a class="btn-buy-full" href="${SHOP}" target="_blank" rel="noopener">立即購買 →</a>
          </div>
        </div>
      `;
      nl.appendChild(nc2);
    });
  });

  go(3);
  setTimeout(()=>{
    document.querySelectorAll('.rc-bar').forEach(b=>{
      b.style.transition='width 1s ease'; b.style.width=b.dataset.w;
    });
  },300);
}

function sw(id,tab,btn){
  ['edu','meth','nut'].forEach(t=>document.getElementById(t+'_'+id).classList.toggle('active',t===tab));
  document.querySelectorAll('#tabs_'+id+' .rtab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function toggleNut(id){
  const el=document.getElementById(id);
  el.classList.toggle('open');
  const exp=document.getElementById('exp_'+id);
  if(exp)exp.textContent=el.classList.contains('open')?'▴':'▾';
}
function restart(){
  picked=[];answers={};
  document.querySelectorAll('.ch-card').forEach(c=>c.classList.remove('picked'));
  document.getElementById('pcount').textContent='0 已選';
  document.getElementById('btn-next').disabled=true;
  go(1);
}

initFilters();
renderGrid('全部');
</script>
</body>
</html>
