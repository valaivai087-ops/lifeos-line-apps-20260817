的源頭。\n\n人到底要“讓”什麼？難道不是讓出自己的執念？因為執念是一切“對立相”的源頭。必須有人先放下執念，才可能重建人與人的連線，才有機會一起從地獄中解脫。", "c": "心靈成長", "k": "你跟伴侶說早安，他沒回，你就想「他不愛我了」，接著難過、評判、生氣，關係越來越糟。這一切都從「亂想」開始。菩薩怕的是「因」（念頭），凡人怕的是「果」（結果）。要讓出的是自己的「執念」，先放下的人，才能重新連結。", "m": ["放下執念", [["劇本", ["發生", "解讀", "情緒", "評判", "投射", "斷連"]], ["根源", ["亂想"]], ["菩薩畏因", ["關照起心動念"]], ["戒", ["不亂想是源頭"]], ["讓", ["讓出執念", "重建連結"]]]], "f": [["事件發生", "對方沒回應"], ["亂想解讀", "他不愛我了"], ["覺察", "這只是我的念頭"], ["放下執念", "不急著評判"], ["重建連結", "關係修復"]], "p": [{"no": "054", "n": "GABA（膠囊）", "pr": "NT$540", "nd": ["睡眠", "情緒", "放鬆"], "w": "GABA 支持放鬆，亂想升起時先穩住情緒。"}, {"no": "028", "n": "心膚精油特價組", "pr": "NT$1200", "nd": ["情緒", "放鬆", "肌膚"], "w": "心膚精油組營造溫柔氛圍，幫助重建連結。"}], "a": [{"no": 96, "n": "婚姻系統", "u": "https://valaivai087-ops.github.io/marriage/", "cat": "關係／婚姻／溝通 / 關係", "w": "婚姻系統處理伴侶間的誤解與執念。"}, {"no": 98, "n": "關係 OS", "u": "https://membership-app-e2147.web.app/lifeos/relationship-os.html", "cat": "關係／婚姻／溝通 / 關係", "w": "關係 OS 練習先放下執念、重建連結。"}]}, {"id": 125, "t": "判斷力比怒力更重要，這句話太太太受用了！", "d": "6/18/2025", "g": [], "b": "真正聰明的人，從不走捷徑。\n\n如果想賺儘可能多的錢，如果想以一種可預測的方式致富，就要走在時代的最前沿，學習科技、學習設計、學習藝術，成為行業的翹楚。\n\n把時間花在省錢上是不會致富的。省出時間來賺錢才是正確的思路。\n\n努力的作用被大大高估了。在現代經濟中，工作的努力程度並沒有那麼重要。\n\n那麼什麼被低估了？判斷力。判斷力被低估了。\n\n納瓦兒說：知道個人行為的長期後果，用於解決外部問題的智慧其實就是判斷能力。或者說，智慧和判斷力是高度關聯的，一個智慧而富有判斷力的人，首先要知道個人的長期行為的後果，然後做出正確的決策並付諸實踐。\n\n時間的投入是必需的，大事難判斷力更重要。在前進的過程中，方向比速度更重要，特別是運用了槓桿以後。在每個岔路口選對方向，其重要程度遠遠超過前進的努力程度。人生就是選擇正確的方向，然後朝這個方向奮力前行。\n\n要直面現實，就要放下自我，消除自我意識，忘記自我判斷，平復自我情緒。人雖然是高階動物，大事難情緒化的自我意識的存在會帶來反芻式思維，讓一些慾望矇蔽我們的雙眼，讓我們看不清現實，從而讓我們對“世界應該怎樣”妄下判斷。\n\n阻礙我們看清現實的最大因素是我們對現實“應有的樣子”有先入為主的印象。\n\n痛苦時刻的一個定義是：當你看到事物的這面目不是你本來想的樣子時，你是痛苦的。\n\n但痛苦的時刻就是真相大白的時刻。只有處於痛苦之中，你才hi被迫接受現實，而只有接受現實，你才能做出有意義的改變，取得有意義的進步。由此可見，只有實事求是，才能不斷改進，不斷前行。\n\n難點在於看清真相。要看清真相，就必須擺脫自我，因為自我不想面對真相。自我越弱小，對自己反應的限制越少，對自己想要的結果的執念越低，就越容易看清現實。", "c": "財富思維", "k": "納瓦爾說：努力被高估，判斷力被低估。判斷力就是「知道一件事長期會怎樣」，然後做對選擇。方向比速度重要。要看清現實，就要放下自我、情緒和「世界應該怎樣」的想法；痛苦的時候正是看見真相、開始改變的時候。", "m": ["判斷力>努力", [["不走捷徑", ["走在前沿"]], ["省時間>省錢", ["省時間賺錢"]], ["判斷力", ["知長期後果", "做對決策"]], ["方向>速度", ["尤其用槓桿時"]], ["看清現實", ["放下自我", "痛苦=真相"]]]], "f": [["面對抉擇", "岔路口"], ["放下自我與情緒", "不預設"], ["評估長期後果", "判斷力"], ["選對方向", "再全力前進"], ["持續修正", "實事求是"]], "p": [{"no": "042", "n": "清思油滴35ml（迷迭香精油＋EPA魚油）", "pr": "NT$450", "nd": ["腦神經", "專注", "情緒"], "w": "清思油滴支持專注與清晰判斷。"}, {"no": "054", "n": "GABA（膠囊）", "pr": "NT$540", "nd": ["睡眠", "情緒", "放鬆"], "w": "GABA 支持放鬆，放下情緒才看得清現實。"}], "a": [{"no": 118, "n": "預測系統", "u": "https://membership-app-e2147.web.app/lifeos/prediction-system.html", "cat": "模型／系統／決策 / 預測", "w": "預測系統建立判斷長期後果的框架。"}, {"no": 124, "n": "生命 OS 決策樹", "u": "https://membership-app-e2147.web.app/platform/model-decision/life-os-decision-tree.html", "cat": "模型／系統／決策 / 模型決策", "w": "生命 OS 決策樹在岔路口選對方向。"}]}, {"id": 126, "t": "青春一去不復返！我醒悟了！這本書讓我成長了", "d": "6/16/2025", "g": [], "b": "人生旅程有時順風順水，有時驚濤駭浪，生活總會以自己的方式繼續，而每個人的旅程體驗主要取決於自己的解讀。生而為人，我們擁有三觀五感、七情六慾，最後與世長辭。\n\n怒氣衝衝、情緒激動帶來完全不必要的嚴重後果。學會從長計議，減少不必要的憤怒情緒。\n\n如果可以從長遠角度冷靜地客觀看待問題，很多問題其實不是問題。\n\n習慣就是一切，主導我們的一切行為和思維方式。\n\n習慣成自然，這些習慣在我們的潛意識裡不間斷地執行，而大腦皮質只會留出一點點思考力來應對新問題。我們終究會成為自己的習慣。\n\n想要擁有內心的平靜，必須先擁有身體的平靜。\n\n堅持鍛鍊讓我看到了習慣的力量。習慣的養成和擯棄都需要時間。\n\n一切存在時刻處於一種內部變革的狀態。人應當時刻準備好迎接徹底的改變。\n\n說“打算”，就是在拖延，就是在給自己找藉口。\n\n有想法就直接下去行動，就是這麼簡單。\n\n迅速採取行動，並對結果保持耐心。\n\n需要做，就去做，還等什麼呢？生命的場合奔騰不止，青春一去不復返。不要浪費時間拖延等待，不要浪費時間躊躇徘徊。每個人都有自己的使命，不要浪費時間做不屬於自己人生使命的事情。\n\n一旦決定去做，就要迅速採取行動，並全神貫注，全力以赴。同時，要對結果保持耐心，因為你唯一能把握的只有自己，他人和外界環境那麼紛繁複雜、充滿變數。\n\n一旦採取行動，就要速戰速決，但等待結果要從容沉著。\n\n要建立系統，而不是設定目標。\n\n當前的環境會塑造大腦，但是聰明的大腦也可以選擇和塑造未來的環境。\n\n盡力透過最高性的方式成為最成功的自己。\n\n如果有什麼事情你以後想做的，現在就去做，人生沒有“以後”。\n\n但要從生活中獲得回報，你需要做的並不是合群，而是從人群中脫穎而出。\n\n要想不借助自律而實現自我提升，你需要更新自我形象。\n\n流血流汗，埋頭苦幹，直面困難，這些都是一夜成名的必經之路。", "c": "自我成長", "k": "青春不會回來！不要為小事暴怒，從長遠看很多問題都不是問題。我們最後會變成自己的習慣。想內心平靜，先讓身體平靜（運動）。說「打算」就是拖延，有想法就去做，快點行動、慢慢等結果。要建立系統，而不是只訂目標。", "m": ["青春不復返", [["情緒", ["減少憤怒", "從長計議"]], ["習慣", ["我們成為習慣"]], ["身體", ["身體平靜→內心平靜"]], ["行動", ["打算=拖延", "迅速行動耐心等果"]], ["系統", ["建立系統>設目標", "更新自我形象"]]]], "f": [["有想法", "不說打算"], ["立刻行動", "全力以赴"], ["建立系統", "每天固定做"], ["耐心等結果", "從容沉著"], ["成為習慣", "成為更好的自己"]], "p": [{"no": "034", "n": "胺基酸可可粉包", "pr": "NT$780", "nd": ["肌肉", "能量"], "w": "胺基酸可可粉支持肌肉與運動，「先讓身體平靜」的運動好夥伴。"}, {"no": "098", "n": "粒線寶（膠囊）", "pr": "NT$550", "nd": ["粒線體", "能量", "恢復"], "w": "粒線寶支持能量，迅速採取行動。"}], "a": [{"no": 37, "n": "自律模型 60 項", "u": "https://membership-app-e2147.web.app/platform/self-discipline-action/self-discipline-model-60-bilingual.html", "cat": "英文／語言學習 / 自律行動", "w": "自律模型 60 項建立系統而不是只訂目標。"}, {"no": 36, "n": "拖延模型 60 項", "u": "https://membership-app-e2147.web.app/platform/self-discipline-action/procrastination-model-60-bilingual.html", "cat": "英文／語言學習 / 自律行動", "w": "拖延模型 60 項破解「打算＝拖延」。"}]}, {"id": 127, "t": "救贖靠自己。我讀出了深深的孤獨感。😭", "d": "6/13/2025", "g": [], "b": "醫生不能讓你健康。\n\n營養學家不能讓你苗條。\n\n老師不能讓你變聰明。\n\n禪師不能讓你冷靜。\n\n智者不能讓你富有。\n\n教練不能讓你健壯。\n\n最終，你自己負起責任。\n\n救贖靠自己。\n\n你唯一應該做的事，是你自己想做的事。別人總希望你以特定的方式做事，但如果不再費心去揣摩別人的期待，你就能聽見自己腦海中那個微弱的聲音。那個聲音代表了你真實的想法。傾聽它，你就可以做自己了。\n\n做自己，全情投入、義無反顧地做自己。\n\n在“做自己”這件事上，沒有人能與你競爭。\n\n做人要虛心傾聽，但不要盲目模仿。模仿別人純屬徒勞。相反，每個人都有獨一無二的資質技能、專業知識、能力才幹、個人慾望，這些是世界上其他人沒有的，是先天基因和後天經驗共同作用的結果。\n先天基因和後天經驗組合會造就個體驚人的獨特性。沒有任何兩個個體互相替代。\n\n你的人生目標是找到最需要你的人、事業、專案或藝術。大千世界，芸芸眾生，總有一些人和事會與你完美契合。\n\n如果你現在選擇一條容易的路，那麼你的未來會變得更加艱難。", "c": "自我成長", "k": "醫生、營養師、老師、教練都不能替你變健康、變瘦、變聰明、變強壯，最後要靠自己負責。做自己想做的事，聽見心裡那個小小的聲音。每個人都是獨一無二的，不用模仿別人。找到最需要你的人和事。現在選容易的路，未來會更難。", "m": ["救贖靠自己", [["自己負責", ["醫生營養師老師教練都不能代替"]], ["做自己", ["傾聽內心聲音", "不揣摩期待"]], ["獨特性", ["先天+後天", "無法替代"]], ["人生目標", ["找到最需要你的"]], ["選擇", ["容易的路→未來更難"]]]], "f": [["停止依賴", "不等別人救"], ["傾聽內心", "我想做什麼"], ["負起責任", "從今天開始"], ["選困難的路", "短期辛苦"], ["成為自己", "未來更容易"]], "p": [{"no": "071", "n": "王牌粉（12g×30包）", "pr": "NT$2000", "nd": ["正常發炎調節", "抗氧化", "免疫"], "w": "王牌粉建立固定的自我照顧習慣，健康自己負責。"}, {"no": "034", "n": "胺基酸可可粉包", "pr": "NT$780", "nd": ["肌肉", "能量"], "w": "胺基酸可可粉支持運動，選擇困難的路也有體力。"}], "a": [{"no": 39, "n": "身分 OS 雙語 APP", "u": "https://membership-app-e2147.web.app/platform/life-system/identity-os-bilingual-app.html", "cat": "英文／語言學習 / 生命系統", "w": "身分 OS 雙語 APP 支持做自己。"}, {"no": 15, "n": "靈魂重建雙語 APP", "u": "https://membership-app-e2147.web.app/lifeos/soul-reconstruction-bilingual-app.html", "cat": "英文／語言學習 / 心理", "w": "靈魂重建雙語 APP 陪你度過孤獨、自我救贖。"}]}, {"id": 128, "t": "好習慣太太太重要了。好習慣狠狠的培養起來", "d": "6/12/2025", "g": [], "b": "基本上你可以從生活中得到自己想要的一切，但前提是，你的目標只有一個，而且你對這件事的渴望超過其他一切。\n\n平和是靜態的幸福，幸福是動態的平和。\n\n人們以為，獲得平和心境的方式是解決所有的外部問題。但外部問題是無窮無盡的。\n\n因此，獲得內心平靜的唯一方式是摒棄“問題”這個概念。\n\n嫉妒是幸福最大的敵人。生活本身沒有那麼難，是我們把生活變難了。\n\n當“應該”在腦海中出現時，其背後隱藏的是負罪感或社會規訓。如果一件事情是因為“應該”，那就表示你內心是不想這麼做的，而違背自己的心意會讓你變得痛苦不堪。\n\n內心平和的敵人是社會和其他人灌注給你的期望。\n\n訓練自己獲得幸福感完全是內在的，不需要外界評判你的進展，認可你的結果。你是在跟自己競爭，這是一場單人遊戲。\n\n生活就是一場單人遊戲。人獨自死亡，獨自解讀人世間的一切。你的記憶只屬於你一個人。你出生前無人在意，你離開人世後也無人在意，你存在於人世間只是短短幾十年，人生就是一場單人遊戲。\n\n嫉妒是一種有害的情緒，因為歸根到底，它並不能改善你的生活，只會讓你不快樂，而你嫉妒的那個人仍然是成功的、美麗的，仍然擁有你所嫉妒的一切。\n\n直到有一天，“我”意識到，“我”嫉妒別人，只是嫉妒他們的某些方面，而我不可能只擁有我嫉妒的那些東西。“‘我”不能只想要那個人的身材、財富或個性。如果要交換人生，“我”就必須接受對方全部的人生，包括他的反應、慾望、家庭、幸福感、人生觀、自我形象等各個方面。你可以接受嗎？如果你不願意與別人進行百分之百的交換，嫉妒毫無意義。\n\n獲取平和與幸福是一種技能，這種技能不是與生俱來的。個體可以突破環境的塑造，主動進行自我重塑。\n\n從本質上講，生活的過程就是用精心培養的好習慣替換那些在不經意間養成的壞習慣，努力成為一個更幸福的人。你的幸福指數最終取決於你的習慣和你花最多的時間與之相處的人。", "c": "自我成長", "k": "平靜是靜態的幸福，幸福是動態的平靜。外面的問題永遠解決不完，所以要放下「問題」這個概念。嫉妒是幸福最大的敵人：你不可能只拿別人的優點，要換就得換整個人生。說「應該」時，其實是不想做。生活是單人遊戲，幸福是可以練習的技能，靠好習慣。", "m": ["幸福是技能", [["平和與幸福", ["靜態的幸福", "動態的平和"]], ["放下問題", ["外部問題無窮"]], ["嫉妒", ["要換就換全部人生"]], ["應該", ["隱藏負罪感"]], ["單人遊戲", ["和自己競爭", "好習慣決定幸福"]]]], "f": [["察覺壞習慣", "嫉妒、應該"], ["放下比較", "生活是單人遊戲"], ["培養好習慣", "刻意替換"], ["選擇相處的人", "影響幸福指數"], ["幸福成為技能", "越練越熟"]], "p": [{"no": "071", "n": "王牌粉（12g×30包）", "pr": "NT$2000", "nd": ["正常發炎調節", "抗氧化", "免疫"], "w": "王牌粉作為每天固定的好習慣。"}, {"no": "028", "n": "心膚精油特價組", "pr": "NT$1200", "nd": ["情緒", "放鬆", "肌膚"], "w": "心膚精油組陪你練習平和與幸福。"}], "a": [{"no": 37, "n": "自律模型 60 項", "u": "https://membership-app-e2147.web.app/platform/self-discipline-action/self-discipline-model-60-bilingual.html", "cat": "英文／語言學習 / 自律行動", "w": "自律模型 60 項用好習慣替換壞習慣。"}, {"no": 61, "n": "人性系統", "u": "https://membership-app-e2147.web.app/lifeos/human-nature-system.html", "cat": "情緒心理／信念療癒 / 心理", "w": "人性系統理解嫉妒與「應該」背後的心理。"}]}, {"id": 129, "t": "關於幸福，這篇文章寫的太太太通透了。牛掰", "d": "2025-06-11", "g": [], "b": "探索自己對幸福的定義非常重要。\n\n人類具有高度主觀意識和繁殖機器，會一刻不停地對周圍的一切做出評判。我們不斷地接收和判斷周圍的資訊，想著“我需要這個”或者“我需要那個”，深陷慾望之網，難以自拔。而幸福是一種毫無缺憾感的充盈狀態。當感到生命中並不缺少什麼時，大腦就會處於休眠狀態，不再追憶昨天，也不再暢想明天，不會悔不當初，也不會謀求未來。\n\n歸根到底，萬物皆有二元性和極性。如果我說一個人有魅力，意思就是其他人沒有魅力。每一個積極的想法都有一個消極想法的種子蘊含其中，反之亦然，這就是為什麼生命的偉大在很大程度上源於苦難。人必須先看到消極的一面，才能憧憬和欣賞積極的一面。\n\n幸福是一種無慾無求的狀態，特別是對外界事物的慾望。慾望越少，越能接受事物的當前狀態，頭腦越平靜。所謂“萬般煩惱皆因心動”，都是頭腦在一刻不停地設計未來或追憶過去。\n\n世界只是折射個人感受的一面鏡子。現實是中性的，現實不做評判。一棵樹沒有對與錯好與壞的觀念。人生在世，我們從大千世界中獲得各種各樣的感官體驗和刺激。至於如何思考、判斷和對待你所感知的一切，全由你自己決定——選擇權在你手上。\n\n如果你把自己看成一個細菌或變形蟲，把自己畢生的努力都看成在水上寫字、在沙灘上建城堡，你就不會對生活“本來該有”的模樣抱有期待。生活就是這樣，現實就是如此。接受了這一點，就無所謂幸福不幸福。“幸福”並不是一種客觀的存在，而是一種主觀感受。\n\n人生轉瞬即逝，如黑夜中的螢火蟲。塵世光陰等剎那，白駒過隙一瞬間。活著就是要充分利用每一分鐘。“充分利用”不是說要窮盡所有時間去追逐一些愚蠢的慾望，而是認識到自己在這個星球上的每一分每一秒都是非常寶貴的。生而為人，就有責任確保自己的幸福，確保用最好的方式詮釋萬物。\n\n我們認為江山易改，本性難移，但事實是，我們是可塑的，而世界基本上是固定不變的。", "c": "心靈成長", "k": "要先想清楚自己的幸福是什麼。大腦一直評判「我需要這個那個」，所以不快樂。幸福是覺得什麼都不缺的平靜。世界像一面鏡子，本身沒有好壞，怎麼看由你決定。不要對生活「應該怎樣」有太多期待。人是可以改變的，世界大致不變。", "m": ["幸福通透", [["定義", ["探索自己的幸福"]], ["慾望之網", ["我需要⋯"]], ["二元性", ["好壞相生"]], ["鏡子", ["現實中性", "選擇權在你"]], ["可塑", ["我們會變", "世界不變"]]]], "f": [["探索", "我的幸福是什麼"], ["減少慾望", "少評判"], ["接受現實", "不期待應該"], ["珍惜每分鐘", "不追逐愚蠢慾望"], ["重塑自己", "幸福是主觀感受"]], "p": [{"no": "028", "n": "心膚精油特價組", "pr": "NT$1200", "nd": ["情緒", "放鬆", "肌膚"], "w": "心膚精油組營造平靜感，幫助放下慾望。"}, {"no": "054", "n": "GABA（膠囊）", "pr": "NT$540", "nd": ["睡眠", "情緒", "放鬆"], "w": "GABA 支持放鬆，讓頭腦不再一刻不停地評判。"}], "a": [{"no": 49, "n": "智慧 APP", "u": "https://membership-app-e2147.web.app/lifeos/wisdom-app.html", "cat": "基督信仰／靈性智慧 / 智慧", "w": "智慧 APP 探索自己對幸福的定義。"}, {"no": 50, "n": "靈性 APP 完整版", "u": "https://membership-app-e2147.web.app/lifeos/spiritual-app-complete.html", "cat": "基督信仰／靈性智慧 / 靈性", "w": "靈性 APP 完整版延伸內心平和練習。"}]}, {"id": 130, "t": "關於頂級努力，這本書簡直太太太太太太絕了", "d": "6/10/2025", "g": [], "b": "成功人士和非成功人士只有毫釐之差。關鍵在於，當遭遇前所未見、如同絕壁一般的巨大障礙時，在那一瞬間，能不能對自己說“一定能跨越”，並走出第一步；敢不敢想“是我的話，一定能攀登”。\n\n“可能跨不過去吧”，這時候，只要這麼一點點躊躇和猶豫，腿腳就會癱軟，導致無法攀登。即使過後拼命給自己打氣，也只能是馬後炮了。就這一步之差，命運就迥然不同。所以，首先要堅定地相信自己“能行”，相信，光明的未來必定會到來。同時，迎頭碰見困難這一壁障，不氣餒，不放棄，正面對抗。\n\n帶著這樣的強大心靈不斷前進時，我們逐漸就能看到以前完全看不到的道路前進，理清走向成功所需要的種種線索，曾經看起來遠在天邊的成功，不知不覺間變得唾手可得。\n\n一兩次碰壁就打退堂鼓，那怎麼行？不管看起來眼前矗立的壁障有多麼高，首先要想“一定能跨越”。如果用手觸控一下，搞不好就會發現這個壁壘不是石頭砌成的，而是紙糊的。如果時紙糊的，戳破它就行了；如果時石頭做的，只要思考如何攀登就可以了。\n\n“覺得不行的時候才是開始”。這因為情況困難，所以才要相信局面必能開啟，一味向前，這時候，命運之門就會開啟。\n\n立誓“無論如何，一定要成功”。\n\n成功的秘訣，答案只有一個，就是“永不放棄”。\n\n即使遭遇未曾預料的艱難險阻，即使已經被困難擊倒、感到絕望，也要能奮力爬起，拍拍灰塵，繼續朝著成就事業的方向，鎮定地、反覆不斷地發起努力。人必須具備這種不達目的誓不罷休的決心和永不放棄的精神。\n\n要有水滴石穿般的決心。對於巨大且堅硬的岩石來說，一滴水根本算不了什麼，但只要水滴無休無止，最終也能洞穿岩石。帶著如此強烈的意志持續努力，不管做什麼事業，都一定能“殺出一條血路”。\n\n人的一切行動，都產生於“願望”或者說“想法”，如果不“想”，任何事情都不可能在現實中出現。\n\n只要懷抱強烈的願望，並讓這種願望持續，那麼，即使當時被認為根本不可能做到的事情，最終也能變為現實。\n\n如果設定了高目標，並且真的想要達成的話，就必須懷抱“無論如何非實現不可”的強烈願望，必須懂得，這種願望中，蘊含著成就事物的偉大力量。", "c": "心靈成長", "k": "成功和不成功的人只差一點點：碰到像牆一樣的大困難時，能不能馬上說「我一定能跨過去」並踏出第一步。一猶豫，腳就軟了。牆摸摸看說不定是紙做的！「覺得不行的時候才是開始」。永不放棄、像水滴穿石、心裡要有「無論如何一定要做到」的強烈願望。", "m": ["頂級努力", [["毫釐之差", ["那一瞬間相信能跨越"]], ["猶豫", ["腿腳癱軟"]], ["牆的真相", ["可能是紙糊的"]], ["覺得不行時", ["才是開始"]], ["強烈願望", ["無論如何非實現不可", "水滴石穿"]]]], "f": [["遇到絕壁", "巨大障礙"], ["那一瞬間", "說一定能跨越"], ["踏出第一步", "不猶豫"], ["持續努力", "水滴石穿"], ["命運之門開啟", "成功"]], "p": [{"no": "090", "n": "人參皂苷複方（膠囊）", "pr": "NT$560", "nd": ["體力", "循環", "適應力"], "w": "人參皂苷複方支持體力與適應力，跨越絕壁需要續航力。"}, {"no": "098", "n": "粒線寶（膠囊）", "pr": "NT$550", "nd": ["粒線體", "能量", "恢復"], "w": "粒線寶支持能量，水滴穿石般持續努力。"}], "a": [{"no": 107, "n": "高主動性 OS", "u": "https://membership-app-e2147.web.app/platform/ability-building/high-agency-os-complete.html", "cat": "能力養成／自律行動 / 能力養成", "w": "高主動性 OS 培養「一定能跨越」的主動姿態。"}, {"no": 37, "n": "自律模型 60 項", "u": "https://membership-app-e2147.web.app/platform/self-discipline-action/self-discipline-model-60-bilingual.html", "cat": "英文／語言學習 / 自律行動", "w": "自律模型 60 項讓永不放棄有方法。"}]}, {"id": 131, "t": "納瓦兒的財富思維，太受用了。推薦讀這本書", "d": "6/9/2025", "g": [], "b": "z錢不是一件想做就能做的事情，而是一門需要學習的技能。\n\n賺錢跟工作的努力程度沒什麼必然的聯繫。即使每週在餐廳拼命工作８０個小時，也不可能發財。要想獲得財富，你就必須知道要做什麼、和誰一起做、什麼時候做。與埋頭苦幹相比，更重要的是理解和思考。當然，努力非常重要，不能吝嗇自己的努力，但必須選擇正確的最方式。\n如果你還不知自己應該做什麼，那麼你先要弄清楚這個問題。在這之前，不要盲目發力。\n\n追求財富而不是金錢和地位。財富是指在你睡覺時仍然為你賺錢的資產。金錢是我們轉換時間和財富的方式。\n\n依靠出租時間是不可能致富的。你必須擁有股權，才能實現財務自由。\n\n獲得財富的一個途徑，就是為社會提供有其有需求但無從獲得的東西，並實現規模化。\n\n培養迭代思維。生活中所有的回報，無論是財富、人際關係，還是知識，都來自複利。\n\n用專長、責任感和槓桿效應武裝自己。\n\n專長指的是無法透過培訓獲得的知識。如果社會可以培訓你，那麼社會也可以培訓他人來取代你。\n\n專長是一個人個性和身份的有機組成部分。一旦找到自己天生喜歡和擅長的領域，你就可以朝著這個方向持續前進。\n\n判斷力是從經驗中來，但可以透過學習基本技能快速建立起來。\n\n設定一個大膽的個人時薪，並嚴格執行。如果解決一個問題節省的成本低於時薪，那就忽略問題；如果外包一項任務的成本低於時薪，那就選擇外包。\n\n工作需要拼盡全力，毫無保留。不過，共事的人和工作內容比努力程度更重要。\n\n把自己產品化。“自己”據喲獨特性，“產品化”是發揮槓桿效應；“自己”具有責任感，“產品化”需要專長。\n\n如果想實現致富的長期目標，你就應該問問自己：“這是我真正需要的東西嗎？我的規劃目標是我真正想要的嗎？”得到肯定的答案後，再問問自己：“我實現產品化了嗎？我實現規模了化了嗎？我選擇規模的方式是勞動力、資本，還是程式碼或媒體？”\n\n如果想要變得富有，你就要弄清楚你能為社會提供哪些其有需要求但無從獲得的東西，而提供這些東西對你來說又是輕鬆自然的事情，在你的技術和能力範圍內。", "c": "財富思維", "k": "賺錢是一門可以學的技能，不是靠拚命加班。要知道做什麼、跟誰做、什麼時候做。追求財富（睡覺也會賺錢的資產），要擁有股份，靠出租時間很難致富。用專長、責任感和槓桿武裝自己。設定一個「自己的時薪」，便宜過時薪的事就外包或忽略。", "m": ["納瓦爾財富思維", [["賺錢", ["是技能", "理解思考>苦幹"]], ["財富", ["睡覺也賺錢", "擁有股權"]], ["三武器", ["專長", "責任感", "槓桿"]], ["複利", ["財富人際知識"]], ["個人時薪", ["低於時薪就外包"]]]], "f": [["學會賺錢技能", "先想清楚做什麼"], ["累積專長", "別人無法培訓取代"], ["承擔責任", "擁有股權"], ["運用槓桿", "規模化"], ["設定時薪", "聚焦高價值事"]], "p": [{"no": "042", "n": "清思油滴35ml（迷迭香精油＋EPA魚油）", "pr": "NT$450", "nd": ["腦神經", "專注", "情緒"], "w": "清思油滴支持專注與判斷力。"}, {"no": "001", "n": "防藍光護目鏡", "pr": "NT$200", "nd": ["眼睛", "光傷害", "視覺疲勞"], "w": "長時間電腦工作保護眼睛，提高高價值工作時段。"}], "a": [{"no": 120, "n": "複利模型 APP", "u": "https://membership-app-e2147.web.app/lifeos/compound-model-app.html", "cat": "模型／系統／決策 / 模型", "w": "複利模型 APP 看懂財富、人際與知識的複利。"}, {"no": 3, "n": "經濟學知識掌握系統", "u": "https://membership-app-e2147.web.app/lifeos/economics-knowledge-mastery.html", "cat": "會員／商業經濟 / 商業", "w": "經濟學知識掌握系統補強財富思維的經濟基礎。"}]}, {"id": 132, "t": "我命由我不由天，你可以成為任何人！厲害了", "d": "6/5/2025", "g": [], "b": "要麼現在做，要麼永遠沒有機會去做。\n\n你要麼接受命運的擺佈，要麼走出來，做命運的強者。你可以成為開創者，你也可以成為一個有遠見的人。是的，你可以成為任何人，一切都是我們的選擇。因此，我們可能對已經發生的事情無能為力，但是我們卻可以選擇如何回應，你的回應在周圍形成能量。\n\n最終完成你想做的事情，成為你想要成為的樣子，並幫助別人做到這樣，這種滿心歡喜是無與倫比的。就像能量對周圍的影響一樣，你對外界的反應也能創造或耗費你的時間，這決定了你在哪兒，你是誰，你想成為誰。\n\n你可以圍繞身份和時間，以及能量和行動，以兩種不同的方向，有效地改變或決定你的人生。①確定你想成為誰。②從這個身份出發立即行動。\n\n“我想成為誰”與“我是誰”是兩種完全不同的人生姿態，早就了兩種截然不同的人生。\n\n“我想”或“我是”是一種選擇，而不是終點。\n\n你工作的真正目的是什麼？\n\n目的因超越了你的各種目標，它是你最開始制定這些目標的理由。你肯定不是為了工作而工作，是為了別的理由而工作。\n\n目的因是原因，是你為什麼要做一件事情的興趣所在，是你對事情結果的期望，是你對未來最美好的想像。\n\n目的因不僅僅是目標的目標——它超越了目標的有效率的生活方式。\n\n目的因是成功後的成功。目的因是將時間花在價值上。目的因是重新檢視與目標一致的承諾。\n\n目的因就是最終的目的。\n\n有目的地是生活，你的夢想就會觸手可及。\n\n你的目的是有更多的時間陪伴家人，但是你夢想中的自由還需要５年的時間才能實現。而那時，你現在１３歲的孩子已經年滿１８歲離開家了。所以，你要怎麼做，才能在此時此刻就能得到你想要的自由生活呢？答案就是一開始把夢想和實現夢想的可用時間融入商業模式中。", "c": "自我成長", "k": "要嘛現在做，要嘛永遠沒機會。發生的事我們改變不了，但可以選擇怎麼回應。改變人生兩步：1.決定你想成為誰；2.用那個身分馬上行動。「目的因」就是你做一切事情最根本的原因，例如想多陪家人，就不要等5年後，現在就把它放進你的工作安排裡。", "m": ["我命由我", [["選擇", ["做命運的強者", "選擇如何回應"]], ["兩步驟", ["確定想成為誰", "從身分出發行動"]], ["我想成為vs我是", ["兩種人生姿態"]], ["目的因", ["目標的目標", "最終的目的"]], ["例子", ["陪伴家人不等5年"]]]], "f": [["問目的因", "我為什麼工作？"], ["確定身分", "我想成為誰"], ["立即行動", "以那個身分做事"], ["融入現在", "把夢想放進工作模式"], ["成為任何人", "滿心歡喜"]], "p": [{"no": "098", "n": "粒線寶（膠囊）", "pr": "NT$550", "nd": ["粒線體", "能量", "恢復"], "w": "粒線寶支持能量，從新身分出發立即行動。"}, {"no": "042", "n": "清思油滴35ml（迷迭香精油＋EPA魚油）", "pr": "NT$450", "nd": ["腦神經", "專注", "情緒"], "w": "清思油滴支持專注，想清楚你的「目的因」。"}], "a": [{"no": 39, "n": "身分 OS 雙語 APP", "u": "https://membership-app-e2147.web.app/platform/life-system/identity-os-bilingual-app.html", "cat": "英文／語言學習 / 生命系統", "w": "身分 OS 雙語 APP 確定「我想成為誰」。"}, {"no": 110, "n": "改寫人生系統", "u": "https://valaivai087-ops.github.io/rewritelife/", "cat": "模型／系統／決策 / 人生", "w": "改寫人生系統做命運的強者。"}]}, {"id": 133, "t": "又重溫了一遍，太受用了。請堅持，直到成功", "d": "6/4/2025", "g": [], "b": "堅持不懈，直到成功。生命的獎賞遠在旅途終點，而非起點附近。我不知道要走多少步才能達到目標，踏上第一千步的時候，仍然可能遭到失敗。但成功就藏在拐角後面，除非拐了彎，我永遠不知道還有多遠。再前進一步，如果沒有用，就再向前一點。事實上，每次進步一點點並不太難。\n\n堅持不懈，直到成功。從今往後，我承認每天的奮鬥就像對參天大樹的一次砍擊，頭幾刀可能了無痕跡。每一擊看似微不足道，然而，累積起來，巨樹終會倒下。這恰如我今天的努力。就像沖洗高山的雨滴，吞噬猛虎的螞蟻，照亮大地的星辰，建起金字塔的努力，我也要一磚一瓦地建造起自己的城堡，因為我深知水滴石穿的道理，只要持之以恆，什麼都可以做到。\n\n堅持不懈，直到成功。我決不考慮失敗，我的字典裡不再有放棄、不可能、辦不到、沒法子、成問題、失敗、行不通、沒希望、退縮．．這類愚蠢的字眼。我要儘量避免絕望，一旦受到它的威脅，立即想方設法向它挑戰。我要辛勤耕耘，忍受苦楚。我放眼未來，勇往直前，不再理會腳下的障礙。我堅信，沙漠的盡頭必是綠洲。\n\n堅持不懈，直到成功。我要嘗試，嘗試，再嘗試。障礙是我成功路上的彎路，我迎接這項挑戰。我要像水手一樣，乘風破浪。\n\n堅持不懈，直到成功。從今往後，我要借鑑別人成功的秘訣。過去的是非成敗，我全不計較，只抱定信念，明天會更好。當我精疲力竭時，我要抵制回家的誘惑，再試一次。我一試再試，爭取每一天的成功，避免以失敗收場。我要為明天的成功播種，超過那些按部就班的人。在別人停滯不前時，我繼續拼搏，終有一天我會豐收。\n\n #", "c": "心靈成長", "k": "堅持到成功！成功藏在轉角後面，不轉過去永遠不知道還有多遠。每天的努力像砍大樹，前幾刀看不出來，但累積起來樹會倒。不要說「不可能」「辦不到」。障礙只是彎路。累了想回家時，再試一次。", "m": ["堅持直到成功", [["獎賞在終點", ["成功在轉角"]], ["累積", ["砍大樹", "一磚一瓦"]], ["禁用詞", ["放棄", "不可能", "辦不到"]], ["障礙", ["是彎路", "像水手乘風破浪"]], ["再試一次", ["抵制回家誘惑"]]]], "f": [["設定目標", "踏上旅程"], ["每天一刀", "進步一點點"], ["遇障礙", "當作彎路"], ["精疲力竭", "再試一次"], ["豐收", "終會成功"]], "p": [{"no": "090", "n": "人參皂苷複方（膠囊）", "pr": "NT$560", "nd": ["體力", "循環", "適應力"], "w": "人參皂苷複方支持體力，精疲力竭時再試一次。"}, {"no": "039", "n": "大補王", "pr": "NT$1560", "nd": ["體力", "恢復", "免疫"], "w": "大補王支持恢復，跌倒後更快站起來。"}], "a": [{"no": 37, "n": "自律模型 60 項", "u": "https://membership-app-e2147.web.app/platform/self-discipline-action/self-discipline-model-60-bilingual.html", "cat": "英文／語言學習 / 自律行動", "w": "自律模型 60 項讓每天進步一點點。"}, {"no": 11, "n": "批評轉能力雙語版", "u": "https://membership-app-e2147.web.app/lifeos/criticism-to-ability-bilingual.html", "cat": "英文／語言學習 / 能力", "w": "批評轉能力雙語版把障礙轉成成功的彎路。"}]}, {"id": 134, "t": "立刻行動！立刻行動！立刻行動！記住這句話", "d": "6/2/2025", "g": [], "b": "我現在就付諸行動。\n\n立刻行動！立刻行動！立刻行動！從今往後，我要一遍又一遍，每時每刻重複這句話，直到成為習慣，好比呼吸一般，成為本能，好比眨眼一樣。有了這句話，我就能調整自己的情緒，迎接失敗者避而遠之的每一次挑戰。\n\n我現在就要付諸行動。我要一遍又一遍地重複這句話。清晨醒來時，失敗者流連於床榻，我卻默誦這句話，然後開始行動。\n\n我現在就要付諸行動。面對緊閉大門時，失敗者懷著恐懼和惶恐的心情，在門外等候；我卻默誦這句話，隨機上前敲門。我現在就要付諸行動。面對誘惑，我默誦這句話，然後遠離罪惡。\n\n我現在就要付諸行動。現在是我的所有。明日是為懶漢保留的工作日，我並不懶惰；明日是棄惡從善的日子，我並不邪惡；明日是弱者變為強者的日子，我並不軟弱；明日是失敗者藉口成功的日子，我並不是失敗者。\n我現在就要付諸行動。我是雄獅，我是蒼鷹，飢即食，渴即飲。除非行動，否則死路一條。我死亡。\n\n我現在就要付諸行動。成功不是等待。如果我遲疑，她會投入別人的懷抱，永遠棄我而去。\n\n此時。此地。此人。我現在就要付諸行動。", "c": "心靈成長", "k": "每天一遍又一遍對自己說「我現在就付諸行動」，直到像呼吸一樣自然。早上醒來不賴床、面對緊閉的門就去敲、面對誘惑就走開。「明天」是懶人、弱者和失敗者的藉口。成功不會等你，猶豫她就跑掉了。此時、此地、此人，現在就做！", "m": ["立刻行動", [["口訣", ["我現在就付諸行動", "重複成本能"]], ["應用場景", ["清晨起床", "面對緊閉大門", "面對誘惑"]], ["明日", ["懶漢的日子", "失敗者的藉口"]], ["成功", ["不是等待"]], ["此時此地此人", ["現在"]]]], "f": [["猶豫時刻", "想賴床、怕敲門"], ["默念", "我現在就付諸行動"], ["立刻做", "不給藉口"], ["重複", "變成本能"], ["成功不溜走", "把握現在"]], "p": [{"no": "040", "n": "迷迭香滾珠瓶10ml", "pr": "NT$150", "nd": ["專注", "情緒"], "w": "迷迭香滾珠瓶提神，清晨醒來默誦口訣時抹一點。"}, {"no": "098", "n": "粒線寶（膠囊）", "pr": "NT$550", "nd": ["粒線體", "能量", "恢復"], "w": "粒線寶支持能量，不賴床、立刻行動。"}], "a": [{"no": 36, "n": "拖延模型 60 項", "u": "https://membership-app-e2147.web.app/platform/self-discipline-action/procrastination-model-60-bilingual.html", "cat": "英文／語言學習 / 自律行動", "w": "拖延模型 60 項破解「明天再做」。"}, {"no": 107, "n": "高主動性 OS", "u": "https://membership-app-e2147.web.app/platform/ability-building/high-agency-os-complete.html", "cat": "能力養成／自律行動 / 能力養成", "w": "高主動性 OS 把立刻行動變成本能。"}]}, {"id": 135, "t": "腸漏是如何發生的？這篇筆記太長知識了！", "d": "5/31/2025", "g": [], "b": "大多數人認為消化系統只是一個簡單的任務：加工人體攝入的食物，從中提取維持生命的營養和能量，並排出有害廢物。而事實上，消化過程蘊含著很多高度複雜的獨立階段。如果其中某一個階段受到干擾，即使一個微小偏差也可能將本應具有滋養鞏固作用的過程，轉變成令人不適、情緒低落和痛苦的過程，甚至一些極端的情況下，還會危害整個人體。\n\n癒合腸道（或者更進一步說，完全避免腸漏症）的第一步就是要快速瞭解消化系統的最佳工作狀態。\n\n腸道是消化系統的主角，它是一條由多種器官組成的中空管道，長達約９米，相當於３層樓的高度。除了腸道外，消化過程還需要肝臟、胰腺、膽囊、神經和迴圈系統，還有腸道微生物群的參與。這些器官、激素、神經、體液和微生物聯合幫助我們從食物和飲料中汲取營養，最終幾乎對人體健康的各個方面都有巨大的影響。\n\n從你開始吃第一口食物，甚至只是聞到或看到，口腔就開始迅速分泌唾液。唾液中含有食物遇到的第一種酶，這種酶可以在咀嚼過程中分解碳水化合物。\n\n我們一般認為胃酸是不好的，但是胃分泌的天然鹽酸對人體有益。鹽酸這種清澈而又刺激性的溶液有強大的功能，甚至可以腐蝕金屬，但是在人體內，它可以殺死有害細菌，幫助胃消化酶分解蛋白質。如果胃沒有產生足夠的胃酸，就可能導致胃酸反流，小腸細菌過度繁殖的風險會提高，而這正是腸漏症的起因之一。\n\n腸壁有很多功能，其中兩個最重要的功能，一是保持開放，使身體將液體和營養物質吸收進入血液；二是作為屏障，保護身體免受感染和毒素的侵擾。腸道中的免疫系統會承擔部分工作，而腸壁本身也起到重要作用。\n\n腸壁有四層：漿膜層、肌肉層、粘膜下層和粘膜層。這四層總成“粘膜屏障”，這就是腸道滲漏發生的位置。\n\n黏膜屏障控制哪些營養可以被吸收，阻止過敏原、微生物或其他毒素進入。\n\n正常情況下，腸壁細胞間的緊密連線能夠做出正確的判斷，分辨敵友，而我們甚至都意識不到這個篩選過程一直在進行。如果遊離的病毒或病原體偷偷溜過了這道大門，免疫系統會立即行動，迅速清除威脅。但是，如果這些緊密連線開始不斷損壞，就會發生腸漏。", "c": "腸道健康", "k": "消化不是簡單的事，有很多步驟，一個小差錯就可能讓人不舒服。腸子約9公尺長。嘴巴的口水先分解碳水；胃酸殺菌和分解蛋白質，太少反而會胃食道逆流、小腸長太多菌。腸壁有四層，最裡面的「黏膜屏障」負責決定誰能進來，緊密連接壞掉就是腸漏。", "m": ["腸漏如何發生", [["消化系統", ["9公尺", "多器官協作"]], ["口腔", ["唾液酶分解碳水"]], ["胃酸", ["殺菌", "分解蛋白", "不足→逆流與菌過度生長"]], ["腸壁四層", ["漿膜", "肌肉", "黏膜下", "黏膜"]], ["黏膜屏障", ["篩選營養", "阻擋毒素", "緊密連接"]]]], "f": [["咀嚼", "唾液分解"], ["胃酸", "殺菌分解"], ["小腸", "吸收營養"], ["黏膜屏障", "篩選敵友"], ["屏障受損", "腸漏發生"]], "p": [{"no": "035", "n": "全酶", "pr": "NT$880", "nd": ["消化", "吸收"], "w": "全酶支持各階段消化，減少未消化殘渣。"}, {"no": "081", "n": "5R腸胃營養素（6g×30包）", "pr": "NT$750", "nd": ["腸道", "腸黏膜", "消化", "修復"], "w": "5R 腸胃營養素支持腸黏膜屏障修復。"}, {"no": "065", "n": "消化（6g×30包，含360mg B3）", "pr": "NT$870", "nd": ["消化", "胃部", "吸收"], "w": "消化粉包支持胃部與吸收節點。"}], "a": [{"no": 71, "n": "功能健康系統", "u": "https://membership-app-e2147.web.app/lifeos/functional-health-system.html", "cat": "醫學生／醫學健康 / 健康", "w": "功能健康系統理解腸壁四層與黏膜屏障。"}, {"no": 69, "n": "身體訊號系統", "u": "https://membership-app-e2147.web.app/lifeos/body-signals.html", "cat": "醫學生／醫學健康 / 健康", "w": "身體訊號系統讀懂消化不適的訊號。"}]}, {"id": 136, "t": "高血壓是吃出來的，鹽與高血壓有這樣的關係", "d": "5/26/2025", "g": [], "b": "全球頭號死亡風險因素是高血壓。在全世界，高血壓每年造成９００萬人死亡。高血壓之所以能殺死這麼多人，是因為它是許多死因的推手，包括動脈瘤、心臟病發作、心臟衰竭、腎衰竭，以及中風等。\n\n護士會讀出兩個數字，比方說，１１５和７５。第一個數字代表收縮壓，即從心臟送出血液時，動脈所承受的壓力；第二個數字代表舒張壓，即在兩次心搏間，心臟休息時動脈所承受的壓力。“正常”血壓為收縮壓在１２０mmHg以下、舒張壓在８０mmHg以下（標記為１２０／８０）。任何高於１４０／９０的數值，都會被視為高血壓。介於兩者之間的血壓值，則被視為高血壓前期。\n\n血壓升高會給心臟帶來壓力，並可能損壞眼睛和腎臟的敏感血管，引發腦出血，甚至導致某些動脈擴張和破裂。高血壓會破壞許多器官系統，並增加患心臟病和中風的風險；這個事實，解釋了為什麼高血壓是全球頭號的危險致死因素。\n\n高血壓似乎可以說是選擇的結果。你可以選擇繼續吃讓動脈破裂的西方飲食，也可以選擇擺脫這一風險。真相是，要消除死亡的主要風險因子，或許很簡單，不需要藥物也不用做手術。我們需要的，只是一雙筷子後一把叉子。\n\n高納食物會讓你的腰圍越來越粗。我們所吃的鹽，是一種由大約４０％的鈉和６０％的氯所組成的化合物。鈉是一種必須營養物素，但蔬菜及其他天然食物就足以提供身體所需要的少量鈉。攝取太多鹽會導致水腫，而身體可能會以提高血壓來響應，以便把多餘的體液和鹽分排出體外。\n\n在人類進化的前９０％的時間段，可能一直都過著低鈉飲食的生活，每天攝取的鈉不到１／４茶匙。因為當時人類的主要食物，可能是植物。長達數百萬年，人類都過著不需要鹽罐的生活，因此身體演變成節鈉型有機體。\n\n人類基因的設定，決定了我們所需要的鈉比現在所攝取的要少１０倍。\n\n如果我們能避免吃過鹹的食物、不往食物里加鹽，落實每天減少約半茶匙的鹽攝取量，就可以減少２２％的中風風險及１６％的心臟病發作。\n\n已有證據顯示，鈉會讓血壓升高。\n\n《皇帝內經》裡說過：“味過於鹹，大骨氣老，短肌，心氣抑．．．”\n\n我們可以做以下幾件事來改變用鹽習慣。首先，不要在桌上擺鹽罐。其次，停止在烹調時加鹽。試著用胡椒、蔥、蒜、西紅柿、甜椒、芹菜等代替鹽。最後，儘可能避免吃加工食品。", "c": "高血壓", "k": "高血壓是全球第一名的死亡風險，每年造成900萬人死亡。正常血壓在120/80以下，超過140/90就是高血壓。吃太多鹽，身體會用升血壓來排掉多的鹽水。每天少吃半茶匙鹽，中風減22%、心臟病減16%。方法：桌上不放鹽罐、煮菜不加鹽、用蔥蒜胡椒番茄調味、少吃加工食品。", "m": ["鹽與高血壓", [["全球頭號風險", ["每年900萬人"]], ["血壓數字", ["收縮壓/舒張壓", "正常<120/80", "高血壓≥140/90"]], ["危害", ["心臟", "眼腎血管", "腦出血"]], ["鈉", ["鹽的40%", "水腫→升壓"]], ["改變", ["不擺鹽罐", "烹調不加鹽", "香料代替", "少加工"]]]], "f": [["高鈉飲食", "鹽罐、加工品"], ["水腫", "血量增加"], ["血壓升高", "傷心腦腎"], ["減鹽四招", "香料代鹽"], ["血壓下降", "中風心臟病減少"]], "p": [{"no": "052", "n": "血循環", "pr": "NT$1350", "nd": ["循環", "心血管", "末梢循環"], "w": "血循環支持心血管與循環，搭配減鹽照顧血壓。"}, {"no": "091", "n": "甘氨酸鎂複方粉包", "pr": "NT$1350", "nd": ["睡眠", "神經", "肌肉", "放鬆"], "w": "甘氨酸鎂複方支持血管與神經放鬆。"}, {"no": "006", "n": "專利HEZY氫鬆袋（買空袋送氫氧水）", "pr": "NT$250", "nd": ["氧化壓力", "修復", "能量"], "w": "氫鬆袋讓喝水更規律，取代含鈉、含糖飲品。"}], "a": [{"no": 72, "n": "健康診斷系統", "u": "https://membership-app-e2147.web.app/lifeos/health-diagnosis.html", "cat": "醫學生／醫學健康 / 健康", "w": "健康診斷系統看懂收縮壓、舒張壓數值。"}, {"no": 92, "n": "醫療證據購物 OS", "u": "https://membership-app-e2147.web.app/platform/health-medicine/medical-evidence-shopping-os.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "醫療證據購物 OS 教你避開高鈉加工食品。"}]}, {"id": 137, "t": "哭崩了！活出生命的意義！這本書強烈推薦！", "d": "5/25/2025", "g": [], "b": "囚徒們常常夢見的無非是麵包、蛋糕、香菸和舒適的熱水澡。這些簡單的生活需求都難以滿足，他們只好靠夢境去尋找，至於這些夢是否有意義就屬於另一個問題了。囚徒們常常會從夢中驚醒，旋即回到集中營的現實生活中，這就造成現實和夢幻之間的強烈對比。\n\n當皮下脂肪消耗殆盡時，我們就像被一層皮和布裹著的骷髏，不斷感到身體開始消耗我們的生命。生物體慢慢消耗自身的蛋白，肌肉逐漸消失。身體的抵抗力也越來越差，棚屋裡為數不多的人一個接一個地死。我們每個人都能準確地推斷出下一個會輪到誰，自己又會在什麼時候死去。\n\n在集中營一天２４小時的生活裡，最可怕的時刻是一覺初醒時。天還沒亮，睡夢中的我們被無情地驚醒，三聲刺耳的哨音打破了沉沉的美夢。我們一邊掙扎著把浮腫酸脹的雙腳塞進溼漉漉的鞋子，一邊聽著旁人的呻吟和嘆息，發出這些聲音可能只是因為發現代替這些鞋帶的電線也斷裂了這樣的小事。一天早晨，我聽見某人像孩子一樣嚎啕大哭起來，這個人一向表現得勇敢和自尊，這樣哭泣是因為他的鞋子已經破得無法再穿，一想到以後只能赤腳走在冰天雪地裡就悲從中來。\n\n忽然間，我”一生中第一次悟道一個真理，它曾被詩人讚頌，被思想家視為絕頂智慧。這就是：愛是人類終身追求的最高目的。\n\n“我”理解詩歌、思想和信仰所傳達的偉大秘密的真正含義：拯救人類要透過愛與被愛。“我”知道世界上一無所有的人只要片刻的時間思念愛人，那麼他就可以領悟幸福的真諦。在荒涼的環境中，人們不能暢所欲言，唯一正確的做法就是忍受痛苦，以一種令人尊敬的方法去忍受，在這種處境中的人們也可以透過回憶愛人的形象獲得滿足。“我”一生中第一理解這句話“天使存在於無比美麗的永恆思念中”。\n\n“我”終於明白了一件事，如今“我”對這件事理解得更加深刻，那就是愛一個人可以遠遠超過愛她的肉體本身。\n\n他眼睛裡湧出淚水，“我”想法安慰他，然後跟他說了“我”的遺囑：”聽著，奧托，如果我不能回家看我妻子，如果你還能再見到她，請告訴她三件事。第一，我每時每刻都在思念她，請你一定記得轉達；第二，我愛她勝過任何人；第三，我跟她結婚後短暫的時光勝過一切，也超過我們在這裡遭受的所有痛苦。”\n\n在心理和精神的層面，基本上任何人都能夠決定自己成為什麼樣的人。陀思妥耶夫斯基說過“我只害怕一樣——那就是配不上我所受的痛苦。”\n\n在任何地方，人都會遇到厄運，同時也就會遇到透過勇敢地面對苦難而實現道德昇華的機會。", "c": "心靈成長", "k": "弗蘭克在集中營裡過著飢餓、寒冷、隨時可能死去的生活。但他在思念妻子時明白：愛是人類追求的最高目標，就算一無所有，只要想著所愛的人，也能感到幸福。外在的一切都被奪走時，人仍然可以選擇用什麼態度面對苦難，讓自己配得上所受的痛苦。", "m": ["活出意義來", [["集中營", ["飢餓寒冷", "夢見麵包熱水澡"]], ["最可怕時刻", ["清晨被哨聲驚醒"]], ["領悟", ["愛是最高目的", "透過愛與被愛得救"]], ["思念", ["愛超越肉體"]], ["選擇", ["決定成為什麼樣的人", "配得上痛苦"]]]], "f": [["苦難降臨", "一無所有"], ["內在選擇", "以尊嚴忍受"], ["思念所愛", "感受愛的力量"], ["找到意義", "苦難中的昇華"], ["活出生命意義", "配得上痛苦"]], "p": [{"no": "028", "n": "心膚精油特價組", "pr": "NT$1200", "nd": ["情緒", "放鬆", "肌膚"], "w": "心膚精油組陪你在苦難中思念所愛、找到意義。"}, {"no": "047", "n": "刺五加（膠囊）", "pr": "NT$495", "nd": ["壓力", "體力", "適應力"], "w": "刺五加支持壓力適應，在困境中撐住身心。"}], "a": [{"no": 15, "n": "靈魂重建雙語 APP", "u": "https://membership-app-e2147.web.app/lifeos/soul-reconstruction-bilingual-app.html", "cat": "英文／語言學習 / 心理", "w": "靈魂重建雙語 APP 在苦難中重建意義。"}, {"no": 53, "n": "愛的覺醒之書", "u": "https://membership-app-e2147.web.app/lifeos/book-of-love-awakening.html", "cat": "基督信仰／靈性智慧 / 關係", "w": "愛的覺醒之書對應「愛是人類最高的目的」。"}]}, {"id": 138, "t": "腸道影響整體健康，這篇筆記必讀！太有用了", "d": "5/24/2025", "g": [], "b": "結腸功能的失調，與人體其他部分健康不佳有關，包括心臟、免疫系統、肝臟、腎臟等。\n\n緊接在胃後的十二指腸開始就是小腸區，是食物營養被分解吸收的主要場所。食物在咀嚼之後，會與消化液混合成食糜，先經過胃酸和酶初步分解，但是主要的消化分解工作則是由小腸負責。所以，我們可以把小腸想象成食物營養的化學分解工廠。小腸的分泌液多半為鹼性，可以中和先前在胃部的強酸，在小腸中幫助消化的分泌來自膽囊和胰臟。肝臟製造的膽鹽，先儲存在膽囊中，一旦進入小腸後，膽鹼的作用就像是清潔劑一樣，將食物中的脂肪酸和甘油酯乳化為微小的液滴，使腸壁細胞得以吸收。\n\n結腸和小腸不同，結腸腸壁光滑，沒有突起的絨毛結構，而是由許多個別收縮的“袋裝”結構，促使大量的食物能向下移動。一般來說，結腸的神經並不多，因此我們不太能感受到結腸的肌肉運動。結腸會吸收殘餘的水分使糞便緊實結腸細胞則會製造足夠的粘液幫助糞便通行。\n\n除了吸收水分和小腸沒有吸收完成的營養素之外，結腸還是發酵的主要場所。腸道如健康，小腸內的害菌是無法發揮作用的。\n\n人類的腸道長而曲折，而狗、虎等肉食動物的腸道都是短而直的。肉食動物的結腸，就是為了使難以消化的肉類、膽固醇、油脂，在沒有膳食纖維的幫助之下快速排出。\n\n也就是說，會在體溫下發酵的肉類，必須快速消化並將其廢物快速排出體外，但是人類的腸道構造，卻會減緩這個過程，使肉類在腸道中腐敗，導致各種健康方面的問題，畢竟，人體腸道並不是為了有效消化肉類而設計的。\n\n想要結腸健康，一定要從正確的飲食著手，也就是以高膳食纖維、低脂、蔬果為主的飲食。其中膳食纖維的角色就像腸道內的掃帚，將卡在腸壁上的脂肪沿著腸壁掃下；而所有的動物性食物，無論奶、肉還是蛋都不含任何膳食纖維，且脂肪含量很高，這些動物性食物除了難消化或需要較長時間消化之外，還會使結腸分泌增加以包住未消化的腐敗食物，結果導致一層又一層厚厚的黏膜包裹住腐臭的食物殘渣，變成卡在結腸壁上的一層陳年老垢。\n\n如果量攝取外來的食物刺激物，包括菸草、咖啡、酒精、巧克力、精製糖和其他精製食品，對消化和排便都有不利影響，會阻礙腸胃道的正常生理機能和神經反應。抗生素則已知會摧毀腸道內的正常菌落，使害菌和病毒入侵。缺乏運動會導致腹部肌肉無力，也使身體更無力負荷因不良飲食習慣而增加的負擔。", "c": "腸道健康", "k": "小腸是「營養分解工廠」，膽汁像清潔劑把油脂打散吸收。大腸吸收水分、讓好菌發酵。肉食動物的腸子短而直，人的腸子長而彎，肉在裡面停太久會腐敗。纖維像腸道的掃把，把卡在腸壁的東西掃掉；菸、酒、咖啡、精製糖、抗生素、不運動都會傷腸。", "m": ["腸道與整體健康", [["小腸", ["化學分解工廠", "膽汁乳化脂肪"]], ["大腸", ["吸水", "發酵", "黏液助通行"]], ["腸道構造", ["人長而彎", "肉食動物短而直"]], ["纖維", ["腸道掃把"]], ["傷腸因子", ["菸酒咖啡", "精製糖", "抗生素", "缺運動"]]]], "f": [["高纖低脂飲食", "蔬果為主"], ["小腸分解吸收", "營養充足"], ["纖維掃除", "清潔腸壁"], ["大腸發酵", "好菌產物"], ["全身健康", "心肝腎免疫"]], "p": [{"no": "033", "n": "亞麻仁籽渣（2包）", "pr": "NT$198", "nd": ["腸道", "膳食纖維"], "w": "亞麻仁籽渣是腸道的「掃把」，清潔腸壁。"}, {"no": "096", "n": "孢子益生菌（加亞麻仁渣）（6g×30包）", "pr": "NT$650", "nd": ["菌相", "腸道", "免疫"], "w": "孢子益生菌維持大腸發酵與菌相。"}, {"no": "046", "n": "丁酸鈉複合包", "pr": "NT$890", "nd": ["腸道", "菌相", "腸黏膜", "免疫"], "w": "丁酸鈉複合包支持結腸黏膜。"}], "a": [{"no": 71, "n": "功能健康系統", "u": "https://membership-app-e2147.web.app/lifeos/functional-health-system.html", "cat": "醫學生／醫學健康 / 健康", "w": "功能健康系統理解小腸與大腸的分工。"}, {"no": 67, "n": "健康負熵 APP", "u": "https://membership-app-e2147.web.app/lifeos/health-negentropy-app.html", "cat": "醫學生／醫學健康 / 健康", "w": "健康負熵 APP 規劃高纖低脂的飲食。"}]}, {"id": 139, "t": "鍛鍊血清素的這幾個方法要知道。提高睡眠！", "d": "5/14/2025", "g": [], "b": "血清素鍛鍊持續３個月，血清素能神經的結構就會開始發生變化。血清素鍛鍊持續６個月，就會出現很好的效果。\n\n要把血清素鍛鍊當作生活的一部分，不能見好就收，這樣才會有好的效果。\n\n只要堅持最初的３個月，就能得到很大的改善。因為最初３個月的堅持，是最難的。\n\n開始鍛鍊時，如果出現不適感，請把它看作血清素開始增加、自我檢查路線的啟動、是血清素被抑製造成的。\n\n激活血清素能神經的兩大法寶：陽光、韻律運動。\n\n冬季抑鬱症，就是到了冬季會發病的抑鬱症。把患者轉移到冬天日照時間較長的溫暖地區的異地療法，對這種抑鬱症很有效果。這種抑鬱症的病因就是日照不足。\n\n早晨起床後，一定要開啟房間的窗簾、窗戶，讓陽光灑滿房間。上班、上學的路上，儘量選擇有太陽的道路上步行。\n\n血清素是在早上製造的，所以，沐浴早上的陽光對激活血清素最有效果。\n\n沐浴陽光不需要太長時間，３０分鐘足夠了。因為長時間的陽光刺激，血清素能神經會啟動自我抑制的功能。\n\n另外，千萬不可直視太陽，否則會損壞視網膜。\n\n大腦擁有自己的“安眠藥”，一到晚上就會自行放出，我們也就能好好入睡了。\n\n這種“安眠藥”，就是大腦松果體分泌的褪黑激素。分泌褪黑激素的條件是太陽下山——天黑了。\n\n晚上失眠的人，正式因為缺少褪黑激素造成的。而褪黑激素的原料，則是血清素。\n\n患有抑鬱症或者因為生活壓力大的人，大都會失眠，其部分原因是血清素不足。\n\n換句話說，就是因為白天沒有製造足夠多的血清素，而晚上就沒有足夠的褪黑激素，所以才會失眠。\n\n褪黑激素，除了安眠的作用，還有抗衰老的作用。褪黑激素屬於抗氧化物質，晚上睡覺的時候，還會處理白天產生的不良物質“活性氧化素”。\n\n有人連夜加班，早上才入睡，其實這是最壞的睡眠。因為太陽出來後，大腦不會分泌褪黑激素。\n\n這種睡眠可以消除身體上的疲勞感，但根本沒有抗衰老的效果。\n\n因此，那些經常上夜班的人、生活不規律的人，就酸經常進行臉部護理，大多數皮膚都不好。\n\n真正讓人恐怖的是，皮膚不好背後所隱藏的活性氧化素的存在。活性氧化素就好比燃燒後產生的煤炭。沒有褪黑激素的睡眠，就像人體內的煤炭沒有辦法清除，一直堆積著。\n\n要想增加褪黑激素，享受深度睡眠，最重要的是白天吸收足夠的陽光，再加上韻律運動，以激活血清素能神經。\n\n韻律運動：腹式呼吸法、坐禪、散步和慢跑、咀嚼。", "c": "睡眠健康", "k": "鍛鍊血清素神經：堅持3個月結構開始改變，6個月效果很好。兩大法寶：早上的陽光和有節奏的運動。早上拉開窗簾、走有太陽的路，曬30分鐘就夠（不要直視太陽）。韻律運動包括腹式呼吸、坐禪、散步慢跑、咀嚼。白天血清素夠，晚上褪黑激素才夠，才睡得好。", "m": ["鍛鍊血清素", [["時程", ["3個月改變結構", "6個月見效"]], ["法寶1陽光", ["早晨30分鐘", "勿直視太陽"]], ["法寶2韻律運動", ["腹式呼吸", "坐禪", "散步慢跑", "咀嚼"]], ["冬季憂鬱", ["日照不足"]], ["睡眠連結", ["血清素→褪黑激素"]]]], "f": [["早晨拉開窗簾", "曬太陽30分鐘"], ["韻律運動", "散步、呼吸、咀嚼"], ["血清素增加", "白天冷靜清醒"], ["夜晚轉換", "褪黑激素"], ["深度睡眠", "堅持3-6個月"]], "p": [{"no": "050", "n": "銀杏複方（銀杏＋巴西蘑菇＋色氨酸＋防風＋玉米黃質）", "pr": "NT$510", "nd": ["腦循環", "眼睛", "睡眠", "神經"], "w": "銀杏複方含色氨酸，是血清素的原料。"}, {"no": "034", "n": "胺基酸可可粉包", "pr": "NT$780", "nd": ["肌肉", "能量"], "w": "胺基酸可可粉支持肌肉與能量，配合散步慢跑等韻律運動。"}, {"no": "014", "n": "健康接地枕頭套", "pr": "NT$599", "nd": ["睡眠", "恢復"], "w": "健康接地枕頭套支持夜間深度睡眠。"}], "a": [{"no": 77, "n": "節律營養系統", "u": "https://membership-app-e2147.web.app/lifeos/rhythm-nutrients.html", "cat": "醫學生／醫學健康 / 健康", "w": "節律營養系統安排早晨日照與作息。"}, {"no": 63, "n": "情緒導航 APP", "u": "https://membership-app-e2147.web.app/lifeos/emotion-navigation-app.html", "cat": "情緒心理／信念療癒 / 心理", "w": "情緒導航 APP 延伸冬季憂鬱與情緒調節。"}]}, {"id": 140, "t": "血清素對我們的身心太重要了！認識血清素！", "d": "5/13/2025", "g": [], "b": "血清素能神經的神經衝動是自發的、按照一定規律釋放的，和其他神經的刺激沒有關係。\n\n那麼，是什麼賜予血清素能神經活動規律性的呢？\n\n答案就是睡眠和清醒的迴圈。\n\n血清素能神經能給大腦帶來冷靜的清醒，因此在血清素持續定量釋放期間，大腦會保持清醒狀態。當大腦進入睡眠狀態後，神經衝的頻度減慢，血清素釋放量隨之減少的時候，大腦也就不再處於清醒的狀態。\n\n人醒來後，大腦就在血清素素能神經的作用下，進入了清醒的狀態，也就是我們日常感受到的“爽快清醒”。\n\n血清素能神經的功能到底是什麼呢？\n\n血清素能神經有五大功能。第yi種，冷靜的清醒——適度抑制大腦皮質的活動。第二種，保持平常心——調整心態的功能。去jia腎上腺素能神經和多巴胺能神經是兩種會失控的神經，而血清素能神經能對它們施加作用，以保持適當的興奮，抑制失控的可能性。\n\n所以，只有血清素能神經正常，精神性的壓力就很容易得到控制。哪怕存在壓力，也不會被壓垮，不會變得焦躁、易怒。同時，哪怕有高興的事發生，也不會手足舞蹈，過於興奮。\n平常心就是保持適度緊張並zui能發揮個人能力的狀態。\n\n第三種——交感神經的適度興奮。人腦神經有兩種自律神經“交感神經”“副交感神經”支援著。自律神經指的是和意志無關的，且在工作著的神經。\n\n清醒的時候，由交感神經主導；睡眠的時候，由副交感神經主導。\n\n那麼，由副交感神經切換到交感神經時，血清素能神經的規律性衝動在其中起到了很重還要的作用。所以，如果血清素能神經衰弱的話，規律性衝動就會變得混亂，自律神經的切換過程也會混亂，從而會引起自律神經失調症，出現身體顫抖、頭暈目眩等症狀。\n\n第四，減輕疼痛。血清素還有zhen定劑的功效。我們通常認為，是身體的各部分感受到疼痛，其實不是，感受到到疼痛的是我們的“腦”。\n\n第五種，保持良好的姿勢。血清素能神經是直接向連線著“抗重力肌”的運動神經伸出軸索，給予刺激。什麼是抗重力肌呢？反重力作用的肌肉，例如頸部肌肉、下肢肌肉、支撐背骨周圍的肌肉以及眼皮和臉上的肌肉等，都是抗重力肌。\n\n如果血清素能神經出現衰弱，抗重力肌的緊張也會變得弱化，很難保持良好的姿勢，經常會呈現鬆鬆垮胯的樣子。另外眼睛也會無神，給人一種懶散的印象。\n\n所以血清素能神經的功能hi對我們的身心產生極大的影響。", "c": "情緒管理", "k": "血清素神經會規律地放電，跟睡醒循環有關，讓我們早上「神清氣爽」。它有五大功能：1.冷靜的清醒；2.保持平常心，不暴怒也不太亢奮；3.幫忙切換交感/副交感神經；4.減輕疼痛；5.讓我們抬頭挺胸、眼睛有神。血清素不足時人會鬆垮、無神、易怒。", "m": ["認識血清素", [["規律性", ["睡醒循環"]], ["1冷靜清醒", ["抑制大腦皮質"]], ["2平常心", ["調節正腎上腺素多巴胺"]], ["3自律神經", ["交感副交感切換"]], ["4減輕疼痛", ["鎮定劑功效"]], ["5良好姿勢", ["抗重力肌", "眼睛有神"]]]], "f": [["規律作息", "睡醒循環"], ["血清素規律釋放", "冷靜清醒"], ["情緒穩定", "平常心"], ["自律神經平衡", "不頭暈顫抖"], ["抬頭挺胸", "有精神"]], "p": [{"no": "050", "n": "銀杏複方（銀杏＋巴西蘑菇＋色氨酸＋防風＋玉米黃質）", "pr": "NT$510", "nd": ["腦循環", "眼睛", "睡眠", "神經"], "w": "銀杏複方含色氨酸，支持血清素的原料供應。"}, {"no": "054", "n": "GABA（膠囊）", "pr": "NT$540", "nd": ["睡眠", "情緒", "放鬆"], "w": "GABA 支持放鬆，維持平常心。"}, {"no": "091", "n": "甘氨酸鎂複方粉包", "pr": "NT$1350", "nd": ["睡眠", "神經", "肌肉", "放鬆"], "w": "甘氨酸鎂複方支持神經與肌肉，幫助自律神經平衡。"}], "a": [{"no": 63, "n": "情緒導航 APP", "u": "https://membership-app-e2147.web.app/lifeos/emotion-navigation-app.html", "cat": "情緒心理／信念療癒 / 心理", "w": "情緒導航 APP 理解血清素與平常心。"}, {"no": 69, "n": "身體訊號系統", "u": "https://membership-app-e2147.web.app/lifeos/body-signals.html", "cat": "醫學生／醫學健康 / 健康", "w": "身體訊號系統讀懂姿勢鬆垮、眼神無力等訊號。"}]}, {"id": 141, "t": "關於前列腺看這篇就夠。", "d": "5/10/2025", "g": [], "b": "人類是唯一在斷奶後還繼喝奶的物種，而引用另一種的奶，似乎也不能稱為自然吧？\n\n所有來自動物的食物都含有雌激素等性荷爾蒙，瞧瞧現金轉基因＂改良＂過的奶牛，整個孕期都有奶可以擠，這正是它們生殖激素的高峰期。這些荷爾蒙自然存在於牛奶中（也包括有機牛奶），和可能跟各種由牛奶和其他乳製品所引發的荷爾蒙病症有關，包括痤瘡、男性生殖能力降低及性早熟。\n\n研究人員發現，牛奶會刺激人類前列腺癌細胞的生長，平均會加快癌症生長速度３０％以上，牛奶會增加前列腺癌的風險，佇列研究的結果也一致。２０１５年的一項元分析發現，乳製品（包括牛奶、低脂牛奶和乳酪，但不含非乳製品來源的鈣）的高攝取量，似乎會增加前列腺的風險。\n\n你可能會想，如果不喝牛奶，會不會影響骨骼發展？牛奶不是有助於預防骨質疏鬆症嗎？事實證明，這種宣稱的而好處可能只是另一個空口無憑的營銷策略而已。一項針對牛奶攝取量和髖部骨折研究的分析顯示，牛奶並沒有顯著的保護作用。\n\n即使你在青春期開始喝牛奶，試圖加強峰值骨密度，可能還是無法降低日後骨折的機率。\n\n有些嬰兒天生帶有一種稱為半乳糖血症的罕見缺陷，這是因為先天缺乏代謝半乳糖酶而引發的遺傳代謝疾病。這樣也意味著他們血液中由高濃度的半乳糖，可能會導致骨質流失。一群瑞典的研究人員計算過，即使是可以代謝半乳糖的正常人，天天喝牛奶可能也對骨骼不太好。半乳糖不僅可能傷害骨骼，事實上科學家發現，用半乳糖就能引發實驗動物的過早老化。當研究人員塞給實驗動物一些半乳糖以後，“動物的生命縮短，並表現出神經退化性疾病、智力發育遲緩和認知功能障礙，同時免疫反應與生殖能力也降低了。”而且半乳糖的量不用太多，大約相當於一天喝一兩杯牛奶的量，就會發生上述影響。\n\n不過人類說到底跟老鼠不一樣，所以研究人員轉而調查喝大量牛奶的人在死亡率和骨折風險的變化。除了骨折和髖部骨折的機率明顯較高之外，研究人員還發現，每天喝１杯牛奶的女性跟較高的早逝、心臟病與癌症高發有關。每天喝３杯牛奶的人，早逝風險會增高２倍。至於喝較多牛奶的男性，儘管沒有顯示出較高的骨折發生率，但死亡率較高。\n\n總之，該研究顯示喝越多的牛奶，會導致越高的死亡率（男女皆是）和骨折率（僅女性）。", "c": "男性健康", "k": "人類是唯一斷奶後還喝別種動物奶的物種。牛奶天然含有雌激素等荷爾蒙，研究發現牛奶會讓前列腺癌細胞長得更快，乳製品多也可能增加前列腺癌風險。喝牛奶不一定能預防骨折，牛奶中的半乳糖在動物實驗中還會加速老化。（屬書中觀點）", "m": ["前列腺與牛奶", [["自然性", ["斷奶後仍喝奶"]], ["荷爾蒙", ["牛奶含雌激素", "痤瘡性早熟"]], ["前列腺癌", ["加速生長30%", "乳製品風險高"]], ["骨骼", ["未見保護", "髖部骨折"]], ["半乳糖", ["動物實驗加速老化"]]]], "f": [["大量乳製品", "荷爾蒙＋半乳糖"], ["刺激細胞生長", "前列腺癌細胞"], ["風險上升", "研究觀察"], ["替代", "植物奶、高鈣蔬菜"], ["定期檢查", "PSA與泌尿科追蹤"]], "p": [{"no": "080", "n": "青春方（攝護腺膠囊）", "pr": "NT$550", "nd": ["男性保養", "攝護腺", "排尿"], "w": "青春方（攝護腺膠囊）聚焦男性與攝護腺節點，作為男性保養補充。"}, {"no": "092", "n": "D3（5000IU）（錠）", "pr": "NT$580", "nd": ["免疫", "骨骼", "鈣代謝"], "w": "D3（5000IU）支持骨骼，不靠牛奶也能照顧骨骼。"}, {"no": "017", "n": "酵母鋅＋核酸", "pr": "NT$550", "nd": ["免疫", "修復"], "w": "酵母鋅＋核酸：鋅是男性保養常見的礦物質。"}], "a": [{"no": 72, "n": "健康診斷系統", "u": "https://membership-app-e2147.web.app/lifeos/health-diagnosis.html", "cat": "醫學生／醫學健康 / 健康", "w": "健康診斷系統看懂 PSA 等攝護腺檢查。"}, {"no": 92, "n": "醫療證據購物 OS", "u": "https://membership-app-e2147.web.app/platform/health-medicine/medical-evidence-shopping-os.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "醫療證據購物 OS 用證據看牛奶與乳製品的爭議。"}]}, {"id": 142, "t": "搞錢要建立多渠道模式，實現收益翻倍！！！", "d": "5/8/2025", "g": [], "b": "工作是一種選擇，而不是一種義務。不要等到經濟獨立後才意識到這一點。\n\n行動起來，奇蹟就會出現。\n\n沒有千篇一律的方法。從目的因出發，而不是朝著它埋頭苦幹。從一開始就圍繞理想的生活方式建立商業模式和銷售策略，見證更多的時間和機會的延伸。從夢想出發，而不是追逐夢想。\n\n如果對你來說，工作可以轉化為金錢，那麼，如果你沒有賺到錢，這就意味著，你這輩子一天都沒有工作過，是這樣嗎？你一直在準備工作，但是沒有真正在工作。\n\n無論你是一名員工、高管、內部創業者、企業家還是個體創業者，經過策略性地調整和實施，都可以創造一種你喜歡的並可以享受其中的工作和生活體驗。無論你經濟狀況如何，你的而行貨質量更多地取決於你的工作時間、工作地點和工作方式。認識到這一事實，可以讓你豁然開朗，也讓你充滿力量。\n\n如果生活中所有對你重要的只是一件事，那麼只專注於這一件事的話，你的效率是極高的。\n\n不要固步自封。\n\n安徒生的許多童話故事告訴我們，我們可以克服萬難，扭轉乾坤，最終我們的命運改變。安徒生說“生活本身就是最美妙的童話故事。”我們的抱負、掙扎和痛苦造就了我們，我們的收入模式亦然。你可以透過改變收入模式，改變你的生活。\n\n我們不要固步自封，直到生命的最後一刻。所以你做出改變。你可以用不同的方式搞錢。你可以保留（或不保留）你的工作。\n\n最終，你做的這一切是為了完成什麼事情？你願意將這些事情放在首位，也就是現在（在你改變收入模式之前）將目標置於你的生活中心，圍繞目標建立工作，使工作為其保駕護嗎？\n\n也許你目前的工作狀態並不像你想像中的那麼不堪。也許你忽略了你的自尊。只是為了保護和提升他們自己，卻犧牲了你。也許工作中一些芝麻大點的小事，讓你輾轉反側，徹夜難眠，因為有人在暗中考驗你，看你是否勝任某些任務。\n\n也許你處於人生的轉折點，希望在工作上徹底轉型，從一個行業跳到了另一個行業。\n\n也許你覺得自己太渺小，無法克服大的工作障礙。但是，你想忠於自己的內心，開闊眼界，提升自我。\n\n也許你太憤世嫉俗，目空一切，在工作中自視甚高。你需要擁抱一顆童心，發現生活中的美好，愛你身邊的人。", "c": "財富思維", "k": "工作是選擇，不是義務。從你想要的生活出發去設計賺錢方式，而不是一直埋頭追夢。可以保留工作，也可以用不同方式賺錢，建立多種收入。不要固步自封，安徒生說「生活本身就是最美妙的童話」。改變收入模式，就能改變生活。", "m": ["多渠道收入", [["觀念", ["工作是選擇", "從夢想出發"]], ["生活品質", ["取決於時間地點方式"]], ["專注", ["只重要一件事效率最高"]], ["不固步自封", ["改變收入模式"]], ["自我檢視", ["轉折點", "擁抱童心"]]]], "f": [["釐清目的因", "最終想完成什麼"], ["設計生活方式", "理想時間地點"], ["建立收入模式", "多渠道"], ["保留或轉型工作", "策略調整"], ["生活改變", "童話般的人生"]], "p": [{"no": "042", "n": "清思油滴35ml（迷迭香精油＋EPA魚油）", "pr": "NT$450", "nd": ["腦神經", "專注", "情緒"], "w": "清思油滴支持專注，設計多渠道收入模式。"}, {"no": "098", "n": "粒線寶（膠囊）", "pr": "NT$550", "nd": ["粒線體", "能量", "恢復"], "w": "粒線寶支持能量，主業副業兼顧需要好精神。"}], "a": [{"no": 1, "n": "福利會員 APP", "u": "https://membership-app-e2147.web.app/lifeos/member-benefits-app.html", "cat": "會員／商業經濟 / 會員", "w": "福利會員 APP 整合會員資源，是建立收入渠道的入口。"}, {"no": 3, "n": "經濟學知識掌握系統", "u": "https://membership-app-e2147.web.app/lifeos/economics-knowledge-mastery.html", "cat": "會員／商業經濟 / 商業", "w": "經濟學知識掌握系統打好賺錢的知識基礎。"}]}, {"id": 143, "t": "💥抑鬱症與飲食的關係，這篇筆記值得收藏", "d": "5/6/2025", "g": [], "b": "健康不只是沒有疾病或不虛弱，而是一種身體、心理與社交的完全健康的狀態。換句話說，你可能具有完美的體態——膽固醇低、體重維持良好，體能良好，但這未必代表你健康。心理健康與身體健康，一樣重要.\n\n每個人都會有偶爾情緒低落的時候。所有的情緒，不論好壞，都是人性的一部分。然而，抑鬱症不只是情緒低落而已，而是情緒低落後悲傷的情緒會持續好幾個星期，對曾經喜愛的活動失去興趣、難以集中注意力，以及經常出現想死的念頭等症狀。\n\n沒錯，重度抑鬱症是可能威脅生命的疾病。\n\n心理健康確實在身體健康上發揮了部分的作用。這就是你所吃的食物非常重要的原因，因為食物會同時影響你的噁心靈和身體情況。正如你所見，一般常見的食物，從綠葉菜到常見的西紅柿，對大腦化學反應都有正向的影響，能幫助你抵抗抑鬱症。事實上，即使只是聞一聞普通的香料，就能改善你的惡情緒狀態。\n\n但要避免抑鬱，不能僅僅靠吃綠葉菜，還要避開某些食物。因為食物裡可能含有一些會增加抑鬱症風險的成分，例如花生四烯酸，這是主要存在於雞肉和蛋裡的一種會導致炎症的化合物，是導致大腦發炎而破壞情緒的主因。\n\n好煩躁！都是花生四烯酸惹的禍。\n\n動物性產品中所發現的促炎化合物——花生四烯酸，會“導致神經發炎的連鎖反應，造成對心理健康的不利影響”。當我們的身體代謝花生四烯酸時，會形成一組發炎性化學物質。事實上，這就是阿司匹林和布洛芬之類的消炎止痛　藥減輕疼痛和腫脹的方式：抑制花生四烯酸轉化成這些發炎性的最終產物。或許，雜食者的心理健康問題是受到大腦發炎的連累。\n\n發炎並不全是壞事。當傷口周圍變得紅腫發熱，這個現象表明身體正在用花生四烯酸的發炎反應來幫助抵抗感染。但是，我們的身體已經制造了所需要的花生四烯酸，不需要再從飲食獲取。當你從飲食攝取過量時就可能打亂體內系統的平衡。研究人員懷疑，花生四烯酸的不當攝取可能會影響情緒狀態。有資料表明，血液中花生四烯酸濃度較高的人，抑鬱症發作和自殺的風險明顯較高。\n\n花生四烯酸的五大來源是雞肉、蛋、牛肉、豬肉和魚，其中雞肉和蛋的花生四烯酸含量，就比其他主要來源的總和還要多。\n\n情緒低落，吃綠葉菜就對了。\n\n喝咖啡千萬別加糖。\n\n吃抗抑鬱的藥物，不如運動。\n\n #", "c": "情緒健康", "k": "健康不只是身體好，心理健康一樣重要。憂鬱症不只是心情不好，而是悲傷持續好幾週、對喜歡的事失去興趣。食物會影響心情：綠葉菜、番茄對大腦有幫助，聞香料也能改善情緒。雞肉和蛋裡的「花生四烯酸」可能引起大腦發炎。情緒低落多吃綠葉菜、咖啡不加糖、多運動。（重度憂鬱請就醫）", "m": ["憂鬱與飲食", [["健康定義", ["身心社交全面"]], ["憂鬱症", ["持續數週", "失去興趣", "需重視"]], ["有益食物", ["綠葉菜", "番茄", "香料"]], ["花生四烯酸", ["雞肉蛋為主", "大腦發炎"]], ["建議", ["綠葉菜", "咖啡不加糖", "運動"]]]], "f": [["情緒低落", "持續數週需求助"], ["檢視飲食", "減少發炎食物"], ["多吃綠葉菜", "支持大腦化學"], ["運動", "天然的情緒調節"], ["身心健康", "必要時就醫"]], "p": [{"no": "070", "n": "辣木粉", "pr": "NT$450", "nd": ["植物營養", "抗氧化", "代謝"], "w": "辣木粉提供綠色植物營養，對應「情緒低落多吃綠葉菜」。"}, {"no": "002", "n": "EPA+DHA複方粉包", "pr": "NT$1350", "nd": ["腦神經", "心血管", "抗發炎"], "w": "EPA+DHA 支持腦神經與正常發炎調節。"}, {"no": "040", "n": "迷迭香滾珠瓶10ml", "pr": "NT$150", "nd": ["專注", "情緒"], "w": "迷迭香滾珠瓶：書中提到聞香料就能改善情緒狀態。"}], "a": [{"no": 64, "n": "情緒生命 OS 完整版", "u": "https://membership-app-e2147.web.app/lifeos/emotion-life-os-full.html", "cat": "情緒心理／信念療癒 / 心理", "w": "情緒生命 OS 完整版陪伴情緒低落（重度憂鬱請就醫）。"}, {"no": 69, "n": "身體訊號系統", "u": "https://membership-app-e2147.web.app/lifeos/body-signals.html", "cat": "醫學生／醫學健康 / 健康", "w": "身體訊號系統留意持續數週的低落訊號。"}]}, {"id": 144, "t": "😱乳腺癌是吃出來的，這篇筆記狠狠的閱讀", "d": "5/2/2025", "g": [], "b": "乳腺癌並非一朝一夕就形成的。你在某天早晨淋浴時發現的腫塊，可能從幾十年前就開始醞釀了。當醫生發現乳房腫瘤時，它可能已經存在了４０年，甚至更久。癌細胞會一直成長、成熟，並獲得數百種優勝劣汰的新基因突變，幫它快速成長，來破壞你的免疫系統。\n\n對乳腺癌來說，任何分量的酒精都不安全。\n\n致癌物並非酒精本身，罪魁禍首其實是一種叫乙醇的酒精毒性分解產物；當你喝了一小口酒之後，它幾乎立刻就在你的嘴巴里形成了。實驗證明，即使將一茶匙烈酒只含在嘴裡５秒鐘吐出來，所產生的乙醇也具有潛在的致癌程度，並會逗留超過１０分鐘。\n\n研究人員得到的結論是，紅酒可以“改善與酒精攝取有關的高乳腺癌風險”。換句話說，紅酒中的葡萄有助於抵消掉部分酒精的致癌作用。但是，我們有個更簡單又無害的做法：直接喝葡萄汁來取得跟喝紅酒一樣的功效，並避開相關的風險；或者更好的方法是直接吃黑葡萄或紫紅色的葡萄，最好是連子一起吃。因為這類顏色深的葡萄，似乎最能抑制雌激素合成酶的活性。\n\n運動對乳腺癌的影響。只有每週至少５次運動到出汗程度的女性，才能得到顯著的保護作用。不過，中強度的活動，也能提供跟高強度運動一樣的功效；比如，每天用中等速度走１小時。２０１３年的一項研究結果也證實，１天至少走路１小時，的確能顯著降低乳腺癌患病風險。\n\n告訴你降低膽固醇有多重要。膽固醇似乎是癌症的養分。在培養皿中，壞膽固醇會促進乳腺癌細胞的生長，這些癌細胞一口就吃掉了這些壞膽固醇。腫瘤可以吸收非常多的膽固醇，所以在癌症發展時，患者的膽固醇值常常會驟降。這不是個好的兆頭，當膽固醇吸收量達到最高時，病人的存活率往往是最低的。\n\n乳房腫瘤可能會利用隨著血液迴圈的高膽固醇。供給養分並加速生長。我們可以選擇足夠健康的蔬食來達到降低膽固醇的目的。\n\n結果顯示：每天吃蘋果的人，比起每天平均吃不到１蘋果的人，患乳腺癌的機率減少了２４％，而患卵巢癌、喉癌、結腸直腸癌的風險也明顯降低。即便排出這些受試者的其他蔬果攝取量，這樣的保護作用仍然存在，這顯示每天吃蘋果不僅是吃得更健康得一個指標而已。蘋果所提供得防癌效果，是因為它的抗氧化特性。蘋果得抗氧化物都集中在果皮上，這是由道理得：外皮是水果對抗外界侵害得第一道防線。一旦露出果肉，蘋果很快就會氧化變色。蘋果外皮的抗氧化能力，是果肉的２～６倍。吃蘋果，不要削皮。\n\n多吃綠葉菜來預防乳腺癌。", "c": "乳腺健康", "k": "乳癌不是一天形成的，發現時可能已經醞釀40年。酒任何量都不安全。紅酒的好處其實來自葡萄，直接吃深色葡萄（連籽）更好。每天快走1小時能降低風險。壞膽固醇是癌細胞的養分，要用蔬食降膽固醇。每天吃蘋果（不削皮）乳癌風險降24%，多吃綠葉菜。", "m": ["乳癌是吃出來的", [["長期醞釀", ["可達40年"]], ["酒精", ["任何量不安全"]], ["葡萄", ["深色連籽吃", "抑制雌激素合成酶"]], ["運動", ["每天快走1小時"]], ["膽固醇", ["癌細胞養分"]], ["蘋果", ["每天一顆-24%", "不削皮"]]]], "f": [["戒酒", "改吃深色葡萄"], ["每天一顆蘋果", "連皮吃"], ["多吃綠葉菜", "降膽固醇"], ["每天快走1小時", "降雌激素"], ["長期預防", "40年的累積"]], "p": [{"no": "079", "n": "憂遁草粉", "pr": "NT$750", "nd": ["植物營養", "抗氧化", "免疫", "代謝"], "w": "憂遁草粉提供植化素與抗氧化，作為植物營養補充。"}, {"no": "038", "n": "EGCG複方（茶多酚＋EGCG＋積雪草）", "pr": "NT$560", "nd": ["抗氧化", "代謝", "細胞保護"], "w": "EGCG 複方提供茶多酚抗氧化，對應「蘋果皮、深色葡萄」的植化素思路。"}, {"no": "029", "n": "口腔淨化養護精油組", "pr": "NT$1200", "nd": ["口腔", "牙齦"], "w": "口腔淨化精油組取代含酒精漱口水。"}], "a": [{"no": 68, "n": "抗癌系統", "u": "https://membership-app-e2147.web.app/lifeos/anticancer-system.html", "cat": "醫學生／醫學健康 / 醫療", "w": "抗癌系統整理飲食、運動與酒精的防護策略。"}, {"no": 86, "n": "癌症理解 APP", "u": "https://membership-app-e2147.web.app/lifeos/cancer-understanding-app.html", "cat": "醫學生／醫學健康 / 醫療", "w": "癌症理解 APP 理解膽固醇與乳癌的關係。"}]}, {"id": 145, "t": "腎結石與肉類的關係，請好好善待你的腎臟！", "d": "5/1/2025", "g": [], "b": "身負重任的腎臟天天都要全天候過濾血液，對這兩個拳頭般大小的器官來說，工作量非常大。腎臟雖然富有彈性，但並非堅不可摧。當它們開始出現問題時，你的身體也會同時開始垮掉。這會導致原本可以過濾掉並排出體外的有毒物質開始偷溜，並在血液中積聚。\n\n為了讓腎臟保持健康、讓血液中的雜質過濾乾淨，我們必須慎重選食物。\n\n腎結石：最常見的腎臟病之一。\n\n蔬食能鹼化尿液，也可能有助於和治療腎結石。當尿液中某些形成結石的物質濃度過高時就會開始結晶，在腎臟中形成堅硬的礦物質沉積，也就是腎結石。最後這些晶體可以累積到鵝卵石大小，阻斷尿流而引起劇烈疼痛，從一側下背部擴散到腹股溝。小的腎結石可以隨著尿液自然排出體外，但有些較大顆的結石，必須以手術去除。\n\n牛津大學的研究人員發現，完全不吃肉的受試者因為患腎結石住院的風險明顯較低；而那些肉食者，吃的肉越多，患腎結石的風險就越高。\n\n那麼那些肉類共更容易致病呢？患結石的人，通常會被建議限制紅肉的攝取量，但雞肉或魚肉呢？直到２０１４年另一項研究結果出爐，“我們”才有了答案。該研究分別比較了鮭魚、鱈魚、雞胸肉和漢堡對患腎結石的影響，結果發現，以相等量而言，魚肉比其他肉類更容易造成某些患腎結石。然而，更重要的結論是：整體而言，“應建減議有結石的人限制所有動物性蛋白的攝取。”\n\n減少動物性蛋白的另一個益處是可以減少尿酸堆積，尿酸堆積會成為鈣結石種子，本身也可能形成結石。事實上，尿酸結石是第二常見的腎結石型別。因此，為了降低風險，儘量減少過多尿酸的生成是有道理的。這可以透過兩種方來實現：一是吃藥，二是不吃或少吃肉。\n\n動物性食物含有磷，所含的磷是以一種稱為“磷酸鹽”的化合物形式存在的；而植物性食物所含的磷，主要以植酸的形式儲存的的。相對來說，磷酸鹽更容易被血液吸收。\n\n然而，要說磷酸鹽最糟糕的形式，莫過於作為食品新增劑的磷酸鹽。為了保鮮、增加口感及色澤，很多食物都會新增磷酸鹽。\n\n對肉品業來說，磷酸鹽新增劑特備重要。雞肉通常會注射磷酸鹽來增色、保水加重，還能減少“出水”問題。問題在於，這種新增劑會把肉品中的磷含量翻倍。對於無法正常排出磷的腎臟患者來說，磷酸鹽新增劑成了“潛伏的真正殺手”。\n\n要避開加工食品中的磷酸鹽新增劑，其實很簡單，就是不要購買任何成分中標有“磷酸鹽”的東西，包括焦磷酸鹽和三聚磷酸鈉。", "c": "腎臟健康", "k": "腎臟全天候過濾血液，壞了毒素會留在血液裡。腎結石是尿液裡某些物質太濃、結成晶體，大顆會很痛。研究發現吃肉越多腎結石風險越高，所以建議有結石的人限制所有動物蛋白，也能減少尿酸。加工食品裡的「磷酸鹽」添加物要避免，看到成分有磷酸鹽就別買。", "m": ["腎結石與肉類", [["腎臟", ["全天過濾"]], ["腎結石", ["尿中物質結晶", "劇痛"]], ["肉類", ["越多越高風險", "魚肉也會"]], ["尿酸", ["第二常見結石"]], ["磷酸鹽", ["動物性易吸收", "添加物最糟", "雞肉注射"]]]], "f": [["多吃肉", "動物蛋白"], ["尿酸、磷酸鹽增加", "尿液變酸"], ["結晶形成", "腎結石"], ["減少動物蛋白", "避開磷酸鹽添加物"], ["蔬食鹼化尿液", "預防結石"]], "p": [{"no": "006", "n": "專利HEZY氫鬆袋（買空袋送氫氧水）", "pr": "NT$250", "nd": ["氧化壓力", "修復", "能量"], "w": "氫鬆袋讓飲水更規律，充足飲水稀釋尿液、預防結石（限水者依醫囑）。"}, {"no": "093", "n": "蘆筍提取物（膠囊）", "pr": "NT$490", "nd": ["代謝", "循環", "排水"], "w": "蘆筍提取物支持代謝與排水節點。"}, {"no": "075", "n": "脾胃健／水循環（6g×30包）", "pr": "NT$530", "nd": ["脾胃", "消化", "水分平衡"], "w": "脾胃健／水循環支持水分平衡。"}], "a": [{"no": 92, "n": "醫療證據購物 OS", "u": "https://membership-app-e2147.web.app/platform/health-medicine/medical-evidence-shopping-os.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "醫療證據購物 OS 教你辨識「磷酸鹽」添加物。"}, {"no": 72, "n": "健康診斷系統", "u": "https://membership-app-e2147.web.app/lifeos/health-diagnosis.html", "cat": "醫學生／醫學健康 / 健康", "w": "健康診斷系統看懂尿酸與腎功能指標。"}]}, {"id": 146, "t": "✅預防血液性癌症看這篇筆記，太受用了！！", "d": "4/29/2025", "g": [], "b": "血液性癌症可分為３種型別：白血病、淋巴癌即骨髓瘤。白血病是白細胞生長異常的一種嚴重疾病，它們滯留在骨髓並失控地繁殖增生，不同於正常的白細胞，這些冒充者並沒有對抗的能力；反之，它們還會影響骨髓製造正常紅細胞的能力，減少健康細胞的數量，引發貧血和感染，並最終導致死亡。\n\n淋巴癌是淋巴細胞發生病變造成的血液性癌症。淋巴細胞是一種特殊的，分化增值很快的白細胞，聚集在遍佈全身的小型免疫器官——淋巴結中，包括腋下、頸部及腹股溝。淋巴結有過濾血液的功能，淋巴癌細胞會抑制健康細胞的生長，從而降低人體抵抗感染的能力。\n\n骨髓瘤，這是漿細胞發生病變的一種癌症，漿細胞是產生抗體的白細胞，抗體這種蛋白質會識別外來的入侵者和受到感染的細胞，然後處理活標記它們，以進一步消滅。癌變漿細胞在骨髓中會取代健康的細胞，並可能製造出異常的抗體，造成腎臟堵塞。９０％的骨髓瘤患者，體內的多種骨骼都有可能出現癌細胞，這種情況一般稱為多發性骨髓瘤。\n\n綠葉菜的抗癌效果：預防與zhi療癌症的關鍵，就是要防止腫瘤細胞失控繁殖，同時促進健康細胞的正常生長。hua療和放療消滅癌細胞的效果很出色，卻會誤傷健康的細胞，有趣的是，植物中的一些物質或許更能鑑別這兩者的不認同。\n\n以十字花科的蔬菜來說，在多種活性成分中有一種被為蘿蔔硫素的天然物質，在培養皿實驗中可以消滅人類的白細胞，同時又不危害正常細胞的生長。西蘭花、菜花和羽衣甘藍都是十字花科的蔬菜，這個大家族裡還有其他成員，例如甘藍葉、豆瓣菜、小白菜、大頭菜、黃色大偷菜、芝麻菜、蘿蔔、山葵以及所有品種的圓白菜。\n\n如果以每一塊錢能買到的抗氧化物為評分標準，選出最物超所值的抗氧化物，巴西莓只能獲得榮譽獎狀，順利擊敗核桃、蘋果和蔓越莓等明星食物。但最划算的銅牌呀頒給丁香，銀牌則要頒給肉桂。至於金牌，根據美國農業部給出的常見食物的相關的資料，價效比金牌當頒給紫甘藍，不過若論美味，巴西莓果昔是一絕。", "c": "抗癌飲食", "k": "血液癌症有三種：白血病（壞的白血球亂長）、淋巴癌（淋巴細胞病變）、骨髓瘤（做抗體的細胞病變）。十字花科蔬菜（花椰菜、高麗菜、羽衣甘藍、蘿蔔等）裡的「蘿蔔硫素」在實驗中能殺掉白血病細胞又不傷正常細胞。最划算的抗氧化食物：紫甘藍、肉桂、丁香。", "m": ["血液性癌症", [["白血病", ["白血球異常增生"]], ["淋巴癌", ["淋巴細胞病變"]], ["骨髓瘤", ["漿細胞病變", "異常抗體"]], ["十字花科", ["蘿蔔硫素", "花椰菜甘藍蘿蔔"]], ["划算抗氧化", ["金:紫甘藍", "銀:肉桂", "銅:丁香"]]]], "f": [["了解三種血癌", "白血病淋巴癌骨髓瘤"], ["每天十字花科", "蘿蔔硫素"], ["加入香料", "肉桂、丁香"], ["紫甘藍", "最划算抗氧化"], ["日常預防", "健康細胞正常生長"]], "p": [{"no": "079", "n": "憂遁草粉", "pr": "NT$750", "nd": ["植物營養", "抗氧化", "免疫", "代謝"], "w": "憂遁草粉提供植化素與抗氧化。"}, {"no": "089", "n": "巴西蘑菇（膠囊）", "pr": "NT$250", "nd": ["免疫", "保護"], "w": "巴西蘑菇聚焦免疫與保護節點。"}, {"no": "078", "n": "美寶（膠囊）", "pr": "NT$550", "nd": ["抗氧化", "細胞保護", "循環"], "w": "美寶聚焦抗氧化與細胞保護。"}], "a": [{"no": 87, "n": "癌症特徵 OS 完整版", "u": "https://membership-app-e2147.web.app/lifeos/cancer-hallmarks-os-complete.html", "cat": "醫學生／醫學健康 / 醫療", "w": "癌症特徵 OS 完整版理解白血病、淋巴癌與骨髓瘤。"}, {"no": 93, "n": "淋巴完整系統", "u": "https://membership-app-e2147.web.app/platform/health-medicine/lymphatic-complete-system.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "淋巴完整系統延伸了解淋巴與血液系統。"}]}, {"id": 147, "t": "走出舒適區，敢於超越，這本書能讓你醒悟！", "d": "4/25/2025", "g": [], "b": "你一直試圖待在你的舒適區裡。你努力使人物、事物、地點都符合你的心裡模式的期待。它們一旦偏離方向，你就會感到不舒服。你的大腦會變得活躍，對你說應該如何糾偏，使他們回到你的軌道上來。一旦你有人以你期望之外的方式行事，你的大腦就會開始說話。它會說“我該怎麼辦？我不能不管他的所作所為。我可以直接和他交涉，或者請別人和他談。”你的大腦叫你解決這件事。你最終會怎麼做並不重還要，重要的是回到你的舒適區。這個區域是有限的，所有要待在裡面的努力都會使你變得有限。你努力使事物侷限在你劃定的範圍之內，而超越總是意味著放棄這樣的努力。\n\n因此，你有兩種活法：你可以一生都待在你的舒適區內，你也可以創造自由。換言之，你可以把一生都花在努力確保一切都適合你的模式上，也可以致力於把你自己從你的模式中解放出來。\n\n走一趟動物園可以幫助你更好地理解這一點。假設你一直玩得很開心，直到你看見一支老虎被關在一個小籠子裡。這使你思考一個問題：如果你不得不在這麼小的空間裡度過餘生，會是什麼感受。這個想法使你極度恐懼。而實際上，你的舒適區恰恰打造了這樣一個籠子。這個內心的籠子並沒有限制你的軀體，它限制了你意識的延展。由於你走不出你的舒適區，你本質上是被囚禁起來了。\n\n仔細研究一下，你會發現，你願意待在籠子裡是因為你害怕。你熟悉你的舒適區，但對舒適區外的情況一無所知。要完全理解這一點，請假想一個你能想象到的最嚴重的妄想狂。他的內心充滿了恐懼，每時每刻都覺得有人要害他。如果你讓他住進那個籠子，他很可能會同意。他不會覺得自己被鎖進了籠子，他覺得那是在保護他，使他免受傷害。你覺得籠子像監獄，他卻覺得那是一個庇護所。如果安保人員來到你家，封上所有的門窗，你會做何反應？此刻如果你正好在家，你會驚慌失措地想逃出來，還是感謝他們讓你覺得安全？\n\n你想超越嗎？你想感覺不到界限嗎？設想一個非常寬廣的舒適區，它可以輕鬆地容納一天裡發生的任何事。這一天裡，大腦什麼也沒說。你懷著平和的、充滿靈感的心和這一互動著，即使你無意撞上了邊界，大腦也沒有抱怨。一切就這樣過去了。你將意識到你的一切都會很好，除了你的邊界，什麼也不會困擾你，而現在你也知道怎樣處理邊界了。最後你會喜歡上你的邊界，因為它們為你指出了通向自由的道路。你要做的就是不斷放鬆，像它們靠近，然後某一天在毫不經意間陷入無限。這就是超越。", "c": "心靈成長", "k": "我們一直想把人、事、物都控制在自己的舒適區裡，一不照我們想的就不舒服，大腦就開始吵著要「處理」。這樣其實是把自己關在籠子裡。有兩種活法：一輩子待在舒適區，或讓自己自由。碰到邊界時放鬆、靠近它，邊界會指引你通往自由。", "m": ["敢於超越", [["舒適區", ["要一切符合模式"]], ["大腦反應", ["偏離就想糾正"]], ["兩種活法", ["待在舒適區", "創造自由"]], ["老虎籠", ["內心的籠子", "因害怕而待著"]], ["超越", ["放鬆靠近邊界", "邊界指向自由"]]]], "f": [["事情偏離預期", "不舒服"], ["察覺大腦在吵", "我想糾正它"], ["放鬆", "不急著回舒適區"], ["靠近邊界", "擴大容納度"], ["超越", "創造自由"]], "p": [{"no": "023", "n": "行氣精油", "pr": "NT$1200", "nd": ["循環", "放鬆", "情緒"], "w": "行氣精油在碰到邊界時幫助放鬆。"}, {"no": "047", "n": "刺五加（膠囊）", "pr": "NT$495", "nd": ["壓力", "體力", "適應力"], "w": "刺五加支持適應力，走出舒適區更有韌性。"}], "a": [{"no": 12, "n": "典範升級 APP", "u": "https://membership-app-e2147.web.app/lifeos/paradigm-upgrade-app.html", "cat": "英文／語言學習 / 思維", "w": "典範升級 APP 從心理模式中解放自己。"}, {"no": 117, "n": "大腦更新系統", "u": "https://membership-app-e2147.web.app/lifeos/brain-update.html", "cat": "模型／系統／決策 / 大腦", "w": "大腦更新系統調整想把一切拉回舒適區的慣性。"}]}, {"id": 148, "t": "請一定要閱讀這本書，它曾經幫我走出低谷。", "d": "4/24/2025", "g": [], "b": "那些壓抑你的想法會時不時地抬頭。每到這個時候，你就應該放手。你只需要允許痛苦進入你的心靈，然後從那裡透過。如果你這樣做，它就會過去。如果你在真誠地尋求真理，那麼你每次都會選擇放手。放手這一過程的起點和終點是你讓自己完全投入到清空自己的過程。當你努力這麼做時，你將開始瞭解放手過程的各種微妙定律。\n\n在這場遊戲中，有一條定律你很早就能瞭解，因為它是一條不可避免的真理。你很早就會知道它，但是你會在堅持它的過程中摔倒很多次。這條定律非常明確：當你的問題被觸發時，立刻放手，因為以後放手只會更難。如果你去探索這個問題或者與它鬥智鬥勇，希望能借此減輕痛苦，它不會因此變得更容易解決。思考它，談論它，或者嘗試一次只釋放它的一部分，它也不會變得更容易解決。如果你想讓整個身心獲得自由，你就必須立刻放手，因為問題今後絕不會變得更容易解決。\n\n你必須知道，當你被幹擾時發生了什麼——你的意識之座墜落到干擾發生的地方，於是整個世界看起來都不一樣了。\n\n當你被拖進混亂的能量場時，墜落就開始。你最終將掉到你不該去的地方。那下面是你最不希望意識落入的地方，但它正是要被拖到那裡去。現在你透過被擾亂的能量向外看時，一切都被幹擾產生的陰霾扭曲了。原先看起來很美的事物，現在看起來去很醜陋。原先你喜歡的事物，現在看起來卻陰暗而壓抑。但是其實並沒有真正發生什麼了改變，只是你是在從那裡混亂的位置看待生活罷了。\n\n你每一次看法的轉變都是在提醒你放手。當你發現你不再喜歡以前的人了，當你發現你的人生面貌大不一樣了，當一切開始變得消極時——立刻放手。你以前可以深吸一口，但是你沒有。而現在放手變得更難了。你本可以深吸一口氣，在事情剛開始的時候放手。\n\n如果你不放手，你就會被吸進去。屆時你將不再自由。一旦你從相對清醒的位置墜落，你就要聽憑被擾亂的能量擺佈了。\n\n所以不要墜落，要放手。不管遇到什麼，都要放手。你遇到的事情越大，放手的回報越高；而如果不放手，你會摔得很慘。這件事情非黑即白：你要麼放手，要麼不放手，兩者之間沒有任何其他選擇。所以就讓你所有的阻塞物和干擾都成為旅途中的燃料吧。壓制你的事物可以成為一種強大的力量，把你託舉起來，只是你必須願意走上提升的道路。", "c": "心靈成長", "k": "讓你難過的想法冒出來時，就「放手」：讓痛苦經過你的心，然後離開。最重要的規則：一被觸發就立刻放手，拖越久越難放。被干擾時，你的心會「掉下去」，看什麼都變醜、變陰暗，其實世界沒變，只是你站的位置變了。所有阻礙都可以變成提升你的燃料。", "m": ["放手", [["方法", ["允許痛苦通過", "不抓住"]], ["定律", ["觸發時立刻放手", "之後更難"]], ["墜落", ["意識落入混亂", "世界看起來變醜"]], ["提醒訊號", ["看法改變時"]], ["燃料", ["阻礙托舉你"]]]], "f": [["問題被觸發", "情緒升起"], ["深吸一口氣", "立刻放手"], ["讓痛苦通過", "不探索不糾纏"], ["回到清醒位置", "世界恢復原貌"], ["阻礙成燃料", "提升自己"]], "p": [{"no": "054", "n": "GABA（膠囊）", "pr": "NT$540", "nd": ["睡眠", "情緒", "放鬆"], "w": "GABA 支持放鬆，問題被觸發時幫助立刻放手。"}, {"no": "023", "n": "行氣精油", "pr": "NT$1200", "nd": ["循環", "放鬆", "情緒"], "w": "行氣精油搭配深吸一口氣，練習放手。"}], "a": [{"no": 57, "n": "情緒煉金完整版", "u": "https://membership-app-e2147.web.app/lifeos/emotion-alchemy-complete.html", "cat": "情緒心理／信念療癒 / 心理", "w": "情緒煉金完整版把干擾轉成提升的燃料。"}, {"no": 51, "n": "Spirit Final 靈性系統", "u": "https://membership-app-e2147.web.app/lifeos/spirit-final.html", "cat": "基督信仰／靈性智慧 / 靈性", "w": "Spirit Final 靈性系統回到清醒的意識位置。"}]}, {"id": 149, "t": "肝炎有這些型別，小心得脂肪肝。好好養肝！", "d": "2025-04-23", "g": [], "b": "你可以靠一個腎活下去，也可以不靠脾臟和膽囊存活，甚至在沒有胃的情況下，你也能過下去。但是沒有肝臟這個人體最大的內部器官，你鐵定活不了。\n\n肝臟究竟有什麼作用呢？已多達５００種不同的功能，被認為是來自這個重要器官的貢獻。首先，肝臟扮演了貼身保鏢的角色，把不速之客阻擋在血液外。所有透過消化道吸收的物質，不會立刻進入整個身體迴圈。從腸道而來的血液，首先會到肝臟，在其中代謝營養物質並處理毒素。因此，你所吃的任何食物對於肝臟的健康，都至關重要。\n\n最常見的致病原因還是飲食不當：酒精性肝病和脂肪性肝病。\n\n酒精性肝病：飲酒過量會導致脂肪在肝臟種累積（脂肪肝），並進一步造成炎症，形成肝瘢痕，最終導致肝功能衰竭。通常戒酒可以遏制疾病的持續惡化，但有時可能已經為時已晚。\n\n大量飲酒可以在不到３周的時間引發脂肪肝，但通常在停歇後４～６周就會消失。然而，還是有５％～１５％的案例，儘管停止飲酒，病情仍然繼續發展，肝臟仍可能留下疤痕。\n\n避免酒精性肝病的最好策略，首先就是不要和太多酒。\n\n非酒精性肝病：脂肪肝最常見的原因不是酒精，而是非酒精性肝病。非酒精性肝病開始在肝臟堆積脂肪時，並沒有任何症狀。在極少數的情況下，可能會發展胃炎症，久而久之，會在肝臟形成疤痕，變成肝硬化的狀態，進而導致肝癌、肝衰竭，甚至是死亡。\n\n快餐式引發這種疾病最有效的推手，因為非酒精性脂肪肝於汽水、肉類的攝取量有關。僅僅每天喝一罐汽水，就能提高４５％脂肪肝的患病率。\n\n非酒精性脂肪肝也可能是由於膽固醇過載所致。雞蛋、肉類喝乳製品中的膳食膽固醇可能會氧化，然後引起連鎖反應，導致多餘的脂肪在肝臟中堆積。\n\n要避開肝臟疾病最常見的原因——非酒精性脂肪肝，最好的選擇，就是避免攝取過多的熱量、膽固醇、飽和脂肪，還有糖。\n\n病毒性肝炎。\n\n甲型肝炎主要是“糞口傳染”：食物或水被帶有病毒的糞便汙染後，再進入受感染者的口中；可以打疫苗，避免生飲生食，不吃未煮熟的貝類，以及處理食物的人在換尿布或如廁後都要徹底洗手來加以防範。\n\n乙型肝炎經由血液和性行為傳播的。也可以打疫苗預防。\n\n丁型肝炎是一種缺陷型病毒，只有患有乙肝的人才會得丁型肝炎。\n\n對於丙型肝炎還沒有疫苗可以預防。\n\n戊型肝炎病毒是目前被認為是一種人畜共通的傳染病，能夠從動物傳給人類，而豬可能是主要的病毒來源。\n\n因此當你煮豬肉時，記得使用肉了溫度計來確定已煮至熟透。", "c": "肝臟健康", "k": "沒有腎、脾、膽、胃都還能活，但沒有肝就不行。肝臟有500多種功能，是身體的「貼身保鑣」，腸道吸收的東西都先經過肝臟處理。脂肪肝常見原因是喝酒和快餐汽水。肝炎有甲乙丙丁戊五型，戊型可能來自豬，煮豬肉要用溫度計確認熟透。", "m": ["肝炎與脂肪肝", [["肝臟", ["最大內臟", "500種功能", "貼身保鑣"]], ["酒精性", ["3週成脂肪肝", "停酒可恢復"]], ["非酒精性", ["汽水+45%", "膽固醇過載"]], ["病毒性", ["甲糞口", "乙血液性", "丙無疫苗", "丁依附乙"]], ["戊型", ["人畜共通", "豬肉煮熟"]]]], "f": [["吃進的食物", "先經過肝臟"], ["肝臟處理", "代謝營養與毒素"], ["過量酒糖油", "脂肪肝"], ["病毒防護", "疫苗、熟食"], ["好好養肝", "避免肝硬化"]], "p": [{"no": "077", "n": "肝寶（膠囊）", "pr": "NT$550", "nd": ["肝臟", "解毒", "代謝"], "w": "肝寶聚焦肝臟、解毒與代謝節點。"}, {"no": "085", "n": "NAC複方（膠囊）", "pr": "NT$530", "nd": ["肝臟", "抗氧化", "呼吸道", "解毒"], "w": "NAC 複方支持肝臟與抗氧化。"}, {"no": "079", "n": "憂遁草粉", "pr": "NT$750", "nd": ["植物營養", "抗氧化", "免疫", "代謝"], "w": "憂遁草粉，群組常放在肝臟與抗氧化節點。"}], "a": [{"no": 72, "n": "健康診斷系統", "u": "https://membership-app-e2147.web.app/lifeos/health-diagnosis.html", "cat": "醫學生／醫學健康 / 健康", "w": "健康診斷系統看懂肝功能與肝炎檢查。"}, {"no": 88, "n": "整合醫學 OS 版本", "u": "https://membership-app-e2147.web.app/platform/health-medicine/integrated-medicine-os-variant.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "整合醫學 OS 理解肝臟的 500 種功能。"}]}, {"id": 150, "t": "✅逆轉糖尿病，這本書分享給有需要的人。", "d": "4/19/2025", "g": [], "b": "從１８７０年普法戰爭的巴黎圍城事件中，我們已經知道Ⅱ型糖尿病可以透過極端減少食物的攝取量加以逆轉。當時巴黎醫生記錄了在連續數週缺乏食物的情況下，葡萄糖是如何從Ⅱ型糖尿病患者的尿液裡的。糖尿病專家早就知道，意志堅定，成功減掉體重１／５的病人能夠逆轉糖尿病，讓代謝功能恢復正常。\n\n然而，除了餓肚子之外，我們能否找到更好的飲食方式來代替呢？如果糖尿病患者能採取更好的飲食方式，例如９０％以上蔬食，綠葉菜吃到飽，加上很多其他的蔬菜、豆類、全穀物、水果、堅果和種子，會怎樣呢？在一項初步研究中，１３位糖尿病患者被要求每天至少吃一份沙拉、一碗蔬菜豆子湯、一把堅果和種子，以及每餐都要吃水果，一碗煮熟的綠葉菜和一些油脂。然後，研究人員測量他們的糖化紅蛋白的濃度，這是用來評估一段時間內控制程度的最好指標。\n\n研究開始時，受試者的糖化血紅蛋白值平均為８.２。糖化學紅蛋白在５.７一下被認為是正常值，５.７～６.４被確認為是糖尿病前期，６.５以上則被認為以上則被認為糖尿病。美國糖尿病協會的目標，是讓大多數糖尿病患者的糖化血紅蛋白值降到７.０以下。\n\n經過約７個月全蔬食為主的飲食後，受試者的糖化血紅蛋白下降到了非糖尿病範圍的５.８，而且這是他們停止服用大多數藥物之後的結果。我們已經知道，低熱量飲食可以逆轉糖尿病，而現在我們知道，非常健康的飲食也能逆轉糖尿病，問題在於，是不是因為其熱量也很低呢？研究物件在採用富含蔬菜的飲食後，所減掉的體重，跟那些吃液體代餐、處於半飢餓狀態的人吃不多。不過，哪一種方式更健康呢？你是想選由糖、奶粉、玉米糖漿和油組成的減重代餐，還是選蔬食，不僅可以品嚐真正的食物，還能享受大快朵頤的快樂呢？\n\n事實上，早在３５年前，還真的有這樣一項研究。研究人員讓Ⅱ型糖尿病患者採用蔬食，然後每天量體重。如果體重開始減輕，就讓他們吃更多食物，甚至份量多到吃不完！結果是：即使沒有減重，蔬食者對胰島素的需求也減少了大約６０％。這代表這些糖尿病患者所需要注射的胰島素量減少了一半以上。此外，有一半的糖尿病患者完全不用再注射胰島素，他們的體重沒有變化，只是吃了比較健康的食物而已。\n\n／", "c": "控糖健康", "k": "歷史上發現，極度減少食物可以逆轉第二型糖尿病。但有更好的方法：吃90%以上的蔬食，綠葉菜吃到飽。研究中13位患者7個月後，糖化血色素從8.2降到5.8（正常範圍），還停掉大部分藥物。另一研究中，即使沒減重，蔬食者胰島素需求也減少約60%。（調整用藥請與醫師配合）", "m": ["逆轉糖尿病", [["歷史", ["巴黎圍城", "減重1/5可逆轉"]], ["蔬食方案", ["沙拉", "蔬菜豆湯", "堅果種子", "每餐水果"]], ["HbA1c", ["正常<5.7", "前期5.7-6.4", "糖尿病≥6.5"]], ["研究1", ["8.2→5.8", "停多數藥物"]], ["研究2", ["不減重", "胰島素需求-60%"]]]], "f": [["檢測HbA1c", "了解起點"], ["90%蔬食", "綠葉菜吃到飽"], ["每日固定", "沙拉＋豆湯＋堅果"], ["與醫師配合", "調整藥物"], ["HbA1c下降", "逆轉可能"]], "p": [{"no": "084", "n": "黃連素／小蘗鹼（膠囊）", "pr": "NT$560", "nd": ["血糖", "腸道", "代謝"], "w": "黃連素支持血糖代謝與胰島素訊號。"}, {"no": "083", "n": "苦瓜皂甘複方", "pr": "NT$540", "nd": ["血糖", "代謝", "胰島"], "w": "苦瓜皂甘複方支持血糖與胰島節點。"}, {"no": "070", "n": "辣木粉", "pr": "NT$450", "nd": ["植物營養", "抗氧化", "代謝"], "w": "辣木粉提供綠色植物營養，配合「綠葉菜吃到飽」（調整用藥請與醫師配合）。"}], "a": [{"no": 91, "n": "代謝控制儀表板", "u": "https://membership-app-e2147.web.app/platform/health-medicine/metabolic-control-dashboard.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "代謝控制儀表板追蹤糖化血色素與血糖。"}, {"no": 77, "n": "節律營養系統", "u": "https://membership-app-e2147.web.app/lifeos/rhythm-nutrients.html", "cat": "醫學生／醫學健康 / 健康", "w": "節律營養系統規劃 90% 蔬食的每日餐點。"}]}, {"id": 151, "t": "關於減重很重要的一件事，所有女生學起來！", "d": "4/18/2025", "g": [], "b": "如果你像許多患有內分泌疾病的女性一樣在為額外增加的2千克、4千克、8千克體重而掙扎。無論是你吃得更少還是運動得更多，這些多餘的體重就是絲毫不下降。這是不是聽起來很熟悉？好吧，當你知道這源於生理原因時，你可能會鬆一口氣，而當你發現有辦法解決這個問題時，你會更鬆一口氣。\n\n(你不用再執行瘋狂的剝奪性飲食法或進行更鬆一口氣。超高強度的魔鬼鍛鍊!)\n\n問題的根源在肝臟。正如我們所看到的，肝臟負責將脂溶性毒素轉換為水溶性毒素，這些毒素就可以透過大腸、肝臟和皮膚排出體外。然而，當你有激素問題時，你的肝臟功能受損（通常是你的排毒通路被堵塞了）。這意味著你的肝臟不能像它之前正常時那樣有效地工作，因此它清除毒素的速度跟不上毒素的累積的速度。\n\n你的身體透過將這些脂溶性毒素儲存到其他地方來應對這個問題。你猜時哪裡？答案就是你的脂肪組織裡。目前來說，這樣做可以保護你的肝臟，因為肝臟裡的毒素負荷被降至最低。然而，這導致減重變得更間困難。你的脂肪細胞不想釋放這些毒素，因為你的身體知道這樣做會使你的血液受到汙染，使心臟、腦等器官的環境變得具有毒性。因此最終結果就是你的脂肪細胞帶著這些毒素，而你的身體則帶著這些脂肪細胞。\n\n幸運的是，有一種方法客戶以讓你的身體將這些極其頑固的脂肪燃燒掉：透過食物和補劑增加維生素Ａ、維生素Ｂ、維生素Ｃ、羅布硫素和抗氧化劑谷胱甘肽的攝入量——這些都是肝臟有效排毒所需的營養素。幫助肝臟恢復正常功能，可以防止這些毒素的堆積，並阻止脂肪堆積在腰腹部。\n\n以下是能幫助你實現這一目標的方法： 多食用蕓薹蔬菜：捲心菜、花椰菜、西蘭花、抱子甘藍和其他甘藍類蔬菜。試著每一天的每一餐中加入至少一種蕓薹蔬菜。還可以把它們新增到你常喝的果昔和果汁中。\n\n多食用檸檬和柑橘。在水中加入新鮮的檸檬。然而，並不是所有的柑橘豆有助於肝臟排毒＿＿葡萄抽含有一種阻礙肝臟的酶，所以在你努力使肝臟排毒功能恢復正常的過程中要避免使用它。", "c": "女性健康", "k": "有些女生吃更少、動更多，體重還是不降，原因可能在肝臟。肝臟排毒能力變差時，身體會把油溶性毒素先藏在脂肪裡保護器官，所以脂肪不肯走。方法是補充肝臟排毒需要的營養：維生素A、B、C、蘿蔔硫素、穀胱甘肽。每餐吃十字花科蔬菜，水裡加檸檬（但避免葡萄柚）。", "m": ["頑固體重與肝臟", [["現象", ["少吃多動仍不降"]], ["根源", ["肝臟排毒受損"]], ["毒素去向", ["存進脂肪組織", "脂肪不願釋放"]], ["營養素", ["維生素A B C", "蘿蔔硫素", "穀胱甘肽"]], ["吃法", ["每餐十字花科", "檸檬水", "避開葡萄柚"]]]], "f": [["肝臟排毒慢", "毒素累積"], ["毒素存脂肪", "保護器官"], ["脂肪頑固", "減重困難"], ["補肝臟營養", "十字花科、檸檬"], ["排毒恢復", "脂肪燃燒"]], "p": [{"no": "077", "n": "肝寶（膠囊）", "pr": "NT$550", "nd": ["肝臟", "解毒", "代謝"], "w": "肝寶聚焦肝臟解毒與代謝，支持頑固脂肪背後的肝臟排毒。"}, {"no": "085", "n": "NAC複方（膠囊）", "pr": "NT$530", "nd": ["肝臟", "抗氧化", "呼吸道", "解毒"], "w": "NAC 複方提供穀胱甘肽原料，書中點名的肝臟排毒營養素。"}, {"no": "072", "n": "蝦紅素200mcg＋硒200mcg（錠）", "pr": "NT$530", "nd": ["眼睛", "抗氧化", "肌膚"], "w": "蝦紅素＋硒提供抗氧化，支持肝臟第二階段排毒。"}], "a": [{"no": 91, "n": "代謝控制儀表板", "u": "https://membership-app-e2147.web.app/platform/health-medicine/metabolic-control-dashboard.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "代謝控制儀表板追蹤體重變化。"}, {"no": 71, "n": "功能健康系統", "u": "https://membership-app-e2147.web.app/lifeos/functional-health-system.html", "cat": "醫學生／醫學健康 / 健康", "w": "功能健康系統理解激素、肝臟與減重的關係。"}]}];

    const c = HUES[n.c] || "#888", open = openSet.has(n.id);
    return `<article class="item${open?" open":""}" data-id="${n.id}" style="--c:${c}">
      <div class="head"><div class="num">${n.id}</div><div class="ht"><b>${hl(n.t)}</b>
      <div class="meta"><span class="tag" style="color:${c};border-color:${c}">${esc(n.c)}</span>${n.d?`<span>${esc(n.d)}</span>`:""}<span>${esc(n.m[0])}</span></div></div><div class="caret">▶</div></div>
      <div class="body">${open ? detail(n) : ""}</div></article>`;
  }).join("") : `<div class="empty">找不到符合「${esc(q)}」的筆記</div>`;
}
function buildChips(){
  const cnt = {};
  DATA.forEach(n => cnt[n.c] = (cnt[n.c]||0)+1);
  const cats = ["全部", ...Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])];
  $("#chips").innerHTML = cats.map(c => `<button class="chip${c===cat?" on":""}" data-c="${esc(c)}">${esc(c)} ${c==="全部"?DATA.length:cnt[c]}</button>`).join("");
}
$("#chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if(!b) return;
  cat = b.dataset.c; buildChips(); render();
});
$("#list").addEventListener("click", e => {
  const h = e.target.closest(".head"); if(!h) return;
  const el = h.parentElement, id = +el.dataset.id, n = DATA.find(x => x.id===id);
  if(openSet.has(id)){ openSet.delete(id); el.classList.remove("open"); el.querySelector(".body").innerHTML = ""; }
  else { openSet.add(id); el.querySelector(".body").innerHTML = detail(n); el.classList.add("open"); }
});
let timer;
$("#q").addEventListener("input", e => { clearTimeout(timer); timer = setTimeout(() => { q = e.target.value.trim(); render(); }, 150); });
$("#all").addEventListener("click", () => {
  const shown = [...document.querySelectorAll(".item")].map(el => +el.dataset.id);
  const allOpen = shown.every(id => openSet.has(id));
  shown.forEach(id => allOpen ? openSet.delete(id) : openSet.add(id));
  $("#all").textContent = allOpen ? "全部展開" : "全部收合";
  render();
});
$("#theme").addEventListener("click", () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
  try{ localStorage.setItem("zzyd-theme", r.dataset.theme); }catch(_){}
});
try{ const t = localStorage.getItem("zzyd-theme"); if(t) document.documentElement.dataset.theme = t; }catch(_){}
document.addEventListener("keydown", e => { if(e.key==="/" && document.activeElement!==$("#q")){ e.preventDefault(); $("#q").focus(); } });
buildChips(); render();
</script>
</body>
</html>
