"食物中的營養物質", "蛋白質", "健康養生", "蛋白質攝入"], "b": "已有愈來愈多的醫學和營養學專家認同最佳蛋白質的來源是植物，而非動物。動物性蛋白質如果攝取過量也可能造成身體負擔。\n\n蛋白質由氨基酸組成，在建造人體組織的２３種氨基酸中，有１５種能有人體自行合成，其餘８種則稱為“必需氨基酸”，必需自食物中取得。不同於一般的想法是，這８種必需氨基酸都可以由蔬果種取得。\n\n同時擁有這８種氨基酸的蔬果包括胡羅卜、抱子甘藍；芽菜；甘藍菜、白色菜花；玉米、小黃瓜、茄子、羽衣甘藍、秋葵、豆類、馬鈴薯、節瓜、地西紅柿以及香蕉。\n\n不過，真的必需每一餐同時攝取這８種氨基酸嗎？答案當然不是。氨基酸會在體內迴圈，共給有需求的細胞使用。只要體內氨基酸的存量足夠，並不需要在每一餐補充。\n\n每餐都搭配蛋白質食物其實是不必要的。當今傑出的營養專家都倡導三餐應該簡單，食材並不需要搭配得很複雜，例如攝取澱粉類食物同時搭配蛋白質，反而會干擾正常的消化過程。\n\n愈來愈多的動物性試驗證明，動物性蛋白質與部分疾病的發生率提高有關。其實人體的消化系統設計，並不是為了消化動物性蛋白。舉例來說，人類得的牙齒與肉食性動物構造上不同，唾液也不一樣。我們的口水偏鹼，正好能消化來自植物的碳水化合物；而肉食性動物的口水是酸性，酸度足以溶解骨頭。此外，葷食所產生的膽固醇和尿酸，始終對人體是一大負擔。\n\n在腸道部分，肉食動物的腸道很短，約只有人類消化腸道的１／３－１／４，這讓它們能在肉類開始腐敗前，將殘渣快速排出。所有草食性動物，都有很長的腸道，讓身體由足夠的時間來消化吸收植物性食物所含的營養，人類也如此。\n\n事實上，所有蛋白質最初都來自植物，問題在於我們要直接從植物攝取，還是從動物身上輾轉攝取。“我”的建議是和當今傑出營養學者所提供的建議一樣，蛋白質最佳來源還是來自新鮮的植物性食物。烹飪過的動物性蛋白，失去了維持健康生活所需正確能量波動。\n\n動物蛋白質經過烹飪不僅含有較多致突變性（毒素，化學物造成細胞內儲存基因資訊之ＤＮＡ在複製過程中改變了遺傳特性），而且變得更難消化，不僅壞化人體腸道菌種平衡，同時增加人體腸道負擔。\n\n究竟我們應該攝取多少蛋白質？\n羅賓斯在《新美國飲食》一書中指出，多年來人們誤以為大量蛋白質是必需，然而一日所需的蛋白質不會超過２５～３５克。", "c": "營養素", "k": "蛋白質是由胺基酸組成的，其中8種必需胺基酸蔬菜豆類都能找到。不需要每餐都吃蛋白質，因為身體裡有胺基酸「庫存」。作者認為植物是更好的蛋白質來源，動物蛋白高溫烹調後更難消化，每天需求量也沒有想像中那麼多。", "m": ["植物蛋白質", [["胺基酸", ["23種", "8種必需"]], ["植物來源", ["豆類", "花椰菜甘藍", "玉米馬鈴薯"]], ["胺基酸池", ["不需每餐補"]], ["動物蛋白", ["膽固醇尿酸", "烹調後難消化"]], ["需求量", ["每日25-35克（作者觀點）"]]]], "f": [["選植物蛋白", "豆類蔬菜"], ["胺基酸入池", "體內循環"], ["細胞取用", "不必每餐搭配"], ["減少負擔", "少膽固醇尿酸"], ["消化輕盈", "菌相平衡"]], "p": [{"no": "034", "n": "胺基酸可可粉包", "pr": "NT$780", "nd": ["肌肉", "能量"], "w": "胺基酸可可粉提供胺基酸，作為植物飲食之外方便的胺基酸補充。"}, {"no": "035", "n": "全酶", "pr": "NT$880", "nd": ["消化", "吸收"], "w": "全酶支持蛋白質分解與吸收，讓吃進去的蛋白質更好消化。"}, {"no": "070", "n": "辣木粉", "pr": "NT$450", "nd": ["植物營養", "抗氧化", "代謝"], "w": "辣木粉是植物營養來源，含多種胺基酸與植化素。"}], "a": [{"no": 71, "n": "功能健康系統", "u": "https://membership-app-e2147.web.app/lifeos/functional-health-system.html", "cat": "醫學生／醫學健康 / 健康", "w": "功能健康系統理解必需胺基酸與胺基酸池。"}, {"no": 67, "n": "健康負熵 APP", "u": "https://membership-app-e2147.web.app/lifeos/health-negentropy-app.html", "cat": "醫學生／醫學健康 / 健康", "w": "健康負熵 APP 規劃植物蛋白為主的餐點。"}]}, {"id": 41, "t": "便秘的集合！！這篇筆記狠狠的閱讀！！！！", "d": "4月6日", "g": ["便秘", "消化道", "腸道"], "b": "一般人一生中大約有１／２０的機率會患結腸直腸癌。慶幸的是，這是最容易治療的　癌症之一，透過定期檢查，醫生能夠在癌細胞擴散之前，檢測並清除它們。\n\n然而，早期階段的結腸直腸癌很少有症狀。假如這種癌症一直到後期才發現，治療上會更加困難，且效果有限。從５０～７５歲，我們每年都應該做糞便檢查，或至少每３年做１次，再加上每５年做１次乙狀結腸鏡檢查，或每１０年做１次大腸鏡檢查，才能早期發現、早期治療。\n\n糞便粗細學問大：排便越多越勤，身體可能越健康。一項跨越十幾個國家、２３個族群的研究顯示，當每日平均排便的重量下降到低於０.５磅時，大腸癌的發病率就會扶搖直上；而每天排便量只有０.２５磅的人，患大腸癌的機率時其他人的３倍。你可以買個簡單的稱來測量你的排便量。你可能誤會了，不是你想的那樣，你要測量的是自己排便前及排便後的體重。\n\n排便的粗細和大腸癌的關聯，則跟“腸道運送時間”有關，也就是食物從進入嘴巴到排進馬桶所需要的時間。糞便越粗，運送時間就越快，因為這會使腸子更容易蠕動。很多人往往沒有意識到，即使每天排便也有可能是便秘；因為你今天沖掉的大便，很可能是你上週所吃的食物殘渣。\n\n食物從身體的一段進入另一端排出，需要多花多長時間，可能取決於性別和飲食習慣。採用蔬食的男性，吃進去的食物會在短短一兩天內透過身體，而主要採取傳統飲食的男性，腸道運動時間則是５天以上。採用蔬食的女性，腸道運送時間也是１～２天，但多數採用傳統飲食的女性，腸道運送時間平均是４天左右。因此，你以為的規律排便可能已推遲了４天。想要測量自己的腸道運送時間，可以試著吃一些甜菜根，然後記錄大便是什麼時候變成了粉紅色。如果這個時間為２４～３６小時，你可能就符合了每日排便半磅的健康目標。\n\n便秘是美國最常見的胃腸道困擾，每年有數百萬人為此求醫。便秘除了不舒服之外，為了讓又小又硬的糞便排出時過度用力，可能也會導致一連串的健康問題，包括橫膈膜疝氣、靜脈曲張、痔瘡，以及肛裂等嚴重症狀。\n\n便秘被認為時一種營養不良的病症，所欠的營養素之一就就是膳食纖維。就像是維生素Ｃ攝取不足可能會得壞血病一樣，沒能攝取足夠的膳食纖維就可能導致便秘。由於膳食纖維只存在於植物性食物中，因此吃下越多植物就越不可能便秘密。", "c": "腸道健康", "k": "每天都有大便不代表沒便秘，可能沖掉的是上週吃的東西！吃蔬菜的人食物1~2天就排出，一般飲食要4~5天。可以吃甜菜根，看多久大便變粉紅色來測試。便秘主要是纖維不夠，纖維只有植物才有。", "m": ["便秘", [["大腸癌", ["1/20機率", "定期篩檢"]], ["排便量", ["每天≥半磅", "太少風險3倍"]], ["運送時間", ["蔬食1-2天", "一般4-5天"]], ["自我測試", ["甜菜根變粉紅"]], ["原因", ["缺膳食纖維"]]]], "f": [["吃甜菜根", "開始計時"], ["觀察糞便", "變粉紅的時間"], ["24-36小時", "健康"], ["超過3天", "增加纖維"], ["定期篩檢", "糞便潛血/大腸鏡"]], "p": [{"no": "033", "n": "亞麻仁籽渣（2包）", "pr": "NT$198", "nd": ["腸道", "膳食纖維"], "w": "亞麻仁籽渣增加糞便體積，幫助縮短腸道運送時間、排便更順。"}, {"no": "096", "n": "孢子益生菌（加亞麻仁渣）（6g×30包）", "pr": "NT$650", "nd": ["菌相", "腸道", "免疫"], "w": "孢子益生菌加亞麻仁渣，纖維加好菌一起改善便秘。"}, {"no": "081", "n": "5R腸胃營養素（6g×30包）", "pr": "NT$750", "nd": ["腸道", "腸黏膜", "消化", "修復"], "w": "5R 腸胃營養素支持腸黏膜與消化節點。"}], "a": [{"no": 69, "n": "身體訊號系統", "u": "https://membership-app-e2147.web.app/lifeos/body-signals.html", "cat": "醫學生／醫學健康 / 健康", "w": "身體訊號系統用排便量與甜菜根測試讀懂腸道訊號。"}, {"no": 72, "n": "健康診斷系統", "u": "https://membership-app-e2147.web.app/lifeos/health-diagnosis.html", "cat": "醫學生／醫學健康 / 健康", "w": "健康診斷系統提醒大腸癌篩檢時程。"}]}, {"id": 42, "t": "關於顯化這本書狠狠的閱讀！！太太受益了！", "d": "3月31日", "g": ["目標導向思維", "顯化", "成長"], "b": "請記住，對抗和否認不是強大。真正的強大是接納，是允許一切發生，並學會重塑思維。如果你交往了４個月的物件莫名其妙地離開了你，那麼請你接受他不是你的“”真命天子‘的事實；如果計劃在最後一刻落空了，那就說明這就是註定的。在顯化過程中，有時你需要拍拍身上的灰塵，站得更高些，從經歷中汲取所有有價值的經驗，因為你知道總會有你需要學習的功課，總會有更好的事物在其他地方等著你。\n\n選擇能力是最強大的顯化工具之一。你可以選擇創造什麼樣的願景，執著於什麼樣的想法，願意與誰共度時光，如何分配精力，接受別人的哪些行為，消除哪些恐懼和疑慮，以及如何應對考驗。你所做的選擇決定了你會成為什麼樣的人，也決定了你能在生活中顯化什麼樣的事物。\n\n當事情沒有朝著你期望的方向發展時，其實是你為自己挺身而出的最佳機會，你可以抓住這個機會同時提升內在力量、韌性和勇氣。\n\n你需要將富足的心態運用到生活的每一件事上，這樣才能顯化你真正的願望。把那些不適合你的東西放回原處吧，你值得擁有那些真正適合你的東西。\n\n要讓你想顯化的事物進入你的生活，你就要心裡劃定界限。每當你有機會遠離不再對你有益的人或事時，請抓住這些機會。你必須清除障礙，才能輕鬆地遇見夢想中的自己。\n\n記住，要顯化你想要的事物，你就必須相信自己值得擁有它，你的行為也必須與這信念保持一致。\n\n成為一個可以輕鬆顯化夢想的人，關鍵就在於“不將就”。", "c": "顯化法則", "k": "真正的強大不是硬撐或否認，而是接受事情發生、從中學習。你可以選擇自己要想什麼、跟誰在一起、把力氣花在哪裡。不適合你的東西就放下，劃好界線，遠離消耗你的人。重點是「不將就」，相信自己值得更好的。", "m": ["顯化：不將就", [["接納", ["允許一切發生", "重塑思維"]], ["選擇力", ["願景", "想法", "相處的人", "精力分配"]], ["逆境", ["挺身而出的機會", "提升韌性"]], ["界線", ["遠離無益的人事"]], ["關鍵", ["相信值得", "行為一致", "不將就"]]]], "f": [["事情不如意", "接納不否認"], ["汲取經驗", "找出功課"], ["做出選擇", "放下不適合的"], ["劃定界線", "遠離消耗"], ["顯化", "遇見更好的"]], "p": [{"no": "028", "n": "心膚精油特價組", "pr": "NT$1200", "nd": ["情緒", "放鬆", "肌膚"], "w": "心膚精油組陪你接納與放下，在劃界線的時刻讓心更穩。"}, {"no": "023", "n": "行氣精油", "pr": "NT$1200", "nd": ["循環", "放鬆", "情緒"], "w": "行氣精油搭配深呼吸，事情不如預期時從經驗中站起來。"}], "a": [{"no": 102, "n": "人生顯化系統", "u": "https://valaivai087-ops.github.io/lifemanifastify/", "cat": "能力養成／自律行動 / 顯化", "w": "人生顯化系統對應「不將就」，整理選擇與界線。"}, {"no": 99, "n": "倫理關係 OS", "u": "https://membership-app-e2147.web.app/lifeos/ethical-relationship-os.html", "cat": "關係／婚姻／溝通 / 關係", "w": "倫理關係 OS 幫你判斷哪些關係該遠離、哪些該保留。"}]}, {"id": 43, "t": "關於心梗這篇筆記講的太清楚了！必讀篇！！", "d": "3月30日", "g": ["心臟", "健康知識", "心臟病", "心梗"], "b": "對於大多數習慣傳統飲食的美國人而言，斑塊會在冠狀動脈中積累。這種斑塊沉積，成為“動脈粥樣硬化”，是由富含膽固醇的黏性物質在血管中堆積所造成的。這個過程歷經數十年，在動脈裡慢慢累積，使血液流動的路徑變窄。當人們要使力時，由於到達心肌的血液迴圈受到限制，嚴重到一定程度時，可能會導致胸痛和壓迫感，這種症狀稱為心絞痛。如果斑塊破裂，就會在血管內形成血栓。突如其來的這種血管阻塞可能引發心肌梗死（俗稱心臟病發作），造成部分心臟損害，甚至壞死。\n\n對於突然死於心臟病的美國人而言，他們最初症狀，也可能成為最後的徵兆。這就是所謂的“心源性猝死”，患者在症狀發作後的一個小時內死亡。換句話說，有時在你知道自己是高風險人群之前，就為時已晚了。你可能在前一刻還覺得無病無痛，然後在下一個小時，就與世長辭。這就是為什麼事先防治對心臟病來說如此重要，甚至要趕在你知道自己患病之前。\n\n魚肝油膠囊已成成為價值數十億美元的產業，這要部分歸功於美國心臟病協會的建議：心臟病高危人群應向醫生諮詢是否補充ω－３魚肝油。現在，我們每年消耗魚肝油總量，已超過１０萬噸。\n\n但科學證據是怎麼說的？魚肝油對預防和治療心臟病所承的種種好處，難道只是傳說？一篇發表在《美國醫學協會期刊》的系統回顧和整合分析報告中，統計了所有最佳隨機臨床試驗，用以ω－３脂肪酸對於壽命長短、心因性死亡、猝死、心肌梗死和中風的影響。該研究不僅包括了補充魚肝油的效果，也包含了建議人們多吃富含脂肪魚類的影響。他們有什麼發現？整體而言，研究人員在總體死亡率、心臟病死亡率、心因性猝死、心肌梗死或中風等方面，並沒有發現魚肝油的保護效益。\n\n《美國心臟病學期刊》的主編威廉．羅伯茨認為，動脈粥樣硬化斑塊堆積的唯一原因致命風險因素就是膽固醇，尤其是血液中升高的壞膽固醇。事實上，壞膽固醇是所以被稱為“壞膽固醇”，就是因為它是膽固醇沉積到動脈中的載體。\n\n為了有效降低壞膽固醇，你需要大幅度降低３樣東西的攝取量：①反式脂肪，存在於加工食品、天然肉食品及乳製品之中；②飽和脂肪，主要存在於動物性食品及“垃圾食品”中；③膳食膽固醇，來源於動物性食品，特別是雞蛋。", "c": "心血管健康", "k": "血管裡的斑塊是幾十年慢慢堆起來的，讓血管變窄。如果斑塊破掉就會形成血塊，突然塞住血管，就是心肌梗塞，有些人第一次發作就很危險。研究發現魚油沒有明顯保護效果；真正要降的是壞膽固醇，少吃反式脂肪、飽和脂肪和膳食膽固醇。", "m": ["心肌梗塞", [["動脈粥樣硬化", ["斑塊數十年累積", "血管變窄"]], ["心絞痛", ["用力時胸痛"]], ["心梗", ["斑塊破裂", "血栓阻塞"]], ["魚油研究", ["未見保護效益"]], ["降LDL", ["少反式脂肪", "少飽和脂肪", "少膽固醇"]]]], "f": [["飲食膽固醇脂肪", "LDL升高"], ["斑塊累積", "數十年"], ["血管狹窄", "心絞痛"], ["斑塊破裂", "血栓→心梗"], ["預防", "提前降LDL"]], "p": [{"no": "052", "n": "血循環", "pr": "NT$1350", "nd": ["循環", "心血管", "末梢循環"], "w": "血循環聚焦心血管與末梢循環，支持血液流動。"}, {"no": "055", "n": "地龍蛋白複方（膠囊）", "pr": "NT$550", "nd": ["循環", "心血管"], "w": "地龍蛋白複方定位循環與心血管節點，作為循環保養補充（用抗凝血藥者先問醫師）。"}, {"no": "063", "n": "甜菜鹼TMG（膠囊）", "pr": "NT$490", "nd": ["甲基化", "肝臟", "心血管"], "w": "甜菜鹼 TMG 支持甲基化與心血管節點。"}], "a": [{"no": 72, "n": "健康診斷系統", "u": "https://membership-app-e2147.web.app/lifeos/health-diagnosis.html", "cat": "醫學生／醫學健康 / 健康", "w": "健康診斷系統看懂 LDL 與心血管風險指標。"}, {"no": 88, "n": "整合醫學 OS 版本", "u": "https://membership-app-e2147.web.app/platform/health-medicine/integrated-medicine-os-variant.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "整合醫學 OS 理解斑塊形成與心肌梗塞。"}]}, {"id": 44, "t": "幫你走出舒適區的四個方法，太太太實用了！", "d": "3月25日", "g": ["改變潛意識", "顯化", "成功", "習慣", "成長", "自我成長"], "b": "要想顯化改變，就要先創造改變。你需要做一些與以往不同的事情，向自身的恐懼和疑慮發起挑戰，你需要向未來的自己那樣行動，你需要向潛意識展示你準備得有多充分，你有多渴望成為更愛強大的自己。\n\n在顯化任何事情的旅程中，走出舒適區都是必經之路。每次走出舒適區，你都會為自己吸引來富足，因為奇蹟發生在舒適區之外。\n\n以下幾種方法可以幫助你走出舒適區，解鎖你的顯化能力。\n① 明確原因。在走出舒適區之前，你要先弄清楚自己為什麼要這麼做。“為什麼”是克服不舒適感的動力。“為什麼”能讓你專注於情景，並在你在面對挑戰和困難時充滿動力。\n\n② 不找藉口。找藉口是一種自我破壞的形式，它試圖給你一個“出路”。你必須揭露藉口的真面目：它們是恐懼和疑慮的表現。當你意識地覺得自己還沒有準備好時，藉口就會出現，阻礙你前進和發揮自己的能力。消除藉口的方法就是全方位質疑它，從而卸掉藉口的力量。\n\n③ 面對挑戰，永不放棄。走出舒適區，你會發現一切都是新的，這意味著你會不可避免地遇到一些需要克服的障礙。成功人士最明顯的共同特點之一，就是面對挑戰具有永不放棄的決定和力量。\n\n④ “５秒法則”。每當有機會走出舒適區，但感到恐懼時，你就可以用這個方法。梅爾說：“當你產生走出舒適區的直覺又感到猶豫不決時，就是你使用５秒法則的時候”。你有５秒的時間，從５數到１，在數到０之前行動。梅爾說：“你如果有為某個目標採取行動的衝動，就必須在５秒內行動起來，否則你的大腦就會扼殺這種衝動。", "c": "自我成長", "k": "想要改變，就要先做和以前不一樣的事。奇蹟在舒適圈外面！四個方法：1.想清楚為什麼要做；2.不找藉口（藉口其實是害怕）；3.遇到困難不放棄；4.五秒法則：想做就從5數到1，數完馬上行動，不然大腦會把衝動殺掉。", "m": ["走出舒適區", [["為何要走", ["奇蹟在舒適區外", "創造改變"]], ["方法1", ["明確原因"]], ["方法2", ["不找藉口", "藉口=恐懼"]], ["方法3", ["面對挑戰不放棄"]], ["方法4", ["5秒法則", "5-4-3-2-1行動"]]]], "f": [["想到要行動", "直覺冒出"], ["5-4-3-2-1", "倒數"], ["立刻行動", "不給大腦扼殺"], ["遇到障礙", "不找藉口不放棄"], ["突破舒適區", "吸引富足"]], "p": [{"no": "040", "n": "迷迭香滾珠瓶10ml", "pr": "NT$150", "nd": ["專注", "情緒"], "w": "迷迭香滾珠瓶提神，搭配「5-4-3-2-1」倒數立刻行動。"}, {"no": "098", "n": "粒線寶（膠囊）", "pr": "NT$550", "nd": ["粒線體", "能量", "恢復"], "w": "粒線寶支持能量，走出舒適區需要充足精力。"}], "a": [{"no": 36, "n": "拖延模型 60 項", "u": "https://membership-app-e2147.web.app/platform/self-discipline-action/procrastination-model-60-bilingual.html", "cat": "英文／語言學習 / 自律行動", "w": "拖延模型 60 項拆解藉口背後的恐懼，練習 5 秒法則。"}, {"no": 107, "n": "高主動性 OS", "u": "https://membership-app-e2147.web.app/platform/ability-building/high-agency-os-complete.html", "cat": "能力養成／自律行動 / 能力養成", "w": "高主動性 OS 培養面對挑戰不放棄的行動力。"}]}, {"id": 45, "t": "顯化的力量就是幫助你實現夢想，太厲害了！", "d": "3月24日", "g": ["改變潛意識", "突破限制性信念", "自我成長"], "b": "調整行為意味著用行動告訴你的潛意識你相信自己值得擁有夢想生活。你的行為模式就是你自我價值感的直接呈現。\n\n要獲取所需的力量，改變自身能量，吸引到應得的富足，你就要開始以最有力量的自己行事，而非以恐懼和疑慮限制的自己行事。\n\n要想實現顯化，你需要明確自己的願景，相信自己值得，然後積極主動地行動，讓渴求之事發生。\n\n無論想顯化什麼，你都需要付出行動。\n\n積極主動需要無所畏懼。勇敢地向你的潛意識表態吧：“我值得，並且我已經做好準備了。”\n拖延和憂慮往往處於對失敗的恐懼：人們放棄行動往往是因為，相比行動後失敗，直接不行動要容易得多。\n\n這種對失敗的恐懼影響著人們，使人們很容易找一大堆藉口解釋為什麼自己做不了某事：沒有時間、資源和精力。找藉口和不行動會給潛意識傳送什麼訊號呢？它們在說：“我還沒有準備好，我不相信我值得。”恐懼會阻礙你吸引你渴望的事物。\n\n主動作為能夠讓你克服對失敗的恐懼。\n\n你要先用你想要吸引來的尊重和愛對待自己。\n\n你要想在生活中顯化某些事物，就必須採取行動，積極主動地調整自己的行為。這是在告訴你的潛意識：“我準備好了，我無所畏懼，我值得。”\n\n假裝你是你想成為的那個人，直到你真的成為他。\n\n有時候，你只需要相信自己，邁出勇敢嘗試的那一步，相信只要按照自己想成為的人那樣行事，你就離成為那樣的人更進一步了。\n\n在顯化之旅中，最重要的問題之一就是：“我想成為什麼樣的人？”當你很清楚自己想成為什麼樣的人，清除最有力量的自己是什麼樣子，你就可以開始像那樣行事。\n\n有時，你只需要假裝自己已經成了想成為的那個人，直到真的成為他。\n\n只有意識到潛意識想做什麼時，我才能克服自我破壞的衝動，轉而專注於我想達到的目標。這樣我才能熬過那些不適，培養出一種新的熟悉感——這就形成了真正的、持久的改變。\n\n每當你進入轉型期，你就可以調整自己的行為，讓行為與自己想要的事物保持一致。你肯定會有一段時間感到不舒適，但還是要努力接受並度過這些日子。你必須抵制自我破壞的衝動，必須習慣在這個新的、充滿力量的區域生活，直到感到舒適、自在。", "c": "顯化法則", "k": "想讓夢想實現，光想不夠，要用行動告訴自己「我值得、我準備好了」。拖延常常是因為怕失敗。最好的方法是：先想清楚「我想成為什麼樣的人」，然後假裝你已經是那個人，照著他的方式做，直到你真的變成他。", "m": ["行動顯化", [["行為=自我價值", ["行動告訴潛意識"]], ["三步", ["明確願景", "相信值得", "積極行動"]], ["拖延根源", ["怕失敗", "找藉口"]], ["假裝直到成真", ["像想成為的人那樣做"]], ["轉型期", ["忍受不適", "抵抗自我破壞"]]]], "f": [["我想成為誰？", "明確願景"], ["相信值得", "我準備好了"], ["像他那樣行動", "假裝直到成真"], ["度過不適", "抵抗自我破壞"], ["持久改變", "新的熟悉感"]], "p": [{"no": "098", "n": "粒線寶（膠囊）", "pr": "NT$550", "nd": ["粒線體", "能量", "恢復"], "w": "粒線寶支持細胞能量，「積極主動地行動」需要好精神。"}, {"no": "042", "n": "清思油滴35ml（迷迭香精油＋EPA魚油）", "pr": "NT$450", "nd": ["腦神經", "專注", "情緒"], "w": "清思油滴支持專注，想清楚「我想成為誰」。"}, {"no": "028", "n": "心膚精油特價組", "pr": "NT$1200", "nd": ["情緒", "放鬆", "肌膚"], "w": "心膚精油組陪你度過轉型期的不舒適。"}], "a": [{"no": 39, "n": "身分 OS 雙語 APP", "u": "https://membership-app-e2147.web.app/platform/life-system/identity-os-bilingual-app.html", "cat": "英文／語言學習 / 生命系統", "w": "身分 OS 雙語 APP 對應「假裝你已是那個人」的身分練習。"}, {"no": 102, "n": "人生顯化系統", "u": "https://valaivai087-ops.github.io/lifemanifastify/", "cat": "能力養成／自律行動 / 顯化", "w": "人生顯化系統把願景、相信、行動串起來。"}]}, {"id": 46, "t": "喪盡天良！央視曝光活魚麻醉！太惡毒了", "d": "Mar 23", "g": ["糖尿病"], "b": "最近央視財經曝光，某廠家承認他們的原料（丁香酚）從印尼進口以食品新增劑名出場，魚販子們把這種新增劑用來麻醉活魚，很多小作坊也從他們那裡購進原料，再包裝成三無麻藥流向市場。\n\n在另外一家工廠，記者瞭解到為了讓麻醉劑充分快速的滲透到活魚體內，快速實現麻醉的效果，這些商家最簡便的辦法就是使用工業酒精勾兌。\n\n一些水廠市場廠家用甲鹽和丁香酚和甲鹽麻醉劑，麻醉活魚。截至目前我國對丁香酚和甲鹽等麻醉劑能不能實用在活體水產品上還沒有進行過安全評價，這兩類產品都不再水產養殖允許實用的名單上，市場檢測選項上處於空白。\n\n部分魚因實用麻醉劑送達餐廳時尚未甦醒。用新增劑麻醉活魚，在魚體內完全代謝至少需要４８小時。\n\n在《救命》這本書中關於遠離糖尿病的部分內容中，作者寫了這麼一段關於沙丁魚罐頭和鮭魚受汙染　的情況。大家可以閱讀。\n\n在各超市的調查中發現，沙丁魚罐頭的六氯苯汙染最嚴重，而鮭魚則被認為是汙染最嚴重的魚類。在鮭魚片裡，曾經檢驗出了２４種殺蟲劑。養殖鮭魚可能是最糟的，含有比野生鮭魚多１０倍以上的第一類毒性化學物質多氯聯苯。哈佛大學的研究人員發現，特別是“六氯苯”這總化學物質，更是引發糖尿病的高危因子。\n\n六氯苯和多氯聯苯一類的工業毒素，在幾十年前就已經被全面禁止。那麼，它們又為何成為造成糖尿病患病率上升的原因呢？這個問題答案與肥胖流行有關。研究人員發現，比起身材消瘦的受試者，這些毒性化學物質和糖尿病之間的關聯性，在肥胖的受試者身上更強，因此體內脂肪，很可能就是這些汙染物質的溫床。超重的人，極可能將有毒的廢棄物質儲存在臀部，就像隨身攜帶一個毒物垃圾場。如果沒有減掉足夠的重量，身上帶有鮭魚汙染物的人，可能需要５０～７０年的時間才能清除掉體內的這些化學物質。", "c": "食品安全", "k": "新聞報導有些魚販用丁香酚等麻醉劑讓活魚昏睡，好運送，這些東西沒有經過安全評估，至少要48小時才能代謝完。書中也提到鮭魚、沙丁魚可能含有多種污染物，污染物會存在身體脂肪裡很久。", "m": ["活魚麻醉與魚類污染", [["麻醉劑", ["丁香酚", "工業酒精勾兌", "未經安全評估"]], ["代謝", ["至少48小時"]], ["魚類污染", ["六氯苯", "多氯聯苯", "養殖鮭魚多10倍"]], ["人體", ["存在脂肪", "需50-70年清除"]]]], "f": [["活魚運輸", "加麻醉劑"], ["殘留魚體", "48小時代謝"], ["上餐桌", "吃進體內"], ["污染物累積", "脂肪儲存"], ["行動", "選可信來源、多植物蛋白"]], "p": [{"no": "016", "n": "亞麻仁油", "pr": "NT$3470", "nd": ["Omega-3", "抗發炎"], "w": "亞麻仁油提供植物性 Omega-3，減少對可能受污染魚類的依賴。"}, {"no": "085", "n": "NAC複方（膠囊）", "pr": "NT$530", "nd": ["肝臟", "抗氧化", "呼吸道", "解毒"], "w": "NAC 複方支持肝臟解毒與抗氧化，處理環境污染物的負擔。"}, {"no": "077", "n": "肝寶（膠囊）", "pr": "NT$550", "nd": ["肝臟", "解毒", "代謝"], "w": "肝寶聚焦肝臟解毒與代謝節點。"}], "a": [{"no": 92, "n": "醫療證據購物 OS", "u": "https://membership-app-e2147.web.app/platform/health-medicine/medical-evidence-shopping-os.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "醫療證據購物 OS 幫你判斷食品來源與添加物風險。"}, {"no": 67, "n": "健康負熵 APP", "u": "https://membership-app-e2147.web.app/lifeos/health-negentropy-app.html", "cat": "醫學生／醫學健康 / 健康", "w": "健康負熵 APP 規劃少污染的蛋白質來源。"}]}, {"id": 47, "t": "高血壓的朋友們集合，這篇筆記很漲知識！！", "d": "3月22日", "g": ["拓展知識面", "每日一讀", "高血壓"], "b": "食品業者在產品中新增鹽，由兩個主要原因：首先，在肉里加鹽可以吸水，透過這種方式可以讓產品增加２０％的重量，等於只要花一點點成本就能增加２０％的利潤。其次，大家都知道吃鹽會口渴，所以酒吧裡往往都會放一籃調味堅果和餅乾供客人免費取用。\n\n禽肉業者通常會網雞肉裡注射鹽水來增加重量，卻仍然能問心無愧地標上“百分百純天然”。\n\n１４０／９０的血壓值被認為是一個分界點。就像過多的膽固醇或體脂數值一樣，具有比＂正常＂範圍更低的血壓對身體有好處的。因此，即便是血壓為正常值１２０／８０的人，當血壓降為１１０／７０時也會有好處。\n\n高血壓似乎是選擇的結果。你可以選擇繼續吃會讓動脈粥破裂的西方飲食，也可以選擇擺脫這一風險。真相是，要消除死亡的主要風險因子，或許簡單，不需要藥物也不用做手術。我們需要的，只是一雙筷子或一把叉子。\n\n我們所吃的鹽，是一種由大約４０％的鈉和６０％的氯所組成的化合物。鈉是一種必需營養素，但蔬菜及其他天然物足以提供身體所需要的少量鈉。攝取太多鹽會導致水腫，而身體可能會以提高血壓來響應，以便把多餘的體液和鹽分排除體外。\n\n在人類進化的前９０％時間段，可能一直過著低鈉飲食的生活，每天攝取的鈉不到１／４茶匙。因為當時人類的主要食物，可能都是植物。長達數百年下來，人類都過著不需要鹽罐的生活，因此身體演變成節鈉型的有機體。\n\n人類基因的設定，決定了我們所需要的鈉比現在所攝取的呀少１０倍。\n\n如果我們能避免吃過鹹的食物，不忘食物里加鹽，落實每天減少約半茶匙的鹽攝取量，就可以減少２２％的中風死亡風險及１６％的心臟病發作。\n\n已經有證據顯示鈉會讓血壓升高。\n\n研究人員使用鐳射多普勒技術，能夠測量皮下微血管的血流。在吃了一頓高納餐點後，血流量明顯變少了，直到皮下注射維生素Ｃ後才有所改善。維生素Ｃ似乎逆轉了大部分鈉對血管功能的抑制效應。因此，如果一種抗氧化物有助於阻止鈉效應，那麼鹽破壞動脈功能的機制很可能是氧化應激，也就是在血液中形成自由基的過程。研究結果發現，鈉似乎會抑制一種稱為“超氧化物歧化酶”的抗氧化活性，這種酶每秒能夠消除百萬個自由基的毒性。這樣一來，攝取過多的鈉可能會累積氧化壓力而損傷動脈。\n\n在吃了一頓過鹹的餐點後，不只血壓會升高，動脈也會開始變硬。", "c": "高血壓", "k": "血壓140/90是分界，但更低一點更好。鹽有4成是鈉，吃太多身體會用升血壓來排掉多餘的鹽水。每天少吃半茶匙鹽，中風死亡風險降22%、心臟病降16%。吃一頓太鹹的飯，血管馬上變硬，維生素C似乎能幫忙。", "m": ["高血壓與鹽", [["業者加鹽", ["增重20%", "雞肉注射鹽水"]], ["血壓標準", ["140/90分界", "110/70更好"]], ["機制", ["水腫→升壓", "抑制抗氧化酶"]], ["減鹽效益", ["中風-22%", "心臟病-16%"]], ["維生素C", ["逆轉鈉的抑制"]]]], "f": [["高鹽一餐", "鈉攝取過多"], ["氧化壓力", "抑制SOD酶"], ["血管變硬", "血流減少"], ["血壓上升", "長期損傷"], ["每天少半茶匙鹽", "風險明顯下降"]], "p": [{"no": "052", "n": "血循環", "pr": "NT$1350", "nd": ["循環", "心血管", "末梢循環"], "w": "血循環支持心血管與循環，搭配減鹽一起照顧血管。"}, {"no": "078", "n": "美寶（膠囊）", "pr": "NT$550", "nd": ["抗氧化", "細胞保護", "循環"], "w": "美寶聚焦抗氧化與細胞保護，對應「鈉造成氧化壓力」。"}, {"no": "091", "n": "甘氨酸鎂複方粉包", "pr": "NT$1350", "nd": ["睡眠", "神經", "肌肉", "放鬆"], "w": "甘氨酸鎂複方支持血管與神經放鬆。"}], "a": [{"no": 69, "n": "身體訊號系統", "u": "https://membership-app-e2147.web.app/lifeos/body-signals.html", "cat": "醫學生／醫學健康 / 健康", "w": "身體訊號系統留意高鈉一餐後的水腫、頭脹訊號。"}, {"no": 72, "n": "健康診斷系統", "u": "https://membership-app-e2147.web.app/lifeos/health-diagnosis.html", "cat": "醫學生／醫學健康 / 健康", "w": "健康診斷系統追蹤血壓數值。"}]}, {"id": 48, "t": "尊重自己的夢想。不斷的復返，培養自愛！", "d": "Mar 21", "g": ["自愛的力量", "讀書成長", "學習愛自己", "自我認可接納"], "b": "事實上，覆盤、反思過去的錯誤和經歷是一種極致的自愛，這會讓人成長。\n\n終極的自愛是平衡好當下的需求和未來的需求。\n\n尊重自己的夢想。你的生活其實就是你過往所有選擇塑造的結果。當你愛自己時，你不僅要尊重自己當下的需求，也要尊重自己的夢想。很多時候，人們會做出衝動的決定，這些決定滿足了人們當下的需求，卻對未來的自己產生了消極影響。自愛意味著你能夠掌握自身，能夠超越當下追求即時滿足的衝動，轉而做出有利於未來自己的選擇。\n\n自愛是顯化的驅動力。因此，你需要透過不斷的練習和堅持來培養自愛。你所選擇的行為、回應和思考方式都要能夠培養自我價值感、最大限度地推動自我發展。你要做到每一天，對你做的每一件事不做評判，給予自己同理心、包容心和善意。自愛的行為無大小之分，喝一杯水和離開一段有毒的人機關係都是自愛，你當下所做的每一件事都決定了你是誰，你會成為誰。\n\n消除數年或數十年積累起來的不安全感、限制性信念和自卑感，不是一朝一夕就能做到的。但你現在就可以做出更愛自己的決定。決定開始愛自己就是成功的一半，在接下來的每一天、每一刻，在生活的點點滴滴中培養更多的自愛吧，因為你值得。你做的越多就越得心應手，愛自己這件事就會變得容易。\n\n要清掃通往光明的未來的道路，你就要放下過去那些使你感到羞愧、內疚或憤怒的低能量情緒，寬恕自己，不評判自己。要做到這一點，你需要看請以下三個真相。①我當時已經盡力了。②任何經歷都是人生中寶貴的一課。③我已經不再是當時的我：我在不斷地成長、發展。", "c": "自我成長", "k": "反省過去其實是很棒的愛自己。愛自己＝照顧現在，也尊重未來的夢想，不要只顧眼前開心。每天不批評自己、對自己溫柔，喝一杯水、離開有毒的關係都算。原諒過去：我當時盡力了、每件事都是功課、我已經不一樣了。", "m": ["尊重夢想與自愛", [["覆盤", ["極致的自愛", "帶來成長"]], ["終極自愛", ["平衡當下與未來", "超越即時滿足"]], ["練習", ["不評判", "同理包容", "小事皆自愛"]], ["放下過去", ["羞愧內疚憤怒", "寬恕自己"]], ["三真相", ["當時已盡力", "經歷是一課", "我在成長"]]]], "f": [["回顧過去", "覆盤反思"], ["寬恕", "三個真相"], ["尊重夢想", "為未來選擇"], ["每日善待", "不評判、多包容"], ["自愛驅動顯化", "越做越自然"]], "p": [{"no": "006", "n": "專利HEZY氫鬆袋（買空袋送氫氧水）", "pr": "NT$250", "nd": ["氧化壓力", "修復", "能量"], "w": "「喝一杯水也是自愛」：氫鬆袋讓喝水變成每天的小儀式。"}, {"no": "028", "n": "心膚精油特價組", "pr": "NT$1200", "nd": ["情緒", "放鬆", "肌膚"], "w": "心膚精油組陪你覆盤與寬恕自己，溫柔對待內在。"}, {"no": "054", "n": "GABA（膠囊）", "pr": "NT$540", "nd": ["睡眠", "情緒", "放鬆"], "w": "GABA 支持放鬆，放下羞愧、內疚等低能量情緒。"}], "a": [{"no": 56, "n": "陰影整合系統", "u": "https://valaivai087-ops.github.io/shadow/", "cat": "情緒心理／信念療癒 / 心理", "w": "陰影整合系統幫你和過去的錯誤和解。"}, {"no": 102, "n": "人生顯化系統", "u": "https://valaivai087-ops.github.io/lifemanifastify/", "cat": "能力養成／自律行動 / 顯化", "w": "人生顯化系統把自愛轉成顯化的驅動力。"}]}, {"id": 49, "t": "自我肯定的力量，真的好強大。讀爛這本書！", "d": "Mar 17", "g": ["改變潛意識", "自我暗示的力量", "自我成長"], "b": "消除恐懼和疑慮是自我發展。為了成功顯化夢想生活，你每天都要做內在功課：消除限制性信念，意識到自我價值，釋放自己的潛能，重新找回與生俱來的自我認同感。只有這樣，你的生命才不會被不安全感裹挾，從而能放下包袱、向上生長。\n\n消除恐懼和疑慮的特備厲害的四種方法：①掌握你的思想②注意你的語言③利用肯定語④進行視覺化練習。\n\n如果你有意識地選擇採用積極和有力量的想法，引起高能量情緒（如自信、熱情和希望），就能借助吸引力法則吸引更多你想要的事物進入生活。相反，你如果允許恐懼和疑慮等消極的、自我批評的內在聲音存在，你的自我價值感就會降低，進而引起低能量情緒，阻礙你顯化夢想生活。\n不斷用有力量的想法取代消極想法，滋養自己的心靈。\n\n不要讓消極想法四處遊走。掌控你的想法，管理它們，讓它們為你所用，而非成為你的攔路石。\n你還可以透過重構視覺來消除恐懼和疑慮。\n\n不論你經歷了什麼，你總能選擇看待它的視覺。你傾向於選則的視覺通常是由你的情緒狀態、期望、過往經歷、信念系統和自我價值感決定的，這就是為什麼兩個人經歷了同樣的事情，看待它的方式截然不同。\n\n記住，你能顯化的是你相信自己值得擁有的事物。\n\n開始注意你的想法，摒棄那些充滿恐懼和疑慮的想法，採用能提升自我價值感和自信的想法和視覺看待你經歷的事情吧。\n\n你需要說出你真的想要的事物。比如“我想實現財務自由”。\n\n你要對自己使用的語言有所察覺，避免表達你擔心或不希望發生的事情，要將你的注意力放在你真的想做成的事情上，這樣你才能將夢想變成現實。\n\n請記住，潛意識是顯化的孕育地，它服從於意識，並會“傾聽”你使用的語言。\n只要全力以赴，我就可以做成任何事。\n\n恐懼和疑慮是萬惡之源，它們使人的自我價值感降低，使人產生不安全感，還會形成限制性信念，阻礙人將夢想變為現實。消除恐懼和疑慮是一個持續的過程，你需要不斷地回到這一步。在顯化過程中發現自己受阻時，你要先問問自己，是哪些恐懼和疑慮阻礙了你充分展現能力。值得補充的是，這可能是最具挑戰性的一步：它要求你重拾脆弱，回顧所有可能導致阻礙產生的經歷和記憶。但是，巨大的努力會帶來豐厚的回報，你一旦移除了這些路障，就為通往無限富足的道路掃清了障礙。", "c": "顯化法則", "k": "每天都要做「內心功課」：把害怕和懷疑清掉。四個方法：管好想法、注意說話、說肯定語、做想像練習。同一件事可以換個角度看。說話時要說「我想要什麼」，不要一直說「我怕什麼」，因為潛意識會聽你說的話。", "m": ["自我肯定", [["內在功課", ["消除限制性信念", "找回自我價值"]], ["四方法", ["掌握思想", "注意語言", "肯定語", "視覺化"]], ["重構視角", ["同事不同看法", "選擇看待方式"]], ["語言", ["說想要的", "避免說擔心的"]], ["持續過程", ["受阻時問：哪些恐懼？"]]]], "f": [["受阻", "發現卡住了"], ["找出恐懼懷疑", "回顧經歷"], ["重構視角", "換個角度看"], ["正向語言", "說出真正想要的"], ["掃清障礙", "通往富足"]], "p": [{"no": "040", "n": "迷迭香滾珠瓶10ml", "pr": "NT$150", "nd": ["專注", "情緒"], "w": "迷迭香滾珠瓶在唸肯定語前使用，用香氣建立正向狀態。"}, {"no": "028", "n": "心膚精油特價組", "pr": "NT$1200", "nd": ["情緒", "放鬆", "肌膚"], "w": "心膚精油組做視覺化練習時營造放鬆專注的空間。"}], "a": [{"no": 47, "n": "七個終極語言更新原則", "u": "https://membership-app-e2147.web.app/lifeos/seven-language-upgrade-principles.html", "cat": "英文／語言學習 / 語言", "w": "七個終極語言更新原則對應「注意你的語言」。"}, {"no": 59, "n": "信念系統", "u": "https://membership-app-e2147.web.app/lifeos/belief-system.html", "cat": "情緒心理／信念療癒 / 信念", "w": "信念系統幫你消除限制性信念、重建自我價值。"}]}, {"id": 50, "t": "顯化的力量好強大！！敢於做夢，不要退縮！", "d": "3月10日", "g": ["突破限制性信念", "顯化"], "b": "恐懼和自我懷疑是發揮自身潛力的頭號敵人。\n\n你只能顯化你由衷相信自己值得擁有的事物。\n\n你９５％的想法、反應、決定、認知和行為模式都是由潛意識驅動的。\n\n潛意識不僅能驅動人實現夢想，也會阻礙人前進，這是因為潛意識中有兩種東西會阻礙顯化：恐懼和疑惑。\n\n恐懼和疑慮的表現形式包括不安全感、限制性信念，以及不配得感。恐懼和疑慮會削弱你的顯化能力，它們向你潛意識發出這樣的資訊：“我不值得或還沒有準備好接受我所渴求之物。”\n\n恐懼和疑慮的力量非常強大，它們甚至在顯化之旅的第一步給你設定了障礙看，阻止你想像自己想要的事物。\n\n恐懼和疑慮會偽裝成你的朋友，告訴你它們在保護你，不讓你經歷可以預見的失望，它們還會活躍在你解鎖豐盛資源　的探索之旅，為你設定重重阻礙。\n\n限制性信念告訴你，你的夢想根本不可能實現，這個聲音阻礙了你想像自己的夢想生活。\n\n看到自己內在無窮的力量，這些力量足以幫助自己自我治癒、自我進化、活出最好的自己。\n\n建立願景板的作用不僅僅是幫助“我”將“我”想顯化的事物視覺化，它還提供了一個契機，讓“我”更清楚地瞭解自己的恐懼和疑慮。每當你猶豫不決，不讓自己在願景板上寫下什麼的時候問問自己：“我為什麼猶豫不決？是哪些限制性信念在影響著我？”在這個階段意識到你的恐懼和疑慮，你就有機會消除它們，從而掃除顯化路上的一切阻礙。\n\n當我們充分允許自己做夢時，恐懼和疑慮將無處可藏。\n\n敢於做夢，不要退縮。\n\n想要輕鬆且有效地將任何事物顯化到你的生活中，你就要相信你值得擁有這些事物。\n\n“我”內心的力量一直都在，只是需要自己去解鎖。\n\n無論你心裡那個讓你無法相信自己的聲音有多小，你都要拎出它並記錄下來。即使覺得某個想法不合理，你也要把這個想法寫下來。挖掘恐懼和疑慮的每一處細節，就是在為消除它們賦能。", "c": "顯化法則", "k": "95%的想法和行為都是潛意識在控制。潛意識裡的「害怕」和「懷疑」會偷偷告訴你：我不配、我沒準備好。做願景板時，如果不敢寫某個夢想，就問自己為什麼。把那個小小的「不相信自己」的聲音寫下來，就能慢慢消除它。敢做夢，不要退縮！", "m": ["敢於做夢", [["潛意識", ["驅動95%行為", "可助可阻"]], ["兩大敵人", ["恐懼", "疑慮"]], ["表現", ["不安全感", "限制性信念", "不配得感"]], ["願景板", ["視覺化", "照見恐懼"]], ["方法", ["寫下微小懷疑", "允許自己做夢"]]]], "f": [["允許做夢", "大膽想像"], ["做願景板", "寫下想要的"], ["遇到猶豫", "問為什麼"], ["記錄懷疑", "挖掘細節"], ["解鎖內在力量", "相信值得"]], "p": [{"no": "028", "n": "心膚精油特價組", "pr": "NT$1200", "nd": ["情緒", "放鬆", "肌膚"], "w": "心膚精油組讓你放鬆地「允許自己做夢」。"}, {"no": "042", "n": "清思油滴35ml（迷迭香精油＋EPA魚油）", "pr": "NT$450", "nd": ["腦神經", "專注", "情緒"], "w": "清思油滴支持專注，挖掘恐懼與疑慮的每個細節。"}], "a": [{"no": 58, "n": "信念身分系統", "u": "https://membership-app-e2147.web.app/lifeos/belief-identity.html", "cat": "情緒心理／信念療癒 / 信念", "w": "信念身分系統看見潛意識裡的「不配得感」。"}, {"no": 109, "n": "LINE 顯化終極完整版", "u": "https://membership-app-e2147.web.app/platform/self-discipline-action/line-manifestation-ultimate-complete.html", "cat": "能力養成／自律行動 / 自律行動", "w": "LINE 顯化終極完整版提供願景板與顯化練習。"}]}, {"id": 51, "t": "心臟病與膽固醇的關係，這篇講得很清楚！！", "d": "3月7日", "g": ["瞭解疾病的根源", "心臟病", "膽固醇"], "b": "羅伯茨醫生的文章《笨蛋，問題是膽固醇！》中，他認為冠心病只有一個真正的危險因素：膽固醇。你可能是個肥胖、有糖尿病、抽菸、成天窩在沙發上看電視的懶骨頭，但他認為，只要你血液裡的膽固醇含量夠低，仍然不足以造成動脈粥樣硬化。\n\n最理想的膽固醇值為５０～７０mg/dL，顯而易見，這個數值越低越好。這就是你出生時的膽固醇值，也是大部分沒有心臟病的人口所測得的數值；此外，在降脂實驗中，一旦膽固醇降到這個數值，動脈粥樣化的過程就會停下來。７０mg/dL的ＬＤＬ值，代表總膽固醇值大約為１５０mg/dL，在著名的佛萊明心臟研究報告中，低於這個水平的人群中沒有患有冠心病死亡的案例。因此，總膽固醇值得目標應該低於１５０mg/dL。\n\n假如你的驗血結果顯示，總膽固醇值為２００mg/dL，醫生可能會向你保證，你得膽固醇值正常，但是，在一個死於心臟病是常態得社會里，擁有“正常”得膽固醇值可能還不夠。\n\n想要真正免於心臟病，你至少需要讓你得ＬＤＬ低於７０mg/dL。羅伯茨醫生指出，想要讓美國人實現這樣低得ＬＤＬ，只有兩種方法：一種是讓數億美國人終生服用藥物，另一種是推薦他們採用以全蔬食為主得飲食結構。", "c": "心血管健康", "k": "羅伯茨醫師說：冠心病真正的危險因素只有一個，就是膽固醇。最理想的壞膽固醇(LDL)是50~70，跟剛出生的嬰兒一樣；總膽固醇最好低於150。醫生說200「正常」還不夠。要做到只有兩種方法：一輩子吃藥，或是以蔬食為主。", "m": ["膽固醇目標", [["觀點", ["唯一真正危險因素", "笨蛋問題是膽固醇"]], ["理想值", ["LDL 50-70", "總膽固醇<150"]], ["證據", ["出生時數值", "佛萊明研究"]], ["「正常」不夠", ["200仍有風險"]], ["方法", ["終身服藥", "全蔬食飲食"]]]], "f": [["驗血", "看總膽固醇與LDL"], ["比對目標", "LDL<70、總<150"], ["飲食調整", "全蔬食為主"], ["追蹤", "定期回診"], ["動脈硬化停止", "心臟受保護"]], "p": [{"no": "033", "n": "亞麻仁籽渣（2包）", "pr": "NT$198", "nd": ["腸道", "膳食纖維"], "w": "亞麻仁籽渣補充纖維，幫助膽固醇隨糞便排出。"}, {"no": "097", "n": "亞麻仁油（500cc×2瓶）", "pr": "NT$780", "nd": ["Omega-3", "心血管", "抗氧化"], "w": "亞麻仁油取代動物油脂，零膽固醇的油脂選擇。"}, {"no": "063", "n": "甜菜鹼TMG（膠囊）", "pr": "NT$490", "nd": ["甲基化", "肝臟", "心血管"], "w": "甜菜鹼 TMG 支持肝臟與心血管節點。"}], "a": [{"no": 72, "n": "健康診斷系統", "u": "https://membership-app-e2147.web.app/lifeos/health-diagnosis.html", "cat": "醫學生／醫學健康 / 健康", "w": "健康診斷系統對照 LDL<70、總膽固醇<150 的目標。"}, {"no": 91, "n": "代謝控制儀表板", "u": "https://membership-app-e2147.web.app/platform/health-medicine/metabolic-control-dashboard.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "代謝控制儀表板追蹤飲食調整後的血脂變化。"}]}, {"id": 52, "t": "這個控糖技巧人人都可學會，馬上可以實操！", "d": "Mar 3", "g": ["控糖"], "b": "植物和人類擁有一種相同的酶—α－澱粉酶。這種酶會將植物中的澱粉和人類吃進嘴裡的麵包轉化為葡萄糖。科學家已經證實，食醋中的醋酸會暫時抑制α－澱粉酶的活性。因此，糖和澱粉轉化為葡萄糖的速度就會變得更慢，葡萄糖對我們系統所造成的衝擊也更緩和。\n\n一旦醋酸進入血液，它會滲透到我們的肌肉中。在那裡，它會刺激我們的肌肉比原來更快地製造糖原，這會使葡萄糖以更高的效率被吸收。\n\n這兩個因素，即葡萄糖在體內釋放的速度更慢，同時我們的肌肉吸收葡萄糖的速度更快，就會使體內自由流動的葡萄糖更少，因此出現的葡萄糖峰值也更小。\n\n更重要的是，醋酸不僅可以減少胰島素的分泌量，還可以誘發某些特定的ＤＮＡ重新編碼，使我們的線粒體燃燒更多的脂肪。", "c": "控糖健康", "k": "吃飯前喝一點稀釋的醋，可以讓血糖不要衝那麼高！因為醋酸會讓「把澱粉變糖」的酵素暫時變慢，還會讓肌肉更快把糖吸收存起來。兩個效果加起來，血糖高峰就變小了，胰島素也少分泌一些。", "m": ["醋控糖", [["機制1", ["抑制α-澱粉酶", "澱粉變糖變慢"]], ["機制2", ["肌肉更快製造糖原", "葡萄糖吸收效率高"]], ["結果", ["自由葡萄糖少", "峰值變小"]], ["額外", ["胰島素減少", "粒線體燃燒更多脂肪"]]]], "f": [["餐前", "一大匙醋加一杯水"], ["醋酸入胃", "抑制澱粉酶"], ["醋酸入血", "肌肉吸糖更快"], ["血糖峰值變小", "胰島素少"], ["燃脂增加", "長期受益"]], "p": [{"no": "083", "n": "苦瓜皂甘複方", "pr": "NT$540", "nd": ["血糖", "代謝", "胰島"], "w": "苦瓜皂甘複方支持血糖與胰島節點，搭配餐前醋水一起平穩血糖。"}, {"no": "043", "n": "鹼能活（檸檬酸／檸檬酸鉀／檸檬草／肌酸／肉鹼）", "pr": "NT$520", "nd": ["能量", "粒線體", "代謝", "酸鹼平衡", "運動恢復"], "w": "鹼能活含檸檬酸等成分，支持能量代謝與運動恢復。"}, {"no": "084", "n": "黃連素／小蘗鹼（膠囊）", "pr": "NT$560", "nd": ["血糖", "腸道", "代謝"], "w": "黃連素支持血糖代謝，作為飲食技巧之外的輔助。"}], "a": [{"no": 91, "n": "代謝控制儀表板", "u": "https://membership-app-e2147.web.app/platform/health-medicine/metabolic-control-dashboard.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "代謝控制儀表板驗證餐前醋水對血糖峰值的效果。"}, {"no": 77, "n": "節律營養系統", "u": "https://membership-app-e2147.web.app/lifeos/rhythm-nutrients.html", "cat": "醫學生／醫學健康 / 健康", "w": "節律營養系統把醋水放進用餐流程。"}]}, {"id": 53, "t": "愛吃糖的看過來，這篇筆記帶你瞭解糖！", "d": "Mar 2", "g": ["含糖量高的食物", "減少糖分攝入", "養生"], "b": "從分子層面來講：食用糖和蜂蜜確實沒有什麼區別。所有糖它們都是由葡萄糖和果糖組成的，只是包裝不同、名字不同、價格不同而已。\n蜂蜜來源於植物的花蜜，但是蜂蜜含有葡萄糖和果糖，就和食用糖一樣。紅糖和白糖的成分幾乎一摸一樣，唯一的區別就是製作過程中紅糖會被著色，這讓它看起來更健康。而糖漿是在製作過程中的一種副產品。很多人認為，紅糖比白糖好，實際上兩者沒有區別。\n任何種類的糖，不管它是什麼顏色、什麼味道、源自何種植物，它在體內分解後仍然是葡萄糖和果糖，都會導致我們身體中出現葡萄糖和果糖峰值。\n\n“天然” 很容易讓人相信這些糖比食用糖好。但我們清楚一點：所有的糖都是天然的，因為所有的糖都來自植物。有些食用糖甚至來源與蔬菜（如甜菜）。但是，它們並沒有太大不同。糖沒有好壞之分，不管糖來自哪種植物。\n\n糖在體內分解成的分子才是關鍵：當糖達到我們的小腸時，生成的物質只有葡萄糖和果糖。我們身體對糖消化、吸收是一樣的，不會因為這種糖來自甜菜、龍舌蘭，或者杧果而有所不同，一旦水果的形態被被改變，經過加工，其中的纖維被剔除了，那麼它就變成了糖，和其他的糖一樣。\n\n在一些水果乾中，仍然會存在少量纖維。但是，因為水果乾中的水分都沒有了，所以比起吃整個的水果，我們吃的水果乾量更大，吃的糖也會更多。這與大自然所期盼的是相悖的，而引發的後果就是我們的身體會出現更多的葡萄糖和果糖。\n\n水果乾看似健康，其實不然。水果乾確實含有一些纖維，但是它的大多數成分和食用糖一樣，所含濃縮葡萄糖和果糖會像海嘯一樣，對我們的身體造成衝擊。\n\n蜂蜜中並沒有那麼多的抗氧化劑。我們在半顆藍莓中就可以找到一茶匙蜂蜜中含有的抗氧化劑。", "c": "控糖健康", "k": "白糖、紅糖、蜂蜜、楓糖漿⋯⋯其實都一樣，進到肚子都會變成葡萄糖和果糖。「天然」的糖也是糖。水果乾因為水分沒了，很容易一次吃很多，等於吃很多糖。一茶匙蜂蜜的抗氧化物，半顆藍莓就有了。", "m": ["糖的真相", [["所有糖", ["葡萄糖+果糖", "只是包裝不同"]], ["紅糖=白糖", ["只是有顏色"]], ["天然迷思", ["所有糖都來自植物"]], ["水果乾", ["濃縮糖", "容易吃過量"]], ["蜂蜜", ["抗氧化物不多", "=半顆藍莓"]]]], "f": [["任何糖", "白/紅/蜂蜜/龍舌蘭"], ["進小腸", "分解成葡萄糖+果糖"], ["血糖果糖峰值", "身體反應一樣"], ["水果乾更危險", "濃縮易過量"], ["選擇", "吃完整水果"]], "p": [{"no": "010", "n": "甘速淨（代謝之王）", "pr": "NT$1500", "nd": ["代謝", "血糖", "肝臟"], "w": "甘速淨支持代謝與血糖節點，認清「所有糖都一樣」後的代謝保養。"}, {"no": "083", "n": "苦瓜皂甘複方", "pr": "NT$540", "nd": ["血糖", "代謝", "胰島"], "w": "苦瓜皂甘複方支持血糖與胰島節點。"}, {"no": "038", "n": "EGCG複方（茶多酚＋EGCG＋積雪草）", "pr": "NT$560", "nd": ["抗氧化", "代謝", "細胞保護"], "w": "EGCG 複方提供抗氧化，比一茶匙蜂蜜的抗氧化物更實在。"}], "a": [{"no": 92, "n": "醫療證據購物 OS", "u": "https://membership-app-e2147.web.app/platform/health-medicine/medical-evidence-shopping-os.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "醫療證據購物 OS 破解「天然糖、紅糖比較好」的迷思。"}, {"no": 91, "n": "代謝控制儀表板", "u": "https://membership-app-e2147.web.app/platform/health-medicine/metabolic-control-dashboard.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "代謝控制儀表板記錄每天的糖攝取。"}]}, {"id": 54, "t": "🔥終於知道了早餐為什麼重要了！必讀篇！", "d": "Feb 28", "g": ["飲食與健康"], "b": "事實上，根據已有經驗，一碗穀物確實會導致高的葡萄糖峰值。穀物製品基本都是由精加工的玉米或者小麥經過高溫加熱後，又經過壓平或者膨化處理才最終形成。這種食品只含澱粉，不含纖維。並且，因為澱粉本身並不是非常美味，所以生產會在這些產品中加入食用糖。雖然生產生也會在產品中加入一些維生素和礦物質，但是這些的好處並不能抵消糖類等成分帶來的危害。\n\n當６０００萬美國人每天早餐一碗類似於蜂蜜堅果脆穀樂的麥片粥時，他們體內的血糖、果糖和胰島素水平均處於危險的範圍。他們的體內正在產生自由基，他們的胰腺處於超負荷狀態，他們的細胞正在受到損傷、脂肪正在堆積，他們可能自起床後便不停地想吃東西。老實說，這不是他們的錯。穀物製品既便宜又好吃，而且容易做。\n\n穀物製品看起來毫無害處，但事實並非如此。基於我們的飲食方式，每天早晨體內出現高的葡萄糖峰值成了常態。\n\n一頓早餐會讓血糖水平飆升，很快我們就會再次感到飢餓。更重要的是，早餐會使一天中的血糖水平很難都得到控制，所以午餐和晚餐也會帶來很高的葡萄糖峰值。一方面，一頓使血糖水平飆升的早餐是一張葡萄糖過山車的單程車票。另一方面，一頓可以使血糖曲線平穩的早餐，也可以使午餐和完後的血糖水平更加平穩。\n\n早晨醒來處於空腹狀態時，身體對葡萄糖最為敏感。我們的胃是空的，所以進入胃的任何食物都會很快被消化。這就是為什麼早餐吃糖類和澱粉往往會導致一天中最大的葡萄糖峰值。\n\n不管糖來自玉米還是甜菜，像食用糖那樣被製成結晶的白色粉末；還是來自橙子，像果汁那樣被製成液體，它都是糖。不管來自哪種植物，葡萄糖和果糖對我們產生的影響毫無差別。\n\n如果吃下的是整個水果，糖往往會伴隨著纖維一同出現。纖維會顯著減緩攝入的任何糖類所引起的葡萄糖峰值的出現速度。\n\n但是，如果把水果打碎後，我們便將纖維粉粹成了微小的細末，纖維就不再能夠行使它們的保護功能了。如果還有疑問，你就可以這麼想，我們自己吃東西的時候不會粉粹纖維的。我們咀嚼功能很強大，但是也沒有強大到堪比每秒轉動４００次的破壁機的金屬刀片。\n\n如果把水果打碎、壓榨、乾燥並濃縮其中的糖分，去除水果中的纖維，就會給身體帶來快速且有害的衝擊——導致葡萄糖峰值的產生。\n\n一瓶果汁（不管是鮮榨果汁，還是帶果肉或者不帶果肉的橙汁）含有２４g糖，這是３個完整橙子的含糖量，並且不含有任何纖維。相當於一罐可口可樂的含糖量。", "c": "控糖健康", "k": "早上空肚子時，身體對糖最敏感。如果早餐吃甜麥片、果汁，血糖就會像坐雲霄飛車，一整天都很難穩，而且很快又餓。一瓶果汁的糖等於3顆柳橙，跟一罐可樂差不多，因為纖維被打碎了。早餐要吃平穩血糖的食物。", "m": ["早餐的重要", [["穀物麥片", ["精製澱粉", "加糖", "無纖維"]], ["早晨最敏感", ["空腹", "最大峰值"]], ["連鎖效應", ["影響午晚餐", "整天雲霄飛車"]], ["果汁", ["24g糖", "=3顆橙=一罐可樂"]], ["完整水果", ["纖維保護"]]]], "f": [["甜早餐", "麥片、果汁"], ["空腹吸收快", "血糖飆升"], ["很快又餓", "胰島素高"], ["整天波動", "午晚餐峰值也高"], ["改鹹早餐", "蛋白質+蔬菜+好油"]], "p": [{"no": "034", "n": "胺基酸可可粉包", "pr": "NT$780", "nd": ["肌肉", "能量"], "w": "胺基酸可可粉作為蛋白質早餐的一部分，取代甜麥片，讓血糖平穩。"}, {"no": "033", "n": "亞麻仁籽渣（2包）", "pr": "NT$198", "nd": ["腸道", "膳食纖維"], "w": "亞麻仁籽渣加進早餐，補回果汁與麥片缺少的纖維。"}, {"no": "049", "n": "加強B群（膠囊）", "pr": "NT$520", "nd": ["神經", "能量", "代謝"], "w": "加強 B 群支持能量代謝，早上有精神不靠甜食提神。"}], "a": [{"no": 77, "n": "節律營養系統", "u": "https://membership-app-e2147.web.app/lifeos/rhythm-nutrients.html", "cat": "醫學生／醫學健康 / 健康", "w": "節律營養系統規劃平穩血糖的早餐。"}, {"no": 91, "n": "代謝控制儀表板", "u": "https://membership-app-e2147.web.app/platform/health-medicine/metabolic-control-dashboard.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "代謝控制儀表板比較不同早餐的血糖曲線。"}]}, {"id": 55, "t": "２６年我讀的第一本書！停不下來熬夜讀完的", "d": "Jan 22", "g": ["值得閱讀的好書", "一本好書", "讀書推薦", "成功法則", "成功"], "b": "成功者的特質中最重要也是最突出的，是希爾在《成功法則》一再強調的——要有明確的目標。目標，不光是要有追求，而且還要反應自己真心的渴望。無論你的渴望是財富、名譽、地位、感情、突破，還是成功，都要化成明確的目標。而且，是愈清晰、愈具體愈好。\n\n如果你真心想要成功，不只要設立目標，更需要專注，把這個目標變成自己最喜歡的一件事，而不是抱著可有可無的態度來面對。\n\n這種專注和投入，不光是讓你全身心達到合一，其實還包含著吸引力法則的關鍵——你如果不斷透過行為和念頭，將全部的心力投入，去肯定你最後想要的結果，這個目標其實已經達成。\n\n你完全專注、完全投入一個目標，就好像結果已經發生，這樣又回過頭來不斷地給自己打氣，培養信心和正向。一天比一天更滋長的信心和正向，又讓你更能專注在已經完成的結果上。其實這裡講的就是正向思考。\n\n如果你想要成功，就要願意付出。這一點，也是完全符合吸引力法則的。想想，如果你懂得付出、樂於分享、不計較、待人慷慨，這種念頭自然會為你帶來更多，吸引更多。結果是你給的愈多，得到的也愈多——更多的機會、更多的肯定、更多的快樂、更多的滿足。\n\n希爾很重視專注和自我暗示的方法。他會請你專心守住一個目標，並不斷對自己重複這個目標及其達成的理由、方法和時間。這麼做，自然會讓你從裡到外、從外到裡，每一個細胞、每一個感知、每一個思考、每一個行為，都要不斷地重複相同的路徑。\n\n如果你想成功，透過一再地自我暗示，把思想、語言、行為變得一致，也就是在為自己鋪出一條通往成功的路。\n\n如果你也希望培養自信，希爾提醒你，要不斷地重複各種自信的念頭、語言、行為。\n\n你如果帶著自信和熱情，積極投入喜歡的事，自然會鼓舞、激勵、帶動周圍的人和你一起投入。\n\n希爾還提到一個人要成功，必須克服人類六種基本的恐懼。這六種恐懼分別是貧窮、死亡、疾病、失去所愛、老化、遭受批評的恐懼。", "c": "心靈成長", "k": "拿破崙·希爾說成功最重要的是「明確的目標」，越清楚越好。要很專心，把目標當成最喜歡的事，每天對自己重複目標（自我暗示），讓想法、說話、行動都一致。願意付出、分享，會得到更多。還要克服六種恐懼：窮、死、病、失去所愛、變老、被批評。", "m": ["《成功法則》", [["明確目標", ["真心渴望", "越具體越好"]], ["專注投入", ["像已經達成", "正向思考"]], ["付出", ["給越多得越多"]], ["自我暗示", ["重複目標理由方法時間", "思言行一致"]], ["六大恐懼", ["貧窮", "死亡", "疾病", "失去所愛", "老化", "批評"]]]], "f": [["設定明確目標", "寫下來"], ["自我暗示", "每天重複"], ["專注投入", "像已經完成"], ["樂於付出", "帶動他人"], ["克服恐懼", "邁向成功"]], "p": [{"no": "042", "n": "清思油滴35ml（迷迭香精油＋EPA魚油）", "pr": "NT$450", "nd": ["腦神經", "專注", "情緒"], "w": "清思油滴支持專注，把全部心力投入明確目標。"}, {"no": "098", "n": "粒線寶（膠囊）", "pr": "NT$550", "nd": ["粒線體", "能量", "恢復"], "w": "粒線寶支持能量，熱情投入需要好精神。"}], "a": [{"no": 102, "n": "人生顯化系統", "u": "https://valaivai087-ops.github.io/lifemanifastify/", "cat": "能力養成／自律行動 / 顯化", "w": "人生顯化系統把目標、自我暗示與行動串成一套。"}, {"no": 118, "n": "預測系統", "u": "https://membership-app-e2147.web.app/lifeos/prediction-system.html", "cat": "模型／系統／決策 / 預測", "w": "預測系統幫你把目標拆成清楚可預測的路徑。"}]}, {"id": 56, "t": "肝硬化與快餐有這關係！戒掉快餐！長知識了", "d": "Jan 5", "g": ["人體免疫力", "瞭解疾病的根源", "營養免疫學", "預防勝於治療", "肝臟", "肝硬化"], "b": "非酒精性脂肪肝在肝臟堆積脂肪時，並沒有任何症狀。在極少數的情況下，可能會發展為炎症，久而久之，會在肝臟形成疤痕，變成肝硬化的狀態，進而導致肝癌、肝衰竭，甚至死亡。\n\n快餐是引發這種疾病最有效的推手，因為非酒精性脂肪肝與汽水、肉類的攝取量有關。僅僅每天喝一罐汽水，就能提高４５％脂肪肝的患病機率。同樣地，每天吃肉量相當於至少１４塊炸雞塊的人，比起每天最多吃７塊炸雞塊的人，患脂肪肝的機率高了近３倍。\n\n非酒精性脂肪肝病也可能是由於膽固醇過載所致。雞蛋、肉類和乳製品中的膳食膽固醇可能會氧化，然後引起連鎖反應，導致多餘的脂肪肝在肝臟中堆積。\n\n有一項重要的發現，可能是膽固醇攝取量成為肝硬化和肝癌的一個強有力的預測指標。每天至少吃兩個麥當勞蛋堡的人，所攝取的膽固醇量會讓他們住院或死亡的風險明顯加倍。\n\n要避開肝臟疾病最常見的原因——非酒精性脂肪肝臟好的選擇，就是避免攝取過多的熱量、膽固醇、飽和脂肪，還有糖。", "c": "肝臟健康", "k": "脂肪肝一開始完全沒感覺，但時間久了可能變成肝硬化、肝癌。快餐是最大推手：每天一罐汽水，脂肪肝風險增加45%；吃很多炸雞塊風險變3倍。膽固醇吃太多也會傷肝。所以要少熱量、少膽固醇、少飽和脂肪、少糖。", "m": ["脂肪肝與快餐", [["病程", ["無症狀", "發炎→肝硬化→肝癌"]], ["汽水", ["每天一罐+45%"]], ["肉類", ["14塊雞塊風險3倍"]], ["膽固醇", ["氧化連鎖反應", "住院風險加倍"]], ["預防", ["少熱量膽固醇飽和脂肪糖"]]]], "f": [["快餐汽水", "糖與油過量"], ["肝臟堆脂肪", "無症狀"], ["發炎", "形成疤痕"], ["肝硬化", "肝癌風險"], ["戒快餐", "肝臟可修復"]], "p": [{"no": "077", "n": "肝寶（膠囊）", "pr": "NT$550", "nd": ["肝臟", "解毒", "代謝"], "w": "肝寶聚焦肝臟、解毒與代謝節點，照顧被快餐與汽水加重負擔的肝。"}, {"no": "085", "n": "NAC複方（膠囊）", "pr": "NT$530", "nd": ["肝臟", "抗氧化", "呼吸道", "解毒"], "w": "NAC 複方支持肝臟與抗氧化，對應膽固醇氧化的連鎖反應。"}, {"no": "010", "n": "甘速淨（代謝之王）", "pr": "NT$1500", "nd": ["代謝", "血糖", "肝臟"], "w": "甘速淨支持代謝、血糖與肝臟節點，戒汽水後的代謝保養。"}], "a": [{"no": 72, "n": "健康診斷系統", "u": "https://membership-app-e2147.web.app/lifeos/health-diagnosis.html", "cat": "醫學生／醫學健康 / 健康", "w": "健康診斷系統看懂肝功能與脂肪肝檢查。"}, {"no": 91, "n": "代謝控制儀表板", "u": "https://membership-app-e2147.web.app/platform/health-medicine/metabolic-control-dashboard.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "代謝控制儀表板記錄飲食，減少熱量、糖與飽和脂肪。"}]}, {"id": 57, "t": "２０２６年，你們都給我超級努力，提升自己", "d": "Jan 3", "g": ["讀書與思考", "每日讀書打卡", "讀書改變自己", "讀書提升自己", "２０２６年"], "b": "日本“經營之聖”稻盛和夫的六項精進中，有一條是“付出不亞於任何人的努力”。意思是：只要別人可以做到的，他都自認可以“不亞於”。\n\n二十世紀修行大師葛吉夫曾說“普通努力不算什麼，只有超級努力才算數。”\n\n無論是體能還是精神專注力，無論是高壓還是自發狀態下，人的潛能都超乎自己日常的理解。\n\n普通努力才會讓人覺得累，超級努力就不累了。如果你覺得累，不妨加碼試試看，也許就真的不累了。", "c": "心靈成長", "k": "稻盛和夫說要「付出不輸給任何人的努力」。葛吉夫說「普通努力不算什麼，超級努力才算數」。人的潛能比我們想的大很多。奇妙的是：普通努力會累，超級努力反而不累，覺得累時可以試著再加一點。", "m": ["超級努力", [["稻盛和夫", ["六項精進", "不亞於任何人的努力"]], ["葛吉夫", ["超級努力才算數"]], ["潛能", ["超乎想像"]], ["奇妙現象", ["普通努力累", "超級努力不累"]]]], "f": [["設定目標", "2026提升自己"], ["普通努力", "容易累"], ["加碼", "超級努力"], ["突破", "潛能被激發"], ["成長", "不累反而更有勁"]], "p": [{"no": "090", "n": "人參皂苷複方（膠囊）", "pr": "NT$560", "nd": ["體力", "循環", "適應力"], "w": "人參皂苷複方支持體力與適應力，支撐「超級努力」。"}, {"no": "098", "n": "粒線寶（膠囊）", "pr": "NT$550", "nd": ["粒線體", "能量", "恢復"], "w": "粒線寶支持細胞能量與恢復。"}, {"no": "039", "n": "大補王", "pr": "NT$1560", "nd": ["體力", "恢復", "免疫"], "w": "大補王支持體力、恢復與免疫。"}], "a": [{"no": 105, "n": "能力養成系統 350", "u": "https://membership-app-e2147.web.app/platform/ability-building/ability-development-system-350.html", "cat": "能力養成／自律行動 / 能力養成", "w": "能力養成系統 350 把超級努力用在對的能力上。"}, {"no": 37, "n": "自律模型 60 項", "u": "https://membership-app-e2147.web.app/platform/self-discipline-action/self-discipline-model-60-bilingual.html", "cat": "英文／語言學習 / 自律行動", "w": "自律模型 60 項讓每天加碼的努力能持續。"}]}, {"id": 58, "t": "關於心臟病，這篇筆記講的太透徹了！必讀篇", "d": "12/27/2025", "g": ["心臟病", "營養免疫學"], "b": "沉積在動脈管壁裡的脂肪，被稱為“動脈粥樣化斑塊”。對於大多數習慣傳統飲食的美國人而言，斑塊會在冠狀動脈中累積。這種斑塊沉積，稱為“動脈粥樣硬化”，是由富含膽固醇的粘性物質在血管中堆積所造成的。這個過程歷經數十年，在動脈裡慢慢累積，使血液流動的路徑變窄。當人們要使力時，由於到達心機的血液迴圈受到限制，嚴重到一定程度時，可能會導致新胸痛和壓迫感，這種症狀稱為心絞疼。如果斑塊破裂，就會在血管內形成血栓。突如其來的這種血管阻塞可能引發心肌梗塞，造成部分心臟損害，甚至壞死。\n\n對於突然死於心臟病的大多數美國人而言，他們最初的徵兆，也可能成為最後的症狀。這就是所謂的“心因性猝死”，患者在症狀發生最後一個小時內死亡。換句話說，有時你知道自己是高風險人群之前，就為時已晚。你可能在前一刻還覺得無病無痛，然後在下一個小時，就與世長辭。這就是為什麼事先防治對心臟病來說如此重要，甚至要趕在你知道患病之前。\n\n一項針對３～６歲意外死亡罹難者的研究發現，幾乎所有美國小孩的體內，都能找到脂肪斑紋，這是動脈粥樣硬化形成的第一階段。等到了二三十歲時，這些脂肪斑紋可能就會全部變為成熟的斑塊。而到了四五十歲時，這些斑塊就會開始“追殺”我們。\n\n究竟這些脂肪斑紋是多早開始出現的呢？動脈粥樣硬化甚至在出生之前就已經開始形成了。義大利的研究人員檢查了流產死胎，以及出生後不久即夭折的的早產兒的動脈，事實證明，假如母親的低密度脂蛋白（壞膽固醇）偏高，胎兒很可能就有動脈病變。這個發現顯示，動脈粥樣硬化可能不是開始於兒童時期的營養性疾病，而是早在母親懷孕期間就已經種下了病跟。\n\n動脈粥樣硬化斑塊的唯一致命風險因素就是膽固醇，尤其是血液中升高的壞膽固醇。事實上，之所以被稱你為“壞膽固醇”，就是因為它是膽固醇沉積到動脈中的載體。上千個年輕事故受害者的屍體解剖顯示，血液中膽固醇的值與動脈中粥樣硬化的量有。\n為了有效降低壞膽固醇，你需要大幅度降低３樣東西的攝取量：①反式脂肪，存在於加工食品、天然肉食品及乳製品中②飽和脂肪，主要存在於動物性食品及“垃圾食品”中③膳食膽固醇。來源於動物性食品，特別是雞蛋。", "c": "心血管健康", "k": "血管裡的斑塊從很小就開始了：3~6歲小朋友就有脂肪條紋，20~30歲變成斑塊，40~50歲開始危險。甚至媽媽懷孕時壞膽固醇高，胎兒血管就可能有變化。心臟病有時第一次發作就致命，所以要提早預防：少反式脂肪、飽和脂肪、膳食膽固醇。", "m": ["心臟病全貌", [["斑塊形成", ["膽固醇黏性物質", "數十年累積"]], ["症狀", ["心絞痛", "心梗", "猝死"]], ["從小開始", ["3-6歲脂肪條紋", "20-30歲斑塊"]], ["胎兒期", ["母親LDL高"]], ["降LDL三少", ["反式脂肪", "飽和脂肪", "膽固醇"]]]], "f": [["胎兒/兒童", "脂肪條紋"], ["20-30歲", "成熟斑塊"], ["40-50歲", "斑塊破裂風險"], ["猝死/心梗", "可能無預警"], ["全齡預防", "從飲食開始"]], "p": [{"no": "052", "n": "血循環", "pr": "NT$1350", "nd": ["循環", "心血管", "末梢循環"], "w": "血循環支持心血管循環，從年輕開始照顧血管。"}, {"no": "002", "n": "EPA+DHA複方粉包", "pr": "NT$1350", "nd": ["腦神經", "心血管", "抗發炎"], "w": "EPA+DHA 支持心血管與腦神經，孕期與全家都可討論是否補充（先問醫師）。"}, {"no": "060", "n": "Q10（10:1）（膠囊）", "pr": "NT$580", "nd": ["粒線體", "能量", "心臟", "抗氧化"], "w": "Q10 支持心臟能量與抗氧化。"}], "a": [{"no": 88, "n": "整合醫學 OS 版本", "u": "https://membership-app-e2147.web.app/platform/health-medicine/integrated-medicine-os-variant.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "整合醫學 OS 理解動脈粥樣硬化從小開始的過程。"}, {"no": 72, "n": "健康診斷系統", "u": "https://membership-app-e2147.web.app/lifeos/health-diagnosis.html", "cat": "醫學生／醫學健康 / 健康", "w": "健康診斷系統看懂 LDL 與心臟相關檢查。"}]}, {"id": 59, "t": "驚！！！腦中風與睡眠有這層關係！學到了！", "d": "2025/12/23", "g": ["中風", "腦中風", "睡眠"], "b": "９０％的中風，是流向腦部的血液被阻斷，從而導致部分腦器官缺氧壞死。這就是所謂的缺血性中風。另外一小部分的中風是出血性中風，是由於血管破裂，血液流入腦中所造成。中風所造成的傷害，取決於腦部的哪個部位缺氧（或出血），以及缺氧狀態持續了多久。出現短暫中風的人，可能只是感到四肢無力；而那些嚴重中風的人，則可能會癱瘓、失語，甚至因為中風發作過於頻繁而死。\n\n有時，血塊阻塞持續時間很短，短到自己沒察覺到，但這樣的短暫阻塞時間卻足以損傷大腦的一小部分。這些所謂的無症狀中風會多次發作，逐漸降低低認知功能，長久下來會造成病人痴呆、生理功能喪失等嚴重後果。大範圍的中風能讓人瞬間喪命，而小中風則會在幾年內慢慢殺死患者。\n\n睡眠不足或睡太多，都會增加中風的風險。那麼，到底睡多久才算不夠？睡多久又算太多呢？\n\n日本的科學家率先對這個問題提出研究結果。他們花了１４年時間，追蹤近１０萬名中年男女的睡眠狀況。相較於每晚平均睡７小時的人，每天睡４小時以下或睡１０小時以上的受試者，中風死亡的可能性大約高出５０％。\n\n最近一項針對１５萬名美國人的研究，則更徹底低論證了這個問題。研究發現，睡眠時間在６小時以下或是９小時以上的人，都有更高的中風機率。而那些風險最低的人，每天大約睡７～８小時似乎可將中風風險降到最低。我們還不確定，這樣的結果是否有因果關係，但在我們瞭解更多之前，還是好好睡覺吧！", "c": "腦部健康", "k": "中風大多是腦血管被塞住，腦細胞缺氧。也有「小中風」自己沒感覺，但會慢慢讓記憶變差。睡太少或睡太多都會增加中風風險：睡4小時以下或10小時以上，中風死亡風險高約50%。每天睡7~8小時最好。", "m": ["中風與睡眠", [["中風類型", ["缺血性90%", "出血性"]], ["無症狀小中風", ["認知下降", "失智"]], ["日本研究", ["10萬人14年", "<4或>10小時+50%"]], ["美國研究", ["15萬人", "<6或>9小時風險高"]], ["建議", ["每天睡7-8小時"]]]], "f": [["睡眠時間", "過少或過多"], ["血管風險增加", "血塊阻塞"], ["小中風累積", "認知下降"], ["大中風", "癱瘓失語"], ["睡7-8小時", "風險最低"]], "p": [{"no": "014", "n": "健康接地枕頭套", "pr": "NT$599", "nd": ["睡眠", "恢復"], "w": "健康接地枕頭套定位睡眠與恢復節點，幫助穩定睡 7–8 小時。"}, {"no": "050", "n": "銀杏複方（銀杏＋巴西蘑菇＋色氨酸＋防風＋玉米黃質）", "pr": "NT$510", "nd": ["腦循環", "眼睛", "睡眠", "神經"], "w": "銀杏複方聚焦腦循環與睡眠（含色氨酸），照顧大腦血流與睡眠。"}, {"no": "022", "n": "鼻貼 Nasal Strips", "pr": "NT$150", "nd": ["呼吸", "睡眠"], "w": "鼻貼改善睡眠時鼻腔通氣，呼吸順了睡得更好。"}], "a": [{"no": 77, "n": "節律營養系統", "u": "https://membership-app-e2147.web.app/lifeos/rhythm-nutrients.html", "cat": "醫學生／醫學健康 / 健康", "w": "節律營養系統協助建立固定作息與睡眠時數。"}, {"no": 69, "n": "身體訊號系統", "u": "https://membership-app-e2147.web.app/lifeos/body-signals.html", "cat": "醫學生／醫學健康 / 健康", "w": "身體訊號系統留意四肢無力等中風警訊。"}]}, {"id": 60, "t": "糖尿病是什麼，讀這本書很有幫助！學到了！", "d": "12/22/2025", "g": ["食物與健康", "飲食是身體地基", "營養免疫學", "糖尿病", "每日讀書打卡"], "b": "人體的消化系統會將碳水化合物分解成一種名為葡萄糖的單糖，這是身體所有細胞的主要能量來源。而要讓葡萄糖從血液進入細胞，需要胰島素的幫忙。我們可以把胰島素當作開啟細胞大門的鑰匙，讓葡萄糖進入。你每吃一頓飯，胰島素就會從胰臟中釋放出來，幫助把葡萄糖運送進入你的細胞。沒有胰島素，細胞就無法接收到葡萄糖，而且，葡萄糖會因此在血液裡積聚。久而久之，血液中這些額外的糖，將會損害身體裡所有血管。這就是為什麼糖尿病會導致失明、腎衰竭、心臟病及中風。高血糖還可能破壞神經，造成被稱為神經病的症狀，引起肢體麻木、刺痛和疼痛感。因為糖尿病患者的血管和神經受損，他們的下肢可能會因為血流迴圈和缺乏感覺，而導致傷口癒合不良，最後可面臨截肢的命運。\n\n在大多數Ⅰ型糖尿病患者中，自體免疫系統錯誤地破壞了在胰臟中負責分泌胰島素的Ｂ細胞，以致無法分泌胰島素，於是血糖就會升到不安全的濃度。\n\n在Ⅱ型糖尿病中，胰臟雖然可以分泌胰島素，但身體卻無法正常使用，所以血糖仍不正常。這是因為累積在肌肉和肝臟內的脂肪干擾了胰島素的作用。如果胰島素是開啟細胞的大門的鑰匙，那麼飽和脂肪酸是填滿鎖孔的粘膠。肌肉是葡萄糖的主要消費者，一旦葡萄糖無法進入肌肉之內，血糖就會上升到具破壞性的程度。這些囤積在肌肉細胞內的脂肪，來自你所吃的食物或原本的體脂肪。因此，是否預防、治療和逆轉Ⅱ型糖尿病，取決於飲食及生活方式。\n\n在血液中的脂肪，無論是自身所儲存的還是源於飲食的惡，都能在肌細胞裡堆積，並會產生有毒物質和自由基，阻斷胰島素訊號傳導的過程。如此一來，不論製造了多少胰島素，被脂肪損害的肌細胞都不能有效地使用它。研究證明，飲食中的脂肪含量越低，胰島素的作用越好。", "c": "控糖健康", "k": "吃進去的澱粉會變成葡萄糖，要靠胰島素這把鑰匙開門才能進細胞。沒有鑰匙或門鎖壞掉，糖就留在血液裡，久了會傷害全身血管和神經，造成失明、腎衰竭、截肢。第二型糖尿病是脂肪像黏膠塞住鎖孔，所以飲食少油能改善。", "m": ["認識糖尿病", [["胰島素", ["開門鑰匙", "餐後釋放"]], ["高血糖危害", ["失明", "腎衰竭", "心臟病中風", "神經病變截肢"]], ["Ⅰ型", ["自體免疫破壞B細胞"]], ["Ⅱ型", ["脂肪堵塞鎖孔", "肌肉肝臟"]], ["改善", ["低脂飲食", "生活方式"]]]], "f": [["吃碳水", "分解成葡萄糖"], ["胰島素開門", "葡萄糖進細胞"], ["鎖孔被脂肪堵", "無法進入"], ["血糖累積", "傷血管神經"], ["低脂飲食", "胰島素作用變好"]], "p": [{"no": "083", "n": "苦瓜皂甘複方", "pr": "NT$540", "nd": ["血糖", "代謝", "胰島"], "w": "苦瓜皂甘複方支持血糖與胰島節點。"}, {"no": "084", "n": "黃連素／小蘗鹼（膠囊）", "pr": "NT$560", "nd": ["血糖", "腸道", "代謝"], "w": "黃連素支持血糖代謝與胰島素訊號。"}, {"no": "069", "n": "發熱襪", "pr": "NT$25", "nd": ["末梢循環", "保暖"], "w": "發熱襪保暖末梢循環，糖尿病族群照顧雙腳更安心。"}], "a": [{"no": 91, "n": "代謝控制儀表板", "u": "https://membership-app-e2147.web.app/platform/health-medicine/metabolic-control-dashboard.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "代謝控制儀表板追蹤血糖，看見低脂飲食的效果。"}, {"no": 88, "n": "整合醫學 OS 版本", "u": "https://membership-app-e2147.web.app/platform/health-medicine/integrated-medicine-os-variant.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "整合醫學 OS 理解 I 型與 II 型糖尿病的差別。"}]}, {"id": 61, "t": "時間是物價之寶！這本書寫的太有力量了！！", "d": "12/15/2025", "g": ["閱讀筆記", "時間", "讀書打卡", "成長"], "b": "假如今天是我生命中的最後一天。\n我要如何利用這最後、最寶貴的一天呢？首先，我要把一天的時間珍藏好，不讓一分一秒的時間滴漏。我不為昨日的不幸嘆息，過去的已夠不幸，不要再賠上今天的運道。\n時光會倒流嗎？太陽會西升東落嗎？我可以糾正昨天的錯誤嗎？一句出口的惡言，一記揮出的拳頭，一切造成的傷痛，能收回嗎？\n不能！過去的永遠過去了，我不再想它。\n\n假如今天是我生命的最後一天。\n我該怎麼辦？忘記昨天，也不痴想明天。明天是一個未知數，為什麼要把今天的精力浪費在未知的事上？想著明天的種種，今天的時光也白白流逝。企盼今早的太陽再次升起，太陽已經落山。走在今天的路上，能做明天的事嗎？我能把明天的金幣放進今天的錢袋裡嗎？明日瓜熟，今日能落嗎？明天的死亡能將今天的歡樂蒙上陰影嗎？我能杞人憂天嗎？明天和昨天一樣被我埋葬。我不再想它。\n\n假如今天是我生命中最後的一天。\n這是我僅有的一天，是現實的永恆。我像被赦免死刑犯的囚犯，用喜悅的淚水擁抱新生的太陽。我舉起雙手，感謝無與倫比的一天。當我想到昨天和一起迎接日出的朋友，今天已不復存在時，我為自己的倖存，感激上蒼。我是無比幸運的人，今天的時光是額外的獎賞。許多強者都先我而去，為什麼我得到這額外的一天？是不是因為他們已大功告成，而我尚在途中跋涉？如果這樣，這是不是成就我的一次機會，讓我功德圓滿？造物主的安排是否別具匠心？今天是不是我超越其他人的機會？\n\n假如今天是我生命中最後一天。\n生命只有一次，而人生也不過是時間的累積。我若讓今天的時光白白流逝，就等於毀掉人生最後一頁。因此，我珍惜今天的一分一秒，因為它們將一去不復返。我無法把今天存入銀行，明天再用來取用。時間像風一樣不可捕捉。每一分一秒，我要用雙手捧住，用愛心撫摸，因為它們如此寶貴。垂死的人用畢生的錢財都無法換得一口生氣。我無法計算時間的價值，它們是無價之寶。\n\n假如今天是我生命中的最後一天。\n我憎恨那些浪費時間的行為。我要摧毀拖延的習性。我要以真誠埋葬懷疑，用信心驅趕恐懼。我不聽閒話，不遊手好閒，不與不務正業的人來往。我終於醒悟到，若是懶惰，無異於從我所愛之人的手中竊取食物和衣裳。我不是賊，我有愛心，今天是我最後的機會，我要證明我的愛心和偉大。", "c": "心靈成長", "k": "《世界上最偉大的推銷員》說：把今天當作生命最後一天。不要為昨天後悔，也不要擔心明天，因為過去回不來、明天還沒到。時間是無價之寶，不能存進銀行。今天就不要浪費時間、不拖延、不說閒話，好好珍惜每一分每一秒。", "m": ["珍惜今天", [["忘記昨天", ["過去無法收回"]], ["不想明天", ["明天是未知數"]], ["感恩今天", ["額外的獎賞"]], ["時間無價", ["無法存進銀行"]], ["行動", ["摧毀拖延", "不聽閒話"]]]], "f": [["醒來", "今天是最後一天"], ["放下昨天", "不嘆息"], ["不憂明天", "專注當下"], ["珍惜每分秒", "不拖延"], ["證明愛心與偉大", "活出價值"]], "p": [{"no": "042", "n": "清思油滴35ml（迷迭香精油＋EPA魚油）", "pr": "NT$450", "nd": ["腦神經", "專注", "情緒"], "w": "清思油滴支持專注，珍惜每一分每一秒、不分心。"}, {"no": "098", "n": "粒線寶（膠囊）", "pr": "NT$550", "nd": ["粒線體", "能量", "恢復"], "w": "粒線寶支持能量，把今天當最後一天全力以赴。"}], "a": [{"no": 113, "n": "秩序系統", "u": "https://valaivai087-ops.github.io/order/", "cat": "模型／系統／決策 / 秩序", "w": "秩序系統幫你規劃今天，摧毀拖延。"}, {"no": 36, "n": "拖延模型 60 項", "u": "https://membership-app-e2147.web.app/platform/self-discipline-action/procrastination-model-60-bilingual.html", "cat": "英文／語言學習 / 自律行動", "w": "拖延模型 60 項找出浪費時間的根源。"}]}, {"id": 62, "t": "我現在就付諸行動。克服拖延太有效了！！！", "d": "12/14/2025", "g": ["每日一讀", "讀書打卡", "自我成長", "成功", "拖延"], "b": "我現在就付諸行動。\n拖延使我裹足不前，它來自恐懼。現在我從所有勇敢的心靈深處，體會到這一秘密。我知道，想克服恐懼，必須毫不猶豫，起而行動，唯其如此，心中的慌亂方得以平定。現在我知道，行動會使猛獅般的恐懼，減緩為螞蟻般的平靜。\n\n我現在就付諸行動。‘\n從此我要記住螢火蟲的啟迪：只有在振翅的時候，才能發出光芒。我要成為一隻螢火蟲，即使在豔陽高照的白天，我也要發出光芒。讓別人像蝴蝶一樣，舞動翅膀，靠花朵的施捨生活；我要做螢火蟲，照亮大地。\n\n我現在就付諸行動。\n我不把今天的事情留給明天，因為我知道明天是永遠不會來臨的。現在就去行動吧！即使我的行動不會帶來快樂與成功，但是動而失敗總比坐而待斃好。行動也許不會給出快樂的果實，但是沒有行動，所有的果實都無法收穫。\n\n我現在就要付諸行動。\n立刻行動！立刻行動！立刻行動！從今往後，我要一遍又一遍，每時每刻重複這句話，直到成為習慣，好比呼吸一般，成為本能，好比眨眼一樣。有了這句話，我就能調整自己的情緒，迎接失敗者避而遠之的每一次挑戰。\n\n我現在就付諸行動。\n我要一遍又一遍地重複這句話。\n清晨醒來時，失敗者流連於床榻，我卻要默誦這句話，然後開始行動。\n\n我現在就付諸行動。\n只有行動才能決定我在商場上的價值。若要加倍我的價值，我必須加倍努力。我要前往失敗者恐懼的地方，當失敗者休息時候，我要繼續工作。失敗者沉默的時候，我開口推銷。我要拜訪十戶可能買我東西的人家，而失敗者在一番周詳的計劃之後，卻拜訪一家。\n\n我現在就付諸行動。\n現在是我的所有。明日是為懶漢保留的工作日，我並不懶惰；明日是棄惡從善的日子，我並不邪惡；明日是弱者變為強者的日子，我並不軟弱；明日是失敗者藉口成功的日子，我並不是失敗者。\n\n我現在就要付諸行動。\n我是雄獅，我是蒼鷹，餓即食，渴即飲，除非行動，否則死路一條。\n我渴望成功、快樂、心靈的平靜。除非行動，否則我將在失敗、不幸、夜不成眠的日子中死亡。\n\n我現在就付諸行動。\n成功不是等待。如果我遲疑，她會投入別人的懷抱，永遠棄我而去。\n此時。此地。此人。\n我現在就要付諸行動。", "c": "心靈成長", "k": "拖延是因為害怕。克服害怕最好的方法就是：馬上行動！螢火蟲只有拍翅膀時才會發光。今天的事不要留到明天，因為明天永遠不會來。就算做了失敗，也比坐著等好。每天一直對自己說「我現在就付諸行動」，直到變成習慣。", "m": ["立刻行動", [["拖延根源", ["來自恐懼"]], ["螢火蟲", ["振翅才發光"]], ["不等明天", ["明天永遠不來"]], ["動而失敗", ["好過坐以待斃"]], ["口訣", ["我現在就付諸行動", "重複成習慣"]]]], "f": [["想拖延", "感到害怕"], ["默唸口訣", "我現在就付諸行動"], ["立刻做", "不猶豫"], ["恐懼變小", "猛獅→螞蟻"], ["成為習慣", "像呼吸一樣"]], "p": [{"no": "040", "n": "迷迭香滾珠瓶10ml", "pr": "NT$150", "nd": ["專注", "情緒"], "w": "迷迭香滾珠瓶提神醒腦，默唸「我現在就付諸行動」時抹一點。"}, {"no": "098", "n": "粒線寶（膠囊）", "pr": "NT$550", "nd": ["粒線體", "能量", "恢復"], "w": "粒線寶支持能量，早上不賴床、立刻行動。"}], "a": [{"no": 36, "n": "拖延模型 60 項", "u": "https://membership-app-e2147.web.app/platform/self-discipline-action/procrastination-model-60-bilingual.html", "cat": "英文／語言學習 / 自律行動", "w": "拖延模型 60 項拆解「拖延來自恐懼」。"}, {"no": 107, "n": "高主動性 OS", "u": "https://membership-app-e2147.web.app/platform/ability-building/high-agency-os-complete.html", "cat": "能力養成／自律行動 / 能力養成", "w": "高主動性 OS 把立刻行動變成習慣。"}]}, {"id": 63, "t": "今天我要學會控制情緒。這本書充滿了力量！", "d": "今天我要學會控制情緒。", "g": ["文字的力量振聾發聵", "自我成長", "每日讀書打卡"], "b": "潮起潮落，冬去春來，夏末秋至，日出日落，月圓月缺，雁來雁往，花開花謝，草長瓜熟，自然界萬物都在迴圈反覆的變化中，我也不例外，情緒會時好時壞。\n\n這是大自然的玩笑，很少有人窺破天機。每天我醒來時，不再有舊日的心情。昨日的快樂變成今日的哀愁，今日的悲傷又轉為明日的喜悅。我心中像有一隻輪子不停地轉著，由樂而悲，由悲而喜，由喜而憂。這就好比花兒的變化，今天綻放的喜悅也會變成凋謝時的絕望。但是我要記住，正如今天枯敗的花兒蘊藏著明天新生的種子，今天的悲傷也預示著明天的快樂。\n\n我怎樣才能控制情緒，讓每天充滿幸福和歡樂？我要學會這個千古秘訣：弱者任思緒控制行為，強者讓行為控制思緒。每天醒來當我被悲傷、自憐、失敗的情緒包圍時，我就這樣與之對抗：沮喪時，我引哼高歌。悲傷時，我開懷大笑。悲痛時，我加倍工作。恐懼時，我勇往直前。自卑時，我換上新裝。不安時，我提高嗓音。\n\n窮困潦倒時，我想像未來的富有。力不從心時，我回想過去的成功。自輕自賤時，我想想自己的目標。\n\n總之，今天我要學會控制自己的情緒。\n從今往後，我明白了，只有低能者才會江郎才盡，我並非低能者，我必須不斷對抗那些企圖摧垮我的力量。失望與悲傷一眼就會被識破，而使其他許多敵人是不易覺察的。他們往往面帶微笑，招手而來，卻隨時間可能將我摧毀。對他們，我永遠不能放鬆警惕。\n\n自高自大時，我要追尋失敗的記憶。\n縱情享受時，我要記得捱餓的日子。\n洋洋得意時，我要想想競爭對手。\n沾沾自喜時，不要忘了那忍辱的時刻。\n自以為是時，看看自己能否讓風駐步。\n腰纏萬貫時，想想那些食不果腹的人。\n驕傲自滿時，要想到自己怯懦的時候。", "c": "情緒管理", "k": "情緒就像四季和花開花謝，會好也會壞。秘訣是：弱者讓心情控制行為，強者讓行為控制心情。難過時就唱歌，傷心時就大笑，害怕時就往前衝，自卑時換件新衣服。太得意時也要想想失敗的時候，保持平衡。", "m": ["控制情緒", [["自然規律", ["情緒時好時壞", "像四季"]], ["秘訣", ["行為控制思緒"]], ["低落時", ["沮喪→高歌", "悲傷→大笑", "恐懼→前進", "自卑→新裝"]], ["得意時", ["想失敗記憶", "想挨餓日子", "想競爭對手"]]]], "f": [["情緒來襲", "悲傷/自憐/得意"], ["察覺", "辨認是什麼情緒"], ["用行為對抗", "唱歌、大笑、換新裝"], ["平衡", "得意時想低谷"], ["掌控情緒", "每天更幸福"]], "p": [{"no": "028", "n": "心膚精油特價組", "pr": "NT$1200", "nd": ["情緒", "放鬆", "肌膚"], "w": "心膚精油組支持情緒與放鬆，用行為帶動情緒轉換。"}, {"no": "054", "n": "GABA（膠囊）", "pr": "NT$540", "nd": ["睡眠", "情緒", "放鬆"], "w": "GABA 支持放鬆，情緒低落或激動時幫助回穩。"}, {"no": "040", "n": "迷迭香滾珠瓶10ml", "pr": "NT$150", "nd": ["專注", "情緒"], "w": "迷迭香滾珠瓶提振精神，沮喪時搭配高歌、換新裝一起用。"}], "a": [{"no": 63, "n": "情緒導航 APP", "u": "https://membership-app-e2147.web.app/lifeos/emotion-navigation-app.html", "cat": "情緒心理／信念療癒 / 心理", "w": "情緒導航 APP 練習「讓行為控制思緒」。"}, {"no": 57, "n": "情緒煉金完整版", "u": "https://membership-app-e2147.web.app/lifeos/emotion-alchemy-complete.html", "cat": "情緒心理／信念療癒 / 心理", "w": "情緒煉金完整版把情緒轉成可運用的力量。"}]}, {"id": 64, "t": "內耗時，太適合讀這本書了！枕邊書，反覆讀", "d": "2025/12/11", "g": ["成長", "內耗", "自我成長", "每日讀書打卡"], "b": "堅持不懈，直到成功。\n我不是為了失敗才來到這個世界上的，我的血管裡也沒有失敗的血液在流動。我不是任人鞭打的羔羊，我是猛獅，不與羊群為伍。我不想聽失意者的哭泣，抱怨者的牢騷，這是羊群中的瘟疫，我不能被它傳染。失敗者的屠宰場不是我命運的歸宿。\n\n堅持不懈，直到成功。\n生命的獎賞遠在旅途終點，而非起點附近。我不知道要走多少步才能達到目標，踏上第一千步的時候，仍然可能遭到失敗。但成功就藏在拐角後面，除非拐了彎，我永遠不知道有多遠。再前進一步，如果沒有用，就再向前一點。事實上，每次進步一點點並不太難。\n\n堅持不懈，直到成功。\n從今往後，我承認每天的奮鬥就像對參天大樹的一次砍擊，頭幾刀可能了無痕跡。每一擊看似微不足道，然而，累積起來，巨樹終會倒下。這恰如我今天的努力。\n就像沖洗高山的雨滴，吞噬猛獸的螞蟻，照亮大地的星辰，建起金字塔的奴隸，我也要一磚一瓦地建造起自己城堡，因為我深知水滴石穿的道理，只要持之以恆，什麼都可以做到。\n\n堅持不懈，直到成功。\n我決不考慮失敗，我的字典裡不再有放棄、不可能、辦不到、沒法子、成問題、失敗、行不通、沒希望、退縮．．．這類愚蠢的字眼。我要儘量避免絕望，一旦受它的威脅，立即想方設法向它挑戰。我要辛勤耕耘，忍受苦楚。我放眼未來，勇往直前，不再理會腳下的障礙。我堅信，沙漠盡頭必是綠洲。\n\n堅持不懈，直到成功。\n我要牢牢記住古老的平衡法則，鼓勵自己堅持下去，因為每一次的失敗都會增加下一次成功的機會；這一次的拒絕就是下一次的贊同；這一次的皺起眉頭就是下一次舒展的笑容；今天的不幸，往往預示著明天的好運。夜幕降臨，回想今天的遭遇，我總是心存感激。我深知，只有失敗多次，才能成功。\n\n堅持不懈，直到成功。\n我要嘗試，嘗試，再嘗試。障礙時我成功路上的彎路，我迎接這項挑戰。我要像水手一樣，乘風破浪。\n\n堅持不懈，直到成功。\n從今往後，我借鑑別人成功的秘訣。過去的是非成敗，我全不計較，只抱定信念，明天會更好。當我精疲力竭時，我要抵制回家的誘惑，再試一次。我一試再試，爭取每一天的成功，避免以失敗收場。我要為明天的成功播種，超過那些按部就班的人。在別人停滯不前時，我繼續拼搏，終有一天我會豐收。\n\n只要我一息尚存，就要堅持到底，因為我已深知成功的秘訣：堅持不懈，終會成功。", "c": "心靈成長", "k": "堅持到成功！成功的獎賞在路的盡頭，不在起點。就像砍大樹，前幾刀看不出痕跡，但累積起來樹一定會倒。不要說「不可能」「辦不到」。每次失敗都讓下次成功的機會更大。累了想放棄時，再試一次就好。", "m": ["堅持不懈", [["自我認同", ["我是猛獅", "不與羊群為伍"]], ["獎賞在終點", ["成功在拐角後"]], ["累積", ["砍大樹", "水滴石穿"]], ["禁用詞", ["不可能", "辦不到", "放棄"]], ["平衡法則", ["失敗增加成功機會"]]]], "f": [["開始", "設定目標"], ["每天一刀", "微小進步"], ["遇到失敗", "視為下次機會"], ["想放棄", "再試一次"], ["樹倒下", "終會成功"]], "p": [{"no": "090", "n": "人參皂苷複方（膠囊）", "pr": "NT$560", "nd": ["體力", "循環", "適應力"], "w": "人參皂苷複方支持體力與適應力，堅持不懈需要續航力。"}, {"no": "054", "n": "GABA（膠囊）", "pr": "NT$540", "nd": ["睡眠", "情緒", "放鬆"], "w": "GABA 支持放鬆，內耗時讓心安靜下來再出發。"}], "a": [{"no": 37, "n": "自律模型 60 項", "u": "https://membership-app-e2147.web.app/platform/self-discipline-action/self-discipline-model-60-bilingual.html", "cat": "英文／語言學習 / 自律行動", "w": "自律模型 60 項讓每天「砍一刀」變成習慣。"}, {"no": 11, "n": "批評轉能力雙語版", "u": "https://membership-app-e2147.web.app/lifeos/criticism-to-ability-bilingual.html", "cat": "英文／語言學習 / 能力", "w": "批評轉能力雙語版把每次失敗轉成下次成功的線索。"}]}, {"id": 65, "t": "月經週期徹底搞懂了！這篇筆記值得收藏！！", "d": "2025/12/9", "g": ["瞭解自己的身體", "月經", "月經週期", "女性健康", "排卵期", "健康養生", "養姨媽"], "b": "第一階段：卵泡期（持續時間：７～１０天）\n下丘腦向垂體發出訊號，命令它向卵巢傳送卵泡刺激素，告訴卵巢準備釋放卵子。卵泡開始生長發育。雌激素增加，使子宮內膜增厚，從而使其能允許受精卵著床。\n\n第二階段：排卵期（持續時間：３～４天）\n卵泡刺激素水平急劇升高，隨後同樣由於垂體分泌的黃體生長素水平也在升高，這會刺激一個卵泡進一步發育並分裂，將卵子釋放到其中一根輸卵管；隨後卵子會進入子宮。雌激素水平持續升高，這會進一步使子宮內膜增厚，並促進子宮內免疫系統細胞的生長。在排卵期前後，睪酮水平會先迅速大幅度上升，然後再下降。\n\n第三階段：黃體期（持續時間：１０～１４天）\n\n黃體是排卵後剩下的卵泡殘骸形成的。黃體形成後，會在卵巢內生長，促使卵巢分泌黃銅。孕酮水平的升高會向身體發出保持子宮內膜完整的訊號。同時它還想垂體發出停止釋放卵泡刺激素和黃體生長素的訊號，確保每個週期中只有一個卵子被釋放到子宮中。此階段，雌激素水平繼續上升。在此階段接近尾聲時，如果卵子尚未受精，黃體就會被吸收，孕酮的分泌很快就會停止，從而引發月經。此階段結束時睪酮的分泌會增加。\n\n第四階段：月經期（持續時間：３～７天）\n隨著黃體的消失，孕酮分泌也會減少，這會觸發子宮內膜脫落，即月經期。雌激素分泌會先升至頂峰然後再下降，刺激下丘腦為下一個卵泡週期做準備。", "c": "女性健康", "k": "月經週期有四個階段：1.卵泡期：卵子準備長大，子宮內膜變厚；2.排卵期：卵子被放出來；3.黃體期：黃體分泌黃體素，讓子宮內膜維持；4.月經期：沒有受孕，內膜就脫落變成月經，然後重新開始。", "m": ["月經週期", [["卵泡期7-10天", ["FSH", "雌激素升", "內膜增厚"]], ["排卵期3-4天", ["LH高峰", "排出卵子", "睪酮升降"]], ["黃體期10-14天", ["黃體素", "維持內膜"]], ["月經期3-7天", ["黃體素降", "內膜脫落"]]]], "f": [["卵泡期", "卵泡長大"], ["排卵期", "卵子釋放"], ["黃體期", "維持內膜"], ["月經期", "內膜脫落"], ["循環", "下一週期開始"]], "p": [{"no": "069", "n": "發熱襪", "pr": "NT$25", "nd": ["末梢循環", "保暖"], "w": "發熱襪保暖末梢，經期怕冷時讓身體更舒適。"}, {"no": "091", "n": "甘氨酸鎂複方粉包", "pr": "NT$1350", "nd": ["睡眠", "神經", "肌肉", "放鬆"], "w": "甘氨酸鎂複方支持肌肉與神經放鬆，經期緊繃不適時的營養支持。"}, {"no": "023", "n": "行氣精油", "pr": "NT$1200", "nd": ["循環", "放鬆", "情緒"], "w": "行氣精油搭配腹部按摩，經期放鬆舒緩。"}], "a": [{"no": 77, "n": "節律營養系統", "u": "https://membership-app-e2147.web.app/lifeos/rhythm-nutrients.html", "cat": "醫學生／醫學健康 / 健康", "w": "節律營養系統依週期安排飲食與作息。"}, {"no": 69, "n": "身體訊號系統", "u": "https://membership-app-e2147.web.app/lifeos/body-signals.html", "cat": "醫學生／醫學健康 / 健康", "w": "身體訊號系統讀懂四個階段的身體變化。"}]}, {"id": 66, "t": "有月經問題的看過來，收藏篇！！強烈推薦！", "d": "2025/12/8", "g": ["生殖系統女性", "關係女性健康", "身體是自己的", "關愛女性內分泌健康", "月經", "生育"], "b": "你為什麼會出現月經問題？\n\n基因和營養素決定了你的身體對大量雌激素的反應。你以後可能會出現哪些健康問題，在你出生或初潮之前就已經確定了，這是很有趣。\n\n例如，“我”的祖父母在戰爭摧殘的義大利長大，經歷了食物匱乏的時期，從表觀遺傳學上看，基因改變在“我”祖父母那輩就發生了變化，所以現在“我”的身體能量代謝緩慢並善於儲存葡萄糖。“我”遺傳了能量代謝緩慢的傾向，而且“我”從小到大吃的一直都是典型的義大利裔美國人喜歡吃的食物，如白麵包、義大利麵和乳酪，這些食物更是激活了“我”體內的這些基因。\n\n在“我”祖父母生活的時代，他們可以憑藉能量代謝緩慢的優勢生存下來。然而，時代變遷，在一個富足的時代，它卻為“我”帶來了煩人的問題。“我”以前沒有意識到“我”的身體只能承受較少量的糖，所以“我”吃的都是富含碳水化合物的食物。這意味著幾十年來，“我”的血糖水平一直偏高，這導致慢性的內部壓力、體重增加，以及“我”剛才說的體內雌激素積累的問題最終，“我”由於體內雌激素水平過高和其他激素紊亂而被診斷為多囊綜合徵。\n\n你為什麼會出現生育問題？\n\n你體內的雌激素和孕酮需要保持特定的比例，這樣你才能成功受孕。當雌激素水平因為血糖控制不佳、腎上腺疲勞和排毒通路堵塞而升高時，孕酮的相對濃度可能就會不足。當激素和孕酮比例被破壞時，排卵也會變得不規律，就像在圍絕經期那樣，即使你還年輕。如果孕酮水平過低，你的身體很難受孕；即使你能夠受孕，孕酮水平過低也會增加流產的風險。任何有生育困擾的女性都知道，僅僅能夠受孕是不夠的；你還要讓身體做好足月分娩的準備。\n\n雌激素水品過高會以另一種間接的方式影響你的生育能力。透過上面的討論，你瞭解了過量的雌激素是如何增加你月經出現問題的機率的。不幸的是，月經出現問題的一個主要副作用是削弱生育能力。比如，多囊卵巢綜合徵會阻礙排卵，而正常排卵是卵子成功受精不可缺少的因素。又如，子宮肌瘤和子宮內膜異位症患者的子宮記憶體在功能性堵塞，這會阻礙受精卵成功著床。", "c": "女性健康", "k": "月經問題可能跟基因和營養有關。作者家族遺傳「很會存糖」的體質，加上愛吃白麵包、麵條，血糖長期偏高，雌激素累積，得了多囊性卵巢。雌激素和黃體素比例要平衡才好受孕，血糖控制不好、壓力大、排毒不順都會打亂比例。", "m": ["月經與生育", [["成因", ["表觀遺傳", "營養", "血糖"]], ["作者案例", ["祖父母飢荒", "代謝慢", "多囊"]], ["激素比例", ["雌激素vs黃體素"]], ["擾亂因素", ["血糖", "腎上腺疲勞", "排毒不暢"]], ["影響", ["排卵不規律", "受孕難", "肌瘤內膜異位"]]]], "f": [["高碳水飲食", "血糖偏高"], ["慢性壓力", "雌激素累積"], ["比例失衡", "黃體素相對不足"], ["月經/生育問題", "多囊、不孕"], ["改善", "控糖、減壓、助代謝"]], "p": [{"no": "084", "n": "黃連素／小蘗鹼（膠囊）", "pr": "NT$560", "nd": ["血糖", "腸道", "代謝"], "w": "黃連素支持血糖代謝，對應「血糖偏高→雌激素累積」。"}, {"no": "077", "n": "肝寶（膠囊）", "pr": "NT$550", "nd": ["肝臟", "解毒", "代謝"], "w": "肝寶支持肝臟代謝與解毒，幫助處理用過的雌激素。"}, {"no": "047", "n": "刺五加（膠囊）", "pr": "NT$495", "nd": ["壓力", "體力", "適應力"], "w": "刺五加支持壓力適應，對應腎上腺疲勞的影響。"}], "a": [{"no": 91, "n": "代謝控制儀表板", "u": "https://membership-app-e2147.web.app/platform/health-medicine/metabolic-control-dashboard.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "代謝控制儀表板穩定血糖，從源頭減少激素失衡。"}, {"no": 70, "n": "皮質醇系統", "u": "https://membership-app-e2147.web.app/lifeos/cortisol-system.html", "cat": "醫學生／醫學健康 / 健康", "w": "皮質醇系統理解壓力對激素比例的影響。"}]}, {"id": 67, "t": "腎這麼滋養，太太太太長知識了！讀書真好！", "d": "2025/12/4", "g": ["關注自己的身體", "讀書打卡筆記", "營養免疫學"], "b": "在早期階段、腎上腺疲勞的特點是持續性疲勞和缺乏活力。其他跡象包括痤瘡、體重增加、失眠、抑鬱、易患感冒和易被感染其他疾病，以及對糖充滿渴望。對許多女性來說，腎上腺疲勞已經成為新的“常態”，她們甚至沒有意識到自己可以糾正這一點並可以感覺更好。\n\n雖然我們通常將腎上腺與調節壓力聯繫在一起，但腎上腺還有許多其他重要的功能。為了更好地瞭解腎上腺的功能，請先了解一下組成腎上腺的兩個部分——腎上腺皮質（外層）和腎上腺髓質（內層）。\n\n１、腎上腺皮質：腎上腺皮質不會自動發揮作用；下丘腦向垂體發出訊號，讓它分泌一種激素來控制腎上腺皮質發揮作用，，這種激素是促腎上腺皮質激素。\n\n腎上腺皮質可以被進一步分解為３個微觀區域。由於每個區域中都有獨特的酶存在，所以它們會分泌不同的激素，對身體產生不同的影響。\n\n這三個區域分別是：①促腎上腺皮質球狀帶。位於腎上腺最外層的皮質，可以產生醛固酮激素，有助於調節血壓，調節細胞內的鈉鉀平衡——這種平衡可使細胞存活、分裂並保持完整。沒有這種激素我們就無法存活下去。\n\n②腎上腺皮質束狀帶。位於腎上腺中間層，可以分泌大量皮質醇。你的身體需要一定量的皮質醇在血壓中流動，以維持晝夜節律，並讓你的身體能夠在你需要燃料時將細胞中儲存的脂肪、蛋白質和碳水化合物轉化為能量。\n\n③腎上腺網狀帶。位於腎上腺最內層，可產生脫氫表雄酮。這是雄激素、雌激素和睪酮激素的前提。在女性體內，９０％的睪酮是由腎上腺這一區域的脫氫表雄酮轉化而來。這種激素對男性和女性來說都是至關重要的，可以保持並增加促進燃脂的肌肉的量，增強性慾、保持精力，保護骨骼，保護心理健康和保持認知功能正常。\n\n２、腎上腺髓質：腎上腺最內層的腎上腺髓質是“戰鬥或逃跑”反應的控制中心。它釋放的激素會激發身體對壓力的反應。當你感到有壓力時，腎上腺髓質會分泌去甲腎上腺素，從而使血管收縮，血壓升高。與此同時，它還會分泌腎上腺素，從而使你的心率加快，引導器官中的血液流向肌肉，為的是讓你跑得過張牙舞爪得羅威納犬。", "c": "女性健康", "k": "腎上腺疲勞時會一直很累、長痘痘、變胖、睡不好、容易感冒、很想吃甜。腎上腺外層會做三種激素：調血壓的醛固酮、幫助能量和作息的皮質醇、做成性激素的DHEA；內層負責「戰鬥或逃跑」，壓力來時心跳加快、血壓升高。", "m": ["腎上腺", [["疲勞徵兆", ["持續疲勞", "痘痘失眠", "嗜糖易感冒"]], ["皮質球狀帶", ["醛固酮", "血壓鈉鉀"]], ["皮質束狀帶", ["皮質醇", "晝夜節律能量"]], ["皮質網狀帶", ["DHEA", "女性90%睪酮"]], ["髓質", ["戰鬥或逃跑", "腎上腺素"]]]], "f": [["長期壓力", "不斷觸發"], ["髓質", "腎上腺素、正腎上腺素"], ["皮質", "皮質醇過度分泌"], ["腎上腺疲勞", "疲倦、嗜糖"], ["修復", "作息、減壓、營養"]], "p": [{"no": "047", "n": "刺五加（膠囊）", "pr": "NT$495", "nd": ["壓力", "體力", "適應力"], "w": "刺五加屬適應原，支持壓力適應與體力，對應腎上腺疲勞。"}, {"no": "087", "n": "超級B群（膠囊）", "pr": "NT$520", "nd": ["能量", "神經", "代謝"], "w": "超級 B 群支持能量與神經代謝，腎上腺製造激素也需要 B 群。"}, {"no": "014", "n": "健康接地枕頭套", "pr": "NT$599", "nd": ["睡眠", "恢復"], "w": "健康接地枕頭套支持睡眠恢復，好好睡是腎上腺修復的基礎。"}], "a": [{"no": 70, "n": "皮質醇系統", "u": "https://membership-app-e2147.web.app/lifeos/cortisol-system.html", "cat": "醫學生／醫學健康 / 健康", "w": "皮質醇系統完整理解腎上腺與皮質醇。"}, {"no": 69, "n": "身體訊號系統", "u": "https://membership-app-e2147.web.app/lifeos/body-signals.html", "cat": "醫學生／醫學健康 / 健康", "w": "身體訊號系統讀懂疲勞、嗜糖、易感冒等訊號。"}]}, {"id": 68, "t": "✅擁有深度睡眠的秘密！！分享給大家！！", "d": "2025/12/3", "g": ["讀書打卡筆記", "睡眠", "腦科學"], "b": "大腦擁有自己的“安眠藥”，一到晚上就會自行放出，我們也能就好好入睡。\n\n這種“安眠藥”，就是大腦松果體分泌的褪黑激素。分泌褪黑激素的條件是太陽下山——“天黑了”。\n\n晚上失眠的人，正是因為缺少褪黑激素造成的。而褪黑激素的原料，就是血清素。\n\n患有抑鬱症或者因為生活壓力大的人，大都會失眠，其部分原因是血清素不足。\n\n換句話說，就是因為白天沒有製造足夠的血清素，而晚上就沒有足夠的褪黑激素，所以才會失眠。\n\n褪黑激素，除了有安眠的作用，還有抗衰老的作用。褪黑激素屬於抗氧化物質，晚上睡覺時候，還會處理白天產生的不良物質“活性氧化素”。\n\n要想增加褪黑激素，享受深度睡眠，最重要的是白天吸收足夠的陽光，再加上韻律運動，以激活血清素能神經。\n\n有人連夜加班，早上入睡，其實這是最壞的睡眠。因為太陽出來後，大腦不分泌褪黑激素。\n\n這種睡眠可以消除身體上的疲勞感，但根本沒有抗衰老的效果。\n\n因此，那些經常上夜班的人、生活不規律的人，就算經常進行臉部護理，大多數皮膚不好。\n\n真正讓人恐怖的是，皮膚不好的背後所隱藏的活性氧化素的存在。\n\n活性氧化素就好比燃燒後產生的煤炭。沒有褪黑激素的睡眠，就像人體內的煤灰沒有辦法清除，一直堆積著。\n\n我們的身體裡如果堆積了活性氧華素，就會引起很多疾病的發生。\n\n日出而作，日落而息。和太陽同步的規律生活，才是人類最優的作息週期。", "c": "睡眠健康", "k": "大腦晚上會自己放出「天然安眠藥」褪黑激素，但要天黑才會分泌，而它的原料是白天做出來的血清素。所以白天曬太陽、做有節奏的運動，晚上才睡得好。熬夜白天睡的話就沒有褪黑激素，皮膚也會變差。", "m": ["深度睡眠", [["褪黑激素", ["大腦安眠藥", "天黑才分泌"]], ["原料", ["血清素", "白天製造"]], ["抗衰老", ["抗氧化", "清除活性氧"]], ["白天做法", ["曬太陽", "韻律運動"]], ["夜班族", ["無褪黑激素", "皮膚差"]]]], "f": [["白天曬太陽", "+韻律運動"], ["製造血清素", "心情穩定"], ["天黑", "轉成褪黑激素"], ["深度睡眠", "清除活性氧"], ["抗衰老", "皮膚好"]], "p": [{"no": "014", "n": "健康接地枕頭套", "pr": "NT$599", "nd": ["睡眠", "恢復"], "w": "健康接地枕頭套定位睡眠與恢復節點，營造深度睡眠環境。"}, {"no": "054", "n": "GABA（膠囊）", "pr": "NT$540", "nd": ["睡眠", "情緒", "放鬆"], "w": "GABA 支持放鬆入睡。"}, {"no": "050", "n": "銀杏複方（銀杏＋巴西蘑菇＋色氨酸＋防風＋玉米黃質）", "pr": "NT$510", "nd": ["腦循環", "眼睛", "睡眠", "神經"], "w": "銀杏複方含色氨酸，色氨酸是血清素與褪黑激素的原料。"}], "a": [{"no": 77, "n": "節律營養系統", "u": "https://membership-app-e2147.web.app/lifeos/rhythm-nutrients.html", "cat": "醫學生／醫學健康 / 健康", "w": "節律營養系統對應「日出而作、日落而息」的作息安排。"}, {"no": 69, "n": "身體訊號系統", "u": "https://membership-app-e2147.web.app/lifeos/body-signals.html", "cat": "醫學生／醫學健康 / 健康", "w": "身體訊號系統讀懂失眠與皮膚變差的訊號。"}]}, {"id": 69, "t": "給自己一次機會！這本書講的太長思維了！！", "d": "2025/11/30", "g": ["邊讀邊悟", "認知提升", "認知覺醒的人", "改變思維方式", "必讀書籍", "突破思維侷限", "自我成長"], "b": "生命在於行動，行動才是人生。\n\n不要擱置壓在心頭已久的想法，開始行動，在生活中實現想法，是一生中的重要經歷。\n\n時間＝當下即所有\n\n時間是一切資源之母。\n\n珍惜時間，你的生活就會符合你的價值觀。\n\n當下就以生活中最重要的事情為中心，而不是擱置你的夢想、親人和雄心，等待將來有時間再去實現、去陪伴，因為這一天我們難以把握，可能遙遙無期，甚至永遠都不會到來。\n\n接受世事無常，壞事有可能會降臨到好人頭上，但是你仍然可以鼓起勇氣，懷著一顆感恩的心，繼續前行。奮勇不易（甚至有點可怕），但堅持很酷。\n\n勇氣能幫助我們每一個人呈現自己內心最美好的一面。勇敢一點，給自己一次機會，哪怕有時候沒有那麼容易。\n\n對“我能”來說，日落代表了“我”生命中來來往往的事。\n\n結束即開始。當你在日落時重啟自己的人生，不幸就變成了萌芽中的勝利，壓力醞釀著即將到來的成功，誤解也變得有意義起來，因為它使得我們有機會重新建立信任。\n\n你從未來想成為的人（日落）開始努力，為自己創造機會贏得今天（日出）。\n\n全天午休的網路將私人時間和工作時間攪合在了一起，因此靈活、彈性的工作將越來越常態化，以實現更大的自由、平衡和自主性。人們希望在工作中，既能賺到錢，又能體現自己的價值，還能自主選擇辦公地點，或者完全實現地點自由。\n\n無論將來發生什麼，今天的機遇在幾年前並不存在。你的未來亦是如此。因此，我們必須抓緊機遇，創造能創造的，享受能享受的，並積極適應變化。\n\n工作可以保障個人生活，但個人生活無須為工作讓路。\n\n選擇任何一件你一直想做卻沒做的事情，並且問問自己為什麼遲遲沒有付諸行動。\n\n工作基本相同的兩個人是怎樣過上不同的個人生活的呢？這是因為他們的主觀選擇不同，主要體現在以下三個方面：①優先事項——分清注意力的主次才是取得成效的關鍵，而不是靠時間管理。②實踐——從分心轉向行動。③收入——不要把夢想變成工作。夢想的工作是讓你獲得自由。", "c": "自我成長", "k": "生命在於行動，不要把放在心裡很久的想法一直擱著。時間是最重要的資源，現在就以最重要的事情為中心，不要等「以後有時間」再陪家人或追夢，因為那一天可能不會來。要有勇氣給自己一次機會，結束就是新的開始。", "m": ["給自己一次機會", [["行動", ["生命在於行動", "實現想法"]], ["時間", ["當下即所有", "資源之母"]], ["當下重要事", ["夢想", "親人", "雄心"]], ["勇氣", ["接受無常", "懷感恩前行"]], ["日落日出", ["結束即開始", "從未來的自己出發"]]]], "f": [["心中想法", "擱置已久"], ["確認價值觀", "什麼最重要"], ["鼓起勇氣", "給自己機會"], ["今天行動", "不等將來"], ["結束即開始", "重啟人生"]], "p": [{"no": "098", "n": "粒線寶（膠囊）", "pr": "NT$550", "nd": ["粒線體", "能量", "恢復"], "w": "粒線寶支持能量，把擱置已久的想法付諸行動。"}, {"no": "042", "n": "清思油滴35ml（迷迭香精油＋EPA魚油）", "pr": "NT$450", "nd": ["腦神經", "專注", "情緒"], "w": "清思油滴支持專注，分清注意力的優先事項。"}], "a": [{"no": 113, "n": "秩序系統", "u": "https://valaivai087-ops.github.io/order/", "cat": "模型／系統／決策 / 秩序", "w": "秩序系統以最重要的事為中心安排時間。"}, {"no": 110, "n": "改寫人生系統", "u": "https://valaivai087-ops.github.io/rewritelife/", "cat": "模型／系統／決策 / 人生", "w": "改寫人生系統協助「結束即開始」重啟人生。"}]}, {"id": 70, "t": "永遠不要停止學習和大量閱讀，找到專長！！", "d": "2025/11/28", "g": ["學習的力量", "做自己擅長的事", "專注", "持續學習與成長", "讀書重要性", "永遠保持學習能力"], "b": "把自己產品化：“自己”具有獨特性，“產品化”是發揮槓桿效應；“自己”具有　責任感，“產品化”需要專長。“自己”其實也具有專長。\n\n如果想要實現致富的長期目標，你應該問問自己：“這是我真正想要的東西嗎？我的規劃目標是我真正想要的嗎？”得到肯定的答案後，再問問自己：“我實現產品化了嗎？我實現規模化了嗎？我選擇規模化的方式是勞動力、資本，還是程式碼或媒體？”由此可見，“把自己產品化”這個闡述方便簡單，便於記憶。\n\n“把自己產品化”很難。所以“我”才說“把自己產品化”要花幾十年——並不是要花幾十年執行，而是要把大部分時間用於思考：我能提供什麼獨特的價值？\n\n財富和金錢區別是什麼？金錢是我們轉移財富的方式。金錢是社會的信用符號，具有呼叫別人時間的能力。\n\n如果我做好了本質工作，為社會創造了價值，社會就會對我說：“謝謝你，因為你在過去所作的工作，我們在未來欠你一些東西。這個東西就是一張欠條，我們可以把這個叫作錢。”\n\n你真正想要的其實是財富。財富就是在你睡覺時也可以幫助你賺錢的資產。財富是可以進行生產力的工廠和機器人。財富是部分晝夜為客戶的計算程式。財富也可以是銀行裡被投資與其他資產後業務的錢。\n\n甚至房子也可以成為一種財富，因為房子可以出租，帶來租金收益。\n\n要想在社會上賺到錢，就要為社會提供其有需求但無從獲得的東西。如果社會已經創造出需要的產品和服務，你也就不被需要了。\n\n社會總是需要新鮮事物。如果想要變得富有，你就要弄清楚你能為社會提供哪些其有需求但無從獲得的東西，而提供這些東西對你來說又是輕鬆自然的事情，在你的技術和能力範圍內。\n\n下一步思考如何規模化，因為只提供一個產品或一項服務是遠遠不夠的，必須提供成千上萬個，甚至幾十萬、幾百萬、幾十億個，最好人手一個。\n找到天賦所在，積累專長。專長是一個人個性和身份的有機組成部分。一旦找到自己天生喜歡和擅長的領域，你就可以朝著這個方向持續前進。\n致富最重要的技能是成為終身學習者，無論想學什麼，你都得找到途徑和方法。\n\n樣樣都通，樣樣稀鬆，無法實現人生目標。一個人只能在一兩件事上做到精通，而這一兩件事通常是讓你痴迷的事情。", "c": "財富思維", "k": "「把自己產品化」：找到只有你才有的特別能力，再用工具讓很多人都能用到。金錢像是社會給你的「欠條」，謝謝你過去的貢獻；財富則是睡覺時也會賺錢的東西，像程式、出租的房子。致富最重要的技能是一輩子都在學習，專心精通一兩件你最痴迷的事。", "m": ["把自己產品化", [["產品化", ["自己=獨特", "產品化=槓桿"]], ["金錢", ["社會的欠條", "呼叫別人時間"]], ["財富", ["睡覺也賺錢", "程式、工廠、房租"]], ["方法", ["提供需要但沒有的", "規模化"]], ["終身學習", ["精通一兩件", "痴迷的事"]]]], "f": [["找天賦", "痴迷又擅長"], ["終身學習", "累積專長"], ["思考獨特價值", "社會需要什麼"], ["產品化", "做成產品服務"], ["規模化", "人手一個"]], "p": [{"no": "001", "n": "防藍光護目鏡", "pr": "NT$200", "nd": ["眼睛", "光傷害", "視覺疲勞"], "w": "大量閱讀與螢幕學習時保護眼睛，支持終身學習。"}, {"no": "042", "n": "清思油滴35ml（迷迭香精油＋EPA魚油）", "pr": "NT$450", "nd": ["腦神經", "專注", "情緒"], "w": "清思油滴支持專注與思考：「我能提供什麼獨特價值？」"}, {"no": "067", "n": "防藍光老花眼鏡", "pr": "NT$39", "nd": ["眼睛", "閱讀", "視覺"], "w": "防藍光老花眼鏡讓長輩也能舒適地持續閱讀學習。"}], "a": [{"no": 120, "n": "複利模型 APP", "u": "https://membership-app-e2147.web.app/lifeos/compound-model-app.html", "cat": "模型／系統／決策 / 模型", "w": "複利模型 APP 看懂專長與學習的複利。"}, {"no": 100, "n": "AI 時代能力系統", "u": "https://membership-app-e2147.web.app/lifeos/ai-era-capabilities.html", "cat": "能力養成／自律行動 / AI", "w": "AI 時代能力系統找到可產品化、規模化的方式。"}]}, {"id": 71, "t": "這本書講的太通透了！讀完它我充滿了能量！", "d": "2025/11/27", "g": ["讀書與思考", "思想的力量", "幸福", "自我成長"], "b": "人類具有高度主觀意識和繁殖機器，會一刻不停地對周圍的一切做出評判。我們不斷地接收和判斷周圍的資訊，想著“我需要這個”或者“需要那個”，深陷慾望之網，難以自拔。而幸福就是一種毫無遺憾的充盈的狀態。當感到生命中並不缺少什麼時，大腦就會處於休眠狀態，不再追憶昨天，也不再暢想明天，也不會悔不當初，也不會謀求未來。\n\n歸根到底，萬物皆有二元性和極性。\n如果我說一個人有魅力，意思就是別人沒有魅力。每一個積極想法都有一個消極想法的種子蘊含其中，反之亦然，這就是為什麼生命的偉大在很大程度上源於苦難。人必須先看到消極的一面，才能去憧憬和欣賞積極的一面。\n\n幸福是一種無慾無求的狀態，特別是對外界事物的慾望。慾望越少，越能接受事物的當前狀態，頭腦越平靜。所謂“萬般煩惱皆因心動”，就是頭腦在一刻不停地設計未來和追憶過去。\n\n如果想獲得內心的平和，你就必須超越對萬事萬物的善惡評判。\n\n世界只是折射個人感受的一面鏡子。現實是中性的，現實不做評判。一棵樹沒有對與錯、好與壞的概念。人生在世，我們從大千世界中獲得各種各樣的感官體驗和刺激，耳得之而為聲，目遇之而成色。至於如何思考、判斷和對待你所感知的一切，全由你自己決定——選擇權在你手上。\n\n如果你把自己看成一個細菌變形蟲，把自己畢生的努力都看成在水上寫字、在沙灘上建城堡，你就不會對生活“本來該有”的模樣抱有期待。生活就是這樣，現實就是如此。接受了這一點，就無所謂幸不幸福。“幸福”並不是一種客觀的存在，而是一種主觀的感受。\n\n人生轉瞬即逝，如黑夜中的螢火蟲。塵世光陰等剎那，白駒過隙一瞬間。活著就是要充分利用每一分鐘。“充分利用”不是說要窮盡所有時間去追逐一些愚蠢的慾望，而是要認識到自己在這個星球上的每一分每一秒都是非常寶貴的。生而為人，就有責任確保自己的幸福，確保用最好的方式詮釋萬事萬物。\n\n我們都認為江山易改，本性難移，但事實是，我們是可塑的，而世界基本上是固定不變的。\n\n真正的幸福只是內心平和的副產品，主要還是源於接受現實，而不是改變外部環境。\n\n年輕的時候有時間、有健康，但沒有錢。到了中年，有錢、有健康、沒有時間。老了以後，有錢、有時間，但沒了健康。人生的大贏家就是同時擁有時間、健康和金錢。", "c": "心靈成長", "k": "大腦一直在評判「好或壞」「我需要這個那個」，所以我們很難快樂。幸福其實是「覺得什麼都不缺」時的平靜。世界本身沒有好壞，像一棵樹沒有對錯，怎麼看全看你自己。慾望越少越平靜。人生大贏家是同時擁有時間、健康和金錢。", "m": ["幸福是內心平和", [["慾望之網", ["不停評判", "我需要⋯"]], ["二元性", ["好壞相生", "苦難成就偉大"]], ["幸福", ["無慾無求", "接受現狀"]], ["現實中性", ["世界是鏡子", "選擇權在你"]], ["人生贏家", ["時間", "健康", "金錢"]]]], "f": [["慾望升起", "我需要⋯"], ["覺察評判", "發現在貼標籤"], ["接受現實", "現實是中性的"], ["內心平和", "不追憶不謀求"], ["幸福副產品", "自然出現"]], "p": [{"no": "028", "n": "心膚精油特價組", "pr": "NT$1200", "nd": ["情緒", "放鬆", "肌膚"], "w": "心膚精油組營造平和空間，讓不停評判的頭腦休息。"}, {"no": "054", "n": "GABA（膠囊）", "pr": "NT$540", "nd": ["睡眠", "情緒", "放鬆"], "w": "GABA 支持放鬆，減少不停追憶與謀求的焦躁。"}, {"no": "071", "n": "王牌粉（12g×30包）", "pr": "NT$2000", "nd": ["正常發炎調節", "抗氧化", "免疫"], "w": "王牌粉照顧身體基礎狀態，健康是人生贏家三要素之一。"}], "a": [{"no": 49, "n": "智慧 APP", "u": "https://membership-app-e2147.web.app/lifeos/wisdom-app.html", "cat": "基督信仰／靈性智慧 / 智慧", "w": "智慧 APP 提供接受現實、內心平和的反思素材。"}, {"no": 50, "n": "靈性 APP 完整版", "u": "https://membership-app-e2147.web.app/lifeos/spiritual-app-complete.html", "cat": "基督信仰／靈性智慧 / 靈性", "w": "靈性 APP 完整版延伸覺察與內在平靜練習。"}]}, {"id": 72, "t": "這本書給了我太多的力量了，強烈共鳴！！！", "d": "2025/11/26", "g": ["你想要活出怎樣的人生", "讀書感悟", "邊讀邊感悟", "讀書與思考", "自我成長"], "b": "選擇自我重塑。最了不起的能力就是改變自我的能力。冥想就是思想意識的間接性禁食。太多糖會導致身體超重，太多幹擾會導致大腦過載。\n\n拿出時間獨處，用來專注地自省、寫日記、冥想，這可以解決那些沒有解決的問題，讓超負荷的精神變得清明疏朗。\n\n醫生不能讓你健康。營養學家不能讓你苗條。老師不能讓你變聰明。禪師不能讓你冷靜。智者不能讓你富有。教練不能讓你健壯。最終，你必須自己負起責任。救贖靠自己。\n\n選擇做自己。你唯一應該做的事，是你自己想做的事。別人總希望你以特定的方式做事，但如果不再費心去揣摩別人的期待，你就能聽到自己腦海中那個微弱的聲音。那個聲音代表了真實的你。傾聽它，你就可以做自己。\n\n做自己，全情投入、義無反顧。\n\n在“做自己”這件事上，沒有人能與你競爭。你永遠不會像我一樣擅長做我自己，我永遠也不會像你一樣擅長做你自己。當然，做人要虛心聆聽，博採眾長，但不要盲目模仿。模仿他人純屬徒勞。相反，每個人都有獨一無二的資質技能、專業知識、能力才幹、個人慾望，這些是世界上其他人沒有的，是先天基因和後天經驗共同作用的結果。\n\n先天基因和後天經驗的組合會造就個體驚人的獨特性。沒有任何兩個個體可以互相替代。\n\n你的人生目標是找到最需要你的人、事業、專案或藝術。大千世界，芸芸眾生，總有一些人和事會與你完美契合。\n\n要做出原創性貢獻，必須是非理性地痴迷。\n\n健康問題是對人生影響最大的問題。\n\n養成習慣的方法和過程並不重要，甚至連做什麼都不重要，重要的是每天堅持。每天堅持才是最重要的，堅持做什麼事次要的。\n\n生活中的所有事情都一樣，如果願意做出短期犧牲，你就會得到長期好處。選擇簡單模式，人生就會越來越困難；選擇困難模式，人生會越來越簡單。\n\n現在選擇困難的健康飲食模式，也就是雖然很想吃垃圾食品，但是忍住吃，同時選擇困難的鍛鍊模式，不怕辛勞。長此以往，你的生活會變得惡越來越容易。你不會輕易生病，不會不健康。價值觀的培養、未雨綢繆的儲蓄、人際關係的處理都是如此。\n\n如果你現在選擇一條容易的路，那麼你的未來會變得更加艱難。\n\n我們大部分的痛苦來自逃避。", "c": "自我成長", "k": "最厲害的能力是「改變自己」。冥想就像讓腦袋「禁食」，太多干擾會讓大腦過載。醫生、老師都不能替你變健康變聰明，要靠自己負責。做自己，沒人能比你更會當你。選困難模式（忍住垃圾食物、運動），人生會越來越簡單。", "m": ["自我重塑", [["改變自我", ["冥想=思想禁食", "獨處自省寫日記"]], ["救贖靠自己", ["醫生老師都替代不了"]], ["做自己", ["傾聽內心微弱聲音", "無人能競爭"]], ["堅持", ["每天做最重要"]], ["困難模式", ["短期犧牲長期好處", "逃避帶來痛苦"]]]], "f": [["獨處", "冥想、寫日記"], ["聽見自己", "真正想做什麼"], ["負起責任", "救贖靠自己"], ["選困難模式", "健康飲食、運動"], ["人生變簡單", "長期受益"]], "p": [{"no": "034", "n": "胺基酸可可粉包", "pr": "NT$780", "nd": ["肌肉", "能量"], "w": "胺基酸可可粉支持肌肉與能量，選擇「困難模式」運動時的營養夥伴。"}, {"no": "023", "n": "行氣精油", "pr": "NT$1200", "nd": ["循環", "放鬆", "情緒"], "w": "行氣精油在冥想、獨處自省時使用，幫助思想「禁食」。"}, {"no": "071", "n": "王牌粉（12g×30包）", "pr": "NT$2000", "nd": ["正常發炎調節", "抗氧化", "免疫"], "w": "王牌粉建立固定補充習慣，「每天堅持」比做什麼更重要。"}], "a": [{"no": 39, "n": "身分 OS 雙語 APP", "u": "https://membership-app-e2147.web.app/platform/life-system/identity-os-bilingual-app.html", "cat": "英文／語言學習 / 生命系統", "w": "身分 OS 雙語 APP 支持自我重塑與做自己。"}, {"no": 37, "n": "自律模型 60 項", "u": "https://membership-app-e2147.web.app/platform/self-discipline-action/self-discipline-model-60-bilingual.html", "cat": "英文／語言學習 / 自律行動", "w": "自律模型 60 項把每天堅持變成系統。"}]}, {"id": 73, "t": "關於複利效應，讀完這本書我恍然大悟了！！", "d": "2025/11/25", "g": ["財富", "每日讀書打卡", "複利效應", "財富思維"], "b": "個人名譽方面存在複利效應。如果一個人聲譽良好，數十年如一日，不斷打造和積累自己的聲譽，這個人就一定會得到關注和重視。而如果一個人才華橫溢，卻沒有利用聲譽的複利效應，相比之下，注重聲譽的人的價值就會高出其成千上萬倍。\n\n出發點並不重要，行為本身才重要。因此，遵守道德標準並非易事。\n\n一旦找到正確的事業和一同前行的人，就要全身心投入。接下來，持續精進幾十年，就能從人際關係和經濟利益上獲得巨大的回報。因此，複利效應非常重要。\n\n９９％的努力終將白費。\n\n沒有一種努力是完全白費的，因為我們總能在努力的過程中學到一些東西。任何經歷都是可以成為學習的機會。舉例來說，回顧求學生涯，當時寫的論文、讀的書、做的練習，９９％不適用於現實社會。學到的一些地理和歷史知識體系你從未派上用場，學的一門外語你早已不再使用，一些數學知識你也早已全然忘記。\n\n當然，學校的學習經歷的確教會我們一些東西。比如，你理解努力的重要性，一些理念也潛移默化地成為你的精神動力，或者在一定程度上促使你從事當前的職業，等等。然而，至少從以目標為導向的現實社會的角度看，你在學校裡付出的努力只有１％得到了回報。\n\n你應該經過深思熟慮後，清醒地認識到自己需要從大多數事情（人際關係、工作、學習）中找到可以盡全力去付出的那部分，以充分獲得複利效應。\n\n在約會過程中，如果意識到兩個人不會走入婚姻殿堂，那麼你也許應當儘早結束這段關係，開始下一段旅程。當學習的時候，比如學習地理或歷史，如果意識到學到的知識你永遠也不會用，那就放棄這門課。把精力用在無用的東西上時浪費時間，浪費腦力。\n\n努力找到不會被浪費的１％。這對你是有意義的，值得你用餘生去追去。一旦找到，你就要心無旁騖，全力以赴。\n\n獲得財富需要槓桿。槓桿可以來自勞動力、資本、程式碼或媒體。\n\n從本質上看，上班就是給人打工。\n\n通常情況下，真正的財富是透過建立公司或者透過投資創造出來的。", "c": "財富思維", "k": "好名聲會像利滾利一樣越來越值錢。找到對的事業和夥伴，就專心投入幾十年，會得到超大回報。但大部分努力（99%）都用不上，所以要找出那1%值得全力以赴的事，其他不適合的就早點放手。財富需要槓桿：人力、資本、程式、媒體。", "m": ["複利效應", [["聲譽複利", ["數十年如一日", "價值成千倍"]], ["全身心投入", ["對的事業", "對的人"]], ["99%白費", ["學校知識多數用不上"]], ["找1%", ["盡全力付出", "早點放手不適合的"]], ["槓桿", ["勞動", "資本", "程式碼", "媒體"]]]], "f": [["嘗試很多", "大量探索"], ["辨識1%", "值得全力的事"], ["放手其餘", "停止浪費"], ["長期投入", "數十年精進"], ["複利回報", "財富、人際、聲譽"]], "p": [{"no": "042", "n": "清思油滴35ml（迷迭香精油＋EPA魚油）", "pr": "NT$450", "nd": ["腦神經", "專注", "情緒"], "w": "清思油滴支持專注與判斷，找出值得全力投入的 1%。"}, {"no": "098", "n": "粒線寶（膠囊）", "pr": "NT$550", "nd": ["粒線體", "能量", "恢復"], "w": "粒線寶支持長期投入所需的能量。"}], "a": [{"no": 120, "n": "複利模型 APP", "u": "https://membership-app-e2147.web.app/lifeos/compound-model-app.html", "cat": "模型／系統／決策 / 模型", "w": "複利模型 APP 看懂聲譽、人際與財富的複利。"}, {"no": 122, "n": "複合模型 OS", "u": "https://membership-app-e2147.web.app/platform/model-decision/compound-model-os.html", "cat": "模型／系統／決策 / 模型決策", "w": "複合模型 OS 用模型找出值得全力以赴的事。"}]}, {"id": 74, "t": "聰明的人都這麼做，這本書重塑了我的認知！", "d": "2025/11/24", "g": ["堅持讀書打卡", "每日讀書打卡", "自我成長", "成長"], "b": "真正聰明的人，從不走捷徑。\n如果想賺儘可能多的錢，如果以一種可預測的方式致富，就要時刻走在時代的最前沿，學習科技、學習設計、學習藝術，成為行業翹楚。\n\n把時間花在省錢上是不會致富的。省出時間來賺錢才是正確的思路。\n\n努力的作用被大大高估了。在現代經濟中，工作的努力程度並沒有那麼重要。\n\n那麼什麼被低估了呢？判斷力被低估了。\n\n智慧的定義是“知道個人行為的長期後果”，用於解決外部問題的智慧其實就是判斷力。或者說，智慧和判斷力是高度關聯的：一個智慧而富有判斷力的人，首先知道個人行為的長期後果，然後做出正確的決策並付諸行動。\n\n在槓桿時代，一個正確的決策可以幫你贏得一切。\n\n不出努力，就無法培養判斷力，也不會獲得任何槓桿。\n\n時間的投入是必需的，但判斷力更重要。在前進的過程中，方向比速度更重要，特別是運用了槓桿以後。在每個岔路口選對方向，其重要程度遠遠超過前進的努力程度。人生就是選擇正確的方向，然後朝這個方向奮力前進。\n\n真正聰明的人是思路清晰的思考者。\n\n要直面現實，就要放下自我，消除自我意識，忘記自我判斷，平復自我情緒。人雖然是高階動物，但情緒化的自我意識的存在會帶來反芻式子思維，讓一些慾望矇蔽我們的雙眼，讓我們看不清現實，從而讓我們對“世界應該怎樣”往下判斷。\n\n阻礙我們看清現實的最大因素就是我們對現實“應有的樣子”有先入為主的印象。\n\n痛苦時刻的一個定義是：當你看到事物真面目不是你本來想要的樣子時，你是痛苦的。\n\n但痛苦的時刻就是真相大白的時刻。只有處於痛苦之中，你才會被迫接受現實，而只有接受現實，你才能做出有意義的改變，取得有意義的進步。\n由此可見，只有實事求是，才能不斷改進，不斷前行。難點在於看清真相。要看清真相，就必須擺脫自我，因為自我不想面對真相。自我越弱小，對自己反應的限制越少，對自己想要的結果的執念越低，就越容易看清現實。\n\n對美好現實的渴求矇蔽了對真實世界的認知。所謂痛苦，就是無法繼續無視事實。", "c": "財富思維", "k": "聰明人不走捷徑。省錢不會致富，要省時間去賺錢。努力被高估，「判斷力」被低估：知道一件事長期會帶來什麼結果。方向比速度重要。要看清現實，就要放下自我和情緒，痛苦的時候其實就是看見真相、開始改變的時候。", "m": ["判斷力", [["不走捷徑", ["學科技設計藝術", "走在前沿"]], ["時間>省錢", ["省時間賺錢"]], ["判斷力", ["知道長期後果", "方向>速度"]], ["看清現實", ["放下自我", "放下應有的樣子"]], ["痛苦", ["真相大白時刻", "帶來改變"]]]], "f": [["遇到選擇", "岔路口"], ["放下自我", "不帶情緒判斷"], ["想長期後果", "智慧判斷"], ["選對方向", "再全力前進"], ["槓桿放大", "一個決策贏一切"]], "p": [{"no": "042", "n": "清思油滴35ml（迷迭香精油＋EPA魚油）", "pr": "NT$450", "nd": ["腦神經", "專注", "情緒"], "w": "清思油滴支持專注與清晰思考，提升判斷力。"}, {"no": "054", "n": "GABA（膠囊）", "pr": "NT$540", "nd": ["睡眠", "情緒", "放鬆"], "w": "GABA 支持放鬆，放下情緒才看得清現實。"}], "a": [{"no": 118, "n": "預測系統", "u": "https://membership-app-e2147.web.app/lifeos/prediction-system.html", "cat": "模型／系統／決策 / 預測", "w": "預測系統建立判斷長期後果的框架。"}, {"no": 124, "n": "生命 OS 決策樹", "u": "https://membership-app-e2147.web.app/platform/model-decision/life-os-decision-tree.html", "cat": "模型／系統／決策 / 模型決策", "w": "生命 OS 決策樹在岔路口幫你選對方向。"}]}, {"id": 75, "t": "低谷期必讀書籍！求求大家一定要讀這本書！", "d": "2025/11/23", "g": ["學習筆記", "自我成長", "低谷期", "必讀書籍"], "b": "①\t“付出不亞於任何人的努力。”全身心投入工作，精益求精，從中獲得樂趣，就能抑制怠惰之心。同時，聚精會神，專注於工作，私心雜念自然就會消退。這是最有效的修行。\n\n②\t“要謙虛，不要驕傲。”努力工作獲得了成就，特別是掌握權力以後，人就會傲慢起來，這簡直是歷史規律，連偉人也很難免俗。因此，抑制傲慢心、保持謙虛就是一項很重要的修行。\n\n③\t“要每天反省。”即使很勤奮，但人有時還是會偷懶；即使告誡自己要謙虛，但因為有小人奉承，人還是禁不住傲慢，有時還會發脾氣。堅持每天反省，就不會讓自己變得更壞。這條修行必不可缺。\n\n④\t“活著，就要感謝。”人若要認真反省，意識到自己的成就和進步得益於周圍人的支援於幫助，就會生出感謝之心。另外，如果把挫折和災難看成磨鍊心志、增益能耐的機會，因而由衷地說一聲“謝謝”並更加努力的話，就是非常卓越的修行。\n\n⑤\t“積善行，思利他。”這項修行中要注意的是，“大善似無情，小善是大惡”。分清大善和小善，真正為他人好，真正利他，才是有效的修行。\n\n⑥\t“不要有感性的煩惱。”實踐上述五項，煩惱就會大大減少。但人畢竟是煩惱的動物，特別是遭遇失敗、打擊和委屈時，難免痛苦煩惱。這時候，以理性抑制煩惱，把精力投向新的工作，就是很好的修行。\n\n誠實地回顧過去，用以指導現在每一天的行動。人需要時時捫心自問。\n\n人應該如何活？人應該持有怎樣的心態？這兩個問題意義相同。在心中描繪什麼，決定了將會度過怎樣的人生。\n\n擁有純潔美好的心靈，就能開拓與之相應的豐富、精彩的人生。\n\n相反，只要自己好就行，心胸狹隘，甚至為了自己得利，不惜踹落別人，持有這類私心的人，他們哪怕獲得了一時的成功，最終必將沒落。\n\n不管怎麼努力，不管多麼辛苦，人生卻總無轉機。如果有人如此感嘆，那麼，他首先應該將目光轉向自己的內心，叩問自己是否擁有一顆正直的心。", "c": "心靈成長", "k": "稻盛和夫的「六項精進」：1.付出不輸任何人的努力；2.謙虛不驕傲；3.每天反省；4.活著就要感謝；5.多做善事、為別人著想；6.不要有感性的煩惱，用理性把心思放到新的工作上。心裡想什麼，就會過什麼樣的人生。", "m": ["六項精進", [["1努力", ["不亞於任何人", "專注抑制私心"]], ["2謙虛", ["不驕傲"]], ["3反省", ["每天檢視"]], ["4感謝", ["活著就要感謝", "挫折也感謝"]], ["5利他", ["積善行", "大善似無情"]], ["6理性", ["不要感性煩惱"]]]], "f": [["每天努力", "全心投入工作"], ["保持謙虛", "抑制傲慢"], ["睡前反省", "檢視言行"], ["感謝與利他", "為他人著想"], ["放下煩惱", "投入新工作"]], "p": [{"no": "071", "n": "王牌粉（12g×30包）", "pr": "NT$2000", "nd": ["正常發炎調節", "抗氧化", "免疫"], "w": "王牌粉照顧身體狀態，支撐「付出不亞於任何人的努力」。"}, {"no": "028", "n": "心膚精油特價組", "pr": "NT$1200", "nd": ["情緒", "放鬆", "肌膚"], "w": "心膚精油組陪你每天反省、心存感謝。"}, {"no": "054", "n": "GABA（膠囊）", "pr": "NT$540", "nd": ["睡眠", "情緒", "放鬆"], "w": "GABA 支持放鬆，以理性放下感性的煩惱。"}], "a": [{"no": 49, "n": "智慧 APP", "u": "https://membership-app-e2147.web.app/lifeos/wisdom-app.html", "cat": "基督信仰／靈性智慧 / 智慧", "w": "智慧 APP 提供每天反省與感謝的素材。"}, {"no": 58, "n": "信念身分系統", "u": "https://membership-app-e2147.web.app/lifeos/belief-identity.html", "cat": "情緒心理／信念療癒 / 信念", "w": "信念身分系統幫你打造純潔美好的心靈。"}]}, {"id": 76, "t": "所有人都去讀這本書。講的太透徹了！", "d": "2025/11/22", "g": ["讀書", "健康養生", "免疫系統", "健康知識"], "b": "自身免疫疾病一直是醫學謎題。腸漏症可能為多數自身免疫疾病提供一個統一機制。\n\n這個機制如下：腸漏症發生之前，免疫系統的職責非常清晰。先天免疫系統是人體的第一道防線，它就像一隻守門犬，對任何直接威脅迅速做出反應，但準確率並不總是１００％。先天免疫系統會幫助人體從腳腂扭傷等急性傷害和一般感冒等急性感染中恢復。\n\n後天免疫系統的功能更像偵探犬或警犬，它會根據以前的接觸記住一種“氣味”（或者在這種情況下是記住一種病原體），下次遇到時會迅速識別出這種“氣味”（或病原體）。這個免疫系統會“記住”它，下次接觸時就會迅速將其識別出來並有效處理。\n\n後天免疫系統可以透過免疫接種的方式激活。現代社會中，談到免疫，我們會立即想到流感疫苗等疫苗，我們把這些疫苗當作免疫的唯一方式。但是天然免疫存在的時間更長，要從我們發展出後天免疫系統開始計算。例如，接觸當地花粉帶來的有益微生物時，後天免疫系統會“記住”這些微生物，下次接觸時就會迅速識別出來。這就是為何透過當地蜂蜜接觸微量花粉或在附近自然環境中散步可以幫助免疫系統記住特定的花粉，以便到過敏季節時免疫系統不會過敏反應。\n\n以同樣的方式，病原體透過腸道黏膜上的緊密連線進入人體後，後天免疫系統會製造抗體來中和病原體，建立起對壞微生物的“記憶”，保證下次遇見同樣的病原體時會迅速做出反應。\n\n同時，作為腸道黏膜一部分的腸道相關淋巴組織也會保護你。你的腸道相關淋巴組織佔免疫系統的７０％，每天都會篩選腸道中所有過客，判斷敵友。這些系統相互合作，保護人體免受病痛折磨。\n\n但是，當腸道變得具有滲透性後，事情就難以預料了。有害抗原一旦拿連蛋白這把鑰匙開啟腸道上的緊密連線，就會透過腸道黏膜進入血液迴圈。反覆接觸連蛋白會使這道大門一直敞開，越來越多的毒素、難以控制的分子很快就會開始從這裡透過，包括病毒、原蟲、酵母菌、麩質和其他令人煩惱的食物，都會進入人體肆虐，造成嚴重傷害。\n\n由於大規模危險細菌入侵，後天和先天免疫系統就會進入過載狀態，努力保持人體安全。免疫系統保持在“開啟”狀態，胡亂用抗體攻擊它遇到的所有東西，包括自身的組織。", "c": "免疫腸道", "k": "腸漏可能是很多自體免疫疾病的共同原因。免疫系統有「看門狗」和「警犬」兩種，70%的免疫部隊在腸道。當腸壁的門被連蛋白打開，病毒、麩質、壞東西都跑進血液，免疫系統忙不過來就開始亂打，連自己的身體都攻擊。", "m": ["自體免疫統一機制", [["先天免疫", ["守門犬"]], ["後天免疫", ["警犬", "可透過接觸建立記憶"]], ["自然免疫", ["在地蜂蜜", "自然散步"]], ["腸道淋巴", ["70%免疫"]], ["腸漏", ["連蛋白開門", "免疫過載", "攻擊自身"]]]], "f": [["腸道屏障完整", "免疫正常"], ["連蛋白開門", "腸漏"], ["抗原入血", "病毒麩質"], ["免疫過載", "持續開啟"], ["自體免疫", "攻擊自身組織"]], "p": [{"no": "081", "n": "5R腸胃營養素（6g×30包）", "pr": "NT$750", "nd": ["腸道", "腸黏膜", "消化", "修復"], "w": "5R 腸胃營養素支持腸黏膜修復，守住免疫防線的大門。"}, {"no": "062", "n": "酶菌醣體（益生菌＋Beta多醣體＋波羅酵素＋茶胺酸）", "pr": "NT$720", "nd": ["免疫", "腸道", "菌相", "修復"], "w": "酶菌醣體支持免疫、腸道與菌相節點。"}, {"no": "092", "n": "D3（5000IU）（錠）", "pr": "NT$580", "nd": ["免疫", "骨骼", "鈣代謝"], "w": "D3（5000IU）支持免疫平衡。"}], "a": [{"no": 88, "n": "整合醫學 OS 版本", "u": "https://membership-app-e2147.web.app/platform/health-medicine/integrated-medicine-os-variant.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "整合醫學 OS 理解腸漏作為自體免疫的統一機制。"}, {"no": 93, "n": "淋巴完整系統", "u": "https://membership-app-e2147.web.app/platform/health-medicine/lymphatic-complete-system.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "淋巴完整系統延伸了解腸道淋巴與免疫。"}]}, {"id": 77, "t": "這本書很長本事，狠狠的去閱讀！！強烈推薦", "d": "2025/11/20", "g": ["筆記", "讀書打卡", "成長", "自我成長"], "b": "可能有不少人和“我”一樣，感覺“外面人”和“家裡人”對自己的看法不太一樣。那到底哪個才是真實的自己呢？\n\n在外面的“我”，其實不夠真實，也不夠全面。出門在外與人交往，常帶目的，不是別人有目的，就是自己有目的，只要任何一方有目的，彼此的交往就會失真。就算雙方都沒有目的，單純交往，但畢竟人生交集淺，彼此承擔不深，因此顯露出的自己必不全面。\n\n原來自己一直認同的只是葛不全面的“假我”，家人眼中的“真我”，自己卻看不見，也不承認。\n\n自己有時與人相交，深感心領神會，頗有知音難得的感受，是不是其實只是對方認同“我”而已？有些人“我”講話他聽不懂，讓我覺得他不瞭解“我”，其實也只是他不認同“我”而已？把認同誤當了解，把不認同視為誤解，因而不斷錯誤看清自己的機會，越活越虛假，誤了自己的人生。\n\n發現周邊不少人和“我”有類似的毛病，似乎這是一種時代流行病，而且越來越嚴重，嚴重到多數人都樂於淺交、怯於近交，活出一種“遠交近攻”的生命狀態，到最後乾脆只在網上和陌生人交往，不和坐在對面的人說話。這樣下去，總有一天，真假人生糾結交纏，沒人找得到真正的自己了。\n\n很多經典上所說的“妄想”，並非在說想法是錯的，而是指出“想”是沒有用的。“我”看到自己絕大多數的想法都不一定對；即使有小部分是對的，也不一定有用；即使對“我”有用，也不一定對別人有用；即使這次有用，下次也不一定有用，而這些幾乎無用的想法，自己居然如此執著，還把它們和自己的情緒、尊嚴、價值綁在一起，因此造了這麼多不必要的“業”，真正荒謬至極、可笑至極。\n\n現在的“我”，明白了“想”之無用、“想”之為禍，但仍然不可能不想，甚至仍難免執著於想。但若能有事後之明，看到“禍由想出”，已屬萬幸；偶爾在妄想升起時，當下覺知，隨即放下。", "c": "心靈成長", "k": "在外面的我常常不真實，因為大家交往都有目的；家人看到的我反而比較真。我們常把「別人認同我」當成「別人了解我」。而且大部分想法不一定對、也不一定有用，我們卻很執著。妄想升起時，能馬上察覺並放下，就很好了。", "m": ["真我與妄想", [["外面的我", ["交往有目的", "不夠全面"]], ["家裡的我", ["真我", "自己看不見"]], ["認同≠了解", ["誤把認同當知音"]], ["時代病", ["樂於淺交", "怯於近交"]], ["妄想", ["想多半無用", "覺知即放下"]]]], "f": [["念頭升起", "執著某個想法"], ["覺察", "這想法真的有用嗎？"], ["不綁情緒尊嚴", "鬆開執著"], ["放下", "回到當下"], ["看見真我", "活得更真實"]], "p": [{"no": "023", "n": "行氣精油", "pr": "NT$1200", "nd": ["循環", "放鬆", "情緒"], "w": "行氣精油在妄想升起時深呼吸，幫助覺知與放下。"}, {"no": "054", "n": "GABA（膠囊）", "pr": "NT$540", "nd": ["睡眠", "情緒", "放鬆"], "w": "GABA 支持放鬆，鬆開把想法和情緒、尊嚴綁在一起的緊繃。"}], "a": [{"no": 98, "n": "關係 OS", "u": "https://membership-app-e2147.web.app/lifeos/relationship-os.html", "cat": "關係／婚姻／溝通 / 關係", "w": "關係 OS 幫你分辨「認同」與「了解」，練習近交。"}, {"no": 61, "n": "人性系統", "u": "https://membership-app-e2147.web.app/lifeos/human-nature-system.html", "cat": "情緒心理／信念療癒 / 心理", "w": "人性系統理解真我與假我。"}]}, {"id": 78, "t": "這本書寫的太讓人受益了，所有女孩快去讀！", "d": "2025/11/19", "g": ["每日讀書打卡", "閱讀筆記", "自我成長", "每日一讀"], "b": "要能放下被人不捨得的，提起別人不敢提的，才算有作為的人。\n\n“提起”和“放下”是人生兩門大功課，一輩子都做不完，而且這兩門功課，說到底，其實是一件事。因為你只能放下你曾經提起的、你已經完成的，否則只能叫做“放棄”，而不是“放下”。並且往往沒有前面的放下，就不可能有後面的提起。而一旦提起，就不能放棄，否則只能稱為“衝動”，不算真正提起。\n\n有時候，甚至事到臨頭，“我”還說它不重要，說我不稀罕，與我無關，還沒開始就放棄了，卻合理化自己是個超脫的人。\n\n人真正能放下的事，是曾經全然的經歷，吃過苦、碰過難，甚至走投無路，卻仍然一次次地堅持，決不放棄，最後終於苦盡甘來、享受成果、備受肯定的事。這樣事，你能瀟灑退場，才叫作放下。\n\n什麼狀況讓人決定放下呢？“我”的指標只有兩個：其一，發現自己易筋經活在舒適圈裡，不再成長；其二，“我”的貢獻已經有人可以取代，不再非“我”不可。\n\n多數人不願意面對自己人生的大麻煩，怕找麻煩，以為你不去找麻煩，它就不會自己來，或者雖然來了，只要視而不見、逃之夭夭，就沒事了。\n\n人生當然不是如此。你在深水區遇到了風浪，逃回淺水區，以為可以安身立命，結果淺水區開始退潮，仍然藏不了身。\n\n其實身外的人和事，都無所謂麻煩，麻煩的是自己的念頭。當事情發生，負面情緒由內而生，頭腦立刻給它貼上“麻煩”的標籤，開始啟動麻煩處置反應模式，結果當然是越麻木越煩躁。麻煩一再重演，正是無意識和逃避的結果，人生就在不間斷的麻煩中停滯、虛耗和錯過。\n\n麻煩其實是人生的重要線索，它的發生，只不過是告訴你，你還有事過不去，你還有人生的功課沒修完。順著麻煩的蹤跡，溯源而上，常有意想不到的發現。若能在源頭處找到麻煩的惡根由並化解之，往往一大片麻煩從此就消逝無蹤。\n\n在人生修煉的惡道路上，有時就得“哪壺不開提哪壺”，而麻煩就是“不開的那一壺”，先得提起，才能放下。", "c": "自我成長", "k": "「提起」和「放下」是人生兩門大功課。只有認真做過、吃過苦、完成了的事，才能真正「放下」；沒做就說不要，那叫「放棄」。什麼時候放下？當你已經沒在成長，或別人可以取代你時。麻煩其實是線索，告訴你還有功課沒修完，要勇敢面對它。", "m": ["提起與放下", [["提起", ["敢提別人不敢提", "提起不放棄"]], ["放下", ["完成過的才能放", "≠放棄"]], ["放下時機", ["不再成長", "可被取代"]], ["逃避麻煩", ["淺水區也會退潮"]], ["麻煩", ["人生線索", "未修完的功課"]]]], "f": [["遇到麻煩", "不逃避"], ["追溯源頭", "哪個功課沒修完"], ["提起", "全然投入"], ["完成", "苦盡甘來"], ["放下", "瀟灑退場、再提起"]], "p": [{"no": "047", "n": "刺五加（膠囊）", "pr": "NT$495", "nd": ["壓力", "體力", "適應力"], "w": "刺五加支持壓力適應，「提起」麻煩時更有韌性。"}, {"no": "028", "n": "心膚精油特價組", "pr": "NT$1200", "nd": ["情緒", "放鬆", "肌膚"], "w": "心膚精油組陪你完成之後瀟灑地「放下」。"}], "a": [{"no": 11, "n": "批評轉能力雙語版", "u": "https://membership-app-e2147.web.app/lifeos/criticism-to-ability-bilingual.html", "cat": "英文／語言學習 / 能力", "w": "批評轉能力雙語版把麻煩轉成人生功課的線索。"}, {"no": 110, "n": "改寫人生系統", "u": "https://valaivai087-ops.github.io/rewritelife/", "cat": "模型／系統／決策 / 人生", "w": "改寫人生系統協助你提起與放下。"}]}, {"id": 79, "t": "給我狠狠的努力，別再內耗了！這本書讀爛它", "d": "2025/11/18", "g": ["讀書改變命運", "讀書感悟", "讀書提升自己", "每日讀書打卡", "讀書成長"], "b": "付出不亞於任何人的努力。\n\n二十世紀修行大師葛吉夫曾說：普通努力不算什麼，只有超級努力才算數。\n\n葛吉夫說，人不需要害怕努力，因為努力而致死的機率小得可憐，反而是停滯不前、懶惰或恐懼，比較容易致死。\n\n無論是體能還是精神專注力，無論是在高壓還是在自發狀態下，人的潛能都超乎自己日常的理解。\n\n普通努力才會讓人覺得累，超級努力就不累了。如果你覺得累，不妨加碼試試看，也許就真的不累了。\n\n高人的成就從何而來？根據天才的說法，成功是九十九分努力與一分聰明的組合，這說法很對，但也很奇怪，因為有很多同樣九十九分的努力者，成就卻不如天才的萬分之一。\n\n所以，那“一分”聰明，顯然才是關鍵。擁有那一分的人，總是在做對的事情，而且總是把事情做對，因此才能把九十九分努力全部用在得力處。如此日積月累，相加相乘，成績將不容小覷。\n\n有那一分聰明的人，能悟透“我願”，放下“我執”，因此對所為之事皆能“樂而為之”。\n\n這裡說的其實不是聰明，而是智慧。人的成就和幸福，幾乎與智慧可以畫等號，但多數人忙著學別的，不學這個。人世間的顛倒，莫此為甚。\n\n所謂智慧，其實就是關乎人生成就和幸福的學問，只要學到了，哪怕只有一分，都能勝過那剩下的九十九分，當然值得列為優先選項，並且花九十九分氣力來學。\n\n智慧如何學？高人的答案是：讀萬卷書，不如行萬里路；行萬里路，不如閱人無數；閱人無數，不如高手指路。上焉者，當然是四項都做，但如我等凡俗之輩，人過中年，只能用竅門，專注“高手指路”上了。\n\n高手指路，較通俗的說法叫做“站在巨人的肩膀上”。大家每天該花最多時間做的事，就是找到你自己所需要的“巨人”，然後把自己弄得身輕如燕，想方設法站在巨人的肩膀。", "c": "心靈成長", "k": "普通努力不算什麼，超級努力才算數，而且超級努力反而不累。不過成功是「99分努力＋1分聰明」，那1分是智慧：做對的事、把事做對。學智慧最快的方法是「高手指路」，也就是站在巨人的肩膀上，多向厲害的人學。", "m": ["努力與智慧", [["超級努力", ["普通努力不算", "超級努力不累"]], ["停滯更危險", ["懶惰恐懼更致命"]], ["1分聰明", ["做對的事", "把事做對"]], ["智慧", ["成就與幸福的學問"]], ["學法", ["讀書<行路<閱人<高手指路"]]]], "f": [["找到巨人", "你需要的高手"], ["身輕如燕", "放下我執"], ["站上肩膀", "學習智慧"], ["超級努力", "用在得力處"], ["成就幸福", "相加相乘"]], "p": [{"no": "090", "n": "人參皂苷複方（膠囊）", "pr": "NT$560", "nd": ["體力", "循環", "適應力"], "w": "人參皂苷複方支持體力與適應力，支撐超級努力。"}, {"no": "042", "n": "清思油滴35ml（迷迭香精油＋EPA魚油）", "pr": "NT$450", "nd": ["腦神經", "專注", "情緒"], "w": "清思油滴支持專注，把努力用在得力處。"}, {"no": "001", "n": "防藍光護目鏡", "pr": "NT$200", "nd": ["眼睛", "光傷害", "視覺疲勞"], "w": "大量閱讀高手著作時保護眼睛。"}], "a": [{"no": 111, "n": "十大模型引擎", "u": "https://valaivai087-ops.github.io/10modlengines/", "cat": "模型／系統／決策 / 模型", "w": "十大模型引擎就是「站在巨人肩膀上」的智慧模型。"}, {"no": 105, "n": "能力養成系統 350", "u": "https://membership-app-e2147.web.app/platform/ability-building/ability-development-system-350.html", "cat": "能力養成／自律行動 / 能力養成", "w": "能力養成系統 350 把 99 分努力用對方向。"}]}, {"id": 80, "t": "驚到我了！寫的太棒了！我不允許沒有人讀過", "d": "2025/11/17", "g": ["思想的力量", "讀書與思考", "直覺的力量", "自我成長", "一本好書", "讀書感悟"], "b": "你可能會過分沉浸在內心的美好感受或恐懼中，以至於很難專注於外部事物。從本質上說，內部和外部的客體都在爭奪你的注意力，你既有內在體驗又有外在體驗——然而你是誰？\n\n為了更深入地探討這一點，請回答另一個問題：你是否有過這樣的時候，即沒有情緒化的體驗，只是感到內心很平靜？你仍然待在內心深處，但這時你只能覺知和安靜。你開始認識到外部世界和內部世界的情感湧動一直如浮雲來了又去。但是你，這個正在體驗這一切事物的人，始終能清醒地覺知在你眼前掠過的一切。\n\n但是你在哪裡呢？也許我們可以在你的思想中找到你。\n\n好吧，我不是外部世界裡的任何事物，也不是各種情感。這些外部和內部的事物來了又去，而我只是在體驗它們。另外，我也不是思想本身。思想可以是安靜的，也可以是嘈雜的；可以是快樂的，也可以是悲傷的。思想只是我所覺知的另一種事物。但是，我是誰？\n\n我是誰？擁有這些生理、情感和心理體驗的是誰？你得把這個問題想得更深入一點。要做到這一點，就要拋開所有體驗，注意觀察剩下的是什麼。你將開始注意到是誰在經歷這些體驗。最終，你會達到自身內在的某個狀態，在那個狀態下你會認識到，作為體驗者的你具有一種特定的品質。這種品質就是覺知、意識，以及某種直覺性的存在感。你知道你就在自身的深處。你不必思考這一點，因為你天生就知道。如果你願意的話，你也可以思考一下，但是你將知覺到你正在思考它。不管思想是否存在，你都是存在的。\n\n如果你足夠深入，你就會找到你所在的地方。你就意識的位置上。在那裡，居住著一個真正的靈性的存在，無所用功，亦無所圖。最終你會退到內心足夠深的地方，觀看你的所有思想和情感，以及外在形式。所有客體都能呈現在你面前。思想比較接近意識，情感稍遠一點，而外部形式則更加遠離。在這一切背後，就是你。你是如此深入，以至於你將認識到你一直子在那裡。在你生命的每一個階段，你都會看到不同的思想、情感和事物從你面前經過。但你一直都是這一切清醒的接受者。", "c": "心靈成長", "k": "你是誰？你不是外面的東西，不是心情，也不是腦中的想法，因為這些都會來來去去。你是那個一直在「看著」這一切的人，就是「覺知」本身。往內心深處退一步，你會發現自己一直都在那裡，平靜地看著想法、情緒和世界經過。", "m": ["我是誰", [["不是外物", ["外部世界來去"]], ["不是情緒", ["如浮雲"]], ["不是思想", ["安靜或嘈雜"]], ["真正的我", ["覺知", "意識", "存在感"]], ["位置", ["退到內心深處", "觀看一切"]]]], "f": [["外部事物", "離你最遠"], ["情緒", "來了又去"], ["思想", "離意識最近"], ["覺知者", "看著一切的你"], ["自由", "你一直都在"]], "p": [{"no": "023", "n": "行氣精油", "pr": "NT$1200", "nd": ["循環", "放鬆", "情緒"], "w": "行氣精油在靜坐觀察時使用，退回內心深處的覺知者位置。"}, {"no": "054", "n": "GABA（膠囊）", "pr": "NT$540", "nd": ["睡眠", "情緒", "放鬆"], "w": "GABA 支持放鬆，讓情緒如浮雲來去。"}], "a": [{"no": 51, "n": "Spirit Final 靈性系統", "u": "https://membership-app-e2147.web.app/lifeos/spirit-final.html", "cat": "基督信仰／靈性智慧 / 靈性", "w": "Spirit Final 靈性系統回到清楚覺察與內在力量。"}, {"no": 50, "n": "靈性 APP 完整版", "u": "https://membership-app-e2147.web.app/lifeos/spiritual-app-complete.html", "cat": "基督信仰／靈性智慧 / 靈性", "w": "靈性 APP 完整版延伸「我是誰」的探索。"}]}, {"id": 81, "t": "寫的太通透了，早點讀到這本書就好了！😭", "d": "2025/11/16", "g": ["分享好書", "讀書感悟", "一起讀好書", "讀書與思考", "讀書成長", "自我成長", "我的私人書單"], "b": "一旦你清除地看到了自己的內心感到煩惱的部分，你就自問：“看到這一切的是誰？注意到這一內心煩惱的是誰？”問自己這些問題是解決你所有問題的辦法。你能看到內心的煩惱，這就意味著你與它並排一體。看到某一事物的過程時以主客體關係為前提的。其中的主題被稱為“見證者”，因為正是它看到了正在發生的事情。客體就是主題看到的東西，在這裡指內心的煩惱。對內心問題保持客觀覺知的做法總比在外部環境中迷失自己強。擁有這種能力的人和世俗的人之間有著本質的區別。“世俗”並不意味著你有錢或有地位，而是說你認為解開內心的問題的方法存在於外部世界。你認為，如果你改變了外部事物，你就能擺脫煩惱。但是，從來沒有任何人能夠透過改變外部事物而真正好起來，總會有下一個問題冒出來。唯一的、真正的解決方法就是佔據“見證者意識”的位置，並且徹底改變你的參照系。\n\n要獲得真正的內心自由，你就必須客觀地觀察自己的問題，而不是迷失其中。當你迷失在某個問題的能量場中時，你找不到任何解決問題的辦法。眾所周知，當你感到焦慮、恐懼或生氣時，你就必須很好地應對當前的情況。因此，你要處理好的第一個問題就是你自己對外部事物的反應。你將無法解決任何外部問題，除非你能夠把握住當前局面對你內心的影響。問題通常不是它外表看起來的那樣。當你的認識變得足夠清晰時，你就會認識到，真正的問題在於，你內心中的某個部分幾乎可以對任何事物產生不滿。你要解決這個問題，而這需要完成從“外部方案意識”到“內部方案意識”的轉變。你必須打破一種慣性思維習慣，即認為解決問題的辦法在於重新安排外部事物。要永久地解決你的問題，唯一的辦法就是深入你的內心，讓似乎總是與現實格格不入的那一部分的你得到解脫。一旦你這麼做了，你就可以清掃障礙，去處理剩下的問題了。", "c": "心靈成長", "k": "看到自己心裡煩惱時，問自己：「是誰在看這個煩惱？」你能看到它，代表你不是它。很多人以為改變外面的事就能不煩，但永遠會有下一個問題。真正的方法是退一步當「見證者」，先處理自己對事情的反應，從內心解決。", "m": ["見證者意識", [["關鍵問題", ["看到這一切的是誰？"]], ["主客體", ["見證者", "內心煩惱"]], ["世俗", ["以為改外部就好"]], ["內部方案", ["先處理自己的反應"]], ["根本", ["心中總不滿的那部分"]]]], "f": [["煩惱出現", "焦慮、生氣"], ["退後一步", "誰在看這個煩惱？"], ["客觀覺知", "不迷失其中"], ["處理內心反應", "內部方案"], ["真正自由", "再處理外部"]], "p": [{"no": "054", "n": "GABA（膠囊）", "pr": "NT$540", "nd": ["睡眠", "情緒", "放鬆"], "w": "GABA 支持放鬆，焦慮生氣時先退一步當見證者。"}, {"no": "023", "n": "行氣精油", "pr": "NT$1200", "nd": ["循環", "放鬆", "情緒"], "w": "行氣精油搭配深呼吸，練習客觀覺知內心煩惱。"}], "a": [{"no": 56, "n": "陰影整合系統", "u": "https://valaivai087-ops.github.io/shadow/", "cat": "情緒心理／信念療癒 / 心理", "w": "陰影整合系統處理內心總是不滿的那一部分。"}, {"no": 63, "n": "情緒導航 APP", "u": "https://membership-app-e2147.web.app/lifeos/emotion-navigation-app.html", "cat": "情緒心理／信念療癒 / 心理", "w": "情緒導航 APP 從「外部方案」轉向「內部方案」。"}]}, {"id": 82, "t": "你活顛倒了嗎？趕緊學起來。這本書強烈推薦", "d": "11/12/2025", "g": ["自我成長", "改變的勇氣", "每日讀書打卡", "讀書感悟", "閱讀筆記"], "b": "曾聽一位大師說，世上只有三件事：自己的事，別人的事，老天的事。\n\n那種活顛倒的樣子，就是拿別人的事和老天的事太當真，面對自己的事卻不認真。\n\n所謂“天要下雨，娘要嫁人”，都是自己做不了的主的事，不能當真，否則就是給別人找麻煩。跟老天過不去，不可能有好下場。\n\n只有能做主的，才算自己的事。天下雨了，你出不出們，打不打傘，幹不幹活，開不開心，這些才是自己的事。自己的事不認真，就錯過了人生的功課，誤解了別人的處境，辜負了老天的厚愛，怎們可能圓滿？\n\n別人的人生要怎麼活？你若認為是自己的事，太當真，結果可能因為擔心而束縛彼此，或者想著掌控而讓人窒息，甚至越俎代庖，把別人的功課拿來做，導致別人沒有機會好好活。這樣的當真，叫做“撈過界”，亂入別人的人生瞎攪局。\n\n而別人如何對待我們，也是別人的事，不能太當真。把別人對我們的好太當真，就讓自己陷入依賴關係，身不由己；如果認為別人對我們不好，而且還當真，則易形成對立，製造無所謂的拉扯，浪費彼此的生命，又所謂何來？\n\n在各種關係中，只有我們如何對別人，才是自己的事，是能做主的事。無論別人活得好不好，無論別人如何對待我們，我都接受、尊重、
