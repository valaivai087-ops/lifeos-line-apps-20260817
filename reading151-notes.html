<head>

<style>
:root{
  --bg:#f7f5f0; --card:#ffffff; --ink:#22201c; --muted:#6f6a60; --line:#e4dfd4;
  --accent:#b4532a; --accent-soft:#f6e6dc; --mark:#ffe58a; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181715; --card:#22211e; --ink:#ece8df; --muted:#a49d90; --line:#36332d;
    --accent:#e48a5c; --accent-soft:#3a2a20; --mark:#6b5a12; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#181715; --card:#22211e; --ink:#ece8df; --muted:#a49d90; --line:#36332d;
  --accent:#e48a5c; --accent-soft:#3a2a20; --mark:#6b5a12; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 80px}
header{padding:18px 0 10px;border-bottom:1px solid var(--line)}
.searchrow{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
h1{margin:0;font-size:22px;letter-spacing:.02em}
.sub{color:var(--muted);font-size:13px;margin:2px 0 12px}
.searchrow{display:flex;gap:8px;align-items:center}
#q{flex:1;min-width:0;font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);outline:none}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{font:inherit;font-size:13px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.count{color:var(--muted);font-size:13px;margin:12px 0 4px}
.note-warn{font-size:12px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin-top:12px}
.list{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.head{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;cursor:pointer}
.num{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;background:var(--c,#888)}
.ht{flex:1;min-width:0}
.ht b{display:block;font-size:16px;line-height:1.45}
.meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.tag{border:1px solid var(--line);border-radius:6px;padding:0 6px}
.caret{flex:none;color:var(--muted);transition:transform .2s;margin-top:8px}
.item.open .caret{transform:rotate(90deg)}
.body{display:none;padding:4px 16px 18px;border-top:1px solid var(--line)}
.item.open .body{display:block}
.sec{margin-top:18px}
.sec h3{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.kid{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:16px}
/* mind map */
.mm{display:grid;grid-template-columns:1fr auto 1fr;gap:10px 18px;align-items:center}
.mm .col{display:flex;flex-direction:column;gap:10px}
.mm .center{background:var(--c);color:#fff;font-weight:700;border-radius:999px;padding:14px 20px;text-align:center;max-width:220px;box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 18%,transparent)}
.br{position:relative;border:1.5px solid color-mix(in srgb,var(--c) 55%,var(--line));border-radius:12px;padding:8px 10px;background:color-mix(in srgb,var(--c) 6%,var(--card))}
.br b{font-size:14px;color:color-mix(in srgb,var(--c) 75%,var(--ink))}
.br .lv{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.br .lv span{font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.mm .left .br::after,.mm .right .br::before{content:"";position:absolute;top:50%;width:18px;border-top:1.5px solid color-mix(in srgb,var(--c) 55%,var(--line))}
.mm .left .br::after{right:-19px}
.mm .right .br::before{left:-19px}
/* framework */
.fw{display:flex;align-items:stretch;flex-wrap:wrap;gap:6px}
.st{flex:1 1 140px;min-width:120px;border-radius:12px;padding:10px 12px;background:var(--card);border:1.5px solid var(--line);border-top:4px solid var(--c);position:relative}
.st .n{font-size:11px;color:var(--muted)}
.st b{display:block;font-size:14px;line-height:1.4}
.st p{margin:4px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
.ar{flex:none;align-self:center;color:var(--c);font-weight:700}
/* products */
.pd{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.pc b{display:block;font-size:14.5px}
.pc .mech{font-size:13.5px;color:var(--ink);margin-top:4px}
.pc .mech::before{content:"✅ 正面機制：";color:var(--accent);font-weight:600}
.ptop{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:2px}
.pno{color:var(--muted);font-weight:600}
.price{color:var(--accent);font-weight:700;font-size:13px}
.nodes{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.nodes span{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.ac{display:block;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:10px 12px;background:var(--card);color:var(--ink);text-decoration:none}
.ac:hover{border-color:var(--accent)}
.ac b{display:block;font-size:14.5px;color:var(--accent)}
.acat{color:var(--muted)}
.ac .why{font-size:13.5px;margin-top:4px}
details.raw{margin-top:18px;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
details.raw summary{cursor:pointer;font-weight:600;font-size:14px}
.rawtxt{white-space:pre-wrap;font-size:14.5px;margin-top:8px;line-height:1.8}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.top{position:fixed;right:16px;bottom:16px;z-index:6}
@media (max-width:720px){
  .mm{grid-template-columns:1fr}
  .mm .center{max-width:none;order:-1}
  .mm .left .br::after,.mm .right .br::before{display:none}
  .mm .col{padding-left:12px;border-left:2px solid color-mix(in srgb,var(--c) 40%,var(--line))}
  .fw{flex-direction:column}
  .ar{transform:rotate(90deg)}
  h1{font-size:19px}
}
@media print{header{position:static}.item .body{display:block}.top,.btn{display:none}}
</style>
</head>

<script>
const DATA = [{"id": 1, "t": "解決問題，從來只有正面突破！！收藏篇！！", "d": "4 天前", "g": ["解決問題", "跳出固有思維", "自我成長"], "b": "💡 面對困境的態度\n無論處境有多難，我都絕不妥協迎合，認準正道就正面突破。就算身處逆風，只要認定是對的事，就堅持去做。\n前路阻礙再大，我也不繞道迂迴，拼盡全力向前，像攀巖者一樣，緊盯目標向上攀登。就算孤獨和恐懼會襲來，解決問題也唯有正面突破。\n\n✨ 歷經磨難的收穫\n反覆歷經磨難，內心才會越來越堅定。\n走在正道上遇到的困難，都是上天的考驗，是打磨心性、淨化靈魂的機會，人生也會因此變得豐盈。\n\n🙏 守住本心的準則\n舉頭三尺有神明。就算沒人看見、獨處之時，我也要守住本心。心生邪念時，就提醒自己：有人在看著我。\n\n⚠️ 遇事的判斷方法\n遇到事情，第一時間冒出來的想法，大多源於私慾和情緒。普通人很難一開始就分清善惡。\n別急著下決定，先停一停，用善惡標尺衡量之後再做選擇，給自己一個緩衝，避開錯誤。\n靠本能、情緒、聰明，未必能選對。越是重大抉擇，越要聽從靈魂深處的聲音。\n靈魂的判斷標準很簡單：不問得失，只分善惡，以道德倫理為標尺。", "c": "心靈成長", "k": "遇到困難時，不要偷偷繞路或做壞事來逃避，要勇敢面對、用對的方法解決。就像爬山一樣，眼睛看著山頂一步一步往上爬。每次克服困難，心就會變得更強壯。做決定前先停一下，問自己：「這樣做是對的還是錯的？」而不是只想「我會不會吃虧」。", "m": ["正面突破", [["態度", ["不妥協", "不繞道", "像攀岩者"]], ["收穫", ["磨難讓心堅定", "人生更豐盈"]], ["守本心", ["沒人看也要做對", "舉頭三尺有神明"]], ["判斷法", ["先停一停", "只分善惡", "不問得失"]]]], "f": [["遇到困難", "第一個念頭常是情緒"], ["暫停", "給自己緩衝"], ["善惡標尺", "問：這樣對嗎？"], ["正面行動", "不繞道、全力向前"], ["成長", "心性更堅定"]], "p": [{"no": "047", "n": "刺五加（膠囊）", "pr": "NT$495", "nd": ["壓力", "體力", "適應力"], "w": "刺五加屬適應原草本，面對逆風與壓力時，支持身體的適應力與續航力，讓「正面突破」撐得久。"}, {"no": "040", "n": "迷迭香滾珠瓶10ml", "pr": "NT$150", "nd": ["專注", "情緒"], "w": "迷迭香香氣幫助提神專注，做決定前抹一點、深呼吸，替「先停一停」建立儀式。"}, {"no": "054", "n": "GABA（膠囊）", "pr": "NT$540", "nd": ["睡眠", "情緒", "放鬆"], "w": "GABA 支持放鬆，情緒衝上來時幫助身心回穩，更容易用善惡標尺冷靜判斷。"}], "a": [{"no": 49, "n": "智慧 APP", "u": "https://membership-app-e2147.web.app/lifeos/wisdom-app.html", "cat": "基督信仰／靈性智慧 / 智慧", "w": "智慧 APP 收錄反思素材，練習「不問得失、只分善惡」的判斷力。"}, {"no": 107, "n": "高主動性 OS", "u": "https://membership-app-e2147.web.app/platform/ability-building/high-agency-os-complete.html", "cat": "能力養成／自律行動 / 能力養成", "w": "高主動性 OS 把「不繞道、正面突破」拆成可執行的行動步驟。"}]}, {"id": 2, "t": "關於自我成長，這本書我翻爛了！！必讀篇！", "d": "5 天前", "g": ["讀書與思考", "讀書成長", "思想的力量", "自我成長"], "b": "最近重讀了《心》，特別有感觸，分享給大家👇\n身處當下這個時代，我們就像漂浮在波濤洶湧的汪洋大海上，該怎麼駕馭人生的小舟駛向幸福的遠方？\n攥緊雙槳拼命划動的時候，我們有沒有確認過前行的方向是否正確？選擇隨波逐流放任自流的時候，我們有沒有意識到前方可能藏著危險的漩渦？\n\n📖 書中的核心觀點\n稻盛先生提出“相由心生，境隨心轉”，我們人生遇到的種種境遇，其實都是自己的內心塑造的，內心的想法真的能影響甚至改變周遭的環境。\n他還提到，人生的多數境遇都和自己的內心狀態緊密相關，我們在心裡反覆描摹的圖景，往往會慢慢在現實生活裡顯現出來。\n\n🤔 關於人生意義的思考\n人到底該怎麼活，該持有什麼樣的心態，這兩個問題其實指向同一個答案：你在心裡安放什麼樣的念想，很大程度上就決定了你會擁有怎樣的人生。\n如果想要做成某件事，就必須有不懼任何困難、敢往前衝的強大意志，還有無論如何都要達成目標的、燃燒般的熱情。\n\n✨ 我梳理到的核心認知\n人生的目的其實就是磨鍊心性、為他人盡力，人生首要的意義就是打磨我們的靈魂。\n我們總執著於追逐財富、地位和名譽，天天奔波就為了滿足自己的慾望，但這些從來都不是人生真正的目的。\n\n走完這一生，我們的靈魂是不是比最初出發的時候更澄澈，人格是不是得到了一點實實在在的提升，這件事遠比追名逐利重要得多。\n所以認真對待每一天的工作，踏踏實實持之以恆地努力，過程裡我們的心性會慢慢被打磨，人格不斷精進，靈魂也會變得更豐盈美好，這才是人生首要的意義。\n平時多回頭看看自己的想法，檢視自己的言行，試著剋制心裡的利己念頭，不要被慾望裹挾，讓心裡存著善意、願意為他人著想的那一面慢慢顯露出來就好。", "c": "心靈成長", "k": "稻盛和夫說：「你心裡想什麼，生活就會變成什麼樣子。」人生最重要的不是賺很多錢或當很大的官，而是讓自己的心越來越乾淨、越來越善良。每天認真做好自己的工作，常常檢查自己有沒有太自私，就是在「磨亮」自己的心。", "m": ["《心》稻盛和夫", [["核心觀點", ["相由心生", "境隨心轉"]], ["做成事", ["強大意志", "燃燒的熱情"]], ["人生目的", ["磨練心性", "為他人盡力"]], ["日常練習", ["認真工作", "檢視言行", "克制自私"]]]], "f": [["內心想法", "心裡描繪的畫面"], ["行動", "認真對待每天的工作"], ["磨練", "克制慾望、為人著想"], ["靈魂提升", "心更澄澈、人格精進"], ["境遇改變", "生活跟著變好"]], "p": [{"no": "028", "n": "心膚精油特價組", "pr": "NT$1200", "nd": ["情緒", "放鬆", "肌膚"], "w": "心膚精油組的香氣讓人靜下來，每天睡前檢視言行時使用，幫助心回到柔軟澄澈。"}, {"no": "071", "n": "王牌粉（12g×30包）", "pr": "NT$2000", "nd": ["正常發炎調節", "抗氧化", "免疫"], "w": "王牌粉作為固定補充習慣，照顧身體基礎狀態，讓「認真對待每天的工作」有體力支撐。"}, {"no": "001", "n": "防藍光護目鏡", "pr": "NT$200", "nd": ["眼睛", "光傷害", "視覺疲勞"], "w": "長時間閱讀《心》這類好書時保護眼睛，減少螢幕與閱讀的視覺疲勞。"}], "a": [{"no": 58, "n": "信念身分系統", "u": "https://membership-app-e2147.web.app/lifeos/belief-identity.html", "cat": "情緒心理／信念療癒 / 信念", "w": "信念身分系統幫你看見「心裡描繪的圖景」，把念想整理成可調整的方向。"}, {"no": 15, "n": "靈魂重建雙語 APP", "u": "https://membership-app-e2147.web.app/lifeos/soul-reconstruction-bilingual-app.html", "cat": "英文／語言學習 / 心理", "w": "靈魂重建雙語 APP 對應「打磨靈魂」，整理情緒、信念與行為模式。"}]}, {"id": 3, "t": "管好念頭這件事，真的太重要了！必讀篇！！", "d": "7 天前", "g": ["管好自己的念頭", "開悟覺醒", "轉念一想一切都好", "開悟", "念頭的力量"], "b": "✨ 充實過好當下\n只要認真充實地度過今天，就能看見美好的明天。無論是什麼工作，只要全力以赴，就能產生很大的成就感和自信心，讓人更積極地挑戰下一個目標。\n\n📍 大道至簡的核心\n大道至簡，不過是“置心一處”而已。心不用，就不在。置心一處，就能啟用；置於何處，且問初衷。\n\n💡 找回初心的方法\n凡事皆有初衷，經過人事糾雜、昏沉妄想後，多數人都忘了初衷，也就失去了真心。要找回真心，“置心一處”於初衷，無怨無悔、不離不棄，就是唯一的方法了。\n\n🤔 最常被忽略的重點\n人生最重要、影響力最大的，到底是什麼事情呢？人一生做最多次的是什麼事？答案是：想！人一生重複最多次的動作不是呼吸，而是“念頭”。多數人一生起心動念的次數超過百億次，這些念頭，會影響我們的健康，誘發我們的情緒，決定我們的人際關係、事業成敗，以及人生的方向和意義。\n\n🔑 人生第一要務\n人生最重要的事就是管好自己的“念頭”。無論是追求高效能的有識之士，還是希望自己這一生能“好好過”的人，莫不致力於此。所以在古今中外的修行者看來，才把這件事當作“第一要務”。\n\n📝 日常小練習\n儘可能提醒自己，想辦法看見“自己在想什麼”。尤其是當事情沒弄好，或升起了情緒，或身體感覺不對勁時，我都會好好問自己“剛才我在想什麼？”如果人一生要培養一個真正重要的好習慣，應該就是這件事了。", "c": "心靈成長", "k": "人一輩子做最多次的事情不是呼吸，而是「想事情」。這些念頭會影響我們的心情、身體和人緣。所以最重要的習慣就是：常常問自己「我剛剛在想什麼？」尤其是心情不好或身體不舒服時。把心放在一件事上，記得自己一開始為什麼要做，就能找回真心。", "m": ["管好念頭", [["活在當下", ["認真過今天", "全力以赴", "產生自信"]], ["置心一處", ["心用才在", "回到初衷"]], ["念頭力量", ["一生百億次", "影響健康情緒", "決定人生方向"]], ["小練習", ["看見自己在想什麼", "問：剛才我在想什麼？"]]]], "f": [["事情不順/情緒起", "身體或心情怪怪的"], ["停下覺察", "問：剛才我在想什麼？"], ["看見念頭", "分辨是否偏離初衷"], ["置心一處", "把心拉回初衷"], ["好好過", "健康、人際、事業更順"]], "p": [{"no": "042", "n": "清思油滴35ml（迷迭香精油＋EPA魚油）", "pr": "NT$450", "nd": ["腦神經", "專注", "情緒"], "w": "迷迭香＋EPA 油滴支持專注與腦神經，幫助「置心一處」、看見自己在想什麼。"}, {"no": "091", "n": "甘氨酸鎂複方粉包", "pr": "NT$1350", "nd": ["睡眠", "神經", "肌肉", "放鬆"], "w": "甘氨酸鎂支持神經放鬆，念頭紛亂、身體緊繃時讓心比較容易安定下來。"}, {"no": "023", "n": "行氣精油", "pr": "NT$1200", "nd": ["循環", "放鬆", "情緒"], "w": "行氣精油搭配深呼吸，問自己「剛才我在想什麼？」時建立覺察的身體錨點。"}], "a": [{"no": 117, "n": "大腦更新系統", "u": "https://membership-app-e2147.web.app/lifeos/brain-update.html", "cat": "模型／系統／決策 / 大腦", "w": "大腦更新系統聚焦覺察與認知調整，正好練習「管好念頭」。"}, {"no": 63, "n": "情緒導航 APP", "u": "https://membership-app-e2147.web.app/lifeos/emotion-navigation-app.html", "cat": "情緒心理／信念療癒 / 心理", "w": "情緒導航 APP 在情緒升起時引導你回看念頭，找回初衷。"}]}, {"id": 4, "t": "致富的長期思考，這篇筆記可以閱讀！！！！", "d": "10月16日", "g": ["財富思維", "怎樣變得富有", "如何財富自由", "財富自由"], "b": "整理了一些關於財富積累的思考，想分享給大家：\n💡 努力和財富的關係\n賺錢和工作的努力程度沒有什麼必然聯絡。即使每週在餐廳拼命工作80個小時，也不可能發財。要想獲得財富，你就必須知道做什麼、和誰一起做、什麼時候做。與埋頭苦幹相比，更重要的是理解和思考。當然，努力很重要，不能吝嗇自己的努力，但必須選擇正確的方式。\n\n💡 精通與痴迷的關聯\n一個人只能在一兩件事上做到精通，而這一兩件通常是讓你痴迷的事情。\n\n💡 財富、金錢與地位的區別\n追求財富，而不是金錢和地位。財富是指你在睡覺的時候仍然能為你賺錢的資產。金錢是我們轉換時間和財富的方式。地位是你在社會等級體系中所處的位置。\n\n💡 獲得財富的可行路徑\n獲得財富的一個途徑，就是為社會提供其需求但無從獲得的東西，並實現規模化。選擇一個有長期發展前景的行業，找到可以長期合作的人。\n\n💡 迭代思維與複利效應\n培養迭代思維。生活中所有的回報，無論是財富、人際關係，還是知識，都來自複利。\n\n💡 關於專長的核心邏輯\n專長指的是無法透過培訓獲得知識。如果社會可以培訓你，那麼社會也可以培訓他人來取代你。要想有所專長，就要追求真正的興趣和熱愛，而不是盲目追逐熱點。累積專長的過程，對你而言就像玩耍，對他人來說則很吃力。專長是一個人個性和身份的有機組成部分。一旦找到自己天生喜歡和擅長的領域，你就可以朝著這個方向持續前進。在“成為自己”這件事上，沒有人能比得過你。\n\n💡 工作選擇的優先順序\n工作時要拼盡全力，毫無保留。不過，共事的人和工作的內容比努力程度更重要。\n\n💡 致富的長期思考\n如果想要實現致富的長期目標，你就應該問問自己：“這是我真正想要的東西嗎？我的規劃目標是我真正想要的嗎？”得到肯定的答案後，再問問自己：“我實現產品化了嗎？我實現規模化了嗎？我選擇規模化的方式是勞動、資本，還是程式碼或媒體？”由此可見，“把自己產品化”這個闡述方便簡單，便於記憶。如果想變得富有，你就要弄清楚你能為社會提供哪些其有需要但無從獲得的東西，而提供這些東西對你來說又是輕鬆自然的事情，在你的技術和能力範圍內。", "c": "財富思維", "k": "賺大錢不是靠拚命加班，而是靠想清楚「做什麼、跟誰做、什麼時候做」。真正的財富是「你睡覺時也會幫你賺錢的東西」。找到自己最愛、最擅長的事，把它變成別人需要的產品，再想辦法讓很多人都能用到（例如寫程式、拍影片），慢慢累積就像滾雪球。", "m": ["納瓦爾致富思考", [["努力≠財富", ["選對方向", "理解與思考"]], ["財富定義", ["睡覺也賺錢的資產", "≠金錢≠地位"]], ["專長", ["培訓學不到", "像玩耍一樣", "做自己"]], ["規模化", ["產品化自己", "勞動/資本/程式碼/媒體"]], ["複利", ["財富", "人際", "知識"]]]], "f": [["找熱愛", "痴迷且擅長的事"], ["累積專長", "別人難以取代"], ["產品化", "提供社會需要的東西"], ["槓桿規模化", "程式碼、媒體、資本"], ["複利財富", "睡覺也在賺錢"]], "p": [{"no": "042", "n": "清思油滴35ml（迷迭香精油＋EPA魚油）", "pr": "NT$450", "nd": ["腦神經", "專注", "情緒"], "w": "清思油滴支持專注與思考力，致富靠「理解和思考」，需要清楚的腦袋。"}, {"no": "098", "n": "粒線寶（膠囊）", "pr": "NT$550", "nd": ["粒線體", "能量", "恢復"], "w": "粒線寶支持細胞能量，長期投入熱愛的事、累積專長需要穩定精力。"}, {"no": "001", "n": "防藍光護目鏡", "pr": "NT$200", "nd": ["眼睛", "光傷害", "視覺疲勞"], "w": "大量閱讀與螢幕工作時保護眼睛，讓終身學習與創作更持久。"}], "a": [{"no": 120, "n": "複利模型 APP", "u": "https://membership-app-e2147.web.app/lifeos/compound-model-app.html", "cat": "模型／系統／決策 / 模型", "w": "複利模型 APP 對應「所有回報都來自複利」，用模型看懂財富累積。"}, {"no": 100, "n": "AI 時代能力系統", "u": "https://membership-app-e2147.web.app/lifeos/ai-era-capabilities.html", "cat": "能力養成／自律行動 / AI", "w": "AI 時代能力系統幫你找出可規模化的槓桿：程式碼、媒體與工具。"}]}, {"id": 5, "t": "正念的奇蹟，這本書對我幫助很大很大很大！", "d": "10月12日", "g": ["正念", "轉念轉人生", "生命的智慧", "一本好書", "心理療愈"], "b": "我最近又看了一遍《正念的奇蹟》這本書，感覺對自己幫助特別大。\n\n💭 書中的核心感悟\n人們在溝通、解決和處理各種狀況時，若要獲得圓滿的結果，平靜的心和自我控制能力必不可少。\n任何人都明白，如果我們不能好好地控制自我，反而讓焦慮和嗔怒干擾了我們，那麼我們的工作不再有任何價值。\n\n✨ 活在當下的小事\n如果洗碗時，我們只想著接下來喝的那一杯茶，並因此急急忙忙地把碗洗完，就好像它們很令人厭惡似的，那麼我們就不是為了洗碗而洗碗。\n更進一步來說，洗碗時我們沒有活在當下。事實上，我們站在洗碗池邊，完全體會不到生命的奇蹟。\n如果我們不懂得洗碗，很可能我們也不懂得喝茶：喝茶時，我們只會想著其他事，幾乎察覺不到自己手中的這杯茶。就這樣，我們被未來吸走了，無法實實在在地活著，甚至連一分鐘都做不到。\n\n🌿 我喜歡的正念時刻\n我喜歡獨自漫步在鄉村小路上，兩旁長滿了秧苗和青草，我在正念中踏下每一步，了知自己正行走在這美妙的大地上。\n在這樣的時刻，存在本身就是個奇蹟，是不可思議的實相。\n每一天，我們都置身那些連自己都未認知到的奇蹟中：藍天、白雲、綠草、孩子烏黑而充滿好奇的眼睛，我們自己的眼睛。所有的一切，都是奇蹟。\n\n🤍 修習正念的方法\n忙碌又多慮的人們沒有悠閒的時間漫步在綠草茵茵的小路上，或是在樹下靜坐。\n人們必須籌備各種計劃，不斷和身邊的人溝通，試著努力解決層出不窮的難題，總有棘手的事情要做，必須處理種種困境，每時每刻都專注於工作，時刻保持警醒，準備應對狀況，隨機應變。\n我們該如何修習正念？專注工作，保持警覺和清醒，準備好應對任何可能發生的狀況，隨機應變，這就是正念。\n正念是奇蹟，藉由它，我們得以成為自己的主人，重建自我。", "c": "正念療癒", "k": "一行禪師說：洗碗就好好洗碗，喝茶就好好喝茶。如果做一件事時一直想著下一件事，就等於沒有真正活著。藍天、白雲、小朋友的眼睛，其實都是奇蹟。專心做眼前的事、保持清醒，就是正念，它會讓我們變成自己的主人。", "m": ["正念的奇蹟", [["核心", ["平靜的心", "自我控制"]], ["活在當下", ["洗碗就洗碗", "喝茶就喝茶"]], ["日常奇蹟", ["藍天白雲", "孩子的眼睛"]], ["忙碌時修習", ["專注工作", "保持警覺", "隨機應變"]]]], "f": [["分心", "想著下一件事"], ["察覺", "發現自己被未來吸走"], ["回到當下", "專注手上這件事"], ["體會奇蹟", "感受生活細節"], ["做自己主人", "平靜、不被焦慮控制"]], "p": [{"no": "023", "n": "行氣精油", "pr": "NT$1200", "nd": ["循環", "放鬆", "情緒"], "w": "行氣精油在洗碗、散步時抹一點，香氣把注意力拉回當下，練習正念。"}, {"no": "054", "n": "GABA（膠囊）", "pr": "NT$540", "nd": ["睡眠", "情緒", "放鬆"], "w": "GABA 支持放鬆，焦慮與嗔怒干擾時幫助恢復平靜的心。"}, {"no": "006", "n": "專利HEZY氫鬆袋（買空袋送氫氧水）", "pr": "NT$250", "nd": ["氧化壓力", "修復", "能量"], "w": "氫鬆袋現製氫氧水，「喝茶就好好喝茶」：把喝水變成專注當下的小儀式。"}], "a": [{"no": 57, "n": "情緒煉金完整版", "u": "https://membership-app-e2147.web.app/lifeos/emotion-alchemy-complete.html", "cat": "情緒心理／信念療癒 / 心理", "w": "情緒煉金完整版把焦慮、嗔怒轉成可理解的訊號，練習成為自己的主人。"}, {"no": 50, "n": "靈性 APP 完整版", "u": "https://membership-app-e2147.web.app/lifeos/spiritual-app-complete.html", "cat": "基督信仰／靈性智慧 / 靈性", "w": "靈性 APP 完整版提供靜心與覺察素材，延伸正念練習。"}]}, {"id": 6, "t": "聊聊自愛這件事，它是顯化的內驅力！必讀篇", "d": "10月6日", "g": ["自愛的力量", "顯化", "顯化法則"], "b": "我最近慢慢發現，覆盤、反思過去的錯誤和經歷，其實就是一種深度的自我接納，它會實實在在地推著我們往前走、獲得成長。\n①更高層次的自愛:\n是平衡好當下的需求和未來的需求。我們當下的生活，是過往一次次選擇慢慢塑造出來的。學會愛自己，既要看見當下的自己，也要看見心中的夢想。很多時候我們容易做出衝動的決定，只滿足了眼前的渴望，卻給未來的自己留下遺憾。自愛，是擁有自控力，能夠剋制即時的慾望，做出更長遠、對未來有益的選擇。\n\n②自愛需要反覆練習：\n自愛是自我成長的內在驅動力。我們選擇的行為、回應方式、思考模式，都在慢慢建立自我價值，助力自己向前走。試著在每一天裡，不對自己苛責評判，多給自己一份同理心、包容與善意愛自己不分事情大小，認真喝一杯水，勇敢離開消耗自己的關係，都是愛自己。當下每一個選擇，都在慢慢塑造現在的你，以及未來的你。\n\n③從現在起，就可以選擇好好善待自己。\n願意開始愛自己，就已經邁出最重要的一步。往後的每一天、每一刻，在生活細碎裡練習善待自己，你值得被溫柔對待。練習得多了，和自己相處、愛自己這件事，就會越來越自然。\n④和過去和解的小要點想要走向更從容的未來，學著放下過去帶來的羞愧、內疚、憤怒，試著寬恕曾經的自己，不苛責過去的選擇。可以試著記住這三點:\n1當時的我，已經盡了自己當時最大的努力。\n2所有經歷，都是人生珍貴的功課。\n3我早已不是從前的自己，一直在成長，一直在更新。", "c": "自我成長", "k": "愛自己不是一直放縱自己，而是能忍住眼前的誘惑，替未來的自己著想。愛自己要每天練習：不罵自己、好好喝一杯水、離開讓你很累的關係。對過去的錯誤要原諒自己：當時的我已經盡力了，每件事都是功課，現在的我已經長大了。", "m": ["自愛", [["高層次自愛", ["平衡當下與未來", "自控力"]], ["反覆練習", ["不苛責自己", "認真喝水", "離開消耗關係"]], ["從現在開始", ["善待自己", "你值得溫柔"]], ["與過去和解", ["當時已盡力", "經歷是功課", "我在成長"]]]], "f": [["覆盤過去", "反思錯誤與經歷"], ["自我接納", "不苛責、寬恕自己"], ["日常善待", "小事中愛自己"], ["自控選擇", "為未來做好決定"], ["顯化內驅力", "持續成長"]], "p": [{"no": "006", "n": "專利HEZY氫鬆袋（買空袋送氫氧水）", "pr": "NT$250", "nd": ["氧化壓力", "修復", "能量"], "w": "「認真喝一杯水」就是愛自己：氫鬆袋讓每天補水更有儀式感、更願意喝。"}, {"no": "028", "n": "心膚精油特價組", "pr": "NT$1200", "nd": ["情緒", "放鬆", "肌膚"], "w": "心膚精油組照顧情緒與肌膚，睡前善待自己的固定時段。"}, {"no": "091", "n": "甘氨酸鎂複方粉包", "pr": "NT$1350", "nd": ["睡眠", "神經", "肌肉", "放鬆"], "w": "甘氨酸鎂支持放鬆與睡眠，好好休息是最基本的自我照顧。"}], "a": [{"no": 56, "n": "陰影整合系統", "u": "https://valaivai087-ops.github.io/shadow/", "cat": "情緒心理／信念療癒 / 心理", "w": "陰影整合系統幫助放下羞愧與內疚，和過去的自己和解。"}, {"no": 39, "n": "身分 OS 雙語 APP", "u": "https://membership-app-e2147.web.app/platform/life-system/identity-os-bilingual-app.html", "cat": "英文／語言學習 / 生命系統", "w": "身分 OS 雙語 APP 支持「我一直在成長、更新」的新身分。"}]}, {"id": 7, "t": "顯化的法則太強大了！！！這本書很牛！牛！", "d": "10月5日", "g": ["顯化", "顯化法則", "自我成長"], "b": "我最近慢慢發覺，恐懼和自我懷疑，常常會限制我們發揮自己的潛能。很多時候，我們能達成的狀態，往往和內心深處相信自己值得什麼有關。\n\n①關於慣性行為\n心理學研究發現，我們大部分的慣性想法、本能反應、選擇和行為模式，都來自長期形成的潛意識習慣潛意識既能支撐我們向前，也會成為前進的阻礙。其中最常見的兩種內在卡點，就是恐懼與自我懷疑。\n\n②看不見的行動力阻力\n內心的恐懼和不確定感，會悄悄削弱我們的行動力，潛意識接收到的訊號彷彿是:我還不配、還沒準備好迎接我想要的生活。\n它們的力量很強，甚至會在我們剛剛開始暢想目標的時候就製造阻礙，讓我們不敢去想象理想的樣子。\n\n③偽裝的“保護者”\n恐懼常常會偽裝成保護者，告訴我們是在幫自己避開失望。在探索成長的路上，它會設定很多無形的心理障礙。每個人內在都有很強大的成長力量，可以幫助我們調整心態、持續成長，活成更喜歡的自己。\n\n④願景板的作用\n願景板不只是把想要的畫面視覺化，它也是一面鏡子，幫我們看見藏起來的恐懼與懷疑當你猶豫，不敢寫下心中期待的時候，可以問問自己:我為什麼遲疑?是哪些固有的想法困住了我?當覺察到這些內心卡點，我們才有機會慢慢鬆動它們，掃清內心的阻礙。\n\n⑤解綁束縛的小方法\n當我們允許自己大膽暢想未來，那些恐懼和懷疑就更容易被看見信。\n敢於期待，不必退縮。想要更輕鬆地靠近目標，首先要相信，你值得擁有美好的一切。\n這份內在力量本來就在我們心裡，只等我們慢慢去發掘那些不相信自己的聲音，無論多微弱，都可以把它捕捉記錄下來。哪怕想法看起來沒有道理，也可以寫下來。看清恐懼與懷疑的每一個細節，就是在慢慢解綁它們對我們的束縛。", "c": "顯化法則", "k": "很多時候我們做不到，不是因為能力不夠，而是心裡偷偷覺得「我不配」「我還沒準備好」。恐懼會假裝成保護我們的朋友，讓我們不敢想。做一張「願景板」，把夢想貼出來，如果你猶豫不敢貼，就問自己為什麼，把怕的聲音寫下來，看清楚它，它就沒那麼可怕了。", "m": ["顯化法則", [["慣性行為", ["來自潛意識", "恐懼與自我懷疑"]], ["隱形阻力", ["我不配", "還沒準備好"]], ["偽裝的保護者", ["假裝幫你避開失望"]], ["願景板", ["視覺化夢想", "照見恐懼"]], ["解綁方法", ["大膽暢想", "寫下懷疑", "相信值得"]]]], "f": [["寫下夢想", "做願景板"], ["察覺猶豫", "哪裡不敢寫？"], ["記錄懷疑", "把恐懼寫成文字"], ["鬆動卡點", "看清細節就解綁"], ["相信值得", "更輕鬆靠近目標"]], "p": [{"no": "028", "n": "心膚精油特價組", "pr": "NT$1200", "nd": ["情緒", "放鬆", "肌膚"], "w": "心膚精油組營造安全放鬆的氛圍，寫願景板、面對恐懼時讓心穩下來。"}, {"no": "040", "n": "迷迭香滾珠瓶10ml", "pr": "NT$150", "nd": ["專注", "情緒"], "w": "迷迭香滾珠瓶幫助專注，記錄自我懷疑的聲音時更清楚。"}, {"no": "054", "n": "GABA（膠囊）", "pr": "NT$540", "nd": ["睡眠", "情緒", "放鬆"], "w": "GABA 支持放鬆，恐懼升起時降低緊繃感，比較敢大膽暢想。"}], "a": [{"no": 102, "n": "人生顯化系統", "u": "https://valaivai087-ops.github.io/lifemanifastify/", "cat": "能力養成／自律行動 / 顯化", "w": "人生顯化系統整合願景、信念與行動，陪你一步步解綁卡點。"}, {"no": 59, "n": "信念系統", "u": "https://membership-app-e2147.web.app/lifeos/belief-system.html", "cat": "情緒心理／信念療癒 / 信念", "w": "信念系統幫你看見「我不配」等限制性信念並調整。"}]}, {"id": 8, "t": "賺錢思維，這篇筆記值得收藏！！必讀篇！！", "d": "10月3日", "g": ["讓錢為你工作", "讀書與思考", "賺錢思維"], "b": "①最近有一個觀點，對我很有啟發\n儘量依靠認知和專長創造價值，而不是單純出賣時間。\n\n②成長方向\n從普通打工人出發，持續提升自己，拓寬能力邊界，學會藉助槓桿，承擔更大責任，打磨專屬專長。長期堅持，疊加複利的力量，人生會擁有更多可能性。\n\n③風險原則\n不要做會讓自己全盤歸零的事，不孤注一擲、鋌而走險。\n可以把精力投入到勝算更高、長期有價值的事情上。\n\n④方向認知\n單純出賣時間，收入往往有天花板。我覺得努力的目標，是慢慢獲得更多選擇權，而不只是升職加薪。擁有獨立性，為自己交付的成果負責，是我向往的狀態。\n\n⑤ 槓桿的價值\n普通人想要放大影響力，學會用好槓桿很重要。藉助槓桿，一份能力可以持續產生價值。這時，判斷力，往往比單純堆時間、拼體力更重要。⑥時間的掌控\n我覺得人生很重要的目標，是拿回對時間的主動權。理想的狀態，是做可以借力的事，自己掌控節奏，對最終成果\n負責。\n\n⑥高效狀態\n當你擁有專長、責任心，懂得借力，你的價值更容易被看見，回報也會隨之而來。省下內耗的時間，做事效率會更高。不用為了開會而開會，不用刻意表現、堆砌彙報，只專注事情本身。\n\n⑦效率會大幅提升。順著自己的精力節奏安排工作，狀態不好的時候，不做無效的消耗。", "c": "財富思維", "k": "只靠賣時間（上班領時薪）收入會有上限。要慢慢學會用「專長」和「槓桿」（例如工具、平台、團隊）賺錢。不要做會讓自己一次輸光的事。最好的目標不是升官，而是拿回時間的主導權，照自己的節奏專心做事。", "m": ["賺錢思維", [["核心", ["認知與專長", "不只賣時間"]], ["成長", ["拓寬能力", "藉助槓桿", "承擔責任"]], ["風險", ["不全盤歸零", "不孤注一擲"]], ["目標", ["選擇權", "時間主動權"]], ["高效", ["專注事情本身", "順著精力節奏"]]]], "f": [["打工起點", "出賣時間"], ["提升專長", "打磨能力邊界"], ["使用槓桿", "工具/平台/資本"], ["控制風險", "不做歸零的事"], ["掌控時間", "獨立、對成果負責"]], "p": [{"no": "098", "n": "粒線寶（膠囊）", "pr": "NT$550", "nd": ["粒線體", "能量", "恢復"], "w": "粒線寶支持細胞能量，順著精力節奏工作、高效專注不內耗。"}, {"no": "042", "n": "清思油滴35ml（迷迭香精油＋EPA魚油）", "pr": "NT$450", "nd": ["腦神經", "專注", "情緒"], "w": "清思油滴支持專注與判斷，靠「認知和專長」而非堆時間創造價值。"}, {"no": "001", "n": "防藍光護目鏡", "pr": "NT$200", "nd": ["眼睛", "光傷害", "視覺疲勞"], "w": "長時間電腦工作保護眼睛，延長高效工作時段。"}], "a": [{"no": 120, "n": "複利模型 APP", "u": "https://membership-app-e2147.web.app/lifeos/compound-model-app.html", "cat": "模型／系統／決策 / 模型", "w": "複利模型 APP 看懂專長與槓桿如何疊加複利。"}, {"no": 113, "n": "秩序系統", "u": "https://valaivai087-ops.github.io/order/", "cat": "模型／系統／決策 / 秩序", "w": "秩序系統把任務與節奏整理成可執行系統，拿回時間主動權。"}]}, {"id": 9, "t": "顯化法則！！正向思路的影響真的很大很大！", "d": "10月2日", "g": ["顯化法則", "閱讀分享", "顯化"], "b": "分享親測超實用的四種調整方法👇\n① 掌控自己的思想走向\n② 留意日常的表達措辭\n③ 藉助肯定語引導狀態\n④ 堅持做視覺化練習\n\n✨正向思路的影響\n如果你主動選擇積極有力量的想法，喚起自信、熱情、希望這類高能量情緒，就能借助吸引力法則，把更多你想要的事物吸引到生活裡。\n\n⚠️消極思路的負面影響\n反過來，要是放任恐懼、疑慮這類偏向消極、自我否定的內在聲音冒出來，你的自我價值感會慢慢降低，進而催生低能量的情緒，直接阻礙你顯化想要的理想生活。\n我現在一直在堅持，主動用有力的正向想法替換掉冒出來的消極念頭，好好滋養自己的內心。\n別任由消極想法到處亂竄，主動掌控、梳理好自己的思緒，讓它們變成助力，而不是擋路的阻礙。", "c": "顯化法則", "k": "想要好事發生，先管好自己的腦袋。注意自己說的話，常對自己說「我做得到」，每天想像自己成功的畫面。如果壞念頭跑出來，就用好的念頭把它換掉。正面的想法會讓我們更有自信、更有行動力。", "m": ["正向思路", [["四方法", ["掌控思想", "留意措辭", "肯定語", "視覺化"]], ["正向影響", ["自信熱情希望", "吸引想要的"]], ["消極影響", ["自我價值降低", "低能量情緒"]], ["做法", ["替換消極念頭", "梳理思緒"]]]], "f": [["發現消極念頭", "恐懼、疑慮"], ["暫停", "不讓它亂竄"], ["替換", "換成有力量的話"], ["肯定語＋視覺化", "每天練習"], ["高能量狀態", "更接近理想生活"]], "p": [{"no": "040", "n": "迷迭香滾珠瓶10ml", "pr": "NT$150", "nd": ["專注", "情緒"], "w": "迷迭香滾珠瓶提神醒腦，唸肯定語前抹一點，用香氣引導高能量狀態。"}, {"no": "028", "n": "心膚精油特價組", "pr": "NT$1200", "nd": ["情緒", "放鬆", "肌膚"], "w": "心膚精油組做視覺化練習時使用，讓身心放鬆、畫面更清楚。"}, {"no": "098", "n": "粒線寶（膠囊）", "pr": "NT$550", "nd": ["粒線體", "能量", "恢復"], "w": "粒線寶支持能量，自信、熱情需要有精神的身體當後盾。"}], "a": [{"no": 109, "n": "LINE 顯化終極完整版", "u": "https://membership-app-e2147.web.app/platform/self-discipline-action/line-manifestation-ultimate-complete.html", "cat": "能力養成／自律行動 / 自律行動", "w": "LINE 顯化終極完整版提供肯定語與視覺化練習。"}, {"no": 47, "n": "七個終極語言更新原則", "u": "https://membership-app-e2147.web.app/lifeos/seven-language-upgrade-principles.html", "cat": "英文／語言學習 / 語言", "w": "七個終極語言更新原則幫你「留意措辭」，替換消極話語。"}]}, {"id": 10, "t": "成功的秘訣答案只有一個，就是“永不放棄”", "d": "10月1日", "g": ["成功的秘訣", "成功的關鍵", "自我成長"], "b": "成功的秘訣，答案只有一個，就是“永不放棄”。一旦著手做，就要相信“一定能行”，中途不管遇到什麼困難，出現何種巨大障礙，都決不放棄，勇往直前。這種態度會帶來戰勝一切困難的力量，將我們引向巨大的成功。\n\n即使遭遇未曾預料的艱難險阻，即使已經被困難擊倒、感到絕望，也要能奮力爬起，拍拍灰塵，繼續朝著成就事業的方向，鎮定地、反覆不斷地發起努力。人必須具備這種不達目的誓不罷休的決心和永不放棄的精神。舉例說明的話，這可以說是水滴穿石般的堅決心。對於巨大且堅硬的岩石來說，一滴水根本算不了什麼，但只要水滴無休無止，最終也能洞穿岩石。帶著如此堅強的意志持續努力，不管做什麼事業，都一定能“殺出一條血路”。\n\n人的能力是無限的，讓我們用“將來進行時”看待自己的能力，持續迎接挑戰吧。\n\n人的一切行動，都產生於“願望”或者說“想法”，如果不“想”，任何事情都不可能在現實中出現。接下來，如果要讓心中描繪的“想法”變成現實，那麼這種想法就不能僅僅停留在“如果變成這樣就好了”的含混狀態。“無論如何非這樣不可！”必須從內心深處產生強烈的願望，具備不可動搖的意志，不斷思考。不是這樣的話，願望根本就不可能實現。", "c": "心靈成長", "k": "成功只有一個秘密：永不放棄。就像一滴水一直滴，最後也能把大石頭滴穿。跌倒了就爬起來拍拍灰塵繼續。心裡要有「無論如何一定要做到」的強烈願望，不是只是「如果能成功就好了」。", "m": ["永不放棄", [["態度", ["相信一定能行", "決不放棄"]], ["遇挫折", ["爬起來", "反覆努力"]], ["比喻", ["水滴穿石"]], ["能力觀", ["將來進行時", "能力無限"]], ["願望", ["強烈渴望", "非這樣不可"]]]], "f": [["強烈願望", "無論如何要做到"], ["開始行動", "相信一定能行"], ["遇到困難", "被擊倒也爬起"], ["反覆堅持", "水滴穿石"], ["成功", "殺出一條血路"]], "p": [{"no": "090", "n": "人參皂苷複方（膠囊）", "pr": "NT$560", "nd": ["體力", "循環", "適應力"], "w": "人參皂苷複方支持體力與適應力，水滴穿石般的持續努力需要續航力。"}, {"no": "039", "n": "大補王", "pr": "NT$1560", "nd": ["體力", "恢復", "免疫"], "w": "大補王支持體力與恢復，被擊倒後更快爬起來再出發。"}, {"no": "060", "n": "Q10（10:1）（膠囊）", "pr": "NT$580", "nd": ["粒線體", "能量", "心臟", "抗氧化"], "w": "Q10 支持粒線體能量，讓長期堅持有穩定的能量來源。"}], "a": [{"no": 37, "n": "自律模型 60 項", "u": "https://membership-app-e2147.web.app/platform/self-discipline-action/self-discipline-model-60-bilingual.html", "cat": "英文／語言學習 / 自律行動", "w": "自律模型 60 項把「永不放棄」變成每天可執行的習慣。"}, {"no": 107, "n": "高主動性 OS", "u": "https://membership-app-e2147.web.app/platform/ability-building/high-agency-os-complete.html", "cat": "能力養成／自律行動 / 能力養成", "w": "高主動性 OS 培養「無論如何非這樣不可」的主動行動力。"}]}, {"id": 11, "t": "關於胰島素地抵抗，這篇筆記講的清清楚楚！", "d": "9月28日", "g": ["糖尿病", "胰島素抵抗"], "b": "①血糖有點像吸血鬼，需要受到邀請才會進入細胞。而“邀請函”就是胰島素，它是開啟肌細胞大門的鑰匙，讓葡萄糖可以進去。當胰島素附著在細胞的胰島素受體上時，就會活化一組酶，護送葡萄糖進入。假如沒有胰島素，血糖只能從血液中伸出手敲打細胞大門，卻不得其門而入。於是，血糖值會升高，然後在這個過程中破壞重要器官。\n\n②在Ⅰ型糖尿病中，由於胰島素的Ｂ細胞被破壞，因此只有少量的胰島素能讓血糖進入細胞中。\n而在Ⅱ型糖尿病中，胰島素的產量不成問題。鑰匙已具備，但有東西堵住了鎖孔。這就是所謂的胰島素抵抗，肌細胞對胰島素產生了抗拒性。\n\n③那麼，究竟是什麼堵住了肌細胞的“門鎖”，不讓胰島素開啟門放葡萄糖進去呢？答案就是脂肪。更確切地說，是細胞內脂肪，即肌細胞內的脂肪。\n\n④在血液中的脂肪，無論是自身所儲存的還是源於飲食的餓，都能在肌細胞裡堆積，並會產生有毒物質和自由基，阻斷胰島素訊號傳導的過程。如此一來，不論製造了多少胰島素，被脂肪損害的肌細胞都不能有效地限使用它。", "c": "控糖健康", "k": "血糖要進到細胞裡當能量，需要「胰島素」這把鑰匙開門。第一型糖尿病是鑰匙太少；第二型是鑰匙夠，但門鎖被「肌肉細胞裡的脂肪」堵住了，這叫胰島素阻抗。血糖進不去，就一直留在血液裡傷害身體。", "m": ["胰島素阻抗", [["胰島素", ["開門的鑰匙", "讓葡萄糖進細胞"]], ["Ⅰ型", ["B細胞被破壞", "鑰匙太少"]], ["Ⅱ型", ["鑰匙夠", "鎖孔被堵"]], ["元凶", ["肌細胞內脂肪", "自由基阻斷訊號"]]]], "f": [["吃進脂肪", "堆積在肌細胞"], ["產生毒素自由基", "阻斷訊號"], ["門鎖被堵", "胰島素失效"], ["血糖進不去", "血糖升高"], ["器官受損", "糖尿病風險"]], "p": [{"no": "010", "n": "甘速淨（代謝之王）", "pr": "NT$1500", "nd": ["代謝", "血糖", "肝臟"], "w": "甘速淨定位於代謝與血糖節點，搭配少油飲食，支持血糖的日常管理。"}, {"no": "084", "n": "黃連素／小蘗鹼（膠囊）", "pr": "NT$560", "nd": ["血糖", "腸道", "代謝"], "w": "黃連素（小蘗鹼）常用於血糖與代謝保養，支持胰島素訊號的正常運作。"}, {"no": "083", "n": "苦瓜皂甘複方", "pr": "NT$540", "nd": ["血糖", "代謝", "胰島"], "w": "苦瓜皂甘複方聚焦血糖與胰島節點，作為飲食調整之外的補充選項。"}], "a": [{"no": 91, "n": "代謝控制儀表板", "u": "https://membership-app-e2147.web.app/platform/health-medicine/metabolic-control-dashboard.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "代謝控制儀表板追蹤血糖與飲食，看見「門鎖」是否變順。"}, {"no": 71, "n": "功能健康系統", "u": "https://membership-app-e2147.web.app/lifeos/functional-health-system.html", "cat": "醫學生／醫學健康 / 健康", "w": "功能健康系統從身體訊號理解胰島素阻抗。"}]}, {"id": 12, "t": "關於腸道菌群這篇筆記很受益！！必讀篇！！", "d": "9月27日", "g": ["醫療知識howto", "腸道菌群✅", "腸道菌群"], "b": "我們的腸道有兩類細菌：有益菌和有害菌。有益菌以膳食纖維為食物；有害菌以動物蛋白和脂肪為食物。\n\n腸道有害菌在分解肉、魚、蛋、奶中的動物蛋白時，會生成某些有害物質，如硫化氫。這個過程叫腐敗。後者引起腸壁的通透性增加，即腸漏。腸漏導致腸內細菌產生的毒素（內毒素）進入血液，順著血管流向全身，誘發系統性炎症。因此，降低系統性炎症水平需要避免動物性食物。\n\n相反，食物中的膳食纖維被腸道的有益菌發酵，產生短鏈脂肪酸，包括乙酸、丙酸和丁酸。短鏈脂肪酸進入血液，透過誘導調節性Ｔ細胞（一種免疫抑制細胞），可以降低系統性炎症的水平。研究發現，短鏈脂肪酸可以顯著改善過敏性肺炎的炎症和免疫指標。\n\n除了短鏈脂肪酸，膳食纖維發酵時還會產生維生素。研究發現，維生素也可以顯著降低血液炎症CRPA.\n\n動物性食物不含膳食纖維，卻含有促進有害菌的動物蛋白及飽和脂肪酸。所以，要減輕呼吸道炎症，飲食上不要給腸道有害菌提供食物，即肉、魚、蛋、奶等，從而停止腸漏。\n\n膳食纖維只存在於植物中。要多攝入高膳食纖維的食物：蔬菜、水果、豆類和全穀物類，保證腸道的益生菌有足夠的發酵原料。\n\n總結：很多姐妹可能不知道，我們的身體裡其實住著數萬億個微生物，它們共同構建了我們強大的“第二大腦”。最近的研究表明，調整飲食結構能顯著改善腸道的微生態平衡。比如增加膳食纖維攝入，多吃粗糧、菌菇類食物，就像是給土壤施肥一樣，能讓益生菌大量繁殖。同時要避免過多食用高糖和高脂的加工食品，這些垃圾食材會讓有害菌群瘋長，引發腹脹便秘等問題。試著每天堅持喝一杯原味酸奶或者吃一個蘋果你會發現整個人氣色都變好了，那種由內而外的輕盈感真的很難形容！想要擁有好狀態，一定要從呵護自己的小腸胃開始做起哦。", "c": "腸道健康", "k": "肚子裡住著好菌和壞菌。好菌愛吃蔬菜水果的纖維，會做出「短鏈脂肪酸」幫身體消炎；壞菌愛吃肉和油，會做出臭臭的有害物質，讓腸子破洞（腸漏）、毒素跑進血液。所以要多吃蔬菜、豆子、水果、全穀，餵飽好菌。", "m": ["腸道菌群", [["有益菌", ["吃膳食纖維", "產短鏈脂肪酸", "降低發炎"]], ["有害菌", ["吃動物蛋白脂肪", "產硫化氫", "造成腸漏"]], ["腸漏後果", ["內毒素入血", "全身發炎"]], ["怎麼吃", ["蔬菜水果", "豆類全穀", "菌菇", "少加工"]]]], "f": [["吃什麼", "纖維 vs 肉油"], ["餵哪種菌", "好菌 vs 壞菌"], ["產物", "短鏈脂肪酸 vs 有害物"], ["腸壁", "健康 vs 腸漏"], ["全身", "低發炎 vs 系統性發炎"]], "p": [{"no": "096", "n": "孢子益生菌（加亞麻仁渣）（6g×30包）", "pr": "NT$650", "nd": ["菌相", "腸道", "免疫"], "w": "孢子益生菌加亞麻仁渣：好菌加纖維一起補，正是「餵飽好菌」的組合。"}, {"no": "046", "n": "丁酸鈉複合包", "pr": "NT$890", "nd": ["腸道", "菌相", "腸黏膜", "免疫"], "w": "丁酸鈉複合包直接補充短鏈脂肪酸（丁酸），支持腸黏膜與正常發炎調節。"}, {"no": "033", "n": "亞麻仁籽渣（2包）", "pr": "NT$198", "nd": ["腸道", "膳食纖維"], "w": "亞麻仁籽渣提供膳食纖維，是好菌發酵產生短鏈脂肪酸的原料。"}], "a": [{"no": 69, "n": "身體訊號系統", "u": "https://membership-app-e2147.web.app/lifeos/body-signals.html", "cat": "醫學生／醫學健康 / 健康", "w": "身體訊號系統幫你把腹脹、便秘連回腸道菌相。"}, {"no": 67, "n": "健康負熵 APP", "u": "https://membership-app-e2147.web.app/lifeos/health-negentropy-app.html", "cat": "醫學生／醫學健康 / 健康", "w": "健康負熵 APP 建立日常飲食與修復策略。"}]}, {"id": 13, "t": "酒精與乳腺癌的關係！這篇筆記請收藏！！！", "d": "Sep 26", "g": ["酒精對人體的危害", "乳腺癌", "知識科普"], "b": "2010年世界衛生組織在評估癌症風險時，將酒精正式升級為確定導致人類乳腺癌的致癌物質。而在2014年，世界衛生組織更進一步澄清了自己的立場，指出對乳腺癌而言，任何分量的酒精都不是安全的。\n\n研究人員發現，即使是每天最多喝1杯酒的女性，患乳腺癌的風險，仍然是是有小幅但具有統計意義的增加趨勢。\n\n致癌物質並非酒精本身，罪魁禍首其實是一種乙醛的酒精性分解產物；當你喝了一小口酒之後，它幾乎立刻就在你的嘴巴形成了。試驗證明，即使將一茶匙烈酒只含在嘴裡5秒鐘就吐出來，所產生的乙醛也具有潛在的致癌程度，並會逗留超過10分鐘。\n\n如果連小口酒，都可能在嘴裡產生致癌的乙醛量，那麼使用含有酒精的漱口水會怎樣？研究人員測試了市面上各種品牌的漱口水喝口腔清潔液，得出的結論是：雖然風險很輕微，但最好還是不要使用含有酒精的產品。", "c": "乳腺健康", "k": "世界衛生組織說，喝酒會增加乳癌風險，而且沒有「安全的量」。真正的壞蛋是酒精分解後變成的「乙醛」，酒一進嘴巴就會產生。連含酒精的漱口水也最好別用。", "m": ["酒精與乳癌", [["WHO", ["2010確定致癌", "任何量都不安全"]], ["研究", ["每天1杯也增加風險"]], ["真兇", ["乙醛", "入口即生成", "停留10分鐘"]], ["漱口水", ["避免含酒精"]]]], "f": [["喝一口酒", "酒精入口"], ["口中分解", "形成乙醛"], ["乙醛停留", "超過10分鐘"], ["致癌風險", "乳癌風險上升"], ["行動", "戒酒、換無酒精漱口水"]], "p": [{"no": "029", "n": "口腔淨化養護精油組", "pr": "NT$1200", "nd": ["口腔", "牙齦"], "w": "口腔淨化養護精油組取代含酒精漱口水，維持口腔清潔又避免乙醛。"}, {"no": "004", "n": "益生菌牙膏", "pr": "NT$79", "nd": ["口腔菌相"], "w": "益生菌牙膏維持口腔菌相平衡，減少依賴酒精型產品。"}, {"no": "082", "n": "牙間刷（一盒）", "pr": "NT$140", "nd": ["口腔", "牙周"], "w": "牙間刷清潔牙縫，機械清潔比含酒精漱口水更安心。"}], "a": [{"no": 86, "n": "癌症理解 APP", "u": "https://membership-app-e2147.web.app/lifeos/cancer-understanding-app.html", "cat": "醫學生／醫學健康 / 醫療", "w": "癌症理解 APP 幫你理解酒精、乙醛與乳癌風險的關係。"}, {"no": 92, "n": "醫療證據購物 OS", "u": "https://membership-app-e2147.web.app/platform/health-medicine/medical-evidence-shopping-os.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "醫療證據購物 OS 教你看成分，挑出不含酒精的口腔產品。"}]}, {"id": 14, "t": "要不要活在別人的期待中，讀完瞬間清醒！！", "d": "9月11日", "g": ["堅持讀書打卡", "讀書與思考", "內耗", "自我成長"], "b": "其實，“我們並不是為了滿足別人的期待而活著”。我們沒有必要去滿足別人期望。\n\n在猶太教義中有這麼一句話：“倘若自己都不為自己活出自己的人生，那還有誰會為自己而活呢？”你就活在自己的人生中。要說為誰活著，那當然為你自己。假如你不為自己而活的話，那誰會為你而活呢？我們最終還是為自己活著。沒理由不可以這樣想。\n\n如果一味尋求別人的認可、在意別人的評價，那最終就會活在別人的人生中。\n\n過於希望得到別人的認可，就會按照別人的期待去生活。也就是捨棄真正的自我，活在別人的人生之中。\n\n而且，請你記住，假如說你“不是為了滿足他人的期待而活”，那他人也“不是為了滿足你的期待而活”。當別人的行為不符合自己想法的時候也不可以發怒。這也是理所當然的事情。", "c": "心靈成長", "k": "《被討厭的勇氣》說：我們不是為了滿足別人的期待而活。如果一直想讓別人稱讚，就會活成別人想要的樣子，忘了自己。同樣地，別人也不是為了滿足你而活，所以別人不照你的想法做時，也不要生氣。", "m": ["不活在別人期待中", [["核心", ["為自己而活", "不必滿足他人"]], ["危險", ["尋求認可", "活在別人人生"]], ["反過來", ["別人也不為你而活", "不必發怒"]]]], "f": [["想被認可", "在意評價"], ["察覺", "我在照別人的期待活？"], ["課題分離", "我的人生我負責"], ["尊重他人", "別人也有自己的人生"], ["自由", "活出真正的自我"]], "p": [{"no": "028", "n": "心膚精油特價組", "pr": "NT$1200", "nd": ["情緒", "放鬆", "肌膚"], "w": "心膚精油組營造獨處時光，聽見自己內心真正的聲音。"}, {"no": "054", "n": "GABA（膠囊）", "pr": "NT$540", "nd": ["睡眠", "情緒", "放鬆"], "w": "GABA 支持放鬆，減少在意他人評價帶來的焦慮緊繃。"}], "a": [{"no": 99, "n": "倫理關係 OS", "u": "https://membership-app-e2147.web.app/lifeos/ethical-relationship-os.html", "cat": "關係／婚姻／溝通 / 關係", "w": "倫理關係 OS 從界線與責任理解「課題分離」。"}, {"no": 11, "n": "批評轉能力雙語版", "u": "https://membership-app-e2147.web.app/lifeos/criticism-to-ability-bilingual.html", "cat": "英文／語言學習 / 能力", "w": "批評轉能力雙語版把別人的評價轉成能力線索，而不是被它綁住。"}]}, {"id": 15, "t": "我們吃了太多的果糖，而身體不需要！必讀篇！", "d": "8月24日", "g": ["果糖", "糖類", "碳水化合物"], "b": "以下內容來自書籍《控糖革命》的內容\n①水果中含有果糖和蔗糖：\n水果一開始嚐起來就是甜的。這是因為水果已經含有一些沒有被連線起來的甜甜的葡萄糖分子。另外，水果中還含有果糖，果糖比葡萄糖更甜。水果中還有蔗糖——葡萄糖和果糖的組合糖，蔗糖雖然沒有果糖甜，但是比葡萄糖要稍微甜一些。\n\n②蔗糖只需要極短的時間可分解為葡萄糖和蔗糖：\n水果中的葡萄糖可以被身體直接吸收利用，不需要再次分解。蔗糖確實需要被分解，有一種酶可以將蔗糖分解為葡萄糖和果糖，但是所需要的時間極短，只要１納秒（十億分之一秒）。\n\n③我們的身體不需要果糖，但是我們吃了太多的果糖：\n我們吃下果糖後，其中一部分會在小腸被再次轉化成葡萄糖。另一部分則繼續以果糖的形式存在。果糖和葡萄糖都能都透過腸壁細胞進入我們的血液。葡萄糖是我們身體所需要的燃料，旦果糖不是。現在的狀況是，我們吃了很多不必要的果糖，因為我們吃了太多的蔗糖（一份蔗糖中的一半是葡萄糖，一半是果糖）。\n\n④碳水化合物家族：\n在碳水化合物家族（包括澱粉、纖維、葡萄糖、果糖和蔗糖）中，科學家將其中最小的分子——葡萄糖、果糖和蔗糖，組成了一個亞組。我們稱這個亞組為糖類。", "c": "控糖健康", "k": "水果甜甜的，因為有葡萄糖、果糖和蔗糖。蔗糖（就是砂糖）一半是葡萄糖、一半是果糖。身體需要葡萄糖當燃料，但其實不需要果糖。我們吃太多砂糖，就吃進太多不需要的果糖。", "m": ["果糖", [["水果含", ["葡萄糖", "果糖", "蔗糖"]], ["蔗糖", ["極快分解", "一半葡萄糖一半果糖"]], ["身體需要", ["葡萄糖=燃料", "果糖≠必需"]], ["糖類家族", ["澱粉", "纖維", "葡萄糖果糖蔗糖"]]]], "f": [["吃砂糖/甜食", "蔗糖"], ["1納秒分解", "葡萄糖＋果糖"], ["進入血液", "兩者都吸收"], ["果糖過量", "身體用不到"], ["行動", "減少添加糖"]], "p": [{"no": "010", "n": "甘速淨（代謝之王）", "pr": "NT$1500", "nd": ["代謝", "血糖", "肝臟"], "w": "甘速淨支持代謝與肝臟節點，果糖主要在肝臟代謝，減糖之外多一層保養。"}, {"no": "077", "n": "肝寶（膠囊）", "pr": "NT$550", "nd": ["肝臟", "解毒", "代謝"], "w": "肝寶聚焦肝臟與代謝節點，照顧處理果糖的主要器官。"}, {"no": "033", "n": "亞麻仁籽渣（2包）", "pr": "NT$198", "nd": ["腸道", "膳食纖維"], "w": "亞麻仁籽渣補纖維，讓吃水果時的糖吸收更平緩。"}], "a": [{"no": 91, "n": "代謝控制儀表板", "u": "https://membership-app-e2147.web.app/platform/health-medicine/metabolic-control-dashboard.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "代謝控制儀表板記錄每日糖攝取，看見減糖成效。"}, {"no": 77, "n": "節律營養系統", "u": "https://membership-app-e2147.web.app/lifeos/rhythm-nutrients.html", "cat": "醫學生／醫學健康 / 健康", "w": "節律營養系統教你什麼時候吃、怎麼吃最平穩。"}]}, {"id": 16, "t": "控糖　正確的飲食順序能控糖！背下來必讀篇", "d": "Aug 22", "g": ["血糖", "控糖", "健康howto"], "b": "①正確的飲食順序是什麼呢？\n那就是，先吃纖維，然後吃蛋白質和脂肪，最後吃澱粉和糖類。\n\n②胃排空過程：\n我們吃的所有食物都會進入胃，然後流入小腸。食物會在管道中被分解並吸收到血液中。平均每分鐘，大約有熱量為3kcal（1cal≈4.2J）的食物進從胃進入小腸中。我們將這個過程稱為胃排空。如果我們先吃澱粉或者糖類食物，這些食物很快進入我們的小腸。\n\n③碳水化合物慢慢的吃：\n在小腸中，食物被分解成葡萄糖分子，然後迅速進入血液。這回造成血糖水平快速升高。我們吃的碳水化合物越多，吃得越快，就會出現越大的葡萄糖負載，從而導致越高的葡萄糖峰值。\n\n④義大利麵的正確順序吃法：\n假如餐盤上既有義大利門面，又有蔬菜（如西蘭花），而我們先吃的是義大利麵，然後才吃西蘭花。因為義大利麵是澱粉類食物，所以會被快速消化，迅速地轉化為葡萄糖。西蘭花則會待在義大利麵上放，等待進入小腸。\n如果我們下吃的是西蘭花，然後吃義大利麵，那麼接下來就會發生大為不同的情況。西蘭花是一種蔬菜，含有豐富的纖維。我們知道，纖維不會被我們消化系統分解為葡萄糖。纖維從胃進入小腸，再到被排除，過程十分緩慢，而且形態不變。但是，纖維的好處還不僅僅是這些，它還擁有三種超級能力\n\n⑤纖維的三種超級能力：\na、纖維會減弱α-澱粉酶的作用，這種酶能夠將澱粉轉化為葡萄糖分子。\nb、纖維能夠減緩胃的排空速度：當有纖維存在時，食物從胃進入小腸的速度會更慢。\nc、纖維會在小腸內創造一個粘性的網狀結構，而這種網狀結構會使葡萄糖吸進入血液的速度變慢。", "c": "控糖健康", "k": "吃飯有順序：先吃菜（纖維），再吃肉蛋豆（蛋白質和油脂），最後吃飯麵（澱粉和糖）。因為纖維會先在肚子裡做一張「黏黏的網」，讓糖慢慢被吸收，血糖就不會一下衝很高。", "m": ["飲食順序控糖", [["順序", ["纖維", "蛋白質脂肪", "澱粉糖"]], ["胃排空", ["每分鐘約3kcal", "先吃澱粉衝很快"]], ["纖維超能力", ["減弱澱粉酶", "減緩胃排空", "黏性網狀結構"]], ["例子", ["先花椰菜再義大利麵"]]]], "f": [["第1口", "蔬菜纖維"], ["第2口", "肉蛋豆魚"], ["第3口", "飯麵澱粉"], ["纖維織網", "糖慢慢吸收"], ["血糖平穩", "峰值變小"]], "p": [{"no": "033", "n": "亞麻仁籽渣（2包）", "pr": "NT$198", "nd": ["腸道", "膳食纖維"], "w": "亞麻仁籽渣在餐前補纖維，幫忙在腸道建立「黏性網」，延緩糖吸收。"}, {"no": "035", "n": "全酶", "pr": "NT$880", "nd": ["消化", "吸收"], "w": "全酶支持消化與吸收，配合「先菜、後肉、再澱粉」讓消化更順。"}, {"no": "084", "n": "黃連素／小蘗鹼（膠囊）", "pr": "NT$560", "nd": ["血糖", "腸道", "代謝"], "w": "黃連素支持血糖代謝，作為飲食順序之外的輔助。"}], "a": [{"no": 77, "n": "節律營養系統", "u": "https://membership-app-e2147.web.app/lifeos/rhythm-nutrients.html", "cat": "醫學生／醫學健康 / 健康", "w": "節律營養系統把飲食順序變成每餐都做得到的流程。"}, {"no": 91, "n": "代謝控制儀表板", "u": "https://membership-app-e2147.web.app/platform/health-medicine/metabolic-control-dashboard.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "代謝控制儀表板記錄餐後血糖，驗證順序的效果。"}]}, {"id": 17, "t": "蔬菜太重要了！蔬菜太重要了！蔬菜太重了！", "d": "8月21日", "g": ["纖維", "蔬菜", "血糖", "控糖", "健康管理howto"], "b": "纖維食用量推薦，每天25克。美國政府將纖維稱為“與公眾健康密切相關的營養素”。\n纖維掛廣泛存在於植物中，葉子和樹皮中的含量尤其豐富。\n\n纖維對我們的身體起著至關重要的作用：為腸道中的有益菌提供能量，豐富腸道菌群，降低膽固醇水平，確保一切生裡活動順利進行。富含水果和蔬菜的飲食被認為是健康飲食的原因之一，就是這種飲食提供了豐富的纖維。\n\n豆類、綠葉蔬菜和水果是纖維的主要來源。我們需要多吃這類食物，它們可以維持我們的血糖曲線平穩。\n\n纖維對我們的血糖有多種好處，特別是它能夠在我們的腸道中建立一個“粘性網格”。這個網格會減緩腸道內壁吸收食物分子的速度並減少被吸收的食物分子。這對我們的血糖曲線意味著什麼呢？首先，吸收熱量會更少；其次，因為纖維的存在，吸收的葡萄糖分子和果糖分子也都減少了。\n\n獲取纖維的最佳方式是什麼呢？答案是綠色蔬菜。綠色蔬菜含有大量的纖維，並且只含有少量澱粉。\n\n我們應該吃多少蔬菜？首先，吃蔬菜比不吃蔬菜要好；其次，蔬菜吃得越多，對身體越好。目前還沒有關於蔬菜的最佳攝入量的科學定論。\n\n我們可以選擇任何一種蔬菜作為開胃菜，包括胡羅卜等非綠色蔬菜。我們也可以子啊蔬菜中新增一些豆類食品，如鷹嘴豆或小扁豆等，它們也富含纖維。", "c": "控糖健康", "k": "每天建議吃25克纖維。纖維是好菌的食物，可以降膽固醇，還能在腸子裡做「黏黏的網」，讓吸收的熱量和糖變少。綠色蔬菜最棒，纖維多澱粉少。吃菜比不吃好，吃越多越好！", "m": ["蔬菜與纖維", [["建議量", ["每天25克"]], ["好處", ["餵好菌", "降膽固醇", "血糖平穩"]], ["黏性網格", ["吸收熱量少", "糖分子少"]], ["來源", ["綠葉菜", "豆類", "水果"]], ["開胃菜", ["任何蔬菜", "加鷹嘴豆扁豆"]]]], "f": [["餐前蔬菜", "開胃菜"], ["纖維入腸", "建立黏性網格"], ["減緩吸收", "熱量糖分少"], ["餵養好菌", "菌相豐富"], ["健康", "血糖膽固醇穩定"]], "p": [{"no": "033", "n": "亞麻仁籽渣（2包）", "pr": "NT$198", "nd": ["腸道", "膳食纖維"], "w": "亞麻仁籽渣是方便的纖維來源，幫助達到每天 25 克纖維。"}, {"no": "070", "n": "辣木粉", "pr": "NT$450", "nd": ["植物營養", "抗氧化", "代謝"], "w": "辣木粉提供植物營養與植化素，蔬菜吃不夠時的綠色補充。"}, {"no": "096", "n": "孢子益生菌（加亞麻仁渣）（6g×30包）", "pr": "NT$650", "nd": ["菌相", "腸道", "免疫"], "w": "孢子益生菌加亞麻仁渣，纖維加好菌，豐富腸道菌叢。"}], "a": [{"no": 67, "n": "健康負熵 APP", "u": "https://membership-app-e2147.web.app/lifeos/health-negentropy-app.html", "cat": "醫學生／醫學健康 / 健康", "w": "健康負熵 APP 規劃每日蔬菜與纖維攝取。"}, {"no": 71, "n": "功能健康系統", "u": "https://membership-app-e2147.web.app/lifeos/functional-health-system.html", "cat": "醫學生／醫學健康 / 健康", "w": "功能健康系統理解纖維如何影響血糖與膽固醇。"}]}, {"id": 18, "t": "心臟病與血糖的關係！讀書真好！又學到了！", "d": "8月14日", "g": ["堅持讀書打卡", "血糖", "心臟病", "膽固醇"], "b": "１、當我們討論心臟病時，膽固醇往往是核心的話題，然而這種觀點正在被改變。事實上，心臟病患者中過半數的人膽固醇水平是正常的。最新研究發現，引起心臟病的是一種名為β型低密度脂蛋白的特殊型別的膽固醇，而非籠統的“膽固醇過高”問題。科學家還發現它與葡萄糖、果糖胰島素有關。\n\n２、血管的內壁是由細胞組成的。這些細胞很容易線上粒體的壓力下受傷，並在葡萄糖以及果糖峰值下發生氧化應激，繼而失去其光滑的表現，導致血管內壁變得凹凸不平。脂肪顆粒因此更容易黏附在血管內壁上面。而心臟病就始於斑塊在血管內壁積累。\n\n３、①當我們體內的胰島素水平過高時，內臟就開始產生β型低密度脂蛋白。這是一種小而密集的膽固醇，可以沿著血管內壁爬行，很容易黏附在血管壁上。\n②若我們體內葡萄糖、果糖和胰島素的含量過高，該型別膽固醇就會被氧化，然後沉積到我們的血管壁上。斑塊開始形成並阻礙血液流動，這就心臟病的起因。葡萄糖峰值會促進這三個過程的進行。這就解釋為什麼科學家發現儘管我們的空腹血糖時正常的，但是每出現一次葡萄糖峰值，我們就死於心臟病的風險增加一些。為了保護心臟，我們應該使葡萄糖、果糖和胰島素曲線平穩化。\n\n４、①甘油三酯在我們體內會轉變為β型低密度脂蛋白，透過測量甘油三酯的含量能夠測體內β型低密度脂蛋白的含量。將甘油三酯的含量，得到的比率在預測密度脂蛋白的含量方面相當準確。通常，該比率小於2是比較理想的。如果該比率大於2，說明身體可能出現了問題。\n②同時，因為炎症是心臟病的一個關鍵因素，所以測量c-反應蛋白的含量比測量膽固醇的含量能夠更好地判斷心臟病的發生可能性。", "c": "心血管健康", "k": "心臟病不只是膽固醇高的問題。血糖和果糖一下衝很高，會讓血管內壁變粗糙；胰島素太高時，身體會做出「小而密」的壞膽固醇，很容易黏在血管上形成斑塊，堵住血流。所以讓血糖平穩就是保護心臟。", "m": ["心臟病與血糖", [["新觀點", ["過半患者膽固醇正常", "β型小而密LDL"]], ["血管內壁", ["糖峰值→氧化", "變凹凸不平"]], ["三過程", ["胰島素高產生LDL", "糖使LDL氧化", "沉積成斑塊"]], ["檢測", ["三酸甘油酯/HDL<2", "C反應蛋白"]]]], "f": [["糖果糖峰值", "胰島素過高"], ["血管受傷", "內壁變粗糙"], ["小而密LDL", "被氧化"], ["斑塊沉積", "血流受阻"], ["預防", "平穩血糖曲線"]], "p": [{"no": "002", "n": "EPA+DHA複方粉包", "pr": "NT$1350", "nd": ["腦神經", "心血管", "抗發炎"], "w": "EPA+DHA 支持血脂與心血管健康，有助維持三酸甘油酯在正常範圍。"}, {"no": "060", "n": "Q10（10:1）（膠囊）", "pr": "NT$580", "nd": ["粒線體", "能量", "心臟", "抗氧化"], "w": "Q10 支持粒線體與心臟能量，血管內壁細胞也需要它對抗氧化壓力。"}, {"no": "052", "n": "血循環", "pr": "NT$1350", "nd": ["循環", "心血管", "末梢循環"], "w": "血循環聚焦心血管與末梢循環節點，支持血液流動。"}], "a": [{"no": 91, "n": "代謝控制儀表板", "u": "https://membership-app-e2147.web.app/platform/health-medicine/metabolic-control-dashboard.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "代謝控制儀表板追蹤血糖曲線，減少傷血管的峰值。"}, {"no": 72, "n": "健康診斷系統", "u": "https://membership-app-e2147.web.app/lifeos/health-diagnosis.html", "cat": "醫學生／醫學健康 / 健康", "w": "健康診斷系統幫你看懂三酸甘油酯/HDL 比值與 CRP。"}]}, {"id": 19, "t": "血糖與睡眠的關係！控糖真的太太太重要了！", "d": "8月11日", "g": ["血糖", "控糖", "睡眠"], "b": "①血糖失調的一個常見症狀是半夜突然驚醒，心臟怦怦直跳。通常情況下，這是血糖水平在半夜急劇下降導致的結果。絕經後的女性容易失眠和部分男性睡眠呼吸暫停也與他們喜歡在血糖處於高水平時，或剛經歷葡萄糖峰值後立刻就寢有關。如果我們晚上想睡個好覺，那麼就要讓我們的血糖曲線平穩化。\n\n②偏頭疼是一種虛弱行疾病。有資料證明，患有胰島素抵抗綜合徵的女性偏頭疼患病率是未患此病的女性的２倍。患者的胰島素水平降低後，偏頭疼的情況就會好轉。\n\n③事實證明，過高的葡萄糖峰值會影響大腦的記憶力與認知功能。\n\n④持續的飢餓感：\n第一，我們很多人都會在剛吃過飯後就感到飢餓，這同樣與葡萄糖有關。將含有相同的熱量，但種類不同的兩餐進行比較，我們會發現，如果該餐引起的葡萄糖峰值比較小，那麼這一餐會讓我們有更長時間的飽腹感。所以，熱量並非全部的問題問題所在。\n第二，持續飢餓感是胰島素水平較高的一種表現。如果葡萄糖峰值頻繁出現，我們體內會產生大量的胰島素混合在其他激素中。瘦素，是一種告訴我們“我們飽了，應該不用吃飯了”的激素。胰島素水平過高會導致瘦素的訊號被阻斷。而胃促生長素，這種告訴我們“我們還很餓”的激素就會取而代之。儘管有脂肪儲備，有大量可用能量，身體依然會告訴我們還需要更多了。所以我們就會想要再吃東西。\n而我們吃東西后，更多的葡萄糖峰值就會隨之出現，身體會分泌更多的胰島素來將過量的葡萄糖轉化為脂肪儲存起來，這樣又會加強胃促生長素的作用。我們體重增加得越多，就會越感到餓。", "c": "控糖健康", "k": "半夜突然醒來心跳很快，可能是血糖半夜掉太低。血糖亂跳還會讓人偏頭痛、記憶變差，還有「剛吃飽又餓」：因為胰島素太高會把「我飽了」的訊號擋住，讓「我好餓」的訊號變強，越吃越胖越餓。", "m": ["血糖與睡眠", [["睡眠", ["半夜驚醒心悸", "血糖驟降"]], ["偏頭痛", ["胰島素阻抗者2倍"]], ["大腦", ["記憶力認知下降"]], ["飢餓感", ["瘦素被阻斷", "飢餓素增強", "越胖越餓"]]]], "f": [["高糖晚餐", "血糖峰值"], ["胰島素飆高", "阻斷瘦素"], ["半夜血糖驟降", "驚醒、心悸"], ["隔天更餓", "飢餓素作用"], ["改善", "睡前不衝血糖"]], "p": [{"no": "091", "n": "甘氨酸鎂複方粉包", "pr": "NT$1350", "nd": ["睡眠", "神經", "肌肉", "放鬆"], "w": "甘氨酸鎂支持神經放鬆與睡眠，減少半夜驚醒後難以再睡。"}, {"no": "014", "n": "健康接地枕頭套", "pr": "NT$599", "nd": ["睡眠", "恢復"], "w": "健康接地枕頭套定位睡眠與恢復節點，打造穩定的睡眠環境。"}, {"no": "054", "n": "GABA（膠囊）", "pr": "NT$540", "nd": ["睡眠", "情緒", "放鬆"], "w": "GABA 支持放鬆入睡，夜間心跳怦怦時幫助回穩。"}], "a": [{"no": 77, "n": "節律營養系統", "u": "https://membership-app-e2147.web.app/lifeos/rhythm-nutrients.html", "cat": "醫學生／醫學健康 / 健康", "w": "節律營養系統安排晚餐內容與時間，避免睡前血糖峰值。"}, {"no": 70, "n": "皮質醇系統", "u": "https://membership-app-e2147.web.app/lifeos/cortisol-system.html", "cat": "醫學生／醫學健康 / 健康", "w": "皮質醇系統理解血糖驟降引起的壓力反應。"}]}, {"id": 20, "t": "甜食升糖更傷害身體，只因藏著看不見的果糖", "d": "8月7日", "g": ["血糖", "果糖", "澱粉", "升糖", "葡萄糖峰值", "甜食"], "b": "澱粉和糖類在我們吃下之後變成葡萄糖。它們會經過胃，進入我們的小腸。在那裡，葡萄糖會透過腸道上壁細胞，進入我們的血液。從毛細血管到微小血管，再到更大剛粗的血管，葡萄糖就像透過匝道進入了高速公路。\n\n葡萄糖不只存在於血液之中。它滲透了我們身體的各個部位。\n\n為了量化葡萄糖濃度，我們使用毫克每分升作為單位，寫作mg/dL。反應的是：有多少葡萄糖在我們體內自由移動。\n\n美國糖尿病協會指出，基線濃度，即我們在早晨吃飯前的空腹血糖，在60~100mg/dL為“正常”，在100~126mg/dL為糖尿病前期，超過126mg/dL為糖尿病。\n\n美國糖尿病協會成人體血糖水平在餐後不應該超過140mg/dL。但同樣的，這是“正常情況”，而不是最優情況。針對糖尿病患者的研究給出了更準確的資訊：我們應該努力避免餐後葡萄糖水平升高超過30mg/dL.所以在本書中，“我”將葡萄糖峰值定義為餐後體內的血糖升高在30mg/dL以上。\n\n我們的血糖水平變化越小，健康狀況就會越好。\n\n吃甜食所引起的葡萄糖峰值比吃澱粉類食物（如米飯）所引起的峰值對我們的身體健康更為不利。不過，這與我們測量的血糖水平無關，而是由另一種看不見的分子造成的 。\n\n甜食中含有食用糖，或者叫蔗糖。蔗糖是一種雙糖，由葡萄糖和果糖縮合脫水形成。蔗糖分解後產生葡萄糖和果糖。澱粉類食物則不會產生果糖。所以每當我們吃了甜食並出現葡萄糖峰值的時候，都會有相應的果糖峰值出現。遺憾的是，果糖峰值我們看不到。動態血糖儀只能監測葡萄糖的濃度，無法監測果糖的濃度，並且目前還沒有研發出動態果糖檢測儀。\n\n在研發出動態果糖檢測儀之前，請大家記住，如果我們吃的的是甜食，那麼甜食在造成葡萄糖峰值的同時，也會造成看不見的果糖峰值，因此甜食導致的葡萄糖峰值對我們身體造成的傷害比澱粉類食物導致的葡萄糖峰值更大。", "c": "控糖健康", "k": "血糖正常值：空腹60~100。飯後血糖上升超過30就叫「血糖高峰」，越平穩越健康。吃甜點比吃白飯更傷身體，因為甜食裡的砂糖還藏著「看不見的果糖高峰」，血糖機量不到它。", "m": ["看不見的果糖", [["葡萄糖旅程", ["胃→小腸→血液", "像上高速公路"]], ["標準", ["空腹60-100", "前期100-126", "糖尿病>126"]], ["峰值定義", ["餐後升>30mg/dL"]], ["甜食更傷", ["蔗糖=葡萄糖+果糖", "果糖峰值量不到"]]]], "f": [["吃甜食", "含蔗糖"], ["分解", "葡萄糖＋果糖"], ["雙峰值", "可見葡萄糖+隱形果糖"], ["傷害更大", "比澱粉峰值更傷"], ["行動", "少甜食、看血糖曲線"]], "p": [{"no": "010", "n": "甘速淨（代謝之王）", "pr": "NT$1500", "nd": ["代謝", "血糖", "肝臟"], "w": "甘速淨支持代謝、血糖與肝臟節點，甜食後多一層代謝保養。"}, {"no": "083", "n": "苦瓜皂甘複方", "pr": "NT$540", "nd": ["血糖", "代謝", "胰島"], "w": "苦瓜皂甘複方聚焦血糖與胰島節點，支持平穩血糖曲線。"}, {"no": "077", "n": "肝寶（膠囊）", "pr": "NT$550", "nd": ["肝臟", "解毒", "代謝"], "w": "肝寶照顧代謝果糖的肝臟，對應「看不見的果糖峰值」。"}], "a": [{"no": 91, "n": "代謝控制儀表板", "u": "https://membership-app-e2147.web.app/platform/health-medicine/metabolic-control-dashboard.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "代謝控制儀表板看見每餐葡萄糖峰值是否超過 30 mg/dL。"}, {"no": 69, "n": "身體訊號系統", "u": "https://membership-app-e2147.web.app/lifeos/body-signals.html", "cat": "醫學生／醫學健康 / 健康", "w": "身體訊號系統讀懂甜食後的疲倦、嘴饞等訊號。"}]}, {"id": 21, "t": "關於控糖這本書寫的太棒了！！控糖很重要！", "d": "8月6日", "g": ["控糖", "纖維", "蔗糖", "健康養生"], "b": "在超市貨架上的絕大多數產品的主要成分都是澱粉和糖類。從白麵包到冰激凌、糖果、果汁，再到甜甜的酸奶，纖維無處可尋。而所有這一切都是人類有意為之：在食品加工製作過程中，纖維通常會被除去，因為纖維的存在使長時間儲存食物成為難題。\n\n食物在加工過程中，其中的纖維通常會被去除，這樣，食物就可以被冷凍、解凍，即使在貨架上存放多年也會保持原有的口感。以白麵粉為例，纖維存在於小麥胚芽和麩皮（小麥外皮）中，因此在麵粉生產過程中，小麥表皮常會被去掉。\n\n為了使食品成為超市中受歡迎的品類，人們還對食品做了一些其他的處理——增加食品的甜度。食品加工的基礎流程是，首先去掉纖維，然後再將澱粉和糖進行濃縮。\n\n人類透過煮沸甘蔗並使其汁液結晶，創造出了食用糖——百分之百蔗糖。這款新產品在18世紀風靡世界。\n\n和之前相比，食物中糖的濃度越來越高，攝取也越來越方便。我們可以把番茄加工成番茄醬，且番茄醬中的糖分更高。\n\n我們從史前時代食用應季的、富含纖維的水果，到19世紀吃極少的蔗糖，再到今天每年消費超過20kg的蔗糖。我們吃的糖越來越多，因為我們的大腦很難抑制對水果味道的渴望。甜味和多巴胺讓人覺得一切都是值得的。\n\n在某些情況下，更多也不一定就會更好。給一株植物澆的太多的水，植物會被淹死；給人提供太多的氧氣，人也會因醉氧而暈倒。同樣，適量的葡萄糖對我們來說剛剛好：讓我們感覺很棒、蹦蹦跳跳、去工作、和他人一起玩、去生活、去感受歡笑和愛。但是，我們也可能攝入過多的葡萄糖，而太多的葡萄糖會傷害我們。可惜我們在大多數時候都意識不到這一點。", "c": "控糖健康", "k": "超市大部分食物都把纖維拿掉了，因為有纖維不好保存；又加很多糖讓它更好吃。以前人吃當季水果，現在一年吃超過20公斤的糖！葡萄糖剛好就好，太多就像給植物澆太多水，會把身體「淹壞」。", "m": ["加工食品與糖", [["超市真相", ["主成分澱粉糖", "纖維被去除"]], ["原因", ["方便儲存", "增加甜度"]], ["歷史", ["史前應季水果", "18世紀砂糖", "每年20kg"]], ["適量", ["剛好最好", "過量傷身"]]]], "f": [["原型食物", "含纖維"], ["加工", "去纖維、濃縮糖"], ["超市商品", "好吃耐放"], ["過量攝取", "每年20kg糖"], ["回歸", "多吃原型食物"]], "p": [{"no": "033", "n": "亞麻仁籽渣（2包）", "pr": "NT$198", "nd": ["腸道", "膳食纖維"], "w": "亞麻仁籽渣把被加工拿掉的纖維補回來。"}, {"no": "070", "n": "辣木粉", "pr": "NT$450", "nd": ["植物營養", "抗氧化", "代謝"], "w": "辣木粉是原型植物營養，對比去纖維、加糖的超市加工品。"}, {"no": "096", "n": "孢子益生菌（加亞麻仁渣）（6g×30包）", "pr": "NT$650", "nd": ["菌相", "腸道", "免疫"], "w": "孢子益生菌加纖維，修復加工食品造成的菌相失衡。"}], "a": [{"no": 92, "n": "醫療證據購物 OS", "u": "https://membership-app-e2147.web.app/platform/health-medicine/medical-evidence-shopping-os.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "醫療證據購物 OS 教你看標示，避開隱藏糖與去纖維食品。"}, {"no": 67, "n": "健康負熵 APP", "u": "https://membership-app-e2147.web.app/lifeos/health-negentropy-app.html", "cat": "醫學生／醫學健康 / 健康", "w": "健康負熵 APP 協助回歸原型食物的日常飲食。"}]}, {"id": 22, "t": "控糖，這本書寫的很棒！我們吃了太多的糖！", "d": "8月5日", "g": ["控糖", "葡萄糖", "健康飲食", "糖"], "b": "碳水化合物=澱粉+纖維+糖類（葡萄糖、果糖、蔗糖）\n①澱粉：\n大多數麵包都是由麵粉製成的，而麵粉由小麥粒研磨而成。我們都知道，小麥粒裡面含有很多澱粉。任何由麵粉製成的食物都含有澱粉。我們進食時，會使用和植物一樣的α-澱粉酶，來把澱粉分解成葡萄糖。\n\n澱粉在體內轉化為葡萄糖的速度非常快。這個過程通常發生在腸道，所以我們很少注意到它。α-澱粉酶將澱粉分解，葡萄糖分子被釋放出來。然後，這些葡萄糖分子又像下課的孩子們一樣在操場上瘋跑。\n\n②水果：\n水果一開始嚐起來就是甜的。這是因為水果已經含有一些沒有被連線起來的甜甜的葡萄糖分子。另外，水果中含有果糖，果糖比葡萄糖更甜。水果中含有蔗糖———葡萄糖和果糖的組合糖，蔗糖雖然沒有果糖甜，但是比葡萄糖要稍甜一些。\n\n水果中的葡萄糖可以被身體直接吸收利用，不需要再次分解。蔗糖確實需要被分解，有一種酶可以將蔗糖分解成葡萄糖和果糖，但是所需的時間極端，只要1納秒（十億分之一秒）。\n\n果糖的情況則要複雜一些。我們吃下果糖後，其中的一部分會在小腸被再次轉化成葡萄糖，另一部分則繼續以果糖的形成存在。果糖和葡萄糖都能夠透過腸壁細胞進入我們的血液。葡萄糖是我們身體所需要的燃料。但果糖不是。現在的狀況是，我們吃了很多不必要的果糖，因為我們吃了太多的蔗糖（一份蔗糖中的一半是葡萄糖，另一半是果糖）。\n\n③纖維：\n酶的作用是斷開澱粉和蔗糖中的連線，但是，沒有任何酶可以斷開纖維中的連線。也就是說，纖維不能重新變回葡萄糖。這就是為什麼我們吃了纖維之後，纖維仍然是纖維。\n\n纖維會從胃到小腸，再到大腸。這很好。儘管纖維不能轉化為葡萄糖，不能胃細胞提供能量，但是，纖維是我們飲食中必不可少的物質，在幫助消化、保持健康的腸道運動、維持微生物健康等方面發揮著非常重要的作用。", "c": "控糖健康", "k": "碳水化合物＝澱粉＋纖維＋糖。澱粉一吃進去很快變成葡萄糖，像下課的小朋友衝到操場；水果有葡萄糖、果糖、蔗糖；只有纖維不會變成糖，它會一路走到大腸，幫忙消化、餵養好菌。", "m": ["碳水化合物家族", [["澱粉", ["麵粉製品", "澱粉酶快速分解"]], ["水果糖", ["葡萄糖", "果糖", "蔗糖"]], ["果糖", ["部分轉葡萄糖", "身體不需要"]], ["纖維", ["無法分解", "幫消化", "養菌"]]]], "f": [["碳水化合物", "澱粉/糖/纖維"], ["澱粉", "→快速變葡萄糖"], ["蔗糖", "→葡萄糖+果糖"], ["纖維", "→不變，到大腸"], ["選擇", "多纖維、少精製"]], "p": [{"no": "033", "n": "亞麻仁籽渣（2包）", "pr": "NT$198", "nd": ["腸道", "膳食纖維"], "w": "亞麻仁籽渣提供「不會變成葡萄糖」的纖維，幫助消化與腸道運動。"}, {"no": "035", "n": "全酶", "pr": "NT$880", "nd": ["消化", "吸收"], "w": "全酶支持澱粉、蛋白質、脂肪的分解，讓消化吸收更順。"}, {"no": "096", "n": "孢子益生菌（加亞麻仁渣）（6g×30包）", "pr": "NT$650", "nd": ["菌相", "腸道", "免疫"], "w": "孢子益生菌加纖維，讓纖維順利到大腸被好菌利用。"}], "a": [{"no": 71, "n": "功能健康系統", "u": "https://membership-app-e2147.web.app/lifeos/functional-health-system.html", "cat": "醫學生／醫學健康 / 健康", "w": "功能健康系統把澱粉、糖、纖維的差異整理成清楚架構。"}, {"no": 81, "n": "化學暑期課程", "u": "https://membership-app-e2147.web.app/chemistrysummer/", "cat": "醫學生／醫學健康 / 學習", "w": "化學暑期課程補基礎：從分子層面理解醣類。"}]}, {"id": 23, "t": "糖尿病與飽和脂肪的關係！學到了！收藏篇！", "d": "7月29日", "g": ["糖尿病", "飽和脂肪", "學習筆記"], "b": "①飽和脂肪和單不飽和脂肪：並非所有的脂肪都會以相同的方式影響肌細胞。例如，棕櫚酸酯是一種主要在肉類、乳製品和雞蛋中發現的飽和脂肪，它會導致胰島素抵抗。而油酸，這種多見於堅果、橄欖和牛油果裡的單不飽和脂肪，卻能降低飽和脂肪的有害影響。\n\n②脂肪中毒：飽和脂肪會給肌細胞製造各種麻煩，可能導致自由基和有毒分解產物的累積，如神經醯胺和甘油二酯，從而造成炎症，甚至讓線粒體功能失效，也就是干擾細胞內的小發電廠（線粒體）的運作。這就是所謂的“脂肪中毒”，假如我們對人體進行活組織檢查，就會發現在肌細胞的細胞膜上積聚的飽和脂肪與胰島素抵抗相關。然而，單不飽和脂肪卻能夠被身體代謝處理，或者說可以安全儲存。\n\n③飽和脂肪可能傷害分泌胰島素的胰臟細胞：我們在２０歲左右時，身體就會停止製造新的Ｂ細胞（胰島Ｂ細胞）。\n此後，一旦失去胰島Ｂ細胞，就可能再也回不來了。解剖研究顯示，當Ⅱ型糖尿病在年齡稍長時被診斷出來時，胰島Ｂ細胞可能已經被殺死一半了。\n\n④有直接的證據可以證明飽和脂肪的毒性：\n如果讓培養皿中的胰島Ｂ細胞接觸飽和脂肪或壞膽固醇，胰島Ｂ細胞會開始死亡。而堅果等高脂蔬食所富含的單不飽和脂肪，卻沒有觀察到這樣的情形。\n當你吃下飽和脂肪，幾個小時之內，胰島素的工作和分泌都會受損。血液中的飽和脂肪越多，引發Ⅱ型糖尿病的風險就越高。", "c": "控糖健康", "k": "不是所有油都一樣。肉、奶、蛋裡的「飽和脂肪」會讓細胞中毒、引起胰島素阻抗，甚至殺死做胰島素的細胞（20歲後就不會再長新的）。堅果、橄欖、酪梨裡的「單元不飽和脂肪」比較安全，還能減少壞處。", "m": ["飽和脂肪與糖尿病", [["兩種脂肪", ["飽和：肉奶蛋", "單不飽和：堅果橄欖酪梨"]], ["脂肪中毒", ["神經醯胺", "粒線體失效"]], ["傷胰臟", ["20歲後不再生B細胞", "確診時剩一半"]], ["證據", ["培養皿B細胞死亡"]]]], "f": [["飽和脂肪多", "肉奶蛋"], ["肌細胞中毒", "發炎、粒線體受損"], ["胰島素阻抗", "血糖升高"], ["B細胞死亡", "無法再生"], ["替換", "改用堅果橄欖油"]], "p": [{"no": "097", "n": "亞麻仁油（500cc×2瓶）", "pr": "NT$780", "nd": ["Omega-3", "心血管", "抗氧化"], "w": "亞麻仁油（500cc×2）提供植物性 Omega-3，取代部分飽和脂肪來源。"}, {"no": "060", "n": "Q10（10:1）（膠囊）", "pr": "NT$580", "nd": ["粒線體", "能量", "心臟", "抗氧化"], "w": "Q10 支持粒線體功能，對應「脂肪中毒讓粒線體失效」。"}, {"no": "084", "n": "黃連素／小蘗鹼（膠囊）", "pr": "NT$560", "nd": ["血糖", "腸道", "代謝"], "w": "黃連素支持血糖代謝與胰島素訊號。"}], "a": [{"no": 91, "n": "代謝控制儀表板", "u": "https://membership-app-e2147.web.app/platform/health-medicine/metabolic-control-dashboard.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "代謝控制儀表板追蹤飲食油脂與血糖的關係。"}, {"no": 88, "n": "整合醫學 OS 版本", "u": "https://membership-app-e2147.web.app/platform/health-medicine/integrated-medicine-os-variant.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "整合醫學 OS 幫你理解胰島 B 細胞與脂肪毒性。"}]}, {"id": 24, "t": "膽固醇與乳腺癌的關係！學到了！請收藏！！", "d": "7月26日", "g": ["改善膽固醇", "瞭解疾病的根源", "乳腺癌", "膽固醇", "膳食纖維"], "b": "①壞膽固醇會促進乳腺癌細胞的生長：\n膽固醇似乎是癌症的養分。在培養皿中，壞膽固醇會促進乳腺癌細胞的生長，這些癌細胞一口就吞掉了這些壞膽固醇。腫瘤可以吸收非常多的膽固醇，所以在癌症發展時，患者的膽固醇值會驟降。這不是個好兆頭，當膽固醇吸收量達到最高時，病人跟的存活率往往是最低的的。\n研究人員認為，癌細胞會使用膽固醇來製造雌激素或支撐腫瘤的細胞膜，以幫助癌症轉移和侵入更多的身體組織。\n\n換句話說，乳房腫瘤可能會利用隨著血液迴圈的高膽固醇，供給養分並加速生長。癌細胞對膽固醇如此飢渴，因此製藥公司已經開始效法木馬屠城的戰略，把壞膽固醇當成木馬，用來把抗癌藥物送進細胞裡。\n\n②膳食纖維不足會增加患乳腺癌的風險\n膳食纖維攝取不足，也可能是患乳腺癌的風險因素之一。耶魯大學和其他地方的研究人員發現，若停經前婦女每天至少吃６克水溶性纖維（相當於一杯黑豆的纖維量），她們患乳腺癌的機率比每天吃４克以下的婦女低了６２％。\n\n膳食纖維的好處，對於更難治療的雌激素受體陰性乳腺腫瘤更為明顯：採取高纖維飲食的停經前婦女，患這種型別乳腺癌的機率低了８５％。\n\n值得注意的是，所攝取的水溶性纖維是從食物而來的，不是靠吃營養補充品。這意味著，攝取高纖維的未患癌的婦女可能吃了更多的蔬果，因為這是唯一天然存在膳食纖維的食物。", "c": "乳腺健康", "k": "壞膽固醇像是癌細胞的「點心」，實驗中乳癌細胞會大口吃掉它，拿來長大和移動。另外，停經前的女生每天吃夠6克水溶性纖維（大約一杯黑豆），得乳癌的機會少了六成多。纖維要從蔬菜水果豆子來，不是吃補充品。", "m": ["膽固醇與乳癌", [["壞膽固醇", ["癌細胞的養分", "製造雌激素", "支撐細胞膜"]], ["藥物應用", ["木馬屠城策略"]], ["纖維保護", ["每天≥6克水溶性纖維", "風險降62%", "ER陰性降85%"]], ["來源", ["食物而非補充品", "蔬果豆類"]]]], "f": [["高膽固醇飲食", "血中LDL高"], ["癌細胞吸收", "當養分與原料"], ["腫瘤生長轉移", "風險上升"], ["高纖飲食", "每天≥6克水溶性纖維"], ["風險下降", "62%~85%"]], "p": [{"no": "033", "n": "亞麻仁籽渣（2包）", "pr": "NT$198", "nd": ["腸道", "膳食纖維"], "w": "亞麻仁籽渣提供纖維，對應「水溶性纖維越多，乳癌風險越低」。"}, {"no": "063", "n": "甜菜鹼TMG（膠囊）", "pr": "NT$490", "nd": ["甲基化", "肝臟", "心血管"], "w": "甜菜鹼 TMG 支持甲基化與肝臟、心血管節點，作為血脂保養的一環。"}, {"no": "079", "n": "憂遁草粉", "pr": "NT$750", "nd": ["植物營養", "抗氧化", "免疫", "代謝"], "w": "憂遁草粉提供植化素與抗氧化支持，作為植物營養補充。"}], "a": [{"no": 87, "n": "癌症特徵 OS 完整版", "u": "https://membership-app-e2147.web.app/lifeos/cancer-hallmarks-os-complete.html", "cat": "醫學生／醫學健康 / 醫療", "w": "癌症特徵 OS 完整版理解癌細胞如何利用膽固醇。"}, {"no": 68, "n": "抗癌系統", "u": "https://membership-app-e2147.web.app/lifeos/anticancer-system.html", "cat": "醫學生／醫學健康 / 醫療", "w": "抗癌系統整理飲食纖維與防護策略。"}]}, {"id": 25, "t": "關於乳腺癌這篇筆記爛讀！必讀篇！收藏篇！", "d": "7月25日", "g": ["瞭解疾病的根源", "乳腺癌", "運動"], "b": "一、對乳腺癌而言，任何份量的酒精都不是安全的。\n①研究人員發現，即使是每天最多喝一杯酒的女性，患乳腺癌的風險，仍然有小幅但具有統計意義的增加趨勢。\n\n②致癌物並非酒精本身，罪魁禍首其實是一種叫乙醛的酒精毒性分解物；當你喝了一小口酒之後，它幾乎立刻就在你的嘴巴里形成了。實驗證明，即使將一茶匙烈酒只含在嘴裡５秒酒吐出來，所產生的乙醛也具有潛在的致癌程度，並會逗留超過１０分鐘。\n③如果連嘗一小口酒，都可能在嘴裡產生致癌的乙醛量，那麼使用含有酒精的漱口水會怎麼樣？研究人員測試了市面上各種品牌的漱口水和空腔清潔液，得出的結論是：雖然風險很輕微，但最好還是不要使用含有酒精的產品。\n\n二、運動對乳腺癌的影響\n①體能活動那被認為可以預防乳腺癌，不僅是因為運動有助於控制體重，也因為運動通常能降低血液迴圈中的雌激素濃度。每週5個小時的高強度有氧運動，就可以將雌激素和黃體素的含量降低約20％。\n\n②根據已發表的最大規模相關研究顯示，只有每週至少５次運動到出汗程度的女性，才得到顯著的保護效果。不過，中等強度的活動，也能提供跟高強度運動一樣的功勞；比如，每天用中等速度走１小時。二零一三年的一項研究結果也證實，1天至少走路1小時，的確能顯著降低乳腺癌患病風險。", "c": "乳腺健康", "k": "喝酒一口就會在嘴裡產生致癌的乙醛，任何量都不安全，含酒精漱口水也最好避免。運動能降低身體裡的雌激素，每週5次運動到流汗、或每天快走1小時，都能明顯降低乳癌風險。", "m": ["乳癌預防", [["酒精", ["任何量不安全", "乙醛入口即生"]], ["漱口水", ["選無酒精"]], ["運動機制", ["控制體重", "降低雌激素黃體素20%"]], ["運動量", ["每週5次流汗", "每天快走1小時"]]]], "f": [["戒酒", "避免乙醛"], ["換無酒精漱口水", "減少口腔乙醛"], ["每天快走1小時", "或每週5次流汗"], ["雌激素下降", "約20%"], ["乳癌風險降低", "長期保護"]], "p": [{"no": "029", "n": "口腔淨化養護精油組", "pr": "NT$1200", "nd": ["口腔", "牙齦"], "w": "口腔淨化精油組取代含酒精漱口水，減少口腔乙醛。"}, {"no": "034", "n": "胺基酸可可粉包", "pr": "NT$780", "nd": ["肌肉", "能量"], "w": "胺基酸可可粉支持肌肉與能量，配合每天快走 1 小時更有體力。"}, {"no": "069", "n": "發熱襪", "pr": "NT$25", "nd": ["末梢循環", "保暖"], "w": "發熱襪保暖末梢，冬天出門快走更願意持續。"}], "a": [{"no": 86, "n": "癌症理解 APP", "u": "https://membership-app-e2147.web.app/lifeos/cancer-understanding-app.html", "cat": "醫學生／醫學健康 / 醫療", "w": "癌症理解 APP 整理酒精與運動對乳癌的影響。"}, {"no": 37, "n": "自律模型 60 項", "u": "https://membership-app-e2147.web.app/platform/self-discipline-action/self-discipline-model-60-bilingual.html", "cat": "英文／語言學習 / 自律行動", "w": "自律模型 60 項把「每週 5 次運動到流汗」變成習慣。"}]}, {"id": 26, "t": "喝牛奶可能補鈣效果沒那麼好！顛覆認知！！", "d": "7月23日", "g": ["學習筆記", "補鈣", "牛奶補鈣"], "b": "①喝牛奶可能補鈣效果沒那麼好。\n因為鈣含量高，牛奶一直被認為時補鈣佳品。哈佛大學有一項研究歷時１０年，涉及７.７萬名護士。研究人員發現，每週喝一杯或不到一杯牛奶的人和每週至少喝兩杯牛奶的人相比，手臂喝髖部的骨折次數並無明顯的差異。\n研究小組還對３３名健康工作的男性進行了類似的調查，依舊發現牛奶對骨折的機率似乎沒有任何影響。總之，研究表明，喝牛奶對於長期保護骨骼幾乎沒有作用。\n\n②為什麼牛奶不能補鈣，牛奶不是含有很多鈣嗎？\n的確，牛奶是鈣含量最高的食物之一，而且又不錯的鈣吸收率。但是一種食物對身體鈣平衡的作用還取決於其對鈣排出的影響。牛奶除了含鈣，還含有動物蛋白。\n有研究發現，當我們開始攝入動物蛋白，尿液裡就開始流失鈣。世界範圍內的調查資料表明，一個國家的髖骨骨折率隨著牛奶消費水平的上高而上高。牛奶所含的動物蛋白在體內造成酸性代謝環境，幫助鈣的流失，所以喝奶補進來的鈣基本流失了。\n\n③值得注意的是，雖然牛奶對骨骼沒有顯著益處，但是攝入過多可能對提高前列腺癌、非霍奇金淋巴癌、Ⅰ型糖尿病等罹患風險。牛奶也是常見的兒童過敏症食物性過敏原。\n所以喝牛奶可能得不償失。", "c": "骨骼健康", "k": "大家都以為喝牛奶能補鈣，但哈佛研究發現多喝牛奶的人骨折沒有比較少。因為牛奶裡的動物蛋白會讓身體變「酸」，鈣就從尿流掉了。喝太多牛奶還可能增加某些疾病風險，也是小朋友常見的過敏原。", "m": ["牛奶補鈣迷思", [["研究", ["7.7萬名護士10年", "骨折無差異"]], ["原因", ["動物蛋白", "酸性環境", "鈣從尿流失"]], ["風險", ["前列腺癌", "淋巴癌", "兒童過敏"]], ["思考", ["鈣平衡=吸收-排出"]]]], "f": [["喝牛奶", "補進鈣"], ["動物蛋白", "造成酸性代謝"], ["鈣流失", "從尿液排出"], ["淨效果", "骨骼無明顯好處"], ["替代", "綠色蔬菜、豆類補鈣"]], "p": [{"no": "092", "n": "D3（5000IU）（錠）", "pr": "NT$580", "nd": ["免疫", "骨骼", "鈣代謝"], "w": "D3（5000IU）支持鈣代謝與骨骼，幫助鈣真正被利用。"}, {"no": "091", "n": "甘氨酸鎂複方粉包", "pr": "NT$1350", "nd": ["睡眠", "神經", "肌肉", "放鬆"], "w": "甘氨酸鎂複方：鎂是骨骼與鈣代謝的重要夥伴，不靠牛奶也能照顧骨骼。"}, {"no": "036", "n": "潤節晶", "pr": "NT$580", "nd": ["關節", "軟骨", "膠原"], "w": "潤節晶照顧關節與軟骨，骨骼保養的另一面。"}], "a": [{"no": 92, "n": "醫療證據購物 OS", "u": "https://membership-app-e2147.web.app/platform/health-medicine/medical-evidence-shopping-os.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "醫療證據購物 OS 用證據看「牛奶補鈣」等迷思。"}, {"no": 71, "n": "功能健康系統", "u": "https://membership-app-e2147.web.app/lifeos/functional-health-system.html", "cat": "醫學生／醫學健康 / 健康", "w": "功能健康系統理解鈣的吸收與流失平衡。"}]}, {"id": 27, "t": "關於腸道健康這本書寫的太太太好了！收藏篇", "d": "6月26日", "g": ["自身免疫性", "閱讀筆記", "瞭解疾病的根源", "自身免疫疾病", "免疫力", "腸道健康"], "b": "不幸的是，有時自身免疫疾病在生命早期就已經開始了。近期的研究證明，生命前幾年中的抗生素接觸能夠永久性地改變人體免疫系統。\n\n紐約大學進行的一項研究發現，生命早期接受青黴素治療的人，成年期超重的機率更高，空腹血胰島素水平較高並伴有肝功能障礙。這些都是代謝綜合徵的典型標記物，代謝綜合徵也疑似為一種自身免疫疾病。\n\n近期，約翰霍普金斯和哈佛大學的另一項研究發現，透過剖宮產出生的兒童或生命早期接受過抗生素治療的人，嗜酸細胞性食道炎的風險比其他人高３～３.５倍，這是一種消化系統疾病，是白細胞為應對食物、過敏原或胃酸反流而在食道中聚集導致的。\n\n最可怕的是：嗜酸細胞性食道炎是一種最近２０年才發現的慢性免疫系統疾病，但是患病人數增長飛快，現在已經被認為是胃腸疾病的主要原因。\n\n腸瘻發生之前，免疫系統的職責非常清洗。先天免疫系統是人體第一道防線，它就像一隻守門犬，對任何直接威脅迅速做出反應，但準確率並不總是１００％。先天免疫系統會幫助人體從腳腂扭傷的緊急性傷害和一般　感冒等急性感染中恢復。\n\n後天免疫系統的功能更像偵探犬或警犬，它會根據以前的接觸記住一種“氣味”（或者在這種情況下是記住一種病原體），下次遇到時會迅速鑑別出這種“氣味”或病原體。這個免疫系統可以透過直接接觸某些微生物激活。接觸到病毒時，後天免疫系統會“記住”它，下次接觸時就會迅速將其識別出來直接有效處理。", "c": "免疫腸道", "k": "小時候用太多抗生素或剖腹產，可能會改變免疫系統。免疫系統有兩種：「先天免疫」像看門狗，看到危險就衝，但有時會咬錯人；「後天免疫」像警犬，會記住壞人的味道，下次一聞到就馬上抓住。", "m": ["腸道與免疫", [["早期影響", ["抗生素", "剖腹產", "嗜酸性食道炎"]], ["代謝影響", ["成年超重", "胰島素高"]], ["先天免疫", ["守門犬", "反應快", "不一定準"]], ["後天免疫", ["警犬", "記住氣味", "精準處理"]]]], "f": [["生命早期", "抗生素/剖腹產"], ["菌相改變", "免疫被重塑"], ["先天免疫", "守門犬快速反應"], ["後天免疫", "警犬記憶辨識"], ["平衡", "養好菌、穩免疫"]], "p": [{"no": "062", "n": "酶菌醣體（益生菌＋Beta多醣體＋波羅酵素＋茶胺酸）", "pr": "NT$720", "nd": ["免疫", "腸道", "菌相", "修復"], "w": "酶菌醣體結合益生菌與多醣體，支持腸道菌相與免疫平衡。"}, {"no": "058", "n": "腸寶（膠囊）", "pr": "NT$485", "nd": ["腸道", "菌相", "免疫"], "w": "腸寶聚焦腸道、菌相與免疫節點，幫助抗生素後重建菌相。"}, {"no": "017", "n": "酵母鋅＋核酸", "pr": "NT$550", "nd": ["免疫", "修復"], "w": "酵母鋅＋核酸支持免疫與修復節點。"}], "a": [{"no": 88, "n": "整合醫學 OS 版本", "u": "https://membership-app-e2147.web.app/platform/health-medicine/integrated-medicine-os-variant.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "整合醫學 OS 理解先天與後天免疫的分工。"}, {"no": 93, "n": "淋巴完整系統", "u": "https://membership-app-e2147.web.app/platform/health-medicine/lymphatic-complete-system.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "淋巴完整系統延伸了解免疫防線。"}]}, {"id": 28, "t": "麩質與腸漏症的關係。必讀篇！收藏篇！！！", "d": "6月23日", "g": ["腸漏症", "腸漏", "消化", "麩質"], "b": "正常情況下，腸壁細胞間的緊密連線能夠做出完全正確的判斷，分辨敵友，而我們甚至都意識不到這個篩選的過程一直在進行。如果遊離的病毒後病原體偷偷溜過了這道門，免疫系統會立即行動，迅速清除威脅。但是，如果這些緊密連線開始不斷損壞，就會產生腸漏。\n\n連蛋白開啟腸道大門：２０００年，馬里蘭大學的阿萊西奧．法薩諾醫學博士有了一個新發現，這個發現最終可能會改變自身免疫疾病學的發展軌跡，甚至有一天可能會為它贏得諾貝爾得獎。法薩諾博士分離得到了唯一的直接控制腸壁緊密連線的生理物質，他將其命名為“連蛋白”。這個發現相當於扎到了腸漏症的根源或確鑿證據。\n\n連蛋白是一種調控緊密連線的開啟和關閉的訊號蛋白，這是人體內唯一已知的有此功能的物質。透過調控連蛋白，科學家幾乎可以隨意調節緊密連線的開關。目前，已知能觸發小腸中連蛋白釋放的誘因有：細菌和麩質。\n\n法薩諾博士團隊發現，小腸暴漏在感染條件下時會分泌連蛋白，而連蛋白會開啟緊密連線的大門。換句話說，可能是連蛋白而非細菌本身直接導致腸道滲透性變大。\n\n這種連蛋白反應一直是身體防禦機制的重要組成部分，可以將我們遇到的有害細菌驅逐出去，如沙門氏菌等。但是，現代社會中可能觸發連蛋白的因素大大增加，使得腸道的大門經常敞開著。曾經非常有益健康且短暫出現免疫系統反應變得永不停歇，使得身體產生慢性炎症，變得更加脆弱。\n\n與連蛋白釋放有關的兩大重要因素如下：食物中麩質的增加→小麥的雜交及小麥在所有加工食品中的普遍使用導致麩質的攝入量急劇增大，這就促使人體幾乎不停地釋放連蛋白。\n抗生素用量的增加→抗生素藥物、洗手液、化學清潔劑、藥物和其他殺菌劑量的增加摧毀了人體內的微生物多樣性。微生物群的失衡導致小腸內細菌絕對數量的增加，從而持續觸發連蛋白的釋放機制。", "c": "腸道健康", "k": "腸壁細胞之間有「小門」（緊密連接），負責決定誰能進來。科學家發現一種叫「連蛋白」的鑰匙可以開這扇門。麩質（小麥裡的蛋白）和壞細菌都會讓身體放出連蛋白，門一直開著，壞東西就跑進身體，造成慢性發炎，這叫腸漏。", "m": ["麩質與腸漏", [["緊密連接", ["腸壁小門", "分辨敵友"]], ["連蛋白", ["唯一的開關", "法薩諾博士發現"]], ["觸發", ["細菌", "麩質"]], ["現代問題", ["小麥雜交", "抗生素殺菌劑過多"]], ["結果", ["門常開", "慢性發炎"]]]], "f": [["吃麩質/壞菌多", "觸發"], ["釋放連蛋白", "開門鑰匙"], ["緊密連接打開", "腸壁滲漏"], ["異物入血", "免疫反應"], ["慢性發炎", "身體變脆弱"]], "p": [{"no": "081", "n": "5R腸胃營養素（6g×30包）", "pr": "NT$750", "nd": ["腸道", "腸黏膜", "消化", "修復"], "w": "5R 腸胃營養素聚焦腸黏膜與修復節點，支持被連蛋白打開的腸壁回到正常。"}, {"no": "027", "n": "三丁酸甘油膠囊（葷食）", "pr": "NT$680", "nd": ["腸道", "腸黏膜", "菌相"], "w": "三丁酸甘油膠囊提供丁酸，是腸壁細胞的重要能量來源，支持緊密連接。"}, {"no": "096", "n": "孢子益生菌（加亞麻仁渣）（6g×30包）", "pr": "NT$650", "nd": ["菌相", "腸道", "免疫"], "w": "孢子益生菌恢復菌相多樣性，對應「殺菌劑摧毀微生物多樣性」。"}], "a": [{"no": 71, "n": "功能健康系統", "u": "https://membership-app-e2147.web.app/lifeos/functional-health-system.html", "cat": "醫學生／醫學健康 / 健康", "w": "功能健康系統解析麩質、連蛋白與腸漏的關係。"}, {"no": 69, "n": "身體訊號系統", "u": "https://membership-app-e2147.web.app/lifeos/body-signals.html", "cat": "醫學生／醫學健康 / 健康", "w": "身體訊號系統把慢性發炎訊號連回腸道。"}]}, {"id": 29, "t": "乳腺癌與運動的關係！必讀篇！收藏篇！！！", "d": "6月8日", "g": ["乳腺癌", "運動", "養生", "生活習慣"], "b": "體能活動被認為可以預防乳腺癌，不僅是因為運動有助於控制體重，也因為運動通常能降低血液迴圈中的雌激素濃度。每週５個小時的高強度有氧運動，就可以將雌激素和黃體素的含量降低約２０％。\n\n根據已發表的最大規模相關研究顯示，只有每週至少５次運動到出汗程度的女性，才能得到顯著的功效；比如，每天用中等速度走１小時。２０１３年的一項研究結果也證實，１天至少走路１小時，的確能顯著降低乳腺癌患病風險。\n\n達爾文有句話說得沒錯：適者生存。所以，趕緊鍛鍊身體去吧！\n\n１９３９年，在一篇名為《在烤炸食物中存在的致癌物質》的論文中，有一個奇妙的發現。研究人員描述，他使用烤馬肉提取物屠宰小鼠頭上，引發了小鼠的乳腺癌。這些“致癌物質”如今被確定為雜環胺，美國癌症研究所描述雜環胺是“牛、豬、魚、禽等肉類，以高溫方法烹調時所形成的化學物質”。這些烹調方式，包括爐烤和烘烤。想吃肉，那麼吃水煮肉可能是最安全的。\n\n肉的烹調溫度全程不超過１００℃，吃這種肉所產生的尿液和糞便，比起吃用高溫乾燒方式所烹調的肉，ＤＮＡ受損情形明顯少很多。這表示流經血液魚大腸的誘發物質比較少。相反，以１７６℃的高溫烤雞，只需要１５分鐘就會產生雜環胺。\n\n這些致癌物質，是某些肌肉組織在高溫化學反應下所形成的（由於植物缺乏這些物質，所以即使時高溫油炸素漢堡，也不會測量到雜環胺）。肉的烹調時間越長，就會產生越多的雜環胺。這個過程，可以解釋為什麼食用熟透的肉類，會跟乳腺癌、大腸癌、食道癌、肺癌、胰臟癌、前列腺癌和胃癌的患病風險增加有關。\n\n《哈佛健康通訊》稱這種兩難情況是烹調肉品的“悖論”：把肉煮熟，可以降低食源性感染；但煮太熟，卻有產生食源性致癌物質的風險。\n\n雜環胺會在齧齒類動物身上引起癌症，並不代表就會導致人類的癌症。不過就這個例子來說，人類可能會更容易受到影響。齧齒動物的肝臟有不可思議的解讀能力，能夠把科學家塞進它們的喉嚨裡的雜環胺分解掉９９％。\n\n隨後在２００８年，研究人員發現吃了熟雞肉的人，肝臟只能解第一半的致癌物質，這表明人類的患癌風險遠高於先前老鼠實驗中所推測的數字。", "c": "乳腺健康", "k": "運動可以降低雌激素，每天快走1小時就能降低乳癌風險。另外，肉用高溫烤、炸會產生致癌的「雜環胺」，煮越久越多，用水煮（不超過100度）比較安全。蔬菜就算高溫炸也不會產生這種東西。", "m": ["乳癌與運動烹調", [["運動", ["降雌激素20%", "每天走1小時"]], ["雜環胺", ["肉高溫烹調產生", "烤炸176℃15分鐘"]], ["安全烹調", ["水煮≤100℃", "DNA受損少"]], ["人類較脆弱", ["肝臟只解一半"]]]], "f": [["高溫烤炸肉", "產生雜環胺"], ["吸收入血", "肝只能解一半"], ["DNA受損", "多種癌症風險"], ["改水煮蒸", "≤100℃"], ["加上運動", "雙重保護"]], "p": [{"no": "034", "n": "胺基酸可可粉包", "pr": "NT$780", "nd": ["肌肉", "能量"], "w": "胺基酸可可粉支持肌肉與能量，運動後恢復更好，願意天天快走。"}, {"no": "085", "n": "NAC複方（膠囊）", "pr": "NT$530", "nd": ["肝臟", "抗氧化", "呼吸道", "解毒"], "w": "NAC 複方支持肝臟解毒節點，對應「人類肝臟只能解一半雜環胺」。"}, {"no": "038", "n": "EGCG複方（茶多酚＋EGCG＋積雪草）", "pr": "NT$560", "nd": ["抗氧化", "代謝", "細胞保護"], "w": "EGCG 複方（茶多酚）提供抗氧化與細胞保護支持。"}], "a": [{"no": 68, "n": "抗癌系統", "u": "https://membership-app-e2147.web.app/lifeos/anticancer-system.html", "cat": "醫學生／醫學健康 / 醫療", "w": "抗癌系統整理烹調方式與運動的防護策略。"}, {"no": 37, "n": "自律模型 60 項", "u": "https://membership-app-e2147.web.app/platform/self-discipline-action/self-discipline-model-60-bilingual.html", "cat": "英文／語言學習 / 自律行動", "w": "自律模型 60 項把每天走路 1 小時變成習慣。"}]}, {"id": 30, "t": "高血壓篇！！！我將低鹽飲食貫穿到底！！！", "d": "5月31日", "g": ["高血壓"], "b": "已有證據顯示，鈉會讓血壓升高。研究都顯示，減少鹽的攝取量就能降低血壓；減少的鹽量越多，獲得的好處也越多。反之，如果不減少鹽量，長期的高鹽飲食可能會讓你的血壓一輩子都只能往上爬。 在人類進化的前９０％的時間段，可能一直過著低鈉飲食的生活，每天攝取的鈉不到１／４茶匙。\n\n因為當時人類的主要食物，可能都是植物。長達數百年下來，人類都能過著不需要鹽罐的生活，因此身體演變成節鈉型的有機體。\n\n早在２００９年，美國心臟協會就引用了美國飲食指南諮詢委員會主席的話，認為美國人應該減少鈉的攝取量。但鹽業機構，一個行業協會，卻指控她對鹽有“不健康的偏見”，認為她“對鹽的問題為審先判”，這就像煙商抱怨美國肺臟協會對抽菸持有偏見一樣。當然，鹽業機構並不是唯一對此憤憤不平的組織。乳酪被列為美國飲食中鈉的主要來源，而全國乳製品協會與製鹽業站在一起，譴責美國飲食指南諮詢委員會的建議。\n\n製鹽業有自己公關公司，因此能夠跟煙商用同一策略來淡化產品的危害。話說回來，真正的大魔王不是鹽礦大王，而是食品加工業。市值數萬億美元的食品加工業，使用的是廉價的鹽和糖新增物，賣給我們的是垃圾。這就是為什麼在典型的美國飲食中，你絕對避不開鈉，因為你所攝取的鹽３／４都來自加工食品而非加鹽罐。一旦你的味蕾習慣了超甜和超鹹的食物，你就會覺得天然食物嚐起來就像厚紙板一樣淡而無味。的確，成熟水果的甜度可能不及超市裡賣的早餐谷片。\n\n但食品業者在產品中新增鹽，還有其他兩個主要原因。首先，在肉里加鹽可以吸水，透過這種方式可以讓產品增加近２０％的重量，等於只要花一點點成本就能增加２０％的利潤。其次，大家都知道吃鹽會口渴，所以酒吧裡往往都會放一藍調味堅果和餅乾供客人免費取用。\n\n這也是為什麼汽水業者常會跨足休閒食品業，百事可樂與土豆片廠商菲多利同一集團，或許並非純屬巧合。", "c": "高血壓", "k": "吃太多鹽會讓血壓升高，少吃一點血壓就會降。古時候人類幾乎不吃鹽，身體天生很「省鈉」。現在我們吃的鹽有3/4來自加工食品，不是自己加的。食品廠加鹽還能讓肉吸水變重賺更多，鹹的零食也讓人口渴多買飲料。", "m": ["低鹽飲食", [["證據", ["鈉升血壓", "減越多好處越多"]], ["演化", ["90%時間低鈉", "身體節鈉型"]], ["真兇", ["加工食品占3/4"]], ["業者動機", ["吸水增重20%", "讓人口渴"]]]], "f": [["加工食品", "隱藏鈉"], ["鈉攝取過多", "味蕾習慣重鹹"], ["血壓上升", "一輩子往上爬"], ["減鹽", "少加工、看標示"], ["血壓下降", "味覺恢復"]], "p": [{"no": "052", "n": "血循環", "pr": "NT$1350", "nd": ["循環", "心血管", "末梢循環"], "w": "血循環支持心血管與循環，配合減鹽一起照顧血壓。"}, {"no": "091", "n": "甘氨酸鎂複方粉包", "pr": "NT$1350", "nd": ["睡眠", "神經", "肌肉", "放鬆"], "w": "甘氨酸鎂複方：鎂參與血管放鬆與神經穩定，是減鹽飲食的好搭檔。"}, {"no": "006", "n": "專利HEZY氫鬆袋（買空袋送氫氧水）", "pr": "NT$250", "nd": ["氧化壓力", "修復", "能量"], "w": "氫鬆袋讓喝水更有規律，取代鹹零食後愛喝的含糖飲料。"}], "a": [{"no": 92, "n": "醫療證據購物 OS", "u": "https://membership-app-e2147.web.app/platform/health-medicine/medical-evidence-shopping-os.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "醫療證據購物 OS 教你看鈉含量，避開加工食品陷阱。"}, {"no": 69, "n": "身體訊號系統", "u": "https://membership-app-e2147.web.app/lifeos/body-signals.html", "cat": "醫學生／醫學健康 / 健康", "w": "身體訊號系統留意水腫、頭脹等高鈉訊號。"}]}, {"id": 31, "t": "糖尿病篇！食品汙染會增加糖尿病的發病率！", "d": "5月29日", "g": ["學習筆記", "糖尿病"], "b": "肥胖率的大幅上升，被完全歸咎於飲食過量和缺乏運動。但沒有可能，還存在其他跟食物有關的因素呢？科學家已經開始尋找釋出到環境中的所謂“肥胖因子”，也就是那些可能會破壞新陳代謝、更容易導致肥胖的化學汙染物。\n\n被汙染的食物，讓我們接觸這些化學物質的主要來源，其中，９５％可能來自動物性脂肪的攝取。這有什麼大不了的？美國有一項全國性的研究發現，那些血液中汙染物質最多的人，患糖尿病的機率相當驚人，是普通人的３８倍。哈佛大學的研究人員發現，特別是“六氯苯”這種化學物質，更是引發糖尿病的高危因子。\n\n在各大超市的調查中發現，沙丁魚的六氯苯汙染最嚴重，而鮭魚則被認為是汙染最嚴重的魚類。在鮭魚片裡，曾經檢查出了２４種殺蟲劑。養殖鮭魚可能是最糟的，含有比野生魚更多１０倍以上的第一類毒性化學物質多氯聯苯。\n\n六氯苯和多氯聯苯一類的工業毒素，在幾十年前就已被全面禁止。那麼，它們又為何成為造成糖尿病患病率上升的原因呢？這個問題的答案，可能與肥胖流行有關。研究人員發現，比起身材消瘦的受試者，這些毒性化學物質和糖尿病之間的關聯繫，在肥胖的受試者身上更強，因此體內脂肪，很可能就是這這些汙染物質的溫床。\n\n超重的人，極可能就有毒的廢棄物質儲存在臀部，就像隨身攜帶一個毒物垃圾場。如果沒有減掉足夠的重量，身上帶有鮭魚汙染物質的人，可能需要５０～７０年的時間才能清除掉體內的這些化學物質。", "c": "控糖健康", "k": "變胖不只是吃太多、動太少，環境裡的化學污染物也可能讓人胖、得糖尿病。這些污染物有95%是從動物脂肪吃進來的，血中污染物最多的人得糖尿病機率是38倍。污染物會藏在身體脂肪裡，要很久才能排掉。", "m": ["污染與糖尿病", [["肥胖因子", ["化學污染物", "干擾代謝"]], ["來源", ["95%動物脂肪", "魚類如鮭魚沙丁魚"]], ["數據", ["糖尿病風險38倍", "六氯苯"]], ["脂肪儲存", ["身體是毒物倉庫", "需50-70年清除"]]]], "f": [["環境污染物", "PCB、六氯苯"], ["食物鏈富集", "動物脂肪"], ["吃進體內", "存在脂肪"], ["干擾代謝", "糖尿病風險"], ["行動", "少動物脂肪、健康減重"]], "p": [{"no": "085", "n": "NAC複方（膠囊）", "pr": "NT$530", "nd": ["肝臟", "抗氧化", "呼吸道", "解毒"], "w": "NAC 複方支持肝臟解毒與抗氧化，對應環境污染物的代謝負擔。"}, {"no": "077", "n": "肝寶（膠囊）", "pr": "NT$550", "nd": ["肝臟", "解毒", "代謝"], "w": "肝寶聚焦肝臟解毒與代謝節點。"}, {"no": "016", "n": "亞麻仁油", "pr": "NT$3470", "nd": ["Omega-3", "抗發炎"], "w": "亞麻仁油提供植物 Omega-3，減少依賴高污染魚類的油脂來源。"}], "a": [{"no": 91, "n": "代謝控制儀表板", "u": "https://membership-app-e2147.web.app/platform/health-medicine/metabolic-control-dashboard.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "代謝控制儀表板追蹤體重與血糖，污染物存在脂肪裡，減重是清除的關鍵。"}, {"no": 88, "n": "整合醫學 OS 版本", "u": "https://membership-app-e2147.web.app/platform/health-medicine/integrated-medicine-os-variant.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "整合醫學 OS 理解「肥胖因子」與代謝干擾。"}]}, {"id": 32, "t": "別讓飲食結構傷害你的腎臟！寫的太棒了！！", "d": "5月27日", "g": ["腎臟"], "b": "如果腎臟無法正常運作，代謝的廢物就會在血液中聚積，最終導致削弱，呼吸急促、精神錯亂和心率異常等症狀。不過，大多數腎功能日益惡化的人，根本沒有出現任何這症狀。一旦腎臟功能完全喪失，解決辦法只有兩個：換一個新的腎臟，或者洗腎（用機器過濾血液）。但捐贈的腎臟可遇不可求，而洗腎者也通常託不過３年。因此，一開始讓腎臟保持健康，才是最好的選擇。\n\n別讓飲食結構傷害你的腎：腎臟是佈滿血管的器官，這就是它們看起來紅彤彤的原因。\n\n健康的腎會竭力保留蛋白質和其他重要的營養物質，並從血液中過濾出有毒或無用的廢物到尿液裡，假如在尿液中發現了滲漏出來的蛋白質，就是腎功能開始異常的跡象。\n\n研究人員發現，有３種特定的膳食成分，與腎功能下降的跡象有關：動物性蛋白、動物性脂肪及膽固醇。這３種成分都有同樣的來源：動物性產品。\n\n１５０年前，現代病理學之父魯道夫．菲爾紹首次描述腎臟的脂肪變性。從那時開始，高血脂造成腎毒性（血液中的脂肪和膽固醇可能對腎臟有毒）的假說就被正式確認了，其中部分原因時解剖腎臟時發現了脂肪堵塞。\n\n不加節制地攝入白糖、攝取高果糖的玉米糖漿都跟血壓和尿酸增加有關，從而破壞腎臟細胞。在動物性產品和垃圾食物中所含的飽和脂肪、反式脂肪及膽固醇，也與腎功能受損有關。\n\n此外，肉類中的蛋白質也會增加腎臟的酸負荷，提升氨的生成量，很可能破壞敏感的腎臟細胞。這就是為什麼醫生會常常建議慢性腎病患者限制蛋白質的攝取量，防止腎功能進一步衰退的原因。\n\n動物性蛋白攝取過多，可能會對腎臟的正常工作產生巨大影響，透過在腎絲球引發一種稱為“超過濾”的高壓狀態，大幅增加腎臟的負荷。假如超過濾只是偶爾發生，不至於危害道身體。\n\n人體都有備用的腎，因此只靠一個腎臟就能活下去。然而，現在很多人幾乎每天無肉不歡，攝取了大量的動物性為什麼隨著年齡的增長，腎功能會每況愈下。\n\n至於吃蔬菜的人腎功能比較好的原因，最初被認為時總的蛋白質攝取量較低。但現在我們知道，更可能的原因是腎臟處理動物性蛋白與植物性蛋白的方法不同。\n\n在吃肉後的幾個小時內，腎臟就會轉化成超過濾狀態，不管你吃多是生肉，雞肉或魚肉，都有類似的結果。反之，相同份量的植物性蛋白，對腎臟沒有明顯造成實質性的壓力。", "c": "腎臟健康", "k": "腎臟像身體的濾網，把壞東西過濾到尿裡、留住好東西。壞掉通常不會痛，等發現可能就要洗腎了。吃太多動物蛋白、動物脂肪、膽固醇、白糖和果糖都會讓腎臟太累（超過濾）。植物蛋白對腎臟的壓力小很多。", "m": ["保護腎臟", [["腎功能", ["過濾廢物", "保留蛋白質"]], ["沉默器官", ["多數無症狀", "洗腎或換腎"]], ["傷腎三元素", ["動物蛋白", "動物脂肪", "膽固醇"]], ["其他", ["白糖果糖→尿酸", "酸負荷"]], ["植物蛋白", ["不引起超過濾"]]]], "f": [["大量吃肉", "動物蛋白"], ["腎絲球超過濾", "高壓狀態"], ["酸負荷增加", "氨生成"], ["腎功能下滑", "尿蛋白出現"], ["改植物蛋白", "腎臟壓力小"]], "p": [{"no": "006", "n": "專利HEZY氫鬆袋（買空袋送氫氧水）", "pr": "NT$250", "nd": ["氧化壓力", "修復", "能量"], "w": "氫鬆袋讓喝水更有規律，充足飲水減輕腎臟過濾負擔（限水者依醫囑）。"}, {"no": "093", "n": "蘆筍提取物（膠囊）", "pr": "NT$490", "nd": ["代謝", "循環", "排水"], "w": "蘆筍提取物聚焦代謝與排水節點，支持水分代謝。"}, {"no": "075", "n": "脾胃健／水循環（6g×30包）", "pr": "NT$530", "nd": ["脾胃", "消化", "水分平衡"], "w": "脾胃健／水循環支持消化與水分平衡節點。"}], "a": [{"no": 72, "n": "健康診斷系統", "u": "https://membership-app-e2147.web.app/lifeos/health-diagnosis.html", "cat": "醫學生／醫學健康 / 健康", "w": "健康診斷系統看懂尿蛋白等腎功能指標。"}, {"no": 71, "n": "功能健康系統", "u": "https://membership-app-e2147.web.app/lifeos/functional-health-system.html", "cat": "醫學生／醫學健康 / 健康", "w": "功能健康系統理解動物蛋白與超過濾的關係。"}]}, {"id": 33, "t": "壓力與健康的關係，寫得太好了！！收藏篇！", "d": "5月14日", "g": ["堅持讀書打卡", "腸道", "壓力", "壓力與健康", "腸漏"], "b": "上百萬個腸道神經（合稱為“第二大腦”）擁有自己的受體，可以與某些腸道細菌和短鏈脂肪酸等代謝產物相互作用。第二大腦負責分泌全身９０％的５－羥色胺（能夠緩解焦慮和抑鬱、讓人感到滿足的神經遞質），以及５０％以上的多巴胺（與興奮、學習和獎勵相關的神經遞質）。一旦腸道微生物平衡被擾亂，病原微生物就可能從很多方面干擾這些神經遞質的分泌，包括消耗提振情緒的營養素，或分泌有毒物質來干擾激素和維生素的合成。\n\n如果無法分泌適當水平的神經遞質，我們就更容易感到高度緊張和壓力，產生慢性憤怒、成癮、焦慮、抑鬱等心理問題。\n\n這些機制執行起來，對壓力的反應就會越明顯。分泌出的壓力激素越多，炎症就會越嚴重，這就會進一步刺激胃黏膜，增加腸漏症的發生風險，而這些腸漏症會導致病原菌的增加和酵母菌過度繁殖。《腸道》２０１４年的一項研究發現，情緒或心理壓力會極大增加患腸漏症和炎症性腸病的風險。即使短時壓力也會觸發腸漏症或使腸漏症惡化。\n\n我們都想擁有高效的生活，但是一不小心就很容易把自己推向崩潰的邊緣。腸道實際上是身體感受壓力破壞作用的第一個部分，而一旦腸道粘膜受到破壞，其導致的炎症可能使下一次壓力反應進一步惡化。\n\n有無數研究顯示，抑鬱與健康問題相關，如腸道易激綜合徵、慢性疲勞綜合徵、、慢性疼痛、成癮、胰島素抵抗和肥胖等。急性壓力觸發的激素改變會刺激病原細菌的繁殖，減少益生菌，導致腸漏症發病率升高，讓那些讓人緊張的微生物擴散到全身各處。\n\n這些機制會不斷迴圈。我們已經瞭解到一個壓力重重的時期怎樣對健康習慣產生多米諾效應。當我們有壓力時，我們通常渴望垃圾食品，沒有攝入足夠營養。一切垃圾食品都會破壞腸壁和微生物群。我們可能難以入睡，這對免疫系統有毀滅效應，會導致炎症增加。炎症能夠產生有毒代謝物，直接影響大腦功能，這有可能讓人更加緊張不安、焦慮和與他人相處不來。血液中過量的皮質醇會大幅度降低鹽酸和消化酶的釋放，有效阻斷腸道吸收營養物質的能力。\n\n腸道中的神經細胞通常產生全身９５％以上的５－羥色胺，這些細胞會失去滋養，無法提供原料來合成讓人高丹舒適的神經遞質。好細菌紛紛餓死，病原菌數量激增；消化過程遭到破壞，人感到非常糟糕，甚至可能感到壓力更大。\n\n記住，腸道－大腦交流渠道是雙向的：腸道會與大腦交流，大腦也會與腸道交流。", "c": "情緒腸道", "k": "肚子裡有上百萬條神經，叫「第二大腦」，身體大部分讓人開心的血清素都在腸道做出來。壓力大會讓腸子受傷、壞菌變多，壞菌又讓心情更差、更想吃垃圾食物、睡不好，形成惡性循環。腸道和大腦會互相講話。", "m": ["壓力與腸道", [["第二大腦", ["90%血清素", "50%多巴胺"]], ["壓力影響", ["腸漏", "壞菌增加", "發炎"]], ["惡性循環", ["想吃垃圾食物", "失眠", "焦慮"]], ["皮質醇", ["降低胃酸消化酶", "吸收變差"]], ["雙向", ["腸↔腦"]]]], "f": [["壓力", "皮質醇上升"], ["腸道受損", "腸漏、壞菌增加"], ["血清素減少", "情緒低落"], ["想吃垃圾食物/失眠", "更傷腸"], ["打破循環", "減壓＋養腸"]], "p": [{"no": "047", "n": "刺五加（膠囊）", "pr": "NT$495", "nd": ["壓力", "體力", "適應力"], "w": "刺五加支持壓力適應，壓力大時幫助身體穩住，減少腸道受到的衝擊。"}, {"no": "096", "n": "孢子益生菌（加亞麻仁渣）（6g×30包）", "pr": "NT$650", "nd": ["菌相", "腸道", "免疫"], "w": "孢子益生菌補回好菌；第二大腦做出 90% 血清素，好菌多心情更穩。"}, {"no": "054", "n": "GABA（膠囊）", "pr": "NT$540", "nd": ["睡眠", "情緒", "放鬆"], "w": "GABA 支持放鬆，打斷「壓力→腸漏→更焦慮」的循環。"}], "a": [{"no": 70, "n": "皮質醇系統", "u": "https://membership-app-e2147.web.app/lifeos/cortisol-system.html", "cat": "醫學生／醫學健康 / 健康", "w": "皮質醇系統看懂壓力激素如何影響腸道與情緒。"}, {"no": 64, "n": "情緒生命 OS 完整版", "u": "https://membership-app-e2147.web.app/lifeos/emotion-life-os-full.html", "cat": "情緒心理／信念療癒 / 心理", "w": "情緒生命 OS 完整版練習調整焦慮與壓力反應。"}]}, {"id": 34, "t": "免疫系統與腸漏的關係，寫的太棒了！必讀篇", "d": "5月12日", "g": ["自身免疫性", "瞭解自己的身體", "瞭解疾病的根源", "健康管理", "人體免疫力", "腸漏症"], "b": "腸漏發生之前，免疫系統的職責是非常清晰的。先天免疫系統是人體的第一道防線，它就像一隻守門犬，對任何直接威脅迅速做出反應，但準確率並不總是１００％。先天免疫系統會幫助人體從腳腂扭傷等急性傷害和一般感冒等急性感染中恢復。\n\n後天免疫系統的功能更像偵探獵犬或警犬，它會根據以前的接觸記住一種“氣味”（或者在這種情況下是記住一種病原體），下次遇到時會接觸某些微生物激活。接觸到病毒時，後天免疫系統會“記住”它，下次接觸時就會迅速將其識別出來並有效處理。\n\n後天免疫系統可以透過免疫接種方式激活。現代社會中，談到免疫，我們會立即想到流感疫苗等疫苗，我們把這些疫苗當作免疫系統的唯一方式。但是天然免疫存在的時間更長，要從我們發展出後天免疫系統開始算。\n\n例如，接觸當地花粉帶來的有益微生物時，後天免疫系統會“記住”這些微生物，下次接觸時就會迅速識別出來。這就是為何透過當地蜂蜜接觸微量花粉或附近自然環境中散步可以幫助免疫系統記住特定的花粉，以便到過敏季節時免疫系統不會過度反應。\n\n你的腸道相關淋巴組織佔免疫系統的７０％，每天都會篩選腸道中所有的過客，判斷敵友。這些系統相互合作，保護人體免受病痛折磨。\n\n但是，當腸道變得具有滲透性後，事情就難以預料了。有害抗原一旦拿到連蛋白這把這些鑰匙開啟腸道上的緊密連線，就會透過腸道粘膜進入血液迴圈。反覆接觸連蛋白會使這道大門一直敞開，越來越多的毒素、難以控制的分子很快就會開始從這裡透過，包括病毒、原蟲、酵母菌、麩質和其他令人煩惱的食物蛋白，都會進入人體肆虐，造成嚴重傷害。\n\n由於大規模危險細菌入侵，後天和先天免疫系統就會進入過載狀態，努力保證人體安全。免疫系統保持在“開啟”狀態，胡亂用抗體攻擊它遇到的所有東西，包括自身的組織。\n\n甲狀腺等器官也會被友軍的炮火攻擊，組織和細胞會受到損傷。這些細胞需要被清除到體外，你猜猜是誰來負責清理工作呢？當然是免疫系統了，同時免疫系統還會製造出特異特異抗體，清除受損的甲狀腺細胞。然而，如果這個過程不斷反覆，“清除型”抗體就會變得有些過度警惕，轉變為“攻擊型”抗體，即使健康的甲狀腺細胞也會被當作入侵者清除。最終，甲狀腺就成為這場戰爭的附帶犧牲品，而戰爭是從腸道上的大門開始的。但你可能直到被診斷為橋本氏甲狀腺炎時才會發現。", "c": "免疫腸道", "k": "身體70%的免疫部隊住在腸道。腸漏時，連蛋白把腸子的門打開，病毒、麩質等壞東西跑進血液，免疫系統忙到亂攻擊，連自己的器官（像甲狀腺）也被誤傷，可能變成橋本氏甲狀腺炎。", "m": ["腸漏與免疫", [["兩種免疫", ["先天=守門犬", "後天=警犬"]], ["自然免疫", ["在地蜂蜜花粉", "大自然散步"]], ["腸道淋巴", ["占免疫70%"]], ["腸漏後", ["門常開", "異物入血"]], ["自體免疫", ["誤攻甲狀腺", "橋本氏"]]]], "f": [["腸漏", "連蛋白開門"], ["異物入血", "病毒、麩質"], ["免疫過載", "持續開啟"], ["誤傷自己", "攻擊甲狀腺"], ["自體免疫疾病", "橋本氏甲狀腺炎"]], "p": [{"no": "094", "n": "D3（2000IU＋A＋E）（錠）", "pr": "NT$580", "nd": ["免疫", "眼睛", "肌膚", "骨骼"], "w": "D3（2000IU＋A＋E）支持免疫平衡，腸道淋巴占全身免疫 70%。"}, {"no": "081", "n": "5R腸胃營養素（6g×30包）", "pr": "NT$750", "nd": ["腸道", "腸黏膜", "消化", "修復"], "w": "5R 腸胃營養素支持腸黏膜修復，從源頭關上腸漏的門。"}, {"no": "086", "n": "一為（膠囊）", "pr": "NT$680", "nd": ["免疫", "修復", "平衡"], "w": "一為定位於免疫、修復與平衡節點，作為免疫保養補充。"}], "a": [{"no": 88, "n": "整合醫學 OS 版本", "u": "https://membership-app-e2147.web.app/platform/health-medicine/integrated-medicine-os-variant.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "整合醫學 OS 理解腸漏與自體免疫（如橋本氏）的連結。"}, {"no": 93, "n": "淋巴完整系統", "u": "https://membership-app-e2147.web.app/platform/health-medicine/lymphatic-complete-system.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "淋巴完整系統延伸了解免疫防線。"}]}, {"id": 35, "t": "你為什麼得腸漏？這篇筆記講得很清楚！！！", "d": "5月7日", "g": ["消化與吸收", "自身免疫性", "腸漏", "消化系統", "胃酸", "胃"], "b": "腸道是消化系統的主角，它是一條由多種器官組成的空中管道，長達約９米，相當於３層樓的高度。除了腸道外，消化過程還需要肝臟、胰腺、膽囊、神經和迴圈系統，還有腸道維生物群的參與。這些器官、激素、神經，體液和維生物聯合幫助我們從食物和飲料中汲取營養，最終幾乎對人體健康的各個方面都有巨大影響。\n\n我們一般認為胃酸是不好的，但是胃分泌的天然鹽酸對人體有益。鹽酸這種清澈而有刺激性的溶液有強大的功能，甚至可以腐蝕金屬，但是在人體內，它可以殺死有害細菌，幫助胃消化酶分解蛋白質。如果胃未產生足夠胃酸，就可能導致胃酸反流，小腸細菌過度繁殖的風險會提高，而這正是腸漏主要的起因之一。\n\n進食時，膽囊應該將膽汁透過膽管送入小腸，膽汁在小腸內將脂肪分解，以便小腸液和胰液能夠消化脂肪。但是如果膽囊被切除，小腸消化脂肪的工作量增加一倍（這是腸漏症的另一個風險因素）。胰腺是一個海綿狀管形器官，長約１５釐米，與肝臟和膽囊透過一根膽總管相連。提到胰腺時，多數人都會想到胰島素，但是胰腺還會向小腸分泌消化酶，用於消化脂肪、蛋白質和碳水化合物。\n\n如果胃酸不足或消化酶不足，未被充分分解的食物顆粒就會進入小腸。這些未消化的食物會為腸道中的細菌提供過剩的營養，這會造成腸道維生物群失衡，阻礙營養物的正常吸收，導致多種維生素和礦物質缺乏。\n\n腸壁所消耗的能量占人體能量的４０％。腸壁有很多功能，其中兩個最重要的功能，一是保持開放，使身體將體液和營養物質吸收進入血液；二是作為屏障，保護身體免受感染和毒素的侵擾。腸壁有四層，是腸道滲漏發生的位置。\n\n整條腸道中，益生菌和其他微生物一起努力維持著“８５％有益比１５％有害比”的平衡。\n８５％的中性或有益菌的主要作用是填滿腸壁空間，防止有害微生物定居。這道屏障一直都在甄別好壞，調動恰到好處的免疫反應，打擊那些壞傢伙。\n\n調節腸道微生物與免疫系統間的完美平衡，保護人體免受外來源的入侵，同時還會為人體提供營養，這真是令人驚訝。正常情況下，腸壁細胞的緊密連線能夠做出完全正確的判斷，分辨敵友，而我們甚至都意識不到這個篩選過程一直在進行。如果遊離的病毒或病原體偷偷溜過了這道大門，免疫系統會立即行動，迅速清除威脅。但是，如果這些緊密連線開始不斷損壞，就會產生腸漏。", "c": "腸道健康", "k": "腸子長約9公尺像三層樓高。胃酸其實是好東西，能殺壞菌、幫忙分解蛋白質；胃酸或消化酶不夠，沒消化完的食物會餵壞菌。健康腸道要「85%好菌、15%壞菌」，好菌把位子佔滿，壞菌就沒地方住。", "m": ["腸漏原因", [["消化系統", ["腸道9公尺", "肝胰膽協作"]], ["胃酸", ["殺壞菌", "分解蛋白"]], ["膽汁/胰酶", ["消化脂肪", "缺乏增加負擔"]], ["未消化食物", ["餵壞菌", "營養缺乏"]], ["菌相", ["85%好:15%壞"]]]], "f": [["胃酸/酵素不足", "消化不完全"], ["食物顆粒進小腸", "餵養壞菌"], ["菌相失衡", "小腸菌過度生長"], ["緊密連接受損", "腸漏"], ["改善", "細嚼慢嚥、補酵素、養好菌"]], "p": [{"no": "035", "n": "全酶", "pr": "NT$880", "nd": ["消化", "吸收"], "w": "全酶支持消化與吸收，減少未消化食物顆粒進入小腸。"}, {"no": "065", "n": "消化（6g×30包，含360mg B3）", "pr": "NT$870", "nd": ["消化", "胃部", "吸收"], "w": "消化粉包聚焦胃部、消化與吸收節點，幫助食物充分分解。"}, {"no": "058", "n": "腸寶（膠囊）", "pr": "NT$485", "nd": ["腸道", "菌相", "免疫"], "w": "腸寶支持菌相與免疫，維持「85% 好菌：15% 壞菌」。"}], "a": [{"no": 71, "n": "功能健康系統", "u": "https://membership-app-e2147.web.app/lifeos/functional-health-system.html", "cat": "醫學生／醫學健康 / 健康", "w": "功能健康系統把胃酸、膽汁、胰酶的分工整理成清楚流程。"}, {"no": 69, "n": "身體訊號系統", "u": "https://membership-app-e2147.web.app/lifeos/body-signals.html", "cat": "醫學生／醫學健康 / 健康", "w": "身體訊號系統讀懂脹氣、胃酸逆流等訊號。"}]}, {"id": 36, "t": "鈣和鎂是這樣的，補鈣有思路了。太長知識了", "d": "5月5日", "g": ["補鈣", "鎂"], "b": "鈣：人體９９％的鈣離子都在骨骼中，餘下１％主要存在於體液（細胞外液）裡。\n\n血液或組織中鈣的濃度如果長期過高，會導致血管和組織鈣化。鈣的主要來源包括綠色蔬菜、豆類和全穀物類。成人每年需要大約１０００毫克的鈣。普通人的鈣吸收率在２５％左右，孕後期可達５０％或更高。\n\n因為植物中含有膳食纖維、植酸和草酸等抑制鈣、鎂、鋅等二價陽離子吸收的“抗營養素”，很多人認為植物來源的鈣吸收率更低一些。但是最近的研究發現，可溶性膳食纖維反而促進鈣的吸收。含有０.１％植酸的膳食纖維對於礦物質吸收沒有不好的影響。當礦物質攝入足夠，每天２克植酸不影響礦物質平衡。反而，動物蛋白引起的酸性內環境會促進鈣流失。\n\n鎂： 鎂和鈣一起參與多種生化反應。鎂是３００多種酶的輔助因子，參與能量代謝、凝血，支援神經和心臟的功能，維護骨骼和牙齒健康。鎂缺乏與阿爾茲海默病、２型糖尿病、高血壓、心血管疾病、偏頭痛和注意缺陷多動障礙等相關。\n\n鎂主要的來源是深綠色蔬菜、豆類、全穀物類、堅果和一些水果。當攝入過高時，我們的身體會自動加快排出，因此只有在低膳食攝入（比如，多肉飲食）時，鎂平衡才可能受到影響。\n\n磷：磷在人體內以磷酸基團的形式存在，和鈣一起夠成骨骼和牙齒的主要成分。磷酸根夠成了體液的酸鹼緩衝系統之一；磷酸基團還參與合成ＡＴＰ、遺傳物質ＤＮＡ和ＲＮＡ，以及多種細胞內信使分子。磷酸根與脂肪的結合產物——磷脂，還是細胞膜的核心。\n\n食物的磷含量都很充分，需要擔心的時過量，慢性腎病病人更要注意。碳酸飲料和動物性食物中的磷更容易被吸收，這對於維持體內的磷平衡不利。\n\n硫：硫是維生素Ｂ１的夠成元素之一，也是蛋氨酸和半胱氨酸的核心元素。蛋白質是人體硫元素最主要的來源和去處。在一個蛋白質分子內部，或者兩個蛋白質分子之間，兩個半胱氨酸透過形成二硫鍵，幫助穩定蛋白質的三位結構。我們的皮膚、頭髮、指甲等含有較多的半胱氨酸。半胱氨酸還是人體自身抗氧化系統——谷胱甘肽的基本成分之一。\n\n動物性食物的含硫氨基酸比例較高。超過身體需求的硫最終將被代謝為硫酸，從而增加體內微環境的酸度。\n\n最近的研究發現，心血管系統的多種細胞可以合成微量硫化氫。後者作為細胞間信使，介導一系列保護心血管的生化反應，包括抗氧化、抗凋亡、促血管生成、舒張血管等。\n\n但在腸道內，由一種非益生菌生成的硫化氫，反而促進腸道炎症和腸漏。", "c": "營養素", "k": "鈣大部分在骨頭裡，可以從綠色蔬菜、豆類、全穀得到。鎂是300多種酵素的小幫手，跟心臟、神經、睡眠有關。磷到處都有，要擔心的是太多（汽水、肉類）。硫存在蛋白質中，但腸道壞菌做出的硫化氫會讓腸子發炎。", "m": ["礦物質", [["鈣", ["99%在骨骼", "蔬菜豆類全穀", "動物蛋白致流失"]], ["鎂", ["300多種酶", "神經心臟", "深綠蔬菜堅果"]], ["磷", ["骨骼ATP DNA", "擔心過量"]], ["硫", ["蛋白質結構", "谷胱甘肽", "腸道硫化氫致炎"]]]], "f": [["均衡攝取", "蔬菜豆類全穀堅果"], ["鈣", "骨骼牙齒"], ["鎂", "酵素、神經、心臟"], ["磷/硫", "避免過量"], ["結果", "骨骼健康、代謝順暢"]], "p": [{"no": "091", "n": "甘氨酸鎂複方粉包", "pr": "NT$1350", "nd": ["睡眠", "神經", "肌肉", "放鬆"], "w": "甘氨酸鎂複方：鎂是 300 多種酵素的輔助因子，支持神經、肌肉與睡眠。"}, {"no": "092", "n": "D3（5000IU）（錠）", "pr": "NT$580", "nd": ["免疫", "骨骼", "鈣代謝"], "w": "D3（5000IU）支持鈣代謝與骨骼，讓鈣用對地方。"}, {"no": "085", "n": "NAC複方（膠囊）", "pr": "NT$530", "nd": ["肝臟", "抗氧化", "呼吸道", "解毒"], "w": "NAC 複方提供半胱胺酸，是體內抗氧化物穀胱甘肽的原料（對應硫的段落）。"}], "a": [{"no": 71, "n": "功能健康系統", "u": "https://membership-app-e2147.web.app/lifeos/functional-health-system.html", "cat": "醫學生／醫學健康 / 健康", "w": "功能健康系統整理鈣、鎂、磷、硫的作用與平衡。"}, {"no": 92, "n": "醫療證據購物 OS", "u": "https://membership-app-e2147.web.app/platform/health-medicine/medical-evidence-shopping-os.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "醫療證據購物 OS 幫你判斷礦物質該不該補、怎麼補。"}]}, {"id": 37, "t": "全面瞭解維生素，以後不要亂補。收藏篇！！", "d": "5月4日", "g": ["營養素缺乏", "營養的重要性", "維生素"], "b": "維生素Ｂ１又叫硫氨酸，在細胞能量代謝中起重要的作用，幫助維持正常的心臟和神經系統功能。缺乏維生素Ｂ１會導致腳氣病，嚴重的可引起心衰。含維生素Ｂ１的食物包括全穀物類、豆類和蔬菜。\n\n維生素Ｂ２又叫核黃素，參與能量代謝並維持正常的粘膜功能。缺乏維生素Ｂ２會發生潰瘍。維生素Ｂ２存在於蔬菜、全穀類、豆類和水果中。\n\n煙酸，也在能量代謝中扮演者重要角色，幫助維持神經和上皮細胞的正常功能。缺乏煙酸的症狀包括舍炎和皮炎。富含煙酸的食物包括全穀物類、水果、鮮菇、綠色蔬菜、堅果等。\n\n泛酸，是能量代謝過程中不可缺少的物質。泛酸可引起皮炎和疲勞。泛酸普遍存在於各種食物中，如蔬菜、水果、全穀物類和豆類。\n\n維生素Ｂ６，參與蛋白質的轉化功能和造血功能。缺乏維生素Ｂ６會導致貧血以及神經損傷。維生素Ｂ６含量較高的食物包括水果、綠色蔬菜、豆類，還有全穀物類。\n\n生物素，有時候也稱維生素Ｈ。它參與能量代謝。缺乏維生素變現為皮炎。生物素也廣泛存在於各種蔬菜、水果、豆類和全穀物類之中。\n\n葉酸，在生化反應中參與一碳單位的傳遞，是ＤＮＡ合成所必需的，對維持神經及心血管系統的正常工作起重要作用。葉酸缺乏，可導致新生兒的神經管畸形，以及惡性貧血、神經損傷、高同型半胱氨酸血癥等病症。葉酸含量高的食物，包括綠色蔬菜、豆類和水果。葉酸容易在加熱烹飪過程中被破壞。\n\n維生素Ｂ１２又叫鈷胺素，其作用是配合葉酸工作，使葉酸再利用。維生素Ｂ１２缺乏也會造成惡性貧血、神經損傷、高同型半胱氨酸血癥。在當代的農耕方式和衛生條件下，維生素Ｂ１２一般不存在於植物性的食物裡；或者少量存在，但是含量和活性未被證實。因此建議素食者口服維生素Ｂ１２補劑以保證人體所需。\n\n值得注意的是，近年的研究發現過多攝入維生素Ｂ６、葉酸及維生素Ｂ１２都有可能增加某些疾病的風險。這種情況多發生於過量服用補劑的人群裡。目前尚無足夠的證據證明風險的增加是維生素的提純產物導致的，還是該人群攝入的食物成分導致的。\n\n維生素Ｃ又叫抗壞血酸，它是抗氧化劑，在免疫細胞的生成和成熟、膠原蛋白的形成，以及鐵的吸過程中都起重要的作用。缺乏維生素Ｃ會導致壞血癥，並且提高白內障的風險。維生素Ｃ多存在於水果蔬菜之中，尤其是柑橘類水果。加熱烹飪也容易破壞維生素Ｃ。", "c": "營養素", "k": "B群維生素是身體「把食物變能量」的小工人，大多在全穀、豆類、蔬菜水果裡。只有B12植物裡很少，吃素的人要補。維生素C幫忙免疫、做膠原蛋白、吸收鐵。重點：不要亂吃大量補充品，過量也可能有風險。", "m": ["維生素", [["B1/B2/菸鹼酸", ["能量代謝", "神經黏膜"]], ["B6/葉酸", ["造血", "DNA合成"]], ["B12", ["植物缺乏", "素食者需補"]], ["維生素C", ["抗氧化", "膠原蛋白", "鐵吸收"]], ["提醒", ["過量補劑有風險"]]]], "f": [["吃原型食物", "全穀豆蔬果"], ["B群", "能量代謝"], ["B12", "素食者補充"], ["維生素C", "免疫膠原"], ["不亂補", "依需求適量"]], "p": [{"no": "087", "n": "超級B群（膠囊）", "pr": "NT$520", "nd": ["能量", "神經", "代謝"], "w": "超級 B 群支持能量代謝與神經功能，對應 B1、B2、菸鹼酸、泛酸的角色。"}, {"no": "053", "n": "神經營養素（B1＋B3＋B6）", "pr": "NT$540", "nd": ["神經", "腦部", "能量"], "w": "神經營養素（B1＋B3＋B6）聚焦神經與腦部，對應 B6 與神經保養。"}, {"no": "066", "n": "裸藻（膠囊）", "pr": "NT$480", "nd": ["營養", "腸道", "免疫"], "w": "裸藻提供多元營養，作為蔬菜之外的營養補充。"}], "a": [{"no": 92, "n": "醫療證據購物 OS", "u": "https://membership-app-e2147.web.app/platform/health-medicine/medical-evidence-shopping-os.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "醫療證據購物 OS 對應「以後不要亂補」，依需求與劑量挑選。"}, {"no": 71, "n": "功能健康系統", "u": "https://membership-app-e2147.web.app/lifeos/functional-health-system.html", "cat": "醫學生／醫學健康 / 健康", "w": "功能健康系統整理各種維生素的功能與食物來源。"}]}, {"id": 38, "t": "吃進去的都有農殘？有效去除農殘的方法！！", "d": "4月14日", "g": ["構建與食物的關係", "健康管理", "農殘"], "b": "大量化學品的使用造成農業汙染。這些化學品的使用對人體的影響程度可能很高，很多農藥不僅汙染農作物表面，還會被農作物吸收，進入其內部。\n\n磷肥中的鎘含量很高。中國科學院的研究表明，相對於其他土地利用型別的土壤，菜地、稻田、果園的鎘含量顯著提高，表現出一定的積累特徵。研究分析發現，磷肥的使用可顯著提高作物的鎘含量。攝入被鎘汙染的食物可提高腎臟損傷，骨密度降低和細胞癌變的風險。\n\n有些農藥不易降解，是長期環境汙染物。它們造成的汙染可能會存在於多年後種植的作物上，而且還會在食物鏈中富集。\n\n富集作用指的是食物所含的毒素容易攝入，不易排出和分解，就會隨著時間的推移、進食的次數增加而積累在動物體內。\n\n養殖動物，比如豬，在它的一生５個月中（沒錯５個月可以長到９０～１２０千克），每天都在吃含有農藥和各種環境汙染物的飼料。豬的一生要吃幾百斤飼料，其中排不出、代謝不掉的農藥代謝產物和環境毒素就會富集在豬的體內，這些毒素很難透過日常手段清除。\n\n進入食物內部的農殘很難去除，但我們可以透過簡單的日常方法去除食物表面的大部分農殘。當前施用最多的農藥包括有機磷和有機氯兩大類。\n\n對於有機磷農藥，使用５％的醋酸、食鹼或食鹽溶液浸泡１０分鐘後再清洗，可以非常有效地去除（去除率可以達到或接近１００％）。而自來水清洗１０分鐘只能去除１２～１３％．\n\n去除有機氯農藥，酸性和鹼性溶液比食鹽或氧化氫溶液更有效。酸性溶液中，醋的效果不如檸檬酸或維生素C溶液，而５％的蘇打水比食醋的效果更好（可達９０％）。自來水的去除能力只有１０％。\n\n“葷素搭配”是最沒有資訊量詞之一。是的飲食不是葷素搭配呀，除非你是鈉不到１％的純素食者。\n\n到底葷食和素食在我們膳食結構裡各搭配了什麼東西，這些東西對我們的健康有沒有益。\n\n植物性食物可以提供什麼？碳水化合物、蛋白質、不飽和脂肪酸；維生素、礦物質；膳食纖維；抗氧劑、植物化學物質．．．這些重要的營養素，植物性食物都可以提供。\n\n動物性食物可以搭配什麼？\n① 膽固醇：堵塞我們的血管．．\n② 飽和脂肪酸、反式脂肪酸：導致糖尿病、肥胖、心血管疾病、腸漏綜合徵。\n③ 動物蛋白：促進癌症、鈣流失、腎結石．．．\n激素、抗生素、重金屬．．．．", "c": "食品安全", "k": "很多農藥會附在蔬果表面，有的還會被吸進去。用清水沖10分鐘只能洗掉一成多，用5%的醋、小蘇打或鹽水泡10分鐘，效果好很多。動物吃了含農藥的飼料，毒素會越積越多（富集作用）。", "m": ["去除農藥殘留", [["污染來源", ["農藥", "磷肥含鎘"]], ["富集作用", ["食物鏈累積", "豬5個月吃幾百斤飼料"]], ["有機磷", ["醋/鹼/鹽水泡10分鐘", "近100%"]], ["有機氯", ["5%小蘇打90%", "清水僅10%"]], ["植物性食物", ["營養全面"]]]], "f": [["買回蔬果", "表面有農殘"], ["浸泡10分鐘", "小蘇打/醋/鹽水"], ["流水沖洗", "洗掉溶出物"], ["去皮/燙煮", "再降低"], ["安心吃", "少接觸毒素"]], "p": [{"no": "085", "n": "NAC複方（膠囊）", "pr": "NT$530", "nd": ["肝臟", "抗氧化", "呼吸道", "解毒"], "w": "NAC 複方支持肝臟解毒與抗氧化，幫身體處理已吃進去的殘留物。"}, {"no": "077", "n": "肝寶（膠囊）", "pr": "NT$550", "nd": ["肝臟", "解毒", "代謝"], "w": "肝寶聚焦肝臟解毒與代謝節點。"}, {"no": "079", "n": "憂遁草粉", "pr": "NT$750", "nd": ["植物營養", "抗氧化", "免疫", "代謝"], "w": "憂遁草粉提供植化素與抗氧化，多吃植物性營養。"}], "a": [{"no": 92, "n": "醫療證據購物 OS", "u": "https://membership-app-e2147.web.app/platform/health-medicine/medical-evidence-shopping-os.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "醫療證據購物 OS 幫你辨識農殘、重金屬等風險資訊。"}, {"no": 67, "n": "健康負熵 APP", "u": "https://membership-app-e2147.web.app/lifeos/health-negentropy-app.html", "cat": "醫學生／醫學健康 / 健康", "w": "健康負熵 APP 規劃清洗方法與日常飲食。"}]}, {"id": 39, "t": "關於降低血脂，看這本書會有收穫！必讀篇！", "d": "4月13日", "g": ["改善高膽固醇", "多不飽和脂肪酸", "血脂", "飲食與健康"], "b": "膽固醇升高會促進動脈硬化，繼而增加心臟病的風險。\n\n降低血液膽固醇就可以降低心臟病的風險。那麼“好的”膽固醇，即高密度脂蛋白膽固醇呢？在人體內，高密度脂蛋白負責把膽固醇從全身運會肝臟。高密度脂蛋白就好比身體的垃圾場，當垃圾多的時候增加垃圾車是好事情，但是如果垃圾不多就不需要很多垃圾車了。\n\n高密度脂蛋白被氧化後，也會促進動脈硬化。因此高密度脂蛋白高低不是最重要的因素，降低總膽固醇和低密度脂蛋白才是關鍵。\n\n因為人體不能分解膽固醇，要降低膽固醇就要考慮低膽固醇的攝入和合成，增加膽固醇的排出。\n遵循零膽固醇、低飽和脂肪、高纖維的全植物飲食者，其總膽固醇和低密度脂蛋白指標都顯著降低。這些指標隨含肉的飲食、含魚的飲食、含蛋奶的植物飲食、全食物飲食的趨勢遞減。\n\n研究發現，累積攝入蛋黃越多的人，頸動脈硬化的情況越嚴重。蛋黃攝入對頸動脈硬化的影響堪比吸菸。\n\n需要強調的是，動物性食物和高脂食物是導致高膽固醇血癥的最重要因素。因此降低膽固醇，預防和逆轉心臟病的最佳飲食方案是低脂（無油全植物飲食）。\n\n身體在攝入飽和脂肪酸後，肝臟會合成更多的膽固醇以應對預期的細胞膜流動性下降，於是血液膽固醇就會升高。攝入飽和脂肪酸會升高膽固醇，已經被多項大規模的研究證實。\n\n除了升高血液膽固醇，飽和脂肪酸的攝入還會促進腸道非益生菌的生長，引起腸漏和系統性血管炎症，誘發動脈硬化、心血管疾病、腦血管疾病等。\n\n含飽和脂肪酸的典型食物包括豬油、、黃油和奶製品中的主要脂肪。動物性食物的飽和脂肪酸含量普遍很高，即使看上去並不肥膩的瘦肉和魚肉，它們含有１５％～４０％的脂肪酸。在植物性食物中，棕櫚油、椰子油、氫化植物油的成分主要是飽和脂肪酸。\n\n氫化植物油被廣泛用於加工烘焙食品，如蛋糕、餅乾、薯片、爆米花等食品中。人造黃油、起酥油、奶精等的主要成分也都是氫化植物油。\n\n反式脂肪酸會促進血液膽固醇的生成。洋快餐中油炸食品和動物製品都是反式脂肪酸的重要來源。", "c": "心血管健康", "k": "膽固醇高會讓血管變硬，增加心臟病風險。「好膽固醇」像垃圾車，垃圾少時不需要很多車，所以重點是降低總膽固醇和壞膽固醇。少吃飽和脂肪（豬油、奶油、肥肉）、反式脂肪（餅乾、奶精、炸物）和蛋黃，多吃高纖植物。", "m": ["降低血脂", [["關鍵", ["降總膽固醇", "降LDL"]], ["HDL", ["像垃圾車", "氧化也有害"]], ["飽和脂肪", ["豬油奶油", "肝合成更多膽固醇"]], ["反式脂肪", ["氫化油", "烘焙炸物奶精"]], ["飲食", ["零膽固醇", "低脂高纖"]]]], "f": [["吃飽和/反式脂肪", "膽固醇上升"], ["LDL增加", "沉積血管"], ["動脈硬化", "心臟病風險"], ["改高纖植物飲食", "零膽固醇"], ["血脂下降", "血管更健康"]], "p": [{"no": "097", "n": "亞麻仁油（500cc×2瓶）", "pr": "NT$780", "nd": ["Omega-3", "心血管", "抗氧化"], "w": "亞麻仁油提供植物 Omega-3，取代豬油、奶油等飽和脂肪。"}, {"no": "052", "n": "血循環", "pr": "NT$1350", "nd": ["循環", "心血管", "末梢循環"], "w": "血循環支持心血管與循環，搭配低脂高纖飲食。"}, {"no": "033", "n": "亞麻仁籽渣（2包）", "pr": "NT$198", "nd": ["腸道", "膳食纖維"], "w": "亞麻仁籽渣補充纖維，增加膽固醇的排出。"}], "a": [{"no": 72, "n": "健康診斷系統", "u": "https://membership-app-e2147.web.app/lifeos/health-diagnosis.html", "cat": "醫學生／醫學健康 / 健康", "w": "健康診斷系統看懂總膽固醇與 LDL 指標。"}, {"no": 91, "n": "代謝控制儀表板", "u": "https://membership-app-e2147.web.app/platform/health-medicine/metabolic-control-dashboard.html", "cat": "醫學生／醫學健康 / 健康醫療", "w": "代謝控制儀表板追蹤飲食油脂與血脂變化。"}]}, {"id": 40, "t": "關於蛋白質這篇筆記講的太清楚了，收藏篇！", "d": "4月8日", "g": [
