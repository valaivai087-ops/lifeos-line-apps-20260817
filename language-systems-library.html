],["p","173｜都是我的錯→哪些是我的責任？哪些不是？"],["p","174｜如果當初……→我不能重跑昨天，但可以修改下一次決策。"],["p","175｜我浪費好多時間→剩下的時間要如何重新配置？"],["p","176｜我很內疚→我是否真的造成傷害？如果有，可以怎麼修復？"],["p","177｜我不能原諒自己→承擔責任與永久懲罰自己是兩件事。"],["p","178｜我做過錯事，所以我是壞人→行為需要負責，但人格不必被單一事件永久定義。"],["p","179｜我好羞愧→我正在害怕哪部分的自己被別人看見？"],["p","180｜我不想面對→我可以先面對最小的一部分。"],["p","181｜我壓力好大→壓力來自哪些具體負荷？"],["p","182｜我快被工作壓垮→哪些任務可以刪除、延後、授權或簡化？"],["p","183｜事情永遠做不完→我需要的可能不是做完，而是排序。"],["p","184｜我不能休息→如果不恢復，未來輸出會付出什麼成本？"],["p","185｜我休息會有罪惡感→恢復不是偷懶，而是系統維護。"],["p","186｜我一定要撐住→我可以先辨識哪些部分不需要硬撐。"],["p","187｜我不能倒下→真正的韌性也包含知道何時求援。"],["p","188｜我好煩→我現在接收的刺激是不是太多？"],["p","189｜我腦袋停不下來→哪些問題需要現在處理，哪些可以先記錄？"],["p","190｜我晚上一直想事情→我可以把未完成事項移到紙上，而不是全部放在工作記憶。"],["p","191｜我睡不著，明天完了→今晚睡不好可能影響明天，但不等於明天一定失敗。"],["p","192｜我今天心情差，什麼都做不了→我可以選一件低能耗但重要的事。"],["p","193｜我完全沒有動力→我先不等動力，降低第一步摩擦。"],["p","194｜我什麼都不想管→我現在最需要保住哪個基本系統？"],["p","195｜我想逃走→我想逃離的是哪個壓力來源？"],["p","196｜我不想面對現實→現實中哪一部分最難接受？"],["p","197｜我覺得人生失控→現在還有哪些變數在我的控制範圍？"],["p","198｜事情越來越糟→哪些指標真的惡化？哪些只是我的整體感受？"],["p","199｜我看不到希望→我現在需要的可能不是希望，而是下一個可行入口。"],["p","200｜我一定要馬上好起來→我的目標先從「立刻恢復」改成「今天降低一點系統負荷」。"],["h",2,"《第三區｜婚姻、愛情與關係201—300》"],["p","201｜他根本不愛我→哪些具體行為讓我產生不被愛的感受？"],["p","202｜他如果愛我就應該懂→愛不等於讀心，我需要把需求說清楚。"],["p","203｜他都不知道我要什麼→我有沒有具體告訴他？"],["p","204｜真正愛我的人不用我說→成熟關係需要資訊交換，不靠猜測。"],["p","205｜他從來不陪我→最近我們實際有多少共同時間？"],["p","206｜他寧願做別的也不陪我→我想要的是時間、專注還是情感連結？"],["p","207｜他心裡根本沒有我→哪些行為支持這個判斷？哪些不支持？"],["p","208｜我對他不重要→我要用哪些可觀察行為定義「重要」？"],["p","209｜他變了→具體是哪三個行為和以前不同？"],["p","210｜以前他不是這樣→關係系統的哪些條件改變了？"],["p","211｜他對我越來越冷淡→互動頻率、回應品質還是親密程度下降？"],["p","212｜他不在乎我的感受→我表達感受後，他具體怎麼回應？"],["p","213｜他根本不想聽我說→我要確認他是拒絕溝通，還是當下沒有容量？"],["p","214｜他每次都敷衍我→哪些回應讓我感到敷衍？"],["p","215｜他只顧自己→哪些需求分配長期失衡？"],["p","216｜他很自私→描述他的具體行為，而不是先定義人格。"],["p","217｜他就是沒責任感→哪些責任反覆沒有完成？"],["p","218｜他永遠不會改→目前哪些模式長期沒有改變？"],["p","219｜我要改變他→我能改的是我的界線、回應與選擇。"],["p","220｜我說了那麼多次他都不改→目前的溝通方法沒有產生有效回饋。"],["p","221｜為什麼他就是聽不懂→我要換表達方式，還是他根本不同意？"],["p","222｜他故意氣我→我有證據知道他的意圖嗎？"],["p","223｜他就是故意的→先區分行為造成的影響與他的真正意圖。"],["p","224｜他講話就是要傷我→這句話對我造成傷害，我可以直接說明界線。"],["p","225｜他每次都這樣→「每次」可以改成具體頻率。"],["p","226｜他從來沒為我做過什麼→先檢查「從來」是否符合事實。"],["p","227｜我為他付出那麼多→我的付出是自願、交換還是期待回報？"],["p","228｜他欠我的→我們之間有哪些未被說清楚的期待？"],["p","229｜我犧牲這麼多→哪些犧牲其實需要重新協商？"],["p","230｜愛就是犧牲→成熟的愛也需要邊界與可持續性。"],["p","231｜夫妻就是要什麼都一起→健康關係也需要個體空間。"],["p","232｜他有自己的時間就是不愛我→自主與親密可以同時存在。"],["p","233｜他不秒回就是不重視我→回覆速度只是關係訊號之一。"],["p","234｜已讀不回就是故意冷落→先確認情境，再解讀意圖。"],["p","235｜他今天沒找我→一天的行為不足以定義整段關係。"],["p","236｜他沒說愛我→我要辨識他主要用什麼方式表達愛。"],["p","237｜他不送禮物就是不在乎→我要的是禮物本身，還是被記得的感覺？"],["p","238｜他不願意花錢就是不愛我→金錢使用可能涉及價值觀、資源與安全感，需要具體討論。"],["p","239｜他不陪我就是不愛我→陪伴是重要訊號，但需要看長期互動結構。"],["p","240｜他不懂浪漫→我們對浪漫的定義可能不同。"],["p","241｜我們個性不合→具體是哪幾種需求或互動方式衝突？"],["p","242｜我們價值觀不同，沒救了→哪些價值差異可以協商？哪些是核心邊界？"],["p","243｜我們一直吵架→爭吵通常在哪個循環開始？"],["p","244｜每次講話都變吵架→哪一句開始讓系統從合作切換成防衛？"],["p","245｜他一開口我就生氣→哪種語氣或內容是我的高敏感觸發點？"],["p","246｜看到他就煩→目前累積了哪些尚未處理的關係負荷？"],["p","247｜我不想跟他說話→我需要暫停，還是已經不願意修復？"],["p","248｜我們沒話聊了→共同經驗、好奇心還是安全感下降？"],["p","249｜感情淡了→親密感的哪些輸入減少了？"],["p","250｜愛消失了→是情緒強度下降，還是關係品質真的惡化？"],["p","251｜婚姻就是這樣→這只是目前的關係運作版本。"],["p","252｜結婚久了都會變淡→長期關係需要新的輸入與共同成長。"],["p","253｜他不可能理解我→我可以先測試一次更具體的表達。"],["p","254｜說了也沒用→我要先定義什麼結果才叫「有用」。"],["p","255｜算了，不想講了→我現在是不想講，還是不知道怎麼講？"],["p","256｜忍一忍就過去了→這是短期波動，還是反覆出現的結構問題？"],["p","257｜為了家庭只能忍→還有哪些降低傷害、重新協商或建立界線的選項？"],["p","258｜我不能讓家庭破裂→維持形式與維持健康關係不是完全相同的目標。"],["p","259｜孩子需要完整家庭→孩子更需要的是穩定、安全與可預測的關係環境。"],["p","260｜我不能離開他→我目前有哪些現實限制？哪些可以逐步增加選項？"],["p","261｜沒有他我活不下去→我需要重建哪些獨立能力與支持網絡？"],["p","262｜我只有他→我要逐步增加自己的關係與資源節點。"],["p","263｜他就是我的全部→親密關係很重要，但不需要承載人生全部功能。"],["p","264｜我一定要抓住他→真正穩定的關係不是靠控制維持。"],["p","265｜我怕他離開→我要區分失去關係的痛苦與失去自我的恐懼。"],["p","266｜我要查他的手機才安心→我要的是短期確定感，還是長期信任？"],["p","267｜我控制他是因為我愛他→控制主要降低的是自己的不確定感。"],["p","268｜我不能讓他跟別人出去→我要談的是界線，而不是所有權。"],["p","269｜他跟異性說話我就不舒服→我的威脅模型正在預測什麼？"],["p","270｜我一定比不上別人→關係不是單一排名競賽。"],["p","271｜他會不會遇到更好的人→真正問題是我們的關係品質是否值得雙方留下。"],["p","272｜我要變完美他才不會離開→沒有任何完美可以保證別人的選擇。"],["p","273｜我要一直討好他→討好換來的穩定通常非常脆弱。"],["p","274｜我不能惹他生氣→對方的情緒不是全部由我負責。"],["p","275｜他生氣一定是我的錯→先分離他的情緒與我的責任。"],["p","276｜我一定要讓他開心→我可以關心他的情緒，但不能代替他調節。"],["p","277｜夫妻不能有秘密→成熟關係需要誠實，也需要合理隱私。"],["p","278｜愛就不能有界線→沒有界線的愛容易變成耗損。"],["p","279｜拒絕伴侶就是不愛→拒絕某個要求不等於拒絕整個人。"],["p","280｜吵架就是感情不好→衝突本身不是問題，修復能力更重要。"],["p","281｜我們又吵架，完了→這次衝突暴露了哪個未處理節點？"],["p","282｜他不道歉我就不能放下→我希望得到道歉，但我的恢復不能完全交給他控制。"],["p","283｜他一定要承認錯→我需要的是承認、修復還是行為改變？"],["p","284｜道歉了就應該沒事→真正修復還需要後續行為更新。"],["p","285｜他說對不起就夠了→我要觀察新模式是否穩定出現。"],["p","286｜我原諒他就要當沒發生→原諒不等於刪除資料。"],["p","287｜愛一個人就要相信他→信任應該由長期一致行為累積。"],["p","288｜我不信任他是我的問題→信任是雙方互動生成的系統狀態。"],["p","289｜我要給他機會→機會最好伴隨可觀察的更新條件。"],["p","290｜他說會改，我就相信→承諾是訊號，持續行動才是證據。"],["p","291｜感情靠感覺→長期關係也靠能力、結構與維護。"],["p","292｜沒有激情就是不愛→激情與依附、承諾、親密不是同一變數。"],["p","293｜找到對的人就不會吵架→再適合的人也需要溝通與修復能力。"],["p","294｜真愛不需要經營→越重要的系統越需要維護。"],["p","295｜我們應該永遠一樣→兩個人都在變，關係模型也需要更新。"],["p","296｜他以前答應過→過去承諾需要放進現在條件重新檢查。"],["p","297｜我們已經回不到以前→真正問題不是回去，而是能不能生成更好的下一版。"],["p","298｜我們之間有裂痕→裂痕也是關係系統提供的結構資訊。"],["p","299｜這段關係失敗了→即使關係結束，也可以提取出下一段關係需要的新模型。"],["p","300｜我要找到永遠不會傷害我的人→更成熟的目標是找到願意尊重、修復、更新，也能共同建立安全感的人。"],["h",2,"《第四區｜親子、家庭與教育301—400》"],["p","301｜我的孩子就是不聽話→他目前沒有按照我的指令行動，原因是什麼？"],["p","302｜這孩子很難教→哪個教學或互動節點沒有對上？"],["p","303｜他就是很懶→他的啟動成本在哪裡？"],["p","304｜他都不讀書→他是不想、不能、不會，還是不知道為何要讀？"],["p","305｜他沒有上進心→目前什麼事情能讓他主動投入？"],["p","306｜他沒有自制力→環境中的誘惑是不是比目標回饋更即時？"],["p","307｜他就是愛玩手機→手機提供了哪些現實生活沒有提供的獎賞？"],["p","308｜手機害了孩子→我要處理的是工具本身，還是使用結構？"],["p","309｜把手機收走就好了→除了限制輸入，也要建立替代行為。"],["p","310｜他成績差就是不用功→先診斷知識、能力、策略、注意力與時間配置。"],["p","311｜考差就是不認真→哪個能力節點在這次考試失效？"],["p","312｜他就是粗心→錯誤發生在讀題、計算、注意還是檢查流程？"],["p","313｜這麼簡單也會錯→對我簡單，不代表對他的系統簡單。"],["p","314｜你怎麼這麼笨→這一題是哪一步沒有理解？"],["p","315｜我講幾次了還不會→重複輸入不等於有效學習。"],["p","316｜背不起來就是記憶力差→先檢查編碼、間隔、提取與睡眠。"],["p","317｜英文差就是單字背太少→還要檢查句法、篇章、推論與閱讀速度。"],["p","318｜閱讀慢就是不熟→是哪個處理節點消耗工作記憶？"],["p","319｜數學差就是沒天分→是哪個前置概念沒有建立？"],["p","320｜他沒有讀書的命→目前學習系統沒有產生正向回饋。"],["p","321｜你看別人都可以→我們先看你和上次相比進步在哪裡。"],["p","322｜你為什麼不能像哥哥→每個人的起點與能力組合不同。"],["p","323｜別人考90你才60→這30分主要掉在哪些題型？"],["p","324｜你讓我很丟臉→這是你的成績，不需要承擔我的面子。"],["p","325｜你考這樣以後怎麼辦→我們先處理下一個可以改善的節點。"],["p","326｜再不用功就完蛋→如果維持現在策略，可能有哪些後果？"],["p","327｜你一定要考第一名→我們先建立真正能複利的能力。"],["p","328｜只有好成績才有未來→成績重要，但只是未來選項的一個變數。"],["p","329｜考不上好學校人生就完了→不同路徑仍可能生成不同機會。"],["p","330｜一定要讀熱門科系→先看能力、興趣、價值與未來環境的匹配。"],["p","331｜你還小不懂→我先聽聽你怎麼理解這件事。"],["p","332｜大人都是為你好→好的意圖也可能使用錯的方法。"],["p","333｜我是你爸媽，你就要聽→權威不能取代解釋與信任。"],["p","334｜不要問那麼多→你的問題很好，我們一起找答案。"],["p","335｜照我說的做就對了→我告訴你我的理由，你也說說你的想法。"],["p","336｜小孩不能頂嘴→孩子可以不同意，但要學會尊重表達。"],["p","337｜你怎麼敢跟我這樣說話→我們先處理表達方式，再處理內容。"],["p","338｜哭什麼哭→你現在很難過，我們先弄清楚發生什麼。"],["p","339｜這有什麼好怕的→我知道對你來說現在真的很可怕。"],["p","340｜不要生氣→你可以生氣，但不能用傷害人的方式表達。"],["p","341｜不准哭→你可以哭，我在這裡。"],["p","342｜男生不能哭→情緒調節不是性別問題。"],["p","343｜女生要乖→我希望你學會判斷，而不是只學會服從。"],["p","344｜你要懂事→我希望你學會哪些具體能力？"],["p","345｜不要給大人添麻煩→有需要時可以求助。"],["p","346｜自己的事情自己處理→先試試看，需要幫忙可以告訴我。"],["p","347｜我都是為了你→這是我的選擇，不需要你背負全部情緒成本。"],["p","348｜我犧牲那麼多都是為你→我的付出不應該變成控制你的債務。"],["p","349｜你長大要報答我→親子關係不是投資回收契約。"],["p","350｜養你有什麼用→孩子的存在價值不等於功能價值。"],["p","351｜你怎麼這麼不孝→具體是哪個行為讓我感到受傷？"],["p","352｜你都不關心家裡→我希望你每週可以做哪件具體事情？"],["p","353｜你從來不幫忙→我們重新分配家庭任務。"],["p","354｜家事本來就是媽媽做→家事可以依時間、能力與公平重新配置。"],["p","355｜爸爸就是負責賺錢→家庭功能不必被固定角色永久綁住。"],["p","356｜哥哥要讓弟弟→公平不等於年長者永遠退讓。"],["p","357｜你是姐姐要懂事→每個孩子都可以有自己的需求。"],["p","358｜小孩不要管大人的事→有些資訊可以依年齡適當解釋。"],["p","359｜我們家就是這樣→家庭模式也可以更新。"],["p","360｜你跟你爸一模一樣→描述具體行為，不用家族標籤定義孩子。"],["p","361｜你遺傳到壞脾氣→穩定傾向存在，但調節能力仍能學習。"],["p","362｜你就是固執→你現在很堅持自己的看法，我想知道原因。"],["p","363｜你很自私→這次你的選擇沒有考慮到別人的需求。"],["p","364｜你很沒禮貌→剛剛哪個行為需要重新調整？"],["p","365｜你就是愛說謊→這次你說的內容和事實不一致，我們來理解原因。"],["p","366｜你是壞孩子→這個行為不可以，但你不等於這個行為。"],["p","367｜你很乖，所以媽媽愛你→我的愛不需要用服從交換。"],["p","368｜你考好我才獎勵你→除了結果，也回饋策略、投入與更新能力。"],["p","369｜你失敗了→這次結果提供了哪些新資料？"],["p","370｜你怎麼又犯錯→這次和上次的錯誤機制一樣嗎？"],["p","371｜不要犯錯→可以犯錯，但要學會讀取錯誤。"],["p","372｜你要一次做好→先做第一版，再修正。"],["p","373｜不要浪費時間試→低風險事情可以透過試錯學得更快。"],["p","374｜我替你決定比較快→讓孩子參與決策，才能生成決策能力。"],["p","375｜你不用想，我幫你處理→我先陪你拆解，再讓你自己做下一步。"],["p","376｜我怕你吃苦→適量可承受的困難也是能力生成環境。"],["p","377｜我不能讓孩子失敗→我要讓他在可承受範圍內學習失敗。"],["p","378｜我一定要保護他→保護的終點應該是增加他的自主能力。"],["p","379｜我幫他做比較快→短期效率可能換來長期依賴。"],["p","380｜孩子不需要知道錢→可以依年齡學習資源配置與機會成本。"],["p","381｜你想買就買→先問這是需要、想要還是衝動？"],["p","382｜我們家沒錢→目前這筆支出不在我們的資源優先順序。"],["p","383｜有錢人家的孩子比較幸福→資源重要，但幸福還受關係、安全感與能力影響。"],["p","384｜不要跟有錢人比→比較可以存在，但要提取資訊而不是否定自己。"],["p","385｜讀書就是為了賺錢→學習也在增加理解世界與選擇人生的能力。"],["p","386｜你以後就知道→我現在先告訴你我看到的風險。"],["p","387｜你不聽老人言→經驗是資料，不是永遠正確的命令。"],["p","388｜我們以前都是這樣過來的→以前有效的模型不一定適合現在環境。"],["p","389｜以前小孩哪有這麼多問題→環境改變，問題的生成條件也會改變。"],["p","390｜現在孩子抗壓性太差→我們要區分壓力暴露與壓力調節能力。"],["p","391｜多吃苦才會成長→可承受挑戰加上回饋與支持，才更容易生成能力。"],["p","392｜罵一罵才會進步→恐懼可能提高短期服從，不一定提高長期學習。"],["p","393｜嚴格就是愛→愛可以有要求，但要求需要安全感與合理邊界。"],["p","394｜稱讚越多越好→回饋要具體，才能讓孩子知道什麼策略有效。"],["p","395｜你好聰明→你剛才使用的這個策略很有效。"],["p","396｜你天生有天分→你的練習與策略正在累積能力。"],["p","397｜你就是不擅長這個→你目前在這個能力上的熟練度較低。"],["p","398｜不要輸在起跑點→人生不是只有一條跑道，也不是只有一個終點。"],["p","399｜我要替孩子安排最好的人生→我要幫他建立能自己更新人生的能力。"],["p","400｜教育就是把正確答案教給孩子→更高階的教育，是讓孩子學會發現錯誤、取得回饋、更新模型。"],["h",2,"《第五區｜學習、考試與成長401—500》"],["p","401｜我英文很差→我的英文是哪個能力節點比較弱？"],["p","402｜我單字都背不起來→我的編碼方式需要怎麼調整？"],["p","403｜我背了又忘→遺忘代表需要重新設計提取與間隔。"],["p","404｜我記性不好→我要測試哪種記憶策略更有效？"],["p","405｜我看過就忘→看過不等於成功提取。"],["p","406｜我讀很多次還是不會→我要從重讀改成主動回想。"],["p","407｜我讀書沒效率→我的時間主要消耗在哪個低效環節？"],["p","408｜我讀很久成績還是差→投入時間不等於有效學習量。"],["p","409｜我已經很努力了→我的努力有沒有形成可測量的能力提升？"],["p","410｜別人讀一下就會→我只看到他的輸出，不知道他的前置累積。"],["p","411｜我沒有讀書天分→我要先找出真正的能力缺口。"],["p","412｜我考試運很差→哪些錯誤是知識問題，哪些才可能是隨機波動？"],["p","413｜這次題目太難→難度上升暴露了哪些能力缺口？"],["p","414｜老師都出沒教的→這題測的是記憶，還是遷移能力？"],["p","415｜我看到長文章就怕→先切段、抓主題、找轉折。"],["p","416｜這篇文章看不懂→我卡在單字、句法、背景還是篇章邏輯？"],["p","417｜單字好多→哪些詞真的阻礙理解？"],["p","418｜每個字都要查→先判斷這個字是否影響核心意思。"],["p","419｜我一定要全部看懂→閱讀的目標取決於任務，不一定是100%理解。"],["p","420｜我閱讀很慢→哪個步驟正在佔用最多工作記憶？"],["p","421｜我作文不會寫→我缺的是內容、結構、句型還是詞彙？"],["p","422｜我沒有靈感→先建立素材與問題庫。"],["p","423｜我不知道怎麼開始→先寫最粗糙的第一句。"],["p","424｜我要想好再寫→寫作本身也能幫助思考。"],["p","425｜我寫得很爛→目前版本有哪些具體可修改節點？"],["p","426｜我不敢給老師看→回饋正是讓版本升級的資料。"],["p","427｜被改很多代表很差→修改多代表現在有大量可見的更新入口。"],["p","428｜我怕答錯→答錯可以暴露模型缺口。"],["p","429｜我不敢舉手→先把目標改成提出一個問題。"],["p","430｜我怕同學笑→我要把注意力放在能力生成，而不是瞬間評價。"],["p","431｜考試好可怕→考試是目前能力模型的一次壓力測試。"],["p","432｜我一考試就腦袋空白→我要訓練在時間壓力下提取。"],["p","433｜我平常都會，考試不會→知識存在，但壓力情境提取能力不足。"],["p","434｜我粗心很多題→我要把粗心拆成可觀察錯誤類型。"],["p","435｜我每次都看錯題目→建立讀題標記流程。"],["p","436｜我算對又改錯→我要記錄自己修改答案時的判斷品質。"],["p","437｜我時間永遠不夠→我要測量每類題目的時間成本。"],["p","438｜我最後都寫不完→先重新配置題目順序與停損點。"],["p","439｜我一題卡很久→設定單題最大投入時間。"],["p","440｜我捨不得跳題→跳題是資源配置，不是放棄。"],["p","441｜我一定要考滿分→我要最大化整體得分率。"],["p","442｜少一分都不行→我要區分高價值錯誤與隨機誤差。"],["p","443｜考不好我就完了→一次考試只是人生決策系統的一個變數。"],["p","444｜這次一定要成功→我可以提高成功率，但不控制所有結果。"],["p","445｜我好怕落榜→我可以同時準備A方案與B方案。"],["p","446｜如果沒考上怎麼辦→先把最壞情境轉成可處理方案。"],["p","447｜我一定不能輸→我的目標是能力提升，不是永遠擊敗所有人。"],["p","448｜他考得比我高→他的策略有哪些值得分析？"],["p","449｜我退步了→這次下降是波動還是長期趨勢？"],["p","450｜我從90掉到80→是哪十分快速流失？"],["p","451｜老師不喜歡我→有哪些具體互動支持這個推論？"],["p","452｜老師故意針對我→我要先收集事件，而不是直接推測意圖。"],["p","453｜這老師教得很差→哪些部分無法幫助我學會？"],["p","454｜沒有好老師我就學不好→我要建立更多自主學習接口。"],["p","455｜課本太爛→我可以增加哪些替代輸入？"],["p","456｜學校教的都沒用→哪些知識是基礎，哪些確實需要補充？"],["p","457｜AI都會了，還學什麼→AI越強，我越需要提問、判斷與驗證能力。"],["p","458｜有AI就不用背→有些知識必須內化，才能快速思考。"],["p","459｜AI會幫我寫→我要能判斷AI寫得對不對。"],["p","460｜搜尋得到就不用學→搜尋降低取得成本，不等於降低理解需求。"],["p","461｜我知道答案就會了→真正會是能在新情境重新生成答案。"],["p","462｜我聽懂了→我能不能不用提示說一次？"],["p","463｜我看懂了→我能不能解一題新的？"],["p","464｜我背起來了→隔幾天還能不能提取？"],["p","465｜我學完了→這個模型能不能遷移？"],["p","466｜我今天讀五小時→今天形成了哪些新能力？"],["p","467｜我做了一百題→這一百題修正了哪些錯誤模型？"],["p","468｜刷題越多越好→高品質回饋比無腦題量更重要。"],["p","469｜錯題看答案就好→我要找出自己當時為什麼會選錯。"],["p","470｜答案懂了就好→我要建立下次不再犯錯的辨識規則。"],["p","471｜我總是錯同一種題→代表同一個底層模型還沒更新。"],["p","472｜這題我只是粗心→粗心也需要找到生成機制。"],["p","473｜我猜錯而已→我的猜測依據是什麼？"],["p","474｜我猜對了→猜對不代表模型正確。"],["p","475｜分數高就是學會了→分數只是能力的一個投影。"],["p","476｜分數低就是不會→低分需要拆解成不同錯誤來源。"],["p","477｜我要排名→排名是相對位置，不是完整能力圖譜。"],["p","478｜我要贏同學→我要增加自己的能力自由度。"],["p","479｜讀書好痛苦→哪個環節的摩擦最高？"],["p","480｜我坐不住→我要重新設計任務長度與環境。"],["p","481｜我沒有專注力→哪些刺激正在競爭我的注意力？"],["p","482｜手機讓我分心→我要增加手機取得成本。"],["p","483｜我控制不了自己滑手機→把控制問題改成環境設計問題。"],["p","484｜我讀一下就累→任務是否超過目前認知負荷？"],["p","485｜我今天狀態不好就不讀→今天可以執行最低可行版本。"],["p","486｜我一定要每天完美完成→維持系統比每天滿分更重要。"],["p","487｜中斷一天就失敗→重新啟動速度比從不中斷更重要。"],["p","488｜我沒照計畫走→計畫需要根據真實回饋更新。"],["p","489｜我的計畫又失敗了→是哪個假設低估了現實摩擦？"],["p","490｜我時間規劃很差→我要先記錄真實時間，而不是憑感覺估計。"],["p","491｜我要更自律→我要讓正確行為變得更容易。"],["p","492｜我要逼自己→我可以先降低任務啟動成本。"],["p","493｜痛苦才代表努力→高摩擦不等於高效率。"],["p","494｜學習一定很苦→有效學習需要挑戰，但不需要持續無效耗損。"],["p","495｜我不喜歡讀書→我不喜歡的是哪種學習形式？"],["p","496｜這科沒有用→它訓練的底層能力可能是什麼？"],["p","497｜我學這個幹嘛→我要知道這個知識與哪個更大 "],["p","609｜談錢很俗→金錢也是資源配置語言。"],["p","610｜我不好意思收錢→如果價值成立，交換也可以成立。"],["p","611｜我不值得收這麼多→價格要看市場價值與交換結果，不只看自我感受。"],["p","612｜便宜才有人買→價格、信任與價值感共同影響購買。"],["p","613｜貴的一定比較好→價格是訊號，不是品質本身。"],["p","614｜便宜的一定不好→先看實際品質與需求匹配。"],["p","615｜特價不買就虧→沒有需求的折扣仍然是支出。"],["p","616｜現在買最划算→我本來就打算買嗎？"],["p","617｜大家都買我也要買→這個產品解決我的哪個問題？"],["p","618｜我想要就是需要→先區分想要、需要與衝動。"],["p","619｜買了我會更快樂→這個快樂預計維持多久？"],["p","620｜辛苦工作就該犒賞自己→犒賞可以存在，但要看長期資源配置。"],["p","621｜花小錢沒關係→高頻小額也會形成大流量。"],["p","622｜這才幾十塊→真正要看的是頻率與累積成本。"],["p","623｜我存不到錢→我的現金流在哪個節點持續外漏？"],["p","624｜等有剩再存→先配置再消費可能更穩定。"],["p","625｜存錢就是省→存錢本質是把今天資源轉移給未來。"],["p","626｜投資一定能賺→投資是承擔風險換取預期報酬。"],["p","627｜這個一定漲→我有什麼證據支持這個機率判斷？"],["p","628｜大家都說會漲→共識本身也可能已經反映在價格裡。"],["p","629｜錯過這次就沒機會→這是真的稀缺，還是FOMO？"],["p","630｜我不能錯過→錯過機會的成本與追錯機會的成本都要算。"],["p","631｜我賠錢了，所以要等回本→未來決策不應只被買入成本綁架。"],["p","632｜不賣就不算賠→經濟損失與帳面實現是不同概念。"],["p","633｜都跌這麼多一定會漲→過去跌幅不能保證未來方向。"],["p","634｜都漲這麼多一定不能買→價格高低需要放進價值與風險評估。"],["p","635｜朋友賺很多，我也要跟→別人的風險承受能力可能不同。"],["p","636｜這個投資沒有風險→只要有報酬，通常就需要問風險在哪裡。"],["p","637｜高報酬真好→高報酬背後通常要檢查高風險來源。"],["p","638｜每月領很多就是高利率→還要看本金是否返還、期限與現金流結構。"],["p","639｜我只看每月拿多少→我要算總報酬率與本金變化。"],["p","640｜有人保證就安全→我要確認保證者本身的履約能力。"],["p","641｜大公司不會倒→低機率不等於零機率。"],["p","642｜銀行一定安全→先理解制度保障範圍與產品性質。"],["p","643｜保險買越多越安心→保險要對應真正無法承受的風險。"],["p","644｜有保險什麼都賠→先看條款、除外責任與理賠條件。"],["p","645｜我不想看合約→看不懂的地方正是需要確認的地方。"],["p","646｜簽了再說→不可逆決策要提高前置驗證。"],["p","647｜借錢沒關係，以後再還→未來收入已經被今天提前配置。"],["p","648｜分期感覺比較便宜→分期改變的是現金流，不一定改變總成本。"],["p","649｜每月只要一點點→我要看總付款與機會成本。"],["p","650｜信用卡額度就是我能花的錢→額度不是收入。"],["p","651｜先買再說→我可以延遲24小時再決定。"],["p","652｜這是限量→限量不等於適合我。"],["p","653｜我值得最好的→我值得的是符合需求與資源條件的選擇。"],["p","654｜省錢就是委屈自己→真正目標是提高資源使用效率。"],["p","655｜花錢就是享受人生→享受也可以來自低成本高價值活動。"],["p","656｜賺錢就是犧牲生活→我要尋找價值創造與生活品質更好的結構。"],["p","657｜我要拼命賺錢→我要先定義「夠」是多少。"],["p","658｜錢越多越自由→財富增加選項，但自由也取決於需求結構。"],["p","659｜我有錢就會幸福→金錢能解決部分問題，不是所有問題。"],["p","660｜沒錢什麼都不能做→資源限制真實存在，但仍可尋找低成本路徑。"],["p","661｜我要快速致富→快速增加報酬通常也提高風險。"],["p","662｜慢慢賺太慢了→我要比較速度與存活率。"],["p","663｜創業一定比上班賺→創業只是不同風險與報酬結構。"],["p","664｜上班沒有前途→我要看自己的能力資產是否持續升值。"],["p","665｜有副業才安全→副業也需要計算時間與注意力成本。"],["p","666｜收入來源越多越好→過度分散也可能降低主業複利。"],["p","667｜我要做被動收入→多數被動收入前面都有資本、能力或系統投入。"],["p","668｜睡覺也能賺錢→真正要建立的是可重複交付的資產。"],["p","669｜我要賣知識→我要賣的是能降低別人學習成本的結構。"],["p","670｜資訊可以賣錢→AI時代更稀缺的是篩選、結構、判斷與轉化。"],["p","671｜我的內容很多，所以很值錢→價值不取決於字數，而取決於能力轉換效率。"],["p","672｜我要做很多產品→先找到真正高需求節點。"],["p","673｜客戶越多越好→還要看服務成本與客戶品質。"],["p","674｜營收高就是賺錢→營收不是利潤。"],["p","675｜賺很多就是有錢→現金流、資產、負債與風險都要看。"],["p","676｜我收入增加就可以多花→先決定新增收入如何配置。"],["p","677｜有錢就買房→買房是生活與資產配置決策，不是必然答案。"],["p","678｜租房就是幫房東繳貸款→租房也購買了流動性。"],["p","679｜買房一定保值→資產價格仍受區域、利率、人口與市場影響。"],["p","680｜房價永遠漲→任何資產都不應使用「永遠」預測。"],["p","681｜我要留很多錢給孩子→也要留給孩子管理資源的能力。"],["p","682｜給孩子錢就是愛→資源支持與能力培養需要平衡。"],["p","683｜孩子不能知道家裡有錢→更重要的是建立正確資源模型。"],["p","684｜窮養比較好→真正重要的是限制、責任與選擇能力。"],["p","685｜富養比較好→資源多也需要建立延遲滿足與價值感。"],["p","686｜我要省到極致→節流存在下限，價值創造的上限可能更高。"],["p","687｜我要一直增加收入→也要提高資產留存率。"],["p","688｜我收入低，所以沒辦法→先看技能、時間、槓桿與市場四個節點。"],["p","689｜我的薪水就是這樣→目前市場為這個角色支付這個價格。"],["p","690｜公司不會幫我加薪→我要提高談判籌碼與替代選項。"],["p","691｜我不敢談薪水→我要準備市場資料與價值證據。"],["p","692｜談薪水很貪心→薪資談判是交換條件校準。"],["p","693｜別人開多少我就接受→我要先知道自己的最低可接受條件。"],["p","694｜有工作就好了→也要看工作是否持續累積未來選項。"],["p","695｜穩定最重要→穩定是一種價值，但也要計算停滯風險。"],["p","696｜風險越低越好→完全避險也可能失去成長機會。"],["p","697｜我要找到零風險方法→更實際的目標是控制不可承受的風險。"],["p","698｜財富就是錢很多→財富也包括時間、能力、關係、健康與選擇權。"],["p","699｜有錢就是成功→先定義自己真正要最大化的生命函數。"],["p","700｜真正的財務自由不是想買什麼就買什麼→而是資源足以支持重要選擇，不被短期現金流綁架。"],["h",2,"《第八區｜健康、身體與生活習慣701—800》"],["p","701｜我身體很差→目前是哪個功能或症狀讓我這樣判斷？"],["p","702｜我就是體質不好→我要把「體質」拆成可觀察變數。"],["p","703｜我年紀大了都這樣→年齡是變數之一，不是所有症狀的完整解釋。"],["p","704｜身體退化沒辦法→哪些部分不可逆？哪些功能仍能維持或改善？"],["p","705｜我生病就是倒楣→先理解疾病可能涉及哪些風險與生成因素。"],["p","706｜我一定是做錯什麼才生病→疾病不等於道德判決。"],["p","707｜我生病都是壓力造成→壓力可能是變數之一，不應取代完整評估。"],["p","708｜都是我想太多才不舒服→心理與生理可以互相影響，但不能因此忽略身體訊號。"],["p","709｜身體不舒服忍一下就好→先判斷這是短期波動還是需要處理的訊號。"],["p","710｜休息一下就沒事→如果反覆發生，就需要重新評估原因。"],["p","711｜沒症狀就是健康→健康還包括功能、恢復與調節能力。"],["p","712｜檢查正常就一定沒事→正常檢查降低部分風險，但不代表解釋所有不適。"],["p","713｜一個數字高就是生病→單一指標要放進整體情境解讀。"],["p","714｜報告有紅字好可怕→先理解紅字的程度、趨勢與臨床意義。"],["p","715｜數字正常就不用管→也要看症狀、趨勢與個人背景。"],["p","716｜我要把所有數字調到完美→檢驗值是決策訊號，不是收藏成績。"],["p","717｜這個症狀一定是某個病→症狀可能對應多種生成機制。"],["p","718｜Google說我可能得重病→搜尋結果不是個人診斷。"],["p","719｜我看到別人症狀跟我一樣→相同症狀可能來自不同原因。"],["p","720｜朋友吃這個有效，我也會有效→個體條件與原因可能不同。"],["p","721｜天然的一定安全→天然描述來源，不等於零風險。"],["p","722｜化學的都不好→所有物質都具有化學結構，重點是劑量、用途與風險。"],["p","723｜營養素越多越好→需要考慮需求、劑量、交互作用與總負荷。"],["p","724｜吃越多效果越快→劑量與效果不一定線性。"],["p","725｜有感就是有效→主觀感受是資料之一，不是唯一證據。"],["p","726｜沒感覺就是沒效→有些介入本來就不會產生明顯即時感受。"],["p","727｜吃一天沒效→先看合理的作用時間尺度。"],["p","728｜這個產品救了我→要區分同時發生、主觀改善與真正因果。"],["p","729｜別人都說有效→群體回饋可以提供線索，但不能取代個人評估。"],["p","730｜這個一定適合所有人→任何介入都應該考慮適用條件。"],["p","731｜我一定要找到最好的營養素→先找到真正需要處理的節點。"],["p","732｜補充品可以取代生活習慣→補充品只是整體健康系統的一部分。"],["p","733｜只要吃對就會健康→睡眠、活動、飲食、壓力與醫療也共同作用。"],["p","734｜我吃得很健康怎麼還會生病→健康行為降低部分風險，不提供零風險保證。"],["p","735｜我運動就不會生病→運動有益，但不是免疫所有疾病的保證。"],["p","736｜我不運動就是懶→運動行為也受環境、體力、時間與習慣影響。"],["p","737｜我要每天運動一小時→先建立可以長期維持的最低版本。"],["p","738｜今天沒運動就失敗→長期趨勢比單日完美重要。"],["p","739｜我中斷一週全部白費→重新開始比自責更有價值。"],["p","740｜我要瘦才健康→體重只是健康系統的一個指標。"],["p","741｜我胖就是意志力差→體重受飲食、活動、睡眠、環境與生理等多因素影響。"],["p","742｜少吃就一定瘦→長期體重變化還受依從性、活動與代謝適應影響。"],["p","743｜體重沒降就是沒進步→還可以看腰圍、體能、力量與其他指標。"],["p","744｜今天重一公斤我胖了→單日體重受到水分與腸道內容物等影響。"],["p","745｜我要快速瘦→速度要和安全性、肌肉保留與可持續性一起評估。"],["p","746｜減肥一定要忍→我要設計能長期維持的飲食環境。"],["p","747｜我不能吃任何喜歡的東西→健康飲食不必建立在永久剝奪上。"],["p","748｜吃一口就破功→一次飲食選擇不等於整個系統失敗。"],["p","749｜今天吃多了，乾脆繼續吃→下一餐就可以重新校準。"],["p","750｜我控制不了嘴巴→哪些情境最容易觸發進食？"],["p","751｜我就是愛吃甜食→甜食在我的生活中提供什麼獎賞？"],["p","752｜壓力大就想吃→我要增加其他低成本調節方式。"],["p","753｜我一定要戒掉所有壞習慣→先找影響最大的高槓桿習慣。"],["p","754｜熬夜沒關係，補眠就好→睡眠時間與規律性都值得管理。"],["p","755｜我天生就是夜貓子→先區分偏好、作息與環境塑造。"],["p","756｜我睡不著就一直滑手機→這可能正在增加刺激輸入。"],["p","757｜今晚睡不著，明天一定完蛋→睡眠不足會影響狀態，但結果不是完全固定。"],["p","758｜我要逼自己睡→睡眠本身很難靠意志直接命令。"],["p","759｜我一定要睡滿八小時→個體需求有差異，還要看品質與白天功能。"],["p","760｜我睡很多還是累→睡眠時數不是唯一變數。"],["p","761｜累就是缺睡→疲勞可能有多種原因。"],["p","762｜我沒精神就喝更多咖啡→先問疲勞的生成原因。"],["p","763｜咖啡讓我有精神就是恢復了→刺激提高警覺不等於恢復完成。"],["p","764｜我要靠意志撐過去→長期超載會增加系統耗損。"],["p","765｜壓力都是壞的→適量壓力也可能促進適應。"],["p","766｜我要完全沒有壓力→更實際的目標是提高壓力調節能力。"],["p","767｜放鬆就是什麼都不做→放鬆可以是降低警戒與恢復資源。"],["p","768｜冥想一定適合每個人→不同人可能需要不同調節工具。"],["p","769｜呼吸一下就能解決所有問題→呼吸是調節工具，不是所有問題的根因解法。"],["p","770｜我要一直保持正能量→健康系統需要允許完整情緒訊號。"],["p","771｜生氣傷身，所以不能生氣→重點是調節與表達，不是禁止情緒。"],["p","772｜難過會讓身體不好→難過是正常情緒，不需要因此增加第二層恐懼。"],["p","773｜我生病一定是情緒造成→情緒可能影響身體，但不能取代醫學診斷。"],["p","774｜想開一點就會好→有些問題需要實際介入，而不只是改變想法。"],["p","775｜我要相信自己會好→希望可以支持行動，但不能取代現實回饋。"],["p","776｜只要信念夠強就會康復→結果仍受疾病、治療與個體條件影響。"],["p","777｜我不能有負面想法→想法不是疾病控制開關。"],["p","778｜我害怕就會讓病更嚴重→不要因為害怕本身再責怪自己。"],["p","779｜我一定要戰勝疾病→也可以把目標定義成理解、治療、管理與提高生活品質。"],["p","780｜我的身體背叛我→我的身體正在發出需要理解的訊號。"],["p","781｜身體怎麼這麼不爭氣→身體正在目前條件下努力維持穩態。"],["p","782｜我要控制身體→我要和身體建立更好的回饋。"],["p","783｜我要把症狀消掉→先理解症狀背後可能的機制。"],["p","784｜沒有症狀就好了→還要看生成症狀的條件是否改善。"],["p","785｜藥吃了沒感覺就停→是否停藥需要依治療目的與專業建議判斷。"],["p","786｜藥物都有副作用所以不要吃→要比較治療收益與不治療風險。"],["p","787｜有副作用就是不好→真正問題是風險收益比。"],["p","788｜手術一定很可怕→我要了解手術的目的、風險、替代方案與預期收益。"],["p","789｜醫生一定都是對的→專業意見很重要，也可以透過提問與第二意見提高決策品質。"],["p","790｜醫生都不懂我的身體→我的主觀經驗重要，專業檢查也提供另一層資訊。"],["p","791｜網友比醫生懂→不同資訊來源要依證據與專業範圍評估。"],["p","792｜研究說有效就一定適合我→群體證據仍需轉譯到個人條件。"],["p","793｜一篇研究證明了→單篇研究通常只是證據網路的一部分。"],["p","794｜機制合理就一定有效→生物學機制合理不等於臨床效果已被證實。"],["p","795｜沒有研究就一定沒效→證據不足代表不確定性高，不等於已證明無效。"],["p","796｜我一定要找到根因→有些健康問題可能存在多個互動原因。"],["p","797｜找到根因就能解決→知道原因與能有效介入是兩個問題。"],["p","798｜健康就是沒有疾病→健康更接近維持功能、適應與恢復的能力。"],["p","799｜我要控制所有健康變數→更實際的是管理高影響、可控制的變數。"],["p","800｜真正的健康管理不是追求永遠不生病→而是建立辨識訊號、取得證據、介入、讀取回饋與持續校準的能力。"],["h",2,"《第九區｜失敗、決策、逆境與人生801—900》"],["p","801｜我失敗了→這次結果和預測不一致。"],["p","802｜我又輸了→哪個能力或策略需要更新？"],["p","803｜我運氣真差→這次結果中多少可能來自隨機性？"],["p","804｜為什麼倒楣的都是我→我的大腦是不是正在選擇性搜尋負面事件？"],["p","805｜人生一直針對我→哪些事件真的存在共同生成機制？"],["p","806｜老天不公平→我無法控制所有初始條件，但仍可以管理部分變數。"],["p","807｜命運就是這樣→這是目前條件生成的結果。"],["p","808｜我命不好→哪些結構正在反覆生成低品質結果？"],["p","809｜我沒有選擇→先把所有選項寫出來再判斷。"],["p","810｜我只能接受→接受現實不等於停止尋找可控變數。"],["p","811｜事情已經這樣了→現在最值得處理的是下一個節點。"],["p","812｜一切都太晚了→哪些選項真的已經關閉？哪些仍然存在？"],["p","813｜我錯過機會了→我可以提取這次錯過的辨識規則。"],["p","814｜再也沒有機會→這個機會消失，不代表所有機會消失。"],["p","815｜我走錯路了→這條路讓我得到哪些只有走過才知道的資料？"],["p","816｜早知道就選另一條→當時的決策是基於當時資訊，不是今天資訊。"],["p","817｜我浪費十年→這十年有哪些能力、關係與資訊可以重新組合？"],["p","818｜我人生被耽誤了→接下來如何提高剩餘時間的價值密度？"],["p","819｜如果沒有那件事，我現在一定更好→這是一個無法驗證的反事實模型。"],["p","820｜都是因為他，我人生才變這樣→他的影響可能真實存在，但我的下一步仍需要重新取得控制權。"],["p","821｜我永遠無法彌補→哪些損失不可逆？哪些部分仍能修復？"],["p","822｜破掉的東西回不去了→不能回到原版，不代表不能生成新版。"],["p","823｜我一定要回到以前→我要建立適合現在條件的新穩態。"],["p","824｜以前的我比較好→現在的我多了哪些以前沒有的資料？"],["p","825｜我變差了→哪些指標真的下降？哪些只是環境要求提高？"],["p","826｜人生越來越難→是難度提高，還是責任與變數增加？"],["p","827｜成年後好累→我需要減少哪些不必要的系統負荷？"],["p","828｜事情永遠解決不完→生命本來就是持續調節，不是一次清空所有問題。"],["p","829｜等問題都解決我再快樂→我可以在未完成中建立可生活的狀態。"],["p","830｜等有錢再做想做的事→哪些版本可以現在低成本開始？"],["p","831｜等退休再生活→哪些重要生活不能無限延後？"],["p","832｜等孩子長大再說→我的人生也需要持續保留自己的節點。"],["p","833｜等忙完這陣子→這個「陣子」是否其實是長期結構？"],["p","834｜以後再開始→我要給「以後」一個具體時間。"],["p","835｜明天再做→第一步能不能現在做兩分鐘？"],["p","836｜我還沒準備好→我需要準備到什麼程度才足以開始？"],["p","837｜我要等有信心→信心可以由行動後的回饋生成。"],["p","838｜我要等有動力→行動也能生成動力。"],["p","839｜我要等靈感→先輸入、產出，再讓靈感有生成材料。"],["p","840｜時機還沒到→我用什麼指標判斷時機？"],["p","841｜我怕選錯→先判斷決策可逆性。"],["p","842｜兩個都想要→兩者真的能共存嗎？成本是多少？"],["p","843｜我不知道怎麼選→先定義最重要的決策標準。"],["p","844｜每個選項都有缺點→成熟決策本來就是在不同代價中選擇。"],["p","845｜我要找到完美答案→很多人生問題只有較適配方案。"],["p","846｜選了就不能後悔→決策後仍可以讀取回饋。"],["p","847｜改變決定很丟臉→新資訊出現後更新決策是理性。"],["p","848｜說過的話就一定要做到→承諾重要，但重大條件改變時也需要重新協商。"],["p","849｜堅持到底才會成功→有些時候堅持，有些時候停損。"],["p","850｜放棄就是失敗→放棄低價值路徑也可能是資源優化。"],["p","851｜再撐一下就成功→我要看新的證據，而不是只看已投入成本。"],["p","852｜都投入這麼多了不能停→沉沒成本不能決定未來價值。"],["p","853｜我不甘心→不甘心提供情緒能量，但不能取代決策。"],["p","854｜我要贏回來→我要先判斷繼續投入是否值得。"],["p","855｜我一定要證明他錯→我的人生不需要以別人的錯誤作為核心目標。"],["p","856｜我要讓看不起我的人後悔→更高槓桿的目標是建立自己真正想要的人生。"],["p","857｜成功就是最好的報復→成功最好服務自己的價值，而不是長期被敵人定義。"],["p","858｜我要比所有人強→我要建立不可替代的能力組合。"],["p","859｜我要第一名→第一名是相對位置，能力是可複利資產。"],["p","860｜輸了就沒有價值→輸贏描述結果，不描述完整人格。"],["p","861｜我一定要成功→我要提高成功機率並管理失敗成本。"],["p","862｜成功的人不會失敗→成功者也只是有更好的試錯與更新機制。"],["p","863｜我不能犯大錯→高風險決策要增加檢查與安全邊界。"],["p","864｜人生就是不能走錯→更重要的是錯了能否快速校正。"],["p","865｜我希望一切照計畫→計畫應該接受現實回饋。"],["p","866｜事情不照計畫就是失控→計畫與現實出現誤差正是更新訊號。"],["p","867｜突發事件毀了一切→哪些部分被破壞？哪些資源仍存在？"],["p","868｜我討厭變化→變化提高不確定性，也可能打開新狀態空間。"],["p","869｜穩定最好→穩定過頭也可能形成僵化。"],["p","870｜不要改就不會錯→不改變本身也是一個帶風險的決策。"],["p","871｜世界變太快→我的核心能力應該包含快速更新。"],["p","872｜我預測不到未來→我不需要準確預測全部未來，只需要增加適應力。"],["p","873｜我要知道答案才安心→有些安全感來自知道自己能處理不知道。"],["p"," p","927｜我要聽所有建議→建議需要篩選，不需要全部執行。"],["p","928｜有人反對就代表我錯→反對是資料，不是判決。"],["p","929｜沒有人反對就代表我對→沉默也不等於證實。"],["p","930｜很多人按讚就是正確→人氣與真實是不同變數。"],["p","931｜這篇文章讓我很有共鳴→共鳴代表模型匹配，不代表內容一定真實。"],["p","932｜這句話很療癒，所以一定對→心理舒適與事實準確要分開。"],["p","933｜這個觀點讓我不舒服，所以一定錯→不舒服也可能來自Prediction Error。"],["p","934｜我不喜歡這個答案→喜好不能直接判定真假。"],["p","935｜我要找支持我的資料→我也要主動找可能推翻自己的資料。"],["p","936｜我只相信自己看過的→很多可靠知識來自可重複的集體驗證。"],["p","937｜科學什麼都知道→科學的力量之一正是允許模型持續被修正。"],["p","938｜科學一直改，所以不可信→能更新反而是降低錯誤的重要機制。"],["p","939｜沒有百分之百證明就不能信→決策通常需要在不完全資訊下進行。"],["p","940｜有研究就代表證明→要看研究設計、重複性與整體證據。"],["p","941｜我需要確定答案→我需要的是與風險相匹配的信心水準。"],["p","942｜不知道就不能行動→很多決策只能在不確定中管理風險。"],["p","943｜我要消除所有風險→我要避免不可承受的風險。"],["p","944｜越安全越好→過度安全也可能犧牲學習與選項。"],["p","945｜不要犯錯最安全→沒有試錯也可能累積適應性風險。"],["p","946｜我要預測準確→我也要知道自己預測的信心有多高。"],["p","947｜我猜對了→我的模型真的對，還是只是運氣？"],["p","948｜我猜錯了→哪個假設造成最大誤差？"],["p","949｜我要避免Prediction Error→Prediction Error正是更新入口。"],["p","950｜錯誤很丟臉→錯誤被隱藏才更容易累積系統風險。"],["p","951｜我不能承認不知道→精準知道自己的未知邊界是一種能力。"],["p","952｜承認錯誤很沒面子→快速修正錯誤比維護舊答案更有價值。"],["p","953｜改口很丟臉→如果資料改變，更新立場是模型品質提升。"],["p","954｜我要保持一致→更重要的是與最新證據保持一致。"],["p","955｜我以前不是這樣說→以前的我使用以前的資料。"],["p","956｜人不能一直變→不更新的系統才更容易與環境脫節。"],["p","957｜改變就是不忠於自己→更新也可以是更接近真正重視的價值。"],["p","958｜我要做真正的自己→我要辨識哪些是價值，哪些只是舊習慣。"],["p","959｜這就是我的個性→個性不是所有行為的永久命令。"],["p","960｜我就是這種人→我可以保留特質，同時增加行為自由度。"],["p","961｜我要消滅缺點→有些缺點可能是特質在錯誤情境下的成本。"],["p","962｜我要成為完美的人→我要成為更能調節、修復與更新的人。"],["p","963｜我要沒有情緒→我要提升讀取與調節情緒的能力。"],["p","964｜我要沒有恐懼→我要在恐懼存在時仍能做高品質決策。"],["p","965｜我要永遠正向→我要更準確地讀取正向與負向訊號。"],["p","966｜負面就是低能量→負面資訊有時是重要風險訊號。"],["p","967｜正面就是高維→高維不是正面，而是能容納更多變數。"],["p","968｜覺醒就是看懂真相→更成熟的覺醒是知道自己的真相仍可能需要更新。"],["p","969｜我已經覺醒了→真正重要的是我的模型是否仍保持開放。"],["p","970｜別人層次太低→我是否正在用「高維」建立新的優越身份？"],["p","971｜他就是低頻→我可以描述具體行為，而不是用抽象標籤結束理解。"],["p","972｜我們不同頻→具體是哪個價值、需求或溝通模式不匹配？"],["p","973｜宇宙在阻止我→有哪些現實條件正在提高阻力？"],["p","974｜宇宙在幫我→有哪些條件剛好提高了成功機率？"],["p","975｜這是宇宙給我的訊號→我可以保留個人意義，同時檢查其他可能解釋。"],["p","976｜所有巧合都有意義→巧合可以有主觀意義，不代表必然存在客觀因果。"],["p","977｜吸引力法則一定有效→我的注意力、行動與選擇如何改變事件機率？"],["p","978｜只要想像就會實現→想像可以幫助建立方向，但仍需要能力與行動。"],["p","979｜相信就會發生→信念可能影響行動，但不能控制所有外部變數。"],["p","980｜不相信就不會成功→懷疑也可以成為風險檢查機制。"],["p","981｜我要提高能量→我要具體提高睡眠、注意力、情緒、體能還是哪種功能？"],["p","982｜我要提高頻率→我要把抽象語言轉成可觀察的狀態。"],["p","983｜我要活在高維→我要增加自己能同時理解的變數、時間尺度與觀點。"],["p","984｜我要跳脫二元→我可以增加灰階，但必要時仍然做清楚判斷。"],["p","985｜沒有對錯→有些問題確實存在證據更強與傷害更大的差異。"],["p","986｜每個人都有自己的真相→每個人都有自己的視角，但外部事實仍可能被共同驗證。"],["p","987｜一切都是觀點→觀點會影響解讀，但不能任意改變所有物理現實。"],["p","988｜思想創造一切→思想會影響選擇與行動，但世界也會反向限制思想。"],["p","989｜語言創造命運→語言參與命運生成，但不是唯一變數。"],["p","990｜只要改語言就能改人生→語言需要進一步改變模型、行動與回饋才可能改變結果。"],["p","991｜我要控制人生→我要提高對重要變數的調節能力。"],["p","992｜我要掌控未來→我要增加面對不同未來的適應能力。"],["p","993｜我要永遠做對選擇→我要讓錯誤選擇的成本可控、修正速度更快。"],["p","994｜我要找到人生標準答案→人生更像持續更新的動態決策系統。"],["p","995｜我要知道真正的自己→自我也是記憶、身體、關係、價值與選擇持續生成的系統。"],["p","996｜我要找到命運→命運也可以理解成初始條件、環境、隨機性與持續選擇共同形成的軌跡。"],["p","997｜我要改命→先找出反覆生成相同結果的語言、模型、行為與環境迴路。"],["p","998｜我要變得更強→我要提高感知、判斷、調節、行動、回饋與更新能力。"],["p","999｜我要成為永遠正確的人→我要成為發現自己錯了之後，能更快更新的人。"],["p","1000｜我就是這樣，人生也只能這樣→這只是目前模型運算出的版本；只要模型能更新、行動能改變、回饋仍在流動，下一個版本就仍然可以重新生成。"],["h",2,"《1000句最後濃縮成一條人生語言公式》"],["p","不要急著說「我是什麼」→先問「現在發生什麼」→不要急著下結論→先分離事實與故事→不要把情緒當真相→把情緒當訊號→不要把預測當命運→把預測當假設→不要只找誰的錯→找生成結果的機制→不要只問為什麼→找下一個可控節點→不要等完美→做最小可行行動→不要害怕Prediction Error→讓現實回饋修正模型→不要被舊語言綁架→持續生成新的選項。"],["p","真正的語言升級，不是把負面句子全部換成正面句子。"],["p","而是把「封閉句」改成「更新句」。"],["p","把人格判決改成事件描述。"],["p","把絕對結論改成可驗證假設。"],["p","把情緒命令改成訊號讀取。"],["p","把受害敘事改成可控變數。"],["p","把失敗改成Prediction Error。"],["p","把抱怨改成請求。"],["p","把恐懼改成風險管理。"],["p","把困難改成能力缺口。"],["p","把努力改成回饋系統。"],["p","把不知道改成搜尋入口。"],["p","把命運改成持續生成的動態軌跡。"],["p","語言→模型→預測→注意力→選擇→行動→回饋→更新→新的語言→新的模型→新的可能性。"],["p","自由不是永遠不受限制。"],["p","自由是看見舊模型正在說話時，你仍然擁有選擇下一句話、下一個行動、下一個版本的能力。"]]}]</script>
<script>
(function(){
var DOCS = JSON.parse(document.getElementById('data').textContent);
var $ = function(id){ return document.getElementById(id); };
var cur = 0, terms = [], mode = 'doc', hits = [], hitCount = {};
var MAXRES = 400;

function store(k, v){ try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }

/* ---------- 索引 ---------- */
var IDX = [];
DOCS.forEach(function(d, di){
  var head = '', chars = 0;
  d.b.forEach(function(it, i){
    var k = it[0];
    if(k === 'r') return;
    if(k === 't'){
      it[1].forEach(function(row, r){
        var t = row.join(' ｜ ');
        chars += t.length;
        IDX.push({d:di, i:i, r:r, t:t, l:t.toLowerCase(), h:head});
      });
      return;
    }
    var t = k === 'h' ? it[2] : it[1];
    chars += t.length;
    if(k === 'h'){ if(it[1] <= 3) head = t; IDX.push({d:di, i:i, r:-1, t:t, l:t.toLowerCase(), h:''}); }
    else IDX.push({d:di, i:i, r:-1, t:t, l:t.toLowerCase(), h:head});
  });
  d.chars = chars;
});

/* ---------- 文字處理 ---------- */
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function hl(s){
  if(!terms.length) return esc(s);
  var low = s.toLowerCase(), rs = [];
  terms.forEach(function(t){
    var p = 0, x;
    while((x = low.indexOf(t, p)) >= 0){ rs.push([x, x + t.length]); p = x + t.length; }
  });
  if(!rs.length) return esc(s);
  rs.sort(function(a, b){ return a[0] - b[0]; });
  var out = '', pos = 0;
  rs.forEach(function(r){
    if(r[1] <= pos) return;
    var st = Math.max(r[0], pos);
    out += esc(s.slice(pos, st)) + '<mark>' + esc(s.slice(st, r[1])) + '</mark>';
    pos = r[1];
  });
  return out + esc(s.slice(pos));
}
function rich(s){
  return s.split(/(https?:\/\/[^\s]+)/).map(function(part, n){
    if(n % 2) return '<a href="' + esc(part) + '" target="_blank" rel="noopener">' + hl(part) + '</a>';
    return hl(part);
  }).join('');
}

/* ---------- 文件畫面 ---------- */
function block(it, i){
  var k = it[0], id = ' id="b' + i + '"';
  if(k === 'h'){ var n = Math.min(it[1] + 1, 5); return '<h' + n + id + '>' + hl(it[2]) + '<button class="fbh" data-fb="' + i + '" title="這一欄的臉書雙語文圖">📘 文圖</button></h' + n + '>'; }
  if(k === 'r') return '<hr>';
  if(k === 'q') return '<blockquote' + id + '>' + rich(it[1]) + '</blockquote>';
  if(k === 'm') return '<pre' + id + '>' + hl(it[1]) + '</pre>';
  if(k === 'l') return '<p class="li"' + id + '>' + rich(it[1]) + '</p>';
  if(k === 't'){
    var h = '<div class="tw"' + id + '><table>';
    it[1].forEach(function(row, r){
      var tag = (r === 0 && it[2]) ? 'th' : 'td';
      h += '<tr id="b' + i + 'r' + r + '">' + row.map(function(c){ return '<' + tag + '>' + rich(c) + '</' + tag + '>'; }).join('') + '</tr>';
    });
    return h + '</table></div>';
  }
  var t = it[1];
  if(t.indexOf('\n') >= 0) return '<p class="multi"' + id + '>' + rich(t) + '</p>';
  if(/^[↓⇩▼↓]+$/.test(t)) return '<p class="c"' + id + '>' + esc(t) + '</p>';
  if(t.indexOf('｜') > 0 && t.indexOf('http') < 0){
    var seg = t.split('｜');
    return '<p class="kv"' + id + '><b>' + hl(seg[0]) + '</b>' + seg.slice(1).map(function(s){
      return '<i class="sep">｜</i>' + hl(s); }).join('') + '</p>';
  }
  return '<p' + id + '>' + rich(t) + '</p>';
}

function showDoc(di, target){
  cur = di; mode = 'doc';
  var d = DOCS[di];
  store('lang.doc', String(di));
  var h = '<h1 class="title">' + esc(d.n) + '</h1><div class="meta"><span>' + fmt(d.chars) + ' 字</span>';
  if(terms.length) h += '<button class="back" id="back">← 回到搜尋結果（' + hits.length + '）</button>' +
    '<span>本文件 ' + (hitCount[di] || 0) + ' 處符合</span>';
  h += '<button class="fbh" data-fbdoc="1" title="整份文件的臉書雙語文圖">📘 本文件臉書文圖</button></div>';
  var parts = [h];
  for(var i = 0; i < d.b.length; i++) parts.push(block(d.b[i], i));
  $('view').innerHTML = parts.join('');
  var b = $('back'); if(b) b.onclick = showResults;
  side();
  document.body.classList.remove('open');
  if(target) jump(target, true); else window.scrollTo(0, 0);
}
function jump(id, flash){
  var el = $(id); if(!el) return;
  el.scrollIntoView({block: flash ? 'center' : 'start'});
  if(flash){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
}
function fmt(n){ return String(n).replace(/\B(?=(\d{3})+$)/g, ','); }

/* ---------- 側欄 ---------- */
function side(){
  var h = '';
  DOCS.forEach(function(d, di){
    if(d.x){ h += '<div class="doc x"><span class="nm">' + esc(d.n) + '</span><span class="ct">未載入</span></div>'; return; }
    var on = mode === 'doc' && di === cur;
    h += '<button class="doc' + (on ? ' on' : '') + '" data-d="' + di + '"><span class="nm">' + esc(d.n) + '</span>' +
      (terms.length ? (hitCount[di] ? '<span class="hit">' + hitCount[di] + '</span>' : '') :
        '<span class="ct">' + (d.chars >= 10000 ? (d.chars / 10000).toFixed(1) + ' 萬字' : fmt(d.chars) + ' 字') + '</span>') + '</button>';
    if(on){
      var min = 9; d.b.forEach(function(it){ if(it[0] === 'h' && it[1] < min) min = it[1]; });
      var all = 0; d.b.forEach(function(it){ if(it[0] === 'h' && it[1] <= min + 1) all++; });
      var deep = all <= 90 ? min + 1 : min, t = '';
      d.b.forEach(function(it, i){
        if(it[0] === 'h' && it[1] <= deep)
          t += '<button data-j="b' + i + '"' + (it[1] > min ? ' class="s"' : '') + ' title="' + esc(it[2]) + '">' + esc(it[2]) + '</button>';
      });
      if(t) h += '<div class="toc">' + t + '</div>';
    }
  });
  $('side').innerHTML = h;
}
$('side').onclick = function(e){
  var b = e.target.closest('button'); if(!b) return;
  if(b.dataset.j){ jump(b.dataset.j, false); document.body.classList.remove('open'); }
  else if(b.dataset.d){ showDoc(+b.dataset.d); }
};

/* ---------- 搜尋 ---------- */
function runSearch(){
  var q = $('q').value.trim().toLowerCase();
  $('sbox').classList.toggle('has', !!$('q').value);
  terms = q ? q.split(/\s+/) : [];
  hits = []; hitCount = {};
  if(!terms.length){ showDoc(cur); return; }
  for(var n = 0; n < IDX.length; n++){
    var e = IDX[n], ok = true;
    for(var k = 0; k < terms.length; k++){ if(e.l.indexOf(terms[k]) < 0){ ok = false; break; } }
    if(ok){ hits.push(e); hitCount[e.d] = (hitCount[e.d] || 0) + 1; }
  }
  showResults();
}
function snippet(e){
  var s = e.t;
  if(s.length > 170){
    var p = e.l.indexOf(terms[0]), a = Math.max(0, p - 50);
    s = (a ? '…' : '') + s.slice(a, a + 170) + (a + 170 < s.length ? '…' : '');
  }
  return hl(s);
}
function showResults(){
  mode = 'res';
  var h = '<h1 class="title">搜尋結果</h1><div class="meta"><span>共 ' + fmt(hits.length) + ' 筆，分布於 ' +
    Object.keys(hitCount).length + ' 份文件</span></div>';
  if(!hits.length) h += '<div class="empty">找不到符合的內容，換個關鍵字試試。</div>';
  var last = -1;
  hits.slice(0, MAXRES).forEach(function(e, n){
    if(e.d !== last){ last = e.d; h += '<div class="rg">' + esc(DOCS[e.d].n) + '<span>' + hitCount[e.d] + ' 筆</span></div>'; }
    h += '<button class="res" data-n="' + n + '">' + (e.h ? '<small>' + esc(e.h) + '</small>' : '') + snippet(e) + '</button>';
  });
  if(hits.length > MAXRES) h += '<div class="empty">僅顯示前 ' + MAXRES + ' 筆，請增加關鍵字縮小範圍，或從左側點選文件查看。</div>';
  $('view').innerHTML = h;
  side();
  window.scrollTo(0, 0);
}
$('view').onclick = function(e){
  var b = e.target.closest('.res'); if(!b) return;
  var x = hits[+b.dataset.n];
  showDoc(x.d, 'b' + x.i + (x.r >= 0 ? 'r' + x.r : ''));
};
var tm;
$('q').oninput = function(){ clearTimeout(tm); tm = setTimeout(runSearch, 180); };
$('clr').onclick = function(){ $('q').value = ''; runSearch(); $('q').focus(); };
document.addEventListener('keydown', function(e){
  if(e.key === '/' && document.activeElement !== $('q')){ e.preventDefault(); $('q').focus(); $('q').select(); }
  else if(e.key === 'Escape' && document.activeElement === $('q')){ $('q').value = ''; runSearch(); }
});

/* ───────── 主題文庫（中英對照） ───────── */
var TH={
lang:{zh:'語言升維',en:'Upgrading the way we speak',kw:['語言','說話','語法','命名','高維','低維','升維','翻譯','句','詞'],
 a:['我們常以為語言只是把心裡的話說出來，其實每一句話都在悄悄決定你接下來看見什麼。當你說「我完了」，大腦就開始搜尋完蛋的證據；當你說「我卡在哪一步」，大腦就開始找出口。換一句話，不是自我安慰，而是替自己多開一扇門。',
    'We tend to think language merely reports what is already inside us. In truth, every sentence quietly decides what we will notice next. Say “I am finished,” and the mind starts collecting proof of ruin. Say “Which step am I stuck on?” and the mind begins looking for an exit. Changing a sentence is not self-comfort; it is opening one more door for yourself.'],
 b:['高維的語言不是說得更玄，而是看得更細、說得更準。把「他都不在乎我」換成「他這週有三次沒回訊息，我感到失落」，事情就從一團情緒，變成一件可以討論的事。說得準，心就比較不亂。',
    'Higher-level language is not about sounding profound. It is about seeing more finely and naming more precisely. Replace “He never cares about me” with “He did not reply three times this week, and I felt let down,” and a cloud of emotion becomes something two people can actually talk about. When words are accurate, the heart is calmer.'],
 s:['忙了一整天的晚上，你看著沒洗的碗，心裡冒出「我什麼都做不好」。這時候只要停三秒，改成「我今天很累，碗可以明天洗」，肩膀就會鬆下來。',
    'It is the end of a long day. You look at the unwashed dishes and hear yourself think, “I can\'t do anything right.” Pause for three seconds and say instead, “I am tired today; the dishes can wait.” Notice how your shoulders drop.'],
 st:[['記下今天最常說的一句負面口頭禪。','Write down the negative phrase you used most today.'],['把它改寫成「目前……我可以……」的句型。','Rewrite it as “For now… and I can…”.'],['明天遇到同樣情境，先說新的那一句。','Tomorrow, in the same situation, say the new sentence first.']],
 q:[['你怎麼說，世界就怎麼回應你。','The way you speak is the way the world answers.'],['換一句話，就多一條路。','Change one sentence, and one more road appears.'],['說得準，心就定。','Name it precisely, and the heart settles.']]},
emotion:{zh:'情緒',en:'Listening to our emotions',kw:['情緒','焦慮','生氣','憤怒','恐懼','害怕','感受','壓力','痛苦','崩潰','難過','警報','安全感'],
 a:['情緒不是敵人，它是身體送來的訊息。焦慮在提醒你「有件事很重要」，生氣在告訴你「有條界線被踩到了」，難過在說「我失去了在乎的東西」。當你願意先聽懂訊息，情緒就不需要用更大的音量來敲門。',
    'Emotions are not enemies; they are messages sent by the body. Anxiety says, “Something here matters.” Anger says, “A boundary was crossed.” Sadness says, “I lost something I cared about.” Once you are willing to hear the message, the feeling no longer needs to knock louder.'],
 b:['幫情緒取一個準確的名字，是最溫柔也最有力的動作。「我很煩」太模糊，「我擔心來不及，所以很急」就清楚多了。名字一準，腦袋就從警報模式慢慢回到思考模式。',
    'Giving a feeling an accurate name is one of the gentlest and most powerful things you can do. “I\'m upset” is vague. “I\'m worried I won\'t finish in time, so I feel rushed” is clear. When the name fits, the mind slowly moves from alarm back to thinking.'],
 s:['下班回家，孩子把果汁打翻在地上，你的火氣一下子衝上來。先別急著開口，在心裡說一句：「我現在很累，所以特別容易生氣。」這一句話，常常就能救回一個晚上。',
    'You come home from work and your child spills juice on the floor. The heat rises fast. Before speaking, say silently, “I am tired right now, so I get angry easily.” That single sentence can often save the whole evening.'],
 st:[['情緒上來時，先深呼吸三次再說話。','When a feeling surges, take three slow breaths before you speak.'],['用「我感到……因為……」說出一個感受。','Name one feeling with “I feel… because…”.'],['睡前問自己：今天的情緒想告訴我什麼？','Before sleep, ask: what was today\'s feeling trying to tell me?']],
 q:[['情緒是訊息，不是判決。','A feeling is a message, not a verdict.'],['先安頓心情，再處理事情。','Settle the heart first, then handle the matter.'],['被聽懂的情緒，會自己安靜下來。','A feeling that is understood grows quiet on its own.']]},
relation:{zh:'關係與溝通',en:'Speaking well with the people we love',kw:['關係','溝通','傾聽','對話','伴侶','孩子','婚姻','請求','邊界','界線','衝突','理解','同理','別人','對方','合作','親子'],
 a:['關係裡最傷人的，往往不是事情本身，而是那句脫口而出的「你每次都這樣」。指責會讓對方忙著防衛，請求才會讓對方願意靠近。把「你從不幫忙」換成「今晚我很累，可以請你洗碗嗎」，對話就從戰場變成合作。',
    'What hurts most in a relationship is rarely the event itself, but the sentence that slips out: “You always do this.” Blame makes the other person defend; a request invites them closer. Change “You never help” into “I\'m exhausted tonight—could you do the dishes?” and the conversation moves from a battlefield to teamwork.'],
 b:['好好說話不是委屈自己，而是把立場說清楚，同時留一條路給對方走過來。先說看到的事實，再說自己的感受，最後提出一個具體的請求。需求可以很堅定，語氣可以很溫柔。',
    'Speaking well does not mean swallowing your needs. It means stating your position clearly while leaving a path for the other person to walk toward you. Start with what you saw, then how you felt, then one concrete request. A need can be firm while the tone stays kind.'],
 s:['伴侶回家後一直滑手機，你心裡很悶。與其冷冷地說「你眼裡只有手機」，不如說：「我今天很想跟你聊聊，可以給我十分鐘嗎？」多數時候，對方會把手機放下。',
    'Your partner comes home and keeps scrolling. Instead of a cold “All you see is your phone,” try: “I\'d really like to talk with you today. Could I have ten minutes?” More often than not, the phone goes down.'],
 st:[['今天對一個人，說出你看見他的努力。','Today, tell one person an effort of theirs that you noticed.'],['把一句抱怨改成一個具體的請求。','Turn one complaint into one specific request.'],['聽對方說完，再開口回應。','Let the other person finish before you respond.']],
 q:[['把指責換成請求，心就靠近了。','Trade blame for a request, and hearts move closer.'],['先理解，再被理解。','Understand first, then be understood.'],['溫柔而堅定，是最好的說話方式。','Gentle and firm is the best way to speak.']]},
error:{zh:'失敗與修正',en:'Turning mistakes into guidance',kw:['失敗','錯誤','誤差','Prediction Error','挫折','回饋','校準','修正','反例','打擊'],
 a:['失敗不是對你這個人的判決，它只是告訴你：原本的想法和現實之間，有一段落差。落差不可恥，它是最誠實的老師。把「我失敗了」改成「我的預測哪裡不準」，同一件事，就從羞愧變成了資料。',
    'Failure is not a verdict on who you are. It simply tells you there is a gap between what you expected and what is real. The gap is not shameful; it is the most honest teacher you have. Replace “I failed” with “Where was my prediction off?” and the same event turns from shame into data.'],
 b:['真正讓人停下來的，不是錯誤，而是對錯誤的解釋。如果每一次跌倒都說成「我就是不行」，下次就不敢再走。如果說成「這次找到一個要調整的地方」，你就會一次比一次穩。',
    'What stops people is not the mistake but the story they tell about it. If every fall becomes “I\'m just not good enough,” you won\'t dare to walk again. If it becomes “I found one thing to adjust,” you grow steadier each time.'],
 s:['考試成績不如預期，孩子低著頭說「我很笨」。你可以陪他把考卷攤開：「我們來看看，是哪一類題目卡住了？」當錯誤變成可以研究的東西，眼淚就會慢慢停下來。',
    'The test score is lower than hoped, and a child whispers, “I\'m stupid.” Sit down together and open the paper: “Let\'s see which kind of question got stuck.” When a mistake becomes something to study, the tears slowly stop.'],
 st:[['寫下最近一次不順利，只寫事實、不寫評價。','Write down one recent setback—facts only, no judgment.'],['找出一個「下次可以調整」的地方。','Find one thing you could adjust next time.'],['對自己說：這是資料，不是定論。','Tell yourself: this is data, not a conclusion.']],
 q:[['錯誤是資料，不是定論。','A mistake is data, not a final word.'],['跌倒的地方，藏著下一步的方向。','Where you fell hides the direction of your next step.'],['允許自己不完美，才走得久。','Allow yourself to be imperfect, and you can walk far.']]},
model:{zh:'預測與解釋',en:'The stories our mind predicts',kw:['預測','模型','假設','機率','大腦','認知','解釋','解讀','信念','世界模型','腦補','災難化','絕對','一定'],
 a:['大腦其實一直在猜。它用過去的經驗預測下一秒會發生什麼，再把預測當成眼前的現實。所以我們看到的，常常不是事情本身，而是自己的解釋。知道這一點，就多了一份謙卑，也多了一份自由：既然是猜的，就可以更新。',
    'The brain is always guessing. It uses past experience to predict the next moment, then treats that prediction as reality. So what we see is often not the event itself but our interpretation of it. Knowing this brings humility—and freedom: if it is a guess, it can be updated.'],
 b:['「他一定討厭我」是一個假設，不是事實。把「一定」換成「有可能」，再問一句「還有別的解釋嗎」，心裡的空間就大了。保留一點不確定，反而讓人更穩。',
    '“He must dislike me” is a hypothesis, not a fact. Replace “must” with “might,” then ask, “Is there another explanation?” and there is suddenly more room inside. Keeping a little uncertainty actually makes us steadier.'],
 s:['傳了訊息，朋友半天沒回，你開始想「是不是我說錯話了」。先停一下，列出三種可能：他在忙、他沒看到、他在想怎麼回。多半，事情沒有你猜的那麼糟。',
    'You send a message and a friend doesn\'t reply for hours. You start thinking, “Did I say something wrong?” Pause and list three possibilities: they\'re busy, they haven\'t seen it, they\'re thinking how to answer. Usually, things are not as bad as the first guess.'],
 st:[['遇到讓你不舒服的事，先寫下三種可能的解釋。','When something bothers you, write three possible explanations.'],['把一句「一定」改成「目前看起來」。','Change one “definitely” into “for now it seems”.'],['找一個小方法去確認，而不是只在心裡猜。','Find one small way to check instead of only guessing.']],
 q:[['你看到的，是你相信的。','What you see is what you believe.'],['想法只是想法，不等於事實。','A thought is only a thought, not a fact.'],['願意更新的人，永遠有出路。','Those willing to update always have a way out.']]},
identity:{zh:'自我與身分',en:'You are more than a label',kw:['人格','身分','身份','我就是','標籤','自我','羞恥','價值','自卑','固定','我很','我不行','否定'],
 a:['「我就是這樣的人」聽起來像自我了解，其實常常是一道鎖。行為是你做的事，不是你這個人。把「我很懶」換成「我今天沒有動力」，把「我很差」換成「這個能力我還在練」，你就從被定型的人，變回還在成長的人。',
    '“That\'s just who I am” sounds like self-knowledge, but it often works like a lock. Behavior is something you do, not who you are. Change “I\'m lazy” into “I had no drive today,” and “I\'m bad at this” into “I\'m still practicing this skill,” and you turn from a fixed person back into a growing one.'],
 b:['你的價值，從來不需要靠表現來換。事情可以做不好，你依然值得被好好對待。當你先停止用標籤攻擊自己，改變才有力氣發生。',
    'Your worth never has to be earned through performance. A task can go badly and you still deserve to be treated well. Only when you stop attacking yourself with labels does change find the strength to happen.'],
 s:['簡報講得不順，回家的路上你一直罵自己「我真沒用」。試著像對好朋友那樣對自己說：「今天那一段沒講好，下次我先多練兩遍。」同一件事，心情完全不同。',
    'A presentation goes poorly, and on the way home you keep telling yourself, “I\'m useless.” Try speaking to yourself as you would to a good friend: “That part didn\'t go well. Next time I\'ll rehearse it twice.” Same event, entirely different heart.'],
 st:[['抓出一個你常貼在自己身上的標籤。','Catch one label you often stick on yourself.'],['把它改成「在某個情境下的某個行為」。','Rewrite it as “a behavior in a situation”.'],['今天對自己說一句朋友才會說的話。','Today, say to yourself what a friend would say.']],
 q:[['你不是你的錯誤。','You are not your mistakes.'],['加上「目前」兩個字，人生就有了空間。','Add “for now,” and life has room again.'],['先接住自己，才走得遠。','Hold yourself first, and you can go far.']]},
agency:{zh:'主控與行動',en:'Finding what is yours to do',kw:['行動','控制','選擇','Agency','槓桿','最小介入','習慣','拖延','目標','實驗','迭代','主控','無力','受害','抱怨','怪罪'],
 a:['無力感最常來自一句話：「我也沒辦法。」但不管處境多窄，總有一小塊是你可以決定的。把注意力從「為什麼是我」移到「我現在能做什麼」，哪怕只是一件五分鐘的小事，主控權就開始回到手上。',
    'Helplessness most often comes from one sentence: “There\'s nothing I can do.” Yet however narrow the situation, there is always a small piece you can decide. Move your attention from “Why me?” to “What can I do right now?”—even one five-minute task—and control begins returning to your hands.'],
 b:['不需要一次改變全部。找到最小、最容易開始的那一步，做完，再看下一步。改變不是靠一次的決心，而是靠一次次做得到的小動作累積出來的。',
    'You don\'t need to change everything at once. Find the smallest, easiest step, finish it, and then look at the next. Change is built not by one great resolution but by small actions you can actually complete, again and again.'],
 s:['房間亂到不知道從哪裡開始，你乾脆躺回床上。試試只收桌上那一個杯子。杯子洗好了，你常常會順手再收一本書——行動，是從很小的地方長出來的。',
    'The room is such a mess that you don\'t know where to begin, so you lie back down. Try clearing just the one cup on the desk. Once it is washed, you often pick up a book as well. Action grows from very small places.'],
 st:[['寫下一件困擾你的事，圈出你能控制的部分。','Write down one worry and circle the part you can control.'],['選一個五分鐘內做得完的動作，現在就做。','Choose one action you can finish in five minutes, and do it now.'],['做完後對自己說：我有在前進。','Afterwards tell yourself: I am moving forward.']],
 q:[['先做一小步，路就會出現。','Take one small step, and the road appears.'],['把力氣放在能改變的地方。','Put your strength where change is possible.'],['你永遠有下一個選擇。','You always have a next choice.']]},
system:{zh:'系統與結構',en:'Seeing the pattern behind the problem',kw:['系統','結構','機制','變數','變量','迴路','因果','熵','瓶頸','循環','Pattern','模式','規律','節點'],
 a:['很多問題不是誰的錯，而是一個結構一直在重複產生同樣的結果。晚睡讓人疲倦，疲倦讓人滑手機，滑手機又讓人更晚睡。只怪自己沒毅力，沒有用；看懂這個循環，從其中一環輕輕改一點，整個結果就會不同。',
    'Many problems are nobody\'s fault; a structure simply keeps producing the same result. Sleeping late makes us tired, tiredness makes us scroll, and scrolling keeps us up later. Blaming willpower doesn\'t help. See the loop, change one link gently, and the whole outcome shifts.'],
 b:['把「為什麼我這麼糟」換成「是哪些因素一起造成的」，你就從自責走向理解。人、環境、時間、習慣，都是可以調整的變數。找到最關鍵的那一個，比用力十倍更有效。',
    'Replace “Why am I so terrible?” with “Which factors produced this together?” and you move from self-blame to understanding. People, environment, timing, and habits are all adjustable variables. Finding the one that matters most works better than trying ten times harder.'],
 s:['孩子每天早上都拖拖拉拉，你越催越生氣。後來你發現，問題出在前一晚沒整理書包。把書包改到睡前收好，早上的戰爭就少了一半。',
    'Your child dawdles every morning, and the more you rush, the angrier you get. Then you notice the real problem: the schoolbag isn\'t packed the night before. Move that one task to bedtime, and half the morning battle disappears.'],
 st:[['挑一個反覆發生的困擾，畫出它的先後順序。','Pick one recurring trouble and sketch its sequence.'],['找出最容易改動的一個環節。','Find the link that is easiest to change.'],['只改那一點，連續試七天。','Change only that, and try it for seven days.']],
 q:[['不怪人，看結構。','Don\'t blame the person; look at the structure.'],['改對一個小地方，勝過用力十倍。','Changing the right small thing beats ten times the effort.'],['看懂循環，就能走出循環。','See the loop, and you can step out of it.']]},
attention:{zh:'注意力與覺察',en:'Where attention goes, life grows',kw:['注意力','覺察','觀察','事實','描述','看見','資料','攝影機','停頓'],
 a:['你把注意力放在哪裡，生活就往哪裡長。一直看缺點，就會活在不足裡；願意看見一點點進步，就會慢慢生出力量。這不是要你假裝一切都好，而是提醒自己：除了問題，還有別的也值得被看見。',
    'Wherever you place your attention, your life grows in that direction. Stare only at flaws, and you live in lack. Notice even a little progress, and strength slowly appears. This is not pretending all is well; it is remembering that besides the problem, other things deserve to be seen too.'],
 b:['先分清楚「發生了什麼」和「我怎麼想」。事實是攝影機拍得到的，解讀是心裡加上去的。「他遲到二十分鐘」是事實，「他不尊重我」是解讀。把兩者分開，很多爭吵就不必發生。',
    'First separate “what happened” from “what I think about it.” Facts are what a camera could record; interpretation is what the mind adds. “He was twenty minutes late” is a fact. “He doesn\'t respect me” is an interpretation. Keep them apart, and many quarrels never need to begin.'],
 s:['一整天忙下來，你只記得那件沒做完的事。睡前試著寫下三件今天做到的小事：準時出門、回了一封難回的信、陪家人吃了晚餐。原來，今天並不差。',
    'After a full day, all you remember is the one thing left undone. Before sleep, write three small things you did manage: leaving on time, answering a hard email, having dinner with family. It turns out the day was not so bad.'],
 st:[['今天練習一次：只描述事實，不加形容詞。','Practice once today: describe facts only, no adjectives.'],['睡前寫下三件做到的小事。','Before bed, write three small things you accomplished.'],['發現自己在鑽牛角尖時，抬頭看看窗外。','When you notice yourself spiraling, look up and out the window.']],
 q:[['看見什麼，就長出什麼。','What you notice is what grows.'],['事實歸事實，想法歸想法。','Let facts be facts and thoughts be thoughts.'],['停下來看一眼，心就回來了。','Pause and look, and the heart comes home.']]},
growth:{zh:'學習與成長',en:'A little further than yesterday',kw:['學習','成長','能力','更新','練習','累積','複利','升級','進步','還不會','Skill'],
 a:['成長很少是一夜之間的事，它比較像每天存一點點。今天多懂一個觀念，明天多練一次，一開始看不出差別，時間久了卻會走到完全不同的地方。不必羨慕別人的速度，只要今天比昨天多一點點就好。',
    'Growth rarely happens overnight; it is more like saving a little each day. Understand one more idea today, practice once more tomorrow. At first there is no visible difference, yet over time you arrive somewhere entirely new. No need to envy anyone\'s speed—just be a little further than yesterday.'],
 b:['「我不會」後面加上「還」這個字，句子就活了。能力不是固定的，它是練出來的。把大目標拆成今天做得到的一小步，做完就給自己一個肯定，學習就會變成一件有力氣的事。',
    'Add the word “yet” after “I can\'t,” and the sentence comes alive. Ability is not fixed; it is trained. Break the big goal into one small step you can do today, and acknowledge yourself when it\'s done. Learning then becomes something that gives you energy.'],
 s:['想學英文很久了，卻總覺得太難。今天先不要想「學好英文」，只做一件事：把一句喜歡的話抄下來，唸三遍。明天再一句。一個月後，你會有三十句屬於自己的話。',
    'You\'ve wanted to learn English for ages, but it always feels too hard. Today, forget “mastering English.” Do one thing: copy a sentence you like and read it aloud three times. Tomorrow, one more. In a month you will own thirty sentences.'],
 st:[['把一個大目標，拆成今天做得到的一小步。','Break one big goal into a step you can do today.'],['在「我不會」後面加上「還」。','Add “yet” after “I can\'t”.'],['記下今天比昨天多懂的一件事。','Note one thing you understand better than yesterday.']],
 q:[['慢慢來，比較快。','Go slowly; it is faster.'],['每天一點點，時間會給你答案。','A little each day, and time will answer.'],['還不會，只是還沒練到。','“Not yet” only means not yet practiced.']]}
};

var HOOK=[

/* ───────── 從資料取出項目 ───────── */
function clean(s){
  return String(s).replace(/[│├└─┌┐┘┬┴┼]+/g,' ').replace(/^\s*(?:(?:[（(]?\d{1,4}[)）.、:：]|\d{2,4}\s+|#+|[•・●○◆■★☆▶►✅❌🔥👉➤\-–—*]+)\s*)+/,'').replace(/\s+/g,' ').trim();
}
function first(it){var k=it[0];if(k==='h')return it[2];if(k==='t'||k==='r')return '';return it[1].split('\n')[0];}
function headBefore(d,i){for(var j=i-1;j>=0;j--)if(d.b[j][0]==='h')return clean(d.b[j][2]);return '';}
function arrow(s){
  var p=s.indexOf('→');if(p<=0||s.indexOf('→',p+1)>=0)return null;
  var a=clean(s.slice(0,p)),b=clean(s.slice(p+1));
  return a.length>=2&&b.length>=2?[a,b]:null;
}
function plainP(it){return it&&it[0]==='p'&&it[1].indexOf('\n')<0;}
function itemEntry(di,i,r){
  var d=DOCS[di],it=d.b[i],e={kind:'item',doc:d.n,sec:headBefore(d,i),lines:[],subs:[],di:di,i:i,r:r,title:''};
  if(it[0]==='t'){
    var hdr=it[2]?it[1][0]:null,row=it[1][r],lo=-1,hi=-1,ar=-1;
    if(hdr)hdr.forEach(function(h,n){if(/^(舊|低維|原本|舊語言|低維語言)/.test(h))lo=n;if(/^(新|高維|更新|新語言|高維語言)/.test(h))hi=n;});
    row.forEach(function(c,n){if(ar<0&&arrow(c))ar=n;});
    var name='';row.forEach(function(c,n){if(!name&&n!==ar&&n!==lo&&n!==hi&&word(c)&&!/^\d+$/.test(c))name=clean(c.split('\n')[0]);});
    if(lo>=0&&hi>=0&&row[lo]&&row[hi]){e.kind='pair';e.low=clean(row[lo]);e.high=clean(row[hi]);}
    else if(ar>=0){var a=arrow(row[ar]);e.kind='pair';e.low=a[0];e.high=a[1];}
    row.forEach(function(c,n){
      if(!c||!word(c)||/^\d+$/.test(c))return;
      if(e.kind==='pair'&&(n===lo||n===hi||n===ar))return;
      var t=clean(c.replace(/\n/g,' '));if(t===name)return;
      e.lines.push(hdr&&hdr[n]&&hdr[n]!=='#'?hdr[n]+'：'+t:t);
    });
    e.title=name||e.low||e.lines[0]||e.sec;
    return e;
  }
  var raw=it[1].split('\n').map(function(s){return s.trim();}).filter(function(s){return s&&word(s);});
  var L2=raw.map(clean).filter(Boolean);
  if(!L2.length){e.title=e.sec;return e;}
  if(raw.length===1&&it[0]!=='m'){
    var s=raw[0],prev=d.b[i-1],next=d.b[i+1];
    if(/^→/.test(s)&&plainP(prev)&&!/^→/.test(prev[1])&&word(prev[1])){e.kind='pair';e.low=clean(prev[1]);e.high=clean(s.replace(/^→+/,''));e.title=e.low;return e;}
    if(plainP(next)&&/^→/.test(next[1])&&!/^→/.test(s)){e.kind='pair';e.low=clean(s);e.high=clean(next[1].replace(/^→+/,''));e.title=e.low;return e;}
    var seg=s.split('｜'),hit=-1;
    seg.forEach(function(x,n){if(hit<0&&arrow(x))hit=n;});
    if(hit>=0){
      var a2=arrow(seg[hit]);e.kind='pair';e.low=a2[0];e.high=a2[1];
      var nm='';seg.forEach(function(x,n){var c=clean(x);if(n===hit||!c||/^\d+$/.test(x.trim()))return;if(!nm&&n<hit)nm=c;else e.lines.push(c);});
      e.title=nm||e.low;return e;
    }

  e.title=L2[0];e.lines=L2.slice(1);
  if(it[0]==='m'&&e.sec){e.lines=L2.slice(0);e.title=e.sec;}
  // 太短的句子：補上同一段後面幾行當上下文
  if(e.lines.length===0&&e.title.length<30){
    for(var j=i+1,n=0;j<d.b.length&&j<i+9&&n<4;j++){
      var b=d.b[j];if(b[0]==='h'||b[0]==='t')break;if(b[0]==='r'||b[0]==='m')continue;
      var t=clean(first(b));if(t&&word(t)){e.lines.push(t);n++;}
    }
    e.ctx=1;
  }
  if(e.title.replace(/[：:，。！？\s]/g,'').length<4&&e.sec){e.lines.unshift(e.title);e.title=e.sec;}
  return e;
}
function secEntry(di,i){
  var d=DOCS[di],it=d.b[i],lv=it[1],e={kind:'sec',doc:d.n,sec:headBefore(d,i),title:clean(it[2])||it[2],lines:[],subs:[],di:di,i:i,r:-1};
  for(var j=i+1;j<d.b.length;j++){
    var b=d.b[j];
    if(b[0]==='h'){if(b[1]<=lv)break;if(e.subs.length<30)e.subs.push(clean(b[2]));continue;}
    if(b[0]==='r')continue;
    if(b[0]==='t'){b[1].slice(b[2]?1:0).forEach(function(row){if(e.lines.length<40){var t=row.filter(function(c){return c&&!/^\d+$/.test(c);}).join('｜').replace(/\n/g,' ');if(word(t))e.lines.push(t);}});continue;}
    if(e.lines.length<40){var t=clean(first(b));if(t.length>=2&&word(t))e.lines.push(t);}
  }
  return e;
}
function docEntry(di){
  var d=DOCS[di],e={kind:'sec',doc:d.n,sec:'',title:d.n.replace(/_/g,' '),lines:[],subs:[],di:di,i:-1,r:-1},min=9;
  d.b.forEach(function(b){if(b[0]==='h'&&b[1]<min)min=b[1];});
  d.b.forEach(function(b){
    if(b[0]==='h'){if(b[1]===min&&e.subs.length<30)e.subs.push(clean(b[2]));}
    else if(b[0]!=='r'&&b[0]!=='t'&&e.lines.length<6){var t=clean(first(b));if(t.length>=4&&word(t))e.lines.push(t);}
  });
  return e;
}

/* ───────── 貼文 ───────── */
function themes(e){
  var body=[e.title,e.low||'',e.high||''].join(' '),rest=e.lines.concat(e.subs,[e.sec,e.doc]).join(' ');
  var sc=ORDER.map(function(k,n){var s=k==='lang'?0.5:0;TH[k].kw.forEach(function(w){if(body.indexOf(w)>=0)s+=2;if(rest.indexOf(w)>=0)s+=1;});return {k:k,s:s-n*0.01};});
  sc.sort(function(a,b){return b.s-a.s;});
  return [TH[sc[0].k],TH[sc[1].k]];
}
function count(t){return (t.match(/[一-鿿]/g)||[]).length+(t.match(/[A-Za-z][A-Za-z'’\-]*/g)||[]).length;}
function build(e,v){
  var T=cut(e.title.replace(/^[《【]([^》】]*)[》】]$/,'$1'),40),k=hash(e.title)+v,th=themes(e),A=th[0],B=th[1],Z=[],E=[];
  var p1=v%3===1?A.b:v%3===2?B.a:A.a,p2=v%3===1?B.a:v%3===2?A.a:A.b,sc=v%3===1?B.s:A.s,st=v%2?B.st:A.st;
  var qs=A.q.concat(B.q),q1=pick(qs,k),q2=pick(qs,k+1),q3=pick(qs,k+2);
  var hook=pick(HOOK,k)(T.replace(/[。！？?!]$/,'')),cl=pick(CLOSE,k),a1=pick(ASK,k),a2=pick(ASK,k+2);
  var keys=[],all=[e.title,e.low||'',e.high||''].concat(e.lines,e.subs,[e.sec]).join(' ');
  GLOSS.forEach(function(g){if(keys.length<5&&all.indexOf(g[0])>=0)keys.push(g[1]);});

  Z.push('【'+T+'】',e.title.length>22?'這一段，想送給今天的你。':hook[0],'');
  if(e.kind==='pair'){
    Z.push('▍換句話說','✗ 舊說法：「'+cut(e.low,90)+'」','✓ 新說法：「'+cut(e.high,90)+'」');
    e.lines.slice(0,3).forEach(function(s){Z.push('・'+cut(s,80));});
    Z.push('',PAIRWHY[0],'');
  }else if(e.kind==='sec'){
    if(e.lines.length){Z.push('▍這一欄的重點');e.lines.slice(0,6).forEach(function(s){Z.push('・'+cut(s,70));});if(e.lines.length>6)Z.push('…（共 '+e.lines.length+(e.lines.length>=40?'+':'')+' 項）');Z.push('');}
    if(e.subs.length){Z.push('▍這一欄的項目');e.subs.slice(0,8).forEach(function(s){Z.push('・'+cut(s,40));});if(e.subs.length>8)Z.push('…等 '+e.subs.length+(e.subs.length>=30?'+':'')+' 個');Z.push('');}
  }else if(e.lines.length){
    Z.push(e.ctx?'▍原文接著說':'▍原文重點');e.lines.slice(0,5).forEach(function(s){Z.push('・'+cut(s,90));});Z.push('');
  }
  Z.push('▍換個角度看',p1[0],'','▍生活裡的樣子',sc[0],'','▍再往深一層',p2[0],'');
  Z.push('▍今天的三個小練習');st.forEach(function(s,n){Z.push((n+1)+'. '+s[0]);});Z.push('');
  Z.push('▍想一想','・'+a1[0],'・'+a2[0],'');
  Z.push('🍲 心靈雞湯','「'+q1[0]+'」','「'+q2[0]+'」','');
  Z.push(cl[0]);

  E.push('— English —','','【'+A.en+'】','Today\'s note｜今日主題：「'+T+'」',hook[1],'');
  if(keys.length)E.push('Key ideas: '+keys.join(' · '),'');
  if(e.kind==='pair')E.push(PAIRWHY[1],'');
  E.push('▍A different angle',p1[1],'','▍In everyday life',sc[1],'','▍One level deeper',p2[1],'');
  E.push('▍Three small practices for today');st.forEach(function(s,n){E.push((n+1)+'. '+s[1]);});E.push('');
  E.push('▍Reflect','・'+a1[1],'・'+a2[1],'');
  E.push('🍲 Soup for the soul','“'+q1[1]+'”','“'+q2[1]+'”','');
  E.push(cl[1]);

  // 篇幅不足 1000 字時，再補一段
  var used=[p1,p2],pool=[B.b,B.a,A.b,A.a,B.s,A.s].filter(function(p){return used.indexOf(p)<0&&p!==sc;});
  var heads=[['▍給今天的你','▍A note for you today'],['▍還想多說一句','▍One more thought'],['▍最後的小提醒','▍A last gentle reminder']];
  for(var x=0;x<3&&x<pool.length&&count(Z.concat(E).join('\n'))<950;x++){
    var qx=pick(qs,k+2+x);
    Z.splice(Z.length-1,0,heads[x][0],pool[x][0],'「'+qx[0]+'」','');
    E.splice(E.length-1,0,heads[x][1],pool[x][1],'“'+qx[1]+'”','');
  }
  var src='出處｜'+BRAND+'｜'+e.doc.replace(/_/g,' ')+(e.sec&&e.sec!==e.title?' › '+cut(e.sec,30):'');
  var tags=['#心靈雞湯','#'+A.zh.replace(/與/g,''),'#好好說話','#語言升維','#自我成長','#DailyWisdom','#SelfGrowth','#LifeOS'];
  var text=Z.concat([''],E,['',src,'',tags.join(' ')]).join('\n');
  var card={tab:[cut(e.doc.replace(/_/g,' '),16),e.sec&&e.sec!==e.title?cut(e.sec,18):''].filter(Boolean).join(' · '),head:T,q:q1,theme:A};
  if(e.kind==='pair'){card.kind='pair';card.low=cut(e.low,70);card.high=cut(e.high,70);}
  else{card.kind='item';card.lines=(e.kind==='sec'?e.lines.slice(0,2).concat(e.subs):e.lines).slice(0,4).map(function(s){return cut(s,40);});}
  return {text:text,card:card};
}

/* ───────── 圖卡 1080×1350 ───────── */
function wrap(x,text,maxW){
  var tk=String(text).match(/[A-Za-z0-9'’\-]+[.,!?;:]?\s?|\s+|[^\sA-Za-z0-9]/g)||[],noHead='，。！？、；：」』）)…—”',out=[],cur=[];
  function push(){var s=cur.join('').trim();if(s)out.push(s);}
  tk.forEach(function(w){
    if(cur.join('').trim()&&x.measureText(cur.join('')+w).width>maxW){
      var carry=[];if(noHead.indexOf(w)>=0&&cur.length>1)carry.unshift(cur.pop());
      push();cur=carry.concat(w.replace(/^\s+/,''));
    }else cur.push(w);
  });
  push();return out;
}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
function draw(cv,c,th){
  var W=1080,H=1350,X=84,MW=W-168,x=cv.getContext('2d');cv.width=W;cv.height=H;
  function lay(s,paint,off){
    function f(px,wt){x.font=(wt||'')+' '+Math.round(px*s)+'px '+ZH;}
    function put(arr,a,y,lh,col){if(paint){x.fillStyle=col;arr.forEach(function(l,i){x.fillText(l,a,y+i*lh);});}return y+arr.length*lh;}
    function box(arr,y,lh,bg,bar,col,label,px,wt){
      var h=arr.length*lh+(label?104:64)*s;
      if(paint){x.fillStyle=bg;rr(x,X-20,y,MW+40,h,28);x.fill();x.fillStyle=bar;x.fillRect(X-20,y+24,10,h-48);}
      if(label){f(28,'bold');put([label],X+32,y+30*s,40*s,bar);}
      f(px,wt);put(arr,X+32,y+(label?78:34)*s,lh,col);
      return y+h;
    }
    x.textBaseline='top';x.textAlign='left';
    f(56,'bold');var head=wrap(x,c.head,MW),hh=Math.round(150+head.length*76*s+50);
    if(paint){
      x.fillStyle='#FAF6EF';x.fillRect(0,0,W,H);x.fillStyle=th.c;x.fillRect(0,0,W,hh);
      x.font='30px '+ZH;x.fillStyle='rgba(255,255,255,.85)';var tb=c.tab||BRAND;while(tb.length>4&&x.measureText(tb).width>MW)tb=tb.slice(0,-2)+'…';x.fillText(tb,X,64);
    }
    f(56,'bold');put(head,X,124,76*s,'#fff');
    var y=hh+60*s+off;
    if(c.kind==='pair'){
      f(44,'bold');var lo=wrap(x,c.low,MW-90),hi=wrap(x,c.high,MW-90);
      y=box(lo,y,62*s,'#FBE7EA','#B4233C','#5A1622','✗ 舊說法 Before',44,'bold');
      f(50,'bold');if(paint){x.fillStyle=th.c;x.fillText('↓',W/2-14*s,y+12*s);}y+=84*s;
      y=box(hi,y,62*s,th.t,th.c,'#1F2937','✓ 新說法 After',44,'bold')+50*s;
    }else if(c.lines.length){
      f(36,'');var bl=[];c.lines.forEach(function(l){wrap(x,'・'+l,MW-90).forEach(function(w){bl.push(w);});});
      y=box(bl,y,56*s,th.t,th.c,'#3A332E','',36,'')+50*s;
    }
    f(27,'bold');var lab='心靈雞湯 · '+c.theme.zh,pw=x.measureText(lab).width+48,ph=54*s;
    if(paint){x.fillStyle=th.c;rr(x,X,y,pw,ph,ph/2);x.fill();x.fillStyle='#fff';x.fillText(lab,X+24,y+(ph-27*s)/2-2);}
    y+=ph+24*s;
    f(c.kind==='item'&&!c.lines.length?58:42,'bold');y=put(wrap(x,'「'+c.q[0]+'」',MW),X,y,(c.kind==='item'&&!c.lines.length?84:62)*s,'#2B2622')+10*s;
    f(31,'italic');y=put(wrap(x,'“'+c.q[1]+'”',MW),X,y,46*s,'#7A6F66');
    return y;
  }
  var s=1.45;while(s>0.5&&lay(s,false,0)>H-190)s-=0.03;
  lay(s,true,Math.max(0,Math.min(150,(H-190-lay(s,false,0))/2)));
  x.fillStyle='#E4DAD0';x.fillRect(X,H-130,MW,3);
  x.textBaseline='top';x.font='bold 32px '+ZH;x.fillStyle=th.c;x.fillText(BRAND,X,H-96);
  x.font='28px '+ZH;x.fillStyle='#8A7F76';var tg='#心靈雞湯  #DailyWisdom';x.fillText(tg,W-X-x.measureText(tg).width,H-94);
}

/* ───────── 介面 ───────── */
var cur=null,ver=0,ti=parseInt(ls('theme'),10);if(!(ti>=0&&ti<COLORS.length))ti=0;
function toast(b,t){var o=b.textContent;b.textContent=t;setTimeout(function(){b.textContent=o;},1200);}
function save(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},2000);}
function fname(){return ('雞湯文圖_'+cur.title).replace(/[\\/:*?"<>|\s，。！？、「」《》【】]+/g,'_').slice(0,40);}
function show(){
  var r=build(cur,ver);
  $('fbxTitle').textContent='📘 '+(cur.kind==='sec'?(cur.i<0?'本文件：':'本欄：'):'')+cut(cur.title,30);
  $('fbxSrc').textContent=cur.doc.replace(/_/g,' ')+(cur.sec?' › '+cur.sec:'');
  $('fbxText').value=r.text;$('fbxText').scrollTop=0;$('fbxCnt').textContent='約 '+count(r.text)+' 字（中文字＋英文單字）';
  draw($('fbxCanvas'),r.card,COLORS[ti]);
}
function open(e){if(!e||!e.title)return;cur=e;ver=0;$('fbxMask').classList.add('on');show();}
function close(){$('fbxMask').classList.remove('on');}
function usable(d,i){var b=d.b[i];if(!b||b[0]==='r')return false;if(b[0]==='t')return true;return word(b[0]==='h'?b[2]:b[1]);}
function step(dir){
  if(!cur||cur.i<0)return;
  var d=DOCS[cur.di],i=cur.i,r=cur.r,sec=cur.kind==='sec';
  for(var n=0;n<d.b.length*2;n++){
    var b=d.b[i];
    if(!sec&&b&&b[0]==='t'){
      r+=dir;var lo=b[2]?1:0;
      if(r>=lo&&r<b[1].length){open(itemEntry(cur.di,i,r));return;}
    }
    i+=dir;if(i<0||i>=d.b.length)return;
    b=d.b[i];
    if(sec){if(b[0]==='h'){open(secEntry(cur.di,i));return;}continue;}
    if(b[0]==='h'||!usable(d,i))continue;
    if(b[0]==='t'){r=dir>0?(b[2]?0:-1):b[1].length;continue;}
    open(itemEntry(cur.di,i,-1));return;
  }
}
var m=document.createElement('div');m.id='fbxMask';
m.innerHTML='<div id="fbxBox"><div id="fbxTop"><b id="fbxTitle"></b><button id="fbxPrev" type="button">‹ 上一則</button><button id="fbxNx" type="button">下一則 ›</button><button id="fbxX" type="button" title="關閉">×</button></div>'+
 '<div id="fbxSrc"></div><div id="fbxMain"><div><textarea id="fbxText" spellcheck="false"></textarea><div id="fbxBar">'+
 '<button type="button" id="fbxCopy">📋 複製貼文</button><button type="button" id="fbxPng">🖼️ 下載圖卡</button>'+
 '<button type="button" class="g" id="fbxNext">🔄 換一版</button><button type="button" class="g" id="fbxTheme">🎨 換配色</button>'+
 '<button type="button" class="g" id="fbxTxt">💾 存成 TXT</button><span id="fbxCnt"></span></div>'+
 '<div id="fbxTip">貼文可以直接在框裡修改。到臉書發文：貼上文字，再加入下載的圖卡。</div></div>'+
 '<div><canvas id="fbxCanvas"></canvas></div></div></div>';
document.body.appendChild(m);
var hv=document.createElement('button');hv.id='fbxHover';hv.type='button';hv.title='這一項的臉書雙語文圖';hv.textContent='📘';
document.body.appendChild(hv);
m.addEventListener('click',function(e){if(e.target===m)close();});
$('fbxX').onclick=close;
$('fbxPrev').onclick=function(){step(-1);};$('fbxNx').onclick=function(){step(1);};
document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
$('fbxNext').onclick=function(){ver++;show();};
$('fbxTheme').onclick=function(){ti=(ti+1)%COLORS.length;ls('theme',String(ti));draw($('fbxCanvas'),build(cur,ver).card,COLORS[ti]);};
$('fbxCopy').onclick=function(){
  var t=$('fbxText'),b=this;function fb(){t.select();try{document.execCommand('copy');}catch(e){}}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).catch(fb);else fb();
  toast(b,'✅ 已複製');
};
$('fbxPng').onclick=function(){$('fbxCanvas').toBlob(function(b){save(b,fname()+'.png');},'image/png');};
$('fbxTxt').onclick=function(){save(new Blob(['﻿'+$('fbxText').value],{type:'text/plain;charset=utf-8'}),fname()+'.txt');};

// 每個項目：滑鼠移上去（或點一下）就出現 📘
var view=$('view'),hot=null;
function target(el){
  if(L.mode()!=='doc'||!el||!el.closest)return null;
  var t=el.closest('tr[id],p[id],blockquote[id],pre[id]');
  if(!t||!view.contains(t))return null;
  var mm=/^b(\d+)(?:r(\d+))?$/.exec(t.id);if(!mm)return null;
  var i=+mm[1],r=mm[2]===undefined?-1:+mm[2],b=DOCS[L.cur()].b[i];
  if(!b)return null;
  if(b[0]==='t'){if(r<0||(b[2]&&r===0))return null;}
  else if(!word(b[1]))return null;
  return {el:t,i:i,r:r};
}
function place(t){
  if(hot&&hot.el!==(t&&t.el))hot.el.classList.remove('fbsel');
  hot=t;if(!t){hv.style.display='none';return;}
  var rc=t.el.getBoundingClientRect(),wr=view.getBoundingClientRect();
  hv.style.display='block';
  hv.style.top=(rc.top+window.scrollY+Math.max(0,Math.min(6,(rc.height-28)/2)))+'px';
  hv.style.left=Math.min(wr.right+2,document.documentElement.clientWidth-32)+'px';
}
view.addEventListener('mouseover',function(e){var t=target(e.target);if(t)place(t);});
view.addEventListener('click',function(e){
  var h=e.target.closest('[data-fb]');
  if(h){e.stopPropagation();open(secEntry(L.cur(),+h.getAttribute('data-fb')));return;}
  if(e.target.closest('[data-fbdoc]')){open(docEntry(L.cur()));return;}
  if(e.target.closest('a,button'))return;
  var t=target(e.target);if(t){place(t);t.el.classList.add('fbsel');}
});
hv.addEventListener('click',function(){if(hot)open(itemEntry(L.cur(),hot.i,hot.r));});
new MutationObserver(function(){hot=null;hv.style.display='none';}).observe(view,{childList:true});
window.FBXTEST={item:itemEntry,sec:secEntry,doc:docEntry,build:build,count:count};
})();
