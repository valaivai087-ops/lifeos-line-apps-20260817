s": "N"}], "answers": ["limitation", "qualifies", "access", "necessary", "optimistic"], "why": ["still lack…指出 limitation，不是新增成功例。", "qualifies earlier praise 表修正範圍；confirms 忽略保留段功能。", "住戶無回收點是 access 不均。", "尚缺設施，further work necessary。", "避免把局部成功說成全面成功，防止 overly optimistic；不是防止悲觀結論。"], "evidence": ["This section introduces a {limitation}.", "It {qualifies} the earlier praise rather than canceling every achievement.", "By drawing attention to unequal {access}, it explains why further work is {necessary}.", "By drawing attention to unequal {access}, it explains why further work is {necessary}.", "Its function is to prevent an overly {optimistic} conclusion."], "type": 11, "level": 4, "tags": ["Global", "Semantics"], "slot": 4}, {"id": "P117", "title": "一篇有保留的展覽評論", "en": "The critic admired the exhibition's ambitious topic but questioned its lack of local voices. She called the photographs {powerful} while describing the captions as incomplete. Her response was therefore {mixed}, not wholly negative. The word \"ambitious\" did not signal unconditional {approval}. Instead, she urged the museum to {include} more perspectives. Her criticism expressed a desire for {improvement}, rather than a demand to close the show.", "zh": "評論者欣賞展覽題目有企圖心，卻質疑缺乏地方聲音。她稱照片有力量，但說圖說不完整。因此態度是褒貶並存，不是全然負面。「有企圖心」不代表無條件贊同。她要求納入更多觀點，批評意在改進而非關展。", "bank": [{"word": "approval", "zh": "贊同", "pos": "N"}, {"word": "exclude", "zh": "排除", "pos": "V"}, {"word": "mixed", "zh": "褒貶並存的", "pos": "Adj"}, {"word": "improvement", "zh": "改進", "pos": "N"}, {"word": "powerful", "zh": "有力量的", "pos": "Adj"}, {"word": "include", "zh": "納入", "pos": "V"}, {"word": "hostile", "zh": "敵意的", "pos": "Adj"}], "answers": ["powerful", "mixed", "approval", "include", "improvement"], "why": ["admired 與照片稱讚支持 powerful；不是把所有元素都貶低。", "優點加缺點組成 mixed；hostile 過強且忽略欣賞。", "unconditional approval 是文章明確否定的解讀。", "缺少地方聲音故應 include；exclude 方向相反。", "改進建議反映 improvement，不等於主張取消展覽。"], "evidence": ["She called the photographs {powerful} while describing the captions as incomplete.", "Her response was therefore {mixed}, not wholly negative.", "The word \"ambitious\" did not signal unconditional {approval}.", "Instead, she urged the museum to {include} more perspectives.", "Her criticism expressed a desire for {improvement}, rather than a demand to close the show."], "type": 12, "level": 4, "tags": ["Global", "Semantics"], "slot": 4}, {"id": "P118", "title": "夜間足跡的限度", "en": "Fresh tracks appeared near a pond after a snowy evening. A camera recorded a fox passing at midnight, but it did not cover the entire shore. The image establishes the fox's {presence}. It does not prove that the fox made {all} the tracks. Other animals may have used the area {unobserved}. The investigator therefore described the fox as a {possible} source. Identifying every footprint would require {additional} evidence.", "zh": "雪夜後，池邊有新足跡。攝影機拍到狐狸午夜經過，但未涵蓋整岸。影像確立狐狸曾在場，不能證明所有足跡都是牠留下。其他動物可能在未被觀察時使用該處。因此調查者稱狐狸為可能來源；辨認每個腳印仍需更多證據。", "bank": [{"word": "presence", "zh": "在場", "pos": "N"}, {"word": "exclusive", "zh": "唯一的／排他的", "pos": "Adj"}, {"word": "all", "zh": "全部的", "pos": "Det"}, {"word": "additional", "zh": "額外的", "pos": "Adj"}, {"word": "unobserved", "zh": "未被觀察的", "pos": "Adj"}, {"word": "possible", "zh": "可能的", "pos": "Adj"}, {"word": "absence", "zh": "不在場", "pos": "N"}], "answers": ["presence", "all", "unobserved", "possible", "additional"], "why": ["影像證明 presence，不能說 absence。", "not prove all 限制足跡歸屬，不能由一次影像概括全部。", "鏡頭未涵蓋整岸，其他動物可能 unobserved。", "possible source 保留他因；exclusive 宣稱唯一來源超出證據。", "現有資料不足，需 additional evidence。"], "evidence": ["The image establishes the fox's {presence}.", "It does not prove that the fox made {all} the tracks.", "Other animals may have used the area {unobserved}.", "The investigator therefore described the fox as a {possible} source.", "Identifying every footprint would require {additional} evidence."], "type": 13, "level": 4, "tags": ["Global", "Semantics"], "slot": 4}, {"id": "P119", "title": "復育尚未結束", "en": "The opening section reports that more fish have returned to the stream. Later, the article notes that pollution still enters after heavy rain. A consistent conclusion must recognize both {recovery} and continuing risk. Declaring the stream completely {restored} would go beyond the evidence. The final paragraph instead calls for regular {monitoring}. This recommendation {matches} the unresolved problem and avoids a {contradiction} between the ending and the earlier details.", "zh": "開頭說溪流魚變多，後文提醒大雨後仍有污染流入。一致的結論須兼顧復原和持續風險。宣稱已完全復育會超出證據。末段改為要求定期監測，與未解決問題一致，避免結尾和前文矛盾。", "bank": [{"word": "matches", "zh": "符合", "pos": "V"}, {"word": "recovery", "zh": "復原", "pos": "N"}, {"word": "contradiction", "zh": "矛盾", "pos": "N"}, {"word": "ignores", "zh": "忽略", "pos": "V"}, {"word": "restored", "zh": "復育完成的", "pos": "V-en"}, {"word": "monitoring", "zh": "監測", "pos": "N"}, {"word": "neglect", "zh": "忽視", "pos": "N"}], "answers": ["recovery", "restored", "monitoring", "matches", "contradiction"], "why": ["more fish returned 是 recovery 的證據，但不是無風險。", "completely restored 是全文認為過度的描述，注意 would go beyond。", "仍有污染需要 monitoring，不能 neglect。", "監測建議 matches 未解問題；ignores 會反向。", "ending 與 earlier details 不一致會成 contradiction。"], "evidence": ["A consistent conclusion must recognize both {recovery} and continuing risk.", "Declaring the stream completely {restored} would go beyond the evidence.", "The final paragraph instead calls for regular {monitoring}.", "This recommendation {matches} the unresolved problem and avoids a {contradiction} between the ending and the earlier details.", "This recommendation {matches} the unresolved problem and avoids a {contradiction} between the ending and the earlier details."], "type": 14, "level": 4, "tags": ["Global", "Semantics"], "slot": 4}, {"id": "P120", "title": "展覽的文具清單", "en": "Before the art fair, the class bought pens and other {stationery}. The supply cart remained {stationary} while students unloaded it. Each student gave the organizer a {description} of a planned display. The organizer checked that the labels would {complement} the artwork rather than distract from it. She later offered a {compliment} on the team's careful preparation.", "zh": "美術展前，班上買筆與其他文具。學生卸貨時，推車保持不動。每人向主辦者描述預計展出內容。主辦者確認標籤能補充作品而非搶焦點，後來也稱讚團隊準備細心。", "bank": [{"word": "description", "zh": "描述", "pos": "N"}, {"word": "competition", "zh": "競爭", "pos": "N"}, {"word": "complement", "zh": "補充／相襯", "pos": "V"}, {"word": "stationery", "zh": "文具", "pos": "N"}, {"word": "prescription", "zh": "處方", "pos": "N"}, {"word": "compliment", "zh": "稱讚", "pos": "N"}, {"word": "stationary", "zh": "靜止的", "pos": "Adj"}], "answers": ["stationery", "stationary", "description", "complement", "compliment"], "why": ["pens and other stationery 為文具，注意 -ery。", "remained stationary 為保持靜止，注意 -ary。", "planned display 的內容說明為 description；prescription 是處方。", "labels complement artwork 指相輔相成；compliment 表稱讚而非補充功能。", "offer a compliment on 準備工作，是稱讚，不是和誰競爭。"], "evidence": ["Before the art fair, the class bought pens and other {stationery}.", "The supply cart remained {stationary} while students unloaded it.", "Each student gave the organizer a {description} of a planned display.", "The organizer checked that the labels would {complement} the artwork rather than distract from it.", "She later offered a {compliment} on the team's careful preparation."], "type": 15, "level": 2, "tags": ["Semantics"], "slot": 4}, {"id": "P121", "title": "地方科學競賽", "en": "Each {competitor} brought a model to the hall. The annual {competition} encouraged students to solve local problems. Judges valued original thinking more than a fiercely {competitive} attitude. One team's water filter made a useful {contribution} to the discussion. Its youngest {contributor} explained the design with surprising clarity.", "zh": "每位參賽者帶模型到會場。年度競賽鼓勵學生解決地方問題。評審重視原創思考，勝過強烈競爭態度。一隊濾水器對討論有實用貢獻。最年輕的貢獻者解說設計格外清楚。", "bank": [{"word": "competitor", "zh": "參賽者", "pos": "N"}, {"word": "competition", "zh": "競賽", "pos": "N"}, {"word": "compete", "zh": "競爭", "pos": "V"}, {"word": "contributor", "zh": "貢獻者", "pos": "N"}, {"word": "contribute", "zh": "貢獻", "pos": "V"}, {"word": "contribution", "zh": "貢獻", "pos": "N"}, {"word": "competitive", "zh": "競爭性的", "pos": "Adj"}], "answers": ["competitor", "competition", "competitive", "contribution", "contributor"], "why": ["Each 後是帶模型的人，competitor；compete 是動詞。", "annual competition 是年度活動本身，不是參加的人。", "attitude 前需 competitive 形容詞，fiercely 修飾程度。", "made a useful contribution 指貢獻成果，不能用原形 contribute。", "youngest contributor 指能解說的人；contribution 不能指最年輕者。"], "evidence": ["Each {competitor} brought a model to the hall.", "The annual {competition} encouraged students to solve local problems.", "Judges valued original thinking more than a fiercely {competitive} attitude.", "One team's water filter made a useful {contribution} to the discussion.", "Its youngest {contributor} explained the design with surprising clarity."], "type": 16, "level": 3, "tags": ["POS", "Semantics"], "slot": 4}, {"id": "P122", "title": "街坊物資調查", "en": "Volunteers will {survey} residents about emergency supplies. The {results} will help identify gaps in preparation. Rather than {store} everything in one building, the group plans several smaller depots. A local {shop} has already offered space for one of them. The plan will {benefit} households far from the central station.", "zh": "志工將調查居民的緊急物資。結果能找出準備不足處。團隊不打算把所有東西存一棟樓，而規劃幾個小據點。一家在地商店已提供空間。計畫將使遠離中央站的住戶受益。", "bank": [{"word": "benefit", "zh": "使受益", "pos": "V"}, {"word": "storage", "zh": "儲存", "pos": "N"}, {"word": "store", "zh": "存放／商店", "pos": "V/N"}, {"word": "survey", "zh": "調查", "pos": "V"}, {"word": "beneficial", "zh": "有益的", "pos": "Adj"}, {"word": "shop", "zh": "商店", "pos": "N"}, {"word": "results", "zh": "結果", "pos": "N"}], "answers": ["survey", "results", "store", "shop", "benefit"], "why": ["will 後用動詞 survey。", "The results 作主詞表示調查結果。", "Rather than store… 中 store 是動詞；storage 是名詞。", "a local shop 指商店，local 後要名詞；store 則已在前格作存放動詞。", "will benefit 後接 households，beneficial 為形容詞不能直接接助動詞。"], "evidence": ["Volunteers will {survey} residents about emergency supplies.", "The {results} will help identify gaps in preparation.", "Rather than {store} everything in one building, the group plans several smaller depots.", "A local {shop} has already offered space for one of them.", "The plan will {benefit} households far from the central station."], "type": 17, "level": 3, "tags": ["POS", "Semantics"], "slot": 4}, {"id": "P123", "title": "準備社區演出", "en": "To organize the concert, the students first {drew} up a schedule. They agreed to {share} responsibility for equipment checks. Before rehearsal, they would {run} a sound test. Everyone was asked to {keep} track of borrowed items. These habits helped the group {meet} its deadline without a last-minute rush.", "zh": "學生為籌辦音樂會，先擬定時程，並同意分擔設備檢查責任。彩排前進行音效測試。大家要追蹤借來的物品。這些習慣幫團隊按期完成，不必最後一刻趕工。", "bank": [{"word": "share", "zh": "分擔", "pos": "V"}, {"word": "meet", "zh": "達成／滿足", "pos": "V"}, {"word": "run", "zh": "進行／跑", "pos": "V"}, {"word": "drew", "zh": "擬定／畫〔過去式〕", "pos": "V"}, {"word": "catch", "zh": "接住", "pos": "V"}, {"word": "keep", "zh": "保持", "pos": "V"}, {"word": "painted", "zh": "繪畫了", "pos": "V"}], "answers": ["drew", "share", "run", "keep", "meet"], "why": ["draw up a schedule 是擬定時程；paint up 無此搭配。", "share responsibility 表分擔責任，與分工相合。", "run a test 是進行測試，不是字面奔跑。", "keep track of 表追蹤記錄，不用 catch track。", "meet a deadline 為如期完成，不能逐字理解成與期限見面。"], "evidence": ["To organize the concert, the students first {drew} up a schedule.", "They agreed to {share} responsibility for equipment checks.", "Before rehearsal, they would {run} a sound test.", "Everyone was asked to {keep} track of borrowed items.", "These habits helped the group {meet} its deadline without a last-minute rush."], "type": 18, "level": 3, "tags": ["Collocation", "Semantics"], "slot": 4}, {"id": "P124", "title": "為新生安排路線", "en": "The orientation team was {responsible} for guiding new students. Its map focused {mainly} on buildings used in the first week. Volunteers also {responded} to questions about transport. Their advice was based on {incomplete} personal experience, so they checked uncertain details. Students could then {rely} on the final guide for accurate directions.", "zh": "迎新團隊負責引導新生。地圖主要著重第一週使用的建築。志工也回應交通問題。建議基於不完整的個人經驗，因此會查證不確定細節。學生便能仰賴完成版指南獲得正確方向。", "bank": [{"word": "responsible", "zh": "負責的", "pos": "Adj"}, {"word": "incomplete", "zh": "不完整的", "pos": "Adj"}, {"word": "reply", "zh": "回覆", "pos": "V"}, {"word": "responsibility", "zh": "責任", "pos": "N"}, {"word": "mainly", "zh": "主要地", "pos": "Adv"}, {"word": "rely", "zh": "依靠", "pos": "V"}, {"word": "responded", "zh": "回應了", "pos": "V"}], "answers": ["responsible", "mainly", "responded", "incomplete", "rely"], "why": ["be responsible for V-ing 為負責做事；responsibility 是名詞。", "focus mainly on 表聚焦主要使用建築，mainly 修飾 focused。", "responded to questions 配合過去式敘事；原形 reply 在此不能接 also 作過去述語。", "based on 是基於；uncertain details 顯示個人經驗仍 incomplete，需查證補足。", "rely on the guide 表依賴；reply on 不是依靠的搭配。"], "evidence": ["The orientation team was {responsible} for guiding new students.", "Its map focused {mainly} on buildings used in the first week.", "Volunteers also {responded} to questions about transport.", "Their advice was based on {incomplete} personal experience, so they checked uncertain details.", "Students could then {rely} on the final guide for accurate directions."], "type": 19, "level": 3, "tags": ["Collocation", "Semantics"], "slot": 4}, {"id": "P125", "title": "實驗課的規則", "en": "The instructor {required} students to wear goggles. She {recommended} tying back long hair before using the equipment. The rules {made} the class feel more secure. A checklist {reminded} everyone that safety came before speed. Students then practiced slowly to {avoid} making careless errors.", "zh": "講師要求學生戴護目鏡，並建議使用設備前把長髮綁好。規則讓大家更安心。清單提醒所有人安全優先於速度。學生接著慢慢練習，避免粗心錯誤。", "bank": [{"word": "made", "zh": "使", "pos": "V"}, {"word": "required", "zh": "要求了", "pos": "V"}, {"word": "avoid", "zh": "避免", "pos": "V"}, {"word": "reminded", "zh": "提醒了", "pos": "V"}, {"word": "permission", "zh": "許可", "pos": "N"}, {"word": "recommended", "zh": "建議了", "pos": "V"}, {"word": "prevent", "zh": "防止", "pos": "V"}], "answers": ["required", "recommended", "made", "reminded", "avoid"], "why": ["required students to wear 是要求人做事；permission 是名詞，不能作此句的主要動詞。", "recommended tying 接動名詞，而非 recommended 人 to V。", "made the class feel 為使役動詞接原形 feel。", "reminded everyone that 是人加 that 子句，表提醒內容。", "avoid making 直接接動名詞；prevent 需適當受詞和 from 結構。"], "evidence": ["The instructor {required} students to wear goggles.", "She {recommended} tying back long hair before using the equipment.", "The rules {made} the class feel more secure.", "A checklist {reminded} everyone that safety came before speed.", "Students then practiced slowly to {avoid} making careless errors."], "type": 20, "level": 3, "tags": ["Grammar", "Semantics"], "slot": 4}, {"id": "P126", "title": "報名人數的變化", "en": "The festival attracted a {large} number of visitors, but ticket sales were lower than expected. Many people came only to the free outdoor events. The organizers needed to {distinguish} attendance from paid participation. They could {estimate} total crowds from photographs, but sales records gave an exact count of tickets. This distinction made their evaluation more {precise}. A popular event was not {necessarily} a profitable one.", "zh": "節慶吸引很多人，票房卻比預期低。許多人只參加免費戶外活動。主辦方需區分到場和付費參與。照片可估計總人數，售票紀錄則有精確票數。區分使評估更精準；活動熱門不一定獲利。", "bank": [{"word": "necessarily", "zh": "必然地", "pos": "Adv"}, {"word": "estimate", "zh": "估計", "pos": "V"}, {"word": "precise", "zh": "精確的", "pos": "Adj"}, {"word": "countless", "zh": "無數的", "pos": "Adj"}, {"word": "biggest", "zh": "最大的", "pos": "Adj"}, {"word": "large", "zh": "大的", "pos": "Adj"}, {"word": "distinguish", "zh": "區分", "pos": "V"}], "answers": ["large", "distinguish", "estimate", "precise", "necessarily"], "why": ["a large number 是大量；biggest 是 "Everyone was welcome {except} those without a reservation, because places were limited."], "type": 22, "level": 3, "tags": ["Semantics"], "slot": 4}, {"id": "P128", "title": "修復唱片的價值", "en": "The archive held a rare {record} of a local singer's first performance. Dust covered its surface, so a specialist cleaned it with great {care}. The work carried no {charge} because a donor covered the cost. Once restored, the music brought an almost forgotten voice back into {circulation}. The project gave new {life} to material that had spent decades in storage.", "zh": "檔案館保存一張在地歌手初次演出的珍貴唱片。表面覆塵，專家細心清潔。捐贈者負擔費用，因此工作不收費。修復後，音樂讓幾乎被遺忘的聲音重新流傳，也讓存放數十年的材料重獲生命。", "bank": [{"word": "circulation", "zh": "流通", "pos": "N"}, {"word": "accusation", "zh": "指控", "pos": "N"}, {"word": "battery", "zh": "電池", "pos": "N"}, {"word": "life", "zh": "生命／活力", "pos": "N"}, {"word": "care", "zh": "細心／照護", "pos": "N"}, {"word": "record", "zh": "唱片／紀錄", "pos": "N"}, {"word": "charge", "zh": "費用／電荷", "pos": "N"}], "answers": ["record", "care", "charge", "circulation", "life"], "why": ["表面覆塵且能播放歌手演出，record 在此是唱片，不是成績紀錄。", "with great care 表細心處理，不一定指醫療照護。", "donor covered cost 限定 no charge 是免費，非沒有電荷或 accusation。", "back into circulation 指重新流傳，不是血液循環。", "give new life to 為使材料重獲活力，不是真正生物復活。"], "evidence": ["The archive held a rare {record} of a local singer's first performance.", "Dust covered its surface, so a specialist cleaned it with great {care}.", "The work carried no {charge} because a donor covered the cost.", "Once restored, the music brought an almost forgotten voice back into {circulation}.", "The project gave new {life} to material that had spent decades in storage."], "type": 23, "level": 3, "tags": ["Semantics"], "slot": 4}, {"id": "P129", "title": "漏水修好以後", "en": "A hidden pipe had been wasting water for months. After repairs, daily consumption {dropped}. The monthly bill became {lower}, even though the number of residents stayed the same. This change {reduced} pressure on the building's budget. The manager viewed the result as {positive}. Still, she continued checking the meter so that another leak would not go {unnoticed}.", "zh": "暗管漏水數月。修好後日用水量下降，即使住戶數相同，月費也降低。改變減輕大樓預算壓力，管理者視為正面成果。她仍查水表，避免另一次漏水未被察覺。", "bank": [{"word": "negative", "zh": "負面的", "pos": "Adj"}, {"word": "reduced", "zh": "減輕了", "pos": "V"}, {"word": "dropped", "zh": "下降了", "pos": "V"}, {"word": "lower", "zh": "更低的", "pos": "Adj"}, {"word": "positive", "zh": "正面的", "pos": "Adj"}, {"word": "higher", "zh": "更高的", "pos": "Adj"}, {"word": "unnoticed", "zh": "未被察覺的", "pos": "Adj"}], "answers": ["dropped", "lower", "reduced", "positive", "unnoticed"], "why": ["修漏後消耗 dropped，前提住戶數未增加。", "省水使費用 lower，higher 方向相反。", "預算壓力是被 reduced；注意主詞 change 單數和過去述語。", "減少浪費和支出為 positive；negative 無不利線索。", "continue checking 為防漏水 unnoticed，不是說漏水已不存在。"], "evidence": ["After repairs, daily consumption {dropped}.", "The monthly bill became {lower}, even though the number of residents stayed the same.", "This change {reduced} pressure on the building's budget.", "The manager viewed the result as {positive}.", "Still, she continued checking the meter so that another leak would not go {unnoticed}."], "type": 24, "level": 3, "tags": ["Logic", "Semantics"], "slot": 4}, {"id": "P130", "title": "雨量與報名率", "en": "More people joined the indoor class during a rainy week. The organizer suspected that bad weather had increased {demand}. Yet a discounted fee had been introduced at the same time. Because these changes {coincided}, their effects were difficult to separate. She compared later weeks with different prices and weather {conditions}. This approach helped test competing {explanations}. It avoided treating the first observed link as a proven {cause}.", "zh": "雨週有更多人報名室內課。主辦者懷疑壞天氣增加需求，但同期也開始折扣。兩改變同時發生，效果難分。她比較後續價格、天氣條件不同的週次，檢驗競爭解釋，避免把初見關聯當已證明原因。", "bank": [{"word": "explanations", "zh": "解釋", "pos": "N"}, {"word": "coincided", "zh": "同時發生", "pos": "V"}, {"word": "conditions", "zh": "條件", "pos": "N"}, {"word": "cause", "zh": "原因", "pos": "N"}, {"word": "separated", "zh": "分開了", "pos": "V"}, {"word": "demand", "zh": "需求", "pos": "N"}, {"word": "certainty", "zh": "確定性", "pos": "N"}], "answers": ["demand", "coincided", "conditions", "explanations", "cause"], "why": ["more joined 對應 demand 增加。", "at the same time 表 coincided；separated 與同期發生相反。", "不同天氣為 weather conditions，與價格一起作比較條件。", "下雨與降價都是可能 explanations，不是已驗證唯一因素。", "avoid…proven cause 表避免過早因果定論，非宣稱有 certainty。"], "evidence": ["The organizer suspected that bad weather had increased {demand}.", "Because these changes {coincided}, their effects were difficult to separate.", "She compared later weeks with different prices and weather {conditions}.", "This approach helped test competing {explanations}.", "It avoided treating the first observed link as a proven {cause}."], "type": 25, "level": 4, "tags": ["Logic", "Semantics"], "slot": 4}, {"id": "P131", "title": "把中文想法換成英文", "en": "To prepare the charity sale, students had to {make} arrangements with local shops. They wanted to {give} people a hand without creating extra waste. One shop agreed to {offer} reusable bags at cost. Students would also {take} care of the tables after the event. Their teacher reminded them that helping the community meant putting ideas into {practice}, not merely discussing them.", "zh": "學生為準備義賣，需與店家協調安排，希望幫助人又不增加垃圾。一家店同意以成本價供應可重用袋。學生也會在活動後整理照管桌子。老師提醒幫助社區是把想法付諸實踐，不只是討論。", "bank": [{"word": "give", "zh": "給予", "pos": "V"}, {"word": "offer", "zh": "提供", "pos": "V"}, {"word": "do", "zh": "做", "pos": "V"}, {"word": "make", "zh": "做出／安排", "pos": "V"}, {"word": "take", "zh": "承擔／照管〔搭 care〕", "pos": "V"}, {"word": "practice", "zh": "實踐", "pos": "N"}, {"word": "discussion", "zh": "討論", "pos": "N"}], "answers": ["make", "give", "offer", "take", "practice"], "why": ["make arrangements 為做安排；do arrangements 不合普通搭配。", "give people a hand 表幫忙，不是字面送手。", "offer bags at cost 表按成本供應。", "take care of 表照管，需整組讀。", "put ideas into practice 為付諸實踐；後面 not merely discussing 排除 discussion。"], "evidence": ["To prepare the charity sale, students had to {make} arrangements with local shops.", "They wanted to {give} people a hand without creating extra waste.", "One shop agreed to {offer} reusable bags at cost.", "Students would also {take} care of the tables after the event.", "Their teacher reminded them that helping the community meant putting ideas into {practice}, not merely discussing them."], "type": 26, "level": 3, "tags": ["Collocation", "Semantics"], "slot": 4}, {"id": "P132", "title": "給投稿者的正式回信", "en": "The journal thanked the writer for her {submission}. It explained that the article would undergo editorial {review}. The message asked her to {provide} a short biography and to {retain} a copy of the original file. Its language was courteous and {professional}, matching a formal exchange between an editor and an author.", "zh": "期刊感謝作者投稿，說明文章將經編輯審閱。訊息請她提供簡歷並保留原檔副本。用語禮貌專業，符合編輯與作者的正式往來。", "bank": [{"word": "provide", "zh": "提供", "pos": "V"}, {"word": "submission", "zh": "投稿", "pos": "N"}, {"word": "slangy", "zh": "充滿俚語的", "pos": "Adj"}, {"word": "professional", "zh": "專業的", "pos": "Adj"}, {"word": "retain", "zh": "保留", "pos": "V"}, {"word": "review", "zh": "審閱", "pos": "N"}, {"word": "ditch", "zh": "丟棄〔口語〕", "pos": "V"}], "answers": ["submission", "review", "provide", "retain", "professional"], "why": ["期刊收到的稿件為 submission，符合正式用語。", "editorial review 為編輯審查流程。", "provide biography 是禮貌正式的提供要求。", "retain a copy 表保留副本；ditch 不但口語，且意思相反。", "formal exchange 對應 professional；slangy 與描述的語域衝突。"], "evidence": ["The journal thanked the writer for her {submission}.", "It explained that the article would undergo editorial {review}.", "The message asked her to {provide} a short biography and to {retain} a copy of the original file.", "The message asked her to {provide} a short biography and to {retain} a copy of the original file.", "Its language was courteous and {professional}, matching a formal exchange between an editor and an author."], "type": 27, "level": 3, "tags": ["Semantics"], "slot": 4}, {"id": "P133", "title": "一句話裡的保留", "en": "After reading a long proposal, the manager said, \"It is certainly {detailed}.\" She then asked whether the main idea could be expressed more briefly. Her first remark was not necessarily straightforward {praise}. In context, it hinted that the proposal might be too {lengthy}. The request for a shorter version made the implication {clearer}. A reader should therefore consider the whole exchange before deciding on the speaker's {attitude}.", "zh": "經理看完長提案說：「確實很詳細。」隨後問主旨能否更簡短表達。首句未必是單純稱讚，語境暗示提案可能過長。要求縮短使暗示更清楚。因此須讀完整互動才能判斷態度。", "bank": [{"word": "clearer", "zh": "更清楚的", "pos": "Adj"}, {"word": "concise", "zh": "簡潔的", "pos": "Adj"}, {"word": "detailed", "zh": "詳細的", "pos": "Adj"}, {"word": "confusion", "zh": "混亂", "pos": "N"}, {"word": "attitude", "zh": "態度", "pos": "N"}, {"word": "lengthy", "zh": "冗長的", "pos": "Adj"}, {"word": "praise", "zh": "稱讚", "pos": "N"}], "answers": ["detailed", "praise", "lengthy", "clearer", "attitude"], "why": ["long proposal 與後面希望更短，detailed 為表面稱述，不能直接當全盤讚揚。", "not necessarily praise 保留是否真在稱讚的判斷。", "更簡短的要求暗示 too lengthy；too concise 與修改方向相反。", "後句補充讓 implication clearer，非增加 confusion。", "完整對話協助判 speaker's attitude，不能只讀一個形容詞。"], "evidence": ["After reading a long proposal, the manager said, \"It is certainly {detailed}.\" She then asked whether the main idea could be expressed more briefly.", "Her first remark was not necessarily straightforward {praise}.", "In context, it hinted that the proposal might be too {lengthy}.", "The request for a shorter version made the implication {clearer}.", "A reader should therefore consider the whole exchange before deciding on the speaker's {attitude}."], "type": 28, "level": 4, "tags": ["Semantics"], "slot": 4}, {"id": "P134", "title": "可逆的展示設計", "en": "The museum needed labels that could be removed without damaging the walls. Designers chose a {removable} adhesive. Because future exhibitions would differ, the layout had to be {reconfigurable}. Workers could {reassemble} the panels in new arrangements. Clear instructions prevented {misunderstanding} during installation. The system made later changes less {costly}.", "zh": "博物館需要能移除又不傷牆的標籤，因此選可移除黏著劑。未來展覽不同，配置須能重新組合。工人可把面板重組成新排列。清楚說明避免安裝誤解，也降低之後修改成本。", "bank": [{"word": "reassemble", "zh": "重新組裝", "pos": "V"}, {"word": "irremovable", "zh": "無法移除的", "pos": "Adj"}, {"word": "misunderstanding", "zh": "誤解", "pos": "N"}, {"word": "reconfigurable", "zh": "可重新配置的", "pos": "Adj"}, {"word": "removable", "zh": "可移除的", "pos": "Adj"}, {"word": "disassemble", "zh": "拆解", "pos": "V"}, {"word": "costly", "zh": "昂貴的", "pos": "Adj"}], "answers": ["removable", "reconfigurable", "reassemble", "misunderstanding", "costly"], "why": ["remove 加 -able 表可移除，符合不傷牆需求；irremovable 否定可移除。", "re- 加 configurable 為可重新配置，因應不同展覽。", "in new arrangements 指重新組裝 reassemble；disassemble 只拆開，尚未形成新配置。", "mis- 表錯誤理解，clear instructions 防 misunderstanding。", "less costly 指減少費用，-ly 在 costly 中構成形容詞，不是方式副詞。"], "evidence": ["Designers chose a {removable} adhesive.", "Because future exhibitions would differ, the layout had to be {reconfigurable}.", "Workers could {reassemble} the panels in new arrangements.", "Clear instructions prevented {misunderstanding} during installation.", "The system made later changes less {costly}."], "type": 29, "level": 3, "tags": ["POS", "Semantics"], "slot": 4}, {"id": "P135", "title": "讓舊衣延長壽命", "en": "A tailor examined the coat before deciding how to {repair} it. The lining was torn, but the outer fabric remained {intact}. Replacing only the damaged layer would {preserve} the coat's useful parts. The customer agreed because she wanted to {extend} its life. The work turned a possible discard into a usable {garment}.", "zh": "裁縫檢查外套再決定如何修補。內裡破了，但外層布仍完整。只換壞層可保留可用部分。顧客同意，因她想延長衣服壽命。修補讓原本可能被丟的衣物重新可穿。", "bank": [{"word": "repair", "zh": "修補", "pos": "V"}, {"word": "intact", "zh": "完整無損的", "pos": "Adj"}, {"word": "destroy", "zh": "毀壞", "pos": "V"}, {"word": "extend", "zh": "延長", "pos": "V"}, {"word": "garment", "zh": "衣物", "pos": "N"}, {"word": "preserve", "zh": "保留", "pos": "V"}, {"word": "shorten", "zh": "縮短", "pos": "V"}], "answers": ["repair", "intact", "preserve", "extend", "garment"], "why": ["examined coat 後決定修補 repair，與更換壞層行為一致。", "but 對比內裡破與外層 intact。", "只換損壞部分是 preserve 可用部分；destroy 相反。", "顧客要增加使用年限，extend；shorten 方向相反。", "coat 是 garment，回扣物件語意類別。"], "evidence": ["A tailor examined the coat before deciding how to {repair} it.", "The lining was torn, but the outer fabric remained {intact}.", "Replacing only the damaged layer would {preserve} the coat's useful parts.", "The customer agreed because she wanted to {extend} its life.", "The work turned a possible discard into a usable {garment}."], "type": 30, "level": 3, "tags": ["Semantics"], "slot": 4}, {"id": "P136", "title": "從海岸帶回的資料", "en": "The samples {collected} during low tide were stored in sealed containers. The researcher {who} supervised the trip checked every label. Students noted the places {where} each sample had been found. {Because} the locations differed, the team kept the groups separate. This allowed comparisons without {mixing} material from different habitats.", "zh": "退潮時收集的樣本存於密封容器。督導行程的研究者檢查標籤。學生記下各樣本發現位置。因地點不同，團隊分組保存，讓比較時不會混入不同棲地材料。", "bank": [{"word": "who", "zh": "…的人〔關係代名詞〕", "pos": "Pron"}, {"word": "collected", "zh": "被收集的", "pos": "V-en"}, {"word": "mixing", "zh": "混合", "pos": "V-ing"}, {"word": "where", "zh": "…的地方〔關係副詞〕", "pos": "Adv"}, {"word": "Despite", "zh": "儘管", "pos": "Prep"}, {"word": "Because", "zh": "因為", "pos": "Conj"}, {"word": "collecting", "zh": "收集中的", "pos": "V-ing"}], "answers": ["collected", "who", "where", "Because", "mixing"], "why": ["samples 被收集，collected 修飾；collecting 會讓樣本成為主動收集者，主句動詞是 were stored。", "researcher 為人，who 在關係子句作主詞。", "places where… 表發現的地點，子句主受詞已完整。", "空格後完整子句，Because 給原因；Despite 不能直接接完整子句。", "without 後 mixing 動名詞，不另加限定動詞。"], "evidence": ["The samples {collected} during low tide were stored in sealed containers.", "The researcher {who} supervised the trip checked every label.", "Students noted the places {where} each sample had been found.", "{Because} the locations differed, the team kept the groups separate.", "This allowed comparisons without {mixing} material from different habitats."], "type": 31, "level": 4, "tags": ["Grammar", "Semantics"], "slot": 4}, {"id": "P137", "title": "兩次錯誤之間", "en": "A learner missed a grammar clue on Monday and a similar clue on Friday. The repetition deserved {attention}, but the teacher still asked how each answer had been chosen. One error came from a hurried guess; the other involved a misunderstood sentence. The explanations were not {identical}. The teacher recorded the evidence before making a {classification}. When the cause remained unclear, she kept the diagnosis {provisional}. Another unfamiliar passage would provide an opportunity for {verification}.", "zh": "學生週一漏看文法線索，週五又漏看相似線索。重複值得注意，但老師仍問每次如何作答。一錯來自急著猜，另一錯是誤解句子，理由不相同。老師先記錄證據再分類。原因未明時，診斷保持暫定；另一篇陌生文章提供驗證機會。", "bank": [{"word": "identical", "zh": "相同的", "pos": "Adj"}, {"word": "classification", "zh": "分類", "pos": "N"}, {"word": "attention", "zh": "注意", "pos": "N"}, {"word": "permanent", "zh": "永久的", "pos": "Adj"}, {"word": "provisional", "zh": "暫定的", "pos": "Adj"}, {"word": "verification", "zh": "驗證", "pos": "N"}, {"word": "certainty", "zh": "確定性", "pos": "N"}], "answers": ["attention", "identical", "classification", "provisional", "verification"], "why": ["deserved attention 表重複值得觀察，不等於證實固定弱點。", "猜題與誤解不同，not identical；不能把表面同錯當同因。", "before classification 表先蒐集理由再分類。", "cause unclear 應 provisional；permanent 過度確定。", "另一陌生篇提供 verification 的機會，不保證一定獲得 certainty。"], "evidence": ["The repetition deserved {attention}, but the teacher still asked how each answer had been chosen.", "The explanations were not {identical}.", "The teacher recorded the evidence before making a {classification}.", "When the cause remained unclear, she kept the diagnosis {provisional}.", "Another unfamiliar passage would provide an opportunity for {verification}."], "type": 32, "level": 4, "tags": ["Global", "Semantics"], "slot": 4}], "walkthroughs": [{"step": 0, "pid": "P114", "blank": 4, "prompt": "先不選字，用一句話說出文章想保留什麼。", "trace": "把「攤販記得姓名、鄰居交換消息、新居民學習習俗」合看，可歸納市場的人際與文化連結。招牌只是開場細節，因此整篇主題不是裝飾，theme 承接較廣重點。", "trap": "不要因第一句出現 colorful signs（彩色招牌）就把全文當成建築美學。"}, {"step": 0, "pid": "P100", "blank": 8, "prompt": "河道改造只是在美化景觀嗎？", "trace": "前文同時談防洪、生態與居民疑慮，後文又談監測調整。中心是兼顧多用途並持續修正，ongoing process（持續過程）才能串起首尾。", "trap": "只看 planted shelves（植栽平台）會漏掉原有防洪任務與後續測試。"}, {"step": 0, "pid": "P135", "blank": 3, "prompt": "把外套故事濃縮成不超過20字的中文。", "trace": "可寫「只換損壞內裡，延長外套壽命」。由這個主題回看第4格，extend（延長）和更換內裡的動作一致，shorten（縮短）則反向。", "trap": "不要把所有含衣服的文章都概括為購物；本篇主軸是修補。"}, {"step": 1, "pid": "P120", "blank": 0, "prompt": "掃描字庫時，先圈出兩組只差少數字母的詞。", "trace": "stationery／stationary（文具／靜止的）及 complement／compliment（補充／稱讚）先成對標記。再看第1格 pens and other…（筆和其他…），知道需要物品類的 stationery。", "trap": "字庫掃描的目的不是先猜空格；相似字要延後到語境比對。"}, {"step": 1, "pid": "P121", "blank": 0, "prompt": "把七個候選字分成兩個字族。", "trace": "competitor／competition／competitive／compete 屬競爭字族；contribution／contributor／contribute 屬貢獻字族。第1格 Each…brought（每位…帶來）需要能帶模型的人，先鎖 competitor。", "trap": "不能只記每組共同中文；人物、活動與性質有不同句法工作。"}, {"step": 1, "pid": "P128", "blank": 2, "prompt": "字庫裡有哪些熟字可能不是最熟悉的意思？", "trace": "record 可為唱片，charge 可為費用，circulation 可為流通，life 可表活力。掃描時先保留多義，再用 donor covered the cost（捐贈者負擔費用）將 charge 限定為收費義。", "trap": "看到 charge（費用／電荷）就想充電，會和免費修復的語境衝突。"}, {"step": 2, "pid": "P105", "blank": 1, "prompt": "為 valuable、carefully、success、successful 標詞性。", "trace": "valuable 和 successful 是形容詞，carefully 是副詞，success 是名詞。第2格位於 become 與 material 之間，valuable 修飾名詞 material（材料）。", "trap": "不要把所有 -ful 或所有字尾相近詞當成同一詞性；需要實際確認功能。"}, {"step": 2, "pid": "P122", "blank": 2, "prompt": "store 在字庫中能有哪些詞性？這格採哪一種？", "trace": "store 可作動詞「存放」或名詞「商店」。Rather than…everything（而不是…所有東西）需要動作並接受詞，所以第3格為動詞 store。", "trap": "不要把一個字永遠固定成名詞；詞性標記可以有多個候選。"}, {"step": 2, "pid": "P134", "blank": 4, "prompt": "costly 結尾是 -ly，是否一定是副詞？", "trace": "不是。less costly（成本較低）用 costly 作形容詞。less 修飾昂貴程度，這裡描述 later changes（之後的改動）的成本特質。", "trap": "只靠 -ly 一律判副詞會誤排 costly；構詞只是線索，不是無例外的定律。"}, {"step": 3, "pid": "P105", "blank": 0, "prompt": "遮住字庫：showed little ______ in the project 需要什麼？", "trace": "little 在此限制不可數名詞；in the project（對此計畫）補充對象，因此預測名詞，再回字庫找 interest（興趣）。", "trap": "別直接從中文「有興趣」想形容詞 interested；showed 後需要受詞名詞。"}, {"step": 3, "pid": "P106", "blank": 2, "prompt": "真正控制單複數的是 corridor 還是 windows？", "trace": "句子主詞核心是 The corridor（走廊）。despite its open windows（儘管窗戶開著）是插入修飾語，所以第3格需單數過去式 was。", "trap": "離空格最近的複數 windows（窗戶）不等於主詞。"}, {"step": 3, "pid": "P136", "blank": 4, "prompt": "without ______ material 中，空格可放限定動詞嗎？", "trace": "without 是介系詞，後接名詞或動名詞片語；本格有 material 作動作受詞，因此用 mixing（混合）的動名詞形式。", "trap": "看到完整動作意思就填原形 mix，會忽略介系詞後形式。"}, {"step": 4, "pid": "P106", "blank": 0, "prompt": "暫時刪掉 equipped with handheld sensors，句子剩下什麼？", "trace": "剩 The students ______ temperatures（學生…溫度），主句缺過去式主要動詞 measured。equipped…（配備…）本身只是修飾學生，不承擔主句述語。", "trap": "measuring 只有分詞形式，不能獨立完成本句過去式述語。"}, {"step": 4, "pid": "P136", "blank": 0, "prompt": "找到第一句真正的主要動詞。", "trace": "主句是 The samples were stored（樣本被儲存）；collected during low tide（退潮時收集的）只修飾 samples。樣本是被收集者，故用過去分詞 collected。", "trap": "不能把每個帶動作意義的字都當主句動詞，也不能讓樣本主動 collecting。"}, {"step": 4, "pid": "P106", "blank": 3, "prompt": "Trees planted near the west wall ______ shade 的主幹是什麼？", "trace": "先括起 planted near the west wall（種在西牆旁的），得到 Trees provided shade（樹提供遮蔭）。planted 是修飾語，provided 完成主要述語。", "trap": "誤把 planted 當主要動詞，會以為句子已完整而亂填後面的格子。"}, {"step": 5, "pid": "P123", "blank": 0, "prompt": "空格要和哪兩個詞一起讀？", "trace": "讀整組 drew up a schedule（擬定時程），draw up 是計畫制定詞塊。後文分工、測試與期限確認此處不是字面畫畫。", "trap": "painted 雖也有畫的意思，不能替換 draw up 的擬定義。"}, {"step": 5, "pid": "P124", "blank": 0, "prompt": "找出 responsible 周圍的固定結構。", "trace": "The team was responsible for guiding…（團隊負責引導…）組成 be responsible for V-ing。responsibility 是名詞，不能直接代替 responsible 而不改結構。", "trap": "只看到中文「責任」就填 responsibility，會漏看 was 與 for 的結合方式。"}, {"step": 5, "pid": "P125", "blank": 4, "prompt": "avoid 和 prevent 都是避免，為何不能直接互換？", "trace": "avoid making errors（避免犯錯）直接接動名詞。prevent 通常需 prevent someone from making errors（防止某人犯錯）；原句沒有這些成分，不能硬塞。", "trap": "記中文近義而沒記補語結構，是搭配與句型共同造成的誤選風險。"}, {"step": 6, "pid": "P107", "blank": 0, "prompt": "哪段最小證據能限定燈臂的特性？", "trace": "so she could direct light away from her roommate（使她能把光轉離室友）要求方向可調，因此 adjustable。decorative 只表示裝飾性，不能滿足轉動光線的需求。", "trap": "不要因產品題就選任何正向形容詞；答案須满足具體用途。"}, {"step": 6, "pid": "P127", "blank": 4, "prompt": "這格描述接受請求，還是排除一群人？", "trace": "Everyone was welcome except those without a reservation（除未預約者外都歡迎）。名額有限解釋排除條件，因此用介系詞 except，不是動詞 accept。", "trap": "accept／except 拼字與聲音近，但詞性和動作關係不同。"}, {"step": 6, "pid": "P135", "blank": 1, "prompt": "哪個局部對比能推定 intact 的意思？", "trace": "The lining was torn, but the outer fabric remained intact（內裡破了，但外層仍完整）。but 對比兩層狀態，支持 intact 是未損壞。", "trap": "「舊」不等於「每一部分都壞了」；要照句中限定部位判讀。"}, {"step": 7, "pid": "P109", "blank": 1, "prompt": "先用中文說出前後兩段的關係。", "trace": "散步讓人清醒，是正面結果；大雨使戶外走路不可行，是執行限制。這裡轉到相反面向，用 However（然而），不是同向補充的 Similarly（同樣地）。", "trap": "不能看到前面成功，就假設後文每句都繼續支持同一方向。"}, {"step": 7, "pid": "P108", "blank": 0, "prompt": "latter 指藍箱還是黃箱？", "trace": "先出現藍箱，後出現黃箱；first 已指藍箱，latter 必須指後者黃箱。它在學校旁，吸引兒童又提供語意核對。", "trap": "不能只記 latter 是後者而不追文章實際介紹順序；形式與地點都要吻合。"}, {"step": 7, "pid": "P111", "blank": 3, "prompt": "把裝追蹤器、遷徙、返回、取回裝置排成時間線。", "trace": "三月裝設→三週後北遷→秋季返回→取回裝置。Only after the birds returned did…（只有鳥返回後才…）把取回事件限制在返回之後。", "trap": "敘述中先提資料比較，並不代表可在鳥返回前收回實體裝置。"}, {"step": 8, "pid": "P119", "blank": 1, "prompt": "前文魚變多，能否推出完全復育？", "trace": "不能。後文仍有雨後污染，因此 completely restored（完全復育）是文章指出的過度結論。讀到 would go beyond the evidence（會超出證據）才能理解本格在否定什麼。", "trap": "正向局部成果不等於全文已無問題；要注意被作者否定的主張也可能出現在空格。"}, {"step": 8, "pid": "P117", "blank": 1, "prompt": "綜合評論者的三種動作，判定整體態度。", "trace": "她欣賞主題、稱讚照片、要求補足地方聲音，因此是 mixed（褒貶並存）。只用缺少地方聲音就判 hostile（敵意的），會漏讀明確讚揚。", "trap": "評價強度要由整段聲音共同支持，不能抓一個負面詞就定論。"}, {"step": 8, "pid": "P118", "blank": 1, "prompt": "有狐狸影像，能否把所有足跡都歸給牠？", "trace": "影像只確立狐狸在場；鏡頭未涵蓋整岸，其他動物仍可能出現。因此 not prove all（不能證明全部）限制推論範圍。", "trap": "把存在證據升級為唯一原因，會從局部線索跳到過強全文結論。"}, {"step": 9, "pid": "P120", "blank": 3, "prompt": "剩下 complement 和 compliment 時，如何分配而不靠拼字猜？", "trace": "第4格 labels ______ artwork（標籤…作品）需要「相輔相成」的 complement；第5格 offered a ______ on preparation（對準備表示…）需要「稱讚」的 compliment。兩格交叉核查後才完成分配。", "trap": "不能先隨便放一個，另一個只因剩下就算對；每格都必須有獨立證據。"}, {"step": 9, "pid": "P127", "blank": 1, "prompt": "把 affect 與 effect 回填兩格，檢查詞性和整句意思。", "trace": "第2格 could affect the schedule（可能影響時程）需原形動詞；第3格 the effect of delays（延誤的影響）需名詞。分配後一詞一次，句型與意思同時成立。", "trap": "只背 affect 是動詞仍不足；正式核查要把第3格也讀通。"}, {"step": 9, "pid": "P105", "blank": 4, "prompt": "若最後剩 successful 與 success，是否可只按「成功」中文選？", "trace": "第5格 a ______ part（成功的一部分）以形容詞 successful 修飾 part。success 是干擾名詞，允許留在字庫未使用。再次檢查前四格各自的詞性與意思，才結束。", "trap": "本篇字庫有多餘干擾詞，剩字不必全部使用；「最後剩下」不是答案證據。"}]};

const STEPS=[['Topic Scan','主題速讀','先看首尾句，以一句中文寫出主題，不急著填字。'],['Word Bank Scan','掃描候選字','掃描整份字庫，標出熟字、多義字與容易混淆的字。'],['POS Tag','標記詞性','把候選字分成名詞、動詞、形容詞、副詞；兼類字保留多種可能。'],['Blank POS Prediction','預測空格詞性','遮住字庫，用空格左右的位置預測所需詞性。'],['Grammar Skeleton','文法骨架','暫括修飾語，找主詞、主要動詞、受詞與補語。'],['Collocation Filter','搭配篩選','把空格與前後詞組成詞塊，核對固定搭配及介系詞。'],['Local Meaning','局部語意','找出使答案精確成立的限制詞，而非只看大概字義。'],['Logic + Cohesion','邏輯與連貫','確認轉折、因果、指涉、時間與新舊資訊。'],['Global Fit','全文契合','將各格帶回全文，檢查主題、作者立場與前後一致。'],['Remaining-Word Audit','剩字核查','每詞限用一次；比較剩餘字與已填字，不能因為只剩一個就跳過驗證。']];
const TIPS=[['POS Elimination','詞性第一輪淘汰','空格位置明確後，排除純粹不合詞性的選項。','冠詞後不一定立刻是名詞，還可能先接形容詞。','先看位置→保留兼類字→核對語法',17],['Position Before Meaning','位置先於字義','先預測形式，再讀候選字義。','不要只用中文近義判斷詞形。','空格→詞性→字族→意思',0],['Skeleton First','先找骨架','長句先保留主詞與主要動詞。','分詞或關係子句不一定是主句述語。','括修飾→找主幹→回填',1],['Direction Before Vocabulary','先定方向','先標改善／惡化、轉折／因果。','同主題的字可能指向相反結果。','標正負→圈轉折→比較候選',24],['Smallest Sufficient Evidence','最小充分證據','找能排除最強競爭詞的最小片段。','若兩詞仍都成立，擴讀前後句。','圈限制→試對手→不足就擴讀',2],['Context Override','語境修正直覺','熟字的第一個字義不一定是此處的字義。','不能為了熟悉字義而扭曲篇章。','辨事件→推詞義→回看字庫',23],['Chunk','詞塊作答','用完整搭配選字與記憶。','中文一個詞在英文可能對應不同詞塊。','讀前後→組詞塊→核對介系詞',18],['Scale Trap','程度與範圍陷阱','區分部分、全部、可能、一定。','not every 不等於 none。','圈量詞→定否定範圍→查全文',8],['Evidence > Memory','證據優於記憶','答案取決於文章，不由常識印象決定。','合理想像不等於已提供的證據。','摘線索→最小推論→刪過度結論',13],['Local + Global Fit','局部與全文契合','單句通順後，還要與整篇一致。','剩字排除不能取代全文驗證。','局部回填→查立場→全文重讀',14],['Contrast Pair','近義對照','比較用法限制、受詞與語氣。','相同中文不代表英文可互換。','共通義→差異→適用場合',21],['Referent Check','指涉檢查','把代名詞換成實際指涉對象。','最近的名詞未必是先行詞。','找候選→檢查數→替換連讀',3],['Timeline First','事件排序','先列事件時間，再選詞。','敘述順序不一定是發生順序。','畫時間線→核對 before／after（之前／之後）',6],['Voice Check','辨識說話者','區分作者、受訪者與引文。','引號裡的讚美不能直接當作者態度。','找發話者→圈保留語→判強度',12],['Boundary Check','子句邊界','找主句完整性與修飾範圍。','不要只看最靠近空格的名詞。','框子句→畫箭頭→回主句',31],['Signal Is Not Diagnosis','訊號不是定論','一次答錯先留待確認。','重複錯誤仍需作答理由與教師複核。','保存證據→定向修復→換文→複核',32]];

function save(){try{if(recoveryRaw&&!localStorage.getItem(KEY+'_recovery'))localStorage.setItem(KEY+'_recovery',recoveryRaw);localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;$('storageWarning').hidden=true;return true}catch(e){storageFail('瀏覽器無法保存本機資料。');return false}}
function validProfile(p){return p&&typeof p.className==='string'&&p.className.trim()&&p.className.length<=60&&typeof p.student==='string'&&p.student.trim()&&p.student.length<=60}
function validateRecords(records,existing=[]){if(!Array.isArray(records)||records.length>50000)throw Error('紀錄必須是陣列，最多50,000筆。');let ids=new Set();for(const a of records){const p=getP(a.passageId);if(!a||typeof a.id!=='string'||!a.id||ids.has(a.id))throw Error('紀錄ID缺漏或重複。');ids.add(a.id);if(!p||!validProfile(a)||!MODES[a.mode]||typeof a.demo!=='boolean'||!/^\d{4}-\d{2}-\d{2}T/.test(a.date)||!Number.isFinite(Date.parse(a.date)))throw Error('紀錄的篇章、學生、日期或模式無效。');if(!Array.isArray(a.answers)||a.answers.length!==p.answers.length||a.answers.some(x=>typeof x!=='string'||!p.bank.some(w=>w.word===x))||new Set(a.answers).size!==a.answers.length)throw Error('答案數量、候選字或一詞限用一次規則不符。');if(!Array.isArray(a.diagnoses)||a.diagnoses.length!==p.answers.length||a.diagnoses.some(d=>!d||!Number.isInteger(d.type)||d.type<0||d.type>32||typeof d.note!=='string'||(d.type!==32&&!d.note.trim())))throw Error('錯因複核資料不完整。');if(typeof a.notes!=='string'||a.notes.length>20000||typeof a.sourceId!=='string')throw Error('備註或來源格式錯誤。')}
const all=[...existing,...records];for(const a of records.filter(x=>x.mode==='retest')){const s=all.find(x=>x.id===a.sourceId);if(!s||s.demo!==a.demo||s.mode==='repair'||identity(s)!==identity(a)||s.passageId===a.passageId||getP(s.passageId).type!==getP(a.passageId).type||!wrongIndices(s).length||Date.parse(s.date)>Date.parse(a.date))throw Error('正式再測必須連結同學生、同能力、不同篇章的較早正式錯題。');if(all.some(x=>x.id!==a.id&&identity(x)===identity(a)&&x.demo===a.demo&&x.passageId===a.passageId&&Date.parse(x.date)<=Date.parse(a.date)))throw Error('再測篇章已有先前作答，不能列為正式換文再測。')};return records}
try{const raw=localStorage.getItem(KEY);if(raw){const v=JSON.parse(raw);if(v.schema!==1||!validProfile(v.profile))throw Error('版本不符');validateRecords(v.attempts);state={...state,...v};if(!Array.isArray(state.exposures))state.exposures=[];if(!state.drafts||typeof state.drafts!=='object')state.drafts={}}}catch(e){try{recoveryRaw=localStorage.getItem(KEY)||''}catch(_){}storageFail('既有保存資料無法讀取，已保留原始資料。')}
function wrongIndices(a){const p=getP(a.passageId);return a.answers.flatMap((x,i)=>x!==p.answers[i]?[i]:[])}
function score(a){return a.answers.length-wrongIndices(a).length}
function stats(arr){const ret=arr.filter(a=>a.mode==='retest'),wrong=arr.reduce((n,a)=>n+wrongIndices(a).length,0);return {attempts:arr.length,blanks:arr.reduce((n,a)=>n+a.answers.length,0),wrong,retests:ret.length,retestBlanks:ret.reduce((n,a)=>n+a.answers.length,0),retestCorrect:ret.reduce((n,a)=>n+score(a),0)}}
function pct(n,d){return d?Math.round(n/d*100)+'%':'—'}
function renderNav(){const nav=[['home','學習首頁'],['types','33類錯誤導航'],['bank','篇章題庫'],['tips','MAX 秘笈 BANK'],['engine','10步作答引擎'],['retest','換文再測']];$('nav').innerHTML=nav.map(([id,t])=>`<button data-nav="${id}" class="${page===id?'active':''}">${t}</button>`).join('');$('profileLabel').innerHTML=`${esc(state.profile.className)} · ${esc(state.profile.student)}<br><button onclick="editProfile()" style="padding:3px 9px;font-size:13px">切換學生</button>`}
function go(p){page=p;current=null;result=null;render();window.scrollTo(0,0)}
function render(){renderNav();const f={home:home,types:typeList,bank:bank,tips:tips,engine:engine,retest:retest,practice:practice,type:typeDetail};$('main').innerHTML=f[page]();bind();}
function editProfile(){$('classInput').value=state.profile.className;$('studentInput').value=state.profile.student;$('profileDialog').showModal()}
$('profileForm').onsubmit=e=>{e.preventDefault();const p={className:$('classInput').value.trim(),student:$('studentInput').value.trim()};if(!validProfile(p))return notify('請填寫班級與學生名稱。');state.profile=p;save();$('profileDialog').close();current=null;result=null;page='home';render();notify('已切換學生')};
function cards(p){return `<article class="card"><div class="row between"><span class="pill">${p.id} · L${p.level}</span><span class="mini muted">${p.answers.length} 空格</span></div><h3>${esc(p.title)}</h3><p class="mini muted">${TYPES[p.type].name} · ${p.tags.map(t=>TAGS[t]).join('／')}</p><p class="mini">${p.slot===4?'新增五空格加強篇章':p.slot===3?'十空格整合篇章':p.slot===2?'換文候選篇章 · 直接練習後不再作新篇再測':p.slot===1?'修復候選篇章 · 也可正式作答':'基礎診斷篇章'}</p><button data-open="${p.id}" class="primary">開始篇章</button> <button data-repair="${p.id}">定向練習</button></article>`}
function home(){const own=state.attempts.filter(a=>!a.demo&&a.mode!=='repair'&&identity(a)===identity(state.profile)),s=stats(own);return `<div class="hero"><div class="kicker">學測英文 · 文意選填</div><h1>從「選對字」走向「找對證據」</h1><p>先讀文章，再比對共用字庫。交卷後找出錯誤訊號，做定向修復，再以不同篇章檢驗。</p><div class="row"><button class="primary" data-open="P001">開始第一篇診斷</button><button data-nav="bank">挑選題庫</button></div></div><div class="grid statsgrid section"><div class="card stat"><strong>${PS.length}</strong><span>獨立篇章 · ${PS.filter(p=>p.answers.length===3).length}篇三空格＋${PS.filter(p=>p.answers.length===5).length}篇五空格＋${PS.filter(p=>p.answers.length===10).length}篇十空格</span></div><div class="card stat"><strong>${PS.reduce((n,p)=>n+p.answers.length,0)}</strong><span>實際空格 · 不以練習次數充當題數</span></div><div class="card stat"><strong>${TYPES.length}</strong><span>診斷類別 · 原創教學題，非官方歷屆試題</span></div></div><div class="grid two section"><div class="card"><h2>本學生的正式學習紀錄</h2><p>已交卷 <b>${s.attempts}</b> 篇 · 空格正確率 <b>${pct(s.blanks-s.wrong,s.blanks)}</b></p><p>正式換文再測 <b>${s.retests}</b> 次 · 正確率 <b>${pct(s.retestCorrect,s.retestBlanks)}</b></p><button data-nav="retest">從錯題安排再測</button></div><div class="card"><h2>先看證據，不急著貼標籤</h2><p>單次錯誤預設為「尚待確認」。同能力重複失誤只顯示待複核訊號；正式類別須人工檢視作答理由後確認。</p></div></div><div class="section row between"><h2>從今天的一篇開始</h2><span class="mini muted">L1 單線索 → L5 全文整合</span></div><div class="grid">${[PS[0],PS[36],PS[99]].map(cards).join('')}</div>${footer()}`}
function footer(){return '<div class="foot">離線增建版 v1.1 · 所有資料在此瀏覽器保存，請使用同一檔案與瀏覽器接續學習。三空格為專項微篇章，五空格為加強練習，十空格為整合練習；難度為教學分級，非官方難度校準。</div>'}
let selectedType=0;
function typeList(){return `<div class="kicker">ERROR DIAGNOSIS · 錯誤診斷</div><h1>33類，從錯法找到修復路徑</h1><p class="muted">每類包含解釋、證據、任務、秘笈，以及至少四篇不同情境的練習，以及三組完整例題解析。</p><input id="typeSearch" type="search" placeholder="搜尋錯誤類型" aria-label="搜尋錯誤類型"><div class="typegrid section" id="typeGrid">${TYPES.map(t=>`<button class="typebutton" data-type="${t.id}" data-search="${esc(t.name+t.plain+t.tag)}"><span class="num">${String(t.id+1).padStart(2,'0')}</span><span>${t.name}<small class="muted" style="display:block">${t.tag}｜${TAGS[t.tag]}</small></span><b>›</b></button>`).join('')}</div>`}
function showType(id){selectedType=+id;page='type';render();window.scrollTo(0,0)}
function typeDetail(){const t=TYPES[selectedType],related=PS.filter(p=>p.type===t.id),examples=[related.find(p=>p.slot===0),related.find(p=>p.slot===1),related.find(p=>p.slot===4)].filter(Boolean);return `<button data-nav="types">← 返回33類</button><div class="section kicker">${String(t.id+1).padStart(2,'0')} / 33 · ${t.tag}｜${TAGS[t.tag]}</div><h1>${t.name}</h1><div class="grid two section"><div class="card"><h2>白話解析</h2><p>${t.plain}</p><h3>文意選填典型錯法</h3><p>${t.mistake}</p></div><div class="card"><h2>作答任務</h2><p>${t.task}</p><h3>考試秘笈</h3><p>${t.tip}</p><h3>Correct Action｜修正行動</h3><p>${t.action}</p></div></div><h2 class="section">例題詳解 · ${examples.length}篇／${examples.reduce((n,p)=>n+p.answers.length,0)}空格</h2><p class="muted">先在心裡作答，再展開比對證據與正解。示範引用實際題庫，不另計新題數；展開後會記為已讀。</p>${examples.map((p,i)=>workedExample(p,`例題 ${i+1}｜${p.title}`)).join('')}<h2 class="section">本類題庫 · ${related.length}篇／${related.reduce((n,p)=>n+p.answers.length,0)}空格</h2><div class="grid">${related.map(cards).join('')}</div><p class="mini muted">要保留全新換文再測，請先做基礎診斷；未展開的篇章仍可作新篇候選。</p>`}
function filterControls(){return `<div class="filters"><label>搜尋<input id="bankSearch" type="search" value="${esc(filters.q)}" placeholder="主題、單字、繁中內容"></label><label>錯誤類型<select id="bankType"><option value="">全部33類</option>${TYPES.map(t=>`<option value="${t.id}" ${String(t.id)===filters.type?'selected':''}>${t.name}</option>`).join('')}</select></label><label>難度<select id="bankLevel"><option value="">L1–L5 全部</option>${[1,2,3,4,5].map(n=>`<option ${filters.level==n?'selected':''}>${n}</option>`).join('')}</select></label><label>能力<select id="bankTag"><option value="">全部能力</option>${Object.keys(TAGS).map(t=>`<option value="${t}" ${filters.tag===t?'selected':''}>${t}｜${TAGS[t]}</option>`).join('')}</select></label><label>篇章規模<select id="bankSize"><option value="">全部篇章</option><option value="3" ${filters.size==='3'?'selected':''}>3空格專項</option><option value="5" ${filters.size==='5'?'selected':''}>5空格加強</option><option value="10" ${filters.size==='10'?'selected':''}>10空格整合</option></select></label><button id="clearFilters">清除篩選</button></div>`}
function filteredBank(){const q=filters.q.toLowerCase();return PS.filter(p=>(!q||(p.title+p.en+p.zh+TYPES[p.type].name).toLowerCase().includes(q))&&(filters.type===''||p.type===+filters.type)&&(!filters.level||p.level===+filters.level)&&(!filters.tag||p.tags.includes(filters.tag))&&(!filters.size||p.answers.length===+filters.size))}
function bank(){return `<div class="kicker">PASSAGE BANK · 篇章題庫</div><h1>真正連讀，整篇回填</h1><p class="muted">同一篇共用字庫，每詞限用一次。三空格練基礎、五空格加強跨句判讀、十空格檢查全文整合。</p>${filterControls()}<p id="bankCount" class="mini"></p><div class="grid" id="bankResults"></div>`}
function renderBankResults(){const ps=filteredBank();$('bankCount').textContent=`符合 ${ps.length} 篇／${ps.reduce((n,p)=>n+p.answers.length,0)} 空格；全庫 ${PS.length} 篇／${PS.reduce((n,p)=>n+p.answers.length,0)} 空格。`;$('bankResults').innerHTML=ps.length?ps.map(cards).join(''):'<div class="empty wide">沒有符合的篇章，請放寬篩選。</div>'}
function exposed(id){return state.exposures.some(e=>e.passageId===id&&e.who===identity(state.profile))||state.attempts.some(a=>!a.demo&&identity(a)===identity(state.profile)&&a.passageId===id)}
function draftKey(id,mode){return identity(state.profile)+'\u0001'+id+'\u0001'+mode}
function openPractice(id,mode='diagnostic',sourceId=''){const p=getP(id);if(!p)return;if(mode==='retest'){const a=state.attempts.find(a=>a.id===sourceId),pending=state.drafts[draftKey(id,mode)];if(!a||a.demo||a.mode==='repair'||!wrongIndices(a).length||identity(a)!==identity(state.profile)||getP(a.passageId).type!==p.type||a.passageId===id||(exposed(id)&&pending?.sourceId!==sourceId))return notify('此篇已看過或來源不符，無法列為正式換文再測。');}current={id,mode,sourceId,key:draftKey(id,mode)};if(!state.drafts[current.key])state.drafts[current.key]={answers:Array(p.answers.length).fill(''),notes:'',steps:Array(10).fill(''),checked:[],sourceId,started:new Date().toISOString()};if(!exposed(id))state.exposures.push({who:identity(state.profile),passageId:id,date:new Date().toISOString()});save();result=null;engineStep=0;page='practice';render();window.scrollTo(0,0)}
function practice(){const p=getP(current.id),d=state.drafts[current.key];if(result)return resultView(result);let i=0;const en=esc(p.en).replace(/\{[^}]+\}/g,()=>{const j=i++;return `<label class="blank">${j+1}<select data-answer="${j}" aria-label="第${j+1}格"><option value="">選擇候選字</option>${p.bank.map(w=>`<option value="${esc(w.word)}" ${d.answers[j]===w.word?'selected':''}>${esc(w.word)}</option>`).join('')}</select></label>`});return `<div class="row between"><span class="kicker">${MODES[current.mode]}</span><button data-nav="bank">返回題庫</button></div><h1>${p.title}</h1><div class="row"><span class="pill">${p.id} · L${p.level} · ${p.answers.length}空格</span><span class="pill">${TYPES[p.type].name}</span>${current.mode==='repair'?'<span class="pill gold">不計入正式再測</span>':''}</div><p class="mini muted">${esc(state.profile.className)}／${esc(state.profile.student)} · 每個候選字限用一次${p.bank.length>p.answers.length?'，有多餘干擾詞':''}。英文全文與候選字均附繁中輔助。詞性：N 名詞、V 動詞、Adj 形容詞、Adv 副詞、Pron 代名詞、Det 限定詞、Prep 介系詞、Conj 連接詞；V-ing 現在分詞／動名詞，V-en 過去分詞。</p><div class="card section"><div class="row between"><h2>Word Bank｜共用字庫</h2><button id="toggleHints">顯示／隱藏字義與詞性</button></div><div class="bank" id="wordBank">${p.bank.map(w=>`<div class="word ${d.answers.includes(w.word)?'used':''}" data-word="${esc(w.word)}"><strong>${esc(w.word)}</strong><div class="wordHint hidden mini">${esc(w.zh)} · ${esc(w.pos)}</div></div>`).join('')}</div><div class="passage section">${en}</div><details><summary>繁體中文全文翻譯（輔助閱讀）</summary><p>${p.zh}</p></details><div class="progress"><i id="answerProgress" style="width:${d.answers.filter(Boolean).length/p.answers.length*100}%"></i></div><p id="answerCount" class="mini muted">已填 ${d.answers.filter(Boolean).length}／${p.answers.length} 格</p></div><details class="card section" ${current.mode==='repair'?'open':''}><summary>10步作答引擎｜逐步留下證據</summary><div class="steps section">${STEPS.map((s,i)=>`<button class="step ${engineStep===i?'active':''}" data-step="${i}">${String(i+1).padStart(2,'0')}<strong>${s[1]}</strong><span>${s[0]}</span></button>`).join('')}</div><div id="stepContent" class="section">${stepContent()}</div></details><div class="card section"><label for="reasonNotes"><b>我的作答理由／不確定處</b></label><textarea id="reasonNotes" maxlength="20000" placeholder="例如：第2格因為 however（然而）應與前句反向；仍不確定兩個近義詞的差異。">${esc(d.notes)}</textarea><div class="row section"><button class="primary" id="submitAnswers">交卷並查看答案解析</button><span class="mini muted">交卷後才顯示正解。修改已交答案請開始新的作答。</span></div></div>`}
function stepContent(){const d=state.drafts[current.key],s=STEPS[engineStep],examples=DATA.walkthroughs.filter(w=>w.step===engineStep&&w.pid!==current.id);return `<h3>${engineStep+1}. ${s[0]}｜${s[1]}</h3><p>${s[2]}</p><textarea id="stepNote" aria-label="本步證據" placeholder="記下本步找到的線索…">${esc(d.steps[engineStep]||'')}</textarea><label class="row"><input id="stepCheck" type="checkbox" ${d.checked.includes(engineStep)?'checked':''}>本步已檢查</label><h3 class="section">用別篇學這一步</h3><p class="mini muted">下列為其他篇章的已解示範；目前作答的正解仍在交卷後顯示。</p>${examples.map(walkthroughCard).join('')}` }
function submitAnswers(){if(result)return;const p=getP(current.id),d=state.drafts[current.key];if(d.answers.some(x=>!x))return notify('請完成所有空格再交卷。');if(new Set(d.answers).size!==d.answers.length)return notify('每個候選字只能使用一次，請檢查重複選字。');const a={id:uid(),date:new Date().toISOString(),...state.profile,passageId:p.id,mode:current.mode,sourceId:current.sourceId,demo:false,answers:[...d.answers],notes:d.notes,diagnoses:p.answers.map(()=>({type:32,note:''})),steps:d.steps.slice()};state.attempts.push(a);delete state.drafts[current.key];save();result=a;render();window.scrollTo(0,0)}
function resultView(a){const p=getP(a.passageId),wrong=wrongIndices(a);return `<div class="kicker">${a.demo?'DEMO 範例 · ':''}${MODES[a.mode]} · 已交卷</div><h1>${p.title} · ${score(a)}／${p.answers.length}</h1><p class="muted">${esc(a.className)}／${esc(a.student)} · ${new Date(a.date).toLocaleString('zh-TW')}</p><div class="callout ${wrong.length?'warning':''}">${wrong.length?`發現 ${wrong.length} 個錯誤訊號。預設「尚待確認」，題目標籤「${TYPES[p.type].name}」僅代表訓練目標，不能直接當作個人錯因。`:'本篇全對。可檢查自己的證據是否充分，猜對不等於已熟練。'}</div><div class="row"><button data-nav="bank">回題庫</button>${wrong.length?`<button data-nextrepair="${p.type}">Targeted Practice｜定向修復</button>${a.mode!=='repair'&&!a.demo?`<button class="primary" data-startretest="${a.id}">安排正式換文再測</button>`:''}`:''}</div><details class="card section"><summary>完整篇章、Word Bank 字庫與繁中翻譯</summary><p class="passage">${esc(p.en).replace(/\{([^}]+)\}/g,'<b>$1</b>')}</p><p>${p.zh}</p><div class="bank">${p.bank.map(w=>`<span class="word">${esc(w.word)}｜${esc(w.zh)} · ${w.pos}</span>`).join('')}</div></details><div class="card section"><h3>已保存的作答理由</h3><p>${esc(a.notes||'未填寫；無法只憑選項可靠分類。')}</p></div>${p.answers.map((answer,i)=>answerView(a,i)).join('')}<div class="callout"><b>Correct Action｜修正行動</b><p>${TYPES[p.type].action}</p><b>考試秘笈</b><p>${TYPES[p.type].tip}</p></div>`}
function answerView(a,i){const p=getP(a.passageId),correct=a.answers[i]===p.answers[i],w=p.bank.find(w=>w.word===p.answers[i]),chosen=p.bank.find(w=>w.word===a.answers[i]);return `<article class="answer ${correct?'':'wrong'}"><div class="row between"><h3>第${i+1}格 · ${correct?'答對':'錯誤訊號'}</h3><span class="pill ${correct?'green':'red'}">${correct?'✓':TYPES[a.diagnoses[i].type].name}</span></div><p>學生答案：<b>${esc(a.answers[i])}</b>（${esc(chosen.zh)}）<br>正解：<b>${w.word}</b>（${w.zh}）· ${w.pos}</p><h3>Evidence｜英文證據</h3><blockquote>${esc(p.evidence[i]).replace(/\{([^}]+)\}/g,'<b>$1</b>')}</blockquote><p><b>中文解析：</b>${p.why[i]}</p><details><summary>查看繁中語境與 Distractor 干擾詞排除</summary><p>${p.zh}</p>${p.bank.filter(x=>x.word!==w.word).map(x=>`<p class="mini"><b>${x.word}（${x.zh}）</b>：${p.answers.includes(x.word)?`在本篇對應第 ${p.answers.indexOf(x.word)+1} 格；`:'干擾候選；'}本格須符合「${p.why[i]}」${x.pos!==w.pos?` 另須核對詞性：本格正解為 ${w.pos}，此字標示 ${x.pos}。`:''}</p>`).join('')}</details>${!correct?`<div class="diagnose"><p class="mini"><b>診斷狀態：</b>${TYPES[a.diagnoses[i].type].name} ${esc(a.diagnoses[i].note)}</p><p class="mini muted">${repeatSignal(a)}。教師複核時，請依學生理由與證據確認；類別不是自動判定。</p><label class="mini">複核類別 <select id="diagType${i}">${TYPES.map(t=>`<option value="${t.id}" ${a.diagnoses[i].type===t.id?'selected':''}>${t.name}</option>`).join('')}</select></label><input id="diagNote${i}" maxlength="1000" aria-label="第${i+1}格複核理由" placeholder="填入複核證據或訪談理由" value="${esc(a.diagnoses[i].note)}"><button data-confirmdiag="${i}" data-attempt="${a.id}">保存人工複核</button></div>`:''}</article>`}
function repeatSignal(a){const p=getP(a.passageId),n=new Set(state.attempts.filter(x=>x.demo===a.demo&&x.mode!=='repair'&&identity(x)===identity(a)&&getP(x.passageId).type===p.type&&wrongIndices(x).length).map(x=>x.passageId)).size;return n>=2?`同訓練目標已在 ${n} 篇出現錯誤，值得複核`:'目前不足以確認穩定錯因'}
function nextRepair(type){const p=PS.find(p=>p.type===+type&&p.slot===1);openPractice(p.id,'repair')}
function retestCandidate(a){const pending=PS.find(p=>state.drafts[draftKey(p.id,'retest')]?.sourceId===a.id);if(pending)return pending;return PS.find(p=>p.type===getP(a.passageId).type&&p.id!==a.passageId&&p.slot===2&&!exposed(p.id))||PS.find(p=>p.type===getP(a.passageId).type&&p.id!==a.passageId&&!exposed(p.id))}
function startRetest(id){const a=state.attempts.find(a=>a.id===id);if(!a||a.demo||a.mode==='repair'||!wrongIndices(a).length||identity(a)!==identity(state.profile))return notify('請以目前學生的正式錯題啟動再測。');const p=retestCandidate(a);if(!p)return notify('此能力已沒有未讀過的新篇章；可繼續練習，但不虛計正式換文再測。');openPractice(p.id,'retest',a.id)}
function retest(){const arr=state.attempts.filter(a=>!a.demo&&a.mode!=='repair'&&identity(a)===identity(state.profile)&&wrongIndices(a).length);return `<div class="kicker">RETEST · 換文再測</div><h1>換一篇，驗證同一能力</h1><p>正式再測必須連結本學生的正式錯題，使用不同且未讀過的篇章。定向修復、重做原題與 Demo 都不計入。</p><div class="callout">再測次數以「完整交卷篇章」計；再測正確率＝再測答對空格 ÷ 再測全部空格，不把普通練習混入分母。</div>${arr.length?`<div class="grid">${arr.slice().reverse().map(a=>{const p=getP(a.passageId),next=retestCandidate(a);return `<div class="card"><span class="pill">${TYPES[p.type].name}</span><h3>${p.title}</h3><p class="mini">原作答：${score(a)}／${a.answers.length} · ${new Date(a.date).toLocaleDateString('zh-TW')}</p><p class="mini">${next?'可用／未完成篇章：'+next.title:'此目標已無未讀篇章；保留真實次數。'}</p><button data-startretest="${a.id}" ${!next?'disabled':''} class="primary">開始換文再測</button></div>`}).join('')}</div>`:'<div class="card empty">尚無本學生的正式錯題。先完成一篇正式診斷，再依錯題啟動換文再測。<br><button data-nav="bank">前往題庫</button></div>'}`}
function tips(){return `<div class="kicker">MAX STRATEGY BANK · 秘笈庫</div><h1>可操作的秘笈，不只一句口號</h1><input id="tipSearch" type="search" placeholder="搜尋秘笈／能力" aria-label="搜尋秘笈"><div class="grid two section" id="tipCards">${TIPS.map((t,i)=>`<article class="card" data-tiptext="${esc(t.join(' '))}"><span class="num">${String(i+1).padStart(2,'0')}</span><h2>${t[0]}<br>${t[1]}</h2><p>${t[2]}</p><div class="callout warning"><b>避免誤用：</b>${t[3]}</div><p><b>作答動作：</b>${t[4]}</p><button data-type="${t[5]}">查看對應診斷與篇章</button></article>`).join('')}</div>`}
function engine(){return `<div class="kicker">10-STEP ENGINE · 作答引擎</div><h1>十步作答，30組實際例題示範</h1><p>每一步提供3組示範，包含全文、共用字庫、繁中翻譯、推理過程與逐格正解。例題取自題庫，不重複計為新增篇章。</p><div class="row section">${STEPS.map((s,i)=>`<button data-jumpstep="${i}">${i+1} ${s[1]}</button>`).join('')}</div>${STEPS.map((s,i)=>`<section class="card section" id="engineStep${i}"><span class="num">STEP ${String(i+1).padStart(2,'0')}</span><h2>${s[0]}｜${s[1]}</h2><p>${s[2]}</p>${DATA.walkthroughs.filter(w=>w.step===i).map(walkthroughCard).join('')}</section>`).join('')}` }
function bind(){if(page==='bank'){renderBankResults();for(const [id,k] of [['bankSearch','q'],['bankType','type'],['bankLevel','level'],['bankTag','tag'],['bankSize','size']])$(id).addEventListener(id==='bankSearch'?'input':'change',e=>{filters[k]=e.target.value;renderBankResults()});$('clearFilters').onclick=()=>{filters={q:'',type:'',level:'',tag:'',size:''};render()}}
if(page==='types')$('typeSearch').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('[data-search]').forEach(el=>el.hidden=!el.dataset.search.toLowerCase().includes(q))};
if(page==='tips')$('tipSearch').oninput=e=>{document.querySelectorAll('[data-tiptext]').forEach(el=>el.hidden=!el.dataset.tiptext.toLowerCase().includes(e.target.value.toLowerCase()))};
if(page==='practice'&&!result){document.querySelectorAll('[data-answer]').forEach(el=>el.onchange=()=>{const d=state.drafts[current.key];d.answers[+el.dataset.answer]=el.value;save();const count=d.answers.filter(Boolean).length;$('answerCount').textContent=`已填 ${count}／${d.answers.length} 格`;$('answerProgress').style.width=count/d.answers.length*100+'%';document.querySelectorAll('[data-word]').forEach(w=>w.classList.toggle('used',d.answers.includes(w.dataset.word)))});$('reasonNotes').oninput=e=>{state.drafts[current.key].notes=e.target.value;save()};$('toggleHints').onclick=()=>document.querySelectorAll('.wordHint').forEach(e=>e.classList.toggle('hidden'));$('submitAnswers').onclick=submitAnswers;bindStep()}
}
function bindStep(){if(!$('stepNote'))return;$('stepNote').oninput=e=>{state.drafts[current.key].steps[engineStep]=e.target.value;save()};$('stepCheck').onchange=e=>{const d=state.drafts[current.key];d.checked=d.checked.filter(n=>n!==engineStep);if(e.target.checked)d.checked.push(engineStep);save()}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav)go(b.dataset.nav);else if(b.dataset.open)openPractice(b.dataset.open);else if(b.dataset.repair)openPractice(b.dataset.repair,'repair');else if(b.dataset.type!==undefined)showType(b.dataset.type);else if(b.dataset.nextrepair!==undefined)nextRepair(b.dataset.nextrepair);else if(b.dataset.startretest)startRetest(b.dataset.startretest);else if(b.dataset.review){result=state.attempts.find(a=>a.id===b.dataset.review);current={id:result.passageId};page='practice';render();window.scrollTo(0,0)}else if(b.dataset.step!==undefined){engineStep=+b.dataset.step;document.querySelectorAll('[data-step]').forEach(el=>el.classList.toggle('active',+el.dataset.step===engineStep));$('stepContent').innerHTML=stepContent();bindStep()}else if(b.dataset.confirmdiag!==undefined){const i=+b.dataset.confirmdiag,a=state.attempts.find(a=>a.id===b.dataset.attempt),type=+$('diagType'+i).value,note=$('diagNote'+i).value.trim();if(type!==32&&!note)return notify('確認類別前請填寫複核理由；證據不足請保持尚待確認。');a.diagnoses[i]={type,note};save();render();notify('已保存人工複核')}});
function exampleBody(p){let n=0;return `<div class="row"><span class="pill">${p.id} · L${p.level} · ${p.answers.length}空格</span><span class="pill gold">已解示範 · 不計作答或再測次數</span></div><h3>Passage｜先讀篇章</h3><p class="passage">${esc(p.en).replace(/\{[^}]+\}/g,()=>`<b>〔${++n}〕______</b>`)}</p><h3>Word Bank｜共用字庫</h3><div class="bank">${p.bank.map(w=>`<span class="word"><b>${esc(w.word)}</b>｜${esc(w.zh)} <small>${esc(w.pos)}</small></span>`).join('')}</div><h3 class="section">繁體中文全文</h3><p>${p.zh}</p><h3>逐格答案與證據</h3>${p.answers.map((a,i)=>`<div class="answer"><b>第${i+1}格 ${a}｜${p.bank.find(w=>w.word===a).zh}</b><blockquote>${esc(p.evidence[i]).replace(/\{([^}]+)\}/g,'<b>$1</b>')}</blockquote><p>${p.why[i]}</p></div>`).join('')}<p class="mini"><b>未使用候選字：</b>${p.bank.filter(w=>!p.answers.includes(w.word)).map(w=>`${w.word}（${w.zh}）`).join('、')||'本篇字庫全部使用；仍須逐格驗證。'}</p><div class="callout"><b>典型錯法：</b>${TYPES[p.type].mistake}<br><b>修正行動：</b>${TYPES[p.type].action}</div><button data-repair="${p.id}">用這篇做定向練習</button>`}
function workedExample(p,label){return `<details class="card section" data-example="${p.id}"><summary>${label} · ${p.answers.length}空格完整解析</summary><div class="section">${exampleBody(p)}</div></details>`}
function walkthroughCard(w){const p=getP(w.pid);return `<details class="section worked" data-example="${p.id}" data-walkstep="${w.step}"><summary>${p.title} · 第${w.blank+1}格｜${esc(w.prompt)}</summary><div class="callout"><b>示範推理：</b><p>${esc(w.trace)}</p><b>容易掉入的陷阱：</b><p>${esc(w.trap)}</p><b>本格答案：</b>${p.answers[w.blank]}（${p.bank.find(x=>x.word===p.answers[w.blank]).zh}）</div>${exampleBody(p)}</details>`}
document.addEventListener('toggle',e=>{const id=e.target.dataset?.example;if(!id||!e.target.open||exposed(id))return;state.exposures.push({who:identity(state.profile),passageId:id,date:new Date().toISOString()});save()},true);
document.addEventListener('click',e=>{const b=e.target.closest('[data-jumpstep]');if(b)$('engineStep'+b.dataset.jumpstep)?.scrollIntoView({behavior:'smooth',block:'start'})});

render();
</script></body></html>
