shopping list to make sure I don’t forget anything.","answer":"through"},{"kind":"p","text":""}],"VI":[{"kind":"p","text":"VI.閱讀測驗：9%"},{"kind":"table","text":"The first commercial cell phone was developed by Motorola in the 1970s. It was big, weighed 2 kilograms, and it could only make calls. But as with all useful technologies, things changed quickly. \nBy the 1980s, cell phones had become smaller and lighter. At that time, cell phones could only be used in big cities. However, phone companies were quick to expand their networks, which allowed people to use their phones in more remote places. \nBy the ’90s phones had changed a lot. They became “feature phones” that could be used to take photos, send SMS text messages, and even play simple games. Companies like Nokia were the leaders in selling these newer, smaller, and much smarter phones. \nBy 2010, computer technology and the Internet had really changed the game. We still had phones with a lot of features, but now everything and everyone could be connected on the World Wide Web. A world of convenience became available in a small device. If one thing is for sure, phones are a huge part of our life, and they’re here to stay."},{"kind":"p","text":"（   ）\t1.\tWhat is this passage mainly about?","official":"（ C ）\t1.\tWhat is this passage mainly about?","answer":"C"},{"kind":"p","text":"(A) Why cell phones are so popular with people who love to take photos."},{"kind":"p","text":"(B) What you can do with cell phones when they are connected to the Internet."},{"kind":"p","text":"(C) How technology has changed cell phones by adding more features to them."},{"kind":"p","text":"(D) Where people can find fun games on their cell phones."},{"kind":"p","text":"（   ）\t2.\tAccording to the article, which of the following statements is true?","official":"（ B ）\t2.\tAccording to the article, which of the following statements is true?","answer":"B"},{"kind":"p","text":"(A) Cell phones started to become smaller back in the ’90s. "} 有許多功能的手機，但現在每件事和每個人都可以在全球資訊網上彼此連結。一個小型設備就可以提供便利的世界。如果有一件事是確定的，那就是手機是我們生活中的重要部分，而且它們將一直存在。","1.\t這篇文章主要是關於什麼？","(A)\t為什麼手機這麼受喜歡拍照的人的歡迎。","(B)\t當手機連接到網際網路時你能做什麼。","(C)\t科技是如何透過增加更多功能來改變手機的。","(D)\t人們在手機上可以在哪裡找到有趣的遊戲。","2.\t根據這篇文章，以下哪一項陳述是正確的？","(A)\t手機在90年代開始變得更小。","(B)\t人們在2012年能夠用他們的手機上網。","(C)\t人們在1980年代就能用他們的手機拍照。","(D)\tNokia是開發第一支商用手機的電話公司。","3.\t哪一個片語跟第二段的「擴展」的意思最接近？","(A)\t讓某物變大。","(B)\t讓某物變快。","(C)\t讓某物出名。","(D)\t讓某物變小。"]},"translations":{"II":["要戒掉一個舊習慣從來都不容易。","今年到目前為止，這支籃球隊已經輸了十多場比賽。","Brown 太太聽到兒子的情況逐漸好轉時，感到如釋重負。","Susan 很少在餐廳外食；她喜歡自己準備餐點。","我們擔心會下雨，所以取消了野餐。"]}},{"id":"L03","title":"Do Animals Sleep like You and Me","sections":{"I":[{"kind":"p","text":"I.文意字彙與詞類變化：36%"},{"kind":"p","text":"\t\t\t1.\tJanet wants to lose weight. T     e, she eats only salad for lunch.","official":"Therefore\t\t1.\tJanet wants to lose weight. T     e, she eats only salad for lunch.","answer":"Therefore"},{"kind":"p","text":"\t\t\t2.\tHave you ever w     red how bats find their way around in the dark?","official":"wondered\t\t2.\tHave you ever w     red how bats find their way around in the dark?","answer":"wondered"},{"kind":"p","text":"\t\t\t3.\tIn addition to cut flowers, the flower shop sells a v     y of live plants as well.","official":"variety\t\t3.\tIn addition to cut flowers, the flower shop sells a v     y of live plants as well.","answer":"variety"},{"kind":"p","text":"\t\t\t4.\tSwimmers can f     t in the Dead Sea because it contains a lot of salt.","official":"float\t\t4.\tSwimmers can f     t in the Dead Sea because it contains a lot of salt.","answer":"float"},{"kind":"p","text":"\t\t\t5.\tJohnson stayed up late last night. That’s why he couldn’t stay a     e in class today.","official":"awake\t\t5.\tJohnson stayed up late last night. That’s why he couldn’t stay a     e in class today.","answer":"awake"},{"kind":"p","text":"\t\t\t6.\tWe have to learn from his experience, so we can a     d making the same mistake.","official":"avoid\t\t6.\tWe have to learn from ly, Dr. Mason also explains how these creatures prepare to sleep for so long \n  4.  . All in all, the book is   5.   the finest of its kind available. Pick up your copy today!"},{"kind":"p","text":"（   ）\t1.\t(A) thirty minutes the day\t(B) thirty minutes a day","official":"（ B ）\t1.\t(A) thirty minutes the day\t(B) thirty minutes a day","answer":"B"},{"kind":"p","text":"\t\t\t\t(C) thirty-minutes the day\t(D) thirty-minutes a day"},{"kind":"p","text":"（   ）\t2.\t(A) amazing\t(B) amazed\t(C) amazingly\t(D) amazement","official":"（ A ）\t2.\t(A) amazing\t(B) amazed\t(C) amazingly\t(D) amazement","answer":"A"},{"kind":"p","text":""},{"kind":"p","text":"（   ）\t3.\t(A) Other\t(B) Others\t(C) The other\t(D) The others","official":"（ C ）\t3.\t(A) Other\t(B) Others\t(C) The other\t(D) The others","answer":"C"},{"kind":"p","text":"（   ）\t4.\t(A) at times\t(B) at all times\t(C) at once\t(D) at a time","official":"（ D ）\t4.\t(A) at times\t(B) at all times\t(C) at once\t(D) at a time","answer":"D"},{"kind":"p","text":"（   ）\t5.\t(A) one\t\t(B) one of\t(C) one with\t(D) one that","official":"（ B ）\t5.\t(A) one\t\t(B) one of\t(C) one with\t(D) one that","answer":"B"}],"IV":[{"kind":"p","text":"IV.句型練習：16%"},{"kind":"p","text":"（1-2題以S + V + wh- (+ S) + V....改寫句子）"},{"kind":"p","text":"1.\tWhen did Michael Jackson die?\nDo you know \t?","official":"1.\tWhen did Michael Jackson die?\nDo you know when Michael Jackson died\t?","answer":"when Michael Jackson died"},{"kind":"p","text":"2.\tWho created Facebook?\nCan you tell me \t?","official":"2.\tWho created Facebook?\nCan you tell me who created Facebook\t?","answer":"who created Facebook"},{"kind":"p","text":"（3-4題以被動語態改寫句子）"},{"kind":"p","text":"3.\tStella took the stray dog to the vet.\n\t","official":"3.\tStella took the stray dog to the vet.\nThe stray dog was taken to the vet by Stella.","answer":"The stray dog was taken to the vet by Stella."},{"kind":"p","text":"4.\tDavid solved the difficult math problem.\n\t","official":"  have normally lost up to half their body weight.\nFor animals, one way to survive the long cold winter is to sleep right through it. Without a doubt, hibernation allows animals to save their energy when food is scarce."},{"kind":"p","text":"（   ）\t1.\tWhat is this article mainly about?","official":"（ D ）\t1.\tWhat is this article mainly about?","answer":"D"},{"kind":"p","text":"(A) How animals sleep and find food during the cold winter."},{"kind":"p","text":"(B) How hibernation changes animals’ body temperature.  "},{"kind":"p","text":"(C) Why bats like to sleep in caves or in the attics of houses. "},{"kind":"p","text":"(D) How sleeping through the winter helps animals stay alive."},{"kind":"p","text":"（   ）\t2.\tAccording to the article, which of the following statements is true?","official":"（ A ）\t2.\tAccording to the article, which of the following statements is true?","answer":"A"},{"kind":"p","text":"(A) Animals hibernate to save energy. "},{"kind":"p","text":"(B) When animals hibernate, they don’t lose weight."},{"kind":"p","text":"(C) Bats like to eat a lot of insects before they hibernate. "},{"kind":"p","text":"(D) When animals hibernate, their heartbeat usually becomes faster. "},{"kind":"p","text":"（   ）\t3.\tWhich is closest in meaning to the word “scarce” in the last paragraph?","official":"（ A ）\t3.\tWhich is closest in meaning to the word “scarce” in the last paragraph?","answer":"A"},{"kind":"p","text":"(A) Not enough."},{"kind":"p","text":"(B) Hidden."},{"kind":"p","text":"(C) Available."},{"kind":"p","text":"(D) Scary."},{"kind":"p","text":""}]},"solutions":{"I":["1. Therefore\t\t2. wondered","3. variety\t\t\t4. float","5. awake\t\t\t6. avoid","7. average\t\t\t8. surface","9. breath\t\t\t10. impression","11. amazement\t\t12. distant"],"II":["1. C\t   2. D\t 3. A\t    4. B\t   5. B"],"III":["1. B\t   2. A\t 3. C\t    4. D\t   5. B"],"IV":["1.\twhen Michael Jackson died","2.\twho created Facebook","3.\tThe stray dog was taken to the vet by Stella.","4.\tThe difficult math problem was solved by David."],"V":["1.\tare; on; lookout; for","2.\tAccording; to\t\t3. hold; on; to"],"VI":["1. D\t   2. A\t 3. A"],"III_TRANSLATION":["Jill Mason博士是動物睡眠行為的專家。在她的書《當牠們睡著時！》中，她討論了動物休息時所有奇怪但又奇妙的方式。前幾章講述了動物如何在睡眠時保持安全。首先提到的是長頸鹿，牠們一天只睡三十分鐘以避免掠食者攻擊。書中還討論了海獺獨特的睡姿。接著是關於高山雨燕和海豚驚人的睡眠秘密。","書的另一半主要關於熊和其他動物冬眠的方式和原因。它講述牠們如何能夠在幾個月沒有食物的情況下生存，以及牠們在哪裡睡覺。最後，Mason博士還解釋了這些生物是如何為一次睡這麼久做準備。總之，這本書是現有同類書籍中最好的其中之一。今天就去買一本吧！"],"VI_TRANSLATION":["當外面很冷的時候，你能睡上五、六個月嗎？這就是動物冬眠時所做的事情。","當動物冬眠時，牠會長時間睡眠。動物在周圍沒有足夠食物吃時會冬眠，所以牠們會休息直到再次有更多食物。這有助於牠們存活。","許多蝙蝠會冬眠。牠們在冬天冬眠，那時周圍沒有很多昆蟲可以吃。通常，牠們喜歡進入安靜、黑暗的地方，如洞穴或房屋的閣樓。","當蝙蝠冬眠時，牠們的體溫會下降，心跳可能從每分鐘200到300次降至大約只有十次。在冬眠期間，牠們幾乎什麼也不做，只是休息長達六個月！到冬眠週期結束時，蝙蝠通常已經失去了高達一半的體重。","對動物來說，度過漫長寒冬的一種生存方式就是一睡到底。毫無疑問，冬眠讓動物在食物稀缺時得以節省能量。","1.\t這篇文章主要是關於什麼？","(A)\t動物如何在寒冷的冬天睡覺和找到食物。","(B)\t冬眠如何改變動物的體溫。","(C)\t為什麼蝙蝠喜歡在洞穴或房屋的閣樓睡覺。","(D)\t睡一整個冬天如何幫助動物存活。","2.\t根據這篇文章，以下哪一項陳述是正確的？","(A)\t動物冬眠是為了節省能量。","(B)\t動物冬眠時，牠們的體重不會減輕。","(C)\t蝙蝠在冬眠前喜歡吃很多昆蟲。","(D)\t動物冬眠時，牠們的心跳通常會變快。","3.\t何者跟最後一段的「稀缺的」的意思最接近？","(A)\t不足的。","(B)\t隱藏的。","(C)\t可獲得的。","(D)\t可怕的。"]},"translations":{"II":["Johnny 因為上課遲到而被老師處罰。","我仍然不知道你在說什麼。","Lee 先生注意到女兒似乎很沮喪，便問她發生了什麼事。","鴕鳥蛋是所有蛋中最大的，一顆重量可達一千五百公克。","Johnson 工作了一整個上午後，總是得小睡一下。"]}},{"id":"L04","title":"Sniffing Out More Than Just Bones","sections":{"I":[{"kind":"p","text":"I.文意字彙與詞類變化：36%"},{"kind":"p","text":"\t\t\t1.\tThis is a big project. It will take more than one month to a     h it.","official":"accomplish\t\t1.\tThis is a big project. It will take more than one month to a     h it.","answer":"accomplish"},{"kind":"p","text":"\t\t\t2.\tPatrick did very well on the exam, so his father bought him a new computer as a r     d.","official":"reward\t\t2.\tPatrick did very well on the exam, so his father bought him a new computer as a r     d.","answer":"reward"},{"kind":"p","text":"\t\t\t3.\tThe doctors looked for the causes of the d     e, but it was difficult to pin down (明確說明).","official":"disease\t\t3.\tThe doctors looked for th 　 to be the same as that in the book.","answer":"turned / out"},{"kind":"p","text":"2.\t地球上許多動植物可能因為人類活動而面臨絕種。"},{"kind":"p","text":"Many of the animals and plants on Earth may face extinction 　　 　　 　 　　　 human activity.","official":"Many of the animals and plants on Earth may face extinction 　　due　　 　　to　　 human activity.","answer":"due / to"},{"kind":"p","text":"3.\t突然間，當Patrick正在開車時，有隻袋鼠跳到馬路上來。"},{"kind":"p","text":"All 　　　 　　 　　 　　　 　　　　　 , a kangaroo jumped out into the road as  Patrick was driving along.","official":"All 　　of　　 　　 a 　　 　 sudden 　, a kangaroo jumped out into the road as  Patrick was driving along.","answer":"of / a / sudden"},{"kind":"p","text":"4.\tTom在去圖書館的路上遇到他的班導師。"},{"kind":"p","text":"Tom 　　　 　　 　　　 　　 his homeroom teacher on his way to the library.","official":"Tom 　 came 　 　 across 　 his homeroom teacher on his way to the library.","answer":"came / across"},{"kind":"p","text":""}],"VI":[{"kind":"p","text":"VI.閱讀測驗：9%"},{"kind":"table","text":"Police use sniffer dogs every day to find drugs and other illegal items. However, not every dog can be a sniffer dog. Sniffer dog training starts with classes that teach dogs how to behave.\nDogs are trained to listen to their handler and also to point their noses at certain items when they smell them. If they cannot follow directions, they will not become sniffer dogs. Sniffer dogs are taught in steps to recognize smells. First, the dog will play with a toy with its handler. Over time, the smell the dog needs to find is put onto the toy so that the dog connects the smell with playtime. Then, when the dog finds a toy or object with this smell, it will let its handler know, and it understands it will now get to play. \nTo help the dog practice, the handler will hide the object with the smell the dog is looking for (especially the smell of drugs, meat, and fruit) in different places, and the dog has to hunt for it. When the dog can find objects with these smells, it is ready to help out in the real world."},{"kind":"p","text":"（   ）\t1.\tWhat is this passage mainly about?","official":"（ C ）\t1.\tWhat is this passage mainly about?","answer":"C"},{"kind":"p","text":"(A) The mission and tasks of sniffer dogs. "},{"kind":"p","text":"(B) The importance of playtime for sniffer dogs."},{"kind":"p","text":"(C) The training process of sniffer dogs."},{"kind":"p","text":"(D) The reason for training sniffer dogs."},{"kind":"p","text":"（   ）\t2.\tAccording to the article, which of the following statements is NOT true?","official":"（ B ）\t2.\tAccording to the article, which of the following statements is NOT true?","answer":"B"},{"kind":"p","text":"(A)\tBy playing with a toy, dogs will gradually learn to sense the smell it has been given."},{"kind":"p","text":"(B)\tDuring their training, dogs are first taught to recognize different smells."},{"kind":"p","text":"(C)\tDogs will have time to play after they find the object with the smell they were looking for and point it out to the handler."},{"kind":"p","text":"(D)\tWhen a dog is able to find the objects with certain smells hidden in different places, it is ready to work."},{"kind":"p","text":"（   ）\t3.\tWhat does the word “directions” in the second paragraph refer to?","official":"（ A ）\t3.\tWhat does the word “directions” in the second paragraph refer to?","answer":"A"},{"kind":"p","text":"(A) The things the dogs are asked to do."},{"kind":"p","text":"(B) The places the dogs want to go."},{"kind":"p","text":"(C) The smells the dogs have to find."},{"kind":"p","text":"(D) The illegal items including drugs."},{"kind":"p","text":""}]},"solutions":{"I":["1. accomplish\t\t2. reward","3. disease\t\t\t4. predict","5. behavior\t\t\t6. specific","7. detect\t\t\t8. sensitive","9. infection\t\t\t10. location","11. exposure\t\t12. management"],"II":["1. A\t   2. C\t 3. B\t    4. D\t   5. B"],"III":["1. B\t   2. C\t 3. A\t    4. B\t   5. C"],"IV":["1.\tThis is the website (which/that) I told you about.","2.\tThe thief who/that stole my wallet has not been caught by the police.","3.\tEd Sheeran, who is a pop singer from the U.K., just put out his latest album.","4.\tYosemite National Park, which is a popular tourist spot in California, attracts almost four million tourists each year."],"V":["1. turned; out\t\t2. due; to","3. of; a; sudden\t\t4. came; across"],"VI":["1. C\t   2. B\t 3. A"],"III_TRANSLATION":["狗擁有非常強大的鼻子。牠們有著驚人的能力去嗅出食物和動物的氣味。牠們甚至能夠感知植物或人類的疾病。因此，狗經常被訓練去執行對我們非常有用的任務。其中之一是幫助識別有某種根腐病的樹木。另外一項是在機場行李中嗅出毒品，這是特別訓練過的狗也能做到的。","在某些情況下，狗的嗅覺甚至能救人一命。例如，搜救犬常常能夠找到地震倖存者。眾所皆知，狗還能夠偵測主人血糖何時過低。這種感知人體化學變化的能力顯示了狗鼻子的強大之處。因此，難怪牠們能以這麼多不同的方式幫助我們。狗真的是我們最好的朋友。"],"VI_TRANSLATION":["警察每天都使用嗅探犬來尋找毒品和其他非法物品。然而，並不是每隻狗都能成為嗅探犬。嗅探犬的訓練從教導狗如何表現的課程開始。","狗經過訓練會傾聽訓練師的聲音，並且當牠們聞到某些物品時會用鼻子指向那些物品。如果牠們無法遵循指示，牠們就不會成為嗅探犬。嗅探犬一步一步學習識別氣味。首先，狗會與訓練師一起玩玩具。隨著時間過去，需要狗找到的氣味會被放在玩具上，讓狗將這個氣味與遊戲時間聯繫起來。然後，當狗找到帶有此氣味的玩具或物體時，牠會讓訓練師知道，並且明白現在牠可以開始玩耍了。","為了幫助狗練習，訓練師會將帶有狗正在尋找的氣味的物體（特別是毒品、肉類和水果的氣味）藏在不同的地方，狗必須去尋找它們。當狗能夠找到帶有這些氣味的物體時，牠就準備好在現實世界中提供幫助了。","1.\t這段文章主要是關於什麼？","(A)\t嗅探犬的任務和工作。","(B)\t遊戲時間對嗅探犬的重要性。","(C)\t嗅探犬的訓練過程。","(D)\t訓練嗅探犬的原因。","2.\t根據這篇文章，以下哪一項陳述是不正確的？","(A)\t藉由玩玩具，狗將逐漸學會感知它被賦予的氣味。","(B)\t在牠們的訓練期間，狗首先被教導辨認不同的氣味。","(C)\t狗在找到帶有牠們正在尋找的氣味的物體並指出給訓練師看後，將有時間玩耍。","(D)\t當一隻狗能夠找到隱藏在不同地方的帶有某些氣味的物體時，牠就準備好工作了。","3.\t第二段的「指示」是指什麼？","(A)\t狗被要求做的事情。","(B)\t狗想去的地方。","(C)\t狗必須找到的氣味。","(D)\t包括毒品在內的非法物品。"]},"translations":{"II":["Linda 喜歡的那家麵包店就在便利商店旁邊。","Jackson 是我非常信任的人，也是我的一位好朋友。","飛機再過幾分鐘就要起飛了。","請在這裡等到店員叫你的名字。","2015 年巴西有五十萬人感染茲卡病毒。"]}},{"id":"L05","title":"The Life of a Plastic Bag","sections":{"I":[{"kind":"p","text":"I.文意字彙與詞類變化：36%"},{"kind":"p","text":"\t\t\t1.\tThis bus is c     ded with people. Let’s wait for the next one.","official":"crowded\t\t1.\tThis bus is c     ded with people. Let’s wait for the next one.","answer":"crowded"},{"kind":"p","text":"\t\t\t2.\tEach of us can help save our natural e     t by using less paper.","official":"environment\t\t2.\tEach of us can help save our natural e     t by using less paper.","answer":"environment"} e getting busier, so they tend to prefer eating out to cooking 　　on　　 their \n　　own　　.","answer":"on / own"},{"kind":"p","text":"3.\t健行總是讓我上氣不接下氣，所以我得停下來一會兒才能繼續。"},{"kind":"p","text":"Hiking always makes me feel out of breath, so I have to pause 　　　　　 　　　　　 \n　　　　　 before I continue.","official":"Hiking always makes me feel out of breath, so I have to pause 　　for　　 　　a　　 \n　 while 　 before I continue.","answer":"for / a / while"},{"kind":"p","text":"4.\tJessie花了一小時打包她的東西。"},{"kind":"p","text":"It took Jessie an hour to 　　　　　 her things 　　　　　.","official":"It took Jessie an hour to 　 pack 　 her things 　　up　　.","answer":"pack / up"},{"kind":"p","text":""}],"VI":[{"kind":"p","text":"VI.閱讀測驗：9%"},{"kind":"table","text":"Dear Josie,\nHow are you? Are you enjoying your summer school classes?\nI am having a wonderful time at my grandparents’ house! We are in a very quiet place. There are no towns nearby, so there is not too much light pollution at night. But there are so many stars in the sky! There are no factories here, so there is no air pollution, and the air smells so sweet from the flowers and grass.\nOn weekends, we go to the beach. There are never many people on the beach, but there is always trash; it is so sad. I think a lot of the trash is coming from other places because it is always worse after storms, when the garbage comes in from far away. We always clean up the beach before swimming to make it look beautiful again.\nI wish you could come and visit.\nSee you soon,\nEllie"},{"kind":"p","text":"（   ）\t1.\tWhat is Ellie’s letter mainly about?","official":"（ A ）\t1.\tWhat is Ellie’s letter mainly about?","answer":"A"},{"kind":"p","text":"(A)\tShe likes the environment, but there is always trash on the beach. "},{"kind":"p","text":"(B)\tShe loves to swim at the beach when she is at her grandparents’ house. "},{"kind":"p","text":"(C)\tIt is not easy to find a quiet place without air or light pollution these days.   "},{"kind":"p","text":"(D)\tShe wants Josie to come over some time so they can clean up the beach together."},{"kind":"p","text":"（   ）\t2.\tAccording to Ellie’s letter, which of the following statements is NOT true?","official":"（ C ）\t2.\tAccording to Ellie’s letter, which of the following statements is NOT true?","answer":"C"},{"kind":"p","text":"(A)\tHer grandparents’ house is very quiet and far away from major cities.  "},{"kind":"p","text":"(B)\tThere is little light pollution there, so she can see many stars in the sky at night. "},{"kind":"p","text":"(C)\tShe has to clean up the beach because many people there throw garbage on the beach. "},{"kind":"p","text":"(D)\tThere is no air pollution at her grandparents’ house because there are no factories nearby."},{"kind":"p","text":"（   ）\t3.\tWhat kind of person is Ellie?","official":"（ B ）\t3.\tWhat kind of person is Ellie?","answer":"B"},{"kind":"p","text":"(A) One who tries to avoid problems."},{"kind":"p","text":"(B) One who is fond of nature."},{"kind":"p","text":"(C) One who only cares about herself."},{"kind":"p","text":"(D) One who doesn’t like star-gazing."}]},"solutions":{"I":["1. crowded\t\t\t2. environment","3. envies\t\t\t4. harm","5. poisonous\t\t6. surrounded","7. plastic\t\t\t8. convenience","9. produce\t\t\t10. proper","11. recycling\t\t12. obvious"],"II":["1. A\t   2. C\t 3. B\t    4. A\t   5. D"],"III":["1. C\t   2. C\t 3. B\t    4. D\t   5. A"],"IV":["1.\tTerry’s mother didn’t let him play computer games.","2.\tThe teacher has his students do 20 jumping jacks every morning.","3.\tThe scientist has won many people’s respect because he has invented so many new things.","4.\tBecause of the poor weather conditions, the flight was delayed."],"V":["1. ended; up\t\t2. on; own","3. for; a; while\t\t4. pack; up"],"VI":["1. A\t   2. C\t 3. B"],"III_TRANSLATION":["我是個一次性的塑膠袋。有一天，一些孩子買了我，把我裝滿了零食。他們騎著自行車，帶著我去了海灘。他們進行野餐，玩得非常開心。不幸的是，他們不夠小心，因為當他們離開時完全忘記了我！突然間，風把我捲起來，吹進了大海。","我在海上漂浮了幾天，直到被一條巨大的魚吃掉。我不是獨自一個；我看到旁邊有一支一次性的叉子。在接下來的幾天裡，那條魚吞下了愈來愈多的塑膠碎片。我們都被困在那裡，直到那 famous structures on earth. It receives an average of four million visitors every year. Those lucky enough to see Lady Liberty in person seldom forget their first look   2.   her. That’s because she’s not just a beautiful monument but a very large one. Together with the base at her feet, she stands over 300 feet tall.\nIn addition, the statue   3.   contains many symbols. There’s a special meaning behind almost   4.   it. The torch in her right hand, for example, stands for the light of liberty that guides people to freedom. The date on the tablet in her left hand reminds us of the end of British rule in America. At her feet are broken chains that symbolize the fact that   5.   came to an end. It’s no wonder she’s known as Lady Liberty!"},{"kind":"p","text":"（   ）\t1.\t(A) one \t\t\t(B) one of\t\n(C) the only one\t\t\t(D) the only one of","official":"（ B ）\t1.\t(A) one \t\t\t(B) one of\t\n(C) the only one\t\t\t(D) the only one of","answer":"B"},{"kind":"p","text":"（   ）\t2.\t(A) to   \t(B) in\t(C) at\t(D) for","official":"（ C ）\t2.\t(A) to   \t(B) in\t(C) at\t(D) for","answer":"C"},{"kind":"p","text":"（   ）\t3.\t(A) itself\t(B) it\t(C) its \t(D) it’s","official":"（ A ）\t3.\t(A) itself\t(B) it\t(C) its \t(D) it’s","answer":"A"},{"kind":"p","text":"（   ）\t4.\t(A) each section \t\t\t(B) each sections\t\n(C) each section of\t\t\t(D) each sections of","official":"（ C ）\t4.\t(A) each section \t\t\t(B) each sections\t\n(C) each section of\t\t\t(D) each sections of","answer":"C"},{"kind":"p","text":"（   ）\t5.\t(A) slavery\t(B) freedom\t(C) celebration\t(D) addition","official":"（ A ）\t5.\t(A) slavery\t(B) freedom\t(C) celebration\t(D) addition","answer":"A"}],"IV":[{"kind":"p","text":"IV.句型練習：16%"},{"kind":"p","text":"（第1題以...so...that...合併句子）"},{"kind":"p","text":"1.\t　The actress is very attractive.\n　People keep looking at her.\n\t","official":"1.\t　The actress is very attractive.\n　People keep looking at her.\nThe actress is so attractive that people keep looking at her ":"p","text":"4.\t這個男子一如往常地要求了靠窗的桌子。"},{"kind":"p","text":"The man, 　　　　　 　　　　　, asked for a table by the window.","official":"The man, 　　as　　 　always　, asked for a table by the window.","answer":"as / always"},{"kind":"p","text":""}],"VI":[{"kind":"p","text":"VI.閱讀測驗：9%"},{"kind":"table","text":"The Statue of Liberty is one of the world’s finest works of art, and that’s a fact. Today it stands on Liberty Island, an island in the port of New York City. But that is not where it was first built. \nThe Statue of Liberty was actually a gift from France. You might wonder how the Statue of Liberty got to the US. The statue didn’t come in an airplane and it wasn’t brought in one piece on a boat. In fact, it was broken down into smaller pieces, 350 to be exact, and was shipped to the US in 1885.\nWhen the statue reached the island, it wasn’t simply placed on the ground. The fact is that the pieces of the statue fit together onto a base that was built by the Americans. Once the statue was put together, it was over 100 meters tall and weighed more than 200,000 kilograms.\nNow that you know all of these things about the Statue of Liberty, would you like to travel to Liberty Island and meet her in person?"},{"kind":"p","text":"（   ）\t1.\tWhat is this passage mainly about?","official":"（ D ）\t1.\tWhat is this passage mainly about?","answer":"D"},{"kind":"p","text":"(A) Where the Statue of Liberty was placed."},{"kind":"p","text":"(B) Why France gave the Statue of Liberty to the US as a present."},{"kind":"p","text":"(C) Why people think the Statue of Liberty is an amazing work of art."},{"kind":"p","text":"(D) How the Statue of Liberty was delivered to the US and put together."},{"kind":"p","text":"（   ）\t2.\tAccording to the article, which of the following statements is true?","official":"（ A ）\t2.\tAccording to the article, which of the following statements is true?","answer":"A"},{"kind":"p","text":"(A) The Statue of Liberty was brought to the US in 1885.  "},{"kind":"p","tex 神像是一件了不起的藝術品。","(D)\t自由女神像是如何被運送到美國並組裝起來的。","2.\t根據這篇文章，以下哪一項陳述是正確的？","(A)\t自由女神像在1885年被運送到美國。","(B)\t自由女神像是用飛機運送到美國的。","(C)\t法國人也為自由女神像製作了基座。","(D)\t自由女神像組裝完成後高350公尺。","3.\t這篇文章最有可能在哪裡找到？","(A)\t在一本時尚雜誌。","(B)\t在一本科學教科書。","(C)\t在報紙的體育版。","(D)\t在一本關於歷史的有趣事實的書。"]},"translations":{"II":["Wang 先生是如此有智慧的人，因此朋友遇到問題時總會向他請教。","就是從那時起，我開始對英文產生濃厚興趣。","Holly 看見地板上有泥巴時很生氣，因為她才剛清理過。","雖然 John 的薪水不高，他賺的錢仍足以養家。","人們穿著綠色服裝慶祝聖派翠克節。"]}},{"id":"L07","title":"From Trash to Triumph","sections":{"I":[{"kind":"p","text":"I.文意字彙與詞類變化：36%"},{"kind":"p","text":"\t\t\t1.\tI know it won’t be easy, but we’ll solve the problem s     w.","official":"somehow\t\t1.\tI know it won’t be easy, but we’ll solve the problem s     w.","answer":"somehow"},{"kind":"p","text":"\t\t\t2.\tSarah improved her English and explored different cultures during her study tour o     s.","official":"overseas\t\t2.\tSarah improved her English and explored different cultures during her study tour o     s.","answer":"overseas"},{"kind":"p","text":"\t\t\t3.\tI can’t believe that I beat Robert at badminton. It was my first t      h over him.","official":"triumph\t\t3.\tI can’t believe that I beat Robert at badminton. It was my first t      h over him.","answer":"triumph"},{"kind":"p","text":"\t\t\t4.\tAlong with the other 2,000 fans, Tom had a great time at the singer’s \nc     t last night.","official":"concert\t\t4.\tAlong with the other 2,000 fans, Tom had a great time at the singer’s \nc     t last night.","answer":"concert"},{"kind":"p","text":"\t\t\t5.\tSandra beamed with joy as she r     ed a bunch of roses from her boyfriend yesterday. ","official":"received\t\t5.\tSandra beamed with joy as she r     ed a bunch of roses from her boyfriend yesterday.","answer":"received"},{"kind":"p","text":"\t\t\t6.\tJason spent most of his time studying and b     y had any free time to hang out with his friends.","official":"barely\t\t6.\tJason spent most of his time studying and b     y had any free time to hang out with his frien  recycling bin*. It’s like giving these items a second chance at being useful instead of ending up in the trash and harming our planet. Another way to help the environment is to ask your parents or teachers about special recycling centers to which you can take things like old toys, batteries, and electronic devices*. Otherwise, these items can end up in the soil or water and pollute our environment.\nBy recycling, you’re not only saving energy but also protecting nature and all the cute animals that call it home. It’s time to band together and become recycling champions to make our world a greener place for all!\n註：commit 投入　scrap paper廢紙　recycling bin 回收箱　electronic device 電子產品"},{"kind":"p","text":"（   ）1.\tWhat is this passage mainly about?","official":"（ C ）1.\tWhat is this passage mainly about?","answer":"C"},{"kind":"p","text":"(A) How we can recycle plastic products."},{"kind":"p","text":"(B) Why we need more heroes in the world."},{"kind":"p","text":"(C) What we can do to make the world a greener place."},{"kind":"p","text":"(D) When we should work together to help the environment."},{"kind":"p","text":"（   ）2.\tAccording to the passage, which of the following statements is NOT true?","official":"（ C ）2.\tAccording to the passage, which of the following statements is NOT true?","answer":"C"},{"kind":"p","text":"(A) Recycling can help save energy and protect nature. "},{"kind":"p","text":"(B) It is good to recycle whenever you finish using an item."},{"kind":"p","text":"(C) You had better put the things you don’t need into the trash can."},{"kind":"p","text":"(D) Old toys, batteries, and electronic devices may end up harming our planet."},{"kind":"p","text":"（   ）3.\tWhat does “this mission” in the first paragraph refer to?","official":"（ A ）3.\tWhat does “this mission” in the first paragraph refer to?","answer":"A"},{"kind":"p","text":"(A) Recycling."},{"kind":"p","text":"(B) Solving problems."},{"kind":"p","text":"(C) Not harming animals."},{"kind":"p","tex "According to studies, shy people are 　　　　　　 　　　　　　 have fewer friends.","official":"According to studies, shy people are 　 likely 　 　　to　　 have fewer friends.","answer":"likely / to"},{"kind":"p","text":"2.\t這個週末你應該利用好天氣享受一些戶外活動。"},{"kind":"p","text":"You should 　　　　 　 　　　 　　 　　　 　　 the good weather and enjoy some outdoor activities this weekend.","official":"You should 　 take 　  advantage  　　of　　 the good weather and enjoy some outdoor activities this weekend.","answer":"take / advantage / of"},{"kind":"p","text":"3.\t他租了一間辦公室，並成立自己的工作室。"},{"kind":"p","text":"He rented an office and 　　　　　　 　　　　　　 his own studio.","official":"He rented an office and 　　set　　 　　up　　 his own studio.","answer":"set / up"},{"kind":"p","text":"4.\t有些人在人行道上排隊等公車。"},{"kind":"p","text":"Some people are 　　　　　　 　　　　　　 on the sidewalk, waiting for the bus.","official":"Some people are 　 lining 　 　　up　　 on the sidewalk, waiting for the bus.","answer":"lining / up"},{"kind":"p","text":""},{"kind":"p","text":""},{"kind":"p","text":""},{"kind":"p","text":""},{"kind":"p","text":""}],"VI":[{"kind":"p","text":"VI.閱讀測驗：9%"},{"kind":"table","text":"Convenience stores are great. It’s easy to pop into one, and they are everywhere. However, convenience stores have not always been around. \nBefore convenience stores existed, there were local corner stores. Corner shops in England have been around for over a hundred years, selling daily items like eggs, milk, and bread. In Australia, these shops are called milk bars, and they showed up in the 1930s. General stores in America have been around for hundreds of years, selling daily goods, clothes, and farming supplies. In the early days, these shops were wonderful, but they weren’t open long hours, and they were only open on certain days.\nThe first convenience store, the Southland Ice Company, was opened in Dallas, Texas in 1927. The shop was instantly popular because it saved local people time by not needing to travel to faraway grocery stores. The shop went on to develop into the 7-Eleven chain. The name 7-Eleven came from the fact that it was open for long hours, from 7 a.m. to 11 p.m. every day. \nToday, many convenience stores are open seven days a week and 24 hours a day. Now that’s real convenience!"},{"kind":"p","text":"（   ）\t1.\tWhich of the following statements about the corner stores is true?","official":"（ D ）\t1.\tWhich of the following statements about the corner stores is true?","answer":"D"},{"kind":"p","text":"(A) They are open every day."},{"kind":"p","text":"(B) They sell only farming supplies."},{"kind":"p","text":"(C) They have been around for less than fifty years in England."},{"kind":"p","text":"(D) They are called by different names in different countries."},{"kind":"p","text":"（   ）\t2.\tWhat can be inferred from this passage?","official":"（ A ）\t2.\tWhat can be inferred from this passage?","answer":"A"},{"kind":"p","text":"(A) The 7-Eleven chain store got its name from its opening hours."},{"kind":"p","text":"(B) There were convenience chain stores before 1927 in America."},{"kind":"p","text":"(C) Grocery stores were close to where people lived back in 1927."},{"kind":"p","text":"(D) The first convenience store in Dallas was open 24 hours a day."},{"kind":"p","text":"（   ）\t3.\tWhat does the phrase “pop into” mean in the first paragraph?","official":"（ B ）\t3.\tWhat does the phrase “pop into” mean in the first paragraph?","answer":"B"},{"kind":"p","text":"(A) To appear suddenly."},{"kind":"p","text":"(B) To visit a place briefly."},{"kind":"p","text":"(C) To go back into a place."},{"kind":"p","text":"(D) To run away from something."},{"kind":"p","text":""}]},"solutions":{"I":["1. impulse\t\t\t2. aimed","3. urge\t\t\t4. profitable","5. displayed\t\t6. strategy","7. familiar\t\t\t8. visible","9. trapped\t\t\t10. purchase","11. awareness\t\t12. similarities"],"II":["1. B\t   2. A\t 3. D\t    4. C\t   5. C"],"III":["1. B\t   2. D\t 3. A\t    4. B\t   5. A"],"IV":["1.\tThe happier people are with ],"V":["1. get; rid; of\t\t2. come; in","3. When; it; comes; to"],"VI":["1. A\t   2. D\t 3. C"],"III_TRANSLATION":["Sherry很喜歡塗鴉。她住的大樓外牆上的畫作總是在改變。對她來說，這顯然是藝術。她認為塗鴉藝術家就像其他畫家或藝術家一樣。不同之處在於他們使用牆壁而不是紙張。有些塗鴉作品引起人們對於世界上需要改變的事情的注意。另一些作品則是純粹看起來很美麗。","有一天，Sherry搬到了一棟新大樓。新大樓也有塗鴉，但這些塗鴉讓大樓看起來很髒亂。此外，這些「藝術家」並不是為了展示美麗或重要的事物而作畫。這些塗鴉大部分是標籤，意指人們只是噴漆他們的名字。她的鄰居們也不喜歡它。這讓他們覺得住在那裡不安全。如果塗鴉導致所有這些問題，也許它根本就不是真正的藝術。Sherry無法打定主意。"],"VI_TRANSLATION":["塗鴉確實可以是藝術的一種形式。在阿肯色州的史密斯堡，市政府在市中心地區的牆壁上提供空間給藝術家，以便他們創作塗鴉壁畫。史密斯堡還每年舉辦一個為期十天的藝術節。藝術家進行繪畫，詩人朗讀詩歌，並舉辦滑板藝術比賽。","這個藝術節從2015年以來就持續舉辦，主辦方邀請了來自美國各地和超過15個其他國家的塗鴉藝術家。壁畫的主題從有趣的到政治的都有，這些壁畫使史密斯堡的市中心區顯得更加多彩和生動。","史密斯堡並不是當今擁有令人印象深刻塗鴉壁畫的唯一城市。另一些出色的壁畫包括加州沙加緬度的Johnny Cash壁畫，以及紐約市知名的七彩繽紛的「時代廣場之吻」壁畫。","這些令人印象深刻的塗鴉作品表明藝術可以有多種形式，今天，色彩豐富、風格有趣的塗鴉是讓市中心變得更加美麗的好方法。","1.\t前兩段主要是關於什麼？","(A)\t一個城市如何支持塗鴉文化。","(B)\t史密斯堡壁畫的主題。","(C)\t如何在美國成功舉辦藝術節。","(D)\t塗鴉應該被視為一種藝術形式的理由。","2.\t從這篇文章中我們可以推論出什麼？","(A)\t塗鴉僅以壁畫的形式出現。","(B)\t在阿肯色州的史密斯堡，創作塗鴉是不被允許的。","(C)\t史密斯堡的藝術節僅由塗鴉藝術家慶祝。","(D)\t在史密斯堡的藝術節上，人們可以看到外國藝術家創作的塗鴉作品。","3.\t以下哪一項陳述是不正確的？","(A)\t史密斯堡的藝術節為期十天。","(B)\t塗鴉的主題可以非常多樣化。","(C)\t史密斯堡的藝術節始於五年前。","(D)\t塗鴉可以用來讓城市更加豐富多彩。"]},"translations":{"II":["許多遊客因美麗的夜空而感到驚喜，聚集在公園裡。","有些人認為塗鴉是藝術，而另一些人認為它使城市看起來雜亂。","把車停在禁停區的人將被罰款。","這篇新聞報導把 1995 年的全球平均氣溫與 2015 年的相比。","Tina 努力學習韓文，以便寫信給她的韓流偶像。"]}}];const PARTS=[['I','I 文意字彙'],['II','II 文法選擇'],['III','III 綜合測驗'],['IV','IV 句型練習'],['V','V 引導式翻譯'],['VI','VI 閱讀測驗']];let li=0,part='I',renderQIndex=0;const $=s=>document.querySelector(s);const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function exerciseMarkup(text){let cut=text.search(/\s*\(A\)/),stem=(cut>=0?text.slice(0,cut):text).trim(),tail=cut>=0?text.slice(cut):'',s=sentences(stem)[0]||stem;return `<span class="exercise-text"><span class="exercise-plain">${E(text)}</span><span class="exercise-colored">${coloredSentence(s)}${E(stem.slice(s.length))}${E(tail)}</span></span>`}
function sourceBlock(b){if(b.kind==='table')return `<div class="reading-card">${E(b.text)} <button class="speak" data-say="${E(b.text)}">🔊</button></div>`;let text=b.text.trim();if(!text)return'';if(/^((I|II|III|IV|V|VI)\s*[.．])/.test(text))return `<h2 class="section-title">${E(text)}</h2>`;let editable=b.official?`<input data-answer="${E(b.answer||b.official)}" aria-label="作答">`:'';let english=/[A-Za-z]/.test(text),shown=english?exerciseMarkup(text):E(text),zh='';if(b.official){zh=(DATA[li].translations?.[part]||[])[renderQIndex]||'';renderQIndex++}return `<div class="p ${b.official?'q':''}"><span>${shown} ${english?`<button class="mini" data-say="${E(text)}" title="朗讀">🔊</button><button class="mini" data-qtree title="彩色句構">🌳</button>${zh?`<button class="mini" data-qzh title="中文翻譯">中</button>`:''}`:''}</span>${editable}${zh?`<div class="exercise-translation"><b>中文：</b>${E(zh)}</div>`:''}<div class="answer official">${b.official?`正式答案：${E(b.official)}`:''}</div>${b.official?`<div class="answer-analysis">${E(exactNote(b.answer||b.official,text))}</div>`:''}</div>`}
function analysis(l,p){if(!['III','VI'].includes(part))return'';let tables=l.sections[part].filter(x=>x.kind==='table'),zh=zhParts(l.solutions[part+'_TRANSLATION']);let all=tables.flatMap(x=>sentences(x.text));return `<h3 style="color:var(--green);margin:18px 0 8px">逐句中文翻譯・彩色 S／V／O／C／M 結構樹・白話文法</h3>`+all.map((s,i)=>`<div class="analysis-card"><div class="en">${i+1}. ${E(s)} <button class="speak" data-say="${E(s)}">🔊</button></div><div class="zh"><b>中文：</b>${E(zh[i]||zh[Math.min(i,zh.length-1)]||'')}</div>${tree(s)}<div class="grammar-cn"><b>白話文法：</b>${E(grammarNote(s))}</div></div>`).join('')}
function syncRevealText(on){document.querySelectorAll('[data-reveal]').forEach(b=>b.textContent=on?'隱藏答案、中文與結構樹':'顯示答案＋逐句中文＋彩色結構樹')}
function toggleReveal(){let on=$('.body').classList.toggle('revealed');syncRevealText(on)}
function render(){let l=DATA[li];renderQIndex=0;$('#lessons').innerHTML=DATA.map((x,i)=>`<button data-l="${i}" class="${i===li?'on':''}">${x.id}</button>`).join('');$('#parts').innerHTML=PARTS.map(x=>`<button data-p="${x[0]}" class="${x[0]===part?'on':''}">${x[1]}</button>`).join('');$('#hero').textContent=l.title;$('#lessonTitle').textContent=`${l.id} ${l.title}`;let passage='',seen=false,body=`<div class="controls" style="position:static;margin:0 0 7px"><button data-reveal>顯示習作答案</button><button class="ghost" data-toggle="trees">🌳 原題全部標色</button><span class="tree-hint">彩色句構直接在原題文字變化；中文固定顯示</span></div><div class="tree-legend"><span class="s">S 主詞</span><span class="v">V 動詞</span><span class="o">O 受詞</span><span class="c">C 補語</span><span class="m">M 修飾語</span></div>`;for(let b of l.sections[part]){if(b.kind==='table'&&['III','VI'].includes(part)){passage=b.text;body+=passageCard(l,b);seen=true;continue}if((part==='III'||part==='VI')&&seen)continue;body+=sourceBlock(b)}if(part==='III'&&passage)body+=clozeQuestions(l,passage);if(part==='VI'&&passage)body+=readingQuestions(l,passage);let sols=l.solutions[part]||[];body+=`<div class="solution"><h3>正式答案</h3>${sols.map(x=>`<div class="solrow">${E(x)}</div>`).join('')}</div>`;$('#content').innerHTML=body||'<div class="empty">本大題沒有內容。</div>';$('.body').classList.remove('revealed');syncRevealText(false);$('#status').textContent=''}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.l!==undefined){li=+b.dataset.l;part='I';render();scrollTo(0,0)}else if(b.dataset.p){part=b.dataset.p;render();scrollTo(0,0)}else if(b.dataset.say!==undefined)say(b.dataset.say);else if(b.dataset.reveal!==undefined)toggleReveal();else if(b.dataset.tree!==undefined)b.closest('.diag-sentence')?.classList.toggle('color-open');else if(b.dataset.qtree!==undefined)b.closest('.p')?.classList.toggle('color-open');else if(b.dataset.qzh!==undefined)b.closest('.p')?.classList.toggle('translation-open');else if(b.dataset.toggle==='trees')b.closest('#content')?.classList.toggle('show-trees');else if(b.dataset.toggle==='translations')b.closest('#content')?.classList.toggle('show-translations');else if(b.dataset.clozeChoice!==undefined){b.closest('.cloze-options').querySelectorAll('button').forEach(x=>x.classList.remove('chosen'));b.classList.add('chosen')}else if(b.dataset.clozeExplain!==undefined){let q=b.closest('.cloze-card');q.classList.toggle('open');b.textContent=q.classList.contains('open')?'隱藏解答與解析':'查看解答與解析'}else if(b.dataset.explain!==undefined){let q=b.closest('.question-card');q.classList.toggle('open');b.textContent=q.classList.contains('open')?'隱藏解答與解析':'查看解答與解析'}});$('#reveal').onclick=toggleReveal;$('#clear').onclick=()=>{$('#content').querySelectorAll('input,textarea,select').forEach(x=>x.value='');$('#status').textContent='已清除'};render();</script></body></html>
