<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>逆熵心靈雞湯</title>
<style>
:root{--bg:#fff8ec;--card:#fff;--ink:#3a2e22;--mute:#8a7a68;--line:#f0dfc4;--acc:#e8873a;--acc2:#3f9b7a;--red:#d9604c;--mark:#ffe27a;--soft:#fff1db}
@media (prefers-color-scheme:dark){:root{--bg:#1d1913;--card:#28221a;--ink:#f3e9dc;--mute:#b3a48f;--line:#40362a;--acc:#f0a35e;--acc2:#6cc4a2;--red:#ef8a76;--mark:#7a6320;--soft:#302719}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.8 "Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px dashed var(--line)}
.top{display:flex;gap:10px;align-items:center;max-width:960px;margin:0 auto;padding:10px 16px 6px}
h1{font-size:20px;margin:0;white-space:nowrap;color:var(--acc)}
#q{flex:1;min-width:0;font:inherit;font-size:16px;padding:8px 16px;border:2px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);outline:none}
#q:focus{border-color:var(--acc)}
nav{display:flex;gap:6px;overflow-x:auto;max-width:960px;margin:0 auto;padding:0 12px 8px}
nav button{flex:none;font:inherit;font-size:15px;border:2px solid transparent;background:none;color:var(--mute);padding:3px 12px;border-radius:999px;cursor:pointer}
nav button.on{background:var(--card);color:var(--ink);border-color:var(--acc);font-weight:700}
main{max-width:960px;margin:0 auto;padding:16px 16px 60px}
h2{font-size:24px;color:var(--acc);margin:6px 0 4px}
.lead{color:var(--mute);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 18px;transition:box-shadow .3s}
.card h3{margin:0 0 6px;font-size:19px;color:var(--acc2)}
.card p{margin:4px 0}
.card.flash{box-shadow:0 0 0 4px var(--acc)}
.full{grid-column:1/-1}
.no{display:inline-block;min-width:1.8em;color:var(--acc);font-weight:700}
.bad,.good{border-radius:10px;padding:4px 10px;margin:5px 0;font-size:17px}
.bad{background:rgba(217,96,76,.10)}
.good{background:rgba(63,155,122,.12)}
.soup{background:linear-gradient(135deg,#ffe6c4,#fff5e3);border:2px solid var(--line);border-radius:24px;padding:24px;text-align:center}
@media (prefers-color-scheme:dark){.soup{background:linear-gradient(135deg,#3a2c1b,#2a2218)}}
.soup .bowl{font-size:56px;line-height:1}
.soup .say{font-size:24px;font-weight:700;margin:12px 0 16px;min-height:3em}
.btn{font:inherit;font-size:16px;padding:6px 16px;border:2px solid var(--acc);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--acc);color:#fff}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:16px 0}
.links button{font:inherit;font-size:16px;padding:12px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);cursor:pointer}
.links button span{display:block;font-size:28px}
.srow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}
.sb{display:flex;gap:4px;flex:none}
.sb button{min-width:46px;height:40px;font:inherit;font-size:16px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);cursor:pointer}
.sb button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tot{font-size:22px;font-weight:700;color:var(--acc);margin:12px 0 4px}
.msg{color:var(--acc2);font-weight:700}
.hrow{display:flex;gap:8px;align-items:center;margin:4px 0;font-size:16px}
.bar{flex:1;height:12px;background:var(--soft);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc2)}
.del{border:0;background:none;color:var(--red);cursor:pointer;font:inherit}
input[type=date]{font:inherit;font-size:16px;padding:4px 8px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.nf{display:block;margin:10px 0}
.nf span{display:block;font-weight:700}
.nf textarea{width:100%;font:inherit;font-size:17px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);resize:vertical}
details.rec{border:2px solid var(--line);border-radius:12px;padding:6px 12px;margin:6px 0}
#results{position:fixed;z-index:30;left:50%;transform:translateX(-50%);top:100px;width:min(920px,calc(100% - 24px));max-height:70vh;overflow:auto;background:var(--card);border:2px solid var(--line);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:8px}
.rh{font-size:15px;color:var(--mute);padding:4px 8px}
.r{display:block;width:100%;text-align:left;font:inherit;font-size:17px;background:none;border:0;border-radius:12px;padding:8px;color:var(--ink);cursor:pointer}
.r:hover{background:var(--soft)}
.tg{font-size:13px;color:var(--acc2);border:1px solid var(--line);border-radius:8px;padding:0 6px;margin-right:6px}
.sn{display:block;font-size:15px;color:var(--mute)}
mark{background:var(--mark);color:inherit;border-radius:3px}
.post summary{cursor:pointer;color:var(--acc2);font-weight:700;margin:6px 0}
.strip{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 10px}
.cv{flex:none;width:230px;text-align:center}
.cv canvas{width:100%;height:auto;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.15);display:block;margin-bottom:6px}
.cv .btn{font-size:14px;padding:3px 10px}
.pbody{white-space:pre-wrap;font-size:18px;line-height:1.95;padding:8px 2px}
footer{max-width:960px;margin:0 auto;padding:0 16px 30px;font-size:14px;color:var(--mute)}
@media (max-width:600px){h1{font-size:16px}.srow{flex-direction:column;align-items:flex-start}.soup .say{font-size:20px}}
</style>
</head>

<div class="top"><h1>🍲 逆熵心靈雞湯</h1><input id="q" type="search" placeholder="想找什麼？例如：睡覺、手機、生氣" autocomplete="off"></div>

</header>
<div id="results" hidden></div>
<main id="main"></main>

{type:'生活覺醒',who:'一直硬撐、不敢休息',title:'越用力，越混亂？——你缺的不是力氣，是整理',prop:'秩序不是用力撐出來的，\n而是溫柔整理出來的。',
secs:[['亂，是世界的本性；整理，是人的選擇','萬物都在變亂，\n唯有整理，\n讓生活重新有光。'],['硬撐不是堅強，是把問題往後推','你以為在前進，\n其實只是在借\n未來的力氣。'],['大掃除會累垮人，小整理才救得了人','改變不是一場暴雨，\n而是每天\n一點點的細雨。'],['休息不是退後，是為了走得更遠','懂得停下來的人，\n才走得到遠方。']],

body:`晚上十一點，她洗完最後一個碗，終於坐下來。身體說：「去睡吧。」心卻說：「再滑一下，這是我唯一的時間。」於是，最累的人，熬得最晚。

早上八點，他灌下第二杯咖啡。昨天發誓要早睡，今天又在會議室裡打瞌睡。他對自己說：「再努力一點就好。」可是努力了一年，他只是更累了。

週末午後，一位媽媽打開衣櫃，衣服像雪崩一樣掉下來。她站了很久，關上門，說：「下次吧。」下次，就這樣過了一年。

我們都相信一件事：亂，是因為不夠努力。
可是，如果努力就能解決，為什麼最努力的人，往往最疲憊？
如果撐下去就會變好，為什麼撐得越久，崩得越重？
會不會，我們把力氣，用錯了地方？

一、亂，是世界的本性；整理，是人的選擇
花不澆會枯，房不掃會亂，身體不休息會垮。這不是懲罰，是時間的規律。
所以，亂不是罪名，是提醒；累不是失敗，是訊號。
不是你不夠好，是你太久沒有被好好照顧。
「萬物都在變亂，唯有整理，讓生活重新有光。」

二、硬撐不是堅強，是把問題往後推
少睡一小時，明天用兩杯咖啡還；忍下一句委屈，下個月用一場爭吵還；今天不肯停，明天就被迫停。
撐，看起來很勇敢；其實，只是把今天的帳，寫在明天的名下。
「你以為在前進，其實只是在借未來的力氣。」

三、大掃除會累垮人，小整理才救得了人
一次整理全部，三天就放棄；一天整理一點，一年就不同。
大，讓人害怕；小，讓人開始。
那位媽媽後來每天只整理一層。一個月後，衣櫃整齊了，她的嘆氣也少了。
「改變不是一場暴雨，而是每天一點點的細雨。」

四、休息不是退後，是為了走得更遠
手機沒電要充，車子沒油要加，那人呢？
我們記得手機的電量，卻忘了自己的；我們心疼別人的疲憊，卻責怪自己的。
「懂得停下來的人，才走得到遠方。」

【今天的小練習】
今晚只整理一個最小的地方：一個抽屜、一個包包、一個資料夾。然後對自己說：「我今天，有照顧自己一點點。」

那個深夜滑手機的女生，後來把「屬於自己的時間」搬到早晨：一杯茶，一扇窗，十分鐘的安靜。
她才發現，她要的從來不是手機，
是一段，不必再撐的時間。

生活會亂，
這是時間的事；
生活能被整理，
這是你的事。
不必更用力，
只要更溫柔。`},

end:'情緒會敲門，\n這沒有錯；\n你可以不開門就吼，\n也可以先問一聲：\n「是誰？\n你想告訴我什麼？」',
body:`孩子把牛奶打翻在剛擦好的地板上。她還來不及想，聲音已經衝出口：「你為什麼每次都這樣！」孩子嚇得不敢動，她的心卻比孩子更痛。

他傳出一則訊息，等了一整個下午。對方已讀，沒回。他越想越慌：「我是不是說錯話？他是不是討厭我？」一句沒回的訊息，偷走了他一整夜的睡眠。

加班到深夜，她打開冰箱，拿出一包餅乾，一片，又一片。吃到最後才發現，自己一點也不餓。

我們都說：我脾氣不好，我自制力太差。
可是，真的是我們太壞，還是我們太累？
我們真的在對別人生氣嗎？還是在對那個無能為力的自己生氣？
如果情緒是一封信，我們有沒有，哪怕一次，好好讀過它？

一、吼出口的，常常不是憤怒，是疲憊
牛奶打翻只是一秒，壓在心上的，卻是一整天、一整年的累。
我們以為自己在生孩子的氣，其實是在對生活喊：「我撐不住了。」
所以，責怪自己沒有用，照顧自己才有用。
「你吼的是孩子，痛的是自己。」

二、嘴巴想要的不是零食，是擁抱
心空了，手就忙了；人孤單了，嘴巴就饞了。
我們用食物填洞，用購物填洞，用滑手機填洞；洞越填越大，心越填越空。
下次伸手之前，問自己：我是肚子餓，還是心裡累？
「餓的不是胃，是心。」

三、讓你痛的不是事實，是你寫的劇本
事實是：他還沒回。
劇本是：他討厭我、他看不起我、我又搞砸了。
事實只有一行，劇本卻有一百頁；事實很安靜，劇本卻很吵。
「事情只有一行字，恐懼卻寫成一本小說。」

四、慢三秒，不是軟弱，是把方向盤拿回來
衝出口，很快；收回來，很難。
吸一口氣，數到四，再吐出來。這三秒，不是退讓，是讓自己重新坐回駕駛座。
「先呼吸，再說話；先看見，再回應。」

【今天的小練習】
下次情緒來時，先問自己一句：「這封信，想告訴我什麼？」是累了？怕了？還是委屈了？讀懂它，你就不必用吼的。

後來，孩子又打翻了東西。她深吸一口氣，蹲下來，輕輕說：「我們一起擦。」
孩子愣了一下，笑了。
那一刻她明白：牛奶沒變，地板沒變，
變的，是她讀懂了自己。

情緒會敲門，
這沒有錯；
你可以不開門就吼，
也可以先問一聲：
「是誰？
你想告訴我什麼？」`},
{type:'經典轉譯',who:'一直重複同樣的人生',title:'你不是走錯路，你只是太熟悉這條路——讀「順生人，逆成仙」',prop:'順著走，是本能；\n轉身，才是選擇。',
secs:[['熟悉的，不一定是對的','最難改的不是壞習慣，\n是熟悉的習慣。'],['逆，不是對抗，是看見','停下來的那一刻，\n你就有了選擇。'],['仙，不在天上，在清醒的心裡','清楚，\n就是一種自由。'],['一次轉身，就是一條新路','新的路，\n不是想出來的，\n是走出來的。']],
practice:'找一個最常重複的習慣，寫下：\n它什麼時候出現？\n出現時，我能換成哪個小動作？\n明天，只試一次。',
end:'順水而下，\n是河的方向；\n逆流而上，\n是魚的回家。\n你不必對抗整條河，\n只要記得，\n自己要去哪裡。',
body:`每個週五，他都說：「這週末一定早睡、一定運動。」每個週一，他都說：「下週一定。」一年說了五十次，路還是同一條路。

她和每一任男友分手的理由都一樣：他不夠在乎我。朋友輕聲問：「會不會，你一直在等別人證明你值得被愛？」那一晚，她沉默得像一面鏡子。

一位爸爸好想靠近兒子，可是一開口，就變成當年父親罵他的語氣。他恨那種語氣，卻一字不差地，傳了下去。

我們都想改變，卻總在原地繞圈。
是我們不夠努力，還是那條路太熟了，熟到腳會自己走？
是我們不想離開，還是從來沒發現，自己一直在同一個路口轉同一個彎？
如果想走出來，要往哪裡走？

古人說：「順生人，逆成仙。」
這原是修行的話。今天，我們不談飛天成仙，只讀它留給生活的提醒。

一、熟悉的，不一定是對的
餓了就吃，累了就滑，被罵就回嘴。順著走，最輕鬆，因為不必想。
可是，輕鬆的路，常常也是困住我們的路；熟悉的聲音，常常也是傷害我們的聲音。
那位爸爸不是不愛，他只是順著小時候聽見的語氣，走了幾十年。
「最難改的不是壞習慣，是熟悉的習慣。」

二、逆，不是對抗，是看見
「逆」聽起來很苦，像在逼自己、壓自己。其實不是。
逆，不是跟自己打仗，是在習慣要接手的那一秒，停下來問：「我真的要這樣嗎？」
河裡的魚多半順水而游，可是要回家時，牠會轉身。不是為了跟河吵架，是因為牠知道自己要去哪裡。
「停下來的那一刻，你就有了選擇。」

三、仙，不在天上，在清醒的心裡
我們不必離開人間，也能活得像仙：心更清楚，步伐更穩，不再被情緒牽著走。
那個等人證明愛的女生，開始問自己：「我能不能先好好待自己？」她沒有立刻遇見對的人，卻先遇見了不慌的自己。
「清楚，就是一種自由。」

四、一次轉身，就是一條新路
不必一夜翻轉人生。想回嘴時，先吸一口氣；想熬夜時，早半小時關燈；想說「我就是這樣」時，改成「我正在學」。
一次轉身，是一個腳印；一百個腳印，就是一條路。
「新的路，不是想出來的，是走出來的。」

【今天的小練習】
找一個你最常重複的習慣，寫下：它什麼時候出現？出現時，我能換成哪個小動作？明天，只試一次。

那位爸爸開始在開口前，先問一句：「今天還好嗎？」
第一次，兒子說「還好」；第五次，兒子說起了學校的事。
那條傳了三代的路，在他這裡，轉了一個彎。

順水而下，
是河的方向；
逆流而上，
是魚的回家。
你不必對抗整條河，
只要記得，
自己要去哪裡。`},
{type:'哲學與AI',who:'害怕犯錯，一錯就否定自己',title:'導航從不罵你笨，你為什麼要罵自己？',prop:'錯誤不是你的答案，\n而是你的路標。',
secs:[['錯，是路標，不是判決','錯誤告訴你路在哪裡，\n不是告訴你\n你是誰。'],['會改的，比不錯的更強','不是不跌倒的人強，\n是跌倒了\n還願意站起來的人。'],['舊地圖，到不了新地方','拿著舊地圖，\n到不了新地方。'],['機器會重算，人更值得被溫柔','對自己說話，\n就像對你\n最愛的人說話。']],
practice:'今天犯了小錯，\n把責怪自己的話寫下，\n改成「導航版」：\n「我真笨」→\n「這裡還沒學會，下次多看一遍」',
end:'人生沒有\n一條不轉錯的路；\n真正的勇敢，\n是錯了以後，\n還能輕輕地說：\n「重新規劃路線。」',
body:`考卷發下來，滿滿的紅字。她把考卷翻過去，像要把自己也藏起來：「我就知道，我果然很笨。」

他第一次上台，講到一半忘詞，台下傳來一聲笑。從此，每一次開口，他都先聽見那聲笑；每一個機會，他都讓給了別人。

她第一次煮湯，鹹了。先生只說了一句「有點鹹」，她卻整晚不說話：「我連這個都做不好。」

我們好怕錯。錯一題，就覺得整個人都錯了。
可是，錯了，真的代表我不好嗎？
如果錯誤那麼可怕，為什麼沒有一個人，從來不錯？
有沒有可能，錯誤不是來懲罰我們，而是來帶路的？

先做一個小小的思想實驗。
你開車轉錯了路口，手機導航會說什麼？
它不會說：「你這個笨蛋。」它只會說：「重新規劃路線。」
它不責怪、不翻舊帳、不停在原地難過，只問一件事：下一個路口，怎麼走？

一、錯，是路標，不是判決
導航知道你轉錯，是因為「你在哪裡」和「你要去哪裡」不一樣了。這個不一樣，就是錯誤。
紅字不是在說「你不行」，而是在說「這裡，還沒學會」。
判決讓人停下，路標讓人前進。
「錯誤告訴你路在哪裡，不是告訴你你是誰。」

二、會改的，比不錯的更強
今天很多聰明的電腦程式，都是錯了千萬次、改了千萬次，才越來越聰明。沒有人說它笨，因為大家知道：改，就是它學習的方式。
小孩學走路，跌倒一百次，沒有人說他失敗，只說他在學。
為什麼對機器、對孩子那麼寬容，對自己卻那麼嚴厲？
「不是不跌倒的人強，是跌倒了還願意站起來的人。」

三、舊地圖，到不了新地方
導航改得快，因為它願意放下舊路線；人改得慢，因為我們緊抓著舊想法：「我一直都這樣」「我就是不會說話」。
那個怕上台的男生，心裡的地圖還停在被笑的那一天。地圖不更新，他就永遠走在那一天。
「拿著舊地圖，到不了新地方。」

四、機器會重算，人更值得被溫柔
導航不會痛，所以它不需要安慰；可我們會痛、會怕、會難過，所以更需要一句溫柔的話。
同樣一鍋鹹湯，「我什麼都做不好」讓人沉默一整晚；「下次鹽少放一點」，讓人明天再試一次。
「對自己說話，就像對你最愛的人說話。」

【今天的小練習】
今天只要犯了一個小錯，就把心裡責怪自己的那句話寫下來，再改寫成「導航版」：「我真笨」，改成「這裡還沒學會，下次多看一遍」。

後來，她把考卷翻回來，一題一題看。下一次考試，她還是有錯，
可是她說：「至少，我知道該往哪裡走了。」

人生沒有
一條不轉錯的路；
真正的勇敢，
是錯了以後，
還能輕輕地說：
「重新規劃路線。」`},
{type:'生活覺醒',who:'覺得人生一團亂，不知道從哪裡開始',title:'人生亂成一團時，你只需要打開一扇門',prop:'人生不是一次整理好的，\n是一間一間\n點亮的。',
secs:[['看見全部讓人窒息，看見一間讓人呼吸','看見全部，讓人害怕；\n看見一間，\n就能開始。'],['房間之間有門：亂會走路，光也會','一間房亮了，\n隔壁的\n也會跟著亮。'],['從最容易的那一間開始','先求亮一盞燈，\n不求亮整棟樓。'],['空出來的房間，是給新的自己','空，\n不是失去，\n是留給新的自己。']],
practice:'畫十二個格子：\n身體、心情、時間、朋友、錢……\n每格給一到五顆星，\n只選一格，\n寫下明天能做的一件小事。',
end:'人生不會一次整理好，\n你也不必。\n今天，\n先打開一扇門，\n把一間房的燈，\n點亮。',
body:`書桌上，帳單、聯絡簿、沒回的訊息、明天要交的報告，堆成一座小山。她深吸一口氣，然後拿起手機，滑了一個小時。事情一件也沒少，心卻更重了。

他覺得什麼都不對：工作卡住，夫妻常吵，存款變少，身體變重。半夜躺在床上，他問天花板：「我的人生，是不是整個壞掉了？」

一位剛退休的阿姨說，孩子大了，工作沒了，鬧鐘不必響了。她卻在最自由的日子裡，第一次不知道自己是誰。

當所有事一起亂掉，人最常做的不是解決，是愣住。
為什麼事情越多，我們越動不了？
是我們能力不夠，還是我們想一口氣，整理整棟房子？
如果把人生分成一間一間的房間，會不會，終於知道從哪裡開始？

一、看見全部讓人窒息，看見一間讓人呼吸
身體是一間，心情是一間，時間是一間；家人、朋友、金錢、工作、「我是誰」，也都是一間間房。
每間房都會亂，這很正常；同時看著十間亂房，誰都會腿軟。
那個愣住的女生不是不會做事，她只是一次看了太多扇門。
「看見全部，讓人害怕；看見一間，就能開始。」

二、房間之間有門：亂會走路，光也會
身體那間亂了，睡不好；心情那間就跟著亂；心情一亂，家人那間也開始吵。
亂會沿著門縫走路，好消息是：光也會。
那位先生後來發現，一切是從半年前天天熬夜開始的。不是整棟房壞了，是一間房的亂，走進了其他房間。
「一間房亮了，隔壁的也會跟著亮。」

三、從最容易的那一間開始
不要先挑最難的那扇門。先選一間，整理一點就看得見光的。
早點睡，是一盞燈；把桌上分成三疊，是一盞燈；傳一句「謝謝你」，也是一盞燈。
那位先生先點亮的是身體那間：十一點前關燈。兩週後，他吵架少了，說話也溫柔了。
「先求亮一盞燈，不求亮整棟樓。」

四、空出來的房間，是給新的自己
那位阿姨的房間裡，原本貼滿「媽媽」「員工」的標籤。標籤撕下來，房間空了。
空，看起來像失去；其實，是騰出位置。她開始學畫，每週到公園陪孩子讀故事。
「空，不是失去，是留給新的自己。」

【今天的小練習】
拿一張紙畫十二格：身體、腦袋、學習、說話、心情、時間、做事、朋友、錢、環境、我是誰、想法。每格給一到五顆星，只選一格，寫下明天能做的一件小事。

後來，那個女生只選了「時間」那一格，隔天先把最急的一件事做完。
事情沒有變少，
她卻不再愣住了。

人生不會一次整理好，
你也不必。
今天，
先打開一扇門，
把一間房的燈，
點亮。`},
{type:'數字清單',who:'過度討好，替所有人扛',title:'你對全世界溫柔，為什麼唯獨對自己殘忍？',prop:'愛別人，\n不等於替別人活。',
secs:[['分清楚：這是誰的責任','你扛起所有人，\n誰來扛起你？'],['先看電量，再說好','做得到才答應，\n是對別人誠實，\n也是對自己溫柔。'],['最好的幫忙，是讓人站起來','讓人站起來，\n比一直扶著他\n更好。'],['說出累，不是抱怨，是誠實','你不說，\n別人就以為\n你永遠不會累。'],['休息不是自私，是把自己放回生命裡','把自己，\n放回\n自己的生命裡。']],
practice:'今天練習說一次：\n「我想一下再回你。」\n不一定要拒絕，\n只是給自己一點空間，\n聽聽心裡的聲音。',
end:'你的好，很珍貴。\n所以別把它全部送光，\n留一些，\n給那個一直付出、\n也很需要被疼的\n自己。',
body:`同事把報告推過來：「你最厲害了，幫我看一下嘛。」她笑著說好。別人準時下班，她加班到九點。她的好，成了別人的方便。

家族聚會，他接送長輩、訂位、收拾。大家吃得熱熱鬧鬧，他吃到的，都是涼掉的菜。回家的路上，他忽然好委屈，卻說不出為什麼。

朋友半夜來電哭訴，她陪著聽到凌晨兩點。隔天頭痛欲裂，她還安慰自己：「朋友需要我啊。」可是，那個需要被陪的她，誰來陪？

我們以為：對別人好，別人就會喜歡我；大家開心，我就安全了。
可是，如果你對每個人都好，誰來對你好？
那些「好」，是真心想給，還是害怕被討厭？
有沒有一種溫柔，是不用拿自己去換的？

一、分清楚：這是誰的責任
舊習慣：別人的問題，全部接過來。
新理解：替別人扛，對方學不會長大，你卻先倒下。幫忙是禮物，扛起一切卻是枷鎖。
行動：下次有人求助，先問自己：「這是誰的事？我能幫的是哪一塊？」
「你扛起所有人，誰來扛起你？」

二、先看電量，再說好
舊習慣：為了當好人，什麼都答應。
新理解：力氣像手機電量，每答應一件，就少一格。電量歸零的人，給不出任何溫暖。
行動：練習說：「我想一下再回你。」給自己五分鐘，看看還剩多少電。
「做得到才答應，是對別人誠實，也是對自己溫柔。」

三、最好的幫忙，是讓人站起來
舊習慣：每次都幫到底，最後大家都靠你。
新理解：扶一次，是幫忙；扶一輩子，是綁住。真正的幫助，讓人越來越有力，不是越來越離不開你。
行動：下次可以說：「我教你我怎麼做，你試試看。」
「讓人站起來，比一直扶著他更好。」

四、說出累，不是抱怨，是誠實
舊習慣：撐到極限，才在某天為小事爆炸。
新理解：沒說出口的委屈不會消失，只會悄悄堆高。你的沉默，不是體貼，是讓別人永遠看不見你。
行動：「我最近有點累，這次可以換別人幫忙嗎？」
「你不說，別人就以為你永遠不會累。」

五、休息不是自私，是把自己放回生命裡
舊習慣：一休息，就覺得對不起大家。
新理解：照顧好自己，不是背叛別人，是讓愛能走得更久。
行動：這週留一個小時，只為自己。
「把自己，放回自己的生命裡。」

【今天的小練習】
今天練習說一次：「我想一下再回你。」不一定要拒絕，只是給自己一點空間，聽聽心裡真正的聲音。

下一次聚會前，那位先生鼓起勇氣說：「這次我想好好吃頓飯，接送可以輪流嗎？」
沒想到，大家都說好。
那一晚，他第一次吃到熱騰騰的菜，
也第一次發現：被照顧，原來這麼暖。

你的好，很珍貴。
所以別把它全部送光，
留一些，
給那個一直付出、
也很需要被疼的
自己。`}

const $=s=>document.querySelector(s);

function wrapText(ctx,text,maxW){const out=[];const NOHEAD='，。、；：？！」』）…—';
 String(text).split('\n').forEach(par=>{let line='';for(const ch of par){const tryL=line+ch;if(ctx.measureText(tryL).width>maxW&&line){if(NOHEAD.includes(ch)){line=tryL;continue}out.push(line);line=ch}else line=tryL}out.push(line)});return out}
function block(ctx,lines,x,yc,lh,align){ctx.textAlign=align||'center';const h=lines.length*lh;let y=yc-h/2+lh*0.72;lines.forEach(l=>{ctx.fillText(l,x,y);y+=lh});return yc+h/2}
function drawCard(cv,p,pi,card,ci,n){const W=1080,H=1350;cv.width=W;cv.height=H;const c=cv.getContext('2d');const [b1,b2,ink,acc]=PAL[pi%PAL.length];
 const g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,b1);g.addColorStop(1,b2);c.fillStyle=g;c.fillRect(0,0,W,H);
 c.globalAlpha=.18;c.fillStyle='#fff';c.beginPath();c.arc(W-120,170,260,0,7);c.fill();c.beginPath();c.arc(90,H-150,200,0,7);c.fill();c.globalAlpha=1;
 c.fillStyle=acc;c.font='bold 34px '+FONT;c.textAlign='left';c.fillText('🍲 逆熵心靈雞湯｜'+p.type,80,110);c.textAlign='right';c.fillText((ci+1)+' / '+n,W-80,110);
 c.fillStyle=acc;c.fillRect(80,140,120,8);
 c.fillStyle=ink;
 if(card.k==='cover'){let fs=80,L;for(fs of [80,74,68,62,56]){c.font='bold '+fs+'px '+FONT;L=wrapText(c,p.title.replace('——','\n——'),W-180);if(L.every(l=>l.length>3))break}const end=block(c,L,W/2,560,Math.round(fs*1.4));
   c.fillStyle=acc;c.fillRect(W/2-60,end+60,120,6);c.fillStyle=ink;c.font='58px '+FONT;block(c,wrapText(c,p.prop,W-220),W/2,end+300,88)}
 else if(card.k==='sec'){c.fillStyle=acc;c.font='bold 46px '+FONT;const end=block(c,wrapText(c,card.h,W-200),W/2,380,68);
   c.fillStyle=ink;c.font='bold 140px '+FONT;c.globalAlpha=.22;c.textAlign='left';c.fillText('「',120,end+200);c.globalAlpha=1;
   c.font='bold 82px '+FONT;block(c,wrapText(c,card.q,W-220),W/2,Math.max(end+400,800),124)}
 else if(card.k==='practice'){c.fillStyle=acc;c.font='bold 60px '+FONT;c.textAlign='center';c.fillText('✏️ 今天的小練習',W/2,400);c.fillStyle=ink;c.font='54px '+FONT;block(c,wrapText(c,p.practice,W-220),W/2,800,90)}
 else{c.font='bold 68px '+FONT;block(c,wrapText(c,p.end,W-220),W/2,740,106)}
 c.fillStyle=ink;c.globalAlpha=.7;c.font='32px '+FONT;c.textAlign='center';c.fillText('每天一點點，把生活整理回來',W/2,H-80);c.globalAlpha=1}

function stars(box,key,items,labels,max,msgs){

 box.innerHTML='<p class="lead">'+labels.map((l,i)=>i+'＝'+l).join('　')+'</p>'+items.map((it,i)=>'<div class="srow" data-i="'+i+'"><span>'+esc(it)+'</span><span class="sb">'+labels.map((l,v)=>'<button type="button" data-v="'+v+'" title="'+esc(l)+'">'+v+'</button>').join('')+'</span></div>').join('')+
  '<div class="tot"></div><div class="msg"></div><p><input type="date" class="dt"> <button type="button" class="btn pri sv">存起來</button> <button type="button" class="btn rs">重來</button></p><div class="hist"></div>';
 box.querySelector('.dt').value=today();
 const upd=()=>{box.querySelectorAll('.srow').forEach(r=>r.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.v===s[+r.dataset.i])));
  const sum=s.reduce((a,v)=>a+(v||0),0),f=s.filter(v=>v!==null).length;box.querySelector('.tot').textContent='得到 '+sum+' / '+total+'（填了 '+f+'/'+n+'）';
  let m='';if(f===n){const r=sum/total;m=r<.4?msgs[0]:r<.75?msgs[1]:msgs[2];const mn=Math.min(...s);m+='　最需要照顧的是：'+items.filter((_,i)=>s[i]===mn).join('、')}box.querySelector('.msg').textContent=m};
 const hist=()=>{const o=ST[key]||{},ds=Object.keys(o).sort().reverse().slice(0,30);box.querySelector('.hist').innerHTML=ds.length?'<p><b>我的紀錄</b>（點日期可以看）</p>'+ds.map(d=>'<div class="hrow"><button type="button" class="btn ld" data-d="'+d+'">'+d+'</button><span class="bar"><i style="width:'+o[d].t/total*100+'%"></i></span><b>'+o[d].t+'</b><button type="button" class="del" data-d="'+d+'">×</button></div>').join(''):''};
 box.addEventListener('click',e=>{const b=e.target.closest('.sb button');if(b){s[+b.closest('.srow').dataset.i]=+b.dataset.v;upd();return}
  const d=e.target.dataset.d;if(!d)return;if(e.target.classList.contains('ld')){s=ST[key][d].s.slice();box.querySelector('.dt').value=d;upd()}else if(e.target.classList.contains('del')&&confirm('要刪掉 '+d+' 的紀錄嗎？')){delete ST[key][d];save();hist()}});
 box.querySelector('.rs').onclick=()=>{s.fill(null);upd()};
 box.querySelector('.sv').onclick=()=>{if(s.some(v=>v===null)&&!confirm('還有題目沒填，沒填的算 0 分，要存嗎？'))return;ST[key]=ST[key]||{};ST[key][box.querySelector('.dt').value||today()]={s:s.map(v=>v||0),t:s.reduce((a,v)=>a+(v||0),0)};save();hist()};
 upd();hist();
}

const NAME=Object.fromEntries(TABS);const IDX=[];
document.querySelectorAll('.panel').forEach(p=>{const tab=p.id.slice(2);if(tab==='home')return;p.querySelectorAll('.card').forEach(c=>IDX.push({tab,el:c,title:c.dataset.t,low:c.textContent.toLowerCase()}))});
const R=$('#results'),Q=$('#q');let RES=[],TERMS=[],tm=0;
function clearHl(){document.querySelectorAll('mark.hit').forEach(m=>{const p=m.parentNode;m.replaceWith(document.createTextNode(m.textContent));p.normalize()})}
function hl(el){clearHl();const re=new RegExp(TERMS.map(reEsc).join('|'),'gi');const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const ns=[];while(w.nextNode())ns.push(w.currentNode);
 ns.forEach(n=>{re.lastIndex=0;if(!re.test(n.data))return;re.lastIndex=0;const f=document.createDocumentFragment();let l=0,m;while((m=re.exec(n.data))){f.append(n.data.slice(l,m.index));const k=document.createElement('mark');k.className='hit';k.textContent=m[0];f.append(k);l=m.index+m[0].length}f.append(n.data.slice(l));n.replaceWith(f)})}
function search(){TERMS=Q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);if(!TERMS.length){R.hidden=true;clearHl();return}
 RES=IDX.filter(u=>TERMS.every(t=>u.low.includes(t)));const re=new RegExp(TERMS.map(t=>reEsc(esc(t))).join('|'),'gi');
 R.innerHTML='<div class="rh">找到 '+RES.length+' 張卡片　按 Esc 關掉</div>'+(RES.length?RES.map((u,i)=>{const tx=u.el.textContent.replace(/\s+/g,' ');const p=Math.max(0,tx.toLowerCase().indexOf(TERMS[0])-20);return '<button type="button" class="r" data-k="'+i+'"><span class="tg">'+NAME[u.tab]+'</span><b>'+esc(u.title)+'</b><span class="sn">'+esc(tx.slice(p,p+70)).replace(re,m=>'<mark>'+m+'</mark>')+'</span></button>'}).join(''):'<div class="rh">找不到耶，換個字試試看 🙂</div>');R.hidden=false}
function go(u){R.hidden=true;show(u.tab);u.el.querySelectorAll('details').forEach(d=>d.open=true);hl(u.el);const mk=u.el.querySelector('mark.hit');if(mk){mk.scrollIntoView({block:'center'});u.el.classList.add('flash');setTimeout(()=>u.el.classList.remove('flash'),1600);return}u.el.scrollIntoView({block:'center'});u.el.classList.add('flash');setTimeout(()=>u.el.classList.remove('flash'),1600)}
Q.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(search,180)});
Q.addEventListener('keydown',e=>{if(e.key==='Enter'&&RES.length)go(RES[0])});
R.addEventListener('click',e=>{const b=e.target.closest('.r');if(b)go(RES[+b.dataset.k])});
document.addEventListener('keydown',e=>{if(e.key==='Escape')R.hidden=true});
document.addEventListener('click',e=>{if(!R.hidden&&!R.contains(e.target)&&e.target!==Q)R.hidden=true});
