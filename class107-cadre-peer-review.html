        .container{max-width:1600px;margin:0 auto;display:flex;gap:20px}
        .main-content{flex:1;min-width:0}
        .sidebar{width:280px;background:white;border-radius:12px;padding:20px;max-height:90vh;overflow-y:auto;position:sticky;top:20px}
        
        .page{display:none}.page.active{display:block}
        
        .home-page{background:white;border-radius:15px;padding:40px;text-align:center}
        .home-page h1{color:#667eea;margin-bottom:10px;font-size:32px}
        .home-page p{color:#999;margin-bottom:20px;font-size:14px}
        
        .period-selector{background:#f0f4ff;border-radius:12px;padding:20px;margin:20px 0}
        .period-selector h3{color:#667eea;margin-bottom:15px;font-size:16px}
        .period-tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:15px}
        .period-tab{padding:10px 20px;background:#ddd;border:none;border-radius:8px;cursor:pointer;font-weight:bold;transition:all 0.3s;font-size:13px}
        .period-tab.active{background:#667eea;color:white}
        
        .period-inputs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:15px;align-items:center}

        .period-badge{background:#667eea;color:white;padding:8px 15px;border-radius:20px;font-size:12px;font-weight:bold;display:inline-block;margin-top:10px}
        
        .officer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin:30px 0}
        .officer-card{background:#f8f9fa;border:2px solid #e0e0e0;border-radius:12px;padding:20px;cursor:pointer;text-align:center;transition:all 0.3s}
        .officer-card:hover{border-color:#667eea;background:#f0f4ff;transform:translateY(-5px)}
        .officer-card .role{font-weight:bold;color:#667eea;margin-bottom:8px;font-size:12px}
        .officer-card .name{font-size:16px;font-weight:bold;margin-bottom:8px}
        .officer-card .nodes{font-size:11px;color:#999}
        
        .eval-page{background:white;border-radius:15px;padding:30px}

        .header h2{color:#667eea;flex:1;font-size:24px}
        .header-info{font-size:12px;color:#999}
        .back-btn{padding:10px 20px;background:#ddd;border:none;border-radius:5px;cursor:pointer;font-weight:bold;font-size:13px}
        
        .node-definition{background:#f0f4ff;border-left:4px solid #667eea;padding:20px;border-radius:8px;margin:20px 0;display:none}
        .node-definition.show{display:block}
        .node-definition h3{color:#667eea;margin-bottom:10px;font-size:16px}
        .node-definition .definition{margin-bottom:12px;font-size:14px;line-height:1.6}
        .standard-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:12px}
        .standard-item:last-child{border:none}
        
        .node-selector{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin:20px 0}
        .node-btn{padding:10px;background:#f0f0f0;border:2px solid #ddd;border-radius:8px;cursor:pointer;font-weight:bold;transition:all 0.3s;font-size:12px}
        .node-btn.active{background:#667eea;color:white;border-color:#667eea}
        
        .table-wrapper{overflow-x:auto;margin:20px 0}
        table{width:100%;border-collapse:collapse;font-size:12px}
        th{background:#667eea;color:white;padding:10px;text-align:left;font-weight:bold}
        td{padding:8px;border:1px solid #e0e6ed}
        tr:nth-child(even){background:#f9f9f9}
        
        input[type="number"]{width:70px;padding:6px;border:1px solid #ddd;border-radius:4px;text-align:center;font-size:12px}
        
        .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:15px 0}
        .stat-card{background:white;padding:12px;border-radius:8px;border:1px solid #e0e0e0}
        .stat-card .label{font-weight:bold;font-size:12px;color:#333}
        .stat-card .value{font-size:22px;font-weight:bold;color:#667eea;margin:6px 0}
        
        .total-stats{background:#f0f4ff;border-radius:12px;padding:20px;margin:20px 0}
        .total-stats h3{color:#667eea;margin-bottom:15px;font-size:16px}
        
        .data-management{background:#fff3e0;border-radius:12px;padding:20px;margin:20px 0}
        .data-management h3{color:#e67e22;margin-bottom:15px;font-size:16px}
        
        .period-item{background:white;border-radius:8px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
        .period-info{flex:1;font-size:12px}
        .period-actions{display:flex;gap:8px}
        .delete-btn{padding:6px 12px;background:#d32f2f;color:white;border:none;border-radius:5px;cursor:pointer;font-weight:bold;font-size:11px}
        .export-btn{padding:6px 12px;background:#3c3;color:white;border:none;border-radius:5px;cursor:pointer;font-weight:bold;font-size:11px}
        
        .sidebar h3{color:#667eea;font-size:14px;margin-bottom:12px;border-bottom:2px solid #667eea;padding-bottom:8px}
        .week-section{margin-bottom:15px}
        .week-title{font-weight:bold;color:#667eea;margin-bottom:6px;font-size:11px;padding:3px 0}
        .node-link{padding:8px;background:#f5f5f5;border-radius:6px;cursor:pointer;font-size:11px;margin-bottom:4px;transition:all 0.3s;border-left:3px solid transparent}
        .node-link:hover{background:#e8eaf6;border-left-color:#667eea;color:#667eea}
        .node-link.active{background:#667eea;color:white}
        .sidebar-item{padding:8px;background:#f5f5f5;border-radius:6px;cursor:pointer;font-size:12px;margin-bottom:6px;transition:all 0.3s;border-left:3px solid transparent}
        .sidebar-item:hover{background:#e8eaf6;border-left-color:#667eea;color:#667eea}
        .sidebar-item.active{background:#667eea;color:white}
        
        .warning-box{background:#ffebee;border-left:4px solid #d32f2f;padding:12px;border-radius:8px;margin:12px 0;color:#c62828;font-size:12px}
        
        .progress-bar{height:18px;background:#e0e0e0;border-radius:10px;overflow:hidden;margin-top:6px}
        .progress-fill{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);transition:width 0.3s}
        
        .button-group{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
        .save-btn{padding:12px 25px;background:#3c3;color:white;border:none;border-radius:5px;cursor:pointer;font-weight:bold;font-size:14px}
        .menu-btn{padding:12px 25px;background:#667eea;color:white;border:none;border-radius:5px;cursor:pointer;font-weight:bold;font-size:14px}
        
        @media(max-width:1200px){.container{flex-direction:column}.sidebar{width:100%;position:static}}
    </style>
</head>

            updatePeriod();
            alert(`✅ 已切換到 ${getPeriodLabel()} 評比周期`);
            initHome();
            loadPeriodList();
        }
        
        function loadPeriodList(){
            let html='';
            let allPeriods=new Set();
            for(let k of Object.keys(localStorage)){
                if(k.startsWith('rating_')){
                    let parts=k.split('_');
                    if(parts.length>=2) allPeriods.add(parts[1]);
                }
            }
            let sortedPeriods=[...allPeriods].sort().reverse();
            sortedPeriods.forEach(p=>{
                let isActive=p===currentPeriod;
                let label=p.includes('-')?(()=>{
                    let [y,per]=p.split('-');
                    return `${y}-${per}`;
                })():'未知';
                html+=`<div class="sidebar-item ${isActive?'active':''}" onclick="switchPeriod('${p}')" style="margin-bottom:4px">${label}</div>`;
            });
            document.getElementById('periodList').innerHTML=html||'<p style="color:#999;font-size:11px">尚無評比數據</p>';
        }
        
        function switchPeriod(period){
            currentPeriod=period;
            loadPeriodList();
            document.getElementById('currentPeriodBadge').textContent=getPeriodLabel();
            goPage('homePage');
            initHome();
        }
        
        function initSidebar(){
            let html='<div class="week-section"><div class="week-title">第1週 自律週</div>';
            [1,2,3,4,5,23].forEach(n=>{
                html+=`<div class="node-link" onclick="showNodeDesc(${n})">#${n} ${nodeDefinitions[n].name}</div>`;
            });
            html+='</div><div class="week-section"><div class="week-title">第2週 學習週</div>';
            [6,7,8,9,10,11,12,13,14].forEach(n=>{
                html+=`<div class="node-link" onclick="showNodeDesc(${n})">#${n} ${nodeDefinitions[n].name}</div>`;
            });
            html+='</div><div class="week-section"><div class="week-title">第3週 合作週</div>';
            [15,16,17,18,19,20,28].forEach(n=>{
                html+=`<div class="node-link" onclick="showNodeDesc(${n})">#${n} ${nodeDefinitions[n].name}</div>`;
            });
            html+='</div><div class="week-section"><div class="week-title">第4週Agency週</div>';
            [21,22,24,25,27,29,30].forEach(n=>{
                html+=`<div class="node-link" onclick="showNodeDesc(${n})">#${n} ${nodeDefinitions[n].name}</div>`;
            });
            html+='</div>';
            document.getElementById('sidebarMenu').innerHTML=html;
        }
        
        function showNodeDesc(n){
            document.querySelectorAll('.node-link').forEach(l=>l.classList.remove('active'));
            event.target.closest('.node-link')?.classList.add('active');
            const def=nodeDefinitions[n];
            let standard=['⭐ 提醒後仍未完成','⭐⭐ 需多次提醒','⭐⭐⭐ 提醒一次後完成','⭐⭐⭐⭐ 不用提醒自己完成','⭐⭐⭐⭐⭐ 不用提醒還能幫助別人'];
            alert(`📌 節點 #${n}: ${def.name}\n\n📝 定義：${def.def}\n\n📊 評分標準：\n${standard.join('\n')}`);
        }
        
        function initHome(){
            let html='';
            officers.forEach(o=>{
                html+=`<div class="officer-card" onclick="selectOfficer(${o.id})"><div class="role">${o.role}</div><div class="name">${o.name}</div><div class="nodes">座號${o.seat}</div></div>`;
            });
            document.getElementById('officerGrid').innerHTML=html;
        }
        
        function selectOfficer(id){
            currentOfficer=officers.find(o=>o.id===id);
            currentNode=currentOfficer.nodes[0];
            renderEvalPage();
            goPage('evalPage');
        }
        
        function renderEvalPage(){
            document.getElementById('officerTitle').textContent=`${currentOfficer.role} - ${currentOfficer.name}`;
            document.getElementById('officerPeriod').textContent=`周期：${getPeriodLabel()}`;
            document.getElementById('officerNodes').textContent=`負責節點：#${currentOfficer.nodes.join(', #')}`;
            
            let nodeHtml='';
            currentOfficer.nodes.forEach(n=>{
                nodeHtml+=`<button class="node-btn ${n===currentNode?'active':''}" onclick="selectNode(${n})">#${n}</button>`;
            });
            document.getElementById('nodeSelector').innerHTML=nodeHtml;
            showNodeDefinition();
            renderEvalTable();
        }
        
        function selectNode(n){
            currentNode=n;
            document.querySelectorAll('.node-btn').forEach(b=>b.classList.remove('active'));
            event.target.closest('.node-btn')?.classList.add('active');
            showNodeDefinition();
            renderEvalTable();
        }
        
        function showNodeDefinition(){
            const def=nodeDefinitions[currentNode];
            const box=document.getElementById('nodeDefinitionBox');
            let standard=['⭐提醒後仍未完成','⭐⭐需多次提醒','⭐⭐⭐提醒一次後完成','⭐⭐⭐⭐不用提醒自己完成','⭐⭐⭐⭐⭐不用提醒還能幫助別人'];
            let html=`<h3>節點 #${currentNode}: ${def.name}</h3><div style="margin-bottom:12px;font-size:13px"><strong>定義：</strong> ${def.def}</div><div><h4 style="margin-bottom:8px;font-size:12px">評分標準：</h4>`;
            standard.forEach(s=>{
                html+=`<div class="standard-item"><span style="color:#667eea;font-weight:bold;width:80px">${s.split(' ')[0]}</span><span>${s.substring(s.indexOf(' ')+1)}</span></div>`;
            });
            html+='</div>';
            box.innerHTML=html;
            box.classList.add('show');
        }
        
        function renderEvalTable(){
            let head=`<tr><th>座號</th><th>學號</th><th>姓名</th><th>評分</th></tr>`;
            document.getElementById('tableHead').innerHTML=head;
            
            let body='';
            students.forEach(s=>{
                let key=`rating_${currentPeriod}_o${currentOfficer.id}_n${currentNode}_s${s.座號}`;
                let val=localStorage.getItem(key)||'';
                body+=`<tr><td>${s.座號}</td><td>${s.學號}</td><td>${s.姓名}</td><td><input type="number" id="${key}" min="1" max="5" value="${val}"></td></tr>`;
            });
            document.getElementById('evalTable').innerHTML=body;
        }
        
        function saveRatings(){
            students.forEach(s=>{
                let key=`rating_${currentPeriod}_o${currentOfficer.id}_n${currentNode}_s${s.座號}`;
                let val=document.getElementById(key).value;
                if(val) localStorage.setItem(key,val);
            });
            alert('✅ 已保存！');
        }
        
        function goPage(p){
            document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
            document.getElementById(p).classList.add('active');
            if(p==='summaryPage') showSummary();
            if(p==='dataPage') showDataManagement();
        }
        
        function showSummary(){
            document.getElementById('summaryTitle').textContent=getPeriodLabel();
            
            let totalEvals=0,totalScore=0;
            for(let k of Object.keys(localStorage)){
                if(k.startsWith(`rating_${currentPeriod}_`)){
                    let v=parseInt(localStorage.getItem(k));
                    if(!isNaN(v)){totalScore+=v;totalEvals++;}
                }
            }
            let avgScore=totalEvals>0?(totalScore/totalEvals).toFixed(2):'-';
            
            document.getElementById('periodStats').innerHTML=`
                <div class="stat-card"><div class="label">評比次數</div><div class="value">${totalEvals}</div></div>
                <div class="stat-card"><div class="label">平均評分</div><div class="value">${avgScore}</div></div>
                <div class="stat-card"><div class="label">完成比例</div><div class="value">${totalEvals>0?Math.round((totalEvals/(officers.length*students.length*30))*100)+'%':'-'}</div></div>
            `;
            
            let studentHtml='';
            students.forEach(s=>{
                let scores=[],count=0;
                officers.forEach(o=>{
                    o.nodes.forEach(n=>{
                        let key=`rating_${currentPeriod}_o${o.id}_n${n}_s${s.座號}`;
                        let val=localStorage.getItem(key);
                        if(val){scores.push(parseInt(val));count++;}
                    });
                });
                let avg=scores.length>0?(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(2):'-';
                let percent=Math.round((count/(officers.length*30))*100);
                studentHtml+=`<tr><td>${s.座號}</td><td>${s.姓名}</td><td style="font-weight:bold;color:#667eea">${avg}</td><td>${count}</td><td><div class="progress-bar" style="width:100px"><div class="progress-fill" style="width:${percent}%"></div></div></td></tr>`;
            });
            document.getElementById('studentStats').innerHTML=studentHtml;
            
            let officerHtml='';
            officers.forEach(o=>{
                let total=o.nodes.length*students.length,count=0;
                o.nodes.forEach(n=>{
                    students.forEach(s=>{
                        let key=`rating_${currentPeriod}_o${o.id}_n${n}_s${s.座號}`;
                        if(localStorage.getItem(key)) count++;
                    });
                });
                let percent=Math.round((count/total)*100);
                officerHtml+=`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px"><span style="font-weight:bold">${o.role} ${o.name}</span><span style="color:#667eea;font-weight:bold">${percent}%</span></div><div class="progress-bar"><div class="progress-fill" style="width:${percent}%"></div></div></div>`;
            });
            document.getElementById('officerStats').innerHTML=officerHtml;
        }
        
        function showDataManagement(){
            let html='';
            let allPeriods=new Set();
            for(let k of Object.keys(localStorage)){
                if(k.startsWith('rating_')){
                    let parts=k.split('_');
                    if(parts.length>=2) allPeriods.add(parts[1]);
                }
            }
            let sortedPeriods=[...allPeriods].sort().reverse();
            
            sortedPeriods.forEach(p=>{
                let [y,per]=p.split('-');
                let label=`${y}年${per}月`;
                let count=0;
                for(let k of Object.keys(localStorage)){
                    if(k.startsWith(`rating_${p}_`)) count++;
                }
                
                html+=`<div class="period-item">
                    <div class="period-info">
                        <div style="font-weight:bold;margin-bottom:4px">${label}</div>
                        <div style="font-size:11px;color:#999">共${count}筆評比</div>
                    </div>
                    <div class="period-actions">
                        <button class="export-btn" onclick="exportPeriodData('${p}')">📥 導出</button>
                        <button class="delete-btn" onclick="deletePeriodData('${p}')">🗑️ 刪除</button>
                    </div>
                </div>`;
            });
            
            document.getElementById('periodDataList').innerHTML=html||'<p style="color:#999;font-size:12px">尚無評比數據</p>';
        }
        
        function deletePeriodData(period){
            if(!confirm(`確定要刪除 ${period} 的所有評比數據嗎？`)) return;
            for(let k of Object.keys(localStorage)){
                if(k.startsWith(`rating_${period}_`)) localStorage.removeItem(k);
            }
            alert('✅ 已刪除');
            showDataManagement();
            loadPeriodList();
        }
        
        function exportPeriodData(period){
            let csv='座號,學號,姓名,股長編號,節點編號,評分\n';
            for(let k of Object.keys(localStorage)){
                if(k.startsWith(`rating_${period}_`)){
                    let parts=k.split('_');
                    if(parts.length>=6){
                        let oId=parts[3].substring(1);
                        let nId=parts[4].substring(1);
                        let sId=parts[5].substring(1);
                        let student=students.find(st=>st.座號==sId);
                        let val=localStorage.getItem(k);
                        if(student) csv+=`${student.座號},${student.學號},${student.姓名},${oId},${nId},${val}\n`;
                    }
                }
            }
            let blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
            let link=document.createElement('a');
            link.href=URL.createObjectURL(blob);
            link.download=`班級107評比_${period}.csv`;
            link.click();
        }
        
        function exportAllData(){
            let csv='周期,座號,學號,姓名,股長編號,節點編號,評分\n';
            for(let k of Object.keys(localStorage)){
                if(k.startsWith('rating_')){
                    let parts=k.split('_');
                    if(parts.length>=6){
                        let period=`${parts[1]}_${parts[2]}`;
                        let oId=parts[3].substring(1);
                        let nId=parts[4].substring(1);
                        let sId=parts[5].substring(1);
                        let student=students.find(st=>st.座號==sId);
                        let val=localStorage.getItem(k);
                        if(student) csv+=`${period},${student.座號},${student.學號},${student.姓名},${oId},${nId},${val}\n`;
                    }
                }
            }
            let blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
            let link=document.createElement('a');
            link.href=URL.createObjectURL(blob);
            link.download=`班級107評比_全部.csv`;
            link.click();
        }
        
        function clearAllData(){
            if(!confirm('確定要刪除所有評比數據嗎？')) return;
            if(!confirm('再次確認：真的要刪除嗎？')) return;
            for(let k of Object.keys(localStorage)){
                if(k.startsWith('rating_')) localStorage.removeItem(k);
            }
            alert('✅ 已清空所有數據');
            loadPeriodList();
            initHome();
        }
        
        initHome();
        initSidebar();
        loadPeriodList();
    </script>
</body>
</html>
