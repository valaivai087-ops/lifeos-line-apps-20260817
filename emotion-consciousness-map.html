<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>情緒意識地圖資料庫</title>
<style>
:root{--bg:#f6f5f1;--panel:#ffffff;--ink:#1f2328;--muted:#6a6f78;--line:#e3e1db;--accent:#1f5fbf;--accent-soft:#e8f0fc;--mark:#ffe58a;--side:#fbfaf7;--fs:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181c;--panel:#1f2227;--ink:#e6e6e3;--muted:#9aa0a8;--line:#2e3238;--accent:#7fb0ff;--accent-soft:#22324a;--mark:#7a6420;--side:#1a1c20}}
:root[data-theme="dark"]{--bg:#16181c;--panel:#1f2227;--ink:#e6e6e3;--muted:#9aa0a8;--line:#2e3238;--accent:#7fb0ff;--accent-soft:#22324a;--mark:#7a6420;--side:#1a1c20}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;font-size:var(--fs);line-height:1.75}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;white-space:nowrap}
#q{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--bg);color:var(--ink)}
#q:focus{outline:2px solid var(--accent);border-color:transparent}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--accent)}
#menuBtn{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.chip{font-size:13px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.chip:hover,.chip.on{background:var(--accent-soft);border-color:var(--accent)}
.wrap{display:flex;max-width:1280px;margin:0 auto}
nav{width:270px;flex:none;border-right:1px solid var(--line);background:var(--side);height:calc(100vh - 110px);position:sticky;top:110px;overflow:auto;padding:10px 0}
nav .g{font-size:12px;color:var(--muted);padding:10px 16px 4px;letter-spacing:.05em}
nav a{display:block;padding:6px 16px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.45;border-left:3px solid transparent}
nav a:hover{background:var(--accent-soft)}
nav a.on{border-left-color:var(--accent);background:var(--accent-soft);font-weight:600}
main{flex:1;min-width:0;padding:18px 24px 80px}
.mtitle{font-size:24px;margin:4px 0 4px}
.mmeta{color:var(--muted);font-size:13px;margin-bottom:14px}
details.sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:0 16px}
details.sec>summary{cursor:pointer;font-weight:700;padding:11px 0;list-style:none;color:var(--accent)}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸ ";color:var(--muted)}
details.sec[open]>summary::before{content:"▾ "}
.sec .body{padding:0 0 12px}
.ln{margin:3px 0;padding:1px 6px;border-radius:6px}
.ln.item{font-weight:700;margin-top:12px}
.ln .lb{font-weight:600;color:var(--muted)}
.ln.flash{animation:fl 2s}
@keyframes fl{0%,40%{background:var(--mark)}100%{background:transparent}}
.intro{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:10px 0}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.res-mod{margin:18px 0 6px;font-weight:700;font-size:17px}
.res{display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0;cursor:pointer;color:var(--ink);text-decoration:none}
.res:hover{border-color:var(--accent)}
.res small{display:block;color:var(--muted);font-size:12px}
.count{color:var(--muted);font-size:14px}
/* 原圖階梯 */
.ladder{display:grid;grid-template-columns:110px 90px 1fr;gap:5px;max-width:820px}
.ladder .h{font-weight:700;text-align:center;background:var(--accent-soft);border-radius:8px;padding:4px}
.ladder .c{border-radius:8px;padding:6px 10px;font-weight:700;text-align:center;color:#fff;cursor:pointer}
.ladder .d{border-radius:8px;padding:6px 12px;color:#1f2328;cursor:pointer}
.ladder .gap{grid-column:1/-1;font-size:13px;color:var(--muted);padding:6px 2px 0}
.note{margin-top:14px;padding:10px 14px;border-radius:10px;background:#fbefe0;color:#5a3b10;font-size:14px}
/* 臉書圖文 */
:root{--fb:#fff7ea;--fb-line:#f0d9b0;--fb-ink:#7a4a0c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fb:#2a2418;--fb-line:#4a3d22;--fb-ink:#f0c674}}
:root[data-theme="dark"]{--fb:#2a2418;--fb-line:#4a3d22;--fb-ink:#f0c674}
details.fbpost{background:var(--fb);border:1px solid var(--fb-line);border-radius:12px;margin:10px 0 16px;padding:0 18px}
details.fbpost>summary{cursor:pointer;font-weight:700;padding:11px 0;color:var(--fb-ink);list-style:none}
details.fbpost>summary::-webkit-details-marker{display:none}
details.fbpost>summary::before{content:"▸ "}
details.fbpost[open]>summary::before{content:"▾ "}
.fbbody{padding:2px 0 8px;font-size:1.02em;line-height:1.9}
.fbbody p{margin:0 0 2px}
.fbbody p.lead{font-weight:700;font-size:1.12em;margin-bottom:8px}
.fbcard{margin:14px 0 4px;padding:10px 14px;border-left:4px solid var(--fb-ink);background:var(--fb);border-radius:0 10px 10px 0}
.fbcard .tag{font-size:12px;color:var(--fb-ink);font-weight:700;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fbcard p{margin:1px 0}
.fbcard p:first-of-type{font-weight:700}
.fbcard p:last-of-type{font-style:italic}
.copy{font-size:12px;padding:3px 9px}
.fbactions{display:flex;gap:8px;padding:0 0 12px}
body.nofb .fbpost,body.nofb .fbcard{display:none}
#fbBtn.on{background:var(--fb);border-color:var(--fb-ink);color:var(--fb-ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2328;color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
@media (max-width:820px){
 #menuBtn{display:inline-block}
 nav{position:fixed;left:0;top:0;height:100vh;z-index:30;transform:translateX(-100%);transition:.2s;box-shadow:0 0 20px rgba(0,0,0,.2);background:var(--side)}
 nav.open{transform:none}
 main{padding:14px 16px 80px}
 .ladder{grid-template-columns:72px 62px 1fr;font-size:14px}
 header h1{font-size:16px}
}
</style>

<script type="text/plain" class="mod" data-id="chart" data-title="情緒與意識地圖・圖解" data-group="基礎｜原圖與圖解">
這張圖把羞愧、恐懼、勇氣、愛與平和等狀態，排成由下往上的階梯。
它採用大衛・霍金斯「意識地圖」的分級架構，數字來自作者的肌肉測試校準主張。
圖上的20、200、500等數字，不是儀器量到的情緒頻率，不能當成赫茲、健康分數或人的價值。
可以把它當成認識感受的提示表，使用時不必替自己或別人打分數。
【本體層｜情緒是在告訴你什麼？】
情緒可以提醒你：有些事情需要理解、保護、調整或處理。
生氣時可以設界線，害怕時可以查資訊，悲傷時可以尋求陪伴。
同一個人，一天內可能經過很多種狀態。
不能因為一個人正在難過，就認定他的生命比較低等。
【結構層｜原圖的十七個分類】
以下數字只代表原圖標示。
20｜羞愧：覺得「我整個人都不好」。
30｜內疚：覺得「我做錯了一件事」。
50｜冷淡：感到無力，覺得做什麼都沒用。
75｜悲傷：面對失去，感到難過。
100｜恐懼：擔心危險、失敗或被拒絕。
125｜慾望：很想得到某個東西或結果。
150｜憤怒：覺得受到阻擋、不公平或侵犯。
175｜驕傲：重視自己的表現，也可能不容易接受糾正。
200｜勇氣：即使害怕，仍願意面對。
250｜淡定：比較能容許事情不完全照自己的意思發展。
310｜主動：願意參與、嘗試與學習。
350｜寬容：願意理解差異，調整看法。
400｜明智：運用資訊與推理處理問題。
500｜愛：關心自己與他人的需要。
540｜喜悅：感受到欣喜與滿足。
600｜平和：感到安定，減少內在拉扯。
700～1000｜開悟：作者體系中的靈性分類。
這些狀態不必照順序出現，也不是每個人必須爬完的固定階梯。
【機制層｜真正值得觀察的循環】
情境→解讀→感受→行動→結果→更新。
例如：朋友沒回訊息。
解讀一：「她討厭我」。
感受：害怕、難過。
行動：連續質問，或直接封鎖。
可能結果：原本不清楚的事情，變成新的衝突。
解讀二：「我還不知道原因」。
感受：仍有不安，但保留其他可能。
行動：等一段時間，必要時再確認。
更新：知道對方正在忙，就修正原本的猜測。
關鍵在於：你的想法能不能被新資訊修正。
【生活例子①｜羞愧與內疚】
情境：忘記交作業。
羞愧式解讀：「我很爛，什麼都做不好。」
內疚式解讀：「我漏交這份作業，需要補救。」
可練習的轉換：把對整個人的否定，改成對具體行為的處理。
最小行動：確認補交時間，完成後調整提醒方式。
【生活例子②｜恐懼與勇氣】
情境：明天要上台報告。
恐懼式預測：「我一定會忘詞，大家一定會笑。」
勇氣的做法：帶著緊張，先準備能完成的一小段。
最小行動：練習開頭三句，再請一個人聽。
勇氣可以和恐懼同時存在。
【生活例子③｜憤怒與界線】
情境：同學擅自拿走你的東西。
憤怒提醒你：有一條界線被跨過。
可練習的做法：把情緒變成明確要求。
最小行動：「請還給我，下次借之前先問我。」
若持續發生，就尋求老師協助。
【生活例子④｜驕傲與學習】
情境：考得很好，開始覺得不必訂正。
問題在於：好成績讓你關閉了檢查入口。
可練習的做法：保留成就感，也檢查漏掉的部分。
最小行動：找出一題答對卻說不清理由的題目。
【生活例子⑤｜寬容與責任】
情境：朋友遲到。
寬容的做法：先了解原因，再談影響。
最小行動：「我等了三十分鐘，下次會遲到請先通知。」
理解對方的處境，仍可以要求守約。
【生活例子⑥｜愛與付出】
情境：家人請你幫忙，但你今天很累。
可練習的做法：同時看見對方的需要與自己的容量。
最小行動：「我今天能幫二十分鐘，其餘需要另外安排。」
關心可以透過清楚而可持續的協助表達。
【行動層｜把分數表改成更新表】
①我現在感到什麼？
②剛剛發生了什麼具體事情？
③哪些是看見的事實，哪些是我的猜測？
④我需要資訊、休息、界線，還是協助？
⑤現在能做的最小一步是什麼？
⑥結果和原本想的一樣嗎？
⑦下次要調整哪個判斷或做法？
用在課堂：請學生說情境、感受與下一步，避免互評誰的「能量比較低」。
用在家庭：描述具體行為與需求，避免用「低頻」替家人貼標籤。
用在自己：追蹤選擇是否增加、問題是否更清楚、方法是否能更新。
成長可以觀察為：預測更準確，發現誤差更快，修正行動更有效。
【圖表文字轉錄】
高頻能量｜內外和諧
700－1000｜開悟｜合一、無我
600｜平和｜完美、平和、安詳
540｜喜悅｜樂觀、慈悲、非常有耐性
500｜愛｜關注生活中美好、幸福
400｜明智｜智慧、創造者
350｜寬容｜了解事物沒有對錯
310｜主動｜真誠、友善、敞開、成長
250｜淡定｜信任、活力、安全感
200｜勇氣｜把握機會
低頻能量｜短暫的能量・向外攻擊
175｜驕傲｜自我膨脹、抵制成長、狂妄
150｜憤怒｜憎恨、侵蝕心靈、抱怨
125｜慾望｜上癮、貪婪
內在消耗・低能量
100｜恐懼｜壓抑、焦慮、退縮、阻礙成長
75｜悲傷｜失落、依賴、悲觀
50｜冷淡｜絕望、自我放棄
30｜內疚｜懊惱、自責、自我否定
20｜羞愧｜接近死亡、自我封閉、嚴重影響身心健康
以上依圖表原文轉錄，僅補上分隔標點。
圖中的數字與健康描述屬原圖主張，不代表客觀測量或醫療判定。
</script>
<script type="text/plain" class="mod" data-id="tenrealms" data-title="情緒意識圖 × 佛教十界" data-group="宗教・靈性・經典">
可以做概念對照，但兩者沒有固定換算關係。
以下採天台、法華思想常談的十界：地獄、餓鬼、畜生、修羅、人、天、聲聞、緣覺、菩薩、佛。
【本體層｜兩者看的是什麼？】
情緒圖主要排列感受、態度與靈性狀態。
十界涉及生命的存在方式與修行境界，也可以借來觀察日常心境。
所以「感覺平靜」不能直接等於佛界，「正在悲傷」也不能直接等於地獄界。
【結構層｜十界不是固定的人格標籤】
「十界互具」提醒我們：每一界都具有其他九界的可能。
生活中，一個人可能剛才憤怒，下一刻開始理解，接著採取幫助別人的行動。
觀察重點是當下如何理解、如何行動，以及能否轉變。
以下是方便理解的生活化對照，不是經典原有的情緒分級表。
【機制層｜十界逐一對應】
①地獄界｜被痛苦困住。
圖中可聯想：羞愧、內疚、冷淡、悲傷、恐懼。
生活例子：考差後認定「我整個人都沒有用」，看不見其他可能。
轉變入口：先獲得支持，再把整體否定拆成具體問題。
提醒：難過本身不能用來判定一個人的境界。
②餓鬼界｜總覺得還不夠。
圖中可聯想：慾望。
生活例子：貼文已經很多人按讚，仍不斷刷新，覺得少一個讚就少一分價值。
轉變入口：辨認自己真正需要的是收入、認同、陪伴，還是安全感。
③畜生界｜借喻只跟著眼前衝動走。
圖中沒有直接對應項目。
生活例子：明知明天要考試，仍一支接一支滑影片，暫時不看後果。
轉變入口：改變環境，例如先把手機放遠，再完成第一題。
提醒：這是對行為模式的比喻，不適合拿來辱罵別人。
④修羅界｜被比較與輸贏牽動。
圖中可聯想：憤怒、驕傲、慾望。
生活例子：同學受到稱讚，自己立刻想證明「我比他強」。
轉變入口：把別人的優點轉成學習資訊，再回到自己的目標。
⑤人界｜能思考、協調與承擔責任。
圖中可聯想：勇氣、淡定、主動、明智。
生活例子：小組發生衝突，先確認分工，再討論怎麼補救。
轉變入口：保留感受，也檢查事實、責任與後果。
⑥天界｜享受喜悅與安適。
圖中可聯想：喜悅、平和。
生活例子：旅行很開心，希望假期永遠不要結束。
轉變入口：享受當下，也接受舒服的狀態會改變。
提醒：快樂與安適，並不直接等於覺悟。
⑦聲聞界｜透過聽聞教法而修行。
圖中可聯想：主動、寬容、明智，但沒有直接對應。
生活比喻：聽懂老師的方法後，實際練習並調整習慣。
轉變入口：把聽到的道理放進生活檢驗。
提醒：聲聞的佛教意義涉及聞法與解脫，不能簡化為一般愛學習。
⑧緣覺界｜觀察因緣而覺悟。
圖中可聯想：明智、平和，但沒有直接對應。
生活比喻：發現自己常在疲累、誤解與時間壓力一起出現時發怒。
轉變入口：觀察條件如何相互作用，調整其中可改變的部分。
提醒：看懂生活模式，只是幫助理解的比喻，不等於已證得緣覺。
⑨菩薩界｜在智慧與慈悲中實踐利他。
圖中可聯想：愛、寬容、主動、明智。
生活例子：幫同學理解解題方法，也讓他自己練習，逐步具備能力。
轉變入口：同時考慮對方需要、長期影響與自己的承擔能力。
提醒：討好、犧牲到耗盡自己，不能直接當成菩薩行。
⑩佛界｜覺悟與智慧慈悲的圓滿。
圖中名稱最接近：開悟。
生活比喻：面對衝突時，不急著被舊習慣帶走，能看清情境並回應。
提醒：這只是在比喻回應方向，不能憑一次平靜或一個分數認定成佛。
【行動層｜用十界觀察自己】
第一問：我現在被什麼牽動？
第二問：我是在逃避痛苦、追逐滿足，還是爭取輸贏？
第三問：有哪些條件讓這個反應反覆出現？
第四問：我能增加哪個選項？
第五問：這個行動能否幫助自己與他人增加能力？
第六問：結果與預期有何差異，下次如何調整？
【對應高中課堂的例子】
情境：同學英文考得比我好。
地獄式心境：「我什麼都不行。」
餓鬼式心境：「我一定要得到更多稱讚才夠。」
修羅式心境：「我一定要贏過他。」
人界式回應：「我先看自己錯在哪裡。」
學習的回應：「我請教他的準備方法，再測試是否適合我。」
利他的回應：「我們各自整理擅長的部分，一起練習。」
這些是心境與行動的教學比喻，不是替學生判定宗教境界。
最值得保留的是：狀態可以轉變，方法可以更新，人在當下仍能增加新的選擇。
</script>
<script type="text/plain" class="mod" data-id="soul" data-title="情緒意識圖 × 靈魂結構" data-group="結構模型・生命更新">
可以把這張圖當成觀察「內在如何運作」的入口。
這裡的「靈魂結構」，指一個人理解自己、解讀世界、選擇行動與更新自己的方式。
這是一個探索模型，圖上的數字無法測出靈魂的高低。
【本體層｜感受與結構有什麼不同？】
情緒像天氣，結構像地形與排水系統。
同樣下大雨，有的地方能排水，有的地方會一直淹水。
同樣受到批評，有人能確認問題、修正做法，有人會長期陷入自責或報復。
因此，觀察靈魂結構，要看情緒出現後，資訊如何進來、如何被解讀，以及下一步如何形成。
【結構層｜七個觀察面向】
①自我結構：我如何理解自己的價值？
②預測結構：我預期別人與世界會怎麼對待我？
③價值結構：我把什麼放在最重要的位置？
④關係結構：我如何處理依賴、合作與界線？
⑤注意結構：我的注意力反覆停在哪裡？
⑥行動結構：遇到困難，我有哪些可用做法？
⑦更新結構：新證據出現時，我能修改什麼？
【機制層｜圖中十七種狀態的結構對應】
①羞愧｜自我價值被整體否定。
內在語句：「我整個人都不好。」
結構特徵：一次失敗，被擴大成對整個自己的判決。
生活例子：被老師糾正，就覺得自己不值得被喜歡。
更新入口：把「我是怎樣的人」改成「這次哪個做法需要調整」。
②內疚｜責任與修復的結構。
內在語句：「我做錯了，需要補救。」
結構特徵：能辨認責任時，有機會走向修復；責任無限擴大時，容易持續自責。
生活例子：家人不高興，就認為全部都是自己的錯。
更新入口：分清自己的行為、對方的選擇與共同責任。
③冷淡｜可用行動變得很少。
內在語句：「做什麼都沒有用。」
結構特徵：目前的理解中，很難看見行動與結果之間的連結。
生活例子：多次讀不懂，就不再打開課本。
更新入口：增加支持，把任務縮小到能完成、能看見結果的一步。
④悲傷｜重要連結發生改變。
內在語句：「我失去了很重要的東西。」
結構特徵：原本依靠的人、角色或未來想像，需要重新安排。
生活例子：朋友疏遠後，不知道午餐該和誰一起吃。
更新入口：容許難過，逐步建立新的生活支點。
⑤恐懼｜威脅預測占據注意力。
內在語句：「接下來可能會出事。」
結構特徵：注意力集中在危險，其他可能性較難進入。
生活例子：一次被嘲笑，就預期每次發言都會被笑。
更新入口：確認當下風險，透過安全的小嘗試取得新資訊。
⑥慾望｜滿足感集中在單一條件。
內在語句：「只要得到它，我就好了。」
結構特徵：幸福與價值，被綁在某個結果上。
生活例子：認為一定要有人喜歡自己，才能安心。
更新入口：辨認真正需要，增加不同的滿足與支持來源。
⑦憤怒｜界線與控制受到挑戰。
內在語句：「這不公平，不能這樣對我。」
結構特徵：可能正在保護重要需求，也可能用攻擊維持控制。
生活例子：家人臨時增加要求，自己立刻大吼。
更新入口：說清楚被侵犯的界線，選擇能執行的回應。
⑧驕傲｜自我價值依靠比較維持。
內在語句：「我不能輸，也不能被糾正。」
結構特徵：不同意見容易被解讀成地位威脅。
生活例子：別人指出錯誤，就急著證明自己沒有錯。
更新入口：讓「值得被尊重」與「每次都正確」分開。
⑨勇氣｜不確定中仍保留行動。
內在語句：「我害怕，但可以先做一步。」
結構特徵：能帶著不舒服，執行有意義的行動。
生活例子：不確定答案，仍舉手提出自己的理解。
更新入口：記錄嘗試結果，逐步增加可用能力。
⑩淡定｜容許結果有不同可能。
內在語句：「事情可以不完全照我的意思發展。」
結構特徵：目標與方法之間保留彈性。
生活例子：朋友今天沒空，就調整安排，不急著否定關係。
更新入口：分清哪些需要堅持，哪些可以改變。
⑪主動｜看見自己可以介入的地方。
內在語句：「目前我能做什麼？」
結構特徵：能把目標拆成可執行的步驟。
生活例子：課業跟不上，先找出一題，向老師請教。
更新入口：每次行動後檢查效果，避免只有忙碌、沒有學習。
⑫寬容｜能容納不同觀點。
內在語句：「我還可以了解他的處境。」
結構特徵：同一件事，容許存在多種解釋。
生活例子：同學沒完成分工，先了解原因，再討論補救。
更新入口：增加理解，同時保留責任與界線。
⑬明智｜能檢查資訊與推論。
內在語句：「有哪些證據？還漏了什麼？」
結構特徵：能區分事實、猜測、目標與後果。
生活例子：讀書方法沒效，先檢查錯誤類型，再調整練習。
更新入口：用實際結果校準判斷，也看見推理沒有納入的感受與需求。
⑭愛｜把自己與他人的需要一起考慮。
內在語句：「怎樣能讓彼此長期更好？」
結構特徵：關心的範圍擴大，也願意承擔具體行動。
生活例子：陪孩子整理讀書方法，同時讓孩子練習自己安排。
更新入口：檢查付出是否增加能力，以及是否能持續。
⑮喜悅｜能感受到生活中的美好。
內在語句：「這一刻有值得欣賞的事情。」
結構特徵：注意力有空間接收成就、連結與樂趣。
生活例子：今天只進步一點，仍能看見努力有了結果。
更新入口：保留欣賞，也容許難過時不必假裝開心。
⑯平和｜內在拉扯減少，選擇空間增加。
內在語句：「我能面對現況，再決定怎麼做。」
結構特徵：較能容納不同感受，不急著立即控制一切。
生活例子：家人不接受自己的安排，仍平靜說明界線並執行。
更新入口：確認平靜是否伴隨清楚行動，而非壓下需求。
⑰開悟｜作為鬆動固定自我的探索方向。
內在語句：「我對自己的故事，還有哪些可以重新理解？」
結構特徵：在這個模型中，指向較少被單一身分與舊解讀綁住。
生活例子：從「我永遠是被欺負的人」，逐步看見自己現在有求助、拒絕與離開的選項。
更新入口：持續檢查生活中的理解與行動，不能只憑特殊感受認定境界。
【行動層｜真正值得觀察的三件事】
①可更新性：遇到新證據，我能否修正原本想法？
②流動性：資訊、支持、感受與責任，能否被表達與協調？
③混亂是否累積：未處理的衝突、失約與模糊責任，是否持續增加？
這裡的「混亂」是生活觀察，不能直接等同物理熵。
【一個完整例子】
情境：女兒今天沒有回訊息。
舊預測：「她不需要我，也不在乎我。」
可能反應：委屈、憤怒、連續質問。
結構檢查：我是否把被需要，當成自己有價值的唯一證明？
新做法：先確認是否有急事，再留下一則清楚訊息。
取得回饋：知道她在上課或休息，再調整原本判斷。
真正的結構更新：逐步增加理解、支持來源與回應選項。
【每天三句練習】
我現在的感受是什麼？
這個感受背後，我正在相信什麼？
有什麼新資訊，能幫我決定下一步？
靈魂結構的成長，可以用更準確的理解、更有彈性的選擇，以及更能修正的行動來觀察。
</script>

<script type="text/plain" class="mod" data-id="gospel36" data-title="情緒意識圖 ×《福音36課》生命重建" data-group="宗教・靈性・經典">

最小行動：完成一件基本生活任務，再回報給陪伴者。
④悲傷｜把失落帶進禱告與陪伴。
對應第6課《與神對話》、第28課《我使你們得安息》。
舊反應：「我信神，就不應該這麼難過。」
重建方向：容許哀傷，誠實表達失去與需要。
生活例子：面對親人的病痛，可以流淚，也可以請人陪伴禱告。
最小行動：說出一句「我現在最難過的是……」。
⑤恐懼｜分清眼前事實與心中的預測。
對應第18課《禱告和應許》、第28課《我使你們得安息》。
舊反應：「只要想到壞結果，就覺得一定會發生。」

生活例子：擔心孩子考不好，先了解進度，再討論需要的協助。
最小行動：把「已知事實」與「尚未發生的擔心」分開寫。
⑥慾望｜重新整理心中最重要的事。
對應第9課《認識自己》、第35課《經濟醫治—活在神的豐富裡》。
舊反應：「有更多錢、更多讚美，我才安心。」
重建方向：辨認需要，也檢查金錢與認同是否支配選擇。
生活例子：為了增加收入，答應超過自己容量的工作。
最小行動：確認這個選擇是否符合信仰、責任與實際負荷。
⑦憤怒｜把情緒轉成負責任的表達。
對應第29課《攻破堅固的營壘》、第32課《人際醫治—在愛中聯絡合式》。
舊反應：「對方不改，我就一直罵。」
重建方向：辨認反覆出現的解讀與行為，練習清楚表達界線。
生活例子：家人臨時要求協助，先說明自己能做多少。
最小行動：「我可以協助這一部分，其餘需要另外安排。」
⑧驕傲｜讓真理與回饋進得來。
對應第9課《認識自己》、第26課《蒙召為基督的門徒》。
舊反應：「我比較懂，所以不需要被提醒。」
重建方向：願意學習、受教，也核對自己的理解。
生活例子：孩子指出自己說話太重，先聽完具體例子。
最小行動：問「你能告訴我，哪一句話讓你受傷嗎？」
⑨勇氣｜把信靠落實成今天的行動。
對應第14課《基督權柄的顯現》、第21課《要過得勝有餘的生活》。
舊反應：「等我完全不怕，再開始。」
重建方向：帶著不安，完成符合信仰與責任的一步。
生活例子：主動處理拖延已久的道歉或工作。
最小行動：今天完成第一個可執行步驟。
⑩淡定｜在不能掌控的事上學習安息。
對應第20課《禱告和生活》、第28課《我使你們得安息》。
舊反應：「每件事照我的安排，我才能安心。」
重建方向：分清自己的責任與他人的選擇。
生活例子：孩子採用不同讀書法，先觀察結果，再討論。
最小行動：暫停一項反覆催促，改成約定回饋時間。
⑪主動｜讓生活有方向與節奏。
對應第24課《聖徒的七個現場》、第31課《生活醫治—不再徘徊於混沌裡》。
舊反應：「等環境變好，我才開始。」
重建方向：把信仰放進每天的工作、家庭與安排。
生活例子：每天保留一段時間讀經、整理任務與回顧。
最小行動：完成今天最重要的一件事。
⑫寬容｜理解差異，同時保留責任。
對應第32課《人際醫治—在愛中聯絡合式》。
舊反應：「他不同意我，就是不尊重我。」
重建方向：先理解對方，再討論界線與共同約定。
生活例子：朋友未能配合安排，先確認原因與替代方式。
最小行動：問「你現在最大的困難是什麼？」
⑬明智｜把所學帶進具體判斷。
對應第10課《在神裡面的思想體系》、第12課《聖經與我》。
舊反應：「我懂很多道理，所以我的判斷一定對。」
重建方向：理解經文脈絡，也確認情境、責任與行動後果。
生活例子：談饒恕時，同時釐清傷害、責任與關係界線。
最小行動：決定前，寫下依據與尚不清楚的地方。
⑭愛｜把關心變成能造就人的行動。
對應第32課《人際醫治》、第33課《夫婦醫治》、第34課《兒女醫治》。
舊反應：「我愛你，所以你必須照我的意思。」
重建方向：關心、傾聽、承擔責任，也尊重對方的選擇。
生活例子：陪孩子整理問題，讓孩子參與決定與執行。
最小行動：問「你希望我聽你說，還是一起想方法？」
⑮喜悅｜看見恩典，也容許真實感受。
對應第5課《新生命、新生活》、第22課《以敬拜為中心生活》。
舊反應：「事情全部順利，我才有理由感恩。」

行動：重要事情設定回覆期限，再依持續互動判斷。
更新指標：是否減少無根據猜測，並增加直接確認。

同一狀態只保留一個主要節點，其他名稱作別名。
原圖文字、轉貼主張與AI應用分開保存。

這份整理可作為「霍金斯情緒狀態與生命更新」的工作架構，尚不代表已修改妳原有母體檔案。
【十二｜整合後最重要的判斷】
結構能否更新：我是否能接受新資訊？
流動性是否存在：我能否表達感受、取得支持並協商責任？

調整方向：先降低任務規模，再取得回饋。
05｜對比／反差｜Contrast。
體系強調，不喜歡的經驗能幫助人更清楚知道想要什麼。
應用提問：這次不舒服，讓我發現了哪個需要？
生活例子：分工混亂，讓團隊發現需要明確負責人與期限。
這不表示必須留下來承受傷害，才能獲得成長。
06｜願望｜Desire。
應用提問：我真正想改善的是什麼？
生活例子：「我要家人聽話」可以再拆成「我希望責任有人分擔、說話受到尊重」。
07｜注意焦點｜Focus。
應用提問：我目前注意到哪些資訊，又忽略了哪些？
生活例子：只看缺交作業，也要看學生在哪種任務中比較願意開始。
08｜期待｜Expectation。
應用提問：我認為接下來會怎樣，依據是什麼？
生活例子：「她一定拒絕」會讓自己連清楚邀請都不敢提出。
09｜敘事｜Story。
體系鼓勵改變反覆講述的生活故事。
應用方式：把固定判決改成包含現況、資源與下一步的描述。
生活例子：「我一直很失敗」改成「前兩次方法沒效，我需要確認卡點」。
改寫敘事也需要保留真實帳目、事件與責任。
10｜較舒服的想法｜Better-Feeling Thought。
應用方式：找一個自己相信、也較能承受的說法。
生活例子：從「我一定考不上」，先改成「我還不知道結果，今天可以補兩個弱點」。
不用直接跳到「我一定成功」。
11｜接收狀態｜Receiving Mode。
體系意義：較能容許靈感與願望進入的狀態。
應用提問：我是否太疲累、太急迫，以致聽不進資訊？
生活例子：先休息，再閱讀重要回饋。
12｜漩渦｜Vortex。
這是該體系用來描述願望與一致狀態的靈性概念。
教學上可以借作「方向較清楚、內在拉扯較少」的比喻。
不能把它當成已測得的物理漩渦或量子場。
官方有以Vortex與關係、對比、聚焦為題的系列資料。
【二十二階情緒｜官方排列】
這套清單出自《Ask and It Is Given》。
以下是中文整理；順序是作者的體系安排，不是人的價值排名。
01｜喜悅、明白、有力量感、自由、愛、欣賞。
02｜熱情。
03｜熱忱、期待、快樂。
04｜正向期待、相信。
05｜樂觀。
06｜有希望。
07｜滿足。
08｜無聊。
09｜悲觀。
10｜挫折、惱怒、不耐煩。
11｜不堪負荷。
12｜失望。
13｜懷疑。
14｜擔憂。
15｜責怪。
16｜灰心。
17｜憤怒。
18｜報復。
19｜仇恨、暴怒。
20｜嫉妒。
21｜不安全感、內疚、不配得感。
22｜恐懼、哀傷、低落、絕望、無力感。
其中的低落或depression用語，不能單憑這份清單當成臨床診斷。
【怎麼使用情緒階梯？】
先找到接近自己的描述，再問：現在能增加哪一點安全、支持或行動空間？
不要要求每個人依照固定順序改變。
感受有變化，和行為是否合宜，需要分開觀察。
從無力轉為生氣，可能表示開始看見自己的需要，但不能因此合理化報復或傷害。
可追蹤的進步包括：能表達、能求助、能休息、能設界線，以及能完成下一步。
【與霍金斯圖的差異】
霍金斯圖：妳貼的版本有十七類，並使用20至1000的數值。
Abraham-Hicks：這份官方清單有二十二階，第一階在上、第二十二階在下。
兩者不能直接換算，也不能把其中一套的說法全部歸給另一位作者。
共同可用之處：增加情緒詞彙，讓人更具體描述狀態。
共同需要避免之處：把情緒排位當成身分、疾病原因或道德高低。
【實踐工具｜生活化操作版】
《Ask and It Is Given》包含二十二種練習；出版方也說明，這些練習與情緒引導清單搭配使用。
以下挑出常見工具，用生活步驟重新說明，並非逐字翻譯全書。
工具01｜欣賞練習。
做法：選一件真實存在、目前能欣賞的事情。
例子：今天有一位學生願意提出問題。
用途：擴大注意範圍，讓問題之外的資訊也能進來。
界線：欣賞美好，不需要否認困難。
工具02｜正向面向筆記。
做法：選一個人或一件事，記下具體有幫助的部分。
例子：同事雖然說話直接，但這次確實指出表格漏填的位置。
用途：把整體喜惡拆成不同面向。
界線：優點與傷害可以同時存在。
工具03｜分段設定意圖。
做法：進入下一段活動前，先說清楚這段要達成什麼。
上課前：「我要讓學生理解一個重點。」
開會前：「我要確認責任與期限。」
回家前：「我要先休息，再談重要事情。」
用途：減少上一段情緒直接接管下一段活動。
官方有獨立的Segment Intending基礎教材。
工具04｜轉向提問。
做法：從「我不要什麼」轉成「我希望建立什麼」。
原句：「我不要孩子一直拖延。」
轉向：「我希望他能自己啟動一小段讀書。」
接續行動：一起確認開始時間與第一項任務。
用途：把不滿轉成可執行目標。
工具05｜聚焦輪的生活化改寫。
做法：把希望靠近的狀態寫在中央，周圍寫自己真正相信的支持句。
目標：「我想比較安心地準備考試。」
支持句：「我可以先知道範圍。」
支持句：「我有一些已經會的部分。」
支持句：「我可以找人確認卡點。」
支持句：「今天不必一次解決全部。」
用途：建立能承接現況的思考階梯。
界線：不把無法相信的口號硬塞給自己。
工具06｜創作式想像。
做法：想像一段具體、可行的理想互動。
例子：想像自己用平穩聲音說出需求，對方不同意時仍能清楚回應。
接續行動：把其中一句話實際練習出來。
用途：讓理想畫面成為行動預演。
工具07｜清理環境。
做法：整理一個小區域，減少開始任務的阻礙。
例子：桌上只留下現在要用的講義、筆與水。
用途：調整環境，讓行動更容易開始。
工具08｜任務分流。
做法：分開自己今天能完成、需要別人協助，以及目前無法決定的事情。
例子：我能整理資料，但無法替所有家人決定是否改變。
用途：減少把所有責任集中到自己身上。
工具09｜願望背後的感受。
做法：問「得到這個，我希望感受到什麼？」
例子：想要更多收入，背後可能是安全感、選擇權或照顧家人的能力。
接續行動：分別找出增加收入、降低支出與分散責任的做法。
用途：讓單一願望展開成多條可行路徑。
工具10｜逐步改善感受。
做法：先找比目前更能承受、又符合事實的想法。
例子：「完全沒希望」→「我還沒找到方法」→「我可以先找一份資料」。
用途：降低從痛苦直接跳到快樂的壓力。
工具11｜安靜與觀察。
做法：短暫放下輸入，留意呼吸、身體與正在出現的想法。
用途：讓自己辨認狀態，再選下一步。
界線：安靜沒有帶來舒服時，可以改用散步、寫字或找人談。
工具12｜經驗回顧。
做法：寫下原本預期、實際結果與下一次調整。
例子：以為提出界線會破壞關係，實際上對方接受了新的安排。
用途：讓實踐產生可更新的資訊。
這一項是接入妳LifeOS的補充流程。
【主要書籍與資料入口】
①《Ask and It Is Given》。
定位：核心觀念、情緒引導清單與二十二種練習。
出版社列出的主題包括情緒、刻意創造、共同創造與逐步調整狀態。
②《The Astonishing Power of Emotions》。
定位：情緒、允許與刻意創造之間的關係。
官方提供書摘，可直接核對其對吸引力與允許的原始說法。
③《Money and the Law of Attraction》。
定位：金錢、身體福祉與吸引力法則的體系論述。
適合拿來研究它如何處理匱乏感與敘事，但財務結果仍需用收入、成本與風險核對。
④《Co-Creating at Its Best》。
定位：Wayne Dyer與Esther Hicks的對談。
官方列出親子、人生方向、靈魂、壞消息與責任等主題。
⑤官方基礎錄音。
主題：入門、吸引力法則、刻意創造、允許、分段意圖，以及關係與身體等專題。
⑥官方影片。
用途：核對具體問答的情境與完整意思，避免只憑短句二次轉貼。
官方影片頁：Abraham-Hicks Video Clips（abraham-hicks.com/video/）。
【妳先前貼過的資料｜保留與修正】
已核對的舊文，把霍金斯與Abraham-Hicks並列，並使用「頻率決定現實版本」「覺察、允許、調頻」等說法。
可以保留的實踐主題：情緒命名、減少自我攻擊、調整注意、建立選項與採取行動。
需要分開標示的主張：宇宙依振動回應願望、情緒直接吸引特定事件。
不納入健康結論的說法：所有疾病都由想法或頻率造成。
也不能推論受傷、貧窮或遭遇暴力，都是當事人「吸引來的」。
【對應靈魂結構｜作為探索模型】
身分：我是否把自己固定成無能、被拒絕或永遠失敗的人？
目標：我追求的是具體改善，還是讓所有人認同我？
權重：安全、關係、成就、自由，現在誰取得最高優先？
注意：我反覆接收哪些資訊？
預測：我把什麼可能性說成一定？
行動：我是否只有逃避、控制與討好？
更新：新證據進來後，我能改變哪個理解？
Abraham-Hicks可以提供感受與注意的入口，LifeOS再補上責任、環境、行動與驗證。
【對應十界｜生活比喻】
無力與痛苦：觀察自己是否失去選項。
渴求與匱乏：觀察滿足是否被綁在單一條件。
比較與憤怒：觀察輸贏是否接管決策。
理解與主動：觀察是否開始承擔、合作與學習。
關心與利他：觀察行動能否增加彼此的能力。
這些只是比較視角，不能把二十二階固定換成十界。
【對應福音36課｜保留不同根基】
情緒覺察，可連到認識自己。
注意與解讀，可連到思想體系與聖經應用。
內在拉扯，可連到禱告、安息與生活安排。
關係實踐，可連到人際、夫婦與兒女主題。
根本差異是：36課以基督、十字架與神人關係為中心；Abraham-Hicks以源頭、對齊與吸引力法則為中心。
比較時保留差異，才能避免把不同信仰詞語混成同一套。
【行動層｜三個完整案例】
案例一｜高中生害怕英文考試。
情境：考試快到了。
感受：害怕與不堪負荷。
原想法：「我一定完蛋。」
較能承受的想法：「我還有兩個單元可以補。」
最小行動：先做五題，找出一個主要錯因。
回饋：是否真的理解，再用新題確認。
案例二｜家人反覆要求妳幫忙。
情境：對方臨時交付事情。
感受：內疚與憤怒。
原想法：「拒絕就代表我沒有愛。」
較能承受的想法：「我可以關心，也可以說明容量。」
最小行動：說清楚能幫多少、何時完成、其餘誰承擔。
回饋：責任是否更清楚，自己的安排是否可持續。
案例三｜團購或課程銷售不理想。
情境：貼文反應少。
感受：失望與懷疑。
原想法：「沒人需要我的東西。」
較能承受的想法：「我還不知道卡在需求、內容、價格還是信任。」
最小行動：蒐集具體回饋，一次調整一個環節。
回饋：追蹤詢問、成交、成本與回購，核對預測。
【每日五分鐘工作表】
今天的情境：＿＿。
目前的感受：＿＿。
腦中反覆的一句話：＿＿。
其中已知的事實：＿＿。
尚未確認的猜測：＿＿。
真正需要：＿＿。
比較能相信的新說法：＿＿。
今天的最小行動：＿＿。
實際結果：＿＿。
下一次調整：＿＿。
【兩週回饋指標】
我是否更能說清楚感受？
我是否減少沒有新增資訊的反覆責怪？
我是否更能取得協助與表達界線？
我是否完成更多與目標有關的小行動？
我是否根據結果調整方法？
結構可更新：想法能接受新資訊。
流動性存在：支持、感受、責任與資源能被協商。
混亂減少：失約、模糊分工與未處理問題不再持續堆積。
這些指標可用來追蹤實踐，不需要宣稱測到了靈性頻率。

把「我很痛苦」拆成可描述的事件與反應。
在對方說完之前，先維持傾聽。
用問題確認意思，減少直接替別人下結論。
上述是一般溝通練習，不等於完成聽析。
【機制層二｜E-meter】
01｜名稱。
Electropsychometer，山達基使用的宗教儀器。
02｜使用方式。
接受者握住電極，聽析員觀察儀表指針變化。
03｜物理與宗教詮釋要分開。
裝置讀取經由人體形成的電路變化。
教會進一步把某些讀值解釋為與靈性困擾或「電荷」有關。
04｜教會賦予的用途。
協助聽析員決定哪些主題需要處理。
05｜不能直接推論的事情。
指針有反應，不等於說謊。
指針平穩，不等於已經痊癒。
讀值不能單獨證明前世、印痕或靈魂等級。
06｜與霍金斯的差異。
E-meter是一種裝置；霍金斯分級主要訴諸另一套肌肉測試校準主張。
兩者不能互相當成驗證。
【機制層三｜Clear】
01｜官方定義。
指教會認為個人已不再具有「自己的反應式心靈」的狀態。
02｜它是體系內的宗教狀態。
不是一般考試測得的智力或人格分數。
03｜不能擴張成的意思。
不能直接解讀為永遠理性、完全掌控情緒、沒有身體疾病。
04｜與知識的差異。
知道Clear的定義，不代表已達到教會認定的Clear。
05｜與生活能力的差異。
一個人是否更守信、更會溝通、更能修正，需要另外觀察。
06｜與其他體系的差異。
Clear不是佛教涅槃、基督信仰重生或霍金斯400的同義詞。
【機制層四｜OT】
01｜名稱。
Operating Thetan，常譯「操作中的希坦」。
02｜所在位置。
官方將其放在Clear之後的進階靈性發展。
03｜官方目標。
恢復其所主張的靈性確定感與能力。
04｜較強的教義主張。
教會描述OT能對生命、思想、物質、能量、空間與時間處於「因由」位置。
這是宗教能力主張，不能當成已證實的超物理能力。
05｜MEST。
Matter：物質。
Energy：能量。
Space：空間。
Time：時間。
06｜因由 Cause與受影響 Effect。
在這個體系中，常用來描述主動造成結果與受到影響的位置。
生活應用可以理解為增加可控行動，但個人不會因此控制所有環境。
07｜為什麼Clear之後還有OT？
教會把兩者視為不同目標：Clear處理其所定義的反應式心靈，OT進一步追求靈性能力。
【公開級數｜修正後的基本名稱】
以下是級數的名稱與概括主題，不是完整程序或保證結果。
Grade 0｜Communication Release。
主題：溝通。
Grade I｜Problems Release。
主題：問題。
Grade II｜Relief Release。
主題：減輕敵意與困苦。
Grade III｜Freedom Release。
主題：過去的困擾與面對未來。
Grade IV｜Ability Release。
主題：固定狀態與採取新行動的能力。
舊資料把Grade III寫成富足，並把Grade V寫成通用終點，這些不再沿用。
級數名稱可見歷史山達基宣傳資料；資料被政府網站保存，不代表政府認可其功效。
【把級數轉成一般生活提問】
溝通：我能否把需要說清楚，也聽懂對方？
問題：我能否把混在一起的困難拆開？
減輕困苦：我能否停止增加傷害，處理具體責任？
面對未來：我能否帶著過去經驗，仍安排下一步？
新行動：我是否只有一種固定反應？
這些是教學轉譯，不能冒稱為山達基認證成果。
【情緒度 Tone Scale】
山達基有自己的情緒度表。
它與霍金斯十七類、Abraham-Hicks二十二階是不同系統。
官方使用相對位置數值，不應改標成赫茲。
以下列出部分代表項目。
40.0｜存在的寧靜。
20.0｜行動。
8.0｜振奮。
4.0｜熱忱。
3.5｜愉快。
3.3｜強烈興趣。
3.0｜保守。
2.8｜滿足。
2.5｜無聊。
2.0｜對抗。
1.9｜敵意。
1.5｜憤怒。
1.1｜隱藏的敵意。
1.02｜焦慮。
1.0｜恐懼。
0.98｜絕望。
0.5｜悲傷。
0.05｜冷漠。
這些是官方表格中的分類與排序，不能用來單獨判定一個人的可信度、危險性或生命價值。
【ARC三角｜理解與溝通】
A｜Affinity，親和。
指關係中的親近、喜好或情感連結。
R｜Reality，實相。
在這個概念中，強調雙方認同或共有的理解。
C｜Communication，溝通。
指資訊與表達的交流。
官方把三者連結到理解。
生活例子：學生不交作業。
親和：先維持基本尊重。
共同理解：確認究竟少交哪些內容、卡在哪裡。
溝通：說清楚補交方式與期限。
概念界線：兩個人都同意，不代表內容一定符合客觀事實。
【八大動力｜從個人擴大到不同層次】
01｜自己。
身體、心靈與個人生活。
02｜創造與家庭延續。
涵蓋家庭、養育與相關創造活動。
03｜群體。
朋友、組織、公司與社群。
04｜人類。
整體人類的延續。
05｜生命形式。
動物、植物等生命。
06｜物質宇宙。
物質、能量、空間與時間。
07｜靈性。
體系中的靈性存在。
08｜無限。
體系中的無限與最高存在概念。
官方用這八類描述不同範圍的生存動力。
生活應用：一個決策除了讓自己方便，也檢查對家人、團隊與其他生命的影響。
不能因為影響範圍大，就取消個人的安全與界線。
【與妳的靈魂結構模型對應】
身分結構：Thetan提供體系內的靈性身分。
認知結構：分析式與反應式心靈提供解釋框架。
狀態結構：Tone Scale提供情緒分類。
關係結構：ARC提供溝通與理解框架。
目標結構：Bridge安排進階方向。
實踐結構：聽析與訓練形成重複程序。
評估結構：體系內透過程序完成與認定追蹤進程。
更新問題：這些判準是否也接受體系之外的證據與實際生活結果？
以上是結構比較，並未證明各概念在本體上相同。
【與霍金斯、Abraham-Hicks、36課的對照】
霍金斯主要入口：狀態分級與靈性發展。
Abraham-Hicks主要入口：情緒引導、注意、允許與吸引力。
山達基主要入口：希坦、心靈、聽析、訓練與進階橋梁。
福音36課主要入口：基督、十字架、神兒女身分與同行生活。
共同可討論的問題：人如何理解自己，如何回應痛苦，如何改變生活？
不同之處：本體主張、權威來源、方法與完成標準都不同。
【行動層｜轉成可核對的生活練習】
案例一｜被糾正就反擊。
觀察：對方說了什麼，我補上了什麼解讀？
舊預測：「承認錯誤，就會失去價值。」
新做法：「請指出具體位置，我核對後回覆。」
回饋：是否更快修正，也減少衝突？
案例二｜替家人承擔所有事情。
觀察：哪些責任本來就屬於我，哪些是對方的選擇？
舊預測：「沒有全部幫忙，就會被討厭。」
新做法：說清楚範圍、期限與接手者。
回饋：安排是否更清楚，自己是否能持續？
案例三｜學生一直重複犯錯。
觀察：錯在詞彙、理解、步驟還是沒有練習？
舊解讀：「他就是不認真。」
新做法：先找一個卡點，提供示範與新題。
回饋：換題後能否獨立完成？
【判斷任何生命訓練系統的三個問題】
①結構能否更新？
遇到不符合預期的結果，能不能檢查方法與假設？
②流動性是否存在？
能不能提問、取得其他資訊、保留隱私與自主選擇？
③混亂是否減少？
日常責任、關係、工作與資源安排，是否出現可觀察改善？
不要只用「感覺更有力量」判斷全部效果，也要看持續行為與實際後果。
【資料使用界線】
聽析與E-meter不能代替醫療或心理專業評估，也不應據此自行停藥。
涉及痛苦回憶的程序，不能只憑這份整理就替家人或學生操作。
這份資料適合用於理解、比較與設計一般覺察練習，不等於正式山達基訓練。

<script type="text/plain" class="mod" data-id="layers19" data-title="十九層生命更新架構｜完整展開" data-group="結構模型・生命更新">
真理→知識→認知→身分→目標→權重→狀態→預測→決策→實踐→生命→果子→回饋→差異→察驗→悔改→模型更新→再測形成→智慧。
這是我們整理的生命學習與更新框架，結合信仰實踐、生活觀察與模型修正。
十九層是十九個觀察位置，實際運作會反覆往返、同時互相影響。
例如疲累可能改變預測，關係回饋可能改變身分理解，新的目標也可能重新安排知識。
【本體層｜生命更新究竟更新什麼？】
更新你如何理解世界、如何理解自己、如何安排重要性，以及如何採取行動。
外在事件進來後，人會選擇注意什麼、賦予什麼意思，再形成期待與反應。
同一件事，可能因身分理解、目標與狀態不同，產生不同選擇。
因此，要觀察一個人的生命，不能只問懂多少，也要看壓力來時如何回應。
成長可以追蹤為：預測更準、誤差更早被發現、修正更有效、能力更能跨情境使用。
自由可以理解為：熟悉的情境出現時，仍能根據新資訊增加選擇。
但生命價值也包括愛、責任與尊嚴，不能只壓縮成預測分數。
【結構層｜十九層分成六組】
第一組｜理解基礎：真理、知識、認知。
功能：確認依據，組織資訊，形成解讀。
第二組｜方向配置：身分、目標、權重。
功能：確認自己如何定位、往哪裡走，以及如何排序。
第三組｜當下選擇：狀態、預測、決策。
功能：看見目前條件，估計可能結果，選擇回應。
第四組｜生活生成：實踐、生命、果子。
功能：讓選擇進入日常，形成模式，產生長期影響。
第五組｜誤差辨認：回饋、差異、察驗。
功能：接收結果，找出落差，辨認問題位置。
第六組｜方向重整：悔改、模型更新、再測形成、智慧。
功能：承擔責任、修正理解、反覆驗證，形成可遷移的判斷。
【01｜真理 Truth】
核心問題：我憑什麼認為這是真的？
本質：建立判斷的依據與界線。
輸入：事件、經驗、文本、證言、觀察與資料。
運作：分辨來源、脈絡、內容與可核對程度。
輸出：目前能支持的判斷，以及尚未確定的部分。
重要區分：事實、信仰宣認、價值選擇與個人推測，需要分開表達。
信仰接法：區分經文文本、經文詮釋、宗派觀點與個人領受。
常見錯誤：把感覺很強、很多人說或權威說過，直接當成充分證據。
生活例子：朋友沒回訊息，是可觀察事件；朋友討厭我，是需要核對的推測。
最小行動：把一句困擾自己的話，標成事實、解讀或未知。
察驗問題：什麼資訊會讓我重新考慮這個判斷？
完成指標：能說清楚依據，也能說清楚不知道什麼。
層間連結：依據清楚，知識才不容易建立在錯誤前提上。
【02｜知識 Knowledge】
核心問題：我知道哪些概念，它們怎麼連在一起？
本質：把零散資訊組織成可搜尋、可解釋的結構。
輸入：已確認來源、案例、概念與經驗。
運作：分類、命名、建立節點、關係與適用條件。
輸出：知識地圖、例子、差異與界線。
常見錯誤：收藏很多文章，遇到問題卻找不到能用的部分。
生活例子：學生背了很多單字，仍不知道句子中的詞性與搭配。
最小行動：學一個概念，同時寫定義、一個例子與一個不適用情況。
察驗問題：我能用自己的話解釋嗎？
完成指標：換個例子仍能辨認，並知道去哪裡查證。
層間連結：知識提供材料，認知決定如何使用材料。
【03｜認知 Cognition】
核心問題：我正在用什麼方式解讀事情？
本質：對自己、他人與世界形成理解模型。
輸入：知識、記憶、目前情境與既有期待。
運作：注意、分類、比較、推論與賦予意義。
輸出：對事件的解釋。
常見錯誤：把第一個想到的故事，當成事件本身。
生活例子：孩子沉默，可能是疲累、需要思考或不想談，不能立刻等同不尊重。
最小行動：對一個事件寫出三種可能解釋。
察驗問題：我是在描述看見的事情，還是在補故事？
完成指標：能保留多種解釋，再依資訊調整。
層間連結：反覆的解讀，可能逐漸形成身分敘事。
【04｜身分 Identity】
核心問題：我把自己理解成怎樣的人？
本質：組織自我價值、角色、責任與可能性的自我模型。
輸入：經驗、關係評價、文化、信仰與自我敘事。
運作：把不同經驗整合成「我是誰」的理解。
輸出：自己認為能做、該做與值得得到的事。
常見錯誤：一次失敗，被擴大成永久身分。
生活例子：「我這次英文考差」變成「我就是沒有語言天分」。
信仰接法：從神兒女身分理解自己，同時承認仍需要學習與修正。
最小行動：把「我就是……」改寫成可觀察、可調整的描述。
察驗問題：這個身分理解，增加了哪些責任與選項？
完成指標：面對失敗仍能保留尊嚴、求助與再試的能力。
層間連結：身分理解會影響人願意追求哪些目標。
【05｜目標 Goal】
核心問題：我現在真正想達成什麼？
本質：為選擇提供方向與完成標準。
輸入：需要、價值、身分、限制與情境。
運作：選定結果，安排時間尺度與優先事項。
輸出：具體目標及可觀察的進展。
常見錯誤：口頭說要溝通，實際只想讓對方認輸。
生活例子：談孩子成績，真正需要確認的是學習卡點，卻變成證明家長有多辛苦。
最小行動：重要對話前，先寫一句希望帶走的成果。
察驗問題：我現在的說話方式，是否朝這個方向前進？
完成指標：目標具體，且能區分自己的行動與他人的選擇。
層間連結：目標決定方向，權重處理目標之間的取捨。
【06｜權重 Weight】
核心問題：幾件事衝突時，我先保護什麼？
本質：不同價值、風險與需求的優先配置。
輸入：目標、價值、資源、急迫性與狀態。
運作：衡量重要性、代價與不可退讓的條件。
輸出：實際優先順序。
常見錯誤：最急、最吵或最怕失去的事情，自動取得最高位置。
生活例子：重視健康，卻持續讓工作占滿休息時間。
最小行動：檢查今天時間與金錢最多流向哪三件事。
察驗問題：我說重要的事，是否得到相應資源？
完成指標：安排較符合價值，也保留必要界線。
層間連結：狀態會改變權重，例如疲累時立即舒服可能壓過長期目標。
【07｜狀態 State】
核心問題：我現在處於什麼身心與環境條件？
本質：影響注意、判斷與行動容量的當下狀況。
輸入：感受、疲累程度、負荷、時間壓力與周遭環境。
運作：改變哪些資訊更突出，以及哪些行動較容易。
輸出：當下可用的注意與回應空間。
常見錯誤：把「我很害怕」當成「事情一定危險」。
生活例子：忙了一整天，孩子一句普通提問也被聽成挑釁。
最小行動：先說出感受與目前負荷，再決定是否立即處理。
察驗問題：同一件事，休息後我可能怎麼理解？
完成指標：能調整時機、任務與支持，減少在超負荷時作重大判斷。
層間連結：情緒圖主要接在這裡，但需要往前檢查解讀，也往後檢查行動。
【08｜預測 Prediction】
核心問題：我認為接下來會怎樣？
本質：對可能結果作出可修正的估計。
輸入：過去經驗、目前資訊、情境與狀態。
運作：推估結果、風險與所需準備。
輸出：帶有不確定性的預期。
常見錯誤：把擔心當成必然，把期待當成保證。
生活例子：「拒絕一次，家人就永遠不理我。」
最小行動：先記錄預測，再記錄實際結果。
察驗問題：這是一次經驗，還是有持續紀錄支持？
完成指標：能說出多種可能與調整條件。
信仰接法：分清神的應許、自己的理解，以及對具體結果的猜測。
層間連結：預測提供決策材料，但選擇仍需要價值與界線。
【09｜決策 Decision】
核心問題：在目前條件下，我選哪個做法？
本質：把目標、權重、預測、成本與界線轉成選擇。
輸入：可行選項、資源、風險與期限。
運作：比較方案，確認可逆性與可能後果。
輸出：明確選擇及備案。
常見錯誤：只剩忍耐或爆炸兩個選項。
生活例子：家人請託時，可以全部答應、部分協助、延期、分工或拒絕。
最小行動：列出三個選項，再選一個目前可行的。
察驗問題：哪個選項符合目標，也在可承受範圍內？
完成指標：能解釋選擇理由，並知道何時需要改變。
層間連結：決策需要轉成具體實踐，才會產生新資訊。
【10｜實踐 Practice】
核心問題：我今天實際做什麼？
本質：把理解與選擇轉成可觀察行動。
輸入：決策、資源、時間與支持。
運作：拆步驟、安排起點、重複與調整。
輸出：完成的行動與紀錄。
常見錯誤：把感動、計畫或看完文章，當成已經改變。
生活例子：知道要設界線，仍要練習說出具體句子。
最小行動：指定何時、何地、做什麼，以及做到哪裡。
察驗問題：旁人能否看見我完成了這件事？
完成指標：任務小到能開始，也與目標有實際關係。
層間連結：實踐經過時間與情境累積，逐漸形成生活模式。
【11｜生命 Life】
核心問題：這些做法是否進入日常？
本質：長期實踐在不同關係與場合中的整合。
輸入：重複行動、環境、角色與時間。
運作：形成習慣、互動模式與日常安排。
輸出：較穩定的生活方向。
常見錯誤：在課堂或聚會能說明，回家遇到衝突就完全失去作用。
生活例子：對外人耐心，對孩子卻長期羞辱。
最小行動：把一個已學會的回應，用在最容易失控的場合。
察驗問題：沒有人提醒時，我通常怎麼做？
完成指標：改變逐漸出現在多個生活現場。
層間連結：生活模式持續生成結果與對他人的影響。
【12｜果子 Fruit】
核心問題：長期產生了什麼？
本質：觀察能力、品格、關係與他人益處。
輸入：生活模式、環境條件、時間與外在因素。
運作：累積直接與間接影響。
輸出：可觀察的結果與趨勢。
常見錯誤：活動很多，就認為果效一定很好。
生活例子：每天督促孩子很久，但孩子更不敢說實話。
最小行動：同時觀察任務成果與關係代價。
察驗問題：除了我很努力，誰實際得到什麼幫助？
完成指標：預期成果改善，且代價與副作用在可接受範圍。
重要界線：結果也受環境與他人選擇影響，不能全部歸功或歸罪個人。
層間連結：果子需要透過回饋被看見。
【13｜回饋 Feedback】
核心問題：結果正在告訴我什麼？
本質：把行動後的資訊送回系統。
輸入：觀察、測驗、他人回應、紀錄與結果。
運作：蒐集、核對、辨認偏差與缺漏。
輸出：可供比較的資訊。
常見錯誤：只收稱讚，或把每句批評都照單全收。
生活例子：學生說「聽不懂」，需要再問卡在哪一句或哪一步。
最小行動：詢問一個具體、能回答的問題。
察驗問題：這項回饋看見了什麼，又可能漏了什麼？
完成指標：資訊具體，並能連回原本行動。
層間連結：回饋與預測比較，才會形成可辨認的差異。
【14｜差異 Difference】
核心問題：我以為的與實際發生的，差在哪裡？
本質：辨認預期與觀察之間的落差。
輸入：事前預測與事後回饋。
運作：對照方向、幅度、時間與條件。
輸出：需要進一步檢查的更新訊號。
常見錯誤：沒有事前紀錄，事後把任何結果都說成早就知道。
生活例子：以為學生不努力，卻發現他一對一示範後能立刻完成。
最小行動：寫下「我原本以為……，實際卻……」。
察驗問題：是結果不同，還是觀察方法不同？
完成指標：能指出明確落差，避免立刻跳到人格評價。
層間連結：差異提供入口，察驗決定需要修哪裡。
【15｜察驗 Discernment】
核心問題：問題出在哪個環節？
本質：區分不同來源的誤差與限制。
輸入：差異、過程紀錄、情境與其他證據。
運作：提出解釋、比較可能性、排除不合適的推論。
輸出：暫時診斷與優先修正位置。
常見錯誤：任何挫折都說成不努力、低能量或信心不足。
生活例子：作業沒交，可能是未理解、忘記、時間不足、設備問題或不願做。
最小行動：先提出三個可能原因，再找能區分它們的資訊。
察驗問題：哪項新資訊能幫我縮小範圍？
完成指標：修正對準具體環節，也容許診斷被更新。
層間連結：涉及自己的偏離與傷害時，進入責任與悔改。
【16｜悔改 Repentance】
核心問題：我需要承認、停止、轉向與修復什麼？
本質：在基督信仰中，包含向神承認偏離並轉向，不能縮成純粹技術調整。
輸入：察驗結果、信仰理解、責任與他人所受影響。
運作：承認、承擔、轉向與修復。
輸出：改變方向的具體回應。
常見錯誤：只說對不起，仍反覆做同樣的事。
生活例子：停止公開羞辱孩子，向孩子承認傷害，改變後續溝通。
最小行動：各寫一項需要停止、開始與修復的行動。
察驗問題：我的道歉是否帶來責任與行為的改變？
完成指標：有具體修復，也尊重對方需要時間與界線。
重要界線：普通失誤可用訂正處理，不能把所有模型誤差都道德化為罪。
層間連結：方向改變後，需要把新理解寫入模型與安排。
【17｜模型更新 Model Update】
核心問題：我對事情的理解，要改哪一部分？
本質：根據較可靠的資訊，修正解讀、權重、策略與預測。
輸入：察驗、責任處理、證據與新經驗。
運作：保留、調整權重、修正、替換或暫停判斷。
輸出：新版本理解及行動規則。
常見錯誤：有一次反例就全部推翻，或無論多少反例都拒絕改變。
生活例子：從「拒絕一定破壞關係」，改成「清楚表達範圍，有時能改善安排」。
最小行動：寫下舊想法、新證據、新做法。
察驗問題：這次改的是內容、強度、適用範圍，還是時機？
完成指標：新理解更貼近資料，也能形成不同的預測。
層間連結：新模型要接受再測，才能知道是否真正有用。
【18｜再測／形成 Retest／Formation】
核心問題：換時間、換對象、換壓力後，是否仍做得到？
本質：檢查新理解能否成為能力與較穩定的品格。
輸入：新模型、實踐安排與不同情境。
運作：重複、遷移、觀察失效條件與再調整。
輸出：較穩定的做法，以及清楚的適用界線。
常見錯誤：一次成功，就認定已經完全改變。
生活例子：對同事能說不，也練習在家人請託時表達容量。
最小行動：選一個不同情境，實際試用一次。
察驗問題：哪種條件下，新方法最容易失效？
完成指標：多次可重現，也知道何時需要協助或換方法。
層間連結：經驗、界線與時機被整理後，逐漸形成智慧。
【19｜智慧 Wisdom】
核心問題：此時、此地、對這個人，怎麼做較合宜？
本質：把知識、經驗、價值、責任、界線與更新能力整合使用。
輸入：前面各層的資料與長期經驗。
運作：抓重要差異、辨認例外、掌握時機並保留不確定性。
輸出：能遷移、能解釋、能修正的判斷。
常見錯誤：把一句成功經驗，當成所有人的固定答案。
生活例子：知道有時需要立即澄清，有時需要等待，有時需要離開現場。
最小行動：每次整理經驗，同時記下規律、界線與例外。
察驗問題：這個方法在哪些情況下不適用？
完成指標：新情境中仍能判斷，並願意承認不知道。
層間連結：智慧會形成新的提問，重新回到真理、知識與認知的檢查。
【十九層的五個重要回路】
回路一｜身分與行動。
身分理解→目標→決策→實踐→新經驗→身分再理解。
例子：從「我不會英文」逐步累積「我能處理這類題目」。
回路二｜狀態與預測。
疲累或緊張→注意威脅→悲觀預測→逃避→缺少新資訊。
調整入口：降低負荷、增加支持，再安排小幅嘗試。
回路三｜關係與控制。
害怕失去→提高控制→對方退縮→更害怕→更控制。
調整入口：說清需要、責任與界線，觀察新互動。
回路四｜學習與更新。
預測→行動→回饋→差異→察驗→模型更新→再測。
調整入口：事前有預測，事後有可比較資料。
回路五｜價值與果子。
目標與權重→資源安排→生活模式→長期影響→價值再校準。
調整入口：檢查時間、金錢與注意是否支持真正重要的事。
【十大錯誤歸因｜接入察驗層】
①觀察錯誤 Observation。
問題：看漏、聽錯或資料不完整。
例子：只看到未交，沒看到已請假。
②表徵錯誤 Representation。
問題：把複雜情境壓成失真的描述。
例子：把「三次中有一次沒完成」寫成「永遠不做」。
③節點錯誤 Node。
問題：把問題分錯類。
例子：詞彙不足被分類成態度差。
④關係錯誤 Relation。
問題：把同時出現，直接當成固定因果。
例子：用了新方法後考好，就認為全部功勞都在方法。
⑤權重錯誤 Weight。
問題：小事占據過高優先。
例子：花兩小時美化筆記，卻沒練最常錯的題型。
⑥界線錯誤 Boundary。
問題：方法超出適用範圍。
例子：把一般協商話術用在有威脅的場合，卻忽略安全條件。
⑦時機錯誤 Timing。
問題：內容合適，但當下條件不合適。
例子：在極度疲累時討論重大衝突。
⑧行動錯誤 Action。
問題：知道方向，但執行步驟不合適。
例子：只重讀解答，沒有獨立作答。
⑨目標錯誤 Goal。
問題：效率提高，卻朝不需要的方向前進。
例子：把孩子不敢說話，誤當成溝通成功。
⑩測量錯誤 Measurement。
問題：用錯指標或比較方式。
例子：只看作答數，沒看題目難度、訂正與遷移。
【完整案例一｜高中英文學習】
01真理：目前只能確認這次測驗表現，不能確認能力永遠如此。
02知識：把錯題整理成詞彙、句構、篇章與作答策略。
03認知：檢查是否把「還不會」解讀成「學不會」。
04身分：保留「我正在學習」的定位。
05目標：提高目前最常失分題型的掌握度。
06權重：先補核心卡點，再做美化與抄寫。
07狀態：確認讀書時是否太累、太急或一直被手機打斷。
08預測：先估計自己在新題中能答對多少。
09決策：選一種對準卡點的方法。
10實踐：完成少量題目並說明理由。
11生命：安排固定、可持續的練習節奏。
12果子：觀察正確率、理解與求助能力。
13回饋：取得答案、教師或同學的具體回應。
14差異：比較預測與實際表現。
15察驗：找出仍錯在哪個環節。
16責任與轉向：若有抄答案，承認並停止；普通錯題則進行訂正。
17模型更新：調整自己對題型與能力的理解。
18再測形成：用不同文章與題目確認。
19智慧：知道自己遇到這類題目時，先看哪些線索。
【完整案例二｜家庭請託與界線】
01真理：家人提出要求，不等於我必須全部承擔。
02知識：了解時間、費用、責任與可用協助。
03認知：檢查是否把拒絕解讀成沒有愛。
04身分：我可以是關心家人的人，也有自己的限制。
05目標：形成可持續的照顧安排。
06權重：同時考慮安全、基本生活與長期責任。
07狀態：生氣時先暫停，避免立刻承諾或責罵。
08預測：寫下對方可能接受、反對或拖延的情況。
09決策：選擇部分協助、延期、分工或拒絕。
10實踐：說清範圍、期限與接手者。
11生命：持續依約定執行。
12果子：觀察責任是否更清楚。
13回饋：記錄對方實際回應與安排。
14差異：比較原本擔心與實際發生。
15察驗：分辨問題在界線、執行、資源還是安全條件。
16悔改：若自己曾羞辱或威脅，承認並停止。
17模型更新：修正「只有無限付出才算愛」的理解。
18再測形成：下一次請託時，再確認能否穩定表達。
19智慧：依需要與風險調整協助，保留尊重與自主。
【完整案例三｜課程與會員服務】
01真理：會員說喜歡，不等於會購買或持續使用。
02知識：整理需求、使用情境與現有替代方案。
03認知：避免把反應少全部解讀成自己沒價值。
04身分：把自己定位為持續改善服務的人。
05目標：選定一項要改善的使用者任務。
06權重：先改善核心價值，再增加功能。
07狀態：避免焦慮時一次改掉所有內容。
08預測：先寫下這次調整希望帶來什麼改變。
09決策：選一個小規模、可回復的方案。
10實踐：讓實際使用者試用。
11生命：建立固定回饋與修正節奏。
12果子：觀察完成任務、持續使用與服務成本。
13回饋：蒐集具體卡點。
14差異：比較預期與實際。
15察驗：分辨需求、內容、介面、價格與信任問題。
16責任與轉向：修正誇大承諾與不清楚說明。
17模型更新：調整對使用者需求的理解。
18再測形成：用下一批或不同情境核對。
19智慧：形成有條件的服務原則，持續更新。
【三個治理問題】
①結構是否可更新？
能否改變解讀、規則、分工與策略？
②流動性是否存在？
資訊、支持、感受、資源與責任能否被表達與協商？
③混亂是否持續累積？
未處理的任務、失約、責任模糊與衝突是否增加？
這裡的混亂是生活觀察，不直接等同物理熵。
【四層使用方式】
本體層：先確認這次要更新的是什麼。
結構層：找出十九層中的主要卡點。
機制層：說清楚哪些環節如何互相影響。
行動層：選一個小步驟，取得回饋並再測。

新做法是否在不同情境仍有效？
改善是否伴隨過高代價？
【轉成課程的八個單元】
單元一｜事實、來源與知識整理：第1～2層。
單元二｜解讀與自我定位：第3～4層。
單元三｜目標與價值排序：第5～6層。
單元四｜狀態、預測與選擇：第7～9層。
單元五｜實踐、生活與長期影響：第10～12層。
單元六｜回饋、差異與診斷：第13～15層。
單元七｜責任、悔改與模型修正：第16～17層。
單元八｜再測、遷移與智慧形成：第18～19層。
每個單元都包含一個真實情境、一個舊模型、一個小行動、一份回饋與一次再測。
【轉成APP的核心欄位】
來源、情境、事實、解讀、身分、目標、權重、狀態、預測、選項、決策、行動、結果、回饋、差異、錯誤類型、責任、修復、模型版本、再測條件與適用界線。
畫面可以一次只問少數問題，完整架構保留在後方資料中。
狀態可以用情緒詞彙選擇，不需要以霍金斯數字替人評分。
進步用可觀察行為、任務表現與跨情境能力呈現。
【整套架構的工作原則】
先辨認卡點，再決定修正位置。
一次優先改善少數環節，避免十九層同時變成負擔。
保留有效部分，依新證據調整不合適部分。
更新之後回到生活再測，讓理解逐步成為能力。
</script>

<script type="text/plain" class="mod" data-id="hdiching" data-title="人類圖 × 易經｜接入情緒圖與十九層" data-group="身心傳統・象徵系統">
人類圖可以提供自我觀察的分類語言，易經可以提供情境、變化與時機的思考語言。
以下採教學與探索用途，不把出生分類或卦象當成固定命運。
【本體層｜兩套系統在問什麼？】
人類圖常問：我如何運作、做決定，以及受他人影響？
易經常問：目前是什麼局勢、哪些條件正在變化，以及何時進退？
接入生命更新後，共同問題是：我如何根據情境與回饋，調整自己的選擇？
【結構層｜不能直接畫等號的地方】
人類圖使用六十四個閘門，借用了易經六十四卦的架構。
但人類圖還結合占星等元素，不能直接視為易經本身。
閘門解釋與傳統卦義，也不能逐項當成完全相同。
霍金斯情緒分數、九大中心、六十四卦與十界之間，沒有已確立的固定換算表。
【人類圖｜九大中心的生活觀察】
①頭頂中心｜靈感與問題。
觀察：我是否覺得每個問題都必須立即回答？
生活例子：看到很多新理論，忍不住全部追下去。
更新行動：先記錄問題，只選目前最需要解決的一個。
十九層接點：知識、目標、權重。
②邏輯中心／阿賈那中心｜理解與概念。
觀察：我是否把目前的解釋當成唯一答案？
生活例子：一次方法有效，就認為所有學生都適用。
更新行動：寫出適用條件與反例。
十九層接點：認知、預測、模型更新。
③喉嚨中心｜表達與顯現。
觀察：我說出的話，能否幫助對方理解與行動？
生活例子：一直說「認真一點」，卻沒有說明要完成什麼。
更新行動：把抽象要求改成具體任務與期限。
十九層接點：決策、實踐、回饋。
④G中心｜身分、方向與愛。
觀察：我是否用一個角色定義全部自己？
生活例子：孩子不需要協助時，就覺得自己失去價值。
更新行動：整理角色以外仍重視的價值與方向。
十九層接點：身分、目標、生命。
⑤意志力／心臟中心｜承諾與自我價值。
觀察：我是否靠過度承諾證明自己？
生活例子：明明沒時間，仍答應所有人的請託。
更新行動：先確認容量，再作承諾。
十九層接點：身分、權重、決策。
⑥情緒／太陽神經叢中心｜感受與情緒變化。
觀察：我是否把當下感受當成永久結論？
生活例子：吵架時決定永遠不再聯絡。
更新行動：非緊急決定先保留時間，之後再核對。
十九層接點：狀態、預測、決策。
⑦薦骨中心｜投入與持續活動。
觀察：什麼任務讓我願意持續投入，哪些安排超過容量？
生活例子：對內容有興趣，卻因工作量太大而無法維持。
更新行動：比較興趣、能力、負荷與實際完成情況。
十九層接點：實踐、生命、果子。
⑧直覺／脾中心｜即時感知與安全。
觀察：我感到不對勁時，有哪些可確認的線索？
生活例子：對某項合作不放心，需要查條款與紀錄。
更新行動：保留直覺作提示，再補上資訊核對。
十九層接點：狀態、預測、察驗。
⑨根部中心｜壓力與推動。
觀察：我是在朝目標前進，還是只想趕快解除壓力？
生活例子：怕事情堆積，就倉促答應不合適的方案。
更新行動：分清緊急、重要與可以等待。
十九層接點：權重、狀態、決策。
以上是借九中心名稱設計的觀察問題，不能由此判定某個人的出生設計。
【易經｜八卦的生活化觀察】
乾｜健。
提問：現在需要主動承擔什麼？
例子：團隊缺少方向時，先提出明確目標。
更新：主動之後，也檢查是否過度用力。
坤｜順與承載。
提問：目前需要承接、支持或配合什麼條件？
例子：先了解學生程度，再安排進度。
更新：配合情境，同時保留責任與界線。
震｜動。
提問：什麼變化正在打破原本節奏？
例子：新任務出現，原本安排需要調整。
更新：先穩住，再決定第一步。
巽｜入。
提問：怎樣逐步進入，而非一次強推？
例子：每天練習少量句型，逐步形成習慣。
更新：觀察累積效果，調整方法。
坎｜險。
提問：風險在哪裡，需要什麼準備？
例子：合作前確認費用、責任與退出條件。
更新：依實際風險決定進退。
離｜明。
提問：哪些資訊需要看清楚？
例子：區分原始資料、個人解讀與宣傳說法。
更新：確認依據，再形成判斷。
艮｜止。
提問：現在應該在哪裡停下來？
例子：爭吵開始失控時，暫停對話。
更新：停止之後，安排合適的重談條件。
兌｜悅與交流。
提問：怎樣讓交流有理解，也有分寸？
例子：先聽需要，再提出可行協助。
更新：確認對方是否真的聽懂與接受。
以上是簡化的教學轉譯，並非完整卦義。
【機制層｜接入生命更新的方式】
第一步｜用人類圖分類提出自我觀察問題。
例如：我是否因為想證明價值而過度承諾？
第二步｜用易經視角觀察情境與時機。
例如：現在適合推進、等待、協商，還是停止？
第三步｜回到十九層定位卡點。
例如：問題主要在身分、權重、狀態與決策。
第四步｜提出能核對的行動。
例如：新請託先確認時間，再回覆能承擔多少。
第五步｜用結果修正理解。
例如：表達界線後，安排更清楚，就保留做法。
【對應情緒圖】
恐懼：觀察風險、資訊與安全條件。
憤怒：觀察界線、壓力與表達方式。
驕傲：觀察身分是否依賴比較。
勇氣：觀察是否開始採取可承受的行動。
主動：觀察投入是否符合目標。
寬容：觀察能否容納不同解釋。
明智：觀察證據、選項與適用範圍。
愛：觀察是否同時照顧自己與他人的需要。
平和：觀察是否增加回應空間，而非壓下問題。
這些是主題連結，不能說某種情緒只屬於某個中心或某一卦。
【行動層｜完整生活案例】
情境：家人臨時要求妳處理事情。
感受：內疚、憤怒與壓力。
人類圖提問：我是否靠答應證明價值？我是否急著解除壓力？
易經提問：現在需要承擔、協商，還是先停止增加負荷？
十九層定位：身分→權重→狀態→預測→決策。
舊預測：「不全部幫忙，就會被討厭。」
新行動：「我今天能處理這部分，其餘需要另外安排。」
回饋：對方如何回應？責任是否更清楚？
模型更新：依持續結果調整，不由一次反應決定全部關係。
【使用原則】
分類用來增加提問，避免把自己鎖成固定類型。
卦義用來觀察變化，具體決策仍要核對條件與後果。
每次都檢查：理解能否更新、資源能否流動、未處理問題是否持續累積。
</script>
<script type="text/plain" class="mod" data-id="meridian" data-title="經絡 × 五行 × 情緒 × 十九層" data-group="身心傳統・象徵系統">
可以把經絡與五行加入前面的整合架構，作為身心觀察與情境思考的另一套語言。
先分清：中醫傳統對應、實際身體感受，以及我們延伸設計的生活練習。
【本體層｜經絡與五行各在談什麼？】
經絡：中醫用來描述氣血運行、聯繫臟腑與身體部位的理論系統。
五行：以木、火、土、金、水，整理不同功能及其相互關係。
中醫的肝、心、脾、肺、腎包含傳統功能概念，不能逐項等同解剖器官。
情緒與臟腑的對應是中醫理論，不能只憑生氣、悲傷或恐懼，就判定某個器官生病。
【結構層｜五行、臟腑與經絡】
木｜肝、膽｜足厥陰肝經、足少陽膽經。
火｜心、小腸｜手少陰心經、手太陽小腸經。
火｜心包、三焦｜手厥陰心包經、手少陽三焦經。
土｜脾、胃｜足太陰脾經、足陽明胃經。
金｜肺、大腸｜手太陰肺經、手陽明大腸經。
水｜腎、膀胱｜足少陰腎經、足太陽膀胱經。
以上是中醫十二正經的傳統分類。
【五行情志｜傳統對應】
木、肝｜怒。
火、心｜喜。
土、脾｜思。
金、肺｜憂，亦常連同悲理解。
水、腎｜恐。
七情還包括驚，不能把所有複雜感受硬塞進五個互斥格子。
【機制層｜轉成五種生活觀察能力】
以下「能力對應」是教學比喻，不是中醫診斷。
①木｜方向、伸展與界線。
觀察問題：我想往哪裡走，現在被什麼阻擋？
情緒入口：憤怒、挫折、不耐煩。
生活例子：事情一直被臨時插隊，自己的重要工作做不完。
舊反應：「大家都故意找我麻煩。」
新觀察：我是否沒有說清楚容量與優先順序？
最小行動：指出一項需要保護的時間或責任界線。
回應句型：「我先完成原定工作，這件事需要排到明天。」
十九層接點：目標→權重→決策→實踐。
②火｜連結、表達與投入。
觀察問題：我是否有連結、有投入，也有適當停止？
情緒入口：喜悅、興奮、期待。
生活例子：與人聊天很開心，卻一路聊到超過休息時間。
舊反應：「開心就繼續，之後再說。」
新觀察：眼前的投入，是否排擠其他重要需要？
最小行動：保留交流，也約定結束時間。
回應句型：「今天聊得很開心，我們先到這裡，下次再繼續。」
十九層接點：狀態→權重→實踐→生命。
③土｜整理、承接與落實。
觀察問題：資訊與責任進來後，我能否整理成可處理的部分？
情緒入口：思考、掛心、反覆想。
生活例子：收藏很多文章，卻不知道今天該用哪一篇。
舊反應：「再看更多，我就會明白。」
新觀察：目前缺的是資料，還是分類與行動？
最小行動：把問題拆成三項，只先處理一項。
回應句型：「我先整理已知資訊，再決定下一步。」
十九層接點：知識→認知→實踐→果子。
④金｜分辨、收束與失落。
觀察問題：哪些需要留下，哪些需要結束，哪些失落需要被承認？
情緒入口：悲傷、憂愁、遺憾。
生活例子：一段合作已經結束，自己仍反覆想著當初。
舊反應：「只要繼續想，就能把過去改好。」
新觀察：現在還能補救什麼，又有哪些需要接受？
最小行動：完成一項交接、道謝、道歉或告別。
回應句型：「這段經驗很重要，我也需要開始安排接下來的生活。」
十九層接點：回饋→差異→察驗→模型更新。
⑤水｜安全、儲備與等待。
觀察問題：我有多少資源，哪些風險需要準備？
情緒入口：恐懼、不安、擔憂。
生活例子：擔心未來收入，卻一直想最壞結果，沒有整理帳目。
舊反應：「一定會出事。」
新觀察：哪些是已知風險，哪些仍是猜測？
最小行動：列出可用資源、必要支出與一項備案。
回應句型：「我先確認現況，再準備能做的部分。」
十九層接點：狀態→預測→決策→再測。
【五行相生｜傳統次序與教學比喻】
相生：木生火→火生土→土生金→金生水→水生木。
教學比喻：方向→投入→落實→整理→儲備→新方向。
方向清楚，較容易投入。
投入需要整理成持續做得到的安排。
做過之後，需要分辨哪些有效。
整理結果，再留下資源與經驗。
有了儲備，才有條件開始下一輪。
這是借五行次序設計的學習流程，並非人體運作的固定流水線。
【五行相剋｜傳統次序與調節比喻】
相剋：木剋土、土剋水、水剋火、火剋金、金剋木。
「剋」在這裡可以先理解為制約關係，不必解讀成善惡或敵對。
教學比喻：每種能力都需要適當限制，避免無限擴張。
木剋土：用明確方向，限制無止境反覆整理。
土剋水：用具體安排，縮小沒有邊界的擔憂。
水剋火：用資源與風險檢查，調節過度興奮。
火剋金：用真實連結，鬆動過度僵硬的規則。
金剋木：用界線與取捨，限制過度擴張。
以上是生活比喻，不能據此自行診斷或治療。
【經絡如何接入情緒紀錄？】
先記錄可觀察的身體感受，暫不急著替它命名為經絡堵塞。
感受位置：肩頸、胸口、腹部或其他部位。
感受形式：緊、痛、熱、麻、沉重或疲累。
出現條件：什麼時間、活動與情境？
持續情況：多久、是否反覆、如何變化？
伴隨反應：當時想到什麼、做了什麼？
需要中醫判斷時，把這些紀錄交給合格中醫師綜合辨證。
單憑情緒、疼痛位置或網路經絡圖，不足以判定是哪條經絡出了問題。
【與霍金斯情緒圖的接法】
憤怒，可借木的方向與界線提問。
喜悅，可借火的連結與投入提問。
反覆掛心，可借土的整理與承接提問。
悲傷，可借金的失落與收束提問。
恐懼，可借水的安全與儲備提問。
羞愧、內疚、愛、勇氣等狀態，需要再看具體情境，不必強制歸到單一五行。
霍金斯數字不能換算成經絡通暢度或臟腑健康分數。
【與易經、人類圖的分工】
易經：提供局勢、變化、進退與時機的思考。
人類圖：提供分類式自我觀察問題。
五行：提供功能與制約關係的傳統語言。
經絡：提供中醫身體關聯的理論框架。
十九層：把觀察轉成提問、行動、回饋與更新。
不同系統可以並列比較，無須把所有名詞說成同一種本體。
【行動層｜家庭衝突完整案例】
情境：家人突然要求妳接手一件事。
身體觀察：肩頸緊，說話速度加快。
情緒辨認：生氣，也怕拒絕後被責怪。
木的提問：哪條界線被跨過？
火的提問：怎麼表達仍保留尊重？
土的提問：事情能否拆開分工？
金的提問：哪些責任需要明確交還？
水的提問：目前資源與安全條件是否足夠？
具體回應：「我能協助這部分，其餘需要你安排。」
結果觀察：責任是否更清楚，實際負荷是否改變？
模型更新：根據持續結果，調整協助範圍與表達方式。
【每天五句紀錄】
方向：今天真正重要的是什麼？
連結：我需要向誰表達或求助？
整理：哪件事可以拆小？
取捨：哪件事需要停止或交還？
儲備：今天要保留哪些時間與資源？
成效看選擇是否增加、責任是否清楚、生活是否更可持續，不用五行替自己或別人貼固定標籤。
</script>
<script type="text/plain" class="mod" data-id="ayurveda" data-title="阿育吠陀 Ayurveda｜三 Dosha 與情緒" data-group="身心傳統・象徵系統">
【① 本體：它在關心什麼？】
核心問題：一個人的生活方式，是否適合自己當下的需要？
簡單英文：What does my body need now?
生活例子：同樣是讀書讀不下去，有人是太緊張，有人是太急，有人是太累。
先看原因，再選擇行動。
【② 結構：五大元素｜Five Elements】
阿育吠陀以空、風、火、水、地，描述身體與自然的不同特性。
這些是傳統分類概念，不能直接當作現代化學元素或人體測量值。
空｜Space：空間、容納。
風｜Air：移動、變化。
火｜Fire：熱、轉化。
水｜Water：流動、滋潤。
地｜Earth：穩定、支撐。
方便理解的生活比喻：房間需要空間、空氣、溫度、水分與穩固的結構。
比喻可以幫助理解，但不能拿來判斷疾病。
【③ 三種作用傾向｜Three Doshas】
Dosha 常譯為體質或生命能量，但在傳統理論中，也指身體運作的三種功能原則。
每個人都有三者，不是只能被分進其中一類。
Vata｜瓦塔：空與風，重點是移動。
Pitta｜皮塔：以火的特性為主，重點是轉化。
Kapha｜卡帕：水與地，重點是穩定與支撐。
這些分類不等於人格診斷，也不代表一生固定不變。
【④ 接到情緒：三種觀察角度】
以下是為你的情緒與生命更新架構設計的教學比喻，不是體質診斷。
【Vata｜移動：我是不是太散？】
觀察：想法一直跳，事情開很多頭，注意力很難停下來。
生活例子：女兒一邊寫作業，一邊回訊息，一邊擔心明天考試。
可問：現在最需要先完成哪一件事？
小行動：把待辦寫下來，只選一個小步驟。
中文提醒：先安定，再前進。
簡單英文：One thing at a time.
【Pitta｜轉化：我是不是太急？】
觀察：很想做好、很在意結果，也容易對自己或別人不耐煩。
生活例子：女兒錯一題，就說自己很笨，接著越寫越生氣。
可問：我現在是在找方法，還是在責罵自己？
小行動：暫停一下，再把錯誤分成看錯、觀念不懂或時間不夠。
中文提醒：把力氣用在修正方法。
簡單英文：Slow down. Find a better way.
【Kapha｜穩定：我是不是停住了？】
觀察：不想改變，遲遲無法開始，習慣待在熟悉的地方。
生活例子：女兒知道要準備報告，卻一直說等一下。
可問：第一步能不能小到現在就開始？
小行動：先開文件，寫下標題和第一個問題。
中文提醒：先開始一點點。
簡單英文：Start with one small step.
【⑤ 阿育吠陀與中醫五行】
阿育吠陀：空、風、火、水、地。
中醫五行：木、火、土、金、水。
兩者都有整體觀，也都關心人與環境的關係。
但元素的定義、分類與理論不同，不能逐項畫等號。
阿育吠陀的風，不等於中醫的木。
阿育吠陀的地，不等於中醫脾土的全部意義。
兩套系統中的火與水，也不能只因名稱相同就視為同一機制。
可以比較它們如何描述變化、轉化與穩定。
不能因此推定它們測量的是同一種能量。
【⑥ 接到你的十九層生命更新架構】
阿育吠陀可提供傳統的生活觀察語言。
十九層架構可用來整理觀察、選擇行動與檢查結果。
狀態｜State：我現在感受到什麼？
預測｜Prediction：照這樣下去，可能發生什麼？
決策｜Decision：我現在要調整哪一件事？
實踐｜Practice：做一個可以完成的小行動。
回饋｜Feedback：做完之後，有什麼實際變化？
差異｜Difference：結果和原本預期差在哪裡？
模型更新｜Model Update：下次要保留或修改什麼？
不需要先判定自己是哪種體質，才可以開始觀察和調整。
【⑦ 高中生完整例子】
情境：明天考試，女兒坐在書桌前卻讀不下去。
第一種可能：事情太多，腦袋太亂。
做法：列出範圍，先選一個小單元。
第二種可能：太怕考不好，一直責怪自己。
做法：先說出擔心，再找一個具體問題處理。
第三種可能：已經疲累，或不知道怎麼開始。
做法：先確認休息需求，再把任務拆小。
同一個行為，可能有不同原因。
先理解當下需要，才能選擇合適的支持。
【⑧ 親子可以這樣說】
「我看到你現在很難開始。」
“I see that it is hard to start.”
「你是太累、太擔心，還是不知道先做什麼？」
“Are you tired, worried, or unsure what to do first?”
「我們先選一小步。」
“Let’s choose one small step.”
「做完再看看，這個方法有沒有幫助。」
“Then let’s see if it helps.”
【⑨ 每天三個問題】
我現在需要安定嗎？
Do I need to slow down?
我現在需要調整方法嗎？
Do I need a better way?
我現在需要開始一小步嗎？
Do I need to take one small step?
</script>

<script type="text/plain" class="mod" data-id="solarterms" data-title="阿育吠陀 × 中醫五行人 × 二十四節氣養生" data-group="身心傳統・象徵系統">
核心：把「個人傾向、當下狀態、環境變化」一起看，才能選擇適合的生活調整。
本體層：人會隨作息、壓力、飲食與環境改變，體質分類不宜變成固定身分。
結構層：阿育吠陀用三種 Dosha，中醫五行用木火土金水，節氣則提供年度環境變化的時間座標。
機制層：環境與生活負荷改變後，原本適合的方法可能不再適合，需要根據身體回饋更新。
行動層：先觀察，再小幅調整，記錄結果，保留有效做法。
【一｜先分清三套分類】
阿育吠陀三 Dosha：Vata、Pitta、Kapha。
中醫五行人：木形人、火形人、土形人、金形人、水形人，源於傳統五形分類。
中醫常見九種體質：平和、氣虛、陽虛、陰虛、痰濕、濕熱、血瘀、氣鬱、特稟。
五形人與九種體質不是同一套分類，不能直接互換。
以下五行人的性格描述，是方便理解的教學整理，不能靠個性、外貌或一項症狀判定體質。
【二｜阿育吠陀如何對應五行人？】
只能比較部分特性，沒有可靠的一對一換算表。
Vata 的移動與變化，可類比木的伸展與活動，但不能直接說 Vata 就是木型人。
Pitta 的熱與轉化，可類比火的熱烈與活躍，但不能直接說 Pitta 就是火型人。
Kapha 的穩定與支撐，可類比土的承載，也帶有水的滋潤意象，但不等於土型或水型。
金的收斂、界線與條理，在三 Dosha 中沒有單一、完整的對應。
對應的用途是增加觀察角度，不是合併成一套診斷。
【三｜五行人的生活觀察版】
① 木｜Wood｜方向與伸展。
傳統關聯：春、肝膽、怒。
教學觀察：重視進展、目標與自主，受阻時可能急著突破。
生活例子：讀書計畫被打亂，就想把其他事情全部排除。
觀察問題：我是在調整方法，還是在強迫一切照計畫？
最小行動：把目標保留，把路徑改成兩個可選方案。
更新方向：從只有一條路，變成能因情境換路。
簡單英文：Keep the goal. Change the way.
② 火｜Fire｜連結與表達。
傳統關聯：夏、心與小腸、喜。
教學觀察：重視互動、投入與被回應，容易安排過多活動。
生活例子：白天上課，晚上聊天、追劇，明明累了還不想停。
觀察問題：這些活動讓我恢復，還是讓我更難安定？
最小行動：睡前留一段安靜、低刺激的時間。
更新方向：讓投入與休息可以交替。
簡單英文：Enjoy life. Make time to rest.
③ 土｜Earth｜承載與整合。
傳統關聯：長夏、脾胃、思。
教學觀察：重視照顧、穩定與周全，可能反覆替別人操心。
生活例子：替全家安排飲食，卻把自己的用餐與休息一直往後放。
觀察問題：我承擔的事，哪些可以分出去？
最小行動：固定自己的用餐時間，交回一件別人能完成的事。
更新方向：讓支持成為可持續的分工。
簡單英文：Care for others. Care for yourself.
④ 金｜Metal｜界線與收斂。
傳統關聯：秋、肺與大腸、悲憂。
教學觀察：重視標準、條理與完成，也可能難以接受不完美。
生活例子：英文作文一直修改第一段，最後整篇寫不完。
觀察問題：現在需要更精準，還是先完成？
最小行動：設定完成時間，先交出可以修改的版本。
更新方向：讓標準服務行動，並隨回饋修正。
簡單英文：Finish first. Improve next.
⑤ 水｜Water｜儲備與安全。
傳統關聯：冬、腎與膀胱、恐。
教學觀察：重視安全、準備與風險，也可能因擔心而延後行動。
生活例子：怕報告講不好，所以一直蒐集資料，卻不開始練習。
觀察問題：我還缺必要資訊，還是需要一次小規模練習？
最小行動：先對手機講一分鐘，再聽一次錄音。
更新方向：用可承受的嘗試，取得比想像更具體的回饋。
簡單英文：Try a little. Learn from it.
【四｜五行與季節的接法】
春木：生發，提醒自己逐步增加活動與展開計畫。
夏火：生長，提醒自己在投入活動時兼顧散熱與休息。
長夏土：傳統常以夏末濕熱時段說明，也有土寄四季的說法。
秋金：收斂，提醒自己整理負荷，觀察乾燥與溫差。
冬水：收藏，提醒自己保留恢復時間，依實際低溫保暖。
五行有五類，一年常分四季，因此土不能硬塞成固定六個節氣。
二十四節氣也沒有公認的「每個節氣專屬某一型人」配方。
【五｜二十四節氣養生：生活操作版】
以下是依季節整理的日常觀察與行動，不是節氣治病處方。
【春季｜立春到穀雨】
01｜立春｜重新建立規律。
觀察：假期或冬季留下的晚睡、久坐是否仍在延續？
行動：先固定起床時間，白天安排一小段散步。
02｜雨水｜留意環境濕度。
觀察：房間、寢具與衣物是否潮濕？
行動：依實際濕度通風或除濕，保持寢具乾爽。
03｜驚蟄｜逐步恢復活動。
觀察：是否因天氣轉暖，突然增加過多運動？
行動：從原本能負擔的量開始，再逐步增加。
04｜春分｜檢查生活分配。
觀察：讀書、工作、睡眠與活動，哪一項長期被擠掉？
行動：先補回最缺的一項，不必追求每項時間完全相等。
05｜清明｜兼顧戶外與休息。
觀察：出遊、掃墓後是否疲累，或出現鼻眼不適？
行動：依天氣與空氣狀況安排活動，返家更換衣物。
06｜穀雨｜檢查飲食與保存。
觀察：天氣轉暖後，是否仍把餐點長時間放在室溫？
行動：注意食物保存，維持規律用餐。
【夏季｜立夏到大暑】
07｜立夏｜調整活動時段。
觀察：中午活動是否讓自己明顯不舒服？
行動：把較費力的戶外活動移到較涼時段。
08｜小滿｜檢查悶熱與潮濕。
觀察：運動後是否長時間穿著濕衣？
行動：更換汗濕衣物，保持生活環境舒適。
09｜芒種｜忙碌時保留恢復。
觀察：是否因工作或考試，連續延後吃飯與睡覺？
行動：先在行程中固定用餐與休息時間。
10｜夏至｜管理晚間刺激。
觀察：是否因白天較長，連帶把睡眠一直往後推？
行動：保留固定的睡前收尾流程。
11｜小暑｜留意熱負荷。
觀察：活動時的熱、疲累與不適，是否超過平常？
行動：安排飲水、遮蔭與休息，不用意志力硬撐。
12｜大暑｜降低過度消耗。
觀察：是否把大量流汗當成排毒或運動有效的證明？
行動：依體力與天氣調整強度，不追求流汗越多越好。
【秋季｜立秋到霜降】
13｜立秋｜先看天氣，再改作法。
觀察：日曆入秋，但所在地是否仍炎熱？
行動：若仍高溫，持續防暑，不因節氣到了就急著進補。
14｜處暑｜重新分配負荷。
觀察：開學或工作轉忙後，活動與休息安排是否仍合適？
行動：依新作息調整，不沿用已不適用的暑假計畫。
15｜白露｜留意早晚溫差。
觀察：通勤、教室與戶外的溫度差有多大？
行動：準備可增減的衣物。
16｜秋分｜整理累積的負擔。
觀察：哪些承諾、通知與待辦已超出可用時間？
行動：刪減一項低優先工作，為重要事情留出空間。
17｜寒露｜觀察乾燥與冷暖。
觀察：嘴唇、皮膚是否乾燥，還是所在地仍濕熱？
行動：依實際狀況補充日常飲水、使用保濕用品或調整環境。
18｜霜降｜準備轉冷。
觀察：外出衣物與寢具是否適合近期氣溫？
行動：整理換季用品，活動前逐步暖身。
【冬季｜立冬到大寒】
19｜立冬｜先檢查需要，再談進補。
觀察：自己是真的吃不夠、休息不夠，還是只是看到冬令補品就想吃？
行動：先穩定日常飲食與睡眠，藥膳需考慮個人病況與用藥。
20｜小雪｜保留日間活動。
觀察：是否因天冷，整天待在室內久坐？
行動：依天氣安排散步，長時間坐著時起身活動。
21｜大雪｜照顧冷天環境。
觀察：室內是否低溫、潮濕，或使用暖氣後過乾？
行動：調整衣物、寢具與室內環境。
22｜冬至｜把恢復排進生活。
觀察：年底是否事情越多，睡眠越少？
行動：減少不必要的晚間行程，保留足夠睡眠時間。
23｜小寒｜避免突然高強度活動。
觀察：身體還沒暖開，就急著跑步或搬重物嗎？
行動：先以較輕活動暖身，再依狀態增加強度。
24｜大寒｜回顧一年的有效做法。
觀察：哪些習慣確實改善生活，哪些只是跟風？
行動：保留有效習慣，選一個需要更新的環節帶入新年度。
【六｜臺灣版本的關鍵修正】
節氣是時間座標，實際氣候才是當下輸入。
屏東的立冬可能仍熱，臺北同一天可能濕冷。
同樣住在臺北，戶外活動者與整天待冷氣房的人，面對的環境也不同。
決策順序：實際天氣→室內環境→身體感受→活動負荷→調整方式。
不要只因入秋就一律潤燥，也不要只因入冬就一律溫補。
【七｜用控制論整理養生】
輸入：溫度、濕度、作息、飲食與活動量。
狀態：精神、睡眠、食慾、排便與身體感受。
行動：一次調整一個容易執行的小習慣。
回饋：記錄調整後的變化，也記錄同時發生的其他事件。
誤差修正：結果與預期不同，就重新檢查原因，不急著說是體質不好。
模型更新：把「我一直都是這種人」改成「這個情境下，我需要這種支持」。
症狀若持續或加重，應及時評估，不必等滿兩週。
【八｜對應女兒的生活例子】
情境：天氣悶熱、考試將近、宿舍晚睡，開始煩躁與讀不下去。
舊解讀：我是火型人，所以脾氣就是這樣。
更新解讀：先查看睡眠、室溫、考試壓力與用餐是否一起改變。
最小行動：今天先改善一項可控制條件，再觀察精神與讀書狀況。
親子句型：先看你現在需要什麼，再一起調整方法。
簡單英文：Let’s see what you need and make one small change.
成長：更能辨認什麼情境需要什麼方法，並根據結果修正預測。
自由：能參考分類，也能在新證據出現時離開舊標籤。
</script>
<script type="text/plain" class="mod" data-id="wuyun" data-title="五行人 × 節氣 × 五運六氣 × 六經傳變" data-group="身心傳統・象徵系統">
核心接法：五行提供傳統分類，節氣提供時間座標，五運六氣描述歲時變化，六經辨證辨識病證及其轉變。
它們可以互相參照，但不能排成「某種人到了某節氣，就一定生某種病」的公式。
【一｜本體層：先分清它們在回答什麼】
五行人：傳統如何描述人的形態與傾向？
二十四節氣：一年運行到什麼時間位置？
五運六氣：傳統如何推演年度與季節的氣候變化？
六經辨證：當下的病證呈現什麼組合？
六經傳變：病證如何隨時間發生改變？
阿育吠陀：另一套印度傳統醫學分類，不能與上述概念直接互換。
用維根斯坦的語言觀來提醒：同一個名稱出現在不同系統中，要先看它如何被使用。
例如「太陽寒水」與「太陽病」共用太陽之名，卻不是同一個判斷。
【二｜結構層：五運是什麼？】
五運：木運、火運、土運、金運、水運。
這裡的「運」指傳統歲時運行概念，不是個人的運氣好壞。
中運，又稱歲運：描述一年的運氣背景。
主運：一年內依木、火、土、金、水次序劃分的五步。
客運：依當年條件推排、與主運配合觀察的變化。
太過與不及：傳統用來描述某運偏盛或偏弱的術語。
太過不等於人的能量比較高，不及也不等於人的價值比較低。
歲運按天干配對：甲己土、乙庚金、丙辛水、丁壬木、戊癸火。
這套配法不能直接拿天干本來的五行屬性代替。
依傳統推算法，陽干年多論太過，陰干年多論不及。
這些是理論推排結果，不能單獨證明當年的實際天氣或個人疾病。
【三｜結構層：六氣是什麼？】
一般六氣：風、寒、暑、濕、燥、火。
在運氣學說中，常以三陰三陽配合五行描述六氣。
厥陰風木：風。
少陰君火：熱。
少陽相火：暑熱。
太陰濕土：濕。
陽明燥金：燥。
太陽寒水：寒。
五行只有五類，六氣有六類，因為火再區分君火與相火。
六氣是傳統氣候分類；六淫則指傳統理論中成為致病因素的偏異之氣。
不能只看到風吹、下雨或天熱，就判定自己已經受邪。
【四｜六氣如何接到二十四節氣？】
以下是「主氣」的固定次序，每一步約涵蓋四個節氣。
初之氣｜厥陰風木｜大寒起，至春分前。
包含：大寒、立春、雨水、驚蟄。
二之氣｜少陰君火｜春分起，至小滿前。
包含：春分、清明、穀雨、立夏。
三之氣｜少陽相火｜小滿起，至大暑前。
包含：小滿、芒種、夏至、小暑。
四之氣｜太陰濕土｜大暑起，至秋分前。
包含：大暑、立秋、處暑、白露。
五之氣｜陽明燥金｜秋分起，至小雪前。
包含：秋分、寒露、霜降、立冬。
終之氣｜太陽寒水｜小雪起，至下一個大寒前。
包含：小雪、大雪、冬至、小寒。
注意：主氣從大寒起算，不能直接套用「立春開始的四季六節氣」分組。
主氣是傳統年度底圖，不保證所在地每天呈現相同天氣。
【五｜主氣、客氣、司天、在泉】
主氣：每年固定的六步背景。
客氣：依當年地支推排的六步變化。
司天：傳統上概括上半年氣候傾向的主導位置。
在泉：傳統上概括下半年氣候傾向的主導位置。
司天與在泉相互配對，不是兩個解剖部位。
主客加臨：把固定主氣與當年客氣疊合推演。
這套模型的傳統用途，是增加對歲時變化的預判。
實際應用仍要查看所在地天氣與個人狀況，不能只靠干支開出個人處方。
【六｜六經辨證是什麼？】
六經：太陽、陽明、少陽、太陰、少陰、厥陰。
《傷寒論》的六經病，是綜合症狀、病機與病勢的辨證架構。
它與經絡、臟腑有關，但不能簡化成六條經絡堵塞。
也不能把它當作六個人格類型或六層情緒高低。
以下只列典型辨識方向，不能用單一症狀自行確診。
太陽病：常見惡寒、發熱、頭項不適等表證特徵。
陽明病：主要辨識裡熱、燥實等病證。
少陽病：常見往來寒熱、口苦、咽乾、胸脅不適等特徵。
太陰病：主要辨識脾胃虛寒、運化失常等病證。
少陰病：涉及心腎相關的整體病機，可分寒化與熱化。
厥陰病：可呈現寒熱錯雜、厥熱變化等複雜病證。
少陰不只有寒，厥陰也不能簡化成「最嚴重的一關」。
【七｜六氣與六經同名，如何對應？】
太陽寒水：運氣學說的六氣分類。
太陽病：六經辨證的病證分類。
陽明燥金：運氣學說的六氣分類。
陽明病：六經辨證的病證分類。
其餘少陽、太陰、少陰、厥陰，也要先區分使用語境。
不能因為當時是太陽寒水，就判定病人一定是太陽病。
不能因為某人有陽明病，就推定當年必定燥氣偏盛。
兩者的理論聯繫可以研究，但名稱相同不足以完成診斷。
【八｜六經傳變不是固定闖六關】
傳經：病證由某一經轉變為另一經。
循經傳：按傳統排列次序出現傳變。
越經傳：不依相鄰次序而轉變。
表裡傳：相互表裡的經之間發生傳變。
直中：起病即呈現三陰病證，不必先有三陽病證。
合病：兩經或三經病證同時出現。
並病：一經病證未解，又出現另一經病證，有先後次序。
所以，不能把「太陽→陽明→少陽→太陰→少陰→厥陰」當成每個人必走的病程。
也不能把六經排成單一、固定的嚴重程度量尺。
【九｜機制層：用動態系統理解，但不混成同一理論】
環境背景：季節、溫度、濕度與生活場域。
個人條件：既往病況、作息、飲食、活動與當下承受能力。
當下表現：身體實際出現的症狀與變化。
時間軌跡：症狀何時開始、如何改變、介入後如何反應。
五運六氣偏向提供傳統背景假設。
六經辨證偏向整理當下病證。
六經傳變偏向追蹤病證的時間變化。
以控制論作教學比喻：背景模型提供預期，實際觀察用來修正預期。
這是比較方法，不代表已證明古代理論等同現代控制系統。
【十｜接回五行人與阿育吠陀】
木型傾向，不代表一定有厥陰病。
火型傾向，不代表一定有少陰或少陽病。
土型傾向，不代表一定有太陰病。
金型傾向，不代表一定有陽明病。
水型傾向，不代表一定有太陽病。
Vata 不能直接等於風邪或厥陰病。
Pitta 不能直接等於陽明病或少陽相火。
Kapha 不能直接等於濕邪或太陰病。
個人分類、環境分類、疾病辨證，必須分開記錄，再檢查是否真的存在關聯。
【十一｜生活例子：同一節氣，兩個人需要不同調整】
情境：立秋之後，屏東仍然炎熱。
甲每天戶外工作，大量流汗。
乙整天待在冷氣很強的辦公室，常覺得冷。
兩人處於同一節氣，實際承受的環境卻不同。
甲需要先評估熱負荷、飲水與休息。
乙需要先調整冷氣暴露、衣物與活動。
如果只照「秋天應該怎麼補」統一安排，就可能忽略真正需要調整的條件。
節氣提供提醒，個人的實際狀況決定行動。
【十二｜接到十九層生命更新架構】
知識：先知道每套術語的定義與範圍。
認知：把歲時背景、個人條件與病證分開。
狀態：記錄當下可觀察的變化。
預測：寫下調整後預期改善什麼。
決策：選擇低負擔、可評估的小行動。
實踐：確實執行，而非一次改動所有事情。
回饋：觀察實際結果與其他同時變化的條件。
差異：辨認預測與結果不一致的地方。
察驗：檢查是觀察不足、分類錯誤，還是行動不適合。
模型更新：修正原先判斷，不把所有結果都解釋成理論正確。
再測形成：在適合的條件下重新觀察，逐步形成可靠習慣。
【十三｜每天可用的五行紀錄】
今天的節氣與實際天氣：＿＿。
今天主要待的環境：＿＿。
今天的睡眠、飲食與活動：＿＿。
今天身體最明顯的變化：＿＿。
今天調整什麼、之後發生什麼：＿＿。
紀錄可以幫助就診與辨證，但不能代替診斷。
出現呼吸困難、胸痛、意識改變或嚴重脫水等狀況，應立即就醫，不等待判斷傳到哪一經。
</script>

<script type="text/plain" class="mod" data-id="tarot" data-title="塔羅 × 五行 × 節氣 × 五運六氣 × 六經" data-group="身心傳統・象徵系統">
核心接法：把塔羅當成提問與敘事工具，協助看見情境、假設與選擇。
以下對應是為你的生命更新課程設計的教學模型，不是各傳統原有的共同分類。
牌面可以提出問題，實際證據用來判斷問題是否成立。
【一｜本體層：塔羅在這個架構中的位置】
塔羅：呈現象徵，幫助說出原本難以表達的經驗。
五行：提供生發、活躍、承載、收斂、收藏的觀察角度。
節氣：提醒時間與環境正在改變。
五運六氣：提供傳統歲時變化的理解框架。
六經辨證：屬於中醫病證辨識，不能由塔羅代替。
十九層生命更新：把提問接成行動、回饋與模型修正。
用維根斯坦的語言觀提醒：先問一個象徵如何被使用，再問它是否適合當下情境。
用海德格的處境視角提醒：理解一個人，要看他正在面對什麼、在乎什麼，以及有哪些可行選擇。
這些是哲學上的閱讀角度，不是兩位哲學家對塔羅效力的背書。
【二｜結構層：先分清塔羅四元素與中醫五行】
常見西方塔羅元素配法：權杖配火、聖杯配水、寶劍配風、錢幣配土。
這裡的風不是中醫風邪，水也不是中醫腎水。
塔羅四元素沒有直接對應中醫五行的木與金。
兩套分類不能逐項換算，但可以比較部分功能意象。
以下採用「功能相近」的課程接法，保留差異。
【三｜木：生發、方向與啟動】
塔羅象徵：權杖的行動意象、魔術師的資源運用意象。
共同提問：我想展開什麼，手上已經有什麼？
失衡觀察：一直規畫卻不開始，或只准自己走一條路。
生活例子：想做英文APP，卻一直增加功能，沒有推出第一版。
最小行動：選一個學生最需要的功能，先讓三個人試用。
回饋指標：他們能否完成原本要完成的任務？
更新機制：依使用障礙修正功能，而非只增加內容。
簡單英文：Use what you have. Take one step.
【四｜火：投入、表達與連結】
塔羅象徵：權杖的熱情意象、太陽的展現意象。
共同提問：我的投入正在支持什麼，又消耗了什麼？
失衡觀察：活動過滿，靠持續興奮維持行動。
生活例子：每天經營多個LINE群，回覆到深夜，隔天教課疲累。
最小行動：設定回覆時段，保留不被訊息打斷的休息。
回饋指標：回覆品質與隔日精神是否改善？
更新機制：讓服務量配合可持續的承受能力。
簡單英文：Share your light. Make time to rest.
【五｜土：承載、資源與落地】
塔羅象徵：錢幣的資源意象、皇后的滋養意象。
共同提問：什麼條件能讓這件事長期運作？
失衡觀察：把所有照顧責任集中在自己身上。
生活例子：會員服務、訂單、出貨與售後都由自己處理。
最小行動：把一項重複工作寫成清楚流程。
回饋指標：別人能否照流程完成，錯誤是否減少？
更新機制：把個人硬撐改成可交接的支持結構。
簡單英文：Build a system that supports you.
【六｜金：界線、辨識與取捨】
塔羅象徵：寶劍的判斷意象、正義的責任與衡量意象。
共同提問：哪些是事實，哪些是推測，責任應由誰承擔？
失衡觀察：追求絕對正確，或把批判當成唯一處理方法。
生活例子：家人沒有回訊息，就推定對方不尊重自己。
最小行動：分開寫下「看到的事實」與「自己的解讀」。
回饋指標：取得新資訊後，原先解讀是否需要修改？
更新機制：讓判斷能被證據修正。
簡單英文：Check the facts before you decide.
【七｜水：儲備、未知與等待】
塔羅象徵：聖杯的感受意象、女祭司的留白意象、月亮的不確定意象。
共同提問：哪些事情還不知道，我需要什麼支持？
失衡觀察：把擔心當成預言，或一直等到完全確定才行動。
生活例子：女兒擔心同學不喜歡自己，於是更不敢開口。
最小行動：選一個安全情境，向一位同學提出具體小問題。
回饋指標：對方實際如何回應？
更新機制：用小規模互動取得資訊，修正對關係的預測。
簡單英文：You do not need to know everything to begin.
【八｜為什麼權杖同時出現在木與火？】
因為這是功能對照，不是一張牌只能屬於一行的固定分類。
權杖的啟動意象可幫助討論木，熱情意象可幫助討論火。
同一張牌也可能因問題不同，提出不同的觀察角度。
對應越多，不代表越準，必須說清楚比較的是哪個特性。
【九｜塔羅如何接二十四節氣？】
不要硬把二十二張大牌塞進二十四節氣。
可把節氣當作定期回顧的提醒，把牌面當作當次的提問素材。
春季｜展開：我正在培養什麼？
象徵提問牌：魔術師、皇后。
夏季｜投入：我的行動是否超出負荷？
象徵提問牌：戰車、力量、太陽。
季節交替｜整合：哪些安排需要重新分配？
象徵提問牌：節制、錢幣系列。
秋季｜取捨：哪些承諾應完成，哪些應停止？
象徵提問牌：正義、隱者、死神。
冬季｜儲備：什麼需要休息，什麼需要等待更多資訊？
象徵提問牌：隱者、女祭司、吊人。
同一張牌可以跨季節使用，因為問題比固定配牌更重要。
死神牌可作為結束與轉換的討論象徵，不用來預告死亡。
【十｜塔羅如何接五運六氣？】
只借用六種意象設計問題，不用牌面判定氣候或病邪。
風｜變動：最近哪些條件改變了？
寒｜收縮：什麼讓我的選擇變少？
暑｜負荷：我是否投入過量？
濕｜黏滯：哪件事情反覆拖延、難以收尾？
燥｜缺乏滋養：哪段生活只剩要求，缺少支持？
火｜升高與急迫：什麼讓我越來越難停下來？
上述「收縮、黏滯、滋養」是心理與生活比喻，不是中醫診斷。
抽到太陽不代表火運太過，抽到月亮也不代表寒濕。
【十一｜塔羅如何接六經傳變？】
六經是病證架構，塔羅不能辨認某人屬哪一經。
可以借用「狀態會變、問題會交疊」的觀點，設計動態觀察。
傳變的啟發：問題是否已經換了形式？
合病的啟發：是否同時存在幾個需要分開處理的問題？
並病的啟發：舊問題未解時，是否又增加新的負荷？
直中的啟發：不要假設所有事情都必須經過相同步驟。
以上只借用觀察思路，不把生活困難稱為六經病。
不要把太陽配愚者、陽明配太陽、厥陰配死神，再推成健康預測。
【十二｜機制層：塔羅如何幫助模型更新？】
第一步｜象徵：牌面讓某個主題進入注意。
第二步｜假設：我猜自己可能正在逃避衝突。
第三步｜證據：最近有哪些具體事件支持或反對這個猜測？
第四步｜替代解釋：我也可能只是疲累，或尚未取得足夠資訊。
第五步｜行動：做一個能區分不同解釋的小嘗試。
第六步｜回饋：觀察實際結果。
第七步｜更新：修正原先理解，也容許牌面的解讀不適用。
牌面引發聯想，聯想形成假設，假設需要接受現實檢查。
如果任何結果都能被解釋成牌很準，模型就失去修正能力。
【十三｜對應女兒：月亮牌的使用例子】
情境：女兒說「大家好像都不喜歡我」。
牌面問題：目前最不確定的是什麼？
事實：昨天在群組提問，暫時沒有人回覆。
原先預測：沒人回覆，代表大家排斥我。
替代解釋：大家忙、沒看到，或不知道怎麼回答。
最小行動：私下向一位同學詢問一件具體事情。
回饋：記錄實際回應，不替對方預先下結論。
模型更新：一次沒有回覆，不足以代表整段關係。
若確實出現持續排擠，則尋找支持與處理方式，不把責任歸給自己的能量。
親子句型：你的感受值得被聽見，我們也一起確認實際發生了什麼。
簡單英文：Your feelings matter. Let’s check what happened.
【十四｜接到十九層生命更新】
真理與知識：先確定資料來源與適用範圍，牌面不能取代這一步。
認知與身分：辨認解讀方式，避免把一張牌變成固定自我標籤。
目標與權重：我真正想保護什麼，哪些事情被放得太重？
狀態與預測：我現在如何，我預期接下來會怎樣？
決策與實踐：選擇一個可執行、可觀察的行動。
生命與果子：檢查長期行為和實際影響。
回饋與差異：看見結果與預期的落差。
察驗與悔改：分辨需要修正的判斷，以及需要承擔的具體責任。
模型更新與再測形成：改變方法，再觀察結果。
智慧：逐步提高對情境的理解與選擇品質。
【十五｜可直接做成課程或APP的六欄】
情境：實際發生什麼？
象徵：這張牌讓我想到什麼？
假設：我目前如何解讀？
證據：有哪些支持、反對與未知資訊？
行動：下一個能取得新資訊的小步驟是什麼？
更新：結果讓我修改了哪個判斷？
課程價值來自提問、紀錄與回饋品質，不能承諾算準健康、他人心意或未來。
自由：能使用象徵思考，也能在證據不同時放下原來的解讀。
</script>
<script type="text/plain" class="mod" data-id="daodejing" data-title="《道德經》× 情緒地圖 × 五行 × 生命更新" data-group="宗教・靈性・經典">
核心接法：用《道德經》檢查自己的執著、控制與行動方式，再把理解接到可觀察的生活改變。
《道德經》與五行、塔羅、阿育吠陀、六經辨證各有脈絡，以下是跨系統的教學對照，並非原典已有的共同分類。
引文採通行本，版本之間可能有字詞差異。
【一｜本體層：道不能被自己的模型完全裝下】
第一章：「道可道，非常道；名可名，非常名。」
解析：可以說明的道理與名稱，不能窮盡正在變化的世界。
模型語言：分類能幫助理解，也會省略情境與差異。
對應情緒圖：我現在感到恐懼，不代表我就是一個低等或固定低能量的人。
對應五行人：木型、火型等名稱，可以提供觀察角度，不能包辦一個人的全部。
對應塔羅：牌面提供一種解讀，不是事情唯一可能的答案。
生活例子：女兒一次考不好，不等於「她沒有讀醫學的能力」。
最小行動：把「她就是……」改寫成「她在這個情境下出現……」。
簡單英文：A label is not the whole person.
【二｜結構層：用六組關係理解變化】
① 有與無：看得到的成果，也需要看不見的空間與條件。
② 動與靜：行動需要展開，也需要停下來校準。
③ 剛與柔：堅持目標，也要保留改變方法的能力。
④ 盈與虛：承擔有上限，留白才能容納新資訊。
⑤ 得與失：短期獲得可能伴隨代價，短期失去也可能打開選擇。
⑥ 自為與代為：支持別人成長，也要讓對方保有行動與承擔的空間。
這些關係可以同時存在，不必把其中一端判成永遠正確。
【三｜無為：減少多餘干預】
第三十七章：「道常無為而無不為。」
解析：無為可以理解為不以過度、強制的方式擾動事物，不是放棄必要行動。
控制論比喻：干預太密、太急，可能讓系統沒有時間回應。
親子例子：每十分鐘問一次讀書進度，女兒可能把注意力放在應付追問。
最小行動：共同約定回報時間，其餘時間讓她自己安排。
回饋指標：自主完成率、求助品質與實際學習結果。
更新方向：根據回饋調整支持程度，不把少管或多管當成固定答案。
簡單英文：Give support. Leave room to act.
【四｜反者道之動：留意走到極端的代價】
第四十章：「反者道之動；弱者道之用。」
解析：反可涉及返回與相反方向的轉化，弱提示柔弱也能發揮作用。
複雜系統比喻：某種策略持續加強，效果不一定持續增加。
生活例子：為了提高成績一直壓縮睡眠，最後反而更難專心。
最小行動：當加倍努力仍無改善時，檢查策略、負荷與恢復條件。
更新問題：我需要增加力量，還是改變配置？
這不表示所有壞事都會自動變好，也不表示極端之後必然反轉。
簡單英文：More effort may need a better plan.
【五｜致虛守靜：讓新資訊進得來】
第十六章：「致虛極，守靜篤。」
解析：暫時放下搶著解釋與立即反應，才有空間看清變化。
預測模型比喻：舊解讀佔滿注意力時，容易漏掉與預期不同的資訊。
生活例子：家人語氣不好，就立刻認定對方故意羞辱自己。
最小行動：先記錄對方原話，再分開寫自己的推測。
更新問題：哪些是已知，哪些是我補上的故事？
簡單英文：Pause. Look again.
【六｜知止：建立可以持續的界線】
第四十四章：「知足不辱，知止不殆，可以長久。」
解析：辨認足夠與停止的位置，讓追求不至於吞掉其他重要事物。
系統語言：任何目標都需要資源上限與停止條件。
團購例子：增加會員人數，卻讓回覆、出貨與售後超出承受量。
最小行動：先訂服務時段、接單量與處理流程，再決定擴張速度。
更新問題：新增收入之後，時間成本與服務錯誤增加多少？
知足不等於拒絕成長，知止是讓成長有可持續的條件。
簡單英文：Know your limits. Build for the long run.
【七｜為學與為道：增加知識，也減少多餘】
第四十八章：「為學日益，為道日損。」
解析：求學可以累積知識；為道的減損，涉及放下妄為、執著與多餘造作。
生命更新接法：增加必要能力，也刪除已經不適用的假設與流程。
生活例子：收藏大量英文教材，卻沒有時間完成練習與訂正。
最小行動：保留一套主要教材，建立作答、訂正與再測循環。
回饋指標：相同錯誤是否減少，而非收藏資料是否增加。
簡單英文：Learn more. Remove what gets in the way.
【八｜小步形成：讓理解進入行動】
第六十四章：「合抱之木，生於毫末；九層之臺，起於累土。」
解析：可持續的成果，需要能累積的起點與過程。
行動設計：把任務縮小到今天可以完成，再依結果調整。
女兒例子：「把英文變好」改成「完成五題，說明每個錯誤」。
團購例子：「提升會員服務」改成「整理今天最常被問的一個問題」。
更新問題：這一步是否真的接近目標，還是只讓自己覺得忙？
簡單英文：Start small. Check your progress.
【九｜生而不有：支持而不佔有】
第五十一章：「生而不有，為而不恃，長而不宰，是謂玄德。」
解析：付出、培養與支持，不必轉成佔有、邀功或全面支配。
親子例子：提供學費與協助，不代表可以替孩子決定全部的人生。
最小行動：分清自己提供什麼、對方決定什麼、雙方共同承擔什麼。
界線：不支配別人，也不表示自己必須無限供應。
更新問題：我的支持正在增加對方的能力，還是增加對我的依賴？
簡單英文：Help them grow and make their own choices.
【十｜對應情緒地圖：不同狀態需要不同提問】
羞愧、自責：用「名可名，非常名」提醒自己，不把一次行為變成整個身分。
恐懼、焦慮：用「守靜」分開已知事實、未知條件與想像結果。
憤怒、控制：用「無為」檢查是否因焦急而過度干預。
慾望、過度追逐：用「知足、知止」檢查成本與停止條件。
驕傲、拒絕糾錯：用「日損」檢查自己捨不得放下的假設。
勇氣、主動：用「起於累土」把意願變成小步行動。
愛與關懷：用「生而不有」檢查是否保留彼此的自主與界線。
平靜：讓安定支持觀察與行動，而非成為逃避問題的理由。
這些是閱讀與實踐方向，不替情緒配置分數，也不把痛苦解釋成人格較低。
【十一｜對應五行：用五個問題循環檢查】
木｜生發：我準備展開什麼？
對應閱讀：第六十四章，從可累積的小步開始。
火｜投入：我是否因熱情而過度消耗？
對應閱讀：第四十四章，知道何時足夠、何時停止。
土｜承載：支持系統是否能承受目前的責任？
對應閱讀：第十一章，空間與留白也有用途。
金｜收斂：哪些假設與流程已經可以刪除？
對應閱讀：第四十八章，增加必要，減少多餘。
水｜收藏：我是否留出安靜觀察與恢復的時間？
對應閱讀：第十六章，致虛守靜。
這是五行意象與章義的教學配對，不是《道德經》原有的五行養生處方。
【十二｜對應節氣與五運六氣：不要讓固定方法壓過情境】
第二十五章：「人法地，地法天，天法道，道法自然。」
解析：「自然」在這裡可理解為自己如此、自然而然，不能只解釋成去戶外或使用天然產品。
生活接法：行動要考慮正在發生的條件，不能只靠固定日曆與標籤。
例子：立冬到了，屏東仍炎熱，就先依實際環境安排衣物與活動。
更新問題：我的方法是在回應今天的情境，還是在重複過去的習慣？
這段章義可以啟發適應性思考，不能用來證明五運六氣的個人預測。
【十三｜對應六經傳變：看見變化，不固守初判】
可借用的觀察原則：人的狀態會變，原先判斷也要重新檢查。
不可直接等同：道家的動靜、剛柔，不能替代六經辨證。
生活例子：原本以為女兒只是拖延，後來發現她是不理解題目。
更新行動：從催促完成，改成協助釐清觀念，再觀察效果。
若涉及疾病，仍須依實際病況評估，不能用章句、牌面或情緒標籤判定傳變。
【十四｜對應塔羅：象徵提出問題，回饋修正答案】
魔術師的資源意象：我能從哪個小步開始？
對應章義：第六十四章。
節制的調配意象：哪些投入需要重新分配？
對應章義：第四十四章的知止。
隱者的內省意象：我需要看清什麼，而非立刻回應什麼？
對應章義：第十六章。
吊人的換角度意象：哪些既有假設可以暫時放下？
對應章義：第四十八章。
以上是象徵教學配對，不能據此宣稱塔羅與《道德經》具有同一本體機制。
【十五｜接回十九層生命更新】
真理→知識：分清原文、解釋與自己的推論。
認知→身分：避免讓名稱把人固定。
目標→權重：檢查追求是否壓過其他重要價值。
狀態→預測：看清當下，再提出可修正的預期。
決策→實踐：減少多餘干預，採取必要的小步。
生命→果子：觀察長期行為與實際影響。
回饋→差異：容許結果挑戰原先理解。
察驗→悔改：分清需要修改的方法，以及需要承擔的責任。
模型更新→再測形成：刪除失效假設，重新實踐與觀察。
智慧：讓理解更能貼近情境，讓行動更能承受回饋。
《道德經》的道、德、無為，與基督信仰的真理、罪、悔改各有脈絡，可以比較，不宜直接互換。
【十六｜每天五句自我校準】
我現在把哪個名稱，誤當成全部事實？
我正在做的干預，哪些必要，哪些多餘？
我需要增加能力，還是刪除負擔？
什麼新資訊會讓我願意改變看法？
今天哪個小行動，能帶來下一輪可靠回饋？
自由的實踐：保有目標，也保有在新情境中改變路徑的能力。
</script>

<script type="text/plain" class="mod" data-id="cog7" data-title="《道德經》× 認知更新的七大領域" data-group="認知科學・華夏文明">
先明確定義：這裡提出一套適合你 LifeOS 課程的七領域整合版，並非學界統一命名的「認知七大領域」。
七領域：預測處理、貝葉斯推論、主動推論、控制論、複雜系統、資訊理論、博弈與決策。
這些領域的基礎形成於不同年代，當代研究持續發展它們的交會與應用，不能全部視為新近提出的理論。
《道德經》提供哲學提問，科學模型提供特定問題的形式化工具，生活回饋用來檢查實際判斷。
【一｜本體層：先分清人、模型與世界】
世界持續變化，我們只能透過有限資訊理解它。
認知模型是對世界的表徵，不能直接等同世界本身。
第一章：「道可道，非常道；名可名，非常名。」
哲學接法：說得出、分得清，不代表已經掌握全部。
生活接法：「女兒不回訊息」是觀察，「她不在乎我」是解讀。
更新起點：分清事實、推測、價值與未知。
成長的操作指標：預測更準、修正更快、行動更適合情境，同時兼顧責任與他人福祉。
自由的操作定義：舊解讀出現時，仍有能力檢查、修正與重新選擇。
【二｜結構層：七領域各負責一個問題】
01｜預測處理｜Predictive Processing：我如何理解眼前的資訊？
02｜貝葉斯推論｜Bayesian Inference：新證據應讓我改變多少看法？
03｜主動推論｜Active Inference：我如何透過行動取得資訊、調節狀態？
04｜控制論｜Cybernetics：如何根據回饋調整行動？
05｜複雜系統｜Complex Systems：互動如何形成整體結果？
06｜資訊理論｜Information Theory：什麼資訊能減少特定的不確定性？
07｜博弈與決策｜Game and Decision Theory：他人也會回應時，我如何選擇？
七領域彼此重疊，不是七個互不相干的腦區，也不是七個固定成長階段。
【01｜預測處理：先看見自己帶著什麼預期】
核心：這類模型研究既有預期與感覺訊息如何共同參與知覺與認知。
模型誤差：預期與輸入不一致時，可能需要調整解讀、注意或行動。
《道德經》對讀：第一章提醒名稱與表述的限制。
生活例子：學生低頭，你預測他不專心，但他可能正在查單字。
最小行動：先詢問正在做什麼，再決定如何處理。
更新問題：我的預期讓我看見什麼，又漏掉什麼？
簡單英文：Check your first guess.
邊界：預測處理是一組研究框架，不能據此宣稱所有情緒或疾病都只是想錯了。
【02｜貝葉斯推論：讓信念隨證據調整】
核心：結合先前判斷與新證據，更新不同解釋的相對可信度。
先驗：看到新證據之前，我原本怎麼判斷？
證據：現在多知道了什麼？
後驗：考慮新證據後，我應如何修改判斷？
《道德經》對讀：第四十八章「為學日益，為道日損」，可啟發增加知識、放下失效假設。
生活例子：以前某種教法有效，但這一班連續多次仍答錯，就要重新檢查教法與學生條件。
最小行動：寫下兩個可能解釋，再找能區分它們的資料。
更新問題：什麼證據會讓我降低對原先解釋的信心？
簡單英文：Change your view when the evidence changes.
邊界：沒有適當資料與模型時，不要替主觀判斷編造精確機率。
【03｜主動推論：用行動取得新資訊】
核心：這套框架把知覺、學習與行動放進生成模型中，研究系統如何推論與選擇行動。
生活化接法：有些未知需要查資料，有些需要透過安全的小嘗試才能知道。
《道德經》對讀：第六十四章，從可累積的小步開始。
生活例子：女兒不知道同學是否願意合作，可以先提出一次具體、低負擔的合作邀請。
最小行動：選擇成本可承受、結果可觀察的一步。
更新問題：這一步會讓我多知道什麼？
簡單英文：Take a small step and learn.
邊界：主動推論不是「相信什麼就能顯化什麼」，也不保證行動能控制外界。
【04｜控制論：把目標接上回饋】
核心：觀察實際輸出與目標的差異，再調整輸入或策略。
需要檢查：目標、感測、回饋延遲、調整幅度與資源限制。
《道德經》對讀：第三十七章的無為，可啟發檢查多餘干預。
生活例子：孩子還沒完成一輪讀書，就反覆改變要求，難以判斷哪個方法有效。
最小行動：先約定目標與回顧時間，留出執行和產生結果的時間。
更新問題：結果沒出現，是方法無效，還是回饋尚未到來？
簡單英文：Act, check, and adjust.
邊界：無為與控制論不能直接畫等號，減少干預也不是所有情境的最佳策略。
【05｜複雜系統：結果來自互動與歷史】
核心：多個要素相互作用，可能出現非線性、回饋、湧現與路徑依賴。
同樣的方法，換了關係、時機與資源配置，效果可能不同。
《道德經》對讀：第四十章「反者道之動」，可啟發留意策略走向極端後的變化。
生活例子：班級秩序受規則、同儕、課程難度與教師回應共同影響，不能只歸因於某個學生。
最小行動：畫出三個互相影響的條件，找一個可改動的關係。
更新問題：我只在改變個人，還是也需要改變互動結構？
簡單英文：Look at how the parts work together.
邊界：反對單一原因包辦一切，仍可研究具體因果關係與介入效果。
【06｜資訊理論：問對能減少未知的問題】
核心：資訊熵在指定機率分布下描述不確定性，資訊增益描述取得資料後的不確定性減少。
《道德經》對讀：第十一章「有之以為利，無之以為用」，可啟發為有用訊息保留空間。
生活例子：再看十篇泛泛的讀書建議，可能不如分析一次自己的錯題。
最小行動：把錯誤分成單字不懂、句構誤判、推論不足或時間不足。
更新問題：哪項資料最可能改變下一步決策？
簡單英文：Find the information that changes your next step.
邊界：資訊熵、熱力學熵與生活中的混亂不是同一概念，不能把焦慮直接稱為熵值升高。
探索時增加可能性，可能暫時提高不確定性；形成決策時才需要收斂。
所以「熵是否上升」必須先問：哪個系統、哪種熵、什麼尺度、什麼任務？
【07｜博弈與決策：把他人的回應納入模型】
核心：決策不只看自己想做什麼，也要考慮資訊、風險、誘因與他人的選擇。
《道德經》對讀：第六十六章「以其善下之」，可啟發降低支配姿態、改善合作條件。
生活例子：你希望家人分工，但每次對方沒做就立即代做，可能維持原來的依賴結構。
最小行動：明確約定任務、期限、支持方式與未完成時的處理。
更新問題：目前安排實際鼓勵了什麼行為？
簡單英文：Make the rules clear and fair.
邊界：人有情感、價值與有限資訊，不能假設人人都精確計算利益，也不能把合作理解成操控。
【四｜七領域合併：同一個親子情境】
情境：女兒說「我英文很爛，醫學英文一定讀不懂」。
預測處理：她先帶著「我不行」的預期接觸教材。
貝葉斯推論：一次困難不足以證明全部能力，需要具體作答資料。
主動推論：選一小段教材實際閱讀，取得新的能力資訊。
控制論：設定可達成的任務，完成後檢查理解與錯誤。
複雜系統：同時查看詞彙、背景知識、時間壓力與睡眠的交互影響。
資訊理論：確認最關鍵的卡點，而不是一次增加所有教材。
博弈與決策：讓母女共同約定支持方式，保留女兒的選擇與責任。
最小行動：讀一小段，標出不懂之處，用中文說出主旨，再針對卡點練習。
再測：換一段相近難度的文章，檢查能否遷移。
模型更新：「我全部不行」可以改成「我目前主要卡在這類詞彙與句構」。
【五｜接回五行、塔羅與中醫架構】
五行：可提供功能意象，協助從不同角度提問。
塔羅：可提供象徵素材，協助形成待檢查的假設。
節氣：提供時間位置，實際天氣提供當下環境資料。
五運六氣：保留為傳統歲時模型，不用七領域替它自動背書。
六經辨證：保留其醫學語境，不能改寫成六種認知狀態。
七領域：協助檢查定義、推論、互動、證據與更新方式。
共同原則：跨系統比較必須指出比較的特性，也保留不能互換的部分。
【六｜接回十九層生命更新】
真理→知識：釐清來源、定義與適用範圍。
認知→身分：辨認目前的表徵與自我敘事。
目標→權重：確定想達成什麼，以及願意承受哪些成本。
狀態→預測：記錄當下條件，提出可檢查的預期。
決策→實踐：選擇能推進目標、取得資訊的行動。
生命→果子：檢查持續行為與對自己、他人的影響。
回饋→差異：比較結果與預期，保留不符合期待的資料。
察驗→悔改：分清推論錯誤、方法問題與需要承擔的責任。
模型更新→再測形成：修正後，在新題目或新情境中檢查。
智慧：累積能遷移、能修正、能負責任使用的判斷能力。
【七｜可以直接做成課程的七個問題】
我原本預期什麼？
什麼新證據值得改變看法？
哪個小行動能取得新資訊？
回饋是否足夠，是否存在延遲？
哪些互動正在維持現在的結果？
哪項資訊最能改變決策？
我的安排會讓彼此更願意合作，還是更難合作？
【八｜AI在其中的角色】
AI可以協助列出替代解釋、整理資料、設計練習與比較預測。
AI生成的解釋仍需核對，不能因為語言流暢就當成真理。
課程與APP的價值，在於讓使用者留下「預測→行動→結果→修正」的紀錄。
有效的更新，不只讓故事更完整，也讓下一次判斷更準、行動更適合情境。
</script>
<script type="text/plain" class="mod" data-id="huaxia" data-title="華夏文明 × 七大認知領域 × 生命更新" data-group="認知科學・華夏文明">
核心接法：把華夏思想讀成一組理解變化、修養自身、組織關係與處理決策的資源，再用明確問題、行動與回饋持續校準。
華夏文明包含不同時代、地域與學派，內部有爭論、有互補，也有不能直接合併的立場。
以下是為你的「華夏動態決策母體」設計的當代重構，不是古人已提出七大科學理論的歷史宣稱。
【一｜本體層：從固定答案，轉向人與情境的關係】
《易經》提供理解變化、位置與時機的思想資源。
《道德經》提供檢查命名、強制、過度追逐與行動限度的思想資源。
《莊子》提供轉換視角、鬆動成見與反思判斷尺度的思想資源。
儒家提供修身、責任、關係與共同生活的思想資源。
《孫子兵法》提供形勢、情報、配置與策略互動的思想資源。
法家相關思想提供制度、規則、權責與誘因的分析資源，也需要檢查權力集中與濫用風險。
中國佛教提供對執著、苦、關係條件與實踐轉化的不同解釋，其中各宗派立場並不完全一致。
共同研究問題：人在什麼條件下，能看清情境、修正判斷、形成能力，並改善共同生活？
【二｜結構層：建立七個可更新模組】
01｜表徵模組：我如何描述眼前的人與事？
02｜證據模組：哪些資訊應改變原先判斷？
03｜探索模組：做什麼能取得新資訊？
04｜回饋模組：如何知道方法是否有效？
05｜關係模組：哪些互動形成整體結果？
06｜資訊模組：什麼值得注意，什麼只是增加負擔？
07｜策略模組：別人也在選擇時，如何安排合作與行動？
這七個模組，分別接到前面的預測處理、貝葉斯推論、主動推論、控制論、複雜系統、資訊理論、博弈與決策。
它們是分析工具，不是把不同思想壓成同一套真理。
【三｜預測處理 × 《莊子》：檢查自己的觀看方式】
認知問題：我看見的內容，有多少受到既有期待影響？
《莊子》的閱讀入口：成心、視角與判斷尺度。
當代接法：把習慣性解讀當成一個待檢查的模型。
生活例子：學生不交作業，可能涉及不會做、忘記、負荷過大或缺乏動機。
模型錯誤：還沒詢問，就把所有缺交都解釋成懶惰。
最小行動：請學生說明卡在哪一步，再看實際作答。
更新指標：處理方式是否更能對準具體障礙？
簡單英文：Look again before you judge.
【四｜貝葉斯推論 × 《易經》：隨情境修正判斷】
認知問題：新情況出現後，我是否仍固守舊結論？
《易經》的閱讀入口：變、時、位，以及條件改變後的取捨。
當代接法：把原先判斷視為暫時結論，依新證據調整可信度。
生活例子：同一套英文教材在前一班有效，在新班級卻持續出現相同錯誤。
模型錯誤：把過去成功當成現在必然有效的保證。
最小行動：比較兩班的先備知識、作答過程與錯誤類型。
更新指標：調整後能否改善相近題目，而非只把原題背熟？
界線：《易經》的變易思想不等於貝葉斯公式，卦象也不能代替機率資料。
簡單英文：New evidence may change the plan.
【五｜主動推論 × 知行實踐：用行動取得差異資訊】
認知問題：哪些事情光靠想像，無法知道？
華夏思想的閱讀入口：學、行、實踐與經驗之間的關係。
當代接法：設計小規模嘗試，讓不同解釋接受現實檢查。
生活例子：想知道學生是否需要單字APP，先讓學生使用一個完整單元。
模型錯誤：只問大家喜不喜歡，沒有觀察是否真的能完成學習。
最小行動：記錄使用前後的作答表現、卡點與持續使用情況。
更新指標：得到能改變下一版設計的資訊。
界線：實踐思想與主動推論可以比較，但不是相同理論。
簡單英文：Try it and learn from the result.
【六｜控制論 × 儒家修身 × 《道德經》：校準介入】
認知問題：我如何知道自己的做法需要增加、減少或改變？
儒家閱讀入口：學習、踐履、省察與改過。
道家閱讀入口：無為、知止與減少多餘干預。
當代接法：把目標、行動、回饋與修正接成閉環。
生活例子：你每天提醒女兒讀書，提醒越多，衝突越大。
模型錯誤：只增加提醒次數，沒有檢查提醒是否真的有幫助。
最小行動：共同約定一個回報時間，再觀察自主完成與求助情況。
更新指標：學習結果、關係品質與自主能力是否一起改善？
省察的用途是找出可修改之處，不能把所有問題都歸成自己不夠好。
簡單英文：Check the result and adjust your support.
【七｜複雜系統 × 勢與關係：從個人擴展到互動】
認知問題：哪些結果由多人、多條件共同形成？
華夏思想的閱讀入口：關係、位置、形勢與相互作用。
當代接法：觀察回饋循環、資源配置、歷史條件與非線性變化。
生活例子：班級作業缺交，可能同時受到難度、期限集中、同儕習慣與追蹤制度影響。
模型錯誤：只責備學生態度，或只責怪老師教法。
最小行動：找出一個持續維持缺交的循環，例如看不懂→拖延→累積→更難開始。
結構調整：增加早期求助入口，把大份量作業拆成可追蹤的小段。
更新指標：是否減少循環累積，而非只短暫提高服從？
界線：關係思考可以啟發複雜系統分析，但五行生剋不能直接當成已驗證的因果網路。
簡單英文：Change the conditions that keep the problem going.
【八｜資訊理論 × 《道德經》與《孫子》：取有用資訊，留處理空間】
認知問題：哪項資訊最可能改變決策？
《道德經》的閱讀入口：知止、減損與留白。
《孫子》的閱讀入口：情報、知彼知己與對情勢的判斷。
當代接法：區分資料量、資訊價值與決策價值。
生活例子：蒐集一百篇英文讀書方法，仍不知道女兒究竟卡在單字還是句構。
模型錯誤：把資料增加當成理解增加。
最小行動：選一段文章，請她逐句說明理解過程。
更新指標：是否找出能決定下一步練習的資訊？
熵的檢查：先說清楚要衡量什麼不確定性，不能把情緒、家務或道德狀態直接換算成熵。
探索階段可以增加可能解釋，決策階段再依證據收斂。
簡單英文：Find the information you can use.
【九｜博弈與決策 × 《孫子》× 制度思想：讓合作條件可持續】
認知問題：當每個人都會回應規則，我的安排會產生什麼結果？
《孫子》的閱讀入口：對手建模、形勢判斷、成本與策略選擇。
制度思想的閱讀入口：規則、權責、誘因與執行。
儒家補充問題：安排是否兼顧責任、信任與共同生活？
生活例子：家人知道自己不完成任務，你最後仍會全部代做。
模型錯誤：期待對方改變，卻持續維持原來的後果結構。
最小行動：說明分工、完成期限、可以提供的協助與自己承擔的上限。
更新指標：責任是否逐步回到適當的人，合作是否更穩定？
倫理界線：清楚規則與界線，不代表威脅、羞辱或把人當成工具。
簡單英文：Make responsibility clear and cooperation possible.
【十｜華夏文明的動態接法：時、位、勢、度、行、驗、改】
時：現在處於什麼階段，哪些條件正在變？
位：我能決定什麼，誰承擔什麼責任？
勢：哪些互動正在推動或阻擋結果？
度：投入多少才合適，停止條件是什麼？
行：哪個小行動能推進目標或取得資訊？
驗：如何知道結果與預期是否相符？
改：應修改觀察、解讀、關係、權重，還是行動？
這七字是課程設計的整理方式，不是某部古籍原有的固定七步。
【十一｜接回情緒、五行、節氣與塔羅】
情緒：提供當下經驗與需要的線索，仍要配合情境理解。
五行：提供功能與關係的傳統意象，不把人固定成單一類型。
節氣：提醒環境有時間變化，實際天氣決定當下調整。
五運六氣：保留傳統模型的來源與適用邊界。
六經傳變：屬於醫學病證的辨識與變化，不改寫成道德或人格等級。
塔羅：可提供敘事與提問素材，牌面解讀仍需接受事實檢查。
《道德經》：協助檢查命名、過度干預、執著與行動限度。
七領域：協助把上述素材轉成可區分、可檢查、可修改的問題。

機制：辨認卡點，安排對準卡點的練習，再用新題目檢查遷移。
行動：一次處理一種高頻錯誤，留下錯誤原因、修正方法與再測結果。
更新：若學生仍錯，先檢查診斷與練習是否適合，而非直接提高責備強度。

本體：會員需要的是適合自身情境的支持與清楚資訊。
結構：需求辨識、產品資訊、價格、服務負荷與售後回饋彼此連動。

行動：先把一個高頻問題做成完整的小單元，再觀察是否降低理解與使用障礙。

真理→知識：保留原典、當代解釋與實際證據的區別。
認知→身分：讓分類服務理解，保留改變的可能。
目標→權重：清楚說明追求什麼，以及不願犧牲什麼。

決策→實踐：選擇合時、合位、成本可承受的行動。

察驗→悔改：區分模型錯誤、能力不足、制度問題與需要承擔的責任。

說不出口的感受，最容易變成說得出口的傷害。
一個孩子說：「我不知道，我就是很煩。」
一個大人說：「沒事，我很好。」
一個伴侶說：「你自己想想看啊。」
三句話，三扇關上的門。
不是他們不想說，是他們沒有字。
情境是這樣的：女兒考完試回家，把書包一摔，關進房間。
母親在門外，心裡浮出一句：「她又在對我發脾氣。」
於是敲門、追問、責備，門關得更緊。

「我覺得自己不夠好。」——那是羞愧。
「我應該再多讀一點的。」——那是內疚。
「如果下次又考不好怎麼辦？」——那是恐懼。
三種完全不同的感受，外面看起來，都只是「很煩」。
你能分辨嗎？
你能說出口嗎？
你能用另一種語言，再說一次嗎？
這份十七類雙語詞彙，做的是一件很樸素的事：
把感受、想法、身體、行為，分成四欄。
感受是心裡的天氣，想法是腦中的旁白，
身體是皮膚下的訊號，行為是走出門的腳步。
這裡有一個翻轉：
臉紅，不一定是羞愧，也可能是喜悅；
流淚，不一定是悲傷，也可能是感動；
心跳加快，不一定是恐懼，也可能是勇氣正在發生。
身體不會單獨說謊，但也不會單獨說完。
所以，不要用一個反應，替一個人下結論。
當我們有了字，世界就慢慢變了：
從「很煩」到「我很失望」，
從「沒事」到「我胸口很緊」，
從「隨便」到「我需要一點時間」。
從中文到英文，從 I feel bad 到 I feel ashamed，
你會發現，同一個感受，換一種語言，就多一道光。
命名，是第一步；
描述，是第二步；
選擇，是第三步；
更新，是第四步。
「我現在覺得＿＿。」
「我心裡正在想＿＿。」
「我注意到身體＿＿。」
「我剛才做了＿＿，下一步可以＿＿。」
四句話，就能把一場風暴，寫成一份可以讀的天氣預報。
寫完之後，再問三個更新的問題：
我原本以為會發生什麼？What did I think would happen?
實際發生了什麼？What really happened?
我需要調整哪個想法或做法？What idea or action do I need to change?
還有一個溫柔的提醒：
「無恥、卑鄙、懦弱無能」這些詞，是貶抑，不是診斷；
詞彙庫裡收的，是讓人被理解的字，不是讓人被定罪的字。
詞彙不是用來貼標籤的，
是用來敲門的。
當你終於說出「我覺得自己不夠好」，
門的另一邊，也許會有人輕輕回答：
「我在，我想聽你說。」

只憑生氣，能判定肝生病嗎？
只憑一張網路經絡圖，能說出哪條經絡出了問題嗎？

中醫的肝心脾肺腎，是傳統功能概念，不全等於解剖器官；

  if(l.startsWith('@CARD ')){const h=l.slice(6).trim();const sec=m.secs.find(x=>x.h===h);if(sec){sec.card=[];tgt=sec.card;}else{fbMiss.push(m.id+'｜'+h);tgt=[];}return;}
  if(tgt)tgt.push(l);
 });
});
window.__fbMiss=fbMiss;if(fbMiss.length)console.warn('臉書圖文未對應：',fbMiss);
const FBALL={id:'fball',title:'臉書圖文總覽（18 篇）',group:'臉書圖文',secs:[]};
const clips=[];
const clip=t=>{clips.push(t);return clips.length-1;};
const toast=msg=>{let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);}t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1400);};
function copyText(t){
 const done=()=>toast('已複製');
 const fallback=()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){toast('複製失敗，請手動選取');}ta.remove();};
 if(navigator.clipboard&&window.isSecureContext!==false){navigator.clipboard.writeText(t).then(done,fallback);}else fallback();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-clip]');if(!b)return;e.preventDefault();e.stopPropagation();copyText(clips[+b.dataset.clip]);});
const postLen=p=>p.join('').replace(/\s/g,'').length;
function postHtml(m,terms,open){
 if(!m.post)return '';
 const body=m.post.map((l,i)=>`<p class="${i===0?'lead':''}">${terms?hl(esc(l),terms):esc(l)}</p>`).join('');
 const t=m.post.join('\n');
 return `<details class="fbpost" id="P-${m.id}" ${open?'open':''}><summary>臉書圖文｜${esc(m.title)}（約 ${postLen(m.post)} 字）</summary><div class="fbactions"><button class="btn copy" data-clip="${clip(t)}">複製全文</button></div><div class="fbbody">${body}</div><div class="fbactions"><button class="btn copy" data-clip="${clip(t)}">複製全文</button></div></details>`;
}
function cardHtml(m,s,si){
 if(!s.card||!s.card.length)return '';
 const t=s.card.join('\n');
 return `<div class="fbcard" id="C-${m.id}-${si}"><div class="tag"><span>臉書金句卡</span><button class="btn copy" data-clip="${clip(t)}">複製</button></div>${s.card.map(l=>`<p>${esc(l)}</p>`).join('')}</div>`;
}
const fbBtn=$('#fbBtn');
const setFb=on=>{document.body.classList.toggle('nofb',!on);fbBtn.classList.toggle('on',on);store.set('emo-fb',on?'1':'0');};
setFb(store.get('emo-fb')!=='0');
fbBtn.onclick=()=>setFb(document.body.classList.contains('nofb'));

// 目錄
const nav=$('#nav');let g='';let html=`<div class="g">臉書圖文</div><a href="#fball" data-id="fball">${FBALL.title}</a>`;
mods.forEach(m=>{ if(m.group!==g){g=m.group;html+=`<div class="g">${esc(g)}</div>`;} html+=`<a href="#${m.id}" data-id="${m.id}">${esc(m.title)}</a>`;});
nav.innerHTML=html;

// 狀態快查
const chips=$('#chips');
chips.innerHTML='<span class="count" style="font-size:13px">狀態快查：</span>'+LADDER.slice().reverse().map(r=>`<button class="chip" data-q="${r[1]}">${r[0]}｜${r[1]}</button>`).join('');
chips.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;const q=$('#q');q.value=(q.value===b.dataset.q)?'':b.dataset.q;runSearch();});

function fmtLine(l,terms){
 let cls='ln';
 if(/^([①-⑳]|[⑴-⒇]|E\d\d｜|M\d\d｜|S\d\d｜|\d\d｜|工具\d+｜|案例[一二三四五六]|Grade |路線[一二]|第[一二三四五六七]問|回路[一二三四五]|單元[一二三四五六七八]|第[一二三四五六]步|[0-9]{2}\s?[^0-9]|[木火土金水]｜|[乾坤震巽坎離艮兌]｜|初之氣|[二三四五]之氣|終之氣|春季|夏季|秋季|冬季|季節交替)/.test(l)&&l.length<60) cls+=' item';
 let h=esc(l);
 const m=l.match(/^([^：「」。，、]{1,10})：(.+)$/);
 if(m&&cls==='ln') h=`<span class="lb">${esc(m[1])}：</span>${esc(m[2])}`;
 if(terms&&terms.length) h=hl(h,terms);
 return {cls,h};
}
function hl(h,terms){terms.forEach(t=>{if(!t)return;const re=new RegExp(esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');h=h.replace(/(<[^>]*>)|([^<]+)/g,(all,tag,txt)=>tag?tag:txt.replace(re,x=>`<mark>${x}</mark>`));});return h;}

function renderLadder(){
 let h='<div class="ladder"><div class="h">原圖數值</div><div class="h">狀態</div><div class="h">原圖描述</div><div class="gap">高頻能量｜內外和諧</div>';
 LADDER.forEach((r,i)=>{
  if(i===9)h+='<div class="gap">低頻能量｜短暫的能量・向外攻擊（175～125）</div>';
  if(i===12)h+='<div class="gap">內在消耗・低能量（100～20）</div>';
  const c=r[3]||'#6b6f76',d=r[4]||'#e4e4e2';
  h+=`<div class="c" style="background:${c}" data-q="${r[1]}">${r[0]}</div><div class="c" style="background:${c}" data-q="${r[1]}">${r[1]}</div><div class="d" style="background:${d}" data-q="${r[1]}">${r[2]}</div>`;
 });
 h+='</div><div class="note">以上數字與描述為原圖主張，非客觀頻率、健康分數或醫療判定；情緒不代表人的價值。點任一列可搜尋該狀態在全部資料中的內容。</div>';
 return h;
}

let current=null;
function showAll(){
 current='fball';store.set('emo-last','fball');
 nav.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.id==='fball'));
 clips.length=0;
 const ps=mods.filter(m=>m.post);
 const cards=mods.reduce((n,m)=>n+m.secs.filter(s=>s.card).length,0);
 let h=`<h2 class="mtitle">${FBALL.title}</h2><div class="mmeta">每頁一篇約千字貼文，另有 ${cards} 張欄位金句卡（在各頁的欄位底部）　<button class="btn" id="tgl">全部收合／展開</button></div>`;
 ps.forEach(m=>{h+=postHtml(m,null,false).replace('<div class="fbactions">',`<div class="fbactions"><a class="btn copy" href="#${m.id}">前往此頁</a>`);});
 const main=$('#main');main.innerHTML=h;
 $('#tgl').onclick=()=>{const ds=main.querySelectorAll('details.fbpost');const anyOpen=[...ds].some(d=>d.open);ds.forEach(d=>d.open=!anyOpen);};
 nav.classList.remove('open');window.scrollTo(0,0);
}
function show(id,target){
 if(id==='fball'){showAll();return;}
 const m=byId[id]||mods[0];current=m.id;store.set('emo-last',m.id);
 nav.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.id===m.id));
 clips.length=0;
 const nc=m.secs.filter(s=>s.card).length;
 let h=`<h2 class="mtitle">${esc(m.title)}</h2><div class="mmeta">${esc(m.group)}｜${m.secs.length} 段${nc?`｜${nc} 張金句卡`:''}　<button class="btn" id="tgl">全部收合／展開</button></div>`;
 h+=postHtml(m,null,true);
 if(m.id==='chart') h+=`<div class="intro">${renderLadder()}</div>`;
 m.secs.forEach((s,si)=>{
  const body=s.lines.map((l,li)=>{const f=fmtLine(l);return `<div class="${f.cls}" id="L-${m.id}-${si}-${li}">${f.h}</div>`}).join('')+cardHtml(m,s,si);
  if(!s.h) h+=`<div class="intro" id="S-${m.id}-${si}">${body}</div>`;
  else h+=`<details class="sec" open id="S-${m.id}-${si}"><summary>${esc(s.h)}</summary><div class="body">${body}</div></details>`;
 });
 const main=$('#main');main.innerHTML=h;
 $('#tgl').onclick=()=>{const ds=main.querySelectorAll('details.sec,details.fbpost');const anyOpen=[...ds].some(d=>d.open);ds.forEach(d=>d.open=!anyOpen);};
 main.querySelectorAll('[data-q]').forEach(el=>el.onclick=()=>{$('#q').value=el.dataset.q;runSearch();});
 nav.classList.remove('open');
 const t=target&&document.getElementById(target);
 if(t){if(t.tagName==='DETAILS')t.open=true;if(/^C-|^P-/.test(target))setFb(true);t.scrollIntoView({block:'center'});t.classList.add('flash');}
 else window.scrollTo(0,0);
}

function runSearch(){
 const raw=$('#q').value.trim();
 chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.q===raw));
 if(!raw){show(current||mods[0].id);return;}
 const terms=raw.split(/\s+/).filter(Boolean),low=terms.map(t=>t.toLowerCase());
 const hit=s=>low.every(t=>s.toLowerCase().includes(t));
 let out='',total=0;
 mods.forEach(m=>{
  let items='',n=0;
  const tHit=hit(m.title);
  const anyT=l=>low.some(t=>l.toLowerCase().includes(t));
  const res=(tg,small,txt)=>{n++;items+=`<a class="res" data-m="${m.id}" data-t="${tg}"><small>${esc(small)}</small>${hl(esc(txt),terms)}</a>`;};
  if(m.post&&hit(m.post.join('\n')))m.post.forEach(l=>{if(anyT(l))res(`P-${m.id}`,'臉書圖文',l);});
  m.secs.forEach((s,si)=>{
   const card=s.card||[];
   // 同一段落（含金句卡）內包含全部關鍵字即算命中
   if(!hit(s.h+'\n'+s.lines.join('\n')+'\n'+card.join('\n')))return;
   if(s.h&&anyT(s.h))res(`S-${m.id}-${si}`,'段落標題',s.h);
   s.lines.forEach((l,li)=>{if(anyT(l))res(`L-${m.id}-${si}-${li}`,s.h||'導言',l);});
   card.forEach(l=>{if(anyT(l))res(`C-${m.id}-${si}`,'金句卡｜'+(s.h||'導言'),l);});
  });
  if(n||tHit){total+=n;out+=`<div class="res-mod">${hl(esc(m.title),terms)} <span class="count">（${n}）</span></div>`+(n?items:`<a class="res" data-m="${m.id}">開啟此模組</a>`);}
 });
 $('#main').innerHTML=`<h2 class="mtitle">搜尋：${esc(raw)}</h2><div class="mmeta">共 ${total} 筆　<button class="btn" id="clr">清除搜尋</button></div>`+(out||'<p>找不到符合的內容，試試較短的關鍵字。</p>');
 $('#clr').onclick=()=>{$('#q').value='';runSearch();};
 $('#main').querySelectorAll('.res').forEach(a=>a.onclick=()=>{
  $('#q').value='';
  chips.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  history.replaceState(null,'','#'+a.dataset.m);
  show(a.dataset.m,a.dataset.t);
 });
 window.scrollTo(0,0);
}
let tm;$('#q').addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(runSearch,200);});
$('#q').addEventListener('keydown',e=>{if(e.key==='Escape'){e.target.value='';runSearch();}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus();}});

nav.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;e.preventDefault();$('#q').value='';history.replaceState(null,'','#'+a.dataset.id);show(a.dataset.id);chips.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));});
$('#menuBtn').onclick=()=>nav.classList.toggle('open');
document.addEventListener('click',e=>{if(nav.classList.contains('open')&&!nav.contains(e.target)&&e.target.id!=='menuBtn')nav.classList.remove('open');});

let fs=parseInt(store.get('emo-fs')||'16',10);
const setFs=()=>{document.documentElement.style.setProperty('--fs',fs+'px');store.set('emo-fs',fs);};setFs();
$('#fsUp').onclick=()=>{fs=Math.min(24,fs+1);setFs();};
$('#fsDown').onclick=()=>{fs=Math.max(13,fs-1);setFs();};
const th=store.get('emo-theme');if(th)document.documentElement.dataset.theme=th;
$('#themeBtn').onclick=()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;const n=dark?'light':'dark';document.documentElement.dataset.theme=n;store.set('emo-theme',n);};

const valid=h=>h==='fball'||!!byId[h];
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(valid(h)&&h!==current){$('#q').value='';show(h);}});
const start=location.hash.slice(1),last=store.get('emo-last');
show(valid(start)?start:(valid(last)?last:mods[0].id));
})();
</script>
</body>
</html>
