g down isn't being slow. It's being steady.", "容人，是格局。": "Tolerance is breadth of mind.", "謙卑，是走得遠的祕訣。": "Humility is the secret to going far.", "先緩，再觀察，再拿捏，最後通透圓融。": "Slow down first, then observe, then judge the measure, and finally become clear and well-rounded.", "從急躁，到有分寸，到圓融。": "From impulsive, to measured, to well-rounded.", "緩、留、柔、觀、容、藏。": "Pause, hold back, soften, observe, tolerate, conceal.", "願你處世有分寸，進退有度。": "May you move through life with proportion and know when to step forward or back.", "分寸二字，刻進骨子裡。": "Carve proportion into your bones.", "向寬處行，路越走越寬。": "Walk the wide road, and the road keeps widening.", "做了8年市場分析，我見過太多人第一步就做錯了！": "8 years in market analysis, and I've seen too many people get the first step wrong!", "市場分析要從宏觀到微觀、從分析到決策，六步閉環，不能一上來就調研競品。": "Market analysis goes from macro to micro, from analysis to decision, in a six-step loop. You can't start by researching competitors.", "先搞清大方向，再看細節。": "Get the big direction first, then the details.", "政治、經濟、社會、技術。": "Political, economic, social, technological.", "數據白採，是因為沒有框架。": "Data gathered for nothing is data gathered without a framework.", "框架，是分析師最好的工具。": "A framework is an analyst's best tool.", "從宏觀到微觀，從分析到決策。": "From macro to micro, from analysis to decision.", "分析的終點，是可執行的方案。": "The end point of analysis is an actionable plan.", "市場規模、生命週期、競爭結構。": "Market size, life cycle, competitive structure.", "用戶畫像、需求分析、細分市場。": "User profile, needs analysis, market segments.", "機會威脅、戰略調整、結論評估。": "Opportunities and threats, strategy adjustment, conclusion and evaluation.", "急著看競品是跑偏，先看大環境是正軌。": "Rushing to look at competitors is going off course. Looking at the big environment first is the right track.", "分析很多，結論很少，等於白做。": "Lots of analysis, few conclusions, is wasted work.", "順序對了，分析就準了。": "Get the order right and the analysis gets accurate.", "你做市場分析有什麼心得？": "What have you learned from doing market analysis?", "你是不是一上來就看競品？": "Do you jump straight to competitors?", "你清楚自己在哪個賽道嗎？": "Do you know which Excellence is forged under pressure.", "自律、傾聽、覆盤、導向、激勵。": "Self-discipline, listening, review, direction, motivation.", "緊盯、鍛鍊、施壓、預判、批評。": "Keep close watch, train, apply pressure, anticipate, criticize.", "聽真話才能做對決策，聽奉承只會越走越偏。": "Hear the truth to make the right call. Hear flattery and you drift further off.", "不給機會練，永遠出不了將。": "Never give them a chance to practice and you'll never produce a general.", "藉口多了，執行力就死了。": "The more excuses, the deader the execution.", "你要求團隊的事，自己做到了嗎？": "Do you do what you ask of your team?", "你能聽得進刺耳的話嗎？": "Can you take harsh words?", "你對推諉藉口，是零容忍嗎？": "Do you have zero tolerance for excuses and buck-passing?", "你要求團隊準時交報告，自己卻常常遲交。": "You demand reports on time from your team but often hand yours in late.", "你只聽順耳的話，結果做出了錯誤的決策。": "You only listened to pleasant words, and ended up making the wrong decision.", "你給了一位新人一次獨當一面的機會，他成長得比你想像中快。": "You gave a newcomer a chance to take charge, and they grew faster than you imagined.", "管理，從管自己開始。": "Management starts with managing yourself.", "以身作則，勝過千言萬語。": "Leading by example beats a thousand words.", "批評藉口，是保護執行力。": "Calling out excuses protects execution.", "覆盤，是管理者的必修課。": "Review is a manager's required course.", "先律己，再聽、思、導、勵，最後盯、練、逼、想、批。": "Discipline yourself first, then listen, reflect, guide, and motivate, and finally watch, train, push, anticipate, and critique.", "從管自己，到管團隊，到帶出將才。": "From managing yourself, to managing the team, to producing generals.", "十個字、十條法、一個團隊。": "Ten characters, ten rules, one team.", "願你以身作則，帶出一支嗷嗷叫的隊伍。": "May you lead by example and build a team that charges ahead.", "管好自己，團隊就跟上了。": "Manage yourself well and the team will follow.", "為什麼你明明很努力，結果卻總是不盡人意？": "Why do you work so hard, yet results always fall short?", "順序不對，努力白費；做事順序對了，結果自然對。": "Wrong order, wasted effort. Get the order right and results follow.", "先處理情緒，再處理事情。": "Handle emotions first, then the matter.", "你和人溝通時，是先求同嗎？": "When you communicate, do you seek common ground first?", "先愛自己，才能好好愛人。":  then, next.", "願你的每一份努力，都排在對的位置。": "May every bit of your effort land in the right place.", "順序，是被忽略的成功法則。": "Order is the overlooked rule of success.", "先後之間，藏著智慧。": "Wisdom hides in what comes first and what comes after.", "扎心了！看完這個\"學習九層樓\"，我發現自己一直住在一樓……": "Ouch! After seeing this \"Nine Floors of Learning,\" I realized I've been living on the first floor...", "看過不等於學會；真正的高手，都在學習九層樓的第六層以上。": "Having read it doesn't mean having learned it. True masters live above the sixth floor of the Nine Floors of Learning.", "真正的高手，把知識變成能力。": "True masters turn knowledge into ability.", "應用、思辨、創新、內化。": "Apply, question, create, internalize.", "內化，是學習的終點。": "Internalizing is where learning ends.", "扎心了，原來我一直住在一樓。": "Ouch. Turns out I've been living on the first floor.", "看過不等於學會。": "Having read it doesn't mean having learned it.", "內化，是讓知識成為你的思維方式。": "Internalizing means knowledge becomes your way of thinking.", "學習是一棟九層樓，你住在第幾層？": "Learning is a nine-story building. Which floor do you live on?", "接觸、瀏覽、記憶、理解、搭體系。": "Touch, skim, memorize, understand, build a system.", "知道講什麼，記住概念，用自己的話解釋。": "Know what it's about, remember the concepts, explain in your own words.", "連成網路，用到實際，發現侷限，提出新觀點。": "Link it into a network, apply it, find its limits, offer a new view.", "很多人停在第二層，以為已經學會。": "Many people stop on the second floor and think they've learned it.", "記住是第三層，用上是第六層。": "Memorizing is the third floor. Applying is the sixth.", "隨手翻翻是接觸，不知不覺用上是內化。": "Flipping through is touching. Using it without noticing is internalizing.", "學知識是加法，變能力是乘法。": "Learning facts is addition. Turning them into ability is multiplication.", "你目前在哪一層？": "Which floor are you on now?", "你學的東西，用上了嗎？": "Are you using what you learn?", "你能用自己的話解釋嗎？": "Can you explain it in your own words?", "你能發現所學的侷限嗎？": "Can you spot the limits of what you've learned?", "你讀了一百本書，卻說不出一本書的核心論點。": "You've read a hundred books but can't state the core argument of one.", "同事只讀了三本書，卻能把其中的方法用在工作上。": "A coworker read only three books but applied their methods at work.", "你開始用自己的話寫讀書筆記後，理解力明顯提升。": "After you began writing reading notes in your own words, your understanding clearly improved.", "學習不是看書，是建樓。": "Learning isn't reading. It's building.", "停在一樓的人很多，爬到頂樓的人很少。": "Plenty of people stop on the first floor. Few climb to the top.", "應用，是學習的分水嶺。": "Application is the watershed of learning.", "從接觸，到理解，到應用，到內化。": "From touching, to understanding, to applying, to internalizing.", "一層一層，往上爬。": "Floor by floor, keep climbing.", "看、記、懂、用、創。": "Look, remember, understand, use, create.", "願你在學習的樓梯上，步步向上。": "May you climb the stairs of learning, step by step.", "把知識變成能力，才算真正學會。": "Turning knowledge into ability is what real learning means.", "頂樓的風景，屬於堅持往上爬的人。": "The view from the top floor belongs to those who keep climbing.", "老祖宗留下的這12條人生守則，我35歲才真正讀懂！": "I only truly understood these 12 life rules from our ancestors at 35!", "命是爹媽給的，運是自己造的；十二條人生守則沒有一條是抱怨出身的。": "Fate comes from your parents, fortune you make yourself. Not one of the twelve rules complains about where you came from.", "命是爹媽給的，運是自己造的。": "Fate comes from your parents. Fortune you make yourself.", "擇業、擇偶、趨吉避凶。": "Choose your career, choose your partner, seek luck and avoid harm.", "孟母三遷不是傻，是懂。": "Mencius's mother moving three times wasn't foolish. She understood.", "原生家庭給的是起點，不是終點。": "Your family of origin gives you a starting point, not an end point.", "圈子決定眼界，環境塑造思維。": "Your circle decides your horizons. Your environment shapes your thinking.", "十二條裡沒有一條是抱怨出身的。": "Not one of the twelve complains about where you came from.", "父母條件是命，時代經濟是運，所處環境是風水。": "Your parents' circumstances are fate, the era's economy is fortune, and your surroundings are feng shui.", "讀書改變認知，交友改變圈子，養生決定續航。": "Reading changes your awareness, friends change your circle, health decides your stamina.", "接受命，順應運，經營環境。": "Accept fate, ride fortune, shape your environment.", "有人含著金湯匙，有人在泥地摸爬，但終點由自己寫。": "Some are born with a silver spoon, some crawl through mud, but you write your own ending.", "順週期豬都能飛，逆週期再努力也吃力。": "In an upcycle even pigs can fly. In a downcycle even hard work feels heavy.", "抱怨命不好，不如經營運。": "Instead of complaining about fate, work on your fortune.", "這十二條裡，你最認同哪一條？": "Of these twelve, which one do you agree with most?", "你是在抱怨出身，還是在經營人生？": "Are you complaining about your origins, or building your life?", "你所處的環境，在幫你還是拖你？": "Is your environment helping you or dragging you down?", "你的擇業與擇偶，是用心選擇的嗎？": "Did you choose your career and your partner with care?", "你總說自己出身不好，卻從不願意換一個更好的圈子。": "You keep saying you came from a bad background, yet refuse to move to a better circle.", "同學在對的時代進入對的產業，十年後財富翻了數倍。": "A classmate entered the right industry at the right time, and ten years later their wealth multiplied several times over.", "你搬到一個學習氛圍好的城市後，整個人的狀態都變了。": "After you moved to a city with a strong learning culture, your whole state changed.", "命不是終點，運才是方向。": "Fate isn't the end. Fortune is the direction.", "環境，可以自己選。": "Your environment is something you can choose.", "十二條守則，是改命的地圖。": "The twelve rules are a map for changing your fate.", "老祖宗的智慧，教你做得更好。": "The wisdom of our ancestors shows you how to do better.", "先接受命，再順應運，再經營環境，最後做好每一條守則。": "Accept fate first, ride fortune next, shape your environment after that, and finally live out every rule.", "從抱怨，到接受，到經營。": "From complaining, to accepting, to building.", "命、運、風水、讀書、貴人、養生。": "Fate, fortune, surroundings, reading, mentors, health.", "願你在現有條件下，活出最好的自己。": "May you live your best life with what you have.", "別再說我命不好。": "Stop saying \"I was born unlucky.\"", "改命，從今天的選擇開始。": "Changing your fate starts with today's choices.", "活了35年，今天才整理出這12條人生守則，每一條都是用教訓換來的！": "At 35, I finally put together these 12 life rules, and every one was bought with a hard lesson!", "踩過的每一個坑，都是因為少了一條守則；十二條人生守則是用教訓換來的。": "Every pit I fell into was because I was missing a rule. These twelve rules were bought with lessons.", "明底線、守規矩、有敬畏。": "Know your limits, follow the rules, have respect.", "十二條守則，十二面鏡子。": "Twelve rules, twelve mirrors.", "寫下來，才發現問題在哪。": "Write them down and you see where the problem is.", "教訓換來的智慧，最值得珍惜。": "Wisdom bought with lessons is the most worth treasuring.", "踩過的每一個坑，都是因為少了一條守則。": "Every pit I fell into was because I was missing a rule.", "有計劃、有目標、不拖拉、不敷衍。": "Have plans, have goals, don't procrastinate, don't cut corners.", "懂感恩、知尊重、守誠信、有擔當。": "Be grateful, show respect, keep your word, take responsibility.", "做事有計劃，做人懂感恩，學習多思考，健康常鍛鍊。": "Plan your work, be grateful in life, think while you learn, exercise for health.", "心態要樂觀，社交會傾聽，理財明收支，家庭多陪伴。": "Stay optimistic, listen in social settings, know your income and spending, spend time with family.", "目標早規劃，溝通有條理，規則守底線，情緒能覺察。": "Plan goals early, communicate clearly, hold your limits, notice your emotions.", "稀裡糊塗地活，代價是一個個坑。": "Live in a fog, and the price is one pit after another.", "不自卑，也不自傲。": "Don't feel inferior, and don't feel superior.", "懂包容，也守邊界。": "Be tolerant, and keep your boundaries.", "不衝動，常平和。": "Don't be impulsive. Stay calm.", "你們還知道哪些人生守則是用教訓換來的？": "What other life rules did you learn the hard way?", "你的十二個面向，哪一個最弱？": "Of your twelve areas, which is weakest?", "你的理財，是靠感覺還是靠規劃？": "Is your money management done by feel or by plan?", "你的情緒，能覺察嗎？": "Can you notice your emotions?", "三十歲前你換了五份工作，每次都因為沒規劃。": "You changed jobs five times before 30, each time because you had no plan.", "你從不記帳，直到一次急用錢才發現存款見底。": "You never tracked spending, until one emergency showed you your savings were gone.", "你開始每天覆盤情緒後，和家人的爭吵明顯減少。": "After you started reviewing your emotions daily, arguments with your family dropped noticeably.", "守則不是束縛，是保護。": "Rules aren't restraints. They're protection.", "教訓，是最貴的學費。": "Lessons are the most expensive tuition.", "十二條守則，是人生的說明書。": "Twelve rules are life's instruction manual.", "先檢視十二面向，再找出最弱一面，最後逐一改善。": "Check the twelve areas first, find your weakest, then improve them one by one.", "從稀裡糊塗，到有章可循，到從容生活。": "From living in a fog, to having a guide, to living at ease.", "做事、做人、學習、健康、心態、社交。": "Work, character, learning, health, mindset, social life.", "寫下來才發現，每個坑都少了一條守則。": "Writing it down, you see that every pit was a missing rule.", "願你少踩坑，活得明白。": "May you step in fewer pits and live with clarity.", "十二條守則，陪你走好一生。": "Twelve rules to walk you through a lifetime.", "活了30年，今天才知道富人和窮人想的東西根本不是一回事！": "Lived 30 years to learn that the rich and the poor don't think about the same things at all!", "思維決定選擇，選擇決定命運；窮人研究把一件事做好，富人研究讓一群人把事做好。": "Mindset shapes choices, choices shape fate. The poor study how to do one thing well. The rich study how to get a group to do things well.", "思維決定選擇，選擇決定命運。": "Mindset shapes choices, choices shape fate.", "技能是戰術，戰略是方向。": "Skills are tactics. Strategy is direction.", "你每天都在操心什麼？": "What do you worry about every day?", "窮人看眼前三步，富人看行業十年。": "The poor see three steps ahead. The rich see ten years of an industry.", "窮人把時間賣給出勤卡，富人把時間用在佈局上。": "The poor sell their time to a time card. The rich spend their time on positioning.", "這不是貶低誰，而是兩種不同的人生劇本。": "This isn't about putting anyone down. It's two different life scripts.", "戰略、政策、行業、模式、資源、金融、股權。": "Strategy, policy, industry, model, resources, finance, equity.", "策略、馭人、格局、破局、反脆弱。": "Tactics, leading people, vision, breakthrough, anti-fragility.", "打工、外賣、擺攤、考證、短期回報。": "Salaried work, deliveries, a street stall, certificates, short-term payoff.", "研究趨勢、研究人性、研究佈局。": "Study trends, study people, study positioning.", "窮人研究怎麼把事做好，富人研究怎麼讓一群人把事做好。": "The poor study how to do things well. The rich study how to get a group to do things well.", "短期回報讓你活著，長期佈局讓你翻身。": "Short-term payoff keeps you alive. Long-term positioning turns your life around.", "出勤卡上的時間，換不來未來。": "Time on a time card can't buy a future.", "你現在是在窮人思維裡打轉，還是在往富人思維靠近？": "Are you circling in poor-person thinking, or moving toward rich-person thinking?", "你有研究過行業十年的走向嗎？": "Have you ever studied where your industry is headed over ten years?", "你的時間，賣給了誰？": "Who are you selling your time to?", "你每天加班到深夜，卻從沒想過自己的產業五年後會怎樣。": "You work late every night, yet never wonder what your industry will look like in five years.", "同學每週研究一次政策與趨勢，三年後成功轉型。": "A classmate studied policy and trends once a week, and three years later made a successful switch.", "你看完那張對比圖，第一次意識到自己一直在用戰術勤奮掩蓋戰略懶惰。": "After seeing that comparison chart, you realized for the first time that you've been using tactical busyness to cover for strategic laziness.", "窮與富，差的是思維。": "The gap between poor and rich is mindset.", "不是不努力，是努力的方向不同。": "It's not that you don't work hard. It's that you work in a different direction.", "佈局，比勤奮更重要。": "Positioning matters more than hustle.", "思維升級，命運跟著升級。": "Upgrade your mindset and your fate upgrades with it.", "先看清自己關注什麼，再拓展視野，最後升級思維。": "See what you focus on first, widen your view next, upgrade your mindset last.", "從操心生計，到研究趨勢，到佈局未來。": "From worrying about making ends meet, to studying trends, to positioning for the future.", "看、想、謀、佈。": "See, think, plan, position.", "願你從低頭趕路，到抬頭看天。": "May you go from heads-down hurrying to looking up at the sky.", "兩種人生劇本，你選擇哪一個？": "Two life scripts. Which one do you choose?", "佈局的人，掌握未來。": "Those who position themselves hold the future.", "活了30年今天才知道，學中醫竟然有順序！順序不對，努力全白費！": "Lived 30 years to learn that studying Chinese medicine has an order! Wrong order, all that effort wasted!", "學中醫有順序，每一階都是下一階的基礎；順序不對，努力全白費。": "Chinese medicine is learned in order. Each level is the base for the next. Wrong order, all that effort wasted.", "陰陽五行，是中醫的底層邏輯。": "Yin-yang and the five elements are the underlying logic of Chinese medicine.", "君臣佐使，如排兵佈陣。": "Sovereign, minister, assistant, envoy: a formula is arranged like a battle line.", "治已病是醫，治未病是道。": "Treating existing illness is medicine. Preventing illness is the Way.", "中醫有一套完整的修煉路徑。": "Chinese medicine has a complete path of training.", "順序不對，努力全白費。": "Wrong order, all that effort wasted.", "每味藥都是一個性格鮮明的將。": "Every herb is a general with a distinct personality.", "同病異治，異病同治，才是融會貫通。": "Different treatments for the same disease, same treatment for different diseases: that's when it all comes together.", "築基、識藏、明診、辨藥、組方、養生、悟道。": "Foundation, organs, diagnosis, herbs, formulas, wellness, insight.", "陰陽五行、臟腑經絡、望聞問切、中藥性味。": "Yin-yang and five elements, organs and meridians, the four diagnostic methods, herb properties.", "順四時、調情志、節飲食、適起居。": "Follow the four seasons, regulate emotions, moderate diet, live in rhythm.", "一上來就讀經典是越看越懵，按順序學是越學越通。": "Start with the classics and you get more confused. Study in order and you understand more.", "四診合參，見微知著。": "Combine all four diagnostics and read the subtle signs.", "概念是碎片，路徑是地圖。": "Concepts are fragments. A path is a map.", "你們還知道哪些中醫入門的好方法？": "What other good ways in to Chinese medicine do you know?", "你是不是一上來就讀《黃帝內經》？": "Did you start by reading the Yellow Emperor's Inner Canon?", "你理解陰陽五行了嗎？": "Do you understand yin-yang and the five elements?", "你知道君臣佐使的意思嗎？": "Do you know what sovereign, minister, assistant, and envoy mean?", "你買了一堆中醫經典，翻了三頁就放棄了。": "You bought a pile of Chinese medicine classics and gave up after three pages.", "一位老中醫告訴你學習有七個階段，你終於找到了方向。": "An old doctor told you there are seven stages of learning, and you finally found your direction.", "按順序學了半年後，你開始能讀懂經典中的道理。": "After half a year of studying in order, you began to understand the principles in the classics.", "中醫不是隨便學的，是有修煉路徑的。": "Chinese medicine isn't learned at random. It has a path of training.", "築基穩，樓才高。": "A solid foundation builds a taller tower.", "養生，是中醫的最高境界之一。": "Wellness is one of the highest realms of Chinese medicine.", "悟道，是學中醫的終點。": "Insight is where studying Chinese medicine ends.", "從築基，到識藏，到明診，到辨藥，到組方，到養生，到悟道。": "From foundation, to organs, to diagnosis, to herbs, to formulas, to wellness, to insight.", "從概念，到診斷，到治療，到融會貫通。": "From concepts, to diagnosis, to treatment, to mastery.", "七階、七步、一條路。": "Seven stages, seven steps, one road.", "願你在中醫之路上步步登高。": "May you climb higher on the road of Chinese medicine.", "順序對了，努力才有回報。": "Get the order right and effort pays off.", "一階一階，終將悟道。": "Stage by stage, you'll reach insight in the end.", "年輕時總覺得自己了不起，覺得別人這不行那不行，直到後來吃了虧、栽了跟頭，才慢慢明白一個道理——": "When I was young I thought I was something special and everyone else fell short. Only after taking losses and stumbling did I slowly understand one thing:", "人這輩子最重要的事，不是見多少世面，而是學會和自己和解。": "The most important thing in life isn't how much of the world you've seen, but learning to make peace with yourself.", "見天地，才知道自己的渺小。": "See the heavens and earth, and you realize how small you are.", "見天地、見眾生、見自己。": "See the world, see people, see yourself.", "天大地大，人只是一粒塵埃。": "The world is vast, and a person is just a speck of dust.", "塵埃雖小，也有自己的光。": "Small as the dust is, it has its own light.", "見眾生，才學會真正的寬容。": "See all kinds of people, and you learn real tolerance.", "見自己，才找到真正的歸宿。": "See yourself, and you find where you belong.", "唯有平視，才能看清腳下的路。": "Only by looking at things level can you see the road under your feet.", "知渺小、學寬容、找歸宿。": "Know you're small, learn tolerance, find where you belong.", "暴雨中的外賣小哥，凌晨的擺攤老人，光鮮背後的苦。": "The delivery rider in a downpour, the elderly stall owner at dawn, the hardship behind the shine.", "不輕視、不自卑、不比較。": "Don't look down on anyone, don't feel inferior, don't compare.", "年輕時低頭走路覺得不夠好，抬頭看人覺得太差。": "When young, you walked head down, feeling not good enough, and looked up at others thinking they were lacking.", "你不再輕易評價誰，因為每個人都有難處。": "You no longer judge anyone easily, because everyone has their struggles.", "見多少世面不重要，與自己和解才重要。": "How much of the world you've seen doesn't matter. Making peace with yourself does.", "你們說呢？": "What do you think?", "你見過天地之大嗎？": "Have you seen how vast the world is?", "你還在輕易評價別人嗎？": "Do you still judge others easily?", "你和自己和解了嗎？": "Have you made peace with yourself?", "你在海邊看日出時，突然覺得房貸與職稱都不算什麼。": "Watching the sunrise at the sea, you suddenly felt your mortgage and job title were nothing.", "看見暴雨中狂奔的外賣小哥，你再也不忍心給差評。": "Seeing a delivery rider racing through a downpour, you could never bring yourself to leave a bad review again.", "走了半生，你終於接納了那個不完美的自己。": "After half a lifetime, you finally accepted the imperfect you.", "渺小，反而讓人踏實。": "Being small actually makes you feel grounded.", "寬容，來自看見。": "Tolerance comes from seeing.", "和解，是最終的歸宿。": "Making peace is the final home.", "平視，是最好的姿態。": "Looking at the world level is the best posture.", "先見天地，再見眾生，最後見自己。": "See the world first, then people, then yourself.", "從自大，到寬容，到和解。": "From arrogance, to tolerance, to peace.", "看天、看人、看己。": "Look at the sky, look at people, look at yourself.", "人這輩子最重要的事，是學會和自己和解。": "The most important thing in life is learning to make peace with yourself.", "願你見過天地，也看清自己。": "May you see the world, and see yourself clearly too.", "平視世界，溫柔待己。": "Look at the world level, and treat yourself gently.", "活了30年，今天才知道這8句老話被誤傳了！": "Lived 30 years to learn that these 8 old sayings were passed down wrong!", "老話不一定都對，傳著傳著就變味了；別把被篡改的俗語當成人生信條。": "Old sayings aren't always right. They change as they get passed along. Don't take a tampered proverb as a life creed.", "一字之差，意思天壤之別。": "One word off, and the meaning is worlds apart.", "貧與窮、官印與觀音、度與毒。": "Frugal versus poor, Guanyin versus an official seal, measure versus poison.", "你們還知道哪些被篡改的俗語？": "What other tampered proverbs do you know?", "願你讀懂老話的本意。": "May you read old sayings for what they truly meant.", "老話不一定都對，傳著傳著就變味了。": "Old sayings aren't always right. They change as they get passed along.", "量小非君子，無度不丈夫。": "Without a small mind you're no gentleman; without self-restraint you're no great man.", "追本溯源，才不會被誤導。": "Trace it to the source so you won't be misled.", "窮養兒子富養女、男戴觀音女戴佛、無毒不丈夫、女子無才便是德。": "Raise sons poor and daughters rich; men wear Guanyin and women wear Buddha; no poison, no great man; a woman's virtue is her lack of talent.", "查原文、懂本意、不盲從。": "Check the original, know the real meaning, don't follow blindly.", "誤傳、篡改、營銷話術。": "Misquotes, tampering, marketing lines.", "貧是刻意剋扣學吃苦，窮是走投無路。": "Being \"frugal\" meant deliberately holding back so a child learns hardship. Being \"poor\" meant having nowhere to turn.", "商家編的營銷話術，被當成了傳統。": "A marketing line invented by merchants got treated as tradition.", "氣度變成了毒辣，害多少人當狠人。": "Generosity turned into ruthlessness, and many were led to play the tough guy.", "盲從老話很容易，查證原意很重要。": "Following old sayings blindly is easy. Checking what they originally meant is what matters.", "你深信的那句老話，查過原意嗎？": "That old saying you firmly believe: did you ever check its original meaning?", "你是不是被誤傳的俗語影響過？": "Have you ever been swayed by a misquoted proverb?", "一字之差，你注意過嗎？": "One word off: did you notice?", "你一直信「無毒不丈夫」，處處算計別人，後來才知原話是「無度」。": "You always believed \"no poison, no great man\" and schemed against everyone, then learned the original was \"no self-restraint.\"", "朋友堅持男戴觀音女戴佛，原來只是商家的營銷說法。": "A friend insisted men wear Guanyin and women wear Buddha, only for it to turn out to be a merchant's sales pitch.", "你查到「貧養兒子」的本意後，重新調整了教育孩子的方式。": "After finding the real meaning of \"raise sons frugally,\" you changed how you raise your kids.", "老話不老，但可能被改了。": "Old sayings aren't old. They may have been altered.", "查證，是對智慧的尊重。": "Checking the source is respect for wisdom.", "一個字，可能改變一生的信念。": "One word can change the belief of a lifetime.", "盲信不如求真。": "Seeking truth beats blind faith.", "先懷疑，再查證，最後理解本意。": "Doubt first, verify next, understand the real meaning last.", "從盲信，到求證，到清醒。": "From blind faith, to verifying, to clarity.", "疑、查、懂。": "Doubt, check, understand.", "所以啊，老話不一定都對。": "So yes, old sayings aren't always right.", "一字之差，千里之謬。": "One word off, a thousand miles wrong.", "求真，是對傳統最好的尊重。": "Seeking truth is the best respect for tradition.", "帶團隊這麼多年，終於搞明白一件事：管人不是靠感情，而是靠佈局！": "After leading teams for years, I finally get it: managing people isn't about affection, it's about positioning!", "管人不是靠感情，而是靠佈局；帶團隊就像下棋，先看清全局再落子。": "Managing people isn't about affection, it's about positioning. Leading a team is like playing chess: see the whole board before you place a piece.", "先選後育，先態度後能力。": "Select first, then develop. Attitude first, then ability.", "先培養再授權，先考驗再分權。": "Develop before delegating. Test before sharing power.", "感情維繫一時，佈局維繫長久。": "Affection holds for a moment. Positioning holds for the long run.", "佈局對了，人就對了。": "Get the positioning right and the people are right.", "管人不是靠感情，而是靠佈局。": "Managing people isn't about affection. It's about positioning.", "帶團隊就像下棋，先看清全局再落子。": "Leading a team is like playing chess: see the whole board before you place a piece.", "不躍層做事，不穿層管人。": "Don't skip levels when doing the work, don't bypass levels when managing people.", "用人原則、成長原則、做事原則。": "Principles for choosing people, growing people, and getting things done.", "先做事後做人，既做人又做事。": "Work first, people second; do both together.", "先留人後招人。": "Retain people first, recruit later.", "誰能力強就提拔誰，結果不服管。": "You promoted whoever was strongest, and they wouldn't take direction.", "論資排輩看似公平，有能力的全跑了。": "Promoting by seniority looks fair, but the capable all leave.", "今天救火明天補坑，是因為沒有佈局。": "Fighting fires today and patching holes tomorrow means you never positioned your team.", "你們帶團隊踩過哪些坑？": "What pits have you stepped in leading teams?", "你的團隊，每個人都在對的位置嗎？": "Is everyone on your team in the right seat?", "你是先授權還是先培養？": "Do you delegate first or develop first?", "你有穿層管人嗎？": "Do you bypass levels when managing people?", "你提拔了業績最好的員工當主管，他帶頭和你對著幹。": "You promoted your top performer to manager, and they led the charge against you.", "你堅持論資排輩，最有潛力的年輕人一個個離職。": "You insisted on seniority, and your most promising young people left one by one.", "你重新佈局團隊配置後，每個人都找到了發揮的位置。": "After you repositioned your team, everyone found the spot where they could shine.", "佈局，比管人更重要。": "Positioning matters more than managing.", "先態度後能力，是選人的智慧。": "Attitude first, ability second: that's the wisdom of choosing people.", "先考驗再分權，是保護團隊。": "Test before sharing power: that protects the team.", "下好每一步棋，團隊自然穩。": "Make every move well and the team stays steady.", "先看全局，再定原則，最後落實準則。": "See the whole board first, set principles next, put them into practice last.", "從救火，到佈局，到從容。": "From firefighting, to positioning, to calm.", "選、育、授、分。": "Select, develop, delegate, share.", "願你下好每一步棋，帶出最強的團隊。": "May you play every move well and build the strongest team.", "三層圈，圈出管理的智慧。": "Three rings, drawing the wisdom of management.", "你知道嗎？老祖宗留下的這15句八字成語，句句都是人生大智慧！": "Did you know these 15 eight-character idioms from our ancestors are all great life wisdom?", "小時候背的八字成語，全是人生真諦，三十歲後踩了坑才懂。": "The eight-character idioms we memorized as kids hold life's truths. You only get them after stumbling in your thirties.", "尺有所短，寸有所長。": "A foot has its shortness, an inch has its length.", "從善如登，從惡如崩。": "Following good is like climbing; following evil is like collapsing.", "成語不只是背誦，是人生的鑰匙。": "Idioms aren't just for reciting. They're keys to life.", "願你讀懂每一句成語背後的故事。": "May you read the story behind every idiom.", "兼聽則明，偏信則闇。": "Listen to all sides and you see clearly; trust one side and you're in the dark.", "海納百川，有容乃大。": "The sea takes in a hundred rivers; tolerance makes it great.", "君子之交，淡如水。": "A gentleman's friendship is plain as water.", "當局者迷，旁觀者清。": "The one in the game is confused; the onlooker sees clearly.", "得道多助，失道寡助。": "Those who follow the right path find many allies; those who stray find few.", "精誠所至，金石為開。": "Sincerity moves even metal and stone.", "看人看事，不能只看表面。": "Judge people and events by more than the surface.", "酒肉朋友跑得快，平淡知己最可靠。": "Drinking buddies run fast. Plain friends are the most reliable.", "讀書百遍，其義自見。": "Read a book a hundred times and its meaning shows itself.", "鞠躬盡瘁，死而後已。": "Give your all until the very end.", "你最認同哪一句？": "Which one do you agree with most?", "你有沒有看不起過一位同事，後來才發現他很厲害？": "Have you ever looked down on a coworker, only to find out they were brilliant?", "你做決定時，兼聽了嗎？": "When you decide, do you listen to all sides?", "你身邊的君子之交是誰？": "Who are the gentleman-friends around you?", "你覺得同事小張不如你，後來發現他做銷售是一把好手。": "You thought your coworker Zhang was beneath you, then found out he's great at sales.", "買房時不聽老婆的勸，結果多花了十幾萬。": "You ignored your wife's advice when buying a home and spent over a hundred thousand more.", "朋友的公司表面光鮮，實際上早已入不敷出。": "A friend's company looked glamorous on the surface but was already running at a loss.", "每個人都有長處。": "Everyone has strengths.", "平淡，才是最長久的友情。": "Plain friendship lasts the longest.", "兼聽，是避坑的祕訣。": "Listening to all sides is the secret to avoiding pits.", "先背誦，再經歷，最後領悟。": "Memorize first, experience next, understand last.", "從朗朗上口，到踩坑，到懂得。": "From rolling off the tongue, to stumbling, to understanding.", "背、遇、悟。": "Recite, encounter, realize.", "小時候背的那些話，全是人生真諦。": "Those lines we memorized as kids were all life's truths.", "八個字，一生受用。": "Eight characters, a lifetime of use.", "君子之交淡如水，卻最長久。": "A gentleman's friendship is plain as water, yet lasts longest.", "你有沒有發現，身邊有些人好像突然就變厲害了？": "Have you noticed some people around you seem to suddenly get great?", "突然變厲害的人，都悄悄做到了九件事：不躲人、多掙錢、積人脈、清目的、會保密、會繞路、會斟酌、會警惕、重視有價值的東西。": "People who suddenly get great quietly do nine things: don't hide from people, earn more, build connections, know their purpose, keep secrets, take detours, weigh things, stay alert, value what matters.", "錢不是萬能，但錢能給你底氣。": "Money isn't everything, but money gives you quiet confidence.", "不躲人、多掙錢、積人脈。": "Don't hide, earn more, build connections.", "越怕社交越要逼自己出去。": "The more you fear socializing, the more you should push yourself out the door.", "悄悄努力，然後驚豔眾人。": "Work quietly, then amaze everyone.", "自信，是練出來的。": "Confidence is trained.", "嘴巴不嚴的人，走到哪裡都不被信任。": "A person who can't keep a secret isn't trusted anywhere.", "把時間花在刀刃上。": "Spend your time where it counts.", "清目的、會保密、會繞路。": "Know your purpose, keep secrets, take detours.", "會斟酌、會警惕、重價值。": "Weigh things, stay alert, value what matters.", "走出去、存下來、聯繫著。": "Go out, save up, stay in touch.", "別等到需要幫忙才聯絡人。": "Don't wait until you need help to reach out.", "死磕的人最傻，聰明人會繞路。": "Grinding it out is the dumbest way. Smart people take a detour.", "別人對你太好時，先想想為什麼。": "When someone is too nice to you, ask yourself why first.", "看完這九條，你做到了幾條？": "After reading these nine, how many do you do?", "你是不是一直在躲人？": "Have you been hiding from people?", "你的目標，清晰嗎？": "Is your goal clear?", "你的嘴，嚴嗎？": "Can you keep your mouth shut?", "你以前見人就緊張，硬著頭皮參加聚會後越來越自在。": "You used to get nervous around people, but after forcing yourself to go to gatherings, you grew more at ease.", "你只在需要幫忙時才聯絡朋友，結果沒人願意幫你。": "You only reached out to friends when you needed help, and no one was willing to help.", "你一條路走不通死磕到底，同事繞了個彎就解決了。": "You pushed down a dead-end road, and your coworker took a detour and solved it.", "變厲害不是突然的，是悄悄累積的。": "Getting great isn't sudden. It's built up quietly.", "保密，是信任的基礎。": "Keeping secrets is the foundation of trust.", "變通，不是投機，是智慧。": "Being flexible isn't opportunism. It's wisdom.", "聚焦有價值的事，才能成長。": "Focus on what has value to grow.", "先走出去，再存下來，再聯繫著，最後聚焦價值。": "Go out first, save up next, stay in touch after that, and finally focus on value.", "從原地，到悄悄變強，到突然厲害。": "From standing still, to quietly getting stronger, to suddenly being great.", "社交、財富、人脈、目標、保密。": "Social life, wealth, connections, goals, secrecy.", "真正變強的人，都悄悄做到了這九件事。": "People who really get stronger quietly do these nine things.", "願你也悄悄變強，突然驚豔所有人。": "May you quietly grow stronger and suddenly amaze everyone.", "九件小事，一個大改變。": "Nine small things, one big change.", "人到中年才明白，人生其實就五個階段，看看你現在在哪個？": "Not until midlife did I understand that life has just five stages. Which one are you in?", "人生五個階段：狂、默、簡、藏、真；智者高手，至真至純，至善至狠。": "Life's five stages: wild, silent, simple, hidden, real. The wise and masterful are utterly genuine, utterly pure, utterly kind, utterly tough.", "簡單，才是真正的強大。": "Simple is the real strength.", "不再追求光鮮，內心反而豐盈。": "Stop chasing the shine, and your inner world grows richer.", "每一個階段，都是必經之路。": "Every stage is a road you must walk.", "返璞歸真，是最美的歸宿。": "Returning to simplicity is the most beautiful destination.", "智者高手，至真至純，至善至狠。": "The wise and masterful are utterly genuine, utterly pure, utterly kind, utterly tough.", "悟透人性，看開得失，不再裝、不再演。": "See through human nature, take gains and losses lightly, stop pretending, stop performing.", "狂、默、簡、藏、真。": "Wild, silent, simple, hidden, real.", "不知天高地厚，學會閉嘴低頭，做減法，收鋒芒，率真坦誠。": "Not knowing how high the sky is, learning to shut up and bow your head, subtracting, sheathing your edge, being frank and sincere.", "被打臉、被教育、被淬鍊、被成全。": "Get slapped in the face, get taught, get tempered, get made whole.", "裝、演、藏、真。": "Pretend, perform, hide, be real.", "年輕時覺得自己是天選之人，現實啪啪打臉。": "When young, you felt chosen by fate, and reality slapped you in the face.", "閉嘴不是認輸，是懂了。": "Shutting up isn't giving in. It's understanding.", "藏起實力的人，才是真正的高手。": "Those who hide their strength are the true masters.", "這五個階段，你現在到第幾個了？": "Which of these five stages are you in now?", "你還在狂嗎？": "Are you still wild?", "你學會做減法了嗎？": "Have you learned to subtract?", "你能活得真實嗎？": "Can you live authentically?", "二十歲的你覺得自己無所不能，第一次創業就失敗了。": "At twenty you thought you could do anything, and your first startup failed.", "三十歲後你學會了沉默，開始在會議上多聽少說。": "After thirty you learned silence, and in meetings you started listening more and speaking less.", "五十歲的長輩不再在意別人眼光，活得比誰都自在。": "An elder in their fifties no longer cares what others think and lives more freely than anyone.", "狂是開始，真是歸宿。": "Wild is the beginning. Real is the destination.", "藏，是為了更好地真。": "Hiding is how you become more real.", "真，是最高的境界。": "Real is the highest realm.", "從狂，到默，到簡，到藏，到真。": "From wild, to silent, to simple, to hidden, to real.", "從自以為是，到看透人性，到返璞歸真。": "From self-righteous, to seeing through people, to returning to simplicity.", "一階一悟，一悟一升。": "One stage, one insight; one insight, one step up.", "願你走過狂與藏，終抵於真。": "May you pass through wildness and hiding and arrive at the real.", "人生五階，步步修行。": "Five stages of life, each a step in practice.", "在職場上混了這麼多年，終於搞明白一件事：跟對領導太重要了！": "After all these years at work, I finally get it: following the right leader matters so much!", "跟對領導太重要了：遇到草包領導是一種消耗，遇到優秀領導是一種幸運。": "Following the right leader matters so much: a clueless leader drains you, a great leader is a stroke of luck.", "知人善用，放大每個人長處。": "Know your people and use them well, and magnify everyone's strengths.", "跟對人，比做對事更重要。": "Following the right person matters more than doing the right thing.", "從消耗，到選擇，到成長。": "From drained, to choosing, to growing.", "遇到優秀領導，是一種幸運。": "Meeting a great leader is a stroke of luck.", "遇到草包領導是一種消耗，遇到優秀領導是一種幸運。": "A clueless leader is a drain. A great leader is a stroke of luck.", "扛事、定方向、自己擔責，功勞分給下屬。": "Take the hit, set the direction, own the blame, share the credit with the team.", "情緒藏住、底線清晰、氣場穩。": "Hide your emotions, keep your limits clear, hold a steady presence.", "遇事態度、管人方式、談判格局、溝通邏輯。": "Attitude in crises, how they manage people, vision in negotiation, logic in communication.", "帶人結果、底線城府、解決問題、用人眼光。": "Results from leading people, limits and depth, solving problems, an eye for talent.", "扛事、定規、穩情、直擊、凝聚。": "Take the hit, set rules, stay calm, hit the point, bring people together.", "發脾氣、甩鍋、畫大餅、搞內鬥。": "Losing their temper, shifting blame, promising the moon, playing internal politics.", "草包靠吼，優秀靠規則。": "The clueless yell. The great set rules.", "草包底牌全露，優秀留有退路。": "The clueless show every card. The great leave an exit.", "草包喜歡聽話的傻子，優秀放大能幹的人。": "The clueless like obedient fools. The great magnify the capable.", "草包抱怨拖延，優秀找根源快速落地。": "The clueless complain and delay. The great find the root cause and land it fast.", "你是哪種領導？": "What kind of leader are you?", "你遇到過哪種領導？": "What kind of leader have you met?", "你的主管，出事時是扛還是甩？": "When trouble hits, does your boss take the hit or pass it on?", "你自己，是在定規則還是在畫大餅？": "Are you setting rules or promising the moon?", "主管一出事就罵下屬，團隊人心渙散人人躺平。": "Your boss blames the team at the first sign of trouble, and everyone loses heart and checks out.", "一位領導總把功勞分給下屬，團隊願意為他加班到深夜。": "One leader always shared credit with the team, and they were willing to work late into the night for him.", "你發現自己也開始喜怒寫在臉上，驚覺正在變成曾經討厭的人。": "You noticed your own moods showing on your face and realized you were becoming someone you once disliked.", "優秀的領導，讓人有奔頭。": "A great leader gives people something to look forward to.", "草包領導，是職涯的隱形成本。": "A clueless leader is a hidden cost to your career.", "成為優秀領導，從自我覺察開始。": "Becoming a great leader starts with self-awareness.", "先看清領導，再做出選擇，最後成為更好的自己。": "See your leader clearly first, make your choice next, then become a better you.", "看、選、成。": "See, choose, become.", "願你跟對人，也成為對的人。": "May you follow the right person, and become the right person.", "好的領導，讓團隊發光。": "A good leader makes a team shine.", "做一個讓人願意追隨的人。": "Be someone people want to follow.", "當上管理者才知道，帶團隊和幹活完全不是一回事！": "Becoming a manager taught me that leading a team and doing the work are completely different things!", "管人就是拿捏人性：換、拆、壓、捧、誇、晾、誘、嚇、拉、裝十策。": "Managing people is handling human nature: ten moves: swap, break down, press, praise up, compliment, leave waiting, lure, warn, win over, play dumb.", "認可，比加薪還管用。": "Recognition beats a raise.", "團隊太鬆散，等於在養閒人。": "A team that's too loose is just feeding idlers.", "你們在帶團隊時踩過什麼坑？": "What pits have you stepped in while leading a team?", "管人的策略，是踩坑踩出來的。": "Strategies for managing people come from stepping in pits.", "管人就是拿捏人性。": "Managing people is handling human nature.", "看破不說破，是格局。": "Seeing through without calling it out is vision.", "信任，比威壓更持久。": "Trust lasts longer than intimidation.", "換、拆、壓、捧、誇。": "Swap, break down, press, praise up, compliment.", "晾、誘、嚇、拉、裝。": "Leave waiting, lure, warn, win over, play dumb.", "換位思考，拆解任務，適當施壓。": "See from their side, break tasks down, apply pressure when needed.", "給人面子，及時誇獎，利益誘導。": "Give people face, praise promptly, motivate with benefits.", "技術牛的人往往被團隊拖垮，技術一般的人反而晉升快。": "Technical stars often get dragged down by the team, while average techies get promoted faster.", "畫餅不如給實際目標。": "Real goals beat empty promises.", "適度敲打，讓人知道底線。": "A timely nudge shows people where the line is.", "你有站在下屬角度想過嗎？": "Have you ever thought from your subordinate's side?", "你上一次誇獎下屬，是什麼時候？": "When did you last praise a subordinate?", "你懂得適當裝糊塗嗎？": "Do you know when to play dumb?", "你技術最強，卻因為不會帶人，團隊績效墊底。": "You were the best technically, but couldn't lead, and your team's performance came last.", "你把一個大目標拆成小步驟，原本抗拒的團隊開始動起來。": "You broke one big goal into small steps, and the once-resistant team started moving.", "一位傲氣的下屬被晾了一週，冷靜後主動來溝通。": "A proud subordinate was left waiting for a week, then calmed down and came to talk on their own.", "帶團隊和幹活，是兩回事。": "Leading a team and doing the work are two different things.", "拿捏人性，不是操控，是理解。": "Handling human nature isn't manipulation. It's understanding.", "捧人，就是給自己台階。": "Praising people gives you a way out too.", "先換位，再拆解，再施壓與激勵，最後拉攏人心。": "Switch sides first, break it down next, press and motivate after that, and finally win hearts.", "從技術者，到管理者，到領導者。": "From technician, to manager, to leader.", "換、拆、壓、誇、拉。": "Swap, break down, press, praise, win over.", "願你懂人性，帶好人。": "May you understand people and lead them well.", "十策在手，團隊在心。": "Ten moves in hand, the team in your heart.", "信任，是最長久的管理。": "Trust is the longest-lasting management.", "說到搞錢，我發現一個扎心的規律...": "When it comes to making money, I noticed a painful pattern...", "一等二靠三落空，一想二幹三成功；最壞的結果，也不過是大器晚成。": "Wait and rely and you end up empty-handed. Think and act and you succeed. The worst case is simply being a late bloomer.", "最壞的結果，也不過是大器晚成。": "The worst case is simply being a late bloomer.", "多元收入、多學習、多探索。": "Multiple income streams, more learning, more exploring.", "幹這個嫌錢少，幹那個怕丟人。": "Doing this pays too little, doing that feels embarrassing.", "開始，永遠不晚。": "It's never too late to start.", "一等二靠三落空，一想二幹三成功。": "Wait and rely, end up empty-handed. Think and act, succeed.", "賣東西不一定要便宜，但要讓客戶覺得佔了便宜。": "Selling doesn't have to be cheap, but customers should feel they got a deal.", "沒人能隨便成功。": "No one succeeds by accident.", "用體力別偷懶，用腦力別省心，用錢賺錢別碰良心，用資源別太要面子。": "Use your body, don't slack. Use your brain, don't coast. Make money work, but keep your conscience. Use resources, but drop the pride.", "貴人相助、高人點撥、親人祝福、自身努力、小人監督。": "Benefactors help, mentors guide, family blesses, your effort delivers, rivals keep you honest.", "腦子、眼光、機遇。": "Brains, vision, opportunity.", "越有錢的人越忙，越喊窮的人越挑。": "The richer people are, the busier they are. The more people cry poor, the pickier they are.", "等靠是落空，想幹是成功。": "Waiting and relying end in nothing. Thinking and doing end in success.", "晚不晚不重要，開始才重要。": "Late or not doesn't matter. Starting does.", "你身邊有這樣的人嗎？": "Do you have someone like this around you?", "你是在等，還是在幹？": "Are you waiting, or doing?", "現在開始努力，晚不晚？": "If you start working hard now, is it too late?", "你的成功，有五個人在幫你嗎？": "Do you have five kinds of people helping your success?", "你總嫌兼職錢少，一年後依然只有一份死薪水。": "You always found part-time pay too low, and a year later you still have just one fixed paycheck.", "一位四十歲才開始創業的朋友，五年後成了業界黑馬。": "A friend who started a business at forty became an industry dark horse five years later.", "你讓客戶覺得物超所值，回購率翻了一倍。": "You made customers feel they got more than they paid for, and your repeat purchase rate doubled.", "晚開始不可怕，不開始才可怕。": "Starting late isn't scary. Never starting is.", "要面子的人，賺不到資源的錢。": "People who protect their pride can't earn money from resources.", "小人監督，也是成功的助力。": "Even rivals who keep you honest help you succeed.", "敢於試錯，才有機會成功。": "Dare to try and fail, and you earn a chance to succeed.", "先想，再幹，再試錯，最後成功。": "Think first, act next, test and fail after that, and finally succeed.", "從等靠，到想幹，到成功。": "From waiting and relying, to thinking and doing, to success.", "想、幹、試、成。": "Think, act, test, succeed.", "願你一想二幹三成功。": "May you think, then act, then succeed.", "搞錢的路上，敢於試錯。": "On the road to making money, dare to try and fail.", "職場10年，我終於明白了：為什麼有些人能力一般，卻能當領導？": "After 10 years at work, I finally understand: why do some people with average ability become leaders?", "能力一般卻能當領導，贏的不是能力，是性格。": "Average ability yet leader material: what wins isn't ability, it's temperament.", "別光讓馬兒跑，不給馬兒吃草。": "Don't make the horse run without giving it grass.", "外表靜、性格穩、沉得住。": "Calm outside, steady in nature, able to hold your ground.", "遇事慌張的人，下屬也跟著慌。": "When a leader panics in a crisis, the team panics too.", "一半一半，慢慢修成。": "Half and half, slowly cultivated.", "真正厲害的領導，贏的不是能力，是性格。": "What truly great leaders win with isn't ability. It's temperament.", "水至清則無魚，太苛刻的人帶不好團隊。": "Water that's too clear has no fish. A leader who's too harsh can't lead a team.", "自己都管不好，憑什麼管別人。": "If you can't manage yourself, what right do you have to manage others?", "沉穩、社交、洞察、共情、包容。": "Steady, social, perceptive, empathetic, inclusive.", "善賞、果決、責任、自律、邏輯。": "Generous with rewards, decisive, responsible, self-disciplined, logical.", "敢拍板、敢擔責、敢止損。": "Dare to decide, dare to take responsibility, dare to cut losses.", "業務最強不一定當領導，性格對了才能帶團隊。": "The top salesperson isn't necessarily the leader. The right temperament is what leads a team.", "關鍵時刻優柔寡斷，隊伍就散了。": "Hesitate at the critical moment, and the team falls apart.", "話都說不清楚，怎麼帶隊伍？": "Can't even explain yourself clearly, so how can you lead a team?", "你最欠缺哪一條？": "Which one do you lack most?", "遇事時，你能穩住情緒嗎？": "When trouble comes, can you keep your emotions steady?", "你會分錢嗎？": "Do you know how to share the money?", "出了事，你先護下屬嗎？": "When things go wrong, do you protect your people first?", "你業務能力第一，卻因為脾氣急躁始終升不上去。": "You were number one in sales but never got promoted because of your short temper.", "能力一般的同事因為善於共情與分利，被提拔為主管。": "An average coworker got promoted to manager for being empathetic and sharing the gains.", "你學會在關鍵時刻拍板後，團隊對你的信任大增。": "After you learned to make the call at critical moments, your team's trust in you jumped.", "領導力，是性格的修煉。": "Leadership is the cultivation of temperament.", "性格可以改，領導力可以練。": "Temperament can change. Leadership can be trained.", "共情，是領導的溫度。": "Empathy is a leader's warmth.", "果決，是領導的骨氣。": "Decisiveness is a leader's backbone.", "先修沉穩與自律，再練共情與包容，最後強化果決與責任。": "Cultivate steadiness and self-discipline first, practice empathy and inclusiveness next, and strengthen decisiveness and responsibility last.", "從業務高手，到團隊領袖。": "From sales star, to team leader.", "穩、通、察、容、賞、斷、擔。": "Steady, communicative, perceptive, inclusive, generous, decisive, accountable.", "說實話，這十條我也只做到一半。": "Honestly, I only do half of these ten myself.", "願你修好性格，成為讓人追隨的領導。": "May you cultivate your temperament and become a leader people follow.", "性格，是領導最深的底牌。": "Temperament is a leader's deepest card.", "剛看完這16句對仗，沉默了10分鐘……": "Just finished these 16 paired lines and sat in silence for 10 minutes...", "真正的智慧是剛柔並濟：該剛時剛，該柔時柔。": "True wisdom is balancing firm and soft: be firm when needed, soft when needed.", "小不等於弱，大不等於強。": "Small isn't weak, and big isn't strong.", "水看似柔弱，卻能滴水穿石。": "Water looks soft, yet drip by drip it wears through stone.", "從硬碰硬，到懂柔，到並濟。": "From head-on clashes, to understanding softness, to balance.", "滴水穿石，不在朝夕之功。": "Dripping water wears through stone, not in a day's work.", "真正的智慧，是剛柔並濟。": "True wisdom is balancing firm and soft.", "驕必敗，謙必勝。": "Pride fails, humility wins.", "心若靜，萬物皆可為鏡。": "If the heart is still, everything becomes a mirror.", "滴水穿，不在朝夕之功；鐵杵磨，全憑歲月之恆。": "Water wears through stone not in a day. An iron rod is ground to a needle only by years of persistence.", "欲雖熾，焚身終成虛妄；心若靜，萬物皆可為鏡。": "However fierce desire burns, it ends in ashes. If the heart is still, everything becomes a mirror.", "該剛時剛，該柔時柔。": "Be firm when needed, soft when needed.", "謙受益，滿招損。": "Humility benefits; fullness invites loss.", "鐵看似剛強，卻因太硬而易斷。": "Iron looks strong, but it snaps because it's too hard.", "一味剛強撞得頭破血流，一味柔弱站不起來。": "All firm, and you crash headfirst until you bleed. All soft, and you can't stand up.", "道理說了幾千年，真正做到的沒幾個。": "We've been saying these truths for thousands of years, and few actually live them.", "哪句最戳心？": "Which line hits hardest?", "你是太剛，還是太柔？": "Are you too firm, or too soft?", "你懂得何時剛何時柔嗎？": "Do you know when to be firm and when to be soft?", "你的心，靜嗎？": "Is your heart still?", "你在談判中寸步不讓，最後談崩了。": "You wouldn't give an inch in negotiations, and the deal fell apart.", "你一味退讓，被所有人當成軟柿子。": "You kept giving in, and everyone treated you as a pushover.", "你學會在原則上堅持、在細節上讓步後，合作越來越順。": "After you learned to hold firm on principles and yield on details, collaboration ran smoother.", "剛不是強，柔不是弱。": "Firm isn't strong, and soft isn't weak.", "剛柔並濟，才是智慧。": "Balancing firm and soft is wisdom.", "謙虛，是必勝之道。": "Humility is the way to win.", "心靜了，萬物皆明。": "A still heart sees everything clearly.", "先知剛，再知柔，最後剛柔並濟。": "Know firmness first, then softness, and finally balance them.", "剛、柔、濟。": "Firm, soft, balanced.", "十六句對仗，字字千金。": "Sixteen paired lines, every word worth gold.", "釋懷吧，別再為難自己了。": "Let it go. Stop being so hard on yourself.", "釋懷吧，別再為難自己；不求事事如意，但求問心無愧。": "Let it go and stop being hard on yourself. You needn't have everything go your way, only a clear conscience.", "失之東隅，收之桑榆。": "Lose at the east corner, gain at the mulberry shade.", "筷子喝不了湯，勺子吃不了麵。": "Chopsticks can't drink soup, a spoon can't eat noodles.", "糾結擰巴很累，順其自然很輕。": "Agonizing is tiring. Going with the flow is light.", "命裡有時終須有，命裡無時莫強求。": "What's meant to be will come. What isn't, don't force.", "不求事事如意，但求問心無愧。": "You needn't have everything go your way, only a clear conscience.", "與其討好所有人，不如先討好自己。": "Instead of pleasing everyone, please yourself first.", "得失、成敗、去留，都是人生常態。": "Gains and losses, wins and defeats, staying and leaving are all part of life.", "放下執念，降低期望，順其自然。": "Let go of obsession, lower expectations, go with the flow.", "善良、溫暖、對得起自己。": "Kind, warm, true to yourself.", "得到了未必是福氣，失去了也未必是禍患。": "Gaining isn't always a blessing, and losing isn't always a curse.", "不管你做得多好，總會有人說三道四。": "No matter how well you do, someone will always talk.", "老天關上一扇門，總會開一扇窗。": "When one door closes, a window opens.", "你最近有什麼放不下的事嗎？": "Is there something you can't let go of lately?", "你在為難誰？是不是自己？": "Who are you being hard on? Is it yourself?", "你還在討好所有人嗎？": "Are you still trying to please everyone?", "你問心無愧嗎？": "Is your conscience clear?", "你為一段結束的關係糾結了一年，越想越痛。": "You agonized over an ended relationship for a year, and the more you thought, the more it hurt.", "你努力做到完美，還是有人在背後說三道四。": "You worked hard to be perfect, and someone still gossiped behind your back.", "你終於放下那份執念，第一次睡得那麼安穩。": "You finally let go of that obsession and slept soundly for the first time.", "釋懷，是一輩子的必修課。": "Letting go is a lifelong required course.", "放下，不是放棄，是放過。": "Letting go isn't giving up. It's setting yourself free.", "各有各的用處，也各有各的侷限。": "Each has its use, and each has its limits.", "先討好自己，是最溫柔的修行。": "Pleasing yourself first is the gentlest practice.", "先接受，再放下，最後釋懷。": "Accept first, let go next, and finally find peace.", "從爭搶，到接受，到釋懷。": "From scrambling, to accepting, to letting go.", "認、放、釋。": "Accept, release, be free.", "願你做個善良溫暖的人，對得起自己的心。": "May you be kind and warm, and true to your own heart.", "放下的那一刻，天空都亮了。": "The moment you let go, the sky brightens.", "說出來，我們一起釋懷。": "Say it out loud, and we'll let it go together.", "老祖宗留下的這8條處世戒律，我看完後背發涼——": "These 8 rules of conduct from our ancestors sent a chill down my spine...", "不是善良本身有錯，而是它的反面更需要智慧去駕馭；善良到不懂分寸，就是災難。": "Kindness itself isn't wrong. Its opposite takes more wisdom to handle. Kindness without proportion is a disaster.", "慈不掌兵，義不經商。": "A soft heart can't command troops; righteousness doesn't suit business.", "仁不統眾、誠不避嫌、仁不治亂。": "Benevolence can't lead the masses, sincerity can't dodge suspicion, kindness can't quell chaos.", "什麼都想佔，最後什麼都留不住。": "Want to grab everything, and in the end you keep nothing.", "願你善良，也有分寸。": "May you be kind, with proportion.", "善良沒錯，但善良到不懂分寸，就是災難。": "Kindness isn't wrong, but kindness without proportion is a disaster.", "天道忌滿，貪不長久。": "Heaven dislikes fullness; greed doesn't last.", "不是這些本身有錯，是它們的反面更需要智慧。": "It's not that these are wrong. It's that their opposites take more wisdom.", "義不經商、慈不掌兵、富不還鄉、情不立事。": "Righteousness doesn't suit business, a soft heart can't command, the rich don't go home, feelings don't build careers.", "弱不掌權、懶不立業、躁不成事、傲不聚友。": "The weak can't hold power, the lazy can't build a career, the hasty can't finish things, the proud can't gather friends.", "貪不長久、信不輕諾、敏不多言、善不為吏。": "Greed doesn't last, trust shouldn't promise lightly, the sharp shouldn't talk much, the kind shouldn't be officials.", "心軟的人當不了領導，因為軍隊需要的是執行力。": "A soft-hearted person can't be a leader, because an army needs execution.", "混好了回老家，不是所有人都替你高興。": "When you do well and go home, not everyone is happy for you.", "單純善良的人，往往鬥不過心機深沉的。": "Simple, kind people often lose to the scheming and deep.", "你的善良，有分寸嗎？": "Does your kindness have proportion?", "你有沒有因為心軟而誤事？": "Has soft-heartedness ever made you botch things?", "你是不是承諾得太輕易了？": "Do you promise too easily?", "你因為心軟沒有處理犯錯的下屬，整個團隊紀律鬆散。": "You went soft on an erring subordinate, and discipline slackened across the whole team.", "你衣錦還鄉，卻感受到親友若有若無的酸意。": "You came home in glory and sensed a faint sourness from friends and family.", "你太貪心什麼都想要，最後連原本擁有的也失去了。": "You were so greedy for everything that you lost even what you had.", "善良需要智慧駕馭。": "Kindness needs wisdom to steer it.", "戒律不是禁止，是提醒。": "Rules aren't prohibitions. They're reminders.", "反面，往往藏著更深的道理。": "The opposite often hides a deeper truth.", "分寸，是善良的邊界。": "Proportion is kindness's boundary.", "先懂戒律，再懂人性，最後用智慧駕馭善良。": "Learn the rules first, understand people next, and finally steer your kindness with wisdom.", "從單純，到吃虧，到智慧。": "From simple, to getting burned, to wise.", "知、戒、駕。": "Know, restrain, steer.", "老祖宗拿命換來的教訓。": "Lessons our ancestors paid for with their lives.", "智慧，讓善良走得更遠。": "Wisdom lets kindness go further.", "戒律之中，藏著生存之道。": "Within the rules lies the way to survive.", "活了40年，終於把人生活明白了！": "Lived 40 years, and finally figured life out!", "萬丈深淵不見底，靠誰不如靠自己；你得先自己站起來，別人才願意拉你一把。": "The abyss has no bottom, so rely on yourself. You have to stand up first before others will give you a hand.", "每一條感悟，都是交過的學費。": "Every insight is tuition you've already paid.", "覺得扎心，說明你也經歷過。": "If it stings, you've been through it too.", "最戳你的是哪一句？": "Which line hits you hardest?", "四十年活明白，靠自己最踏實。": "Forty years to figure it out: relying on yourself is the surest.", "你得先自己站起來，別人才願意拉你一把。": "You have to stand up first before others will give you a hand.", "有些人，你對他掏心掏肺，他對你沒心沒肺。": "Some people you give your whole heart to, and they give you nothing back.", "年輕時總想靠朋友，跌倒後才知道靠自己。": "When young you wanted to lean on friends. After falling, you learned to rely on yourself.", "以為能看透人心，結果被坑得遍體鱗傷。": "You thought you could read people, and got badly burned.", "貴人不是沒有，是你得先站起來。": "It's not that there are no benefactors. You have to stand up first.", "你是在等人拉你，還是在自己爬起來？": "Are you waiting for someone to pull you up, or getting up yourself?", "你掏心掏肺的人，有珍惜你嗎？": "The people you give your whole heart to: do they cherish you?", "你靠的是自己，還是別人？": "Do you rely on yourself, or on others?", "你等了三年朋友答應的資源，最後一無所獲。": "You waited three years for resources a friend promised, and got nothing.", "你對一位朋友掏心掏肺，他卻在你最困難時消失。": "You gave a friend your whole heart, and they vanished when you were struggling most.", "你自己咬牙站起來後，以前不理你的人開始主動找你合作。": "After you gritted your teeth and stood up, the people who ignored you started reaching out to work with you.", "靠自己，不是孤立，是底氣。": "Relying on yourself isn't isolation. It's quiet confidence.", "貴人，只幫願意站起來的人。": "Benefactors only help those willing to stand up.", "扎心，是因為真實。": "It stings because it's true.", "學費交過了，智慧就留下了。": "Once the tuition is paid, the wisdom stays.", "先靠自己站起來，再吸引貴人，最後一起走更遠。": "Stand on your own first, attract benefactors next, and go further together.", "從依賴，到受傷，到自立。": "From depending, to getting hurt, to standing on your own.", "站、走、遠。": "Stand, walk, go far.", "願你自己站起來，然後遇見拉你一把的人。": "May you stand up on your own, then meet the one who gives you a hand.", "每一句感悟，都是人生的勳章。": "Every insight is a medal of life.", "努力奮鬥，心懷信念，勇往直前，這是我們在人生路上應有的姿態。就像馬年象徵的龍馬精神，它奔騰不息、一往無前。在個人成長中，保持這樣的精神至關重要。": "Work hard, hold a belief, charge forward. That's the stance we should take on life's road. Like the spirit of the dragon horse that the Year of the Horse stands for, tireless and unstoppable. Keeping this spirit matters enormously for personal growth.", "努力奮鬥、心懷信念、勇往直前，像龍馬精神般奔騰不息。": "Work hard, hold a belief, charge forward, tireless as the dragon-horse spirit.", "心懷信念，才能勇往直前。": "Hold a belief, and you can charge forward.", "好奇心是燃料，信念是方向。": "Curiosity is the fuel. Belief is the direction.", "好奇心，是永不老去的祕訣。": "Curiosity is the secret to never growing old.", "願你心懷信念，勇往直前。": "May you hold a belief and charge forward.", "把挑戰當成成長的機會。": "Treat challenges as chances to grow.", "奔騰不息，是生命最美的姿態。": "Galloping on without rest is life's most beautiful posture.", "目標，是前進的方向盤。": "A goal is the steering wheel of progress.", "努力奮鬥，心懷信念，勇往直前。": "Work hard, hold a belief, charge forward.", "記錄感恩，避免比較，保持好奇。": "Record gratitude, avoid comparison, stay curious.", "呼吸放鬆，分解任務，定期運動。": "Breathe to relax, break tasks down, exercise regularly.", "短期具體可衡量，長期有方向。": "Short-term goals specific and measurable, long-term goals with direction.", "消極比較讓人停滯，正向心態讓人前行。": "Negative comparison stalls you. A positive mindset moves you forward.", "壓力壓垮人，分解壓力讓人輕鬆。": "Pressure crushes people. Breaking it down makes it light.", "沒有目標的努力是空轉，有目標的努力是前進。": "Effort without a goal is spinning your wheels. Effort with a goal is moving forward.", "你把挑戰當成威脅，還是成長的機會？": "Do you see challenges as threats, or chances to grow?", "你有明確的短期與長期目標嗎？": "Do you have clear short-term and long-term goals?", "你懂得如何釋放壓力嗎？": "Do you know how to release pressure?", "你的好奇心還在嗎？": "Is your curiosity still alive?", "面對一個大專案，你被壓得喘不過氣，分解成小任務後終於動起來了。": "Facing a huge project, you felt crushed, but once you broke it into small tasks you finally got moving.", "你總和同齡人比較而焦慮，開始記錄感恩後心態大轉變。": "You were anxious comparing yourself to peers, and after you began recording gratitude, your mindset flipped. const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const en=s=>EN[s]||'';
const bi=s=>hl(s)+(en(s)?`<span class="en">${hl(en(s))}</span>`:'');
const biTxt=s=>s+(en(s)?'\n'+en(s):'');
const hl=s=>{s=esc(s);if(!kw)return s;return s.replace(new RegExp(esc(kw).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>'<mark>'+m+'</mark>')};
const allText=d=>{const a=[d.t,d.p||'',...d.c,...Object.values(d.q).flat()];return (d.b+a.join('')+a.map(en).join(' ')).toLowerCase()};
function list(){const ids=D.map((d,i)=>i).filter(i=>!kw||allText(D[i]).includes(kw.toLowerCase()));
$('#nav').innerHTML=ids.map(i=>`<a data-i="${i}" class="${i===cur?'on':''}"><small>${i+1}</small>${hl(D[i].t)}</a>`).join('')||'<a>查無結果</a>';
$('#sel').innerHTML=ids.map(i=>`<option value="${i}" ${i===cur?'selected':''}>${i+1}．${esc(D[i].t)}</option>`).join('');return ids}
function post(d){let s=biTxt(d.t)+'\n\n';if(d.p)s+='「'+d.p+'」'+(en(d.p)?'\n'+en(d.p):'')+'\n\n';for(const k in QN){if(d.q[k].length)s+=d.q[k].map(biTxt).join('\n')+'\n\n'}return s.trim()}
function art(){const d=D[cur];const f=d.f||[];
$('#main').innerHTML=`<div class="card"><h2>${cur+1}．${bi(d.t)}</h2></div>
${d.p?`<div class="prop"><small>核心命題</small>${bi(d.p)}</div>`:''}
<div class="card"><h3>臉書金句圖卡（${d.c.length} 句・${d.c.join('').length} 字）</h3>
<div class="cardwrap"><img id="cimg" alt="金句圖卡"><div class="cardtxt">${d.c.map(x=>`<p>${bi(x)}</p>`).join('')}
<div class="cardbtns"><button class="btn" id="cdl">下載圖卡 PNG</button><button class="btn" id="ccp">複製圖卡文字</button></div></div></div></div>
<div class="card"><h3>框架圖</h3><div class="flow">${f.map((x,j)=>(j?'<span class="arr">➜</span>':'')+`<div class="node"><i>${FL[j]||'步驟'+(j+1)}</i>${esc(x)}</div>`).join('')}</div>
<div class="mech"><div><b>觸發痛點</b>${esc(d.pain)}</div><div><b>運作機制</b>${esc(d.m)}</div><div><b>落地行動</b>${esc(d.a)}</div></div></div>
<div class="card"><h3>臉書圖文金句（${Object.values(d.q).flat().length} 句） <button class="btn" id="cp">複製整篇貼文</button></h3>
<div class="qbox">${Object.values(d.q).flat().map(x=>`<p>${bi(x)}</p>`).join('')}</div></div>
<div class="card"><details ${kw&&(d.t+d.b).includes(kw)?'open':''}><summary>原文（繁體）</summary><div class="raw">${hl(d.b)}</div></details></div>`;
$('#cp').onclick=()=>{navigator.clipboard.writeText(post(d)).then(()=>{$('#cp').textContent='已複製 ✓'})};
const url=drawCard(d);$('#cimg').src=url;
$('#cdl').onclick=()=>{const a=document.createElement('a');a.href=url;a.download=`${NAME}_${cur+1}_${d.t.slice(0,12).replace(/[\\/:*?"<>|｜]/g,'')}.png`;a.click()};
$('#ccp').onclick=()=>{navigator.clipboard.writeText(d.c.map(biTxt).join('\n\n')).then(()=>{$('#ccp').textContent='已複製 ✓'})};scrollTo(0,0)}
const NAME=document.querySelector('h1').textContent;
function wrap(x,s,w){const out=[];let line='';for(const ch of s){if(x.measureText(line+ch).width>w&&line&&!'。，、；：？！」』）…'.includes(ch)){out.push(line);line=ch}else line+=ch}if(line)out.push(line);return out}
function wrapEn(x,s,w){const out=[];let line='';for(const t of s.split(' ')){const n=line?line+' '+t:t;if(x.measureText(n).width>w&&line){out.push(line);line=t}else line=n}if(line)out.push(line);return out}
function fit(x,s,w){if(x.measureText(s).width<=w)return s;while(s&&x.measureText(s+'…').width>w)s=s.slice(0,-1);return s.trim()+'…'}
function drawCard(d){const S=1080,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');
const g=x.createLinearGradient(0,0,S,S);g.addColorStop(0,'#2b2622');g.addColorStop(1,'#6b4430');x.fillStyle=g;x.fillRect(0,0,S,S);
x.strokeStyle='rgba(232,196,150,.55)';x.lineWidth=3;x.strokeRect(50,50,S-100,S-100);
const F='"Noto Serif TC","PMingLiU","Microsoft JhengHei",serif';
x.fillStyle='#e8c496';x.font=`600 34px ${F}`;x.textAlign='center';x.fillText('「 '+(d.t.length>22?d.t.slice(0,22)+'…':d.t)+' 」',S/2,en(d.t)?135:150);
const FE='Georgia,"Times New Roman",serif';if(en(d.t)){x.font=`italic 26px ${FE}`;x.fillText(fit(x,en(d.t),S-200),S/2,180)}
const lay=fs=>{const es=Math.round(fs*.54),o=[];let h=0;const push=(s,fn,lh,col)=>{o.push({s,fn,lh,col});h+=lh};d.c.forEach((s,i)=>{if(i){o.push({lh:fs*.5});h+=fs*.5}x.font=`600 ${fs}px ${F}`;wrap(x,s,S-220).forEach(l=>push(l,x.font,fs*1.32,'#fff8ee'));if(en(s)){x.font=`italic ${es}px ${FE}`;wrapEn(x,en(s),S-220).forEach(l=>push(l,x.font,es*1.32,'#e8c496'))}});return {o,h}};
let fs=62,L=lay(fs);while(L.h>690&&fs>30){fs-=2;L=lay(fs)}
let y=(235+S-150)/2-L.h/2;for(const l of L.o){if(l.s){x.font=l.fn;x.fillStyle=l.col;x.fillText(l.s,S/2,y+l.lh*.8)}y+=l.lh}
x.fillStyle='#e8c496';x.font=`400 30px ${F}`;x.fillText('— '+NAME+' —',S/2,S-110);return c.toDataURL('image/png')}
function table(ids){$('#main').innerHTML=`<div class="card"><h3>每篇機制一頁總表（${ids.length} 篇）</h3><div class="tblwrap"><table><tr><th>#</th><th>標題</th><th>核心命題</th><th>觸發痛點</th><th>運作機制</th><th>落地行動</th><th>框架</th></tr>
${ids.map(i=>{const d=D[i];return `<tr><td class="n">${i+1}</td><td><a data-go="${i}">${hl(d.t)}</a></td><td>${hl(d.p)}</td><td>${esc(d.pain)}</td><td>${esc(d.m)}</td><td>${esc(d.a)}</td><td>${esc((d.f||[]).join(' → '))}</td></tr>`}).join('')}</table></div></div>`}
function render(){const ids=list();if(view==='a'){if(!ids.includes(cur)&&ids.length)cur=ids[0];list();art()}else table(ids)}
$('#nav').onclick=e=>{const a=e.target.closest('a[data-i]');if(a){cur=+a.dataset.i;view='a';tab();render()}};
$('#main').onclick=e=>{const a=e.target.closest('a[data-go]');if(a){cur=+a.dataset.go;view='a';tab();render()}};
$('#sel').onchange=e=>{cur=+e.target.value;view='a';tab();render()};
$('#q').oninput=e=>{kw=e.target.value.trim();render()};
function tab(){$('#t1').classList.toggle('on',view==='a');$('#t2').classList.toggle('on',view==='t')}
$('#t1').onclick=()=>{view='a';tab();render()};$('#t2').onclick=()=>{view='t';tab();render()};
render();
</script>
</body>
</html>
