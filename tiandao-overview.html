# 總覽
## 統一定位｜四套母體如何接在一起
天道母體｜Reality背後的生成／限制／演化／更新規律（世界如何運作）
宗教母體 Religion OS｜人類如何回答Ultimate Reality／Identity／Problem／Practice／Telos
Soul OS｜高階理解如何進入個人的Identity／Value／Weight／Attention／Prediction
LifeOS｜個體如何透過Action→Feedback→Error→Update在Reality中持續校準
### 四套不是競爭關係
天道八層｜總座標
智慧四層｜生成主幹
認知三母體｜認知引擎
Soul OS七結構｜高階參數／價值架構
### 最完整總鏈
> 天道／Reality→生成規律→生命→宗教／哲學／科學形成不同Representation→Soul Model→Prediction→Action→Reality Test→Prediction Error→Model Update→Capability→Wisdom→重新理解天道
* 天道提供約束，宗教提供終極詮釋，靈魂配置權重，認知生成預測，身體執行行動，Reality提供回饋，誤差迫使更新，能力經反覆測試形成，智慧則是多輪Reality Test後仍能保留下來的高階結構。

L0｜REALITY｜本源真實
L1｜DAO MATRIX 天道母體｜世界如何生成、限制、變化、更新？＝可能性Possibility＋限制條件Constraints＋變化Dynamics
L2｜生成結構｜可能性→限制→結構→互動→狀態轉移→Feedback→自組織→Emergence
L3｜生命母體｜維持→適應→學習→演化
L4｜認知母體｜Reality→Signal→Representation→Model→Prediction
L5｜靈魂母體｜Self Model＋World Model＋Value Model＋Weight
L6｜宗教／哲學母體｜Ontology＋Identity＋Problem＋Value＋Practice＋Telos
L7｜行動母體｜Attention→Interpretation→Decision→Action
L8｜Reality Test｜Outcome→Feedback→Difference→Prediction Error
L9｜更新母體｜Diagnosis→Reweight→Model Update→Retest

## 天道三大最高指令
01 對稱性 Symmetry｜生成結構、尋找不變量、在差異中尋找共同規律、形成Pattern → Pattern／Model
02 利己性 Self-Preservation／Objective｜系統必須維持自身、生命形成目標函數、資源有限必須選擇、選擇形成Weight、Weight形成路徑 → Value／Weight
03 無常性 Impermanence／Change｜所有狀態持續改變、舊結構逐漸失配、Difference累積、逼迫系統更新 → Prediction Error／Update
* 對稱性生成Model。利己性配置Weight。無常性逼迫Update。三者一起運作，產生生命的適應與演化。

## 天道三大科學子母體
A 量子／可能性母體｜什麼可能發生？Possibility Space／Probability／Uncertainty／State／Potential。提供「可能狀態空間」，不直接等同宗教中的神、道、法身或靈魂。
B 熱力學／熵母體｜為什麼所有結構都需要持續維持？Energy／Entropy／Dissipation／Gradient／Flow／Constraint。不投入能量維持的有序結構會逐漸失序，生命必須持續交換能量與資訊。
C 認知科學／預測母體｜生命如何建立可以行動的世界模型？Prior／Representation／Model／Prediction／Weight／Prediction Error／Model Update。
> 可能性母體＝有哪些可能？→熱力學母體＝哪些結構能維持？→認知母體＝Agent如何預測並選擇？→Action→Reality→Feedback

## 天道→靈魂的轉接點是Weight｜五大母體
> Reality有無限訊號→生命不可能處理全部→必須Selection→Selection需要Weight→Weight決定Salience→Salience控制Attention→Attention決定哪些Evidence進入Model→Model產生Prediction→Prediction影響Action
天道提供Constraints。靈魂配置Weight。認知生成Prediction。身體執行Action。Reality提供Feedback。
### 五大母體
L1 天道母體 DAO MATRIX｜提供生成規律與Constraints｜Reality怎麼運作？
L2 生命母體 LIFE MATRIX｜維持、自組織、適應、演化｜生命怎麼活下來？
L3 靈魂母體 SOUL MATRIX｜設定Identity／Value／Weight／Meaning｜對我而言什麼重要？
L4 認知母體 COGNITIVE MATRIX｜Representation／Prediction／Decision｜我認為接下來會發生什麼？
L5 具身／行動母體 EMBODIED MATRIX｜Body／Environment／Action／Feedback｜我的模型能不能在Reality裡成立？
> 再回到 Reality→Prediction Error→Model Update

## 天道母體的更新引擎
天道母體不能只停留在「大道理資料庫」。
> Source→Claim→Evidence→Concept→Node→Relation→Pattern→Mechanism→Constraint→Counterexample→Prediction→Stress Test→Prediction Error→Model Update→Retest→Confidence→Capability→Wisdom
經典、科學、哲學、AI都不是Truth Database的終點，它們都是不同的Model Generator。
Reality負責Constraint。Evidence負責Correction。Prediction Error負責暴露Difference。Model Update負責吸收Difference。Retest負責確認是否真的改善。
### 天道母體的真正循環（螺旋，不是直線）
> Reality→Possibility→Constraint→Structure→Dynamics→Interaction→Feedback→Self-Organization→Emergence→Life→Mind→Representation→Religion／Philosophy／Science→Soul Model→Weight→Prediction→Action→Outcome→Prediction Error→Model Update→Capability→Wisdom→重新理解Reality

## 八層壓縮＋最高階公式＋「對齊天道」
01 本體 REALITY｜真正存在的是什麼？

03 生成 GENERATION｜萬物怎麼形成？

08 更新 UPDATE｜Reality如何重新教育我？
> UPDATE→NEW MODEL→NEW SOUL STATE→NEW ACTION→NEW REALITY TEST→NEW WISDOM
### 最高階公式
> Reality→天道Constraint→生成Structure→生命Adaptation→人類Representation→Religion／Philosophy／Science→Soul Model→Value→Weight→Attention→Prediction→Emotion→Language→Decision→Action→Outcome→Feedback→Prediction Error→Diagnosis→Reweight→Model Update→Retest→Capability→Wisdom→更高解析度的Reality Model
### 「對齊天道」不是掌握一套永遠不會錯的宇宙答案
我的內在模型越來越能尊重Reality的Constraints。
我的Prediction越來越準。我的Action越來越有效。
我的Prediction Error越來越能被吸收。我的模型越來越有流動性。
我的能力越來越能跨情境遷移。
結果不是「永遠正確」，而是：更高的適應力、更高的更新力、更高的行動自由度、更低的模型僵化、更高的智慧壓縮。

> REALITY→CONSTRAINT→GENERATION→LIFE→SOUL→COGNITION→ACTION→FEEDBACK→ERROR→UPDATE→RETEST→CAPABILITY→TRANSFER→COMPRESSION→WISDOM→↺ REALITY
Reality提供約束。科學尋找規律。複雜系統揭露生成機制。生命系統維持與適應。Soul OS配置Model、Value與Direction。認知生成Prediction。具身系統把Prediction帶進Reality。Reality產生Feedback。認知更新吸收Prediction Error。Repeated Retest形成Capability。跨情境仍有效的Capability與Model再被壓縮，最後才形成Wisdom。
* 智慧不是從「想得很深」直接產生。智慧是Reality、Model、Action與Error長期循環之後，仍然能跨情境保留下來的高階結構。
* 八個動詞：看真實→找限制→拆生成→養容量→校權重→建模型→做實驗→再更新。

# 天道八層
## 閱讀原則｜八層是八種解析尺度，不是八個樓層
總公式｜L1本體→L2天道→L3生成→L4生命→L5靈魂→L6認知→L7行動→L8更新→回到L1重新測試。
越上游越接近「Reality與Constraint」，越下游越接近「Agent如何理解、行動與修正」。
### 精準語義修正
不是「Reality先產生天道，天道再產生生成，生成再產生生命」。
L1～L4｜主要描述Reality在不同尺度下的結構與動態。
L5～L7｜主要描述Agent如何表徵、評價、預測並作用於Reality。
L8｜描述Agent如何利用Reality Feedback修正自身模型。
八層＝Levels of Description。箭頭應大量使用「↕」：系統同時存在Bottom-up與Top-down Interaction。
> L1 REALITY↕L2 LAW／CONSTRAINT↕L3 GENERATIVE DYNAMICS↕L4 LIVING SYSTEM↕L5 SOUL／VALUE ARCHITECTURE↕L6 COGNITIVE MODEL↕L7 ACTION↕L8 FEEDBACK／UPDATE↕↺ NEW ACTION→NEW REALITY CONTACT
Bottom-up｜身體狀態會影響Emotion與Cognition。Top-down｜Value與Prediction也會影響Attention與Action。
Environment↔Person。Model→Action→Evidence→Model。真正結構是Coupled Dynamic System｜耦合動態系統。
### 核心閉環
> Reality→Constraint→Structure→Life→Soul→Model→Prediction→Action→Outcome→Prediction Error→Update→New Model→New Action→Reality Test

## L1｜本體層 REALITY｜真正存在的是什麼？
### 本質／精準定義
處理的不是「我怎麼想」，而是「不管我怎麼想，Reality究竟如何存在」。Reality不需要服從我的信念；Model需要接受Reality的約束。本體層是整個系統的最終校準源。
精準版｜L1不是「我們知道Reality真正是什麼」，而是：存在一個不完全依賴個人主觀期待而改變、並能對我們的行動產生約束與後果的Reality。核心是Epistemic Humility｜認識論謙遜。
! Reality ≠ Perception ≠ Interpretation ≠ Belief ≠ Narrative
! Reality ≠ Observation ≠ Data ≠ Representation ≠ Interpretation ≠ Model ≠ Reality（整套母體最重要的認識論防錯機制）
### 7個核心Node
01 Reality 實在｜真正存在或發生的狀態
02 Entity 實體｜系統中可以辨識的存在
03 Relation 關係｜存在之間如何相互連接
04 Property 性質｜一個存在具有哪些特徵
05 State 狀態｜系統此刻位於什麼位置
06 Boundary 邊界｜什麼屬於系統、什麼不屬於系統
07 Difference 差異｜Reality與我們描述之間的落差
### 舊模式→新模式
~ 我看到的就是Reality => 我看到的是Reality經過感官與Model形成的Representation
~ 我的感覺是真的，所以解釋一定是真的 => 感覺是真的，但原因模型仍需要測試
~ 我的信仰／理論／經驗就是Reality => 任何人類描述都需要區分Model與Reality
~ 世界一定符合我的期待 => Prediction必須服從Reality
~ 只有一種解釋 => 同一Evidence可能存在多個Candidate Models
~ 不知道代表世界沒有答案 => 不知道代表目前模型解析度不足
~ 我要捍衛答案 => 我要提高與Reality的對齊程度
### 核心能力
Reality Discrimination 區分事實與解釋／Observation／Boundary Detection／Relation Detection／Uncertainty Tolerance 容納不知道／Evidence Calibration 依證據調整信心／Reality Testing
精準版｜不是「知道真相」，而是 Reality Discrimination＋Evidence Calibration＋Uncertainty Management。
### 生成機制
> Reality→產生State→State形成Difference→Difference透過Interaction留下Signal→Agent接收到部分Signal→形成Representation→形成Model
我們接收到的永遠只是Reality的一部分。
### Prediction Error
Prediction「應該是A」／Reality「出現B」／Error＝A−B。L1最重要Error＝把Representation誤認成Reality。典型：Confirmation Bias、投射、過度概括、把Narrative當Fact。
精準版｜Prediction Error不是「Reality錯了」，是Model所預測的Observation與實際Observation的Difference＝Observed Outcome－Predicted Outcome。Observed Outcome本身可能有Measurement Error。
! Prediction Error ≠ Model一定錯。可能是 Model Error／Measurement Error／Sampling Error／Noise／Context Shift／Action Failure
### 槓桿
提高Reality接觸品質：高品質Evidence × 多角度Observation × 可反證Prediction。更好的Observation、Measurement、更多Independent Evidence、更好的反證設計。
### 回饋7問
事情實際發生了什麼？／哪些是Fact？／哪些只是Interpretation？／什麼Evidence支持？／什麼Evidence反對？／還有哪些未知？／什麼結果會證明我的Model錯？
### 策略
Fact／Interpretation分欄、Evidence Log、重要信念機率化、主動找反證、增加不同資料來源、保留Unknown、建立Reality Test。
### 行動
遇到重大事件先寫三行：Fact＝真正知道什麼／Model＝我怎麼解釋／Unknown＝還不知道什麼。再寫 Prediction＝如果我的解釋是真的，接下來應該看到什麼？
* 不要要求Reality證明你是對的；讓Reality告訴你哪裡還沒有看懂。
* 成熟不是確定自己掌握Reality，而是越來越清楚「Reality、證據與自己的模型」三者之間的距離。

## L2｜天道層 LAW／CONSTRAINT｜世界怎麼運作？
### 本質／精準定義
L1問「有什麼存在」，L2問「這些存在受到什麼規律與限制」。天道不是單指某一宗教概念，是用來壓縮「跨時間、跨情境仍反覆出現的生成規律、限制條件與變化結構」的母體語言。
精準版｜不是宣稱存在一個已被完全知道的「宇宙天道」。操作性定義：我們試圖從Reality中辨識出的相對穩定規律、限制條件、不變量、流動與動態關係。天道母體＝Law／Constraint／Invariant／Dynamics的高階壓縮框架。
### 7個Node
Law 規律／Constraint 限制／Symmetry 對稱·Invariant 不變量／Trade-off 取捨／Flow 流動／Entropy 熵·失序傾向／Dynamics 動態變化
### Entropy的精準位置
物理學中Entropy有明確技術定義，不能泛化成「任何混亂」。LifeOS可借用「維持有序結構需要持續資源投入」作類比。
! 不要寫：房間亂＝熱力學第二定律直接造成；人生混亂＝Entropy定律直接證明。LifeOS中的「熵增」應標註為Systems Metaphor｜系統類比。
### 舊→新
~ 努力就一定成功 => 結果＝Action × Constraint × Environment
~ 只找原因 => 找結構與限制
~ 問題一定有人做錯 => 很多問題是System Structure生成（Constraint＋Interaction＋Feedback）
~ 穩定是自然狀態 => 很多秩序需要持續投入才能維持
~ 資源無限 => 所有系統都有Constraint與Trade-off
~ 變化是例外 => Change才是常態
~ 找到規則就永遠適用 => 任何規則都有Boundary Conditions
### 能力
Pattern Recognition／Constraint Detection／Invariant Detection／Trade-off Thinking／Dynamic Thinking／Boundary Thinking／Systems Thinking
### 生成機制
> Possibility→Constraint→可行空間縮小→Interaction→Pattern→Stable Structure→新的Constraint
結構本身又會反過來限制下一輪可能性。
### Prediction Error
常見Error＝忽略／漏掉重要Constraint。例：Prediction「只要努力更多，成績就會一直增加」；Reality睡眠不足後效率下降；Error來源＝忽略生理Constraint與邊際效益；更新＝恢復與策略也是系統Node。只用努力時間預測成績，卻漏掉睡眠、先備能力、方法、回饋速度。
### 槓桿
不要平均改所有變數。找Bottleneck／Constraint／High-Leverage Node／Feedback Loop／Phase Transition Point。改善非瓶頸Node，Output幾乎不變；解除真正Bottleneck，Output才可能跳升。
### 回饋
規律能否跨案例重現？／換環境還成立嗎？／極端條件下會不會失效？／有哪些Boundary？／有哪些Trade-off？／哪些變數其實不是核心？／什麼變數一改，整體結果就翻轉？
### 策略
找不變量、限制條件、Feedback Loop、延遲、非線性、臨界點、槓桿點。
### 行動
任何問題不要先問「誰的錯？」先畫：
> Node→Relation→Constraint→Feedback→Bottleneck→Leverage
* 低階思維想改結果；高階思維先找生成結果的結構。
* 高階思考不是找到更多原因，而是找到真正限制系統狀態空間的條件。

## L3｜生成層 GENERATION｜萬物怎麼形成？
### 本質／精準定義
世界更重要的是「東西如何被生成」：Input如何經過規則、互動與Feedback形成Structure、Pattern與Emergence。
精準版｜研究某種Outcome經由哪些Interaction、Feedback與State Transition被產生。核心問題由 What is it？升級成 How is it generated？
### 7個Node
Input 輸入／Rule 局部規則·Mechanism／Interaction 互動／Feedback 回饋／Self-Organization 自組織／Emergence 湧現／Attractor 吸引子（精準版加入State）
### 更精準的生成公式
> Initial Conditions＋Constraints＋Interaction Rules＋Feedback＋Time→State Trajectory→Observed Pattern
同一Input未必產生同一Outcome：Initial State、Context、Feedback、History不同。
### Path Dependence｜路徑依賴
現在的State不只是現在條件造成，過去走過的路徑也會限制現在可以走的路。
! Past ≠ Destiny。但Past會改變Current State與Available Options。過去改變初始條件，但不必永久決定未來軌跡。
### Attractor｜吸引子
不是「壞習慣」的同義詞。描述系統在一定條件下反覆傾向回到某種狀態或狀態集合。LifeOS借用描述拖延／衝突／逃避／學習循環（Complex Systems的結構類比）。
### 舊→新
~ 結果由單一原因造成 => 結果常由多個Node互動生成
~ 找到罪魁禍首就解決 => 找Generating Mechanism／Generating System
~ 整體＝部分相加 => Interaction可以產生Emergence
~ 小改變只產生小結果 => 非線性系統可能小變數造成大翻轉
~ 現在狀態就是本質 => 現在只是系統落入某個Attractor
~ 壞結果代表壞元素 => 正常元素也可能在錯誤結構中生成壞結果
~ 改結果 => 改生成結果的規則
### 能力
Mechanism Mapping／Causal Network Thinking／Feedback Detection／Emergence Detection／Attractor Detection／Simulation／Intervention Design
### 生成機制
> Input→Local Rules→Interaction→Feedback Loop→Pattern Reinforcement→Attractor→Emergent Outcome
> 學生一次不敢回答→逃避→短期焦慮下降→大腦學到逃避有效→下次更容易逃避→形成Avoidance Attractor
### Prediction Error
Prediction「改一個表面行為就會改整體」；Reality幾天後又恢復；Error＝沒有修改Generating Loop，存在未被修改的Attractor／Feedback Loop。
### 槓桿
改Rule／Feedback／Interaction／Threshold／Environment、打斷Reinforcing Loop、建立新的Attractor。不要一直推離舊狀態，修改讓舊狀態反覆生成的條件。
### 回饋
這個結果是一次事件還是穩定Pattern？／哪個Loop正在強化？／哪個Node是必要條件？／拿掉哪個Node，Pattern會消失？／哪個小改變可能造成Phase Shift？
### 策略
畫Causal Loop、找Reinforcing Loop、Balancing Loop、Attractor、Trigger、Threshold、設計Minimum Intervention。
### 行動
不要只說「我要戒掉拖延」。畫出：
> 任務→壓力→逃避→短期舒服→拖延強化
> 任務→拆小→立即開始→完成感→正回饋→行動吸引子
* 真正的改變不是逼自己離開舊結果，而是讓舊結果失去生成條件。
* 不要只問「為什麼會這樣」，要問「什麼結構讓它一直重新變成這樣」。

## L4｜生命層 LIFE｜系統如何維持、適應與演化？
### 本質／精準定義
生命不是靜態物體。生命系統是需要持續與環境交換物質、能量與資訊，才能維持自身組織、調節內部狀態並適應變化的開放系統。
### 7個Node
Energy 能量·Matter Exchange／Homeostasis 穩態／Allostasis 預測性調節／Resource Allocation 資源配置／Adaptation 適應／Resilience 韌性／Evolution·Learning 長期演化與學習
### Homeostasis與Allostasis
Homeostasis＝把重要變數維持在可接受範圍。Allostasis＝根據預期需求，提前改變資源配置。生命很多時候是「預測未來Demand→提前調節」，不只是偏離→修回固定點。
### Resilience精準定義
不是永遠不受影響，也不是硬撐。是受到Perturbation後仍能維持核心功能、恢復，甚至重新組織。
### 舊→新
~ 健康＝沒有症狀 => 健康＝維持、恢復與適應能力（Capacity／Adaptability／Recovery／Functional Reserve）
~ 休息＝浪費時間 => 恢復是系統維護成本
~ 壓力都是壞的 => 適量Stress可提供Adaptation Signal
~ 一直輸出最好 => Output與Recovery需要動態平衡
~ 資源平均分配 => 資源應依Priority配置
~ 穩定＝永遠不變 => 真正穩定是動態調節
~ 韌性＝硬撐 => 韌性＝受擾後重新組織與恢復功能
### 能力
Energy Management／State Regulation／Stress Recovery／Resource Allocation／Adaptive Capacity／Resilience／Environmental Fit
### 生成機制
> Environment Change→Stress／Demand→Detection→Resource Mobilization→Response→Outcome→Recovery→Adaptation
適度刺激＋充分恢復→能力提升。刺激過大＋恢復不足→系統耗損。
### Prediction Error
Prediction「我還能繼續撐／繼續輸出」；Reality／Body Feedback：注意力、睡眠、情緒、表現、恢復下降；Error＝Self Model高估可用資源，內在資源估計失準。
### 槓桿
睡眠、能量、恢復、節律、環境、負荷劑量、資源配置。不是永遠Push，而是 Load Dose × Recovery × Adaptation。很多高階認知問題，在低能量狀態下無法只靠「想通」解決。
### 回饋
睡眠如何？／能量如何？／恢復速度如何？／同樣壓力下功能是否改善？／壓力後多久回Baseline？／是否長期透支？／功能儲備是否增加？
### 策略
Load→Recovery→Adaptation、建立Baseline、追蹤Leading Indicators、不只看Outcome、控制刺激劑量、增加恢復窗口、定期重新測試容量。
### 行動
每天追蹤 Energy／Sleep／Stress／Focus／Recovery／Performance，再決定今天應該 Push／Maintain／Recover。
* 生命不是靠永遠不受傷維持，而是靠持續修復與適應維持。
* 真正強大的生命系統，不是永遠保持同一狀態，而是能在變化中維持功能並重新組織。

## L5｜靈魂層 SOUL｜我是誰？什麼重要？
### 本質／語義修正
Soul State＝Self Model＋World Model＋Value Model＋Meaning Architecture＋Weight＋Identity Direction＋Telos。
這一層必須同時保留兩種語言：神學／宗教本體語言中的Soul可能指真正的靈魂、Spirit、神人關係或其他超越性概念。
! 認知科學不能證明 Soul＝Self Model＋Value Model＋Weight。應寫「Soul OS是對高階生命設定的操作性模型」，不是「科學已證明靈魂就是模型」。
### 7個Node／七個問題
01 Self Model｜我是誰？
02 World Model｜世界是什麼？
03 Value Model｜什麼重要？
04 Meaning｜這件事代表什麼？
05 Weight｜什麼值得我投入Attention？我要放大什麼？
06 Identity｜我要成為誰？
07 Telos｜生命朝哪裡去？
Weight精準化｜不是腦中真正存在的旋鈕，是操作性描述：某些Signal、Value、Prediction或Goal在決策中具有較高影響力。
### 舊→新
~ 我是固定的／我是這樣的人 => 這是我目前高Confidence的Self Model（Identity Statement→Model Statement）
~ 世界就是我看到的樣子 => World Model只是目前版本
~ 別人重視的就是我應重視的 => 主動檢查Value來源
~ 所有事情都同等重要 => 生命必然需要Weight配置
~ 情緒決定Meaning => Meaning會反過來生成Emotion
~ Identity＝過去 => Identity也包含方向與承諾
~ 保護舊自我 => 保留核心價值，同時提高表徵流動性
### 能力
Meta-Awareness／Identity Flexibility／Value Clarification／Meaning Reconstruction／Weight Calibration／Perspective Taking／Telos Alignment
### 生成機制
> Experience→Representation→Meaning→Self／World Model→Value→Weight→Attention→Prediction→Action→Experience
Soul State既是Cause，也是長期Feedback累積形成的Result。
### Prediction Error
Self Model「只有表現好，我才值得被愛／失敗＝沒有人會尊重我」；Prediction 失敗後別人會離開；Reality 失敗後仍有人支持；Error＝Worth＝Performance的模型受到反證。真正更新不是「我要正向思考／我很棒」，而是降低「Performance＝Worth」模型的Confidence。
### 槓桿
Self Model／Value／Weight／Meaning／Identity Language／Reference Group／Repeated Corrective Experience。Weight Calibration是關鍵：高Weight Signal反覆進入 Attention→Memory→Interpretation→Prediction，形成Self-Reinforcing Loop。你長期放大什麼，就長期餵養什麼Model。
### 宗教邊界
! Christianity：God≠Model／Sin≠Prediction Error／Repentance≠Model Update／Grace≠Positive Thinking／Salvation≠Self Optimization
! 佛教的無我不能直接翻譯成「Self Model可以更新」。道家的道不能直接等於Systems Law。可以Crosswalk，不能Ontology Collapse｜本體坍縮。
### 回饋
我現在把什麼看得太重？／什麼看得太輕？／這是我的Value還是別人植入的？／我的Identity是否被單一事件綁架？／我的World Model還符合Reality嗎？／我的Meaning是否只有一種版本？／我正在成為什麼樣的人？
### 策略
Identity→State分離、Fact→Meaning分離、Value排序、Weight Audit、Second Representation、Perspective Shift、Corrective Experience。
### 行動｜重大情緒事件七問
Fact 發生什麼？／Meaning 我賦予什麼意思？／Self Model 這件事讓我覺得自己是誰？／World Model 我認為世界如何？／Value 我怕失去什麼？／Weight 我把哪個訊號放太大？／Alternative Model 還有什麼可能？
* 自由不是沒有Self Model，而是不再把任何舊版本的自己當成不可修改的命運。
* 靈魂OS不是替靈魂下科學定義，而是讓我們可以觀察「最高階身分、價值與終向如何一路影響生命」。

## L6｜認知層 MIND｜我如何理解與預測世界？
### 本質／精準定義
認知系統不是被動照相機，會利用過去經驗、當前輸入、注意力與內部模型（Prior＋Input）建立Representation，形成對當前狀態與未來結果的估計。
! 不能寫「所有認知科學已證明大腦就是Prediction Machine」。Predictive Processing／Predictive Coding／Active Inference是具影響力的理論家族，但不是唯一框架。
### 7個Node
Input／Attention／Prior／Representation／Model／Prediction／Confidence·Precision
### Representation是關鍵
「我英文很差」＝Identity Representation。改成「陌生文章中，我對低頻字彙與長句邊界辨識不足」＝可操作的Skill Representation。Reality沒有變，Problem Space變了，Action Space跟著增加。
### 舊→新
~ 大腦只是接收世界 => 大腦主動生成Hypothesis
~ 第一想法＝答案 => 第一想法＝Candidate Model
~ 記得越多越聰明 => 模型壓縮與遷移更重要
~ 錯誤＝能力差 => 錯誤＝Model與Reality的Difference
~ 確定最好 => 適當Uncertainty提高更新能力
~ 只找支持證據 => 主動尋找Disconfirming Evidence
~ 高分＝真正掌握 => Transfer Test才知道模型是否穩定
~ 錯一次→全部推翻 => Error→判斷來源→判斷可信度→局部更新
### 能力
Attention Control／Representation／Pattern Recognition／Hypothesis Generation／Prediction／Metacognition／Model Updating
### 生成機制
> Signal→Attention Selection→Prior Activation→Representation→Pattern Matching→Model→Prediction→Decision
### Prediction Error／Precision Weighting
Prediction Error＝Expected Outcome−Observed Outcome。Error不是全部同等重要：Noise？偶發事件？測量錯誤？還是Model真的錯？
精準版｜Predictive Processing語境中指預測訊號與感覺輸入的Mismatch；LifeOS擴展到決策與行動時最好寫 Prediction–Outcome Error。
Update Magnitude ≈ Error × Precision × Prior Confidence（概念公式，不是通用物理公式）
### 槓桿
第一＝Representation（問題表徵錯，後面推理全白做：錯誤Representation→錯誤Search Space→錯誤Strategy→錯誤Action）。第二＝Prediction（把模糊信念轉成可驗證Prediction）。第三＝Error Attribution（找對錯誤Node）。
### 回饋
我預測了什麼？／實際結果是什麼？／差異多少？／錯在Input、Prior、Representation、Rule還是Weight？／這次Error可信嗎？／是否需要更新？／更新多少？
### 策略
Multiple Hypotheses／Prediction Log／Confidence Score／Error Classification／Active Recall／Transfer Test／Spaced Retest
### 行動｜重大判斷
Prediction 我預測什麼？／Confidence 幾％？／Evidence For／Evidence Against／Outcome／Error／Update／下一次Prediction
* 智慧不是從來不猜錯，而是把每一次猜錯變成下一次更準。
* 很多問題不是沒有答案，而是問題被表徵成一個沒有操作空間的版本。

## L7｜行動層 ACTION｜如何參與Reality？
### 本質／精準定義
沒有Action，Model無法真正接受Reality Test。Action本身就是取得Information的方法：透過行動主動改變自己與Environment的關係，以取得新的Evidence。
Action＝Intervention＋Exploration＋Reality Test。
### 7個Node
Goal 目標／Option 選項／Decision 決策（Expected Outcome）／Minimum Action 最小行動／Execution 執行／Environment 環境互動／Outcome 結果
### High Agency精準定義
不是「相信自己什麼都做得到」，也不是「我可以控制Reality」。是在Constraint存在的Reality中，仍能持續生成可行Option、選擇可控變數、執行Action並利用Feedback更新策略的能力。
舊：控制Outcome。新：控制 Action／Experiment／Attention／Strategy／Environment Design／Update；Outcome只部分可控。
### Minimum Action真正功能
降低Experiment Cost、縮短Feedback Delay、提高Iteration Frequency。
> Minimum Action→Faster Feedback→More Updates→Faster Learning
### 舊→新
~ 想清楚再開始 => 足夠清楚就做小實驗
~ 一次做對 => 快速小循環
~ 靠意志力 => Environment Design
~ 大目標產生動力 => Minimum Action降低Activation Energy
~ 失敗就停 => Outcome是Information
~ 計畫越完整越好 => 不可逆決策才需要高分析成本
~ 行動只是執行答案 => 行動也是探索Reality
### 能力
Decision Making／Prioritization／Execution／Experiment Design／Environmental Design／Feedback Seeking／Adaptive Action
### 生成機制
> Goal→Options→Expected Value→Decision→Action→Environment Interaction→Outcome→Feedback
High Agency真正發生在：Reality不符合Prediction時仍能生成Next Action。
### Prediction Error
「我以為這個Action會產生X」，結果產生Y。低Agency＝自責／怪環境／放棄。High Agency＝定位Error→生成Alternative→再次測試。不要立刻判斷「我不行」，拆成：Model Error？Execution Error？Environment Shift？Insufficient Dose？Insufficient Time？Measurement Error？
### 槓桿
Minimum Viable Action／Environment／Friction／Cue／Immediate Feedback／Leading Indicator／Iteration Speed。縮短 Prediction→Action→Feedback。
Learning Speed ≈ Experiment Quality × Feedback Quality × Iteration Speed
### 回饋
做了嗎？／做到什麼程度？／結果如何？／Leading Indicator變化嗎？／哪一步卡住？／是Motivation問題還是Friction問題？／下一次最小修改是什麼？
### 策略
Top 3／Minimum Action／Implementation Intention／Environment Design／Timeboxing／Fast Feedback／Weekly Retrospective
### 行動
任何目標立刻轉成：Goal／Bottleneck／Leading Indicator／Minimum Action／Time／Feedback／Next Iteration。
例｜「我要英文變好」太抽象 → 今天20個核心字→晚上無提示測試→明天陌生句再測→錯字進錯題Node。
* 真正的Agency不是控制結果，而是在結果不同時仍能生成下一個有效行動。
* High Agency不是擴大控制幻覺，而是提高在不可完全控制世界中的可調整能力。

## L8｜更新層 UPDATE｜Reality如何重新教育我？
### 本質／精準定義
L8是整套八層最重要的閉環。沒有Update，前七層都可能變成越來越精密的自我證明系統。更新＝讓Reality真正有權改變Model。
精準版｜Update不是「遇到不同意見就改變自己」，是當新的Evidence足以改變既有模型的相對可信度時，對Representation、Parameter、Weight、Strategy或Model Structure進行適當幅度的修正。
### 9個Node（由7升級）
01 Prediction／02 Outcome／03 Difference／04 Error（Classification）／05 Diagnosis／06 Evidence（Evaluation）／07 Reweight／08 Model Update／09 Retest
### 更新不是越快越好
Update太慢＝僵化。Update太快＝被Noise帶著跑。真正高階能力是Optimal Update Rate：
Strong Evidence→Large Update／Weak Evidence→Small Update／Noise→No Update／Repeated Evidence→Confidence逐漸調整。
真正智慧＝Calibration：該穩定時穩定，該更新時更新。
### 舊→新
~ 錯了＝失敗 => 錯了＝得到Information
~ 保護自尊 => 保護更新能力
~ 整套推翻 => 精準定位錯誤Node
~ 新證據一來立刻翻盤 => 依Evidence Strength調整Weight
~ 更新想法就完成 => 更新後必須Retest
~ 一次成功證明新模型 => 需要跨時間與跨情境重現
~ 最後找到永遠正確答案 => 建立持續Versioning能力
### 能力
Error Detection／Error Attribution／Evidence Evaluation／Reweighting／Unlearning／Model Revision／Retesting
### 生成機制（LifeOS真正的學習引擎）
> Prediction→Action→Outcome→Difference→Error→Diagnosis→Evidence Evaluation→Reweight→Model V2→New Prediction→Retest
### Prediction Error分類
原7類｜Input Error 資料收錯／Attention Error 注意錯訊號／Representation Error 問題表徵錯／Model Error 因果模型錯／Weight Error 重要性配置錯／Action Error 模型對但執行錯／Environment Error 外部條件改變
精準9類｜01 Observation Error 觀察失準／02 Measurement Error 測量失準／03 Sampling Error 樣本不代表整體／04 Representation Error 問題表徵錯／05 Model Error 關係·機制模型錯／06 Parameter·Weight Error 方向可能對但權重錯／07 Execution Error 模型可能對但執行失敗／08 Context Shift 環境已改變／09 Random Noise 隨機波動
! Outcome不好 ≠ Model一定錯
### 槓桿
最高＝Error Attribution（定位錯，更新反而讓Model更差）。第二＝Update Size（證據弱→小幅，證據強→大幅）。第三＝Retest（沒有Retest就不知道V2是否真的比V1好）。
例｜考差。錯誤歸因「我沒有天分」；可能真正原因：Vocabulary Retrieval不足／Sleep不足／Time Allocation錯／Question Representation錯／Strategy不適合。
> Bad Outcome→Wrong Attribution→Wrong Update→Worse Model
> Bad Outcome→Correct Diagnosis→Targeted Update→Retest→Better Prediction
### 回饋
原Prediction是什麼？／Outcome是什麼？／Difference在哪裡？／是哪個Node造成？／Evidence品質如何？／需要更新多少？／新版Prediction是否更準？
### 策略
Prediction Log／Error Taxonomy／Root Cause Analysis／Bayesian-style Reweighting／Model Versioning／A/B Test／Transfer Retest
### 行動｜重大事件更新表
V1 Model／Prediction／Reality／Difference／Error Type／New Evidence／Reweight／V2 Model／New Prediction／Minimum Retest／Result／Keep·Revise·Discard
* 真正的成長不是累積更多答案，而是建立一套不斷修正答案的機制。
* 真正的學習不是對Error反應最快，而是能判斷「這個Error到底值不值得我改變」。

## 8×8生命演算法｜最終升維
本體讓你不要離開Reality。天道讓你不要忽略Constraint。生成讓你不要被表面現象欺騙。生命讓你不要透支系統。靈魂讓你知道自己把什麼放在最高權重。認知讓你知道自己正在用什麼Model預測。行動讓你的Model真正進入Reality。更新讓Reality有權修改你。
### 最終版母體公式
> Reality↕Observation／Evidence↕Constraint／Law↕Generative Mechanism↕Living System↕Identity／Value／Weight↕Representation／Model／Prediction↕Decision／Action／Experiment↕Outcome／Feedback↕Prediction–Outcome Difference↕Error Attribution↕Evidence Evaluation↕Reweight／Model Update↕Retest↕↺ New Reality Contact
### 定義校準
成長｜不是「變得更正向」＝Model-Reality Gap逐步降低＋Action Space逐步增加＋Adaptive Capacity逐步提高（Prediction Error被吸收後，Prediction Accuracy與Adaptive Capacity持續提升）
智慧｜不是「知道最多答案」＝能分辨Reality、Model、Boundary與Uncertainty，並知道何時保持、何時更新；建立能長期與Reality交換資訊、修正誤差、重組結構的開放系統
High Agency｜不是「控制Reality」＝Constraint存在時，仍能持續產生Option→Experiment→Feedback→Update
自由｜不是「沒有模型」＝模型存在，但可以被Reality修正；可以擁有Identity、Belief與Model，但不被它們永久綁架
表徵流動性｜不是「什麼都可以」＝同一Evidence可以生成多個Candidate Models，再交由Evidence競爭
穩定｜不是「永遠不變」＝核心功能能在變動環境中透過調節持續維持
更新｜不是「一直改」＝Evidence強度與Model改變幅度相匹配
低熵｜不是永遠保持不變，而是系統持續輸入Energy與Information，修復失序、淘汰失效結構、重新建立更適應Reality的新秩序
* 真正需要避免的不是Error，而是Error進不來。一個不能接收Prediction Error的系統，會逐漸把自己的Model誤認成Reality。
* 尊重Reality的約束，辨識生成結果的結構，維持生命的適應能力，看見自身價值與權重，用可修正模型形成預測，以行動取得新證據，再依證據強度校準模型。
> 看見Reality→找到規律→理解生成→維持系統→校準靈魂→建立預測→採取行動→吸收誤差→重新看見Reality

# Soul OS
## 靈魂狀態的定義｜高階初始條件
邊界｜若「靈魂」是哲學／神學概念，不能被認知科學直接證明等同於某個神經模型。作為LifeOS的高階操作語言：
靈魂狀態＝一個人長期形成的Self Model＋World Model＋Value Model＋Prior＋Weight配置。不是某一個情緒，是整套生命系統目前使用的「高階參數設定」。
> 靈魂狀態→設定Prior→形成Self Model→形成World Model→形成Value Model→配置Weight→決定Attention→影響Perception→生成Interpretation→產生Prediction→生成Emotion→生成Language→形成Decision→形成Action→得到Feedback→形成新的Prediction Error→回頭更新靈魂狀態
「靈魂是一切根源」不要理解成單向因果：靈魂狀態是生命系統的高階生成條件，而Reality又會持續反過來重塑它。這是Recursive Loop｜遞迴循環。
### 加入宗教維度的定義
靈魂狀態＝一個人如何理解終極Reality＋如何理解自己＋如何理解世界＋如何配置價值權重＋如何配置注意力＋如何理解痛苦與死亡＋如何想像生命終點＋因此如何生活。
Soul State＝Self Model＋World Model＋Value Model＋Attention Model＋Future Model＋Weight Configuration。
靈魂狀態＝Ontology＋Identity＋World Model＋Value Model＋Weight＋Attention＋Telos目前形成的整體配置。

## 01～05｜高階參數層：Prior／Self／World／Value／Weight
### 01 Prior 先驗｜靈魂帶著什麼過去進入現在
設定事件發生的基礎機率。事情還沒發生，大腦已經先猜了一次。
狀態A「人通常不可靠」→同事沒回訊息→「他故意不理我」。狀態B「大部分人都有自己的事情」→「他應該正在忙」。Reality相同，Prior不同，生成的世界不同。Prior不是命運，只是目前模型給不同可能性的初始機率。
* 不要把昨天留下的機率，誤認成今天必然發生的Reality。
### 02 Self Model 自我模型｜我是誰
我是誰？我值得被愛嗎？包含：我有沒有價值／能力／是否值得被愛／能不能改變／失敗代表什麼／別人拒絕我代表什麼／我可以成為什麼樣的人。
~ 我就是不會英文的人（把State寫成Identity） => 我目前的英文模型與技能還沒有訓練完成（Updatable Model）
~ 我很笨（沒有操作空間） => 我的單字提取速度不足（出現可更新Node）
高階教育：不要讓學生把Error寫進Identity，把Error定位到Model／Skill／Strategy／Node。
* 你可以擁有一個Self Model，但不要讓Self Model永久定義你。
### 03 World Model 世界模型｜世界是什麼
世界安全嗎？危險嗎？別人可信嗎？努力有用嗎？失敗能恢復嗎？資源有限還是可創造？機會可以重新生成嗎？世界模型直接決定探索半徑。
兩個學生都考50分。A「高中就是排名世界，輸了就沒有未來」→Threat↑探索↓逃避↑。B「考試是目前學習模型的測量工具」→Error Detection↑ Strategy Search↑ Retest↑。
* 人真正被困住的地方，很多時候不是世界，而是「世界只能這樣」的模型。
### 04 Value Model 價值模型｜什麼最重要
決定什麼值得追求、不能失去、值得犧牲、什麼叫成功／失敗。
A 成功＝別人認可我→一句批評產生巨大Prediction Error。B 成功＝今天的模型比昨天更接近Reality→同一句批評變成Information。
很多情緒問題背後要觀察：「我到底把什麼設定成最高Value？」
* 你追逐什麼之前，先看是誰替你設定了「重要」。
### 05 Weight 權重｜什麼訊號會被放大
人生不是所有訊息等權處理。真正影響生命軌跡的是 Information × Weight。Subjective Impact ≈ Signal × Weight。
老師說「你這次進步很多，但第二題文法還需要修正」。A：進步10％／錯誤90％→「老師覺得我不好」。B：進步60％／錯誤40％→「方法有效，但第二題Node還要補」。
* 真正控制人生的，常常不是你知道多少，而是你把什麼放得最大。

## 06～12｜認知生成層：Salience→Language
### 06 Salience 顯著性｜什麼東西會抓住注意力
世界有一萬個訊號，為什麼偏偏這個被你看到？焦慮者看到Threat Signal；自卑者看到Rejection Signal；FOMO者看到別人賺錢；學習者看到Knowledge Gap；創業者看到Unmet Need；研究者看到Anomaly。同一Reality，不同Salience Map。
* 你長期注意什麼，你的世界就會逐漸長成什麼樣子。
### 07 Attention 注意力｜生命資源流向哪裡
決定哪些訊號進入深層處理、Working Memory，哪些模式被強化、能力被練習、神經路徑被反覆使用。Attention→Learning／Memory／Action／Identity Reinforcement。
* 注意力不是「我正在看什麼」，而是「我正在把生命資源投資在哪裡」。
### 08 Perception 感知｜我到底看到了什麼
人不是攝影機。受Prior、Self／World／Value Model、Weight、Attention、Context共同影響。
! Reality ≠ Perception。Reality→Sensory Signal→Model Processing→Perception
* 不要把「我看到的」直接升格成「世界就是如此」。
### 09 Interpretation 解釋｜事情代表什麼
已讀沒回。Fact只有「訊息已讀，目前沒有回覆」。Model可能生成：他討厭我／他生氣了／他很忙／他不知道怎麼回答／他等等會回。
> Event→Model→Interpretation→Prediction→Emotion
* 情緒出現時，不只問「我怎麼了」，還要問「我的Model剛剛生成了什麼Meaning？」
### 10 Prediction 預測｜接下來會發生什麼
Self「我一定做不到」＋World「別人一定會笑我」＋Value「失敗不能發生」＋Weight「拒絕訊號非常重要」→「如果我上台，我會丟臉」→還沒上台，身體已心跳加速、肌肉緊張、逃避、拖延。高階模型向下控制身體與行為。
* 很多人不是被Reality困住，而是提前被自己對Reality的Prediction困住。
### 11 Emotion 情緒｜不是根源，而是系統訊號
Emotion是系統對目前狀態的快速整合訊號。Prediction＝可能失去重要的人＋Value＝這段關係極重要＋Uncertainty高＋Control低→焦慮。
更高階問題：哪個Prediction正在生成焦慮？哪個Value被威脅？哪個Weight過高？哪個World Model正在運作？哪個Self Model害怕被證明？
* 不要只關掉警報器，要找警報器為什麼響。
### 12 Language 語言｜內在模型開始生成世界
「我完蛋了」「沒有人愛我」「我永遠學不會」每一句背後都有Model。「我永遠學不會」隱含：Self Model＝能力固定／World Model＝學習不可塑／Prediction＝未來仍失敗／Weight＝目前失敗權重極高。語言是很好的Model Scanner。
* 語言不是只有表達世界，它也會反過來鞏固你正在生成的世界。

## 13～17｜現實生成層：Decision→Model Update
### 13 Decision 決策｜模型開始選擇未來
Decision ≈ Prediction × Value × Weight × Constraints。
學生不舉手：Self「我不夠好」／World「同學會笑我」／Value「不能丟臉」／Weight「負面評價極高」／Prediction「回答錯＝被笑」／Decision「不要舉手」。只說「勇敢一點」沒有修改底層結構；真正介入點是修改Model與Weight。
### 14 Action 行動｜內在模型開始變成外在Reality
Model「別人不喜歡我」→Prediction「主動講話會被拒絕」→Action「保持距離」→Environment Feedback「別人真的比較少接近」→「你看，我就知道」。Self-Fulfilling Loop｜自我實現循環：
> Model→Prediction→Action→Environment Response→Evidence→Model Reinforcement
這就是舊模型可以越活越像「真理」的原因。
### 15 Feedback 現實開始回答你
Prediction「我主動回答一定會被笑」→Action 舉手一次→Reality 沒有人笑，老師還肯定→Difference出現＝更新入口。
### 16 Prediction Error｜靈魂更新真正的入口
Prediction＝A；Reality＝B；Difference＝A≠B。
~ Error→羞恥→防衛→合理化→維持舊Model => Error→好奇→Evidence→Reweight→Model Update
決定成長的是「Prediction Error能不能進入系統」。反證全被拒絕→系統封閉→適應力下降；新證據可進入→系統保持流動。
* Reality與你不同的地方，往往就是下一次升級的位置。
### 17 Model Update｜靈魂不是固定物，而是可更新系統
靈魂設定生命的高階生成條件，但它本身也必須保持可更新，否則重新變成宿命論。
> Soul State→Model→Prediction→Action→Reality→Feedback→Prediction Error→Soul Update
在LifeOS操作語言裡，靈魂是Dynamic Architecture｜動態架構。

## 三層壓縮｜新舊模式｜7個靈魂能力｜總結
### 三層
第一層 靈魂高階參數層｜Prior 我預設什麼／Self Model 我是誰／World Model 世界是什麼／Value Model 什麼最重要／Weight 什麼訊號要被放大

第三層 現實生成層｜Decision→Action→Environment→Outcome→Feedback→Prediction Error→Model Update

### 新舊模式

~ 我的想法就是真相 => Interpretation只是Candidate Model

### 7個靈魂能力
01 Meta-Awareness｜看見自己正在使用什麼模型
02 Differentiation｜分開Reality與Interpretation

### 最高階總結
靈魂狀態不是「今天心情好不好」，是整套生命系統目前如何設定「我是誰、世界是什麼、什麼重要、什麼值得注意、未來可能發生什麼」。它決定什麼訊號進得來、被放大、如何解釋、預測什麼、害怕什麼、追求什麼、說什麼、採取什麼行動；行動又改變Reality。靈魂透過Prediction與Action參與Reality的生成。
真正的自由：我能看見自己的Prior、Model、Weight；能辨識自己的Prediction；能接受Reality帶來的Difference；能利用Prediction Error重新配置自己。
* 靈魂決定我如何生成世界；Reality決定我的靈魂是否值得更新。
> Soul State→Weight→Prediction→Action→Reality→Error→Update→New Soul State
* 最高階的靈魂，不是最堅固的靈魂，是「核心價值穩定，但對Reality永遠保持可更新能力」的靈魂。

## Soul OS七結構 × 認知三母體的對接
Soul OS不是第四個認知子母體，而是跨在A／B／C上方的「高階Context Layer」。
01 Self Model｜影響「我認為自己能不能做到」→形成Self-related Prior

> Soul OS七結構→設定高階Context→Attention／Representation→Prediction→Decision
! 不要直接寫 Soul＝Prior／Soul＝Precision Weight／Soul＝Prediction。Soul OS中的高階結構「可能影響」Prior、Attention、Interpretation、Goal與Weight配置。Soul Architecture ↕ Cognitive Architecture 是Cross-level Coupling，不是同一個東西。

Meaning ← 新Perspective、新Context、新Evidence

Soul不是「永遠不變的程式碼」，更像Slow-changing High-Level Architecture。

## 快慢變數｜四個時間尺度
FAST VARIABLES 快變數｜Signal／Attention／Emotion／Prediction／Decision／Action
SLOW VARIABLES 慢變數｜Self Model／World Model／Value／Identity／Telos
更慢｜Culture／Institution／Tradition／Environment Structure
一次失敗不應立刻改Identity：Fast Outcome不應直接覆寫Slow Variable。
> Outcome→Evidence累積→Pattern→Confidence Change→必要時才更新高階Identity
避免「今天考差→我就是笨」。
### 四個時間尺度
T1 秒～分鐘｜Signal→Attention→Prediction→Emotion→Action
T2 天～週｜Feedback→Learning→Strategy Update
T3 月～年｜Self Model→World Model→Value→Identity更新
T4 多年～生命｜Telos→Character→Life Trajectory→Wisdom
智慧生成不是一次頓悟，是多時間尺度共同作用。

## 修正結論｜SOUL＝MODEL × VALUE × DIRECTION
不建議再說「靈魂狀態是一切的根源」：Reality、Body、Environment、Culture、History與Constraint都不是由個人的Soul State產生。
更高解析度｜「靈魂狀態是個體生命系統中非常上游的高階生成條件之一。」它深刻影響你注意什麼、忽略什麼、如何解釋、預測什麼、害怕什麼、追求什麼、選擇什麼、如何行動。
但 Reality、Body、Relationship、Environment、宗教與文化都會影響Soul；Repeated Action也會反過來塑造Identity。
! 不是 Soul→Everything，而是 Reality↔Body↔Environment↔Soul↔Mind↔Action↔Feedback（耦合智慧生成系統）
### 三大核心功能
MODEL｜我如何理解自己與世界？Self Model＋World Model＋Meaning
VALUE｜我把有限生命資源給誰？Value Model＋Weight
DIRECTION｜我要成為誰、走去哪裡？Identity＋Telos
MODEL＋VALUE＋DIRECTION 共同設定 Attention＋Prediction＋Action Selection。
* SOUL＝MODEL × VALUE × DIRECTION（不是數學等式，是操作性壓縮公式）

# 認知三母體
## 總公式｜A生成世界 × B更新世界 × C活進世界
> Generate Model（A）→Update Model（B）→Reality Test（C）→新Reality→再生成
核心不是「找到一次正確答案」，而是建立能生成、能修正、能落地、能再回饋的循環系統。
真正的智慧＝模型品質 × 更新速度 × 現實校正能力。
真正的自由＝我可以有模型，但不必被任何舊模型綁架。
認知科學母體｜A 認知生成 Generate（生成觀點）／B 認知更新 Update（更新母體）／C 具身認知 Embody（進入真實世界）
A理論｜預測編碼、自由能原理、主動推論。B理論｜後設認知、強化學習、記憶重構、睡眠整合。C理論｜具身、生成、嵌入、延伸認知（4E）。

## A｜認知生成 Generate Model｜生成世界
本體｜大腦不是單純接收Reality，而是不斷根據過去經驗＋現在訊號生成「我認為正在發生什麼」。
核心問題｜我為什麼會這樣看世界？
> Input→Attention→Representation→Pattern→Model→Prediction→Interpretation
### A1 新舊模式
~ 我看到的就是事實 => 我看到的是「Reality經過我的Model後形成的版本」
~ 第一個解釋就是真相 => 第一個解釋只是第一個Hypothesis
~ 感覺很真就一定是真的 => 感覺是真實訊號，但對原因的解釋可能錯
~ 過去發生過，所以未來一定如此 => 過去只是Prior，不是命運
~ 別人不回訊息＝討厭我 => 這只是眾多可能模型之一
~ 失敗＝我沒有能力 => 失敗＝目前Model沒有成功預測Reality
~ 世界只有一種解釋 => 先生成多個候選模型，再讓Reality淘汰
### A2 智慧
01 你不是直接活在Reality裡，而是活在自己對Reality的解釋裡。
02 第一個念頭不是答案，只是大腦最快生成的版本。
03 能產生第二種解釋，就開始產生自由。
04 能產生第三種可能，就開始脫離單一路徑。
05 智慧不是猜得快，而是保留多個Hypothesis。
06 不要急著改Reality，先檢查自己用什麼Model解釋Reality。
07 自由的第一步，是知道「我的世界」不等於「世界本身」。
### A3 能力
Observation 把觀察與解釋分開／Representation 重新表徵同一件事／Classification 辨識事件屬於哪種模式／Pattern Recognition 從大量訊號找到規律／Hypothesis Generation 產生多個可能解釋／Prediction 根據模型預測下一步／Reframing 更換框架重新理解事件
### A4 核心節點
01 Input 輸入｜世界給了我什麼訊號？
02 Attention 注意｜我選擇放大什麼？
03 Representation 表徵｜大腦把訊號變成什麼意思？
04 Prior 先驗｜過去經驗帶來什麼預設？
05 Pattern 模式｜我認為事情通常如何發展？
06 Model 模型｜我目前如何解釋這件事？
07 Prediction 預測｜如果模型成立，下一步應該發生什麼？
### A5 策略
01 Fact First｜先寫事實，不急著寫解釋
02 3 Hypotheses｜任何重要事件至少產生3種解釋
03 反證提問｜「什麼證據會證明我可能錯？」
04 換視角｜分別用自己、對方、旁觀者視角解釋
05 時間拉長｜「一年後我會怎麼看這件事？」
06 機率化｜把「一定」改成「目前大約幾％可能？」
07 Prediction｜每個重要模型都必須產生可驗證預測
### A6 行為
01 遇到刺激先描述「發生了什麼」
02 把「他討厭我」改成「他今天沒有回訊息」
03 寫下自己的第一個解釋
04 再強迫自己寫第二個解釋
05 再建立第三個競爭模型
06 選出目前證據最多的模型
07 寫下「如果我是對的，接下來應看到什麼？」
### A7 回饋
我的預測有沒有發生？／哪些訊號被我忽略？／哪些訊號被我過度放大？／我是不是把情緒當成事實？／我的Prior是否太強？／競爭模型哪一個解釋力更高？／Reality是否正在要求我進入B｜Model Update？

## B｜認知更新 Update Model｜更新世界
本體｜真正的學習不是增加資料，而是Prediction Error出現後，能重新調整模型與權重。
核心問題｜我怎麼不再被舊世界綁架？
> Prediction→Reality→Difference→Prediction Error→Reweight→Model Update→Retest
完整版：
> Prediction→Action→Outcome→Difference→Prediction–Outcome Error→Error Attribution→Evidence Evaluation→Reweight→Memory Update→Model Update→Retest
後設認知｜我能不能看見「這是我的Model，不一定是Reality」
強化學習｜Action→Reward／Cost→更新Action Value
記憶重構｜記憶不是像讀硬碟原封不動提取，回憶與再鞏固可能改變記憶表徵
睡眠整合｜睡眠參與多種記憶鞏固與整合過程
B真正的功能不是「知道錯了」，而是Error能不能真的改變系統。
### B1 新舊模式
~ 錯了代表我很差 => 錯了代表Reality提供新Information
~ 保護原本答案 => 保護更新能力
~ 找支持自己的證據 => 主動尋找反證
~ 一次失敗就否定自己 => 先定位是哪個Node預測錯誤
~ 信念只能對或錯 => 信念可以調整Confidence Weight
~ 改變想法很丟臉 => 能更新代表模型正在提高解析度
~ 我是這樣的人 => 我目前使用的是這個Model
### B2 智慧
01 Prediction Error不是敵人，而是Reality送來的更新資料。
02 真正危險的不是猜錯，而是猜錯後拒絕更新。
03 成長不是永遠正確，而是錯誤修正速度越來越快。
04 成熟不是沒有偏見，而是知道何時降低舊信念權重。
05 真正的自信不是「我一定對」，而是「錯了我能改」。
06 不要因一個Error摧毀整套Model，只更新真正出錯的Node。
07 最高階智慧不是擁有永遠正確的模型，而是擁有永遠可以更新的自己。
### B3 能力
Error Detection 發現預測誤差／Error Attribution 找出錯在哪個Node／Evidence Evaluation 判斷新證據品質／Reweighting 重新調整信念權重／Unlearning 降低失效舊模式的控制力／Model Updating 建立新版模型／Retesting 讓新版模型重新接受Reality測試
### B4 核心節點
01 Prediction 原本預測／02 Outcome 實際結果／03 Difference 預期與Reality差多少／04 Error 哪個假設出了問題／05 Evidence 什麼新資料值得加入／06 Weight 哪些信念應升權、降權／07 Update V1如何變成V2
### B5 策略
01 Prediction Log｜重要決策先留下預測
02 Error Log｜結果不同時留下誤差
03 Why Wrong｜不要問「誰錯」，問「模型哪裡錯」
04 Node Update｜只修改真正失準的Node
05 Weight Update｜證據不足時先改權重，不急著完全翻轉
06 Version Control｜Model V1→V2→V3留下更新紀錄
07 Retest｜更新後必須再次測試，避免只在腦內覺得自己成長
### B6 行為
01 事情發生前先寫預測／02 結果出現後比較預測與Reality／03 標記最大Prediction Error／04 找出造成誤差的假設／05 加入新的Evidence／06 修改Model或Weight／07 用下一次行動重新測試新版Model
### B7 回饋
新版模型是否比舊版預測更準？／同類錯誤是否下降？／反應速度是否提高？／情緒是否不再自動控制判斷？／遇到反證時防衛程度是否下降？／能否說出「我為什麼更新？」／新模型能不能跨情境使用？

## C｜具身認知 Embodied Cognition｜Reality Test｜活進世界
本體｜知道不等於會；新模型必須進入身體、行動、環境與真實互動，才能真正改變系統。
核心問題｜新模型怎麼真正變成我的能力？
> Model→Action→Body→Environment→Outcome→Feedback→Skill
4E｜Embodied 具身／Embedded 嵌入環境／Enactive 透過行動生成·實現認知／Extended 工具與外部結構可能參與認知功能。Brain↕Body↕Environment↕Tools↕Action共同形成認知系統。
> Model→Goal→Decision→Body State→Action→Environment Interaction→Outcome→Feedback
! 知道文法規則 ≠ 陌生題會做 ≠ 作文能使用 ≠ 壓力下仍能使用
> Know→Do→Transfer→Adapt
> Knowledge→Skill→Transfer→Adaptive Capability
### C1 新舊模式
~ 懂了＝會了 => 做得出來才開始算會
~ 想通就會改變 => 新行為需要反覆Reality Test
~ 能力存在腦中 => 能力存在「人×身體×工具×環境」系統中
~ 靠意志力 => 設計環境降低正確行為摩擦
~ 一次成功＝學會 => 跨時間、跨情境成功才接近穩定能力
~ 失敗就回去讀更多 => 失敗先增加真實練習與Feedback
~ 學習終點是知道 => 學習終點是Reality中能穩定產生結果
### C2 智慧
01 知道方向，不等於雙腳已經走到那裡。
02 沒有經過行動測試的智慧，仍然只是Hypothesis。
03 真正能力不是「我懂」，而是「換一個情境我仍做得到」。
04 身體不是大腦的工具，而是認知系統的一部分。
05 環境不是背景，而是行為生成器。
06 不要只訓練記憶答案，要訓練面對陌生Reality。
07 真正的學習，是新模型最後能穿過身體變成行為。
### C3 能力
Execution 把知道轉成行動／Transfer 把能力遷移到陌生情境／Embodiment 讓知識進入身體反應／Environmental Design 設計支持行為的環境／Self-Regulation 管理注意力、情緒與衝動／Adaptive Action 根據Reality即時調整／Skill Automation 把有效行為練成低耗能自動模式
### C4 核心節點
01 Body 身體狀態／02 State 當下神經·情緒狀態／03 Environment 環境結構／04 Action 實際行動／05 Tool 外部工具／06 Outcome 行動結果／07 Skill 反覆成功後形成的穩定能力
### C5 策略
01 Minimum Action｜把新模型轉成最小行動
02 Environment Design｜讓正確行為更容易發生
03 降低摩擦｜需要的工具提前放好
04 增加提示｜讓環境提醒下一步
05 刻意練習｜針對最弱Node反覆練
06 Variation｜換題目、換時間、換環境測試
07 Transfer Test｜最後一定用陌生情境測真正能力
### C6 行為
01 每學一個概念立刻做一次／02 把大行動縮成5分鐘版本／03 安排固定Cue觸發新行為／04 修改環境降低舊行為發生率／05 在不同情境重複同一能力／06 記錄真實Outcome而不是只記錄努力／07 隔天、隔週重新測試
### C7 回饋
我是真的會做，還是只會說？／沒有提示時還做得到嗎？／換一題還會嗎？／隔一天還會嗎？／壓力出現時還能做到嗎？／換環境後能力還存在嗎？／能力是否已從「需要用力」變成「穩定可重現」？

## 三大母體的相互作用｜21個核心Node
A沒有B｜很會解釋世界，但永遠相信自己的故事
B沒有C｜很會反省更新，但人生行為沒有真正改變
C沒有A｜一直努力做，但不知道自己為什麼做
A＋B沒有C｜思想很多，Reality很少
A＋C沒有B｜很會行動，但錯誤模式可能被重複強化
B＋C沒有A｜很會修正，但缺乏高品質模型生成能力
A＋B＋C｜生成→預測→測試→誤差→更新→行動→回饋→再生成
### 21個核心Node
> A生成世界：Input→Attention→Representation→Prior→Pattern→Model→Prediction
> B更新世界：Prediction→Outcome→Difference→Error→Evidence→Weight→Update
> C活進世界：Body→State→Environment→Action→Tool→Outcome→Skill
真正的閉環是 A→B→C→新的Reality→新的A（螺旋，不是直線）。每一次循環問三件事：
A｜我現在怎麼解釋世界？
B｜Reality告訴我哪裡需要更新？
C｜我要怎麼做，才能知道新版模型真的比較好？
### 生命學習OS
> Reality→Signal→Attention→Representation→Model→Prediction→Action→Outcome→Difference→Prediction Error→Evidence→Reweight→Model Update→New Action→Retest→Skill→New Reality
成長＝Prediction Error被有效吸收後，下一輪Prediction Accuracy提升。
智慧＝知道什麼時候相信模型，也知道什麼時候放下模型。
能力＝新模型能在不同Reality裡穩定產生有效行動。
自由＝我有模型，但我不是我的模型。
* 最高階自由＝Reality改變時，我有能力重新生成自己。

# 宗教母體
## 核心命題｜宗教在天道母體的位置
靈魂狀態＝一個生命系統目前如何設定「終極實在是什麼＋我是誰＋世界是什麼＋問題是什麼＋什麼重要＋注意什麼＋如何改變＋如何生活＋最後走向哪裡」。
跨宗教共同研究的不是「大家其實都一樣」，而是比較每套傳統如何配置Ontology、Identity、Value、Attention、Practice、Telos。
「靈魂狀態」可作為跨宗教比較的操作性語言，但不能假設各宗教都承認同一種「靈魂本體」：有些談Soul／Spirit，有些談心、識、神我，佛教以「無我」挑戰永久固定靈魂的概念。
Religion OS＝Identity Model＋World Model＋Value Model＋Attention Model＋Future Model＋Practice Model。
### 宗教不直接等於天道
> Reality→天道／自然規律→生命與人類出現→人類觀察Reality→Representation→Language→Narrative→Religion／Philosophy／Science→形成不同Ultimate Reality Model
天道＝被理解的對象／母體中的底層規律概念。宗教＝人類理解終極Reality的重要系統之一。哲學＝概念推演與論證系統。科學＝可觀察、可測試模型的更新系統。Soul OS＝這些模型如何進入個體生命。四者不能直接畫等號。
> Reality→不同Observation→不同Representation→不同Knowledge System→持續接受Reality校準
### 宗教放回正確層級
宗教主要不是L2「自然規律」的另一種版本，它跨越 L1 Ultimate Reality／L5 Identity·Value·Meaning·Telos／L7 Practice／L8 Reflection·Transformation。
! 不要寫 God＝天道。較準確：基督信仰、佛教、道家等傳統分別提供不同的Ultimate Reality與生命轉化框架；天道母體作為跨框架比較工具。

## 基督信仰 Christianity｜六問
01 我是誰｜人是按神形象受造的人，價值不由成績、財富、外貌或社會評價決定。人受到罪影響，自我理解本身也可能失準。在基督裡以「神的兒女／新生命」理解身分。Self Model不是「我要把自己想得更好」，而是「我要按照我與神的關係重新理解自己」。
02 世界是什麼｜神所創造，受造有其美善與秩序，但世界也處於破碎、罪與死亡之中。不是全部美好，也不是全部邪惡。
> Creation→Fall→Redemption→Restoration→New Creation
03 什麼最重要｜愛神、愛人如己、真理、公義、憐憫、信實、恩典、神的國。最高權重不是「我舒服嗎？」而是「什麼符合愛、真理與神的旨意？」
04 什麼值得注意｜神的話、自己的心、鄰舍的需要、罪與誘惑、恩典、聖靈的工作、神在Reality中的帶領。Attention不是單純向內觀看：
> God→Scripture→Self→Others→World
05 未來｜Hope不是「事情一定照我的願望發生」，是把終極盼望建立在神，不是短期Outcome。
> Christ→Cross→Resurrection→Kingdom→Second Coming→Resurrection→New Creation
06 如何活｜Faith／Prayer／Scripture／Repentance／Forgiveness／Love／Service／Discipleship／Mission
> 神的話→照見Difference→Discernment→Confession→Repentance→Grace→Forgiveness→New Life→New Action→Fruit

## 基督信仰必須保留的本體邊界
! God ≠ Model｜神不等於人的認知模型（也 ≠ 天道自然規律、≠ Cognitive Model）
! Holy Spirit ≠ Nervous System｜聖靈不等於神經系統／神經調節機制
! Grace ≠ Positive Thinking｜恩典不等於正向思考（≠ Feedback、不是認知技巧）
! Repentance ≠ Model Update｜悔改不等於一般模型更新
! Sin ≠ Prediction Error｜罪不等於預測錯誤
! Salvation ≠ Self-Optimization｜救恩不等於自我優化（心理整合 ≠ Salvation）
! Shalom ≠ Calm State｜平安不只是神經平靜
! Christ ≠ Psychological Symbol｜基督不能只被縮減為心理象徵
! Creation ≠ 物理學生成模型｜New Creation ≠ 系統演化｜Christianity ≠ Predictive Processing
可以「結構對照」，不能「本體等同」。可以Crosswalk，不能Reduction。
認知科學可以研究「人如何相信、注意、預測、行動與更新」；神學回答「神、人、罪、救恩與終極Reality是什麼」。認知科學不能因此把「神是否存在」化約成神經模型。
### 從基督信仰自己的Ontology來看
不是「我修改Model，所以得到救恩」；不是「我提高Prediction Accuracy，所以更接近神」；也不是「神是最高階Model」。
God先於人的Model。Reality不由人的認知創造。
LifeOS可以作為｜Reflection Tool 省察工具／Model Scanner 模型掃描器／Prediction Error Detector 錯誤辨識器／Practice Designer 實踐設計器
但不能取代｜God／Christ／Grace／Faith／Revelation／Salvation

## 佛教 Buddhism｜六問
01 我是誰｜與基督信仰有很大的本體差異。重要洞見是「無我」，不能簡單寫成「佛教＝改善Self Model」。更接近：觀察我們如何把不斷變化的身心歷程執著成固定的「我」。五蘊：色、受、想、行、識。問題從「我是什麼樣的人？」變成「我正在執著什麼為『我』？」
02 世界是什麼｜無常、緣起、因果條件相依，沒有孤立存在的事件。與複雜系統語言有結構類比（Conditions Network共同生成），但不代表佛法＝系統科學。
03 什麼最重要｜離苦、智慧、慈悲、不執著、覺察
04 什麼值得注意｜身、受、心、法；念頭如何升起、執著如何形成、苦如何生成
05 未來｜離苦、覺悟、解脫、涅槃；大乘尤其強調菩薩道與利益眾生
06 如何活｜戒、定、慧、八正道、布施、慈悲、正念
> 接觸→感受→認知／想→欲求／排斥→執取→行為→苦
修行就是開始看見這條自動生成鏈。
* 自由不是建立一個更漂亮的「我」，而是不再被固定的「我」綁架。

## 道家 Taoism｜六問
01 我是誰｜不是孤立控制世界的中心，而是道與自然秩序中的一部分
02 世界是什麼｜持續變化、萬物相生、陰陽轉化；很多秩序不是靠強行控制產生
03 什麼最重要｜道、自然、柔弱、平衡、無為
04 什麼值得注意｜勢、時、變化、過度用力、人為執著、系統本身的流向
05 未來｜不是企圖完全控制Future，而是提高對變化與「勢」的敏感度
06 如何活｜無為而無不為、少私寡欲、柔弱勝剛強、順勢而行
控制論類比｜低階控制＝我要Reality服從Model；高階適應＝Model持續感知Reality並調整Action。
* 不要把控制力誤認為生命力。

04 什麼值得注意｜自己的言行、角色責任、他人感受、關係秩序

## 印度教 Hindu Traditions｜六問
內部差異非常大，不能壓成單一教義。

## 研究方法｜保留差異，比較結構
這些宗教不是不同語言描述完全相同的Reality，在Ontology上存在真正差異：
基督信仰說Creator與Creation有根本區別。佛教重要傳統否定永久固定自我。Advaita Vedānta談Ātman／Brahman非二元。道家談道與自然。伊斯蘭強烈維持Allah與受造物的區別。
不能全部翻譯成「其實大家說的一樣」。
* 先保留Difference。再尋找Structure。最後比較Mechanism。
所有宗教不能在本體上直接合併，但可以在「人如何被一套終極框架塑造」這個層級比較。
### 可跨宗教比較的「生命轉化結構」

> Belief／Faith→Attention→Interpretation→Value→Practice→Habit→Character→Relationship→Community→Life Trajectory
宗教真正深刻影響人的地方不是「多知道幾條教義」，而是重新配置：你認為自己是誰、Reality是什麼、把什麼放在最高權重、Attention長期投向哪裡、如何理解痛苦、死亡、他人、如何決定下一個Action。
### 真正值得研究的問題（不是「哪個宗教最好？」）
這套信仰如何定義Reality？／如何定義人？／把什麼放在最高Weight？／訓練人注意什麼？／如何處理人的根本困境？／用什麼Practice完成生命轉化？／認為生命最後走向哪裡？

! Knowledge ≠ Capability。Single Success ≠ Capability。Capability ≈ Repeated Effective Performance Across Conditions

When you're stuck, stop asking "What's wrong with me?" Ask these eight questions.

When life stalls, we blame ourselves.
Not smart enough. Not hardworking enough. Not made for this.

Next time, ask instead:
1. Reality: what actually happened? What is fact, what is my story?
2. Constraint: what is truly limiting me?
3. Mechanism: what loop keeps producing this?
4. Capacity: do I need to push, or to recover?
5. Weight: what am I making too big, or too small?
6. Model: what am I predicting, and is it surely true?
7. Action: what is the smallest step I can take today?
8. Update: what should I change, and by how much?

Often you are not incapable; you missed a constraint.
Often you are not lazy; you never recovered.
Often it is not fate; it is a loop not yet interrupted.

Pushing through is not resilience. Recovering is.
Control is not strength. Adjusting is.
A perfect plan is not progress. A small experiment is.

Wisdom is not knowing the answer to the universe.
Wisdom is telling apart what is real, what is my idea, and what I don't yet know.

Don't fear mistakes.
Fear the day mistakes can no longer get in.

Being wrong is not the danger. Refusing to change is—or changing the wrong thing.

A bad grade: "I have no talent."
A rejection: "I'm not good enough."
A failure: "I knew I couldn't."
Each time the verdict points at the same person: you.

But what if you're blaming the wrong place?
Maybe you hadn't slept. Maybe the timing was off.
Maybe the method didn't fit. Maybe it was just this one test.

Blame the wrong place, and you change the wrong thing.
Change the wrong thing, and it only gets worse.

So before sentencing yourself, ask like a doctor:
What did I expect? What actually happened? Where is the gap?
Was my idea wrong, my execution wrong, or did the setting change?
How strong is this evidence?

Then change only what was truly wrong.
You need not overturn your whole self.

Those who never change grow rigid.
Those who change everything get lost.
Strong evidence, big step. Weak evidence, small step. A fluke, let it rest.

Then try again. Without retesting, you won't know if the new way is better.

A mistake is homework sent by reality.
Finish it, and you've grown a little.

Every kind of stuck has its own kind of remedy.

Being stuck always looks the same: you can't get through.
But the kinds are different.

Stuck from not seeing clearly—treating guesses as facts. Remedy: verify first.
Stuck from hitting a wall—pushing while ignoring limits. Remedy: find the bottleneck.
Stuck in a cycle—the same thing again and again. Remedy: break the loop.
Stuck from an empty battery. Remedy: recover first.
Stuck from caring too much. Remedy: re-rank what matters.
Stuck from a skewed thought. Remedy: describe it another way.
Stuck from not moving. Remedy: take the smallest step.
Stuck from blaming wrongly. Remedy: find the true cause and try again.

The tired don't need more plans.
The lost don't need more effort.
The afraid don't need more lectures.

The wrong medicine makes it worse.
The right one works in a single dose.

Wisdom is giving yourself what you truly need, not what you habitually give.
Next time, before you push, ask: which kind of stuck is this?

Two students both score fifty. Why does one collapse while the other begins to grow?

One says: I'm finished. I'm just stupid.
The other says: Good. Now I know what I don't understand.
Same score. From this moment, different directions.

The difference is not intelligence. It is five inner settings.

One: the default guess.
Before anything happens, you've already predicted it.
The past is a reference, not today's verdict.

Two: how you see yourself.
"I'm stupid" has no next step.
"I haven't learned this part yet" has one immediately.
Don't write a single mistake into your name.

Three: how you see the world.
"Lose and there's no future" freezes you.
"A test shows what to fix" sets you searching.

Four: what matters most.
If it's what others think, one criticism is a disaster.
If it's being better than yesterday, one criticism is a reminder.

Five: what you magnify.
"You improved a lot, but one item needs work."
Which half do you remember?

These settings are not inborn. They can be seen and adjusted.
Say it gently to a child, and to yourself:
You're not incapable. You just haven't learned it yet.

Seven of life's deepest questions. How long since you asked them?

Each day you answer many questions.
What's for dinner. How to write the report.
But seven questions you may not have asked in a long time.

Who am I? Not the title, not the role—you, with every label set down.
What is the world like? A place to guard against, or a place worth exploring?
What does this event mean to me? An ending, or a turn?
What matters most? What I truly want, or what others say I should want?
Where am I putting my energy? Is it somewhere worthy?
Who do I want to become? Not what is expected, but what I am willing to be.
Where is my life heading?

These seven answers quietly decide your every day:
what you notice, what you fear, how you choose, how you treat people.

And they are not fixed for life.
Helped up after a fall, your view of the world changes.
Doing what you thought you couldn't, your view of yourself changes.
Losing what was precious, your ranking changes.

You don't need perfect answers. You need to keep asking.

Wisdom is letting the answers grow as your life grows.
Give yourself ten minutes today, and quietly ask one.

有三種人，你一定見過。

第一種，很會分析。
什麼事都能說出一番道理。
可是，他的道理永遠不會錯，因為他從來不改。

第二種，很會反省。
每次都說：我知道我的問題了。
可是，下一次，還是一樣。

第三種，很會做事。
每天忙得團團轉。
可是，方向錯了，也一路忙下去。

也許，這三種人，都是我們自己。
在不同的時候。

一個人要真的往前，需要三樣東西。

會想：我現在是怎麼看這件事的？
還有沒有別的看法？

會改：現實告訴我，哪裡想錯了？
我願不願意調整？

會做：新的想法，我做得出來嗎？
做了之後，真的比較好嗎？

三樣要連在一起，像一個圈。
想了，去做。
做了，看結果。
結果不對，就改。
改了，再做一次。

走一圈，你進步一點點。
走一百圈，你就是另一個人。

不必一次走得很漂亮。
只要圈是完整的。

只想不做，是空談。
只做不想，是瞎忙。
想了做了卻不改，是原地踏步。

能力，是把這個圈，一圈一圈走完。
智慧，是我有我的想法，但我不被舊的想法綁住。

我最近，是哪一段沒走完？
然後，把那一段補上。

Thinking, revising, doing. Miss any one, and you won't go far.

You've met three kinds of people.

The first analyzes brilliantly.
But their reasoning is never wrong, because they never revise.

The second reflects deeply.
"I know my problem now." And next time, the same.

The third works tirelessly.
Busy all day—and if the direction is wrong, busy all the way down it.

Perhaps all three are us, at different times.

To truly move forward, you need three things.
Think: how am I seeing this? Is there another view?
Revise: where is reality saying I was wrong? Am I willing to adjust?
Do: can I act on the new idea? Is it truly better?

They must connect into a circle.
Think, then act. Act, then look. Wrong? Revise. Then act again.
One round, a small step forward.
A hundred rounds, a different person.

Thinking without doing is empty talk.
Doing without thinking is busywork.
Thinking and doing without revising is marching in place.

Ask yourself today: which part have I not been completing?
Then complete it.

You don't live in the world. You live in your interpretation of it.

A colleague walks past without a greeting.
You wonder: does he have a problem with me?
All day it follows you.
Later you learn he had lost a contact lens and couldn't see.

We think what we see is fact.
What we see is "fact plus my explanation."

The eyes receive the picture.
The mind writes the story—so fast you don't notice.

The first thought is not the truth. It is only the fastest.
It usually comes from an old wound.
The once-ignored think first, "he's ignoring me."
The once-criticized think first, "I did something wrong."

Three practices:
State the fact. Not "he dislikes me," but "he didn't greet me today."
Add two more possibilities. Rushing? In a bad mood? Didn't see me?
Then ask: what evidence would show I'm wrong?

A second explanation loosens the heart.
A third sets you free.

There is one world, but many ways to see it.
You needn't hurry to choose the saddest one.

Today, write one less drama for others,
and spend the saved strength living your own day.

Why is it so hard to admit we were wrong?

You know you weren't quite right.
But the words are already out.
So you find reasons, evidence, people who agree.
The louder you speak, the more you believe.

We've all done it. Admitting hurts.
It feels like shrinking.

But think:
Do you trust someone who never changes their mind?
Don't you respect the one who says, "I was wrong before"?

Changing your mind is not disgrace.
It is seeing more clearly than yesterday.

The danger is not guessing wrong.
It is clinging to the wrong guess.

Trade "protecting my face" for "protecting my growth."
Trade "who was wrong" for "which part was wrong."
Trade "I'm terrible" for "this point needs adjusting."

You needn't overturn yourself.
If the roof leaks, mend the roof. Don't tear down the house.

And you needn't change all at once.
Moving from "I'm certain" to "I think so, probably" is already progress.
Then test again.

Real confidence is not "I must be right."
It is "If I'm wrong, I can change."

May you have the courage to say: I was wrong.
And may what you feel then be not shame, but lightness.

A hundred videos are worth less than doing it once with your own hands.

While watching, it looks easy.
You understand everything the teacher says.
Your notes are beautiful.
Then you try it, and your mind goes blank.

You are not slow.
Between "understanding" and "being able" runs a river.
Only one thing crosses it: doing.

Watching others swim won't teach you to swim.
What your body hasn't done is not yet yours.

So learn like this:
Learn one thing, do it once, right away.
Shrink big tasks to five minutes.
Prepare the environment: book on the desk, phone far away.
Don't test your willpower; make the right thing easy.
Try it in another setting: tomorrow, elsewhere, under pressure.

When you fail, don't watch ten more videos.
Do it once more, and ask for feedback once more.

Getting it right once isn't learning.
Still able the next day—that begins to count.
Still able under pressure—that is your skill.

Knowing the direction is not arriving.
Real learning happens at the moment your hands move.

Today, close one video, and do the thing you've long "known."

Which kind of stuck are you? Overthinking, unable to change, or busy for nothing?

Some are stuck in overthinking.
Their analysis is thorough, their story complete.
But they never check whether the story is true,
and in time they live in a world they wrote.

Some are stuck in not changing.
They reflect deeply and write long reviews.
But life stays the same,
because the change happened only in the mind.

Some are stuck in busyness.
Always doing, always rushing, always tired.
Never pausing to ask: why this? Is this the way?

The clever get trapped by their cleverness.
The earnest get drained by their earnestness.
The hardworking get led astray by their hard work.

You are not lacking in worth. You are missing one piece.

Overthinker: go do one small thing.
Reflector: turn one reflection into one action.
Busy one: stop, and think for ten minutes.

Ask three things each time:
How am I seeing this?
What is reality telling me to change?
What can I do to know whether the change worked?

Wisdom is adding the missing piece, not doing more of what you're already good at.
Today, do a little of the part you usually skip.

科學告訴你怎麼活，信仰陪你問為什麼活
日子過得不差。
有工作，有家，有該忙的事。
可是，夜深人靜的時候，心裡有一個聲音：
然後呢？
我這樣活著，是為了什麼？

這個問題，沒有哪一張報表答得出來。

科學很了不起。
它告訴我們，世界怎麼運作。
身體怎麼運作。
大腦怎麼運作。
但它不負責告訴你：這一切，對你有什麼意義。

幾千年來，人類用很多方式回答這個問題。
有人仰望創造的主。
有人觀照無常與因緣。
有人學習順應自然。
有人在關係中修養自己。

它們不是同一個答案的不同說法。
它們是不同的答案。
各有各的深度，各有各的堅持。

所以，不必急著說：其實都一樣。
也不必急著說：只有我對。

先安靜下來，聽。
聽每一個傳統，認真地在回答什麼。

科學、哲學、信仰，不是在搶同一個位子。
一個問「怎麼運作」。
一個問「怎麼想才通」。
一個問「為什麼活、往哪裡去」。
人，三個都需要。

只有方法，沒有方向，會走得很快，卻不知去哪。
只有方向，沒有方法，會很有熱情，卻到不了。

能力，是讓所信的，進入每天的選擇。
智慧，是知道自己的理解有限，所以謙卑，所以繼續尋找。

願你不害怕那個深夜的提問。
願你帶著它，慢慢走，走出自己的答案。

#生命意義 #信仰 #為什麼而活 #SoulOS

Science tells you how to live. Faith walks with you as you ask why.

Life isn't bad. There's work, a home, things to do.
But in the quiet of night a voice asks:
And then? What am I living for?
No spreadsheet can answer that.

Science is remarkable.
It tells us how the world, the body, and the brain work.
It does not tell you what any of it means to you.

For thousands of years, humanity has answered in many ways.
Some look to the Creator.
Some contemplate impermanence and conditions.
Some learn to follow nature.
Some cultivate themselves within relationships.

These are not the same answer in different words.
They are different answers, each with its own depth.

So don't hurry to say, "They're all the same."
Don't hurry to say, "Only I am right."
Be quiet first, and listen.

One asks how things work.
One asks how to think it through.
One asks why we live and where we are going.
We need all three.

Method without direction goes fast, to nowhere.
Direction without method burns bright, and never arrives.

May you not fear the late-night question.
May you carry it, walk slowly, and walk into your own answer.

Ten questions to understand how any belief shapes a person.

Why do some stay calm in disaster?
Why do some have much and remain uneasy?
Why do people react so differently to the same thing?

Because everyone carries a set of answers about life,
religious or not, aware of it or not.

To know a person or a belief, don't just listen to the terms. Ask:
1. What is ultimately real?
2. What is existence?
3. Who am I?
4. How does the world work?
5. Why do people suffer?
6. What matters most?
7. Where does the heart look each day?
8. How does a person change?
9. What do they actually do each day?
10. Where does life finally lead?

Ten answers, joined together, form a blueprint of a life.

Ask yourself these ten as well. You may be startled.
Some answers were handed to you in childhood and never examined.
Some questions you've never considered.
What you say you value and what you do each day don't quite match.

No need for shame. Seeing it is the beginning.

Wisdom is letting your ten answers stop quarrelling, and living them out.

Many wish to change the world. Few are willing to change themselves first.

We are good at naming problems.
The company's system. Society's climate.
The spouse, the children, the parents.
All true. And after saying so, nothing changes.

The Confucian tradition offers a plain order:
cultivate yourself first.
Then set the family in harmony.
Only then speak of larger things.

Not because the world doesn't matter,
but because change travels from the inside outward.

One steady person steadies a household a little.
One harmonious household warms a street a little.
One trustworthy person lets others dare to trust.

It reminds us we are not isolated selves.
We live in relationships: someone's child, parent, friend, colleague.
Each role carries a duty. Fulfilling each well is the practice.

It treasures five things:
benevolence—holding others in your heart;
rightness—doing what ought to be done;
propriety—knowing due measure;
wisdom—telling right from wrong;
trustworthiness—doing what you say.

The method is not mysterious:
learn a little each day; examine yourself each day;
practice what you learn; do not impose on others what you would not want.

The greatest influence is becoming someone worthy of trust.
Today, before asking of others, ask: have I done my part?

"We're all really the same." A kind sentence that may be a form of disrespect.

To keep the peace we often say:
all religions just teach people to be good.
They all say the same thing.

It is kindly meant.
But a sincere believer may feel a small ache on hearing it,
because it brushes lightly past what they hold most dear.

In truth, they are different.

One tradition says Creator and creation are fundamentally distinct.
One says there is no eternal, unchanging self.
One says the individual and ultimate reality are not two.
One says the Way follows what is natural.

These are not translations of one sentence.
They are truly different ways of seeing.

Calling them the same is not inclusion.
It is not having listened.

Must difference mean conflict? No.

Real respect has three steps.
First, keep the differences. Don't flatten; don't rank.
Second, see the shared structure: each answers who we are, why we suffer, how we change.
Third, compare how each goes about it.

You may disagree, but understand first.
You may hold a position without hostility.
You may trust your own path and still learn another's well.

The same is true with people.
Insisting "we're the same" doesn't dissolve the problem.
Admitting "we truly differ" is where understanding starts.

May you not fear difference.
May your understanding begin with listening to the end.

What you do repeatedly each day is deciding who you become.

What do you believe?
You answer quickly: love matters. Family. Health. Honesty.

What you care about must become what you notice daily.
What you notice must become choices.
Choices, repeated, become habits.
Habits, gathered, become character.
Character, carried into relationships, becomes your life.

So a person's real faith is not in what they say.
It is in where their attention goes each day,
what they sacrifice first when busy,
and what they do when no one is watching.

This is not a rebuke. It is good news.
Change needn't wait for a great awakening.
It can begin with one small daily act.

Five minutes of quiet.
One sincere thank-you.
Once a day, put down the phone and look someone in the eye.
Once a day, ask: does this choice fit what I truly believe?

And leave a window open. Look back after a while:
has this path made me more loving, more honest, more free?

May what you say and what you live be one and the same.

Someone who knows many truths is not necessarily mature.

Do you know someone like this?
Scriptures by heart. Principles in rows. A quotation always ready.
Yet being with them is not comfortable.
The temper is still large, the heart still hard, the judgment still harsh.
Perhaps, sometimes, that person is us.

Knowing and becoming are two different things.

We once thought faith was believing a few sentences.
In truth, it is a whole life rearranged.

We once thought religion was a body of knowledge.
In truth, it concerns who you are, what you value, how you live each day, and where you're going.

We once thought knowing more meant maturity.
In truth, maturity shows in how you treat those closest to you.

We once thought those who differ were opponents.
In truth, difference is a chance to know another world.

We once thought what we understood was everything.
In truth, human understanding is always limited and always needs humility.

So to check your growth, don't count books. Ask:
Am I more patient than last year?
Do I apologize more easily?
Can I hear a different voice better?
Do those nearest me find me gentler?

Wisdom is this: the more you understand, the humbler and softer you become.

May you not only know.
May you become.

In an age of information overload, what you lack is not knowledge, but digestion.

How much do you swallow each day?
News, short videos, posts, courses, podcasts.
Yet when asked what you learned today, you can't say.

You eat a great deal and grow weaker,
because you keep eating without digesting.

Information is not knowledge.
Knowledge is not ability.
Ability is not wisdom.
Each step requires transformation.

Information must be organized to become knowledge.
Knowledge must be used to become ability.
Ability must be tested many times, in many settings, to settle into wisdom.

Skip a step, and all you get is the feeling of "sort of understanding."
It is charming, and dangerous.
You think you're progressing. You're only scrolling.

Try living a day this way:
see less, think more.
Save less, use more.
After reading, ask: what has this to do with me?
After learning, use it once today, and check the result.

Truly digest one thing a day—365 a year.
Far better than skimming a hundred a day.

And don't blend everything together.
Each kind of knowledge has its proper range.
Forcing them into one sounds profound, but is simply not understanding.

Close a few tabs today.
Leave some empty space for what you learn to grow into your life.

The claim overreached to begin with.

Every statement has a range in which it applies.

The study of tiny particles speaks about tiny particles.
The study of energy flow speaks about energy flow.
The study of complex change speaks about how systems change.
The study of mind speaks about how people perceive, learn, and decide.

Carrying one field's conclusion straight into another
is not integration. It is putting the wrong hat on the wrong head.

Metaphors are beautiful and illuminating.

Loving someone well needs no endorsement from particles.

The real scientific spirit is plain:
What evidence do I have? Are there counterexamples?
How can I test it? If I'm wrong, I'll change.

Bring that attitude into daily life.
It is worth more than a hundred technical terms.

May your beliefs stand on the ground.

Once may be luck. Twice is skill.

Two: you can do it somewhere else.
Change the question, change the setting—can you still?

Three: you can do it under disturbance.
Tired, rushed, watched. If it still holds, it's reliable.

Four: when conditions change, you can adapt.
New tools, new rules—can you find a new way yourself?

from knowing, to doing once, to doing many times,
to doing it elsewhere, to doing it however things change.

After many places, you find a few principles that hold everywhere,
and some that fail in certain places.
Knowing when not to use something matters as much as knowing how.

Every practice counts. None is wasted.

May one success not make you complacent.
May one failure not make you quit.
Time after time, may you practice "knowing" into "mine."

每轉一圈，你的心穩一點。
每轉一圈，你的手巧一點。

而且，這個圈不是只在腦袋裡轉。
身體、環境、身邊的人，都在這個圈裡。
身體好一點，圈就順一點。
環境對了，圈就快一點。
有人陪著，圈就不那麼孤單。

所以，不要怕課題重來。
重來，是因為你準備好，學更深一層了。

真正讓人停住的，不是重複。
是拒絕從重複裡學習。

能力，是每一圈都帶走一點東西。
智慧，是轉了很多圈之後，心裡清楚而安靜。

願你回頭看時，發現自己已經站得比從前高。
願你對那個還在繞圈的自己，說一聲：辛苦了，你有在長大。

#螺旋成長 #你有在進步 #人生課題 #LifeOS
---
Life is not a straight line. It is a spiral, rising turn by turn.

Do you feel you keep going in circles?
The same lesson, back again.
The hurdle you thought you'd cleared, here once more.
What you thought you'd released aches again.
"I haven't grown at all," you say.

Don't conclude yet.
You may not be circling in place.
You may be on a spiral.

From above, a spiral looks like a circle.
From the side, it rises layer by layer.

The same lesson returns,
but this time you notice sooner.
This time the sadness is shorter.
This time you have one more choice.
That is rising.

Life was never a straight line.
It is a loop that repeats:
something happens; you see it with the eyes you have;
you choose; a result comes;
it differs from what you expected; you adjust;
and the next thing arrives.

Each turn, your view widens a little.
Each turn, your heart steadies a little.

And the loop doesn't turn in the head alone.
Body, surroundings, and the people near you are all in it.

So don't fear the lesson returning.
It returns because you are ready to learn a layer deeper.

What truly stops a person is not repetition.
It is refusing to learn from it.

May you look back and find you stand higher than before.
And to the self still circling, say: well done. You are growing.
---
你不是在原地繞圈，你是在螺旋上往上。 || You are not circling in place. You are rising on a spiral.
課題重來，是因為你準備好學更深一層了。 || The lesson returns because you're ready to learn a layer deeper.
對還在繞圈的自己說：辛苦了，你有在長大。 || To the self still circling, say: well done. You are growing.
</script>

<script>
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const tabs=[];
function parse(src){
  let tab,card,tbl=null;
  const flush=()=>{if(tbl&&card){card.html+='<div class="tw"><table>'+tbl.map((r,i)=>'<tr>'+r.map(c=>(i?'<td>':'<th>')+esc(c)+(i?'</td>':'</th>')).join('')+'</tr>').join('')+'</table></div>'}tbl=null};
  for(let ln of src.split('\n')){
    ln=ln.trim();if(!ln)continue;
    if(ln[0]!=='|')flush();
    if(ln.startsWith('# ')){tab={name:ln.slice(2),cards:[]};tabs.push(tab);continue}
    if(ln.startsWith('## ')){card={title:ln.slice(3),html:'',text:ln.slice(3)};tab.cards.push(card);continue}
    if(!card)continue;
    card.text+='\n'+ln;
    if(ln.startsWith('### '))card.html+='<h3>'+esc(ln.slice(4))+'</h3>';
    else if(ln[0]==='|'){(tbl=tbl||[]).push(ln.split('|').slice(1,-1).map(s=>s.trim()))}
    else if(ln.startsWith('> ')){const bi=ln.includes('↕');card.html+='<div class="flow">'+ln.slice(2).split(/→|↕/).map(s=>'<span>'+esc(s.trim())+'</span>').join('<i>'+(bi?'↕':'→')+'</i>')+'</div>'}
    else if(ln.startsWith('~ ')){const[a,b]=ln.slice(2).split(' => ');card.html+='<div class="pair"><div class="o">舊｜'+esc(a)+'</div><div class="n">新｜'+esc(b||'')+'</div></div>'}
    else if(ln.startsWith('! '))card.html+='<p class="warn">'+esc(ln.slice(2))+'</p>';
    else if(ln.startsWith('* '))card.html+='<p class="wis">'+esc(ln.slice(2))+'</p>';
    else{const i=ln.indexOf('｜');card.html+=(i>0&&i<34)?'<p><b>'+esc(ln.slice(0,i))+'</b>｜'+esc(ln.slice(i+1))+'</p>':'<p>'+esc(ln)+'</p>'}
  }
  flush();
}
parse(document.getElementById('data').textContent);

// 臉書貼文＋圖卡：每個分頁最後一張卡
const POSTS=[];
// 「@ 分頁」＝分頁總貼文（獨立卡片）；「@ 分頁 > 卡片標題開頭」＝掛在該卡片底下
const postSrc=[...document.querySelectorAll('#posts,script.posts')].map(s=>s.textContent).join('\n');
for(const blk of ('\n'+postSrc).split(/\n@ /).slice(1)){
  const [head,en,cs]=blk.split('\n---\n').map(s=>s.trim());
  if(!cs)continue;
  const ls=head.split('\n'),name=ls[0].trim(),title=ls[1].trim(),zh=title+'\n\n'+ls.slice(2).join('\n').trim();
  const cards=cs.split('\n').map(l=>l.split(' || '));
  const [tn,key]=name.split(' > '),t=tabs.find(t=>t.name===tn);
  if(!t)continue;
  const i=POSTS.push({zh,en,cards,name})-1;
  const html='<h3>中文貼文（'+zh.replace(/\s/g,'').length+' 字）</h3><div class="post">'+esc(zh)+'</div>'+
    '<h3>English</h3><div class="post">'+esc(en)+'</div>'+
    '<p><button data-cp="'+i+':zh">複製中文</button> <button data-cp="'+i+':en">複製英文</button> <button data-cp="'+i+':both">複製雙語</button></p>'+
    '<h3>金句圖卡（可下載 1080×1080 PNG）</h3><div class="qcs">'+cards.map((c,j)=>'<div class="qw"><div class="qc"><div class="z">'+esc(c[0])+'</div><div class="e">'+esc(c[1]||'')+'</div><small>天道母體 × Soul OS</small></div><button data-dl="'+i+':'+j+'">下載圖卡</button></div>').join('')+'</div>';
  const txt='\n'+zh+'\n'+en+'\n'+cs;
  if(key){const c=t.cards.find(c=>c.title.startsWith(key));if(c){c.html+='<h3>📣 臉書貼文＋圖卡</h3>'+html;c.text+=txt;c.fb=1}}
  else t.cards.push({title:'📣 分頁總貼文＋圖卡｜'+title,text:txt,html});
}
function copyText(s,btn){
  const ok=()=>{const o=btn.textContent;btn.textContent='已複製 ✓';setTimeout(()=>btn.textContent=o,1200)};
  const fb=()=>{const ta=document.createElement('textarea');ta.value=s;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();ok()};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).then(ok,fb);else fb();
}
function wrap(ctx,text,maxW,byWord){
  const units=byWord?text.split(' '):[...text],lines=[];let cur='';
  for(const u of units){const t=cur?(byWord?cur+' '+u:cur+u):u;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=u}else cur=t}
  if(cur)lines.push(cur);return lines;
}
function drawCard(zh,en,file){
  const c=document.createElement('canvas');c.width=c.height=1080;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,1080,1080);g.addColorStop(0,'#3b2a1a');g.addColorStop(.55,'#8a5a2b');g.addColorStop(1,'#2f6f6a');
  x.fillStyle=g;x.fillRect(0,0,1080,1080);
  x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=3;x.strokeRect(50,50,980,980);
  x.fillStyle='#fff';x.textBaseline='top';
  const zf='bold 66px "Microsoft JhengHei","PingFang TC",sans-serif',ef='italic 36px Georgia,serif';
  x.font=zf;const zl=wrap(x,zh,860,false);x.font=ef;const el=wrap(x,en,860,true);
  let y=(1080-(zl.length*100+50+el.length*54))/2;
  x.font=zf;for(const l of zl){x.fillText(l,110,y);y+=100}
  y+=50;x.font=ef;x.globalAlpha=.9;for(const l of el){x.fillText(l,110,y);y+=54}
  x.globalAlpha=.7;x.font='28px "Microsoft JhengHei",sans-serif';x.fillText('天道母體 × Soul OS',110,960);
  const a=document.createElement('a');a.download=file+'.png';a.href=c.toDataURL('image/png');a.click();
}
document.addEventListener('click',e=>{
  const d=e.target.dataset;if(!d)return;
  if(d.cp){const[i,k]=d.cp.split(':'),p=POSTS[i];copyText(k==='both'?p.zh+'\n\n— — —\n\n'+p.en:p[k],e.target)}
  if(d.dl){const[i,j]=d.dl.split(':'),p=POSTS[i];drawCard(p.cards[j][0],p.cards[j][1]||'','圖卡_'+p.name.replace(/[\\/:*?"<>|｜→\s]+/g,'_')+'_'+(+j+1))}
});

// 原文庫：貼上原始文字，依【標題】自動切段，存在本機瀏覽器
const RAW='tiandao_raw';
function rawTab(){
  let t='';try{t=localStorage.getItem(RAW)||''}catch(e){}
  const cards=[];let c=null;
  for(const ln of t.split('\n')){
    const s=ln.trim();if(!s||/^[━─`]+/.test(s))continue;
    if(s[0]==='【'){c={title:s,html:'',text:s};cards.push(c);continue}
    if(!c){c={title:'（開頭）',html:'',text:''};cards.push(c)}
    c.text+='\n'+s;c.html+='<p>'+esc(s)+'</p>';
  }
  return {name:'原文庫',cards,raw:true};
}
tabs.push(rawTab());

let cur=0,allOpen=false;
const $=id=>document.getElementById(id),out=$('out'),q=$('q');
function mark(root,k){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];
  while(w.nextNode())ns.push(w.currentNode);
  for(const n of ns){
    const low=n.nodeValue.toLowerCase();let i=low.indexOf(k);if(i<0)continue;
    const f=document.createDocumentFragment();let p=0;
    while(i>=0){f.append(n.nodeValue.slice(p,i));const m=document.createElement('mark');m.textContent=n.nodeValue.slice(i,i+k.length);f.append(m);p=i+k.length;i=low.indexOf(k,p)}
    f.append(n.nodeValue.slice(p));n.replaceWith(f);
  }
}
function render(){
  const k=q.value.trim().toLowerCase();
  $('nav').innerHTML=tabs.map((t,i)=>'<button class="'+(i===cur&&!k?'on':'')+'" data-i="'+i+'">'+t.name+'</button>').join('');
  let list=[];
  if(k)tabs.forEach(t=>t.cards.forEach(c=>{if(c.text.toLowerCase().includes(k))list.push([t,c])}));
  else list=tabs[cur].cards.map(c=>[tabs[cur],c]);
  let h='';
  if(!k&&tabs[cur].raw)h+='<details open><summary>貼上／更新原文</summary><div class="body"><p>把完整原文貼在這裡按儲存，會依【標題】自動切成卡片並納入搜尋（只存在這台電腦的瀏覽器）。</p><textarea id="raw"></textarea><p><button id="save">儲存</button> <button id="clr">清空</button></p></div></details>';
  h+=list.map(([t,c])=>'<details'+(k||allOpen?' open':'')+'><summary>'+esc(c.title)+(c.fb?' 📣':'')+(k?'<small>'+t.name+'</small>':'')+'</summary><div class="body">'+c.html+'</div></details>').join('');
  out.innerHTML=h;
  $('info').textContent=k?'找到 '+list.length+' 張卡片（搜尋全部分頁）':tabs[cur].name+'｜'+list.length+' 張卡片，點標題展開';
  if(k)mark(out,k);
  const ra=$('raw');
  if(ra){try{ra.value=localStorage.getItem(RAW)||''}catch(e){}
    $('save').onclick=()=>{try{localStorage.setItem(RAW,ra.value)}catch(e){alert('此瀏覽器無法儲存')}tabs[tabs.length-1]=rawTab();render()};
    $('clr').onclick=()=>{if(confirm('清空原文庫？')){try{localStorage.removeItem(RAW)}catch(e){}tabs[tabs.length-1]=rawTab();render()}};
  }
}
$('nav').onclick=e=>{const i=e.target.dataset.i;if(i!==undefined){cur=+i;q.value='';render();scrollTo(0,0)}};
q.oninput=render;
$('tg').onclick=()=>{allOpen=!allOpen;$('tg').textContent=allOpen?'全部收合':'全部展開';out.querySelectorAll('details').forEach(d=>d.open=allOpen)};
render();
</script>
</body>
