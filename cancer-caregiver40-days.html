<style>
:root{--bg:#f7f4ee;--card:#fff;--ink:#2d2a26;--mute:#7a736a;--line:#e6dfd3;--acc:#9a6b3f;--acc2:#f3e9dc;--hl:#ffe49a}
@media (prefers-color-scheme:dark){:root{--bg:#1c1a17;--card:#27241f;--ink:#ece6dc;--mute:#a39a8e;--line:#3b362f;--acc:#d9a873;--acc2:#3a3027;--hl:#6e5717}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0 8px}
h1{font-size:18px;margin:0 0 8px;letter-spacing:.05em}
h1 small{font-weight:400;color:var(--mute);font-size:13px;margin-left:6px}
#q{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:15px}
#q:focus{outline:2px solid var(--acc);border-color:transparent}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--acc2);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--ink);padding:4px 14px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px}
.seg button.on{background:var(--card);color:var(--acc);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
main{padding:14px 0 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;border-top:5px solid var(--bc,var(--acc))}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dayhead .mid{text-align:center}
.dn{font-size:26px;font-weight:800;color:var(--bc)}
.tag{display:inline-block;font-size:13px;padding:1px 10px;border-radius:999px;background:var(--bc);color:#fff;margin-left:6px;vertical-align:middle}
.nav{border:1px solid var(--line);background:var(--card);color:var(--ink);width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer}
.sub{text-align:center;color:var(--mute);font-size:14px;margin-top:2px}
.quote{font-size:21px;line-height:1.7;font-weight:600;margin:18px 4px;padding-left:14px;border-left:4px solid var(--bc)}

.act input{width:22px;height:22px;margin-top:3px;accent-color:var(--bc);flex:none}
.act b{display:block;font-size:13px;color:var(--mute)}
.act.done span{text-decoration:line-through;opacity:.65}
.box{margin-top:12px;font-size:14.5px;border:1px dashed var(--line);border-radius:12px;padding:10px 14px}
.box b{color:var(--bc)}
.ref{color:var(--mute);font-size:13px}
textarea,input[type=date]{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
textarea{resize:vertical;min-height:44px}
.card textarea{margin-top:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 8px;font-size:14px;color:var(--mute)}
.row input[type=date]{width:auto;padding:4px 8px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 12px;cursor:pointer;font:inherit;font-size:14px}
.btn:hover{border-color:var(--acc)}
.pg{flex:1;min-width:120px;height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.pg i{display:block;height:100%;background:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.grid button{aspect-ratio:1;border-radius:9px;border:2px solid var(--gc);background:var(--card);color:var(--ink);cursor:pointer;font-size:13px;padding:0}
.grid button.dn2{background:var(--gc);color:#fff}
.grid button.cur{outline:3px solid var(--acc);outline-offset:1px}
.note{font-size:12.5px;color:var(--mute);margin-top:14px}

.c5{--bc:#3f84a8;--gc:#3f84a8}.c6{--bc:#6a6fb8;--gc:#6a6fb8}.c7{--bc:#9a5fa6;--gc:#9a5fa6}.c8{--bc:#b8577a;--gc:#b8577a}

.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:3px 12px;cursor:pointer;font:inherit;font-size:13.5px}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
h2{font-size:19px;margin:6px 0 10px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
summary{padding:10px 14px;cursor:pointer;font-weight:700}
.sec{padding:0 14px 12px}
.ln{white-space:pre-wrap;padding:2px 4px;border-radius:6px}
.ln .k{color:var(--acc)}
.ln.flow{color:var(--mute)}
.ln.flash{background:var(--hl);transition:background 1s}
table{border-collapse:collapse;width:100%;font-size:13.5px;margin:6px 0;display:block;overflow-x:auto}
td,th{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--acc2)}
mark{background:var(--hl);color:inherit;border-radius:3px}
.res{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px;cursor:pointer}
.res:hover{border-color:var(--acc)}
.src{font-size:12px;color:var(--mute)}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:14px;font-weight:600;margin-bottom:3px}
.hist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.hist button{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 12px;cursor:pointer;font:inherit;font-size:14px}
.hist button.on{border-color:var(--acc)}
.muted{color:var(--mute);font-size:13px}
.hide{display:none!important}
@media (max-width:520px){.quote{font-size:18.5px}.grid{gap:4px}.grid button{font-size:11px;border-radius:7px}}

# 癌友照顧者40天基督生命更新OS｜每日金句 × 最小行動
核心信念｜照顧癌友是愛的實踐，但照顧者也值得被愛、被理解與被照顧。
核心智慧｜真正的愛不是一個人承擔全部，而是讓關懷、責任、資源與支持形成可以持續的照顧系統。
核心目標｜從恐懼走向信靠，從控制走向陪伴，從耗竭走向有界線的愛，從孤軍奮戰走向共同承擔。
生命更新公式｜神的恩典→身分更新→價值重整→情緒分辨→認知修正→聖靈察驗→愛與界線→照顧行動→生命果子→持續更新。
【BANK01｜身分更新：我不只是照顧者，我也是神所愛的人】
Day01｜金句：我照顧所愛的人，但我的價值不取決於我能照顧多少。｜行動：對自己說「我值得被愛，也值得被照顧」。
Day02｜金句：癌友的病情不是我一個人的責任，神也沒有要求我控制所有結果。｜行動：寫下三件自己無法控制的事情，停止為它們責怪自己。
Day03｜金句：我可以盡心照顧，卻不需要成為永遠不會疲倦的人。｜行動：今天安排15分鐘不必照顧任何人的時間。
Day04｜金句：當我無法讓親人免於痛苦，不代表我的愛不夠。｜行動：放下一項不合理的自我要求。
Day05｜金句：神看重我的忠心，也看重我的軟弱與需要。｜行動：向神誠實說出今天最需要的幫助。
核心經文｜以弗所書2:8–10；馬太福音11:28。
舊模式｜我必須拯救家人，才是好照顧者。
新模式｜我負責提供適當照顧，但不必獨自承擔疾病結果。
【BANK02｜價值權重：把力量用在真正重要的地方】
Day06｜金句：照顧不是做得越多越好，而是把有限的力量用在真正需要的地方。｜行動：列出今天最重要的三項照顧任務。
Day07｜金句：我不必把所有事情都做到完美，安全與重要需求應該優先。｜行動：把任務分成必須完成、可以協助、可以延後。
Day08｜金句：真正的忠心不是永遠忙碌，而是懂得安排可持續的照顧。｜行動：取消一件不必要的工作，保留休息時間。
Day09｜金句：今天最重要的事，可能不是解決問題，而是好好陪伴。｜行動：用十分鐘專心聆聽癌友，不急著給建議。
Day10｜金句：照顧者的健康也是家庭照顧系統的重要資源。｜行動：完成今天一項基本自我照顧，例如正常吃飯、散步或休息。
核心經文｜傳道書3:1；馬可福音6:31。
舊模式｜每件事情都很重要，我必須全部完成。
新模式｜依照安全、醫療需求、體力與資源重新排序。
【BANK03｜情緒分辨：我可以疲憊，也可以難過】
Day11｜金句：我可以愛家人，也可以對長期照顧感到疲憊，兩者並不矛盾。｜行動：辨認今天最明顯的一種情緒。
Day12｜金句：當我感到生氣，可能是因為我承擔了超過能力的責任。｜行動：寫下憤怒背後的一項未被滿足的需要。
Day13｜金句：我可以害怕失去親人，但不必讓恐懼決定每一個選擇。｜行動：將一項擔憂分成已知事實與尚未確定的想像。
Day14｜金句：眼淚不代表我沒有信心，而是我也正在經歷艱難。｜行動：允許自己向神或信任的人說出委屈。
Day15｜金句：真正的堅強不是壓住所有情緒，而是知道何時需要支持。｜行動：聯絡一位可以安心談話的人。
核心經文｜詩篇34:18；羅馬書12:15。
舊模式｜照顧者不能哭、不能累、不能抱怨。
新模式｜理解情緒、適當表達、主動尋求支持。
【BANK04｜認知模型更新：從自責走向智慧】
Day16｜金句：癌症是複雜的疾病，不是我做錯一件事才造成的結果。｜行動：停止一個沒有事實根據的自責念頭。
Day17｜金句：我可以提供支持，但無法保證每一次治療都成功。｜行動：區分今天能做的事情與醫療結果。
Day18｜金句：病情變化需要醫療判斷，不需要我用恐懼填滿未知。｜行動：記錄一項病情疑問，向醫療團隊確認。
Day19｜金句：真正的信心不是相信一切都會照我的期待發生，而是願意面對真實處境。｜行動：接受一項目前已確認的事實，再思考下一步。
Day20｜金句：當舊方法不再有效，我可以調整照顧方式，而不是責怪自己不夠努力。｜行動：找出一項需要改變的照顧流程。
核心經文｜羅馬書12:2；雅各書1:5。
舊模式｜病情不好，一定是我照顧不周。
新模式｜依據醫療資訊、實際需求與回饋調整照顧。
【BANK05｜聖靈感動察驗：用信心、真理與智慧作決定】
Day21｜金句：禱告不是代替醫療，而是讓我帶著信心與智慧面對醫療選擇。｜行動：為醫療團隊禱告，並整理三個重要問題。
Day22｜金句：神的引導不要求我忽略事實，而是提醒我謹慎察驗。｜行動：對一項治療或營養建議，先核對可靠證據與安全性。
Day23｜金句：我不必把每一次病情惡化都解讀為神的懲罰。｜行動：閱讀約翰福音9:1–3，停止以疾病責怪癌友或自己。
Day24｜金句：真正的愛尊重癌友的意願，而不是用我的恐懼控制他的選擇。｜行動：詢問癌友「你最希望我怎麼幫助你？」
Day25｜金句：當我不知道該怎麼辦，可以禱告、求助、查證，而不是獨自猜測。｜行動：向一位醫療專業人員或可信任的支持者提出問題。
核心經文｜帖撒羅尼迦前書5:21；雅各書1:5。
舊模式｜只要我有強烈感動，就一定是最好的選擇。
新模式｜結合聖經原則、醫療證據、癌友意願與實際責任。
【BANK06｜愛與界線：愛不是犧牲到耗盡自己】
Day26｜金句：真正的愛不是一個人做完所有事情，而是讓每個人承擔合適的責任。｜行動：請一位家人分擔一項具體任務。
Day27｜金句：我可以關心癌友，也可以保留睡眠、工作與基本生活的需要。｜行動：為自己安排一段明確的休息時間。
Day28｜金句：我不必接受所有人的批評，才能證明自己是一個好照顧者。｜行動：對一項不合理指責作出清楚而尊重的回應。
Day29｜金句：陪伴不是替癌友決定一切，而是幫助他保有尊嚴與選擇。｜行動：讓癌友在能力許可下自行決定一件生活小事。
Day30｜金句：照顧者也需要被照顧，求助不是失職，而是讓愛可以持續。｜行動：安排一項替手照顧、親友協助或喘息資源。
核心經文｜加拉太書6:2、6:5；以弗所書4:15。
舊模式｜我不做，就沒有人會做。
新模式｜建立分工、清楚界線與可持續的支持網絡。
【BANK07｜順服行動：把信仰轉化為具體照顧】
Day31｜金句：今天的一次溫柔陪伴，可能比十句勸人堅強的話更有力量。｜行動：陪伴癌友十分鐘，只聆聽，不急著糾正。
Day32｜金句：愛不是要求癌友樂觀，而是願意接住他真實的情緒。｜行動：當癌友難過時，說「我願意聽你說」。
Day33｜金句：忠心的照顧可以從一件小事開始，不需要每天完成偉大的任務。｜行動：協助完成一項癌友真正需要的事情。
Day34｜金句：照顧身體需要智慧，觀察症狀、遵循醫囑也是愛的實踐。｜行動：核對一次用藥安排、回診事項或症狀紀錄。
Day35｜金句：真正的陪伴不是永遠替對方解決問題，而是讓他知道自己不孤單。｜行動：問癌友「今天有什麼事情，是你希望我們一起面對的？」
核心經文｜雅各書1:22；加拉太書6:2。
舊模式｜一直說鼓勵的話，卻忽略實際需要。
新模式｜理解需求、尊重意願、提供具體支持。
【BANK08｜生命果子驗證：讓愛成為長期穩定的力量】
Day36｜金句：仁愛不是照顧到自己崩潰，而是在能力範圍內持續關懷。｜行動：完成一項關懷，也安排自己的休息。
Day37｜金句：和平不是所有人都沒有意見，而是願意用尊重的方式討論困難。｜行動：與家人釐清一項照顧分工，不互相責備。
Day38｜金句：忍耐不是忍受所有不合理要求，而是堅定而溫柔地守住原則。｜行動：對一件超出能力的任務提出替代方案。
Day39｜金句：信實不是答應所有事情，而是把真正承諾的事情做好。｜行動：檢查今天一項照顧承諾是否已完成。
Day40｜金句：即使疾病結果無法由我決定，我仍然可以在神的恩典中活出仁愛、溫柔與信實。｜行動：回顧40天，寫下三項成長與一項需要繼續尋求支持的事情。
核心經文｜加拉太書5:22–23；約翰福音15:5。
舊模式｜用癌友是否痊癒衡量自己的照顧價值。
新模式｜以尊重、照顧品質、責任分工與生命果子檢查成長。
【八大BANK｜照顧者一頁總表】
| BANK | 舊模式→新模式 | 每日最小行動 | 核心能力 |

| 01 身分更新 | 拯救者→陪伴者 | 放下一項自責 | 自我接納 |

| 03 情緒分辨 | 壓抑情緒→辨認需求 | 記錄一種情緒 | 情緒調節 |
| 04 認知更新 | 自責歸因→證據判斷 | 修正一個假設 | 認知更新 |
| 05 聖靈察驗 | 憑感覺→信仰與證據並重 | 查證一項建議 | 智慧分辨 |
| 06 愛與界線 | 獨自承擔→共同分工 | 請求一項協助 | 界線管理 |
| 07 順服行動 | 空泛安慰→具體支持 | 完成一項照顧 | 愛的實踐 |
| 08 果子驗證 | 只看病情→觀察長期品格 | 記錄一項生命果子 | 持續更新 |

【14天照顧系統回饋】

當我不知道如何選擇，求祢賜給我智慧，幫助我尊重醫療專業，也尊重癌友的意願。

願祢賜給我們仁愛、忍耐、溫柔與信實，使我們在困難中仍然懂得彼此珍惜。
奉主耶穌基督的名禱告，阿們。
【最終生命金句】
**照顧癌友，不是用自己的生命換取另一個人的痊癒，而是在神的恩典中，用智慧守護生命、用界線保護愛、用陪伴減少孤單、用共同承擔讓關懷可以持續。**

33｜當身體允許，我願意做一件小小的好事，讓愛繼續從我的生命流出去。（加拉太書6:10）
34｜今天即使只能完成一件小事，我仍然可以感謝自己沒有放棄照顧生命。（撒迦利亞書4:10）
35｜我不必用過度努力證明信心，懂得休息、求助與接受照顧，也是一種智慧。（馬太福音11:28）
【BANK08｜生命果子驗證：疾病之中仍能活出愛與盼望】
36｜即使身體正在經歷艱難，我的生命仍然可以長出仁愛、溫柔與信實的果子。（加拉太書5:22–23）
37｜真正的平安不是所有檢查都正常，而是我在不確定中仍能尋得安慰與支持。（約翰福音14:27）
38｜忍耐不是默默承受所有痛苦，而是在需要時勇敢求助，並一步一步走下去。（羅馬書12:12）
39｜我的生命是否有意義，不取決於疾病是否完全消失，而在於我始終是值得被愛的人。（羅馬書8:38–39）
40｜無論未來的路有多長、多難，今天我仍願意相信：神的愛沒有離開我，我的生命仍然值得珍惜。（詩篇23:4）
【給癌友最重要的五個提醒】
01｜你可以害怕，不需要假裝勇敢。
02｜你可以哭泣，不需要強迫自己快樂。
03｜你可以接受治療，不需要在醫療與信仰之間二選一。
04｜你可以需要別人，不需要獨自承擔所有痛苦。
05｜你可以不知道明天會怎樣，但今天仍然值得被溫柔對待。
【給癌友的祝福禱告】
親愛的天父，當疾病讓我害怕，求祢賜給我安慰。
當治療讓我疲憊，求祢幫助我得到適當的休息與照顧。
當未來充滿未知，求祢賜給我智慧，讓我與醫療團隊作出合宜的選擇。
當我感到孤單，求祢讓我知道，我仍然值得被愛，也可以向人求助。
無論治療的結果如何，願祢的恩典陪伴我，讓我在每一天都能找到值得珍惜的光。
奉主耶穌基督的名禱告，阿們。
【生命更新核心金句】
**癌症可能改變生命的道路，卻不能決定生命的價值；信心不是保證疾病消失，而是在不確定的日子裡，仍然知道自己被神所愛。**
註｜以上40句為依基督信仰與相關經文主題創作的鼓勵文字，並非聖經逐字引文；所附經文供延伸閱讀與默想。

<script type="text/plain" id="t-bank2">
# 基督生命更新OS｜八大BANK完整實踐框架
【核心公式】
神的恩典→身分更新→價值重整→情緒辨識→認知修正→聖靈察驗→愛與界線→順服行動→生命果子→持續成聖。
八大BANK不是八個獨立課程，而是一個彼此連動、可以持續更新的生命成長系統。
【BANK01｜身分更新】
本體｜我的價值不由成敗或他人的評價決定。
結構｜自我認識、歸屬感、尊嚴、責任、使命。
機制｜舊身分信念會影響情緒、選擇與行為。
核心經文｜哥林多後書5:17；以弗所書2:8–10。
智慧01｜失敗是事件，不是身分。
智慧02｜被拒絕不等於沒有價值。
智慧03｜能力不足可以學習，不必否定整個自己。
智慧04｜神的恩典不是逃避責任的理由。
智慧05｜真正的謙卑是承認有限，也願意成長。
舊模式｜我必須表現很好，才值得被愛。
新模式｜我有生命尊嚴，因此願意學習與負責。
最小行動｜寫下今天一個自我否定的念頭，改成符合事實與信仰的表達。
驗證指標｜面對失敗後，是否更快恢復行動能力。
【BANK02｜價值權重】
本體｜有限的時間與注意力，需要依重要價值分配。
結構｜信仰、健康、家庭、責任、工作、財務、服事。
機制｜價值排序決定資源分配，資源分配影響生命方向。
核心經文｜馬太福音6:33；馬太福音22:37–40。
智慧01｜忙碌不等於忠心。
智慧02｜重要的事不一定最緊急。
智慧03｜不能用討好所有人證明愛心。
智慧04｜真正的優先順序會反映在時間分配。
智慧05｜拒絕次要事項，才能保護重要責任。
舊模式｜誰要求最多，我就先滿足誰。
新模式｜根據真理、責任、風險與長期價值排序。
最小行動｜每天選出三件最重要的事情。
驗證指標｜三件重要任務的完成率。
【BANK03｜情緒分辨】
本體｜情緒是需要理解的訊號，不是必須服從的命令。
結構｜事件、感受、身體反應、需求、信念、行為。
機制｜事件經過個人解釋，可能引發不同情緒與反應。
核心經文｜以弗所書4:26；雅各書1:19。
智慧01｜生氣不等於必須攻擊。
智慧02｜害怕不代表危險一定會發生。
智慧03｜悲傷不代表信心不足。
智慧04｜嫉妒可能提醒自己正在比較。
智慧05｜情緒需要被理解，行為仍需要負責。
舊模式｜我不舒服，所以一定是別人的錯。
新模式｜我先辨認感受，再檢查原因與選擇。
最小行動｜寫下事件、情緒、需求及一個合宜回應。
驗證指標｜衝動反應次數與恢復平靜所需時間。
【BANK04｜認知模型更新】
本體｜人的判斷可能不完整，需要接受真理與事實檢驗。
結構｜資訊、假設、解釋、預測、證據、修正。
機制｜新證據與原先預測不符時，重新檢查認知模型。
核心經文｜羅馬書12:2；箴言18:13。
智慧01｜我相信的事情不一定都是事實。
智慧02｜一次失敗不能預測整個未來。
智慧03｜他人的行為不一定是針對我。
智慧04｜願意承認錯誤，是智慧的表現。
智慧05｜不能用舊經驗否定所有新可能。
舊模式｜我一直都是這樣，所以不可能改變。
新模式｜我可以根據新證據與真理修正判斷。
最小行動｜找出一個自動化想法，列出支持與反對證據。
驗證指標｜錯誤歸因減少，決策品質改善。
【BANK05｜聖靈感動察驗】
本體｜基督信仰相信聖靈引導信徒，但人的主觀感受需要分辨。
結構｜聖經、基督榜樣、禱告、良心、事實、群體智慧、生命果子。
機制｜將內心念頭與信仰原則、現實責任及長期結果交叉檢查。
核心經文｜約翰一書4:1；帖撒羅尼迦前書5:21。
智慧01｜強烈感動不等於一定正確。
智慧02｜真正的分辨需要謙卑與耐心。
智慧03｜不能以神的旨意要求別人放棄自主權。
智慧04｜禱告與查證事實可以同時進行。
智慧05｜屬靈成熟需要觀察長期品格，而不只是特殊經驗。
舊模式｜我有感動，所以不需要別人提醒。
新模式｜我願意禱告、查證、聆聽與察驗。
最小行動｜對一個重要念頭檢查聖經、事實、責任與可能後果。
驗證指標｜衝動決策減少，判斷更加負責任。
【BANK06｜愛與界線】
本體｜愛包含尊重、誠實、公義與責任，不等於無限制滿足要求。
結構｜同理心、尊嚴、責任歸屬、界線、溝通、後果。
機制｜清楚的界線可以降低不合理消耗，增加關係中的可預測性。
核心經文｜以弗所書4:15；加拉太書6:2、6:5。
智慧01｜愛人不等於替人承擔所有後果。
智慧02｜饒恕不等於允許傷害持續。
智慧03｜幫助別人也需要考慮自己的能力。
智慧04｜尊重別人，不代表放棄原則。
智慧05｜真正的關懷會幫助對方建立責任能力。
舊模式｜拒絕別人就是沒有愛心。
新模式｜我可以溫柔而堅定地設定界線。
最小行動｜針對一件不合理要求，說明自己的界線與可提供的協助。
驗證指標｜重複衝突與過度承擔的情況是否減少。
【BANK07｜順服行動】
本體｜信仰不只是理解真理，也包含在生活中實踐。
結構｜信念、目標、最小行動、環境設計、習慣、回饋。
機制｜透過重複且符合價值的行動，逐漸建立穩定習慣。
核心經文｜雅各書1:22；約翰福音14:15。
智慧01｜知道不等於做到。
智慧02｜行動不必很大，但必須具體。
智慧03｜忠心可以從小事開始。
智慧04｜服事不只是付出，也需要智慧。
智慧05｜持續行動比短暫熱情更能建立習慣。
舊模式｜等到有感動、有時間才開始。
新模式｜先完成一個可行且負責任的行動。
最小行動｜每天完成一項具體的愛人或責任行動。
驗證指標｜行動完成率、持續天數及對他人的實際幫助。
【BANK08｜生命果子驗證】
本體｜生命成長需要從長期品格與行動觀察，而不是只看短暫情緒。
結構｜仁愛、喜樂、和平、忍耐、恩慈、良善、信實、溫柔、節制。
機制｜透過自我反省、他人回饋與真實情境，檢查生命是否逐漸成熟。
核心經文｜加拉太書5:22–23；約翰福音15:5。
智慧01｜真正的愛會尊重別人的尊嚴。
智慧02｜真正的和平不等於逃避問題。
智慧03｜真正的忍耐不等於容忍暴力。
智慧04｜真正的信實會落實在承諾與責任。
智慧05｜真正的節制是能管理自己的選擇。
舊模式｜我今天很感動，所以我已經成熟。
新模式｜我觀察長期行為，持續學習與悔改。
最小行動｜每週選擇一項聖靈果子，記錄一個真實生活例子。
驗證指標｜行為是否更穩定、關係是否更尊重、責任是否更可靠。

　↓ 我的選擇是否符合真理？

　↺ 回到BANK01～07持續修正。

# 基督信仰 × 大統一公式｜如何從舊生命更新為基督裡的新生命
【核心總綱】
01｜這張圖的核心是：生命不是只有接受資訊，而是透過認知、價值、決策、行動、回饋與更新，逐漸形成智慧。
02｜對應基督信仰：生命更新不只是學習更多聖經知識，而是讓神的話進入心思意念，透過聖靈的引導，活出基督的樣式。
03｜神學根基：生命的更新始於神的恩典與基督的救贖，而不是靠人不斷改善行為來賺取救恩。
04｜核心經文：羅馬書12:2，藉著心意更新而變化，察驗神的旨意。

07｜核心經文：以弗所書4:22–24，脫去舊人、心志改換一新、穿上新人。
08｜核心經文：約翰福音15:5，生命結果子的根基在於與基督保持連結。
09｜生命更新總公式：神的恩典→基督的救贖→神的話→聖靈引導→信念更新→價值重整→行動順服→生命結果→持續悔改與成聖。

【一｜原圖完整結構對應基督信仰】

15｜原圖最後以智慧湧現作為持續更新後的整體結果。
16｜基督信仰的轉化重點，是在原本的認知控制迴路之外，加入神學上的救恩根基、屬靈分辨、罪與悔改、恩典及聖靈的工作。

43｜智慧湧現｜舊模式：只追求知識、恩賜、成就或特殊經驗｜新模式：逐漸形成仁愛、節制、謙卑、分辨力與忠心｜經文：雅各書3:17。
44｜更新層最重要的智慧：悔改不是否定自己，而是承認舊方向有問題，重新回到更符合真理的道路。
【六｜對應你提供的36課聖靈講道】
45｜講道核心：信仰不能只停留在知道聖經，而需要讓神的話真正改變心思意念與日常生活。
46｜講道強調：認識聖靈的感動，必須以神的話、耶穌基督及十字架為根基。
47｜講道提醒：不能只因為自己有強烈感覺，就認定那一定是聖靈的帶領。
48｜講道指出：人即使熟悉許多神學知識，仍可能在家庭、工作與人際關係中缺乏實際更新。
49｜講道以夫妻溝通為例，提醒人先辨認自己的心念，不要在衝突時立即說出傷害關係的話。
50｜講道以教養孩子為例，提醒父母不能只看表面行為，也應嘗試理解孩子內心的困惑與需要。
51｜講道以工作為例，強調相同的工作可以帶著不同的生命目的去完成。
52｜講道以生活管理為例，提到適當吃飯、運動、睡眠，以及生病時接受合宜的醫療照顧。
53｜講道強調：信仰成熟不是只追求特殊的屬靈現象，而是看見心志、眼光、行動及生命果子的改變。
54｜以上是你提供的講道內容之重點整理，並非逐字引述。
【七｜聖靈更新生命的七步閉環】
55｜STEP 1｜領受真理：今天我從神的話學到什麼？
56｜STEP 2｜辨認舊我：我目前被什麼恐懼、慾望、習慣或錯誤信念牽引？
57｜STEP 3｜察驗心念：這個想法是否符合聖經、愛、公義與現實責任？
58｜STEP 4｜重新選擇：如果以基督的心為心，我可以採取什麼不同的行動？
59｜STEP 5｜實際順服：今天只選擇一個能夠完成的具體行動。
60｜STEP 6｜檢查果子：這個行動是否讓我更誠實、仁愛、節制、負責與尊重他人？
61｜STEP 7｜持續更新：若結果不理想，就重新察驗動機、方法及環境，必要時尋求屬靈同伴或專業人士協助。
62｜閉環總結：神的話→心念察驗→禱告分辨→行動順服→生命果子→悔改更新。
【八｜十二個生命領域的舊我與新人】
63｜自我價值｜舊：靠成績證明自己｜新：在神面前有尊嚴，也願意承擔成長責任。
64｜情緒管理｜舊：被情緒控制｜新：承認情緒，選擇合宜的回應。
65｜家庭關係｜舊：要求別人照我的意思改變｜新：尊重他人，也建立必要界線。
66｜親子教育｜舊：孩子犯錯就是不聽話｜新：同時理解原因、教導責任與建立合理後果。
67｜婚姻相處｜舊：為了維持和平而犧牲安全與尊嚴｜新：以愛、誠實、互相尊重及安全為原則。
68｜工作態度｜舊：只為薪水與外界評價｜新：把工作視為服務他人與實踐忠心的機會。
69｜金錢管理｜舊：被貪心、恐懼或比較牽引｜新：以節制、誠信、風險管理與慷慨管理資源。
70｜健康管理｜舊：只靠意志、補充品或單一療法｜新：重視休息、飲食、活動、醫療與身心支持。
71｜人際衝突｜舊：一定要證明自己是對的｜新：先查明事實，願意聆聽，也能堅定拒絕不合理要求。
72｜學習成長｜舊：犯錯代表自己沒有能力｜新：從錯誤中學習，持續提升理解與實踐能力。
73｜屬靈生活｜舊：只有聚會時才想到神｜新：把禱告、讀經與價值分辨融入日常生活。
74｜人生使命｜舊：只問我可以得到什麼｜新：思考神所託付的責任，以及自己可以如何造福他人。
【九｜生命更新最重要的八個槓桿節點】
75｜節點01｜身分：先認識自己在基督裡的價值，而不是讓失敗定義自己。
76｜節點02｜真理：讓聖經與可信的事實共同幫助自己辨認錯誤假設。
77｜節點03｜心念：辨認自己反覆出現的恐懼、憤怒、比較與控制慾。
78｜節點04｜權重：重新決定哪些價值值得投入最多時間與資源。
79｜節點05｜順服：把信念轉化為具體、負責任且不傷害他人的行動。
80｜節點06｜關係：從控制別人轉向管理自己的責任、溝通與界線。
81｜節點07｜果子：用長期品格與行為檢驗成長，而不是只看短暫感動。
82｜節點08｜更新：承認自己仍會犯錯，持續悔改、修正與重新開始。
【十｜14天生命更新實踐表】
83｜第01天｜身分更新：寫下三個不依賴成績、財富或他人肯定的生命價值。
84｜第02天｜信念更新：找出一個經常限制自己的舊信念。
85｜第03天｜真理察驗：尋找一段相關經文，重新思考原先的判斷。
86｜第04天｜情緒更新：在一次情緒升高時，先停下來辨認感受與需要。
87｜第05天｜語言更新：把一句批評改成清楚、尊重且具體的表達。
88｜第06天｜關係更新：關心一個人真正的處境，而不急著指導或責備。
89｜第07天｜第一週回饋：記錄一項已改善的行為與一項仍需修正的問題。
90｜第08天｜價值更新：檢查本週時間分配是否符合自己宣稱重視的價值。
91｜第09天｜責任更新：完成一件一直拖延、但確實應該承擔的工作。
92｜第10天｜界線更新：對一件不合理要求作出清楚而尊重的回應。
93｜第11天｜服事更新：主動提供一項不以回報為目的的具體幫助。
94｜第12天｜靈命更新：閱讀一段經文，寫下它對當天生活的提醒。
95｜第13天｜行動更新：把本週最重要的領悟再實踐一次。
96｜第14天｜模型更新：比較第1天與第14天的想法、行動及實際結果。
【十一｜可直接填寫的生命更新表】
97｜今天日期：＿＿＿＿。
98｜今天遇到的事件：＿＿＿＿。
99｜我的第一個情緒：＿＿＿＿。
100｜我的第一個念頭：＿＿＿＿。
101｜這個念頭背後的舊信念：＿＿＿＿。

103｜我需要查證的事實：＿＿＿＿。
104｜我可能忽略的其他解釋：＿＿＿＿。

110｜今天的感恩與禱告：＿＿＿＿。
【十二｜三個重要的神學與實踐界線】
111｜第一，聖靈不是人類認知模型中的一個演算法，基督信仰理解聖靈為具有位格的神，而不是單純的情緒或心理機制。
112｜第二，心理模型更新可以幫助理解人的學習過程，但不能取代基督救恩、恩典、悔改與成聖的神學意義。
113｜第三，內心感動需要分辨；任何以神的旨意為名的操控、傷害、暴力或要求放棄必要醫療，都不應因宗教語言而免於檢驗。
【十三｜二十句生命更新金句】
114｜神的恩典不是讓我停止成長，而是讓我有勇氣面對自己的不足。
115｜我可以承認錯誤，卻不需要把錯誤當成自己的身分。
116｜真正的悔改，不只是後悔過去，而是重新選擇方向。
117｜信仰不只是知道真理，更是讓真理改變我的生活。
118｜成熟不是永遠不生氣，而是生氣時仍能選擇不傷害人。
119｜愛不是沒有界線，而是在真理中尊重彼此。
120｜饒恕不是否認傷害，也不是放棄安全與公義。
121｜謙卑不是否定能力，而是知道自己仍需要學習。
122｜順服神不是放棄思考，而是願意讓自己的判斷接受真理檢驗。
123｜智慧不是知道所有答案，而是願意承認自己可能判斷錯誤。
124｜我不需要控制所有人，但需要為自己的選擇負責。
125｜生命的價值不是由一次成功或失敗決定。

129｜能夠接受糾正的人，才有機會突破舊習慣。
130｜知識使我理解原則，實踐使原則進入生活。
131｜今天的一個小小順服，可以成為明天穩定品格的起點。
132｜真正的生命更新，不是讓別人變成我想要的樣子，而是讓自己更像基督。
133｜自由不是任憑舊習慣支配，而是能夠在真理與愛中作出新的選擇。
【最終總結｜基督生命更新的大統一公式】
134｜神學根基：天父的恩典→基督的救贖→聖靈的內住與引導。
135｜認知結構：神的話→身分更新→價值重整→心念察驗→智慧分辨。
136｜生活輸出：情緒節制→誠實語言→負責決策→具體順服→愛人如己。
137｜更新機制：現實回饋→認罪悔改→修正錯誤→重新實踐→持續成聖。
138｜成熟果子：仁愛、喜樂、和平、忍耐、恩慈、良善、信實、溫柔、節制。
139｜最終目標：不是把自己訓練成永遠不犯錯的人，而是在恩典中持續被更新，逐漸活出基督的生命樣式。
140｜一句話總結：**以基督為根基，以神的話更新心意，以聖靈引導行動，以生命果子檢驗成長，以持續悔改完成更新閉環。**

<script>
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P='lifeos40:';
const store={get(k,d){try{const v=localStorage.getItem(P+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(P+k,JSON.stringify(v))}catch(e){}}};
const todayStr=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};

/* ---------- 解析文件 ---------- */
const DOCS=[['cg','照顧者40天'],['pt','癌友40天'],['q40','癌友40句'],['bank1','八大BANK總表'],['bank2','八大BANK框架'],['mind','生命更新心智圖'],['uni','大統一公式']].map(([id,name])=>{
  const lines=document.getElementById('t-'+id).textContent.split(/\r?\n/).map(s=>s.replace(/^[ \t]+/,'').trimEnd()).filter(Boolean);
  let title=name;const secs=[];let cur={title:'總綱',lines:[]};
  lines.forEach(l=>{
    if(l.startsWith('# ')){title=l.slice(2);return}
    const m=l.match(/^【(.+)】$/);
    if(m){if(cur.lines.length)secs.push(cur);cur={title:m[1],lines:[]};return}
    cur.lines.push(l);
  });
  if(cur.lines.length)secs.push(cur);
  return{id,name,title,secs};
});
const doc=id=>DOCS.find(d=>d.id===id);
const sec=(id,t)=>doc(id).secs.find(s=>s.title.startsWith(t));
const after=l=>l.slice(l.indexOf('｜')+1);

function parseTrack(id){
  const days=[];
  doc(id).secs.forEach(s=>{
    const bm=s.title.match(/^BANK(\d+)｜(.+?)：(.+)$/);if(!bm)return;
    const b={n:+bm[1],name:bm[2],sub:bm[3]};
    s.lines.forEach(l=>{
      const m=l.match(/^Day(\d+)｜金句：(.+?)｜行動：(.+)$/);
      if(m)days[+m[1]]={q:m[2],a:m[3],b};
      else if(l.startsWith('核心經文｜'))b.verse=after(l);
      else if(l.startsWith('舊模式｜'))b.old=after(l);
      else if(l.startsWith('新模式｜'))b.nu=after(l);
    });
  });
  const note=(doc(id).secs.flatMap(s=>s.lines).find(l=>l.startsWith('註｜'))||'').slice(2);
  return{days,note};
}
const TR={cg:parseTrack('cg'),pt:parseTrack('pt')};
const Q40=[];doc('q40').secs.forEach(s=>{if(/^BANK/.test(s.title))s.lines.forEach(l=>{const m=l.match(/^(\d+)｜(.+)（(.+?)）$/);if(m)Q40[+m[1]]={t:m[2],ref:m[3]}})});
const BV=[];sec('bank1','八大BANK對應核心經文').lines.forEach(l=>{const p=l.split('｜');BV[+p[0]]={ref:p[2],t:p[3]}});
const TIPS={cg:sec('cg','給癌友照顧者的十句核心智慧').lines.map(after),pt:sec('q40','給癌友最重要的五個提醒').lines.map(after)};
const FIELDS={cg:sec('cg','照顧者每日一分鐘回饋表').lines.slice(1),pt:sec('pt','每日一分鐘生命更新表').lines.slice(1)};
for(const k in FIELDS)FIELDS[k]=FIELDS[k].map(l=>l.split('｜')[0]);

/* ---------- 狀態 ---------- */
let T=store.get('track','cg'),tab='today',libDoc='cg';
const viewDay={};
const st=k=>store.get('st_'+k,{start:todayStr(),done:{},notes:{}});
const saveSt=(k,v)=>store.set('st_'+k,v);
function curDay(s){const n=Math.floor((new Date(todayStr())-new Date(s.start))/864e5)+1;return Math.min(40,Math.max(1,n))}

/* ---------- 文字渲染 ---------- */
let terms=[];
function fmt(l,hl){
  let h=esc(l).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  const i=h.indexOf('｜');
  if(i>0&&i<16&&!h.startsWith('<'))h='<b class="k">'+h.slice(0,i)+'</b>'+h.slice(i);
  if(hl&&terms.length)terms.forEach(t=>{h=h.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![^<]*>)','gi'),'<mark>$1</mark>')});
  return h;
}

/* ---------- 今日 ---------- */
function renderToday(){
  const s=st(T),tr=TR[T];
  if(!viewDay[T])viewDay[T]=curDay(s);
  const d=viewDay[T],x=tr.days[d],b=x.b,done=!!s.done[d];
  const doneN=Object.values(s.done).filter(Boolean).length;
  const verse=b.verse||(BV[b.n]&&BV[b.n].ref+'｜'+BV[b.n].t);
  const q=T==='pt'&&Q40[d];
  const tip=TIPS[T][(d-1)%TIPS[T].length];
  let g='';for(let i=1;i<=40;i++){const bb=tr.days[i].b.n;g+=`<button class="c${bb}${s.done[i]?' dn2':''}${i===d?' cur':''}" data-d="${i}" title="Day${i}｜${esc(tr.days[i].q)}">${i}</button>`}
  $('#v-today').innerHTML=`
  <div class="card c${b.n}">
    <div class="dayhead"><button class="nav" data-go="-1" aria-label="前一天">‹</button>
      <div class="mid"><span class="dn">Day ${String(d).padStart(2,'0')}</span><span class="muted"> / 40</span><span class="tag">BANK0${b.n} ${esc(b.name)}</span></div>
      <button class="nav" data-go="1" aria-label="後一天">›</button></div>
    <div class="sub">${esc(b.sub)}</div>
    <div class="quote">${esc(x.q)}</div>
    <label class="act${done?' done':''}"><input type="checkbox" id="chk"${done?' checked':''}><span><b>今日最小行動</b>${esc(x.a)}</span></label>
    ${q?`<div class="box"><b>延伸金句</b>　${esc(q.t)} <span class="ref">（${esc(q.ref)}）</span></div>`:''}
    <div class="box"><b>核心經文</b>　${esc(verse)}${b.old?`<br><b>舊模式</b>　${esc(b.old)}<br><b>新模式</b>　${esc(b.nu)}`:''}</div>
    <div class="box"><b>今日提醒</b>　${esc(tip)}</div>
    <textarea id="dnote" rows="2" placeholder="今日小記（自動儲存）…">${esc(s.notes[d]||'')}</textarea>
  </div>
  <div class="row"><span>完成 ${doneN}/40</span><div class="pg"><i style="width:${doneN/40*100}%"></i></div>
    <span>起始日 <input type="date" id="start" value="${s.start}"></span>
    <button class="btn" id="gotoday">回到今天（Day ${curDay(s)}）</button></div>
  <div class="grid">${g}</div>
  <p class="note">註｜${esc(tr.note)}</p>`;
}
$('#v-today').addEventListener('click',e=>{
  const go=e.target.closest('[data-go]'),gd=e.target.closest('[data-d]');
  if(go){viewDay[T]=Math.min(40,Math.max(1,viewDay[T]+ +go.dataset.go));renderToday()}
  else if(gd){viewDay[T]=+gd.dataset.d;renderToday();scrollTo({top:0,behavior:'smooth'})}
  else if(e.target.id==='gotoday'){viewDay[T]=curDay(st(T));renderToday()}
});
$('#v-today').addEventListener('change',e=>{
  const s=st(T);
  if(e.target.id==='chk'){s.done[viewDay[T]]=e.target.checked;saveSt(T,s);renderToday()}
  if(e.target.id==='start'&&e.target.value){s.start=e.target.value;saveSt(T,s);viewDay[T]=curDay(s);renderToday()}
});
$('#v-today').addEventListener('input',e=>{if(e.target.id==='dnote'){const s=st(T);s.notes[viewDay[T]]=e.target.value;saveSt(T,s)}});

/* ---------- 日記 ---------- */
let jDate=todayStr();
const jr=k=>store.get('jr_'+k,{});
function renderJournal(){
  const all=jr(T),e=all[jDate]||{};
  const dates=Object.keys(all).filter(k=>Object.values(all[k]).some(v=>v&&v.trim())).sort().reverse();
  $('#v-journal').innerHTML=`
  <div class="card">
    <div class="row" style="margin-top:0"><b style="color:var(--ink)">${T==='cg'?'照顧者每日一分鐘回饋表':'每日一分鐘生命更新表'}</b>
      <input type="date" id="jdate" value="${jDate}"><span id="saved" class="muted"></span></div>
    ${FIELDS[T].map((f,i)=>`<div class="fld"><label for="f${i}">${esc(f)}</label><textarea id="f${i}" data-f="${esc(f)}" rows="1">${esc(e[f]||'')}</textarea></div>`).join('')}
    <button class="btn" id="jclear">清除這一天</button>
  </div>
  <h2 style="margin-top:18px">過去紀錄 <span class="muted">${dates.length} 天</span></h2>
  <div class="hist">${dates.map(d=>{const v=Object.values(all[d]).find(x=>x&&x.trim())||'';return`<button data-jd="${d}" class="${d===jDate?'on':''}"><b>${d}</b>　<span class="muted">${esc(v.slice(0,40))}</span></button>`}).join('')||'<p class="muted">還沒有紀錄。</p>'}</div>
  <div class="row"><button class="btn" id="exp">匯出備份</button><label class="btn">匯入備份<input type="file" id="imp" accept=".json" hidden></label>
  <span>資料只存在這台電腦的瀏覽器裡，建議定期匯出備份。</span></div>`;
}
$('#v-journal').addEventListener('input',e=>{
  const f=e.target.dataset.f;if(!f)return;
  const all=jr(T);all[jDate]=all[jDate]||{};all[jDate][f]=e.target.value;store.set('jr_'+T,all);
  $('#saved').textContent='已儲存';
});
$('#v-journal').addEventListener('change',e=>{
  if(e.target.id==='jdate'&&e.target.value){jDate=e.target.value;renderJournal()}
  if(e.target.id==='imp'&&e.target.files[0]){
    const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);Object.keys(o).forEach(k=>{if(k.startsWith(P))localStorage.setItem(k,o[k])});alert('匯入完成');renderAll()}catch(err){alert('檔案格式不正確')}};r.readAsText(e.target.files[0]);
  }
});
$('#v-journal').addEventListener('click',e=>{
  const h=e.target.closest('[data-jd]');
  if(h){jDate=h.dataset.jd;renderJournal();scrollTo({top:0,behavior:'smooth'})}
  if(e.target.id==='jclear'&&confirm('確定清除 '+jDate+' 的紀錄？')){const all=jr(T);delete all[jDate];store.set('jr_'+T,all);renderJournal()}
  if(e.target.id==='exp'){
    const o={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(P))o[k]=localStorage.getItem(k)}}catch(err){}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'}));
    a.download='40天生命更新備份-'+todayStr()+'.json';a.click();
  }
});

/* ---------- 文庫 ---------- */
function linesHtml(d,si,lines,hl){
  let h='',tb=null;
  const flush=()=>{if(tb){h+='<table>'+tb.map((r,i)=>'<tr>'+r.map(c=>i?`<td>${fmt(c,hl)}</td>`:`<th>${fmt(c,hl)}</th>`).join('')+'</tr>').join('')+'</table>';tb=null}};
  lines.forEach((l,i)=>{
    if(l.startsWith('|')){if(/^\|[-\s|]+\|$/.test(l))return;(tb=tb||[]).push(l.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));return}
    flush();
    h+=`<div class="ln${/^　*[↓↺├│└]/.test(l)&&!l.includes('｜')?' flow':''}" id="L_${d}_${si}_${i}">${fmt(l,hl)}</div>`;
  });
  flush();return h;
}
function renderLib(){
  const D=doc(libDoc);
  $('#v-lib').innerHTML=`<div class="chips">${DOCS.map(d=>`<button data-doc="${d.id}" class="${d.id===libDoc?'on':''}">${d.name}</button>`).join('')}</div>
  <h2>${esc(D.title)}</h2>
  <div class="row" style="margin-top:0"><button class="btn" id="openall">全部展開</button><button class="btn" id="closeall">全部收合</button></div>
  ${D.secs.map((s,i)=>`<details${i===0?' open':''} id="S_${D.id}_${i}"><summary>${esc(s.title)}</summary><div class="sec">${linesHtml(D.id,i,s.lines)}</div></details>`).join('')}`;
}
$('#v-lib').addEventListener('click',e=>{
  const c=e.target.closest('[data-doc]');
  if(c){libDoc=c.dataset.doc;renderLib()}
  if(e.target.id==='openall')document.querySelectorAll('#v-lib details').forEach(d=>d.open=true);
  if(e.target.id==='closeall')document.querySelectorAll('#v-lib details').forEach(d=>d.open=false);
});

/* ---------- 搜尋 ---------- */
function runSearch(){
  const q=$('#q').value.trim();
  terms=q?q.split(/\s+/):[];
  if(!q){$('#v-results').classList.add('hide');show(tab);return}
  ['today','journal','lib'].forEach(v=>$('#v-'+v).classList.add('hide'));
  const low=terms.map(t=>t.toLowerCase());
  const hit=s=>low.every(t=>s.toLowerCase().includes(t));
  const res=[];
  DOCS.forEach(D=>D.secs.forEach((s,si)=>s.lines.forEach((l,i)=>{if(hit(l))res.push({src:D.name+' · '+s.title,l,a:`data-doc="${D.id}" data-s="${si}" data-i="${i}"`})})));
  ['cg','pt'].forEach(k=>{const all=jr(k);Object.keys(all).sort().reverse().forEach(d=>Object.entries(all[d]).forEach(([f,v])=>{if(v&&hit(f+' '+v))res.push({src:'日記（'+(k==='cg'?'照顧者':'癌友')+'）· '+d,l:f+'｜'+v,a:`data-jk="${k}" data-jd="${d}"`})}))});
  $('#v-results').innerHTML=`<p class="muted">找到 ${res.length} 筆${res.length>300?'（顯示前 300 筆）':''}　·　按 Esc 清除</p>`+
    res.slice(0,300).map(r=>`<div class="res" ${r.a}><div class="src">${esc(r.src)}</div><div>${fmt(r.l,true)}</div></div>`).join('')||'';
  $('#v-results').classList.remove('hide');
}
let tmr;$('#q').addEventListener('input',()=>{clearTimeout(tmr);tmr=setTimeout(runSearch,150)});
$('#v-results').addEventListener('click',e=>{
  const r=e.target.closest('.res');if(!r)return;
  $('#q').value='';terms=[];$('#v-results').classList.add('hide');
  if(r.dataset.jk){T=r.dataset.jk;store.set('track',T);jDate=r.dataset.jd;setTrackBtn();show('journal');return}
  libDoc=r.dataset.doc;show('lib');
  const det=document.getElementById(`S_${libDoc}_${r.dataset.s}`);det.open=true;
  const ln=document.getElementById(`L_${libDoc}_${r.dataset.s}_${r.dataset.i}`);
  ln.scrollIntoView({block:'center'});ln.classList.add('flash');setTimeout(()=>ln.classList.remove('flash'),1800);
});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}
  if(e.key==='Escape'&&$('#q').value){$('#q').value='';runSearch()}
});

/* ---------- 切換 ---------- */
function show(t){
  tab=t;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  ['today','journal','lib'].forEach(v=>$('#v-'+v).classList.toggle('hide',v!==t));
  $('#trk').style.visibility=t==='lib'?'hidden':'visible';
  ({today:renderToday,journal:renderJournal,lib:renderLib})[t]();
}
function setTrackBtn(){document.querySelectorAll('#trk button').forEach(b=>b.classList.toggle('on',b.dataset.k===T))}
function renderAll(){setTrackBtn();show(tab)}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$('#q').value='';terms=[];$('#v-results').classList.add('hide');show(b.dataset.t)});
$('#trk').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;T=b.dataset.k;store.set('track',T);libDoc=T;renderAll()});
renderAll();
</script>
</body>
</html>
