<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>學測字根字綴 — 高密度學習站</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080C14;--surface:#0F1623;--card:#161F30;--border:#1E2D45;
  --text:#E8EDF5;--muted:#6B80A0;--gold:#F0C040;--gold2:#D4A020;
  --correct:#34D399;--wrong:#F87171;--accent:#5B9BD5;
  --root-color:#FF7F50;--pre-color:#7B68EE;--suf-color:#3CB371;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk','Noto Sans TC',sans-serif;min-height:100vh;overflow-x:hidden;}

/* HEADER */
.header{background:linear-gradient(135deg,var(--bg),var(--surface));border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);}
.logo-mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#080C14;flex-shrink:0;}
.logo-text{font-size:17px;font-weight:700;color:var(--text);}
.logo-sub{font-size:11px;color:var(--muted);}
.hstats{margin-left:auto;display:flex;gap:12px;}
.hpill{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--muted);}
.hpill b{color:var(--gold);}

/* NAV */
.nav{display:flex;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
.nav::-webkit-scrollbar{display:none;}
.nb{flex:none;padding:12px 18px;font-size:13px;font-weight:600;border:none;background:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:.2s;white-space:nowrap;font-family:inherit;}
.nb.on{color:var(--gold);border-bottom-color:var(--gold);}
.nb:hover:not(.on){color:var(--text);}

/* PAGES */
.page{display:none;padding:20px;max-width:1000px;margin:0 auto;}
.page.on{display:block;}

/* SECTION TITLE */
.stitle{font-size:18px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.dot{width:8px;height:8px;border-radius:50%;}

/* CATEGORY TABS */
.catbar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.catbtn{padding:8px 18px;border-radius:8px;font-size:13px;font-weight:600;border:1.5px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:.2s;font-family:inherit;}
.catbtn.on{color:#080C14;border-color:transparent;}
.catbtn.root.on{background:var(--root-color);}
.catbtn.pre.on{background:var(--pre-color);}
.catbtn.suf.on{background:var(--suf-color);}

/* BROWSE */
.unit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:24px;}
.ucard{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:.2s;position:relative;}
.ucard:hover,.ucard.sel{border-color:var(--gold);}
.ucard.sel{box-shadow:0 0 14px rgba(240,192,64,.18);}
.uc-label{font-size:16px;font-weight:700;margin-bottom:3px;}
.uc-mean{font-size:11px;color:var(--muted);}
.uc-ex{font-size:10px;margin-top:6px;color:var(--text);opacity:.7;}
.uc-bar{height:3px;background:var(--border);border-radius:2px;margin-top:8px;}
.uc-fill{height:100%;border-radius:2px;transition:.4s;}
.uc-n{font-size:10px;color:var(--muted);margin-top:4px;}

.word-table{width:100%;border-collapse:collapse;}
.word-table th{background:var(--surface);color:var(--muted);font-size:11px;font-weight:600;padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.5px;}
.word-table td{padding:11px 12px;border-bottom:1px solid rgba(30,45,69,.5);font-size:14px;vertical-align:middle;}
.word-table tr:hover td{background:rgba(240,192,64,.03);}
.td-word{font-weight:600;}
.td-ipa{font-size:11px;color:var(--muted);font-style:italic;}
.td-zh{color:var(--gold);font-size:13px;}

/* FLASHCARD */
.fc-wrap{perspective:1100px;max-width:480px;margin:0 auto;}
.fc{width:100%;height:280px;position:relative;transform-style:preserve-3d;transition:.5s cubic-bezier(.4,0,.2,1);cursor:pointer;}
.fc.flip{transform:rotateY(180deg);}
.fc-face{position:absolute;inset:0;border-radius:18px;padding:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;text-align:center;border:1px solid var(--border);}
.fc-front{background:var(--card);}
.fc-back{background:linear-gradient(135deg,var(--card),#1A2A40);transform:rotateY(180deg);}
.fc-badge{font-size:11px;font-weight:700;border-radius:6px;padding:3px 10px;margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px;}
.fc-word{font-size:44px;font-weight:700;letter-spacing:-1.5px;margin-bottom:6px;}
.fc-ipa{font-size:14px;color:var(--muted);font-style:italic;margin-bottom:10px;}
.fc-hint{font-size:12px;color:var(--muted);}
.fc-zh{font-size:22px;font-weight:600;color:var(--gold);margin-bottom:14px;}
.fc-examples{display:flex;flex-direction:column;gap:6px;width:100%;}
.fc-ex{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:8px 12px;font-size:13px;text-align:left;}
.fc-ex b{color:var(--accent);}
.pbar{height:5px;background:var(--border);border-radius:3px;margin-bottom:14px;}
.pbar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:3px;transition:.4s;}
.fc-counter{font-size:12px;color:var(--muted);text-align:center;margin-bottom:14px;}
.fc-btns{display:flex;gap:10px;justify-content:center;margin-top:16px;display:none;}
.btn{padding:10px 22px;border-radius:9px;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:inherit;transition:.2s;}
.btn-gold{background:var(--gold);color:#080C14;}
.btn-gold:hover{background:var(--gold2);}
.btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold);}
.btn-ok{background:rgba(52,211,153,.15);color:var(--correct);border:1px solid var(--correct);}
.btn-bad{background:rgba(248,113,113,.15);color:var(--wrong);border:1px solid var(--wrong);}
.btn-ok:hover{background:rgba(52,211,153,.28);}
.btn-bad:hover{background:rgba(248,113,113,.28);}
.fc-hint-tap{font-size:11px;color:var(--muted);text-align:center;margin-top:8px;}
.sbar{display:flex;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px 16px;margin-bottom:18px;align-items:center;flex-wrap:wrap;}
.sb-item{display:flex;flex-direction:column;align-items:center;gap:1px;}
.sb-lbl{font-size:11px;color:var(--muted);}
.sb-val{font-size:20px;font-weight:700;color:var(--gold);}
.ml-auto{margin-left:auto;}

/* QUIZ */
.qz-type{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:3px 10px;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;background:rgba(91,155,213,.15);color:var(--accent);}
.qz-q{font-size:21px;font-weight:700;text-align:center;margin-bottom:6px;line-height:1.4;}
.qz-ipa{font-size:13px;color:var(--muted);text-align:center;margin-bottom:24px;font-style:italic;}
.qz-opts{display:grid;gap:9px;}
.qz-opt{background:var(--card);border:1.5px solid var(--border);border-radius:11px;padding:14px 18px;font-size:14px;cursor:pointer;text-align:left;color:var(--text);font-family:inherit;transition:.2s;}
.qz-opt:hover:not(:disabled){border-color:var(--gold);background:rgba(240,192,64,.05);}
.qz-opt.ok{border-color:var(--correct);background:rgba(52,211,153,.1);color:var(--correct);}
.qz-opt.bad{border-color:var(--wrong);background:rgba(248,113,113,.1);color:var(--wrong);}
.qz-explain{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:14px 16px;margin-top:14px;font-size:14px;line-height:1.6;display:none;}
.qz-explain.show{display:block;}
.qz-explain b{color:var(--gold);}
.qz-next{text-align:center;margin-top:14px;display:none;}

/* DRILL */
.drill-q{font-size:20px;font-weight:600;text-align:center;line-height:1.7;margin-bottom:20px;}
.blank-word{display:inline-block;min-width:100px;border-bottom:2px solid var(--gold);text-align:center;padding:0 4px;color:var(--gold);cursor:default;}
.drill-opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px;}
.drill-opt{background:var(--card);border:1.5px solid var(--border);border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;color:var(--text);font-family:inherit;transition:.2s;}
.drill-opt:hover{border-color:var(--gold);}
.drill-opt.ok{border-color:var(--correct);background:rgba(52,211,153,.1);color:var(--correct);}
.drill-opt.bad{border-color:var(--wrong);background:rgba(248,113,113,.1);color:var(--wrong);}

/* RESULT */
.result{text-align:center;padding:36px;background:var(--card);border-radius:18px;border:1px solid var(--border);}
.result-score{font-size:60px;font-weight:700;color:var(--gold);}
.result-stars{font-size:34px;letter-spacing:4px;margin-bottom:8px;}
.result-msg{font-size:16px;color:var(--muted);margin-bottom:20px;}

/* MAP */
.map-section{margin-bottom:28px;}
.map-title{font-size:14px;font-weight:700;margin-bottom:10px;padding:8px 14px;border-radius:8px;display:inline-block;}
.map-grid{display:flex;flex-wrap:wrap;gap:8px;}
.map-chip{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 13px;font-size:13px;cursor:pointer;transition:.2s;color:var(--text);}
.map-chip:hover{border-color:var(--gold);transform:translateY(-1px);}
.map-chip b{font-size:14px;}
.map-chip span{font-size:10px;color:var(--muted);display:block;margin-top:2px;}

/* OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;align-items:center;justify-content:center;padding:16px;}
.overlay.on{display:flex;}
.overlay-box{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px;max-width:580px;width:100%;max-height:80vh;overflow-y:auto;}
.ob-title{font-size:16px;font-weight:700;margin-bottom:16px;}
.sel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;}
.sel-card{background:var(--card);border:1.5px solid var(--border);border-radius:9px;padding:10px 12px;cursor:pointer;transition:.2s;}
.sel-card.on{border-color:var(--gold);}
.sel-card:hover{border-color:var(--gold);}
.sc-label{font-size:13px;font-weight:700;}
.sc-sub{font-size:10px;color:var(--muted);}

/* COMBO */
.combo{display:none;position:fixed;top:74px;right:16px;background:var(--gold);color:#080C14;font-weight:700;font-size:14px;border-radius:10px;padding:7px 14px;z-index:300;animation:pop .5s ease;}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}

@media(max-width:560px){
  .unit-grid{grid-template-columns:repeat(2,1fr);}
  .fc-word{font-size:32px;}
  .fc{height:250px;}
}
</style>
</head>
<body>

<div class="header">
  <div class="logo-mark">字</div>
  <div><div class="logo-text">學測字根字綴站</div><div class="logo-sub">100字根 · 51前綴 · 49後綴 · 600+單字</div></div>
  <div class="hstats">
    <div class="hpill">練習 <b id="hdStudied">0</b></div>
    <div class="hpill">連線 <b id="hdStreak">0</b>天</div>
  </div>
</div>

<div class="nav">
  <button class="nb on" onclick="gotoPage('map',this)">🗺 總覽地圖</button>
  <button class="nb" onclick="gotoPage('browse',this)">📖 單元瀏覽</button>
  <button class="nb" onclick="gotoPage('flash',this)">🃏 閃卡練習</button>
  <button class="nb" onclick="gotoPage('quiz',this)">🧠 四選一測驗</button>
  <button class="nb" onclick="gotoPage('drill',this)">✍️ 填空練習</button>
  <button class="nb" onclick="gotoPage('prog',this)">📊 學習進度</button>
</div>

<div id="comboBadge" class="combo"></div>

<!-- ===== MAP ===== -->
<div class="page on" id="page-map">
  <div class="stitle"><span class="dot" style="background:var(--root-color)"></span>字根總覽（100個）</div>
  <div id="mapRoot"></div>
  <div class="stitle" style="margin-top:24px;"><span class="dot" style="background:var(--pre-color)"></span>前綴總覽（51個）</div>
  <div id="mapPre"></div>
  <div class="stitle" style="margin-top:24px;"><span class="dot" style="background:var(--suf-color)"></span>後綴總覽（49個）</div>
  <div id="mapSuf"></div>
</div>

<!-- ===== BROWSE ===== -->
<div class="page" id="page-browse">
  <div class="catbar">
    <button class="catbtn root on" onclick="setBrowseCat('root',this)">🟥 字根</button>
    <button class="catbtn pre" onclick="setBrowseCat('pre',this)">🟦 前綴</button>
    <button class="catbtn suf" onclick="setBrowseCat('suf',this)">🟩 後綴</button>
  </div>
  <div class="unit-grid" id="browseGrid"></div>
  <div id="browseDetail"></div>
</div>

<!-- ===== FLASH ===== -->
<div class="page" id="page-flash">
  <div class="sbar">
    <div class="sb-item"><div class="sb-lbl">已看</div><div class="sb-val" id="fcSeen">0</div></div>
    <div class="sb-item"><div class="sb-lbl">✅ 會了</div><div class="sb-val" id="fcOK">0</div></div>
    <div class="sb-item"><div class="sb-lbl">❌ 再看</div><div class="sb-val" id="fcNG">0</div></div>
    <div class="ml-auto" style="display:flex;gap:7px;">
      <button class="btn btn-ghost" style="padding:7px 12px;font-size:12px;" onclick="openSel('fc')">選單元</button>
      <button class="btn btn-ghost" style="padding:7px 12px;font-size:12px;" onclick="startFC()">🔀 洗牌</button>
    </div>
  </div>
  <div class="pbar"><div class="pbar-fill" id="fcBar"></div></div>
  <div class="fc-counter" id="fcCtr">點擊卡片翻面</div>
  <div class="fc-wrap">
    <div class="fc" id="fcCard" onclick="flipFC()">
      <div class="fc-face fc-front">
        <div class="fc-badge" id="fcBadge" style="background:rgba(240,192,64,.12);color:var(--gold)"></div>
        <div class="fc-word" id="fcWord">—</div>
        <div class="fc-ipa" id="fcIpa"></div>
        <div class="fc-hint">點擊翻面 → 看中文 + 例字</div>
      </div>
      <div class="fc-face fc-back">
        <div class="fc-badge" id="fcBadge2" style="background:rgba(240,192,64,.12);color:var(--gold)"></div>
        <div style="font-size:22px;font-weight:700;margin-bottom:2px;" id="fcWord2"></div>
        <div class="fc-zh" id="fcZh"></div>
        <div class="fc-examples" id="fcExamples"></div>
      </div>
    </div>
  </div>
  <div class="fc-hint-tap">翻面後選擇 ✅ 記得 / ❌ 再看</div>
  <div class="fc-btns" id="fcBtns">
    <button class="btn btn-bad" onclick="markFC(false)">❌ 再看</button>
    <button class="btn btn-ghost" onclick="skipFC()">⏭ 跳</button>
    <button class="btn btn-ok" onclick="markFC(true)">✅ 記得</button>
  </div>
  <div id="fcResult" style="display:none;margin-top:28px;">
    <div class="result">
      <div class="result-stars" id="fcStars"></div>
      <div class="result-score" id="fcScore"></div>
      <div class="result-msg" id="fcMsg"></div>
      <button class="btn btn-gold" onclick="startFC()" style="margin-top:14px;">再來一輪</button>
    </div>
  </div>
</div>

<!-- ===== QUIZ ===== -->
<div class="page" id="page-quiz">
  <div class="sbar">
    <div class="sb-item"><div class="sb-lbl">第</div><div class="sb-val" id="qzN">1</div></div>
    <div class="sb-item"><div class="sb-lbl">✅</div><div class="sb-val" id="qzOK">0</div></div>
    <div class="sb-item"><div class="sb-lbl">❌</div><div class="sb-val" id="qzNG">0</div></div>
    <div class="ml-auto" style="display:flex;gap:7px;">
      <button class="btn btn-ghost" style="padding:7px 12px;font-size:12px;" onclick="openSel('qz')">選單元</button>
      <button class="btn btn-gold" style="padding:7px 12px;font-size:12px;" onclick="startQuiz()">重開</button>
    </div>
  </div>
  <div class="pbar"><div class="pbar-fill" id="qzBar"></div></div>
  <div id="quizArea">
    <div class="qz-type" id="qzType">中翻英</div>
    <div class="qz-q" id="qzQ"></div>
    <div class="qz-ipa" id="qzIpa"></div>
    <div class="qz-opts" id="qzOpts"></div>
    <div class="qz-explain" id="qzExplain"></div>
    <div class="qz-next" id="qzNext"><button class="btn btn-gold" onclick="nextQuiz()">下一題 →</button></div>
  </div>
  <div id="quizResult" style="display:none;margin-top:28px;">
    <div class="result">
      <div class="result-stars" id="qzStars"></div>
      <div class="result-score" id="qzScore"></div>
      <div class="result-msg" id="qzMsg"></div>
      <button class="btn btn-gold" onclick="startQuiz()" style="margin-top:14px;">再測一次</button>
    </div>
  </div>
</div>

<!-- ===== DRILL ===== -->
<div class="page" id="page-drill">
  <div class="sbar">
    <div class="sb-item"><div class="sb-lbl">第</div><div class="sb-val" id="drN">1</div></div>
    <div class="sb-item"><div class="sb-lbl">✅</div><div class="sb-val" id="drOK">0</div></div>
    <div class="sb-item"><div class="sb-lbl">❌</div><div class="sb-val" id="drNG">0</div></div>
    <div class="ml-auto"><button class="btn btn-gold" style="padding:7px 12px;font-size:12px;" onclick="startDrill()">重開</button></div>
  </div>
  <div class="pbar"><div class="pbar-fill" id="drBar"></div></div>
  <div id="drillArea">
    <div class="qz-type">字根填空</div>
    <div class="drill-q" id="drQ"></div>
    <div class="drill-opts" id="drOpts"></div>
    <div class="qz-explain" id="drExplain"></div>
    <div class="qz-next" id="drNext"><button class="btn btn-gold" onclick="nextDrill()">下一題 →</button></div>
  </div>
  <div id="drillResult" style="display:none;margin-top:28px;">
    <div class="result">
      <div class="result-stars" id="drStars"></div>
      <div class="result-score" id="drScore"></div>
      <div class="result-msg" id="drMsg"></div>
      <button class="btn btn-gold" onclick="startDrill()" style="margin-top:14px;">再練一次</button>
    </div>
  </div>
</div>

<!-- ===== PROGRESS ===== -->
<div class="page" id="page-prog">
  <div class="stitle"><span class="dot" style="background:var(--gold)"></span>學習進度</div>
  <div id="progContent"></div>
</div>

<!-- OVERLAY -->
<div class="overlay" id="selOverlay" onclick="closeOverlay(event)">
  <div class="overlay-box">
    <div class="ob-title">選擇要練習的單元</div>
    <div style="display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap;">
      <button class="btn btn-gold" style="padding:6px 12px;font-size:12px;" onclick="selAll()">全選</button>
      <button class="btn btn-ghost" style="padding:6px 12px;font-size:12px;" onclick="selNone()">清空</button>
      <button class="btn btn-ghost" style="padding:6px 12px;font-size:12px;" onclick="selCat('root')" id="selRootBtn">僅字根</button>
      <button class="btn btn-ghost" style="padding:6px 12px;font-size:12px;" onclick="selCat('pre')" id="selPreBtn">僅前綴</button>
      <button class="btn btn-ghost" style="padding:6px 12px;font-size:12px;" onclick="selCat('suf')" id="selSufBtn">僅後綴</button>
    </div>
    <div class="sel-grid" id="selGrid"></div>
    <div style="text-align:center;margin-top:16px;"><button class="btn btn-gold" onclick="applySelection()">確認</button></div>
  </div>
</div>

<script>
// ============================================================
// DATA
// ============================================================
const UNITS = [
// --- ROOTS ---
{id:"act",type:"root",label:"act",ipa:"/ækt/",mean:"行動",color:"#FF7F50",words:[
  {w:"act",ipa:"/ækt/",zh:"行動",ex:["act of kindness"]},
  {w:"action",ipa:"/ˈæk.ʃən/",zh:"行為",ex:["take action"]},

// ============================================================
// STATE
// ============================================================
let S = {
  sel: UNITS.map(u=>u.id),
  browseCat:'root', browseUnit: null,
  fcWords:[], fcIdx:0, fcOK:0, fcNG:0, fcFlipped:false,
  qzWords:[], qzIdx:0, qzOK:0, qzNG:0, qzAns:false,
  drWords:[], drIdx:0, drOK:0, drNG:0, drAns:false,
  prog:{}, studied:0, streak:0,
  _selFor:'fc',
};
function loadS(){try{const d=JSON.parse(localStorage.getItem('roots_s')||'{}');S.prog=d.prog||{};S.studied=d.studied||0;S.streak=d.streak||0;}catch{}}
function saveS(){localStorage.setItem('roots_s',JSON.stringify({prog:S.prog,studied:S.studied,streak:S.streak}));}

window.onload=()=>{
  loadS();
  buildMap();
  setBrowseCat('root',document.querySelector('.catbtn.root'));
  startFC(); startQuiz(); startDrill();
  updateHdr();
};

function updateHdr(){
  document.getElementById('hdStudied').textContent=S.studied;
  document.getElementById('hdStreak').textContent=S.streak;
}

// ============================================================
// NAV
// ============================================================
function gotoPage(id, btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  document.getElementById('page-'+id).classList.add('on');
  btn.classList.add('on');
  if(id==='prog') renderProg();
}

// ============================================================
// MAP
// ============================================================
function buildMap(){
  const cats = {root:'mapRoot', pre:'mapPre', suf:'mapSuf'};
  Object.entries(cats).forEach(([cat,divId])=>{
    const d = document.getElementById(divId);
    d.innerHTML = `<div class="map-grid">${UNITS.filter(u=>u.type===cat).map(u=>
      `<div class="map-chip" onclick="gotoUnit('${u.id}')" style="border-color:${u.color}33;">
        <b style="color:${u.color}">${u.label}</b>
        <span>${u.mean}</span>
      </div>`).join('')}</div>`;
  });
}
function gotoUnit(id){
  const u = UNITS.find(x=>x.id===id);
  if(!u) return;
  document.querySelectorAll('.nb')[1].click();
  setBrowseCat(u.type, document.querySelector(`.catbtn.${u.type}`));
  setTimeout(()=>selectUnit(id), 50);
}

// ============================================================
// BROWSE
// ============================================================
function setBrowseCat(cat, btn){
  S.browseCat=cat;
  document.querySelectorAll('.catbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderBrowseGrid();
}
function renderBrowseGrid(){
  const units = UNITS.filter(u=>u.type===S.browseCat);
  document.getElementById('browseGrid').innerHTML = units.map(u=>{
    const kn = u.words.filter(w=>(S.prog[u.id+'_'+w.w]||{}).known).length;
    const pct = Math.round(kn/u.words.length*100);
    return `<div class="ucard${S.browseUnit===u.id?' sel':''}" onclick="selectUnit('${u.id}')" id="uc-${u.id}">
      <div class="uc-label" style="color:${u.color}">${u.label}</div>
      <div class="uc-mean">${u.mean}</div>
      <div class="uc-ex">${u.words.slice(0,2).map(w=>w.w).join(' · ')}</div>
      <div class="uc-bar"><div class="uc-fill" style="background:${u.color};width:${pct}%"></div></div>
      <div class="uc-n">${u.words.length}字 · 掌握${kn}</div>
    </div>`;
  }).join('');
  document.getElementById('browseDetail').innerHTML='';
}
function selectUnit(id){
  S.browseUnit=id;
  document.querySelectorAll('.ucard').forEach(c=>c.classList.remove('sel'));
  const el=document.getElementById('uc-'+id); if(el)el.classList.add('sel');
  const u=UNITS.find(x=>x.id===id);
  document.getElementById('browseDetail').innerHTML=`
    <div class="stitle"><span class="dot" style="background:${u.color}"></span>
      <span style="color:${u.color}">${u.label}</span> — ${u.mean}
    </div>
    <table class="word-table">
      <thead><tr><th>單字</th><th>發音</th><th>中文</th><th>例詞</th></tr></thead>
      <tbody>${u.words.map(w=>`<tr>
        <td class="td-word" style="color:${u.color}">${w.w}</td>
        <td class="td-ipa">${w.ipa}</td>
        <td class="td-zh">${w.zh}</td>
        <td style="font-size:12px;color:var(--muted)">${w.ex.join('<br>')}</td>
      </tr>`).join('')}</tbody>
    </table>`;
  document.getElementById('browseDetail').scrollIntoView({behavior:'smooth',block:'nearest'});
}

// ============================================================
// FLASHCARD
// ============================================================
function getSelWords(){
  return UNITS.filter(u=>S.sel.includes(u.id)).flatMap(u=>u.words.map(w=>({...w,uid:u.id,ulabel:u.label,ucolor:u.color})));
}
function shuffle(a){return [...a].sort(()=>Math.random()-.5);}

function startFC(){
  S.fcWords=shuffle(getSelWords()); S.fcIdx=0; S.fcOK=0; S.fcNG=0; S.fcFlipped=false;
  document.getElementById('fcResult').style.display='none';
  document.getElementById('fcCard').style.display='';
  document.getElementById('fcBtns').style.display='none';
  document.querySelector('.fc-hint-tap').style.display='block';
  document.getElementById('fcCard').classList.remove('flip');
  renderFC();
}
function renderFC(){
  if(S.fcIdx>=S.fcWords.length){showFCResult();return;}
  const w=S.fcWords[S.fcIdx];
  document.getElementById('fcSeen').textContent=S.fcIdx;
  document.getElementById('fcOK').textContent=S.fcOK;
  document.getElementById('fcNG').textContent=S.fcNG;
  const pct=S.fcIdx/S.fcWords.length*100;
  document.getElementById('fcBar').style.width=pct+'%';
  document.getElementById('fcCtr').textContent=`第 ${S.fcIdx+1} / ${S.fcWords.length} 張`;
  document.getElementById('fcBadge').textContent=w.ulabel;
  document.getElementById('fcBadge2').textContent=w.ulabel;
  document.getElementById('fcWord').textContent=w.w;
  document.getElementById('fcWord2').textContent=w.w;
  document.getElementById('fcIpa').textContent=w.ipa;
  document.getElementById('fcZh').textContent=w.zh;
  document.getElementById('fcExamples').innerHTML=w.ex.map(e=>`<div class="fc-ex"><b>${e.split(' ')[0]}</b> ${e.split(' ').slice(1).join(' ')}</div>`).join('');
  document.getElementById('fcCard').classList.remove('flip');
  S.fcFlipped=false;
  document.getElementById('fcBtns').style.display='none';
}
function flipFC(){
  document.getElementById('fcCard').classList.toggle('flip');
  S.fcFlipped=!S.fcFlipped;
  document.getElementById('fcBtns').style.display=S.fcFlipped?'flex':'none';
}
function markFC(ok){
  const w=S.fcWords[S.fcIdx]; const key=w.uid+'_'+w.w;
  if(!S.prog[key])S.prog[key]={known:0,seen:0};
  S.prog[key].seen++;
  if(ok){S.prog[key].known++;S.fcOK++;}
  else{S.fcNG++;S.fcWords.push(w);}
  S.fcIdx++;S.studied++;saveS();updateHdr();renderFC();
}
function skipFC(){S.fcIdx++;renderFC();}
function showFCResult(){
  document.getElementById('fcResult').style.display='block';
  document.getElementById('fcCard').style.display='none';
  const pct=S.fcOK/(S.fcOK+S.fcNG)*100||0;
  document.getElementById('fcStars').textContent=pct>=90?'⭐⭐⭐':pct>=70?'⭐⭐':'⭐';
  document.getElementById('fcScore').textContent=`記住 ${S.fcOK} 個`;
  document.getElementById('fcMsg').textContent=pct>=90?'字根全掌握！學測必勝！':pct>=70?'很好！繼續鞏固。':'字根要多複習，慢慢累積就會強！';
}

// ============================================================
// QUIZ
// ============================================================
let qzData=[], qzAnsed=false, comboN=0;
const qzTypes=['zh2en','en2zh','example'];
function startQuiz(){
  const ws=getSelWords();
  if(ws.length<4){document.getElementById('quizArea').innerHTML='<p style="text-align:center;color:var(--muted);padding:40px">請選擇至少一個單元（需4個以上單字）</p>';return;}
  qzData=shuffle(ws).slice(0,Math.min(20,ws.length));
  S.qzIdx=0;S.qzOK=0;S.qzNG=0;qzAnsed=false;comboN=0;
  document.getElementById('quizResult').style.display='none';
  document.getElementById('quizArea').style.display='';
  renderQz();
}
function renderQz(){
  if(S.qzIdx>=qzData.length){showQzResult();return;}
  qzAnsed=false;
  const all=getSelWords(); const w=qzData[S.qzIdx];
  const type=qzTypes[S.qzIdx%qzTypes.length];
  document.getElementById('qzN').textContent=S.qzIdx+1;
  document.getElementById('qzOK').textContent=S.qzOK;
  document.getElementById('qzNG').textContent=S.qzNG;
  document.getElementById('qzBar').style.width=(S.qzIdx/qzData.length*100)+'%';
  document.getElementById('qzExplain').classList.remove('show');
  document.getElementById('qzNext').style.display='none';
  let q,correct,opts,badge;
  if(type==='zh2en'){
    badge='中翻英'; q=`「${w.zh}」英文是？`;
    correct=w.w;
    opts=shuffle([w,...shuffle(all.filter(x=>x.w!==w.w)).slice(0,3)]).map(x=>x.w);
  } else if(type==='en2zh'){
    badge='英翻中'; q=w.w;
    document.getElementById('qzIpa').textContent=w.ipa;
    correct=w.zh;
    opts=shuffle([w,...shuffle(all.filter(x=>x.w!==w.w)).slice(0,3)]).map(x=>x.zh);
  } else {
    badge='字根判斷';
    const units=UNITS.filter(u=>S.sel.includes(u.id));
    const wu=units.find(u=>u.id===w.uid)||units[0];
    q=`<span style="font-size:16px;color:var(--muted);display:block;margin-bottom:8px">"${w.w}"  包含字根</span><span style="font-size:28px;color:var(--gold)">${wu.label}</span> 的意思是？`;
    correct=wu.mean;
    const others=shuffle(units.filter(u=>u.id!==wu.id)).slice(0,3).map(u=>u.mean);
    opts=shuffle([correct,...others]);
  }
  document.getElementById('qzType').textContent=badge;
  document.getElementById('qzQ').innerHTML=q;
  if(type!=='en2zh') document.getElementById('qzIpa').textContent='';
  document.getElementById('qzOpts').innerHTML=opts.map(o=>
    `<button class="qz-opt" onclick="ansQz(this,'${o.replace(/'/g,"\\'")}','${correct.replace(/'/g,"\\'")}','${w.w.replace(/'/g,"\\'")}','${w.zh.replace(/'/g,"\\'")}','${w.ex[0].replace(/'/g,"\\'")}')">
      ${o}
    </button>`).join('');
}
function ansQz(btn,chosen,correct,word,zh,ex){
  if(qzAnsed)return;
  qzAnsed=true;
  const ok=chosen===correct;
  document.querySelectorAll('.qz-opt').forEach(b=>{b.disabled=true;if(b===btn)b.classList.add(ok?'ok':'bad');else if(b.textContent.trim()===correct)b.classList.add('ok');});
  if(ok){S.qzOK++;comboN++;showCombo();}else{S.qzNG++;comboN=0;}
  const e=document.getElementById('qzExplain');
  e.innerHTML=`<b>${word}</b>（${zh}）<br>例：${ex}`;
  e.classList.add('show');
  document.getElementById('qzNext').style.display='block';
  S.studied++;saveS();updateHdr();
}
function showCombo(){
  if(comboN<3)return;
  const b=document.getElementById('comboBadge');
  b.textContent=`🔥 ${comboN} 連對！`;
  b.style.display='block';
  setTimeout(()=>b.style.display='none',1400);
}
function nextQuiz(){S.qzIdx++;renderQz();}
function showQzResult(){
  document.getElementById('quizResult').style.display='block';
  document.getElementById('quizArea').style.display='none';
  const pct=S.qzOK/(S.qzOK+S.qzNG)*100||0;
  document.getElementById('qzStars').textContent=pct>=90?'⭐⭐⭐':pct>=70?'⭐⭐':'⭐';
  document.getElementById('qzScore').textContent=`${S.qzOK}/${S.qzOK+S.qzNG} 正確`;
  document.getElementById('qzMsg').textContent=pct>=90?'學測字根全搞定！🎉':pct>=70?'不錯！繼續衝！':'多看幾遍字根，閱讀理解會大提升！';
}

// ============================================================
// DRILL
// ============================================================
let drData=[], drAnsed=false;
function startDrill(){
  const ws=getSelWords();
  drData=shuffle(ws).slice(0,Math.min(15,ws.length));
  S.drIdx=0;S.drOK=0;S.drNG=0;drAnsed=false;
  document.getElementById('drillResult').style.display='none';
  document.getElementById('drillArea').style.display='';
  renderDr();
}
function renderDr(){
  if(S.drIdx>=drData.length){showDrResult();return;}
  drAnsed=false;
  const w=drData[S.drIdx];
  const u=UNITS.find(x=>x.id===w.uid)||UNITS[0];
  const ex=w.ex[0];
  // fill blank: replace the word in example
  let sentence, correct;
  if(ex.includes(w.w)){
    sentence=ex.replace(w.w,`<span class="blank-word">____</span>`);
    correct=w.w;
  } else {
    sentence=`<span style="color:var(--muted);font-size:14px">${u.label} 字根 → </span> ____`;
    correct=w.w;
  }
  document.getElementById('drN').textContent=S.drIdx+1;
  document.getElementById('drOK').textContent=S.drOK;
  document.getElementById('drNG').textContent=S.drNG;
  document.getElementById('drBar').style.width=(S.drIdx/drData.length*100)+'%';
  document.getElementById('drExplain').classList.remove('show');
  document.getElementById('drNext').style.display='none';
  document.getElementById('drQ').innerHTML=`<span style="font-size:12px;color:var(--muted);display:block;margin-bottom:8px">字根: ${u.label} (${u.mean}) · 中文: ${w.zh}</span>${sentence}`;
  const all=getSelWords();
  const distractors=shuffle(all.filter(x=>x.w!==w.w)).slice(0,3).map(x=>x.w);
  document.getElementById('drOpts').innerHTML=shuffle([correct,...distractors]).map(o=>
    `<button class="drill-opt" onclick="ansDr(this,'${o.replace(/'/g,"\\'")}','${correct.replace(/'/g,"\\'")}','${w.w.replace(/'/g,"\\'")}','${w.zh.replace(/'/g,"\\'")}','${ex.replace(/'/g,"\\'")}')">
      ${o}
    </button>`).join('');
}
function ansDr(btn,chosen,correct,word,zh,ex){
  if(drAnsed)return;
  drAnsed=true;
  const ok=chosen===correct;
  document.querySelectorAll('.drill-opt').forEach(b=>{b.disabled=true;if(b===btn)b.classList.add(ok?'ok':'bad');else if(b.textContent.trim()===correct)b.classList.add('ok');});
  if(ok)S.drOK++;else S.drNG++;
  const e=document.getElementById('drExplain');
  e.innerHTML=`答案：<b>${word}</b> = ${zh}<br>例：${ex}`;
  e.classList.add('show');
  document.getElementById('drNext').style.display='block';
  S.studied++;saveS();updateHdr();
}
function nextDrill(){S.drIdx++;renderDr();}
function showDrResult(){
  document.getElementById('drillResult').style.display='block';
  document.getElementById('drillArea').style.display='none';
  const pct=S.drOK/(S.drOK+S.drNG)*100||0;
  document.getElementById('drStars').textContent=pct>=90?'⭐⭐⭐':pct>=70?'⭐⭐':'⭐';
  document.getElementById('drScore').textContent=`${S.drOK}/${S.drOK+S.drNG} 正確`;
  document.getElementById('drMsg').textContent=pct>=90?'字根應用超強！':pct>=70?'還不錯！繼續練！':'多練幾次，字根就能靈活運用！';
}

// ============================================================
// PROGRESS
// ============================================================
function renderProg(){
  const byType={root:'🟥 字根', pre:'🟦 前綴', suf:'🟩 後綴'};
  let html='';
  Object.entries(byType).forEach(([type,label])=>{
    const units=UNITS.filter(u=>u.type===type);
    html+=`<div class="stitle" style="margin-top:20px"><span class="dot" style="background:${type==='root'?'var(--root-color)':type==='pre'?'var(--pre-color)':'var(--suf-color)'}"></span>${label}</div>
    <div class="unit-grid">${units.map(u=>{
      const kn=u.words.filter(w=>(S.prog[u.id+'_'+w.w]||{}).known).length;
      const pct=Math.round(kn/u.words.length*100);
      return `<div class="ucard">
        <div class="uc-label" style="color:${u.color}">${u.label}</div>
        <div class="uc-mean">${u.mean}</div>
        <div class="uc-bar"><div class="uc-fill" style="background:${u.color};width:${pct}%"></div></div>
        <div class="uc-n">掌握 ${kn}/${u.words.length} · ${pct}%</div>
      </div>`;
    }).join('')}</div>`;
  });
  document.getElementById('progContent').innerHTML=html;
}

// ============================================================
// SELECTION OVERLAY
// ============================================================
function openSel(mode){
  S._selFor=mode;
  const g=document.getElementById('selGrid');
  g.innerHTML=UNITS.map(u=>`<div class="sel-card${S.sel.includes(u.id)?' on':''}" id="sc-${u.id}" onclick="toggleSel('${u.id}',this)">
    <div class="sc-label" style="color:${u.color}">${u.label}</div>
    <div class="sc-sub">${u.mean} · ${u.type}</div>
  </div>`).join('');
  document.getElementById('selOverlay').classList.add('on');
}
function toggleSel(id,el){
  if(S.sel.includes(id))S.sel=S.sel.filter(x=>x!==id);
  else S.sel.push(id);
  el.classList.toggle('on');
}
function selAll(){S.sel=UNITS.map(u=>u.id);document.querySelectorAll('[id^="sc-"]').forEach(el=>el.classList.add('on'));}
function selNone(){S.sel=[];document.querySelectorAll('[id^="sc-"]').forEach(el=>el.classList.remove('on'));}
function selCat(cat){
  selNone();S.sel=UNITS.filter(u=>u.type===cat).map(u=>u.id);
  S.sel.forEach(id=>{const el=document.getElementById('sc-'+id);if(el)el.classList.add('on');});
}
function applySelection(){
  if(S.sel.length===0)S.sel=[UNITS[0].id];
  document.getElementById('selOverlay').classList.remove('on');
  if(S._selFor==='fc')startFC();else if(S._selFor==='qz')startQuiz();
}
function closeOverlay(e){if(e.target===document.getElementById('selOverlay'))document.getElementById('selOverlay').classList.remove('on');}
</script>
</body>
