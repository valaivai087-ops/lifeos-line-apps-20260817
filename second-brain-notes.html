const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
let Q = '';
const norm = s=>String(s||'').toLowerCase();
function hl(s){ s=esc(s); if(!Q) return s; const k=esc(Q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); return s.replace(new RegExp(k,'gi'),m=>`<mark>${m}</mark>`); }
function hay(o){ return o._h || (o._h = norm([o.t,o.b,o.p.join(' '),o.tg.join(' '),o.v.join(' '),o.a.join(' '),o.pain,o.cl,CMAP[o.c].n].join(' '))); }
const match = o=>!Q || hay(o).includes(norm(Q));
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1600); }
function copy(text){ (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>toast('已複製'),()=>{ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast('已複製');}catch(e){toast('複製失敗');} ta.remove(); }); }
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };

function systemSVG(){
  const L=[
    ['意義層','人生方向與哲學','life'],
    ['價值層','財富與金錢心理|一人事業與 AI 未來|關係與愛','money|biz|love'],
    ['行動層','自律與重啟|時間與深度工作','habit|time'],
    ['處理層','書寫與日記|榮格與內在療癒','write|jung'],
    ['輸入層','注意力主權|學習與思考|書單與知識庫','attention|learn|meta'],
  ];
  const W=1000,rowH=86,top=20; let s=`<svg viewBox="0 0 ${W} ${top+L.length*rowH+20}" role="img" aria-label="第二大腦五層框架圖">`;
  s+=`<defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink3)"/></marker></defs>`;
  L.forEach(([layer,names,keys],i)=>{
    const y=top+i*rowH; const ns=names.split('|'), ks=keys.split('|');
    s+=`<text x="10" y="${y+38}" font-size="15" font-weight="700" fill="var(--ink)">${layer}</text>`;
    const x0=110, avail=W-x0-10, gap=14, bw=(avail-gap*(ns.length-1))/ns.length;
    ns.forEach((n,j)=>{ const x=x0+j*(bw+gap), c=CMAP[ks[j]].c, cnt=DATA.filter(o=>o.c===ks[j]).length;
      s+=`<g style="cursor:pointer" data-go="${ks[j]}"><rect x="${x}" y="${y}" width="${bw}" height="58" rx="12" fill="${c}" opacity=".14"/><rect x="${x}" y="${y}" width="6" height="58" rx="3" fill="${c}"/>
      <text x="${x+20}" y="${y+26}" font-size="16" font-weight="700" fill="var(--ink)">${n}</text><text x="${x+20}" y="${y+46}" font-size="12.5" fill="var(--ink2)">${cnt} 篇 · ${CMAP[ks[j]].flow[2][1]}</text></g>`; });
    if(i<L.length-1) s+=`<line x1="${W/2+55}" y1="${y+rowH-4}" x2="${W/2+55}" y2="${y+62}" stroke="var(--ink3)" stroke-width="1.5" marker-end="url(#ar)"/>`;
  });
  return s+`</svg>`;
}

  return `<h1>金句牆</h1><p class="lead">${QUOTES.length} 則原創金句。每則都能複製文字，或下載 1080×1350 的臉書直式圖卡。</p>
  <div class="filters">${[['all','全部'],...CATS.filter(c=>c.quotes.length).map(c=>[c.k,c.n])].map(([k,n])=>`<button class="fbtn ${qcat===k?'on':''}" data-qcat="${k}">${n}</button>`).join('')}</div>
  ${list.length?`<div class="wall">${list.map(q=>{ const i=q.c.quotes.findIndex(x=>x[1]===q.qt); return `<div class="wq" style="--c:${q.c.c};background:${q.c.c}"><div class="qt">${esc(q.qt)}</div><div class="ft"><span>${q.c.n}</span><span><button data-copy="${esc(q.qt)}">複製</button> <button data-png="q:${q.c.k}:${i}">PNG</button></span></div></div>`;}).join('')}</div>`:`<div class="empty">沒有符合的金句</div>`}`;
}
document.addEventListener('click',e=>{ const b=e.target.closest('[data-qcat]'); if(b){ qcat=b.dataset.qcat; render(); } });

/* ---------- 機制總表 ---------- */
let tcat = 'all', tclean = store.get('sb_clean','1')==='1';
function tableShell(){
  return `<h1>機制總表</h1><p class="lead">每篇一列：痛點（觸發問題）→ 核心機制（原文論點）→ 行動處方 → 收束句。點任一列看完整原文。</p>
  <div class="tbar"><label>分類 <select id="tc"><option value="all">全部分類</option>${CATS.map(c=>`<option value="${c.k}" ${tcat===c.k?'selected':''}>${c.n}</option>`).join('')}</select></label>
  <label><input type="checkbox" id="tcl" ${tclean?'checked':''}> 隱藏無文字篇</label><span class="count" id="tcount"></span></div>
  <div class="tablewrap"><table><thead><tr><th>#</th><th>標題</th><th>分類</th><th>人物</th><th>痛點／觸發</th><th>核心機制</th><th>行動處方</th><th>收束句</th><th>日期</th></tr></thead><tbody id="tb"></tbody></table></div>`;
}
function renderTable(){
  const rows = DATA.filter(o=>(tcat==='all'||o.c===tcat) && (!tclean||o.n>=30) && match(o));
  $('#tcount').textContent = `${rows.length} / ${DATA.length} 篇`;
  $('#tb').innerHTML = rows.length ? rows.map(o=>{ const c=CMAP[o.c]; return `<tr class="r" data-open="${o.id}">
    <td class="id">${o.id}</td><td class="t">${hl(o.t)}${o.dup?` <span class="dup">重複×${o.dup}</span>`:''}</td>
    <td style="--c:${c.c}"><span class="chip c">${c.n}</span></td><td>${o.p.map(esc).join('<br>')}</td>
    <td class="pain">${hl(o.pain)}</td>
    <td class="v">${o.v.length?`<ol>${o.v.map(v=>`<li>${hl(v)}</li>`).join('')}</ol>`:'<span class="muted">—</span>'}</td>
    <td class="a">${o.a.length?`<ol>${o.a.map(v=>`<li>${hl(v)}</li>`).join('')}</ol>`:'<span class="muted">—</span>'}</td>
    <td class="cl">${hl(o.cl)}</td><td class="muted" style="white-space:nowrap">${esc(o.d)}</td></tr>`; }).join('') : `<tr><td colspan="9" class="empty">沒有符合的文章</td></tr>`;
}
document.addEventListener('change',e=>{
  if(e.target.id==='tc'){ tcat=e.target.value; renderTable(); }
  if(e.target.id==='tcl'){ tclean=e.target.checked; store.set('sb_clean',tclean?'1':'0'); renderTable(); }
});

/* ---------- 原文抽屜 ---------- */
function openArt(id){
  const o=DATA.find(x=>x.id==id); if(!o) return; const c=CMAP[o.c];
  $('#dr').style.setProperty('--c',c.c);
  $('#dr').innerHTML = `<div class="dh"><h3>${esc(o.t)}</h3><button class="x" id="dx" aria-label="關閉">×</button></div>
  <div class="db"><div style="margin-bottom:12px"><span class="chip c">${c.n}</span>${o.c2.map(k=>`<span class="chip">${CMAP[k].n}</span>`).join('')}${o.p.map(p=>`<span class="chip">${esc(p)}</span>`).join('')}<span class="muted" style="font-size:12px"> #${o.id}${o.d?' · '+esc(o.d):''}${o.dup?' · 重複發布 '+o.dup+' 次':''}</span></div>
  <div class="mech"><b>痛點</b><div>${esc(o.pain)||'—'}</div><b>核心機制</b><div>${o.v.length?`<ol>${o.v.map(v=>`<li>${esc(v)}</li>`).join('')}</ol>`:'—'}</div><b>行動處方</b><div>${o.a.length?`<ol>${o.a.map(v=>`<li>${esc(v)}</li>`).join('')}</ol>`:'—'}</div><b>收束句</b><div style="font-family:var(--serif)">${esc(o.cl)||'—'}</div></div>
  <div class="orig">${o.b?o.b.split('\n').map(p=>`<p>${hl(p)}</p>`).join(''):'<p class="muted">此篇原文僅有圖片或標籤，無文字內容。</p>'}</div>
  ${o.tg.length?`<p class="muted" style="font-size:12.5px">${o.tg.map(t=>'#'+esc(t)).join(' ')}</p>`:''}
  <button class="btn" data-copy="${esc(o.t+'\n\n'+o.b)}">複製原文</button></div>`;
  $('#dr').classList.add('on'); $('#ov').classList.add('on'); $('#dr').scrollTop=0;
}
function closeArt(){ $('#dr').classList.remove('on'); $('#ov').classList.remove('on'); }
document.addEventListener('click',e=>{
  const op=e.target.closest('[data-open]'); if(op){ openArt(op.dataset.open); return; }
  if(e.target.id==='dx'||e.target.id==='ov') closeArt();
  const cp=e.target.closest('[data-copy]'); if(cp) copy(cp.dataset.copy);
  const cpp=e.target.closest('[data-copypost]'); if(cpp) copy(postText(CMAP[cpp.dataset.copypost]));
  const pg=e.target.closest('[data-png]'); if(pg) png(pg.dataset.png);
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeArt(); if(e.key==='/'&&document.activeElement!==$('#q')){ e.preventDefault(); $('#q').focus(); } });

/* ---------- 圖卡 PNG ---------- */
function png(spec){
  const [kind,k,i]=spec.split(':'); const c=CMAP[k];
  let text, label;
  if(kind==='post'){ text=c.post.lines.find(x=>x[0]==='哲學命題')[1]; label='配圖'; }
  else { text=c.quotes[+i][1]; label=String(+i+1); }
  const W=1080,H=1350, cv=document.createElement('canvas'); cv.width=W; cv.height=H; const x=cv.getContext('2d');
  x.fillStyle=c.c; x.fillRect(0,0,W,H);
  x.fillStyle='rgba(255,255,255,.08)'; x.beginPath(); x.arc(W-120,180,260,0,Math.PI*2); x.fill();
  x.fillStyle='rgba(255,255,255,.5)'; x.fillRect(100,200,80,4);
  x.fillStyle='#fff'; const fs=text.length>40?62:text.length>26?72:84; x.font=`900 ${fs}px "Noto Serif TC","PMingLiU",serif`;
  const lines=[]; let cur=''; for(const ch of text){ if(x.measureText(cur+ch).width>W-200 && cur){ if('，。、；：！？」』）'.includes(ch)){ cur+=ch; lines.push(cur); cur=''; continue; } lines.push(cur); cur=ch; } else cur+=ch; } if(cur) lines.push(cur);
  const lh=fs*1.6, y0=(H-lines.length*lh)/2+fs*.4; lines.forEach((l,j)=>x.fillText(l,100,y0+j*lh));
  x.fillStyle='rgba(255,255,255,.85)'; x.font='500 32px "Noto Sans TC","Microsoft JhengHei",sans-serif'; x.fillText(`${c.n} · 第二大腦筆記`,100,H-120);
  const a=document.createElement('a'); a.download=`金句_${c.n}_${label}.png`; a.href=cv.toDataURL('image/png'); a.click(); toast('圖卡已下載');
}

/* ---------- 搜尋與主題 ---------- */
let qt;
$('#q').addEventListener('input',e=>{ clearTimeout(qt); qt=setTimeout(()=>{ Q=e.target.value.trim(); $('#qc').style.display=Q?'block':'none';
  if(view==='table') renderTable(); else render(); },160); });
$('#qc').addEventListener('click',()=>{ $('#q').value=''; Q=''; $('#qc').style.display='none'; view==='table'?renderTable():render(); });
function applyTheme(t){ if(t) document.documentElement.dataset.theme=t; else delete document.documentElement.dataset.theme;
  const dark = t ? t==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; $('#th').textContent = dark?'淺色':'深色'; }
$('#th').addEventListener('click',()=>{ const dark=$('#th').textContent==='淺色'; const t=dark?'light':'dark'; store.set('sb_theme',t); applyTheme(t); });
applyTheme(store.get('sb_theme',''));
tabsHTML(); render();
</script>
