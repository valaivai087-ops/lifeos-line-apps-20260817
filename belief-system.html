<!DOCTYPE html>
<html lang="zh-TW">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif;background:#0B1520;min-height:100vh;color:#fff;}

/* ── HERO ── */
.hero{background:linear-gradient(160deg,#0D1B2A 0%,#0f2035 60%,#0D1B2A 100%);border-bottom:1px solid rgba(184,134,11,0.2);padding:2.5rem 1.5rem 2rem;text-align:center;position:relative;overflow:hidden;}

.hero-badge{display:inline-block;font-size:11px;letter-spacing:2px;color:#B8860B;border:1px solid rgba(184,134,11,0.35);padding:4px 18px;border-radius:100px;margin-bottom:1rem;}
.hero-title{font-size:26px;font-weight:700;color:#fff;letter-spacing:2px;margin-bottom:6px;position:relative;}
.hero-title em{color:#D4A017;font-style:normal;}
.hero-sub{font-size:13px;color:rgba(255,255,255,0.45);letter-spacing:1px;margin-bottom:1.25rem;position:relative;}
.hero-divider{width:80px;height:1px;background:linear-gradient(90deg,transparent,#B8860B,transparent);margin:0 auto 1.25rem;}
.hero-tags{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;position:relative;}
.hero-tag{font-size:11px;padding:5px 14px;border-radius:100px;background:rgba(184,134,11,0.1);border:1px solid rgba(184,134,11,0.25);color:#D4A017;}
.prog-bar{background:rgba(255,255,255,0.06);border-radius:100px;height:3px;margin:1.5rem 1.5rem 0;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,#B8860B,#D4A017);border-radius:100px;transition:width 0.6s ease;width:0%;}

/* ── CONTENT ── */
.content{max-width:760px;margin:0 auto;padding:1.5rem 1rem;}
.phase{display:none;}.phase.active{display:block;}

/* ── SECTION LABEL ── */
.slabel{font-size:10px;font-weight:700;letter-spacing:2px;color:#B8860B;margin-bottom:1rem;display:flex;align-items:center;gap:8px;text-transform:uppercase;}
.slabel::after{content:'';flex:1;height:0.5px;background:rgba(184,134,11,0.2);}

/* ── DISEASE MODEL ── */
.model-flow{display:flex;align-items:stretch;gap:0;margin-bottom:1.5rem;flex-wrap:wrap;}
.mf-step{flex:1;min-width:80px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);padding:10px 6px;text-align:center;font-size:11px;color:rgba(255,255,255,0.6);position:relative;}
.mf-step:first-child{border-radius:10px 0 0 10px;border-left-color:rgba(184,134,11,0.4);border-top-color:rgba(184,134,11,0.4);border-bottom-color:rgba(184,134,11,0.4);color:#D4A017;}
.mf-step:last-child{border-radius:0 10px 10px 0;border-right-color:rgba(163,45,45,0.5);border-top-color:rgba(163,45,45,0.5);border-bottom-color:rgba(163,45,45,0.5);color:#E87070;}
.mf-step .mf-arrow{position:absolute;right:-10px;top:50%;transform:translateY(-50%);font-size:14px;color:rgba(255,255,255,0.2);z-index:1;}
.mf-icon{font-size:16px;margin-bottom:3px;display:block;}

/* ── BELIEF CATEGORY TABS ── */
.cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem;}
.cat-tab{padding:7px 14px;border:1px solid rgba(255,255,255,0.1);border-radius:100px;font-size:12px;color:rgba(255,255,255,0.45);cursor:pointer;transition:all 0.2s;background:transparent;font-family:inherit;}
.cat-tab:hover{border-color:rgba(184,134,11,0.4);color:#D4A017;}
.cat-tab.active{background:rgba(184,134,11,0.12);border-color:#B8860B;color:#D4A017;font-weight:600;}

/* ── BELIEF CARDS ── */
.beliefs-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:1.25rem;}
.belief-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px 16px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden;}
.belief-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;transition:background 0.2s;}
.belief-card:hover{border-color:rgba(184,134,11,0.3);background:rgba(184,134,11,0.03);}
.belief-card:hover::before{background:rgba(184,134,11,0.5);}
.belief-card.picked{border-color:#B8860B;background:rgba(184,134,11,0.06);}
.belief-card.picked::before{background:#D4A017;}
.bc-top{display:flex;align-items:center;gap:12px;}
.bc-check{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;transition:all 0.2s;}
.belief-card.picked .bc-check{background:#B8860B;border-color:#B8860B;color:#0D1B2A;font-weight:700;}
.bc-content{flex:1;}
.bc-belief{font-size:14px;font-weight:700;color:#fff;margin-bottom:3px;}
.bc-emotion{font-size:11px;color:#B8860B;}
.bc-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.bc-tag{font-size:10px;padding:3px 9px;border-radius:100px;background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.4);}

/* ── QUESTION PHASE ── */
.q-block{margin-bottom:1.5rem;}
.q-belief-header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(184,134,11,0.06);border:1px solid rgba(184,134,11,0.18);border-radius:12px;margin-bottom:10px;}
.q-bh-icon{font-size:20px;}
.q-bh-name{font-size:14px;font-weight:700;color:#fff;flex:1;}
.q-bh-emo{font-size:11px;color:#B8860B;}
.q-list{display:flex;flex-direction:column;gap:8px;}
.q-item{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:11px;padding:12px 14px;}
.q-text{font-size:13px;color:rgba(255,255,255,0.8);margin-bottom:9px;line-height:1.6;}
.q-opts{display:flex;gap:7px;flex-wrap:wrap;}
.q-opt{padding:6px 12px;border:1px solid rgba(255,255,255,0.12);border-radius:100px;font-size:11px;cursor:pointer;color:rgba(255,255,255,0.5);background:transparent;transition:all 0.15s;font-family:inherit;}
.q-opt:hover{border-color:#B8860B;color:#D4A017;}
.q-opt.sel{background:rgba(184,134,11,0.15);border-color:#B8860B;color:#D4A017;font-weight:600;}

/* ── RESULT ── */
.result-summary{background:linear-gradient(135deg,#0D1B2A,#12243a);border:1px solid rgba(184,134,11,0.25);border-radius:18px;padding:2rem;text-align:center;margin-bottom:1.5rem;}
.rs-ring-wrap{width:110px;height:110px;margin:0 auto 1rem;position:relative;}
.rs-ring-wrap svg{width:110px;height:110px;}
.rs-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px;font-weight:700;color:#D4A017;}
.rs-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:6px;}
.rs-desc{font-size:13px;color:rgba(255,255,255,0.45);}

/* ── RESULT BELIEF CARD ── */
.rb-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:16px;overflow:hidden;margin-bottom:14px;}
.rb-header{display:flex;align-items:center;gap:12px;padding:14px 16px;}
.rb-icon{font-size:24px;}
.rb-info{flex:1;}
.rb-belief{font-size:15px;font-weight:700;color:#fff;}
.rb-update{font-size:12px;color:#B8860B;margin-top:2px;}
.rb-score-area{text-align:right;}
.rb-score-num{font-size:18px;font-weight:700;}
.rb-score-bar-wrap{width:80px;height:4px;background:rgba(255,255,255,0.08);border-radius:100px;margin-top:5px;overflow:hidden;}
.rb-score-bar{height:100%;border-radius:100px;transition:width 1s ease;}
.s-high{background:#3B6D11;}.s-mid{background:#B8860B;}.s-low{background:#A32D2D;}

/* ── TABS (RESULT) ── */
.rtabs{display:flex;gap:0;margin-bottom:1rem;border:1px solid rgba(255,255,255,0.1);border-radius:10px;overflow:hidden;}
.rtab{flex:1;padding:10px;font-size:12px;font-weight:600;text-align:center;cursor:pointer;background:transparent;color:rgba(255,255,255,0.35);border:none;transition:all 0.2s;font-family:inherit;}
.rtab.active{background:rgba(184,134,11,0.12);color:#D4A017;}
.tab-panel{display:none;}.tab-panel.active{display:block;}

/* ── EDUCATION PANEL ── */
.edu-section{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:14px;margin-bottom:10px;}
.edu-title{font-size:12px;font-weight:700;letter-spacing:0.5px;color:rgba(255,255,255,0.35);margin-bottom:8px;text-transform:uppercase;}
.disease-chain{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;}
.dc-step{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,0.6);padding:4px 0;}
.dc-step:first-child .dc-label{color:#D4A017;font-weight:700;}
.dc-step:last-child .dc-label{color:#E87070;}
.dc-arrow{color:rgba(255,255,255,0.2);font-size:10px;}
.dc-label{flex:1;}
.method-box{background:rgba(56,189,248,0.05);border:1px solid rgba(56,189,248,0.15);border-radius:10px;padding:12px;margin-bottom:10px;}
.method-title{font-size:11px;color:#7DD3FC;font-weight:700;margin-bottom:6px;letter-spacing:0.5px;}
.method-steps{list-style:none;display:flex;flex-direction:column;gap:6px;}
.method-steps li{font-size:12px;color:rgba(255,255,255,0.65);padding-left:16px;position:relative;line-height:1.5;}
.method-steps li::before{content:'→';position:absolute;left:0;color:#7DD3FC;font-size:10px;}
.update-box{background:rgba(184,134,11,0.06);border-left:3px solid #B8860B;padding:10px 14px;border-radius:0 10px 10px 0;margin-bottom:10px;font-size:13px;color:rgba(255,255,255,0.75);line-height:1.6;}
.update-label{font-size:10px;color:#8B6508;font-weight:700;letter-spacing:0.5px;margin-bottom:4px;}

/* ── NUTRIENT PANEL ── */
.nut-list{display:flex;flex-direction:column;gap:9px;}
.nut-card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:12px;overflow:hidden;}
.nut-top{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;transition:background 0.15s;}
.nut-top:hover{background:rgba(184,134,11,0.04);}
.nut-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.nut-info{flex:1;min-width:0;}
.nut-name{font-size:13px;font-weight:700;color:#fff;}
.nut-mech{font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;}
.nut-price{font-size:12px;color:#B8860B;font-weight:700;margin-top:3px;}
.nut-expand{font-size:11px;color:rgba(255,255,255,0.25);flex-shrink:0;}
.nut-cta{padding:7px 13px;background:linear-gradient(135deg,#B8860B,#D4A017);color:#0D1B2A;border:none;border-radius:100px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;text-decoration:none;display:inline-block;font-family:inherit;}
.nut-detail{display:none;padding:0 14px 14px;border-top:1px solid rgba(255,255,255,0.05);}
.nut-detail.open{display:block;}
.nut-mbox{background:rgba(255,255,255,0.03);border-radius:10px;padding:10px 12px;margin:10px 0;}
.nut-mtitle{font-size:10px;letter-spacing:1px;color:rgba(255,255,255,0.3);font-weight:700;margin-bottom:5px;}
.nut-mtext{font-size:12px;color:rgba(255,255,255,0.65);line-height:1.7;}
.nut-why{background:rgba(184,134,11,0.05);border-left:2px solid #B8860B;padding:8px 12px;border-radius:0 8px 8px 0;margin-bottom:10px;}
.nut-why-t{font-size:10px;color:#8B6508;font-weight:700;margin-bottom:3px;letter-spacing:0.5px;}
.nut-why-b{font-size:12px;color:rgba(255,255,255,0.65);line-height:1.6;}
.nut-buy-block{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:rgba(184,134,11,0.05);border:1px solid rgba(184,134,11,0.18);border-radius:10px;}
.nbb-info{flex:1;}
.nbb-name{font-size:12px;font-weight:700;color:#fff;margin-bottom:2px;}
.nbb-price{font-size:16px;font-weight:700;color:#D4A017;}
.nbb-spec{font-size:10px;color:rgba(255,255,255,0.3);margin-top:1px;}
.nbb-store{font-size:10px;color:#B8860B;margin-top:2px;font-weight:600;}
.btn-buy-full{padding:10px 18px;background:linear-gradient(135deg,#B8860B,#D4A017);color:#0D1B2A;border:none;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;white-space:nowrap;flex-shrink:0;font-family:inherit;}

/* ── MIND PANEL ── */
.mind-steps{display:flex;flex-direction:column;gap:10px;}
.mind-step{display:flex;gap:12px;align-items:flex-start;background:rgba(56,189,248,0.04);border:1px solid rgba(56,189,248,0.1);border-radius:12px;padding:12px 14px;}
.ms-num{width:24px;height:24px;border-radius:50%;background:rgba(56,189,248,0.15);border:1px solid rgba(56,189,248,0.3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#7DD3FC;flex-shrink:0;}
.ms-content{flex:1;}
.ms-title{font-size:13px;font-weight:700;color:#fff;margin-bottom:4px;}
.ms-desc{font-size:12px;color:rgba(255,255,255,0.55);line-height:1.6;}

/* ── BUTTONS ── */
.btn-primary{width:100%;padding:16px;background:linear-gradient(135deg,#B8860B,#D4A017);color:#0D1B2A;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:1px;transition:opacity 0.2s,transform 0.1s;margin-top:1rem;font-family:inherit;}
.btn-primary:hover{opacity:0.9;transform:translateY(-1px);}
.btn-primary:active{transform:scale(0.99);}
.btn-primary:disabled{opacity:0.2;cursor:not-allowed;transform:none;}
.nav-row{display:flex;gap:10px;margin-top:1rem;}
.btn-back{flex:1;padding:14px;background:transparent;border:1px solid rgba(255,255,255,0.12);border-radius:12px;font-size:14px;color:rgba(255,255,255,0.4);cursor:pointer;font-family:inherit;transition:all 0.2s;}
.btn-back:hover{border-color:rgba(184,134,11,0.4);color:#D4A017;}
.btn-restart{display:block;width:100%;padding:14px;background:transparent;border:1px solid rgba(255,255,255,0.08);border-radius:12px;font-size:14px;color:rgba(255,255,255,0.3);cursor:pointer;text-align:center;margin-top:1.5rem;transition:all 0.2s;font-family:inherit;}
.btn-restart:hover{border-color:rgba(184,134,11,0.3);color:#B8860B;}

/* ── PICK COUNT ── */
.pick-hint{text-align:center;font-size:12px;color:rgba(255,255,255,0.3);margin-bottom:1rem;}
.pick-count{display:inline-block;background:rgba(184,134,11,0.12);color:#B8860B;font-size:12px;padding:3px 12px;border-radius:100px;margin-left:6px;font-weight:600;}

/* ── FOOTER ── */
.footer{text-align:center;font-size:11px;color:rgba(255,255,255,0.15);padding:1.5rem 1rem;line-height:1.8;}

@media(max-width:480px){
  .hero-title{font-size:20px;}
  .model-flow{flex-direction:column;}
  .mf-step{border-radius:8px!important;border-color:rgba(255,255,255,0.08)!important;}
  .mf-arrow{display:none;}
  .nut-buy-block{flex-direction:column;align-items:flex-start;}
  .btn-buy-full{width:100%;text-align:center;}
}
</style>
</head>

      {t:'命運重新框架',d:'「我命不好」是解釋過去的故事。「我選擇創造什麼樣的未來」是你現在握有的能力。把注意力從解釋過去轉向創造未來。'},
    ],
    qs:[
      {q:'你是否常常感到命運掌控你，而不是你掌控命運？',opts:['很少','偶爾','常常','幾乎持續']},
      {q:'你是否常常被動等待好事發生，而不是主動創造？',opts:['很少','偶爾','常常','幾乎總是']},
      {q:'你的整體身心健康狀態如何？',opts:['良好','尚可','差','很差']},
    ],
    nutrients:[
      {n:'甘氨酸鎂複方',icon:'🔩',bg:'rgba(24,95,165,0.18)',mech:'神經系統基礎重建',
       detail:'「命不好」的宿命論往往伴隨全系統的低效運作，鎂充足是神經系統、內分泌系統、能量代謝全面正常運作的基礎。甘氨酸鎂從最底層重建生理運作效率。',
       why:'命運的改變從身體健康開始。鎂是讓全身系統重新正常運作的最基礎礦物質。',
       price:'NT$1,350',spec:'粉包 一袋30包'},
      {n:'Q10（10:1）',icon:'⚡',bg:'rgba(184,134,11,0.18)',mech:'能量系統全面提升',
       detail:'主動創造命運需要能量。Q10直接重啟粒線體能量系統，讓身體有足夠的能量去採取行動、嘗試新的可能性。能量充沛時，「我能改變」才有生理基礎。',
       why:'你沒有辦法用耗竭的身體去創造新的命運。Q10先補充創造命運所需的能量。',
       price:'NT$580',spec:'膠囊 一瓶150粒'},
      {n:'孢子益生菌',icon:'🌱',bg:'rgba(59,109,17,0.18)',mech:'腸腦軸全系統優化',
       detail:'健康的腸道菌相是整個身心系統最重要的基礎之一，影響從免疫到情緒到能量的所有層面。孢子益生菌真正到達腸道定殖，是全系統優化的起點。',
       why:'全系統優化從腸道開始。健康的菌相是讓「命運」向好的方向流動的最深層基礎。',
       price:'NT$650',spec:'一袋30包 一包6克'},
    ]
  },
];

/* ── CATEGORY CONFIG ── */
const CATS=['全部','安全系','價值系','愛與連結系','主體系','演化系'];

let picked=[], diagAnswers={}, phase=1;

function init(){
  // Cat tabs
  const ct=document.getElementById('cat-tabs');
  CATS.forEach((c,i)=>{
    const btn=document.createElement('button');
    btn.className='cat-tab'+(i===0?' active':'');
    btn.textContent=c; btn.dataset.cat=c;
    btn.onclick=()=>filterCat(c,btn);
    ct.appendChild(btn);
  });
  renderBeliefs('全部');
}

function filterCat(cat,btn){
  document.querySelectorAll('.cat-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderBeliefs(cat);
}

function renderBeliefs(cat){
  const grid=document.getElementById('belief-grid'); grid.innerHTML='';
  const list=cat==='全部'?BELIEFS:BELIEFS.filter(b=>b.cat===cat);
  list.forEach(b=>{
    const card=document.createElement('div');
    card.className='belief-card'+(picked.includes(b.id)?' picked':'');
    card.dataset.id=b.id;
    card.innerHTML=`
      <div class="bc-top">
        <div class="bc-check">${picked.includes(b.id)?'✓':''}</div>
        <div class="bc-content">
          <div class="bc-belief">${b.icon} ${b.belief}</div>
          <div class="bc-emotion">核心情緒：${b.emotion}</div>
        </div>
      </div>
      <div class="bc-tags">
        <span class="bc-tag">常見行為：${b.behavior}</span>
        <span class="bc-tag">${b.cat}</span>
      </div>
    `;
    card.onclick=()=>toggleBelief(b.id,card);
    grid.appendChild(card);
  });
}

function toggleBelief(id,card){
  const idx=picked.indexOf(id);
  if(idx===-1){picked.push(id);card.classList.add('picked');card.querySelector('.bc-check').textContent='✓';}
  else{picked.splice(idx,1);card.classList.remove('picked');card.querySelector('.bc-check').textContent='';}
  document.getElementById('pcount').textContent=picked.length+' 已選';
  document.getElementById('btn-next').disabled=picked.length===0;
  updateProg();
}

function go(n){
  document.querySelectorAll('.phase').forEach(p=>p.classList.remove('active'));
  document.getElementById('p'+n).classList.add('active');
  phase=n; updateProg();
  window.scrollTo({top:0,behavior:'smooth'});
}

function updateProg(){
  const p=phase===1?8:phase===2?48:100;
  document.getElementById('prog').style.width=p+'%';
}

document.getElementById('btn-next').onclick=()=>{buildDiag();go(2);};

function buildDiag(){
  const body=document.getElementById('q-body'); body.innerHTML='';
  picked.forEach(id=>{
    const b=BELIEFS.find(x=>x.id===id);
    const blk=document.createElement('div'); blk.className='q-block';
    blk.innerHTML=`<div class="q-belief-header"><span class="q-bh-icon">${b.icon}</span><span class="q-bh-name">${b.belief}</span><span class="q-bh-emo">${b.emotion}</span></div>`;
    const ql=document.createElement('div'); ql.className='q-list';
    b.qs.forEach((q,qi)=>{
      const key=id+'_'+qi;
      const item=document.createElement('div'); item.className='q-item';
      const opts=q.opts.map((o,oi)=>`<button class="q-opt" onclick="pickOpt(this,'${key}',${oi})">${o}</button>`).join('');
      item.innerHTML=`<div class="q-text">${q.q}</div><div class="q-opts">${opts}</div>`;
      ql.appendChild(item);
    });
    blk.appendChild(ql); body.appendChild(blk);
  });
}

function pickOpt(btn,key,val){
  btn.closest('.q-opts').querySelectorAll('.q-opt').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel'); diagAnswers[key]=val;
}

function calcScore(id){
  const b=BELIEFS.find(x=>x.id===id);
  let t=0,c=0;
  b.qs.forEach((_,qi)=>{const k=id+'_'+qi;if(diagAnswers[k]!==undefined){t+=diagAnswers[k];c++;}});
  if(!c)return 70;
  return Math.round(100-(t/c/3)*80);
}

function showResult(){
  const body=document.getElementById('result-body'); body.innerHTML='';
  const scores=picked.map(id=>({id,score:calcScore(id)}));
  const avg=Math.round(scores.reduce((s,x)=>s+x.score,0)/scores.length);
  const doff=Math.round(251*(1-avg/100));
  const sc=avg>=70?'#3B6D11':avg>=45?'#B8860B':'#A32D2D';
  const lbl=avg>=70?'系統韌性良好':avg>=45?'系統需要調整':'系統需要重建';
  const desc=avg>=70?'你的信念系統有一定韌性。以下方案幫你進一步優化。':avg>=45?'部分限制性信念正在消耗你的生理資源。及早介入效果最好。':'多個底層信念在同步拉低你的生理系統。系統性修復是現在最重要的事。';

  body.innerHTML=`
    <div class="result-summary">
      <div class="rs-ring-wrap">
        <svg viewBox="0 0 90 90"><circle cx="45" cy="45" r="40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="5"/><circle cx="45" cy="45" r="40" fill="none" stroke="${sc}" stroke-width="5" stroke-dasharray="251" stroke-dashoffset="${doff}" stroke-linecap="round" transform="rotate(-90 45 45)"/></svg>
        <div class="rs-num">${avg}</div>
      </div>
      <div class="rs-title">${lbl}</div>
      <div class="rs-desc">${desc}</div>
    </div>
    <div id="rb-list"></div>
  `;

  const list=document.getElementById('rb-list');
  const sorted=[...scores].sort((a,b)=>a.score-b.score);
  sorted.forEach(({id,score})=>{
    const b=BELIEFS.find(x=>x.id===id);
    const bc=score>=70?'s-high':score>=45?'s-mid':'s-low';
    const nc=score>=70?'#3B6D11':score>=45?'#B8860B':'#A32D2D';
    const urg=score<45?'需要重建':score<70?'需要調整':'維持優化';

    const card=document.createElement('div'); card.className='rb-card';
    const cardId='rc_'+id;
    card.innerHTML=`
      <div class="rb-header">
        <span class="rb-icon">${b.icon}</span>
        <div class="rb-info">
          <div class="rb-belief">${b.belief}</div>
          <div class="rb-update">→ ${b.update}</div>
        </div>
        <div class="rb-score-area">
          <div style="font-size:10px;color:rgba(255,255,255,0.3);margin-bottom:3px;text-align:right">${urg}</div>
          <div class="rb-score-num" style="color:${nc}">${score}<span style="font-size:12px;opacity:0.5">/100</span></div>
          <div class="rb-score-bar-wrap">
            <div class="rb-score-bar ${bc}" style="width:0%" data-w="${score}%"></div>
          </div>
        </div>
      </div>
      <div style="padding:0 16px">
        <div class="rtabs" id="tabs_${id}">
          <button class="rtab active" onclick="switchTab('${id}','edu',this)">📚 教育 & 機制</button>
          <button class="rtab" onclick="switchTab('${id}','func',this)">⚗️ 功能醫學</button>
          <button class="rtab" onclick="switchTab('${id}','mind',this)">🧠 意識醫學</button>
        </div>
      </div>
      <div style="padding:0 16px 16px">
        <div class="tab-panel active" id="edu_${id}"></div>
        <div class="tab-panel" id="func_${id}"></div>
        <div class="tab-panel" id="mind_${id}"></div>
      </div>
    `;
    list.appendChild(card);

    // EDU TAB
    const eduPanel=card.querySelector('#edu_'+id);
    eduPanel.innerHTML=`
      <div class="edu-section">
        <div class="edu-title">疾病形成路徑</div>
        <div class="disease-chain">
          ${b.disease_chain.map((s,i)=>`<div class="dc-step">${i>0?'<span class="dc-arrow">↓</span>':''}<span class="dc-label">${s}</span></div>`).join('')}
        </div>
      </div>
      <div class="update-box">
        <div class="update-label">信念更新程式碼</div>
        「${b.belief}」→「${b.update}」<br>
        <small style="color:rgba(255,255,255,0.45);font-size:11px">功能醫學方向：${b.physio}</small>
      </div>
    `;

    // FUNC TAB
    const funcPanel=card.querySelector('#func_'+id);
    const nutList=document.createElement('div'); nutList.className='nut-list';
    b.nutrients.forEach((n,ni)=>{
      const nid=id+'_n'+ni;
      const nc2=document.createElement('div'); nc2.className='nut-card';
      nc2.innerHTML=`
        <div class="nut-top" onclick="toggleNut('${nid}')">
          <div class="nut-ico" style="background:${n.bg}">${n.icon}</div>
          <div class="nut-info">
            <div class="nut-name">${n.n}</div>
            <div class="nut-mech">${n.mech}</div>
            <div class="nut-price">${n.price} · ${n.spec}</div>
          </div>
          <span class="nut-expand" id="exp_${nid}">▾</span>
          <a class="nut-cta" href="${SHOP}" target="_blank" rel="noopener" onclick="event.stopPropagation()">購買</a>
        </div>
        <div class="nut-detail" id="${nid}">
          <div class="nut-mbox">
            <div class="nut-mtitle">作用機制</div>
            <div class="nut-mtext">${n.detail}</div>
          </div>
          <div class="nut-why">
            <div class="nut-why-t">為什麼你的系統現在需要它</div>
            <div class="nut-why-b">${n.why}</div>
          </div>
          <div class="nut-buy-block">
            <div class="nbb-info">
              <div class="nbb-name">${n.n}</div>
              <div class="nbb-price">${n.price}</div>
              <div class="nbb-spec">${n.spec}</div>
              <div class="nbb-store">📦 7-11 賣貨便取貨付款</div>
            </div>
            <a class="btn-buy-full" href="${SHOP}" target="_blank" rel="noopener">立即購買 →</a>
          </div>
        </div>
      `;
      nutList.appendChild(nc2);
    });
    funcPanel.appendChild(nutList);

    // MIND TAB
    const mindPanel=card.querySelector('#mind_'+id);
    mindPanel.innerHTML=`
      <div class="method-box" style="margin-bottom:10px">
        <div class="method-title">意識醫學方向</div>
        <div style="font-size:12px;color:rgba(255,255,255,0.6)">${b.mind_dir}</div>
      </div>
      <div class="mind-steps">
        ${b.mind_steps.map((s,i)=>`
          <div class="mind-step">
            <div class="ms-num">${i+1}</div>
            <div class="ms-content">
              <div class="ms-title">${s.t}</div>
              <div class="ms-desc">${s.d}</div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  });

  go(3);
  setTimeout(()=>{
    document.querySelectorAll('.rb-score-bar').forEach(b=>{
      b.style.transition='width 1s ease';
      b.style.width=b.dataset.w;
    });
  },300);
}

function switchTab(id,tab,btn){
  ['edu','func','mind'].forEach(t=>{
    document.getElementById(t+'_'+id).classList.toggle('active',t===tab);
  });
  document.querySelectorAll('#tabs_'+id+' .rtab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function toggleNut(id){
  const el=document.getElementById(id);
  el.classList.toggle('open');
  const exp=document.getElementById('exp_'+id);
  if(exp)exp.textContent=el.classList.contains('open')?'▴':'▾';
}

function restart(){
  picked=[];diagAnswers={};
  document.querySelectorAll('.belief-card').forEach(c=>{c.classList.remove('picked');const ch=c.querySelector('.bc-check');if(ch)ch.textContent='';});
  document.getElementById('pcount').textContent='0 已選';
  document.getElementById('btn-next').disabled=true;
  go(1);
}

init();
</script>
</body>
</html>
