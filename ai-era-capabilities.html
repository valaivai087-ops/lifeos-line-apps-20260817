        .card-toggle.open {transform:rotate(180deg);}
        .card-content {padding:0; max-height:0; overflow:hidden; transition:max-height 0.3s ease;}
        .card-content.open {max-height:4000px; padding:18px;}
        .bilingual {display:grid; grid-template-columns:1fr 1fr; gap:18px;}
        .lang-section {padding:12px; background:#f9f9f9; border-radius:6px; border-left:4px solid #0A7A72;}
        .lang-section.en {border-left-color:#C9960C;}
        .lang-section h3 {color:#1A2B5F; font-size:15px; margin-bottom:8px; font-weight:700; display:flex; align-items:center; gap:6px;}
        .lang-section.en h3 {color:#0A7A72;}
        .tts-btn {background:none; border:none; color:#C9960C; cursor:pointer; font-size:16px; padding:2px 6px;}
        .tts-btn:hover {color:#B8860B; transform:scale(1.1);}
        .content-box {margin:8px 0; padding:10px; background:#fff; border-radius:4px; border-left:3px solid #C9960C;}
        .box-label {font-weight:700; color:#1A2B5F; font-size:13px; display:inline-block; background:#E8F4F8; padding:2px 8px; border-radius:3px; margin-right:8px;}
        .box-label.en {background:#FFF8E8; color:#0A7A72;}
        .tag {display:inline-block; background:#E8F4F8; color:#1A2B5F; padding:4px 8px; margin:3px 3px 3px 0; border-radius:4px; font-size:13px;}
        .tag.en {background:#FFF8E8; color:#0A7A72;}

    document.querySelectorAll('.card-header').forEach(h => {
        h.onclick = function(e) {
            if (e.target.closest('.tts-btn')) return;
            toggleCard(h);
        };
    });
}

function toggleCard(h) {
    h.classList.toggle('active');
    h.querySelector('.card-toggle').classList.toggle('open');
    h.nextElementSibling.classList.toggle('open');
}

function speak(e) {
    e.stopPropagation();
    const text = e.target.closest('.tts-btn').dataset.text;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.85;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
}

document.getElementById('searchInput').addEventListener('input', renderCapabilities);
renderCapabilities();
</script>
</body>
</html>
