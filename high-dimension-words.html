    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
      background: #ffffff;
      color: #0D1B3E;
      line-height: 1.8;
    }

    :root {
      --navy: #0D1B3E;
      --gold: #B8860B;
      --teal: #006B7D;
      --light-navy: #1A2B5F;
      --light-gray: #F5F7FA;
      --border-color: #E0E8F0;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--teal) 100%);
      color: white;
      padding: 3rem 2rem;
      text-align: center;
      border-bottom: 4px solid var(--gold);
    }

    .header h1 {
      font-size: 2.4rem;
      margin-bottom: 0.5rem;
      font-weight: bold;
    }

    .header p {
      font-size: 1.1rem;
      opacity: 0.95;
      letter-spacing: 0.5px;
    }

    /* Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
    }

    .search-box input {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      font-family: 'Microsoft JhengHei', sans-serif;
      transition: border-color 0.3s;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--gold);
    }

    .category-filters {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 0.7rem 1.2rem;
      border: 2px solid var(--border-color);
      background: white;
      color: var(--navy);
      cursor: pointer;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.3s;
      font-family: 'Microsoft JhengHei', sans-serif;
    }

    .filter-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    .filter-btn.active {
      background: var(--navy);
      color: var(--gold);
      border-color: var(--navy);
    }

    /* Stats */
    .stats {
      background: var(--light-gray);
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-around;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .stat-item {
      text-align: center;
    }

    .stat-number {
      font-size: 2rem;
      font-weight: bold;
      color: var(--gold);
    }

    .stat-label {
      font-size: 0.95rem;
      color: var(--light-navy);
      margin-top: 0.3rem;
    }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      gap: 1.8rem;
      margin-bottom: 2rem;
    }

    .card {
      background: white;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 1.8rem;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      border-color: var(--gold);
      box-shadow: 0 8px 24px rgba(13, 27, 62, 0.1);
      transform: translateY(-2px);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--gold);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .card:hover::before {
      opacity: 1;
    }

    .card-category {
      display: inline-block;
      background: var(--light-gray);
      color: var(--teal);
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.8rem;
      letter-spacing: 0.5px;
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--navy);
      margin-bottom: 0.3rem;
    }

    .card-title-en {
      font-size: 1rem;
      color: var(--teal);
      font-style: italic;
      margin-bottom: 0.8rem;
      font-weight: 500;
    }

    .card-definition {
      font-size: 0.95rem;
      color: var(--light-navy);
      margin-bottom: 0.5rem;
      line-height: 1.6;
    }

    .card-definition-en {
      font-size: 0.9rem;
      color: #666;
      font-style: italic;
      margin-bottom: 1rem;
    }

    .card-toggle {
      color: var(--gold);
      font-weight: 600;
      font-size: 0.9rem;
      margin-top: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
    }

    .toggle-icon {
      transition: transform 0.3s;
    }

    .card.expanded .toggle-icon {
      transform: rotate(180deg);
    }

    /* Expanded Content */
    .card-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease-out;
    }

    .card.expanded .card-content {
      max-height: 1000px;
    }

    .content-section {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-color);
    }

    .section-title {
      font-weight: 700;
      color: var(--navy);
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .section-content {
      font-size: 0.95rem;
      color: var(--light-navy);
      line-height: 1.7;
      margin-bottom: 0.8rem;
    }

    .section-content-en {
      font-size: 0.9rem;
      color: #666;
      line-height: 1.7;
      font-style: italic;
    }

    .related-terms {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }

    .tag {
      background: var(--light-navy);
      color: white;
      padding: 0.3rem 0.7rem;
      border-radius: 20px;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .tag-en {
      background: var(--teal);
    }

    .tts-btn {
      background: var(--gold);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 0.8rem;
      transition: all 0.3s;
      font-family: 'Microsoft JhengHei', sans-serif;
    }

    .tts-btn:hover {
      background: var(--navy);
      transform: scale(1.05);
    }

    .tts-btn.playing {
      animation: pulse 0.6s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--light-navy);
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .empty-state h2 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 2rem;
      background: var(--light-gray);
      border-top: 2px solid var(--border-color);
      margin-top: 3rem;
      color: var(--light-navy);
      font-size: 0.95rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .cards-grid {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 1.8rem;
      }

      .controls {
        flex-direction: column;
        gap: 1rem;
      }

      .search-box {
        min-width: unset;
      }

      .category-filters {
        justify-content: center;
      }

      .stats {
        gap: 1rem;
      }
    }

    /* Print Friendly */
    @media print {
      .controls, .header::after {
        display: none;
      }

      .card {
        page-break-inside: avoid;
      }
    }
  </style>

    // State management
    let filteredData = [...vocabularyData];
    let activeCategory = 'all';

    // Initialize
    function init() {
      renderCategoryFilters();
      updateStats();
      renderCards();
    }

    // Render category filters
    function renderCategoryFilters() {
      const filterContainer = document.getElementById('categoryFilters');
      const categories = ['all', ...new Set(vocabularyData.map(item => item.category))];
      
      filterContainer.innerHTML = categories.map(cat => `
        <button class="filter-btn ${cat === 'all' ? 'active' : ''}" onclick="filterByCategory('${cat}')">
          ${cat === 'all' ? '所有類別' : cat}
        </button>
      `).join('');
    }

    // Filter by category
    window.filterByCategory = function(category) {
      activeCategory = category;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.includes(category === 'all' ? '所有' : category));
      });
      
      if (category === 'all') {
        filteredData = [...vocabularyData];
      } else {
        filteredData = vocabularyData.filter(item => item.category === category);
      }
      
      const searchValue = document.getElementById('searchInput').value;
      if (searchValue) {
        filteredData = filteredData.filter(item => 
          item.chinese.includes(searchValue) || 
          item.english.toLowerCase().includes(searchValue.toLowerCase())
        );
      }
      
      updateStats();
      renderCards();
    };

    // Search
    document.getElementById('searchInput')?.addEventListener('input', function(e) {
      const value = e.target.value.toLowerCase();
      
      if (activeCategory === 'all') {
        filteredData = vocabularyData.filter(item =>
          item.chinese.includes(value) ||
          item.english.toLowerCase().includes(value) ||
          item.definition.includes(value)
        );
      } else {
        filteredData = vocabularyData
          .filter(item => item.category === activeCategory)
          .filter(item =>
            item.chinese.includes(value) ||
            item.english.toLowerCase().includes(value) ||
            item.definition.includes(value)
          );
      }
      
      updateStats();
      renderCards();
    });

    // Update stats
    function updateStats() {
      document.getElementById('totalCount').textContent = vocabularyData.length;
      document.getElementById('displayCount').textContent = filteredData.length;
    }

    // Render cards
    function renderCards() {
      const container = document.getElementById('cardsGrid');
      const emptyState = document.getElementById('emptyState');
      
      if (filteredData.length === 0) {
        container.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }
      
      emptyState.style.display = 'none';
      container.innerHTML = filteredData.map(item => `
        <div class="card" data-id="${item.id}">
          <div class="card-category">${item.category}</div>
          <div class="card-title">${item.chinese}</div>
          <div class="card-title-en">${item.english}</div>
          <div class="card-definition">${item.definition}</div>
          <div class="card-definition-en">${item.definitionEn}</div>
          
          <button class="tts-btn" onclick="speakEnglish(${item.id})" style="width: 100%; margin: 1rem 0 0.5rem 0;">
            🔊 播放英文 / Speak English
          </button>
          
          <div class="card-content">
            <div class="content-section">
              <div class="section-title">核心意涵 / Core Essence</div>
              <div class="section-content">${item.essence}</div>
              <div class="section-content-en">${item.essenceEn}</div>
            </div>
            
            <div class="content-section">
              <div class="section-title">實踐應用 / Practical Application</div>
              <div class="section-content">${item.application}</div>
              <div class="section-content-en">${item.applicationEn}</div>
            </div>
            
            <div class="content-section">
              <div class="section-title">相關詞彙 / Related Terms</div>
              <div class="related-terms">
                ${item.relatedTerms.map(term => `<span class="tag">${term}</span>`).join('')}
                ${item.relatedTermsEn.map(term => `<span class="tag tag-en">${term}</span>`).join('')}
              </div>
            </div>
          </div>
          
          <div class="card-toggle" onclick="toggleCard(this)">
            <span>展開詳情 / Expand</span>
            <span class="toggle-icon">▼</span>
          </div>
        </div>
      `).join('');
      
      // Add click handlers
      document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', function(e) {
          if (e.target.closest('.tts-btn')) return;
          toggleCard(this.querySelector('.card-toggle'));
        });
      });
    }

    // Toggle card expansion
    window.toggleCard = function(toggleElement) {
      const card = toggleElement.closest('.card');
      card.classList.toggle('expanded');
    };

    // Text-to-speech
    window.speakEnglish = function(id) {
      const item = vocabularyData.find(v => v.id === id);
      if (!item || !('speechSynthesis' in window)) return;
      
      window.speechSynthesis.cancel();
      
      const textToSpeak = `${item.english}. ${item.definitionEn}. ${item.essenceEn}`;
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      
      const btn = document.querySelector(`[onclick="speakEnglish(${id})"]`);
      btn.classList.add('playing');
      utterance.onend = () => btn.classList.remove('playing');
      
      window.speechSynthesis.speak(utterance);
    };

    // Initialize on load
    document.addEventListener('DOMContentLoaded', init);
  </script>

function count(t){return (t.match(/[一-鿿]/g)||[]).length+(t.match(/[A-Za-z][A-Za-z'’\-]*/g)||[]).length;}

function build(it,v){
  const d=D[it.domain],k=it.idx+(v||0),L=[];
  const add=(zh,en)=>{if(zh)L.push(zh);if(en)L.push(en);};
  const gap=()=>L.push('');
  const rot=(arr,n,off)=>{const o=[];for(let i=0;i<Math.min(n,arr.length);i++)o.push(arr[(k+(off||0)+i)%arr.length]);return o;};
  const name={zh:it.zh,en:'"'+it.en+'"'};

  add('【'+it.hook.zh+'】',it.hook.en);gap();
  add('你是不是也這樣？','Does this sound like you?');
  it.pains.forEach(p=>add('・'+p.zh,p.en?'· '+p.en:''));gap();
  const t=TURN[k%TURN.length](name);add(t.zh,t.en);gap();

  add('▍為什麼會這樣｜Why it happens');add(d.why.zh,d.why.en);gap();

  add('▍核心｜The core：'+it.zh+' '+it.en);
  add(it.core.zh,it.core.en);
  if(it.core2)add(it.core2.zh,it.core2.en);gap();

  add('▍從舊模式，到新能力｜From old pattern to new ability');
  const pairLines=(it.pairs||[]).map(p=>P('不是'+q(p.o.zh)+'，而是'+q(p.n.zh)+'。',(p.o.en&&p.n.en)?'Not '+qe(p.o.en)+' — but '+qe(p.n.en)+'.':''));
  pairLines.forEach(p=>add(p.zh,p.en));
  const sh=rot(d.shift,pairLines.length?3:4,0);
  add('當你開始練習「'+it.zh+'」——','When you begin to practise '+name.en+' —');
  sh.forEach(p=>add(p.zh,p.en));d.find.forEach(p=>add(p.zh,p.en));gap();

  add('▍金句｜Words to keep');
  const gq=x=>P('「'+fin(clean(x.zh),'。')+'」',x.en?'"'+fin(clean(x.en),'.')+'"':'');
  const gold=(it.quotes||[]).map(gq).concat(rot(d.gold,4,1).map(gq));
  gold.forEach(p=>add(p.zh,p.en));gap();

  add('▍三個小練習｜Three small practices');
  d.practice.forEach(p=>add(p.zh,p.en));gap();

  add('▍能力更新，智慧長出來｜Ability updated, wisdom grows');
  WISDOM[k%WISDOM.length].concat(WISDOM[(k+1)%WISDOM.length]).forEach(p=>add(p.zh,p.en));gap();

  add('▍寫給你｜A note to you');add(d.note.zh,d.note.en);gap();

  add('🌱 今天的小步｜'+it.step.zh,it.step.en?'🌱 Today\'s small step: '+it.step.en:'');gap();
  const c=CLOSE[k%CLOSE.length];add(c.zh,c.en);gap();
  const tagName='#'+it.zh.replace(/[\s、，—\-·．.]/g,'');
  L.push(['#心靈雞湯','#自我成長',tagName,d.tags,(it.tags||[]).map(x=>'#'+String(x).replace(/\s/g,'')).join(' '),'#HealingWords #LifeOS'].filter(Boolean).join(' '));

  const cq=(it.quotes&&it.quotes.length)?it.quotes[k%it.quotes.length]:it.core;
  const first=s=>{const m=String(s).match(/^.*?[。！？!?.](?=\s|$|[^\d])/);return clean(m?m[0]:s);};
  const short=(s,n,dot)=>String(s).trim().length<=n?fin(String(s).trim().replace(/[。.]$/,''),dot):fin(first(s),dot);
  return {text:L.join('\n'),card:{
    hook:it.hook.zh,
    quote:short(cq.zh,34,'。'),
    quoteEn:cq.en?short(cq.en,90,'.'):'',
    lines:(pairLines.length?pairLines:sh).slice(0,3).map(p=>p.zh),
    step:it.cardStep||short(it.step.zh,44,'。'),
    name:it.zh+'｜'+it.en
  }};
}

/* ── 圖卡（1080×1350 Canvas）── */
const ZH='"Microsoft JhengHei","PingFang TC","Noto Sans TC","Heiti TC",sans-serif';
function wrap(ctx,text,maxW){
  const tk=String(text).match(/[A-Za-z0-9'’\-]+[.,!?;:]?\s?|\s+|[^\sA-Za-z0-9]/g)||[];
  const noHead='，。！？、；：」』）)…—';
  const noTail='「『（(“"';
  const out=[];let cur=[];
  const push=()=>{const s=cur.join('').trim();if(s)out.push(s);};
  tk.forEach(w=>{
    if(cur.join('').trim()&&ctx.measureText(cur.join('')+w).width>maxW){
      // 標點不放行首、上引號不放行尾：把前一個字一起帶到下一行
      const carry=[];
      if(noHead.indexOf(w)>=0&&cur.length>1)carry.unshift(cur.pop());
      while(cur.length>1&&noTail.indexOf(cur[cur.length-1].trim())>=0)carry.unshift(cur.pop());
      push();cur=carry.concat(w.replace(/^\s+/,''));
    }else cur.push(w);
  });
  push();
  return out;
}
function drawCard(cv,card,theme){
  const W=1080,H=1350,ctx=cv.getContext('2d');cv.width=W;cv.height=H;
  const X=80,MW=W-160;
  function lay(s,paint){
    const f=(px,wt,fam)=>{ctx.font=(wt||'')+' '+Math.round(px*s)+'px '+(fam||ZH);};
    const text=(arr,x,y,lh,col)=>{if(paint){ctx.fillStyle=col;arr.forEach((l,i)=>ctx.fillText(l,x,y+i*lh));}return y+arr.length*lh;};
    ctx.textBaseline='top';
    // 標頭：痛點
    f(46,'bold');const hk=wrap(ctx,card.hook,MW);
    const headH=Math.round(70+44*s+18+hk.length*62*s+48);
    if(paint){ctx.fillStyle='#FAF6EF';ctx.fillRect(0,0,W,H);ctx.fillStyle=theme.color;ctx.fillRect(0,0,W,headH);
      f(30,'');ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillText('你是不是也這樣？',X,70);}
    f(46,'bold');let y=text(hk,X,70+44*s+18,62*s,'#fff');
    y=headH+90*s;
    // 金句
    f(66,'bold');const ql=wrap(ctx,card.quote,MW);y=text(ql,X,y,92*s,'#2B2622')+18*s;
    if(card.quoteEn){f(30,'italic','Georgia,"Times New Roman",serif');y=text(wrap(ctx,card.quoteEn,MW),X,y,42*s,'#8A7F76');}
    y+=50*s;
    // 排比框
    f(34,'');const bl=[];card.lines.forEach(l=>wrap(ctx,l,MW-110).forEach(x=>bl.push(x)));
    const bh=bl.length*56*s+64*s;
    if(paint){ctx.fillStyle=theme.tint;rr(ctx,X-20,y,MW+40,bh,28);ctx.fill();ctx.fillStyle=theme.color;ctx.fillRect(X-20,y+24,10,bh-48);}
    text(bl,X+32,y+34*s,56*s,'#3A332E');y+=bh+48*s;
    // 今天的小步
    f(27,'');const pw=ctx.measureText('今天的小步').width+48,ph=54*s;
    if(paint){ctx.fillStyle=theme.color;rr(ctx,X,y,pw,ph,ph/2);ctx.fill();ctx.fillStyle='#fff';ctx.fillText('今天的小步',X+24,y+(ph-27*s)/2-2);}
    y+=ph+22*s;
    f(34,'bold');y=text(wrap(ctx,card.step,MW),X,y,52*s,'#2B2622');
    return y;
  }
  let s=1.3;while(s>0.55&&lay(s,false)>H-170)s-=0.03;
  lay(s,true);
  ctx.fillStyle='#E4DAD0';ctx.fillRect(X,H-130,MW,3);
  ctx.textBaseline='top';ctx.font='bold 32px '+ZH;ctx.fillStyle=theme.color;ctx.fillText(theme.brand,X,H-96);
  ctx.font='28px '+ZH;ctx.fillStyle='#8A7F76';const tg='#心靈雞湯';ctx.fillText(tg,W-X-ctx.measureText(tg).width,H-94);
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

const $=id=>document.getElementById(id);

@media print{#fbpFab,#fbpMask,.fbp-btn{display:none!important}}`;
  document.head.appendChild(st);
  document.documentElement.style.setProperty('--fbp-c',CFG.color);
  const fab=document.createElement('button');fab.id='fbpFab';fab.className='fbp-btn';fab.textContent='📣 臉書貼文＋圖卡';

   '<div id="fbpList"></div><div id="fbpMain"><div><textarea id="fbpText" spellcheck="false"></textarea><div id="fbpBar">'+

   '<button class="fbp-btn fbp-g" id="fbpNext">🔄 換一版</button><button class="fbp-btn fbp-g" id="fbpTxt">💾 貼文 TXT</button>'+
   '<button class="fbp-btn fbp-g" id="fbpAll">📦 全部貼文 TXT</button><span id="fbpCnt"></span></div></div>'+
   '<div><canvas id="fbpCanvas"></canvas></div></div></div>';
  document.body.appendChild(m);
  m.addEventListener('click',e=>{if(e.target===m)close();});
  $('fbpX').onclick=close;
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});

  $('fbpNext').onclick=()=>{ver++;show();};
  $('fbpCopy').onclick=function(){const t=$('fbpText');const done=()=>flash(this,'✅ 已複製');
    if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t.value).then(done,()=>{t.select();document.execCommand('copy');done();});
    else{t.select();document.execCommand('copy');done();}};
  $('fbpPng').onclick=()=>$('fbpCanvas').toBlob(b=>save(b,fname()+'.png'));
  $('fbpTxt').onclick=()=>save(new Blob(['﻿'+$('fbpText').value],{type:'text/plain;charset=utf-8'}),fname()+'.txt');
  $('fbpAll').onclick=()=>save(new Blob(['﻿'+ITEMS.map(it=>'════ '+it.no+' '+it.zh+' ════\n\n'+build(it,0).text).join('\n\n\n')],{type:'text/plain;charset=utf-8'}),CFG.brand+'_全部臉書貼文.txt');
}
function flash(b,t){const o=b.textContent;b.textContent=t;setTimeout(()=>b.textContent=o,1200);}
function fname(){return (CFG.brand+'_'+cur.no+'_'+cur.zh).replace(/[\\/:*?"<>|\s]+/g,'_');}
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
function list(){
  const kw=$('fbpSearch').value.trim().toLowerCase();
  const box=$('fbpList');box.innerHTML='';
  ITEMS.filter(it=>!kw||(it.no+' '+it.zh+' '+it.en).toLowerCase().indexOf(kw)>=0).forEach(it=>{
    const b=document.createElement('button');b.textContent=it.no+' '+it.zh;if(cur&&it.id===cur.id)b.className='on';
    b.onclick=()=>open(it.id);box.appendChild(b);
  });
}
function show(){
  const r=build(cur,ver);
  $('fbpTitle').textContent='📣 '+cur.no+' '+cur.zh+'｜'+cur.en;
  $('fbpText').value=r.text;$('fbpText').scrollTop=0;
  $('fbpCnt').textContent='約 '+count(r.text)+' 字（中文字＋英文單字）';
  drawCard($('fbpCanvas'),r.card,{color:CFG.color,tint:CFG.tint,brand:CFG.brand});
}
function open(id){
  const it=ITEMS.find(x=>String(x.id)===String(id));if(!it)return;
  if(!cur||cur.id!==it.id)ver=0;cur=it;
  $('fbpMask').classList.add('on');list();show();
  const on=$('fbpList').querySelector('.on');if(on)on.scrollIntoView({block:'nearest'});
}
function close(){$('fbpMask').classList.remove('on');}
function mount(){
  (CFG.mounts()||[]).forEach(m=>{
    if(!m||!m.el||m.el.querySelector(':scope > .fbp-btn'))return;
    const b=document.createElement('button');b.type='button';b.className='fbp-btn';b.textContent='📣 貼文＋圖卡';
    b.addEventListener('click',e=>{e.stopPropagation();e.preventDefault();open(m.id);});
    m.el.appendChild(b);
  });
}
function init(cfg){
  CFG=cfg;
  const go=()=>{
    ITEMS=cfg.items().map((it,i)=>{it.idx=i;it.domain=cfg.domain;return it;});
    ui();mount();
    let tm=null;new MutationObserver(()=>{clearTimeout(tm);tm=setTimeout(mount,150);}).observe(document.body,{childList:true,subtree:true});
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(go,0));else setTimeout(go,0);
}
window.FBPost={init:init,build:build,count:count,P:P,open:open,items:()=>ITEMS};
})();
