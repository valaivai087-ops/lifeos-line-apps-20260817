<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>脾胃 LifeOS｜智慧腸腦生活筆記</title><style>
:root{--ink:#203b35;--green:#235e4b;--paper:#f4f3ec;--line:#d8dfd5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 "Microsoft JhengHei",sans-serif}header{padding:32px max(5vw,20px);background:#173d32;color:white}header .badge{color:var(--ink)}header small{color:#bee0bd;letter-spacing:3px}h1{font-size:clamp(28px,4vw,46px);margin:8px 0}h2{margin-top:0}nav{display:flex;gap:8px;flex-wrap:wrap;padding:16px 5vw;background:#e7ece2;position:sticky;top:0;z-index:2}button,.link{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:10px;background:white;padding:9px 15px;color:var(--ink)}button:hover,button.active{background:var(--green);color:white}main{max-width:1180px;margin:auto;padding:28px 20px 70px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}.badge{display:inline-block;background:#edf3e9;border-radius:30px;padding:3px 10px;font-size:13px}.muted{color:#63776e}.hero{background:#dae7d3}.stats{display:flex;gap:30px;flex-wrap:wrap}.stats b{display:block;font-size:32px}input,select,textarea{width:100%;padding:11px;border:1px solid #b6c6bb;border-radius:8px;font:inherit;background:white;color:var(--ink)}label{display:block;margin:12px 0}label input[type=checkbox]{width:auto}textarea{min-height:90px}details{border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:bold}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid var(--line);padding:10px}.scroll{overflow:auto}.actions{display:flex;gap:10px;flex-wrap:wrap}.notice{padding:14px;border-left:4px solid #b6914b;background:#fff8e8;margin:16px 0}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#173d32;color:white;border-radius:10px;padding:12px 22px;z-index:4;display:none}footer{font-size:13px;color:#63776e;margin-top:24px}.empty{padding:24px;text-align:center;color:#63776e}a{color:var(--green)}@media(max-width:600px){nav{position:static;padding:12px}nav button{flex:1 1 40%;padding:8px}main{padding:18px 12px}.card{padding:17px}}
</style></head><body><header><small>LIFEOS · OFFLINE EDITION</small><h1>脾胃 LifeOS</h1><p>智慧腸腦生活筆記｜從生活語境出發，找回歷史資料的完整脈絡。</p><span class="badge">離線單檔 · 重建版 1.1 · 2026/10/13</span></header><nav id="nav"></nav><main id="app"></main><div id="toast" role="status" aria-live="polite"></div><script>
'use strict';
const modules=[
['生活總覽','語言與命名','生活情境','個人目標','每日回顧'],
['脾胃資料庫','脾胃語彙','肝脾敘事','體態與感受','調理主張'],
['腸腦研究索引','腸腦軸','菌群與屏障','代謝訊號','研究閱讀'],
['生活主題索引','身體感受資料','飲食資料','睡眠與情緒資料','歷史情境'],
['三階段生活支持','先降速','再消化','最後代謝','行動反思'],
['團購與產品','產品資料','成分筆記','團購意向','訂單草稿'],
['原始資料導覽','主題原文','日期索引','來源對照','閱讀脈絡'],
['智慧更新','主題搜尋','關聯提示','內容匯入','版本紀錄']
];
const topics=[
['2025/01','憂思與脾胃','憂思傷脾、脾胃與氣血、焦慮失眠、心脾兩虛、痰濕失眠、揉腹與健脾飲食。',[0,1,3]],
['2025/04','肝脾與經典語彙','《黃帝內經》木剋土、肝脾關係、太陰病、脾陽虛、寒濕、理中湯、四君子湯、黨參、白朮、茯苓。',[1]],
['2025/05','體態與消化感受','體型與臟腑、胃部突出、下腹鬆軟、胃氣不降、胃脹、便秘、胃食道逆流、消化酵素與益生菌。',[1,3,5]],
['2025/10','運化、情緒與體態','脾主運化、脾主統血、思傷脾、脾虛濕阻、肝鬱、寒濕、痰濕、血瘀與體態。',[1,3]],
['2025/10','屏障與丁酸研究索引','腸道屏障、丁酸、丁酸鈉、單丁酸甘油、三丁酸甘油酯、腸道菌群、粒線體與能量代謝。',[2,5]],
['2025/10','調理主張存檔','砭法、穴位、薏仁、辟谷與排病反應等調理主張。',[1]],
['2025/11','脾胃症狀分類語彙','脾虛、脾陽虛、胃陰虛、胃熱、濕熱、脾虛濕阻、肝鬱脾虛與症狀分類。',[1,3]],
['2025/11','產品與方案名稱','消化酵素粉、全酶、王牌、腸寶、脾胃健、丁酸鈉複方、孢子益生菌、5R、BCB、酶菌醣體。',[5]],
['2025/11','腸腦訊號研究索引','腸腦軸、迷走神經、腸神經系統、GLP-1、PYY、CCK、短鏈脂肪酸、色胺酸與膽汁酸。',[2]],
['2025/11','腹診與身體描述','腹診、坤位、艮位、胃氣不和、脾胃運化、腹部壓痛與穴位調理。',[1,3]],
['2025/12','壓力與腸肝研究索引','肝鬱＋脾虛＋濕氣、交感神經、HPA軸、胃酸、膽汁、胰酶、腸胃蠕動與腸肝軸。',[2,3]],
['2025/12','三階段支持框架','先降速、再消化、最後代謝的三階段支持架構。',[4]],
['2026/10/08','體重管理敘事','難瘦體質、肝鬱氣滯、脾虛濕阻、胃熱、腎陽虛、氣血虛弱與體重管理。',[1,4]],
['其他','長期用藥與代謝資料索引','長期胃酸抑制劑、甜菜鹼HCl、消化酵素、腸道菌相、胃腸黏膜、血糖與代謝支持。',[2,5]]
];
const key='lifeos-offline-v1';let db={products:[],orders:[],updates:[]},volatile=false;
try{const old=JSON.parse(localStorage.getItem(key)||'{}');for(const k of ['products','orders','updates'])if(Array.isArray(old[k]))db[k]=old[k]}catch(e){volatile=true}
function save(){try{localStorage.setItem(key,JSON.stringify(db));toast('已儲存於此瀏覽器')}catch(e){volatile=true;toast('瀏覽器不允許儲存，資料僅保留於目前頁面')}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
function download(name,text,type='application/json'){const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
let page='總覽';const pages=['總覽','8 模組','歷史主題','團購產品','智慧更新'];
function go(p){page=p;document.getElementById('nav').innerHTML=pages.map(n=>`<button class="${n===p?'active':''}" data-page="${n}">${n}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));render()}
const originalDates=['2025年1月','2025年4月','2025年5月','2025年10月','2025年10月','2025年10月','2025年11月','2025年11月','2025年11月','2025年11月','2025年12月','2025年12月','2026年10月8日','其他相關資料'];
const conversationURL='https://chatgpt.com/c/6acd4c14-70cc-83ee-bc0c-555e00cb039f';
function sourceCard(k){const t=topics[k];return `<section class="card source-card" id="source-${k}"><span class="badge">原始主題 ${String(k+1).padStart(2,'0')}</span><h3>${esc(originalDates[k])} · ${esc(t[1])}</h3><blockquote>${esc(String(k+1).padStart(2,'0')+'｜'+originalDates[k]+'：'+t[2])}</blockquote><p class="muted">來源：《整理脾胃資料分析》使用者訊息「歷史資料主題總整理」。此處呈現可取回的清單原文；更早的全文與附件尚未取得。</p><a href="${conversationURL}" target="_blank" rel="noopener">開啟原對話（需網路及原帳號） ↗</a></section>`}
function related(i,j){const precise={0:[0,3],1:[0,10],2:[12],3:[11],4:[1,3,6],5:[1,3,10],6:[2,3,12],7:[5,9],8:[8,10],9:[4,13],10:[8,10],11:[4,8,10,13],12:[2,6,9],13:[0,2,5],14:[0,10],15:[0,2,6,9,10],16:[11],17:[2,11,13],18:[4,11,12],19:[11],20:[7],21:[4,7,13],22:[7],23:[7],24:topics.map((_,k)=>k),25:topics.map((_,k)=>k),26:topics.map((_,k)=>k),27:[0,1,3,11],28:topics.map((_,k)=>k),29:topics.map((_,k)=>k),30:topics.map((_,k)=>k),31:topics.map((_,k)=>k)};return precise[i*4+j]}
function cards(){return modules.map((m,i)=>`<article class="card"><span class="badge">模組 ${i+1}</span><h3>${m[0]}</h3>${m.slice(1).map((n,j)=>`<details class="node"><summary>${String(i*4+j+1).padStart(2,'0')} · ${n}</summary><p>${nodeText(i,j)}</p><h4>關聯歷史主題 · 原始資料</h4>${related(i,j).map(k=>`<details class="related-source"><summary>${String(k+1).padStart(2,'0')}｜${esc(originalDates[k])} · ${esc(topics[k][1])}</summary>${sourceCard(k)}<button data-source="${k}">前往歷史資料頁 →</button></details>`).join('')}</details>`).join('')}</article>`).join('')}
function nodeText(i,j){const descriptions=[['以維根斯坦的語言遊戲觀點，區分「感受描述」「歷史術語」「研究名詞」，避免將名稱直接當成診斷。','以海德格的在世存在觀點，記錄作息、關係、工作與飲食的具體生活情境。','寫下自己想改善的日常經驗，使用可回顧的生活目標。','回看當日經驗與行動，不由單次症狀推定原因。'],['歷史語彙作為資料整理標籤，保留其原有語境。','把肝脾相關敘事連回原主題，不把比喻自動轉為因果。','以本人感受與情境筆記整理體態主題。','保留調理主張供查核；存檔不代表療效已獲驗證。'],['整理前沿研究名詞與待查問題，尚未附原始文獻。','收錄菌群、屏障與丁酸主題索引，不提供療效結論。','收錄訊號與代謝名詞，保持研究問題與個人經驗的區別。','匯入有來源的研究摘要時，保留網址、日期與限制。'],['閱讀原始清單中的身體感受與分類語彙。','查閱飲食與消化相關的原始主題。','找出睡眠、憂思與生活壓力的歷史資料。','按原主題的生活情境閱讀資料。'],['練習注意當下節奏，寫下讓生活放慢的選擇。','觀察用餐情境與舒適度，不設定補充劑用量。','回顧活動、睡眠與日常安排，不承諾代謝效果。','以自己的生活經驗回顧三階段框架。'],['建立產品名稱與成分資料，不預設價格或療效。','記下成分、標示、來源及需要確認的事項。','填寫本機團購意向，匯出交由主辦方處理。','此處為離線草稿，沒有付款或正式下單。'],['展開每筆可取回的原始主題文字。','依原始月份與日期尋找資料。','每筆資料標示原對話及清單來源。','以維根斯坦的語境觀點與海德格的生活脈絡閱讀資料。'],['依文字尋找歷史主題與匯入內容。','以各節點的主題對應找出原始資料。','離線版透過 JSON 手動匯入內容，支援來源欄位。','顯示本機匯入日期及內容數量。']];return descriptions[i][j]}
function render(){const a=document.getElementById('app');let h='';if(volatile)h+='<div class="notice">目前儲存可能受限，產品與更新資料僅保留於目前頁面。</div>';
if(page==='總覽'){h+=`<section class="card hero"><span class="badge">READ IN CONTEXT</span><h2>從主題，找回原始資料。</h2><p>以維根斯坦的語言遊戲與海德格的在世存在作為閱讀框架，沿著節點查看生活語境與前沿研究主題。</p><div class="stats"><div><b>8</b>資料模組</div><div><b>32</b>探索節點</div><div><b>14</b>歷史主題</div></div></section><div class="grid"><section class="card"><h3>節點與原文對照</h3><p>展開節點，再展開「關聯歷史主題」，直接查看原始清單文字與來源。</p><button data-jump="8 模組">探索 32 節點 →</button></section><section class="card"><h3>原始主題資料</h3><p>依關鍵字搜尋 14 筆歷史主題及匯入內容。</p><button data-jump="歷史主題">尋找原始資料 →</button></section></div><div class="notice">已收錄原對話中可取回的 14 主題清單原文。清單所指的更早討論全文與附件尚未取得；可點來源連結回到原對話。歷史主張作為資料存檔。</div>`}
if(page==='8 模組')h+='<h2>8 模組 · 32 節點</h2><p class="muted">點開節點閱讀用途與主題對應。</p><div class="grid">'+cards()+'</div>';
if(page==='歷史主題')h+='<h2>14 歷史主題</h2><label>搜尋主題<input id="search" placeholder="例如：睡眠、丁酸、肝脾"></label><div id="results"></div>';
if(page==='團購產品')h+=`<h2>產品資料與團購意向</h2><p class="muted">離線草稿；不會傳送訂單、收款或確認庫存。原對話未提供商品價格與供應商，因此由您填入。</p><div class="grid"><form id="productForm" class="card"><h3>新增產品</h3><label>名稱<input name="name" required maxlength="100"></label><label>成分、供應商與來源<textarea name="detail" maxlength="3000"></textarea></label><button>儲存產品</button></form><form id="orderForm" class="card"><h3>團購意向</h3><label>產品<select name="product" required><option value="">請選擇</option>${db.products.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select></label><label>數量<input name="qty" type="number" min="1" max="999" value="1" required></label><label>聯絡人<input name="contact" required maxlength="150" value=""></label><button>儲存意向</button></form></div><div class="grid">${db.products.map((p,i)=>`<section class="card"><h3>${esc(p.name)}</h3><p>${esc(p.detail)}</p><button data-del-product="${i}">刪除產品</button></section>`).join('')}</div><section class="card"><h3>團購草稿（${db.orders.length}）</h3>${db.orders.map((o,i)=>`<p>${esc(o.product)} × ${esc(o.qty)} · ${esc(o.contact)} <button data-del-order="${i}">刪除</button></p>`).join('')||'<p class="empty">尚無意向</p>'}<button id="exportOrders">下載團購草稿</button></section>`;
if(page==='智慧更新')h+=`<h2>智慧更新 · 本機規則提示</h2><section class="card"><h3>目前內容</h3><p>內建 14 主題；已匯入 ${db.updates.length} 篇。沒有連線 AI 或背景自動抓取。</p><p>JSON 格式：{"items":[{"title":"標題","content":"摘要","source":"來源網址或書目"}]}。相同標題會更新既有匯入內容。</p><label>匯入內容 JSON<input type="file" id="importContent" accept=".json,application/json"></label><button id="sample">下載更新格式範例</button></section><div class="grid">${db.updates.map(u=>`<section class="card"><h3>${esc(u.title)}</h3><p>${esc(u.content)}</p><p class="muted">來源：${esc(u.source||'未提供')}<br>匯入：${esc(u.imported)}</p></section>`).join('')}</div>`;
a.innerHTML=h+'<footer>LifeOS 離線資料版 · 歷史主題原文與來源對照</footer>';bind();}
function search(q=''){q=q.trim().toLowerCase();const originals=topics.map((t,k)=>({t,k})).filter(({t,k})=>(t[0]+originalDates[k]+t[1]+t[2]).toLowerCase().includes(q)).map(({k})=>sourceCard(k)).join('');const updates=db.updates.filter(u=>(u.title+u.content).toLowerCase().includes(q)).map(u=>`<section class="card"><span class="badge">匯入資料</span><h3>${esc(u.title)}</h3><p>${esc(u.content)}</p><p>來源：${esc(u.source||'未提供')}</p></section>`).join('');document.getElementById('results').innerHTML=originals+updates||'<p class="empty">找不到符合的主題。</p>'}
function form(id,fn){const f=document.getElementById(id);if(f)f.onsubmit=e=>{e.preventDefault();fn(Object.fromEntries(new FormData(f)));save();render()}}
function bind(){document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>go(b.dataset.jump));document.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>{const k=Number(b.dataset.source);go('歷史主題');const el=document.getElementById('source-'+k);el.scrollIntoView({block:'center'});el.style.outline='3px solid #b6914b';});if(document.getElementById('search')){search();document.getElementById('search').oninput=e=>search(e.target.value)}form('productForm',v=>db.products.push(v));form('orderForm',v=>db.orders.push({...v,created:today()}));[['product','products'],['order','orders']].forEach(([tag,k])=>document.querySelectorAll(`[data-del-${tag}]`).forEach(b=>b.onclick=()=>{if(confirm('確定刪除此筆資料？')){db[k].splice(Number(b.getAttribute('data-del-'+tag)),1);save();render()}}));on('exportOrders',()=>download('LifeOS-groupbuy-draft.json',JSON.stringify({status:'本機意向草稿，未送出',orders:db.orders},null,2)));
on('sample',()=>download('LifeOS-update-template.json',JSON.stringify({items:[{title:'我的資料標題',content:'請填寫內容與適用限制',source:'請填寫原始來源'}]},null,2)));file('importContent',async f=>{const x=JSON.parse(await f.text());if(!x||!Array.isArray(x.items)||!x.items.length||x.items.length>500)throw Error('需要 items 陣列，1–500 篇');if(x.items.some(u=>!u||typeof u.title!=='string'||!u.title.trim()||typeof u.content!=='string'||(u.source!==undefined&&typeof u.source!=='string')))throw Error('每篇需要 title 與 content 字串');x.items.forEach(u=>{const item={title:u.title,content:u.content,source:u.source||'',imported:today()};const i=db.updates.findIndex(v=>v.title===u.title);if(i<0)db.updates.push(item);else db.updates[i]=item});save();render()})}
function on(id,fn){const e=document.getElementById(id);if(e)e.onclick=fn}function file(id,fn){const e=document.getElementById(id);if(e)e.onchange=async()=>{try{const f=e.files[0];if(f){if(f.size>5e6)throw Error('檔案限 5 MB');await fn(f)}}catch(err){toast('匯入失敗：'+err.message)}finally{e.value=''}}}
go('總覽');
</script></body></html>
