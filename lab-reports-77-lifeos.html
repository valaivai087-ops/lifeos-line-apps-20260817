:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mu:#667085;--ln:#e3e6ec;--ac:#0f766e;--acbg:#e6f4f2;--warn:#b45309;--warnbg:#fff7e6}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.65 "Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);padding:10px 16px}
.wrap{max-width:980px;margin:0 auto}

.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
button,.chip{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;font-family:inherit}
button.on{background:var(--ac);border-color:var(--ac);color:var(--bg);font-weight:700}
.tabs button{border-radius:8px;padding:6px 12px;font-size:14px}
main{padding:14px 16px 60px}
details,.box{background:var(--card);border:1px solid var(--ln);border-radius:10px;margin-bottom:8px}

summary::-webkit-details-marker{display:none}
.no{font-variant-numeric:tabular-nums;color:var(--mu);min-width:26px}
.nm{font-weight:700}
.tag{font-size:12px;color:var(--ac);background:var(--acbg);border-radius:6px;padding:1px 6px;white-space:nowrap}
.one{color:var(--mu);font-size:13.5px;flex:1}
.bd{padding:2px 14px 12px;border-top:1px solid var(--ln)}
.f{margin-top:9px}
.f b{display:block;font-size:12px;color:var(--ac);letter-spacing:.03em}
.box{padding:12px 14px}
.box h3{margin:0 0 6px;font-size:15.5px}
.pre{white-space:pre-wrap}
.grp{margin:16px 0 6px;font-weight:700;font-size:14px;color:var(--mu)}
.trk{margin-top:10px;padding:10px;border:1px dashed var(--ln);border-radius:8px}
.trk input,.trk select,textarea{border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--tx);padding:5px 7px;font:inherit;font-size:14px}
.trk input[type=text]{width:92px}
.trk .note{width:100%;margin-top:6px}
.res{margin-top:6px;font-weight:700}
.warn{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13.5px;margin-bottom:10px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{border-bottom:1px solid var(--ln);padding:6px;text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
textarea{width:100%;min-height:70px}
body.lv1 .l2,body.lv1 .l3,body.lv2 .l3{display:none}
.hl{background:var(--acbg);border-left:4px solid var(--ac);border-radius:8px;padding:10px 14px;font-size:16.5px;font-weight:700;line-height:1.6}
.box details{background:var(--bg)}
.lab{display:flex;gap:10px;align-items:baseline;margin-top:5px;flex-wrap:wrap}
.lab button{border-radius:6px;font-weight:700}
.lab span{color:var(--mu);font-size:13.5px}
.mu{color:var(--mu);font-size:13px}

<script>
const SYS=[['A','🩸','血液・造血',1,16],['B','🔥','發炎・免疫',17,25],['C','🫀','肝膽・蛋白',26,33],['D','💧','腎臟・泌尿',34,44],['E','🍬','血糖・脂質・代謝',45,54],['F','🦠','胰臟・腸道',55,59],['G','⚙️','甲狀腺・營養・電解質',60,67],['H','🎗','腫瘤標記',68,72],['I','🧠','神經・壓力・生活',73,77],['X','➕','延伸Sensor',78,83]];
// [編號,名稱,系統標籤,一句話,對應方向,L1,L2,L3,差異,生成機制,代表意義,前後判讀,會員白話詳解,產品對應原則]
const L=[
[1,'CBC全血球計數','🩸血液','血液的總體健檢','拆看紅、白血球與血小板','血液總體健檢。','不是一個數字，要拆WBC、RBC、Hb、Platelet等看。','先找到是哪類血球異常→找原因→確認營養缺口；產品可依實際缺乏考慮王牌／B群，不是CBC紅字就補。','紅血球、白血球、血小板可能各自改變。','骨髓製造＋細胞消耗／破壞＋失血＋感染發炎＋藥物＋疾病共同生成。','不是單一疾病，而是「血液系統整體Pattern改變」。','不看單一總值，拆血球項目比較','「血液的總體健康報告」。可以初步看到有沒有貧血、感染或血球異常的線索。不是看到CBC有紅字就開始補營養素，要先看是哪一項異常。產品依真正缺口再決定王牌、B群等基礎營養支持。','CBC不是單一指標，必須拆成WBC、RBC、Hb、Hct、MCV、MCH、MCHC、RDW、Platelet及白血球分類。先找異常來源，再談營養支持。'],
[2,'WBC白血球','🩸血液','防衛部隊總人數','感染／發炎／藥物等','防衛部隊總人數。','高可能見於感染、發炎等；低也可能與感染、藥物、骨髓等有關。','先找Cause；沒有直接「升白血球」團購產品；營養不足才考慮王牌／D＋K／B群Support。','','骨髓生成↔組織動員↔感染／發炎↔藥物／疾病↔細胞消耗。','↑可能是防禦系統被動員；↓可能是生成不足、消耗或藥物等；不是「免疫力分數」。','越高不等於越好；看是否回到適當範圍＋原因','「身體防衛部隊的總人數」。高不一定代表免疫力很好，低也不只是「免疫力不好」。感染、藥物、壓力、疾病、骨髓狀態等都可能影響。沒有「看到WBC低就一定吃」的產品。','WBC↑可能涉及感染、發炎、壓力、藥物等；WBC↓可能涉及感染、藥物、骨髓問題、營養問題等。不可使用「白血球低→吃提升免疫產品」的直線模型。Support候選＝王牌＋D＋K等基礎營養，但必須先確認真正缺口。癌症治療造成的白血球／嗜中性球下降尤其不是保健品自行處理問題。Model：WBC abnormal→Cause First→Medical Evaluation→Nutrition Support。'],
[3,'Neutrophil／ANC嗜中性球','🩸血液','第一線抗菌部隊','太低注意感染風險','第一線抗菌部隊。','太低時感染風險可能增加，化療病友尤其重要。','醫療優先；不要自行靠「提升免疫」產品處理；嚴重免疫低下時益生菌也先詢問醫療團隊。','','骨髓生成→血液釋放→感染現場消耗。','反映第一線抗菌細胞的可用量；過低時感染風險特別重要。','低值回升可能有意義；過低尤其重視感染風險','「第一線抗菌部隊還剩多少人」。尤其化療病友，這個數字很重要。太低時首先不是找「提升免疫」保健品，而是先問醫療團隊。','ANC比單看WBC更能協助判斷嗜中性球減少程度。ANC低尤其在化療患者代表重要感染風險資訊。產品不是第一控制變數，第一順位＝醫療團隊。不要建立「NAC／益生菌→升ANC」宣稱；嚴重免疫抑制時益生菌更需要先詢問醫療團隊。'],
[4,'Lymphocyte淋巴球','🩸免疫','精準免疫部隊的一部分','不能直接等於免疫力','免疫精準防衛部隊的一部分。','高低不能直接翻譯成「免疫力好／差」。','結合WBC分類、疾病與藥物判讀；營養缺口才考慮王牌／D＋K／B群Support。','','感染、免疫活化、壓力荷爾蒙、藥物與血液／免疫疾病等共同影響。','反映免疫系統狀態的一個切面，不等於單純「免疫變強／變弱」。','不追求越高；看範圍＋WBC分類＋臨床背景','「免疫部隊中的情報、抗體與精準防禦相關部隊」。高低都需要配合其他資料解讀，不是單純的免疫力分數。','可作為免疫與血液評估的一部分。「淋巴球低＝免疫力差＝補免疫產品」過度簡化。產品只能放在營養支持層：王牌、D＋K、B群，其他依營養缺口。'],
[5,'RBC紅血球','🩸血液','運送氧氣的小貨車數量','貧血Pattern','運送氧氣的小貨車數量。','低值可能是貧血線索，但不能單獨判斷原因。','一起看Hb＋Hct＋MCV＋Ferritin等，再決定是否需要特定營養支持。','','骨髓造血＋EPO訊號＋鐵／B12／葉酸原料＋失血／破壞＋血液濃縮程度。','反映「紅血球數量」變化，不等於送氧能力全部。','配Hb／MCV一起看','「身體有多少台運送氧氣的小貨車」。但只有貨車數量還不夠，還要看每台車載多少氧氣，所以必須一起看Hb、Hct、MCV等。','RBC異常需與Hb、Hct、MCV、MCH、RDW一起判讀。不要單看RBC推薦產品。'],
[6,'Hb血紅素','🩸血液','血液運送氧氣的能力','貧血原因','血液送氧能力的重要指標。','低可能是貧血，但缺鐵只是眾多原因之一。','查缺鐵、B12／葉酸、失血、慢性病、腎病、地中海型貧血等；確認相關缺乏才使用B群等。','','紅血球數量×每顆紅血球血紅素量＋水分狀態。','較直接反映血液攜氧能力與貧血Pattern。','原本偏低後回升可支持貧血改善，但仍看Cause','「送氧氣的能力夠不夠」。Hb低的人可能容易疲勞、喘、心悸，但原因很多：缺鐵只是其中之一，還可能是B12／葉酸不足、失血、腎臟疾病、慢性疾病或地中海型貧血等。不是Hb低就亂補鐵。','Hb↓→先辨識貧血。可能來源：缺鐵、B12／葉酸不足、慢性疾病、腎臟疾病、出血、溶血、骨髓問題、地中海型貧血等。B群僅在相關營養缺乏成立時才有邏輯。不能看到Hb低就直接補鐵或B群；地中海型貧血不能把「貧血」直接等同「缺鐵」。'],
[7,'Hct血比容','🩸血液','血液中紅血球的比例','配Hb／RBC看','血液中有多少比例是紅血球。','通常與Hb、RBC一起判讀。','不要單看Hct推薦產品；先建立完整貧血Pattern。','','紅血球總量÷血液總容量。','同時受到紅血球與水分影響；脫水也可能使數值看起來升高。','與Hb／RBC同步判讀','「一杯血裡面，有多少比例是運氧紅血球」。通常和RBC、Hb一起看。','與RBC、Hb共同判讀。Lab→Anemia Pattern→Cause→Targeted Nutrition。'],
[8,'MCV','🩸血液','紅血球平均大小','缺鐵／B12／葉酸等線索','紅血球平均大小。','小顆常往缺鐵／地中海型貧血等方向查；大顆可能往B12／葉酸等方向查。','MCV→Ferritin／B12／Folate等→確認Cause；B群只有相關缺乏時才精準。','紅血球變大／變小。','DNA合成＋血紅素製造＋鐵／B12／葉酸＋遺傳造血特性。','回答的不是「有沒有貧血」，而是「這批紅血球長什麼樣」。','不是追求升或降，而是看異常Pattern是否修正','「你的紅血球平均是大顆還是小顆」。小顆可能讓醫師想到缺鐵、地中海型貧血等；大顆可能想到B12、葉酸不足或其他原因。記住：「同樣是貧血，原因可以完全不同。」','MCV↓＝小球性Pattern（缺鐵、地中海型貧血等）。MCV↑＝大球性Pattern（B12／葉酸不足、酒精、肝病、某些藥物等）。B群只能放在「確認B12／葉酸等相關缺乏」的支線。相同「貧血」Output，可以來自完全不同Mechanism。'],
[9,'MCH','🩸血液','每顆紅血球帶多少血紅素','貧血分類','每顆紅血球大約帶多少血紅素。','不能單獨診斷貧血原因。','配MCV＋MCHC＋Hb＋Ferritin判讀；無直接產品。','','每顆紅血球大小＋其中血紅素量。','協助辨識紅血球製造Pattern。','配MCV／Hb判讀','「每台紅血球貨車裡，大概裝了多少運氧設備」。通常不是單獨判讀，要跟MCV、Hb、Ferritin等一起看。','協助建立紅血球Pattern，不直接對應單一產品。與MCV、Ferritin、Iron、TIBC、B12、Folate等一起判讀。'],
[10,'MCHC','🩸血液','紅血球內血紅素濃度','貧血分類','紅血球裡血紅素有多濃。','異常只是Pattern的一部分。','與其他血球指標一起找Cause，不直接配產品。','','血紅素量相對於紅血球體積的比例。','回答「每顆紅血球裡血紅素濃不濃」。','不單獨判斷改善','同MCH：通常不是單獨判讀，要跟MCV、Hb、Ferritin等一起看；先找原因。','協助建立紅血球Pattern，不直接對應單一產品。'],
[11,'RDW','🩸血液','紅血球大小整不整齊','協助區分貧血','紅血球大小整不整齊。','越不整齊，代表紅血球大小差異較大。','可協助區分不同貧血Pattern；沒有直接產品。','','新舊紅血球大小差異＋造血原料改變＋骨髓重新製造。','高＝紅血球尺寸異質性增加；有時治療初期反而暫時升高。','治療過程可能暫時變化，需配其他貧血指標','「你的紅血球是不是有的大、有的小，很不整齊」。可以幫助醫師進一步區分不同類型的貧血。','反映紅血球大小變異程度，可協助貧血鑑別。沒有直接產品對應，先Diagnosis。'],
[12,'Platelet血小板','🩸血液','血管破掉時的補洞隊','凝血／出血','血管破掉時的補洞隊。','太低可能增加出血風險；太高也需要找原因。','明顯異常先醫療評估；EPA＋DHA、銀杏等在出血風險／抗凝血用藥者要特別確認安全性。','','骨髓製造↔消耗↔破壞↔發炎刺激↔脾臟分布。','凝血系統的一個重要Sensor；不是越高越好。','過高、過低都不是目標','「血管破掉時，負責第一時間補洞的維修隊」。若血小板低、容易出血，或正在吃抗凝血／抗血小板藥物，EPA＋DHA、銀杏等補充品更需要先詢問醫師或藥師。','高或低都有不同原因；血小板過低涉及出血風險，不能用營養素自行矯正。EPA／DHA、銀杏等在有出血風險或使用抗凝血／抗血小板藥物者，更應先確認安全性。'],
[13,'Ferritin鐵蛋白','🩸血液','身體的鐵倉庫','缺鐵＋發炎一起想','身體鐵倉庫。','很低支持缺鐵；高不等於一定鐵過多，發炎也會影響。','搭配CBC＋Iron＋TIBC／TSAT＋CRP判讀；不要只看Ferritin就補鐵。','','鐵儲存＋發炎急性期反應＋肝臟狀態等。','低值很有助於辨識缺鐵；高值卻不能直接翻譯成「鐵很多」。','低值回升可能補庫存；高值下降是否改善需看CRP等','「身體的鐵倉庫大概還剩多少存貨」。很低時比較支持缺鐵；但高不代表一定鐵太多，發炎、肝臟等因素也可能讓它升高。','Ferritin＝鐵儲存的重要指標，但也是急性期反應蛋白。產品不要直接對應，應走：Ferritin＋Iron＋TIBC／Transferrin Saturation＋CBC＋CRP→Pattern。'],
[14,'Serum Iron血清鐵','🩸血液','血液中目前流動的鐵','配Ferritin等看','目前血液裡流動的鐵。','波動較大，單項資訊有限。','與Ferritin／TIBC／TSAT一起看，再決定是否需要營養介入。','','飲食吸收＋鐵轉運＋儲存釋放＋日內波動。','比較像「現在道路上跑著多少鐵」，不是整個鐵倉庫。','波動大，不適合單項做前後成效','「現在血液裡正在流動的鐵」。一天之中都可能變動，所以不能只看這個數字就決定要不要補鐵。','單獨Serum Iron波動大，不應單項決定補鐵。與Ferritin、TIBC、TSAT共同判讀。'],
[15,'Vitamin B12','🩸營養','造血與神經的重要原料','B12狀態','造血＋神經的重要營養素。','低值可能來自攝取不足或吸收問題等。','找原因→確認產品實際B12劑量→B群／王牌Support→Retest。','','攝取＋胃腸吸收＋肝臟儲存＋補充。','反映B12狀態的一部分；需結合症狀與其他相關指標。','缺乏者補充後回升才具有明確意義','「造血與神經系統的重要原料之一」。長期素食、吸收不良或某些藥物使用者需要特別注意。最佳模式：驗出不足→確認原因→補充→複檢。','B12低→確認飲食、吸收、藥物等原因；素食者尤其值得監測。若產品實際含足量B12，可建立B群／王牌→B12 Nutritional Support，但必須把實際劑量寫入產品資料庫。'],
[16,'Folate葉酸','🩸營養','造血與新細胞的重要原料','葉酸狀態','製造新細胞與紅血球的重要原料。','低值需檢查飲食、吸收等因素。','若B群／王牌含適量葉酸，可依缺乏情況補充並追蹤。','','飲食攝取＋腸道吸收＋細胞使用＋補充。','反映DNA合成／造血相關營養環節。','原本不足→補充→回升可作Feedback','「製造新細胞、造血需要的重要維生素之一」。B群／王牌若含葉酸，可依實際劑量對應。','低值→營養與吸收評估。原則：Lab deficiency→Ingredient Match→Dose Check→Retest。'],
[17,'CRP','🔥發炎','身體的火災警報器','找發炎來源','身體火災警報器。','高＝有發炎訊號；不知道火在哪裡。','先找感染／疾病／代謝等Cause；EPA＋DHA／薑黃素只能放Support Layer，不是「降CRP治療」。','','感染／組織損傷／發炎訊號→細胞激素→肝臟增加CRP生成。','像「煙霧警報器強弱」；下降＝發炎訊號可能減少，但沒有告訴你原因。','原本高→下降可能代表發炎訊號減少，但要看原因','「身體的火災警報器」。警報器響了只表示某處可能有火，沒有告訴你火在哪裡。CRP高≠立刻吃抗發炎產品，第一步永遠是找火源。','CRP↑＝存在發炎訊號，但不告訴你是哪個器官。不能建立：CRP↑→薑黃／Omega-3。正確：CRP↑→找Cause→疾病控制＋Lifestyle→必要時Nutrition Support。EPA＋DHA、薑黃素定位只能是營養支持，不是「治療CRP」。'],
[18,'hs-CRP','🔥發炎','更敏感的發炎Sensor','心血管風險情境','更敏感的發炎Sensor。','特定情境可協助心血管風險評估。','先改善腰圍、運動、飲食、睡眠、戒菸等；EPA＋DHA／亞麻仁油／植物營養素僅Support。','小幅↑／↓也可被偵測。','與CRP相同，但檢測低濃度能力更敏感。','適當情境可觀察較低程度的發炎訊號及協助心血管風險評估。','看長期趨勢；急性感染期間不宜直接比較','「更敏感版本的CRP，在適當情境下也可協助評估心血管風險」。體重、運動、飲食、睡眠、抽菸與代謝健康通常更上游。','可用於特定心血管風險評估情境，仍需排除急性感染等干擾。Support可放EPA＋DHA、亞麻仁油、植物營養素。'],
[19,'ESR紅血球沉降速率','🔥發炎','另一個發炎警報器','找Cause','另一種發炎警報器。','高不告訴你是哪個器官。','找Cause，不直接配產品。','沉降速度↑／↓。','發炎造成血漿蛋白組成改變→紅血球聚集→沉降速度改變。','間接反映發炎環境；通常不像CRP那麼快速變化。','高值下降可能有意義，但反應速度與CRP不同','「另一種觀察身體是否存在發炎訊號的方法」。高了也不能告訴你是哪裡出問題。','ESR＝非特異性發炎指標。產品沒有直接一對一關係。ESR↑→Cause First。'],
[20,'ANA','🔥免疫','自體免疫調查線索','陽性≠確診','自體免疫調查線索。','陽性≠確診自體免疫疾病。','症狀＋其他抗體＋醫師判讀；不要自行使用「調免疫」產品處理。','陽性／陰性、滴度／Pattern差異。','免疫系統產生針對細胞核成分的抗體。','自體免疫「線索」，不是自體免疫疾病本身。','不適合當一般「保養成效分數」追升降','「自體免疫疾病調查中的一個線索」。陽性不等於一定有自體免疫疾病，更不代表「免疫太強」。','ANA陽性≠一定有自體免疫疾病。不能推薦「調免疫產品」。需要症狀＋抗體Pattern＋臨床醫師判讀。標示：【Medical Diagnosis Priority】。'],
[21,'RF','🔥免疫','類風濕評估拼圖之一','配症狀／其他檢查','類風濕等疾病評估的一塊拼圖。','陽性≠一定類風濕。','風濕免疫科判讀優先；產品只可能是營養Support。','','特定自體抗體產生。','免疫活動的一個線索；不是類風濕的單一開關。','數字變化不能單獨代表疾病好壞','「類風濕性關節炎等疾病評估中的一塊拼圖」。不是有紅字就等於確診類風濕。','RF陽性也不能單獨診斷類風濕性關節炎。不要用「免疫產品」直接對應。'],
[22,'Anti-CCP','🔥免疫','類風濕的重要抗體線索','風濕免疫評估','類風濕評估的重要抗體之一。','異常需結合症狀與其他證據。','醫療診斷／治療優先；營養素不能取代。','陽性／陰性或濃度差異。','對瓜胺酸化蛋白相關抗原產生自體抗體。','在類風濕性關節炎評估中提供較具特異性的資訊之一，但仍需臨床診斷。','不以「降抗體」作營養素成效指標','「醫師評估類風濕性關節炎時很有用的一項抗體資料」。營養支持不能取代風濕免疫科治療。','較常用於類風濕性關節炎評估。產品不能取代風濕免疫科診療，Nutrition Support只能做Supporting Layer。'],
[23,'IgG','🔥免疫','主要抗體部隊之一','不是越高越好','主要抗體部隊之一。','不是越高免疫力越強。','高低都要看疾病背景；沒有直接產品對應。','','B細胞／漿細胞產生抗體＋免疫刺激＋蛋白流失／免疫疾病等。','長期體液免疫的一個切面。','看疾病情境，不追求越高','IgG／IgA／IgM＝「免疫系統不同種類的抗體部隊」。不是數字越高免疫力越好；太高、太低都可能有不同意義。','代表不同免疫球蛋白資訊，高低均需結合臨床背景。不要轉譯成簡單的「免疫力分數」。產品沒有直接一對一對應。'],
[24,'IgA','🔥免疫','黏膜防禦抗體','腸道／呼吸道等','黏膜防禦相關抗體。','腸道、呼吸道等黏膜免疫的重要成員。','異常需專業判讀；不要用益生菌直接「矯正IgA」。','','黏膜免疫系統產生IgA。','反映黏膜免疫的一部分，但血中IgA≠完整腸道免疫。','配臨床背景判讀','同IgG：抗體部隊之一，不能用單一保健品直接對應。','高低均需結合臨床背景；產品沒有直接一對一對應。'],
[25,'IgM','🔥免疫','早期免疫反應抗體之一','配臨床背景','免疫早期反應的重要抗體之一。','高低本身不能直接代表免疫好壞。','結合疾病背景判讀，無直接產品。','','初始體液免疫反應等。','免疫反應的一個時間／型態線索。','配疾病背景判讀','同IgG：抗體部隊之一，不能用單一保健品直接對應。','高低均需結合臨床背景；產品沒有直接一對一對應。'],
[26,'AST','🫀肝膽','肝臟／肌肉受損Sensor之一','找細胞受損來源','肝臟／肌肉等細胞受損的Sensor之一。','高≠毒素太多，也不一定全部來自肝臟。','搭配ALT／GGT／症狀／運動等找Cause；不要直接買排毒產品。','','肝、肌肉等細胞受損→細胞內AST釋放到血液。','比較像「細胞漏出訊號」，不是肝臟排毒能力分數。','原本高→下降可觀察，但需確認來源','「細胞受損時可能跑到血液裡的一種酵素」。肝臟有它，肌肉等組織也有，所以AST高不一定就是「肝臟毒素太多」。','AST高可能來自肝臟，也可能涉及肌肉等來源。不能看到AST高就說「肝臟要排毒」。沒有直接治療對應，先Cause。'],
[27,'ALT','🫀肝膽','肝細胞受傷的重要Sensor','脂肪肝／肝炎／藥物等','肝細胞受傷的重要Sensor。','高值要查脂肪肝、肝炎、藥物等。','Cause→體重／飲食／運動／醫療；EPA＋DHA只屬脂質／代謝Support。','','肝細胞膜／細胞受損→ALT釋出。','較聚焦於肝細胞損傷訊號；下降常表示損傷訊號減少，但仍要看Cause。','原本高→下降常是正向訊號之一；仍看病因','「觀察肝細胞是否受到傷害的重要指標之一」。ALT高不是告訴你需要排毒，而是提醒：「為什麼肝細胞受傷？」脂肪肝、病毒性肝炎、藥物等都可能是原因。','ALT↑→脂肪肝、病毒性肝炎、藥物等原因評估。產品Support只能放在整體代謝改善之後：EPA＋DHA可作脂質營養Support；苦瓜／黃連素屬代謝Support但不可自行當作脂肪肝治療。'],
[28,'GGT','🫀肝膽','肝膽系統警示燈','酒精／膽道／藥物等','肝膽警示燈之一。','酒精、膽道、藥物等都可能影響。','找原因；不存在「GGT高＝需要排毒」的簡單公式。','','肝膽系統酵素誘導、膽汁淤積、酒精／藥物等影響。','提供肝膽與代謝環境的線索，不是「毒素濃度」。','高值下降可追蹤酒精／代謝／膽道等介入效果','「肝膽系統的一個警示燈」。不是「身體毒素量測器」，沒有直接排毒產品。','GGT異常可涉及膽道、酒精、藥物等多種因素。不是「毒素太多」指標，產品不直接對應。'],
[29,'ALP','🫀肝膽／骨','可能來自肝膽或骨頭','先判斷來源','可能來自肝膽，也可能來自骨頭。','高值要先判斷來源。','配GGT、膽紅素等判讀，不直接配產品。','','膽管細胞或骨骼等組織產生。','差異首先要問「來源是哪裡」，再談好壞。','先知道來源，才能解讀升降','「這個數字可能來自肝膽，也可能來自骨頭」。看到高值不能直接說肝不好。','ALP↑≠一定肝臟問題。與GGT、Bilirubin等一起判讀。'],
[30,'Total Bilirubin總膽紅素','🫀肝膽','膽紅素處理總體資訊','肝／膽／溶血','紅血球代謝後需要肝膽處理的物質。','高可能出現在不同處理環節。','找溶血／肝臟／膽道等Cause；不是排毒產品指標。','','紅血球分解→膽紅素產生→肝臟處理→膽汁排出。','可以幫助定位「生成、處理、排泄」哪個環節改變。','異常回復需配Direct Bilirubin與病因','「紅血球代謝後產生的物質，需要經過肝膽系統處理與排出」。太高可能有很多不同原因，不是看到高就吃「肝臟排毒」產品。','升高可能涉及溶血、肝細胞處理、膽汁排泄等不同Mechanism。不對應「排毒產品」。'],
[31,'Direct Bilirubin直接膽紅素','🫀肝膽','已處理膽紅素的一部分','膽汁排泄等','已經經過肝臟處理的一部分膽紅素。','與總膽紅素一起看更有意義。','異常尤其合併黃疸等症狀時需醫療評估。','','肝臟已結合處理的膽紅素→膽汁排泄。','與Total Bilirubin組合後，才更容易理解問題位置。','與總膽紅素一起比較','同膽紅素：需與總膽紅素一起看。','與Total Bilirubin共同建立Pattern。膽道阻塞等情境需要醫療診斷，不是營養素處理優先。'],
[32,'Albumin白蛋白','🫀營養','血液重要蛋白質','肝／腎／發炎／營養','血液裡的重要蛋白質。','低≠只是蛋白質吃太少。','查肝、腎、發炎、營養等；確認營養缺口才用王牌等Support。','','肝臟合成－腎／腸流失－分解＋發炎狀態＋體液狀態。','同時整合肝臟、營養、發炎、腎臟等資訊。','低值回升可能正向，但受肝腎、發炎、營養影響','「血液裡非常重要的蛋白質之一」。低值不一定只是「蛋白質吃太少」，肝臟、腎臟、發炎與疾病狀態都可能影響。','Albumin低不能直接解讀為「蛋白質吃太少」。王牌只有在實際營養缺口符合時才是Support。'],
[33,'Total Protein總蛋白','🫀營養','血液蛋白總量','配Albumin看','血液蛋白總量。','需搭配Albumin等看。','先判斷原因，再決定營養策略。','','Albumin＋Globulin等蛋白總和＋體液狀態。','是總量訊號；必須拆解成分才知道差異從哪裡來。','需配Albumin／Globulin，不追求越高','','需要與Albumin、Globulin等共同判讀。產品不直接對應。'],
[34,'Creatinine肌酸酐','💧腎臟','腎臟過濾功能線索','配eGFR','腎臟過濾功能的重要線索。','高不等於「毒太多」。','一起看eGFR／尿蛋白等；腎功能異常反而要重新Review全部補充品。','','肌肉產生Creatinine→血液→腎臟過濾排出。','腎臟過濾能力的重要代理Sensor，但肌肉量等也會影響。','上升可能需注意，但受肌肉量、水分等影響','「觀察腎臟過濾能力的重要線索之一」。數字異常不是叫你開始「腎臟排毒」，反而代表補充品需要更小心。','Creatinine＋eGFR＝重要腎功能資訊。不能解讀成「毒素堆積所以要排毒」。腎功能異常者更需審慎使用補充品。建立：Kidney Safety Gate。'],
[35,'eGFR','💧腎臟','腎臟過濾能力估算','腎功能核心Sensor','估算腎臟還剩多少過濾能力。','下降＝需要找腎功能變化原因。','血壓／血糖／尿蛋白／藥物等一起評估；啟動Kidney Safety Gate，不自行增加「排毒品」。','','由Creatinine等資訊＋年齡／性別等估算腎臟過濾能力。','比單看Creatinine更接近「腎臟過濾功能趨勢」；重點是長期Trend。','重點看長期Trend；持續下降比單次波動更重要','「估算腎臟現在還有多少過濾能力」。把腎臟想成家裡的濾水系統，eGFR下降＝濾水能力可能變差。不是增加排毒產品，而是先確認哪些營養素、藥物、飲食需要調整。','eGFR下降→先確認慢性／急性、尿蛋白、血壓、糖尿病等。不是推薦更多營養素的訊號，反而是Supplement Review Trigger，尤其多成分產品需要重新評估。'],
[36,'BUN','💧腎臟','蛋白質代謝廢物相關指標','腎功能／水分／飲食','蛋白質代謝廢物相關指標。','腎功能、水分、飲食等都會影響。','與Creatinine／eGFR一起判讀；無直接產品。','','蛋白質代謝→尿素生成→腎臟排泄；同時受水分與蛋白攝取等影響。','是「生成＋排泄＋水分」共同產生的數字。','受水分、蛋白攝取、腎功能等影響','「蛋白質代謝後產生的含氮廢物相關指標之一」。沒有「BUN高就吃」的產品。','受到腎功能、水分、蛋白質攝取、消化道出血等因素影響。不直接對應任何「腎排毒」產品。'],
[37,'Uric Acid尿酸','💧代謝','嘌呤代謝後的產物','生成＋排泄','嘌呤代謝後產物。','高可能是生成增加或排出不足。','看腎功能＋飲食＋酒精＋體重＋藥物；不要宣稱產品「排尿酸」。','','嘌呤分解生成尿酸↔腎臟／腸道排泄。','高值可能是「做太多」或「排太少」，不能只怪飲食。','原本偏高→下降可能正向，但不是越低越好','「身體嘌呤代謝後的一種產物」。高尿酸不是簡單的「毒素太多」，可能牽涉生成太多或排出不足。','尿酸高涉及生成與排泄平衡。第一層＝飲食、酒精、體重、腎功能、藥物與代謝因素。產品不是第一線。'],
[38,'Urine Protein尿蛋白','💧腎臟','腎臟濾網有沒有漏蛋白','持續異常要追蹤','腎臟濾網有沒有漏蛋白。','持續陽性值得進一步查腎臟。','醫療評估優先，不以保健品遮蓋。','陰性→陽性／陽性→陰性。','腎絲球過濾屏障＋腎小管回收能力改變。','回答「腎臟濾網是否讓不該大量出去的蛋白漏出去」。','（+/−）持續陽性→轉陰／減少通常較理想，仍需追Cause','「正常情況下不應該大量漏出去的蛋白質，有沒有跑進尿液」。像濾網開始漏東西；持續異常需要查腎臟。','陽性需要確認暫時性或持續性。若持續異常→腎臟評估。產品不直接對應。'],
[39,'Urine ACR','💧腎臟','更敏感找腎臟漏蛋白','糖尿病／高血壓重要','更敏感找腎臟漏蛋白。','糖尿病／高血壓族群尤其值得注意。','控制血壓／血糖＋醫療管理；不是產品購買指標。','','尿中Albumin漏出量相對Creatinine校正。','更敏感觀察腎臟微小蛋白流失，特別適合追蹤腎臟風險。','原本高→下降通常是重要正向Trend','「更敏感地看看腎臟濾網是不是開始漏蛋白」。糖尿病、高血壓族群尤其重要。','非常適合加入平台。ACR異常＝腎臟風險Sensor，不是營養素推薦Sensor。'],
[40,'Urine Blood尿潛血','💧泌尿','尿中有沒有血液成分','感染／結石等','尿裡偵測到血液成分。','感染、結石、腎臟／泌尿道等都可能。','找Cause；不能直接跳到D-甘露糖。','+/−。','泌尿系統任何環節出血／紅血球進入尿液，或檢測到血紅素相關訊號。','告訴你「尿中出現血液相關訊號」，沒有直接告訴你出血位置。','（+/−）陽性→陰性可能正向，但仍需確認原本原因','「尿裡面有沒有偵測到血液成分」。可能原因很多；不能看到尿潛血就直接吃D-甘露糖。','可能涉及泌尿道、結石、感染、腎臟等原因。不是D-甘露糖適應證本身，先找原因。'],
[41,'Nitrite尿亞硝酸鹽','💧泌尿','某些細菌活動線索','UTI評估','某些細菌活動留下的線索。','陽性＋尿路症狀增加UTI可能性。','感染依醫療處理；D-甘露糖只定位Urinary Support。','+/−。','部分細菌將尿中硝酸鹽轉成亞硝酸鹽。','陽性提供細菌性UTI線索；陰性不能完全排除。','（+/−）陽性→陰性需配症狀／尿培養等判讀','「尿液裡是否出現某些細菌活動留下的線索」。陽性可能支持尿路感染。','陽性可支持某些細菌性尿路感染可能，但陰性不能完全排除。D-甘露糖可定位為Urinary Support，不能取代感染診斷與抗生素治療。'],
[42,'Leukocyte Esterase','💧泌尿','尿中白血球活動線索','UTI評估','尿裡有沒有白血球活動。','陽性＋頻尿／灼熱／疼痛要注意感染。','發燒／腰痛等更需就醫；D-甘露糖不能取代感染治療。','+/−。','白血球進入尿液→釋放相關酵素。','反映泌尿道存在白血球活動的線索。','（+/−）陽性→陰性可能改善，但不能單項證明感染已清除','「尿裡有沒有白血球活動的線索」。若合併頻尿、灼熱、疼痛等要考慮尿路感染；發燒、腰痛或全身不舒服更要就醫。','與尿WBC、Nitrite、症狀共同判斷UTI可能性。發燒、腰痛、全身症狀等需要醫療評估。'],
[43,'Specific Gravity尿比重','💧泌尿','尿液到底有多濃','水分／濃縮能力','尿有多濃。','水分與腎臟濃縮能力等都會影響。','看Trend與其他尿液資料，無直接產品。','','喝水量＋腎臟濃縮／稀釋能力＋尿中溶質。','反映「這泡尿有多濃」，不是單純腎功能分數。','不追求越高／越低；看水分與腎臟情境','「尿到底有多濃」。水分會影響，但不是只由喝水決定。','反映尿液濃縮狀態的一部分，不是簡單的「缺水指數」。沒有直接產品對應。'],
[44,'Urine pH','💧泌尿','這泡尿偏酸或偏鹼','≠全身酸性體質','這泡尿偏酸還是偏鹼。','尿偏酸≠整個人是酸性體質。','不以尿pH做「鹼化身體」產品推薦。','酸↔鹼。','飲食＋腎臟酸鹼調節＋部分感染＋代謝狀態。','尿液酸鹼環境改變；不能推論「全身酸性／鹼性」。','不拿升降判定「體質變鹼／變健康」','「這一泡尿偏酸還是偏鹼」。最重要的一句：尿偏酸≠你的身體是「酸性體質」。','受飲食、感染、代謝等影響。不要建立「酸性體質→疾病→鹼化產品」模型。尿液pH≠全身血液酸鹼狀態。'],
[45,'Fasting Glucose空腹血糖','🍬血糖','空腹時血液裡有多少糖','血糖調節','空腹時血裡有多少糖。','高值代表血糖調節值得進一步評估。','飲食＋運動＋肌肉＋體重＋睡眠＋必要醫療；苦瓜／黃連素只作Support。','','肝臟放糖＋胰島素作用＋肌肉／脂肪攝糖＋壓力荷爾蒙＋前一晚飲食等。','空腹狀態下「血糖供需控制」的快照。','原本高→下降通常正向，但注意低血糖','「早上還沒吃東西時，血液裡有多少糖」。苦瓜、黃連素可放Metabolic Support，但真正上游是：飲食＋活動＋肌肉＋體重＋睡眠＋必要醫療。','高→Glucose Regulation Bottleneck。第一線：飲食、運動、體重、睡眠、醫療。Support候選：苦瓜、黃連素；若已使用降血糖藥物，需考慮疊加作用與低血糖風險。'],
[46,'HbA1c糖化血色素','🍬血糖','過去一段時間血糖成績單','長期血糖趨勢','過去一段時間血糖的大致成績單。','比單次血糖更能看長期趨勢。','Baseline→生活／醫療介入→苦瓜／黃連素等適當Support→依建議Retest。','','紅血球長期暴露於葡萄糖→血紅素糖化。','反映過去一段時間平均血糖暴露；比單次血糖更像「長期成績單」。','原本高→下降通常代表平均血糖改善','「不是今天這一餐，而是過去一段時間血糖的大致成績單」。非常適合做前後比較：Baseline→介入→Retest，不是「吃了有感」而已。','代表較長時間尺度的血糖暴露資訊，非常適合做Retest指標。HbA1c Baseline→12週Lifestyle／Medical Intervention→Retest。苦瓜／黃連素只能是其中可能的Support Variable。'],
[47,'Fasting Insulin空腹胰島素','🍬代謝','管血糖需要派多少胰島素','代謝壓力','身體要派多少胰島素才能管理血糖。','血糖正常也不代表胰島素一定沒有代謝壓力。','飲食／運動／腰圍／睡眠優先；苦瓜／黃連素僅Support。','','胰臟為維持血糖穩定所分泌的胰島素量。','如果需要越來越多胰島素才能維持相似血糖，可能提示代謝調控成本增加。','若原本偏高，下降且血糖穩定可能支持敏感度改善','「身體為了把血糖送進細胞，現在需要派出多少胰島素」。有些人血糖還沒有非常高，但身體已經需要很多胰島素才能維持。','搭配Glucose可提供更多代謝資訊，但不能單獨診斷所有「胰島素阻抗」。候選：苦瓜、黃連素；EPA＋DHA偏向脂質支持。第一順位仍是活動、體重、飲食與睡眠。'],
[48,'HOMA-IR','🍬代謝','估算胰島素阻抗','胰島素敏感度','估算胰島素阻抗的工具之一。','可理解為「胰島素指令是不是越來越不好用」。','追蹤腰圍＋血糖＋活動＋飲食；產品只是其中一個Variable。','','空腹Glucose×Insulin的估算模型。','不是直接量到「胰島素阻抗」，而是估算代謝Pattern。','原本高→下降通常是代謝改善方向','「用空腹血糖＋胰島素估算胰島素阻抗程度的工具之一」。可以理解成：「身體對胰島素指令是不是越來越不敏感？」','可作研究或部分臨床情境的胰島素阻抗估算工具。非常適合Life OS追蹤：Baseline→Intervention→Retest。'],
[49,'TG三酸甘油脂','🍬脂質','血液中的能量型脂肪','飲食／酒精／代謝','血液中的能量型脂肪。','高值常與飲食、酒精、體重及代謝狀態相關。','生活＋代謝管理；EPA＋DHA是較直接的營養Support之一。','','飲食能量＋肝臟脂質生成＋脂肪組織釋放＋脂蛋白清除。','反映能量過剩、脂質運輸與代謝狀態的一部分。','原本高→下降通常正向','「血液裡運送與儲存能量的一種脂肪」。EPA＋DHA是這一區最直接的營養Support之一，但嚴重高值仍需要正式醫療評估。','TG↑常與飲食、酒精、代謝健康等相關。產品對應最清楚之一：EPA＋DHA＝Lipid Support。高TG若達需要治療程度，仍應依醫療評估處理。'],
[50,'HDL-C','🍬脂質','俗稱好膽固醇','要看整體風險','俗稱好膽固醇。','不要理解成越高永遠越好。','與LDL／TG／ApoB／血壓等看整體風險，不追求單一數字。','','HDL生成、重塑、膽固醇運輸與代謝。','只是心血管系統的一個Marker，不能單純「越高越健康」。','不用單純追求升高；整體風險更重要','常被叫做「好膽固醇」，但人體沒有這麼簡單。不要只追求把HDL數字拉高，真正要看整體心血管風險。','不要建立「HDL越高永遠越好」的單指標模型。產品不以「升HDL」為銷售主軸。'],
[51,'LDL-C','🍬脂質','動脈粥樣硬化重要風險指標','心血管管理','與動脈粥樣硬化風險密切相關的重要指標。','高值需要放進整體心血管風險評估。','飲食／運動／體重＋必要藥物；營養素不能取代有適應證的降脂治療。','','肝臟脂蛋白生成→VLDL／LDL代謝＋LDL receptor清除。','反映LDL顆粒攜帶膽固醇的量；需結合整體心血管風險。','依個人風險目標判讀，不是所有人同一目標','「血液裡與動脈粥樣硬化風險相關的重要膽固醇指標之一」。不能把EPA＋DHA說成「降LDL產品」；醫師判定需要降脂治療時，營養素不能取代。','LDL-C高→整體ASCVD風險評估。產品不能取代Statin等有適應證的治療。EPA＋DHA也不是「降LDL產品」，這個界線要特別清楚。'],
[52,'Non-HDL-C','🍬脂質','多種需注意膽固醇一起看','整體脂質風險','把多種需要注意的膽固醇一起看。','比只看總膽固醇多一層資訊。','整體代謝與心血管風險管理；EPA＋DHA僅Support。','','Total Cholesterol－HDL-C。','把多種含ApoB的致動脈硬化脂蛋白膽固醇一起納入。','高值下降通常為正向風險變化','「把比較需要注意的膽固醇顆粒相關資訊一次包進來看」。比只盯總膽固醇更有資訊。','代表所有含ApoB膽固醇顆粒中的膽固醇總量概念，可與LDL-C共同評估。'],
[53,'ApoB','🍬脂質','致動脈硬化脂蛋白「車輛數」','心血管風險','可以想成「容易參與動脈粥樣硬化的車輛數」。','車越多，整體暴露可能越值得注意。','與LDL-C、Non-HDL-C及整體風險一起管理；產品不能取代治療。','','每個主要致動脈硬化脂蛋白顆粒通常帶一個ApoB。','較接近「道路上有多少台致動脈硬化脂蛋白車輛」。','原本高→下降通常是重要正向Trend','如果很多輛可能造成問題的車都在血管裡跑，即使每台載的膽固醇不多，總車數仍值得注意。這是比只看「總膽固醇」更進階的一層資訊。','非常值得升級進平台。比「總膽固醇」更接近atherogenic particle burden的概念。ApoB↑→Cardiometabolic Risk Node。產品仍是Support。'],
[54,'Lp(a)','🍬脂質','很受遺傳影響的風險因子','遺傳性心血管風險','高度受到遺傳影響的心血管風險因子。','高不是代表你生活做錯了。','把它納入整體風險管理；沒有單一團購產品能把遺傳風險歸零。','通常相對穩定。','主要受遺傳決定的Lp(a)生成與代謝。','代表一部分先天心血管風險背景；不是生活努力程度分數。','通常較穩定；不適合拿短期產品介入做成效指標','「一個很受遺傳影響的心血管風險因子」。它提醒我們：不是所有健康問題都能靠保健品解決。','高度受到遺傳影響。不是所有風險都能靠「吃得健康＋保健品」歸零。Lp(a)高→需要納入整體心血管風險評估。'],
[55,'Amylase澱粉酶','🦠消化','澱粉酵素＋疾病評估線索','胰臟／唾液腺等','澱粉消化相關酵素，也是疾病評估線索。','異常≠你缺消化酵素。','找胰臟／唾液腺等Cause；不能直接配酵素＋HCl。','','胰臟／唾液腺等組織產生→進入血液。','器官與酵素活動的線索；不是「缺不缺消化酵素」測驗。','異常回到適當範圍需配病因判讀','「參與消化澱粉的酵素之一，也可作為特定器官疾病評估線索」。不能：Amylase異常→直接買酵素。','胰臟／唾液腺等相關資訊。異常不是「消化酵素不足」的直接證據，不能：Amylase異常→酵素產品。'],
[56,'Lipase脂肪酶','🦠胰臟','胰臟評估的重要酵素','胰臟問題','胰臟評估的重要酵素指標。','明顯升高＋腹痛要特別注意。','醫療優先，不用消化酵素取代診斷。','','胰臟細胞受影響→Lipase進入血液。','胰臟狀態的重要Sensor之一，尤其需結合腹痛等臨床資訊。','高值下降可能代表急性狀況改善，但由醫療端判讀','「醫師評估胰臟問題時的重要指標之一」。明顯升高又有劇烈腹痛，重點是醫療，不是買消化酵素。','在胰臟疾病評估中比「買消化酵素」重要得多。明顯升高＋腹痛等症狀→醫療評估。'],
[57,'Occult Blood糞便潛血','🦠腸道','大便裡有沒有看不到的血','陽性需進一步評估','大便裡有沒有看不到的血。','篩檢陽性需要進一步確認原因。','依醫療建議追蹤／檢查；腸寶、益生菌不能取代。','陰性↔陽性。','消化道微量出血→血液成分進入糞便→檢測捕捉。','「有沒有隱藏出血訊號」，不是「腸道菌好不好」。','（+/−）陽性不是用產品追到陰性；先完成必要診斷','「大便裡有沒有肉眼看不到的血」。篩檢陽性重點不是腸寶，而是按照醫療建議進一步檢查。這是Red Flag Node。','陽性→大腸疾病進一步評估。不是腸寶／益生菌推薦訊號。非常重要的紅旗：FIT Positive→Medical Follow-up。'],
[58,'Calprotectin糞便鈣衛蛋白','🦠腸道','腸道發炎Sensor','腸道發炎','腸道發炎Sensor。','高≠只是壞菌太多。','先找腸道發炎原因；腸寶／孢子益生菌／丁酸鈉只能Support。','','腸道中嗜中性球等發炎細胞活動→Calprotectin增加。','比較接近「腸道發炎活動程度」的Sensor，而不是單純菌相。','原本高→下降可能支持腸道發炎減少','「看看腸道裡是不是有比較明顯的發炎訊號」。高值≠單純壞菌太多，先找發炎原因。','可協助辨識腸道發炎。高值不能簡化成「菌相不好」。腸寶／孢子益生菌／丁酸鈉不能取代腸胃科評估。'],
[59,'Microbiome腸道菌相','🦠腸道','腸道菌生態地圖','菌相＋飲食＋生活','腸道菌生態地圖。','一次菌相報告不是你的「腸道命盤」。','飲食纖維＋植物多樣性＋生活優先；腸寶／孢子益生菌／丁酸鈉／5R可作個別化Support。','菌種／比例／多樣性／功能改變。','飲食＋藥物／抗生素＋年齡＋環境＋腸道狀態＋宿主共同選擇菌群。','代表一個動態生態系，不是「好菌越多＝越健康」的排行榜。','（↕）不追單一菌升降；看症狀＋飲食＋整體生態','「看看你的腸道菌生態長什麼樣子」。很有趣也有研究價值，但不能把一次菌相報告當成「腸道命盤」。更重要的是食物多樣性、纖維與生活型態。','可建立Diversity、Relative Abundance、Functional Potential，但不要過度解讀單次商業菌相報告。最適合：Baseline→Intervention→Symptoms／Diet Feedback→Model Update。不要假裝可以由一張菌相報告精準開「菌方」。'],
[60,'TSH','⚙️甲狀腺','大腦對甲狀腺下多少指令','配Free T4','大腦對甲狀腺下多少工作指令。','高低需要配Free T4等才能理解。','甲狀腺問題先醫療判讀；Q10／能量方不能把疾病造成的疲勞蓋掉。','','下視丘→腦下垂體TSH→甲狀腺→T4／T3→負回饋。','是控制迴路中的「上游指令」，不是單純甲狀腺荷爾蒙量。','必須配Free T4及治療情境，不是越低越好','「大腦在對甲狀腺下多少指令」，像總公司發給甲狀腺工廠的工作命令。疲勞不能直接用Q10或能量方蓋掉。','甲狀腺控制系統Sensor。TSH異常→Free T4／T3＋臨床評估。不能直接推薦「能量產品」。'],
[61,'Free T4','⚙️甲狀腺','甲狀腺荷爾蒙訊號之一','配TSH','甲狀腺提供的重要荷爾蒙訊號之一。','與TSH一起才能建立較完整Pattern。','疾病治療優先，營養產品只在Support Layer。','','甲狀腺生成與釋放＋藥物＋控制迴路。','是甲狀腺實際輸出的一部分；與TSH組合才看得懂控制系統。','與TSH組合判讀，不追求單方向','「甲狀腺實際提供的重要荷爾蒙訊號之一」。TSH＋Free T4一起看，比單看「我最近很累」精準得多。','與TSH共同建立Thyroid Pattern。疲勞若來自甲狀腺疾病，能量方／Q10不能取代疾病治療。'],
[62,'25-OH Vitamin D','⚙️營養','維生素D狀態','D＋K Support','維生素D狀態的重要血液指標。','低值可進一步評估攝取、日照及補充需求。','D＋K依實際D劑量補充→依個人情況Retest；不是越高越好。','','日照皮膚生成＋飲食／補充→肝臟轉換→儲存／利用。','反映Vitamin D Status；是最適合做「補充→Retest」的營養Sensor之一。','原本不足→補充→進入適當範圍是較有意義的閉環','「目前最常拿來評估身體維生素D狀態的血液指標」。最適合建立：檢驗→需求→補充→複檢的營養閉環。但維生素D不是越高越好。','D＋K最能建立Lab→Ingredient→Retest閉環：25-OH D→判斷Vitamin D Status→飲食／日照／補充策略→依實際D劑量評估→Retest。'],
[63,'Calcium血鈣','⚙️電解質','血液中的鈣','配Albumin／D／PTH／腎功能','血液裡鈣的濃度。','低值≠直接缺鈣。','配Albumin／Vitamin D／PTH／腎功能判讀，再決定介入。','','腸道吸收＋骨骼儲存／釋放＋腎臟排泄＋PTH＋Vitamin D共同控制。','是一個高度受控的Homeostasis指標，不等於「今天鈣吃多少」。','身體嚴格調控，不追求越高','「血液裡鈣的濃度」。低值不代表直接吞更多鈣或D。','不能看到Calcium低就直接加D＋K。需考慮Albumin、Vitamin D、PTH、腎功能等。'],
[64,'Magnesium鎂','⚙️電解質','神經肌肉與酵素重要礦物質','鎂Support','神經、肌肉與酵素需要的重要礦物質。','血清值只是整體鎂狀態的一部分資訊。','飲食＋實際需求→鎂Support；腎功能異常者先確認安全。','','腸道吸收＋腎臟排泄＋細胞／骨骼分布。','血中鎂只是全身鎂狀態的一個窗口。','缺乏者回到適當範圍才有意義','「神經、肌肉、能量代謝與大量酵素反應需要的重要礦物質」。腎功能不好的人補充前尤其需要注意。','血清鎂不能完全代表全身鎂儲存。若確認攝取不足／缺乏風險：鎂＝直接成分Support。'],
[65,'Sodium鈉','⚙️電解質','水分與神經的重要電解質','異常需找原因','水分與神經系統的重要電解質。','太高／太低都可能有重要原因。','不要自行靠喝水、鹽或保健品矯正明顯異常。','','水分攝取／流失＋腎臟＋ADH等調控。','很多時候反映的是「水與鈉的比例」，不是單純鹽吃多吃少。','目標是適當範圍，不是升或降','「控制水分與神經功能的重要電解質之一」。太高太低都不能只靠「多喝水」處理。','高低可能涉及水分、腎臟、荷爾蒙、藥物等。不屬營養團購自行矯正的指標。'],
[66,'Potassium鉀','⚙️電解質','心臟肌肉神經的重要電解質','明顯異常醫療優先','心臟、神經、肌肉的重要電解質。','過高／過低都可能有風險。','異常先醫療評估；腎功能不好尤其不要自行大量補鉀。','','飲食＋腎臟排泄＋細胞內外移動＋荷爾蒙／藥物。','反映心臟、神經、肌肉高度重要的電解質平衡。','目標是適當範圍；明顯異常醫療優先','「心臟、神經、肌肉非常重要的電解質」。腎功能不好的人不要自行大量補充。','高／低都可能造成重要風險。產品資料庫應加入：Electrolyte Safety Gate。'],
[67,'Homocysteine同半胱胺酸','⚙️營養','B群代謝路徑Sensor','B12／B6／葉酸等','B群代謝路徑的一個Sensor。','B12、B6、葉酸、腎功能等都可能影響。','找真正Bottleneck→B群依缺口Support→Retest。','','Methionine代謝→B12／Folate／B6相關路徑→再甲基化／轉硫途徑＋腎功能。','是一個「代謝路徑Sensor」，不是單一B群缺乏診斷。','原本偏高→找Cause後下降可作Feedback之一','「可以反映某些B群代謝路徑狀態的一個指標」。不是看到高值就盲目堆高劑量B群，先找Bottleneck。','B群可建立B-vitamin Pathway Support，但應先辨識是哪個Bottleneck。'],
[68,'CEA','🎗腫瘤標記','某些癌症情境的追蹤標記','≠癌症確診工具','某些癌症情境可能使用的追蹤標記。','高≠一定有癌症；正常也不是萬能排除。','依腫瘤科／醫師規劃判讀；沒有任何營養素可用「降CEA＝抗癌」推論。','','某些腫瘤及部分非腫瘤情境可改變CEA產生／釋放。','在適當癌症情境下可作追蹤Signal；不是單獨的癌症開關。','趨勢由腫瘤醫療情境判讀；不能拿來證明保健品抗癌','「某些癌症情境中醫師可能用來追蹤的腫瘤標記之一」。不是「癌症驗孕棒」，高了也不能自己判斷癌症復發。腫瘤科優先。','CEA不是一般「癌症有沒有」的單一判斷器。CEA高不能推薦NAC／NMN／益生菌／任何「抗癌產品」。一律：Oncology Priority。'],
[69,'CA19-9','🎗腫瘤標記','胰膽等情境可能參考','≠高就一定癌症','某些胰膽等疾病情境可能參考的標記。','高值不等於直接確診癌症。','醫療判讀優先；營養素只屬Supportive Care。','','胰膽／消化系統某些細胞與疾病狀態可影響。','Trend需放進影像＋症狀＋治療背景才能解讀。','前後Trend需結合治療、影像與病情','高值不等於一定有癌症，正常也不能保證完全沒有。','同樣不是健康族群萬能癌症篩檢。異常→依臨床情境進一步診斷。沒有產品直接對應。'],
[70,'AFP','🎗腫瘤標記','肝臟等疾病評估標記之一','配影像／病史','肝臟與部分疾病評估可能使用的標記。','需要與影像、肝病背景等一起看。','B肝／肝癌風險族群依醫療計畫追蹤；護肝產品不能取代。','','肝細胞再生／損傷及某些腫瘤等情境可能影響。','是肝臟／特定腫瘤評估的一個Signal，不是單獨診斷。','趨勢需配影像／肝病背景，不單看升降','尤其有B肝、肝病或相關高風險者，應按照醫療追蹤，不是靠護肝或排毒產品處理。','異常不能用「護肝營養素」處理。B肝／肝癌風險族群應遵循專業追蹤計畫。'],
[71,'PSA','🎗腫瘤標記','前列腺相關Sensor','泌尿科評估','前列腺相關Sensor。','高值存在多種可能原因。','泌尿科判讀＋必要後續檢查；產品不直接對應。','','前列腺組織產生；良性增生、發炎、操作與癌症等均可能影響。','代表「前列腺相關訊號改變」，不等於「癌細胞數量」。','Trend有價值，但受多因素影響，由醫療端綜合判讀','「前列腺相關的重要檢驗之一」。升高有不同可能原因，泌尿科判讀優先。','沒有團購產品可以取代泌尿科風險判讀。'],
[72,'CA-125','🎗腫瘤標記','婦科疾病評估拼圖之一','≠卵巢癌確診','婦科疾病評估的一塊拼圖。','高≠直接等於卵巢癌。','婦科／醫療判讀優先，沒有直接產品。','','腹膜／婦科等多種良性或惡性狀況均可能影響。','需要臨床背景才能解讀，不是卵巢癌單一開關。','趨勢需配疾病／影像，不可單獨判斷','不是單獨的「卵巢癌確診數字」。醫療優先。','不是單純「卵巢癌指數」。多種良性與惡性狀況均可能影響。產品不直接對應。'],
[73,'Cortisol皮質醇','🧠壓力','壓力＋能量＋生理時鐘荷爾蒙','採檢時間很重要','壓力反應＋能量調度＋生理時鐘相關荷爾蒙。','單次異常不能直接叫「腎上腺疲勞」。','先看採檢時間＋睡眠＋晨光＋壓力＋疾病；產品不是第一順位。','↑／↓＋時間曲線改變。','下視丘→腦下垂體→腎上腺HPA Axis＋晝夜節律＋壓力刺激。','真正重要的不只是「高低」，還包括「什麼時間測」與節律。','前後比較必須注意採檢時間與條件','「身體調度能量、壓力反應與晝夜節律的重要荷爾蒙之一」。先從睡眠、晨光、運動、壓力與生活節律開始。','單次Cortisol不能直接等同「腎上腺疲勞」。Cortisol→Circadian／HPA Axis Context。Support：睡眠、光照、運動、壓力調節，不是先堆補充品。'],
[74,'HRV心率變異度','🧠神經','自律神經與恢復的一扇窗','看個人Trend','自律神經與恢復狀態的一扇窗。','重點不是和別人比，而是看自己的Baseline與Trend。','睡眠＋呼吸＋運動＋恢復優先；GABA／褪黑素／鎂只能是Support Variable。','','交感／副交感調節＋呼吸＋睡眠＋運動＋壓力＋疾病共同影響心搏間隔。','反映自主神經調節與恢復的一個動態窗口；最適合跟自己的Baseline比較。','看自己的長期Baseline／Trend，不和別人比','「心跳與心跳之間微小變化的資訊」。不是越高永遠越好，最有價值的是看自己的長期趨勢。真正核心＝睡眠＋呼吸＋運動＋恢復。','HRV不是疾病檢驗，但非常適合Life OS，作為Autonomic Regulation Feedback的一部分。GABA／褪黑素／鎂不應直接以「提高HRV」宣稱。產品只是其中Variable。'],
[75,'Blood Pressure血壓','🧠心血管','血液推動血管壁的壓力','心血管／腎臟風險','血液推動血管壁的壓力。','高血壓不是單純「循環不好」。','體重＋飲食＋運動＋睡眠＋醫療管理；EPA＋DHA／鎂僅為適當情境下的營養Support。','','血壓≈心輸出量×周邊血管阻力；再受腎臟、神經、荷爾蒙、血管等控制。','是一個完整循環控制系統的Output，不只是「血管塞住」。','高血壓者下降至適當控制範圍通常正向；避免過低','不要把高血壓只說成「循環不好」。它牽涉心血管、腎臟、神經、荷爾蒙與生活型態等。有高血壓仍應正式評估與治療。','血壓應加入健康Sensor母體。第一線＝標準醫療＋體重＋飲食＋活動＋睡眠等。EPA＋DHA／鎂等只能在適當情境作營養Support。'],
[76,'Waist Circumference腰圍','🧠代謝','最便宜的代謝Sensor之一','腹部脂肪／代謝','最便宜的代謝Sensor之一。','腰圍增加常提示腹部脂肪與代謝風險值得注意。','每月追蹤腰圍＋HbA1c＋TG＋血壓；苦瓜／黃連素／EPA＋DHA只是Support，核心仍是飲食＋運動＋體重。','','長期能量平衡＋脂肪儲存位置＋活動＋荷爾蒙／代謝背景。','提供腹部脂肪與代謝風險的低成本Proxy。','原本過高→下降通常代表代謝方向改善','不需要花幾千元抽血，一條皮尺就可以每月追蹤。腰圍＋血壓＋TG＋HbA1c的趨勢，往往比「我感覺有排毒」更有資訊。','非常高槓桿，比很多昂貴「功能醫學檢驗」更容易反覆追蹤。腰圍↓＋TG↓＋HbA1c↓＋血壓改善，往往比「排毒感覺很好」更能建立Evidence。'],
[77,'Muscle Mass肌肉量','🧠老化','代謝、行動與老化的本錢','阻力訓練＋營養','你的代謝、行動與老化本錢。','肌肉不足不是靠「抗老產品」就能重建。','阻力訓練＋足夠營養＋睡眠＝主控制變數；Q10／粒線寶／NMN／青春方只放Support Layer。','','肌蛋白合成－肌蛋白分解。合成訊號＝阻力訓練＋營養＋荷爾蒙／恢復；分解訊號＝不活動＋疾病＋老化＋能量不足等。','不是單純外表，而是代謝儲備、行動能力與健康老化的重要結構。','維持／增加通常有利，但要配體脂、功能與個人狀態','「你的身體還保留多少代謝與行動的本錢」。真正讓肌肉知道「我要留下來」的強訊號是阻力訓練，再加上足夠營養與睡眠。','應正式升級為Healthy Aging核心Sensor。真正強控制變數：阻力訓練＋足夠營養＋睡眠＋恢復。青春方／NMN／Q10都不能取代肌肉刺激。'],
[78,'BMI','➕體位','用身高體重快速估算體位','配腰圍／體脂／肌肉量','','','','','','','','「用身高和體重快速估算體位的工具」。優點＝簡單；缺點＝不知道你的重量來自肌肉還是脂肪。最好一起看腰圍、體脂與肌肉量。','粗略體重指標。建議一起加入：腰圍、體脂、肌肉量、代謝檢驗。'],
[79,'Body Fat體脂','➕體位','體重裡有多少比例是脂肪','配肌肉量','','','','','','','','「體重裡有多少比例是脂肪」。不要只追求越低越好，真正目標是健康的脂肪與肌肉結構。','可作代謝Feedback，但不應追求單一最低值。需要搭配肌肉量、性別、年齡與健康狀態。'],

['前後判讀：欄位設計與5個自動判讀欄',`每一項固定增加4欄：

④判讀｜Model Update：變好？變差？還是不能只看升降？

    h='<div class="box"><h3>看到紅字的最快導航</h3><div class="row">'+NAV.filter(n=>!q||n[0].toLowerCase().includes(q)).map(n=>`<button data-nums="${r(n[1],n[2]).join(',')}" data-label="${n[0]}">${n[0]} → ${pad(n[1])}–${pad(n[2])}</button>`).join('')+'</div></div>'+
      '<div class="box"><h3>依系統快速找</h3><div class="row">'+SYS.map(s=>`<button data-sys="${s[0]}" data-go="1">${s[1]}${s[2]}｜${pad(s[3])}–${pad(s[4])}</button>`).join('')+'</div></div>'+
      `<div class="box pre"><h3>${F[14][0]}</h3>${esc(F[14][1])}</div><div class="box pre"><h3>${F[0][0]}</h3>${esc(F[0][1])}</div>`;
  }else{
    const fs=F.filter(f=>!q||f.join(' ').toLowerCase().includes(q));
    h=fs.map(f=>`<details${q?' open':''}><summary><span class="nm">${esc(f[0])}</span></summary><div class="bd pre">${esc(f[1])}</div></details>`).join('')||'<div class="box">找不到符合的內容。</div>';
  }
  $('#sub').innerHTML=sub;o.innerHTML=h+'<p class="mu">本工具為衛教與自我整理用途，不取代醫師診斷與治療；資料僅存在這台電腦的瀏覽器。</p>';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.tab){tab=d.tab}
  else if(d.lv){lv=+d.lv}
  else if(d.clr){nums=null}
  else if('sys' in d){sys=d.sys;nums=null;tab='idx'}
  else if(d.nums){nums=d.nums.split(',').map(Number);numLabel=d.label;sys='';tab='idx';$('#q').value=''}
  else if(b.id==='clr'){if(!confirm('確定清除全部前後追蹤資料？'))return;ST={};save()}
  else return;
  render();window.scrollTo(0,0);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){render();return}
  if(t.dataset.c){(ST._c=ST._c||{})[t.dataset.c]=t.value;save();return}
  const k=t.dataset.k;if(!k)return;
  const dt=t.closest('details'),n=dt.dataset.n;(ST[n]=ST[n]||{})[k]=t.value;save();
  dt.querySelector('.res').textContent=resTxt(n);
});
render();
</script>
</body>
</html>
