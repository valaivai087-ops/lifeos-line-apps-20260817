<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LifeOS 七大Node智慧系統</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#23231f;--mute:#6d6b65;--line:#e2ded4;--acc:#2f6f62;--accs:#e2eee8;--a:#2f7d4f;--b:#a8740f;--c:#b2443a;--as:#e6f2ea;--bs:#f7eedb;--cs:#f6e3e0}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--card:#1e2124;--ink:#e7e5e0;--mute:#9b9993;--line:#33373c;--acc:#7cc4b0;--accs:#21332e;--a:#6cc08f;--b:#e0b05a;--c:#ec8378;--as:#1f3027;--bs:#33291a;--cs:#3a2220}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
header{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px 6px}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:18px;margin:0 0 8px;letter-spacing:.5px}
h1 small{font-weight:400;color:var(--mute);font-size:13px;margin-left:6px}
.sbar{display:flex;gap:8px}
#q{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:15px}
#clr{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:8px;padding:0 12px;cursor:pointer}
nav{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:4px;scrollbar-width:thin}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 13px;font-size:14px;cursor:pointer}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
nav button .n{font-size:11px;opacity:.8;margin-left:4px}
main{max-width:1100px;margin:0 auto;padding:16px}
.pane{display:none}.pane.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 6px}
h3{font-size:15px;margin:14px 0 6px;color:var(--acc)}
.mute{color:var(--mute);font-size:13.5px}
.hero{background:var(--accs);border-color:transparent}
.hero h2{font-size:20px}
.quote{border-left:3px solid var(--acc);padding:4px 10px;margin:10px 0 0;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer;text-decoration:none}
.chip:hover{border-color:var(--acc)}
.tag{display:inline-block;font-size:12px;border-radius:5px;padding:0 6px;background:var(--accs);color:var(--acc);font-weight:600;margin-right:4px;white-space:nowrap}
.flow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13.5px}
.flow span{background:var(--accs);border-radius:6px;padding:2px 8px}
.flow i{color:var(--mute);font-style:normal}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:13px;white-space:nowrap}
.tw{overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.box{border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.box b{display:block;font-size:12.5px;color:var(--mute);font-weight:600}
.old{color:var(--c)}.new{color:var(--a)}
.abc{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:8px}
.A,.B,.C{border-radius:9px;padding:9px 11px;font-size:14px}
.A{background:var(--as)}.B{background:var(--bs)}.C{background:var(--cs)}
.A>b{color:var(--a)}.B>b{color:var(--b)}.C>b{color:var(--c)}
.warn{background:var(--cs);border-radius:9px;padding:9px 12px;font-size:14px}
ol,ul{margin:4px 0;padding-left:22px}
.dl{display:grid;grid-template-columns:7.5em 1fr;gap:3px 10px;font-size:14px}
.dl dt{color:var(--mute)}.dl dd{margin:0}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 2px}
input[type=text],input[type=date],select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
textarea{min-height:44px;resize:vertical}
.btn{border:0;background:var(--acc);color:#fff;border-radius:8px;padding:7px 15px;font-size:14px;cursor:pointer;margin:10px 6px 0 0}
.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 14px}
.log{border-top:1px dashed var(--line);padding:8px 0}
.empty{color:var(--mute);text-align:center;padding:30px 0}
.hidden{display:none!important}
mark{background:#ffe27a;color:#222;border-radius:2px}
.score{font-size:22px;font-weight:700;color:var(--acc)}
@media (max-width:600px){.dl{grid-template-columns:1fr}.dl dt{margin-top:4px}}
</style>
</head>

/* 搜尋 */
function unmark(el){el.querySelectorAll("mark").forEach(m=>m.replaceWith(m.textContent));el.normalize()}
function markIn(el,kw){
 const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const hits=[];let t;
 while(t=w.nextNode()){if(t.parentNode.closest("select,textarea,option"))continue;if(t.nodeValue.toLowerCase().includes(kw))hits.push(t)}
 hits.forEach(t=>{const s=t.nodeValue,low=s.toLowerCase(),f=document.createDocumentFragment();let i=0,j;
  while((j=low.indexOf(kw,i))>-1){f.append(s.slice(i,j));const m=document.createElement("mark");m.textContent=s.slice(j,j+kw.length);f.append(m);i=j+kw.length}
  f.append(s.slice(i));t.replaceWith(f)});
}
function applySearch(){
 const kw=$("#q").value.trim().toLowerCase();
 document.querySelectorAll(".pane").forEach(p=>{
  let cnt=0;unmark(p);
  p.querySelectorAll(".item").forEach(it=>{const ok=!kw||it.textContent.toLowerCase().includes(kw);it.classList.toggle("hidden",!ok);if(ok&&kw){cnt++;markIn(it,kw)}});
  p.querySelectorAll(".grp").forEach(g=>{const any=!kw||g.querySelector(".item:not(.hidden)");g.classList.toggle("hidden",!any)});
  p.querySelector(".nores").classList.toggle("hidden",!kw||cnt>0);
  const b=document.querySelector(`nav button[data-tab="${p.id.slice(2)}"] .n`);b.textContent=kw?cnt:"";
 });
 if(kw){const cur=document.querySelector(".pane.on");if(cur&&!cur.querySelector(".item:not(.hidden)")){const first=[...document.querySelectorAll(".pane")].find(p=>p.querySelector(".item:not(.hidden)"));if(first)show(first.id.slice(2))}}
}

$("#expLog").onclick=()=>{const L=store.get("lifeos7_logs",[]);if(!L.length){alert("目前沒有紀錄");return}
 const txt=L.map(x=>[`【${x.date}】${x.node}${x.react?"｜"+x.react:""}`,...LOGF.filter(f=>x[f[0]]).map(f=>`${f[1]}：${x[f[0]]}`),...NODES.filter(n=>x["s"+n.id]).map(n=>`${n.id} ${n.n}：${x["s"+n.id]}`)].join("\n")).join("\n\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+txt],{type:"text/plain;charset=utf-8"}));a.download="LifeOS行動卡紀錄.txt";a.click()};
nodeHint();drawLogs();

show(store.get("lifeos7_tab","home"));
</script>
</body>
