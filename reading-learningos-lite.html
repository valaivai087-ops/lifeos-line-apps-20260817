ord": "visual", "meanings": ["視覺的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P008", "title": "無聲提醒", "blank": 1, "level": 3, "type": "局部精確語意", "evidence": "A visual signal tells readers when the room will close.", "why": "lamps instead of bells 指視覺，audible 指聽覺。", "en": "During exams, the library uses lamps instead of bells. A visual signal tells readers when the room will close. The light is bright enough to be noticeable, but it does not interrupt the silence students need.", "zh": "考試期間，圖書館用燈取代鈴聲。視覺訊號提醒讀者即將閉館。燈光亮得足以被注意，卻不打破學生需要的安靜。"}]}, {"word": "warned", "meanings": ["警告"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P063", "title": "山路警告", "blank": 1, "level": 3, "type": "句型判斷", "evidence": "The ranger warned hikers not to leave the marked path.", "why": "warn 人 not to V 表警告不要做；suggested 不接受這個人加不定詞結構。", "en": "The ranger warned hikers not to leave the marked path. Thick fog prevented them from seeing the cliff edge. Rather than continuing, they decided to wait at a shelter.", "zh": "巡山員警告健行者不要離開標示路徑。濃霧使他們看不見懸崖邊緣。他們決定在避難處等候，不再前進。"}]}, {"word": "was", "meanings": ["是〔過去式單數〕"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P106", "title": "走廊的溫度地圖", "blank": 3, "level": 3, "type": "文法骨架", "evidence": "The corridor beside the kitchen, despite its open windows, was warmer than expected.", "why": "核心 corridor 單數，故 was；不能受複數 windows 干擾選 were。", "en": "The students, equipped with handheld sensors, measured temperatures around the school. A map of the readings revealed several hot spots. The corridor beside the kitchen, despite its open windows, was warmer than expected. Trees planted near the west wall provided shade in the afternoon. These observations, together with maintenance records, helped the principal decide where to add fans.", "zh": "學生帶著手持感測器測量校園溫度。讀值地圖顯示數個熱點。廚房旁走廊雖開著窗，仍比預期熱。西牆旁種的樹在午後提供遮蔭。這些觀察和維護紀錄協助校長決定增設風扇的位置。"}]}, {"word": "weight", "meanings": ["分量／說服力"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P072", "title": "清楚的論點", "blank": 3, "level": 4, "type": "多義判斷", "evidence": "The example gave her argument more weight than a list of slogans would have.", "why": "argument weight 是說服分量，比喻义；mass 不能如此慣用表論據強度。", "en": "The speaker's main point was that convenience can create hidden waste. To make it clear, she compared two lunch habits. The example gave her argument more weight than a list of slogans would have.", "zh": "講者重點是便利可能造成隱藏垃圾。為說清楚，她比較兩種午餐習慣。這個例子比一串口號更能增加論點分量。"}]}, {"word": "where", "meanings": ["…的地方〔關係副詞〕"], "pos": ["Adv"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P136", "title": "從海岸帶回的資料", "blank": 3, "level": 4, "type": "句法判斷", "evidence": "Students noted the places where each sample had been found.", "why": "places where… 表發現的地點，子句主受詞已完整。", "en": "The samples collected during low tide were stored in sealed containers. The researcher who supervised the trip checked every label. Students noted the places where each sample had been found. Because the locations differed, the team kept the groups separate. This allowed comparisons without mixing material from different habitats.", "zh": "退潮時收集的樣本存於密封容器。督導行程的研究者檢查標籤。學生記下各樣本發現位置。因地點不同，團隊分組保存，讓比較時不會混入不同棲地材料。"}]}, {"word": "which", "meanings": ["它／該物〔關係代名詞〕"], "pos": ["Pron"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P094", "title": "關係子句的線索", "blank": 1, "level": 1, "type": "句法判斷", "evidence": "The bridge, which was built by local workers, links two villages.", "why": "逗號後非限定關係子句用 which，不用 that。", "en": "The bridge, which was built by local workers, links two villages. People living on either side use it daily. Although narrow, it provides a safe crossing during the rainy season.", "zh": "這座由當地工人興建的橋連接兩個村莊。住兩側的人每天使用。橋雖窄，卻在雨季提供安全通道。"}]}, {"word": "who", "meanings": ["…的人〔關係代名詞〕"], "pos": ["Pron"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P136", "title": "從海岸帶回的資料", "blank": 2, "level": 4, "type": "句法判斷", "evidence": "The researcher who supervised the trip checked every label.", "why": "researcher 為人，who 在關係子句作主詞。", "en": "The samples collected during low tide were stored in sealed containers. The researcher who supervised the trip checked every label. Students noted the places where each sample had been found. Because the locations differed, the team kept the groups separate. This allowed comparisons without mixing material from different habitats.", "zh": "退潮時收集的樣本存於密封容器。督導行程的研究者檢查標籤。學生記下各樣本發現位置。因地點不同，團隊分組保存，讓比較時不會混入不同棲地材料。"}]}, {"word": "whole", "meanings": ["整部的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P085", "title": "客氣的保留", "blank": 3, "level": 2, "type": "語氣／含意", "evidence": "It should not automatically be read as an enthusiastic endorsement of the whole film.", "why": "只提 scenery，不能擴至 whole film。", "en": "Asked whether he liked the film, Jun said, \"The scenery was lovely.\" He said nothing about the acting or story. His selective praise may imply a reservation. It should not automatically be read as an enthusiastic endorsement of the whole film.", "zh": "被問是否喜歡電影時，俊說：「景色很漂亮。」他沒提演技或故事。選擇性稱讚可能暗示保留，不應自動解作對整部電影的熱烈肯定。"}]}, {"word": "whose", "meanings": ["其／…的〔關係詞〕"], "pos": ["Pron"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P096", "title": "雖然下雨", "blank": 2, "level": 3, "type": "句法判斷", "evidence": "The participants, whose outdoor plans had changed, learned to weave baskets.", "why": "whose outdoor plans 表參與者的計畫；who 後不能直接接名詞 outdoor plans 作所有關係。", "en": "Although the rain was heavy, the indoor workshop continued. The participants, whose outdoor plans had changed, learned to weave baskets. The instructor kept everyone engaged by giving each person a task.", "zh": "雖然雨很大，室內工作坊仍繼續。戶外計畫改變的參與者學編籃。講師分派任務給每個人，讓大家持續投入。"}]}];
let contextState={q:'',ability:''};
function contextRows(){return CONTEXT_BANK.filter(r=>(!contextState.ability||r.tags.includes(contextState.ability))&&[r.word,...r.meanings,...r.pos,...r.examples.map(e=>e.why)].join(' ').toLowerCase().includes(contextState.q.trim().toLowerCase()))}
function contextPanel(){return `<section class="card section"><h2>全篇章語境詞庫</h2><p>從137篇現有文意選填整合而來，按字詞合併；保留不同語境的解題證據。這是既有題庫的學習索引，不另外算成新題。</p><div class="row"><input id="contextSearch" aria-label="搜尋語境詞庫" placeholder="搜尋字詞、中文或解題證據" value="${esc(contextState.q)}"><select id="contextAbility" aria-label="語境能力"><option value="">全部能力</option>${Object.entries(SUPP_ABILITIES).map(([k,v])=>`<option value="${k}" ${contextState.ability===k?'selected':''}>${v}</option>`).join('')}</select></div><p id="contextCount"></p><div style="overflow:auto"><table style="min-width:680px;width:100%;text-align:left"><thead><tr><th>字詞與詞性</th><th>中文與能力</th><th>真實篇章中的用法、證據與解析</th></tr></thead><tbody id="contextRows"></tbody></table></div></section>`}
function updateContext(){const rows=contextRows();document.getElementById('contextCount').textContent=`${CONTEXT_BANK.length}個不重複字詞｜${CONTEXT_BANK.reduce((n,r)=>n+r.examples.length,0)}個原題語境｜目前顯示${rows.length}個字詞`;document.getElementById('contextRows').innerHTML=rows.map(r=>`<tr><td style="padding:14px;border-top:1px solid #ddd;vertical-align:top"><b>${esc(r.word)}</b><br>${esc(r.pos.join(' / '))}</td><td style="padding:14px;border-top:1px solid #ddd;vertical-align:top">${esc(r.meanings.join('；'))}<p>${r.tags.map(k=>`<span class="pill">${SUPP_ABILITIES[k]||k}</span>`).join(' ')}</p></td><td style="padding:14px;border-top:1px solid #ddd">${r.examples.map(e=>`<details><summary>${esc(e.title)} · 第${e.blank}格 · L${e.level} · ${esc(e.type)}</summary><blockquote>${esc(e.evidence)}</blockquote><p><b>解題證據：</b>${esc(e.why)}</p><p><b>英文全文：</b>${esc(e.en)}</p><p><b>繁中全文：</b>${esc(e.zh)}</p>${typeof filters!=='undefined'?`<button data-contextpractice="${e.pid}">開啟這篇練習</button>`:''}</details>`).join('')}</td></tr>`).join('')||'<tr><td colspan="3">沒有符合項目。</td></tr>';document.querySelectorAll('[data-contextpractice]').forEach(b=>b.onclick=()=>openPractice(b.dataset.contextpractice,'repair'))}
function bindContext(){updateContext();document.getElementById('contextSearch').oninput=e=>{contextState.q=e.target.value;updateContext()};document.getElementById('contextAbility').onchange=e=>{contextState.ability=e.target.value;updateContext()}}
function evidencePanel(){if(!DATA.passages[0].questions)return '';return `<section class="card section"><h2>16類閱讀能力｜原題證據與選項改寫 BANK</h2><p>完整索引現有${DATA.passages.reduce((n,p)=>n+p.questions.length,0)}題的關鍵證據，按16類能力整理；不另計新增題數。每筆含原文、繁中全文、正解與全部干擾項理由。</p><label>能力 <select id="evidenceSkill"><option value="">全部16類</option>${SKILLS.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select></label><div id="evidenceRows"></div></section>`}
function bindEvidence(){if(!document.getElementById('evidenceSkill'))return;const draw=()=>{const v=document.getElementById('evidenceSkill').value;document.getElementById('evidenceRows').innerHTML=DATA.passages.flatMap(p=>p.questions.filter(q=>v===''||q.skill===+v).map(q=>`<details class="section"><summary>${esc(skill(q.skill).name)}｜${esc(p.title)}｜${esc(q.zh)}</summary><blockquote>${esc(q.quote)}</blockquote>${answerHTML(q,null)}<details><summary>完整中英篇章</summary>${passageHTML(p)}</details><button data-start="${p.id}">練習本篇</button></details>`)).join('')};draw();document.getElementById('evidenceSkill').onchange=draw}

const READING_LEXICON=[[0, "according to the passage", "根據本文", "題幹要求明示資訊；先定位原文，不加入常識。", "According to the passage, why was the service suspended?", "根據本文，服務為何暫停？", "不要把自己知道的原因當成文中原因。"], [0, "NOT mentioned / EXCEPT", "未提及／除了", "圈出否定詞；逐一核對哪些選項有文本支持。", "Which benefit is NOT mentioned in the passage?", "文中未提及哪項好處？", "未提及不等於作者明確否定。"], [1, "primarily concerned with", "主要探討", "概括各段共同焦點，排除只涵蓋單一例子的選項。", "The passage is primarily concerned with reducing food waste.", "本文主要探討減少食物浪費。", "看到熟悉關鍵字不代表涵蓋全文。"], [1, "aim to illustrate / persuade", "旨在說明／說服", "分辨作者是在解釋現象，還是要讀者接受立場。", "The author aims to illustrate how habits develop.", "作者旨在說明習慣如何形成。", "談到一項政策不一定是在支持政策。"], [2, "explicitly states", "明確指出", "找可直接對照的句子，核對主體、動作與對象。", "The notice explicitly states that registration closes on Friday.", "公告明確指出報名於週五截止。", "別把活動日期與截止日期混為一談。"], [2, "prior to / following", "在……之前／之後", "按時間標記排列事件，回到原文核對先後。", "Participants completed a survey prior to the workshop.", "參與者在工作坊之前填寫問卷。", "先後次序不能只靠文章提及順序猜測。"], [3, "at least / no more than", "至少／不超過", "保留數量界線；at least 含下限，no more than 含上限。", "Each group needs at least three members and no more than six.", "每組至少三人，最多六人。", "至少三人不等於恰好三人。"], [3, "eligible / restricted to", "符合資格／限於", "確認年齡、身分、地點或期間條件是否同時成立。", "The discount is restricted to residents aged sixty or above.", "折扣僅限六十歲以上的居民。", "不可只符合年齡卻漏看居民身分。"], [4, "novel approach", "新穎的方法", "novel 修飾 approach 時是形容詞，不是小說。", "The team tested a novel approach to water storage.", "團隊測試了一種新穎的儲水方法。", "不可固定套用最熟悉的名詞詞義。"], [4, "maintain a claim / maintain equipment", "堅持主張／維護設備", "用受詞與上下文決定 maintain 的意思。", "The author maintains that small changes can matter.", "作者堅持認為小改變也能有影響。", "此處不是維修或維護物品。"], [5, "the former / the latter", "前者／後者", "列出前文兩個對象，按提及次序對應。", "We compared cycling and driving. The former produced less noise.", "我們比較騎車與開車；前者產生較少噪音。", "former 不一定指距離最近的名詞。"], [5, "this shift / such a practice", "這項轉變／這種做法", "回找前文完整變化或行動，不只找單一物件。", "People began repairing items. This shift reduced replacement purchases.", "人們開始修理物品；這項轉變減少了替換新品的購買。", "this shift 指行為轉變，不是物品本身。"], [6, "be unlikely to / have little chance of", "不太可能／機會很小", "辨認機率相近的改寫，保留不確定程度。", "The plan is unlikely to succeed without local support.", "若沒有地方支持，計畫不太可能成功。", "不太可能不能改成絕對不可能。"], [6, "enable / make it possible for", "使能夠／讓……成為可能", "核對誰獲得能力、能做什麼及條件是否保留。", "The grant enabled the team to buy equipment.", "補助讓團隊得以購買設備。", "得以購買不代表已完成所有研究。"], [7, "nevertheless / even so", "然而／即使如此", "找前句形成的預期與後句的逆向結果。", "The trial was expensive. Even so, the team continued.", "試驗成本很高；即使如此，團隊仍繼續。", "不能誤讀成因為昂貴所以繼續。"], [7, "as a consequence / thereby", "因此／藉此而", "辨認前項行動與後項結果，核對邏輯方向。", "The town added bus routes, thereby improving access.", "鎮上新增公車路線，藉此改善交通可及性。", "結果不能反過來當成前項原因。"], [8, "a case in point", "一個恰當的例子", "判斷本段例子支援哪個較廣泛的主張。", "The village library is a case in point.", "村裡的圖書館就是一個例子。", "例子通常不是整篇文章唯一主題。"], [8, "acknowledge a limitation", "承認一項侷限", "本段可能限制前述結論，而非完全推翻它。", "The final paragraph acknowledges a limitation of the survey.", "最後一段承認調查的一項侷限。", "承認限制不等於研究毫無價值。"], [9, "problem–solution", "問題—解決方式", "標記問題、方法、結果的段落分工。", "The article identifies a problem before proposing a solution.", "文章先指出問題，再提出解決方式。", "勿把方法段的例子誤當另一個主問題。"], [9, "chronological / thematic", "按時間／按主題", "判斷段落依事件先後，還是依不同面向分組。", "The account is organized chronologically rather than by topic.", "這篇敘述按時間，而非按主題組織。", "出現時間詞不表示所有段落都按年代排列。"], [10, "reasonably infer", "合理推論", "把至少一項明示證據與最小必要推論連結。", "We can reasonably infer that some visitors learned new skills.", "我們可以合理推論，有些訪客學到新技能。", "不可擴大成所有訪客都已精通。"], [10, "suggest but not establish", "暗示但未確立", "辨認文章支持的可能性，不補上尚未證實的結論。", "The results suggest, but do not establish, a lasting benefit.", "結果暗示可能有長期好處，但尚未確立。", "有跡象不等於已獲定論。"], [11, "confounding factor", "干擾因素", "找可能同時影響原因與結果的其他因素。", "Income may be a confounding factor in the observed relationship.", "收入可能是觀察到的關係中的干擾因素。", "不能忽略替代解釋就宣稱因果。"], [11, "reverse causation", "反向因果", "檢查是否也可能是 B 影響 A。", "The study cannot rule out reverse causation.", "這項研究無法排除反向因果。", "A 與 B 相關，不代表方向必定是 A 到 B。"], [12, "relative to / on the same basis", "相對於／依相同基準", "統一基期、單位和母體後再比較。", "Costs fell relative to last year when measured on the same basis.", "以相同基準衡量時，成本較去年下降。", "金額與百分比不能直接當成同一比較量。"], [12, "whereas both / in both cases", "而兩者都／在兩種情況下", "跨段整理共同點與差異，避免只讀其中一段。", "Both programs improved access, whereas only one reduced costs.", "兩項方案都改善可及性，但只有一項降低成本。", "不能把其中一方的特點套到雙方。"], [13, "all / solely / invariably", "全部／僅僅／總是", "檢查選項是否把有限敘述絕對化。", "The passage says some users benefited, not that all users invariably did.", "本文說有些使用者受益，並非所有使用者總是受益。", "絕對詞是核對訊號，不是看到就必錯。"], [13, "true but irrelevant", "雖正確但不相關", "即使選項有原文支持，仍要回答題幹要求。", "The date is correct but irrelevant to the question about purpose.", "日期正確，但與詢問目的的題目無關。", "在文章找得到，不代表就是本題答案。"], [14, "anecdotal evidence", "個案或軼事證據", "辨認個案能支持的範圍，不當成普遍證明。", "One successful case provides anecdotal evidence, not a general guarantee.", "單一成功案例提供個案證據，不是普遍保證。", "感人的個案不能直接代表全部族群。"], [14, "sample size / representative sample", "樣本數／具代表性的樣本", "同時檢查數量與抽樣對象是否適合推論母體。", "A large sample is not necessarily representative.", "大型樣本不一定具代表性。", "人數多不能自動消除選樣偏差。"], [15, "consistent with / contradict", "與……一致／矛盾", "把候選答案放回各段，核對主旨、限制與態度。", "The conclusion is consistent with both the benefits and the limits described.", "結論同時符合文中描述的好處與限制。", "局部句子通順，仍可能與其他段落矛盾。"], [15, "qualified conclusion", "有限定的結論", "結語應保留全文的條件與不確定性。", "The author offers a qualified conclusion: the approach may help in some settings.", "作者提出有限定的結論：這種方法在某些情境可能有幫助。", "不可改寫成任何情況下都有效。"]];
let readingLexState={skill:'',q:''};
function readingLexPanel(){return `<section class="card"><h1>閱讀測驗｜16類能力詞彙與片語 BANK</h1><p>新增 ${READING_LEXICON.length} 筆閱讀專用用語，每類2筆。高頻片語頁與補充詞彙頁共用同一份資料，不重複計數。</p><div class="row"><input id="readingLexSearch" placeholder="搜尋英文、中文、陷阱或用法" aria-label="搜尋閱讀詞彙" value="${esc(readingLexState.q)}"><select id="readingLexSkill" aria-label="閱讀16類篩選"><option value="">全部16類</option>${SKILLS.map(t=>`<option value="${t.id}" ${readingLexState.skill===String(t.id)?'selected':''}>${String(t.id+1).padStart(2,'0')} ${t.name}（2筆）</option>`).join('')}</select><button id="readingLexClear">清除篩選</button></div><p id="readingLexCount"></p><div style="overflow:auto"><table style="width:100%;min-width:760px;text-align:left"><thead><tr><th>錯誤類型</th><th>核心用語</th><th>用法、解題動作與中英例句</th><th>易錯提醒／練習</th></tr></thead><tbody id="readingLexRows"></tbody></table></div></section>`}
function updateReadingLex(){const rows=READING_LEXICON.filter(r=>(readingLexState.skill===''||r[0]===+readingLexState.skill)&&r.slice(1).join(' ').toLowerCase().includes(readingLexState.q.toLowerCase()));document.getElementById('readingLexCount').textContent=`顯示 ${rows.length}／${READING_LEXICON.length} 筆｜涵蓋16／16類｜一頁完整呈現`;document.getElementById('readingLexRows').innerHTML=rows.map(r=>`<tr>${[`${skill(r[0]).name}<p>${skill(r[0]).plain}</p>`,`<b>${esc(r[1])}</b><p>${esc(r[2])}</p>`,`${esc(r[3])}<blockquote>${esc(r[4])}</blockquote><p>${esc(r[5])}</p>`,`${esc(r[6])}<p><button data-filter="${r[0]}">本類閱讀題庫</button></p>`].map(v=>`<td style="vertical-align:top;padding:15px;border-top:1px solid #ddd">${v}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="4">沒有符合條件的用語。</td></tr>'}
function bindReadingLex(){updateReadingLex();document.getElementById('readingLexSkill').onchange=e=>{readingLexState.skill=e.target.value;updateReadingLex()};document.getElementById('readingLexSearch').oninput=e=>{readingLexState.q=e.target.value;updateReadingLex()};document.getElementById('readingLexClear').onclick=()=>{readingLexState={skill:'',q:''};document.getElementById('readingLexSearch').value='';document.getElementById('readingLexSkill').value='';updateReadingLex()}}
function supplement(){return DATA.passages[0].questions?readingLexPanel()+`<details class="section"><summary>展開通用詞彙與七項基礎能力延伸庫</summary>${generalSupplement()}</details>`:generalSupplement()}
function bindSupplement(){bindGeneralSupplement();if(DATA.passages[0].questions)bindReadingLex()}
function phraseBank(){return DATA.passages[0].questions?readingLexPanel()+`<details class="section"><summary>展開通用高頻片語與原題證據索引</summary>${generalPhraseBank()}</details>`:generalPhraseBank()}
function bindPhraseBank(){bindGeneralPhraseBank();if(DATA.passages[0].questions)bindReadingLex()}

, "plain": "要不要把兩段一起看？", "definition": "整合不同段落、表格、數據或條件，使用一致基準進行比較。", "node": "N13｜合併多處資訊", "action": "列資訊來源→統一比較單位→合併全部條件→回文核算"}, {"id": 13, "name": "干擾選項辨識", "plain": "這是不是陷阱答案？", "definition": "辨識以真實細節包裝的錯誤、範圍擴大、因果倒置、無中生有或答非所問。", "node": "N14｜識破選項陷阱", "action": "指出錯誤選項哪一部分不成立→命名陷阱→用原文反駁"}, {"id": 14, "name": "證據充分度", "plain": "證據真的夠嗎？", "definition": "檢查現有證據是否足以支撐選項的強度與範圍，知道何時需要保留判斷。", "node": "N15｜校準主張強度", "action": "圈一定／全部／唯一等強詞→檢查證據涵蓋範圍→不足就保留"}, {"id": 15, "name": "全文一致性檢查", "plain": "放回全文還合理嗎？", "definition": "在局部合理之外，再確認選項與全文主旨、立場、條件和發展方向一致。", "node": "N16｜全文回讀驗證", "action": "把答案放回各段→逐段查矛盾→核對作者最後結論"}, {"id": 16, "name": "尚待確認", "plain": "目前還缺哪些證據？", "definition": "已有錯誤紀錄，但證據不足以可靠指定個人錯因，或舊資料無法對應新的能力分類。", "node": "N00｜補充診斷證據", "action": "保存題目與作答理由→教師核對→以陌生文章新題探測"}], "passages": [{"id": "R01", "title": "修理咖啡館不只是修東西", "level": 2, "group": 0, "en": ["On the first Saturday of each month, a community hall becomes a repair café. People bring broken lamps, torn bags, and slow laptops. Volunteers help them investigate the problems rather than simply taking the objects away to fix them.", "The organizers measure success in more than repaired items. Visitors learn how objects work, and people who rarely meet share tools and stories. Not everything can be repaired, and volunteers refuse jobs that require unsafe electrical work. Even then, visitors often leave knowing more than when they arrived.", "The café does not promise to eliminate waste by itself. Its smaller ambition is to change a habit: before replacing something, people might pause, ask questions, and consider whether it still has a useful life."], "zh": ["每月第一個週六，社區活動中心變成修理咖啡館。人們帶來壞燈、破袋和變慢的筆電。志工協助一起找問題，而非直接拿走修好。", "主辦者不只用修好幾件衡量成功。訪客學到物品原理，平常少碰面的人共享工具與故事。不是所有物品都能修，志工也拒絕不安全的電工作業。即使未修好，訪客仍常帶著更多知識離開。", "咖啡館不承諾單靠自己消除垃圾。較小的目標是改變習慣：替換東西前先停下、提問，考慮物品是否還有使用價值。"], "questions": [{"id": "R01Q1", "skill": 1, "en": "What is the main purpose of the passage?", "zh": "本文主要目的為何？", "options": [{"en": "To compare laptop brands.", "zh": "比較筆電品牌。"}, {"en": "To explain how repair activities can change habits.", "zh": "說明修理活動如何改變習慣。"}, {"en": "To promise that all damaged objects can be fixed.", "zh": "保證所有壞物都能修。"}, {"en": "To argue that volunteers should replace professionals.", "zh": "主張志工應取代專業人士。"}], "answer": 1, "quote": "Its smaller ambition is to change a habit", "reason": "全文從共同找問題、學習到替換前思考，中心是改變物品使用習慣。", "why": ["未比較品牌。", "連結活動方式與末段目的。", "文中明說不是所有物品都可修。", "拒絕危險工作，不主張取代專業。"]}, {"id": "R01Q2", "skill": 1, "en": "Which title best fits the passage?", "zh": "哪個標題最適合？", "options": [{"en": "A Café That Serves No Purpose", "zh": "沒有用途的咖啡館"}, {"en": "The Fastest Way to Buy New Lamps", "zh": "最快買新燈的方法"}, {"en": "Repairing Objects, Rethinking Habits", "zh": "修理物品，重新思考習慣"}, {"en": "An End to Every Kind of Waste", "zh": "終結所有垃圾"}], "answer": 2, "quote": "before replacing something, people might pause, ask questions", "reason": "修物件與思考習慣涵蓋前兩段活動和末段核心。", "why": ["學習和交流都有用途。", "文中鼓勵先思考再替換。", "同時涵蓋行動與主旨。", "文中明確否認單靠活動消除垃圾。"]}, {"id": "R01Q3", "skill": 2, "en": "Which task would volunteers refuse?", "zh": "志工會拒絕哪項工作？", "options": [{"en": "One involving unsafe electrical work.", "zh": "涉及不安全電工作業。"}, {"en": "Any job involving a torn bag.", "zh": "任何破袋修理。"}, {"en": "Explaining how an object works.", "zh": "解釋物件原理。"}, {"en": "Sharing tools with visitors.", "zh": "與訪客共享工具。"}], "answer": 0, "quote": "volunteers refuse jobs that require unsafe electrical work", "reason": "第二段直接指出拒絕條件為不安全電工作業。", "why": ["符合明示條件。", "破袋是受理的例子。", "解釋原理是活動價值。", "共享工具是文中正向描述。"]}, {"id": "R01Q4", "skill": 10, "en": "What can reasonably be inferred about a visit?", "zh": "一次到訪可合理推論什麼？", "options": [{"en": "It is valuable only if an object is repaired.", "zh": "只有修好物件才有價值。"}, {"en": "It always saves more money than buying a replacement.", "zh": "一定比買新品省更多。"}, {"en": "It guarantees professional certification.", "zh": "保證取得專業證照。"}, {"en": "It may be useful even when the object remains broken.", "zh": "即使物件沒修好也可能有收穫。"}], "answer": 3, "quote": "Even then, visitors often leave knowing more than when they arrived.", "reason": "無法修好時仍可能學到知識，因此有用不只取決於修理成功。", "why": ["忽略學習收穫。", "未比較金錢。", "未提證照。", "符合有限且有證據的推論。"]}, {"id": "R01Q5", "skill": 0, "en": "If a question asks what volunteers would refuse, what should the reader locate?", "zh": "若題目問志工會拒絕什麼，應定位哪種資訊？", "options": [{"en": "The monthly date only.", "zh": "只找每月日期。"}, {"en": "The explicit exclusion from the service.", "zh": "服務明確排除的工作。"}, {"en": "The café's broad purpose only.", "zh": "只找咖啡館廣泛目的。"}, {"en": "The price of replacement laptops.", "zh": "替換筆電價格。"}], "answer": 1, "quote": "volunteers refuse jobs that require unsafe electrical work", "reason": "would refuse 要求拒絕的工作，而非活動目的或日期。", "why": ["日期不回答拒絕哪類工作。", "辨明題幹任務後找排除條件。", "目的不是所問題項。", "原文未列價格。"]}, {"id": "R01Q6", "skill": 6, "en": "Which statement accurately restates the volunteers' approach?", "zh": "哪句正確改寫志工的作法？", "options": [{"en": "They repair every object without involving visitors.", "zh": "他們不讓訪客參與且修好所有東西。"}, {"en": "They replace all objects immediately.", "zh": "他們立刻換掉所有物件。"}, {"en": "They work with visitors to understand what is wrong.", "zh": "他們和訪客一起理解問題。"}, {"en": "They teach only professional electricians.", "zh": "他們只教專業電工。"}], "answer": 2, "quote": "help them investigate the problems rather than simply taking the objects away", "reason": "共同找問題保留 help 與 investigate 的意思。", "why": ["改成不參與且全部成功，增加原文沒有的保證。", "和修理前思考相反。", "同義改寫未擴大原意。", "沒有只限專業者。"]}, {"id": "R01Q7", "skill": 13, "en": "Why is \"The café eliminates all waste\" a trap answer?", "zh": "「咖啡館消除所有垃圾」為何是陷阱答案？", "options": [{"en": "It changes a limited ambition into an absolute result.", "zh": "把有限目標誇大為絕對成果。"}, {"en": "It gives the correct monthly date.", "zh": "提供正確日期。"}, {"en": "It uses a synonym for volunteer.", "zh": "用了志工的同義詞。"}, {"en": "It understates a guaranteed achievement.", "zh": "低估已保證的成就。"}], "answer": 0, "quote": "does not promise to eliminate waste by itself", "reason": "陷阱在於移除否定並擴大成全部成果。", "why": ["同時辨識絕對化與否定反轉。", "選項未談日期。", "與同義字無關。", "原文根本沒保證。"]}, {"id": "R01Q8", "skill": 15, "en": "Which closing sentence would remain consistent with the whole passage?", "zh": "加上哪句結語仍與全文一致？", "options": [{"en": "Unrepaired items make every visit worthless.", "zh": "未修好的物品讓每次到訪都無價值。"}, {"en": "Replacement should never happen under any circumstances.", "zh": "任何情況都不能替換。"}, {"en": "Safety rules should be ignored to reduce waste.", "zh": "應忽略安全規則減廢。"}, {"en": "Repair can encourage learning even when it cannot save every object.", "zh": "即使無法救回所有物品，修理仍能促進學習。"}], "answer": 3, "quote": "visitors often leave knowing more than when they arrived", "reason": "學習價值、安全限制與非萬能目標三者都保留。", "why": ["與第二段收穫矛盾。", "把考慮修理擴成禁止替換。", "與拒絕危險工作矛盾。", "符合各段且無過度承諾。"]}]}, {"id": "R02", "title": "沒有單一正解的公園", "level": 3, "group": 0, "en": ["When a city asked residents to design a small park, the first survey seemed to demand everything: a quiet garden, a playground, a performance space, and a dog area. The site was too small to give each request a separate zone.", "Instead of choosing the most popular request and ignoring the rest, planners invited residents to discuss when they would use the park. The conversations revealed that many needs occurred at different times. A paved area could host morning exercise and evening performances. A movable barrier could keep dogs away during children's activities.", "The final design did not satisfy every wish. Some activities still had to be scheduled, and users needed to cooperate. Yet the process changed the question from \"Whose request wins?\" to \"How can a limited place serve different people?\""], "zh": ["市府請居民設計小公園，首輪調查似乎什麼都要：安靜花園、遊戲區、表演區、狗活動区。但場地不足以各設一區。", "規劃者沒有只採最熱門選項，而邀大家討論使用時間。許多需求發生在不同時段。鋪面區可早晨運動、晚上表演；移動隔欄可在兒童活動時讓狗避開。", "最終設計並未滿足每個願望。有些活動仍需排程，使用者須合作。但問題從「誰的要求勝出」變成「有限空間如何服務不同人」。"], "questions": [{"id": "R02Q1", "skill": 1, "en": "What is the central idea?", "zh": "中心思想為何？", "options": [{"en": "Popular activities should exclude less popular ones.", "zh": "熱門活動應排除其他活動。"}, {"en": "Small parks cannot serve communities.", "zh": "小公園無法服務社區。"}, {"en": "Cooperation and timing can help reconcile competing needs.", "zh": "合作與時段安排能協調不同需求。"}, {"en": "Every resident received a separate zone.", "zh": "每位居民都有獨立區域。"}], "answer": 2, "quote": "many needs occurred at different times", "reason": "討論使用時間形成共享安排，末段強調服務不同人。", "why": ["規劃者未只選最熱門。", "設計找出共享方式。", "涵蓋方法與主旨。", "場地不足以各設一區。"]}, {"id": "R02Q2", "skill": 1, "en": "Why does the author end with two contrasting questions?", "zh": "作者為何以兩個對比問句結尾？", "options": [{"en": "To show a shift from competition to shared problem-solving.", "zh": "呈現從爭勝到共同解題的轉變。"}, {"en": "To introduce an unrelated debate about taxes.", "zh": "引入無關的稅務辯論。"}, {"en": "To prove that surveys are always useless.", "zh": "證明調查總是沒用。"}, {"en": "To announce that the park has closed.", "zh": "宣告公園關閉。"}], "answer": 0, "quote": "How can a limited place serve different people?", "reason": "兩問句重述本文觀點轉變：不比誰贏，而找共用方式。", "why": ["對應末段主旨。", "沒有稅務議題。", "只指出首輪調查不足，未否定所有調查。", "公園設計完成，非關閉。"]}, {"id": "R02Q3", "skill": 2, "en": "How would the paved area be used?", "zh": "鋪面區如何使用？", "options": [{"en": "Only as a permanent dog zone.", "zh": "僅作永久狗區。"}, {"en": "For morning exercise and evening performances.", "zh": "早晨運動與晚上表演。"}, {"en": "For a separate garden for each resident.", "zh": "為每位居民設獨立花園。"}, {"en": "Only when all other areas were closed.", "zh": "只有其他區全關閉時使用。"}], "answer": 1, "quote": "A paved area could host morning exercise and evening performances.", "reason": "使用時段與活動在第二段明示。", "why": ["狗區並非唯一用途。", "符合原文明示時間。", "沒有私人花園安排。", "未設定此條件。"]}, {"id": "R02Q4", "skill": 10, "en": "What is a reasonable conclusion about the final design?", "zh": "關於最終設計，哪個結論合理？", "options": [{"en": "It removed every need for rules.", "zh": "它消除所有規則需求。"}, {"en": "It provided unlimited space.", "zh": "它提供無限空間。"}, {"en": "It made cooperation unnecessary.", "zh": "它讓合作變得不必要。"}, {"en": "Its success still depended partly on users' behavior.", "zh": "成功仍部分取決於使用者行為。"}], "answer": 3, "quote": "users needed to cooperate", "reason": "排程與合作仍必要，設計本身不能保證所有使用衝突消失。", "why": ["仍需排程。", "場地始終有限。", "原文明說需要合作。", "推論範圍符合證據。"]}, {"id": "R02Q5", "skill": 7, "en": "What relationship does \"Yet\" introduce in the final paragraph?", "zh": "末段 Yet 引入什麼關係？", "options": [{"en": "A list of identical wishes.", "zh": "列出相同願望。"}, {"en": "A contrast between remaining limitations and a useful change in thinking.", "zh": "對比仍有局限與思考上的進展。"}, {"en": "A claim that no discussion occurred.", "zh": "主張未曾討論。"}, {"en": "A sequence of unrelated dates.", "zh": "無關日期順序。"}], "answer": 1, "quote": "Yet the process changed the question", "reason": "前文承認未滿足所有願望，Yet 後仍肯定問題意識改變。", "why": ["不是列舉願望。", "辨識讓步後的正向轉折。", "確實進行討論。", "不是時間排序。"]}, {"id": "R02Q6", "skill": 9, "en": "Which outline best matches the three paragraphs?", "zh": "哪個架構最符合三段？", "options": [{"en": "Final solution → ancient history → unrelated story.", "zh": "最終解法→古代史→無關故事。"}, {"en": "Equal needs → unlimited space → total agreement.", "zh": "需求相同→無限空間→完全同意。"}, {"en": "Competing demands → shared-use strategy → qualified outcome.", "zh": "需求競爭→共用策略→有保留的成果。"}, {"en": "Dog rules → ticket sales → travel advice.", "zh": "養狗規則→售票→旅遊建議。"}], "answer": 2, "quote": "The final design did not satisfy every wish.", "reason": "依段落看，首段問題、第二段協商策略、第三段效果與限制。", "why": ["文中沒有古代史。", "三個部分都與事實不符。", "對應全文的發展順序。", "沒有售票旅遊。"]}, {"id": "R02Q7", "skill": 14, "en": "Does the passage provide enough evidence to say every resident was satisfied?", "zh": "證據足以說每位居民都滿意嗎？", "options": [{"en": "No; the final design did not satisfy every wish.", "zh": "不足；設計並未滿足每個願望。"}, {"en": "Yes; all requests received separate zones.", "zh": "足夠；所有需求都有獨立區。"}, {"en": "Yes; discussion always guarantees agreement.", "zh": "足夠；討論總保證共識。"}, {"en": "No; the park was never designed.", "zh": "不足；公園從未被設計。"}], "answer": 0, "quote": "did not satisfy every wish", "reason": "every 是全稱，文本不僅不足，還明示未全部滿足。", "why": ["主張強度符合原文限制。", "首段說空間不足。", "原文無此保證。", "設計已完成。"]}, {"id": "R02Q8", "skill": 6, "en": "Which phrase best restates \"occurred at different times\"?", "zh": "哪個片語最貼近 occurred at different times？", "options": [{"en": "Required entirely different cities.", "zh": "需要完全不同城市。"}, {"en": "Happened simultaneously in every case.", "zh": "每次都同時發生。"}, {"en": "Were impossible to schedule.", "zh": "不可能安排時間。"}, {"en": "Did not all need the space at the same moment.", "zh": "並非都在同一時刻需要空間。"}], "answer": 3, "quote": "many needs occurred at different times", "reason": "不同時間表示可錯開使用，不能擴為完全不衝突。", "why": ["城市不是時間。", "同時與不同時相反。", "可以排程共享。", "保留時間差異而不加保證。"]}]}, {"id": "R03", "title": "博物館工作坊通知", "level": 2, "group": 1, "en": ["The City Museum will hold a printing workshop on May 18. Visitors aged twelve and above may join. Registration opens online on May 1 and closes on May 12, or earlier if all twenty places are taken. Paying the fee does not complete registration until the applicant receives a confirmation email.", "Participants should arrive at 9:40 a.m. The workshop begins at 10:00 and ends at noon. Tools and paper are provided, but participants must bring an apron. Anyone canceling by May 14 will receive a full refund. Later cancellations will not be refunded, although a registered participant may transfer the place to another eligible person after informing the museum.", "The museum asks visitors to read these conditions carefully to avoid confusion on the day."], "zh": ["市立博物館於5月18日辦版畫工作坊，12歲以上可參加。線上報名5月1日開始、5月12日截止；20個名額滿了會提早截止。繳費後仍須收到確認信才算完成報名。", "參加者9:40到場，活動10點到中午。館方提供工具紙張，圍裙自備。5月14日前取消可全額退費，之後不退，但通知館方後可把名額轉給另一位符合資格的人。", "館方請訪客讀清條件，避免當天混亂。"], "questions": [{"id": "R03Q1", "skill": 3, "en": "What completes registration?", "zh": "何者代表完成報名？", "options": [{"en": "Paying without receiving any message.", "zh": "繳費但未收到任何訊息。"}, {"en": "Receiving a confirmation email after payment.", "zh": "繳費後收到確認信。"}, {"en": "Arriving at the museum on May 18.", "zh": "5月18日到館。"}, {"en": "Borrowing an apron.", "zh": "借到圍裙。"}], "answer": 1, "quote": "until the applicant receives a confirmation email", "reason": "until 指出完成條件，不只繳費。", "why": ["少了確認信。", "符合完整條件。", "到場不取代報名。", "圍裙與完成報名無關。"]}, {"id": "R03Q2", "skill": 2, "en": "Which statement follows the notice?", "zh": "哪項符合通知？", "options": [{"en": "Registration must remain open until May 12.", "zh": "報名一定開到5月12日。"}, {"en": "Participants must bring their own paper.", "zh": "參加者須自備紙。"}, {"en": "A person canceling on May 13 can get a full refund.", "zh": "5月13日取消可全額退費。"}, {"en": "All late cancellations receive refunds.", "zh": "所有晚取消者都可退費。"}], "answer": 2, "quote": "Anyone canceling by May 14 will receive a full refund.", "reason": "5月13日早於截止14日，符合全退條件。", "why": ["額滿可提早截止。", "紙張由館方提供。", "日期符合退費限制。", "晚取消明說不退。"]}, {"id": "R03Q3", "skill": 4, "en": "What does \"eligible\" mean here?", "zh": "eligible 在此意為何？", "options": [{"en": "Qualified under the participation rules.", "zh": "符合參加規則資格的。"}, {"en": "Already employed by the museum.", "zh": "已受僱於博物館的。"}, {"en": "Able to arrive after noon.", "zh": "能中午後抵達的。"}, {"en": "Unwilling to pay.", "zh": "不願付費的。"}], "answer": 0, "quote": "another eligible person", "reason": "可轉讓對象仍須符合如年齡等參加條件。", "why": ["符合轉讓限制的語境。", "未要求館員身分。", "活動中午已結束。", "與參加資格無此關係。"]}, {"id": "R03Q4", "skill": 8, "en": "What is the function of the second paragraph?", "zh": "第二段的功能為何？", "options": [{"en": "To describe the history of printing.", "zh": "描述版畫歷史。"}, {"en": "To criticize the registration system.", "zh": "批評報名系統。"}, {"en": "To compare two museums.", "zh": "比較兩館。"}, {"en": "To explain practical arrangements and cancellation rules.", "zh": "說明實際安排與取消規則。"}], "answer": 3, "quote": "Tools and paper are provided, but participants must bring an apron.", "reason": "第二段涵蓋時間、自備物、退費與轉讓，屬參加者行動指引。", "why": ["未談歷史。", "未評價系統。", "未比較兩館。", "概括全段而不只抓單一細節。"]}, {"id": "R03Q5", "skill": 0, "en": "To answer a question about when registration is complete, which distinction matters?", "zh": "回答何時報名完成，應先辨認哪個差別？", "options": [{"en": "The museum's age versus the visitor's age.", "zh": "館齡與訪客年齡。"}, {"en": "Paying the fee versus receiving final confirmation.", "zh": "繳费與收到最終確認。"}, {"en": "Printing versus painting history.", "zh": "版畫與繪畫史。"}, {"en": "Paper color versus apron color.", "zh": "紙與圍裙顏色。"}], "answer": 1, "quote": "Paying the fee does not complete registration until", "reason": "題幹問完成條件，需找繳費後仍待確認的界線。", "why": ["非報名完成條件。", "定位真正受問的程序差異。", "無關藝術史。", "未問顏色。"]}, {"id": "R03Q6", "skill": 3, "en": "Can a person aged eleven attend under the stated rules?", "zh": "依明示規則，11歲者能參加嗎？", "options": [{"en": "Yes, if they own an apron.", "zh": "可以，有圍裙即可。"}, {"en": "Yes, because all ages are allowed.", "zh": "可以，不限年齡。"}, {"en": "No; participants must be at least twelve.", "zh": "不行，須滿12歲。"}, {"en": "No; only museum staff can attend.", "zh": "不行，只有館員可參加。"}], "answer": 2, "quote": "Visitors aged twelve and above may join.", "reason": "年齡條件為至少12，不可用其他條件取代。", "why": ["圍裙不取代年齡門檻。", "文中有年齡限制。", "完整保留最低年齡條件。", "未要求館員身分。"]}, {"id": "R03Q7", "skill": 7, "en": "What does \"but\" connect in the sentence about tools, paper, and aprons?", "zh": "工具、紙與圍裙句中的 but 連接何種關係？", "options": [{"en": "What the museum supplies versus what participants must bring.", "zh": "館方提供物與參加者須自備物的對比。"}, {"en": "Two identical lists of supplied items.", "zh": "兩份相同供應清單。"}, {"en": "An event and its unrelated cause.", "zh": "事件與無關原因。"}, {"en": "The same rule repeated without change.", "zh": "完全不變的重述。"}], "answer": 0, "quote": "Tools and paper are provided, but participants must bring an apron.", "reason": "前半是供應，後半是自備，but 標示責任分界。", "why": ["符合兩側內容的對比。", "清單並不相同。", "不是因果。", "責任對象改變。"]}, {"id": "R03Q8", "skill": 13, "en": "Why is \"Registration always stays open until May 12\" misleading?", "zh": "「報名一定開到5月12日」為何誤導？", "options": [{"en": "It correctly preserves every condition.", "zh": "它完整保留條件。"}, {"en": "It confuses the workshop with a concert.", "zh": "它把工作坊當音樂會。"}, {"en": "It changes the minimum age.", "zh": "它改變最低年齡。"}, {"en": "It omits the possibility of closing earlier when full.", "zh": "它漏掉額滿會提早截止。"}], "answer": 3, "quote": "or earlier if all twenty places are taken", "reason": "陷阱利用真日期，但刪掉提早額滿的條件。", "why": ["漏了例外而非完整保留。", "未涉及活動種類。", "未涉及年齡。", "精確指出被刪除的限制。"]}]}, {"id": "R04", "title": "社區渡輪的新規則", "level": 3, "group": 1, "en": ["From June 3, the island ferry will accept bicycles on weekday departures before 8:00 a.m. and after 6:00 p.m. Each sailing can carry up to six bicycles. Riders must reserve a bicycle space separately from their passenger ticket. A passenger reservation alone does not guarantee space for a bicycle.", "On weekends, bicycles are allowed only on the 7:00 a.m. departure. During strong winds, the captain may suspend bicycle transport while continuing to carry passengers. Riders will receive a refund for the bicycle fee in that case, but the passenger ticket remains valid.", "The operator introduced the policy after residents asked for more commuting options. It will review the arrangement after two months using demand records and safety reports."], "zh": ["6月3日起，離島渡輪在平日早上8點前、晚上6點後的班次可載自行車，每班最多6輛。車位須與乘客票分開預約，只有人票不保證車位。", "週末只限早上7點班次。強風時，船長可暂停載車但仍載人。此時退車費，人票仍有效。", "居民希望有更多通勤方式，業者因此推出政策；兩個月後依需求與安全紀錄檢討。"], "questions": [{"id": "R04Q1", "skill": 3, "en": "Which sailing permits bicycles under the regular rules?", "zh": "依一般規則，哪班可載車？", "options": [{"en": "A weekday departure at 9:00 a.m.", "zh": "平日早上9點。"}, {"en": "A weekend departure at 7:00 a.m.", "zh": "週末早上7點。"}, {"en": "Any weekend evening departure.", "zh": "任一週末晚間班次。"}, {"en": "A weekday departure at exactly 8:00 a.m.", "zh": "平日正好早上8點。"}], "answer": 1, "quote": "On weekends, bicycles are allowed only on the 7:00 a.m. departure.", "reason": "週末唯一允許班次直接明示。", "why": ["不在早8前或晚6後。", "符合唯一週末時段。", "週末非任意晚間皆可。", "before 8 不包含正好8點。"]}, {"id": "R04Q2", "skill": 2, "en": "What happens if strong winds stop bicycle transport but not passenger service?", "zh": "強風只停止載車時如何處理？", "options": [{"en": "Both tickets become invalid.", "zh": "人車票都失效。"}, {"en": "No fee is refunded.", "zh": "任何費用都不退。"}, {"en": "The bicycle fee is refunded while the passenger ticket stays valid.", "zh": "退車費，人票仍有效。"}, {"en": "Passengers must buy a second passenger ticket.", "zh": "乘客須另買人票。"}], "answer": 2, "quote": "the passenger ticket remains valid", "reason": "第二段區別載車與載人，退款只針對受影響的車費。", "why": ["原文說人票仍有效。", "車費會退。", "整合兩項明示資訊。", "沒要求重買人票。"]}, {"id": "R04Q3", "skill": 4, "en": "What does \"suspend\" mean in this context?", "zh": "suspend 在此意為何？", "options": [{"en": "Stop temporarily.", "zh": "暫時停止。"}, {"en": "Increase permanently.", "zh": "永久增加。"}, {"en": "Make free for everyone.", "zh": "對所有人免費。"}, {"en": "Reserve in advance.", "zh": "事先預約。"}], "answer": 0, "quote": "During strong winds, the captain may suspend bicycle transport", "reason": "因強風而中止載車，為暫停非永久取消。", "why": ["符合天候導致的暫時措施。", "動作方向相反。", "退費不代表所有人免費。", "預約是另一項規定。"]}, {"id": "R04Q4", "skill": 8, "en": "How does the final paragraph relate to the first two?", "zh": "末段與前兩段關係為何？", "options": [{"en": "It gives an unrelated travel story.", "zh": "提供無關旅行故事。"}, {"en": "It cancels all the earlier rules.", "zh": "取消前述規則。"}, {"en": "It lists every ferry destination.", "zh": "列所有目的地。"}, {"en": "It explains the policy's reason and planned evaluation.", "zh": "說明政策原因與預定評估。"}], "answer": 3, "quote": "It will review the arrangement after two months", "reason": "前兩段交代規則，末段補充推出原因及兩月後檢討。", "why": ["未寫旅行故事。", "沒有取消規則。", "未列目的地。", "正確辨認補充背景與評估功能。"]}, {"id": "R04Q5", "skill": 3, "en": "Does the weekday rule include a departure at exactly 6:00 p.m.?", "zh": "平日規則包含正好晚間6點出發嗎？", "options": [{"en": "Yes; after six means six or later.", "zh": "包含，after six 表六點起。"}, {"en": "No; the rule says after 6:00 p.m., not at 6:00 p.m.", "zh": "不含；規定是六點後而非六點整。"}, {"en": "Yes; all weekday sailings carry bicycles.", "zh": "包含，所有平日班次都載車。"}, {"en": "No; bicycles are never allowed on weekdays.", "zh": "不含，平日永不載車。"}], "answer": 1, "quote": "before 8:00 a.m. and after 6:00 p.m.", "reason": "after 是嚴格晚於，不能含整點。", "why": ["把 after 擴成 at or after。", "精確保留時間邊界。", "忽略時段限制。", "否定了其他允許時段。"]}, {"id": "R04Q6", "skill": 6, "en": "Which statement preserves the meaning of the reservation rule?", "zh": "哪句保留預約規則的意思？", "options": [{"en": "A passenger ticket automatically includes a bicycle place.", "zh": "人票自動含車位。"}, {"en": "A bicycle needs no booking on weekdays.", "zh": "平日車不需預約。"}, {"en": "A rider must arrange a bicycle place in addition to a passenger ticket.", "zh": "人票之外還須安排車位。"}, {"en": "Only people without bicycles may reserve.", "zh": "只有不帶車者能預約。"}], "answer": 2, "quote": "reserve a bicycle space separately from their passenger ticket", "reason": "separately from 指車位與人票分開處理。", "why": ["移除 separate 條件。", "文中未豁免平日。", "同義改寫保留兩種預約。", "無此排他規定。"]}, {"id": "R04Q7", "skill": 9, "en": "How is the notice organized?", "zh": "通知如何組織？", "options": [{"en": "Regular rules → weekend and weather exceptions → reason and review.", "zh": "一般規則→週末天候例外→原因與檢討。"}, {"en": "A personal memory → a recipe → a poem.", "zh": "回憶→食譜→詩。"}, {"en": "Prices only → prices only → prices only.", "zh": "全篇只談價格。"}, {"en": "Future cancellation → past closure → no new service.", "zh": "未來取消→過去停駛→沒有新服務。"}], "answer": 0, "quote": "It will review the arrangement after two months", "reason": "三段依序一般適用、例外處置、政策背景與評估。", "why": ["準確對應三段。", "沒有文學或食譜。", "價格不是全文唯一內容。", "規則推出而非全面停駛。"]}, {"id": "R04Q8", "skill": 15, "en": "Which summary stays consistent with all three paragraphs?", "zh": "哪句摘要與三段都一致？", "options": [{"en": "Every ferry now accepts unlimited bicycles.", "zh": "每班均無限載車。"}, {"en": "A bicycle refund invalidates all passenger tickets.", "zh": "退車費會使所有人票失效。"}, {"en": "The policy will never be reviewed.", "zh": "政策永不檢討。"}, {"en": "The new bicycle service has limits and will be evaluated later.", "zh": "新載車服務有限制，之後會評估。"}], "answer": 3, "quote": "up to six bicycles", "reason": "容量、時段、天候皆限制服務，末段又說將檢討。", "why": ["多項條件都被違反。", "人票仍有效。", "兩月後會檢討。", "局部與全文都相容。"]}]}, {"id": "R05", "title": "種子圖書館的信任", "level": 3, "group": 2, "en": ["At a seed library, residents borrow small packets of seeds in spring. They are encouraged to return seeds from their harvest in autumn, but the library does not treat a poor harvest as a debt. Its aim is to circulate plants suited to the local climate, not to punish inexperienced gardeners.", "Volunteers describe the system as a living collection. Unlike books, seeds change as they grow in different gardens. These differences can be valuable, but they also require careful labels. A packet without information about its source may be difficult to use responsibly.", "The library therefore pairs sharing with record-keeping. This practice helps new gardeners understand what they are planting and lets experienced growers compare results over time."], "zh": ["種子圖書館讓居民春天借種子，鼓勵秋天歸還收成的種子，但不把歉收視為欠債。目的是讓適合在地氣候的植物流通，不是懲罰新手。", "志工稱之為活的收藏。種子不像書，在不同花園生長會改變。差異可能有價值，但也需仔細標示來源；來源不明的種子不易負責任地使用。", "因此館方把共享與記錄結合。這項做法讓新手知道種什麼，也讓資深栽種者跨時間比較成果。"], "questions": [{"id": "R05Q1", "skill": 4, "en": "What does \"circulate\" most nearly mean here?", "zh": "circulate 在此最接近何義？", "options": [{"en": "Keep permanently locked away.", "zh": "永久鎖藏。"}, {"en": "Move among members of a community.", "zh": "在社群成員間流通。"}, {"en": "Turn into financial debt.", "zh": "變成金錢債務。"}, {"en": "Destroy after one season.", "zh": "一季後銷毀。"}], "answer": 1, "quote": "Its aim is to circulate plants suited to the local climate", "reason": "借種與回種形成社群流通，非封存或懲罰。", "why": ["與共享相反。", "符合借出與回收再分享。", "歉收明說不是債務。", "未提銷毀。"]}, {"id": "R05Q2", "skill": 5, "en": "What does \"This practice\" refer to?", "zh": "This practice 指什麼？", "options": [{"en": "Punishing gardeners for poor harvests.", "zh": "懲罰歉收者。"}, {"en": "Replacing seeds with books.", "zh": "以書取代種子。"}, {"en": "Combining sharing with record-keeping.", "zh": "結合共享與記錄。"}, {"en": "Removing all labels.", "zh": "移除所有標籤。"}], "answer": 2, "quote": "The library therefore pairs sharing with record-keeping.", "reason": "指示詞回指前句整項做法，而非只取最近單字。", "why": ["館方不懲罰新手。", "書僅用於比較。", "完整回指前句。", "正好違反仔細標示要求。"]}, {"id": "R05Q3", "skill": 1, "en": "Which statement best summarizes the passage?", "zh": "哪句最能概括本文？", "options": [{"en": "A seed library combines generosity with careful information sharing.", "zh": "種子館結合慷慨分享與仔細傳遞資訊。"}, {"en": "Returning seeds is a strict financial obligation.", "zh": "還種是嚴格金錢義務。"}, {"en": "All gardens produce identical plants.", "zh": "所有花園產相同植物。"}, {"en": "Records are less useful than punishment.", "zh": "記錄不如懲罰有用。"}], "answer": 0, "quote": "pairs sharing with record-keeping", "reason": "全文先談非懲罰式共享，再說明記錄的重要。", "why": ["涵蓋兩項核心。", "poor harvest 不視為 debt。", "不同花園會造成差異。", "沒有支持懲罰。"]}, {"id": "R05Q4", "skill": 10, "en": "Why might an unlabeled packet be problematic?", "zh": "沒有標籤的種子為何可能有問題？", "options": [{"en": "It proves the gardener was dishonest.", "zh": "證明栽種者不誠實。"}, {"en": "It can never grow.", "zh": "一定不會生長。"}, {"en": "It must contain poisonous plants.", "zh": "必定有毒。"}, {"en": "Users lack information needed to make informed planting decisions.", "zh": "使用者缺乏做種植判斷的資訊。"}], "answer": 3, "quote": "without information about its source", "reason": "文章支持資訊不足，未支持人格或植物特性定論。", "why": ["無法推斷意圖或人格。", "沒有發芽率證據。", "無毒性證據。", "是來源不明的合理有限推論。"]}, {"id": "R05Q5", "skill": 5, "en": "What do \"These differences\" refer to?", "zh": "These differences 指什麼？", "options": [{"en": "The prices of books.", "zh": "書的價格。"}, {"en": "Changes in seeds grown in different gardens.", "zh": "種子在不同花園生長後的差異。"}, {"en": "Debts owed by volunteers.", "zh": "志工欠款。"}, {"en": "Different library opening hours.", "zh": "不同開館時間。"}], "answer": 1, "quote": "seeds change as they grow in different gardens", "reason": "指示片語承接前句生長造成的變化。", "why": ["書只用作對比。", "保留完整概念鏈。", "沒有志工債務。", "未提開館時間。"]}, {"id": "R05Q6", "skill": 7, "en": "What relationship does \"Unlike books\" establish?", "zh": "Unlike books 建立什麼關係？", "options": [{"en": "An identical feature of books and seeds.", "zh": "書與種子的相同特性。"}, {"en": "A cause of financial debt.", "zh": "金錢債務原因。"}, {"en": "A contrast between stable objects and changing living material.", "zh": "相對穩定物件與會變化活材料的對比。"}, {"en": "A schedule of borrowing dates.", "zh": "借用日期順序。"}], "answer": 2, "quote": "Unlike books, seeds change as they grow in different gardens.", "reason": "Unlike 引入差異，解釋為何種子記錄有特殊需求。", "why": ["Unlike 不表相同。", "不談債務成因。", "符合對比及後續標籤需要。", "不列日期。"]}, {"id": "R05Q7", "skill": 15, "en": "Which policy would fit the passage's overall approach?", "zh": "哪個政策符合全文作法？", "options": [{"en": "Encourage sharing and clear source labels without punishing poor harvests.", "zh": "鼓勵分享及標清來源，不處罰歉收。"}, {"en": "Fine every unsuccessful gardener.", "zh": "處罰每位收成不佳者。"}, {"en": "Discard records because seeds are alive.", "zh": "因種子是活的而丟掉紀錄。"}, {"en": "Accept only professional gardeners.", "zh": "只接受專業栽種者。"}], "answer": 0, "quote": "pairs sharing with record-keeping", "reason": "同時保留首段友善政策及末段記錄要求。", "why": ["整合兩項核心且不矛盾。", "違反不把歉收當債務。", "違反仔細記錄。", "原文包括新手。"]}]}, {"id": "R06", "title": "城市地圖上的陰影", "level": 3, "group": 2, "en": ["Students mapped shade along the route between a station and their school. They noticed that a street described as \"green\" on a tourist map offered little protection from the midday sun. Young trees lined it, but their narrow crowns left most of the sidewalk exposed.", "The students distinguished the presence of trees from the shade they actually cast. This distinction changed their proposal. Rather than asking only for more trees, they recommended temporary shelters near bus stops while the trees matured.", "Their report called the shelters a bridge, not a substitute for long-term planting. The word emphasized the shelters' temporary role: they could meet an immediate need while slower improvements developed."], "zh": ["學生繪製車站到學校路線的遮蔭。觀光圖稱一條街很「綠」，中午卻幾乎不遮陽。街邊有小樹，但樹冠窄，步道多半曝曬。", "學生區分有樹與實際樹蔭。這項區分改變提案：不只要求多種樹，而建議樹成熟前，在站牌旁設臨時棚。", "報告稱棚為橋梁，而非長期植栽的替代品，強調其過渡作用：較慢改善進行時，先滿足當下需求。"], "questions": [{"id": "R06Q1", "skill": 4, "en": "What does \"exposed\" mean here?", "zh": "exposed 在此意為何？", "options": [{"en": "Hidden underground.", "zh": "藏在地下。"}, {"en": "Protected by roofs.", "zh": "有屋頂保護。"}, {"en": "Open to the sunlight.", "zh": "直接暴露於日照。"}, {"en": "Closed to pedestrians.", "zh": "禁止行人進入。"}], "answer": 2, "quote": "their narrow crowns left most of the sidewalk exposed", "reason": "窄樹冠無法遮蔭，exposed 指曝曬。", "why": ["與地上步道無關。", "與遮蔭不足相反。", "由日照與樹冠推知。", "未提封路。"]}, {"id": "R06Q2", "skill": 4, "en": "What does \"a bridge\" describe in the final paragraph?", "zh": "末段的橋梁描述什麼？", "options": [{"en": "A temporary measure linking present needs with future improvements.", "zh": "連接當前需求與未來改善的暫時措施。"}, {"en": "A structure crossing a river.", "zh": "跨河建築。"}, {"en": "A permanent replacement for trees.", "zh": "永久取代樹木。"}, {"en": "A route to another city.", "zh": "通往別市的道路。"}], "answer": 0, "quote": "The word emphasized the shelters' temporary role", "reason": "後句直接解釋比喻義：臨時過渡。", "why": ["符合作者明示解釋。", "沒有河流。", "not a substitute 否定永久取代。", "未談其他城市。"]}, {"id": "R06Q3", "skill": 1, "en": "What is the author's main point?", "zh": "作者主要想表達什麼？", "options": [{"en": "Tourist maps should show no trees.", "zh": "觀光圖不應畫樹。"}, {"en": "Useful proposals require attention to actual conditions and timing.", "zh": "有用提案需考量實況與時間。"}, {"en": "Temporary shelters make planting unnecessary.", "zh": "臨時棚使植栽不必要。"}, {"en": "Young trees are always harmful.", "zh": "幼樹總有害。"}], "answer": 1, "quote": "meet an immediate need while slower improvements developed", "reason": "從觀察實際樹蔭到暫時棚與長期植栽，重點是因應不同時間尺度的真實需求。", "why": ["並未要求不畫樹。", "涵蓋觀察與方案。", "作者否定取代植栽。", "只是暫時遮蔭不足。"]}, {"id": "R06Q4", "skill": 10, "en": "Which conclusion is supported?", "zh": "哪個結論有支持？", "options": [{"en": "More trees immediately guarantee complete shade.", "zh": "多種樹立即保證全遮蔭。"}, {"en": "All green streets are equally cool.", "zh": "所有綠街同樣涼。"}, {"en": "The students opposed all long-term planting.", "zh": "學生反對所有長期植栽。"}, {"en": "Counting trees alone may not measure current shade well.", "zh": "只數樹可能無法衡量當前遮蔭。"}], "answer": 3, "quote": "distinguished the presence of trees from the shade they actually cast", "reason": "有幼樹仍曝曬，支持樹數與當下遮蔭不同。", "why": ["幼樹案例直接反駁。", "未測所有街道。", "長期植栽仍保留。", "由兩種指標差異合理推得。"]}, {"id": "R06Q5", "skill": 5, "en": "What does \"This distinction\" refer to?", "zh": "This distinction 指什麼區別？", "options": [{"en": "The station and another city.", "zh": "車站與別的城市。"}, {"en": "Tourists and all local residents.", "zh": "旅客與所有居民。"}, {"en": "Old maps and new ticket prices.", "zh": "舊地圖與新票價。"}, {"en": "Having trees versus receiving actual shade.", "zh": "有樹與實際得到遮蔭。"}], "answer": 3, "quote": "distinguished the presence of trees from the shade they actually cast", "reason": "回指整個前句比較，不是最近單一名詞。", "why": ["未比较別市。", "不是人物分組。", "無票價。", "保留前句兩個比較項目。"]}, {"id": "R06Q6", "skill": 13, "en": "Why is \"The students opposed planting trees\" an attractive but wrong option?", "zh": "「學生反對種樹」為何可能誘人但錯？", "options": [{"en": "It repeats the report exactly.", "zh": "它完全重述報告。"}, {"en": "It turns a temporary supplement into rejection of the long-term plan.", "zh": "把暫時補充扭成反對長期方案。"}, {"en": "It only changes a date.", "zh": "只改了一個日期。"}, {"en": "It is wrong because no shelters were mentioned.", "zh": "因文中沒提棚子而錯。"}], "answer": 1, "quote": "a bridge, not a substitute for long-term planting", "reason": "臨時棚是過渡補充，非取消植栽。", "why": ["與 not a substitute 不同。", "點明偷換立場的陷阱。", "不涉及日期。", "文中明說臨時棚。"]}]}, {"id": "R07", "title": "自動翻譯的第二段", "level": 3, "group": 3, "en": ["A travel company introduced automatic translation devices to help visitors ask simple questions. Staff welcomed the shorter queues at the information desk. For routine exchanges, the devices often worked well.", "The next month, a traveler used one during a discussion about a food allergy. The device omitted a negative word, turning a warning into something that sounded reassuring. A staff member noticed the mistake before any food was served.", "This incident did not show that translation technology was useless. It showed that the acceptable risk changes with the situation. The company kept the devices for ordinary questions but required human checking for health-related messages. Faster communication remained a benefit, but speed alone was no longer the standard of success."], "zh": ["旅行社引進自動翻譯裝置協助簡單問答，服務台排隊縮短，一般交流常很順利。", "次月有旅客用裝置談食物過敏。裝置漏掉否定詞，使警告聽來像安心訊息。員工在上餐前發現錯誤。", "這不代表翻譯技術無用，而是可接受風險隨情況改變。公司保留一般問答用途，但健康訊息須人工檢查。快速仍是好處，卻不再是成功的唯一標準。"], "questions": [{"id": "R07Q1", "skill": 8, "en": "What is the function of the second paragraph?", "zh": "第二段的功能是什麼？", "options": [{"en": "To repeat all the benefits without adding anything.", "zh": "純粹重複全部優點。"}, {"en": "To provide a case that limits the positive picture.", "zh": "提供案例為正面描述加上限制。"}, {"en": "To list the device's manufacturing steps.", "zh": "列製造步驟。"}, {"en": "To explain the company's founding history.", "zh": "解釋公司創辦史。"}], "answer": 1, "quote": "The device omitted a negative word", "reason": "第一段談效益，第二段用風險案例促使後文修正使用規則。", "why": ["新增了風險反例。", "符合論述转折功能。", "沒寫製造流程。", "沒寫創辦史。"]}, {"id": "R07Q2", "skill": 8, "en": "How does the final paragraph develop the discussion?", "zh": "末段如何發展論述？", "options": [{"en": "It proposes a balanced policy based on the incident.", "zh": "依事件提出兼顧效益風險的政策。"}, {"en": "It denies that the mistake occurred.", "zh": "否認錯誤發生。"}, {"en": "It says every message needs no checking.", "zh": "表示訊息都不需檢查。"}, {"en": "It abandons the topic of communication.", "zh": "離開溝通主題。"}], "answer": 0, "quote": "kept the devices for ordinary questions but required human checking", "reason": "保留一般用途、對健康訊息增加檢查，是問題後的限定解法。", "why": ["總結案例並提出分情境使用。", "承認事件影響政策。", "健康訊息需檢查。", "仍討論溝通。"]}, {"id": "R07Q3", "skill": 2, "en": "When was the mistranslation noticed?", "zh": "誤譯何時被發現？", "options": [{"en": "After the traveler finished eating.", "zh": "吃完後。"}, {"en": "Before the device was purchased.", "zh": "購買前。"}, {"en": "Before any food was served.", "zh": "任何食物上桌前。"}, {"en": "Only after the company closed.", "zh": "公司關閉後。"}], "answer": 2, "quote": "before any food was served", "reason": "時間限制直接寫在第二段。", "why": ["顛倒先後。", "事件在使用後發生。", "符合明示時間。", "未提公司關閉。"]}, {"id": "R07Q4", "skill": 1, "en": "Which title best expresses the central idea?", "zh": "哪個標題最能表達主旨？", "options": [{"en": "Why All Translation Must Stop", "zh": "為何翻譯應全面停止"}, {"en": "The Cheapest Travel Device", "zh": "最便宜旅遊裝置"}, {"en": "A Recipe for Shorter Queues", "zh": "縮短排隊的食譜"}, {"en": "When Speed Needs a Safety Check", "zh": "當速度需要安全檢查"}], "answer": 3, "quote": "speed alone was no longer the standard of success", "reason": "全文由速度效益转向安全條件，並非全面否定。", "why": ["公司仍保留裝置。", "未比較價格。", "標題只抓排隊且誤加食譜。", "涵蓋效率與風險。"]}, {"id": "R07Q5", "skill": 5, "en": "What does \"This incident\" refer to?", "zh": "This incident 指什麼事件？", "options": [{"en": "The company buying furniture.", "zh": "公司買家具。"}, {"en": "Visitors asking any routine question.", "zh": "訪客問任意一般問題。"}, {"en": "A translation error in an allergy discussion caught before food was served.", "zh": "過敏對話誤譯在上餐前被發現。"}, {"en": "All travelers refusing technology.", "zh": "所有旅客拒用科技。"}], "answer": 2, "quote": "A staff member noticed the mistake before any food was served.", "reason": "回指第二段完整事件鏈，而不只是某個單字。", "why": ["未提家具。", "重點是具風險誤譯的具體案例。", "事件、風險與發現時點均吻合。", "文中無此集體反應。"]}, {"id": "R07Q6", "skill": 9, "en": "Which outline reflects the passage?", "zh": "哪個架構符合本文？", "options": [{"en": "Benefits → a risky exception → a revised usage policy.", "zh": "效益→風險例子→修正使用政策。"}, {"en": "A ban → no evidence → a total ban.", "zh": "禁令→無證據→全面禁令。"}, {"en": "A recipe → a payment rule → a map.", "zh": "食譜→付款規則→地圖。"}, {"en": "A biography → a childhood memory → retirement.", "zh": "傳記→童年→退休。"}], "answer": 0, "quote": "required human checking for health-related messages", "reason": "全文先肯定一般用途，再以事件導出分情境政策。", "why": ["依序對應三段功能。", "並未禁用一切翻譯。", "未有此結構。", "無人物傳記。"]}, {"id": "R07Q7", "skill": 11, "en": "Does the passage prove that the devices alone caused shorter queues?", "zh": "本文能證明只有裝置造成排隊變短嗎？", "options": [{"en": "Yes; any event after a change must be caused by it.", "zh": "能，改變後的事必由它造成。"}, {"en": "Yes; every other factor was experimentally controlled.", "zh": "能，其他因素都受實驗控制。"}, {"en": "No; the passage says queues became longer.", "zh": "不能，文中說排隊變長。"}, {"en": "No; it reports the improvement but provides no controlled comparison isolating the devices.", "zh": "不能，雖報導改善卻未提供分離装置效果的控制比較。"}], "answer": 3, "quote": "Staff welcomed the shorter queues at the information desk.", "reason": "時間先後及觀察不等於排除所有其他因素；不能據此說只有裝置有效。", "why": ["把先後直接當唯一因果。", "文中無控制實驗。", "實際是變短，不是變長。", "有限否定因果確定度，未否定可能效益。"]}]}, {"id": "R08", "title": "夜市垃圾的反例", "level": 3, "group": 3, "en": ["A town reported that its night market had reduced plastic bag use by half. Officials presented the figure as evidence of progress, and vendors were pleased that customers increasingly brought their own bags.", "However, an inspection found that disposable food boxes had become heavier and more numerous. Several stalls had stopped using bags but had switched to larger containers. The total weight of waste had therefore changed very little.", "The inspection did not erase the reduction in bags. It revealed that the original measure covered only one part of the problem. The town began tracking both packaging types and total waste weight. A successful policy, the report concluded, should be judged against its broader purpose rather than a single convenient number."], "zh": ["小鎮夜市塑膠袋使用減半，官員稱為進步，攤商也高興顧客自備袋。", "但檢查發現一次性餐盒變重變多。有些攤位不用袋，卻改用大盒，因此垃圾總重量幾乎沒變。", "檢查不否定袋量减少，而揭示原指標只看部分問題。小鎮開始追蹤包材種類與總重量。成功政策應對照更廣目的，而非單一方便數字。"], "questions": [{"id": "R08Q1", "skill": 8, "en": "Why does the author include the inspection findings?", "zh": "為何加入檢查結果？", "options": [{"en": "To show that bag reduction is impossible.", "zh": "表示減袋不可能。"}, {"en": "To describe how food is cooked.", "zh": "描述烹調。"}, {"en": "To reveal a limitation in the original success measure.", "zh": "揭示原成功指標的限制。"}, {"en": "To prove all vendors lied.", "zh": "證明所有攤商說謊。"}], "answer": 2, "quote": "the original measure covered only one part of the problem", "reason": "餐盒與總重量顯示單看袋量不全面。", "why": ["袋量確實下降。", "未談烹調。", "是反例與限制功能。", "無蓄意說謊證據。"]}, {"id": "R08Q2", "skill": 8, "en": "What role does the final sentence play?", "zh": "最後一句扮演什麼角色？", "options": [{"en": "It adds an unrelated numerical detail.", "zh": "增加無關數字。"}, {"en": "It draws a general lesson from the case.", "zh": "由案例提出一般啟示。"}, {"en": "It reverses the facts about bags.", "zh": "推翻袋量事實。"}, {"en": "It introduces a new cooking method.", "zh": "引進新烹調法。"}], "answer": 1, "quote": "rather than a single convenient number", "reason": "從個案抽出政策評估原則，為總結與推廣。", "why": ["提出原則而非新數字。", "對應總結功能。", "保留袋量減少事實。", "沒有烹調法。"]}, {"id": "R08Q3", "skill": 2, "en": "What changed very little?", "zh": "哪項幾乎沒變？", "options": [{"en": "The number of all customers.", "zh": "全部顧客數。"}, {"en": "The number of officials.", "zh": "官員人數。"}, {"en": "The price of food.", "zh": "食物價格。"}, {"en": "The total weight of waste.", "zh": "垃圾總重量。"}], "answer": 3, "quote": "The total weight of waste had therefore changed very little.", "reason": "直接找出所指指標，勿把袋量下降混成總量下降。", "why": ["沒有客流資料。", "沒有官員數資料。", "沒有價格資料。", "原文明示。"]}, {"id": "R08Q4", "skill": 1, "en": "What is the main message?", "zh": "主要訊息為何？", "options": [{"en": "Progress should be assessed using measures that reflect the full goal.", "zh": "應用反映完整目標的指標評估進步。"}, {"en": "All numbers are useless.", "zh": "所有數字都無用。"}, {"en": "Plastic bags are the only environmental problem.", "zh": "塑膠袋是唯一環境問題。"}, {"en": "Bigger boxes always reduce waste.", "zh": "大盒總會減少垃圾。"}], "answer": 0, "quote": "judged against its broader purpose", "reason": "文章主張更完整衡量，而非不用數字。", "why": ["涵蓋各段發展。", "後文仍追蹤多項指標。", "全文反駁只看袋子。", "更大餐盒使總重未下降。"]}, {"id": "R08Q5", "skill": 12, "en": "What must be combined to assess overall waste reduction?", "zh": "評估整體減廢須合看什麼？", "options": [{"en": "Only the number of bags.", "zh": "只看袋子數。"}, {"en": "The bag decrease together with container changes and total weight.", "zh": "袋量下降、餐盒變化與總重。"}, {"en": "Only the officials' satisfaction.", "zh": "只看官員滿意度。"}, {"en": "The market's name and location only.", "zh": "只看市場名與位置。"}], "answer": 1, "quote": "began tracking both packaging types and total waste weight", "reason": "跨段資訊顯示袋少卻餐盒增加，需合看總體。", "why": ["忽略第二段反例。", "整合不同指標且基準一致。", "情緒不能取代垃圾數據。", "地名不足以評估成果。"]}]}, {"id": "R09", "title": "早餐與成績的關係", "level": 4, "group": 4, "en": ["A school survey found that students who ate breakfast regularly had higher average test scores than those who did not. A headline on the school website announced that breakfast caused better performance. The science club questioned that conclusion.", "The survey had not assigned students to different breakfast routines. It also did not record sleep time, travel distance, or access to quiet study space. These factors might influence both breakfast habits and scores. The club did not claim that breakfast was irrelevant; it argued that the survey alone could not isolate its effect.", "To investigate further, the students suggested collecting information about these other conditions and comparing changes over time. The original pattern was worth studying, but it was a starting point for inquiry rather than a final causal answer."], "zh": ["校內調查發現固定吃早餐者平均考分較高。網站標題宣稱早餐造成較佳成績，科學社質疑此結論。", "調查未分派學生採不同早餐習慣，也未記錄睡眠、通勤距離和安靜讀書空間。這些因素可能同時影響早餐和分數。社團未說早餐無關，而主張單靠調查不能分離早餐效果。", "學生建議蒐集其他條件並長期比較變化。原趨勢值得研究，但只是探究起點，不是因果定論。"], "questions": [{"id": "R09Q1", "skill": 11, "en": "Why is the headline stronger than the evidence?", "zh": "標題為何超出證據？", "options": [{"en": "The survey found no difference at all.", "zh": "調查沒有任何差異。"}, {"en": "The survey proves breakfast is harmful.", "zh": "調查證明早餐有害。"}, {"en": "The headline ignores that other factors may explain the association.", "zh": "標題忽略他因可能解釋關聯。"}, {"en": "The students had never taken tests.", "zh": "學生從未考試。"}], "answer": 2, "quote": "These factors might influence both breakfast habits and scores.", "reason": "未控制睡眠等因素，不能直接把相關說成因果。", "why": ["實際找到分數差異。", "沒有傷害證據。", "指出混雜因素。", "原文明說測驗分數。"]}, {"id": "R09Q2", "skill": 14, "en": "Which conclusion is best supported?", "zh": "哪個結論最有支持？", "options": [{"en": "Breakfast has no possible connection with performance.", "zh": "早餐不可能與成績相關。"}, {"en": "The observed association deserves further study.", "zh": "觀察到的關聯值得深入研究。"}, {"en": "Every student will improve by the same amount.", "zh": "每人會改善相同幅度。"}, {"en": "The survey established one definite cause.", "zh": "調查確定單一原因。"}], "answer": 1, "quote": "a starting point for inquiry rather than a final causal answer", "reason": "作者保留研究價值但不確立因果。", "why": ["社團沒有否定關聯可能。", "符合有限結論。", "沒測個人改善，更未證明一致幅度。", "缺控制條件。"]}, {"id": "R09Q3", "skill": 2, "en": "Which information is explicitly said to have been left out of the survey?", "zh": "文章明確指出哪項資訊未被納入調查？", "options": [{"en": "Whether any student attended the school.", "zh": "是否有學生就讀。"}, {"en": "The website's publication date.", "zh": "網站刊登日期。"}, {"en": "The cafeteria's menu prices.", "zh": "餐廳菜單價格。"}, {"en": "Students' sleep time.", "zh": "學生睡眠時間。"}], "answer": 3, "quote": "It also did not record sleep time", "reason": "題目尋找文章明示未記錄項目；只有睡眠時間被明确列出。", "why": ["文章未談此調查欄位。", "未明示此項記錄狀況。", "未明示此項記錄狀況。", "是明確列出的漏收資訊。"]}, {"id": "R09Q4", "skill": 1, "en": "What is the author's main purpose?", "zh": "作者主要目的為何？", "options": [{"en": "To illustrate the difference between an observed link and a causal conclusion.", "zh": "說明觀察關聯與因果結論的差別。"}, {"en": "To prescribe a diet for every student.", "zh": "替每位學生開飲食處方。"}, {"en": "To rank all schools by breakfast quality.", "zh": "以早餐品質替學校排名。"}, {"en": "To discourage all further research.", "zh": "阻止後續研究。"}], "answer": 0, "quote": "the survey alone could not isolate its effect", "reason": "以早餐調查為例教證據判讀，不是健康建議。", "why": ["涵蓋全文方法論重點。", "未提出飲食處方。", "沒有跨校排名。", "鼓勵進一步蒐集資料。"]}, {"id": "R09Q5", "skill": 0, "en": "When a question asks which conclusion is supported, what is the reader's task?", "zh": "題目問「何結論有支持」時，任務是什麼？", "options": [{"en": "Choose the strongest possible health claim.", "zh": "挑最強的健康主張。"}, {"en": "Choose whichever claim sounds familiar.", "zh": "挑聽過的說法。"}, {"en": "Select a claim whose strength does not exceed the reported evidence.", "zh": "選擇強度未超過所述證據的主張。"}, {"en": "Ignore the passage and give personal advice.", "zh": "不看文章給私人建議。"}], "answer": 2, "quote": "a starting point for inquiry rather than a final causal answer", "reason": "supported 要求證據約束，不是常識或最大膽結論。", "why": ["強不等於有支持。", "熟悉不代表文章證明。", "正確解碼 supported 的作答任務。", "未回應閱讀理解要求。"]}]}, {"id": "R10", "title": "閱讀角落是否有效", "level": 4, "group": 4, "en": ["A teacher created a comfortable reading corner in one classroom. By the end of the term, students there borrowed more books than students in another class. The teacher was pleased but hesitated to credit the furniture alone.", "During the same term, the first class had also received weekly book recommendations and an extra library visit. Moreover, its students had borrowed slightly more books even before the corner existed. The final difference could reflect several influences.", "The teacher proposed comparing each class's change from its own starting level and recording the other activities. This would not remove every uncertainty, but it would give a more useful picture than comparing final totals alone. The reading corner remained a promising idea, not a proven explanation for the entire difference."], "zh": ["老師在一班設舒適閱讀角。學期末該班借書較另一班多，老師高興，卻不急著全歸功家具。", "同期該班還有每週書單與額外入館。且設閱讀角前，借書本來就略多。最終差異可能反映多因素。", "老師建議比較各班相對自身起點的變化，並記錄其他活動。雖不能消除所有不確定，但比只看期末總數有用。閱讀角仍是有希望的構想，不是全部差異的已證明解釋。"], "questions": [{"id": "R10Q1", "skill": 11, "en": "Why should the furniture not receive all the credit?", "zh": "為何不能把功勞全歸家具？", "options": [{"en": "Both classes had exactly the same activities and starting levels.", "zh": "兩班活動起點完全相同。"}, {"en": "Other activities and earlier differences could also matter.", "zh": "其他活動與原有差異也可能重要。"}, {"en": "No student borrowed a book.", "zh": "沒人借書。"}, {"en": "The reading corner was removed before use.", "zh": "閱讀角使用前就拆掉。"}], "answer": 1, "quote": "The final difference could reflect several influences.", "reason": "文中提出書單、入館與起點差異三種替代因素。", "why": ["活動與起點不同。", "符合多因素解釋。", "借書數增加。", "未說拆除。"]}, {"id": "R10Q2", "skill": 11, "en": "Why compare change from each class's starting level?", "zh": "為何比較各班相對起點的變化？", "options": [{"en": "To guarantee that all uncertainty disappears.", "zh": "保證消除所有不確定。"}, {"en": "To prove furniture never matters.", "zh": "證明家具從不重要。"}, {"en": "To avoid confusing an existing difference with a new effect.", "zh": "避免把原有差異誤作新效果。"}, {"en": "To ignore the extra library visit.", "zh": "忽略額外入館。"}], "answer": 2, "quote": "borrowed slightly more books even before the corner existed", "reason": "起點已不同，應區分原差距與新增變化，仍需控制他因。", "why": ["作者明說不能消除所有不確定。", "未否定家具可能有效。", "是比較基線的合理用途。", "同時要求記錄其他活動。"]}, {"id": "R10Q3", "skill": 2, "en": "What else did the first class receive?", "zh": "第一班另外得到什麼？", "options": [{"en": "Weekly book recommendations and an extra library visit.", "zh": "每週書單與額外入館。"}, {"en": "Free laptops for all students.", "zh": "全班免費筆電。"}, {"en": "A longer summer holiday.", "zh": "更長暑假。"}, {"en": "Identical furniture in every home.", "zh": "每個家都相同家具。"}], "answer": 0, "quote": "weekly book recommendations and an extra library visit", "reason": "直接定位第二段列出的同期活動。", "why": ["與明示內容一致。", "未提筆電。", "未提暑假。", "未提家庭家具。"]}, {"id": "R10Q4", "skill": 1, "en": "Which description best captures the teacher's approach?", "zh": "哪個描述最符合老師作法？", "options": [{"en": "Accepting a convenient explanation without checking.", "zh": "不查證就接受方便解釋。"}, {"en": "Rejecting every new idea.", "zh": "否定所有新構想。"}, {"en": "Using final totals as the only evidence.", "zh": "只用期末總數。"}, {"en": "Welcoming a promising idea while examining alternative explanations.", "zh": "肯定有希望的構想並檢查其他解釋。"}], "answer": 3, "quote": "a promising idea, not a proven explanation", "reason": "態度為支持探索又審慎確認，而非全信或全否定。", "why": ["老師明確遲疑並提比較方法。", "仍稱構想有希望。", "建議看起點與活動。", "涵蓋全文態度與方法。"]}, {"id": "R10Q5", "skill": 14, "en": "Is the final borrowing difference enough to establish the corner's exact effect?", "zh": "期末借書差異足以確定閱讀角的精確效果嗎？", "options": [{"en": "No; initial differences and other activities were also involved.", "zh": "不足，還有起點差異與其他活動。"}, {"en": "Yes; a higher final total isolates the effect exactly.", "zh": "足夠，期末較高即能精確分離效果。"}, {"en": "Yes; the two classes began identically.", "zh": "足夠，兩班起點完全相同。"}, {"en": "No; nobody used the library.", "zh": "不足，沒人使用圖書館。"}], "answer": 0, "quote": "The final difference could reflect several influences.", "reason": "證據無法單獨分離閱讀角效應，結論需保留。", "why": ["指出真正欠缺的證據條件。", "總數不是精確因果估計。", "原文說起點不同。", "與借書資料矛盾。"]}]}, {"id": "R11", "title": "校外活動交通方案", "level": 4, "group": 5, "en": ["A class is choosing transport for thirty students. The total budget is NT$550, and the journey must take no more than twenty minutes. The table lists three fixed-price options. Each quoted price covers the whole group, provided the group fits within the vehicle's capacity. There are no additional fees.", "The class must consider all three conditions at once. The cheapest option may not have enough seats, while the fastest may exceed the budget. Cost per available seat is useful for comparison, but it does not replace the actual requirements.", "Whichever option is selected must be booked at least forty-eight hours before departure. The figures are for this exercise only."], "zh": ["班級為30名學生選交通方案，總預算550元、車程不得超過20分鐘。表列三項固定總價方案；只要人數不超載，標價就涵蓋整團，無其他費用。", "須同時符合三條件。最便宜可能座位不足，最快可能超預算。每個可用座位成本可供比較，但不能取代實際要求。", "不論選哪案，都須至少提前48小時訂。數據僅供本練習。"], "questions": [{"id": "R11Q1", "skill": 12, "en": "Which option meets all three requirements?", "zh": "哪案符合全部條件？", "options": [{"en": "Option A.", "zh": "A方案。"}, {"en": "Option B.", "zh": "B方案。"}, {"en": "Option C.", "zh": "C方案。"}, {"en": "None of them.", "zh": "都不符合。"}], "answer": 2, "quote": "The total budget is NT$550", "reason": "C：30座、500元、15分鐘，三條件皆合。", "why": ["A總價600超550。", "B只有25座且需25分鐘。", "C符合30人、550元、20分鐘三門檻。", "C確實符合。"]}, {"id": "R11Q2", "skill": 12, "en": "Which option has the lowest cost per available seat?", "zh": "哪案每個可用座位成本最低？", "options": [{"en": "Option A.", "zh": "A方案。"}, {"en": "Option B.", "zh": "B方案。"}, {"en": "Option C.", "zh": "C方案。"}, {"en": "All have the same unit cost.", "zh": "三案單位成本相同。"}], "answer": 0, "quote": "Cost per available seat is useful for comparison", "reason": "A為600÷40＝15元；B為400÷25＝16元；C為500÷30約16.67元。", "why": ["15元最低。", "16元高於A。", "約16.67元高於A。", "三個結果不同。"]}, {"id": "R11Q3", "skill": 10, "en": "What does the comparison show?", "zh": "比較顯示什麼？", "options": [{"en": "The lowest unit cost always means the best feasible choice.", "zh": "最低單位成本總是最佳可行選擇。"}, {"en": "A useful comparison measure may still differ from the final selection rule.", "zh": "有用的比較指標仍可能不同於最終選擇條件。"}, {"en": "The budget can always be ignored.", "zh": "預算總可忽略。"}, {"en": "Available seats never matter.", "zh": "座位數永不重要。"}], "answer": 1, "quote": "it does not replace the actual requirements", "reason": "A單位成本最低但總價不合，说明指標不取代約束。", "why": ["A就是反例。", "結合表與文字得到有限結論。", "預算是明定条件。", "30人需要足夠座位。"]}, {"id": "R11Q4", "skill": 2, "en": "When must the booking be made?", "zh": "何時需完成預訂？", "options": [{"en": "After arrival.", "zh": "抵達後。"}, {"en": "Exactly one week later.", "zh": "正好一週後。"}, {"en": "At least twelve hours before departure.", "zh": "至少提前12小時。"}, {"en": "At least forty-eight hours before departure.", "zh": "至少提前48小時。"}], "answer": 3, "quote": "at least forty-eight hours before departure", "reason": "末段直接給時間限制；at least 表至少。", "why": ["晚於出發。", "未提一週後。", "12小時不足。", "符合原文。"]}, {"id": "R11Q5", "skill": 3, "en": "Can the class choose an option that meets the budget but has only twenty-five seats?", "zh": "只要合預算，能選只有25座的方案嗎？", "options": [{"en": "Yes; price overrides all conditions.", "zh": "能，價格優先於所有條件。"}, {"en": "Yes; spare standing places are guaranteed.", "zh": "能，保證可站立。"}, {"en": "No; every option costs more than the budget.", "zh": "不能，所有方案均超預算。"}, {"en": "No; thirty students require sufficient capacity as well.", "zh": "不能，30名學生也需足夠容量。"}], "answer": 3, "quote": "A class is choosing transport for thirty students.", "reason": "須同時满足容量、費用和時間，不能只看一條件。", "why": ["忽略同時限制。", "未提供站位。", "C未超預算。", "正確保留人數門檻。"]}, {"id": "R11Q6", "skill": 14, "en": "Do the figures prove which vehicle is safest?", "zh": "這些數據能證明哪輛最安全嗎？", "options": [{"en": "Yes; the cheapest must be safest.", "zh": "能，最便宜必最安全。"}, {"en": "No; the table contains capacity, fee, and time, not safety evidence.", "zh": "不能，表內是容量、價格和時間，不是安全證據。"}, {"en": "Yes; the largest capacity guarantees safety.", "zh": "能，最大容量保證安全。"}, {"en": "Yes; the quickest trip proves the driver is safest.", "zh": "能，最快證明司機最安全。"}], "answer": 1, "quote": "The table lists three fixed-price options.", "reason": "已知欄位不涵蓋安全，不能跨出證據範圍判定。", "why": ["價格不證明安全。", "正確辨認資訊缺口。", "容量不構成安全證明。", "速度也不等同安全。"]}], "table": {"headers": ["Option｜方案", "Seats｜座位", "Total fee｜總費用 (NT$)", "Minutes｜分鐘"], "rows": [["A", 40, 600, 10], ["B", 25, 400, 25], ["C", 30, 500, 15]]}}, {"id": "R12", "title": "成果發表的場地選擇", "level": 4, "group": 5, "en": ["A club needs a room for fifty-five people. It can spend at most NT$1,000, and the required session must fit within an eighty-minute room booking. The table shows each room's capacity, total booking fee, and included time. The club needs a room whose included booking time is no more than eighty minutes because the event schedule cannot accommodate a longer slot.", "A room must satisfy every condition, not just offer a low fee. The organizer also compares the fee per available seat to understand pricing, although empty seats do not bring extra income. The listed fees are fixed and cannot be reduced by leaving early.", "All rooms require a reservation three days in advance. These figures are fictional and are used to practice combining written conditions with a table."], "zh": ["社團需容納55人，最多花1000元，活動安排只能容許不超過80分鐘的場地預約時段。表列容量、總費用與包含時間；因活動排程無法安排更長時段，所選方案本身不得超過80分鐘。", "必須滿足每條件，不只低價。主辦者也比較每個可用座位費用，但空座不帶收入。費用固定，提早離場也不減。", "各場地須提前3天預約。資料為虛構，用於練習結合文字條件與表格。"], "questions": [{"id": "R12Q1", "skill": 12, "en": "Which room satisfies all the stated conditions?", "zh": "哪間符合全部明示條件？", "options": [{"en": "Room A.", "zh": "A場地。"}, {"en": "Room C.", "zh": "C場地。"}, {"en": "Room B.", "zh": "B場地。"}, {"en": "Both A and B.", "zh": "A與B都符合。"}], "answer": 1, "quote": "A room must satisfy every condition", "reason": "C60座、900元、75分鐘，符合55人、1000元與80分鐘。", "why": ["A費用1200超預算。", "C全部符合。", "B只有50座且90分鐘超時段。", "A與B各有不合條件。"]}, {"id": "R12Q2", "skill": 12, "en": "Which rooms have the same fee per available seat?", "zh": "哪些場地每個可用座位費用相同？", "options": [{"en": "A and B.", "zh": "A與B。"}, {"en": "B and C.", "zh": "B與C。"}, {"en": "A and C.", "zh": "A與C。"}, {"en": "All three.", "zh": "三間都相同。"}], "answer": 2, "quote": "compares the fee per available seat", "reason": "A1200÷80＝15元，B800÷50＝16元，C900÷60＝15元。", "why": ["15與16不同。", "16與15不同。", "兩者皆15元。", "B不同。"]}, {"id": "R12Q3", "skill": 10, "en": "What follows from the fixed-fee rule?", "zh": "固定費用規則可推知什麼？", "options": [{"en": "Leaving Room A early would not bring its fee within the budget.", "zh": "提早離開A也不會讓費用符合預算。"}, {"en": "Room A becomes free if some seats are empty.", "zh": "A有空座就免費。"}, {"en": "Room B automatically gains five seats.", "zh": "B自動增加5座。"}, {"en": "Every fee changes with attendance.", "zh": "所有費用隨出席人數改變。"}], "answer": 0, "quote": "cannot be reduced by leaving early", "reason": "A1200仍不變，超1000；不是按分鐘扣款。", "why": ["文字費率規則與表格總價共同支持。", "未訂此優惠。", "容量不因費率改變。", "固定總價與此相反。"]}, {"id": "R12Q4", "skill": 2, "en": "How far in advance must all rooms be reserved?", "zh": "所有場地需提前多久預訂？", "options": [{"en": "One hour.", "zh": "一小時。"}, {"en": "One day.", "zh": "一天。"}, {"en": "Two weeks.", "zh": "兩週。"}, {"en": "Three days.", "zh": "三天。"}], "answer": 3, "quote": "All rooms require a reservation three days in advance.", "reason": "直接定位末段共同規則。", "why": ["不合原文。", "不合原文。", "非文中規定。", "明示三天。"]}, {"id": "R12Q5", "skill": 13, "en": "Why is \"Room B is best because it is cheapest\" incomplete?", "zh": "「B最便宜所以最好」為何不完整？", "options": [{"en": "It wrongly says Room B has a fee.", "zh": "它錯說B有收費。"}, {"en": "It proves all conditions are satisfied.", "zh": "它證明全部條件皆合。"}, {"en": "It uses one true detail while ignoring capacity and booking-time limits.", "zh": "它用真實細節卻忽略容量與時段限制。"}, {"en": "It confuses the currency with the date.", "zh": "它混淆幣別和日期。"}], "answer": 2, "quote": "A room must satisfy every condition, not just offer a low fee.", "reason": "B雖最便宜但50座不足55，90分鐘超80；局部真不等於整體答案對。", "why": ["B確有收費。", "兩項條件不合。", "指出真細節包裝錯結論。", "不是幣別日期問題。"]}, {"id": "R12Q6", "skill": 15, "en": "Which conclusion fits both the written rules and the table?", "zh": "哪個結論同時符合文字與表格？", "options": [{"en": "Room C meets all limits, although another room has a lower fee.", "zh": "C符合全部限制，雖另有更便宜場地。"}, {"en": "Leaving Room A early makes it affordable.", "zh": "提早離開A就能合預算。"}, {"en": "Any room with a low unit cost must qualify.", "zh": "低單位成本者都符合。"}, {"en": "Capacity can be ignored when comparing fees.", "zh": "比費用可忽略容量。"}], "answer": 0, "quote": "The listed fees are fixed and cannot be reduced by leaving early.", "reason": "C满足所有條件且B較便宜；答案與固定費率及限制一致。", "why": ["核對文字規則、容量及費用後成立。", "固定費用不變。", "A單位成本低仍超總預算。", "文中要求同时符合容量。"]}, {"id": "R12Q7", "skill": 0, "en": "If a question asks which room satisfies all conditions, what must the reader decide?", "zh": "題目問哪個場地滿足全部條件，應決定什麼？", "options": [{"en": "Which room has the nicest name.", "zh": "哪間名字最好聽。"}, {"en": "Which room passes every stated requirement together.", "zh": "哪間同時符合每項明示要求。"}, {"en": "Which room has the lowest fee regardless of capacity.", "zh": "不管容量只找最便宜者。"}, {"en": "Which room is the largest regardless of budget.", "zh": "不管預算只找最大者。"}], "answer": 1, "quote": "A room must satisfy every condition", "reason": "all conditions 要求交集，不是單一指標排名。", "why": ["不是題目問的標準。", "完整解碼合取條件。", "漏掉其他限制。", "只答最大而非全部合格。"]}], "table": {"headers": ["Room｜場地", "Seats｜座位", "Total fee｜總費用 (NT$)", "Included minutes｜包含分鐘"], "rows": [["A", 80, 1200, 60], ["B", 50, 800, 90], ["C", 60, 900, 75]]}}]};
