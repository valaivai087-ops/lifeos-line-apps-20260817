function generalPhraseBank(){return `<section class="card"><h1>高頻單字／片語 BANK</h1><p>搭配 × 及物不及物 × 易混淆 × 動詞接法 × 閱讀邏輯</p><p>考試秘笈｜不要只背中文。整組記：核心字 → 後面接法 → 例句骨架 → 最常錯在哪。</p><div class="row"><input id="phraseSearch" aria-label="搜尋秘笈" placeholder="搜尋 discuss、rise、to V、介系詞…" value="${esc(phraseState.q)}"><select id="phraseCategory" aria-label="秘笈類型"><option value="">全部類型</option>${[...new Set(PHRASE_BANK.map(r=>r[0]))].map(c=>`<option ${c===phraseState.cat?'selected':''}>${c}</option>`).join('')}</select><button id="phrasePNG">下載完整表格 PNG</button></div><p>符號：N＝名詞；V＝動詞原形；V-ing＝動名詞；S＝主詞。全庫 ${PHRASE_BANK.length} 筆在同一頁連續呈現，含完整中英例句。</p><div id="phraseResults"></div></section>${evidencePanel()}${contextPanel()}`}

function phraseCanvas(){const rows=phraseFiltered(),c=document.createElement('canvas'),ctx=c.getContext('2d'),width=1800,cols=[140,190,450,420,520];ctx.font='24px Arial, Microsoft JhengHei';function wrap(t,w){let out=[],line='';for(const ch of t){if(ch==='\n'){out.push(line);line='';continue}if(ctx.measureText(line+ch).width>w){out.push(line);line=ch}else line+=ch}out.push(line);return out}const lines=rows.map(r=>[r[0],r[1],r[2]+'\n'+r[3],r[4],r[5]+'\n'+r[6]].map((t,i)=>wrap(t,cols[i]-28))),heights=lines.map(cells=>Math.max(...cells.map(l=>l.length))*35+40);c.width=width;c.height=220+heights.reduce((a,b)=>a+b,0)+70;ctx.fillStyle='#f5f8fc';ctx.fillRect(0,0,width,c.height);ctx.fillStyle='#15334d';ctx.font='bold 42px Arial, Microsoft JhengHei';ctx.fillText('LearningOS｜高頻單字／片語秘笈 BANK',40,65);ctx.font='24px Arial, Microsoft JhengHei';ctx.fillText(`核心字 → 後面接法 → 例句骨架 → 最常錯在哪｜一頁完整表格｜共 ${rows.length} 筆`,40,112);let x=40;['類型','核心字／片語','正確骨架與意思','最容易錯','中英例句'].forEach((t,i)=>{ctx.fillText(t,x+12,184);x+=cols[i]});let y=210;lines.forEach((cells,k)=>{ctx.fillStyle=k%2?'#edf3f8':'#ffffff';ctx.fillRect(40,y,1720,heights[k]);x=40;cells.forEach((ls,i)=>{ctx.fillStyle=i===1?'#006c76':'#183349';ls.forEach((l,j)=>ctx.fillText(l,x+12,y+32+j*35));x+=cols[i]});y+=heights[k]});ctx.fillStyle='#486174';ctx.fillText('N＝名詞；V＝原形動詞；V-ing＝動名詞；S＝主詞。例句與繁中解析可離線查閱。',40,y+44);return c}

function generalSupplement(){return `<section class="card"><h1>補充詞彙庫 <span style="font-size:.65em;color:#667892">Supplementary Vocabulary</span></h1><p>涵蓋詞性、文法、搭配、語意、邏輯、連貫與全文七項能力；能力標籤可交叉對應。全庫 ${SUPPLEMENT.length} 筆，依實際資料計數。</p><style>#suppCats{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}#suppCats button{border-radius:30px}#suppCats button[aria-pressed=true]{background:#414ad5;color:white}#suppTable{width:100%;border-collapse:collapse;min-width:700px}#suppTable th,#suppTable td{padding:15px 18px;border-bottom:1px solid #e2e6f2;text-align:left;vertical-align:top}#suppTable th{background:#f5f6fc}#suppTable td:first-child{color:#74849e;font-size:.9em;width:15%}#suppTable td:nth-child(2){width:29%;font-weight:600}#suppTable tbody tr:hover{background:#f6f7ff}</style><input id="suppSearch" style="width:100%;max-width:480px" aria-label="搜尋補充詞彙" placeholder="搜尋單字或中文，例如 borrow、借入、介系詞" value="${esc(supplementState.q)}"><div class="row" style="margin-top:16px"><label>能力 <select id="suppAbility"><option value="">全部能力</option>${Object.entries(SUPP_ABILITIES).map(([k,v])=>`<option value="${k}" ${supplementState.ability===k?'selected':''}>${k}｜${v}（${SUPPLEMENT.filter(r=>r[5].includes(k)).length}筆）</option>`).join('')}</select></label><button id="suppPractice">練習此能力的篇章</button><button id="suppReset">清除全部篩選</button></div><div id="suppCats">${['全部',...new Set(SUPPLEMENT.map(r=>r[0]))].map(c=>`<button data-suppcat="${esc(c==='全部'?'':c)}" aria-pressed="${supplementState.cat===(c==='全部'?'':c)}">${esc(c)}</button>`).join('')}</div><p id="suppCount"></p><div style="overflow:auto;border:1px solid #dce1ed;border-radius:16px"><table id="suppTable"><thead><tr><th>類型</th><th>單字／詞組</th><th>差異、用法與中英例句</th></tr></thead><tbody id="suppRows"></tbody></table></div></section>${contextPanel()}`}
function supplementResults(){const rows=SUPPLEMENT.filter(r=>(!supplementState.cat||r[0]===supplementState.cat)&&(!supplementState.ability||r[5].includes(supplementState.ability))&&r.join(' ').toLowerCase().includes(supplementState.q.trim().toLowerCase()));document.getElementById('suppCount').textContent=`符合條件：${rows.length} 筆／全庫 ${SUPPLEMENT.length} 筆｜一頁完整呈現`;document.getElementById('suppRows').innerHTML=rows.length?rows.map(r=>`<tr><td>${esc(r[0])}<p>${r[5].map(k=>`<span class="pill">${SUPP_ABILITIES[k]}</span>`).join(' ')}</p></td><td>${esc(r[1])}</td><td>${esc(r[2])}<div style="margin-top:8px;color:#52677b">${esc(r[3])}<br>${esc(r[4])}</div></td></tr>`).join(''):'<tr><td colspan="3">沒有符合項目，請調整搜尋或選擇「全部」。</td></tr>';document.querySelectorAll('[data-suppcat]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.suppcat===supplementState.cat)))}

const CONTEXT_BANK=[{"word": "ability", "meanings": ["能力"], "pos": ["N"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P003", "title": "社區音樂夜", "blank": 3, "level": 3, "type": "詞形", "evidence": "The evening showed how regular rehearsal can improve musical ability.", "why": "musical 後接名詞 ability；able 無法作 improve 的受詞。", "en": "The town invited young musicians to perform. Their creative arrangements surprised the audience. Even beginners played confidently after weeks of practice. The evening showed how regular rehearsal can improve musical ability.", "zh": "小鎮邀請年輕樂手演出。他們有創意的編曲讓觀眾驚喜；連初學者在練習數週後也演奏得有自信。這晚顯示定期排練能提升音樂能力。"}]}, {"word": "absolute", "meanings": ["絕對的"], "pos": ["Adj"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P027", "title": "藥草試驗的措辭", "blank": 3, "level": 4, "type": "作用範圍", "evidence": "Readers should avoid turning a cautious statement into an absolute promise.", "why": "前兩句都談語氣及範圍，不談持續時間，故 absolute 而非 temporary。此為語言判讀練習，非療效主張。", "en": "The report says the tea may help some people sleep. The word may expresses possibility, not certainty. Nor does some mean everyone. Readers should avoid turning a cautious statement into an absolute promise.", "zh": "報告說這種茶可能幫助部分人睡眠。may 表可能而非確定；some 也不表示每個人。讀者應避免把審慎陳述變成絕對承諾。"}]}, {"word": "accept", "meanings": ["接受"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P127", "title": "訪客的通知單", "blank": 4, "level": 3, "type": "易混淆字詞", "evidence": "The guide would accept reasonable requests for assistance.", "why": "accept requests 指接受請求；access 不表同意請求。", "en": "Visitors were advised to arrive before nine. The notice explained that late arrival could affect the entire group's schedule. Its purpose was to reduce the effect of delays on the tour. The guide would accept reasonable requests for assistance. Everyone was welcome except those without a reservation, because places were limited.", "zh": "訪客被建議九點前到達。通知說明遲到可能影響整團時程，目的是減少延誤對行程的影響。導遊會接受合理協助請求。除了未預約者外都歡迎，因名額有限。"}]}, {"word": "access", "meanings": ["使用機會／可近性"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P116", "title": "好消息後的一段保留", "blank": 3, "level": 4, "type": "段落功能", "evidence": "By drawing attention to unequal access, it explains why further work is necessary.", "why": "住戶無回收點是 access 不均。", "en": "The first paragraphs celebrate a town's new recycling program. A later paragraph explains that several apartment blocks still lack collection points. This section introduces a limitation. It qualifies the earlier praise rather than canceling every achievement. By drawing attention to unequal access, it explains why further work is necessary. Its function is to prevent an overly optimistic conclusion.", "zh": "前幾段肯定小鎮的新回收計畫。後一段說明數棟公寓仍無回收點。此段引入限制，為先前讚揚加上保留，而非否定全部成果。它指出可近性不均，說明仍需改善，避免結論過度樂觀。"}]}, {"word": "accounts", "meanings": ["敘述"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P017", "title": "從訪談到展覽", "blank": 1, "level": 3, "type": "句間銜接", "evidence": "These accounts revealed how the street had changed.", "why": "These accounts 指前句訪談敘述；不是商店開的 invoices。", "en": "The class interviewed older residents about local shops. These accounts revealed how the street had changed. Drawing on the stories, students prepared an exhibition. Visitors could then compare the past with the present.", "zh": "班上訪問年長居民，詢問當地店家。這些敘述呈現街道的變化。學生根據故事籌備展覽，讓參觀者比較過去與現在。"}]}, {"word": "accurate", "meanings": ["精確的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P009", "title": "溫室測量", "blank": 2, "level": 4, "type": "局部精確語意", "evidence": "They need accurate readings because an error of two degrees can damage seedlings.", "why": "不能有兩度誤差，故要 accurate；頻率高不保證精確。", "en": "The sensor records temperature every minute. Such frequent measurements help growers notice sudden changes. They need accurate readings because an error of two degrees can damage seedlings. A backup battery keeps the sensor operational during power failures.", "zh": "感測器每分鐘記錄溫度。如此頻繁的測量有助於栽種者發現突變。他們需要精確讀值，因為兩度誤差就可能傷害幼苗。備用電池讓感測器在停電時仍能運作。"}]}, {"word": "accusing", "meanings": ["指控"], "pos": ["V-ing"], "tags": ["Logic", "Semantics", "Grammar", "Collocation", "Cohesion", "Global", "POS"], "examples": [{"pid": "P104", "title": "校園新聞的查證", "blank": 5, "level": 5, "type": "作用範圍", "evidence": "They avoided accusing individual students of deliberate dishonesty because careless sharing did not prove intent.", "why": "avoid 後 accusing，accuse 人 of 行為，且不推測意圖。", "en": "An image of a locked gate spread through the school chat group. Its caption claimed that the library would close permanently. Many students forwarded it before checking the date. The student newspaper decided to verify the message. First, reporters located the original image. It had been taken during repairs two years earlier. Next, they contacted the librarian, who explained that the current closure would last only one afternoon. The image itself was real, but its new context made it misleading. The team published a correction and included links to the relevant notices. They avoided accusing individual students of deliberate dishonesty because careless sharing did not prove intent. Instead, the article described a simple checking procedure: locate the source, inspect the date, and compare the claim with current information. A follow-up survey found that some readers had changed their sharing habits. The editors welcomed this response but did not call it universal. Only a fraction of students had answered. The final article therefore balanced a positive outcome with a clear statement of its limits. Responsible reporting, it argued, requires the same standards when describing one's own success as when investigating someone else's story. Accuracy is a continuing practice, not a badge earned once.", "zh": "一張上鎖校門照片在校群傳播，圖說宣稱圖書館永久關閉。許多人未查日期便轉傳。校刊決定查證，先找原圖，發現拍於兩年前修繕期間；再聯絡館員，得知本次只關一下午。照片真實，新脈絡卻使它誤導。團隊刊更正並附公告連結，避免指控個別學生蓄意不誠實，因為粗心分享不等於證明意圖。文章介紹查核程序：找來源、查日期、與當前資訊比對。後續調查發現部分讀者改變分享習慣。編輯肯定成果，卻不稱人人都如此，因只有小部分學生作答。文章因此平衡正面成果與清楚限制，主張描述自身成功和調查他人故事應用相同標準。準確是持續實踐，而非一次取得的徽章。"}]}, {"word": "accustomed", "meanings": ["習慣的"], "pos": ["Adj"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P060", "title": "習慣新的步調", "blank": 1, "level": 3, "type": "介系詞搭配", "evidence": "After moving, Hana became accustomed to walking to school.", "why": "accustomed to walking 表習慣做某事；familiar 通常用 with 表熟悉，不能在此接 to walking 表本人習慣。", "en": "After moving, Hana became accustomed to walking to school. She no longer insisted on taking a taxi. The change also made her more sensitive to the needs of pedestrians at dangerous crossings.", "zh": "搬家後，花奈習慣走路上學。她不再堅持搭計程車。這項改變也讓她更留意危險路口行人的需求。"}]}, {"word": "actively", "meanings": ["積極地"], "pos": ["Adv"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P001", "title": "校園花園", "blank": 2, "level": 1, "type": "詞形", "evidence": "Students are actively involved in watering them, and their interest in science has grown significantly.", "why": "修飾 involved 的參與方式要用副詞 actively。", "en": "Our school turned an empty yard into a garden. A variety of vegetables now grows there. Students are actively involved in watering them, and their interest in science has grown significantly.", "zh": "學校把空院子改成花園，現在裡面種著各式蔬菜。學生積極參與澆水，他們對科學的興趣也顯著提升。"}]}, {"word": "adapt", "meanings": ["適應／調整"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P046", "title": "領養後的適應", "blank": 2, "level": 1, "type": "字形相似", "evidence": "The animal needed time to adapt to its new home.", "why": "adapt to 表適應新環境；adopt 不接 to 表此義。", "en": "The family decided to adopt a dog from a shelter. The animal needed time to adapt to its new home. To help it feel safe, they kept its daily routine consistent.", "zh": "這家人決定從收容所領養一隻狗。狗需要時間適應新家。他們維持一致的日常作息，幫助牠安心。"}]}, {"word": "addition", "meanings": ["新增物"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P022", "title": "新來的蜂箱", "blank": 1, "level": 2, "type": "新舊資訊", "evidence": "At first, this addition worried the neighbors.", "why": "a hive 首次引入，this addition 回接剛新增的蜂箱；未提多年 tradition。", "en": "A beekeeper placed a hive near the orchard. At first, this addition worried the neighbors. The beekeeper then explained how the bees pollinated fruit trees. With this new information, residents began to view the hive as an asset.", "zh": "養蜂人在果園旁放了一個蜂箱。起初，這個新增物讓鄰居擔心。養蜂人接著解釋蜜蜂如何幫果樹授粉。有了這項新資訊，居民開始把蜂箱視為助益。"}]}, {"word": "additional", "meanings": ["額外的"], "pos": ["Adj"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P118", "title": "夜間足跡的限度", "blank": 5, "level": 4, "type": "推論", "evidence": "Identifying every footprint would require additional evidence.", "why": "現有資料不足，需 additional evidence。", "en": "Fresh tracks appeared near a pond after a snowy evening. A camera recorded a fox passing at midnight, but it did not cover the entire shore. The image establishes the fox's presence. It does not prove that the fox made all the tracks. Other animals may have used the area unobserved. The investigator therefore described the fox as a possible source. Identifying every footprint would require additional evidence.", "zh": "雪夜後，池邊有新足跡。攝影機拍到狐狸午夜經過，但未涵蓋整岸。影像確立狐狸曾在場，不能證明所有足跡都是牠留下。其他動物可能在未被觀察時使用該處。因此調查者稱狐狸為可能來源；辨認每個腳印仍需更多證據。"}]}, {"word": "address", "meanings": ["處理／地址", "處理"], "pos": ["V/N", "V"], "tags": ["Semantics", "Global", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P071", "title": "提出疑慮", "blank": 2, "level": 3, "type": "多義判斷", "evidence": "The chair agreed to address the issue before approving the plan.", "why": "address the issue 是處理議題，不能把 address 只解作地址。", "en": "During the meeting, a resident raised a concern about traffic noise. The chair agreed to address the issue before approving the plan. A written record of the discussion would be sent to everyone.", "zh": "會議中，一位居民提出交通噪音疑慮。主席同意核准計畫前處理此事。討論的書面紀錄將寄給所有人。"}, {"pid": "P101", "title": "工具圖書館的考驗", "blank": 4, "level": 5, "type": "文章組織", "evidence": "To address these concerns, the library trained volunteers and introduced a checklist.", "why": "address concerns 是處理疑慮，非地址義。", "en": "A neighborhood library began lending tools as well as books. The idea seemed practical: most people needed a drill only a few times a year. Sharing could reduce both household spending and unnecessary purchases. At first, however, the staff focused mainly on collecting equipment. They soon discovered that ownership was only one part of the problem. Borrowers needed clear instructions, and returned tools required inspection. One damaged cable could make the next loan unsafe. To address these concerns, the library trained volunteers and introduced a checklist. Each item was checked before it went back onto the shelf. The system also recorded late returns, but the director warned against treating every delay as carelessness. Illness or transport problems could be involved. Instead of imposing the same response in every case, staff considered the circumstances. Six months later, the service had many regular users. That popularity was encouraging, although it did not by itself prove that the project saved resources overall. The library still needed to compare the costs of repair and transport with the purchases it had replaced. Its experience showed that a generous idea becomes sustainable through careful management.", "zh": "社區圖書館除了書也開始借工具。想法看來實用：多數人一年只用幾次電鑽。共享能減少家庭支出與不必要購買。但員工起初主要忙著收集設備，很快發現有工具只是問題的一部分。借用者需要清楚說明，歸還工具需要檢查；一條損壞電線就可能讓下一次借用不安全。圖書館為處理疑慮培訓志工並設清單。每件物品回架前都先檢查。系統也記錄晚還，但館長提醒不能把每次延誤都當粗心，可能涉及疾病或交通問題。員工考量個別情況，而非一律回應。半年後，服務已有許多固定使用者，令人鼓舞，但受歡迎本身並不能證明整體省資源。仍需比較維修、運輸成本和取代的購買。經驗顯示，慷慨構想需靠細心管理才能持續。"}]}, {"word": "adjustable", "meanings": ["可調整的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P107", "title": "為夜讀設計的燈", "blank": 1, "level": 3, "type": "局部精確語意", "evidence": "Its arm had to be adjustable so she could direct light away from her roommate.", "why": "direct light away 需能改變方向，adjustable；decorative 只描述美觀，不能保證方向可調。", "en": "Rui needed a lamp for a tiny shared room. Its arm had to be adjustable so she could direct light away from her roommate. A stable base would keep it from tipping over. She chose a model with a dimmer, which let her lower the brightness. It also used very little electricity, making it efficient. A portable design meant she could carry it to the study room.", "zh": "瑞需要適合狹小合住房間的燈。燈臂須可調整，才能讓光避開室友；穩固底座能避免傾倒。她選了有調光器的款式，可降低亮度。它耗電少，效率高；可攜式設計也讓她能帶到自習室。"}]}, {"word": "adjustments", "meanings": ["調整"], "pos": ["N"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P100", "title": "一條河的兩種任務", "blank": 8, "level": 5, "type": "全文一致", "evidence": "Their observations would guide later adjustments.", "why": "observations guide later adjustments 指根據觀測改良。", "en": "For decades, a concrete channel carried rainwater quickly through the town. Engineers had designed it to prevent flooding, and many residents considered it a success. Yet its steep walls left little room for plants or animals. When the town proposed a redesign, the debate was not simply about beauty. It concerned how one place could serve multiple purposes. The new plan kept a deep central channel but added planted shelves along the sides. These features created habitats without blocking the main flow. Some residents remained skeptical, fearing that vegetation would slow the water. The team therefore ran tests before construction. The results suggested that the design could work under ordinary conditions; they did not guarantee safety in every possible storm. Officials described the evidence as promising, rather than final. After the first section opened, volunteers began to record water levels and wildlife sightings. Their observations would guide later adjustments. The project thus treated restoration as an ongoing process, not a single finished event. Its broader lesson was that public spaces require both careful design and continued attention.", "zh": "數十年來，水泥渠道讓雨水快速流過小鎮。工程師原先設計它是為防洪，许多居民認為很成功。但陡峭壁面使動植物幾乎無處生存。小鎮提出改造時，辯論不只關乎美觀，更涉及同一空間如何兼顧多項用途。新計畫保留深中央水道，在兩側增植栽平台。這些設計創造棲地，又不阻擋主流。部分居民仍懷疑，擔心植被減慢水流。因此團隊施工前先測試。結果暗示設計在一般條件下可行，卻不保證每場可能的暴雨都安全。官員稱證據有希望，而非已定論。首段開放後，志工開始記錄水位與野生動物。觀察將引導後續調整。修復因此是持續過程，而非一次完成的事件。更廣泛的啟示是公共空間既需周密設計，也需持續關注。"}]}, {"word": "adopt", "meanings": ["領養／採用"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P046", "title": "領養後的適應", "blank": 1, "level": 1, "type": "字形相似", "evidence": "The family decided to adopt a dog from a shelter.", "why": "從 shelter 接狗回家是 adopt，不是適應 adapt。", "en": "The family decided to adopt a dog from a shelter. The animal needed time to adapt to its new home. To help it feel safe, they kept its daily routine consistent.", "zh": "這家人決定從收容所領養一隻狗。狗需要時間適應新家。他們維持一致的日常作息，幫助牠安心。"}]}, {"word": "advised", "meanings": ["被建議的"], "pos": ["V-en"], "tags": ["Semantics"], "examples": [{"pid": "P127", "title": "訪客的通知單", "blank": 1, "level": 3, "type": "易混淆字詞", "evidence": "Visitors were advised to arrive before nine.", "why": "were advised to 為被動建議；advice 是名詞。", "en": "Visitors were advised to arrive before nine. The notice explained that late arrival could affect the entire group's schedule. Its purpose was to reduce the effect of delays on the tour. The guide would accept reasonable requests for assistance. Everyone was welcome except those without a reservation, because places were limited.", "zh": "訪客被建議九點前到達。通知說明遲到可能影響整團時程，目的是減少延誤對行程的影響。導遊會接受合理協助請求。除了未預約者外都歡迎，因名額有限。"}]}, {"word": "affect", "meanings": ["影響"], "pos": ["V"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P102", "title": "城市夜色中的昆蟲", "blank": 1, "level": 5, "type": "推論", "evidence": "A biology teacher asked a different question: how would the change affect insects?", "why": "would 後用動詞 affect，指路燈對昆蟲作用。", "en": "When a city replaced its streetlights, residents welcomed the brighter roads. A biology teacher asked a different question: how would the change affect insects? Her students placed observation sheets near several lamps and counted visits at fixed times. To keep the comparison fair, they used the same procedure at every location. They found more insects around some lamps than others. This difference was interesting, but its cause was not immediately clear. The locations also varied in temperature and nearby vegetation. The teacher therefore reminded the class that a pattern was not automatically an explanation. During a second trial, the students compared two lamp types in the same area. Their new records provided stronger evidence about the role of light. Even so, the findings applied only to the conditions they had tested. The class resisted the temptation to claim that one lamp was best everywhere. In their report, they described both the results and the limitations. The city agreed to consider a smaller trial rather than replace every light at once. For the students, the most valuable lesson was not a simple answer but a more careful way of asking questions. Scientific inquiry, they learned, depends on adjusting claims to match what observations actually support.", "zh": "城市更換路燈時，居民歡迎更明亮道路。生物老師問：改變如何影響昆蟲？學生在幾座燈旁設觀察表，固定時間計數到訪。為公平比較，各處程序一致。他們發現某些燈邊昆蟲更多，差異有趣，原因卻未明：各地溫度、植被也不同。老師提醒模式不自動等於解釋。第二次試驗在同區比較兩款燈，新紀錄提供更強證據。不過發現只適用受測條件。學生避免宣稱某款燈處處最佳，報告同時說明結果與限制。市府同意先做較小試辦，不一次換掉所有燈。學生最有價值的收穫不是簡單答案，而是更審慎提問。科學探究需調整主張，使之符合觀察實際能支持的範圍。"}, {"pid": "P127", "title": "訪客的通知單", "blank": 2, "level": 3, "type": "易混淆字詞", "evidence": "The notice explained that late arrival could affect the entire group's schedule.", "why": "could 後原形動詞 affect 表影響，effect 在此要作名詞義辨別。", "en": "Visitors were advised to arrive before nine. The notice explained that late arrival could affect the entire group's schedule. Its purpose was to reduce the effect of delays on the tour. The guide would accept reasonable requests for assistance. Everyone was welcome except those without a reservation, because places were limited.", "zh": "訪客被建議九點前到達。通知說明遲到可能影響整團時程，目的是減少延誤對行程的影響。導遊會接受合理協助請求。除了未預約者外都歡迎，因名額有限。"}]}, {"word": "after", "meanings": ["在…之後"], "pos": ["Prep", "Conj"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P021", "title": "舊照片的日期", "blank": 2, "level": 4, "type": "時間線", "evidence": "The image therefore had to be taken after that year.", "why": "照片含已建成的橋，拍攝時間須在建橋之後；此處 after 接年份。", "en": "At first, the photo was believed to show the town in 1950. Researchers subsequently noticed a bridge built in 1962. The image therefore had to be taken after that year. This discovery led them to revise the date in the archive.", "zh": "起初人們認為照片呈現1950年的小鎮。研究者後來注意到一座1962年建成的橋。因此影像必須拍攝於該年之後。這個發現使他們修正檔案日期。"}, {"pid": "P111", "title": "候鳥追蹤器", "blank": 4, "level": 3, "type": "時間線", "evidence": "Only after the birds returned did the team recover the devices.", "why": "Only after…did… 表等返回後才能取回裝置。", "en": "In March, scientists attached trackers to several birds. Three weeks later, the birds began their northward journey. By the time they reached the wetlands, they had crossed two mountain ranges. Researchers compared the new route with data collected the previous year. Only after the birds returned did the team recover the devices. The full analysis was therefore postponed until autumn.", "zh": "三月，科學家替幾隻鳥裝追蹤器。三週後，鳥開始北遷。到濕地時，牠們已越過兩條山脈。研究者拿新路線與前一年資料比較。直到鳥返回後，團隊才收回裝置，因此完整分析延到秋天。"}]}, {"word": "all", "meanings": ["全部的"], "pos": ["Det"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P118", "title": "夜間足跡的限度", "blank": 2, "level": 4, "type": "推論", "evidence": "It does not prove that the fox made all the tracks.", "why": "not prove all 限制足跡歸屬，不能由一次影像概括全部。", "en": "Fresh tracks appeared near a pond after a snowy evening. A camera recorded a fox passing at midnight, but it did not cover the entire shore. The image establishes the fox's presence. It does not prove that the fox made all the tracks. Other animals may have used the area unobserved. The investigator therefore described the fox as a possible source. Identifying every footprint would require additional evidence.", "zh": "雪夜後，池邊有新足跡。攝影機拍到狐狸午夜經過，但未涵蓋整岸。影像確立狐狸曾在場，不能證明所有足跡都是牠留下。其他動物可能在未被觀察時使用該處。因此調查者稱狐狸為可能來源；辨認每個腳印仍需更多證據。"}]}, {"word": "allows", "meanings": ["允許"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P061", "title": "參觀規則", "blank": 1, "level": 1, "type": "句型判斷", "evidence": "The museum allows visitors to take photographs without flash.", "why": "allow visitors to take；let visitors take 不用 to，故 lets 不合。", "en": "The museum allows visitors to take photographs without flash. It asks them to avoid touching fragile objects. These rules help protect the collection while keeping the visit enjoyable.", "zh": "博物館允許遊客不用閃光燈拍照，並請大家避免觸摸脆弱物品。規則既保護館藏，也維持參觀樂趣。"}]}, {"word": "alternative", "meanings": ["替代方案"], "pos": ["N"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P109", "title": "午休的短暫步行", "blank": 3, "level": 4, "type": "句間邏輯", "evidence": "She therefore offered an indoor route as an alternative.", "why": "indoor route 在戶外不能走時取代之，為 alternative。", "en": "A class expected a short walk after lunch to waste study time. Instead, many students returned feeling more alert. The teacher repeated the activity for a week. However, she noticed that heavy rain made outdoor walks impractical. She therefore offered an indoor route as an alternative. The class kept both options, because the aim was movement rather than a particular location. The final plan was flexible rather than rigid.", "zh": "班上原以為午餐後散步浪費讀書時間，實際卻有許多學生精神更好。老師重複活動一週，但發現大雨使戶外步行難以實行。因此她提供室內路線作替代方案。兩種選項都保留，因為目標是活動身體而非限定地點。最後計畫有彈性而不僵化。"}]}, {"word": "Although", "meanings": ["雖然"], "pos": ["Conj"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P096", "title": "雖然下雨", "blank": 1, "level": 3, "type": "句法判斷", "evidence": "Although the rain was heavy, the indoor workshop continued.", "why": "空格後完整子句 the rain was heavy，需要 Although；Despite 後要名詞或動名詞。", "en": "Although the rain was heavy, the indoor workshop continued. The participants, whose outdoor plans had changed, learned to weave baskets. The instructor kept everyone engaged by giving each person a task.", "zh": "雖然雨很大，室內工作坊仍繼續。戶外計畫改變的參與者學編籃。講師分派任務給每個人，讓大家持續投入。"}]}, {"word": "applicable", "meanings": ["適用的"], "pos": ["Adj"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P050", "title": "應徵工作坊", "blank": 3, "level": 2, "type": "詞族混淆", "evidence": "The advice is applicable to many entry-level jobs, not just one company.", "why": "is applicable to 是適用於；applied to 表已被施用於，並不表一般適用性。", "en": "The workshop helps each applicant prepare for an interview. Students first complete an application and then practice explaining their skills. The advice is applicable to many entry-level jobs, not just one company.", "zh": "工作坊協助每位應徵者準備面試。學生先完成申請表，再練習說明技能。建議適用於許多初階工作，不只一家公司的職位。"}]}, {"word": "applicant", "meanings": ["申請人"], "pos": ["N"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P050", "title": "應徵工作坊", "blank": 1, "level": 2, "type": "詞族混淆", "evidence": "The workshop helps each applicant prepare for an interview.", "why": "each 後是需要面試的人，applicant。", "en": "The workshop helps each applicant prepare for an interview. Students first complete an application and then practice explaining their skills. The advice is applicable to many entry-level jobs, not just one company.", "zh": "工作坊協助每位應徵者準備面試。學生先完成申請表，再練習說明技能。建議適用於許多初階工作，不只一家公司的職位。"}]}, {"word": "application", "meanings": ["申請／申請表"], "pos": ["N"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P050", "title": "應徵工作坊", "blank": 2, "level": 2, "type": "詞族混淆", "evidence": "Students first complete an application and then practice explaining their skills.", "why": "complete an application 是完成申請表，不是完成申請人。", "en": "The workshop helps each applicant prepare for an interview. Students first complete an application and then practice explaining their skills. The advice is applicable to many entry-level jobs, not just one company.", "zh": "工作坊協助每位應徵者準備面試。學生先完成申請表，再練習說明技能。建議適用於許多初階工作，不只一家公司的職位。"}]}, {"word": "approval", "meanings": ["贊同"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P117", "title": "一篇有保留的展覽評論", "blank": 3, "level": 4, "type": "作者態度", "evidence": "The word \"ambitious\" did not signal unconditional approval.", "why": "unconditional approval 是文章明確否定的解讀。", "en": "The critic admired the exhibition's ambitious topic but questioned its lack of local voices. She called the photographs powerful while describing the captions as incomplete. Her response was therefore mixed, not wholly negative. The word \"ambitious\" did not signal unconditional approval. Instead, she urged the museum to include more perspectives. Her criticism expressed a desire for improvement, rather than a demand to close the show.", "zh": "評論者欣賞展覽題目有企圖心，卻質疑缺乏地方聲音。她稱照片有力量，但說圖說不完整。因此態度是褒貶並存，不是全然負面。「有企圖心」不代表無條件贊同。她要求納入更多觀點，批評意在改進而非關展。"}]}, {"word": "asset", "meanings": ["有用的資產／助益"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P022", "title": "新來的蜂箱", "blank": 3, "level": 2, "type": "新舊資訊", "evidence": "With this new information, residents began to view the hive as an asset.", "why": "知道益處後態度轉正，asset 合理；obstacle 延續負面，與轉變不合。", "en": "A beekeeper placed a hive near the orchard. At first, this addition worried the neighbors. The beekeeper then explained how the bees pollinated fruit trees. With this new information, residents began to view the hive as an asset.", "zh": "養蜂人在果園旁放了一個蜂箱。起初，這個新增物讓鄰居擔心。養蜂人接著解釋蜜蜂如何幫果樹授粉。有了這項新資訊，居民開始把蜂箱視為助益。"}]}, {"word": "assistance", "meanings": ["協助"], "pos": ["N"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P053", "title": "相互支持", "blank": 2, "level": 2, "type": "詞性判斷", "evidence": "This assistance makes difficult books less frightening.", "why": "This assistance 是名詞主語；supportive 是形容詞，不能單獨作這裡的核心。", "en": "Older students support younger readers during weekly meetings. This assistance makes difficult books less frightening. The school measures the program's success through reading progress, not the number of meetings alone.", "zh": "高年級學生在每週聚會中支持年幼讀者。這份支持讓難書不再那麼可怕。學校以閱讀進步衡量成效，不單看聚會次數。"}]}, {"word": "attend", "meanings": ["出席"], "pos": ["V"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P079", "title": "參加哪一種活動", "blank": 2, "level": 2, "type": "中文直譯", "evidence": "She would also attend its weekly meetings and take part in the city tournament.", "why": "attend meetings 是出席會議；不能把加入社員團體的關係原封搬來。", "en": "Nora decided to join the chess club. She would also attend its weekly meetings and take part in the city tournament. Each activity gave her a different way to practice.", "zh": "諾拉決定加入西洋棋社，也會出席每週聚會並參加城市賽。每種活動提供不同練習方式。"}]}, {"word": "attention", "meanings": ["注意力", "關注", "注意"], "pos": ["N"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P036", "title": "故事作為開場", "blank": 2, "level": 5, "type": "段落功能", "evidence": "It draws readers' attention before the writer turns to statistical evidence.", "why": "draw readers' attention 表故事引起注意的功能。", "en": "The article begins with a child struggling to cross a busy road. The next paragraphs examine pedestrian safety across the city. The opening story functions as an illustration of the broader issue. It draws readers' attention before the writer turns to statistical evidence.", "zh": "文章先寫一位孩子難以穿越繁忙道路，再檢視全市行人安全。開場故事是較廣泛議題的具體例示，先吸引讀者注意，作者接著轉向統計證據。"}, {"pid": "P100", "title": "一條河的兩種任務", "blank": 10, "level": 5, "type": "全文一致", "evidence": "Its broader lesson was that public spaces require both careful design and continued attention.", "why": "continued attention 呼應持續監測，而非建完即止。", "en": "For decades, a concrete channel carried rainwater quickly through the town. Engineers had designed it to prevent flooding, and many residents considered it a success. Yet its steep walls left little room for plants or animals. When the town proposed a redesign, the debate was not simply about beauty. It concerned how one place could serve multiple purposes. The new plan kept a deep central channel but added planted shelves along the sides. These features created habitats without blocking the main flow. Some residents remained skeptical, fearing that vegetation would slow the water. The team therefore ran tests before construction. The results suggested that the design could work under ordinary conditions; they did not guarantee safety in every possible storm. Officials described the evidence as promising, rather than final. After the first section opened, volunteers began to record water levels and wildlife sightings. Their observations would guide later adjustments. The project thus treated restoration as an ongoing process, not a single finished event. Its broader lesson was that public spaces require both careful design and continued attention.", "zh": "數十年來，水泥渠道讓雨水快速流過小鎮。工程師原先設計它是為防洪，许多居民認為很成功。但陡峭壁面使動植物幾乎無處生存。小鎮提出改造時，辯論不只關乎美觀，更涉及同一空間如何兼顧多項用途。新計畫保留深中央水道，在兩側增植栽平台。這些設計創造棲地，又不阻擋主流。部分居民仍懷疑，擔心植被減慢水流。因此團隊施工前先測試。結果暗示設計在一般條件下可行，卻不保證每場可能的暴雨都安全。官員稱證據有希望，而非已定論。首段開放後，志工開始記錄水位與野生動物。觀察將引導後續調整。修復因此是持續過程，而非一次完成的事件。更廣泛的啟示是公共空間既需周密設計，也需持續關注。"}, {"pid": "P137", "title": "兩次錯誤之間", "blank": 1, "level": 4, "type": "尚待確認", "evidence": "The repetition deserved attention, but the teacher still asked how each answer had been chosen.", "why": "deserved attention 表重複值得觀察，不等於證實固定弱點。", "en": "A learner missed a grammar clue on Monday and a similar clue on Friday. The repetition deserved attention, but the teacher still asked how each answer had been chosen. One error came from a hurried guess; the other involved a misunderstood sentence. The explanations were not identical. The teacher recorded the evidence before making a classification. When the cause remained unclear, she kept the diagnosis provisional. Another unfamiliar passage would provide an opportunity for verification.", "zh": "學生週一漏看文法線索，週五又漏看相似線索。重複值得注意，但老師仍問每次如何作答。一錯來自急著猜，另一錯是誤解句子，理由不相同。老師先記錄證據再分類。原因未明時，診斷保持暫定；另一篇陌生文章提供驗證機會。"}]}, {"word": "attitude", "meanings": ["態度"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P133", "title": "一句話裡的保留", "blank": 5, "level": 4, "type": "語氣／含意", "evidence": "A reader should therefore consider the whole exchange before deciding on the speaker's attitude.", "why": "完整對話協助判 speaker's attitude，不能只讀一個形容詞。", "en": "After reading a long proposal, the manager said, \"It is certainly detailed.\" She then asked whether the main idea could be expressed more briefly. Her first remark was not necessarily straightforward praise. In context, it hinted that the proposal might be too lengthy. The request for a shorter version made the implication clearer. A reader should therefore consider the whole exchange before deciding on the speaker's attitude.", "zh": "經理看完長提案說：「確實很詳細。」隨後問主旨能否更簡短表達。首句未必是單純稱讚，語境暗示提案可能過長。要求縮短使暗示更清楚。因此須讀完整互動才能判斷態度。"}]}, {"word": "attributed", "meanings": ["歸因"], "pos": ["V-en"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P041", "title": "延長開放的線索", "blank": 2, "level": 4, "type": "推論", "evidence": "However, a simultaneous reading campaign means the increase cannot be attributed solely to longer hours.", "why": "attributed solely to 表單一歸因，cannot 與同期活動限制因果推論。", "en": "After the library extended its evening hours, more students borrowed books at night. This pattern is consistent with improved access. However, a simultaneous reading campaign means the increase cannot be attributed solely to longer hours. Further comparison would be needed.", "zh": "圖書館延長晚間開放後，更多學生夜間借書。這個趨勢與可近性改善相符。然而同期有閱讀推廣活動，因此不能把增加完全歸因於延長時間，仍需進一步比較。"}]}, {"word": "audience", "meanings": ["讀者／受眾"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P044", "title": "不同的讀者", "blank": 3, "level": 4, "type": "全文一致", "evidence": "Its simplicity is intentional and fits the needs of its intended audience.", "why": "intended audience 指文章前面已說的初學者。", "en": "The opening warns that the guide is designed for beginners. Later chapters explain basic terms and avoid advanced mathematics. The conclusion should describe the book as introductory, not exhaustive. Its simplicity is intentional and fits the needs of its intended audience.", "zh": "開頭提醒指南為初學者設計。後續章節解釋基本術語，避開高階數學。結論應稱它是入門書而非詳盡大全。它的簡單是刻意的，符合目標讀者需求。"}]}, {"word": "avoid", "meanings": ["避免"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P061", "title": "參觀規則", "blank": 2, "level": 1, "type": "句型判斷", "evidence": "It asks them to avoid touching fragile objects.", "why": "avoid 後直接接 touching；prevent 需要受詞或不同結構。", "en": "The museum allows visitors to take photographs without flash. It asks them to avoid touching fragile objects. These rules help protect the collection while keeping the visit enjoyable.", "zh": "博物館允許遊客不用閃光燈拍照，並請大家避免觸摸脆弱物品。規則既保護館藏，也維持參觀樂趣。"}, {"pid": "P125", "title": "實驗課的規則", "blank": 5, "level": 3, "type": "句型判斷", "evidence": "Students then practiced slowly to avoid making careless errors.", "why": "avoid making 直接接動名詞；prevent 需適當受詞和 from 結構。", "en": "The instructor required students to wear goggles. She recommended tying back long hair before using the equipment. The rules made the class feel more secure. A checklist reminded everyone that safety came before speed. Students then practiced slowly to avoid making careless errors.", "zh": "講師要求學生戴護目鏡，並建議使用設備前把長髮綁好。規則讓大家更安心。清單提醒所有人安全優先於速度。學生接著慢慢練習，避免粗心錯誤。"}]}, {"word": "avoidable", "meanings": ["可避免的"], "pos": ["Adj"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P088", "title": "重新使用包裝", "blank": 3, "level": 1, "type": "構詞判斷", "evidence": "The change was not cost-free, but it made unnecessary waste more avoidable.", "why": "改變減少浪費使之 avoidable；unavoidable 表無法避免，方向相反。", "en": "The shop chose reusable boxes that customers could return and use again. This reduced the need for disposable packaging. The change was not cost-free, but it made unnecessary waste more avoidable.", "zh": "商店選用顧客可歸還再用的盒子，減少一次性包裝需求。改變並非零成本，卻讓不必要的浪費更能避免。"}]}, {"word": "aware", "meanings": ["察覺的"], "pos": ["Adj"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P058", "title": "雨水的依賴", "blank": 2, "level": 1, "type": "介系詞搭配", "evidence": "After several dry seasons, residents became aware of the risks.", "why": "aware of 指察覺風險，後文籌措第二水源即證據；unaware 與行動原因矛盾。", "en": "The village used to depend on a single well. After several dry seasons, residents became aware of the risks. They now contribute to a fund for a second water source.", "zh": "村莊過去仰賴一口井。經過幾次乾季，居民意識到風險。他們現在捐款給開發第二水源的基金。"}]}, {"word": "background", "meanings": ["背景"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P070", "title": "免費導覽", "blank": 3, "level": 2, "type": "多義判斷", "evidence": "Volunteers lead small groups through the galleries and explain the background of selected objects.", "why": "explain background 指歷史脈絡；foreground 是空間前景。", "en": "The museum does not charge visitors for its guided tours. The service is free, although donations are welcome. Volunteers lead small groups through the galleries and explain the background of selected objects.", "zh": "博物館導覽不向遊客收費。服務免費，但歡迎捐款。志工帶小團體走過展廳，解釋部分物件的背景。"}]}, {"word": "because", "meanings": ["因為"], "pos": ["Conj"], "tags": ["Logic", "Semantics", "Grammar"], "examples": [{"pid": "P109", "title": "午休的短暫步行", "blank": 4, "level": 4, "type": "句間邏輯", "evidence": "The class kept both options, because the aim was movement rather than a particular location.", "why": "後句解釋保留兩案的原因，用 because；不是和保留方案相反的 although。", "en": "A class expected a short walk after lunch to waste study time. Instead, many students returned feeling more alert. The teacher repeated the activity for a week. However, she noticed that heavy rain made outdoor walks impractical. She therefore offered an indoor route as an alternative. The class kept both options, because the aim was movement rather than a particular location. The final plan was flexible rather than rigid.", "zh": "班上原以為午餐後散步浪費讀書時間，實際卻有許多學生精神更好。老師重複活動一週，但發現大雨使戶外步行難以實行。因此她提供室內路線作替代方案。兩種選項都保留，因為目標是活動身體而非限定地點。最後計畫有彈性而不僵化。"}, {"pid": "P136", "title": "從海岸帶回的資料", "blank": 4, "level": 4, "type": "句法判斷", "evidence": "Because the locations differed, the team kept the groups separate.", "why": "空格後完整子句，Because 給原因；Despite 不能直接接完整子句。", "en": "The samples collected during low tide were stored in sealed containers. The researcher who supervised the trip checked every label. Students noted the places where each sample had been found. Because the locations differed, the team kept the groups separate. This allowed comparisons without mixing material from different habitats.", "zh": "退潮時收集的樣本存於密封容器。督導行程的研究者檢查標籤。學生記下各樣本發現位置。因地點不同，團隊分組保存，讓比較時不會混入不同棲地材料。"}]}, {"word": "before", "meanings": ["在…之前", "之前"], "pos": ["Conj", "Prep"], "tags": ["Cohesion", "Semantics", "Logic", "Global", "Grammar", "Collocation", "POS"], "examples": [{"pid": "P020", "title": "劇場復原", "blank": 1, "level": 3, "type": "時間線", "evidence": "The theater had been closed for a decade before volunteers began repairs.", "why": "關閉十年是開始修繕前的背景，before 符合 had been closed。", "en": "The theater had been closed for a decade before volunteers began repairs. They first replaced the roof and then restored the seats. By the time the doors reopened, the team had completed every safety check.", "zh": "劇院在志工開始修繕前已關閉十年。他們先換屋頂，再修復座椅。大門重新開啟時，團隊已完成每項安全檢查。"}, {"pid": "P026", "title": "有條件的免費", "blank": 3, "level": 3, "type": "作用範圍", "evidence": "Families should check the conditions before booking.", "why": "訂票前查條件才能做決定，before；after 已錯過訂票判斷時點。", "en": "The museum offers free entry to children under twelve. This limited offer does not apply to adults. It also excludes special exhibitions, so not every gallery is free. Families should check the conditions before booking.", "zh": "博物館讓十二歲以下兒童免費入場。這項有限優惠不適用成人，也排除特展，因此不是每個展廳都免費。家庭應在訂票前查看條件。"}, {"pid": "P101", "title": "工具圖書館的考驗", "blank": 5, "level": 5, "type": "文章組織", "evidence": "Each item was checked before it went back onto the shelf.", "why": "上架供人再借前檢查，before。", "en": "A neighborhood library began lending tools as well as books. The idea seemed practical: most people needed a drill only a few times a year. Sharing could reduce both household spending and unnecessary purchases. At first, however, the staff focused mainly on collecting equipment. They soon discovered that ownership was only one part of the problem. Borrowers needed clear instructions, and returned tools required inspection. One damaged cable could make the next loan unsafe. To address these concerns, the library trained volunteers and introduced a checklist. Each item was checked before it went back onto the shelf. The system also recorded late returns, but the director warned against treating every delay as carelessness. Illness or transport problems could be involved. Instead of imposing the same response in every case, staff considered the circumstances. Six months later, the service had many regular users. That popularity was encouraging, although it did not by itself prove that the project saved resources overall. The library still needed to compare the costs of repair and transport with the purchases it had replaced. Its experience showed that a generous idea becomes sustainable through careful management.", "zh": "社區圖書館除了書也開始借工具。想法看來實用：多數人一年只用幾次電鑽。共享能減少家庭支出與不必要購買。但員工起初主要忙著收集設備，很快發現有工具只是問題的一部分。借用者需要清楚說明，歸還工具需要檢查；一條損壞電線就可能讓下一次借用不安全。圖書館為處理疑慮培訓志工並設清單。每件物品回架前都先檢查。系統也記錄晚還，但館長提醒不能把每次延誤都當粗心，可能涉及疾病或交通問題。員工考量個別情況，而非一律回應。半年後，服務已有許多固定使用者，令人鼓舞，但受歡迎本身並不能證明整體省資源。仍需比較維修、運輸成本和取代的購買。經驗顯示，慷慨構想需靠細心管理才能持續。"}]}, {"word": "benefit", "meanings": ["使受益"], "pos": ["V"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P122", "title": "街坊物資調查", "blank": 5, "level": 3, "type": "詞性判斷", "evidence": "The plan will benefit households far from the central station.", "why": "will benefit 後接 households，beneficial 為形容詞不能直接接助動詞。", "en": "Volunteers will survey residents about emergency supplies. The results will help identify gaps in preparation. Rather than store everything in one building, the group plans several smaller depots. A local shop has already offered space for one of them. The plan will benefit households far from the central station.", "zh": "志工將調查居民的緊急物資。結果能找出準備不足處。團隊不打算把所有東西存一棟樓，而規劃幾個小據點。一家在地商店已提供空間。計畫將使遠離中央站的住戶受益。"}]}, {"word": "borrow", "meanings": ["借入"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P065", "title": "借用與租用", "blank": 1, "level": 3, "type": "近義詞混淆", "evidence": "Visitors may borrow umbrellas from the hotel at no charge.", "why": "Visitors 是接收傘的人，故 borrow；lend 是提供者的動作。", "en": "Visitors may borrow umbrellas from the hotel at no charge. Bicycles, however, must be rented for an hourly fee. The different arrangements reflect the cost of maintenance.", "zh": "旅客可免費向旅館借傘，腳踏車則需按小時付費租用。兩種安排不同，反映維修保養成本。"}, {"pid": "P067", "title": "誰借給誰", "blank": 1, "level": 1, "type": "易混淆字詞", "evidence": "Jia asked to borrow a ladder from her neighbor.", "why": "from her neighbor 表佳是借入者 borrow；lend 是提供方的動作。", "en": "Jia asked to borrow a ladder from her neighbor. He was happy to lend it to her until Sunday. She promised to return it after painting her room.", "zh": "佳向鄰居借梯子。鄰居很樂意借給她用到週日。她答應粉刷完房間就歸還。"}]}, {"word": "both", "meanings": ["兩者都"], "pos": ["Det"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P108", "title": "兩個借書箱", "blank": 2, "level": 3, "type": "指涉連貫", "evidence": "Volunteers checked both boxes each Friday.", "why": "已介紹恰好兩箱，用 both boxes。", "en": "The village placed a blue book box near the pier and a yellow one by the school. The first mainly served fishers, while the latter attracted children. Volunteers checked both boxes each Friday. If a book was damaged, they removed it for repair. This routine kept the collection usable. The villagers soon regarded the boxes as shared resources rather than private property.", "zh": "村莊在碼頭旁設藍色借書箱，學校旁設黃色箱。前者主要服務漁民，後者吸引兒童。志工每週五檢查兩個箱子。若有書損壞，就取出修補。這項例行工作維持館藏可用，村民也逐漸視箱子為共有資源而非私產。"}]}, {"word": "budget", "meanings": ["編預算／預算"], "pos": ["V/N"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P054", "title": "預算與計畫", "blank": 3, "level": 3, "type": "詞性判斷", "evidence": "Members also need to budget for equipment repairs instead of spending everything on decorations.", "why": "need to budget for 是為某項目編預算；financial 是形容詞，不能接在 to 後作動詞。", "en": "The group will plan a festival within a fixed budget. Its final proposal must include a rain policy. Members also need to budget for equipment repairs instead of spending everything on decorations.", "zh": "團隊會在固定預算內規劃節慶。最後的計畫必須含雨天辦法。成員也需要編列設備維修預算，而非把錢全花在裝飾上。"}]}, {"word": "business", "meanings": ["生意／業務"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P112", "title": "新設的修鞋攤", "blank": 1, "level": 3, "type": "新舊資訊", "evidence": "The business was unfamiliar to many younger residents.", "why": "The business 定指剛引入的修鞋攤業務。", "en": "A cobbler opened a stall near the station. The business was unfamiliar to many younger residents. To introduce the service, she displayed a damaged boot beside its repaired counterpart. This comparison showed what customers could expect. Once people understood the process, their initial uncertainty faded. The stall gradually developed a regular clientele.", "zh": "一位修鞋師在車站旁設攤。許多年輕居民不熟悉這門生意。她把一隻壞靴和修好的對應靴並列以介紹服務。比較讓顧客看見預期成果。理解流程後，起初的不確定逐漸消退，攤位也建立固定客群。"}]}, {"word": "care", "meanings": ["細心／照護"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P128", "title": "修復唱片的價值", "blank": 2, "level": 3, "type": "多義判斷", "evidence": "Dust covered its surface, so a specialist cleaned it with great care.", "why": "with great care 表細心處理，不一定指醫療照護。", "en": "The archive held a rare record of a local singer's first performance. Dust covered its surface, so a specialist cleaned it with great care. The work carried no charge because a donor covered the cost. Once restored, the music brought an almost forgotten voice back into circulation. The project gave new life to material that had spent decades in storage.", "zh": "檔案館保存一張在地歌手初次演出的珍貴唱片。表面覆塵，專家細心清潔。捐贈者負擔費用，因此工作不收費。修復後，音樂讓幾乎被遺忘的聲音重新流傳，也讓存放數十年的材料重獲生命。"}]}, {"word": "careful", "meanings": ["審慎的"], "pos": ["Adj"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P102", "title": "城市夜色中的昆蟲", "blank": 9, "level": 5, "type": "推論", "evidence": "For the students, the most valuable lesson was not a simple answer but a more careful way of asking questions.", "why": "比較、控制與保留表 careful 方法。", "en": "When a city replaced its streetlights, residents welcomed the brighter roads. A biology teacher asked a different question: how would the change affect insects? Her students placed observation sheets near several lamps and counted visits at fixed times. To keep the comparison fair, they used the same procedure at every location. They found more insects around some lamps than others. This difference was interesting, but its cause was not immediately clear. The locations also varied in temperature and nearby vegetation. The teacher therefore reminded the class that a pattern was not automatically an explanation. During a second trial, the students compared two lamp types in the same area. Their new records provided stronger evidence about the role of light. Even so, the findings applied only to the conditions they had tested. The class resisted the temptation to claim that one lamp was best everywhere. In their report, they described both the results and the limitations. The city agreed to consider a smaller trial rather than replace every light at once. For the students, the most valuable lesson was not a simple answer but a more careful way of asking questions. Scientific inquiry, they learned, depends on adjusting claims to match what observations actually support.", "zh": "城市更換路燈時，居民歡迎更明亮道路。生物老師問：改變如何影響昆蟲？學生在幾座燈旁設觀察表，固定時間計數到訪。為公平比較，各處程序一致。他們發現某些燈邊昆蟲更多，差異有趣，原因卻未明：各地溫度、植被也不同。老師提醒模式不自動等於解釋。第二次試驗在同區比較兩款燈，新紀錄提供更強證據。不過發現只適用受測條件。學生避免宣稱某款燈處處最佳，報告同時說明結果與限制。市府同意先做較小試辦，不一次換掉所有燈。學生最有價值的收穫不是簡單答案，而是更審慎提問。科學探究需調整主張，使之符合觀察實際能支持的範圍。"}]}, {"word": "carefully", "meanings": ["仔細地"], "pos": ["Adv"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P002", "title": "修復舊腳踏車", "blank": 2, "level": 2, "type": "詞形", "evidence": "They worked carefully to check each brake.", "why": "worked 要由副詞 carefully 說明工作方式。", "en": "A repair club opened after school. Its members developed practical skills by fixing old bicycles. They worked carefully to check each brake. The project also increased their confidence in solving unfamiliar problems.", "zh": "課後成立了修車社。社員透過修理舊腳踏車培養實用技能，仔細檢查每個煞車。這項計畫也增強他們解決陌生問題的信心。"}, {"pid": "P105", "title": "校園堆肥的改變", "blank": 3, "level": 2, "type": "詞形", "evidence": "After seeing the results, students separated their waste more carefully.", "why": "separated 是動作，需 carefully 修飾方式；careful 是形容詞。", "en": "The school began collecting fruit peels for compost. At first, students showed little interest in the project. A teacher explained how food scraps could become valuable material for the garden. After seeing the results, students separated their waste more carefully. The amount sent to the landfill fell considerably. What began as a small experiment became a successful part of daily school life.", "zh": "學校開始收集果皮製作堆肥。起初學生對計畫興趣不大。老師解釋廚餘如何成為花園的珍貴材料。看到成果後，學生更仔細分類垃圾，送往掩埋場的量大幅減少。小實驗成了校園日常中成功的一環。"}]}, {"word": "carelessness", "meanings": ["粗心"], "pos": ["N"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P101", "title": "工具圖書館的考驗", "blank": 6, "level": 5, "type": "文章組織", "evidence": "The system also recorded late returns, but the director warned against treating every delay as carelessness.", "why": "館長避免把所有晚還歸因 carelessness，後文給替代原因。", "en": "A neighborhood library began lending tools as well as books. The idea seemed practical: most people needed a drill only a few times a year. Sharing could reduce both household spending and unnecessary purchases. At first, however, the staff focused mainly on collecting equipment. They soon discovered that ownership was only one part of the problem. Borrowers needed clear instructions, and returned tools required inspection. One damaged cable could make the next loan unsafe. To address these concerns, the library trained volunteers and introduced a checklist. Each item was checked before it went back onto the shelf. The system also recorded late returns, but the director warned against treating every delay as carelessness. Illness or transport problems could be involved. Instead of imposing the same response in every case, staff considered the circumstances. Six months later, the service had many regular users. That popularity was encouraging, although it did not by itself prove that the project saved resources overall. The library still needed to compare the costs of repair and transport with the purchases it had replaced. Its experience showed that a generous idea becomes sustainable through careful management.", "zh": "社區圖書館除了書也開始借工具。想法看來實用：多數人一年只用幾次電鑽。共享能減少家庭支出與不必要購買。但員工起初主要忙著收集設備，很快發現有工具只是問題的一部分。借用者需要清楚說明，歸還工具需要檢查；一條損壞電線就可能讓下一次借用不安全。圖書館為處理疑慮培訓志工並設清單。每件物品回架前都先檢查。系統也記錄晚還，但館長提醒不能把每次延誤都當粗心，可能涉及疾病或交通問題。員工考量個別情況，而非一律回應。半年後，服務已有許多固定使用者，令人鼓舞，但受歡迎本身並不能證明整體省資源。仍需比較維修、運輸成本和取代的購買。經驗顯示，慷慨構想需靠細心管理才能持續。"}]}, {"word": "cause", "meanings": ["原因"], "pos": ["N"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P130", "title": "雨量與報名率", "blank": 5, "level": 4, "type": "上下文邏輯", "evidence": "It avoided treating the first observed link as a proven cause.", "why": "avoid…proven cause 表避免過早因果定論，非宣稱有 certainty。", "en": "More people joined the indoor class during a rainy week. The organizer suspected that bad weather had increased demand. Yet a discounted fee had been introduced at the same time. Because these changes coincided, their effects were difficult to separate. She compared later weeks with different prices and weather conditions. This approach helped test competing explanations. It avoided treating the first observed link as a proven cause.", "zh": "雨週有更多人報名室內課。主辦者懷疑壞天氣增加需求，但同期也開始折扣。兩改變同時發生，效果難分。她比較後續價格、天氣條件不同的週次，檢驗競爭解釋，避免把初見關聯當已證明原因。"}]}, {"word": "causes", "meanings": ["成因"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P115", "title": "一則公共提案的結構", "blank": 1, "level": 4, "type": "文章組織", "evidence": "It then identifies the main causes, including uneven arrival times.", "why": "uneven arrivals 解釋擁擠原因，causes；不能因未見因果證明就把這篇已明示的識別成因改成 coincidences。", "en": "The report begins with a description of overcrowded bus stops. It then identifies the main causes, including uneven arrival times. The next section proposes a scheduling reform. A trial supplies evidence about whether the proposal works. The final section weighs benefits against costs before making a recommendation. This problem-to-response structure helps readers follow the argument.", "zh": "報告先描述公車站擁擠，再辨識主要成因，如到站時間不均。下一節提出班表改革。試辦提供方案效果的證據。末節權衡效益和成本，再給建議。從問題走向回應的結構讓讀者容易跟上論證。"}]}, {"word": "cautiously", "meanings": ["審慎地"], "pos": ["Adv"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P039", "title": "新工具的期待", "blank": 1, "level": 5, "type": "作者態度", "evidence": "Her position is cautiously positive.", "why": "could 與 warns 都有保留，cautiously；unreservedly 忽略限制。", "en": "The columnist believes the translation tool could help travelers. Yet she warns that errors remain common in sensitive conversations. Her position is cautiously positive. She welcomes the tool's potential without treating it as a complete substitute for human judgment.", "zh": "專欄作家認為翻譯工具可能幫助旅人，但警告在敏感對話中仍常出錯。她的態度是審慎樂觀，肯定工具潛力，卻不把它視為完全替代人類判斷的東西。"}]}, {"word": "challenge", "meanings": ["挑戰"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P043", "title": "仍待改善的市場", "blank": 3, "level": 3, "type": "全文一致", "evidence": "The final paragraph calls for further action, keeping the conclusion consistent with the remaining challenge.", "why": "remaining challenge 回接餐盒垃圾；celebration 無法承接尚未解決的問題。", "en": "The market reduced plastic bags but still used disposable food boxes. Its waste problem was therefore only partly solved. The final paragraph calls for further action, keeping the conclusion consistent with the remaining challenge.", "zh": "市場減少塑膠袋，卻仍使用一次性餐盒。因此垃圾問題只解決一部分。末段要求進一步行動，讓結論與仍存在的挑戰保持一致。"}]}, {"word": "charge", "meanings": ["收費／充電", "費用／電荷"], "pos": ["V", "N"], "tags": ["Semantics"], "examples": [{"pid": "P070", "title": "免費導覽", "blank": 1, "level": 2, "type": "多義判斷", "evidence": "The museum does not charge visitors for its guided tours.", "why": "free 與 donations 限定 charge 是收費義，不是充電；accuse 用 of 指控，不用 for 表收費。", "en": "The museum does not charge visitors for its guided tours. The service is free, although donations are welcome. Volunteers lead small groups through the galleries and explain the background of selected objects.", "zh": "博物館導覽不向遊客收費。服務免費，但歡迎捐款。志工帶小團體走過展廳，解釋部分物件的背景。"}, {"pid": "P128", "title": "修復唱片的價值", "blank": 3, "level": 3, "type": "多義判斷", "evidence": "The work carried no charge because a donor covered the cost.", "why": "donor covered cost 限定 no charge 是免費，非沒有電荷或 accusation。", "en": "The archive held a rare record of a local singer's first performance. Dust covered its surface, so a specialist cleaned it with great care. The work carried no charge because a donor covered the cost. Once restored, the music brought an almost forgotten voice back into circulation. The project gave new life to material that had spent decades in storage.", "zh": "檔案館保存一張在地歌手初次演出的珍貴唱片。表面覆塵，專家細心清潔。捐贈者負擔費用，因此工作不收費。修復後，音樂讓幾乎被遺忘的聲音重新流傳，也讓存放數十年的材料重獲生命。"}]}, {"word": "chronology", "meanings": ["時間順序"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P033", "title": "一項發明的誕生", "blank": 1, "level": 5, "type": "文章組織", "evidence": "Its main organizing principle is chronology.", "why": "from early sketch to working device 加上 before later 構成 chronology；不是以兩案差異為主的 contrast。", "en": "The essay traces a filter from an early sketch to a working device. Its main organizing principle is chronology. Failed tests appear before later improvements, helping readers understand how each problem shaped the next version.", "zh": "文章追溯濾器從早期草圖到可運作裝置的歷程。主要組織原則是時間順序。失敗測試先於後來的改良，讓讀者明白每個問題如何形塑下一個版本。"}]}, {"word": "circulation", "meanings": ["流通"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P128", "title": "修復唱片的價值", "blank": 4, "level": 3, "type": "多義判斷", "evidence": "Once restored, the music brought an almost forgotten voice back into circulation.", "why": "back into circulation 指重新流傳，不是血液循環。", "en": "The archive held a rare record of a local singer's first performance. Dust covered its surface, so a specialist cleaned it with great care. The work carried no charge because a donor covered the cost. Once restored, the music brought an almost forgotten voice back into circulation. The project gave new life to material that had spent decades in storage.", "zh": "檔案館保存一張在地歌手初次演出的珍貴唱片。表面覆塵，專家細心清潔。捐贈者負擔費用，因此工作不收費。修復後，音樂讓幾乎被遺忘的聲音重新流傳，也讓存放數十年的材料重獲生命。"}]}, {"word": "circumstances", "meanings": ["情況"], "pos": ["N"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P101", "title": "工具圖書館的考驗", "blank": 7, "level": 5, "type": "文章組織", "evidence": "Instead of imposing the same response in every case, staff considered the circumstances.", "why": "疾病與交通是個別 circumstances。", "en": "A neighborhood library began lending tools as well as books. The idea seemed practical: most people needed a drill only a few times a year. Sharing could reduce both household spending and unnecessary purchases. At first, however, the staff focused mainly on collecting equipment. They soon discovered that ownership was only one part of the problem. Borrowers needed clear instructions, and returned tools required inspection. One damaged cable could make the next loan unsafe. To address these concerns, the library trained volunteers and introduced a checklist. Each item was checked before it went back onto the shelf. The system also recorded late returns, but the director warned against treating every delay as carelessness. Illness or transport problems could be involved. Instead of imposing the same response in every case, staff considered the circumstances. Six months later, the service had many regular users. That popularity was encouraging, although it did not by itself prove that the project saved resources overall. The library still needed to compare the costs of repair and transport with the purchases it had replaced. Its experience showed that a generous idea becomes sustainable through careful management.", "zh": "社區圖書館除了書也開始借工具。想法看來實用：多數人一年只用幾次電鑽。共享能減少家庭支出與不必要購買。但員工起初主要忙著收集設備，很快發現有工具只是問題的一部分。借用者需要清楚說明，歸還工具需要檢查；一條損壞電線就可能讓下一次借用不安全。圖書館為處理疑慮培訓志工並設清單。每件物品回架前都先檢查。系統也記錄晚還，但館長提醒不能把每次延誤都當粗心，可能涉及疾病或交通問題。員工考量個別情況，而非一律回應。半年後，服務已有許多固定使用者，令人鼓舞，但受歡迎本身並不能證明整體省資源。仍需比較維修、運輸成本和取代的購買。經驗顯示，慷慨構想需靠細心管理才能持續。"}]}, {"word": "claimed", "meanings": ["宣稱"], "pos": ["V"], "tags": ["Logic", "Semantics", "Grammar", "Collocation", "Cohesion", "Global", "POS"], "examples": [{"pid": "P104", "title": "校園新聞的查證", "blank": 1, "level": 5, "type": "作用範圍", "evidence": "Its caption claimed that the library would close permanently.", "why": "caption claimed 是轉述，並不代表作者認同。", "en": "An image of a locked gate spread through the school chat group. Its caption claimed that the library would close permanently. Many students forwarded it before checking the date. The student newspaper decided to verify the message. First, reporters located the original image. It had been taken during repairs two years earlier. Next, they contacted the librarian, who explained that the current closure would last only one afternoon. The image itself was real, but its new context made it misleading. The team published a correction and included links to the relevant notices. They avoided accusing individual students of deliberate dishonesty because careless sharing did not prove intent. Instead, the article described a simple checking procedure: locate the source, inspect the date, and compare the claim with current information. A follow-up survey found that some readers had changed their sharing habits. The editors welcomed this response but did not call it universal. Only a fraction of students had answered. The final article therefore balanced a positive outcome with a clear statement of its limits. Responsible reporting, it argued, requires the same standards when describing one's own success as when investigating someone else's story. Accuracy is a continuing practice, not a badge earned once.", "zh": "一張上鎖校門照片在校群傳播，圖說宣稱圖書館永久關閉。許多人未查日期便轉傳。校刊決定查證，先找原圖，發現拍於兩年前修繕期間；再聯絡館員，得知本次只關一下午。照片真實，新脈絡卻使它誤導。團隊刊更正並附公告連結，避免指控個別學生蓄意不誠實，因為粗心分享不等於證明意圖。文章介紹查核程序：找來源、查日期、與當前資訊比對。後續調查發現部分讀者改變分享習慣。編輯肯定成果，卻不稱人人都如此，因只有小部分學生作答。文章因此平衡正面成果與清楚限制，主張描述自身成功和調查他人故事應用相同標準。準確是持續實踐，而非一次取得的徽章。"}]}, {"word": "classification", "meanings": ["分類"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P137", "title": "兩次錯誤之間", "blank": 3, "level": 4, "type": "尚待確認", "evidence": "The teacher recorded the evidence before making a classification.", "why": "before classification 表先蒐集理由再分類。", "en": "A learner missed a grammar clue on Monday and a similar clue on Friday. The repetition deserved attention, but the teacher still asked how each answer had been chosen. One error came from a hurried guess; the other involved a misunderstood sentence. The explanations were not identical. The teacher recorded the evidence before making a classification. When the cause remained unclear, she kept the diagnosis provisional. Another unfamiliar passage would provide an opportunity for verification.", "zh": "學生週一漏看文法線索，週五又漏看相似線索。重複值得注意，但老師仍問每次如何作答。一錯來自急著猜，另一錯是誤解句子，理由不相同。老師先記錄證據再分類。原因未明時，診斷保持暫定；另一篇陌生文章提供驗證機會。"}]}, {"word": "clear", "meanings": ["清楚的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P072", "title": "清楚的論點", "blank": 2, "level": 4, "type": "多義判斷", "evidence": "To make it clear, she compared two lunch habits.", "why": "make it clear 表讓意思清楚，不是在描述透明材質。", "en": "The speaker's main point was that convenience can create hidden waste. To make it clear, she compared two lunch habits. The example gave her argument more weight than a list of slogans would have.", "zh": "講者重點是便利可能造成隱藏垃圾。為說清楚，她比較兩種午餐習慣。這個例子比一串口號更能增加論點分量。"}]}, {"word": "clearer", "meanings": ["更清楚的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P133", "title": "一句話裡的保留", "blank": 4, "level": 4, "type": "語氣／含意", "evidence": "The request for a shorter version made the implication clearer.", "why": "後句補充讓 implication clearer，非增加 confusion。", "en": "After reading a long proposal, the manager said, \"It is certainly detailed.\" She then asked whether the main idea could be expressed more briefly. Her first remark was not necessarily straightforward praise. In context, it hinted that the proposal might be too lengthy. The request for a shorter version made the implication clearer. A reader should therefore consider the whole exchange before deciding on the speaker's attitude.", "zh": "經理看完長提案說：「確實很詳細。」隨後問主旨能否更簡短表達。首句未必是單純稱讚，語境暗示提案可能過長。要求縮短使暗示更清楚。因此須讀完整互動才能判斷態度。"}]}, {"word": "clientele", "meanings": ["客群"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P112", "title": "新設的修鞋攤", "blank": 5, "level": 3, "type": "新舊資訊", "evidence": "The stall gradually developed a regular clientele.", "why": "regular clientele 是重複到訪的固定客群，呈現由陌生到熟悉的發展。", "en": "A cobbler opened a stall near the station. The business was unfamiliar to many younger residents. To introduce the service, she displayed a damaged boot beside its repaired counterpart. This comparison showed what customers could expect. Once people understood the process, their initial uncertainty faded. The stall gradually developed a regular clientele.", "zh": "一位修鞋師在車站旁設攤。許多年輕居民不熟悉這門生意。她把一隻壞靴和修好的對應靴並列以介紹服務。比較讓顧客看見預期成果。理解流程後，起初的不確定逐漸消退，攤位也建立固定客群。"}]}, {"word": "closely", "meanings": ["密切地"], "pos": ["Adv"], "tags": ["Semantics"], "examples": [{"pid": "P068", "title": "水位的變化", "blank": 3, "level": 2, "type": "易混淆字詞", "evidence": "They watched the water level closely until the storm passed.", "why": "watched closely 表密切關注，nearly 只是差一點，不表觀察方式。", "en": "Heavy rain caused the river to rise overnight. Workers had to raise the temporary barrier to keep the road dry. They watched the water level closely until the storm passed.", "zh": "大雨使河流水位一夜上升。工人必須提高臨時障礙物以保持道路乾燥。他們密切觀察水位，直到暴風雨過去。"}]}, {"word": "clue", "meanings": ["線索"], "pos": ["N"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P103", "title": "博物館裡的空白標籤", "blank": 4, "level": 5, "type": "尚待確認", "evidence": "The similarity offered a useful clue, not a complete answer.", "why": "not a complete answer 限定為 clue。", "en": "A small museum received a wooden box from a local family. No document explained its origin. The donors believed it had belonged to a traveling merchant, but this account came from a story repeated over several generations. The curator did not reject the story; she simply distinguished it from a verified fact. She examined the box and found a mark that resembled a maker's symbol in an old catalog. The similarity offered a useful clue, not a complete answer. A later search revealed that several workshops had used comparable marks. The team therefore kept the label tentative. Instead of inventing a precise date, it explained what was known and what remained uncertain. Some visitors found the incomplete story frustrating. Others appreciated being invited into the process of investigation. The museum added a display describing how evidence is compared and claims are revised. Months later, a visitor supplied a photograph showing a similar box in a shop. This new material did not solve every question, but it helped narrow the search. The exhibit ultimately became less about a single object's mystery and more about the responsibility of presenting knowledge honestly.", "zh": "小博物館收到當地家庭捐贈的木盒，沒有文件交代來源。捐贈者相信它曾屬旅行商人，但說法來自世代口傳。館員沒有否定故事，只把它與核實事實分開。她找到似乎與舊型錄製作者符號相近的記號。相似性是有用線索，而非完整答案。後來查出多間工坊用相近記號，因此標籤保持暫定。館方不編造精確日期，而說明已知與未知。部分訪客感到挫折，另一些欣賞能參與調查過程。館方加設展示，說明如何比較證據與修正主張。數月後，訪客提供商店中相似盒子的照片。新資料未解決一切，但縮小搜尋範圍。展覽最後更關乎誠實呈現知識的責任，而不只是一件物品的謎。"}]}, {"word": "coincided", "meanings": ["同時發生"], "pos": ["V"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P130", "title": "雨量與報名率", "blank": 2, "level": 4, "type": "上下文邏輯", "evidence": "Because these changes coincided, their effects were difficult to separate.", "why": "at the same time 表 coincided；separated 與同期發生相反。", "en": "More people joined the indoor class during a rainy week. The organizer suspected that bad weather had increased demand. Yet a discounted fee had been introduced at the same time. Because these changes coincided, their effects were difficult to separate. She compared later weeks with different prices and weather conditions. This approach helped test competing explanations. It avoided treating the first observed link as a proven cause.", "zh": "雨週有更多人報名室內課。主辦者懷疑壞天氣增加需求，但同期也開始折扣。兩改變同時發生，效果難分。她比較後續價格、天氣條件不同的週次，檢驗競爭解釋，避免把初見關聯當已證明原因。"}]}, {"word": "collected", "meanings": ["被收集的"], "pos": ["V-en"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P136", "title": "從海岸帶回的資料", "blank": 1, "level": 4, "type": "句法判斷", "evidence": "The samples collected during low tide were stored in sealed containers.", "why": "samples 被收集，collected 修飾；collecting 會讓樣本成為主動收集者，主句動詞是 were stored。", "en": "The samples collected during low tide were stored in sealed containers. The researcher who supervised the trip checked every label. Students noted the places where each sample had been found. Because the locations differed, the team kept the groups separate. This allowed comparisons without mixing material from different habitats.", "zh": "退潮時收集的樣本存於密封容器。督導行程的研究者檢查標籤。學生記下各樣本發現位置。因地點不同，團隊分組保存，讓比較時不會混入不同棲地材料。"}]}, {"word": "collects", "meanings": ["收集"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P005", "title": "屋頂雨水", "blank": 1, "level": 3, "type": "文法骨架", "evidence": "A tank installed on the roof collects rainwater.", "why": "A tank 是主詞，installed… 是修飾語；collects 才能完成述語。", "en": "A tank installed on the roof collects rainwater. The water stored inside it is used to clean the playground. This simple system, despite its small size, saves the school hundreds of liters each month.", "zh": "裝在屋頂的水箱收集雨水。儲存在裡面的水被用來清洗操場。這套簡單系統雖然不大，每月仍替學校省下數百公升的水。"}]}, {"word": "commitment", "meanings": ["承諾"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P087", "title": "婉拒邀約", "blank": 3, "level": 4, "type": "語氣／含意", "evidence": "Her message is polite, yet it does not amount to a commitment to join the project.", "why": "does not amount to a commitment 防止把客氣意願當實際承諾。", "en": "Sara replied, \"I'd love to help, but my schedule is full this week.\" The phrase before but softens a refusal. Her message is polite, yet it does not amount to a commitment to join the project.", "zh": "莎拉回覆：「我很想幫忙，但我這週行程已滿。」but 前面的語句緩和拒絕。訊息很有禮貌，卻不等於承諾參與計畫。"}]}, {"word": "comparison", "meanings": ["比較"], "pos": ["N"], "tags": ["Global", "Semantics", "Logic", "Cohesion"], "examples": [{"pid": "P032", "title": "自行車道比較", "blank": 1, "level": 4, "type": "文章組織", "evidence": "Rather than telling one continuous story, the article uses comparison.", "why": "two designs against the same… 是比較架構；chronology 只排時間，未表達此評估。", "en": "The first section describes the old road layout. The second introduces a protected bicycle lane. Rather than telling one continuous story, the article uses comparison. It evaluates the two designs against the same safety criteria before offering a recommendation.", "zh": "第一節描述舊道路配置，第二節介紹受保護的自行車道。文章不是講述一條連續故事，而是使用比較。它依相同安全標準評估兩種設計，再提出建議。"}, {"pid": "P077", "title": "相關不等於原因", "blank": 2, "level": 3, "type": "上下文邏輯", "evidence": "To test the club's effect, researchers need a suitable comparison group and information about students' initial abilities.", "why": "comparison group 可對照社團之外的情況。", "en": "Students who joined the club reported higher reading scores. However, they may already have been eager readers. The link is a correlation, not proof of causation. To test the club's effect, researchers need a suitable comparison group and information about students' initial abilities.", "zh": "加入社團的學生回報較高閱讀分數，但他們可能原本就熱愛閱讀。此關係是相關，並非因果證明。要測試社團效果，需要適當比較組及學生起初能力的資訊。"}, {"pid": "P112", "title": "新設的修鞋攤", "blank": 3, "level": 3, "type": "新舊資訊", "evidence": "This comparison showed what customers could expect.", "why": "This comparison 回接並列兩靴的展示，不是未來 prediction。", "en": "A cobbler opened a stall near the station. The business was unfamiliar to many younger residents. To introduce the service, she displayed a damaged boot beside its repaired counterpart. This comparison showed what customers could expect. Once people understood the process, their initial uncertainty faded. The stall gradually developed a regular clientele.", "zh": "一位修鞋師在車站旁設攤。許多年輕居民不熟悉這門生意。她把一隻壞靴和修好的對應靴並列以介紹服務。比較讓顧客看見預期成果。理解流程後，起初的不確定逐漸消退，攤位也建立固定客群。"}]}, {"word": "competition", "meanings": ["競賽"], "pos": ["N"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P121", "title": "地方科學競賽", "blank": 2, "level": 3, "type": "詞族混淆", "evidence": "The annual competition encouraged students to solve local problems.", "why": "annual competition 是年度活動本身，不是參加的人。", "en": "Each competitor brought a model to the hall. The annual competition encouraged students to solve local problems. Judges valued original thinking more than a fiercely competitive attitude. One team's water filter made a useful contribution to the discussion. Its youngest contributor explained the design with surprising clarity.", "zh": "每位參賽者帶模型到會場。年度競賽鼓勵學生解決地方問題。評審重視原創思考，勝過強烈競爭態度。一隊濾水器對討論有實用貢獻。最年輕的貢獻者解說設計格外清楚。"}]}, {"word": "competitive", "meanings": ["競爭性的"], "pos": ["Adj"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P121", "title": "地方科學競賽", "blank": 3, "level": 3, "type": "詞族混淆", "evidence": "Judges valued original thinking more than a fiercely competitive attitude.", "why": "attitude 前需 competitive 形容詞，fiercely 修飾程度。", "en": "Each competitor brought a model to the hall. The annual competition encouraged students to solve local problems. Judges valued original thinking more than a fiercely competitive attitude. One team's water filter made a useful contribution to the discussion. Its youngest contributor explained the design with surprising clarity.", "zh": "每位參賽者帶模型到會場。年度競賽鼓勵學生解決地方問題。評審重視原創思考，勝過強烈競爭態度。一隊濾水器對討論有實用貢獻。最年輕的貢獻者解說設計格外清楚。"}]}, {"word": "competitor", "meanings": ["參賽者"], "pos": ["N"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P121", "title": "地方科學競賽", "blank": 1, "level": 3, "type": "詞族混淆", "evidence": "Each competitor brought a model to the hall.", "why": "Each 後是帶模型的人，competitor；compete 是動詞。", "en": "Each competitor brought a model to the hall. The annual competition encouraged students to solve local problems. Judges valued original thinking more than a fiercely competitive attitude. One team's water filter made a useful contribution to the discussion. Its youngest contributor explained the design with surprising clarity.", "zh": "每位參賽者帶模型到會場。年度競賽鼓勵學生解決地方問題。評審重視原創思考，勝過強烈競爭態度。一隊濾水器對討論有實用貢獻。最年輕的貢獻者解說設計格外清楚。"}]}, {"word": "complement", "meanings": ["補充／相襯"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P120", "title": "展覽的文具清單", "blank": 4, "level": 2, "type": "字形相似", "evidence": "The organizer checked that the labels would complement the artwork rather than distract from it.", "why": "labels complement artwork 指相輔相成；compliment 表稱讚而非補充功能。", "en": "Before the art fair, the class bought pens and other stationery. The supply cart remained stationary while students unloaded it. Each student gave the organizer a description of a planned display. The organizer checked that the labels would complement the artwork rather than distract from it. She later offered a compliment on the team's careful preparation.", "zh": "美術展前，班上買筆與其他文具。學生卸貨時，推車保持不動。每人向主辦者描述預計展出內容。主辦者確認標籤能補充作品而非搶焦點，後來也稱讚團隊準備細心。"}]}, {"word": "complementary", "meanings": ["互補的"], "pos": ["Adj"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P110", "title": "口述故事的保存", "blank": 5, "level": 3, "type": "句間銜接", "evidence": "Together, the two formats offered complementary ways to explore the past.", "why": "搜尋文字和聽見聲音各補足不同需求，complementary；未提供互相矛盾證據。", "en": "The team recorded memories of a closed railway station. These interviews captured details missing from official records. The spoken material was then turned into written transcripts. This conversion made the stories easier to search. To preserve the speakers' voices as well, the archive also kept the original recordings. Together, the two formats offered complementary ways to explore the past.", "zh": "團隊錄下人們對已關閉車站的回憶。訪談捕捉官方紀錄缺少的細節，口述材料再轉成逐字稿。這種轉換讓故事更容易搜尋。為同時保留受訪者聲音，檔案館也留下原錄音。兩種格式提供互補的歷史探索方式。"}]}, {"word": "completed", "meanings": ["完成"], "pos": ["V-en"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P020", "title": "劇場復原", "blank": 3, "level": 3, "type": "時間線", "evidence": "By the time the doors reopened, the team had completed every safety check.", "why": "重開前檢查完成才符合敘述流程；postponed 只表示延後，與 every safety check 的完成線索不同。", "en": "The theater had been closed for a decade before volunteers began repairs. They first replaced the roof and then restored the seats. By the time the doors reopened, the team had completed every safety check.", "zh": "劇院在志工開始修繕前已關閉十年。他們先換屋頂，再修復座椅。大門重新開啟時，團隊已完成每項安全檢查。"}]}, {"word": "compliment", "meanings": ["稱讚"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P120", "title": "展覽的文具清單", "blank": 5, "level": 2, "type": "字形相似", "evidence": "She later offered a compliment on the team's careful preparation.", "why": "offer a compliment on 準備工作，是稱讚，不是和誰競爭。", "en": "Before the art fair, the class bought pens and other stationery. The supply cart remained stationary while students unloaded it. Each student gave the organizer a description of a planned display. The organizer checked that the labels would complement the artwork rather than distract from it. She later offered a compliment on the team's careful preparation.", "zh": "美術展前，班上買筆與其他文具。學生卸貨時，推車保持不動。每人向主辦者描述預計展出內容。主辦者確認標籤能補充作品而非搶焦點，後來也稱讚團隊準備細心。"}]}, {"word": "conclusion", "m
