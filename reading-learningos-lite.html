館員，得知本次只關一下午。照片真實，新脈絡卻使它誤導。團隊刊更正並附公告連結，避免指控個別學生蓄意不誠實，因為粗心分享不等於證明意圖。文章介紹查核程序：找來源、查日期、與當前資訊比對。後續調查發現部分讀者改變分享習慣。編輯肯定成果，卻不稱人人都如此，因只有小部分學生作答。文章因此平衡正面成果與清楚限制，主張描述自身成功和調查他人故事應用相同標準。準確是持續實踐，而非一次取得的徽章。"}]}, {"word": "own", "meanings": ["擁有"], "pos": ["V"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P028", "title": "修理文化", "blank": 3, "level": 3, "type": "全文主題", "evidence": "It challenges a culture of constant replacement and encourages people to value what they already own.", "why": "already own 指現有物品；文中兩例未建立向他人 borrow 的關係。", "en": "One neighbor fixes lamps; another repairs torn bags. Their skills differ, but both keep useful objects out of the trash. The shared principle is repair. It challenges a culture of constant replacement and encourages people to value what they already own.", "zh": "一位鄰居修燈，另一位補袋子。技能不同，卻都讓有用物品免於被丟棄。共同原則是修理。它挑戰不斷汰換的文化，鼓勵人們珍惜已擁有的東西。"}]}, {"word": "participant", "meanings": ["參與者"], "pos": ["N"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P049", "title": "科展參與者", "blank": 1, "level": 1, "type": "詞族混淆", "evidence": "Every participant in the science fair submitted a project.", "why": "Every 後指提交作品的人，要 participant。", "en": "Every participant in the science fair submitted a project. Their active participation made the event lively. Teachers hoped that even more students would participate the following year.", "zh": "每位科展參與者都提交作品。他們積極的參與讓活動熱鬧。老師希望明年有更多學生參加。"}]}, {"word": "participate", "meanings": ["參加"], "pos": ["V"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P049", "title": "科展參與者", "blank": 3, "level": 1, "type": "詞族混淆", "evidence": "Teachers hoped that even more students would participate the following year.", "why": "would 後要原形動詞 participate；participating 不合助動詞句型。", "en": "Every participant in the science fair submitted a project. Their active participation made the event lively. Teachers hoped that even more students would participate the following year.", "zh": "每位科展參與者都提交作品。他們積極的參與讓活動熱鬧。老師希望明年有更多學生參加。"}]}, {"word": "participation", "meanings": ["參與"], "pos": ["N"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P049", "title": "科展參與者", "blank": 2, "level": 1, "type": "詞族混淆", "evidence": "Their active participation made the event lively.", "why": "Their active 後指參與這件事，participation；不是參與者。", "en": "Every participant in the science fair submitted a project. Their active participation made the event lively. Teachers hoped that even more students would participate the following year.", "zh": "每位科展參與者都提交作品。他們積極的參與讓活動熱鬧。老師希望明年有更多學生參加。"}]}, {"word": "partly", "meanings": ["部分地"], "pos": ["Adv"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P043", "title": "仍待改善的市場", "blank": 1, "level": 3, "type": "全文一致", "evidence": "Its waste problem was therefore only partly solved.", "why": "餐盒仍在使用，不能說 completely solved，故 partly。", "en": "The market reduced plastic bags but still used disposable food boxes. Its waste problem was therefore only partly solved. The final paragraph calls for further action, keeping the conclusion consistent with the remaining challenge.", "zh": "市場減少塑膠袋，卻仍使用一次性餐盒。因此垃圾問題只解決一部分。末段要求進一步行動，讓結論與仍存在的挑戰保持一致。"}]}, {"word": "pattern", "meanings": ["模式"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P099", "title": "換文後再觀察", "blank": 1, "level": 5, "type": "尚待確認", "evidence": "This repeated pattern justified closer review, but not an automatic label.", "why": "again 與 repeated 表重複 pattern，但文中否定自動分類。", "en": "In a new passage, the learner again missed a contrast clue. This repeated pattern justified closer review, but not an automatic label. The teacher discussed the student's reasoning before confirming a category. If the evidence remained weak, the result stayed uncertain.", "zh": "在新文章中，學生再次漏看轉折線索。重複模式值得進一步檢視，但不宜自動貼標籤。老師先討論作答推理，再確認類別。若證據仍弱，結果維持不確定。"}]}, {"word": "pay", "meanings": ["付出／給予", "給予〔搭 attention〕"], "pos": ["V"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P055", "title": "做決定的時刻", "blank": 3, "level": 1, "type": "搭配判斷", "evidence": "They would also pay attention to warnings from local guides.", "why": "pay attention to 是注意；spend attention 不合慣用搭配。", "en": "The club had to make a decision about its trip. Members agreed to take responsibility for checking the weather. They would also pay attention to warnings from local guides.", "zh": "社團必須對旅行做決定。社員同意負責查天氣，也會注意當地嚮導的警告。"}, {"pid": "P080", "title": "提醒天氣", "blank": 1, "level": 3, "type": "中文直譯", "evidence": "The teacher told students to pay attention to the forecast.", "why": "pay attention 是注意的詞塊，不能逐字把「注意」拆成任意動詞。", "en": "The teacher told students to pay attention to the forecast. If a storm approached, they should seek shelter rather than stay under a tree. Following this advice could reduce the risk of injury.", "zh": "老師提醒學生注意天氣預報。若暴風雨接近，應尋找遮蔽處，不要留在樹下。遵循建議可降低受傷風險。"}]}, {"word": "penetrate", "meanings": ["滲入"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P091", "title": "替樹留空間", "blank": 2, "level": 2, "type": "語意判斷", "evidence": "Rain could then penetrate the exposed soil.", "why": "雨水進入土壤用 penetrate；evaporate 是變成氣體，不能在此接受詞 soil。", "en": "The roots needed room to spread, so workers removed several paving stones. Rain could then penetrate the exposed soil. The change helped the tree survive the dry season.", "zh": "樹根需要擴展空間，因此工人移除幾塊鋪面石。雨水因而能滲入露出的土壤。改變幫樹度過乾季存活。"}]}, {"word": "performer", "meanings": ["表演者"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P030", "title": "看不見的工作", "blank": 2, "level": 5, "type": "全文主題", "evidence": "Public attention may focus on one performer, but success relies on many people's contributions.", "why": "one performer 呼應前句 singer 與公眾焦點。", "en": "A concert depends on more than the singer. Technicians test microphones, cleaners prepare the hall, and ushers guide the audience. These examples highlight the importance of teamwork. Public attention may focus on one performer, but success relies on many people's contributions.", "zh": "演唱會不只靠歌手。技術人員測試麥克風，清潔人員整理場地，引導員帶觀眾入場。這些例子凸顯團隊合作的重要。大眾目光可能集中在一位表演者身上，成功卻仰賴許多人的貢獻。"}]}, {"word": "plan", "meanings": ["規劃／計畫"], "pos": ["V/N"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P054", "title": "預算與計畫", "blank": 1, "level": 3, "type": "詞性判斷", "evidence": "The group will plan a festival within a fixed budget.", "why": "will 後用原形動詞 plan。plan 在此作動詞。", "en": "The group will plan a festival within a fixed budget. Its final proposal must include a rain policy. Members also need to budget for equipment repairs instead of spending everything on decorations.", "zh": "團隊會在固定預算內規劃節慶。最後的計畫必須含雨天辦法。成員也需要編列設備維修預算，而非把錢全花在裝飾上。"}]}, {"word": "point", "meanings": ["重點／點"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P072", "title": "清楚的論點", "blank": 1, "level": 4, "type": "多義判斷", "evidence": "The speaker's main point was that convenience can create hidden waste.", "why": "main point 在演說中指論點，不是位置 spot。", "en": "The speaker's main point was that convenience can create hidden waste. To make it clear, she compared two lunch habits. The example gave her argument more weight than a list of slogans would have.", "zh": "講者重點是便利可能造成隱藏垃圾。為說清楚，她比較兩種午餐習慣。這個例子比一串口號更能增加論點分量。"}]}, {"word": "polite", "meanings": ["有禮貌的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P087", "title": "婉拒邀約", "blank": 2, "level": 4, "type": "語氣／含意", "evidence": "Her message is polite, yet it does not amount to a commitment to join the project.", "why": "緩和拒絕是 polite，沒有 hostile 證據。", "en": "Sara replied, \"I'd love to help, but my schedule is full this week.\" The phrase before but softens a refusal. Her message is polite, yet it does not amount to a commitment to join the project.", "zh": "莎拉回覆：「我很想幫忙，但我這週行程已滿。」but 前面的語句緩和拒絕。訊息很有禮貌，卻不等於承諾參與計畫。"}]}, {"word": "portable", "meanings": ["可攜帶的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P107", "title": "為夜讀設計的燈", "blank": 5, "level": 3, "type": "局部精確語意", "evidence": "A portable design meant she could carry it to the study room.", "why": "carry it to… 明確限定 portable，不能以一般正向形容詞替代。", "en": "Rui needed a lamp for a tiny shared room. Its arm had to be adjustable so she could direct light away from her roommate. A stable base would keep it from tipping over. She chose a model with a dimmer, which let her lower the brightness. It also used very little electricity, making it efficient. A portable design meant she could carry it to the study room.", "zh": "瑞需要適合狹小合住房間的燈。燈臂須可調整，才能讓光避開室友；穩固底座能避免傾倒。她選了有調光器的款式，可降低亮度。它耗電少，效率高；可攜式設計也讓她能帶到自習室。"}]}, {"word": "positive", "meanings": ["正面的"], "pos": ["Adj"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P129", "title": "漏水修好以後", "blank": 4, "level": 3, "type": "上下文方向", "evidence": "The manager viewed the result as positive.", "why": "減少浪費和支出為 positive；negative 無不利線索。", "en": "A hidden pipe had been wasting water for months. After repairs, daily consumption dropped. The monthly bill became lower, even though the number of residents stayed the same. This change reduced pressure on the building's budget. The manager viewed the result as positive. Still, she continued checking the meter so that another leak would not go unnoticed.", "zh": "暗管漏水數月。修好後日用水量下降，即使住戶數相同，月費也降低。改變減輕大樓預算壓力，管理者視為正面成果。她仍查水表，避免另一次漏水未被察覺。"}]}, {"word": "possibility", "meanings": ["可能性"], "pos": ["N"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P027", "title": "藥草試驗的措辭", "blank": 1, "level": 4, "type": "作用範圍", "evidence": "The word may expresses possibility, not certainty.", "why": "not certainty 明確對比可能性 possibility。", "en": "The report says the tea may help some people sleep. The word may expresses possibility, not certainty. Nor does some mean everyone. Readers should avoid turning a cautious statement into an absolute promise.", "zh": "報告說這種茶可能幫助部分人睡眠。may 表可能而非確定；some 也不表示每個人。讀者應避免把審慎陳述變成絕對承諾。"}]}, {"word": "possible", "meanings": ["可能的"], "pos": ["Adj"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P118", "title": "夜間足跡的限度", "blank": 4, "level": 4, "type": "推論", "evidence": "The investigator therefore described the fox as a possible source.", "why": "possible source 保留他因；exclusive 宣稱唯一來源超出證據。", "en": "Fresh tracks appeared near a pond after a snowy evening. A camera recorded a fox passing at midnight, but it did not cover the entire shore. The image establishes the fox's presence. It does not prove that the fox made all the tracks. Other animals may have used the area unobserved. The investigator therefore described the fox as a possible source. Identifying every footprint would require additional evidence.", "zh": "雪夜後，池邊有新足跡。攝影機拍到狐狸午夜經過，但未涵蓋整岸。影像確立狐狸曾在場，不能證明所有足跡都是牠留下。其他動物可能在未被觀察時使用該處。因此調查者稱狐狸為可能來源；辨認每個腳印仍需更多證據。"}]}, {"word": "postponed", "meanings": ["延後的"], "pos": ["V-en"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P111", "title": "候鳥追蹤器", "blank": 5, "level": 3, "type": "時間線", "evidence": "The full analysis was therefore postponed until autumn.", "why": "秋天才能取得完整裝置資料，分析 postponed。", "en": "In March, scientists attached trackers to several birds. Three weeks later, the birds began their northward journey. By the time they reached the wetlands, they had crossed two mountain ranges. Researchers compared the new route with data collected the previous year. Only after the birds returned did the team recover the devices. The full analysis was therefore postponed until autumn.", "zh": "三月，科學家替幾隻鳥裝追蹤器。三週後，鳥開始北遷。到濕地時，牠們已越過兩條山脈。研究者拿新路線與前一年資料比較。直到鳥返回後，團隊才收回裝置，因此完整分析延到秋天。"}]}, {"word": "potential", "meanings": ["潛力"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P039", "title": "新工具的期待", "blank": 2, "level": 5, "type": "作者態度", "evidence": "She welcomes the tool's potential without treating it as a complete substitute for human judgment.", "why": "未來可能幫助是 potential，不是保證效益的 certainty。", "en": "The columnist believes the translation tool could help travelers. Yet she warns that errors remain common in sensitive conversations. Her position is cautiously positive. She welcomes the tool's potential without treating it as a complete substitute for human judgment.", "zh": "專欄作家認為翻譯工具可能幫助旅人，但警告在敏感對話中仍常出錯。她的態度是審慎樂觀，肯定工具潛力，卻不把它視為完全替代人類判斷的東西。"}]}, {"word": "powerful", "meanings": ["有力量的"], "pos": ["Adj"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P117", "title": "一篇有保留的展覽評論", "blank": 1, "level": 4, "type": "作者態度", "evidence": "She called the photographs powerful while describing the captions as incomplete.", "why": "admired 與照片稱讚支持 powerful；不是把所有元素都貶低。", "en": "The critic admired the exhibition's ambitious topic but questioned its lack of local voices. She called the photographs powerful while describing the captions as incomplete. Her response was therefore mixed, not wholly negative. The word \"ambitious\" did not signal unconditional approval. Instead, she urged the museum to include more perspectives. Her criticism expressed a desire for improvement, rather than a demand to close the show.", "zh": "評論者欣賞展覽題目有企圖心，卻質疑缺乏地方聲音。她稱照片有力量，但說圖說不完整。因此態度是褒貶並存，不是全然負面。「有企圖心」不代表無條件贊同。她要求納入更多觀點，批評意在改進而非關展。"}]}, {"word": "practical", "meanings": ["實用的"], "pos": ["Adj"], "tags": ["POS", "Semantics", "Global", "Grammar", "Collocation", "Logic", "Cohesion"], "examples": [{"pid": "P002", "title": "修復舊腳踏車", "blank": 1, "level": 2, "type": "詞形", "evidence": "Its members developed practical skills by fixing old bicycles.", "why": "skills 前要能形容技能的 practical；practice skills 會變成「練習技能」，不合本句所述。", "en": "A repair club opened after school. Its members developed practical skills by fixing old bicycles. They worked carefully to check each brake. The project also increased their confidence in solving unfamiliar problems.", "zh": "課後成立了修車社。社員透過修理舊腳踏車培養實用技能，仔細檢查每個煞車。這項計畫也增強他們解決陌生問題的信心。"}, {"pid": "P101", "title": "工具圖書館的考驗", "blank": 1, "level": 5, "type": "文章組織", "evidence": "The idea seemed practical: most people needed a drill only a few times a year.", "why": "一年只用數次的工具適合共享，practical。", "en": "A neighborhood library began lending tools as well as books. The idea seemed practical: most people needed a drill only a few times a year. Sharing could reduce both household spending and unnecessary purchases. At first, however, the staff focused mainly on collecting equipment. They soon discovered that ownership was only one part of the problem. Borrowers needed clear instructions, and returned tools required inspection. One damaged cable could make the next loan unsafe. To address these concerns, the library trained volunteers and introduced a checklist. Each item was checked before it went back onto the shelf. The system also recorded late returns, but the director warned against treating every delay as carelessness. Illness or transport problems could be involved. Instead of imposing the same response in every case, staff considered the circumstances. Six months later, the service had many regular users. That popularity was encouraging, although it did not by itself prove that the project saved resources overall. The library still needed to compare the costs of repair and transport with the purchases it had replaced. Its experience showed that a generous idea becomes sustainable through careful management.", "zh": "社區圖書館除了書也開始借工具。想法看來實用：多數人一年只用幾次電鑽。共享能減少家庭支出與不必要購買。但員工起初主要忙著收集設備，很快發現有工具只是問題的一部分。借用者需要清楚說明，歸還工具需要檢查；一條損壞電線就可能讓下一次借用不安全。圖書館為處理疑慮培訓志工並設清單。每件物品回架前都先檢查。系統也記錄晚還，但館長提醒不能把每次延誤都當粗心，可能涉及疾病或交通問題。員工考量個別情況，而非一律回應。半年後，服務已有許多固定使用者，令人鼓舞，但受歡迎本身並不能證明整體省資源。仍需比較維修、運輸成本和取代的購買。經驗顯示，慷慨構想需靠細心管理才能持續。"}]}, {"word": "practice", "meanings": ["實踐"], "pos": ["N"], "tags": ["Logic", "Semantics", "Grammar", "Collocation", "Cohesion", "Global", "POS"], "examples": [{"pid": "P104", "title": "校園新聞的查證", "blank": 10, "level": 5, "type": "作用範圍", "evidence": "Accuracy is a continuing practice, not a badge earned once.", "why": "continuing practice 對比一次徽章，表持續行動。", "en": "An image of a locked gate spread through the school chat group. Its caption claimed that the library would close permanently. Many students forwarded it before checking the date. The student newspaper decided to verify the message. First, reporters located the original image. It had been taken during repairs two years earlier. Next, they contacted the librarian, who explained that the current closure would last only one afternoon. The image itself was real, but its new context made it misleading. The team published a correction and included links to the relevant notices. They avoided accusing individual students of deliberate dishonesty because careless sharing did not prove intent. Instead, the article described a simple checking procedure: locate the source, inspect the date, and compare the claim with current information. A follow-up survey found that some readers had changed their sharing habits. The editors welcomed this response but did not call it universal. Only a fraction of students had answered. The final article therefore balanced a positive outcome with a clear statement of its limits. Responsible reporting, it argued, requires the same standards when describing one's own success as when investigating someone else's story. Accuracy is a continuing practice, not a badge earned once.", "zh": "一張上鎖校門照片在校群傳播，圖說宣稱圖書館永久關閉。許多人未查日期便轉傳。校刊決定查證，先找原圖，發現拍於兩年前修繕期間；再聯絡館員，得知本次只關一下午。照片真實，新脈絡卻使它誤導。團隊刊更正並附公告連結，避免指控個別學生蓄意不誠實，因為粗心分享不等於證明意圖。文章介紹查核程序：找來源、查日期、與當前資訊比對。後續調查發現部分讀者改變分享習慣。編輯肯定成果，卻不稱人人都如此，因只有小部分學生作答。文章因此平衡正面成果與清楚限制，主張描述自身成功和調查他人故事應用相同標準。準確是持續實踐，而非一次取得的徽章。"}, {"pid": "P131", "title": "把中文想法換成英文", "blank": 5, "level": 3, "type": "中文直譯", "evidence": "Their teacher reminded them that helping the community meant putting ideas into practice, not merely discussing them.", "why": "put ideas into practice 為付諸實踐；後面 not merely discussing 排除 discussion。", "en": "To prepare the charity sale, students had to make arrangements with local shops. They wanted to give people a hand without creating extra waste. One shop agreed to offer reusable bags at cost. Students would also take care of the tables after the event. Their teacher reminded them that helping the community meant putting ideas into practice, not merely discussing them.", "zh": "學生為準備義賣，需與店家協調安排，希望幫助人又不增加垃圾。一家店同意以成本價供應可重用袋。學生也會在活動後整理照管桌子。老師提醒幫助社區是把想法付諸實踐，不只是討論。"}]}, {"word": "praise", "meanings": ["稱讚"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P085", "title": "客氣的保留", "blank": 1, "level": 2, "type": "語氣／含意", "evidence": "His selective praise may imply a reservation.", "why": "lovely 是 praise，表面不是 criticism；保留是語用推測，故 may。", "en": "Asked whether he liked the film, Jun said, \"The scenery was lovely.\" He said nothing about the acting or story. His selective praise may imply a reservation. It should not automatically be read as an enthusiastic endorsement of the whole film.", "zh": "被問是否喜歡電影時，俊說：「景色很漂亮。」他沒提演技或故事。選擇性稱讚可能暗示保留，不應自動解作對整部電影的熱烈肯定。"}, {"pid": "P133", "title": "一句話裡的保留", "blank": 2, "level": 4, "type": "語氣／含意", "evidence": "Her first remark was not necessarily straightforward praise.", "why": "not necessarily praise 保留是否真在稱讚的判斷。", "en": "After reading a long proposal, the manager said, \"It is certainly detailed.\" She then asked whether the main idea could be expressed more briefly. Her first remark was not necessarily straightforward praise. In context, it hinted that the proposal might be too lengthy. The request for a shorter version made the implication clearer. A reader should therefore consider the whole exchange before deciding on the speaker's attitude.", "zh": "經理看完長提案說：「確實很詳細。」隨後問主旨能否更簡短表達。首句未必是單純稱讚，語境暗示提案可能過長。要求縮短使暗示更清楚。因此須讀完整互動才能判斷態度。"}]}, {"word": "precise", "meanings": ["精確的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P126", "title": "報名人數的變化", "blank": 4, "level": 3, "type": "近義詞混淆", "evidence": "This distinction made their evaluation more precise.", "why": "分清總到場與付費使評估 precise；countless 不能描述評估精確程度。", "en": "The festival attracted a large number of visitors, but ticket sales were lower than expected. Many people came only to the free outdoor events. The organizers needed to distinguish attendance from paid participation. They could estimate total crowds from photographs, but sales records gave an exact count of tickets. This distinction made their evaluation more precise. A popular event was not necessarily a profitable one.", "zh": "節慶吸引很多人，票房卻比預期低。許多人只參加免費戶外活動。主辦方需區分到場和付費參與。照片可估計總人數，售票紀錄則有精確票數。區分使評估更精準；活動熱門不一定獲利。"}]}, {"word": "preference", "meanings": ["偏好"], "pos": ["N"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P113", "title": "閱讀調查的限定詞", "blank": 4, "level": 4, "type": "作用範圍", "evidence": "The report carefully separated a general preference from an absolute rule.", "why": "preferred 對應 preference，非絕對禁止其他形式。", "en": "The survey reached only students who used the school library. Its findings therefore describe a subset of the school population. They cannot represent everyone. Some respondents preferred paper books, but that does not mean they never read on screens. The report carefully separated a general preference from an absolute rule. Its conclusion remained limited to the group actually surveyed.", "zh": "調查只接觸使用圖書館的學生，因此發現描述的是全校群體中的子群，不能代表所有人。部分受訪者偏好紙本，卻不表示從不看螢幕。報告區分一般偏好和絕對規則，結論限於實際受訪群體。"}]}, {"word": "presence", "meanings": ["在場"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P118", "title": "夜間足跡的限度", "blank": 1, "level": 4, "type": "推論", "evidence": "The image establishes the fox's presence.", "why": "影像證明 presence，不能說 absence。", "en": "Fresh tracks appeared near a pond after a snowy evening. A camera recorded a fox passing at midnight, but it did not cover the entire shore. The image establishes the fox's presence. It does not prove that the fox made all the tracks. Other animals may have used the area unobserved. The investigator therefore described the fox as a possible source. Identifying every footprint would require additional evidence.", "zh": "雪夜後，池邊有新足跡。攝影機拍到狐狸午夜經過，但未涵蓋整岸。影像確立狐狸曾在場，不能證明所有足跡都是牠留下。其他動物可能在未被觀察時使用該處。因此調查者稱狐狸為可能來源；辨認每個腳印仍需更多證據。"}]}, {"word": "present", "meanings": ["現在"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P017", "title": "從訪談到展覽", "blank": 3, "level": 3, "type": "句間銜接", "evidence": "Visitors could then compare the past with the present.", "why": "訪談呈現街道「已經如何改變」，比較 past 與 present；未提供未來預測。", "en": "The class interviewed older residents about local shops. These accounts revealed how the street had changed. Drawing on the stories, students prepared an exhibition. Visitors could then compare the past with the present.", "zh": "班上訪問年長居民，詢問當地店家。這些敘述呈現街道的變化。學生根據故事籌備展覽，讓參觀者比較過去與現在。"}]}, {"word": "preserve", "meanings": ["保留"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P135", "title": "讓舊衣延長壽命", "blank": 3, "level": 3, "type": "語意判斷", "evidence": "Replacing only the damaged layer would preserve the coat's useful parts.", "why": "只換損壞部分是 preserve 可用部分；destroy 相反。", "en": "A tailor examined the coat before deciding how to repair it. The lining was torn, but the outer fabric remained intact. Replacing only the damaged layer would preserve the coat's useful parts. The customer agreed because she wanted to extend its life. The work turned a possible discard into a usable garment.", "zh": "裁縫檢查外套再決定如何修補。內裡破了，但外層布仍完整。只換壞層可保留可用部分。顧客同意，因她想延長衣服壽命。修補讓原本可能被丟的衣物重新可穿。"}]}, {"word": "prevent", "meanings": ["防止"], "pos": ["V"], "tags": ["Semantics", "Global", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P092", "title": "找回聲音", "blank": 3, "level": 3, "type": "語意判斷", "evidence": "Clear communication helped prevent confusion during the evacuation drill.", "why": "clear communication 減少混亂，prevent；create 方向相反。", "en": "After the loudspeaker failed, the guide used a portable amplifier to project her voice. People at the back could finally understand the instructions. Clear communication helped prevent confusion during the evacuation drill.", "zh": "擴音設備故障後，嚮導用攜帶式擴音器把聲音傳遠。後方的人終於聽懂指示。清楚溝通有助防止疏散演練中的混亂。"}, {"pid": "P100", "title": "一條河的兩種任務", "blank": 1, "level": 5, "type": "全文一致", "evidence": "Engineers had designed it to prevent flooding, and many residents considered it a success.", "why": "防洪是渠道原始目的，prevent flooding。", "en": "For decades, a concrete channel carried rainwater quickly through the town. Engineers had designed it to prevent flooding, and many residents considered it a success. Yet its steep walls left little room for plants or animals. When the town proposed a redesign, the debate was not simply about beauty. It concerned how one place could serve multiple purposes. The new plan kept a deep central channel but added planted shelves along the sides. These features created habitats without blocking the main flow. Some residents remained skeptical, fearing that vegetation would slow the water. The team therefore ran tests before construction. The results suggested that the design could work under ordinary conditions; they did not guarantee safety in every possible storm. Officials described the evidence as promising, rather than final. After the first section opened, volunteers began to record water levels and wildlife sightings. Their observations would guide later adjustments. The project thus treated restoration as an ongoing process, not a single finished event. Its broader lesson was that public spaces require both careful design and continued attention.", "zh": "數十年來，水泥渠道讓雨水快速流過小鎮。工程師原先設計它是為防洪，许多居民認為很成功。但陡峭壁面使動植物幾乎無處生存。小鎮提出改造時，辯論不只關乎美觀，更涉及同一空間如何兼顧多項用途。新計畫保留深中央水道，在兩側增植栽平台。這些設計創造棲地，又不阻擋主流。部分居民仍懷疑，擔心植被減慢水流。因此團隊施工前先測試。結果暗示設計在一般條件下可行，卻不保證每場可能的暴雨都安全。官員稱證據有希望，而非已定論。首段開放後，志工開始記錄水位與野生動物。觀察將引導後續調整。修復因此是持續過程，而非一次完成的事件。更廣泛的啟示是公共空間既需周密設計，也需持續關注。"}]}, {"word": "prevented", "meanings": ["阻止／使無法"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P063", "title": "山路警告", "blank": 2, "level": 3, "type": "句型判斷", "evidence": "Thick fog prevented them from seeing the cliff edge.", "why": "prevented 人 from V-ing；avoided them from seeing 不成立。", "en": "The ranger warned hikers not to leave the marked path. Thick fog prevented them from seeing the cliff edge. Rather than continuing, they decided to wait at a shelter.", "zh": "巡山員警告健行者不要離開標示路徑。濃霧使他們看不見懸崖邊緣。他們決定在避難處等候，不再前進。"}]}, {"word": "previous", "meanings": ["前一個的"], "pos": ["Adj"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P111", "title": "候鳥追蹤器", "blank": 3, "level": 3, "type": "時間線", "evidence": "Researchers compared the new route with data collected the previous year.", "why": "已收集的舊年度資料為 previous year；following year 尚未到。", "en": "In March, scientists attached trackers to several birds. Three weeks later, the birds began their northward journey. By the time they reached the wetlands, they had crossed two mountain ranges. Researchers compared the new route with data collected the previous year. Only after the birds returned did the team recover the devices. The full analysis was therefore postponed until autumn.", "zh": "三月，科學家替幾隻鳥裝追蹤器。三週後，鳥開始北遷。到濕地時，牠們已越過兩條山脈。研究者拿新路線與前一年資料比較。直到鳥返回後，團隊才收回裝置，因此完整分析延到秋天。"}]}, {"word": "principal", "meanings": ["校長"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P048", "title": "校長的原則", "blank": 1, "level": 3, "type": "字形相似", "evidence": "The principal announced a new recycling rule.", "why": "announced 的人物主詞為 principal；principle 不是校長。", "en": "The principal announced a new recycling rule. Its central principle was simple: use fewer materials before worrying about disposal. The school would begin with reusable lunch containers.", "zh": "校長宣布新的回收規定。核心原則很簡單：在煩惱如何丟棄之前，先減少材料使用。學校將從可重複使用的午餐容器開始。"}]}, {"word": "principle", "meanings": ["原則"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P048", "title": "校長的原則", "blank": 2, "level": 3, "type": "字形相似", "evidence": "Its central principle was simple: use fewer materials before worrying about disposal.", "why": "central principle 是核心原則；同音字不可互換。", "en": "The principal announced a new recycling rule. Its central principle was simple: use fewer materials before worrying about disposal. The school would begin with reusable lunch containers.", "zh": "校長宣布新的回收規定。核心原則很簡單：在煩惱如何丟棄之前，先減少材料使用。學校將從可重複使用的午餐容器開始。"}]}, {"word": "problem", "meanings": ["問題"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P016", "title": "失物招領牆", "blank": 1, "level": 2, "type": "句間銜接", "evidence": "To address this problem, the office created a photo wall of lost items.", "why": "this problem 承接遺留雨傘；solution 是照片牆，尚未在前句提出。", "en": "Students often left umbrellas in classrooms. To address this problem, the office created a photo wall of lost items. The new system let owners identify their belongings before visiting the office. Within a month, most umbrellas had been returned.", "zh": "學生常把傘留在教室。為處理這個問題，辦公室設立失物照片牆。新制度讓失主先辨認物品再到辦公室。一個月內，大多數雨傘已歸還。"}]}, {"word": "procedure", "meanings": ["程序"], "pos": ["N"], "tags": ["Logic", "Semantics", "Grammar", "Collocation", "Cohesion", "Global", "POS"], "examples": [{"pid": "P104", "title": "校園新聞的查證", "blank": 6, "level": 5, "type": "作用範圍", "evidence": "Instead, the article described a simple checking procedure: locate the source, inspect the date, and compare the claim with current information.", "why": "冒號後列操作順序，procedure。", "en": "An image of a locked gate spread through the school chat group. Its caption claimed that the library would close permanently. Many students forwarded it before checking the date. The student newspaper decided to verify the message. First, reporters located the original image. It had been taken during repairs two years earlier. Next, they contacted the librarian, who explained that the current closure would last only one afternoon. The image itself was real, but its new context made it misleading. The team published a correction and included links to the relevant notices. They avoided accusing individual students of deliberate dishonesty because careless sharing did not prove intent. Instead, the article described a simple checking procedure: locate the source, inspect the date, and compare the claim with current information. A follow-up survey found that some readers had changed their sharing habits. The editors welcomed this response but did not call it universal. Only a fraction of students had answered. The final article therefore balanced a positive outcome with a clear statement of its limits. Responsible reporting, it argued, requires the same standards when describing one's own success as when investigating someone else's story. Accuracy is a continuing practice, not a badge earned once.", "zh": "一張上鎖校門照片在校群傳播，圖說宣稱圖書館永久關閉。許多人未查日期便轉傳。校刊決定查證，先找原圖，發現拍於兩年前修繕期間；再聯絡館員，得知本次只關一下午。照片真實，新脈絡卻使它誤導。團隊刊更正並附公告連結，避免指控個別學生蓄意不誠實，因為粗心分享不等於證明意圖。文章介紹查核程序：找來源、查日期、與當前資訊比對。後續調查發現部分讀者改變分享習慣。編輯肯定成果，卻不稱人人都如此，因只有小部分學生作答。文章因此平衡正面成果與清楚限制，主張描述自身成功和調查他人故事應用相同標準。準確是持續實踐，而非一次取得的徽章。"}]}, {"word": "process", "meanings": ["過程"], "pos": ["N"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P100", "title": "一條河的兩種任務", "blank": 9, "level": 5, "type": "全文一致", "evidence": "The project thus treated restoration as an ongoing process, not a single finished event.", "why": "ongoing 與非一次完成呼應 process。", "en": "For decades, a concrete channel carried rainwater quickly through the town. Engineers had designed it to prevent flooding, and many residents considered it a success. Yet its steep walls left little room for plants or animals. When the town proposed a redesign, the debate was not simply about beauty. It concerned how one place could serve multiple purposes. The new plan kept a deep central channel but added planted shelves along the sides. These features created habitats without blocking the main flow. Some residents remained skeptical, fearing that vegetation would slow the water. The team therefore ran tests before construction. The results suggested that the design could work under ordinary conditions; they did not guarantee safety in every possible storm. Officials described the evidence as promising, rather than final. After the first section opened, volunteers began to record water levels and wildlife sightings. Their observations would guide later adjustments. The project thus treated restoration as an ongoing process, not a single finished event. Its broader lesson was that public spaces require both careful design and continued attention.", "zh": "數十年來，水泥渠道讓雨水快速流過小鎮。工程師原先設計它是為防洪，许多居民認為很成功。但陡峭壁面使動植物幾乎無處生存。小鎮提出改造時，辯論不只關乎美觀，更涉及同一空間如何兼顧多項用途。新計畫保留深中央水道，在兩側增植栽平台。這些設計創造棲地，又不阻擋主流。部分居民仍懷疑，擔心植被減慢水流。因此團隊施工前先測試。結果暗示設計在一般條件下可行，卻不保證每場可能的暴雨都安全。官員稱證據有希望，而非已定論。首段開放後，志工開始記錄水位與野生動物。觀察將引導後續調整。修復因此是持續過程，而非一次完成的事件。更廣泛的啟示是公共空間既需周密設計，也需持續關注。"}]}, {"word": "processed", "meanings": ["處理"], "pos": ["V-en"], "tags": ["Semantics"], "examples": [{"pid": "P082", "title": "正式申請", "blank": 2, "level": 2, "type": "語域不合", "evidence": "Incomplete applications will not be processed.", "why": "applications processed 為行政處理。", "en": "The notice asks applicants to submit all documents by Friday. Incomplete applications will not be processed. Anyone needing assistance should contact the office during business hours.", "zh": "通知要求申請者週五前提交所有文件。不完整的申請不予處理。需要協助者請在辦公時間聯絡辦公室。"}]}, {"word": "production", "meanings": ["生產／產量"], "pos": ["N"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P051", "title": "高效率農園", "blank": 1, "level": 3, "type": "詞族混淆", "evidence": "The farm increased its production of tomatoes without adding land.", "why": "its production of tomatoes 表生產量；producer 指人或組織。", "en": "The farm increased its production of tomatoes without adding land. Better irrigation made workers more productive. The resulting gain in productivity meant that each hour of labor yielded more food.", "zh": "農場沒有增加土地，卻提高番茄產量。更好的灌溉讓工作者更有效率。生產力的提升表示每一工時能產出更多食物。"}]}, {"word": "productive", "meanings": ["有生產效率的"], "pos": ["Adj"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P051", "title": "高效率農園", "blank": 2, "level": 3, "type": "詞族混淆", "evidence": "Better irrigation made workers more productive.", "why": "made workers more productive，受詞後補語要形容工作者特性。", "en": "The farm increased its production of tomatoes without adding land. Better irrigation made workers more productive. The resulting gain in productivity meant that each hour of labor yielded more food.", "zh": "農場沒有增加土地，卻提高番茄產量。更好的灌溉讓工作者更有效率。生產力的提升表示每一工時能產出更多食物。"}]}, {"word": "productivity", "meanings": ["生產力"], "pos": ["N"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P051", "title": "高效率農園", "blank": 3, "level": 3, "type": "詞族混淆", "evidence": "The resulting gain in productivity meant that each hour of labor yielded more food.", "why": "each hour…more food 明確定義投入產出效率 productivity，不是單一 product。", "en": "The farm increased its production of tomatoes without adding land. Better irrigation made workers more productive. The resulting gain in productivity meant that each hour of labor yielded more food.", "zh": "農場沒有增加土地，卻提高番茄產量。更好的灌溉讓工作者更有效率。生產力的提升表示每一工時能產出更多食物。"}]}, {"word": "professional", "meanings": ["專業的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P132", "title": "給投稿者的正式回信", "blank": 5, "level": 3, "type": "語域不合", "evidence": "Its language was courteous and professional, matching a formal exchange between an editor and an author.", "why": "formal exchange 對應 professional；slangy 與描述的語域衝突。", "en": "The journal thanked the writer for her submission. It explained that the article would undergo editorial review. The message asked her to provide a short biography and to retain a copy of the original file. Its language was courteous and professional, matching a formal exchange between an editor and an author.", "zh": "期刊感謝作者投稿，說明文章將經編輯審閱。訊息請她提供簡歷並保留原檔副本。用語禮貌專業，符合編輯與作者的正式往來。"}]}, {"word": "progress", "meanings": ["進展", "進步"], "pos": ["N"], "tags": ["Global", "Semantics", "POS"], "examples": [{"pid": "P045", "title": "失敗後的突破", "blank": 1, "level": 5, "type": "全文一致", "evidence": "A summary claiming that the team made no progress would contradict the account.", "why": "由失敗到成功是 progress；不能用 no progress 概括。", "en": "Early tests of the boat failed because its frame was too heavy. Engineers then reduced its weight, and the final trial succeeded. A summary claiming that the team made no progress would contradict the account. The ending should acknowledge both the initial setback and the eventual success.", "zh": "船隻早期測試因框架太重而失敗。工程師之後減重，最後試驗成功。若摘要宣稱團隊毫無進展，就會與敘事矛盾。結尾應同時承認最初的挫敗與最終成功。"}, {"pid": "P053", "title": "相互支持", "blank": 3, "level": 2, "type": "詞性判斷", "evidence": "The school measures the program's success through reading progress, not the number of meetings alone.", "why": "through reading progress 需要名詞；progressive 是形容詞且不能表示閱讀成果。", "en": "Older students support younger readers during weekly meetings. This assistance makes difficult books less frightening. The school measures the program's success through reading progress, not the number of meetings alone.", "zh": "高年級學生在每週聚會中支持年幼讀者。這份支持讓難書不再那麼可怕。學校以閱讀進步衡量成效，不單看聚會次數。"}]}, {"word": "project", "meanings": ["傳送／投射"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P092", "title": "找回聲音", "blank": 1, "level": 3, "type": "語意判斷", "evidence": "After the loudspeaker failed, the guide used a portable amplifier to project her voice.", "why": "amplifier 用來 project voice，使聲音傳遠；swallow voice 不合此事件目的。", "en": "After the loudspeaker failed, the guide used a portable amplifier to project her voice. People at the back could finally understand the instructions. Clear communication helped prevent confusion during the evacuation drill.", "zh": "擴音設備故障後，嚮導用攜帶式擴音器把聲音傳遠。後方的人終於聽懂指示。清楚溝通有助防止疏散演練中的混亂。"}]}, {"word": "promising", "meanings": ["有希望的"], "pos": ["Adj"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P100", "title": "一條河的兩種任務", "blank": 6, "level": 5, "type": "全文一致", "evidence": "Officials described the evidence as promising, rather than final.", "why": "rather than final 表有希望但未定論，promising。", "en": "For decades, a concrete channel carried rainwater quickly through the town. Engineers had designed it to prevent flooding, and many residents considered it a success. Yet its steep walls left little room for plants or animals. When the town proposed a redesign, the debate was not simply about beauty. It concerned how one place could serve multiple purposes. The new plan kept a deep central channel but added planted shelves along the sides. These features created habitats without blocking the main flow. Some residents remained skeptical, fearing that vegetation would slow the water. The team therefore ran tests before construction. The results suggested that the design could work under ordinary conditions; they did not guarantee safety in every possible storm. Officials described the evidence as promising, rather than final. After the first section opened, volunteers began to record water levels and wildlife sightings. Their observations would guide later adjustments. The project thus treated restoration as an ongoing process, not a single finished event. Its broader lesson was that public spaces require both careful design and continued attention.", "zh": "數十年來，水泥渠道讓雨水快速流過小鎮。工程師原先設計它是為防洪，许多居民認為很成功。但陡峭壁面使動植物幾乎無處生存。小鎮提出改造時，辯論不只關乎美觀，更涉及同一空間如何兼顧多項用途。新計畫保留深中央水道，在兩側增植栽平台。這些設計創造棲地，又不阻擋主流。部分居民仍懷疑，擔心植被減慢水流。因此團隊施工前先測試。結果暗示設計在一般條件下可行，卻不保證每場可能的暴雨都安全。官員稱證據有希望，而非已定論。首段開放後，志工開始記錄水位與野生動物。觀察將引導後續調整。修復因此是持續過程，而非一次完成的事件。更廣泛的啟示是公共空間既需周密設計，也需持續關注。"}]}, {"word": "proposal", "meanings": ["提案"], "pos": ["N"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P054", "title": "預算與計畫", "blank": 2, "level": 3, "type": "詞性判斷", "evidence": "Its final proposal must include a rain policy.", "why": "Its final proposal 需要名詞核心；planned 是分詞，不能單獨表示提案。", "en": "The group will plan a festival within a fixed budget. Its final proposal must include a rain policy. Members also need to budget for equipment repairs instead of spending everything on decorations.", "zh": "團隊會在固定預算內規劃節慶。最後的計畫必須含雨天辦法。成員也需要編列設備維修預算，而非把錢全花在裝飾上。"}]}, {"word": "protect", "meanings": ["保護"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P061", "title": "參觀規則", "blank": 3, "level": 1, "type": "句型判斷", "evidence": "These rules help protect the collection while keeping the visit enjoyable.", "why": "help protect the collection 是保護館藏；help 後可接原形動詞。", "en": "The museum allows visitors to take photographs without flash. It asks them to avoid touching fragile objects. These rules help protect the collection while keeping the visit enjoyable.", "zh": "博物館允許遊客不用閃光燈拍照，並請大家避免觸摸脆弱物品。規則既保護館藏，也維持參觀樂趣。"}]}, {"word": "provide", "meanings": ["提供"], "pos": ["V"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P056", "title": "災後援助", "blank": 2, "level": 2, "type": "搭配判斷", "evidence": "Local shops agreed to provide supplies, while students helped raise funds.", "why": "provide supplies 是提供物資，和商店角色相合。", "en": "Volunteers worked to meet the urgent needs of displaced families. Local shops agreed to provide supplies, while students helped raise funds. Together, these efforts made the relief center possible.", "zh": "志工努力滿足流離失所家庭的迫切需求。當地商店同意提供物資，學生則協助募款。這些努力共同促成救助中心成立。"}, {"pid": "P132", "title": "給投稿者的正式回信", "blank": 3, "level": 3, "type": "語域不合", "evidence": "The message asked her to provide a short biography and to retain a copy of the original file.", "why": "provide biography 是禮貌正式的提供要求。", "en": "The journal thanked the writer for her submission. It explained that the article would undergo editorial review. The message asked her to provide a short biography and to retain a copy of the original file. Its language was courteous and professional, matching a formal exchange between an editor and an author.", "zh": "期刊感謝作者投稿，說明文章將經編輯審閱。訊息請她提供簡歷並保留原檔副本。用語禮貌專業，符合編輯與作者的正式往來。"}]}, {"word": "provided", "meanings": ["提供了"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P106", "title": "走廊的溫度地圖", "blank": 4, "level": 3, "type": "文法骨架", "evidence": "Trees planted near the west wall provided shade in the afternoon.", "why": "Trees 後 planted… 是被動修飾，provided 才是主要動詞。", "en": "The students, equipped with handheld sensors, measured temperatures around the school. A map of the readings revealed several hot spots. The corridor beside the kitchen, despite its open windows, was warmer than expected. Trees planted near the west wall provided shade in the afternoon. These observations, together with maintenance records, helped the principal decide where to add fans.", "zh": "學生帶著手持感測器測量校園溫度。讀值地圖顯示數個熱點。廚房旁走廊雖開著窗，仍比預期熱。西牆旁種的樹在午後提供遮蔭。這些觀察和維護紀錄協助校長決定增設風扇的位置。"}]}, {"word": "provides", "meanings": ["提供"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P094", "title": "關係子句的線索", "blank": 3, "level": 1, "type": "句法判斷", "evidence": "Although narrow, it provides a safe crossing during the rainy season.", "why": "it 是主詞，Although narrow 為讓步省略結構，provides 完成主句。", "en": "The bridge, which was built by local workers, links two villages. People living on either side use it daily. Although narrow, it provides a safe crossing during the rainy season.", "zh": "這座由當地工人興建的橋連接兩個村莊。住兩側的人每天使用。橋雖窄，卻在雨季提供安全通道。"}]}, {"word": "provisional", "meanings": ["暫定的"], "pos": ["Adj"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P137", "title": "兩次錯誤之間", "blank": 4, "level": 4, "type": "尚待確認", "evidence": "When the cause remained unclear, she kept the diagnosis provisional.", "why": "cause unclear 應 provisional；permanent 過度確定。", "en": "A learner missed a grammar clue on Monday and a similar clue on Friday. The repetition deserved attention, but the teacher still asked how each answer had been chosen. One error came from a hurried guess; the other involved a misunderstood sentence. The explanations were not identical. The teacher recorded the evidence before making a classification. When the cause remained unclear, she kept the diagnosis provisional. Another unfamiliar passage would provide an opportunity for verification.", "zh": "學生週一漏看文法線索，週五又漏看相似線索。重複值得注意，但老師仍問每次如何作答。一錯來自急著猜，另一錯是誤解句子，理由不相同。老師先記錄證據再分類。原因未明時，診斷保持暫定；另一篇陌生文章提供驗證機會。"}]}, {"word": "punctual", "meanings": ["準時的"], "pos": ["Adj"], "tags": ["Semantics"], "examples": [{"pid": "P086", "title": "引號中的準時", "blank": 1, "level": 3, "type": "語氣／含意", "evidence": "\"Perfectly punctual, as usual,\" a passenger muttered.", "why": "late 與 perfectly punctual 相反才構成後句說的反諷；delayed 就是字面描述。", "en": "The bus arrived forty minutes late. \"Perfectly punctual, as usual,\" a passenger muttered. The mismatch between words and events signals irony. The remark expresses frustration, not genuine approval.", "zh": "公車晚了四十分鐘。一位乘客低聲說：「一如往常，真準時。」言語與事件的落差表示反諷。這話表達挫折與不滿，而非真心贊同。"}]}, {"word": "purpose", "meanings": ["用途"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P023", "title": "街角飲水站", "blank": 2, "level": 3, "type": "新舊資訊", "evidence": "A nearby sign explains its purpose: reducing disposable bottles.", "why": "冒號後 reducing disposable bottles 提供用途 purpose，非過往 history。", "en": "The city installed a drinking fountain outside the station. The facility was the first of its kind in the area. A nearby sign explains its purpose: reducing disposable bottles. That goal has encouraged shops to offer free refills.", "zh": "市府在車站外裝設飲水台。這項設施是該區首座。附近告示說明其用途：減少一次性瓶子。這個目標鼓勵商店提供免費續水。"}]}, {"word": "qualification", "meanings": ["限定／保留條件"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P034", "title": "線上學習的反例", "blank": 2, "level": 3, "type": "段落功能", "evidence": "This case serves as a counterexample, showing that the claim needs qualification.", "why": "反例要求主張 qualification，不是增加 certainty。", "en": "The opening paragraph claims that online lessons save everyone time. The next describes a student with an unreliable connection. This case serves as a counterexample, showing that the claim needs qualification. It does not prove that all online learning is a failure.", "zh": "首段主張線上課程節省每個人的時間。下一段描述一位網路不穩的學生。這個案例是反例，顯示主張需要加上限制；它並未證明所有線上學習都失敗。"}]}, {"word": "qualified", "meanings": ["有保留的"], "pos": ["Adj"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P037", "title": "審慎的書評", "blank": 1, "level": 3, "type": "作者態度", "evidence": "Her overall tone is qualified: she sees strengths as well as weaknesses.", "why": "有稱讚也有批評是 qualified；uncritical 忽略指出的弱點。", "en": "The reviewer praises the book's clear diagrams but notes several unsupported claims. Her overall tone is qualified: she sees strengths as well as weaknesses. She recommends it for beginners, while advising advanced readers to consult additional sources.", "zh": "評論者稱讚書中的清楚圖表，但指出數項缺乏支持的主張。她整體持保留態度，兼看優缺點。她推薦初學者閱讀，也建議進階讀者參照更多資料來源。"}]}, {"word": "qualifies", "meanings": ["加以限定"], "pos": ["V"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P116", "title": "好消息後的一段保留", "blank": 2, "level": 4, "type": "段落功能", "evidence": "It qualifies the earlier praise rather than canceling every achievement.", "why": "qualifies earlier praise 表修正範圍；confirms 忽略保留段功能。", "en": "The first paragraphs celebrate a town's new recycling program. A later paragraph explains that several apartment blocks still lack collection points. This section introduces a limitation. It qualifies the earlier praise rather than canceling every achievement. By drawing attention to unequal access, it explains why further work is necessary. Its function is to prevent an overly optimistic conclusion.", "zh": "前幾段肯定小鎮的新回收計畫。後一段說明數棟公寓仍無回收點。此段引入限制，為先前讚揚加上保留，而非否定全部成果。它指出可近性不均，說明仍需改善，避免結論過度樂觀。"}]}, {"word": "questions", "meanings": ["問題"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P024", "title": "洞穴新發現", "blank": 3, "level": 4, "type": "新舊資訊", "evidence": "These traces raised fresh questions about who had visited it.", "why": "刻痕讓人問 who，產生 questions，未直接給出 answers。", "en": "A team discovered a small cave beneath the hill. Until then, its existence had been unknown to local residents. The newly found site contained wall markings. These traces raised fresh questions about who had visited it.", "zh": "團隊在山丘下發現小洞穴。在那之前，當地居民不知道它的存在。這個新發現的地點有壁面刻痕。這些痕跡引出新的問題：誰曾到訪？"}]}, {"word": "raise", "meanings": ["募集／提高", "提高"], "pos": ["V"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P056", "title": "災後援助", "blank": 3, "level": 2, "type": "搭配判斷", "evidence": "Local shops agreed to provide supplies, while students helped raise funds.", "why": "raise funds 是募款且 raise 為及物動詞；rise 不能直接接受詞 funds。", "en": "Volunteers worked to meet the urgent needs of displaced families. Local shops agreed to provide supplies, while students helped raise funds. Together, these efforts made the relief center possible.", "zh": "志工努力滿足流離失所家庭的迫切需求。當地商店同意提供物資，學生則協助募款。這些努力共同促成救助中心成立。"}, {"pid": "P068", "title": "水位的變化", "blank": 2, "level": 2, "type": "易混淆字詞", "evidence": "Workers had to raise the temporary barrier to keep the road dry.", "why": "raise 為及物動詞，直接接 barrier；rise 不能如此用。", "en": "Heavy rain caused the river to rise overnight. Workers had to raise the temporary barrier to keep the road dry. They watched the water level closely until the storm passed.", "zh": "大雨使河流水位一夜上升。工人必須提高臨時障礙物以保持道路乾燥。他們密切觀察水位，直到暴風雨過去。"}]}, {"word": "raised", "meanings": ["提出／提高"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P071", "title": "提出疑慮", "blank": 1, "level": 3, "type": "多義判斷", "evidence": "During the meeting, a resident raised a concern about traffic noise.", "why": "raise a concern 是提出疑慮，非物理 lifted。", "en": "During the meeting, a resident raised a concern about traffic noise. The chair agreed to address the issue before approving the plan. A written record of the discussion would be sent to everyone.", "zh": "會議中，一位居民提出交通噪音疑慮。主席同意核准計畫前處理此事。討論的書面紀錄將寄給所有人。"}]}, {"word": "rather", "meanings": ["而不是〔搭 than〕"], "pos": ["Adv"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P109", "title": "午休的短暫步行", "blank": 5, "level": 4, "type": "句間邏輯", "evidence": "The final plan was flexible rather than rigid.", "why": "rather than rigid 表用彈性取代僵化的對比。", "en": "A class expected a short walk after lunch to waste study time. Instead, many students returned feeling more alert. The teacher repeated the activity for a week. However, she noticed that heavy rain made outdoor walks impractical. She therefore offered an indoor route as an alternative. The class kept both options, because the aim was movement rather than a particular location. The final plan was flexible rather than rigid.", "zh": "班上原以為午餐後散步浪費讀書時間，實際卻有許多學生精神更好。老師重複活動一週，但發現大雨使戶外步行難以實行。因此她提供室內路線作替代方案。兩種選項都保留，因為目標是活動身體而非限定地點。最後計畫有彈性而不僵化。"}]}, {"word": "reassemble", "meanings": ["重新組裝"], "pos": ["V"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P134", "title": "可逆的展示設計", "blank": 3, "level": 3, "type": "構詞判斷", "evidence": "Workers could reassemble the panels in new arrangements.", "why": "in new arrangements 指重新組裝 reassemble；disassemble 只拆開，尚未形成新配置。", "en": "The museum needed labels that could be removed without damaging the walls. Designers chose a removable adhesive. Because future exhibitions would differ, the layout had to be reconfigurable. Workers could reassemble the panels in new arrangements. Clear instructions prevented misunderstanding during installation. The system made later changes less costly.", "zh": "博物館需要能移除又不傷牆的標籤，因此選可移除黏著劑。未來展覽不同，配置須能重新組合。工人可把面板重組成新排列。清楚說明避免安裝誤解，也降低之後修改成本。"}]}, {"word": "recheck", "meanings": ["重新檢查"], "pos": ["V"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P090", "title": "跨國合作", "blank": 2, "level": 3, "type": "構詞判斷", "evidence": "They planned to recheck earlier measurements after discovering a faulty sensor.", "why": "re- 表再一次，earlier measurements 需要 recheck。", "en": "Researchers from several countries formed an international team. They planned to recheck earlier measurements after discovering a faulty sensor. Repeating the tests would help prevent misinterpretation of the original results.", "zh": "多國研究者組成國際團隊。發現感測器故障後，他們計畫重新檢查先前測量。重做測試有助避免誤解原始結果。"}]}, {"word": "recommendation", "meanings": ["建議"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P032", "title": "自行車道比較", "blank": 3, "level": 4, "type": "文章組織", "evidence": "It evaluates the two designs against the same safety criteria before offering a recommendation.", "why": "評估後提供有根據的 recommendation；rumor 不符合分析文結構。", "en": "The first section describes the old road layout. The second introduces a protected bicycle lane. Rather than telling one continuous story, the article uses comparison. It evaluates the two designs against the same safety criteria before offering a recommendation.", "zh": "第一節描述舊道路配置，第二節介紹受保護的自行車道。文章不是講述一條連續故事，而是使用比較。它依相同安全標準評估兩種設計，再提出建議。"}, {"pid": "P115", "title": "一則公共提案的結構", "blank": 4, "level": 4, "type": "文章組織", "evidence": "The final section weighs benefits against costs before making a recommendation.", "why": "權衡後 making a recommendation 是文章最後的決策建議。", "en": "The report begins with a description of overcrowded bus stops. It then identifies the main causes, including uneven arrival times. The next section proposes a scheduling reform. A trial supplies evidence about whether the proposal works. The final section weighs benefits against costs before making a recommendation. This problem-to-response structure helps readers follow the argument.", "zh": "報告先描述公車站擁擠，再辨識主要成因，如到站時間不均。下一節提出班表改革。試辦提供方案效果的證據。末節權衡效益和成本，再給建議。從問題走向回應的結構讓讀者容易跟上論證。"}]}, {"word": "recommended", "meanings": ["建議了"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P125", "title": "實驗課的規則", "blank": 2, "level": 3, "type": "句型判斷", "evidence": "She recommended tying back long hair before using the equipment.", "why": "recommended tying 接動名詞，而非 recommended 人 to V。", "en": "The instructor required students to wear goggles. She recommended tying back long hair before using the equipment. The rules made the class feel more secure. A checklist reminded everyone that safety came before speed. Students then practiced slowly to avoid making careless errors.", "zh": "講師要求學生戴護目鏡，並建議使用設備前把長髮綁好。規則讓大家更安心。清單提醒所有人安全優先於速度。學生接著慢慢練習，避免粗心錯誤。"}]}, {"word": "recommends", "meanings": ["推薦"], "pos": ["V"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P037", "title": "審慎的書評", "blank": 2, "level": 3, "type": "作者態度", "evidence": "She recommends it for beginners, while advising advanced readers to consult additional sources.", "why": "for beginners 與另給進階建議顯示有條件 recommends，不是 rejects。", "en": "The reviewer praises the book's clear diagrams but notes several unsupported claims. Her overall tone is qualified: she sees strengths as well as weaknesses. She recommends it for beginners, while advising advanced readers to consult additional sources.", "zh": "評論者稱讚書中的清楚圖表，但指出數項缺乏支持的主張。她整體持保留態度，兼看優缺點。她推薦初學者閱讀，也建議進階讀者參照更多資料來源。"}]}, {"word": "reconfigurable", "meanings": ["可重新配置的"], "pos": ["Adj"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P134", "title": "可逆的展示設計", "blank": 2, "level": 3, "type": "構詞判斷", "evidence": "Because future exhibitions would differ, the layout had to be reconfigurable.", "why": "re- 加 configurable 為可重新配置，因應不同展覽。", "en": "The museum needed labels that could be removed without damaging the walls. Designers chose a removable adhesive. Because future exhibitions would differ, the layout had to be reconfigurable. Workers could reassemble the panels in new arrangements. Clear instructions prevented misunderstanding during installation. The system made later changes less costly.", "zh": "博物館需要能移除又不傷牆的標籤，因此選可移除黏著劑。未來展覽不同，配置須能重新組合。工人可把面板重組成新排列。清楚說明避免安裝誤解，也降低之後修改成本。"}]}, {"word": "record", "meanings": ["記錄", "紀錄", "唱片／紀錄"], "pos": ["V", "N"], "tags": ["POS", "Semantics", "Global", "Grammar", "Collocation", "Logic", "Cohesion"], "examples": [{"pid": "P052", "title": "記錄河水", "blank": 1, "level": 1, "type": "詞性判斷", "evidence": "Students record the river level every morning.", "why": "Students 後缺主要動詞，record 在此是動作。同字可兼類，但此格需動詞。", "en": "Students record the river level every morning. Their written log helps scientists identify seasonal changes. To keep the data reliable, they use the same measuring method each day.", "zh": "學生每天早上記錄河流水位。書面紀錄協助科學家辨認季節變化。為使資料可靠，他們每天使用相同測量方法。"}, {"pid": "P071", "title": "提出疑慮", "blank": 3, "level": 3, "type": "多義判斷", "evidence": "A written record of the discussion would be sent to everyone.", "why": "written record 指討論文字紀錄；envelope 是容器，不能表示內容本身。", "en": "During the meeting, a resident raised a concern about traffic noise. The chair agreed to address the issue before approving the plan. A written record of the discussion would be sent to everyone.", "zh": "會議中，一位居民提出交通噪音疑慮。主席同意核准計畫前處理此事。討論的書面紀錄將寄給所有人。"}, {"pid": "P100", "title": "一條河的兩種任務", "blank": 7, "level": 5, "type": "全文一致", "evidence": "After the first section opened, volunteers began to record water levels and wildlife sightings.", "why": "begin to 後原形 record，同時表示蒐集監測資料。", "en": "For decades, a concrete channel carried rainwater quickly through the town. Engineers had designed it to prevent flooding, and many residents considered it a success. Yet its steep walls left little room for plants or animals. When the town proposed a redesign, the debate was not simply about beauty. It concerned how one place could serve multiple purposes. The new plan kept a deep central channel but added planted shelves along the sides. These features created habitats without blocking the main flow. Some residents remained skeptical, fearing that vegetation would slow the water. The team therefore ran tests before construction. The results suggested that the design could work under ordinary conditions; they did not guarantee safety in every possible storm. Officials described the evidence as promising, rather than final. After the first section opened, volunteers began to record water levels and wildlife sightings. Their observations would guide later adjustments. The project thus treated restoration as an ongoing process, not a single finished event. Its broader lesson was that public spaces require both careful design and continued attention.", "zh": "數十年來，水泥渠道讓雨水快速流過小鎮。工程師原先設計它是為防洪，许多居民認為很成功。但陡峭壁面使動植物幾乎無處生存。小鎮提出改造時，辯論不只關乎美觀，更涉及同一空間如何兼顧多項用途。新計畫保留深中央水道，在兩側增植栽平台。這些設計創造棲地，又不阻擋主流。部分居民仍懷疑，擔心植被減慢水流。因此團隊施工前先測試。結果暗示設計在一般條件下可行，卻不保證每場可能的暴雨都安全。官員稱證據有希望，而非已定論。首段開放後，志工開始記錄水位與野生動物。觀察將引導後續調整。修復因此是持續過程，而非一次完成的事件。更廣泛的啟示是公共空間既需周密設計，也需持續關注。"}, {"pid": "P128", "title": "修復唱片的價值", "blank": 1, "level": 3, "type": "多義判斷", "evidence": "The archive held a rare record of a local singer's first performance.", "why": "表面覆塵且能播放歌手演出，record 在此是唱片，不是成績紀錄。", "en": "The archive held a rare record of a local singer's first performance. Dust covered its surface, so a specialist cleaned it with great care. The work carried no charge because a donor covered the cost. Once restored, the music brought an almost forgotten voice back into circulation. The project gave new life to material that had spent decades in storage.", "zh": "檔案館保存一張在地歌手初次演出的珍貴唱片。表面覆塵，專家細心清潔。捐贈者負擔費用，因此工作不收費。修復後，音樂讓幾乎被遺忘的聲音重新流傳，也讓存放數十年的材料重獲生命。"}]}, {"word": "recordings", "meanings": ["錄音"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P110", "title": "口述故事的保存", "blank": 4, "level": 3, "type": "句間銜接", "evidence": "To preserve the speakers' voices as well, the archive also kept the original recordings.", "why": "preserve voices 需保留 recordings，不能只留文字。", "en": "The team recorded memories of a closed railway station. These interviews captured details missing from official records. The spoken material was then turned into written transcripts. This conversion made the stories easier to search. To preserve the speakers' voices as well, the archive also kept the original recordings. Together, the two formats offered complementary ways to explore the past.", "zh": "團隊錄下人們對已關閉車站的回憶。訪談捕捉官方紀錄缺少的細節，口述材料再轉成逐字稿。這種轉換讓故事更容易搜尋。為同時保留受訪者聲音，檔案館也留下原錄音。兩種格式提供互補的歷史探索方式。"}]}, {"word": "recover", "meanings": ["恢復"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P069", "title": "躺下休息", "blank": 3, "level": 3, "type": "易混淆字詞", "evidence": "The rest helped him recover before the journey home.", "why": "helped him recover 需動詞；recovery 是名詞。", "en": "After the hike, Bo wanted to lie down in the shade. First, he laid his backpack on a bench. The rest helped him recover before the journey home.", "zh": "健行後，博想躺在樹蔭下。他先把背包放上長椅。休息幫他在返程前恢復體力。"}]}, {"word": "recovery", "meanings": ["復原"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P119", "title": "復育尚未結束", "blank": 1, "level": 4, "type": "全文一致", "evidence": "A consistent conclusion must recognize both recovery and continuing risk.", "why": "more fish returned 是 recovery 的證據，但不是無風險。", "en": "The opening section reports that more fish have returned to the stream. Later, the article notes that pollution still enters after heavy rain. A consistent conclusion must recognize both recovery and continuing risk. Declaring the stream completely restored would go beyond the evidence. The final paragraph instead calls for regular monitoring. This recommendation matches the unresolved problem and avoids a contradiction between the ending and the earlier details.", "zh": "開頭說溪流魚變多，後文提醒大雨後仍有污染流入。一致的結論須兼顧復原和持續風險。宣稱已完全復育會超出證據。末段改為要求定期監測，與未解決問題一致，避免結尾和前文矛盾。"}]}, {"word": "recur", "meanings": ["再出現"], "pos": ["V"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P097", "title": "先保留作答理由", "blank": 3, "level": 3, "type": "尚待確認", "evidence": "She requested more evidence and planned a different passage to check whether the difficulty would recur.", "why": "whether difficulty recur 表觀察同困難是否重現；不是先假定一定持續。", "en": "A student chose a word that did not fit the passage but could not explain the choice. The teacher treated the error as a signal, not a diagnosis. She requested more evidence and planned a different passage to check whether the difficulty would recur.", "zh": "學生選了不合篇章的字，卻無法說明理由。老師把錯誤當訊號，而非診斷。她要求更多證據，並安排不同文章觀察困難是否再出現。"}]}, {"word": "reduce", "meanings": ["降低"], "pos": ["V"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P080", "title": "提醒天氣", "blank": 3, "level": 3, "type": "中文直譯", "evidence": "Following this advice could reduce the risk of injury.", "why": "reduce the risk 表降低風險；rise 不及物，不能接 risk，方向也相反。", "en": "The teacher told students to pay attention to the forecast. If a storm approached, they should seek shelter rather than stay under a tree. Following this advice could reduce the risk of injury.", "zh": "老師提醒學生注意天氣預報。若暴風雨接近，應尋找遮蔽處，不要留在樹下。遵循建議可降低受傷風險。"}]}, {"word": "reduced", "meanings": ["減輕了"], "pos": ["V"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P129", "title": "漏水修好以後", "blank": 3, "level": 3, "type": "上下文方向", "evidence": "This change reduced pressure on the building's budget.", "why": "預算壓力是被 reduced；注意主詞 change 單數和過去述語。", "en": "A hidden pipe had been wasting water for months. After repairs, daily consumption dropped. The monthly bill became lower, even though the number of residents stayed the same. This change reduced pressure on the building's budget. The manager viewed the result as positive. Still, she continued checking the meter so that another leak would not go unnoticed.", "zh": "暗管漏水數月。修好後日用水量下降，即使住戶數相同，月費也降低。改變減輕大樓預算壓力，管理者視為正面成果。她仍查水表，避免另一次漏水未被察覺。"}]}, {"word": "refills", "meanings": ["續裝／續水"], "pos": ["N"], "tags": ["Cohesion", "Semantics"], "examples": [{"pid": "P023", "title": "街角飲水站", "blank": 3, "level": 3, "type": "新舊資訊", "evidence": "That goal has encouraged shops to offer free refills.", "why": "That goal 回指減少瓶子，提供 refills 才可讓同一容器再用；receipts 無此關係。", "en": "The city installed a drinking fountain outside the station. The facility was the first of its kind in the area. A nearby sign explains its purpose: reducing disposable bottles. That goal has encouraged shops to offer free refills.", "zh": "市府在車站外裝設飲水台。這項設施是該區首座。附近告示說明其用途：減少一次性瓶子。這個目標鼓勵商店提供免費續水。"}]}, {"word": "reform", "meanings": ["改革"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P115", "title": "一則公共提案的結構", "blank": 2, "level": 4, "type": "文章組織", "evidence": "The next section proposes a scheduling reform.", "why": "scheduling reform 是針對原因提出改變。", "en": "The report begins with a description of overcrowded bus stops. It then identifies the main causes, including uneven arrival times. The next section proposes a scheduling reform. A trial supplies evidence about whether the proposal works. The final section weighs benefits against costs before making a recommendation. This problem-to-response structure helps readers follow the argument.", "zh": "報告先描述公車站擁擠，再辨識主要成因，如到站時間不均。下一節提出班表改革。試辦提供方案效果的證據。末節權衡效益和成本，再給建議。從問題走向回應的結構讓讀者容易跟上論證。"}]}, {"word": "refusal", "meanings": ["拒絕"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P087", "title": "婉拒邀約", "blank": 1, "level": 4, "type": "語氣／含意", "evidence": "Sara replied, \"I'd love to help, but my schedule is full this week.\" The phrase before but softens a refusal.", "why": "but my schedule is full 指無法答應，refusal；不能只讀 I'd love 當 acceptance。", "en": "Sara replied, \"I'd love to help, but my schedule is full this week.\" The phrase before but softens a refusal. Her message is polite, yet it does not amount to a commitment to join the project.", "zh": "莎拉回覆：「我很想幫忙，但我這週行程已滿。」but 前面的語句緩和拒絕。訊息很有禮貌，卻不等於承諾參與計畫。"}]}, {"word": "reject", "meanings": ["否定"], "pos": ["V"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P103", "title": "博物館裡的空白標籤", "blank": 2, "level": 5, "type": "尚待確認", "evidence": "The curator did not reject the story; she simply distinguished it from a verified fact.", "why": "did not reject 表未否定口傳，只分清證據層級。", "en": "A small museum received a wooden box from a local family. No document explained its origin. The donors believed it had belonged to a traveling merchant, but this account came from a story repeated over several generations. The curator did not reject the story; she simply distinguished it from a verified fact. She examined the box and found a mark that resembled a maker's symbol in an old catalog. The similarity offered a useful clue, not a complete answer. A later search revealed that several workshops had used comparable marks. The team therefore kept the label tentative. Instead of inventing a precise date, it explained what was known and what remained uncertain. Some visitors found the incomplete story frustrating. Others appreciated being invited into the process of investigation. The museum added a display describing how evidence is compared and claims are revised. Months later, a visitor supplied a photograph showing a similar box in a shop. This new material did not solve every question, but it helped narrow the search. The exhibit ultimately became less about a single object's mystery and more about the responsibility of presenting knowledge honestly.", "zh": "小博物館收到當地家庭捐贈的木盒，沒有文件交代來源。捐贈者相信它曾屬旅行商人，但說法來自世代口傳。館員沒有否定故事，只把它與核實事實分開。她找到似乎與舊型錄製作者符號相近的記號。相似性是有用線索，而非完整答案。後來查出多間工坊用相近記號，因此標籤保持暫定。館方不編造精確日期，而說明已知與未知。部分訪客感到挫折，另一些欣賞能參與調查過程。館方加設展示，說明如何比較證據與修正主張。數月後，訪客提供商店中相似盒子的照片。新資料未解決一切，但縮小搜尋範圍。展覽最後更關乎誠實呈現知識的責任，而不只是一件物品的謎。"}]}, {"word": "relationship", "meanings": ["關係"], "pos": ["N"], "tags": ["Semantics"], "examples": [{"pid": "P084", "title": "朋友的簡訊", "blank": 2, "level": 4, "type": "語域不合", "evidence": "In a text to a close friend, Eli wrote, \"Want to grab lunch after class?\" The casual invitation matched their familiar relationship.", "why": "familiar relationship 解釋口語選擇。", "en": "In a text to a close friend, Eli wrote, \"Want to grab lunch after class?\" The casual invitation matched their familiar relationship. A phrase like \"request your attendance\" would sound unnecessarily stiff in that exchange.", "zh": "伊萊傳簡訊給好友：「下課要不要去吃午餐？」隨性的邀請符合熟識關係。「請求您出席」在這次互動中會顯得過度拘謹。"}]}, {"word": "relocate", "meanings": ["遷移"], "pos": ["V"], "tags": ["Logic", "Semantics"], "examples": [{"pid": "P076", "title": "雨天備案", "blank": 1, "level": 2, "type": "上下文邏輯", "evidence": "If rain continues, the organizers will relocate it to the gym.", "why": "it to the gym 是移動活動，relocate；cancel it to 不合且不表替代場地。", "en": "The fair can take place outdoors only if the ground is dry. If rain continues, the organizers will relocate it to the gym. This backup plan depends on the gym being available, so the team must confirm the booking first.", "zh": "園遊會只有地面乾燥時才能在戶外辦。若持續下雨，主辦方會把活動移至體育館。備案取決於場館可用，因此團隊必須先確認預訂。"}]}, {"word": "rely", "meanings": ["依靠"], "pos": ["V"], "tags": ["Collocation", "Semantics"], "examples": [{"pid": "P124", "title": "為新生安排路線", "blank": 5, "level": 3, "type": "介系詞搭配", "evidence": "Students could then rely on the final guide for accurate directions.", "why": "rely on the guide 表依賴；reply on 不是依靠的搭配。", "en": "The orientation team was responsible for guiding new students. Its map focused mainly on buildings used in the first week. Volunteers also responded to questions about transport. Their advice was based on incomplete personal experience, so they checked uncertain details. Students could then rely on the final guide for accurate directions.", "zh": "迎新團隊負責引導新生。地圖主要著重第一週使用的建築。志工也回應交通問題。建議基於不完整的個人經驗，因此會查證不確定細節。學生便能仰賴完成版指南獲得正確方向。"}]}, {"word": "remain", "meanings": ["仍然是"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P004", "title": "圖書館導師", "blank": 3, "level": 2, "type": "文法骨架", "evidence": "The stories selected by the librarian remain available online after the meetings.", "why": "主詞是複數 stories；selected by… 是修飾語，remain 才是主句動詞。", "en": "The reading program, which began last spring, enables children to borrow books without paying a fee. Each volunteer guides a small group. The stories selected by the librarian remain available online after the meetings.", "zh": "去年春天開始的閱讀計畫讓孩子免費借書。每位志工帶領一個小組。館員挑選的故事在聚會後仍可在線上閱讀。"}]}, {"word": "reminded", "meanings": ["提醒", "提醒了"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P062", "title": "練習演說", "blank": 3, "level": 2, "type": "句型判斷", "evidence": "She suggested practicing in front of a mirror and reminded him that pauses could help listeners follow the message.", "why": "reminded him that 接人與子句；said him that 不合句型，需 said to him 或 told him。", "en": "The coach encouraged Lian to speak more slowly. She suggested practicing in front of a mirror and reminded him that pauses could help listeners follow the message.", "zh": "教練鼓勵連放慢說話速度，建議對鏡練習，並提醒他停頓能幫聽眾跟上內容。"}, {"pid": "P125", "title": "實驗課的規則", "blank": 4, "level": 3, "type": "句型判斷", "evidence": "A checklist reminded everyone that safety came before speed.", "why": "reminded everyone that 是人加 that 子句，表提醒內容。", "en": "The instructor required students to wear goggles. She recommended tying back long hair before using the equipment. The rules made the class feel more secure. A checklist reminded everyone that safety came before speed. Students then practiced slowly to avoid making careless errors.", "zh": "講師要求學生戴護目鏡，並建議使用設備前把長髮綁好。規則讓大家更安心。清單提醒所有人安全優先於速度。學生接著慢慢練習，避免粗心錯誤。"}]}, {"word": "removable", "meanings": ["可移除的"], "pos": ["Adj"], "tags": ["POS", "Semantics"], "examples": [{"pid": "P134", "title": "可逆的展示設計", "blank": 1, "level": 3, "type": "構詞判斷", "evidence": "Designers chose a removable adhesive.", "why": "remove 加 -able 表可移除，符合不傷牆需求；irremovable 否定可移除。", "en": "The museum needed labels that could be removed without damaging the walls. Designers chose a removable adhesive. Because future exhibitions would differ, the layout had to be reconfigurable. Workers could reassemble the panels in new arrangements. Clear instructions prevented misunderstanding during installation. The system made later changes less costly.", "zh": "博物館需要能移除又不傷牆的標籤，因此選可移除黏著劑。未來展覽不同，配置須能重新組合。工人可把面板重組成新排列。清楚說明避免安裝誤解，也降低之後修改成本。"}]}, {"word": "removed", "meanings": ["移除"], "pos": ["V"], "tags": ["Semantics"], "examples": [{"pid": "P091", "title": "替樹留空間", "blank": 1, "level": 2, "type": "語意判斷", "evidence": "The roots needed room to spread, so workers removed several paving stones.", "why": "needed room 與 exposed soil 指移除 removed，不是 added。", "en": "The roots needed room to spread, so workers removed several paving stones. Rain could then penetrate the exposed soil. The change helped the tree survive the dry season.", "zh": "樹根需要擴展空間，因此工人移除幾塊鋪面石。雨水因而能滲入露出的土壤。改變幫樹度過乾季存活。"}]}, {"word": "rented", "meanings": ["付費租用"], "pos": ["V-en"], "tags": ["Semantics"], "examples": [{"pid": "P065", "title": "借用與租用", "blank": 2, "level": 3, "type": "近義詞混淆", "evidence": "Bicycles, however, must be rented for an hourly fee.", "why": "hourly fee 表按時付費租用 rented；purchased 是取得所有權，不是按時計費。", "en": "Visitors may borrow umbrellas from the hotel at no charge. Bicycles, however, must be rented for an hourly fee. The different arrangements reflect the cost of maintenance.", "zh": "旅客可免費向旅館借傘，腳踏車則需按小時付費租用。兩種安排不同，反映維修保養成本。"}]}, {"word": "reopened", "meanings": ["重新開放"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P095", "title": "被風打倒的樹", "blank": 3, "level": 2, "type": "句法判斷", "evidence": "After the area was cleared, the park reopened to the public.", "why": "After 子句後主句 the park reopened，表示事件後續。", "en": "The tree damaged by the storm stood beside a busy path. Workers removed branches that might fall on visitors. After the area was cleared, the park reopened to the public.", "zh": "受暴風雨損傷的樹立在繁忙步道旁。工人移除可能掉落砸到遊客的枝條。區域清理後，公園重新開放。"}]}, {"word": "repair", "meanings": ["修理", "修補"], "pos": ["N", "V"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P028", "title": "修理文化", "blank": 1, "level": 3, "type": "全文主題", "evidence": "The shared principle is repair.", "why": "fixes 與 repairs 的共同主題是 repair，不是物件外觀 decoration。", "en": "One neighbor fixes lamps; another repairs torn bags. Their skills differ, but both keep useful objects out of the trash. The shared principle is repair. It challenges a culture of constant replacement and encourages people to value what they already own.", "zh": "一位鄰居修燈，另一位補袋子。技能不同，卻都讓有用物品免於被丟棄。共同原則是修理。它挑戰不斷汰換的文化，鼓勵人們珍惜已擁有的東西。"}, {"pid": "P135", "title": "讓舊衣延長壽命", "blank": 1, "level": 3, "type": "語意判斷", "evidence": "A tailor examined the coat before deciding how to repair it.", "why": "examined coat 後決定修補 repair，與更換壞層行為一致。", "en": "A tailor examined the coat before deciding how to repair it. The lining was torn, but the outer fabric remained intact. Replacing only the damaged layer would preserve the coat's useful parts. The customer agreed because she wanted to extend its life. The work turned a possible discard into a usable garment.", "zh": "裁縫檢查外套再決定如何修補。內裡破了，但外層布仍完整。只換壞層可保留可用部分。顧客同意，因她想延長衣服壽命。修補讓原本可能被丟的衣物重新可穿。"}]}, {"word": "replaced", "meanings": ["取代"], "pos": ["V-en"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P101", "title": "工具圖書館的考驗", "blank": 9, "level": 5, "type": "文章組織", "evidence": "The library still needed to compare the costs of repair and transport with the purchases it had replaced.", "why": "共享取代了原本購買，replaced。", "en": "A neighborhood library began lending tools as well as books. The idea seemed practical: most people needed a drill only a few times a year. Sharing could reduce both household spending and unnecessary purchases. At first, however, the staff focused mainly on collecting equipment. They soon discovered that ownership was only one part of the problem. Borrowers needed clear instructions, and returned tools required inspection. One damaged cable could make the next loan unsafe. To address these concerns, the library trained volunteers and introduced a checklist. Each item was checked before it went back onto the shelf. The system also recorded late returns, but the director warned against treating every delay as carelessness. Illness or transport problems could be involved. Instead of imposing the same response in every case, staff considered the circumstances. Six months later, the service had many regular users. That popularity was encouraging, although it did not by itself prove that the project saved resources overall. The library still needed to compare the costs of repair and transport with the purchases it had replaced. Its experience showed that a generous idea becomes sustainable through careful management.", "zh": "社區圖書館除了書也開始借工具。想法看來實用：多數人一年只用幾次電鑽。共享能減少家庭支出與不必要購買。但員工起初主要忙著收集設備，很快發現有工具只是問題的一部分。借用者需要清楚說明，歸還工具需要檢查；一條損壞電線就可能讓下一次借用不安全。圖書館為處理疑慮培訓志工並設清單。每件物品回架前都先檢查。系統也記錄晚還，但館長提醒不能把每次延誤都當粗心，可能涉及疾病或交通問題。員工考量個別情況，而非一律回應。半年後，服務已有許多固定使用者，令人鼓舞，但受歡迎本身並不能證明整體省資源。仍需比較維修、運輸成本和取代的購買。經驗顯示，慷慨構想需靠細心管理才能持續。"}]}, {"word": "replacement", "meanings": ["替換"], "pos": ["N"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P028", "title": "修理文化", "blank": 2, "level": 3, "type": "全文主題", "evidence": "It challenges a culture of constant replacement and encourages people to value what they already own.", "why": "keep…out of trash 對抗不斷 replacement 的消費方式。", "en": "One neighbor fixes lamps; another repairs torn bags. Their skills differ, but both keep useful objects out of the trash. The shared principle is repair. It challenges a culture of constant replacement and encourages people to value what they already own.", "zh": "一位鄰居修燈，另一位補袋子。技能不同，卻都讓有用物品免於被丟棄。共同原則是修理。它挑戰不斷汰換的文化，鼓勵人們珍惜已擁有的東西。"}]}, {"word": "reproducible", "meanings": ["可重現的"], "pos": ["Adj"], "tags": ["Global", "Semantics"], "examples": [{"pid": "P035", "title": "量測前的說明", "blank": 2, "level": 4, "type": "段落功能", "evidence": "Its purpose is to make the study reproducible, rather than to announce the final conclusion.", "why": "公開步驟使人能重做，reproducible；secret 意思相反。", "en": "Before presenting the findings, the researcher explains where the sensors were placed and how often they recorded data. This paragraph describes the method. Its purpose is to make the study reproducible, rather than to announce the final conclusion.", "zh": "在呈現發現之前，研究者解釋感測器放在哪裡以及記錄頻率。這一段描述方法，目的是讓研究能被重做，而非宣告最後結論。"}]}, {"word": "required", "meanings": ["要求了"], "pos": ["V"], "tags": ["Grammar", "Semantics"], "examples": [{"pid": "P125", "title": "實驗課的規則", "blank": 1, "level": 3, "type": "句型判斷", "evidence": "The instructor required students to wear goggles.", "why": "required students to wear 是要求人做事；permission 是名詞，不能作此句的主要動詞。", "en": "The instructor required students to wear goggles. She recommended tying back long hair before using the equipment. The rules made the class feel more secure. A checklist reminded everyone that safety came before speed. Students then practiced slowly to avoid making careless errors.", "zh": "講師要求學生戴護目鏡，並建議使用設備前把長髮綁好。規則讓大家更安心。清單提醒所有人安全優先於速度。學生接著慢慢練習，避免粗心錯誤。"}]}, {"word": "resembled", "meanings": ["類似"], "pos": ["V"], "tags": ["Global", "Semantics", "Grammar", "Collocation", "Logic", "Cohesion", "POS"], "examples": [{"pid": "P103", "title": "博物館裡的空白標籤", "blank": 3, "level": 5, "type": "尚待確認", "evidence": "She examined the box and found a mark that resembled a maker's symbol in an old catalog.", "why": "similarity 回扣 resembled，並非完全相同。", "en": "A small museum received a wooden box from a local family. No document explained its origin. The donors believed it had belonged to a traveling merchant, but this account came from a story repeated over several generations. The curator did not reject the story; she simply distinguished it from a verified fact. She examined the box and found a mark that resembled a maker's symbol in an old catalog. The similarity offered a useful clue, not a complete answer. A later search revealed that several workshops had used comparable marks. The team therefore kept the label tentative. Instead of inventing a precise date, it explained what was known and what remained uncertain. Some visitors found the incomplete story frustrating. Others appreciated being invited into the process of investigation. The museum added a display describing how evidence is compared and claims are revised. Months later, a visitor supplied a photograph showing a similar box in a shop. This new material did not solve every question, but it helped narrow the search. The exhibit ultimately became less about a single object's mystery and more about the responsibility of presenting knowledge honestly.", "zh": "小博物館收到當地家庭捐贈的木盒，沒有文件交代來源。捐贈者相信它曾屬旅行商人，但說法來自世代口傳。館員沒有否定故事，只把它與核實事實分開。她找到似乎與舊型錄製作者符號相近的記號。相似性是有用線索，而非完整答案。後來查出多間工坊用相近記號，因此標籤保持暫定。館方不編造精確日期，而說明已知與未知。部分訪客感到挫折，另一些欣賞能參與調查過程。館方加設展示，說明如何比較證據與修正主張。數月後，訪客提供商店中相似盒子的
