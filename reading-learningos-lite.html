function skill(id){return TYPES[id]||TYPES[UNKNOWN]}function toast(t){$('toast').textContent=t;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').textContent='',4000)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));$('storageWarning').hidden=true;return true}catch(e){$('storageWarning').hidden=false;$('storageWarning').textContent='目前無法保存，請保持頁面開啟；本次仍可作答。';return false}}
function normalize(raw){if(!raw||!Array.isArray(raw.sessions))throw Error('資料格式不符');const old=raw.schema!==2,out={schema:2,profile:raw.profile&&typeof raw.profile.className==='string'&&typeof raw.profile.student==='string'?raw.profile:S.profile,sessions:[],seen:Array.isArray(raw.seen)?raw.seen:[],drafts:old?{}:raw.drafts||{},plans:old?{}:raw.plans||{},migrated:old||raw.migrated};for(const s of raw.sessions){if(!s||!Array.isArray(s.items))continue;out.sessions.push({...s,legacyRetest:old&&s.mode==='retest'||s.legacyRetest,items:s.items.filter(Boolean).map(it=>{const q=question(it.questionId),matched=q&&it.question?.en===q.en&&JSON.stringify(it.question?.options)===JSON.stringify(q.options);const id=old?(matched?q.skill:UNKNOWN):(Number.isInteger(it.skill)&&it.skill>=0&&it.skill<=16?it.skill:UNKNOWN);return {...it,skill:id,passed:typeof it.passed==='boolean'?it.passed:null,rootId:it.rootId||(!it.passed&&s.mode==='formal'?it.id:''),question:it.question?{...it.question,skill:id}:null}})})}return out}
try{const raw=localStorage.getItem(KEY);if(raw){const v=JSON.parse(raw);if(v.schema!==2&&!localStorage.getItem(KEY+'_before16'))localStorage.setItem(KEY+'_before16',raw);S=normalize(v)}}catch(e){$('storageWarning').hidden=false;$('storageWarning').textContent='舊資料暫無法載入，已嘗試保留副本。';try{localStorage.setItem(KEY+'_recovery',localStorage.getItem(KEY)||'')}catch(_){}}
function dateKey(iso){const d=new Date(iso);return Number.isNaN(+d)?'':d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function allEvents(){return S.sessions.flatMap(s=>s.items.map(q=>({s,q}))).filter(e=>e.s.module==='reading'&&typeof e.q.passed==='boolean').sort((a,b)=>Date.parse(a.s.date)-Date.parse(b.s.date))}
function rootById(id){return allEvents().find(e=>e.q.id===id&&e.s.mode==='formal'&&!e.q.passed)}
function validRetest(e){const r=rootById(e.q.targetRoot);return e.s.mode==='retest'&&!e.s.legacyRetest&&e.s.fresh===true&&r&&r.q.skill!==UNKNOWN&&r.q.skill===e.q.skill&&who(r.s)===who(e.s)&&r.s.demo===e.s.demo&&r.s.passageId!==e.s.passageId&&Date.parse(r.s.date)<=Date.parse(e.s.date)&&!S.sessions.some(s=>s.id!==e.s.id&&s.demo===e.s.demo&&who(s)===who(e.s)&&s.passageId===e.s.passageId&&Date.parse(s.date)<=Date.parse(e.s.date))}
function formal(e){return e.s.mode==='formal'||validRetest(e)}
function seen(id,profile=S.profile){return S.seen.some(x=>x.pid===id&&x.who===who(profile))||S.sessions.some(s=>!s.demo&&who(s)===who(profile)&&s.passageId===id)}
function markSeen(id){if(!seen(id))S.seen.push({pid:id,who:who(S.profile)});save()}
function inPeriod(s){const d=dateKey(s.date);return !!d&&(!F.from||d>=F.from)&&(!F.to||d<=F.to)}
function matches(e){return e.s.demo===F.demo&&(!F.className||e.s.className===F.className)&&(!F.student||e.s.student===F.student)&&(F.skill===''||e.q.skill===+F.skill)}
function chain(root,until=F.to){const hist=allEvents().filter(e=>e.q.targetRoot===root.q.id&&validRetest(e)&&(!until||dateKey(e.s.date)<=until));const firstPass=hist.findIndex(e=>e.q.passed);const follow=firstPass>=0?hist[firstPass+1]:null;const last=hist.at(-1);let label='待修復',rank=3;if(S.plans[root.q.id])label='待換文再測';if(last){if(!last.q.passed){label=firstPass>=0?'再犯｜優先補強':'尚未通過｜優先補強';rank=0}else if(hist.filter(e=>e.q.passed).length>=2&&hist.slice(-2).every(e=>e.q.passed)){label='已修復（本輪兩篇通過）';rank=4}else{label='初步通過｜待追蹤';rank=2}}return {hist,firstPass,follow,last,label,rank}}
function roots(){const seenIds=new Set();return allEvents().filter(e=>{if(e.s.mode!=='formal'||e.q.passed)return false;const id=e.q.rootId||e.q.id;if(id!==e.q.id||seenIds.has(id))return false;seenIds.add(id);return true})}
function computeRows(){const all=allEvents(),firstMap=new Map();for(const e of all){if(e.s.mode!=='formal')continue;const key=who(e.s)+'|'+e.s.demo+'|'+e.q.questionId;if(!firstMap.has(key))firstMap.set(key,e)}const first=[...firstMap.values()].filter(e=>matches(e)&&inPeriod(e.s)),ev=all.filter(e=>formal(e)&&matches(e)&&inPeriod(e.s)),rs=roots().filter(e=>matches(e)&&inPeriod(e.s));return TYPES.filter(t=>F.skill===''||t.id===+F.skill).map(t=>{const a=first.filter(e=>e.q.skill===t.id),r=ev.filter(e=>e.q.skill===t.id&&validRetest(e)),w=ev.filter(e=>e.q.skill===t.id&&!e.q.passed),chains=rs.filter(e=>e.q.skill===t.id).map(root=>({root,...chain(root)})),follow=chains.filter(c=>c.follow);let status='資料不足';if(chains.some(c=>c.last&&!c.last.q.passed))status='優先補強';else if(chains.length&&chains.every(c=>c.label.startsWith('已修復')))status='已修復（本輪）';else if(chains.some(c=>c.last?.q.passed))status='初步通過／待追蹤';else if(w.length)status='待再測';return {t,firstN:a.length,firstWrong:a.filter(e=>!e.q.passed).length,wrong:w.length,retN:r.length,retOK:r.filter(e=>e.q.passed).length,followN:follow.length,repeat:follow.filter(c=>!c.follow.q.passed).length,chains,status}})}
function go(v){view=v;active=null;render();scrollTo(0,0)}
function render(){const nav=[['home','學習首頁'],['skills','16類診斷與白話提示'],['bank','閱讀篇章題庫'],['lexicon','高頻字詞秘笈 BANK'],['supplement','補充詞彙庫']];$('nav').innerHTML=nav.map(([k,t])=>`<button data-nav="${k}" class="${view===k?'active':''}">${t}</button>`).join('');$('profileLabel').hidden=true;const f={supplement,lexicon:phraseBank,home,skills,bank,practice,result};$('main').innerHTML=(f[view]||home)();bind()}
function editProfile(){$('classInput').value=S.profile.className;$('studentInput').value=S.profile.student;$('profileDialog').showModal()}
$('profileForm').onsubmit=e=>{e.preventDefault();const c=$('classInput').value.trim(),n=$('studentInput').value.trim();if(!c||!n)return toast('請填寫班級與學生。');S.profile={className:c,student:n};save();$('profileDialog').close();go('home')};
function home(){return `<div class="hero"><div class="kicker">閱讀測驗 LearningOS</div><h1>讀懂篇章，找到答案的證據</h1><p>閱讀文章 → 辨認題目所需能力 → 比較選項 → 查看中英解析。</p><div class="row"><button class="primary" data-nav="bank">開始閱讀練習</button><button data-nav="skills">查看16類白話提示</button><button data-nav="supplement">補充詞彙庫</button></div></div><div class="grid section"><div class="card"><h2>16類＋尚待確認</h2><p>錯誤類型教學與解題提示</p></div><div class="card"><h2>${PS.length}篇／${PS.reduce((n,p)=>n+p.questions.length,0)}題</h2><p>閱讀篇章、答案與繁中解析</p></div></div>`}

function passageHTML(p){return `<h2>${p.title}</h2><div class="readingtext">${p.en.map((t,i)=>`<p><span class="num">〔${i+1}〕</span> ${esc(t)}</p>`).join('')}</div>${p.table?`<div class="tablewrap"><table><thead><tr>${p.table.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${p.table.rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:''}<details><summary>繁體中文全文</summary>${p.zh.map((t,i)=>`<p>〔${i+1}〕${esc(t)}</p>`).join('')}</details>`}
function answerHTML(q,a){if(!q?.options)return '<p>舊題目內容不足，請以新文章探測；此筆保留尚待確認。</p>';return `<h3>${esc(q.en)}</h3><p>${esc(q.zh)}</p><p>學生答案：${Number.isInteger(a)?'ABCD'[a]||'—':'—'}　參考答案：<b>${'ABCD'[q.answer]}</b></p>${q.options.map((o,i)=>`<div class="choice ${i===q.answer?'correctOption':i===a?'wrongOption':''}"><div><b>${'ABCD'[i]}. ${esc(o.en)}</b><p>${esc(o.zh)}</p><p class="mini">${i===q.answer?'正解理由':'排除理由'}：${esc(q.why[i])}</p></div></div>`).join('')}<blockquote>${esc(q.quote)}</blockquote><p>${esc(q.reason)}</p>`}
function skills(){return `<div class="kicker">ERROR TYPE → SKILL NODE → ACTION</div><h1>16類診斷，先用學生聽得懂的問題</h1><input id="skillSearch" type="search" placeholder="搜尋類型、白話提示或能力" aria-label="搜尋錯誤類型"><div class="grid two section">${TYPES.map(t=>{const p=PS.find(p=>p.questions.some(q=>q.skill===t.id)),q=p?.questions.find(q=>q.skill===t.id);return `<section class="card" data-skilltext="${esc(t.name+t.plain+t.definition)}"><span class="num">${t.id<16?String(t.id+1).padStart(2,'0'):'？'} · ${esc(t.node)}</span><h2>${t.plain}</h2><span class="pill">${t.name}</span><p>${t.definition}</p><div class="callout"><b>Corrective Action｜補強動作</b><p>${t.action}</p></div>${p?`<details data-seen="${p.id}"><summary>例題解析：${p.title}</summary><p class="mini muted">展開示範會記為已讀，不計正式作答。</p>${passageHTML(p)}${answerHTML(q,null)}</details><button data-filter="${t.id}">本類題庫 · ${PS.filter(p=>p.questions.some(q=>q.skill===t.id)).length}篇</button>`:'<p>不猜測缺失能力。先保存作答理由，再用新題取得證據。</p>'}</section>`}).join('')}</div>`}
function card(p){const ts=[...new Set(p.questions.map(q=>q.skill))];return `<article class="card"><span class="pill">${p.id} · L${p.level} · ${p.questions.length}題</span><h3>${p.title}</h3><p class="mini">${ts.map(id=>skill(id).name).join('／')}</p><span class="pill ${seen(p.id)?'':'green'}">${seen(p.id)?'已讀':'未讀篇章'}</span><div class="row section"><button class="primary" data-start="${p.id}">閱讀練習</button><button data-practice="${p.id}">定向練習</button></div></article>`}
function bank(){return `<h1>閱讀篇章題庫</h1><p>每類能力都有至少3篇不同文章，附完整中英解析與解題提示。</p><div class="filters"><label>搜尋<input id="searchBank" type="search" value="${esc(B.q)}"></label><label>錯誤類型<select id="skillBank"><option value="">全部16類</option>${SKILLS.map(t=>`<option value="${t.id}" ${B.skill===String(t.id)?'selected':''}>${t.name}</option>`).join('')}</select></label><label>難度<select id="levelBank"><option value="">全部</option>${[2,3,4].map(n=>`<option ${B.level==n?'selected':''}>${n}</option>`).join('')}</select></label></div><p id="bankCount"></p><div id="bankItems" class="grid"></div>`}
function filterBank(){const ps=PS.filter(p=>(!B.q||(p.title+p.en.join('')+p.zh.join('')).toLowerCase().includes(B.q.toLowerCase()))&&(B.skill===''||p.questions.some(q=>q.skill===+B.skill))&&(!B.level||p.level===+B.level));$('bankCount').textContent=`${ps.length}篇／${ps.reduce((n,p)=>n+p.questions.length,0)}題；全庫12篇／80題。`;$('bankItems').innerHTML=ps.map(card).join('')||'<div class="empty">沒有符合篇章。</div>'}
function keyFor(p,mode,root=''){return who(S.profile)+'\u0001'+p+'\u0001'+mode+'\u0001'+root}
function start(id,mode='repair',rootId='',qid=''){if(mode==='retest')return;const p=pid(id);if(!p)return;const key=keyFor(id,mode,rootId),d=S.drafts[key];let qs=p.questions;if(mode==='retest'){const r=rootById(rootId);if(!r||r.s.demo||who(r.s)!==who(S.profile)||r.q.skill===UNKNOWN||!S.plans[rootId]||id===r.s.passageId||(seen(id)&&!d))return toast('需先保存補強動作，並使用未讀過、同能力的新篇章。');const q=p.questions.find(q=>q.id===(d?.qid||qid)&&q.skill===r.q.skill);if(!q)return toast('題目能力不符，請重新安排再測。');qs=[q]}
if(!d)S.drafts[key]={answers:qs.map(()=>null),reason:'',rootId,qid:mode==='retest'?qs[0].id:'',fresh:!seen(id),started:new Date().toISOString()};markSeen(id);active={id,mode,rootId,key};view='practice';render();scrollTo(0,0)}
function activeQuestions(){const p=pid(active.id),d=S.drafts[active.key];return active.mode==='retest'?p.questions.filter(q=>q.id===d.qid):p.questions}
function practice(){const p=pid(active.id),d=S.drafts[active.key],qs=activeQuestions();return `<div class="row between"><span class="kicker">${MODE[active.mode]}${active.mode==='retest'?'｜單一能力的新文章探測':''}</span><button data-nav="bank">返回（保存草稿）</button></div><p class="mini muted">${esc(S.profile.className)}／${esc(S.profile.student)} · 本次${qs.length}題。請依篇章證據選答，再查看解析。</p><div class="reader section"><article class="card">${passageHTML(p)}</article><section>${qs.map((q,i)=>`<article class="card question"><span class="pill">${skill(q.skill).name}</span><p class="mini muted">${skill(q.skill).plain}</p><h3>${i+1}. ${esc(q.en)}</h3><details><summary>繁中題目與選項</summary><p>${esc(q.zh)}</p>${q.options.map((o,j)=>`<p>${'ABCD'[j]}｜${esc(o.zh)}</p>`).join('')}</details>${q.options.map((o,j)=>`<label class="choice"><input type="radio" name="q${i}" value="${j}" data-q="${i}" ${d.answers[i]===j?'checked':''}><b>${'ABCD'[j]}. ${esc(o.en)}</b></label>`).join('')}</article>`).join('')}<article class="card"><label for="reason">我的證據與不確定處</label><textarea id="reason" maxlength="10000">${esc(d.reason)}</textarea><p id="filled">已選${d.answers.filter(x=>x!==null).length}／${qs.length}題</p><button class="primary" id="submit">交卷與解析</button></article></section></div>`}
function submit(){if(!active)return;const d=S.drafts[active.key],qs=activeQuestions();if(d.answers.some(x=>x===null))return toast('請完成全部題目。');const id=uid(),mode=active.mode,s={id,date:new Date().toISOString(),...S.profile,module:'reading',demo:false,mode,passageId:active.id,fresh:d.fresh,notes:d.reason,items:qs.map((q,i)=>{const eid=id+':'+q.id,old=roots().find(e=>!e.s.demo&&who(e.s)===who(S.profile)&&e.q.questionId===q.id);return {id:eid,questionId:q.id,skill:q.skill,question:structuredClone(q),answer:d.answers[i],passed:d.answers[i]===q.answer,rootId:mode==='formal'&&d.answers[i]!==q.answer?(old?.q.id||eid):'',targetRoot:mode==='retest'?active.rootId:''}})};S.sessions.push(s);delete S.drafts[active.key];save();reviewId=id;active=null;view='result';render();scrollTo(0,0)}
function result(){const s=S.sessions.find(s=>s.id===reviewId);if(!s)return '<p>找不到紀錄。</p>';const p=pid(s.passageId);return `<h1>${esc(p?.title||'閱讀練習')} · ${s.items.filter(q=>q.passed).length}／${s.items.length}</h1><button data-nav="bank">返回篇章題庫</button>${p?`<details class="card section"><summary>完整篇章與繁中</summary>${passageHTML(p)}</details>`:''}<div class="callout">我的證據：${esc(s.notes||'未填寫')}</div>${s.items.map((q,i)=>`<article class="answer ${q.passed?'':'wrong'}"><span class="pill">${skill(q.skill).name}</span><h2>第${i+1}題 · ${q.passed?'答對':'再看一次'}</h2>${answerHTML(q.question,q.answer)}<div class="callout"><b>解題提示：</b>${skill(q.skill).action}</div></article>`).join('')}`}
function bind(){if(view==='supplement')bindSupplement();if(view==='lexicon')bindPhraseBank();if(view==='bank'){filterBank();for(const[id,key]of [['searchBank','q'],['skillBank','skill'],['levelBank','level']])$(id).addEventListener(key==='q'?'input':'change',e=>{B[key]=e.target.value;filterBank()})}if(view==='skills')$('skillSearch').oninput=e=>document.querySelectorAll('[data-skilltext]').forEach(el=>el.hidden=!el.dataset.skilltext.toLowerCase().includes(e.target.value.toLowerCase()));if(view==='practice'){document.querySelectorAll('[data-q]').forEach(el=>el.onchange=()=>{const d=S.drafts[active.key];d.answers[+el.dataset.q]=+el.value;save();$('filled').textContent=`已選${d.answers.filter(x=>x!==null).length}／${d.answers.length}題`});$('reason').oninput=e=>{S.drafts[active.key].reason=e.target.value;save()};$('submit').onclick=submit}}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav)go(b.dataset.nav);else if(b.dataset.start)start(b.dataset.start);else if(b.dataset.practice)start(b.dataset.practice,'repair');else if(b.dataset.filter!==undefined){B.skill=b.dataset.filter;go('bank')}else if(b.dataset.review){reviewId=b.dataset.review;active=null;view='result';render();scrollTo(0,0)}});
document.addEventListener('toggle',e=>{if(e.target.open&&e.target.dataset?.seen)markSeen(e.target.dataset.seen)},true);
render();

</script></body></html>
