ly require several sources at once.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "先完成描述再回應；個人經驗及判斷不可冒充提示裡的事實。"], "wordCount": 143}, {"id": "M12-19", "type": 11, "title": "昂貴禮物與親手製作", "prompt": "以「昂貴禮物與親手製作」為題，第一段完成「雙情境描述／共同焦點」，第二段完成「偏好或回應／理由」。依下列原創情境示範寫作。", "en": ["One person offers a costly packaged gift, while another gives a handmade album containing shared photographs and short notes. The contrast is useful because it presents different ways of meeting an everyday need. I would first describe what each situation actually contains, rather than assume that one must be correct and the other mistaken. The details provide the basis for a personal response, not a complete judgment about everyone involved.", "I would choose a gift based on the recipient's needs and our relationship, rather than treating either price or handmade effort as an automatic measure of care. My response connects the observed difference with a practical priority in my own life. Another person could reasonably reach a different conclusion. What matters is explaining the connection between the scene and the choice, while keeping visible details separate from the additional experiences or assumptions used to interpret them."], "zh": ["一人送昂貴包裝禮物，另一送含共同照片短箋的手作冊。對照有用，因為呈現滿足日常需求的不同方式。我會先描述各情況實際內容，不先假定一對一錯。細節提供個人回應基礎，不是對所有相關者的完整評判。", "我依收禮者需求及關係選，不自動以價格或手作心力衡量關心。我的回應把觀察差異連到自己生活的實際優先事項。他人合理地可能有不同結論。重要的是解釋場景與選擇的連結，並分開可見細節，以及解讀時加入的經驗或假設。"], "analysis": ["雙情境描述／共同焦點：本篇以「一人送昂貴包裝禮物，另一送含共同照片短箋的手作冊。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "偏好或回應／理由：核心發展為「我依收禮者需求及關係選，不自動以價格或手作心力衡量關心。」；第二段因此不是只重複第一段，而是完成另一項寫作任務。", "關鍵內容句「I would choose a gift based on the recipient's needs and our relationship, rather than treating either price or handmade effort as an automatic measure of care.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "先完成描述再回應；個人經驗及判斷不可冒充提示裡的事實。"], "wordCount": 146}, {"id": "M12-20", "type": 11, "title": "線上與實體請願", "prompt": "以「線上與實體請願」為題，第一段完成「雙情境描述／共同焦點」，第二段完成「偏好或回應／理由」。依下列原創情境示範寫作。", "en": ["One group collects signatures through a website, while another speaks with passersby at a public information table. The contrast is useful because it presents different ways of meeting an everyday need. I would first describe what each situation actually contains, rather than assume that one must be correct and the other mistaken. The details provide the basis for a personal response, not a complete judgment about everyone involved.", "I would combine accessible online information with opportunities for questions, because a large signature count alone does not show that people understand the proposal. My response connects the observed difference with a practical priority in my own life. Another person could reasonably reach a different conclusion. What matters is explaining the connection between the scene and the choice, while keeping visible details separate from the additional experiences or assumptions used to interpret them."], "zh": ["一團透過網站連署，另一在公共資訊桌與路人交談。對照有用，因為呈現滿足日常需求的不同方式。我會先描述各情況實際內容，不先假定一對一錯。細節提供個人回應基礎，不是對所有相關者的完整評判。", "我會結合易用線上資訊及提問機會，因大量簽名不代表人們理解提案。我的回應把觀察差異連到自己生活的實際優先事項。他人合理地可能有不同結論。重要的是解釋場景與選擇的連結，並分開可見細節，以及解讀時加入的經驗或假設。"], "analysis": ["雙情境描述／共同焦點：本篇以「一團透過網站連署，另一在公共資訊桌與路人交談。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "偏好或回應／理由：核心發展為「我會結合易用線上資訊及提問機會，因大量簽名不代表人們理解提案。」；第二段因此不是只重複第一段，而是完成另一項寫作任務。", "關鍵內容句「I would combine accessible online information with opportunities for questions, because a large signature count alone does not show that people understand the proposal.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "先完成描述再回應；個人經驗及判斷不可冒充提示裡的事實。"], "wordCount": 141}], "structureTips": [["0", "選一個轉變", "先寫「我原本如何想，後來如何改變」，刪掉不服務這個轉變的事件。", "I once avoided asking questions, but the project changed that habit.", "我曾避免提問，但這項計畫改變了那個習慣。"], ["0", "背景只留必要資訊", "交代人物、時間、目標；不要從起床與早餐寫起，除非它們造成後續事件。", "The day before our presentation, our main speaker became ill.", "簡報前一天，我們的主要講者生病了。"], ["0", "製造合理衝突", "指出具體阻礙，如誤會、延誤或分工不清，不必誇大成災難。", "We had only one afternoon to divide her work among us.", "我們只有一個下午能把她的工作分配給大家。"], ["0", "動作呈現情緒", "用反覆看時鐘、停下說話等可觀察行動，搭配必要感受，避免只寫 very nervous。", "I kept checking the clock and rubbing my hands.", "我不停看時鐘，搓著雙手。"], ["0", "決定改變故事", "在轉折處交代人物做了什麼選擇，以及為何如此選擇。", "Instead of giving up, I asked each teammate to take one section.", "我沒有放棄，而是請每位隊友負責一部分。"], ["0", "對話少而有效", "只保留能揭露衝突或推動決定的一句話；對話不能取代敘述。", "“Let us try once together,” Mia said.", "「我們一起試一次吧，」米雅說。"], ["0", "結果有因果", "讓結果來自前述行動，而不是忽然出現陌生人解決全部問題。", "Because we rehearsed together, we noticed and fixed several gaps.", "因為一起排練，我們發現並補上了幾處缺漏。"], ["0", "反思回扣細節", "指出某個行動如何改變理解，比「我永遠不會忘記」更有內容。", "Sharing the work taught me that asking for help can strengthen a team.", "分擔工作讓我學到，求助能讓團隊更強。"], ["0", "時態分工", "主要事件用過去式，現在理解可用現在式；回到更早事件時才考慮過去完成式。", "I was nervous then, but now I understand the value of preparation.", "當時我很緊張，但現在我理解準備的價值。"], ["0", "最後逆向核對", "由反思往前查：故事中有沒有足夠事件支持這項學習？", "I learned to trust others because each teammate kept a promise that day.", "我學會信任別人，因為那天每位隊友都履行承諾。"], ["1", "先定整體印象", "選寧靜、忙碌、可靠等一個核心印象，讓後續細節共同支持它。", "The small garden offers a peaceful break from the crowded campus.", "小花園讓人能暫時離開擁擠校園，享受寧靜。"], ["1", "空間順序一致", "描述場所可從入口到內部、近處到遠處，避免視線任意跳動。", "Near the gate stands a bench, and beyond it lies a narrow pond.", "門邊有一張長椅，後方是一座狹長池塘。"], ["1", "人物用行動刻畫", "描寫一個具體習慣或選擇，讓讀者看出體貼或負責，而非只列形容詞。", "My grandfather checks every chair before guests arrive.", "祖父會在客人抵達前檢查每一張椅子。"], ["1", "感官細節要篩選", "選與主題有關的聲音、光線或觸感，不必五種感官全部寫齊。", "Soft light falls through the leaves, and water moves quietly below.", "柔和光線穿過樹葉，下方流水輕輕流動。"], ["1", "精準名詞優先", "以 wooden bench、narrow hallway 等可辨識名詞片語取代反覆的 thing、place。", "A wooden bench faces a narrow path lined with flowers.", "一張木製長椅朝向兩旁種花的窄路。"], ["1", "客觀與感受分開", "先描述可觀察特徵，再說這個特徵帶給自己的感受，不把感受當普遍事實。", "The room has two large windows, which make me feel less confined.", "房間有兩扇大窗，讓我感到較不拘束。"], ["1", "加入短事件", "以一次互動說明人物或場所的重要性，避免全文成為靜態清單。", "One rainy afternoon, I sat there and finally finished a difficult chapter.", "一個下雨的下午，我坐在那裡，終於讀完困難的一章。"], ["1", "比較幫助具體化", "可與過去的自己或另一環境比較，但只比較與核心印象有關的面向。", "Unlike the busy hallway, this corner remains quiet during lunch.", "與熱鬧走廊不同，這個角落午餐時仍很安靜。"], ["1", "意義不要空泛", "說明場所如何影響讀書、休息或人際互動，不只寫 it is important。", "The space helps me regain focus before returning to class.", "這個空間幫助我在回課堂前恢復專注。"], ["1", "結尾回到印象", "回扣開頭的細節並加深意義，不在結尾新介紹另一個場所。", "That simple bench has become a reminder to slow down.", "那張簡單的長椅成了提醒我放慢腳步的地方。"], ["2", "立場先回答問題", "用明確句子回答應不應該、偏好哪個；不要只說此議題有很多意見。", "I support opening the library earlier on school days.", "我支持上課日提早開放圖書館。"], ["2", "理由彼此獨立", "時間與成本可作不同理由；方便與容易使用可能只是同一理由的重述。", "The change would provide shelter and give students extra study time.", "改變可提供遮蔽場所，並讓學生有額外讀書時間。"], ["2", "主張後補機制", "依「主張→為何→具體情境→扣回立場」發展，不把形容詞當論證。", "Early access would let bus passengers study instead of waiting outside.", "提早開放能讓搭公車的學生讀書，不必在外等候。"], ["2", "比較公平基準", "評估方案時統一對象、時間與需求，不能只挑對自己有利的尺度。", "Both proposals should be evaluated by cost and the number of students served.", "兩項提案都應依成本與服務學生人數評估。"], ["2", "反方選合理疑慮", "選成本、安全或公平等真實問題，不把反方寫成不理性的壞人。", "Some teachers may worry that longer hours require more staff.", "有些老師可能擔心延長時間需要更多人力。"], ["2", "讓步後限定回應", "先承認疑慮，再用試行、例外或配套回應，避免宣稱問題不存在。", "This concern is reasonable, so the school could begin with two mornings a week.", "這項顧慮合理，因此學校可先每週試行兩個早晨。"], ["2", "證據不編造", "使用清楚標示的假設例子或親身經驗，不捏造研究、專家或百分比。", "For example, a student arriving at seven could review notes indoors.", "例如，七點到校的學生可以在室內複習筆記。"], ["2", "語氣保留範圍", "用 may、some、under these conditions 保留合理程度，別把可能效果寫成保證。", "The plan may help students who arrive before their classrooms open.", "計畫可能幫助在教室開門前到校的學生。"], ["2", "結論整合而非複製", "簡短重申選擇及判準，不把開頭原句一字不差重抄。", "A limited trial would balance student needs with staffing constraints.", "有限度試行能兼顧學生需求與人力限制。"], ["2", "不硬套五段式", "題目指定兩段就按任務分工；論述功能不等於固定段數。", "My first paragraph explains the need; my second evaluates a practical response.", "我的第一段說明需求，第二段評估實際回應方案。"], ["3", "先盤點看得見的事實", "列人物、位置、動作與物件，先建立共同可見的場景。", "Three students are standing beside a full recycling bin.", "三名學生站在裝滿的回收桶旁。"], ["3", "由全景走向細節", "先一句整體場景，再寫最能回應題目的兩三個細節。", "The courtyard is crowded, and several students are waiting near the bins.", "庭院很擁擠，幾位學生正在回收桶附近等候。"], ["3", "區分觀察和推測", "可見動作用 is doing；不確定情緒或原因用 seems、may，避免自創確定背景。", "One student seems unsure where to put a paper cup.", "一位學生似乎不確定紙杯該放哪裡。"], ["3", "空間詞幫助定位", "使用 beside、in front of、in the background，但只在能幫讀者理解時使用。", "A small sign is attached to the wall behind the bins.", "回收桶後方的牆上貼著小標示。"], ["3", "挑有功能的細節", "若任務談公共秩序，排隊、垃圾與標示比衣服顏色更相關。", "Bottles on the ground block part of the walkway.", "地上的瓶子擋住部分走道。"], ["3", "人物代詞保持清楚", "畫面人物多時，用 the student near the door 等名詞片語避免 he、she 混淆。", "The student holding a blue bag points toward the sign.", "拿藍色袋子的學生指向標示。"], ["3", "第二段依題幹轉向", "看法、經驗、建議是不同任務；不能自動把每張圖都寫成故事續篇。", "To improve this situation, the school could provide clearer labels.", "為了改善情況，學校可以提供更清楚的標籤。"], ["3", "圖片連到主張", "先點出圖片呈現的問題，再說你的建議如何處理該問題。", "Since the bins are full, more frequent collection may help.", "因為回收桶已滿，更頻繁清運可能有幫助。"], ["3", "不要評論未提供資料", "不能從一幅圖斷言人物長期品格、經濟狀況或所有人的動機。", "The picture shows litter, but it does not tell us who left it there.", "圖片呈現垃圾，但未告訴我們是誰留下的。"], ["3", "交卷前對圖查漏", "逐項核對必要畫面細節是否涵蓋、是否寫出圖上沒有的確定事實。", "My description includes the waiting students, the full bins, and the blocked path.", "我的描述包含等候學生、滿溢回收桶及受阻走道。"], ["4", "列每格必要事件", "每張圖各寫一個動作摘要，確保後續故事不漏掉任一必要畫面。", "First, Lin finds a wallet; next, she checks its contents.", "首先，林找到錢包；接著，她查看裡面的東西。"], ["4", "按題意決定圖序", "若題目指定順序就遵守；只有明確容許時才自行重排。", "Following the given order, she takes the wallet to the information desk.", "依照指定順序，她把錢包帶到服務台。"], ["4", "補最小連接事件", "兩格之間只補足理解所需的移動、發現或決定，不插入無關支線。", "After finding an ID card, she looks for someone who can help.", "找到證件後，她尋找能協助的人。"], ["4", "角色物件延續", "同一人物、包包或錢包的名稱與狀態要一致，避免物件憑空消失。", "She keeps the wallet in her hand until a staff member receives it.", "她一直拿著錢包，直到工作人員接手。"], ["4", "轉折有線索", "續寫應承接最後一格的動作或問題，不突然換場景與主角。", "At the desk, she explains where she found the wallet.", "在服務台，她說明找到錢包的地點。"], ["4", "結局解決核心衝突", "遺失物故事可交代尋回或合理處置，不能只有大家很開心。", "The owner arrives and confirms the name on the ID card.", "失主抵達，確認證件上的姓名。"], ["4", "想像維持比例", "可補動機與細節，但不要讓新增情節比題圖主線更長。", "Lin feels relieved when the owner thanks her.", "失主向她道謝時，林感到鬆了一口氣。"], ["4", "敘事連接不單調", "依關係使用 while、after、by the time，不要每句都 Then。", "While the staff call the owner, Lin waits near the entrance.", "工作人員聯絡失主時，林在入口附近等候。"], ["4", "合理時間跨度", "時間跳躍時給提示，避免上一句仍在學校，下一句突然多年後。", "Half an hour later, a worried man enters the building.", "半小時後，一名焦急男子走進建築物。"], ["4", "結尾學習不強加", "只有故事確實支持反思才寫感悟；題目若只要敘事，完整結果即可。", "The wallet is returned safely, and Lin continues her trip home.", "錢包安全歸還，林繼續返家。"], ["5", "先讀標題單位母體", "確認圖表談誰、哪一年、百分比或人數，再寫第一句。", "The chart shows transport choices among one hundred students.", "圖表呈現一百名學生的交通選擇。"], ["5", "找主趨勢不逐項抄", "優先描述最高最低、主要差距或明顯變化，避免數字清單。", "Walking is the most common choice, while buses are the least common.", "步行是最常見選擇，公車則最少。"], ["5", "數字必須精準", "將每個數字與類別逐一對照，必要時先算差再寫比較。", "Fifty students walk, thirty cycle, and twenty take buses.", "五十人步行，三十人騎車，二十人搭公車。"], ["5", "百分比與百分點分開", "20%到30%是增加10個百分點，相對增幅為50%；不混用。", "The share rose from twenty to thirty percent, an increase of ten percentage points.", "比例從百分之二十升至三十，增加十個百分點。"], ["5", "類別圖不寫時間趨勢", "單次調查的兩類高低不能寫成 increased，除非有前後時間資料。", "More students choose walking than cycling in this survey.", "這次調查中，選步行的學生多於騎車。"], ["5", "程度詞匹配數據", "只有差距足夠明顯才用 far more；接近的值可用 slightly 或 roughly equal。", "The two groups are roughly equal in size.", "兩個群體的人數大致相同。"], ["5", "原因用推測語氣", "圖表通常只顯示分布或變化，推測原因用 may reflect 而非 proves。", "The preference may reflect distance, but the chart does not identify the cause.", "偏好可能反映距離，但圖表未指出原因。"], ["5", "個人比較基準一致", "比較自己與圖表時維持相同活動、單位與時間尺度。", "Like half of the surveyed students, I usually walk to school.", "和半數受訪學生一樣，我通常走路上學。"], ["5", "資料缺口要保留", "圖表沒提供年齡或原因就不補造；可明說 cannot tell from the chart。", "The chart does not provide information about travel times.", "圖表未提供通勤時間資訊。"], ["5", "結語不超出資料", "把觀察與自己的建議分開，避免由小樣本斷言所有學生。", "These results suggest that safer crossings could benefit many surveyed students.", "結果顯示，更安全的路口可能使許多受訪學生受益。"], ["6", "先選比較面向", "以費用、彈性、回饋等共同面向列雙欄，防止漏比其中一方。", "I will compare the options in terms of cost, flexibility, and feedback.", "我會從成本、彈性與回饋比較選項。"], ["6", "相似點也能寫", "題目問異同時，至少交代一項有用的共同點，不只列差異。", "Both methods require concentration and regular practice.", "兩種方法都需要專注與規律練習。"], ["6", "按面向成對比較", "同一句或相鄰句比較同一面向，讓讀者不必自行找對應資訊。", "Studying alone offers flexibility, whereas group study offers immediate feedback.", "獨自讀書提供彈性，小組讀書則提供即時回饋。"], ["6", "選擇連回自身需求", "說明自己的時間、學習需求或資源，讓偏好不只是個人喜好宣告。", "Because I often get stuck on difficult problems, feedback matters most to me.", "因為我常卡在難題，回饋對我最重要。"], ["6", "避免貶低另一選項", "承認另一方適合哪些情況，呈現合理取捨。", "Studying alone may still suit people who prefer setting their own pace.", "獨自讀書仍可能適合喜歡自行掌握進度的人。"], ["6", "比較結構完整", "比較成本時用 the cost of A 與 that of B，確保比較的是同類項目。", "The cost of the online course is lower than that of the classroom course.", "線上課程的費用低於實體課程。"], ["6", "不是差異越多越好", "挑兩項能支持結論的差異，保留篇幅發展例子。", "The most useful differences concern feedback and scheduling.", "最有用的差異在於回饋與時間安排。"], ["6", "條件改變可改選擇", "可說明不同情境下偏好會改變，但不要無理由推翻前文立場。", "For revision, I prefer working alone; for new material, I prefer a group.", "複習時我偏好獨自讀書，學新內容時則偏好小組。"], ["6", "避免兩篇分離介紹", "寫完A再寫B時仍需明確比較語，否則只是兩份描述。", "Unlike the first option, the second allows students to ask questions immediately.", "與第一個選項不同，第二個讓學生能立即提問。"], ["6", "最後給判準", "結尾指出哪個面向對本題最重要，因此選哪一方。", "For this subject, access to feedback outweighs the benefit of flexibility.", "對這科而言，取得回饋比時間彈性更重要。"], ["7", "問題具體可觀察", "指出何人、何時遇到何種困難，而非籠統說學校不好。", "At noon, students wait outside because the dining area has too few seats.", "中午時，學生因用餐區座位不足而在外等候。"], ["7", "原因先求合理", "區分原因與症狀；隊伍長可能是流程慢，不一定是空間小。", "The long queue may result from slow payment rather than limited space.", "長隊可能來自付款慢，而非空間不足。"], ["7", "方案直接對因", "若原因是標示不清，方案應改善資訊，而非只增加處罰。", "Clear price labels could help students prepare payment before reaching the counter.", "清楚價目標示能讓學生到櫃台前準備付款。"], ["7", "列執行者與時間", "指出誰負責、何時開始、如何維持，讓方案可操作。", "Two volunteers could guide the queue during the first ten minutes of lunch.", "兩位志工可以在午餐最初十分鐘引導隊伍。"], ["7", "資源與限制入文", "考量教室、人力、預算；有限資源可用小規模試行回應。", "The school could test the plan for one week using existing equipment.", "學校可利用現有設備試行一週。"], ["7", "補作用機制", "解釋措施如何改變行為或流程，不能只說會解決問題。", "Separating payment from collection would prevent one delay from blocking both steps.", "將付款與取餐分開，可避免一次延誤卡住兩個步驟。"], ["7", "不承諾全能解法", "用 reduce、help、improve 等合理目標，不保證消除所有問題。", "The change may reduce waiting, although it will not remove every delay.", "改變可能縮短等待，但無法消除每次延誤。"], ["7", "提出檢查效果方式", "用回饋、等待時間或垃圾量等觀察是否改善，不捏造已成功結果。", "We could compare waiting times before and after the trial.", "我們可以比較試行前後的等待時間。"], ["7", "配套處理副作用", "若限制手機影響緊急聯絡，可設例外或替代聯絡管道。", "Students without phones should also be able to order at the counter.", "沒有手機的學生也應能在櫃台點餐。"], ["7", "結尾指出下一步", "試行、收集回饋再調整，比重複 everyone should work together 更具體。", "After collecting feedback, the school could adjust the process.", "蒐集回饋後，學校可以調整流程。"], ["8", "界定要解釋的現象", "先明確說明發生什麼，再分析為何發生。", "Some students sleep less during weeks with several deadlines.", "有些學生在期限集中的幾週睡得較少。"], ["8", "區分主要與次要原因", "優先發展最相關的原因，別把所有可能性不分輕重地列出。", "One major reason is that several large assignments are due together.", "一個主要原因是數份大型作業同時到期。"], ["8", "因果鏈逐步寫", "從時間不足到睡眠減少，再到注意力下降，補上必要中介。", "Late work reduces sleep, which may make concentration more difficult.", "較晚完成的工作壓縮睡眠，可能使專注更困難。"], ["8", "相關不等於因果", "兩件事一起發生不保證前者造成後者；保留替代解釋。", "High scores and long study hours may be related without one directly causing the other.", "高分與長讀書時間可能相關，但不一定有直接因果。"], ["8", "原因方向不能反轉", "確認是焦慮影響睡眠，還是睡眠不足加劇焦慮；可能雙向時明說。", "Stress may disrupt sleep, and poor sleep may in turn increase stress.", "壓力可能干擾睡眠，睡不好又可能增加壓力。"], ["8", "時間先後不是證明", "先發生A後發生B，只能提供線索，不能單獨確立因果。", "Attendance improved after the change, but other factors may have contributed.", "改變後出席改善，但其他因素也可能有所影響。"], ["8", "例子支持機制", "用具體情境展示原因如何產生結果，而非只重述結果。", "For example, a long commute leaves less time for homework before bedtime.", "例如，長通勤讓睡前可做作業的時間減少。"], ["8", "多因素保留空間", "以 one possible reason、may contribute to 避免把複雜現象歸為單因。", "Workload is one possible factor, rather than the only explanation.", "作業量是一個可能因素，而非唯一解釋。"], ["8", "原因與責怪分開", "分析情境和限制，不把所有問題簡化成人格缺點。", "Limited study space can make preparation difficult even for motivated students.", "有限讀書空間甚至會讓有動機的學生難以準備。"], ["8", "結尾回到解釋目標", "總結最有根據的因果鏈，不突然加入無關政策提案。", "Together, these pressures help explain why rest becomes difficult during busy weeks.", "這些壓力共同解釋了忙碌時為何難以休息。"], ["9", "先定收件者與目的", "對老師、朋友或機構使用相符語氣，第一段明說請求或建議。", "Dear Ms. Lee, I am writing to request a change to our meeting time.", "李老師您好，我寫信想請求調整會議時間。"], ["9", "稱謂遵守題目", "題目提供姓名就使用；不要填自己的真實姓名取代指定角色。", "Dear Alex, thank you for telling me about your plans.", "Alex您好，謝謝你告訴我你的計畫。"], ["9", "背景精簡足夠", "只交代收件者理解請求所需的情況，避免整封信都是故事背景。", "Several members have a required class during our usual meeting period.", "幾位成員在原會議時段有必修課。"], ["9", "請求具體可回覆", "說明希望改哪件事、何時改、需要何種回覆，避免只說 please help。", "Could we move the meeting to Friday at four?", "我們能將會議改到週五四點嗎？"], ["9", "禮貌不等於冗長", "用 Could we 或 Would it be possible to 提問即可，不堆疊過度客套。", "Would it be possible to use Room 201 instead?", "是否可以改用201教室？"], ["9", "理由考慮收件者", "解釋改動如何兼顧對方安排，而不只陳述自己方便。", "This time would allow all members to attend without missing class.", "這個時間能讓所有成員不必缺課便可出席。"], ["9", "建議信避免命令", "對朋友可說 You could consider；不要無理由用 You must。", "You could consider setting a regular bedtime during the school week.", "你可以考慮在上課期間設定固定就寢時間。"], ["9", "投訴信聚焦事實", "清楚描述問題及希望的補救，避免人身攻擊與誇大指控。", "The item arrived damaged, so I would appreciate a replacement.", "物品送達時受損，因此希望能更換。"], ["9", "結尾留下下一步", "禮貌請求回覆或感謝考慮；格式依題目要求選擇。", "Thank you for considering the request. Please let us know what you think.", "謝謝您考慮此請求，請讓我們知道您的想法。"], ["9", "全文角色一致", "核對寫信者、收件者、署名與代詞，避免中途換身分。", "Best regards, Alex.", "敬祝安好，Alex。"], ["10", "先列五項資訊", "活動目的、時間、地點、對象、回覆方式逐一核對。", "The workshop will take place in Room 201 next Friday at four.", "工作坊將於下週五四點在201教室舉行。"], ["10", "邀請與通知分清", "邀請重吸引參與；通知重清楚傳達既定安排，不混淆是否需報名。", "You are invited to join us, but advance registration is required.", "歡迎你參加，但需事先報名。"], ["10", "主旨先說活動", "開頭讓讀者立刻知道邀請參加什麼，不先寫一大段寒暄。", "We would like to invite you to a repair workshop.", "我們想邀請你參加維修工作坊。"], ["10", "日期與星期一致", "若題目提供完整日期與星期，原樣核對，不自行改動或添加矛盾資訊。", "Please check the date and location listed in the invitation.", "請核對邀請函列出的日期與地點。"], ["10", "截止與活動時間分開", "清楚寫 RSVP by 的期限，避免讓讀者當成活動日期。", "Please reply by Wednesday; the event itself is on Friday.", "請於週三前回覆，活動本身在週五舉行。"], ["10", "說明參加者要做什麼", "帶工具、先登記或自行交通等，只寫題目提供或練習情境允許的內容。", "Participants should bring the tools specified in the notice.", "參與者應攜帶通知指定的工具。"], ["10", "亮點具體可信", "介紹能學到什麼或參與什麼，避免只寫 amazing event。", "You will learn how to identify simple problems in everyday objects.", "你將學習辨認日常物品的簡單故障。"], ["10", "資訊易讀分組", "同類資訊放在一起；作文格式下仍以完整句呈現，不任意變成表格。", "The first hour includes a demonstration, followed by guided practice.", "第一小時包含示範，接著是指導練習。"], ["10", "不要遺漏行動指示", "讀完後應知道如何參加或向誰回覆。", "To register, send your name to the club representative.", "報名時請將姓名傳給社團代表。"], ["10", "結尾再次確認目的", "簡短歡迎或提醒，不引入新的活動時間與地點。", "We look forward to learning and repairing things together.", "我們期待一起學習與修理物品。"], ["11", "先拆兩段任務動詞", "第一段可能 describe 或 compare，第二段可能 explain 或 suggest，分開標記。", "First, describe the two scenes; then, explain which you prefer.", "先描述兩個場景，再解釋偏好哪個。"], ["11", "第一段忠於輸入", "先完成圖片、資料或情境描述，不急著把整段變成立場宣言。", "The first scene shows a busy playground, while the second shows a shaded reading area.", "第一個場景是熱鬧遊戲場，第二個是遮蔭閱讀區。"], ["11", "第二段明確換功能", "用回應前段核心的句子轉入經驗、看法或方案。", "Of these two spaces, I would prefer the reading area.", "這兩個空間中，我偏好閱讀區。"], ["11", "選對各段時態", "描述圖表過去資料與表達現在偏好可不同時態，但應有清楚功能依據。", "The survey was conducted last year, but my current routine is different.", "調查在去年進行，但我目前作息不同。"], ["11", "建立跨段共同核心", "第二段的偏好或建議要回應第一段描述的差異或問題。", "Because the second design offers quiet seating, it better meets my need for rest.", "第二個設計提供安靜座位，因此更符合我休息的需求。"], ["11", "分配篇幅給任務", "不要把九成篇幅用於圖片細節，最後只用一句回答主要理由。", "After describing the difference, I will explain my choice with a personal example.", "描述差異後，我會用個人例子說明選擇。"], ["11", "模板讓位題幹", "即使熟悉論述架構，題目要經驗時仍須寫出具體事件。", "Last month, I needed a quiet place to prepare for a presentation.", "上個月，我需要安靜場所準備簡報。"], ["11", "資料與個人經驗分清", "哪些來自提示、哪些是自己的故事或推測，要讓讀者能辨識。", "The picture shows the layout; my experience explains why I value it.", "圖片呈現配置，我的經驗則說明我為何重視它。"], ["11", "結尾同時扣兩段", "以描述中最重要的觀察支撐第二段選擇，形成完整回應。", "The shaded seats would offer the kind of break I needed that day.", "遮蔭座位能提供我那天需要的休息方式。"], ["11", "任務完成逐項打勾", "交卷前按題幹要求核對，不用句型數量或段落長度替代任務完成。", "My draft describes both scenes and gives a reason for my preference.", "我的草稿描述兩個場景，也說明偏好的理由。"]], "groups": [["切題與任務完成", [["切題與任務完成", "Describe a problem and suggest a solution.", "描述一個問題，並提出解法。", "寫得長不能代替缺少的解法。", "拆成任務清單，指出各任務在哪裡完成。"], ["中心思想與立場", "I support a quiet study area because students need a place to concentrate.", "我支持設立安靜讀書區，因為學生需要專心的場所。", "中心句應有穩定立場，不中途換成無關主題。", "用一句話寫中心，核對全文是否一致。"]]], ["內容發展與具體支持", [["內容發展與具體支持", "The room helps students. For example, those without a quiet home can study there.", "這間教室能幫助學生。例如，家裡不安靜的學生可以在那裡讀書。", "具體受益者與情境比重複稱讚更有支持力。", "每個主張補原因、細節、例子或結果。"], ["例子與主張關聯", "The rule saves time because students no longer queue twice.", "這項規定省時，因為學生不再需要排隊兩次。", "例子需支持省時，而非只描述規定顏色。", "說明例子如何支持前一句主張。"]]], ["雙段組織與段落功能", [["段落組織與功能", "Paragraph 1 describes a conflict. Paragraph 2 explains a response and its outcome.", "第一段描述衝突；第二段說明回應與結果。", "兩段應有分工，不是任意切成兩欄。", "替每段命名任務，移走放錯段的內容。"], ["文章順序與整體結構", "Problem → cause → response → result.", "問題→原因→回應→結果。", "讀者需先理解問題與必要背景，再看方案。", "先列提綱，再核對實際順序。"]]], ["句間連貫與邏輯", [["句間邏輯連接", "The bus was delayed, so we arrived late.", "公車誤點，所以我們遲到了。", "連接詞前後需真有因果，出現 so 不代表邏輯成立。", "遮住連接詞，先判斷兩句關係。"], ["指涉與語意銜接", "Mia lent a notebook to Eva. Eva returned it the next day.", "米雅借筆記本給伊娃；伊娃隔天歸還了它。", "it 指筆記本；人物多時 she 可能歧義。", "用人名或具體名詞消除歧義。"]]], ["文法句構與句子控制", [["完整句與句子邊界", "Although the rain continued, the team finished the work.", "雖然雨持續下，團隊仍完成工作。", "Although the rain continued. 單獨使用是從屬片段。", "每句找主句與限定動詞，不用標點數代替判斷。"], ["時態語態與一致", "Yesterday, the students were invited to a workshop.", "昨天，學生受邀參加工作坊。", "過去、複數受事搭配 were invited。", "統一時間線，核對主被動及一致。"], ["子句與句型控制", "The student who organized the event thanked the volunteers.", "籌辦活動的學生感謝志工。", "who 子句修飾 student；主句動詞是 thanked。", "圈出主句骨架，避免只有子句沒有主句。"]]], ["字彙拼字與書寫校訂", [["精準用字與搭配", "The team made a decision after discussing the options.", "團隊討論各選項後做出決定。", "make a decision 是自然搭配；難字多不等於精準。", "先核對意思，再核對自然詞塊。"], ["詞彙變化與重複", "The policy reduces waste. This measure may also lower costs.", "政策減少浪費；這項措施也可能降低成本。", "同義承接不能為求變化而改變原意。", "必要關鍵詞可重複，意思等值才換詞。"], ["拼字與詞形", "Their advice was useful, so I followed it.", "他們的建議很有用，所以我採納了。", "advice 是名詞；advise 是動詞。", "核對詞性、詞形與拼字。"], ["大小寫標點與全文校訂", "After lunch, we visited Tainan. The trip changed my view.", "午餐後我們造訪臺南。這趟旅程改變了我的看法。", "檢查每一句，不只段落首尾；還要讀全文意思。", "先校訂書寫，再查任務、時間與立場一致。"]]]], "topics": [["校園安靜讀書區", "Describe a difficulty students face when studying at school. Then propose a quiet study area and explain how it would help.", "第一段描述在校讀書的困難與具體情境；第二段提議安靜讀書區，說明做法與幫助。", ["study", "school", "quiet", "student"], ["propose", "could", "should", "suggest"]], ["減少午餐浪費", "Describe food waste at school. Then suggest a practical way to reduce it and explain a possible difficulty.", "第一段描述校園午餐浪費與原因；第二段提出可行方案並說明可能困難。", ["food", "waste", "lunch"], ["reduce", "could", "should", "suggest"]], ["手機與專注", "Describe a situation in which phones distracted students. Then propose a balanced classroom rule and explain its benefits.", "第一段描述手機造成分心的情境；第二段提出兼顧需求的規則並說明好處。", ["phone", "distract", "class"], ["rule", "could", "should", "benefit"]], ["社區步行安全", "Describe a safety problem on a route you know. Then suggest an improvement and explain whom it would help.", "第一段描述熟悉路線的安全問題；第二段提出改善方式與受益者。", ["road", "street", "walk", "safe"], ["improve", "could", "should", "help"]], ["團隊意見不同", "Describe a disagreement in a group project. Then explain how the group responded and what you learned.", "第一段描述分組意見不同的情境；第二段說明回應方式與學到的事。", ["group", "team", "project"], ["learn", "respond", "listen", "discuss"]], ["一次計畫改變", "Describe an unexpected change to a plan. Then explain your response and what you would do differently next time.", "第一段描述計畫遇到的意外變化；第二段說明應對方式及下次的改進。", ["plan", "change", "unexpected"], ["next", "learn", "respond", "would"]], ["圖書館新用途", "Describe a need in your community. Then explain how a library could help meet it with a new service.", "第一段描述社區需求；第二段說明圖書館可提供何種新服務與具體幫助。", ["community", "need", "library"], ["service", "could", "help", "provide"]], ["活動參與不足", "Describe why some students avoid school events. Then propose an inclusive activity and explain how to organize it.", "第一段描述部分學生不參加活動的原因；第二段提出包容性的活動及辦理步驟。", ["student", "event", "activity"], ["organize", "could", "include", "step"]], ["網路資訊判讀", "Describe a time when online information seemed doubtful. Then explain how you would check it before sharing.", "第一段描述可疑網路資訊情境；第二段說明分享前的查證步驟與理由。", ["online", "information", "news"], ["check", "source", "compare", "verify"]], ["修理或換新", "Describe an item that stopped working. Then explain whether you would repair or replace it and give reasons.", "第一段描述故障物品與影響；第二段選擇修理或換新並說明理由。", ["item", "broken", "work"], ["repair", "replace", "because", "reason"]], ["互助學習", "Describe a subject or skill that students find difficult. Then propose a peer-learning plan with a specific example.", "第一段描述學生感到困難的科目或能力；第二段提出同儕互助計畫與具體例子。", ["student", "skill", "difficult"], ["peer", "help", "example", "plan"]], ["公共空間共享", "Describe a conflict over a shared space. Then suggest a fair arrangement and explain why it would work.", "第一段描述公共空間的使用衝突；第二段提出公平安排並說明可行理由。", ["space", "share", "conflict"], ["fair", "rule", "arrange", "because"]]], "tips": [["0", "任務拆解", "先把題目中的動詞圈出，逐項安排段落位置。", "Describe a problem and propose a solution.", "描述問題並提出解法。", "只描述問題，即使篇幅長也未完成解法任務。"], ["0", "一句話立場", "先用一句明確主張固定全文方向。", "I support a quiet study area because students need a place to concentrate.", "我支持安靜讀書區，因為學生需要專心的場所。", "不要寫到一半轉成不相關的運動設施。"], ["0", "限制核對", "把對象、情境、時間與指定段落任務列成清單。", "The proposal is intended for students who stay after school.", "這項提案針對放學後留校的學生。", "不要把指定學生群體改成所有市民。"], ["0", "結尾回應題目", "收尾交代立場或回應，不新增未發展的大主題。", "For these reasons, the school should test the plan for one month.", "基於這些理由，學校應試行計畫一個月。", "避免結尾突然轉談科技改變世界。"], ["1", "主張加原因", "每個主張後回答「為什麼」。", "The room would be useful because some students have no quiet place at home.", "這個空間很有用，因為部分學生家裡沒有安靜的地方。", "不要只換字重複「很好、很棒」。"], ["1", "具體情境", "加入人物、行動與場景，讓例子能被想像。", "After practice, Lin could review her notes there while waiting for her bus.", "練習結束後，林可以在那裡邊等公車邊複習筆記。", "不要只寫 everyone can benefit 而沒有細節。"], ["1", "例子接回主張", "例子後說明它支持了哪個理由。", "This would turn waiting time into useful study time.", "這能把等待時間變成有用的讀書時間。", "不要留下與主張無關的故事。"], ["1", "方案可執行", "說清楚誰、何時、做什麼及需要的資源。", "Two volunteers could open the room from four to five each afternoon.", "兩名志工可以每天下午四點到五點開放教室。", "「學校應改善」太抽象，沒有行動內容。"], ["2", "兩段分工", "依題目任務分配內容，不用字數平均代替組織。", "The first paragraph explains the problem; the second presents a response.", "第一段說明問題；第二段提出回應。", "不是把同一段從中間切開。"], ["2", "段落中心句", "每段先建立核心，再放細節支持。", "The main difficulty is the lack of a quiet place after school.", "主要困難是放學後缺乏安靜的場所。", "細節很多卻沒有共同焦點。"], ["2", "合理發展順序", "依背景、問題、回應與結果安排讀者所需資訊。", "Once the problem became clear, we discussed possible solutions.", "問題明確後，我們討論可能的解法。", "不要先寫結果再補大量未交代的背景。"], ["2", "段間接續", "第二段承接第一段指出的需求。", "To address this problem, I suggest opening an unused classroom.", "為了處理這個問題，我建議開放一間閒置教室。", "解法必須對應前段真正的問題。"], ["3", "先判關係再選連詞", "先確認是因果、對比或補充，再決定連接詞。", "The room was small, but it was quiet enough for reading.", "教室很小，但夠安靜，適合閱讀。", "不要用 therefore 連接其實沒有因果的兩句。"], ["3", "代詞找回指", "每個 it、they、this 都要能找回明確對象。", "The school opened a study room. This space soon became popular.", "學校開放了一間讀書室；這個空間很快受到歡迎。", "多個名詞並列後只寫 it 容易不清楚。"], ["3", "必要重複", "關鍵名詞可重複；同義詞必須維持原意。", "The policy reduces waste. This measure also saves money.", "這項政策減少浪費，也能省錢。", "不能為避免重複，把 policy 換成意思不同的詞。"], ["3", "保留合理程度", "沒有充分證據時，用 may、can 或 some 限定範圍。", "The change may help some students manage their time better.", "這個改變可能幫助部分學生更好地安排時間。", "不要輕易寫所有人一定受益。"], ["4", "主句先成立", "先找主詞與主要動詞，再加入子句。", "The students who joined the project learned to cooperate.", "參與計畫的學生學會合作。", "不要只有 who joined the project 而沒有主句。"], ["4", "修補片段句", "although、because 等從屬子句需與主句連接。", "Although we disagreed at first, we eventually reached an agreement.", "雖然一開始意見不同，我們最後仍達成協議。", "Although we disagreed at first. 單獨使用是片段。"], ["4", "句子邊界", "兩個獨立句要用句號、分號或適當連接方式。", "The bus was late, so we walked to school.", "公車誤點，所以我們走路上學。", "不要只用逗號接 The bus was late, we walked to school。"], ["4", "時間線一致", "敘事先定時間，回顧經驗與現在想法可有意切換時態。", "Last year, I joined the team. Now, I understand the value of cooperation.", "去年我加入團隊；現在我理解合作的價值。", "不要無理由在同一事件中任意切換時態。"], ["4", "主被動與一致", "辨認誰做動作、誰接受動作，並核對主詞單複數。", "The students were invited to share their ideas.", "學生受邀分享想法。", "複數主詞不能套用 was invited。"], ["4", "平行結構", "並列的動作保持相同形式。", "The activity helps students communicate, cooperate, and solve problems.", "活動幫助學生溝通、合作及解決問題。", "避免 communicate、cooperating、to solve 任意混用。"], ["5", "搭配整組記", "記核心字與後接名詞或介系詞，不逐字翻中文。", "We made a decision after discussing the options.", "我們討論選項後做出決定。", "不是 do a decision，也不是 discuss about the options。"], ["5", "字族依位置選", "先判需要的詞性，再選形式。", "The activity was successful, and the team worked successfully together.", "活動很成功，團隊也順利合作。", "不要把 success 直接當作形容詞使用。"], ["5", "清楚優先", "用熟悉而精準的字表達意思，避免勉強塞入難字。", "The plan is practical because it uses a room the school already has.", "計畫可行，因為使用的是學校已有的教室。", "華麗字彙不能代替清楚理由。"], ["5", "逐句校訂", "每句核對大寫、標點、拼字及主詞動詞。", "After lunch, we visited Tainan. The trip changed my view.", "午餐後我們造訪臺南；這趟旅行改變我的看法。", "只檢查整段首尾會漏掉中間句子的錯誤。"], ["5", "分輪檢查", "先查任務與內容，再查組織，最後查語言形式。", "First, check the message. Then, check the wording.", "先檢查傳達的內容，再檢查措辭。", "不要只修拼字卻漏掉整段未完成題目任務。"], ["0", "辨認題目動詞", "把 describe、explain、compare、suggest 分成不同任務。", "Describe the event, then explain why it mattered.", "描述事件，再解釋它為何重要。", "敘述事件不等於已解釋意義。"], ["0", "分清主題與任務", "主題告訴你談什麼，任務告訴你要如何處理。", "The topic is online learning; the task is to compare two experiences.", "主題是線上學習；任務是比較兩次經驗。", "不能只介紹線上學習而沒有比較。"], ["0", "先選可支持的立場", "選擇能提出具體理由與例子的立場。", "I favor the earlier opening time because it helps students who arrive by bus.", "我支持提早開門，因為能幫助搭公車早到的學生。", "不要只為顯得特別而選無法發展的立場。"], ["0", "比較題要有共同基準", "兩個選項都按同一面向討論。", "Both plans should be judged by cost and accessibility.", "兩項方案都應依成本及可及性評估。", "不能用甲的價格比較乙的外觀。"], ["0", "看圖不補造事實", "分開畫面可見內容與你的合理推想。", "The student appears worried as she looks at the broken bicycle.", "學生看著壞掉的腳踏車，似乎很擔心。", "不能把未顯示的原因寫成確定事實。"], ["0", "敘事先定核心", "用一句話決定這個故事要呈現什麼改變。", "That afternoon changed the way I asked for help.", "那天下午改變了我求助的方式。", "不是把當天所有瑣事都寫進去。"], ["0", "讀者需要的背景", "只交代理解後續事件所需的人物、時間與目標。", "A day before our presentation, our main speaker became ill.", "簡報前一天，我們的主要講者生病了。", "過長的無關背景會擠壓主要任務。"], ["0", "限定立場適用範圍", "說明主張適合哪些人或情境。", "For short trips within the town, cycling is a practical choice.", "對鎮內短程移動而言，騎車是實用選擇。", "不要把特定情境的優點擴成所有情況。"], ["0", "避免改寫題目充篇幅", "簡短承接題意後立即加入自己的內容。", "Instead of banning phones entirely, I suggest a clear storage rule.", "與其全面禁止手機，我建議制定明確的保管規則。", "整段重述題目不等於提出觀點。"], ["0", "完成雙重要求", "題目若要求優點與問題，兩者都要有可定位內容。", "The plan saves time, but it also requires additional staff.", "計畫省時，但也需要額外人力。", "只寫自己支持的一面可能漏掉指定任務。"], ["0", "用任務句收束", "結尾直接回答題目最核心的要求。", "I would choose the second plan because it offers more students a chance to participate.", "我會選第二項方案，因為它讓更多學生有機會參加。", "不要以與選擇無關的勵志句代替答案。"], ["1", "補上作用機制", "解釋方法如何導致預期效果。", "Clear labels reduce confusion by showing where each item belongs.", "清楚標籤藉由標示物品位置減少混亂。", "不能只宣稱有效卻未說明如何有效。"], ["1", "具體化抽象好處", "把 convenient、helpful 轉成看得見的改變。", "Students would no longer need to cross the campus to print one page.", "學生不必為了印一頁文件穿越校園。", "只用方便、有用，讀者仍不知道好在哪。"], ["1", "使用假設情境", "沒有真實經驗時，以明確假設例子說明。", "For example, a student with a long commute might use the room before class.", "例如，通勤較久的學生可能在上課前使用這間教室。", "不要把想像案例冒充調查或親身事實。"], ["1", "不編造數據", "無可靠來源時，用具體觀察代替假百分比。", "Several classmates said that the signs were difficult to follow.", "幾位同學表示標示不容易看懂。", "不要憑空寫研究證明九成學生支持。"], ["1", "例子後加解讀", "點出細節如何連回主張。", "This example shows why clear roles can prevent duplicated work.", "這個例子說明明確分工為何能避免重複工作。", "例子不能只放著，讓讀者自己猜重點。"], ["1", "寫出方案限制", "承認一項真實困難，再提出處理方式。", "Because space is limited, the school could begin with a small trial.", "由於空間有限，學校可以先小規模試行。", "承認限制後不必把整個方案全盤否定。"], ["1", "處理反對理由", "回應與自己主張最相關的質疑。", "Some may worry about noise, so the room could have a separate discussion area.", "有人可能擔心噪音，因此教室可另設討論區。", "不要捏造極端反對者來輕易駁倒。"], ["1", "區分短長期效果", "同時交代眼前投入與未來效益。", "Training takes time at first, but it can reduce repeated errors later.", "訓練初期耗時，但之後能減少重複錯誤。", "不能把長期可能效果說成立刻保證。"], ["1", "結果要可追蹤", "提出能觀察方案是否有用的方式。", "After two weeks, we could ask users whether waiting times had decreased.", "兩週後，我們可以詢問使用者等待時間是否縮短。", "只說持續改善，卻沒有觀察依據。"], ["1", "細節選擇服務目的", "選最能支持論點的細節，不追求越多越好。", "The extra ramp allowed wheelchair users to enter without assistance.", "新增斜坡讓輪椅使用者能自行進入。", "與可及性無關的牆壁顏色不必大篇幅描述。"], ["1", "分開原因與症狀", "先判斷方案處理的是根本原因還是表面結果。", "Long queues may result from a slow payment process rather than a lack of space.", "長隊可能來自付款流程緩慢，而不是空間不足。", "不能未分析原因就認定擴建一定有效。"], ["2", "提綱用功能標籤", "先寫每段任務，再安排句子。", "Paragraph one presents the difficulty; paragraph two evaluates a response.", "第一段呈現困難；第二段評估回應方式。", "不要把提綱寫成互不相干的單字清單。"], ["2", "一段維持一個中心", "檢查每句是否支援本段核心。", "Every detail in this paragraph explains why the original plan failed.", "本段每個細節都說明原計畫為何失敗。", "想到新主題就插入會破壞段落焦點。"], ["2", "先總後分", "先給讀者方向，再展開原因或例子。", "The change improved access in two ways: longer hours and clearer information.", "這項改變從兩方面改善使用機會：延長時間與提供清楚資訊。", "先堆細節而沒有方向會增加閱讀負擔。"], ["2", "比較採對等安排", "依相同順序介紹兩方，避免偏漏。", "The first option costs less; the second offers more flexibility.", "第一個選項較省錢；第二個更有彈性。", "一方描述很完整，另一方只有一句標籤。"], ["2", "轉折放在需要的位置", "在事件或論點真正改變處標出轉折。", "Just as we were ready to leave, we discovered that the map was missing.", "正準備出發時，我們發現地圖不見了。", "不能每句都用突然製造不存在的轉折。"], ["2", "反思接在事件之後", "先讓讀者看到行動與結果，再說學到什麼。", "After seeing how my teammate responded, I understood the value of patience.", "看到隊友的回應後，我理解了耐心的價值。", "沒有事件支持的感悟容易空泛。"], ["2", "段末承接下一步", "用前段未解決的需求引出後段方案。", "The problem called for a rule that students could follow consistently.", "這個問題需要一項學生能持續遵守的規則。", "段末不要引入下一段完全不處理的新問題。"], ["2", "刪除重複功能句", "兩句若做同一件事，保留較具體的一句。", "A shared calendar prevents schedule conflicts by making plans visible.", "共享行事曆讓安排可見，從而避免行程衝突。", "反覆說行事曆很好不會增加內容發展。"], ["2", "避免機械式開頭", "依實際關係選開頭，不強塞固定序號。", "A further concern is whether the service can continue during holidays.", "另一項顧慮是服務能否在假日期間持續。", "只有兩段也不必硬套 firstly、secondly、finally。"], ["2", "收尾不新增主論點", "最後一句整合已發展內容。", "A modest trial would help us improve the plan before expanding it.", "小規模試行能幫助我們在擴大前改善計畫。", "結尾才提出重大新理由會缺乏支持。"], ["3", "補充與結果分開", "moreover 增加資訊；therefore 引出結果。", "The room is quiet. Moreover, it has enough desks.", "教室很安靜；此外，桌子也足夠。", "安靜不會因此造成桌子足夠。"], ["3", "對比要有共同面向", "對比兩者在同一尺度上的差異。", "The old system required paper forms, whereas the new one uses online requests.", "舊系統需要紙本表格，新系統則使用線上申請。", "不能比較舊系統的速度與新系統的顏色。"], ["3", "具體名詞取代模糊this", "在 this 後補明確名詞。", "This delay forced us to shorten the rehearsal.", "這次延誤迫使我們縮短排練。", "單獨 this 可能回指整段多個事件。"], ["3", "多人敘事用名字", "代詞可能指向兩人時，改用人名。", "Mia told Eva that Mia would bring the camera.", "米雅告訴伊娃，米雅會帶相機。", "she 不一定讓讀者知道究竟是誰。"], ["3", "時間標記一致", "用 before、after、meanwhile 清楚安排事件。", "While the team prepared the room, I checked the equipment.", "團隊準備教室時，我檢查設備。", "同時發生不能寫成已完成後才開始。"], ["3", "因果不要跳步", "補上行動與結果之間必要的中介。", "The signs reduced wrong turns, which helped visitors arrive on time.", "標示減少走錯路，使訪客更能準時抵達。", "標示與成功之間不能省掉所有推理。"], ["3", "讓步不推翻立場", "承認對方合理之處後說明仍支持的理由。", "Although the system is not perfect, it solves the most urgent problem.", "雖然系統不完美，它仍解決了最迫切的問題。", "讓步後不要忘記回到自己的主張。"], ["3", "避免雙重連接", "一組關係使用完整而不衝突的結構。", "Because the road was closed, we took another route.", "因道路封閉，我們改走別條路。", "不要寫 Because ... so ... 連接同一組子句。"], ["3", "限制絕對語氣", "沒有證據支持全部時，使用恰當限定。", "The rule can reduce some distractions during group work.", "規則能減少分組活動中的部分干擾。", "不要一律把 can 改成 will always。"], ["3", "舊資訊帶出新資訊", "以已介紹概念作起點，接上新的細節。", "The club started a repair service. This service later attracted volunteers from other schools.", "社團開辦維修服務；這項服務後來吸引其他學校的志工。", "每句都突然引入陌生主體會難以追蹤。"], ["4", "受詞補足結構", "學動詞時一起記後接結構。", "The teacher encouraged us to explain our reasons.", "老師鼓勵我們說明理由。", "不是 encouraged us explaining。"], ["4", "動名詞接法", "avoid、consider 等動詞後用動名詞。", "We considered changing the schedule to avoid missing the bus.", "我們考慮改時程，以免錯過公車。", "不是 considered to change 或 avoid to miss。"], ["4", "介系詞後接動名詞", "辨認 to 是否為介系詞。", "I look forward to working with the new team.", "我期待和新團隊合作。", "look forward to 後不是 work 原形。"], ["4", "關係子句不取代主句", "移開修飾子句後檢查主句仍完整。", "The rule that we discussed yesterday takes effect next week.", "我們昨天討論的規則下週生效。", "有 discussed 不代表整句已具主句動詞。"], ["4", "修飾主詞要一致", "分詞開頭的動作執行者需與主句主詞合理對應。", "Walking into the room, I noticed the new signs.", "走進教室時，我注意到新標示。", "不要寫 Walking into the room, the signs looked new。"], ["4", "條件句時間", "未來可能條件常用 if 加現在式，主句用 will。", "If the trial succeeds, we will expand the service.", "若試行成功，我們會擴大服務。", "一般此用法不把 if 子句也寫成 will succeed。"], ["4", "不可數名詞一致", "advice、information 等通常視為不可數。", "The information is useful, but we need more evidence.", "資訊很有用，但我們需要更多證據。", "不是 informations are 或 an evidence。"], ["4", "比較對象一致", "確保比較的是同類事物。", "The cost of this plan is lower than that of the previous one.", "這項計畫的成本低於前一項計畫的成本。", "不要把成本直接與整項計畫比較。"], ["4", "間接問句語序", "嵌入問句時用陳述語序。", "We discussed how the system could be improved.", "我們討論系統可以如何改善。", "不是 discussed how could the system be improved。"], ["4", "否定位置核對", "確認 not 否定的是哪個動作或範圍。", "Not every student needs the same kind of support.", "不是每個學生都需要相同支持。", "not every 不等於 every student does not。"], ["5", "常混字成組查", "檢查字形相似但功能不同的詞。", "The change affected attendance and had a positive effect.", "改變影響了出席情況，並產生正面效果。", "此處 affect 為動詞、effect 為名詞。"], ["5", "少用空泛強調詞", "把 very good 換成具體效果，而非只找艱深同義詞。", "The new layout makes the instructions easier to follow.", "新配置讓指示更容易遵循。", "不必每次都把 good 換成 sophisticated。"], ["5", "核對正式度", "依作文情境選擇清楚自然的書面用語。", "The proposal deserves careful consideration.", "這項提案值得審慎考慮。", "正式論述中避免隨意塞入網路縮寫。"], ["5", "詞尾逐字看", "核對複數、第三人稱與過去式詞尾。", "Each student receives a copy of the instructions.", "每位學生都拿到一份指示。", "each student 為單數，不能漏掉 receives 的 s。"], ["5", "避免翻譯腔", "使用英文慣用結構，不依中文逐字搬移。", "The activity helped me understand the problem better.", "活動幫助我更了解問題。", "不要把「讓我更了解」硬拼成不完整結構。"], ["5", "冠詞與指涉同步", "首次引入可數單數通常需冠詞；再次提及用 the。", "We opened a study room. The room soon became popular.", "我們開放一間讀書室；那間教室很快受到歡迎。", "不要沒有交代就一直用 the 指陌生事物。"], ["5", "所有格與複數分開", "確認是多個對象，還是表示誰擁有。", "The students' suggestions improved the plan.", "學生們的建議改善了計畫。", "students 與 students' 功能不同。"], ["5", "避免無意重複詞", "修訂後重讀句子，找多打或漏打的字。", "We decided to discuss the issue after class.", "我們決定下課後討論問題。", "修改句子時常遺留重複的 to 或 the。"], ["5", "朗讀檢查節奏", "用朗讀找過長句、缺少連接或不明指涉。", "The plan is simple. It gives each group a clear role.", "計畫很簡單；它給每組清楚的任務。", "朗讀順口仍不保證文法正確，需另外核對。"], ["5", "最後核對原題", "完成語言校訂後，再對照每項任務。", "My final paragraph explains both the solution and its possible limitation.", "我的最後一段同時說明解法及可能限制。", "不能因句子漂亮就忽略漏答題目。"], ["5", "保留自己的聲音", "套用句型時替換成自己能解釋的內容。", "I used to avoid asking questions, but the project changed that habit.", "我以前避免提問，但這次計畫改變了那個習慣。", "不要背下與自身故事無關的金句當結論。"]], "bank": [["金句句型", "0", "What matters most is ...", "最重要的是……", "提出核心立場", "What matters most is whether the plan meets students' needs.", "最重要的是計畫是否符合學生需求。", "後接名詞或名詞子句；需說明判準。"], ["金句句型", "0", "Rather than ..., we should ...", "與其……，我們應該……", "比較兩種行動", "Rather than blame others, we should discuss possible solutions.", "與其責怪別人，我們應討論可能的解法。", "兩端要對應同一問題，不能只喊口號。"], ["金句句型", "0", "From my perspective, ...", "依我的觀點……", "清楚表明立場", "From my perspective, a fair rule should consider different needs.", "依我的觀點，公平規則應考量不同需求。", "表達立場後仍要補理由。"], ["金句句型", "0", "The real challenge is not ... but ...", "真正的挑戰不是……而是……", "聚焦問題核心", "The real challenge is not finding ideas but putting them into practice.", "真正的挑戰不是找到點子，而是付諸實行。", "兩端保持平行結構，不可任意否定實際困難。"], ["金句句型", "1", "A small change can ...", "小改變可以……", "引入可行方案", "A small change can make our daily routine more efficient.", "小改變可以讓日常流程更有效率。", "後文要交代改變內容及作用機制。"], ["金句句型", "1", "This is especially important for ...", "這對……尤其重要", "指出受益對象", "This is especially important for students who lack a quiet place at home.", "這對家中缺乏安靜場所的學生尤其重要。", "不要只寫 everyone 而缺少具體情境。"], ["金句句型", "1", "By doing so, ...", "這麼做便能……", "解釋行動效果", "By doing so, we can reduce waste without increasing costs.", "這麼做便能減少浪費而不增加成本。", "so 必須指向清楚的前述行動；效果需合理。"], ["金句句型", "1", "Without ..., ... would ...", "若沒有……，……就會……", "說明某條件的價值", "Without clear instructions, new volunteers would feel lost.", "若沒有清楚指示，新志工會不知所措。", "假設語氣應與敘事時間一致。"], ["金句句型", "2", "To address this problem, ...", "為了處理這個問題……", "由問題段轉入解法段", "To address this problem, the school could open an unused classroom.", "為了處理這個問題，學校可以開放閒置教室。", "解法必須回應上一段的問題。"], ["金句句型", "2", "The experience taught me that ...", "這段經驗讓我學到……", "經驗作文收束", "The experience taught me that asking for help is part of learning.", "這段經驗讓我學到，求助也是學習的一部分。", "不要加入前文沒有支持的感悟。"], ["金句句型", "2", "Looking back, I realize that ...", "回顧過去，我明白……", "由事件轉入反思", "Looking back, I realize that listening mattered more than winning the argument.", "回顧過去，我明白傾聽比爭論獲勝更重要。", "回顧事件與現在理解可有意切換時態。"], ["金句句型", "2", "The next step is to ...", "下一步是……", "安排方案次序", "The next step is to invite students to test the new system.", "下一步是邀請學生試用新系統。", "需先交代前一步，避免順序跳躍。"], ["金句句型", "3", "Although ... , ...", "雖然……，但是……", "承認限制後提出主張", "Although the plan requires effort, it may save time later.", "雖然計畫需要投入心力，但之後可能省時。", "although 子句後需主句，不再加 but。"], ["金句句型", "3", "This does not mean that ...", "這不代表……", "避免讀者過度推論", "This does not mean that every student must follow the same routine.", "這不代表每個學生都必須遵循相同作息。", "this 要有明確前文，不能反覆否定而沒立場。"], ["金句句型", "3", "Only when ... can we ...", "只有當……，我們才能……", "強調必要條件", "Only when we understand the problem can we choose a suitable solution.", "只有理解問題，我們才能選擇合適解法。", "句首限制語引起主句倒裝：can we。"], ["金句句型", "3", "Even if ... , ...", "即使……，也……", "假設讓步", "Even if the first attempt fails, we can learn from it.", "即使第一次嘗試失敗，我們也能從中學習。", "even if 不表示事情已經發生。"], ["片語搭配", "1", "make a difference", "造成改變／發揮影響", "具體說明改善", "A clear sign can make a difference to first-time visitors.", "清楚的標示能幫助初次到訪的人。", "說清楚對誰有何影響，不只用抽象稱讚。"], ["片語搭配", "1", "put ... into practice", "將……付諸實行", "從想法走向行動", "We put our recycling plan into practice last month.", "我們上個月實行了回收計畫。", "practice 此處是名詞，不是 practise 的動詞位置。"], ["片語搭配", "1", "take practical steps to", "採取實際步驟來……", "寫可執行解法", "We should take practical steps to reduce food waste.", "我們應採取實際步驟減少食物浪費。", "後面仍需列出實際步驟。"], ["片語搭配", "1", "provide ... with ...", "提供某人某物", "寫資源支持", "The school provided volunteers with basic training.", "學校提供志工基礎訓練。", "人放在 provide 後，資源接 with。"], ["片語搭配", "3", "take ... into account", "將……納入考量", "承認不同條件", "The rule should take students' travel time into account.", "規則應將學生通勤時間納入考量。", "不是 take account 某事的逐字拼接。"], ["片語搭配", "3", "strike a balance between", "在……之間取得平衡", "比較需求", "We need to strike a balance between convenience and privacy.", "我們需要在便利與隱私之間取得平衡。", "between 後要有兩個可比較的面向。"], ["片語搭配", "3", "at the expense of", "以犧牲……為代價", "說明取捨", "Convenience should not come at the expense of safety.", "便利不應以犧牲安全為代價。", "通常帶負面取捨含意，不當作單純增加。"], ["片語搭配", "3", "in the long run", "長期而言", "比較短期與長期", "Regular maintenance saves money in the long run.", "定期維護長期而言可以省錢。", "需要合理時間尺度，不能當作萬用結尾。"], ["片語搭配", "4", "be willing to", "願意做……", "人物態度與行動", "She was willing to listen to a different opinion.", "她願意聆聽不同意見。", "to 後接原形動詞。"], ["片語搭配", "4", "have difficulty V-ing", "做某事有困難", "描述問題", "Some students have difficulty finding reliable information.", "有些學生難以找到可靠資訊。", "不是 have difficulty to find。"], ["片語搭配", "4", "enable someone to V", "使某人能夠……", "解釋工具或方案效果", "The checklist enables writers to review their work systematically.", "檢查表讓寫作者能有系統地檢視作品。", "不可漏掉人或 to。"], ["片語搭配", "4", "learn from a mistake", "從錯誤學習", "經驗反思", "I learned from my mistake and prepared a backup plan.", "我從錯誤中學習，並準備備案。", "需交代錯誤與後續行動的連結。"], ["片語搭配", "5", "raise awareness of", "提升對……的認識", "宣導活動", "The campaign raised awareness of water conservation.", "活動提升了人們對節水的認識。", "awareness 通常不可數，搭配 of。"], ["片語搭配", "5", "reach an agreement", "達成協議", "合作與衝突", "After listening to each other, we reached an agreement.", "彼此傾聽後，我們達成協議。", "reach 直接接 agreement，不加 to。"], ["片語搭配", "5", "take responsibility for", "為……負責", "人物成長", "I took responsibility for correcting the error.", "我負起更正錯誤的責任。", "for 後接名詞或動名詞。"], ["片語搭配", "5", "devote time to V-ing", "投入時間做……", "努力與準備", "We devoted time to practicing our presentation.", "我們投入時間練習簡報。", "to 是介系詞，後接動名詞。"], ["主題字庫", "0", "feasible / practical", "可行的／實用的", "評估方案", "The idea is feasible because it uses existing resources.", "這個想法可行，因為它運用現有資源。", "不是所有好點子都在資源限制下可行。"], ["主題字庫", "0", "priority / urgent", "優先事項／緊急的", "排列問題重要性", "Safety should be our first priority.", "安全應是我們最優先的事項。", "priority 是名詞，urgent 是形容詞。"], ["主題字庫", "1", "accessible / inclusive", "容易取得或使用的／包容的", "公共服務與教育", "An accessible website helps create a more inclusive service.", "容易使用的網站有助於建立更包容的服務。", "不要只用形容詞，補具體措施。"], ["主題字庫", "1", "resource / constraint", "資源／限制", "計畫可行性", "Limited resources forced us to simplify the plan.", "有限資源迫使我們簡化計畫。", "resource 可數；constraints 可指時間或預算限制。"], ["主題字庫", "1", "initiative / participation", "倡議或主動性／參與", "校園活動", "The initiative encouraged participation from quieter students.", "這項倡議鼓勵較安靜的學生參與。", "participation 通常不可數，不直接當作人。"], ["主題字庫", "2", "setback / adjustment", "挫折／調整", "敘事轉折", "After the setback, we made an adjustment to our schedule.", "遭遇挫折後，我們調整了時程。", "具體說明挫折與調整，而非只有抽象名詞。"], ["主題字庫", "2", "insight / perspective", "領悟／觀點", "經驗反思", "The conversation gave me a new perspective on teamwork.", "談話讓我對團隊合作有了新觀點。", "觀點改變要能回扣故事。"], ["主題字庫", "3", "consequence / trade-off", "後果／取捨", "方案評估", "The decision involves a trade-off between speed and accuracy.", "這項決定涉及速度與準確度的取捨。", "consequence 可正可負；不要固定翻成懲罰。"], ["主題字庫", "3", "evidence / assumption", "證據／假設", "合理論述", "We should check the evidence rather than rely on assumptions.", "我們應查核證據，而非依賴假設。", "evidence 通常不可數，不能寫 an evidence。"], ["主題字庫", "3", "respectful / considerate", "尊重人的／體貼的", "人際互動", "A respectful discussion allows everyone to explain their concerns.", "相互尊重的討論讓每個人能說明自己的顧慮。", "respectful 不等於 respectable「值得尊敬的」。"], ["主題字庫", "4", "respond / response", "回應（動詞／名詞）", "行動與反應", "Her calm response helped us respond more thoughtfully.", "她冷靜的回應幫助我們更周全地應對。", "不能把 response 放在需要動詞的位置。"], ["主題字庫", "4", "confidence / confident", "信心／有信心的", "人物成長", "Practice gave me confidence, and I became more confident.", "練習給了我信心，我也變得更有自信。", "become 後描述狀態常接 confident。"], ["主題字庫", "4", "cooperate / cooperation", "合作（動詞／名詞）", "團隊題材", "Cooperation improves when people are willing to cooperate.", "當人們願意合作時，合作情況會改善。", "cooperate 常搭配 with 人，不直接接受詞人。"], ["主題字庫", "5", "effective / efficient", "有效的／有效率的", "評估方法", "The method was effective but required too much time to be efficient.", "方法有效，但耗時過多，效率不佳。", "達成效果與節省資源是不同判準。"], ["主題字庫", "5", "reliable / responsible", "可靠的／負責任的", "描述人物或資訊", "A responsible writer checks whether a source is reliable.", "負責任的寫作者會查核來源是否可靠。", "可靠不等於擔負責任，不隨意互換。"], ["主題字庫", "5", "sustainable / temporary", "可持續的／暫時的", "環境及長期方案", "We need a sustainable solution rather than a temporary fix.", "我們需要可持續的解法，而非暫時補救。", "sustainable 不只指環保，也可指能長期維持。"]], "structures": [["敘事文／經驗反思", "經驗、衝突、改變、學到什麼", "背景與目標 → 意外或困難 → 當下反應", "解決行動 → 結果 → 回扣具體反思", "以過去式敘述主要事件；現在式可表達如今的理解。", "Describe a time you misunderstood a teammate. Explain how you responded and what you learned.", "描述一次誤解隊友的經驗，說明回應與學習。", "Last semester, I misunderstood why my teammate missed a meeting.", "上學期，我誤解了隊友缺席會議的原因。", "After listening to her explanation, I learned to ask before judging.", "聽完她的解釋後，我學會先詢問再判斷。", "不要只有事件流水帳；反思必須由事件支持。"], ["描述文／人物場所", "描述特徵、感受與意義", function modelLibrary(){return `<section class="card"><h1>作文範文與解析庫</h1><p>目前實際收錄 ${DATA.models.length} 篇原創導寫範文。同類保留共用組織句型，各篇採不同情境與題材；適合對照仿寫，不宜整段套用於所有題目。字數由英文內容即時計算；同一篇不跨類重複計數。</p><div class="row"><label>寫作架構 <select id="modelType"><option value="">全部12類</option>${DATA.structures.map((t,i)=>`<option value="${i}" ${modelState.type===String(i)?'selected':''}>${t[0]}（${DATA.models.filter(m=>m.type===i).length}篇）</option>`).join('')}</select></label><input id="modelSearch" aria-label="搜尋範文" placeholder="搜尋題材、英文或解析" value="${esc(modelState.q)}"></div><p id="modelCount"></p><div id="modelCards" class="grid"></div></section><div id="modelReading"></div>`}
function modelWords(m){return words(m.en.join(' ')).length}
function drawModels(){const rows=DATA.models.filter(m=>(modelState.type===''||m.type===+modelState.type)&&JSON.stringify(m).toLowerCase().includes(modelState.q.toLowerCase()));$('modelCount').textContent=`符合 ${rows.length} 篇`;$('modelCards').innerHTML=rows.map(m=>`<article class="card"><span class="badge">${esc(DATA.structures[m.type][0])}</span><h2>${esc(m.title)}</h2><p>${modelWords(m)}個英文單字｜${m.en.length}段</p><button data-model="${m.id}">閱讀範文與解析</button></article>`).join('')||'<p>沒有符合的範文。</p>';document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>readModel(b.dataset.model))}
function readModel(id){const m=DATA.models.find(m=>m.id===id);if(!m)return;modelState.selected=id;$('modelReading').innerHTML=`<section class="card"><h1>${esc(m.title)}</h1><span class="badge">原創教學範文｜${modelWords(m)}個英文單字</span><div class="note"><b>寫作任務</b><p>${esc(m.prompt)}</p></div>${m.en.map((p,i)=>`<h2>第${i+1}段</h2><p style="font:20px/1.9 Georgia,serif">${esc(p)}</p><p>${esc(m.zh[i])}</p>`).join('')}<h2>架構與內容解析</h2>${m.analysis.map((a,i)=>`<div class="note"><b>${['第一段功能','第二段功能','關鍵句型與銜接','易錯提醒'][i]||'補充'}</b><p>${esc(a)}</p></div>`).join('')}<label>我的仿寫構想（自動保存）<textarea id="modelNote" style="min-height:120px;font-family:inherit">${esc((S.modelNotes||{})[m.id]||'')}</textarea></label></section>`;$('modelNote').oninput=e=>{S.modelNotes=S.modelNotes||{};S.modelNotes[m.id]=e.target.value;save()};$('modelReading').scrollIntoView({block:'start'})}
function bindModels(){drawModels();$('modelType').onchange=e=>{modelState.type=e.target.value;modelState.selected='';drawModels();$('modelReading').innerHTML=''};$('modelSearch').oninput=e=>{modelState.q=e.target.value;drawModels()};if(modelState.selected)readModel(modelState.selected)}

try{const raw=localStorage.getItem(KEY);if(raw){const v=JSON.parse(raw);if(v&&v.drafts&&Array.isArray(v.events))S=v}}catch(e){$('status').textContent='儲存資料無法讀取；請先匯出備份或保留原始資料。'}

function save(){try{localStorage.setItem(KEY,JSON.stringify(S));$('status').textContent='已自動保存於本機'}catch(e){$('status').textContent='本機儲存失敗，請立即匯出 JSON 備份。'}}
function go(v){page=v;render();scrollTo(0,0)}function render(){const nav=[['home','學習首頁'],['learn','六能力／15細類'],['structures','作文題型結構庫'],['models','240篇範文與解析'],['topics','作文題庫'],['write','雙段寫作'],['tips','作文秘笈 BANK'],['bank','金句／片語／字庫'],['guide','檢查說明']];$('nav').innerHTML=nav.map(([k,v])=>`<button data-go="${k}" class="${page===k?'active':''}">${v}</button>`).join('');$('main').innerHTML=({home,learn,topics,write,tips,bank,structures,models:modelLibrary,guide,result:resultView}[page]||home)();bind()}
function home(){return `<section class="card"><h1>先完成任務，再用證據修訂作文</h1><div class="note"><b>作文 BANK｜240篇導寫範文版</b><p><button data-go="models">開啟240篇完整範文與解析</button></p><p>12種架構各20個不同題材，每篇120–160個英文單字，附逐段繁體中文翻譯及解析。同類保留共用組織句型，供比較與仿寫。</p><p><button data-go="structures">新增：12種作文題型結構</button></p><p>16個金句句型＋16組實用片語＋16組主題字詞；另有${DATA.tips.length}筆寫作秘笈。</p><div class="row"><button data-go="bank">開啟48筆金句／片語／字庫</button><button data-go="tips">開啟${DATA.tips.length}筆作文秘笈</button></div></div><p>拆解題目 → 規劃兩段 → 完成草稿 → 檢查線索 → 對照細類教學 → 換題練習。</p><div class="row"><span class="badge">6大能力</span><span class="badge">15個細類</span><span class="badge">12道原創雙段題</span></div><div class="note">${limits}</div><button data-go="topics">選擇寫作題目</button></section><div class="grid">${DATA.groups.map((g,i)=>`<section class="card"><h2>${i+1}. ${g[0]}</h2><p>${g[1].length}個細類，含中英示例、判斷說明與修訂動作。</p><button data-learn="${i}">查看教學</button><button data-probe="${i}">本能力獨立新任務</button></section>`).join('')}</div>`}
function learn(){return `<h1>六能力／15細類學習目錄</h1><p>以下是原創教學示例，不是新題考試。目錄歸屬不是唯一錯因；不把舊紀錄直接判成細類。</p>${DATA.groups.map((g,i)=>`<section class="card" id="group${i}"><h2>${g[0]}｜${g[1].length}細類</h2>${g[1].map(t=>`<details open><summary>${t[0]}</summary><blockquote>${esc(t[1])}<br>${t[2]}</blockquote><p><b>判斷與中文說明：</b>${t[3]}</p><div class="note"><b>現在練什麼：</b>${t[4]}</div></details>`).join('')}<button data-probe="${i}">用不同題目練這項能力</button></section>`).join('')}`}
function topics(){return `<h1>原創作文題庫｜12題</h1><p>每題包含兩段任務。前6題可作一般練習；後6題同時作各能力的一次獨立新任務。一般練習可重寫，新任務須使用未開啟過的題目。</p><div class="grid">${DATA.topics.map((t,i)=>`<article class="card"><span class="badge">W${String(i+1).padStart(2,'0')}</span><h2>${t[0]}</h2><p>${t[1]}</p><p>${t[2]}</p><button data-topic="${i}">開始寫作</button></article>`).join('')}</div>`}
function dk(){return topic+'|'+phase+'|'+(target??'')+'|'+round}function draft(){return S.drafts[dk()]||(S.drafts[dk()]={p1:'',p2:'',plan:'',topic,phase,target,round})}
function openTopic(i){topic=i;phase='practice';target=null;round='';draft();save();go('write')}
function probe(i){const t=i+6,used=Object.values(S.drafts).some(d=>d.topic===t&&d.phase!=='newtask')||S.events.some(e=>e.topic===t);if(used){alert('此能力的新任務已開啟或已使用，不再列為獨立新任務。你仍可到題庫一般練習。');return}topic=t;phase='newtask';target=i;round='';draft();save();go('write')}
function words(s){return s.match(/[A-Za-z]+(?:['’-][A-Za-z]+)*/g)||[]}
function write(){const t=DATA.topics[topic],d=draft();return `<h1>${t[0]}</h1><p><span class="badge">${phase==='newtask'?'獨立新任務':phase==='revision'?'同輪修訂':'一般練習'}</span> ${target!==null?DATA.groups[target][0]:''}</p><section class="card"><p>${t[1]}</p><p>${t[2]}</p><label>任務清單與兩段提綱<textarea id="plan" style="min-height:100px;font-family:inherit" placeholder="第一段要完成什麼？第二段要完成什麼？">${esc(d.plan)}</textarea></label></section><div class="grid"><section class="card"><label for="p1">第一段</label><textarea id="p1" spellcheck="true">${esc(d.p1)}</textarea><p id="n1"></p></section><section class="card"><label for="p2">第二段</label><textarea id="p2" spellcheck="true">${esc(d.p2)}</textarea><p id="n2"></p></section></div><div class="note">${limits} 瀏覽器拼字提示與本工具的線索檢查分開，並非自動評閱。</div><button id="submit">保存本次作文並查看線索</button>`}
function checks(d){const t=DATA.topics[d.topic],all=d.p1+' '+d.p2,ws=words(all),low=all.toLowerCase(),has=(a,s=low)=>a.filter(w=>new RegExp('\\b'+w+'\\b','i').test(s)),support=['because','example','instance','therefore','result'],links=['however','because','therefore','although','instead','moreover'],clauses=['although','because','while','which','who','if'];const fragments=all.split(/[.!?]+/).filter(s=>words(s).length).length,unique=new Set(ws.filter(w=>w.length>=4).map(w=>w.toLowerCase())).size;return [
{ok:ws.length>=80&&has(t[3]).length>0&&has(t[4]).length>0,e:`總字數 ${ws.length}；題目詞群 ${has(t[3]).join(', ')||'未找到'}；任務詞群 ${has(t[4]).join(', ')||'未找到'}`,rule:'80字及兩組預設任務詞群；不判斷切題與任務真正完成。'},
{ok:words(d.p1).length>=40&&words(d.p2).length>=40&&has(support).length>0,e:`第一段 ${words(d.p1).length}字；第二段 ${words(d.p2).length}字；支持語詞 ${has(support).join(', ')||'未找到'}`,rule:'每段40字及預設支持語詞；不判斷例子合理充分。'},
{ok:!!d.p1.trim()&&!!d.p2.trim(),e:`第一段${d.p1.trim()?'有':'無'}文字；第二段${d.p2.trim()?'有':'無'}文字`,rule:'只確認兩欄有文字，不判斷段落分工。'},
{ok:has(links).length>=2,e:`連接詞種類 ${has(links).length}：${has(links).join(', ')||'未找到'}`,rule:'至少2種預設連接詞；不判定邏輯與代詞指向。'},
{ok:fragments>=7&&has(clauses).length>0,e:`標點分段片段 ${fragments}；子句標記 ${has(clauses).join(', ')||'未找到'}`,rule:'7個片段及子句標記；不等於7個完整正確句子。'},
{ok:unique>=45&&[d.p1,d.p2].every(s=>/^[A-Z]/.test(s.trim())&&/[.!?]["']?$/.test(s.trim())),e:`至少4字元的不同英文詞 ${unique}；段首大寫與段末標點${[d.p1,d.p2].every(s=>/^[A-Z]/.test(s.trim())&&/[.!?]["']?$/.test(s.trim()))?'符合':'待檢查'}`,rule:'45個不同字及段落首尾；不检查拼字、精準用字與每句標點。'}]}
function submit(){const d=draft();if(!d.p1.trim()&&!d.p2.trim())return alert('請先輸入作文。');const e={id:crypto.randomUUID(),date:new Date().toISOString(),...structuredClone(d),checks:checks(d),review:'待老師複核'};S.events.push(e);if(phase==='newtask')delete S.drafts[dk()];save();currentResult=e;go('result')}
function resultView(){const e=currentResult;if(!e)return '<p>尚未選擇紀錄。</p>';return `<h1>作文線索檢查｜待老師複核</h1><p>${DATA.topics[e.topic][0]} · ${new Date(e.date).toLocaleString('zh-TW')}</p><div class="note">${limits} 以下每項均保留證據；沒有自動「通過作文」判定。</div><div class="grid">${e.checks.map((c,i)=>`<article class="card"><h2>${DATA.groups[i][0]}</h2><span class="badge ${c.ok?'ok':'warn'}">${c.ok?'形式線索符合':'未符合提醒門檻'}</span><p>${esc(c.e)}</p><p class="muted">${c.rule}</p><button data-learn="${i}">查看細類與修訂方法</button><button data-probe="${i}">獨立新任務</button></article>`).join('')}</div><section class="card"><h2>本次原文快照</h2><p style="white-space:pre-wrap">${esc(e.p1)}</p><p style="white-space:pre-wrap">${esc(e.p2)}</p><button id="revise">保留原稿並開始同輪修訂</button></section>`}
function guide(){return `<section class="card"><h1>檢查與學習紀錄使用說明</h1><p>${limits}</p><h2>六項檢查的實際範圍</h2>${checks({p1:'',p2:'',topic:0}).map((c,i)=>`<p><b>${DATA.groups[i][0]}：</b>${c.rule}</p>`).join('')}<h2>如何判讀</h2><ol><li>先查看未符合提醒門檻的項目。</li><li>回到原稿、題目與具體線索核對。</li><li>利用15細類目錄修訂，再嘗試不同題目。</li></ol><div class="note">40字／段、7個片段、45個不同字等皆為本APP提醒門檻，不是學測評分標準。合理同義表達可能未命中詞群；命中詞群也不代表切題。未符合不等於能力不足，符合不等於作文合格。</div><p>每項能力目前一份獨立新任務（後6題）；用過即停用，不是每個細類都有新題庫。一般重寫仍可使用。所有新作文只列待老師複核，沒有線上核准按鈕或自動通過率。</p><p>「尚待確認」代表證據不足，不自動指定個人錯因。本APP只匯入相同結構的備份，不擅自轉換其他系統舊資料。</p></section>`}
let tipFilter={q:'',group:''};
function tips(){return `<section class="card"><h1>英文作文秘笈 BANK</h1><p>${DATA.tips.length}筆實用技巧，涵蓋六大能力。例句為教學示例，需依題意改寫。</p><div class="row"><input id="tipSearch" placeholder="搜尋技巧、句型或常見錯法" aria-label="搜尋秘笈"><select id="tipGroup" aria-label="能力分類"><option value="">全部六能力</option>${DATA.groups.map((g,i)=>`<option value="${i}">${g[0]}</option>`).join('')}</select></div><p id="tipCount"></p><div style="overflow:auto"><table style="min-width:720px"><thead><tr><th>能力／秘笈</th><th>作法</th><th>中英例句</th><th>常見錯法</th></tr></thead><tbody id="tipRows"></tbody></table></div></section>`}
function drawTips(){const rows=DATA.tips.filter(t=>(tipFilter.group===''||t[0]===tipFilter.group)&&t.join(' ').toLowerCase().includes(tipFilter.q.toLowerCase()));$('tipCount').textContent=`符合 ${rows.length}／${DATA.tips.length} 筆`;$('tipRows').innerHTML=rows.map(t=>`<tr><td><span class="badge">${DATA.groups[+t[0]][0]}</span><br><b>${t[1]}</b></td><td>${t[2]}</td><td>${esc(t[3])}<br>${t[4]}</td><td>${t[5]}</td></tr>`).join('')||'<tr><td colspan="4">沒有符合的秘笈。</td></tr>'}
let bankFilter={q:'',kind:'',group:''};
function bank(){return `<section class="card"><h1>作文金句／片語／字庫 BANK</h1><p>48筆原創教學用語：16個金句句型、16組片語、16組主題字詞。不是名人引言；請依題意與自己的經驗改寫，避免整句硬套。</p><div class="row"><input id="bankQ" aria-label="搜尋用語" placeholder="搜尋英文、中文、情境或錯法"><select id="bankKind" aria-label="用語類型"><option value="">全部類型</option><option>金句句型</option><option>片語搭配</option><option>主題字庫</option></select><select id="bankGroup" aria-label="六大能力"><option value="">全部六能力</option>${DATA.groups.map((g,i)=>`<option value="${i}">${g[0]}</option>`).join('')}</select><button id="bankReset">清除篩選</button></div><p id="bankTotal"></p><div style="overflow:auto"><table style="min-width:760px"><thead><tr><th>類型／能力</th><th>核心用語</th><th>情境與中英例句</th><th>使用提醒</th></tr></thead><tbody id="bankRows"></tbody></table></div></section>`}
function drawBank(){const rows=DATA.bank.filter(t=>(!bankFilter.kind||t[0]===bankFilter.kind)&&(bankFilter.group===''||t[1]===bankFilter.group)&&t.join(' ').toLowerCase().includes(bankFilter.q.toLowerCase()));$('bankTotal').textContent=`顯示 ${rows.length}／${DATA.bank.length} 筆｜一頁完整表格`;$('bankRows').innerHTML=rows.map(t=>`<tr><td>${t[0]}<br><span class="badge">${DATA.groups[+t[1]][0]}</span></td><td><b>${esc(t[2])}</b><br>${t[3]}</td><td><b>${t[4]}</b><blockquote>${esc(t[5])}<br>${t[6]}</blockquote></td><td>${t[7]}</td></tr>`).join('')||'<tr><td colspan="4">沒有符合的用語。</td></tr>'}
function structures(){return `<h1>作文題型結構庫｜12種寫作架構</h1><div class="note"><b>新增120筆題型專屬秘笈｜每類10筆</b><p>每個架構下直接列出審題、發展、轉折、收束及校訂作法。</p></div><section class="card"><p>大考中心考試說明列出簡函、看圖、圖表及主題寫作。以下12類是教學拆解，不是官方12種固定題型；同一題可能結合多種任務。</p><p>雙段架構是練習工具，實際考試以題目指定的段數、內容、字數與格式為準。句型是示例，不是完整範文。</p><a href="https://www.ceec.edu.tw/xmdoc?xsmsid=0J018585845010094026" target="_blank" rel="noopener">大考中心考試說明（需連網）</a><div class="row"><label>選擇架構 <select id="structureFilter"><option value="">全部12種</option>${DATA.structures.map((t,i)=>`<option value="${i}">${t[0]}</option>`).join('')}</select></label></div></section>${DATA.structures.map((t,i)=>`<section class="card structureCard" data-structure="${i}"><h2>${i+1}. ${t[0]}</h2><button data-modeltype="${i}">閱讀本架構20篇範文與解析</button><p><b>辨認任務：</b>${t[1]}</p><div class="grid"><div class="note"><b>第一段結構</b><p>${t[2]}</p></div><div class="note"><b>第二段結構</b><p>${t[3]}</p></div></div><p><b>時態與句構：</b>${t[4]}</p><details open><summary>原創教學題與中英句型</summary><blockquote>${esc(t[5])}<br>${t[6]}</blockquote><p>${esc(t[7])}<br>${t[8]}</p><p>${esc(t[9])}<br>${t[10]}</p></details><div class="note warn"><b>常見錯法：</b>${t[11]}</div><h3>本題型專屬秘笈｜10筆</h3><div class="structureTips">${DATA.structureTips.filter(x=>+x[0]===i).map((x,n)=>`<div class="note"><b>${n+1}. ${esc(x[1])}</b><p>${esc(x[2])}</p><blockquote class="structureExample"><b>英文例句</b><br>${esc(x[3])}<br><span class="muted">${esc(x[4])}</span></blockquote></div>`).join('')}</div><label>我的雙段提綱（自動保存）<textarea data-outline="${i}" style="min-height:140px;font-family:inherit" placeholder="第一段：核心、細節、例子。第二段：回應、理由、結尾。">${esc((S.outlines||{})[i]||'')}</textarea></label><p class="muted">檢查：兩項任務都有完成？例子支持主張？前後有承接？沒有加入圖片或資料未提供的事實？</p></section>`).join('')}`}
function bind(){if(page==='models')bindModels();if(page==='structures'){$('structureFilter').onchange=e=>document.querySelectorAll('.structureCard').forEach(c=>c.hidden=e.target.value!==''&&c.dataset.structure!==e.target.value);document.querySelectorAll('[data-outline]').forEach(t=>t.oninput=()=>{S.outlines=S.outlines||{};S.outlines[t.dataset.outline]=t.value;save()})}if(page==='bank'){for(const[id,k]of [['bankQ','q'],['bankKind','kind'],['bankGroup','group']]){$(id).value=bankFilter[k];$(id).addEventListener(k==='q'?'input':'change',e=>{bankFilter[k]=e.target.value;drawBank()})}$('bankReset').onclick=()=>{bankFilter={q:'',kind:'',group:''};render()};drawBank()}if(page==='tips'){$('tipSearch').value=tipFilter.q;$('tipGroup').value=tipFilter.group;drawTips();$('tipSearch').oninput=e=>{tipFilter.q=e.target.value;drawTips()};$('tipGroup').onchange=e=>{tipFilter.group=e.target.value;drawTips()}}if(page==='write'){for(const k of ['p1','p2','plan'])$(k).oninput=()=>{draft()[k]=$(k).value;save();counts()};function counts(){$('n1').textContent=words(draft().p1).length+'字';$('n2').textContent=words(draft().p2).length+'字'}counts();$('submit').onclick=submit}if(page==='result')$('revise').onclick=()=>{const e=currentResult;topic=e.topic;phase='revision';target=e.target;round=e.id;S.drafts[dk()]={p1:e.p1,p2:e.p2,plan:e.plan,topic,phase,target,round};save();go('write')};}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go)go(b.dataset.go);if(b.dataset.modeltype!==undefined){modelState={type:b.dataset.modeltype,q:'',selected:''};go('models')}if(b.dataset.topic!==undefined)openTopic(+b.dataset.topic);if(b.dataset.probe!==undefined)probe(+b.dataset.probe);if(b.dataset.learn!==undefined){go('learn');$('group'+b.dataset.learn).scrollIntoView()}if(b.dataset.event){currentResult=S.events.find(e=>e.id===b.dataset.event);go('result')}});render();
</script></html>
