<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英文作文 LearningOS｜六大能力 × 15細類</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f6fb;color:#193149;font:17px/1.75 system-ui}header{background:#142d47;color:white;padding:24px 5%}header b{font-size:26px}nav{display:flex;gap:8px;flex-wrap:wrap;padding:16px 5%;background:white;position:sticky;top:0;z-index:2}button,select,input{font:inherit;padding:10px 14px;border:1px solid #ccd7e5;border-radius:10px;background:white;color:#193149}button{cursor:pointer}button:hover,button.active{background:#dceff1}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:30px}h2{font-size:24px}.card{background:white;padding:24px;border:1px solid #d8e2ee;border-radius:18px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.note{border-left:4px solid #008a8d;background:#eaf5f5;padding:16px;margin:14px 0}.muted{color:#5e7386;font-size:15px}textarea{width:100%;min-height:230px;padding:16px;font:18px/1.8 Georgia,serif;border:1px solid #bacadb;border-radius:12px;resize:vertical}details{padding:12px 0}summary{cursor:pointer;font-weight:650}blockquote{margin:12px 0;padding:14px;background:#f3f6fa}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.badge{background:#eaf2fc;border-radius:20px;padding:4px 10px;font-size:14px}.warn{background:#fff2dc}.ok{background:#e7f3ed}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #dbe3ec;vertical-align:top}#status{padding:0 5%;color:#8c3300}@media(max-width:720px){.grid{grid-template-columns:1fr}main{padding:14px}.card{padding:17px}nav{position:static}h1{font-size:25px}}</style>
<header><b>英文作文 LearningOS</b><div>六大能力 × 15細類 × 雙段寫作 × 換題練習</div></header><nav id="nav"></nav><div id="status" role="status"></div><main id="main"></main><script>const DATA={"models": [{"id": "M01-01", "type": 0, "title": "錯過試音之後", "prompt": "以「錯過試音之後」為題，第一段完成「背景／衝突」，第二段完成「行動／結果／反思」。依下列原創情境示範寫作。", "en": ["I arrived at the music room after the audition had ended because I had copied the wrong time into my notebook. At first, I paid more attention to my own feelings than to what the situation actually required. I wanted an immediate answer, but other people also had needs and information that I had not considered. Taking a moment to listen gave me a clearer starting point.", "I apologized to the teacher, accepted a smaller role, and began checking important dates against the original notice instead of trusting my memory. The experience did not make me perfect. It did, however, change the question I asked when something went wrong. Instead of worrying only about how I appeared, I began looking for a useful next step and a way to prevent the same mistake."], "zh": ["我把錯誤時間抄進筆記本，抵達音樂教室時試音已經結束。起初，我比較在意自己的感受，沒有那麼注意情況真正需要什麼。我想立刻得到答案，但其他人也有我尚未考慮的需求與資訊。花一點時間聆聽，給了我更清楚的起點。", "我向老師道歉，接受較小的角色，開始對照原通知確認日期，不再只憑記憶。這段經驗沒有讓我變得完美，卻改變了出問題時我問自己的問題。我不再只擔心自己的形象，而是開始尋找有用的下一步，以及避免重蹈覆轍的方法。"], "analysis": ["背景／衝突：本篇以「我把錯誤時間抄進筆記本，抵達音樂教室時試音已經結束。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "行動／結果／反思：核心發展為「我向老師道歉，接受較小的角色，開始對照原通知確認日期，不再只憑記憶。」；第二段因此不是只重複第一段，而是完成另一項寫作任務。", "關鍵內容句「I apologized to the teacher, accepted a smaller role, and began checking important dates against the original notice instead of trusting my memory.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "不能讓反思與前段事件脫節，也不應用一句教訓代替具體行動。"], "wordCount": 133}, {"id": "M01-02", "type": 0, "title": "雨中的狗項圈", "prompt": "以「雨中的狗項圈」為題，第一段完成「背景／衝突」，第二段完成「行動／結果／反思」。依下列原創情境示範寫作。", "en": ["While walking home in heavy rain, I found a frightened dog whose collar carried a telephone number that was almost impossible to read. At first, I paid more attention to my own feelings than to what the situation actually required. I wanted an immediate answer, but other people also had needs and information that I had not considered. Taking a moment to listen gave me a clearer starting point.", "A shopkeeper helped me dry the tag and call the owner, and I learned that asking for assistance could be more useful than acting alone. The experience did not make me perfect. It did, however, change the question I asked when something went wrong. Instead of worrying only about how I appeared, I began looking for a useful next step and a way to prevent the same mistake."], "zh": ["大雨中走回家時，我發現一隻受驚的狗，項圈上的電話幾乎無法辨識。起初，我比較在意自己的感受，沒有那麼注意情況真正需要什麼。我想立刻得到答案，但其他人也有我尚未考慮的需求與資訊。花一點時間聆聽，給了我更清楚的起點。", "店主幫我擦乾標籤並聯絡主人，我學到求助可能比獨自行動更有效。這段經驗沒有讓我變得完美，卻改變了出問題時我問自己的問題。我不再只擔心自己的形象，而是開始尋找有用的下一步，以及避免重蹈覆轍的方法。"], "analysis": ["背景／衝突：本篇以「大雨中走回家時，我發現一隻受驚的狗，項圈上的電話幾乎無法辨識。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "行動／結果／反思：核心發展為「店主幫我擦乾標籤並聯絡主人，我學到求助可能比獨自行動更有效。」；第二段因此不是只重複第一段，而是完成另一項寫作任務。", "關鍵內容句「A shopkeeper helped me dry the tag and call the owner, and I learned that asking for assistance could be more useful than acting alone.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "不能讓反思與前段事件脫節，也不應用一句教訓代替具體行動。"], "wordCount": 137}, {"id": "M01-03", "type": 0, "title": "被誤讀的訊息", "prompt": "以「被誤讀的訊息」為題，第一段完成「背景／衝突」，第二段完成「行動／結果／反思」。依下列原創情境示範寫作。", "en": ["I accused my project partner of ignoring our work after she failed to answer several messages during an important weekend. At first, I paid more attention to my own feelings than to what the situation actually required. I wanted an immediate answer, but other people also had needs and information that I had not considered. Taking a moment to listen gave me a clearer starting point.", "When she explained that her phone had broken, I apologized and helped our group agree on a second way to communicate in emergencies. The experience did not make me perfect. It did, however, change the question I asked when something went wrong. Instead of worrying only about how I appeared, I began looking for a useful next step and a way to prevent the same mistake."], "zh": ["重要週末裡，搭檔沒有回覆幾則訊息，我指責她不理會報告工作。起初，我比較在意自己的感受，沒有那麼注意情況真正需要什麼。我想立刻得到答案，但其他人也有我尚未考慮的需求與資訊。花一點時間聆聽，給了我更清楚的起點。", "她解釋手機壞了，我道歉，並協助小組訂出緊急時的備用聯絡方式。這段經驗沒有讓我變得完美，卻改變了出問題時我問自己的問題。我不再只擔心自己的形象，而是開始尋找有用的下一步，以及避免重蹈覆轍的方法。"], "analysis": ["背景／衝突：本篇以「重要週末裡，搭檔沒有回覆幾則訊息，我指責她不理會報告工作。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "行動／結果／反思：核心發展為「她解釋手機壞了，我道歉，並協助小組訂出緊急時的備用聯絡方式。」；第二段因此不是只重複第一段，而是完成另一項寫作任務。", "關鍵內容句「When she explained that her phone had broken, I apologized and helped our group agree on a second way to communicate in emergencies.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "不能讓反思與前段事件脫節，也不應用一句教訓代替具體行動。"], "wordCount": 132}, {"id": "M01-04", "type": 0, "title": "第一次照顧弟弟", "prompt": "以「第一次照顧弟弟」為題，第一段完成「背景／衝突」，第二段完成「行動／結果／反思」。依下列原創情境示範寫作。", "en": ["My parents asked me to watch my younger brother, and I expected him to quietly follow the schedule I had prepared. At first, I paid more attention to my own feelings than to what the situation actually required. I wanted an immediate answer, but other people also had needs and information that I had not considered. Taking a moment to listen gave me a clearer starting point.", "After he became upset, I let him choose between two safe activities and discovered that responsibility included listening as well as giving instructions. The experience did not make me perfect. It did, however, change the question I asked when something went wrong. Instead of worrying only about how I appeared, I began looking for a useful next step and a way to prevent the same mistake."], "zh": ["父母請我照顧弟弟，我以為他會安靜遵循我排好的行程。起初，我比較在意自己的感受，沒有那麼注意情況真正需要什麼。我想立刻得到答案，但其他人也有我尚未考慮的需求與資訊。花一點時間聆聽，給了我更清楚的起點。", "他不高興後，我讓他在兩種安全活動中選擇，發現負責也包含聆聽，而不只是指示。這段經驗沒有讓我變得完美，卻改變了出問題時我問自己的問題。我不再只擔心自己的形象，而是開始尋找有用的下一步，以及避免重蹈覆轍的方法。"], "analysis": ["背景／衝突：本篇以「父母請我照顧弟弟，我以為他會安靜遵循我排好的行程。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "行動／結果／反思：核心發展為「他不高興後，我讓他在兩種安全活動中選擇，發現負責也包含聆聽，而不只是指示。」；第二段因此不是只重複第一段，而是完成另一項寫作任務。", "關鍵內容句「After he became upset, I let him choose between two safe activities and discovered that responsibility included listening as well as giving instructions.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "不能讓反思與前段事件脫節，也不應用一句教訓代替具體行動。"], "wordCount": 133}, {"id": "M01-05", "type": 0, "title": "市集找零錯誤", "prompt": "以「市集找零錯誤」為題，第一段完成「背景／衝突」，第二段完成「行動／結果／反思」。依下列原創情境示範寫作。", "en": ["At a charity market, I gave a customer too much change and wanted to hide the mistake because other volunteers seemed so confident. At first, I paid more attention to my own feelings than to what the situation actually required. I wanted an immediate answer, but other people also had needs and information that I had not considered. Taking a moment to listen gave me a clearer starting point.", "I reported the problem, helped check the cash box, and suggested counting change aloud before handing it over to the next customer. The experience did not make me perfect. It did, however, change the question I asked when something went wrong. Instead of worrying only about how I appeared, I began looking for a useful next step and a way to prevent the same mistake."], "zh": ["慈善市集上，我多找了錢，看其他志工很有自信，一度想隱瞞錯誤。起初，我比較在意自己的感受，沒有那麼注意情況真正需要什麼。我想立刻得到答案，但其他人也有我尚未考慮的需求與資訊。花一點時間聆聽，給了我更清楚的起點。", "我回報問題，協助核對錢箱，並建議之後交付找零前先出聲數一次。這段經驗沒有讓我變得完美，卻改變了出問題時我問自己的問題。我不再只擔心自己的形象，而是開始尋找有用的下一步，以及避免重蹈覆轍的方法。"], "analysis": ["背景／衝突：本篇以「慈善市集上，我多找了錢，看其他志工很有自信，一度想隱瞞錯誤。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "行動／結果／反思：核心發展為「我回報問題，協助核對錢箱，並建議之後交付找零前先出聲數一次。」；第二段因此不是只重複第一段，而是完成另一項寫作任務。", "關鍵內容句「I reported the problem, helped check the cash box, and suggested counting change aloud before handing it over to the next customer.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "不能讓反思與前段事件脫節，也不應用一句教訓代替具體行動。"], "wordCount": 134}, {"id": "M01-06", "type": 0, "title": "山路上的折返", "prompt": "以「山路上的折返」為題，第一段完成「背景／衝突」，第二段完成「行動／結果／反思」。依下列原創情境示範寫作。", "en": ["During a family hike, I insisted that we continue upward even though the fog was thickening and my cousin was becoming tired. At first, I paid more attention to my own feelings than to what the situation actually required. I wanted an immediate answer, but other people also had needs and information that I had not considered. Taking a moment to listen gave me a clearer starting point.", "We finally turned back after consulting the trail map, and reaching home safely helped me separate sensible caution from a fear of failure. The experience did not make me perfect. It did, however, change the question I asked when something went wrong. Instead of worrying only about how I appeared, I began looking for a useful next step and a way to prevent the same mistake."], "zh": ["家族健行時，霧越來越濃，表親也累了，我卻堅持繼續上山。起初，我比較在意自己的感受，沒有那麼注意情況真正需要什麼。我想立刻得到答案，但其他人也有我尚未考慮的需求與資訊。花一點時間聆聽，給了我更清楚的起點。", "參考步道圖後我們折返，安全回家讓我學會分辨謹慎和害怕失敗。這段經驗沒有讓我變得完美，卻改變了出問題時我問自己的問題。我不再只擔心自己的形象，而是開始尋找有用的下一步，以及避免重蹈覆轍的方法。"], "analysis": ["背景／衝突：本篇以「家族健行時，霧越來越濃，表親也累了，我卻堅持繼續上山。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "行動／結果／反思：核心發展為「參考步道圖後我們折返，安全回家讓我學會分辨謹慎和害怕失敗。」；第二段因此不是只重複第一段，而是完成另一項寫作任務。", "關鍵內容句「We finally turned back after consulting the trail map, and reaching home safely helped me separate sensible caution from a fear of failure.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "不能讓反思與前段事件脫節，也不應用一句教訓代替具體行動。"], "wordCount": 134}, {"id": "M01-07", "type": 0, "title": "遺忘的劇本道具", "prompt": "以「遺忘的劇本道具」為題，第一段完成「背景／衝突」，第二段完成「行動／結果／反思」。依下列原創情境示範寫作。", "en": ["Minutes before our play, I realized that the suitcase needed for the final scene was still sitting in my bedroom. At first, I paid more attention to my own feelings than to what the situation actually required. I wanted an immediate answer, but other people also had needs and information that I had not considered. Taking a moment to listen gave me a clearer starting point.", "I explained the situation, borrowed an empty box, and worked with the actors to adjust their movements without changing the meaning of the scene. The experience did not make me perfect. It did, however, change the question I asked when something went wrong. Instead of worrying only about how I appeared, I began looking for a useful next step and a way to prevent the same mistake."], "zh": ["演出前幾分鐘，我發現最後一幕需要的行李箱還在臥室。起初，我比較在意自己的感受，沒有那麼注意情況真正需要什麼。我想立刻得到答案，但其他人也有我尚未考慮的需求與資訊。花一點時間聆聽，給了我更清楚的起點。", "我說明情況，借來空箱，和演員調整動作，同時保留場景的意義。這段經驗沒有讓我變得完美，卻改變了出問題時我問自己的問題。我不再只擔心自己的形象，而是開始尋找有用的下一步，以及避免重蹈覆轍的方法。"], "analysis": ["背景／衝突：本篇以「演出前幾分鐘，我發現最後一幕需要的行李箱還在臥室。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "行動／結果／反思：核心發展為「我說明情況，借來空箱，和演員調整動作，同時保留場景的意義。」；第二段因此不是只重複第一段，而是完成另一項寫作任務。", "關鍵內容句「I explained the situation, borrowed an empty box, and worked with the actors to adjust their movements without changing the meaning of the scene.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "不能讓反思與前段事件脫節，也不應用一句教訓代替具體行動。"], "wordCount": 133}, {"id": "M01-08", "type": 0, "title": "祖母的食譜筆記", "prompt": "以「祖母的食譜筆記」為題，第一段完成「背景／衝突」，第二段完成「行動／結果／反思」。依下列原創情境示範寫作。", "en": ["I dismissed my grandmother's handwritten recipe as confusing until I tried to prepare her soup without asking her any questions. At first, I paid more attention to my own feelings than to what the situation actually required. I wanted an immediate answer, but other people also had needs and information that I had not considered. Taking a moment to listen gave me a clearer starting point.", "Cooking beside her showed me why she adjusted each ingredient, and I added explanations to the recipe rather than replacing her experience with exact numbers. The experience did not make me perfect. It did, however, change the question I asked when something went wrong. Instead of worrying only about how I appeared, I began looking for a useful next step and a way to prevent the same mistake."], "zh": ["我認為祖母手寫的食譜很混亂，直到我沒問她便嘗試煮那道湯。起初，我比較在意自己的感受，沒有那麼注意情況真正需要什麼。我想立刻得到答案，但其他人也有我尚未考慮的需求與資訊。花一點時間聆聽，給了我更清楚的起點。", "和她一起煮後，我理解她為何調整食材，於是補寫說明，不用精確數字取代經驗。這段經驗沒有讓我變得完美，卻改變了出問題時我問自己的問題。我不再只擔心自己的形象，而是開始尋找有用的下一步，以及避免重蹈覆轍的方法。"], "analysi ": 134}, {"id": "M01-19", "type": 0, "title": "比賽前的鞋帶", "prompt": "以「比賽前的鞋帶」為題，第一段完成「背景／衝突」，第二段完成「行動／結果／反思」。依下列原創情境示範寫作。", "en": ["I laughed when a teammate checked his shoes repeatedly before a race, until my own loose lace forced me to stop halfway. At first, I paid more attention to my own feelings than to what the situation actually required. I wanted an immediate answer, but other people also had needs and information that I had not considered. Taking a moment to listen gave me a clearer starting point.", "I apologized after the race and added a simple preparation routine, understanding that small precautions could support rather than distract from a larger goal. The experience did not make me perfect. It did, however, change the question I asked when something went wrong. Instead of worrying only about how I appeared, I began looking for a useful next step and a way to prevent the same mistake."], "zh": ["賽前隊友反覆檢查鞋子，我嘲笑他，直到自己的鞋帶鬆了，迫使我中途停下。起初，我比較在意自己的感受，沒有那麼注意情況真正需要什麼。我想立刻得到答案，但其他人也有我尚未考慮的需求與資訊。花一點時間聆聽，給了我更清楚的起點。", "賽後我道歉並加入簡單準備流程，理解小小預防能支持而非分散大目標。這段經驗沒有讓我變得完美，卻改變了出問題時我問自己的問題。我不再只擔心自己的形象，而是開始尋找有用的下一步，以及避免重蹈覆轍的方法。"], "analysis": ["背景／衝突：本篇以「賽前隊友反覆檢查鞋子，我嘲笑他，直到自己的鞋帶鬆了，迫使我中途停下。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "行動／結果／反思：核心發展為「賽後我道歉並加入簡單準備流程，理解小小預防能支持而非分散大目標。」；第二段因此不是只重複第一段，而是完成另一項寫作任務。", "關鍵內容句「I apologized after the race and added a simple preparation routine, understanding that small precautions could support rather than distract from a larger goal.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "不能讓反思與前段事件脫節，也不應用一句教訓代替具體行動。"], "wordCount": 135}, {"id": "M01-20", "type": 0, "title": "第一次公開道歉", "prompt": "以「第一次公開道歉」為題，第一段完成「背景／衝突」，第二段完成「行動／結果／反思」。依下列原創情境示範寫作。", "en": ["I repeated an unkind joke about a classmate because everyone nearby was laughing, then noticed that she had become silent. At first, I paid more attention to my own feelings than to what the situation actually required. I wanted an immediate answer, but other people also had needs and information that I had not considered. Taking a moment to listen gave me a clearer starting point.", "I apologized without blaming the group and asked others to stop sharing the joke, learning that repairing harm required action as well as regret. The experience did not make me perfect. It did, however, change the question I asked when something went wrong. Instead of worrying only about how I appeared, I began looking for a useful next step and a way to prevent the same mistake."], "zh": ["旁人都在笑，我跟著重複嘲笑同學的笑話，隨後發現她沉默了。起初，我比較在意自己的感受，沒有那麼注意情況真正需要什麼。我想立刻得到答案，但其他人也有我尚未考慮的需求與資訊。花一點時間聆聽，給了我更清楚的起點。", "我不推責給群體，直接道歉並請大家停止傳笑話，學到修補傷害不只需要後悔，也需要行動。這段經驗沒有讓我變得完美，卻改變了出問題時我問自己的問題。我不再只擔心自己的形象，而是開始尋找有用的下一步，以及避免重蹈覆轍的方法。"], "analysis": ["背景／衝突：本篇以「旁人都在笑，我跟著重複嘲笑同學的笑話，隨後發現她沉默了。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "行動／結果／反思：核心發展為「我不推責給群體，直接道歉並請大家停止傳笑話，學到修補傷害不只需要後悔，也需要行動。」；第二段因此不是只重複第一段，而是完成另一項寫作任務。", "關鍵內容句「I apologized without blaming the group and asked others to stop sharing the joke, learning that repairing harm required action as well as regret.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "不能讓反思與前段事件脫節，也不應用一句教訓代替具體行動。"], "wordCount": 133}, {"id": "M02-01", "type": 1, "title": "清晨的魚市場", "prompt": "以「清晨的魚市場」為題，第一段完成「整體印象／具體細節」，第二段完成「特徵的意義／個人回應」。依下列原創情境示範寫作。", "en": ["Before sunrise, the fish market glows under white lamps, and workers slide boxes across a wet floor while customers compare the morning's catch. What first attracts my attention is not a single dramatic feature but the relationship between the details. Looking slowly reveals patterns that a hurried visitor could easily miss. The setting has a particular rhythm, and its ordinary objects make that rhythm easier to recognize.", "Watching sellers recognize regular customers reveals a community built on repeated conversations, careful choices, and work that begins while most of the city sleeps. That is why this subject stays in my memory. It offers more than an attractive appearance: it shows how habits, practical needs, and individual choices shape everyday experience. Describing it carefully helps me appreciate a meaning that would disappear in a quick, general judgment."], "zh": ["日出前，魚市場在白燈下發亮，工人把箱子滑過濕地板，顧客比較早晨漁獲。最先吸引我注意的不是單一醒目特徵，而是細節之間的關係。慢慢觀察會發現匆忙訪客容易錯過的規律。場景有特殊節奏，而普通物件讓這個節奏更容易辨識。", "看攤商認出熟客，能看見由反覆交談、細心選擇及城市尚睡時便開始的勞動構成的社群。因此，這個描述對象留在我的記憶裡。它不只是外觀吸引人，也呈現習慣、實際需求及個人選擇如何形塑日常經驗。仔細描述能讓我欣賞倉促概括判斷會漏掉的意義。"], "analysis": ["整體印象／具體細節：本篇以「日出前，魚市場在白燈下發亮，工人把箱子滑過濕地板，顧客比較早晨漁獲。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "特徵的意義／個人回應：核心發展為「看攤商認出熟客，能看見由反覆交談、細心選擇及城市尚睡時便開始的勞動構成的社群。」；第二段因此不是只重複第一段，而是完成另一項寫作任務。", "關鍵內容句「Watching sellers recognize regular customers reveals a community built on repeated conversations, careful choices, and work that begins while most of the city sleeps.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "細節要共同支持印象；不可把所有描述換成空泛形容詞。"], "wordCount": 135}, {"id": "M02-02", "type": 1, "title": "鐘錶修理師的桌面", "prompt": "以「鐘錶修理師的桌面」為題，第一段完成「整體印象／具體細節」，第二段完成「特徵的意義／個人回應」。依下列原創情境示範寫作。", "en": ["The watch repairer's desk holds tiny screws in shallow trays, and a single lamp lights the space where his hands move slowly and steadily. What first attracts my attention is not a single dramatic feature but the relationship between the details. Looking slowly reveals patterns that a hurried visitor could easily miss. The setting has a particular rhythm, and its ordinary objects make that rhythm easier to recognize.", "His habit of explaining each repair to its owner makes the shop feel less like a place of mystery and more like a patient lesson in care. That is why this subject stays in my memory. It offers more than an attractive appearance: it shows how habits, practical needs, and individual choices shape everyday experience. Describing it carefully helps me appreciate a meaning that would disappear in a quick, general judgment."], "zh": ["修錶師桌上淺盤放著小螺絲，一盞燈照亮雙手緩慢穩定移動的地方。最先吸引我注意的不是單一醒目特徵，而是細節之間的關係。慢慢觀察會發現匆忙訪客容易錯過的規律。場景有特殊節奏，而普通物件讓這個節奏更容易辨識。", "他向主人解釋每次維修的習慣，使店裡不像神祕場所，更像耐心的照護課。因此，這個描述對象留在我的記憶裡。它不只是外觀吸引人，也呈現 lps people move independently, reminding me that welcome can be expressed through practical arrangements as well as through friendly announcements. That is why this subject stays in my memory. It offers more than an attractive appearance: it shows how habits, practical needs, and individual choices shape everyday experience. Describing it carefully helps me appreciate a meaning that would disappear in a quick, general judgment."], "zh": ["機場入口附近，大標示結合圖像文字，清楚路徑連接服務台、電梯及無障礙廁所。最先吸引我注意的不是單一醒目特徵，而是細節之間的關係。慢慢觀察會發現匆忙訪客容易錯過的規律。場景有特殊節奏，而普通物件讓這個節奏更容易辨識。", "設計協助人們自主移動，提醒我歡迎不只靠友善廣播，也能透過實際安排表達。因此，這個描述對象留在我的記憶裡。它不只是外觀吸引人，也呈現習慣、實際需求及個人選擇如何形塑日常經驗。仔細描述能讓我欣賞倉促概括判斷會漏掉的意義。"], "analysis": ["整體印象／具體細節：本篇以「機場入口附近，大標示結合圖像文字，清楚路徑連接服務台、電梯及無障礙廁所。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "特徵的意義／個人回應：核心發展為「設計協助人們自主移動，提醒我歡迎不只靠友善廣播，也能透過實際安排表達。」；第二段因此不是只重複第一段，而是完成另一項寫作任務。", "關鍵內容句「The design helps people move independently, reminding me that welcome can be expressed through practical arrangements as well as through friendly announcements.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "細節要共同支持印象；不可把所有描述換成空泛形容詞。"], "wordCount": 132}, {"id": "M02-19", "type": 1, "title": "冬日的烤栗子攤", "prompt": "以「冬日的烤栗子攤」為題，第一段完成「整體印象／具體細節」，第二段完成「特徵的意義／個人回應」。依下列原創情境示範寫作。", "en": ["Steam rises above the chestnut cart on cold afternoons, and the vendor measures each portion while answering questions from children waiting beside their parents. What first attracts my attention is not a single dramatic feature but the relationship between the details. Looking slowly reveals patterns that a hurried visitor could easily miss. The setting has a particular rhythm, and its ordinary objects make that rhythm easier to recognize.", "The stall creates a temporary meeting place around warmth and a familiar smell, linking a simple purchase with repeated neighborhood encounters. That is why this subject stays in my memory. It offers more than an attractive appearance: it shows how habits, practical needs, and individual choices shape everyday experience. Describing it carefully helps me appreciate a meaning that would disappear in a quick, general judgment."], "zh": ["寒冷午後，栗子推車冒蒸氣，攤販量份量，也回答陪父母等候的孩子問題。最先吸引我注意的不是單一醒目特徵，而是細節之間的關係。慢慢觀察會發現匆忙訪客容易錯過的規律。場景有特殊節奏，而普通物件讓這個節奏更容易辨識。", "攤位以溫暖及熟悉氣味創造暫時聚點，把簡單購買連到重複的鄰里相遇。因此，這個描述對象留在我的記憶裡。它不只是外觀吸引人，也呈現習慣、實際需求及個人選擇如何形塑日常經驗。仔細描述能讓我欣賞倉促概括判斷會漏掉的意義。"], "analysis": ["整體印象／具體細節：本篇以「寒冷午後，栗子推車冒蒸氣，攤販量份量，也回答陪父母等候的孩子問題。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "特徵的意義／個人回應：核心發展為「攤位以溫暖及熟悉氣味創造暫時聚點，把簡單購買連到重複的鄰里相遇。」；第二段因此不是只重複第一段，而是完成另一項寫作任務。", "關鍵內容句「The stall creates a temporary meeting place around warmth and a familiar smell, linking a simple purchase with repeated neighborhood encounters.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "細節要共同支持印象；不可把所有描述換成空泛形容詞。"], "wordCount": 133}, {"id": "M02-20", "type": 1, "title": "山城的石階", "prompt": "以「山城的石階」為題，第一段完成「整體印象／具體細節」，第二段完成「特徵的意義／個人回應」。依下列原創情境示範寫作。", "en": ["The stone steps twist between houses, with shallow grooves worn into their centers and bright pots placed where the path becomes wider. What first attracts my attention is not a single dramatic feature but the relationship between the details. Looking slowly reveals patterns that a hurried visitor could easily miss. The setting has a particular rhythm, and its ordinary objects make that rhythm easier to recognize.", "They reveal how movement and daily life share limited space, because the route serves both as a passage and as an extension of people's homes. That is why this subject stays in my memory. It offers more than an attractive appearance: it shows how habits, practical needs, and individual choices shape everyday experience. Describing it carefully helps me appreciate a meaning that would disappear in a quick, general judgment."], "zh": ["石階蜿蜒屋間，中央磨出淺溝，較寬處放著鮮豔花盆。最先吸引我注意的不是單一醒目特徵，而是細節之間的關係。慢慢觀察會發現匆忙訪客容易錯過的規律。場景有特殊節奏，而普通物件讓這個節奏更容易辨識。", "階梯兼作通道與家屋延伸，呈現移動和生活如何共享有限空間。因此，這個描述對象留在我的記憶裡。它不只是外觀吸引人，也呈現習慣、實際需求及個人選擇如何形塑日常經驗。仔細描述能讓我欣賞倉促概括判斷會漏掉的意義。"], "analysis": ["整體印象／具體細節：本篇以「石階蜿蜒屋間，中央磨出淺溝，較寬處放著鮮豔花盆。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "特徵的意義／個人回應：核心發展為「階梯兼作通道與家屋延伸，呈現移動和生活如何共享有限空間。」；第二段因此不是只重複第一段，而是完成另一項寫作任務。", "關鍵內容句「They reveal how movement and daily life share limited space, because the route serves both as a passage and as an extension of people's homes.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "細節要共同支持印象；不可把所有描述換成空泛形容詞。"], "wordCount": 135}, {"id": "M03-01", "type": 2, "title": "制服保留彈性", "prompt": "以「制服保留彈性」為題，第一段完成「立場／判準」，第二段完成「方案條件／限定結論」。依下列原創情境示範寫作。", "en": ["Schools should allow students to choose between approved trousers and skirts rather than assign clothing strictly by gender or tradition. The strongest reason for this position is its attention to people whose needs can be overlooked by a simple rule. A useful policy should be judged not only by how easy it is to announce, but also by how fairly it works in daily life.", "A small range of affordable options could preserve a shared appearance while making daily movement and personal comfort easier for different students. This approach would require discussion rather than immediate agreement from everyone. Even so, acknowledging limitations is a reason to design the measure carefully, not to reject it without examination. I would support a manageable trial, clear communication, and a review of the effects before any wider commitment."], "zh": ["學校應讓學生選擇合規長褲或裙子，而非依性別或傳統指定。支持這個立場最有力的理由，是它注意到簡單規定可能忽略的需求。有用的政策不只應看是否容易宣布，也要看日常執行是否公平。", "少量平價選項能保留共同外觀，也讓不同學生移動更方便舒適。這種做法需要討論，不會讓所有人立刻同意。即使如此，承認限制是審慎設計措施的理由，而非未檢視就拒絕。我支持可負擔的試行、清楚溝通，以及擴大承諾前的成效檢視。"], "analysis": ["立場／判準：本篇以「學校應讓學生選擇合規長褲或裙子，而非依性別或傳統指定。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "方案條件／限定結論：核心發展為「少量平價選項能保留共同外觀，也讓不同學生移動更方便舒適。」；第二段因此不是只重複第一段，而是完成另一項寫作任務。", "關鍵內容句「A small range of affordable options could preserve a shared appearance while making daily movement and personal comfort easier for different students.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "有限度支持不等於全面保證，需保留本篇提出的限制。"], "wordCount": 134}, {"id": "M03-02", "type": 2, "title": "延後繳交紙本", "prompt": "以「延後繳交紙本」為題，第一段完成「立場／判準」，第二段完成「方案條件／限定結論」。依下列原創情境示範寫作。", "en": ["Teachers should accept digital drafts before requiring printed assignments because early feedback often leads students to replace several pages of their work. The strongest reason for this position is its attention to people whose needs can be overlooked by a simple rule. A useful policy should be judged not only by how easy it is to announce, but also by how fairly it works in daily life.", "Printing only the final version would reduce waste, although schools should provide an alternative for students who cannot easily access a computer. This approach would require discussion rather than immediate agreement from everyone. Even so, acknowledging limitations is a reason to design the measure carefully, not to reject it without examination. I would support a manageable trial, clear communication, and a review of the effects before any wider commitment."], "zh": ["教師應先收數位草稿再要求紙本，因為早期回饋常讓學生修改數頁。支持這個立場最有力的理由，是它注意到簡單規定可能忽略的需求。有用的政策不只應看是否容易宣布，也要看日常執行是否公平。", "只印定稿能減廢，但學校應為不易使用電腦的學生提供替代方式。這種做法需要討論，不會讓所有人立刻同意。即使如此，承認限制是審慎設計措施的理由，而非未檢視就拒絕。我支持可負擔的試行、清楚溝通，以及擴大承諾前的成效檢視。"], "analysis": ["立場／判準：本篇以「教師應先收數位草稿再要求紙本，因為早期回饋常讓學生修改數頁。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "方案條件／限定結論：核心發展為「只印定稿能減廢，但學校應為不易使用電腦的學生提供替代方式。」；第二段因此不是只重複第一段，而是完成另一項寫作任務。", "關鍵內容句「Printing only the final version would reduce waste, although schools should provide an alternative for students who cannot easily access a computer.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "有限度支持不等於全面保證，需保留本篇提出的限制。"], "wordCount": 136}, {"id": "M03-03", "type": 2, "title": "運動會非競賽項目", "prompt": "以「運動會非競賽項目」為題，第一段完成「立場／判準」，第二段完成「方案條件／限定結論」。依下列原創情境示範寫作。", "en": ["School sports days should include cooperative activities as well as races so that participation does not depend entirely on speed or strength. The strongest reason for this position is its attention to people whose needs can be overlooked by a simple rule. A useful p uch trust to place in it.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "有限度支持不等於全面保證，需保留本篇提出的限制。"], "wordCount": 138}, {"id": "M03-18", "type": 2, "title": "家庭共同家務", "prompt": "以「家庭共同家務」為題，第一段完成「立場／判準」，第二段完成「方案條件／限定結論」。依下列原創情境示範寫作。", "en": ["Household chores should be divided according to available time and ability rather than automatically assigned to one family member because of tradition. The strongest reason for this position is its attention to people whose needs can be overlooked by a simple rule. A useful policy should be judged not only by how easy it is to announce, but also by how fairly it works in daily life.", "A flexible weekly discussion could make hidden work more visible and allow responsibilities to change when school deadlines or working hours become demanding. This approach would require discussion rather than immediate agreement from everyone. Even so, acknowledging limitations is a reason to design the measure carefully, not to reject it without examination. I would support a manageable trial, clear communication, and a review of the effects before any wider commitment."], "zh": ["家務應按時間能力分配，不因傳統自動交給某位家人。支持這個立場最有力的理由，是它注意到簡單規定可能忽略的需求。有用的政策不只應看是否容易宣布，也要看日常執行是否公平。", "彈性週討論可看見隱形工作，在課業或工時緊迫時調整責任。這種做法需要討論，不會讓所有人立刻同意。即使如此，承認限制是審慎設計措施的理由，而非未檢視就拒絕。我支持可負擔的試行、清楚溝通，以及擴大承諾前的成效檢視。"], "analysis": ["立場／判準：本篇以「家務應按時間能力分配，不因傳統自動交給某位家人。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "方案條件／限定結論：核心發展為「彈性週討論可看見隱形工作，在課業或工時緊迫時調整責任。」；第二段因此不是只重複第一段，而是完成另一項寫作任務。", "關鍵內容句「A flexible weekly discussion could make hidden work more visible and allow responsibilities to change when school deadlines or working hours become demanding.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "有限度支持不等於全面保證，需保留本篇提出的限制。"], "wordCount": 137}, {"id": "M03-19", "type": 2, "title": "校隊課業支持", "prompt": "以「校隊課業支持」為題，第一段完成「立場／判準」，第二段完成「方案條件／限定結論」。依下列原創情境示範寫作。", "en": ["School athletes should receive organized help with missed lessons rather than be expected to recover every absence entirely on their own. The strongest reason for this position is its attention to people whose needs can be overlooked by a simple rule. A useful policy should be judged not only by how easy it is to announce, but also by how fairly it works in daily life.", "Recorded explanations and scheduled consultations would support learning while keeping athletes responsible for completing the same essential academic tasks as their classmates. This approach would require discussion rather than immediate agreement from everyone. Even so, acknowledging limitations is a reason to design the measure carefully, not to reject it without examination. I would support a manageable trial, clear communication, and a review of the effects before any wider commitment."], "zh": ["校隊生應得到有組織的補課協助，不應每次缺課都全靠自己追回。支持這個立場最有力的理由，是它注意到簡單規定可能忽略的需求。有用的政策不只應看是否容易宣布，也要看日常執行是否公平。", "錄製說明及定期諮詢可支持學習，同時要求選手完成同儕相同核心課業。這種做法需要討論，不會讓所有人立刻同意。即使如此，承認限制是審慎設計措施的理由，而非未檢視就拒絕。我支持可負擔的試行、清楚溝通，以及擴大承諾前的成效檢視。"], "analysis": ["立場／判準：本篇以「校隊生應得到有組織的補課協助，不應每次缺課都全靠自己追回。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "方案條件／限定結論：核心發展為「錄製說明及定期諮詢可支持學習，同時要求選手完成同儕相同核心課業。」；第二段因此不是只重複第一段，而是完成另一項寫作任務。", "關鍵內容句「Recorded explanations and scheduled consultations would support learning while keeping athletes responsible for completing the same essential academic tasks as their classmates.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "有限度支持不等於全面保證，需保留本篇提出的限制。"], "wordCount": 135}, {"id": "M03-20", "type": 2, "title": "免費公園活動", "prompt": "以「免費公園活動」為題，第一段完成「立場／判準」，第二段完成「方案條件／限定結論」。依下列原創情境示範寫作。", "en": ["Local governments should provide some free weekend activities in parks because public recreation should not depend entirely on a family's spending power. The strongest reason for this position is its attention to people whose needs can be overlooked by a simple rule. A useful policy should be judged not only by how easy it is to announce, but also by how fairly it works in daily life.", "Simple games led by trained staff could welcome different ages, with cl igures describe the stated sample or period, not every possible situation. The most useful comparison is between the categories or observations actually provided. Keeping the unit and the basis of comparison clear prevents a numerical difference from being mistaken for a broader conclusion.", "The middle group is the largest, suggesting varied travel needs rather than a single distance that represents every student's journey. If I were using this information to make a decision, I would begin with the main pattern and then ask what further evidence was needed. The chart offers a starting point for discussion. It does not replace questions about context, measurement, or the experiences hidden behind the totals."], "zh": ["虛構調查十五名學生住一公里內、二十五名一至三公里、十名超過三公里。這些數字描述所列樣本或期間，不代表所有情況。最有用的比較，是實際提供的類別或觀察之間的比較。清楚保留單位及基準，可避免把數值差異誤當更廣泛結論。", "中間組最大，顯示需求多樣，不能用一個距離代表所有人的通勤。若我用這些資訊做決定，會先看主要規律，再問需要哪些額外證據。圖表提供討論起點，卻不能取代對背景、測量方法及總數背後經驗的提問。"], "analysis": ["數據描述／比較基準：本篇以「虛構調查十五名學生住一公里內、二十五名一至三公里、十名超過三公里。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "解讀／資料限制：核心發展為「中間組最大，顯示需求多樣，不能用一個距離代表所有人的通勤。」；第二段因此不是只重複第一段，而是完成另一項寫作任務。", "關鍵內容句「The middle group is the largest, suggesting varied travel needs rather than a single distance that represents every student's journey.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "所有數據均為虛構教學資料；沒有原始研究，不能推論真實母體或因果。"], "wordCount": 132}, {"id": "M07-01", "type": 6, "title": "手寫與打字筆記", "prompt": "以「手寫與打字筆記」為題，第一段完成「共同面向／差異」，第二段完成「個人選擇／取捨」。依下列原創情境示範寫作。", "en": ["Handwritten notes allow flexible sketches beside ideas, whereas typed notes are easier to search, rearrange, and share after a lesson. Neither choice is automatically better in every circumstance. A fair comparison needs common criteria, such as convenience, the kind of experience offered, and the demands placed on the user. Looking at both benefits and limitations makes the choice more meaningful than simply following popularity.", "For a science lecture with diagrams, I would choose handwriting first and later type a summary that identifies the relationships I need to remember. My preference is therefore connected to a particular purpose, not a claim that everyone should decide in the same way. Someone with different resources or priorities could reasonably choose otherwise. Recognizing that difference helps me explain my decision clearly while remaining open to changing it when circumstances change."], "zh": ["手寫可在概念旁自由畫圖，打字則較易搜尋、重排及課後分享。沒有哪個選擇在所有情況都自動較好。公平比較需要共同判準，例如便利、提供的體驗，以及對使用者的要求。兼看優點限制，比只追隨流行更能讓選擇有意義。", "有圖解的科學課我先手寫，再打摘要整理需記住的關係。因此我的偏好連結特定目的，並非主張人人都應相同決定。資源或優先事項不同的人，合理地可能選另一方。認識差異讓我清楚解釋決定，也願在情況改變時調整。"], "analysis": ["共同面向／差異：本篇以「手寫可在概念旁自由畫圖，打字則較易搜尋、重排及課後分享。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "個人選擇／取捨：核心發展為「有圖解的科學課我先手寫，再打摘要整理需記住的關係。」；第二段因此不是只重複第一段，而是完成另一項寫作任務。", "關鍵內容句「For a science lecture with diagrams, I would choose handwriting first and later type a summary that identifies the relationships I need to remember.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "偏好依具體需求形成，不代表另一選項對所有人都較差。"], "wordCount": 136}, {"id": "M07-02", "type": 6, "title": "住校與通勤", "prompt": "以「住校與通勤」為題，第一段完成「共同面向／差異」，第二段完成「個人選擇／取捨」。依下列原創情境示範寫作。", "en": ["Living on campus reduces travel time, while commuting lets students remain close to family routines and familiar support outside school. Neither choice is automatically better in every circumstance. A fair comparison needs common criteria, such as convenience, the kind of experience offered, and the demands placed on the user. Looking at both benefits and limitations makes the choice more meaningful than simply following popularity.", "I would commute if the journey were short, because daily family contact matters to me, but a very long route would change that decision. My preference is therefore connected to a particular purpose, not a claim that everyone should decide in the same way. Someone with different resources or priorities could reasonably choose otherwise. Recognizing that difference helps me explain my decision clearly while e it states both the connection it proposes and the limits of what is known."], "zh": ["部分學生因短片自動播放，難察覺時間流逝而晚睡。這個解釋指出可能過程，而非普遍定律。理解時，應把起始條件與接著發生的事分開，否則可能只重述明顯結果，彷彿說出結果就已解釋原因。", "少睡可能影響隔晨專注，但作業、壓力及通勤也需考量，不宜單一解釋。因此，我會先尋找幾種證據再接受廣泛主張。即使某因素看似相近，不同人或場景仍可能產生不同結果。審慎解釋有用，正因它同時說明提出的連結與已知範圍。"], "analysis": ["現象／可能機制：本篇以「部分學生因短片自動播放，難察覺時間流逝而晚睡。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "因果限制／驗證方向：核心發展為「少睡可能影響隔晨專注，但作業、壓力及通勤也需考量，不宜單一解釋。」；第二段因此不是只重複第一段，而是完成另一項寫作任務。", "關鍵內容句「Reduced sleep may then affect concentration the next morning, although homework, stress, and commuting also deserve attention before drawing a single explanation.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "可能原因不是已證實因果；注意替代因素及推論範圍。"], "wordCount": 134}, {"id": "M09-02", "type": 8, "title": "排隊焦躁", "prompt": "以「排隊焦躁」為題，第一段完成「現象／可能機制」，第二段完成「因果限制／驗證方向」。依下列原創情境示範寫作。", "en": ["People may become impatient in a queue when they cannot estimate the wait or understand why others appear to move faster. This explanation identifies a possible process rather than a universal law. To understand the situation, it is helpful to separate the initial condition from what happens next. Otherwise, an obvious result may be repeated as if naming it had already explained its cause.", "Clear information about delays can reduce uncertainty, but it does not necessarily shorten the actual wait or resolve insufficient service capacity. I would therefore look for several kinds of evidence before accepting a broad claim. Different people or settings may produce different outcomes, even when one factor looks similar. A careful explanation remains useful precisely because it states both the connection it proposes and the limits of what is known."], "zh": ["排隊者無法估時或理解別隊更快時，可能焦躁。這個解釋指出可能過程，而非普遍定律。理解時，應把起始條件與接著發生的事分開，否則可能只重述明顯結果，彷彿說出結果就已解釋原因。", "延誤資訊能減不確定，但不一定縮等待或解決服務量不足。因此，我會先尋找幾種證據再接受廣泛主張。即使某因素看似相近，不同人或場景仍可能產生不同結果。審慎解釋有用，正因它同時說明提出的連結與已知範圍。"], "analysis": ["現象／可能機制：本篇以「排隊者無法估時或理解別隊更快時，可能焦躁。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "因果限制／驗證方向：核心發展為「延誤資訊能減不確 ／驗證方向」。依下列原創情境示範寫作。", "en": ["A classroom plant may lean toward a window because light reaches it unevenly, rather than because the pot is necessarily damaged. This explanation identifies a possible process rather than a universal law. To understand the situation, it is helpful to separate the initial condition from what happens next. Otherwise, an obvious result may be repeated as if naming it had already explained its cause.", "Observing light conditions over time can guide a change in placement, while water and plant type remain relevant to understanding its overall condition. I would therefore look for several kinds of evidence before accepting a broad claim. Different people or settings may produce different outcomes, even when one factor looks similar. A careful explanation remains useful precisely because it states both the connection it proposes and the limits of what is known."], "zh": ["教室植物可能因光線不均而向窗傾，不一定是盆壞。這個解釋指出可能過程，而非普遍定律。理解時，應把起始條件與接著發生的事分開，否則可能只重述明顯結果，彷彿說出結果就已解釋原因。", "長期看光照可指導換位置，水量及種類仍影響整體狀況。因此，我會先尋找幾種證據再接受廣泛主張。即使某因素看似相近，不同人或場景仍可能產生不同結果。審慎解釋有用，正因它同時說明提出的連結與已知範圍。"], "analysis": ["現象／可能機制：本篇以「教室植物可能因光線不均而向窗傾，不一定是盆壞。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "因果限制／驗證方向：核心發展為「長期看光照可指導換位置，水量及種類仍影響整體狀況。」；第二段因此不是只重複第一段，而是完成另一項寫作任務。", "關鍵內容句「Observing light conditions over time can guide a change in placement, while water and plant type remain relevant to understanding its overall condition.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "可能原因不是已證實因果；注意替代因素及推論範圍。"], "wordCount": 136}, {"id": "M09-05", "type": 8, "title": "第一次發言緊張", "prompt": "以「第一次發言緊張」為題，第一段完成「現象／可能機制」，第二段完成「因果限制／驗證方向」。依下列原創情境示範寫作。", "en": ["Students may hesitate to speak in a new group because they do not yet know how mistakes or unusual ideas will be received. This explanation identifies a possible process rather than a universal law. To understand the situation, it is helpful to separate the initial condition from what happens next. Otherwise, an obvious result may be repeated as if naming it had already explained its cause.", "A respectful response to early contributions can make later participation easier, though individual preferences should not be reduced to a simple confidence label. I would therefore look for several kinds of evidence before accepting a broad claim. Different people or settings may produce different outcomes, even when one factor looks similar. A careful explanation remains useful precisely because it states both the connection it proposes and the limits of what is known."], "zh": ["學生在新群體不敢說話，可能因不知錯誤或特殊想法會怎樣被回應。這個解釋指出可能過程，而非普遍定律。理解時，應把起始條件與接著發生的事分開，否則可能只重述明顯結果，彷彿說出結果就已解釋原因。", "尊重初次發言可促後續參與，但不宜只用自信標籤解釋個人偏好。因此，我會先尋找幾種證據再接受廣泛主張。即使某因素看似相近，不同人或場景仍可能產生不同結果。審慎解釋有用，正因它同時說明提出的連結與已知範圍。"], "analysis": ["現象／可能機制：本篇以「學生在新群體不敢說話，可能因不知錯誤或特殊想法會怎樣被回應。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "因果限制／驗證方向：核心發展為「尊重初次發言可促後續參與，但不宜只用自信標籤解釋個人偏好。」；第二段因此不是只重複第一段，而是完成另一項寫作任務。", "關鍵內容句「A respectful response to early contributions can make later participation easier, though individual preferences should not be reduced to a simple confidence label.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "可能原因不是已證實因果；注意替代因素及推論範圍。"], "wordCount": 138}, {"id": "M09-06", "type": 8, "title": "城市積水", "prompt": "以「城市積水」為題，第一段完成「現象／可能機制」，第二段完成「因果限制／驗證方向」。依下列原創情境示範寫作。", "en": ["Water collects rapidly on some streets when heavy rainfall exceeds drainage capacity and solid surfaces prevent much of it from entering the ground. This explanation identifies a possible process rather than a universal law. To understand the situation, it is helpful to separate the initial condition from what happens next. Otherwise, an obvious result may be repeated as if naming it had already explained its cause.", "Blocked drains can worsen the problem, so maintenance matters alongside longer-term planning rather than serving as the only possible explanation for every flood. I would therefore look for several kinds of evidence before accepting a broad claim. Different people or settings may produ itle": "會議反覆延長", "prompt": "以「會議反覆延長」為題，第一段完成「現象／可能機制」，第二段完成「因果限制／驗證方向」。依下列原創情境示範寫作。", "en": ["Meetings often exceed their planned time when participants discuss several different questions without agreeing on which decision must be made first. This explanation identifies a possible process rather than a universal law. To understand the situation, it is helpful to separate the initial condition from what happens next. Otherwise, an obvious result may be repeated as if naming it had already explained its cause.", "A clear agenda and a summary of unresolved issues can protect focus without preventing members from raising concerns that genuinely need further discussion. I would therefore look for several kinds of evidence before accepting a broad claim. Different people or settings may produce different outcomes, even when one factor looks similar. A careful explanation remains useful precisely because it states both the connection it proposes and the limits of what is known."], "zh": ["未先決定首要決策就談多問題，會議常超時。這個解釋指出可能過程，而非普遍定律。理解時，應把起始條件與接著發生的事分開，否則可能只重述明顯結果，彷彿說出結果就已解釋原因。", "議程及未決摘要可保焦點，也不阻止真正需討論的顧慮。因此，我會先尋找幾種證據再接受廣泛主張。即使某因素看似相近，不同人或場景仍可能產生不同結果。審慎解釋有用，正因它同時說明提出的連結與已知範圍。"], "analysis": ["現象／可能機制：本篇以「未先決定首要決策就談多問題，會議常超時。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "因果限制／驗證方向：核心發展為「議程及未決摘要可保焦點，也不阻止真正需討論的顧慮。」；第二段因此不是只重複第一段，而是完成另一項寫作任務。", "關鍵內容句「A clear agenda and a summary of unresolved issues can protect focus without preventing members from raising concerns that genuinely need further discussion.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "可能原因不是已證實因果；注意替代因素及推論範圍。"], "wordCount": 136}, {"id": "M10-01", "type": 9, "title": "請求推薦書單", "prompt": "以「請求推薦書單」為題，第一段完成「身分目的／背景」，第二段完成「具體回應／禮貌收尾」。依下列原創情境示範寫作。", "en": ["Dear Reader, I am writing to ask our English teacher for reading suggestions that match my interest in science without being too difficult for independent study. I understand that you may have other responsibilities and that my message may require checking some details et me know if there is a more appropriate person or procedure for this matter. I will be happy to follow the relevant instructions and provide any necessary clarification. Thank you for taking the time to consider my message. I look forward to hearing from you when convenient. Best regards, Alex."], "zh": ["收信者您好：我代表生涯社寫信，詢問您是否願分享腳踏車技師工作。我理解您可能另有責任，回覆前也可能需要核對細節。希望知道哪些資訊有用，而非自行假定您的安排。我的目的是清楚溝通，讓下一步容易處理。", "可依店方便時間訪問、先備問題，不打擾付費顧客。若此事有更合適的人員或程序，請告知。我樂意遵循相關指示並提供必要澄清。謝謝您花時間考慮我的訊息，期待您方便時回覆。敬祝安好，Alex。"], "analysis": ["身分目的／背景：本篇以「我代表生涯社寫信，詢問您是否願分享腳踏車技師工作。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "具體回應／禮貌收尾：核心發展為「可依店方便時間訪問、先備問題，不打擾付費顧客。」；第二段因此不是只重複第一段，而是完成另一項寫作任務。", "關鍵內容句「We could visit at a time convenient for your shop and prepare questions in advance so that the conversation would not interrupt paying customers.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "信件為原創練習情境；真實考題指定姓名、對象與格式時，必須以題目為準。"], "wordCount": 150}, {"id": "M10-03", "type": 9, "title": "回覆外國筆友", "prompt": "以「回覆外國筆友」為題，第一段完成「身分目的／背景」，第二段完成「具體回應／禮貌收尾」。依下列原創情境示範寫作。", "en": ["Dear Reader, Thank you for asking about a typical school day here; I would like to describe our lunch break because it combines routine and social time. I understand that you may have other responsibilities and that my message may require checking some details before you can respond. I would appreciate knowing which information is useful rather than making assumptions about your arrangements. My aim is to communicate clearly and make the next step manageable.", "I would also enjoy hearing how students at your school spend that period, since comparing ordinary details may help us understand each other better. Please let me know if there is a more appropriate person or procedure for this matter. I will be happy to follow the relevant instructions and provide any necessary clarification. Thank you for taking the time to consider my message. I look forward to hearing from you when convenient. Best regards, Alex."], "zh": ["收信者您好：謝謝詢問典型上學日，我想 stitute. Please let me know if there is a more appropriate person or procedure for this matter. I will be happy to follow the relevant instructions and provide any necessary clarification. Thank you for taking the time to consider my message. I look forward to hearing from you when convenient. Best regards, Alex."], "zh": ["收信者您好：謝謝邀我帶週末工作坊，但既有家庭安排使我無法在該日參加。我理解您可能另有責任，回覆前也可能需要核對細節。希望知道哪些資訊有用，而非自行假定您的安排。我的目的是清楚溝通，讓下一步容易處理。", "我樂分享準備筆記或討論日後場次，但不能保證別人可代班。若此事有更合適的人員或程序，請告知。我樂意遵循相關指示並提供必要澄清。謝謝您花時間考慮我的訊息，期待您方便時回覆。敬祝安好，Alex。"], "analysis": ["身分目的／背景：本篇以「謝謝邀我帶週末工作坊，但既有家庭安排使我無法在該日參加。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "具體回應／禮貌收尾：核心發展為「我樂分享準備筆記或討論日後場次，但不能保證別人可代班。」；第二段因此不是只重複第一段，而是完成另一項寫作任務。", "關鍵內容句「I would be happy to share preparation notes or discuss a later session, although I cannot promise another person's availability as a substitute.」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "信件為原創練習情境；真實考題指定姓名、對象與格式時，必須以題目為準。"], "wordCount": 148}, {"id": "M10-09", "type": 9, "title": "向市府反映照明", "prompt": "以「向市府反映照明」為題，第一段完成「身分目的／背景」，第二段完成「具體回應／禮貌收尾」。依下列原創情境示範寫作。", "en": ["Dear Reader, I would like to draw attention to the poorly lit path between the bus stop and the public library after sunset. I understand that you may have other responsibilities and that my message may require checking some details before you can respond. I would appreciate knowing which information is useful rather than making assumptions about your arrangements. My aim is to communicate clearly and make the next step manageable.", "Could the relevant department inspect the area and explain possible improvements, taking nearby residents and the needs of evening pedestrians into account? Please let me know if there is a more appropriate person or procedure for this matter. I will be happy to follow the relevant instructions and provide any necessary clarification. Thank you for taking the time to consider my message. I look forward to hearing from you when convenient. Best regards, Alex."], "zh": ["收信者您好：  your arrangements. My aim is to communicate clearly and make the next step manageable.", "Could we first agree on equipment, staffing, and the cancellation procedure so that both groups understand what they are committing to provide? Please let me know if there is a more appropriate person or procedure for this matter. I will be happy to follow the relevant instructions and provide any necessary clarification. Thank you for taking the time to consider my message. I look forward to hearing from you when convenient. Best regards, Alex."], "zh": ["收信者您好：謝謝提議社團聯辦，想法有潛力，但確認日期前需釐清責任。我理解您可能另有責任，回覆前也可能需要核對細節。希望知道哪些資訊有用，而非自行假定您的安排。我的目的是清楚溝通，讓下一步容易處理。", "可否先約定器材人力及取消流程，讓雙方知道承諾提供什麼？若此事有更合適的人員或程序，請告知。我樂意遵循相關指示並提供必要澄清。謝謝您花時間考慮我的訊息，期待您方便時回覆。敬祝安好，Alex。"], "analysis": ["身分目的／背景：本篇以「謝謝提議社團聯辦，想法有潛力，但確認日期前需釐清責任。」建立具體內容，再說明讀者理解此情境所需的判準或背景。", "具體回應／禮貌收尾：核心發展為「可否先約定器材人力及取消流程，讓雙方知道承諾提供什麼？」；第二段因此不是只重複第一段，而是完成另一項寫作任務。", "關鍵內容句「Could we first agree on equipment, staffing, and the cancellation procedure so that both groups understand what they are committing to provide?」是兩段功能的交接重點。先辨認主詞與主要動詞，再圈出其中的條件、原因、比較或目的，檢查中文譯文是否保留相同範圍。", "信件為原創練習情境；真實考題指定姓名、對象與格式時，必須以題目為準。"], "wordCount": 148}, {"id": "M11-01", "type": 10, "title": "植物拓印工作坊", "prompt": "以「植物拓印工作坊」為題，第一段完成「活動基本資訊／目的」，第二段完成「參加方式／提醒」。依下列原創情境示範寫作。", "en": ["Our art club invites classmates to a leaf-printing workshop on Saturday morning in the covered courtyard beside the main building. The activity is intended as a welcoming opportunity to participate and learn, rather than a test of previous experience. Organizers will explain the arrangements at the beginning. Anyone uncertain about suitability or access should ask in advance so that reasonable preparations can be discussed before the day arrives.", "Participants should register with the club secretary by Thursday and bring fallen leaves rather than remove healthy plants from the school grounds. Please read the information carefully before making plans and use the stated contact arrangem
