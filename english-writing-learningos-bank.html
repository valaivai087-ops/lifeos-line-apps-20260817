<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英文作文 LearningOS｜六大能力 × 15細類</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f6fb;color:#193149;font:17px/1.75 system-ui}header{background:#142d47;color:white;padding:24px 5%}header b{font-size:26px}nav{display:flex;gap:8px;flex-wrap:wrap;padding:16px 5%;background:white;position:sticky;top:0;z-index:2}button,select,input{font:inherit;padding:10px 14px;border:1px solid #ccd7e5;border-radius:10px;background:white;color:#193149}button{cursor:pointer}button:hover,button.active{background:#dceff1}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:30px}h2{font-size:24px}.card{background:white;padding:24px;border:1px solid #d8e2ee;border-radius:18px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.note{border-left:4px solid #008a8d;background:#eaf5f5;padding:16px;margin:14px 0}.muted{color:#5e7386;font-size:15px}textarea{width:100%;min-height:230px;padding:16px;font:18px/1.8 Georgia,serif;border:1px solid #bacadb;border-radius:12px;resize:vertical}details{padding:12px 0}summary{cursor:pointer;font-weight:650}blockquote{margin:12px 0;padding:14px;background:#f3f6fa}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.badge{background:#eaf2fc;border-radius:20px;padding:4px 10px;font-size:14px}.warn{background:#fff2dc}.ok{background:#e7f3ed}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #dbe3ec;vertical-align:top}#status{padding:0 5%;color:#8c3300}@media(max-width:720px){.grid{grid-template-columns:1fr}main{padding:14px}.card{padding:17px}nav{position:static}h1{font-size:25px}}</style>
<header><b>英文作文 LearningOS</b><div>六大能力 × 15細類 × 雙段寫作 × 換題練習</div></header><nav id="nav"></nav><div id="status" role="status"></div><main id="main"></main><script>const DATA={"groups": [["切題與任務完成", [["切題與任務完成", "Describe a problem and suggest a solution.", "描述一個問題，並提出解法。", "寫得長不能代替缺少的解法。", "拆成任務清單，指出各任務在哪裡完成。"], ["中心思想與立場", "I support a quiet study area because students need a place to concentrate.", "我支持設立安靜讀書區，因為學生需要專心的場所。", "中心句應有穩定立場，不中途換成無關主題。", "用一句話寫中心，核對全文是否一致。"]]], ["內容發展與具體支持", [["內容發展與具體支持", "The room helps students. For example, those without a quiet home can study there.", "這間教室能幫助學生。例如，家裡不安靜的學生可以在那裡讀書。", "具體受益者與情境比重複稱讚更有支持力。", "每個主張補原因、細節、例子或結果。"], ["例子與主張關聯", "The rule saves time because students no longer queue twice.", "這項規定省時，因為學生不再需要排隊兩次。", "例子需支持省時，而非只描述規定顏色。", "說明例子如何支持前一句主張。"]]], ["雙段組織與段落功能", [["段落組織與功能", "Paragraph 1 describes a conflict. Paragraph 2 explains a response and its outcome.", "第一段描述衝突；第二段說明回應與結果。", "兩段應有分工，不是任意切成兩欄。", "替每段命名任務，移走放錯段的內容。"], ["文章順序與整體結構", "Problem → cause → response → result.", "問題→原因→回應→結果。", "讀者需先理解問題與必要背景，再看方案。", "先列提綱，再核對實際順序。"]]], ["句間連貫與邏輯", [["句間邏輯連接", "The bus was delayed, so we arrived late.", "公車誤點，所以我們遲到了。", "連接詞前後需真有因果，出現 so 不代表邏輯成立。", "遮住連接詞，先判斷兩句關係。"], ["指涉與語意銜接", "Mia lent a notebook to Eva. Eva returned it the next day.", "米雅借筆記本給伊娃；伊娃隔天歸還了它。", "it 指筆記本；人物多時 she 可能歧義。", "用人名或具體名詞消除歧義。"]]], ["文法句構與句子控制", [["完整句與句子邊界", "Although the rain continued, the team finished the work.", "雖然雨持續下，團隊仍完成工作。", "Although the rain continued. 單獨使用是從屬片段。", "每句找主句與限定動詞，不用標點數代替判斷。"], ["時態語態與一致", "Yesterday, the students were invited to a workshop.", "昨天，學生受邀參加工作坊。", "過去、複數受事搭配 were invited。", "統一時間線，核對主被動及一致。"], ["子句與句型控制", "The student who organized the event thanked the volunteers.", "籌辦活動的學生感謝志工。", "who 子句修飾 student；主句動詞是 thanked。", "圈出主句骨架，避免只有子句沒有主句。"]]], ["字彙拼字與書寫校訂", [["精準用字與搭配", "The team made a decision after discussing the options.", "團隊討論各選項後做出決定。", "make a decision 是自然搭配；難字多不等於精準。", "先核對意思，再核對自然詞塊。"], ["詞彙變化與重複", "The policy reduces waste. This measure may also lower costs.", "政策減少浪費；這項措施也可能降低成本。", "同義承接不能為求變化而改變原意。", "必要關鍵詞可重複，意思等值才換詞。"], ["拼字與詞形", "Their advice was useful, so I followed it.", "他們的建議很有用，所以我採納了。", "advice 是名詞；advise 是動詞。", "核對詞性、詞形與拼字。"], ["大小寫標點與全文校訂", "After lunch, we visited Tainan. The trip changed my view.", "午餐後我們造訪臺南。這趟旅程改變了我的看法。", "檢查每一句，不只段落首尾；還要讀全文意思。", "先校訂書寫，再查任務、時間與立場一致。"]]]], "topics": [["校園安靜讀書區", "Describe a difficulty students face when studying at school. Then propose a quiet study area and explain how it would help.", "第一段描述在校讀書的困難與具體情境；第二段提議安靜讀書區，說明做法與幫助。", ["study", "school", "quiet", "student"], ["propose", "could", "should", "suggest"]], ["減少午餐浪費", "Describe food waste at school. Then suggest a practical way to reduce it and explain a possible difficulty.", "第一段描述校園午餐浪費與原因；第二段提出可行方案並說明可能困難。", ["food", "waste", "lunch"], ["reduce", "could", "should", "suggest"]], ["手機與專注", "Describe a situation in which phones distracted students. Then propose a balanced classroom rule and explain its benefits.", "第一段描述手機造成分心的情境；第二段提出兼顧需求的規則並說明好處。", ["phone", "distract", "class"], ["rule", "could", "should", "benefit"]], ["社區步行安全", "Describe a safety problem on a route you know. Then suggest an improvement and explain whom it would help.", "第一段描述熟悉路線的安全問題；第二段提出改善方式與受益者。", ["road", "street", "walk", "safe"], ["improve", "could", "should", "help"]], ["團隊意見不同", "Describe a disagreement in a group project. Then explain how the group responded and what you learned.", "第一段描述分組意見不同的情境；第二段說明回應方式與學到的事。", ["group", "team", "project"], ["learn", "respond", "listen", "discuss"]], ["一次計畫改變", "Describe an unexpected change to a plan. Then explain your response and what you would do differently next time.", "第一段描述計畫遇到的意外變化；第二段說明應對方式及下次的改進。", ["plan", "change", "unexpected"], ["next", "learn", "respond", "would"]], ["圖書館新用途", "Describe a need in your community. Then explain how a library could help meet it with a new service.", "第一段描述社區需求；第二段說明圖書館可提供何種新服務與具體幫助。", ["community", "need", "library"], ["service", "could", "help", "provide"]], ["活動參與不足", "Describe why some students avoid school events. Then propose an inclusive activity and explain how to organize it.", "第一段描述部分學生不參加活動的原因；第二段提出包容性的活動及辦理步驟。", ["student", "event", "activity"], ["organize", "could", "include", "step"]], ["網路資訊判讀", "Describe a time when online information seemed doubtful. Then explain how you would check it before sharing.", "第一段描述可疑網路資訊情境；第二段說明分享前的查證步驟與理由。", ["online", "information", "news"], ["check", "source", "compare", "verify"]], ["修理或換新", "Describe an item that stopped working. Then explain whether you would repair or replace it and give reasons.", "第一段描述故障物品與影響；第二段選擇修理或換新並說明理由。", ["item", "broken", "work"], ["repair", "replace", "because", "reason"]], ["互助學習", "Describe a subject or skill that students find difficult. Then propose a peer-learning plan with a specific example.", "第一段描述學生感到困難的科目或能力；第二段提出同儕互助計畫與具體例子。", ["student", "skill", "difficult"], ["peer", "help", "example", "plan"]], ["公共空間共享", "Describe a conflict over a shared space. Then suggest a fair arrangement and explain why it would work.", "第一段描述公共空間的使用衝突；第二段提出公平安排並說明可行理由。", ["space", "share", "conflict"], ["fair", "rule", "arrange", "because"]]], "tips": [["0", "任務拆解", "先把題目中的動詞圈出，逐項安排段落位置。", "Describe a problem and propose a solution.", "描述問題並提出解法。", "只描述問題，即使篇幅長也未完成解法任務。"], ["0", "一句話立場", "先用一句明確主張固定全文方向。", "I support a quiet study area because students need a place to concentrate.", "我支持安靜讀書區，因為學生需要專心的場所。", "不要寫到一半轉成不相關的運動設施。"], ["0", "限制核對", "把對象、情境、時間與指定段落任務列成清單。", "The proposal is intended for students who stay after school.", "這項提案針對放學後留校的學生。", "不要把指定學生群體改成所有市民。"], ["0", "結尾回應題目", "收尾交代立場或回應，不新增未發展的大主題。", "For these reasons, the school should test the plan for one month.", "基於這些理由，學校應試行計畫一個月。", "避免結尾突然轉談科技改變世界。"], ["1", "主張加原因", "每個主張後回答「為什麼」。", "The room would be useful because some students have no quiet place at home.", "這個空間很有用，因為部分學生家裡沒有安靜的地方。", "不要只換字重複「很好、很棒」。"], ["1", "具體情境", "加入人物、行動與場景，讓例子能被想像。", "After practice, Lin could review her notes there while waiting for her bus.", "練習結束後，林可以在那裡邊等公車邊複習筆記。", "不要只寫 everyone can benefit 而沒有細節。"], ["1", "例子接回主張", "例子後說明它支持了哪個理由。", "This would turn waiting time into useful study time.", "這能把等待時間變成有用的讀書時間。", "不要留下與主張無關的故事。"], ["1", "方案可執行", "說清楚誰、何時、做什麼及需要的資源。", "Two volunteers could open the room from four to five each afternoon.", "兩名志工可以每天下午四點到五點開放教室。", "「學校應改善」太抽象，沒有行動內容。"], ["2", "兩段分工", "依題目任務分配內容，不用字數平均代替組織。", "The first paragraph explains the problem; the second presents a response.", "第一段說明問題；第二段提出回應。", "不是把同一段從中間切開。"], ["2", "段落中心句", "每段先建立核心，再放細節支持。", "The main difficulty is the lack of a quiet place after school.", "主要困難是放學後缺乏安靜的場所。", "細節很多卻沒有共同焦點。"], ["2", "合理發展順序", "依背景、問題、回應與結果安排讀者所需資訊。", "Once the problem became clear, we discussed possible solutions.", "問題明確後，我們討論可能的解法。", "不要先寫結果再補大量未交代的背景。"], ["2", "段間接續", "第二段承接第一段指出的需求。", "To address this problem, I suggest opening an unused classroom.", "為了處理這個問題，我建議開放一間閒置教室。", "解法必須對應前段真正的問題。"], ["3", "先判關係再選連詞", "先確認是因果、對比或補充，再決定連接詞。", "The room was small, but it was quiet enough for reading.", "教室很小，但夠安靜，適合閱讀。", "不要用 therefore 連接其實沒有因果的兩句。"], ["3", "代詞找回指", "每個 it、they、this 都要能找回明確對象。", "The school opened a study room. This space soon became popular.", "學校開放了一間讀書室；這個空間很快受到歡迎。", "多個名詞並列後只寫 it 容易不清楚。"], ["3", "必要重複", "關鍵名詞可重複；同義詞必須維持原意。", "The policy reduces waste. This measure also saves money.", "這項政策減少浪費，也能省錢。", "不能為避免重複，把 policy 換成意思不同的詞。"], ["3", "保留合理程度", "沒有充分證據時，用 may、can 或 some 限定範圍。", "The change may help some students manage their time better.", "這個改變可能幫助部分學生更好地安排時間。", "不要輕易寫所有人一定受益。"], ["4", "主句先成立", "先找主詞與主要動詞，再加入子句。", "The students who joined the project learned to cooperate.", "參與計畫的學生學會合作。", "不要只有 who joined the project 而沒有主句。"], ["4", "修補片段句", "although、because 等從屬子句需與主句連接。", "Although we disagreed at first, we eventually reached an agreement.", "雖然一開始意見不同，我們最後仍達成協議。", "Although we disagreed at first. 單獨使用是片段。"], ["4", "句子邊界", "兩個獨立句要用句號、分號或適當連接方式。", "The bus was late, so we walked to school.", "公車誤點，所以我們走路上學。", "不要只用逗號接 The bus was late, we walked to school。"], ["4", "時間線一致", "敘事先定時間，回顧經驗與現在想法可有意切換時態。", "Last year, I joined the team. Now, I understand the value of cooperation.", "去年我加入團隊；現在我理解合作的價值。", "不要無理由在同一事件中任意切換時態。"], ["4", "主被動與一致", "辨認誰做動作、誰接受動作，並核對主詞單複數。", "The students were invited to share their ideas.", "學生受邀分享想法。", "複數主詞不能套用 was invited。"], ["4", "平行結構", "並列的動作保持相同形式。", "The activity helps students communicate, cooperate, and solve problems.", "活動幫助學生溝通、合作及解決問題。", "避免 communicate、cooperating、to solve 任意混用。"], ["5", "搭配整組記", "記核心字與後接名詞或介系詞，不逐字翻中文。", "We made a decision after discussing the options.", "我們討論選項後做出決定。", "不是 do a decision，也不是 discuss about the options。"], ["5", "字族依位置選", "先判需要的詞性，再選形式。", "The activity was successful, and the team worked successfully together.", "活動很成功，團隊也順利合作。", "不要把 success 直接當作形容詞使用。"], ["5", "清楚優先", "用熟悉而精準的字表達意思，避免勉強塞入難字。", "The plan is practical because it uses a room the school already has.", "計畫可行，因為使用的是學校已有的教室。", "華麗字彙不能代替清楚理由。"], ["5", "逐句校訂", "每句核對大寫、標點、拼字及主詞動詞。", "After lunch, we visited Tainan. The trip changed my view.", "午餐後我們造訪臺南；這趟旅行改變我的看法。", "只檢查整段首尾會漏掉中間句子的錯誤。"], ["5", "分輪檢查", "先查任務與內容，再查組織，最後查語言形式。", "First, check the message. Then, check the wording.", "先檢查傳達的內容，再檢查措辭。", "不要只修拼字卻漏掉整段未完成題目任務。"]], "bank": [["金句句型", "0", "What matters most is ...", "最重要的是……", "提出核心立場", "What matters most is whether the plan meets students' needs.", "最重要的是計畫是否符合學生需求。", "後接名詞或名詞子句；需說明判準。"], ["金句句型", "0", "Rather than ..., we should ...", "與其……，我們應該……", "比較兩種行動", "Rather than blame others, we should discuss possible solutions.", "與其責怪別人，我們應討論可能的解法。", "兩端要對應同一問題，不能只喊口號。"], ["金句句型", "0", "From my perspective, ...", "依我的觀點……", "清楚表明立場", "From my perspective, a fair rule should consider different needs.", "依我的觀點，公平規則應考量不同需求。", "表達立場後仍要補理由。"], ["金句句型", "0", "The real challenge is not ... but ...", "真正的挑戰不是……而是……", "聚焦問題核心", "The real challenge is not finding ideas but putting them into practice.", "真正的挑戰不是找到點子，而是付諸實行。", "兩端保持平行結構，不可任意否定實際困難。"], ["金句句型", "1", "A small change can ...", "小改變可以……", "引入可行方案", "A small change can make our daily routine more efficient.", "小改變可以讓日常流程更有效率。", "後文要交代改變內容及作用機制。"], ["金句句型", "1", "This is especially important for ...", "這對……尤其重要", "指出受益對象", "This is especially important for students who lack a quiet place at home.", "這對家中缺乏安靜場所的學生尤其重要。", "不要只寫 everyone 而缺少具體情境。"], ["金句句型", "1", "By doing so, ...", "這麼做便能……", "解釋行動效果", "By doing so, we can reduce waste without increasing costs.", "這麼做便能減少浪費而不增加成本。", "so 必須指向清楚的前述行動；效果需合理。"], ["金句句型", "1", "Without ..., ... would ...", "若沒有……，……就會……", "說明某條件的價值", "Without clear instructions, new volunteers would feel lost.", "若沒有清楚指示，新志工會不知所措。", "假設語氣應與敘事時間一致。"], ["金句句型", "2", "To address this problem, ...", "為了處理這個問題……", "由問題段轉入解法段", "To address this problem, the school could open an unused classroom.", "為了處理這個問題，學校可以開放閒置教室。", "解法必須回應上一段的問題。"], ["金句句型", "2", "The experience taught me that ...", "這段經驗讓我學到……", "經驗作文收束", "The experience taught me that asking for help is part of learning.", "這段經驗讓我學到，求助也是學習的一部分。", "不要加入前文沒有支持的感悟。"], ["金句句型", "2", "Looking back, I realize that ...", "回顧過去，我明白……", "由事件轉入反思", "Looking back, I realize that listening mattered more than winning the argument.", "回顧過去，我明白傾聽比爭論獲勝更重要。", "回顧事件與現在理解可有意切換時態。"], ["金句句型", "2", "The next step is to ...", "下一步是……", "安排方案次序", "The next step is to invite students to test the new system.", "下一步是邀請學生試用新系統。", "需先交代前一步，避免順序跳躍。"], ["金句句型", "3", "Although ... , ...", "雖然……，但是……", "承認限制後提出主張", "Although the plan requires effort, it may save time later.", "雖然計畫需要投入心力，但之後可能省時。", "although 子句後需主句，不再加 but。"], ["金句句型", "3", "This does not mean that ...", "這不代表……", "避免讀者過度推論", "This does not mean that every student must follow the same routine.", "這不代表每個學生都必須遵循相同作息。", "this 要有明確前文，不能反覆否定而沒立場。"], ["金句句型", "3", "Only when ... can we ...", "只有當……，我們才能……", "強調必要條件", "Only when we understand the problem can we choose a suitable solution.", "只有理解問題，我們才能選擇合適解法。", "句首限制語引起主句倒裝：can we。"], ["金句句型", "3", "Even if ... , ...", "即使……，也……", "假設讓步", "Even if the first attempt fails, we can learn from it.", "即使第一次嘗試失敗，我們也能從中學習。", "even if 不表示事情已經發生。"], ["片語搭配", "1", "make a difference", "造成改變／發揮影響", "具體說明改善", "A clear sign can make a difference to first-time visitors.", "清楚的標示能幫助初次到訪的人。", "說清楚對誰有何影響，不只用抽象稱讚。"], ["片語搭配", "1", "put ... into practice", "將……付諸實行", "從想法走向行動", "We put our recycling plan into practice last month.", "我們上個月實行了回收計畫。", "practice 此處是名詞，不是 practise 的動詞位置。"], ["片語搭配", "1", "take practical steps to", "採取實際步驟來……", "寫可執行解法", "We should take practical steps to reduce food waste.", "我們應採取實際步驟減少食物浪費。", "後面仍需列出實際步驟。"], ["片語搭配", "1", "provide ... with ...", "提供某人某物", "寫資源支持", "The school provided volunteers with basic training.", "學校提供志工基礎訓練。", "人放在 provide 後，資源接 with。"], ["片語搭配", "3", "take ... into account", "將……納入考量", "承認不同條件", "The rule should take students' travel time into account.", "規則應將學生通勤時間納入考量。", "不是 take account 某事的逐字拼接。"], ["片語搭配", "3", "strike a balance between", "在……之間取得平衡", "比較需求", "We need to strike a balance between convenience and privacy.", "我們需要在便利與隱私之間取得平衡。", "between 後要有兩個可比較的面向。"], ["片語搭配", "3", "at the expense of", "以犧牲……為代價", "說明取捨", "Convenience should not come at the expense of safety.", "便利不應以犧牲安全為代價。", "通常帶負面取捨含意，不當作單純增加。"], ["片語搭配", "3", "in the long run", "長期而言", "比較短期與長期", "Regular maintenance saves money in the long run.", "定期維護長期而言可以省錢。", "需要合理時間尺度，不能當作萬用結尾。"], ["片語搭配", "4", "be willing to", "願意做……", "人物態度與行動", "She was willing to listen to a different opinion.", "她願意聆聽不同意見。", "to 後接原形動詞。"], ["片語搭配", "4", "have difficulty V-ing", "做某事有困難", "描述問題", "Some students have difficulty finding reliable information.", "有些學生難以找到可靠資訊。", "不是 have difficulty to find。"], ["片語搭配", "4", "enable someone to V", "使某人能夠……", "解釋工具或方案效果", "The checklist enables writers to review their work systematically.", "檢查表讓寫作者能有系統地檢視作品。", "不可漏掉人或 to。"], ["片語搭配", "4", "learn from a mistake", "從錯誤學習", "經驗反思", "I learned from my mistake and prepared a backup plan.", "我從錯誤中學習，並準備備案。", "需交代錯誤與後續行動的連結。"], ["片語搭配", "5", "raise awareness of", "提升對……的認識", "宣導活動", "The campaign raised awareness of water conservation.", "活動提升了人們對節水的認識。", "awareness 通常不可數，搭配 of。"], ["片語搭配", "5", "reach an agreement", "達成協議", "合作與衝突", "After listening to each other, we reached an agreement.", "彼此傾聽後，我們達成協議。", "reach 直接接 agreement，不加 to。"], ["片語搭配", "5", "take responsibility for", "為……負責", "人物成長", "I took responsibility for correcting the error.", "我負起更正錯誤的責任。", "for 後接名詞或動名詞。"], ["片語搭配", "5", "devote time to V-ing", "投入時間做……", "努力與準備", "We devoted time to practicing our presentation.", "我們投入時間練習簡報。", "to 是介系詞，後接動名詞。"], ["主題字庫", "0", "feasible / practical", "可行的／實用的", "評估方案", "The idea is feasible because it uses existing resources.", "這個想法可行，因為它運用現有資源。", "不是所有好點子都在資源限制下可行。"], ["主題字庫", "0", "priority / urgent", "優先事項／緊急的", "排列問題重要性", "Safety should be our first priority.", "安全應是我們最優先的事項。", "priority 是名詞，urgent 是形容詞。"], ["主題字庫", "1", "accessible / inclusive", "容易取得或使用的／包容的", "公共服務與教育", "An accessible website helps create a more inclusive service.", "容易使用的網站有助於建立更包容的服務。", "不要只用形容詞，補具體措施。"], ["主題字庫", "1", "resource / constraint", "資源／限制", "計畫可行性", "Limited resources forced us to simplify the plan.", "有限資源迫使我們簡化計畫。", "resource 可數；constraints 可指時間或預算限制。"], ["主題字庫", "1", "initiative / participation", "倡議或主動性／參與", "校園活動", "The initiative encouraged participation from quieter students.", "這項倡議鼓勵較安靜的學生參與。", "participation 通常不可數，不直接當作人。"], ["主題字庫", "2", "setback / adjustment", "挫折／調整", "敘事轉折", "After the setback, we made an adjustment to our schedule.", "遭遇挫折後，我們調整了時程。", "具體說明挫折與調整，而非只有抽象名詞。"], ["主題字庫", "2", "insight / perspective", "領悟／觀點", "經驗反思", "The conversation gave me a new perspective on teamwork.", "談話讓我對團隊合作有了新觀點。", "觀點改變要能回扣故事。"], ["主題字庫", "3", "consequence / trade-off", "後果／取捨", "方案評估", "The decision involves a trade-off between speed and accuracy.", "這項決定涉及速度與準確度的取捨。", "consequence 可正可負；不要固定翻成懲罰。"], ["主題字庫", "3", "evidence / assumption", "證據／假設", "合理論述", "We should check the evidence rather than rely on assumptions.", "我們應查核證據，而非依賴假設。", "evidence 通常不可數，不能寫 an evidence。"], ["主題字庫", "3", "respectful / considerate", "尊重人的／體貼的", "人際互動", "A respectful discussion allows everyone to explain their concerns.", "相互尊重的討論讓每個人能說明自己的顧慮。", "respectful 不等於 respectable「值得尊敬的」。"], ["主題字庫", "4", "respond / response", "回應（動詞／名詞）", "行動與反應", "Her calm response helped us respond more thoughtfully.", "她冷靜的回應幫助我們更周全地應對。", "不能把 response 放在需要動詞的位置。"], ["主題字庫", "4", "confidence / confident", "信心／有信心的", "人物成長", "Practice gave me confidence, and I became more confident.", "練習給了我信心，我也變得更有自信。", "become 後描述狀態常接 confident。"], ["主題字庫", "4", "cooperate / cooperation", "合作（動詞／名詞）", "團隊題材", "Cooperation improves when people are willing to cooperate.", "當人們願意合作時，合作情況會改善。", "cooperate 常搭配 with 人，不直接接受詞人。"], ["主題字庫", "5", "effective / efficient", "有效的／有效率的", "評估方法", "The method was effective but required too much time to be efficient.", "方法有效，但耗時過多，效率不佳。", "達成效果與節省資源是不同判準。"], ["主題字庫", "5", "reliable / responsible", "可靠的／負責任的", "描述人物或資訊", "A responsible writer checks whether a source is reliable.", "負責任的寫作者會查核來源是否可靠。", "可靠不等於擔負責任，不隨意互換。"], ["主題字庫", "5", "sustainable / temporary", "可持續的／暫時的", "環境及長期方案", "We need a sustainable solution rather than a temporary fix.", "我們需要可持續的解法，而非暫時補救。", "sustainable 不只指環保，也可指能長期維持。"]]};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),KEY='WritingLearningOS_v1';let S={drafts:{},events:[]},page='home',topic=0,phase='practice',target=null,round='',currentResult=null;

const limits='本工具只檢查形式與文字線索，不判斷內容品質、邏輯成立、文法正確或拼字正確。所有新作文均待老師複核；線索符合比例不是作文分數或能力掌握率。';

function go(v){page=v;render();scrollTo(0,0)}function render(){const nav=[['home','學習首頁'],['learn','六能力／15細類'],['topics','作文題庫'],['write','雙段寫作'],['tips','作文秘笈 BANK'],['bank','金句／片語／字庫'],['guide','檢查說明']];$('nav').innerHTML=nav.map(([k,v])=>`<button data-go="${k}" class="${page===k?'active':''}">${v}</button>`).join('');$('main').innerHTML=({home,learn,topics,write,tips,bank,guide,result:resultView}[page]||home)();bind()}
function home(){return `<section class="card"><h1>先完成任務，再用證據修訂作文</h1><div class="note"><b>作文 BANK 擴充版</b><p>16個金句句型＋16組實用片語＋16組主題字詞；另有27筆寫作秘笈。</p><div class="row"><button data-go="bank">開啟48筆金句／片語／字庫</button><button data-go="tips">開啟27筆作文秘笈</button></div></div><p>拆解題目 → 規劃兩段 → 完成草稿 → 檢查線索 → 對照細類教學 → 換題練習。</p><div class="row"><span class="badge">6大能力</span><span class="badge">15個細類</span><span class="badge">12道原創雙段題</span></div><div class="note">${limits}</div><button data-go="topics">選擇寫作題目</button></section><div class="grid">${DATA.groups.map((g,i)=>`<section class="card"><h2>${i+1}. ${g[0]}</h2><p>${g[1].length}個細類，含中英示例、判斷說明與修訂動作。</p><button data-learn="${i}">查看教學</button><button data-probe="${i}">本能力独立新任務</button></section>`).join('')}</div>`}
function learn(){return `<h1>六能力／15細類學習目錄</h1><p>以下是原創教學示例，不是新題考試。目錄歸屬不是唯一錯因；不把舊紀錄直接判成細類。</p>${DATA.groups.map((g,i)=>`<section class="card" id="group${i}"><h2>${g[0]}｜${g[1].length}細類</h2>${g[1].map(t=>`<details open><summary>${t[0]}</summary><blockquote>${esc(t[1])}<br>${t[2]}</blockquote><p><b>判斷與中文說明：</b>${t[3]}</p><div class="note"><b>現在練什麼：</b>${t[4]}</div></details>`).join('')}<button data-probe="${i}">用不同題目練這項能力</button></section>`).join('')}`}
function topics(){return `<h1>原創作文題庫｜12題</h1><p>每題包含兩段任務。前6題可作一般練習；後6題同時作各能力的一次獨立新任務。一般練習可重寫，新任務須使用未開啟過的題目。</p><div class="grid">${DATA.topics.map((t,i)=>`<article class="card"><span class="badge">W${String(i+1).padStart(2,'0')}</span><h2>${t[0]}</h2><p>${t[1]}</p><p>${t[2]}</p><button data-topic="${i}">開始寫作</button></article>`).join('')}</div>`}
function dk(){return topic+'|'+phase+'|'+(target??'')+'|'+round}function draft(){return S.drafts[dk()]||(S.drafts[dk()]={p1:'',p2:'',plan:'',topic,phase,target,round})}
function openTopic(i){topic=i;phase='practice';target=null;round='';draft();save();go('write')}
function probe(i){const t=i+6,used=Object.values(S.drafts).some(d=>d.topic===t&&d.phase!=='newtask')||S.events.some(e=>e.topic===t);if(used){alert('此能力的新任務已開啟或已使用，不再列為獨立新任務。你仍可到題庫一般練習。');return}topic=t;phase='newtask';target=i;round='';draft();save();go('write')}
function words(s){return s.match(/[A-Za-z]+(?:['’-][A-Za-z]+)*/g)||[]}
function write(){const t=DATA.topics[topic],d=draft();return `<h1>${t[0]}</h1><p><span class="badge">${phase==='newtask'?'獨立新任務':phase==='revision'?'同輪修訂':'一般練習'}</span> ${target!==null?DATA.groups[target][0]:''}</p><section class="card"><p>${t[1]}</p><p>${t[2]}</p><label>任務清單與兩段提綱<textarea id="plan" style="min-height:100px;font-family:inherit" placeholder="第一段要完成什麼？第二段要完成什麼？">${esc(d.plan)}</textarea></label></section><div class="grid"><section class="card"><label for="p1">第一段</label><textarea id="p1" spellcheck="true">${esc(d.p1)}</textarea><p id="n1"></p></section><section class="card"><label for="p2">第二段</label><textarea id="p2" spellcheck="true">${esc(d.p2)}</textarea><p id="n2"></p></section></div><div class="note">${limits} 瀏覽器拼字提示與本工具的線索檢查分開，並非自動評閱。</div><button id="submit">保存本次作文並查看線索</button>`}
function checks(d){const t=DATA.topics[d.topic],all=d.p1+' '+d.p2,ws=words(all),low=all.toLowerCase(),has=(a,s=low)=>a.filter(w=>new RegExp('\\b'+w+'\\b','i').test(s)),support=['because','example','instance','therefore','result'],links=['however','because','therefore','although','instead','moreover'],clauses=['although','because','while','which','who','if'];const fragments=all.split(/[.!?]+/).filter(s=>words(s).length).length,unique=new Set(ws.filter(w=>w.length>=4).map(w=>w.toLowerCase())).size;return [
{ok:ws.length>=80&&has(t[3]).length>0&&has(t[4]).length>0,e:`總字數 ${ws.length}；題目詞群 ${has(t[3]).join(', ')||'未找到'}；任務詞群 ${has(t[4]).join(', ')||'未找到'}`,rule:'80字及兩組預設任務詞群；不判斷切題與任務真正完成。'},
{ok:words(d.p1).length>=40&&words(d.p2).length>=40&&has(support).length>0,e:`第一段 ${words(d.p1).length}字；第二段 ${words(d.p2).length}字；支持語詞 ${has(support).join(', ')||'未找到'}`,rule:'每段40字及預設支持語詞；不判斷例子合理充分。'},
{ok:!!d.p1.trim()&&!!d.p2.trim(),e:`第一段${d.p1.trim()?'有':'無'}文字；第二段${d.p2.trim()?'有':'無'}文字`,rule:'只確認兩欄有文字，不判斷段落分工。'},
{ok:has(links).length>=2,e:`連接詞種類 ${has(links).length}：${has(links).join(', ')||'未找到'}`,rule:'至少2種預設連接詞；不判定邏輯與代詞指向。'},
{ok:fragments>=7&&has(clauses).length>0,e:`標點分段片段 ${fragments}；子句標記 ${has(clauses).join(', ')||'未找到'}`,rule:'7個片段及子句標記；不等於7個完整正確句子。'},
{ok:unique>=45&&[d.p1,d.p2].every(s=>/^[A-Z]/.test(s.trim())&&/[.!?]["']?$/.test(s.trim())),e:`至少4字元的不同英文詞 ${unique}；段首大寫與段末標點${[d.p1,d.p2].every(s=>/^[A-Z]/.test(s.trim())&&/[.!?]["']?$/.test(s.trim()))?'符合':'待檢查'}`,rule:'45個不同字及段落首尾；不检查拼字、精準用字與每句標點。'}]}
function submit(){const d=draft();if(!d.p1.trim()&&!d.p2.trim())return alert('請先輸入作文。');const e={id:crypto.randomUUID(),date:new Date().toISOString(),...structuredClone(d),checks:checks(d),review:'待老師複核'};S.events.push(e);if(phase==='newtask')delete S.drafts[dk()];save();currentResult=e;go('result')}
function resultView(){const e=currentResult;if(!e)return '<p>尚未選擇紀錄。</p>';return `<h1>作文線索檢查｜待老師複核</h1><p>${DATA.topics[e.topic][0]} · ${new Date(e.date).toLocaleString('zh-TW')}</p><div class="note">${limits} 以下每項均保留證據；沒有自動「通過作文」判定。</div><div class="grid">${e.checks.map((c,i)=>`<article class="card"><h2>${DATA.groups[i][0]}</h2><span class="badge ${c.ok?'ok':'warn'}">${c.ok?'形式線索符合':'未符合提醒門檻'}</span><p>${esc(c.e)}</p><p class="muted">${c.rule}</p><button data-learn="${i}">查看細類與修訂方法</button><button data-probe="${i}">獨立新任務</button></article>`).join('')}</div><section class="card"><h2>本次原文快照</h2><p style="white-space:pre-wrap">${esc(e.p1)}</p><p style="white-space:pre-wrap">${esc(e.p2)}</p><button id="revise">保留原稿並開始同輪修訂</button></section>`}
function guide(){return `<section class="card"><h1>檢查與學習紀錄使用說明</h1><p>${limits}</p><h2>六項檢查的實際範圍</h2>${checks({p1:'',p2:'',topic:0}).map((c,i)=>`<p><b>${DATA.groups[i][0]}：</b>${c.rule}</p>`).join('')}<h2>如何判讀</h2><ol><li>先查看未符合提醒門檻的項目。</li><li>回到原稿、題目與具體線索核對。</li><li>利用15細類目錄修訂，再嘗試不同題目。</li></ol><div class="note">40字／段、7個片段、45個不同字等皆為本APP提醒門檻，不是學測評分標準。合理同義表達可能未命中詞群；命中詞群也不代表切題。未符合不等於能力不足，符合不等於作文合格。</div><p>每項能力目前一份獨立新任務（後6題）；用過即停用，不是每個細類都有新題庫。一般重寫仍可使用。所有新作文只列待老師複核，沒有線上核准按鈕或自動通過率。</p><p>「尚待確認」代表證據不足，不自動指定個人錯因。本APP只匯入相同結構的備份，不擅自轉換其他系統舊資料。</p></section>`}
let tipFilter={q:'',group:''};
function tips(){return `<section class="card"><h1>英文作文秘笈 BANK</h1><p>27筆實用技巧，涵蓋六大能力。例句為教學示例，需依題意改寫。</p><div class="row"><input id="tipSearch" placeholder="搜尋技巧、句型或常見錯法" aria-label="搜尋秘笈"><select id="tipGroup" aria-label="能力分類"><option value="">全部六能力</option>${DATA.groups.map((g,i)=>`<option value="${i}">${g[0]}</option>`).join('')}</select></div><p id="tipCount"></p><div style="overflow:auto"><table style="min-width:720px"><thead><tr><th>能力／秘笈</th><th>作法</th><th>中英例句</th><th>常見錯法</th></tr></thead><tbody id="tipRows"></tbody></table></div></section>`}
function drawTips(){const rows=DATA.tips.filter(t=>(tipFilter.group===''||t[0]===tipFilter.group)&&t.join(' ').toLowerCase().includes(tipFilter.q.toLowerCase()));$('tipCount').textContent=`符合 ${rows.length}／${DATA.tips.length} 筆`;$('tipRows').innerHTML=rows.map(t=>`<tr><td><span class="badge">${DATA.groups[+t[0]][0]}</span><br><b>${t[1]}</b></td><td>${t[2]}</td><td>${esc(t[3])}<br>${t[4]}</td><td>${t[5]}</td></tr>`).join('')||'<tr><td colspan="4">沒有符合的秘笈。</td></tr>'}
let bankFilter={q:'',kind:'',group:''};
function bank(){return `<section class="card"><h1>作文金句／片語／字庫 BANK</h1><p>48筆原創教學用語：16個金句句型、16組片語、16組主題字詞。不是名人引言；請依題意與自己的經驗改寫，避免整句硬套。</p><div class="row"><input id="bankQ" aria-label="搜尋用語" placeholder="搜尋英文、中文、情境或錯法"><select id="bankKind" aria-label="用語類型"><option value="">全部類型</option><option>金句句型</option><option>片語搭配</option><option>主題字庫</option></select><select id="bankGroup" aria-label="六大能力"><option value="">全部六能力</option>${DATA.groups.map((g,i)=>`<option value="${i}">${g[0]}</option>`).join('')}</select><button id="bankReset">清除篩選</button></div><p id="bankTotal"></p><div style="overflow:auto"><table style="min-width:760px"><thead><tr><th>類型／能力</th><th>核心用語</th><th>情境與中英例句</th><th>使用提醒</th></tr></thead><tbody id="bankRows"></tbody></table></div></section>`}
function drawBank(){const rows=DATA.bank.filter(t=>(!bankFilter.kind||t[0]===bankFilter.kind)&&(bankFilter.group===''||t[1]===bankFilter.group)&&t.join(' ').toLowerCase().includes(bankFilter.q.toLowerCase()));$('bankTotal').textContent=`顯示 ${rows.length}／${DATA.bank.length} 筆｜一頁完整表格`;$('bankRows').innerHTML=rows.map(t=>`<tr><td>${t[0]}<br><span class="badge">${DATA.groups[+t[1]][0]}</span></td><td><b>${esc(t[2])}</b><br>${t[3]}</td><td><b>${t[4]}</b><blockquote>${esc(t[5])}<br>${t[6]}</blockquote></td><td>${t[7]}</td></tr>`).join('')||'<tr><td colspan="4">沒有符合的用語。</td></tr>'}
function bind(){if(page==='bank'){for(const[id,k]of [['bankQ','q'],['bankKind','kind'],['bankGroup','group']]){$(id).value=bankFilter[k];$(id).addEventListener(k==='q'?'input':'change',e=>{bankFilter[k]=e.target.value;drawBank()})}$('bankReset').onclick=()=>{bankFilter={q:'',kind:'',group:''};render()};drawBank()}if(page==='tips'){$('tipSearch').value=tipFilter.q;$('tipGroup').value=tipFilter.group;drawTips();$('tipSearch').oninput=e=>{tipFilter.q=e.target.value;drawTips()};$('tipGroup').onchange=e=>{tipFilter.group=e.target.value;drawTips()}}if(page==='write'){for(const k of ['p1','p2','plan'])$(k).oninput=()=>{draft()[k]=$(k).value;save();counts()};function counts(){$('n1').textContent=words(draft().p1).length+'字';$('n2').textContent=words(draft().p2).length+'字'}counts();$('submit').onclick=submit}if(page==='result')$('revise').onclick=()=>{const e=currentResult;topic=e.topic;phase='revision';target=e.target;round=e.id;S.drafts[dk()]={p1:e.p1,p2:e.p2,plan:e.plan,topic,phase,target,round};save();go('write')};}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go)go(b.dataset.go);if(b.dataset.topic!==undefined)openTopic(+b.dataset.topic);if(b.dataset.probe!==undefined)probe(+b.dataset.probe);if(b.dataset.learn!==undefined){go('learn');$('group'+b.dataset.learn).scrollIntoView()}if(b.dataset.event){currentResult=S.events.find(e=>e.id===b.dataset.event);go('result')}});render();
</script></html>
